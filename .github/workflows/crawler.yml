name: info-bot crawler

on:
  schedule:
    # 北京时间每天 08:00 跑一次（UTC 00:00）。
    # GitHub Actions 的 schedule 可能有几分钟延迟，属于正常现象。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑模式，不真实推送"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: info-bot-crawler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m src.main

      - name: Commit state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(state): update seen.json [skip ci]"
          file_pattern: "state/seen.json"
          commit_user_name: info-bot
          commit_user_email: info-bot@users.noreply.github.com
