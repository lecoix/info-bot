name: info-bot crawler

on:
  schedule:
    # 北京时间每天 08:00 跑一次（UTC 00:00）。
    # GitHub Actions 的 schedule 可能有几分钟延迟，属于正常现象。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑模式，不真实推送"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: info-bot-crawler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能可靠地向同一分支 push（默认 shallow 有时会导致奇怪行为）
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m src.main

      - name: Verify dashboard files were written
        run: |
          test -f docs/items.json
          test -f docs/index.html
          python - << 'PY'
          import json
          from pathlib import Path
          p = Path("docs/items.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("updated_at"), "docs/items.json missing updated_at — dashboard did not run correctly"
          print("dashboard ok:", data["updated_at"], "count=", data.get("count"))
          PY

      # 不用 git-auto-commit-action：其 file_pattern 在部分环境下只对第一个路径生效，
      # 会导致仓库里永远只有 seen.json 更新、docs/items.json 仍是占位空 updated_at。
      - name: Commit state & dashboard
        run: |
          set -eux
          git config user.name "info-bot"
          git config user.email "info-bot@users.noreply.github.com"
          git add state/seen.json docs/items.json docs/index.html
          if [ -f docs/.nojekyll ]; then git add docs/.nojekyll; fi
          git status -sb
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update state & dashboard [skip ci]"
          git push
