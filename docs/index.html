<style>

      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;

  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;

  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

72b19"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨携程因滥用市场支配地位被罚没51.79亿元；长鑫科技今日上市；日本技术人员拆解宇树机器人：短期内赶不上中国", "url": "https://36kr.com/p/3913118530819457?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>A股内幕交易新规定今日起实施，收紧了“合法交易”抗辩空间</li>\n   <li>360原董秘称离职7年股权激励未兑现，涉及金额约2649万</li>\n   <li>马斯克点赞黄仁勋首条X推文，称全力支持黄仁勋</li>\n   <li>法院回应LV因楼盘外立面装饰侵权起诉开发商：不属实</li>\n   <li>韩国养老金7月首度净买入KOSPI成分股，为今年首次</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>滥用市场支配地位实施垄断行为，携程被罚没51.79亿元</strong></p>\n  <p>7月25日，市场监管总局依法对携程集团有限公司滥用市场支配地位实施垄断行为作出行政处罚，罚没款合计51.79亿元。</p>\n  <p>携程7月25日发布关于诚恳接受国家市场监督管理总局行政处罚决定的公告：今日，我们收到《国家市场监督管理总局行政处罚决定书》。对此，我们诚恳接受、坚决服从，并将严格对照监管要求，逐项推进、系统落实各项整改工作，确保各项措施执行到位。（央视新闻）</p>\n  <p><strong>长鑫科技今日上市，研报预计一签最多能赚2.6万元</strong></p>\n  <p>长鑫科技此前公告称，公司股票将于7月27日（周一）在上海证券交易所科创板上市。本次发行价格为8.66元/股，发行后总股本为668.81亿股（超额配售选择权行使前）。</p>\n  <p>国投证券研究报告对其估值设定了保守、中性、乐观、超乐观四种情景，对应长鑫科技估值为1万亿元、1.5万亿元、2.3万亿元和4.25万亿元。基于上述预估的1万亿元-4万亿元市值区间，对应上市后首日涨幅落在70%-600%区间。对比8.66元的发行价，中一签的盈利空间大约在3000元至2.6万元之间。（中国证券报）</p>\n  <p><strong>日本技术人员拆解宇树机器人，坦言人形机器人短期内赶不上中国</strong></p>\n  <p>日本日经xTECH网站7月23日发布了一段日本技术人员拆解中国宇树科技G1人形机器人的视频，尝试探究其内部结构与技术水平。在这段视频中，日方技术人员和媒体记者边拆边感叹中国人形机器人的技术水平之高，并最终得出结论：中国机器人研发显然已超越了“只会展示”的阶段，在人形机器人领域，日本想在短时间内缩小与中国的差距“恐怕并不现实”。 （央视财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>月之暗面Kimi K3庆功照流出，张予彤疑现身，喊出“冲上月球”口号</strong></p>\n  <p>据报道，在经历过去一段时间月之暗面Kimi K3发布引发的广泛关注后，月之暗面于周五在北京的一个酒吧举行了庆功活动。据流出内容，月之暗面展示的一张庆功标语显示，月之暗面对于K3的定位是“扩容升级”，同时期望将下一代K4“狠狠干到极致”，并喊出了“冲上月球”口号。一张流出的图片显示，本场活动上，月之暗面联合创始人、总裁张予彤疑似也到了现场。（新浪科技）</p>\n  <p><strong>Anthropic推出新模型Opus 5</strong></p>\n  <p>当地时间7月24日，Anthropic推出新模型Opus 5。公司称，Opus 5的性能接近其更强大的同系列产品Fable 5，而价格却只有后者的一半，适用于日常办公和计算机编程任务。Anthropic产品负责人Dianne Penn表示，此次发布的版本比5月份的Opus 4.8更高效。（界面新闻）</p>\n  <p><strong>美国发生AI失控事故，引发外界对美国科技企业AI安全机制的质疑</strong></p>\n  <p>7月25日，路透社援引知情人士消息刊发独家报道称，OpenAI一款AI Agent在入侵人工智能平台Hugging Face后，连续数天实施攻击，而OpenAI直到事件得到控制、Hugging Face已向美国联邦调查局（FBI）报案后，才确认此次入侵是由自家AI Agent造成的。这一事件再次引发外界对美国科技企业AI安全机制的质疑。（环球时报）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>A股内幕交易新规定今日起实施，收紧了“合法交易”抗辩空间</strong></p>\n  <p>7月24日，最高人��法院、最高人民检察院联合发布《关于修改〈最高人民法院、最高人民检察院关于办理内幕交易、泄露内幕信息刑事案件具体应用法律若干问题的解释〉的决定》（法释〔2026〕13号），自2026年7月27日起施行。据悉，这是该司法解释自2012年施行以来的首次系统性修改。受访律师向券商中国记者表示，本次修订使得内幕信息敏感期的认定时点大幅前置，堵死了实控人等“意向阶段”套利的漏洞。修订还收紧了“合法交易”抗辩空间。（中新经纬）</p>\n  <p><strong>360原董秘称离职7年股权激励未兑现，涉及金额约2649万</strong></p>\n  <p>近日，又有昔日高管站出来指控三六零（601360.SH，下称“360”）。7月24日，360原董事会秘书、首席法律顾问张帆公开发文称，其已离开360七年，但尚有一笔股权激励权益未兑付，金额约2649万元。</p>\n  <p>张帆告诉记者，过去，她多次通过不同方式与360方面沟通、试图解决问题，但今年5月，360方面的律师单方面终止了沟通；7月，她通过微信向360创始人周鸿祎发送信息，而后她发现自己在发送信息后被拉黑。（红星新闻）</p>\n  <p><strong>宁德时代日赚2.4亿元，产能还要再扩1.5倍</strong></p>\n  <p>7月24日晚间，宁德时代公布了2026年半年度财务报告。财报显示，宁德时代上半年实现营业总收入2769.17亿元，同比增长54.80%；归母净利润432.84亿元，同比增长41.98%，折合日赚约2.4亿元；扣非净利润达到390.13亿元，同比增长43.44%。</p>\n  <p>在经历了2023年至2024年的谨慎周期后，这家龙头正以供不应求的现实与激进扩产的决心，重新划定产业版图。营收与利润高增的背景下，两组数据更值得关注。上半年，宁德时代产能利用率高达94.86%，接近满产；同时，公司在建产能达764GWh，是现有产能的1.46倍。（新浪科技）</p>\n  <p><strong>马斯克点赞黄仁勋首条X推文，称全力支持黄仁勋</strong></p>\n  <p>近日，全球市值最高上市公司英伟达掌门人黄仁勋入驻社交媒体平台X（原推特），截至北京时间25日11时30分，其粉丝数量已达到62.7万。</p>\n  <p>黄仁勋的首条推文是一封英伟达参与联署的信件，强调了开源人工智能模型的重要性。该信由英伟达、微软、Meta、IBM、戴尔科技、Linux基金会、a16z、Y Combinator、Mistral AI等数十家机构联名签署。对此，特斯拉、SpaceX、Neuralink等多家前沿科技公司创始人马斯克转文称，“老黄是对的，我全力支持”。（快科技）</p>\n  <p><strong>港交所新规生效，科技企业上市门槛再降低</strong></p>\n  <p>近日，港交所就有关提升港股上市机制竞争力的建议发布咨询总结，修订后的上市规则随即生效。今年以来，已有近100家企业在港股上市，还有逾500家正在审核。业内人士认为，港交所上市新规生效，市场包容性进一步提升，无论大幅降低“同股不同权”架构企业的上市财务门槛、放宽投票权比例限制，还是为海外上市企业赴港上市提供更多便利、允许所有申请人秘密递表，都有助于吸引更多类型公司上市，丰富投资者的选择，提升港交所的国际竞争力。（上证报）</p>\n  <p><strong>Naver与英伟达达成价值10亿美元的战略投资协议</strong></p>\n  <p>韩国互联网门户运营商Naver与英伟达达成了一项价值10亿美元的战略投资协议，英伟达将获得Naver 4.5%的股份。（财联社）</p>\n  <p><strong>美国五大科技巨头隐性债务超万亿美元</strong></p>\n  <p>《日经亚洲评论》21日报道称，在查阅了谷歌的母公司“字母表”公司、微软、亚马逊、元宇宙公司和甲骨文公司的财报和其他资料后发现，这五家科技巨头的隐性债务4年内增长了8倍，最近一个季度达到了1.65万亿美元，远超表内约1.35万亿美元的负债规模。评级机构穆迪早在2月就对美国科技巨头庞大的隐性负债发出警告。据英国《金融时报》报道，穆迪在当时的一份报告中称，美国现行会计准则存在“局限性”，允许大型科技公司在人工智能数据中心建设狂潮中，隐藏数百亿美元的潜在负债。这一漏洞可能导致投资者难以看清这些科技巨头真实的财务健康状况。（央视财经）</p>\n  <p><strong>2026年7月票房破40亿</strong></p>\n  <p>据灯塔专业版，截至7月26日，2026年7月总票房（含预售）突破40亿，《功夫女足》《八仙！》《小黄人与大怪兽》《四渡》《想你了》暂列7月票房榜前五。（界面新闻）</p>\n  <p><strong>高通宣布9月起芯片涨价，涨幅达两位数百分比</strong></p>\n  <p>据彭博社近日报道，高通公司正准备提高芯片产品价格，涨幅将达到两位数百分比。高通已于当地时间7月24日向客户发送涨价通知，并表示新价格将适用于9月1日之后出货的产品。高通在通知中提到，公司已经无法继续消化来自供应链的成本上涨压力，同时也尝试寻找新的零部件供应来源。（IT之家）</p>\n  <p><strong>法院回应LV因楼盘外立面装饰侵权起诉开发商：不属实</strong></p>\n  <p>7月26日，厦门市湖里区人民法院发布情况通报，网传案情“路易威登公司起诉地产开发商，因楼盘外立面四叶类雕花装饰商标侵权”不属实。经核实，该案系路易威登公司起诉某小区沿街服装店经营者彭某销售侵犯其注册商标的服装，其余被告系因怠于履行管理职责被诉承担相应责任，案件与网传楼盘外立面雕花装饰没有关联。目前该案尚未开庭。（第一财经）</p>\n  <p><strong>SK海力士、三星电子和铠侠将公布最新财报，或影响下一阶段芯片股走势</strong></p>\n  <p>SK海力士、三星及铠侠三家存储龙头即将公布最新业绩。在市场对AI投资可持续性及存储长约可靠性的疑虑下，这几份财报也将成为检验巨头在这一轮周期中盈利能力的“试金石”。三份财报能否证明AI需求仍在转化为HBM、DRAM和企业级固态硬盘订单，或将影响下一阶段芯片股走势。（中新经纬）</p>\n  <p><strong>马斯克警告SpaceX空头风险</strong></p>\n  <p>上周特斯拉由于二季度业绩不及预期，财报发布后的第二天股价大跌约14.5%，市值蒸发了约2145亿美元。而马斯克的另一家太空探索技术公司SpaceX目前距离首次公开募股过去一个多月，股价跌破了发行价，并且押注其股价下跌的投资者还在不断增加。数据显示，目前SpaceX的空头仓位已上升至流通股的约32%。对此，马斯克警告称，长期维持SpaceX大规模空头仓位的机构，“生存概率非常低”。现在市场还在关注的就是SpaceX和特斯拉是否可能合并，对此马斯克在财报会上既没有承认，也没有否认，只是表示两家公司之间的业务重叠会越来越多。目前部分华尔街的分析人士越来越看好两家公司最终将达成交易。（央视财经）</p>\n  <p><strong>韩国养老金7月首度净买入KOSPI成分股，为今年首次</strong></p>\n  <p>韩国交易所周日披露股市数据，韩国股市最大机构投资者之一——国民年金公团等养老金资金，本月转为韩国综合股价指数（KOSPI）股票净买方，系今年以来首次。数据显示，7月1日至24日，国民年金公团及其他养老金在KOSPI主板累计净买入股票684亿韩元（折合4680万美元）。在此之前，养老金已连续六个月净卖出股票，本月是年内首月实现净买入。</p>\n  <p>7月前17个交易日里，养老金有11个交易日为净买入，6个交易日净卖出。本月还剩余5个交易日，分析师判断，养老金大概率在7月全月维持净买入状态。个股买入端，SK海力士为养老金头号增持标的，累计净买入4258亿韩元；其次是SK创新（2247亿韩元）、韩国双龙炼油S-Oil（1744亿韩元）。卖出端则大幅减持：SK Square净卖出5757亿韩元、三星电机3136亿韩元、三星人寿保险1238亿韩元。（新浪财经）</p>\n  <p><strong>派拉蒙天舞宣布推迟收购华纳兄弟交易</strong></p>\n  <p>派拉蒙天舞公司24日宣布同意推迟收购华纳兄弟探索公司的交易。该项被广泛认为将改变美国娱乐、媒体等多个行业格局的交易目前正面临严峻法律挑战。派拉蒙天舞是在经过数轮交锋和不断提高收购报价后，才最终击败流媒体巨头奈飞。华纳兄弟探索公司股东4月23日投票批准了派拉蒙天舞提出的收购协议。这笔交易原计划在今年第三季度完成。提交给美国证券监管机构的文件显示，若交易延期，派拉蒙天舞公司或将付出高昂代价。（新华社）</p>\n  <p><strong>Waymo正考虑终止与Uber的合作关系</strong></p>\n  <p>据报道，Alphabet旗下的Waymo正在探索退出与Uber合作关系的可能性。Waymo于2023年5月首次与Uber合作，在美国亚利桑那州凤凰城推出无人驾驶出租车服务。随后，双方又在奥斯汀和亚特兰大达成合作协议，在这些地区，Waymo的车辆只能通过Uber应用程序使用，Uber与合作伙伴Avomo共同管理车队。今年5月，Uber和Waymo在凤凰城的合作已于协议到期后终止。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>大众集团上半年税后利润同比下降超三成</strong></p>\n  <p>德国汽车制造商大众集团24日公布2026年上半年财报显示，受美国关税、全球市场竞争加剧等因素影响，集团上半年税后利润同比下降超过三成，2026年全年营收预计将低于此前预期。大众集团管理董事会主席奥博穆当天表示，为实现降本目标，集团在全球范围内可能裁减约5万个工作岗位，具体规模仍有待进一步评估。（央视新闻）</p>\n  <p><strong>新点软件：预计上半年归母净利润亏损6302.1万元左右</strong></p>\n  <p>新点软件7月26日公告，预计2026年上半年实现营业收入5.7亿元，同比减少14.93%。预计上半年归母净利润亏损6302.1万元左右，上年同期亏损6217.71万元。报告期内公司营业收入较上年同期下滑，主要受客户预算受限、部分项目交付周期拉长等因素影响。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>希音披露聆讯后资料集：2025年营收418亿美元</strong></p>\n  <p>36氪获悉，7月26日，希音（SHEIN）向港交所披露聆讯后资料集。若顺利挂牌，将成为2026年港股最大的跨境电商IPO。2025年，希音实现总收入418亿美元，2023至2025年复合年均增长率达14.2%；2025年同期实现净利润20.6亿美元。截至2025年底，平台服务约2.73亿活跃客户，业务覆盖约160个市场。</p>\n  <p><strong>整理</strong>｜何雨婷</p>", "category": "tech", "published_at": "2026-07-26T23:50:15+00:00", "fetched_at": "2026-07-27T02:31:05.035975+00:00", "fingerprint": "afb1c192d72852e7"}, {"source": "36氪 - 最新文章", "title": "最前线｜加速构建太空大脑，「数字空间一号」试验星工程正式在京启动", "url": "https://36kr.com/p/3912546487637378?f=rss", "summary": "<p>文｜阿至</p>\n  <p>过去十年，中国商业航天完成了“造得出、送得上”的第一阶段目标，卫星产能快速爬坡，可回收火箭验证走向密集验证节点。但当轨道资源从宽松走向拥挤，各国之间的竞争焦点也从发射能力转向运行能力的比拼，“管得住、用得好”至关重要。</p>\n  <p>根据国防科技大学的测算，在卫星之间保持50千米最小安全间距的前提下，300-2000公里的全低轨空间最多只能安全容纳约17.5万颗卫星。当卫星数量从几千颗变成上万颗时，地面站排队上下行指令的传统方式就会难以为继，现有的卫星管控模式也正在失效。</p>\n  <p>“未来十年，航天发展的主旋律，应该是空间的数字化和智能化。”中国科学院院士魏奉思在上个月的科技创新院士报告厅演讲中曾提及这一核心观点。</p>\n  <p>更具体点说就是，未来卫星不能\"只有眼睛、没有脑子\"。</p>\n  <p>7月26号，商业航天加速《数字空间战略》发展大会暨“数字空间一号”试验星启航大会在北京举行。</p>\n  <p>作为《数字空间战略》的提出者，魏奉思院士在现场指出，面对空间环境复杂多变、轨道资源日益拥挤以及大规模星座协同运行等挑战，未来空间基础设施不仅需要持续提升感知能力，还要构建具备认知、推演和决策能力的智能体系。“太空大脑”是数字空间建设的核心枢纽，需要形成与真实空间环境相连接、贯通“感知-认知-行为”的大脑智能体系，推动航天器由“地面指挥、星上执行”逐步走向风险场景下有限自主和星地协同智能运行���</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260726/v2_a03229100eaa41d688c4596c9a9ef5d7@577536001_oswg1208672oswg1269oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中国科学院院士魏奉思</p>\n  <p>所谓大脑智能，简单来说就是把空间感知、空间认知、空间行为三个环节全部集成到星上，形成一个毫秒级的全链条智能闭环，让卫星像自然界中成千上万只鸟群一样，彼此不碰撞、自主应对环境变化。</p>\n  <p>“数字空间一号”试验星工程的正式启动，特殊之处不在于它要具体执行哪些任务，而是要验证一件事：卫星能不能拥有自己的“大脑”。</p>\n  <p>正如远洋航海需要航海图一样，进入大航天时代，人类也需要绘制自己的“航天图”，这背后都依赖空间数字化、智能化能力的提升。</p>\n  <p>而当卫星需要“大脑”，一场数字空间的产业突围也在北京打响。</p>\n  <p>作为魏奉思院士《数字空间战略》落地和应用实践的推动者，数字太空成立于2019年，核心业务聚焦太空数字化、智能化及应用。为了加速推进数字空间“大脑”的落地，目前公司正在加速智能载荷的研制和数字太空模型算法的研发。</p>\n  <p>数字太空董事长、总裁王世金现场提到，围绕大规模星座安全运行、太空环境风险应对和卫星自主运行等需求，数字太空进一步提出“卫星智驾+太空智管”解决方案：通过星上感知载荷和智驾载荷提升卫星自主运行能力，依托SpaceOmni地面平台开展环境监测、风险预警、星座运营、孪生推演和任务决策。</p>\n  <p>具体来看就是，在星侧，卫星智驾通过新增感知层和智能载荷，让卫星具备对空间环境、系统状态和碰撞风险的自主感知与决策能力；在地面侧，太空智管平台整合环境监测、风险预警、星座运行和数字孪生推演，构建星地协同的卫星智能管控闭环。</p>\n  <p>而“数字空间一号”试验星的使命，就是要把魏奉思院士提出的“感知－认知－行为”大脑智能架构完整搬上太空进行在轨验证。会上，王世金也强调了速度的重要性——商业航天等不起，必须两条腿走路，尽快拿到在轨数据。</p>\n  <p>为了进一步加快技术验证、成果转化和商业化应用进程，大会现场，数字太空与天仪空间、中科西光航天、太湖星云、东方星链、钧天航宇、星移联信、微纳星空等12家商业航天企业签署产业合作协议。接下来，各方将围绕试验星研制、智能载荷搭载、平台协同适配、在轨试验和应用场景拓展等方向开展合作。</p>\n  <p>此外，数字太空也就产业共建提出倡议——“构建太空可信底座、共建大脑智能产业生态”，推动高校、科研机构、产业链企业、用户单位和投资机构加强协作，加快卫星智能关键技术验证与成果转化。</p>\n  <p>一个现实是，大语言模型的黑箱和幻觉，应用在当前的航天场景中仍存在较多难解问题，而太空是纯粹的客观物理世界，因果规律是基本约束。因此，王世金的主张是，用物理世界模型做底座，把数十年航天行业积累的标准、工程经验和物理法则嵌入智能体系，让每一次推演都“规则可见、推演可进、决策可控”。</p>\n  <p>未来，如果能够通过卫星智驾系统把不同来源的商业遥感、通信卫星整合成一张感知决策网络，就能实现从单一数据交付到决策交付的跨越，真正让卫星数据“活起来”，推动中国航天产业实现从“管得住”到“用得好”的跃迁。</p>", "category": "tech", "published_at": "2026-07-27T01:00:00+00:00", "fetched_at": "2026-07-27T02:31:05.035968+00:00", "fingerprint": "47b2d81e891bf3d1"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜家居音频品牌「MORROR ART」完成亿元级B+轮融资，日初资本领投、零一创投跟投", "url": "https://36kr.com/p/3910655616521348?f=rss", "summary": "<p>36氪获悉，家居音频品牌「MORROR ART」母公司无锡未来镜显示科技有限公司近日完成亿元级B+轮融资，由日初资本投资，老股东零一创投继续跟投，心流资本FlowCapital担任财务顾问。本轮资金将主要用于电子家居产品矩阵扩充、视觉音乐内容与软件系统建设、国内线下体验渠道拓展，以及旗下海外子品牌MorningBlues的全球化发展。</p>\n  <p>2024年，36氪曾率先报道MORROR ART的近亿元B轮融资，由海控天程基金领投、零一创投跟投。其后，MORROR ART营收继续保持高速增长，2025年增速显著高于音频行业平均水平。</p>\n  <p><strong>与此同时，MORROR ART面向海外市场孵化子品牌「MorningBlues」，其推出的新一代产品SonicGlass A1，在Kickstarter获得来自欧美等主要市场用户的支持。项目众筹金额已突破120万美元，成为公司验证全球市场的重要节点。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260726/v2_e66d3d948ffe49a2aa7dd1de406cd5cf@5748245_oswg3619631oswg4490oswg2371_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">SonicGlass A1在Kickstarter的众筹金额突破120万美元</p>\n  <h3>从透明歌词音响，走向电子家居产品矩阵</h3>\n  <p>MORROR ART成立于2020年，总部位于江苏无锡。品牌最早以透明歌词音响进入市场，将实时歌词显示、透明材料与声学系统结合，让原本只存在于手机屏幕中的歌词，成为家庭空间中可以被持续观看和感知的内容。</p>\n  <p>这一产品迅速建立了较强的辨识度，但对MORROR ART而言，歌词显示不是全部。它真正希望进入的，是一个位于消费电子与家居产品之间的新市场。</p>\n  <p>传统音响首先是一件功能设备，用户购买它是为了播放声音。当音乐停止、设备关闭，它通常只剩下一个被摆放在桌面、电视柜或角落里的电子黑盒。家居产品则不同，一盏灯、一把椅子、一幅装饰画或者一个花瓶，即使没有被主动使用，依然参与着空间构成，持续提供审美价值和环境氛围。</p>\n  <p>MORROR ART希望改变消费电子产品与家庭空间之间的关系。在其产品逻辑中，一件电子产品不应该只在开机时产生价值，它还应该具备材料感、空间感、陈列感和长期观看价值，能够像家具、灯具或艺术摆件一样，自然地融入家庭。</p>\n  <p>MORROR ART品牌创始人张俭表示，“电子产品不应该天然与家居环境冲突，它既可以承载技术，也可以承载审美、情绪和人的生活方式。”因此，品牌尝试的产品定义是，让声学、显示、数字内容、材料设计和空间审美，在同一件产品中成立。</p>\n  <p>过去几年，MORROR ART已经陆续推出透明歌词音响、唱片歌词音响、壁画歌词音响等多个产品系列。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260726/v2_e1fc726a5ae54255988fa9abe94934d6@5748245_oswg3602888oswg5000oswg2813_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">MORROR ART产品矩阵</p>\n  <p><strong>目前，MORROR ART已经形成约8个SKU组成的基础产品矩阵，未来计划扩展至约20个SKU，价格带从1000多元、2000多元、3000多元，逐步延伸至接近2万元，覆盖桌面、床头、书房、客厅、墙面及更完整的家庭空间。</strong></p>\n  <p>对MORROR ART而言，扩展至20个SKU并不意味着推出20台形态相似的音响。其真正目标，是在不同空间、不同预算和不同生活阶段中，建立一套统一但不重复的电子家居产品体系。</p>\n  <p>它们的外形各异，但都将围绕三个核心问题展开：电子产品如何融入家庭空间，数字内容如何形成持续的情绪价值，音乐如何从单纯的听觉内容转化为空间体验。</p>\n  <h3>「视觉音乐」不只是歌词显示，而是为歌曲建立视觉叙事</h3>\n  <p>视觉音乐仍然是MORROR ART产品体系的重要基础，但它不再只是歌词显示功能的延伸。在其早期产品中，屏幕主要承担歌词陈列功能，让用户在听歌时可以同步阅读歌词。</p>\n  <p>下一阶段，MORROR ART希望让视觉内容与音乐本身发生更深的关系。一首歌曲不再只对应几行依次滚动的文字，而可以对应字体运动、节奏变化、色彩、动态影像、情绪场景以及具有MV叙事感的背景内容。</p>\n  <p>例如，当系统播放摇滚音乐时，画面可能出现鼓点、颗粒、黑白影像或具有舞台感的动态视觉；播放抒情歌曲时，视觉语言则会随旋律、歌词和情绪发生更缓慢、更柔和的变化。视觉不再是音响上的附加显示，而是歌曲表达的一部分。</p>\n  <p><strong>正在Kickstarter众筹的MorningBlues SonicGlass A1，是这一轮升级的集中体现。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260726/v2_850c492bfad54b6aa85edd5e8d171611@5748245_oswg12358677oswg8048oswg5368_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">MorningBlues SonicGlass A1产品</p>\n  <p><strong>首先，SonicGlass A1对最基础的声学结构进行了重新设计。</strong>在传统音响中，发声单元、音腔和内部结构通常被隐藏在封闭箱体内部。消费者能够听见声音，却无法看到声音如何产生。SonicGlass A1则引入透明声学单元，重新构造音腔结构。当透明单元工作时，用户可以直接看到振膜运动与声音产生的过程。</p>\n  <p>声音由此不再只是一个不可见的结果，而成为产品视觉表达的一部分。这也让SonicGlass A1具备了更强的电子家居属性，能够更自然地进入客厅、书房等桌面环境。“即使没有播放音乐，透明声学结构本身也构成了产品的陈列价值，当音乐开始播放，声学单元、歌词、画面和空间又共同形成动态体验。”张俭表示。</p>\n  <p><strong>SonicGlass A1的第二项升级，是从歌词显示进入具有MV感的视觉叙事。</strong></p>\n  <p>过去的歌词音响，主要解决歌词能被实时、准确地显示出来。SonicGlass A1则进一步尝试回答，当一首歌曲播放时，歌词背后是否可以形成与音乐风格和情绪相匹配的视觉世界。</p>\n  <p>在新的系统中，歌词依然存在，但它不再孤立地悬浮在单一背景上。不同歌曲可以根据音乐类型、节奏、情绪与内容，匹配相应的动态场景、字体运动和视觉效果。背景也不只是装饰性的动画，而且开始承担类似MV的叙事功能。</p>\n  <p>对于MORROR ART而言，这项能力的价值并不只是让屏幕“更好看”。当视觉内容能够根据音乐持续变化，音响就不再是一件长期保持同一外观和同一交互的静态硬件，而成为一个拥有内容更新能力的空间终端。在张俭看来，这也是消费电子与家居产品结合的重要条件。</p>\n  <p><strong>除了透明声学系统和MV式视觉内容外，SonicGlass A1还引入了AI Radio功能。</strong>在一首歌开始前，AI主持人可以介绍歌手、作品背景、创作故事或者歌曲所处的音乐语境；歌曲结束后，AI主持人也能对作品进行解读、回应用户当下的情绪，或者自然地引出下一首歌。</p>\n  <p>透明声学让声音产生的过程被看见，MV式视觉让歌曲的情绪被延展，AI Radio则负责在歌曲之间建立叙事关系。三者共同构成SonicGlass A1的核心升级——它不只播放音乐，而是在重新组织用户进入音乐的方式。</p>\n  <p><strong>据悉，7月28日，MORROR ART将在中国市场正式发布全透明歌词音响A2。</strong>该产品与海外SonicGlass 同源，也是MORROR ART从歌词音响走向视觉音乐系统和电子家居产品的重要节点。</p>\n  <h3>下一阶段将重点投入线下体验</h3>\n  <p>与普通蓝牙音响相比，电子家居与视觉音乐产品同时包含声音、显示、材料、结构、动态内容、产品比例和空间关系等多个维度。</p>\n  <p>消费者需要在真实环境中看到透明材料的通透感、产品在家具中的比例、歌词和影像的显示效果，也需要同时感受声音、视觉内容与空间之间的配合。单纯依赖电商详情页、短视频或参数对比，很难完整传递这类产品的价值。</p>\n  <p>因此，MORROR ART计划在核心城市逐步增加线下体验触点，并探索品牌门店、商场体验空间、生活方式集合店、家居渠道、设计师渠道和艺术空间等不同业态。品牌希望产品不只出现在传统3C卖场，也可以进入与真实生活更接近的客厅、卧室、书房、酒店、餐厅和公共空间。</p>\n  <p>线下门店对MORROR ART而言，不只是销售渠道，也是产品陈列、空间示范和品类教育的基础设施。</p>\n  <p>消费者需要先看到一台SonicGlass A1如何进入客厅，看到透明声学单元如何降低产品的视觉重量，看到歌词与MV式画面如何与空间发生关系，才能真正理解电子家居与普通音响之间的区别。</p>\n  <p>日初资本在消费品牌、渠道运营和线下零售方面的经验，也将成为MORROR ART推进这一阶段的重要支持。</p>\n  <p>张俭表示，“我们并不希望融资之后盲目地做得更大、更快。更重要的是，把已经验证的方向做得更深，把产品、内容、软件、供应链和渠道建设得更完整。”</p>\n  <p>从让歌词进入空间，到让音乐形成视觉叙事，再到让电子产品真正成为家居的一部分，MORROR ART正在尝试完成一次更具挑战性的品类迁移。它可能不只是一家销售歌词音响的消费电子企业，而是一家以视觉音乐为内容核心、以电子家居为产品形态，并试图走向全球市场的新型品牌公司。</p>\n  <h2>投资人观点</h2>\n  <p><strong>日初资本创始人陈峰表示：</strong>电子产品进入家庭以后，不应该只是一件功能设备。它同样可以成为空间审美和生活方式的一部分。MORROR ART已经完成了第一阶段的产品验证，下一阶段有机会通过更完整的产品矩阵、线下体验和全球化能力，建立长期品牌价值。</p>\n  <p><strong>零一创投管理合伙人余璐表示：</strong>MORROR ART并没有停留在一款产品的成功上，无论是产品从约8个SKU向约20个SKU扩展，还是MorningBlues在海外市场获得验证，都说明公司正在从单一产品创新，进入更完整的产品体系和品牌体系。我们看重的不只是短期增长，也看重团队能否长期把原创产品转化为稳定的研发、制造与全球交付能力，并最终输出来自中国的原创品类和全球品牌。</p>", "category": "tech", "published_at": "2026-07-27T01:20:17+00:00", "fetched_at": "2026-07-27T02:31:05.035952+00:00", "fingerprint": "1a74ceee5e2ca141"}, {"source": "少数派", "title": "手冲咖啡指北：天太热了，来做一杯不寡淡的冰手冲吧", "url": "https://sspai.com/post/112421", "summary": "「太热了，今天不聊了，赶紧回去吹空调。」<a href=\"https://sspai.com/post/112421\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-26T07:28:01+00:00", "fetched_at": "2026-07-27T02:31:03.251778+00:00", "fingerprint": "007faf8e7669cce4"}, {"source": "少数派", "title": "派早报：携程因滥用市场支配地位被罚 51.79 亿元", "url": "https://sspai.com/post/112769", "summary": "<p>携程因滥用市场支配地位被罚 51.79 亿元</p><p>英伟达、微软等联名支持开放权重模型</p><p>长鑫存储、长江存储获得空前定价权</p><p>「谷歌一下」成为过时说法</p><p>上海交大医学院宣布调查基因编辑致死事件</p><p>Geekbench 7 发布</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/112769\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-26T23:00:57+00:00", "fetched_at": "2026-07-27T02:31:03.251768+00:00", "fingerprint": "07e9d61127934b84"}, {"source": "BBC World News", "title": "Iran-backed Houthis claim missile attack on Saudi Arabia", "url": "https://www.bbc.co.uk/news/articles/cj9d27v70j1o?at_medium=RSS&at_campaign=rss", "summary": "US military says it disabled a tanker that was attempting to evade the American blockade on Iranian ports.", "category": "politics", "published_at": "2026-07-25T06:34:40+00:00", "fetched_at": "2026-07-26T02:23:45.895640+00:00", "fingerprint": "ba2c5c8c1a62147f"}, {"source": "BBC Wor ument and modern art. These grooveboxes, as they’re often called, are capable of helping you produce songs in real time from a single unit, with an eye-catching design language. A wide swath of the brand’s offerings are 30 percent off [&#8230;]", "category": "tech", "published_at": "2026-07-25T15:00:00+00:00", "fetched_at": "2026-07-26T02:23:45.323511+00:00", "fingerprint": "03a514dd49949c6c"}, {"source": "The Verge", "title": "Synth historian Oli Freke will spend big on a good bicycle", "url": "https://www.theverge.com/entertainment/971013/oli-freke-bjooks-beat-gems-drum-machine-book-interview", "summary": "Oli Freke is a musician and journalist whose works have appeared in Sound on Sound, The Quietus, and Mixmag. This has included using math to explore the melodic potential of the Western 12-tone scale and deep dives on effects plug-ins. He's even written a book tracing the evolution of the synthesizer from 1963 through 1995, [&#8230;]", "category": "tech", "published_at": "2026-07-25T15:15:00+00:00", "fetched_at": "2026-07-26T02:23:45.323504+00:00", "fingerprint": "ba19a63824e2fb25"}, {"source": "The Verge", "title": "Google basically confirms the Pixel 11 is getting a price hike", "url": "https://www.theverge.com/tech/971041/google-confirms-pixel-11-price-hike", "summary": "Google's Vice President of Devices and Services, Shakil Barkat, all but confirmed in an interview with 9to5 Google that its next Pixel phone would cost more than the Pixel 10. Considering the ongoing RAM supply issues due to the explosion of AI data centers, the rumored price hike is not a complete surprise. Companies from [&#8230;]", "category": "tech", "published_at": "2026-07-25T18:13:36+00:00", "fetched_at": "2026-07-26T02:23:45.323494+00:00", "fingerprint": "850233a1af337884"}, {"source": "36氪 - 最新文章", "title": "从月之暗面出走，他用AI技术帮人找对象，徐新投资 | 涌现新项目", "url": "https://36kr.com/p/3910880823202948?f=rss", "summary": "<p><strong>文｜温丽虹</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>Kimi K3上线前夕，曾歆勋算了算，离职时放弃的那笔期权的价值，在他离开这段时间涨了10倍。</p>\n  <p>从月之暗面离职前，曾歆��是Kimi的AI搜索技术负责人。2025年8月，他离职创办“良配科技”，核心产品“良配”，一个AI驱动的婚恋匹配应用，核心逻辑是将AI搜索与匹配能力嫁接到“找人”这件事上，用AI解决婚恋场景中资料采集、智能匹配、沟通辅助三个环节的效率问题。</p>\n  <p>公司刚创办，曾歆勋就拿到了今日资本徐新200万美元天使投资。他后来才知道，徐新见他前，已经在“AI寻人”这个方向上筛过好几轮。当时徐新在看两个方向，“AI找工作”与“AI找伴侣”。</p>\n  <p>招聘方向上，她把当时国内数得上的初创团队几乎都聊了一遍，一家都没投。徐新给出的理由是：这些团队对招聘这件事的理解，没有超越上一个世代的产品经理。AI在哪个环节创造增量、怎么重构撮合效率，没有团队给她一个超出预期的答案。</p>\n  <p>婚恋方向，徐新只聊了良配一家。徐新投他之前曾提到过，她希望找到一个对“AI搜索、匹配人”这件事的理解超出她、超出她过往所投公司的创业团队。如果没有超出，只是打平，就没有押注的价值。</p>\n  <p>目前，良配小程序已上线，App 也即将上线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_8294763c3f2c48c8b1cf8d172b452210@17865612_oswg719258oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">良配创始人曾歆勋在2026年世界人工智能大会（WAIC）分享，图源：WAIC官方</p>\n  <p>&nbsp;</p>\n  <p><strong>一次技术同源的创业</strong></p>\n  <p>曾歆勋相信，自己进入的是一个已被验证有真实需求的市场。他引用了几款同类产品的数据作为参照，第一个平台，年费会员定价1288元，而第二个平台，每名付费用户生命周期总支付约800元。</p>\n  <p>1288元的年费，在C端订阅产品中处于最高档收费，与视频平台年费会员两三百元、音乐平台年费会员一百多元相比，婚恋产品年费1288元，用户愿意付费，说明“找对象”这件事在用户心里的价值排序非常高。</p>\n  <p>与此同时，过往用户对婚恋平台的普遍担忧，在于支付了高额的费用却难以精准高效地匹配到对的人。对此，曾歆勋的判断是：<strong>上一代婚恋产品的技术能力，难以提供“精准匹配”这个服务。平台修建了一个巨大的用户池子，把有需求的用户聚集到一起，而后，找人这件事，用户依然要耗费大量的时间和精力。用户需要自己刷资料、分析资料、交流、匹配、淘汰，周而复始，推荐系统在更为精准地推荐人这件事上，几乎没帮上什么忙。</strong></p>\n  <p>“良配”的核心逻辑，正是在解决“精准匹配”问题上，这与曾歆勋此前在Kimi的工作也高度同源。</p>\n  <p>在Kimi做AI搜索技术负责人期间，曾歆勋每天的工作，就是带着团队研究如何用AI帮助用户精准匹配信息，并探索这一简单动作背后可以创造的商业价值。</p>\n  <p>长久以来，他观察到AI搜索存在一个现象：在通用搜索领域，随着技术进步，搜索的结果越好、答案质量提升越显著，与此同时耗费的算力成本也更高。但用户的单次搜索难以形成付费，“现在各家的AI搜索都是免费提供的，用户可以免token费用使用，因为大家认为用户心智这个东西不该花钱，不愿意花钱。”曾歆勋说。</p>\n  <p>但专门只做某个方向（如医疗、金融、法律等）的AI搜索产品，情况大不相同。这类搜索服务往往会接入大量私有数据库，帮助用户进行搜索、匹配，用户愿意为这些搜索结果支付费用。</p>\n  <p>曾歆勋认为，这不仅是因为两者的技术效果与成本差异，而是因为后者的答案更关乎切身利益，一条专业的医疗答案可能救命，一条专业的法律咨询的答案直接影响决策。</p>\n  <p>这些场景的高溢价恰好说明：不是用户不愿意为“信息”付费，而是通用场景的信息价值太低。同样的AI技术，放在通用搜索里找不到挣钱的路径，但如果放在法律、医疗等具体的搜索场景里，就能找到商业变现的机会。</p>\n  <p>沿着这个逻辑往下推，他认定，“找人”是搜索的另一个高价值场景。其中的两大典型场景，一是招聘，二是婚恋。</p>\n  <p>在曾歆勋看来，<strong>对AI来说，找人和高精度的信息匹配是同一回事。</strong>AI搜索与婚恋匹配的技术动作完全一样，都是“理解意图——分析并匹配需求——输出搜索结果”这一步骤。Kimi做的是输入一个问题、匹配信息，良配做的是输入一个人的条件和对伴侣的期待、匹配另一个人。搜索的目标变了，但底层的逻辑没有变。</p>\n  <p>用AI搜索介入婚恋匹配，他把婚恋匹配拆成了三个环节，每个环节都对应婚恋匹配这件事的一个具体瓶颈。</p>\n  <p><strong>第一个环节是资料采集。</strong>在婚恋平台上，用户写自我介绍是一件平常之事。但不是所有人都能清晰、有逻辑、有层次地描述自己，所以，平台上大量用户资料近乎空白，系统缺乏有效信息去做推荐。</p>\n  <p>在曾歆勋看来，这不是用户的意愿问题，是能力问题。在“良配”上，设计团队制作了一个“AI红娘”，用来帮助用户完成资料采集。用户注册后，与AI红娘打20分钟的语音电话，AI会进行个性化提问，用户不需要组织语言，如实回答即可，完成后，AI便可生成有效的自我介绍，梳理清楚用户的婚恋预期、价值观等婚恋匹配所需的基本信息，用于后续的需求分析与匹配。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_853c5430af464fa7b37ea50ed816641e@17865612_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">良配“AI红娘”界面展示，受访者供图</p>\n  <p>&nbsp;</p>\n  <p>AI技术的介入，把用户有效采集资料的门槛，从“会精准表达”下调。“良配”小程序上线后，曾歆勋和同事发现，用户平均资料长度463个字，而此前，他们人工统计了婚恋领域的头部产品，用户平均资料长度为132���。</p>\n  <p><strong>第二个环节，是精准的匹配算法。</strong>上一代产品依赖年龄、身高、学历这些结构化标签做推荐。但其实，决定两个人是否合适的核心信息，关乎价值观、成长经历、性格、生活方式。</p>\n  <p>这些都在用户写的文本里，但过往的推荐系统分析不了，也用不上。基于标签化信息推荐之后，依然要用户自行从人海中排除大量对婚姻预期不一致的人选，找到准确的人依旧耗费心力。</p>\n  <p>曾歆勋很清楚这一点：上一代推荐算法处理不了自然语言，直到大语言模型的出现。良配正在训练专用匹配模型，输入是用户完整资料，包括对外展示的文本和AI红娘对话的原始记录。模型理解两份资料的内容后，会开始分析用户的深度信息，用于后续更精准的匹配。</p>\n  <p><strong>第三个环节，是沟通中介。</strong>婚恋场景里，有些问题必须在确认关系前厘清，比如家庭资产、负债、婚恋史、健康状况、彩礼预期等。在男女双方刚认识的阶段，这些问题没法直接开口。拖到接触几个月后再问，沉没成本已经高到让一部分人不愿面对分歧。</p>\n  <p>针对这点，良配做了两个功能。AI分身与AI军师。前者匿名接收和回答问题，被问方不知道具体的提问方，收到问题时，只知道有潜在的匹配对象希望知道自己的某个具体情况，缓解了那种一对一核对信息的尴尬感。后者，AI军师，则负责在真人沟通过程中提供话题建议和态度判断。</p>\n  <p><strong>在用户规模和社区氛围之间做出选择</strong></p>\n  <p>曾歆勋观察到，很多交友平台不得不在“用户量数据”和“社区氛围”之间反复摇摆。</p>\n  <p>为了把用户量做大，平台很难果断地把自己定位成一个纯粹的“严肃婚恋平台”，而是需要把关系类型泛化，以“帮你认识新朋友”“帮你脱单”为口号。这样一来，边界模糊，什么目的的用户都可以进来，这导致在交友平台上，不同目的的用户混在一起，最后谁都不满意。</p>\n  <p>曾歆勋对“智能涌现”说了一段话，可以看作他对这个问题的底层判断：<strong>“如果你觉得自己在做严肃交友软件，你就应该在方方面面维护这个氛围。过去的产品没有一个做得好，大家都是既要又要，两头都兼顾不到。”</strong></p>\n  <p>他的选择是放弃“既要又要”，明确良配是一个严肃的、以结婚为目的的婚恋平台，围绕这个定位，在所有环节设计筛选机制，让非目标用户在注册过程中自行离开。</p>\n  <p>良配设置了多层筛选机制：实名认证、人脸识别、与AI红娘进行约20分钟语音对话、AI资料诊断评分（70分以上方可上线），用户依次通过才能进入平台。平台还会对注册用户进行婚姻状态确认，已婚用户直接拦截。产品上线第一周，已经拦截了50多名已婚用户注册。</p>\n  <p>此外，良配还设计了严格的“1v1匹配机制”。用户进入匹配后，同时只能与一名匹配对象聊天，确认对方不合适后，才能解除匹配、去了解其他人。“这是我们为认真的社区氛围做的最重要的产品取舍，”曾歆勋说，“这个机制，可以规避泛社交平台中，用户之间交流的猜疑与博弈，同时，确保每一次匹配都值得被用户认真对待。”</p>\n  <p>种种规则的制定，是基于曾歆勋信任的一个逻辑：“一个人如果只想找短期关系，他是不会愿意在一个平台上透露那么多真实信息的，也不会通过那么多筛选环节。”</p>\n  <p>社区的氛围在反向约束用户行为。曾歆勋从中验证了一个判断：社区氛围不是靠规则管出来的，是靠筛选机制长出来的。当门槛足够硬，符合标准的人进入社区后，氛围会自然形成；氛围形成了，又会反向约束进来的人的行为。两者形成正向循环。</p>\n  <p>在曾歆勋看来，AI可以通过精准地分析用户找人需求，提高精准匹配效率。但一个严肃的婚恋社区能不能跑起来，还要看筛选机制够不够硬、商业模式跟产品目标是不是方向一致。这些东西AI解决不了，得靠人想清楚，再做出来。一个只懂技术的团队，难以做到这点。</p>\n  <p><strong>保结婚，一次关于交付的新尝试</strong></p>\n  <p>在曾歆勋看来，上一代婚恋产品做不好，根本原因不全是技术落后，而是商业模式和产品目标之间产生了底层冲突：在过去，几乎所有婚恋产品都是订阅制，按年或月收取会员费。这意味着，用户的留存时间越久，平台的收入越高。也因如此，平台欠缺帮用户尽快找到人的动力。</p>\n  <p>“这种情况下，平台并不真心想帮助用户成功。会设计各种方式让你付费，榨干用户最后一点价值以后，导致用户失望离开。”曾歆勋说。</p>\n  <p>于是，他重新设计了婚恋平台的交付逻辑。用户付费，收获的不是平台服务的使用时限，而是把“婚恋结果”作为给付费的交付目标。具体来说，他规划了“保结婚会员”计划，其核心规定是，<strong>用户支付2000元会员费后，若在加入良配后的3年内未能领证结婚，平台将全额退款。</strong></p>\n  <p>这一模式，经历过三个版本的推演。</p>\n  <p>第一个版本是“保证用户至少认识一个人”。用户在平台上互相发消息、聊几句之后约见面，但凡见面成功，就算交付了一个结果。如果一个人都没认识，一分钱不收。这个方案他与投资人讨论过，得到的反馈是：用户可能会扯皮——也许是交换了微信，但没见到人，又或者见到人了，但闹得很不愉快，用户为此不愿意承认交付结果，比较冒险。</p>\n  <p>第二个版本是“保证你能够交往、谈恋爱”。问题更大，因为谈恋爱没法验证，任何人谈了都可以说没谈，逃单率无限逼近百分之百。</p>\n  <p>最终他发现，婚姻状态是唯一可查询、不可伪造的交付标的。于是，他把付费用户的交付标准定为“按结婚结果交付”。</p>\n  <p>“3年”的期限也不是拍脑袋决定的。他们的团队在深圳南山民政局和福田民政局排队领证的人群里做了约150份问卷，希望知道这些新婚夫妻怎么认识的、认识了多久结婚？</p>\n  <p>“排除同学、同事、青梅竹马这些天然关系，凡是工作后通过介绍或网络平台认识的，70%在三年内结婚，” 曾歆勋介绍：“合适就结了，不合适就分了。三年是一个很自然的节点。”</p>\n  <p>关于“拖三年再结婚、恶意退费”的担忧，他的判断是：“对中国人来说，结婚是人生大事，这里头有太多支出比2000元高。结婚这件事跟2000块比，2000块根本不够影响决策，选什么黄道吉日都比这个分量重。”</p>\n  <p>目前，良配的产品仍在早期阶段。AI红娘能否持续产出高质量资料、专用匹配模型的准确率能否达到80%、三年后有多少用户领证结婚，这些都需要时间验证。</p>\n  <p>但良配这类产品的实践中，AI技术解决的不是仅仅社会效率问题，还介入了社会现实。中国有大量单身成年人的的婚恋需求没有得到有效供给。上一代产品的功能止步于“让人认识人”，而在“让人找到合适的人”这件事上，AI技术也许可以提供更多实质帮助。</p>\n  <p><strong>封面来源｜WAIC官方</strong><br />&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_87f7d5b1004f4f0f8605c223a653590a@17865612_oswg33308oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">*</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_ee21780db4b641cd9a0c863c2f239d25@17865612_oswg37106oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">*</p>", "category": "tech", "published_at": "2026-07-25T11:00:21+00:00", "fetched_at": "2026-07-26T02:23:45.195542+00:00", "fingerprint": "a3081b2a41959334"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 复旦教授、前英特尔首席科学家做端侧具身大脑，「眸深智能」完成近亿元Pre-A轮追加融资", "url": "https://36kr.com/p/3911162147640456?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，「眸深智能」（Motion Brain）完成近亿元Pre-A轮追加融资，本轮投资方包括中国头部物业服务公司、香港财团、多家上市公司联合打造的产业投资平台瑾悦投资、创合汇资本，以及老股东徐汇资本。</p>\n  <p>这也是继2026年5月3亿元Pre-A轮之后，「眸深智能」两个月内再次获得投资，此外，该公司Pre-A+轮的近5亿融资也在交割当中。该公司透露，今年上半年以来，「眸深智能」的估值增长超10倍，是业内发展速度最快的具身大脑企业之一。</p>\n  <p>「眸深智能」成立于2025年1月，定位为全球最懂动作的自进化具身大脑公司，致力于\"给10亿台机器人装原生通用大脑\"。</p>\n  <p>该公司由复旦大学深度学习实验室主任陈涛教授、原英特尔中国首席科学家张益民博士，与连续创业者穆泽林共同创办。核心团队拥有海思、英特尔、英伟达三大芯片巨头的背景人士，是国内少数具备算子级适配能力的具身大模型团队。</p>\n  <p>尽管2025年才注册成立，「眸深智能」的技术积累从2022年已经开始。在技术路线上，「眸深智能」选择了一条与主流VLA（视觉-语言-动作）不同的路径——以动作为核心的\"世界动作模型\"（World Motion Model）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_adde42ccc1284ca98cb44e97b6d41f5a@1199336245_oswg77948oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>从2022年起，「眸深智能」团队已经发布了<strong>MLD（隐空间动作扩散模型）</strong>。在当时，行业主流是将动作视为离散的信号，导致生成的动作僵硬且缺乏多样性，而「眸深智能」团队在全球dede范围内首次提出将动作映射到隐空间（Latent Space），并引入扩散模型（Diffusion Model）。</p>\n  <p><strong>MLD</strong>相当于让AI学会了“无师自通”地生成动作：不再需要逐帧教机器人如何走路，而是让模型像画家去噪一样，从一团随机噪声中还原出自然、连贯的人体姿态。</p>\n  <p>如果说MLD解决了“怎么生成动作”，「眸深智能」又进一步着眼于如何“指挥动作”。2023年9月，团队创造性发布了<strong>MotionGPT</strong>。类比汉字的基本笔画，团队将人体姿态拆解为约3000个“动作基元”。就像大语言模型（LLM）通过预测下一个token来生成句子一样，MotionGPT通过预测下一个“动作token”来生成复杂行为。</p>\n  <p>这种将连续动作离散化的处理方式，不仅极大地提升了模型对长序列任务的理解能力，更重要的是，它让机器人具备了Zero-Shot（零样本）泛化能力——没见过的动作指令，也能通过重组动作词汇来理解并执行。这也是全球首个把动作做成token的具身大模型，发表于NeurIPS 2023。</p>\n  <p>到了2026年，团队已经累计发布了7代模型，基于前述积累，「眸深智能」团队又进一步推出了STI- WM（时空一体世界动作模型）具身大模型。</p>\n  <p>STI-WM时空一体世界动作模型是完全面向机器人长时序规划、在线闭环控制、真实物理交互打造的原生具身智能框架，实现空间结构、时间演化、物理一致性、执行鲁棒性四维一体化统一。</p>\n  <p>据介绍，STI-WM的核心突破在于，彻底摆脱了传统VLA（视觉-语言-动作）模型对海量真机数据的重度依赖，采用了“80%互联网视频+10%动捕数据+10%真机数据”的训练配方，并MotionGPT建立的动作词典，从海量无标注的视频中学习物理规律，再用少量动捕数据校准生物力学特征，最后仅用10%的真机数据完成闭环对齐。</p>\n  <p>也就是说，这种全新的数据训练范式，将真机数据需求降低了90%，又将动作准确度提升至99%。</p>\n  <p>同时，「眸深智能」团队又在今年3月提出的T²MB（Task*Task Motion Brain）也让机器人具备了离线自进化能力，当模型部署到端侧后，无需联网回传数据，仅凭本地交互就能持续优化性能，任务执行准确度最高提升25%，解决了机器人落地后发现bug必须返厂升级的痛点。</p>\n  <p>值得注意的是，英伟达DAIR实验室在最新ARDY模型中，便援引了「眸深智能」的MLD与MotionGPT两项原创技术——这是近两年英伟达第三代动作模型对该公司技术路线的第四次引用。</p>\n  <p>不过，真正决定这套大脑能否规模化的，除了技术路线之外，还有端侧算力成本，这也是「眸深智能」的一大竞争壁垒。据介绍，「眸深智能」从第一代模型起就同步推进两个方向——模型压缩与国产芯片适配。</p>\n  <p>一方面，通过模型蒸馏、冗余参数压缩等工程化方案，「眸深智能」将千亿参数级模型压缩至百亿级别，在具体场景中参数量降低约75%，端侧推理延迟从约200毫秒降至10毫秒左右；另一方面，同步适配海思（昇腾310/910）、地平线、燧原（燧原S60）等国产芯片平台，实现低功耗、高实时、超低成本的端侧推理。</p>\n  <p>这套软硬协同的打法，带来的直接结果是，模型端侧推理成本从20万元降至1万元，大脑续航时间提升10倍，而精度和性能却不掉点。这一压缩工作也帮助该团队获得了IJCAI 2025全球最佳论文奖，也是近五年唯一获此奖项的中国大陆团队。</p>\n  <p>依托这一能力，「眸深智能」可在两周内完成一套具身大模型从一个本体到另一个本体的适配，包括复旦自研的“光华1号”、宇树G1、上海人形机器人创新中心的“青龙”和“灵龙”等本体。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_8175249a34f6429f9bc784990c887828@1199336245_oswg743309oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>「眸深智能」创始人、CEO穆泽林表示，国内具身智能行业普遍采用在国外芯片上训练、再移植适配国产芯片的方案，性能损耗与兼容性问题突出，而「眸深智能」未来在模型训练、推理全流程中将基于国产算力芯片原生开发，实现技术栈完全自主可控。</p>\n  <p>在商业化层面，「眸深智能」也是目前国内少数有营收的具身智能大脑公司。穆泽林告诉硬氪，其2025年审计回款收入千万元，2026年上半年3000万元，预计今年营收规模5000万元以上。</p>\n  <p>目前，公司客户覆盖工业检测、物业、环卫等场景。2026年第一季度，「眸深智能」已与某港股上市物业公司、A股上市环卫龙头的机器人产品交付；正在推进与头部连锁零售集团、头部白色家电工厂的人形机器人落地场景研发。</p>\n  <p><strong>以下是硬氪与穆泽林的交流实录（略经摘编）</strong></p>\n  <p><strong>硬氪：动作怎么变成Token？这是行业难点吗？</strong></p>\n  <p><strong>穆泽林：</strong>&nbsp;确实是行业卡点。我们可以把动作理解为「数字化的姿态」：就像小人书的一页是一个静态姿势，连续翻页就成了动画。我们早期通过几十人团队手工标注了几万个姿态，定义了3000多个基础动作Token，类似汉字的3000个常用字，组合后能覆盖人类所有行为。</p>\n  <p>更核心的是让模型学习动作间的关联：就像大语言模型通过学习海量文本掌握字词排列规律，我们让模型观看百万小时的互联网视频（影视剧、监控、Vlog等），学习「喝水时手会抬到嘴边」「抱胸后大概率会展开手臂」这类动作因果逻辑。同时结合10%的动捕数据和10%的真机数据做校准，最终实现动作Token的端到端生成——支持从文本、图片、3D点云到动作的转化，也就是原生多模态能力。</p>\n  <p><strong>硬氪：动作Token的组合会不会导致算力需求爆炸？如何优化？</strong></p>\n  <p><strong>穆泽林：</strong>&nbsp;我们不需要穷举所有动作，而是学习动作的排列规律。优化主要有两个方向：一是数据层面，80%用互联网视频（已做物理先验过滤，确保符合现实规律），降低对高成本动捕/真机数据的依赖；二是模型压缩层面，我们在端侧部署上有深厚积累，曾获得全球顶会最佳论文——通过Token剪枝、量化、动态优化等技术，能把端侧计算量降低62倍，推理延时从200毫秒压缩到10毫秒，模型参数量减少80%的同时精度不降反升（部分任务提升3%-6%）。</p>\n  <p><strong>硬氪：现在具身智能领域技术路线分化，有的侧重记忆，你们是侧重动作，您怎么看这种分化？</strong></p>\n  <p><strong>穆泽林：&nbsp;</strong>回归第一性原理：大语言模型的成功本质是Transformer架构实现了Token的排列生成。具身智能也应该遵循这个逻辑，核心是解决「执行层」问题——让机器人能稳定完成任务。</p>\n  <p>像记忆优化这类更底层的问题，我认为短期很难通过初创公司突破，需要DeepSeek、OpenAI这类巨头在芯片存储、存算一体架构上的长期探索。我们更务实：通过动作Token的泛化能力（Zero-Shot）解决新任务执行问题，比如机器人学过拿矿泉水瓶，没学过拿手机，也能通过动作序列迁移完成80%的准确度，剩余20%通过少量后训练或强化学习校准即可。</p>\n  <p><strong>硬氪：为什么选择适配国产算力，而不是用更成熟的英伟达卡？</strong></p>\n  <p><strong>穆泽林：</strong>&nbsp;长期来看，国产GPU是必然选择——N卡会越来越贵、供应受限。我们的核心优势是「懂芯片」：团队有海思、英特尔、英伟达三大芯片巨头的背景，是国内唯一具备算子级适配能力的具身大模型团队。目前已经打通了燧原S60、昇腾310/910等国产芯片的部署，下半年目标是攻克千卡级国产集群训练，实现纯国产化的大模型训练方案。</p>\n  <p>这不仅能解决供应链安全问题，更能提升资本效率：比如别人训练一次需要1万张卡、花费5亿，我们通过算子优化，1000张卡、5000万就能完成，类似DeepSeek的低成本训练逻辑。</p>\n  <p><strong>硬氪：具身智能芯片的机会在哪里？你们会自己做吗？</strong></p>\n  <p><strong>穆泽林：</strong>&nbsp;端侧具身芯片确实是大机会，目前国内已有20多家公司在布局（比如辉曦、光与星辰等），但大多瞄准200TOPS算力（类似英伟达Orin）。我们认为未来模型需要处理触觉、传感器、3D点云等多模态信号，算力需求会快速提升到1000-2000TOPS——如果芯片公司现在量产200TOPS的产品，等流片出来时可能已经跟不上模型迭代速度。</p>\n  <p>我们不会自己做芯片，除非未来公司规模达到数千亿级。现阶段更聚焦「软硬协同」：通过算子优化让模型适配现有芯片，和芯片公司合作而非重复造轮子。</p>\n  <p><strong>硬氪：未来产业分工会是怎样的？大脑和本体是否会各自形成通用供应商？</strong></p>\n  <p><strong>穆泽林：&nbsp;</strong>本体可能会像汽车行业一样，有不同的特色（比如负载更大、更轻量化），但大脑领域大概率会形成「一超多强」格局——通用大脑的研发门槛极高，国内真正具备研发能力的团队屈指可数。我们目标是成为那个「超级通用大脑」，同时允许其他团队聚焦细分场景（比如快递分拣、电力巡检）。</p>\n  <p>5-10年内，不会出现每家机器人公司都自研大脑的情况——大脑的研发投入（人才、算力）远超本体，创业公司更有机会突破，就像OpenAI不是大厂孵化的。大厂的优势在纯软件场景，而具身智能需要软硬件深度结合，创业公司的灵活性和专注度更有优势。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_cc5e5e40201d48cfa86218ef525d38db@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">&nbsp;</p>", "category": "tech", "published_at": "2026-07-26T01:00:00+00:00", "fetched_at": "2026-07-26T02:23:45.195526+00:00", "fingerprint": "144e4f4ffc8639a5"}, {"source": "少数派", "title": "看不见、摸得着的家居要素：聊聊湿度管理的方法与实践", "url": "https://sspai.com/post/112093", "summary": "基于这两年的「抗湿经验」，与大家聊聊湿度相关的一些事情。<a href=\"https://sspai.com/post/112093\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-25T03:09:49+00:00", "fetched_at": "2026-07-26T02:23:43.797386+00:00", "fingerprint": "2ebce7403d3eae54"}, {"source": "BBC World News", "title": "Texts reveal 14-year-old allegedly murdered by singer D4vd had pregnancy and abortion", "url": "https://www.bbc.co.uk/news/articles/cr592qdj1ldo?at_medium=RSS&at_campaign=rss", "summary": "Prosecutors allege D4vd started abusing the girl when she was 13 and she had threatened to expose him.", "category": "politics", "published_at": "2026-07-25T01:00:31+00:00", "fetched_at": "2026-07-25T02:12:15.025054+00:00", "fingerprint": "cf1e907567739eb0"}, {"source": "BBC World News", "title": "Zelensky tries to fix crisis over removal of defence minister and counts the cost", "url": "https://www.bbc.co.uk/news/articles/c1d1gz3n99ro?at_medium=RSS&at_campaign=rss", "summary": "Protests have continued over Zelensky's decision to dismiss Mykhailo Fedorov, and some commentators believe he has been damaged politically.", "category": "politics", "published_at": "2026-07-24T23:01:06+00:00", "fetched_at": "2026-07-25T02:12:15.025048+00:00", "fingerprint": "a81de5e0e47b98f5"}, {"source": "BBC World News", "title": "Ten killed in Russian attack on drone exhibition near Kyiv", "url" backlash-meta-pauses-plan-to-rate-limit-its-smart-glasses", "summary": "Remember when Meta was planning to charge a $20 monthly subscription fee for the smart glasses feature that lets people hear each other more clearly - even though that feature runs locally on your glasses and doesn't require the cloud? Meta has paused those plans, spokesperson Tyler Yee confirms to The Verge. The company is [&#8230;]", "category": "tech", "published_at": "2026-07-24T22:27:46+00:00", "fetched_at": "2026-07-25T02:12:14.329289+00:00", "fingerprint": "c7eccabed7febc7e"}, {"source": "36氪 - 最新文章", "title": "对话曾鸣教授：AI时代，企业竞争的关键是构建智能复利，让AI真正进入业务流程", "url": "https://36kr.com/p/3909358392988806?f=rss", "summary": "<p>7月17日，2026世界人工智能大会在上海开幕。作为36氪连续第三年深入WAIC现场的重要内容窗口，「氪话未来」直播间也在大会首日同步开启现场对话。曾鸣教授在WAIC现场接受36氪「氪话未来」特邀专访，围绕AI时代企业增长、组织变革、智能复利、AI原生业务以及企业落地路径等话题，分享了他对于人工智能如何重塑商业模式与价值创造方式的观察与判断。</p>\n  <p>本届WAIC以“智能伙伴，共创未来”为主题。随着人工智能产业进入应用深化阶段，行业关注点正在从模型能力竞争逐步转向应用价值创造。相比过去几年围绕参数规模、模型性能和技术突破的讨论，2026年的AI产业正在更加关注一个核心问题：AI如何真正进入企业业务流程，如何降低应用门槛，如何通过实际业务结果创造价值。</p>\n  <p>在这一趋势下，AI带来的变化已经不只是效率工具的升级，而是对企业增长方式、组织形态和商业逻辑的重新定义。曾鸣教授认为，AI是一场底层技术变革，它将推动经济、商业和组织发生系统性变化。企业未来需要关注的，不只是如何使用AI，而是如何让AI深入核心业务，通过真实任务和反馈闭环不断学习，形成持续增长的“智能复利”。</p>\n  <p>从“千人千面”到“一人千面”，AI也正在改变企业理解用户需求和提供产品服务的方式。相比依赖标签和历史行为的传统推荐体系，AI能够通过持续互动和深入理解，实现更动态、更个性化的服务体验。而对于企业而言，真正有价值的AI应用，需要突破Demo阶段，让AI具备独立完成任务并承担结果的能力。</p>\n  <p>在曾鸣教授看来，AI时代企业竞争的关键，将不再只是技术能力的比拼，而是能否构建AI原生业务，让AI真正进入工作流，并通过持续反馈形成自我增强的价值循环。未来，能够率先完成这一转变的企业，将获得新的增长机会。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_08d128cc8a7a46eebaab34af320d3bf9@6381723_oswg1573053oswg1422oswg788_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>以下为对谈实录，经36氪编辑：</p>\n  <p><strong>36kr：</strong>您在《智能商业》里讲网络协同和数据智能。到了这本《智能》，讨论已经进入 AI 时代的增长、组织和战略。您觉得这几年最大的变化是什么？是技术本身变了，还是企业创造价值的方式变了？</p>\n  <p><strong>曾鸣教授：</strong>我觉得AI技术的发展是一场非常底层的变革。大家经常会拿它的影响力与工业革命进行比较，甚至认为它可能比工业革命更加重要和深刻。当出现这样一次巨大的技术变革时，经济、商业模式以及组织形态都会发生基本层面的变化。所以我写这本新书，也是希望从第一性原理出发，探讨未来商业和组织的基本形态会如何不同于过去。</p>\n  <p><strong>36kr：</strong>这两年很多企业都在上 AI，但大家的体感并不一样：有人觉得提效很明显，也有人觉得还没带来根本变化。您最近和企业家交流时，听到最多的困惑是什么？</p>\n  <p><strong>曾鸣教授：</strong>最大的困惑，其实是短期内AI投资回报并不明显。企业可能能够看到员工效率有所提升，但对于整个组织来说，AI到底带来了什么价值、产生了什么回报，目前很多企业还没有清晰答案。</p>\n  <p>但我认为这是非常自然的阶段。无论是AI技术的发展，还是企业使用AI的方法，目前都还处于非常早期的阶段。因此，暂时没有看到特别明显的回报，是可以理解的。</p>\n  <p><strong>36kr：</strong>如果一家企业想认真用AI，而不是跟风试一试，您会建议先从哪个具体的业务环节开始？为什么不是先从最炫的技术或最宏大的战略开始？</p>\n  <p><strong>曾鸣教授：</strong>不同企业的切入点可能都不同。但有一个非常重要的变化，就是企业需要重新审视自身业务：在公司内部，是否存在一个业务环节可以被AI真正接管？只有做到这一点，企业才能获得真正的价值回报。</p>\n  <p><strong>36kr：</strong>您在书里讲“智能复利”，核心是系统在真实使用中不断学习、变强。放到企业里，什么样的业务最有机会形成这种循环？反过来，哪些场景看起来热闹，但很难积累复利？</p>\n  <p><strong>曾鸣教授：</strong>具体情况还是取决于每家企业自身的业务场景。但企业在初期探索AI时，可以选择一个相对简单的业务进行尝试。不过最终，企业一定要回到核心业务，将AI真正融入工作流，并基于AI的特点重新改造工作方式，才能逐步走向AI原生业务。</p>\n  <p><strong>36kr：</strong>您提出从“千人千面”到“一人千面”。放到今天的商业场景里，AI 会怎样改变企业理解用户需求、提供产品和服务的方式？</p>\n  <p><strong>曾鸣教授：</strong>这是一个非常重要的变化。即使在推荐时代，我在2010年提出“千人千面”时，我们希望通过更精准的匹配，让消费者与商品、服务之间建立更好的连接。但经过十多年发展，今天的推荐系统本质上仍然依赖标签和行为数据，通过分析用户过去的行为，判断他可能喜欢什么。</p>\n  <p>而AI最大的价值在于，它可以低成本地与一个人持续互动，同时具备更强的理解能力。因此，AI有机会更加全面、持续、深入地理解一个人，做到真正的个性化。因为每个人的需求本身都是不断变化的，只有真正实现个性化理解，才能从“千人千面”走向“一人千面”。</p>\n  <p><strong>36kr：</strong>WAIC 现场会有很多早期项目和 AI 应用。您在书里强调真实任务和反馈闭环的重要性，您觉得一个项目从 demo 走向真正业务，最关键要完成哪几类验证？</p>\n  <p><strong>曾鸣教授：</strong>最重要的是建立反馈闭环。只有形成反馈闭环，AI才能自主学习并不断提升。但反馈闭环有两个前提条件： 第一，AI是否能够端到端完成一项任务。 第二，AI是否能够对结果负责。如果AI无法承担结果责任，就必须由人进行兜底。而只要���在中间环节不断介入，AI的学习过程就会被打断。</p>\n  <p>所以最核心的一点是，AI需要能够“独立上岗”。我把这个阶段称为“60分基点”。当AI真正达到可以上岗的水平后，智能复利的飞轮才能开始运转，它可能会快速从60分提升到100分，甚至200分、500分。但突破60分，让AI真正具备独立工作的能力，往往是最困难的阶段，需要持续创新、长期实验和大量实践积累。</p>", "category": "tech", "published_at": "2026-07-24T08:06:05+00:00", "fetched_at": "2026-07-25T02:12:14.200941+00:00", "fingerprint": "7cb3d1b7e6dd8ea8"}, {"source": "36氪 - 最新文章", "title": "你的下一位面试官，可能不是人", "url": "https://36kr.com/p/3909499179767169?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_9351a356135b4be2b1b32f9d9a06d2f9@6314151_oswg1197231oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>谁能保证超级数字员工不是下一个AI落地的窗口</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_6e242d7cc0d94a1085c79adf6b3ef6f3@6314151_oswg560oswg900oswg30_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>撰文<strong>&nbsp;|</strong>&nbsp;李嘉星</p>\n  <p>编辑<strong>&nbsp;|</strong>&nbsp;张薇</p>\n  <p>封面来源<strong>&nbsp;|</strong>&nbsp;元企AI</p>\n  <p><br />&nbsp;</p>\n  <p>七月初，秋招开始预热。你投出去的下一份简历，可能不是先被HR看到，而是先被一个AI员工读完。</p>\n  <p>机器筛简历并不新鲜。真正有意思的是，如果这个AI不只是帮HR筛一下简历，而是像一个新入职的同事一样，被交代一个目标后，自己去找人、沟通、打分、汇报结果呢？</p>\n  <p>最近，元企AI推出了第一款产品“超级HR”。<strong>它不是一个只解决单点环节的工具，而是试图像一个员工一样接下任务：拆解岗位需求，去招聘平台找人，看你的项目经历，给你打一个匹配分，再把“是否值得继续沟通”的理由交给人类HR。</strong></p>\n  <p>今年3月底，清华博士陈猛和他的大学室友、北大博士杨一博，正式启动了元企AI的创业。</p>\n  <p>这不是陈猛第一次创业。</p>\n  <p>在做元企AI之前，他已经连续做过多个项目，经历过教育SaaS、钠电池、车载光伏等方向。</p>\n  <p>也正因为长期和企业打交道，陈猛对企业里的成本问题很敏感。</p>\n  <p>“最近几年和企业家聊天，大家最常聊的就是降本增效。与此同时，很多岗位也存在人的不确定性，比如请假、离职，有些很重要的岗位突然离职，会影响企业业务推进。”这是陈猛与各个企业家交流后发现的问题。那么，企业有没有可能拥有一个更稳定的岗位形态，让企业更稳定，而且成本更低？</p>\n  <p>陈猛给出了他的答案。<strong>做一套像人的数字员工平台。</strong></p>\n  <p>先从招聘需求开始。</p>\n  <p>陈猛告诉“未来人类实验室”，在调研中他们发现，猎头或人力资源服务公司前段找人和沟通可能占掉大量时间。对HR和猎头来说，招聘前段的大量工作并不性感。找简历、翻简历、初筛、沟通、推进面试、整理候选人，这些事耗时、重复，却不一定产生最高价值。</p>\n  <p>如果这部分工作能交给AI，人的时间就可以被释放到更需要判断和关系处理的地方：理解业务需求、和客户对齐岗位画像、判断候选人是否适合组织，以及促成最终成交。</p>\n  <p><strong>很关键的一点是，它得像个人。</strong>用户不是让它“帮我筛一下简历”，而是直接给它一个任务：我要招一个电子工程师。然后它自己拆任务、去平台找人、筛简历、看项目经验、打分排序、汇报结果，再让人确认下一步。换句话说，它不是嵌在平台里的工具，而是围绕“招到合适的人”这件事往前推进。</p>\n  <p>但一个新员工刚入职，也不可能第一天就完全懂公司。元企AI对超级HR的理解也是如此。它不是一上来就变成一个满分员工，而是需要在和企业的持续交互中，慢慢理解这家公司到底想要什么样的人。比如同样招产品经理，有的公司更看重大厂经验，���的公司更看重创业公司里从0到1把事情跑通的经历；有的岗位学历是硬门槛，有的岗位项目经验更重要。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_c9eb27e4d7bc4d5d8bbad4a0b441f6de@6314151_oswg335486oswg1080oswg631_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI员工市场</p>\n  <p>&nbsp;</p>\n  <p><strong>它还远不是一个完美员工。</strong></p>\n  <p><strong>“目前行业对数字员工存在两个极端概念，一个是过度悲观，一个是过度乐观。”</strong>陈猛告诉“未来人类实验室”。他认为短期内，Agent可能主要解决局部的、重复的、可标准化的环节。之后才可能逐步进入更完整的业务流程。不能因为技术有缺陷就否定方向，也不能因为技术进步就说马上能实现。</p>\n  <p>陈猛也承认，客户最关心的就是两件事：幻觉和数据泄露。企业没有的福利，AI不能凭空说有；企业是单休，AI不能说成双休。企业交给数字员工的账号和招聘数据，也不能被泄露或滥用。</p>\n  <p>超级HR只是一个开始。元企AI接下来还想把这套能力复制到财务、法务、销售等企业基础岗位。它已经完成种子轮数百万元融资，正在推进天使轮融资。</p>\n  <p>它的长期设想，是让企业用自然语言生成不同岗位的数字员工。而一个AI进入组织之后，能不能被管理、被限制、被评价，也能在出错时被追踪，正是它能否在企业的业务流中落地的关键要素。</p>\n  <p>以下是“未来人类实验室”与元企AI创始人陈猛的对话，经整理发布——</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_62d6098357c648be8f160fff85f540ee@6314151_oswg1788oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>工具解决环节，员工解决任务</strong><br />&nbsp;</h2>\n  <p><strong>未来：你们为什么一定要把它叫数字员工，而不是AI招聘工具？</strong></p>\n  <p><strong>元企AI</strong>：工具解决的是环节，员工解决的是任务。</p>\n  <p>普通工具可能帮你做一个环节，比如筛一下简历、写一段话、生成一份报告。但数字员工是任务导向的。你不是让它“帮我筛一下简历”，而是告诉它“我要招一个电子工程师”。它需要围绕这个目标，自己去拆解任务、找人、筛选、沟通、打分、总结，并把结果交付给人。</p>\n  <p>它更像一个线上员工。用户不需要每一步都盯着它，它需要自己推进任务，并在关键节点向人汇报。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：一个AI要做到什么程度，才算从工具变成了员工？</strong></p>\n  <p><strong>元企AI</strong>：我们希望它能够像人一样完成闭环。</p>\n  <p>现在市面上很多做超级数字员工的公司，其实做的是工作流，只能完成一些环节。比如RPA、淘宝客服这类，有很多地方需要人介入，不能自己闭环完成一个工作。</p>\n  <p>比如一个任务有A、B、C、D、E五个环节，它可能只能解决A、C、D，中间还有环节需要人介入。这样效率提升就没有那么明显。</p>\n  <p>我们希望它像人一样独立完成一个闭环工作。比如我让一个人类HR招一个财务或行政，他的目标肯定是招到这个人为止。中间如果他对需求有误解，再和我确认、及时修正，但最后交付物应该是一个完整候选人，而不是每一步都来问我。</p>\n  <p>如果每一步都要打断我，其实没有给我省很多时间，甚至还挺耽误事。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：它在哪些地方必须像人，哪些地方又不能太像人？</strong></p>\n  <p><strong>元企AI：</strong>像人的地方，是要能闭环工作，像一个聪明上进的好员工。</p>\n  <p>不像人的地方，一个是人需要休息，但AI可以7×24小时实时在线响应。另一个是成本。大规模商用必须把成本降下来。</p>\n  <p>比如一个资深招聘HR，年薪可能五六十万、六七十万。我们希望一年5万到10万元以内，就能把这个成本包住。它可能能顶80%的资深HR，但成本只有那个HR的20%。这样才是真正能帮到企业，而不是一个面子工程。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：如果把超级HR放进一个真实招聘流程里，它具体做哪些事？</strong></p>\n  <p><strong>元企AI：</strong>它主要做招聘前段比较重复、低效、费时间的工作。</p>\n  <p>比如从一个招聘漏斗看，可能一开始有1万个人，其中对公司有意向的大概200个；这200个里面，公司感兴趣的可能30个；这30个经过几轮沟通，双方都OK的可能5到6个。</p>\n  <p>我们解决的是从一两千人到三四百人，甚至到30人的这段工作。比如找简历、筛简历、判断匹配度、做初步沟通、整理结果。最后候选人来不来，还要看HR怎么和他沟通，怎么推销公司，怎么判断价值观是否匹配。</p>\n  <p>所以我们解决的是匹配工作，HR还是要做更高端的沟通、判断和关系处理。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：那它现在不能做什么？哪些环节必须由人确认？</strong></p>\n  <p><strong>元企AI</strong>：一头一尾目前还需要人。</p>\n  <p>头是招聘需求。HR本身不生产需求，很多需求来自老板或业务团队。所以真实、明确的招聘需求，还是需要业务团队或老板输入。</p>\n  <p>尾是终面。AI可以帮你匹配简历上的信息，但到最后合不合眼缘，或者一些软实力，比如销售的沟通情商、组织适配度，还是需要人做最终判断。</p>\n  <p>目前AI可以通过简历和初步沟通帮你兜住底线，但上限判断仍然需要人。比如你希望销售是严谨型、数据型，还是春风化雨型，这种偏好需要人做最终决策。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_36a52e3ef05a4ae7aa5247d71e42c28a@6314151_oswg2308oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>唯一你会觉得它像AI的地方，可能是它回得太快</strong></h2>\n  <p>&nbsp;</p>\n  <p><strong>未来：现在外面很多AI产品都能聊天。你们怎么判断一个数字员工是不是真的落地？</strong></p>\n  <p><strong>元企AI：</strong>我觉得不能只看它会不会聊天，而要看它能不能进入真实业务流。</p>\n  <p>对招聘来说，真实业务流不是回答几个招聘问题，而是从岗位需求开始，去找人、筛人、沟通、打分、汇报结果。它要能把这些事情串起来。</p>\n  <p>我们现在更偏产品，不是自己做底层模型。模型层调用市面上成熟的大模型，重点是在应用层、上下文、长期记忆和成本控制上做工作。</p>\n  <p>如果一个资深HR自己用大模型手搓一个AI招聘产品，产品力可能也能接近我们。但直接用大模型非常耗token，而且它不会长期记住你的偏好，每次都要重新磨合。</p>\n  <p>我们要做的是让它记住企业的偏好，降低调用成本，让它真正变成一个可以长期使用的产品。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：你们为什么第一步先服务猎头、招聘团队，而不是直接服务所有中小企业？</strong></p>\n  <p><strong>元企AI：</strong>因为猎头、招聘团队有批量重复需求，而且付费意愿更强。</p>\n  <p>一个十几二十人的中小企业，正常一年可能只招六七个人。让它花一万多或三万块买一个专业版，并不一定划算。老板自己空的时候看一看，也能处理。</p>\n  <p>但猎头不一样。猎头招得越多，赚钱越多。他们有大量招聘需求，也有很强的效率诉求。大厂的专门招聘团队、快速扩张的创业公司招聘团队，也有类似需求。</p>\n  <p>我们的最终目标是服务中小企业，但中小企业不会在A公司买AI招聘、B公司买AI法务、C公司买AI销售。我们希望未来把AI人力、财务、销售、品宣做成一个综合岗产品。到那个时候，中小企业过去可能要找四五个员工，未来找我们一家，就可以覆盖很多基础岗位需求。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：一个普通求职者，可能会最先感受到什么变化？</strong></p>\n  <p><strong>元企AI：</strong>最直接的是响应速度。</p>\n  <p>比如你问加不加班、出差频率、五险一金，过去可能要等HR几个小时，甚至等到周一。AI如果提前知道这些信息，就可以7×24小时及时回答。</p>\n  <p>人类HR处理10份简历时，可能还能高效、温柔地回复你；处理100份时，可能就会疲惫、出错。但AI处理10份还是100份，标准都不会变。</p>\n  <p>这对求职者来说，体感会更好。一方面能感受到公司更及时的回应，另一方面也能更快判断自己和岗位是否匹配。<br />&nbsp;</p>\n  <p><strong>未来：求职者会知道自己正在和AI沟通吗？</strong></p>\n  <p><strong>元企AI：</strong>从我们现在的演示看，它回答得还蛮像真人。比如加不加班、出差频率这些问题，唯一让你觉得它像AI的地方，可能是它回得太快。</p>\n  <p>但我们作为商用产品，会对规则限制得很死。比如公司没有的福利，它不能乱说；月薪8000的岗位，它不能随便承诺能开到2万。它可以不知道，但不能乱说。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：如果一个人学历一般，但项目经历很好，AI会不会把他误伤？</strong></p>\n  <p><strong>元企AI：</strong>这取决于用人团队给AI的需求是否明确。</p>\n  <p>比如老板到底更看重大厂背景，还是更看重创业公司里一个人hold住完整链路的经历？学历是必须项，还是加分项？项目经历是必须有某类技术经验，还是加分项？这些都要先讲清楚。</p>\n  <p>AI会把这些需求拆成多维度评分。比如英语能力对出海项目可能占30%到40%，但对中后台岗位可能只占5%到10%。如果第一批简历不OK，人也可以反馈给AI，AI会调整打分项。</p>\n  <p>传统筛简历可能更像关键词匹配，但AI可以看项目经历里的语义。只要候选人把项目写在简历上，AI就能识别并判断匹配度。</p>\n  <p>但它也有边界。如果候选人简历上没有写出来，AI可能会把他挂掉；而人类HR通过电话追问，把隐藏经历问出来，这件事目前AI还不一定能做到。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：那正在做HR的人应该担心什么？</strong></p>\n  <p><strong>元企AI：</strong>我觉得不是简单说替代HR，而是把HR从低效重复工作里解放出来。</p>\n  <p>AI更适合做匹配、初筛、整理这些前段工作。人类HR还是要做更复杂的沟通、判断和关系处理，比如理解业务需求、判断候选人和组织是否适配、把公司推销给候选人。</p>\n  <p>未来可能被淘汰的，不是HR这个岗位，而是不会用AI的人，或者用AI比较晚的人。用得早的人，会先享受到效率提升。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_dc6b836130a54f61a8885963e2a5e178@6314151_oswg2380oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>越像员工，越需要被管理、审计和限制</strong></h2>\n  <p><strong>未来：数字员工越像人，是不是也越需要被管理？</strong></p>\n  <p><strong>元企AI：</strong>是。尤其是商用产品，安全性非常重要，甚至是生命线。</p>\n  <p>免费产品出错，大家可能觉得好笑。但如果用户一年花3万块钱买一个AI产品，它出错，轻则退款，重则产生声誉风险。</p>\n  <p>所以我们从公司成立第一天，就把安全性写进准则里。比如AI在招聘软件上回答问题，不知道就不能回答。它可以不知道，但不能乱说。<br />&nbsp;</p>\n  <p><strong>未来：客户最担心它出什么错？</strong></p>\n  <p><strong>元企AI：</strong>一类是幻觉。比如企业没有的福利，AI不能凭空说有；岗位月薪8000元，它不能承诺2万元；公司是单休，不能说成双休。</p>\n  <p>另一类是数据安全。招聘里会涉及账号、简历、候选人信息、搜索记录，这些信息不能泄露，也不能被滥用。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：你们在安全上有哪些具体措施？</strong></p>\n  <p><strong>元企AI：</strong>首先沙盒我们会做。我们服务不同猎头，他们之间的简历信息不重叠。包括训练大模型，我们用的是脱敏后的用户行为，而不是简历本身。</p>\n  <p>云端会做相应部署。未来面对一些大客户，我们也会支持本地部署模型，这样资料根本不会上云，可以保存在公司内部。所以我们现在用很多国产开源模型，也是因为未来希望服务需要本地化部署的公司。</p>\n  <p>另外，算法层面也会做一些安全提升。我们的技术负责人之前做过一些算法研究，比如数据离散化处理、数据加密等。基础安全能力，商用产品肯定会做；一些已经公开发表的核心算法，后续也会运用进来。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：Gartner提醒过，很多Agent项目可能因为成本、价值和风控问题被取消。你们怎么避免变成“agent washing”？</strong></p>\n  <p><strong>元企AI：</strong>我们也认同这个判断。确实有很多AI应用看起来很fancy，但不是真实需求，也不是可持续付费的东西，而且没有很深壁垒。</p>\n  <p>比如AI PPT，去年很火，刚出来时用户数很多。但今年很多做AI PPT创业的公司已经没有那么强的存在感。因为它很容易被抄，产品生命周期也比较短。</p>\n  <p>我们公司成立之初就想好，要做产品矩阵，也要持续进化。比如我们现在比市面产品领先3到6个月，等别人摸清我们的产品后，我们已经进化到下一层，和其他公司保持代际差别。</p>\n  <p>很多所谓AI招聘产品，其实是过去SaaS公司或RPA产品重新包装出来的。比如五六年前淘宝客服可以回答几天发货、女装尺码，五年后还是只能回答这些问题，因为它本质上是配置知识库，不是自我学习和进化。</p>\n  <p>我们要做数字员工基座，让它有持续进化能力。对我们来说，关键不是包装成Agent，而是能不能进入业务流、能不能持续交付、成本能不能降下来。</p>\n  <p>&nbsp;</p>\n  <p><strong>未来：你们怎么看数字员工的长期趋势？</strong></p>\n  <p><strong>元企AI：</strong>我觉得将来Agent会是人手一个。</p>\n  <p>但实际情况是，谁先把产品打磨得更好，谁更懂用户，谁的成本最低，谁才能真正铺开。</p>\n  <p>很多大厂有资金、数据和资源优势，但它们也有历史包袱。我们和大厂是差异化竞争。大厂更多瞄准大中型客户，我们更希望做AI平权，服务中小用户。</p>\n  <p>基础蓝领工作和基础白领工作，未来一定会被AI和机器人影响。AI应用会影响基础白领工作，机器人会影响基础蓝领工作。这是一个大的方向。但具体谁能跑出来，还是要看产品能不能真实落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_cc707296b8f4413889de829446e34961@6314151_oswg2587oswg900oswg47_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_3187d5cec6a045f5bfa42e5c8afd97ee@6314151_oswg30520oswg901oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_b0935275325d480f8ddd422b61eb40e1@6314151_oswg145672oswg901oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_051155196c354b1eb745ced30890f20d@6314151_oswg2783oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>你如何看待超级数字员工的发展趋势？</strong><br />&nbsp;</p>\n  <p><strong>欢迎在评论区分享你的看法~</strong></p>", "category": "tech", "published_at": "2026-07-24T10:34:07+00:00", "fetched_at": "2026-07-25T02:12:14.200935+00:00", "fingerprint": "55722f4c4e49d26a"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜黄仁勋力挺中国AI开源模型；市场监管总局：深入整治“内卷式”竞争", "url": "https://36kr.com/p/3909160840451465?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>字节跳动在中卫成立朔方星河科技公司，注册资本24亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，中卫朔方星河科技有限公司成立，法定代表人为田凯，注册资本24亿人民币，经营范围包括信息技术咨询服务、软件开发、信息系统集成服务、网络设备销售等。股东信息显示，该公司由北京字跳网络技术有限公司全资持股。</p>\n  <p><strong>周生生、老凤祥等品牌金饰价格集体下调</strong></p>\n  <p>当地时间7月23日，黄金白银大跌，油价狂飙。现货黄金跌1.96%，报4049美元；现货白银跌3.60%，报57.5967美元/盎司。国际贵金属期货普遍收跌。COMEX黄金期货跌2.4%，报4052.30美元/盎司；COMEX白银期货跌3.99%，报57.90美元/盎司。北京时间24日，现货黄金、现货白银持续下跌。记者梳理发现，国内品牌金饰价格经历三连涨后再次大跌，周生生足金饰品报1227元/克，单日大跌31元；老庙黄金足金饰品现报1231元/克，单日大跌27元；老凤祥足金饰品现报1229元/克，单日大跌24元。（中新经纬）</p>\n  <p><strong>黄仁勋力挺中国AI开源模型</strong></p>\n  <p>据美国媒体当地时间22日报道，英伟达公司创始人兼首席执行官黄仁勋在接受采访时谈及中国人工智能发展，称中国开源AI模型非常优秀，美国不应惧怕中国的开源AI模型。黄仁勋表示：“这些中国大模型非常出色，出色的开源大模型应该得到使用。我认为，优秀的开源AI大模型对整个行业大有裨益。”多家外媒指出，中国快速推出高性价比的AI模型，打破了此前业界对中美AI技术差距的共识，给硅谷带来了极大的震撼。（央视财经）</p>\n  <p><strong>Mobileye宣布计划进行领导层过渡，沙舒亚拟卸任CEO一职</strong></p>\n  <p>Mobileye 7月23日宣布，其创始人阿姆农·沙舒亚（Amnon Shashua）已向董事会表示，一旦继任者就任，他将辞去公司首席执行官一职。董事会将开展全面的首席执行官遴选流程以确定继任者。董事会已提议在新任首席执行官就职后，由沙舒亚出任公司董事长。（界面）</p>\n  <p><strong>裕信银行CEO称有望第四季度完成对德商银行收购</strong></p>\n  <p>意大利最大商业银行裕信银行（UniCredit）首席执行官安德里亚·奥塞尔周四接受采访时表示，该行可能在第四季度完成对德国商业银行（Commerzbank）的收购。奥塞尔表示，裕信银行对在德国商业银行的持股地位感到满意，目前已将持股比例提升至48%，正逐步实现对该银行的完全控制。（新浪财经）</p>\n  <p><strong>证监会同意信诺维科创板IPO注册</strong></p>\n  <p>36氪获悉，证监会日前下发关于同意苏州信诺维医药科技股份有限公司首次公开发行股票注册的批复，同意该公司首次公开发行股票并在科创板上市的注册申请。</p>\n  <h2>投融资：</h2>\n  <p><strong>Meta在最新120亿美元数据中心融资中面临更高借贷成本</strong></p>\n  <p>据报道，债券投资者正寻求在最新一笔120亿美元Meta支持的数据中心交易中获得显著更高的收益率，与九个月前达成的条款相比，市场已将人工智能融资的更高风险计入价格。据知情人士透露，位于德克萨斯州埃尔帕索、容量近1吉瓦的数据中心项目，正计划通过贝莱德旗下特殊目的公司发行债券，初步讨论中收益率超过7%。上述人士补充称，价格讨论仍处于早期阶段，最早可能于下周一正式启动交易时发生变化。（新浪财经）</p>\n  <h2>新产品：</h2>\n  <p><strong>COLMO发布一风口内机与图灵Pro全时三管制中央空调</strong></p>\n  <p>7月23日，AI科技家电品牌COLMO举办图灵Pro新品发布会，推出行业首创一风口中央空调室内机、图灵Pro全时三管制中央空调。新品将出回检三口归一，实现单一线性槽道安装，释放层高与柜体空间；搭载3Hz超宽频压缩机与AI算法，实现全地域±0.2℃精准控温，搭配AI智慧屏，打造全屋智能空气中枢。</p>\n  <h2>今日观点：</h2>\n  <p><strong>市场监管总局：深入整治“内卷式”竞争</strong></p>\n  <p>36氪获悉，7月23日，市场监管总局召开2026年第二季度工作点评会，盘点、调度第二季度各单位贯彻落实党中央、国务院决策部署和总局重点任务情况，对第三季度重点工作作出安排。会议要求，要坚决落实好党中央各项决策部署，深入整治“内卷式”竞争，扎实抓好网约配送员群体党建工作，深化群众身边不正之风和腐败问题集中整治，抓好重点领域专项整治，结合职责做好防汛抗旱。要强化全面从严治党政治责任，组织开展好党组第五轮内部巡视，进一步营造风清气正干事创业浓厚氛围。</p>\n  <p><strong>北京：鼓励发展Token（词元）经济，加大算力券等支持力度</strong></p>\n  <p>36氪获悉，北京市发展改革委等部门联合印发《北京市关于加快智能体引领发展的若干措施》，推动智能体创新引领发展，率先培育智能经济新形态。鼓励发展Token(词元)经济。推动创新主体研发适配智能体系统调用、复杂任务调度与高频决策的通用处理器，开发低延迟、高吞吐专用推理芯片。推动创新主体开展推理架构等关键技术攻关，通过异构协同、存算协同以及智能调度等降低推理成本，加快推理缓存复用、智能任务路由等应用层效率优化，全链路优化提高Token效率。重构产品形态和服务模式，培育Token即服务（TaaS）、智能体即服务（AaaS）、结果即服务（RaaS）等商业新模式，推动更多符合条件的Token新产品新服务纳入中小企业服务券配券产品范围。加大算力券等支持力度，鼓励有条件的区联合创新主体探索发放Token券、智能体服务券等加速智能体等推广应用。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>中国脑机接口重要突破，首次实现跨地域上千人同步脑电信号采集</strong></p>\n  <p>脑机接口是全球未来产业的重要赛道，而大规模、高质量的脑电数据，是推动技术从实验室走向产业化的核心基础。昨天下午，我国科研团队发布一款新型脑电信号采集装置，在全球范围内首次实现跨地域上千人同步脑电信号采集，使得神经大模型训练与脑机接口通用技术研发迈出关键一步。研发团队介绍，实现千人级跨地域同步采集，核心攻克了两大技术难关：一是在设备小型化的同时保障信号采集精度，二是克服网络延迟影响，实现多设备、多地域间的毫秒级时间精准对齐，确保不同脑电信号可以统一分析。未来，规模化脑电采集技术将持续沉淀数据，用于训练神经基础模型。这也意味着，AI的学习素材将不再局限于文字、图片、视频等间接信息，而是可以直接通过神经信号理解人类的认知状态。（央视财经）</p>\n  <p><strong>商务部：1-6月智能外骨骼和智能眼镜网零额分别增长458.4%和151.7%</strong></p>\n  <p>36氪获悉，商务部电子商务司负责人介绍2026年1-6月我国电子商务发展情况。围绕品质消费升级“全国网上年货节”“双品网购节”，释放消费潜能。据国家统计局数据，1-6月全国网上商品零售额增长4.8%，拉动社会消费品零售总额增长1.2个百分点。智能商品持续增长亮眼，据商务大数据监测，智能外骨骼和智能眼镜网零额分别增长458.4%和151.7%。据国家统计局数据，网上服务零售额增长6.0%。据商务大数据监测，旅游和餐饮网上销售额分别增长27.2%和13.9%。</p>\n  <p><strong>遨天甘德一号01星发射成功</strong></p>\n  <p>北京时间7月24日7时33分，中科宇航力箭一号运载火箭在东风商业航天创新试验区成功发射，顺利将甘德一号01星等5颗卫星送入预定轨道。据了解，甘德一号01星是遨天科技（北京）有限公司建设的空间碎片监测星座首发星，也是国内首颗商业空间碎片监测卫星。卫星入轨后太阳帆板展开正常，姿态稳定，发射任务取得圆满成功。此次首发星成功发射，标志着遨天甘德星座组网建设正式拉开序幕。</p>\n  <p><strong>外交部副部长马朝旭访问美国</strong></p>\n  <p>2026年7月22日至23日，外交部副部长马朝旭应邀访问美国，同美国常务副国务卿兰多举行磋商，会见白宫国安会亚洲事务高级主任卡纳帕蒂、国防部副部长科尔比，同国会参众两院议员交流，就落实中美两国元首重要共识、推动构建中美建设性战略稳定关系深入交换意见。（央视新闻）</p>\n  <p><strong>美政府宣布向人工智能科学研究领域拨款50亿美元</strong></p>\n  <p>美国白宫科技政策办公室主任迈克尔·克拉齐奥斯22日宣布，美多个联邦机构已承诺向由能源部统筹的“创世纪使命”（Genesis Mission）倡议拨款超50亿美元，旨在利用人工智能（AI）技术加速基础科学研究。分析指出，此举标志着美行政当局正加速重塑联邦科研资金分配模式，进一步将资助重点向人工智能赋能项目及独立研究人员倾斜。（新浪财经）</p>", "category": "tech", "published_at": "2026-07-24T11:00:26+00:00", "fetched_at": "2026-07-25T02:12:14.200928+00:00", "fingerprint": "e74592de694b307b"}, {"source": "36氪 - 最新文章", "title": "AnySearch 面向全球推出 “学生与开发者成长计划”", "url": "https://36kr.com/p/3909565569324163?f=rss", "summary": "<p>7月24日，在 AnySearch 北京开发者沙龙活动现场，AnySearch 创始人兼CEO 薛冠群正式宣布推出“<strong>AnySearch 学生与开发者成长计划”（AnySearch Student &amp; Developer Program）</strong>。该计划面向全球学生与开发者开放，旨在通过提供开放的 AI 搜索基础设施，支持更多 AI 创造者开展学术研究、开源创新和 AI 应用开发。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260724/v2_6437390d17404bc8b92ebc746ecc4171@5284654_oswg33383oswg828oswg463_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片1</p>\n  <p>随着 AI 加速演进，AI 应用正在从简单信息交互迈向复杂任务执行，AI Agent 正在成为下一代应用的主流形态。在这一趋势下，实时、高质量的信息获取能力是 AI Agent 看见世界、完成任务的关键基础。然而，对大量学生和早期开发者而言，获取稳定、可靠的基础设施服务仍存在一定门槛。</p>\n  <p>AnySearch 希望通过“学生与开发者成长计划”，进一步降低 AI 创新的成本，让更多创造者能够依托高质量的信息获取能力，快速验证想法、构建应用，并参与到下一代 AI 生态的构建中。“AI 的发展不仅依赖模型能力的突破，更需要广大开发者将技术转化为真实应用。”薛冠群表示，“我们希望借助这一计划，让全球在校学生和开发者便捷地获得 AI 基础能力支持，从探索想法到应用落地，加速 AI 创新进程。”</p>\n  <p>作为面向 AI 时代的搜索基础设施，AnySearch 致力于为 AI Agent 提供统一、高质量的信息搜索入口。开发者可以通过 API、MCP、Skill 三种方式，将 AnySearch 接入各类 AI Agent、AI 工作流和智能应用中，帮助 AI 获取更及时、准确且可追溯的信息，为复杂任务提供可靠支撑。截至目前，AnySearch 已吸引全球超过 20 万名开发者使用，累计搜索调用超过 2000 万次。</p>\n  <p>此次推出的“AnySearch学生与开发者成长计划”，是 AnySearch 推进全球生态建设的重要一步。该计划面向全球高校学生、AI 开发者及开源项目贡献者，参与者在AnySearch官网完成认证后，每天可获得 2000 次免费搜索调用额度，用于学术研究、课程实践、AI 应用开发和开源项目探索等。</p>\n  <p>AnySearch 认为，AI 的下一阶段发展不仅依赖模型能力的跃升，也需要搜索、数据和工具调用等基础能力持续进化。通过开放 AI 搜索基础设施，AnySearch 希望进一步降低开发者的创新门槛，推动更多 AI 应用从探索走向落地。</p>", "category": "tech", "published_at": "2026-07-24T11:36:12+00:00", "fetched_at": "2026-07-25T02:12:14.200920+00:00", "fingerprint": "11874ed61a5ab07c"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜宇树科技CEO王兴兴登上《时代》杂志封面；国家反诈中心App可一键检测AI生成痕迹；Claude Opus 5正式发布", "url": "https://36kr.com/p/3910351337821318?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>小鹏主动召回3.35万辆X9，涉及前空气弹簧安全隐患</li>\n   <li>微信撤回消息后可删除提示字</li>\n   <li>怡颗莓莓果线下仍在售，公司称针对近期舆论正准备维权</li>\n   <li>菲尔兹奖得主雅各布·齐默曼将加入OpenAI</li>\n   <li>欧盟对谷歌处以8.9亿欧元罚款</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>宇树科技CEO王兴兴登上《时代》杂志封面</strong></p>\n  <p>当地时间7月23日，宇树科技创始人兼CEO王兴兴与其载人机甲产品GD01共同登上《时代》杂志封面，标题为《机器人时代来临》。</p>\n  <p>据悉，距上次中国企业家登上该刊物封面，已过去整整8年。</p>\n  <p>《时代》杂志评价王兴兴是“AI时代一位非典型的预言者”，“他身材瘦削，戴着眼镜，完全没有许多科技创始人身上那种张扬的傲气。相反，他在谈论机器人技术时，带着一种安静而坚定的信念”。（澎湃新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_646a451123024b64a1fa218b0da952f2@6100851_oswg997001oswg1080oswg1439_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>公安部：国家反诈中心App可一键检测AI生成痕迹</strong></p>\n  <p>7月24日，公安部刑事侦查局局长姜国利在上午举行的国新办新闻发布会上介绍，公安机关在国家反诈中心App上构建了人工智能内容鉴定功能，大家可以上传可疑视频、语音、图片，一键检测是否存在人工智能生成痕迹，鉴别伪造信息。（人民网）</p>\n  <p><strong>Anthropic推出Claude Opus 5，性能接近Fable 5但成本减半</strong></p>\n  <p>7月25日，Anthropic正式发布最新旗舰AI模型Claude Opus 5。官方称，Opus 5在编程、Agent任务及复杂推理等能力上进一步提升，整体性能接近更高端的Claude Fable 5，但API价格仍维持上一代Opus 4.8水平，为每百万输入Token 5美元、输出Token 25美元。Anthropic表示，该模型更适合企业办公、软件开发等日常高频场景，并进一步增强了安全性和抗滥用能力。目前，Claude Opus 5已向Claude平台及API用户开放。（极客公园）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯混元合并大语言模型与多模态团队，成立基础模型部</strong></p>\n  <p>36氪获悉，腾讯宣布混元多模态模型部门与大语言模型部门合并，成立基础模型部，统一由腾讯首席AI科学家姚顺雨管理，以进一步提升模型研发和协同效率，探索全模态模型的智能上限。</p>\n  <p><strong>美图旗下AI Agent RoboNeo上线专业级3D导演台功能</strong></p>\n  <p>36氪获悉，美图旗下AI Agent RoboNeo发布新版本，正式上线专业级3D导演台功能。同时，支持更高效的后期处理，包括字幕去除、画质增强、光线调整、背景优化等功能。此外，RoboNeo围绕AI短片创作推出项目资产库、全链路工作流、升级版剧本与分镜生成等多项能力。</p>\n  <p><strong>亚马逊升级Alexa+AI助手，新增多项智能代理功能</strong></p>\n  <p>亚马逊7月24日更新Alexa+功能，进一步强化其下一代AI助手能力。Alexa+支持自然对话、信息记忆和任务执行，可帮助用户管理日程、总结邮件、生成播客、控制智能家居，并完成购物、餐厅预订、叫车等日常任务。此次更新中，Alexa+新增AI生成个性化播客功能，可根据用户兴趣制作音频内容；同时支持读取用户上传的文件、照片和文档，并基于内容生成摘要、问答或学习测试。此外，Alexa+可通过连接日历和邮箱提取信息，自动创建日程和提醒。在智能家居和消费场景方面，Alexa+可通过语音创建自动化程序，分析Ring摄像头事件，帮助用户管理家庭设备；同时整合购物、音乐、FireTV等生态服务，提供个性化推荐和AI辅助购物体验。（界面新闻）</p>\n  <p><strong>菲尔兹奖得主雅各布·齐默曼将加入OpenAI</strong></p>\n  <p>当地时间7月23日，新晋菲尔兹奖得主雅各布·齐默曼（Jacob Tsimerman）宣布转向人工智能安全研究，并将加入OpenAI。OpenAI多名研究负责人已公开欢迎其加入。</p>\n  <p>齐默曼对AI风险的关注并非近期出现。2025年，他与安德鲁·克里奇（Andrew Critch）共同发表论文，系统梳理了人工智能可能导致人类接近灭绝的潜在路径。论文并未认为AI导致人类灭绝是必然结果，而是希望推动相关预防措施。（界面新闻）</p>\n  <p><strong>微软、英伟达、Meta、IBM等科技巨头，发布联合声明，黄仁勋新开X账号发帖助阵</strong></p>\n  <p>7月24日，微软总裁布拉德·史密斯等美国科技行业人士发布题为《开放权重与美国AI领导力》的文章，呼吁推动开放权重人工智能模型发展，认为开放生态有助于扩大AI应用、促进竞争。该文章署名机构和企业包括微软、英伟达、Meta、IBM等多家AI相关机构。</p>\n  <p>值得一提的是，北京时间7月24日深夜，英伟达创始人兼首席执行官黄仁勋注册了社交媒体X账号。黄仁勋的首个帖子，就是这封英伟达参与联署的信件，强调开源人工智能模型的重要性。（每日经济新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小鹏主动召回3.35万辆X9，涉及前空气弹簧安全隐患</strong></p>\n  <p>国家市场监督管理总局消息，肇庆小鹏新能源投资有限公司备案召回计划，自2026年8月28日起，召回2023年8月8日至2025年8月11日期间生产的33473辆小鹏X9。因制造工艺波动，部分车辆前空气弹簧气密性下降，在高温高湿环境长期使用后可能缓慢漏气，极端情况下影响车辆操控性，存在安全隐患。小鹏将免费为召回范围内车辆更换改进后的前空气弹簧滑柱总成，以消除安全隐患。部分车辆此前已更换改进后的零部件，本次召回此部分车辆无需再次更换。（澎湃新闻）</p>\n  <p><strong>TVB正式更名为“无线集团”</strong></p>\n  <p>据TVB官方微博消息，TVB宣布正式更名为“无线集团”，由传统电视台升级为跨媒体娱乐集团。业务更多元化，拥抱创新AI技术，市场拓宽到大湾区。（澎湃新闻）</p>\n  <p><strong>微信撤回消息后可删除提示字</strong></p>\n  <p>据悉，微信8.0.76版本更新了新功能，用户可以将撤回后显示的灰色提示字删除，达到“无痕”撤回的效果了。用户可以长按“你撤回了一条消息”灰色提示词，点击删除即可。不过，据用户反馈，删除撤回只是自己的手机上看不见了，接收消息的一方仍然存在“对方撤回了一条消息”的提示。（都市快报）</p>\n  <p><strong>英伟达据悉上调GeForce显卡套件价格，覆盖GDDR7和GDDR6产品</strong></p>\n  <p>据悉，英伟达已经向下游显卡制造商又一次发出GPU套装（GPU+显存芯片）涨价通知，核心原因依然是存储价格持续上涨。据悉，此次涨价同时涉及GDDR7显存和上一代GDDR6显存。这意味着除了使用Blackwell架构的大多数50系显卡外，RTX 5050以及更古早的显卡都会受到影响——例如近期以2022年原始建议零售价重返市场的RTX 3060 12GB显卡。报道称，这一轮涨价是今年5月英伟达上调旗舰显卡RTX 5090（包括中国特供版RTX 5090D V2）GPU套装价格后的最新调整。在那次涨价中，其余显卡并未受到波及。（财联社）</p>\n  <p><strong>欧盟对谷歌处以8.9亿欧元罚款</strong></p>\n  <p>欧盟委员会认定谷歌在搜索引擎和开发者引导两方面违反《数字市场法》，开出总计8.9亿欧元罚单。若60天内未整改，将面临每日罚款。这是欧盟针对大型科技公司的最新监管行动。（IT之家）</p>\n  <p><strong>怡颗莓莓果线下仍在售，公司称针对近期舆论正准备维权</strong></p>\n  <p>7月24日，怡颗莓发表声明，针对近期围绕其产品食品安全问题引发的舆论，公司已依法开展维权准备工作。7月20日，有媒体报道称，美国浆果品牌“怡颗莓”被检出含有致癌物质“全氟和多氟烷基物质（PFAS）”。随后，沃尔玛、永辉等多家超市线上小程序下架怡颗莓相关产品。界面新闻记者实地走访多家线下零售渠道后发现，7月23日，杭州一山姆还在售怡颗莓树莓。记者将就该情况询问山姆客服，客服回应称：“感谢您的关注，对于您反馈的情况我们会为您反馈到相关部门。”此外，界面新闻记者了解到，沃尔玛线下怡颗莓相关产品已于7月21日下架。一百果园店员告诉界面新闻记者，怡颗莓蓝莓产地为云南。（界面新闻）</p>\n  <p><strong>10家航空公司、5家线上售票平台被约谈，限期完成机票超售问题自查整改</strong></p>\n  <p>7月初，京津冀三地消协组织联合开展民航机票超售认知专项调查，针对调查中发现的问题，依据《中华人民共和国消费者权益保护法实施条例》第四十条，京津冀三地消协组织于7月24日在天津对中国国际航空、中国南方航空、中国东方航空、海南航空、厦门航空、天津航空、四川航空、吉祥航空、春秋航空、河北航空等10家航空公司，以及同程、携程、飞猪、去哪儿、美团等5家线上售票平台开展联合约谈，要求上述企业在2026年8月31日前完成自查整改。（央视新闻）</p>\n  <p><strong>中国人寿回应减持兆易创新</strong></p>\n  <p>中国人寿7月20日披露，该公司名下8个单一资管计划于7月8日同日卖出兆易创新约110.97万股，变现约6.82亿元，卖出均价611.46-624.61元/股。该股票二季度末曾触及846.66元/股高点，7月24日午间收盘价报447.00元/股，较高点回调超四成。7月24日，中国人寿相关业务负责人回应记者称，公司的股票管理人对二级市场个股增持或减持，属于常态化投资行为，均基于投资配置需要。（上证报）</p>\n  <p><strong>网传券商内部发文防范长鑫科技上市炒作，多家券商分支机构人士称未收到类似通知</strong></p>\n  <p>今日上午，一份疑似券商内部风控通知在资本市场流传，针对即将登陆科创板的长鑫科技，要求分支机构防范新股炒作，引发市场广泛关注。网传通知显示，该券商要求各分公司、各营业部通过有效方式提示50万元以上客户避免参与长鑫科技上市初期炒作，理性合规交易；重点关注惯于炒新追热点、多次触发合规预警的客户，对交易所重点监控账户进行电话警示，严防异常交易行为。多家券商分支机构、财富管理条线人士均表示暂未收到此类正式通知。有券商资深投顾表示，自己从业多年至今，从未接到公司内部针对单只新股的类似通知。（每日经济新闻）</p>\n  <p><strong>摩根大通据悉将30多位量化分析师从中国内地调往新加坡和香港</strong></p>\n  <p>知情人士透露，摩根大通近几个月来已将30多位量化分析师从中国内地调往新加坡和香港，以将团队集中于区域枢纽，并更贴近业务部门。摩根大通今年早些时候成立量化交易和研究团队，借此加快推进电子交易业务，并因应非银行竞争对手带来的挑战。城堡证券和Jane Street Group LLC等做市商近年凭藉电子交易快速扩张。（新浪财经）</p>\n  <p><strong>马斯克呼吁AI公司携手合作自我审查安全问题，为此可以暂时放下与奥特曼个人恩怨</strong></p>\n  <p>美国科技亿万富翁埃隆·马斯克表示，他希望最先进的AI模型在发布前接受同行之间的审查，而不是由政府来负责审查。马斯克本人承认，领先的人工智能公司之间的合作需要他与OpenAI首席执行官萨姆·奥特曼放下分歧，尽管两人最近在社交媒体上曾有过激烈交锋。（新浪财经）</p>\n  <p><strong>三星、SK海力士据悉将与美国企业签署大额芯片供应协议</strong></p>\n  <p>韩国总统室政策室长金容范7月23日透露，三星电子和SK海力士预计将在韩国总统李在明访问硅谷期间，与美国主要科技企业公布涉及“大规模金额”的合作协议，相关协议可能包括长期存储芯片供应协议、战略投资合作以及谅解备忘录，但未透露具体金额。（界面新闻）</p>\n  <p><strong>马斯克质疑人形机器人表演大多是操控或剧本</strong></p>\n  <p>在特斯拉二季度财报电话会上，马斯克公开对整个人形机器人行业的展示提出质疑。他表示，网络上流传的各类机器人精彩演示，大多依靠提前编写动作程序或是后台人工远程操控，目前全球没有任何一款人形机器人，能仅凭语音、画面指令自主完成多样化日常工作。</p>\n  <p>半马赛事中仅四成机器人实现自主导航，其余依靠远程操控；海外多款商用机器人自带VR远程操控模式，热门短视频里的机器人互动画面也多为刻意编排。（凤凰网科技）</p>\n  <p><strong>韩国法院判令SK海力士会长崔泰源向前妻支付约6.43亿美元离婚财产分割款</strong></p>\n  <p>SK海力士的亿万富豪崔泰源（CheyTae‑won），其个人财富因人工智能热潮大幅飙升。近日，韩国法院在新一轮判决中，判令他向前妻支付9440亿韩元（约合6.43亿美元）离婚财产分割款，这场旷日持久的天价离婚官司至此接近尾声。若该判决最终生效，这将是韩国史上金额最高的离婚案。据彭博亿万富豪指数，崔泰源当前身家约56亿美元，过去一年净资产已翻倍以上。目前法院尚未明确，这笔巨款将以现金还是股票形式支付。（财联社）</p>\n  <p><strong>美股大型科技股盘前多数上涨，微软涨超1%</strong></p>\n  <p>36氪获悉，美股大型科技股盘前多数上涨，截至发稿，英特尔涨超2%，微软涨超1%，特斯拉涨0.45%，奈飞涨0.32%，苹果涨0.16%，亚马逊涨0.15%，谷歌涨0.11%；Meta跌0.34%，英伟达跌0.29%。</p>\n  <p><strong>A股史上最大规模：宁德时代拟200亿-400亿元回购股份，全部予以注销</strong></p>\n  <p>宁德时代7月24日晚发布公告，拟使用自有或自筹资金，以集中竞价方式回购A股股份，回购资金总额不低于200亿元且不超过400亿。</p>\n  <p><strong>春秋航空就机票超售致歉</strong></p>\n  <p>7月24日，春秋航空发布关于京津冀消协约谈多家航空公司和销售平台机票超售的情况说明：针对京津冀三地消协组织于7月24日开展的机票超售联合约谈，我公司通过消协公开渠道获知有关超售问题的直播后，主动安排专人线上观看及学习，并于会后第一时间派员前往消协当面汇报说明情况。经全面自查，对于约谈中反映出的不足，我们诚恳接受批评，全面整改，杜绝类似情况再次发生，并向广大旅客及消协致以诚挚歉意。（界面新闻）</p>\n  <p><strong>应对内存涨价，苹果要求OLED面板大幅降价</strong></p>\n  <p>7月24日，据报道，苹果正要求供应商降低iPhone OLED面板价格，以抵消内存半导体价格上涨带来的成本压力。据悉，苹果已向供应商提出约70美元的iPhone 18 Pro Max OLED面板采购价格，行业预计三星显示和LG显示实际供应均价约为66.5美元，较上一代产品下降约20%。（界面新闻）</p>\n  <p><strong>消息称手机品牌Nothing将在全球裁员40%，并退出中东、日本等市场</strong></p>\n  <p>Nothing正在全球关闭12个（或更多）的市场业务，退出范围涵盖中东、日本以及欧洲部分地区。此外，Nothing将在全球裁员40%。该公司分布在中国和英国伦敦（比例为7:3）的研发部门正分别面临约50%与30%-40%的裁员。自发布以来，Nothing Phone (4b)手机的全球出货量仅约2万台，而Nothing Phone (4a)与Nothing Phone (4a) Pro两个版本合计出货量约为15万台。（IT之家）</p>\n  <h2>上市进行时</h2>\n  <p><strong>智元创新已启动赴港上市流程</strong></p>\n  <p>36氪获悉，通用AI机器人公司智元创新表示，公司已启动赴港上市流程。</p>\n  <p><strong>通潮精密启动IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，芜湖通潮精密机械股份有限公司于2026年7月23日在安徽证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为中信建投证券。</p>\n  <h2>大公司财报</h2>\n  <p><strong>东方甄选：预计2026财年营收56-58亿元，同比增长约27.3%至31.8%</strong></p>\n  <p>36氪获悉，东方甄选发布公告，2026财年东方甄选总营收预计达56-58亿元，相较2025财年同比增长约27.3%至31.8%。本财年，东方甄选净溢利预计为5.2-5.5亿元，相较2025财年的净溢利，同比增长8566.7%至9066.7%。具体而言，2026财年下半年，东方甄选总营收预计达到33-35亿元，相较2025财年下半年同比增长约50.0%至59.1%。2026财年下半年，东方甄选净溢利预计达到2.81-3.11亿元，相较2025财年下半年，同比增长172.8%至201.9%。</p>\n  <p><strong>英特尔：二季度营收同比增长25%至161.3亿美元</strong></p>\n  <p>英特尔当地时间7月23日公布财报，二季度营收161.3亿美元，同比增长25%，预估144.3亿美元；二季度数据中心与人工智能营收62.6亿美元，分析师预期55.4亿美元；二季度调整后每股收益为0.42美元，分析师预期0.21美元。第三季度营收预计为158亿至168亿美元，预测区间下限高于分析师平均预计的151亿美元。（界面新闻）</p>\n  <p><strong>大众汽车二季度营业利润34.7亿欧元，低于预期</strong></p>\n  <p>大众汽车7月24日公布二季度营收824.4亿欧元，预估817.2亿欧元；二季度营业利润34.7亿欧元，预估40.7亿欧元。（界面新闻）</p>\n  <p><strong>海康威视：上半年净利润78.96亿元，同比增长39.57%</strong></p>\n  <p>36氪获悉，海康威视披露半年报，公司上半年实现营业收入468.23亿元，同比增长11.97%；归属于上市公司股东的净利润78.96亿元，同比增长39.57%；基本每股收益0.862元。</p>\n  <p><strong>宁德时代：2026年上半年营业收入2769.17亿元，同比增长54.80%</strong></p>\n  <p>36氪获悉，宁德时代发布2026年半年度报告，2026年上半年营业收入2769.17亿元，同比增长54.80%；净利润432.84亿元，同比增长41.98%。</p>\n  <h2>酷产品</h2>\n  <p><strong>小鹏人形机器人正小批量试生产，量产产线进入最后联调阶段</strong></p>\n  <p>小鹏人形机器人已在广州工厂正式开启小批量试生产，同时量产产线进入最后联调阶段，量产冲刺正式进入倒计时。此前，小鹏集团内部召开机器人量产动员大会，明确了关键时间节点：2026年实现人形机器人量产，预计2027年起将陆续进驻全球小鹏门店及商业场景，承担导购、讲解等服务。小鹏机器人业务整合集团在硬件、AI大模型、供应链及营销等模块能力，并将汽车业务积累的软硬件协同研发、智能制造与全球化渠道经验，系统性地复用于机器人领域，加速高阶人形机器人的量产与商业化进程。（新浪科技）</p>\n  <p><strong>晶核能源发布全球首个电池仿生智能体系统</strong></p>\n  <p>36氪获悉，在2026年汽车热系统学术年会上，晶核能源总裁、清华大学先进电池研究所所长李延涛发布全球首个电池仿生智能体系统。项目验证数据显示，应用后开发周期缩短超60%，研发成本降低超50%，电池温度一致性提升31%，电芯峰值温度降8℃。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-25T00:57:52+00:00", "fetched_at": "2026-07-25T02:12:14.200904+00:00", "fingerprint": "49337a23ad1ccfe5"}, {"source": "少数派", "title": "赛博对话｜对话潘玮哲x老麦煮机：电子产品在悄悄变贵！", "url": "https://sspai.com/post/112679", "summary": "不是说好AI来临人类就解放了吗，怎么我连手机都买不起了？<a href=\"https://sspai.com/post/112679\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-24T03:00:00+00:00", "fetched_at": "2026-07-25T02:12:12.684535+00:00", "fingerprint": "cc017f12ad641da5"}, {"source": "少数派", "title": "角落新声｜数字与实体、有线与无线：我的多场景有声角落构建", "url": "https://sspai.com/post/112232", "summary": "编者按：本文是「角落新声」征文活动的入围文章。本次主题征文由声擎冠名，邀你前来分享那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅。8月7日前投稿参与，即有机会获得声擎Cyber5 ...<a hr
