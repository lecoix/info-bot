<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;

    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;

    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

967512/shark-chillpill-personal-fan-and-cooling-system-deal-sale", "summary": "Portable fans are one of the easiest ways to stay cool during the summer, and you don&#8217;t have to spend much to find a decent one. If you&#8217;re looking for something more versatile, though, Shark&#8217;s ChillPill Personal Fan and Cooling System combines a rechargeable fan with a dry-touch evaporative mister in a design that can [&#8230;]", "category": "tech", "published_at": "2026-07-17T20:15:54+00:00", "fetched_at": "2026-07-18T02:02:00.144951+00:00", "fingerprint": "b4bcaa7fee3d5cb0"}, {"source": "The Verge", "title": "Taylor Farms pulls iceberg lettuce from the US market after cyclosporiasis outbreak", "url": "https://www.theverge.com/science/967563/cyclospora-taylor-farms-taco-bell-iceberg-lettuce", "summary": "Food producer Taylor Farms released a statement on the Cyclospora outbreak Friday, confirming that it's \"voluntarily removing all iceberg lettuce sourced from central Mexico from the US market.\" Reuters reports that, according to a source, Taylor Farms told customers like Yum Brands owner Taco Bell and the food distributor Sysco on Thursday to pull shredded [&#8230;]", "category": "tech", "published_at": "2026-07-17T22:09:47+00:00", "fetched_at": "2026-07-18T02:02:00.144941+00:00", "fingerprint": "78af04c86472c52a"}, {"source": "36氪 - 最新文章", "title": "2026最受投资人关注人工智能/具身智能企业50揭晓", "url": "https://36kr.com/p/3899597215745664?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_11cad3dae776450b9505ddcb5be2a14b@5889148_oswg528857oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>人工智能正在进入一个新的产业周期。</p>\n  <p>过去一年，大模型能力持续演进，生成式AI、多模态交互、智能体等技术方向快速推进；而具身智能也从早期的技术探索阶段，逐渐步入产业验证的深水区，机器人开始成为人工智能与现实世界的重要载体。</p>\n  <p>市场率先给出了回应。据36氪研究院测算，中国具身智能市场规模已从2018年的2133亿元增长至2025年的9150亿元，2026年有望突破万亿关口。IT桔子数据显示，2026上半年具身智能融资总金额达到935亿元，较2025上半年提升近5倍，投融资事件达到322起，同比增长137%。</p>\n  <p>但硬币的另一面同样刺眼。智源研究院在《2026十大AI技术趋势》中直言，具身智能创业公司业务模式同质化严重，普遍采用“通用开源大模型+运动控制”的组合在单一场景做优化。国家发改委近期也公开提醒，具身智能产业要着力防范重复度高的产品“扎堆”上市等风险。</p>\n  <p>一边是万亿市场、数百亿热钱涌入；一边是同质化严重、淘汰加速的行业预警。</p>\n  <p>2026年，人工智能正在经历一个重要的阶段切换，如何将技术转化为真实应用、商业价值和产业影响力，正在成为企业下一阶段发展的关键。</p>\n  <p>多年来，36氪持续关注人工智能产业的演进，从大模型兴起，到智能体探索，再到具身智能进入产业视野，通过深度报道、行业研究和产业活动，持续记录技术、资本和产业之间的互动关系。</p>\n  <p>今年4月，36氪启动“2026年最受投资人关注人工智能/具身智能企业”征集。截止到7月初，我们收到了数百家企业报名，覆盖大模型、具身智能、AI基础设施及垂直行业应用等多个赛道。经过报名资料审核和多轮评审，50家企业最终入选。</p>\n  <p>这些企业虽然处于不同赛道，但从技术路径、产业布局和商业探索中，可以看到AI产业正在发生的一些共同变化，也呈现出未来竞争的重要方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_b619df3ad0df4db0b181909059e2ee6e@5889148_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h3><strong>不被看见的“know-how” &nbsp;正在拉开差距</strong></h3>\n  <p>&nbsp;</p>\n  <p>人工智能产业过去几年的高速发展，大致经历了两个阶段。&nbsp;</p>\n  <p>第一个阶段由模型能力驱动。大模型突破让机器第一次具备了接近通用智能的交互能力，推动整个行业重新认识AI的边界。</p>\n  <p>第二个阶段，正在由产业应用推动。当模型能力逐渐成为基础设施，企业之间的差距开始从“有没有AI能力”，转向“如何使用AI创造价值”。</p>\n  <p>从本次入围企业来看，一个明显趋势是，人工智能创业正在从“技术驱动型创新”走向“技术+产业双轮驱动”。越来越多企业选择深耕具体行业，而不是提供泛化能力。</p>\n  <p>原因在于，AI真正产生商业价值的地方，往往不是技术展示最明显的场景，而是那些长期存在、复杂度高、依靠传统方式难以解决的问题。一个行业内部积累多年的流程、经验和数据，或许恰恰是AI创造价值的最佳入口。</p>\n  <p>因此，未来AI企业之间的差距，可能不只来自模型能力，更来自于对行业Know-how的理解深度，以及将通用技术转化为行业解决方案的能力。</p>\n  <p>人工智能产业正在从“寻找AI应用场景”，进入“用AI重新优化产业流程”的阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_3ba785b6a76a47269b9293b257c58762@5889148_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h3><strong>从数字世界走向物理世界，具身智能进入产业验证期</strong></h3>\n  <p>&nbsp;</p>\n  <p>过去一年，具身智能成为产业和资本关注的焦点。</p>\n  <p>但与早期机器人产业不同，这一轮具身智能浪潮的核心，并不是制造一个机器人，而是探索如何让机器理解环境、完成任务，并持续进化。</p>\n  <p>这背后，是感知、决策、控制以及硬件系统的综合突破。</p>\n  <p>机器人需要具备视觉感知能力，需要理解复杂环境，需要完成任务规划，同时还需要通过运动控制实现精准执行。</p>\n  <p>本次入围的50家企业中，超过20家属于具身智能与机器人赛道。从整体观察来看，当前正在出现几个新变化。</p>\n  <p><strong>首先，企业开始更加关注真实世界中的数据积累。</strong></p>\n  <p>互联网时代，数据主要来自线上行为；具身智能时代，数据更多来自现实环境中的交互。机器人如何获取数据、如何学习、如何形成反馈循环，将直接影响企业的未来能力。</p>\n  <p><strong>其次，产业链协同的重要性不断提升。</strong></p>\n  <p>具身智能不是单点技术的突破，而是模型算法、机器人本体、核心零部件、供应链和应用场景共同作用的结果。</p>\n  <p>未来胜出的企业，可能并不是某一个技术指标最高的公司，而是能够将多个环节有效整合、并快速完成产品迭代的公司。</p>\n  <p><strong>第三，商业化正在成为行业分水岭。</strong></p>\n  <p>机器人进入真实场景后，技术之外还需要面对成本、稳定性、交付周期和用户需求等现实问题。</p>\n  <p>在36氪看来，具身智能的下一阶段，不会再只是资本故事，而将进入真正考验产业能力的阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_e8129c4e7f4d43edbf68086f4d09e78b@5889148_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h3><strong>投资人换了一套打分表</strong></h3>\n  <p>&nbsp;</p>\n  <p>过去几年，人工智能成为全球科技投资的主战场，大量创业公司涌入。</p>\n  <p>但随着产业逐渐成熟，投资逻辑也在发生变化。早期阶段，资本愿意为技术可能性买单，但今天，市场开始寻找那些已经证明自己能够创造收入、形成壁垒的企业。</p>\n  <p>从36氪观察来看，当前受到投资人关注的AI企业，普遍呈现出3个特点。</p>\n  <p><strong>第一，技术路线值得长期下注。</strong>人工智能行业变化极快，企业既需要保持研发投入，也需要具备判断技术方向的能力。入围企业中，那些在技术路线上有独立判断、不盲目跟风的公司，反而更受长期资本的青睐。</p>\n  <p><strong>第二，商业闭环已经跑通。</strong>能够找到明确客户需求、形成产品价值，并持续扩大应用范围的企业，将更具长期竞争力。</p>\n  <p><strong>第三，团队综合能力越来越重要。</strong>人工智能创业不再是算法工程师的独角戏，产品能力、产业资源、交付能力和商业理解，共同构成了一家AI公司的基本面。</p>\n  <p>这也意味着，AI产业正在从高速扩张进入理性深耕的阶段。</p>\n  <p>未来几年，行业不会缺新的技术突破，但能够真正走向规模化应用、创造持续价值的企业，才是市场关注的重点。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_999b6ff0a1c54a94b0ec383ca376d15e@5889148_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>写在最后</strong></p>\n  <p>“人们总是高估一项技术未来两年的变化，而低估它未来十年的影响。”</p>\n  <p>这句话，或许仍然适用于今天的人工智能产业。</p>\n  <p>过去几年，AI的发展速度不断超出预期，整个产业也经历了一轮深刻变化。</p>\n  <p>但技术演进的过程中，真正值得关注的，是那些能够持续投入研发、深入产业场景，并逐步建立商业闭环的企业。</p>\n  <p>这也是36氪发起“2026年最受投资人关注人工智能/具身智能企业50”评选的意义所在。</p>\n  <p>我们希望通过这次评选，记录AI产业从技术探索走向产业落地过程中的关键参与者，也观察那些正在构建长期竞争力的企业。</p>\n  <p><strong>概念验证的时代即将过去，价值验证的时代正在到来。</strong></p>\n  <p>以下为“2026年最受投资人关注人工智能/具身智能企业50”完整名册</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_cc7dca8516c1464881c4d29b80d69a99@5889148_oswg3657867oswg1080oswg4454_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/ku1r6HJBAqExSHywIrz6fw\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-17T10:45:58+00:00", "fetched_at": "2026-07-18T02:02:00.046133+00:00", "fingerprint": "3290793a9c3128ad"}, {"source": "36氪 - 最新文章", "title": "对话森博科技董事长于林义：AI应用拼的不只是技术，更是实证有效的业务闭环", "url": "https://36kr.com/p/3899556701128578?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_605a8a8a4b8640158de83a7aa88b025f@6381723_oswg84170oswg1212oswg810_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>7月17日，2026世界人工智能大会在上海开场。作为36氪连续第三年深入WAIC现场的重要内容窗口，「氪话未来」直播间也在大会首日同步开启现场对话。</strong>森博科技董事长于林义<strong>在WAIC现场接受36氪「氪话未来」特邀专访，围绕企业级AI、智能体落地、行业know-how与业务闭环等话题，分享了森博从营销服务公司转向AI驱动科技服务公司的实践路径。</strong></p>\n  <p><strong>本届WAIC以“智能伙伴，共创未来”为主题。相比过去几年行业对模型能力、参数规模和Demo效果的集中关注，2026年的AI产业讨论正在明显后移：企业更关心AI能否进入真实流程，能否承担具体任务，能否被业务结果验证。换句话说，AI不再只是一个“会回答”的工具，而是要成为能够协同人类、嵌入组织、创造ROI的业务伙伴。</strong></p>\n  <p><strong>这也让企业级Agent的落地逻辑变得更清晰。通用模型能力已经足够强，但进入企业现场后，真正决定应用效果的，往往不是模型本身，而是业务上下文、行业方法论、流程拆解能力和可验证的结果反馈。森博科技的观察正落在这一点上：企业级AI的胜负手，不在“技术找场景”，而在“场景炼技术”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_865f5b4f72f048c8a923571613a16bc0@6381723_oswg169533oswg1511oswg1041_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>&nbsp;</p>\n  <p><strong>以下为对谈实录，经36氪编辑：</strong></p>\n  <p><strong>36kr：今年 WAIC 的主题是 “智能伙伴 共创未来”，行业也在讨论 Agent 如何真正进入企业流程。站在森博的观察里，2026 年企业级 AI 应用最值得关注的变化是什么？</strong></p>\n  <p><strong>A：今年 WAIC 把 \"智能伙伴\" 作为主题，本身就是行业拐点最明确的信号 ——AI 终于走过了 \"炫技演示\" 的阶段，开始从 \"召之即来的工具\" 变成 \"要进业务流程、要算 ROI 的伙伴\"。</strong></p>\n  <p><strong>我们观察到最核心的变化是：全行业都在从 \"技术找场景\" 转向 \"场景炼技术\"。前两年大家比的是谁的模型参数大、谁的 demo 好看，今年不管是投资人还是企业客户，问的第一句话都是 \"这个东西在我业务里能赚多少钱、省多少成本\"。哈佛商业评论最近的调研说 85% 的智能体项目打了水漂，本质不是技术不行，是这些 AI 根本没进过真实业务，没有上下文、没有判断标准、没有结果反馈，自然当不了能干活的伙伴。</strong></p>\n  <p><strong>这也是我们今年来 WAIC 最想分享的：企业级 AI 智能体的胜负手，从来不在模型层，而在真实业务里的实证闭环。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_9bd57a28212d4d8e8b8e3e891a1e657a@6381723_oswg174093oswg1551oswg676_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>36kr：森博从营销服务公司转向 AI 驱动的科技服务公司，真正的转折点是什么？</strong></p>\n  <p><strong>A：不是某一次大模型发布，也不是拿到了什么融资，真正的转折点是我们自己做科驭这个高端品牌的时候。</strong></p>\n  <p><strong>做了 20 年战略咨询和数字营销，森博服务过美的、海尔、海信这些行业龙头，但从来没有自己从头到尾跑通过一个品牌从 0 到 1 再到行业第一的全链路 —— 直到我们用三四年时间把旗下国际高端生活方式品牌科驭做到了智能衣物护理机品类第一，这个过程里我们突然发现：原来我们这些年沉淀的方法论，完全可以喂给 AI，变成能自己干活的智能体；而 AI 跑出来的实证业务结果，又能反过来迭代我们的方法论。</strong></p>\n  <p><strong>这个 \"自己先把业务做成\" 的过程，让我们跑通了 \"方法论 + AI智能体\" 的双系统飞轮，也让我们确信：做企业级 AI智能体，不能站在岸边教客户游泳，自己得先下水游过第一棒。这就是我们AI化转型最核心的转折点。</strong></p>\n  <p><strong>36kr：如果用一句话介绍森博现在做的事，和过去的营销服务公司相比，最大的不同是什么？</strong></p>\n  <p><strong>A：一句话：森博是用 20 年行业 know-how 和实证方法论，给企业训练既懂行又能干活的 AI Agent Team。</strong></p>\n  <p><strong>和传统营销公司最大的区别是：传统公司卖的是 \"人的经验\"—— 顾问给你出方案、团队给你执行，交付完就结束；森博卖的是 \"基于真实业务的实证有效的 AI 生产力\"—— 这些智能体不是只会聊天的工具，是带着 20 年行业知识和判断标准、在真实业务里跑通过、能 7×24 小时持续迭代的 \"AI员工\"。交付只是开始，它会跟着你的业务一直进化。</strong></p>\n  <p><strong>和纯 AI 公司的区别是：别人的 AI 是 \"聪明但不一定懂行\"，我们的 AI产品&nbsp;是 \"既聪明又内行\"。</strong></p>\n  <p><strong>36kr：森博一直强调&nbsp;“AI 应用拼的不是技术，而是行业&nbsp;know-how”。过去&nbsp;20 年服务客户沉淀下来的哪些经验，最适合被智能体化？</strong></p>\n  <p><strong>A：森博自己跑过场景，到现在我们做了一些阶段性的抽象，满足以下三个要求的场景比较适合AI智能体化，第一、场景的数字化程度要高，没有数字化AI很难驱动流转。第二、企业在这个场景中人员投资和预算投资要高，这里面有足够大的降本增效空间让智能体发挥作用。第三是明确判断标准、可证伪、可被结果验证的方法论。</strong></p>\n  <p><strong>举几个具体的例子：</strong></p>\n  <p><strong>比如GEO（AI搜索优化）领域，森博沉淀了一套完整的方法论体系：用\"多源映射法\"从百度、抖音、小红书的多源头搜索数据，反推用户在AI平台上会问什么问题；用\"ACCS模型\"构建四层信源体系，让AI从任何渠道抓取都指向同一个答案；用\"P-C-R模型\"追踪每个AI平台的信源偏好差异——比如百家号60%以上的引用流向文心一言，抖音内容35%以上流向豆包。这些不是拍脑袋想出来的，是我们对5大AI平台做了数万次实测后提炼的规律。</strong></p>\n  <p><strong>又比如达人营销领域，森博用\"双塔匹配模型\"做达人筛选——产品特征塔和达人特征塔交叉匹配，用\"CVI-5D模型\"做达人评估——传播力、种草力、粉丝匹配度、合作配合度、有效评论成本五个维度量化打分。这套模型在海尔等典型客户项目上，帮客户节省了1958万营销费用，达人外溢成本降低了34%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_2cf6734cab4244c09aed0b1e064394e8@6381723_oswg97487oswg907oswg1203_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>以上所举的这些方法论过去藏在资深顾问的脑子里，现在提炼成算法、蒸馏成skill，成为AI智能体可执行的行为逻辑。</strong></p>\n  <p><strong>36kr：很多企业做 Agent 时，容易停留在工具层，真正进入业务流程并不容易。森博是如何把客户真实场景里的上下文、流程和判断标准，沉淀进 CeMeta AI 引擎和智能体产品体系里的？</strong></p>\n  <p><strong>A：核心是森博的\"实证型研发体系（BER）\"——每一个AI智能体产品，都必须先在真实业务里跑通，才给客户用。</strong></p>\n  <p><strong>具体来说分四步：</strong></p>\n  <p><strong>第一步，场景拆解。不是问客户\"你想要什么AI功能\"，而是我们自己扎进业务里，把一个场景的完整链路拆开——输入是什么、判断标准是什么、输出是什么、对错怎么验证。比如GEO场景，我们把\"让AI推荐你的品牌\"这个需求，拆成了问题定义→内容生产→渠道分发→效果监测→归因迭代五个环节，每个环节都有明确的数据指标。</strong></p>\n  <p><strong>第二步，方法论结构化。把拆解出来的判断标准、经验规则编码成智能体可执行的逻辑。不是把文档丢给大模型，而是把每一个判断节点都变成可量化的决策树。</strong></p>\n  <p><strong>第三步，实战验证。智能体直接放到真实业务里跑。“好现”GEO智能体先在森博旗下品牌科驭上验证，推荐率从0做到90%以上，再给海尔跑，新品首推率做到96%，售后电话首推率100%。“好灵”达人营销智能体先在内部项目跑通，再给海尔用，AI选出的达人外溢率比人工提升13%。</strong></p>\n  <p><strong>第四步，结果反哺。每一次业务结果都回来校准模型。对了强化，错了修正，持续循环。这就是为什么我们的智能体会越用越准——它不是静态的工具，是在真实业务里持续进化的伙伴。</strong></p>\n  <p><strong>这套体系的底座正是我们的“智娲”AI引擎——企业营销AI引擎，负责把企业的上下文（知识）、工具（Tools）、标准（Standards）和数据（Data）统一管理，让每个智能体都能在企业的真实业务环境里运行。</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_d1edf22eb3404e1cbf0a853f15652f01@6381723_oswg186387oswg897oswg1375_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>36kr：从 GEO 智能体、达人营销智能体到电商营销智能体，森博已经在营销链上跑出一些结果。接下来，这套 “场景找技术” 的方法是否会进入更广义的企业级 AI 智能体服务？</strong></p>\n  <p><strong>A：答案是肯定的。</strong></p>\n  <p><strong>AI 的价值从来不会被局限在营销链路里，在森博自身走过这五六年帮助企业AI化转型的过程中，我们自己也在抽象一层【如何让企业AI化转型的方法论】这套方法论就是最近非常热的词FDE（前端部署工程师）背后的一套支撑体系。有了这套支撑体系，目前森博正在携手一些大模型厂商、更多行业头部企业，把这套实证型研发体系（BER）复制到研发、生产、供应链、客服等更广泛的企业业务链路里。</strong></p>\n  <p><strong>今年 WAIC 的主题是 \"智能伙伴 共创未来\"，我们理解的 \"共创\"，不是 AI 公司关起门来做产品卖给客户，是我们和客户一起，在真实业务里把 AI 磨炼成真正能干活的AI伙伴 —— 你出场景，我们出方法论和 AI 能力，一起把 AI 的 ROI 算清楚，把企业的全链路生产力提上来。</strong></p>\n  <p><strong>如果大家想体验真正能进业务流程、能算清 ROI 的 AI 智能体，欢迎添加森博企业微信，从“好现”GEO 开始，一起探索企业 AI 化升级的真实路径。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_9c35601d3c4448f0a57d941f30d339e4@6381723_oswg91986oswg1080oswg620_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>&nbsp;</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-17T10:51:22+00:00", "fetched_at": "2026-07-18T02:02:00.046127+00:00", "fingerprint": "bceebfc811a5e6c8"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜阿里1688将推出AI时代B2B交易互联互通开放标准；英特尔与Google Cloud宣布深化战略合作；铁路部门试点提前60天预约购票服务", "url": "https://36kr.com/p/3896564485572489?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3899467569104512\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>成大生物：流感病毒裂解疫苗（高剂量）进入I期临床试验</strong></a></p>\n  <p>36氪获悉，成大生物公告，公司全资子公司成大生物(本溪)研发的流感病毒裂解疫苗（高剂量）已获国家药监局临床试验批准，并完成I期临床试验筹备工作，正式进入I期临床试验阶段。该疫苗抗原含量为常规剂量四倍，适用于60岁以上老年人群及高风险人群，国内尚无同类产品获批上市，有望填补市场空白。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899337546712969\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>苏宁易购携手人工智能合作伙伴，布局家用服务机器人</strong></a></p>\n  <p>36氪获悉，近日，苏宁易购旗下碧英科技入围工信部人工智能揭榜挂帅项目，将联合产业生态合作伙伴研发智能家庭陪护机器人。该项目面向老龄化背景下的居家照护需求，结合具身智能技术，探索家用机器人商业化路径。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899341549520516\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>阿里1688将推出AI时代B2B交易互联互通开放标准</strong></a></p>\n  <p>7月17日，在2026世界人工智能大会上，阿里1688宣布将在本月底推出UTP通用交易协议（UniversalTradeProtocol，简称“UTP”）。随着AI越来越会做生意，B2B正在演变为A2A——买家的AI直接对接工厂的AI自动完成交易，但不同AI之间缺一套行业通用交易协议。UTP相当于为A2A时代的全球贸易建立统一的交易基础设施。UTP推出后，A2A时代的B2B交易将有一套互联互通的开放标准。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899349988558464\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蚂蚁集团WAIC展示面向智能体商业的三层AI布局</strong></a></p>\n  <p>7月17日，蚂蚁集团在WAIC 2026展示面向智能体商业时代的三层AI布局：AI应用层、智能体商业生态层和技术基座层。应用层方面，健康AI“阿福”用户数已突破1亿，日均处理超1000万次健康咨询；AI版支付宝“阿宝”已上架公测。智能体商业生态方面，AI支付已支持3亿笔智能体支付，适配95%的通用智能体框架。技术基座方面，蚂蚁展示了百灵大模型、灵波科技具身智能产品、OceanBase AI数据库及安全可信能力等进展。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899315459081856\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英特尔与Google Cloud宣布深化战略合作</strong></a></p>\n  <p>英特尔与Google Cloud宣布深化双方多年战略合作，通过部署Gemini Enterprise和Google Cloud，加速英特尔全公司范围的数字化转型。英特尔计划将Gemini驱动的先进生成式AI应用于全球员工日常工作，帮助其扩展各项能力，并强化工程、供应链及企业运营领域的工作流。Google Cloud高度可扩展的基础设施还将增强英特尔的半导体开发环境，引入定制化的智能体工作流，缩短芯片设计周期，提升跨部门协同效率。（界面）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899405802555269\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX“星舰”第13次试飞因发动机点火故障被迫中止</strong></a></p>\n  <p>美国中部时间7月16日17时45分，美国太空探索技术公司（SpaceX）的大型运载火箭“星舰”（Starship）在德克萨斯州博卡奇卡试验场进行第13次试飞发射时，因部分发动机未能成功点火，在倒计时归零阶段触发自动程序，发射被迫中止。SpaceX首席执行官埃隆·马斯克随后在社交媒体上证实，由于部分“猛禽”（Raptor）发动机未能启动，系统自动触发了中止指令。马斯克表示，为确保后续飞行的可靠性，技术团队将拆除并更换两台“猛禽”发动机，下一次发射尝试预计最早将于下周初进行。（新浪财经）</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3899365808735874\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>文远知行发布物理AI大模型WITT</strong></a></p>\n  <p>36氪获悉，7月17日，自动驾驶科技公司文远知行WeRide正式发布自研物理AI认知基础大模型WeRide WITT。基于视觉语言大模型（VLM）能力，WITT首次引入“最小物理事实单元”概念，打通视频、图像、文本等多模态信息，将连续变化的真实场景拆解为可被识别和验证的事实单元，构建起以物理事实为核心的新一代AI理解框架。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899321159862150\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蜂巢能源发布蜂行短刀3.0等全场景新品</strong></a></p>\n  <p>36氪获悉，7月16日，蜂巢能源举行全球合作伙伴峰会。会上，蜂巢能源发布了蜂行短刀3.0、混合固液6C超充电芯、全新大电量磷酸铁锂HEV电池包等一系列覆盖动力、储能及新兴市场的全场景新品，并宣布飞叠4.0将于年内量产交付，凭借16片同时叠技术，叠片效率实现翻倍。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899401384363652\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>千问首款AI智能体耳机亮相WAIC</strong></a></p>\n  <p>36氪获悉，2026世界人工智能大会首日，千问首款AI智能体耳机正式亮相。据了解，该耳机采用可全天候佩戴的耳夹式设计，将千问AI助手能力融入耳机，支持同声传译、会议纪要、健康记录等功能，带来更自然的AI交互体验。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3899257544656773\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国家发改委发布《人工智能合作发展行动计划》</strong></a></p>\n  <p>36氪获悉，国家发改委发布《人工智能合作发展行动计划》，内容包括：一、优质数据供给行动。二、智能算力普惠行动。三、开源生态共享行动。四、人工智能深度赋能行动。五、数智人才共育行动。六、规则标准共建行动。七、安全治理协作行动。八、人工智能向善行动。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899215060436864\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>习近平宣布中国支持全球人工智能发展重大举措</strong></a></p>\n  <p>国家主席习近平在上海世界会客厅出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。习近平指出，在各方共同努力下，世界人工智能合作组织在上海应运而生。这是中方响应全球南方呼声、团结国际社会积极推动人工智能发展和治理的重大举措，将成为人工智能发展史上的一个重要里程碑。习近平宣布，为进一步支持全球人工智能发展、推进全球人工智能能力建设，未来5年，中国将面向发展中国家提供5000个人工智能专题研修培训名额；面向东盟、阿盟、非盟、拉共体、上合组织、金砖国家建设国际人工智能应用合作中心；推动气象智能预警方案“妈祖”在30个国家落地应用，守望万家灯火，护佑四海安澜。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899153286989441\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>铁路部门试点提前60天预约购票服务</strong></a></p>\n  <p>17日从中国国家铁路集团有限公司客运中心获悉，7月20日起，铁路部门将在京沪高铁、京沪铁路的200多趟列车试点新增火车票预约购票服务，旅客可通过铁路12306手机客户端“预约购票”专区，在列车开车前第60天至第17天填报预约需求，铁路12306系统将于开车前第20天至第16天兑现预约订单。7月20日至8月29日为过渡期，可依次预约9月15日及以后的车票，8月30日起，可常态化预约开车前第60天至第17天车票。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3899411254298503\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国家超算互联网推出科学智能体共创计划</strong></a></p>\n  <p>36氪获悉，7月17日，2026世界人工智能大会（WAIC）上，国家超算互联网推出的“科学计算智能体生态共创与开发者招募合作计划”备受业界关注。该计划为期半年，通过面向高校科研院所、个人开发者及企业研发团队，广泛征集智能体、科研模型、MCP工具、Skill等创新成果，以构建开放协同的科学智能生态体系。</p>", "category": "tech", "published_at": "2026-07-17T13:01:42+00:00", "fetched_at": "2026-07-18T02:02:00.046120+00:00", "fingerprint": "0aecbb38f1289e62"}, {"source": "36氪 - 最新文章", "title": "印奇在 WAIC 2026 开幕式主论坛发表主题演讲：当智能体走进物理世界", "url": "https://36kr.com/p/3900439867147909?f=rss", "summary": "<p>2026 世界人工智能大会（WAIC 2026）于 7 月 17 日正式开幕。作为全球人工智能领域的顶级盛会，本届大会以“智能伙伴 共创未来”为主题。阶跃星辰董事长、千里科技董事长印奇作为特邀嘉宾出席大会开幕式并在大会主论坛（上午场）发表主题演讲《当智能体进入物理世界》。回顾 15 年 AI 创业历程，他表示，AI 创业已从小众赛道成为全球重要共识。今天的 AI 研究者和创业者既站在几代科学家持续探索的肩膀上，也受益于信息技术、移动互联网、云计算、半导体、新能源等产业积累，能够参与这场时代变革无比幸运。</p>\n  <p>印奇判断，2026 年模型能力正在跨越关键临界点，AI 已从只能连续执行数秒任务，进阶到能够独立工作数十小时，行业正站在 AGI 高峰的山脚下。继自然语言之后，编程正成为衡量 AI 能力跃迁的重要标尺。随着智能体模型与下一代终端产品加速结合，智能正从数字屏幕走向真实物理世界，智能体也将从聊天工具进化为能够感知、决策和执行任务的生产力最小单元。未来，工程师、设计师、研究员等都能拥有专属智能体，使一个人具备一支团队的能力。</p>\n  <p>印奇指出，智能体浪潮将推动新系统、新载体、新网络三大结构性变革。在新系统层面，智能体能力由模型能力与智能体操作系统能力共同决定，Agentic OS 通过连接模型与数据、工具、接口和设备，决定智能体能够“走多远”；在新载体层面，终端设计理念将从“以人为本”进一步走向“人机共生”，电脑、手机、汽车和机器人将成为同一智能体在不同场景下的不同“身体”，支持智能跨终端连续存在、自由迁移和协同执行任务；在新网络层面，A2A 网络将连接人与智能体，智能体将拥有自身的身份、能力与信用，并自主寻找伙伴、组织协作和完成交易，成为智能体经济的重要基础设施。</p>\n  <p>印奇同时强调，智能体进入现实世界带来的不只是能力跃迁，更是秩序重构。行业需要共同回答智能体代表谁行动、行动后果由谁负责，以及如何确保身份可信、权限可控、行为可追溯等问题，并探索新的技术体系、治理机制与社会契约。他表示，未来不是机器替代人的世界，而是人与智能共同进化的世界；当智能体进入物理世界，每个人的可能，都将被十倍放大！</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-18T00:53:35+00:00", "fetched_at": "2026-07-18T02:02:00.046112+00:00", "fingerprint": "9f7b178619217899"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨ofo停更5年突然发文，运营主体仍处存续状态；苹果市值重返全球第一；乐事回应“蓝色薯片”来源", "url": "https://36kr.com/p/3900449325287305?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>月之暗面正式推出开源模型Kimi K3</p>\n  <p>智谱ARR达到10亿美元，半年增长15倍</p>\n  <p>国际足联：世界杯冠军将有戒指，每枚均有独立编号</p>\n  <p>国内成品油价7月17日晚上调</p>\n  <p>A股存储板块龙头股遭遇两个跌停</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>ofo停更5年突然发文，运营主体仍处存续状态</strong></p>\n  <p>7月15日，沉寂近5年的ofo小黄车官方微信公众号突然更新。此次公众号发布的内容，是一则皮肤病患者援助招募信息。虽然与共享单车业务并无关联，这次更新仍然迅速引发关注。不少网友提及尚未退回的押金问题：“我的199元什么时候退？”“退款队伍还排着吗？”“这么多年过去了，押金还有希望吗？”</p>\n  <p>此前有不少网友认为，ofo早已倒闭。然而，天眼查显示，ofo关联运营主体北京拜克洛克科技有限公司目前仍处于存续状态，公司风险信息较高，涉及大量司法案件、被执行信息及限制消费令。（扬子晚报）</p>\n  <p><strong>苹果市值重返全球第一</strong></p>\n  <p>7月17日，苹果股价超越英伟达，成为全球市值最高公司。英伟达下跌3.2%，市值进一步缩水至约4.86万亿美元；苹果则依靠近期强势上涨，市值上升至约4.90万亿美元，时隔3个月重返全球市值第一。（界面新闻）&nbsp;</p>\n  <p><strong>乐事：“蓝色薯片”系着色验证薯片</strong></p>\n  <p>7月16日晚，在乐事薯片中吃出“蓝色薯片”异物的消费者发帖称，其已经收到乐事方面发来的情况说明。经核实，异物为工厂使用的着色验证薯片，用于确认设备和流程的稳定性，是食品生产过程中常用的工艺验证手段之一。工厂使用的着色剂符合GB2760《食品安全国家标准 食品添加剂使用标准》相关要求，不影响食品安全与品质。该名消费者称，乐事方面提供了相关分析报告，分析报告可以证实官方说明准确，由于分析报告涉及商品其他信息，不便公开。目前，其两项诉求都已得到解决：一是获得情况说明，二是该袋薯片的退款。（界面新闻）&nbsp;</p>\n  <h2>追踪WAIC</h2>\n  <p><strong>习近平宣布中国支持全球人工智能发展重大举措</strong></p>\n  <p>国家主席习近平在上海世界会客厅出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。习近平指出，在各方共同努力下，世界人工智能合作组织在上海应运而生。这是中方响应全球南方呼声、团结国际社会积极推动人工智能发展和治理的重大举措，将成为人工智能发展史上的一个重要里程碑。习近平宣布，为进一步支持全球人工智能发展、推进全球人工智能能力建设，未来5年，中国将面向发展中国家提供5000个人工智能专题研修培训名额；面向东盟、阿盟、非盟、拉共体、上合组织、金砖国家建设国际人工智能应用合作中心；推动气象智能预警方案“妈祖”在30个国家落地应用，守望万家灯火，护佑四海安澜。（新华社）</p>\n  <p><strong>蚂蚁集团WAIC展示面向智能体商业的三层AI布局</strong></p>\n  <p>7月17日，蚂蚁集团在WAIC2026展示面向智能体商业时代的三层AI布局：AI应用层、智能体商业生态层和技术基座层。应用层方面，健康AI“阿福”用户数已突破1亿，日均处理超1000万次健康咨询；AI版支付宝“阿宝”已上架公测。智能体商业生态方面，AI支付已支持3亿笔智能体支付，适配95%的通用智能体框架。技术基座方面，蚂蚁展示了百灵大模型、灵波科技具身智能产品、OceanBaseAI数据库及安全可信能力等进展。</p>\n  <p><strong>曙光8000亮相WAIC2026，单个计算单元算力密度提升20倍</strong></p>\n  <p>36氪获悉，7月17日，曙光8000（登峰）在2026世界人工智能大会以真机形态首次公开亮相，入选大会“镇馆之宝”。该系统采用超智融合架构，支持FP64至INT8全精度计算，单个计算单元算力密度提升20倍；自研scaleFabric互连技术可支撑十万卡规模稳定互连。系统已完成300余项重点应用适配，覆盖20余个科研与产业领域。</p>\n  <p><strong>网易灵动“人机混编”原创技术亮相2026 WAIC</strong></p>\n  <p>36氪获悉，7月17日，2026世界人工智能大会（WAIC）召开。网易旗下专注工程机械领域的具身智能品牌网易灵动，将极具科技感的“智能座舱”搬入展区，座舱内工作人员跨越千里，可远程操控真实电厂、港口的生产一线设备。同时，网易灵动还集中展现了具身智能规模化落地高危场景的最新成果，以及“人机混编”“黑灯工地”“一人多机”等自主研发技术。</p>\n  <p><strong>国家超算互联网推出科学智能体共创计划</strong></p>\n  <p>36氪获悉，7月17日，2026世界人工智能大会（WAIC）上，国家超算互联网推出的“科学计算智能体生态共创与开发者招募合作计划”备受业界关注。该计划为期半年，通过面向高校科研院所、个人开发者及企业研发团队，广泛征集智能体、科研模型、MCP工具、Ski等创新成果，以构建开放协同的科学智能生态体系。</p>\n  <p><strong>千问首款AI智能体耳机亮相WAIC</strong></p>\n  <p>36氪获悉，2026世界人工智能大会首日，千问首款AI智能体耳机正式亮相。据了解，该耳机采用可全天候佩戴的耳夹式设计，将千问AI助手能力融入耳机，支持同声传译、会议纪要、健康记录等功能，带来更自然的AI交互体验。</p>\n  <p><strong>光羽芯辰携最新自研端侧大算力3D堆叠近存算推理芯片亮相WAIC</strong></p>\n  <p>2026年7月17-20日，光羽芯辰亮相世界人工智能大会，全球首发端侧大算力3D堆叠近存算推理芯片TC1000系列。该芯片依托自研3D堆叠近存算与存算融合架构，突破“内存墙”瓶颈，实现等效带宽10倍跃升、功耗仅传统方案1/3，支持3B模型300token/s超高速推理及35B模型高性能运行。光羽芯辰已与联想达成深度合作，共同推进下一代AI PC/AI Cube/多合一产品等端侧推理产品和方案的落地。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>月之暗面正式推出开源模型Kimi K3</strong></p>\n  <p>36氪获悉，7月17日，月之暗面正式推出Kimi K3。Kimi K3是一个2.8万亿参数模型，基于KDA混合线性注意力机制（Kimi Delta Attention）和注意力残差（Attention Residuals)、技术构建，原生支持视觉理解，并拥有100万token上下文窗口。它是全球首个开源的3万亿级别模型，面向长程编程、知识工作和推理等前沿智能场景而设计。</p>\n  <p><strong>谷歌据悉推迟发布Gemini 3.5 Pro，因持续提升模型编程能力</strong></p>\n  <p>知情人士透露，谷歌最强旗舰AI模型Gemini 3.5 Pro的发布时间已较原计划推迟数月，因为该公司投入了更多时间提升模型能力，尤其是编程能力。据10名现任及前员工透露，Gemini 3.5 Pro延期发布已引起谷歌工程师、AI研究人员和管理层的不满，他们担心，随着Anthropic和OpenAI相继推出性能超越Gemini的模型，谷歌可能失去市场领先优势。（新浪财经）</p>\n  <p><strong>微软CEO批评Anthropic对Fable模型的内容管控过于严苛</strong></p>\n  <p>微软CEO萨蒂亚·纳德拉周三表示，Anthropic对用户向其高端人工智能模型Fable提交的查询设置各类限制，这种做法毫无道理。根据纳德拉讲话的文字稿，他对微软Copilot人工智能工具的研发工程师说道：“如果你用过Fable就会发现，它会莫名其妙拒绝各类指令。试问你什么时候见过一款创作工具会受到如此严苛的内容管控？这完全说不通。”据一份技术支持页面显示，当终端用户向Fable询问大规模模型搭建相关问题或其他话题时，Anthropic有时会调用旧版本模型生成回复。（新浪财经）</p>\n  <p><strong>英特尔与Google Cloud宣布深化战略合作</strong></p>\n  <p>英特尔与Google Cloud宣布深化双方多年战略合作，通过部署Gemini Enterprise和Google Cloud，加速英特尔全公司范围的数字化转型。英特尔计划将Gemini驱动的先进生成式AI应用于全球员工日常工作，帮助其扩展各项能力，并强化工程、供应链及企业运营领域的工作流。Google Cloud高度可扩展的基础设施还将增强英特尔的半导体开发环境，引入定制化的智能体工作流，缩短芯片设计周期，提升跨部门协同效率。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>智谱ARR达到10亿美元，半年增长15倍</strong></p>\n  <p>36氪从多个独立信源处获悉，截至2026年7月，智谱的ARR（年度经常性收入）已经达到10亿美元。截至发稿前，针对上述信息，智谱未回复。据知情人士，在2026年1月到7月期间，智谱的ARR增长了15倍。智谱官方曾提到，大模型的商业价值可以理解为“智能上限xToken消耗规模”，只要模型能力继续领先，调用量就会不断增长。财报显示，今年Q1，GLM的API价格累计调高约83%，海外订阅价格甚至接近ClaudeCode，但调用量仍增长约400%。</p>\n  <p><strong>SK集团会长崔泰源回应近期股价下跌：内存芯片需求支撑下股价将长期上涨</strong></p>\n  <p>SK集团会长崔泰源认为，在内存芯片需求的支撑下，SK海力士股价将呈长期上涨趋势。“对内存芯片的需求呈指数级增长，这就是为什么SK海力士和三星电子股价自去年以来出现快速飙升，”他在周五韩国工商会：主办的论坛上表示。被问及近期股价下跌时他表示，股价通常会随着市场预期上涨，然后在经历一波过度上涨后出现回调。“我认为内存芯片的需求将持续存在，因此股价走势将随着时间的推移呈现上行趋势，”他说。（财联社）</p>\n  <p><strong>巴菲特再次抨击股市“赌场化”</strong></p>\n  <p>“股神”巴菲特最新发声，再次批评股市越来越受投机交易驱动。7月15日，巴菲特在接受CNBC采访时再次抨击股市，称其越来越受投机交易驱动，而不是着眼于长期投资：“当每个人都更喜欢赌博时，很难找到有价值的东西。”&nbsp;</p>\n  <p>今年以来，美国股市一路飙升至历史新高，克服了包括美伊冲突带来的能源冲击在内的诸多担忧。市场质疑者认为，与人工智能发展相关的股票投机过度。“有时候机会来得太快，简直难以置信，”巴菲特说道，“而有时候，几年下来才找到一个机会就已经非常幸运了。我们应该始终相信，后者才是一种常态。”（澎湃新闻）&nbsp;</p>\n  <p><strong>国际足联：世界杯冠军将有戒指，每枚均有独立编号</strong></p>\n  <p>北京时间7月17日凌晨，国际足联官方宣布，2026年世界杯冠军成员将获得定制冠军戒指，戒指还将面向全球球迷发售。这是世界杯历史上首次颁发冠军戒指。本次冠军戒指共制作2026枚，每枚均有独立编号，以此致敬本届赛事。其中30枚将授予冠军队员及教练组，其余1996枚将作为官方授权产品面向全球球迷发售，让支持者也能拥有一段独特的世界杯历史记忆。</p>\n  <p>戒指设计方面，一侧展示国际足联世界杯奖杯图案，另一侧将根据冠军球队身份进行个性化定制。每枚戒指均量身打造，并附有真品证书。决赛结束后，冠军队队长和主教练将率先获颁临时戒指以作纪念，全部30枚正式戒指随后进行个性化定制并正式颁发。（第一财经）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260718/v2_c521dcf894bf4210afa6eca9045c6dfb@5667365_oswg242582oswg750oswg421_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">世界杯冠军戒指</p>\n  <p><strong>铁路部门试点提前60天预约购票服务</strong></p>\n  <p>记者17日从中国国家铁路集团有限公司客运中心获悉，7月20日起，铁路部门将在京沪高铁、京沪铁路的200多趟列车试点新增火车票预约购票服务，旅客可通过铁路12306手机客户端“预约购票”专区，在列车开车前第60天至第17天填报预约需求，铁路12306系统将于开车前第20天至第16天兑现预约订单。7月20日至8月29日为过渡期，可依次预约9月15日及以后的车票，8月30日起，可常态化预约开车前第60天至第17天车票。（第一财经）&nbsp;</p>\n  <p><strong>国内成品油价7月17日晚上调</strong></p>\n  <p>7月17日，国家发改委发布消息称，自24时起，国内汽油价格和柴油价格分别上调300元/吨和290元/吨。折合升价，92号汽油上调0.24元，95号汽油上调0.25元，0号柴油上调0.25元。居民自驾出行以及通勤成本将有所上涨。例如，私家车单次加满一箱50L的油后将多花约12元；物流行业，以月跑1万公里、百公里油耗在38L的重型卡车为例，在下次调价窗口开启前，单辆车的燃油成本将增加443元左右。本轮调价后，全国大多数地区车柴价格7.2-7.4元/升，92号汽油零售限价在7.2-7.3元/升。（界面新闻）</p>\n  <p><strong>官方通报NFC果汁勾兑事件，NFC果汁系勾兑2家公司被立案</strong></p>\n  <p>7月16日，记者从漯河市政府食安办获悉，针对7月14日媒体报道“河南多家企业‘NFC果汁’系勾兑”引发关注事件，漯河市第一时间响应，当日即组织属地政府、市场监管、公安等部门，深入5家涉事企业迅速调查处置。</p>\n  <p>据当地初步调查，河南赞漾饮品有限责任公司、漯河申农生物科技有限公司涉嫌标签虚假标注，已依法立案，并责令其立即下架、召回全部违规产品。对其余3家企业，正在深入调查，一旦查实违法行为，依法依规严肃处理。（河南日报）</p>\n  <p><strong>LV老板被责令补税1.74亿元</strong></p>\n  <p>7月17日消息，近日，在一场持续多年的法律诉讼后，法国首富、LVMH掌门人贝尔纳·阿尔诺(Bernard Arnault)被法国当局责令补缴2250万欧元（约合人民币1.74亿元）税款。</p>\n  <p>巴黎行政上诉法院近期一份裁决显示，阿尔诺和他的夫人被要求向法国当局缴纳2010年的1296万欧元“额外缴款”(additional contribution)，包括税款、社会保险缴款、附加费和滞纳金利息等。此外，阿尔诺夫妇还须补缴2012年至2015年间的法国财富团结税(Wealth Solidarity Tax)，合计950万欧元。阿尔诺方面在7月4日回应媒体说，他们将就法院裁决向法国最高行政法院提起上诉。（中新经纬）</p>\n  <p><strong>realme暂停中国业务</strong></p>\n  <p>7月16日，真我realme副总裁、中国区总裁徐起发文宣布realme真我在中国市场暂停产品更新：realme将按下中国市场的暂停键。这是一个经过反复推敲做出的选择。未来，我们将集中资源深耕海外市场，聚焦性能和游戏赛道，将越级科技带向全球。</p>\n  <p>针对售后问题，徐起表示真我现有机型的后续销售、售后质保将由OPPO官方团队全面接手。至于系统更新，下一代ColorOS发布后，realme用户可以在收到更新提示时，更新至ColorOS系统。(第一财经）</p>\n  <p><strong>中国房地产市场已进入存量时代</strong></p>\n  <p>住房城乡建设部数据显示，今年上半年，中国二手房交易量在新房和二手房交易总量中的占比为50.4%，北京、上海、江苏、广东等18个省（区、市）二手住宅交易面积超过新建商品住宅。这表明，中国房地产市场从增量时代进入存量时代。（大河财立方）&nbsp;</p>\n  <p><strong>澜起科技回应韩国反垄断调查</strong></p>\n  <p>澜起科技公告，7月15日，韩国首尔中央地方检察厅公平贸易调查部针对潜在的违反反垄断相关法规事宜，在公司的韩国办公室开展现场搜查及取证。公司正全力配合检察厅的各项调查要求。截至本公告披露日，公司及其董事、员工均未被检察厅或任何政府机关指控存在任何不当行为。目前公司经营正常，公司仍将全力专注于产品研发并服务客户。（界面新闻）</p>\n  <p><strong>权益ETF重回规模第一</strong></p>\n  <p>Choice数据显示，截至7月16日，沪深300ETF华泰柏瑞规模达935.53亿元，超越银华日利A重回全市场ETF规模第一。7月16日沪深300指数下跌1.85%，但沪深300ETF华泰柏瑞却逆势获得资金净流入62.01亿元，规模与前一日相比增长46.36亿元。业内人士分析称，当前市场震荡持续，但有资金逆势抄底，推动权益ETF重回规模榜首，释放出积极信号。此外，当前板块轮动加速，主线不明确，许多资金不敢押注行业ETF，于是更倾向通过宽基ETF来进行逢低布局。（财联社）</p>\n  <p><strong>车企上半年销量前十公布：上汽、比亚迪、吉利列前三</strong></p>\n  <p>据中国汽车工业协会统计分析，2026年1-6月，汽车销量排名前十位的企业（集团）共销售1264.9万辆，占汽车销售总量的84.2%。在上述十家企业中，与去年同期相比，吉利控股、奇瑞控股、广汽集团和长城汽车销量呈不同程度增长，其他企业销量呈不同程度下降。（界面新闻）</p>\n  <p><strong>A股存储板块龙头股遭遇两个跌停</strong></p>\n  <p>7月17日午后，A股科技板块加速跳水，存储芯片“一哥”兆易创新走出两个跌停，最新股价报463.15元，市值3249亿元，港股兆易创新同步重挫超11%。Wind数据显示，兆易创新股东户数超24万。（21世纪经济报道）</p>\n  <p><strong>世界杯决赛在即，多家公司宣布：下周一放假</strong></p>\n  <p>7月16日，阿迪达斯旗下社媒账号“阿迪达斯足球”发布邮件截图，邮件写道“为了让每一位同事都能够尽情享受世界杯决赛，除重要工作会议安排外，公司决定为所有办公室员工提供7月20日（下周一）一天特别假期，让我们一起聚焦绿茵场，7月20日凌晨3点为西班牙和阿根廷的巅峰对决呐喊助威”。随后，阿迪达斯体育（中国）有限公司转发并配文“你不来上班那我也不上了”；同日，灵犀互娱发文，宣布“周一上午全员休假”；7月15日，网易发文宣布，7月20日（周一）上午，全体网易员工放假半天，尽情享受决赛之夜。（中国新闻周刊）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股普跌</strong></p>\n  <p>美股三大指数集体收跌，道指跌0.77%，本周累跌0.93%；纳指跌1.4%，本周累跌2.9%；标普500指数跌1.01%，本周累跌1.55%。</p>\n  <p>大型科技股普跌，SpaceX跌超5%，英伟达、Meta、特斯拉、谷歌跌超2%。费城半导体指数收跌1.63%，较6月22日创下的历史高点下跌20.2%，进入技术性熊市。存储概念股低开高走小幅收涨，希捷科技涨超5%，西部数据涨超2%，SK海力士涨超1%，闪迪跌超4%。半导体设备与材料、航空服务、加密货币概念走低。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>上市脚步临近，Anthropic据悉计划几周内召开IPO投资者会议</strong></p>\n  <p>7月16日，据报道，Anthropic正安排与投资者举行会面，为潜在的大规模IPO做准备。负责此次IPO的承销银行将在未来几周安排投资者与这家Claude聊天机器人开发商会面。Anthropic最早可能于10月启动IPO。Anthropic在5月完成一轮融资后估值达到9,650亿美元，首次超过OpenAI成为全球估值最高的未上市公司之一。（界面新闻）</p>\n  <p><strong>中际旭创通过港交所聆讯</strong></p>\n  <p>7月17日，港交所披露易文件显示，A股光模块龙头中际旭创（300308.SZ）顺利通过港股上市聆讯，推进A+H双重上市布局。本次由中金、高盛、摩根士丹利等联席保荐，市场预估募资最高70亿美元，有望成为年内港股大型科技IPO。（时代财经APP）&nbsp;</p>\n  <p><strong>袁记食品集团股份有限公司港股IPO获中国证监会备案</strong></p>\n  <p>36氪获悉，中国证监会国际合作司发布关于袁记食品集团股份有限公司境外发行上市及境内未上市股份“全流通\"备案通知书，拟发行不超过23,824,000股境外上市普通股并在香港联合交易所上市。公司20名股东拟将所持合计82,176,253股境内未上市股份转为境外上市股份，并在香港联合交易所上市流通。&nbsp;</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果据悉最快今秋推出OLED版iPadmini，明年更新入门版及iPad Air</strong></p>\n  <p>当地时间7月16日，科技记者马克·古尔曼发文称，苹果公司正准备推出五年来最大升级版iPad mini，最快将于今秋发布、10月上市。新款iPad mini代号J510，将首次采用OLED显示屏，以提升显示效果。与此同时，苹果还计划于明年更新入门版iPad（代号J581）和11英寸、13英寸iPad Air（代号J807、J837），其中入门版主要升级处理器，iPad Air预计于春季发布。苹果预计今年9月发布首款折叠屏iPhone以及新款Apple Watch等产品，并已于上月上调包括iPad系列在内的多款产品售价。（界面新闻）</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-18T01:05:45+00:00", "fetched_at": "2026-07-18T02:02:00.046096+00:00", "fingerprint": "bd06efd8d58bb039"}, {"source": "少数派", "title": "UniGetUI：可能是 Windows 下最好用的应用商店", "url": "https://sspai.com/post/111128", "summary": "UniGetUI 是一个不错的包管理器，它提供的统一的更新 UI，让你的软件最大程度集中在一起管理，还可以用于需要批量配置的场景。<a href=\"https://sspai.com/post/111128\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-17T02:37:12+00:00", "fetched_at": "2026-07-18T02:01:58.417018+00:00", "fingerprint": "742e27cd87889284"}, {"source": "少数派", "title": "具透 | watchOS 27 公测版一览：动态应用网格、Liquid Glass 微调……", "url": "https://sspai.com/post/112430", "summary": "AI 之外，watchOS 27 中还有这些新功能。<a href=\"https://sspai.com/post/112430\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-17T07:00:00+00:00", "fetched_at": "2026-07-18T02:01:58.417012+00:00", "fingerprint": "fce61916f4c25b4e"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/112444", "summary": "📅本周新预告《蓦然回首》正式预告7月15日，电影《蓦然回首》发布了正式预告，将于9月11日在日本上映。是枝裕和执导、编剧、剪辑，出口夏希、莳田彩珠主演，菅田将晖、宫藤官九郎、野吕佳代、山田真步等出演， ...<a href=\"https://sspai.com/post/112444\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-17T09:57:46+00:00", "fetched_at": "2026-07-18T02:01:58.417000+00:00", "fingerprint": "ffa1ffb8b60f7b 33/netflix-ai-titles-q2-2026-earnings", "summary": "Netflix says roughly 300 titles on its platform used generative AI, most of which occurred in post-production. The streaming service revealed the news in its second-quarter earnings report released on Thursday, saying it's \"increasingly leveraging these tools to deliver higher quality output more quickly and at a lower cost.\" It also provided some examples of [&#8230;]", "category": "tech", "published_at": "2026-07-16T20:29:27+00:00", "fetched_at": "2026-07-17T02:12:46.613638+00:00", "fingerprint": "27ca79ebdfb92091"}, {"source": "The Verge", "title": "Samsung’s 55-inch Frame art TV is $200 cheaper than usual", "url": "https://www.theverge.com/gadgets/966613/samsung-the-frame-art-tv-deal-sale", "summary": "Samsung’s Frame is different from your average 4K TV. Its biggest selling point involves what it does when you aren’t actively using it. It can display art, turning your living room into a gallery. The Frame has bezels that make it look like — you guessed it — framed art, and its matte finish can [&#8230;]", "category": "tech", "published_at": "2026-07-16T20:47:30+00:00", "fetched_at": "2026-07-17T02:12:46.613632+00:00", "fingerprint": "61ad2162d5206ebf"}, {"source": "The Verge", "title": "Fortnite is getting a bunch of AI-powered ‘personas’", "url": "https://www.theverge.com/games/966815/epic-games-fortnite-ai-powered-personas", "summary": "Get ready for more AI characters in Fortnite. Developer Epic Games is going to let Fortnite creators publish experiences featuring characters with AI-powered voices starting on July 30th, and ahead of that launch, it's created 36 characters with \"consistent voices and personas\" that creators can use as NPCs. The characters include Fortnite staples like Agent [&#8230;]", "category": "tech", "published_at": "2026-07-16T21:30:35+00:00", "fetched_at": "2026-07-17T02:12:46.613621+00:00", "fingerprint": "86194fd02b6b00f0"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨长鑫科技网上发行初步中签率为0.40995452%；特朗普头像将被印上硬币，面值1美元；多家NFC鲜榨果汁生产车间被曝无水果", "url": "https://36kr.com/p/3898973942007684?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>SpaceX市值蒸发近8500亿美元</p>\n  <p>韩国将暂停新的单一股票杠杆ETF上市，以抑制市场波动</p>\n  <p>泡泡玛特创始人王宁带队探访苹果总部</p>\n  <p>亚马逊Leo与南非企业达成协议，预计明年启动卫星互联网服务</p>\n  <p>日本拟采购2.75万颗英伟达Rubin芯片，打造本土机器人AI基础模型</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>长鑫科技：网上发行初步中签率为0.40995452%</strong></p>\n  <p>36氪获悉，长鑫科技公告，根据上交所提供的数据，本次网上发行有效申购户数为9,428,778户，有效申购股数为816,920,125,000股。网上发行初步中签率为0.40995452%。</p>\n  <p><strong>特朗普头像将被印上硬币，面值1美元</strong></p>\n  <p>美国财政部长贝森特15日说，为纪念美国建国250周年，美国铸币局将开始铸造正面印有特朗普总统头像的1美元硬币。该硬币的正面还印有“自由”“我们信仰上帝”“1776—2026”等，背面则是白头海雕图案。特朗普表示，这款硬币令他感到“荣幸”。</p>\n  <p>但批评人士对该硬币的合法性提出了质疑。1866年的一项美国法律规定，在世人物的肖像不得用在美国货币上，但该法律指的是由美国印刷局印制的纸币，硬币则由美国铸币局铸造。（第一财经）</p>\n  <p><strong>多家NFC鲜榨果汁生产车间被曝无水果，相关产品仍在线上售卖</strong></p>\n  <p>近年来，NFC果汁广受消费者欢迎。不少打着“鲜榨”“100%果汁”和“NFC果汁”旗号的菠萝汁、西瓜汁、山竹汁，在电商平台单品销量动辄高达几十万件，但价格却低到让人难以置信。记者实地暗访河南多家代工厂发现，车间根本没有水果和鲜榨设备，所谓“鲜果冷榨果汁”，全靠水、浓缩原浆勾兑而成。厂家坦言，“低价不可能鲜果现榨”，他们往往靠调换包装上的“100%”“NFC”等标注顺序打擦边球。目前多家涉事企业已停产整改。不过，记者发现线上仍有相关产品售卖，且部分瓶身外包装标识未作更改。（齐鲁电视台）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>月之暗面将推出新模型Kimi K3</strong></p>\n  <p>月之暗面将推出新模型Kimi K3，该模型参数规模达2万亿至3万亿。（新浪财经）</p>\n  <p><strong>马斯克旗下SpaceXAI宣布开源Grok Build</strong></p>\n  <p>当地时间7月15日，马斯克旗下SpaceXAI宣布开源Grok Build，并重置所有用户的使用限制。针对用户关于隐私的问题，公司表示，自上线以来，Grok Build完全尊重零数据保留（ZDR）原则。所有用户始终能够在命令行界面中禁用数据上传。在早期测试版中，非ZDR用户默认启用了数据保留。自7月12日起，公司已为所有GrokBuild用户禁用默认数据保留，此外正在删除之前保留的所有编码数据，确保每位用户的偏好得到尊重。（界面新闻）</p>\n  <p><strong>DeepSeek估值超3500亿元</strong></p>\n  <p>开润股份16日晚间的一纸投资进展公告，意外披露了国内头部人工智能企业“深度求索”（DeepSeek）的最新市场估值。按公告数据推算，DeepSeek本轮融资后估值已攀升至约3510亿元。从接近DeepSeek处人士确认，随着本轮融资完成，该公司目前已经开始启动第二轮融资了，但是年底是否冲刺科创板，目前并未确定。 (上证报)</p>\n  <p><strong>日本拟采购2.75万颗英伟达Rubin芯片，打造本土机器人AI基础模型</strong></p>\n  <p>7月16日消息，日本计划采购2.75万颗英伟达下一代Rubin AI芯片，用于构建本土机器人基础AI模型。新成立的Noetra将负责建设大型数据中心，并计划于2027年3月发布首个AI模型，随后持续迭代，未来数年推出面向机器人应用的AI模型。Noetra截至2027年3月已获日本政府3873亿日元资金支持，由软银、丰田汽车支持的Preferred Networks、日本电气等数十家企业参与运营。该项目旨在降低对海外技术依赖，并推动日本到2040年占据全球约60万亿日元机器人市场30%以上份额。（界面新闻）</p>\n  <p><strong>孙正义预计AI机器人市场规模将超290万亿元</strong></p>\n  <p>近期，国际资本市场人工智能相关板块出现剧烈波动，有关“AI泡沫”的争论也愈发激烈。当地时间14日，日本软银集团创始人兼首席执行官孙正义在东京出席一场活动时表示，对AI泡沫的担忧毫无依据，今天质疑AI，就如同当年拒绝汽车和飞机一样荒谬。据共同社报道，当天的活动上，孙正义表示，2040年前后，将有约10亿台搭载AI的人形机器人投入运行，届时，AI机器人的市场规模将扩大到约7000万亿日元（约合人民币292.7万亿元），相当于全球经济总量的20%。（央视财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>美股三大指数集体收跌，SpaceX盘后下跌3%</strong></p>\n  <p>美股三大指数集体收跌。半导体、存储芯片股大跌，费城半导体指数跌超4%，英特尔、美光科技、博通均跌超5%，SK海力士跌超13%，闪迪跌超12%。中概股逆势走强，纳斯达克中国金龙指数涨1.79%。</p>\n  <p>大型科技股表现分化。苹果、微软上涨逾1%，特斯拉跌0.86%、亚马逊跌近2%、英伟达跌超2%，谷歌大跌逾4%。此外，SpaceX股价持续下行，当日跌超3%。该股从6月上市以来高点大幅回落逾31%，市场对其超高估值的质疑持续发酵。（中国证券报）</p>\n  <p><strong>巴菲特：重仓Alphabet系亲自决策，后悔买入过晚</strong></p>\n  <p>传奇投资者沃伦·巴菲特近日接受采访时表示，伯克希尔·哈撒韦近期对谷歌母公司Alphabet的重大投资是由他本人亲自促成，而非新任首席执行官格雷格·阿贝尔。巴菲特透露，是他发起了这笔交易，并坚称自己与接班人阿贝尔保持着极其密切的沟通，虽然两人在重大决策上彼此认可，但他才是此项投资的最终决定者。尽管亲自操刀了这笔巨额投资，现年95岁的巴菲特在受访时坦言，自己犯了未能及早投资Alphabet的错误，他长期以来一直对错失这家科技巨头的早期崛起表示遗憾。（界面新闻）</p>\n  <p><strong>苹果上调AppleCare+服务价格</strong></p>\n  <p>苹果上调AppleCare+服务价格，Mac和iPad月度套餐费用上涨0.5美分，年度套餐上涨5美元，仅影响新用户。（财联社）</p>\n  <p><strong>韩国将暂停新的单一股票杠杆ETF上市，以抑制市场波动</strong></p>\n  <p>韩国将暂停新的单一股票杠杆交易所交易产品上市，以抑制市场波动。此前与三星电子和SK海力士挂钩的杠杆基金需求激增。韩国金融服务委员会周四发表声明称，该禁令将持续有效，直至市场状况稳定。此外，当局还将自8月5日起把杠杆ETF的最低存款额从1000万韩元提高至3000万韩元（20300美元）。这是韩国政府迄今为抑制散户交易狂潮而推出的最全面举措。（新浪财经）</p>\n  <p><strong>泡泡玛特创始人王宁带队探访苹果总部</strong></p>\n  <p>36氪获悉，当地时间7月14日下午，泡泡玛特创始人王宁率领核心高管团队探访美国硅谷苹果总部Apple Park，并与苹果现任CEO Tim Cook、即将上任的新任CEO John Ternus等高管会面。双方围绕创意设计、数字生态与全球消费趋势展开了深入而友好的交流。</p>\n  <p><strong>AI手机概念爆发，智度股份等多股涨停</strong></p>\n  <p>7月16日，AI手机概念持续活跃，带动端侧AI概念整体走强，智度股份直线涨停走出2连板，此前格林精密、福日电子、国光电器、福蓉科技等涨停，豪声电子、慧为智能、电声股份、泓禧科技均涨超10%。消息面上，据界面新闻报道，字节跳动联合中兴努比亚打造的首款AI智能体手机（“豆包AI智能体手机”）今年将有多款机型发布，其中一款将于2026世界人工智能大会期间亮相，其整体备货约20万台，首批备货10万台以内。（财联社）</p>\n  <p><strong>深圳等一线城市租房需求攀升，租金房价比持续抬升</strong></p>\n  <p>与房价相比，房租是和居民生活成本关联更为直接的指标。随着2026年暑期租赁高峰全面到来，深圳等一线城市租房需求快速攀升，租赁市场率先走出调整通道。近日，走访深圳市罗湖区、龙岗区、福田区多个住宅小区与城中村发现，伴随毕业季求职、换房需求集中释放，深圳租赁市场活跃度显著提升，城市人口吸引力与经济活力在租房数据中得到直观体现。从全国范围来看，今年上半年一线城市平均租金实现小幅上涨，正式结束此前连续两年的调整态势。（证券时报）</p>\n  <p><strong>脑机接口迎政策资本双重加持，产业加速打通商业化落地链路</strong></p>\n  <p>7月15日，上海市科委消息，植入式脑机接口手部运动功能代偿系统（NEO）获批上市后的首张处方7月13日在上海开出，全球首例植入手术在复旦大学附属华山医院完成。该款脑机接口产品于今年3月获批上市。7月15日，A股脑机接口概念股走强。行业人士研判，中国脑机接口领域发展水平整体位列全球第一梯队，依托完整产业链与工程师红利具备弯道超车潜力，但仍在脑神经底层基础研究、专用芯片等领域存在短板，业内正从政策引导、产业集聚、技术迭代等多维度破局，稳步打造完整商业闭环。（中证网）</p>\n  <p><strong>现代汽车集团将把波士顿动力转为全资子公司</strong></p>\n  <p>现代汽车集团7月16日表示，将收购软银持有的波士顿动力公司近10%股份，把后者转变为全资子公司。该集团称，此举将有助于其在各项业务中部署先进机器人技术。此前有媒体报道称，这笔交易的价值预计近5000亿韩元（约合3.35亿美元）。（界面新闻）</p>\n  <p><strong>中信证券：建议重点关注医疗健康产业投资机会</strong></p>\n  <p>36氪获悉，中信证券研报称，医药板块继续凸显出刚需的高确定性，同时叠加国内生物医药融资数据的持续高增长，中信证券认为医药创新企业和全球医药产业链企业有望在未来3-5年持续迎来业绩的稳健增长。同时叠加今年Q3开始，国产创新药核心管线即将迎来重磅数据读出催化、具有全球潜力的资产国际化价值有望加速兑现。同时政策大变革也开始逐步重新回归到临床价值和需求导向的市场价格定价体系，带来稳定且持续的国内医药市场环境和长坡厚雪的发展主基调，带来行业成长确定性较高的阿尔法和贝塔。建议重点关注医疗健康产业投资机会。</p>\n  <p><strong>韩国央行将利率上调25个基点至2.75%</strong></p>\n  <p>韩国央行将利率上调25个基点至2.75%，为2023年1月以来首次加息，符合市场预期。（财联社）</p>\n  <p><strong>基金二季报科技调仓现分歧，多只绩优基金维持高仓位</strong></p>\n  <p>今年上半年，科技板块是A股市场当之无愧的“领头羊”，多只重仓科技赛道的权益类基金收益率表现亮眼。最新披露的公募基金二季报显示，尽管多数基金经理依然对科技板块保持着极高配置热情，但针对科技股内部的板块轮动以及估值逻辑，已经产生显著分歧。随着全球AI浪潮持续，科技板块呈现了极高景气度。从近期已披露的基金二季报来看，中欧基金、平安基金、融通基金、红土创新基金和金信基金等多家公募旗下多只绩优基金，对科技股仍然维持高仓位运作，且多只产品单季度取得超高收益。（证券时报）</p>\n  <p><strong>行业景气度得到验证，锂电产业链企业上半年业绩大面积预喜</strong></p>\n  <p>锂电企业2026年上半年业绩预告集中披露，行业上行周期逻辑得到进一步印证。Choice数据显示，截至7月15日收盘，已有35家锂电产业链上市公司发布上半年业绩预告，除3家业绩同比下滑，其余为预增、扭亏或减亏。各企业的“成绩单”显示，从上游锂矿、锂盐，到中游锂电材料，再到下游动力电池、储能赛道，产业链各环节景气度同步回暖。上游锂盐实现量价齐升，相关企业业绩大面积预增；中游隔膜、电解液与下游电池厂商盈利同步修复。（上证报）</p>\n  <p><strong>印度上调柴油和航空燃油出口税，下调汽油出口税</strong></p>\n  <p>印度政府宣布，自7月16日起调整石油产品出口暴利税。其中，柴油出口暴利税从每升8.5卢比上调至15.5卢比，航空涡轮燃料出口税从每升7.5卢比上调至14.5卢比；汽油出口税则从每升4卢比下调至2.5卢比。（财联社）</p>\n  <p><strong>日本议会通过法律，将加密货币重新归类为金融资产</strong></p>\n  <p>日本将加密货币重新归类为金融工具，这一结构性变化确立了加密资产单独征税的法律框架以及未来加密交易所交易基金（ETF）的基础。该立法周三经议会批准修订了《金融工具和交易法》及《支付服务法》（PSA）。该修订将加密货币从主要作为支付工具的框架转变为与其他金融工具一同作为投资对待。新规预计将于2027年生效。（新浪财经）</p>\n  <p><strong>前IBM金融掌门人范斌空降中关村科金，出任高级副总裁</strong></p>\n  <p>7月16日，中关村科金宣布，前IBM金融行业总经理范斌出任高级副总裁，他将负责银行及信贷事业部、财富及保险事业部、联合运营事业部以及海外业务战略及拓展。这步人事落子，透露出中关村科金两大战略意图：加固金融基本盘，提速出海新增长。范斌拥有25年金融咨询经验，是中国区唯一的IBM金融行业学院院士，曾操盘国内大量核心银行系统变革项目。</p>\n  <p><strong>亚马逊Leo与南非企业达成协议，预计明年启动卫星互联网服务</strong></p>\n  <p>亚马逊旗下低轨卫星网络Leo当地时间7月15日宣布，与南非最大固定互联网服务提供商Herotel达成协议，通过一项名为evry的新服务将卫星互联网引入南非。Evry预计将于2027年正式上线，为南非的住宅用户提供网络连接。这是Amazon Leo在非洲达成的首项此类协议。（界面新闻）</p>\n  <p><strong>成立世界人工智能合作组织协定签署仪式在上海举行</strong></p>\n  <p>7月16日，成立世界人工智能合作组织协定签署仪式在上海举行。中共中央政治局委员、外交部长王毅出席并代表中国政府签署协定。协定明确，世界人工智能合作组织是独立的政府间国际组织，遵循《联合国宪章》宗旨，秉持共商共建共享理念，坚持以人为本原则，旨在促进人工智能国际合作和全球治理，确保人工智能朝着有益、安全、公平方向健康有序发展，造福全人类。组织总部设在中国上海。哈萨克斯坦副总理兼人工智能和数字发展部部长马迪耶夫、老挝副总理兼外长通沙万、巴基斯坦副总理兼外长达尔、俄罗斯总统办公厅副主任奥列什金、印度尼西亚经济统筹部部长艾尔朗加等29个国家代表签署协定，成为创始成员国。联合国秘书长古特雷斯等国家和国际组织代表出席仪式。（新华社）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>神州股份科创板IPO审核状态变更为“已问询”</strong></p>\n  <p>36氪获悉，上交所官网显示，7月15日，江苏神州半导体科技股份有限公司科创板IPO审核状态变更为“已问询”。</p>\n  <p><strong>百度：寻求在港交所主板自愿转化为双重主板上市</strong></p>\n  <p>36氪获悉，百度宣布，董事会批准根据香港联交所指引信HKEX-GL112-22寻求于香港联交所主板自愿转换为双重主要上市的动议。预期主要转换事项将于本年度内生效。董事会亦授权本公司管理层进行相关筹备工作并采取必要步骤以完成主要转换事项。主要转换事项后，本公司将成为于香港联交所主板及纳斯达克全球精选市场双重主要上市的公司，其A类普通股及美国存托股将继续于两个证券交易所内买卖（视情况而定），且仍可互相转换。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>台积电二季度净利润为7065.6亿新台币，同比增长77.4%</strong></p>\n  <p>台积电7月16日公布截至6月30日的2026年二季度合并财务报告。合并营收为12703.8亿新台币，同比增长36%，净利润为7065.6亿新台币，同比增长77.4%；毛利率为67.7%，营业利润率为60.3%，净利润率为55.6%。二季度晶圆总营收中，2纳米、3纳米、5纳米和7纳米制程出货分别占比3%、30%、33%和11%，7纳米及更先进制程合计占晶圆总营收的77%。（界面新闻）</p>\n  <p><strong>摩尔线程：预计上半年营业收入同比增长135.12%-149.37%</strong></p>\n  <p>36氪获悉，摩尔线程公告，预计2026年上半年营业收入为16.5亿元—17.5亿元，同比增长135.12%至149.37%。报告期内，得益于人工智能产业的蓬勃发展及市场对全功能GPU的强劲需求，叠加公司夸娥智算集群商业化加速，产品性能获得客户高度认可并实现稳定供货，公司市场竞争优势进一步扩大，推动收入快速增长。</p>\n  <p><strong>海光信息：预计上半年净利润同比增长41.50%到52.32%</strong></p>\n  <p>36氪获悉，海光信息公告，预计2026年上半年实现归属于母公司所有者的净利润与上年同期（法定披露数据）相比，将增加49854.82万元到62854.82万元，同比增长41.50%到52.32%。扣除股份支付的影响后，将增加92478.07万元到105478.07万元，同比增长74.27%到84.71%。</p>\n  <p><strong>奈飞第二季度营收125.6亿美元，同比增长13%</strong></p>\n  <p>奈飞第二季度营收为125.6亿美元，同比增长13%，市场预期为125.9亿美元；营业利润为42亿美元，同比增长11%。公司将全年营收预期下调至510亿至514亿美元，同比增长13%至14%，预计2026年营业利润率为31.5%。（界面新闻）</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>豆包AI手机今年将发布多款机型</strong></p>\n  <p>字节跳动联合中兴努比亚打造的首款AI智能体手机（“豆包AI智能体手机”）今年将有多款机型发布，其中一款将于2026世界人工智能大会期间亮相，其整体备货约20万台，首批备货10万台以内，截至发稿中兴方面对此消息暂无回应。（界面新闻）</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-07-17T00:05:38+00:00", "fetched_at": "2026-07-17T02:12:46.502426+00:00", "fingerprint": "a6cfc8a79f82633c"}, {"source": "36氪 - 最新文章", "title": "独家 | 智谱 ARR 达到10 亿美元，半年增长 15 倍", "url": "https://36kr.com/p/3898662052693894?f=rss", "summary": "<p>文 | 周鑫雨</p>\n  <p>编辑 | 张雨忻</p>\n  <p>智能涌现从多个独立信源处获悉，<strong>截至 2026 年 7 月， 智谱的 ARR（年度经常性收入）已经达到 10 亿美元</strong>。</p>\n  <p>截至发稿前，针对上述信息，智谱未回复。</p>\n  <p>过去一年，AI Coding 和视频生成模型已经成为全球造血能力最强的 AI 赛道。</p>\n  <p>海外，Anthropic 的 Claude Code 仅发布半年，ARR 就飙升至 10 亿美金。这一现金牛产品，也将 Anthropic 的整体 估值抬高到万亿美金（2026 年 5 月），超过了 OpenAI。</p>\n  <p>但此前，对于国内大模型公司能否复刻 Anthropic 的财富神话，市场一直抱有疑问。一方面，背靠企业付费意愿高、订阅生态成熟的北美市场，Anthropic 有天然优渥的商业化土壤。另一方面，Anthropic 的估值，与智谱最新市值仍存在一个数量级的差距——这意味着，Anthropic 有更大量的资金能获取训练资源，这是国内模型厂商还比不了的。</p>\n  <p>但智谱达到 10 亿美金 ARR 的速度，远超预期。曾有投资人对我们表示，智谱的 ARR 预计到 2026 年底，才能达到 10 亿-15 亿美金。</p>\n  <p>一个更直观的对比是：根据Anthropic 的官方数据和智谱财报数据，ARR 从 1 亿美金增长到 10 亿美金，Anthropic 用了 15 个月，智谱仅用了 5 个月。<strong>据知情人士，在2026 年 1 月到7 月期间，智谱的 ARR 增长了 15 倍。</strong></p>\n  <p>智谱是国内最早押注 Coding 路线的模型厂商之一。2025年初，智谱就开始将力量收敛到了对模型 Coding 能力的提升上。智谱创始人唐杰曾形容智谱押注了 Coding 和 Reasoning——一种能与 Agent 共生共荣的模型能力。</p>\n  <p>后续，智谱以平均两个月一版的速度，发布了一系列 Coding 能力位于全球第一梯队的旗舰模型。2026 年 6 月最新上线的 GLM-5.2，即便开源，多个核心指标依然追平甚至超过了 Claude Opus 4.8 以及 GPT-5.5。</p>\n  <p>智谱官方曾提到，<strong>大模型的商业价值可以理解为</strong>“<strong>智能上限 × Token 消耗规模</strong>”，只要模型能力继续领先，调用量就会不断增长。财报显示，<strong>今年 Q1，GLM 的 API 价格累计调高约 83%，海外订阅价格甚至接近 Claude Code，但调用量仍增长约 400%。</strong></p>\n  <p>在用 Token 消耗衡量模型商业化水平的当下，Coding 和视频生成模型代表了两种范式：前者为企业和开发者直接提供生产力，后者则是进入到了工业化内容生产的核心环节。</p>\n  <p>从营收数据上看，Coding 的市场需求已经走向确定，视频生成也是。据智能涌现了解，Seedance2.0 的月营收接近 10 亿元；而高盛预测，可灵 AI 的 ARR 到年底能达到 10 亿美金。</p>\n  <p>不过，确定性的生意，也意味着更激烈的竞争。6 月，MiniMax 发布了 M3，重点强化了 Coding 和 Agent 能力。7 月 16 日，月之暗面也发布了 K3，一个参数量 达 2.8 万亿、综合智力水平仅次于 Claude Fable 5 和 GPT-5.6 Sol 的开源模型。</p>\n  <p>就连海外，随着 GPT-5.6 的发布、ChatGPT 与 CodeX 的合并，OpenAI 在 Coding 领域，也显示出了逆袭 Anthropic 的势头。</p>\n  <p>在当下这个时间点，Coding 之战还远未结束。</p>", "category": "tech", "published_at": "2026-07-17T01:05:04+00:00", "fetched_at": "2026-07-17T02:12:46.502420+00:00", "fingerprint": "7c41cb85511950c0"}, {"source": "36氪 - 最新文章", "title": "自研氢能催化剂关键材料，稳定性提升50%，「铂氢科技」完成数千万元Pre-A轮融资 | 36氪首发", "url": "https://36kr.com/p/3899040301876868?f=rss", "summary": "<p>36氪获悉，苏州铂氢科技源科技有限公司（以下简称「铂氢科技」）宣布完成数千万元Pre-A轮融资。本轮融资由东运创投领投、新晖资本跟投，老股东熔拓资本追投，资金将主要用于催化剂与膜电极新产线建设、研发及运营团队扩充。</p>\n  <p><strong>铂氢科技成立于2023年5月，专注于氢能等新兴领域的贵金属催化剂及膜电极等下游产品研发、生产与销售。</strong>产品矩阵覆盖燃料电池催化剂（铂碳、铂黑、铂钌黑、铂基合金等系列）和水电解催化剂（氧化铱、铱黑、负载型氧化铱、铱钌合金等）两大品类，并申请发明专利和实用新型专利15余件。</p>\n  <p>公司负责人邹亮亮是中国科学院大学博士，现担任苏州科技大学教授、博士生导师，拥有十余年贵金属催化剂研发经验。运营团队核心成员长期在能源和材料领域从事项目研发与市场拓展。</p>\n  <h2><strong>1.以配方和结构设计创新，解决催化剂效率难题</strong></h2>\n  <p>当下我国氢能产业正处在一个微妙的发展节点。一方面，据GEP Research统计，2026年中国在全球氢燃料电池催化剂市场中的占比提升至38.7%，达到108.1亿美元，成为全球最大的单一区域市场。氢能不仅被《能源法》纳入国家能源体系，还被列为“十五五”规划六大未来产业之一。但另一方面，产业实际需求尚未跟上产能规划的步伐，下游订单不足导致上游竞争加剧，产业链利润率不断压缩。</p>\n  <p><strong>在氢能产业链中，催化剂是决定生产系统效率和成本的核心材料之一。其中必需的铂、铱等贵金属原料，供给稀缺且大量依赖进口，因此又是催化剂材料实现国产化与成本优化的关键。</strong></p>\n  <p>邹亮亮表示，铂氢科技选择切入贵金属催化剂赛道，一是基于此前的长期技术积累，二是坚信“贵金属催化剂在未来很长一段时间内，仍然是氢能领域的主流选择”。</p>\n  <p>性能衰减与成本高企是铂基催化剂在反应过程中长期面临的痛点，“主要是因为铂原子在反应中会发生迁移和团聚，颗粒变大后导致活性下降，使催化剂失活”。邹亮亮解释。</p>\n  <p>针对这一痛点，铂氢科技通过对活性颗粒进行结构调控，增强催化剂稳定性，相比传统铂碳催化剂，铂氢科技的Pt/C纳米催化剂在耐久性测试中稳定性可提升40%-50%，3万圈加速老化测试后的性能衰减幅度减少10%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_5df572e74a274183ade4e1a5136f233b@5688585_oswg46786oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">铂氢科技60%铂碳催化剂</p>\n  <p>此外，在PEM电解水制氢领域，铂氢科技采用“模板法”开发富氧纳米氧化铱催化剂，通过构建纳米结构模板，确保催化剂颗粒始终保持小尺寸且分布均匀，充分参与催化反应。该产品的贵金属用量可降至0.4mg/cm²，是行业普遍应用技术的三分之一，电堆能耗低至4.1kWh/m³，理论寿命超过8万小时。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_399446e76586449ebbc5b407080f8039@5688585_oswg124847oswg1080oswg870_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">氧化铱性能对比数据图</p>\n  <h2><strong>2.“先活下去，等风来”</strong></h2>\n  <p>在商业化方面，铂氢科技的直接客户覆盖燃料电池膜电极、电堆企业以及PEM电解水制氢膜电极、电解槽制造商。公司已与中石油等能源、化工、燃料电池汽车厂商等氢能终端应用央企建立合作，并与科润、云帆等产业链上下游伙伴形成横向协同，共同为客户提供从催化剂、膜电极到电堆的一站式解决方案。</p>\n  <p>为减少贵金属损耗，降低原材料成本，铂氢科技也在探索贵金属催化剂的回收模式。</p>\n  <p>邹亮亮透露，2026年铂氢科技上半年实现营收2800万元，预计全年营收可超过4000万元。</p>\n  <p>在此基础上，铂氢科技计划持续投入研发，每年推出3-5款具有市场竞争力的新产品，争取2027年实现营收翻倍，服务客户超过320家，并完成两条核心产线建设，实现催化剂和膜电极的规模化稳定生产。</p>\n  <p>在当下重金属原材料价格不断上涨，产业链上游持续内卷的行业周期里，铂氢科技的短期目标不是盲目追求规模增长，而是保证“等行业风口来的时候，我们还活着，并且做好了准备。”</p>", "category": "tech", "published_at": "2026-07-17T01:09:52+00:00", "fetched_at": "2026-07-17T02:12:46.502413+00:00", "fingerprint": "7f94f143d26d5cee"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 这家人形机器人ODM厂商获千万融资，飞荣达、索辰科技接连下注", "url": "https://36kr.com/p/3899057634363266?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_50b87c3fce99434187077587e61d999f@6221844_oswg477499oswg1202oswg684_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2400</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，人形机器人ODM方案商半醒具身（BXI Robotics）于近期完成千万元级新一轮融资，投资方为A股上市公司索辰科技。本轮资金将主要用于下一代人形机器人研发及海外市场拓展。此前，半醒具身曾于2025年完成首轮机构融资，投资方为上市公司飞荣达。</p>\n  <p>半醒具身成立于2022年，但团队早在2020年便开始了人形机器人的研发工作。公司联合创始人兼CEO陈彦2003年毕业于东南大学计算机专业，在投身机器人创业前拥有多年二级市场量化交易经验；联合创始人刘福强本科毕业于西南科技大学，大学期间连续四年参加全国大学生机器人大赛并多次获奖。</p>\n  <p>公司专注于高动态双足人形机器人的全栈自研，是国内少数同时具备整机设计、核心电机、运动控制算法与场景软件交付能力的团队之一。目前，公司主要为品牌客户提供通用人形机器人ODM服务，方案涵盖白牌整机、关节电机模组、运动控制算法及应用软件开发等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_decd50004f1b4aeb949595812f3089f2@6221844_oswg627045oswg740oswg987_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">半醒具身相关产品展示（图源/企业）</p>\n  <p>选择ODM路线，源于半醒具身团队对市场需求的务实判断。公司创始人陈彦告诉36氪，人形机器人赛道火热之后，大量公司希望快速拥有自有品牌的人形机器人产品，但自研面临研发周期长（通常需要2-3年）、团队组建难、结果不确定等现实痛点。这催生了一个实实在在的ODM市场需求。</p>\n  <p>半醒具身的核心优势在于“全栈自研”。不同于市面上许多方案集成商，半醒从电机做起，逐步补齐了电控、结构设���、运动控制算法等全链条能力。</p>\n  <p>“我们是��整机需求出发，倒推去设计每一个零部件。”陈彦介绍。</p>\n  <p>以关节电机为例，团队在2020年启动项目时，市面上买不到能满足人形机器人后空翻需求的大扭矩电机、高频率电控。半醒便从关节电机模组开始自研，尝试了摆线、行星方案，做出了峰值扭矩800牛米的行星关节电机，还做了电机内水冷方案，配合自研的1000Hz电控系统，做出第一代样机。经过迭代，目前公司已形成BXI-50/70/85三款标准化行星中空关节电机模组，覆盖人形机器人全身31个自由度。</p>\n  <p>在ODM市场，客户决策周期长、单笔金额大，对供应商的可靠性要求极高。半醒具身将“实战验证”“量产交付”作为核心卖点。</p>\n  <p>硬氪了解到，半醒具身是极少数参加过机器人马拉松并完赛的ODM方案商之一。2025年4月，其“精灵2”机器人以未经改装的量产版本参加首届北京人形机器人半程马拉松，以4小时2分19秒完赛，位列第六；2026年4月，“精灵3”再次参赛，以150分钟净时间完赛，排名前列。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_715311378ce2493b9f46221bb60a5502@6221844_oswg808301oswg972oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">半醒具身“精灵3”参赛机器人马拉松（图源/企业）</p>\n  <p>产能方面，半醒具身依托股东飞荣达在深圳和常州的生产基地支持，目前月产能可达数十台，短期内可扩至月产百台以上。公司预计，从2026年7月到2027年7月，单月订单金额有望超过千万元，全年营收预计过亿。</p>\n  <p>公司透露，客户涵盖头部科技互联网公司、多家国内主流车企及机器人企业，类型包括主机厂、二次开发商、具身智能“大脑”研发商，以及纺织、光伏清洁、无人洗车等垂直场景方。</p>\n  <p>海外市场同样是半醒具身的重点方向。目前公司已有美国头部科技公司客户，并正在拓展韩国、日本、欧洲等市场。“任何一个国家都不希望在人形机器人上依赖其他国家，每个当地市场都有巨大的ODM需求。”陈彦说。</p>\n  <p>在研发方向上，半醒具身将重点突破末端执行器（灵巧手）、感知与计算三大模块，以提升机器人“自由执行任务”的能力。</p>\n  <p>他们判断，双足人形机器人“自由移动”的能力已在过去几年得到较好解决，而“自由执行任务”的能力将是行业下一阶段的竞争焦点。</p>\n  <p><strong>以下为硬氪与半醒具身团队的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：相比其他ODM方案商，半醒最大的差异化优势是什么？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们能够真正提供从电机到电控、传感器、算力定制，到运动算法、操作算法的全栈方案，并且是经过量产和赛场验证的。客户跟我们合作，不需要再去找其他供应商，项目失败风险很小。我们就像一个六边形，缺一边都不行。市面上看起来有很多竞争者，但客户真正的选择并不多。</p>\n  <p><strong>硬氪：为什么不做自有品牌，而是选择ODM路线？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们发现了ODM这个金矿，现在要做的就是把手中的金矿挖完。人形机器人的终端市场目前主要是科研机构和实验室，买单方是“资本开支”而非普通消费者。大量公司希望快速拥有自有品牌的人形机器人，但自研周期长、风险高。我们花了五年时间从0走到60分，客户选择跟我们合作，本质上是“花钱买时间”。</p>\n  <p><strong>硬氪：如何看待人形机器人行业的发展节奏？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们总是高估短期的趋势，低估长期的发展。2020年我们刚开始做的时候，梦想只是让机器人走起来。到今天，行业已经解决了“自由移动”的问题，接下来会解决“自由执行任务”的问题。</p>\n  <p>我们判断2027年人形机器人就会真正走入生活——不是隔着屏幕看，而是在身边看到。这个行业不是线性增长，而是台阶式的，一旦越过某个临界点，就会迎来集中爆发。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>索辰科技（688507）董秘吴味子：</strong>索辰高度看好半醒科技的底层硬件创新能力、硬核研发团队与标准化量产商业模式。半醒自研机器人核心关节与开放整机底座，实现高精度动态运动调控，技术稀缺且易于落地；轻量化 ODM 交付大幅降低具身智能产业化门槛，与索辰物理 AI 仿真体系高度协同，是衔接仿真与实体机器人落地的关键环节。</p>\n  <p>本次战略入股将推动双方技术产品深度融合，围绕硬件适配、数据迭代、运动控制重构完善具身智能完整技术链条。双方将打破传统机器人封闭硬件壁垒，打造标准化开放轻量化底座，为物理 AI 算法迭代提供专属硬件载体；搭建全域数据闭环，真机运行数据实时回流索辰物理 AI 平台，形成 “仿真训练 — 真机落地 — 数据回传 — 模型优化 — 迭代重训” 循环，持续提升物理模型仿真精度。依托营造・万象大模型重构机器人运动控制逻辑，实现高动态自主运动调控，让硬件成为物理 AI 的实体执行终端，完成物理仿真到实体具身智能落地的重要突破，落地具备高阶作业能力的人形机器人。</p>", "category": "tech", "published_at": "2026-07-17T01:26:47+00:00", "fetched_at": "2026-07-17T02:12:46.502405+00:00", "fingerprint": "328b6eabcb27abe8"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前蔚来、华为智驾核心成员联手创业具身世界模型，三个月内完成数亿元融资", "url": "https://36kr.com/p/3899081603483525?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，具身智能世界模型公司日冕开物（北京日冕机器人有限公司）近期完成连续两轮种子轮融资，融资合计金额达数亿元人民币，由鼎峰科创、远图未来、百度风投、沃衍资本、武岳峰科创、万林国际共同参与投资。同时，新一轮融资也在同步交割中。</p>\n  <p>此前融资资金主要用于自研世界模型 LaMPA 的研发迭代、强化学习体系建设，以及数据闭环和产品交付能力的持续完善。</p>\n  <p>日冕开物成立于2026年3月，聚焦物理世界基础模型研发，希望打造能够理解物理世界、预测环境变化并驱动机器人执行任务的基础模型，帮助机器人从单一场景能力，逐步迈向跨场景泛化。</p>\n  <p><strong>日冕创始团队均为清华自动驾驶背景，主导过行业首批智驾世界模型研发落地以及首批具身强化学习与交付工作。</strong>创始人肖中阳博士，曾主导智驾行业首个复杂交互场景的世界模型交付，该模型已搭载超过70万辆蔚来汽车；团队基座模型负责人，“华为天才少年”钟元鑫博士，曾主导华为新一代智驾世界模型基模的设计与量产落地工作；模型后训练与交付负责人，蔚来Super Spark王云龙博士，曾在智元机器人负责大模型与真机强化学习算法研发工作，并推动了行业首批进厂打工项目落地交付。市场负责人戴亚奇博士，曾任武岳峰科创合伙人，主导投资过数亿美金。</p>\n  <p>随着机器人开始进入复杂场景，行业越来越意识到，仅依赖模仿学习或任务级训练，难以支撑机器人真正具备泛化能力，机器人需要理解物理世界运行规律，并据此预测未来状态、规划动作，这也是世界模型成为具身智能重要技术方向的原因。</p>\n  <p>目前，业内不少研究都会参考图灵奖得主、卷积神经网络之父Yann LeCun（杨立昆）提出的JEPA理论，其核心思想是让模型学习物理世界更抽象、更本质的表征，而不是停留在像素层面的生成。</p>\n  <p>肖中阳向硬氪表示，<strong>JEPA提供了一套理论框架，而机器人真正落地仍有两个关键问题需要回答：物理世界应该如何表征，以及模型如何高效学习这些表征之间的因果关系。</strong></p>\n  <p>围绕这一问题，日冕开物研发了自有世界模型LaMPA。LaMPA的第一个核心创新在于构建了一套<strong>面向物理世界的三重表征体系</strong>。</p>\n  <p>肖中阳解释道，大语言模型之所以能够理解语言，是因为把自然语言转换成了统一的Token。而机器人同样需要一套能够描述物理世界的\"语言\"。LaMPA将机器人需要理解的信息划分为三类。第一类是环境表征（Environment），描述周围物体的位置、关系以及空间结构；第二类是本体表征（Ego），描述机器人自身状态，包括关节位置、受力情况、传感器反馈等信息；第三类则是经验表征（Experience），用于沉淀机器人长期执行任务过程中形成的先验知识，包括物体基本属性和可供性（Affordance），例如物体哪些位置可以抓取、不同任务通常采用怎样的操作顺序等。</p>\n  <p>三类信息共同构成机器人理解物理世界的隐空间（Latent Space），随后交由基础模型学习三者之间的因果关系，从而预测未来状态，并生成机器人的控制动作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_aa087cd1212749c2b8b720f51d292e1b@5920579_oswg442951oswg1080oswg624_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>除了表征方式之外，<strong>LaMPA在基础模型架构上也进行了重新设计</strong>。团队采用了更适合世界模型训练的块扩散（Block Diffusion）结构，旨在兼顾推理效率的同时，提升数据利用效率与模型可扩展性，并为后续大规模训练预留充足拓展空间。</p>\n  <p><strong>基础模型之外，强化学习是机器人最终完成场景交付的重要环节</strong>。肖中阳表示，目前不少强化学习方案依赖人工打分，当场景发生变化，例如光照、工位布局或环境噪声发生变化时，往往需要重新采集大量数据，重新进行后训练，导致部署周期较长。</p>\n  <p>针对这一问题，日冕开物引入了一套可泛化的World Reward Model（世界奖励模型）。这一模型来自基座世界模型，通过蒸馏和后训练，基座模型能够演化出一个专门负责“评价”的模型，判断什么是成功、什么是失败，像“评论家”一样为强化学习提供稳定、一致的反馈。让模型自动判断动作质量，大幅压缩针对新场景的后训练周期，加快工业场景部署效率。</p>\n  <p>据了解，公司目前已与远图未来达成战略合作，<strong>将进入服务器制造这一高精度工业装配场景</strong>，公司计划从服务器制造全流程开始，逐步延伸到前道和后道各项工序，实现全场景的跨产线规模部署</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_d4037219b2a743bb8f656c0453d71797@5920579_oswg588116oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>数据方面，日冕采用“自采+众包+模型增强”的策略：一方面，自建伴随式数据采集系统，沉淀具备场景壁垒的全模态精细操作数据；另一方面，通过数据众包平台获取高质量、多场景原始数据，扩大数据分布并降低采集成本；在数据准备阶段，利用世界模型驱动的数据增强（LCM），进一步提升数据利用效率。</p>\n  <p>未来一年，日冕开物将重点打通世界模型从场景调研、模型训练、现场部署到运行反馈的数据闭环，实现模型持续迭代。</p>\n  <p>长期来看，公司希望围绕模型、数据、交付和商业模式四个层面持续提升Scaling能力，使整套方案能够快速复制至更多工业场景及行业。</p>\n  <p><strong>以下是硬氪与日冕开物创始人肖中阳的交流节选：</strong></p>\n  <p><strong>硬氪：怎么理解日冕世界模型LaMPA&nbsp;和JEPA 之间的关系？</strong></p>\n  <p><strong>肖中阳：</strong>JEPA 是较早提出的一套非常基础的理论体系，其中有很多值得我们借鉴和吸收的地方。尤其是在 latent（隐空间）结构上的描述，我们非常认可。它强调模型应该关注事物的本质特征，而不是被像素级、细节层面的信息牵引，这一点对世界模型的发展非常重要。</p>\n  <p>严格来说，日冕世界模型是在这套理论体系基础上的进一步延伸。但我们并不是先选择某一套理论框架，再去做技术实现，而是从“一个原生世界模型应该如何构建”这个问题出发，探索适合的方法。JEPA 提出了一个重要方向，即模型需要学习一个更具抽象能力的 latent space。但它并没有进一步回答：这个 latent space 应该如何构建。另外，JEPA 也没有限定模型应该采用什么样的基础架构，去理解和预测未来状态。因此，我们也基于自身对世界模型的理解，探索了一套更适合规模化发展的模型范式。</p>\n  <p><strong>硬氪：与远图的合作推进得很快，为什么能够这么快推进从模型到工业场景的落地？</strong></p>\n  <p><strong>肖中阳：&nbsp;</strong>我觉得原因主要有几个。首先是模型本身。我们的世界模型和后训练体系具备比较好的泛化能力，能够快速适应新的场景。</p>\n  <p>其次是产品化思考，我们从创业一开始就比较重视产品化。工业客户需要的并不是机器人替代某一个工序，而是一整套能够快速部署、持续运行的解决方案。我们希望客户在进入新场景后，不需要依赖我们的工程师长期驻场，而是通过少量后训练就能够完成部署。这样交付的不只是自动化设备，而是能够持续学习、快速适应不同岗位的“硅基工人”。</p>\n  <p>因此我们提供的不只是模型，而是一套标准化产品，包括模型、硬件、训练系统，以及我们提出的Workflow Agent。它负责连接模型与真实生产流程，让机器人能够与工厂现有设备、人员和生产节拍协同工作。</p>\n  <p>与远图的合作也不仅是客户关系。远图为我们提供了服务器装配等高精度制造场景，用于验证方案；同时，<strong>双方也围绕装配和测试的共性需求与工序，共同打磨行业级解决方案</strong>，希望将这套能力复制到更多制造场景。</p>\n  <p><strong>硬氪：日冕此前发布了全球首个来自多个场景的双手全掌触觉专业操作数据集PalmDex。开源这个数据集，是出于哪些考虑？</strong></p>\n  <p><strong>肖中阳：</strong>之所以会关注全掌触觉是因为我们认为对力和触觉的理解是精细操作的基石，而精细操作是当前具身智能最痛点也最具价值的方向。此外，我们认为世界模型的发展最终不会依赖某一家公司的数据，而是依赖整个行业的数据生态。相比数据量，我们更关注数据分布。如果模型只学习某一种场景，即使数据再多，泛化能力也会受到限制；真正有价值的是覆盖工业、家庭、商业等不同场景、不同任务的数据，共同构成丰富的数据分布。</p>\n  <p>PalmDex的开源也是基于这样的思考。我们希望搭建一个开放的数据平台，让政府、客户、数据采集公司乃至个人开发者，都可以成为数据提供方，参与整个数据生态建设。</p>\n  <p>其次，这个平台最核心的能力之一其实是<strong>数据的价值发现和定价能力</strong>。作为一家模型公司，我们清楚模型当前最需要哪些数据、哪些数据已经充足、哪些数据仍然稀缺。对于真正稀缺、高价值的数据，就应该给予更合理的激励，让更多社会资源愿意持续参与数据采集。只有形成这样一套市场化的数据供给机制，才能真正实现数据规模和数据分布的持续扩展，最终推动世界模型不断迭代和泛化。</p>", "category": "tech", "published_at": "2026-07-17T01:52:16+00:00", "fetched_at": "2026-07-17T02:12:46.502389+00:00", "fingerprint": "6b37320f02d961a6"}, {"source": "少数派", "title": "翻译「世界杯」的赛事名称，为什么中文比日文更简洁？", "url": "https://sspai.com/post/111086", "summary": "国名也好、赛事名称也好，日语走上了片假名这条路——那为什么日本人不能像中文一样，直接造出「美加墨W杯」这样的简称？<a href=\"https://sspai.com/post/111086\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-16T02:58
