d Peacock, but it also could put together subscriptions for completely different [&#8230;]", "category": "tech", "published_at": "2026-06-09T21:30:48+00:00", "fetched_at": "2026-06-10T02:57:12.070379+00:00", "fingerprint": "0b846f59b96dc797"}, {"source": "The Verge", "title": "Congress just gave DHS another $70 billion", "url": "https://www.theverge.com/policy/947146/dhs-funding-congress-budget-reconciliation", "summary": "Congress narrowly voted to fund President Donald Trump's mass deportation agenda, giving the Department of Homeland Security $70 billion over the next three years. The house voted 214 to 212 in favor of the reconciliation bill Tuesday, following the Senate's 52-47 vote last Friday morning. The vote fell largely along party lines. Sen. Lisa Murkowski [&#8230;]", "category": "tech", "published_at": "2026-06-09T21:34:46+00:00", "fetched_at": "2026-06-10T02:57:12.070372+00:00", "fingerprint": "e633dbcce15d39b6"}, {"source": "The Verge", "title": "I tried Siri AI, and so far it actually works", "url": "https://www.theverge.com/tech/947432/siri-ai-apple-intelligence-ios-27-wwdc", "summary": "Parents want one thing, and one thing only, out of AI: to add a list of soccer games or \"spirit week\" theme days from an email or a poorly formatted flyer onto their calendar in one shot. And I have good news for parents with iPhones - the new Siri can finally do this. After [&#8230;]", "category": "tech", "published_at": "2026-06-09T23:43:00+00:00", "fetched_at": "2026-06-10T02:57:12.070362+00:00", "fingerprint": "2d625475d7ee0e30"}, {"source": "36氪 - 最新文章", "title": "在反外挂前线，游戏厂商开启了“军备竞赛”", "url": "https://36kr.com/p/3846046471277059?f=rss", "summary": "<p>“破坏公平，就该受到惩罚”，这几乎是所有人心中的共识。</p>\n  <p>但在聚集了数千万乃至上亿参与者的游戏竞技场里，作弊行为的边界却显得模糊。</p>\n  <p>在网络游戏领域，作弊有一个更广为人知的称呼：“开外挂”。它包含一切通过非官方允许的外部程序或硬件，获取超过正常玩家所拥有的信息与操作能力的行为。而在涉及游戏的场景中，外挂往往不包含在单机游戏里使用数据修改器，而是特指多人竞技游戏中的透视、自瞄等工具。</p>\n  <p>当下互联网除了外挂开发者，还有一部分内容创作者也把“外挂”作为有噱头的传播素材，获取流量，甚至是给外挂打广告，做宣传。</p>\n  <p>比如在一些深夜的直播间里，摸金玩法游戏的“寻宝鼠”类主播会持续向观众展示“自己如何利用物资透视外挂，在地图中精准搜集各个高价值物品”。这种展示将开挂包装成了娱乐化的猎奇景观，弱化了反外挂一事的严肃性，也让游戏厂商打之不尽。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_af3a7ced51f24d859d3f865ff2a46c84@16519798_oswg78298oswg1080oswg794_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">物资透视可以直接显示地图上的物品信息</p>\n  <p><strong>毕竟，外挂开发者持续获客的手段之一，就是主动降低潜在用户的心理门槛。</strong>除了制造噱头获取流量，他们往往还会在社交平台、电商渠道、私域社群中包装产品，称其为“辅助工具”“稳定插件”，从而模糊其非法属性。</p>\n  <p>目前，外挂使用群体的基数，也正随着国内玩家总量变大而增多。每当市场出现一款现象级游戏，外挂开发者就会在极短时间内完成响应，从而迅速牟取暴利。数年前的PUBG，当下的《三角洲行动》，基本都经历过“游戏爆火而外挂激增”的情况。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_5e26859a5ea54b21bafd1d3caaf98573@16519798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">也有不少UP主分享自己碰上外挂的经历</p>\n  <p>据《2025游戏安全白皮书》统计，如今手游外挂功能的打击量在过去8年间增长了148倍。同时，PC端的外挂样本在一年内首次突破10万例，同比增幅达124%。也就是说，外挂的供给和需求量，都在不断扩大。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_01b0ecec29af4d6986167ab3a19b3f83@16519798_oswg127034oswg1080oswg467_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《2025游戏安全白皮书》统计数据</p>\n  <p>这里面有不少使用者，更多是对外挂的法律性质和黑产关联缺乏客观认知。他们未必清楚，每一次使用行为都会为下游的黑产链条提供现金流，从而客观维持了外挂市场的低门槛运转。</p>\n  <p>如今，外挂本身早已不是单独的个人开发行为，而是一整套关乎庞大利益的黑色产业链。在6月8日举行的第八届游戏安全行业峰会上，中国音像与数字出版协会常务理事长敖然提及，“当一个产业的参与者以‘亿’为单位计算的时候，它的安全问题，就不再只是一个技术问题，而是关乎数字经济秩序、关乎网络空间治理、关乎广大玩家切身利益的公共议题。”</p>\n  <h2><strong>01 没有硝烟的战争</strong></h2>\n  <p>外挂与反外挂的关系，目前早已彻底脱离纯粹的技术维度，更像一场游戏官方与黑产之间的持续攻防战。双方会在技术、运营、法律，乃至舆论等多个维度反复对抗。</p>\n  <p><strong>于厂商而言，反外挂本质是一个投产比难以量化的“苦差事”。</strong>它要求项目组在基础研发之外，消耗一定成本配置安全团队，并投入服务器资源用于实时监测与回溯分析，从而搭建独立的取证与处理流程。</p>\n  <p>这些成本很难直接转化为收入，也被玩家认为是一件“理所应当”的事情。说白了，做好了没奖励，做差了有惩罚。</p>\n  <p>《APEX英雄》就是输在游戏安全问题的典型案例。这款由重生工作室开发、EA发行的FPS游戏，在2019年上线后迅速走红，同时也被外挂开发者盯上。在游戏热度最高的阶段，玩家频繁遭遇加速、自瞄、透视等外挂，最夸张的时候还能碰上飞天、子弹追踪等情况。</p>\n  <p><strong>更严重的是玩家心态的转变。</strong>随着持续遭遇外挂，部分玩家的反应会从最初的愤怒，转向“碰到外挂很正常”这种妥协的表述，进一步对产品本身的公信力失去信心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_b9af8620c5774beaac3fad796e97de30@16519798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">APEX至今都能看到暴力修改数值的外挂</p>\n  <p>最终，《APEX英雄》走进了一段死循环里：玩家因外挂流失，游戏热度下降，从而直接导致外挂减少。而当玩家因外挂减少回流，游戏热度重新上升，那么外挂又会随之变多。</p>\n  <p>重生工作室能做的，就只有在更被动的情况下追加投入，去补全本应前置的反外挂体系。</p>\n  <p>而在外挂黑产这侧，进化的脚步却从未停止。外挂黑产现在已经形成了一条分工明确、结算隐蔽的完整链条。其中，上游团队负责核心功能研发，通常隐匿在海外，从而规避国内执法管辖；中游的分销商通过无法被审查的即时通讯工具，向下级代理分发产品，同时提供教学及售后服务；支付环节则普遍使用虚拟货币结算，如比特币、USDT等，切断了资金追溯路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_1ffe8941e3b34edd8b5e8724d6894e9c@16519798_oswg448005oswg1080oswg595_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">外挂售卖并不是新鲜事</p>\n  <p>而用户所使用的终端，基本已经抛弃一次性买断模式，转向订阅制，用户按周或按月付费，持续为外挂开发者提供现金流。而基于此模式，外挂开发者也能不断应对官方推出的反作弊更新，持续保证产品可用。</p>\n  <p>这条链路上的每一个节点都能形成隔离。即使官方打击了某一个分销环节，外挂黑产也能迅速更换渠道，重新铺货。这种结构性的弹性，也是一直以来外挂无法彻底解决的根源。</p>\n  <p><strong>官方的对手不是几个黑客，而是有组织、有资金、有技术迭代能力的商业化黑产集团。</strong></p>\n  <p>当然，近年外挂在技术层面也找到了新的突破点，先后推出了两种能对传统防御体系造成冲击的新形态。</p>\n  <p>其一是DMA外挂。DMA外挂与过去传统外挂的最大区别，就在于它本质是通过独立的硬件设备直接读取游戏内存数据，既不修改客户端，也不注入额外代码。由于这些过程都在硬件层面完成，传统的反作弊软件也就无法捕捉到其痕迹。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_bfb267d9915b4ab49c51c5781f239169@16519798_oswg234512oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DMA外挂逻辑运行图</p>\n  <p>其二是AI视觉外挂。这类外挂同样不读取游戏数据，而是通过第三方合规软件（如用于直播推流的obs）采集视频信号，并借助训练好的视觉模型实时分析画面，最终通过模拟输入设备完成操作。这一外挂模式，也是目前自媒体中最经常被玩家提及的存在。</p>\n  <p>当然，站在官方系统层面，尽管目前的AI视觉外挂能跳过内存读取，但同时也让其运行链路变得繁琐笨重。借此，安全团队反而能更轻松地通过行为差异区分作弊特征，快速打击。</p>\n  <p>这两种新形态外挂，让反外挂的对抗从软件转变到硬件，从观测代码升级成区分行为。官方想要彻底遏制外挂，恐怕已经不是写一个或几个软件就能做到，必须和外挂一样提供高频率的更新，反复过招。</p>\n  <p>也就是说，现今外挂与反外挂的双方对抗，已经演变成了争夺游戏核心利益的“军备竞赛”。谁的迭代周期更短，更新更快，谁就能在当下的博弈中占据先手。最夸张的时候，这个窗口期可能短到以小时为基本单位。</p>\n  <h2><strong>02 前沿产品的反外挂得做到什么程度？</strong></h2>\n  <p>想要真正理解外挂与反外挂的对抗到了什么阶段，腾讯旗下的《三角洲行动》是一个值得参考的前沿样本。</p>\n  <p>首先，《三角洲行动》有足够体量的用户，这使得外挂开发者会将其作为重点投放场景。而游戏背靠腾讯，不缺乏技术与成本支撑，双方自然会形成高强度的对抗——单是近两个游戏赛季，官方就封禁了182万个开挂的游戏账号。其次，《三角洲行动》是FPS游戏，处于外挂最为横行的主战场，因此对反外挂系统的压力测试更为充分。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_5da23c632f3c420ba33c77f1a7eb6b59@16519798_oswg337543oswg667oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方对违规行为作出的处罚公告</p>\n  <p>更关键的是，腾讯安全团队也在该项目上，披露了相对完整的技术与策略信息，能让我们看到更多的内容。</p>\n  <p><strong>据官方介绍，《三角洲行动》的反外挂策略，基本涵盖了前置阻断和动态对抗两个阶段。</strong></p>\n  <p>在前置阶段，安全团队的做法是拉高外挂的使用成本，如挂载机器码、应用多种数据加密系统等等。其中，封机器码这种举措比较常见，自不必多说，本质就是把开挂者的封禁成本从单一账号上升到了电脑主板等核心硬件。</p>\n  <p>而在数据加密方面，腾讯安全团队提出了迷雾系统、千人千面加密、动态加密三者叠加的模式。简单来说，迷雾系统只允许玩家电脑即时读取到玩家当前“应该知道”的数据；而千人千面加密则会为每个玩家动态生成独立算法，增加了外挂获取数据的破解门槛，更要求定制化方案；同时，动态加密则让游戏的数据位置不断发生改变，增加了外挂需要跑通流程的成本。</p>\n  <p><strong>这些门槛甚至未必需要彻底遏制外挂的功能，只需要减缓其读取速度，让数据失去时效。</strong>一旦外挂无法保证即时性，哪怕只有几十毫秒的延迟，其在实战中的功能价值也会大幅降低。</p>\n  <p>而在动态对抗方面，安全系统有一个关键的思路转变：他们不再将“找到外挂程序”作为唯一目标，而是同时兼顾“识别行为模式”。</p>\n  <p>无论开挂者使用何种技术手段，最终都需要表现为操作行为。比如准心每一次的移动轨迹都过于干脆，缺乏人为操作中必然存在的微调；在没有确切信息的情况下，预瞄位置精准锁定掩体后敌人头部；连续快速定位多个目标，且视角切换的加速度曲线不符合人体操作规律等等。</p>\n  <p>官方会将这些行为特征数据都接入AI模型，进行持续训练和实时比对。<strong>即使外挂能躲过检测、破解加密，在最终的操作环节仍然可能暴露——甚至更为彻底。</strong></p>\n  <p>同时，官方也会高频率更新防御方案，用差异化的程序内容不断“过筛”，从而找出作弊账号。据安全团队所说，在高峰阶段，《三角洲行动》的反外挂系统最快曾一天更新过两次防御方案。他们表示，团队会24小时持续跟进外挂的更新动态，一旦发现新型作弊手段就立刻写入检测规则，并以热更新的方式推送到客户端。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_7a1dead3922d42d793f05c9a36ed28e3@16519798_oswg795912oswg1001oswg704_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">比如针对近期讨论比较多的AI吸附类外挂</p>\n  <p>整体来看，《三角洲行动》展现出的这些策略体验，基本代表了国内主流厂商在FPS领域反外挂的标准乃至最高强度配置，对一众游戏都能提供不少参考。</p>\n  <h2><strong>03 反外挂的终极目标，不只在战场之内</strong></h2>\n  <p>当然，对抗外挂黑产绝非朝夕之功，还需要玩家与官方多维度的持续验证与优化。如玩家保持抵制外挂的坚决态度，官方则提供更多有助于玩家辨别外挂的可观手段——在《三角洲行动》里，针对这点呼声最高的应该是全局回放功能。比如《三角洲行动》后续计划推出“玩家巡查团”，邀请玩家一同参与反作弊工作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_ac985766998441978b09675385a491f7@16519798_oswg659783oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">不断升级的反外挂举措</p>\n  <p>换句话说，现如今玩家对外挂心态的变化，很大程度都来源于自己既没办法像主播那样“诛仙”（靠操作击杀外挂），也没有制裁对方账号的权限，只能凭借局内信息点击举报。这导致玩家在面临外挂时，天然处于相对被动的位置。</p>\n  <p>毕竟，再严密的防线也可能出现疏漏，普通玩家碰上几次外挂，强烈的负反馈很可能让他们变得草木皆兵。</p>\n  <p>但只要对抗持续存在，就不可避免会有正常玩家在外挂使用者的行为中遭受损失。因此，《三角洲行动》的处理思路始终强调尽可能减少正常玩家在这一过程里的损失。</p>\n  <p>目前，开发团队已经在游戏里建立了一套针对反作弊场景的装备补偿机制，如果系统确认某场对局中存在开挂行为，且该行为确实导致正常玩家失去装备，那么官方会通过邮件返还受影响玩家丢失的物品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_f76e20f0c2484aca9f1322fdb4eaabab@16519798_oswg778593oswg1080oswg856_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方为遇到外挂的玩家作出相应补偿</p>\n  <p>这项功能的核心逻辑是，安全系统作为官方责任的延伸，其漏放造成的体验伤害，不应让玩家承担情绪与虚拟资产的双重代价。补偿不可能覆盖所有主观体验上的不适，但至少降低在实际数值层面弥补玩家。</p>\n  <p>回溯补偿并非《三角洲行动》首创，在更早的射击类产品中已有局部实践。但它在此项目中的执行颗粒度更高，与安全系统的数据回溯能力直接挂钩。<strong>补偿的准确性取决于系统对作弊行为判定的准确性，这本身又依赖于安全模型的行为识别能力，形成了逻辑闭环。</strong></p>\n  <p>说白了，官方想要做好反作弊这事，技术维度的支持是底层基础，是成功的关键。而玩家乃至社会对其的态度，则是决定其最终成果上限的重要变量。</p>\n  <p>一个比较明显的趋势，是警方同样加重了针对外挂黑产的执法力度。</p>\n  <p><strong>2025年，安徽省警方破获一起涉及《三角洲行动》的外挂制售案件，打掉一个从开发到销售覆盖多省的犯罪团伙，多名核心成员被采取刑事强制措施。同年另一起案件中，江苏警方查获了一个专门为《三角洲行动》定制DMA外挂设备的工作室，现场扣押了用于生产的硬件物料和已封装待发货的成品设备。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_9f7ef087358e4b66b3c37b6dc0a22512@16519798_oswg569659oswg590oswg778_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：《三角洲行动》</p>\n  <p>孝感市公安局的自媒体账号@孝警阿特，也曾以相对轻松的形式拍摄出警外挂窝点的行动，以此传达官方的打击态度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_01fc906e2d0a40129c63f25e7ce56d4b@16519798_oswg498435oswg1080oswg734_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">孝警阿特的视频记录</p>\n  <p>当然，任何一个了解黑产运作规律的人都清楚，捣毁一个工作室，很快会有新的填补市场空缺。现实中的黑产工作室确实呈现出一定的扩散和更替特性。</p>\n  <p>每一桩进入司法程序的外挂案件，都在为后续的同类案件提供判例参考，也在向黑产链条上的从业者传递一个明确的信号：制作和销售外挂需要面临的不仅是游戏厂商打击，还包括刑事责任的实际判决。这种态度，至少会逐渐改变一部分潜在参与者的预期。</p>\n  <p><strong>当单个行为的法律后果变得清晰且可追溯，黑产的招募和扩张成本就会上升。更关键的是，这类司法行动的深层意义，在于为当下及未来的每一代人建立正确的价值观。</strong></p>\n  <h2><strong>结语</strong></h2>\n  <p>《三角洲行动》不是反外挂领域的孤例，它只是当前主流FPS产品与黑产之间高强度对抗的一个代表。</p>\n  <p>在同一时期，多家头部厂商各自构建了不同侧重点的安全体系。有些选择与硬件厂商深度合作，在芯片层面预埋安全模块。有些则搭建跨产品的威胁情报共享平台，让一款游戏中捕获的外挂特征能迅速同步给其他产品线。</p>\n  <p>外挂与反外挂的对抗没有终点，也无法毕功于一役，这是一场考验技术、人力的持续消耗战。积极的一面在于，产业侧的投入规模和协作程度在过去几年间出现了可感知的提升。</p>\n  <p>安全白皮书、行业峰会、跨厂商技术联盟，这些机制正在将反外挂从单个项目的孤立防御，逐步推向可共享、可复用的基础设施层面。法律的介入则从另一个维度缩短了黑产的生存半径。敖然也表示，“游戏安全，也从来都不是从来不是单独某一家企业的责任，也不是一个协会能独立完成的工程。它需要主管部门的引导、需要行业协会的协同、需要头部企业的担当、也需要全产业链的共同努力。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_9dd4fc3b06d34c53b68b1f7d6cc7206f@16519798_oswg70110oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中国音像与数字出版协会常务理事长敖然</p>\n  <p><strong>这场战争中，主动权不会属于某一方太久，但只要防御侧仍在持续投入，仍在更新迭代，仍在将战线从线上推至线下，公平竞技的环境就能在动态平衡中得到维系。</strong></p>\n  <p>对于数以亿计的普通玩家而言，这至少是目前最值得信任的保障形态。</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/w8pfegkRFSsHeynAusl19Q?scene=1\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-06-09T14:48:11+00:00", "fetched_at": "2026-06-10T02:57:11.912611+00:00", "fingerprint": "7e308172c0d00092"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨致3人永久失明，膳魔师紧急召回百万件产品；发布会后苹果市值蒸发超1.587万亿；Anthropic发布最强模型：Claude Fable 5正式上线", "url": "https://36kr.com/p/3846601462073600?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>清仓美高梅国际持股，何超琼套现逾1.4亿美元</p>\n  <p>任天堂在法国遭2.7亿元重罚</p>\n  <p>王传福回应股价被低估：还没能反映比亚迪潜力</p>\n  <p>5月汽车销量公布：前十已无燃油车</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>已致3人永久失明，膳魔师紧急召回百万件产品</strong></p>\n  <p>因产品瓶塞存在弹出的风险，近段时间，德国知名真空保温品牌膳魔师（Thermos）在中美多国各召回百万件食物罐等产品，据美国消费品安全委员会披露的公告，有三名消费者因眼睛被击中而导致永久性视力丧失。</p>\n  <p>5月29日，国家市场监管总局官网发布公告称，日前，膳魔师（中国）家庭制品有限公司召回2011年-2023年期间制造的部分SK3000、SK3020型高真空不锈钢食物罐，涉及数量为3995415件。召回公告指出，如消费者长时间在保温食物罐中存放易腐食品或饮料，打开时密封塞可能会有弹出风险，对使用者造成撞击伤害。膳魔师中国将免费更换一件全新具有泄压阀的密封塞，以消除安全隐患。（南方都市报）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_405a04b7c47c4d31a9fdb756456f4d55@5667365_oswg264817oswg1074oswg505_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">膳魔师</p>\n  <p><strong>发布会后苹果股价下跌，市值蒸发超1.587万亿</strong></p>\n  <p>北京时间6月9日凌晨1点，苹果WWDC（全球开发者大会）在美国加州库比提诺的Apple Park正式拉开帷幕。这也是蒂姆·库克（Tim Cook）作为苹果CEO主持的最后一届全球开发者大会。本次大会最受关注的信息在于，时隔两年，苹果再次集中发布AI战略，推出了新一代Apple智能以及重构过的语音助手Siri AI，并推出迭代版本iOS 27、iPadOS 27、macOS 27等全系操作系统。值得注意的是，发布会后，苹果股价下跌。截至当日收盘跌1.89%，和当日最高价时的市值相比蒸发超2300亿美元（约合人民币1.587万亿元）。分析人士称，苹果股价下跌或许与Siri AI和其他新的苹果智能功能未能超预期有关。（界面新闻）</p>\n  <p><strong>Anthropic推出Fable 5/Mythos 5</strong></p>\n  <p>IT之家6月10日消息，Anthropic 6月9日发布博文，宣布推出Claude Fable 5与Claude Mythos 5两款AI模型。</p>\n  <p>定位方面，Claude Fable 5面向普通用户开放，定位为目前公开可用能力最强的Claude模型；而Claude Mythos 5会继续通过Project Glasswing项目先向少量网络安全防御方和基础设施提供商开放。（IT之家）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌推出Gemini3.5实时翻译模型</strong></p>\n  <p>6月9日，谷歌宣布推出Gemini3.5实时翻译模型，这是其最新的实时语音到语音翻译音频模型。据谷歌介绍，该模型可自动检测70多种语言，生成流畅自然的翻译语音，并保留说话者的语调、语速和音高。该模型即日起在谷歌各产品中逐步推出。（界面新闻）</p>\n  <p><strong>马斯克谈SpaceX未来规划，展示AI数据中心卫星更多细节</strong></p>\n  <p>当地时间6月8日，马斯克在SpaceX社媒平台X账号分享的一段30分钟视频中谈及SpaceX的未来规划，内容涵盖星舰的后续研发，以及SpaceX与特斯拉在美国联合建设的超级芯片工厂。马斯克展示了名为AI1的卫星渲染图及相关规格，称AI1卫星将配备翼展70米的巨型光伏面板，可支持120千瓦的平均计算载荷，峰值可达150千瓦。SpaceX计划组建约100万颗AI卫星网络，在地球轨道上执行复杂的人工智能计算任务。（界面新闻）&nbsp;</p>\n  <p><strong>谷歌DeepMind在欧洲启动机器人加速器项目，首批16家初创企业入选</strong></p>\n  <p>6月9日，谷歌DeepMind宣布启动机器人加速器项目，面向欧洲早期阶段机器人初创企业，为期三个月，本周首批学员已在伦敦集结开营。入选企业将获得谷歌DeepMind技术专家指导、Gemini机器人模型访问权限及谷歌AI技术栈支持。首批16家入选企业覆盖物流、制造、医疗、建筑、海洋探索及脑神经外科等多个领域。（界面新闻）&nbsp;</p>\n  <p><strong>国家互联网应急中心提醒：部分智能体技能包（Skills）存在越狱和挖矿风险</strong></p>\n  <p>6月9日，国家互联网应急中心（CNCERT）发布公告称，近期综合研判发现，部分智能体技能包（Skills）以“大模型越狱”、“挖矿赚钱”等名义公开传播，诱导用户突破大模型安全限制或占用设备资源进行非法挖矿。此类恶意Skills可能导致模型生成违法信息、用户账号被依法封禁、设备性能下降，甚至使用户被动卷入洗钱等违法犯罪活动，严重侵害个人合法权益，危害网络安全。CNCERT提醒广大用户和相关运营单位提高警惕，加强Skills来源审查与行为监控，及时清除可疑组件，防范由此引发的安全风险。（界面新闻）&nbsp;</p>\n  <p><strong>小米上线MiMo-V2.5-Pro-UltraSpeed模式</strong></p>\n  <p>36氪获悉，6月8日晚，小米MiMo技术团队正式上线Xiaomi MiMo-V2.5-Pro-UltraSpeed模式。据了解，MiMo-V2.5-Pro-UltraSpeed通过对模型推理系统的全链路工程能力优化，在不降低模型能力前提下，首次把推理速度提升至1000tokens/s，且无需定制芯片、只使用通用GPU即可达成。&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>曝哈啰单车制定“猎鹰计划”：“干掉”友商核心人员可获奖励</strong></p>\n  <p>据钛媒体报道，哈啰单车在行业竞争中被曝出多项争议行为，不仅长期扣押竞争对手车辆，还被指曾推出相关暴力手段针对竞品核心人员。有知情人士透露，哈啰单车曾制定“猎鹰计划”，整理出一份包含十余名竞品核心人员的名单。并且如果可以“干掉”名单上的人物即可获得高额奖金。而“干掉”的方式包括让名单上的人离职或跳槽到哈啰；以及直接的身体恐吓，包括殴打等。报道称，几名哈啰员工曾计划，把一个竞争对手里的关键人物“揍一顿”。上述知情人士称，“连要打的人住在哪里、日常行迹、怎么打人，都计划清楚了”。但这个计划因对方警觉而未能实施。（钛媒体）</p>\n  <p><strong>被纳入“中国军事企业名单”，比亚迪、阿里巴巴、百度、蔚来、药明康德紧急公告</strong></p>\n  <p>近日，美国国防部发布最新版“中国军事企业名单”（CMC名单），将188家中国企业列入其中，涉及阿里巴巴、百度、蔚来、药明康德、比亚迪、华为等公司。此次名单覆盖人工智能、新能源汽车、半导体、生物医药等多个中国优势及前沿科技产业。6月9日，比亚迪、阿里巴巴、百度、蔚来、药明康德等多家企业先后发布公告回应，强调公司并非军事企业，并表示将积极采取措施维护自身权益。（中国证券报）&nbsp;</p>\n  <p><strong>Clipto.AI发布全新端侧多模态AI产品</strong></p>\n  <p>近日，AI公司Clipto.AI在Product Hunt发布新一代Mac端产品，并获当日全球榜单第一名。公司聚焦端侧多模态AI，提出面向Personal AI的Memory Layer（记忆层）概念，通过本地大模型理解视频、音频、文档等数据，构建可持续调用的个人长期记忆系统。目前Clipto已覆盖全球150多个国家和地区，ARR超1500万美元并实现盈利，获得红杉中国、高瓴创投等机构投资。&nbsp;</p>\n  <p><strong>任天堂在法国遭2.7亿元重罚</strong></p>\n  <p>当地时间6月8日，法国竞争、消费与反欺诈总局（DGCCRF）正式宣布，对日本游戏巨头任天堂欧洲公司处以3500万欧元（约合人民币2.7亿元）罚款，理由是该公司在2018年至2023年期间，围绕Switch主机Joy-Con手柄\"摇杆漂移\" 缺陷问题实施了\"具有误导性\"的商业行为，这损害了消费者知情权与公平交易权。该案也成为法国针对消费电子企业产品质量问题开出的最高罚单之一。任天堂方面已同意支付这笔罚款，不过，任天堂公司否认存在故意误导消费者的行为，同时强调这笔罚款并不代表企业认罪，此次缴纳罚金仅为双方就相关法律纠纷达成友好和解。（界面新闻）&nbsp;</p>\n  <p><strong>滴滴率先接入微信AI生态</strong></p>\n  <p>随着微信正式面向开发者提供AI生态接入能力，滴滴作为首批合作伙伴，已与微信团队合作将核心网约车服务融入微信AI Agent。未来，用户通过微信内AI交互，即可直接唤起滴滴快车、专车、特惠等服务。当用户在微信中产生出行需求，只需说一句“帮我叫一辆滴滴去机场”即可根据行程距离、时效需求与个人偏好，自动推荐最优车型，一键唤起叫车服务。据了解，滴滴顺风车、滴滴代驾等更多服务也将接入微信AI生态。&nbsp;</p>\n  <p><strong>清仓美高梅国际持股，何超琼套现逾1.4亿美元</strong></p>\n  <p>近日，美高梅中国董事长何超琼出售美高梅国际306.6万股，清仓所有持股，何超琼套现逾1.4亿美元。美国媒体集团People Incorporated（已持有MGM 26%股权）宣布，以每股48.3美元收购额外24.1%股权，令持股增至略高于50%，从而取得MGM控股权。消息刺激MGM股价高见51.59美元。在MGM控股权尚未有定论之际，美高梅中国董事长何超琼于5月28日、5月29日、6月1日、6月2日及6月3日，先后5次出售MGM逾306.6万股，清仓相关持股后，合共套现1.4亿美元（折合约11.3亿澳门元）。（中国蓝新闻）&nbsp;</p>\n  <p><strong>苹果宣布新版Siri AI因DMA监管分歧无缘欧盟iOS 27，上线时间表未定</strong></p>\n  <p>苹果公司当地时间6月8日宣布，全新Siri AI将随iOS 27及iPadOS 27发布，但受《数字市场法》（DMA）影响，欧盟用户届时无法在iPhone及iPad上使用该功能，watchOS 27亦受连带影响。欧盟用户可在macOS 27及visionOS 27上访问Siri AI。苹果软件工程高级副总裁克雷格·费德里吉表示，过去数月间苹果向欧盟监管机构提���了多项解决方案，但均遭欧盟委员会拒绝，目前尚无Siri AI在欧盟iOS及iPadOS上线的时间表。苹果方面指出，欧盟监管机构要求苹果赋予任何第三方AI系统对用户设备的近乎无限访问权限，包括读写短信、执行购买、访问文件及跨应用操作，苹果认为此举将对用户隐私和安全构成重大风险。（界面新闻）&nbsp;</p>\n  <p><strong>世界杯主裁被美国拒签</strong></p>\n  <p>北京时间6月9日，就在美加墨世界杯进入倒计时之际，国际足联正式确认，入选本届世界杯裁判名单的索马里籍裁判奥马尔·阿卜杜勒卡迪尔·阿尔坦（Omar Abdulkadir Artan）将被拒绝进入美国，因此无法在此次赛事中执法。这件令外界不解的事情始于本周一，阿尔坦在从土耳其伊斯坦布尔飞抵美国迈阿密国际机场后，在入境检查时被美国海关与边境保护局拒绝入境，并随后被遣返。美国海关与边境保护局在一份声明中表示，阿尔坦因“审查方面的问题”被认定不准入境，但未提供具体细节。白宫世界杯工作组负责人安德鲁·朱利安尼对此决定表示支持，称相关部门做出了正确的判断。（澎湃新闻）&nbsp;</p>\n  <p><strong>王传福回应股价被低估：还没能反映比亚迪潜力，会实现更好的股东回报</strong></p>\n  <p>比亚迪董事长兼总裁王传福在股东大会上回应公司股价被低估的问题时表示，“我们的潜力大家都很认同，但是现在我们的股价还没能反映。我代表管理层理解并感谢大家的支持。”王传福说，相信业绩会越来越好，希望股东保持耐心。公司将持续用技术创新来推动未来进一步的增长，把握各个节点，科学前瞻布局，来实现公司更好更快速地发展，“一定会实现股东更好的回报”。（澎湃新闻）&nbsp;</p>\n  <p><strong>全球航空业盈利或将“腰斩”</strong></p>\n  <p>最新消息，国际航空运输协会7日发布的全球航空业最新财务前景报告显示，受中东局势持续紧张、燃油价格大幅上涨等因素影响，预计全球航空公司2026年的净利润将降至230亿美元，远低于2025年的450亿美元。（央视财经）&nbsp;</p>\n  <p><strong>5月汽车销量公布：前十已无燃油车</strong></p>\n  <p>燃油车在刚刚过去的5月彻底退出了乘用车零售销量前十的舞台。懂车帝发布的5月乘用车零售销量排行榜显示，排名前十的车型全部为新能源车。&nbsp;</p>\n  <p>排名第一的是微型电动车星愿，月销38751辆；特斯拉Model Y以28911辆位居第二；小米SU7、零跑A10、理想i6分列第三至第五位。前十榜单中，纯电、增程、插混各占一席之地，唯独不见燃油车的身影。而在一个月前的4月，前十榜单中还有吉利缤越这一款燃油车“独苗”；3月则有5款燃油车入围；今年1月这一数字为7款。从占据大半江山到彻底归零，仅用了不到半年时间。（第一财经）&nbsp;</p>\n  <p><strong>美股策略师：近期约有70%的“熊市信号”被触发</strong></p>\n  <p>美银证券最新表示，越来越多的“熊市信号”表明美国股市即将见顶，投资者应谨慎对待美国股市。以美国银行（Bank of America）美国股票和量化策略主管Savita Subramanian为首的策略师团队在最新报告中写道：“危险信号太多了”。他们建议“获利了结”。策略师们表示，近期约有70%的熊市信号被触发，这与此前市场高峰期的平均水平相符。Subramanian则指出，标普500指数“在20项指标中的17项上都显示出统计意义上的高估值，并且在8项指标上相对于科技泡沫指标而言估值过高”。（财联社）&nbsp;</p>\n  <p><strong>英特尔拿下谷歌芯片大单</strong></p>\n  <p>据美国媒体6月8日报道，美国谷歌公司已向英特尔下发订单，委托英特尔生产其自研的AI芯片。同时，另一科技企业英伟达也在评估是否使用英特尔的技术来制造下一代图形处理器，也就是GPU。受此消息推动，8日英特尔股价收盘大涨超11%。分析人士指出，随着AI应用爆发式增长，全球对高端AI芯片的需求不断飙升，导致芯片代工厂出现严重产能紧张。客户担心供应短缺，纷纷开始寻找备选供应商。受需求提振，英特尔股价今年以来已累计上涨超198%。（央视财经）&nbsp;</p>\n  <p><strong>钉钉副总裁马锐拉离职，公众号发文：越来越难确认是在创造产品还是追赶节奏</strong></p>\n  <p>6月8日，钉钉副总裁、AI产品负责人马锐拉在个人公众号上发布题为《置身钉外》的文章，称他已于5月15日办完离职手续，正式告别三年阿里生涯，离开钉钉。在这篇文章中，马锐拉主要分享了自己阅读《置身钉内》后的感受与思考，反复强调“心疼”：“思考良久，我越来越难确认自己是在创造产品，还是只是在消耗身体追赶一个不断前移的节奏。”&nbsp;</p>\n  <p>据了解，近日，阿里内网一篇长达7.5万字的文章《置身钉内》引发全网围观。作者系钉钉“ONE”项目核心产品经理滕雅辛（花名“幽素”），在这篇长文中，她按时间线复盘了“ONE”这款AI产品从立项、冲高，再到最终收缩、拆分的全过程。对于这篇文章，钉钉方面暂无回应。（澎湃新闻）&nbsp;</p>\n  <p><strong>现货黄金跳水跌破4300美元</strong></p>\n  <p>黄金开启“跌跌不休”模式。6月9日晚，现货黄金突然击穿4300美元，截至北京时间22:45，现货黄金日内跌近1%报4287.96美元/盎司，相较年内高点5598.75美元/盎司，黄金已经下跌超23%，进入技术性熊市。现货白银跌近4%报65.57美元/盎司。首饰金同步则降至1316元/克左右，和年内最高时站上1700元/克，跌幅超过22%。（21世纪经济报道）&nbsp;</p>\n  <p><strong>鸡蛋价格暴涨近四成</strong></p>\n  <p>近日，“鸡蛋价格暴涨四成”的话题登上热搜，鸡蛋“一天一个价”“同比涨八成”等引发网友讨论。根据农业农村部“全国农产品批发市场价格信息系统”监测，今年6月初鸡蛋批发价格为5.1元/斤，环比增加6.1%，同比增长32.1%。北京大型农产品批发市场新发地的监测数据显示，6月7日散鸡蛋均价6.1元/斤，较两个月前涨幅超过五成。去年同期市场均价约3.5元/斤，同比涨超七成。记者从业内了解到，蛋鸡养殖具有明显的周期波动特点，去年鸡蛋市场整体供过于求，受此影响，去年第四季度养殖户的鸡苗补栏意愿低迷，使得当前在产蛋鸡存栏较低，市场整体处于供需紧平衡状态。（第一财经）&nbsp;</p>\n  <p><strong>美股三大指数收盘涨跌不一，大型科技股普跌</strong></p>\n  <p>36氪获悉，6月9日收盘，美股三大指数收盘涨跌不一，道指涨0.17%，纳指跌0.97%，标普500指数跌0.26%。大型科技股普跌，康宁跌超7%，苹果跌超3%，特斯拉跌3%，微软、英特尔跌超2%，亚马逊英伟达、Meta小幅下跌，谷歌小幅上涨。热门中概股多数下跌，蔚来跌超3%，理想汽车、小鹏集团跌超2%，哔哩哔哩跌超1%，拼多多、阿里巴巴小幅下跌，百度、网易涨超1%，京东小幅上涨。&nbsp;</p>\n  <h2>上市进行时</h2>\n  <p><strong>Perplexity：无论Anthropic与OpenAI上市进展如何，公司均计划2028年IPO</strong></p>\n  <p>Perplexity首席执行官阿拉温德·斯里尼瓦斯(Aravind Srinivas)表示，无论市场对Anthropic和OpenAI的上市反响如何，公司都计划在2028年启动上市。斯里尼瓦斯在周二播出的采访中称:“我们的上市规划原本就定在2028年，与这两家公司无关，目前该计划保持不变。”（新浪财经）</p>\n  <p><strong>脑机接口龙头企业完成IPO辅导</strong></p>\n  <p>36氪获悉，证监会官网IPO辅导公示系统显示，脑机接口企业博睿康技术(上海)股份有限公司IPO辅导状态变更为“辅导工作完成”，辅导机构为中信证券。</p>\n  <p><strong>西安存储芯片龙头，完成IPO辅导</strong></p>\n  <p>证监会官网IPO辅导公示系统显示，西安紫光国芯半导体股份有限公司及其辅导券商中信建投向陕西证监局提交《辅导工作完成报告》。公司于2026年1月6日提交辅导备案，辅导工作历时5个月。（科创板日报）</p>\n  <h2>大公司财报</h2>\n  <p><strong>“GIM”获超亿元天使轮融资</strong></p>\n  <p>36氪获悉，金融垂域AI大模型公司“GIM”（GraceInvestment Machine）完成天使+轮融资，由赛富投资基金（SAIF Partners）领投，某千亿市值互联网公司CEO家族办公室跟投。此前，GIM天使轮由Monolith砺思资本和五源资本共同投资。至此，公司已完成过亿元人民币天使轮和天使+轮融资。据了解，GIM将进一步从零自研金融垂域大模型。</p>\n  <p><strong>“昆仑元AI”获5000万元战略融资</strong></p>\n  <p>36氪获悉，湖南昆仑元人工智能应用软件有限公司（KunlunMeta，昆仑元AI）宣布完成5000万元战略轮融资，由A股上市公司景嘉微全资子公司长沙景美集成电路设计有限公司领投。据了解，双方将聚焦芯片设计、算力适配、产品联合研发、生态共建等领域深度合作，依托景美国产GPU算力优势与昆仑元AI的软件栈、场景落地能力，构建“国产GPU+全栈AI基础设施”一体化方案。&nbsp;</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。苹果AI来了，但没完全来，苹果WWDC还发了啥？</strong></p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-06-10T00:08:16+00:00", "fetched_at": "2026-06-10T02:57:11.912605+00:00", "fingerprint": "d7ce45464f6cd63f"}, {"source": "36氪 - 最新文章", "title": "手机装不下的野心，正在被搬进游戏平板丨2026游戏平板使用趋势观察", "url": "https://36kr.com/p/3846673443997961?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_616af26712d74c93acfbaf73aeb027fc@11416942_oswg2563523oswg1000oswg1485_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>打开任意社交媒体，搜索“手游设备”，你会发现一个有趣的现象：越来越多的年轻人正在抱怨手机——屏幕太小、玩两把就发烫、开放世界游戏跑不满帧、吃鸡打到决赛圈手指抽筋……而评论区里，<strong>被提及最多的解决方案不是怎么换一台性能更好的手机，而更多的是建议——换一台专业游戏平板。</strong></p>\n  <p>游戏玩家们，正在经历一场“换屏幕”的集体迁徙。这不是凭空发生，是伴随着手游市场升级换代的必然结果。过去几年，移动游戏不只是新作频出，类似《王者荣耀》《三角洲行动》《原神》《鸣潮》这些占据收入榜头部的大作，每一款都在画质、地图、操作维度上不断逼近PC和主机水准。随着游戏越做越重，玩家的口味也是被一路喂得越来越叼，对沉浸感、操作精度、帧率稳定的要求，早已不是一块6.7英寸的小屏能装下的。</p>\n  <p>需求一旦被撑大，就会反向寻找新的容器：用平板打游戏的人，肉眼可见地变多了。“游戏平板”是这几年新涌现的概念。过去我们对平板的功能定位还停留在追剧神器、网课学习工具、便携电子笔记本，但现在，<strong>越来越多年轻人开始把平板当成自己的随身游戏机——比手机屏幕大、比掌机便携、比PC自由，还能塞进通勤包，随时随地“大小玩”。</strong></p>\n  <p>另一边，平板硬件优化也在经历一轮爆发。这两年，主流厂商集体把“游戏向”作为新卖点：高刷屏、独立散热模组、专用手柄、云游戏适配、端侧AI……红魔游戏平板5 Pro、REDMI K Pad 2、iQOO Pad 6 Pro、联想拯救者Y700 五代、一加Pad3 Pro等新品密集入场。</p>\n  <p><strong>当供给和需求在同一个时间点撞上，“游戏平板”这个细分品类，就这么被推到了台前——京东数据显示，2026年以来，游戏平板成交量同比增长超150%。</strong></p>\n  <p>那么问题来了——这场“从手机到平板”的屏幕迁徙，到底走到了哪一步？是谁在用平板打游戏？他们玩什么、看重什么、又愿意为哪些功能多花钱？为了搞清楚这届玩家的真实生态，<strong>36氪X后浪研究所X京东消费及产业发展研究院联合发起了一份“游戏设备调研”，共回收1000份有效问卷，</strong>其中男女比例约7:3。结合宏观数据和调研结果，我们总结了几条游戏平板爆发的关键动因。<br />&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_475e3e59302a4e33b6667311378badd5@11416942_oswg8038oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>纵观中国游戏市场大盘，手游是绝对的主角。根据中国音数协游戏工委《2026年4月中国游戏产业月度报告》，2026年4月中国游戏市场实际销售收入达到<strong>303.69亿元，同比增长11.04%</strong>；其中移动游戏市场实际销售收入<strong>224.30亿元</strong>，环比增长0.71%，同比增长9.83%。</p>\n  <p>换算一下，<strong>移动游戏在中国游戏盘子里的占比，稳定在七成以上。</strong>可以说游戏市场的大头，也是由手游玩家来定义，但显然，手机那块小屏幕，已经开始装不下游戏厂商越做越大的野心。</p>\n  <p>同样，<strong>游戏人群不仅在变多，也在变“重”。</strong></p>\n  <p>2026年4月8日Sensor Tower公布的2026年3月手游收入榜显示，《王者荣耀》《和平精英》《三角洲行动》包揽中国App Store手游收入榜TOP 3。当月，38 个中国手游发行商合计吸金21.1亿美元。这份榜单透露出一个清晰的信号：<strong>最赚钱的，依然是那些对屏幕视野、操控精度、画面表现要求极高的重度游戏。</strong></p>\n  <p>FPS要在毫秒级辨认敌人位置，迅速做出决断，MOBA要求玩家看清小地图上每一个可能闪现的敌军信号，开放世界则要承载越来越精细的建模和光影——这些需求，手机不是不能满足，而是满足得很勉强。一位FPS重度玩家在调研里写下这样一句话：<strong>“手机能玩，但玩不爽。它经常跟不上我的反应。”</strong></p>\n  <p>这种“能玩”和“爽玩”之间的落差，正是设备升级的最大动因，也在反向倒逼硬件进化。IDC数据显示，2025年中国平板电脑市场出货量达3376万台，同比增长13.1%，其中消费市场是2025年的核心增长动力，同比增长14.4%。</p>\n  <p>更关键的是——<strong>平板的增长，正在和游戏场景深度绑定。</strong></p>\n  <p>艾媒咨询《2025 年中国云游戏消费行为调查数据》显示，在2025年中国云游戏用户的设备使用占比中，平板首次超过主机，成为仅次于手机和电脑的核心游戏设备。要知道，五年前的平板还被主推为追剧和学习辅助的角色，如今它已经悄悄爬上了云游戏设备的第三把交椅。</p>\n  <p>云游戏的爆发，进一步放大了平板的游戏属性。在云游戏的场景下，平板不用拼本地算力，拼的是屏幕、续航、散热、网络体验，而这些恰好是平板相对于手机的强项。<strong>平板没有变成另一个手机，而是长成了另一种便携游戏设备形态。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_b4610994271641479a9a041119a69030@11416942_oswg9875oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在这份游戏设备调研中，我们深度分析了在手机之外，平板是否抢占了游戏用户大盘市场，又是否能在和其他游戏设备品类的竞争中杀出重围，这份调研结果是意料之外，情理之中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_70e092ac2eea4ff6ae8b64fca896aa4b@11416942_oswg11934oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_82d9e2b96b9a4c7c848d8b7e5c21b063@11416942_oswg78642oswg802oswg1008_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>除了手机外，在本次调研中，平板的持有率和常用率在游戏设备里排到了第一，考虑到PC一直被视为最硬核的正统游戏设备，平板能在常用率上反超它，本身就是一件挺反直觉的事。</p>\n  <p>另一个值得注意的点是，平板的常用率（82.3%）比持有率（66.8%）还高出15.5pp，这意味着即便很多玩家并没有自己的专属平板，却可能在借用家人的、室友的、对象的平板玩游戏。看来一旦体验过大屏，就很难再回到自己手机的小屏幕上去了。</p>\n  <p>不意外的是，掌机和家用游戏主机的使用率还有待提升。 这类设备往往会在新作上线、爆款游戏发布时被玩家们重点关注。</p>\n  <p>在所有“持有游戏平板”的人群中，69.7%会把它作为常用游戏设备——也就是说，买了游戏平板的人，七成都真的在用它打游戏，转化率非常高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_4bb040b6b44b4ad6a67c640333af1139@11416942_oswg11928oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>继续追问，玩家们都是因为什么购买了人生中第一台游戏平板。实际上，这个购买决策并非是受到游戏平板的营销宣传影响，大部分人想换设备，都是因为手机撑不住了。</p>\n  <p>调研显示，排名靠前的购买动因，几乎都与手机的体验崩塌直接相关——手机玩久了发烫、掉帧、卡顿、续航崩盘，痛点累积到一个临界点，玩家终于决定“换块大的”。<strong>真正吸引他们最终下单的因素，正是“屏幕大”“性能猛”“散热强”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5a464de9231f48a49d0e1d3f6c51f96b@11416942_oswg37553oswg801oswg910_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_12b55ad9155a47be9f5e634da4342758@11416942_oswg9556oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>而游戏平板作为新游戏设备的“受宠”，也要归功于手游厂商们的协同发力。调研中玩家们投出了对现有设备不够满意的3个核心因素，分别是画质、帧率和更新包的存储占用问题。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_57a0bed716e840fca217005cc2faa8eb@11416942_oswg38340oswg800oswg906_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>手游本身在进化，画质提升、地图变大、特效拉满，甚至团战人数变多、操作维度增加……几年下来，手游已经可以做出不逊于PC/主机的游戏表现，这也就更加明显暴露出——玩家手里的硬件设备，已经跟不上软件的进化速度了。</p>\n  <p>具体到游戏类型，调研进一步发现，受影响最严重的几乎都是“竞技属性强”的品类：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_24c32a9d691145c98ae2064066cc0d6d@11416942_oswg93820oswg801oswg942_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>FPS/射击玩家受影响程度最高，对这群玩家来说，掉一帧就等于打不中人，挫败感会被无限放大；MOBA和开放世界RPG紧随其后，长时间、高画质、强团战，哪个环节的卡顿带来的都是灾难级体验；休闲益智游戏目前暂时处在安全区，只有20.2%的玩家“经常遇到设备问题”，远低于FPS的36.3%。</p>\n  <p>所以，<strong>真正的变量是游戏的“电竞属性”，只要参与排名、有胜负、有PK，玩家对设备问题的容忍度就会断崖式下降。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_3c7b89bfa63946ba873e2b8353f25cbb@11416942_oswg78128oswg801oswg1072_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在调研样本中，电竞场景的渗透也佐证了这一点——近半数玩家参加过排位/巅峰赛、战队赛/公会赛，甚至线下比赛的人群各自都占2成，只有27.8%的人完全不参与任何竞技活动。换句话说，<strong>有胜负心的玩家是主流，他们恰恰是对设备最敏感、最焦虑的那群人，游戏用户可以接受自己技不如人，但接受不了“输给设备”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_692125677cc74beba1b633a5713d2534@11416942_oswg9642oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_ad68cbeb48654eb8b60f3e190f096911@11416942_oswg77202oswg800oswg902_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在挑选游戏平板时，玩家们最关心的因素是什么？这个答案出乎意料——不是芯片强度，不是屏幕大小，而是散热。</p>\n  <p>调研发现，散热能力是唯一一个“强化需求&gt;选购在意”的维度。玩家在买的时候，往往把芯片放在第一位（47.2%）；可一旦真用起来，他们才意识到——<strong>真正决定体验的不是芯片峰值多猛，而是散热能不能让芯片“持续地猛”。所以问“应该强化什么”时，散热反超到第一。</strong></p>\n  <p>平板厂商卷到尽头，旗舰芯片已经够用，屏幕高刷已经是“标配门槛”，卷得再高也没意义。玩家们需要的是这块芯片和屏幕能稳定地把性能释放出来。</p>\n  <p><strong>当然，五大核心因素之外，性价比依然是隐形门槛。</strong>游戏平板毕竟是一个“锦上添花”的品类，不像手机那样人人必备，因此价格敏感度天然较高。能否推动购买决策，靠的是握持感和性价比的极致平衡，而握持感体验，也最受散热能力影响。毕竟，谁也不想抱着一块发烫的铁砖打游戏。游戏平板的竞争，已经从“堆参数”进入了“保体验”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_230fba0b5afe49c986f7e9c5706403bf@11416942_oswg7668oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_6abcc0c35784486596de3c4335235a9f@11416942_oswg81509oswg800oswg829_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>如果说散热是当下的胜负手，那么<strong>AI，很可能是游戏平板的下一个能力战场。</strong></p>\n  <p>调研里玩家们的期待已经展现得非常具体，最让玩家们心动的功能，排名第一的是AI攻略助手，他们想要的是一个配合自己变强的工具；紧随其后的还有AI语音指令（解放双手）、AI NPC互动（与游戏内NPC智能体对话）、AI实时翻译（玩外服、看攻略刚需）……每一项，都是在游戏体验上再加一层便捷buff。值得一提的是，<strong>仅有10%的玩家明确表示对AI功能完全无感，看来在最接近极客群体的游戏用户里，“AI FOMO”(害怕跟不上AI时代)并不少见，大家都不想错过下一轮技术升级。</strong></p>\n  <p>如今厂商们都在开发端侧AI功能，即不联网也能在设备本地跑的 AI。本地实时翻译、攻略分析都要求平板自己有足够的NPU算力，不依赖云端。这正是2025年以来芯片厂商集体卷的新战场，也很可能是游戏平板角逐的下一个顶点。</p>\n  <p>当下的游戏平板市场，玩家不再为参数最高的那一台买单，用户真正需要的是一台“从第一分钟到第三小时都不掉链子”的平板——换句话说，是一台能持续输出稳定游戏体验的载体。游戏平板的用户们早已过了追求先锋的极客时期，而真正进入了追求体验的实用主义阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_1c73b1c4762042dbadc3638d57cf1c76@11416942_oswg11553oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>把视角拉到平板用户内部，能看到一条更清晰的曲线：<strong>年轻人的游戏平板渗透率，断层领先。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_fb1457438c31480aad5839e4ec0e5414@11416942_oswg22152oswg801oswg690_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>30岁以下玩家的游戏平板渗透率，普遍在52%-60%之间；36岁以上人群，这个数字为28.6%。<strong>游戏平板正是这群“有消费能力、又有着充足游戏热情”的年轻人的新刚需。</strong></p>\n  <p><strong>游戏平板的另一条增长引擎，是玩家自身的“重度化”。游戏用户对游戏成绩和竞技精度的追求越认真，越倾向用平板。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7db0ea805a604ccca044726583b78dab@11416942_oswg55602oswg801oswg714_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在调研中，重度玩家的游戏平板常用率是轻度玩家的2.3倍。更值得注意的是中间层，重度与中度之间的差距只有 9.3pp，而中度与休闲之间的差距却拉到了15.1pp。这说明中度玩家是一个关键临界点——他们一旦从“放松解压”过渡到“固定游戏时间”，就会迅速向游戏平板靠拢。这也很合理，当你开始追排名、追胜率、追极限操作时，自然会免不了先解决硬件上的困难。把游戏设备翻新一下，从竞技心态上都自信了几分。</p>\n  <p>当然，同样是“觉得手机不够用了”，游戏平板的核心玩家背后的诉求也不尽相同，这高度取决于具体的游戏类型。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5a76316db0d04fba8412f6ac9fbe5ed4@11416942_oswg28133oswg800oswg901_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>统计检验显示，游戏类型与平板使用存在极显著相关。一个清晰的规律是：<strong>画面越复杂、操作越密集、单局时间越长，玩家越依赖平板。开放世界RPG玩家、MOBA玩家、FPS玩家，构成了平板游戏用户的“铁三角”。</strong></p>\n  <p>接下来，我们根据本次调研的玩家访谈结果，将“游戏平板核心用户”归纳成四类主要人群画像——他们各自代表了一种典型的游戏诉求，也各自撑起了游戏平板市场的一块版图。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e671813662d64bd0a97e64d6be0a8e49@11416942_oswg1429686oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人是平板游戏生态里最硬核的存在。他们玩的游戏，每一款都对<strong>反应速度、视野范围、触控精度</strong>有极高要求。对他们来说，平板的吸引力不在便携，而在多出来的视野和操作空间，大视野意味着FPS中能更早发现敌人；多指操作意味着更高的打法上限；高刷屏意味着不错过音游里的每个音符划过瞬间，打满Perfect。他们遇到的设备痛点也最锋利：手机一卡，满盘皆输；手机一烫，掉帧漂移。这群人对<strong>散热和性能释放</strong>的关注度，是所有玩家中最高的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_cfb6a7c1d08a4d579fbfb3b01ce14b20@11416942_oswg1377250oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人的核心诉求很直白——舒服。手机太小，看不清远处的山水细节；PC太正式，得正襟危坐对着显示器；主机太麻烦，得开电视、连手柄、找位置。<strong>平板是那个最“懒人友好”的中间态</strong>——架在床头的支架上，连个手柄，就能瘫着进入另一片赛博大陆。这群玩家中女性占比明显更高，她们也更愿意尝试云游戏和串流，只要网够好，平板照样能跑大制作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_a560897330f647d6a83dbb384c2eab73@11416942_oswg1635461oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人玩的游戏，每一款都不追求pvp竞技，但每一款又都在考验你的眼睛和手指。模拟经营游戏的特点是界面元素多、点击频次高、单局时间长。在手机上玩，常常出现“想点A误触B”的尴尬，更别说连续玩两小时之后眼睛的酸胀感。对他们来说，平板的价值不是上分，是<strong>“省手又护眼”</strong>——一种几乎被忽视、但极其真实的需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e528f373e36c4ac08fc1cccb034f07b9@11416942_oswg1820749oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人打的也是竞技类游戏，但和FPS/MOBA玩家不同，他们不靠手速和反应，靠的是智谋，享受的是<strong>运筹帷幄的博弈感</strong>。可策略玩家最大的痛点是——手机误触。在三国杀里，手抖一下放错牌，可能就是一整局崩盘；在炉石里，错位拖拽一张卡，结算瞬间反向劝退。大屏不是为了爽，是为了不输，更好地做一个幕后军师。平板则提供了一种从容感：<strong>你可以缓缓拖动卡牌、仔细比对场上局势、放大查看每一个数值——这是策略玩家最看重的“决策舒适区”。</strong></p>\n  <p>数据之外，我们也带着这些洞察，与几家主流游戏平板品牌进行了深度对话。有意思的是，厂商们对“玩家到底要什么”也有着自己一线的观察和理解——这些来自产品定义者的声音，恰好和我们的调研结论形成了相互印证。</p>\n  <p><strong>@京东采销</strong></p>\n  <p>消费者选购游戏平板时，决策链路极短且目标明确——核心验证“帧率稳不稳、手感沉不沉、散热烫不烫”。作为京东平台增速最快的趋势品类之一，游戏平板代表着移动电竞从“小众极客”迈向“大众消费”的关键拐点。</p>\n  <p>京东将依托亿级游戏用户的行为洞察，联合品牌方在芯片迭代、配件生态与赛事内容运营上深度共建，推动游戏平板成为电竞生态的“第二块屏幕”，共同撬动移动电竞的百亿增量市场。</p>\n  <p><strong>@红魔</strong></p>\n  <p>从应用场景来看，游戏平板的消费者十分关注高负载下的性能释放、长时间对战的散热稳定性，以及屏幕的极致显示与操控体验。</p>\n  <p>红魔推出的专业游戏小平板，<strong>以玩家真实对战体验为核心</strong>，通过旗舰性能平台与全链路立体散热方案的深度协同，持续提供满帧稳帧的流畅游戏体验，保障高负载运行下的<strong>稳定温控</strong>；同时更率先在小尺寸游戏平板上搭载高端OLED电竞屏，以<strong>低延迟、高亮度、广色域的屏幕</strong>还原对战细节，让硬核电竞体验无缝融入日常对战与娱乐场景，释放玩家的全部战力与游戏创造力。</p>\n  <p><strong>@联想</strong></p>\n  <p>移动游戏正在呈现出精品化、细分化的用户特征，用户需要大屏视野、稳定帧率、持续性能释放，以及AI对于游戏的加成体验。</p>\n  <p>游戏平板产业正从“参数内卷”转向“AI+生态+形态创新”的新阶段，其核心是“便携尺寸+高分电竞屏+主机级体验+全场景AI应用”。联想拯救者游戏平板凭借优于手机的散热、屏幕与操控体验，历经多代产品升级，赢得广大游戏用户认可。<br />特别是它内嵌天禧AI，可实现“全境畅连、声纹猎手、像素狙神”等AI游戏全新体验，成为游戏玩家的首选移动游戏硬件之一。游戏平板正在从补充娱乐设备转向主力游戏终端，进而成为移动游戏的核心载体。</p>\n  <p><strong>@iQOO</strong></p>\n  <p>从消费趋势来看，游戏玩家正在从“能玩”走向“玩得更极致”，对画质、帧率、操控和沉浸感提出了更高要求。iQOO Pad6 Pro以玩家体验为核心，配备13.2英寸4K 144Hz电竞级巨幕，让玩家拥有更沉浸的游戏体验。</p>\n  <p>未来，iQOO将持续深耕游戏平板赛道，不断突破性能上限，深化软硬协同能力，完善游戏生态与跨端互联体验，打造兼具专业电竞实力与旗舰生产力的全能游戏平板，为玩家带来真正面向未来的移动游戏体验。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_c4ec2d9578d74c57883d735a5c2c942a@11416942_oswg239oswg229oswg23_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>最后，当问到消费者“如果只够升级一台设备，你会选哪个时”，调研显示，<strong>游戏平板以接近4成的占比超过了手机，成为玩家最优先的升级选项。</strong></p>\n  <p>这是一个标志性的拐点。要知道，过去十年，手机一直是消费电子的绝对优先级——但当游戏的胃口超过手机的容量，当25-30岁的玩家进入设备升级周期，平板逐渐从备选项变成了第一选项。<strong>游戏平板，已经是玩家们下一笔大额预算的归宿。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_06c7483787704bb894a38a9441267712@11416942_oswg70764oswg800oswg677_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这份归宿的指向也相当具体——<strong>红魔游戏平板5 Pro、联想 Y700 五代、iQOO Pad 6 Pro、一加 Pad 3 Pro、红米 K Pad 2</strong>等，这些新生代游戏平板几乎构成当下游戏平板赛道的主力机型矩阵。它们各自代表了不同的取向，有的把散热堆到极致，有的押注8 英寸小钢炮的便携手感，有的则搭载高通骁龙旗舰芯片在端侧AI上抢跑——你能想到的玩家诉求，背后都有一台对应的机器在卷。</p>\n  <p>在购买渠道上，京东是玩家们的首选平台。原因并不复杂：长期以来，京东在3C数码领域形成了较强的专业心智，也是品牌新品首发的主要阵地。对准备升级设备的玩家来说，京东丰富的产品供给、正品保障和完善售后，仍然是下单时最重要的确定性。恰逢京东618，入手游戏平板还可享受国补立减15%，叠加以旧换新福利最高能省1500元，这也进一步降低了换新门槛。</p>\n  <p>说到底，一台真正趁手的游戏设备，是需要不断调试、慢慢磨合，才能找到那台最心水的。与其在下单前反复纠结，<strong>不如投奔一个容错空间更大的购物平台，让试错的成本降到最低。</strong>毕竟，游戏的世界里，装备的事从来不能将就。愿大家都能设备升级，战神附体，把把MVP。</p>\n  <p>&nbsp;</p>\n  <p>策划：许嘉婧<br />视觉、插画：曲枚</p>", "category": "tech", "published_at": "2026-06-10T01:26:15+00:00", "fetched_at": "2026-06-10T02:57:11.912598+00:00", "fingerprint": "28d4b46a9c4037b1"}, {"source": "36氪 - 最新文章", "title": "清华系团队做分布式预测世界模型、获数亿元A轮融资，落地终端设备达十万量级｜硬氪首发", "url": "https://36kr.com/p/3844720012151040?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，具身智能世界模型公司「千诀科技」日前完成数亿元A轮融资，本轮由京铭资本领投，山东新动能、山东财金资本、元禾厚望、芯能创投、南创投、英诺天使基金、尚势资本、仁爱集团、玄素投资等机构共同投资，投资方阵容汇集了国家队、产业方、市场化基金及家族办公室。Maple Pledge枫承资本长期出任私募股权融资顾问。</p>\n  <p>资金将重点用于自研世界模型的架构搭建、算法迭代与场景落地，同步扩充核心研发与项目交付团队，完善商业化落地配套能力。</p>\n  <p>千诀科技创立于2023年6月，核心团队孵化自清华大学类脑研究中心，长期聚焦具身智能决策与规划大模型研发落地，突破传统设备任务局限，以帮助机器人实现环境动态自适应与全自主作业。</p>\n  <p>世界模型的热潮正迅速卷向具身智能领域，成为通用人工智能落地物理世界的核心突破口。卷积神经网络之父Yann LeCun（杨立昆）率先提出世界模型核心理论，其创办的AMI团队持续专注抽象表征空间建模、物理世界规律预测的技术方向研究，为行业奠定了核心理论基础。</p>\n  <p>从因果推理到空间智能，从物理仿真到生成式预测，基于不同技术范式、不同理论底座的研究在业内正同步展开。这是个尚未收敛、想象力巨大的赛道。各路探索者都在试图回答同一个问题：如何让机器真正理解并预知物理世界的变化。</p>\n  <p>在主流的生成式路线中，典型做法是通过像素级重构来预测下一帧画面。但千诀科技CTO章天任向硬氪指出，这种方法往往存在一个容易被忽视的问题——特征污染。</p>\n  <p>“真实物理世界的图像输入信息量极大，包含大量与任务无关的噪声，比如光影、纹理。”章天任解释，模型为了追求像素级的无损重构，不得不把有效特征和无效信息强行绑定在一起，结果可能导致模型内部表征不再“纯净”，“它确实能从现实数据中提取出具有泛化性的特征，但这些特征里混入了干扰项。”</p>\n  <p>这种污染会直接影响模型对物理世界的理解能力。世界模型的本意是让模型学会符合物理规律的预测，而不是单纯地拟合图像。一旦特征被污染，模型就很难提炼出真正的因果关系和物理不变性，泛化能力自然受限。</p>\n  <p>“人看一张图时，不会平均分配注意力在每个像素上，而是快速锁定与任务相关的区域。”章天任说，“但生成式模型与其说是理解世界，却更容易发生复刻表象的情况。”</p>\n  <p>面对生成式路线存在特征提取的这一局限，预测式世界模型提供了另一种思路。 其核心逻辑是，让机器人真正理解物理世界，不是靠还原每一帧像素，而是靠预测物理状态的低维演化轨迹。</p>\n  <p>千诀科技CEO高海川用一个案例解释了两者的本质区别：人在打球时，不会在脑中想象一帧帧清晰的画面，而是直接挥拍，依靠对球轨迹的低维预测。这种预测不包含像素信息，只包含物理规律的状态演化。“人类在物理世界中玩球类游戏，不可能去想象清晰完整的像素画面，来不及，而且这种信息不稳定。”高海川说。</p>\n  <p>同样的逻辑适用于具身智能。执行任务时，机器人需要的不是“未来会长什么样”的想象，而是“下一个状态该往哪走”的预判。预测式模型的核心输出不是视频帧，而是低维抽象特征，这些特征可以直接解码为动作轨迹或规划指令，从而绕开像素重构带来的计算负担和特征污染问题。</p>\n  <p>在预测式路线基础上，千诀科技还进一步提出了分布式预测架构。其架构采用了类人脑的脑区连接方式，大脑不同区域各司其职，连接紧密的区域内部协同，区域之间则相对独立。</p>\n  <p>对比传统方法把所有信息揉在一起压缩处理，分布式预测架构会先把信息分到不同的区域里，再分别压缩和预测，从而实现样本效率更高，推理速度更快。“同样一个任务，从零开始可能需要1000个‘状态-动作’对；有了好的表征，100个就够了，有效减少了机器人适应新场景所需的示教数据。”章天任说。</p>\n  <p>通过这种分布式架构，可以帮助模型在抽象表征空间中学习物理状态的演化规律，而非仅仅是像素的时序关联，更好地服务于下游的规划与控制。当机器人面对新环境时，可以更快地理解“什么会导致什么”，对真实场景落地尤为关键。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_2559a19a39fb48bfaf7f18259d336ecf@6022551_oswg264181oswg2844oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人在餐厅打工（图源/企业）</p>\n  <p>具体到应用端，千诀科技将具身大脑与小脑解耦，由其世界模型负责感知、预测与规划，不绑定具体的执行动作空间。只要共享同一模态，模型就能将其观察到的环境变化作为统一的数据来源进行训练。这意味着，同一个“大脑”可以快速迁移到不同本体上，解耦设计有效降低了迁移成本，并加速了真实场景中的数据飞轮闭环。</p>\n  <p>据硬氪了解，千诀科技自研具身大脑已完成轮式、四足、双足人形、无人机、清扫机器人等多品类硬件适配，落地酒店保洁、商用服务、精密室内作业等实景项目，当前接入终端设备规模达十万台。依托海量终端持续产生的真实交互数据，未来将反哺世界模型进一步迭代优化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_e5984f27e4554c9483e318010f2106c0@6022551_oswg689261oswg1242oswg742_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人在咖啡店自主配送（图源/企业）</p>\n  <p><strong>以下为硬氪与千诀科技CEO高海川、CTO章天任的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：开环预测场景下，世界模型的长时推理误差会随步数累积。千诀的预测式架构如何应对这一问题？具身任务的闭环反馈机制能在多大程度上抑制误差放大？</strong></p>\n  <p><strong>章天任：</strong>这个问题分几个层面。第一，累积误差的大小取决于应用场景是否具备闭环反馈。视频生成模型是纯开环的，一次性预测未来很多帧，中间没有任何外部信息校正，所以误差容易累积。但具身不同在于它有闭环反馈，我们不会让机器人一次性预测1000步、把整个任务全部规划完再执行，而是先预测50步，选出动作去执行，执行完后环境会给出新的状态作为反馈，基于反馈修正后续预测。</p>\n  <p>这种“执行-观测-修正”的循环，是具身任务与视频生成最本质的区别，能有效抑制误差放大。</p>\n  <p>第二是关于记忆模块。千诀目前已经在一些平台上尝试搭建Memory系统，但还没有与视觉中心直接融合。原因在于，既然已经有了闭环反馈，很多场景下暂时不需要显式的长期记忆。</p>\n  <p>第三，千诀的模型支持多步预测，模型预测的“一步”不一定对应底层的一个控制指令，而可以对应一个完整的语义动作，比如50个底层step。预测步数越少，累积误差发生的概率和幅度就越小。</p>\n  <p>总的来说，我们认为世界模型的能力上限挑战在于完全开环的超长时规划，比如机器人还没开始行动，就要一次性规划好未来几百步的所有细节。但这种使用场景在真实的具身任务中很少见，更自然、更现实的做法还是“边做边看”，发现问题随时调整。</p>\n  <p><strong>硬氪：千诀已实现十万台级别的规模化部署。在实际落地过程中，客户反馈中有哪些超出预期的发现？对你们的产品迭代有什么影响？</strong></p>\n  <p><strong>高海川：</strong>千诀目前已有十万台机器在真实场景中运行，用户把机器人当真实产品使用，给出的反馈也是真实的。因此，我们训练的模型与落地场景之间不存在“real-to-real gap”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_41e8467acc53436aa8ada2335c9bf376@6022551_oswg2925058oswg2472oswg1622_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人自主清洁桌面（图源/企业）</p>\n  <p>市场反馈中有两个点超出了我们的预期。</p>\n  <p>一个是响应速度的敏感度。 不同场景对延迟的容忍度差异很大。生成式模型4秒级的响应，在机器人场景中基本不可用。我们的预测式模型虽然推理速度快、可以在0.5秒内返回结果，但部分机器人需要云端传输延迟在1秒左右，客户仍然反馈“卡顿”。当我们把延迟降低0.5秒，用户体验就有了质的飞跃，这种毫秒级的延迟优化，往往比模型能力的提升更能直接转化为用户满意度。</p>\n  <p>另一方面在于主动性的价值。 大多数时候，客户并不希望机器人只是一个被动执行指令的工具，而是期待它能“眼里有活”——主动感知环境、自主决策，而不是逐条等人类发令。比如在酒店场景中，机器人主动发现地面有污渍并启动清洁，比接到指令再执行，更能让客户感受到“智能化”。这种从“被驱动设备”到“智能体成员”的体验跃迁，正在成为产品差异化的关键维度。</p>", "category": "tech", "published_at": "2026-06-10T01:30:00+00:00", "fetched_at": "2026-06-10T02:57:11.912589+00:00", "fingerprint": "38534e977c78c41e"}, {"source": "36氪 - 最新文章", "title": "医药圈最强“奥斯卡”也没救回股价，创新药被彻底抛弃了么", "url": "https://36kr.com/p/3845683804555529?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>基本面向上、股价向下，是近期创新药板块的真实写照。</p>\n  <p>6月以来，股市创新药板块延续跌势。上周，在全球肿瘤临床权威“风向标”的美国临床肿瘤学会（ASCO）上，多家中国创新药企公布了高价值的临床研究成果，但却未能成为扭转行情的催化剂。</p>\n  <p>既往，ASCO上公布的新药临床研究进展是影响创新药企股价的关键变量。当下，随着BD出海热潮，ASCO又被赋予了“集中检验新药资产成色”的意义，因为“没人敢在ASCO上数据造假”。</p>\n  <p>尤其是，中国创新药企今年带去ASCO的成果堪称历届最佳：本届ASCO收录的7239篇研究摘要中，中国机构/新药参与的摘要高达488篇，占比6.7%，仅恒瑞医药就有80多篇；质量上，康方生物的PD-1/VEGF依沃西单抗已登上含金量最高、全球仅有5项研究入选的全体大会（Plenary Session）。百利天恒、百济神州、科伦博泰、三生制药等12家企业的13项研究入选突破摘要（LBA）。</p>\n  <p>但令人意外的是，二级市场却并未给予同等热情，“ASCO周”连跌5天、一片飘绿。尤其是康方生物、百利天恒、迪哲医药、基石药业等被公认披露了更高质量临床研究的创新药企，最高者一日曾大跌超30%。利好落空的状态未随会议结束消散，低迷一直持续到本周。</p>\n  <p>在进入全球市场的新阶段，资本市场也在以更严格的标准，衡量中国创新药企业在全球的投资价值。</p>\n  <h2><strong>市场在犹豫什么</strong></h2>\n  <p>多位创新药行业受访者认为，中国创新药企今年在ASCO上披露的研究质量不错。“虽然重磅大三期仍是少数，但已能覆盖各阶段、多类Modality研究，整体很丰富。”湾岛生物创始人范晓虎提到，这与早几年，中国药企在其中的标签还是“me too”、重磅研究更是极少的情况截然不同。</p>\n  <p>当下的时间点，少有人再质疑中国创新药的质量。那么，问题出在哪？</p>\n  <p>有从业者认为，个股短期股价波动影响因素繁杂。近期，资金整体流向了回报预期更清晰的科技板块，同时，做空机构在数据发布前后的埋伏也并不罕见。“ASCO临床数据本身无法预判短期股价波动，存在为持仓找理由的成分。”</p>\n  <p>而且，ASCO本质是面向临床医生的学术交流会，不与短期商业价值挂钩，即便是像康方生物那样入选顶级汇报，多数情况下也是通过缓慢影响临床指南、医生用药选择来协助商业化红利的长线兑现，无法影响短期业绩。</p>\n  <p>外部政策环境压力，也会影响资本市场表现。一位前往ASCO现场的药企人士提到，会议现场由欧美人士为主导的交流中，能隐约感受到一丝“对中国创新药行业的忌惮，国内企业的发展速度给欧美本土生物科技企业带来了一定压力，波士顿当地博士生找工作也比过往困难”。</p>\n  <p>叠加美国共和党议员近期提议将生物技术（尤其似乎药品和生物制品）纳入COINS法案禁止投资范围的消息在国内发酵，地缘政治或进一步收紧、政策监管风向未明，投资者自然会重新评估国产新药通过BD等方式进入全球化体系的潜藏风险。</p>\n  <p>对此，波士顿投行Locust Walk中国区董事总经理刘辰分析认为，其实，“法案等政策、法务问题不会是现阶段制约国内药企实现全球化价值的核心瓶颈”。</p>\n  <p>他解释，美国医药市场由三大利益派系制衡：以辉瑞等为代表的跨国药企受益于中国低成本、高效率的研发优势，主张深化对华合作，且“在政界的影响力非常大”；一部分美国本土VC则因国产创新出海挤压当地被投生物科技企业发展空间、高利率冲击收益，存在反对合作声音。</p>\n  <p>此外，RA Capital等为代表的全球化资本则相对中立，他们认为研发技术源头“不受地域限制，只要项目具备商业化潜力就愿意投入孵化”。这从其高管近来多次到中国考察，并与Biobay等医药产业园频频合作的动作也可看出端倪。</p>\n  <p>“我们认为，<strong>三方势力虽在持续博弈，但美国资本市场整体以利益为核心导向，高度参考项目知识产权属性做决策</strong>。当前，部分中国早期研究存在依托国内地域优势规避海外专利授权成本的问题，这往往会被海外机构认定为合规性不足。但对自主布局完整知识产权的国产创新项目，他们愿意遵循市场化竞争逻辑，提供平等合作机会。”刘辰表示。</p>\n  <p>创新药的价值验证是一个实证科学过程，在人体中展示出疾病治疗效果需要时间。由于创新药潜在的市场空间和经济价值，其在全球拓展推进中，难免会受到地缘政治、经济环境等因素影响，需要做更多沟通工作。疾病治疗的有效性和安全性是创新药的内核力量，只有证明这点，才有资本谈论更上一层的烦恼。今天的所谓‘质疑’，恰是中国新药已走进全球竞争的证明。”纳安生物创始人渠志灿认为。</p>\n  <h2><strong>新的阶段、新的标准</strong></h2>\n  <p>当下，尽管外界对创新药BD出海里程碑收入兑现有祛魅情绪，但在国内医保支付的现实约束，和药企海外商业化能力尚待完善的背景下，BD在很长一段时间内，仍会是创新药企最核心的创收路径。</p>\n  <p>现阶段对创新药企的真正考验，在于谁能探索出更具市场前景的BD研发方向、并成功交易。这一趋势在ASCO上已初露端倪。</p>\n  <p>渠志灿在美国从事近30年新药研究，多次参与ASCO，团队今年有3项涉及ADC/RDC的研究被收录。她解释，肿瘤新药研发的底层思路，围绕着三个核心临床挑战展开：克服肿瘤异质性、耐药性和打破诊疗分离。历届ASCO上的各类ADC、双抗、核药等Modality创新，或不同靶点组合、联合用药方案探索，大多都在尝试从这三个维度寻求突破。</p>\n  <p>但如今，她能感受到的变化是，<strong>参会中国创新药企已经在引领一些研发方向，不满足于只被看见、平等交流，而是希望自己的研究方向被国际同行认可，真正参与到全球肿瘤治疗范式的演进中来</strong>。</p>\n  <p>本届ASCO上，最具代表性的潜力方向之一是ADC（抗体偶联药物）+IO（免疫治疗）组合疗法。</p>\n  <p>它最初源于默沙东为自家的“PD-1抗癌神药”K药打造的“K药+ADC”联合治疗体系，核心思路是，传统免疫治疗单药/联合化疗疗效触及瓶颈，而ADC药物能激活肿瘤自身免疫反应，把原本躲避免疫攻击的“冷肿瘤”变成容易被免疫细胞盯上的“热肿瘤”，使免疫治疗更好发挥作用。</p>\n  <p>PD-1和ADC药物研发都涉及中国药企擅长的工程化改造，领跑者如今多来自中国。ASCO上，科伦博泰首次公布自研ADC芦康沙妥珠单抗联合K药，一线治疗PD-L1阳性晚期非小细胞肺癌的III期临床研究。对比K药单药，它显著延长PFS、降低进展/死亡风险，这也是全球首次有ADC+IO在III期研究中正面击败“药王”K药。</p>\n  <p>此外，包括恒瑞医药、荣昌生物、百奥泰、石药集体等在内，均披露了相关研究，且都处于II/III期后期临床阶段。可以预见，ADC+IO挤进肿瘤一线治疗指南的前景可期。在传统HER2 ADC代表的ADC单药赛道饱和的情况下，这是值得BD团队重点关注的迭代方向。</p>\n  <p>当然，能形成产业趋势的研究方向是少数。刘辰认为，国内创新药团队更擅长前期靶点和工艺研发，缺少全球临床开发经验。临床进入I期爬坡、适应症拓展阶段后，如何选择优先开发的病种、设计临床方案普遍存在短板。借ASCO场地，直接当面向海外顶尖临床专家请教全球市场临床开发问题，能省去不少力气。</p>\n  <p>“ASCO是跨国药企肿瘤研发高管和KOL集中密度最高的地方。BD决策中，不仅R&amp;D部门的声音很关键，跨国药企内部立项评审本身也高度依赖外部权威PI意见。如果顶尖PI在ASCO上认可某项药物、某个研究方向的临床价值，反过来为跨国药企提供咨询时也有帮助。”刘辰经手的一个项目，就是专家在ASCO上了解到该研究后，主动发邮件推荐给跨国药企研发负责人，得以顺利推进谈判。</p>\n  <p>这的确代表了一部分企业的参会初衷。今年，诺诚健华的新型BCL2抑制剂mesutoclax用于治疗骨髓增生异常综合征（MDS）的方案入选ASCO口头报告。目前，市场上没有BCL2抑制剂获批治疗MDS。诺诚健华方面对36氪表示，本次参与ASCO，核心目的之一就是向国际血液肿瘤专家咨询“更多关于mesutoclax等管线的临床开发建议，以加速产品上市进程”。</p>\n  <p>范晓虎同样提到这点。湾岛细胞瞄准非基因编辑通用CAR-T路径，意在实现现货型CAR-T的大规模工业化生产。在细胞治疗企业集体转向体内CAR-T研发的当下，这个方向颇为小众。</p>\n  <p>“我们只展示了部分早期研究成果，未期待凭借少量患者数据达成合作，核心目的是向行业介绍新赛道、展示公司技术平台，建立认知。整体效果不错，最近接到很多沟通诉求，现场有同行认可这是具备验证价值的新方向。”</p>", "category": "tech", "published_at": "2026-06-10T02:07:22+00:00", "fetched_at": "2026-06-10T02:57:11.912573+00:00", "fingerprint": "8c4e8535fa64eaa9"}, {"source": "少数派", "title": "众测招募｜灵犀 Linx 键盘功能共创计划开启", "url": "https://sspai.com/post/110863", "summary": "少数派联合思维重置与Akko共创的新产品「灵犀Linx键盘」即将上市。在产品正式发布前，我们希望邀请一批用户提前参与体验，共同验证功能设计和使用场景。本次将面向少数派社区招募10名体验用户。关于灵犀L ...<a href=\"https://sspai.com/post/110863\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-09T04:00:00+00:00", "fetched_at": "2026-06-10T02:57:09.938392+00:00", "fingerprint": "5052c18c2c4dd839"}, {"source": "少数派", "title": "社区速递 144 | 听 AI 开「营养处方」、无感耳夹耳机与磁吸支架", "url": "https://sspai.com/post/110907", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/110907\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-09T09:06:41+00:00", "fetched_at" easons. But the biggest is that, despite all the airtime, it didn't announce much new beyond a redesigned interface. Almost all the features touted already exist or are upgrades to current options. Why Apple chose to do this isn't [&#8230;]", "category": "tech", "published_at": "2026-06-08T23:41:00+00:00", "fetched_at": "2026-06-09T02:44:09.103003+00:00", "fingerprint": "66934da7af9c4759"}, {"source": "The Verge", "title": "Instagram is finally letting everyone reorganize their profile grid", "url": "https://www.theverge.com/tech/946458/instagram-is-finally-letting-everyone-reorganize-their-grid", "summary": "Nearly a year after it was announced, Instagram says it's delivering the ability to rearrange the posts in your profile grid. It had been available to some people in test groups, but as of June 8th, it's rolling out widely via the Android and iPhone mobile apps. Until now, the posts on your Instagram profile [&#8230;]", "category": "tech", "published_at": "2026-06-08T23:58:30+00:00", "fetched_at": "2026-06-09T02:44:09.102994+00:00", "fingerprint": "6528dfb967c22994"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨苹果推出全新Siri AI；ROKID回应“智能眼镜偷拍空姐”事件；OpenAI秘密提交IPO文件", "url": "https://36kr.com/p/3845196412193284?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>阿里巴巴成立Token Foundry事业部</p>\n  <p>微信宣布面向开发者提供接入微信AI生态的能力</p>\n  <p>全球70%PPE树脂断供，PCB价格大涨</p>\n  <p>英伟达与LG集团合建AI工厂，合作推进机器人、自动驾驶及自主AI</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>苹果推出全新Siri AI，新一代操作系统iOS 27正式发布</strong></p>\n  <p>在WWDC 2026开发者大会上，新一代操作系统iOS 27正式发布，本次iOS 27的升级重点，是新一代Apple Intelligence（苹果智能）以及全新Siri AI。&nbsp;</p>\n  <p>苹果宣布，Apple Intelligence与谷歌合作，引入Gemini大模型，并采用全新的AI架构，进一步提升Siri AI的能力，让其在用户日常使用的App中发挥更大作用。Siri AI是Siri的全新版本，深度融入iPhone、iPad、Mac、Apple Watch和Apple Vision Pro等设备。&nbsp;</p>\n  <p>据介绍，Siri AI可以回答与当前屏幕内容相关的问题，也能结合用户个人情境，在信息、邮件、照片等内容中进行搜索，还能通过更系统化的App操作，完成跨App任务。&nbsp;</p>\n  <p>苹果还推出了独立的Siri App，用户可以重新查看过去的对话，也可以发起新的对话，相关对话历史将通过iCloud在不同设备间私密同步。&nbsp;</p>\n  <p>性能方面，iOS 27也带来多项优化，覆盖App启动、照片加载、网络切换、AirDrop传输、硬盘读写以及CPU调度器等。苹果表示，升级iOS 27后，iPhone的App启动速度提升30%，拍照后照片加载速度提升70%，AirDrop传输速度提升80%。同时，在蜂窝网络和无线网络之间切换时，系统表现也会更加顺滑。&nbsp;</p>\n  <p>此外，苹果还回应了用户对Liquid Glass（液态玻璃）设计的反馈，并表示“深表感谢”。苹果对Liquid Glass的底层基础进行调整，其中最主要的变化是新增调节滑块，用户可以根据自己的喜好调节液态玻璃效果，从完全不透明到完全透明都能自由选择。（快科技）&nbsp;</p>\n  <p><strong>ROKID回应“智能眼镜偷拍空姐”事件&nbsp;&nbsp;</strong></p>\n  <p>近日，上海一女士在乐奇ROKID智能眼镜用户社区内，发现有用户使用该品牌眼镜在登机时拍摄“春秋航空”空姐并公开发布，引发公众对智能眼镜沦为“偷拍神器”的担忧。此外电商平台相关的违规配件也引发舆论广泛关注。6月8日，乐奇发布社区生态治理与隐私保护的声明，汇报目前的处理进展与措施。主要包括三方面举措：1. 涉事违规及侵犯隐私的内容已全部清理下架，违规账号已严肃处理。2. 针对电商平台上恶意规避安全机制的“指示灯遮光贴”，乐奇已正式向各平台发起投诉，全力推进相关违规配件的下架与溯源治理。3. 乐奇透露在后续新品研发中，将升级感应配件与底层防护算法，从物理与技术源头最大程度杜绝恶意改装与违规拍摄。（潇湘晨报）</p>\n  <p><strong>OpenAI向美国证监会秘密提交IPO文件</strong></p>\n  <p>ChatGPT开发商OpenAI于6月8日秘密提交了美国首次公开募股（IPO）申请，与竞争对手Anthropic一道进军股市，以满足投资者对人工智能热潮的投资需求。OpenAI未披露此次发行的规模或条款，但有报道称，这家人工智能巨头计划在最早可能于9月进行的首次公开募股中，争取高达1万亿美元的估值。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>字节Seed相关人士回应顾全全离职传闻：并非AI制药及预训练负责人</strong></p>\n  <p>近期，市场有传闻称，原字节跳动Seed团队成员顾全全已离职创业。部分消息将其描述为 Seed 团队AI制药及大模型（LLM）预训练业务的负责人。对此，字节Seed相关人士称：“顾全全在公司参与过生物分子结构预测和LLM预训练的部分工作，但并不是字节Seed的AI制药和预训练负责人，对其创业事宜不了解。”</p>\n  <p><strong>阿里巴巴成立Token Foundry事业部&nbsp;</strong></p>\n  <p>36氪获悉，6月8日，阿里巴巴宣布合并通义大模型事业部和未来生活实验室，成立Token Foundry事业部，由集团CEO吴泳铭直接负责。据了解，此次调整涉及到一批AI业务。周靖人将担任阿里巴巴首席科学家，牵头成立阿里巴巴AI未来研究院，专注前沿AI科技的探索与突破。郑波带领Happy Horse、Happy Oyster等加入Token Foundry事业部。此次升级是阿里在AI领域的持续加码。最新的Qwen-3.7模型能力突出，实现全球前三、国内第一的Coding能力，在开发者社区和行业客户中获得广泛认可。上个月发布的Q4财报首次披露阿里AI业务已跨越初期投入阶段，迈入商业化回报周期，资本市场反应积极。</p>\n  <p><strong>英伟达与LG集团合建AI工厂，合作推进机器人、自动驾驶及自主AI&nbsp;</strong></p>\n  <p>6月8日，英伟达与LG集团宣布合作建设AI工厂，为LG旗下机器人、自动驾驶、数据中心及GPU云服务等核心业务提供加速计算基础设施。在机器人领域，LG电子将整合英伟达Isaac Sim、GR00T等框架训练家用机器人CLoiD，并建立物理AI数据工厂向外部供应机器人训练数据；LG CNS将英伟达机器人技术引入其PhysicalWorks工业平台。在AI工厂基础设施方面，LG Uplus及LG CNS将基于英伟达DSX平台建设可扩展AI工厂，LG新能源探索800伏直流数据中心储能方案。在自动驾驶领域，LG电子将对齐英伟达DRIVE Hyperion架构推进ADAS及软件定义汽车产品线。在自主AI方面，LG AI研究院基于英伟达Blackwell GPU持续开发EXAONE模型，并通过ChatEXAONE向集团内部推广。（界面新闻）</p>\n  <p><strong>微信宣布面向开发者提供接入微信AI生态的能力</strong></p>\n  <p>36氪获悉，据微信��开课消息，微信开放平台在充分尊重开发者权益和自主选择的基础上，面向开发者提供了便捷接入微信AI生态的能力。开发者需在“小程序管理后台-AI能力”主动授权接入微信AI。同时，平台提供了自动模式与开发模式两种接入选项，以满足不同规模团队的开发需求。当前该功能处于内测阶段，用户暂时还无法体验。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>苹果发布macOS新版本“Golden Gate”</strong></p>\n  <p>当地时间6月8日，苹果在全球开发者大会上公布全新macOS版本——macOS Golden Gate。苹果表示，该版本系统动画更流畅，很多功能运行速度也更快。iPhone和iPad应用的启动速度提升高达30%，系统内容加载速度更快，照片在图库中的显示速度提升70%，隔空投送速度提升80%，云端硬盘传输速度提升5倍，所有能运行iOS26的iPhone也都适配。（界面新闻）</p>\n  <p><strong>库克在WWDC发表告别致辞，新CEO将在9月上任</strong></p>\n  <p>在WWDC 2026的发布会上，蒂姆・库克以苹果CEO身份完成的最后一场主题演讲，伴随其深情的告别致辞，执掌苹果长达15年的“库克时代”正式步入收官阶段。库克发表感言称，举办WWDC这类活动，是自己担任CEO期间最难忘的高光时刻。（快科技）</p>\n  <p><strong>韩股单日两度熔断，散户高杠杆加剧风险&nbsp;</strong></p>\n  <p>6月8日午后，韩国KOSDAQ指数暴跌8%，触发熔断机制，交易暂停20分钟。而在6月8日早间，韩国KOSPI指数盘初跌幅扩大至超8%，触发熔断机制，交易暂停20分钟。根据韩国金融投资协会的数据，截至6月1日，韩国股市保证金余额，即券商向散户投资者提供的股票购买信贷额度为27.8万亿韩元，约合183亿美元，较年初增长61.6%。分析人士补充称，由于投资者会向信贷公司和银行借款购买股票，因此散户杠杆率可能更高。而高杠杆在市场行情好的时候可以提振股市，但在市场低迷的时候会放大损失。（财联社）</p>\n  <p><strong>网传必胜客出售，知情人回应</strong></p>\n  <p><strong>对于网传必胜客出售的消息，记者从接近百胜中国人士处了解，百胜中国和百胜餐饮集团（Yum! Brands）是两家独立运营的公司，百胜中国不方便对Yum! Brands公司的事情评论。这一消息不会影响必胜客在中国的日常运营，百胜中国在中国独立运营必胜客品牌。必胜客作为百胜中国的六大品牌之一，也是公司的优质资产。（界面新闻）</strong></p>\n  <p><strong>Seesaw Coffee已进入破产清算</strong></p>\n  <p>近日企查查平台显示，昔日网红精品咖啡品牌Seesaw Coffee已于近期进入破产清算流程。记者注意到，Seesaw的运营主体上海西舍咖啡有限公司（下称“上海西舍咖啡”）新增多例破产审查案件。今年2月28日和3月10日，上海玛露实业有限公司（下称“上海玛露实业”）与上海琉璃工房琉璃艺术品有限公司（下称“上海琉璃工房”）先后向法院提出申请，以上海西舍咖啡不能清偿到期债务且明显缺乏清偿能力为由，对上海西舍咖啡提起破产清算。</p>\n  <p>企查查数据显示，截至目前，上海西舍咖啡涉及司法案件107起，2025年新增了超过50起。记者注意到，这些案件主要是供应商合同纠纷、追讨欠款，甚至包括创始人吴晓梅与银行、小额贷款公司的借贷纠纷等，不完全统计涉案总金额超过2000万元。（第一财经）</p>\n  <p><strong>罗氏将向Nurix支付高达23亿美元的癌症药物交易款项</strong></p>\n  <p>6月8日，罗氏发表声明称，已与生物制药公司Nurix Therapeutics达成独家许可与合作协议。罗氏将支付最高23亿美元，以获得Nurix一种实验性血液癌症药物的权益。声明显示，Nurix将因布鲁顿酪氨酸激酶（BTK）降解剂bexobrutideg（NX-5948）获得7亿美元预付款，该药正被开发用于治疗特定血癌及潜在的免疫系统和神经系统疾病。罗氏与Nurix将分担研发成本并平分美国市场的利润，此外，罗氏将负责该疗法在美国以外地区的商业化。双方预计交易将于2026年第三季度完成。（界面新闻）</p>\n  <p><strong>电子布价格涨幅达100%</strong></p>\n  <p>电子布，全称电子级玻璃纤维布，是电子工业中的关键基础材料，主要用于覆铜板和印制电路板的制造，再应用于数据中心服务器、智能手机和5G通信基站等各类电子产品。记者调查发现，今年以来，算力需求爆发，带动电子布价格大幅上涨。截至6月初，市场上常用规格的电子布已经完成年内5轮提价，均价达7.4元/米，与去年三季度的低点相比，涨幅达到100%。由于电子布对生产设备和工艺控制要求很高，客观上制约了产能的扩张节奏。专家表示，电子布供需紧张的情况可能还会延续。业内人士预计，受电子纱扩产周期长、高端电子布产能落地仍需时间影响，电子布市场何时恢复供需平衡，还有待观察。（央视财经）</p>\n  <p><strong>全球70%PPE树脂断供，PCB价格大涨</strong></p>\n  <p>中东冲突带来的影响，正从能源市场进一步蔓延到电子产品供应链。记者了解到，沙特的朱拜勒工业区此前供应了全球大约70%的PPE树脂。但是，早在今年3月底，由于霍尔木兹海峡航运受阻，相关工厂就已经停产。树脂是制造印刷电路板的重要材料，其中，PPE树脂主要用于高端产品。要知道，印刷电路板相当于电子设备的“神经系统”。从智能手机、笔记本电脑，到路由器、人工智能服务器，几乎所有现代电子产品都离不开它。专家表示，如果树脂供应中断持续到今年秋天，消费者将切实感受到涨价的压力。近期，高盛的一份报告显示，仅在4月份，印刷电路板的价格较3月份最高上涨了40%。美国印刷电路板制造商迅达科技的股价在过去一年上涨超过400%。（央视财经）</p>\n  <p><strong>奇瑞：没有在印度市场直接投资和技术转让</strong></p>\n  <p>奇瑞汽车6月8日发布关于奇瑞合作事宜失实报道的澄清声明：公司关注到，近日许多媒体援引外媒信息，解读奇瑞与印度塔塔集团的相关合作，其中不乏善意的关心，但也衍生出大量不实猜测。现就实际情况说明如下：奇瑞与印度塔塔集团正在商谈的合作协议，限定为车型相关的零部件供应，为其提供汽车散件。奇瑞没有在印度市场直接投资和技术转让等安排，部分媒体和账号所称的“平台转让”“平台授权”“技术授权”“技术出口”“技术输出”等表述，均与事实不符。由衷感谢社会各界对奇瑞的关心和关注。 （界面新闻）</p>\n  <p><strong>马斯克谈SpaceX上市原因：需要更多卫星满足通信需求</strong></p>\n  <p>马斯克在不久前的摩根大通闭门会中接受连线采访，他表示，之所以现在让SpaceX上市，是因为公司需要大量资金来应对一个重大的资本增长阶段，此外，他还指出，SpaceX的收入已从此前的不稳定变得更具可预测性。（新浪财经）</p>\n  <p><strong>黄仁勋：SK海力士到2030年将晶圆产能翻倍的计划还不够</strong></p>\n  <p>英伟达CEO黄仁勋表示，SK海力士到2030年将晶圆产能翻倍的计划还不够。(财联社)</p>\n  <p><strong>京东：京东外卖、金融及创始人遭有组织恶意抹黑，造谣者已受法律惩处</strong></p>\n  <p>6月8日，京东集团官方微博账号“京东发言人”发布帖子。“京东发言人”指出，一段时间以来，京东外卖、京东金融等业务以及京东创始人遭受了大量有组织、有预谋的恶意抹黑和造谣攻击。尤其恶劣的是，某幕后抹黑公司雇佣小笨文化等机构，对京东进行了长时间、全方位、系统性的造谣攻击，经公安机关依法侦办，小笨文化等部分造谣抹黑者已受到法律惩处。（证券时报）</p>\n  <p><strong>市场监管总局约谈美宜佳总部</strong></p>\n  <p>记者了解到，针对一段时期以来监管发现和媒体曝光的美宜佳多个门店销售过期食品等食品安全问题，市场监管总局近日依法对美宜佳控股有限公司（即美宜佳总部）负责人进行了责任约谈，要求其严格遵守《中华人民共和国食品安全法》以及《食品销售连锁企业落实食品安全主体责任监督管理规定》等法律法规，建立健全覆盖总部、分支机构、门店等经营管理各层级、经营活动全链条的风险管控制度机制和食品安全追溯体系，全面落实食品安全主体责任，切实保障公众饮食安全，保护消费者合法权益。（央视新闻）</p>\n  <p><strong>胜宏科技：网传视频与公司的生产经营活动无关</strong></p>\n  <p><strong>近日，网上出现了涉及胜宏科技高管的传闻。6月8日上午，胜宏科技方面向记者表示，公司已关注到相关信息，但网传视频及相关信息所反映的内容与公司的生产经营活动无关，亦不涉及公司治理、内部控制或任何应披露的重大信息。该等事项不会对公司的日常经营造成任何影响。胜宏科技称，当前公司生产经营活动一切正常、订单充沛，各项工作均在有序推进中。（界面新闻）</strong></p>\n  <p><strong>闲鱼变更法定代表人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，浙江阿里巴巴闲鱼网络科技有限公司发生工商变更，丁健卸任法定代表人、经理、董事，由王程远接任，同时，财务负责人发生变更。该公司成立于2019年12月，注册资本1000万人民币，经营范围包括营业性演出、演出经纪、出版物互联网销售等，由浙江淘宝网络有限公司全资持股。</p>\n  <p><strong>Gen II正考虑以60亿美元出售</strong></p>\n  <p>据报道，总部位于纽约的Gen II的股东正考虑在今年晚些时候出售这家私募基金管理公司，交易金额预计达60亿美元。据Hg网站显示，该公司由一个机构投资者财团提供支持，其中包括私募股权公司General Atlantic和软件投资机构Hg HGT.L。报道称，目前尚未做出最终决定，计划仍可能发生变动，且迄今尚未任命任何顾问。据其官网显示，Gen II成立于2009年，目前管理着超过1.5万亿美元的私募基金资本。（新浪财经）</p>\n  <p><strong>国际航协：2026年全球SAF产量依旧令人失望</strong></p>\n  <p>国际航空运输协会（IATA）发布最新估算数据显示，2026年全球SAF（可持续航空燃料）产量预计将达到约240万吨，仅占航空燃料总用量的0.8%，航空公司支出成本为43亿美元。国际航协理事长威利·沃尔什（Willie Walsh）表示：“对于SAF生产而言，又是令人失望的一年。由于政策缺乏有效统筹，加之石油公司缺乏兴趣，实现2050年SAF满足65%燃料需求的难度正逐年增加。当前的能源危机本应进一步凸显发展可再生能源，包括SAF的紧迫性。然而，无论是能源危机、实现能源独立与创造就业的需求，还是缓解气候变化的紧迫性，都尚未转化为建立成熟SAF市场所需的市场激励措施。”（界面新闻）</p>\n  <p><strong>美股三大指数收盘涨跌不一，热门中概股跌多涨少</strong></p>\n  <p>36氪获悉，6月8日收盘，美股三大指数涨跌不一，道指跌0.16%，纳指涨0.86%，标普500指数涨0.3%。大型科技股涨跌互现，特斯拉涨超4%，Arm、英伟达涨超1%，奈飞小幅上涨；苹果、微软、谷歌、Meta跌超1%，亚马逊小幅下跌。热门中概股跌多涨少，百度、拼多多跌超2%，京东跌1%，阿里巴巴、腾讯音乐、网易、微博小幅下跌；理想汽车、B站涨超2%，蔚来涨超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>安克创新赴港IPO的估值达7亿至8亿美元</strong></p>\n  <p>市场消息：安克创新赴港IPO的估值达7亿至8亿美元。（新浪财经）&nbsp;</p>\n  <p><strong>阶跃星辰最快将于周一提交香港首次公开募股申请</strong></p>\n  <p>消息人士称，中国人工智能初创企业阶跃星辰最快将于周一提交香港首次公开募股（IPO）申请。（新浪财经）&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>Kimi估值飙升至300亿美元</strong></p>\n  <p>6月8日，据每日经济新闻报道，大模型独角兽Kimi（月之暗面）已开启新一轮融资，投前估值达300亿美元，较上月大幅跃升。Kimi是国内AGI企业月之暗面旗下AI助手。2025年末，月之暗面完成5亿美元C轮融资；今年2月中旬传出新一轮超7亿美元的融资即将完成交割的消息。另据科创板日报3月报道，月之暗面3月估值上升至180亿美元，在3个月内翻了4倍，并正在进行一轮10亿美元融资。天眼查App显示，月之暗面C轮融资资方阵容包括IDG资本、阿里巴巴、腾讯等多家头部产业方与投资机构。2026年2月完成的超7亿美元融资，投资方包括阿里巴巴、五源资本、高榕创投、九安医疗、腾讯等。（界面新闻）</p>\n  <p><strong>英国初创公司PhysicsX完成3亿美元融资</strong></p>\n  <p>英国初创公司PhysicsX在新一轮融资中筹集了3亿美元，公司估值约为24亿美元，新加坡淡马锡领投，英伟达和应用材料等早期投资者也继续参与。该公司提供一种AI模型，可预测物理对象的行为，使航空航天和汽车企业在设计、测试和组装流程上更为高效。公司表示，由于客户需求积压约六个月，PhysicsX需扩充团队，因此需要更多资金。公司预计今年营收将“接近5000万美元”。（新浪财经）</p>\n  <p><strong>“安纳智芯”完成数亿元融资</strong></p>\n  <p>36氪获悉，近日，高精度现代模拟计算芯片公司“安纳智芯”宣布完成新一轮数亿元融资，本轮由经纬创投领投，峰瑞资本、阿尔法公社跟投，老股东讯飞创投、中赢创投持续加码。</p>\n  <p><strong>“华超神控”完成亿元人民币级天使轮系列融资</strong></p>\n  <p>36氪获悉，近日，AI超声脑机公司“华超神控”（BCI-Sonics）已完成亿元人民币级天使轮系列融资。天使轮融资由经纬创投领投，天使+轮由德联资本、道远资本联合领投，循光资本持续担任独家财务顾问。募集资金将用于推动公司的技术验证与产业化落地。</p>\n  <h2>酷产品</h2>\n  <p><strong>奢侈品牌Prada进军航天业，为NASA提供登月宇航服</strong></p>\n  <p>财联社6月8日电，意大利奢侈品牌Prada公布专为NASA登月任务设计的内层服装。该服装由Prada与美国航天基础设施开发商Axiom Space合作打造，特色是在面料中织入通风管道。该宇航服预计将用于NASA计划在2028年进行的“阿耳忒弥斯4号”登月任务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_d8fab53458f34524a9112a1aa5f14688@5667365_oswg832659oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">奢侈品牌Prada进军航天业，为NASA提供登月宇航服</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-06-09T00:19:03+00:00", "fetched_at": "2026-06-09T02:44:08.877268+00:00", "fingerprint": "02f9a8a1d5474e30"}, {"source": "36氪 - 最新文章", "title": "「百奥几何」完成数亿元战略融资，打造生命科学\"微观世界模型\"｜36氪首发", "url": "https://36kr.com/p/3839626642344454?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，近日，AI原生生物科技公司百奥几何已完成数亿元战略融资。由上海生物医药创新转化基金、国科投资、达晨财智、星连资本联合领投，高榕资本、指数人工智能产业创新基金跟投。指数资本担任独家财务顾问。另据介绍，本轮募集资金将重点用于生命科学微观世界模型GeoFlow的持续迭代，以及自研药物管线的推进。</p>\n  <p>当前，人工智能正沿两条主线加速演进：以大语言模型与多模态模型为代表的数字AI（Digital AI），以自动驾驶与人形机器人为代表的物理AI（Physical AI）。而生命AI（Bio AI）或将成为下一个最具想象力的疆域，这一判断，正被全球顶级资本与科学界持续确认。</p>\n  <p>2024年，诺贝尔化学奖同时授予蛋白质结构预测与蛋白质从头设计两个方向；2025年，中国创新药BD交易金额达1357亿美元，占全球交易金额约49%，超越美国成为全球创新药对外授权第一大市场；2026年5月，Alphabet旗下Isomorphic Labs完成21亿美元融资，由Thrive Capital领投，淡马锡、MGX、英国主权AI基金等主权资本共同入局，刷新AI药物发现领域的单笔融资纪录。</p>\n  <p>生命科学的基本单位是由分子组成的细胞，生命的所有功能，都源自分子在原子尺度上的相互作用。能否在微观层面真正理解、并精准设计分子之间的相互作用，是生命科学最底层的命题。百奥几何自研的GeoFlow正是这样一个\"微观世界模型\"，通过在原子级精度上对蛋白质、DNA、RNA等生物分子的相互作用进行精确建模，以生成式AI从头创造自然界从未存在的全新分子，让\"理解生命\"走向\"设计生命\"。</p>\n  <p>自2024年首次发布至今，GeoFlow历经三次升级。GeoFlow V1将\"原子级精度建模分子相互作用\"这一核心思想落地为可工程化的大模型。在关键的蛋白-蛋白复合物结构预测任务上，GeoFlow V1达到与AlphaFold 3同等水准；2025年4月迭代至GeoFlow V2这一版本时，已不再局限于单纯的结构预测，而是实现了原子级精度下蛋白质结构预测与“从头设计（de novo design）”能力的统一，能够完成抗体从头设计、疫苗设计、工业酶优化等工作。</p>\n  <p>“客观而言，GeoFlow V2已能针对部分靶点生成相应的结合分子，但所得分子的结合亲和力仍有提升空间。因此，去年10月，我们又迭代了GeoFlow V3，核心目标是提高结合分子的生成成功率，并尽可能获得更多高亲和力结合分子，达到纳摩尔级（nM）水平。”唐建表示。</p>\n  <p>为实现这一点，百奥几何将大模型领域的Test-Time Scaling（TTS）技术应用到了蛋白质设计中。简单理解，这是一种用推理时间和计算投入换取设计质量的思路，具体到蛋白质设计上，就是针对目标靶点，让模型一次性生成多个蛋白版本，再从中筛选出优质样本、验证优化，最终得到结构稳定、亲和力达标的新蛋白。其核心优势在于成本低、落地快，不用投入巨资重新训练模型，就能提高蛋白质设计的成功率和质量。</p>\n  <p>以实际的抗体设计应用场景为例：在科学家还需“手搓”的时代，研发团队通常会在动物体内/体外构建上亿级分子库，并开展多轮、耗时数月的高通量筛选，成本高、流程长。如今，在AI“主导”下，则可以通过更少的试验投入，实现更高的命中率。</p>\n  <p>据百奥几何披露数据，在针对TSLP、IL-33、IL-13、CCR8、&nbsp;PD-1、H3-HA、IL-4Rα等超过20个靶点的从头设计任务中，每个靶点仅需合成验证不超过50个GeoFlow V3设计的候选分子，就能获得表位特异的nM级别的结合抗体，平均命中率接近20%，且先导分子发现时间可缩短至三周内。</p>\n  <p>目前，百奥几何正在研发下一代微观世界模型GeoFlow V4，将建模尺度从分子相互作用拓展至从\"设计单个分子\"走向\"设计分子系统\"。</p>\n  <p>近两年，BD交易成为创新药企的重要商业化出口。既往案例中，药物管线的价值通常随临床阶段推进而增加。此前，百亿美元级大额交易多发生在临床2期或3期之后，也能看出这一点。但AI的“从头设计”能力或将进一步放大早期阶段分子的价值，进而改写这个逻辑。</p>\n  <p>唐建认为，对于那些传统方法容易获得的抗体分子，跨国药企更看重后期临床数据，是因为速度越快、临床数据越充分，获批上市概率就更大。但对于获取难度本就很高的分子，即便处于早期阶段，只要能形成差异化，也可以做出高价值；而且，优质分子还能提升临床阶段的成功率。</p>\n  <p>据介绍，百奥几何现已与国内外药企达成超20项BD合作，在高特异性抗体从头设计、先导分子多目标优化、疫苗设计等多方面实现突破。</p>\n  <p>以肿瘤免疫领域为例，GeoFlow 模型实现了高特异性抗体的\"从头设计\"。该项目的目标靶点是肿瘤细胞表面特有的抗原，研发难点在于它存在一个高度同源的\"孪生靶点\"——两者结构高度相似，传统方法难以在分子层面精准区分，极易误伤表达\"孪生靶点\"的正常细胞。百奥几何借助 GeoFlow 的全原子建模能力，将\"特异性\"作为前置约束直接写入分子生成阶段：仅设计不超过 100 条序列，即获得 2 条同时具备高选择性与高亲和力的抗体——精准结合目标靶点，而对\"孪生靶点\"不结合，从源头保障了临床安全性。</p>\n  <p>“目前，这是最能代表百奥几何模型能力的项目之一。通常，与客户共同开发的大多是传统方法无法攻克的项目，甚至有一些GeoFlow V2无法完成、GeoFlow V3迭代后成功突破的案例。这个过程中，不仅我们能感受到模型迭代带来的能力涌现，客户自身也在直观感受到AI技术的快速进化，尤其是AI Agent爆发后，药物研发和蛋白设计领域的技术迭代速度在显著提升。”唐建提到。</p>\n  <p>在与某国外知名药企的合作中，目标项目需要同时优化先导抗体的亲和力、理化性质、热稳定性、人源性等多项指标。GeoFlow在零样本（模型未经该靶点数据微调）场景下，仅通过一轮设计与验证即交付了同时满足全部预设指标的目标分子：亲和力提升数十倍、表达量提升8倍、人源性优化至90%以上、热稳定性同步显著提升，项目交付周期较客户预期缩短80%以上。</p>\n  <p>此外，在合成生物学领域，百奥几何已储备数十条自研管线。其中，包括ɑ-酮戊二酸、天然冰片在内的多条管线已完成中试放大；目前，公司的多款自研管线已通过“技术转让+销售分成”的模式达成授权合作，商业化进展持续提速。</p>\n  <p>团队方面，百奥几何由AI4S科学家唐建教授创立，图灵奖得主、AI之父Yoshua Bengio担任首席科学顾问。团队自2018年开始探索AI驱动药物发现，已取得多项产学研落地成果。2021年，将扩散生成模型用于分子三维结构生成（代表性工作&nbsp;ConfGF、GeoDiff）；2022年联合英伟达、英特尔、IBM发布开源机器学习药物发现平台 TorchDrug 与 TorchProtein。近期，作为核心贡献者参与英伟达开源蛋白质大模型&nbsp;La Proteina 的研发，并自主研发前沿 AI 虚拟细胞模型PerturbDiff。</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>上海生物医药创新转化基金总裁郭秋杉表示，大分子药物开发长期掣肘于传统筛选的冗长与过往分步式AI工具链的误差逐级放大。百奥几何实现了生物分子相互作用的原子级精度建模，并将结构预测、序列生成、成药性评价与湿实验反馈整合闭环，代表一条更接近底层科学逻辑和真实工业需求的 AI Native 路径。这种全原子 De Novo 设计思想，让公司在传统难成药靶点、复杂抗体、多特异性大分子等高难度管线上展现出无法比拟的代际优势，并实现了 PCC 级分子的交付。我们期待百奥几何凭借快速迭代、自主可控的 GeoFlow 算法底座，全速推进自研管线的临床开发与全球合作。</p>\n  <p>国科投资智慧医疗组组长张堃表示，AI驱动药物研发有望打破生物医药行业“反摩尔定律”研发困局，推动大分子药物逐步构建“结构理解、定向设计、干湿实验闭环验证”的全新研发范式。我们高度认可唐建教授领衔团队在AI4S领域的技术能力及其全球影响力，其自主研发的GeoFlow模型在抗体药物、工业酶从头设计场景中已展现出差异化技术优势。我们相信，在AI重塑药物研发的时代背景下，百奥几何将深度赋能创新药企与生物制造产业，加速管线转化与商业化落地，持续带来产业化价值和兑现产业化红利。</p>\n  <p>达晨财智董事总经理王大奎博士表示，AI在生物医药领域的“智能涌现”时刻比业内预想中来得更快。AI可以近乎无限地设计、筛选候选分子，药物研发的创新正从传统实验试错转向计算驱动。百奥几何正是由唐建教授带领的一支顶尖AI4S团队，常年扎根生物计算，既有扎实的学术积累，也具备把前沿算法落地成工程方案的能力。团队自研的GeoFlow微观世界模型，可以高精度预测蛋白质等生物大分子的结构与相互作用，技术能力处于全球第一梯队，也是打破海外相关闭源模型垄断的一个关键突破口。再叠加国内在湿实验环节成本低、迭代快的优势，以百奥几何为代表的中国AI制药公司，完全有能力实现后发追赶。</p>\n  <p>星连资本合伙人李文珏表示，生命科学正在进入一个全新的时代：从依赖经验和偶然发现，走向以计算和设计驱动的精准创新。百奥几何以生成式&nbsp;AI&nbsp;为引擎，探索蛋白质这一生命底层语言的可编程化设计，并通过干湿实验闭环不断加速模型迭代与实验验证，提升新分子发现和功能设计的效率与成功率。我们看好百奥几何在&nbsp;AI&nbsp;基础模型、蛋白设计能力和实验验证体系上的系统性积累，也看好其全球化、交叉学科团队所展现出的长期创新潜力。期待百奥几何持续推动&nbsp;AI&nbsp;与生命科学的深度融合，为生物医药与合成生物学打开更高效、更可预测、更具工程化能力的新范式。</p>", "category": "tech", "published_at": "2026-06-09T00:30:00+00:00", "fetched_at": "2026-06-09T02:44:08.877263+00:00", "fingerprint": "76fcdc34d425c485"}, {"source": "36氪 - 最新文章", "title": "生殖学博士入局脑机接口，想做一款缓解女性经期情绪问题的脑机\"发箍\"｜早期项目", "url": "https://36kr.com/p/3843971153267208?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>对许多女性而言，经期不只是一次生理周期的重复，更是一场身心双重的考验。腹痛、头痛、疲劳、焦虑、易怒……这些经前期综合征（PMS）带来的不适，严重时甚至会影响工作和生活。然而，目前主流的缓解方式仍然高度依赖止痛药，长期服药存在副作用风险，而物理热敷、休息调整固然能带来一定舒缓，却效果有限。</p>\n  <p>有没有一种更温和、无创的方式，能安全有效地缓解经期不适？这一市场痛点，吸引了一位生殖学博士跨界进入脑机接口领域，试图用科技为女性经期健康问题带来新的解题思路。</p>\n  <p>智子银河成立于2026年，专注于无创脑机接口等产品开发。智子银河总裁黄河龙博士毕业于中国科学技术大学，拥有多年生殖学学术积累，曾就职于云锋基金、建银国际等，也是一名连续创业者，具备10余年医疗科技领域的投融资经验。目前，智子银河技术团队近半数成员拥有博士学位，覆盖脑科学及认知神经等学科领域。</p>\n  <p>黄河龙提到，再次创业之所以选择布局脑机接口赛道，主要是基于行业前景、市场竞争格局、资源复用等因素的综合考量。首先，在政策层面，“脑机接口”不仅已被国家“十五五”规划中纳入六大未来产业之一，各地陆续设立脑机接口、脑科学专项基金；同时，国内多省都已设立脑机接口相关项目的政府指导价，为企业的临床应用及商业化提供关键支撑。</p>\n  <p>更重要的是，脑机接口在大众市场的认知度也已逐渐打开。“在马斯克、山姆·奥特曼等科技名人的带动下，脑机接口从严肃医疗场景走向大众消费市场的临界点已经到来。这也是我们选择非侵入式脑机接口技术路径、希望开发出更适合惠及大众的创新产品的初衷。”黄河龙表示。</p>\n  <p>在确定技术路径后，产品与场景选择变成为下一个关键环节。黄河龙介绍，结合团队以往的学术、从业经历，探索脑机接口应用于两性健康领域的潜在市场。而经期疼痛管理，正是团队选择的第一个应用场景，希望针对此开辟一条“脑机接口+消费级”的新路径。</p>\n  <p>其逻辑在于，人体存在一个“下丘脑-垂体-性腺轴（HPG轴）”生理结构，通过监测或调控该轴的活动，可结合脑机接口技术落地两性健康场景，如女性经期健康、产后抑郁，男性勃起功能障碍、早泄等。</p>\n  <p>“当前，这类问题的临床干预方式以激素类药物为主，往往存在个体差异大、潜在副作用（如情绪波动、长期用药依从性差等）等问题，缺乏非药物数字创新疗法，而市场对此类更安全、个性化的替代方案的需求已十分明确。”黄河龙介绍称。</p>\n  <p>基于这一判断，智子银河的首款产品选择从经前期综合征（PMS）这一女性经期健康场景切入。一项针对140个国家的23万名女性的调查称，八成以上的女性一生中至少出现过一次PMS症状。严重者甚至会出现抑郁、自杀倾向。</p>\n  <p>黄河龙解释，女性经期情绪波动与疼痛加剧的根源在于激素变化影响了脑部调控功能。具体而言，背外侧前额叶皮层（DLPFC）是大脑对情绪进行自上而下调控的核心区域，而初级运动皮层（M1）则参与疼痛信号的下行抑制通路。基于此，智子银河团队设计了一款智能发箍形态的产品UnaBand，精准靶向情绪与疼痛管理脑区。</p>\n  <p>据介绍，该产品融合了电、声、味三项均经过医学验证的技术：经颅电刺激在严肃医疗领域已有超过30年的应用历史，在特定参数下可用于辅助改善抑郁、疼痛、帕金森等症状；另有临床研究支持称，白噪音与粉噪音等声学干预具备缓解情绪与减轻疼痛的作用，而特定香氛可在一定程度上降低焦虑与烦躁。三者从不同机制协同作用，有望初步实现对经期情绪与疼痛问题的缓解。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260608/v2_731b8aea554b4b50babbda456b601e17@5930287_oswg350533oswg693oswg694_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：智子银河</p>\n  <p>“我们将UnaBand设计成发箍的形态，除了考虑到DLPFC和M1主要位于头部左前侧和顶部，适合通过头戴式设备进行干预。而且，发箍本身就是女性日常常用的饰品，贴合用户使用习惯，降低了接受门槛。此外，团队在工业设计上也投入了大量精力，采用多巴胺色系，兼顾科技感与颜值，让产品更像一款轻奢配饰而非医疗设备。”黄河龙表示。</p>\n  <p>今年5月，智子银河在美国硅谷正式发布UnaBand。目前，产品主要分为基础版与Pro版两个版本。两者的核心区别在于：基础版本仅具备电、声、味三种干预功能；而Pro版则在干预功能之外增加了EEG脑电采集能力，可实现用户脑电信号的实时采集、情绪与疼痛感知的量化监测，从而形成“采集-干预-反馈”的闭环调控体系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260608/v2_c10dd9dcbf7d43bb8f11a5d961f7798a@5930287_oswg570151oswg868oswg626_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：智子银河</p>\n  <p>在市场推广方面，智子银河计划采取线上线下联动、国内外同步推进的策略，其中海外市场将作为优先布局方向，产品预计于8月正式上市。产品整体定位于中高端市场，核心客群聚焦于中高收入都市女性；定价策略上，基础版本将与市面上同类脑机接口产品保持持平，以降低用户尝试门槛。</p>\n  <p>另据了解，从产品矩阵来看，女性经期健康只是智子银河的起点，非侵入式脑机接口产品后续将先拓展至减重、男性性功能改善两大场景；更长远的规划中，公司还将布局康复与银发市场，并与智能硬件生态企业合作，探索“脑机+AI”实现万物交互的可能性。</p>", "category": "tech", "published_at": "2026-06-09T01:00:00+00:00", "fetched_at": "2026-06-09T02:44:08.877257+00:00", "fingerprint": "76ce76555522ae0b"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | AI芯片处理器IP公司完成近亿元融资，核心团队来自Synopsys、ARM等顶尖半导体公司", "url": "https://36kr.com/p/3845293120621057?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，隼瞻科技有限公司（下称“隼瞻科技”）近日完成近亿元天使+轮融资。本轮融资引入英飞尼迪资本、白云金控、深圳中小担创投、厚天资本、华盖资本、嘉誉创投等多家战略投资人，老股东毅达资本、达泰资本持续加持。</p>\n  <p>隼瞻科技成立于2023年初，专注芯片处理器模块及开发平台，致力于打造基于“RISC-V+DSA”的新一代处理器设计体系，公司希望通过“IP货架+EDA工具链”的模式，降低AI时代定制化处理器设计门槛。</p>\n  <p>当前，AI模型快速垂直化，正在推动芯片产业从“通用计算”走向“专用计算”。</p>\n  <p>过去，以CPU为核心的架构长期主导芯片设计，但AI算法以大规模二维、三维矩阵运算为主，在传统CPU上的运行效率并不理想。行业也逐渐转向NPU、VPU、TPU等专用处理器协同的异构计算体系。</p>\n  <p>与此同时，AI模型的快速垂直化，也让芯片设计开始从“通用适配”走向“模型驱动”。</p>\n  <p>“过去很多算法都能直接跑在CPU上，但AI时代以后，不同场景、不同模型之间差异巨大。”隼瞻科技创始人曾轶表示，“客户越来越希望芯片能围绕自己的模型进行定制，从而在功耗、面积和成本之间找到最佳平衡。”</p>\n  <p>这也是DSA（领域专用架构）兴起的重要背景。</p>\n  <p><strong>DSA本质上是“让架构为模型服务”。相比传统通用处理器追求“大而全”，DSA更强调围绕具体算法和场景进行资源配置。</strong>例如，在AI推理场景中，客户可根据模型特点，自定义CPU、DSP、NPU等模块的算力占比，避免资源冗余。</p>\n  <p>而RISC-V，则被认为是DSA的重要底座。</p>\n  <p>曾轶介绍称，相较ARM等传统闭源架构，RISC-V具备开源、可扩展、可定制等天然优势，尤其适合AI时代快速变化的模型需求。</p>\n  <p>更重要的是，RISC-V能够为未来模型演进预留可编程空间。“AI模型变化非常快，如果底层架构无法灵活扩展，芯片生命周期会被迅速压缩。”曾轶表示。因此，隼瞻在架构设计中，会提前预留二维指令、函数空间以及后续可编程能力，以适应未来模型升级。</p>\n  <p>不过，DSA真正落地的核心难点，并不只是理念，而是工程化能力。</p>\n  <p>传统情况下，一个中等规模DSA处理器的开发，往往需要数十位工程师、耗时半年以上，且涉及复杂的软件工具链协同。尤其在多核异构环境下，不同处理器对应不同编译器与开发环境，工程复杂度极高。</p>\n  <p>因此，隼瞻科技从成立之初，就同步布局IP与EDA平台。</p>\n  <p>目前，公司已经形成完整RISC-V产品矩阵，包括CPU IP、DSP IP以及NPU IP。其中，其中多款处理器IP已经实现量产。</p>\n  <p><strong>与此同时，隼瞻自研的高度智能化的专用处理器设计平台ArchitStudio，可覆盖架构分析、处理器设计、RTL生成以及软件工具链自动生成等完整流程。</strong></p>\n  <p>该平台由多个核心引擎构成，覆盖架构分析、设计优化到自动生成的完整流程。例如，Archit Analyzer可分析客户算法在现有处理器上的运行瓶颈，并自动识别计算效率低下的算子；Archit Designer则允许开发者通过高层语言直接描述架构需求，无需手写底层RTL代码；最终，Archit Generator还能自动生成RTL、验证环境及完整软件工具链。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_fe26f604de9545618bfd4d9fb60763bd@5920579_oswg338483oswg1080oswg679_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ArchitStudio示意图（图源/企业）</p>\n  <p>目前，公司已在无线通信、多媒体处理、信息安全、工业控制、汽车电子与AI端侧等领域实现客户落地。</p>\n  <p>例如，在无线通信领域，公司为客户定制通信DSP；在信息安全领域，其帮助头部安全芯片厂商将核心安全算法融入DSA架构；在机器人方向，则已应用于机器人电机与灵巧手控制系统。</p>\n  <p>商业模式方面，隼瞻目前主要包括三类：标准化IP授权、整体DSA方案销售，以及更高层级的多核异构平台定制服务。</p>\n  <p>团队方面，隼瞻科技核心团队来自于Synopsys、ARM等国内外顶尖半导体设计公司，全栈覆盖研发、销售、技术支持等领域，团队在RISC-V、处理器架构和EDA方向具备长期的深厚积累。</p>\n  <p><strong>以下为硬氪与隼瞻科技创始人曾轶访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：为什么AI时代会推动DSA（领域专用架构）成为趋势？</strong></p>\n  <p><strong>曾轶：</strong>过去很多算法都能直接运行在CPU上，但AI时代以后，模型开始高度垂直化。不同场景、不同客户之间，模型结构差异非常大。如果继续使用传统通用架构，就会出现大量资源浪费。比如有些客户真正需要的是NPU算力，有些则更依赖DSP或者特定数据通路，但传统SoC往往是“大而全”的设计方式。</p>\n  <p>DSA本质上是“让架构为模型服务”。客户可以围绕自己的模型特点，决定CPU、DSP、NPU等模块的资源占比，从而在性能、功耗、面积和成本之间实现最优平衡。这也是为什么我们认为，AI时代的芯片设计，会逐渐从“通用芯片”转向“定制化架构”。</p>\n  <p><strong>硬氪：隼瞻为什么选择“RISC-V+DSA”这一路线？</strong></p>\n  <p><strong>曾轶：</strong>DSA天然需要一个高度开放、可扩展、可定制的底层架构，而RISC-V正好具备这些特点。相比传统闭源架构，RISC-V最大的优势在于指令集可扩展。客户可以根据自身模型需求，对处理器进行深度定制，包括专用指令、数据通路甚至调度方式。</p>\n  <p>尤其在AI场景里，很多性能瓶颈其实不在算力本身，而在数据搬运和调度效率。如果通过定制RISC-V指令集对NPU进行协同调度，效率提升可能是数十倍甚至百倍级别。</p>\n  <p>更重要的是，AI模型变化非常快。我们在设计时，也会提前预留后续可编程空间，让芯片能够适应未来模型迭代，而不是几年后就被淘汰。</p>\n  <p><strong>硬氪：隼瞻的核心壁垒是什么？</strong></p>\n  <p><strong>曾轶：</strong>很多公司是先做IP，再逐步补工具链，但这样往往会出现兼容性和协同效率问题。</p>\n  <p>我们从创业第一天开始，就是把IP和EDA平台一起规划的。所有CPU、DSP、NPU内核，都是基于自研工具开发出来的，因此工具链和架构之间能够实现深度协同。</p>\n  <p>此外，我们不仅仅提供标准IP，而是希望把DSA能力平台化。传统情况下，一个中等规模DSA处理器设计，可能需要30个人做30周。我们希望通过ArchitStudio，把它压缩到3个人、3周左右。本质上，我们是在降低定制化处理器设计门槛，让更多芯片公司具备过去只有大厂才拥有的能力。</p>", "category": "tech", "published_at": "2026-06-09T01:56:31+00:00", "fetched_at": "2026-06-09T02:44:08.877250+00:00", "fingerprint": "a2322574d2775c8e"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 国内唯一POD材料产业化团队再创业，布局3C与AI芯片散热，技术积累全球领先", "url": "https://36kr.com/p/3845295918909954?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，苏州墨锋新材料科技有限公司（下称“墨锋科技”）近日完成新一轮千万元融资，由险峰基金、成都科创投集团投资，资金将主要用于产线扩建与产能扩张。</p>\n  <p>墨锋科技成立于2023年，技术源自四川大学近20年高分子材料研究成果，聚焦高性能POD（聚芳噁二唑）薄膜产业化。</p>\n  <p>POD作为一种耐高温聚合物，早在上世纪六七十年代便受到关注，但由于加工成型过程中的工艺问题和设备腐蚀问题，产业化难度极高，相关研究一度长期停滞。</p>\n  <p>国内对于POD的系统性研究起步较晚，但进展迅速。2006年前后，四川大学徐建军教授团队开始持续推进POD材料研究；2008年，江苏宝德新材料采用四川大学相关技术建立POD纤维中试线，并于2011年实现量产，成为国内唯一实现POD纤维产业化的企业。</p>\n  <p>墨锋科技核心团队均来自四川大学徐建军教授课题组。公司创始人李文涛曾在江苏宝德新材料参与并主持POD纤维从小试、中试到量产及市场开拓的全过程，具备丰富产业化经验；联合创始人姜猛进则为四川大学高分子科学与工程学院教授，长期深耕POD高性能化研究。</p>\n  <p>在传统POD膜工艺中，第一代产品只能裁切成片后进行烧制，无法实现连续卷对卷烧制，导致装填量低、成本高、效率差；同时，石墨化后表面掉粉严重，也影响终端使用体验。</p>\n  <p>针对上述问题，墨锋科技通过优化成型工艺，提高材料模量与结晶度，使膜材刚性显著增强，可支持成卷烧制而不变形，大幅降低烧制成本。同时，材料致密性提升，有效减少内部缺陷与孔洞，显著改善掉粉问题，满足高端应用要求。</p>\n  <p><strong>目前，墨锋科技已量产的POD膜片产品性能处于行业领先水平。</strong>原膜力学性能好，初始膜量可达4.0GPa，拉伸强度大于200MPa，成膜厚度超过400μm，石墨化并压延后厚度最高可达200μm，可制备超厚规格产品；经下游客户验证，POD石墨膜热扩散系数大于1000mm(2)/s，产品石墨化后导热系数可达2000W/(m·K)。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_458d987c894d4f8f800f4ba688695d65@5920579_oswg457824oswg841oswg562_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>应用侧，墨锋科技目前采取“双轨布局”策略，以消费电子为基础市场，同步拓展AI芯片与光模块TIM材料领域，覆盖高增长、高附加值下游场景。</strong></p>\n  <p>消费电子领域，公司面向5G手机、折叠屏设备以及高性能笔记本等轻薄化趋势下的散热升级需求，提供石墨膜前驱体解决方案。对于手机和平板电脑散热膜产品而言，厚度与热性能是客户最关注的核心指标。墨锋科技可制备高导热性能的特厚、超厚规格产品，在热扩散能力及整体散热性能上均优于国内外竞争对手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_62175d5ba1c440f59aaf56166dd6885f@5920579_oswg174963oswg794oswg347_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在AI芯片及光模块TIM上游原膜材料领域，公司则通过高发泡产品加工后制备芯片导热界面材料，用于解决大功率、大面积芯片散热问题。</p>\n  <p><strong>据公司透露，目前多家头部手机厂商均表现出较强导入意愿，市场需求正在快速释放。</strong></p>\n  <p>现阶段公司年产能约为100吨，而单一订单规模已达到数十吨，为此，公司正在同时计划新增一条300~500吨/年的POD膜生产线。</p>\n  <p><strong>以下为硬氪与墨锋科技创始人李文涛访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：墨锋科技在POD膜产品制备上建立了哪些核心壁垒？</strong></p>\n  <p><strong>李文涛：</strong>POD膜产品的核心壁垒，主要集中在制膜溶液和膜片制备两个环节，这也是团队经过多年研发重点突破的方向。</p>\n  <p>其中，制膜溶液是整个POD膜制造过程中最核心、也最复杂的部分。它本质上是一套高度依赖工艺经验和流程控制的体系，需要对不同反应物的配比、投料顺序，以及各个反应节点的温度、压力进行精细控制，同时还需要加入特定的成膜辅助药剂。这里面涉及大量长期积累的know-how，也是墨锋最核心的配方和工艺能力。</p>\n  <p>在膜片制备环节，针对POD含酸膜片，墨锋通过持续攻关，形成了独特的“湿法单向扩散”工艺，能够提升凝固效率，并有效减少相分离过程中产生的缺陷。</p>\n  <p>墨锋还自主设计并建设了整套生产线，通过多道循环处理工艺，在提升水洗效率的同时，大幅降低废水产生量。后续加工过程中，公司独特的双拉工艺与热定型工艺能够进一步提升产品强度、模量等性能，同时减少石墨化环节中的掉粉、气泡等问题。</p>\n  <p><strong>硬氪：除3C外，为什么AI芯片领域也会特别强调POD这一材料？</strong></p>\n  <p><strong>李文涛：</strong>目前算力芯片的功耗和发热量都非常大。传统TIM材料如导热硅脂和导热凝胶的导热系数通常小于10W/(m·K)，已经很难满足AI芯片快速散热需求。</p>\n  <p>我们基于POD材料做出了新的导热泡沫方案，下游经过后道加工后，整体性能表现很好，初步已经可以达到石墨烯方案的水平。</p>\n  <p>石墨烯虽然也是一种热门散热方案，但成本相对较高，而且热扩散性能进一步提升的难度较大，目前通常做到900W/(m·K)左右就比较困难了。而我们的POD方案可以做到1000以上。</p>\n  <p>此外，PI材料无法烧制成兼具高导热和良好弹性的导热泡沫，烧出来会比较硬，难以应用于TIM材料场景；而POD则具备更好的可加工性和综合性能优势。</p>\n  <p><strong>硬氪：POD材料未来还可能应用在哪些领域？</strong></p>\n  <p><strong>李文涛：</strong>目前POD在3C和芯片领域，主要还是作为导热材料使用，核心价值来自后续石墨化加工后的性能表现。而我们第二代技术做出来的产品，取向度和结晶度更高，所以除了导热之外，它本身的力学性能也非常突出。</p>\n  <p>比如在航空航天领域，我们就看中了它高强度、轻量化的特性。现在航空航天和高铁领域广泛使用一种叫芳纶纸的蜂窝材料，用于减重和结构增强。我们在尝试用POD膜替代这类材料。相比纸基材料，POD膜重量更轻、强度更高，同时耐热性能也更好。我们已经和下游加工企业合作，把POD膜加工成蜂窝结构，测试下来整体性能表现非常不错。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_6704d9d4e73143379aa419dfdca98135@5920579_oswg182321oswg516oswg516_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>不过，这类新应用的开发周期会比较长，也需要持续投入。现阶段，我们还是会优先聚焦3C领域，先把已经能够快速落地的市场机会抓住。</p>", "category": "tech", "published_at": "2026-06-09T01:58:22+00:00", "fetched_at": "2026-06-09T02:44:08.877237+00:00", "fingerprint": "51209cb6805357bf"}, {"source": "少数派", "title": "少数派正版软件 + 付费教程 618 促销活动限时开启", "url": "https://sspai.com/post/110853", "summary": "又到了每年的618购物节，少数派照例为大家带来了众多优质正版软件和实用教程的大型活动专场。如果你有心仪的软件或者教程，都可以趁着优惠果断出手。TL;DR:活动时间：2025年6月8日（周一）至6月22 ...<a href=\"https://sspai.com/post/110853\" target=\"_blank\">查看全文</a>", "category": "tech",
