e Duo that's intended to illuminate your face during video calls. Apple previously said the iPhone Duo would add support for the Apple Pencil \"later this year.\" The company's first [&#8230;]", "category": "tech", "published_at": "2026-10-26T18:51:06+00:00", "fetched_at": "2026-10-27T03:27:58.207954+00:00", "fingerprint": "09c34956440a061d"}, {"source": "The Verge", "title": "Anthropic is burning gas to feed the AI boom", "url": "https://www.theverge.com/ai-artificial-intelligence/1018994/anthropic-ipo-ai-data-center-energy-climate-risk", "summary": "As it prepares to go public, Anthropic's S-1 filing makes generative AI's methane dependency glaringly obvious. \"Competition for access to electrical supply and data center locations with adequate power availability is intense.\" In documents filed with the US Securities and Exchange Commission Monday, Anthropic acknowledges that data centers are becoming increasingly reliant on \"natural gas\" [&#8230;]", "category": "tech", "published_at": "2026-10-26T21:45:31+00:00", "fetched_at": "2026-10-27T03:27:58.207948+00:00", "fingerprint": "092e8ceea2bd79fc"}, {"source": "The Verge", "title": "Samsung’s Switch 2-ready MicroSD Express card is on sale for less than $50", "url": "https://www.theverge.com/gadgets/1018962/samsung-p9-256gb-microsd-express-card-switch-2-deal-sale", "summary": "Running out of space on your Nintendo Switch 2? Thankfully, Samsung’s P9 MicroSD Express card is discounted at multiple retailers, with the 256GB version going for $47.99 (Amazon, B&#38;H Photo) and the 512GB version $99 (Amazon, B&#38;H Photo). The smaller card typically sells for around $80, and the larger option usually sells between $150 and [&#8230;]", "category": "tech", "published_at": "2026-10-26T21:56:36+00:00", "fetched_at": "2026-10-27T03:27:58.207941+00:00", "fingerprint": "39130e60f0587b76"}, {"source": "The Verge", "title": "OpenAI announces three big science discoveries and a new way to work with academics", "url": "https://www.theverge.com/ai-artificial-intelligence/1019143/openai-eth-kaseya-science-math-physics", "summary": "Less than a month after its mass release of hundreds of manuscripts that it said contained solutions to long-standing mathematics questions, OpenAI is back with three more \"major\" discoveries in math, computer science, and physics. What's different this time is the choice to have external experts that OpenAI describes as \"shepherds\" guiding the results in [&#8230;]", "category": "tech", "published_at": "2026-10-26T23:34:58+00:00", "fetched_at": "2026-10-27T03:27:58.207929+00:00", "fingerprint": "b555ce2afa55383d"}, {"source": "36氪 - 最新文章", "title": "有个业务问题，想找技术伙伴聊聊？WISE2026「世界咖啡·产业对接」征集需求中", "url": "https://36kr.com/p/4042414899270790?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_7c715ff2e68a492cbca3864a8a74be81@6301044_oswg207875oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>如果你有一个具体业务问题，想看看AI或具身智能能不能帮上忙，可以把问题带来，和技术团队坐下来聊聊。</p>\n  <h2><strong>有些技术问题，找懂行的人一起拆开看看</strong></h2>\n  <p>你大概有过这种时候。</p>\n  <p>公司里总有那么一个环节，明显不顺。可能是客服，工单越堆越多，人手排不开；可能是质检，常年靠人眼盯着，慢，还容易漏；可能是仓库，搬运全靠排班，旺季一忙就打架；也可能是门店，导览、服务这类活儿，人手总是紧巴巴的。</p>\n  <p>你清楚哪里有问题。你也刷到过不少AI和机器人的消息，看过不少大佬的直播，收藏夹里是盘包浆的“某某行业落地案例”。但真到要往前走一步的时候，心头卡着的其实一直是三个很基础的问题：</p>\n  <p>我这情况，到底适不适合用这类技术？得先准备什么？靠谱的人，上哪儿找去？</p>\n  <p>你可能看过不少方案，但最想确认的还是：它能不能用在我们这个具体环节？</p>\n  <p>所以今年，我们在WISE里开了家“咖啡厅”，专门用来聊这个。</p>\n  <h2><strong>我们在WISE2026，留了几张桌子</strong></h2>\n  <p>正式官宣一下这件事。</p>\n  <p>11月26–28日，WISE2026商业之王大会主议程之外，我们再次把“世界咖啡·产业对接”搭了起来——围绕具体业务需求，安排和技术方的定向交流——同时，它与大会同期成立的具身智能产业联盟相衔接，重点方向聚焦AI应用和具身智能。（联盟成员详见文章结尾）</p>\n  <p>在这里，我们只做一件事：把带着问题的企业，和可能解决这个问题的企业，安排在同一张桌子上，聊一个具体的问题。</p>\n  <p>逻辑也很简单：场景需求方当“桌长”，固定坐在一张桌子前，把真实痛点摆上桌；技术方带着方案上门，按排好的日程挨桌轮转，一轮一轮聊。</p>\n  <p>这套形式也不是36氪第一次跑。今年的北京亦庄AI+产业对接会、上海出海大会产业对接会，都是从“收集真问题”开始的。今年两轮世界咖啡产业对接会，<strong>收获高意向企业190余家，正式申报企业153家，累计超过100轮对接</strong>，每一次都提前两个月开始筹备，我们<strong>不做随机匹配</strong>，每一轮都提前交叉验证。（下图是36氪制作的需求匹配意向图）</p>\n  <p><strong>这一次规模更大、覆盖更广，但起点没变：从你手上的问题开始。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_ae65a7f8f6534b5081bc7a76d6f9c5b3@6301044_oswg67614oswg496oswg494_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪制作的需求匹配意向图</p>\n  <h2><strong>一杯咖啡的时间，讲究的是先对好眼神再上桌</strong></h2>\n  <p>你可能会问：这跟我去展会逛一圈，有什么不一样？</p>\n  <p>逛展会多半是这样的：你自己找人、自己判断、自己琢磨对方的东西跟你的业务对不对得上。</p>\n  <p>一场展会里，大概要把七成的力气花在“找到谁”上，剩下三成才是“聊事儿”。而真正难的是后者。</p>\n  <p>所以，WISE2026世界咖啡不是想找个时间，在线下交换名片，而是<strong>根据你的需求匹配相应的技术解决方</strong>，在现场直接高效沟通下一步应该怎么走！</p>\n  <p>没错，现场20分钟的对接，我们从现在就开始准备。</p>\n  <p><strong>会前就有准备。</strong>你先把业务问题提交上来——现在怎么做的、卡在哪儿、希望变成什么样。我们做审核和必要的核实，整理成一份说得清楚的摘要。坐到你对面的人，来之前已经看过你的情况，也想过自己能不能接。这样你们见面那二十几分钟，不用花在自我介绍上，可以直接进入“你这个条件下行不行”。</p>\n  <p><strong>对象是约好的，不是开盲盒。</strong>双向确认意愿之后，才会排进日程：你看对方的资料，觉得“愿意聊”；对方看你的问题，觉得“能接”。两头都点头，这场才算排上。到了现场就是预约制、一对一、按桌按点坐下。</p>\n  <p><strong>聊完，不代表结束。</strong>现场我们搭了一面“需求墙”，你的需求、你想解决的问题都会展示在上面，更多带着解决方案的技术方也看得见。当时没轮上聊的、没聊透的，也不急——会后我们回收反馈、接着跟进，把没接上的头给你续上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_578f9c1a271c421b9c4f41aced7a43c9@6301044_oswg93774oswg1080oswg630_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>简单说，我们把“找人”这段路提前走完了，好让现场那点时间，都用来聊事儿。</p>\n  <h2><strong>在这儿能聊什么？举个例子</strong></h2>\n  <p>今年的重点方向聚焦两个——<strong>AI应用和具身智能。</strong></p>\n  <p>之所以是这两个方向，跟眼下的时间点有关。今年这两件事都在从演示走向产线：机器人不再只在展台上做动作，而是在工厂里真的开始干活了。这个阶段的经验是最值钱的，因为第一批跑通的和第一批踩坑的，几乎同时在出现——谁在哪些环节上栽过、哪些条件看着不起眼其实很麻烦，这些话在通稿里读不到，只在一对一的桌上讲得出来。</p>\n  <p>简单举一些场景。</p>\n  <p>偏AI应用的，比如客服和工单的响应、内部知识和文档的检索、质量数据的分析和异常判断，还有流程里那些反复出现的人工环节。</p>\n  <p>偏具身智能的，比如工厂和仓库里的搬运、作业辅助，商业空间里的导览、配送、巡检。等等。</p>\n  <p>这些只是冰山一角。只要你手上有个问题，环境说得清、任务说得清、限制条件也说得出，就可以提交报名，来现场找到机会。</p>\n  <h2><strong>没想清楚用什么技术？那我们更呼唤你</strong></h2>\n  <p>之前我们对接场景方时，被问到最多的顾虑是这个：“我这问题还没想清楚能不能用AI，交上去会不会太外行？”</p>\n  <p>答案是，完全不会。</p>\n  <p>在这里，你只需要负责把业务问题讲清楚——这个环节现在是怎么运转的，卡在哪一步，你们想达到的效果是什么？而关于技术那部分，可以在交流中和技术方一起探讨，现成的方案是否适配、还需要哪些条件……</p>\n  <p>当然了，为了交流更高效，我们建议由熟悉这块业务、能讲清具体情况，并能参与后续讨论或协调的同事，来到我们现场。这样聊出来的结论，才更容易带回团队继续推进。</p>\n  <h2><strong>喝完咖啡能带走什么，我们把话说在前面</strong></h2>\n  <p>如果现场聊得顺，你能带走的东西有希望很具体：</p>\n  <p>1、一个更清楚的判断，知道这个问题到底要朝什么方向解决；</p>\n  <p>2、一份落地要具备的条件清单，数据、环境、流程、人员、预算大概要准备什么；</p>\n  <p>3、一两个可能适配的技术伙伴，以及后续沟通的基础；</p>\n  <p>4、还有一个明确的下一步，是继续验证、去做考察，还是先放一放。</p>\n  <p>当然，活动提供的是交流与连接的机会，不保证采购、试点或成交结果。具体的技术可行性、产品效果、合作条件，由参与企业自己沟通判断。</p>\n  <p>36氪负责<strong>组织、审核、匹配和协调</strong>。案例如用于公开传播，需事先经企业确认，不保证每家企业获得报道或曝光。<strong>双方免费报名</strong>，但报名或审核通过不等于获得预约席位。</p>\n  <p>还有一种情况是现场没聊透。放心！这趟也不会白来——双方留下联系方式，继续约时间。一杯咖啡的时间，能把边界聊清楚，这件事和当场聊出合作意向一样有价值。</p>\n  <h2><strong>都说到这儿了，先报名吧！</strong></h2>\n  <p>如果你读到这里，脑子里已经浮现出某一个具体的环节、某一类反复出现的事，那就是可以写下来的东西。不用包装，不用拔高。就用你们组里平时说话的口气写：现在是怎么干的，毛病出在哪儿，你想让它变成什么样。</p>\n  <p>写下来的那一刻，这件事就已经往前走了半步。剩下的半步，交给我们，也交给那张桌子对面的伙伴。</p>\n  <p>现在来报名吧，识别文末的二维码就行，接下来你只需要：</p>\n  <p><strong>提交信息。</strong>写下你的业务问题——现状、困难、希望改善的结果，顺便说一下哪些时间确定来不了。</p>\n  <p>接下来的工作我们来做：</p>\n  <p><strong>36氪审核。</strong>报名截止后集中审核，场景方看业务需求是不是具体、真实，技术方看方案成熟度和可落地的案例，同时兼顾整体的数量平衡。</p>\n  <p><strong>36氪进行双向匹配。</strong>通过审核的场景方进入需求清单，技术方进入匹配资源池，双方可以互相查看信息、标记意向对接对象。</p>\n  <p><strong>36氪与你一起确认日程。</strong>我们结合两边的意向，排出一张现场对接的时间表，同步参会指南。两个环节都确认了，这场参与安排才算落实。</p>\n  <p><strong>最后，现场交流加会后跟进。</strong>按预约签到、到桌交流、归纳下一步，会后回收反馈，继续跟进。</p>\n  <p>桌子正在摆了，咖啡也在萃取。你的问题，值得在这里被正经聊一次。</p>\n  <p>WISE2026商业大会·世界咖啡，等你的问题，也等你的名字。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_72c3e04f459240bf81cff89667bba80a@6301044_oswg109045oswg1080oswg540_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（本次招募设置两条独立报名通道，请选择对应的二维码报名，错误通道提交的报名信息可能会影响后续审核）</p>\n  <p>特别说明：报名或审核通过不等于获得预约席位；活动提供交流与连接机会，不保证采购、试点或成交结果。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_071d9d1d50ee4c3e94a81c01d20af8fd@6301044_oswg378079oswg1080oswg2830_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">本次对接会与同期成立的“具身智能产业联盟”相衔接���图中为首批加入联盟的企业</p>", "category": "tech", "published_at": "2026-10-26T07:59:36+00:00", "fetched_at": "2026-10-27T03:27:58.133405+00:00", "fingerprint": "4eaaab144cbb99a8"}, {"source": "36氪 - 最新文章", "title": "这场年轻人的咖啡局，聊聊「咖啡+AI」可以长出什么？", "url": "https://36kr.com/p/4042455475475586?f=rss", "summary": "<p>城市节奏越快，咖啡越像年轻人的“日常开关”。白天靠咖啡续命，周末咖啡店是见面、拍照、遛猫、带娃、逛市集的空间。</p>\n  <p>“日咖夜酒”“奶茶咖啡化”之外，咖啡消费还在长出更多新组合：咖啡+烘焙、咖啡+宠物、咖啡+博物馆、咖啡+市集、咖啡+文创。有人用9.9元完成日常摄入，也有人愿意为一杯手冲排半小时队。</p>\n  <p>咖啡越来越日常，但年轻人对咖啡的期待并不日常。精致的线上内容决定他们走进哪家店，线下场景的消费体验决定他们愿意待多久、下次还来不来。</p>\n  <p>不同的咖啡线下场景也在寻找自己的生存方式：社区咖啡嵌入生活半径，靠熟客和日常习惯形成复访；主题猫咖把宠物社交和情绪价值装进空间；博物馆、科技馆里的“科普咖啡厅”，成为科普体验和博物馆IP文创的载体；咖啡节则把咖啡、艺术、市集和青年文化聚在一起，短时间内制造城市话题和目的性到访。</p>\n  <p>以一杯咖啡为起点，走过六年时光，<strong>由浙江云创蔚来集团主办的宁波咖啡生活周IP精彩延续，上半年的活动已落地集盒广场，下半年的特别加场——“风从西南来”系列活动将于10月30日-11月1日在云创浙理青年国度举办。</strong>活动集合市集、青年共创与非遗体验，把咖啡、美食、艺术揉进城市日常。无数主理人与品牌在此相逢，把咖啡的烟火播种在甬城街巷，从本土出发向外生长，成为长三角土地上独一份的咖啡文旅印记。</p>\n  <p>从咖啡豆到一杯咖啡，从一次线上分享到线下打卡，一杯咖啡的消费行为背后，是一整条产业链的迭代进化，也是线下实体场景与线上数字营销的互动创新。</p>\n  <p>咖啡消费正在呈现两条并行的趋势：一边是平价化、日常化，咖啡成为高频刚需；一边是体验化、内容化，主理人店、社区店、宠物友好店、博物馆咖啡、咖啡节市集不断制造“非喝不可”的理由。对街区来说，真正需要的也不只是多一家咖啡店，而是能带来新体验、新客流、可传播、可复访的消费新业态。</p>\n  <p>与此同时，AI正在进入咖啡产业链。智能点单、无人咖啡零售、AI咖啡师、咖啡机器人运维、AI烘焙……被重构的不只是出品效率，还有岗位能力、培训体系和青年就业方向。AI不是只来抢咖啡师的拉花缸，它催生新工种：谁来运维咖啡机器人？谁来设计AI烘焙曲线？谁来培训既懂咖啡又懂设备的新人？这些问题，已经从概念走进门店和课堂。</p>\n  <p>10月31日（周六）下午，宁波首南街道云创浙理青年国度将举办“AiPartner带着Ai上前线——宁波咖啡生活周场景创新交流会”。</p>\n  <p>活动由鄞州区发展和改革局指导，首南街道办事处、36氪、云创蔚来集团联合主办，宁波诺丁汉大学李达三孵化园协办。活动定位为咖啡节中的场景创新产业交流环节，<strong>围绕消费和人才培训两大方向，挖掘场景创新机会，推动新技术、新产品在云创浙理青年国度及首南街道落地</strong>。</p>\n  <p>消费升级与青年就业，是这场场景挖掘的两个出发点。现场采用“双圆桌”形式，两场圆桌，一场聊“人”，一场聊“场”：</p>\n  <p>圆桌一聚焦<strong>「AI+咖啡全产业链新职业人才培养」——</strong></p>\n  <ul>\n   <li>AI进入咖啡产业链后，整条链上哪些环节被重构、哪些能力出现缺口？</li>\n   <li>AI与咖啡结合后，传统咖啡师的角色会怎么变？</li>\n   <li>AI咖啡师、咖啡机器人运维、AI烘焙等新工种如何定义能力模型？</li>\n  </ul>\n  <p>从课堂到咖啡机器人实训，我们邀请到美刻AI项目发起人姚锦程、宁波勇诚资产管理有限公司投资总监梁相炳、陆汇集团CIO常潞，希望把“AI+咖啡”的人才培养从概念推到可操作的课程和岗位。</p>\n  <p>云创4万方商业街、青年夜市和创业集市正在寻找智能咖啡零售、博物馆IP联名、人宠友��等数字消费新业态，以“AI咖啡师”体验专区为切口，形成“AI体验—消费转化—商户引流”的链路，让本地主理人与技术方现场对接。</p>\n  <p>圆桌二聚焦<strong>「青年数字消费场景与街区活力提升」，</strong>我们将与亦瀚文化合伙人吕佳凯、众乐乐咖啡艺术节创始人陈智、Daily Coffee主理人许家木、LeBRESSO主理人袁剑峰一同探讨——</p>\n  <ul>\n   <li>AI咖啡和咖啡新业态在哪些真实场景里落地？</li>\n   <li>在咖啡之外，数字平台的内容对咖啡店客流有什么影响？</li>\n   <li>从“打卡”到“常客”，主理人靠什么形成品牌持续消费人气？</li>\n   <li>一个街区场景里，不同的“内容物种”如何共同打造有生命力的青年消费生态？</li>\n  </ul>\n  <p>我们希望这场交流活动更像一个“场景实验室”，这个秋天的周末午后，不谈宏大叙事，放下FOMO情绪，一边喝咖啡、听主理人聊街区，一边看机器人做咖啡，让设备方、培训方、街区运营方碰一碰，看看哪些新业态能真正落下来。</p>\n  <p>让一杯咖啡，成为连接青年、产业与街区的“轻切口”，就够了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_88d48ac079f648129e63cd98c5dad16b@6340959_oswg4304375oswg4500oswg7200_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-10-26T09:43:46+00:00", "fetched_at": "2026-10-27T03:27:58.133399+00:00", "fingerprint": "b5f7c429deddf7e9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨Anthropic正式提交IPO申请；寿司郎传送带被曝窜出活老鼠；苹果客服称很多客户取消iPhone Duo订单", "url": "https://36kr.com/p/4043364384707456?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Kimi致歉：将为会员提供重置机会</li>\n   <li>马斯克宣布X长按点赞可向对方转账1美元</li>\n   <li>微软向约6万名员工开放自愿离职方案，AI巨额投入挤压人力预算</li>\n   <li>中国石油午后涨近4%，创2008年5月以来新高</li>\n   <li>科学家展示全球首款织进衣服的触摸屏</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>Anthropic正式提交IPO申请</strong></p>\n  <p>10月26日，Anthropic正式提交纳斯达克IPO申请，股票代码定为“ANT”。Anthropic上半年营收163亿美元，去年同期为12亿美元；上半年净亏损807亿美元。</p>\n  <p>Anthropic在招股书中披露，公司与多家科技企业签订大额算力及基础设施协议，相关支出承诺延伸至2036年。其中，公司承诺2026年4月至2033年7月向谷歌至少支出约1145亿美元；2026年5月至2036年4月向亚马逊至少支出1100亿美元；2026年11月至2033年5月向微软至少支出449亿美元，相关承诺原则上不因实际使用量减少而取消，特定违约等情形除外。（界面新闻）</p>\n  <p><strong>寿司郎传送带被曝窜出活老鼠</strong></p>\n  <p>10月25日，有网友爆料称，其10月24日在寿司郎一门店就餐时，发现传送带上出现一只老鼠，但因老鼠移动速度较快，未能拍摄到画面。该帖子爆料人称，发现老鼠后，其与经理进行了沟通，经理仅协商免单，并未提出其他赔偿方案；其索要消费凭据及就餐监控的请求遭经理拒绝。经理称，乘客日后若发现身体不适，可前往医院检查，并通过第三方机构鉴定后处理。</p>\n  <p>10月25日，记者拨打涉事门店电话，工作人员表示，消杀公司已于10月24日对门店进行全面核查，未发现老鼠踪迹。目前已对全门店进行了消杀，并对当天全部食材进行处理。至于老鼠的来源，工作人员称尚不清楚。关于赔偿问题，工作人员表示，可添加该店微信，提供当日就餐小票后予以协商。记者查询美团、大众点评，该门店已显示暂停营业，但记者10月25日从该涉事门店工作人员处获悉，其24日闭店，现已正常营业。（海报新闻）</p>\n  <p><strong>苹果客服称很多客户取消iPhone Duo订单</strong></p>\n  <p>10月25日，苹果首款折叠屏手机iPhone Duo正式发售仅两天，部分渠道的价格已经跌破官方定价。虽然苹果官网部分订单的预计交付时间仍排到2027年1月，但线下经销商已出现低于原价的现货报价。还有消费者通过地方补贴，以15499元买到了原价15999元的256GB版本。</p>\n  <p>针对“部分渠道iPhoneDuo破发”的情况，26日，苹果官方客服人员回应称：“第三方经销商退换货政策不一定和苹果官网一致，苹果官方渠道是支持14天无理由退换货。第三方渠道可能有平台补贴或者店铺优惠，苹果官网价格更稳定。”“有的第三方货源足但是买的人少也可能导致降价。”客服称。</p>\n  <p>上述客服还补充道，“有的客户订单显示等待时间比较长，但后续收货时间可能会提前，比如增加产能或者前面排队的客户取消订单，目前很多客户取消了订单。”（中新经纬）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Kimi致歉：将为会员提供重置机会</strong></p>\n  <p>10月26日凌晨，Kimi智能助手发文：对于近期Kimi会员使用K3.1 Pro时出现的限流及不必要的额度消耗，向大家致歉。今天，公司会为所有档位的订阅会员进行一次重置：所有有效期内的会员都将获得月度总额的25%作为补偿，相当于一周的用量。如果当前用量不足月度总额的25%，将重置为0。用量进度条会在今天结束前显示调整结果。同时，已调整配置，并正在减少不必要的子Agent调用和输出长度，让同样的额度完成更多实际任务。(上海证券报)&nbsp;</p>\n  <p><strong>灵快科技发布Botnow 3.0</strong></p>\n  <p>36氪获悉，灵快科技发布智能体平台Botnow 3.0。核心能力包括：Agent可自主拆解步骤并执行任务，支持人工在关键节点介入审批，并通过Skill技能包、MCP连接器接入企业原有系统与流程等。</p>\n  <p><strong>Acrab与端脑科技达成战略合作</strong></p>\n  <p>36氪获悉，端脑科技与Acrab近日达成战略合作。端脑科技输出AI NPC一体机、智能体软件与终端落地经验，Acrab提供AI芯片、操作系统、工具链等端侧计算底座，共同推进AI NPC在个人终端场景落地。本次合作将聚焦平台适配、硬件集成、多模态模型与Agent运行优化，打通从底层芯片、模型智能体到终端应用的完整链路，构建端侧AI能力闭环。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>马斯克宣布X长按点赞可向对方转账1美元</strong></p>\n  <p>25日，马斯克在X平台发文宣布：将为“长按点赞”操作加入转账1美元（约合 6.7 元人民币）功能，有关交易将会经由X Money完成。不过，马斯克暂未透露这一功能的上线日期。</p>\n  <p>据悉，X Money于7月下旬正式在美国上线，面向 Premium 和 Premium+ 订阅用户全量开放。X Money将账户存款、点对点转账以及Visa借记卡功能整合在X应用内。用户可在X内即时向他人汇款、收款或请求收款，无手续费和限额。随后在今年9月，X平台宣布，美国地区创作者从“原创内容奖励计划”和创作者订阅获得的收益，今后统一通过其支付服务X Money发放。（IT之家）</p>\n  <p><strong>宇树科技7天大涨超60%</strong></p>\n  <p>26日，A股人形机器人龙头宇树科技开盘后快速拉升，盘中涨幅一度突破8%；截至收盘，该股涨7.69%，报672元/股，总市值重回2700亿元以上。值得一提的是，自10月16日起的7个交易日，该股累计涨幅已超60%。（财联社）&nbsp;</p>\n  <p><strong>微软向约6万名员工开放自愿离职方案，AI巨额投入挤压人力预算</strong></p>\n  <p>全球最大软件公司微软当地时间10月26日表示，将向约6万名员工提供自愿离职补偿方案，以削减成本，并为迎接AI时代调整人员结构。符合条件的员工超过其员工总数的四分之一。微软发言人称，美国、加拿大、印度和英国的部分副总裁及以下级别员工具备申请资格，接受方案者将获得与标准遣散方案相近的待遇。不过，并非所有业务线都在适用之列。据知情人士透露，Xbox、Windows、Copilot及财务等部门将全面参与此次计划，而从事数据中心、销售、市场营销、网络安全和量子计算等工作的部分员工则不具备资格。(财联社)</p>\n  <p><strong>多所高校将通过数字人民币发工资</strong></p>\n  <p>近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。扬州大学、南通大学和江苏师范大学均发布了相关通知，通知教职工完成数币钱包的开立与升级。（南方日报）</p>\n  <p><strong>中国石油午后涨近4%，创2008年5月以来新高</strong></p>\n  <p>油气板块日内震荡回升，中国石油涨近4%，创2008年5月以来新高，A+H股总市值站上2.3万亿，中海油服、海油工程、海油发展、中国海油均涨超3%。消息面上，欧洲天然气价格升至2022年以来的最高水平。此前挪威天然气运输系统运营商Gassco宣布，Troll气田在10月25日至26日期间发生非计划停运，影响规模为610万立方米/日。（财联社）</p>\n  <p><strong>国内首部AI电影4天票房仅119万元，平均1场仅两个人看</strong></p>\n  <p>10月23日，《三星堆：未来往事》正式登陆全国院线。猫眼专业版显示，截至10月26日午间，这部100分钟的电影累计综合票房119.2万元，26日排片8469场，上座率0.1%，场均人次0.1人。而根据猫眼专业版，《三星堆：未来往事》24日、25日场均日次均为2人。而其制作方博纳影业（SZ001330）此前曾在9月28日、10月9日、10月12日三个交易日涨停，不过，10月26日博纳影业盘中跌停，截至当日收盘，跌幅为10.06%，每股报5.54元，总市值76.14亿元。（每日经济新闻）</p>\n  <p><strong>SpaceX拟与阿波罗全球管理公司达成约400亿美元GPU设备融资租赁协议</strong></p>\n  <p>SpaceX披露，公司于当地时间10月24日与阿波罗全球管理公司旗下实体签署具有约束力的承诺函，计划通过主融资租赁协议租赁GPU计算设备及相关设施，用于公司选定的数据中心。相关协议预计于2026年底前完成签署，设备预计自2027年上半年起分批交付。根据披露，各批次租赁期限约为5年至5.25年，租金按季度预付。SpaceX预计，各租赁安排期限内的本金支付总额约为400亿美元。(界面新闻)</p>\n  <p><strong>快手旗下可灵AI增资至约8744.7万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，可灵AI关联公司北京可灵智能科技有限公司发生工商变更，新增腾讯旗下上海启善投资有限公司、杭州阿里云飞天信息技术有限公司、北京百度网讯科技有限公司、国家人工智能产业投资基金合伙企业（有限合伙）等为股东，同时，注册资本由约7192.4万元人民币增至约8744.7万元人民币，增幅约22%。北京可灵智能科技有限公司成立于2020年8月，法定代表人为盖坤，经营范围包括计算机系统服务、软件开发、货物进出口等，现由福创科技有限公司、盖坤及上述新增股东等共同持股。</p>\n  <p><strong>AI行情降温，海力士相关杠杆基金将在美国退市</strong></p>\n  <p>两只挂钩SK海力士的杠杆交易所交易基金，在美上市仅数月后就将进行清算退市，当前市场对AI交易的投资热情正逐步降温。这两只由Tradr ETFs发行的多空产品，分别为交易者提供该韩国芯片制造商美国存托凭证（ADR）两倍的日涨跌幅杠杆、以及两倍的反向日收益。该ETF发行商在声明中表示，两只基金都将于11月12日前后完成清算。（财联社）</p>\n  <p><strong>三星计划借助AI缩短芯片材料研发周期</strong></p>\n  <p>三星电子表示，计划利用人工智能技术，将新型半导体材料的研发耗时缩短3年。该公司在韩国产业协会论坛举办的一场研讨会上公布了这一目标，会议围绕人工智能在工业研发（R&amp;D）中的应用展开讨论。三星高级技术研究院负责人Choi Young-sang在论坛上称：“我们计划依托AI，把新型半导体材料的研发周期从5年压缩至2年，同时把筛选出的有潜力候选材料数量提升5倍以上。”（新浪财经）</p>\n  <p><strong>三星和SK海力士将于明年Q2量产并交付HBM4供应给英伟达</strong></p>\n  <p>据媒体报道，三星电子和SK海力士已将供应英伟达的8层HBM4的量产和出货时间定在明年第二季度左右。一位知情人士表示：“据我了解，英伟达将根据基于Rubin Ultra的NVL机架规模，同时配备8层HBM4。虽然12层HBM4仍将是今年的主要重点，但从明年年中开始，8层HBM4的比例将显著增加。”（财联社）</p>\n  <p><strong>Meta公司将通过普通股和优先股发行筹集约350亿美元资金</strong></p>\n  <p>META将同时通过远期销售协议发行约225亿美元的A类普通股并发行约125亿美元的存托股份。META将发行最多2.5亿份A系列存托股份，英伟达、AMD、博通将购买最多50亿美元的A类股票。（财联社）</p>\n  <p><strong>未来车辆将被强制安装C-V2X？知情人士称“相关部门已启动强标制定工作”</strong></p>\n  <p>“相关部门已经在推动车辆安装C-V2X（蜂窝车联网）的强标制定工作。相关工作组已经成立，有几十家单位已经参与进来了。”日前，一位不愿透露姓名的C-V2X领域从业者透露。据了解，营运车辆已被率先要求安装C-V2X。中信科智联科技有限公司副总经理范炬认为，在相关政策法规的进一步推动下，中国C-V2X产业将跨越“试点示范”的鸿沟，进入爆发式增长的新阶段。（每日经济新闻）</p>\n  <p><strong>马斯克：SpaceX为GPU采购敲定400亿美元债务融资</strong></p>\n  <p>北京时间10月26日凌晨，埃隆·马斯克在社交平台发文表示：过去这几周，债市几乎彻底关上了大门——任何公司，只要没有独立于AI数据中心的大规模收入，基本都拿不到钱了。SpaceX刚为GPU敲定了400亿美元的债务融资，但我们是投资级信用评级，而且有Starlink和发射业务带来的收入。这意味着，那200多家“新型云厂商”要迎来孔雀鱼级别的批量死亡和整合了。会有一些撑过去，但不会多。这笔资金主要是可赎回债务，用于采购将在明年第一季度和第二季度到货的GPU。（界面新闻）</p>\n  <p><strong>新易盛：三季度产量环比增长，高速率产品放量提速</strong></p>\n  <p>从新易盛方面获悉，公司第三季度产品产量较第二季度保持增长，业务交付规模进一步提升。新易盛此前在投资者交流中表示，800G光模块出货量持续提升，已成为今年交付主力；1.6T产品也已进入持续放量阶段，预计下半年放量节奏将进一步加快。随着高速率产品需求持续释放，公司产品交付规模有望稳步提升。（证券时报）</p>\n  <p><strong>长鑫科技旗下芯聚股权投资公司增资至约63.8亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，长鑫芯聚股权投资（安徽）有限公司发生工商变更，注册资本由约61.8亿元人民币增至约63.8亿元人民币。值得一提的是，今年7月和9月，该公司均发生增资。该公司成立于2022年3月，法定代表人为赵纶，经营范围为以自有资金从事投资活动、创业投资，由长鑫科技集团股份有限公司全资持股。</p>\n  <p><strong>字节跳动TikTok电商欧洲负责人陈熙即将离职</strong></p>\n  <p>字节跳动TikTok电商负责人陈熙（Kevin）即将离职，TikTok欧洲、英国区域整体业务后续由宋琪负责。据悉，陈熙此前曾担任滴滴网约车业务执行总裁，2020年末加入字节跳动。（新浪财经）</p>\n  <p><strong>苹果发布新款iPad mini</strong></p>\n  <p>苹果公司发布新款iPad mini，配备8.5英寸OLED显示屏和A20 Pro芯片，机身厚度仅5.4毫米，并支持IP67级抗水防尘。苹果称，新款设备的AI性能最高提升至前代的4.5倍，图形性能最高提升至2.7倍，蜂窝网络数据传输速度最高提升50%。（财联社）</p>\n  <p><strong>小鹏Robotaxi获批L4级示范运营资质</strong></p>\n  <p>36氪获悉，近日，小鹏集团获批广州市智能网联汽车应用示范运营资格，可在广州全域开展L4级Robotaxi示范运营。</p>\n  <p><strong>寒武纪获资金净流入13.02亿元</strong></p>\n  <p>Choice数据显示，10月26日，资金净流入额排名前十的个股依次是寒武纪、胜宏科技、长鑫科技、万向钱潮、百亚股份、沐曦股份-U、中国石油、模塑科技、瑞芯微、亿纬锂能。其中，寒武纪获净流入13.02亿元。(上海证券报)</p>\n  <p><strong>恒指收盘涨0.51%，半导体板块领跌</strong></p>\n  <p>36氪获悉，恒指收盘涨0.51%，恒生科技跌0.36%；半导体、有色金属、硬件设备板块领跌，长飞光纤光缆跌超8%，兆易创新、紫金矿业跌超5%；石油石化、煤炭、房地产板块涨幅居前，恒大物业涨超12%，中国石油股份涨超5%，中国神华涨超2%；南向资金净卖出20.75亿港元。</p>\n  <p><strong>日本前首相福田康夫去世</strong></p>\n  <p>日本前首相福田康夫于10月22日在东京的医院去世。福田康夫于2007年就任日本首相，任期约一年。在任期间，他致力于维护和稳定日中关系。（央视新闻）</p>\n  <p><strong>国家能源局：截至9月底，全国累计发电装机容量41.3亿千瓦，同比增长11.2%</strong></p>\n  <p>36氪获悉，国家能源局发布1-9月份全国电力统计数据。截至9月底，全国累计发电装机容量41.3亿千瓦，同比增长11.2%。其中，太阳能发电装机容量13.1亿千瓦，同比增长16.5%；风电装机容量7.0亿千瓦，同比增长20.4%。1-9月份，全国发电设备累计平均利用2174小时，比上年同期降低194小时。</p>\n  <p><strong>康师傅重庆公司新增发电业务等</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，康师傅（重庆）方便食品有限公司发生工商变更，经营范围新增发电业务、输电业务、供（配）电业务，以及光伏发电设备租赁、粮食加工食品生产、食品添加剂销售等。该公司成立于2006年5月，法定代表人为谭莉，注册资本500万美元，由康师傅方便面投资（中国）有限公司全资持股。</p>\n  <p><strong>ETF收盘：地产ETF华宝涨3.85% 巴西ETF易方达跌10.02%</strong></p>\n  <p>ETF收盘涨跌不一，地产ETF华宝(159707)领涨3.85%，石油ETF广发(159018)涨3.79%，石油ETF鹏华(159697)涨3.54%，巴西ETF易方达(520870)领跌10.02%，巴西ETF华夏(159100)��10.01%，半导体设备ETF国泰(159516)跌5.74%。(上海证券报)</p>\n  <h2>大公司财报</h2>\n  <p><strong>药明康德:第三季度归母净利润为83.18亿元，同比增长136.67%</strong></p>\n  <p>36氪获悉，药明康德公告，第三季度实现营收166.40亿元，同比增长38.01%;归母净利润为83.18亿元，同比增长136.67%。前三季度实现营收455.37亿元，同比增长38.59%;归母净利润193.98亿元，同比增长60.64%。</p>\n  <p><strong>蓝色光标：第三季度归母净利润9545.37万元，同比下降3.81%</strong></p>\n  <p>36氪获悉，蓝色光标公告，第三季度实现营收185.39亿元，同比下降1.06%；归母净利润9545.37万元，同比下降3.81%。前三季度实现营收531.00亿元，同比增长3.92%；归母净利润为3.07亿元，同比增长56.86%。</p>\n  <p><strong>万华化学：第三季度归母净利润为55.95亿元，同比增长84.38%</strong></p>\n  <p>36氪获悉，万华化学公告，第三季度实现营收665.51亿元，同比增长24.80%；归母净利润为55.95亿元，同比增长84.38%。前三季度实现营收1858.67亿元，同比增长28.87%；归母净利润156.58亿元，同比增长70.99%。</p>\n  <p><strong>中兴通讯：第三季度归母净利润13.07亿元，同比增长394.46%</strong></p>\n  <p>36氪获悉，中兴通讯公告，前三季度实现营收1168.38亿元，同比增长16.23%；归母净利润40.60亿元，同比下降23.71%。第三季度实现营收388.13亿元，同比增长33.99%；归母净利润13.07亿元，同比增长394.46%。</p>\n  <p><strong>海大集团：第三季度归母净利润12.96亿元，同比下降13.81%</strong></p>\n  <p>36氪获悉，海大集团公告，第三季度实现营收为91.09亿元，同比增长4.95%；归母净利润12.96亿元，同比下降13.81%。前三季度实现营收1033.49亿元，同比增长7.55%；归母净利润29.07亿元，同比下降29.83%。</p>\n  <p><strong>恩捷股份：第三季度归母净利润9.74亿元，同比增长14245.28%</strong></p>\n  <p>36氪获悉，恩捷股份公告，第三季度实现营收55.55亿元，同比增长46.95%；归母净利润9.74亿元，同比增长14245.28%；前三季度实现营收142.26亿元，同比增长49.07%；归母净利润17.94亿元，上年同期亏损8632.3万元，同比扭亏为盈。</p>\n  <h2>酷产品</h2>\n  <p><strong>科学家展示全球首款织进衣服的触摸屏</strong></p>\n  <p>近日，新加坡国立大学科学家展示了全球首款“织进衣服”的触摸屏。它集成在袖筒中，96×54像素，尺寸168毫米×105毫米，由一种既能显像又能感知触觉的纤维制成，手指按压有响应，可无线连接设备，还像普通衣物一样透气、柔韧，且可反复清洗。透气程度与棉布、牛仔布相当，机洗50次、弯折1000次后性能几乎不变。除了显示屏，麦克风、扬声器和传感器也以同样方式织入，可追踪运动、测量温度、探测环境。原型已能运行计算器、播放视频、充当指南针，把温度传感纤维放在腋下还能读出体温。(智慧科技迷)</p>\n  <h2>投融资</h2>\n  <p><strong>“K2Lab”完成千万元天使+轮融资</strong></p>\n  <p>36氪获悉，近日，“K2Lab”宣布完成由凯泰资本投资的数千万元天使+轮融资。半年内，“K2Lab”已连续完成由云时资本、华控基金、凯泰资本分别领投的三轮融资。本轮资金将主要用于海外业务拓展、模型算法与工程能力升级、商家Agent与商家联盟生态建设，以及 AI Native 组织建设。</p>\n  <p><strong>“诺亦腾机器人”完成Pre-A+++轮融资</strong></p>\n  <p>36氪获悉，近日，“诺亦腾机器人”（Noitom Robotics）完成Pre-A+++轮融资，本轮由汇融基金独家投资。</p>\n  <p><strong>“模感科技”完成亿元级天使+轮融资</strong></p>\n  <p>36氪获悉，全身多模态融合触觉解决方案公司“模感科技”（MoSense）近日完成亿元级天使+轮融资，由鼎晖投资、绿洲资本领投，逐际动力、龙芯创投、中科创星、华山资本、浦东创投以及某国内具身厂商跟投。后浪资本担任长期独家财务顾问。此前公司曾获得红杉中国、高瓴创投及智元机器人等参与的天使轮融资。</p>\n  <p><strong>“中科慧灵”完成数亿元A++轮融资</strong></p>\n  <p>36氪获悉，近日，聚焦人形机器人与具身智能核心技术研发及产业化应用的“中科慧灵”完成数亿元人民币A++轮融资。本轮融资由知来投资、涌铧投资、茂天投资、元禾辰坤、国科科智、鲁宁投资等机构联合投资。投资方涵盖市场化股权投资机构、专业母基金及产业投资平台，投资布局涉及人工智能、硬科技、先进制造等领域。</p>\n  <p><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-27T00:08:10+00:00", "fetched_at": "2026-10-27T03:27:58.133393+00:00", "fingerprint": "b2dd1662bbfc5809"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨红杉、高瓴、智元投过的全身触觉解决方案公司再获亿元级融资，团队来自港科大", "url": "https://36kr.com/p/4043477378880388?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2500字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，全身多模态融合触觉解决方案公司模感科技（MoSense）近日完成亿元级天使+轮融资，由鼎晖投资、绿洲资本领投，逐际动力、龙芯创投、中科创星、华山资本、浦东创投以及某国内头部具身厂商跟投。后浪资本担任长期独家财务顾问。此前公司曾获得红杉中国、高瓴创投及智元机器人等参与的天使轮融资。</p>\n  <p>模感科技成立于2026年5月，由港科大机器人比赛冠军团队孵化而成。联合创始人兼CEO严朝旭博士毕业于香港科技大学微电子系，长期从事高频系统、电磁算法及具身多模态传感研究。联合创始人兼CTO周航博士毕业于香港科技大学机器人专业，曾任车规级自动驾驶企业资深算法研究员，长期从事端到端自动驾驶模型、世界模型及具身智能算法研究。</p>\n  <p><strong>模感科技专注于人形机器人的全身多模态触觉解决方案。与主要提供电子皮肤硬件的厂商不同，模感科技的差异化优势在于能够提供从触觉硬件、感知算法到触觉世界动作模型的完整技术链条，形成覆盖硬件、算法与模型的全栈方案。</strong></p>\n  <p>具体而言，公司目前围绕三大核心产品展开布局：全身电子皮肤硬件MoSkin、多模态融合触觉算法MoTact，以及多模态融合触觉世界动作模型MoWorld。</p>\n  <p>硬件层面，模感科技从底层力学结构入手，采用具有负泊松比特性的可调控人工晶格结构。借助这一结构，结构在受力时可以通过晶格定向旋转与形变、分散外部载荷，在承受较大冲击时保护内部传感单元，同时在微小力作用下保持极高的感知灵敏度，解决了传统触觉传感器难以兼顾高灵敏度与宽量程的问题，并提升了系统的抗磁干扰和抗过载疲劳能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_222a136f4d3241f2b86f4614529e5a33@5920579_oswg334900oswg744oswg752_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">MoSkin多模态触觉集成外壳</p>\n  <p>制造工艺方面，传统触觉传感器通常需要将传感薄膜贴附在机器人表面，再通过布线等方式完成集成。这种方式不仅工序较多、制造成本较高，也对复杂曲面的贴合能力提出了挑战，限制了触觉传感器向机器人全身大面积部署。</p>\n  <p>模感科技采用的磁光固化3D打印成型工艺，可将具有特定晶格结构的材料直接加工成一体化触觉结构件，并通过在材料中引入磁性单元形成电磁晶格，算法端采用超分辨率方案使其具备强大的多模态感知能力，同时兼顾低量产成本。该技术可适配硅胶、发泡材料、TPU等不同材质，有助于实现复杂曲面的成型。公司同时拥有全自动曲面大面积多模态标定算法，帮助下游客户实现即插即用。</p>\n  <p>同时，严朝旭向硬氪介绍，基于独创的“力学性能可编程”技术，同一套底层技术可以根据机器人不同部位的需求，调整材料与微观晶格结构的力学特性。例如，指尖需要更高的灵敏度，可以设计得更柔软；脚底需要承受较大冲击，可以强化其结构支撑能力；躯干则可以在大面积感知与结构强度之间取得平衡，所有的复杂方案都可以高效自动生成合理的拓扑结构。</p>\n  <p>算法层面，MoTact相当于“触觉小脑”，主要负责将硬件采集的多轴磁场信号解算为力、位移、滑移、材质等感知信息，并针对不同部位的应用需求进行算法优化。公司提出的技术能力包括稀疏超分辨率、复杂拓扑集成、抗漂移与抗磁干扰，以及KHz级高速阵列采样等，目标是让机器人能够更及时地识别接触状态和外部作用力，为抓取、操作及接触控制等高频动作提供反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_186c0d968b95453da08856250bde3f08@5920579_oswg834965oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">模感科技MoTact与MoWorld模型算法</p>\n  <p>模型层面，模感科技正同步推进基于触觉的多模态融合触觉世界动作模型MoWorld。相较于仅依赖视觉等信息进行环境判断，触觉能够提供接触力、物体形变及局部交互状态等信息。公司希望利用高频、多维的触觉反馈，持续修正机器人动作执行过程中的判断与控制，并将触觉信息作为物理先验补充到模型中，提升机器人在真实环境中的交互能力，缩小仿真训练与真实执行之间的差距。</p>\n  <p>据介绍，目前，模感科技的全身触觉系统已在推进与多家头部机器人本体厂商的合作，并拓展应用落地。在模型侧，公司已经与头部机器人ODM/OEM公司展开合作，推动整体触觉系统及模型的一体化部署，为机器人提供完整触觉-大小脑解决方案。除人形机器人相关业务外，多行业智能整体方案也在加速商业化落地。</p>\n  <p><strong>以下为创始人问答：</strong></p>\n  <p><strong>硬氪：磁光固化3D打印具体解决了触觉传感器领域的哪些痛点？</strong></p>\n  <p><strong>严朝旭：</strong>传统电子皮肤大多采用薄膜或织物形态，需要贴附在机器人结构件表面。但人形机器人的肩膀、腰部等位置往往具有复杂曲面，传统方案在贴合和集成上存在一定难度，容易受到结构设计和装配工艺的限制。</p>\n  <p>我们现在的思路，是直接把触觉感知能力集成到结构件中。过去可能需要机器人壳体供应商和电子皮肤供应商共同完成这件事，现在我们希望直接提供兼具结构与感知能力的触觉结构件。这种方式的优势在于，结构件在成型阶段就可以适配机器人的曲面形态，减少后续贴合带来的问题。目前，硅胶、橡胶、发泡材料等不同材质，以及一些复杂曲面结构，我们都在进行适配。</p>\n  <p>所以，我们的定位不只是电子皮肤，而是触觉结构件。通过将结构设计和传感能力结合起来，我们希望让触觉系统更容易集成到机器人的不同部位，也为后续规模化生产创造条件。</p>\n  <p><strong>硬氪：“力学性能可编程”具体解决了触觉领域的什么问题？</strong></p>\n  <p><strong>严朝旭：</strong>其实这是我们快速工程化能力的一个体现。不同机器人厂商对外壳材料、结构硬度和触觉灵敏度的要求并不一样。如果每接到一个客户的需求，都要重新设计结构、重新进行仿真，开发周期就会比较长。</p>\n  <p>因此，我们在前期设计和仿真环节，就把结构参数做成了可调控的。客户如果需要更强的抗冲击能力，我们就可以调整结构，让它更坚固；如果需要机器人手臂在轻微接触时就能感知，我们就可以将相应区域设计得更柔软、更灵敏。</p>\n  <p>我们也在通过仿真模型，分析结构形变与分布式复杂磁场信号之间的关系，从而更快地完成设计和参数调整。这样面对不同客户、不同机器人结构时，我们就不必每次都从头开发，可以在已有技术体系上快速适配。</p>\n  <p><strong>硬氪：在算法层面，公司如何针对机器人不同部位的触觉需求进行优化？</strong></p>\n  <p><strong>严朝旭：</strong>机器人不同部位的感知需求差异很大，因此算法也需要进行针对性设计。</p>\n  <p>例如，手指和手掌涉及抓取、精细操作等任务，对灵敏度、采样率和分辨率的要求比较高，我们就会提高这些区域的传感器布置密度，并针对高频接触动作优化算法。手和脚还涉及相对复杂的受力情况，因此需要进一步强化多轴力感知能力。</p>\n  <p>但对于躯干等大面积区域，需求可能有所不同。这些位置更关注低功耗和大范围覆盖，不一定需要持续进行高频采样。针对这类场景，我们可以设计相应的低功耗算法，例如在常态下采用低功耗监测模式，在检测到碰撞等事件后再提高采样频率。</p>\n  <p>因此，我们不是用同一套参数覆盖机器人全身，而是根据不同部位的接触特点、受力情况和任务需求，对传感器布局、采样率、分辨率及算法进行差异化配置。这样既能满足关键部位的精细感知需求，也有助于控制整套系统的功耗和成本。</p>", "category": "tech", "published_at": "2026-10-27T01:59:55+00:00", "fetched_at": "2026-10-27T03:27:58.133384+00:00", "fingerprint": "50780280044f674f"}, {"source": "36氪 - 最新文章", "title": "这家全球汽零巨头，为何跨界做机器人？", "url": "https://36kr.com/p/4043530020115590?f=rss", "summary": "<p>汽车产业链企业进入机器人领域正在成为行业新趋势。</p>\n  <p>一方面，整车和零部件价格战持续，企业利润承压，需要寻找新的业务方向。另一方面，以人形机器人为代表的机器人行业，被不少从业者和机构视为下一个阶段的增长主线。行业里广为流传的说法是，具身智能的上半场是自动驾驶，下半场是人形机器人。</p>\n  <p>在这样的判断下，包括小鹏、奇瑞、北汽、蔚来、比亚迪等在内的数十家车企，纷纷在机器人领域落子。</p>\n  <p>宁波的汽车零部件巨头企业「均胜电子」也加入战局。均胜电子早期靠汽车功能件起家，后来通过整合德国普瑞、群英、TechniSat，美国KSS、日本高田等优质资产，切入汽车电子与汽车安全领域，并结合中国市场进行二次创新，成为全球汽车零部件前三十强企业。目前，公司在全球20多个国家设有工厂，2025年营收超过600亿元，其中七成以上来自海外。</p>\n  <p>2025年，均胜电子将业务方向调整为“汽车+机器人”双轮驱动，开始布局人形机器人，定位为机器人领域的Tier1供应商，产品规划聚焦“大小脑+肢体+能源”三大领域，包括AI头部总成、能源管理系统、大小脑域控制器、电子皮肤与灵巧手、机甲等关键部件。其中的电子皮肤，即柔性触觉传感器，主要依托均胜电子与香山股份联营的均胜群英研发与制造。</p>\n  <p>均胜群英电子皮肤业务负责人亢宇冉博士对36氪表示，机器人业务在集团目前战略规划中排在第一位，是明确的第二增长曲线。</p>\n  <p>透过均胜，既能看到车企的积累与沉淀如何在人形机器人上复用，也能看到从汽车到机器人之间，那些无法直接平移到位的落差。</p>\n  <p><strong>1.&nbsp;押注具身智能下半场</strong></p>\n  <p>均胜电子成立于2004年，创立之初专注于汽车功能件。2011年，公司收购德国老牌汽车电子公司普瑞，营收规模突破百亿元，并由此开启了此后十余年的国际化并购。</p>\n  <p>2014年12月，均胜电子以超过9000万欧元收购德国高端内饰件公司群英，其后与原均胜功能件业务整合成全新的均胜群英。均胜群英擅长座舱空气管理系统、智能表面技术，而且在真木、真铝、碳纤维和新材料及工艺上有一定积累，长期服务奔驰、宝马、奥迪、大众、通用和兰博基尼等国际车企。</p>\n  <p>2016年至2018年，均胜又先后收购德国TechniSat汽车业务、美国汽车安全供应商KSS以及日本高田优质资产。公司一跃成为全球第二大汽车安全供应商、第四大智能座舱域控系统供应商，产品自此覆盖全球几乎所有主流车企。</p>\n  <p>2025年，均胜在全球超过20个国家拥有超过4万名员工，产品服务全球超过100个汽车品牌。当年实现营收约612亿元，其中海外收入444.46亿元，占比72.64%。</p>\n  <p>过去几年，汽车价格竞争从大众市场向中高端市场蔓延，整车及零部件企业普遍陷入“增收不增利”的困境，寻找第二增长曲线成为行业的共同课题。正如理想汽车创始人李想在今年5月所说，“具身智能的上半场是自动驾驶，下半场是人形机器人。”</p>\n  <p>据机器人商业评论统计，截至2026年8月，已有超过15家整车厂进军人形机器人赛道。除了整车厂密集入局，上游的零部件供应商也在顺势转向机器人。均胜体系也是这批跟进的零部件企业之一。</p>\n  <p>目前均胜已经与国内头部机器人厂商展开合作，一方面，均胜为智元的一款轮式底盘双臂带机器人提供整机代工业务，从头部、双臂到底盘均由均胜完成制造、装配和测试。另一方面是具身数据采集业务。整机出厂后，将在均胜内部搭建的多个真实场景部署，开展实景实训，采集机器人作业数据，并用于物理AI模型的训练。</p>\n  <p><strong>2.&nbsp;做机器人领域的Tier 1</strong></p>\n  <p>据亢宇冉介绍，均胜在机器人业务上延续的是其在汽车产业里的Tier 1供应商定位。换句话说，均胜不造机器人的本体，也不做单一产品，而是覆盖机器人从头到脚，包括AI头部总成、能源管理系统、大小脑控制器、灵巧手与电子皮肤这些关键部件。</p>\n  <p>以均胜群英的电子皮肤为例。电子皮肤是机器人的“触觉器官”，是一层像人造皮肤一样的柔性电子薄膜，贴在机器人表面，能感知压力、滑动、振动、温度等触觉信号。</p>\n  <p>在电子皮肤的技术路线上，均胜群英采取多线并行，以压阻为基础、以多模态为特色。据亢宇冉介绍，以压阻路线为基础，是因为它成熟度最高，适合高密度集成和规模化量产，也有成本优势，而且靠受压后的电阻变化来感知，不受强磁环境干扰。</p>\n  <p>目前，第一代电子皮肤基于压阻式，已研发并推出机器人指尖触觉传感器、夹爪触觉传感器与灵巧手全手触觉感知方案。第二代将研发电容式大面积电子皮肤，据亢宇冉介绍，电容路线靠受压后的电容变化来感知，灵敏度更高，也能实现接近觉感知，适合铺在更大面积的机身表面。</p>\n  <p>此外，均胜群英联合中科院宁波材料所、宁波东方理工研究院、北京航空航天大学等机构，依托浙江省重点研发技术尖兵项目，同步推进新型柔性电磁式电子皮肤的研发，这类方案靠磁场变化感知，适用于对磁场不敏感的场景。</p>\n  <p>目前，电子皮肤产品已适配均胜自研的灵巧手和工业夹爪。均胜群英的理念是先在自有产线上把技术环节打通、把验证做完，再对外供货，替客户提前发现问题，后期再推广到汽车主机厂等客户的产线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_0a2f27c5598942d5865cff68997c4b39@6244039_oswg116271oswg1436oswg761_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">均胜群英的电子皮肤搭载在机器人夹爪指尖</p>\n  <p>“这也是均胜群英做机器人关键部件的一大优势。”亢宇冉介绍，某个场景需要哪几个模块、压力精度要做到什么程度，都要靠产线中的真实需求得到反馈。部署应用越多，采集的数据越多，产品才能基于真实场景不断迭代，提供可靠性并降低成本，成本越低进而带来更多订单，形成正向循环。</p>\n  <p>亢宇冉表示，均胜群英做机器人优势在于工程化能力、场景数据与客户资源。在工程化上，均胜群英有数十年的产线建设经验，能把样机变成稳定批量交付的产品。在场景数据上，作为制造企业，均胜群英自有产线提供了大量典型工况，可直接把机器人和电子皮肤搬上去，在真实环境里验证并迭代&nbsp;</p>\n  <p>客户资源上，均胜群英有很多工厂和产线，正是机器人未来的买方。同时，均胜也向机器人公司供应关键部件。一边代工生产并部署使用机器人、一边研发生产和销售机器人关键部件，形成双向循环，这种互为客户的关系十分紧密。</p>\n  <p>但他也坦承，现阶段商业化是整个人形机器人行业共同的难题，即使是对于有丰富制造经验的车企也不例外。</p>\n  <p>亢宇冉将均胜群英机器人业务当前面临的挑战归纳为两个层面：一是客户需求与研发成本的平衡；二是规模化客户的获取。“具有真实需求的规模化客户还在形成过程中，愿意买单的客户要的是能直接落地、长期稳定运行的整体解决方案，而不是样品。这要求软硬件系统在免维护条件下连续运行一至两年，整体成本控制在企业和产线可接受的范围内。”</p>\n  <p>机器人业务的出海，均胜群英规划先从均胜自有海外工厂起步在自有产线完成机器人部署与验证之后，逐步向海外制造业客户推广。海外有大量的存量市场，在国际政策允许的前提下，将是机器人业务的蓝海。未来，均胜的目标客户仍以汽车客户为主，公司现有汽车客户也是潜在的机器人客户。</p>", "category": "tech", "published_at": "2026-10-27T02:56:53+00:00", "fetched_at": "2026-10-27T03:27:58.133368+00:00", "fingerprint": "92d030aee440df52"}, {"source": "少数派", "title": "少数派×红树林基金会｜候鸟季公益直播，邀你共护湿地", "url": "https://sspai.com/post/117180", "summary": "每年秋冬，深圳湾都会迎来一批特殊的「旅客」。它们从北方出发，沿着迁徙路线飞越山海，有的在这里短暂停歇，有的则留下越冬。随着潮水涨落，水鸟在滩涂上低头觅食，鸟群掠过海面，也让我们熟悉的海湾多了几分热闹。 ...<a href=\"https://sspai.com/post/117180\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T03:00:13+00:00", "fetched_at": "2026-10-27T03:27:56.598212+00:00", "fingerprint": "1fd80b63b6a92b11"}, {"source": "少数派", "title": "曲高和寡、终成绝唱：傲腾 P5800X 测试报告", "url": "https://sspai.com/post/115074", "summary": "一起来看看 3D XPoint 这夸张的性能表现吧。<a href=\"https://sspai.com/post/115074\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T03:26:35+00:00", "fetched_at": "2026-10-27T03:27:56.598206+00:00", "fingerprint": "46e5cbfac61dc172"}, {"source": "少数派", "title": "秋冬换季护肤买什么，双 11 选购推荐", "url": "https://sspai.com/post/117414", "summary": "双 11 到来之际的秋冬护肤选购与搭配建议。<a href=\"https://sspai.com/post/117414\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T07:00:00+00:00", "fetched_at": "2026-10-27T03:27:56.598199+00:00", "fingerprint": "b6555366cc841c28"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/117529", "summary": ">下载少数派客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/117529\"  long time to really offer a new approach to browser design. Atlassian bought the company last year and shifted its focus to developing Dia, its even more AI-focused browser. And [&#8230;]", "category": "tech", "published_at": "2026-10-25T19:24:50+00:00", "fetched_at": "2026-10-26T02:55:00.947329+00:00", "fingerprint": "2a0fff49437a2a00"}, {"source": "The Verge", "title": "A YouTuber dissected an iPhone Duo and thinks he found the cause of crackgate", "url": "https://www.theverge.com/tech/1018290/dissected-iphone-duo-crackgate-hinge-screen", "summary": "Social media and the iPhone Duo subreddit are filled with reports of Apple's foldable failing quickly and in spectacular fashion. Some users report having the phone for only a few hours before the hinge seems to catch on something, then audibly crack and break the screen. Tellingly, the cracks all seem to happen in the [&#8230;]", "category": "tech", "published_at": "2026-10-25T20:16:19+00:00", "fetched_at": "2026-10-26T02:55:00.947324+00:00", "fingerprint": "f1bdc0fa3bc12975"}, {"source": "The Verge", "title": "Scott Walker’s The Drift will get under your skin", "url": "https://www.theverge.com/entertainment/1018300/scott-walker-the-drift-music-album-review", "summary": "In my mind, Spooky Season music comes in two distinct flavors. There are the fun, occasionally goofy songs like \"The Monster Mash\" and John Carpenter's \"Halloween Theme.\" Then there is the genuinely terrifying: Throbbing Gristle, The Body, or Scott Walker's The Drift. This 2006 album from the singer-songwriter is truly upsetting. On it, Walker explores [&#8230;]", "category": "tech", "published_at": "2026-10-25T21:08:09+00:00", "fetched_at": "2026-10-26T02:55:00.947318+00:00", "fingerprint": "7f1ad14a2206536a"}, {"source": "The Verge", "title": "iFixit&#8217;s look inside the iPhone Duo may explain those broken screens and hinges", "url": "https://www.theverge.com/tech/1018233/ifixit-iphone-duo-teardown-repairability-hinge", "summary": "As is tradition, iFixit has torn open the latest iPhone and laid its parts bare on a table. It found some interesting details about how Apple might be hiding the crease on the Duo's folding screen and gave it a 5/10 repairability score. That might not seem particularly high, but it's the best score the [&#8230;]", "category": "tech", "published_at": "2026-10-25T21:40:27+00:00", "fetched_at": "2026-10-26T02:55:00.947309+00:00", "fingerprint": "28d9af70d6cc841d"}, {"source": "36氪 - 最新文章", "title": "一颗AI毫米波雷达，千里科技在补哪一环", "url": "https://36kr.com/p/4040807584863111?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261025/v2_0b9e91be733247a8b86d8e7589f8f2c9@5679941_oswg50025oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>10月23日，千里科技发布了一颗AI毫米波雷达。在公开信息范围内，这是首个在雷达内部集成10 TOPS算力NPU的方案，雷达自身就能完成目标检测和分类，同时支持边缘侧、卫星与兼容三种工作模式。&nbsp;</p>\n  <p>这不是一次单纯的产品线扩充。&nbsp;</p>\n  <p>过去两年，智驾行业的竞争集中在模型上，谁的端到端更强，谁的数据闭环转得更快。但当模型的能力开始受限于传感器给到的原始信息，竞争就会往上游走一层，走到硬件。&nbsp;</p>\n  <p>这颗雷达要回答的问题，是当模型已经足够强，感知这一端还能不能被改写。&nbsp;</p>\n  <h2><strong>为什么雷达要开始装AI</strong></h2>\n  <p>智驾眼下有两个方向同时在推进。一个是高阶智驾往十几万的主流市场下沉，一个是L3级自动驾驶准备进入量产。这两个方向对技术的要求不一样，落到同一个词上都是安全。规模化要靠安全说服用户买单，L3对安全的要求还要再高一个量级。&nbsp;</p>\n  <p>在安全这个需求下，4D毫米波雷达的位置变得关键。它比激光雷达便宜，雨雾天气下的稳定性更好，是少数能在成本和可靠性之间取得平衡的传感器。&nbsp;</p>\n  <p>麻烦在于传统4D雷达的工作方式。&nbsp;</p>\n  <p>拿行业里比较头疼的障碍物识别来说，传统3D雷达只能判断前方有个东西，4D雷达加了高度维度，能看到目标的轮廓特征，但点云数据还是要一层层传到中央域控，才能判断那到底是什么。链路长度直接决定反应时间。智驾要的是又准又快，链路越长，留给决策的窗口越短。&nbsp;</p>\n  <p>在雷达内部集成计算单元，获取点云后立刻完成检测和分类，直接向智驾系统输出结构化结果，缩短的正是这一段。&nbsp;</p>\n  <p>但真正的瓶颈不在链路长度。&nbsp;</p>\n  <p>传统毫米波雷达的信号处理依赖CFAR这类经典算法，规则在架构设计阶段就定下来了。设计时没预设到的场景，算法只能保守处理，表现出来的就是多径鬼影、杂波干扰、弱目标丢失、多目标分离不足。这几类问题的根源是规则有覆盖上限，靠调参只能在误检和漏检之间换一个位置，换不出新的能力。&nbsp;</p>\n  <p>模型替代规则，改的是这个上限。从天线阵列与波形设计开始，在制造、尺寸、性能的多重约束下用算法辅助找最优解；到点云检测、测角、点云增强、目标跟踪与分类，整条链路都可以引入数据驱动的模型。千里这颗雷达做的不是针对单一场景的补丁式优化，而是从感知链路最前端就对准传统架构的固有缺陷。&nbsp;</p>\n  <p>不过这件事没法靠在雷达里塞一颗芯片完成。现在的分工里，毫米波雷达是供应商交付的成品，算法团队拿到的已经是处理过的结果。要让模型在雷达里跑起来，得从射频设计这一端就参与，这条线不跨过去，AI就只能停在末端补一层后处理。&nbsp;</p>\n  <h2><strong>为什么是千里做这件事</strong></h2>\n  <p>要在雷达里跑模型，前提是模型得是自己的。&nbsp;</p>\n  <p>这句话听起来像常识，落到产业里是一道硬门槛。雷达端要输出什么样的特征、以什么格式输出、和域控怎么分工，这些参数一旦由外部供应商按通用逻辑定好，算法团队再强也只能在既定接口里做优化。千里手里有基座模型，就意味着这些参数可以反过来按模型的需求去定，而不是让模型去迁就硬件。&nbsp;</p>\n  <p>这也是千里过去两年做的事能接上的地方。千里2.0的三项成果里，最要紧的不是装了多少台车，而是那套循环：模型决定产品上限，工程体系决定交付速度，装车产生的数据又反过来训练模型。有了这套循环，雷达端多出来的那份原始信息才有去处，能进训练、能验证、能下放到车端，而不是停在硬件里。&nbsp;</p>\n  <p>这条路别人不是想不到，难的是同时具备几样东西。千里在短短两年内就完成了算法、算力和整车应用方面的全面布局。今年4月的AI战略发布会上，印奇把这套模式称为「链式协同」，强调的是边界清晰下的深度合作，而不是把所有环节都装进一家公司。这套组合让千里同时具备三样东西：大模型能力、芯片侧的理解，以及把算法落到车端的工程经验。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261025/v2_9c21600e006c498690ccdb380eec551d@5679941_oswg565187oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这种分工已经过了一轮验证。2026年上半年，千里科技智能辅助驾驶业务收入12.35亿元，占主营业务收入的24.3%，千里浩瀚已超百万搭载量，覆盖极氪、领克、smart、银河品牌等数十款车型，用户激活率93.9%。&nbsp;</p>\n  <p>传感器这一环是今年补上的。据公开公告，2026年6月11日，千里科技控股子公司重庆千里智驾科技以2590.8万元收购宁波市融感科技100%股权。融感科技成立于2023年6月，专注视觉与毫米波融合雷达，据悉其4D成像毫米波雷达此前已实现多家主流主机厂的定点验证与小批量交付。公告对这笔交易的表述是，打通软硬一体、全栈交付的业务闭环，实现自研算法与硬件的联合优化、同步迭代。&nbsp;</p>\n  <p>这笔交易金额不大，补的位置很关键。它让千里从「用别人的雷达写算法」变成「从雷达设计阶段就参与定义」。这个差别在传统雷达上看不出来，在AI雷达上是决定性的。&nbsp;</p>\n  <p>印奇是千里科技董事长，2026年1月起出任阶跃星辰董事长。追溯他的创业经历我们发现，其AI业务版图始终在围绕软硬一体展开：旷视时期的产品体系覆盖视觉传感器、工业机器人和智能汽车。2024年，印奇掌舵力帆，次年2月公司更名为千里科技，并大刀阔斧地开展「AI+车」战略转型。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261025/v2_ca31e66cf8254a04a4c677d65c1a6037@5679941_oswg287202oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">千里科技董事长 印奇</p>\n  <h2><strong>这颗雷达带来了什么</strong></h2>\n  <p>这颗雷达支持三种工作模式，这是它和市面上多数4D雷达最不一样的地方。&nbsp;</p>\n  <p>边缘侧模式下，NPU在雷达内部跑AI Detector、AI辅助测角、AI点云增强等模型，直接向外输出结构化感知结果，链路短、响应快，也减少了域控的负担。卫星架构模式下，雷达只负责采集和传输，把未做目标检测的中频数据送到中央域控，由更大的模型做多源前融合，好处是信息保留更完整、算法统一、后续可升级。&nbsp;</p>\n  <p>第三种是兼容模式，两种活同时干。雷达最原始的RAW数据直接交给SOC做处理和融合，同时雷达上的边缘侧处理器独立完成一遍处理。两路结果各有各的用处：RAW数据进中央模型，能拿到更多场景信息；边缘侧那份独立结果，是一份现成的感知结论。&nbsp;</p>\n  <p>这一点值得展开。&nbsp;</p>\n  <p>过去行业讲双模式，通常落在「安全冗余」四个字上，意思是中央那一套万一出问题，雷达自己能兜住。但把它理解成兜底，就低估了这个设计的用处。兼容模式真正的价值在于同一时刻拿到两份不同口径的感知结果：一份是原始信息，信息量大但需要中央算力；一份是已经处理过的结论，信息量小但直接就绪。这两份东西对模型来说不是备份关系，是可以互相校验、也可以按场景取舍的两种输入。&nbsp;</p>\n  <p>它没有替车厂预设感知架构。域控算力充裕的平台上，RAW数据走中央前融合，信息利用率更高；算力有限或者追求低时延的平台上，边缘侧结果直接可用。兼容模式则让这两种取法在同一颗雷达上同时成立，不必在架构设计阶段就做二选一的决定。雷达把这个选择交回给整车系统设计，而不是替客户做决定。&nbsp;</p>\n  <p>性能上，这颗雷达对儿童目标可稳定探测至100至150米，为AEB留出更长的反应窗口。儿童横穿是城市道路里最难处理的一类场景，目标小、出现突然、遮挡频繁，留给系统的反应时间本就极短。探测距离拉长，判断窗口就整体前移，AEB能在更早的时间点介入，而不是在极限距离内被动触发。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261025/v2_269a3cd8926a441f8c163a5193783482@5679941_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高架桥跟车视角</p>\n  <p>&nbsp;与千里上一代采用DSP端侧计算的4D雷达相比，这颗雷达点云密度增强10倍，探测距离提升40%，鬼影消除提升至95%，空间角分辨力提升12倍。&nbsp;</p>\n  <h2><strong>这件事的分量在哪</strong></h2>\n  <p>这颗雷达的意义，不仅仅在某一项单点性能的突破，更在于它验证了一种可复制的模式。不追求100%自研，而是通过深度合作，在关键环节以股权绑定建立利益共同机制，从硬件、数据、算法到应用场景，把整条AI链路跑通。这场实验带给行业的参考价值，将远大于对千里科技自身短期收益的回报。&nbsp;</p>\n  <p>而另一方面，自研雷达、掌握原始点云之后，雷达端的数据就不再是孤立的感知结果，而是能够直接进入训练闭环，成为模型迭代提速的又一关键变量。真实路测场景中的长尾问题，从发现、标注到模型适配的全流程周期，也会因此显著压缩。这套技术路径既提供了一种新解法，也为千里科技在行业中的竞争创造了新筹码。&nbsp;</p>\n  <p>通过这颗雷达，千里科技正尝试从一家单纯提供算法方案的供应商，逐步走向具备系统级研发能力的科技公司。&nbsp;</p>\n  <h4><strong>封面来源&nbsp;|&nbsp;企业提供</strong></h4>", "category": "tech", "published_at": "2026-10-25T04:49:15+00:00", "fetched_at": "2026-10-26T02:55:00.823010+00:00", "fingerprint": "bec29a248665b016"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨金价连日大跌，深圳水贝被挤爆；开售仅两天，苹果iPhone Duo破发；德明利：前三季度净利润87.46亿元 同比增长32399.91%", "url": "https://36kr.com/p/4041951412343942?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>DeepSeek、MiniMax，完成AI模型出海登记</p>\n  <p>企业微信回应部分账号发色情链接</p>\n  <p>31省份去年平均工资出炉</p>\n  <p>张雪在家乡刷新吉尼斯纪录</p>\n  <p>存储芯片龙头德明利，前三季度净利同比增长32399.91%</p>\n  <h2><strong>TOP 3 大新闻</strong></h2>\n  <p><strong>金价大跌，深圳水贝被挤爆</strong></p>\n  <p>受国际金价下跌影响，10月24日，深圳水贝迎来人流。网友纷纷发帖称：“买黄金的人比菜市场的都多”“今天水贝市场免费领鸡蛋了吗”。据央视财经，美东时间周五，现货黄金价格跌破每盎司4000美元关口，截至北京时间26日早晨，现货黄金白银开盘小幅上涨，黄金重回4000美元上方。</p>\n  <p>受国际金价连日下跌影响，10月24日国内多家品牌足金饰品价格下调。查询发现，老庙黄金足金饰品报1196元/克，较前一日跌了12元；周生生足金饰品报1200元/克，较前一日跌了6元；周大福足金饰品报1202元/克，较前一日跌了6元；老凤祥足金饰品报1206元/克，较前一日跌了6元。此前9月24日，国内品牌金饰克价普遍在1300元/克附近。（第一财经）</p>\n  <p><strong>开售仅两天，苹果iPhone Duo破发</strong></p>\n  <p>10月25日消息，不少网友反馈，苹果首款折叠屏iPhone Duo已经在国内第三方渠道跌破15999元首发定价，创下近几年苹果新机最快破发纪录。价格分化最先出现在电商平台。截图显示，星光白色256GB版本券后售价15769元，较官方定价低230元。如果抢到额外700元优惠券，还可进一步降至15069元。不过，渠道价格快速走低的同时，官方渠道依旧货源紧张。目前，苹果官网下单选择配送，发货周期仍要等到2027年1月。</p>\n  <p>“iPhoneDuo屏幕开裂”的话题也引发热议。据海外论坛及国内社交媒体多名用户反馈，苹果iPhone Duo屏幕存在不小的问题，开箱即出现屏幕亮线、开裂等问题。苹果客服对此回应称，确有用户反馈屏幕出现黑白线条的情况，但这并非硬件问题，可能与软件UI（用户界面）变化有关。（鞭牛士、中新经纬）</p>\n  <p>&nbsp;</p>\n  <p><strong>存储芯片龙头德明利，前三季度净利同比增长32399.91%</strong></p>\n  <p>德明利公告称，前三季度实现营业收入285.55亿元，同比增长328.81%；归属于上市公司股东的净利润87.46亿元，同比增长32399.91%。第三季度营业收入116.45亿元，同比增长356.64%；归属于上市公司股东的净利润27.29亿元，同比增长2902.75%。公司Q3净利润27.29亿，Q2净利润26.71亿，据此计算，Q3净利润环比增长2%。（财联社）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>字节AI应用再整合：小云雀并入即梦</strong></p>\n  <p>36氪获悉，近期剪映内部完成了一次业务整合，AI短剧创作平台小云雀并入智能创作平台即梦，产品仍保留独立入口。此次调整主要是资源整合，目前即梦已经接入了小云雀短剧相关能力。调整后，小云雀的运营由即梦运营和市场负责人陈欣然负责，产品团队没有变化。</p>\n  <p><strong>英国承诺出资1亿英镑设立生物安全实验室，OpenAI、Anthropic 参与合作</strong></p>\n  <p>英国宣布出资 1 亿英镑（折合 1.34 亿美元）建设 AI 生物安全实验室，由 OpenAI、Anthropic 以及谷歌 DeepMind 提供支持。根据英国政府声明，该实验室将借助人工智能识别、监测生物威胁；与此同时，OpenAI 与 Anthropic 将提供最高 2 亿英镑额度的 AI 模型算力。实验室还将与谷歌 DeepMind 以及生命科学企业 Basecamp Research 开展合作。政府另外拨款 6500 万英镑，用于研发病原体应对手段。（新浪财经）</p>\n  <p><strong>特斯拉确认正自研AI地图，将随FSD v15逐步推送</strong></p>\n  <p>特斯拉副总裁阿肖克·埃卢斯瓦米（Ashok Elluswamy）宣布，特斯拉正在自研一套基于AI的地图导航系统。这套全新地图方案将随FSD v15上线，融合车队采集数据、个性化路线规划，同时支持FSD语音控制。</p>\n  <p>他表示，这套AI地图用来解决当下FSD暴露的一系列问题，包括限速识别、泊车以及路线规划。特斯拉可以往地图里叠加标记坑洼路面、视野遮挡的出入口、危险路口等丰富信息，让行驶更平顺安全。（IT之家）</p>\n  <p><strong>DeepSeek、MiniMax，完成AI模型出海登记</strong></p>\n  <p>10月23日，据央视旗下新媒体“玉渊谭天”披露，国内头部人工智能企业深度求索（DeepSeek）与稀宇科技（MiniMax）已完成相关登记手续，并走通旗下大模型开源发布及海外授权的合规流程。“上述两家头部AI大模型厂商完成登记，意味着在核心敏感技术严格管控的同时，通用型开源大模型的出海路径反而进一步清晰化。”某头部券商计算机行业首席分析师对《科创板日报》记者表示。</p>\n  <p>10月16日，商务部、科技部联合发布公告，就修订《中国禁止出口限制出口技术目录》公开征求意见，拟将23项AI技术纳入出口管制范围；相关管制要求同样适用于在海外部署的含受限技术的AI模型。（财联社）</p>\n  <p><strong>腾讯WorkBuddy接入模型Kimi-K3.1-Pro</strong></p>\n  <p>10月24日，腾讯WorkBuddy宣布已接入模型Kimi-K3.1-Pro。据介绍，WorkBuddy同步接入高速版模型Kimi K3.1 Pro Highspeed，同等智能，输出速度约2-3倍。目前资源紧张，现阶段仅对“企业旗舰版”及“个人订阅用户”优先开放。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>31省份去年平均工资出炉</strong></p>\n  <p>根据国家统计局发布的数据，2025年，全国城镇非私营单位就业人员年平均工资为129441元，比上年名义增长4.3%，增速高于上年1.5个百分点，扣除价格因素实际增长4.2%；城镇私营单位就业人员年平均工资为71590元，名义增长3.0%，增速高于上年1.3个百分点，扣除价格因素实际增长2.9%。从平均工资来看，非私营单位中，12个省份超过12万元，分别是上海、北京、西藏、天津、广东、浙江、江苏、青海、宁夏、重庆、海南和新疆。在城镇私营单位就业人员平均工资方面，有8个省份超过7万元，分别是上海、北京、广东、西藏、浙江、江苏、天津和福建。（第一财经）</p>\n  <p><strong>任泽平公众号被禁止关注</strong></p>\n  <p>10月24日，有网友发现任泽平账号因违规被禁止关注。记者注意到，公众号“泽平宏观”昨日（10月23日）还有更新，但目前已无法搜索到也无法关注，视频号仍可关注。公开资料显示，任泽平，男，汉族，1979年3月出生于山东枣庄，清华大学经济管理学院博士后，中国人民大学经济学博士，独立经济学家，现任中国民营经济研究会副会长、中原银行首席经济学家。任泽平是专业财经头部“泽平宏观”创始人，曾担任国务院发展研究中心宏观经济研究部研究室副主任、国泰君安证券研究所董事总经理、首席宏观分析师等职务。（界面新闻）</p>\n  <p><strong>世茂集团：受影响债务工具的未偿还本金总额约90.68亿美元</strong></p>\n  <p>36氪获悉，世茂集团在港交所公告，公司谨此就清盘呈请对重组公告内所披露的由公司发行或承担作为其境外债务重组一部分的短期票据、短期贷款、A系列长期票据、B系列长期票据、C系列长期票据、长期贷款及长期票据B（合称“受影响债务工具”）所产生的影响，提供更新资料。截至本公告日期，受影响债务工具的未偿还本金总额约9068154524美元，其中短期贷款及长期贷款分别为770997665美元及1268807997美元。根据受影响债务工具的适用条款，由于该呈请自2026年8月27日送达起计连续60天内仍未被撤销及未被中止，故在该期限于2026年10月25日届满后，各受影响债务工具项下均发生违约事件。截至本公告日期，公司并未收到任何关于受影响债务工具的即时还款通知或要求。</p>\n  <p><strong>“00后”产品经理多次称呼“老登”，事后致歉；小鹏副总裁回应</strong></p>\n  <p>10月24日，小鹏集团副总裁于涛在社交平台账号“托马斯电火车”上发布长文，回应小鹏MONA产品经理恩塔发布会“老登”用词事件全过程。他表示，自始至终，“老登”这个称呼，是产品团队对内部几个核心负责人的调侃，完全没有指向任何外部用户，“几位‘老登’没一个不悦，反而在内部反复表扬”。“真正的互联网同学文化，可能不是其它企业上下有别等级森严，而是年轻人敢开老板玩笑的松弛，后来的致歉视频，是恩塔主动提的。她看到有没完整看直播的朋友产生误解，觉得是自己措辞有疏漏，才主动拍了视频解释原委。”他写道。他表示，“恩塔依然会站在发布会上，和产品经理欧阳娜娜，以及‘老登代表’何小鹏一起，联袂讲解。”（第一财经）</p>\n  <p><strong>微信回应少量企业微信账号发色情链接：将进一步加大对外挂软件的打击力度</strong></p>\n  <p>36氪获悉，据“微信公开课”公众号消息，10月24日，企业微信安全团队发布关于坚决、持续打击外挂软件的公告。公告称，今日，少量企业微信账号向客户发送疑似色情引流信息。经企业微信安全团队排查，确认为某第三方外挂软件服务被攻破，导致使用该外挂服务的账号受到影响。企业微信已将受影响的账号强制下线，并封禁相关引流链接。企业微信表示，将进一步加大对外挂软件的打击力度。</p>\n  <p><strong>张雪在家乡刷新吉尼斯纪录</strong></p>\n  <p>10月25日，“张雪机车”创始人张雪，在湖南省怀化市麻阳苗族自治县郭公坪镇小坡村，驾驶改装摩托车成功挑战“改装摩托车在开阔水域行驶最远距离”吉尼斯世界纪录，最终行驶40.74公里。时隔17年，他当年未能实现的心愿，终于在家乡的水面上如愿达成。本次挑战中，张雪驾驶MX450改装摩托车，在开阔河道行驶，打破原31.8公里的吉尼斯世界纪录。吉尼斯官方认证团队全程现场见证、核验相关数据，确认挑战有效，全新纪录就此诞生。（新华社、央视财经）</p>\n  <p><strong>美国能源部将氦气认定为关键材料</strong></p>\n  <p>当地时间本周五(10月23日)，美国能源部宣布，已根据《2020年能源法》将氦气认定为关键材料，以加强美国制造业和供应链安全。美国能源部作出的这一决定，使氦气成为了该机构指定的第20种关键材料，并将这种工业气体纳入《2020年能源法》的关键材料框架，包括接受更严格的政府监管。美国能源部长克里斯·赖特在一份声明中称：“氦气对于生产推动美国经济发展的半导体和先进技术至关重要。通过将氦气指定为关键材料，我们朝着保障供应链安全、创造美国就业岗位以及确保美国在能源和技术创新领域保持世界领先地位，又迈进了一步。”（财联社）</p>\n  <p><strong>31省份2025年婚姻数据公布，广东结婚登记人数连续四年第一</strong></p>\n  <p>国家统计局编著出版的《中国统计年鉴2026》显示，2025年全年全国结婚登记为676.51万对，结婚登记人数前十的省份分别是广东、河南、山东、四川、江苏、河北、浙江、安徽、贵州、云南。其中，广东省有61.38万对，也是全国唯一一个结婚登记人数超过60万对的省份，且已连续四年位居全国第一。（第一财经）</p>\n  <p><strong>美联储本周维持利率不变的概率为90%</strong></p>\n  <p>据CME“美联储观察”：美联储本周维持利率不变的概率为90%，累计加息25个基点的概率为10%。美联储到12月维持利率不变的概率为23.8%，累计加息25个基点的概率68.9%，累计加息50个基点的概率为7.3%。（财联社）</p>\n  <p><strong>先导编辑首次在人体内“改写”DNA</strong></p>\n  <p>据英国《自然》网站22日报道，美国生物技术公司先导医药（Prime Medicine）宣布，已利用先导编辑技术，首次在人体内直接编辑DNA，治疗一名威尔逊病患者。首批临床试验结果预计2027年公布。（科技日报）</p>\n  <p><strong>苹果计划优化iPhone Duo外屏Safari布局</strong></p>\n  <p>苹果正考虑对iPhone Duo的Safari浏览器做出调整，让网页能够占用更多外屏显示区域，不过苹果尚未敲定最终方案。 难题在于，既要允许网页填充到Safari侧边控件下方，又不能让页面内容被遮挡而无法访问。在10月23日周五WebKit官方博客文章中，苹果工程师Jen Simmons表示，现有网页配置可以实现该效果，但苹果调研发现大量网站无法正常兼容该设置。</p>\n  <p><strong>亚马逊CEO：公司云计算容量在2027年底前已基本售罄</strong></p>\n  <p>据报道，亚马逊CEO安迪·贾西表示，受AI基础设施需求不断增长影响 ，亚马逊云科技的云计算容量在2027年底前已基本售罄，且大量订单已排至2028年。贾西称，亚马逊正竭力满足AI实验室和企业源源不断的需求。（界面新闻）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>东山精密，H股发行价厘定为每股H股86.80港元</strong></p>\n  <p>东山精密在港交所发布公告称，发行价已于2026年10月24日厘定为每股H股86.80港元，预计H股将于2026年10月28日上午九时正开始在联交所主板买卖。H股将以每手买卖单位100股H股进行买卖。（财联社）</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>蓝思科技：第三季度归母净利润8.43亿元，同比下降50.42%</strong></p>\n  <p>蓝思科技10月25日公告，2026年第三季度实现营业收入190.35亿元，同比下降8.05%；归母净利润8.43亿元，同比下降50.42%；基本每股收益0.16元。前三季度实现营业收入479.02亿元，同比下降10.74%；归母净利润14.2亿元，同比下降50.06%；基本每股收益0.27元。</p>\n  <p><strong>天齐锂业：2026年第三季度净利润13.6亿元，同比增长1323.97%</strong></p>\n  <p>36氪获悉，天齐锂业公告，2026年第三季度营业收入60.37亿元，同比增长135.4%；归属于上市公司股东的净利润13.6亿元，同比增长1323.97%。2026年前三季度营业收入182.79亿元，同比增长147.11%；归属于上市公司股东的净利润56.02亿元，同比增长3013.86%。</p>\n  <p><strong>本川智能：第三季度归母净利润6250.93万元，同比增长438.11%</strong></p>\n  <p>36氪获悉，本川智能公告，前三季度实现营收11.27亿元，同比增长83.68%；归母净利润1.05亿元，同比增长218.09%。第三季度实现营收5.16亿元，同比增长120.52%；归母净利润6250.93万元，同比增长438.11%。</p>\n  <p><strong>天原股份：前三季度净利润同比增长753.11%</strong></p>\n  <p>天原股份(002386.SZ)公告称，第三季度营业收入为32.24亿元，同比增长14.26%；净利润为6109.32万元，同比增长305.80%。前三季度营业收入为106.89亿元，同比增长25.90%；净利润为2.70亿元，同比增长753.11%。小财注：公司Q3净利润0.61亿，Q2净利润1.33亿，据此计算，Q3净利润环比下降53%。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>亿铸科技完成超10亿元新一轮融资</strong></p>\n  <p>36氪获悉，存算一体AI芯片公司亿铸科技宣布完成超10亿元新一轮融资。公司基于3D DRAM的全数字通用存算一体AI芯片已完成流片，商用芯片测试结果基本达到预设设计指标。本轮融资将用于研发投入、产品迭代及产业化推进。</p>\n  <p><strong>全球最大独立AI影视公司Utopai Studios跻身独角兽行列</strong></p>\n  <p>据媒体报道，全球最大独立AI影视公司Utopai Studios已达成估值10亿美元轮次的融资，跻身独角兽行列，并正在商谈估值为20亿至30亿美元轮次的投资意向。</p>\n  <p><strong>整理丨</strong>昌怡&nbsp;</p>", "category": "tech", "published_at": "2026-10-26T00:08:18+00:00", "fetched_at": "2026-10-26T02:55:00.823003+00:00", "fingerprint": "ecfbc537c67293c4"}, {"source": "36氪 - 最新文章", "title": "AI圈最神秘的一家公司，终于公开了它的“豪赌”", "url": "https://36kr.com/p/4026922691236484?f=rss", "summary": "<p><strong>文｜邓咏仪</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>Vivix到底在做什么？这是过去一年多以来，AI圈对这家神秘公司的最大好奇。</p>\n  <p>Vivix给外界的印象大致是：明星创业者刘宇，从算法、产品到品牌，所有业务线一直在激进招人，公司估值在一年里飞涨至13.2亿美元，背后站满了背景华丽的投资人们。</p>\n  <p>但很少有人能说清楚这家公司到底在做什么。有人说，这是一个不做模型的纯AI产品公司，要做“下一个时代的抖音”，所以才频频推出如7verse、TipTap这样的互动娱乐产品。如果你在这段时间搜索Vivix——唯一可见的技术方向介绍，只有官网写着的“下一代视觉生成引擎”。</p>\n  <p>Vivix成立的19个月里，多模态领域的竞争烈度已然不逊于大语言模型（LLM），并且跑出了如Seedance这样的造富故事。</p>\n  <p>“我们很神秘吗？”7月，第一次见到Vivix创始人刘宇时，他看起来对外界的种种评价有些钝感。“看起来神秘，是因为在模型还没有很ready时，也不太有PR的必要。”</p>\n  <p><strong>刘宇说，此前Vivix的产品都是为了验证模型而做的探索，他想做的事情从没有变过：下一代的实时交互模型。</strong></p>\n  <p>行业对于这家公司的关注，很大程度来自一些闪亮的标签：创始人刘宇1995年生，根正苗红的商汤系人才，经历过大规模AIGC和多模态交互模型的完整训练闭环；早在2023年，就带队做过一款To C AI应用“秒画”，上线首月获得数百万用户。</p>\n  <p>一位知情人士曾对我们说，当时商汤在视觉领域，同时有算法和项目经验的人不超过5个，带过百人基础模型团队、手握4000多张GPU的刘宇是其中一个。</p>\n  <p>而Vivix在资本圈搅动的风云，很大程度就源自刘宇选择的创业方向。</p>\n  <p>2024年，当大语言模型叙事降温时，另一侧的OpenAI Sora正在掀起视频生成模型浪潮。而刘宇所押注的路线，承载了市场对下一代多模态模型形态的希冀。</p>\n  <p>当时，大多视频模型厂商都在all in视频画质提升、更长时长和更强的物理一致性；彼时带领整个商汤研究团队的刘宇，更早就把生成速度和模型的可交互性作为独立的技术目标，探索用一致性模型减少视频生成的采样步数。</p>\n  <p>刘宇认为，互动内容是AI时代才出现的全新内容品类，如果一个模型只能做音视频生成，那它只能为上一个时代成熟内容格式的生产端做降本增效。他创业的源头正是——在可见的未来，模型有机会到达让互动内容“可被消费”的拐点。</p>\n  <p>Vivix的所有模型训练都围绕这个目标来进行。“如果我们要做一个互动内容的底层的模型，一是要让生成足够快，二是要足够便宜。”刘宇说。</p>\n  <p>这也可以解释为什么刘宇在第一次对外的沟通会上，向外界展示的Benchmark并不是顶级模型的某个指标，而是视频平台巨头YouTube的CDN带宽成本——这是这一代内容平台在成本上的基础红线。</p>\n  <p>7月，Vivix将推出两款实时交互模型W1和A1——W1是理解、交互、生成一体化的基座模型；A1则是以角色交互为中心的实时交互模型，面向数字人/角色交互等具体应用场景。</p>\n  <p>其中，W1模型的实时生成成本，已经接近YouTube每小时约0.2美金的CDN带宽成本，<strong>和目前最头部的视频生成模型相比，实时互动内容的生成成本可以低1-2个数量级</strong>。</p>\n  <p>在速度上，当一个用户在交互场景中进行操作时，模型能在300-600毫秒内就可以生成下一帧画面（即TTFF，Time to First Frame，生成首帧画面时间）。这使得模型真正可以做到个性化分发的下一步——个性化生成。</p>\n  <p class=\"third-class\">&amp;amp;nbsp;</p>\n  <h4>△Vivix-W1展示实时导演能力，支持通过文本、语音以及触控输入实时改变故事走向</h4>\n  <p>Vivix初步选择的场景是游戏和直播。这源于这两个场景的特性：游戏是多对多的交互，直播则是一对多的分发，单位token的消耗密度最大，产生的GMV、客单价上限也更高。</p>\n  <p>实时交互则进一步打开了这些场景的可能性。在Vivix和一些游戏工作室共创的demo中，玩家已经可以实时通过Prompt来控制剧情进展，真正让一个故事变成开放世界设定——<strong>刘宇将有故事感作为衡量模型的最核心指标之一。能够交互、能有参与感的内容，才是下一代内容最大的核心。</strong></p>\n  <p class=\"third-class\">&amp;amp;nbsp;</p>\n  <p class=\"third-class\">&amp;amp;nbsp;</p>\n  <h4><strong>△Vivix-A1展示动作表现，与物体和环境的交互</strong></h4>\n  <p>而为了匹配新内容格式，现有的所有“基建”都需要重建。一个本质原因在于，“世界上并不是所有东西都可以通过语言、图像和视频表达。”刘宇说，“我们需要把人类交互的原生raw data扔给模型，让模型自己去理解。”</p>\n  <p>创立至今的19个月里，从前端的数据采集、数据管线搭建到infra、模型，Vivix团队几乎都重做了一遍。目前Vivix的团队规模已达150-160人。</p>\n  <p>和刘宇踏上的远大征程相比，他并非一个爱讲愿景和价值观的创业者，也害怕大家把实时交互粗暴地理解为又一个世界模型。“我只是觉得世界模型太神圣，我们还不配去谈。”他说。</p>\n  <p>在刘宇的规划中，7月上线的W1是一个中等规模版本，核心是验证理解、交互、生成一体化这件事可以跑通，并且可以泛化。今年<strong>Q4，Vivix还将完成W2的训练——数据量比W1再高两个数量级，覆盖所有能想象到的天然视频交互场景。</strong></p>\n  <p>可以说，Vivix想达到的终局目标依然比较远期，并且难度极高。一方面，实时交互对算力和infra提出了更高要求——人类消费语言Token的速度是每秒5-10个字，而视觉类内容的Token量可能是数千到数万。另一方面，实时交互虽然已经成为下一代模型厂商的探索共识，但大的技术曲线仍未收敛，需要长期投入。</p>\n  <p>不过刘宇觉得这反而来到了他的舒适区，“共识意味着平庸”，他说。从小到大，无论是放弃博士入学去商汤创业，还是在商汤里一路内部创业到现在，他所取得的绝大多数成绩，都来源于非共识。</p>\n  <p><strong>以下为Vivix创始人刘宇的自述，经智能涌现整理：</strong></p>\n  <h3><strong>不打算做产品公司&nbsp;</strong></h3>\n  <p>我们成立至今做了好几个产品原型，7Verse、TipTap，到现在已经是第五个产品原型。所有这些产品都只想测明白一个问题：什么样的内容格式和交互方式是真正可消费的。</p>\n  <p>这是这个领域第一性的问题。所有在做AI娱乐、AI内容、交互内容的公司，都必须回答：<strong>什么样的AI内容，是比抖音的内容更让人愿意消费的？</strong></p>\n  <p>我们一开始低估了这个问题，觉得定义了交互式内容就是work的，只要做出来，大家就都会喜欢。结果真的做出来几个产品原型之后发现，这事太难了。</p>\n  <p><strong>该怎么定义交互很难，内容怎样才有消费力也很难，而这两个难点最终都要回归到模型能力。</strong>所以产品并不是我们第一优先要做的事情。<strong>在可见的未来，我们还是以模型为主，核心还是卖模型的API。</strong></p>\n  <p>做这些产品，也是尝试给市场一些方向。当时我们做了首个可在真实世界交互的数字人Sofia，发现有非常多乙游公司、做AI陪伴的公司也希望做这个事情。</p>\n  <p>他们用我们的API，前端harness两三天就搞完了——用Claude Code做整个前端和数据系统。客户沉淀的是他们自己的harness——这个产品该怎么卖、人格该怎么设置、游戏机制和数值系统该怎么调。底层引擎用的是我们。</p>\n  <h3><strong>多模态的Scaling Law已经出现&nbsp;</strong></h3>\n  <p>创业之前，我当时负责训整个商汤所有的底层基础模型。商汤最有名的业务线是人脸识别，我们大概有三四十条人脸识别业务线——地铁刷脸、人证比对、手机人脸解锁、被动式安防。我们就发现，就算都是做人脸识别任务，每一个细分场景都需要单独训一个模型。如果把所有数据拿过来训一个模型，它在每一个场景上的精度都会下降。</p>\n  <p>但这一代大模型完全不一样。Transformer架构里的self attention（自注意力机制）使得模型天然具备跨领域的泛化能力——数据越多、场景越杂，它反而越强。GPT一个模型能做翻译、陪伴、问答、Coding等等，这些场景间的边际成本几乎为零。</p>\n  <p>2025年上半年，我们找到了十几个类似于next token prediction之于LLM的数据源——我们叫next reaction prediction。它其实是一个三元组合，包括几个维度的数据：<strong>过去发生了什么（理解）；人类是怎么交互的（交互）；下一秒会发生什么（生成）。</strong></p>\n  <p>游戏天然就是交互式内容，所有游戏的录屏和仿真环境里，replay只靠记录初始状态和所有人的操作方式，就可以把整个游戏从头到尾回溯一遍。这些数据天然就是展现人是怎么对内容做交互、为什么做交互、以及做完之后内容会发生什么变化的。</p>\n  <p>我们现在已经精筛的多模态数据已经有数千万小时，其中部分带有交互属性。头部通用视频生成的语料差不多也是这个量级。</p>\n  <p>这一点也会影响到我对于多模态交互数据Scaling Law方式的思考。</p>\n  <p>曾经，我们做机器学习训练的年代，需要人去打ground truth（标注真值），比如人脸识别要标这个人是谁，自动驾驶要拉框标车在哪。</p>\n  <p>而到了LLM时代，之所以有Scaling Law，是因为自然语言的Next Token Prediction是天然的自监督“标注”，不需要任何人类标注。我们在交互智能领域，也找到了“理解-交互-生成”这种天然可自监督的三元组结构，所以存在可scale的数据范式。</p>\n  <h3><strong>先Scale数据，再Scale参数和框架&nbsp;</strong></h3>\n  <p>如果你从C端用户看需求，第一，他们很难为token付费；第二，他们对内容生成速度的耐心也有限。所以，<strong>如果我们要做一个互动内容的底层模型，必须有两个特征——足够快，足够便宜。</strong></p>\n  <p><strong>成本、速度跟效果，这三个是一个不可能三角。</strong>我们要比的不是谁成本低、谁速度快、谁画质好，而是在一个四维空间里——成本、速度、质量、内容消费力加一起，看谁的模型和系统往右上角走得最远。</p>\n  <p>AI时代要真正出现to C的内容产品，成本端一定得打破现在工具型模型的成本壁垒。只有当成本能做到我们去刷抖音、看YouTube的内容成本水平，才有可能做到可实时、可交互。</p>\n  <p>我们现在模型推理成本已经非常接近这个状态。</p>\n  <p>我们会对标的是YouTube。用户在YouTube看视频的时候，为全球网络CDN和互联网带宽付出的费用，大概是0.2美金每小时。</p>\n  <p><strong>2025年3月份到今年4月份，Vivix的模型推理成本降低了两个数量级，而且这不只包含生成，还包含对视频、对多模态交互的理解。</strong></p>\n  <p><strong>再说速度。我创立之初给infra团队定的最核心指标是TTFR（Time to First Reaction，首次反应时间）</strong>——人给一个reaction（比如写了一段prompt、在屏幕里点了一下）多久之后会生成对应的reaction内容。</p>\n  <p>如今模型推理的TTFF（首帧反应时间），我们大概需要300到600毫秒，算上网络通信等全链路TTFR需要1秒左右。与此形成对比的是，头部视频模型基于一段prompt生成视频内容需要的推理时间是数百到数千秒。</p>\n  <p>考虑这是一个有效激活参数为约30B，VAE压缩率仅为8-8-4的模型，在理解、交互、生成一体化的情况下，能做到这个延时，是非常难的事情。</p>\n  <p>7月，我们会发布W1。W1是一个中等规模模型，核心是验证理解、交互、生成一体化这件事可以跑通并且可以泛化——有点像GPT-1跟GPT-2的意思。上个月我们已经启动了W2的scaling，W2跟W1相比数据量大了两个数量级。我们计划在Q4完成W2的训练并对外发布。</p>\n  <p>W1到W2要scale的是数据，W2到W3要scale的是模型结构跟MoE（混合专家模型）。<strong>对于我们来说，现在是在scale数据这个阶段——先把模型喂饱，喂饱了之后再去scale参数跟框架。</strong>每一类大模型——语言模型、视频生成模型、音频模型、VLM、VLA，包括我们的理解生成交互一体化的模型——都需要经历这种阶段。</p>\n  <p>现在比较缺失的部分是：怎样把人类天然能够跟模型发生交互的这些模态，全部纳入到模型原生的学习里面。</p>\n  <p><strong>模型的智能上限不应该被人类的自然语言束缚住。</strong>人类怎么跟内容交互的理解，也不应该先转化成文字。我现在的做法是，把人类与模型交互的原生raw data扔给模型，让它自己去理解。</p>\n  <h3><strong>我们没有在和Seedance竞争&nbsp;</strong></h3>\n  <p>我2022年在商汤内部就想做这件事，直到现在也没变过。</p>\n  <p>好多投资人每次第一次见我们，都问你怎么跟Seedance竞争？我说，为什么要跟Seedance竞争？</p>\n  <p>国内很多做视频工具、视频模型的公司，选这条赛道难免要跟字节竞争。但一是模型能力很难做得过他们，二是获客模式、生态也做不过大厂，很难赢。</p>\n  <p>所有做视频生成模型的公司，比如for短剧、for短视频创作的这些产品，它是在为移动互联网时代的内容格式做生产端的降本增效。一切以降本增效为出发点的，且中国有优势的产业，最终利润率都会非常低。</p>\n  <p><strong>而跨赛道的能力，是降维打击，不是直接竞争。</strong>就像用专家系统做RAG和用大语言模型做知识库检索，都是做知识库，但技术范式变了，不存在竞争，大家直接就会迁移过去。</p>\n  <p>本质上，我们是在创造新的增量。现在大家做短剧都是离线的，很少人在做实时互动的短剧，因为也没有对应的模型，成本很高。AI时代，只有靠新模型的出现才能滋生新应用场景。所以我们所有的做法都是在模型层不断加能力，然后往下推对应的infra应该怎么做，应用场景能怎么做。</p>\n  <h3><strong>创业公司追求赔率，大厂追求胜率&nbsp;</strong></h3>\n  <p>大厂一定也会做交互内容，但做的方式、motivation和耐心跟创业公司都是完全不一样的。大公司的决策机制导致了他们对概率的追求是无止境的——这个事儿有足够大的概率，就投入足够大的资源。</p>\n  <p>创业公司的核心是对赔率的追求。我自己对创业的理解是：追求赔率的人，找到了赔率高、且因认知差带来了概率优势的方向。</p>\n  <p>而在这个概率优势提升到大厂愿意投入足够多资源之前，需要形成自己的数据飞轮——也就是足够大的推动力和足够大的壁垒。否则，没有独特认知，在相同概率下跟大厂卷胜率的创业公司，没有任何机会。</p>\n  <p>上一个时代，Adobe能一家独大，是因为产品功能足够复杂——我是个摄影发烧友，但Photoshop 70%的按钮我都没点过，但正因如此，所有工作流都在它这里完成，不需要去别的产品。</p>\n  <p><strong>但AI时代的门槛不再是产品复杂度，而是模型泛化能力。</strong>所有交互都变成自然语言，用户不需要学高斯模糊、蒙版是什么意思，一句话就出结果。</p>\n  <p>为什么AI 1.0时代商业化那么差？原因就是技术泛化性差，你不得不做高单价高毛利的事情来补贴研发。我给这个公司做一个模型，只能给他用，没法给另一个用，因为性能会掉。</p>\n  <p><strong>这一代实时交互技术的底层变量是，模型泛化性足够强，意味着商业模式的变化</strong>——复制能力的边际研发成本是零。不再需要靠某一个客户的高毛利，来补贴给另一个客户定制化模型的研发成本。我们应该赚的钱，就是这个靠基于模型的规模化带来的附加值。</p>\n  <p>而往更远的未来看，具备模型训练能力的公司绝不止一家，模型能力最终也一定会收敛，同质化模型的商业模式最终还是会走向水电煤模式，市场进入存量竞争且渠道透明，毛利率会变低。所以我们要在这个过程中创造场景和渠道的附加值。</p>\n  <h3><strong>要做到AI模型第一梯队，必须军团作战&nbsp;</strong></h3>\n  <p>AI技术的创新跟突破是无法计划的，要有宽松的环境来激发创造力。</p>\n  <p>但在这个时代，如果要做到模型第一梯队，不能仅靠一个天才idea，必须得有非常强的体系化作战能力——要有非常强的数据基建、训练infra，以及数据算法能力。超大规模训练任务的魔鬼，都藏在细节里，相同的1万张GPU、1B原始数据给到不同团队，效果可能天差地别。</p>\n  <p>比如，Seedance之所以会那么厉害，我自己感受有两个点。第一是它的军团作战能力足够强——数据、模型，算法可能没有太多fancy的创新，但每个细节都做得好，模型团队足够努力；二是自动分镜，prompt following的能力做得好，很大提升了产品可用性。</p>\n  <p>我前两年见了不少字节的人，一直很好奇字节为什么能做到这样——无论换了谁，整个团队继续以最高战斗力去做业务。</p>\n  <p>为什么如今这种大军团作战的形式能奏效？是因为当时的视频生成赛道，DIT、MoE已经是共识，不需要做过于fancy的创新，这时候反而需要军团作战，把细节一步步做到位，这就是可以发挥组织优势的地方。</p>\n  <p>今天用AI来生产内容还处于早期阶段，整个视频生成赛道的的ARR跟去年相比翻了数十倍，未来几年可预期的是这个赛道还会有数量级的增长。我们今天押注用模型直接改变内容格式，这个赛道更早，更未知，也更有趣。</p>\n  <h3><strong>我是一个特别怕共识的人&nbsp;</strong></h3>\n  <p>很多人问我怎么看世界模型，好像大家都开始做了，就成了共识？但我觉得并不是。共识是你的认知和大家是一致的，但大家现在做这件事情的出发点显然还是不一致的。</p>\n  <p>在一个还没有成立的赛道上，如果去卷一个错误的共识指标是不对的。就像做数字人，大家都卷谁嘴型对得好、谁手自然，但我认为这不太本质。我喜欢看罗永浩直播，是因为他说话风趣，喜欢看张雪峰讲高考是因为他能把灰色的成年人世界讲给我听。这些才是消费的重点。</p>\n  <p>在我自己的成长中，获得的正反馈都不是由共识带来的。我所有的工作基本上都是需要靠创业精神——在港中文边读书边创业，在微软做研究，在Google Brain做研究，在商汤从实习生到研究总监，再到带一个事业部，都是从0到1的事情。</p>\n  <p>2015年的时候我申请了一所还不错的学校的PhD，签证都办好了，但汤晓鸥老师希望我留下来一起创业。那年我20岁，选择了放弃读博，留在商汤。今天来看，我一点都不后悔。</p>\n  <p><strong>共识意味着安全，但也意味着平庸。我从小就是一个不太追求安全的人，安全会让我有极大的不安全感。</strong></p>\n  <h3><strong>世界模型太神圣，我们还不配谈&nbsp;</strong></h3>\n  <p>有人问我会不会担心大家把我们定义成世界模型公司，我挺介意的。</p>\n  <p>我不太想讲世界模型，一方面是这个词被大家讲得太多了，定义很泛滥。但更深层的原因是，我觉得它太神圣了，我们现在还不配去谈。</p>\n  <p><strong>我的一个观点是，以语言为中枢的多模态模型，不会成为真正能表征这个世界的东西。</strong></p>\n  <p>首先，训练语言模型的语料都来自互联网——曾经有能力把自己的声音和记录留在互联网上的那些人写下的东西。这些语料本身天然就是有bias的。</p>\n  <p>我自己对脑神经科���和高能物理前沿比较感兴趣。如果ChatGPT真能帮我理解这些学科最前沿的认知，它就应该是世界模型了。但我发现它是非常有bias的。</p>\n  <p>再者，假设语料没有bias，人写下的每一行字，本质上是大脑神经回路产生的电信号，到了语言中枢变成文字。而这些电信号源于他一生的所见所闻所想——本质上是他的感官系统。视觉本质上是电磁波，听觉、嗅觉和触觉，归根结底也是电磁力。这也仅仅是构成这个世界已知的四大基本作用力中的一种而已，并不能表征整个世界。</p>\n  <p><strong>人类的一切认知都是感知的某种抽象。人类对“世界模型”的定义，也超越不了人类本身对“世界”的感知。</strong>比如在电磁波谱上，人眼仅能感知到可见光，于是有了记录可见光波段的语料格式叫“视频”；于是能够基于action，预测下一刻“视频”内容，就被定义为“视频世界模型”，这是狭隘的。<strong>人类凝聚的文字，源于对世界如此狭窄的观测。</strong></p>\n  <p>如果人类没有发现X光，只靠可见光录下来的视频说“这就能表征世界”，你会不会觉得非常荒谬？也许未来有Y光、Z光，或者新的第五大基本作用力，能带给我们物理意义上对世界更本质的理解，那么现在基于可见光等定义的“物理世界模型”，是不是会略显狭隘？</p>\n  <p>“世界”本就是被人类基于有限的观测定义的。而人类是狭隘的，人类定义的东西，一定比人类还要更狭隘。</p>\n  <p>想通了这一点，我反而释然了。如果我们以狭义的角度去理解世界模型，其实就是一种功能主义：它能帮人类预测下帧会发生什么，能让人类看到内容跟人拍的有点像。<strong>这个“世界”是为了满足人类实用性的世界，而不是真实客观的世界。</strong></p>\n  <p>AI agent为人类节省大量时间、产生大量生产力之后，人类剩下的时间，精神消费应该有更高效的方式来填满。我如果能做到这一步，就满足了。</p>\n  <p><strong>封面来源｜电影《降临》剧照</strong></p>\n  <p><strong>👇🏻&nbsp; 扫码加入「智涌AI交流群」👇🏻</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261015/v2_bf18e976b3cc4ce29acd20f75a5e6ffe@2057308263_oswg66520oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎关注</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261015/v2_d12913bff4324ec5a636907c3a0d4bb3@2057308263_oswg53997oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/93j_bE9NUVodpfahOZZcKA\" rel=\"noopener noreferrer\" target=\"_blank\">“智能涌现”</a>，作者：邓咏仪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-10-26T00:34:46+00:00", "fetched_at": "2026-10-26T02:55:00.822997+00:00", "fingerprint": "425876f2e89c59bb"}, {"source": "36氪 - 最新文章", "title": "上海交大教授创业，瞄准太空制造，「今控科技」完成数千万元天使轮融资｜36氪首发", "url": "https://36kr.com/p/4042095201620869?f=rss", "summary": "<p>商业航天的下一站，可能不只是将更多卫星送入太空，而是让机器人在太空真正“干起活来”。</p>\n  <p>随着低轨卫星互联网、太空算力平台和商业空间站加速发展，越来越多的高价值设备部署在轨道上。谁来完成设备维护、模块更换、精密装配，乃至未来的太空制造，正成为新的产业命题。</p>\n  <p>在地面，这些工作已大量由工业机器人承担，但微重力、强辐照和极端温差的太空环境，对机器人可靠控制、精细操作和自主决策提出了更高要求。</p>\n  <p><strong>36氪获悉，近日，太空智能机器人公司「今控科技」完成数千万元天使轮融资，由鼎晖VGC领投，上海交大菡源资产、国科绿色基金、灵巧智能等跟投。&nbsp;</strong>本轮融资将主要用于太空机器人核心器件研发、在轨验证及产品工程化。</p>\n  <p>今控科技成立于2026年4月，由上海交通大学教授、博士生导师何俊创立。公司聚焦太空机器人领域，以太空制造为长期方向，致力于构建未来太空制造的智能作业底座。</p>\n  <p>目前，公司自主研发的智能控制器、伺服驱动器、关节模组、多维力传感器等核心器件，已完成热真空、高低温、辐照等环境试验，计划于2026年底搭载一颗算力卫星入轨验证。</p>\n  <p>2027年年中，公司还计划将“今控一号”机器人送入轨道，验证工具自主更换、连接器插拔等复杂操作能力，探索未来算力卫星维护及太空制造应用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_221ebf92e1b7498198135824c0a0aebe@577536001_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2>瞄准太空制造，打造未来空间智能作业底座</h2>\n  <p>过去几年，商业航天产业的竞争主要集中在运载火箭、卫星制造及星座部署。但随着发射成本逐渐下降，产业重心正向下游应用延伸，太空制造成为值得关注的新方向。</p>\n  <p>太空微重力环境能够减少重力沉降、浮力对流等因素对材料生长的影响，为高品质半导体晶体、医药晶体等高附加值材料的制备提供特殊条件。美国Varda、英国Space Forge等企业已在太空制药、先进材料制造等领域展开探索。</p>\n  <p>但从太空实验走向规模化制造，仍面临一项基础挑战：<strong>未来的太空工厂，不可能长期依赖航天员完成每一次生产操作。</strong></p>\n  <p>无论是实验设备维护、精密组件更换，还是空间设施装配，都需要具备自主操作能力的智能机器人。</p>\n  <p>在地面，工业机器人、运动控制器、传感器和工业通信网络已构成成熟的智能制造体系，而在太空，这套基础设施仍处于早期发展阶段。</p>\n  <p>今控科技认为，太空制造将沿着“卫星维修-在轨实验-规模化制造”的路径逐步演进，对应地，太空机器人将沿着“小脑（机械臂+卫星姿轨控）-人在环路（人机交互+自律协同）-大脑（感知+决策+执行一体化）”的技术路径演化。</p>\n  <p>近期，算力卫星等高价值航天器的在轨维护，有望成为机器人精细操作能力的重要应用场景。</p>\n  <p>随着太空算力基础设施发展，计算模块及相关设备可能产生在轨升级、更换和维护需求。能够完成模块插拔、工具更换的机器人，不仅有望降低空间设施的长期运营成本，其操作能力还可延伸至微重力实验、材料制备和空间装配等制造场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_a8b5c088783547968644a3c11b654df3@577536001_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>当更多企业在解决如何为卫星提供服务时，今控科技正在为未来的太空制造建立机器人的操作能力、控制架构和智能基础设施。</strong></p>\n  <p>这构成了今控科技的差异化定位：不将卫星维修视为终点，而是以此为入口，从核心器件、智能控制、精细操作和工业通信等底层能力入手，逐步构建面向太空制造的通用智能作业平台。</p>\n  <h2>工业级器件宇航化，以太网总线构建高速“神经系统”</h2>\n  <p>太空机器人要从定制化装备走向规模化应用，首先需要解决成本与控制系统两大问题。</p>\n  <p>传统航天装备通常采用定制化模式，元器件筛选严格、开发周期长、成本较高。未来如果机器人需要在大量空间设施中部署，成本与可维护性将成为重要约束。</p>\n  <p>今控科技选择了一条不同的工程路径：<strong>以成熟工业级器件为基础，通过可靠性设计、环境适应性优化和系统级验证，实现面向太空场景的宇航级应用。</strong></p>\n  <p>公司自主研发了智能控制器、伺服驱动器、关节模组、多维力传感器等核心器件，希望借助成熟工业供应链降低成本，提高标准化程度和产品迭代效率。</p>\n  <p>如果说工业级器件宇航化解决的是太空机器人“用得起”的问题，那么今控科技的另一项技术布局——<strong>基于以太网总线的机器人控制架构</strong>，则着眼于未来太空智能装备“连接得快、协同得好”的需求。</p>\n  <p>与传统卫星相比，太空智能机器人需要实时处理多关节运动、位置感知、力觉反馈等大量数据。随着视觉感知、智能规划和自主决策能力的引入，系统对通信带宽、实时性及多设备同步的要求将进一步提升。</p>\n  <p>今控科技将以太网总线技术引入太空机器人系统，构建智能控制器、伺服驱动器和传感器之间的高速通信架构。</p>\n  <p>相比部分传统航天控制通信方案，以太网总线在带宽、扩展性和多节点数据交互方面具有潜在优势，有望支撑更复杂的机器人运动控制与协同作业。</p>\n  <p><strong>更重要的是，这套架构的价值并不局限于单台机器人，而可能延伸至未来空间智能装备之间的数据互联。</strong></p>\n  <p>随着算力卫星和空间计算平台发展，星上计算单元、机器人执行机构及感知设备之间的数据交互需求将持续增加。统一、高效、可扩展的通信架构，有望成为未来空间智能基础设施的重要组成部分。</p>\n  <p>今控科技计划通过年底的在轨任务，验证以太网总线在空间机器人控制系统中的应用能力，积累空间通信接口与协议的工程经验，并探索推动相关控制架构的标准化。</p>\n  <p>从核心器件降本，到高速控制与数据互联，今控科技希望建立的不只是一台机器人的技术能力，更是未来空间智能装备可复用的底层系统。</p>\n  <h2>交大教授创业，让太空机器人拥有“大脑”和“灵巧双手”</h2>\n  <p>今控科技的技术积累，来自创始团队在宇航空间机器人领域的长期研究。</p>\n  <p>创始人何俊是上海交通大学教授、博士生导师，师从中国工程院院士林忠钦，长期深耕空间机器人领域，现任上海市航空航天智能制造服务平台主任，并在多个机器人及空间控制领域专业学会担任常务理事或委员。</p>\n  <p>其团队长期研究空间漂浮机器人控制、柔顺操作及地面微重力模拟等技术，相关成果已应用于机器人在轨操作、月轨飞船对接、空间站机械臂等国家重大航天工程领域。</p>\n  <p>何俊表示：“过去我们更多是在解决航天任务中的单项技术难题。但随着商业航天快速发展，我越来越明显地感受到，未来太空需要的不是某一台定制机器人，而是一整套能够规模化应用的智能制造能力。高校能够突破技术难题，但要真正解决成本、可靠性和持续交付的问题，就必须走向产业。”</p>\n  <p>在何俊看来，未来太空机器人不仅需要能够感知环境、自主决策的“大脑”，还需要完成精密操作的“灵巧双手”。</p>\n  <p>不同于固定在地面的工业机械臂，太空机械臂的运动可能影响卫星平台姿态，连接器插拔、工具更换和精密装配也对末端定位与接触力控制提出更高要求。</p>\n  <p>针对这些难题，今控科技形成了空间漂浮机器人控制、接触顺应控制及高保真地面模拟等技术体系。</p>\n  <p>其研发的“今控一号”机器人采用模块化设计，通过标准化机电接口自主更换末端工具，可根据任务需求实现“一臂多能”。</p>\n  <p>与此同时，<strong>今控科技与灵巧手企业「灵巧智能」建立产业合作，探索将灵巧手、触觉感知和智能操作技术应用于太空场景。</strong></p>\n  <p>灵巧智能将发挥在灵巧操作领域技术优势，提供集灵巧手、感知、前端算力和操作模型于一体的解决方案，具备可训练、可部署的特点，双方共同探索太空复杂环境下的精细操作任务。</p>\n  <p>灵巧智能创始人许春山表示：“如果说卫星是未来太空经济的基础设施，那么具备智能大脑和灵巧双手的机器人，就是未来太空工厂的第一批工人。我们期待与今控科技合作，推动地面灵巧操作技术向太空场景延伸。”</p>\n  <p>除了灵巧执行能力，今控科技还在构建太空机器人的智能“大脑”。</p>\n  <p>真实太空任务成本高、试验机会有限，难以像地面机器人一样开展大规模训练。为此，公司建立了高保真地面半物理仿真平台，并提出Hil2Space模型迁移技术路径，探索将地面训练形成的机器人操作能力迁移至真实太空环境，实现“地面训练、太空执行”。</p>\n  <p>据介绍，团队已在地面微重力模拟平台完成捕获、维修、检测和双臂协作等20余类操作任务验证，为后续在轨试验积累了技术基础。</p>\n  <p><strong>从自主决策的“大脑”、模块化机械臂与灵巧操作的“双手”，到核心器件和高速通信构成的“神经系统”，今控科技正逐步形成面向太空制造的智能作业技术体系。</strong></p>\n  <h2>两次入轨验证，从核心控制器件走向太空制造</h2>\n  <p>技术最终需要通过真实空间任务验证。</p>\n  <p>按照规划，今控科技将于2026年底完成首批核心器件入轨测试，重点验证工业级器件宇航化方案的可靠性及以太网总线控制架构的空间应用能力。</p>\n  <p>2027年年中，公司计划推进“今控一号”机器人入轨，验证工具自主更换、连接器插拔等复杂操作，面向未来算力卫星维护开展技术探索。</p>\n  <p>这些看似简单的动作，需要高精度运动控制、接触力反馈与多关节协同，也是未来太空制造的重要基础能力。</p>\n  <p>通过两阶段验证，今控科技希望逐步打通从核心器件、机器人整机到复杂空间操作的技术链条。</p>\n  <p>据介绍，今控科技正与国内优势单位联合研发微型太空晶体制备实验舱，计划搭载于“今控二号”，由舱内机器人自主完成样品转移、检测、封装等操作，探索高品质籽晶的太空自动化制造。少量在轨制备的高品质籽晶返回地面后，即可开展扩径生长与规模化生产。</p>\n  <p><strong>从舱外卫星维护到舱内智能制造，今控科技正尝试将机器人精细操作能力延伸至更多太空场景，为未来规模化太空制造奠定基础。</strong></p>\n  <h2>鼎晖VGC领投，看好太空智能机器人产业化机会</h2>\n  <p>本轮融资由鼎晖VGC领投，上海交大菡源资产、国科绿色基金、灵巧智能等跟投。随着商业航天向空间设施运营及下游应用延伸，太空机器人及智能作业系统正成为值得关注的新兴方向。</p>\n  <p>鼎晖VGC表示：“我们看好商业航天从基础设施建设向空间应用发展的长期趋势。今控科技不仅拥有深厚的空间机器人技术积累，也具备清晰的产业化路径。团队通过工业级器件宇航化探索降本，以高速总线控制架构提升系统能力，并联合灵巧智能等产业伙伴构建智能作业体系。我们看好公司在未来太空制造领域的发展潜力。”</p>\n  <p>当前，太空制造仍处于产业早期，商业模式与产品可靠性都需要通过真实任务持续验证。对于今控科技而言，2026年底核心器件入轨和2027年“今控一号”机器人复杂操作验证，将成为从技术积累走向商业应用的重要节点。</p>\n  <p><strong>如果说过去商业航天主要解决的是“如何进入太空”，那么今控科技希望回答的，是进入太空之后，如何让机器人真正开始工作，并最终建立可规模化应用的太空智能制造能力。</strong></p>\n  <p>这正是今控科技瞄准的长期目标——<strong>成为太空制造的智能作业底座。</strong></p>", "category": "tech", "published_at": "2026-10-26T02:34:27+00:00", "fetched_at": "2026-10-26T02:55:00.822988+00:00", "fingerprint": "c1122ada5e8c9a0f"}, {"source": "36氪 - 最新文章", "title": "具身智能狂潮背后的国资们：抢项目、抬上轿、跟着文件猜未来", "url": "https://36kr.com/p/4036882782573449?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>采访 | 黄楠 邱晓芬</p>\n  <p>编辑｜袁斯来</p>\n  <p>今年春天，FA何紫洋办公室里，地区招商团队成了常客。</p>\n  <p>她就职于一家服务硬科技赛道的财务顾问机构，日常工作就是帮具身初创公司对接投资机构。最忙的一天，她接待了天津、深圳、成都、厦门四波政府团队，其中大多是区级招商中心人员，也有地级市的负责人。</p>\n  <p>有些“跟随型城市”的招商团队直接告诉她：“我们也找不到什么方向，政策说啥我们就弄啥。”其中不乏一些地方团队的盘算显得不切实际，一个人口只有几十万的县级市，有深厚的制造业资源。对方能说出本地一整套产业图谱：厂房现成、配套齐全，上下游中小工厂一抓一把。现在就缺少个能牵头的链主企业，“把整个生态给做起来。”</p>\n  <p>何紫洋能感受到，他们有些无所适从，很多人被某种力量裹挟着，不得不去追赶自己也不太理解的浪潮。</p>\n  <p>在很长一段时间中，国资似乎离创投市场很远。过去的快消、娱乐、互联网投资盛宴起起落落，很少看到国资的身影。</p>\n  <p>然而，这是硬科技投资时代，仅仅依靠市场化基金，很难满足更高层面的目标。于是，国资登场。而具身智能作为过去两年最高调、最为普通人熟悉的硬科技赛道，国资的参与也相当醒目。</p>\n  <p>IT桔子数据显示，2026上半年国内具身智能赛道融资事件超过300起、对比2025年同期增长137%，披露项目总额达935亿元。<strong>大额融资交易中，国资机构参与占比达到42%。地方国资、产业资本、加上头部VC的联合投资，成为具身项目的主流配置。</strong></p>\n  <p>从时间看，国家队其实自2025年末就已经入场。上海具身智能基金、深圳机器人基金群等先后落地并集中出手，成为最重要的增量资金来源之一。一线城市以外，杭州、苏州、合肥、无锡、宁波、南京等地的机器人产业基金，也陆续加入到这场资本竞赛。</p>\n  <p>“去年地方性大基金成立的时候，我们觉得今年肯定不会差，事实的确如此，头部公司一轮就是十亿、数十亿级砸过来了。”老牌硬科技基金的投资人刘凯杰告诉硬氪。</p>\n  <p>一段时间中，投具身智能成了不会犯错的开卷考试。<strong>“大家都是命题作文式投资。要么投马斯克，要么投‘马克思’嘛，跟大方向站在一起确定性更高，这是共识。”</strong>一位国资基金投资人告诉硬氪，他这句话在我们访谈中，也被多位受访者以不同方式重复。</p>\n  <p>况且，“合肥模式”已经打好样，没人想放过以小博大的可能。具身智能赛道的热点不断变化，首先是本体公司，接着是上游零部件，最后到了世界模型，无一例外，国资都没有缺席。</p>\n  <p>但故事走向在2026年9月直转直下。宇树上市后市值蒸发一半，梅卡德曼创始人在朋友圈发文斥责行业乱象，港股18C特专科技上市规则收紧。</p>\n  <p>投资人们逐渐认清一个公开的秘密：第二、三梯队企业 IPO 预期不再乐观。多位受访投资人告诉硬氪：真正的融资压力将在2026年11月之后集中释放。因为当下大量企业账上仍保有前期融资结余，但当下一轮融资启动时，估值倒挂和退出无门的现实或将同时到来。</p>\n  <p>这个事实直接动摇了地方国资的退出预期与产业招商叙事。“<strong>具身赛道变化太快，三个月一次小迭代，半年就能推翻此前所有判断，市场处在巨大的迷茫中。</strong>”深圳某区域机构具身投资人对硬氪感叹。</p>\n  <p>抛开资本狂欢，宇树仍然是全球出货量第二的人形机器人公司，2026年上半年出货超5000台，它的市值仍然是上市前的一倍。但这场惨烈的市值蒸发，终究成了行业刹车的起点。</p>\n  <p>一位投资人会引用一个判断，“百年未有之大变局”。一级市场、投资逻辑当然也身处剧变之中，我们试图借助具身智能产业这一个切口，梳理出国资如何走上前台，如何运转，又如何影响行业走向。</p>\n  <h2><strong>国资下场，“千金买马骨”</strong></h2>\n  <p>具身智能到底会给一个地区带来什么？</p>\n  <p>一位国资投资人交流时，会反复提到“千金买马骨”的典故：战国时期，一位国君苦求千里马不得，臣子花重金买来了一副千里马的骨头，并告诉他：这样做是为了告诉天下人，您是真心想要求千里马，以至于连死马都会买下，何况活马呢？之后不到一年，国君果然得到了三匹千里马。</p>\n  <p>这一逻辑在两千年后的一级市场仍然适用。</p>\n  <p>对一个想在“新质生产力”、“十五五规划”布局里卡位的城市来说，可选项很有限。商业航天、量子科技、可控核聚变，高度依赖国家级大装置、顶尖科研人才和特殊产业底座，仅有少数城市具备承接条件。相比之下，具身智能赛道有独特优势，整机、零部件、软件、数据等环节可以拆分落地。</p>\n  <p>这意味着，他们想要的，未必需要是完整人形机器人整机厂商。哪怕只是一家生产关节电机、减速器的零部件公司，只要来到当地，既能兑现阶段性招商目标，埋下税收增长与产业集群的种子，也足以铺展一套关于未来具身智能生态的宏大叙事。</p>\n  <p>根据硬氪了解，一些政府不允许各区之间形成恶性竞争，将重点区划分了不同概念和职能：有的区做核心部件，有的区引入本体和大脑，有的区引入灵巧手，各自有明确分工。</p>\n  <p>某些企业看到了这样的需求，并据此调整融资模式。他们会研究国资配套的产业资源，针对他们的需求拆分业务，总部、研发中心、产线、数据中心分落不同城市，对接多地国资资源。</p>\n  <p>“地方缺整机就推本体，要零部件就主打电机、减速器，布局落地就做数据中心。”一位投资人告诉硬氪。</p>\n  <p>对于一些地方国资的而言，交差才是最重要的任务。企业这样做，能性价比最高地满足他们需求。“他们其实也不一定最怕项目暂时做不好。硬科技本来就允许失败，政策上也一直在讲尽职免责。怕的是项目失败以后，档案里什么都没有。”</p>\n  <p>所以聪明的公司先研究的不是客户需求，而是各个城市的招商缺口。<strong>他们先签基地，拿厂房，买设备，再找产业伙伴做一批订单，按时发新闻稿，再挂上领导调研照片。“材料一定要先形成闭环。”</strong></p>\n  <p>至于这家公司到底能不能真正创造价值，“可以慢慢研究。最后，一个商业上八字还没一撇的公司，在文件里已经成了当地机器人产业链核心企业。”上述投资人总结，“大家都觉得自己拿到了最关键的一块。最后大家一起抬轿，谁也不愿意先问一句，轿子里到底坐没坐人。”</p>\n  <h2><strong>国资分化，一城一策</strong></h2>\n  <p>要梳理国资的脉络，首先需要理解，中国是大一统国家，同时地区和地区之间差异极大，中央与地方、地方与地方之间都有错综复杂的交织，而官僚体系条块分割、多重领导。</p>\n  <p>因而国资内部并非同质化的资金池。不同类型国资资金来源、考核机制、风险偏好差异明显，投资风格也有相当大的区别。</p>\n  <p>第一类，是对集团产业链负责的钱。代表性机构是央企旗下的产业投资平台，代表包括中信系基金、中车资本等。这些资金的体量丰厚，资金来源里有专项配套和产业转移支付，考核的重心不在单个项目的财务倍数，而在能不能补上集团自身产业链的缺口、打开新的业务场景。</p>\n  <p>比如出手了智平方的中车转型升级基金，其说法很直接，看重的是双方“天然的生态协同关系”，中车有高端制造场景，更关注具身智能技术能不能嵌进集团的产线和业务中。</p>\n  <p>第二类，是对地方招商考核负责的钱。 主体是区县一级的国资平台和产业基金，也是这轮具身热潮里最积极的出资方。它们的资金受国有资产保值增值约束，风险偏好相对保守，更喜欢中后期、几十亿估值、靠近PE阶段的成熟项目。</p>\n  <p>对地方而言，项目评估的核心标尺是产业落地价值。某二线城市的区域投促中心负责人吴建羽告诉硬氪：“<strong>我们更在意企业能不能把研发中心、产线、配套团队落在本地，能否带动上下游零部件、数据服务企业形成集群，这是资金最优先考量的指标。</strong>企业短期估值高低、何时上市，反而退居其次。”</p>\n  <p>第三类，则是国资体系内部以财务回报为核心目标的市场化导向资金。近年来，深圳、上海试点国资基金分类改革，尝试将部分国资基金从招商引资工具的定位剥离，按照基金本身的投资属性设定考核指标。</p>\n  <p>这类资金不把本地落地建厂作为前置硬性条件，返投约束也会放宽，投资判断聚焦在项目成长性与退出收益等方面。典型机构包括深投控旗下投控东海、深创投管理的人工智能终端产业基金、上海国投旗下部分子基金等，这些机构都曾出现在星尘智能、智元机器人、自变量机器人等头部具身智能企业的资方名单中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261022/v2_8392605483c546619456f8acfa6be1ee@6022551_oswg2801015oswg2594oswg1708_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">自变量机器人发布会上宣布“机器人入驻家庭计划”（图源/企业）</p>\n  <p>除了国资性质不同，地方国资之间也有很大区别。毕竟，“属地管理”制度下，各地方官不仅仅要在官场上竞争，还要在市场上竞争。</p>\n  <p>在长三角一带，各地区的争夺尤为激烈。有的地方对估值敏感度极低，某些县级市凭借制造业底盘，已经聚集了机器人供应链上中下游的一批核心部件企业，招商力度强劲。“团队豪华、故事够大，喊出六十亿估值，也敢投一两个亿把人引过来。”何紫洋描述。</p>\n  <p>对他们而言，这属于招引明星项目策略，先抢到好标的，估值不是首要考量。</p>\n  <p>这也直接决定了投资人的风格。“你所在的城市，基本决定了你对市场冷热的判断。”长期跟踪硬科技赛道的投资人陈鹏向硬氪表示。</p>\n  <p>他所在的机构偏好具备大厂高管背景的创业团队，此前曾出手过几起具身智能项目投资。</p>\n  <p>但进入下半年，陈鹏手里一个项目上会时，评审会最终给出的结论却是暂缓投资。放到此前，这种头部企业资深技术负责人的项目极大概率会被放行。</p>\n  <p>“<strong>今天深圳可能收紧投资审批，广西、部分苏北县域的产业资金仍在放量，松紧节奏高度区域化。而随时间窗口推移，同一城市对同类型项目的定价判断可能完全相反。</strong>”陈鹏说。</p>\n  <p>两种风格各有侧重，但很难分出优劣。一位具身智能公司的融资负责人直言，有些区域开出的优惠政策看起来更好，但兑现时容易打折扣，承诺的额度，落过去发现给不到那么多。反倒是流程比较长、条例琐碎但明确的地方，虽然前期推进慢一些，但执行相对规范，政策延续性也更强。</p>\n  <p>对企业来说，选择哪边，取决于它当下更需要速度，还是更需要确定性。</p>\n  <h2><strong>谁在拿走好项目？</strong></h2>\n  <p>必须承认，在这场各地争抢具身标的的竞赛里，并不是资金体量越大的地区，就越能锁定优质企业。能否抢到好项目，核心取决于国资自身的资源禀赋与交易条款设计。以券商类基金为例，其以激进和高激励著称，几十人的团队项目覆盖度能比肩几百人的一线城市大基金。</p>\n  <p>当然，多数时候，一线城市的国资投资实践是典型样本。本地集聚大量机器人与AI创业主体，依托区位产业网络，投资团队在项目触达和尽调上的信息优势更强。以深圳南山区为例，作为一个高密度产业集群城市，供应链、人才、客户、政策，全在半小时车程内解决。</p>\n  <p>生产要素优势只是起点。随着赛道话语权转移，具身智能企业在融资谈判中拥有极强议价权，过去地方常用的人才补贴、税收减免、产业供地等传统招商筹码的吸引力正在减弱。</p>\n  <p>吴建羽告诉硬氪，头部具身企业议价能力很强，不愿接受硬性返投约束。“<strong>如果地方希望企业落地，投入门槛往往要亿元级别，需要下重注。不少团队还会诟病国资内部决策链条冗长。</strong>反过来，部分机构不设置落地与返投附加条件，反而成为吸引企业的核心优势。”</p>\n  <p>这是一场双向博弈，里面出现了一条清晰的分层规律：省级国资平台和区级国资的投资逻辑正在分化。</p>\n  <p>省级投资公司的资金，大多不再强制要求企业落地、本地注册。从今年初开始，不少省级平台转向无附加条件的市场化投资，核心动因就是严苛的落地、返投条款很难捕获顶尖项目。与之对比，区县级资金依旧把产业落地、返投作为投资的重要前提。</p>\n  <p>这一变化背后，是顶层导向对招商内卷的纠偏。<strong>此前多地竞争性招商催生不少潜在风险，地方资金在项目落地中承担较重的履职压力，整体投资决策趋于审慎。</strong></p>\n  <p>对地方而言，发展经济是核心任务和政绩，直接影响地方官的声望和升迁，也影响基层公务员的绩效。在这个过程中，地方官加大投资，为向上攀登积累政治资本，同时要被党纪国法的监督。这就是学者兰小欢所谓的“胡萝卜加大棒”式的激励机制。地方官员需要在这其中寻找平衡，谁也不希望大棒砸在头上。</p>\n  <h2><strong>价值几何？</strong></h2>\n  <p>总体而言，国资和估值狂欢保持着距离。</p>\n  <p>过去一年中，很多具身项目估值已经脱离了实际。“我们见过小千万量级营收、估值超百亿的项目，这种标的根本下不去手。” 一位投资人告诉硬氪。</p>\n  <p>而国资很少参与这种哄抬。它们在具身赛道上的出手风格，可以用一句话概括：不定价，但一定到场。</p>\n  <p>刘凯杰告诉硬氪，大部分国资机构的做法是让市场化机构先定价，自己再跟进。<strong>一个项目在某地融资，拿到三四家投资方份额后，创始人会收到一个信息，“去找个市场化机构来定价，定价完了我们就能签字。”</strong>把定价的事交给市场，国资负责把钱投出去。</p>\n  <p>这看起来保守，实际上是一种精算过的安全策略。国资追求的是确定性，不是超额回报。</p>\n  <p>“任何估值破百亿的公司但凡说现开一轮，大家都会抢份额，因为确定性高。”一位央企旗下产投投资经理说，“赚得多不如赚得稳。”</p>\n  <h2><strong>降温</strong></h2>\n  <p>但随着事态变化，即便百亿估值的企业，其确定性也可能无法兑现。</p>\n  <p>整个市场的情绪迅速掉头，转向保守。虽然地方资金的底层考核逻辑并未从“落地”退回到“财务回报”，但“落地”本身的标准在变。</p>\n  <p>过去签一个基地、落一条产线、买一批本体，招商动作就算完成，自国办函54号文发布之后，谁负责签字，谁就要解释这笔钱为什么投、产业到底有没有真的运转起来。（*注明：国办函54号全程为《国务院办公厅关于加强监管防范风险促进私募投资基金高质量发展的指导意见》）</p>\n  <p>而当下，投资人已经在重新评估这套退出路径，18C通道仍在，但对商业化实质进展、技术真实性的要求明显提高，单靠高估值和股东背书闯关的难度在加大。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261022/v2_b66dffcb5002454586f2fe4b242d384b@6022551_oswg1350126oswg1312oswg750_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树科技敲钟现场（图源/企业）</p>\n  <p>所有入局资本与被投企业，最终都绕不开同一个终极问题：如果项目无法上市，这笔巨额融资该如何收尾？</p>\n  <p>曾经有一种乐观判断是，只要拿到足够资金，哪怕短期商业化跑不通，企业也能留在牌桌。</p>\n  <p>但现实的约束远比想象中沉重。一位头部具身智能企业CEO坦言，假设企业融资50亿元，每年持续亏损3到5亿元，账面现金或许可以支撑近十年。可一旦业务长期没有实质突破，远期回购压力将会持续累积。同时，加上营收与产品落地进展不及预期，企业的竞争处境承压，核心人才留存也会面临挑战。</p>\n  <p>对国资而言，一方面当初高价入场的股权投资难以变现，另一方面，依托招商逻辑入局的国资，期待的产业落地、产业链带动等中长期目标，也会随之落空。</p>\n  <p>即便后续企业有一线可能成功登陆IPO，考验也不会就此结束。</p>\n  <p>“<strong>资本把公司抬上轿，IPO负责把轿帘掀开，让所有人看看里面到底坐着什么。以前关起门来，十几家机构可以一起相信未来；上市以后，将是几万个股民每天盯着你问：收入呢？利润呢？现金流呢？</strong>”该CEO告诉硬氪。</p>\n  <p>国资抢到项目、抬上轿、看着它敲钟，只完成了前半程。</p>\n  <p>成功上市的相对理想结果，是企业在一段时间中保持稳定，让投资人在解禁后批量减持，缓释回报压力。然而，最终公司的底盘仍然要回归最朴素的商业逻辑：赚钱。对于国资而言，爱惜羽毛比套现离场优先级高，他们必然会去寻求风险更低的入场方式。</p>\n  <h2><strong>“投早、投小、投硬科技”</strong></h2>\n  <p>如今，国资的资金投向正形成一副哑铃状投资图谱。</p>\n  <p>资金向两端集中。一端是早期深度介入；率先出手、选准项目并参与定价，赌的是后续成长带来的高回报，也就是“投早、投小、投硬科技”；另一端是后期抱团，Pre-IPO明星标的；多家机构共同出资，追求资金安全和上市退出的确定性。</p>\n  <p>Pre-IPO阶段，企业定价逻辑已接近二级市场，核心支撑是上市预期而非一级市场的基本面分析。对投资人而言，这类项目具备一定的安全边际，只要能够成功上市，亏损风险相对可控。但Pre-IPO时，通常企业已经有很高的溢价。</p>\n  <p>因此，国资和美元基金都在同时往前冲刺，期望能在初创公司前三轮入场。“以前大家都觉得国资是最后接盘的，现在发现不是，他们也在做前三轮。”陈鹏说。</p>\n  <p>但这其中存在错位，大部分创始人认为国资更适合在项目后期进入，用于上市背书、优化股东结构。某具身智能企业创始人告诉硬氪，“早期拿国资资金会绑定产能、税收等落地要求，对我们来说，发展早期还是不太想被这些硬性条件束缚。”</p>\n  <p>他们对国资有固有期待。一位投资人直言，“我们也想投早一点，但创始人都认为国资应该最后接盘。”</p>\n  <p>夹在其中的腰部项目，成为这轮周期里风险最集中的一层。</p>\n  <p>它们的增长靠定制化订单撑着，现金流靠下一轮融资续着，产品还没形成稳定复购。更残酷的是一个时间差，头部公司正在拿走市场上有限的流动性，腰部公司很难抢到窗口 。</p>\n  <h2><strong>赌一个未来</strong></h2>\n  <p>无论当下具身智能如何转向，顺应政策仍然是投资的大方向。</p>\n  <p>“不是风险投资突然有了长期耐心，而是有政策导向支撑，项目即便未达预期，可以归因于赛道探索阶段的不确定性。”一位投资人告诉硬氪。</p>\n  <p>毕竟，抱团、随大流向来是最安全的策略。<strong>有头部VC共同参与，可以被理解为市场共识下的集体判断；有地方落地配套，即便商业化进展慢于预期，产业培育的价值仍可被记录。</strong>相比之下，自己冒险押注一个新赛道，失利后反而要面对更集中的压力。</p>\n  <p>“<strong>大家往上看，看政策、看口径、看哪一级政府最近在讲什么、看哪个产业园缺项目、看哪个赛道容易写进汇报。大家不是在发现未来，是在跟着文件猜未来。</strong>”上述投资人表示。</p>\n  <p>但这或许会是持续很多年的常态。具身智能的流动性的确暂时收紧，然而硬科技还是发展方向，只是他们需要找到链条上能形成商业闭环的公司。</p>\n  <p>政府不可能为了新兴行业无底线兜底。“所谓强力政府，不仅在于它有能力和资源支持企业发展，也在于它有能力拒绝对企业提供帮助。”兰小欢这样写道。</p>\n  <p>政府干预在“东亚经济奇迹”也并不罕见，政府扶持造就了中国的面板、光伏等等新兴产业在全球的成功，韩国也依赖国家投入，发展出了此前从未有过的轮船和电子产业。</p>\n  <p>但这些产业走向成熟的关键，是完成了“断奶”。<strong>“新能源、半导体都走过相似路径，如今轮到机器人。我们必须敬畏市场情绪。”上述人士说到。</strong></p>\n  <p>&nbsp;</p>\n  <p>（*应受访人要求，刘凯杰、何紫洋、吴建羽、陈鹏为化名）</p>", "category": "tech", "published_at": "2026-10-26T02:42:00+00:00", "fetched_at": "2026-10-26T02:55:00.822974+00:00", "fingerprint": "2c932da31e0710b0"}, {"source": "少数派", "title": "60 元打造你的 vibe coding 神器：小米蓝牙遥控器 2 pro", "url": "https://sspai.com/post/114741", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/114741\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-25T06:30:31+00:00", "fetched_at": "2026-10-26T02:54:58.534601+00:00", "fingerprint": "baec267ea2be7b3d"}, {"source": "少数派", "title": "派早报：iFixit 拆解 iPhone Duo，肯定可维修性但指出内屏隐患", "url": "https://sspai.com/post/117460", "summary": "<p>派早报：iFixit 拆解 iPhone Duo，肯定可维修性但指出内屏隐患</p><p>Spotify 将要求家庭组成员定期扫码验证</p><p>Arc 浏览器宣布下线</p><p>央广总台澄清「国补停止」说法</p><p>谷歌建设虚拟电厂，付费激励电网用户省电留给 AI</p><p>iTunes Store 重受歌手青睐</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/117460\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-25T23:36:36+00:00", "fetched_at": "2026-10-26T02:54:58.534590+00:00", "fingerprint": "d054a508ee7c2a57"}, {"source": "BBC World News", "title": "Man arrested after fire at Hitler's mountaintop Eagle's Nest retreat", "url": "https://www.bbc.co.uk/news/articles/cr93zwjw1k4qo?at_medium=RSS&at_campaign=rss", "summary": "
