roduct Alex Benzer. They will be built on the decentralized AT Protocol that underpins Bluesky, with Benzer saying that \"it's a [&#8230;]", "category": "tech", "published_at": "2026-06-11T00:05:48+00:00", "fetched_at": "2026-06-11T03:32:05.097298+00:00", "fingerprint": "ca5e7a117711b6a1"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜韩IT巨头Kakao工会史上首次启动局部罢工；三星考虑新建先进芯片封装厂，以满足全球芯片需求；SK海力士最早将于8月在美国上市", "url": "https://36kr.com/p/3847079661193733?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847048931936512\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>瑞斯康达：董事长李月杰因个人原因辞职，选举韩猛为新任董事长</strong></a></p>\n  <p>36氪获悉，瑞斯康达公告，董事长李月杰因个人原因辞职，自2026年6月9日起生效。公司第六届董事会第十二次会议选举韩猛为新任董事长，任期至第六届董事会届满。韩猛自2025年7月起代行董事长及法定代表人职责，公司法定代表人变更为韩猛，相关工商变更登记手续正在办理中。韩猛持有公司股份45000股，占总股本的0.01%。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846756486793728\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Meta与安巴尼旗下的信实集团合作，在印度建设人工智能数据中心</strong></a></p>\n  <p>Facebook母公司Meta 周三表示，已与印度亿万富翁穆克什·安巴尼旗下的信实工业集团 达成合作，将在印度共建一座人工智能数据中心。声明称，信实工业将在古吉拉特邦贾姆纳加尔建设一座容量为168兆瓦的数据中心，Meta将租用该中心，并保留扩容选项。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846974434674952\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>韩IT巨头Kakao工会史上首次启动局部罢工</strong></a></p>\n  <p>据报道，韩国IT巨头Kakao工会于6月10日启动公司史上的首次局部罢工。参加罢工的包括Kakao总部和Kakao Pay、Kakao Enterprise、Dk Techin、XLGAMES四家子公司。工会方面表示，有1500余名员工参与罢工，其中总部员工约1000余人。据了解，Kakao劳资双方围绕绩效奖金发放标准现分歧。劳方要求资方将营业利润的13～14%用作绩效奖金发放，不将限制性股票单位（RSU）算进绩效奖金。资方则主张劳方相关诉求对公司经营造成负担。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846963366808066\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>字节AI制药开启拆分融资，AI4S进入产业化阶段</strong></a></p>\n  <p>36氪独家获悉，字节跳动AI制药业务线已启动拆分与独立融资进程。据了解，拆分后字节仍将控股新公司，AI制药核心团队、核心算法、技术平台和已有管线资产将整体进入新主体。同时，该业务也将继续从火山引擎获得算力支持。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846949987125766\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星考虑新建先进芯片封装厂，以满足全球芯片需求</strong></a></p>\n  <p>三星电子考虑在韩国光州建设先进半导体封装工厂，以满足全球芯片需求。三星正扩大HBM市场布局，以加强其在AI芯片供应链中的地位。预计三星将在6月29日韩国总统与企业集团负责人会议上公布投资计划。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846876921989637\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>马斯克旗下企业SpaceX及xAI被告扰民，1万多人提起集体诉讼</strong></a></p>\n  <p>美国密西西比州居民日前向法院起诉美国企业家埃隆·马斯克旗下的太空探索技术公司（SpaceX）及其新合并的xAI公司，原因是被告运营的一座为数据中心供电的发电厂持续发出噪音，让居民不堪其扰。6月9日对外公布的法庭文件显示，3名密西西比州居民代表1万多人向该州一家联邦法院提起集体诉讼，指控这两家公司未能采取措施遏制发电厂持续发出过大噪音，不仅给居民造成精神伤害，而且造成房产贬值等损失，要求企业作出赔偿。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846829988464897\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>世界杯奖杯价值较上届世界杯飙升157%</strong></a></p>\n  <p>根据伦敦证券交易所集团（LSEG）的分析，本届世界杯的纯金奖杯按今日金价计算价值约71.3万美元。自2022年以来，该世界杯奖杯的价值飙升了157%。按熔化价值计算，国际足联的世界杯奖杯位居世界体育奖杯榜首，远远超过欧洲冠军联赛、欧罗巴联赛和超级碗奖杯。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846848313543176\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</strong></a></p>\n  <p>何小鹏发出内部信，宣告自己将亲自下场直管机器人业务。何小鹏在内部信中称，小鹏人形机器人现在所处的阶段尤为关键，相当于8年前小鹏汽车即将完成第一款车G3发布的阶段，正站在量产交付的门槛上。按照何小鹏的规划：2026年第四季度，小鹏将实现人形机器人量产；2027年一季度，小鹏将人形机器人带入线下门店进行导购工作；2027年二季度，人形机器人将被推向海外市场；2028年，机器人将开始走向更多的家庭。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847027456870661\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>千问发布高考志愿填报Agent，免费提供志愿咨询</strong></a></p>\n  <p>36氪获悉，6月10日，千问上线高考志愿填报Agent，具备“志愿报告”、“志愿日历”、“志愿问答”三项核心能力，为考生免费提供志愿咨询服务。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847059940821511\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士最早将于8月在美国上市</strong></a></p>\n  <p>据透露，SK海力士计划最早于8月在美国上市，这家韩国存储芯片巨头希望借此抓住人工智能相关股票的强劲需求，并扩大其投资者基础。其中一位消息人士称，美国证券交易委员会（SEC）很可能在6月22日当周批准SK海力士的美国存托凭证（ADR）上市申请。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3846796951603459\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>阿里合伙人委员会内网发帖：钉钉管理“不是阿里文化该有的样子”</strong></a></p>\n  <p>36氪获悉，6月10日，阿里巴巴合伙人委员会在公司内网发布帖文《有情有义有成长，才是阿里文化》，对近日钉钉前产品经理离职长文《置身钉内》引发的讨论表达了清晰的态度。帖文以严厉的措辞批评了钉钉团队的管理方式，直接指出这\"不是阿里文化该有的样子\"。 此前，钉钉的管理风格曾多次引发外部讨论。合伙人组织进行了认真讨论并形成一致判断，强调\"无论什么情况下，无论任务多么紧迫\"都不应该出现这种管理，“这不是阿里文化倡导的方向”。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847017232927240\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>我国已建成五基空天地一体生态监测网络</strong></a></p>\n  <p>过去对河流环境污染的监控只能依靠人工巡查、定点监测，往往只能进行局部排查、问题的发现相对滞后。随着生态遥感科技的飞速升级，一套空天地一体化的智慧监测体系正在全面落地。五基一体化监测体系包括天基卫星、空基遥感、航空无人机、移动监测（巡护）车和地面观测设备。近期生态环境部启动空天地一体化的卫星研判系统，给水环境污染和生物多样性监测装上智慧的大脑。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3847001841846536\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>工信部：到2028年城域算力1毫秒时延圈覆盖率不低于75%</strong></a></p>\n  <p>36氪获悉，工信部印发《“人工智能+信息通信”创新发展实施意见（2026—2028年）》。实施意见提出，到2028年，人工智能与信息通信初步构建融合互促的创新发展格局。信息通信智能运营和服务能力达到国际先进水平，信息通信网络初步实现高等级自智，形成30个以上高价值典型场景，打造一批典型应用和特色智能体。网络、算力等信息基础设施支撑人工智能能力进一步提升，城域算力1毫秒时延圈覆盖率不低于75%。</p>", "category": "tech", "published_at": "2026-06-10T08:32:14+00:00", "fetched_at": "2026-06-11T03:32:04.896460+00:00", "fingerprint": "263710e0f5c8cfd9"}, {"source": "36氪 - 最新文章", "title": "雅典表发布2026新品系列，180周年之际加码机械创新与艺术合作｜最前线", "url": "https://36kr.com/p/3847339087140104?f=rss", "summary": "<p>2026年6月，上海敬华艺术空间被布置成一间“奇想实验室”。瑞士高级制表品牌Ulysse Nardin雅典表在此举办“奇想无界，创造无境”2026新品品鉴会，将全新[Super] Freak奇想超级腕表、与中国当代艺术家刘人岛合作的鎏金系列《名扬四海》联名腕表，以及多枚代表性时计一并陈列。</p>\n  <p>对这家1846年诞生于瑞士勒洛克的独立制表商而言，这是一个被精心挑选的时间点——品牌创立180周年，恰逢其标志性的FREAK奇想系列问世25周年。</p>\n  <p>在全球奢侈品消费整体承压、中国高端钟表市场进入结构性调整的当下，一个拥有180年历史的瑞士品牌，为何把重要的周年节点放在上海，又为何选择与一位以国画见长的中国艺术家联名？答案藏在产品结构与叙事策略的双线之中。</p>\n  <p>从商业结构看，这场品鉴会呈现的是一组“金字塔”式的产品组合。塔尖是作为周年献礼的[Super] Freak奇想超级腕表。据品牌介绍，新作历时四年研制，是世界上首款融合双陀飞轮与卡罗素结构的自动上链腕表，搭载自制UN-252机芯，由511个零件构成，融合8项专利技术，限量发行50枚，被雅典表称为“品牌制表史上最复杂的‘纯时间’腕表”。</p>\n  <p>据品牌披露，这枚腕表逾七成零部件经手工装饰打磨，约97.46%的机芯零件处于运动状态，并由同一位制表大师耗时60小时完成组装。塔身则是更具文化指向的《名扬四海》联名系列——《知音》《妙音》《玄曲》《悠雅》四款，均采用40毫米5N玫瑰金表壳与自制UN-320机芯，配备硅质游丝与擒纵机构，每款限量25枚，全系列共100枚。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_9f11b563a8184821812391bc5523840a@5922386_oswg83206oswg1350oswg900_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：品牌</p>\n  <p>高复杂度的“光环产品”负责确立技术与价格的天花板，文化联名负责打开本土市场的情感入口，这是高端制表品牌常见的组合打法。而联名的另一半——艺术家刘人岛，提供了这套叙事的东方落点。</p>\n  <p>刘人岛的履历横跨多个标签：把国画送上太空、在故宫办展、横跨“六艺”。但海洋对他而言原本是陌生题材。“我的老家在湖南新宁，属于‘八山半水’的内陆地区，”他回忆，真正看到海，是上大学后第一次外出写生时——一位女同学落水，他下水相救，连呛了几口海水。“当时海给我的感觉就是特别壮阔，无边无际���以及苍茫。”正是这种印象，催生了他后来《观沧海》等海洋题材的创作。</p>\n  <p>与雅典表的相遇带着偶然。据刘人岛讲述，2024年他在苏州举办个人画展，雅典表中国区负责人前来参观，对其山水与海洋作品产生兴趣，双方由此展开对话。更早的渊源则来自一段口述历史——他的朋友、瞿秋白的侄子曾向他提起，瞿秋白早年将收藏的雅典表典当，用以支持革命。</p>\n  <p>让双方“一拍即合”的，是一种关于“运动”的共识。“时间是一种流动，海洋也是在运动，雅典表的机芯也是一种运动中的状态，”刘人岛告诉36氪。雅典表以航海天文台钟起家，海洋是其品牌历史的精神源流；而在他的笔下，海则是东方语境里流动、包容、生生不息的意象。</p>\n  <p>被问及在这次合作中最希望被如何定义——“海洋画家”“太空艺术家”抑或其他，刘人岛给出的答案是“全能的画家”。</p>\n  <p>“艺术是相通的，”他说，画山水时碰到人就得画人，花鸟、山河、海洋、气候都要能驾驭，“画山水有大的气势，画海洋也要一种气势”。在他看来，全能意味着对整幅画的宏观把控，否则“画什么也只是一个局部”。这种“通”的自我定位，某种程度上与雅典表跨越机械结构、材料与时间显示方式的“破界”叙事形成了呼应。</p>\n  <p>联名系列的命名同样被刻意经营。英文“Make Waves”意为“造浪”，中文译作“名扬四海”。刘人岛称命名先于创作：“很多事情讲究的其实是一种‘缘’，它既是缘分，也是‘圆满’。”在他看来，地球上的各大洋本就圆融一体，四幅画作要表现的正是这种“圆”，其中既有海洋，也包含对四季轮回与人生的思考。四款表名亦取东西兼容之意：知音既指中国语境里的知己，也暗合钟表运转的声音；玄曲取“科学的最高境界是玄学”之意；悠雅之“雅”呼应“雅典”。</p>\n  <p>一个绕不开的技术与美学难题，是中国画的“留白”如何落到以精确为天职的表盘上。“海洋最难画的不是海的整体，而是浪，”刘人岛解释，浪花在阳光透射下晶莹剔透，若直接以白色涂抹，画面会“显得很板，没有灵动性”。他将海浪的生命力比作人的不同年龄阶段——幼年活蹦乱跳、中年奔放、晚年平静，“海最经典的状态，应该像我们人生一样，只有在生命力最奔放的时候，才是最美的时候”。据品牌介绍，雅典表的微绘大师将其原创水墨凝练于表盘，在毫米之间保留海浪的层次、光影与气韵。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_4a37cb7fd9644073aa4c2df12018ca60@5922386_oswg94902oswg1350oswg900_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：品牌</p>\n  <p>那么，这套用料不菲、产量极小的联名系列，瞄准的是谁？刘人岛的回答没有停留在“藏家”或“新中产”的标签上。“谁碰到它，能够把它当成自己的知己，那就是它的受众，”他说。在他的描述里，这四块表是表的理性机械与中国绘画感性之间的碰撞，最终指向“那些愿意去思考‘时间的形状究竟是什么’的人”——当指针扫过腕间浪涛，“感受到时间不是冰冷的刻度，而是奔涌不息的浪、是停在方寸的蓝”。</p>\n  <p>对雅典表而言，这种“东方知音”的叙事，是其更大版图中的一块。据品牌资料，自1846年起，Nardin家族历经五代，打造出广受多国海军信赖的航海时计，迄今累计获得超过4300项技术与设计大奖；2001年问世的FREAK奇想腕表以“无表冠、无指针、无表盘”重新定义机械腕表，其FREAK [ONE]曾摘得2023年日内瓦钟表大赏（GPHG）“最佳标志性腕表”奖项；品牌还与芝柏表联合创立独立制表体系，并在日内瓦、硅谷、迪拜与上海设有旗舰店。</p>\n  <p>从财经视角审视，这套组合折射出独立高端制表近年的一种共同选择：<strong>以极致复杂度与超低产量制造稀缺性，再借文化联名降低进入新兴市场的叙事门槛。</strong>100枚联名腕表与50枚超级腕表的发行量，决定了它们更接近“叙事载体”而非走量产品；其商业回报，既来自单品的高溢价，也来自周年节点上品牌资产的再确认。雅典表在品鉴会上未披露相关定价与销售目标，实际市场反响仍有待观察。</p>\n  <p>180年的航海传承与25年的“破界”叙事，如今在上海与一位中国艺术家的水墨相遇。这场相遇能否转化为持久的市场认同，仍需时间检验；但至少在方寸表盘之上，雅典表完成了一次东西方语汇的拼合。正如刘人岛所言，他要画的从来不只是海洋本身，“更关乎内观、流动与生命的节律”。</p>", "category": "tech", "published_at": "2026-06-10T13:35:14+00:00", "fetched_at": "2026-06-11T03:32:04.896454+00:00", "fingerprint": "e6de4b97bb55b558"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨世界杯门票遇冷，近18万张门票待转售；台积电释放涨价信号；但斌回应“被段永平拉黑”", "url": "https://36kr.com/p/3848000003953926?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>花旗警告：金价或跌至3500美元</li>\n   <li>韩国股市再度熔断</li>\n   <li>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</li>\n   <li>伊朗宣布对所有船只关闭霍尔木兹海峡</li>\n   <li>SpaceX认购资金超2500亿美元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>2026世界杯门票遇冷，近18万张门票待转售</strong></p>\n  <p>北京时间6月12日，2026年美加墨世界杯将举行揭幕战。目前，国际足联（FIFA）官方转售平台上挂牌出售的门票达17.6万张，主要集中在小组赛阶段。根据FIFA平台数据所做的价格与库存统计，不同球队之间的人气差异十分明显。例如，在伊朗队参加的3场小组赛中，仍有约1.6万张门票尚未售出，市场上最便宜的普通座位售价为138美元（约合934元人民币）。过去一个月，官方转售平台上的门票中位价已累计下跌20%。媒体测算显示，考虑到平台对转售交易收取26%的手续费，大多数转售卖家如今可能已处于亏损状态。对FIFA而言，若比赛出现大量空座将十分尴尬。先前，该机构将本届世界杯门票价格定得远高于往届，并表示此举符合当地市场环境。（财联社）</p>\n  <p><strong>台积电释放涨价信号</strong></p>\n  <p>台积电首席财务官（CFO）黄仁昭近日在接受媒体采访时表示，通货膨胀正在推高该公司的运营成本，并表示不排除对芯片提价的可能性。台积电生产由英伟达、AMD和苹果等公司设计的最先进芯片，因此任何价格涨价举措都可能波及人工智能基础设施的成本，并可能随着时间的推移，影响客户购买电子设备时的支付价格。虽然黄仁昭并未明确一定会提价，但他表示，“通胀确实导致了（我们的）成本上升。”不过，黄仁昭同时也表示，台积电不会突然涨价“四、五倍”。（财联社、科创板日报）</p>\n  <p><strong>但斌回应“被段永平拉黑”：一直非常尊重段总，他是否拉黑我不知道</strong></p>\n  <p>6月10日消息，日前，一篇题为《段永平和但斌的怨由》的网络文章在投资圈流传，文中详细叙述了知名投资人段永平与但斌之间多年来的“互动往事”，包括所谓“段永平早年点评但斌发基金”“段永平拉黑但斌”等情节。6月10日下午，但斌本人通过社交媒体正式回应，明确否认了文中若干关键说法。对于文中“段永平拉黑但斌”的描述，但斌回应称：“对段永平一直非常尊重。他是否拉黑我，我不知道，我理解应该是取消关注。为何取消关注，段总有他自己的看法，我觉得也没问题，个人性格决定，就像我从不拉黑任何人一样。对投资的判断，有分歧也正常，没什么大不了的。”并希望作者不要凭空捏造事实。据了解，但斌是东方港湾创始人、国内知名价值派私募大佬，因长期重仓茅台成名，著有投资经典《时间的玫瑰》，常被称作 “中国巴菲特”。（红星新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阿里云：下调容器计算服务ACS Agent Sandbox价格</strong></p>\n  <p>36氪获悉，阿里云发布容器计算服务ACS Agent Sandbox（default算力质量）降价通告，将于北京时间2026年6月15日12点起对该算力进行价格下调。本次降价调整仅涉及ACS Agent Sandbox（default算力质量），其他算力如ACS通用型（default、best-effort算力质量）、ACS性能型（default、best-effort算力质量）价格不变。</p>\n  <p><strong>Meta与安巴尼旗下的信实集团合作，在印度建设人工智能数据中心</strong></p>\n  <p>Facebook母公司Meta周三表示，已与印度亿万富翁穆克什·安巴尼旗下的信实工业集团达成合作，将在印度共建一座人工智能数据中心。声明称，信实工业将在古吉拉特邦贾姆纳加尔建设一座容量为168兆瓦的数据中心，Meta将租用该中心，并保留扩容选项。（新浪财经）</p>\n  <p><strong>SpaceX计划于2027年启动太空AI基础设施演示</strong></p>\n  <p>媒体援引两名出席投资者推介会的不具名人士报道称，SpaceX高管表示该公司正计划在2027年底前启动基于太空的人工智能（AI）基础设施的初步演示。在这两场投资者推介会上，SpaceX概述了计划于2027年开始展示轨道计算能力的路线图，总裁Gwynne Shotwell和首席财务官Bret Johnsen均有出席。SpaceX未立即回复置评请求。（新浪财经）</p>\n  <p><strong>博通联合阿波罗与黑石设立AI XPV平台，首期350亿美元支持Anthropic算力扩张</strong></p>\n  <p>博通6月9日宣布与阿波罗及黑石信贷与保险业务共同设立AI XPV平台，三方作为初始锚定投资方，目标是通过博通定制XPU及网络解决方案，在2028年前为Anthropic、OpenAI等前沿AI实验室部署逾20吉瓦算力。平台首期由阿波罗牵头、黑石联合注资350亿美元，用于支持Anthropic此前宣布的逾1吉瓦算力基础设施扩容计划，相关部署预计于2026年中起在Fluidstack站点落地。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>字节AI制药开启拆分融资，AI4S进入产业化阶段</strong></p>\n  <p>36氪独家获悉，字节跳动AI制药业务线已启动拆分与独立融资进程。据了解，拆分后字节仍将控股新公司，AI制药核心团队、核心算法、技术平台和已有管线资产将整体进入新主体。同时，该业务也将继续从火山引擎获得算力支持。新公司将由字节跳动AI制药团队主导负责。</p>\n  <p>据悉，字节AI制药团队成立于2021年，由刘凯负责，核心成员约50人，由AI4S算法人才和资深制药领域专家构成，该团队自成立起便承担着从基础模型研究到产业化的核心职能。</p>\n  <p>知情人士透露，此次进行业务拆分，是为了建立更符合该业务特征的独立</p>\n  <p>组织架构。</p>\n  <p><strong>香港超越瑞士，成为全球最大的跨境财富管理中心</strong></p>\n  <p>波士顿咨询公司（BCG）最新发布的《2026全球财富报告》显示，2025年，香港跨境财富记账规模上升10.7%至2.9万亿美元，首次超过瑞士，成为全球最大的跨境财富管理中心。BCG还预计，这一趋势将延续——到2030年，香港的跨境财富管理规模将以每年9%的速度增长，达到4.6万亿美元，持续领先全球。数据更显示，短短数年间，瑞士跨境财富管理资产规模从2020年的2.4万亿美元近乎腰斩至2025年的1.3万亿美元。（21世纪经济报道）</p>\n  <p><strong>微博回应追觅科技CEO俞浩被禁言</strong></p>\n  <p>微博平台官方账号“围脖侠”发文表示，经核实，账号@俞浩-爱送黄金 被某企业投诉，其作为网络名人账号以“喊话”等形式发布质疑、拉踩企业的违规内容，因违反中央网信办“清朗·优化营商网络环境 整治恶意炒作涉企信息”专项行动要求，在多个平台被责令予以禁言处置。请广大网友知悉原因、加强辨识，切勿轻信和传播不实信息。（界面新闻）</p>\n  <p><strong>亚马逊英伟达下场抢光纤，存储之后光纤成最紧缺AI硬通货</strong></p>\n  <p>据第一财经报道，继Meta、英伟达之后，亚马逊再度出手锁定光纤核心供应，全球AI算力军备竞赛正从算力层向底层物理传输介质全面蔓延。6月8日晚，亚马逊宣布与康宁签下数十亿美元长期光纤采购协议，用于连接美国快速扩张的数据中心。海外巨头的接连锁单动作点燃了A股资金热度，6月9日，光纤板块掀起涨停潮，太辰光、长芯博创分别大涨18.07%、12.13%，长飞光纤、亨通光电、中天科技等股涨停。继存储之后，AI浪潮掀起了一个又一个电子细分赛道的热潮，如今，被视为AI算力“血管”的光纤，正在迎来一轮历史性周期。（第一财经）</p>\n  <p><strong>今年前5月居民境外收入补税约130亿元</strong></p>\n  <p>6月10日，国家税务总局公开信息显示，税务机关持续加强高收入人员纳税引导规范，对个人所得税增长带来一定增收效应。比如，不断加强对居民个人境外所得的宣传引导和政策辅导，取得境外收入的纳税人遵从度明显提高，1—5月份累计补缴税款约130亿元；再如，持续强化文娱和网络主播领域的税收监管，通过大数据及时发现并纠正从业人员涉税问题，进一步提升了纳税人合规意识和纳税遵从。截至5月底，超过1.6亿人完成汇算申报，超过1.1亿人办理了退税。（第一财经、界面新闻）</p>\n  <p><strong>韩国股市再度熔断</strong></p>\n  <p>6月10日午后，韩国综合指数突然跳水，跌幅持续扩大，截至发稿，该指数跌超6%。韩国交易所启动熔断机制，暂停KOSPI程序化交易。此外，日经225指数跌超2%。热门个股方面，SK海力士跌超9%，三星电子跌超7%。（证券时报）</p>\n  <p><strong>花旗警告：金价或跌至3500美元</strong></p>\n  <p>黄金的下跌速度超过了市场的预期。6月10日早间，现货黄金击穿4200美元关口，最低跌至4172.64美元/盎司，创3月23日以来新低。截至15:20，现货黄金日内下跌1.4%报4199.57美元/盎司，今年的涨幅悉数抹平，目前累计跌超2%。国内金饰价格也在跳水。6月10日，国内首饰金已经跌破1300元/克，较1月29日的阶段高点1713元/克，跌幅超过400元/克。（21世纪经济报道）</p>\n  <p><strong>亚瑟士计划分拆旗下鬼冢虎业务</strong></p>\n  <p>日本运动用品制造商亚瑟士6月10日宣布，将旗下品牌鬼塚虎转移至亚瑟士全资子公司OT GROUP，生效日期暂定为2027年1月1日。同时，亚瑟士决定将各区域运营公司的鬼塚虎业务剥离，并重组为OT GROUP的子公司。（界面新闻）</p>\n  <p><strong>香港宣布全体公务员加薪2%&nbsp;</strong></p>\n  <p>6月9日，香港特区政府公务员事务局局长杨何蓓茵在记者会上表示，香港特区行政长官李家超会同行政会议在当天会议上讨论了公务员的薪酬调整，决定向公务员职方提出2026年至2027年度香港全体公务员的薪酬划一向上调2%，生效日期追溯至2026年4月1日。（南方日报报道）</p>\n  <p><strong>马斯克旗下企业SpaceX及xAI被告扰民，1万多人提起集体诉讼</strong></p>\n  <p>美国密西西比州居民日前向法院起诉美国企业家埃隆·马斯克旗下的太空探索技术公司（SpaceX）及其新合并的xAI公司，原因是被告运营的一座为数据中心供电的发电厂持续发出噪音，让居民不堪其扰。6月9日对外公布的法庭文件显示，3名密西西比州居民代表1万多人向该州一家联邦法院提起集体诉讼，指控这两家公司未能采取措施遏制发电厂持续发出过大噪音，不仅给居民造成精神伤害，而且造成房产贬值等损失，要求企业作出赔偿。（新华社）</p>\n  <p><strong>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</strong></p>\n  <p>何小鹏发出内部信，宣告自己将亲自下场直管机器人业务。何小鹏在内部信中称，小鹏人形机器人现在所处的阶段尤为关键，相当于8年前小鹏汽车即将完成第一款车G3发布的阶段，正站在量产交付的门槛上。按照何小鹏的规划：2026年第四季度，小鹏将实现人形机器人量产；2027年一季度，小鹏将人形机器人带入线下门店进行导购工作；2027年二季度，人形机器人将被推向海外市场；2028年，机器人将开始走向更多的家庭。（第一财经）</p>\n  <p><strong>伊朗宣布对所有船只关闭霍尔木兹海峡</strong></p>\n  <p>当地时间6月11日凌晨，伊朗武装部队哈塔姆·安比亚中央司令部发表声明称，鉴于本地区安全局势动荡，霍尔木兹海峡即日起对包括油轮和商船在内的所有类型船只关闭，任何试图通过该海峡的船只都将受到攻击。（央视新闻）</p>\n  <p><strong>星巴克据悉考虑日本业务相关选项，包括出售股权和IPO</strong></p>\n  <p>据多位知情人士透露，星巴克正在考虑日本业务的相���选项，其中包括出售股权。此前，该公司已出售中国业务的多数股权。知情人士称，这家美国咖啡连锁巨头已与投资银行进行了初步磋商，以帮助确定日本业务的处理方式。知情人士因相关讨论未公开而不愿具名。日本是星巴克最大的市场之一，约有2,100家门店，其中大多数由星巴克直接运营。部分知情人士称，出售股权的估值可能在4000亿日元至5000亿日元，并可能吸引其他行业参与者和私募股权公司的兴趣。他们说，将日本业务IPO也是一个选项。知情人士补充称，相关考虑仍处于初步阶段，尚未作出最终决定。（新浪财经）</p>\n  <p><strong>韩IT巨头Kakao工会史上首次启动局部罢工</strong></p>\n  <p>据报道，韩国IT巨头Kakao工会于6月10日启动公司史上的首次局部罢工。参加罢工的包括Kakao总部和Kakao Pay、Kakao Enterprise、Dk Techin、XLGAMES四家子公司。工会方面表示，有1500余名员工参与罢工，其中总部员工约1000余人。据了解，Kakao劳资双方围绕绩效奖金发放标准现分歧。劳方要求资方将营业利润的13～14%用作绩效奖金发放，不将限制性股票单位（RSU）算进绩效奖金。资方则主张劳方相关诉求对公司经营造成负担。（界面新闻）</p>\n  <p><strong>微信上线朋友圈搜索功能</strong></p>\n  <p>腾讯微信官方账号“微信派”发文，正式官宣朋友圈搜索功能。点击“我-朋友圈”，右上角搜索入口，输入关键词，就能精准搜到曾经发过朋友圈。（界面新闻）</p>\n  <p><strong>三星考虑新建先进芯片封装厂，以满足全球芯片需求</strong></p>\n  <p>三星电子考虑在韩国光州建设先进半导体封装工厂，以满足全球芯片需求。三星正扩大HBM市场布局，以加强其在AI芯片供应链中的地位。预计三星将在6月29日韩国总统与企业集团负责人会议上公布投资计划。（财联社）</p>\n  <p><strong>美国5月CPI同比涨幅“破4”，美联储年内加息概率上升</strong></p>\n  <p>美国劳工部10日发布的数据显示，受能源价格上涨推动，美国5月消费者价格指数（CPI）同比上涨4.2%，创2023年5月以来新高。剔除食品和能源价格后，美国5月核心CPI同比上涨2.9%。</p>\n  <p>分析人士认为，上周五远高出预期的非农数据已令市场降息预期消退，芝商所“美联储观察工具”显示，美联储年内加息25个基点的预期概率已升至约43%，并且不排除年内累计加息50个基点的可能。（央视财经）</p>\n  <p><strong>香港证监会：香港持牌公司可继续为存量内地客户提供服务，但不能在内地境内提供</strong></p>\n  <p>6月10日，香港证监会就5月22日通函进一步进行解读。通函中的常见问题（九）提到，香港持牌公司可继续为中国内地投资者（即以中国居民身份证及/或中国护照作为身份证明文件的投资者）开立新账户，但必须符合所有开立账户规定。香港证监会对此表示，香港持牌公司可继续为现有的中国内地客户提供服务，前提是有关服务并非在中国内地境内提供，且其已遵守香港及适用司法管辖区的一切相关法律及监管规定。香港证监会还表示，其注意到中国内地当局于2026年5月22日联合发布的通知，其相关要求亦适用于其他司法管辖区（即不限于香港）的金融机构在向中国内地投资者提供服务时的相关活动。（界面新闻）</p>\n  <p><strong>世界杯开幕在即，啤酒股集体拉升</strong></p>\n  <p>世界杯开幕在即，A股市场啤酒股10日集体上涨。截至午盘，其中，惠泉啤酒涨停，珠江啤酒、燕京啤酒涨超5%，重庆啤酒涨超2%。中银证券表示，从板块基本面来看，2025年第二、三季度受现饮场景限制及需求端疲软影响，啤酒量价边际走弱，低基数下，叠加高温天气及世界杯赛事催化，2026年第二、三季度行业报表端收入增速有望得到修复改善。（第一财经）</p>\n  <p><strong>三星和海力士据悉或将宣布韩国投资计划</strong></p>\n  <p>据报道，三星电子和SK海力士正处于对韩国各地区投资计划进行最终审查的阶段，最早可能在本月发布公告。这两家芯片制造商可能在韩国西南部和中部扩大设施投资。相关投资或包括封装设施，亦有猜测可能会建设半导体晶圆厂。（财联社）</p>\n  <p><strong>张雪回应张雪机车是否有上市计划：顺其自然</strong></p>\n  <p>在中国摩托车产业高质量发展圆桌会议期间，张雪机车有限公司董事长张雪与媒体对话。被问及张雪机车有没有登陆资本市场的相关规划，张雪表示：“顺其自然”。（新浪财经）</p>\n  <p><strong>美股三大指数集体收跌，特斯拉跌超3%</strong></p>\n  <p>36氪获悉，6月10日收盘，美股三大指数集体下跌，道指跌1.87%，纳指跌1.98%，标普500指数跌1.62%。大型科技股跌多涨少，Arm跌超5%，英伟达、特斯拉跌超3%，亚马逊、Meta、亚马逊、谷歌跌超2%，微软跌超1%；苹果、奈飞小幅上涨。热门中概股涨跌不一，网易涨超3%，B站涨超2%，腾讯音乐涨超1%，微博小幅上涨；小鹏集团跌超4%，阿里巴巴跌超3%，理想汽车跌超2%，蔚来跌超1%，京东、爱奇艺跌近1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>SpaceX认购资金超2500亿美元</strong></p>\n  <p>美东时间6月9日，据消息人士透露，埃隆·马斯克的SpaceX已吸引超过2500亿美元的认购需求，远超该公司计划筹集的750亿美元，这将使其成为有史以来规模最大的IPO。消息人士称，此次SpcaceX融资的超额认购率已达计划发行规模的三到四倍。银行家和投资者认为,这一迹象表明投资者对SpaceX的需求强劲。6月11日下午，SpaceX预计将公布IPO定价，而投资者需求在那之前仍可能发生变化。</p>\n  <p><strong>SK海力士最早将于8月在美国上市</strong></p>\n  <p>据透露，SK海力士计划最早于8月在美国上市，这家韩国存储芯片巨头希望借此抓住人工智能相关股票的强劲需求，并扩大其投资者基础。其中一位消息人士称，美国证券交易委员会(SEC)很可能在6月22日当周批准SK海力士的美国存托凭证（ADR）上市申请。（新浪财经）</p>\n  <p><strong>新易盛：筹划发行H股并在香港联交所上市</strong></p>\n  <p>36氪获悉，新易盛公告，公司第五届董事会第十四次会议审议通过发行H股股票并在香港联交所主板上市的议案。此举旨在提高资本实力和综合竞争力，提升国际影响力。该事项尚需提交股东会审议，并需经证监会备案及香港联交所、香港证监会核准，存在不确定性。</p>\n  <h2>投融资</h2>\n  <p><strong>“巴泰医疗”完成近2亿元D轮融资</strong></p>\n  <p>36氪获悉，近日，“巴泰医疗”宣布完成近2亿元D轮融资，本轮融资由创东方投资领投，浙江省“4+1”生物医药与高端器械产业基金、倚锋资本、中益仁资本及个人产业投资人共同跟投，原有股东君行健资本持续加码，启峰资本提供融资支持。本轮融资将主要用于巴泰医疗的第三代约束型药物球囊商业化推广和临床证据积累、拓建新一代智能生产基地、后续血管介入创新产品研发等用途。</p>\n  <h2>酷产品</h2>\n  <p><strong>无线芯片，嵌入单晶金刚石后突破散热瓶颈&nbsp;</strong></p>\n  <p>美国麻省理工学院研究团队给氮化镓芯片嵌入一层超薄单晶金刚石，突破了高功率无线芯片散热瓶颈，并制备出性能创纪录的无线功率放大器，为6G通信、卫星互联网等高功率电子设备提供了新的芯片级热管理方案。相关成果在2026年IEEE国际微波研讨会上发布。硅是目前绝大多数芯片的基础材料，但其功率承载能力存在天然限制，难以满足未来高速无线通信对性能和能效的要求。相比之下，氮化镓具有更高的功率密度和工作频率，被视为6G通信、高功率雷达和卫星通信的重要候选材料。（科技日报）</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-10T23:48:20+00:00", "fetched_at": "2026-06-11T03:32:04.896446+00:00", "fingerprint": "fa9b0f043d9e20f4"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 创维独家投资数千万，这家企业将碳化硅切割损耗降至40微米内", "url": "https://36kr.com/p/3848094835217666?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，高端工业激光装备制造商——中微精仪科技（深圳）有限公司（下称“中微精仪”）近期已完成数千万元天使+轮融资，由创维投资独家投资。资金将主要用于市场拓展、产能提升及新产品开发。</p>\n  <p>中微精仪成立于2024年11月，专注于碳化硅晶锭激光剥离、金刚石激光剥离、水导激光精密加工等高端工业激光装备的研发与制造。公司创始人陈景煜为澳大利亚新南威尔士大学研究员，长期从事特种芯片集成开发；首席科学家孙洪波则为中国科学院院士、清华大学教授，是非线性激光超精密制造领域的先驱。</p>\n  <p>与市面上多数激光设备公司不同，中微精仪定位为激光精密加工技术平台，覆盖从机理研究、工艺开发到工程化落地的全链条。其设备已在碳化硅衬底切割、金刚石加工等领域进入头部客户量产验证阶段。</p>\n  <p>公司当前的核心业务聚焦两大方向：</p>\n  <p>一是碳化硅衬底激光分片设备。中微精仪自研的脉冲可编程与裂纹定向诱导生长技术，已能将分片损耗稳定控制在40微米以内，远低于行业常见的80-120微米水平。</p>\n  <p>当前，碳化硅行业正经历从6英寸向8英寸产线升级的关键窗口期。据陈景煜判断，近两年下游需求端正在快速扩张，数据中心电源对碳化硅器件的需求显著增加，消费电子领域如空调、冰箱等产品也开始采用碳化硅功率器件替代传统硅基器件。</p>\n  <p>然而，行业仍面临核心瓶颈。随着8英寸碳化硅成为行业降本主线，衬底切割环节的损耗率成为关键卡点。</p>\n  <p>据公司实测，其6英寸碳化硅分片速度为15-20分钟，8英寸为25-30分钟。中微精仪相当于每切割8片即可多产出1片，为客户带来显著的降本增效。</p>\n  <p>同时中微精仪的激光技术可以实现低损耗控制，在SiC晶圆背板减薄领域可以实现突破性应用，可以替代SiC晶圆背板减薄研磨抛光工艺，帮助SiC晶圆厂商实现降本增利，由以前研磨成粉末，变化为激光剥离，实现SiC剥离片二次利用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_7e868e926c124d119ee28af4cb97a1dd@6221844_oswg48325oswg667oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中微精仪团队手持由自主研发SiC激光剥离设备加工的6英寸、8英寸及12英寸SiC晶圆（图源/企业）</p>\n  <p>二是金刚石激光加工设备。针对单晶/多晶金刚石的剥离、切割与抛光，中微精仪实现了磨砂面白色加工效果，避免了友商常见的材料表面石墨化发黑问题，从而省去了后续研磨工序，可直接用于再生长。</p>\n  <p>此外，陈景煜透露，中微精仪将于今年七至八月份启动量子芯片加工器件的客户交付。这一业务延伸验证了中微精仪作为激光精密加工技术平台的可扩展性——从超硬材料切割延伸至量子计算核心元器件的加工。</p>\n  <p>公司目前已收到多家头部客户的进场邀约，预计6月起陆续进入更多产线进行Demo验证。</p>\n  <p>作为本轮独家投资方，创维投资已在碳化硅产业链上下游布局多家企业。中微精仪创始人陈景煜表示，创维投资所投企业覆盖了衬底、外延、器件等关键环节，能够有效帮助公司将设备与下游客户直接对接。</p>\n  <p><strong>以下是硬氪与陈景煜的访谈摘要：</strong></p>\n  <p><strong>硬氪：碳化硅行业目前竞争激烈，公司如何在这个节点找到机会？</strong></p>\n  <p><strong>陈景煜：</strong>6寸碳化硅现在卖一片亏一片，整个产业链环节能降本的地方全降了，唯独切割环节的损耗一直控不下来。从线切割的250微米降到激光切割的80微米已经是一大步，但我们把损耗降到40微米以内，仍然可以进一步控制在30微米以内，预示客户每切8片就最少能多出1片，这是他们现在最需要的竞争力。随着8寸线马上大规模上量，切割损耗会成为决定谁胜出的关键。</p>\n  <p><strong>硬氪：公司如何看待8英寸碳化硅时代的市场窗口？</strong></p>\n  <p><strong>陈景煜：</strong>今年下半年预计是8寸线建设的元年。头部客户的环评已经拿到了，基建陆续启动，设备选型正在发生。8寸片的核心目的就是降成本，如果切割环节损耗控不下来，8寸的优势就发挥不出来。所以这个窗口对我们来说是决定性的。</p>\n  <p>我们能稳定把损耗控制在40微米以内，而且设备进场当天就能跑量产，这些都非常重要。现在不是我们找客户，是客户在催我们进场。</p>\n  <p><strong>硬氪：从碳化硅到量子芯片，公司的技术边界在哪里？</strong></p>\n  <p><strong>陈景煜：</strong>我们不是一个做碳化硅切割设备的公司，而是一个激光精密加工的技术平台。团队核心能力是把不同激光与不同材料的相互作用机理研究透——切碳化硅、切金刚石、用量子芯片加工，底层都是同一套能力。公司实验室目前已经完成了12寸硅片的超薄切片验证，损耗可控制在1微米以内。平台搭好了，应用场景只是不同的输出。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>创维投资负责人表示：</strong>目前全球SiC衬底处于高速扩产和6寸向8寸迈进的产业周期，传统的切割方式难以满足产业升级的要求，2026年8寸线产业化正在加速发展。长期以来，上游环节的工业激光切割设备一直被国外企业垄断，高度存在被“卡脖子”风险。中微精仪现已推出相关产品，并且获得了重要客户的订单，这是源于团队掌握超快冷激光切割设备最核心的光路调控技术，从机理探索、工艺开发、光学优化、系统设计四个方面具备完全自主可控的能力，具有未来良好的发展前景。</p>", "category": "tech", "published_at": "2026-06-11T01:24:41+00:00", "fetched_at": "2026-06-11T03:32:04.896438+00:00", "fingerprint": "421941d9b570e56a"}, {"source": "36氪 - 最新文章", "title": "浪往南走：今年盛夏，WAVES来到番禺", "url": "https://36kr.com/p/3848188076381187?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_0e103d4a145e4eeeb2f68b9ef803d7c5@6381723_oswg553734oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_c3c73f00638e4a3bba6e4328cca430e2@6381723_oswg798oswg900oswg60_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>浪来了，你到不到？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_a76d589dae044586be857f0e035b15ac@6381723_oswg269oswg900oswg80_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>WAVES是36氪每年夏天最重要的一场会。</p>\n  <p>但它不仅仅是��个“会”。</p>\n  <p>从2023年北京金海湖碧波岛的草坪，到2024年郎园Station的市集，到2025年良渚五千年的夜空下——WAVES每年都在找一个地方，把36岁以下最值得关注的创业者和投资人放在同一个空间里。没有红毯，没有礼服，没有人念稿。白天是圆桌和碰撞，晚上是脱口秀、AI集市和珠江边的清风。</p>\n  <p>今年盛夏，WAVES第一次来到珠江边——广州市番禺区，良仓·新造创意园。</p>\n  <p>为什么是番禺？</p>\n  <p>不是因为场地大。是因为番禺本身就是一片正在翻涌创新创业的投资热土。</p>\n  <p>SHEIN从番禺的服装工厂里长出来，长成了全球第四大独角兽。小鹏汇天深耕番禺造飞行汽车。广汽埃安从这里出发，三年目标2000亿产值。番禺全区现有规上企业5000多家，服务业企业1100多家，3家千亿级企业，29家上市公司。全区2025年GDP3150.66亿元。</p>\n  <p>但更重要的是——番禺的“2104”产业体系里，有3个未来产业：具身智能、智能无人系统、前沿新材料。</p>\n  <p>这恰好是今年WAVES所有圆桌最密集的赛道。</p>\n  <p>这不是巧合。当36氪决定把WAVES带到南方的时候，番禺是那个“产业底色和大会内容天然咬合”的地方。WAVES聊的事，番禺正在全力招商引资。</p>\n  <p>浪往南走了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_23bf9b3a1d764fb18221dd9cdacf4685@6381723_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>番禺：历史文化底蕴厚重</strong></p>\n  <p>这句话不是口号，是事实。</p>\n  <p>番禺设县于秦代，距今2200多年，是岭南文化的重要发源地、广东音乐之乡、著名侨乡和海上丝绸之路起点之一。</p>\n  <p>今天的番禺，是粤港澳大湾区的地理中心。529平方千米土地上，住了330多万人。它同时拥有三张别人很难复制的牌：</p>\n  <p>第一张牌叫交通。广州南站，全国客流量第一的高铁站，2025年到发旅客超1.75亿人次，日均峰值92万。从南站出发，33分钟到白云机场，11分钟到琶洲。5条城际铁路、8条地铁线路在这里交汇。番禺是广州地铁里程最长的区，也是能最快抵达白云、香港、深圳三个国际机场的区域。</p>\n  <p>这意味着什么？意味着你在番禺落地，你的投资人、你的客户、你的供应链伙伴，从全国各地过来，都在一小时圈内。</p>\n  <p>第二张牌叫产业密度。3家千亿级企业（海大集团、广汽集团、SHEIN），4家独角兽（埃安、希音、小鹏汇天、探迹），50多个国家级专精特新企业，1900多个国家高新技术企业。灯光音响占全国48%市场份额，珠宝占港澳市场70%。这不是一个“有产业”的区，这是一个产业浓度极高的地方——上下游都在身边，从工厂到出海港口的距离，比别人短。</p>\n  <p>第三张牌叫人才。广州大学城在番禺。12所高校，20多万师生，73名院士。这是全国高校学生数量最多的大学城，也是国家未来产业科技园的所在地。紧邻大学城的东西庄科技创新集聚区，产业用地正在释放。狮子洋智造创新园已经入驻了100多个战略性新兴产业项目。</p>\n  <p>人才、空间、产业，番禺三张牌同时摊在桌面上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_57e8b1a459c8494ab5478d0a10e7733e@6381723_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>&nbsp; &nbsp;番禺招商政策，</strong></p>\n  <p><strong>用明确的数字展示诚意</strong></p>\n  <p>番禺的招商政策有一个特点：不藏着掖着，数字直接摆出来。</p>\n  <p>人才政策是最大的亮点。不是“绿色通道”“优先办理”这种虚的，是真心实意的：</p>\n  <p>创新创业领军团队：单个项目最高1000万元经费支持</p>\n  <p>杰出产业人才：最高500万元</p>\n  <p>博士落户：最高10万元</p>\n  <p>人才服务卡分三级：白金卡（120㎡五年全免租金）→金卡（90㎡两年半价）→银卡（45㎡两年八折）。</p>\n  <p>对世界级科学家团队、全球顶尖战略科学家、“卡脖子”攻关人员、生物医药顶尖项目（市级最高50亿元全链条支持）——纸面上的数字已经是天花板，但真正重量级的项目来了，天花板之上还有空间。</p>\n  <p>AI和机器人赛道，省市政策叠加。番禺的“2104”体系把具身智能列为三大未来产业之首，省级政策给到国家级制造业创新中心最高5000万元、工业AI标杆项目最高800万元、开源社区最高800万元。专精特新“小巨人”企业，省奖100万+市奖100万+区再奖，三级叠加最高300万元。</p>\n  <p>租金减免也是实打实的。国转中心入驻项目前三年全免，第四五年减半。科技成果交易平台按成交额1%补贴，每年最高500万元。</p>\n  <p>一句话总结：番禺的政策逻辑是——用真情实意抢人，用空间换项目落地，用省市叠加放大AI赛道的吸引力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_13f385ad58954110b576738404325d16@6381723_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>&nbsp; 跟随WAVES来到番禺，</strong></p>\n  <p><strong>你能得到什么</strong></p>\n  <p>今年盛夏，WAVES 2026会期两天——6月16日至17日，广州番禺，良仓·新造创意园。</p>\n  <p>如果你是投资人或创业者，WAVES的议程里有你关心的所有议题：</p>\n  <p>出海圆桌——“迎风而立的人”，投资人和企业一起聊出海的真实水位</p>\n  <p>AI+医疗圆桌——从工具到处方，谁来为AI医疗买单</p>\n  <p>具身智能圆桌——FA和企业对谈，百亿估值与真实落地</p>\n  <p>AI Native圆桌——投资人们聊旧常识崩塌之后的新规则</p>\n  <p>中国AI的真实坐标——蓝驰创投×00后创业者的深度对谈</p>\n  <p>早期投资专场——“我们永远赞美冒险”，更小、更早、更水下</p>\n  <p>......</p>\n  <p>两天时间里，数十位Under36创业者和投资人站上台，台下是数百位36氪读者、投资机构合伙人、企业创始人和行业观察者。</p>\n  <p>如果你对番禺感兴趣，WAVES还准备了一整套对接机制：</p>\n  <p>番禺产业空间对接——如果你正在为团队找办公空间或生产基地，狮子洋专精特新聚集区、广州大学城、万博商务区、广州南站商务区都有优良的载体资源，番禺的工作人员会直接和你聊具体条件</p>\n  <p>番禺招商政策咨询——人才补贴、租金减免、现场有专人答疑，不需要你先跑三趟政府窗口</p>\n  <p>WAVES之夜社交——16日晚间的珠江边，Under36颁奖、青年脱口秀、AI集市、番禺美食、江边摩托车试骑。没有人穿西装，所有人都在同一个不设防的空间里。你端着酒走过去，可能遇到的下一个对话对象，就是你的下一个投资人、下一个合作伙伴、或者下一个合伙人</p>\n  <p>这不是“听完会就走”的行程。番禺给了空间和政策，WAVES给了内容和人。剩下的事，发生在江边的晚风里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_1c645835aa8d49dd82601ee7026f1cc6@6381723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>报名</strong></p>\n  <p>如果你是投资人、创业者或企业决策者，想在WAVES 2026期间与番禺进行产业对接、政策咨询或空间考察，请填写以下信息。</p>\n  <p>所填信息仅用于番禺区招商对接，填写即视为默认接受番禺工作人员联系。</p>\n  <p>意向参与番禺招商对接，点击<a href=\"https://jsj.top/f/NA2gwy\" rel=\"noopener noreferrer\" target=\"_blank\">https://jsj.top/f/NA2gwy</a>即可填报报名。</p>\n  <p>今年盛夏。珠江边上。浪来了，你到不到？</p>\n  <p><strong>WAVES 2026&nbsp;· 今年盛夏 · 6月16日-17日</strong></p>\n  <p><strong>广州番禺 · 良仓·新造创意园</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_ccd76b6745bf4440a912e4391195acde@6381723_oswg4950oswg1080oswg72_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_ae9d9ea427794cf599549b0551052385@6381723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_06cfc13925d74043ade474 00:00+00:00", "fetched_at": "2026-06-10T02:57:12.070384+00:00", "fingerprint": "a5d264170ec25559"}, {"source": "The Verge", "title": "The App Store is going to add subscription bundles soon", "url": "https://www.theverge.com/tech/947365/apple-subscription-bundles-app-store", "summary": "Later this year, you will be able to get bundled subscriptions for iPhone apps, as Apple announced it's expanding App Store bundles so they can include offers from different companies. It's similar to streaming video bundles that have combined offers for Apple TV and Peacock, but it also could put together subscriptions for completely different [&#8230;]", "category": "tech", "published_at": "2026-06-09T21:30:48+00:00", "fetched_at": "2026-06-10T02:57:12.070379+00:00", "fingerprint": "0b846f59b96dc797"}, {"source": "The Verge", "title": "Congress just gave DHS another $70 billion", "url": "https://www.theverge.com/policy/947146/dhs-funding-congress-budget-reconciliation", "summary": "Congress narrowly voted to fund President Donald Trump's mass deportation agenda, giving the Department of Homeland Security $70 billion over the next three years. The house voted 214 to 212 in favor of the reconciliation bill Tuesday, following the Senate's 52-47 vote last Friday morning. The vote fell largely along party lines. Sen. Lisa Murkowski [&#8230;]", "category": "tech", "published_at": "2026-06-09T21:34:46+00:00", "fetched_at": "2026-06-10T02:57:12.070372+00:00", "fingerprint": "e633dbcce15d39b6"}, {"source": "The Verge", "title": "I tried Siri AI, and so far it actually works", "url": "https://www.theverge.com/tech/947432/siri-ai-apple-intelligence-ios-27-wwdc", "summary": "Parents want one thing, and one thing only, out of AI: to add a list of soccer games or \"spirit week\" theme days from an email or a poorly formatted flyer onto their calendar in one shot. And I have good news for parents with iPhones - the new Siri can finally do this. After [&#8230;]", "category": "tech", "published_at": "2026-06-09T23:43:00+00:00", "fetched_at": "2026-06-10T02:57:12.070362+00:00", "fingerprint": "2d625475d7ee0e30"}, {"source": "36氪 - 最新文章", "title": "在反外挂前线，游戏厂商开启了“军备竞赛”", "url": "https://36kr.com/p/3846046471277059?f=rss", "summary": "<p>“破坏公平，就该受到惩罚”，这几乎是所有人心中的共识。</p>\n  <p>但在聚集了数千万乃至上亿参与者的游戏竞技场里，作弊行为的边界却显得模糊。</p>\n  <p>在网络游戏领域，作弊有一个更广为人知的称呼：“开外挂”。它包含一切通过非官方允许的外部程序或硬件，获取超过正常玩家所拥有的信息与操作能力的行为。而在涉及游戏的场景中，外挂往往不包含在单机游戏里使用数据修改器，而是特指多人竞技游戏中的透视、自瞄等工具。</p>\n  <p>当下互联网除了外挂开发者，还有一部分内容创作者也把“外挂”作为有噱头的传播素材，获取流量，甚至是给外挂打广告，做宣传。</p>\n  <p>比如在一些深夜的直播间里，摸金玩法游戏的“寻宝鼠”类主播会持续向观众展示“自己如何利用物资透视外挂，在地图中精准搜集各个高价值物品”。这种展示将开挂包装成了娱乐化的猎奇景观，弱化了反外挂一事的严肃性，也让游戏厂商打之不尽。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_af3a7ced51f24d859d3f865ff2a46c84@16519798_oswg78298oswg1080oswg794_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">物资透视可以直接显示地图上的物品信息</p>\n  <p><strong>毕竟，外挂开发者持续获客的手段之一，就是主动降低潜在用户的心理门槛。</strong>除了制造噱头获取流量，他们往往还会在社交平台、电商渠道、私域社群中包装产品，称其为“辅助工具”“稳定插件”，从而模糊其非法属性。</p>\n  <p>目前，外挂使用群体的基数，也正随着国内玩家总量变大而增多。每当市场出现一款现象级游戏，外挂开发者就会在极短时间内完成响应，从而迅速牟取暴利。数年前的PUBG，当下的《三角洲行动》，基本都经历过“游戏爆火而外挂激增”的情况。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_5e26859a5ea54b21bafd1d3caaf98573@16519798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">也有不少UP主分享自己碰上外挂的经历</p>\n  <p>据《2025游戏安全白皮书》统计，如今手游外挂功能的打击量在过去8年间增长了148倍。同时，PC端的外挂样本在一年内首次突破10万例，同比增幅达124%。也就是说，外挂的供给和需求量，都在不断扩大。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_01b0ecec29af4d6986167ab3a19b3f83@16519798_oswg127034oswg1080oswg467_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《2025游戏安全白皮书》统计数据</p>\n  <p>这里面有不少使用者，更多是对外挂的法律性质和黑产关联缺乏客观认知。他们未必清楚，每一次使用行为都会为下游的黑产链条提供现金流，从而客观维持了外挂市场的低门槛运转。</p>\n  <p>如今，外挂本身早已不是单独的个人开发行为，而是一整套关乎庞大利益的黑色产业链。在6月8日举行的第八届游戏安全行业峰会上，中国音像与数字出版协会常务理事长敖然提及，“当一个产业的参与者以‘亿’为单位计算的时候，它的安全问题，就不再只是一个技术问题，而是关乎数字经济秩序、关乎网络空间治理、关乎广大玩家切身利益的公共议题。”</p>\n  <h2><strong>01 没有硝烟的战争</strong></h2>\n  <p>外挂与反外挂的关系，目前早已彻底脱离纯粹的技术维度，更像一场游戏官方与黑产之间的持续攻防战。双方会在技术、运营、法律，乃至舆论等多个维度反复对抗。</p>\n  <p><strong>于厂商而言，反外挂本质是一个投产比难以量化的“苦差事”。</strong>它要求项目组在基础研发之外，消耗一定成本配置安全团队，并投入服务器资源用于实时监测与回溯分析，从而搭建独立的取证与处理流程。</p>\n  <p>这些成本很难直接转化为收入，也被玩家认为是一件“理所应当”的事情。说白了，做好了没奖励，做差了有惩罚。</p>\n  <p>《APEX英雄》就是输在游戏安全问题的典型案例。这款由重生工作室开发、EA发行的FPS游戏，在2019年上线后迅速走红，同时也被外挂开发者盯上。在游戏热度最高的阶段，玩家频繁遭遇加速、自瞄、透视等外挂，最夸张的时候还能碰上飞天、子弹追踪等情况。</p>\n  <p><strong>更严重的是玩家心态的转变。</strong>随着持续遭遇外挂，部分玩家的反应会从最初的愤怒，转向“碰到外挂很正常”这种妥协的表述，进一步对产品本身的公信力失去信心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_b9af8620c5774beaac3fad796e97de30@16519798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">APEX至今都能看到暴力修改数值的外挂</p>\n  <p>最终，《APEX英雄》走进了一段死循环里：玩家因外挂流失，游戏热度下降，从而直接导致外挂减少。而当玩家因外挂减少回流，游戏热度重新上升，那么外挂又会随之变多。</p>\n  <p>重生工作室能做的，就只有在更被动的情况下追加投入，去补全本应前置的反外挂体系。</p>\n  <p>而在外挂黑产这侧，进化的脚步却从未停止。外挂黑产现在已经形成了一条分工明确、结算隐蔽的完整链条。其中，上游团队负责核心功能研发，通常隐匿在海外，从而规避国内执法管辖；中游的分销商通过无法被审查的即时通讯工具，向下级代理分发产品，同时提供教学及售后服务；支付环节则普遍使用虚拟货币结算，如比特币、USDT等，切断了资金追溯路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_1ffe8941e3b34edd8b5e8724d6894e9c@16519798_oswg448005oswg1080oswg595_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">外挂售卖并不是新鲜事</p>\n  <p>而用户所使用的终端，基本已经抛弃一次性买断模式，转向订阅制，用户按周或按月付费，持续为外挂开发者提供现金流。而基于此模式，外挂开发者也能不断应对官方推出的反作弊更新，持续保证产品可用。</p>\n  <p>这条链路上的每一个节点都能形成隔离。即使官方打击了某一个分销环节，外挂黑产也能迅速更换渠道，重新铺货。这种结构性的弹性，也是一直以来外挂无法彻底解决的根源。</p>\n  <p><strong>官方的对手不是几个黑客，而是有组织、有资金、有技术迭代能力的商业化黑产集团。</strong></p>\n  <p>当然，近年外挂在技术层面也找到了新的突破点，先后推出了两种能对传统防御体系造成冲击的新形态。</p>\n  <p>其一是DMA外挂。DMA外挂与过去传统外挂的最大区别，就在于它本质是通过独立的硬件设备直接读取游戏内存数据，既不修改客户端，也不注入额外代码。由于这些过程都在硬件层面完成，传统的反作弊软件也就无法捕捉到其痕迹。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_bfb267d9915b4ab49c51c5781f239169@16519798_oswg234512oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DMA外挂逻辑运行图</p>\n  <p>其二是AI视觉外挂。这类外挂同样不读取游戏数据，而是通过第三方合规软件（如用于直播推流的obs）采集视频信号，并借助训练好的视觉模型实时分析画面，最终通过模拟输入设备完成操作。这一外挂模式，也是目前自媒体中最经常被玩家提及的存在。</p>\n  <p>当然，站在官方系统层面，尽管目前的AI视觉外挂能跳过内存读取，但同时也让其运行链路变得繁琐笨重。借此，安全团队反而能更轻松地通过行为差异区分作弊特征，快速打击。</p>\n  <p>这两种新形态外挂，让反外挂的对抗从软件转变到硬件，从观测代码升级成区分行为。官方想要彻底遏制外挂，恐怕已经不是写一个或几个软件就能做到，必须和外挂一样提供高频率的更新，反复过招。</p>\n  <p>也就是说，现今外挂与反外挂的双方对抗，已经演变成了争夺游戏核心利益的“军备竞赛”。谁的迭代周期更短，更新更快，谁就能在当下的博弈中占据先手。最夸张的时候，这个窗口期可能短到以小时为基本单位。</p>\n  <h2><strong>02 前沿产品的反外挂得做到什么程度？</strong></h2>\n  <p>想要真正理解外挂与反外挂的对抗到了什么阶段，腾讯旗下的《三角洲行动》是一个值得参考的前沿样本。</p>\n  <p>首先，《三角洲行动》有足够体量的用户，这使得外挂开发者会将其作为重点投放场景。而游戏背靠腾讯，不缺乏技术与成本支撑，双方自然会形成高强度的对抗——单是近两个游戏赛季，官方就封禁了182万个开挂的游戏账号。其次，《三角洲行动》是FPS游戏，处于外挂最为横行的主战场，因此对反外挂系统的压力测试更为充分。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_5da23c632f3c420ba33c77f1a7eb6b59@16519798_oswg337543oswg667oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方对违规行为作出的处罚公告</p>\n  <p>更关键的是，腾讯安全团队也在该项目上，披露了相对完整的技术与策略信息，能让我们看到更多的内容。</p>\n  <p><strong>据官方介绍，《三角洲行动》的反外挂策略，基本涵盖了前置阻断和动态对抗两个阶段。</strong></p>\n  <p>在前置阶段，安全团队的做法是拉高外挂的使用成本，如挂载机器码、应用多种数据加密系统等等。其中，封机器码这种举措比较常见，自不必多说，本质就是把开挂者的封禁成本从单一账号上升到了电脑主板等核心硬件。</p>\n  <p>而在数据加密方面，腾讯安全团队提出了迷雾系统、千人千面加密、动态加密三者叠加的模式。简单来说，迷雾系统只允许玩家电脑即时读取到玩家当前“应该知道”的数据；而千人千面加密则会为每个玩家动态生成独立算法，增加了外挂获取数据的破解门槛，更要求定制化方案；同时，动态加密则让游戏的数据位置不断发生改变，增加了外挂需要跑通流程的成本。</p>\n  <p><strong>这些门槛甚至未必需要彻底遏制外挂的功能，只需要减缓其读取速度，让数据失去时效。</strong>一旦外挂无法保证即时性，哪怕只有几十毫秒的延迟，其在实战中的功能价值也会大幅降低。</p>\n  <p>而在动态对抗方面，安全系统有一个关键的思路转变：他们不再将“找到外挂程序”作为唯一目标，而是同时兼顾“识别行为模式”。</p>\n  <p>无论开挂者使用何种技术手段，最终都需要表现为操作行为。比如准心每一次的移动轨迹都过于干脆，缺乏人为操作中必然存在的微调；在没有确切信息的情况下，预瞄位置精准锁定掩体后敌人头部；连续快速定位多个目标，且视角切换的加速度曲线不符合人体操作规律等等。</p>\n  <p>官方会将这些行为特征数据都接入AI模型，进行持续训练和实时比对。<strong>即使外挂能躲过检测、破解加密，在最终的操作环节仍然可能暴露——甚至更为彻底。</strong></p>\n  <p>同时，官方也会高频率更新防御方案，用差异化的程序内容不断“过筛”，从而找出作弊账号。据安全团队所说，在高峰阶段，《三角洲行动》的反外挂系统最快曾一天更新过两次防御方案。他们表示，团队会24小时持续跟进外挂的更新动态，一旦发现新型作弊手段就立刻写入检测规则，并以热更新的方式推送到客户端。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_7a1dead3922d42d793f05c9a36ed28e3@16519798_oswg795912oswg1001oswg704_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">比如针对近期讨论比较多的AI吸附类外挂</p>\n  <p>整体来看，《三角洲行动》展现出的这些策略体验，基本代表了国内主流厂商在FPS领域反外挂的标准乃至最高强度配置，对一众游戏都能提供不少参考。</p>\n  <h2><strong>03 反外挂的终极目标，不只在战场之内</strong></h2>\n  <p>当然，对抗外挂黑产绝非朝夕之功，还需要玩家与官方多维度的持续验证与优化。如玩家保持抵制外挂的坚决态度，官方则提供更多有助于玩家辨别外挂的可观手段——在《三角洲行动》里，针对这点呼声最高的应该是全局回放功能。比如《三角洲行动》后续计划推出“玩家巡查团”，邀请玩家一同参与反作弊工作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_ac985766998441978b09675385a491f7@16519798_oswg659783oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">不断升级的反外挂举措</p>\n  <p>换句话说，现如今玩家对外挂心态的变化，很大程度都来源于自己既没办法像主播那样“诛仙”（靠操作击杀外挂），也没有制裁对方账号的权限，只能凭借局内信息点击举报。这导致玩家在面临外挂时，天然处于相对被动的位置。</p>\n  <p>毕竟，再严密的防线也可能出现疏漏，普通玩家碰上几次外挂，强烈的负反馈很可能让他们变得草木皆兵。</p>\n  <p>但只要对抗持续存在，就不可避免会有正常玩家在外挂使用者的行为中遭受损失。因此，《三角洲行动》的处理思路始终强调尽可能减少正常玩家在这一过程里的损失。</p>\n  <p>目前，开发团队已经在游戏里建立了一套针对反作弊场景的装备补偿机制，如果系统确认某场对局中存在开挂行为，且该行为确实导致正常玩家失去装备，那么官方会通过邮件返还受影响玩家丢失的物品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_f76e20f0c2484aca9f1322fdb4eaabab@16519798_oswg778593oswg1080oswg856_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方为遇到外挂的玩家作出相应补偿</p>\n  <p>这项功能的核心逻辑是，安全系统作为官方责任的延伸，其漏放造成的体验伤害，不应让玩家承担情绪与虚拟资产的双重代价。补偿不可能覆盖所有主观体验上的不适，但至少降低在实际数值层面弥补玩家。</p>\n  <p>回溯补偿并非《三角洲行动》首创，在更早的射击类产品中已有局部实践。但它在此项目中的执行颗粒度更高，与安全系统的数据回溯能力直接挂钩。<strong>补偿的准确性取决于系统对作弊行为判定的准确性，这本身又依赖于安全模型的行为识别能力，形成了逻辑闭环。</strong></p>\n  <p>说白了，官方想要做好反作弊这事，技术维度的支持是底层基础，是成功的关键。而玩家乃至社会对其的态度，则是决定其最终成果上限的重要变量。</p>\n  <p>一个比较明显的趋势，是警方同样加重了针对外挂黑产的执法力度。</p>\n  <p><strong>2025年，安徽省警方破获一起涉及《三角洲行动》的外挂制售案件，打掉一个从开发到销售覆盖多省的犯罪团伙，多名核心成员被采取刑事强制措施。同年另一起案件中，江苏警方查获了一个专门为《三角洲行动》定制DMA外挂设备的工作室，现场扣押了用于生产的硬件物料和已封装待发货的成品设备。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_9f7ef087358e4b66b3c37b6dc0a22512@16519798_oswg569659oswg590oswg778_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：《三角洲行动》</p>\n  <p>孝感市公安局的自媒体账号@孝警阿特，也曾以相对轻松的形式拍摄出警外挂窝点的行动，以此传达官方的打击态度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_01fc906e2d0a40129c63f25e7ce56d4b@16519798_oswg498435oswg1080oswg734_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">孝警阿特的视频记录</p>\n  <p>当然，任何一个了解黑产运作规律的人都清楚，捣毁一个工作室，很快会有新的填补市场空缺。现实中的黑产工作室确实呈现出一定的扩散和更替特性。</p>\n  <p>每一桩进入司法程序的外挂案件，都在为后续的同类案件提供判例参考，也在向黑产链条上的从业者传递一个明确的信号：制作和销售外挂需要面临的不仅是游戏厂商打击，还包括刑事责任的实际判决。这种态度，至少会逐渐改变一部分潜在参与者的预期。</p>\n  <p><strong>当单个行为的法律后果变得清晰且可追溯，黑产的招募和扩张成本就会上升。更关键的是，这类司法行动的深层意义，在于为当下及未来的每一代人建立正确的价值观。</strong></p>\n  <h2><strong>结语</strong></h2>\n  <p>《三角洲行动》不是反外挂领域的孤例，它只是当前主流FPS产品与黑产之间高强度对抗的一个代表。</p>\n  <p>在同一时期，多家头部厂商各自构建了不同侧重点的安全体系。有些选择与硬件厂商深度合作，在芯片层面预埋安全模块。有些则搭建跨产品的威胁情报共享平台，让一款游戏中捕获的外挂特征能迅速同步给其他产品线。</p>\n  <p>外挂与反外挂的对抗没有终点，也无法毕功于一役，这是一场考验技术、人力的持续消耗战。积极的一面在于，产业侧的投入规模和协作程度在过去几年间出现了可感知的提升。</p>\n  <p>安全白皮书、行业峰会、跨厂商技术联盟，这些机制正在将反外挂从单个项目的孤立防御，逐步推向可共享、可复用的基础设施层面。法律的介入则从另一个维度缩短了黑产的生存半径。敖然也表示，“游戏安全，也从来都不是从来不是单独某一家企业的责任，也不是一个协会能独立完成的工程。它需要主管部门的引导、需要行业协会的协同、需要头部企业的担当、也需要全产业链的共同努力。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_9dd4fc3b06d34c53b68b1f7d6cc7206f@16519798_oswg70110oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中国音像与数字出版协会常务理事长敖然</p>\n  <p><strong>这场战争中，主动权不会属于某一方太久，但只要防御侧仍在持续投入，仍在更新迭代，仍在将战线从线上推至线下，公平竞技的环境就能在动态平衡中得到维系。</strong></p>\n  <p>对于数以亿计的普通玩家而言，这至少是目前最值得信任的保障形态。</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/w8pfegkRFSsHeynAusl19Q?scene=1\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-06-09T14:48:11+00:00", "fetched_at": "2026-06-10T02:57:11.912611+00:00", "fingerprint": "7e308172c0d00092"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨致3人永久失明，膳魔师紧急召回百万件产品；发布会后苹果市值蒸发超1.587万亿；Anthropic发布最强模型：Claude Fable 5正式上线", "url": "https://36kr.com/p/3846601462073600?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>清仓美高梅国际持股，何超琼套现逾1.4亿美元</p>\n  <p>任天堂在法国遭2.7亿元重罚</p>\n  <p>王传福回应股价被低估：还没能反映比亚迪潜力</p>\n  <p>5月汽车销量公布：前十已无燃油车</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>已致3人永久失明，膳魔师紧急召回百万件产品</strong></p>\n  <p>因产品瓶塞存在弹出的风险，近段时间，德国知名真空保温品牌膳魔师（Thermos）在中美多国各召回百万件食物罐等产品，据美国消费品安全委员会披露的公告，有三名消费者因眼睛被击中而导致永久性视力丧失。</p>\n  <p>5月29日，国家市场监管总局官网发布公告称，日前，膳魔师（中国）家庭制品有限公司召回2011年-2023年期间制造的部分SK3000、SK3020型高真空不锈钢食物罐，涉及数量为3995415件。召回公告指出，如消费者长时间在保温食物罐中存放易腐食品或饮料，打开时密封塞可能会有弹出风险，对使用者造成撞击伤害。膳魔师中国将免费更换一件全新具有泄压阀的密封塞，以消除安全隐患。（南方都市报）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_405a04b7c47c4d31a9fdb756456f4d55@5667365_oswg264817oswg1074oswg505_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">膳魔师</p>\n  <p><strong>发布会后苹果股价下跌，市值蒸发超1.587万亿</strong></p>\n  <p>北京时间6月9日凌晨1点，苹果WWDC（全球开发者大会）在美国加州库比提诺的Apple Park正式拉开帷幕。这也是蒂姆·库克（Tim Cook）作为苹果CEO主持的最后一届全球开发者大会。本次大会最受关注的信息在于，时隔两年，苹果再次集中发布AI战略，推出了新一代Apple智能以及重构过的语音助手Siri AI，并推出迭代版本iOS 27、iPadOS 27、macOS 27等全系操作系统。值得注意的是，发布会后，苹果股价下跌。截至当日收盘跌1.89%，和当日最高价时的市值相比蒸发超2300亿美元（约合人民币1.587万亿元）。分析人士称，苹果股价下跌或许与Siri AI和其他新的苹果智能功能未能超预期有关。（界面新闻）</p>\n  <p><strong>Anthropic推出Fable 5/Mythos 5</strong></p>\n  <p>IT之家6月10日消息，Anthropic 6月9日发布博文，宣布推出Claude Fable 5与Claude Mythos 5两款AI模型。</p>\n  <p>定位方面，Claude Fable 5面向普通用户开放，定位为目前公开可用能力最强的Claude模型；而Claude Mythos 5会继续通过Project Glasswing项目先向少量网络安全防御方和基础设施提供商开放。（IT之家）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌推出Gemini3.5实时翻译模型</strong></p>\n  <p>6月9日，谷歌宣布推出Gemini3.5实时翻译模型，这是其最新的实时语音到语音翻译音频模型。据谷歌介绍，该模型可自动检测70多种语言，生成流畅自然的翻译语音，并保留说话者的语调、语速和音高。该模型即日起在谷歌各产品中逐步推出。（界面新闻）</p>\n  <p><strong>马斯克谈SpaceX未来规划，展示AI数据中心卫星更多细节</strong></p>\n  <p>当地时间6月8日，马斯克在SpaceX社媒平台X账号分享的一段30分钟视频中谈及SpaceX的未来规划，内容涵盖星舰的后续研发，以及SpaceX与特斯拉在美国联合建设的超级芯片工厂。马斯克展示了名为AI1的卫星渲染图及相关规格，称AI1卫星将配备翼展70米的巨型光伏面板，可支持120千瓦的平均计算载荷，峰值可达150千瓦。SpaceX计划组建约100万颗AI卫星网络，在地球轨道上执行复杂的人工智能计算任务。（界面新闻）&nbsp;</p>\n  <p><strong>谷歌DeepMind在欧洲启动机器人加速器项目，首批16家初创企业入选</strong></p>\n  <p>6月9日，谷歌DeepMind宣布启动机器人加速器项目，面向欧洲早期阶段机器人初创企业，为期三个月，本周首批学员已在伦敦集结开营。入选企业将获得谷歌DeepMind技术专家指导、Gemini机器人模型访问权限及谷歌AI技术栈支持。首批16家入选企业覆盖物流、制造、医疗、建筑、海洋探索及脑神经外科等多个领域。（界面新闻）&nbsp;</p>\n  <p><strong>国家互联网应急中心提醒：部分智能体技能包（Skills）存在越狱和挖矿风险</strong></p>\n  <p>6月9日，国家互联网应急中心（CNCERT）发布公告称，近期综合研判发现，部分智能体技能包（Skills）以“大模型越狱”、“挖矿赚钱”等名义公开传播，诱导用户突破大模型安全限制或占用设备资源进行非法挖矿。此类恶意Skills可能导致模型生成违法信息、用户账号被依法封禁、设备性能下降，甚至使用户被动卷入洗钱等违法犯罪活动，严重侵害个人合法权益，危害网络安全。CNCERT提醒广大用户和相关运营单位提高警惕，加强Skills来源审查与行为监控，及时清除可疑组件，防范由此引发的安全风险。（界面新闻）&nbsp;</p>\n  <p><strong>小米上线MiMo-V2.5-Pro-UltraSpeed模式</strong></p>\n  <p>36氪获悉，6月8日晚，小米MiMo技术团队正式上线Xiaomi MiMo-V2.5-Pro-UltraSpeed模式。据了解，MiMo-V2.5-Pro-UltraSpeed通过对模型推理系统的全链路工程能力优化，在不降低模型能力前提下，首次把推理速度提升至1000tokens/s，且无需定制芯片、只使用通用GPU即可达成。&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>曝哈啰单车制定“猎鹰计划”：“干掉”友商核心人员可获奖励</strong></p>\n  <p>据钛媒体报道，哈啰单车在行业竞争中被曝出多项争议行为，不仅长期扣押竞争对手车辆，还被指曾推出相关暴力手段针对竞品核心人员。有知情人士透露，哈啰单车曾制定“猎鹰计划”，整理出一份包含十余名竞品核心人员的名单。并且如果可以“干掉”名单上的人物即可获得高额奖金。而“干掉”的方式包括让名单上的人离职或跳槽到哈啰；以及直接的身体恐吓，包括殴打等。报道称，几名哈啰员工曾计划，把一个竞争对手里的关键人物“揍一顿”。上述知情人士称，“连要打的人住在哪里、日常行迹、怎么打人，都计划清楚了”。但这个计划因对方警觉而未能实施。（钛媒体）</p>\n  <p><strong>被纳入“中国军事企业名单”，比亚迪、阿里巴巴、百度、蔚来、药明康德紧急公告</strong></p>\n  <p>近日，美国国防部发布最新版“中国军事企业名单”（CMC名单），将188家中国企业列入其中，涉及阿里巴巴、百度、蔚来、药明康德、比亚迪、华为等公司。此次名单覆盖人工智能、新能源汽车、半导体、生物医药等多个中国优势及前沿科技产业。6月9日，比亚迪、阿里巴巴、百度、蔚来、药明康德等多家企业先后发布公告回应，强调公司并非军事企业，并表示将积极采取措施维护自身权益。（中国证券报）&nbsp;</p>\n  <p><strong>Clipto.AI发布全新端侧多模态AI产品</strong></p>\n  <p>近日，AI公司Clipto.AI在Product Hunt发布新一代Mac端产品，并获当日全球榜单第一名。公司聚焦端侧多模态AI，提出面向Personal AI的Memory Layer（记忆层）概念，通过本地大模型理解视频、音频、文档等数据，构建可持续调用的个人长期记忆系统。目前Clipto已覆盖全球150多个国家和地区，ARR超1500万美元并实现盈利，获得红杉中国、高瓴创投等机构投资。&nbsp;</p>\n  <p><strong>任天堂在法国遭2.7亿元重罚</strong></p>\n  <p>当地时间6月8日，法国竞争、消费与反欺诈总局（DGCCRF）正式宣布，对日本游戏巨头任天堂欧洲公司处以3500万欧元（约合人民币2.7亿元）罚款，理由是该公司在2018年至2023年期间，围绕Switch主机Joy-Con手柄\"摇杆漂移\" 缺陷问题实施了\"具有误导性\"的商业行为，这损害了消费者知情权与公平交易权。该案也成为法国针对消费电子企业产品质量问题开出的最高罚单之一。任天堂方面已同意支付这笔罚款，不过，任天堂公司否认存在故意误导消费者的行为，同时强调这笔罚款并不代表企业认罪，此次缴纳罚金仅为双方就相关法律纠纷达成友好和解。（界面新闻）&nbsp;</p>\n  <p><strong>滴滴率先接入微信AI生态</strong></p>\n  <p>随着微信正式面向开发者提供AI生态接入能力，滴滴作为首批合作伙伴，已与微信团队合作将核心网约车服务融入微信AI Agent。未来，用户通过微信内AI交互，即可直接唤起滴滴快车、专车、特惠等服务。当用户在微信中产生出行需求，只需说一句“帮我叫一辆滴滴去机场”即可根据行程距离、时效需求与个人偏好，自动推荐最优车型，一键唤起叫车服务。据了解，滴滴顺风车、滴滴代驾等更多服务也将接入微信AI生态。&nbsp;</p>\n  <p><strong>清仓美高梅国际持股，何超琼套现逾1.4亿美元</strong></p>\n  <p>近日，美高梅中国董事长何超琼出售美高梅国际306.6万股，清仓所有持股，何超琼套现逾1.4亿美元。美国媒体集团People Incorporated（已持有MGM 26%股权）宣布，以每股48.3美元收购额外24.1%股权，令持股增至略高于50%，从而取得MGM控股权。消息刺激MGM股价高见51.59美元。在MGM控股权尚未有定论之际，美高梅中国董事长何超琼于5月28日、5月29日、6月1日、6月2日及6月3日，先后5次出售MGM逾306.6万股，清仓相关持股后，合共套现1.4亿美元（折合约11.3亿澳门元）。（中国蓝新闻）&nbsp;</p>\n  <p><strong>苹果宣布新版Siri AI因DMA监管分歧无缘欧盟iOS 27，上线时间表未定</strong></p>\n  <p>苹果公司当地时间6月8日宣布，全新Siri AI将随iOS 27及iPadOS 27发布，但受《数字市场法》（DMA）影响，欧盟用户届时无法在iPhone及iPad上使用该功能，watchOS 27亦受连带影响。欧盟用户可在macOS 27及visionOS 27上访问Siri AI。苹果软件工程高级副总裁克雷格·费德里吉表示，过去数月间苹果向欧盟监管机构提���了多项解决方案，但均遭欧盟委员会拒绝，目前尚无Siri AI在欧盟iOS及iPadOS上线的时间表。苹果方面指出，欧盟监管机构要求苹果赋予任何第三方AI系统对用户设备的近乎无限访问权限，包括读写短信、执行购买、访问文件及跨应用操作，苹果认为此举将对用户隐私和安全构成重大风险。（界面新闻）&nbsp;</p>\n  <p><strong>世界杯主裁被美国拒签</strong></p>\n  <p>北京时间6月9日，就在美加墨世界杯进入倒计时之际，国际足联正式确认，入选本届世界杯裁判名单的索马里籍裁判奥马尔·阿卜杜勒卡迪尔·阿尔坦（Omar Abdulkadir Artan）将被拒绝进入美国，因此无法在此次赛事中执法。这件令外界不解的事情始于本周一，阿尔坦在从土耳其伊斯坦布尔飞抵美国迈阿密国际机场后，在入境检查时被美国海关与边境保护局拒绝入境，并随后被遣返。美国海关与边境保护局在一份声明中表示，阿尔坦因“审查方面的问题”被认定不准入境，但未提供具体细节。白宫世界杯工作组负责人安德鲁·朱利安尼对此决定表示支持，称相关部门做出了正确的判断。（澎湃新闻）&nbsp;</p>\n  <p><strong>王传福回应股价被低估：还没能反映比亚迪潜力，会实现更好的股东回报</strong></p>\n  <p>比亚迪董事长兼总裁王传福在股东大会上回应公司股价被低估的问题时表示，“我们的潜力大家都很认同，但是现在我们的股价还没能反映。我代表管理层理解并感谢大家的支持。”王传福说，相信业绩会越来越好，希望股东保持耐心。公司将持续用技术创新来推动未来进一步的增长，把握各个节点，科学前瞻布局，来实现公司更好更快速地发展，“一定会实现股东更好的回报”。（澎湃新闻）&nbsp;</p>\n  <p><strong>全球航空业盈利或将“腰斩”</strong></p>\n  <p>最新消息，国际航空运输协会7日发布的全球航空业最新财务前景报告显示，受中东局势持续紧张、燃油价格大幅上涨等因素影响，预计全球航空公司2026年的净利润将降至230亿美元，远低于2025年的450亿美元。（央视财经）&nbsp;</p>\n  <p><strong>5月汽车销量公布：前十已无燃油车</strong></p>\n  <p>燃油车在刚刚过去的5月彻底退出了乘用车零售销量前十的舞台。懂车帝发布的5月乘用车零售销量排行榜显示，排名前十的车型全部为新能源车。&nbsp;</p>\n  <p>排名第一的是微型电动车星愿，月销38751辆；特斯拉Model Y以28911辆位居第二；小米SU7、零跑A10、理想i6分列第三至第五位。前十榜单中，纯电、增程、插混各占一席之地，唯独不见燃油车的身影。而在一个月前的4月，前十榜单中还有吉利缤越这一款燃油车“独苗”；3月则有5款燃油车入围；今年1月这一数字为7款。从占据大半江山到彻底归零，仅用了不到半年时间。（第一财经）&nbsp;</p>\n  <p><strong>美股策略师：近期约有70%的“熊市信号”被触发</strong></p>\n  <p>美银证券最新表示，越来越多的“熊市信号”表明美国股市即将见顶，投资者应谨慎对待美国股市。以美国银行（Bank of America）美国股票和量化策略主管Savita Subramanian为首的策略师团队在最新报告中写道：“危险信号太多了”。他们建议“获利了结”。策略师们表示，近期约有70%的熊市信号被触发，这与此前市场高峰期的平均水平相符。Subramanian则指出，标普500指数“在20项指标中的17项上都显示出统计意义上的高估值，并且在8项指标上相对于科技泡沫指标而言估值过高”。（财联社）&nbsp;</p>\n  <p><strong>英特尔拿下谷歌芯片大单</strong></p>\n  <p>据美国媒体6月8日报道，美国谷歌公司已向英特尔下发订单，委托英特尔生产其自研的AI芯片。同时，另一科技企业英伟达也在评估是否使用英特尔的技术来制造下一代图形处理器，也就是GPU。受此消息推动，8日英特尔股价收盘大涨超11%。分析人士指出，随着AI应用爆发式增长，全球对高端AI芯片的需求不断飙升，导致芯片代工厂出现严重产能紧张。客户担心供应短缺，纷纷开始寻找备选供应商。受需求提振，英特尔股价今年以来已累计上涨超198%。（央视财经）&nbsp;</p>\n  <p><strong>钉钉副总裁马锐拉离职，公众号发文：越来越难确认是在创造产品还是追赶节奏</strong></p>\n  <p>6月8日，钉钉副总裁、AI产品负责人马锐拉在个人公众号上发布题为《置身钉外》的文章，称他已于5月15日办完离职手续，正式告别三年阿里生涯，离开钉钉。在这篇文章中，马锐拉主要分享了自己阅读《置身钉内》后的感受与思考，反复强调“心疼”：“思考良久，我越来越难确认自己是在创造产品，还是只是在消耗身体追赶一个不断前移的节奏。”&nbsp;</p>\n  <p>据了解，近日，阿里内网一篇长达7.5万字的文章《置身钉内》引发全网围观。作者系钉钉“ONE”项目核心产品经理滕雅辛（花名“幽素”），在这篇长文中，她按时间线复盘了“ONE”这款AI产品从立项、冲高，再到最终收缩、拆分的全过程。对于这篇文章，钉钉方面暂无回应。（澎湃新闻）&nbsp;</p>\n  <p><strong>现货黄金跳水跌破4300美元</strong></p>\n  <p>黄金开启“跌跌不休”模式。6月9日晚，现货黄金突然击穿4300美元，截至北京时间22:45，现货黄金日内跌近1%报4287.96美元/盎司，相较年内高点5598.75美元/盎司，黄金已经下跌超23%，进入技术性熊市。现货白银跌近4%报65.57美元/盎司。首饰金同步则降至1316元/克左右，和年内最高时站上1700元/克，跌幅超过22%。（21世纪经济报道）&nbsp;</p>\n  <p><strong>鸡蛋价格暴涨近四成</strong></p>\n  <p>近日，“鸡蛋价格暴涨四成”的话题登上热搜，鸡蛋“一天一个价”“同比涨八成”等引发网友讨论。根据农业农村部“全国农产品批发市场价格信息系统”监测，今年6月初鸡蛋批发价格为5.1元/斤，环比增加6.1%，同比增长32.1%。北京大型农产品批发市场新发地的监测数据显示，6月7日散鸡蛋均价6.1元/斤，较两个月前涨幅超过五成。去年同期市场均价约3.5元/斤，同比涨超七成。记者从业内了解到，蛋鸡养殖具有明显的周期波动特点，去年鸡蛋市场整体供过于求，受此影响，去年第四季度养殖户的鸡苗补栏意愿低迷，使得当前在产蛋鸡存栏较低，市场整体处于供需紧平衡状态。（第一财经）&nbsp;</p>\n  <p><strong>美股三大指数收盘涨跌不一，大型科技股普跌</strong></p>\n  <p>36氪获悉，6月9日收盘，美股三大指数收盘涨跌不一，道指涨0.17%，纳指跌0.97%，标普500指数跌0.26%。大型科技股普跌，康宁跌超7%，苹果跌超3%，特斯拉跌3%，微软、英特尔跌超2%，亚马逊英伟达、Meta小幅下跌，谷歌小幅上涨。热门中概股多数下跌，蔚来跌超3%，理想汽车、小鹏集团跌超2%，哔哩哔哩跌超1%，拼多多、阿里巴巴小幅下跌，百度、网易涨超1%，京东小幅上涨。&nbsp;</p>\n  <h2>上市进行时</h2>\n  <p><strong>Perplexity：无论Anthropic与OpenAI上市进展如何，公司均计划2028年IPO</strong></p>\n  <p>Perplexity首席执行官阿拉温德·斯里尼瓦斯(Aravind Srinivas)表示，无论市场对Anthropic和OpenAI的上市反响如何，公司都计划在2028年启动上市。斯里尼瓦斯在周二播出的采访中称:“我们的上市规划原本就定在2028年，与这两家公司无关，目前该计划保持不变。”（新浪财经）</p>\n  <p><strong>脑机接口龙头企业完成IPO辅导</strong></p>\n  <p>36氪获悉，证监会官网IPO辅导公示系统显示，脑机接口企业博睿康技术(上海)股份有限公司IPO辅导状态变更为“辅导工作完成”，辅导机构为中信证券。</p>\n  <p><strong>西安存储芯片龙头，完成IPO辅导</strong></p>\n  <p>证监会官网IPO辅导公示系统显示，西安紫光国芯半导体股份有限公司及其辅导券商中信建投向陕西证监局提交《辅导工作完成报告》。公司于2026年1月6日提交辅导备案，辅导工作历时5个月。（科创板日报）</p>\n  <h2>大公司财报</h2>\n  <p><strong>“GIM”获超亿元天使轮融资</strong></p>\n  <p>36氪获悉，金融垂域AI大模型公司“GIM”（GraceInvestment Machine）完成天使+轮融资，由赛富投资基金（SAIF Partners）领投，某千亿市值互联网公司CEO家族办公室跟投。此前，GIM天使轮由Monolith砺思资本和五源资本共同投资。至此，公司已完成过亿元人民币天使轮和天使+轮融资。据了解，GIM将进一步从零自研金融垂域大模型。</p>\n  <p><strong>“昆仑元AI”获5000万元战略融资</strong></p>\n  <p>36氪获悉，湖南昆仑元人工智能应用软件有限公司（KunlunMeta，昆仑元AI）宣布完成5000万元战略轮融资，由A股上市公司景嘉微全资子公司长沙景美集成电路设计有限公司领投。据了解，双方将聚焦芯片设计、算力适配、产品联合研发、生态共建等领域深度合作，依托景美国产GPU算力优势与昆仑元AI的软件栈、场景落地能力，构建“国产GPU+全栈AI基础设施”一体化方案。&nbsp;</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。苹果AI来了，但没完全来，苹果WWDC还发了啥？</strong></p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-06-10T00:08:16+00:00", "fetched_at": "2026-06-10T02:57:11.912605+00:00", "fingerprint": "d7ce45464f6cd63f"}, {"source": "36氪 - 最新文章", "title": "手机装不下的野心，正在被搬进游戏平板丨2026游戏平板使用趋势观察", "url": "https://36kr.com/p/3846673443997961?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_616af26712d74c93acfbaf73aeb027fc@11416942_oswg2563523oswg1000oswg1485_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>打开任意社交媒体，搜索“手游设备”，你会发现一个有趣的现象：越来越多的年轻人正在抱怨手机——屏幕太小、玩两把就发烫、开放世界游戏跑不满帧、吃鸡打到决赛圈手指抽筋……而评论区里，<strong>被提及最多的解决方案不是怎么换一台性能更好的手机，而更多的是建议——换一台专业游戏平板。</strong></p>\n  <p>游戏玩家们，正在经历一场“换屏幕”的集体迁徙。这不是凭空发生，是伴随着手游市场升级换代的必然结果。过去几年，移动游戏不只是新作频出，类似《王者荣耀》《三角洲行动》《原神》《鸣潮》这些占据收入榜头部的大作，每一款都在画质、地图、操作维度上不断逼近PC和主机水准。随着游戏越做越重，玩家的口味也是被一路喂得越来越叼，对沉浸感、操作精度、帧率稳定的要求，早已不是一块6.7英寸的小屏能装下的。</p>\n  <p>需求一旦被撑大，就会反向寻找新的容器：用平板打游戏的人，肉眼可见地变多了。“游戏平板”是这几年新涌现的概念。过去我们对平板的功能定位还停留在追剧神器、网课学习工具、便携电子笔记本，但现在，<strong>越来越多年轻人开始把平板当成自己的随身游戏机——比手机屏幕大、比掌机便携、比PC自由，还能塞进通勤包，随时随地“大小玩”。</strong></p>\n  <p>另一边，平板硬件优化也在经历一轮爆发。这两年，主流厂商集体把“游戏向”作为新卖点：高刷屏、独立散热模组、专用手柄、云游戏适配、端侧AI……红魔游戏平板5 Pro、REDMI K Pad 2、iQOO Pad 6 Pro、联想拯救者Y700 五代、一加Pad3 Pro等新品密集入场。</p>\n  <p><strong>当供给和需求在同一个时间点撞上，“游戏平板”这个细分品类，就这么被推到了台前——京东数据显示，2026年以来，游戏平板成交量同比增长超150%。</strong></p>\n  <p>那么问题来了——这场“从手机到平板”的屏幕迁徙，到底走到了哪一步？是谁在用平板打游戏？他们玩什么、看重什么、又愿意为哪些功能多花钱？为了搞清楚这届玩家的真实生态，<strong>36氪X后浪研究所X京东消费及产业发展研究院联合发起了一份“游戏设备调研”，共回收1000份有效问卷，</strong>其中男女比例约7:3。结合宏观数据和调研结果，我们总结了几条游戏平板爆发的关键动因。<br />&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_475e3e59302a4e33b6667311378badd5@11416942_oswg8038oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>纵观中国游戏市场大盘，手游是绝对的主角。根据中国音数协游戏工委《2026年4月中国游戏产业月度报告》，2026年4月中国游戏市场实际销售收入达到<strong>303.69亿元，同比增长11.04%</strong>；其中移动游戏市场实际销售收入<strong>224.30亿元</strong>，环比增长0.71%，同比增长9.83%。</p>\n  <p>换算一下，<strong>移动游戏在中国游戏盘子里的占比，稳定在七成以上。</strong>可以说游戏市场的大头，也是由手游玩家来定义，但显然，手机那块小屏幕，已经开始装不下游戏厂商越做越大的野心。</p>\n  <p>同样，<strong>游戏人群不仅在变多，也在变“重”。</strong></p>\n  <p>2026年4月8日Sensor Tower公布的2026年3月手游收入榜显示，《王者荣耀》《和平精英》《三角洲行动》包揽中国App Store手游收入榜TOP 3。当月，38 个中国手游发行商合计吸金21.1亿美元。这份榜单透露出一个清晰的信号：<strong>最赚钱的，依然是那些对屏幕视野、操控精度、画面表现要求极高的重度游戏。</strong></p>\n  <p>FPS要在毫秒级辨认敌人位置，迅速做出决断，MOBA要求玩家看清小地图上每一个可能闪现的敌军信号，开放世界则要承载越来越精细的建模和光影——这些需求，手机不是不能满足，而是满足得很勉强。一位FPS重度玩家在调研里写下这样一句话：<strong>“手机能玩，但玩不爽。它经常跟不上我的反应。”</strong></p>\n  <p>这种“能玩”和“爽玩”之间的落差，正是设备升级的最大动因，也在反向倒逼硬件进化。IDC数据显示，2025年中国平板电脑市场出货量达3376万台，同比增长13.1%，其中消费市场是2025年的核心增长动力，同比增长14.4%。</p>\n  <p>更关键的是——<strong>平板的增长，正在和游戏场景深度绑定。</strong></p>\n  <p>艾媒咨询《2025 年中国云游戏消费行为调查数据》显示，在2025年中国云游戏用户的设备使用占比中，平板首次超过主机，成为仅次于手机和电脑的核心游戏设备。要知道，五年前的平板还被主推为追剧和学习辅助的角色，如今它已经悄悄爬上了云游戏设备的第三把交椅。</p>\n  <p>云游戏的爆发，进一步放大了平板的游戏属性。在云游戏的场景下，平板不用拼本地算力，拼的是屏幕、续航、散热、网络体验，而这些恰好是平板相对于手机的强项。<strong>平板没有变成另一个手机，而是长成了另一种便携游戏设备形态。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_b4610994271641479a9a041119a69030@11416942_oswg9875oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在这份游戏设备调研中，我们深度分析了在手机之外，平板是否抢占了游戏用户大盘市场，又是否能在和其他游戏设备品类的竞争中杀出重围，这份调研结果是意料之外，情理之中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_70e092ac2eea4ff6ae8b64fca896aa4b@11416942_oswg11934oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_82d9e2b96b9a4c7c848d8b7e5c21b063@11416942_oswg78642oswg802oswg1008_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>除了手机外，在本次调研中，平板的持有率和常用率在游戏设备里排到了第一，考虑到PC一直被视为最硬核的正统游戏设备，平板能在常用率上反超它，本身就是一件挺反直觉的事。</p>\n  <p>另一个值得注意的点是，平板的常用率（82.3%）比持有率（66.8%）还高出15.5pp，这意味着即便很多玩家并没有自己的专属平板，却可能在借用家人的、室友的、对象的平板玩游戏。看来一旦体验过大屏，就很难再回到自己手机的小屏幕上去了。</p>\n  <p>不意外的是，掌机和家用游戏主机的使用率还有待提升。 这类设备往往会在新作上线、爆款游戏发布时被玩家们重点关注。</p>\n  <p>在所有“持有游戏平板”的人群中，69.7%会把它作为常用游戏设备——也就是说，买了游戏平板的人，七成都真的在用它打游戏，转化率非常高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_4bb040b6b44b4ad6a67c640333af1139@11416942_oswg11928oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>继续追问，玩家们都是因为什么购买了人生中第一台游戏平板。实际上，这个购买决策并非是受到游戏平板的营销宣传影响，大部分人想换设备，都是因为手机撑不住了。</p>\n  <p>调研显示，排名靠前的购买动因，几乎都与手机的体验崩塌直接相关——手机玩久了发烫、掉帧、卡顿、续航崩盘，痛点累积到一个临界点，玩家终于决定“换块大的”。<strong>真正吸引他们最终下单的因素，正是“屏幕大”“性能猛”“散热强”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5a464de9231f48a49d0e1d3f6c51f96b@11416942_oswg37553oswg801oswg910_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_12b55ad9155a47be9f5e634da4342758@11416942_oswg9556oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>而游戏平板作为新游戏设备的“受宠”，也要归功于手游厂商们的协同发力。调研中玩家们投出了对现有设备不够满意的3个核心因素，分别是画质、帧率和更新包的存储占用问题。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_57a0bed716e840fca217005cc2faa8eb@11416942_oswg38340oswg800oswg906_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>手游本身在进化，画质提升、地图变大、特效拉满，甚至团战人数变多、操作维度增加……几年下来，手游已经可以做出不逊于PC/主机的游戏表现，这也就更加明显暴露出——玩家手里的硬件设备，已经跟不上软件的进化速度了。</p>\n  <p>具体到游戏类型，调研进一步发现，受影响最严重的几乎都是“竞技属性强”的品类：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_24c32a9d691145c98ae2064066cc0d6d@11416942_oswg93820oswg801oswg942_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>FPS/射击玩家受影响程度最高，对这群玩家来说，掉一帧就等于打不中人，挫败感会被无限放大；MOBA和开放世界RPG紧随其后，长时间、高画质、强团战，哪个环节的卡顿带来的都是灾难级体验；休闲益智游戏目前暂时处在安全区，只有20.2%的玩家“经常遇到设备问题”，远低于FPS的36.3%。</p>\n  <p>所以，<strong>真正的变量是游戏的“电竞属性”，只要参与排名、有胜负、有PK，玩家对设备问题的容忍度就会断崖式下降。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_3c7b89bfa63946ba873e2b8353f25cbb@11416942_oswg78128oswg801oswg1072_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在调研样本中，电竞场景的渗透也佐证了这一点——近半数玩家参加过排位/巅峰赛、战队赛/公会赛，甚至线下比赛的人群各自都占2成，只有27.8%的人完全不参与任何竞技活动。换句话说，<strong>有胜负心的玩家是主流，他们恰恰是对设备最敏感、最焦虑的那群人，游戏用户可以接受自己技不如人，但接受不了“输给设备”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_692125677cc74beba1b633a5713d2534@11416942_oswg9642oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_ad68cbeb48654eb8b60f3e190f096911@11416942_oswg77202oswg800oswg902_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在挑选游戏平板时，玩家们最关心的因素是什么？这个答案出乎意料——不是芯片强度，不是屏幕大小，而是散热。</p>\n  <p>调研发现，散热能力是唯一一个“强化需求&gt;选购在意”的维度。玩家在买的时候，往往把芯片放在第一位（47.2%）；可一旦真用起来，他们才意识到——<strong>真正决定体验的不是芯片峰值多猛，而是散热能不能让芯片“持续地猛”。所以问“应该强化什么”时，散热反超到第一。</strong></p>\n  <p>平板厂商卷到尽头，旗舰芯片已经够用，屏幕高刷已经是“标配门槛”，卷得再高也没意义。玩家们需要的是这块芯片和屏幕能稳定地把性能释放出来。</p>\n  <p><strong>当然，五大核心因素之外，性价比依然是隐形门槛。</strong>游戏平板毕竟是一个“锦上添花”的品类，不像手机那样人人必备，因此价格敏感度天然较高。能否推动购买决策，靠的是握持感和性价比的极致平衡，而握持感体验，也最受散热能力影响。毕竟，谁也不想抱着一块发烫的铁砖打游戏。游戏平板的竞争，已经从“堆参数”进入了“保体验”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_230fba0b5afe49c986f7e9c5706403bf@11416942_oswg7668oswg1000oswg204_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_6abcc0c35784486596de3c4335235a9f@11416942_oswg81509oswg800oswg829_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>如果说散热是当下的胜负手，那么<strong>AI，很可能是游戏平板的下一个能力战场。</strong></p>\n  <p>调研里玩家们的期待已经展现得非常具体，最让玩家们心动的功能，排名第一的是AI攻略助手，他们想要的是一个配合自己变强的工具；紧随其后的还有AI语音指令（解放双手）、AI NPC互动（与游戏内NPC智能体对话）、AI实时翻译（玩外服、看攻略刚需）……每一项，都是在游戏体验上再加一层便捷buff。值得一提的是，<strong>仅有10%的玩家明确表示对AI功能完全无感，看来在最接近极客群体的游戏用户里，“AI FOMO”(害怕跟不上AI时代)并不少见，大家都不想错过下一轮技术升级。</strong></p>\n  <p>如今厂商们都在开发端侧AI功能，即不联网也能在设备本地跑的 AI。本地实时翻译、攻略分析都要求平板自己有足够的NPU算力，不依赖云端。这正是2025年以来芯片厂商集体卷的新战场，也很可能是游戏平板角逐的下一个顶点。</p>\n  <p>当下的游戏平板市场，玩家不再为参数最高的那一台买单，用户真正需要的是一台“从第一分钟到第三小时都不掉链子”的平板——换句话说，是一台能持续输出稳定游戏体验的载体。游戏平板的用户们早已过了追求先锋的极客时期，而真正进入了追求体验的实用主义阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_1c73b1c4762042dbadc3638d57cf1c76@11416942_oswg11553oswg1000oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>把视角拉到平板用户内部，能看到一条更清晰的曲线：<strong>年轻人的游戏平板渗透率，断层领先。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_fb1457438c31480aad5839e4ec0e5414@11416942_oswg22152oswg801oswg690_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>30岁以下玩家的游戏平板渗透率，普遍在52%-60%之间；36岁以上人群，这个数字为28.6%。<strong>游戏平板正是这群“有消费能力、又有着充足游戏热情”的年轻人的新刚需。</strong></p>\n  <p><strong>游戏平板的另一条增长引擎，是玩家自身的“重度化”。游戏用户对游戏成绩和竞技精度的追求越认真，越倾向用平板。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7db0ea805a604ccca044726583b78dab@11416942_oswg55602oswg801oswg714_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在调研中，重度玩家的游戏平板常用率是轻度玩家的2.3倍。更值得注意的是中间层，重度与中度之间的差距只有 9.3pp，而中度与休闲之间的差距却拉到了15.1pp。这说明中度玩家是一个关键临界点——他们一旦从“放松解压”过渡到“固定游戏时间”，就会迅速向游戏平板靠拢。这也很合理，当你开始追排名、追胜率、追极限操作时，自然会免不了先解决硬件上的困难。把游戏设备翻新一下，从竞技心态上都自信了几分。</p>\n  <p>当然，同样是“觉得手机不够用了”，游戏平板的核心玩家背后的诉求也不尽相同，这高度取决于具体的游戏类型。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5a76316db0d04fba8412f6ac9fbe5ed4@11416942_oswg28133oswg800oswg901_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>统计检验显示，游戏类型与平板使用存在极显著相关。一个清晰的规律是：<strong>画面越复杂、操作越密集、单局时间越长，玩家越依赖平板。开放世界RPG玩家、MOBA玩家、FPS玩家，构成了平板游戏用户的“铁三角”。</strong></p>\n  <p>接下来，我们根据本次调研的玩家访谈结果，将“游戏平板核心用户”归纳成四类主要人群画像——他们各自代表了一种典型的游戏诉求，也各自撑起了游戏平板市场的一块版图。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e671813662d64bd0a97e64d6be0a8e49@11416942_oswg1429686oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人是平板游戏生态里最硬核的存在。他们玩的游戏，每一款都对<strong>反应速度、视野范围、触控精度</strong>有极高要求。对他们来说，平板的吸引力不在便携，而在多出来的视野和操作空间，大视野意味着FPS中能更早发现敌人；多指操作意味着更高的打法上限；高刷屏意味着不错过音游里的每个音符划过瞬间，打满Perfect。他们遇到的设备痛点也最锋利：手机一卡，满盘皆输；手机一烫，掉帧漂移。这群人对<strong>散热和性能释放</strong>的关注度，是所有玩家中最高的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_cfb6a7c1d08a4d579fbfb3b01ce14b20@11416942_oswg1377250oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人的核心诉求很直白——舒服。手机太小，看不清远处的山水细节；PC太正式，得正襟危坐对着显示器；主机太麻烦，得开电视、连手柄、找位置。<strong>平板是那个最“懒人友好”的中间态</strong>——架在床头的支架上，连个手柄，就能瘫着进入另一片赛博大陆。这群玩家中女性占比明显更高，她们也更愿意尝试云游戏和串流，只要网够好，平板照样能跑大制作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_a560897330f647d6a83dbb384c2eab73@11416942_oswg1635461oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人玩的游戏，每一款都不追求pvp竞技，但每一款又都在考验你的眼睛和手指。模拟经营游戏的特点是界面元素多、点击频次高、单局时间长。在手机上玩，常常出现“想点A误触B”的尴尬，更别说连续玩两小时之后眼睛的酸胀感。对他们来说，平板的价值不是上分，是<strong>“省手又护眼”</strong>——一种几乎被忽视、但极其真实的需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e528f373e36c4ac08fc1cccb034f07b9@11416942_oswg1820749oswg1000oswg1000_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这群人打的也是竞技类游戏，但和FPS/MOBA玩家不同，他们不靠手速和反应，靠的是智谋，享受的是<strong>运筹帷幄的博弈感</strong>。可策略玩家最大的痛点是——手机误触。在三国杀里，手抖一下放错牌，可能就是一整局崩盘；在炉石里，错位拖拽一张卡，结算瞬间反向劝退。大屏不是为了爽，是为了不输，更好地做一个幕后军师。平板则提供了一种从容感：<strong>你可以缓缓拖动卡牌、仔细比对场上局势、放大查看每一个数值——这是策略玩家最看重的“决策舒适区”。</strong></p>\n  <p>数据之外，我们也带着这些洞察，与几家主流游戏平板品牌进行了深度对话。有意思的是，厂商们对“玩家到底要什么”也有着自己一线的观察和理解——这些来自产品定义者的声音，恰好和我们的调研结论形成了相互印证。</p>\n  <p><strong>@京东采销</strong></p>\n  <p>消费者选购游戏平板时，决策链路极短且目标明确——核心验证“帧率稳不稳、手感沉不沉、散热烫不烫”。作为京东平台增速最快的趋势品类之一，游戏平板代表着移动电竞从“小众极客”迈向“大众消费”的关键拐点。</p>\n  <p>京东将依托亿级游戏用户的行为洞察，联合品牌方在芯片迭代、配件生态与赛事内容运营上深度共建，推动游戏平板成为电竞生态的“第二块屏幕”，共同撬动移动电竞的百亿增量市场。</p>\n  <p><strong>@红魔</strong></p>\n  <p>从应用场景来看，游戏平板的消费者十分关注高负载下的性能释放、长时间对战的散热稳定性，以及屏幕的极致显示与操控体验。</p>\n  <p>红魔推出的专业游戏小平板，<strong>以玩家真实对战体验为核心</strong>，通过旗舰性能平台与全链路立体散热方案的深度协同，持续提供满帧稳帧的流畅游戏体验，保障高负载运行下的<strong>稳定温控</strong>；同时更率先在小尺寸游戏平板上搭载高端OLED电竞屏，以<strong>低延迟、高亮度、广色域的屏幕</strong>还原对战细节，让硬核电竞体验无缝融入日常对战与娱乐场景，释放玩家的全部战力与游戏创造力。</p>\n  <p><strong>@联想</strong></p>\n  <p>移动游戏正在呈现出精品化、细分化的用户特征，用户需要大屏视野、稳定帧率、持续性能释放，以及AI对于游戏的加成体验。</p>\n  <p>游戏平板产业正从“参数内卷”转向“AI+生态+形态创新”的新阶段，其核心是“便携尺寸+高分电竞屏+主机级体验+全场景AI应用”。联想拯救者游戏平板凭借优于手机的散热、屏幕与操控体验，历经多代产品升级，赢得广大游戏用户认可。<br />特别是它内嵌天禧AI，可实现“全境畅连、声纹猎手、像素狙神”等AI游戏全新体验，成为游戏玩家的首选移动游戏硬件之一。游戏平板正在从补充娱乐设备转向主力游戏终端，进而成为移动游戏的核心载体。</p>\n  <p><strong>@iQOO</strong></p>\n  <p>从消费趋势来看，游戏玩家正在从“能玩”走向“玩得更极致”，对画质、帧率、操控和沉浸感提出了更高要求。iQOO Pad6 Pro以玩家体验为核心，配备13.2英寸4K 144Hz电竞级巨幕，让玩家拥有更沉浸的游戏体验。</p>\n  <p>未来，iQOO将持续深耕游戏平板赛道，不断突破性能上限，深化软硬协同能力，完善游戏生态与跨端互联体验，打造兼具专业电竞实力与旗舰生产力的全能游戏平板，为玩家带来真正面向未来的移动游戏体验。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_c4ec2d9578d74c57883d735a5c2c942a@11416942_oswg239oswg229oswg23_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>最后，当问到消费者“如果只够升级一台设备，你会选哪个时”，调研显示，<strong>游戏平板以接近4成的占比超过了手机，成为玩家最优先的升级选项。</strong></p>\n  <p>这是一个标志性的拐点。要知道，过去十年，手机一直是消费电子的绝对优先级——但当游戏的胃口超过手机的容量，当25-30岁的玩家进入设备升级周期，平板逐渐从备选项变成了第一选项。<strong>游戏平板，已经是玩家们下一笔大额预算的归宿。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_06c7483787704bb894a38a9441267712@11416942_oswg70764oswg800oswg677_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这份归宿的指向也相当具体——<strong>红魔游戏平板5 Pro、联想 Y700 五代、iQOO Pad 6 Pro、一加 Pad 3 Pro、红米 K Pad 2</strong>等，这些新生代游戏平板几乎构成当下游戏平板赛道的主力机型矩阵。它们各自代表了不同的取向，有的把散热堆到极致，有的押注8 英寸小钢炮的便携手感，有的则搭载高通骁龙旗舰芯片在端侧AI上抢跑——你能想到的玩家诉求，背后都有一台对应的机器在卷。</p>\n  <p>在购买渠道上，京东是玩家们的首选平台。原因并不复杂：长期以来，京东在3C数码领域形成了较强的专业心智，也是品牌新品首发的主要阵地。对准备升级设备的玩家来说，京东丰富的产品供给、正品保障和完善售后，仍然是下单时最重要的确定性。恰逢京东618，入手游戏平板还可享受国补立减15%，叠加以旧换新福利最高能省1500元，这也进一步降低了换新门槛。</p>\n  <p>说到底，一台真正趁手的游戏设备，是需要不断调试、慢慢磨合，才能找到那台最心水的。与其在下单前反复纠结，<strong>不如投奔一个容错空间更大的购物平台，让试错的成本降到最低。</strong>毕竟，游戏的世界里，装备的事从来不能将就。愿大家都能设备升级，战神附体，把把MVP。</p>\n  <p>&nbsp;</p>\n  <p>策划：许嘉婧<br />视觉、插画：曲枚</p>", "category": "tech", "published_at": "2026-06-10T01:26:15+00:00", "fetched_at": "2026-06-10T02:57:11.912598+00:00", "fingerprint": "28d4b46a9c4037b1"}, {"source": "36氪 - 最新文章", "title": "清华系团队做分布式预测世界模型、获数亿元A轮融资，落地终端设备达十万量级｜硬氪首发", "url": "https://36kr.com/p/3844720012151040?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，具身智能世界模型公司「千诀科技」日前完成数亿元A轮融资，本轮由京铭资本领投，山东新动能、山东财金资本、元禾厚望、芯能创投、南创投、英诺天使基金、尚势资本、仁爱集团、玄素投资等机构共同投资，投资方阵容汇集了国家队、产业方、市场化基金及家族办公室。Maple Pledge枫承资本长期出任私募股权融资顾问。</p>\n  <p>资金将重点用于自研世界模型的架构搭建、算法迭代与场景落地，同步扩充核心研发与项目交付团队，完善商业化落地配套能力。</p>\n  <p>千诀科技创立于2023年6月，核心团队孵化自清华大学类脑研究中心，长期聚焦具身智能决策与规划大模型研发落地，突破传统设备任务局限，以帮助机器人实现环境动态自适应与全自主作业。</p>\n  <p>世界模型的热潮正迅速卷向具身智能领域，成为通用人工智能落地物理世界的核心突破口。卷积神经网络之父Yann LeCun（杨立昆）率先提出世界模型核心理论，其创办的AMI团队持续专注抽象表征空间建模、物理世界规律预测的技术方向研究，为行业奠定了核心理论基础。</p>\n  <p>从因果推理到空间智能，从物理仿真到生成式预测，基于不同技术范式、不同理论底座的研究在业内正同步展开。这是个尚未收敛、想象力巨大的赛道。各路探索者都在试图回答同一个问题：如何让机器真正理解并预知物理世界的变化。</p>\n  <p>在主流的生成式路线中，典型做法是通过像素级重构来预测下一帧画面。但千诀科技CTO章天任向硬氪指出，这种方法往往存在一个容易被忽视的问题——特征污染。</p>\n  <p>“真实物理世界的图像输入信息量极大，包含大量与任务无关的噪声，比如光影、纹理。”章天任解释，模型为了追求像素级的无损重构，不得不把有效特征和无效信息强行绑定在一起，结果可能导致模型内部表征不再“纯净”，“它确实能从现实数据中提取出具有泛化性的特征，但这些特征里混入了干扰项。”</p>\n  <p>这种污染会直接影响模型对物理世界的理解能力。世界模型的本意是让模型学会符合物理规律的预测，而不是单纯地拟合图像。一旦特征被污染，模型就很难提炼出真正的因果关系和物理不变性，泛化能力自然受限。</p>\n  <p>“人看一张图时，不会平均分配注意力在每个像素上，而是快速锁定与任务相关的区域。”章天任说，“但生成式模型与其说是理解世界，却更容易发生复刻表象的情况。”</p>\n  <p>面对生成式路线存在特征提取的这一局限，预测式世界模型提供了另一种思路。 其核心逻辑是，让机器人真正理解物理世界，不是靠还原每一帧像素，而是靠预测物理状态的低维演化轨迹。</p>\n  <p>千诀科技CEO高海川用一个案例解释了两者的本质区别：人在打球时，不会在脑中想象一帧帧清晰的画面，而是直接挥拍，依靠对球轨迹的低维预测。这种预测不包含像素信息，只包含物理规律的状态演化。“人类在物理世界中玩球类游戏，不可能去想象清晰完整的像素画面，来不及，而且这种信息不稳定。”高海川说。</p>\n  <p>同样的逻辑适用于具身智能。执行任务时，机器人需要的不是“未来会长什么样”的想象，而是“下一个状态该往哪走”的预判。预测式模型的核心输出不是视频帧，而是低维抽象特征，这些特征可以直接解码为动作轨迹或规划指令，从而绕开像素重构带来的计算负担和特征污染问题。</p>\n  <p>在预测式路线基础上，千诀科技还进一步提出了分布式预测架构。其架构采用了类人脑的脑区连接方式，大脑不同区域各司其职，连接紧密的区域内部协同，区域之间则相对独立。</p>\n  <p>对比传统方法把所有信息揉在一起压缩处理，分布式预测架构会先把信息分到不同的区域里，再分别压缩和预测，从而实现样本效率更高，推理速度更快。“同样一个任务，从零开始可能需要1000个‘状态-动作’对；有了好的表征，100个就够了，有效减少了机器人适应新场景所需的示教数据。”章天任说。</p>\n  <p>通过这种分布式架构，可以帮助模型在抽象表征空间中学习物理状态的演化规律，而非仅仅是像素的时序关联，更好地服务于下游的规划与控制。当机器人面对新环境时，可以更快地理解“什么会导致什么”，对真实场景落地尤为关键。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_2559a19a39fb48bfaf7f18259d336ecf@6022551_oswg264181oswg2844oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人在餐厅打工（图源/企业）</p>\n  <p>具体到应用端，千诀科技将具身大脑与小脑解耦，由其世界模型负责感知、预测与规划，不绑定具体的执行动作空间。只要共享同一模态，模型就能将其观察到的环境变化作为统一的数据来源进行训练。这意味着，同一个“大脑”可以快速迁移到不同本体上，解耦设计有效降低了迁移成本，并加速了真实场景中的数据飞轮闭环。</p>\n  <p>据硬氪了解，千诀科技自研具身大脑已完成轮式、四足、双足人形、无人机、清扫机器人等多品类硬件适配，落地酒店保洁、商用服务、精密室内作业等实景项目，当前接入终端设备规模达十万台。依托海量终端持续产生的真实交互数据，未来将反哺世界模型进一步迭代优化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_e5984f27e4554c9483e318010f2106c0@6022551_oswg689261oswg1242oswg742_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人在咖啡店自主配送（图源/企业）</p>\n  <p><strong>以下为硬氪与千诀科技CEO高海川、CTO章天任的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：开环预测场景下，世界模型的长时推理误差会随步数累积。千诀的预测式架构如何应对这一问题？具身任务的闭环反馈机制能在多大程度上抑制误差放大？</strong></p>\n  <p><strong>章天任：</strong>这个问题分几个层面。第一，累积误差的大小取决于应用场景是否具备闭环反馈。视频生成模型是纯开环的，一次性预测未来很多帧，中间没有任何外部信息校正，所以误差容易累积。但具身不同在于它有闭环反馈，我们不会让机器人一次性预测1000步、把整个任务全部规划完再执行，而是先预测50步，选出动作去执行，执行完后环境会给出新的状态作为反馈，基于反馈修正后续预测。</p>\n  <p>这种“执行-观测-修正”的循环，是具身任务与视频生成最本质的区别，能有效抑制误差放大。</p>\n  <p>第二是关于记忆模块。千诀目前已经在一些平台上尝试搭建Memory系统，但还没有与视觉中心直接融合。原因在于，既然已经有了闭环反馈，很多场景下暂时不需要显式的长期记忆。</p>\n  <p>第三，千诀的模型支持多步预测，模型预测的“一步”不一定对应底层的一个控制指令，而可以对应一个完整的语义动作，比如50个底层step。预测步数越少，累积误差发生的概率和幅度就越小。</p>\n  <p>总的来说，我们认为世界模型的能力上限挑战在于完全开环的超长时规划，比如机器人还没开始行动，就要一次性规划好未来几百步的所有细节。但这种使用场景在真实的具身任务中很少见，更自然、更现实的做法还是“边做边看”，发现问题随时调整。</p>\n  <p><strong>硬氪：千诀已实现十万台级别的规模化部署。在实际落地过程中，客户反馈中有哪些超出预期的发现？对你们的产品迭代有什么影响？</strong></p>\n  <p><strong>高海川：</strong>千诀目前已有十万台机器在真实场景中运行，用户把机器人当真实产品使用，给出的反馈也是真实的。因此，我们训练的模型与落地场景之间不存在“real-to-real gap”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260609/v2_41e8467acc53436aa8ada2335c9bf376@6022551_oswg2925058oswg2472oswg1622_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人自主清洁桌面（图源/企业）</p>\n  <p>市场反馈中有两个点超出了我们的预期。</p>\n  <p>一个是响应速度的敏感度。 不同场景对延迟的容忍度差异很大。生成式模型4秒级的响应，在机器人场景中基本不可用。我们的预测式模型虽然推理速度快、可以在0.5秒内返回结果，但部分机器人需要云端传输延迟在1秒左右，客户仍然反馈“卡顿”。当我们把延迟降低0.5秒，用户体验就有了质的飞跃，这种毫秒级的延迟优化，往往比模型能力的提升更能直接转化为用户满意度。</p>\n  <p>另一方面在于主动性的价值。 大多数时候，客户并不希望机器人只是一个被动执行指令的工具，而是期待它能“眼里有活”——主动感知环境、自主决策，而不是逐条等人类发令。比如在酒店场景中，机器人主动发现地面有污渍并启动清洁，比接到指令再执行，更能让客户感受到“智能化”。这种从“被驱动设备”到“智能体成员”的体验跃迁，正在成为产品差异化的关键维度。</p>", "category": "tech", "published_at": "2026-06-10T01:30:00+00:00", "fetched_at": "2026-06-10T02:57:11.912589+00:00", "fingerprint": "38534e977c78c41e"}, {"source": "36氪 - 最新文章", "title": "医药圈最强“奥斯卡”也没救回股价，创新药被彻底抛弃了么", "url": "https://36kr.com/p/3845683804555529?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>基本面向上、股价向下，是近期创新药板块的真实写照。</p>\n  <p>6月以来，股市创新药板块延续跌势。上周，在全球肿瘤临床权威“风向标”的美国临床肿瘤学会（ASCO）上，多家中国创新药企公布了高价值的临床研究成果，但却未能成为扭转行情的催化剂。</p>\n  <p>既往，ASCO上公布的新药临床研究进展是影响创新药企股价的关键变量。当下，随着BD出海热潮，ASCO又被赋予了“集中检验新药资产成色”的意义，因为“没人敢在ASCO上数据造假”。</p>\n  <p>尤其是，中国创新药企今年带去ASCO的成果堪称历届最佳：本届ASCO收录的7239篇研究摘要中，中国机构/新药参与的摘要高达488篇，占比6.7%，仅恒瑞医药就有80多篇；质量上，康方生物的PD-1/VEGF依沃西单抗已登上含金量最高、全球仅有5项研究入选的全体大会（Plenary Session）。百利天恒、百济神州、科伦博泰、三生制药等12家企业的13项研究入选突破摘要（LBA）。</p>\n  <p>但令人意外的是，二级市场却并未给予同等热情，“ASCO周”连跌5天、一片飘绿。尤其是康方生物、百利天恒、迪哲医药、基石药业等被公认披露了更高质量临床研究的创新药企，最高者一日曾大跌超30%。利好落空的状态未随会议结束消散，低迷一直持续到本周。</p>\n  <p>在进入全球市场的新阶段，资本市场也在以更严格的标准，衡量中国创新药企业在全球的投资价值。</p>\n  <h2><strong>市场在犹豫什么</strong></h2>\n  <p>多位创新药行业受访者认为，中国创新药企今年在ASCO上披露的研究质量不错。“虽然重磅大三期仍是少数，但已能覆盖各阶段、多类Modality研究，整体很丰富。”湾岛生物创始人范晓虎提到，这与早几年，中国药企在其中的标签还是“me too”、重磅研究更是极少的情况截然不同。</p>\n  <p>当下的时间点，少有人再质疑中国创新药的质量。那么，问题出在哪？</p>\n  <p>有从业者认为，个股短期股价波动影响因素繁杂。近期，资金整体流向了回报预期更清晰的科技板块，同时，做空机构在数据发布前后的埋伏也并不罕见。“ASCO临床数据本身无法预判短期股价波动，存在为持仓找理由的成分。”</p>\n  <p>而且，ASCO本质是面向临床医生的学术交流会，不与短期商业价值挂钩，即便是像康方生物那样入选顶级汇报，多数情况下也是通过缓慢影响临床指南、医生用药选择来协助商业化红利的长线兑现，无法影响短期业绩。</p>\n  <p>外部政策环境压力，也会影响资本市场表现。一位前往ASCO现场的药企人士提到，会议现场由欧美人士为主导的交流中，能隐约感受到一丝“对中国创新药行业的忌惮，国内企业的发展速度给欧美本土生物科技企业带来了一定压力，波士顿当地博士生找工作也比过往困难”。</p>\n  <p>叠加美国共和党议员近期提议将生物技术（尤其似乎药品和生物制品）纳入COINS法案禁止投资范围的消息在国内发酵，地缘政治或进一步收紧、政策监管风向未明，投资者自然会重新评估国产新药通过BD等方式进入全球化体系的潜藏风险。</p>\n  <p>对此，波士顿投行Locust Walk中国区董事总经理刘辰分析认为，其实，“法案等政策、法务问题不会是现阶段制约国内药企实现全球化价值的核心瓶颈”。</p>\n  <p>他解释，美国医药市场由三大利益派系制衡：以辉瑞等为代表的跨国药企受益于中国低成本、高效率的研发优势，主张深化对华合作，且“在政界的影响力非常大”；一部分美国本土VC则因国产创新出海挤压当地被投生物科技企业发展空间、高利率冲击收益，存在反对合作声音。</p>\n  <p>此外，RA Capital等为代表的全球化资本则相对中立，他们认为研发技术源头“不受地域限制，只要项目具备商业化潜力就愿意投入孵化”。这从其高管近来多次到中国考察，并与Biobay等医药产业园频频合作的动作也可看出端倪。</p>\n  <p>“我们认为，<strong>三方势力虽在持续博弈，但美国资本市场整体以利益为核心导向，高度参考项目知识产权属性做决策</strong>。当前，部分中国早期研究存在依托国内地域优势规避海外专利授权成本的问题，这往往会被海外机构认定为合规性不足。但对自主布局完整知识产权的国产创新项目，他们愿意遵循市场化竞争逻辑，提供平等合作机会。”刘辰表示。</p>\n  <p>创新药的价值验证是一个实证科学过程，在人体中展示出疾病治疗效果需要时间。由于创新药潜在的市场空间和经济价值，其在全球拓展推进中，难免会受到地缘政治、经济环境等因素影响，需要做更多沟通工作。疾病治疗的有效性和安全性是创新药的内核力量，只有证明这点，才有资本谈论更上一层的烦恼。今天的所谓‘质疑’，恰是中国新药已走进全球竞争的证明。”纳安生物创始人渠志灿认为。</p>\n  <h2><strong>新的阶段、新的标准</strong></h2>\n  <p>当下，尽管外界对创新药BD出海里程碑收入兑现有祛魅情绪，但在国内医保支付的现实约束，和药企海外商业化能力尚待完善的背景下，BD在很长一段时间内，仍会是创新药企最核心的创收路径。</p>\n  <p>现阶段对创新药企的真正考验，在于谁能探索出更具市场前景的BD研发方向、并成功交易。这一趋势在ASCO上已初露端倪。</p>\n  <p>渠志灿在美国从事近30年新药研究，多次参与ASCO，团队今年有3项涉及ADC/RDC的研究被收录。她解释，肿瘤新药研发的底层思路，围绕着三个核心临床挑战展开：克服肿瘤异质性、耐药性和打破诊疗分离。历届ASCO上的各类ADC、双抗、核药等Modality创新，或不同靶点组合、联合用药方案探索，大多都在尝试从这三个维度寻求突破。</p>\n  <p>但如今，她能感受到的变化是，<strong>参会中国创新药企已经在引领一些研发方向，不满足于只被看见、平等交流，而是希望自己的研究方向被国际同行认可，真正参与到全球肿瘤治疗范式的演进中来</strong>。</p>\n  <p>本届ASCO上，最具代表性的潜力方向之一是ADC（抗体偶联药物）+IO（免疫治疗）组合疗法。</p>\n  <p>它最初源于默沙东为自家的“PD-1抗癌神药”K药打造的“K药+ADC”联合治疗体系，核心思路是，传统免疫治疗单药/联合化疗疗效触及瓶颈，而ADC药物能激活肿瘤自身免疫反应，把原本躲避免疫攻击的“冷肿瘤”变成容易被免疫细胞盯上的“热肿瘤”，使免疫治疗更好发挥作用。</p>\n  <p>PD-1和ADC药物研发都涉及中国药企擅长的工程化改造，领跑者如今多来自中国。ASCO上，科伦博泰首次公布自研ADC芦康沙妥珠单抗联合K药，一线治疗PD-L1阳性晚期非小细胞肺癌的III期临床研究。对比K药单药，它显著延长PFS、降低进展/死亡风险，这也是全球首次有ADC+IO在III期研究中正面击败“药王”K药。</p>\n  <p>此外，包括恒瑞医药、荣昌生物、百奥泰、石药集体等在内，均披露了相关研究，且都处于II/III期后期临床阶段。可以预见，ADC+IO挤进肿瘤一线治疗指南的前景可期。在传统HER2 ADC代表的ADC单药赛道饱和的情况下，这是值得BD团队重点关注的迭代方向。</p>\n  <p>当然，能形成产业趋势的研究方向是少数。刘辰认为，国内创新药团队更擅长前期靶点和工艺研发，缺少全球临床开发经验。临床进入I期爬坡、适应症拓展阶段后，如何选择优先开发的病种、设计临床方案普遍存在短板。借ASCO场地，直接当面向海外顶尖临床专家请教全球市场临床开发问题，能省去不少力气。</p>\n  <p>“ASCO是跨国药企肿瘤研发高管和KOL集中密度最高的地方。BD决策中，不仅R&amp;D部门的声音很关键，跨国药企内部立项评审本身也高度依赖外部权威PI意见。如果顶尖PI在ASCO上认可某项药物、某个研究方向的临床价值，反过来为跨国药企提供咨询时也有帮助。”刘辰经手的一个项目，就是专家在ASCO上了解到该研究后，主动发邮件推荐给跨国药企研发负责人，得以顺利推进谈判。</p>\n  <p>这的确代表了一部分企业的参会初衷。今年，诺诚健华的新型BCL2抑制剂mesutoclax用于治疗骨髓增生异常综合征（MDS）的方案入选ASCO口头报告。目前，市场上没有BCL2抑制剂获批治疗MDS。诺诚健华方面对36氪表示，本次参与ASCO，核心目的之一就是向国际血液肿瘤专家咨询“更多关于mesutoclax等管线的临床开发建议，以加速产品上市进程”。</p>\n  <p>范晓虎同样提到这点。湾岛细胞瞄准非基因编辑通用CAR-T路径，意在实现现货型CAR-T的大规模工业化生产。在细胞治疗企业集体转向体内CAR-T研发的当下，这个方向颇为小众。</p>\n  <p>“我们只展示了部分早期研究成果，未期待凭借少量患者数据达成合作，核心目的是向行业介绍新赛道、展示公司技术平台，建立认知。整体效果不错，最近接到很多沟通诉求，现场有同行认可这是具备验证价值的新方向。”</p>", "category": "tech", "published_at": "2026-06-10T02:07:22+00:00", "fetched_at": "2026-06-10T02:57:11.912573+00:00", "fingerprint": "8c4e8535fa64eaa9"}, {"source": "少数派", "title": "众测招募｜灵犀 Linx 键盘功能共创计划开启", "url": "https://sspai.com/post/110863", "summary": "少数派联合思维重置与Akko共创的新产品「灵犀Linx键盘」即将上市。在产品正式发布前，我们希望邀请一批用户提前参与体验，共同验证功能设计和使用场景。本次将面向少数派社区招募10名体验用户。关于灵犀L ...<a href=\"https://sspai.com/post/110863\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-09T04:00:00+00:00", "fetched_at": "2026-06-10T02:57:09.938392+00:00", "fingerprint": "5052c18c2c4dd839"}, {"source": "少数派", "title": "社区速递 144 | 听 AI 开「营养处方」、无感耳夹耳机与磁吸支架", "url": "https://sspai.com/post/110907", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/110907\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-09T09:06:41+00:00", "fetched_at": "2026-06-10T02:57:09.938385+00:00", "fingerprint": "d13b833409c6c599"}, {"source": "少数派", "title": "派早报：Apple 更新 App Store 审核与订阅规则、Anthropic 发布 Claude Fable 5 等", "url": "https://sspai.com/post/110925", "summary": "小米发布 MiMo V2.5-Pro-UltraSpeed，Marshall Stockwell III 发布等。<a href=\"https://sspai.com/post/110925\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-10T00:14:32+00:00", "fetched_at": "2026-06-10T02:57:09.938373+00:00", "fingerprint": "3e29dcd0409853da"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7811 CNY ↓-0.36%", "url": "https://www.frankfurter.app/2026-06-09?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-06-09</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7811 CNY</b> <span style=\"color:#5cb85c;font-size:14px;\">↓ -0.0171 (-0.36%) 贬值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-06-10T02:57:08.473147+00:00", "fingerprint": "9944bac6278bea15"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
