<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

hat the Quick Insert and Google logo keys are new. They're not, as they first debuted a couple of years ago on some Chromebooks. But there is something new for Googlebooks that's ripped straight from Android phones circa 2014. On every Googlebook keyboard, the F1, F2, and [&#8230;]", "category": "tech", "published_at": "2026-10-07T20:44:34+00:00", "fetched_at": "2026-10-08T04:12:10.397358+00:00", "fingerprint": "cb9c440eefec8585"}, {"source": "The Verge", "title": "Teenage Engineering’s CEO says it’ll stop making synths", "url": "https://www.theverge.com/gadgets/1007489/teengage-engineering-stop-making-synths", "summary": "Teenage Engineering founder and CEO Jesper Kouthoofd told Highsnobiety that it plans to stop making synths. And yes, that includes the iconic OP-1, which put the company on the map. TE isn't just a music gear maker; it's also a sought-after design firm. It's collaborated with Ikea, Nothing, and Playdate, among others. But almost everything [&#8230;]", "category": "tech", "published_at": "2026-10-07T21:19:54+00:00", "fetched_at": "2026-10-08T04:12:10.397354+00:00", "fingerprint": "3d4fe48f52fe06bb"}, {"source": "The Verge", "title": "BMW’s iX4 SUV is a 428-mile defensive weapon against China’s EV takeover", "url": "https://www.theverge.com/transportation/1006837/bmw-ix4-ev-range-price-specs-tesla-china", "summary": "While much of the automotive world sits dumbfounded as China gobbles up all its customers, BMW continues to roll out extremely well-crafted, technologically advanced electric vehicles that impress in both drive quality and price. The latest is the BMW iX4, a coupe-shaped SUV that puts a sportier spin on the automaker's iX3. The iX4 is [&#8230;]", "category": "tech", "published_at": "2026-10-07T22:01:00+00:00", "fetched_at": "2026-10-08T04:12:10.397345+00:00", "fingerprint": "07f028a05d607400"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨中国航协回应东航空姐跪地道歉事件；DeepSeek新一轮融资逼近1000亿；安踏集团正式成为彪马最大股东", "url": "https://36kr.com/p/4016467711316101?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>SpaceXAI官宣更名SpaceXSI</li>\n   <li>OpenAI将在欧盟为ChatGPT和Codex文本输出添加隐形水印</li>\n   <li>2026年诺贝尔化学奖、物理学奖揭晓</li>\n   <li>7-11便利店退出印度</li>\n   <li>苹果一号电脑或拍出80万美元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>中国航协回应东航空姐跪地道歉事件</strong></p>\n  <p>10月7日，中国航协发文回应“东航空姐跪地道歉”事件。中国航协称，东航航班客舱服务中，餐车偶发触碰旅客，当班乘务员、乘务长多次致歉并开展服务补救后，该旅客仍对乘务员进行言语攻击与威胁。目前，东航已完成证据固定并正式报案。中国航协表示，乘务员人格尊严和履职权益受法律保护，旅客辱骂、恐吓工作人员已超出正常维权边界，涉嫌违反民用航空法和治安管理处罚法，并呼吁旅客文明乘机、理性维权。（澎湃新闻）</p>\n  <p><strong>DeepSeek新一轮融资逼近1000亿</strong></p>\n  <p>10月6日，据媒体报道，杭州深度求索人工智能基础技术研究有限公司（以下简称“DeepSeek”）已接近锁定最新一轮至少800亿元人民币融资，最终规模按已签署条款清单可逼近1000亿元，远超公司最初约500亿元募资目标。此前有报道称，DeepSeek本轮目标估值约5000亿元人民币，但未言明投前或投后估值。本轮融资规模或近千亿元，意味着DeepSeek实际估值水平并未较此前完成的首轮有明显提升。消息指出，以上融资程序接近收官，宁德时代与腾讯控股或成为承诺出资金额最高的投资方，且所筹资金将为公司IPO铺路。（21世纪经济报道）</p>\n  <p><strong>安踏集团完成收购彪马29.06%股权，正式成为最大股东</strong></p>\n  <p>36氪获悉，10月7日，安踏体育用品有限公司宣布，已完成以15.055亿欧元现金对价向Pinault家族的投资公司Artémis SAS收购全球标志性运动品牌彪马（PUMA）所属公司PUMA SE 29.06%股权的交易，并已获得所有相关监管机构批准及满足惯例交割条件，安踏集团正式成为彪马的第一大股东。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI面向全球所有ChatGPT用户全面上线GPT-6</strong></p>\n  <p>OpenAI面向全球所有ChatGPT免费及付费用户全面上线GPT-6，正式取代GPT-5.6 SOL与GPT-5.6 LUNA。GPT-6集成Astra安全技术改进，强化针对网络、生物与暴力领域滥用的防护。（财联社）</p>\n  <p><strong>马斯克率先为AI改名，SpaceXAI官宣更名SpaceXSI</strong></p>\n  <p>10月4日，马斯克在社交平台X上正式确认，旗下人工智能业务SpaceXAI将更名为SpaceXSI。他在回复网友提问时直接表态：“是的，我们会做出这个改变”，并补充称“不再叫AI，叫SI，这样更好”。随后，马斯克还发文宣称“SpaceX是一家超级智能公司”。这意味着，SpaceXAI在短短数月内将迎来第二次品牌更名。今年2月，马斯克旗下的航天公司SpaceX以全股票方式收购了他创立的人工智能公司xAI，Grok大模型和社交平台X也随之并入SpaceX体系。7月，xAI正式完成品牌重组，更名为SpaceXAI，同步更换了标识和X平台用户名。（新浪财经）</p>\n  <p><strong>谷歌AI图像模型Nano Banana 2.1发布，提升视觉设计、蒙版编辑、主体一致性</strong></p>\n  <p>IT之家10月7日消息，谷歌于今日正式发布了Nano Banana 2.1，这是该公司AI图像生成与编辑模型的升级版本。谷歌强调，新版Nano Banana 2.1实现了全方位提升，在视觉设计、基于蒙版的图像编辑以及主体一致性这几方面的进步尤为突出。改进后的主体一致性对于Gemini用户而言实用性很强，可以保证同一个人物或者物体在多次生成结果当中保持样貌统一。谷歌Nano Banana 2.1现已逐步部署上线，覆盖Gemini应用、谷歌搜索的AI模式、Google AI Studio、Google Flow、Stitch、谷歌广告以及Gemini企业平台。（IT之家）</p>\n  <p><strong>OpenAI将在欧盟为ChatGPT和Codex文本输出添加隐形水印</strong></p>\n  <p>IT之家10月5日消息，OpenAI今日宣布，为配合《欧盟人工智能法案》的内容透明要求，未来几周将在欧盟地区符合条件的ChatGPT和Codex文本输出中加入机器可识别的隐形水印。据介绍，文本水印技术名为textGrain（文本粒水印），会在模型选词过程中嵌入不可见的统计信号。检测器通过识别该信号，判断一段文本是否带有OpenAI水印。据了解，OpenAI下一步将在欧盟推广文本水印。未来几周，团队将仅在欧盟所有计划中向符合条件的ChatGPT和Codex用户引入文本水印功能。值得一提的是，OpenAI不会在发布时将文本水印设为全球默认。（IT之家）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>星巴克回应“无糖饮料”含糖</strong></p>\n  <p>10月6日，据中新经纬消息，近日有消费者在美国西雅图地区发起诉讼，指控星巴克八款蛋白饮料虽标注“无糖（Sugar-Free）”，但实际上含有不同量的糖，涉嫌虚假宣传。界面新闻查询星巴克美国官网看到，一款16盎司的冰无糖香草蛋白拿铁，营养表中明确标注含糖量为9克；同规格热款无糖香草蛋白抹茶，总糖含量达到16克，更大杯型20盎司版本总糖甚至达到20克。产品配料表写有牛奶以及乳清分离蛋白（来源于牛奶）。对此，星巴克方面表示，饮料中的糖分来自牛奶，产品本身没有加糖，使用了无糖糖浆调味。星巴克发言人则称，“公司一直持续、清晰地在产品公告、菜单、营销材料、官网和APP中，提供其蛋白质饮料、无糖选项、定制选择和营养成分的有关产品信息，我们打算坚决辩护。”</p>\n  <p><strong>2026年诺贝尔化学奖揭晓，2名科学家获奖</strong></p>\n  <p>当地时间10月7日，瑞典皇家科学院决定将2026年诺贝尔化学奖授予2名科学家。奖项授予亨利·卡根（Henri Kagan）和硤合宪三（Kenso Soai），以表彰他们在不对称有机合成中的非线性效应和自催化方面的发现。获奖者将平分1200万瑞典克朗（约合802万元人民币）奖金。（中国基金报）</p>\n  <p><strong>苹果强制开发者适配iPhone Duo</strong></p>\n  <p>苹果首款折叠屏手机iPhone Duo将于10月23日正式发售，苹果出台相关强制适配规则，明确自2027年4月起，所有应用必须提供iPhone Duo适配专属截图，否则将无法更新上架。目前该要求尚处于过渡期，未完成适配的旧应用仍可正常运行，若到2027年4月后相关应用仍未补齐对应适配截图，将无法进行更新操作。（凤凰网科技）</p>\n  <p><strong>保时捷：计划员工规模削减25%，汽车业务净现金流利润率目标9%-12%</strong></p>\n  <p>保时捷在资本市场日发布会材料中表示，集团中期目标销售营业回报率为10%-15%，汽车业务净现金流利润率目标9%-12%。长期目标为集团销售营业回报率15%，汽车业务净现金流利润率12%。集团中期营收目标区间410亿欧元至450亿欧元，现金生成能力预计实现超比例增长。公司计划通过精益运营与成本削减，将盈亏平衡点降至20万辆以下。公司中期管理层岗位裁减40%。员工规模削减25%，战略目标为裁减30%。（新浪财经）</p>\n  <p><strong>苹果一号电脑或拍出80万美元</strong></p>\n  <p>一台罕见的苹果一号电脑正在邦瀚斯拍卖行进行线上拍卖，开放竞价日期为本月（10月）4日至14日，估价为50万美元至80万美元。据拍卖行介绍，这台电脑由原主人于1976年购入，主板上有苹果联合创始人沃兹尼亚克的签名。苹果一号电脑是苹果公司的首款电脑产品，以组装好的电路板形式出售，当时售价666美元，目前确认存世的不足75台。（央视财经）</p>\n  <p><strong>美联储10月维持利率不变的概率为80.6%</strong></p>\n  <p>据CME“美联储观察”：美联储到10月维持利率不变的概率为80.6%，累计加息25个基点的概率为19.4%。美联储到12月维持利率不变的概率为21.7%，累计加息25个基点的概率64.1%，累计加息50个基点的概率为14.2%。（财联社）</p>\n  <p><strong>国际能源署成员国同意加快释放1亿桶石油储备</strong></p>\n  <p>当地时间7日，国际能源署（IEA）发表声明说，其成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投放市场，预计还可释放约1亿桶石油。声明还说，针对当前柴油市场供应紧张的情况，其成员国同意在条件允许的情况下优先投放柴油。（央视新闻）</p>\n  <p><strong>美股三大指数收盘集体下跌，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，10月8日收盘，美股三大指数集体下跌，道指跌0.66%，纳指跌0.22%，标普500指数跌0.22%。大型科技股涨跌不一，奈飞、亚马逊涨超1%，苹果、谷歌、英特尔、微软小幅上涨；SK海力士、Meta跌超2%，特斯拉、英伟达小幅下跌。热门中概股涨跌互现，京东涨2%，蔚来、网易涨超1%，理想汽车、小鹏集团小幅上涨；富途控股跌超3%，阿里巴巴、百度跌超2%，老虎证券跌超1%。</p>\n  <p><strong>印度央行近四年来首次加息，暗示可能进一步收紧货币政策</strong></p>\n  <p>印度央行近四年来首次加息，随着通货膨胀加剧和货币贬值，印度央行也和亚洲其他央行一道收紧货币政策。印度央行货币政策委员会一致投票决定提高基准利率25个基点至5.5%，符合彭博调查所得大多数经济学家的预测。这是自Sanjay Malhotra于2024年12月出任行长以来首次加息。印度央行将货币政策立场从“中性”调整为“校准式收紧”，释放出未来可能进一步加息的信号。（新浪财经）</p>\n  <p><strong>7-11便利店退出印度</strong></p>\n  <p>据新华社报道，日本零售业巨头7&amp;I控股公司6日发布声明说，其旗下连锁便利店品牌7-11位于印度的所有门店均已关闭。法新社援引7&amp;I控股公司发言人消息报道，获得相关特许经营权后，信实零售公司2021年10月在孟买开设了印度的首家7-11便利店，发展最好的时候在印度共开店约60家。声明中，7&amp;I控股公司未说明7-11便利店退出印度的原因。但据《读卖新闻》等日本媒体报道，7-11便利店遭遇了来自印度本土零售商的激烈竞争。（新华社）</p>\n  <p><strong>2026年诺贝尔物理学奖揭晓</strong></p>\n  <p>当地时间10月6日，瑞典皇家科学院决定将2026年诺贝尔物理学奖授予弗朗西斯·哈尔岑，以表彰他对冰立方中微子天文台的决定性贡献以及对天体物理来源高能中微子的发现。（央视新闻）</p>\n  <p><strong>2026国庆档总票房破11亿</strong></p>\n  <p>36氪获悉，据灯塔专业版消息，2026年国庆档（10月1日—10月7日）档期总票房突破11亿，《神探之痕迹》《什么意思夫妇》《生化危机：爆发夜》《欢迎来龙餐馆》《小猪佩奇·完美假期》位列档期票房前五。</p>\n  <p><strong>派拉蒙天舞完成对华纳兄弟收购</strong></p>\n  <p>经过数月的竞购角逐以及法律拉锯战，派拉蒙天舞公司10月6日宣布完成对华纳兄弟探索公司价值约1100亿美元的收购，打造出一家横跨好莱坞和新闻行业的全新超级传媒集团。这是美国传媒行业历史上规模最大的并购交易之一。（新华社）</p>\n  <p><strong>中国央行连续第23个月增持黄金</strong></p>\n  <p>中国9月末黄金储备报7747万盎司（约2409.59吨），环比增加74万盎司（约23.02吨），8月末黄金储备报7673万盎司（约2386.57吨）。中国央行已连续第23个月增持黄金。（财联社）</p>\n  <p><strong>三星电机计划斥资近50亿美元在韩国和越南扩产半导体基板</strong></p>\n  <p>据报道，三星电机计划到2028年在韩国和越南投资近50亿美元，用于半导体基板生产，进一步提升越南在人工智能服务器和高性能计算关键零部件生产中的地位。其中一项投资规模为4.27万亿韩元（32亿美元），用于韩国世宗工厂，是公司迄今针对单一产品进行的最大规模投资；另一项投资规模为2.51万亿韩元（18.7亿美元），用于越南子公司。该公司曾于2022年宣布将在越南北部太原省测试FC-BGA基板。如今该设施的扩建表明试生产结果符合预期，公司已准备好进入大规模量产阶段。（财联社）</p>\n  <p><strong>国内航线燃油附加费将上涨</strong></p>\n  <p>10月6日消息，根据航班管家DAST，航司最新通知，自10月10日起，国内航线燃油附加费将上调：800公里以上航段收取90元，比8月、9月涨20元；800公里以下收取50元，比8月、9月涨10元。（第一财经）</p>\n  <p><strong>全球纯燃油车新车销量占比首次跌破50%，上半年纯汽油车占比降至49%</strong></p>\n  <p>据财联社报道，Mobility Global最新数据显示，2026年上半年，纯汽油车型占全球新车销量的49%，这是历史上纯汽油车销量占比首次跌破五成，且较2021年的73%大幅下降了24%。数据还显示，今年上半年，整体汽车市场规模收缩约5%，而纯汽油车销量的下滑幅度达到了大盘的两倍。业内人士将市场加速转变归因于油价。即受中东冲突影响，燃油价格大幅飙升，消费者开始寻求用车成本更低的车型。（财联社）</p>\n  <p><strong>SpaceX据悉拟融资400亿美元用于购买英伟达芯片</strong></p>\n  <p>媒体援引知情人士报道称，马斯克旗下的SpaceX正寻求融资400亿美元，用于购买英伟达芯片，凸显人工智能（AI）算力需求依然强劲。该报道称，SpaceX寻求约100亿美元银行贷款并计划发行300亿美元投资级债券，为芯片采购融资。阿波罗全球管理预计将牵头这笔交易，并协助向投资者出售SpaceX债券。交易预计于2027年完成。（新浪财经）</p>\n  <p><strong>俄罗斯辟谣肺鼠疫传言</strong></p>\n  <p>据环球时报援引法新社等媒体6日报道，在有报道称俄罗斯伊尔库茨克地区一名实验室技术人员疑似感染肺鼠疫身亡后，俄罗斯方面否认正在实施针对肺鼠疫的防疫措施，并就社交媒体上的传言做出澄清。据了解，近日俄罗斯当地媒体报道称，这名死者可能因试管破裂而感染了肺鼠疫，200名可能与她有过接触的人员已被隔离。伊尔库茨克州州长科布泽夫表示，俄罗斯消费者权益保护和公益监督局的检查发现，该女子死于肺炎，但具体病因“未确定”。（环球时报）</p>\n  <p><strong>恒生科技指数将把成分股扩充至50只</strong></p>\n  <p>恒生指数公司宣布恒生科技指数咨询结果，将对恒生科技指数进行六项改革，并将于12月实施。第一，取消合资格候选公司必须属于恒生行业分类系统五个指定行业的要求。第二，整合及拓展现有主题，并新增前沿科技主题。修订后的六大科技主题为：数码平台及解决方案；人工智能；先进硬件；机器人及自动化；云端；前沿科技。第三，将科技子主题由16个增至24个，以配合上述六大科技主题的修订。第四，引入分组选股机制，将选股范畴由主板上市公司修订至恒生综合大中型股指数成份股。第五，采用双组别选股机制，分别以市值排名及收入增长排名作为选股准则。非现有成份股另须符合过去三个月日均成交额最少一亿港元的要求；按收入增长排名入选的成份股，则须于最近连续两个财政年度均录得最少五亿港元的年收入。第六，将成份股数目由30只增加至50只，其中按市值排名选取首40只，余下10只则按过去十二���月的收入增长排名选取。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>快手可灵AI计划最早明年赴港上市，至少融资10亿美元</strong></p>\n  <p>据了解，快手旗下视频生成大模型可灵AI计划最早明年赴港上市，至少融资10亿美元。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>月之暗面据悉完成IPO前融资，最新估值约500亿美元</strong></p>\n  <p>据知情人士透露，月之暗面已经完成最后一轮私募融资，估值约500亿美元，并正推进明年第一季度在香港进行首次公开募股（IPO）。（新浪财经）</p>\n  <p><strong>多家阿联酋基金以及贝莱德据悉商谈参与OpenAI最新一轮300亿美元融资</strong></p>\n  <p>知情人士称，包括MGX在内的多家阿联酋投资基金正在与OpenAI洽谈，可能参与这家人工智能巨头最新一轮300亿美元融资。其中一位知情人士表示，这些基金将组成一个财团参与OpenAI这轮融资。另一位人士称，这些阿联酋基金讨论的合计投资金额最高达到100亿美元。知情人士表示，贝莱德也在商谈参与这轮融资。融资仍在进行中，具体条款可能发生变化。因涉及未公开信息，这些知情人士要求匿名。（智通财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果与LG联合开发门铃门锁等</strong></p>\n  <p>据报道，苹果公司即将进军智能家居设备领域，新品将包括与LG电子联合开发的门铃、温控器以及其他配件。这些产品将纳入一个设备生态系统，该系统不仅支持苹果的新款智能家居中枢，还可以搭配升级后的HomePod mini和全新的电视机顶盒使用。报道称，与LG电子联合开发的产品还包括智能门锁、室内安防摄像头、室外安防摄像头以及泛光灯摄像头，产品将使用LG品牌对外发售。（财联社）</p>\n  <p class=\"editor-note\"><strong>整理丨</strong>昌怡</p>", "category": "tech", "published_at": "2026-10-08T00:04:11+00:00", "fetched_at": "2026-10-08T04:12:10.220396+00:00", "fingerprint": "f5e9ff96110f1c5a"}, {"source": "36氪 - 最新文章", "title": "深创投、元禾原点押注一家水下机器人，9个月内已完成5轮融资丨36氪首发", "url": "https://36kr.com/p/4016617284014210?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_6bbddb851b8e4b2aac0302863ab4c161@6221844_oswg2657809oswg1683oswg935_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2900</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，海洋具身智能公司卫澜深海在9个月内已完成5轮融资，轮次推进至天使++++轮，核心股东包括深创投、元禾原点、国策资本等机构，老股东英诺天使持续加注。资金主要用于训练水下具身智能模型，建设水下具身智能训练中心，以及深化机器人在海洋油气能源场景下的应用。卫澜深海想做的事情，可以用一句话概括：用机器人拓展人类的海洋能力边界，代替昂贵且危险的水下人工作业。</p>\n  <p>创始人张大禹98年出生，西安交通大学博士、助理教授，拥有12年水下无人系统研发经验，高中起申请发明专利30余项，发表顶刊论文10余篇，主持2项国家级项目。卫澜深海已经组建了覆盖具身智能研发、工业部门国家队、水下能源行业市场的全链条顶尖团队。卫澜深海CTO是出身中国船舶集团的总设计师，主持型号装备等十余项国家级重大科研项目，总经费超过20亿元。</p>\n  <p>卫澜深海聚焦海洋具身智能机器人领域，专注海洋具身智能平台技术研发以及水下机器人产业应用。公司已经构建由真实业务驱动的具身智能数据训练管线，通过“通用平台+模块化载荷”的方式实现水下泛化作业能力。目前公司已经为海洋业主客户交付海底能源设施全自主巡检作业服务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_14042a2ef0e341f5aa8e6c4cac33ed9e@6221844_oswg73297oswg813oswg338_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>海洋当中藏有3倍于陆上的巨量资源，但人类不是水生生物。即使经过数百万年的进化，海平面以下仍然是人难以触及的高危环境；即使通过复杂的水下作业保障体系，潜水员也只能形成极为有限的作业能力——人在水下待不住，也待不起。卫澜深海研发的「超级蛙人号」海洋具身智能机器人就是要突破人类在水下能力边界，在海平面以下完成自主作业，去挖掘数百年来人类尚未触及的海底宝藏。</p>\n  <p>在海洋环境中，一个具身智能机器人的价值不仅仅是代替了一个劳动力，而是代替了整个水下作业保障体系。深度超过120米的饱和潜水作业需要一艘专业的饱和潜水支持船和数十名保障人员，报价超过100万元/天。人工水下作业保障体系的巨大成本是海洋具身智能的收益率。另外，在海洋环境中具身智能机器人硬件条件更容易超越人。即使对标���英潜水员，机器人的下潜深度是潜水员的5倍以上，机器人的作业范围是潜水员的千倍以上，可达到200公里。因此，水下作业极有可能是具身智能首个大规模代替人类的场景。</p>\n  <p>海洋环境与陆地环境有巨大差别，研发在海洋可随时调用的具身智能机器人需解决三方面问题。第1个是水下感知问题。因为水和空气是不同的介质，可见光在水下的衰减频率远高于陆地上，简言之，水下难以看清10米之外的物体。第2个是可靠性问题。水下作业场景对任务成功率和可靠性指标要求严苛，水下的作业对象是昂贵的海底基建，如果机器人不能有效应对corner case，将面临停产等重大损失。第3个是能源问题。水下作业区域距离岸上电网极远，且需覆盖的水下作业区域跨度极大。</p>\n  <p>为了解决以上三大问题，卫澜深海研发了「超级蛙人号」海洋具身智能机器人，其中“水下机器人通用平台”负责远程投送和水下灵巧作业，“海底星链基座”作为水下能源通讯载体。“水下机器人通用平台”的声光磁跨尺度感知融合方案把声学、光学和磁场信息融合，使机器人获得超人类的水下感知能力，机器人可以像海豚一样直接处理声呐信息。“海底星链基座”突破了深海超低流速启动问题和叶轮偏航问题，可在全海域全海底地形实现快速部署，为水下机器人平台提供能源和通讯支持。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_22b1a5c9b46743e7be7566e96263670e@6221844_oswg165627oswg1080oswg697_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>硬氪了解到，“水下机器人通用平台”的水下定位精度误差不超过1米、准确率达95%以上，双6自由度机械臂负载10公斤以上，续航48小时，最大航速12节，具备3节全向抗流能力，可以在恶劣的海况下完成精细水下作业。“海底星链基座”的能量捕获面积可达10平方米，是机器人投影面积的数十倍，可以达到动力电池级别的水下供电能力。作为对比，波音公司发布的“Lamprey”水下智能机器人的捕能面积仅能达到机器人投影面积的50%，难以提供千瓦级的水下供电能力。对比诺斯罗普·格鲁曼公司的温差能方案以及Pliant Energy Systems的介电体捕能方案，卫澜深海在水下供电能力和系统可靠性方面处于国际领先地位。</p>\n  <p>经过十余年的技术积累，卫澜深海目前已经交付了第四代“超级蛙人号”海洋具身智能机器人，为海洋业主客户完成了海底能源设施全自主巡检作业项目。</p>\n  <p>“目前用机器人代替水下作业是行业共识，但技术路线还没有收敛。”张大禹说。卫澜深海强调“错位合作”——卫澜深海第一步先在海洋业主客户的存量海底基建中打通垂向应用场景，再随海洋产业的增量市场做泛化水下作业。</p>\n  <p>在完全实现水下作业无人化方面，他给了一条类似L2到L3自动驾驶的路线：先基于仿真器数据训练一个基础作业模型，将搭载了预训练模型的机器人嵌入现有水下基建维保流程中，让机器人处于人可实时干预修正的条件下完成自主作业，在部署阶段不断收集作业数据和人类的反馈数据，这些数据用于不断训练作业模型，逐渐从人在环路过渡到全自主无人干预的水下作业。</p>\n  <p><strong>以下为硬氪与公司创始人张大禹的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：卫澜深海的商业化路径是怎样的？&nbsp;</strong></p>\n  <p><strong>张大禹：</strong>水下作业市场，客户最关心的是你能不能把水下作业需求干完、干好，而不是你的模型参数和泛化能力。因此，我们商业模式分三步：做示范性项目、卖标准化服务能力、卖机器人。</p>\n  <p>我们第一步不是卖整机，而是用标准化服务能力绑定大客户。先完成2到3个强示范性服务案例，验证新模式的效率以及成本优势，进而推动大量的标准化服务，整合行业水下作业标准，搭建水下无人作业体系，最后，退回到整机供应商，以“通用平台+模块化载荷”的方式在确保产品可靠性的同时，实现水下泛化作业能力。</p>\n  <p><strong>硬氪：水下感知是困扰行业几十年的难题，卫澜深海的解法是什么？</strong></p>\n  <p><strong>张大禹：</strong>水下感知最大的问题是数据缺失。岸上可以用互联网级别的数据训练VLA模型，水下几乎没有声光磁同步数据。所以我们开发了水下具身智能仿真器，具备声场、视觉和磁场的感知训练能力，可以在模拟不同水域的水下作业场景并生成大量数据，目标是把声学、视觉和磁场信息融合，让机器人像海豚一样直接处理声呐信息，而不是先看到一个声呐图像再去二次判别。这需要大量的数据和基模相关的工作，也是我们目前投入最多的方向。</p>\n  <p><strong>硬氪：公司目前阶段最大的挑战是什么？</strong></p>\n  <p><strong>张大禹：</strong>我们有两个核心问题需要解决。第一是水下数据问题，我们开发了水下具身智能仿真器并跑通了由真实业务驱动的数据管线。第二是极致的机器人可靠性。如果只做移动观测平台，可靠性可以满足；但要做物理交互，比如用机械手拧阀门，需要更强的可靠性以及对corner case的处置能力。水下环境中一旦机器人卡死，将造成严重的安全事故。我们今年要完成长时间无故障运行，这是最关键的挑战。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>深创投：</strong>海平面以下是全球最大的高危环境，也是迫切需要具身智能代替人类的场景。在这个领域需要强大的正向研发能力，才能克服海洋中的难题，进而开发人类未曾开发的宝藏。我很高兴看到卫澜深海团队在海洋具身智能领域的积累和进步，期待他们在建设海洋强国的路途上闯出一片天地。</p>\n  <p><strong>元禾原点：</strong>3.6亿平方公里的海洋孕育着无限机遇，在人难以触及的环境中去拓展人类能力边界，可以彻底开发巨量海洋资源。我很看好卫澜深海团队在水下能源供应和自主作业方面的技术积累，期待他们的水下作业解决方案可以改变行业，拉近人类和海洋的距离，在向海图强的国家战略中贡献自己的力量。</p>", "category": "tech", "published_at": "2026-10-08T02:35:03+00:00", "fetched_at": "2026-10-08T04:12:10.220385+00:00", "fingerprint": "847ea099c552de7e"}, {"source": "36氪 - 最新文章", "title": "硬氪首发丨AI眼镜企业天使轮融资数亿，已与线下数百家门店合作月发售数千台", "url": "https://36kr.com/p/4016645063217281?f=rss", "summary": "<p>硬氪获悉，智能眼镜品牌NIMO所属公司比特幻境近日完成数亿元人民币天使轮融资，最新估值达15亿元。本轮投资方包括博华资本、戈壁创投、元禾璞华，以及尚势资本等相关投资机构。融资资金将主要用于产品研发、渠道拓展及海外市场布局。</p>\n  <p>比特幻境成立于2025年7月，2026f年4月，NIMO将收首款产品推向市场。目前，NIMO月度销售规模已达数千台，正持续推进产品在LOHO线下门店的布局,并已与香港上市公司、拥有逾50年行业积累的国际眼镜制造商雅视光学(01120.HK)达成深度合作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_160356abc10c42ae89b193938461f236@6310669_oswg78086oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NIMO首款产品</p>\n  <p>如果把过去几年的智能眼镜看作一场功能竞赛，NIMO试图走的是另一条路——先把智能眼镜重新做成一副“愿意戴”的眼镜。这源于创始团队的观察：在资本持续关注智能眼镜的同时，现实生活中普通人仍然很难频繁看到身边有人佩戴智能眼镜。</p>\n  <p>联合创始人何迪龙判断，这个品类真正要跨过的门槛，并不只是显示、AI或芯片能力，而是能否让智能功能自然进入眼镜原本的形态、佩戴和消费逻辑。</p>\n  <p>在这一理念上，NIMO的定位为时尚科技眼镜品牌，团队给产品设定的前提并不是“在眼镜上增加多少智能功能”，而是首先让它成为一副具备日常佩戴属性的眼镜——外形、比例、材质、触感和佩戴舒适度，都需要回到传统眼镜的评价体系中。</p>\n  <p>这一判断也直接影响了NIMO对产品功能的取舍。相比把摄像头、音频、更多主控芯片等能力尽可能塞进镜框，NIMO在首款产品中主动砍掉了部分功能，把有限的重量和空间留给显示、结构和佩戴体验。</p>\n  <p>何迪龙提到，NIMO在调研了大量用户需求后发现，眼镜的佩戴舒适是用户选择购买智能眼镜的第一需求，拍照和扬声器极大的增加了产品体积，让用户产生了佩戴不适感，对极致的重量追求最终导致NIMO做出了功能取舍，“同时我们也在定制全新的摄像头和扬声器方案在未来给到用户更多的场景选择。”</p>\n  <p>这种“先做一副好眼镜”的产品定义，最终落到了光学、结构和材料等一系列技术选择上。</p>\n  <p>显示系统的起点，是一枚尺寸仅0.06英寸的MicroLED微显示芯片。据了解，该芯片属于全球最小尺寸的量产硅基微显示产品，功耗较同类芯片降低70%。微型化的显示核心，为光机与整机设计释放出更多空间；更低的显示能耗，则为产品在保持轻量化的同时实现更长续航提供支持。</p>\n  <p>围绕这枚微显示芯片，NIMO将自研超微型光机的体积压缩至0.03cc，即30立方毫米，并将投射影像的光学核心集成于镜腿前端的铰链区域，让复杂的显示能力隐入眼镜原本的轮廓。</p>\n  <p>与之配合的，是厚度0.6mm的体全息波导镜片。通过近乎隐形的光栅设计与精细的漏光控制，镜片在呈现信息的同时，保持通透自然的外观，减少显示时向外透出的绿光。</p>\n  <p>轻量化则是另一条贯穿产品设计的技术路径。NIMO目前产品重量约29克，何迪龙称，这是行业内首次实现显示类AI眼镜做到30g以内，镜框采用高分子复合碳纤维材质，结构中使用β钛合金铰链，并通过前端光机、镜腿尾部电池以及两侧元件的布局进行配重。</p>\n  <p>对智能眼镜而言，重量本身只是一个结果，更关键的是重量落在哪里、镜腿是否产生压迫，以及长时间佩戴后的实际感受。因此，NIMO并没有把“29克”单独作为产品卖点，而是把材料、结构、铰链和前后配重放在同一个系统里考虑。采访中团队也提到，传统眼镜的制造工艺，如抛光，电镀等后工艺同样被纳入产品开发，这背后的逻辑是让智能眼镜在电子产品之外，也具备传统眼镜对触感、表面和结构细节的要求。</p>\n  <p>在供应链上，NIMO采取的并不是简单采购标准件的方式，而是试图把上游供应链拉进共同研发。何迪龙表示，部分关键器件并没有现成的成熟方案，而是由NIMO提出产品需求和技术方案，再与供应商共同完成开发。例如0.03cc微型光机，就是围绕镜腿空间重新定义后的结果。</p>\n  <p>商业化层面，NIMO也选择了一条更接近传统眼镜行业的路径。谈及线下合作，何迪龙告诉硬氪，对于NIMO而言，线下门店并不只是增加一个销售入口，而是因为智能眼镜依然需要面对传统眼镜行业的验配、试戴、镜片更换、售后和用户教育等问题——如果产品的第一属性仍然是“眼镜”，那么它就需要进入用户原本购买眼镜的场景。</p>\n  <p>从更长期来看，NIMO希望智能逐渐成为眼镜自然拥有的一种能力，让用户仍然基于审美、佩戴需求和生活方式选择眼镜，同时获得显示和智能功能。“最终我们希望NIMO做的并不只是一个单一的智能眼镜产品，而是把眼镜本身、智能能力和未来的应用生态结合起来，让智能眼镜真正成为一个用户愿意长期佩戴的产品。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_12a499929bf74c099e2dfa78de43a1e0@6310669_oswg82228oswg900oswg900_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NIMO首款产品</p>\n  <p><strong>以下是硬氪与NIMO联合创始人何迪龙的访谈节选：</strong></p>\n  <p><strong>硬氪：NIMO为什么要从“眼镜”本身出发做智能眼镜？你们对产品的核心判断是什么？</strong></p>\n  <p><strong>何迪龙：</strong>我认为智能眼镜首先还是一副眼镜。它不能只是把很多功能堆在眼镜上，而是要先解决眼镜本身的问题，包括好不好看、戴得舒不舒服，以及是不是适合亚洲人的脸型。</p>\n  <p>所以我们从一开始就比较强调“眼镜感”，希望用户戴上之后首先觉得它是一副正常、好看的眼镜，而不是一个电子设备。在这个基础上，我们再把智能能力放进去。</p>\n  <p>我们也会主动砍掉一些我们认为没有必要的功能，因为如果所有东西都往上加，最后可能会变成一个功能很多、但用户并不愿意长期佩戴的产品。对我们来说，智能眼镜真正能够普及的前提，还是用户愿意每天戴它。</p>\n  <p><strong>硬氪：在产品设计上，NIMO具体是怎么解决“智能”和“眼镜”之间的矛盾的？</strong></p>\n  <p><strong>何迪龙：</strong>我们其实花了很多精力在重量、材料、结构和佩戴体验上。</p>\n  <p>比如镜腿采用的是β钛材料，鼻托也做了适配亚洲人脸型的设计，同时使用碳纤维等材料去做轻量化。产品本身大概是29克，如果再加上定制镜片，根据度数和折射率不同，最终重量可能会到34到36克左右。</p>\n  <p>我们还保留了很多传统眼镜制造的工艺。比如镜腿抛光本身就需要几天时间，木纹颗粒的抛光甚至需要连续做两天两夜。我们希望它在拿掉电子属性之后，依然是一副做工比较完整的眼镜。</p>\n  <p>电池也是一个比较大的挑战。我们用了钢壳电池，目前实际使用中没有观察到明显发热的问题，充电15分钟可以到80%左右。显示部分则尽量做到隐形，透光率可以达到98%，让用户在正常状态下不会明显感觉到它是一块显示设备。</p>\n  <p><strong>硬氪：目前用户真正会怎么使用NIMO？你们为什么没有把功能做得特别复杂？</strong></p>\n  <p><strong>何迪龙：</strong>目前我们比较关注的其实是一些和用户日常生活直接相关的功能，比如股票、新闻、消息、地图、提词、翻译，以及自动亮度等。</p>\n  <p>我们希望这些功能能够自然地融入佩戴场景，而不是为了展示技术而增加功能。比如提词、翻译这些功能，本质上都是让信息直接出现在用户眼前，减少用户频繁拿手机的动作。</p>\n  <p>未来我们也会考虑开放SDK和开发者生态。我们认为，智能眼镜最终不一定只是我们自己去定义所有应用场景，开发者可以基于眼镜本身的能力去开发更多东西。我们现在更希望先把硬件、显示和基础能力做好，再逐步把生态打开。</p>\n  <p><strong>硬氪：从市场反馈来看，智能眼镜距离真正进入大众市场还有多远？NIMO目前在怎么推进这件事？</strong></p>\n  <p><strong>何迪龙：</strong>我们今年4月份开始正式出货，最开始大概有1000台左右的预订，之后每个月也有几千台的量级。现在我们的渠道主要包括抖音、京东，以及线下门店，目前大概有150家左右。我们比较重视线下，是因为智能眼镜和普通消费电子不太一样，用户很多时候需要真正戴上去、体验之后，才能理解它到底有什么价值。</p>\n  <p>但线下也会遇到一些问题，比如不同门店员工对产品的理解程度不一样，消费者对智能眼镜本身的认知也还在建立。所以我们会做线下培训，希望工作人员可以在比较短的时间内把产品的主要功能完整演示出来，让用户快速理解。</p>\n  <p>从这个角度来说，我们觉得智能眼镜的普及不仅是硬件问题，也需要用户教育和渠道一起成熟。</p>", "category": "tech", "published_at": "2026-10-08T03:03:19+00:00", "fetched_at": "2026-10-08T04:12:10.220372+00:00", "fingerprint": "0dcb44213ac56baa"}, {"source": "少数派", "title": "罗马：永恒之城，永恒于世", "url": "https://sspai.com/post/114845", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/114845\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-07T03:00:00+00:00", "fetched_at": "2026-10-08T04:12:07.633248+00:00", "fingerprint": "a549d3d1907def68"}, {"source": "少数派", "title": "派早报：微软发布 Windows 相关新品、Google AI 新闻两则等", "url": "https://sspai.com/post/115455", "summary": "Anthropic 推出 Claude for Google Workspace、Reflection 发布首个开放权重模型 Beam 等。<a href=\"https://sspai.com/post/115455\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-08T00:16:57+00:00", "fetched_at": "2026-10-08T04:12:07.633232+00:00", "fingerprint": "58419a124d9129f3"}, {"source": "少数派", "title": "App Store 生态规模五年翻倍，助力中国开发者走向全球", "url": "https://sspai.com/post/115462", "summary": "10月8日，Apple发布《中国AppStore生态系统——2025年开发者与用户价值研究》。这份由Apple提供支持、上海财经大学商学院副教授 ions", "summary": "People in Utah can now use AI to get a prescription for acne treatment. On Monday, healthcare startup Nolla Health announced that users in the state can scan their faces using its app, allowing its AI system to analyze acne severity and autonomously write a prescription, as reported earlier by Bloomberg. The service is launching [&#8230;]", "category": "tech", "published_at": "2026-10-05T20:14:57+00:00", "fetched_at": "2026-10-06T04:33:14.870094+00:00", "fingerprint": "17d9e21ea2c6b68b"}, {"source": "The Verge", "title": "The Matic is the first robovac to get an FCC ban waiver, not that it needs it", "url": "https://www.theverge.com/policy/1004926/matic-fcc-ban-waiver-conditional-approval", "summary": "The Matic is our favorite robot vacuum and robo-mop, and it's also now the first to escape the FCC's Roomba ban. Well, sort of - because the Matic wasn't banned to begin with. Here's what's actually happening: On October 2nd, the FCC added the original Matic, model 4MA0001, and its charging dock model 4DK0008 to [&#8230;]", "category": "tech", "published_at": "2026-10-05T21:15:05+00:00", "fetched_at": "2026-10-06T04:33:14.870090+00:00", "fingerprint": "6fa389f44bab47d4"}, {"source": "The Verge", "title": "Reverse-engineered games: All the news on video game decomps, recomps, VR and web and 3D ports", "url": "https://www.theverge.com/games/1004869/reverse-engineered-games-all-the-news-on-video-game-decomps-recomps-vr-and-web-and-3d-ports", "summary": "It&#8217;s a wild time for retro gaming. Thanks to decompilations and recompilations of classic titles, those games are becoming unshackled from their proprietary code and original hardware to be ported to new devices or updated in ways to completely change the original game. Ever imagined skateboarding in Call of Duty? Or playing the original Halo right [&#8230;]", "category": "tech", "published_at": "2026-10-05T21:17:45+00:00", "fetched_at": "2026-10-06T04:33:14.870084+00:00", "fingerprint": "487fcb973a6d595c"}, {"source": "The Verge", "title": "Gemini Call for Me might tell your mom you&#8217;re running late", "url": "https://www.theverge.com/ai-artificial-intelligence/1005177/google-gemini-call-for-me-expansion-rumors", "summary": "Google may be expanding its \"Call for Me\" AI feature beyond business calls so you can use it to send messages to friends and family. Android Authority reports finding a \"Gemini Calling\" introductory screen in an APK teardown with examples that include \"Call Mom and tell her I will be 15 minutes late\" and \"Call [&#8230;]", "category": "tech", "published_at": "2026-10-05T23:09:55+00:00", "fetched_at": "2026-10-06T04:33:14.870073+00:00", "fingerprint": "19745539452346e8"}, {"source": "36氪 - 最新文章", "title": "Rabbit 创始人吕骋：人不该为 Agent 改变思考方式", "url": "https://36kr.com/p/4012726523957380?f=rss", "summary": "<p>文｜李炤锋</p>\n  <p>编辑｜张雨忻</p>\n  <p>“人说要有光，于是就有了光。”谈起个人 Agent 的终极愿景，Rabbit 创始人吕骋把那句古老谚语中的“神”换成了“人”：在他的设想中，人只需说出想办成的事，Agent 就会自己寻找办法。</p>\n  <p>说起 Rabbit，很多人首先想到那台橙色手持设备 r1——一台运行 Rabbit 自研系统的掌上 AI 设备。Rabbit 当初希望，用户只需说出任务，它就能代人操作应用、完成任务。R1 在亮相后迅速受到关注，但上市后的实际使用体验，却收到了一些批评的声音。吕骋后来承认，用户的高期待与最初的软件体验之间存在落差。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261005/v2_28dc2b755e404fdbaf8223e43fec9c7f@6252890_oswg577884oswg1200oswg675_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Rabbit R1</p>\n  <p>上个月，Rabbit 开放了新一代 Agent 操作系统 OS3：用户从网页或 Telegram 交代任务，系统调用用户自选的 AI 模型，让电脑查文件、操作软件、浏览网页或写代码。</p>\n  <p>“你不要去赌用户最后只有一台设备，这是不现实的。”谈及为什么要做跨设备功能，吕骋数起自己平时使用的电脑：一台私人 PC、一台工作用的 Mac，还有一台能进入公司内网的办公室电脑。在他看来，用户常在多台设备间切换，而好用的 Agent 应该让人只交代一次任务，再自行找到对应的设备和解决办法。</p>\n  <p>2024 年 CES（国际消费电子展）上，Rabbit 带着 r1 亮相。但这款产品的实际体验迅速引发争议，科技媒体《Wired》给早期产品打出 3 分（满分 10 分）。几周前，吕骋在接受《Wired》采访时表示，r1 已在全球交付超过 10 万台，退货率低于 5%。面对当年的批评，他说：“从工程角度看，我们没有押错方向。”</p>\n  <p>在和智能涌现的交流中，吕骋进一步解释了 r1 面临的落差：“我们在发布会上说能做四件事，然后用户会尝试去做六件事。”早期 Agent 产品难以接住用户不断扩大的期待，但在吕骋看来，这种行业早期进入的“前卫”，正是Rabbit公司的底层基因，r1 至少让 Rabbit 参与了 AI 硬件早期形态的讨论，此后谈起这一品类，人们仍会提到那台橙色设备。从 r1 到 OS3，Rabbit 想争取的，始终是 Agent 产品的定义权。</p>\n  <p>最近一年，Agent 正从写代码、处理工作，逐渐走向个人的日常事务。今年 9 月以来，这一方向的竞争明显升温。</p>\n  <p>OS3 发布前后，Meta 推出个人 Agent 产品 Muse。据 Sensor Tower 估算，Muse 上线两周下载约 280 万次。9 月初宣布恢复独立运营的 Manus，随后推出个人 Agent 产品 Cue。国内，阿里的千问接通淘宝购物，字节的豆包上线对话打车。几家公司路径不同，都在尝试让 AI 进入日常事务。</p>\n  <p>谈及个人 Agent 产品接连出现，吕骋说，模型更会写代码，让 Agent 更容易造出来；但普通人会不会长期使用，仍是一个未知数。让人用得懂、用得久，才是下一道难题。</p>\n  <p>这也解释了OS3的简约操作逻辑。在交互上，和很多Agent的工作台模式不同，OS3 只有一个持续的对话窗口。用户想到工作或生活里的需求，可以直接说出来，不用先新建项目，不需要按工作或生活来分类整理自己的任务需求。而在执行层面，OS3 可以连接最多五台用户已有的电脑，使用各台机器上的文件和软件，并决定任务在哪台机器上完成。</p>\n  <p>吕骋认为，个人 Agent 要走进普通人的生活，首先得把使用门槛降下来。“人类的思考方式，它不是一个文件化的思考方式。”这是 Rabbit 设计 OS3 时的一个判断：用户不必先把工作和私事分门别类，想到什么，就在同一个对话窗口里交代。</p>\n  <p><strong>01｜普通人，需要怎样的个人 Agent</strong></p>\n  <p>Meta 的 Muse 推出后，吕骋也试用了这款产品。他让 Muse 买一箱可乐，Muse 得在远程电脑上登录购物网站，但因为忘了密码，又要打开密码管理器查找。这个过程让他怀疑：个人 Agent 的需求是否已经得到验证？</p>\n  <p>“让Agent去亚马逊给你买一箱可乐，和用户直接在电脑上点两下买一箱可乐，哪个更方便呢？” 谈到这波产品热潮，吕骋说：“我不认为这个需求已经验证了。”</p>\n  <p>他用“老板和总助”的关系解释 Rabbit 的愿景：“我有个事儿要解决，你帮我去解决。”现实中，老板不会事先规定助理去哪家门店、用什么方式付款；他要的是结果。吕骋希望用户也能这样使用个人 Agent：交互逻辑简单，拥有本地系统权限，还能跨多台设备操作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261005/v2_19d9423bd82c452d84fb9e33a14865a7@6252890_oswg301077oswg1280oswg851_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">OS3操作页面</p>\n  <p>打开 OS3，主要看到的是持续的对话和输入框，没有按工作、生活分开的任务入口。这种设计足够简洁，也可能让新用户无从下手。吕骋认为，事先替人划好分类，反而会逼人按软件的方式整理自己的念头。</p>\n  <p>吕骋说，人的思考是流动的：聊着一件工作，可能突然想起昨天没办完的私事。他把这种状态叫作“brain dump”，即把脑子里冒出的事一股脑说出来。他说，OS3 要靠记忆和任务调度接住这些跳跃的想法，再决定调用什么工具、让哪台电脑执行。输入框越简单，背后的系统要承担的判断就越复杂。</p>\n  <p>一旦 Agent 开始动手干活，光理解指令还不够，它还得进入能执行任务的环境。吕骋说，Rabbit 的早期方案，曾尝试过类似Muse的方案，却发现异地登录容易触发网站验证，甚至被拦截。因此，到了OS3 ，尽管仍然需要云端模型接入，但OS3可以把执行程序装在选定的电脑上，使用那台机器已有的文件、软件和工作环境。吕骋也把本地执行视为一道隐私边界：“只要文件在本地，就不用上传，直接执行在本地的电脑。”</p>\n  <p>使用成本也是一道门槛。有用户反馈，使用同一模型时，OS3 的 Token 消耗可能高于 OpenClaw，这引起吕骋的警惕，“我们一定会做一轮深度的优化，把这个 token 的使用消耗降下来。”</p>\n  <p>Token 消耗只是一方面。吕骋提到，年初把 OpenClaw 接入 r1 后，收到最多的求助是“OpenClaw 怎么装”。他起初觉得，照着官网步骤操作就行；后来发现，许多普通用户从未打开过电脑终端，更不熟悉 GitHub 和技能配置。换言之，要让个人 Agent 面向普通用户，一定要尽可能简单，门槛低。</p>\n  <p>Rabbit 把 OS3 的初始设置放进网页端，用户按提示回答问题，再填入自己申请的模型 API 密钥即可开始使用；如果要让 Agent 操作自己的电脑，仍须安装本机程序并授予权限。他形容网页设置是“肉眼可见的改进”，但距离普通人拿来就用还有一段路。“我现在在产品上抓的最紧的一件事，就是如何降低用户门槛。”</p>\n  <p>谈到 OS3 为什么采用 Bring Your Own Key的模式（用户自带模型密钥），吕骋说：“我不认为任何一家大厂都能在自己的封闭体系里，笃定自家模型会胜出。模型竞争中，没有哪一家拥有绝对优势，也很难在短期内决出胜负。”在他看来，这也是 Rabbit 相比大厂的一点优势：任何一家模型能力的提升，都能成为 Rabbit 的 Agent 产品的助力。</p>\n  <p>吕骋希望 Rabbit 做出一件有人愿意长期拥护的产品。他说，大公司擅长“把小众且好用的产品迅速杀死”，却“很难杀死一个有信仰的产品”。他举 Linux（一种开源操作系统）为例：使用 Linux 的人或许不多，但习惯用它的人很难被说服换用别的系统。</p>\n  <p>但被问及 Rabbit 是否愿意成为“Agent 时代的 Linux”时，吕骋说：“只成为 Linux 是不够的。”在他看来，技术底座搭好后，还要在复杂系统之上，给普通人提供一个“即插即用的方案”。</p>\n  <p><strong>02｜Rabbit 想争 Agent 的定义权</strong></p>\n  <p>“OS3 是我们一开始为 Cyberdeck 做的操作系统。”吕骋说。Cyberdeck 是 Rabbit 继 r1 之后开发的第二台硬件产品：一台尚未上市的小型电脑，计划配备屏幕和机械键盘，供用户使用 Agent 和编程工具。</p>\n  <p>今年 1 月，Rabbit 首次公开 Cyberdeck 项目。吕骋当时在社交媒体上公布了产品构想：小尺寸机身、可更换的机械键盘，以及供用户自由选择模型和 Agent 的环境。他曾向媒体透露，Cyberdeck 的目标价格是 500 美元。</p>\n  <p>在这次对话里，吕骋给了它一个更日常的定义：随身携带的任务入口。“这个便携的东西它就充当了你的输入框，无论你是语音还是打字。”人可以从这里交代事情，再由 OS3 调用家里或办公室已连接的电脑。</p>\n  <p>Cyberdeck 还在开发中，Rabbit 选择先把 OS3 开放给普通电脑用户。吕骋解释说，他希望在新设备完成前，团队先从真实使用中发现问题，继续调整软件与硬件的配合。</p>\n  <p>此前，《Wired》把 OS3 称为 Rabbit 的一次转向。吕骋在这次采访中澄清：“并不是说我们从硬件转型到软件了。”他说，很多媒体把 Rabbit 误解成一家硬件公司，但实际上，“硬件只是一件对我们来说是一个不得不做的事情”。</p>\n  <p>在他看来，关键在于 Agent 能进入多大范围的系统环境。“如果你只做一个 App 的话，你的边界就是 App 能给你的边界。”自己做设备，可以从系统层设计 Agent 的运行环境。</p>\n  <p>不过，既然 OS3 已能连接普通电脑，用户为什么还需要 Cyberdeck？吕骋认为，随身携带的统一入口可以调用多台设备，也能让任务留在用户已有的工作环境里。</p>\n  <p>这种设计与 Agent 执行任务时遇到的限制有关。吕骋用亚马逊购物举例说明执行环境的麻烦：他平时从洛杉矶登录，云端 Agent 却可能从明尼苏达的一台虚拟电脑进入同一账号。网站看到陌生地点的登录，可能要求额外验证，甚至拦下操作。因此，他认为 Agent 能否使用用户已有设备上的登录状态和工作环境是重要的。</p>\n  <p>吕骋不否认 Agent 赛道竞争的紧迫。回忆 r1 发布时，他提到团队当时只有七个人，想赶在竞争对手之前交付：“我们 r1 从画草稿到发布那天，一共用了九十一天。”如今 AI 产品迭代更快。他认为，创业公司如果一两个月拿不出新产品或新变化，就可能被淘汰。</p>\n  <p>“所有人都觉得我们不行了，我们就是死不掉。”吕骋把 Rabbit 的韧性归于团队对 Agent 技术路线的判断。“不光我们没有死，我们始终代表着最新 Agent 领域的技术创新和探索，同时也交出了和大公司相比肩的领先 Agent 产品。”</p>\n  <p>10年前，26岁的吕骋把自己创办的渡鸦科技卖给了百度。如今 <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
