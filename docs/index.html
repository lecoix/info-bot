 June 10th, the German container ship Posen docked in Los Angeles after a two-week voyage from Shanghai. As Valve watcher Brad Lynch notes, it was almost certainly carrying the first mass production shipments of the Steam Frame, Valve's new gaming headset. Import records show that Valve's distribution partner Ceva offloaded nearly 32 metric tons [&#8230;]", "category": "tech", "published_at": "2026-06-13T01:32:18+00:00", "fetched_at": "2026-06-13T02:56:54.761279+00:00", "fingerprint": "377df49961d2edfe"}, {"source": "36氪 - 最新文章", "title": "神秘失窃案背后，比亚迪如何“驯服”泰国工厂？｜深氪lite", "url": "https://36kr.com/p/3846882883963139?f=rss", "summary": "<p>比亚迪泰国罗勇工厂，曾接连陷入神秘“失窃案”。然而盘点下来，钢材螺栓数目齐全，劳保用品甚至都没有异常消耗。</p>\n  <p>实际上，被盗的并非值钱物件，而是车间水房里，桶装水塑料标签上的“BYD”Logo（品牌符号）。</p>\n  <p>那些本应随意摆放的桶装水，总会被转成同一个角度。桶身上原本完整的BYD字样齐齐消失，只留下一道被小刀精心裁剪过的轮廓痕迹。</p>\n  <p>李有才是首批加入比亚迪罗勇项目的员工之一，他告诉36氪，直到一次受邀参加当地泰籍员工间的聚会，他才找到这些被“偷走”的BYD Logo。</p>\n  <p>“<strong>有一个当地人穿了一件T恤，那不是我们的工服，但胸前却有一个BYD的Logo，我凑近了看才发现，那就是桶装水上的Logo塑料片，他们用胶水小心地粘在衣服上</strong>”，在李有才的询问下，当地人纷纷向他展示自己的贴有BYD Logo的“周边”，有帽子、鞋子，甚至是菲亚特汽车上。</p>\n  <p>中国工业品牌第一次在海外变成了\"想要贴在身上的符号\"。</p>\n  <p>“他们就想让别人知道自己在比亚迪工作”，李有才告诉36氪，“比亚迪在罗勇，就像90年代在中国的外企，所有人都认可比亚迪产品好、技术稳、环境好、待遇好、成长空间大”。</p>\n  <p>比亚迪免费发放的蓝色工服，也成了泰国罗勇当地的“硬通货”。总有员工跑来登记说工服丢了，要求补领。</p>\n  <p>李有才告诉36氪，比亚迪工服在罗勇，如今就跟三星海力��的工服在韩国一样，特别有面子，“他们根本没有丢工服，而是很多亲戚朋友想要这件BYD的衣服，都拿出去送人了”。</p>\n  <p>这家在中国被称为“带头卷价格”的品牌，在泰国罗勇却成了当地劳工心里的“保时捷”。而这距离比亚迪在泰国罗勇建设这座工厂，才过去短短2年时间。</p>\n  <p>中国车企和核心产业链，在过去数年时间，都开始轮番向海外市场发起冲击。</p>\n  <p>过去三年，中国车企新规划与投产的海外乘用车基地超15座，而比亚迪显然是最为激进的行动者之一，其海外市场销量已经从2024年的40万辆增长到2025年105万辆，今年更是制定了高达160万辆的目标。</p>\n  <p>但除了出口，对于欧洲、东南亚等大型的区域市场来说，本地制造甚至建立起当地产业链，才是更为持久和安全的出海战略。泰国工厂，正是诞生于这样的背景之下。</p>\n  <p>凭借地理位置与贸易政策便利，泰国早已成为日系品牌全球最大的右舵车生产基地，每年为其生产130万辆车。比亚迪也曾在多个场合强调，其在泰国建厂的愿景并非仅限于本土市场，而是希望以泰国为据点，辐射东盟乃至全球右舵市场。</p>\n  <p>而东南亚地区的人员文化融合和用工问题，几乎是大量出海企业都面临过的困扰。就连苹果与富士康的印度工厂，也曾因为中方工程师回撤而一度面临停工。</p>\n  <p>比亚迪在短短两年时长内，让一个海外工厂正常运转，工厂内部的多种文化生态顺利融合，甚至让生产效率与国内工厂同频。这相当于中国车企在这场出海远途中，探出了一条路。</p>\n  <p>据36氪了解，比亚迪在泰建厂的头一年，其员工流失率便低于泰国工会12%的平均值。而如今，长城、长安等中方企业更是以50%的薪资涨幅，在大力挖角比亚迪培养的泰籍工程师。</p>\n  <p>回到2023年，面对罗勇工地的尘土，和当地中企员工动辄50%的流失率传说，李有才怎么也无法想象，比亚迪究竟要怎样做，才能在泰国这片土地上真正俘获人心。</p>\n  <h3><strong>进驻罗勇府：准备功夫做足两年</strong></h3>\n  <p>比亚迪罗勇项目团队成立于2022年，李有才告诉36氪，尽管比亚迪此前已在泰国涉足商用车的零售与合作，但面对“去泰国建厂”这件事，当时项目组所有人的心里都没底。</p>\n  <p>“厂房和设备，我们中国人直接过去建就行，这个倒不担心。当时心里第一个大挑战，是怎么招到泰籍工程师，以及让他们学会比亚迪那一套章程”。</p>\n  <p>根据国际劳工组织的数据，东南亚地区的劳资纠纷发生率显著高于全球平均水平，连苹果与富士康的工厂，都高度依赖中国工程师运转。</p>\n  <p>比亚迪并没有急着把人派往泰国，而是先让团队沉下心来，在国内做了整整一年的案头功夫。</p>\n  <p>“集团准备了很多资料，泰国的政策、人文、经商环境、工厂环境，<strong>尤其是丰田、三花、福特泰国工厂的相关资料”，李有才告诉36氪，光是书面资料学习，就经历了将近三个月。</strong></p>\n  <p>案头工作里最吃重的，是将比亚迪研发生产流程中的每道工序、每个细节，写成执行手册，再拍成视频，并全都做成中泰双语。</p>\n  <p>泰国汽车产业的情况有些特殊。它长期在日本品牌的体系下运转，培养了数十万熟练技工，但真正手握核心技术的工程师却凤毛麟角，至于电池等新能源汽车配套人才，更是断档严重。</p>\n  <p>对中国新能源车企来说，想把本地的“会组装”变成“懂体系、懂标准、能把流程文件跑通”，这条路并不好走。</p>\n  <p>“我们听过不少前车之鉴，有的公司中国工程师前脚刚走，当地员工后脚就看不懂操作手册了”。</p>\n  <p>李有才告诉36氪，当时团队贯彻的原则之一，就是即便未来无法联络上中方员工，泰籍同事也能凭借这些文本与视频，独立解决产线上的突发难题，<strong>“必须考虑到所有细节，哪怕是在中国工厂从未暴露的问题，也必须逐项落于纸面、录入镜头”。</strong></p>\n  <p>在案头筹备和厂房建设的尾声，比亚迪正式开启当地的招聘工作。“钞能力”，便是比亚迪的第一张牌。</p>\n  <p>罗勇府一般电子机械类操作工的月薪约为2000元人民币；而在首都曼谷，同类岗位的月薪通常可达3000元人民币。</p>\n  <p>多位知情人士告诉36氪，比亚迪的薪酬水平较曼谷更高30%。操作工月薪普遍达到4000元人民币，部分核心技术工人能够达到6000元人民币。工程师人才则相对匮乏，比亚迪只能从成熟企业挖角，“上浮30-50%的工资挖人是常有的事”。</p>\n  <p>除此之外，罗勇基地员工的工资结构也与国内不同。</p>\n  <p>在员工基础工资外，比亚迪还设置了月度绩效、季度奖金、年度奖金；工作时长严格遵守劳动法、加班工资加码，普通周末双倍、节假日三倍；每年15天年假，如未休假可以折现；生产线部分岗位甚至享有单独津贴。</p>\n  <p><strong>人招进来了，但更大的挑战才刚刚开始。摆在比亚迪面前的第二道难关，便是如何留住这些泰籍员工，把居高不下的流失率降下来。</strong></p>\n  <p>李有才告诉36氪，产线技工占员工总数超过九成。“中国人根本猜不透当地人的心思。招聘机构说得很直白：这些技工很难管，有人干一个月就预支工资，预支完直接跑路。这不是比亚迪独有的问题，很多泰国本地工厂也一样头疼”。</p>\n  <p>我们的思路是先了解人。”李有才说，他和团队成员实地走访了罗勇府基层劳工的生活环境，发现，“穷一点的住在木头房子里，跟中国80年代差不多，下大雨偶尔还漏水。没空调，全家只有一台电风扇。这就是大多数基层操作工家庭的真实写照。”</p>\n  <p>早在2010年，王传福就曾直言比亚迪的管理思路：\"<strong>你是企业家，就要像家里的老父亲老母亲一样，事事为儿女着想般地为员工着想。</strong>你只有把他们照顾好，他们才会照顾好你的公司，进而照顾好你的利润\"。</p>\n  <p>如今，罗勇基地再次让这句朴素的道理落了地。</p>\n  <p>“早期去的中国同事把苦吃透了，就为了给泰籍同事创造好的环境”，李有才向36氪表示，基地建设初期人手非常紧张，食堂用具与原料、工服与劳保用品、员工宿舍楼的电器与床上用品等等琐事都压在他团队的肩上。</p>\n  <p>“团队只有零星几个人，在罗勇、春武里、曼谷等地来回奔波采购，我甚至在毛坯宿舍楼里住了半个月，你必须亲身感受，才知道哪里能优化”。在李有才的回忆中，罗勇项目组成员都在贯彻这样的工作原则。</p>\n  <p>比亚迪罗勇基地的总经理，此前在比亚迪中国某基地任管理要职。多位接近罗勇基地的人士向36氪表示，他抵达罗勇厂区后，<strong>除了建设进度外，最重视的就是与员工切实相关的生产安全与生活舒适度相关问题</strong>。</p>\n  <p>“每周开会他都要强调，中国基地能做到什么程度，罗勇基地就必须做到什么程度，不能因为条件艰苦就放低标准”。</p>\n  <p>“他几乎用脚走遍了厂区的每一个角落，厂房哪个角落需要加装风扇、哪段路走起来太远需要安排固定接驳车，他对厂区的指导意见是非常细致且实用的”。</p>\n  <p>从最初撰写案头规划，到最终将这些设施与服务逐一落地，比亚迪罗勇基地整整花了两年时间。如此大费周章，究竟是为了什么？</p>\n  <p>初来乍到的中国企业在泰国毫无信任背书。吃苦耐劳、疯狂加班的印象在前，16个月拔地而起的比亚迪罗勇工厂在后，这让信奉“过度的苦不增加功德”的泰国人，从开始便心生抵触。</p>\n  <p>而早期中国车企在泰国的做法，偏偏又非常“中国化”：我给够了钱，你总该愿意加班了吧？事实却是：员工非但不愿意加班，流失率反而高达30%-50%，远超当地平均水平。</p>\n  <p>要打破困局，就必须拼命证明一件事：自己不是血汗工厂。</p>\n  <p>当比亚迪的床垫比丰田的更软乎，饭菜比泰国电子厂的更香，班车线路比福特的更合理，比亚迪试图用行动告诉泰国人：我请你来，不是为了把你钉在流水线上。我在乎你在这里工作的每一个日子，把你当成一个活生生的人，而不只是一个工人。</p>\n  <p>然而，这一切都只是铺垫。一个工厂成败，产能是最核心的指标。真正的硬仗，在产线启动的那一刻，正式打响。</p>\n  <h3><strong>投产：中国速度遇上“轻松做工”的泰国人</strong></h3>\n  <p>初期，比亚迪在罗勇实行一对一、师带徒的教学模式，“在中国叫了很大一批工程师和生产领班。这些岗位基本都会英语，不会英语的科室就配了两名翻译，还准备了翻译机翻译软件，教学还算顺利，但不同文化间的摩擦在所难免”。</p>\n  <p>李有才向36氪回忆，“有天快下班了，一个泰籍员工找到我，说中方工程师骂他笨，他很生气，甚至想要离职”，他当时的做法便是，立刻致电厂长，将带教的中方工程师叫到现场，“双方一句一句对，看看是哪句话让泰籍员工感到被冒犯了。但结果只是，中方工程师说话的时候比较急比较大声”。</p>\n  <p>“这样的事，早期经常发生”，李有才补充。</p>\n  <p>泰国劳工的口头禅永远是“ใจเย็นๆ”（慢慢来，别急）。他们相信赚钱是为了生活，而非活着只为赚钱。一到下班点，人必须走：回家、参加寺庙活动、朋友聚会，各有各的安排。他们看重工作氛围和同事间的体面：方法可以教，错可以指，但不能当众让人难堪。</p>\n  <p>自此，比亚迪开始推行一系列措施：设置了每周座谈会、投诉信箱、投诉二维码，<strong>甚至厂长办公室也随时开放，“只要你觉得不舒服了，随时可以立刻去找厂长说”。</strong></p>\n  <p>各级领导每日强调必须尊重泰籍同事，坚持耐心教导、多予鼓励、禁止直接批评谩骂；泰籍员工投诉，须当日事当日毕，无法当下解决则需约定何时答复；工厂层面实行幸福工厂计划，将员工满意度与工厂月度业绩分红挂钩等等。</p>\n  <p>在泰国，尊严是一条看不见的红线，社会共识是：权力再大，也不该用来踩碎一个人的体面。</p>\n  <p>而比亚迪又是一家完全陌生的中资工厂，当地工人的神经几乎绷得像一根即将断掉的弦：中方员工的眼神稍微冷一点、声调稍微高一点，都可能被读作冒犯。</p>\n  <p>一旦冲突处置失当，比亚迪面对的不仅是员工流失，更是一个挥之不去的“坏雇主”标签，而这足以让它在当地的扩产计划举步维艰。</p>\n  <p><strong>“总经理当时甚至下了一条指令，如果中方员工和泰方员工发生矛盾，中国员工要先让一步</strong>”，李有才告诉36氪，“我有时候都在想，领导们是不是膝盖有点太软了，为什么要对外国人这么好呢？连说都不能说”。</p>\n  <p>直到基地统计员工流失率，看到那个低于10%的数字，李有才恍然大悟，理解了那些“不合理”背后的合理。</p>\n  <p>然而，新的难题很快来临：中方员工的外派期限就那么长，政策对泰籍员工比例的要求不断增加，泰国工厂得尽快学会自己走路。</p>\n  <h3><strong>中方回撤：泰国人如何扛大梁？</strong></h3>\n  <p>中泰职场文化存在一道明显的分水岭。在中国，只要是领导，谁都能管你。但在泰国，许多人只认自己直属的那一位，越级而来的指令，他们不买账。<strong>中国的“宣讲式管理”到了泰国，彻底水土不服，那种自上而下、单向灌输的方式，泰国人根本不买账。</strong></p>\n  <p>2024年底，罗勇基地开始实行一项“种子人才计划”。</p>\n  <p>“从操作组长、工程师里，挑出比较优秀的、认可比亚迪文化、并且对中国比较向往的员工，到中国进行培训，返泰后让他们担任管理要职”，李有才告诉36氪，第一批被委派至中国学习的泰籍员工共一百余人。</p>\n  <p>这些泰籍员工抵达中国后，将接受为期三个月的培训，“会安排一个同岗位的中国员工跟他们同吃同住，参观比亚迪中国2-3个基地，了解新车研发、试制到投产的全流程，了解比亚迪工程师背景和日常生活，甚至还有一些中国文化相关的活动”。</p>\n  <p>返回罗勇基地后，这些“优秀学员”便会成为泰籍员工队伍中的管理者，承担中泰两方员工之间的桥梁工作。</p>\n  <p>再后来产线上遇见问题，中方员工都必须先找到这个管理者，向这名管理者描述问题，并展示正确做法。</p>\n  <p>“他们了解问题和解决方案后，再以他们觉得适合的方式去和当事员工沟通。相当于，中方员工不用去摸清每个泰国员工的脾气秉性了，<strong>我们只需要和这个管理者沟通，而这个管理者是已经接受过比亚迪更完善培训的了</strong>”，李有才表示，种子人才计划如今已成为罗勇甚至其他海外分部的长期计划。</p>\n  <p>“我们准备得挺周全了，但泰籍员工和中国人的工作习惯还是不同”，李有才表示，泰国当地节假日数量多，绝大部分员工都拒绝节假日加班，“还有一个兜底政策就是，泰国人搞不定的，中国人上。前期外派的中国员工经常干到晚上9、10点”。</p>\n  <p>比亚迪罗勇工厂用两年时间，跳出单纯建厂造车的浅层出海模式，探索出了从薪酬福利、文化包容、本土育才的完整落地路径。对比诸多出海车企遇阻的用工矛盾、人才断层难题，这座生产基地，可以说是中国车企难得的标杆样本。</p>\n  <h3><strong>罗勇工厂2026：如何突破、如何复制</strong></h3>\n  <p>在海外建设的第一座基地，比亚迪几乎倾注了全部的成本与精力。</p>\n  <p>然而，即便做了最大努力，在投产12至18个月后，本该是产能爬坡结束的时期，其产能利用率仍不足50%——这个表现，相比许多其他出海车厂比下有余，但比上不足——同期，丰田泰国皮卡工厂稳定超过80%，比亚迪中国部分基地甚至高达95%。</p>\n  <p>另一方面，2025年比亚迪在东南亚的销量正在狂飙：泰国市场同比增长超60%，印尼市场猛增200%并跃居销量第一，菲律宾更是暴涨400%。</p>\n  <p>在泰国建厂，本意正是以此为支点，辐射整个东南亚右舵市场，为区域扩张提供制造腹地。<strong>然而现实是，泰国工厂的产能爬坡速度，目前仍落后于比亚迪在东南亚的销量增长步伐。</strong></p>\n  <p>2026年，比亚迪为出海业务设定了更高的目标：年销量突破150万辆。然而，其自建滚装船队的实际年运力约80万辆，剩余70万辆如若依赖第三方运力，高昂的运费将大幅侵蚀其海外利润。因此，加速海外工厂的产能释放，成为比亚迪今年的重中之重。</p>\n  <p>从销量结构看，目前全球增速最快的区域正是南美洲和以泰国为核心的东盟。而目前，比亚迪巴西工厂2025年刚投产，尚处爬坡期；印尼工厂仍在建设，目标是在年底实现投产。</p>\n  <p>泰国罗勇工厂，从过去到现在，始终占据着一个特殊的位置。它打下了比亚迪海外工厂的第一块砖，如今也最先直面“如何继续扩产”这道难题。</p>\n  <p>如今，比亚迪刚刚走通从“中国方法”到“泰国方法”的路，第一次真正学会了如何在海外建设一座工厂。但李有才向36氪坦言，“罗勇项目组的同学调到巴西去，发现也得从0开始干活，并没有能完全复用的东西”。</p>\n  <p>2025年，比亚迪巴西工厂因承包商违规让31人共用一间卫生间，这一违规用工行为被巴西政府查处。“中国人很难想象国外对用工环境的要求有多严，也很难想象员工会因为什么就不干了”，李有才对36氪说，虽然泰国罗勇工厂倾尽心血，换来的不过是50%的产能利用率，“但不认真做，压根就开不了工”。</p>\n  <p><strong>中国人可以把标准化的钢筋厂房和产线设备带到任何地方，但让那套设备转起来的“社会环境”，却无法复制。</strong>即便同在东盟，泰国和印尼的气候如此相似，当地人的宗教信仰（泰国佛教为主，印尼伊斯兰教为主）、家庭结构和文化教育，也已截然不同。</p>\n  <p>出海建厂已成定局，中国车企缺的不是蓝图，而是一本能在不同国度反复生效的真经。</p>\n  <p>从比亚迪罗勇基地，我们看到一个朴素的道理：中国企业出海建厂，首先要成为“值得被尊重的雇主”。赢得尊重的方式，在中国，可能是待遇与情义；在德国，是可靠与规矩；在泰国，要顾及员工的体面与个人成长；在南美，则或许在于如何证明自己的长期主义。</p>\n  <p>归根结底，无论身处哪一国，受人敬仰的企业做的都是同一件事：让自己成为那个地方的一部分，而不是那个地方的过客。</p>\n  <p>*李有才为化名</p>", "category": "tech", "published_at": "2026-06-12T06:26:00+00:00", "fetched_at": "2026-06-13T02:56:54.598181+00:00", "fingerprint": "c8fc360edff6e943"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜SpaceX确定发行价，募资750亿美元创史上最大IPO；OpenAI CEO奥特曼推迟访韩计划；中央网信办举报中心开设“涉AI应用乱象举报专区”", "url": "https://36kr.com/p/3849942472512769?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849894508041220\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenAI CEO奥特曼推迟访韩计划</strong></a></p>\n  <p>据报道，OpenAI首席执行官山姆·奥特曼因个人原因推迟访韩计划。奥特曼原定于14日至15日访韩，会见三星电子、Kakao、NAVER等企业负责人。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849421770658823\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Alphabet旗下自动驾驶公司Waymo将推出30美元月费会员计划</strong></a></p>\n  <p>当地时间6月11日，Alphabet旗下自动驾驶公司Waymo宣布，将推出仅限受邀用户参与的Waymo Premier30美元月费会员计划，会员可享受优先接送、每次行程10%的乘车返现（以乘车积分形式返还）、在新城市优先体验Waymo服务以及每月最多五次免费取消行程等权益。Waymo表示，最初将通过应用程序和电子邮件向美国旧金山、洛杉矶和凤凰城的数万名符合条件的乘客发送邀请，计划最终将会员计划推广到Waymo应用程序已覆盖的其他城市。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849477119939840\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士考虑引入ChatGPT等外部人工智能服务</strong></a></p>\n  <p>据业内人士周五透露，继三星电子之后，SK海力士也在考虑更广泛地采用人工智能（AI）技术来改变其工作流程。消息人士称，SK海力士CEO郭鲁正周四在一次会议上表示，该公司正寻求在保护工业技术和扩大人工智能应用之间取得平衡，同时也在评估引入外部生成式AI模型的可能性。郭鲁正表示：“我们正在考虑采用Microsoft 365和CoPilot，同时也在从安全性和系统架构的角度评估ChatGPT在公司内部的潜在应用。���</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849778096198656\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>华尔街大行限制对冲基金对SK海力士和三星等亚洲芯片股的做多杠杆</strong></a></p>\n  <p>据知情人士透露，全球银行正在限制对冲基金对亚洲顶级芯片制造商（包括SK海力士和三星电子）的杠杆押注，此前今年以来的猛烈上涨引发了可能回调的担忧。知情人士表示，包括花旗集团、摩根大通和高盛在内的经纪商已经提高了对冲基金通过掉期方式押注SK海力士和三星电子股票的融资成本。银行收紧了新交易的规模以及向哪些公司提供交易，有些银行甚至拒绝客户提出的新掉期交易请求，或根据具体情况进行评估。针对台积电，银行也采取了类似措施。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849744240989442\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>谷歌宣布追加投入5000万美元培训美国技工，以满足AI基础设施建设需求</strong></a></p>\n  <p>随着人工智能的蓬勃发展，对数据中心和基础设施的需求空前高涨，Alphabet旗下的谷歌正在加大对美国技术工人队伍的投资。当地时间周四，Alphabet首席执行官桑达尔·皮查伊宣布，谷歌将追加投资5000万美元，帮助美国20多个州的30多万美国人做好从事技术行业职业的准备。据谷歌称，这项新的投入是其更大规模计划的一部分。自2022年以来，该公司已在全球范围内投入超过10亿美元用于培训和技能提升项目，帮助超过1亿人掌握数字和人工智能相关技能。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849684512019457\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士回应厂区火灾：已初步控制，生产设备运行正常</strong></a></p>\n  <p>6月12日，消息显示韩国SK海力士清州第四园区爆发火情。对于最新情况和影响，SK海力士方面向记者表示，已完成初步控制，正调查具体情况。目前生产设备运行正常。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849592681895176\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>晶核能源发布全球首款专为机器人场景定制的高性能固态电池</strong></a></p>\n  <p>36氪获悉，近日，上海FINE 2026未来产业新材料博览会启幕，晶核能源携全球首款专为机器人场景定制的高性能固态电池首发，并获 “2026固态电池领军金球奖”。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849759679436038\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“碳生万物”完成A轮融资</strong></a></p>\n  <p>36氪获悉，据高榕创投消息，近日，“碳生万物”宣布完成A轮融资。本轮融资由黄河三角洲投资、高榕创投和博远资本共同领投，同时引入宁德时代、阳光电源、倚锋资本等新股东，多家老股东持续跟投。&nbsp;本轮融资资金将用于公司宁夏千吨级DAC（直接空气碳捕集）制备e-SAF（可持续航空燃油）项目建设、工艺放大、核心技术迭代及全球顶尖人才引进。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849378031899913\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX确定发行价，募资750亿美元创史上最大IPO</strong></a></p>\n  <p>根据SpaceX周四在官网发布的声明，公司此次IPO发行5.556亿股，发行价为每股135美元，募资总额达750亿美元。SpaceX此次IPO募资规模是沙特阿美2019年创下的294亿美元上市纪录的逾两倍。声明显示，SpaceX还授予承销银行超额配售权，可按发行价额外购买8330万股股票。若该权利全部行使，IPO融资规模将增至约860亿美元。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849754408326150\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>欧洲央行管委内格尔：如有必要将于7月再次加息</strong></a></p>\n  <p>据报道，欧洲央行管委内格尔表示，欧洲央行将在7月保持所有选项的开放性，一旦需要，随时准备再次作出响应。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849870270256390\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“词元（Token）云服务提质赋能评估计划” 正式启动</strong></a></p>\n  <p>36氪获悉，中国信息通信研究院以“可信词元（Token）云服务”为主题，于2026年6月10日组织开展了研讨会。中国工程院院士郑纬民、中国信通院总工程师何宝宏、中国信通院云计算与数字化研究所副所长（主持工作）栗蔚出席并发言。会上，中国信通院联合天翼云、阿里云、华为云、京东云、联想、阶跃星辰、金山办公、清程极智等十余家企业，发起了“词元（Token）云服务提质赋能评估计划”并发布多项成果。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849819407127559\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中央网信办举报中心开设“涉AI应用乱象举报专区”</strong></a></p>\n  <p>36氪获悉，为配合“清朗·整治AI应用乱象”专项行动，进一步规范AI服务和应用，促进行业健康有序发展，切实保障公民合法权益，中央网信办举报中心自2026年6月起开设“涉AI应用乱象举报专区”，专项受理公众举报。受理范围主要包括生成合成内容标识落实不到位、制作发布虚假不实和暴力低俗信息等14类问题。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849556520244481\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>全国最大半潜式综合性网箱养殖平台将投产</strong></a></p>\n  <p>今天（12日）下午，全国规模最大的半潜式综合性网箱养殖平台将在海南三亚正式投产，并投放首批鱼苗。该平台的养殖水体总量达到6.4万立方米，相当于约20个标准奥运游泳池的水量。全年可以产出800万斤鱼，同时还可以发展休闲渔业和垂钓观光等农旅融合新业态。</p>", "category": "tech", "published_at": "2026-06-12T13:15:02+00:00", "fetched_at": "2026-06-13T02:56:54.598176+00:00", "fingerprint": "919fd6157ff02963"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜SpaceX市值破2.1万亿美元，马斯克身家达巴菲特7倍；胖东来回应“员工不值这么多钱”等言论；FIFA联名款labubu世界杯销量暴涨30倍", "url": "https://36kr.com/p/3850898430989577?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>Kimi与一国有银行合作，全球首张AI原生信用卡开放预约</p>\n  <p>韩美半导体将使用500亿韩元投资于SpaceX</p>\n  <p>SK海力士回应本月发生第二起火灾</p>\n  <p>杭州小龙虾降价超50%</p>\n  <p>金价连跌，批发商集中补货</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>SpaceX市值破2.1万亿美元，马斯克身家达巴菲特7倍</strong></p>\n  <p>当地时间6月12日，万众瞩目的太空探索公司SpaceX于在纳斯达克交易所完成了上市。SpaceX是有史以来规模最大的IPO，发行价定为135美元，对应市值达1.77万亿美元。该股开盘价150美元，午盘涨幅一度突破30%触及176.53美元，随后股价震荡回落收盘报160.99美元，涨幅19.22%，跻身美国市值第六大企业，总市值达到2.1万亿美元。马斯克的个人财富随之升至约1.05万亿美元，成为全球首位净资产超过万亿美元的富翁。这相当于瑞士全年GDP，根据彭博富豪指数，这约等于全球第二到第五名富豪总和，是“股神”巴菲特1450亿美元的七倍。（第一财经）</p>\n  <p><strong>胖东来：从未有任何降薪决定</strong></p>\n  <p>6月12日，针对网络上出现大量关于“胖东来大幅降薪，将调整员工薪酬”、“员工不值这么多钱”“员工收入六千已经非常好了”等话题的讨论，胖东来发布情况说明，“请大家不要误读”。胖东来表示，从未有任何降薪的决定，薪酬政策是在公平公正的基础上保障薪酬收入与创造价值相匹配，目的也是为了培养人和成就人。（财联社）</p>\n  <p><strong>FIFA联名款labubu世界杯销量暴涨30倍</strong></p>\n  <p>快科技6月12日消息，2026年美加墨世界杯开幕，开幕式上亮相的中国原创潮玩IP拉布布迅速走红，一跃成为现象级带货单品，相关联名产品热度空前高涨。作为世界杯历史上首个登台的中国潮玩形象，两只萌趣的拉布布人偶在开幕式收获满堂喝彩，相关画面流传至国内网络后，立刻掀起了抢购热潮。</p>\n  <p>这款泡泡玛特推出的FIFA联名拉布布公仔定价599元，为了应对抢购热潮，平台设置了限购规则，每个账号最多只能入手两件。世界杯开幕后，该款产品的搜索量大幅攀升，整体销量环比暴涨超30倍，多个电商店铺销量轻松破万，部分平台销量甚至接近两万件。（快科技）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>被指设计缺陷致人自杀，OpenAI遭起诉</strong></p>\n  <p>6月11日，一名加拿大女子在美国加州对OpenAI及其首席执行官萨姆·奥尔特曼提起诉讼，称聊天机器人ChatGPT的设计问题导致她女儿爱丽丝自杀身亡。起诉书称，爱丽丝在自杀前约一年半的时间里，曾多次向ChatGPT表露自杀想法，倾诉情感问题，但聊天机器人的安全系统并未启动和介入，也未通知危机处理机构或爱丽丝的家人。此外，ChatGPT的设计优先考虑用户参与度而非安全性，在聊天中提供持续情感支持，可能导致一些人对聊天机器人过度依赖。对此，OpenAI发言人回应称，这起事件令人心碎，公司正在加强对敏感情况的应对能力。据原告律师透露，OpenAI目前面临多起类似诉讼，均由自杀或试图自杀者的家属提起。（央视新闻）</p>\n  <p><strong>SK海力士考虑引入ChatGPT等外部人工智能服务</strong></p>\n  <p>据业内人士6月12日透露，继三星电子之后，SK海力士也在考虑更广泛地采用人工智能技术来改变其工作流程。消息人士称，SK海力士CEO郭鲁正在一次会议上表示，该公司正寻求在保护工业技术和扩大人工智能应用之间取得平衡，同时也在评估引入外部生成式AI模型的可能性。郭鲁正表示：“我们正在考虑采用Microsoft 365和CoPilot，同时也在从安全性和系统架构的角度评估ChatGPT在公司内部的潜在应用。”（新浪财经）</p>\n  <p><strong>谷歌宣布追加投入5000万美元培训美国技工，以满足AI基础设施建设需求</strong></p>\n  <p>随着人工智能的蓬勃发展，对数据中心和基础设施的需求空前高涨，Alphabet旗下的谷歌正在加大对美国技术工人队伍的投资。当地时间6月11日，Alphabet首席执行官桑达尔·皮查伊宣布，谷歌将追加投资5000万美元，帮助美国20多个州的30多万美国人做好从事技术行业职业的准备。据谷歌称，这项新的投入是其更大规模计划的一部分。自2022年以来，该公司已在全球范围内投入超过10亿美元用于培训和技能提升项目，帮助超过1亿人掌握数字和人工智能相关技能。（新浪财经）</p>\n  <p><strong>Kimi与一国有银行合作，全球首张AI原生信用卡开放预约</strong></p>\n  <p>36氪获悉，月之暗面Kimi6月12日宣布，全球首张AI原生信用卡Kimi信用卡正式开启预约，这是首张将AI服务纳入核心权益体系的实体信用卡，持卡人的每一笔消费可转化为AI算力额度，直接兑换Agent使用额度和高级功能等权益。据了解，Kimi已与一大型国有银行及国际卡组织进行合作，探索Token和信用卡积分相互流通的全新金融范式。消费积分可兑换算力额度，持卡人也可以优先内测最新模型。</p>\n  <p><strong>腾讯云:下调MiniMax-M3与Hy-MT2-Pro模型价格</strong></p>\n  <p>36氪获悉，腾讯云公告，大模型服务平台TokenHub将于北京时间2026年6月15日起下调MiniMax-M3模型价格，推理输入、推理输出及缓存命中费用均下调50%。大模型服务平台TokenHub将于北京时间2026年6月12日起下调Hy-MT2-Pro模型价格，输入价格下调66.67%、输出价格下调55.56%。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>阿里拟出资15亿美元竞购中国生鲜电商“朴朴超市”</strong></p>\n  <p>阿里巴巴正出资15亿美元收购中国生鲜外卖平台“朴朴超市”。知情人士透露，阿里提出的这一价格是此前高鑫零售报价的两倍多。（新浪财经）</p>\n  <p><strong>韩美半导体将使用500亿韩元投资于SpaceX</strong></p>\n  <p>据公司声明，韩美半导体将花费500亿韩元购买SpaceX的股份。这项投资是一项提前布局的战略举措，其驱动力是SpaceX的增长和Terafab项目。（新浪财经）</p>\n  <p><strong>“滴滴出行”改名“滴滴”</strong></p>\n  <p>6月12日上午9点，界面新闻搜索苹果软件App获悉，滴滴出行App 8.0版本11日已正式上线，App名称从“滴滴出行”正式更名为“滴滴”。据滴滴官方介绍，更新后的App页面结构全面升级，新增顶部导航栏，底部新增“消息”、“行程”入口，覆盖出行、送货、旅行、车主等多重使用场景，操作更顺畅。用户可通过语音使用AI打车，“送货”整合了大件送货、快送跑腿、搬家等服务，“旅行”提供租车、机票、酒店、火车票预订及“滴滴私家团”旅游服务。（界面新闻）</p>\n  <p><strong>恒生港美科技指数将纳入SpaceX</strong></p>\n  <p>恒生指数公司6月12日公告，SpaceX于2026年6月12日上市。因此，恒生港美科技指数的编算方法将新增太空探索技术公司（「SpaceX」，股票代号：SPCX.O）至指定美国成分股名单（目前：科技七巨头）。8只美国上市成分股的比重将于2026年6月23日（SpaceX的第7个交易日）收市后重新计算至等权重，新增成分股和更新后的成分股比重将于2026年6月29日（SpaceX的第11个交易日）生效。（界面新闻）</p>\n  <p><strong>SK海力士回应本月发生第二起火灾</strong></p>\n  <p>当地时间6月12日上午9点50分左右，SK海力士清州四号园区M15X二楼的燃气房发生火灾。这是本月发生的第二起火灾事故。据报道，目前尚未发生气体泄漏或人员伤亡。由于工厂内部安装的自动喷水灭火系统立即启动，火势并未迅速蔓延。对于最新情况和影响，SK海力士方面向记者表示，已完成初步控制，正调查具体情况。目前生产设备运行正常。（财联社、证券时报）</p>\n  <p><strong>按姓氏笔画排列、不得单独署艺名，三协会发文整治演员署名“撕番”乱象</strong></p>\n  <p>6月12日，三协会发步通知规范电视剧演员署名。《通知》明确，演员署名实行分类管理，应根据角色性质、戏份体量及实际参与情况，规范使用“领衔主演”“特别出演”“出演”三类头衔，不得随意修改、增加其他名目。需说明的是，上述类别仅适用于有明确角色对应关系的演员。《通知》强调，在分类的基础上，演员署名按照法定姓名的姓氏笔画由少至多排列（复姓按首字笔画计算，少数民族按身份证登记姓名的首个汉字笔画计算）。如笔画相同，则依次比较姓名第二个字、第三个字的笔画，直至形成唯一排序。（央视新闻）</p>\n  <p><strong>燃料涨价推高韩国海鲜价格</strong></p>\n  <p>受霍尔木兹海峡航运受阻带来的油价走高以及气候变化等因素影响，韩国海鲜价格近来显著上涨，渔业经营面临严峻挑战。《韩国商业电讯》6月11日报道，首尔鹭梁津水产市场数据显示，5月最后一周，多种热门海鲜产品的拍卖价格大幅上涨。帝王蟹价格较前一周飙升56.4%，带鱼价格上涨29.1%，雪蟹和八爪鱼的价格分别上涨了28.2%和24.7%。能制作生鱼片的鱼类价格也有显著涨幅。野生比目鱼价格上涨超过30%，养殖比目鱼、野生海鲈鱼和养殖真鲷的价格涨幅均达两位数。（新华社）</p>\n  <p><strong>OpenAI CEO奥特曼推迟访韩计划</strong></p>\n  <p>据报道，OpenAI首席执行官山姆·奥特曼因个人原因推迟访韩计划。奥特曼原定于14日至15日访韩，会见三星电子、Kakao、NAVER等企业负责人。（界面新闻）</p>\n  <p><strong>杭州小龙虾降价超50%</strong></p>\n  <p>进入6月，湖北潜江小龙虾供货量逐渐减少，在走访时发现，目前杭州市场上的小龙虾已经完成了产地轮换，江苏、安徽和浙江本地产的小龙虾增多，货源充足，小龙虾价格也大幅回落，不少市民直呼实现了“小龙虾自由”。目前中青规格小龙虾的批发价每斤12元，大青规格小龙虾每斤16元，跟今年二三月份刚上市时的价格相比，降幅均超过50%。此外，广阔的海外市场，为小龙虾打开了利润增长空间。今年，多地小龙虾出口量与货值双双攀升，远销欧美及东南亚。（央视财经）</p>\n  <p><strong>长江证券：陈佳辞任副董事长</strong></p>\n  <p>36氪获悉，长江证券���告，公司董事会收到副董事长陈佳的书面辞职报告，因个人原因，陈佳申请辞去公司董事、副董事长等职务。陈佳的辞职报告自送达董事会时即生效，辞职后将不再担任公司任何职务。</p>\n  <p><strong>金价连跌，批发商集中补货</strong></p>\n  <p>自年初创下历史新高后，国际金价最近几天连续多个交易日持续下行，国内金饰价格也大幅下跌。工作日的下午3点，深圳水贝各大黄金柜台前依然聚集了不少消费者。央视财经记者走访中发现，对于有婚庆等刚需的消费者来说，金价下跌带来的吸引力尤为明显。多家门店销售人员表示，本周来水贝的消费者明显增加。随着金价回调，不少此前持观望态度的批发商也开始集中补货，采购活跃度明显回升。此外，在北京市西城区一家黄金销售门店，投资金柜台前人头攒动，金条的结账柜台前排起了长队。记者走访发现，近期，多数新增投资者主要看好金价未来走势与黄金长期投资价值，在金价回落时点选择逢低小额度购入。（央视财经）</p>\n  <p><strong>现代汽车工会称薪资谈判未达协议，25日将投票决定是否罢工</strong></p>\n  <p>据报道，现代汽车工会6月12日称薪资谈判未达成协议，将于25日投票决定是否罢工。（界面新闻）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>众擎机器人据悉将向港交所提交IPO申请</strong></p>\n  <p>众擎机器人据悉将向港交所提交IPO申请。（新浪财经）</p>\n  <p><strong>长鑫科技集团股份有限公司IPO审核状态变更为注册生效</strong></p>\n  <p>36氪获悉，据上交所官网显示，长鑫科技集团股份有限公司IPO审核状态变更为注册生效。</p>\n  <p><strong>沐曦股份：筹划发行H股股票并在香港联合交易所有限公司上市</strong></p>\n  <p>36氪获悉，沐曦股份公告，为满足公司业务发展的需要，进一步提升公司治理水平和核心竞争力，深入推进公司全球化战略，公司拟发行境外上市外资股（H股）股票并申请在香港联合交易所有限公司（以下简称“香港联交所”）主板挂牌上市（以下简称“本次发行并上市”或“本次发行”）。公司将充分考虑现有股东的利益和境内外资本市场的情况，在股东会决议有效期内（即自公司股东会审议通过之日起24个月内）或股东同意延长的其他期限内选择适当的时机和发行窗口完成本次发行并上市。</p>\n  <p><strong>江苏贝尔家居科技股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，江苏贝尔家居科技股份有限公司向港交所提交上市申请书。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>AI机器人企业Theker获路威酩轩等投资方8500万美元融资</strong></p>\n  <p>总部位于巴塞罗那的人工智能机器人企业Theker于6月11日宣布完成一轮总额8500万美元的融资。Theker表示，公司研发搭载人工智能技术的机器人，可在工业场景中完成各类作业。本轮融资由风投公司CRV领投，三星、路威酩轩集团等机构参与投资。（新浪财经）</p>\n  <p><strong>“力普司LiiPuS”连续完成种子轮及天使轮融资，总额达数千万元</strong></p>\n  <p>36氪获悉，“力普司LiiPuS”近期连续完成种子轮及天使轮融资，总额达数千万元。其中，种子轮由江苏金桥基金独家投资，天使轮由云时资本独家投资。本轮资金将主要用于高端船舶综合电力推进系统及产品的样机测试、持续改进及小批量交付，加速国产高端推进系统在港口拖轮、海工船、豪华游艇等场景的规模化应用。</p>\n  <p><strong>“星能玄光”连续完成A系列两轮融资</strong></p>\n  <p>36氪获悉，可控核聚变FRC技术路线企业“星能玄光”近日连续完成A系列两轮融资，金额五亿元，此次融资将用于继续提升和推进高性能FRC装置的参数。</p>\n  <p><strong>“碳生万物”完成A轮融资</strong></p>\n  <p>36氪获悉，据高榕创投消息，近日，“碳生万物”宣布完成A轮融资。本轮融资由黄河三角洲投资、高榕创投和博远资本共同领投，同时引入宁德时代、阳光电源、倚锋资本等新股东，多家老股东持续跟投。本轮融资资金将用于公司宁夏千吨级DAC（直接空气碳捕集）制备e-SAF（可持续航空燃油）项目建设、工艺放大、核心技术迭代及全球顶尖人才引进。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>晶核能源发布全球首款专为机器人场景定制的高性能固态电池</strong></p>\n  <p>36氪获悉，近日，上海FINE 2026未来产业新材料博览会启幕，晶核能源携全球首款专为机器人场景定制的高性能固态电池首发，并获“2026固态电池领军金球奖”。</p>\n  <h2><strong>AI图谱</strong></h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>55岁的马斯克很缺钱？SpaceX上市背后的三个真相。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜Kris</p>", "category": "tech", "published_at": "2026-06-13T01:01:24+00:00", "fetched_at": "2026-06-13T02:56:54.598170+00:00", "fingerprint": "bba2eafb4452a7f5"}, {"source": "36氪 - 最新文章", "title": "SpaceX 2万亿美元市值这一夜，回望中国商业航天十年冷暖", "url": "https://36kr.com/p/3850902095336449?f=rss", "summary": "<p>6月12日晚，SpaceX以史上最大估值完成IPO，股价冲高至176美元，截至目前市值已经突破2万亿美元。 马斯克成为历史上第一位万亿美元身价的富豪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_3e347a3fd2bf4c729355071525e08d5c@5920579_oswg57991oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">马斯克在得克萨斯“星际基地”（Starbase）敲钟</p>\n  <p>其实在SpaceX敲钟之前，大洋彼岸的行业水温早已接近沸腾。</p>\n  <p><strong>过去半年，商业航天成为国内一级市场最热的赛道之一。</strong>投资人排队约见创始人，地方政府争抢项目落地，一些过去很少关注航天的基金，也开始研究火箭、卫星和星座。<strong>“头部项目现在整个市场有几百家机构在跟，根本聊不上。”</strong>一位长期关注商业航天的投资人告诉硬氪。</p>\n  <p>资本涌入的速度和规模都在刷新纪录，头部公司融资金额动辄20亿元以上。<strong>最大的一笔是2026年2月星际荣耀的D++轮，金额超过50亿元。</strong></p>\n  <p>热度并非毫无根基。<strong>从2014年政策破冰，到2025年IPO大门开启，中国商业航天恰好走完一个十年周期。</strong></p>\n  <p>十年中，失望和寒冬几乎是常态，偶尔的回温也转瞬即逝。火箭太贵，周期太长，商业闭环迟迟没有出现。投进去的钱短期内看不到结果，“一级市场投不动了”。</p>\n  <p><strong>但2026年，市场的情绪彻底扭转。</strong>SpaceX的IPO证明这个赛道的价值，中国上市通道打开，愿景有了兑现的清晰路径。<strong>“很兴奋。有退出通道，我们才更有动力持续投入；有上市公司，才能带动整个产业。”一位投资人表示。</strong></p>\n  <p>更何况，他们有信心：中国公司即便达不到SpaceX的程度，也能有相当丰厚的回报。</p>\n  <p><strong>他们并非盲目乐观。</strong>过去十年，我们可以看到中国商业航天公司从凑不齐发动机，一步步走到火箭升空。这群人中找不出马斯克，但因为有庞大的制造业托底，有政策扶持，铺路的动作从未停止。</p>\n  <p>或许，中国公司真的能摸索出和SpaceX不同的道路。<strong>“美国有一家Tesla，中国有比亚迪、吉利、长城、奇瑞和蔚小理；美国有一家SpaceX，中国商业航天未必只有一个赢家。”一位投资人表示。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_7d925194f93446ef8a6c74d52d1c1fc7@5920579_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>从PPT，到火箭升空</strong></p>\n  <p>中国的商业航天产业和SpaceX类似，都由体系垄断一步步走向市场。</p>\n  <p>长期关注商业航天的人，仍记得2015年前后SpaceX带给行业的震撼。大西洋上的回收驳船一次次等待火箭归来，火箭一次次坠海、爆炸、解体，又一次次重新起飞。每一次失败，都在为可重复使用积累数据。</p>\n  <p><strong>“那时候大家意识到，把航天看作一个高大上的产业没有意义了，人家已经快用工业化逻辑把这件事做成了。”</strong>一位从业多年的商业航天人士回忆。</p>\n  <p><strong>所谓用工业化逻辑重做航天，核心是成本与效率。</strong>传统航天是国家工程，强调极致可靠，用最高等级的宇航级器件，不计成本地追求成功率；商业航天则大量使用经过验证的工业级产品，靠缩短研发周期、优化供应链来压成本。这条路被SpaceX验证过，也在近地轨道的应用环境里逐渐成为行业共识。</p>\n  <p><strong>中国的拐点出现在2014年。</strong>国务院发布《关于创新重点领域投融资机制鼓励社会投资的指导意见》，首次明确鼓励社会资本进入航天领域。随后，一批来自航天科技集团、航天科工集团、中科院体系的技术人员离开体制，创办了中国第一批商业航天企业。</p>\n  <p><strong>“刚开始其实什么都没有，就是一群人画PPT。”</strong>上述人士向硬氪回忆。那时的中国商业航天更像一个概念，真正愿意下注的资金，大多来自中科院体系、地方产业基金这类带着战略布局属性的机构。</p>\n  <p>2015年12月21日，猎鹰9号一级火箭在卡纳维拉尔陆地着陆场回收成功，人类首次实现轨道级火箭垂直回收，可复用火箭从理论走向现实。此后几年，SpaceX快速迭代，星链开始规模化组网，一个全新的产业样本摆在全球面前。<strong>市场化基金开始探讨一个故事：中国能不能拥有自己的SpaceX。</strong></p>\n  <p>但当时这件事遥不可及。<strong>“刚开始去尽调的时候我们很惊讶。”</strong>一位市场化基金投资人回忆，<strong>“大家都说是民营商业航天，但很多核心零部件还得进口，创业公司甚至拿不到体制内单位的供货。”</strong></p>\n  <p><strong>很长一段时间，国内不存在真正意义上的民营航天供应链</strong>。发动机、伺服机构、特种材料、电子系统等关键环节大多掌握在体制内单位手中，有限的产能要优先保障国家任务，民营企业很难拿到供货。</p>\n  <p>“2016年前后，我们只能做固体火箭，本质上是把成熟导弹技术改造成运载火箭。但很多关键部件也买不到，拼不齐一个火箭。即便能买到，也非常贵。”大航跃迁创始人陈曙光回忆。</p>\n  <p><strong>这意味着，资本投下去，并不能立刻变成产品。整个行业要从零搭建基础设施。</strong></p>\n  <p>2017年前后，行业出现松动。部分航天科技、航天科工及军工集团开始向民营企业开放部分资源。能买到的仍以探空火箭部件为主，但商业航天企业至少有了从验证走���实践的机会。</p>\n  <p>2018年因此成为中国民营商业火箭元年。这一年，星际荣耀、零壹空间、蓝箭航天三家民营企业集中完成4次亚轨道火箭发射和1次运载火箭首飞试验。</p>\n  <p><strong>但这种尝试没办法变成持续、标准化的生产。最终给行业按下加速键的，仍是国家队。</strong>2023年，中国星网启动全产业链大规模招标，拉通整条供应链，给民营航天企业提供了入场机会。</p>\n  <p><strong>对长期缺乏需求牵引的商业航天来说，这是标志性事件。</strong>“<strong>星网和垣信出来之后，两大星座规划规模接近3万颗卫星，真正拉动了一级市场和产业链的变化。</strong>”一位长期关注行业的投资人表示。</p>\n  <p>同一时间，火箭侧独立的发动机供应商、伺服机构、贮箱等核心部件供应商也相继出现，火箭关键系统的成本持续下降。陈曙光回忆，<strong>2023年调研行业时，“全箭90%以上的零部件、90%以上的价值量，都已经可以在民营体系内完成。”</strong></p>\n  <p>商业航天的核心，是让市场的事归于市场。<strong>“长远来看，天上一定会有上万颗卫星。如果还像前十年一样用半商业化的逻辑去做，成本根本降不下来。”</strong>一位卫星领域从业者表示，<strong>“未来十年，供应链进一步工业化是大势所趋。”</strong></p>\n  <p>从体系内走向体系外，商业航天不再是PPT上的故事，变成了发射场上的轰鸣。</p>\n  <p>接下来的问题是：到底怎么挣钱？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_a812782c681244e8900c8fd59bbf7b30@5920579_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>商业航天离挣钱有多远？</strong></p>\n  <p>中国商业航天公司可以靠市场力量造出火箭，但还无法自我造血。</p>\n  <p><strong>航天商业化有一条环环相扣的逻辑链：</strong>火箭可回收降低发射成本，发射成本下降推动卫星盈利，卫星盈利后才能继续组网、持续购买发射服务，最终形成闭环。这就是SpaceX今天的运营逻辑。</p>\n  <p><strong>闭环的第一步，是火箭可回收。</strong></p>\n  <p>可回收要求火箭的一子级在返回大气层时能够精准控制姿态、保证稳定并且精准定点着陆，这对火箭的整体稳定性与控制能力提出了更高要求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_0a4f1f1d9d42496484d1f31e6bd6015d@5920579_oswg452634oswg832oswg524_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">火箭一子级（图源/蓝箭航天官网）</p>\n  <p>具体在发动机层面，固体发动机是天然一次性的，液体发动机才能支撑更大的运载能力，也是重复使用的基础。</p>\n  <p>现代运载火箭多采用发动机并联布局，即多个发动机一起工作。并联更少的台数，能够降低系统复杂度、提升整体可靠性，同时减少综合成本。要做到少并联，必须提高单台发动机的推力。</p>\n  <p>目前，国内较为成熟的单台液体发动机推力为80吨级和120吨级。对比来看，成功回收的SpaceX猎鹰系列，单台发动机推力超过200吨。</p>\n  <p><strong>看起来只是数字的差距，背后是完全不同的工程难度。</strong>推力提升后，燃烧室内的温度、压力和燃气流速都会逼近极限，燃烧室、喷管、涡轮泵长期处在高温高压下，容易烧蚀、变形、疲劳，对材料、工艺和冷却设计的要求成倍增加。</p>\n  <p>“现在让很多公司设计200吨级的发动机，图纸都能画出来。但流量放大以后，整个系统都要重构，发动机、管路、控制、结构全部要重新协同。<strong>这本质上是一个超级工程。</strong>”一位火箭发动机从业者告诉硬氪。</p>\n  <p><strong>无法实现可回收，就无法控制发射成本</strong>。“现在大家诟病商业航天不挣钱，原因很简单：花得太多。花得最多的地方就是发射。”一位前商业卫星公司从业者表示。</p>\n  <p>如今，猎鹰9号的发射成本已降至每公斤数千美元。按马斯克的设想，如果星舰实现完全重复使用，未来有机会进入每公斤数百美元的时代。相比之下，国内不同型号火箭虽有差异，平均发射成本普遍在每公斤6万到7万元人民币。</p>\n  <p><strong>很多商业卫星公司规划了大量卫星，却用不起火箭。“大家都是咬着牙往天上打，也知道自己某种程度上是在给火箭公司打工。”上述人士表示。</strong>业内普遍认为，如果可回收技术把成本降到每公斤3万元以下，卫星发射需求会迎来明显释放。</p>\n  <p><strong>而卫星需求释放，仍不等于商业闭环。</strong></p>\n  <p>SpaceX的特殊之处，在于它同时拥有火箭发射、卫星制造和Starlink运营体系，靠垂直整合形成完整闭环。</p>\n  <p>中国商业航天的路径更像一个产业集群：火箭公司、卫星公司、运营商、材料和零部件企业各自成长，再靠协同构建生态。<strong>这种模式能发挥中国制造的体系优势，也意味着链条更长、参与方更多，闭环更难形成。</strong></p>\n  <p><strong>即便未来可回收成熟、发射成本下降，产业链还要跨过下一道门槛：卫星怎么赚钱。</strong>发射成本下降只是降低了入轨的门票价格，并不直接创造收入。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_f15640a9b98a4a07a7353e988d654d9f@5920579_oswg703275oswg859oswg537_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">卫星互联网概念图 （图源/视觉中国）</p>\n  <p>Starlink的用户来自全球160多个国家和地区，年收入已达114亿美元。那么，中国的卫星要为谁服务？又有谁来买单？</p>\n  <p>如果只做国内市场，中国的地面通信网络已经高度发达，对卫星直连的需求没有那么迫切，很难长期撑起整个产业链。</p>\n  <p>因此，不少业内人士认为，<strong>中国商业航天最终要走向全球市场，和SpaceX在同一个盘子里分蛋糕。</strong></p>\n  <p>“像印度尼西亚这样的岛国，建地面通信网络成本很高，卫星互联网的优势就非常明显。中国星座未来想实现商业化，最终还是要出海。<strong>而到那时，要直面的竞争对手就是Starlink。”</strong>一位卫星领域从业者表示。</p>\n  <p>不过，现在谈全球竞争还太早。对中国商业航天而言，低成本发射这个前提还没有完成。<strong>这个行业依然需要大量的资金、时间和耐心。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_7f8a98e0575942a080a5374bb37a684d@5920579_oswg4962oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>IPO，下一程长跑的起点</strong></p>\n  <p>商业航天公司能上市是个分水岭，当自己无法盈利时，它们也可以撬动更充裕的资金。</p>\n  <p>这一步来得艰难。</p>\n  <p>如果按商业航天行业自身的发展节奏和过去的上市要求，IPO可能还要等很多年。</p>\n  <p><strong>但紧迫性变了。</strong></p>\n  <p>2022年，俄乌冲突期间，传统地面通信网络大面积受损，Starlink大规模参与战场通信保障。<strong>卫星互联网的意义，从商业基础设施上升为战略基础设施。</strong>Starlink还和美国政府合作，推出专门为军方设计的“星盾”服务。</p>\n  <p><strong>与此同时，近地轨道和无线电频率资源是有限的，总共只开放6–10 万颗。但Starlink一家就号称要部署4.2万颗。</strong>国际电信联盟的频轨申报遵循先到先得，留给后来者的窗口在迅速缩小。</p>\n  <p><strong>参与者们必须加速，抢占资源。</strong></p>\n  <p>首先就是打开融资渠道。2025年，商业航天与卫星互联网被纳入“十五五”规划重点方向；同年12月26日，上交所发布商业火箭企业科创板上市指引，明确采用可重复使用技术的中大型运载火箭企业可适用相关上市标准。</p>\n  <p><strong>“一级市场不可能无限输血，而国家战略上又不能没有这个行业。”一位投资人表示，“让二级市场加入，助力产业发展，这某种程度上也是科创板设立的意义。”</strong></p>\n  <p>大型液体火箭的研发和卫星工厂的建设动辄数亿元，一型火箭从立项到首飞往往要数年，绝大多数企业还在持续投入、持续亏损。“如果这个阶段无法上市，头部几家企业的资金也很紧张。”</p>\n  <p><strong>除了解绑二级市场，政府层面也会提供更多燃料。</strong></p>\n  <p>几乎上交所发布指引的同一时间，中国向国际电信联盟新增提交20.3万颗卫星对应的频率与轨道资源申请，创下国内单次申报规模纪录。</p>\n  <p>这场大规模申报，像一场面向未来十年的产业总动员：国家级商业航天引导基金落地，北京、上海、广东、安徽等地设立百亿级产业基金，地方政府用财政补贴、税收优惠吸引项目落地。</p>\n  <p><strong>正如关注商业航天的投资人常说一句话：想象空间很大。</strong>至少从国家层面看，这是必须押注的产业。</p>\n  <p><strong>“今天很多商业航天公司的规模并不大，没发多少东西。”一位投资人表示，“但市场看的不是现在，而是未来。基础设施建成以后，这会是一个完全不同量级的市场。”</strong></p>\n  <p>如果按SpaceX描绘的路线图，可回收火箭大幅降低发射成本、数以万计的卫星完成组网，这只是第一步——铺路。路铺好之后，太空算力、太空旅行、深空探索才成为可能。</p>\n  <p><strong>无论对国家还是参与其中的人，追逐的都不是火箭和卫星本身，而是一个新的太空时代。</strong>它超越当下的生活，代表某种更宏伟的终极梦想，支撑起了SpaceX万亿美金市值。“我们对这个世界必须抱有希望，必须有能够振奋人心的东西。”</p>", "category": "tech", "published_at": "2026-06-13T01:02:18+00:00", "fetched_at": "2026-06-13T02:56:54.598163+00:00", "fingerprint": "87c83f9dbd83833c"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 核心材料成本降至进口材料五分之一，电致变色技术厂商获投，车规级产线建设中", "url": "https://36kr.com/p/3850904887268611?f=rss", "summary": "<p>硬氪获悉，中科电墨近日完成数千万元Pre-A轮融资，由西安龙鼎投资独家投资。本轮融资将主要用于车规级电致变色产线建设、核心材料研发迭代以及汽车领域市场拓展。</p>\n  <p>伴随新能源汽车向智能化、舒适化方向升级，汽车玻璃正从传统结构件逐步演变为集隔热、防晒、隐私保护和交互体验于一体的功能件。尤其是全景天幕快速普及后，调光玻璃开始成为车企提升产品差异化的重要配置之一。</p>\n  <p>目前市场主流调光技术主要包括PDLC（液晶调光）、SPD（悬浮粒子调光）以及EC（电致变色）三种路线。PDLC和SPD主要依靠光散射实现遮蔽效果，普遍存在雾度较高、隔热能力有限、驱动电压较高等问题。而电致变色技术则通过材料发生氧化还原反应，实现玻璃透光率变化，不仅能够实现连续调光，同时具备低雾度、低能耗以及隔绝红外热辐射等优势，被认为是下一代智能玻璃的重要技术路线之一。</p>\n  <p>中科电墨成立于2023年，专注于电致变色核心材料及器件研发。公司首席科学家马明明博士长期从事导电高分子材料研究，于2017年成功研发出相关核心材料体系。通过引入自主设计的导电聚合物材料，中科电墨突破了长期由海外企业主导的关键材料环节，在性能提升的同时显著降低成本。</p>\n  <p><strong>据张莹介绍，目前国际市场高端电致变色导电聚合物材料主要由少数海外企业供应，而中科电墨已实现自主可控，核心材料售价仅为国际同类产品的约五分之一。</strong></p>\n  <p>此外，中科电墨的电致变色产品可实现99%以上紫外线阻隔和99%以上红外线阻隔，并满足汽车15年以上服役寿命要求。响应速度方面，同等尺寸汽车天幕从透明态到深色态的变色时间可缩短至90秒以内，而目前部分量产产品完成同样过程通常需要数分钟。同时，其驱动电压仅需约±1.5V，仅相当于一枚纽扣电池的供电水平，相较部分需要数十伏驱动电压的调光方案，可显著降低整车能耗负担。</p>\n  <p>除了材料创新，中科电墨还在制造工艺上进行了系统优化。</p>\n  <p>传统电致变色产品多采用磁控溅射等工艺路线，设备投入高、生产效率有限，且难以兼顾大尺寸产品制造。中科电墨则开发了卷对卷涂布结合连续真空镀膜的一体化生产工艺，将行业平均良率由约70%提升至92%以上，同时实现综合制造成本下降近30%。</p>\n  <p>商业化方面，汽车是公司当前最重要的战略方向。</p>\n  <p>据介绍，中科电墨已与国内头部车企、新势力品牌以及国际产业链企业展开合作。目前，中科电墨正在浙江嘉兴建设首条车规级智能化柔性产线。一期项目总投资约4000万元，规划年产能约60余万平方米，可满足1至2款车型量产需求。未来三期项目总投资将超过1亿元，并具备天幕、侧窗及光学镜片等多品类产品柔性切换能力。</p>\n  <p>公司预计，随着车规级产线建设完成，汽车业务将在2027年进入规模化量产阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_28fa5f43fba54b9fa4ddd7b92dce257a@5920579_oswg179774oswg629oswg354_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>与此同时，公司也在建筑、消费电子以及特种装备领域同步布局。其中，在建筑领域正参与标杆项目建设及行业标准相关工作；在消费电子领域，公司正推动电致变色技术向AR眼镜、智能眼镜、骑行镜及智能头盔等产品拓展；在特种装备领域，其电致变色膜产品已实现相关应用落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_bf96e0d2667d4a2985ba6461eb7deef5@5920579_oswg153590oswg567oswg379_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>以下为硬氪与中科电墨创始人张莹交流节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：公司的核心竞争力更多来自工艺还是材料？</strong></p>\n  <p><strong>张莹：</strong>材料是最核心的竞争力。我们的首席科学家长期从事导电高分子材料研究，在这一领域积累超过二十年。电致变色本质上是材料科学问题，材料决定了产品的寿命、响应速度、颜色表现以及隔热性能。</p>\n  <p>基于自主研发的导电聚合物体系，我们不仅能够实现99%以上紫外线阻隔和99%以上红外线阻隔，还能够根据客户需求设计不同颜色体系。例如未来汽车出厂时就可以搭载与车身同色的电致变色玻璃，实现从深色到透明的动态变化。此外，</p>\n  <p>此外，我们的核心材料成本仅为国际同类产品的约五分之一，在保证性能的同时显著降低了产业化门槛，具有很大的成本优势。</p>\n  <p><strong>硬氪：目前公司的商业化进展如何？</strong></p>\n  <p><strong>张莹：</strong>汽车是我们最重点布局的市场。目前我们已经与国内车企、新势力品牌以及国际产业链伙伴展开合作，部分项目已经进入样车验证阶段。由于此前没有自有车规级产线，相关产品主要通过合作工厂完成验证，因此当前最大的挑战其实是产能建设。今年我们正在嘉兴建设首条车规级柔性智能产线，并同步按照主机厂审厂标准推进建设，希望在产线建成后能够快速进入量产阶段。</p>\n  <p>除汽车外，我们也在建筑、消费电子和特种装备领域推进落地。例如建筑领域的智能调光幕墙、AR眼镜和智能眼镜等消费电子产品，以及部分特种装备应用场景。预计今年消费电子等业务将贡献近两千万元收入，汽车业务有望在2027年开始形成规模化营收。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>龙鼎投资赵聪先生表示：</strong>电致变色材料是智能调光领域的核心技术，市场空间广阔且符合国家新材料国产化战略。中科电墨团队拥有深厚的技术积累与产业化经验，自主研发的EC技术路线在性能与成本上具备显著竞争优势，商业化落地进度领先行业。我们看好公司在智能汽车、绿色建筑等场景的爆发潜力，未来将充分发挥自身产业链资源与资本赋能优势，在技术研发、产能建设、市场拓展、战略规划等方面提供全方位支持，助力中科电墨快速成长为全球领先的电致变色材料企业。</p>", "category": "tech", "published_at": "2026-06-13T01:04:10+00:00", "fetched_at": "2026-06-13T02:56:54.598150+00:00", "fingerprint": "7951834d79930bf7"}, {"source": "少数派", "title": "WWDC 26 发布会上，Apple 没告诉你的那些事", "url": "https://sspai.com/post/110967", "summary": "除了大谈特谈的 AI，今年的 WWDC 开幕式上还有这些有趣的细节值得注意。<a href=\"https://sspai.com/post/110967\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T03:40:54+00:00", "fetched_at": "2026-06-13T02:56:52.789194+00:00", "fingerprint": "ebf1f52f50bcf284"}, {"source": "少数派", "title": "把 AI 装进口袋，然后把它忘掉：\nYoooClaw C·ONE 智能硬件一个月使用体验", "url": "https://sspai.com/post/110914", "summary": "拿到YoooClawC·ONE，还没拆箱的第一印象是：这也太小了吧，包装盒都比我想象中小了好几倍。打开后，发现C·ONE是一张信用卡大小的紫色超薄哑光卡片，没有屏幕、只有一个长条LED呼吸灯和一个按键 ...<a href=\"https://sspai.com/post/110914\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T06:42:07+00:00", "fetched_at": "2026-06-13T02:56:52.789189+00:00", "fingerprint": "bb3b00d68de46eca"}, {"source": "少数派", "title": "Level Read：让英语学习从「读得懂」开始，每天都进步一点点", "url": "https://sspai.com/post/110329", "summary": "你不需要一开始就读最难的内容，不需要把英语变成一件很痛苦的任务。每天读一篇适合自己难度的英文新闻，听一听、查几个词、慢慢积累。<a href=\"https://sspai.com/post/110329\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T07:00:00+00:00", "fetched_at": "2026-06-13T02:56:52.789184+00:00", "fingerprint": "ab6f9ed0f64c521f"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/110992", "summary": "📅本周新预告《攻壳机动队THEGHOSTINTHESHELL》新预告6月11日，TV动画《攻壳机动队THEGHOSTINTHESHELL》发布了新预告，将于7月7日开始播出。木村翔马执导，圆城塔编剧， ...<a href=\"https://sspai.com/post/110992\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T09:39:21+00:00", "fetched_at": "2026-06-13T02:56:52.789174+00:00", "fingerprint": "b60e25b59abda56e"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7573 CNY ↑+0.31%", "url": "https://www.frankfurter.app/2026-06-12?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-06-12</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7573 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0147 (+0.31%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-06-13T02:56:51.357268+00:00", "fingerprint": "670284bd114ab361"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
