strong>；因此，美债利率的大幅上行，表明美债价格出现了大幅下挫。从基本面来看，本轮美债利率上行主要受资本市场供需格局的驱动；同时，通胀抬头、货币政策预期收紧等因素亦起到了重要的推动作用。</p>\n  <p>首先，<strong>美国政府的财政扩张及其带来的国债放量发行，是本轮美债长端利率上行的根本性原因</strong>。过去20年，美债总规模持续膨胀，截至2025年末已高达37.6万亿美元，是2000年的5.7万亿的6.6倍；尽管在2020年疫情发行高峰后，美债供给的年增幅回落至近20年以来的中位数水平，但在高基数下，美债实际的规模扩张依然十分迅猛。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_e532f8e0629a4088bc5c9f473cc7fd8b@5426566_oswg23861oswg948oswg650_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：美债总规模与同比增速；资料来源：wind，36氪</p>\n  <p>与此同时，美国财政受减税、刚性支出比例较高等因素的影响，美债的供给预期不弱，也在一定程度上推升了美债利率。<strong>从资产定价的逻辑来看，美债供给量的持续增长，对市场资金产生了明显的稀释作用，美债供给预期的上升，则进一步加剧了美债市场供需失衡的压力。</strong></p>\n  <p>再从需求端来看，美债的主要买家是外国官方机构与美联储，而且近年来美债买家结构的显著变化，放大了美债的价格波动。对于外国官方机构而言，在美国主权信用走弱的背景下，一部分资产配置需求从美债转向黄金、非美主权债券等资产；同时，美联储在上一轮加息周期持续缩表后，减持了大量的美债，沃什上任后若继续缩表，将进一步减持美债。</p>\n  <p>随着美债两大传统买家的持有量显著回落，美债的承接需求不得不大幅转向资本市场中的金融机构，比如银行、养老金、对冲基金、保险等。鉴于不同类型机构对投资收益、风控指标、汇兑成本、投机空间等要素的偏好与容忍度皆有不同，<strong>当商业化主体成为美债重要的接盘方，美债市场的投资策略趋于多元化，美债利率的波动加大也是意料之中的事儿。</strong></p>\n  <p>值得注意的是，<strong>AI链资本开支扩张掀起的一轮发债潮，构成了驱动美债利率上行的一大边际力量</strong>。公开资料显示，亚马逊、Alphabet、Meta、微软、甲骨文五家科技巨头2025年发行的信用债总额超过了1200亿美元；截至2025年10月，AI相关的债券规模已高达1.2万亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_2450bb79ea294784af0ceae7c194cefa@5426566_oswg48249oswg1080oswg611_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：大厂AI相关债务规模；资料来源：华福证券，36氪</p>\n  <p>当前的美债持有人结构中，金融机构占据重要地位，机构投资者与外国官方机构、美联储等美债的传统买家相比，配置需求更偏向投资收益与投机。因此，在AI发债潮的影响下，大批兼备优质信用与高收益的信用债涌入债券市场，与美债形成了一定的竞争关系，故而在有限范围内对美债形成了挤出效应，在边际上推动了美债利率的上行。</p>\n  <p>在宏观与政策层面，<strong>美债长端利率高企本质上反映的是通胀抬头与货币政策收紧预期</strong>。当前美国通胀距离政策目标仍有差距，而且今年以来的通胀反复抬头显示出的韧性，推升了长端利率包含的通胀风险溢价，而美联储货币政策紧盯通胀与就业的双目标制，以及沃什偏鹰的政策倾向，均指向市场正对远期通胀路径与货币紧缩风险进行了再定价。</p>\n  <h2><strong>02 美债利率走高对AI链将产生哪些影响？</strong></h2>\n  <p>就收益率曲线的形态而言，近期美债长端利率冲高推动收益率曲线走向陡峭化；短端利率方面，基于当前沃什偏鹰派的政策取向，短端利率未来依然面临不小的上行压力。一旦加息预期兑现，短端利率将快速上行，驱动收益率曲线转向平坦化，即由所谓的“熊陡”切换到“熊平”。</p>\n  <p>在加息周期中，美债长短端利率双双高企、收益率曲线平坦化，将导致全球无风险定价之锚的中枢出现系统性抬升，由此产生的高利率环境与偏紧的货币政策，将导致全球股票市场集体承压，特别是以AI链为代表的科技股，其持续研发投入与资本开支对融资环境的变化更加敏感，因此受到的影响亦将更加显著。</p>\n  <p>回顾历史，2006~2007年次贷危机爆发前夕，美债收益率曲线在相当长的时间里非常平坦，尽管利率高企与收益率曲线平坦对股市带来了一定的估值压力，但股市真正的调整则发生在危机爆发之后。由此可见，利率高企并非股市转熊的触发器，其核心影响在于持续对股票市场施加估值压力：不仅削弱了高估值资产的性价比，也会更容易刺破拥挤交易，加剧资产价格的波动。</p>\n  <p>再看本轮的AI链牛市，热点主要集中在硬件方面，当前相关企业强劲的业绩与整体向好的预期，是本轮结构性牛市的基本面基础。然而，基于上述论述，美债利率走高对相关标的带来的估值压力难以避免。尤其是存储板块，在前期积累了可观收益与交易一度极端拥挤的背景下，<strong>利率因素导致的估值压力上升是诱发近期行情阶段性调整、获利回吐的重要因素之一。</strong></p>\n  <p>从资产定价的底层逻辑来看，当前AI链所面临的考验与2007年次贷危机前夕局面有着极高的相似性：次贷危机的爆发，始于居民租金的收益率难以支撑美国的高房价泡沫（持有成本）；如今，AI巨头投入天量资本开支，同样依赖下游商业化兑现来实现投资回报的闭环。</p>\n  <p>目前，Anthropic的ARR（年度经常性收入）增长斜率已经明显放缓，这意味现金流无法覆盖高杠杆债务与高估值的矛盾已经开始显现，而利率高企会进一步加剧这两大矛盾。未来，市场可能会依据ARR放缓来重新评估资本开支的力度；<strong>而股票投资者出于次贷危机带来的心理阴影，对AI链相关企业的估值重估则已经反映在当前的资产定价之中了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_de0a47e9141648b9ac9121981b1cb221@5426566_oswg165089oswg1080oswg618_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：OpenAI与Anthropic的ARR；资料来源：国金证券，36氪</p>\n  <p>此外，美债利率走高也将进一步改变AI大厂的财务行为。为支撑巨额资本开支，大厂们在利率进一步冲高的时间窗口前集中发债、锁定利息是明智之举。受其影响，天量信用债在短期内集中涌入债券市场，挤占了市场存量流动性，加剧了长端利率居高不下的态势，其结果是最终抬高了宏观层面的长期融资门槛，AI链亦将难逃其苦。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-08-19T06:20:35+00:00", "fetched_at": "2026-08-20T00:57:33.755075+00:00", "fingerprint": "e14c37bea564ff29"}, {"source": "36氪 - 最新文章", "title": "36氪研究院 | 2026年中国商业航天产业发展研究报告", "url": "https://36kr.com/p/3946102154951813?f=rss", "summary": "<p>当前，商业航天已成为各国科技竞争的核心赛道，也是中国战略性新兴产业中增长最为活跃的领域之一。经过十余年的产业发展，中国商业航天正从技术验证期迈向规模化运营期。政策层面，商业航天已连续多年被写入政府工作报告，2026年政府工作报告进一步将航空航天纳入“新兴支柱产业”。技术层面，2026年7月10日，长征十号乙完成全球首次海上网系回收验证；2026年8月19日，蓝箭航天朱雀三号遥二成功实现我国首款运载火箭一子级陆地回收试验，推动可重复使用火箭技术加快迈入工程验证深化阶段。与此同时，卫星柔性产线陆续投产，单星制造成本与周期持续下降，产业基础能力稳步夯实。市场层面，卫星遥感、卫星通信等服务已在城市精细化管理、应急服务和公共服务等B/G端场景实现较为深入的应用，并在手机直连卫星、汽车直连卫星等消费领域加速拓展。然而，产业仍面临诸多结构性挑战：运载能力与批产效率等相较国际头部企业仍有差距，核心部件国产化率有待提升，频轨资源“先占先得”的规则进一步放大了产业发展的紧迫性。</p>\n  <p>在此背景下，36氪研究院发布《2026年中国商业航天产业发展研究报告》，系统梳理产业发展脉络与生态格局，深度解析产业链上下游的发展动向，构建涵盖发展潜力、创新能力、商业化能力与资本化能力的四维企业评价体系，并结合典型企业实践，系统研判行业未来发展趋势，旨在为行业参与者提供相对客观、系统、前瞻的研究参考。</p>\n  <h2><strong>中国商业航天由探索验证迈入规模化发展阶段，产业规模与核心能力持续突破</strong></h2>\n  <p>在政策、技术、需求三重驱动之下，中国商业航天产业规模快速增长。根据赛迪数据，2025年中国商业航天市场规模达2.83万亿元，同比增长21.7%，2026年预计将突破3.5万亿元。产业链各环节实现多点突破：火箭发射能力持续提升，根据国家航天局数据，2025年商业发射达50次，创历史新高；卫星制造从“定制化”向“工业化”转型，国内部分头部企业年产能已达百颗级，规模化制造能力初步形成；千帆星座与GW星座加速组网，卫星互联网进入批量部署阶段。全球竞争格局呈现以中美为核心的双极态势，中国依托多元技术路线并行探索，加速缩小与美国的技术差距，并以独特的产业模式与制度优势，加快构建具有国际竞争力的商业航天产业体系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_6560e4b022604f5d88835ffe22751430@6292127_oswg36977oswg1083oswg394_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>中国商业航天产业正加快形成核心部件自主供给、航天器规模交付与卫星应用协同发展的产业生态</strong></h2>\n  <p>商业航天产业链各环节正协同推进。上游核心部件正从单件突破走向国产化、标准化与批量供给：液体火箭发动机供给进入专业化产线建设阶段，航天电子器件实施分级替代策略，复合材料与增材制造推动航天器轻量化，通信载荷与用户终端向高集成、低功耗方向发展。中游环节聚焦规模化交付能力建设：可重复使用火箭技术取得实质性突破，长征十号乙完成全球首次海上网系回收，朱雀三号遥二成功完成我国首款运载火箭一子级陆地回收试验，工程验证重点正从单次回收向回收子级复飞与高频运营延伸；卫星制造加速向标准化、模块化与柔性产线转型；海南商业航天发射场常态化投用，单工位周转效率持续提升，为高频次发射提供基础设施保障。下游应用端，低轨卫星互联网进入持续组网阶段，规模部署正带动星箭场协同扩容；北斗高精度服务向终端、平台与运营体系延伸，已在精准农业等垂直场景实现规模化应用；遥感服务供给持续扩张，AI智能解译大幅提升数据应用效率，大规模星座为遥感服务跨行业复制和商业化运营提供基础。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_a71814e8e3554d5889074d88a23813d4@6292127_oswg74166oswg1083oswg512_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>国家队与民企多主体竞合格局加速成型，资本与产业资源向头部城市和企业集中</strong></h2>\n  <p>商业航天市场参与者加速涌入，国家队与民营企业协同创新，形成“国家队引领、民企深耕”的多主体竞合共生格局。区域层面，京津冀、长三角、大湾区、西部四大产业带与特色产业集群功能互补，初步形成从研发制造到应用服务的空间框架。资本市场方面，一级市场融资持续活跃，据相关统计，2026年上半年融资总额超150亿元，资金高度集中于火箭发射与卫星制造赛道，并加速向头部城市及企业集中。同时，国资参与度在过去一年从41%跃升至59.8%，成为一级市场重要资金来源。二级市场方面，随着IPO政策窗口明显拓宽，商业航天企业资本化进程提速，产业梯队分化进一步加剧。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_1b6692a68b9146cb9595ffea08eafe33@6292127_oswg216432oswg1168oswg813_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>“4+15+27”评价体系推动企业竞争力走向量化验证</strong></h2>\n  <p>36氪研究院针对商业航天高技术壁垒、长周期投入、强资本驱动的产业特征，构建了覆盖发展潜力、创新能力、商业化能力与资本化能力四个维度的“4+15+27”企业竞争力评价指标体系（即4个一级指标、15个二级指标、27个三级指标）。指标体系遵循全面性与聚焦性并重、行业特征与分类可比兼顾、标准化与可验证兼顾、现实表现与前瞻价值结合四项原则，旨在以量化方式呈现企业的综合竞争力、能力结构与发展阶段，为产业研究、企业对标、投资判断和政策评估提供相对统一的分析框架。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_fa89d68ad1ed4c44a1d1c69c77c000f6@6292127_oswg82362oswg1067oswg1523_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>未来，太空算力、在轨服务与制度完善将共同拓展商业航天产业边界</strong></h2>\n  <p>中国商业航天产业正沿算力扩容、业态升级与产业成熟三大方向演进。太空智算将推动部分数据处理任务由地面前移至卫星端，未来卫星可在轨完成数据筛选、目标识别和智能推理，有效缩短遥感监测和应急响应链路，提高星地通信资源的利用效率。返回式实验平台有望在短期内率先形成商业化服务能力；中期来看，随着星座资产扩张，在轨检查、燃料补加、部件维修与碎片清除等专业服务需求将持续释放；长期而言，商业载人活动与地外资源利用将进一步拓展太空经济边界。未来，商业航天将形成覆盖技术研发、生产试验、发射运行和数据应用的全生命周期治理体系，公共试验和中试平台将降低企业技术验证门槛，国际化运营将进一步扩大商业航天软基础设施的能力边界，中国有望形成具有全球影响力的商业航天发展路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_856c4480e73e49f998f15c6ba89852e7@6292127_oswg79170oswg1132oswg534_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>本报告就如下重点问题进行研究：</strong></p>\n  <ul>\n   <li>中国商业航天产业经历了怎样的发展路径？当前处于何种发展阶段？</li>\n   <li>推动中国商业航天产业发展的核心驱动力有哪些？</li>\n   <li>全球商业航天竞争格局呈现怎样的态势？中美之间的技术差距与差异化发展路径体现在哪些维度？</li>\n   <li>商业航天产业链上游、中游、下游各环节分别呈现哪些结构特征与发展新动向？</li>\n   <li>核心部件国产化、火箭回收复用、卫星批量制造等关键领域取得了哪些突破？面临哪些瓶颈？</li>\n   <li>中国商业航天的市场格局呈现怎样的特征？产业区域分布呈现怎样的空间格局？</li>\n   <li>商业航天一级市场融资结构与资本流向呈现哪些变化？</li>\n   <li>商业航天企业IPO的驱动因素有哪些？当前资本化进程呈现怎样的特征？</li>\n   <li>“4+15+27”评价体系如何刻画商业航天企业综合竞争力？有哪些典型代表性企业？</li>\n   <li>面向未来，中国商业航天产业将沿哪些方向演进？商业航天产业边界如何拓展？</li>\n  </ul>\n  <p>&nbsp;</p>\n  <p>更多精彩内容，详见《2026年中国商业航天产业发展研究报告》，点击<a href=\"https://pan.baidu.com/s/1nW8lNjWRZ5vswUCkraZoxA?pwd=gjxw\" rel=\"noopener noreferrer\" target=\"_blank\">下载链接</a>，提取码：gjxw</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_7efd7411aaba45e3878d0ac209b151a5@6292127_oswg5584102oswg3570oswg5052_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_821ccfa62abd4baeb739f1722fef59c7@6292127_oswg1680488oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_3b619dc855eb469aa90cbfd8b4f17386@6292127_oswg611920oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_8a3eabbcfd5f4ddd94e3d17fa4db466a@6292127_oswg395434oswg3570oswg5052_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_12ad88225248412cbce3f3ebb53ffa24@6292127_oswg1499830oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_21956757d6fc40bc98b8db394c6a7285@6292127_oswg2062683oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_5feb3f3cb9b14dc8a15cb041be7e3441@6292127_oswg2085186oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_9b3c23763e1c4f249b25ae9776e9381a@6292127_oswg2001830oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms https://img.36krcdn.com/hsossms/20260819/v2_e192e9bcd40d4843a337beb3c5cc9e56@6292127_oswg1707100oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_db7d73d9b7c64bc799c3099b3f3c834b@6292127_oswg1802146oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_ed0a452387284da38dfc52f9e4c1b861@6292127_oswg1436871oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_cd9efcb918b04f64829cc003d2d56f2c@6292127_oswg1003787oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_dd2b3f53f17c40a684c118bdaabd7e68@6292127_oswg518191oswg3570oswg5052_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-08-19T08:30:00+00:00", "fetched_at": "2026-08-20T00:57:33.755069+00:00", "fingerprint": "021518f9dc639184"}, {"source": "36氪 - 最新文章", "title": "从矿山到动力电池｜清研精准第二个具身智能垂类中试场景落地", "url": "https://36kr.com/p/3946264412339335?f=rss", "summary": "<p>开展首日，清研精准将动力电池真实生产场景“搬到”展会现场，集中呈现汽车电池包接插件插拔、零部件抓取与装配等典型任务。这是继榆林矿用场景之后，清研精准落地的第二个具身智能垂类中试场景，标志着其工程化能力开始从矿山向汽车与新能源制造领域跨场景复制。目前，该场景已在某头部动力电池厂商实现规模化数据采集，并打通从真实数采、数据治理、仿真验证到模型训练与真机应用的完整闭环。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_9ef8bd54b9a14041a5e02a00c8c0827d@5284654_oswg997626oswg1271oswg708_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">|清研精准已在头部动力电池厂实现真实场景规模化落地</p>\n  <h2><strong>01聚焦动力电池，还原真实工业任务</strong></h2>\n  <p>现场设置动力电池场景落地展示、虚拟仿真互动体验、跨场景复刻与实景实训三大板块。观众可以近距离观察机器人执行接插件插拔、零部件抓取与装配，也可以通过虚拟仿真了解真实任务如何被数字化复现，以及机器人操作能力如何从数据采集、虚拟训练逐步走向真机执行。</p>\n  <p>此次展示并非单一的机器人动作演示，而是对具身智能进入真实工业场景所需完整能力链条的集中呈现。</p>\n  <h2><strong>02从数据到真机的工程闭环</strong></h2>\n  <p>在动力电池场景中，清研精准重点展示了五个方面的能力：</p>\n  <p>一是<strong>真实场景数据采集与处理能力</strong>。围绕电池包接插件插拔、零部件抓取与装配等任务，采集操作过程、场景环境和物体状态等数据，并完成数据清洗、整理与后处理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_d20571e4800d44e4a81c4f0cf27f547e@5284654_oswg1009450oswg1268oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片2</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_5bd9d8e4a1d747cbbceab78703e2e44a@5284654_oswg1233696oswg1268oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片3</p>\n  <p>二是<strong>数字孪生与场景复刻能力</strong>。将真实设备、工序和操作对象映射到虚拟环境，在数字空间中复现动力电池典型任务，为机器人训练和验证提供基础。</p>\n  <p>三是<strong>仿真推演与虚实同步验证能力</strong>。通过虚拟仿真扩展不同任务状态和操作条件，并将虚拟环境中的训练结果与真机操作进行对照，持续识别和缩小虚实差异。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_e1a4196cce3f44c0835d7a0900cf0025@5284654_oswg601989oswg1725oswg654_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片4</p>\n  <p>四是<strong>灵巧操作与动作映射能力</strong>。通过操作数据采集及与三指灵巧手的同步映射，推动机器人完成接近、对位、抓取、插拔和装配等连续动作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260819/v2_146d311134c84abea475b48f7077adc2@5284654_oswg1127749oswg1268oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图5</p>\n  <p>五是<strong>中试验证与现场接管能力</strong>。在进入实际生产环境前，对数据、模型、设备和任务流程进行反复训练与评测，再将经过验证的能力接入真机，并根据执行结果持续迭代。</p>\n  <h2><strong>03从第一站到第二站，验证跨场景复制能力</strong></h2>\n  <p>此前，清研精准首个具身智能垂类中试场景已在榆林矿用场景落地，形成从真实数据采集、数据治理、仿真训练、中试验证到现场部署的工程闭环。</p>\n  <p>此次动力电池场景落地，是清研精准对这套工程化能力的再次验证。从矿山到动力电池，作业环境、操作对象和具体工序发生了变化，但背后的落地路径保持一致：从真实产业需求中选择任务点，完成场景与设备标定，采集真实操作数据，开展数据治理、仿真验证，再将经过训练与评测的能力接入真机，并通过现场反馈持续迭代。</p>\n  <p>清研精准所强调的“跨场景复制”，并不是将同一个模型不经适配直接应用于不同产业，而是复用已经形成的数据工具、仿真平台、中试流程和工程经验，再根据新的场景与任务完成针对性适配和验证。</p>\n  <h2><strong>04持续建设工业具身智能基础设施</strong></h2>\n  <p>清研精准由清华大学孵化，是一家面向具身智能垂类场景规模化落地的物理AI企业。依托八年来在自动驾驶、新能源及工业领域的数据积累与工程实践，公司构建了“具身数据引擎、场景仿真验证工具链、垂类世界模型”三位一体的核心能力，贯通真实数采、数据治理、合成数据、仿真推演、验证评测与模型迭代全链路。</p>\n  <p>目前，清研精准解决方案已落地全球30多个国家，覆盖新能源整车、动力电池、储能、核心零部件、矿山、电力等领域，深度服务百余家头部企业。</p>\n  <p>从首个矿用场景到第二个动力电池场景，清研精准正在通过一个个真实垂类场景，持续验证具身智能工程化落地与跨场景复制能力，推动机器人从算法和演示走向真实工业任务。未来，公司将持续完善工业具身智能基础设施，构建“一套底座、一个模型、百个垂类场景应用”的物理AI体系，加速具身智能在更多产业场景中的规模化、产业化落地。</p>", "category": "tech", "published_at": "2026-08-19T09:48:10+00:00", "fetched_at": "2026-08-20T00:57:33.755063+00:00", "fingerprint": "f180ae83afb0cd8e"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜台积电先进封装CoWoS产能供不应求，订单爆满；小米新一代人形机器人剧透：双足、1.7米左右、全身66个自由度；《全民医疗保障“十五五”规划》发布", "url": "https://36kr.com/p/3946071336287361?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3946136565890185\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>消息称三星电子目标今年9月率先完成1d nm DRAM内存研发</strong></a></p>\n  <p>据TheBell，近日，据业内人士透露，三星电子目标2026年9月率先完成1d nm DRAM内存研发，2026年12月进入量产转移阶段，2027年上半年启动生产线建设，有望2027年底实现首批量产。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3946045509336193\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>台积电先进封装CoWoS产能供不应求，订单爆满</strong></a></p>\n  <p>据台湾经济日报报道，台积电先进封装CoWoS产能供不应求，订单爆满。传先进封装后段部分订单外溢到英特尔旗下马来西亚厂，以部分产能合作支持，服务共同大客户，打破过往生态系惯例。除了有利台积电前段先进制程出货，法人也看好，与两大业者重叠的供应链日月光投控、载板龙头欣兴、家登集团等可望同步沾光。业界8月18日指出，全球先进封装产能瓶颈在后段放量速度低于前段制程，预期台积电对更多供应厂商加入后段的产能乐见其成，可让前段制程加速出货。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3946069994208385\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>鸿海加码越南、墨西哥子公司，或扩增CPO、AI服务器产能</strong></a></p>\n  <p>据台湾经济日报，鸿海昨日公告，增资越南子公司3.584亿美元（约新台币114.75亿元），外界推测是扩增CPO产能；同步公告增资墨西哥子公司4.6亿墨西哥披索（约新台币8.59亿元），外界推测主要是扩增AI服务器产能。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3946084542545283\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>小米新一代人形机器人剧透：双足、1.7米左右、全身66个自由度</strong></a></p>\n  <p>从小米方面了解到，小米即将首次展示的下一代人形机器人身高约为1.70米，体重66公斤，全身有66个自由度，其中一半自由度集中在手部。目前，该款机器人为样机阶段，国内首展后会在欧洲展出。2022年，小米发布全尺寸人形机器人“铁大”，比特斯拉Optimus原型机亮相早了近两个月。铁大身高1.77米，体重52公斤，拥有21个关节自由度。此后小米少有机器人方面的消息露出。（每经网）</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3946082910125446\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Cerebras推出CS-4系统对标英伟达，称其推理速度可达GPU服务器的30倍</strong></a></p>\n  <p>AI芯片公司Cerebras System于当地时间周二发布了全新机架式AI系统CS-4，该公司称，CS-4系统在单用户场景下，每秒输出token的能力可达传统GPU服务器的30倍。Cerebras CS-4内置3颗WSE-3 Turbo晶圆级处理器。公司表示，WSE-3 Turbo是迄今为止规模最大的AI处理器，集成了4万亿个晶体管。业内指出，这套系统面向AI推理，而非模型训练。它采用静态随机存取存储器（SRAM），而非行业常用的动态随机存取存储器（DRAM）。（财联社）</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3946121529408899\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>AI芯片创企Etched融资7亿美元，近一个月估值翻番至210亿美元</strong></a></p>\n  <p>当地时间8月18日，AI芯片创企Etched宣布完成7亿美元新一轮融资，公司估值达210亿美元。本轮融资由简街领投，凯鹏华盈、红杉资本、a16z、Tiger Global、贝恩资本风险投资公司、Neo、Primary、Stripes、Positive Sum和黑石等跟投。Etched同时宣布简街成为其首位客户。此前，Etched在上月完成C轮融资，当时公司估值为103亿美元。（界面）</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3946008105614472\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>北京火箭大街商业航天智能测运控中心正式启用</strong></a></p>\n  <p>36氪获悉，据北京亦庄微信公众号消息，8月19日，朱雀三号重复使用运载火箭在东风商业航天创新试验区成功将“鸿鹄03星”送入预定轨道，并完成我国首次运载火箭一子级陆地支腿回收。在距离发射场1000多公里的北京亦庄，全国首个开放式商业航天测运控共享平台——北京火箭大街商业航天智能测运控中心于当天正式启用，并开展了此次历史性发射任务的全过程星、箭测控，实现了“亦庄箭、亦庄星、亦庄测”。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3945921710636419\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>《全民医疗保障“十五五”规划》发布</strong></a></p>\n  <p>国家医保局今天（19日）发布《全面医疗保障“十五五”规划》。“十五五”期间基本医疗保险参保率每年保持在95%左右；长期护理保险制度覆盖所有统筹地区；基本医疗���险目录内住院费用基金支付比例职工基本医疗保险稳定在80%左右，城乡居民基本医疗保险稳定在70%左右；即时结算基本医疗保险基金支出覆盖率从2025年的70%左右提高到80%以上；所有统筹地区将实现生育津贴直接发放到个人。（央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3945901753187463\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>嫦娥七号计划近日择机实施发射，器箭组合体完成垂直转运</strong></a></p>\n  <p>嫦娥七号探测器和长征五号遥十四运载火箭在中国文昌航天发射场完成技术区相关工作，器箭组合体19日上午垂直转运至发射区。据中国载人航天工程办公室介绍，嫦娥七号探测器、长征五号遥十四运载火箭分别于4月、7月运抵发射场，先后完成了总装、测试等准备工作。目前，发射场设施设备状态良好，后续将按计划开展发射前各项功能检查、联合测试、推进剂加注等工作，计划近日择机实施发射。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3946176175422848\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>上海：推进第六代移动通信技术（6G）试��网实现智能协同并部署商用</strong></a></p>\n  <p>36氪获悉，上海市人民政府办公厅印发《上海市“数字上海”建设“十五五”规划》。其中提出，加快推动“双万兆城市”建设，推动50吉比特无源光网络在重点场景规模部署，增强型第五代移动通信技术（5G-A）实现中心城区及郊区重点区域覆盖，300米以下低空公共航路实现移动通信网络全线覆盖，率先规模部署通感一体基站。推动海域网络实现近海30公里第五代移动通信技术（5G）覆盖，探索“基站上船”“船间中继”模式。推进卫星互联网实现“千帆星座”规模组网并部署商用。推进第六代移动通信技术（6G）试验网实现智能协同并部署商用。规模部署低空智联网、城市物联网。加快量子通信技术研发和设施布局。深化互联网第六版协议技术（IPv6）创新和融合应用。</p>", "category": "tech", "published_at": "2026-08-19T12:08:59+00:00", "fetched_at": "2026-08-20T00:57:33.755054+00:00", "fingerprint": "a62e8d14d61d7867"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨买火车票放零食被要求让座，12306回应；宇树科技上市庆功照流出；章子怡套现3个亿", "url": "https://36kr.com/p/3947086287158404?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>智谱：GLM-5.3 API即日起正式上线</li>\n   <li>宇树创始人王兴兴身家超1300亿</li>\n   <li>2026七夕档票房破亿</li>\n   <li>迪士尼与旗下美国广播公司起诉美联邦通讯委员会</li>\n   <li>比尔盖茨名下豪华度假村因维护不善面临1亿美元索赔</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>2个人买3张火车票放零食占座，被无座乘客要求让座，12306回应</strong></p>\n  <p>8月18日，据媒体报道，两个小女孩买了三张火车硬座票，旁边的一名无座女乘客想坐，商量无果找来列车员调解。女乘客：“大家都在一个车上，互相体谅对不对。”列车员：“座位是她们的，跟我说没用。” 随后，“买票占座放零食这座位能让吗”话题登上热搜，引发关注热议。部分网友表示，买了票不让也正常，也有部分网友疑惑：2个人买3张票，不是本人座位是否有处置权？</p>\n  <p>8月19日，万维视频致电12306官方热线，接线工作人员表示，正常情况下1个人只能买1张票，因此此类情况需看该座位车票是不是本人名下的，如是本人名下的，则需要依据本人意愿协商处理。针对网友疑惑的2人买3张票是否有处置权的问题，该工作人员进一步解释称，乘客购买了几个人的车票，那么这几张票都是属于购票者范畴内的，其他人要使用座位的话，也需要征求本人同意的。（万唯视频）</p>\n  <p><strong>宇树科技上市庆功照流出，“投资教父”沈南鹏、王力宏露面</strong></p>\n  <p>8月19日，“A股人形机器人第一股”宇树科技正式在科创板挂牌上市。截至当日收盘，宇树科技涨460.34%，报845元/股。上市后，宇树科技举办上市后答谢午宴。据了解，宇树科技董事长王兴兴、中国“投资教父”沈南鹏以及歌手王力宏露面。流出的现场照片显示，王力宏坐1号桌，并与沈南鹏相谈甚欢。目前，宇树科技对此暂无回应。红杉中国通过宁波红杉、厦门雅恒合计持有宇树科技2589.95万股，发行后持股比例为6.4%。以当日收盘价市值3417.72亿元计算，其持有市值约219亿元。（新浪科技）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_0c6d6d877f06487682ed9abfc6860d03@1200352198_oswg667392oswg690oswg789_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：新浪科技</p>\n  <p><strong>章子怡套现3个亿</strong></p>\n  <p>4年间，演员章子怡投的几百万，变成了3个亿。8月11日晚间，港股上市公司上美股份（02145.HK）发布公告，拟通过全资附属公司上海青道收购上海怡页生物科技有限公司合计29%的股权，交易总代价约3.84亿元。其中，知名演员章子怡控股的共青城大脚投资合伙企业（有限合伙）出售所持上海怡页23%股权，对价约3.045亿元；上美股份副总裁刘明出售所持6%股权，对价约7943.96万元。</p>\n  <p>据天眼查信息，共青城大脚投资合伙企业 (有限合伙) 成立于2018年，位于江西省九江市，是一家以从事商务服务业为主的企业。企业注册资本300万人民币。大脚投资由章子怡持股99%、其父章元孝持股1%。此次交易完成后，上美股份对上海怡页的直接持股比例将由51%提升至80%，章子怡仍保留约6%股权，刘明保留5%股权。上美股份在公告中明确，交易完成后，大脚投资仍持有上海怡页约6%股权，章子怡品牌联合创始人身份不变，并继续担任“newpage 一页”品牌代言人。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic业绩反超OpenAI，增速远超行业预期</strong></p>\n  <p>OpenAI的增长势头正遭遇严峻考验。这家ChatGPT的开发商二季度收入环比增幅仅为18%，不仅令部分投资者失望，更在与竞争对手Anthropic的对比中相形见绌——后者同期收入不仅超过OpenAI，增速更是远超行业预期。</p>\n  <p>8月19日，据华尔街日报援引知情人士报道，OpenAI二季度收入为67亿美元，较一季度的57亿美元增长18%，与此同时运营亏损进一步扩大，令公司在备受期待的IPO前景上蒙上阴影。相比之下，Anthropic同期收入超过115亿美元，不仅环比增幅逾140%，更是首次在季度收入上超越这家成立更早的竞争对手，并实现小幅运营盈利。ChatGPT增长放缓、Anthropic旗下编程工具Claude Code大获成功，正迫使OpenAI重新审视其商业策略并重组管理团队。OpenAI方面则向投资者表示，随着7月份一批新模型的发布，公司增速已在三季度有所回升。（华尔街见闻）</p>\n  <p><strong>Cerebras推出CS-4系统对标英伟达，称其推理速度可达GPU服务器的30倍</strong></p>\n  <p>AI芯片公司Cerebras System于当地时间8月18日发布了全新机架式AI系统CS-4，该公司称，CS-4系统在单用户场景下，每秒输出token的能力可达传统GPU服务器的30倍。Cerebras CS-4内置3颗WSE-3 Turbo晶圆级处理器。公司表示，WSE-3 Turbo是迄今为止规模最大的AI处理器，集成了4万亿个晶体管。业内指出，这套系统面向AI推理，而非模型训练。它采用静态随机存取存储器（SRAM），而非行业常用的动态随机存取存储器（DRAM）。（财联社）</p>\n  <p><strong>智谱：GLM-5.3 API即日起正式上线</strong></p>\n  <p>36氪获悉，据智谱消息，GLM-5.3 API 8月19日起正式上线。模型擅长复杂编码、防御性网络安全以及长程任务。目前，GLM-5.3已接入ZCode等编码平台，并纳入GLM Coding Plan。API已开放调用，定价与GLM-5.2保持不变。模型权重将于下8月28日开源。</p>\n  <p><strong>美国多州收紧数据中心建设，AI扩张面临监管压力</strong></p>\n  <p>美国宾夕法尼亚州州长乔什·沙皮罗发布行政命令，对数据中心建设实施严格限制，要求项目先获得地方政府批准，才能申请州级许可，并需遵守节水标准、承担新增用电成本及解决自身电力供应问题。沙皮罗表示，大量数据中心项目涌入宾州，其中部分开发商忽视当地社区利益。随着AI投资快速增长，美国多州开始限制数据中心扩张，以应对电力、环保和社区压力。纽约州已推动大型数据中心环境许可最长暂停一年；长期支持数据中心发展的得州州长格雷格·阿博特也暂停部分新项目审批并展开审查。（新浪财经）</p>\n  <p><strong>OpenAI在模型逃逸入侵事件后暂停强化训练两周，并公布新的安全措施</strong></p>\n  <p>OpenAI8月18日表示，在7月份其AI模型从受控测试环境中失控并入侵人工智能公司Hugging Face及其他四个未具名服务的系统后，已暂停了部分AI训练工作两周。该公司还公布了新的操作规范，称此举旨在防止未来训练过程中出现AI模型失控的情况。该公司表示，部分AI训练工作——包括其“计划中规模最大的前沿强化学习训练”——目前仍处于暂停状态，而小规模的训练和评估仍在继续。同时，其他面向客户的产品研发和相关工作也在持续推进。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>宇树创始人王兴兴身家超1300亿</strong></p>\n  <p>8月19日，宇树科技正式登陆科创板，开盘大涨629.44%报1100元/股，总市值达4449亿元。以150.80元/股的发行价计算，中一签可赚47.46万元。 招股书显示：创始人王兴兴直接持股21.43%，通过员工持股平台间接持股9.84%，合计31.29%。以此计算，创始人王兴兴身家超1300亿元。（每日经济新闻）</p>\n  <p><strong>梁文锋打新宇树科技浮盈11亿</strong></p>\n  <p>8月19日，宇树科技正式登陆科创板，开盘大涨629.44%报1100元/股，总市值达4449亿元。以150.80元/股的发行价计算，中一签可赚47.46万元。此次作为“杭州六小龙”之一的宇树科技上市，背后股东可谓明星云集。梁文锋旗下深度求索、幻方量化和九章资产通过战略配售、网下打新合计获配约119.16万股。以发行价计算，梁文锋打新宇树科技浮盈超11亿元。（中新经纬）</p>\n  <p><strong>雷军打新宇树科技狂赚152亿</strong></p>\n  <p>8月19日，宇树科技正式登陆科创板，开盘大涨629.44%报1100元/股，总市值达4449亿元。以150.80元/股的发行价计算，中一签可赚47.46万元。此次作为“杭州六小龙”之一的宇树科技上市，背后股东可谓明星云集。经梳理发现，雷军创办的顺为资本关联方Astrend IV持有1610.6万股，浮盈超152亿元。（中新经纬）</p>\n  <p><strong>美股三大指数集体收涨，特斯拉涨超4%</strong></p>\n  <p>36氪获悉，8月19日收盘，美股三大指数集体上涨，纳指涨0.16%，道指涨0.22%，标普500指数涨0.21%。纳斯达克生物科技指数大涨6.4%，创下六年来最大涨幅；Moderna涨超176%，默沙东涨超12%。大型科技股多数上涨，特斯拉涨超4%，奈飞涨超3%，亚马逊、苹果涨超2%，微软、Meta、谷歌小幅上涨；英伟达跌近1%。热门中概股涨多跌少，理想汽车、名创优品涨超4%，拼多多涨超3%，腾讯音乐、百度、小鹏集团涨超2%，哔哩哔哩、京东、老虎证券、蔚来涨超1%；爱奇艺跌超8%，微博跌超1%。</p>\n  <p><strong>京东发布机器人战略</strong></p>\n  <p>36氪获悉，据京东黑板报，2026世界机器人大会上，京东出任WRC全球战略合作伙伴，并重磅发布机器人战略布局，立足供应链、服务、技术三大维度，明确在机器人领域的发展规划。供应链层面，截至2028年，京东将在机器人领域投入百亿资源，助力100个品牌独立销售额破10亿。服务层面，未来5年，京东将建立覆盖全球超100个国家的售后服务能力，创造超10万名机器人售后服务工程师新就业岗位；建立80个RoboBase机器人基地，打造机器人全生命周期服务平台。技术层面，京东附身智能JoyInside加速打造 “AI Home” 智能生态，预计年内实现包含机器人产品在内的超千万终端设备接入。</p>\n  <p><strong>多地宣布调整最低工资标准</strong></p>\n  <p>近期，多地宣布今年起上调最低工资标准。日前，广东省人民政府印发《关于调整我省最低工资标准的通知》，决定从2026年9月1日起调整提高月最低工资标准和非全日制小时最低工资标准。此次调整后全省分为三类标准。</p>\n  <p>其中，广州、深圳执行一类标准，广州市调整为2680元/月，深圳市调整为2700元/月，对应的非全日制小时最低工资标准均为25.4元/小时。二类标准调整为2300元/月，执行地区为珠海、佛山、东莞、中山，对应的非全日制小时最低工资标准为21.9元/小时。三类标准调整为2040元/月，执行地区为汕头、韶关、河源、梅州、惠州、汕尾、江门、阳江、湛江、茂名、肇庆、清远、潮州、揭阳、云浮，对应的非全日制小时最低工资标准为20.2元/小时。</p>\n  <p>山西从10月1日起提高最低工资标准。此次调整后，山西省全日制用工月最低工资标准划分为三档，一类地区2350元、二类地区2250元、三类地区2150元。同步上调小时最低工资标准，全日制用工小时最低工资标准依次为一类13.5元、二类12.9元、三类12.4元；非全日制用工小时最低工资标准依次为一类25.3元、二类24.2元、三类23.3元。</p>\n  <p>根据新疆人社微信公众号，《关于调整新疆维吾尔自治区最低工资标准的通知》显示，调整自治区最低工资标准，调整后的最低工资标准于2026年10月1日起执行。此次调整后，全日制用工的月最低工资标准三个档次分别为2270元、2080元、1930元。非全日制用工的小时最低工资标准，3个档次分别为22.7元、20.8元、19.3元。根据《最低工资规定》，省、自治区、直辖市范围内的不同行政区域可以有不同的最低工资标准。厦门大学经济学系副教授丁长发说，不同地区的经济发展和收入存在明显差异，因此最低工资标准也会有所不同。（第一财经）</p>\n  <p><strong>宇树科技今年成立两家新公司</strong></p>\n  <p>36氪获悉，据媒体报道，8月19日，宇树科技高开629%，报1100元，单签收益为47.46万元，总市值达4449亿元。天眼查App显示，宇树科技股份有限公司成立于2016年8月，注册资本约3.6亿人民币，法定代表人为王兴兴，经营范围包括智能机器人的研发、智能机器人销售、工业机器人制造等，由王兴兴、汉海信息技术（上海）有限公司等共同持股。对外投资信息显示，今年以来，该公司已成立上海拓天智联科技有限公司、杭州宇树星盟科技有限公司。</p>\n  <p><strong>iPhone18发布会或定档9月9日</strong></p>\n  <p>一年一度的苹果秋季发���会时间或许来了。据外媒报道，苹果可能将在9月9日举办新品发布会，新一代iPhone系列或将亮相。除了性能、影像、AI等常规升级外，此前备受关注的苹果首款折叠屏iPhone也持续引发讨论。（微博数码）</p>\n  <p><strong>2026七夕档票房破亿</strong></p>\n  <p>36氪获悉，据猫眼专业版数据，截至11时30分，2026年七夕档（8月19日）累计票房破亿，《欢迎来龙餐馆》《空枪》《奥德赛》暂列七夕档票房榜前三位。</p>\n  <p><strong>上海地铁票价优化方案公布</strong></p>\n  <p>上海地铁票价优化的听证方案公布。8月19日下午，上海市发改委发布了优化轨道交通票价机制听证会第二次公告，公开了听证会参加人名单和听证方案等，并将于8月19日至9月6日广泛征集社会各界意见和建议，社会公众可以通过发送电子邮件或邮寄信件方式提出。公告显示，票价优化听证方案包括两种，在起乘价、起乘间距、加价间距调整幅度上有差异。总体来看，两个方案调整幅度基本相当。同一时间，申通地铁集团推出轨道交通计次票、满额优惠方案等优惠措施，希望能够减少通勤乘客，特别是长距离通勤乘客的出行成本。</p>\n  <p>经有关部门初步测算，在实施新的票价机制和优惠措施后，方案一平均每人次票价将从4.23元提高至5.22元，提高0.99元；方案二平均每人次票价将从4.23元提高至5.2元，提高0.97元。但如果乘客购买计次票，乘客在方案一机制下享受的优惠幅度会较方案二微高。（第一财经）</p>\n  <p><strong>需求激增、价格上涨，两大存储龙头上半年净利润增超10倍</strong></p>\n  <p>存储巨头兆易创新半年报显示，上半年实现营业收入115.66亿元，同比增长178.67%；净利润68.57亿元，同比增长1091.5%。普冉股份同日披露的半年报显示，上半年实现营业收入39.59亿元，同比增长336.67%；净利润8.27亿元，同比增长1929.65%。AI算力建设带动存储芯片需求激增、价格上涨，成为业绩大增的共同原因。（证券时报）</p>\n  <p><strong>创业板指低开低走跌超6%，全市场逾百股跌停</strong></p>\n  <p>8月19日，市场全天调整，三大指数低开低走。沪深两市成交额2.51万亿，较上一个交易日放量1103亿。盘面上，市场热点较为杂乱，全市场超5000只个股下跌，逾百股跌停。从板块来看，煤炭板块逆势走强，宝泰隆、陕西黑猫、大有能源、美锦能源涨停。化工板块异动拉升，红四方3连板，华锦股份、中毅达涨停。房地产板块表现活跃，我爱我家、南都物业涨停。农业板块反复活跃，京粮控股3连板。银行板块逆势拉升，江苏银行创历史新高。下跌方面，高位股集体退潮，爱丽家居、一鸣食品、金螳螂、桂发祥跌停。人形机器人概念震荡下挫，中大力德、巨轮智能、五洲新春、晋拓股份跌停。截至收盘，沪指跌2.4%，深成指跌5.01%，创业板指跌6.26%。（财联社）</p>\n  <p><strong>迪士尼与旗下美国广播公司起诉美联邦通讯委员会</strong></p>\n  <p>当地时间8月18日，华特迪士尼及旗下美国广播公司（ABC）对美国联邦通讯委员会（FCC）提起诉讼，指控该机构试图挑战其广播牌照并规管其访谈节目《观点》（The View）的行为属于非法。（界面新闻）</p>\n  <p><strong>三星电子据悉因需求激增上调芯片代工价格，最高涨幅达15%</strong></p>\n  <p>据知情人士透露，由于AI芯片需求导致产能趋紧，三星电子已将部分先进芯片代工服务的新订单价格上调最高15%。（界面新闻）</p>\n  <p><strong>消息称三星电子目标今年9月率先完成1d nm DRAM内存研发</strong></p>\n  <p>据TheBell，近日，据业内人士透露，三星电子目标2026年9月率先完成1d nm DRAM内存研发，2026年12月进入量产转移阶段，2027年上半年启动生产线建设，有望2027年底实现首批量产。（财联社）</p>\n  <p><strong>保时捷回应“2030年前停产Taycan”：精简衍生车型，并非砍掉整个车系</strong></p>\n  <p>近日，德国媒体报道称，保时捷计划于2030年前停产其首款纯电轿车Taycan。据称，保时捷工会委员会已原则上与管理层达成协议，同意在2030年前后逐步结束Taycan的生产，但尚未形成正式书面文件。对此，保时捷德国总部回应称：公司正在精简Taycan的衍生车型数量以降低产品复杂度，而非砍掉整个车系。短期内，没有停产Taycan的计划。我们已为该车型投入大量资源，并将根据市场需求的变化，持续评估其未来发展。Taycan是保时捷首款纯电动四门运动轿车，于2019年首次亮相，此后推出多个版本并进行年度改款。市场层面，Taycan全球交付量于2023年达到峰值约4.1万辆，此后逐年下滑：2024年约2.9万辆，2025年约1.6万辆，2026年上半年仅约6000辆。在中国市场，2026年前5个月销量仅110辆，月均约22台，市场表现持续承压。（经济观察报）</p>\n  <p><strong>下周起，CHATGPT广告将拓展至31个欧洲国家</strong></p>\n  <p>OpenAI宣布，下周起，ChatGPT广告将拓展至31个欧洲国家。（新浪财经）</p>\n  <p><strong>谷歌宣称其AI可承担前沿部署工程师的工作</strong></p>\n  <p>谷歌云数据库产品副总裁兼总经理安迪·古特曼表示，尽管谷歌云近期宣布计划招聘数百名前沿部署工程师，协助客户基于Gemini开发应用，但目前公司正在用AI自动化这批专业顾问面向大型企业的部分工作，主要负责企业数据治理。古特曼表示，谷歌已经意识到这种高度依赖人力模式的局限性。“如果你想要激活企业全部数据，靠招人是不足以实现目标的。（新浪财经）</p>\n  <p><strong>SK海力士：计划3年累计自由现金流50%以上用于股东回报</strong></p>\n  <p>SK海力士8月19日公告称，计划在2025年至2027年政策期内，将累计自由现金流的50%以上用于股东回报，并通过自有股份回购及注销、现金分红等方式提升股东价值，同时考虑包括固定股息和特别股息在内的扩大分红方案。</p>\n  <p>SK海力士表示，随着公司持续创造可观的自由现金流，将提前实施股东回报。鉴于近期股价被认为低于公司内在价值，公司决定实施规模达40万亿韩元的自有股份回购及注销，以优化资本配置并提升股东价值。（界面新闻）</p>\n  <p><strong>比尔盖茨名下豪华度假村因维护不善面临1亿美元索赔</strong></p>\n  <p>据报道，美国亿万富翁比尔・盖茨位于加勒比海尼维斯岛的一处豪华度假村，因物业状况问题面临索赔金额达1亿美元的诉讼。尼维斯四季度假村（Four Seasons Resorts Nevis）业主协会上周起诉了尼维斯峰控股公司。业主们指控，度假村收费高昂，园区环境脏乱、设施破败，基础设施问题严重。四年间他们自掏腰包额外花费140万美元用于电力及基础设施修缮。业主协会要求尼维斯峰控股公司解决上述问题，或是赔付超1亿美元，用以赔偿业主认定的资产价值损失。（新浪财经）</p>\n  <p><strong>特斯拉上线豆包大模型</strong></p>\n  <p>36氪获悉，据火山引擎消息，特斯拉上线豆包大模型。据介绍，特斯拉车机现已陆续推送。</p>\n  <p><strong>现代汽车印度公司将于9月起提价，涨幅最高1%</strong></p>\n  <p>现代汽车印度公司8月19日表示，今年9月起，旗下所有车型价格将上调至多1%，具体涨幅因车型和配置而异。该公司将此次涨价归因于投入成本和商品成本上涨、运营费用增加以及持续的地缘政治和宏观经济不确定性。（界面新闻）</p>\n  <p><strong>美国财政部宣布将长期国债回购操作规模至少扩大一倍</strong></p>\n  <p>美国财政部8月19日宣布，将扩大长期名义附息国债（10‑20年期、20‑30年期品种）的流动性支持回购操作规模，单轮操作上限将从此前的20亿美元提升到至少40亿美元。这一调整将于当地时间9月9日生效，并将持续至本季度末（2026年11月4日）。（界面新闻）</p>\n  <p><strong>OpenAI首席财务官：公司或将在2027年上市，甚至更早</strong></p>\n  <p>据两位知情人士透露，OpenAI首席财务官弗莱尔在8月19日的全员会议上向员工表示，公司将在2027年上市；倘若业务持续高速增长，也有可能更早登陆公开市场。（新浪财经）</p>\n  <p><strong>花旗称贝森特出手令美元付出代价，建议客户采用策略加以应对</strong></p>\n  <p>花旗集团认为，美国财政部长斯科特·贝森特为压低长期借贷成本而采取的最新举措可能会导致美元在短期内走弱。财政部8月19日扩大10至30年期国债回购规模的公告导致长债收益率走低并推动美元跌至5月中以来的最低水平。花旗策略师Dirk Willer等人在研报中指出，遏制收益率的努力可能会使美元承受压力。 “以如此方式降低利率的主要代价就是货币走弱，” 他们写道。花旗建议客户面对此举利用美元为押注高收益新兴市场货币融资，因后者“在当前环境下也应表现不错”。该行此前青睐用加元和瑞士法郎作为融资货币。策略师们还认为黄金有上涨空间，并放弃了对久期的低配策略，理由是收益率曲线的长端更为受制且预计美联储接下来的两次会议上不会加息。他们说，“投资者现阶段可能不得不平仓陡化交易，转而重新买入黄金并卖出”美元。（财联社）</p>\n  <p><strong>Stripe收购OpenRouter</strong></p>\n  <p>Stripe 8月19日表示，计划收购初创公司OpenRouter，这家金融科技公司正扩展至人工智能模型市场。交易条款未披露，知情人士称，交易价格约为75亿美元，其中15亿美元分配给OpenRouter创始人。不到三个月前，OpenRouter刚刚以约13亿美元的估值融资1.13亿美元。（新浪财经）</p>\n  <p><strong>Marvell与谷歌就开发定制半导体产品达成商业协议</strong></p>\n  <p>8月19日，Marvell Technology宣布与谷歌就为后者开发定制半导体产品达成商业协议。此次扩展的合作关系涵盖一系列与TPU生态系统关联的定制芯片项目，包括AI推理加速器、存储控制器、网络接口控制器、内存接口控制器和近内存计算。为配合此次合作，Marvell于8月18日向谷歌发行一份认股权证，允许后者以每股206.58美元的行权价格购买至多5897万股公司普通股。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>奇瑞旗下机器人子公司AiMoga正考虑独立上市</strong></p>\n  <p>奇瑞旗下机器人子公司AiMoga正考虑独立上市。（财联社）</p>\n  <p><strong>长江存储IPO辅导状态变更为“辅导验收”</strong></p>\n  <p>36氪获悉，据证监会网站披露，长江存储控股股份有限公司IPO辅导状态变更为“辅导验收”，辅导券商为中信证券和中信建投。</p>\n  <p><strong>本末动力（北京）科技股份有限公司递表港交所</strong></p>\n  <p>36氪获悉，港交所文件显示，8月19日，本末动力（北京）科技股份有限公司向港交所提交上市申请书，独家保荐人为中信证券（香港）有限公司。</p>\n  <h2>大公司财报</h2>\n  <p><strong>微博：二季度总营收4.538亿美元，调整后运营利润1.254亿美元</strong></p>\n  <p>36氪获悉，微博发布2026年第二季度财报。财报显示，微博二季度总营收4.538亿美元（约合人民币30.8亿元），其中广告营收3.81亿美元（约合人民币25.84亿元），二季度调整后运营利润1.254亿美元（约合人民币8.46亿元），调整后运营利润率达到28%。用户方面，截至二季度末，微博的月活跃用户达到5.61亿，日活跃用户达到2.54亿。</p>\n  <p><strong>香港交易所：上半年股东应占溢利为105.68亿元，同比增长24%</strong></p>\n  <p>36氪获悉，香港交易所发布2026年中期业绩，2026年上半年收入及其他收益和溢利创历来半年度新高。上半年收入及其他收益为167.02亿元，较2025年上半年上升19%；股东应占溢利为105.68亿元，较2025年上半年上升24%。</p>\n  <p><strong>快手：第二季度财报营收355亿元，同比增长1.4%</strong></p>\n  <p>36氪获悉，快手发布2026年第二季度财报。财报显示，快手第二季度实现营收355亿元，同比增长1.4%；包含线上营销服务和以电商及可灵AI为主的其他服务在内的核心商业收入同比增长7.4%；经调整净利润39亿元。用户方面，快手应用平均日活跃用户达到4.12亿，平均月活跃用户达到7.97亿，创历史新高。二季度，快手双关私信用户数同比增长超过15%。</p>\n  <p><strong>金山办公：上半年营业收入33.13亿元，同比增长24.69%</strong></p>\n  <p>36氪获悉，金山办公披露半年报，上半年公司实现营业收入33.13亿元，同比增长24.69%；经调整后净利润为10.87亿元，同比增长28.29%。公司上半年研发投入11.52亿元，同比增长20.17%，费用率约35%。WPS个人业务实现收入20.14亿元，同比增长15.20%，WPS Office国内累计年度付费用户数为4825万，同比增长15.44%。</p>\n  <p><strong>韵达股份：7月快递服务业务收入46.43亿元，同比增长12.69%</strong></p>\n  <p>36氪获悉，韵达股份公告，7月快递服务业务收入46.43亿元，同比增长12.69%；完成业务量21.72亿票，同比增长0.46%；快递服务单票收入2.14元，同比增长12.04%。</p>\n  <p><strong>圆通速递：上半年净利润31.75亿元，同比增长73.44%</strong></p>\n  <p>36氪获悉，圆通速递披露半年报，2026年上半年，公司实现营业收入388.93亿元，同比增长8.39%；归属于上市公司股东的净利润31.75亿元，同比增长73.44%；基本每股收益0.9276元。公司拟每10股派发现金红利1.2元（含税）。</p>\n  <p><strong>申通快递：7月快递服务业务收入53.7亿元，同比增长25.26%</strong></p>\n  <p>36氪获悉，申通快递公告，2026年7月快递服务业务收入53.7亿元，同比增长25.26%；完成业务量26.03亿票，同比增长19.34%；快递服务单票收入2.06元，同比增长4.57%。</p>\n  <p><strong>恒瑞医药：上半年净利润44.65亿元，同比增长0.34%</strong></p>\n  <p>36氪获悉，恒瑞医药披露半年报，2026年上半年，公司实现营业收入154.56亿元，同比下降1.94%；归属于上市公司股东的净利润44.65亿元，同比增长0.34%；基本每股收益0.68元。</p>\n  <p><strong>赛力斯：上半年营业收入574.93亿元，同比下降7.87%</strong></p>\n  <p>36氪获悉，赛力斯披露半年报，上半年营业收入574.93亿元，同比下降7.87%；净亏损17.17亿元，上年同期净利润29.41亿元。</p>\n  <h2>投融资</h2>\n  <p><strong>AI芯片创企Etched融资7亿美元，近一个月估值翻番至210亿美元</strong></p>\n  <p>当地时间8月18日，AI芯片创企Etched宣布完成7亿美元新一轮融资，公司估值达210亿美元。本轮融资由简街领投，凯鹏华盈、红杉资本、a16z、Tiger Global、贝恩资本风险投资公司、Neo、Primary、Stripes、Positive Sum和黑石等跟投。Etched同时宣布简街成为其首位客户。此前，Etched在上月完成C轮融资，当时公司估值为103亿美元。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>小米新一代人形机器人剧透：双足、1.7米左右、全身66个自由度</strong></p>\n  <p>从小米方面了解到，小米即将首次展示的下一代人形机器人身高约为1.70米，体重66公斤，全身有66个自由度，其中一半自由度集中在手部。目前，该款机器人为样机阶段，国内首展后会在欧洲展出。2022年，小米发布全尺寸人形机器人“铁大”，比特斯拉Optimus原型机亮相早了近两个月。铁大身高1.77米，体重52公斤，拥有21个关节自由度。此后小米少有机器人方面的消息露出。（每日经济新闻）</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-08-19T23:48:59+00:00", "fetched_at": "2026-08-20T00:57:33.755038+00:00", "fingerprint": "29781067e889d9fb"}, {"source": "少数派", "title": "派早报：iQOO 发布手机新品、闪极举行 Loomos AI 眼镜发布会等", "url": "https://sspai.com/post/113607", "summary": "Spotify 上线「播放列表备注」功能、Windows Server 2022 即将结束主流更新等。<a href=\"https://sspai.com/post/113607\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-19T00:30:54+00:00", "fetched_at": "2026-08-20T00:57:31.837554+00:00", "fingerprint": "a23723cfb330f530"}, {"source": "少数派", "title": "App+1 | Inkive：把纸质书上划好的线存进 Obsidian", "url": "https://sspai.com/post/111936", "summary": "让纸书上的划线，回到你的数字笔记里。<a href=\"https://sspai.com/post/111936\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-19T02:54:52+00:00", "fetched_at": "2026-08-20T00:57:31.837548+00:00", "fingerprint": "c64f6c4a9eaf5f58"}, {"source": "少数派", "title": "《控制》新作体验：新怪谈游戏的祖师爷，又杀回来了", "url": "https://sspai.com/post/113588", "summary": "本文首发于「游研社」，作者@亚锌，少数派经授权转载，仅对排版略作调整。阅读原文在ChinaJoy期间，我参与了Remedy举办的《控制：共振》闭门试玩会。其实在开始前，我除了战斗部分之外，还非常期待本 ...<a href=\"https://sspai.com/post/113588\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-19T07:20:08+00:00", "fetched_at": "2026-08-20T00:57:31.837526+00:00", "fingerprint": "7bc0da4b768e4bf0"}, {"source": "少数派", "title": "iOS 27 测试版近期动向，还有 Apple 产品新消息", "url": "https://sspai.com/post/113618", "summary": "7月20日至今，Apple陆续发布了iOS27的DeveloperBeta4、5、6三个测试版本。随着9月秋季发布会的渐进，iOS27距离正式版的发布越来越近。今天，我们就来一起看看这三个Beta版本 ...<a href=\"https://sspai.com/post/113618\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-19T09:39:05+00:00", "fetched_at": "2026-08-20T00:57:31.837514+00:00", "fingerprint": "945aaca8c99f839c"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7678 CNY ↓-0.56%", "url": "https://www.frankfurter.app/2026-08-19?from=AUD&to=CNY", "summary": summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，水下感知芯片企业「芯旸微」近日完成千万元天使轮融资，本轮投资方为险峰长青和隐峰资本，资金将主要用于团队建设和人才体系搭建。</p>\n  <p>随着水下机器人从遥控作业走向自主运行，感知成为绕不过去的一道门槛。</p>\n  <p>Fortune Business Insights数据显示，2025年全球水下/海洋机器人市场规模约58.2亿美元，预计2034年增长至196.6亿美元。但相比陆地机器人，水下环境对常见传感器并不友好：水体中的颗粒、浑浊度都会加速光的衰减，影响视觉成像；激光在水中的传播距离也受到限制。NOAA对于海水光衰减的监测同样显示，水体浑浊度越高，可见光的有效传播深度越低。</p>\n  <p>超声波因此成为水下探测的重要技术路线。</p>\n  <p>传统水下超声主要使用压电陶瓷（PZT）换能器，通过压电材料振动产生和接收超声波。这类器件能够提供较高的声功率，因此仍适合长距离声呐等应用，但在机器人需要的小型化、高密度阵列和成像场景中存在局限。</p>\n  <p>芯旸微的技术栈是CMUT（电容式微机械超声换能器）路线。它通过MEMS半导体工艺在晶圆上制造微型振膜，可以布置成高密度二维相控阵列，同时具有较宽频带。</p>\n  <p>已有研究显示，CMUT阵列能够实现水下超声成像，并具备宽带和阵列化特征。这使得其更适合安装在机器人本体上完成近场环境感知和3D声学成像。</p>\n  <p>芯旸微创始人曹金龙告诉36氪，“传统声呐更适合千米级远距离探测，公司目前瞄准的是机器人周边约0-20米范围内的近场感知。”</p>\n  <p>芯旸微目前提供的并非单独一颗CMUT芯片，而是一套由CMUT阵列、ASIC集成芯片及相关软硬件组成的声学感知模组。公司选择的首个商业化落地场景是泳池清洁机器人。</p>\n  <p>灼识咨询数据显示，2025年全球约有3410万个泳池，泳池清洁机器人年出货量约490万台，预计2030年增至700万台；2025年全球泳池机器人零售额约28亿美元。</p>\n  <p>泳池机器人市场在快速发展，参与其中的不少为中国企业。</p>\n  <p>曹金龙介绍称，目前不少泳池机器人仍主要依靠陀螺仪、单点超声或视觉辅助定位。机器能够运动，却很难准确知道哪些地方已经清洁、哪些没有。</p>\n  <p>芯旸微希望用阵列式声学成像改变这一状态。按照公司测试数据，搭载其模组后，泳池机器人的清洁覆盖率可以达到95%以上，并能够进一步实现区域识别和路径规划，使得泳池清洁机器人更智能化和可控制性。</p>\n  <p>目前，芯旸微已经完成多轮流片并进入小批量阶段，并与多家泳池清洁机器人企业开展产品需求、测试和供应链合作。</p>\n  <p>曹金龙表示，泳池是公司主动选择的第一站。相比医疗超声，它对成像精度、认证和产品导入的要求更低，可以更快验证芯片和模组，并形成早期收入。</p>\n  <p>完成泳池场景后，芯旸微计划继续沿水下场景扩展，下一步包括消费级水下领航测绘扫描机器人，通过移动测绘扫描鱼群、水下装备、水下救援等场景，再进入水产养殖，通过声学感知获取鱼群数量、活动深度等数据，为投喂和养殖管理提供信息。未来芯旸微的CMUT技术还将应用于机器人与人脑之间的交互，形成人脑直接控制机器人大脑的可穿戴智能设备。</p>\n  <p>团队方面，创始人兼CEO曹金龙此前先后任职科沃斯和霍尼韦尔，工作经历横跨消费级机器人和上游传感器；研发团队拥有十年以上CMUT研发经验，已完成了多种芯片设计和工艺制程技术积累。</p>\n  <p>长期来看，芯旸微希望将CMUT的能力从“感知”进一步延伸到“通信”。由于超声器件既可以发射也可以接收声波，公司最终将其做成水下机器人的信息端口——既负责“看见”周围环境，也负责与外部交换信息。</p>\n  <p><strong>CEO对谈</strong></p>\n  <p>36氪：采用CMUT技术路线的芯片此前更多用于医疗，你们为什么首先选择泳池机器人，而不是从技术门槛更高的医疗产品开始？</p>\n  <p>曹金龙：我们早期其实看过血管超声、心腔超声、颅脑超声，也看过无创脑机接口。但这些产品投入很大，研发和商业回报周期都很长。对于一家早期创业公司来说，如果一开始就进入高投入、短期又没有收入的市场，风险非常高。</p>\n  <p>泳池机器人对成像精度的要求没有医疗那么高，产品导入和试错成本也低得多。对我们来说，它可以同时形成技术闭环和商业闭环。先通过一个真实市场验证产品，让公司活下来、积累客户和资金，再向更高端的场景拓展，这是我们选择的路径。</p>\n  <p>36氪：CMUT技术在海外已经发展很多年，中国公司现在切入水下机器人，机会在哪里？</p>\n  <p>曹金龙：中国最大的优势还是下游机器人产业的发展速度。很多泳池机器人、水下智能硬件本身就是中国团队研发、面向全球销售，我们离客户非常近，可以更快拿到真实需求，再针对需求去定义芯片。</p>\n  <p>国外CMUT公司过去主要面向医疗市场，已经形成比较成熟的产品和商业模式，但医疗芯片不能直接拿到水下使用，需要重新设计器件和ASIC。我们反而可以从一开始就围绕水下场景定义产品。</p>\n  <p>当然，中国目前也有短板，主要是在芯片制程环节。我们现在的量还不够大，可选择的代工资源有限，所以也在通过中试平台和新的制造合作伙伴解决量产问题。</p>", "category": "tech", "published_at": "2026-08-18T01:00:34+00:00", "fetched_at": "2026-08-19T00:58:09.479967+00:00", "fingerprint": "9a36a874014d868b"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜小米集团二季度智能电动汽车及AI等创新业务收入249亿元；百度二季度总营收313亿元，AI业务收入占比连续过半；我国在量子技术国际标准领域取得新进展", "url": "https://36kr.com/p/3944909708393602?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>小米集体：二季度智能手机全球平均售价同比提升25.9%，创历史新高</strong><br />小米集团发布2026年第二季度财报。报告期内，小米智能手机业务营收421亿元。第二季度，得益于在全球范围内主动调整产品结构，小米手机全球平均售价同比提升25.9%至1351元，创历史新高。</p>\n  <p><strong>小米集团：二季度智能电动汽车及AI等创新业务收入249亿元</strong><br />36氪获悉，小米集团发布2026年第二季度财报。财报显示，智能电动汽车及AI等创新业务收入增至249亿元，同、环比均实现两位数增长。小米新车当季交付超10.4万辆，同比增长28.2%。</p>\n  <p><strong>平安好医生：2026年上半年净利润2.19亿元，同比增长63.5%</strong></p>\n  <p>36氪获悉，平安好医生公布2026年半年度业绩报告。报告期内，录得归母净利润2.19亿元，同比增长63.5%；调整后净利润2.27亿元，同比增长37.7%。报告期内AI业务贡献毛利占比约4.6%。公司\"AI+真人医生\"服务体系，已全面接入平安集团全系生态App，覆盖集团100%个人客户。</p>\n  <p><strong>百度：主板转换预计年内生效，8月26日召开股东大会寻求批准</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报披露，主板转换预计将于今年内生效。7月，百度发布公告，拟在香港联合交易所主板进行自愿转换上市，港交所已确认该申请。百度将于8月26日召开股东特别大会，就相关事项寻求股东批准。</p>\n  <p><strong>爱奇艺：二季度总收入62.9亿元，环比增长1%</strong></p>\n  <p>36氪获悉，8月18日，爱奇艺发布截至2026年6月30日未经审计的第二季度财报。二季度爱奇艺总收入62.9亿元人民币，环比增长1%。其中，会员服务收入40.1亿元，在线广告服务收入12.5亿元，内容发行收入6.8亿元，其他收入3.4亿元。</p>\n  <p><strong>百度：二季度总营收313亿元，AI业务收入占比连续过半</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报显示，二季度总营收313亿元；一般性业务收入252亿元，其中AI业务收入占比50%，已连续两季占比过半。二季度百度AI云基础设施收入73亿元，同比增长50%，其中GPU云同比增长283%，已连续四个季度实现三位数增长；AI应用收入25亿元，同比增长3%；AI原生营销服务收入26亿元。</p>\n  <p><strong>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</strong></p>\n  <p>8月18日，苹果公司首次承认，监管的变化迫使其对App Store的控制被放宽，也因此拖累了其超过1000亿美元的服务业务。这一罕见声明表明，反垄断行动正开始侵蚀该公司最盈利的业务部门之一。苹果在最新的监管文件中警告称，通过替代支付系统进行的购买交易“可能完全无法获得佣金”。并且本月其报告的服务收入和利润率低于华尔街预期。（财联社）</p>\n  <p><strong>宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%</strong></p>\n  <p>8月18日，宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%。（财联社）</p>\n  <p><strong>万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个</strong></p>\n  <p>新任董事长徐恩利履职后的“第一把火”，烧向了万科的组织架构。万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个，原办公事业部负责人卢冰同步转任中航万科负责人。该事业部设立于2024年10月，至本次调整撤销，存续仅22个月。不过，万科集团网站已悄然完成组织架构信息更新：目前仅保留物业、商业与酒店、长租公寓、海外、食品、物流及财顾7个事业部，办公事业部已从列表中剔除。这是继2025年9月万科大规模调整组织架构、确立“集团总部+地区公司+事业部”新格局后，又一次关键精简。此次调整，亦被业内普遍视作徐恩利上任后的首个重大动作。（中国房地产报）</p>\n  <p><strong>蚂蚁健康收购医疗服务商风石健康</strong></p>\n  <p>36氪获悉，8月18日，蚂蚁健康正式宣布，收购国内医疗健康服务商风石健康，以完善“医保+商保”的一站式直付体验。蚂蚁健康除了可为患者在公立医院就医提供“医保+商保”同步结算服务，还可链接风石健康覆盖的超1500家私立医院与公立医院国际部，为中高端医疗险患者提供刷脸和刷码“商保直付”服务。</p>\n  <p><strong>今日起，阿里“千问办公”接入企业微信</strong></p>\n  <p>36氪获悉，8月18日，阿里旗下Agent产品“千问办公”正式接入企业微信。此前，该产品已接入钉钉和飞书。至此，“千问办公”实现国内三大主流协同办公平台的全面支持。</p>\n  <p><strong>豆包工作任务上新，可以在虚拟桌面操作Windows</strong></p>\n  <p>36氪获悉，据豆包消息，豆包工作任务模式继续上新，全新的豆包虚拟桌面已在Windows版本上线，豆包操作电脑的能力再次升级。在豆包电脑端选择工作任务模式和本地电脑，在技能栏选择“操作电脑”，完成授权后，在虚拟桌面里，豆包就可以像人一样查看电脑屏幕、移动鼠标、点击按钮、敲键盘，帮用户在电脑端继续推进复杂任务。</p>\n  <p><strong>阿里云启用韩国第三��数据中心，Agentic AI服务同步上线</strong></p>\n  <p>36氪获悉，8月18日消息，阿里云在韩国的第三座数据中心正式上线，并同步推出Agentic AI相关服务，进一步满足当地市场持续增长的AI及云计算需求。近期，阿里云已先后在法国、日本、马来西亚、墨西哥等市场持续完善AI与云基础设施布局。本轮扩建完成后，阿里云全球基础设施将覆盖30个地域、104个可用区，并计划进一步拓展至巴西等国家和地区。目前，阿里云在亚太云计算市场排名第一。</p>\n  <h2>投融资：</h2>\n  <p><strong>“恒湾科技”完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，恒湾科技（ZILLNK）近日宣布完成数亿元人民币B轮融资，本轮由深创投领投，国开科创、沃赋创投、东山精密等跟投。资金将主要用于核心芯片自研、AI-RAN与6G技术研发，以及海外市场的深化布局。</p>\n  <p><strong>“安澜德健”完成近亿元A轮融资</strong></p>\n  <p>36氪获悉，据启明创投消息，日前，“安澜德健”宣布完成近亿元A轮融资，由启明创投独家投资。本轮募集资金将主要用于加速推进公司核心产品OpusOne™的国内注册临床试验进程，并全面支持其海外早期临床试验的申报与开展。</p>\n  <p><strong>“思昇科技”完成数千万元种子+轮融资</strong></p>\n  <p>36氪获悉，近日，AI驱动的超声脑机接口公司“思昇科技”宣布完成数千万元种子+轮融资。本轮融资由国汽投资领投，元禾璞华、全球健康产业创新中心（GHIC）跟投，老股东英诺科创基金、水木清华校友种子基金继续加注，由光源资本担任独家财务顾问。本轮资金将主要用于超声脑机接口核心技术研发、医疗器械产品推进、多模态脑数据与AI脑科学平台建设，以及跨学科人才团队扩充。新产品：</p>\n  <p><strong>共生知行发布人形机器人赛车Demo</strong></p>\n  <p>36氪获悉，8月17日，具身智能初创公司共生知行（Symbiosis Robotics）发布双足人形机器人驾驶卡丁车Demo，这是公司成立后首次系统展示“全身智能”阶段性进展。据了解，共生知行聚焦面向双足人形机器人的全身智能基座模型，尝试打通感知、决策、全身运动控制与数据训练链路。公司表示，未来将快速迭代发布共生知行的技术进展、Demo、开源项目等。</p>\n  <h2>今日观点：</h2>\n  <p><strong>中信建投：矿区自动驾驶行业有望进入S型加速阶段</strong></p>\n  <p>36氪获悉，中信建投证券研报认为，矿区自动驾驶区别于Robotaxi，封闭场景、刚性用工需求与明确的降本增效价值使其商业化路径更清晰，行业在渗透率突破10%后有望进入S型加速阶段。国内近10万台矿卡存量提供持续改造空间，大型煤矿车队扩容、金属矿项目复制及中小矿山下沉将支撑国内市场增长；海外澳大利亚等高人工成本市场单车服务价值显著高于国内，有望打开第二增长曲线。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>词元消耗成授信依据，银行积极试水“词元贷</strong><br />作为AI（人工智能）领域的专业术语，词元（Token）正在变成金融机构使用的“信用词汇”。近日，广东省首个词元经济专项金融产品“词元贷”在广州市海珠区发布，中国银行、中信银行、广州银行3家银行率先参与布局。其中中国银行已落地授信额度。受访专家认为，依托词元消耗数据形成的“技术账本”，正在成为银行构建信贷评估体系的新依据，其实质是企业信用评估在算力场景下的数字化延伸。“词元贷”回应的融资痛点真实存在，构建的数据信用逻辑亦有价值，但支撑该逻辑的数据基础设施、风控方法论及监管框架，目前仍在建设中。（证券日报）</p>\n  <p><strong>我国在量子技术国际标准领域取得新进展</strong><br />由我国牵头的《量子熵源随机性质量和测试方法学的概述和分析》国际标准提案近日正式获批立项。该标准将建立统一规则检验量子随机数真伪，填补通用检测方法空白，标志着我国在量子核心器件国际标准制定中迈出重要一步。（央视新闻）</p>", "category": "tech", "published_at": "2026-08-18T11:14:56+00:00", "fetched_at": "2026-08-19T00:58:09.479960+00:00", "fingerprint": "6395afd9ff2b4c72"}, {"source": "36氪 - 最新文章", "title": "平安好医生：企业健管稳健增长，AI业务兑现业绩", "url": "https://36kr.com/p/3945024705657988?f=rss", "summary": "<p>8月18日，平安好医生（1833.HK）公布了2026年中期业绩。</p>\n  <p>财报显示，平安好医生在2026年上半年实现收入24.84亿元，同比微降0.7%。作为公司发展的核心着力点，企业健管业务表现亮眼：同期收入同比增速高达65%，强劲增长助推该业务收入占比提升至28.7%，同比上升11.5个百分点，公司业务结构得到进一步优化。</p>\n  <p>利润方面，公司2026年上半年归母净利润录得2.19亿元，同比增长63.5%；调整后净利润为2.27亿元，同比增长37.7%。公司净利润在报告期内实现强劲增长的核心驱动因素，主要是业务结构的优化与业务质量的持续改善。</p>\n  <h2><strong>01 “四到”服务建设强化企业健管业务逻辑</strong></h2>\n  <p>“四到” （到线、到院、到家、到企）服务网络建设是实现线上线下全场景联动的关键，不仅显著提升了用户体验与黏性，而且是切入企业健管业务、深度挖掘B端资源的核心抓手。其业务端的核心亮点如下：</p>\n  <ul>\n   <li><strong>到线</strong>：“AI+真人医生”服务已覆盖平安集团100%的个人客户。</li>\n   <li><strong>到院</strong>：持续扩张线下优质资源，合作医院达3216家，其中三甲医院1732家；内外部医师团队规模已达5万人，签约专家超3700位，包括9名院士/国医大师及820余位正副院长、科室主任与学科带头人；在支付端，\"平安医健付\"已覆盖近24.5万家合作药店中的14.9万家。</li>\n   <li><strong>到家</strong>：联合平安人寿升级推出“平安居家”服务品牌，已将居家养老服务拓展至全国140城。</li>\n   <li><strong>到企</strong>：在全国多地深度推广“1124”企业健管体系，即以1个医务室为核心，依托1支专属到企的专员队伍，通过精准施策与精细运营双重赋能，以满足企业差异化需求，围绕员工提供筛查评估、医疗咨询、促进干预、应急福利等4大类一体化服务。</li>\n  </ul>\n  <p>在“四到”服务打通线上线下服务闭环的业务逻辑下，随着服务流程的延伸，企业健管业务作为公司业绩增长的核心动能，在今年上半年实现收入高增的同时，过去12个月内，公司服务的付费企业客户超7700家，同比增长超73%，该业务同期GMV突破17.9亿元。从公司整体来看，受益于“四到”服务建设，公司的收入结构得到了进一步优化。</p>\n  <h2><strong>02 AI赋能应用助力毛利提升</strong></h2>\n  <p>报告期内，公司在AI领域的主要进展包括：迭代升级\"平安医博通\"医疗大模型，完善5大医疗细分垂域专用模型；\"AI+真人医生\"的健管体系全面接入平安集团全系生态App；公司的相关医疗AI大模型可精准诊断超1.13万种疾病，辅助诊疗准确率接近96%，复杂疾病多学科会诊方案准确率近90%，达到行业领先水准。</p>\n  <p>与消费级通用大模型相比，公司AI业务的核心价值与护城河，主要在于闭源的医疗垂直数据库，以及专业能力更突出的医疗大模型；而精准诊疗疾病覆盖范围的持续扩大与诊疗方案的高准确率，均验证了这一体系的业务能力。</p>\n  <p>从业务开展的逻辑来看，依托公司自有数据库与医疗大模型能力，AI深度赋能“四到”服务建设，不仅显著优化了用户使用体验与提高留存率，而且大幅提升了公司服务的覆盖广度；尤其在严肃医疗领域，亦展现出了可观的业务价值。在财务层面，AI通过提升业务质量直接助力公司整体毛利的提升，报告期内，AI毛利贡献占比约4.6%。</p>\n  <p>&nbsp;</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-08-18T12:54:35+00:00", "fetched_at": "2026-08-19T00:58:09.479952+00:00", "fingerprint": "32209e1ce72bbdbe"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨董明珠出任格力技校校长，学费最高1.5万元；人均557万元，寒武纪部分员工“大红包”即将到账；宇树科技今日上市", "url": "https://36kr.com/p/3945701165202817?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>8月18日起，阿里“千问办公”接入企业微信</p>\n  <p>安踏前CEO徐阳首次回应离职</p>\n  <p>特斯拉据悉准备8月面向公众推出CyberCab</p>\n  <p>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</p>\n  <p>法拉利首款电动车Luce拍出4000万美元，成史上最贵新车拍品</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>入校即入企，董明珠任校长的格力技校招初中毕业生，学费最高1.5万元</strong></p>\n  <p>8月17日晚，格力电器通过官方公众号“格力文化”发布消息称，由格力电器创办的珠海市格力技工学校近日正式开启首届招生，招生将持续至9月中旬，格力电器董事长董明珠亲自担任学校校长。招生简章显示，首届招收300名学生，学费9000元至15000元/学年不等，开设9个招生专业，招生对象为全国应往届初中毕业生，年龄15-18周岁。格力称，学校施行“入校即入企，毕业即适岗”的办学模式。学生入学即可对接企业资源，毕业后优先进入格力电器及产业链企业实习就业。（界面新闻）</p>\n  <p><strong>人均557万元，寒武纪部分员工“大红包”即将到账</strong></p>\n  <p>8月17日晚间，寒武纪发布公告，56.1万股股权激励股份即将解禁，上市流通日期为8月20日。公告称，本次拟归属股票的激励对象共124名，合计分享59.76万股股票（其中：3.66万股来源于公司从二级市场回购的股票，56.1万股为即将解禁的公司向激励对象定向发行的股票）。以寒武纪昨日收盘价1156元/股估算，59.76万股股票价值合计6.9亿元，对应每人平均股票价值557.15万元。</p>\n  <p>公告显示，本次股票激励归属的依据，系寒武纪在2023年11月推出的《2023年限制性股票激励计划》中预留授予部分第一个归属期的归属结果。据Wind统计，在股票激励计划推出当月，寒武纪的股票均价为139元/股。上个月，寒武纪推出了《2026年限制性股票激励计划》，限制性股票授予规模达500万股，对应首次授予的激励对象总人数为945人，约占公司全部职工人数1107人的85.37%，股票授予价格（含预留授予）为750元/股。（21世纪经济报道）</p>\n  <p><strong>宇树科技今日上市，产业链核心标的曝光</strong></p>\n  <p>8月17日晚间，宇树科技（688836.SH）公告称，公司股票将于2026年8月19日在上海证券交易所科创板上市。本次发行价格为150.80元/股，发行后总股本为4.04亿股，其中上市初期无限售流通股3008.77万股，占总股本7.44%。公司发行价对应2025年摊薄后静态市销率为35.89倍，高于可比公司平均水平。</p>\n  <p>策略方面，东吴证券建议关注宇树链、T链、银河通用链以及零部件相关个股。其中，宇树链核心标的包括首程控股、美湖股份、中大力德、长盛轴承；T链相关个股包括恒立液压、三花智控、拓普集团、浙江荣泰、五洲新春；银河通用链核心标的是天奇股份；谐波用量预期上修，相关个股包括绿的谐波、斯菱股份；灵巧手板块相关个股包括兆威机电、汉威科技、新坐标。（21世纪经济报道）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>豆包工作任务上新，可以在虚拟桌面操作Windows</strong></p>\n  <p>36氪获悉，据豆包消息，豆包工作任务模式继续上新，全新的豆包虚拟桌面已在Windows版本上线，豆包操作电脑的能力再次升级。在豆包电脑端选择工作任务模式和本地电脑，在技能栏选择“操作电脑”，完成授权后，在虚拟桌面里，豆包就可以像人一样查看电脑屏幕、移动鼠标、点击按钮、敲键盘，帮用户在电脑端继续推进复杂任务。</p>\n  <p><strong>阿里云启用韩国第三座数据中心，Agentic AI服务同步上线</strong></p>\n  <p>36氪获悉，8月18日消息，阿里云在韩国的第三座数据中心正式上线，并同步推出Agentic AI相关服务，进一步满足当地市场持续增长的AI及云计算需求。近期，阿里云已先后在法国、日本、马来西亚、墨西哥等市场持续完善AI与云基础设施布局。本轮扩建完成后，阿里云全球基础设施将覆盖30个地域、104个可用区，并计划进一步拓展至巴西等国家和地区。目前，阿里云在亚太云计算市场排名第一。</p>\n  <p><strong>企业微信CLI、MCP不限企业全面开放，WorkBuddy、DeepSeek等Agent均可接入</strong></p>\n  <p>36氪获悉，企业微信全面升级CLI与MCP能力，WorkBuddy、Deepseek Harness、Minimax Code等AI Agent均可直接接入企业微信调用企微能力完成任务，企业也可基于开放接口接入自建Agent。此次开放升级，面向所有规模的企业全面开放，不再受企业人数、资质等门槛限制，覆盖文档、表格、邮件、会议、日程、通讯录等十个能力模块。本次CLI的全面开放也意味着企业微信进一步向AI生态敞开底层办公能力。</p>\n  <p><strong>OpenAI宣布推出ChatGPT青少年版</strong></p>\n  <p>OpenAI宣布推出ChatGPT青少年版。若系统判断用户未满18岁，或用户自行声明年龄在13至17岁之间，将自动将其切换至ChatGPT青少年版。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%</strong></p>\n  <p>8月18日，宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%。（财联社）</p>\n  <p><strong>王兴兴称上市是高考，拒绝股价炒作</strong></p>\n  <p>据报道，王兴兴曾表示把上市视为“高考”，公司上市之后，他也将面临更多的考试。王兴兴近期在网上投资者交流活动中回应了市场对于股价、估值以及上市后压力的关注。面对投资者关于股价炒作的提问，他表示，公司希望投资者是“认同公司的价值才买我们公司的股票”，而不是一味炒作；对于上市后的压力，他则回应称“有压力更有动力”，公司将用好募集资金，加快募投项目实施，并以良好的业绩回报股东。</p>\n  <p>王兴兴提到，公司一直怀揣“用科技推动人类社会进步”的初心，并认为当前正处于全球AI与具身智能技术突破的前夜。过去十年的积累，让公司已经拥有“奔赴梦想、实现梦想的底气与能力”。对于一家刚刚迈入资本市场的机器人企业来说，609亿元是新的起点，但这个起点究竟通向1000亿元，还是2000亿元，最终仍然要由机器人自己给出答案。（澎湃新闻）</p>\n  <p><strong>美股三大指数集体收跌，存储板块大幅回落</strong></p>\n  <p>36氪获悉，8月18日收盘，美股三大指数集体下跌，纳指跌1.33%，道指跌0.22%，标普500指数跌0.69%。存储板块大幅回落，Lumentum、闪迪、SK海力士跌超9%，西部数据、美光科技、康宁跌超7%；大型科技股涨跌不一，Meta跌超4%，英伟达跌超2%，特斯拉、亚马逊小幅下跌，苹果涨超1%，微软、谷歌小幅上涨。热门中概股多数下跌，百度跌超12%，爱奇艺跌超8%，小鹏集团跌超3%，理想汽车跌超2%，蔚来、哔哩哔哩跌超1%，阿里巴巴涨超2%，京东涨超1%，拼多多、网易小幅上涨。</p>\n  <p><strong>胖东来澄清，招聘不包含性侵犯罪人员</strong></p>\n  <p>近日，胖东来针对“无门槛招聘刑满释放人员”作出澄清。胖东来表示，并非无门槛接纳，明确排除性侵、严重暴力等恶性犯罪前科人员，且刑释人员需与其他应聘者走完全相同的报名面试流程，并设置6个月的双向选择试用期。首批入职人员也被优先安排在仓储、物流等后台岗位，以兼顾就业帮扶与安全管理。</p>\n  <p>据悉，这已经是胖东来第二年为刑释人员提供岗位。去年入职的30名刑释人员，入职一年实现零离职。创始人于东来表示，希望建立更好制度，帮助更多人有尊严、友善地生活，鼓励刑释人员自尊自重、向善而行。（荔枝新闻）</p>\n  <p><strong>李强签署国务院令，公布《国务院关于修改〈住房公积金管理条例〉的决定》</strong></p>\n  <p>国务院总理李强日前签署国务院令，公布《国务院关于修改〈住房公积金管理条例〉的决定》，自2026年9月20日起施行。《决定》共20条，主要规定了以下内容。一是拓宽提取和使用范围。对提取住房公积金支付房租，不再设置房租超过家庭工资收入规定比例的门槛限制；新增装修自住住房、支付自住住房物业费、国务院批准的其他住房消费情形等可以提取住房公积金的情形。适当拓宽住房公积金投资运用渠道，明确住房公积金管理中心可以将住房公积金用于购买政策性金融债。二是提升管理服务效能。简化职工申请提取住房公积金的手续，缩短住房公积金贷款申请的审查时限，实现住房公积金缴存记录等全国范围内互信互认，推动住房公积金转移接续、异地贷款等业务便捷高效办理。三是强化风险防控。国务院住房城乡建设主管部门确定住房公积金领域公共信用信息，住房公积金管理中心建立全面完整准确的信用记录并纳入全国信用信息共享平台；对以欺诈、伪造证明材料等手段违法提取住房公积金、获得住房公积金贷款的行为，规定了明确的法律责任。四是扩大制度覆盖面。明确个体工商户、非全日制从业人员以及其他灵活就业人员可以自愿缴存住房公积金，按照规定享受相应的政策支持。</p>\n  <p><strong>安踏前CEO徐阳首次回应离职</strong></p>\n  <p>8月18日，安踏前CEO徐阳发朋友圈首次回应离职原因，称因家人留学原因离职安踏，即将陪伴家人迁居美国洛杉矶。“没有安排任何一场道别，是因为辜负信任的愧疚和不愿示人的软弱，希望大家都好好的！”徐阳于7月15日因“家庭原因”辞任安踏品牌CEO一职，由集团联席CEO赖世贤代理。任职期间，他曾为安踏品牌立下流水年复合增长10%至15%的目标，但2025年主品牌增速为3.7%，与预期存在差距。而在更早的四年里，作为始祖鸟大中华区操盘手，他将该品牌中国业务从约8亿元推至近30亿元，店均年收入从200万元做到1亿元，被视为将始祖鸟从专业户外带向现象级品牌的关键功臣。（每日经济新闻）</p>\n  <p><strong>红杉中国据悉寻求为其单飞以来的首支美元基金募资12亿美元</strong></p>\n  <p>据知情人士透露，红杉中国已与投资者就多支基金展开初步洽谈，其中包括其“单飞”以来的首支美元基金。知情人士称，该投资公司在商议为一支早期阶段投资基金募集至少12亿美元资金，以支持AI、医疗和消费领域的公司。红杉中国自2005年以来一直由沈南鹏掌舵。他们还说，红杉中国也考虑设立一只成长基金，但具体时间和规模尚未确定。其中一人补充说，该公司另外也在考虑一支人民币计价基金。此次募资将考验这家专注中国的老牌投资机构的号召力。原本红杉品牌伞下的三个实体就已然基本独立，一家专注美欧、一家专注中国，第三家聚焦印度和东南亚。拆分后，中国这一分支最终以HSG为英文名，投资了宇树科技、Minimax和月之暗面等AI新兴企业。（新浪财经）</p>\n  <p><strong>特斯拉据悉准备8月面向公众推出CyberCab</strong></p>\n  <p>媒体援引知情人士报道称，特斯拉已告知员工正为Cybercab面向公众推出做准备。这是特斯拉首款没有方向盘和刹车踏板的车型。报道称，特斯拉计划首先在德克萨斯州奥斯汀向公众推出Cybercab，最快可能本月启动。（新浪财经）</p>\n  <p><strong>超级富豪家族办公室扎堆SpaceX，持股规模超过38亿美元</strong></p>\n  <p>为美洲、欧洲和中东的超级富豪进行投资的机构已建立了数十亿美元的SpaceX投资敞口，凸显出这些机构抢占炙手可热投资机会的能力。申报文件显示，2026年上半年，十多家家族办公室持有这家正式名称为Space Exploration Technologies Corp.的公司合计至少38亿美元的股份。其中一些机构，包括Pritzker旗下的Tao Capital，以及Moreira Salles家族，也是马斯克商业帝国中另一家上市公司特斯拉的投资者。（财联社）</p>\n  <p><strong>Anthropic在IPO之前的年化营收突破650亿美元</strong></p>\n  <p>有市场消息称：Anthropic预计将在数周内启动IPO流程。Anthropic在IPO之前的年化营收突破650亿美元。（新浪财经）</p>\n  <p><strong>英伟达到处给人“兜底融资”？“新债王”冈拉克：预示市场或见顶</strong></p>\n  <p>随着英伟达与华尔街联手到处给人“兜底”融资，被业内誉为“新债王”的双线资本（DoubleLine Capital）首席执行官冈拉克最新警告称，华尔街试图将人工智能芯片变成可投资资产类别，这可能预示着市场即将见顶。冈拉克抨击了英伟达新近宣布的与六家金融巨头的合作关系，这些合作旨在为人工智能基础设施筹集超过5000亿美元的资金。英伟达将在其中扮演合作牵头方，而非出资方的角色。实际上就是利用其自身较高的信用评级，帮助控制客户的融资成本。（财联社）</p>\n  <p><strong>马斯克旗下特斯拉与SpaceX合并预期升温，预测市场押注2027年前合并概率达55%</strong></p>\n  <p>近期关于马斯克旗下两大核心企业——特斯拉与SpaceX合并的猜测持续升温，预测市场正涌现大量押注资金。预测平台Polymarket数据显示，市场目前认为两家公司于2027年12月31日前正式合并的概率为55%。另一家预测市场平台Kalshi则在X平台发文称，2028年之前合并落地的概率由65%进一步升至71%。（财联社）</p>\n  <p><strong>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</strong></p>\n  <p>8月18日，苹果公司首次承认，监管的变化迫使其对App Store的控制被放宽，也因此拖累了其超过1000亿美元的服务业务。这一罕见声明表明，反垄断行动正开始侵蚀该公司最盈利的业务部门之一。苹果在最新的监管文件中警告称，通过替代支付系统进行的购买交易“可能完全无法获得佣金”。并且本月其报告的服务收入和利润率低于华尔街预期。（财联社）</p>\n  <p><strong>希音被曝估值缩水，正寻求以300亿美元以内估值进行IPO</strong></p>\n  <p>8月18日消息，据报道，希音正寻求以260亿至270亿美元的估值在香港进行首次公开募股（IPO）。这一目标估值较该公司历史峰值大幅缩水。Shein计划通过此次上市筹集约20亿美元资金，现有股东或将认购本次发行规模的约一半。（澎湃新闻）</p>\n  <p><strong>谷歌据悉拟2027年停止在中国生产Pixel系列产品</strong></p>\n  <p>据报道，谷歌已告知供应商，计划从明年起将所有Pixel智能手机、智能手表和无线耳机的生产转移至中国以外。（新浪财经）</p>\n  <p><strong>法拉利首款电动车Luce拍出4000万美元，成史上最贵新车拍品</strong></p>\n  <p>尽管上市以来备受批评，法拉利首款纯电动车Luce仍以4000万美元成交，成为史上最昂贵的新车拍品。8月17日，法拉利在声明中表示，这辆“Tailor Made”高级定制版Luce在美国加州蒙特雷汽车周期间举行的苏富比慈善拍卖会上打破了此前纪录。去年的纪录由一辆定制版法拉利Daytona SP3创下，成交价为2600万美元。法拉利于5月发布Luce，售价55万欧元。这款车型推出后遭遇一波批评声浪，并导致公司股价下跌。（界面新闻）</p>\n  <p><strong>特斯拉据悉准备8月面向公众推出CyberCab</strong></p>\n  <p>媒体援引知情人士报道称，特斯拉已告知员工正为Cybercab面向公众推出做准备。这是特斯拉首款没有方向盘和刹车踏板的车型。报道称，特斯拉计划首先在德克萨斯州奥斯汀向公众推出Cybercab，最快可能本月启动。（新浪财经）</p>\n  <p><strong>英伟达CEO黄仁勋之女访问LG电子，讨论加强AI基础设施和机器人领域合作</strong></p>\n  <p>8月18日，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）8月17日访问了位于韩国的LG电子机器人中心。黄敏珊与LG电子高管会面，探讨了双方在人工智能（AI）基础设施和机器人领域深化合作的方式。此次访问前，LG电子上周宣布，计划依托英伟达机器人平台，在2027年第一季度推出一款可双足行走的新一代人形机器人。（新浪财经）</p>\n  <p><strong>卢伟冰：新一代小米玄戒芯片即将发布，一系列旗舰产品会密集上市</strong></p>\n  <p>36氪获悉，小米集团合伙人、集团总裁卢伟冰在财报电话会上透露，去年小米成功推出的玄戒O1芯片，在三款终端上的累计出货量已超过百万，实现了旗舰芯片规模化验证，全新一代小米玄戒芯片也即将发布。卢伟冰同时表示，9月份小米会进入密集的新品发布期，会有一系列重磅旗舰产品陆续上市。</p>\n  <p><strong>韩国现代汽车工会将时隔10年举行全面罢工</strong></p>\n  <p>8月18日，现代汽车劳资双方在韩国蔚山工厂举行第16轮谈判，时隔41天重启磋商，最终仍未能达成共识。劳资分歧主要集中在上调奖金、恢复在工会活动过程中因违法行为被解雇员工的职位，以及延长退休年龄等三项议题。工会随后敲定新一轮罢工日程，19日至20日、24日至25日每天举行4小时部分罢工，21日举行8小时全面罢工。这将是该工会自2016年劳资谈判后，时隔10年再度举行全面罢工。（财联社）</p>\n  <p><strong>Anthropic筹备超级投票权，为IPO铺路</strong></p>\n  <p>据两名知情人士透露，Anthropic计划授予首席执行官达里奥·阿莫迪及其他联合创始人一类具备超额投票权的股份，帮助他们抵御外部股东施加的压力。这将是Anthropic管理层首次获得超级投票权；该机制在科技企业创始人中已十分普遍。另有消息人士表示，对Anthropic而言此举意义特殊：相比其他科技企业创始人，该公司创始人所持股权占比相对较低。公司还计划依托特殊类别的股票，保留现有的非股东受托人团体，由其选举董事会多数席位，以此构建一道非传统屏障，抵御外部股东干预。（新浪财经）</p>\n  <p><strong>美加关税谈判进入最后关头，特朗普政府淡化达成协议预期</strong></p>\n  <p>据知情人士透露，特朗普政府正淡化外界对美加两国在最后一刻达成协议以避免将于周三生效的新关税的预期。美方私下表示，双方周二达成协议的可能性只有五五开甚至更低。两国需要在午夜截止期限前达成协议，否则美国将对价值数十亿美元的加拿大商品征收50%的关税。（新浪财经）</p>\n  <p><strong>德国去年企业关闭数量创近20年新高</strong></p>\n  <p>德国信用报告机构“信贷改革”公司和欧洲经济研究中心最新联合分析显示，2025年德国共有超过18万家企业停止经营，同比增加近10%，数量为近20年来最多。（新华社）</p>\n  <h2>大公司财报</h2>\n  <p><strong>必和必拓全年基本利润132亿美元，同比增长30%</strong></p>\n  <p>必和必拓全年基本利润132亿美元，同比增长30%，预估为126.9亿美元；净利润98.3亿美元，同比增长9%，预估109.5亿美元；每股末期股息0.99美元，上年同期0.60美元。（财联社）</p>\n  <p><strong>小米集团：二季度营收1089亿元</strong></p>\n  <p>36氪获悉，小米集团发布2026年第二季度财报。财报显示，二季度营收1089亿元，上年同期营收1160亿元；净利润94.6亿元，同比下降20.3%。</p>\n  <p><strong>爱奇艺：二季度总收入62.9亿元，环比增长1%</strong></p>\n  <p>36氪获悉，8月18日，爱奇艺发布截至2026年6月30日未经审计的第二季度财报。二季度爱奇艺总收入62.9亿元人民币，环比增长1%。其中，会员服务收入40.1亿元，在线广告服务收入12.5亿元，内容发行收入6.8亿元，其他收入3.4亿元。</p>\n  <p><strong>百度：二季度总营收313亿元，AI业务收入占比连续过半</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报显示，二季度总营收313亿元；一般性业务收入252亿元，其中AI业务收入占比50%，已连续两季占比过半。二季度百度AI云基础设施收入73亿元，同比增长50%，其中GPU云同比增长283%，已连续四个季度实现三位数增长；AI应用收入25亿元，同比增长3%；AI原生营销服务收入26亿元。</p>\n  <p><strong>中国联通：2026上半年营收2014亿元，同比提升0.6%</strong></p>\n  <p>36氪获悉，中国联通公告，2026上半年营业收入人民币2014亿元，同比提升0.6%；服务收入人民币1780亿元，同比下降0.2%。净利润人民币95亿元，同比下降34.6%。</p>\n  <p><strong>舍得酒业：2026年上半净利润1.45亿元，同比降67.26%</strong></p>\n  <p>36氪获悉，舍得酒业公告，2026年上半年营业收入22.87亿元，同比下降15.34%。归属于上市公司股东的净利润1.45亿元，同比下降67.26%。扣非净利润1.32亿元，同比下降69.84%。上年同期净利润4.43亿元。本报告期无利润分配预案。</p>\n  <p><strong>小马智行：二季度总营收2.46亿元，Robotaxi收入同比增长691.2%</strong></p>\n  <p>36氪获悉，8月18日，小马智行发布2026年第二季度财报。二季度总营收2.46亿元，同比增长68.8%。Robotaxi业务收入8192万元，同比大幅增长691.2%，环比增长40.9%，贡献总营收的三分之一，成为拉动业绩增长的重要力量。其中，乘客车费收入同比激增849.3%，创下历史最高单季涨幅。截至2026年6月30日，Robotaxi车队规模已达1975辆。目前，基于北汽、广汽、丰田三款车型打造的第七代Robotaxi均已投入日常服务。公司依托共建车队模式加速海外布局，海外部署计划合计超4000辆Robotaxi，其中与Uber合作计划在欧洲五城部署超2000辆。</p>\n  <p><strong>华能国际：2026年上半年净利润65.86亿元，同比下降28.89%</strong></p>\n  <p>36氪获悉，华能国际公告，2026年上半年实现营业收入1069.09亿元，同比下降4.57%；归属于上市公司股东的净利润65.86亿元，同比下降28.89%。</p>\n  <p><strong>中信建投：2026年上半年净利润76.39亿元，同比增长69.44%</strong></p>\n  <p>36氪获悉，中信建投公告，2026年上半年公司实现营业收入162.29亿元，同比增长51.11%；净利润76.39亿元，同比增长69.44%。公司拟2026年中期现金分红22.49亿元，该方案尚待提交股东会批准。</p>\n  <p><strong>国泰海通：2026年上半年净利润202.6亿元，同比增长28.74%</strong></p>\n  <p>36氪获悉，国泰海通公告，2026年上半年实现营业收入471.63亿元，同比增长97.56%；归属于母公司所有者的净利润202.6亿元，同比增长28.74%。公司拟向A股股东和H股股东每10股分配现金红利3.0元（含税），拟分配现金红利总额为52.54亿元（含税），占2026年上半年归母净利润的25.93%。</p>\n  <p><strong>OpenAI第二季度营收67亿美元，同比增长18%</strong></p>\n  <p>OpenAI第二季度营收增长18%至67亿美元，但亏损进一步扩大，业务增速落后于Anthropic。（新浪财经）</p>\n  <p><strong>株冶集团：2026年上半年净利润19.48亿元，同比增长232.75%</strong></p>\n  <p>36氪获悉，株冶集团公告，2026年上半年实现营业收入141.5亿元，同比增长35.91%；归属于上市公司股东的净利润19.48亿元，同比增长232.75%。营收增长主要系本期贵金属价格较上年同期上涨。</p>\n  <h2>投融资</h2>\n  <p><strong>“恒湾科技”完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，恒湾科技（ZILLNK）近日宣布完成数亿元人民币B轮融资，本轮由深创投领投，国开科创、沃赋创投、东山精密等跟投。资金将主要用于核心芯片自研、AI-RAN与6G技术研发，以及海外市场的深化布局。</p>\n  <p><strong>“安澜德健”完成近亿元A轮融资</strong></p>\n  <p>36氪获悉，据启明创投消息，日前，“安澜德健”宣布完成近亿元A轮融资，由启明创投独家投资
