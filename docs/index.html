<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

": "Postgres 19 is late because so many more bugs are being found now", "url": "http://rhaas.blogspot.com/2026/10/postgres-19-is-late-and-its-ais-fault.html", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-11-02T04:03:28.595882+00:00", "fingerprint": "38937f7fd47a931a"}, {"source": "Hacker News Front Page", "title": "F/OSS Comics #13: BSD Unix, Part 3 – The Beginning of BSD Unix", "url": "https://fosscomics.com/posts/13.%20BSD%20Unix%20Part%203%20-%20The%20Beginning%20of%20BSD%20Unix/", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-11-02T04:03:28.595740+00:00", "fingerprint": "6ee5567711f3fa2f"}, {"source": "Hacker News Front Page", "title": "Show HN: HackerBooks – HackerTube, but for books mentioned on HN", "url": "https://hackerbooks.org", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-11-02T04:03:28.595591+00:00", "fingerprint": "12844ee7f8055ffe"}, {"source": "The Verge", "title": "A fully playable version of Portal prequel F-Stop leaked", "url": "https://www.theverge.com/games/1024206/playable-portal-prequel-f-stop-leak", "summary": "Leakers have pieced together a playable version of the canceled Portal prequel F-Stop. Most of the assets came from the massive 12-terabyte leak that dropped this August. That didn't include the game's source code or map data, but those final pieces apparently hit the Valve Cut Content Discord this week, allowing a nearly complete version [&#8230;]", "category": "tech", "published_at": "2026-11-01T16:19:21+00:00", "fetched_at": "2026-11-02T04:03:28.178135+00:00", "fingerprint": "03a18e7f812000a7"}, {"source": "The Verge", "title": "Apple’s HomeView could add security camera features", "url": "https://www.theverge.com/tech/1024219/apples-homeview-could-add-security-camera-features", "summary": "Reddit user pdfu found hints hidden in the HomeView 27.2 code that Apple could be adding security camera features to its smart home hub. The strings describe a security camera mode with motion detection, live streaming, and recording options, as well as privacy functions. According to pdfu, there is a setup page that even explicitly [&#8230;]", "category": "tech", "published_at": "2026-11-01T17:16:07+00:00", "fetched_at": "2026-11-02T04:03:28.178129+00:00", "fingerprint": "0cdb92ce3209f040"}, {"source": "The Verge", "title": "Flock keeps ignoring requests to cancel its contracts", "url": "https://www.theverge.com/tech/1024232/flock-ignoring-cancel-contracts", "summary": "While more cities are canceling their contracts with Flock Safety, just as many are discovering how difficult that can be in some instances. Plymouth, Minnesota's city council voted to terminate its contract with Flock in September, but failed to respond to the city's request. For over a month, the cameras remained up, and the city [&#8230;]", "category": "tech", "published_at": "2026-11-01T19:58:02+00:00", "fetched_at": "2026-11-02T04:03:28.178123+00:00", "fingerprint": "4c7805da92c2787a"}, {"source": "The Verge", "title": "NASA hopes the commercial space industry can help save Hubble", "url": "https://www.theverge.com/science/1024239/nasa-commercial-space-save-hubble", "summary": "Gravity is a cruel mistress, slowly dragging the famed telescope ever closer to its ultimate demise with every day. Hubble is in no immediate danger of burning up in the Earth's atmosphere, but its time will run out in the early to mid 2030s unless its orbit is boosted. So NASA is taking proposals from [&#8230;]", "category": "tech", "published_at": "2026-11-01T21:09:21+00:00", "fetched_at": "2026-11-02T04:03:28.178112+00:00", "fingerprint": "dd8ec44c2a87c5d0"}, {"source": "36氪 - 最新文章", "title": "汤道生谈WorkBuddy商业化：不靠收入数字催团队", "url": "https://36kr.com/p/4051138782860421?f=rss", "summary": "<p>&nbsp;</p>\n  <p>腾讯正在把更多办公能力接入WorkBuddy。</p>\n  <p>10月29日，在2026腾讯全球数字生态大会上，腾讯发布跨应用办公协同体系Buddy One，连接腾讯文档、腾讯会议、ima和腾讯网盘等产品，推进账号、AI积分及部分服务权益互通。WorkBuddy也将进一步开放产品架构，支持企业自研智能体、第三方智能体和第三方通信系统接入。</p>\n  <p>今年6月，腾讯集团高级执行副总裁、云与智慧产业事业群CEO汤道生曾表示，暂时不给WorkBuddy团队设置商业化目标。此次大会上，当智能涌现再次追问有关商业化的问题时，汤道生没有给出一个具体的数字。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261101/v2_5010647a33f1479aa5dd8e44d1905de6@6252890_oswg1149066oswg1600oswg1067_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">汤道生接受采访</p>\n  <p>“今天WorkBuddy的商业化，我觉得是更多从支撑这个产品服务发展的角度来考虑，不是说给了某一个数字要逼着团队去完成。”汤道生回答。</p>\n  <p>他接着解释，腾讯引入的第三方伙伴中，有一些专门为客户提供FDE服务，即由工程人员深入企业，参与部署和流程改造。“他们也需要商业模式，他们也不能免费干活。”</p>\n  <p>客户规模扩大，也带来了持续服务的成本压力。谈到企业在安全、可观测和管理方面的需求时，汤道生说：“稍微有一些收入也主要是来让这件事能够发展的更好。”</p>\n  <p>这次大会之后，WorkBuddy的产品整合与商业化将同时推进，前者需要解决办公应用、企业数据和第三方能力如何连接的问题，后者则要在订阅收费之外，解决客户落地与持续服务的投入。</p>\n  <h2>01 办公能力整合，产品入口仍保留</h2>\n  <p>全新发布的Buddy One，其主要功能是连接不同应用中的资料和工具，支持WorkBuddy在授权范围内检索、整合文档、会议记录和知识库内容；腾讯文档、ima、腾讯网盘等产品也共享WorkBuddy的Agent底座。</p>\n  <p>汤道生把这次整合与办公协作方式的变化联系起来：过去，协作往往依赖文件版本的往返传递；他希望通过WorkBuddy这个工作台，将内容生成、浏览和修改连接起来。</p>\n  <p>被问及各产品是否会进一步合并时，汤道生把独立入口的去留交给用户选择：“他只需要这个能力，而且这个UI的方式是让他最高效去完成任务的，他就有独立存在的理由。”</p>\n  <p>企业微信与WorkBuddy在10月14日发布的联合版本，已采用两种入口并存的方式：员工可以在企业微信中使用WorkBuddy，也可以在WorkBuddy中调用经授权的企微数据。</p>\n  <p>“这两个体系是一个齐头并进的。”汤道生表示，企业微信仍要满足人与人的沟通，以及企业服务客户的需求。“这样对于WorkBuddy才有意义，能够从中获得有价值的信号。”</p>\n  <p>入口之间的连接，还要经过企业权限和业务规则的约束。汤道生以腾讯自身为例解释，几万名员工使用WorkBuddy，不可能让每个人任意访问数据。企业需要在服务端落实管理者、数据负责人的要求。</p>\n  <p>“挑战反而在于服务端，你怎么保障数据权限，怎么保障使用调用过程，不会侵犯别人的隐私，不会因为大模型对于背后系统的一些要求不理解，做了一些不合理的操作。”他说。</p>\n  <p>而在腾讯自有办公产品之外，WorkBuddy在9月2日已上线开放平台，引入行业应用、开发者和硬件伙伴。</p>\n  <p>汤道生对此的解释是：“本身开放生态是一种方式，能够接入很多腾讯不具备的能力和数据。”在这一过程中，腾讯提供文档处理等基础能力，伙伴在此之上搭建服务特定行业用户的应用。</p>\n  <h2><strong>02 商业化要支撑服务，企业客户也要看到回报</strong></h2>\n  <p>与Buddy One同步推出的，还有商业化方案Buddy One VIP，将WorkBuddy旗舰版、腾讯会议专业版、腾讯文档超级会员Plus等权益纳入同一方案。</p>\n  <p>而在Workbuddy的整体收费策略上，目前个人订阅与企业采购方案正在并行推进。当智能涌现问及哪一端增长更快时，腾讯云副总裁、CodeBuddy与WorkBuddy负责人刘毅表示，两端“增长都很快”。他提供了两个规模数据：“现在中国500强企业有50%的企业都在使用WorkBuddy，累计有90多亿任务提交在WorkBuddy平台上。”</p>\n  <p>而在订阅之外，企业应用还涉及第三方开发与实施服务。刘毅在群访中介绍，开放平台已有20万个Skills，腾讯希望由伙伴开发面向金融、财务、法务、销售等领域的应用。</p>\n  <p>大客户的交付需要深入具体业务。刘毅介绍，腾讯通过FDE连接平台与企业内部的流程、数据和权限，但工程人员进入客户现场，也有一个学习过程。“比亚迪有很多岗位和流程我们根本不知道。”他以比亚迪为例说明，FDE需要与企业IT团队共同学习和建设，把生产流程中的技能、环节连接起来。</p>\n  <p>对于中小企业，刘毅则给出了不同的服务路径：“中小微靠伙伴做，不是靠FDE做，只有靠伙伴才能规模化。”</p>\n  <p>由于办公Agent需要执行复杂的任务场景，持续的模型调用和算力消耗是Agent的成本主要来源。此次大会预告了混元即将发布的新模型：Hy4及Hy4 Flash，腾讯将后者定位为侧重性价比的版本。</p>\n  <p>在回答智能涌现关于“什么模型更适合Agent平台的提问时”，刘毅将重点放在模型厂商如何适配任务：“他们不是适配WorkBuddy这个独有的平台厂商，而是适配用户的场景。”他进一步解释，日常生产力工作中高频、容易验证、目标明确的任务，是WorkBuddy在2026年优先覆盖的场景。模型在这些方向上训练和改进，产品才能直接受益。</p>\n  <p>汤道生则表示，多模型接入会继续保留。模型针对不同任务的优化、价格乃至Token使用效果都有差异，“让他能针对不同的任务，可以使用不同的模型”，是WorkBuddy会持续坚持的方向。</p>\n  <p>对于高复杂度任务带来的成本压力，刘毅表示：“我们没有想过把一些高复杂、高价值的场景砍掉，而是怎么样服务好。”他希望通过Token价格下降和技术优化，降低处理成本。对于整体毛利空间何时能够明显改善，他给出的估计是“可能两三年”。</p>\n  <p>平台希望降低服务成本，企业客户则要判断采购AI服务能否带来经营回报。麦肯锡8月发布的全球AI调查显示，80%的受访者表示AI提高了个人工作效率，37%表示AI对所在企业的息税前利润产生了正向贡献。</p>\n  <p>在腾讯集团副总裁、腾讯云CTO王慧星看来，组织提效最终应体现在业务增长，或者以更低的运营成本完成工作，但不同企业仍缺少有共识的衡量指标。企业的问题已很具体：“花了这么多钱，用了这么多Token，企业说这到底谁用的？用到什么地方？效果到底怎么样？”</p>\n  <p>“这个问题需要WorkBuddy和企业共同面对和解决，因为我们也比较难衡量这个业务的效果。”他说。记录使用情况可以帮助追踪消耗，但经营回报仍要结合客户业务来判断。</p>\n  <p>而回到腾讯自身的投入，被问及未来两年是否会对WorkBuddy“无上限”投入时，汤道生说：“任何企业，我们的资本也是有限的，也没有什么无上限，确实阶段性是我们一个很重要的战略产品。”</p>\n  <p>谈及如何判断一项业务是否值得坚持，他给出了两个尺度：停止补贴后，用户是否留下；用户愿意支付的价格，能否与服务成本匹配。前期固定投入大、尚未实现净利润，与新增收入无法覆盖新增成本，需要区别看待。</p>\n  <p>“大家愿意买单，又同时能覆盖你的运营成本，那就真正这个业务就做到健康、可持续。”汤道生说。</p>", "category": "tech", "published_at": "2026-11-01T12:00:00+00:00", "fetched_at": "2026-11-02T04:03:27.880842+00:00", "fingerprint": "08efcc409a2fd53e"}, {"source": "36氪 - 最新文章", "title": "新入口和旧城墙之下，“中国版Muse”有多远？", "url": "https://36kr.com/p/4051143495603336?f=rss", "summary": "<p>文 | 李炤锋</p>\n  <p>编辑 | 张雨忻</p>\n  <p>1040万次，这是Meta的AI个人助理Muse上线不足两个月的累计下载量，由此，国内快速掀起了一轮Personal Agent产品热潮——谁能做出一个“中国版Muse”，成为了全行业都在关注的话题。</p>\n  <p>一批创业团队正在加速入场。去年离开字节的原豆包PC端产品负责人齐俊元，今年再次创业，推出主打持续记忆和主动服务的Today AI。以通用任务执行走红的Manus，则于近期推出个人助手Cue，为Agent配备邮箱、电脑等工具。以AI硬件r1起家的Rabbit，如今将重心延伸到新一代OS3：用户既可以通过网页，也可以通过r1使用这套助手，团队还在开发为之配套的新一代AI 硬件......</p>\n  <p>这些团队正在尝试不同的产品路径：一种是在手机或电脑上提供独立的Personal Agent软件，另一种则是和硬件深度融合，以硬件为入口。</p>\n  <p>在软件测，有的产品强调持续了解用户、主动提供帮助，有的为AI配备独立的电脑和账号，让它执行任务，还有的尝试连接用户已有的电脑，并通过软件和硬件等多个入口接收指令。这些做法并不互斥，但各家选择的起点不同。</p>\n  <p><strong>但在国内，创业公司的Personal Agent首先要面对的，是来自大厂的免费产品。</strong>豆包、千问已经聚集了大量用户，字节和阿里还在不断向其中加入办事能力。大厂可以把新功能送到已有用户面前，独立的Personal Agent亟须回答的是：它提供的便利，究竟能让多少用户持续使用，甚至愿意放弃大厂的免费产品而为自己付费？</p>\n  <p>另一方面，争取到用户，也不等于能替用户办成事。国内的购物、出行、支付等服务集中在各个平台，Personal Agent要跨App执行任务，都需要获得服务方的许可。第二代豆包手机助手在近期推出SAEP协议后，微信、淘宝、支付宝、美团等App出现在拒绝AI代操作的名单中。<strong>现阶段，助手远远做不到在 App 间畅通无阻。</strong></p>\n  <p>近期，智能涌现与多个Personal Agent创业团队聊了聊，我们发现，<strong>尽管Muse那样的通用助手是行业的愿景，但对创业团队而言，眼下的产品逻辑必须有所取舍。</strong></p>\n  <p>个人生活助手理旦先从记事、安排日程做起，再逐渐接管更多生活场景；同样开发个人Agent的WishSeen，准备先集中打磨一个生活功能；主打主动服务的个人助手UniCone，则优先面向创作者、个人IP等人群。它们有的从功能入手，有的从客群入手，但路径有共同之处：先争取一部分用户持续使用、愿意付费，再考虑扩大产品的服务范围。</p>\n  <p>WishSeen联创曹方咏峥表示：“个人Agent是个好的叙事，但如果不能让用户持续使用，并且持续愿意为它付费，那肯定是不行的。”</p>\n  <p>当“AI接管普通人生活”的热潮涌向国内，用户习惯与服务生态的差异也随之显现。“中国版Muse”能否沿着同样的路径起飞？甚至包括Muse在内的，究竟能不能成为一门生意？投资人、创业公司和大厂，都已置身这场尚未揭晓答案的赌局中。</p>\n  <h2>你的生活，需要交给Agent吗？</h2>\n  <p>Personal Agent要进入普通人的生活，先得证明这个需求真实存在。</p>\n  <p>今年以来，各类Agent产品迎来了爆发式增长，从Coding到Work，再到如今面向生活场景的个人助理。随着应用场景越来越细分，Agent厂商必须给用户一个使用其产品的理由。</p>\n  <p>LinkAI创始人查雨捷的团队位于深圳，从聊天机器人项目chatgpt-on-wechat起步，逐步将其发展为能调用工具、操作电脑的开源助理CowAgent。团队同时提供企业平台LinkAI，帮助客户搭建智能体、知识库和工作流。</p>\n  <p>“其实Personal Agent不是一个特别新的品类或者技术，它更多是一种使用场景。”查雨捷对智能涌现说。他的顾虑是，普通用户已有豆包、千问，专业用户也有办公Agent。“再开发一个同类产品，怎么让个人用户买单，其实是一个问题。”</p>\n  <p>美国风投机构Menlo Ventures在今年发布的消费者AI报告中发现，美国AI用户中，同时使用通用助手和专门处理某类任务的AI工具的比例，从去年的60%升至72%。机构认为，即使已经使用ChatGPT，用户仍可能为其他的具体需求，再选择一款更好用的工具。</p>\n  <p>这份报告提示了一种可能：<strong>Personal Agent和通用AI工具也许并不冲突，前提是要在日常场景里能够提供真实的便利。</strong></p>\n  <p>理旦是一款帮人打理生活的个人助手。用户说出要做的事，产品把待办从聊天记录中提出来，放到主界面。创始人阿汤把这种设计称为“以事情为中心”：目前先帮用户记事、安排日程，未来希望进一步替用户完成订酒店、订机票等任务。</p>\n  <p>理旦的社媒主页写着“在成都，5个人做中国版Muse”。但阿汤坦言，他们已经在计划出海：“我们后面的重点是做海外，但想先通过国内市场把产品磨出来。”</p>\n  <p><strong>Personal Agent如果要持续服务用户，就得知道什么时候该帮忙。</strong></p>\n  <p>来自深圳的UniCone团队正在开发主动式个人助手，尝试从用户授权的屏幕内容、聊天记录等信息里整理待办、拆解任务。“它得是主动性的，和之前帮你完成某件事情不太一样。”UniCone CEO说，这需要不断感知用户的情况，在后台运算，判断提供帮助的时机。</p>\n  <p>这种判断并不容易，尤其是用户的个人信息会不断变化。科技媒体TechRadar编辑兰斯·乌拉诺夫曾分享他在试用Muse时，就曾遇到这样一个场景：Muse发现旧资料里的葡萄牙旅行计划，与近期邮件中的意大利行程不一致，随后，Muse向乌拉诺夫确认并更���了目的地信息。</p>\n  <p>Muse的主动服务能力，得益于其在邮箱中实时掌握了大量用户信息，但这一路径显然和国内用户生态有着巨大差异——在国内，大量上下都存在于微信、支付宝、大众点评等多个超级App中，Personal Agent如果拿不到这些信息，能提供合格的主动式服务吗？</p>\n  <p>Today AI产品经理Suki是比较乐观的，她认为，<strong>微信之外仍有可用的信息来源</strong>。“微信不能垄断一个人工作和生活的全部信息，至少很多工作信息都不是沉淀在微信上的。”Suki表示，Today AI不少用户已授权助手访问飞书、健康、日历等数据，这些应用也能为助手提供理解用户的线索。</p>\n  <p><strong>但并不是所有 Personal Agent 都想一开始就包办用户的生活，尤其是暂时没有拿到大钱的创业公司。</strong></p>\n  <p>正在开发手机个人助手的WishSeen，准备保留记忆和主动性，但只集中打磨一个生活功能。联创曹方咏峥解释，追求大而全，团队既难承担成本，也难做出差异。“我宁愿把某一个功能做到用户足够愿意每天使用，甚至付费。” 对创业团队而言，暂时收起万能助手的设想，先把一个具体的生活功能做扎实，似乎更容易在大厂的资源夹击下，找到一个向上的突破口。</p>\n  <h2>新入口和旧城墙</h2>\n  <p>目前，这一批Agent创业团队基本都已经小范围验证了产品逻辑的可行性，但这只是打造产品的第一步——<strong>从0到1，创业公司可以在数百名种子用户中验证想法；可再往前走，就要面临和大厂的资源竞争。</strong></p>\n  <p>今年1月，阿里在发布会上演示了用千问订奶茶，背后是淘宝、支付宝等服务的接入。千问C端事业群总裁吴嘉当时表示，希望未来“大部分生活办事场景只用千问App就够了”。到了9月，阿里又推出面向手机厂商的Qwen Intelligence；10月，千问Go开放体验申请，尝试理赔、价保和预约。</p>\n  <p>9月底以来，字节跳动旗下的豆包也在陆续接入出行、生活缴费能力。大厂可以在原有产品中加入生活服务能力，也有足够的资源打通部分外部生态。</p>\n  <p>但对于独立Agent团队而言，获客则要从零起步。</p>\n  <p>“大厂确实资金雄厚，能够免费，也能够给自己砸钱打广告，这方面我们是比不了的。”阿汤说。他把理旦的突破口放在交互上：“如果产品一模一样，肯定比不过大厂。”</p>\n  <p>“提醒、待办这些东西，不应该沉在会话流里，应该被提出来，放到主页面。”阿汤说，“真正有价值的东西提出来之后，聊天记录就不那么重要了。”</p>\n  <p>谈到创业公司能否靠产品交互与大厂拉开差距，查雨捷表示：“有差异，但这个差异维持的时间肯定会越来越短。”框架开放、开发工具进步，让做出一个Agent更容易，也让同行跟进得更快。</p>\n  <p>Agent做起来快，而模型厂商进化的速度更快，这使得很多投资人面对AI应用项目时表现出相对谨慎的态度。一位来自某产业基金的投资人对智能涌现说：“现在模型迭代太快，你今天投的软件应用，可能明天就被模型干掉了。”</p>\n  <p>不过，从初创团队的角度来看，短暂领先也值得争取。</p>\n  <p>“我们可能是最早尝试在Agent里做记忆的团队之一，也是做主动性策略比较激进的团队之一。” Today AI 的Suki表示。在她看来，<strong>大厂有分发和资源优势，却未必能持续投入</strong>：“上线一个月发现数据不行，或者赚不到几个亿，老板一拍脑袋就把项目砍了。”创业公司的产品领先或许只能维持一段时间，“虽然未必形成壁垒性的优势，但这段时间仍然重要”。</p>\n  <p>不过，即使争取到了用户，“办事”的门槛依旧取决于Agent提供服务的覆盖面。阿里和字节可以先打通自家服务，但用户的生活却不会只在一家公司的生态里展开。</p>\n  <p><strong>AI要替人办事，迟早得走进别人的地盘。</strong></p>\n  <p>“如果大家都把权限分享给豆包，每个App就只剩一个后台，这是各大厂商都不愿意接受的。”谈到跨App办事的阻力，来自某大厂的Agent产品经理陈默（化名）对智能涌现说。</p>\n  <p>以字节近期的动作为例，在二代豆包手机发布前，豆包方面推出“屏幕自动化操作声明协议”（SAEP），让App开发者自行声明是否接受AI代操作，也可以具体划定哪些页面、哪些操作允许助手访问。10月14日公示结束时，官网公布的拒绝名单列出了多达155款App，微信、淘宝、支付宝、美团都在其中。</p>\n  <p>至少目前，大厂之间的生态壁垒仍然坚固。想让助手跨过去，创业团队不容易，大厂同行也不例外。</p>\n  <p>就连Muse也碰过这道门槛。9月，亚马逊阻止它代用户购物。外媒报道显示，亚马逊方面认为，代客购买其他商家商品的第三方应用，“应当公开透明地运作，并尊重服务提供商是否参与的决定”。</p>\n  <p>所以，国内App生态的围墙何时会向外部AI助手打开？</p>\n  <p>“长期我觉得会开放，但可能要几年，短期肯定不会。”查雨捷坦言。消费平台有自己的数据和业务壁垒，中小团队很难逐一对接。</p>\n  <p>“如果某个大厂不开放，等到别的平台开放了，流量就会过去。”UniCone CEO认为，当用户通过Agent寻找服务，平台最终会选择开放接口。</p>\n  <p><strong>经历过大厂多个Agent项目的陈默，对平台开放的速度更为谨慎。他认为，大厂推动改变往往很慢，跨平台打通“至少五年内解决不了”。</strong></p>\n  <p>至少此刻，这个矛盾看起来似乎无解：Personal Agent想替用户打理日常，让人不必再逐个打开App；平台却不愿让出与用户直接打交道的机会——用户在哪里停留，生意就在哪里发生。可如果始终无法接手真实的生活事务，谁来为Personal Agent买单呢？</p>\n  <h2>谁为Personal Agent买单？</h2>\n  <p>Personal Agent商业化的账，难就难在，其提供的服务需要有足够好的体验，才能让用户产生粘性，甚至愿意付费，但这也就意味着在冷启动过程中就要持续承受后台持续运行、主动服务等带来的算力成本——先要烧钱跑通这一步，才能讨论如何让用户付费订阅。</p>\n  <p>“我们创业要的不只是用户量，更是收入。多一个用户，多一份花费，免费养不起这么多用户。”谈到产品的商业化问题，阿汤表示，理旦后续可能停掉免费额度，看有多少人愿意付钱，再决定是否投广告、找KOL。“一开始不会砸钱去扩大用户规模。”</p>\n  <p>与传统互联网产品不同，Agent产品的一大笔成本来自模型运行所消耗的算力。</p>\n  <p>阿汤和团队开发理旦时试过多个模型，“要么贵，要么慢”。换成便宜又快的模型，“有时候就是听不懂话”，工具调用和长程任务也容易出问题。不过，他对长期趋势仍然乐观：“我看好模型能力的提高和价格的下降。以后，好用、能帮普通人做事的模型，一定会变得人人用得起。”</p>\n  <p>被成本牵制的，不止是理旦一家。<strong>WishSeen团队曾测算，要让助手既通用、主动，又有较强的执行能力，达到他们预期的效果，单用户每月成本至少为1000元。</strong>“不可能有用户会为你每个月掏1000块钱。”曹方咏峥说。</p>\n  <p>这让Personal Agent的竞争带上了资源消耗的意味。大厂能够补贴流量和算力，小创业团队却必须尽早算清单个用户的账。“<strong>最大的问题不是技术，还是成本</strong>。”曹方咏峥说。</p>\n  <p>不少创业者都认为，现有模型似乎还没找到Personal Agent所需的平衡点：能力足够强，响应足够快，成本也足够低。“目前的这些模型也好，Agent也好，并不是为Personal AI这个场景所设计的。”在清华研究AI的UniCone CEO说。UniCone尝试训练较小的模型，也尝试对既有模型做后训练，希望降低持续服务的成本。</p>\n  <p><strong>从特定人群中寻找付费需求，也是一种运营思路。</strong>A16z合伙人阿尼什·阿查里亚去年7月撰文指出，高价AI订阅往往服务于编程、视频创作等具体需求。他主张，创业公司深入满足这样一小群用户的需要，再据此收费，未必都要先追求大众市场。</p>\n  <p>作为行业头部的Muse，除了提供免费额度之外，直接上线了每月20美元和100美元的付费方案，但目前尚未披露该项业务的具体收入情况。</p>\n  <p><strong>订阅之外，交易分成也是被讨论的方向</strong>。但Today AI研发负责人高策坦言，“收入分成一定会让产品设计更倾向于提高成交率”，进而影响用户体验。一个替用户做决定的助手，如何在自己能赚钱的场景下仍站在用户一边，这是商业化与用户体验之间巨大的博弈。</p>\n  <p>在用户愿意付费之前，创业团队能否先从投资人那里拿到钱？</p>\n  <p>一位AI产业投资人向智能涌现表示，他过去一段时间都更关注算力、AI基础设施等领域，因为相关需求正在“实打实地放量”。不过，近期一些应用项目的增长，也让他开始重新关注AI应用：“最近又在花一些时间看一些应用项目了，感觉它们的增长有些还可以。”</p>\n  <p>曹方咏峥此前做过大模型创业，那一轮创业中，投资人中途失去了信心。这一次，她希望先拿到WishSeen的市场反馈和用户数据，再谈融资。“如果产品自己都没有办法很好地运转，资本的钱进来也没有办法让它很好地运转。”</p>\n  <p>另一边，UniCone团队也在积极接触投资人，但团队表示，希望融资能用于扩大业务，而不是成为维持运转的前提。</p>\n  <p>与上文提到的几家创业团队不同，LinkAI则是靠企业业务来支撑团队——开源和个人产品用来吸引用户，收入来自企业订阅、模型与算力服务，以及私有化项目。团队尚未融资，查雨捷认为，当前的资金压力不大。个人助手可以带来用户，付钱的却未必是这些个人用户。</p>\n  <p>“最终是什么样的产品形态，是硬件还是软件，是哪个公司来做？”从大厂出来创业的查雨捷，对个人助手的需求并不怀疑，“个人助手最终由谁、以什么形态做出来，还很不确定，特别是在国内。”</p>", "category": "tech", "published_at": "2026-11-01T12:01:00+00:00", "fetched_at": "2026-11-02T04:03:27.880836+00:00", "fingerprint": "95f3e643e8dacf4c"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“黄金平替”，全球爆单；奇瑞高管回应智界独立；OpenAI宣布ChatGPT部分任务将与Codex共享额度", "url": "https://36kr.com/p/4051860578702216?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>币安在遭遇史上最大规模加密货币黑客盗窃案后恢复提现</p>\n  <p>央行、金融监管总局、证监会，今日将召开会议</p>\n  <p>Anthropic招股文件披露：未来“隐性债务”规模近9000亿美元</p>\n  <p>全球MLCC龙头，宣布扩产计划</p>\n  <p>苹果CEO：不会为了做AI而做产品</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>中国贵金属首饰出口亮眼，全球爆单</strong></p>\n  <p>海关总署数据显示，前三季度，中国贵金属首饰出口亮眼。广东是中国珠宝首饰出口的核心省份。在汕尾一家首饰加工企业，今年1至8月的销量增长明显。据介绍，今年，镶嵌培育钻石类的贵金属首饰产品，是他们最大的增长点。为了应对新增的订单，公司专门新设立了培育钻石车间，全面铺开培育钻石的生产和研制。</p>\n  <p>数据统计，1~9月，中国贵金属或包贵金属首饰出口金额超过102亿美元，同比增长17.55%。广东出口金额达到73亿美元，同比增长超36.54%。近年来贵金属价格高位运行，也让这里发生一种新变化。业内人士表示，贵金属价格高位运行，不仅推高珠宝首饰出口总额，也催生了海外买家的“平替需求”，他们会采购金银含量更低的首饰，或者用铜制首饰替代银饰。（第一财经）</p>\n  <p><strong>奇瑞高管回应智界独立：要更像新势力，而非“大一号”传统车企</strong></p>\n  <p>在10月31日举行的三季度媒体沟通交流会上，奇瑞汽车股份有限公司执行副总裁戚士龙回应智界独立时表示，希望智界团队更像新势力企业，而不是简单做成“大一号”的传统车企。他表示，将从组织规模化、产品高端化及品牌逐步优化等方面，提升智界独立运营能力。据悉，智界明年还会有新产品导入，而海外业务仍由奇瑞集团独立运营。（界面新闻）</p>\n  <p><strong>OpenAI宣布ChatGPT部分任务将与Codex共享额度</strong></p>\n  <p>10月31日，OpenAI公告称，自12月起，ChatGPT Plus、Pro、Business套餐的使用额度将在ChatGPT与Codex之间共享。OpenAI正在把Work的智能体能力整合至ChatGPT主交互界面。用量以Token统计，消耗额度取决于模型与任务复杂度，复杂任务消耗更高；即时对话（Instant chat）不占用该共享额度。OpenAI预计，大多数用户等待额度重置的频率不会比现在更高。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek发布全新Agent架构</strong></p>\n  <p>10月31日晚，DeepSeek Harness团队在官方公众号发表技术文章《Super-agent设计探索：迈向更自主的Agent系统》。DeepSeek表示，模型能力提升催生了新的应用形态，个人助手（Personal Agent）开始集中涌现。然而，现有主流Agent设计还难以在多任务和团队协作的规模上支撑这一模式，多任务上限取决于人的注意力。通过双层架构、事件驱动、异步多信道交互、存算分离与外部Watchdog等思路，DeepSeek团队突破了这些限制，系统在底层接管了繁琐的会话管理与上下文同步，使人类得以从具体的执行细节进一步上移到更高层的决策与验收。DeepSeek把这种Agent形态及其系统架构称为Super-agent，文章提到，目前，基于这套思路构建的内部Super-agent实例已经在持续运行，日常参与问题复现与修复、代码审查响应与DeepSeek Harness自身的迭代。当团队成员在群聊中反馈软件问题时，即使没有人主动@AI，它也能识别潜在缺陷，在后台尝试复现问题、寻找修复方案。（第一财经）</p>\n  <p><strong>苹果和阿里巴巴达成合作，千问集成到Apple智能</strong></p>\n  <p>36氪获悉，10月31日，苹果和阿里巴巴宣布达成合作，将千问集成至Apple智能，中国用户可以在Siri、写作工具及视觉智能中，直接调用千问的文本与图像理解、内容生成等能力。这些功能将于11月4日起随最新的iOS开发者Beta版开放测试，并将于12月iOS 27.3正式发布时面向中国用户推出。</p>\n  <p><strong>ChatGPT网页端及移动端上线多账户切换功能，最多可同时登录两个账号</strong></p>\n  <p>10月31日消息，OpenAI更新帮助文档称，ChatGPT网页端及iOS、Android应用现已支持账户切换，用户最多可同时登录两个账号，无需退出当前账号即可切换使用。切换后，对话记录、记忆、文件、设置、订阅及工作区均与所选账号对应，彼此独立，不会自动迁移或合并。移动端该功能正在逐步推出，若用户尚未在设置中看到入口，可能尚未获得开放。文档还提醒，两个账号的订阅和账单相互独立，购买前应确认当前使用的账号。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>币安在遭遇史上最大规模加密货币黑客盗窃案后恢复提现</strong></p>\n  <p>币安11月1日开始重新允许客户从该交易所提现，此前该交易所加紧弥补在史上最大规模网络盗窃案中遭受的损失。币安在X上发布的一系列声明中表示，已重新开放比特币、以太币及某些其他数字货币的提现，并将继续分阶段扩大提现开放范围。上周，在团队进行安全检查期间，该交易所曾暂停客户提现。币安表示，目前已补回约95%的被盗资产。该公司称，尚未补足的5%“在市场上的流动性较低，按所需规模筹措需要更长时间”。（新浪财经）</p>\n  <p><strong>金饰克价较年内高点跌了近550元</strong></p>\n  <p>国际金价大幅下跌。截至31日收盘，COMEX黄金期货下跌3.63%，报3884.90美元/盎司。受国际金价走低影响，国内品牌金饰价格同步下调，部分品牌较年内高点已回落近550元/克。（央视财经）</p>\n  <p><strong>央行、金融监管总局、证监会，今日将召开会议</strong></p>\n  <p>从业内人士了解到，11月2日，人民银行、证监会将召集一些证券公司、基金公司举行会议，研究推动支持资本市场工具使用。同日，人民银行、金融监管总局和证监会将召集银行开会，研究优化股票回购增持再贷款政策。（证券时报）</p>\n  <p><strong>中国计划在2030年前实现登月，“两次发射、一次登月”方案揭秘</strong></p>\n  <p>第七届载人航天学术大会正在北京进行，备受关注的中国载人登月方案10月31日在大会上正式进入公众视野：中国计划在2030年前实现中国人登陆月球，并将采用“两次发射，一次登月”的方案完成这一壮举。根据方案，两枚长征十号运载火箭将先后发射揽月着陆器和梦舟飞船，在环月轨道交会对接。梦舟飞船可搭载3名航天员往返地面与环月轨道，其中2名航天员乘坐揽月着陆器往返环月轨道和月球表面。（央视新闻）</p>\n  <p><strong>科技七巨头盈利增速或自2022年末以来，首次落后标普500其余成分股</strong></p>\n  <p>市场分析师约翰·巴特斯表示，第三季度迄今，“科技七巨头”中已有五家公司的每股收益增幅落后于标普500指数其他成分股。英伟达和苹果尚未公布最新季度业绩，但巴特斯称，科技七巨头的合计每股收益预期增幅已从一个月前的33.6%降至22.6%。相比之下，标普500指数其余493家公司的合计每股收益增幅为32.6%。这意味着，科技七巨头的盈利增速有望自2022年第四季度以来首次低于标普500指数其他成分股。分析师预计，这一趋势将在今年第四季度延续。（新浪财经）</p>\n  <p><strong>科创板公司前三季度扣非净利同比增6.74倍</strong></p>\n  <p>截至目前，614家科创板公司完成三季报披露。今年前三季度，科创板公司扣非后净利润增速达674.17%，与净利润474.56%的增速相差约200个百分点，这意味着科创板公司的利润增长几乎全部来自主营业务。（证券时报）</p>\n  <p><strong>国有某大行计划向中国国新和中国诚通各新增千亿级股票回购增持专项贷款额度</strong></p>\n  <p>财联社记者11月1日从相关渠道了解到，一家国有超大型银行近日计划向中国国新、中国诚通两家央企新增股票回购增持贷款额度，单家新增额度或可达到1000亿元。据悉，此次新增的再贷款额度规模，或将超过2024年该政策工具设立时该行向上述主体发放的首期额度。（财联社）</p>\n  <p><strong>险资三季度新进重仓股出炉，中国人寿新进宁德时代</strong></p>\n  <p>据数据宝统计，险资合计出现在630多只股票三季报前十大流通股东榜，新进重仓150只股票。从最新重仓股来看，险资三季度新进宁德时代、中际旭创、华电新能、北方华创等个股前十大流通股东榜。从期末持股市值来看，中国人寿旗下产品三季度新进持有宁德时代超2640万股，期末持股市值76.86亿元，位居险资新进重仓股持股市值榜首位。中国人寿旗下产品三季度新进中际旭创近760万股，期末持股市值61.43亿元位居第二位。中国人寿、中国平安等旗下产品新进华电新能逾11亿股，期末持股市值超43亿元。此外，北方华创、生益科技、新易盛等三季度险资新进重仓股期末持股市值均超10亿元。（证券时报）</p>\n  <p><strong>事关大额存单，多家外资银行密集上架</strong></p>\n  <p>近期，汇丰、渣打、永丰、东亚等多家外资银行密集上架人民币大额存单，部分三年期产品利率，较同期限国有大行的大额存单高出近40个基点。多家外资银行发行人民币大额存单，具体来看：永丰银行（中国）三年期个人大额存单，20万元起存，年利率1.92%，较国有大行同期限产品高出近40个基点；东亚银行（中国）年内发行了多款三年期大额存单，年利率1.90%；汇丰银行（中国）1个月期到6个月期大额存单，年利率0.85%到1.3%；渣打银行（中国）发行大额存单覆盖1个月至1年，50万元起存的6个月和1年期的年利率最高可达1.2%。</p>\n  <p>中国邮政储蓄银行研究员娄飞鹏表示，近期人民币升值比较明显，居民持有人民币的意愿增加，外资银行想要扩大跨境结算、贸易融资、财富管理等业务，需要增加人民币存款，发行大额存单是个相对比较好的选择。同时，外资银行在国内的网点比较少，吸收存款的优势相对不够明显，需要比较高的利率来吸引投资者。（央视新闻）</p>\n  <p><strong>Anthropic招股文件披露：未来“隐性债务”规模近9000亿美元</strong></p>\n  <p>Anthropic的上市申报文件显示，这家公司在扩张AI业务版图的过程中，计划通过远期履约义务投入近9000亿美元用于服务器、厂房及电力项目，该金额远高于资产负债表上当前列示的负债。这款Claude聊天机器人背后的AI实验室，于10月26日提交注册文件，筹备上市，市场预期其估值将达到1.5万亿美元。这份提交给美国证券交易委员会的文件对外披露了多项细节，包括资产负债表的规模与健康状况：账面负债1175亿美元，现金1120亿美元。（新浪财经）</p>\n  <p><strong>伊朗战事期间，美石油行业被曝获巨利</strong></p>\n  <p>10月31日，据美国方面10月30日消息，根据估计，伊朗战事期间美国石油行业获得了超过1300亿美元的利润，几乎是2025年同期约470亿美元的三倍。消息称，这是根据美国50多家大型石油企业在今年4月至9月共六个月期间经营数据得出的保守预测。统计数据还未涵盖伊朗战事刚发生之后、今年3月的相关数据。消息称，美国两家石油巨头埃克森美孚和雪佛龙30日公布的今年第三季度财报显示，埃克森美孚第三季度盈利超出同期两倍，而雪佛龙的盈利约为同期三倍，均超出市场预期。（央视新闻）</p>\n  <p><strong>全球MLCC龙头，宣布扩产计划</strong></p>\n  <p>全球MLCC龙头日本村田制作所近日官宣中长期扩产计划，2026财年至2030财年的五年周期内，合计投入约1万亿日元（折合422亿人民币），主攻多层陶瓷电容器（MLCC）产能建设，以满足AI服务器、算力硬件对高端无源元器件的激增需求，目标到2030财年实现MLCC销售额较2025财年翻倍。（财联社）</p>\n  <p><strong>长鑫科技管理层：目前公司已与多家头部客户协商长期供货协议</strong></p>\n  <p>科创板日报记者获悉，在10月30日晚上的业绩会上，长鑫科技管理层在表示，目前公司已与多家头部客户协商长期供货协议，从而锁定中长期确定性需求。在供求延续紧缺与精益制造的双重支撑下，公司预计第四季度毛利率将继续保持稳定。（财联社）</p>\n  <p><strong>美联储12月加息的概率为72%</strong></p>\n  <p>据CME“美联储观察”：美联储12月维持利率不变的概率为28%，加息25个基点的概率为72%。美联储到明年1月维持利率不变的概率19.3%，累计加息25个基点的概率58.4%，累计加息50个基点的概率为22.3%。（财联社）</p>\n  <p><strong>赛力斯：10月新能源汽车销量24921辆，同比下降51.57%</strong></p>\n  <p>36氪获悉，赛力斯公告，公司2026年10月汽车销量27037辆，同比下降50.29%；1—10月累计销量310198辆，同比下降21.48%。其中，10月新能源汽车销量24921辆，同比下降51.57%；1—10月累计销量281442辆，同比下降20.96%。</p>\n  <p><strong>苹果CEO：不会为了做AI而做产品</strong></p>\n  <p>苹果CEO约翰·特努斯近日接受采访时，为苹果当前在人工智能领域的布局进行辩护。过去几年，外界常认为苹果在AI赛道落后，尤其是苹果推迟推出更强版本的Siri，该功能直到今年夏天才正式上线。特努斯是苹果资深高管，9月初正式出任CEO。他承认“每个人都有自己的看法”，但坚称：“我对我们现在所处的阶段很满意。”</p>\n  <p>特努斯补充，苹果一定会在新产品中运用人工智能，但他表示：“我们不想为了做AI而推出AI。如果我们做得好，用户不会去思考这个功能到底是AI实现的，还是传统软件实现的。重点在于，我们是否打造出用户真正喜爱的产品。”当被问及AI是否会对苹果及其生态带来颠覆性改变，比如智能体可能让应用程序变得不再必要时，特努斯回应：“我想那或许会让生活变得十分便捷，但产品打造是一件极具人文色彩、充满个人创意的事，也是我们热爱的事业。”（新浪财经）</p>\n  <p><strong>英伟达披露下一代CPO技术，原型样品已就位</strong></p>\n  <p>英伟达近日在SEMICON West 2026上公开展示了下一代共封装光学（CPO）技术，名为OOI（Optics‑on‑Interposer，中介层上集成光学）。不同于现有CPO方案，OOI选择拿下有机封装基板，将光引擎直接集成到承载GPU的硅中介层之上，把光电转换环节进一步向芯片内核靠拢，为下一代超大规模AI集群提供全新互联思路。据英伟达研究院首席研究科学家尼古拉•内多维奇（Nikola Nedovic）介绍，该方案以更大面积的中介层取代现行有机封装基板，目前英伟达已拿到原型样品。OOI目前仍处于研究阶段，暂无商业化时间表。（财联社）</p>\n  <p><strong>OpenAI奥特曼谈内存短缺：全球DRAM应优先供给数据中心，闲置在玩家PC里是浪费</strong></p>\n  <p>OpenAI首席执行官萨姆・奥特曼12月30日在一次播客访谈中表示，在DRAM存储芯片供应紧张的情况下，将内存集中部署在数据中心并提高利用率，才能够更有效地利用有限的资源。奥特曼表示，从全球资源配置的角度来看，让每个人在个人电脑（PC）里配备大量有限的DRAM，而这些内存可能只有5%的时间在被使用，是一种“相当糟糕”的资源浪费。他主张，在全球供应链极度受限的环境下，应该将内存资源最大化地集中在云端数据中心，以实现更高的利用率。（新浪科技）</p>\n  <p><strong>OpenAI将融资目标下调100亿美元，估值1.25万亿美元</strong></p>\n  <p>随着科技股惨烈下跌，市场对AI投入的规模与回报节奏的担忧加剧，OpenAI下调了融资目标。多名知情人士透露，OpenAI目前计划募资约200亿美元，估值1.25万亿美元。（新浪财经）</p>\n  <p><strong>三星电子与SK海力士带动韩企股份回购规模激增467.33%</strong></p>\n  <p>韩国交易所11月1日消息，今年1–10月上市公司自有股份回购与处置总规模约101.9217万亿韩元，较去年同期17.9652万亿韩元增长约467.33%。其中KOSPI市场规模达100.6006万亿韩元，KOSDAQ市场为1.5207万亿韩元，同比分别上涨494.78%、40.22%。本次自有股份回购及处置规模大增主要由三星电子与SK海力士带动。截至目前，三星电子已回购约15万亿韩元自有股份；SK海力士已完成40万亿韩元回购，还计划追加20万亿韩元回购。两家公司回购总额约82万亿韩元，占全部上市公司自有股份回购及处置申报规模的80%。（新浪财经）</p>\n  <p><strong>禄达技术集团收购亚洲算力算网与量子计算科技有限公司55%股权</strong></p>\n  <p>美股上市公司禄达技术集团（LUD.US）宣布，正式收购亚洲算力算网与量子计算科技有限公司（简称“亚洲算力”）55%的股权，后者的业务涵盖数据中心规划建设的运营管理、高性能算力租赁，以及量子计算托管与运营。为支持亚洲算力业务发展，禄达技术集团与华智未来科技有限公司签署战略谅解备忘录，双方将在海外算力输出、液冷技术及金融合作三大方向探索合作机会。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“思锐增材”完成千万级Pre-A轮融资</strong></p>\n  <p>36氪获悉，“思锐增材”近期完成了千万级Pre-A轮融资，本轮融资新增彤恺万维创投、消费电子行业产业投资人，天使轮股东南科大梧桐天使基金追加投资，德太资本担任本轮融资顾问。资金将主要用于推动消费电子、液冷等3D打印金属粉末制备技术的规模化生产，以及进一步研发多金属粉末制造与精细调节技术。</p>\n  <p><strong>整理丨</strong>娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-11-02T00:08:26+00:00", "fetched_at": "2026-11-02T04:03:27.880829+00:00", "fingerprint": "9a9c5bdcf51f2b05"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨复旦东华团队做“离子皮肤”，获元禾、华为哈勃超千万元融资", "url": "https://36kr.com/p/4051972607530113?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约1500字，建议阅读4分钟</p>\n  </blockquote>\n  <p>硬氪获悉，上海灵枢智肤电子科技有限公司（以下简称“灵枢智肤”）近日连续完成两轮融资，种子轮由元禾控股、华为哈勃参投，天使轮老股东元禾控股继续跟投，两轮融资超千万元，领甪资本担任独家财务顾问。</p>\n  <p>灵枢智肤成立于2025年4月，专注于柔性触觉传感材料及器件的研发、生产和销售。创始人贾炜毕业于复旦大学高分子科学系，完成本硕博连读。公司核心团队主要来自复旦大学高分子科学系，具备材料、工艺、电路、管理等方面的完整能力。公司科学顾问为东华大学化学与化工学院院长武培怡教授，并与东华大学联合组建机器人材料联合研发中心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261102/v2_587a87a0bace4a03bed1df694a2422b7@5920579_oswg638136oswg990oswg597_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）&nbsp;</p>\n  <p>随着机器人快速进入物理世界，被称为“具身智能最后一块拼图”的触觉感知正从实验室走向产业化。智研咨询数据显示，2024年全球柔性触觉传感器市场规模约26.7亿美元，预计2029年将达到50亿美元。</p>\n  <p>触觉感知的第一道门槛，是材料，这也是灵枢智肤的切入点。</p>\n  <p>灵枢智肤专注于离子皮肤技术路线，所谓“离子皮肤”，即���聚合物基材中加入离子，通过离子的变化产生电信号。相比其他技术路线，离子皮肤的优势之一在于化学体系具有更丰富的选择空间，从离子选择到有机化学修饰，都可以带来更多的材料设计可能性，从而进一步拓展材料性能的上限。</p>\n  <p>其次，离子皮肤本身导离子、不导电，更适合用于电容式器件。压容器件在灵敏度、基线稳定性以及信号线性度等方面表现较好。同时，在功能设计上，基于离子皮肤中盐和聚合物体系的丰富选择，还可以通过不同的分子间相互作用叠加自愈、热制硬化等功能，为材料提供更多性能组合。</p>\n  <p>灵枢智肤目前的产品矩阵主要面向具身智能和消费电子两个领域。具身智能领域，主要包括数据采集手套中的触觉传感器，以及装配在灵巧手本体上的触觉传感器；消费电子领域则主要面向耳机、手机、智能手表等可穿戴及智能终端设备的触控交互传感器。</p>\n  <p>公司材料在可靠性、灵敏度以及耐候性等方面进行了针对性优化，并完成双85测试等可靠性验证，以及1000万次以上的重复机械测试，在使用寿命方面具备一定优势。已推出的手指触觉传感器和指尖+掌心传感器模组，可用于灵巧手和触觉采集手套，具备多点压力感知能力，支持点触、长按、滑移、切向力感应等功能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261102/v2_9d62b3d242574576b6c094c80632b36e@5920579_oswg86155oswg381oswg435_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）&nbsp;</p>\n  <p>目前，灵枢智肤已完成多轮材料配方优化和Demo样品制备，正在搭建材料中试线，并向人形机器人、陪伴机器人、软体机器人、智能玩具、智能穿戴、智能汽车等多个领域的客户送样，推进产品落地验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261102/v2_4de211ceb5734f5897dfaca1ccad9fdc@5920579_oswg390067oswg763oswg394_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）&nbsp;</p>\n  <p>以下为创始人贾炜与硬氪交流节选：</p>\n  <p><strong>硬氪：目前离子皮肤的应用还处在早期阶段，公司的客制化材料技术平台能具体解决这一技术路线推向商业化应用的什么问题？</strong></p>\n  <p><strong>贾炜：</strong>早期我们在开拓客户的时候，不同方向的客户会有不同的需求。不同应用场景之间，对材料性能的要求差异会比较大。</p>\n  <p>我们基于离子路线的可设计性，搭建了客制化材料技术平台。首先是分子级功能设计，可以根据具体应用的性能要求，从源头分子结构进行设计，全方位掌握材料配方，实现性能的精准调控。其次是材料性质匹配，根据应用需求，对材料的物理和化学性质进行设计，使材料性能与具体应用场景更好地适配。</p>\n  <p>此外，公司也会围绕材料与具体应用需求，提供低成本加工方案，对生产加工流程进行设计和优化。同时，我们会对材料进行全套可靠性测试，确保材料在实际应用中的稳定性，满足工业级应用要求。</p>\n  <p>目前，我们从材料设计出发已经沉淀出了两款性能领先的离子皮肤材料，分别应用于压电和压容两类柔性超薄触觉传感器件。与此同时，我们仍在对传感材料进行持续的优化和迭代，以更好地满足客户的新需求。</p>", "category": "tech", "published_at": "2026-11-02T02:01:16+00:00", "fetched_at": "2026-11-02T04:03:27.880821+00:00", "fingerprint": "5a5afc2c1c408827"}, {"source": "36氪 - 最新文章", "title": "给一个人的邀请函丨来WISE2026，把「了不起」做成动词", "url": "https://36kr.com/p/4052067795325825?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261102/v2_1939bf9b07504239b0548d02444015e1@6301044_oswg176996oswg879oswg497_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <blockquote>\n   <p>一个人，做成一件事。</p>\n  </blockquote>\n  <h2>不知道你有没有觉得：一个人做事的时候AI用得越顺手，瓶颈往往却越真实。</h2>\n  <p>一方面，工具确实把门槛压低了：方案、设计、应用，一个人借AI也能做出专业水准的交付；</p>\n  <p>另一方面，真正卡住一个人的，从来不是工具——而是从想到到收到，中间隔着的那道生死线。</p>\n  <p>从「0」到「了不起」要过三道验收坎：第一笔钱，第一个回头客，第一次别人替你说话…市场的认可，是唯一不会撒谎的指标。</p>\n  <p>但经历这些的，真的不只是你一个人。</p>\n  <p>此前36氪AI测评在各个城市举办线下活动时，我们遇到了许多让人眼前一亮的OPC。也因此认定一件事：好用的AI工具值得去测评、被推荐，也有太多用工具把事做成的人，值得去认识、被连接。</p>\n  <p>因此，今年的WISE大会我们设立「了不起的OPC」分会场，我们想把观察聚焦到一个主题：</p>\n  <p><strong>一个人，做成一件事。</strong></p>\n  <p>在这里，「了不起」不仅是形容词，更是个动词——源于把想法付诸行动的勇气，也来自持续为客户创造价值的坚持。</p>\n  <h2><strong>现场，有点不太规矩</strong></h2>\n  <p><strong>我们的初心和活动立意：年轻、有趣、在台下能说话。</strong></p>\n  <p><strong>开盲盒圆桌·敢问敢答。</strong>OPC、主理人、客户、投资人、AI厂商坐下来，问题从台下抽。</p>\n  <p><strong>案例「心动故事」启发你。</strong>优秀OPC拆解自己的案例，告诉你如何从「想到」变成「拿到」。</p>\n  <p><strong>现场教学，带走一个作品。</strong>由OPC和工具方共同出品现场Workshop，让你离开会场时，带走一个能赚钱的Idea。</p>\n  <p><strong>项目路演。</strong>展区对接与自由链接，让项目、企业与生态伙伴高效对接。</p>\n  <p><strong>了不起的OPC名录。</strong>OPC需要被证明，也需要现场链接到资源——现场一面【了不起的OPC】照片墙，让你更好的被认识。</p>\n  <p><strong>00后「AI Native」谈如何拿下黑客松。</strong>如何通过黑客松让自己的创造被看见。</p>\n  <p><strong>没想到，这样也可以赚钱。</strong>OPC未必要服务大市场，也可以在「大众市场」中挖掘「小众需求」。</p>\n  <h2><strong>内容，把OPC的关键问题聊透</strong></h2>\n  <p><strong>真实案例，怎么从想法走到结果。</strong>从36氪AI测评的行业观察和代表案例出发，看看一个人的项目如何走向真实客户。</p>\n  <p><strong>客户为什么买单，OPC怎样经营。</strong>让OPC、主理人与客户面对面，聊清值得付费的能力、经营中的关键选择，以及那些可以少走的弯路。</p>\n  <p><strong>从第一次咨询，到真正合作。</strong>想法怎样换来咨询？聊了很多次却没有合作，问题究竟卡在哪里？把从接触到合作的距离讲具体。</p>\n  <p><strong>让获客不靠运气。</strong>个人IP与自媒体怎样带来持续客户？去泡沫后，OPC如何沉淀自己的AI时代复利飞轮？</p>\n  <p><strong>技术第一步，现场做出来。</strong>从OPC FDE实战到workshop，围绕AI Agent、Personal Agent、Workflow和应用搭建，把技术想法落到作品。</p>\n  <p><strong>出海与黑客松，新的舞台在哪里？</strong>讨论AI出海如何放大生意，也听00后分享黑客松经验，看看一个人的作品还能怎样被看见。</p>\n  <h2><strong>嘉宾，到场的都是谁？</strong></h2>\n  <p>城市主理人20人+，了不起的OPC约80人+，再加上校园主理人及社团、校友（95/00后）、企业/品牌方、技术人员与内容创作者。</p>\n  <p>如果你已经有结果，可以看看平台怎么帮你放大；</p>\n  <p>如果你手里有工具、有资源，「促成真实合作」就是为你留的位置。</p>\n  <p>具体嘉宾与分享内容，我们也将陆续公布。</p>\n  <p>观望，不如来现场「做成」</p>\n  <p>一个人做事，不缺工具，缺的是被看见、被连接、被验证的一次机会。<strong>一个人做成一件事，已经够了不起。</strong></p>\n  <p>2026，北京，WISE现场。我们把OPC相关上下游资源，汇聚到同一个空间。</p>\n  <p>AI能替你干很多活，但「了不起」这件事，还得你来实现。</p>\n  <p><strong>11月27日，北京亦庄 ·&nbsp;国家信创园会议中心</strong></p>\n  <p><strong>等你来，把「了不起」做成动词。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261102/v2_a30e168f8dfe4c59997080b464c688ba@6301044_oswg924oswg400oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码报名参会</p>\n  <p>商务合作：xingxue@36kr.com</p>\n  <p>内容分享合作：shihongwei@36kr.com</p>\n  <p>媒体合作：chenxinrui@36kr.com</p>\n  <p>特别提醒：「了不起的OPC」是WISE2026商业之王的分会场，同期11月26-28日三天，WISE2026的主会、展区将同步进行，如果你感兴趣，点击文章末尾「阅读原文」，锁定为数不多的早鸟免费票！</p>", "category": "tech", "published_at": "2026-11-02T03:39:40+00:00", "fetched_at": "2026-11-02T04:03:27.880806+00:00", "fingerprint": "2309d0b8e62159a6"}, {"source": "少数派", "title": "怀旧手记｜夏普 Telios：20 多年前，Handheld PC 中的「少数派」", "url": "https://sspai.com/post/116991", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/116991\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-01T07:02:46+00:00", "fetched_at": "2026-11-02T04:03:26.056011+00:00", "fingerprint": "a6136364df24a52c"}, {"source": "少数派", "title": "派早报：Apple 智能将随 iOS 27.3 登陆中国", "url": "https://sspai.com/post/118191", "summary": "<p>Apple 智能将随 iOS 27.3 登陆中国</p><p>苹果对闪存的议价权受到压制</p><p>Claude Code 官方扩展被植入后门</p><p>美国 FCC 禁止中国实验室认证输美电子产品</p><p>百度网盘通过磁力计数据规避「摇一摇」广告权限</p><p>币安 63 亿美元资产被盗</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/118191\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-01T23:22:45+00:00", "fetched_at": "2026-11-02T04:03:26.056003+00:00", "fingerprint": "493f17bfcc2d608e"}, {"source": "少数派", "title": "Xnip 十周年：长截图的新生，也是新的起点", "url": "https://sspai.com/post/115662", "summary": "十年是一个 shortage-cloud-servers", "summary": "Asked about supply chain shortages, like the ongoing RAM shortage, OpenAI CEO Sam Altman said in an interview that it's \"terrible\" to have RAM in personal PCs instead of data centers. During his appearance on the Cheeky Pint podcast, where he also commented on AI's impact on math, Altman said: \"A lot of people want [&#8230;]", "category": "tech", "published_at": "2026-10-30T20:48:43+00:00", "fetched_at": "2026-10-31T03:49:55.683510+00:00", "fingerprint": "05a1378ae455d54d"}, {"source": "The Verge", "title": "Exclusive details about Akai’s MPC Sample Key", "url": "https://www.theverge.com/gadgets/1023649/akai-mpc-sample-key-exclusive", "summary": "Akai teased its new MPC Sample Key on Instagram earlier this week, and said it plans to open-source its software so the modding community can hack it to their hearts' delight. While there's no word yet on when the device will launch or how much it will cost, The Verge has received exclusive images of [&#8230;]", "category": "tech", "published_at": "2026-10-30T21:01:32+00:00", "fetched_at": "2026-10-31T03:49:55.683504+00:00", "fingerprint": "dc3df6c4fc2a74b6"}, {"source": "The Verge", "title": "Apple Intelligence is finally coming to China with iOS 27.3", "url": "https://www.theverge.com/tech/1023974/apple-intelligence-china-ios-27-3", "summary": "Apple will launch Apple Intelligence in China with iOS 27.3, the company announced on its Chinese newsroom website, as reported by MacRumors. The Apple Intelligence features will be available first in an iOS 27.3 beta that's set to launch on November 4th, with a full iOS 27.3 release scheduled for December. This launch doesn't bring [&#8230;]", "category": "tech", "published_at": "2026-10-30T22:32:53+00:00", "fetched_at": "2026-10-31T03:49:55.683495+00:00", "fingerprint": "8edfa603fa5ede8d"}, {"source": "36氪 - 最新文章", "title": "新石器4亿美元融资背后，物流小车行业走到哪一步了｜最前线", "url": "https://36kr.com/p/4048024522553603?f=rss", "summary": "<p>10月20日，新石器宣布完成E轮近4亿美元融资，由博裕投资与某国家级基金联合领投，阿里巴巴AEF NextGen香港基金、广汽资本、纪源资本、淡马锡旗下Vertex Growth等参投。</p>\n  <p>这是今年以来国内自动驾驶领域最大单笔融资之一，新石器CEO余恩源在一场媒体沟通会中对外透露，原计划融2亿美元，最终接近4亿，本轮融资是超募结果。</p>\n  <p>融资本身不是新闻的全部。真正值得关注的，是这笔钱背后，资本对物流小车这门生意的评判标准，正在发生明显转移。</p>\n  <p>过去几年，自动驾驶行业习惯用里程、接管率、激光雷达数量和模型参数讲故事。但在无人配送这个细分场景，新石器CEO余恩源反复强调一个指标：TCO，即全生命周期综合运营成本。</p>\n  <p>他把TCO拆成硬件、安全、技术、云服务、运维等近十项子指标，再向下细化为几十个可执行项：比如免充气轮胎，看似微小，却是没有司机换胎场景下的真实成本项；比如车辆生命周期从5年拉到8年，日均有效服务时长从12小时提升到18小时。</p>\n  <p>这套算法的客户侧版本很简单：传统人力配送一公里约1元，无人车自身TCO可以将成本压到0.25元，售价压到0.5元，对于客户而言，成本可以直接下降一半。</p>\n  <p>这就是物流小车的商业化逻辑，当政策逐步放开、场景逐步起量，决定采购的不再是技术情怀，而是运营账本。</p>\n  <p>新石器目前的收入结构里，卖车仍占大头。但余恩源表示，新石器希望未来逐步从卖产品转向卖服务，把车做成履约服务，由合作伙伴持有资产、获取客户、负责充换电运维，新石器则提供核心的自动驾驶能力和调度系统。</p>\n  <p>他认为，物流行业是一个开放性复杂系统。3000多万辆城配存量车、上千万种货物类别、千奇百怪的末端场景，没有任何一家企业都服务不过来。开放性意味着机会，新石器给自己定位的不是汽车公司，而是运力网络运营商。</p>\n  <p>把制造环节交给上汽大通、五菱、广汽，自己则守住场景认知和运营体系，新石器认为，物流小车行业未来的利润池，不在整车毛利，而在规模化运营后的边际成本递减。</p>\n  <p>新石器的海外业务也在同步推进，目前已进入20多个国家，中东、欧洲、东南亚、东北亚同步推进，余恩源透露，内部目标是3-6年内，海外收入超过国内。</p>\n  <p>他同时指出，出海的难点不在卖车，而在合规。数据不能出境、云资源、员工团队都需要本地化，路权逐城谈判。并且单一区域规模不够，商业模型也跑不通。市场和政府的双重支持下，中东地区将是新石器的重点海外市场。</p>\n  <p>面对GPT-6、世界模型、VLA等大模型浪潮，新石器的态度意外冷静。余恩源的判断是：底座模型越强，应用层越受益；但物流场景要的不是最强模型，而是ROI最好看的模型。</p>\n  <p>目前，新石器的技术投入集中在三个方面：端到端模型与数据飞轮、产品效能迭代以及云端调度系统。余恩源表示，单个城市无人车密度超过有人商用车，负责调度的云端大脑便会成为刚需。而这套调度系统，非常依赖实际运营经验。</p>\n  <p>2026年被新石器定义为无人配送爆发元年，政策持续利好，规模同比增长约三倍，但更值得注意的是场景边界的松动。</p>\n  <p>过去无人车主战场是电商快递，今年开始外溢到工厂内部运输、仓到仓、服装集群、产业园区。余恩源坦言，不少场景是被合作伙伴拽进去的，原本以为不成立，跑起来才发现成本结构较专用AGV和面包车更好。</p>\n  <p>对于行业是否格局固化的提问，余恩源的回答是：现在只是春秋时代。</p>\n  <p>一方面，头部公司在车队规模、供应链、路权积累上已经拉开身位；另一方面，场景仍在扩散、成本曲线仍在下探、政策细则仍在试点。尾部没清，头部也没稳。</p>\n  <p>余恩源在沟通会的最后表示，新石器把安全写进了全员OKR第一条，他认为，未来三年最大的变量，不是模型多强，而是安全与舆情。一次恶性事件或大面积干扰公共交通，都可能让地方政策收紧。</p>", "category": "tech", "published_at": "2026-10-30T07:25:27+00:00", "fetched_at": "2026-10-31T03:49:55.514576+00:00", "fingerprint": "3227b12918fbc110"}, {"source": "36氪 - 最新文章", "title": "AI初创企业的下半场：钱往哪里去？", "url": "https://36kr.com/p/4048078906800642?f=rss", "summary": "<p>作者｜王晗玉</p>\n  <p>编辑｜张帆</p>\n  <p>2026年的风险投资市场，正在上演一场前所未有的“AI大分流”。据Crunchbase数据，今年上半年全球初创企业融资额约5100亿美元，已超过去年全年；仅第一季度，约80%的风险投资便流向了AI公司。OpenAI单轮融资1220亿美元、估值冲上8520亿美元，Anthropic则以9650亿美元估值反超，成为全球最有价值的AI初创企业。</p>\n  <p>狂热之下，分化同样剧烈：头部模型公司融资能力依旧惊人，大量垂直应用却是有用户、难见利润。</p>\n  <p>市场不再比模型参数，开始比应用落地，“AI下半场”的拐点叙事，正在取代此前的算力军备竞赛——对于仍在牌桌上的初创企业而言，生存规则已经变了。</p>\n  <p>当全球资本涌向高增长机会，下一站究竟在哪里？11月2日至3日，香港金融科技周×StartmeupHK 2026即将举行，市场目光将再度聚焦这座连接内地创新与全球资本的城市。在科技周启幕前，36氪与华映资本创始管理合伙人季薇、香港投资推广署署理初创企业总裁吕缙勇进行了深入交流，试图回答一个问题：AI初创企业的下半场，什么才是真正的判断标准？</p>\n  <h3><strong>拼过模型参数，再拼“数据飞轮”</strong></h3>\n  <p>“阅项目”无数的季薇先给出一套大致的分析框架：AI投资可分为基础层、模型层与应用层三层。基础层涵盖GPU、高速光互联、先进封装、存储体系乃至供电热管理，以及推理调度、异构算力适配、数据治理与安全等系统级环节。</p>\n  <p>外界对“算力投入过度”的质疑，在她看来更多是节奏问题，而非方向问题——<strong>基础设施投入与收入形成之间，天然存在周期错配</strong>。正如2000年前后，海底光缆与交换机先于互联网公司的盈利而繁荣，彼时谷歌甚至还没有收入。</p>\n  <p>真正决定一个细分赛道能走多远的，是她数次提及的“数据飞轮”：<strong>数据以什么成本获取、以什么形态进入模型，能否在短时间内形成正反馈、反哺模型能力</strong>。</p>\n  <p>这也是为什么编程是目前收入规模最大的AI应用——代码对错一目了然，正反馈极强；而视频生成虽需求真实，却因反馈难以标准化，模型提升的难度高得多。正如OpenAI停掉Sora，Anthropic从未碰过视频，背后正是对这一点的判断。</p>\n  <p>市场的验证来得很快。Cursor年化收入在一年内从突破10亿美元涨至约26亿美元，GitHub Copilot付费用户已超470万。在季薇看来，任何一个AI应用赛道的天花板，最终都取决于市场规模与用户注意力总量，而非单点技术炫技。</p>\n  <p>吕缙勇则从需求侧补充了另一层标准：能否解决真实、高频、高价值的痛点，客户是否清晰、有付费意愿，技术壁垒能否持续转化为成本优势——经历过互联网泡沫洗礼的人都知道，泡沫破裂后活下来的公司，无一例外先站稳了商业模式。</p>\n  <h3><strong>具身智能：最热闹的赛道，最“早期”的阶段</strong></h3>\n  <p>在季薇眼中，具身智能依然是AI应用里最活跃的领域，也是最“早期”的领域。模型发布与评测的频次仍在持续，说明最聪明的大脑还在涌入，只是尚未等到属于它的“chatGPT时刻”——<strong>她给出的保守时间预期是5-10年，但非常相信这个时刻会到来</strong>。</p>\n  <p>一个被反复澄清的观点是：具身智能不等于人形机器人。它可以是海底的仿生形态、低空的自主飞行器，也可以是太空中的柔性机器人，去做人类到不了的地方的工作。</p>\n  <p>华映资本在这些方向均有布局，包括低空自主飞行机器人，以及中国首家在太空完成验证的柔性机器人；其投资的具身智能世界模型公司——自变量机器人——也是目前在香港活跃的世界模型团队之一。</p>\n  <p>吕缙勇同样认为，具身智能是“模型+硬件+数据+场景反馈”的系统工程，各环节尚未真正咬合：打螺丝仍需人类工程师在旁边兜底，物流搬运的稳定性也远未达标，眼下能落地的更多是巡逻、巡检这类相对受限的场景。</p>\n  <p>市场的预测也在印证这种“早期”共识。摩根士丹利预计，中国人形机器人市场规模今年约20亿美元，2030年或达150亿美元；不同机构对广义具身智能的测算口径差异明显，从数千亿到万亿不等。</p>\n  <p>对香港而言，<strong>AI与智能制造、AI for Science、绿色能源管理，以及金融、医疗、物流等高价值企业级应用，正是未来3-5年最有潜力的方向</strong>。</p>\n  <p>吕缙勇特别提到，香港的研究型大学沉淀了大量科研IP，AI介入实验室的意义在于把“爱迪生式的试错”大幅缩短——从干实验到湿实验，减少人为失误、提高命中率，这可能催生一批高价值的突破性成果。而大湾区的制造生态正在与香港的科研资源加速融合，也让具身智能的供应链有了更现实的落地土壤。</p>\n  <h3><strong>现金流成为创始人的必修课</strong></h3>\n  <p>当36氪问及那些手头现金快撑不下去的中小AI初创公司该何去何从，吕缙勇的建议很直接：<strong>尽早做一次冷静的现金流分析</strong>，聚焦能带来正向现金流的业务，砍掉非核心开支；资金见底时，应坦诚与战略投资者沟通，而非等危机爆掉后才求助。政府补助也应尽早纳入规划，而非临到融资时才想起申请。</p>\n  <p>季薇也提到，<strong>现金流管理是创始人的必修课</strong>，“口袋里只剩1-6个月的钱，还在问该怎么花，多半要反省自己的规划能力”。</p>\n  <p>在她看来，<strong>业务的里程碑必须与融资的里程碑咬合推进</strong>——从政府科研经费、早期机构的成果转化支持，到市场化机构，再到能带来订单与资金的产业资本，每一步都要提前规划，而不是埋头干一年再抬头找钱。</p>\n  <p>她也认为，并购不应被视为危机管理，而是发展过程中的主动选择，真正的“1+1&gt;2”才值得做。</p>\n  <p>结合过往投资案例，季薇专门提到一个真实的转型样本：一家原本做培育钻石自动化切割打磨的公司，凭借核心工艺积累转向芯片堆叠所需的散热材料，在半导体领域找到了第二曲线。在她看来，AI在各行各业的应用都还在早期，拥有核心技术壁垒的公司，换个赛道再试一次，并不算晚。</p>\n  <h3><strong>如何答好“出海”这道题</strong></h3>\n  <p>谈及即将到来的香港金融科技周×StartmeupHK 2026，季薇透露，她将在科技周上与另外两位嘉宾带来一场对话，主题是《全球资本新动向：解码下一个黄金投资赛道》，“其实跟今天聊的还挺类似的”。吕缙勇笑着接了一句：“今天已经剧透了。”</p>\n  <p>而站在香港市场，话题也自然落到了内地企业出海这道必答题上。</p>\n  <p>季薇专门提到华映资本参与投资的协作机器人企业法奥机器人，这家公司在2025年位居中国协作机器人总销量第一、海外出货量第一。在季薇看来，它的发展很契合一句话——“Think Global, Act Local”（全球化思考，本地化运营）。</p>\n  <p>季薇认为，传统出海路径往往是先设海外主体、参展、签代理，再找客户需求；但真正有效的路径或许恰是从客户出发，想清楚对方需要什么、预算多少、谁做采购决策、替代方案有哪些、数据如何处理、售后由谁负责等问题。</p>\n  <p>因此，<strong>数据合规、知识产权、出口管制与安全审查等一系列规划要前置到产品设计阶段，而不是铺完市场再补课。</strong>她也不建议一上来就全球铺开，而是先在一个标杆市场跑通，再向相邻市场复制。</p>\n  <p>吕缙勇对此的补充是，跑业务除了要快，更要精准接地气。企业出海要尽量避免把内地“跑省份”的复制打法直接搬到海外——每个城市的文化、法规甚至历史背景都不同，尊重当地规则、组建本地销售与交付团队，接地气地跑业务往往比技术本身更重要。</p>\n  <p>在这套出海叙事里，香港的独特角色也正被重新理解。研发、供应链与应用场景可以放在一小时生活圈内的大湾区，国际融资、区域总部、合规架构与人才引进则落在香港。依托普通法体系与国际仲裁经验，海外客户更愿意与香港主体签约；香港也正帮助企业把内地的创新能力，转化为国际客户可以长期信任的商业关系。</p>\n  <p>过去一年多，华映资本把香港视为“再创业”的基地：申请牌照、筹备港币基金，未来投向将面向全球优秀创业者与前瞻性技术突破，并深度参与香港本地高校的科研转化。同时据季薇观察，越来越多的风险投资同行也正在加强在香港的布局。</p>\n  <p>来到AI下半场，香港这个连接内地创新与全球资本的双向门户，也不再只是大企业的上市终点站，而正成为更多AI初创企业的出海桥头堡。一如吕缙勇送给出海企业的建议：出海之前，先来海边看看。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_6fa547b36f8a45fe87f30b87e20bf256@5623968_oswg104094oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-10-30T08:00:29+00:00", "fetched_at": "2026-10-31T03:49:55.514570+00:00", "fingerprint": "456d00e6a36ef3d0"}, {"source": "36氪 - 最新文章", "title": "第一批用上WorkBuddy的乙方，已经提前下班了", "url": "https://36kr.com/p/4048085285763584?f=rss", "summary": "<p><strong>撰文｜深海</strong></p>\n  <p><strong>封面来源｜《装腔启示录》截图</strong></p>\n  <p>乙方，大概是职场里最“时间贫困”的一群人。</p>\n  <p>客户的需求就是个盲盒，在打开对话框之前，你永远不知道这次是“简单优化一下”，还是“我们换个方向试试”。广告公司的大楼灯总是亮到深夜，只因甲方的意见历经层层审批，在最后关头才能抵达乙方的信箱。</p>\n  <p>乙方的时间总是非常紧迫的。但工作做不完倒也真不是因为没灵感，恰恰相反，很多时候是甲方要的太多，而每一份创意都要被单独包装成一套能汇报、能交付的完整材料。很妙的创意，都要经历一整套形式整改，把它翻译成客户听得懂的逻辑、老板看得见的重点，以及设计、文案和渠道同事都能够执行的方案。</p>\n  <p>所以乙方听起来是内容行业，说穿了却是流水线上的搬砖工。</p>\n  <p><strong>好在，打工人已经学精了，懂得给自己的工作“摇人”——他们接上了AI同事，把那些最耗时间的执行工作交出去，终于有机会提前下班。</strong></p>\n  <p>这位新同事，就是WorkBuddy。</p>\n  <h2><strong>AI同事，为打工人的创意“续命”</strong></h2>\n  <p>乙方的工作就像一场接力赛。想出一个好点子只是跑完了第一棒，后面还有资料梳理、方案搭建、文案打磨、视觉呈现，环环相扣地等待着你，以及让你血脉喷张的“再调一版看看”。</p>\n  <p><strong>谁懂一个人跑完这些环节的无力？但接上一位靠谱的AI同事后，打工人就像有了一位外包供应商，不再是单打独斗。</strong></p>\n  <p>互联网大厂打工人张六一，每逢提案前48小时，焦虑型人格就会准时上线。项目组常常是平地一声惊雷，又整了什么需要宣传的新活儿，接着就请策划同事迅速协同，把他们的“半成品”包装成还值得一看的新品。这种强行“从无到有”的需求已经不是第一次了，每次她都要同时准备几个方向，请各位同事审阅，挑一个还能看的继续改。</p>\n  <p>过去她经常要处理突发需求到深夜1点多才打车回家。但成为职场老油条后，她总结出了一套新的应对策略——她会在记事本上罗列几个核心概念，写下她根据过往经验包装出的金句，以及那些一闪而过的想法雏形，它们仅仅出于好像可以延展，但还暂时无法向他人展示的阶段。</p>\n  <p><strong>接着，把这些key message打包丢给WorkBuddy，让它拆解概念，形成三套完整的传播方案。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_7442dba0e6bc4454a28dabc688af05cf@6062546_oswg164507oswg1080oswg802_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>紧接着，AI同事就会帮她拆出待办清单：人群怎么分析，亮点怎么提炼，传播主题怎么确立，渠道怎么规划。AI同事早就帮她预设好了难缠的同事会怎么challenge她，并把没写清楚的板块一一列举。</p>\n  <p>方向逐渐清楚后，WorkBuddy还能继续协助梳理选题、打磨文案、提供Slogan备选。等六一拍板后，再把方案整理成一份完整的PPT。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4ce34b473e034209893ce9b27cf5b979@6062546_oswg359275oswg1080oswg797_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>根据六一的经验，虽然AI大模型在创意上还没有办法给她太多的帮助，但在完成这些琐碎的执行工作上，效果拔群。<strong>这就是人脑和人机最高效的组队方式。她称之为让AI同事给创意“续命”。</strong></p>\n  <p>这种工作模式，尤其适合那些挑剔的“感觉者”甲方。如果客户看完表示“内容没问题，就是整体感觉不太对”，或者说“案例可以，但文风/形式还不够趣味”，那她也不必逐字逐句修补，直接几个抽象的形容词丢过去，就能让方案统一翻新。就这样，小张终于摆脱了“PPT工人”的定位，变回了真正负责判断方向的策划。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_88c358343e5e4963884cca50034595bc@6062546_oswg282169oswg1080oswg798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>当然，方案通过仅仅只是个开始。在创意进入落地阶段，执行层面的琐碎才真正开始。</p>\n  <p>在无数繁琐的事务中，六一最苦恼的是整理活动出席嘉宾和媒体投放名单。她经常需要在一长串达人名单里，理清人员、报价、档期和投放内容区隔度。这么多投放资源，人工整理相当费眼，对ADHD来说还相当不友好。经常是做到一半被另一位嘉宾的信息吸引注意，又忘记了手头刚才在做什么事。</p>\n  <p>正因如此，AI工作台出现后她觉得自己是最大的受益者。<strong>现在她会把这些突然出现的update，直接复制给WorkBuddy，让它整理成结构清晰的排期表和预算表。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_f94944f1c4fc4abda5e33da49b3405a5@6062546_oswg132367oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>前段时间她追了热播剧《早春晴朗》，其中有个被广告人猛猛吐槽的过时桥段：女主因为能记住Excel快捷键被同事夸赞，成功职场救火。<strong>Excel列表之前确实让六一很是头疼，但现在，她可以直接口头描述，让WorkBuddy帮自己修改表格信息，效率大大提高。</strong></p>\n  <p>有了AI同事的加入后，人类能把更多精力投入在创意本身，发挥主动性。</p>\n  <h2><strong>偷偷用上AI同事的打工人，约等于拥有一支广告团队</strong></h2>\n  <p>其实做内容的人，多少都经历过这种时刻：大脑放空的时候文思泉涌，一坐到电脑前就又四大皆空。</p>\n  <p>内容行业的人都认可一个道理——创意是需要滋养的，否则它就像水一样从大脑皮层上滑过，最后只留下一句“我刚才好像想到一个特别好的东西”。<strong>而有了AI同事，相当于身边多了一支24小时在线的执行团队，它专门负责把转瞬即逝的想法拓展为成熟的内容。</strong></p>\n  <p>在某中小厂做渠道运营的李狒狒对此深有体会。不如说她的主要工作就是为同一套宣传物料做适配，针对不同的平台“入乡随俗”。视频号、公众号、小红书、微博、抖音，热搜话题要有针对性，封面要匹配平台调性，文案的语气、输出角度、整体气质都要相应改变，不能完全照搬。</p>\n  <p>看起来，狒狒好像是在做同一件事，却仿佛同时完成了五个项目。现在她会把这“五个项目”都外包给AI同事——一套标准化素材丢给WorkBuddy，让它生成不同平台需要的尺寸、风格和文案。</p>\n  <p>狒狒再也不必再把下班时间献给机械性的调整工作，她的“一人团队”里已经多了一位专管渠道适配的执行，值得一提的是<strong>WorkBuddy自带Skillhub，已经接入了小红书、公众号、抖音和视频号等运营技能，连不同渠道的表达方式也预存好了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_1c01b0cc45b34592826dde09db33fac5@6062546_oswg391412oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>找图和做视频，则是另一个时间黑洞。</strong>尤其是制作Vlog、花絮等内容时，经常会受到不同协作方发来的细小需求，可能只是某个画面的某一帧要加个马赛克；某个画面有些单调，需要配一点后期花字；这一帧画面的人脸偏暗，能不能调色调亮一点。</p>\n  <p>这些细小的需求，每次返工都要从头到尾生成修改一遍，尤其是AI生成素材风格不统一，就更容易让画面产生割裂感。在多个需求涌来时，就会造成更大的时间浪费。</p>\n  <p><strong>狒狒现在的做法，先用WorkBuddy的设计创意模式确定一张满意的样图，再让整套素材沿着这个方向生成。</strong>WorkBuddy接入了腾讯Miora，在生成平面、视频等多模态视觉资产时可以尽量保持统一的风格。WorkBuddy首页的创意设计专区，也覆盖了平面、视频、网页、品牌等不同创作方向。</p>\n  <p>并且在WorkBuddy里，她可以多窗口执行任务，一边是同步改着短视频脚本，一边是等着Miora产出成果，哪里不合适就当场点进Miora画布调整，不必等一整套内容做完后，才发现内容存在割裂感，再调回去重新返工。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4cc18f7a4ecd46aba301b0a08de5551a@6062546_oswg857295oswg1080oswg801_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>现在，狒狒只需要有一个WorkBuddy，不需要再打开多个软件窗口来回切换了。她记得自己刚开始工作时，还试图和公司申请配备一台显示器，好多窗口协作，但公司以“仅给技术部门配备显示器为由拒绝了”，她只能每天羡慕隔壁程序员的显示器。</p>\n  <p><strong>好在现在不用担心这个问题，狒狒可以把从描述想法到拿到素材的过程，都收进WorkBuddy的同一个任务里。乙方总把更下游的执行方叫“丙方”。如今，乙方打工人也能召唤自己的“AI丙方”了。</strong></p>\n  <h2><strong>乙方的效率差距，从AI同事开始拉开</strong></h2>\n  <p>越来越多打工人发现，召唤一位AI同事，简直就是职场大减负。</p>\n  <p><strong>重点不是AI能帮你把这件事做得更快，而是有些事能被丢出去，终于不必由你亲手做了</strong>——当内容策划、文案创作和视觉制作中的部分工作可以由AI协助推进，乙方的工作重心也会随之变化。</p>\n  <p>过去，一个人的精力常常被切割成许多小块——刚进入创意思考，就要跳出去处理格式；刚准备研究用户画像，又被拉去微调素材。等回来继续之前的工作，又要从头开始调整状态。一天看起来很忙，真正留给判断和洞察的时间却不多。</p>\n  <p>当AI同事接手部分重复性工作后，创作者才有机会把更多精力放回判断创意方向、理解客户需求和打磨内容细节上。与此同时，一个人的内容生产能力也有了拓展的可能。多平台、多规格的任务可能是一刻钟就被解决，冗长的流程也被缩短成了一个简略的任务窗口。<strong>一个人，也能借助AI同事成长为能够统筹内容落地的多面手。</strong></p>\n  <p><strong>这种变化未必会让每个人都立刻“升职加薪，走向人生巅峰”，但至少能让时间重新变得可支配。省下来的精力，可以继续研究内容，也可以拿来享受生活。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_d4528d17c17c4f6c8be364dc022f9e66@6062546_oswg768708oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图为AI生成</p>\n  <p>或许你会发现，某些同事最近的精神状态变好了，离开办公大楼也是越来越早了——那可能AI同事已经悄悄上岗了。</p>\n  <p>乙方的下一轮竞争不是比在岗时间。<strong>当大家的AI工具都走上正轨，真正的差距会转向谁能稳定组织工作流，谁能更快更清楚地拆解需求，谁能让人和AI各自做擅长的事。</strong></p>\n  <p>那么，从WorkBuddy开始这次职场升级，会是个不错的选择。它不是一个来抢饭碗的对手，更像一位终于到岗的好帮手。可以先试着把手里最烦的一件小事交出去，像是把零散的Brief理成清晰的需求清单，给卡住的Slogan补几个能继续讨论的方向，把定下来的创意概念整理成客户看得懂的提案，再生成几套适配不同平台的视觉，给老板一个直观的感受……</p>\n  <p><strong>要知道，创意行业的打工人省下来的不只是几个操作步骤，更是被反复打碎的注意力。</strong>少一些在琐碎执行里的无谓消耗，就能多留一点时间给洞察提炼、审美积累和生活感受。希望每一位引入AI同事的打工人，都能天天准时下班。</p>", "category": "tech", "published_at": "2026-10-30T08:12:08+00:00", "fetched_at": "2026-10-31T03:49:55.514564+00:00", "fingerprint": "08e2266920ff871f"}, {"source": "36氪 - 最新文章", "title": "72道工序、灵巧手进厂打螺丝：临界点数采手套发布，要补上触觉数据缺口｜最前线", "url": "https://36kr.com/p/4048092462070017?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>2026年10月29日，智元创新日·灵巧操作分论坛上，临界点（AGILINK）对外展示了灵巧手走向工业真实工况的关键进展。</p>\n  <p>在绍兴卧龙产线的POC验证工位，OmniHand灵巧手完成了对同系列灵巧手的出厂整机性能测试，连续跑完72道工序，从物料上料、螺丝锁固到自检、下料归位，全程无需人工实时干预。整套流程单轮耗时8.5分钟，比熟练人工的8分钟慢30秒，任务成功率达98%，可连续作业8小时。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_218895dffdcf401db1fabe4618a1aa8d@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">OmniHand灵巧手对同系列灵巧手进行出厂整机性能测试（图源/企业）</p>\n  <p>其中，螺丝锁固挑战最大。防脱螺丝本身存在毫米级晃动，叠加螺丝枪自重、线缆牵拉带来的反冲，手部只要偏移1毫米，枪头末端偏差就会放大到3至4毫米。测试过程中，团队还人为制造了机械臂推动、工装底座偏移、光照变化等干扰，灵巧手依靠视觉与触觉联动实时纠偏，遇到拧入失败也能自动回退、重新对位。</p>\n  <p>整套作业的稳定性，来自真机强化学习对单步操作能力的优化，以及工业部署智能体框架的支撑。后者负责工序校验、失败回滚与工站之间的状态同步。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4ebb3902e3dc4718bb396d2a69a079bb@6022551_oswg2234240oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">绍兴卧龙产线（图源/企业）</p>\n  <p>临界点CEO乔天杰将这次产线测试定义为灵巧手行业从开发态走向部署态的标志性节点。“开发态比的是Demo精不精彩，部署态考核的是节拍、成功率、稳定性和ROI。”</p>\n  <p>在他看来，夹爪经过数十年迭代，可以覆盖工业场景70%至80%的确定性工序；灵巧手的目标是攻克夹爪难以胜任的余下20%至30%复杂精细操作。使用通用灵巧末端执行器，可以适配多类工序，减少传统产线中专机专用带来的改造成本与场景局限。</p>\n  <p>产线POC验证了硬件与作业框架在真实工位上的可行性，同时也把行业长期存在的数据短板摆上台面。</p>\n  <p>临界点首席具身科学家黄碧丹指出，当前多数灵巧操作模型训练依赖纯视觉数据集，缺失力反馈、触觉滑动等真实物理交互信息。模型在仿真中表现优异，迁移到真实物理环境却极易失效；温度、剪切力、接触形变这类触觉维度，很难靠仿真生成，必须经由真实物理交互采集。</p>\n  <p>而主流的两类数据采集路径各有短板：真机遥操采集的数据质量高，但成本昂贵、极度依赖专业操作人员，难以大规模扩量；第一人称Ego人手视角数据获取门槛低、场景覆盖广，但单纯依靠视觉跟踪，缺少真实触觉信息，精度有限，更多仅适合预训练，不足以支撑高精度精细操作任务。</p>\n  <p>针对上述痛点，临界点在活动上正式发布OmniGlove Pro数采手套，并开启量产交付，试图从数据源头确立新的质量评判标准。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_5c449b026e404bb0b1d0d955f2786d3b@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">OmniGlove Pro数采手套（图源/企业）</p>\n  <p>传统数采多以视觉层面人手动作复刻相似度作为标尺；“真机Ready”的核心逻辑是，人手在特定场景完成操作，经手套采集与后端处理后，机器人本体能在相同场景条件下复现完整任务，以此作为数据合格的核心判定依据。</p>\n  <p>硬件层面，OmniGlove Pro指尖采用EMF磁场定位与IMU抗干扰融合方案，全手布置高密度触觉感知点位，位姿与触觉信号保持高帧率输出，整只手套重量控制在较轻水平。在织物手套形态下，EMF提供指尖定位基准，全手触觉点位用于补偿柔性形变带来的��端定位误差。</p>\n  <p>形态选型上，团队选择织物手套方案，对日常操作侵入性更低，更适合长时间、大规模持续采集。同时，临界点自研的OmniHand灵巧手本体出厂时同样配置织物触觉手套，数采手套与执行本体在触觉点位分布和外形上尽量对齐，以降低从人类采集数据向机器人执行端映射时的信息损耗。</p>\n  <p>官方数据显示，截至2026年10月，临界点OmniHand系列灵巧手累计量产突破1.5万台。乔天杰认为，万台级量产是灵巧手走向商用部署的基础门槛，只有到达这一量级，供应链交付稳定性、整机良率收敛和成本下探才具备现实条件。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_23795ca2a8284b0487931e7967f7213f@6022551_oswg4364776oswg6000oswg3375_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智元创新日·灵巧操作分论坛（图源/企业）</p>\n  <p>依托工业与商用服务两条真实部署线的持续迭代，临界点灵巧手已在珠海长隆商用交互场景实现常态化运行；卧龙电驱的灵巧手工位预计年内完成正式产线并线。</p>\n  <p>从卧龙产线的工位验证，到OmniGlove Pro建立“真机Ready”的数据采集标准，临界点正试图跑通一条闭环路径：真实部署场景产生交互数据，高质量采集数据反哺模型迭代，迭代后的模型再解锁更多新工序。</p>\n  <p>活动现场，临界点宣布向本体厂商、场景集成方和模型研发团队开放触觉数据、操作模型与工业部署框架，以生态协作的方式扩大数据供给和场景覆盖。</p>", "category": "tech", "published_at": "2026-10-30T10:57:32+00:00", "fetched_at": "2026-10-31T03:49:55.514557+00:00", "fingerprint": "810e444560fae6e2"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨币安遭黑客攻击，致其30亿美元资产被冻结；“张雪机车”商标回归张雪；美股收盘纳指重挫700点，英伟达市值蒸发1.4万亿元", "url": "https://36kr.com/p/4049089058126344?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <ul>\n   <li>全球“股王”再度易主，传苹果2028年推出大屏折叠iPad</li>\n   <li>姆巴佩曾代言饮品被商家清理库存，部分门店单日销量为0</li>\n   <li>日本无印良品运营商称超2700万条用户信息或外泄，MUJI中国回应国内数据独立存储</li>\n   <li>首付降到4万以内，特斯拉推出“5年0息”购车方案</li>\n   <li>11月5日起，国内航线燃油附加费再上调</li>\n   <li>野人先生获首轮融资</li>\n  </ul>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>币安遭黑客攻击，致其30亿美元资产被冻结</strong></p>\n  <p>10月30日，全球最大加密货币交易所币安（Binance）曝出重大安全突发事件，市场多方消息显示该交易所热钱包疑似遭遇黑客入侵，导致其冻结了逾30亿美元的资产，并引发数字代币价格大幅下挫。币安方面表示，团队已注意到有关潜在安全问题的报告并正在积极调查，目前用户资金完全安全。此前，币安已暂停提币和币安Alpha交易。</p>\n  <p>加密货币存储公司Ballet Global Inc.创始人Bobby Lee表示，币安遭黑客攻击中被窃的比特币，恐怕已经不可能追回。Lee在周五接受采访时表示，那些比特币都一去不返了。被窃的比特币全都已经落到黑客手中。业界形容，这是加密货币圈历来规模最大的黑客攻击。币安已暂停所有存取，并承诺承担所有损失。（财联社）</p>\n  <p><strong>“张雪机车”商标回归张雪</strong></p>\n  <p>日前，重庆市知识产权局披露，“ZXMOTO”等一批核心商标完成注册，权利归属重庆张雪机车工业有限公司，历经多轮博弈，“张雪机车”这一品牌名称在法律层面正式回归创始人张雪。张雪呼吁广大创业者，创业之初就要及时布局注册自有商标，守住品牌的法律防线。业内专家表示，张雪机车的经历提醒广大创业者，知识产权保护不是成名之后的锦上添花，而是创业之初就应当做好的未雨绸缪。(央视财经)</p>\n  <p><strong>美股收盘：纳指重挫700点；英伟达市值一夜蒸发1.4万亿元；英特尔暴跌28%</strong></p>\n  <p>美东周五美股集体收跌，科技股遭遇抛售，纳指大跌2.86%，创下6月以来最大单日跌幅。英伟达跌4.22%，单日市值蒸发约1.4万亿元；英特尔暴跌28.58%，创历史第二大单日跌幅，存储、光通信、半导体板块普遍重挫。苹果市值反超英伟达，重回全球第一。资金转向防御板块，医疗、必需消费品走强，油价因地缘紧张涨超2%。纳斯达克中国金龙指数小幅收跌0.27%。（财联社）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>Anthropic成为SpaceX最大单一客户，每月贡献或高达约30亿美元</strong></p>\n  <p>知情人士称，Anthropic成为SpaceX最大单一客户，第三季度为马斯克旗下这家横跨人工智能、卫星和火箭业务的公司贡献了逾三分之一的营收。SpaceX上周在一份申报文件中表示，上季度约34.5%的营收来自AI部门的单一客户。该部门现名为Super Intelligence，提供算力服务。因涉及未公开信息而不愿具名的知情人士称，文件中被称为“客户B”的就是Anthropic。Anthropic的IPO披露文件显示，该公司同意在截至2029年的合同期内最多支出1205亿美元。文件显示，从今年12月开始，这相当于每月约31亿美元。（财联社）</p>\n  <p><strong>MiniMax H3开源生态持续拓展，英伟达团队开源4K视频增强方案</strong></p>\n  <p>36氪获悉，英伟达联合麻省理工的Efficient-Large-Model团队，在Hugging Face上线基于MiniMax H3的Open-H3-Regenerate-2K视频增强项目，权重与推理代码同步开放。该方案可将低清视频草稿重生成高清视频，支持2K输出、最高原生4K重生成，只训练新增细化LoRA，搭配潜空间放大器、稀疏注意力等技术提速。单张B200 GPU处理5秒2K视频，优化后耗时压缩至22.45秒，速度提升近3.9倍；评测显示其感知画质优于官方H3-Regenerate-2K API。MiniMax H3自8月开源后热度高涨，一月下载超2400万次，衍生模型超300个，海内外多个团队持续开发适配工具与衍生模型。</p>\n  <p><strong>启元机器人推出PrimeSim世界模型，登顶WorldSimProbe LIBERO榜单</strong></p>\n  <p>36氪获悉，10月30日，启元机器人推出PrimeSim世界模型并登顶WorldSimProbe LIBERO榜单，刷新机器人仿真表现。PrimeSim是一款面向机器人训练的世界模型仿真器，为机器人构建可交互、可试错、可持续学习的虚拟世界，让策略验证与强化学习能够在其中高效开展。测试中，利用它进行强化学习，策略成功率从61.7%提升至73.2%。</p>\n  <p><strong>记忆张量MemT 1.0开源10天累计下载破10万</strong></p>\n  <p>36氪获悉，近日，记忆张量（MemTensor）发布消息称，其记忆原生模型MemT 1.0自10月20日上线Hugging Face、GitHub以来，累计下载量已突破10万次，日均下载超1万次。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>全球“股王”再度易主，传苹果2028年推出大屏折叠iPad</strong></p>\n  <p>美股科技股回调，苹果周五跌幅更小，市值5.03万亿美元，再度反超英伟达（4.93万亿美元）重夺全球市值第一，英伟达单日市值缩水约1.4万亿元，这是苹果7月底短暂超越后再次登顶。另有消息称苹果正在测试首款大屏折叠iPad，展开尺寸可达18~20英寸，参考华为MateBook Fold设计，目标弱化屏幕折痕，预计2028年发布，康宁、GIS业成集团参与供应链；行业预估首年出货50‑100万台，定位高端，定价高昂，该项目尚未获苹果官方确认，上市时间存在不确定性。（财联社）</p>\n  <p><strong>光模块“易中天”前三季度合计净赚357亿元，三家龙头业绩大幅增长</strong></p>\n  <p>随着中际旭创、新易盛、天孚通信三季报全部披露，在全球AI算力基础设施建设拉动下，这三家A股光模块龙头前三季度合计营收1061.48亿元，归母净利润合计约356.93亿元，整体保持高增，单第三季度合计归母净利润133.09亿元。分企业来看，中际旭创营收、利润领跑，前三季度营收接近700亿元，净利润超220亿元；新易盛前三季度营收超318亿元，净利润超113亿元，增长势头强劲；天孚通信营收规模47.5亿元相对更小，但净利润超20亿元，利润增速跑赢营收增速。（界面新闻）</p>\n  <p><strong>阿里巴巴、苹果达成合作，千问将集成至Apple智能</strong></p>\n  <p>阿里巴巴与苹果宣布达成合作，把千问大模型集成进Apple智能，中国用户可在Siri、写作工具以及视觉智能当中调用千问的图文理解、内容生成能力。相关功能11月4日随iOS开发者Beta版开启测试，12月iOS 27.3正式版面向国内用户上线。（科创板日报）</p>\n  <p><strong>日本无印良品运营商称超2700万条用户信息或外泄，MUJI中国回应国内数据独立存储</strong></p>\n  <p>10月30日，无印良品日本运营商良品计划发布声明，MUJI APP遭非法访问，最多约2726万条用户信息存在外泄风险，涉及邮箱、出生日期、性别，不含信用卡、姓名、住址等信息，公司提醒用户警惕钓鱼邮件。同日MUJI中国回应，该事件仅影响日本APP用户，国内会员信息存储在独立服务器，按本地法规不会传输至境外。（财联社、界面新闻）</p>\n  <p><strong>马斯克公布Neuralink脑机新产品进展，盲视技术静待监管审批</strong></p>\n  <p>马斯克在社交平台X披露脑机公司Neuralink两款产品最新进展，首款产品“心灵感应（Telepathy）”支持仅凭意念和电脑、他人交流，马斯克预测数年内输出带宽将超越人类说话、打字，远期希望可以帮助失能患者恢复手脚活动能力。第二款产品“盲视（Blindsight）”工程层面已经就绪，可帮助失明、先天失明患者重获光明，该项目拿到FDA突破性医疗器械资格，仅代表加速审评，不等同确认安全有效。该产品已完成猴子长期动物实验，一只猴子植入设备已达三年，尚未公开人体植入结果，人体植入计划需要等待监管放行。不同于读取大脑信号的心灵感应，盲视是向大脑写入视觉信息。（科创板日报）</p>\n  <p><strong>恒大物业：要约人与卖方订立有关公司约51.016%股份的购股协议</strong></p>\n  <p>36氪获悉，恒大物业在港交所公告，董事会已获清盘人及要约人通知，于10月28日（交易时段后），彼等订立购股协议，据此，卖方已有条件同意出售，而要约人已有条件同意收购销售股份（即合共55.15亿股股份，占于购股协议日期已发行股份总数的约51.016%，且为各卖方在公司的全部持股），总现金代价为40.26亿港元。公司已向联交所申请股份于10月30日上午9:00起恢复买卖。</p>\n  <p><strong>于东来发文支持消费入座，建议餐厅可拒绝外带食物就餐</strong></p>\n  <p>10月30日，胖东来创始人于东来在社交平台发文表示，希望培养良好商业秩序与消费习惯，建议制度支持消费入座，兼顾商家与消费者权益，同时支持餐厅行业拒绝外带食物就餐。（界面新闻）</p>\n  <p><strong>姆巴佩曾代言饮品被商家清理库存，部分门店单日销量为0</strong></p>\n  <p>10月29日，广州线下市场传出消息，姆巴佩涉华不当言论风波之后，其曾经代言的饮品遇冷，有商家反馈该款饮品单日销量为零，商家不愿继续售卖，目前正在清理剩余库存，不少消费者也表示相关产品已经无人问津。此前多家国内品牌已经官宣终止和姆巴佩的合作，坚决对伤害民族感情的言行零容忍。（头条新闻）</p>\n  <p><strong>首付降到4万以内，特斯拉推出“5年0息”购车方案</strong></p>\n  <p>特斯拉推出全新“特从容”5年0息分期购车方案，进一步降低购车门槛。以Model 3后轮驱动版为例，首付3.99万元起，尾款3.99万元，五年月供最高约2429元，全程免息。原有5年0息方案首付门槛也由7.99万元下调至3.99万元，五年月供最高约3094元，无尾款。同时车型配套限时优惠，Model 3限时降价1万元，Model Y限时降价4000元。（财联社）</p>\n  <p><strong>周六福发布声明回应昆明门店大额黄金交易纠纷</strong></p>\n  <p>10月30日，周六福珠宝发布声明表示，媒体报道中曹女士的相关陈述仅反映事件部分情况，目前案件处于法院审理阶段，涉案款项性质有待查明，一切以法院生效裁判为准，公司正积极配合司法机关处理。据此前报道，曹女士2026年1月在周六福昆明全资子公司门店支付361.8万元定金购黄金，既未提货也未收到退款；门店经理汤某东涉嫌职务侵占已被刑拘，曹女士起诉要求公司承担连带责任，法院已立案并完成财产保全，冻结账户可用金额434.16万元。（财联社）</p>\n  <p><strong>三位民营火箭创始人首登胡润百富榜，三家企业冲刺科创板IPO</strong></p>\n  <p>10月27日发布的《2026胡润百富榜》，蓝箭航天张昌武、天兵科技康永来、中科宇航杨毅强三位民营火箭创始人首次上榜，身家分别为110亿元、90亿元、70亿元，合计270亿元。三人路线各有差异：蓝箭航天主打液氧甲烷可复用火箭，天兵科技布局液氧煤油火箭，中科宇航固液并行。三家都在推进科创板上市，蓝箭航天、中科宇航目前审核中止，企业仍未盈利，均预计最早2029年盈利；天兵科技处于上市辅导阶段。账面财富来自一级市场估值，体现资本对商业航天赛道的看好，2026年国内商业航天市场规模有望达3.5万亿元。（界面新闻）</p>\n  <p><strong>科大讯飞回应高管薪酬质疑</strong></p>\n  <p>针对投资者提出的高管涨薪疑问，科大讯飞在深交所互动平台回应。按照薪酬制度测算，刘庆峰、吴晓如2025年应发薪酬合计近2796万元，二人考虑到公司发展阶段，为把更多资源倾斜奖励A类优秀员工，主动下调年薪，实际分别领取410万元、300万元。2025年全体高管合计薪酬1860.85万元，较2024年小幅上升。公司同时披露三季报，前三季度营收同比增长、归母净利润扭亏，现金流改善明显。（界面新闻）</p>\n  <p><strong>英特尔：服务器CPU供不应求，预计出货量将在2026年和2027年均增长超过30%</strong></p>\n  <p>英特尔管理层美东时间周四在2026年第三季度财报电话会议上表示，数据中心成Q3增长核心，服务器CPU供不应求。CFO David Zinsner表示，工厂网络和外部供应商支持了更高的服务器CPU产出。按当前展望，DCAI全年收入有望较年初预期高出近100亿美元。管理层预计，行业仍将��2027年及2028年处于供应受限状态。公司还预计，行业服务器CPU出货量将在2026年和2027年均增长超过30%，若供应更充足，增速还会更高。（财联社）</p>\n  <p><strong>现代汽车集团将成立特殊目的公司开发AI数据中心</strong></p>\n  <p>现代汽车集团周五表示，计划于下月成立两家特殊目的公司（SPC），旨在开发人工智能（AI）数据中心；此举是其向AI基础设施领域扩张战略的一部分。现代汽车集团表示，其旗下关联公司——包括现代汽车、起亚、现代摩比斯、现代工程建设以及现代AutoEver——将参与此次投资。其中一家特殊目的公司（SPC）将负责数据中心建设及基础设施开发，而另一家则将负责图形处理器（GPU）相关服务。该集团表示，计划于2027年3月在位于首尔西南约200公里处的群山（Gunsan）新万金（Saemangeum）填海区为该项目动工。项目目标是在2030年初投入商业运营。（新浪财经）</p>\n  <p><strong>11月5日起，国内航线燃油附加费再上调</strong></p>\n  <p>机票销售平台飞常准APP接航司通知，自11月5日起，调整国内航线旅客运输燃油附加费征收标准。800公里(含)以下航段向每位成人旅客收取燃油费80元，800公里以上航段向每位成人旅客收取燃油费140元；较此前分别上涨了30元和50元。（界面新闻）</p>\n  <p><strong>闪迪：将100%的盈余现金返还给股东，第一财季已投入50亿美元用于股票回购</strong></p>\n  <p>闪迪管理层美东时间周四在2027财年第一财季电话会议上表示，本季度营收增长中“约60%归功于销量增长，40%归功于价格上涨。”基于强劲的订单可见度，闪迪预计第二财季营收将在122亿至126亿美元之间，同时，公司承诺将100%的盈余现金返还给股东，本财季已豪掷50亿美元用于股票回购。（财联社）</p>\n  <p><strong>存储器上市企业三季报成绩单亮丽</strong></p>\n  <p>多家存储器行业A股上市公司披露2026年三季报，上述公司前三季度业绩普遍实现较快增长。2026年三季报数据显示，佰维存储、德明利、君正股份、东芯股份今年前三季度归属于上市公司股东的净利润都创下历史同期新高。近期，存储器板块行业高景气度的持续性成为市场关注焦点，苏商银行特约研究员付一夫表示：“本轮存储器行业景气度有望延续。从行业发展趋势来看，未来存储器行业的竞争重心不是单纯比拼产能规模，而是聚焦技术升级。”（证券时报）</p>\n  <p><strong>亚马逊CEO：预计5-10年AWS云业务有望成长为万亿美元营收规模业务</strong></p>\n  <p>美东时间周四盘后，亚马逊首席执行官安迪·贾西在亚马逊财报电话会上，对其AWS云业务前景绘制了极为宏大的前景。他表示：“AWS的年化收入已达1840亿美元，但发展机遇依然巨大……我们预计AWS 2027、2028每年同比增速都将高于40%，未来5-10年有望成长为万亿美元营收规模业务。”（财联社）</p>\n  <p><strong>盘活存量增厚业绩，A股公司多元化“瘦身”提质量</strong></p>\n  <p>近期，不少A股上市公司明显加快“瘦身健体”的步伐。据记者不完全统计，9月至今，有201家上市公司披露资产或股权出售事宜，交易标的涉及土地厂房、闲置物业、金融资产及子公司股权等，总金额超过240亿元，其中部分项目交易金额超过10亿元。“这些交易背后的商业考量不尽相同。”和泰资产研究总监郑卜生对表示，有的企业为盘活存量、聚焦主业，有的着眼于回笼资金，也有经营承压的公司希望借助一次性收益改善年度业绩。（上证报）</p>\n  <p><strong>Alphabet债务风险指标上升，财报令AI举债担忧再起</strong></p>\n  <p>Alphabet Inc.股价周四暴跌之际，其债务违约保护成本上升。此前该公司业绩令人失望，加剧了市场对其举债支持的巨额人工智能（AI）支出可能无法获得回报的担忧。根据ICE Data Services，该公司五年期信用违约互换（CDS）报价一度上升5.3个基点，至每年84个基点，为9月21日以来最大升幅。CDS会随投资者担忧加剧而上升。Meta Platforms Inc.和芯片公司博通等企业的CDS也出现上升。标普全球市场财智固定收益定价执行董事Gavan Nolan表示，如果AI投资取得回报，股票投资者可能获得巨额收益；但如果局面恶化，债券持有人则要承担损失。（财联社）</p>\n  <p><strong>韩国电力国企放弃入股SpaceX电站项目转向主攻运维</strong></p>\n  <p>据30日韩国国会及发电行业消息，韩国中部电力调整方案，放弃直接入股“SpaceX AI综合电站项目”，改为以无股权投入的运维服务商身份参与该项目。对于投资计划变更的原因，中部电力解释：“在与SpaceX合并之前，xAI对外来投资持积极态度；合并完成后，其外部融资需求下降，因此我们撤回了投资意向。”中部电力一名负责人表示：“该项目最初规划就是运维为本、配套股权投资；评估过程中，鉴于SpaceX AI不再需要外部资金，我们调整方向，主攻运维服务。”（新浪财经）</p>\n  <p><strong>通用汽车认罚2.2亿美元，就出售驾驶员数据诉讼达成和解</strong></p>\n  <p>通用汽车公司已同意支付2.2亿美元，就一项诉讼达成和解。该诉讼由美国35个州及华盛顿特区共同提起，指控通用汽车将驾驶员数据出售给保险公司。参与此次和解的多位州检察长于周四宣布了这一消息。此前，由俄勒冈州的丹·雷菲尔德（Dan Rayfield）和华盛顿州的尼克·布朗（Nick Brown）牵头的一个由两党州总检察长组成的联盟对通用汽车发起了诉讼。通用汽车在和解协议中并未承认存在不当行为。（新浪财经）</p>\n  <p><strong>“十五五”全国算力用电量预计年均新增1000亿千瓦时以上</strong></p>\n  <p>从国家能源局10月30日举行的新闻发布会上了解到，预计“十五五”时期，全国算力用电量年均新增1000亿千瓦时以上，到2030年将达到8000亿千瓦时，占全社会用电量的6%左右。（央视新闻）</p>\n  <p><strong>中方决定将APEC商务旅行卡持卡人在华最长停留期延长至90天</strong></p>\n  <p>为持续便利亚太区域商务人员往来，中方决定将APEC商务旅行卡持卡人在华最长停留期由60天延长至90天，自2026年11月1日起实施。（央视新闻）</p>\n  <p><strong>日本9月失业率为2.4%</strong></p>\n  <p>日本9月失业率为2.4%，预期为2.50%，前值为2.50%。（界面新闻）</p>\n  <p><strong>美联储前副主席：12月或加息50基点</strong></p>\n  <p>美联储前副主席罗杰·弗格森周四表态，12月加息50个基点存在可能性。美国9月PCE通胀升至3.6%，核心PCE升至3.1%，持续高于2%政策目标，若届时不加息，美联储或将面临信誉受损。弗格森还预判，美联储12月大概率加息，2027年仍会再有一到两次加息。多名业内经济学家同样警示通胀顽固，12月存在大幅加息50基点的风险。美联储本周维持利率在3.75%–4%不变，两名委员支持加息25个基点。经济数据方面，美国三季度GDP年化增速达3.4%，就业数据保持稳健。CME美联储观察显示，当前市场押注12月加息25个基点概率接近75%，加息50基点概率约24%。（财联社）</p>\n  <p><strong>日本央行12月议息会议成为下一次加息的合理时机</strong></p>\n  <p>明治安田综合研究所高级经济学家Kazutaka Maeda：展望报告表明，随着日本央行对人工智能（AI）相关需求带动的出口和资本支出持更为乐观的态度，其政策重心已进一步转向通胀与经济活动面临的上行风险。尽管其通胀预测总体上仍与2%的目标保持一致，但日本央行似乎越来越意识到通胀可能会超调的可能性。日本央行可能不再坚持此前假设的每半年加息一次的节奏，而是正在考虑每三个月加息一次，这使得12月的议息会议成为下一次加息的合理时机。（新浪财经）</p>\n  <p><strong>日本股市迎重大调整，东证指数开启成分股大精简</strong></p>\n  <p>本周五日本东证指数（TOPIX）启动第二阶段改革调仓，683只个股进入分阶段降权名单，流动性不达标标的将在两年内逐步移出指数。新规抬高流动性门槛，本次新增35只成分股，含日本麦当劳、东映动画、尤尼克斯。</p>\n  <p>降权分8个季度平滑实施，2027年10月设有一次复核“补考”机会。改革后成分股数量将缩减近四成，但市值覆盖率仍维持96.4%以上。</p>\n  <p>有约160万亿日元资金跟踪该指数，上市公司打响“保位战”，通过提升流通股、改善盈利来满足标准；降权标的则将持续承受被动卖出压力。（财联社）</p>\n  <p><strong>现货黄金失守3900美元关口</strong></p>\n  <p>10月30日消息，现货黄金跌破3900美元/盎司，为去年10月以来首次，日内大跌约3%。（界面新闻）</p>\n  <p><strong>黑石集团据悉计划以19亿美元出售位于东京市中心的办公楼</strong></p>\n  <p>据知情人士透露，黑石集团计划以约3000亿日元（约合19亿美元）的价格，出售东京花园露台纪尾井町综合体的写字楼部分。这些因该事项尚未公开而要求匿名的知情人士称，这家总部位于纽约的另类资产管理公司目前正在与潜在买家进行谈判。他们还表示，黑石集团也在考虑将该物业的部分受益权打包成数字证券，以便向个人投资者出售较小的份额。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>菜鸟首单公募REIT在深交所上市</strong></p>\n  <p>36氪获悉，“中金菜鸟REIT”在深圳证券交易所上市。中金菜鸟REIT首发基金份额共计5亿份，每份发售价格为2.980元/份，募集资金合计14.90亿元。该基金原始权益人为“杭州传欣”，基金管理人为“中金基金”，计划管理人及财务顾问为“中金公司”。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>野人先生获首轮融资</strong></p>\n  <p>10月30日，界面新闻获悉，东方Gelato品牌野人先生拿到黑蚁资本投资，这是品牌成立15年来首轮融资，金额未披露，资金将用于供应链、门店拓展及海外探索。该品牌前身为野人牧坊，国内门店超1800家。此前9月罗永浩吐槽其定价偏高、口感一般引发热议，风波后品牌抖音粉丝不降反增。（界面新闻）</p>\n  <p><strong>“四川全固态”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，全固态电池关键原材料硫化锂生产商“四川全固态”已完成数千万元A轮融资。本轮融资由红榕资本、明势创投领投，天泓投资、兴湘科创及老股东英诺天使跟投。拓深资本、启辰资本担任财务顾问，北京卓晖律师事务所担任法律顾问。资金将主要用于百吨级产线的设备升级与产能扩充、长沙研发中心搭建以及团队建设。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>长鑫科技：前三季度净利润1320.4亿元，同比扭亏为盈</strong></p>\n  <p>36氪获悉，长鑫科技公告，2026年前三季度实现营业收入2690.24亿元，同比增长738.51%；归属于上市公司股东的净利润1320.4亿元，同比扭亏为盈。第三季度实现营业收入1187.14亿元，同比增长613.18%；归属于上市公司股东的净利润544.35亿元，同比扭亏为盈。业绩变动主要系全球DRAM产品供不应求，公司产品销售数量和销售价格大幅上涨，叠加单位成本下降，产品毛利大幅上升所致。</p>\n  <p><strong>长飞光纤：第三季度净利润32.03亿元，同比增长1741.52%</strong></p>\n  <p>36氪获悉，长飞光纤公告，2026年前三季度实现营业收入191.24亿元，同比增长86.12%；归属于上市公司股东的净利润61.28亿元，同比增长1204.63%。第三季度实现营业收入93.16亿元，同比增长139.42%；归属于上市公司股东的净利润32.03亿元，同比增长1741.52%。业绩变动主要系受智算中心加速建设影响，行业进入上行周期，主营业务收入结构改善，主要产品销售量及平均单价均实现同比较大增长所致。</p>\n  <p><strong>赛力斯：2026年第三季度净利润14.2亿元</strong></p>\n  <p>36氪获悉，赛力斯公告，2026年第三季度营业收入280.8亿元，同比下降41.66%；归属于上市公司股东的净利润14.2亿元，同比下降40.12%；扣非净利润亏损13.65亿元，同比下降159.54%。前三季度营业收入855.73亿元，同比下降22.58%；归属于上市公司股东的净利润亏损2.97亿元，同比下降105.59%；扣非净利润亏损37.44亿元，同比下降178.53%。</p>\n  <p><strong>燧原科技:2026年前三季度营收23.32亿元，同比增长331.74%</strong></p>\n  <p>36氪获悉，燧原科技公告，2026年第三季度营业收入12.12亿元，同比增长395.34%；归属于上市公司股东的净利润亏损1.22亿元。2026年前三季度营业收入23.32亿元，同比增长331.74%；归属于上市公司股东的净利润亏损7.54亿元。</p>\n  <p><strong>星巴克：第四财季归母净利润为6.772亿美元，高于去年同期的1.331亿美元</strong></p>\n  <p>星巴克公布季度业绩，其国际咖啡馆表现不及预期。不过，其美国业务转型继续取得进展。星巴克报告第四财季归母净利润为6.772亿美元（合每股59美分），高于去年同期的1.331亿美元（合每股12美分）。剔除重组和减值成本及其他项目后，公司报告每股收益80美分。净营收下降4%至91.4亿美元。据StreetAccount数据，公司全球同店销售额增长7.2%，受平均客单价增长推动，高于华尔街预期的6%。本季度交易量增长1.8%。星巴克美国咖啡馆同店销售额增长7.7%，高于StreetAccount预期的6.5%。（新浪财经）</p>\n  <p><strong>亚马逊第三季度AWS净销售额459.8亿美元，高于预期</strong></p>\n  <p>亚马逊第三季度销售净额2019.4亿美元，预估2022.6亿美元；AWS净销售额459.8亿美元，预估456.8亿美元；每股收益1.89美元，预估1.97美元；经营利润280.8亿美元，预估260.6亿美元；营业利益率13.9％，预估12.9％；北美运营利润率+7.7％，预估+6.61％；执行费用300.0亿美元，预估297.1亿美元。亚马逊预计第四季度销售净额2400亿美元至2,470亿美元，市场预估2445.2亿美元；预计经营利润285亿美元至335亿美元，市场预估329.9亿美元。（财联社）</p>\n  <p><strong>中国中免：前三季度净利润36.7亿元，同比增长20.25%</strong></p>\n  <p>36氪获悉，中国中免公告，2026年前三季度营业收入388.21亿元，同比下降2.61%；归母净利润36.7亿元，同比增长20.25%；扣非净利润36.44亿元，同比增长20.00%。第三季度单季营业收入111.66亿元，同比下降4.66%；归母净利润5.64亿元，同比增长24.64%；扣非净利润5.65亿元，同比增长28.19%。公司拟每股派发现金红利0.40元(含税)，以截至报告披露日总股本20.78亿股测算合计派发现金红利8.31亿元(含税)，占前三季度归母净利润22.65%。</p>\n  <p><strong>中金公司：前三季度净利润132.45亿元，同比增长101.71%</strong></p>\n  <p>36氪获悉，中金公司公告，2026年前三季度营业收入307.15亿元，同比增长47.95%；归母净利润132.45亿元，同比增长101.71%；扣非净利润130.96亿元，同比增长101.93%。第三季度单季营业收入114.12亿元，同比增长43.87%；归母净利润50.46亿元，同比增长125.63%；扣非净利润50.62亿元，同比增长125.69%。业绩增长主要因手续费及佣金净收入以及金融工具投资产生的收益净额增加、营业利润率上升。</p>\n  <p><strong>闪迪预计第二财季营收为122亿至126亿美元，市场预估为121亿美元</strong></p>\n  <p>闪迪预计第二财季营收122亿至126亿美元，预估121亿美元；预计调整后毛利率84.5%至85.5%，预估84.8%；预计调整后每股收益55至57美元，预估52.72美元；预计调整后运营费用5.4亿至5.6亿美元。闪迪第一财季业绩营收110.3亿美元，预估106.9亿美元；数据中心营收48亿美元；边缘业务营收58.3亿美元；消费业务营收3.97亿美元；调整后每股收益49.51美元，预估46.36美元；每股收益52.60美元；现金及现金等价物51.4亿美元，预估93.9亿美元；自由现金流63.1亿美元；调整后毛利率85.1%，预估84.5%。（财联社）</p>\n  <p><strong>中国人寿：前三季度净利润894.3亿元，同比下降46.7%</strong></p>\n  <p>36氪获悉，中国人寿公告，2026年前三季度营业收入3678.12亿元，同比下降31.6%；归属于母公司股东的净利润894.3亿元，同比下降46.7%；扣非净利润895.46亿元，同比下降46.7%。第三季度归属于母公司股东的净利润亏损450.59亿元，扣非净利润亏损450.14亿元。</p>\n  <p><strong>招商银行：第三季度净利润400.31亿元，同比增长3.06%</strong></p>\n  <p>36氪获悉，招商银行公告，2026年前三季度实现营业收入2648.52亿元，同比增长5.34%；归属于本行股东的净利润1164.76亿元，同比增长2.38%。第三季度实现营业收入866.71亿元，同比增长6.41%；归属于本行股东的净利润400.31亿元，同比增长3.06%。</p>\n  <p><strong>工商银行：第三季度净利润1119.58亿元，同比增长9.97%</strong></p>\n  <p>36氪获悉，工商银行公告，2026年第三季度营业收入2209.74亿元，同比增长9.45%；归属于母公司股东的净利润1119.58亿元，同比增长9.97%。2026年前三季度营业收入6671.37亿元，同比增长9.19%；归属于母公司股东的净利润2856.4亿元，同比增长5.83%。</p>\n  <p><strong>农业银行：第三季度净利润901.65亿元，同比增长10.84%</strong></p>\n  <p>36氪获悉，农业银行公告，2026年第三季度实现营业收入2083.83亿元，同比增长15.14%；归属于母公司股东的净利润901.65亿元，同比增长10.84%。前三季度实现营业收入6195.05亿元，同比增长12.48%；归属于母公司股东的净利润2365.46亿元，同比增长7.10%。</p>\n  <p><strong>石头科技：第三季度净利润4.79亿元，同比增长33.01%</strong></p>\n  <p>36氪获悉，石头科技公告，2026年第三季度营业收入56.14亿元，同比增长34.85%；净利润4.79亿元，同比增长33.01%；扣非净利润4.03亿
