公司Lovable与Google Cloud扩大多年期合作</strong></p>\n  <p>据报道，瑞典AI初创公司Lovable扩大了与Google Cloud的多年期合作，以整合Gemini模型和AI优化基础设施，从而向全球用户扩展其AI驱动的软件开发服务。（界面）</p>\n  <p><strong>美银：英伟达2027财年下半年Vera CPU销售额有望达200亿美元</strong></p>\n  <p>美银分析师Vivek Arya团队更新了英伟达研报。该机构测算2027财年下半年Vera CPU销售额有望达200亿美元；下一财年产品年化营收规模将突破500亿美元，英伟达有望跻身全球头部服务器CPU供应商。（新浪财经）</p>\n  <p><strong>段永平在泡泡玛特持股比例升至6.04%</strong></p>\n  <p>36氪获悉，据港交所权益披露，段永平在泡泡玛特H股的持股比例于5月28日从5.69%升至6.04%。</p>\n  <p><strong>兖矿能源：拟164.15亿元收购控股股东旗下新能源集团及山能售电100%股权</strong></p>\n  <p>36氪获悉，兖矿能源公告，公司拟以现金164.15亿元收购控股股东山能集团旗下新能源集团100%股权及山能售电100%股权。本次交易旨在通过注入优质电力资产，快速壮大电力业务规模，育强新兴产业，同时切实减少公司与控股股东在电力业务板块的同业竞争，进一步规范公司治理。</p>\n  <p><strong>曲美家居：境外子公司拟发行不超9亿挪威克朗境外债券</strong></p>\n  <p>36氪获悉，曲美家居公告，公司境外三级子公司Ekornes QM Holding AS拟发行总额不超过9亿挪威克朗（含9亿挪威克朗或等值外币）的境外债券，期限不超过3年（含3年）。</p>\n  <p><strong>知乎：2026年Q1经调整净利润1716万元，同比增147.2%</strong></p>\n  <p>36氪获悉，知乎发布2026年第一季度业绩报告。报告显示，知乎第一季度营收6.52亿元，环比增长1.3%；经调整净利润为1716万元，同比增长147.2%，环比实现扭亏。其中付费内容及IP运营收入4.02亿元，环比增长15.8%，在总营收中占比61.7%；营销服务收入1.91亿元，占比达29.4%；其它收入5780万元，占比为8.9%。截至第一季度末，知乎现金及现金等价物、定期存款及短期投资合计44.9亿元。</p>\n  <p><strong>亚马逊Prime会员落地南非，月费不足4美元</strong></p>\n  <p>电商公司亚马逊公司于周三宣布，在南非正式上线付费Prime会员服务，会员每月资费59南非兰特（折合3.61美元）、年费399兰特，可享受极速配送及影音内容权益。（新浪财经）</p>\n  <p><strong>宝丰能源：聘任柳怀宝为公司副总裁</strong></p>\n  <p>36氪获悉，宝丰能源公告，公司于2026年6月2日召开第五届董事会第三次会议，审议通过了《关于聘任公司高级管理人员的议案》，同意聘任柳怀宝为公司副总裁，任期自本次董事会会议审议通过之日起至2026年12月31日。</p>\n  <h2>投融资：</h2>\n  <p><strong>“光联芯科”完成近5亿元A轮融资</strong></p>\n  <p>36氪获悉，“光联芯科”近日完成A轮近5亿元融资，公司估值和累计融资规模刷新行业初创公司纪录。本轮由高榕创投、联想创投、基石资本联合领投，普洛斯隐山资本、仁爱资本、芯禾资本等一线产业资本以及裴振华等企业家个人跟投；君联资本、红杉中国、高瓴创投、真知创投、尚势资本等老股东超额追投。</p>\n  <h2>新产品：</h2>\n  <p><strong>千问宣布向第三方Agent、Skill全面开放，肯德基瑞幸蜜雪冰城东航将首批接入</strong></p>\n  <p>36氪获悉，千问App宣布将向第三方Agent、Skill全面开放，所有企业均可在千问运营自己的品牌Agent。目前，瑞幸、肯德基、蜜雪冰城、东方航空等首批企业正在千问进行Agent服务测试，并将陆续上线。</p>\n  <h2>今日观点：</h2>\n  <p><strong>上海：有序推进政务领域人工智能应用，促进城市治理现代化水平不断优化提升</strong></p>\n  <p>36氪获悉，上海市政务智能工作推进会6月2日上午举行。上海市委副书记、市长龚正指出，要按照市委部署，加强系统化谋划、体系性推进，加快形成本地区、本部门、本单位的“施工图”和“时间表”，以点带面、推动政务智能工作各项任务落地落实。要加强工作协同，进一步打通数据链、业务链、责任链，大力推动算力共用、语料关联、链智融合，形成更多具有引领性、示范性、带动性的政务智能成果以及相关产业发展成果。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>乘联分会：5月1-31日全国乘用车新能源市场零售97.4万辆，同比去年同期下降5%</strong></p>\n  <p>36氪获悉，乘联分会数据显示，5月1-31日，全国乘用车新能源市场零售97.4万辆，同比去年同期下降5%，较上月同期增长15%，今年以来累计零售373.2万辆，同比下降14%；5月1-31日，全国乘用车厂商新能源批发136.5万辆，同比去年同期增长12%，较上月同期增长11%，今年以来累计批发531.8万辆，同比增长2%。</p>\n  <p><strong>日本政府通过超3万亿日元补充预算案</strong></p>\n  <p>日本政府6月3日在临时内阁会议上通过2026财年补充预算案。该预算案已于当天提交众议院全体会议审议，政府计划推动该预算案5日在国会通过。根据该预算案，补充预算总额约3.11万亿日元（1美元约合160日元），将用于电力和燃气补贴、延续汽油价格补贴以及通过地方政府向液化石油气用户提供补贴等。其中，2.5万亿日元为“应对中东局势预备费”，主要用于继续实施汽油价格补贴政策。（新华社）</p>\n  <p><strong>现货白银向下跌破74美元/盎司</strong></p>\n  <p>36氪获悉，现货白银向下跌破74美元/盎司，日内下跌1.49%。</p>", "category": "tech", "published_at": "2026-06-03T15:01:21+00:00", "fetched_at": "2026-06-04T03:36:11.998100+00:00", "fingerprint": "9b6ea37320152cfb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨A股第4只两千元股诞生；问界回应浙江台州M9事故；马斯克个人财富将突破万亿美元", "url": "https://36kr.com/p/3838091144464644?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>名创优品称会员买单仅限潮玩商品</li>\n   <li>谷歌扩大Quick Share与AirDrop互传适配范围，覆盖更多安卓机型</li>\n   <li>Meta在全球范围扩大青少年内容管控</li>\n   <li>多家银行下架3年期5年期定期存款</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>A股第4只两千元股诞生，联讯仪器盘中股价冲破2000元</strong></p>\n  <p>6月3日，联讯仪器盘中股价冲破2000元，最高达2047.88元。公司总市值超2000亿元。数据显示，自A股1990年12月19日开市以来，最高价曾突破2000元的股票屈指可数，仅有中安科、贵州茅台、云赛智联3只。这3只股票的上涨动因各异，长期市场表现也大相径庭。与A股史上前3只最高价曾触及2000元的股票相比，联讯仪器的硬科技成色鲜明。公司是全球少数、国内极少数量产供应400G/800G/1.6T光速光模块核心测试仪器的厂商，并已逐步在半导体测试设备领域形成“第二增长曲线”。（上海证券报）</p>\n  <p><strong>问界回应浙江台州M9事故</strong></p>\n  <p>6月3日，问界用户服务发布关于浙江省台州市车辆事故的说明：2026年6月3日，一辆问界M9在浙江省台州市泽国镇发生事故，未造成人员伤亡。事故发生后，我们第一时间与用户取得联系，提供必要协助。</p>\n  <p>经现场确认，事故为车辆行驶过程中，撞击前车掉落的大块金属部件，造成强物理冲击并持续拖行一段时间后导致起火，目前火已扑灭。经初步调查，事发前车辆三电系统状态正常，且未见车辆其它自身异常，事故非车辆自身原因导致。（新浪汽车）</p>\n  <p><strong>马斯克个人财富将突破万亿美元，目前身家约为8350亿美元</strong></p>\n  <p>据《福布斯》，埃隆·马斯克5月身家增加530亿美元，在十大富豪中增幅排名第三。目前其身家约为8350亿美元。旗下电动汽车巨头特斯拉上月股价上涨14%，但真正吸引投资者目光的是火箭与卫星业务公司SpaceX。该公司上月提交上市文件，有望缔造史上规模最大的首次公开募股（IPO）。据悉，SpaceX目标估值1.8万亿美元，略低于最初预期，但足以打破沙特阿美2019年创下的纪录，并有望推动马斯克个人身家突破万亿。预计股票最早会在6月12日开始交易，这意味着2026年6月可能成为全球诞生首位万亿富豪的月份。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek计划在首轮融资中募资约70亿美元</strong></p>\n  <p>知情人士透露，DeepSeek计划在首轮融资中募资约70亿美元，这家人工智能初创企业估值将达到最高590亿美元。腾讯和宁德时代将成为DeepSeek最大的外部投资者；网易和京东也计划参与投资。（新浪财经）</p>\n  <p><strong>微软宣布面向新型AI设备推出“Project Solara”平台</strong></p>\n  <p>微软宣布面向新型AI设备推出“Project Solara”平台。芯片将运行AI Agent而非应用，并直接与云计算数据中心通信。（界面新闻）</p>\n  <p><strong>Anthropic拓展其AI网络安全项目</strong></p>\n  <p>Anthropic正著手拓展其网络安全项目，向新一批企业开放其Claude Mythos Preview的访问权限，以协助他们排查软件漏洞。（新浪财经）</p>\n  <p><strong>Kimi发布桌面端产品Kimi Work，定位通用型本地Agent</strong></p>\n  <p>36氪获悉，今日，Kimi发布桌面端产品Kimi Work，是一款面向知识工作者的通用型本地Agent，可以在电脑上拆解任务、调用工具、使用浏览器、创建和整理文件夹，并完成文档、表格、PPT等工作产物的交付。Kimi Work由Kimi Code深度参与开发，支持13小时连续编码、300个子Agent并行协作及4000余次自主工具调用。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>谷歌扩大Quick Share与AirDrop互传适配范围，覆盖更多安卓机型</strong></p>\n  <p>谷歌官网当地时间6月2日发布新闻稿宣布一系列当月更新的新功能，其中提及，谷歌宣布安卓Quick Share（快速分享）兼容苹果AirDrop（隔空投送）功能，可跨平台互传，现已适配更多设备。已经提供Quick Share功能的国产品牌机型包括小米17T Pro、荣耀Magic V6、OPPO Find X9等。（财联社）</p>\n  <p><strong>31条中日航线5月取消全部航班</strong></p>\n  <p>航班管家DAST最新统计显示，5月共有31条中日航线取消全部航班，比4月取消数量有所增加。整个5月中国大陆赴日本共有1592个航班取消。（第一财经）</p>\n  <p><strong>多家银行下架3年期5年期定期存款</strong></p>\n  <p>民营银行加速下架三年期、五年期存款产品并下调利率，以应对净息差持续收窄压力，降低高成本负债。多家银行已暂停销售或显示“售罄”，利率普遍下调至1.9%—2.1%区间。（21世纪经济报道）</p>\n  <p><strong>名创优品称会员买单仅限潮玩商品</strong></p>\n  <p>近日，有消费者吐槽，名创优品不是会员不能买单&nbsp;。消费者称，自己在名创优品结账时被要求出示会员证明，如果不是会员就不能买单。记者针对该情况询问名创优品客服，对方表示，目前购买潮玩类商品需要会员，其他商品无需出示会员结账，“盲盒、搪胶毛绒公仔目前仅对名创优品会员开放购买，注册会员后即可正常下单，其他品类商品不受影响。”（中国新闻网）</p>\n  <p><strong>莲花CEO称超过1.8吨就是“菜车”</strong></p>\n  <p>莲花跑车CEO冯擎峰近日在接受媒体采访时，提到跑车的车重问题，并给出了1.8吨的分水岭。</p>\n  <p>他表示，不管它马力多大，哪怕是2000匹马力，只要重量超过1.8吨，就是菜车。“我们也看到一些竞争对手，甚至于跑车做到了两吨，不可思议，说明它对跑车是没有理解的。”</p>\n  <p>此前，他还曾在采访中表示，不受控制的马力一文不值，马力大不代表就是性能车，受控的马力才叫性能车。电动化时代以后，马力容易获得了，往往容易忽视操控性。（新浪科技）</p>\n  <p><strong>腾讯AI产业应用大会在即，即将发布系列智能体应用新品</strong></p>\n  <p>36氪获悉，据腾讯云官号账号信息，腾讯2026AI产业应用大会即将在北京举办。作为腾讯年度最重要的AI产品发布平台，此次将发布系列智能体应用新品，并将公布infra等基础设施升级新进展。与此同时，腾讯集团高级执行副总裁、云与智慧产业事业群CEO汤道生将于腾讯AI首席科学家姚顺雨同台对话，解读AI下半场腾讯在AI赛道的最新布局和思考。</p>\n  <p><strong>Meta在全球范围扩大青少年内容管控</strong></p>\n  <p>Meta周二披露，正对旗下Instagram、脸书、Messenger全球青少年账号扩容内容管控设置，保障未成年用户获取适配其年龄段的使用体验；当下各大社交平台因儿童身心健康与安全问题正面临日趋严苛的监管审视。（新浪财经）</p>\n  <p><strong>印度央行否认出售黄金的报道</strong></p>\n  <p>印度央行在声明中称，关于印度央行出售黄金的报道并不属实。截至目前，实物黄金储备仍为880.52吨，没有变化。此前有分析认为，印度央行可能为保护外汇储备而出售黄金。（财联社）</p>\n  <p><strong>马斯克关联空壳公司在休斯顿郊外购地，550亿美元芯片厂或落地于此</strong></p>\n  <p>与马斯克有关联的一���空壳公司最近几周在美国休斯敦郊外一处乡村地区购置物业，表明这位亿万富豪可能在为一座计划中的550亿美元芯片厂Terafab敲定选址。Terafab项目由SpaceX、特斯拉和xAI联合推动，旨在为人工智能和机器人项目提供芯片支持，总投资最高可达1190亿美元。根据土地登记记录，这家名为“WIT Tech LLC”的公司已在格莱姆斯县购入至少6块地皮，总面积超过6000英亩（相当于近10平方英里），交易金额尚未披露。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>星源材质通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，港交所文件显示，深圳市星源材质科技股份有限公司更新聆讯后资料集，意味着该公司港交所IPO通过聆讯。</p>\n  <p><strong>安克创新向港交所提交上市申请</strong></p>\n  <p>36氪获悉，6月3日，港交所文件显示，安克创新科技股份有限公司向港交所提交上市申请书，联席保荐人为中金公司、高盛、摩根大通。</p>\n  <p><strong>普渡机器人CEO称公司正在为香港上市做准备</strong></p>\n  <p>日经新闻报道称，普渡机器人创始人和首席执行官张涛接受采访时表示，公司正在为香港上市做准备。（新浪财经）</p>\n  <p><strong>机器人公司帕西尼据悉正考虑在香港上市</strong></p>\n  <p>机器人公司帕西尼据悉正考虑在香港上市。（���浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>知乎：2026年Q1经调整净利润1716万元，同比增147.2%</strong></p>\n  <p>36氪获悉，知乎发布2026年第一季度业绩报告。报告显示，知乎第一季度营收6.52亿元，环比增长1.3%；经调整净利润为1716万元，同比增长147.2%，环比实现扭亏。其中付费内容及IP运营收入4.02亿元，环比增长15.8%，在总营收中占比61.7%；营销服务收入1.91亿元，占比达29.4%。截至第一季度末，知乎现金及现金等价物、定期存款及短期投资合计44.9亿元。</p>\n  <h2>投融资</h2>\n  <p><strong>SpaceX敲定IPO发行价，拟募资750亿美元、估值有望接近1.77万亿美元</strong></p>\n  <p>SpaceX当地时间6月3日向美国证监会提交的文件显示，该公司计划以每股135美元的价格推介约5.556亿股，计划募资750亿美元。按这一价格并根据文件中列明的流通股数计算，SpaceX市值将接近1.77万亿美元。（界面新闻）</p>\n  <p><strong>快手旗下可灵AI正进行融资：投前估值180亿美元，计划2027年赴港上市</strong></p>\n  <p>据报道，快手旗下视频生成业务可灵AI正在进行分拆以来的首轮融资，投前估值为180亿美元。这也是可灵AI的Pre-IPO轮融资。据了解到，可灵AI目前内部按照2027年年初能够递交港股上市申报材料推进相关工作。（IPO早知道）</p>\n  <p><strong>“星尘智能”完成超10亿B轮融资</strong></p>\n  <p>36氪获悉，绳驱AI机器人公司“星尘智能”（Astribot）近日完成B轮系列融资，三个月内三轮累计融资额超10亿元，投资方包括梁溪科创产业二期母基金（博华资本管理）、扬州龙投芯粒、中博聚力、中科创达、科德教育、某上市企业及国科投资等老股东持续追投。</p>\n  <p><strong>“旷行科技”完成数千万元Pre-A轮融资</strong></p>\n  <p>36氪获悉，高危作业领域具身智能公司“旷行科技”近期已完成数千万元市场化第一轮融资（Pre-A轮），由财通资本和商汤国香投资。本轮资金将主要用于算法研发、产品矩阵完善及市场拓展。</p>\n  <p><strong>“千寻智能”获15亿元A+轮融资</strong></p>\n  <p>36氪获悉，据千寻智能消息，“千寻智能”获15亿元A+轮融资，股东包含一线美元基金、大型产业投资方以及国资基金，老股东持续加码。本轮所融资金，将聚焦三大核心方向投入使用：新一代具身智能基座模型持续研发迭代、全球化真实数据基础设施体系建设、多行业场景规模化商业落地推进。</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果Vision Pro新专利曝光，未来可模块化更换配件</strong></p>\n  <p>近日，科技媒体 Appleinsider 发布博文，报道称苹果获批一项新专利，在配合 Vision Pro 头显使用时，Apple Pencil 通过触觉反馈传递虚拟物体的摩擦、纹理和粗糙感。 （IT之家）</p>\n  <p><strong>宇树回应与英伟达合作机器人：下半年新产品亮相</strong></p>\n  <p>日前，英伟达首席执行官黄仁勋宣布，英伟达已与宇树科技合作，推出新一代人形机器人参考设计“H2+”。围绕前述广泛关注的话题，宇树科技工作人员表示，新的“H2+”机器人基于英伟达的算力平台研发，会比之前机器人的算力水平更好，新产品将于今年下半年亮相。（中新网）</p>\n  <p><strong>整理</strong>｜徐嘉彤&nbsp;</p>", "category": "tech", "published_at": "2026-06-03T23:53:43+00:00", "fetched_at": "2026-06-04T03:36:11.998094+00:00", "fingerprint": "a91dc75a7d425da2"}, {"source": "36氪 - 最新文章", "title": "深创投领投，这家微型关节模组企业完成数千万融资丨36氪首发", "url": "https://36kr.com/p/3837650456430851?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，微型高性能电机企业指尖智擎近期完成数千万元Pre-A轮融资，由深创投领投，天启资本与卓源亚洲跟投。资金将主要用于新一代微型轴向磁通电机的量产爬坡、空心杯电机产线建设及全球头部客户的供应链交付保障。多维资本担任本轮独家财务顾问。</p>\n  <p>指尖智擎成立于2024年8月，公司主打产品包括微型轴向磁通关节模组与空心杯电机，核心应用场景覆盖灵巧手、消费级机器人、轻型机械臂及医疗设备等领域。公司创始人张杨拥有12年电机行业经验，曾就职于美的、威孚高科、图达通等企业。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_538618f320a445f080c6900287a5e6ab@6221844_oswg339620oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">φ16mm微型关节模组（图源/企业）</p>\n  <p>目前，人形机器人灵巧手的主流技术路径存在精度、自由度、扭矩密度及成本方面的明显短板，行业长期面临“小型化、高性能、低成本”难以兼得的难题。</p>\n  <p>指尖智擎的采用自研微型轴向磁通电机+PCB绕组+摆线减速器的组合。公司产品最小外径16毫米，最大30毫米，走小型化的差异路线。以16mm规格为例，电机最大连续转矩大于7.8mNm，电驱总成最大连续转矩可达0.10-0.31Nm，传动效率80%-88%。</p>\n  <p>在技术路线上，公司有三个核心特点：一是采用轴向磁通电机，区别于传统径向磁通结构；二是电机全部采用PCB绕组工艺，避开特微型电机绕线困难的桎梏，大幅提升精度及一致性；三是减速器采用摆线方案，兼顾成本及可靠性。</p>\n  <p>张杨表示：“我们切入市场较晚，所以必须另辟蹊径，做差异化、小型化，同时技术路线要有前瞻性，才能保证后面不会被淘汰。”</p>\n  <p>指尖智擎目前微型关节模组产品线已经基本搭建完成，已有4个标准品尺寸以及多个定制开发项目在研，其空心杯电机产品线也将在今年内陆续补全。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_cc34291750304e46bee88985c80cc626@6221844_oswg502136oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">φ4mm和φ5mm特微型空心杯电机（图源/企业）</p>\n  <p>目前，公司团队规模超100人，在苏州工业园区拥有约9000平方米的研发中心与工厂，具备年产10万台微型关节模组的生产能力，三季度年产能可达20万台。</p>\n  <p>在商业化方面，公司已取得实质性进展。目前灵巧手相关客户占公司营收约60%-70%，公司已与多家头部客户签订协议并推进深度合作，其中已与两家头部公司敲定战略开发合作。</p>\n  <p><strong>以下为硬氪与张杨的对话节选：</strong></p>\n  <p><strong>硬氪：市面上也有其他公司在做轴向磁通电机、PCB绕组或摆线减速器，指尖智擎的核心差异在哪里？</strong></p>\n  <p><strong>张杨：</strong>从2024年底我们开始推这个方案之后，市场上确实有不少公司在跟进，但他们做的都是比较大的产品，而且也没有看到成熟的产业化落地。哪怕有厂家也在做轴向磁通电机、摆线减速器、PCB绕组方案，但他们都没有把这些技术结合在一起做微型化。我们的核心差异和最大优势就是微型化，这就是我们最大的护城河。</p>\n  <p><strong>硬氪：你们怎么看待灵巧手目前的可靠性问题？</strong></p>\n  <p><strong>张杨：</strong>现在行业里宣传手的寿命都是按百万次算，但换算一下，如果一秒钟开合一次，200万次也就200多个小时，连家用电器的可靠性标准都达不到，而且这是空载，如果带载寿命缩减到可能只有十分之一。我们目前在积极推进可靠性测试验证提升，从材料、结构、工艺多个维度去优化。相比行业内其他方案，我们在这方面的优势已经比较明显了。手要真正在工业和家庭场景落地，可靠性的提升是亟待解决的。</p>\n  <p><strong>硬氪：你们不自己做整机，那未来还有哪些想象空间？</strong></p>\n  <p><strong>张杨：</strong>我们定位很清晰，就是做“卖铲子的人”。零部件公司也可以成为伟大的公司。本质上，指尖智擎的定位是一家微型电机公司，下游应用场景不只是灵巧手或者是机器人，微型电机本身是一个非常大的市场，覆盖消费电子、医疗、工业自动化等多个行业，场景非常广，我们已经有一些很有前景的其他项目在做了。</p>\n  <p>我们不会去干下游的事，把自己做成微型高性能电机领域的标杆企业就够了，市场和估值空间已经很大了。不是不能做，而是没必要。况且很多客户担心我们做下游，不是聪明的打法。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>本轮融资领投方深创投表示：</strong>“具身智能是未来十年最确定的科技浪潮之一。我们发现，指尖智擎不仅是技术上的‘无人区’开拓者，更是量产上的‘实干家’。其将半导体工艺引入电机制造的思路极具颠覆性，团队既精通电磁场技术，又深谙供应链管理，我们坚定看好指尖智擎成为机器人微型关节模组领域的核心动力引擎。”</p>\n  <p><strong>天启资本与卓源亚洲认为：</strong>指尖智擎精准卡位微型执行器这一产业链核心瓶颈，其独创的PCB轴向磁通技术路线不仅打破了海外技术垄断，更具备了稀缺的规模化量产能力。在具身智能从“实验室”走向“生产线”的爆发前夜，指尖智擎无疑占据了极具战略价值的生态位。</p>", "category": "tech", "published_at": "2026-06-04T01:30:00+00:00", "fetched_at": "2026-06-04T03:36:11.998087+00:00", "fingerprint": "1b6dbfae3ffc9d6b"}, {"source": "36氪 - 最新文章", "title": "深圳具身公司获得汇川、中国电信亿元融资，“视触觉”传感器出货量行业第一｜硬氪首发", "url": "https://36kr.com/p/3837269482091656?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，戴盟机器人近日完成亿元A轮融资，由汇川技术旗下产业基金汇川产投与中国电信联合投资。资金将用于进一步打造超大规模含物理交互信息数据集，加速物理世界模型研发、并驱动真实物理场景下的数据飞轮与商业闭环。</p>\n  <p>戴盟机器人于2023年正式运营，核心团队长期聚焦机器人灵巧操作与物理交互智能领域。联合创始人兼首席科学家王煜教授曾任港科大机器人研究院创始院长，他所提出的“具身技能”与“技能克隆”等概念，是戴盟机器人核心技术路线的重要组成部分。创始人兼CEO段江哗博士及主要技术负责人，均来自港科大机器人研究院核心团队，具备10年操作智能Know-how。首席AI科学家原玮浩曾为阿里通义实验室多模态研究专家，拥有将世界模型迁移至机器人物理操作的前沿经验。</p>\n  <p>具身智能热度持续走高的当下，行业逻辑正在发生深刻切换。赛道发展沿着一条清晰的脉络演进：从早期机器人行走与运动控制能力的比拼，到差异化算法架构路线与“具身大脑”的探索，每轮热点轮动都为其突破积累了关键基础。</p>\n  <p>随着人形落地从舞台演示走向实景作业，整机精细化实操门槛持续抬升，能否采集高质量物理交互数据，已经成为行业落地的关键分水岭。</p>\n  <p>在主流的纯视觉感知方案中，传感器仅能捕捉物体外观，无法识别软硬、摩擦系数、受力形变等物理特征，难以支撑机器人预判物体变化。相较之下，融合触觉的物理交互数据，可完整记录瞬时受力、材料属性等关键参数，在模型规模化训练中沉淀物理常识、加速收敛，帮助机器人建立物理因果认知，落地各类精细作业。</p>\n  <p>戴盟的做法是从物理交互数据的采集和标注切入，逐步搭建起覆盖感知、操作、学习的完整技术链路，进而构建能为机器人提供物理常识的世界模型。</p>\n  <p>在认知层面，其模型可以实现视觉与触觉模态的对齐，使机器人能够从图像中推断物体的物理属性，也能从触感中反推物体形态；进入执行阶段，借助高响应频率的触觉反馈，帮助设备在接触发生的毫秒级时间内完成感知、判断与动作修正，形成闭环控制。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_4ba21fa16c334f4f9da385d4fae9d9a5@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">以物理直觉实现串葡萄、放置鸡蛋等精细操作（图源/企业）</p>\n  <p>“机器人要能干活，对物理世界因果的理解和基于真实接触的反馈必不可少。”戴盟机器人CEO段江哗告诉硬氪，一个能跑酷、能翻跟头的机器人，如果它没办法以恰到好处的力度拿起一块海绵擦拭物体，其应用价值将大打折扣。“视觉属于非接触的远端信号，它能告诉你物体在哪里，却无法告诉你接触时，为什么海绵会产生形变，而触觉，正是那个接触瞬间的‘手感’，是判断物理因果、实现精细操作的关键。”</p>\n  <p>但仅有技术和模型还不够。如何以数据闭环与专业评测标准驱动物理世界模型持续迭代，是当前业界面临的另一大挑战。段江哗向硬氪指出，“触觉数据荒的本质在于，视觉的数据表征方式已经相对统一，而触觉没有标准，也缺乏大规模、多模态的真实采集体系。”</p>\n  <p>为解决这一难题，戴盟自建了“外发式”具身数据采集网络，与传统依赖定点实验室、遥操作采集的模式不同，“外发式”采集网络通过将中心化实验室分散，实行分布式社会化采集，可以有效实现场景的真实性、采集效率的质变和边际成本的递减。</p>\n  <p>2026年4月，戴盟机器人已联合包括谷歌DeepMind等数十家海内外头部机构，发布全球最大规模的含触觉全模态物理世界数据集Daimon-Infinity，其中包含了纹理、软硬、力学等接触信息，并开源1万小时供行业免费使用；在数据集基础上，还建立了一套系统化的评测标准，于6月推出支持“真实数据训练+仿真器训练”两种模式、面向物理交互能力的含触觉全模态Benchmark体系RobOmni。</p>\n  <p>人类婴儿通过触摸来认识世界，发展智力。对于即将从工厂走进家庭的机器人而言，这一课也同样无法跳过。在解决了“看得见”和“走得稳”之后，“摸得准”正成为具身智能通往物理世界的最后，也最关键的“一公里”。而戴盟机器人，正试图在这场关于“手感”的技术进程中，定义自己的标准。</p>\n  <p>人类婴儿通过触摸来认识世界，发展智力。对于即将从工厂走进家庭的机器人而言，这一课也同样无法跳过。在解决了“看得见”和“走得稳”之后，“摸得准”正成为具身智能通往物理世界的最后，也最关键的“一公里”。戴盟向硬氪透露，其视触觉传感器出货量目前已居全球第一。它正试图在这场关于“手感”的技术进程中，定义自己的标准。</p>\n  <p><strong>以下为硬氪与戴盟机器人CEO段江哗的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：从感知到执行，具身智能要跨越从“看懂”到“干活”的鸿沟。戴盟的物理世界模型是如何处理视触觉模态融合与底层控制的？在面对复杂操作任务时，这套架构能帮助机器人完成哪些之前做不到的事？</strong></p>\n  <p><strong>段江哗：</strong>我们的模型推理的是物理因果。在模型结构上，我们把物理接触拆成了两层，分别是认知层和执行层。</p>\n  <p>认知层做的事是让视觉和触觉在同一语义空间里双向映射，<strong>这类似于人类的通感。</strong>你看到一颗草莓，不用捏下去就知道草莓会有颗粒感；当你掏钥匙开门，钥匙插进门锁的那一刻，手会挡住视线，在看不到钥匙和锁孔接触状态的情况下，人类会依靠直觉和手感完成操作——有没有插进去、有没有卡住、要不要转一下？我们希望机器人也能做到这件事。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_88839848d20a49048347085d1742c11e@6022551_oswg3349491oswg1866oswg1050_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">戴盟机器人用夹爪抓取鸡蛋（图源/企业）</p>\n  <p>执行层有两套机制在同时运行。一套是百赫兹级的高频触觉伺服，类似脊髓反射，不经过上层推理，物体刚开始产生滑移趋势的那一刻，补偿动作就已经发出了，视觉帧还没切换过来。<strong>这好比你在洗碗时，手里沾满洗洁精的盘子刚有一点点滑脱的迹象，你不需要用眼睛去盯着确认，手指就会立刻本能地收紧捏住盘子。</strong></p>\n  <p>另一套是物理世界推理，模型会持续预测未来几步的操作状态，在失误真正发生之前提前给出修正策略。<strong>这好比你单手提着一个水壶往杯子里倒水，随着水流出，壶底的重心在持续变化，你的大脑会根据水的流速，持续预测下一秒壶的重量分布，提前并且平滑地调整手腕的倾斜角度，确保水流自始至终倒得平稳。</strong></p>\n  <p>这两套机制分别对应毫秒级反应和多步前瞻，时间尺度不同，但在同一个任务里协同工作。这是我们相比纯视觉操作模型最重要的结构差异。</p>\n  <p><strong>硬氪：戴盟最近还陆续发布了数据集和面向机器人物理交互能力的Benchmark，这跟你们在做的物理世界模型有什么联系？</strong></p>\n  <p><strong>段江哗：</strong>数据集是燃料，物理世界模型是引擎，Benchmark 是转速表。</p>\n  <p>传统的数据集，不管是视觉的还是仿真的，记录的是“像素变化”或者“轨迹”。但要让机器人理解物理世界，光有这些远远不够。比如一个物体是软的还是硬的？表面是光滑的还是粗糙的？抓握时正压力多大、切向力多大、有没有滑移趋势？这些都属于物理属性信息。Daimon-Infinity数据集中所采集的压力、形变、纹理、刚度、滑移趋势……加起来有十几种模态。</p>\n  <p>最大的难度，不是单独采集某一种模态，而是要把这十几种触觉模态，跟视觉图像、跟动作指令，在毫秒级的时空维度上严格对齐。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_d7d3708541eb4c90a5e66a636c31aa6b@6022551_oswg4059125oswg3148oswg1508_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">戴盟机器人实现自主穿葡萄任务（图源/企业）</p>\n  <p>举个例子，机器人手指碰到物体的那一刻，触觉传感器要记录下接触点的压力分布、纹理信息，同时摄像头要记录下这一刻的画面，控制系统要记录下这一刻的关节角度和力矩。<strong>这三者必须在时间上精确到毫秒级同步，否则模型难以学到到正确的因果逻辑。</strong></p>\n  <p>数据有了，模型有了，下一个问题随之而来——怎么判断模型是否真的学到了物理因果？这就是戴盟推出RobOmni的意义。</p>\n  <p>具身领域现有基准评测往往侧重视觉感知模态，重点关注机器人的泛化抓取和长序列规划任务，针对触觉感知模态，接触精细操作的评估标准还没有完善。</p>\n  <p>行业仍然缺乏围绕触觉感知与灵巧操作的标准化评测基准，不同模型与数据之间缺乏统一标准，触觉能力难以量化，模型泛化能力也难以被系统性验证。</p>\n  <p>我们注意到，一些侧重仿真和 Sim2Real 领域的团队，近期也开始引入视触觉融合评估，这恰恰说明整个产业前沿正在达成共识——让机器人真正理解世界并与世界交互，纯视觉是不够的，触觉是绕不过去的。<strong>RobOmni正填补了这一缺口，为物理交互能力提供标准化、可比较、可复现、可扩展的验证入口。</strong></p>\n  <p>没有尺子，就无法度量进步，没有标准，行业就无法形成合力，所以我们要先造一把尺子，再丈量世界。</p>\n  <h4><strong>投资方评论：</strong></h4>\n  <p><strong>汇川产投相关负责人</strong>表示，具身智能要想实现真实场景作业的跨代跃迁，触觉感知补齐物理因果逻辑是必经之路。戴盟机器人是业内极少数从物理因果逻辑出发，以海量视触觉数据驱动，推动物理世界模型在精细操作场景落地的企业，汇川技术长期深耕工业自动化与智能机器人领域，深知多模态感知对精细操作场景的战略价值。未来期待基于汇川的场景与产业认知，与戴盟共同构建具身智能时代的触觉神经网络。</p>\n  <p><strong>中国电信投资公司相关负责人</strong>表示，具身智能想要实现大规模商业化落地，既离不开云端大模型算力的持续迭代升级，也高度依托高精度物理感知能力与多模态数据体系作为支撑。戴盟机器人在视触觉感知赛道深耕积淀，已构建起稳固的核心技术壁垒。作为数字中国建设的中坚力量，中国电信正全力落地 “云改数转智惠” 战略。未来，我们期待与戴盟机器人深度携手，联合打造可落地、可复制的具身智能行业解决方案，共建赋能新质生产力发展的新型数字基础设施，助力加速具身产业高质量发展，实现生态共赢。</p>", "category": "tech", "published_at": "2026-06-04T01:30:00+00:00", "fetched_at": "2026-06-04T03:36:11.998078+00:00", "fingerprint": "f31b4d1f0163b701"}, {"source": "36氪 - 最新文章", "title": "李宁需要库里，但库里更需要李宁", "url": "https://36kr.com/p/3838185031305474?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑 |&nbsp;</strong>张帆&nbsp;</p>\n  <p>一条消息让体育圈炸了锅。</p>\n  <p>6月2日，NBA球星斯蒂芬·库里与中国运动品牌李宁，签下了一为期十年的代言。双方均未披露具体金额，但业内口径相当统一：这是一份总价超过4亿美元（约合27亿元人民币）的超级合同。</p>\n  <p>据多方信息，库里每年保底可获3000万美元的代言费，还能从其个人品牌Curry Brand的销售中得到提成，外加李宁的流通股股权激励。这套“高保底+销售分成+股权”的组合模式，完全对标耐克当年给迈克尔·乔丹的待遇。</p>\n  <p>库里的江湖地位毋庸置疑：他是“NBA历史上最具革命性影响的球员之一”，控卫历史第二，是“小球时代”的奠基人。</p>\n  <p>今年4月，《今日美国》评选“NBA历史25大巨星”，库里排名第四，紧随乔丹、詹姆斯、科比之后。在更多专业体育媒体的排名中，库里多在第十到第十三位。从实力、流量到市场好感度，库里拥有体育品牌渴望的一切。</p>\n  <p><strong>但股价反应却颇为玩味。</strong></p>\n  <p>消息公布当天，李宁盘中高开超7%，涨势只维持了半天。截至6月2日收盘，股价收跌0.79%。紧接着的6月3日，李宁收报17.99港元，两日累计下跌2.07%，股价接近年内最低水平。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_2b3bac6fd08040368f965bd788b233d1@394564713_oswg50881oswg1071oswg567_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自Wind</p>\n  <p>运动品牌的球星代言价值主要有两种——</p>\n  <p>一是“战力带货”，即靠球星在赛场上的表现直接拉动销售，38岁、濒临退役的库里具有“不确定性”。其二是IP的整体价值，乔丹在退役后，个人品牌依旧大卖，但这需要漫长的时间投入与沉没成本。</p>\n  <p>从这些层面看，李宁此刻签约库里，已错失了这一天才球员的“战力巅峰”期，资本市场也相对厌恶长周期带来的风险。<strong>关键在于，李宁这笔钱花得到底值不值？</strong></p>\n  <p>2013年，李宁和耐克都有意签约库里。当时的库里不过是个刚打出点名气的年轻人，右脚的伤病也让品牌们犹豫。正是此时，安德玛诚意邀约，双方最终以每年400万到500万美元的价格达成合作。后面的故事，堪称体育营销的教科书。</p>\n  <p>随着库里身价飙升，安德玛的篮球业务狂飙突进。2015年，库里一代签名鞋“Curry 1”创下1.6亿美元销售额，安德玛篮球鞋销量当年激增350%，公司整体营收也从2013年的23.3亿美元跃升至40亿美元。<strong>从消费心智看，库里与安德玛的绑定仍然牢固。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_578072eb573645518a7d7d61cf9d2d9c@394564713_oswg91827oswg957oswg627_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自官方微博</p>\n  <p>2025年11月，库里与安德玛的合作到期，李宁再度迎来了出手机会。</p>\n  <p><strong>美国著名体育记者沙姆斯·查拉尼亚（Shams Charania）在社交媒体称：“我们之前看到库里穿过不同的鞋，最终让他感觉最舒服的，是德维恩·韦德与吉米·巴特勒的签名鞋款。”</strong></p>\n  <p>这两大产品皆来自李宁。</p>\n  <p>2018年，李宁与即将退役的韦德签下终身合约，为其创立子品牌“韦德之道”（Way of Wade），成为公司运作最成熟、最成功的案例之一。与韦德的合作模式不同，李宁对巴特勒的市场策略更偏职业化，双方共同推出的Jimmy Butler 1代、2代，主打高端实战性能。</p>\n  <p>然而，让库里放弃其他更优渥报价、选择李宁的原因，不仅有队友的推荐。</p>\n  <p>在查拉尼亚补充的表述中，李宁和安踏是最后争夺库里的两个品牌，李宁“后来居上”的原因在于“其给库里的是一种多样化的投资组合，不是一对一的直接签约”。</p>\n  <p>李宁提供的资料也显示，其与库里将共同运营品牌Curry Brand，产品涵盖篮球鞋、高尔夫用品以及运动生活。<strong>双方将以品牌共建为基础，共同探索李宁品牌与库里品牌全球化发展的更多可能。未来，还会推出独立的Curry Brand门店。</strong></p>\n  <p><strong>这些安排都指向一个方向：李宁想让Curry Brand成为下一个Air Jordan。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_7c9a71630f54411cb9911cdbc0ed2b0d@394564713_oswg1221924oswg1266oswg1475_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据公开数据不完全统计</p>\n  <p>在中国运动市场，李宁的地位毋庸置疑。其创始人知名运动员的身份，让这一品牌拥有强大的号召力与国民感知力。</p>\n  <p><strong>但没人能复刻Air Jordan的传奇。</strong></p>\n  <p><strong>业内普遍的感知是，Air Jordan的成功既有耐克的孤注一掷，也叠加了“电视霸权时代”以及全球篮球市场高速增长的红利。反观当下，年轻人对篮球赛事的狂热，已不复往昔。</strong></p>\n  <p>从收视数据上看，NBA的困境已经相当明显。2025年，NBA总决赛第一场的电视收视率总数不到1100万，相较于2023年下降了5%。有报道称，2025年NBA总决赛第二场全球观众仅860万人次观看，创下自2007年以来最低纪录。</p>\n  <p>如果说收视率的下降更多来自短视频媒体碎片式的传播分流，体育品牌的财报数据则能更直观地反映出行业下滑的态势。</p>\n  <p>2025年财报显示，李宁篮球品类的流水同比下降19%。这背后既有篮球运动整体处于低迷的现状，也有公司在过去两三年的主动调控。</p>\n  <p>财报会上，李宁集团执行董事、联席CEO钱炜也明确表示，“我们认为保持这样的投入和市场领先占位，也许在篮球品类回暖之前，能够继续快速扩大市场份额”<strong>“篮球品类对于李宁十分重要、万分重要，越是这样的市场环境，我们越是要坚持把品类深耕。”另有内部人士告诉36氪，与库里的签约，被李宁公司内部视作全球化的关键落子。</strong></p>\n  <p>但这份逆势出手的信心，至少在短期内难以在报表上兑现。</p>\n  <p>摩根大通指出，构建一个成熟品牌矩阵至少需要15到18个月，而合同带来的摊销成本和研发支出从2026年就已开始产生。不过摩根大通也认为影响可控，预测李宁今年广告和促销的费用将占总销售额的12%。近年来，这一数据基本控制在9%左右。</p>\n  <p>截至发稿前，包括摩根大通、中金在内的诸多机构，仍给于李宁增持或买入评级。</p>\n  <p>李宁这场“迟来的豪赌”，对标的或许从不是库里剩余的职业生命，而是中国篮球市场乃至全球篮球文化的下一个十年。唯一的问题是，投资者有没有足够的耐心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_2379c9ec57b9453fa40b39c0dae841c4@394564713_oswg68085oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-06-04T02:39:36+00:00", "fetched_at": "2026-06-04T03:36:11.998061+00:00", "fingerprint": "95cf0df91c6d047c"}, {"source": "少数派", "title": "App+1 | 零基础 3 分钟在线搞定产品演示视频：Mockup Studio", "url": "https://sspai.com/post/110059", "summary": "既不用安装客户端，也不用学习剪辑，Mockup Studio 帮你轻松制作产品演示视频。<a href=\"https://sspai.com/post/110059\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-03T03:19:02+00:00", "fetched_at": "2026-06-04T03:36:10.115703+00:00", "fingerprint": "050b8fe18607e96a"}, {"source": "少数派", "title": "让原生体验「接地气」：Pixel Text 与「原点系列」工具集", "url": "https://sspai.com/post/110458", "summary": "「原点系列」希望能在那些真正影响使用的地方做一些细致的修补，这个名字也代表着我对工具应用的一点执念。一个工具最好有清楚的边界，知道自己要解决什么，也知道自己不应该做什么。<a href=\"https://sspai.com/post/110458\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-03T07:00:00+00:00", "fetched_at": "2026-06-04T03:36:10.115697+00:00", "fingerprint": "57  "f68250d178506988"}, {"source": "The Verge", "title": "Remedy’s Control sequel launches in September", "url": "https://www.theverge.com/games/942113/remedy-control-resonant-release-date-trailer", "summary": "Control Resonant, the upcoming sequel to Remedy Entertainment's Control, will be released on September 24th, 2026, according to a trailer that premiered during Tuesday's PlayStation State of Play show. The trailer also gave a preview of the game's story, which stars Dylan Faden, who was imprisoned for much of the first game. He will be [&#8230;]", "category": "tech", "published_at": "2026-06-02T21:55:32+00:00", "fetched_at": "2026-06-03T03:40:29.742707+00:00", "fingerprint": "baf67cc3595f0156"}, {"source": "The Verge", "title": "God of War Laufey is coming to the PS5", "url": "https://www.theverge.com/entertainment/941516/god-of-war-laufey-ps5-trailer", "summary": "Sony ended its big State of Play showcase with a major reveal: the next God of War. The new title is called God of War Laufey, and is once again developed by Sony's Santa Monica Studio. Currently, the game doesn't have a date, but it's coming to the PS5 whenever it does launch. This time, [&#8230;]", "category": "tech", "published_at": "2026-06-02T22:16:08+00:00", "fetched_at": "2026-06-03T03:40:29.742698+00:00", "fingerprint": "6118247621c4ae81"}, {"source": "36氪 - 最新文章", "title": "美团在竞争中看清自己", "url": "https://36kr.com/p/3835814792492416?f=rss", "summary": "<p>作者｜任彩茹</p>\n  <p>编辑｜乔芊</p>\n  <p>参与外卖大战的三家公司中，美团最晚发出一季度财报，但给出了最超预期的“减亏”成果。</p>\n  <p>2026年一季度，美团实现收入910亿元，同比增长5.6%，基本符合预期。亮点在于经营亏损的大幅收窄，由上季度的161亿元减至65亿元，其中最受关注的核心本地商业，经营亏损从上季度的100亿元减少到20亿元，明显好于投行预测的40-45亿元。</p>\n  <p>业绩提振下，6月2日港股开盘后，美团盘中最高涨幅超9%，截至发稿，报85.25港元/股。</p>\n  <p><strong>值得关注的是，本季财报中美团还更新了两个关键的收入口径：</strong></p>\n  <ul>\n   <li>一方面，将“商品销售收入”单列，主要来自食杂零售业务（以小象超市、快驴为主）以及药品、酒类等其他自营零售业务。财报称，这一变化是为了反映零售业务的战略重要性。这部分收入原本属于“其他服务及销售”，单列之后，小象超市的增长势头会更容易追踪；</li>\n   <li>另一方面，将原本的“佣金收入”和“在线营销服务收入”合并，以“商家服务收入”的指标进行呈现。此举带来的结果是，take rate、商家广告投放意愿等更难直观衡量，到店与到家业务各自的情况进一步变得模糊，双线的竞争态势也更难观察。</li>\n  </ul>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_c5dcaefc4e3e43bf842b268d6f79f555@5748245_oswg66102oswg1788oswg750_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">美团收入呈报方式的变化（自2026年一季度起）</p>\n  <p>财报口径的变化，往往反映一家公司最真实的战略意图。这方面，美团在过去几年有多次调整，2022年一季报，美团取消披露餐饮外卖的GTV，疫情带来的消费表现之变被部分隐去；同年二季报，美团将餐饮外卖、到店酒旅以及新业务三部分收入分项，调整为核心本地商业和新业务两部分，外卖与到店业务的边界开始模糊。2023年开始，美团对年度活跃商家、用户数以及年交易笔数也不再披露。</p>\n  <p>回头来看，宏观环境的变化、竞争对手的冲击，一次次重塑和修正了美团。</p>\n  <p>一位美团人士告诉36氪，2025年外卖大战初期，一些中高层管理者多次对内表示“大家要放下手上的所有项目，全力服务竞争。”自2025年四季度左右开始，美团内部的导向变得更清晰，即不再关注整个市场的订单份额，将更多资源投向对高价值用户的争取、以及利于长期竞争力的事情上，一些此前停下的、服务于用户和商家体验优化的项目也随之被重启。</p>\n  <p>至少从历史表现来看，在最为激烈和危险的竞争中，美团反而不得不重新审视自己的优势及劣势所在，明确要什么、不要什么，进而回到“做正确的事”的轨道上。投资人徐新曾经指出美团赢下千团大战的原因，“那时行业里普遍虚报数据，但王兴的竞争对手跟我说王兴不会这样。美团除了真心对用户好，就是找到了‘三高三低’（高品质、高效率、高科技和低客单、低成本、低毛利）这个生意的本质。”</p>\n  <p>如今，美团在到店竞争上也表现出相似意味。财报后的电话会上谈及与抖音的竞争时，CFO陈少晖认为，到店业务的本质逻辑不是流量驱动，“竞争会产生一些噪音”，并表示，美团的到店业务利润率短期内将保持稳定，长期有回升空间。</p>\n  <h3>01 外卖大战来到拐点，夏季后将见分晓</h3>\n  <p>外卖UE（单位经济效益）的转正情况，是市场对美团、阿里、京东三家的集体之问。</p>\n  <p>目前来看，美团的减亏效率更高。一季度，美团核心本地商业亏损20亿元，仅是预期亏损额的一半。<strong>王兴表示，近几个月，美团一方面巩固了市场地位，另一方面扩大了与对手的UE差距，“如果竞争回归理性，Q2的UE将会比Q1有显著提升，但下半年的UE提升仍将取决于竞争环境的演变情况。”</strong></p>\n  <p>减亏路径上，美团依赖的是订单结构的改善以及运营能力的优势。知情人士称，在补贴高峰期，美团与竞争对手在订单量上一度接近平开，但在GTV份额上，美团外卖始终保持60%以上的份额。</p>\n  <p><strong>在补充电话会上，美团管理层提到，餐饮外卖业务在4月、5月已实现小幅盈利，二季度能否实现整体转正，将取决于6月的表现。</strong>值得注意的是，进入6月份，时逢618大促和世界杯等重要节点，与4-5月相比，包括外卖在内的即时零售市场的竞争烈度、补贴力度都会发生变化，但目前从各方表态来看，激烈程度大概率不会再如去年夏季一般。</p>\n  <p>阿里在3月份便提出了即时零售业务的盈利路线图——维持2028财年即时零售整体交易规模破万亿元的目标，预计2029财年即时零售业务板块将实现整体盈利。一旦行业整体进入利润修复阶段，美团在运营效率上的优势便值得期待。但局势能否在即将到来的二季度便企稳，仍取决于美团、阿里双方是否能接受当前的市场份额格局。</p>\n  <p>对美团而言，实现可持续、高质量的每日1亿单即配订单，仍然是其长期目标。</p>\n  <p>外卖业务的导向和思路明确之后，美团在到店业务上面临的竞争似乎更棘手。第一季度，美团到店酒旅的GTV同比增长10%+，收入增幅为中高个位数，利润率20%+。但伴随3月份抖音推出“抖省省”App，到店团购的竞争正在加剧。摩根士丹利在研报中称，“到店酒旅业务存在下行风险。”</p>\n  <p><strong>在抖省省这片新阵地上，抖音再度使出了流量与补贴两大工具。</strong>一方面，抖音App如今正大力为抖省省App拉新，在抖音的“团购”页面，几乎所有商品都将“去抖省省买”放在了最显眼的显示位，只有再多点击一步，才有“直接购买”的选项，且抖省省的价格均低于直接在抖音购买的价格。</p>\n  <p>用户进入抖省省App后，每个商品都会在首屏页面标明“平台补贴xx元”。以“鱼你在一起”的一份套餐为例，美团的价格是25.9元，抖省省的价格则是23.4元。但品牌和商家往往会在套餐内容中作出细节区分，譬如美团在套餐中提供的主菜选项会更多，或是在双拼套餐搭配中，价值更高的“鲜虾蟹籽云吞”在美团平台的数量会更多。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_a95fae62052a42bf9c3ac36a830e9f55@5748245_oswg307167oswg1920oswg1969_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">抖省省与美团的价格对比（左为抖省省，右为美团）</p>\n  <p>商家不会放弃美团这个成熟渠道，但也无法对抖音的流量坐视不理。<strong>QuestMobile数据显示，截至2026年5月10日，抖省省日活跃用户已经接近1600万。</strong></p>\n  <p>与外卖类似，美团在一定程度上放弃了“价格战”属性强烈的订单，将资源投向高质量增长和利润，同时坚定地投入品类扩张和市场渗透率。服务零售、低线市场，被美团视为创造增量的阵地。</p>\n  <p>以服务零售为例，王莆中在2025年6月就曾表示，“我们在线下看到的，除了卖东西的门店以外，其他大多数都是服务零售的门店，这是一个巨大的版图。”包括健身、美发、按摩、医美等在内，这部分市场的线上化程度低，相比餐饮而言，其产品更非标，交易的信息壁垒也更高。如今，美团通过为非标的“手艺人”建立数字档案等方式，提升服务零售的数字化程度。</p>\n  <p>在到店团购市场，抖音无疑是“进攻方”，但美团并非全然的“防守方”，而更像是以自己相信的方法进攻增量市场。陈少晖称，美团今年在到店团购上将专注两件事：在核心品类中强化竞争优势，以及在行业不景气的情况下，为商家打造更好的数字基础设施。管理层对于到店利润率也表现出信心，称短期内能够维持稳定，长期将回升。</p>\n  <h3>02 小象超市上牌桌，美团向新一代零售公司靠拢</h3>\n  <p>美团财报将收入呈报方式改变后，小象超市的走势更加透明。它作为自营零售的代表、前置仓的绝对头部玩家，本身在美团内部的存在感就已直线上升。</p>\n  <p>从业绩来看，尽管有“美团优选”被关停的影响，一季度，美团新业务的收入仍实现270亿元，同比增长21%，经营亏损收窄至21亿元。<strong>就最新拆出的收入分项而言，新业务的商品销售收入同比增长40.7%，小象超市贡献了最主要的增量——小象超市前置仓如今已覆盖55+城市，自有品牌产品的占比也有大幅增加。</strong></p>\n  <p>一位美团人士告诉36氪，无论开仓数量还是战略定位，“目标远大”是小象超市目前的导向，它被视为美团内部当下的第一增长业务。</p>\n  <p><strong>王兴在财报后的电话会中对小象超市的业绩给予了充分且全方位的肯定，称该业务2025年实现了非常强劲的GTV增长，显著超越了整个行业，最近加快了扩张步伐，其自有品牌（PB商品）在销售额中的占比也越来越大。</strong></p>\n  <p>他同时也谈到对零售业务的理解，“即时零售的未来增长将由多种模式驱动，既需要3P（第三方商家）模式、也需要小象超市这样的1P（平台自营）模式。”放眼长期，小象超市业务“有明确的盈利路线”，其目标是维持低个位数的利润率。</p>\n  <p>站在这个变化的时点，我们重新梳理美团的零售体系，其面向C端的零售业务主要分布在两处——核心本地商业的“美团闪购”，新业务食杂零售板块的“小象超市”、“快乐猴”等，“叮咚买菜”在收购落定后也将由食杂零售团队进行整合。</p>\n  <p>其中，美团闪购以3P模式为主，在原先整合线下小店的基础上，正着力推进更具品牌感的“品牌官旗闪电仓”的扩张；而美团自营的松鼠便利、歪马送酒同属美团闪购。<strong>据我们了解，歪马送酒即将突破2600家，北京表现较好的直营店单月利润大约在10-20万元；松鼠便利自2022年开出首店后，目前已累计覆盖79+城市，今年开仓目标是去年数倍。</strong></p>\n  <p>财报数据显示，一季度核心本地商业的“商品销售收入”同比增长96.0%，这一指标侧面反映了美团自营的医药、歪马送酒和松鼠便利的迅猛增势，但其29.83亿元的收入规模与新业务板块的179.89亿元仍有较大差距，尚不能担起规模重任。</p>\n  <p>如今，大公司间的即时零售竞争从餐饮外卖转向非餐的零售品类。阿里重申即时零售的规模目标，美团将小象超市战略提级、收购叮咚买菜，都是在为此做准备。</p>\n  <p>即时零售的美好蓝图里，零售公司与互联网公司的边界正在消融。2026年2月3日，零售公司沃尔玛的股价突破125.47美元/股，市值迈过万亿美元大关（截至发稿其市值回落为9135亿美元），在此之前，万亿美元俱乐部中的公司大多为科技公司。</p>\n  <p>线上业务的蓬勃发展、对AI应用的积极尝试，成为沃尔玛股价大幅上涨的主要驱动力。投资管理公司Logan Capital Management称，“沃尔玛管理层极具远见，他们不仅将沃尔玛定位为零售商，更将其重新定义为一家科技公司。”而中国市场在这方面的表现显然更为先进，几乎算是沃尔玛近几年线上业务增长的“老师”。</p>\n  <p>如今，传统零售巨头、互联网科技大公司，正在零售领域产生更大交集。新一代的零售商势必要更具便捷性、兼具科技属性，这是美团一直在强调的“零售+科技”定位。至少从目前来看，美团是最靠近未来零售公司的其中一家。</p>", "category": "tech", "published_at": "2026-06-02T09:20:31+00:00", "fetched_at": "2026-06-03T03:40:29.535724+00:00", "fingerprint": "10d420a94eab4a0a"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜私募股权公司Ardian将与Verne合作，斥资50亿欧元在法国建数字基础设施园区；快手：平台累计催生189个新职业，其中由AI发展带来的新职业达15个；中央财政下达育儿补贴补助资金999亿元支持实施育儿补贴制度", "url": "https://36kr.com/p/3834354708031111?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3835631030990214\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>高德与新加坡旅游局启动战略合作，将落地首个与海外国家旅游局共建扫街榜</strong></a></p>\n  <p>36氪获悉，6月2日，高德地图与新加坡旅游局（Singapore Tourism Board）在北京签署战略合作备忘录，双方将联合打造首个海外国家旅游局共建文旅榜单——新加坡扫街榜，并将高德飞行街景技术首次落地海外。除了榜单共建，高德还将会把国内已成熟的飞行街景技术应用于新加坡，基于自研空间智能技术，以360°全景视角呈现景点、酒店、街区和餐厅实景，让游客出发前即可直观判断目的地是否符合预期。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835794927547785\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>江西国家稀土技术创新中心成立，注册资本12.5亿</strong></a></p>\n  <p>36氪获悉，天眼查App显示，近日，江西国家稀土技术创新中心有限公司成立，法定代表人为谢志宏，注册资本12.5亿人民币，经营范围包括矿产资源勘查、自然科学研究和试验发展、工程和技术研究和试验发展等。股东信息显示，该公司由中国稀土集团有限公司、中国科学院赣江创新研究院、中核资源发展有限公司共同持股。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835788037944709\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>文远知行与Uber宣布落地西班牙首个Robotaxi服务</strong></a></p>\n  <p>36氪获悉，6月2日，文远知行WeRide与优步Uber宣布，计划在马德里（Madrid）推出西班牙首个商业化Robotaxi试点服务。这是文远知行与Uber首次携手进入欧洲市场，马德里也将成为文远知行Robotaxi驶入的全球第十二座城市。未来，随着关键运营指标逐步达成，文远知行、AVOMO与Uber承诺将进一步投放数百辆Robotaxi，并推动纯无人Robotaxi商业化服务覆盖马德里核心城区。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835767150392451\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>私募股权公司Ardian将与Verne合作，斥资50亿欧元在法国建数字基础设施园区</strong></a></p>\n  <p>当地时间6月1日，法国私募股权公司Ardian宣布将与旗下数据中心集团Verne合作，在法国法兰西岛地区开发下一代数字基础设施园区。该项目投资额最高可达50亿欧元，目标总装机容量500兆瓦，一期工程将于2030年前建成。（界面）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835731229537414\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>谷歌与澳洲电信Telstra合作，共建澳大利亚光纤及海底光缆网络</strong></a></p>\n  <p>谷歌与澳大利亚电信Telstra于周二官宣一项网络共享合作协议：谷歌将租用Telstra新建光纤网络的线路资源，同时可接入由谷歌出资建设、连通澳大利亚与美国、日本及太平洋岛国的海底光缆。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835726599009412\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蓝色起源火箭发射台恢复工作或持续至2028年</strong></a></p>\n  <p>美国航空航天局局长艾萨克曼6月1日表示，美国蓝色起源公司“新格伦”重型运载火箭爆炸事故中受损的发射设施恢复工作可能需要持续至2028年。5月28日，“新格伦”重型运载火箭在佛罗里达州卡纳维拉尔角太空军基地进行发动机点火测试时发生爆炸。蓝色起源随后证实，火箭在测试过程中出现“异常状况”，事故未造成人员伤亡。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835711924843657\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中国内地航线燃油附加费将下调</strong></a></p>\n  <p>从中国国航等航空公司获悉，自6月5日0时起销售的中国内地航线客票，燃油附加费将下调。具体标准为：800公里（含）以下航线每航段80元，800公里以上航线每航段150元。婴儿旅客免收燃油附加费，儿童、革命伤残军人、因公致残人民警察客票燃油附加费减半收取。据介绍，对比现行燃油附加费标准，800公里（含）以下航线将下调10元，800公里以上航线将下调20元。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835661619246471\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>快手：平台累计催生189个新职业，其中由AI发展带来的新职业达15个</strong></a></p>\n  <p>36氪获悉，6月2日，快手发布《2025年度快手企业社会责任报告》。报告显示，截至2025年底，快手平台共带动4860万个就业机会，其中平台直接带动就业2600万个，商业生态体系带动就业1548万个，内容生态体系带动就业712万个。与此同时，平台累计催生189个新职业，其中由AI发展带来的新职业达到15个，涵盖AIGC应用师、提示词工程师、AI导演、人工智能训练师等多个方向。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3835578612708488\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>高通CEO安蒙：智能体已成现实，终端变革加速到来</strong></a></p>\n  <p>36氪获悉，高通公司总裁兼CEO安蒙于COMPUTEX 2026（台北国际电脑展）发布开幕主题演讲。安蒙强调，智能体正成为AI词元（token）需求的核心来源，推动AI规模化落地，并将定义AI架构与经济模式。未来的智能体将能够主动代替用户运行计算，任务自动分配，充分利用全场景算力。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3835504617174149\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中央财政下达育儿补贴补助资金999亿元支持实施育儿补贴制度</strong></a></p>\n  <p>36氪获悉，据财政部为贯彻落实党中央、国务院决策部署，财政部近期下达2026年育儿补贴补助资金999亿元，较上年增长10.6%，支持各地为符合条件的婴幼儿发放育儿补贴。预计全年各级财政共安排补贴资金约1100亿元。目前，2026年育儿补贴发放工作正在平稳有序开展。根据相关管理规定，各级卫生健康部门负责育儿补贴审核发放的组织实施，原则上每季度至少集中发放一批；上个季度审核通过的申请，应当于本季度末前发放到位。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835812605277575\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国务院：有序推进农业农村领域低空经济发展</strong></a></p>\n  <p>36氪获悉，国务院印发《加快农业农村现代化“十五五”规划》。其中提到，��进高端智能、丘陵山区适用农机装备研发应用。分类培育农机装备领域龙头企业、制造业单项冠军企业、专精特新中小企业，支持企业加强生产线技术改造、加快数字化转型，建强农机装备领域先进制造业集群、中小企业特色产业集群。体系化推进新能源农机装备技术研发、产业协同和基础设施建设。有序推进农业农村领域低空经济发展。加强现代设施农业装备自主研发，分类有序推进老旧设施更新改造。实行农机购置与应用补贴“优机优补”、“有进有出”和老旧农机报废更新。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835741426119815\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>欧洲议会投票通过欧美贸易协议</strong></a></p>\n  <p>欧洲议会国际贸易委员会当地时间6月2日投票通过欧美贸易协议。2025年7月，美国总统特朗普和欧盟委员会主席冯德莱恩在英国宣布美欧达成新贸易协议，但后来双方因美国索要丹麦自治领地格陵兰岛引发关系紧张，加之美国最高法院裁定美国政府大规模关税政策违法等原因，欧盟对协议的批准经历数月延迟。今年3月26日，欧洲议会投票支持有条件执行欧美贸易协议，但希望增加一些保障措施。今年5月，欧盟各成员国就议会的建议达成一致。 （央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3835639606260869\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>上海：力争到2030年，上海资产管理规模达55万亿元，全国占比达1/3</strong></a></p>\n  <p>36氪获悉，上海市人民政府办公厅印发《关于深化上海全球资产管理中心建设的若干意见》的通知，其中提到，为进一步推动上海资产管理领域高质量发展，加强资产管理与财富管理双轮驱动，加快人民币国际化进程，畅通境内外资产多元配置，提升上海人民币资产全球配置和风险管理功能，切实增强上海国际金融中心竞争力和影响力。力争到2030年，上海资产管理规模达55万亿元，全国占比达1/3。</p>", "category": "tech", "published_at": "2026-06-02T11:50:30+00:00", "fetched_at": "2026-06-03T03:40:29.535719+00:00", "fingerprint": "49c6663afb7fb723"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨腾讯股价暴涨，创2021年后单日最高涨幅；预计今年安排约1100亿育儿补贴；英伟达与微软合作推出统一技术栈", "url": "https://36kr.com/p/3836703946257542?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>豆包付费或专注复杂任务， 定价锚定ChatGPT</li>\n   <li>英伟达CEO黄仁勋：Vera CPU将比GPU更受欢迎，将成为公司新的主要增长动力</li>\n   <li>中国内地航线燃油附加费将下调</li>\n   <li>标签上存在拼写错误，瑞幸客服称遇到“HeeloKitty”可退款</li>\n   <li>马尔代夫将限制16岁以下青少年访问部分社媒平台</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>腾讯股价暴涨：创2021年1月以来单日最高涨幅纪录</strong></p>\n  <p>6月2日午后，香港恒生科技指数一度涨超4%。恒生科技指数成分股中，美团、腾讯控股涨近9%，阿里巴巴涨近6%。腾讯控股股价午后持续震荡上行。截至13:12，腾讯控股股价报474.4港元/股，涨幅为8.81%，总市值为4.33万亿港元。腾讯控股（00700.HK）强势拉升，收盘大涨10.46%，报481.6港元，创下2021年1月以来单日最高涨幅纪录，市值飙升至4.39万亿港元。</p>\n  <p>值得注意的是，此轮大涨行情前，腾讯股价曾经历了长达8个月的低迷态势，自2025年10月触及677.7港元阶段高点后，公司股价震荡下行，历经多轮调整，在2026年5月28日下探至420.4港元年内低点，区间最大回撤幅度接近38%。进入5月份后，腾讯股价一直在420港元至470港元区间窄幅拉锯，盘面呈现反弹乏力、重心缓慢下移的特征，阶段性成交持续萎缩，市场整体避险情绪浓厚。6月1日，美团CEO王兴在财报后的电话会上介绍，美团AI助手“小美”与腾讯元宝的合作将于近期上线。届时用户可直接在“元宝”中输入诉求，通过“小美”调用外卖等本地生活服务，完成一站式交易。（界面新闻、红星新闻）</p>\n  <p><strong>国内预计今年共安排育儿补贴约1100亿</strong></p>\n  <p>为贯彻落实党中央、国务院决策部署，财政部近期下达2026年育儿补贴补助资金999亿元，较上年增长10.6%，支持各地为符合条件的婴幼儿发放育儿补贴。预计全年各级财政共安排补贴资金约1100亿元。目前，2026年育儿补贴发放工作正在平稳有序开展。根据相关管理规定，各级卫生健康部门负责育儿补贴审核发放的组织实施，原则上每季度至少集中发放一批；上个季度审核通过的申请，应当于本季度末前发放到位。（央视新闻）</p>\n  <p><strong>英伟达与微软达成合作：推出统一技术栈，用于部署Agentic AI</strong></p>\n  <p>在微软Build开发者大会上，英伟达与微软达成合作，推出统一技术栈，用于部署代理式人工智能（Agentic AI），覆盖从Windows设备到云端再到本地的全场景。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>微软推出首个AI推理模型Mai-Thinking-1</strong></p>\n  <p>微软AI负责人表示，Mai-Thinking-1是微软人工智能推出的首个推理模型Mai-Thinking-1，该模型拥有350亿活跃参数。（财联社）</p>\n  <p><strong>腾讯云：下调DeepSeek-V4系列模型价格，最高降幅97.5%</strong></p>\n  <p>36氪获悉，腾讯云公告，为持续降低用户使用成本，腾讯云智能体开发平台将于北京时间2026年6月3日00:00对DeepSeek-V4系列模型价格进行下调，最高降幅达97.5%。本次调整仅涉及价格变更，模型服务能力保持不变。</p>\n  <p><strong>宇树科技IPO审核状态变更为“提交注册”</strong></p>\n  <p>上交所官网显示，6月2日，宇树科技股份有限公司科创板IPO审核状态变更为“提交注册”。（第一财经）</p>\n  <p><strong>豆包付费或专注复杂任务，定价锚定ChatGPT</strong></p>\n  <p>6月2日，字节跳动旗下大模型豆包预计将在6月下旬正式上线付费内容。</p>\n  <p>此前，豆包AppStore页面曾经出现付费版本服务声明。当时豆包官方回应：“豆包始终提供免费服务，在免费服务的基础上，豆包也在探索推出更多增值服务，以满足不同用户的差异化需求。相关方案细节目前还在测试阶段，正式上线时会通过官方渠道发布完整信息。”</p>\n  <p>据接近豆包的人士透露，付费功能将主要专注在复杂任务和生产力场景，如PPT生成、数据分析、影视制作等。</p>\n  <p>有业内人士指出，豆包的定价锚定ChatGPT，标准版（约合9.9美元）收费与ChatGPT Go/Plus（8-20美元）处于相近区间，专业版（约73美元）则大致位于Pro版和中国市场消费水平交叉点上。（澎湃新闻、TechWeb）</p>\n  <p><strong>字节Seed旗下AI4S核心成员顾全全将离职</strong></p>\n  <p>字节跳动Seed旗下聚焦科学智能领域的AI4S（Seed-AI for Science）团队核心成员顾全全在X平台上官宣自己将离职。</p>\n  <p>据悉，顾全全于2023年加入字节Seed。他表示，自从加入字节跳动以来，一直主导着用于药物发现的AI工作。团队构建了以下成果：SeedFold、SeedProteo以及DPLM系列的蛋白质语言模型，还有数个其他的 AI for Science（AI 驱动科学研究）项目。</p>\n  <p>顾全全于2007年和2010年分获清华大学自动化专业学士、控制科学与工程硕士学位，2014年获伊利诺伊大学香槟分校计算机科学博士学位。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美股三大指数集体收涨，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，6月2日收盘，美股三大指数集体上涨，道指涨0.45%，纳指涨0.03%，标普500指数涨0.13%。大型科技股多数下跌，微软跌超4%，谷歌跌超3%，奈飞跌超2%，亚马逊、英特尔跌超1%，英伟达、Meta小幅下跌；苹果涨超2%，特斯拉涨超1%。热门中概股多数上涨，36氪涨超7%，理想汽车涨超6%，阿里巴巴、小鹏集团涨超4%，京东、百度涨超3%，哔哩哔哩、网易、拼多多涨超1%；老虎证券、爱奇艺跌超3%，知乎跌超2%。</p>\n  <p><strong>老虎国际：6月12日起，暂停中国境内存量账户新开仓、加仓交易&nbsp;</strong></p>\n  <p>老虎国际发布通知称，为落实2年集中整治期的行业监管要求，推动跨境证券业务规范发展，老虎国际将对存量投资者账户在中国境内的服务进行相应调整。自北京时间2026年6月12日起，针对在境内交易服务，暂停股票等所有品种的新开仓、加仓交易，仅支持卖出、平仓操作；针对在境内资金划转服务，暂停资金转入，转出功能保持正常，全力保障客户资金安全。</p>\n  <p>老虎表示，本次调整不会影响为存量投资者在境外提供服务，也不影响全体客户现有资产安全，客户可正常查询账户、持有及卖出已有持仓。（证券时报）</p>\n  <p><strong>英伟达CEO黄仁勋：Vera CPU将比GPU更受欢迎，将成为公司新的主要增长动力</strong></p>\n  <p>英伟达CEO黄仁勋周二在台北Computex大会的英伟达媒体见面会上表示，目前在芯片供应方面的确存在一些限制，这仍是一个令人担忧的问题。“我们已经为所有这些系统的强劲增长确保了供应。”黄仁勋表示，“我们有足够的供应来实现非常强劲的增长，但的确仍然存在供应限制。”黄仁勋还表示，公司的Vera CPU将比其GPU更受欢迎，因为Vera CPU在处理信息方面起着至关重要的作用，“Vera CPU将成为我们新的主要增长动力。”（财联社）</p>\n  <p><strong>柠季接手哈根达斯中国内地门店</strong></p>\n  <p>北京时间6月2日，通用磨坊公司宣布，已与投资者集团达成最终协议，将其在中国内地的哈根达斯门店业务授权给包含柠季在内的投资者集团。作为协议的一部分，受让方将获得通用磨坊的独家许可，在中国内地的冰淇淋门店及礼品业务中独家使用哈根达斯品牌。通用磨坊将继续拥有并运营哈根达斯在中国的零售和餐饮业务。</p>\n  <p>这意味着，柠季将接手哈根达斯中国内地门店。该拟议交易预计将于2026年日历年内完成。根据欧睿国际提供的数据，2025年以餐饮交易额计算的中国冰淇凌有限服务餐厅品牌中，哈根达斯排在第三位，居于野人先生和DQ之后。（中新经纬）</p>\n  <p><strong>英伟达Spectrum-X以太网硅光技术现已全面量产，较传统收发器的网络能效提升5倍</strong></p>\n  <p>英伟达宣布，NVIDIA Spectrum-X以太网硅光技术现已全面量产，新一代 Spectrum-X交换机基于光电一体封装技术（CPO）构建，支持NVIDIA Vera Rubin平台在数据中心进行横向扩展和跨区域扩展部署AI工厂。Spectrum-X以太网硅光技术是NVIDIA全栈协同设计的典范代表之一。与使用传统收发器的网络相比，Spectrum-X以太网硅光技术可实现能效提升5倍，AI正常运行时间提升5倍，部署时间快1.3倍。（财联社）</p>\n  <p><strong>中国内地航线燃油附加费将下调</strong></p>\n  <p>从中国国航等航空公司获悉，自6月5日0时起销售的中国内地航线客票，燃油附加费将下调。具体标准为：800公里（含）以下航线每航段80元，800公里以上航线每航段150元。婴儿旅客免收燃油附加费，儿童、革命伤残军人、因公致残人民警察客票燃油附加费减半收取。据介绍，对比现行燃油附加费标准，800公里（含）以下航线将下调10元，800公里以上航线将下调20元。（新华社）</p>\n  <p><strong>阿迪达斯发“进城办事”T恤，客服回应</strong></p>\n  <p>近日，阿迪达斯一款外套商品文案 “在城里办事” 意外走红。该表述本是对都市通勤穿搭的描述，但翻译引发语义误解，随后该词汇迅速在社交平台发酵出圈。</p>\n  <p>面对网络热议，阿迪达斯官方账号顺势玩梗，不仅发文搭配“去城里办事适合穿这几件”，在视频平台官方账号甚至发布了“进城办事”T恤，评论区不少网友催促上架售卖。&nbsp;</p>\n  <p>6月2日，蓝鲸新闻记者询问阿迪达斯各平台客服，均表示目前官号发布的款式，还没有上架售卖，后续可以关注门店。（蓝鲸新闻）</p>\n  <p><strong>标签上存在拼写错误，瑞幸客服称遇到“HeeloKitty”可退款</strong></p>\n  <p>6月1日，多地网友在社交平台发帖称，瑞幸咖啡与Hello Kitty的“六一特辑”联名周边中，部分毛绒挂件的标签上存在拼写错误，经典标识“HELLO KITTY”被错印成“HEELO KITTY ”（即把“L”误印成了“E”）。</p>\n  <p>瑞幸咖啡官方客服对记者表示，已经接到通知，确实有一批货出现了这个问题。“消费者可以提供下单手机号，我们这边联系下单门店帮忙更换一个新的。如果门店如果没货，可以直接申请退款整单商品。”（中新经纬）</p>\n  <p><strong>李宁品牌与库里品牌达成长期合作</strong></p>\n  <p>36氪获悉，李宁品牌正式宣布，与斯蒂芬·库里（Stephen Curry）及库里品牌（Curry Brand）达成长期合作。双方将以品牌共建为基础，围绕多品类专业运动装备开发、体育文化推广与新一代年轻运动群体链接，共同探索李宁品牌与库里品牌全球化发展的更多可能。</p>\n  <p><strong>二手平台现泡泡玛特粽子代购帖</strong></p>\n  <p>6月2日，泡泡玛特官方账号在社交平台，发布了泡泡玛特粽子礼盒详情，引发网友热议。官方介绍显示，粽子礼盒分甜粽礼盒和咸粽礼盒，售价分别为158元和168元，每单限购4盒，每日数量有限，当日售完为止。&nbsp;</p>\n  <p>泡泡玛特乐园工作人员回应记者称，粽子礼盒已经正式开售，如果来乐园游玩可以顺便购买，不来乐园可以前往指定门店购买。蓝鲸新闻记者注意到，在二手平台上，已经出现了多个泡泡玛特粽子售卖帖，每盒加价30元—50元不等。（蓝鲸新闻）</p>\n  <p><strong>欧盟拟出台新规，限制美国大型科技公司参与战略性项目招标</strong></p>\n  <p>6月1日报道，相关文件显示，欧盟计划针对关键政府公共采购项目中的云计算服务出台严苛准入标准，此举或将把亚马逊、微软与谷歌三大美国科技企业排除在相关项目之外。据报道，该提案是欧盟委员会《云计算与人工智能发展法案》的组成内容。欧盟数字事务专员亨娜·维尔库宁将于6月3日正式公布该提案的内容及配套政策。据悉，该提案的核心目标是降低欧盟对美国科技产品的依赖并扶持本土企业发展。 （央视新闻）</p>\n  <p><strong>宇树单款人形机器人累计生产下线约11000台</strong></p>\n  <p>36氪获悉，据宇树科技消息，宇树单款人形机器人累计生产下线约11000台。</p>\n  <p><strong>蓝色起源火箭发射台恢复工作或持续至2028年</strong></p>\n  <p>美国航空航天局局长艾萨克曼6月1日表示，美国蓝色起源公司“新格伦”重型运载火箭爆炸事故中受损的发射设施恢复工作可能需要持续至2028年。5月28日，“新格伦”重型运载火箭在佛罗里达州卡纳维拉尔角太空军基地进行发动机点火测试时发生爆炸。蓝色起源随后证实，火箭在测试过程中出现“异常状况”，事故未造成人员伤亡。（新华社）</p>\n  <p><strong>公安交管局就综艺安全带P图发声</strong></p>\n  <p>据公安部交通管理局，近期，某综艺节目播出后被眼光敏锐的网友发现，多名嘉宾在乘车时并没有真的系安全带，而是节目组通过后期技术添加，P图痕迹相当明显。公安部交通管理局提醒：安全不是做样子给别人看，安全更容不得自欺欺人！中国道交法中明确规定：“机动车行驶时，驾驶人、乘坐人员应当按规定使用安全带。”对数量可观的粉丝、受众而言，明星、综艺节目的示范作用不可小觑，更应在涉及公共利益、公共安全的问题上严格以身作则，严格遵守法律法规，严格守住安全底线。（北京日报）</p>\n  <p><strong>马尔代夫将限制16岁以下青少年访问部分社媒平台</strong></p>\n  <p>当地时间6月1日，马尔代夫总统穆伊兹在新闻发布会上宣布，政府决定限制16岁以下青少年访问某些社交媒体平台，该规定将在一年内全面实施。马尔代夫政府表示，此举旨在保障儿童福祉和社区安全。目前，马尔代夫政府对针对青少年的网络诱骗、网络霸凌等内容的传播十分担忧。（央视新闻）</p>\n  <p><strong>豆包公司已注册“豆包老师”商标</strong></p>\n  <p>36氪获悉，天眼查App显示，豆包关联公司北京春田知韵科技有限公司成立于2023年7月，法定代表人为严林，注册资本100万人民币，经营范围包括计算机系统服务、数据处理服务、软件开发等，由北京抖音信息服务有限公司全资持股。知识产权信息显示，该公司已成功注册多枚“豆包老师”“豆包输入法”“豆包轻服务”等商标，国际分类涉及通讯服务、广告销售等。</p>\n  <p><strong>燃油涨价，印度多家航空公司大幅削减航班</strong></p>\n  <p>由于航空燃油成本上涨和旅行需求疲软，印度航空公司、靛蓝航空公司和印度航空快运公司决定自1日起大幅削减国内航班。此前，这些航空公司已削减部分国际航班。据印度媒体报道，这次航班削减安排预计将持续至8月，届时正值暑期出行高峰，航班减少可能会进一步推高机票价格并给旅客出行带来不便。根据计划，印度航空公司将减少约22%的国内航班，其子公司印度航空快运将减少近10%，靛蓝航空则削减约5%至7%，三家公司合计每日减少约250架次航班。（财联社）</p>\n  <p><strong>特朗普将农业设备进口关税从25%降至15%</strong></p>\n  <p>白宫发布声明称，美国总统特朗普签署一项公告，调整了某些金属的关税。该行动还将现有适用15%关税的工业设备类别，扩大到移动式工业设备，例如推土机和叉车，但须从享有此类待遇的贸易协定国家进口。（新浪财经）</p>\n  <p><strong>业内人士：苹果考虑采用LG Display的新面板技术</strong></p>\n  <p>LG Display正在开发一种名为高迁移率氧化物（HMO）的薄膜晶体管（TFT）背板技术，该技术将应用于第六代中小尺寸OLED。由于苹果公司正在考虑将HMO作为下一代低功耗背板的候选材料，以取代低温多晶氧化物（LTPO）TFT，LG Display已开始对该技术进行验证。韩国业内人士推测，LG Display的HMO技术可能主要应用于Apple Watch等设备中使用的OLED显示屏。另外，苹果并不倾向于独家供货，而是更倾向于双渠道或三渠道供货策略。（财联社）</p>\n  <p><strong>可口可乐正考虑将印度装瓶业务上市</strong></p>\n  <p>可口可乐公司周一表示，正考虑在印度为其在该国最大的装瓶商——印度斯坦可口可乐饮料公司（Hindustan Coca-Cola Beverages）进行首次公开募股（IPO）。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>SpaceX计划最早于周三确定IPO条款</strong></p>\n  <p>据知情人士称，SpaceX计划最早于周三下午确定首次公开募股（IPO）的条款。上述知情人士透露，这家由马斯克创立的火箭发射、卫星及人工智能公司，将在更新后的文件中披露其价格区间和计划发行的股份数量。公司可以在文件公开15天后正式开始IPO市场推介。在路演开始前一晚确定条款将使投资者有更多时间评估估值，尤其考虑到SpaceX计划进行相对较短的路演，且最早可能在6月11日定价。（新浪财经）</p>\n  <p><strong>PT Merdeka&nbsp;Gold Resources Tbk - S通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，据港交所文件，PT Merdeka Gold Resources Tbk - S更新聆讯后资料集，意味着该公司港交所IPO通过聆讯。</p>\n  <h2>大公司财报</h2>\n  <p><strong>老虎国际：一季度营收1.55亿美元，同比增长26.3%</strong></p>\n  <p>36氪获悉，老虎国际公布2026年第一季度未经审计财务数据，期内实现营收1.55亿美元，同比增长26.3%；公司经营利润为4755万美元，同比增长17.5%。</p>\n  <h2>酷产品</h2>\n  <p><strong>黄仁勋：N2X、N3X正在开发中</strong></p>\n  <p>6月1日，英伟达发布全新PC端超级芯片RTX Spark（N1X），标志着公司正式进军Windows PC主处理器赛道。黄仁勋2日在媒体见面会上称，N1X是长线布局的平台架构，除N1X之外，N2X、N3X均在研发进程中，同时还会推出尺寸更小的N1芯片，持续丰富产品矩阵，依托完善软件生态优化AIPC使用体验。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“华融科创”完成A轮超亿元融资</strong></p>\n  <p>36氪获悉，近日，“华融科创”宣布完成超亿元A轮融资。本轮融资由比邻星投资领投，浩悦资本担任此次交易的独家财务顾问。本轮融资为集团首轮融资，后续将持续聚焦前沿技术研发，深化产学研融合与创新成果转化，并加速拓展海外市场，为医疗产业高质量发展贡献力量。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜徐嘉彤&nbsp;</p>", "category": "tech", "published_at": "2026-06-03T00:21:18+00:00", "fetched_at": "2026-06-03T03:40:29.535714+00:00", "fingerprint": "3ee7cf270c4cda8f"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 浙大教授团队获财通、商汤投资，做高危场景具身机器人大脑", "url": "https://36kr.com/p/3836744788014208?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，高危作业领域具身智能公司杭州旷行科技有限公司（以下简称“旷行科技”）近期已完成数千万元市场化第一轮融资（Pre-A轮），由财通资本和商汤国香投资。本轮资金将主要用于算法研发、产品矩阵完善及市场拓展。</p>\n  <p>旷行科技2025年成立于杭州，是一家专注为高危工业工程领域（资源矿山、能源电力、油气化工、交通城建）提供“机器人+AI大脑”运维解决方案的具身智能公司。公司创始人舒江鹏为国家级高层次青年人才、浙江大学百人计划研究员、博导，团队自2011年起开展智慧城市AI与工程机器人技术研发，拥有超过15年的行业负样本标注数据积累与技术沉淀。</p>\n  <p>不同于市面上常见的巡检机器人，旷行科技的核心能力不光是机器人在复杂工程场景下的移动控制，更多在于赋予机器人在高危作业，尤其是针对基建部分的“识别+诊断+处置”能力的“工程师大脑”。</p>\n  <p>“现在的机器人大多停留在‘巡视’阶段，能看到问题，但看不懂、更不会处置。”舒江鹏告诉硬氪。旷行科技通过自研的工程多模态大模型，融合图像、点云、超声、电磁波、红外等多传感器数据，能实现对混凝土开裂、钢结构锈蚀、岩土失稳等表观及隐蔽病害的亚毫米级定量识别与状态诊断，而非简单的定性判断。</p>\n  <p>目前，旷行科技主要采用“整机解决方案供应商”的轻资产模式。公司采购或与头部厂商合作生产机器人本体，加装自研的标准化“大脑盒子”与上装设备，形成完整解决方案交付给终端客户。同时，部分本体厂商缺乏垂直场景解决能力，也会主动将订单推送给旷行，形成协同效应。</p>\n  <p>团队的另一关键优势体现在数据及垂类算法的积累上。依托浙大土木系的背景，旷行科技拥有全球基建领域（据行业公开数据）最大的结构化多模态数据库并且做好了清洗与标注，涵盖混凝土/钢结构/岩土表观与隐蔽病害、设备故障、人员安全等数百万个专业标注负样本，数据量级领先同行两个数量级以上。这使得其算法在诊断精度和泛化能力上具备显著壁垒。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_ba84e4f3cc124a6496a4d3ae961e9857@6221844_oswg406398oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具备多机器人控制及智能体分析能力的工程运维数字孪生平台（图源/企业）</p>\n  <p>商业化方面，公司已初步打开局面。成立当年，旷行科技与江西铜业、国家电网、中国电建等头部企业签订合同，合同额达数千万元。产品已在矿山、隧道、电力等场景试点应用，替代工人完成高风险运维工作。</p>\n  <p>舒江鹏给硬氪算了一笔账：“以矿山为例，一条高危作业巷道需要4名工人两班倒，加上携带设备，年综合成本超100万。而一台加上装的四足机器人产品成熟量产后成本几十万，整机使用寿命可达3年。不仅成本优势明显，更能避免因安全事故导致的停产风险。”</p>\n  <p>根据舒江鹏介绍，目前旷行科技还做不到100%覆盖所有作业，剩下的一半仍需人工。他们的目标是通过不断积累数据、迭代算法，把覆盖率从50%提升到90%以上。</p>\n  <p>而旷行科技对自身未来规划很清晰，“做最懂工程的机器人‘大脑’，用数据和算法解决诊断和维修的核心难题。”舒江鹏告诉硬氪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_8ea5f3a744ac429680972301faf8051d@6221844_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">四足机器人矿下运维:对矿山岩体状态作毫米级定量识别与诊断（图源/企业）</p>\n  <p><strong>以下是硬氪与舒江鹏的对话精选：</strong></p>\n  <p><strong>硬氪：与市面上其他巡检机器人相比，旷行的技术优势具体体现在哪？</strong></p>\n  <p><strong>舒江鹏：</strong>我们的技术核心是高精度定量与多模态识别。大部分AI做的是定性识别，比如“这里有裂缝”。我们能识别裂缝有多宽，走向如何，精确到毫米甚至亚毫米级，这对工程维护决策至关重要。</p>\n  <p>此外，很多缺陷藏在结构内部，视觉无法发现。我们融合了超声、电磁波、红外等技术，能“透视”结构内部的脱空。这背后是我们团队在基建+AI交叉领域超过15年的积累，我们的专业标注负样本数据量级是百万级，而行业普遍只有几千张。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260603/v2_a98ddd93052a458cba9c881ad42c4788@6221844_oswg138419oswg1080oswg1470_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">旷行产品：工程大脑KX及具身智能全套解决方案（图源/企业）</p>\n  <p><strong>硬氪：公司目前在商业化落地中遇到的最大挑战是什么？</strong></p>\n  <p><strong>舒江鹏：</strong>主要是机器人的稳定性和全面性。在实验室跑通不难，但在矿山井下，网络信号变化、巷道结构微调，机器就可能“犯傻”。目前我们还做不到100%覆盖所有作业点，比如只能解决一半的点位，剩下的一半仍需人工。</p>\n  <p>我们的目标是通过不断积累数据、迭代算法，把这个覆盖率从50%提升到90%以上，让客户从“需要人照顾机器”过渡到“可以回家睡安稳觉”。 但趋势是不可逆的，因为年轻人已经不愿意下矿井了，你不用机器人，就没有人干活。</p>\n  <p><strong>硬氪：未来产品规划上，公司会做人形机器人吗？如何看待四足和人形的路线之争？</strong></p>\n  <p><strong>舒江鹏：</strong>短期内我们仍以四足或相关产品为主。原因很简单，可靠性。高危工业工程领域不容出错，万一摔倒损失较大，在复杂地形下，四足的稳定性远超现在的双足。</p>\n  <p>人形机器人可能还需要三到五年才能达到高危工程场景应用的可靠性。我们会持续关注，但本体硬件不是我们的重点，那是本体厂商的战场。我们的定位很清晰——做最懂工程的机器人“大脑”，用数据和算法解决诊断和处置的核心难题。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>商汤国香投资人：</strong>特种行业，高危安全隐患问题严重，机器人替人逻辑清晰。因此特种机器人领域运维需求大，替人需求持续上行。我们看好旷行机器人在多场景如基建、矿山、交通、水利、能源、电力、化工等领域具备的空-地-矿一体巡、检甚至修的系统方案，基于多模态模型与智能体形成软硬一体的运维巡检修解决方案。团队即具备浙大、斯坦福和伯克利的技术背景，同时很好的融合了接地气的市场化团队，很有效地实现了解决方案的落地。期待公司成为特种机器人行业的领军企业，重塑传统行业的安全生产模式。</p>\n  <p><strong>财通资本投资人：</strong>财通资本长期关注具备“手—脑—眼”协同能力的下一代机器人赛道。旷行科技最核心的差异化在于——不只是做机器人本体，而是以工程多模态大模型+数十年行业标注数据库为护城河，让巡检机器人和无人机真正具备“理解工程缺陷并自主诊断”的能力，解决了传统运维机器人“强巡弱检”的行业痛点。</p>\n  <p>团队源自浙大—斯坦福学术基因，承担过多项国家重点研发计划，在真实工业场景已跑通从算法到订单的闭环，与江铜集团等头部客户达成合作，商业化验证达到预期。作为扎根浙江的省属券商系投资机构，财通资本也将通过“资本+投行+产业资源”的综合赋能，助力旷行科技加速产品迭代与市场拓展，共同服务工业安全与数字化。</p>", "category": "tech", "published_at": "2026-06-03T01:10:00+00:00", "fetched_at": "2026-06-03T03:40:29.535707+00:00", "fingerprint": "04c832a0e6223629"}, {"source": "36氪 - 最新文章", "title": "深圳具身公司星尘智能完成超10亿B轮融资，估值破百亿｜硬氪首发", "url": "https://36kr.com/p/3836068296209537?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，绳驱AI机器人公司星尘智能（Astribot）近日完成B轮系列融资，三个月内三轮累计融资额超10亿元，投资方包括梁溪科创产业二期母基金（博华资本管理）、扬州龙投芯粒、中博聚力、中科创达、科德教育、某头部上市企业及国科投资等老股东持续追投。</p>\n  <p>目前星尘智能估值已突破百亿元，这也是深圳诞生的又一家具身智能百亿独角兽。此前，公司投资方阵容中已出现了腾讯、阿里、字节系机构的身影。</p>\n  <p>商业化方面，星尘智能还同步拿下了几个产业场景合作订单，包括与中科创达的千台级工业及商业服务订单并推进出海，与江都经开区共建亿元级应用创新中心落地文旅酒店场景等。</p>\n  <p>具身智能赛道竞争逻辑正发生根本性切换。行业告别侧重舞台预设演示的粗放比拼，转而直面真实物理环境下的复杂落地难题。技术路线尚未收敛，各家厂商基于对落地路径的不同理解，在传动方案、模型架构、数据策略等维度做出了差异化的探索与取舍。</p>\n  <p>星尘智能成立于2022年，创始人兼CEO来杰在AI与机器人领域拥有超过17年研发设计经验，主导研发过多款新型机器人，曾任腾讯机器人实验室1号员工与架构师、百度小度机器人”团队负责人。</p>\n  <p>创业初期，来杰就明确提出<strong>“Design for AI”路径，即先定义适配AI大模型学习与进化规律的机器人身体，再围绕这一身体匹配对应的AI算法与操作系统，让机器人能“像人一样思考，像人一样工作”。</strong>基于这一理念，星尘智能搭建了一套“AI模型-具身OS-绳驱本体”的全栈自研体系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_f2d3224d1226495d95b8a7b21a5d858a@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">星尘智能T1新品（图源/企业）</p>\n  <p>如何让这台机器人像人一样思考与行动？这点上，星尘智能采取了自研基座模型，依靠数据效率而非数据规模驱动能力提升。&nbsp;</p>\n  <p>真实物理任务存在一个长期易被忽视的特点：并非所有动作都需要深度推理。比如在家庭场景中，开微波炉、拿玩具、递工具，这些高频操作更多依赖快速的本能级响应，而“整理厨房并做一顿饭”的这类长程任务，则需要模型具备步骤拆解、环境理解和异常处理能力。不同需求对应着所需的时间尺度与算力消耗，大模型推理能力强但响应慢，端到端动作模型响应快但缺乏规划能力。</p>\n  <p>星尘智能的思考是，与其在一个模型上强求兼顾，不如让模型各司其职。在底层模型端，星尘智能提出了端到端全身VLA基座模型Lumo，承接更高维度的通用推理需求。</p>\n  <p>作为全局基座大模型，Lumo主要解决复杂语义理解、抽象指令拆解与未知场景泛化等任务。模型训练采用“预训练+真机对齐”，先通过海量数据学习通用任务逻辑与步骤拆解能力，建立基础认知体系；再依托绳驱真机采集的高质量多模态数据完成真机微调对齐，打通从模型“思考”到机器人“实操”的动作流。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_ff1fb73772474158abd0537705376b0f@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">Lumo-1执行长序列复杂任务（图源/企业）</p>\n  <p>依托这套训练逻辑，Lumo可在未知物体、陌生环境、模糊抽象指令等分布外场景中，展现出更强的泛化能力。<strong>硬氪了解到，未来Lumo迭代版本还将融入世界模型预测能力，进一步强化机器人对动态环境的预判与推理效率。</strong></p>\n  <p>在商用框架端，基于人类双系统认知理论，星尘智能研发了首个可实现全身移动操作的DuoCore快慢协同框架，与美国公司Figure此后发布的Helix架构几乎一致。</p>\n  <p>这套架构将机器人智能拆分为两套独立且协同的能力体系。快系统主打本能级实时响应，负责毫秒级姿态微调、现场避障、关节柔性缓冲等动态基础动作，适配真实场景随时出现的环境扰动；慢系统主打认知级深度规划，专注长时序任务拆解、跨空间路径规划与全局策略生成，支撑弯腰、蹲起、移动与双臂精细操作的全身协同作业。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_2677d5ae595349d595f8e837a986e31b@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">星尘智能自研商用模型架构DuoCore零售应用已在全国六个城市规模化落地（图源/企业）</p>\n  <p>两套系统通过具身OS统一调度、联动运转，伴随着慢系统输出整体任务方案与行进路径，快系统能够实时修正机身姿态适配非标环境变化；如果遇到突发风险时，快系统则可自主触发紧急避险，并联动慢系统更新任务规划，实现动态纠错。</p>\n  <p>区别于传统AI“海量数据投喂、从零学习”模式，DuoCore框架依托仿生人类技能迁移逻辑，在跨场景任务中可复用已有经验，解决了机器人真实场景实时作业、动态适配、高效学习的落地难题。</p>\n  <p>在传动方案上，星尘智能是全球首家实现绳驱AI机器人量产的企业。绳驱模仿人体肌腱的运动逻辑，通过电机后置，由腱绳牵引控制关节屈伸，形成了一种“刚柔耦合”的特性，既保留足够的操作刚度，又具备柔性缓冲和冲击吸收能力。</p>\n  <p>相比传统刚性连杆结构，绳驱拥有更高的有效载荷能力、更低的反冲和惯性，以及更紧凑的机身，这使得机器人在保持高动态操作与高拟人表现的同时，还能确保近距离交互的安全性，拓宽了从商业到家庭的应用想象力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_d1ba6c0ee3e94a8da05ebdf31c6a7fa5@6022551_oswg324414oswg832oswg468_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">不同驱动方案对比（图源/企业）</p>\n  <p>当机器人执行任务时，绳驱传动摩擦更低、运动更连续，相比传统刚性机构减的齿隙摩擦与机械噪声，信息损耗少，能更完整无损地向AI传递高质量实时力控数据，这正是AI大模型学习真实物理交互规律所依赖的关键数据。</p>\n  <p>进入产品化阶段，基于星尘独特的绳驱结构模块化设计，具身机器人被拆分为手臂、躯干、腿部等独立模块，任一部件损坏，只需更换对应模块即可快速恢复，无需整机返厂，降低了客户的停机成本与使用门槛。其绳驱本体于2025年底已开启千台级交付。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_d4ddac802a494acdb4923ca1e547df05@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">星尘智能T1新品，起售价8.99万元，以强操作推动规模化部署（图源/企业）</p>\n  <p>星尘智能正同步推进多矩阵产品落地。公司于近日发布T系列机型T1，起售价8.99万元，可完成煎牛排、洗衣收纳、商务调酒、化学实验、汽配分拣、汽车充电等连续精细操作。</p>\n  <p>目前，星尘智能已在科研、商业服务、文娱演出、工业等领域形成批量交付能力。</p>", "category": "tech", "published_at": "2026-06-03T01:30:00+00:00", "fetched_at": "2026-06-03T03:40:29.535694+00:00", "fingerprint": "f26a10b2501f6b6c"}, {"source": "少数派", "title": "从插件到 AI 辅助：Obsidian 如何成为我的主力工具", "url": "https://sspai.com/post/109850", "summary": "我觉得二十一世纪的知识管理工作者，不使用 Obsidian 真的是错过一个亿，真正怎么样还得上手体验了才知道。当我自己慢慢花时间沉浸式使用的时候，明显感觉现在的 Obsidian 真的好用了一倍不止。<a href=\"https://sspai.com/post/109850\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-02T03:00:00+00:00", "fetched_at": "2026-06-03T03:40:28.195266+00:00", "fingerprint": "e458d7344e437453"}, {"source": "少数派", "title": "在视频时代，认真拍一张照片：OPPO Find X9 Ultra 影像漫谈", "url": "https://sspai.com/post/110550", "summary": "HDR 为静态图像的观看体验打开了一种新的可能。<a href=\"https://sspai.com/post/110550\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-02T06:57:26+00:00", "fetched_at": "2026-06-03T03:40:28.195261+00:00", "fingerprint": "33bf30fdfc5e3a56"}, {"source": "少数派", "title": "得力管家还是多此一举？聊聊 macOS 后台进程管理工具 App Tamer", "url": "https://sspai.com/prime/story/manage-macos-background-activities-with-app-tamer", "summary": "AppTamer是St.ClairSoftware开发多年的一款菜单栏工具。它常驻后台、实时监控所有运行中的进程，主打以可视化的方式管控应用后台资源占用。通过AppTamer，用户既可以设定进程的CP ...<a href=\"https://sspai.com/prime/story/manage-macos-background-activities-with-app-tamer\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-06-02T07:39:47+00:00", "fetched_at": "2026-06-03T03:40:28.195255+00:00", "fingerprint": "176a27e52bec041a"}, {"source": "少数派", "title": "派早报：Apple 公布 2026 年 Apple 设计大奖得主等", "url": "https://sspai.com/post/110658", "summary": "微软 Build 2026 与索尼 6 月 State of Play 资讯汇总等。<a href=\"https://sspai.com/post/110658\" targ <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
