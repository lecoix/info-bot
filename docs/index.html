8230;]", "category": "tech", "published_at": "2026-10-17T15:04:36+00:00", "fetched_at": "2026-10-18T02:46:12.095339+00:00", "fingerprint": "0b81a58f5b3fe131"}, {"source": "The Verge", "title": "Elon Musk settles lawsuits over $1 million voter giveaway", "url": "https://www.theverge.com/tech/1013431/elon-musk-settles-lawsuits-over-1-million-voter-giveaway", "summary": "In 2024, Elon Musk promised to give away $1 million a day to a randomly selected registered voter in a swing state. That prompted legal challenges, raised questions about its legality, and drew lawsuits from two Arizona residents claiming the lottery was a fraud. Musk has now agreed to settle the two lawsuits filed in [&#8230;]", "category": "tech", "published_at": "2026-10-17T16:39:44+00:00", "fetched_at": "2026-10-18T02:46:12.095333+00:00", "fingerprint": "856e060c0f3ab2f7"}, {"source": "The Verge", "title": "Mercedes-AMG’s first ground-up SUV is a 1,150hp electric beast", "url": "https://www.theverge.com/transportation/1013088/mercedes-amg-gt-suv-price-specs-performance", "summary": "Earlier this year, Mercedes' AMG performance brand grabbed our attention with the GT four-door coupe, a souped-up sports sedan with three axial flux motors delivering over 1,150 horsepower. Well, now meet its beefier cousin, the 2028 Mercedes-AMG GT SUV, an equally powerful, ultra-fast-charging electric people-hauler. The AMG GT SUV (say that five times fast) marks [&#8230;]", "category": "tech", "published_at": "2026-10-17T17:00:00+00:00", "fetched_at": "2026-10-18T02:46:12.095326+00:00", "fingerprint": "de0cce47f02c45d9"}, {"source": "The Verge", "title": "TikTok bans Musk documentary account", "url": "https://www.theverge.com/tech/1013453/tiktok-bans-alex-gibneys-musk-documentary", "summary": "Just ahead of the wider release of Alex Gibney's Musk documentary, TikTok has banned the film's social media account from its platform. TikTok did not immediately respond to a request for comment. According to The Hollywood Reporter, the film's distributor, Bleecker Street, was informed Friday afternoon that a \"permanent suspension\" was imminent. Bleecker Street has [&#8230;]", "category": "tech", "published_at": "2026-10-17T19:32:23+00:00", "fetched_at": "2026-10-18T02:46:12.095316+00:00", "fingerprint": "e41822633f704ba7"}, {"source": "36氪 - 最新文章", "title": "对话费德勒：加入On昂跑，是我回馈网球的一种方式", "url": "https://36kr.com/p/4028636199555713?f=rss", "summary": "<p><strong>作者 |&nbsp;谢芸子</strong></p>\n  <p><strong>编辑 | 张帆</strong></p>\n  <p>10月14日的晚间，在深圳人才公园的海岸，2000台无人机上演了一场震撼人心的灯光秀。</p>\n  <p>先是一只大手抛出一只网球，继而展现费德勒不同时期的打球影像，最后在天空中呈现“Dream On”的字样，化作“烟火”。</p>\n  <p>这是On昂跑对网坛传奇人物——罗杰·费德勒（Roger Federer）职业生涯的一种致敬。</p>\n  <p>今年8月，这位“20座大满贯男单冠军”的持有者，又迎来了一个新身份——成为“国际网球名人堂”中的一员。这不仅是对费德勒出色成绩的认可，也是对他在赛场外、长期推动网球运动发展的肯定。</p>\n  <p>对于中国网球运动，费德勒也是不可忽视的存在。</p>\n  <p>官方数据显示，自2002年起，费德勒累计17次到华参与比赛。他既见证了顶尖国际赛事在中国的落地，也让中国网球进入了更广泛的国际视野。</p>\n  <p>退役至今，当这位网球界领袖逐渐淡出赛场，人们转而更关注他在商业上的布局，其中就包括加盟On昂跑。</p>\n  <p>作为“联合创业者”，费德勒帮助这一来自瑞士的运动品牌，从跑步领域扩展到网球，并亲自参与产品设计。对他而言，能够真正做出好的网球鞋，让球员减少伤病、更享受赛场，是回馈网球运动的一种方式。</p>\n  <p>活动当日，包括36氪在内的媒体，与罗杰·费德勒进行了对谈。<strong>谈话内容包括他退役后的“身份转换”、对足球明星姆巴佩加入On昂跑的看法，以及对中国网球运动的展望。</strong></p>\n  <p>以下为经过编辑的对谈内容，有删节。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_a3a495618c344ced9f1fa0f9e9b6ba33@394564713_oswg128839oswg1080oswg720_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片由采访对象提供</p>\n  <h3><strong>“网球是无比精彩的旅程”</strong></h3>\n  <p><strong>问：进入‌国际网球名人堂，你有什么感受？</strong></p>\n  <p><strong>费德勒：</strong>对我来说，这是一次很大的转变。</p>\n  <p>当我在国际网球名人堂演讲中，向支持我的人们表达感谢，这种感觉非常好，它会唤起你们共同经历过的美好瞬间。同时，当你站在这项运动的传奇们——那些曾向你示范该怎么做、让你心生梦想的英雄面前，这件事变得意义非凡。</p>\n  <p>我希望中国的孩子们也能梦想着入选名人堂、成为世界第一，因为网球带来的是一段无比精彩的旅程。</p>\n  <p><strong>问：你如何定义自己现在的角色？</strong></p>\n  <p><strong>费德勒：</strong>过去我是职业网球运动员，要不断地在世界各地参赛、保积分、在观众面前比赛；现在我已经是另一种状态了。感谢网球，它依然是我生活的主心骨，我初心依旧，也有更多自由和时间与品牌一起合作创造。</p>\n  <p><strong>问：如果用三个关键词回顾你的网球旅程，你会选择哪三个？</strong></p>\n  <p><strong>费德勒：</strong>梦想、努力，还有坚持。当然，如果还有一个词，也许是“旅行”。过去近30年，我一直在世界各地奔波，就像音乐人去做世界巡演一样，这是一段不可思议的时光。</p>\n  <p><strong>问：你认为自己对网球的未来有怎样的责任？</strong></p>\n  <p><strong>费德勒：</strong>我尤其喜欢和On昂跑一起做的事情。因为我住得离On昂跑总部很近，可以更深入参与新的网球鞋开发，比如为今天的运动员打造新的THE ROGER Pro。</p>\n  <p>我把这看作一种回馈网球的方式：希望做出真正好的网球鞋，让球员减少伤病、更享受赛场，帮助他们去追逐最大的梦想和冠军。同时，我也一直想去帮助和鼓励年轻人，在世界各地推动更多人参与运动。如果他们选择网球当然很好，但任何运动都很美好。</p>\n  <p>我想，我永远不会停止推广体育。</p>\n  <h3><strong>“姆巴佩的加入令人兴奋”</strong></h3>\n  <p><strong>问：深度参与On昂跑的设计研发，让你对网球有怎样的新理解？</strong></p>\n  <p><strong>费德勒：</strong>今天，很多原本来自网球的鞋型已成为日常生活方式的一部分。比如THE ROGER Centre&nbsp;Court，它曾经是一双网球鞋，现在是一双非常日常的鞋子。</p>\n  <p>另一方面，现代网球变得越来越激烈，大量滑步、摩擦和快速磨损要求专业网球鞋更加耐用，因此比赛鞋往往变得更厚重、更“硬核”。我想做的，是让网球鞋既能满足比赛需求，也能回到街头日常。</p>\n  <p>我很享受和On昂跑一起设计鞋的过程，因为On昂跑的思维来自跑步，也带着很强的求胜精神，我们尝试把在跑步鞋上看到的材质融入进来，为网球带来一种不同的思路。</p>\n  <p>现在我的时间更多了，当疫情来临、我开始逐渐淡出职业生涯，我有了更多时间待在总部，能够在实验室里不断创造、尝试。</p>\n  <p>从第一代THE ROGER&nbsp;Pro开始，我们陆续推出了THE ROGER Pro Fire、THE ROGER Pro 2和3，已经把目光投向更远的未来。在这一过程中，On昂跑联合创始人Olivier Bernhard给了我很多启发，我们始终希望把产品做得更好，这正是我想通过与On昂跑合作带来的东西。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_60af9bf7d8b349bc8f95fbf0d7def240@394564713_oswg412682oswg1267oswg845_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">On昂跑THE ROGER Pro&nbsp;3专业网球鞋</p>\n  <p><strong>问：On昂跑选择与传奇运动员建立长期股东伙伴关系，这种模式为什么能成功？</strong></p>\n  <p><strong>费德勒：</strong>当初On昂跑的创始人David、Caspar和Olivier找到我时，他们希望我真正成为团队的一部分，不只是一个代言人或品牌大使，而是合作伙伴。</p>\n  <p>当你是股东或某种意义上的共同所有者时，心态和视角就会不同。对一名运动员来说，你可以思考得更长远，一切不必那么仓促，可以更着眼于为未来而建设。我觉得这种方式很有意思，在公司拥有一位关键合伙人，确实会改变整个格局——甚至可能影响其他品牌和运动员合作的模式。</p>\n  <p><strong>问：姆巴佩加入On昂跑意味着什么？</strong></p>\n  <p><strong>费德勒：</strong>我迫不及待想看一切将如何展开，并参与其中。在On昂跑进入网球、并在公司内部打造出一整套完整业务板块这件事上，我或许算得上某种“蓝图式”的人物。</p>\n  <p>姆巴佩将与足球总监蒂埃里·亨利携手，带领On昂跑进入足球领域。我自认是一名足球迷，对球迷来说，能实时看到Light&nbsp;Spray球鞋被设计出来的过程、看到姆巴佩本人和团队一起调整产品，这非常令人兴奋。</p>\n  <p>我们所有人都肩负压力，要做出一双尽可能出色的球鞋，也要以正确的方式做好足球这项业务。</p>\n  <p><strong>问：你更关注On昂跑未来的哪些动作？</strong></p>\n  <p><strong>费德勒：</strong>On昂跑进入足球和高尔夫领域，值得关注。团队有大量的工作要做，我相信这会给公司带来强劲增长。我希望其他运动项目也能随之跟进。</p>\n  <p>在网球方面，关键在于设计更多的球鞋、寻找最好的材质、与最优秀的运动员合作、倾听他们的反馈，并在顺境与逆境中都给予关注。胜利很重要，我们是一个求胜的品牌，我自己也是一名胜利者，但（对运动员）低谷时期的支持同样重要。</p>\n  <p>公司正处在一个极佳的位置，势头强劲，我希望能继续保持这样的增长。</p>\n  <h3><strong>“李娜是中国孩子的榜样”</strong></h3>\n  <p><strong>问：你如何看待自己与中国球迷之间的连接？</strong></p>\n  <p><strong>费德勒：</strong>我确实与中国球迷有一种特殊的连接。这最早要追溯到2002年，那时我在上海打球，有幸参加了网球大师杯。当时我还不满21岁，但已经得到了中国球迷的热情支持。此后我也参加过北京奥运会，担任瑞士代表团旗手。</p>\n  <p>2008年8月8日，开幕式那天正好是我的生日，所以那段经历对我来说格外特别。后来很多年里，我都会来参加上海的赛事，在那里赢过冠军，也参与过“旗忠网球场”的启用。</p>\n  <p>这些都让我一直有机会与中国球迷建立新的联系。</p>\n  <p><strong>问：你对中国年轻球员、家长和教练有什么建议？</strong></p>\n  <p><strong>费德勒：</strong>我认为让家长、教练和网球协会听到这一点很重要——“一个10岁、12岁或14岁的孩子，仍然拥有很多时间。”</p>\n  <p>我曾打电话给伴随我整个职业生涯的教练，询问他关于我孩子们的体能训练。他开口第一句话就是：罗杰，你只要知道你有的是时间。别紧张，一切都会好的。作为一位家长，听到这些让人安心。</p>\n  <p>每一场比赛、每一个青少年赛事，都不是最重要的。最重要的是成长，是这段旅程，是球员有多容易受教，有多享受打球、倾听和学习，以及积累经验。你要看的是自己在18到24岁时会处于什么位置？你希望自己的球技朝什么方向发展？关键在于之后的走向。</p>\n  <p>我父亲曾告诉我，要放开去打球，不要只是为了赢而过于保守，这是一种与众不同的思路。在瑞士我拿过12岁、14岁和16岁以下的全国冠军，但在国际赛场上16、17岁才有起色。有时候成长来得更晚，教练和家长必须有足够的耐心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_a9d8ab6fcb684e97906d2a993a80f31c@394564713_oswg522892oswg1267oswg845_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">活动当天，费德勒与中国年轻运动员发起“友谊赛”</p>\n  <p><strong>问：你如何看待中国网球的发展？</strong></p>\n  <p><strong>费德勒：</strong>想要真正发展网球，需要足够多、足够容易使用的球场，也要有足够的教练，让孩子有机会持续打球。整个生态必须协同运转。欧洲就是这样，在法国、西班牙或德国，很多小镇都有网球俱乐部，很多父母本身也打网球，这是一项非常大众化的运动。</p>\n  <p>我希望中国未来也能如此，并随着时间的推移，建造更多的球场。</p>\n  <p>因为球场不只是训练的地方，也是人们聚在一起的地方。我小时候的俱乐部生活，对我就非常重要。周末我常常和父母一起去球场，在那里待上一整天，对墙练球和朋友打球。慢慢地，网球变成了我生活和思考的一部分。</p>\n  <p>我相信在中国，参与网球的人越多，就越能形成冲击顶尖水准的能力。李娜赢得大满贯，是中国孩子重要的榜样。中国网球近几年发展得很好，但仍需继续向前。我认为中国网球未来的潜力很大。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_ca9eb916a0384adab68825beb9052137@394564713_oswg68085oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-10-17T05:36:44+00:00", "fetched_at": "2026-10-18T02:46:11.998657+00:00", "fingerprint": "12e614f2cf1b56c9"}, {"source": "36氪 - 最新文章", "title": "禾赛不只想卖激光雷达｜最前线", "url": "https://36kr.com/p/4028766019719557?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261017/v2_d24d03c033e94341864214f5601af8ed@6310690_oswg6862128oswg2640oswg1772_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源 禾赛科技</p>\n  <p>文｜肖漫<br />编辑｜袁斯来</p>\n  <p>“我们不是为了卖激光雷达又造了一个 Kosmo。”在 Kosmo 发布会前，李一帆先明确了这一点。</p>\n  <p>Kosmo 是禾赛科技近日发布的三维世界数据引擎，由全球首款 8K 超高清 AI 空间相机 Kosmo One 和 AI 驱动的云平台 Kosmo World 组成。前者负责采集真实世界的空间信息，后者将这些信息重建为能够被 AI 理解、交互和训练的三维场景。</p>\n  <p>这是禾赛在激光雷达主营业务之外的一次延伸。过去，禾赛主要向汽车和机器人提供感知硬件；现在，它希望进一步参与物理 AI 的训练过程，把真实世界转化为可供 AI 使用的数据资产。</p>\n  <p>这也是李一帆从零部件提供商走向物理 AI 的核心基础设施提供商的第一步。</p>\n  <h2><strong>从激光雷达迈向物理 AI 核心基础设施</strong></h2>\n  <p>物理 AI 要真正走向规模化，至少需要解决两个问题：机器人如何在真实世界中完成动作，以及 AI 如何获得足够多、足够好的真实世界数据。</p>\n  <p>禾赛正在围绕这两个问题布局两项业务：机器人运动引擎与三维世界数据引擎。Kosmo 是后者首次系统性的产品化落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261017/v2_7b7b7a05794249d1b126584e60d7e40b@6310690_oswg3122652oswg2241oswg1788_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源 禾赛科技</p>\n  <p>Kosmo One 是这套系统的数据入口。它将高空间分辨率激光雷达、8K 超高清影像系统、一英寸大底 CMOS 和高精度 IMU 集成在一台设备中，同步采集真实环境的空间几何、色彩、纹理和设备位姿信息。</p>\n  <p>它试图降低空间采集的门槛。Kosmo One 支持即开即扫、智能指引和一键续扫等功能。在普通室内场景中，完成 100 平方米空间的扫描约需 15 分钟。</p>\n  <p>不过，扫描出一个逼真的三维场景，还只是第一步。对于具身智能而言，场景不仅要看起来真实，还要能被机器人理解，并用于训练和验证动作，这也是 Kosmo World 的作用所在。</p>\n  <p>Kosmo World 的底层是禾赛自主研发的 AI 原生三维空间重建与理解系统 Kosmo Spatial Core（KSC）。它能够从同一份采集数据中，同步生成 3DGS、mesh 和 depth 三种形态的三维数据。</p>\n  <p>三种数据解决的是具身面临的不同问题。3DGS 负责还原场景的视觉外观，让机器人训练时看到的画面更接近真实世界；mesh 是由网格构成的三维模型，可以用于物体的拆分、建模与交互；depth 则提供空间距离信息，帮助机器人判断物体的位置和远近。</p>\n  <p>这意味着，真实空间不再只是一个供人观看的三维模型，而可以进一步转化为适合机器人训练和仿真验证的环境，即所谓的 sim-ready 数据。</p>\n  <p>李一帆认为，物理 AI 对真实世界数据的需求，很难仅靠生成式 AI 满足。</p>\n  <p>“如果你完全用 AIGC 去生成完全虚拟的训练数据，真正获得的新鲜的信息就很有限。”他的判断是，生成式 AI 可以基于已有信息补全场景，但如果缺乏新的真实世界信息，模型对现实环境的理解仍然有限，训练效果也会受到影响。</p>\n  <p>这并不意味着合成数据没有价值。对于具身智能，合成数据能够帮助开发者扩充训练场景、覆盖更多边界情况，但前提是生成的环境和物理规律足够可信，且能够补充真实数据中缺失的信息。Kosmo 想做的，是从真实世界获取高保真的空间信息，再借助 AI 重建与补全，将其转化为能够反复使用的训练资产。</p>\n  <p>李一帆认为，这条路径有机会同时缓解两个问题：仿真环境与真实环境之间的差距，也就是 Sim-to-Real Gap，以及在真实物理环境中采集训练数据的高成本。</p>\n  <p>李一帆将 Kosmo 的商业化分成了三个阶段。最直接的是硬件收入，即销售空间相机Kosmo One；其次是面向企业客户的数据与模型服务。客户提供场景，禾赛负责采集、重建并交付可用的三维模型，商业模式有些类似 MaaS（Model as a Service，模型即服务）：客户购买的是处理后的结果，背后则涉及算力和模型生成服务。</p>\n  <p>更长期的目标，是将采集和重建形成的三维数据沉淀为可以反复使用的数字资产。李一帆希望，随着平台积累的空间模型越来越多，用户不必亲自扫描每一个场景，也能直接找到符合行业需求的资产。“这个可能需要至少 3—5 年才能建设出来。”他预计。</p>\n  <p>这意味着，Kosmo 的商业化并不只取决于相机能卖出多少台，还取决于它能否持续降低空间数据的采集、加工和使用成本，以及这些数据能否在不同客户和任务之间复用。</p>\n  <p>发布会上，禾赛 Kosmo 与银河通用机器人、原力灵机签署了战略合作，并展示了与迪士尼旗下皮克斯工作室（Pixar Animation Studios）、高德等合作的行业案例。这些合作所指向的，是三维世界数据在机器人训练之外的更多应用场景，例如影视媒体、文旅文博等。</p>\n  <h2><strong>禾赛打基底，Sharpa 上台前</strong></h2>\n  <p>“今天看似我们是在聊 Kosmo，但我觉得真正想跟大家交流和汇报的，不是 Kosmo 一个产品。”李一帆在发布会上说，“禾赛真正想讨论的是，从零部件提供商走向基础设施提供商的过程中，它看到了什么机会，以及为什么认为自己有能力参与其中。”</p>\n  <p>在他看来，物理 AI 2.0的终极目标是通用机器人。但目前，行业的注意力主要集中在模型和应用层，机器人硬件、计算和数据等底层基础设施，仍有大量问题没有解决。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261017/v2_31677ed200f94f09ae54d1d57625118a@6310690_oswg4081554oswg2880oswg1632_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源 禾赛科技</p>\n  <p>李一帆认为，数字 AI 能够快速发展，一个重要前提是底层基础设施已经相对成熟。物理 AI 则不同：机器人需要在现实世界中移动、感知和操作，模型能力必须通过硬件执行，训练也离不开真实环境的数据。这是禾赛同时布局机器人运动引擎与三维世界数据引擎的原因。</p>\n  <p>李一帆强调，这并不是一次与原有业务割裂的转型，而是技术能力的外延。精密机械传动、芯片、伺服电机、电磁材料，以及集成、制造工艺和量产验证，都与禾赛此前积累的技术和工程能力存在关联。</p>\n  <p>Kosmo产品只是第一步，禾赛后续还会有机器人关节驱动器等产品布局。李一帆将驱动器的重要性类比为电动汽车时代的电池，会直接影响整机性能、成本和产品化进程。</p>\n  <p>禾赛的思路是，让机器人真实的动作需求反过来定义硬件，即 AI-Defined Hardware。硬件不应只是被动承接算法要求的部件，还需要根据 AI 在真实环境中的任务需求，重新设计驱动能力与机械结构。</p>\n  <p>Sharpa 是这套思路的另一端落点。</p>\n  <p>Sharpa 的灵巧手拥有 22 个主动自由度，首款旗舰触觉灵巧手 Wave（W01）正是基于禾赛的动力模组打造。禾赛称，相比同类产品，其动力模组体积缩小了 37%，功率密度提升至 3 倍。</p>\n  <p>截至 2026 年第二季度末，禾赛动力模组累计交付超过 1 万套，产品也正从灵巧手模组向全身关节模组拓展。公司预计，2027 年动力模组出货量将达到六位数。</p>\n  <p>Sharpa 在操作端积累了大量需要验证的想法，能够较快地反馈给禾赛团队；禾赛改进动力模组后，又可以迅速交由 Sharpa 测试，形成研发闭环。</p>\n  <p>十年前，从激光雷达出发，禾赛已经具备了空间感知、芯片设计、精密制造和规模交付等能力。现在，它希望将这些积累延伸到更大的产业链环节中。</p>\n  <p>但基础设施业务与零部件业务的成功条件并不相同。动力模组需要证明性能、可靠性和成本优势，Kosmo 则还需要证明生成的数据能够切实改善训练效果，并且在不同场景中形成可重复的价值。</p>\n  <p>禾赛的 2.0 能否成立，最终不只取决于它推出了多少新产品，而取决于这些底层能力能否成为机器人公司真正愿意采用、持续使用的基础设施。</p>", "category": "tech", "published_at": "2026-10-17T06:39:49+00:00", "fetched_at": "2026-10-18T02:46:11.998649+00:00", "fingerprint": "608d2d95f0c30dac"}, {"source": "36氪 - 最新文章", "title": "前华为车BU世界模型基模负责人创业，杭州具身大脑公司获近亿元融资｜硬氪首发", "url": "https://36kr.com/p/4025325566054529?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，具身大脑公司「格物通智」已完成近亿元天使轮融资，投资方包括匹克投资、鸿富资产、杭州资本、杭州人才集团、某省级具身产投及多家头部上市公司。资金将主要用于物理反演世界模型的大规模预训练与技术迭代、硬件与本体构建等，加快人才引进和规模扩充，并推进多个场景PoC验证和真实数据采集。Maple Pledge 枫承资本出任本轮独家私募股权融资顾问。</p>\n  <p>格物通智卡位杭州，于2026年8月成立，首轮即获得杭州市级层面三支基金的支持，包括杭州润苗基金、杭州颠覆性成果转化基金、杭州人才基金，是国家具身智能应用中试基地生态伙伴、‌杭创具身智能营成员。</p>\n  <p>公司面向真实产业场景研发自进化的灵巧操作智能，依托触觉-视觉为主的多模态数据真实闭环构建 “物理反演世界模型 + PSI物理自进化” 技术体系，为机器人提供有“手感”的具身大脑并在持续作业中自主沉淀实操经验、将“工龄”变成能力，实现越用越适配场景的持续进化。</p>\n  <p>本轮资方中，匹克投资作为国内头部运动科技履产业集团，已同格物通制签订战略合作协议，公司将围绕鞋履制造对 \"双柔+一高精\"，即柔性制造、柔性材料、亚毫米级精度的要求，在企业初期拿下规模化订单，共同推动技术落地与产业验证。</p>\n  <p>创始人兼CEO蔡佳博士毕业于西北工业大学航天学院，师从国家杰青黄攀峰院长，专注太空机器人的在轨灵巧操作研究；后加入华为2012实验室及车BU 2030实验室，深度参与ADS 2.0至4.0核心技术研发与百万级量产交付以及ADS6.0预研，担任百人团队主管及华为科学家委员会委员。</p>\n  <p>他同时拥有太空操作机器人、自动驾驶量产、世界模型三重复合背景，兼具AI前沿技术孵化、复杂智能系统关键技术突破与百万级量产的工程化经验，具备千万小时级数据治理与近万卡集群训练的系统性方法论，是华为智驾体系从技术验证到量产交付的核心参与者之一，曾获华为个人技术最高奖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261014/v2_b9563c4a189841d695cdcfeed8b9fb9b@6022551_oswg303353oswg830oswg554_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">格物通智创始人兼CEO蔡佳博士（图源/企业）</p>\n  <p>此外，多位核心成员均来自华为、理想、地平线、智元等行业头部企业，毕业于清华、浙大、上交、中科大、复旦、哈工大、西工大及南洋理工等顶尖高校，覆盖前沿AI研究、复杂系统工程与规模化交付全链条，是一支具备学术科研底蕴与成熟产业落地能力的团队。</p>\n  <p>过去两年，具身智能在视觉感知、运动控制等技术环节取得了实质性进展，机器人可以识别物体、规划路径、复现复杂的肢体动作。然而，这类能力大多停留在远距离、非接触式的感知与执行层面，难以应对精细的操作难题。一旦进入真实生产现场，面对布料滑移、零件卡滞、插装阻力等接触层面的物理交互，仅靠视觉无法获取力的大小、方向与接触状态，感知维度的短板会直接暴露。</p>\n  <p>另一重底层瓶颈在于数据。多数具身智能企业依靠众包采集或素材库数据训练模型，这类数据和真实物理工况存在结构性偏差，光照、工艺参数、设备异常、人为干预等条件与现实环境脱节。更关键的是，真实场景中的数据带有明确的因果链条，“什么动作导致了什么结果，什么异常触发了什么调整。这些因果关联，在脱离场景的素材数据中几乎无法获取。脱离场景长出来的智能，很难真正落地。”格物通智创始人兼CEO蔡佳说。</p>\n  <p>在格物通智团队看来，机器人进入工厂只是起点。真正的挑战是，它能否在产线上持续作业，遇到问题后自己调整，并且把这次的经验带到下一个工位。</p>\n  <p>这条路被蔡佳拆成了三个环节，分别是Deploy——先把机器人放到客户现场，替客户完成一道具体工序；Learn——把作业中产生的成功经验、失败轨迹、异常恢复和人工纠正，转化为训练数据；Generalize——把从具体项目中沉淀的操作能力，迁移到下一个工位、下一个任务、下一个本体。</p>\n  <p>理解格物通智的技术基座，需要回到灵巧操作的核心难题：机器人如何形成“手感”。</p>\n  <p>传统机器人学习的是人手的关节轨迹，比如拧瓶盖时，机器人会通过学习人类手指运动轨迹模仿相应的动作。“但这只是‘形似’。”蔡佳告诉硬氪，“它不知道人需要用多大的力、摩擦系数是多少、遇到阻力时要加大力度还是调整角度。一旦换成不同材质的瓶盖、不同松紧程度的螺纹，模型就可能失效。”</p>\n  <p>针对这一盲区，格物通智团队首创提出了“物理反演世界模型”技术路线，让机器人从看得见的动作中推断接触、受力等隐含物理信息，用于大规模预训练；再结合真实力觉、触觉反馈进行校准，为动作数据补充可用于学习的物理标签。</p>\n  <p>触觉数据是这条路径的核心，也是行业公认的难题。由于触觉信号维度低，通常只有几十维，而一张图像有数百万维，要让两者在同一模型中融合对其的难度极大。同时，触觉数据的采集成本高、速度慢，规模化始终是瓶颈。</p>\n  <p>格物通智的解法是Real to Sim（真实到仿真），用真实物理交互数据，反向搭建仿真环境，已确定一系列操作路径。</p>\n  <p>这套数据管线的核心价值，是把互联网海量的第一、第三人称视频转化为可用于模型训练的有效数据。触觉信号规模化采集长期受制于高昂成本与低下效率，而视觉数据天然易于获取。依托 Real to Sim 方案，团队能够从视觉画面反推重建对应的触觉信号，让触觉数据实现和视觉数据同等规模的采集能力。</p>\n  <p>与此同时，在世界模型架构层面，方案大幅提升力觉、触觉这类物理信息的信噪比，实现与视觉信息的原生融合，以此习得超越人类水平的操作手感；并通过对物理因果关系建模与预测，让模型理解操作背后的底层规律，进一步强化跨场景泛化能力。</p>\n  <p>在此基础上，格物通智进一步搭建了PSI物理自进化体系，可以实现“物理反演—规划执行—真实反馈—评估学习—验证部署”的能力迭代闭环。机器人在作业中产生的成功经验、失败轨迹与人工纠正，经筛选评估后用于改进物理状态估计和操作策略，更新后的模型经验证再进入下一轮任务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261017/v2_10320202d39e48748f198153393d9f3c@6022551_oswg1687558oswg1536oswg1024_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">构建 “物理反演世界模型+PSI物理自进化” 技术体系（图源/企业）</p>\n  <p>蔡佳告诉硬氪，这套机制的核心是双向改进，更准确的世界模型帮助机器人做出更有效的规划，更有价值的执行反馈则帮助模型识别自身误差、优化后续学习。同时，系统可以通过模型对失败原因与不确定性的判断，优化数据筛选，提升从经验中学习的效率。</p>\n  <p>这在工业场景中具有直接价值。“传统机器人部署到新工位时，需要反复示教、调测、试错；而我们希望实现的是，一个现场积累的经验，能够降低下一个现场的迁移成本。当客户每增加一个应用场景，我们收获的不仅是业务机会，还有可复用的部署经验。”蔡佳说。</p>\n  <p>硬氪了解到，格物通智正在同纺织服装、光模块及汽车零部件领域客户推进联合创新PoC，预计2026年年底将完成首个PoC交付。公司选择从边界清晰、可量化验收的任务切入，逐步扩大环境与任务覆盖，先突破Y轴精度成功率再突破X轴泛化性。在真实场景中验证基础能力，再将沉淀的经验迁移至更广泛的任务与本体。</p>\n  <p><strong>以下为硬氪与格物通智创始人兼CEO蔡佳的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：触觉数据采集长期面临成本与效率瓶颈，格物通智为何选择Real to Sim这条技术路径？</strong></p>\n  <p><strong>蔡佳：</strong>触觉是机器人实现灵巧操作的核心，但触觉数据采集本身一直是行业难题。如果只依靠触觉手套采集，不仅成本高、采集效率低，操作人员佩戴手套后，甚至会影响他们日常的正常作业。这也就造成了，手套能拿到的数据体量十分有限，难以支撑具身模型训练所需的泛化能力。</p>\n  <p>格物通智选择Real to Sim的思路很清晰，视频数据最容易规模化获取，那我们就从视频中反向重建交互接触等触觉信号。方案重建出的触觉数据精度，预期能够满足预训练需求，后续再通过真实现场数据进一步对齐精度。更重要的是，这套管线让触觉数据获得和视觉数据同等的规模化潜力。互联网上存量巨大的第一、第三人称视频，经过这套流程处理，都可以转化为附带触觉标签的训练样本。</p>\n  <p><strong>硬氪：你们在数据治理上强调质量优于数量，这个判断是怎么形成的？</strong></p>\n  <p><strong>蔡佳：</strong>核心在于是否能搭建一套可量化的数据价值评估体系，自动筛除低价值的冗余数据。</p>\n  <p>这套评估体系不是简单的人工抽检，而是从多个维度对数据打分，比如场景的稀有度、动作的多样性、失败案例的占比、与当前模型薄弱环节的匹配度等等。低分数据直接丢弃，高分数据进入训练集。同时，每一轮训练结束后，用固定的评测集检验模型表现，找出新的薄弱环节，再反向指导下一轮数据筛选。</p>\n  <p>可以用自动驾驶举例，如果采用均匀随机采样，人在驾驶过程中，90%以上的时间都处于平稳行驶状态，几乎没有紧急避让、复杂变道这类场景。这类常规数据无需大量累积，过量堆叠反而会削弱模型在关键场景下的学习效果。过去我们训练智驾世界模型，1000w clips的数据总量变化不大，但是其recipe每周都在优化刷新。因此需要对数据打分，保留high quality、good diversity样本。</p>\n  <p>我们把这套思路迁移到了做具身世界模型上。从第一天起，团队就坚持质量优先的数据理念，把数据冗余度控制在很低水平。不少同行在比拼百万小时量级的数据规模，但其中大量都属于冗余数据，真正有效的样本占比并不高。在存储成本持续走高的环境下，这套策略反而具备优势，我们不必为无效数据消耗资源。</p>\n  <p><strong>硬氪：格物通智选择从工业场景切入，不同客户对机器人具身操作能力的指标要求差异显著，团队如何定义场景切入的优先级？</strong></p>\n  <p><strong>蔡佳： </strong>不同工厂对能力边界的要求确实差异显著。精度要求从正负0.1毫米到一两毫米不等，节拍从毫秒级到分钟级不等，成功率要求从90%到99%不等，可靠工作时间从8小时到24小时不等。</p>\n  <p>格物通智的策略是选择与当前能力匹配的场景切入，逐步向更高要求延伸。我认为，创业公司的价值在于识别并聚焦真正有价值、能够规模化的场景，再通过循序渐进的方式扩展场景，可能做着做着就到达了具身智能的“GPT3时刻”。</p>\n  <p>对于具体场景，我们主要看几个维度，一是任务的可量化程度，验收标准是否清晰；二是与当前模型能力的匹配度，精度成功率能否达到客户的基本要求；三是场景的可复制性，一个现场积累的经验能否迁移到下一个现场。现在这个阶段，三分靠模型，七分靠工程。具身智能要真正变成实用，应该在这个场景里面长出来，而不是脱离场景在数采素材中长出来。</p>\n  <p>我们最看重的指标不是精度成功率，而是客户复购率。Demo精度成功率再高，如果客户不愿意复购，说明产品没有真正解决问题。复购意味着客户认为这个投入ROI是划算的，意味着机器人真正融入了生产流程。</p>", "category": "tech", "published_at": "2026-10-18T01:30:00+00:00", "fetched_at": "2026-10-18T02:46:11.998634+00:00", "fingerprint": "c14969919e318095"}, {"source": "少数派", "title": "被量化的心跳：HRV 是身体的晴雨表，还是制造焦虑的数字游戏？", "url": "https://sspai.com/post/104231", "summary": "这些设备最好的用途，不是让你更依赖它们，而是帮助你重新学会倾听自己。然后，在某个清晨，你不再需要看任何数字，就知道今天会是美好的一天。<a href=\"https://sspai.com/post/104231\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-17T06:58:04+00:00", "fetched_at": "2026-10-18T02:46:10.627827+00:00", "fingerprint": "c5ba775541893835"}, {"source": "BBC World News", "title": "Palestinians and US journalist injured by Israeli settlers in West Bank harvest attack", "url": "https://www.bbc.co.uk/news/articles/c65ynk7212vqo?at_medium=RSS&at_campaign=rss", "summary": "The BBC sees masked settlers attack Palestinians trying to harvest olives, amid a surge in similar incidents.", "category": "politics", "published_at": "2026-10-16T14:31:04+00:00", "fetched_at": "2026-10-17T02:44:52.516223+00:00", "fingerprint": "b41684a8072def39"}, {"source": "BBC World News", "title": "Brazil sees record fall in Amazon deforestation as key election looms", "url": "https://www.bbc.co.uk/news/articles/cqe8rzg6zl00o?at_medium=RSS&at_campaign=rss", "summary": "The Amazon rainforest is a crucial buffer against climate change - but deforestation had expanded under former president Jair Bolsonaro.", "category": "politics", "published_at": "2026-10-17T02:33:09+00:00", "fetched_at": "2026-10-17T02:44:52.516217+00:00", "fingerprint": "a1365c50f71f1cd7"}, {"source": "BBC World News", "title": "Oregon teacher fought school attacker before armed dad shot suspect 'multiple times'", "url": "https://www.bbc.co.uk/news/articles/cv98zw1k8kp3o?at_medium=RSS&at_campaign=rss", "summary": "The 16-year-old suspect previously attended the primary school and had targeted a special educational needs classroom, police say.", "category": "politics", "published_at": "2026-10-17T01:19:04+00:00", "fetched_at": "2026-1 -upon-a-time-in-shaolin-pablo-torre-martin-shkreli", "summary": "Wu-Tang's Once Upon A Time in Shaolin album has, for the most part, been extremely difficult to listen to, but you can now hear two snippets of the album thanks to the podcast Pablo Torre Finds Out, which just published an episode all about the exclusive record. Once Upon A Time in Shaolin has a [&#8230;]", "category": "tech", "published_at": "2026-10-16T20:50:27+00:00", "fetched_at": "2026-10-17T02:44:52.067499+00:00", "fingerprint": "09244700ab260576"}, {"source": "The Verge", "title": "Apple&#8217;s updated App Store rules go after &#8216;nudify&#8217; AI apps", "url": "https://www.theverge.com/tech/1013314/apple-app-store-nudify-ai-apps-harassment", "summary": "Apple's App Store rules now more explicitly ban so-called \"nudify\" apps that generate intimate images of people without their consent using AI tools. The rule changes follow significant criticism toward Apple after X users used Grok earlier this year to make nonconsensual, sexualized deepfakes, including minors. Apple didn't pull X or Grok from the App [&#8230;]", "category": "tech", "published_at": "2026-10-16T22:51:22+00:00", "fetched_at": "2026-10-17T02:44:52.067493+00:00", "fingerprint": "67d3c07f032253c0"}, {"source": "The Verge", "title": "All the news about the iPhone Duo", "url": "https://www.theverge.com/tech/1010131/apple-iphone-duo-news-announcements", "summary": "Apple has finally announced its long-rumored foldable: the iPhone Duo. The new phone has a 5.4-inch outer display and a 7.6-inch inner display, a “nano‑texture” finish on the inner screen, and barely any visible crease. Instead of Face ID, it uses Touch ID on the power button. It has two cameras, a main lens and [&#8230;]", "category": "tech", "published_at": "2026-10-16T23:36:26+00:00", "fetched_at": "2026-10-17T02:44:52.067484+00:00", "fingerprint": "d56d7345469111ce"}, {"source": "36氪 - 最新文章", "title": "老板向AI许愿，员工让AI滚蛋｜深氪", "url": "https://36kr.com/p/4028378674205313?f=rss", "summary": "<p><strong>文丨</strong>赵芮&nbsp;</p>\n  <p><strong>编辑丨</strong>张雨忻&nbsp;</p>\n  <h2><strong>老板的“许愿池”&nbsp;</strong></h2>\n  <p>“你知道马斯克怎么管理员工吗？”听到这句拷问，胡芯兰感觉不妙。&nbsp;</p>\n  <p>对面的这位老板，来自一家重工业企业，员工规模过万。在社交媒体上，老板看到过马斯克用Agent代替真人员工工作的新闻，不禁燃起同样的念头。他对胡芯兰直言不讳：“能不能帮我把整个信息化部门都裁掉？我每天就跟Agent沟通。”&nbsp;</p>\n  <p><strong>在胡芯兰接触的大量老板中，关于“裁员”的愿望普遍存在。</strong>他们来自金融、制造、互联网等不同行业，公司规模从几百人到上万不等。有的试探性地递来话头：“你觉不觉得，我们公司的人员有些冗余？”有的则抛出终极问题：“最多能裁员多少？”这位效仿马斯克的，是她遇到的最激进的一位。&nbsp;</p>\n  <p>还有一些老板，虽没明说裁员，但却希望AI能监控员工的一举一动。“能不能给我装一个Agent，记录每名员工每天做了什么、产出了什么、项目进展到哪一步，最好还能随时监控和调用这些Agent，再根据完整日志计算每个人的投入产出比。”&nbsp;</p>\n  <p>胡芯兰心里清楚，提出这种需求的老板，只是暂时还没把裁员摆在明面上，他们希望先收集到足够多的人效数据，再“尽量精准地裁员”，以免“裁员裁到大动脉”。&nbsp;</p>\n  <p>日常总在跟“裁员”需求打交道的胡芯兰，做的并不是人力资源，<strong>她的工作，是时下AI圈最流行的工种之一——FDE，即前线（前沿）部署工程师。</strong></p>\n  <p>眼下，AI的发展速度惊人：模型迭代极快，应用发布层出不穷，创业公司融资不见降速。但这份速度和热度，却没有被成功同步到那些希望AI来提升效率，革新生产的企业中。埃森哲曾调研了七个行业的163家中国企业，结果显示仅9%的企业从AI应用中实现了生产效率、收入和利润的提升。&nbsp;</p>\n  <p><strong>FDE这一职业正是从这种“技术发展与技术落地之间的落差”中长出来的。</strong>它最早由硅谷公司Palantir提出，后被OpenAI和Anthropic发扬光大，并在2026年乘着风从从硅谷来到了中国。这个工作像是AI与企业中间的一座桥，FDE在客户公司驻场，深入了解客户的业务需求，再针对性地给他们落地大模型、Agent等AI能力，以此缩短AI与真实工作场景间的差距。&nbsp;</p>\n  <p><strong>但在中国，大部分FDE的工作是尴尬的——企业抛来的很多诉求，如“许愿”般不切实际。</strong></p>\n  <p>一次，胡芯兰在会上向不同行业的客户介绍公司的AI产品，一位老板忽然接过话头，声情并茂地描述起AI对人类的重大意义：“不只是工作，我们的身体、生命健康数据什么时候才能交给AI？让硅基生物复刻、并造福我们碳基生物。你们应该想想办法，把这个做出来。”&nbsp;</p>\n  <p>话音落下，全场没人说话。胡芯兰努力进行表情管理后，进行控场：“这就需要从长计议了。”随后她匆匆结束会议，这才没让需求从工作提效跨越到改造人类生命。&nbsp;</p>\n  <p>FDE创业者朱莉也有类似的困扰。她不久前收到一位电商客户甩来一个叫“AI CMO”产品的宣传片：只要输入公司网站，产品即可实现从文案、运营到投放的全流程营销工作，过程丝滑。宣传片配乐燃动，而老板的态度比片子更燃：“如果能实现，我愿意高价购买！”&nbsp;</p>\n  <p>朱莉心头一紧，“没想到AI公司画的饼，如今竟要我来实现。”她心里清楚，只给AI看一个公司网站上的信息，它必不可能实现宣传片里的效果，“能自动发广告，但没法保证发给用户的是有价值的信息。”&nbsp;</p>\n  <p>这正是另一种错配带来的尴尬：企业老板不清楚自己真正需要的是什么，也不清楚AI能实现什么。“对客户来说，我们就是个许愿池。”朱莉说。&nbsp;</p>\n  <p><strong>实际上，这些“愿望”背后，藏着大量企业老板深深的焦虑：公司诸多生产环节上，或多或少都存在低效的问题，更重要的，是他们太害怕因错过AI这趟车而被时代甩下。</strong></p>\n  <p><strong>不只企业老板，在AI的另一头，那些拥有技术和产品的AI公司同样有自己的焦虑。</strong></p>\n  <p>举个例子，今年3月腾讯上线WorkBuddy，字节阿里随后也快速跟上。字节推出豆包工作，阿里推出千问办公，主攻企业级市场。三家大厂把战火都烧向了AI办公入口，但实际上，办公Agent的功能并没有太大差异，技术上也缺乏壁垒。怎样让客户选择自己，成了大厂们眼下最头疼的事情之一。&nbsp;</p>\n  <p>于是，大厂开始密集成立FDE团队，期望用这一服务模式把自家AI送进企业。FDE，也成了大厂缓解商业化焦虑的一张新牌。&nbsp;</p>\n  <p>一位阿里云的销售经理告诉36氪，面对WorkBuddy的市场先发优势，他的方式是先给企业免费使用额度，再派更多的人做FDE。“现在就是比谁更舍得下注，公司里不少技术、售前等员工都转岗去做FDE了，百炼（阿里云MaaS平台）这类战略地位强的产品还有专门的FDE团队。”&nbsp;</p>\n  <p>Workbuddy最近也建立了自己的FDE团队，腾讯一位售前经理本身不愿意让团队做FDE的工作，但因为担心客户被竞对撬走，也选择了这样的方式“熬住”客户。&nbsp;</p>\n  <p>大厂想用FDE争抢市场，中小企业想让FDE把AI转化成真实效率。焦灼的两边，正在同时对FDE下注。&nbsp;</p>\n  <p><strong>而FDE面临的难题并非AI时代独有，它不过是20年前SaaS时代的一次重演。棘手的是，当技术能接手的工作更多，技术与落地之间的鸿沟也会更大。</strong></p>\n  <p>似乎，过去的难题，正在以更复杂的方式重现。&nbsp;</p>\n  <h2><strong>裁员阴影下的拉锯</strong></h2>\n  <p>面对客户的许愿，胡芯兰从不拒绝，而是用“魔法打败魔法”。&nbsp;</p>\n  <p>对于那位想效仿马斯克的客户，胡芯兰先是诚恳点头，随后沿着对方的逻辑推演：“明白，不过这样需要每天看上万份AI执行日志，您看是否能腾出精力？”老板迟疑片刻，胡芯兰持续加码：“而且员工一旦使用其他工具，您就拿不到上下文了。”&nbsp;</p>\n  <p>如果道理不足以让对方冷静，胡芯兰会拿出杀手锏：<strong>“这样实现下来，每天Token费用可能要花到一万美金。”</strong>这句话后，客户瞬间冷静。胡芯兰知道，是时候聊现实方案了。&nbsp;</p>\n  <p>胡芯兰所在的公司规模不大，她做FDE的同时还承担着销售工作，为了争取订单，她没有太多立场去争论，而是需要用客户可接受的方式让对方明白“不是不行，只是目前不适合你”。&nbsp;</p>\n  <p>林凌是一家头部大厂的FDE，这半年，她发现客户对AI项目的工期要求逐渐缩短。原先以年为单位的项目交付期不复存在。四个月的交付期，客户常开口压到三个月。而随着项目deadline临近，客户希望实现的新想法也会越多。针对这些，她不会全盘满足，而是翻出最初的邮件和合同，逐条核对当初说好了什么，“就像情侣吵架时翻聊天记录”。&nbsp;</p>\n  <p><strong>相比小创业公司，大厂在客户面前的确更有拿捏之术：</strong>客户通常已经绑定了自家的云服务，迁移成本较大，所以不会轻易取消合作。在被客户气的上头时，林凌总是提醒自己：老夫老妻了，还能离咋的？&nbsp;</p>\n  <p><strong>而在跟老板对齐了预期之后，FDE又遇到了新的困难：老板对AI的急切难以被员工共情。</strong></p>\n  <p>潘科霖是一家汽车零件厂的厂二代，困扰于工厂的低效，他尝试用AI帮忙改造。起初，他每做一款AI工具，都会先把方案发进微信群，再叫来十几个部门负责人，开会征求意见，但会议通常走向两个极端，“要么没有问题，要么全是问题”。&nbsp;</p>\n  <p>有时，员工纷纷点头，“没问题，都听领导的。”但等到真正落地执行，问题便从各处冒出：有人忙着解释这会如何增加工作量和难度，有人说资源不够、部门配合难，甚至搬出家中难处，总之“实在难以推进”。&nbsp;</p>\n  <p>成为厂二代之前，潘科霖没上过班，“不懂职场”。在几次会议后，他逐渐意识到<strong>老板和员工的视角差异：老板关心公司的效率和营收，而员工关心否会增加工作，是否要承担更多责任，更直接的是，是否会因AI而遭遇裁员。</strong></p>\n  <p><strong>在成为FDE之前，胡芯兰没有料到：“比做AI工具更难的，是跟老板、员工间的人性博弈。”</strong></p>\n  <p>在请求客户的技术人员配合时，胡芯兰常常碰壁。第一次去到研发部门，她询问大家有什么需要AI提效的需求，研发各自盯着电脑屏幕，只有键盘的啪啪声回应。两分钟过去，最边上的员工回了一句：最近工作很多，没时间迁移工具。&nbsp;</p>\n  <p>后来在需求对接会上，研发犀利提问：“你们这个产品有Claude Code好用吗，换了以后工作进度如何保证？”胡芯兰很快意识到，“忙”更像是一个借口，<strong>更主要的原因可能是研发的“工具洁癖”，他们在心里有自己认为好用的工具。</strong></p>\n  <p>还有直接摆烂的。一次，胡芯兰提出为邻桌的IT员工提供免费的Agent席位，这位员工语气平静，回复到：不用，豆包挺好的。&nbsp;</p>\n  <p><strong>如果AI提效的举措触碰到员工饭碗，就更是走进了死胡同。</strong></p>\n  <p>朱莉曾服务一家小型银行，老板诉求明确：希望AI能优化贷款审批流程。&nbsp;</p>\n  <p>对此，朱莉需要先向一线业务员了解业务流程，做出运行试点，再拿着效果向业务经理争取预算。在贷款审批中，不同银行的风险偏好和计算口径不同，朱莉意识到这是比通用流程更关键的，而这高度依赖于人的经验。&nbsp;</p>\n  <p>但被朱莉找来询问经验的业务员似乎不愿配合：朱莉问的越急切、越具体，业务员的回应就越迟疑、越模糊。直到一句反问：“你们做这个，到底是为了什么？”朱莉这才意识到，她想要了解的是业务员在工作中最重要的知识壁垒，当试图让AI来优化这项工作，业务员瞬间产生了被裁员的恐惧。&nbsp;</p>\n  <p>后来，朱莉与这家公司员工之间的会议，开始被各类理由推脱。第一版Agent试跑出了错，朱莉发给一位业务员想请他指正，也始终没有收到对方的回复。&nbsp;</p>\n  <p><strong>老板想拥抱AI，但不了解业务；一线员工了解业务，但不想拥抱AI；中层大多表现出支持，但前提是效果明显、且自己不用担风险。</strong></p>\n  <p>揪扯在不同角色间，朱莉发现老板一句“支持AI”远远不够。<strong>这其中最大的矛盾在于：想用AI替代人的老板，恰恰需要那些可被替代的员工，先教会AI“如何工作”。</strong></p>\n  <h2><strong>还“债”</strong></h2>\n  <p>FDE创业者Edison给客户接入Agent后的第一天，就收到近300条报错信息。&nbsp;</p>\n  <p>他的客户是一家服装制造公司，公司老板过去每天查看生产信息，都需要花费至少两小时的时间。工厂的所有生产信息都被统计在一张巨大的Excel表上，百款服装的所有订单排成行，面料、拉链、吊牌等不同环节的生产情况分布成列，由数十位产线负责人共同更新维护。&nbsp;</p>\n  <p>工厂虽有ERP系统，但只记录最基本的静态数据：产品类型、客户、金额、交付时间。实际生成中会涉及到的数据，比如上述生产信息，都不在这个系统里。这些数据往往细碎多变，且散落在不同部门的本地Excel表、聊天记录和人脑中。&nbsp;</p>\n  <p>Edison原本打算在这张Excel表格上接入Agent，帮老板识别生产风险。结果，由于负责人们总是无法及时维护好这个表格，导致Agent不断拉响警报。员工忙碌时，没第一时间更新，AI判为订单将延期；字少了一个空格，AI判为生产异常......人类能理解的变通，到了AI这里全部被视为问题。&nbsp;</p>\n  <p><strong>让AI进入企业的核心生产/工作流程，关键之一是拥有可随时调用的数据。但对不少企业来说，这是埋藏已久的旧债。</strong></p>\n  <p>刚用AI改造工厂时，潘科霖也发现工厂到处是数据漏洞。比如，十个车间就有十套日报表，大家写法各不相同。而记录方式不统一，跨车间的信息汇总就低效，后续的排产等一系列环节也随之变慢。当AI介入，别说提效，甚至难以准确读懂这些信息。&nbsp;</p>\n  <p><strong>于是，企业原本设想的AI提效被卡住，变成了“还债”——退回到“数据清洗和治理”环节。</strong></p>\n  <p>对于潘科霖来说，就是从源头开始重新梳理日报记录的标准。他把十个版本摊在一起逐项比较，一边问车间负责人，一边和AI讨论，花两周时间重新整理出车间日报的记录规范。而这项工作也只是开始，“把过去散乱的数据全部梳理清楚，还不知道要多长时间。”&nbsp;</p>\n  <p>让不少FDE感到惊讶的是，在考虑接入AI之前，大量企业压根没觉得“不规范的数据”是个问题。&nbsp;</p>\n  <p>阿里云一位FDE告诉36氪，在快速发展的阶段，大部分的公司管理者的注意力都围着业务增长转，过去部门漏报信息，系统少开发一个功能，这种瑕疵并不妨碍公司赚钱，久而久之就搁置了。&nbsp;</p>\n  <p>但如今他们寄希望于AI能带来新的效率和增长，过去这些不影响营收的“小毛病”，都成了要先跨过去的槛。&nbsp;</p>\n  <h2><strong>“这不是豆包”</strong></h2>\n  <p>第一个月的月末对账，胡芯兰的客户被Token账单吓了一跳。一家一两百人的公司，月Token消耗达到几十万元。&nbsp;</p>\n  <p>查完后台数据，胡芯兰很快找到原因：员工虽然用上了Agent，习惯却还停留在“跟豆包聊天”的阶段。比如，每一步任务，都重新开一个对话框，然后上传大文件、复述公司背景和业务规则等，相同的信息被模型反复读取，Token也在一次次重复的上下文中被迅速消耗。&nbsp;</p>\n  <p><strong>正确的做法，是把日常需要被反复执行的工作写成Skills，把长期不变的资料放进知识库，Agent每次工作，只读取与当前任务有关的信息即可。</strong></p>\n  <p>胡芯兰一再跟客户公司的员工强调，“这不是豆包”，但收效甚微。后来她意识到，杂乱无章的对话背后，是因为大家没有系统地梳理过自己的工作流。&nbsp;</p>\n  <p>每周二到周五，胡芯兰都会待在客户公司。她办公的那间大会议室像一个临时的“AI门诊”。不同部门的员工一拨拨涌入，带着工作问题，询问胡芯兰可以用什么样的Skills解决。一天接待二十人以上是常态，有时忙到快下班，门外仍有人等候。&nbsp;</p>\n  <p><strong>问题在于，来找胡芯兰的大部分人，都说不清楚到底希望AI在工作的哪一环节帮助自己。</strong></p>\n  <p>比如，一位数据分析员工曾找到胡芯兰，希望做一个“数据分析Skill”。这个词，囊括了取数、清洗、统计、分析和写报告的整个工作流，为了弄清工作具体卡在哪里，胡芯兰只能让他把一天的工作“倒放”：数据从哪里拿，拿到后先做什么，什么数字需要判断，最后怎样交付......&nbsp;</p>\n  <p>几轮追问后，才发现员工只是想摆脱数据分析完后还要按一套固定格式输出报告这件事，她长呼一口气，“告诉对方：这叫把数据填进报告的Skill。”&nbsp;</p>\n  <p>胡芯兰发现，工作中的前提、步骤、检验标准等，已经在员工的日日重复中形成一种行为惯性，在做每一步之前，他们不会清晰地意识到自己在做哪一步。但Agent不接受“含糊”，它无法在含糊不清的描述里完成工作。&nbsp;</p>\n  <p>这个问题也启发了朱莉改变创业思路，她认为<strong>在现阶段，企业的第一项需求不是直接做Agent，而是先找出“哪些工作值得被AI提效”。</strong></p>\n  <p>她跟团队开发了一个比较原始的试验产品：软件运行在员工电脑上，每隔几秒截取一次屏幕，分析员工最耗时的任务和重复的流程，帮助老板发现没被说清楚的AI提效机会。&nbsp;</p>\n  <p><strong>而比拆解工作流更麻烦的是，把员工工作里的关键技能“蒸馏”给Agent。</strong></p>\n  <p>阿里瓴羊曾为某头部电动车品牌做一个AI客服项目。对方希望AI先听懂用户的问题，能回答的直接回答，处理不了再转给人工。但团队发现客服每天面对大量随机状况，该不该转人工、转给谁，后续又怎样处理，这些判断都藏在客服的经验里，没有可以让Agent立刻可以学习的现成资料。&nbsp;</p>\n  <p>后来，阿里瓴羊派了工作人员去现场，戴上客服耳机，挨着一线员工坐了近两个月，观察他们如何处理不同的用户诉求——产品demo两三天就能做出来，但为了让它真的好用，团队却花了几个月做了将近100场调研。&nbsp;</p>\n  <h2><strong>算不清的账</strong></h2>\n  <p>前阵子，某大厂FDE姜瀚接到了一个为App开发AI助手的需求，看似简单，但实际上每项功能都要连接一套内部系统，而每套系统又对应不同的接口权限和安全要求，这导致他和团队最后做了二十多个业务Agent，每个Agent背后，是数不清的访谈、协调和等待。&nbsp;</p>\n  <p>过去，一名B端售前可以同时服务5-8个客户，但FDE式的交付需要长期进入企业，理解流程、协调部门、连接系统，每个人同时能服务1-2个客户已属不易。AI倒是离客户的业务更近了，但人效大大降低。&nbsp;</p>\n  <p><strong>而做这些，也是迫于大厂AI的商业化竞争压力——AI对企业真正“有用”，才能带动MaaS、甚至更多云服务的收入。</strong></p>\n  <p><strong>现在在姜瀚眼中，FDE像是一个赌注。在项目开始前，他会先算算客户身后有多少云、GPU和其他产品订单可以被撬动。遇到值得“下注”的客户，才会派人免费或低价做FDE交付。</strong></p>\n  <p>有一次，姜瀚对接一家连锁企业。在跟客户朝夕相处的过程中，他们决定后续将云服务也迁移至姜瀚所在的大厂，并继续购买其他B端产品。这意味着，一笔千万级的订单将被撬动，前期的FDE服务立刻回本。&nbsp;</p>\n  <p>但另一个例子是，姜瀚曾花费很大精力帮客户部署Agent，结果客户公司的员工却只在简单办公上浅浅使用，半年下来只有50万左右的Token消耗。这笔收入甚至无法覆盖姜瀚团队的人力成本。&nbsp;</p>\n  <p>身为创业者的Edison更是经常怀疑自己的工作是否值得。&nbsp;</p>\n  <p>由于客户公司数字化程度很低，Edison让客户首先转入飞书工作，把原本散落在员工微信、Excel里的数据先沉淀到飞书里。后来，他又陆续帮客户建了多维表格，用秒搭做了前端页面等等，而这一切动作带来的收入最后都流向了字节。&nbsp;</p>\n  <p>这个过程，让Edison感觉自己像飞书免费的外包。&nbsp;</p>\n  <p>FDE们还逐渐意识到，<strong>理想中的“AI提效”实际上是一场漫长的“AI布道”，需要不断向客户普及AI知识、安利新的工作模式，才能逐渐推动转变。这都是工作中的“隐性成本”。</strong></p>\n  <p>后来，有人改变了最初带着PPT给员工推荐AI的策略，变成“靠吸引”。比如不经意向客户员工提到自己的工作已经“90%AI化”，等对方好奇再介绍Agent。为了鼓励员工适应AI，潘科霖也换了种办法。他告诉员工Agent能辅导孩子学习，教孩子写作业，参与者明显多了。&nbsp;</p>\n  <p><strong>AI实施落地的价值究竟应该如何被衡量，现在还是一笔算不清楚的账。</strong></p>\n  <p>一位大厂FDE告诉36氪，他的客户很高兴地表示，购买自己公司的AI编程工具后，开发团队从140人减少到100人了，“客户花钱买AI，要么想看到更多产出，要么想看到成本下降——如果不能用同样的人创造更多收入，那就用更少的钱来完成同样的工作。”&nbsp;</p>\n  <p>FDE常被称为AI落地的“最后一公里”，但这一公里走出去了多少，以及走完后能给企业带来多少实际的收益，都是未知。&nbsp;</p>\n  <p><strong>目前看来，“裁员数量”似乎仍是一家公司衡量AI是否有效的直观标尺。</strong></p>\n  <p>（文中所有人名均为化名）&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/8VIPwnxawx0hqa-VsHcN3A\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪”</a>，作者：赵芮，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-10-16T10:43:18+00:00", "fetched_at": "2026-10-17T02:44:51.854340+00:00", "fingerprint": "b041320c161e606b"}, {"source": "36氪 - 最新文章", "title": "小鹏也开始整合，4条产品线变2条｜36氪独家", "url": "https://36kr.com/p/4028538678858377?f=rss", "summary": "<p>36氪从多位产业人处了解到，小鹏汽车在不久前整合了产品线。原本，小鹏汽车共有F、D、I、G四条产品线，今后小鹏汽车将只有G、D两条产品线，I、F产品线已被整合入G产品线。</p>\n  <p>此前，G产品线主要负责小鹏GX、G9L等大型SUV，F产品线主要生产小鹏P系列的轿车等，D产品线旗下是MONA系列车型，I产品线负责小鹏的海外产品。如今MONA系列车型仍属于D产品线，其余产品均合并入G产品线。</p>\n  <p>MONA系列车型定位10‑15万元级市场，长期是小鹏的销量支柱，今年1-8月为小鹏贡献了超1/3销量。小鹏GX是今年小鹏品牌向上的主力车型，小鹏官方信息显示，自今年5月底上市到8月31日，小鹏GX累计交付超2万台。</p>\n  <p>与产品线收缩相伴随的，是人事的调整。有接近小鹏的行业人士告诉36氪，前F产品线一号位职级不变，现负责G产品线的产品定义，前I产品线负责人现转而负责小鹏汽车的海外事务，但其中不包括海外车型的销售。</p>\n  <p>小鹏的产品线承担着产品定义、研发等职能，而今小鹏将四条产品线收缩为两条，将在某种程度上使研发资源更聚焦，从而推动降本，同时也可进一步避免不同产品间定位、定价的互博。</p>\n  <p>今年以来，国内汽车品牌普遍面临销量增长乏力、原材料价格上涨带来成本压力的困境。纵然如问界、小米等有着科技圈的粉丝基础的品牌，也难逃由盈转亏，而且大概率无法实现去年制定的销量目标。</p>\n  <p>小鹏亦然。</p>\n  <p>今年一季度，小鹏推出了纯电和增程版小鹏P7+、小鹏G7超级增程版、小鹏X9纯电版，5月份又推出了纯电和增程版小鹏GX。同时，小鹏G6、G9、MONA M03等车型的改款均已上市。</p>\n  <p>也就是说，小鹏在2026年拥有了更庞大的产品阵容，然而今年以来，小鹏的销量较去年同期，并未见明显增长。</p>\n  <p>今年一季度，由于主力车型的迭代，小鹏的销量从去年同期的9.4万辆，滑落至今年一季度的6.27万辆。今年二季度，小鹏销量为10.33万辆，与去年同期的10.32万辆几乎持平。在不久前的业绩会上，小鹏给出的今年三季度销量指引为11.5万台-12.1万台，较去年三季度的11.6万台销量，也未呈现出显著的增幅。</p>\n  <p>由此势必导致一个问题，研发投入加大，但收益不及预期。而收缩产品线以提高资源利用销量，正是小鹏对这一问题的应对方案。</p>\n  <p>从小鹏的财报中，也可看出小鹏整合资源的必要性。</p>\n  <p>8月24日，小鹏发布了二季度财报。二季度，小鹏仍在亏损，好消息是亏损额已从一季度的17亿元，收窄至13亿元。</p>\n  <p>比起亏损额，更值得关注的指标是整车毛利。二季度，小鹏整车毛利为12.1%，与今年一季度基本持平，较去年同期有所下降。二季度小鹏的综合毛利率达到20.7%，主要由高毛利的技术服务业务托举。</p>\n  <p>这一方面有今年产业链原材料价格上涨的影响，另一方面，或许也因为支撑起小鹏二季度销量的，是起售价不到12万元的MONA M03。有公开信息统计，二季度小鹏的10多万辆销量中，MONA M03贡献了约40%。</p>\n  <p>低端车型迅速上量，拉低了小鹏的整车毛利，而定位中高端小鹏GX等产品，尚有待市场的长期检验。对小鹏而言，收缩产品线、聚焦资源，无疑是提升汽车业务毛利的有效方式。正如去年底，理想汽车也曾将第一产品线与第二产品线合并，以应对此前产品线独立运营中出现的职能重叠和决策碎片化问题。</p>\n  <p>而通过整合提效，也已在吉利等车企身上，得到了有效验证。</p>\n  <p>去年吉利集团的最大整合动作，是将极氪集团私有化，今年上半年吉利集团销量同比增长1%，净利润同比增长46%，在某种程度上可以视为协同效果的释放。蔚来集团同样在去年将乐道产品研发、销售体系并入蔚来各集群。</p>\n  <p>如今小鹏对旗下产品线的整合，或许也将成为改善其财务指标的开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_372642f68bb6473898a89463d92911e8@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-10-16T12:41:40+00:00", "fetched_at": "2026-10-17T02:44:51.854334+00:00", "fingerprint": "7b6c60b7efcdc869"}, {"source": "36氪 - 最新文章", "title": "长鑫科技出手，新芯航途XHEART累计融资50亿｜36氪独家", "url": "https://36kr.com/p/4028536443327112?f=rss", "summary": "<p>36氪从多位产业人士处了解到，物理AI算力芯片公司新芯航途XHEART近日完成战略轮融资。本轮融资引入雷诺集团首次投资，奇瑞汽车追加投资，中国存储龙头企业长鑫科技也参与了本轮融资。</p>\n  <p>据悉，新芯航途XHEART已获历史总融资额约50亿元。</p>\n  <p>这轮融资的资方中，雷诺集团是欧洲头部车企，去年销售规模超200万辆。奇瑞集团是芜湖地方性国企，销售规模同样常年保持在数百万台水平。长鑫科技则是国产存储行业的巨头，这次长鑫科技的出手，是它对有汽车背景的芯片公司的罕见投资案例。</p>\n  <p>新芯航途XHEART的企业定位是，面向大模型需求、设计专用芯片，从而为自动驾驶、机器人等物理AI应用提供硬件支撑。</p>\n  <p>目前，新芯航途XHEART的核心产品是X7，这颗芯片锚定L2++城区智能辅助驾驶，及L3/L4自动驾驶市场，设计上对标行业内成熟辅助驾驶芯片。</p>\n  <p>上汽大众ID.ERA 9X是X7的首发车型，此后，X7又陆续上车上汽旗下的MG和荣威车型、通用旗下的凯迪拉克车型，以及奇瑞旗下部分新能源车型和燃油车型。有行业人士告诉36氪，这颗芯片的特点在于，在规划设计阶段，就与Momenta团队深度协作，把对算法的理解植入到芯片架构中，因此在芯片资源布局上更有针对性，无需和其他芯片Tier2一样，为所有可能的场景预留冗余设计。这使得X7芯片得以兼顾性能、功耗、良率等指标。</p>\n  <p>当前，无论是自动驾驶模型还是具身机器人模型，参数都越来越大，自动驾驶模型的参数量正从数百万向数十亿级别扩张。新芯航途XHEART也在布局下一代产品，以响应这一趋势。</p>\n  <p>新芯航途XHEART的产品背后，是一支颇有战斗力的团队。新芯航途XHEART的多名管理层，都是芯片行业的资深从业者。</p>\n  <p>新芯航途XHEART的另一重竞争优势，在于合作生态。</p>\n  <p>国内头部自动驾驶算法公司Momenta，与操作系统公司QNX都是新芯航途XHEART的深度合作伙伴。Momenta算是国内最早发力L2的自动驾驶公司，Momenta创始人曹旭东曾在接受36氪采访时表示，中国车企敲门要敲3年，国际车企敲门要敲5年以上，可见起步早，使Momenta在客户资源上拥有相当的优势。</p>\n  <p>截至目前，Momenta的客户已覆盖全球二十多家车企。Momenta港股上市前夕，这家公司的软件装车量已达到100万台。与Momenta的深度合作，无疑有利于新芯航途XHEART扩大出货规模。</p>\n  <p>此次新芯航途XHEART引入的投资方，未来也可为企业提供相当的助力。</p>\n  <p>国内市场已是极致内卷的红海，无论主机厂还是供应商，要想打造第二增长点，出海是它们必须筹谋的事。而雷诺是盘踞欧洲市场的大厂，奇瑞是自主品牌出海的先行者，新芯航途XHEART与它们在股权上的绑定，或许是这家芯片公司出海之路上的关键一步。</p>\n  <p>长鑫科技的出手亦是这轮融资的点睛之笔。</p>\n  <p>内存价格暴涨是今年制造业的黑天鹅，这对产业链上下游的控本能力提出了更高要求。有行业人士告诉36氪，海外芯片大厂高通，之所以能在与国产芯片供应商的PK中胜出，拿下头部新势力零跑的定点，靠的正是提前与镁光签订了协议，拿到了更低报价的内存，从而芯片更具成本竞争力。</p>\n  <p>而新芯航途XHEART引入长鑫科技成为股东，意味着新芯航途XHEART也有望获得内存的报价、供应优势。</p>\n  <p>但另一方面，越来越多的玩家也正涌入物理AI芯片领域。</p>\n  <p>近些年，AI芯片行业一个重要趋势是，蔚来、理想、小鹏这几家国内新势力车企都在拆分自研芯片业务、对外寻求融资和客户。</p>\n  <p>拿小鹏的图灵芯片来说，这颗芯片已经上车大众车型，大众是行业公认的国际巨头，去年全球交付新车超800万辆。而这家巨头车企早已成为小鹏的股东，其他芯片厂商要想进入大众供应链必然需要付出更多努力。</p>\n  <p>诚然，比起第三方芯片供应商，从车企拆分出去的芯片公司，很难拿下来自其他车企的订单。但面向想象力颇大的具身智能行业，第三方芯片供应商和车企的芯片子公司都站在同一起跑线上。</p>\n  <p>而且，这些新势力们也在辅助驾驶软件上竞技，而熟悉算法、软件的企业，其芯片架构设计往往会更合理。加之车企累计装车量达数百万级，这意味着车企的芯片子公司，其工程经验不会弱于第三方芯片公司。</p>\n  <p>在广阔的物理AI赛道，新芯航途XHEART有优势，也面临着挑战，但新芯航途XHEART显然已拥有了直面竞争的底气。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_387816b07aa14790853885099eb10c66@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-10-16T12:42:02+00:00", "fetched_at": "2026-10-17T02:44:51.854327+00:00", "fingerprint": "b0555b857619aab3"}, {"source": "36氪 - 最新文章", "title": "零跑电池负责人宋忆宁：电池产业已成熟，车企自研迎来好时机｜36氪专访", "url": "https://36kr.com/p/4028541747007879?f=rss", "summary": "<p>“电池行业已经很成熟了，所以我们才进入。”</p>\n  <p>9月，理想汽车宣布将“理想牌”电池推向全系车型，小米汽车官宣欣旺达、中创新航成为自研的“龙甲电池”战略伙伴。车企自研电池由此成为舆论焦点，与之相伴随的，是行业对于车企自研电池的必要性、车企牌电池性能的质疑。</p>\n  <p>而零跑科技高级副总裁、电池产品负责人宋忆宁则提出了一个行业“反共识”，在他看来，电池行业已相当成熟，这恰是车企深度介入电池产业的好时机。</p>\n  <p>“现在设备很成熟，头部就那么两三家;材料很成熟，头部也就那么两三家;价格也已经很透明。电池行业已经很成熟了，所以我们才进入。”</p>\n  <p>宋忆宁的底气是，零跑汽车在一众车企中，是自研电池上起步较早、走得较远的公司。这体现在，零跑早在2018年就开始探索和采用标准化电芯，并自研Pack，推行穿透式管理供应商的电池供应链模式，而这正是今天小米“龙甲电池”、“理想牌”等车企自研电池的策略。</p>\n  <p>可以说，零跑的电池供应链模式，不仅是今天行业开始推行自研电池体系的前身，也是车企深度参与电池研发和生产的最早实践之一。</p>\n  <p>除此之外，零跑还是较早量产了CTC的车企。CTC是将电池包与整车融合的一种集成方式，特斯拉最先公开发布这一方案，此后部分国内品牌也在效仿。但零跑是少有把CTC进行大规模量产装车的。同时宋忆宁认为，除了零跑，目前没有车企和电池厂做到了真正大规模量产装车的CTC，因为它们的电池包还是独立的，没有跟整车融合。</p>\n  <p>前不久，我们与宋忆宁进行了一次深度访谈，深入交流了零跑汽车做标准化电池的历程，以及对电池产业链的理解和预见。</p>\n  <p>宋忆宁对36氪回忆，起初，零跑的电芯种类也不少，公司感到很难管控。“而且当时如果定制一款非标电芯，车卖不到那个量，还要赔别人钱”，这一度使零跑“压力很大”。</p>\n  <p>因而从2018年开始，零跑尝试“把电芯标准化”，在各个平台开发之初，就规划好电池尺寸、容量。一开始，零跑也有4-5款标准化电芯，“那是三年以前，现在慢慢精简到两三款”，“148这个型号持续8年了，208型号持续5年了”。</p>\n  <p>除了推动电芯大单品，零跑还对供应商做了深度管控，尤其深入到诸多细节。宋忆宁告诉36氪，零跑“连产线都给它管控好”，“产线上面，比如哪个地方需要增加检测设备、哪个地方工艺管控不到位，我们都给他建议”。</p>\n  <p>随着零跑销量逐年攀升，往年销200万级冲刺，零跑又深入到了电芯制造端。</p>\n  <p>目前，零跑已经开启了与电池厂合资建厂的模式。零跑没有重复传统意义上“车企出钱、电池厂造电池”的路径，而是推行新的合作内涵，例如零跑会参与合资公司的采购、标准制定和物流规划，并派出核心人员进入部分关键部门；从正负极材料、隔膜、电解液到设备采购，零跑都直接参与。</p>\n  <p>据了解，合资建设电池厂的模式，加上标准化电芯策略，可以让零跑进一步将制造效率推向极限，例如每条产线只做一个电池型号，实现365天不停线、不换型，由此大幅降低制造成本。</p>\n  <p>这或许正是今天车企下场深度参与并主导电池研发，乃至制造的核心意义。</p>\n  <p>“因为（电池）行业进入商品化以后，我们就要打差异化，制造的差异化、性能的差异化。”宋忆宁说。</p>\n  <h3><strong>谈车企下场做电池：电池行业已经成熟，车企下场时机已到</strong></h3>\n  <p><strong>36氪汽车：</strong>电池行业走了10年，已经走到了商品化采购的阶段，但车企却仍要亲自下场做电池，你怎么看待这个现象？</p>\n  <p><strong>宋忆宁：</strong>其实这3-5年，电池已经商品化了。不要说10年以前，哪怕5年以前都还不是商品化，还是技术导向，还是有人能做出来、有人做不出来的阶段。</p>\n  <p>现在开始商品化，是因为头部的几家做得差不多了。但商品化以后，我们为什么还要自己下场？我认为在这个领域，电芯还有更多的东西要创新。而且整车厂来做电芯的话，我觉得会有更好的融合创新。而且也有很多电池厂不能做、只有整车厂能做的事情，刚才我跟你讲了好几点，比如不停线。</p>\n  <p>第二个，我们认为，现在电池商品化已经很成熟了，所以我们才介入。</p>\n  <p>现在设备很成熟，头部就那么两三家；材料很成熟，头部也就那么两三家；价格也已经很透明，因为合资公司的采购是我在管。电池行业已经很成熟了，所以我们才进入。因为行业进入商品化以后，我们就要打差异化，制造的差异化、性能的差异化。</p>\n  <p>我也讲个例子，比如6-9万的A10，跟30多万的D99，30万的车肯定要用快充倍率高的、循环寿命高的、性能更高的材料去做，可能要用第四代、第五代磷酸铁锂，因为性能要求更高，更全面，但也意味着更高成本。</p>\n  <p>那小车有必要吗？它都不需要上高压平台，400伏就够了，充电也很快。6-10万的小车，我一个月卖三万多台，一个月要用1.5GWh电池，一年用近20GWh。我自己做的话，不就可以针对这款车做吗。</p>\n  <p>我的电池本来就是标准化的，我再针对这款车来换一个适合它的材料，把成本降下去，电池成本降1000块钱下去，把这1000块钱给用户，匹配这个车的性能就好了。</p>\n  <p>有很多头部电池厂告诉我，它们有上千种电池产品，超过1000个种类。那虽然他们人很多、做得很好，但研发费用做不了太低，因为项目太多。</p>\n  <p>所以我就在想，如果我集中精力，打爆一款呢，一个材料体系，做两种尺寸，做一款打爆，把复杂的事情做到最简单，那我们为什么不能自己做？自己做还更有掌控力，还能更好地跟整车融合，这才是电动化时代的关键，把只有整车厂能做的事情做到极致。</p>\n  <p>另外，我们自己做一半，采购一半，也可以对冲一些风险。因为整车也会有季节波动波动，那我们还是可以调节。</p>\n  <h3><strong>谈电池标准化：百万年销量，只做3款电芯</strong></h3>\n  <p><strong>36氪汽车：</strong>在行业普遍面临巨大成本压力的情况下，零跑在电池领域有什么有效的降本策略吗？</p>\n  <p><strong>宋忆宁：</strong>主要就是根据我们零跑创新的、差异化的理念。</p>\n  <p>你知道我们零跑的电芯赢在哪里吗？我主要是从18年开始就标准化。我们可以说是全球车企里面标准化的引领者。现在很多人做这个标准化，有很多都在用我现成的东西。</p>\n  <p>我们从18年到今年100万台电池包，基本上只有三款电芯。这样做的好处就是我可以综合降本。而且这是只有车厂能做、其他电池厂很难做到的事情。因为电池厂面对很多整车厂，电芯型号非常多，不能自己标准化，因为车厂有车厂的要求。</p>\n  <p>所以他们最大的痛点是什么？我问过头部的电芯厂，他们做得最好的，一条产线一年换型5次，这是最少的，换型10次以上都很常见。</p>\n  <p>换型会导致什么情况？别人换型15天，爬坡10天，就要浪费25-30天。就算能力最强的企业，就按耽误它15天的产能算，一年换型5次就是75天，两个半月。一年12个月，他只能做9.5个月的生产。这个制造成本是不是就耽误了。</p>\n  <p>电芯标准化带来的是电芯的质量稳定。有些电池厂的负责人都跟我说过，电芯是大单品，如果老是换来换去，产线这么长，设备这么多，如果把电芯换一个型号重新生产，前面两三个月总是没那么好，因为设备还没跑稳。能力最强的企业也要4个月才能跑稳定，能力差一点的要6-8个月以上。</p>\n  <p>现在行业的一个痛点在哪里？很多车一年更新一次，这个电芯还没卖到一年，他又换一款，电芯品质刚做好，你又换掉去做另一款电芯型号，没有标准化，所以质量永远做不好。</p>\n  <p>而我们讲究的是less is more，把复杂的东西简单化，就越做越好。我从18年定义这个型号，到现在8年了，你想8年只做一件事，还能做不好吗。</p>\n  <p>现在大家都在讨论速成车，我们这个标准电芯有6-8年的产品积累，谁能跟我比品质？所以现在我们整个电池包的品质，超过行业平均水平3倍，也就是故障率只有行业平局水平的三分之一。</p>\n  <p>所以现在我们的标准化电芯变成行业里面的畅销电芯了，很多车厂都在用我这一款。148型号的电芯卖得最好，208很多人也在用了。</p>\n  <p><strong>36氪汽车：</strong>说到电池标准化，零跑对哪些方面进行了标准化？是尺寸、容量，还是电压？</p>\n  <p><strong>宋忆宁：</strong>我们的尺寸、容量、充放电倍率、原材料选型，都介入得很深。</p>\n  <p><strong>36氪汽车：</strong>零跑是如何对电芯进行质量管控的？</p>\n  <p><strong>宋忆宁：</strong>这10年以来，我们负责电芯的人也不少。我们深入到什么程度？我连产线都给它管控好。产线上面，比如哪个地方需要增加检测设备，或者哪个工艺管控做的不到位，我们都给他建议和要求。</p>\n  <p>包括电池厂的产线爬坡的时候，我们派十几号人，在产线上面跟他们一起做。等于我们在帮助别人把电芯做好。</p>\n  <p>而且我们这个标准是远远高于行业标准的，甚至top的电芯厂都跟我说过，我们的标准怎么这么高。</p>\n  <p>但我说，没事，你今天觉得高，做完我的标准化电芯以后，一年以后你就不会说标准高了。为什么做别人的产品觉得标准高，那是因为别人没有标准化，东西还没做好就让你变掉。其实电芯电化学体系，没有一年两年是做不好的，持续做一两年以上，才能有真正的know-how。</p>\n  <p>果然一两年以后，别人就告诉我，做好了，质量现在都很稳定。所有的电芯厂都这样讲。</p>\n  <p>大家都在讨论哪个电芯做得好、哪个不行，其实现在对于磷酸铁锂电池来说，真的没有太多差异，特别在零跑这里。</p>\n  <p>因为我们现在深度介入电芯厂的设备采购、原材料采购，发现电池行业其实很集中。设备真正做得好的，每一种设备不超过三家；材料真正做得好的，每一种材料不超过三家。最近三年电芯工艺也很成熟，环境控制也都是标准化了。</p>\n  <p>所以磷酸铁锂电芯已经是很成熟的大工业化产品。10年以前，各家确实差异有点大，但最近3-5年差异很小。</p>\n  <p>而且，所有的电芯厂做我们的标准化电芯，质量远远比做其他车企的要好。</p>\n  <p>比如有一家企业，7-8年都在做这一款电芯，148的型号。一开始他做的时候也没那么好，说实话，但我们坚持让他做下去，一年以后就做得很好了，到现在基本上每个基地都做得很好，质量水平跟Top级企业没什么差别。就是因为标准化，7-8年只做一件事情，就一定能够做好。</p>\n  <p><strong>36氪汽车：</strong>标准是零跑在造车过程中摸索出来的，还是造车之初就制定好的？</p>\n  <p><strong>宋忆宁：</strong>主要是我们规划做得比较好。每个车都有一个平台，比如ABCD平台，我们当时就算好了，这个电池尺寸可以做到多少容量，事先规划好。</p>\n  <p>当然我们原来也有4-5款电芯，那是三年以前，现在慢慢精简到两三款。但我们一直都在标准化，148这个型号持续8年了，208型号持续5年了。</p>\n  <p><strong>36氪汽车：</strong>做标准化的卡点在哪里？为什么其他车企没做，零跑却能坚持十多年？</p>\n  <p><strong>宋忆宁：</strong>战略要做准确，方向很重要。为什么我们能做成，我认为零跑赢就赢在效率和决策，还有我们这种组织架构的机制。</p>\n  <p>首先，我们做得最好的一点是，朱总从创立零跑开始，就把电池作为他直管的一个一级部门，同时把电池作为核心零部件统一规划及管控。</p>\n  <p>而很多车厂，电池属于零部件，由整车来统筹管理。传统车企都是车辆定义电池，车需要什么电池，你就做什么电池。实际上肯定不能这样。电池工厂投资不比整个车企的投资小。应该是电池跟车企共创，甚至有时候应该以电池定义车。</p>\n  <p>第二，车里面不就是传统整车架构、电池、智能驾驶、汽车电子还有电驱吗，我们是从三电方面、智能化方面，和整车做融合创新。</p>\n  <h3><strong>谈电池品牌：有终身质保，买车不用考虑品牌</strong></h3>\n  <p><strong>36氪汽车：</strong>最近小米和理想，一个宣布对欣旺达增资，一个是战略签约，零跑怎么看这事？零跑是最早完全自主掌控电池标准体系的，为什么反而没有做一个零跑牌的电池？</p>\n  <p><strong>宋忆宁：</strong>可能零跑是不太会宣传，我们好像都没有想过一定要搞个什么品牌。但是我们从一开始就是这种自研自制、自己掌握核心技术，这是我们创立以来的一个根基、一个战略方向。</p>\n  <p>其实在电池方面我们比他们做的更早，走得更远，目前我们自己的电芯都已经量产了。可以说，零跑是全球所有车企里面唯二的，电芯，模组、BMS、Pack，100%都是自己掌控，从零跑汽车成立开始，每一台车的动力电池系统都是我们自己研发、生产和搭载，这绝对是全球唯二。</p>\n  <p><strong>36氪汽车：</strong>零跑有考虑过推出自己的电池品牌吗？</p>\n  <p><strong>宋忆宁：</strong>也在考虑，但我们是从另外一个角度去考虑。现在的电池供应商还有品牌效应，但我认为，随着电动车的普及、电池技术的成熟，品牌效应会越来越弱。</p>\n  <p>我们是第一家推出电池终身质保的，也是全系的，不管是6万多的A10，还是30万的D99，电池都是终身质保。我们有这个底气，就是因为我们认为电池没有差异化。</p>\n  <p>消费者买我的车，考虑品牌干嘛，反正我们都给你终身质保。</p>\n  <h3><strong>谈合资建厂：便于打造超级工厂</strong></h3>\n  <p><strong>36氪汽车：</strong>能介绍一下零跑的电池团队吗？比如大概的人员规模是多少？</p>\n  <p><strong>宋忆宁：</strong>我们研发人数大概八百人，再加上工厂的人，一共四千人左右。</p>\n  <p>今年零跑能卖100万台车，我就要做到大概120万台电池包，因为我们还有储能业务，还有外销，</p>\n  <p>你想一下，一个月做十几万台电池包，一年产值做三百五六十亿，用350亿除上4000人，这个人员产值就很高了。</p>\n  <p>我们的电池产能都接近200万台了，产线不断在上，到年底就可以达到180万台的产能，是Pack和模组、BMS，液冷板工厂100万台，箱体工厂150万台。电芯，目前合资公司大概五六十万台车的产能，剩下的就去外面买。</p>\n  <p><strong>36氪汽车：</strong>为什么零跑觉得到一定量级需要成立个合资公司？市场上电池产能其实是远远充足的，为什么不是通过公开采购？</p>\n  <p><strong>宋忆宁：</strong>还有个原因，就是我们需求量真的非常大。零跑一直以来都是只买Cell，我给你讲个数据。今年100万台车，我们要用到接近70GWh的电芯，相当于3-4个电芯工厂全部包下来。如果明年做到160到170万台，需要130GWh，相当于7-8个工厂全部给你包掉。</p>\n  <p>我再给你讲个数据。今年上半年，我们PACK的装机量已经达到了行业第三，电芯装机量已经超过30GWh，这个电芯需求量已经达到了排名前列的电芯厂的动力出货量。</p>\n  <p>所以我们要合资，这样更加便于做超级一体化的集成工厂。比如我们在武义的这家超级一体化集成电池工厂，我们把电芯合资公司、模组Pack工厂、电池箱体厂、液冷板工厂、CCS工厂这些，全部放在一个工业园区。而且像箱体、液冷板我们全部自己做。</p>\n  <p>这样最直接的好处就是超级集成化。你想一下，电芯原材料运过来，电芯出来以后都不用包装、不用运输，直接到模组Pack产线。箱体、液冷板过来也不用包装、不用运输。都是倍速链运输直接上产线。</p>\n  <p>其他公司都是这里一个零部件、那里一个零部件，这个零部件再小，上一次车、下一次车，包装费总要几十块钱吧，这是浪费。零跑有这么大的量，我做超级集成不行吗？在一个工业园区把所有东西做好，至少把物流费、包装费省掉200块钱一台车。</p>\n  <p>这是通过我们的经营模式省的钱，而且效率更高，。质量也更好管控，前端跟后端一体集成，这就叫经营效率的超级集成化。</p>\n  <p>当然，我们还是会保持自己做一部分、一部分外购，这样充分保证我们自己的竞争力和外面的竞争力。因为我们需求量大，哪怕我们自己做了一部分，供应商还是有很大的量。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261016/v2_9ca85e287a6a46f4b9ef0e77c0f8370d@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-10-16T12:45:42+00:00", "fetched_at": "2026-10-17T02:44:51.854319+00:00", "fingerprint": "06755f517c6e34d1"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨特斯拉发布“会飞”的跑车，预订金33.2万元；中国限制或禁止出口AI等领域40项技术；长鑫科技预计前三季度净利超1300亿", "url": "https://36kr.com/p/4029260041245314?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <ul>\n   <li>DeepSeek将整合多团队成立产品部，崔添翼出任负责人</li>\n   <li>铁路车次编排将调整，更高时速动车组新增X字头</li>\n   <li>iPhone Duo预售秒罄</li>\n   <li>美国肯德基将改用可口可乐</li>\n   <li>亚马逊限制Grok机器人下单，马斯克回应</li>\n  </ul>\n  <h2><strong>TOP 3 大新闻</strong></h2>\n  <p><strong>特斯拉发布“会飞”的跑车，预订金33.2万元</strong></p>\n  <p>10月16日，特斯拉在美国得克萨斯州发布第二代Roadster跑车，并展示其“飞行”能力。直播画面显示，车辆借助推进器、大功率风扇等装置，完成倒置坡道行驶、短暂腾空及空中旋转等动作。</p>\n  <p>目前，新车已在特斯拉中国官网开放预订，Performance版本预订意向金为33.2万元，可全额退还。该车型可乘坐两人，配备主动空气动力学系统和多模式吸气系统。特斯拉提醒，车辆能否在当地上市仍取决于相关法律法规。马斯克此前多次宣称，新款Roadster可以实现短途飞行。（界面新闻）</p>\n  <p><strong>中国限制或禁止出口AI、生物医药和光伏三领域共40项技术</strong></p>\n  <p>中国对关键技术加强出口管制。10月16日，中国商务部、科技部发布2026年第48号公告，就修订《中国禁止出口限制出口技术目录》（下称《目录》）公开征求意见。此次公开征求意见涉及拟增列的人工智能（AI）、生物医药、光伏三个领域40项关键技术。其中，拟禁止出口技术14项，包括：人工智能驱动的恶意代码生成与变异技术、具有自主知识产权的细胞和基因治疗技术工艺平台、钙钛矿及叠层电池组件生产技术等。拟限制出口技术26项，包括：人工智能辅助漏洞挖掘技术、具有自主知识产权的通用型细胞和基因治疗全新靶点发现和验证技术、单线产能≥3万吨/年的多晶硅工程技术等。（财新）</p>\n  <p><strong>长鑫科技：预计前三季度净利润1310亿元-1325亿元，同比扭亏为盈</strong></p>\n  <p>36氪获悉，长鑫科技公告，预计2026年前三季度归属于上市公司股东的净利润为1310.00亿元-1325.00亿元，同比扭亏为盈。业绩变动主要系AI算力需求快速增长，全球DRAM行业景气度提升，产品供不应求，价格大幅上涨，公司产能利用率保持高位运行，整体业绩显著提升。</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>小红书官宣打通AI部门与核心infra团队</strong></p>\n  <p>10月16日，小红书发全员信，将内部AI一级部门Dots与公司核心infra团队打通。全员信明确了小红书作为科技应用公司的定位，与云厂商投入模型研发的逻辑存在根本不同。“我们对下一阶段的方向更加清晰：技术最大的价值不仅在于追求模型能力或算力规模本身，更重要的是模型与应用的深度融合，技术和产品互相增强，共同创造这个时代有价值的用户体验。”调整还明确了内部另一技术组织hi lab的定位：专注长期技术探索，布局前沿技术方向。（第一财经）</p>\n  <p><strong>OpenAI披露：研究模型擅自使用他人测试币</strong></p>\n  <p>当地时间10月15日，OpenAI更新一份内部研究案例报告，披露一个内部研究模型在完成加密货币交易应用开发任务时，未经账户持有人授权，利用公开的开发者助记词推导钱包私钥，并动用该钱包中的以太坊测试币支付合约部署费用。模型共检查362个地址，找到一个余额足以支付部署费用的账户，最终成功完成部署，但未在最终回复中披露其使用了该账户资金。OpenAI表示，该事件反映出模型可能以自身对潜在危害的判断取代账户持有人的授权。公司称，已实施额外防护措施，防止类似案例获得实时互联网访问权限，并将对所有流量运行失准行为监测系统，一旦发现模型获得实时互联网访问权限，将向安全团队发出警报。（界面新闻）</p>\n  <p><strong>WorkBuddy，发布DeepSeek异常补偿方案</strong></p>\n  <p>腾讯云WorkBuddy及CodeBuddy团队发布《关于DeepSeek模型服务异常说明及补偿公告》。针对此前DeepSeek模型服务异常，将对受影响用户全额返还其10月8日至14日期间使用DeepSeek所消耗的积分；同时，面向WorkBuddy和CodeBuddy国内版全量用户额外赠送500积分。此前，DeepSeek就服务系统出现故障致歉，并公布补偿方案，受影响用户账号7日内（10.8-10.14）的消耗金额以赠金形式全额返还。（财联社）</p>\n  <p><strong>Meta发布开源AI模型，核心尖端技术保持闭源</strong></p>\n  <p>当地时间10月15日，Meta Platforms宣布发布Muse Spark Open的“权重”——即允许开发者自行运行和适配模型的参数设置。根据Meta的说法，这款专为编程和支持AI智能体设计的模型，不如该公司本周早些时候首次亮相的Muse Wonder先进。Meta首席AI官Alexandr Wang表示，公司原则上不会对最强性能的模型进行开源，但会持续向开发者社区开放性能稍低的模型版本。（界面新闻）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>iPhone Duo预售秒罄</strong></p>\n  <p>10月16日晚，苹果首款折叠屏手机开启预售，起售价为15999元，10月23日正式发售。在预售开启前，iPhone Duo就展现出超高的市场热度，京东平台的产品预约量已突破200万，远超同期常规旗舰机型的预约表现。记者在开售当晚多平台实测抢购，进入购买页面后显示无法支付，页面宕机数秒后，首批现货便已售罄，约15分钟后，购得的机子发货日期已排到12月5日。供需缺口带动iPhone Duo在市场上出现明显溢价，在得物上，iPhone Duo的成交订单超过700单，原本15999元的256G版本，成交价高达2.19万元，而黑色的256G版本售价高达31999元，溢价16000元。（第一财经）</p>\n  <p><strong>美国肯德基将改用可口可乐</strong></p>\n  <p>当地时间10月15日，美国肯德基宣布与可口可乐公司建立新的合作伙伴关系。从2027年1月开始，肯德基将把其美国饮料合作伙伴关系转至可口可乐公司，预计到2027年春季，可口可乐产品将在全美所有肯德基餐厅供应。</p>\n  <p>至于中国肯德基会不会也跟着换，16日，北京市海淀区一家肯德基门店人员向中新经纬表示，门店当前用的可乐是百事品牌，目前没有接到可乐换品牌的通知。西城区一家门店也同样表示，目前没有接到换可乐品牌的通知。（界面新闻、中新经纬）</p>\n  <p><strong>DeepSeek将整合多团队成立产品部，崔添翼出任负责人</strong></p>\n  <p>DeepSeek将Harness团队以及Web、App、Platform团队整合成“产品部”，负责公司的所有的产品、设计和研发工作，原Harness团队负责人崔添翼任产品部负责人。目前，产品部对外招聘产品设计师和设计师岗位。（财联社）</p>\n  <p><strong>美股收盘：三大股指收跌，Coreweave跌近12%</strong></p>\n  <p>美股周五收盘，纳指跌2.14%，标普500指数跌1.09%，道指初步收跌0.34%。Coreweave(CRWV.O)跌11.91%，SK海力士(SKHY.O)跌6.58%，Arm(ARM.O)跌6.94%，闪迪(SNDK.O)跌6.85%，甲骨文(ORCL.N)跌4.64%，特斯拉(TSLA.O)跌2.13%。纳斯达克中国金龙指数跌1.3%，百度(BIDU.O)跌2.93%，阿里巴巴(BABA.N)跌1.83%。(金十数据)</p>\n  <p><strong>英伟达市值，9天蒸发4万亿元</strong></p>\n  <p>近日，全球AI概念股持续遭到抛售。周五，英伟达延续跌势，股价下跌1.43%，最新市值5.16万亿美元。自10月6日创下阶段新高、总市值达到5.76万亿美元后。近期，英伟达持续走弱，近9个交易日最大回撤超12%，市值较高位蒸发约0.6万亿美元（约合4万亿元人民币）。（财联社）</p>\n  <p><strong>蔚来李斌谈特斯拉会飞：这个我们真没有</strong></p>\n  <p>10月16日晚间，蔚来创始人、董事长、CEO李斌在微博转发了特斯拉Roadster现场视频并称：“太厉害了！这个我们真没有，为特斯拉点赞。”此前，李斌曾喊出“特斯拉有的我都有，我有的特斯拉没有”，迅速成为网络热议的焦点。（第一财经）</p>\n  <p><strong>铁路车次字头迎重大调整：更高时速动车组新增X字头</strong></p>\n  <p>从中国国家铁路集团有限公司获悉，全国铁路列车车次将于11月下旬、12月下旬分两批调整，其中新增X字头，主要用于未来最高运行时速350公里以上的复兴号动车组列车。国铁集团运输部相关负责人介绍，X读“新”，表示最高运行时速350公里以上的复兴号动车组列车，寓意“新时速、新产品”，车次编排为X1至X9998。此次改革将同步实施新版《列车车次编排规定》，动车组旅客列车字头由4个增至7个，可编排车次数量增长近40%。车次变更后，列车开行区段、运行时刻仍按现行运行图执行。（新华社）</p>\n  <p><strong>四部门：组织30余家车企座谈，加强汽车产品研发测试验证管理</strong></p>\n  <p>10月16日，从工业和信息化部获悉，工业和信息化部、公安部、生态环境部、市场监管总局四部门组织30余家重点汽车生产企业开展座谈，加强汽车产品创新设计和研发测试验证管理。据了解，汽车生产企业应落实质量提升专项行动工作要求，坚决抵制非理性竞争，加强汽车产品创新设计和研发测试验证管理，守牢产品安全底线。重点包括：全面加强测试验证，增强研发测试验证能力，充分开展产品创新设计安全评估和研发测试验证，及时消除安全隐患。如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任等内容。（央视新闻）</p>\n  <p><strong>图库巨头Getty拟破产重组，视觉中国回应：合作正常</strong></p>\n  <p>当地时间10月12日，全球图片及视觉内容供应商Getty Images（盖蒂图片社）宣布达成全面重组协议，计划数周内启动美国破产法第11章预打包重整程序，年底前完成重组及私有化退市。在中国市场，Getty Images的内容只能通过一家公司合法获得授权，这家公司是视觉中国。双方自2005年起建立独家合作，迄今超过二十年。10月15日，视觉中国方面表示，目前公司与Getty Images的相关业务合作正常，没有任何变化。（21财经）</p>\n  <p><strong>亚马逊限制Grok机器人下单，马斯克回应</strong></p>\n  <p>10月16日，针对亚马逊限制Grok机器人在平台下单一事，马斯克回应称：“也许我们应该创办一个与亚马逊竞争的购物平台。”（界面新闻）</p>\n  <p><strong>9月银行存款利率普遍上调，5年期涨幅最高</strong></p>\n  <p>融360数字科技研究院发布的2026年9月银行存款利率报告显示：除3年期存款利率环比小幅下行外，其余各期限定期存款利率均小幅增长或持平，尤其是5年期存款利率和5年期大额存单利率增速最明显。报告显示，2026年9月，银行整存整取存款3个月期平均利率为0.950%，6个月期平均利率为1.156%，1年期平均利率为1.267%，2年期平均利率为1.358%，3年期平均利率为1.682%，5年期平均利率为1.571%。和上个月相比，3个月期上涨0.1BP，6个月期上涨0.4BP，1年期上涨0.3BP，2年期持平，3年期下降0.1BP，5年期上涨0.7BP。（第一财经）</p>\n  <p><strong>OpenAI广告收入或难以达标，大举招揽谷歌、Meta人才</strong></p>\n  <p>今年，OpenAI与Anthropic不断推出新模型与工具，争夺开发者群体，在此过程中，它的广告业务一度显得像是顺带布局。但如今情况已然改变。过去数月，这家公司密集推出多款新产品与工具来吸引广告主，同时下调广告定价。最新数据显示，此举帮助它吸引了大量新增广告客户。OpenAI还在大规模招人。员工档案追踪平台Crustdata的数据显示，在OpenAI约140名广告业务员工中，近半数是7月至9月间入职；广告业务负责人戴夫·杜根曾在Meta任职12年，Meta也是其人才的最大来源地。（新浪财经）</p>\n  <p><strong>药明康德股价大跌，龙虎榜披露</strong></p>\n  <p>药明康德今日跌6.60%，成交额123.40亿元，换手率3.38%，盘后龙虎榜数据显示，沪股通专用席位买入26.25亿元并卖出12.26亿元，有2家机构专用席位净卖出5.95亿元。（财联社）</p>\n  <p><strong>“彩电第一股”，确定退市</strong></p>\n  <p>*ST康佳A(000016.SZ)公告称，公司收到深交所终止上市决定，因股东会决议主动终止A股、B股股票上市，股票不设退市整理期，将于公告终止上市决定之日起五个交易日内摘牌。终止上市后，股票将转入退市板块挂牌转让，公司已聘请江海证券为代办机构。*ST康佳A自1992年在深交所上市，曾是国内彩电行业龙头，被誉为“彩电第一股”，2003年至2007年连续五年夺得中国彩电市场销量冠军。（财联社）</p>\n  <p><strong>长鑫科技：董事长提议回购10亿至20亿元股份</strong></p>\n  <p>36氪获悉，长鑫科技公告，公司董事会于2026年10月16日收到董事长朱一明提议，拟使用自有或自筹资金，通过上交所交易系统以集中竞价方式回购公司A股股份。回购资金总额不低于10亿元且不超过20亿元，回购股份拟用于员工股权激励、员工持股计划或减少注册资本，回购价格不高于董事会审议通过方案前30个交易日股票交易均价的150%，实施期限为自董事会或股东会审议通过之日起12个月内。朱一明在提议前6个月内无买卖公司股份情况，并承诺在董事会上对回购议案投赞成票。</p>\n  <p><strong>航空资本集团订购75架空客A320neo系列飞机，为公司史上最大订单</strong></p>\n  <p>10月16日，飞机租赁公司航空资本集团（ACG）宣布，已与空中客车公司敲定75架A320neo系列飞机订单，计划于2032年至2035年间交付。这是ACG近40年来最大一笔飞机订单。交易完成后，ACG的A320neo系列飞机未交付订单将增至115架。截至2026年6月30日，ACG机队已拥有118架该系列飞机。（界面新闻）</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>亨通光电：前三季度净利润同比预增151.27%—168.1%</strong></p>\n  <p>36氪获悉，亨通光电公告，预计2026年前三季度实现归属于上市公司股东的净利润为59.70亿元到63.70亿元，同比增加151.27%到168.1%。</p>\n  <p><strong>海康威视：前三季度净利润129.11亿元，同比增长38.55%</strong></p>\n  <p>36氪获悉，海康威视公告，2026年前三季度营业收入740.44亿元，同比增长12.60%；归属于上市公司股东的净利润129.11亿元，同比增长38.55%。</p>\n  <p><strong>中国稀土：前三季度净利润同比预增88.96%-140.99%</strong></p>\n  <p>36氪获悉，中国稀土公告，预计2026年前三季度归属于上市公司股东的净利润为3.63亿元-4.63亿元，同比增长88.96%-140.99%。</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>嘉立创：筹划发行H股并申请在港交所主板上市</strong></p>\n  <p>36氪获悉，嘉立创公告，公司正在筹划发行境外上市股份（H股）并申请在香港联合交易所有限公司主板挂牌上市。</p>\n  <p><strong>联讯仪器：拟发行H股股票并在港交所主板上市</strong></p>\n  <p>36氪获悉，联讯仪器公告，公司第二届董事会第十次会议审议通过发行H股股票并在香港联交所主板上市的相关议案。本次拟发行H股股数不超过发行后公司总股本的10%（超额配售权行使前），可行使不超过前述发行股数15%的超额配售权，发行方式为香港公开发售及国际配售新股。募集资金扣除发行费用后将全部用于公司业务发展。相关议案尚需公司股东会审议。</p>\n  <p><strong>优艾智合机器人港股IPO获中国证监会备案</strong></p>\n  <p>36氪获悉，中国证监会国际合作司发布关于合肥优艾智合机器人股份有限公司境外发行上市及境内未上市股份“全流通”的备案通知书，公司拟发行不超过49477800股境外上市普通股并在香港联合交易所上市。公司37名股东拟将所持合计243804260股境内未上市股份转为境外上市股份，并在香港联合交易所上市流通。</p>\n  <p><strong>东山精密港股上市获中国证监会备案</strong></p>\n  <p>36氪获悉，中国证监会国际合作司发布关于苏州东山精密制造股份有限公司境外发行上市备案通知书，公司拟发行不超过234038600股境外上市普通股并在香港联合交易所上市。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>理想汽车芯片子公司完成首轮16.25亿元融资协议，最大投后估值171亿元</strong></p>\n  <p>36氪获悉，理想汽车宣布，旗下芯片子公司上海马赫心科技有限公司签署首轮股权融资协议，融资金额为16.25亿元人民币。本轮融资由杭州经韬、蓝驰创投及华业天成领投，奇绩创坛参与投资。同时，杭州经韬及其关联基金获授最高5亿元人民币的追加认购权，若该认购权悉数行使，投后估值达171亿元。</p>\n  <p><strong>新芯航途XHEART完成战略轮融资</strong></p>\n  <p>36氪从多位产业人士处了解到，物理AI算力芯片公司新芯航途XHEART近日完成战略轮融资。本轮融资引入雷诺集团首次投资，奇瑞汽车追加投资，长鑫科技也参与了本轮融资。据悉，新芯航途XHEART已获历史总融资额约50亿元。</p>\n  <p><strong>“法奥机器人”完成近10亿人民币C+、D轮融资</strong></p>\n  <p>36氪获悉，截至2026年10月，“法奥机器人”连续完成C+轮及D轮融资，两轮累计融资规模近10亿人民币。两轮融资获得多家投资机构支持，分别由美团龙珠和美团领投，永鑫资本、狮山二期、苏创投等机构参与本次系列投资；国联民生资本、苏产投、清流资本等老股东在本次系列融资中继续追加投资。融资资金将主要用于核心零部件的产能固投，以及工业具身智能领域的扩产与研发投入，涵盖ART系列工业级人形力控臂、AIRLab具身智能工具平台等。</p>\n  <p><strong>整理丨</strong>娃娃菜&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzI2NDk5NzA0Mw==&amp;tempkey=MTM5Nl9CU2lORmMzRkNkM1l3REZHY3dXdWt2eDRXTjlRbEpVbml2a3ZwRlgtUWJjUTNYci1nVnM0RllEV3dNd2hUcjVWMElLTXVsY0FfZU13dDhyckk0WFN5NDIycU1zc1N6WE1VN21HYnFqWUI5NlFvN2VWZHk0VXFLVGV3OVhtVFFyaFROc1lHM3NBM3A5aEpyVVg4bkpjaXdFODl0NTgyLXExdmZ1Zkl3fn4%3D&amp;chksm=68556ab52cfb2f18ae9ba32bf72660a1a64782582d2c93a80c36a2d92f86c7736864c687a3d4&amp;mpshare=1&amp;scene=1&amp;srcid=1017zLaUffvwP5tU7L4jhYO0&amp;sharer_shareinfo=729a2fdf8c4bb6c624be68b81c2771da&amp;sharer_shareinfo_first=729a2fdf8c4bb6c624be68b81c2771da#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-10-17T01:00:30+00:00", "fetched_at": "2026-10-17T02:44:51.854304+00:00", "fingerprint": "1db71859b5e48cf8"}, {"source": "少数派", "title": "让读书笔记不再吃灰：我做了一款跨平台书摘管理工具", "url": "https://sspai.com/post/115688", "summary": "从微信读书的 3 万条划线出发，我做了一个让阅读笔记重新回到日常的 App。<a href=\"https://sspai.com/post/115688\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-16T02:18:38+00:00", "fetched_at": "2026-10-17T02:44:48.998187+00:00", "fingerprint": "513120993eb9e1a8"}, {"source": "少数派", "title": "一面专注体验，一面表达个性：麦金獭钢化膜与极稚墨水屏手机壳体验", "url": "https://sspai.com/post/115679", "summary": "从正面的手感与显示聊起，再翻到背面看看换图的玩法。<a href=\"https://sspai.com/post/115679\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-16T04:41:05+00:00", "fetched_at": "2026-10-17T02:44:48.998181+00:00", "fingerprint": "40074e349c0c1a21"}, {"source": "少数派", "title": "「弯道超车」赛车入门指北 05：让赛车粉身碎骨，才是保命的真正方式", " <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
