<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

", "published_at": "2026-08-11T19:41:42+00:00", "fetched_at": "2026-08-12T01:26:57.229074+00:00", "fingerprint": "7d86757ea2a6f978"}, {"source": "The Verge", "title": "An FCC filing points to new Sonos headphones coming soon", "url": "https://www.theverge.com/tech/978355/sonos-headphones-fcc-filing", "summary": "It looks like we'll be getting a successor to the Sonos Ace headphones sometime this fall, which was hinted at by CEO Tom Conrad during a third quarter earnings call. As reported by What Hi-Fi?, an FCC filing by Sonos, Inc reveals details about upcoming wireless headphones with the model number S52A. In addition to [&#8230;]", "category": "tech", "published_at": "2026-08-11T21:23:30+00:00", "fetched_at": "2026-08-12T01:26:57.229067+00:00", "fingerprint": "db5eb10141d88119"}, {"source": "The Verge", "title": "Xbox Elite 3 prototype pad leaks with tiny built-in screen", "url": "https://www.theverge.com/games/978374/xbox-elite-3-prototype-pad-leaks-with-tiny-built-in-screen", "summary": "Did a prototype Microsoft gamepad fall off the back of a truck? We can't say, but a Redditor has legit-looking photos of a prototype Xbox controller that's almost certainly the Xbox Elite Series 3. Incredibly, they claim they bought the pad for $200 on OfferUp. In May, a Brazilian regulator's leaked images revealed that Xbox [&#8230;]", "category": "tech", "published_at": "2026-08-11T22:36:35+00:00", "fetched_at": "2026-08-12T01:26:57.229060+00:00", "fingerprint": "9099c17defc10a28"}, {"source": "The Verge", "title": "Saber denies replacing Rideshare Stimulator&#8217;s writers with ChatGPT", "url": "https://www.theverge.com/games/978558/rideshare-stimulator-writer-ai-saber-interactive", "summary": "After a former lead writer claimed Saber \"replaced me with ChatGPT,\" CEO Matthew Karch now claims, \"Neither Saber nor Unigine have replaced any writers with AI,\" for the Rideshare \"Stimulator\" game announced last month, developed by Unigine. The writer, Stella Sacco, says differently, however, posting on Bluesky that \"I was lead writer on this one! [&#8230;]", "category": "tech", "published_at": "2026-08-12T00:39:26+00:00", "fetched_at": "2026-08-12T01:26:57.229049+00:00", "fingerprint": "2d93b9c8f35a1abe"}, {"source": "36氪 - 最新文章", "title": "是蓝海，也是慢海：一个中国电商人在非洲的25年拓荒史", "url": "https://36kr.com/p/3934727276494210?f=rss", "summary": "<p>在今年出版的一本新书《How Africa Works》中，作者乔・斯塔威尔将非洲描述为“最后一片蓝海”。基于七年田野调查与文献研究，他认为非洲过去经济落后、工业化水平低，是因为人口密度过低、分布稀疏，导致消费市场分散，并且水电网络等基础设施的铺设只能以高成本覆盖少数人员，难以形成专业的产业链分工。</p>\n  <p>而如今非洲拥有近16亿人口、平均年龄不到20岁，是全球人口结构最年轻的大陆，人口密度也在逐年提升，能够摊薄水电、道路、物流等基础设施的铺设成本，支撑起规模化的消费市场和专业化分工。越来越多中国人和企业也把生意触角延伸到非洲。<strong>据海关总署披露，过去十年中非贸易额翻了一番，中国连续16年保持非洲第一大贸易伙伴地位。</strong></p>\n  <p>从智能手机到摩托车，从太阳能产品到日用品，大量中国制造正在涌入非洲市场。深圳供应链产出的3C产品经拉各斯、内罗毕等集散中心流向整个非洲，义乌生产的日用百货铺满非洲各地的露天集市、社区夫妻店和路边摊位。</p>\n  <p>在涌向非洲的人潮中，廖旭辉是来得最早、扎得最深的人之一。</p>\n  <p>2000年开始，廖旭辉就开始接触非洲贸易，帮助朋友在深圳组织货源（淘库存纺织品）；2003年，他辞去国内稳定的工作，凭着拼凑的30万本金，从深圳批发VCD卖到非洲多哥。当时非洲是典型的卖方市场，电子产品供不应求，廖旭辉也因此迅速挣到在非洲的第一桶金。</p>\n  <p>2005年多哥当地局势波动，廖旭辉出于安全考虑，安排团队离开多哥暂撤到邻国，让他至今都难以忘记的是，<strong>在离开的日子里，有一位非洲本地员工帮他们照看仓库，直到当地秩序恢复。这件事也坚定了廖旭辉在非洲发展的信心。</strong></p>\n  <p>从2006年到2008年，他把生意从西非铺到中非、东非的二十多个国家，还在当地打造了自有的家电品牌LEADDER，主营DVD、音箱、电视等视听产品。</p>\n  <p>彼时，电商在中国刚刚起步，大多数非洲人更不知道电商为何物，<strong>廖旭辉已经再次转身，创立跨境电商平台Toafrica（2015年升级为Amanbo），比Jumia等非洲本土电商平台的出现还要早三年，而中国卖家大规模涌进非洲做电商更要到十年之后。</strong></p>\n  <p>作为国内最早聚焦非洲市场的跨境电商平台，Amanbo是工信部认定的对非数字经济合作重点项目，平台已在喀麦隆、肯尼亚、多哥、科特迪瓦等多个国家设立本地运营中心和海外仓，业务覆盖非洲30余个主要国家，连接1万家中国供应商和20余万非洲本地B端商家。</p>\n  <p>起步如此之早，困难远超想象：当时多数国家网速只有5K/S，打开一张商品图都要等几分钟；一天停三四次电，服务器经常断连；出了首都就是泥巴路，物流根本送不到。因此他试过做离线数据库、自建WiFi站点，更踩过无数坑，最后得出结论：<strong>商业创新不能抢先太多，布局太早只能当“铺路石”。</strong></p>\n  <p>过去20多年，廖旭辉从未离开非洲，和斯塔威尔一样始终相信非洲经济终将崛起。他说：“非洲是蓝海但也是慢海，没有快钱，去非洲的人越来越多，但是真正沉下来做好业务的不多，很多人待两年就走了，给长期坚持的留下空间。”</p>\n  <p>以下是我们与廖旭辉的对话：</p>\n  <p><strong>1.初闯非洲做到行业前三</strong></p>\n  <p><strong>36氪：能否介绍一下，您赚到第一桶金的过程？</strong></p>\n  <p>廖旭辉：最早接触非洲是2000年前后，一位朋友派驻非洲，我在深圳帮他对接国内采购，发了几批货后我发现，这是个尚未被充分关注的市场，有巨大潜力。</p>\n  <p>2003年，我带着30万本金开始西非多哥的VCD批发生意。当时非洲是典型的卖方市场，一条20尺标准柜的货，国内采购成本30万元，到岸后能卖到60万元，扣完运费、清关等成本，单柜净利润近20万元。</p>\n  <p>2006年到2008年，我们的生意进入快速扩张期，从多哥陆续拓展到喀麦隆、坦桑尼亚等国，覆盖西非、中非、东非三大区域近20个国家。同期我们还推出了自有的家电品牌LEADDER，主打DVD、音箱等视听产品，只用三年就做到西非行业前三。</p>\n  <p><strong>36氪：打造自有品牌LEADDER阶段，你们是如何开展市场推广的？</strong></p>\n  <p>廖旭辉：不用搞那些高大上的，接地气最管用。</p>\n  <p>最早做品牌没钱投广告，我们就从本地人最熟悉的日常场景切入。比如批发市场的搬运工每天扛着货在市场里穿行，我们就给他们发印着品牌logo的T恤，让他们变成免费可移动的人形广告牌；我们还会给出租车司机送礼品，请他们把品牌贴纸贴在车身上，也是遍布全城的移动广告位。</p>\n  <p>当时非洲互联网普及率很低，连电视都谈不上普及，我们熟悉的投放线上广告、电视广告根本触达不到核心目标用户，反而是这种落地的传播方式效果最好。</p>\n  <p><strong>36氪：中国商家理解非洲市场时，最常见的误区是什么？</strong></p>\n  <p>廖旭辉：最普遍的误区是把非洲当成铁板一块的统一大市场。实际上拥有16亿人口的非洲是54个完全独立的市场，不存在一套方案打遍整个非洲的可能——很多商家连一个国家的市场都没摸透，就想着做全非洲的生意，必然会踩坑。</p>\n  <p>最直观的差异是产品标准：法殖民地国家用欧规两圆插头，英殖民地国家用英规三方插头，同一款电器插头不对，根本无法上架销售。消费偏好差异也很大：东非消费者更看重产品实用性，优先选择带USB读卡功能的机型；西非消费者则偏好功能齐全的产品，认为功能越多性价比越高。文化与宗教差异同样显著：北非、西非穆斯林人口占比高，东非则以基督徒为主，产品设计、营销内容都需要适配当地的文化宗教习惯。</p>\n  <p><strong>2.非洲电商布道者：市场教��逾10年</strong></p>\n  <p><strong>2008年您已经将自有品牌做到西非行业前三，为什么会选择转向做电商平台？</strong></p>\n  <p>廖旭辉：主要有三方面原因：我本身是中国最早一批接触电商的人，1998年就做过电商相关业务，对这个赛道比较敏感，当时国内电商行业快速发展，阿里即将上市，让我看到电商模式在非洲的可能性；二是2008年金融危机冲击了传统批发业务，线下批发生意增长遇到瓶颈；三是自有品牌业务和批发业务存在渠道冲突，经销商意见比较大，综合考虑下我们决定转型做线上平台。</p>\n  <p>但当时非洲做电商的基础条件差到超出想象：网络速率只有5K/S，打开一个网页需要几分钟，商品图根本加载不出来；电力供应极不稳定，一天要停三四次电，网络随时会中断；道路交通条件差，除了核心首都区域之外，大部分地区基本没有配送能力。</p>\n  <p>为了适配本地市场，我们做过很多现在看来很“笨”的尝试：开发离线商品数据库，让用户到线下门店把商品库下载到本地，选好商品后再回到门店同步订单；在大型批发市场自建WiFi站点，解决商户上网的问题。前前后后改了三版界面，投入了大量资金，踩了无数坑，最后总结出一句话：商业创新可以抢先一步，但不能抢先太多。<strong>如果布局太早，基础设施还没跟上，就很可能变成行业“先烈”。</strong>非洲电商真正开始起量也就是最近三五年的事，之前的十几年全是市场培育期，熬不住的玩家基本都退出了。</p>\n  <p><strong>36氪：除了网速、电力、道路这些基础设施问题，当时做电商还遇到了哪些困难？</strong></p>\n  <p>廖旭辉：最核心的死结是当地价格与到岸成本倒挂。一件国内售价9.9元人民币的T恤，跨境空运运到消费者手里的物流成本是15美元，物流成本比商品本身的价值还高——定价高了普通消费者买不起，定价低了必然亏损。这就让非洲跨境B2C形成了一个走不出去的死循环：消费能力过低与到岸成本过高的冲突短时间不会消失。</p>\n  <p>其次是退货成本高，跨境电商的平均退货率在20%—30%，退回的商品还要再承担一次跨境运费，只要发生退货基本就是亏损。</p>\n  <p><strong>36氪：现在非洲线上交易的规模是多大？</strong></p>\n  <p>廖旭辉：从整个非洲的零售结构来看，目前线上零售仅占社会零售总额的5%-8%，基本来自中高收入的年轻群体，剩下90%以上的交易仍然发生在线下，在批发市场、集市、商超、夫妻店、路边小商贩手里。如果做纯线上生意，相当于主动放弃了95%的市场空间，只抓住了规模最小、对服务最挑剔的一小部分用户，自然很难把规模做起来。</p>\n  <p><strong>36氪：纯线上不行的话，适合非洲的电商是什么样的？</strong></p>\n  <p>廖旭辉：我们踩了这么多年坑，发现在非洲卖货还是要做全渠道。<strong>我做了一套OSO的模式，也就是Online（线上商城）+Social（社交渠道）+Offline（线下门店）三者结合。</strong>其中线上端是官方商城，线下是合作的门店和网点；而Social端不只是Facebook、TikTok这类线上社交平台，还包括线下的社交场景——教堂、集市，我们给用户提供社交营销平台AMP（Amanbo Marketing Partner）。</p>\n  <p>这套模式的核心不是和线下商家抢生意，而是赋能线下商家：帮线下的流量做数字化沉淀，同时把线上的流量导到线下完成交付，这样的模式才能适配非洲的市场环境，能够长期跑通。</p>\n  <p>很多人问我，非洲未来会不会长出像中国淘宝、拼多多那样的电商平台？我觉得也许会，但绝对不是现在，还得等。等网速、电力这些基础设施再完善，等物流网络能铺到县城和乡镇，等普通人养成线上支付的习惯，等大众的消费能力再上一个台阶，这些都不是三五年能完全到位的。</p>\n  <p>我2009年就开始做纯线上电商，早了整整10年，花了很多钱做市场教育。现在如果还有人抱着“抄中国模式做非洲淘宝”的想法进来，大概率还是要当铺路石。商业是跟着市场阶段走的，不能跳步。先扎到线下做全渠道，跟着市场一起成长，等风口真来的时候，你已经在这扎根了，才能接住机会。</p>\n  <p><strong>36氪：对于现在想在非洲找机会的商家，Amanbo有什么服务可以提供？</strong><br />廖旭辉：基于对中非合作的综合判断以及AI对行业的冲击和影响，Amanbo正在调整我们的产品和服务策略。战略上，死磕非洲不变。策略上我们将顺应时代和技术潮流，最大限度免费对国内外用户开放Amanbo平台，整合国内外合作伙伴，以专业服务协助用户实现高效交付及本地化支持，同时提供金融产品（供应链金融、跨境结算、分期付款等），借此与用户、合作伙伴构建高粘性互动，共建AI时代背景下中非合作智慧大生态，让大家真正实现抱团出海，共创共赢，助力中非合作提质升级。<br />具体来说，除平台以外，从基本的中非商业知识普及、产品诊断到市场调研、商机验证、渠道建设到品牌出海、项目咨询、产业陪跑等，都可以找我们；Amanbo将不再是电商平台定位，而是基于Amanbo数字底座的中非合作综合服务平台。</p>\n  <p><strong>3.电商之外非洲还有更多机会</strong></p>\n  <p><strong>36氪：除了电商之外，非洲还有哪些机会？</strong></p>\n  <p>廖旭辉：不要一说到非洲就只想到电商，机会太多了。</p>\n  <p>未来5到10年，产业出海是大趋势。现在东南亚市场已经是红海，竞争非常激烈，而非洲16亿人口的市场竞争烈度低很多，还可以依托非洲大陆自贸区做转口贸易——自贸区覆盖54个国家，区域内贸易零关税，在一个国家设厂，产品可以无关税卖到整个非洲，市场空间非常大。</p>\n  <p>产业落地选址主要看几个维度：政治环境稳定、有自贸区政策支持、劳动力成本低、最好靠海有港口方便物流、接近客户或市场。目前产业聚集的主要区域包括北非的摩洛哥、埃及，东非的肯尼亚，西非的拉各斯、加纳以及南非等。</p>\n  <p>其次是进口贸易机会，现在非洲很多产品进入中国享受零关税政策：非洲的牛羊肉加工成牛肉干运到国内，成本比国内低很多，品质也不错；还有咖啡、可可、坚果、矿产这类资源品，非洲的品质高、价格低，运回国内竞争力很强。做非洲生意最好进出口双向布局，能够对冲汇率波动的风险，如果只做单边生意，一旦汇率下跌，赚的利润很容易被汇兑损失吃掉。</p>\n  <p>除此之外，传统贸易、品牌代理、本地分销、服务贸易、项目投资等很多赛道都还没有充分竞争，相对国内来说都是蓝海市场，非洲的机会从来不是只有电商这一条路。</p>\n  <p><strong>36氪：很多想去非洲的商家会对当地基础设施有顾虑，面对路不好、电不够、网也慢等现实问题，您怎么看？</strong></p>\n  <p>廖旭辉：我就说一句话：路都修好了，你还来干嘛？</p>\n  <p>等基础设施都完善了，本地企业成长起来，欧美大公司也都进场，哪里还有中小商家的机会？20年前的深圳不也是这样，要什么没什么，这和人种、文化没关系，就是发展阶段的问题，等发展到一定程度，这些问题自然会解决。</p>\n  <p>路不好需要修路，缺电需要建电站，网差需要铺网络，物流不畅需要做物流——每一个短板背后，都是实实在在的机会。<strong>你能解决多大的问题，就能拿到多大的市场。</strong>现在非洲刚好站在起飞的节点上，人口密度已经跨过了规模经济的门槛，市场开始启动，这个时候进场，刚好能赶上发展红利。</p>\n  <p><strong>36氪：除了基础设施，很多商家觉得非洲员工不好管理，甚至担心当地的安全问题，您怎么看这种刻板印象？</strong></p>\n  <p>廖旭辉：不是人的问题，是管理方式不对，核心是你得尊重本地人。</p>\n  <p>2005年多哥战乱，我们所有中国员工都撤到邻国避难，有个平时与我们相处不错的本地员工，冒着战乱的风险帮我们守了10个月仓库，一件货都没丢。</p>\n  <p>疫情的时候也是一样，很多靠中国人盯着的公司直接停摆，我们本土化做得早，90%以上都是本地员工，业务全靠他们扛，降低了很多损失和影响。</p>\n  <p><strong>36氪：对于现在想在非洲找机会的中小商家，您有什么具体的建议？</strong></p>\n  <p>廖旭辉：第一，先想明白你要干什么？贸易？电商？投资开厂？第二，再选国家和用户，再选品，选国家和用户比选品还重要，选对了事半功倍，选错了再努力也没用。第三，不要想当然，别拿国内经验直接套，有条件先去当地看看，了解清楚市场再动手。并且不要什么都自己来，尽可能本土化，用好当地人，相信当地人，但同时做好管控。第四，别只盯着电商，传统贸易、做品牌、建厂、做进口、做投资，都可以看看，机会很多。做跨境电商的话，别选太便宜太重的东西，物流成本扛不住，选点当地买不到的、有差异化的产品。第四，循序渐进，先小批量试销，跑通了再慢慢扩大，一上来就all in死得快。</p>", "category": "tech", "published_at": "2026-08-11T07:01:17+00:00", "fetched_at": "2026-08-12T01:26:56.984366+00:00", "fingerprint": "73988c18cd61700c"}, {"source": "36氪 - 最新文章", "title": "自研微米级工业具身机器人，已进入博世产线，「国奥科技」完成近亿元A+轮融资 | 36氪首发", "url": "https://36kr.com/p/3934853676088448?f=rss", "summary": "<p>2026年被业界视为“人形机器人量产元年”，然而数量扩张不等于产业成熟，部分企业仍停留在样机和演示阶段，商业化路径尚不清晰。</p>\n  <p>“现在3C大厂基本不会考虑使用泛化的人形机器人。”国奥科技创始人李思阳博士说。</p>\n  <p><strong>在他看来，产量与工业场景落地之间的鸿沟不是AI大模型不够强，而是本体的运动控制能力远远无法达到工业场景要求。</strong>“好比一个人的大脑已经发育到二十岁，身体还停留在三岁的水平。”</p>\n  <p>国奥科技正在尝试补齐这块短板。基于其自研多自由度电机（即同时实现直线和旋转运动的双自由度电机）生产的工业机器人，目前已销售给德国博世，并在多家头部大厂的产线上实现预运行。</p>\n  <p><strong>我们了解到，近期国奥科技刚刚完成近亿元A+轮融资，由深创投、基石资本、粤科金融投资。深创投也是去年6月A轮融资的老股东。资金将主要用于工业具身机器人量产及机器人BU组建。</strong></p>\n  <p>国奥科技成立于2019年，是工业自动化领域国产替代趋势下，凭借技术突破在行业打开市场的典型样本，目前已在「ZR电机」这一细分品类确立头部地位，产品进入国内某头部芯片企业、歌尔股份、舜宇光学等头部客户供应链。</p>\n  <p>为什么选择从精密电机走向机器人整机解决方案？“我们在成立之初就确立了不卖模组，直接做整机的目标。因为只有足够懂精密电机的公司，才能将本体的运动能力发挥到极致，让机器人真正到工厂里干活。”李思阳这样回答。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260811/v2_68a21a426d9e4f89a56a3dace6453868@5688585_oswg294478oswg1080oswg716_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国奥科技产品矩阵</p>\n  <h2><strong>1.围绕核心ZR电机技术，搭建多场景产品矩阵</strong></h2>\n  <p>精密电机是工业自动化的“心脏”，这一领域此前长期被海外厂商垄断。随着过去几年国产替代在工业自动化领域持续推进，国奥科技也在这一趋势下创立。</p>\n  <p>但海外电机厂商往往提供“电机+驱动器+控制算法”的一整套闭环解决方案，把硬件和算法一起售卖，因此整机厂商更换电机供应商的成本很高，替换动力天然不足。</p>\n  <p>“要让客户改用国产电机，不可能只靠便宜或者优化几个参数，必须实现指数级的性能提升。”<strong>李思阳表示，这种指数级级别的提升意味着要对电机的底层电磁结构进行重构。</strong></p>\n  <p>传统电机只能做旋转或直线一个维度的运动，因此需要两组电机加机械传动，实现Z轴升降加R轴旋转，不仅体积大、负载重，力控精度也受到限制。李思阳团队研究的多自由度电机则是在同一动子结构下，通过磁场变化同时实现直线和旋转运动，全部直驱、无机械传动，使电机在力控精度和ZR轴稳定性指标上实现关键突破。</p>\n  <p>半导体固晶机是国奥科技ZR电机最早实现国产替代的验证场景之一。据李思阳介绍，ZR电机进入固晶机取放头后，设备相比传统方案在精度、可靠性和效率上的参数都有3-5倍提升，整机制造成本反而降低。</p>\n  <p>ZR电机产品除了进入国内固晶机设备龙头新益昌，还批量供货长园半导体、科瑞技术、长川科技等多家国内知名封测设备厂。</p>\n  <p>过去一年，国奥科技围绕双自由度电机的底层技术，将产品向更多高价值工业场景延伸。<strong>目前产品矩阵分为核心部件和集成解决方案两大板块，前者是技术根基与营收基本盘，后者提供新的市场增长。</strong></p>\n  <p>核心部件以ZR电机标准品为主，覆盖半导体、3C等领域，服务歌尔股份、舜宇光学等几十家头部客户。李思阳表示，目前在ZR电机这一细分品类，国奥科技已成为市场认知中最先被想到的供应商。</p>\n  <p>集成解决方案则更接近汽车制造、工业机器人等终端客户，虽然当前对整体营收的贡献还不足10%，但从市场增长空间来看，是当前产品研发迭代的必然路径。</p>\n  <p>2026年4月，国奥科技发布全球首台搭载双自由度关节的工业级具身机器人「G-Tools」，在FAIR plus 2026机器人全产业链接会上成功抓取一根直径0.5mm的细针并精准穿过微孔，实现微米级定位精度（±2μm）与高精度力控（±0.05N）。</p>\n  <h2><strong>2.从电机核心供应商，到工业具身机器人领域的“ABB”</strong></h2>\n  <p>从商业化路径来看，国奥科技的策略是“从高往低打”。</p>\n  <p>“对初创公司而言，工业自动化行业并不容易进入，缺乏行业资源的前提下，产品从一开始就必须具备足够强的竞争力。”李思阳解释。</p>\n  <p>所以国奥科技选择先切入半导体行业，通过打造“半导体级”产品，并与国内某头部芯片企业等头部客户建立合作，在高精度、高可靠性的要求下完成产品验证和市场教育，建立起品牌信任度。</p>\n  <p>但半导体核心部件的市场容量有限，收入天花板明确。相比之下，以果链为代表的3C领域市场体量巨大，且技术指标要求相对宽松，因此国奥科技在半导体行业站稳脚跟后，“降维”进入竞争激烈的3C领域，通过大批量交付发挥规模效应，进一步摊薄整体成本。</p>\n  <p>李思阳介绍，国奥科技的电机产品已进入歌尔股份、舜宇光学等海外3C巨头企业供应链核心企业的产线，用于终端产品的制造和检测设备。</p>\n  <p>为更好把控3C等领域的量产交付质量和项目成本，国奥科技2024年在赣州布局第一个自有机加工厂和装配工厂，2025年中实现量产，目前产能为1800-2000台/月。接下来国奥科技计划在珠三角和长三角地区新增两家工厂，分别用于工业机器人与精密电机的研发与量产交付。</p>\n  <p>工业机器人是国奥科技正在攻克的下一个关键行业。<strong>与以往不同，这次国奥科技选择不做关节模组供应商，而是直接做整机。</strong>李思阳的考虑是，下游客户对电机的认知不足以发挥双自由度电机的全部优势。“如果对方不知道怎么用，我们的产品也发挥不了最大价值。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260811/v2_0b8edd7f26804b0e88b0d08e2c7ec9cc@5688585_oswg317186oswg860oswg516_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国奥科技工业机器人</p>\n  <p>事实上，做整机是李思阳从公司成立之初就确立的目标，“以前公司还太小，资金、团队都不足以支撑”。到了2026年，国奥科技预计年营收达到近亿元并实现盈利，团队规模也从去年的60人扩张至140人，“做整机的时机已经成熟。”</p>\n  <p><strong>“我们对标的不是optimus，而是ABB。”</strong>李思阳表示，国奥科技虽然也在机器人的运动控制上下功夫，但与当下主流的具身机器人公司走的是两条不同的路，不比拼机器人跳舞、跑步、叠衣服等泛化能力，而是以达到3C产线要求为目标。“先把一项能力做到工业级，再谈泛化才有意义。否则机器人大脑能力再强，本体也接不住，产品只能停在demo状态。”</p>\n  <p>为保持自身在多自由度电机技术上的竞争力，国奥科技已在香港设立研发中心，与香港理工大学共建先进电机实验室。李思阳还透露，团队此前在研发双自由度电机时，已同步储备球形电机技术。球形电机不局限于直线或旋转，可实现270-360度球面运动。</p>\n  <p>“一只机器人手臂最多需要三个球形电机，自由度和灵活度就可以超过现在的七轴机械手，<strong>我们认为会是机器人关节的终极解决方案，有可能在未来3-5年内走向市场。</strong>”李思阳判断。</p>", "category": "tech", "published_at": "2026-08-11T10:01:10+00:00", "fetched_at": "2026-08-12T01:26:56.984359+00:00", "fingerprint": "5955157ec0d58554"}, {"source": "36氪 - 最新文章", "title": "继Seed、Flow后，字节又成立一个AI一级部门，直指「数据」｜36氪独家", "url": "https://36kr.com/p/3934936980667776?f=rss", "summary": "<p>《智能涌现》从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI 数据与安全，与Seed、Flow、抖音等部门平行，负责人为王赢磊（Adam Wang）。</p>\n  <p>这是继2023年底成立Seed和<a href=\"https://36kr.com/p/2536362002884358\" rel=\"noopener noreferrer\" target=\"_blank\">Flow</a>两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。负责人王赢磊此前为TikTok平台责任负责人和TikTok直播负责人。“王赢磊负责的直播业务曾是TikTok最主要的营收来源之一，在字节内部有过赫赫战功。”一位接近字节的人士表示。</p>\n  <p>《智能涌现》就上述消息向字节求证，截止发稿，暂无回复。</p>\n  <p><strong>在模型、产品之后，字节这一次直指AI数据。</strong></p>\n  <p>据《智能涌现》了解，这个新部门的前身之一，是由TikTok创始团队成员傅越（花名 Yuyi）于2023年成立的数据团队Global Data，原来的规模在百人左右。这个精干的团队起初为 Dola（豆包海外版）、TikTok等国际业务服务，而后负责为Seed的模型训练做数据采购和质量管控。团队内部设有产品经理、数据工程、采购、质检运营、安全合规等多个职能。</p>\n  <p>除Global Data之外，AI数据与安全部门还整合了多个此前分散的 AI 数据部门，包括集团数据中台DMC，以及Flow下属的AI数据平台AIDP等团队人员。</p>\n  <p>多位知情人士对我们表示，这一部门的整合和正式成立从2026年6月初开始，而由于涉及多个部门整合，这些部门之间业务又多有重叠，当前字节还在不断梳理架构，优化人员。</p>\n  <p>数位接近该部门的人士告诉我们：<strong>整合后的新部门，会是一个横跨基座模型到业务团队的庞大数据团队，其核心职能是为字节所有大模型，提供跨模态的数据服务</strong>。<strong>团队的职责也覆盖数据生产全流程：标准制定、寻源采购、合成清洗、质量评测等。</strong></p>\n  <p>在7月底的Seed全员会上，久未露面的张一鸣表态：字节在大模型攻坚上“坚决不蒸馏”。而在8月5日的字节跳动全员会上，CEO梁汝波也表示：“字节大语言模型会坚定自研，做好基本功，接受短期落后，坚持优化长期，最重要的是动作不要变形。” 这些决定必将导向，在字节的大模型攻坚中，数据的重要性不断上升。</p>\n  <p>跳出字节，我们也看到全球AI行业正在发生结构性变化：当公开互联网数据被穷尽，模型竞争的核心变量正从算法和算力，转向真实世界的高质量数据。</p>\n  <h2>字节的庞大数据帝国</h2>\n  <p>字节在AI数据上的投入，在国内大厂中一直是最坚决的。</p>\n  <p>一个重要原因是，Seed从成立之初就定下了“不做蒸馏”的原则。字节在几乎所有模型上的目标都是达到全球第一梯队甚至SOTA，这是通过蒸馏难以达到的。如果所有数据都要靠自己合成、采买、清洗，势必需要一个庞大的团队来支持。</p>\n  <p>这个团队有多庞大？<a href=\"https://36kr.com/p/3885177884078083\" rel=\"noopener noreferrer\" target=\"_blank\">《智能涌现》曾独家报道</a>，在字节内部，仅为Seedance做模型数据评测的团队就有上千人。每一位Seedance算法工程师的背后，往往都配着十余位数据同事做支持。</p>\n  <p>与之形成对比的是，很多视频领域赛道的头部创业公司，内部评测团队达到数十人就已经算比较大的投入。而Seedance 2.0的成功，也被多位从业者称为“一场数据的胜利”。</p>\n  <p>这让字节更加坚定了对数据的投入。</p>\n  <p>首先是预算层面。<a href=\"https://36kr.com/user/5783683\" rel=\"noopener noreferrer\" target=\"_blank\">《智能涌现》曾独家报道</a>，在世界模型和Coding模型的训练上，字节2026年初的数据预算已超过千万美元级别，并且“如果觉得不够，可以随时追加预算”。</p>\n  <p>《智能涌现》还了解到，目前字节数据团队也已经采取赛马机制，团队内部按方向划分——世界模型、代码、高难学科等。在如今模型的商业逻辑日渐清晰的背景下，字节的每个数据项目，也需要核算ROI。</p>\n  <p>字节之外，各大厂都在加强数据投入。从去年开始真正发力大模型的腾讯，近半年来频繁以高达三倍的薪资从字节的数据团队挖人。</p>\n  <p>阿里、腾讯在数据采购上的预算都有明显增长，且不断加码投资。一位数据行业人士告诉《智能涌现》，大厂目前都有一定的数据排他策略，比如设定数据集独家期限、或阶段性买断供应商核心人员。</p>\n  <p>“数据是当下大模型竞争中最具决定性的变量。”这已经成为大语言模型、具身智能、世界模型、AI4S等几乎所有明星细分方向上的共识。</p>\n  <p>但是，2026年的数据市场现状是，AI公司需求旺盛，从预训练到后训练，都面临高质量数据供给稀缺的瓶颈。</p>\n  <p>对字节而言，接下来的挑战是如何让一个千人规模的数据组织，仍然能够快速响应模型前沿的变化。毕竟，在模型能力边界还在快速变化的阶段，今天最稀缺的数据，在半年后可能就会失去价值。</p>\n  <h2>全球模型竞争都走向数据军备赛</h2>\n  <p>过去一年里，全球的大模型攻坚都面临一个趋势：在推理范式缓慢收敛的前提下，算法架构带来的能力提升趋缓。<strong>数据已经成为决定模型能力上限最重要的变量，甚至没有之一。</strong></p>\n  <p>跟字节等中国大厂相比，海外大模型公司对于数据的投入还要高出数倍。<strong>硅谷头部大模型公司的外部数据预算正在以每年数十亿美元的量级快速膨胀。</strong>比如Anthropic，仅在2025年就为RL数据拨出了超过10亿美元的预算。</p>\n  <p>这使得数据成为了 2026 年硅谷增长最快的赛道之一。最典型的是硅谷明星公司Mercor，年化收入从去年的5亿美元涨到今年年中的20亿美元，其中91%来自OpenAI、Anthropic等头部模型公司，估值则飞涨至200亿美元，这家公司成立仅三年。</p>\n  <p>为什么数据突然变得如此重要？根本原因在于，互联网上的公开数据几乎已经被穷尽。</p>\n  <p>过去三年，模型训练所需的数据经历了从公域到私域的转变。公开的互联网中有大量的报告、文档，但缺少人类如何产出这些结果的过程，比如如何理解模糊的意图、寻找上下文、犯错和修正。</p>\n  <p>比如，在Coding之外，还有医生、律师、科研等高精尖领域任务，通用模型还没有解决得很好。当模型要提升能力，像真实专家一样工作时，它还需要大量自然产生的“过程数据”。这些数据往往藏在真实的工作流程里，比如企业内部沉淀的代码库、员工日常操作留下的痕迹等等。</p>\n  <p>AI所需的数据，正在从公域转向了私域。而大量私域数据的采集，成了大模型公司新的争夺点。</p>", "category": "tech", "published_at": "2026-08-11T10:36:54+00:00", "fetched_at": "2026-08-12T01:26:56.984352+00:00", "fingerprint": "69ee2d849c887647"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域；两大能源央企参投宇树科技；入职未满一年，OpenAI伦理负责人宣布离职", "url": "https://36kr.com/p/3935139481631880?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>广聚能源：上修半年度业绩预告，上半年净利润同比预增603.02%—635.24%</strong><br />36氪获悉，广聚能源发布2026年半年度业绩预告修正公告，修正后公司预计2026年半年度归属于上市公司股东的净利润为6555.96万元—6856.42万元，同比增长603.02%—635.24%。修正原因为公司持有参股企业妈湾电力14.42%股权，于二季度末确认2025年度分红事宜，增加公司报告期投资收益4039.04万元，相应增加报告期归属于上市公司股东的净利润4039.04万元。公司以前年度一般于第三季度或第四季度确认妈湾电力投资收益，该事项系参股企业分红决议提前，不属于非经常性损益。</p>\n  <p><strong>报道称SK海力士重启中国NAND闪存生产基地2号工厂建设，将产能扩大约50%</strong></p>\n  <p>据报道，SK海力士重启了中国大连NAND闪存生产基地2号工厂的建设，将产能扩大约50%。大连2号工厂于4年前动工，但受存储器行业低迷影响，工程长期处于停滞状态。SK海力士计划在今年年底前引入半导体生产设备，并于明年上半年正式投产。 （中新经纬）</p>\n  <p><strong>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</strong><br />从招聘土木工程人才，到大手笔布局智算中心，AI正在推动科技公司的资产边界向土地、电力和数据中心延伸。近期，DeepSeek官网出现一则招聘信息，其中称“每一代人都会遇到属于自己的基础设施革命”，在职位要求中，电气、暖通、环境、土木等均被列为符合需求的专业。DeepSeek的这一动作释放出一个微妙信号：过去主要依靠外部算力资源的模型公司，开始向算力基础设施更深处延伸。（第一财经）</p>\n  <p><strong>冬海集团二季度营收同比增长48.1%至77.88亿美元</strong></p>\n  <p>Shopee母公司冬海集团8月11日公布了截至2026年6月30日的第二季度财务业绩。公司本季度实现GAAP营业收入77.88亿美元，同比增长48.1%；毛利润达35.50亿美元，同比增长47.3%；净利润达4.58亿美元，同比增长10.6%；调整后EBITDA为9.17亿美元，同样实现了10.6%的同比增长。（界面）<br /><strong>两大能源央企参投宇树科技</strong></p>\n  <p>锁定A股“具身智能第一股”，8月10日，宇树科技股份有限公司正式开启申购，其中中国石油集团昆仑资本有限公司和南方电网产融控股集团有限公司双双现身战略配售名单，引起市场关注。据了解，此次发行采用战略配售、网下发行与网上发行相结合的方式，战略配售总量808.93万股，占发行量的20%。昆仑资本和南网产融作为“与发行人经营业务具有战略合作关系或长期合作愿景的大型企业或其下属企业”参投，获配股数均为90.329万股，各获配约1.36亿元，锁定期12个月。（中国电力报）<br /><br /><strong>AI算力引爆，24只概念股上半年净利润预增</strong></p>\n  <p>人工智能算力需求爆发式增长，多家海内外巨头计划大幅提升数据中心产能。据统计，A股布局数据中心产业链的概念股超过百只，今日城地香江、杭钢股份涨停，盛弘股份上涨12.92%，旭光电子、铜牛信息等涨幅居前。从业绩上来看，45只概念股已公布半年度业绩相关公告。按半年报、业绩快报、业绩预告净利润下限顺序统计，4股上半年扭亏为盈，2股同比减亏，24股归母净利润实现同比增长，其中利通电子、富瀚微增幅均在1000%以上。（证券时报）</p>\n  <p><strong>字节跳动新成立AI数据与安全部门，与Seed、Flow、抖音等部门平行</strong><br />36氪从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI数据与安全，与Seed、Flow、抖音等部门平行，负责人为王赢磊（Adam Wang）。这是继2023年底成立Seed和Flow两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。负责人王赢磊此前为TikTok平台责任负责人和TikTok直播负责人。</p>\n  <p><strong>曝字节Seed AI数据安全负责人将离职，官方暂无回应</strong><br />据市场消息，字节Seed AI数据与安全负责人傅越（Yuyi）将于近期离职，其职位将由TikTok平台责任团队负责人、原TikTok直播负责人王赢磊（Adam Wang）接任。对此消息，字节方面暂无官方回应。消息称，傅越在字节Seed直接汇报给吴永辉，之前负责Global Data，目前是AI数据与安全的一号位。（新浪科技）</p>\n  <p><strong>消息称谷歌DeepMind求职者可填特殊表，绕过AI简历筛选</strong></p>\n  <p>有消息称，谷歌DeepMind AGI安全与协调团队鼓励公司求职者在提交常规申请的同时，额外填写一份特殊表格，以规避简历被公司内部人工智能系统筛除的风险。有业内人士指出AI招聘工具尚处早期阶段，实现招聘全自动化愿景任重道远。（财联社）</p>\n  <p><strong>阅文集团：上半年短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多</strong></p>\n  <p>8月11日，阅文集团发布2026年中期业绩报告。报告显示，上半年阅文集团收入达35.3亿元，同比增长10.7%。上半年阅文GMV达7.8亿元，同比增长60%；短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多；IP版权收入达16.1亿元，同比增长41.9%。</p>\n  <p><strong>康师傅控股：2026年上半年营收405.4亿元人民币，同比增长1.1%</strong></p>\n  <p>36氪获悉，康师傅控股在港交所公告，上半年营收405.4亿元人民币，同比增长1.1%；公司股东应占经调整溢利24.3亿元人民币，同比上涨15.2%。</p>\n  <p><strong>现代汽车工人本周将举行为期四天的部分罢工</strong><br />现代汽车工会周二表示，由于未能与管理层就薪资问题达成协议，本周将举行为期四天的部分罢工。该汽车制造商的工会称，决定于周三和周四进行四小时罢工，并在周五和周日举行六小时罢工。上个月，现代汽车工会已进行了总计30小时的部分罢工，并拒绝在四个周六执行特殊班次，导致预估生产损失约42510辆。（新浪财经）</p>\n  <p><strong>扎克伯格：Meta将推动“个人超级智能”普及，反对AI能力集中于少数机构</strong><br />当地时间8月10日，Meta首席执行官马克·扎克伯格发布长文《未来属于所有人》，表示Meta将推动“个人超级智能”普及，并继续支持开放源代码AI模型。他称，开放模型有助于避免AI能力过度集中，让更多个人和企业获得先进AI工具。扎克伯格表示，当前开放源代码生态“强大”，限制开源AI将导致AI进一步集中化，不利于安全和经济发展。他透露，Meta超级智能实验室已启动，未来将恢复发布部分开源模型。在谈及AI模型训练中的蒸馏技术时，扎克伯格表示，模型从其他模型中学习是开源生态的重要原则，不应将蒸馏简单视为有害行为。（界面）</p>\n  <p><strong>入职未满一年，OpenAI伦理负责人宣布离职</strong><br />随着外界愈发审视OpenAI的人工智能模型研发方式，已有多名安全研究人员相继离职；在此背景下，OpenAI伦理事务主管克洛伊・巴卡拉尔入职未满一年便选择离开这家初创企业。此次离职是近几周OpenAI接连发生的多起备受关注的高管离任事件之一，一同离开的还有安全系统主管约翰内斯・海德克、首席未来学家、前目标对齐负责人约书亚・阿基阿姆。（新浪财经）</p>\n  <p><strong>韩国总统李在明呼吁对量子计算等未来产业进行大规模战略投资</strong></p>\n  <p>韩国总统李在明周二在内阁会议上呼吁对未来产业进行大规模战略投资，包括小型模块化反应堆（SMR）、可再生能源和航空航天，重申了他推动韩国工业实力发展的承诺。李在明提到，小型模块化反应堆、可再生能源、量子计算、航空航天和先进生物学是未来行业中将决定全球领导地位的关键领域。对这些领域的战略投资应与对半导体和人工智能等大型项目的投资一样彻底和密集地推进。（财联社）<br /><br /><strong>智谱ZCode用户突破100万，推出四项新功能</strong><br />8月11日，记者获悉，智谱AI编程产品ZCode宣布全面升级，Goal、Subagents、Remote Control及闲时任务正式上线，推动Coding Agent从对话辅助走向复杂任务自主交付。ZCode用户数已突破100万。（证券时报）<br /><br /><strong>腾讯WorkBuddy升级多端同步能力</strong><br />36氪获悉，腾讯WorkBuddy宣布升级多端同步功能，实现了PC、App、小程序三端的任务、对话记录与产物的实时同步，并支持手机上远程对电脑端任务进行授权与停止。</p>\n  <h2>投融资：</h2>\n  <p><strong>“寻明生科”再获总额1亿美金的B系列融资</strong><br />36氪获悉，近日“寻明生科”再获总额1亿美金的B系列融资。首轮由Granite Asia（前身为纪源资本GGV亚洲业务）独家投资；后续轮次由产业投资人领投，弘晖基金跟投，启明创投、经纬创投及纽尔利资本等老股东追加。距离公司披露3500万美元A+轮融资，仅过去3个多月。</p>\n  <h2>新产品：</h2>\n  <p><strong>知情人士：微软计划明年大幅增产下一代AI芯片</strong><br />两名熟知相关规划的知情人士透露，微软计划在明年大幅增产自研下一代人工智能芯片，希望以此吸引Anthropic等大型云服务商客户采用自家芯片。当前一代自研芯片Maia 200市场接受度偏低，但微软仍推进扩产计划。其中一位知情人士称，微软计划今年秋季对外正式发布全新Maia 300芯片，最快下月即可亮相。另一名知情人士表示，这家云计算巨头已与芯片代工厂台积电洽谈，锁定30万片以上Maia 300的代工产能，交付时间定在2027年；该订单规模远超微软迄今为止量产的数万片Maia 200。（新浪财经）</p>\n  <h2>今日观点：</h2>\n  <p><strong>京投发展：公司股票价格短期涨幅较大，可能存在非理性炒作风险</strong><br />36氪获悉，京投发展公告，公司股票于8月10日、8月11日连续两个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。截至公告披露日，除公司已披露的筹划重大资产出售暨关联交易事项、筹划购买资产暨关联交易事项外，不存在其他应披露而未披露的重大事项和风险事项。鉴于公司股票价格短期涨幅较大，可能存在非理性炒作风险，公司敬请广大投资者注意二级市场交易风险，理性决策，审慎投资。<br /><strong>但斌回应投资人质疑：东方港湾在7月深度回调中没有大幅减仓，仅极小比例结构性微调</strong></p>\n  <p>36氪获悉，东方港湾董事长但斌回应投资人质疑，长江东方港湾2号目前依旧保持满仓状态，在7月本轮深度回调之前，该基金重仓AI产业链标的，一路坚持、未做大规模减仓，本轮跟随AI赛道出现了较大幅度回撤。东方港湾在2023年把握了英伟达为代表的全球AI核心机会，对A股本土AI产业链的布局启动偏晚，直到2026年才全面全力以赴重仓。本轮7月大跌行情中，东方港湾没有恐慌割肉、没有大幅减仓，仅做了极小比例的结构性微调。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>上半年中国人形机器人出货量占全球97%</strong><br />据彭博社10日报道，一份最新行业研究报告显示，2026年上半年，中国人形机器人制造商出货量占据了全球97%以上市场份额。美国加州研究公司Smart Analytics Global（SAG）的数据显示，今年上半年，全球人形机器人出货量总计约1.91万台，是去年同期5100台的三倍多。市场份额方面，总部位于上海的智元机器人超越了总部位于杭州的宇树科技，夺得第一。今年上半年，智元机器人出货量为8400台，占全球出货量的44%，而宇树科技的出货量为5900台，市场份额占比31%。这两家公司的出货量均远超特斯拉、Figure AI和Agility Robotics等美国头部人形机器人企业。（央视财经）</p>\n  <p><strong>2026年度电影票房突破245亿元</strong><br />据网络平台数据，截至8月11日，2026年度电影总票房（含预售）突破245亿元，《飞驰人生3》《功夫女足》《给阿嬷的情书》暂列2026年度电影票房榜前三。（央视财经）</p>", "category": "tech", "published_at": "2026-08-11T13:26:26+00:00", "fetched_at": "2026-08-12T01:26:56.984343+00:00", "fingerprint": "b4d562dee161583a"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨最高套现166亿，李嘉诚又卖海外资产；宇树科技中签结果出炉；胖东来公布“委屈奖”，3名员工共获补偿7万元", "url": "https://36kr.com/p/3935774730878341?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</li>\n   <li>英伟达牵头5000亿美元融资大单</li>\n   <li>Meta遭1.4万亿美元天价索赔，几乎等同其全部市值</li>\n   <li>腾讯WorkBuddy升级多端同步能力</li>\n   <li>为确保世锦赛期间不被猴子干扰比赛，印度羽协将聘请驯猴师入驻赛事场馆</li>\n   <li>董明珠：自己是靠产品成为“网红”</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>最高套现166亿，李嘉诚又卖海外资产</strong></p>\n  <p>继今年年初高位脱手英国核心电网资产之后，李嘉诚旗下长和系再度推进海外成熟基建资产变现。8月11日，据财联社，李嘉诚家族旗下旗舰基建平台长江基建集团(01038.HK)已委托摩根士丹利与巴克莱银行，正式开启澳大利亚分布式能源企业EDL Energy的控股权售卖流程，项目估值区间介于20亿至30亿澳元（约合110.8亿至 166.6 亿港元）。按照交易时间表，竞标机构需要在9月提交无约束力的初步报价，公司计划于今年年底之前敲定正式转让协议。若本次EDL Energy成功易手，这将成为李嘉诚家族今年以来在澳洲市场最大的一笔资产处置交易。对于这笔潜在交易，长建方面尚未作出回应。(每日经济新闻、财联社）</p>\n  <p><strong>宇树科技中签结果出炉</strong></p>\n  <p>8月11日，宇树科技公告称，中签号码共有19414个，每个中签号码只能认购500股宇树科技A股股票。宇树科技此次科创板IPO发行价为150.80元/股，中一签（500股）需缴款7.54万元。</p>\n  <p>8月11日晚间，宇树科技网上网下中签结果出炉，网上中签比例0.01809759%，在今年已上市的93只新股中，中签率偏低；网下投资者的配售比例为0.03341824%，今年有网下打新的46只上市新股中位居第六位。截至目前，今年网上中签率最高的新股为长鑫科技，为0.47141739%。宇树科技的网上中签占长鑫科技的3.8%，小于1/26；网下中签占长鑫科技的19%，小于1/5。（中新经纬、第一财经）</p>\n  <p><strong>胖东来公布“委屈奖”，3名员工共获补偿7万元</strong></p>\n  <p>8月10日，胖东来官方账号公布了两起侵犯员工人格尊严的典型案例。被侵犯的3位员工，其中两位分别获得1万元，一位获得5万元补偿。目前，其中一起涉及精神疾病患者的案件已进入民事诉讼程序。数据显示，2025年全年，胖东来侵犯人格尊严补偿奖共发放39.2万元，共36例。</p>\n  <p>胖东来在公示中公司明确表示，对任何侵犯人格尊严的行为，将按照补偿标准对受侵犯人员进行补偿和关怀，同时坚决通过法律途径维权，不接受任何形式的调解、和解。（财闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Manus将恢复独立运营</strong></p>\n  <p>8月11日，Manus发布《致Manus用户的一封信》。Manus表示，即将恢复以独立公司的形式运营，作为恢复独立运营的一部分，同时为遵守特定司法辖区的监管要求，部分用户在2025年12月29日当天或之后产生的数据，将于2026年8月23日08:00起至8月24日期间（SGT）被删除。受影响的用户可以从现在起至2026年8月23日07:59（SGT）备份数据，并可从2026年8月25日08:00（SGT）起恢复数据。在此期间，未受影响的用户可以照常使用Manus，无需采取任何行动。（界面新闻）</p>\n  <p><strong>入职未满一年，OpenAI伦理负责人宣布离职</strong></p>\n  <p>随着外界愈发审视OpenAI的人工智能模型研发方式，已有多名安全研究人员相继离职；在此背景下，OpenAI伦理事务主管克洛伊・巴卡拉尔入职未满一年便选择离开这家初创企业。此次离职是近几周OpenAI接连发生的多起备受关注的高管离任事件之一，一同离开的还有安全系统主管约翰内斯・海德克、首席未来学家、前目标对齐负责人约书亚・阿基阿姆。（新浪财经）</p>\n  <p><strong>英伟达据悉开发万亿参数开源AI模型Nemotron 4，欲挑战顶级开源模型</strong></p>\n  <p>据报道，英伟达正在开发新一代开源人工智能模型Nemotron 4，预计参数规模至少达到1万亿，目标是与全球领先的开源大模型竞争。英伟达希望通过开放模型生态扩大AI应用范围，并进一步推动市场对其GPU算力的需求。英伟达此前已推出Nemotron系列开源模型，包括拥有3400亿参数的Nemotron-4 340B系列，主要用于大语言模型训练数据生成、模型开发和企业AI应用。（界面新闻）</p>\n  <p><strong>腾讯WorkBuddy升级多端同步能力</strong></p>\n  <p>36氪获悉，腾讯WorkBuddy宣布升级多端同步功能，实现了PC、App、小程序三端的任务、对话记录与产物的实时同步，并支持手机上远程对电脑端任务进行授权与停止。</p>\n  <p><strong>扎克伯格：Meta将推动“个人超级智能”普及，反对AI能力集中于少数机构</strong></p>\n  <p>当地时间8月10日，Meta首席执行官马克·扎克伯格发布长文《未来属于所有人》，表示Meta将推动“个人超级智能”普及，并继续支持开放源代码AI模型。他称，开放模型有助于避免AI能力过度集中，让更多个人和企业获得先进AI工具。扎克伯格表示，当前开放源代码生态“强大”，限制开源AI将导致AI进一步集中化，不利于安全和经济发展。他透露，Meta超级智能实验室已启动，未来将恢复发布部分开源模型。在谈及AI模型训练中的蒸馏技术时，扎克伯格表示，模型从其他模型中学习是开源生态的重要原则，不应将蒸馏简单视为有害行为。（界面新闻）</p>\n  <h2>大公司/大新闻</h2>\n  <p><strong>字节跳动新成立AI数据与安全部门，与Seed、Flow、抖音等部门并行</strong></p>\n  <p>36氪从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI数据与安全，与Seed、Flow、抖音等部门串联，负责人为王赢磊（Adam Wang）。这是接着负责负责2023年底成立Seed和Flow两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。人王赢磊接下来为TikTok平台责任负责人和TikTok直播人。</p>\n  <p><strong>7月销量前十仅一款燃油车</strong></p>\n  <p>尽管丰田在中国销量一路下滑，但在刚刚过去的7月，卡罗拉锐放却成为销量前十中唯一的燃油车。懂车帝援引的乘联分会数据显示，7月乘用车零售销量前十榜单中，丰田卡罗拉锐放以14510辆的成绩位列第八，较上月排名大幅上升了28个名次。其余九席全部被新能源车型占据。</p>\n  <p>吉利星愿以32306辆夺冠，零跑A10以26424辆位列第二、特斯拉Model Y以25158辆排名第三。特斯拉Model Y也是销量前十中单价最高的车型，官方指导价26.35万~31.35万元。（第一财经）</p>\n  <p><strong>英伟达牵头5000亿美元融资大单</strong></p>\n  <p>最新消息显示，全球最大的一批金融巨头正与英伟达合作，筹集5000亿美元资金用于人工智能基础设施建设——这将成为华尔街迄今规模最为庞大的贷款行动之一。多位了解相关谈判情况的人士透露，阿波罗全球管理、黑石集团、贝莱德、博枫资产管理、高盛、KKR在内的财团将与英伟达建立合作关系，共同投资人工智能（AI）基础设施建设。知情人士称，这项交易最早可能于日内晚些时候宣布。这项潜在的合作凸显出，英伟达正越来越积极地为自身及客户筹集资金，以继续建设支撑当前AI热潮的芯片、供电设施和数据中心。（财联社）</p>\n  <p><strong>游戏科学杨奇回应《黑神话：钟馗》进度：暂不用AI，坚持“手搓”</strong></p>\n  <p>8月10日，游戏科学联合创始人、《黑神话》系列美术总监杨奇在社交平台分享团队新作研发思路，明确现阶段正在开发的《黑神话：钟馗》，将会在设计、游戏资产制作环节主动避开AIGC生成式工具。事件起因源自杨奇分享的观影感悟，他在自己微博账号发贴，称诺兰全新影片《奥德赛》是“史诗电影的标准答案，深受启发”。随后有网友在评论区提问“AI能否加快研发”，杨奇回应，设计和资产阶段会远离aigc，但并非抵触AI，他以诺兰仍用传统技术拍摄新片为例称，“没有什么末班车是非赶不可的”，未来使用AI仍有充足时间。（界面新闻）</p>\n  <p><strong>董明珠：自己是靠产品成为“网红”</strong></p>\n  <p>8月10日，格力电器举行2026届毕业生入职仪式。据格力电器透露，2026年吸呐380多所高校优秀毕业生共计6514人。董明珠出席入职仪式并发表讲话。董明珠表示，格力多年来持续大规模招收应届毕业生，是源于对自主人才培养路线的坚守。当前市场环境下部分企业出现裁员等情况，但格力始终坚守不裁员承诺，将全方位呵护青年成长。在讲话中董明珠还提及自己被认为是“网红”，她回应到，自己并不是靠社交平台，花钱打造出来的“网红”，而是依靠格力的好产品而成为“网红”，企业的使命也不是只有赚钱，更要有创造美好生活的梦想。（第一财经）</p>\n  <p><strong>足坛球星年薪榜：C罗19亿元断层领跑，本泽马、姆巴佩分列第二、第三</strong></p>\n  <p>近日，Capology发布的足坛球星年薪榜，C罗以2.119亿英镑（折合人民币19亿元）的年薪断层领跑，第二名本泽马1.292亿镑，第三名姆巴佩6050万镑。C罗的2.119亿镑年薪由固定薪资、进球奖金（每球约8万英镑）、助攻奖金（每球约4万英镑）以及联赛/亚冠夺冠奖金（分别约1100万和900万美元）等浮动条款组成。（湖北日报）</p>\n  <p><strong>为确保世锦赛期间不被猴子干扰比赛，印度羽协将聘请驯猴师入驻赛事场馆</strong></p>\n  <p>2026年世界羽毛球锦标赛将于‌8月17日至23日‌在‌印度新德里‌的英迪拉·甘地体育馆举行。为确保本届世锦赛进行期间不被猴子干扰，赛事组委会特意邀请了一批能够模仿长尾叶猴叫声的驯猴师作为工作人员。今年早些时候在英迪拉·甘地体育馆举办的羽毛球印度公开赛期间，一只恒河猴就出现在了观众席，不由得让外界质疑起印度的办赛能力。在印度，恒河猴泛滥成灾，它们经常闯入建筑物，袭击毫无防备的行人或居民。为了避免遭受恒河猴的侵扰，印度人选择将体型更大的长尾叶猴安置在建筑物内，以此驱赶恒河猴。（体坛周报）</p>\n  <p><strong>巨力索具需补税及滞纳金702万元</strong></p>\n  <p>8月10日，演员杨子家族旗下上市公司巨力索具发布公告称，公司近期根据税务机关要求，对涉税事项开展自查，经自查，公司需补缴税费677.85万元、滞纳金24.47万元，税费及滞纳金合计702.32万元。巨力索具称，本次补缴税款事项不涉及行政处罚。公司将按照税务机关要求及时补缴税款、滞纳金。8月11日，巨力索具股价开盘后一度跌超4%，截至收盘，跌幅收窄至2.97%，报8.16元/股，最新市值约78亿元。（第一财经）</p>\n  <p><strong>Meta遭1.4万亿美元天价索赔，几乎等同其全部市值</strong></p>\n  <p>8月10日，据央视网报道，脸书母公司Meta本周将再次站上联邦法庭被告席。8月12日，由加利福尼亚州、科罗拉多州、肯塔基州和新泽西州四州联合提起的诉讼将在加州奥克兰联邦法院启动陪审团筛选程序，检方指控Meta旗下社交媒体平台成瘾性设计对未成年人造成伤害，向其索赔高达1.4万亿美元。这一数字几乎与Meta当前的总市值持平，创下全球消费者保护领域诉讼的最高索赔纪录。（央视网）</p>\n  <p><strong>芝商所将扩大白银期货24小时交易，继黄金期货焦点后进一步拓展贵金属交易</strong></p>\n  <p>8月11日，芝加哥商品交易所集团宣布，计划自9月11日起在获得监管批准后，将24小时交易服务扩展至100盎司白银期货合约。昨天，芝商所已于7月24日推出1盎司黄金期货24小时交易，周末交易额累计超过2亿美元。芝商所称，白银兼具贵金属和工业金属属性，能够帮助投资者应对宏观经济变化和需求出现。（界面新闻）</p>\n  <p><strong>苹果仍计划明年推出20周年全玻璃iPhone机型</strong></p>\n  <p>知名科技记者马克·古尔曼8月10日发文称，知情人士透露，苹果公司并未改变产品路线图，仍计划明年推出纪念iPhone问世20周年的全玻璃旗舰机型。杰富瑞分析师10日早些时候将苹果评级从“持有”下调至“跑输大市”，下调依据来自供应链调查——结果显示，苹果原定于2027年9月推出的全玻璃iPhone因“生产良率过低”已被叫停。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，8月11日收盘，美股三大指数集体下跌，道指跌0.34%，纳指跌0.6%，标普500指数跌0.32%。大型科技股多数下跌，SpaceX、谷歌跌超3%，亚马逊跌超2%，奈飞、苹果跌超1%，微软、英伟达小幅下跌；特斯拉、Meta小幅上涨。热门中概股普跌，腾讯音乐跌超11%，哔哩哔哩跌超5%，京东、网易跌超4%，阿里巴巴、富途控股、百度跌超3%，拼多多跌超2%。</p>\n  <p><strong>上半年中国人形机器人出货量占全球97%</strong></p>\n  <p>近日，一份最新行业研究报告显示，2026年上半年，中国人形机器人制造商出货量占据了全球97%以上市场份额。美国加州研究公司Smart Analytics Global（SAG）的数据显示，今年上半年，全球人形机器人出货量总计约1.91万台，是去年同期5100台的三倍多。市场份额方面，总部位于上海的智元机器人超越了总部位于杭州的宇树科技，夺得第一。今年上半年，智元机器人出货量为8400台，占全球出货量的44%，而宇树科技的出货量为5900台，市场份额占比31%。这两家公司的出货量均远超特斯拉、Figure AI和Agility Robotics等美国头部人形机器人企业。（央视财经）</p>\n  <p><strong>越南VinSpace与SpaceX签署协议，计划明年二季度实现卫星发射入轨</strong></p>\n  <p>越南企业集团Vingroup当地时间8月11日宣布，旗下成员公司VinSpace与SpaceX签署卫星发射合同。根据协议，VinSpace的卫星将于明年二季度通过SpaceX的Transporter Rideshare计划发射入轨。声明称，通过该协议，VinSpace将测试自主研发的卫星模块，并逐步提升在卫星系统管理和未来商业应用方面的能力。（界面新闻）</p>\n  <p><strong>美联储鹰派释放强硬信号：一次加息还不够</strong></p>\n  <p>克利夫兰联储主席贝丝·哈马克（Beth Hammack）表示，美联储可能需要多次加息，才能推动通胀率降至央行2%的目标水平。当地时间周一（8月10日），哈马克在接受采访时表示：“总体而言，我认为一次25个基点的加息可能不会对经济产生太大影响。因此，可能需要进行若干次加息。”但她补充称，“我不希望预先判断这个数字究竟是多少。”两周前，美联储宣布将联邦基金利率目标区间维持在3.5%至3.75%之间不变，当时包括哈马克在内的三位委员投下了反对票，三人倾向于在会议上加息25个基点。（财联社）</p>\n  <p><strong>报道称SK海力士重启中国NAND闪存生产基地2号工厂建设，将产能扩大约50%</strong></p>\n  <p>据报道，SK海力士重启了中国大连NAND闪存生产基地2号工厂的建设，将产能扩大约50%。大连2号工厂于4年前动工，但受存储器行业低迷影响，工程长期处于停滞状态。SK海力士计划在今年年底前引入半导体生产设备，并于明年上半年正式投产。（中新经纬）</p>\n  <p><strong>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</strong></p>\n  <p>从招聘土木工程人才，到大手笔布局智算中心，AI正在推动科技公司的资产边界向土地、电力和数据中心延伸。近期，DeepSeek官网出现一则招聘信息，其中称“每一代人都会遇到属于自己的基础设施革命”，在职位要求中，电气、暖通、环境、土木等均被列为符合需求的专业。DeepSeek的这一动作释放出一个微妙信号：过去主要依靠外部算力资源的模型公司，开始向算力基础设施更深处延伸。（第一财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>昆仑万维：筹划发行H股股票并在香港联交所主板上市</strong></p>\n  <p>36氪获悉，昆仑万维公告，公司计划发行境外上市外资股（H股）股票并申请在香港联交所主板挂牌上市。截至目前，公司正积极与相关中介机构就本次发行并上市的相关工作进行商讨，除本次董事会审议通过的相关议案外，其他关于本次发行并上市的具体细节尚未确定。</p>\n  <h2>投融资</h2>\n  <p><strong>“寻明生科”再获总额1亿美金的B系列融资</strong></p>\n  <p>36氪获悉，近日“寻明生科”再获总额1亿美金的B系列融资。首轮由Granite Asia（前身为纪源资本GGV亚洲业务）独家投资；后续轮次由产业投资人领投，弘晖基金跟投，启明创投、经纬创投及纽尔利资本等老股东追加。距离公司披露3500万美元A+轮融资，仅过去3个多月。</p>\n  <p><strong>“模量科技”完成数千万元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“模量科技”近日完成由猎鹰投资、益华资本投资的数千万元Pre-A轮融资，点石资本担任财务顾问。本轮资金用于研发团队和产线扩建、全球业务拓展。</p>\n  <p><strong>CoreWeave完成26亿美元AI基础设施贷款融资</strong></p>\n  <p>8月10日，CoreWeave宣布完成26亿美元延期提款定期贷款融资，以支持其AI云平台的持续扩张及已承诺的客户部署项目，融资期限约为五年。融资所得资金将用于采购和部署专用于客户合同的高性能计算（HPC）基础设施。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>腾讯音乐：二季度营收89.3亿元，同比增5.8%</strong></p>\n  <p>36氪获悉，腾讯音乐公告，二季度营收89.3亿元，同比增5.8%；二季度NON-IFRS净利润26.9亿元，同比增4.4%。</p>\n  <p><strong>阅文集团：上半年短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多</strong></p>\n  <p>8月11日，阅文集团发布2026年中期业绩报告。报告显示，上半年阅文集团收入达35.3亿元，同比增长10.7%。上半年阅文GMV达7.8亿元，同比增长60%；短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多；IP版权收入达16.1亿元，同比增长41.9%。</p>\n  <p><strong>康师傅控股：2026年上半年营收405.4亿元人民币，同比增长1.1%</strong></p>\n  <p>36氪获悉，康师傅控股在港交所公告，上半年营收405.4亿元人民币，同比增长1.1%；公司股东应占经调整溢利24.3亿元人民币，同比上涨15.2%。</p>\n  <p><strong>工业富联：2026年上半年净利润237.4亿元 同比增长95.99%</strong></p>\n  <p>36氪获悉，工业富联公告，2026年上半年营业收入5578.61亿元，同比增长54.63%。归属于上市公司股东的净利润237.4亿元，同比增长95.99%。归属于上市公司股东的扣除非经常性损益的净利润229.84亿元，同比增长96.99%。基本每股收益1.2元。本公司计划不派发现金红利，不送红股，不以公积金转增股本。</p>\n  <p><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-11T23:59:35+00:00", "fetched_at": "2026-08-12T01:26:56.984327+00:00", "fingerprint": "df679ba3f48b8ea7"}, {"source": "少数派", "title": "不喜欢对照式译文的阅读体验？Ovid 让你「按需」查看原版书籍", "url": "https://sspai.com/post/113263", "summary": "因为不太喜欢传统的那种原文、译文按段落或按分页对照的那种双语书形式，我做了一款可以让你按需查看译文的 ovid。<a href=\"https://sspai.com/post/113263\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-11T02:17:21+00:00", "fetched_at": "2026-08-12T01:26:55.341913+00:00", "fingerprint": "dccb0e78795fca3f"}, {"source": "少数派", "title": "从内容工坊到 Dot Skill，Quote/0 开始把屏幕交还给你", "url": "https://sspai.com/post/113288", "summary": "从最初的测试与共创算起，Quote/0（摘录）已经陪伴大家近一年半的时间。最初我们只想做一块安静的墨水屏：不推送、不闪烁，只把真正重要的信息留在抬眼可见的地方。后来Quote/0进入了许多我们没有预设 ...<a href=\"https://sspai.com/post/113288\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-11T04:00:00+00:00", "fetched_at": "2026-08-12T01:26:55.341906+00:00", "fingerprint": "77fd400b2fbf8324"}, {"source": "少数派", "title": "走通上架流程，拥抱新兴生态：《鸿蒙应用上架指南》上线", "url": "https://sspai.com/post/112887", "summary": "随着HarmonyOSNEXT的日渐成熟，越来越多的独立开发者和小团队开始将目光投向这片新的生态。借助日益强大的AI辅助编程工具，写出能跑通的代码、画出漂亮的UI界面，门槛已经变得前所未有地低。但当你 ...<a href=\"htt rom our guide to the best gadgets for summer travel because it can charge up to five devices at once, yet it’s small enough [&#8230;]", "category": "tech", "published_at": "2026-08-10T21:18:15+00:00", "fetched_at": "2026-08-11T01:18:32.628422+00:00", "fingerprint": "b8c71c606b39ab9a"}, {"source": "The Verge", "title": "Mark Zuckerberg doesn’t understand how to live", "url": "https://www.theverge.com/ai-artificial-intelligence/977623/mark-zuckerberg-ai-manifesto-dim-vision", "summary": "Recently, a man I was rock climbing with told me about how he'd used AI to make a motivational poster for himself, which he'd hung on his bedroom wall: a bear, walking a slackline over a canyon, holding a sign that said, \"Do cool shit.\" I made what I hoped was a polite noise. What [&#8230;]", "category": "tech", "published_at": "2026-08-10T22:00:00+00:00", "fetched_at": "2026-08-11T01:18:32.628412+00:00", "fingerprint": "d8f43f474508ca5e"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜搜狐：2026年Q2总收入1.36亿美元，同比增长7%；千问开放平台上线；高盛：全球AI投资今年将突破10000亿美元，美国投资接近6000亿美元", "url": "https://36kr.com/p/3933544245771395?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>美的、光峰科技等成立创业投资合伙企业，出资额9286万</strong><br />36氪获悉，天眼查App显示，近日，宁波美和南旅创业投资合伙企业（有限合伙）成立，执行事务合伙人为美的创业投资管理有限公司，出资额9286万人民币，经营范围为创业投资，由江西南旅投资集团有限公司、深圳光峰科技股份有限公司等共同出资。</p>\n  <p><strong>药石科技：上半年净利润同比增长37.17%，拟10派1元</strong></p>\n  <p>36氪获悉，药石科技披露半年报，上半年营业收入10.59亿元，同比增长15.19%；归属于上市公司股东的净利润9944.49万元，同比增长37.17%；基本每股收益0.43元。拟向全体股东每10股派发现金红利1元（含税）。</p>\n  <p><strong>钶锐锶科创板IPO定于8月17日上会</strong></p>\n  <p>36氪获悉，据上交所网站披露，上交所上市审核委员会定于8月17日召开2026年第47次上市审核委员会审议会议，届时将审议广东钶锐锶数控技术股份有限公司的首发事项。</p>\n  <p><strong>阿里云将数据中心交付周期缩短至100天</strong></p>\n  <p>36氪获悉，8月10日，基于首创全模块化设计架构，阿里云已将大型AIDC数据中心的交付工期缩短至100天。同样的工期，国内传统交付周期为6至12个月，美国为12至18个月。在大幅缩短工期的同时，阿里云数据中心整体建设成本反而降低10%以上。今年，阿里云正计划将模块化数据中心的全球产能提升两倍以上。</p>\n  <p><strong>东鹏饮料在郑州成立新公司，注册资本1亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，郑州东鹏维他命饮料有限公司成立，法定代表人为徐仕兵，注册资本1亿人民币，经营范围包括饮料生产、食品生产、食品销售、保健食品（预包装）销售等，由东鹏饮料（集团）股份有限公司全资持股。</p>\n  <p><strong>SK海力士回应“考虑出售重庆工厂”传闻：尚未确定任何事项</strong></p>\n  <p>8月10日，SK海力士就“4万亿韩元规模中国重庆工厂推进出售”的市场传闻发布公告称，公司正在研究多种提升封装业务竞争力的方案，但截至目前尚未确定任何具体事项。SK海力士表示，若未来相关事项确定，将在确定之日起或一个月内再次披露。此前，据中新经纬援引彭博社报道，有知情人士透露，韩国SK海力士正在考虑其位于中国重庆的工厂的多种处置方案，包括引进投资者以加速业务增长。上述人士称，潜在的股权出售对该工厂的估值可能约为30亿美元（约4.2万亿韩元）。（界面）</p>\n  <p><strong>HOOLULUU发布全球首款潮玩音箱盲盒，探索“声音装置”新品类</strong></p>\n  <p>近日，HOOLULUU正式发布旗下首款产品——HOOLULUU MOOD“超频过载（OVERDRIVE）”系列，并提出“潮玩音箱盲盒”这一全新产品形态。该系列采用6+1盲盒结构，每款产品均拥有配色、造型语言、灯光与角色设定。未来，HOOLULUU将持续围绕“声音装置（Sound Installation）”拓展产品矩阵，布局角色IP、联名企划、内容与线下体验。</p>\n  <p><strong>搜狐：2026年Q2总收入1.36亿美元，同比增长7%</strong></p>\n  <p>36氪获悉，8月10日，搜狐公司公布了截至2026年6月30日未经审计的第二季度财务报告。搜狐公司第二季度总收入为1.36亿美元，较2025年同期增长7%。其中，营销服务收入为1500万美元，在线游戏收入为1.16亿美元。财报显示，归于搜狐公司的非美国通用会计准则净利润为50万美元，其中包含冲销所得税费用约1300万美元。相比之下，2025年同期净亏损为2000万美元。</p>\n  <p><strong>中国AI大模型调用量连续十五周领跑：环比增长570%，DeepSeek-V4-Flash正式版登顶</strong></p>\n  <p>根据OpenRouter最新数据测算，上周（8月3日至8月9日）全球AI大模型总调用量为69万亿Token，环比增长21.48%。其中，上榜的AI大模型中，中国AI大模型周调用量达34.25万亿Token，环比增长21.76%；同期美国AI大模型周调用量为9.17万亿Token，环比增长109.36%。中国大模型周调用量连续十五周超过美国，稳居全球首位。上周，全球调用量排名前四均为中国AI大模型。其中，DeepSeek-V4-Flash-0731（即DeepSeek-V4-Flash正式版）位居第一，周调用量达8.83万亿Token，环比增长570%；腾讯Hy3位居第二，周调用量达8.05万亿Token，环比增长67%；DeepSeek-V4-Flash-0423（即DeepSeek-V4-Flash预览版）排名第三，周调用量达5.88万亿Token，环比下滑19%。（每经）</p>\n  <h2>投融资：</h2>\n  <p><strong>星环聚能完成新一轮8.8亿元融资</strong></p>\n  <p>据星环聚能消息，近日完成新一轮(A++轮)融资，融资金额为8.8亿元人民币。本轮融资由深投控资本、深担创投、农银资本、交银投资等机构联合投资，老股东上海科创集团旗下知识产权基金等机构继续跟投。本轮融资资金将与A轮、A+轮融资资金一道，共同用于上海嘉定实验基地建设、NTST(负三角球形托卡马克)建造与运行、CTRFR-1(星环一号)设计建造，以及聚变堆级高温超导磁体与AI等离子体控制等关键技术的持续工程化推进。（第一财经）</p>\n  <h2>新产品：</h2>\n  <p><strong>千问开放平台上线</strong></p>\n  <p>36氪获悉，8月10日，千问开放平台上线，面向生态伙伴和开发者开放手机、PC和AI眼镜三类终端的服务接入。据介绍，首批接入的伙伴覆盖物流运输、房产居住、本地生活、理财、汽车等十多个领域，只需在对话中@相关服务，或点击页面右上角的“圆点角标”进入相应智能体，就能体验从咨询、推荐到下单的完整服务。</p>\n  <h2>今日观点：</h2>\n  <p><strong>高盛：全球AI投资今年将突破10000亿美元，美国投资接近6000亿美元</strong><br />财联社8月10日电，近日，高盛分析师发布报告称，预计到2026年底，全球人工智能投资将超过1万亿美元，其中美国人工智能投资预计接近6000亿美元。高盛研究部根据其对人工智能投资的偏好估计值，推算出到2028年人工智能投资占美国 GDP 的比重。据高盛估算，美国人工智能资本支出占GDP的比重将从2026 的1.8%上升到 2027 年的2.5%，并在2028年进一步上升到 2.8%。而与此同时，全球人工智能投资占全球GDP的比重，将在2026年至2028年逐年上升，分别为0.9%、1.3%和1.4%。（财联社）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>现代汽车在首尔周边试点自动泊车机器人，明年投入运行</strong></p>\n  <p>现代汽车集团周一宣布，将在首尔西部一处公寓小区启动机器人示范项目，以此研发智能停车管理系统。该项目依托政府智慧城市监管沙盒计划开展，现代汽车、汽车零部件子公司现代威亚以及现代建设组建联合体，项目选址首尔西南始兴市的希尔斯特波浪城小区。（新浪财经）</p>", "category": "tech", "published_at": "2026-08-10T10:09:54+00:00", "fetched_at": "2026-08-11T01:18:32.552042+00:00", "fingerprint": "7acfb38de9d68f11"}, {"source": "36氪 - 最新文章", "title": "WISE2026 商业之王系列年度名册调研重磅启动", "url": "https://36kr.com/p/3933570306227592?f=rss", "summary": "<p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_4cc191ae6b974373bfcbe104e5fb6b76@5889148_oswg65960oswg1080oswg575_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>&nbsp;</p>\n  <p>纳西姆·塔勒布说过：“风会熄灭蜡烛，却能使火越烧越旺。”</p>\n  <p>2026年的商业世界，正站在这样一场大风之中。</p>\n  <p>全球经济颠簸前行，技术浪潮反复冲刷产业边界，旧秩序松动，新规则生长。对有些企业来说，这是令人窒息的逆风；但对另一些企业而言，这恰恰是让火焰烧得更旺的氧气。</p>\n  <p>回看上半年，中国GDP增速为4.7%，处于全球中高速增长梯队，同时，相较于稳健的总量增速，经济底层的结构性迭代，正成为本次发展的一个核心变化，高技术制造业增加值同比增长13.3%，数字经济总规模逼近50万亿元大关。<strong>增长的引擎，正从规模驱动，慢慢转向技术与效率驱动。</strong></p>\n  <p>转向的底层动力，来自研发强度的持续加码。当全社会研发投入强度攀升至2.8%，AI、新能源、人形机器人等领域的渗透率与出货量接连跃升，技术已不再只是某个行业的加分项，而是正在重构所有行业的基础设施。与此同时，商业航天、低轨卫星、创新药授权、低空经济等前沿赛道正密集冲刺商用拐点，跨境电商与海外仓网络将中国产品送达全球超200个国家和地区，品牌出海与文化出海让企业从“走出去”进阶为“扎下根”。</p>\n  <p>这种系统性技术竞争力的崛起，在一级市场得到了清晰映射。上半年，资金高度向硬科技集中，AI大模型、具身智能、半导体成为三大吸金主力。其中，具身智能融资额同比暴涨5倍，量子科技、商业航天等前沿赛道的增速也都在两倍以上。资本的流向，正在为下一个时代划出轨迹。</p>\n  <p>当技术成为所有行业的基础设施，当资本坚定地为未来投票，商业本身也在被重新定义，它不再只是模式与流量的博弈，而是<strong>技术深度、产业厚度与全球视野的综合角力</strong>。</p>\n  <p>这正是36氪选择在这个节点，重新审视“商业之王”标准的原因。</p>\n  <p>作为深耕科技创新与商业生态的新型服务平台，16年来，36氪见证并参与了中国商业生态的演进与蜕变。我们发现，在变化不断发生的商业环境中，真正具有长期价值的企业，不仅需要抓住时代机会，更需要推动产业进步、创造新的增长可能。</p>\n  <p>他们不只适应风向，更善于把风变成自己的火焰。</p>\n  <p><strong>基于此，36氪正式启动“WISE2026 商业之王系列年度名册”调研项目。</strong>面向年度人物、年度企业、年度焦点产品三大方向，寻找那些推动产业进化、创造商业价值、代表未来趋势的重要力量。</p>\n  <p>36氪将通过专业调研，深入洞察2026年商业生态领域的创新全貌，<strong>看见那些最具引领力、创新力与前瞻力的人；挖掘那些推动产业发展，为经济增长提供创新动能的企业；聚焦那些在不同场景中实现创新应用、重塑用户体验的产品</strong>。</p>\n  <p>本次名册，共包含3大系列，15个评选维度，分别为：</p>\n  <h3><strong>一、WISE2026 商业之王年度人物系列名册</strong></h3>\n  <p>年度人物·商业破局者</p>\n  <p>年度人物·价值发现者</p>\n  <h3><strong>二、WISE2026 商业之王年度企业系列名册</strong></h3>\n  <p>年度企业·AI产业创新企业</p>\n  <p>年度企业·具身智能先锋企业</p>\n  <p>年度企业·半导体产业突破企业</p>\n  <p>年度企业·先进制造标杆企业</p>\n  <p>年度企业·产业数智化服务企业</p>\n  <p>年度企业·大健康产业创新企业</p>\n  <p>年度企业·消费新趋势塑造企业</p>\n  <p>年度企业·出海全球化服务企业</p>\n  <p>年度企业·空天产业创新企业</p>\n  <p>年度企业·最具商业潜力企业</p>\n  <h3><strong>三、WISE2026 商业之王年度焦点产品名册</strong></h3>\n  <p>年度焦点产品（电子产品/消费产品/软件APP）</p>\n  <p><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 以下为“WISE2026 商业之王系列年度名册”</strong></p>\n  <p><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 申报指南</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_392cb53e357c4c1990678e9461db2706@5889148_oswg634643oswg1080oswg5336_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_9d0859dc007a465293e57b3a1f0f4715@5889148_oswg985266oswg1080oswg6661_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_6f53d0fc6cd148a49b9fe5bf09ad6b9d@5889148_oswg927019oswg1080oswg6670_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_5c6a34e448134a9f8ed08cba0d7782fa@5889148_oswg677186oswg1080oswg6527_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/E_a_CaQ5N9nGXcXqE8t_Og\" rel=\"noopener noreferrer\" target=\"_blank\">“36Kr Today”</a>，作者：36Kr&nbsp;Today，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-10T10:39:24+00:00", "fetched_at": "2026-08-11T01:18:32.552036+00:00", "fingerprint": "5ac80865f91ed174"}, {"source": "36氪 - 最新文章", "title": "近40亿元融资背后：资本为何看好帕西尼", "url": "https://36kr.com/p/3933515490884744?f=rss", "summary": "<p>过去两年，大模型提升了机器人理解任务、拆解指令和规划动作的能力，视觉模型也让机器更擅长识别物体和判断空间位置。但机器人真正伸手之后，问题会迅速从“看见了什么”转向“接触之后发生了什么”。机械手把线束插进接口，视觉系统已经确认位置无误，动作仍可能失败：插入力突然增大、零件发生偏转，或者材料开始滑移。对人来说，这些判断由指尖本能完成；对机器人来��，则依赖触觉感知和控制闭环。</p>\n  <p>这也是触觉在当前具身智能产业阶段进入“聚光灯”的原因。</p>\n  <p><strong>就在行业从样机竞赛走向交付竞赛的节点，帕西尼完成新一轮10亿元融资</strong>，累计融资近40亿元；与此同时，公司总部迁至北京并完成股份制改造。把三件事放在一起看，更像一个赛道阶段切换的信号：具身感知已经不再只验证技术可行性，头部企业开始用资本、组织和生态能力放大已经形成的技术与商业优势。</p>\n  <p>据公开信息披露，本轮由全球消费电子与半导体产业巨头（结合投资方画像，本轮领投方或指向三星）、中银国际投资、鲲鹏基金、合信方册联合领投，鼎晖百孚、成都交子人工智能基金、京铭资本、津融国盛联合投资，知来资本等老股东继续加码。阵容同时覆盖产业资本、国家级金融力量、区域人工智能基金和市场化机构，为公司提供的不只是资金，也包括供应链、产业落地、治理和全球场景连接。</p>\n  <h2><strong>触觉从“可选项”变成核心控制环节</strong></h2>\n  <p><strong>触觉过去常被放在机器人零部件图谱中评价，关注点集中在维度、量程和分辨率。</strong>进入真实任务后，它的价值却更接近控制系统的一部分：机器人必须读取接触结果，判断动作是否偏离，并及时修正。</p>\n  <p><strong>传统自动化设备依靠结构化环境、固定工位和预设程序完成任务，感知只需要确认物体在不在、位置对不对。</strong>具身智能面对的是连续变化：同一个杯子在空杯、半杯和满杯状态下，需要不同夹持策略；同一根线束的角度、摩擦和材料状态变化后，插接阻力也会不同。机器人如果只能执行预先规划的动作，就仍然是更灵活的自动化设备，而不是能够适应物理世界的智能体。</p>\n  <p><strong>因此，触觉真正创造价值的方式，是进入物理闭环：</strong>传感器获得接触信息，采集系统把信息与任务和动作同步，执行端再根据反馈调整控制。任何一个环节缺失，触觉都可能停留在参数展示，难以转化为任务成功率。</p>\n  <h2><strong>具身智能原生下的全链路布局</strong></h2>\n  <p>如果只把帕西尼概括为一家触觉传感器公司，就会错过它技术体系最关键的形成逻辑。帕西尼自创立之初的目标就是加速具身智能落地。围绕这一目标，公司同步布局三大技术方向：触觉传感器、具身数据采集、触觉集成终端执行。三者并不是“先做传感器，再向上下游延伸”的时间序列，也不是业务扩张后的产品拼盘，而是从机器人真实任务反向定义技术图谱的一套并行系统。</p>\n  <p>触觉传感器负责将物理接触转化为可计算信号。基于HAPTA异构多核阵列架构，帕西尼现款产品最多可提供717路触觉信号，并兼顾高频输出、微小力识别、IP68防护和超过1000万次测量寿命。这意味着其产品不仅拥有高精准性，还具备规模装机所要求的可靠性和一致性。</p>\n  <p><strong>与感知技术同步布局的全模态采集系统，将触觉与视觉、关节状态和动作轨迹对齐，形成可供模型训练的数据</strong>；<strong>灵巧手与机器人本体则在真实任务中检验模型和控制效果。</strong>执行结果持续回流，反向迭代传感器、数据和算法。三条技术线由此形成闭环，将竞争维度从单一器件参数，推进到机器人的任务成功率与规模化交付能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_91f3160deb8c48f2bf5e26f5ada3b07d@577536001_oswg335721oswg1080oswg602_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>这一闭环并非内部自证，而是已经获得规模化应用与外部采用的双重验证。近一年度，帕西尼自研触觉芯片消耗量逼近100万颗，全模态数据被多家头部具身智能基础模型企业和大型互联网科技公司采用，公司还参与了相关国家及国际标准制定。三项进展分别体现了硬件规模化能力、数据的外部应用价值，以及公司在行业标准建设中的话语权。</p>\n  <h2><strong>资本逻辑变了：从买可能性，到买复利</strong></h2>\n  <p>再说回持续“高温”的资本区。在一个真正空白的赛道里，资本广泛播种是合理策略。技术方向尚未收敛时，多项目覆盖可以购买选择权。但当头部企业已经跨过产品化、数据闭环、商业交付和组织规模化门槛，投资逻辑就必须变化。资本审视新的具身感知项目，就要追问：后来者究竟带来了什么不可替代的增量。</p>\n  <p>它是否带来了现有方案无法覆盖的新感知模态？能否在成本、寿命、体积、功耗或一致性上实现数量级改善？能否解决新的场景问题？技术优势是否能在真实任务中反复出现？即使产品可行，追赶头部企业的时间和资本成本又是多少？</p>\n  <p><strong>如果这些问题没有答案，只是重新搭建“传感器＋灵巧手＋数据＋模型”的相似图谱，资本购买的不是创新，而是重复的不确定性。</strong>硬科技行业最容易出现的误判，是把“技术被证明”与“公司被证明”混为一谈。触觉传感器尤其容易被演示视频美化：轻轻按压、拖动或抓取一次，很多路线都能呈现直观效果；真正进入生产环境后，工程问题才开始集中出现。毕竟“路线图相似”与“产业能力相同”之间，隔着漫长的工程化过程。</p>\n  <p><strong>帕西尼的投资方覆盖汽车、物流、消费电子、人工智能和精密制造等产业方向。</strong>这样的股东结构，对具身智能企业的意义不只在资金规模。触觉技术缺少的往往是足够具体、足够重复、允许持续迭代的真实任务。</p>\n  <p>汽车产线、3C装配和物流分拣会提出完全不同的要求：材料不同，节拍不同，容错边界也不同。产业资本能够带来场景、供应链和测试标准；企业在这些场景中得到的失败数据，又会推动传感器结构、控制策略和数据采集方式改进。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_fcd26464968d429e8d241e317ed02ce0@577536001_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p><strong>这也是帕西尼比单一触觉创业项目更值得关注的原因。</strong>后来者可以从更新的论文起步，也可能在某个指标上快速领先，但技术壁垒不会因融资路演PPT中的技术路径趋同而自然形成，必须依靠持续的高强度研发投入，以及量产制造与交付经验的不断积累来构建。交付越多，企业掌握的数据越多；客户越丰富，跨本体和跨任务适配经验越多；产量越大，良率和成本控制能力越强；真实数据越多，硬件、控制和模型之间的闭环越难追赶。</p>\n  <p>在全球化环节，帕西尼核心专利已覆盖主要市场，北美、日韩和欧洲的本地化运营与交付体系正在建设。本轮产业资本的加入则进一步转化为供应链协同与海外客户验证，帕西尼的领先或许会从国内工程积累延伸为跨区域标准化交付能力。</p>\n  <h2><strong>头部位置不是结论，而是持续验证</strong></h2>\n  <p><strong>积极判断帕西尼，并不意味着回避它接下来的压力。</strong>大额订单能否按期转化为收入，跨机器人本体适配是否足够高效，数据规模能否对应真实质量，硬件业务与模型业务能否在组织上协同，都是公司迈向更大规模时必须回答的问题。</p>\n  <p>但一个更明确的行业判断已经形成：具身感知不再是一张等待资本填满的白纸，帕西尼也很难再被放在普通触觉传感器企业的坐标中评价。它以加速具身智能落地为目标，同步构建触觉传感器、具身数据采集和触觉集成终端执行，并率先把这套体系推进到商业与组织验证阶段。</p>\n  <p><strong>这也是融资、迁京和股改在同一时期发生的深层含义。</strong>企业竞争的重点已经从寻找可行路线，转向扩大已经形成的系统优势；资本竞争的重点则从补齐赛道地图，转向识别增量创新与头部复利。</p>\n  <p>具身智能的下一阶段，不会只属于“会做机器人”的公司，也不会只属于“会做传感器”的公司。真正稀缺的，是能够把接触变成数据、把数据变成控制、把控制变成稳定交付的产业系统。</p>\n  <p>而这，正是具身感知从概念热潮迈向产业基础设施的关键分水岭。</p>", "category": "tech", "published_at": "2026-08-10T11:17:11+00:00", "fetched_at": "2026-08-11T01:18:32.552029+00:00", "fingerprint": "d36fb217219eb99d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宇树科技最终中签率公布：0.01809759%；费大厨撤下“全国小炒肉大王”称号；官方回应“豆包上线酒店订单抽佣机制”", "url": "https://36kr.com/p/3934369453522313?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Meta发布轻量化AI模型，单张显卡即可运行</li>\n   <li>苹果被曝考虑重新设计Apple Watch&nbsp;</li>\n   <li>极氪回应车辆起火事件</li>\n   <li>商务部：初步认定原产于墨西哥和美国的进口碧根果存在倾销</li>\n   <li>阿维塔辟谣“与华为合作是非必要项”：系言论误读</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>宇树科技：IPO网上发行有效申购倍数8288.82倍，最终中签率0.01809759%</strong></p>\n  <p>宇树科技公告，公司首次公开发行股票并在科创板上市，发行价格为人民币150.8元/股。本次网上发行有效申购户数为978.46万户，有效申购股数为536.37亿股，网上发行初步中签率为0.01206444%。由于网上发行初步有效申购倍数约为8288.82倍，超过100倍，发行人和保荐人启动回拨机制，将323.6万股从网下回拨到网上。回拨后，网上最终发行数量为970.7万股，约占扣除最终战略配售数量后发行数量的30.00%，网上发行最终中签率为0.01809759%。（华尔街见闻）</p>\n  <p><strong>费大厨撤下“全国小炒肉大王”称号</strong></p>\n  <p>被网络质疑后，费大厨门店移除“全国小炒肉大王”宣传。8月10日，费大厨回应称，为响应新规，所有门店正陆续换新，宣传语将改为“精选黑猪肉·专业大厨炒”，预计8月底完成。据此前消息，7月底，中国烹饪协会宣布全面清理、撤销历年颁发的“大师”“名师”及“美食地标城市”等称号，相关证书及宣传背书效力即刻失效。随后有网友发现，费大厨使用近6年的“全国小炒肉大王”称号，是在中国烹饪协会举办的一场线上网络投票比赛中，靠参赛照片和视频赢得的，费大厨相关话题也因此多次冲上热搜。（澎湃新闻）</p>\n  <p><strong>豆包上线酒店订单抽佣机制？官方回应：酒店佣金并非广告费</strong></p>\n  <p>8月10日，通过豆包入口跳转抖音来客成交的酒店订单，将执行独立费率：11.4%的软件服务费加0.6%的支付手续费，综合费率约12%。对此，有酒店行业人士表示，此消息属实，网传照片为抖音来客后台的通知，“现在豆包推荐酒店已经要收佣金了。”7月27日，抖音生活服务学习中心曾发布《2026年抖音生活服务平台特定渠道软件服务费政策说明》，说明中提到，本政策有效期为2026年8月10日0:00至新的抖音生活服务平台特定渠道软件服务费政策生效前一日24:00，具体的软件服务费费率将通过商家来客后台向商家触达。对此，豆包公关负责人刘星回应：豆包生活服务业务目前没有付费推广，豆包推荐酒店也不收取广告费，商家不能通过付费影响推荐或排序，仅在订单成交后支付渠道服务费。（新浪科技）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Meta发布轻量化AI模型，单张显卡即可运行</strong></p>\n  <p>8月10日，Meta Platforms推出轻量化AI模型Muse Glimmer，可在单台电脑上运行，用户能够下载并根据自己的需求定制。Meta表示，Muse Glimmer是该公司Muse Spark1.2模型的“蒸馏”版本，设计重点是提高效率、尽可能降低对计算机系统配置的要求。据介绍，Muse Glimmer拥有300亿个参数，规模“小到”只需要一张显卡就能运行，其主要任务包括日程管理和文件整理等。（界面新闻）</p>\n  <p><strong>OpenAI推出GPT-5.6-Cyber模型提升高级网络安全任务能力</strong></p>\n  <p>金十数据8月11日讯，OpenAI宣布推出GPT-5.6-Cyber，并扩展网络安全计划Davbreak为经过宙核的网络安全防御人员提供更适合高级安全工作的AI模型。OpenAI表示，希望在攻击者大规模部署自主网络攻击之前，将前沿AI能力交给可信防御人员。Daybreak分为两级：Daybreak Blue提供GPT-5.6 Sol访问权限，并没有系统级网络安��防护限制；Daybreak Red 提供 GPT-5.6-Cyber 问权限，用于漏洞利用验证和高级漏洞研究。测试显示，GPT-5.6-Cyber对95%的高级网络安全任务请求作出响应，包括漏洞利用链开发、身份验证绕过和权限提升。OpenAI称，高风险能力将仅向获批准用户开放，并配备额外控制和监控措施。（金十数据APP）</p>\n  <p><strong>高盛机构预测2026年末全球人工智能整体投资规模将突破1万亿美元</strong></p>\n  <p>8月10日消息，高盛最新行业报告预测，2026年末全球人工智能总投资将突破1万亿美元，美国区域投资规模接近6000亿美元。机构测算2026至2028年，美国AI资本支出占GDP比重逐年抬升至1.8%、2.5%、2.8%；同期全球AI投资对应GDP占比分别为0.9%、1.3%、1.4%，AI对全球宏观经济拉动力度持续提升。（财联社）</p>\n  <p><strong>中国AI大模型连续十五周拿下全球调用量第一名，DeepSeek系列产品登顶单周流量榜单</strong></p>\n  <p>OpenRouter周度数据显示8.3-8.9全球大模型总调用69万亿Token，中国厂商合计34.25万亿Token，连续十五周超越美国。DeepSeek-V4-Flash正式版周调用8.83万亿Token，环比暴涨570%位居全球第一；腾讯Hy3、DeepSeek预览版分列二、三名，国产大模型流量优势持续扩大。（每日经济新闻）</p>\n  <p><strong>三星电子HBM4芯片量产良率提升至近80%，抢占AI算力存储增量需求</strong></p>\n  <p>8月10日行业消息，三星HBM4量产良率半年内从不足60%提升至近80%，达到行业黄金良率标准。公司规划Q3HBM4营收较二季度提升3倍，下半年HBM收入占整体HBM业务超60%，年末目标拿下约38%全球HBM市场份额，抢占AI算力存储增量需求。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>苹果被曝考虑重新设计Apple Watch</strong></p>\n  <p>美东时间周日，知名科技记者马克·古尔曼（Mark Gurman）指出，随着芬兰品牌Oura推出的智能健康戒指Oura Ring及其他无屏幕智能健身设备对Apple Watch形成更激烈的竞争，苹果正考虑对Apple Watch产品线进行重大调整。苹果准备着手彻底革新Apple Watch的设计理念，重新从零开始设计产品，以应对智能穿戴行业向无屏设备及更多新形态发展的趋势。尽管目前尚无确切计划公布，但据透露，过去一年间，苹果一直在考虑各种产品形状和尺寸，包括配备圆形显示屏的腕表、完全无屏幕的健身配件等。（财联社）</p>\n  <p><strong>极氪回应车辆起火事件</strong></p>\n  <p>8月10日消息，8月9日晚，就当天一辆极氪车型在宁波充电站发生起火事件，极氪汽车通过官方账号“极氪服务”进行回应。回应中称，8月9日，宁波市海曙区某充电场站，极氪品牌旗下一车辆发生过热事件，消防部门第一时间到达现场并妥善处置，事故未造成人员伤亡。获悉情况后，极氪汽车第一时间安排工作人员赶赴现场，并成立专项工作组协助处理后续事宜。经初步核实，该车辆近期曾发生严重碰撞事故，事故发生后未通过品牌官方授权服务中心进行检测及维修。目前，极氪汽车正积极配合消防及相关部门开展现场勘验和事故原因调查。具体原因，以相关部门最终调查结论为准。（央广网）</p>\n  <p><strong>拼多多上线“最快明天达”，正面切入美团、京东腹地</strong></p>\n  <p>8月10日，拼多多App首页悄然上线“最快明天达”一级核心入口，品类覆盖水果生鲜、日用百货等高频刚需，与此前仅在商品详情页、搜索结果中由算法动态展示“明天达”标识不同，此次拼多多将该服务提升至首页核心导航位，与“百亿补贴”并列。这一看似细微的产品调整，意味着拼多多正式向即时零售核心腹地发起正面冲击，国内万亿级即时零售赛道迎来又一位重量级玩家。（界面新闻）</p>\n  <p><strong>美联储哈玛克：可能需要多次加息压低通胀</strong></p>\n  <p>金十数据8月11日讯，克利夫兰联储主席哈玛克表示，当前通胀仍未回到目标水平，美联储可能需要进行多次加息。她称，一次25个基点加息“对经济不会产生太大影响”，但其不愿预判具体加息次数或最终利率水平。哈玛克认为，目前3.50%-3.75%的利率区间并未对经济形成明显限制，企业仍未因高利率减少增长投资，因此“现在是采取行动的时候”。她表示，等待越久，通胀回到2%的难度越大。哈玛克同时强调，就业市场目前没有明显问题，7月就业数据不会改变她对通胀的关注。她认为，市场只能辅助美联储，不能替代美联储采取行动。哈玛克在美联储7月的议息会议上反对维持利率不变，其倾向于加息25个基点。（金十数据APP）</p>\n  <p><strong>英特尔宣布拟议的150亿美元普通股发行计划</strong></p>\n  <p>英特尔宣布拟议的150亿美元普通股发行计划。英特尔将把所得款项用于一般公司用途。英特尔表示，在资本部署方面保持谨慎。(财联社)</p>\n  <p><strong>SK海力士回应“考虑出售重庆工厂”传闻：尚未确定任何事项</strong></p>\n  <p>8月10日，SK海力士就“4万亿韩元规模中国重庆工厂推进出售”的市场传闻发布公告称，公司正在研究多种提升封装业务竞争力的方案，但截至目前尚未确定任何具体事项。SK海力士表示，若未来相关事项确定，将在确定之日起或一个月内再次披露。（界面新闻）</p>\n  <p><strong>商务部：初步认定原产于墨西哥和美国的进口碧根果存在倾销</strong></p>\n  <p>8月10日，商务部发布对原产于墨西哥和美国进口碧根果的反倾销调查初裁。根据《中华人民共和国反倾销条例》（以下简称《反倾销条例》）的规定，2025年9月25日，商务部（以下称调查机关）发布2025年第52号公告，决定对原产于墨西哥和美国的进口碧根果（以下称被调查产品）进行反倾销立案调查。目前，调查机关初步认定，原产于墨西哥和美国的进口碧根果存在倾销，中国国内碧根果产业受到实质损害，而且倾销与实质损害之间存在因果关系。（澎湃新闻）</p>\n  <p><strong>iPhone18 Pro机型物料成本同比上涨38%，苹果或调整毛利策略以稳健出货</strong></p>\n  <p>36氪获悉，根据Trend Force集邦咨询最新手机产业研究，由于以存储器为首的零部件价格上涨，推升Apple（苹果）将发布的iPhone 18系列整机成本。以该系列的256GB版本BOM（物料清单）成本为例，预估年增幅度达38%左右，整机售价势必提高。为避免影响消费者购买意愿，Apple可能借由降低毛利的方式控制售价涨幅，以换取市占扩张。</p>\n  <p><strong>英伟达宣布将与6家金融公司合作，筹集逾5000亿美元用于AI计算</strong></p>\n  <p>英伟达宣布与Apollo、贝莱德、黑石、博枫、高盛和KKR合作，设立独立的算力融资平台，为AI基础设施建设筹集逾5000亿美元第三方资本。英伟达8月10日已与这六家金融机构签署谅解备忘录。相关合作仍需签署最终协议后方可生效。英伟达将与这些公司合作，设立专门的大规模资金池，以具有吸引力的融资利率为英伟达客户提供资金支持。（财联社）</p>\n  <p><strong>韩国将设立超35亿美元基金，重点投资半导体材料、零部件及设备领域</strong></p>\n  <p>据报道，韩国总统秘书室室长姜勋植8月10日表示，作为建设半导体产业集群计划的一部分，韩国将设立规模5万亿韩元（约合35.2亿美元）的半导体专项基金，重点投资于有前景的芯片材料、零部件以及无晶圆厂企业。（界面新闻）</p>\n  <p><strong>阿维塔辟谣“与华为合作是非必要项”：系言论误读</strong></p>\n  <p>近日有媒体报道称，阿维塔副总裁雍军表示，不认为和华为的合作模式是“必要项”，因为阿维塔具备差异化的能力。对此，8月10日，阿维塔辟谣称，雍军原话仅指 “让华为打造专属智驾版本”的模式不必要，并非否定与华为的合作价值。目前，双方采用联创合作模式，全流程共同定义、开发产品，同时阿维塔也是引望第二大股东。（证券时报）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，8月10日收盘，美股三大指数集体下跌，道指跌0.11%，纳指跌0.32%，标普500指数跌0.06%。大型科技股多数上涨，SpaceX涨超4%，奈飞涨超2%，亚马逊、微软涨超1%，谷歌、特斯拉、Meta小幅上涨；英特尔跌超4%，英伟达跌超2%，苹果跌超1%。热门中概股涨多跌少，腾讯音乐、阿里巴巴涨超3%，爱奇艺涨超2%，老虎证券、蔚来、京东、拼多多涨超1%；小鹏集团跌超1%，理想汽车、富途控股小幅下跌。</p>\n  <p><strong>香港打破142年高温纪录</strong></p>\n  <p>近日，强台风“白海豚”的外围下沉气流正为广东、香港等地带来普遍晴朗及极端酷热天气。</p>\n  <p>8月9日下午，香港多处地区气温达37℃或以上。截至8月9日下午3时30分，香港天文台总部录得最高气温36.9℃，是1884年开台有记录以来的最高气温。上水方面则录得最高气温39.8℃，是香港天文台自1980年设置自动气象站以来，在香港地区录得的最高纪录。（第一财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>百利天恒8月6日二次递交H股IPO上市申请，企业募资将全部投入ADC新药研发</strong></p>\n  <p>8月6日百利天恒向港交所重新递交上市申请，去年11月受港股医药板块行情暂缓发行。公司账面资金充足，募资全部投向全球ADC管线临床、海外运营与供应链体系搭建。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>九号公司：上半年净利润10.08亿元，同比下降18.79%</strong></p>\n  <p>36氪获悉，九号公司披露半年报，2026年上半年，公司实现营业收入143.58亿元，同比增长22.28%；归属于上市公司股东的净利润10.08亿元，同比下降18.79%；基本每股收益14元。</p>\n  <p><strong>搜狐：2026年Q2总收入1.36亿美元，同比增长7%</strong></p>\n  <p>36氪获悉，8月10日，搜狐公司公布了截至2026年6月30日未经审计的第二季度财务报告。搜狐公司第二季度总收入为1.36亿美元，较2025年同期增长7%。其中，营销服务收入为1500万美元，在线游戏收入为1.16亿美元。财报显示，归于搜狐公司的非美国通用会计准则净利润为50万美元，其中包含冲销所得税费用约1300万美元。相比之下，2025年同期净亏损为2000万美元。</p>\n  <p><strong>长青股份：上半年净利润5395.42万元，同比增长27.62%</strong></p>\n  <p>36氪获悉，长青股份披露半年报，2026年上半年，公司实现营业收入21.66亿元，同比增长4.01%；归属于上市公司股东的净利润5395.42万元，同比增长27.62%；基本每股收益0.0863元。</p>\n  <p><strong>江波龙：上半年净利润同比增长71528.66%</strong></p>\n  <p>36氪获悉，江波龙披露半年报，2026年上半年，公司实现营业总收入240.88亿元，同比增长136.26%；归属于上市公司股东的净利润105.77亿元，同比增长71528.66%；基本每股收益25.2元。</p>\n  <h2>酷产品</h2>\n  <p><strong>微软计划于9月发布其下一代MAIA 300人工智能芯片</strong></p>\n  <p>据The Information：微软计划于9月发布其下一代MAIA 300人工智能芯片。微软认为，MAIA芯片能够以更低的成本运行其自主研发和OpenAI的模型。微软计划加大自身对MAIA的使用力度，同时积极争取大客户。(金十数据APP)</p>\n  <p><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-11T00:10:43+00:00", "fetched_at": "2026-08-11T01:18:32.552021+00:00", "fingerprint": "9e687538606aa242"}, {"source": "36氪 - 最新文章", "title": "千亿IPO：山顶上的宇树 ｜ 深氪", "url": "https://36kr.com/p/3933488511270017?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬 袁斯来</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来 杨 &nbsp; 轩</p>\n  <p>制图&nbsp;|&nbsp;邱晓芬 范馨雅</p>\n  <p>2026年的宇树总部，在旅游城市杭州都算得上是热门景点。</p>\n  <p>参观团常年出没，拉着横幅在门口合影。官方展厅有时候会开放一些散客参观通道，但据说高峰期要排队一个多月。由于大量第三方机构打着“官方合作”旗号收费带客，宇树不得不在显眼处竖起告示——“宇树没有付费参访服务！！！”</p>\n  <p>宇树周边新开的楼盘将“杭州新贵宇树盘”作为核心卖点。因为有个说法是，宇树上市后，早期员工能一人买一套滨江区的房。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_7217099a78da45f6a7dfd71ae5b7d0e4@1199336245_oswg82332oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树展厅 拍摄：邱晓芬</p>\n  <p>而王兴兴的一举一动都会激起波澜。王兴兴穿黑色西装裤没系皮带；王兴兴专访后双手合十，是蒂姆库克的标志性动作；王兴兴的签字刚劲有力，彰显了“独特的个人魅力”；还有网友争论：王兴兴的MBTI到底是INTP还是INTJ。</p>\n  <p>这种狂热的气息，从民间传递到资本市场，在这个盛夏走向高潮。</p>\n  <p>2026年6月，宇树科技科创板IPO申请正式通过上交所上市委审议，从获受理到上会，前后仅73天，“火速过会”。一种看法是，在AI的大国竞争中，中国的优势在制造能力，以宇树为代表的机器人产业承载了这种期待。</p>\n  <p>宇树IPO估值为610亿。不过，<strong>“上市后的市值超过2000亿很合理，我觉得短期都有可能超过4000亿。这对比海外同类公司估值，并不算夸张。”</strong>宇树投资人早期投资人、敦鸿资产合伙人俞文超告诉36氪。不止一个人相信，宇树就是机器人界的苹果、王兴兴就是机器人界的马斯克，“上市后一切皆有可能”。</p>\n  <p>一些没有参与宇树融资的投资人则觉得难以理解，“这是疯了吗？圈子里的人已经疯狂到这个程度了？ 几千亿太夸张了！它2025年营收才17亿啊！”</p>\n  <p>从来没有一家硬件公司，能以十几亿的营收体量获取到如此亢奋的关注和估值。<strong>8月10日，宇树科创板IPO开始打新，中签率仅万分之二——对应着约219倍静态市盈率。而它所属的“通用设备制造业”行业静态市盈率只有38.56倍。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_cf1663c0f33d4c6781c3688ba5b27be9@1199336245_oswg41480oswg1080oswg562_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">4家硬件公司IPO市值与营收对比。备注：初始PE按扣非前后归母净利润孰低值计算，小米采用经调整净利润计算</p>\n  <p>在宇树当前的市值中，一部分源于宇树自身的努力，它努力长成了森林里最高的那棵树；而另一部分，无疑是国家战略、行业下注、民间情绪共同作用的结果，这些构成了它脚下高高隆起的山脉。</p>\n  <p>机器人被写入“十五五”规划，国资机构纷纷下场参投，上市通道的打开……这共同造就了过去三年具身智能赛道融资额的跳跃式攀升，百亿估值公司层出不穷，而各路产业人士也纷纷创业、跳槽，投身其中。&nbsp;</p>\n  <p>看过春晚、期待某天用上机器人保姆的老百姓目光投向它，期待分一杯羹的投资人和股民的目光投向它，机器人产业的同行眼光也投向它——宇树作为整个行业的标杆和锚点，如果它能站稳千亿级市值，那些以几十亿、上百亿乃至数百亿估值投了具身公司的投资人，就能感到心安；如果它意外破发，全行业都会为之胆寒。随着上市鼓点逼近，所有人都在躁动中等待宇树给出一个公开市场的价格答案。</p>\n  <p>于是，在所有人的目光中，宇树成为了山顶上的那棵树。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_2221a62c3e03435f9fda3211989c858c@1199336245_oswg365015oswg1080oswg944_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树大事件和对应的估值变化，图片来自公开信息、访谈</p>\n  <h2><strong>估值1亿级：集体错过宇树那一年</strong></h2>\n  <p>2019年3月，当德讯投资总监周华林、投资经理邓一恒、投后负责人付郝见到王兴兴时，宇树公司账上只剩下小几十万——可王兴兴看上去一点也不着急。</p>\n  <p>周华林有些意外，因为宇树看着就不太宽裕。办公室不过是栋破旧写字楼里两小间，二三十平，看着像个实验室。墙上挂满电子元器件，地面、办公桌上散着机器狗身上的零件，几乎找不到落脚的地方。</p>\n  <p>一行人只能到一楼大堂找个空地聊聊，行人来来去去，自动门总在一开一关，间歇灌进一阵冷风。杭州的1月不过几度，他们缩着脖子，说上几句话，身上就冻僵了。“冷得我！”周华林对此印象深刻。</p>\n  <p>王兴兴对拿钱不太积极。他只想要400万，但德迅投资的创始人曾李青却拍板，想塞给他上千万。</p>\n  <p>风投对王兴兴也不太积极。当时，王兴兴创业2年，宇树估值不到1亿元，已经在投资人圈子里碰了很多次灰。</p>\n  <p>在当时，投资宇树不是主流选择。</p>\n  <p>杭州还有另一家机器人公司云深处，号称「中国版波士顿动力」。它的创始人朱秋国是浙大控制学院的教授、已经在业内小有名气，主持过国家级大项目，创业之初几乎没有缺过钱。在2019年，大多数投资人都会选云深处。</p>\n  <p><strong>2019年，云深处的估值已经达到2-3亿元，是宇树的2倍以上。</strong>“浙大的控制学院比较出名，大家肯定是选择那个创始人背景更好的”，一位投资人回忆道。</p>\n  <p>对比云深处，王兴兴和宇树显得很暗淡。初心资本的管理合伙人田江川记得，自己在内部纪要中，对王兴兴写下的评论是：「背景草根」——他不过是个普通211院校毕业的学生创业者，只在大疆工作过三个月。和不熟悉的人相处时，王兴兴还总是板着脸，看着有些紧绷。</p>\n  <p>当投资人问他，你打算怎么让机器狗赚钱？王兴兴很老实地回答：在没有电梯的小区爬楼送快递。这也是一个令投资人摇头的答案。</p>\n  <p>后来投资圈曾集体反思：为什么会错过宇树？但回到2019年，面对这样的创业者和公司，多数投资人就是“投不出手”。</p>\n  <p>田江川后来自我剖析：<strong>“问题主要出在了我精英主义的傲慢，我认为机器人行业需顶尖学府背景，王兴兴毕业于上海大学，认定这样的背景不匹配行业需求和基金偏好 ——这无疑是巨大的误判。”</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_9be8d921bb4b43f3810de366a267cc36@1199336245_oswg114375oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树新总部 拍摄：邱晓芬</p>\n  <p>况且，宇树还走了一条和主流不同的技术路线。</p>\n  <p>在宇树创业的2016年前后，国内大部分机器人公司都对标波士顿动力，采用液压的路线。“那个时代就是Copy From America。”一位宇树早期投资人告诉36氪。</p>\n  <p>液压的原理是，靠高压油液推动关节里的活塞伸缩发力，把压力转化成机械力。整个过程类似于人类肌肉收缩。</p>\n  <p><strong>周华林清楚记得，自己问王兴兴：你为什么不走液压路线？王兴兴还有些生气。</strong></p>\n  <p><strong>他很直接地回答：液压一定跑不出来。第一，液压杆是高精密机械，美国人做得小且细，中国人做不了那么细；第二，液压成本降不下来；第三，液压控制的精确度不够，很难做出一些精细的动作。</strong></p>\n  <p>对比液压，王兴兴选择的电机方案无法实现高功率输出，但是操作简单、成本低，精度也更高。</p>\n  <p>事实印证了王兴兴技术判断的超前性。2024年4月，波士顿动力正式退役液压版Atlas，转头拥抱宇树自2016年就开始坚持的电驱方案。</p>\n  <p>王兴兴的思路并不学院派，而是很早就指向成本和规模化。<strong>他曾经告诉祥峰投资创始人郑俊聪，宇树研发的出发点就是低成本，高可靠性，实用性。“把四足机器人真正推向大众生活。”</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_b8eccef7c796475eb00c365ed2730266@1199336245_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">投资人拍的宇树机器人狗</p>\n  <p>为了实现这个目标，王兴兴从零开始搭建了一套自己的系统。</p>\n  <p>宇树做直驱后不久，国内机器人创业公司也开始沿用类似的思路。但这些公司都有一个模版：用瑞士Maxon的高速电机、搭配绿地谐波的谐波减速器。</p>\n  <p>这套方案的原理是，高速电机体积小转速快，但力量小，加上一个谐波减速器，就像加了一个放大器。减速器会压低电机转速，并将扭矩放大几十至数百倍，帮助机器人完成负载任务。</p>\n  <p><strong>但宇树走了一条相反的路，也就是准直驱（QDD），用低速电机、再搭配行星减速器。好处在于，低速电机虽然转速低、体积大，但本身力量大，因此降低了对行星减速器的要求，只要稍微放大一点扭矩就可以达到标准。</strong></p>\n  <p><strong>更重要的是，谐波减速器齿圈薄如蛋壳，一摔就碎，单价动辄数千元——相比之下，行星减速器是常见的工业标准件，成本才几十元，而且很耐用。</strong></p>\n  <p>除了动力系统，王兴兴甚至重新改造了行业沿用多年的结构方案。</p>\n  <p>以电机分布为例，同行沿用的基本是来自瑞士ANYbotics的方案——将两个电机装在大腿上，一个电机装在膝盖上，三个电机分别负责三个动作——这样的问题是下肢质量太重，耗电量大。</p>\n  <p>宇树的电机都集中在髋关节，小腿只留一根轻轻的连杆，可以跑很远，也减少维护难度。这种架构创新，补上了电驱路线爆发力和扭矩稍低的短板。</p>\n  <p><strong>“我看完了它的结构之后，我就觉得这是一个天才的设计。它一定是经过好多次迭代，最后就发现就是这个结构最好。”周华林对</strong>36氪<strong>表示。</strong></p>\n  <p>最终历史证明，宇树扮演了技术引领者的角色。此后国内大部分机器人公司的腿部方案，都默认沿用宇树这套“电驱+低速大电机和行星减速器+三电机全近端\"的底层设计。</p>\n  <p><strong>而太超前、太与众不同的后果，就是王兴兴根本找不到核心零件供应商。</strong></p>\n  <p>根据一位从业者回忆，当时四足机器人的供应链可以说“几乎为零”。能做关节的都是小作坊，根本没有“一体化关节”的概念，电机、减速器、控制器分散在不同供应商手里。“你要把它们拼起来，模组又大又重，狗只能勉强自己走两步，没有实用价值。”</p>\n  <p>市场上使用最多的电机追求高转速，扭矩（也就是旋转力大小）不大。但王兴兴要的电机低转速大扭矩，能带动关节运动，和主流技术路线相悖。况且，王兴兴机器人要用的是内转子电机，也就是电机在内部转，而市场上大多数都是无人机、高速吹风机使用的外转子电机。加上王兴兴设计的电机重量比行业对标产品轻一半，市场上找不到成熟标品。</p>\n  <p>能买到的电机都不好用，如果要定做，宇树早期一年订单就几十台，“去敲卧龙、鸣志这些上市公司的门，人家根本不搭理。”一名离职员工对36氪回忆。</p>\n  <p>四处碰壁后，王兴兴意识到：“整机厂要像苹果一样，核心东西自己掌握，才能按自己的想法重塑供应链，而不是被供应商卡脖子。”<strong>没办法外采，他就买来硅钢片、铜线，缠出想要的电机。</strong></p>\n  <p>“我都震惊了，这就很大疆。”周华林回忆看到王兴兴手搓电机时的感受。</p>\n  <p><strong>电机是机器人核心，如果自研，意味着整个系统都要配合电机设计。</strong>王兴兴干脆自己画减速器图纸，做电缆，买电池拼成电池包。连少数外采的控制板上，操控程序也是王兴兴用Linux敲出来的。</p>\n  <p>这种从底层代码到零部件全栈自研，成为宇树最浓厚的底色。</p>\n  <p>在深圳多年，周华林很清楚大疆对核心部件的把控到��什么地步。后来周华林知道王兴兴在大疆工作了一���时间，还和汪韬关系不错后，理解了王兴兴行事风格的起源。</p>\n  <p>“像一个小大疆”，成为德迅押注王兴兴的一个关键原因。“作为一个深圳的投资机构，我们清楚知道大疆是怎么成长起来的。”周华林表示。</p>\n  <p>但当时并非每个投资人都看到了这点。2019年宇树还未大规模开展商业化，投资人只能对人、产品做判断。</p>\n  <p>有业内人士告诉36氪，2019年，有投资机构在某硬件业大佬的推荐下尽调了宇树，但是看到这家公司的账面现金岌岌可危后，担心这笔投资成为“坏账”而退却了。也有机构负责人提出质疑：“地上跑的大疆？不应该是四个轮？为什么需要四条腿？”</p>\n  <p>对于这家非主流公司，可以拒绝它的理由太多了。</p>\n  <h2><strong>估值10亿元级：小众的商业化</strong></h2>\n  <p>要获得更广泛的认可，商业收入是一种更通行的证明。但宇树的商业化路线，投资人也没有特别买单。</p>\n  <p>因为宇树业务上限看起来并不高。很长一段时间中，宇树最坚实的现金流来自大学、科研机构。宇树为后者提供机器狗demo、供二次开发。之前这些院校做科研，只能买波士顿动力的Spot，最便宜的版本都要7.5万美元，而宇树的Aliengo便宜三分之一。2019年，宇树在一次国际展会上接触到这些客户后，就将他们当成了基本盘。</p>\n  <p>当时，其他的商业化路径看起来更具想象力：好几家做四足机器狗选择做C端家庭陪伴，都拿到了投资。但这个宏大叙事难以落地，后来被判定为至少“早了五年”。</p>\n  <p><strong>科研赛道天花板不高——2019年，宇树累计有27个客户、33台订单，交付了8台——但是一门很落地、很省心的生意。</strong></p>\n  <p>首先，科研机构成单周期长，但出手很大方。根据36氪了解，宇树最开始定价在2万到3万美元之间，后来发现客户们对价格不敏感，才拉到了4.5万美元。普通产品高端版本修改代码，再加个芯片模组后，就能以教育客户专属EDU版本，多卖数万元。</p>\n  <p>更重要的是，这群客户也不用宇树花太多心思维护。宇树只用卖标准化硬件，用户自己DIY。宇树还配上了全栈自研的开放底层接口，让教授能随意修改算法。甚至，王兴兴还亲自下场，编写了《四足机器人控制算法》供高校做课本参考。</p>\n  <p>这就避开了做B端生意高单价、但高运维成本，导致“接一个项目亏一个项目”的恶性循环。</p>\n  <p>王兴兴很清楚自己的能力边界。</p>\n  <p>创业早期，宇树一度想过，除了教育科研市场，做更多电力巡检类业务，但很快回撤。他们发现，对电网这类大客户，公司必须做场景适配，工程师要长期驻场、重交付、重集成。“你一个项目就几个人，一个项目才几十万这种客单价去做，要堆多少个项目营收才能上去？数百人左右的公司，根本不可能的。”一位宇树内部人士对36氪分析。</p>\n  <p>机器狗A1发布之后，宇树的出货量开始增加，王兴兴更是果断转向了标品。一家媒体此前曾经写到一个细节，销售团队为了拿订单、给客户承诺可以做定制化开发，每一次都会被王兴兴“痛骂”回去。</p>\n  <p>甚至在教育类市场，宇树也只聚焦大学和科研院校。对比看，当时有其他机器人公司做教育类客户，但要的是“全球教育”，年龄段覆盖幼儿园到大学，业务涵盖课程、教材、在校运营，还花了很大力气搞售后。这是个很性感的故事，上限高、门槛高。但真实回报率远不如宇树。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_e28848fb8ace4a2793b5ea034e778100@1199336245_oswg253925oswg1080oswg463_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树A1</p>\n  <p>而王兴兴的打法很实际。他曾经在一次采访中提到，就是 “农村包围城市”——在波士顿动力等机器人巨头的包围圈外，先找到一些简单的、客户能接受的市场。</p>\n  <p>这些小市场帮宇树跑通了早期闭环。它们锻炼了宇树的产品能力，形成从生产研发到销售的完善架构。其次，宇树在这个过程中可以发现非常多的问题，保证了一年能有一个大的机器人迭代节奏，实现批量量产。</p>\n  <p>底层的原因或许更直白：<strong>“我们公司一开始体量比较小，可能是有意的，或者说我们也只能选这条路。”</strong>王兴兴有一次坦承。某种意义上，宇树早年的弱小，恰好将它推到了一条少有人迹，但相对平坦的道路上。</p>\n  <p>作为一家硬件公司，宇树的商业逻辑一直很清晰：不断迭代性能、降低成本。 “先把硬件做好、成本降下来，大家能看到产品在卖，心里踏实。”一位员工对36氪评价。</p>\n  <p>王兴兴有技术的坚持，却没有清高。他曾经接受采访时说：“很多移动机器人产品，它是个论斤卖的东西，多重就卖多少钱，因为零部件就是材料成本，再加一部分机械成本，加工就好了。我们是论斤卖的，小的卖便宜一点，大的卖贵点，跟猪肉没多大差别。”<strong>他在2019年已经和投资人拍胸脯：“5年后，机器狗（人）完全可以做到2万元左右。”</strong></p>\n  <p>在这样的思路下，王兴兴对宇树的成本把控到了执着的程度。他会计算一个电机上有多少克金属、多少克铜、多少克塑料，然后划一个固定的底线，所有人的终点就是达到这个底线。</p>\n  <p>这种做法很容易想到马斯克做SpaceX的风格，同样也是拆解成本，将看似高不可攀的火箭拉回了地面， 分解成一张张可降本的零件、材料、工艺成本单。</p>\n  <p>一台四足机器人最大的成本就是电机，用MIT的电机直驱方案，加上行星齿轮组成的关节，成本要到整机成本的 50% 以上。</p>\n  <p><strong>宇树一只机器狗需要12个电机，如果外采，一个电机就要3000-5000元，而宇树自研，单个售价在官网1300元。 “集成商若想掌握主动权，必须自研电机与传动系统。”一位行业人士分析，“把最核心的电机、关节给做好，其他的全部都可以降，成本可以卡得很紧。”</strong></p>\n  <p>至此，宇树已经建立起了一整套降本方法论。自研产品之间的元器件可以共用，不同系列生产时，只用更换一些外观结构件。随着系列增加，宇树可以摊薄成本，到2020年机器狗A1推出时，价格就来到1万美元内。2021年，宇树发布了Go1，面向科研机构和学校销售，最低版本的售价才1.6万元，比其他家成本还低。</p>\n  <p><strong>“宇树每款产品出来，所有人震惊，‘完蛋了，被革命了’。”一位行业人士评价。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_3966e11ea361411fb0d4213bd7570ccc@1199336245_oswg105313oswg1080oswg724_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树Go1 图源视觉中国</p>\n  <p>通过一手做“标品”市场，一手极致控制成本，2020年，宇树开始商业化的第二年，就实现了盈利。</p>\n  <p>不过，这个成绩在讲究“梦想上限”的风险投资人看来很不起眼。科研还是个利基赛道，哪怕宇树后来拿下全球科研60%的份额，也不过十多亿营收。这一年，机器人赛道拿钱最多的是工业机器人、手术机器人、仓储机器人，机器狗公司甚至排不上前十。</p>\n  <p>因此，宇树还是没有成为专业投资市场的“共识”。</p>\n  <p>不过，宇树也抓住了一个小机会。2021年、宇树的机器狗第一次登上春晚后。随着这次和几位明星的同台表演，宇树拿下不少B端大客户，包括巡检等。这年公司人数来到百人，有几千万的年营收。</p>\n  <p>也是这次春晚几个月后，宇树完成了一笔顺为资本领投的千万美金A轮融资，公司估值来到十亿级别。</p>\n  <p>这场春晚让宇树在一级市场露了脸，但机器狗终归是个老产品，谈不上破圈。一位投资人向36氪回忆，宇树B轮融资前，他们给宇树对接了近二十个机构，最后无一人下注。</p>\n  <p>那几年，宇树小而美地活着，但无可避免地陷入了很多技术型公司的迷思。手握专利、独家技术、能量产，但无法跨越从小众到大众的鸿沟。</p>\n  <h2><strong>估值30亿+：人形机器人东风下的“完美标的”&nbsp;</strong></h2>\n  <p>2022年10月，当马斯克在特斯拉AI日发布擎天柱时，他应该没有料到，自己会在大洋彼岸催出一家现象级公司。</p>\n  <p>宇树已经成立6年了，还是不温不火。它自给自足，有订单，有口碑，但讲不出足以打开估值上限的新故事。</p>\n  <p>在机器狗以外的赛道，王兴兴似乎没什么野心。他不是马斯克那样追逐风险的狂热分子，而是一个实用主义者。王兴兴在媒体采访中提到过，早在2021年，就有投资人问他，要不要做人形机器人，他没有入场，因为他认为“ 人形机器人已经火了很多年，马斯克做之前，这个方向已经到低谷期。我也没听说有人要买（人形机器人），圈子里都是悲观态度。”</p>\n  <p>直到特斯拉发布了擎天柱，Chat GPT全球爆发，AI智能涌现，王兴兴才决定正式立项做人形机器人。“他不这么选，他投资人都会逼着他这么选，他员工会逼着他这么选。”一位投资人说。</p>\n  <p>但最开始，王兴兴无法笃定这个项目能带来多大的回报。他只调集了3名全职员工研发人形机器人，机器狗团队时不时搭把手。后来的故事已经被讲述了无数次：这几个人只用了半年，在2023年8月就推出了第一代人形机器人H1。</p>\n  <p>H1身高180，售价65万元。但拆解看，<strong>这是个很轻巧的试水产品。H1的关节模块和电机直接复用四足大狗机器人，只是调整了一些参数，没有倾注过重资源。而且，宇树对它的定位是走科研市场， “用机器狗的架构做人形骨架，能走、能二次开发”就行，不用太完美。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_dec0d60e95a445ceb6b7e6f3c3c3c7a1@1199336245_oswg606067oswg1080oswg646_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树H1 图片来自网络</p>\n  <p>这款产品承担的角色，只是在人形机器人赛道占好位。宇树或许没有想到，市场情绪的季风会变化得如此迅速。</p>\n  <p>当马斯克和GPT的两股风从硅谷吹来，国内新成立了一众人形机器人公司——智元机器人、银河通用、加速进化等等。2023年10月，工信部印发《人形机器人创新发展指导意见》，机器人赛道到了大笔押注的时刻。根据公开数据，人形机器人领域融资金额在2023年达到54.7亿元，为十年以来的峰值。</p>\n  <p>新成立的很多具身公司创始人光环耀眼，老牌机器人公司里，傅利叶比宇树更早一个月发布人形机器人，但宇树有后来者难以补上的长板：它率先跑出了利润。</p>\n  <p>一位投资人告诉36氪，2023年看了一圈人形机器人公司，唯一赚钱的就是宇树。根据招股书，2024年，宇树的营收已经来到3.93亿元，净利润9547万元。</p>\n  <p><strong>“这一波人形机器人公司才刚刚起步，上一代机器人公司都处于亏损状态，你上哪找宇树这种这么能高毛利率和收入的公司？”</strong></p>\n  <p>2024年，宇树以人形机器人的叙事，时隔两年完成了新一轮融资，金额10亿元，算当年较大的一笔融资，估值在30亿上下。</p>\n  <p>宇树还是那个宇树，它的底色没有变。只是此刻蜂拥而至的投资人们终于发现，它就是全市场最稀缺的优质标的。</p>\n  <p>它的成本控制很强悍。2024年8月，宇树又用了半年，推出了一款震动行业的产品，价格9.9万的小机器人G1。对比看，同行的成本可能都高达十多万，宇树击穿了行业底价，还能有不错的毛利。</p>\n  <p>以这样的低价，宇树的硬件可靠性却明显领先同行。郑俊聪表示<strong>，</strong>宇树把本体做到几万块，就像是当年IBM造出了PC，之后大家才能在上面开发软件生态和应用。</p>\n  <p><strong>一位前员工告诉36氪，他们产品之所以稳定，最核心的就是电机性能好。以瞬时功率为例，性能越强，意味着机器人在做剧烈动作时，能持续更久不会过热，可以在极端工况下工作更长时间。</strong></p>\n  <p>宇树的员工曾经在一次比赛上看到对手的产品没有手臂，他们还研究了很久，以为对方是故意这样设计的，结果后来才发现是摔倒后掉落了。但宇树自研电机，机器人在极限场景测试中摔倒，也不会出现彻底脱落的情况。</p>\n  <p>虽然还没有到国民热度，但当人形机器人赛道成为风投们的新共识后，宇树成了一级市场哄抢的目标。</p>\n  <p>2024年，因为某些外部原因，有的早期资方部分退出了宇树，导致老股短暂在市场上流通了一段时间。</p>\n  <p>这些老股堪称香饽饽。一名知情人士告诉36氪，当时，有机构刚释放退出消息，电话就响个不停，其他资方甚至愿意加十亿溢价接盘。这家机构里所有的同事都被电话骚扰了几天，对方只关心一件事：“你到底有没有老股？”到2024年底，宇树估值已经来到80亿。</p>\n  <p><strong>“2024年是大家对于宇树还有分歧的最后一年，现在看来正好是他快要起飞的节点，竟然有机构不到50亿出了，这种大羊毛你就该死命薅！”前述知情人士评论。</strong></p>\n  <p>这是最后的入场机会。几个月后，一切怀疑和犹豫都尘埃落定，宇树将不再只是一家创业公司，它将成为中国硬科技版图上最明亮的那块图腾。</p>\n  <h2><strong>估值120亿：国民公司的诞生</strong></h2>\n  <p>虽然表面看上去不懂变通、有些严肃，王兴兴其实明白如何借势。他曾经在媒体采访中说：当你做的事情符合时代的主旋律，好的资源都会向你倾斜。</p>\n  <p>当2024年年底，蛇年春晚导演组邀约数家人形机器人公司时，只有王兴兴没犹豫就答应了。而其他公司拒绝，各有各的“卡点”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_f0db00a8d14e4738a1fa5880953ec34c@1199336245_oswg1275432oswg1080oswg559_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《秧BOT》图片来自网络</p>\n  <p>机器人公司A拒绝，主要是因为“没有人形机器人可上”，该公司一前员工对36氪说。尽管公司早在多年前就发布了人形机器人，但量产上却没跟上，因此错过了年初春晚的节点。</p>\n  <p>机器人公司B有能够格上春晚的人形机器人、场景也算适配，但卡点却在于“账”算不过来。</p>\n  <p>机器人公司上春晚，导演组不会为此付费，所有成本都由企业自己承担。这意味着，一家机器人公司不仅要押上大量机器，还要把算法研发人员“押”在北京整整三个月。</p>\n  <p>一台1.8米高的人形机器人，每次上下场都需要两个人搬运；而2024年的人形机器人还很粗糙，算法无法通用，基本上一台机器人就要匹配一名算法工程师——按最低限度计算，投入的人力也要达到20人以上。</p>\n  <p>更棘手的是，春晚排练期恰逢年末，正是机器人公司全力扑项目交付的时候。对于这样一个极其重交付的行业来说，抽调核心人力去配合一场“不收费”的演出，本质上是一次高成本的品牌豪赌。</p>\n  <p>根据36氪了解，B公司内部曾评估，算上各种零件损耗、人力成本、往来杂费，一场节目成本达到2000万。参与春晚意味着，要为了这一个五分钟的节目花掉年营收的 1/10。<strong>“在市场还没完全起来的情况下，一般人没这个魄力，”一位知情人士表示。</strong></p>\n  <p>当其他人质疑上春晚的效用时，王兴兴却推出了筹码。</p>\n  <p>宇树以前就吃到过机器人舞台表演带来的流量红利。</p>\n  <p>2021年首登春晚、估值过十亿之后，宇树陆续参加了几次大型官方活动，包括2022年冬奥会和2023年的亚运会。2024年，宇树12台H1登上了澳门美高梅剧院，和真人一起扭秧歌——这个节目算后来春晚《秧Bot》的预热，同样都由张艺谋导演的人机共舞。</p>\n  <p>有知情人士称，平时的王兴兴，是个发现会议室遥控器用南孚电池都会@行政、让其换成白牌的老板，不过在春晚这笔开销上，王兴兴毫不犹豫。“有些重要决策是要有商业直觉和魄力的。哪怕投入产出比算不过来，但事情足够重要，长期方向正确，他也会支持团队把这事做好”，俞文超表示。</p>\n  <p>王兴兴很重视这次春晚表演。有知情人士称，当时宇树其他的订单都往后排，优先保证春晚机器人供应。演出前，他留在现场，团队连续几天不睡觉排练。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_56d3da71a94d4f21a99412d5172c77f2@1199336245_oswg74193oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2026年春晚后台的王兴兴 邱晓芬拍摄</p>\n  <p>后来的效果出乎所有人预料。有参与者评论，效果“炸裂”。2025年春晚播出那天晚上，前述拒绝上春晚的一家机器人公司老板本来还在群里发过年红包，看到宇树节目后，红包直接停了，“感情很复杂，没想到他们能做那么好。”一位员工回忆。</p>\n  <p>2025年，宇树能抓住改变命运的5分钟，背后夹杂着运气，也源于过去十年的积累。<strong>“十年磨一剑，那么多年的积累，只不过是到这一刻的机缘巧合下，让它完全爆发出来，呈现在大家眼前。” 一位投资人感叹。</strong></p>\n  <p>这台节目正好踩在大国科技竞争的情绪点上。中国要证明自己的科技实力，宇树的出现恰逢其时。</p>\n  <p>春晚后，订单向宇树蜂拥而来。之前一天出货十几台，后来涨到四五十台，最忙的时候每天要发100多台机器狗和机器人。王兴兴很有危机感，他在公司大群说过：宇树发不出货，客户就会被同行抢走，所以全员提效。</p>\n  <p>那段时间，发货、装配的人数涨了一倍，员工全员到岗，连续两周都实行“早8晚10”工作制，期间只休息了一天。一位前员工回忆，“上班上到吐了。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_e3ae9dc10c174164a72d3aa60ec3ecc4@1199336245_oswg46457oswg1080oswg445_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树收入占比</p>\n  <p>宇树成了一家普通投资人根本高攀不上的公司。它的估值从春晚前的80亿一路抬升，到2025年中旬完成7亿C+轮融资时，估值已经超过120亿元。投资方只有6家，包括中国移动、腾讯、阿里、蚂蚁、吉利和字节背景的锦秋。</p>\n  <p>这是宇树精心挑选的名单，据说一家头部汽车集团，最终没能进入投资名单。投资方中，有家是一把手给王兴兴亲自打电话，才拿到份额。</p>\n  <p>所有投资人心照不宣：宇树到A股IPO不会太久，这笔交易稳赚不赔。</p>\n  <h2><strong>600亿发行价、千亿共识：宇树不能走下神坛</strong></h2>\n  <p>宇树上市的意义，远不止于一家公司的上岸，它将为整个具身智能行业定调。</p>\n  <p>在宇树酝酿上市的近半年，中国具身智能行业正呈现一副疯狂爆火的图景。</p>\n  <p>2026年上半年中国具身智能融资总金额接近1000亿，一年内迅速提升了五倍。在过去的中国，几乎没有一个硬件产业有过如此夸张的资金聚拢速度。具身智能机器人也成为继大模型、 AI芯片产业链之后，2026年中国一级市场资金的第三大去处。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_3b14ddb016034ccc8a3a7c8e59c23409@1199336245_oswg59334oswg1080oswg819_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中国具身智能融资规模与事件数</p>\n  <p>半年内，整个赛道催生出23家百亿估值的机器人公司、八家公司估值突破200亿。“去年大家还会盘一盘百亿公司，今年大家已经懒得盘了”，一位机器人领域的投资人直言。</p>\n  <p>她与36氪分享了这样的感受：上半年，任意一家头部具身智能公司，几乎隔一个月没关注，估值立马暴涨或翻倍。“以前大家讲究投小投早，但<strong>2026年的中国具身智能，只有早，没有小”</strong>。</p>\n  <p><strong>“这已经是一个二级市场的问题了，大家都有上市预期，不是一级市场的范畴。”一位投资人告诉36氪。</strong></p>\n  <p>机器人被写入“十五五”规划，国资机构纷纷下场参投，上市通道的打开……整个具身赛道���经被拱上高山。但走到上市前夜，套利者无法回避的是：这些百亿估值的公司，在公开市场的价格到底会是多少？很难判断，公共市场会不会为梦想买单。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_1bcaca66fdbc4912b49b1bec2b57e587@1199336245_oswg139893oswg994oswg1122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2026年待上市具身智能公司</p>\n  <p>很多年中，资本市场给一家中国创业公司定价有清晰的路径，也就是对标美国同类公司。“美国每出现一个一万亿美金估值的公司，中国都会对应出现数个一万亿人民币估值的公司。”投资人对36氪说。</p>\n  <p>但具身智能赛道主要在中国遍地开花，在美国找对标已经不太合适。作为中国人形机器人赛道里收入最高、毛利率最高的公司，宇树才是最好的风向标。</p>\n  <p>投资人希望宇树的IPO稳定整个行业的军心。此前，投资者对于具身智能/人形机器人的情绪常在两个极端之间摇摆——“要么觉得机器人马上进千家万户，要么悲观判断机器人落地还很遥远��，俞文超向36氪表示，而宇树的上市首先证明了，这个行业已经有百亿级的市场需求，且起码能容纳一家或多家上市公司。</p>\n  <p>同时，宇树的上市提供了价格标尺，一旦企业能够复现宇树的出货量规模、商业化能力，或者是能成为「宇树第二」、「大脑版宇树」，就有机会在资本市场获得类似的估值认可。</p>\n  <p>宇树此次登陆科创板IPO估值为609亿元，价格不低。不过，<strong>多数投资人向36氪宣称，宇树上市后大概率估值会到1500亿元，高点可能到3000亿。</strong></p>\n  <p><strong>当36氪询问判断标准是什么？一位投资人坦诚回答：“拍脑袋想的。”</strong></p>\n  <p>无论如何，早期投资人都将在二级市场获得巨额回报。“这就是20年一遇的项目。”一位宇树投资人感叹，他从这一个项目获得了数百倍的回报。他给36氪讲述了很多个投资的理由，<strong>但最后说：“我到这个岁数了，有时候想想，那时候能投中宇树，也许就是老天给我的，让我遇到了有天命的这个人。”</strong></p>\n  <p>但在第一波高昂的市场情绪消退后，宇树能维持怎样的价格？</p>\n  <p>宇树并非毫无短板。目前，宇树最大的压力来自如何给\"大脑\"补课。招股书直言，公司前期研发投入侧重本体与运动控制，在具身大模型方面投入较少，且尚未大规模开展真实数据采集与工厂部署训练。在42亿元的募资中，有一半将集中投向智能机器人模型研发。</p>\n  <p>36氪获悉，数十人的大模型团队由王兴兴直接带领。在技术不收敛的情况下，对于王兴兴和宇树来说，正像是十年前那场开荒战争的下半场。</p>\n  <p>在极度充沛的投资，和对机器人前景的憧憬下，宇树如今竞争对手如林。2026年，中国出现了400家具身智能公司，不仅包括拿到了大钱的新公司，还包括汽车公司、手机公司、硬件供应链龙头。</p>\n  <p>上市前夕，宇树内部的情绪也是分化的。</p>\n  <p>有内部人士告诉36氪，宇树为员工设置的认购门槛不低，100万起认购，按发行价无折扣购买，锁定期为一年或三年不等。</p>\n  <p>尽管条件看似苛刻，宇树研发部门几乎过半人数认购。其中，王兴兴个人出资了1500万，三位技术核心张阳光、杨知雨、吴金泽更是各自认购了900万元，这些核心高管的锁定期长达3年。</p>\n  <p>也有人在冷眼旁观。没有买期权的员工讲述了各自的担忧——有人觉得期权购买门槛过高，没有折扣；也有人担心锁定期过长，害怕行业会在一年或三年后进入波谷。</p>\n  <p>在破圈走红的一年半，宇树估值翻了近五倍（从120亿到600+亿），并迅速走到上市，但在不久前接受《TIME》杂志专访时，王兴兴却说这种“病毒式走红”给宇树和全行业带来了巨大压力。</p>\n  <p><strong>“所有人都期待宇树的技术极快飞跃，而实际上，硬核技术无法一蹴而就”，王兴兴判断，要跨过泛化性这一令人头疼的技术拐点，至少还需要2-10年。</strong></p>\n  <p>在这个燥热的夏天，这番冷静的坦承也许很快会被喧嚣所覆盖，直到某天，中国具身智能行业的真实成色终于面临淬炼。</p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260810/v2_51124729e0aa4fb19aff5ae518a5c40a@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-08-11T01:00:00+00:00", "fetched_at": "2026-08-11T01:18:32.552005+00:00", "fingerprint":
