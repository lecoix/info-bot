<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

/p>\n  <p>2021年，她创立蚁触科技，围绕触觉反馈模型与多模态交互技术，打造了触感广告、触感营销、触感座舱，服务LVMH、开云、奥迪等客户，曾获红杉中国投资。</p>\n  <p>2025年她开始前往香港科技大学（广州）人机交互实验室开展研究，并于2026年开启新创业项目。SYNAPUFF另一位联合创始人兼首席科学家为范明明博士，现任香港科技大学（广州）常聘副教授、博士生导师，长期从事人机交互与人智协同领域的人工智能研究。</p>\n  <p>在2026年10月最新发布的全球Top2%顶尖科学家榜单中，范教授凭借对human factor及人工智能领域的研究成果上榜。</p>\n  <p>过去几十年，人机交互的基本逻辑始终是由人主动发起——无论是键盘、触摸屏，还是语音助手，都是用户发出明确指令，设备作出相应反馈。</p>\n  <p>但当AI成为终端的原生能力，智能体开始具备持续感知环境、理解情境、主动提供服务的可能性，传统的“指令—响应”模式也开始显现局限。</p>\n  <p>尤其是，当基础大模型公司开始将能力延伸至各类智能终端，AI的任务理解和执行能力有望进一步提升。</p>\n  <p>相比之下，如何理解人的意图、判断互动时机，并以恰当的方式作出回应，仍是一个尚未充分解决的问题，也正成为行业新的竞争焦点。</p>\n  <p>SYNAPUFF将自身定位为面向AI Native终端的交互智能公司。李诗淼向硬氪表示，她们希望提升的是智能体的“情商”。但这并不只是识别用户情绪，而是让智能体具备理解交互情境、判断互动边界和动态调整自身行为的能力。</p>\n  <p>例如，机器人知道用户可能口渴，但如果对方正在开会，直接递水未必合适。因此，机器人需要结合环境、用户状态和互动历史，判断自己的动作何时介入、如何回应，以及何时退出。</p>\n  <p>为此，公司提出“P Framework”——尝试将传统的“感知—理解—行动”，转变为“试探—接收反应—决策-接收反应-决策”的交互闭环。</p>\n  <p>也就是说，智能体不必一开始就准确理解用户意图，而是可以先通过眼神、身体转向、声音或其他轻量化交互信号表达意图，再根据用户回应，决定继续、等待或退出。</p>\n  <p>具体而言，“P Framework”主要包含三个组件：互动动态模型，预测行动可能引发的用户反应；人格策略，根据角色、关系和行为约束选择动作；non-verbal behaviour生成模型，动态调度不同模态介入交互。</p>\n  <p>不过，这套架构并非要重新训练所有底层能力，而是希望组织已有的视觉识别、情绪识别等模型，并结合原生的非文本语言动作生成能力，形成独立且能够适配不同终端形态的交互决策框架。目前，公司表示正在训练相关模型。</p>\n  <p>数据也是这套模型的关键。</p>\n  <p>李诗淼向硬氪表示，SYNAPUFF计划通过标注受控实验数据、公开影视数据、真实场景部署积累互动数据，并通过对照不同动作及用户反馈，训练模型优化互动策略。</p>\n  <p>与主要围绕任务是否完成来评价模型不同，交互智能还需要关注一个行为是否在合适的时机发生、用户是否愿意回应，以及交互能否自然持续。这意味着，模型需要从人与智能体的双向互动中获得反馈，而不只是判断一次指令有没有被正确执行。</p>\n  <p>在未来的商业模式设计上，公司希望围绕交互智能技术平台，与不同类型的AI Native终端企业探索技术合作及商业化路径，核心目标是将互动决策能力做成可跨不同构型终端复用的技术能力。</p>\n  <p><strong>以下是硬氪与李诗淼的访谈（略经摘编）</strong></p>\n  <p><strong>硬氪：你的职业经历看起来比较多元，为什么最终选择进入AI Native终端交互领域创业？</strong></p>\n  <p><strong>李诗淼：</strong>我高中时就发现，自己对创业很憧憬。比起帮助人们完成任务，我更想创造让人感到快乐、惊喜，甚至不可思议的体验。</p>\n  <p>我的职业路径看似跳跃，但主线始终没变。在迪士尼，我学习最优秀的角色IP和体验如何被科学的系统工程定义；进入投资行业后，我开始理解技术演进及其对生活的改变；后来创办蚁触科技，又尝试通过触觉交互，把难以描述的感受变成可以生成和传递的体验。</p>\n  <p>2020年初，我在CHI读到一篇介绍虚拟湿度渲染机制的论文，受到很大启发。论文核心作者就是我现在的联创范教授，我也因此开始在人机交互领域进行系统性学习。</p>\n  <p>这些经历都指向同一个问题：技术究竟能为人创造多少新的体验？AI Native终端让我看到，技术创造新体验有了新的可能，舞台也从屏幕延伸到了真实世界。</p>\n  <p><strong>硬氪：为什么AI Native的硬件行业最近纷纷开始关注交互智能了？</strong></p>\n  <p><strong>李诗淼：</strong>过去整个产业主要解决两类问题：一是智能化水平，包括对任务的感知、推理、理解任务及应答能力；二是终端本体，包括续航、元器件、关节、灵巧手、整机等。</p>\n  <p>但从更广泛的AI终端产业来看，基础模型正让不同设备逐步拥有理解、推理和执行能力。下一阶段的竞争，可能不仅是谁的模型更聪明，还包括谁能够让这些智能能力以更自然、更符合人类习惯的方式被使用。</p>\n  <p>所以这里需要发展的是一套新的交互范式，本质上我们正在经历从单向任务理解型的传统交互到双向智能交互的迁移，这当中会包括人与智能体之间的持续交互，以及多个智能体之间的协同与通信。随着硬件和任务执行能力的进步，AI Native终端必然需要进一步解决如何进入真实社会空间、与人长期共处的问题。</p>\n  <p>今天新一代的终端行业，有点像2006年至2007年智能手机出现之前的山寨手机时代，有非常多不同的AI录音卡片、AI随身设备甚至陪伴机器人出现在市场上，用户很难分辨哪个才是自己能一直使用起来的。</p>\n  <p>就像当年智能手机逐渐确立全屏交互范式一样，我认为AI Native终端也需要找到属于自己的交互范式，重新定义人与终端之间的关系。</p>\n  <p><strong>硬氪：你们做的交互智能，与基础模型有什么区别？</strong></p>\n  <p><strong>李诗淼：</strong>我们的重点不是重新训练一个具备全部知识和任务能力的大模型，而是围绕智能交互这一特定问题，探索能够适配不同场景与终端的模型和技术架构。</p>\n  <p>我们希望模型通过有限任务训练后，面对从未见过的新情境，仍然能够理解并尝试处理问题，为智能体提供双向交互能力。</p>\n  <p>例如，不同终端可能使用不同的传感器和表达方式，但它们都需要解决一些共通的问题：判断用户是否愿意互动、预测自身行为可能引发的反应，以及如何根据反馈调整交互策略。</p>\n  <p>我们希望将这些共通能力抽象出来，而不是为每一种硬件构型重新开发一套交互逻辑。</p>\n  <p><strong>硬氪：你们现在的技术研发进展如何？</strong></p>\n  <p><strong>李诗淼：</strong>目前团队已经搭建相关技术框架，正在重点训练原生的跨构型non-verbal behaviour动作生成模型。这是我们探索交互智能的一项重要研发工作。通过具备物理身体的终端，我们可以观察交互行为如何影响用户反应，并验证相关的互动决策机制。</p>\n  <p>整体处于早期研发阶段，主要工作集中在技术路线和产品定义。</p>\n  <p><strong>硬氪：你们如何保证自己的技术不会被基础模型公司替代？</strong></p>\n  <p><strong>李诗淼：</strong>如果核心价值只是提升某项任务的效率，确实可能很快被基础模型的进步覆盖。但人的体验、行为和社会关系是一个更复杂的问题空间，难以通过简单的效率指标衡量。我们希望与通用基础模型形成分工，前者负责理解指令和完成任务，我们则关注如何与人建立合适的互动关系。</p>\n  <p>我们认为，交互智能的价值不仅来自模型能否理解一个情境，也来自它能否在真实终端上形成持续的交互闭环。比如，同样一句提示、同样一个动作，在不同的时机和不同的关系背景下，可能引发完全不同的用户反应。只有不断获取交互反馈、评价交互效果，并优化行为策略，才能提升这种能力。</p>\n  <p>我们希望与通用基础模型形成分工，前者负责理解指令和完成任务，我们则关注智能体如何将自身能力转化为自然、恰当的交互体验。</p>\n  <p><strong>首页图源｜SYNAPUFF官网</strong></p>", "category": "tech", "published_at": "2026-11-12T05:33:36+00:00", "fetched_at": "2026-11-13T04:48:29.245137+00:00", "fingerprint": "16241347813f02fa"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨英伟达宣布CEO黄仁勋辞职，特朗普：建议库克接任；腾讯“裁员50%”？知情人士回应；宣扬错误婚恋观，德芙代运营方被罚80万", "url": "https://36kr.com/p/4067443683120000?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>张一鸣再发声谈字节AI</p>\n  <p>商务部：中美正就降税、贸易、投资等问题保持密切沟通</p>\n  <p>美股三大指数集体收跌，英伟达跌超4%</p>\n  <p>SpaceX与特斯拉合并谈判取得进展，最早12月宣布交易</p>\n  <p>联合航空禁止Muse、Instinct等AI智能体预订航班</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>英伟达宣布CEO黄仁勋辞职，CFO科莱特·克雷斯出任临时CEO</strong></p>\n  <p>11月12日，英伟达宣布，公司董事会已批准黄仁勋辞去公司总裁、首席执行官及董事职务，即刻生效。公司现任执行副总裁兼首席财务官科莱特·克雷斯（Colette Kress）出任临时CEO，并继续担任CFO，直至正式继任者确定。董事会将启动新任CEO遴选程序，同时考虑内部及外部候选人。英伟达董事会还任命Harvey C. Jones担任公司首任董事会主席，Jones曾任新思科技CEO兼执行董事长。</p>\n  <p>当天，美国总统特朗普表示，在黄仁勋辞职后，蒂姆·库克应该接任英伟达的首席执行官。“黄仁勋表现出色，但他现已辞职，唯一能接替他的人选只有苹果的执行董事长库克，”他说。“让一位传奇人物接替另一位传奇。”同日，美国企业家马斯克在社交媒体平台回应网友建议他聘用黄仁勋时表示：“那将是我的荣幸。”</p>\n  <p>另据知情人士透露，临时首席执行官科莱特・克雷斯11月13日将在这家芯片企业位于加州圣克拉拉的总部召集高管团队开会。这位因信息涉密而要求匿名的知情人士称，克雷斯将和一众高层管理人员讨论领导层安排以及业务延续方案。（财联社）（界面新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_f54afc2da92c42ee941a6aecbab7bef9@5667365_oswg45022oswg740oswg490_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>知情人士：腾讯“裁员50%”说法完全不属实</strong></p>\n  <p>11月12日消息，针对外界关于“腾讯裁员50%”的说法，界面新闻从接近腾讯的知情人士处获悉，在腾讯28周年的Linktime线上直播中，腾讯管理层主动表达了要加快组织变革的决心，同时特别提到，这和几年前那次“降本增效”不一样。前一次相对被动，更偏“降本”；这一次是面向AI时代的主动出击，更偏“增效”，激发团队去创造新的价值，鼓励一线同事积极举手向前冲，中间的管理层则需要变得更扁平和灵敏。为了应对新的变革，内部需要主动思考新打法和新战场，50%的人像陆军一样，守土有责，通过提效去做好现有的核心业务；另50%的人像海军一样，拥抱浪潮，探索AI Native、拓展新的发展空间。这是公司资源适应AI时代的重新调度，可能也是所谓“裁员50%”的谣言误读出处，该说法完全不属实。（界面新闻）</p>\n  <p><strong>宣扬错误婚恋观，德芙代运营方被罚80万</strong></p>\n  <p>11月12日，据“上海市场监管”微信公众号发布的长三角违法广告典型案例信息显示，上海宗正食品有限公司作为快手平台“德芙官方旗舰店”的运营主体，于2026年8月为推销“德芙巧克力七彩缤纷礼盒”，自行设计、制作并在店铺内发布含有“跟男朋友要了很久的德芙七彩礼盒也没给我买，今天趁男朋友不在跟暧昧对象分享了抖音，驾车2小时送了过来，很甜”等内容的宣传视频，将对待感情的不忠行为包装成“甜蜜体验”，宣扬错误婚恋观，违背社会良好风尚。</p>\n  <p>2026年10月，上海市普陀区市场监管局依据《中华人民共和国广告法》有关规定，对当事人作出罚款80万元的行政处罚。（界面新闻）&nbsp;</p>\n  <h2>AI最前沿</h2>\n  <p><strong>张一鸣再发声谈字节AI：追平OpenAI与Anthropic“最早2029年或2030年”</strong></p>\n  <p>11月12日，从多方知情人士处获悉，近期字节跳动创始人张一鸣再次在内部分享中谈到AI业务。据了解，张一鸣在近期一次面向AI团队的全员会议上表示，字节有能力与OpenAI和Anthropic展开竞争，但真正追平前沿技术，“最早也要到2029年或2030年”。字节跳动的大模型要对标国际第一梯队。张一鸣坦言，与海外顶尖AI公司相比，字节Seed系列模型的预训练数据集规模仍然少了，这是字节AI当下最需要关注的问题。（澎湃新闻）</p>\n  <p><strong>Anthropic：AI有望10年内攻克癌症等疑难病症</strong></p>\n  <p>Anthropic首席执行官Dario Amodei预测，人工智能的进步有望在10年内攻克癌症、阿尔茨海默病等疑难病症。他表示：“癌症、阿尔茨海默病、心脏病以及精神类疾病，10年内都将成为历史遗迹。”近期Anthropic通过收购多家生物技术初创企业，拓展药物研发业务。该公司还于上月在官方博客披露，已经启动内部新药研发工作。（新浪财经）</p>\n  <p><strong>百度推出大模型交易平台词元所，日均调用Token超7000亿</strong></p>\n  <p>36氪获悉，在百度世界2026开幕式上，百度创始人李彦宏表示，模型迭代速度非常快，今年前9个月，几乎每天都有不止一款新模型发布，与此同时，对模型的调用需求也迎来大爆发。由此催生的一批词元中转站。为此，百度推出大模型交易平台词元所。他表示，词元所是大模型的交易所，希望汇聚好的模型和模型提供商，让企业乃至个人都能便捷地找到、购买和使用可信的模型Token。词元所上线一个月以来，入驻供应资源已超100个，日均调用次数突破5000万，日均调用Token超7000亿。</p>\n  <p><strong>美科技监督项目呼吁民主党收紧科技监管，出台AI与数据中心新规</strong></p>\n  <p>美国科技监督项目为新国会的民主党人提供一份行动蓝图，该机构将本次中期选举称为“首届AI与科技问责选举”。一份备忘录显示，这家科技监督机构呼吁民主党持续对大型科技企业施压，推出社交媒体、人工智能、数据中心相关立法。科技监督项目创始人兼CEO Sacha Haworth在周三的备忘录中表示：“民主党当下最不该做的，就是回到对大型科技企业放任如常的老样子。”（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>商务部：中美正就降税、贸易、投资等问题保持密切沟通</strong></p>\n  <p>商务部新闻发言人何亚东在11月12日举行的商务部例行新闻发布会上说，“300亿对300亿”对等降税框架安排有利于稳定和拓展中美双边贸易，中美两国工商界对此都抱有较高期待。目前，中美双方就实施这一安排保持密切沟通。希望美方与中方共同努力，尽快推动这一安排落地见效，为两国农产品贸易创造更多有利条件。关于经贸磋商，中美双方正在就贸易、投资等领域各自关切问题保持密切沟通，有关进展将适时公布。（新华社）</p>\n  <p><strong>美股三大指数集体收跌，英伟达跌超4%</strong></p>\n  <p>36氪获悉，11月12日收盘，美股三大指数集体下跌，纳指跌0.39%，道指跌0.36%，标普500指数跌0.35%。大型科技股涨跌不一，英伟达跌超4%，市值蒸发1820亿美元；SK海力士跌超3%，奈飞、英特尔跌超2%，苹果、Meta小幅下跌；英伟达GPU的竞争对手博通、AMD涨超5%，谷歌、特斯拉涨超1%，微软、亚马逊小幅上涨。热门中概股普跌，爱奇艺、阿里巴巴跌超7%，蔚来跌超5%，小鹏集团、理想汽车、哔哩哔哩跌超3%，百度、微博跌超2%。</p>\n  <p><strong>网红酸奶Blueglass母公司换帅</strong></p>\n  <p>天眼查App显示，近日，网红酸奶Blueglass关联公司北京悦活餐饮管理有限责任公司发生工商变更，谷勇卸任法定代表人、董事长，由谷成轩接任。该公司成立于2012年5月，注册资本约1510万元人民币，经营范围包括餐饮管理、酒店管理、企业管理咨询等，由谷勇、Joy Yogurt Limited、北京悦悦悦信息咨询合伙企业（有限合伙）等共同持股。（界面新闻）</p>\n  <p><strong>Anthropic IPO认购需求约为发行规模的6倍，拟募资最高644亿美元</strong></p>\n  <p>11月13日消息，据报道，人工智能公司Anthropic的首次公开募股（IPO）认购需求约为可供认购股份数量的6倍。根据公司提交的文件，Anthropic及其联合创始人计划通过IPO募资最高644亿美元，并通过同步进行的私募配售募资260亿美元，两项合计最高904亿美元。公司目标完全稀释后估值约为1.4万亿美元。（界面新闻）</p>\n  <p><strong>香港交易所：以人民币计价、挂钩人民币货币基金(82800.HK)的衍生权证11月12日上市</strong></p>\n  <p>36氪获悉，香港交易所发文称，一只以以人民币计价、挂钩人民币货币基金的衍生权证11月12日上市。这是时隔约十年，人民币衍生权证再度亮相香港市场，为投资者带来更多人民币产品选择。该权证目前是香港市场上唯一一只以人民币计价的衍生权证。</p>\n  <p><strong>天孚通信：11月12日首次回购10万股，成交价为140.56元/股-150元/股</strong></p>\n  <p>36氪获悉，天孚通信公告，公司于2026年11月12日首次通过股份回购专用证券账户以集中竞价交易方式回购股份10万股，占公司总股本的0.0092%，最高成交价为人民币150元/股，最低成交价为人民币140.56元/股，成交总金额为1454.34万元。根据此前方案，公司拟以自有资金回购股份，回购资金总额不低于1亿元且不超过1.5亿元，回购价格不超过350元/股，回购股份将用于注销并减少注册资本。</p>\n  <p><strong>A股三大指数集体收跌，全市场超4600股飘绿</strong></p>\n  <p>36氪获悉，A股三大指数集体收跌，沪指跌0.67%，深成指跌1.68%，创业板指跌2.44%；物理AI、AI短剧领跌，华策影视、上纬新材跌超10%，宇树科技跌超8%；食品饮料、银行涨幅居前，广百股份、皇台酒业涨停，金种子酒涨超6%；半导体板块走强，燧原科技、盛科通信涨超10%，沐曦股份、摩尔线程、寒武纪涨超8%；个股跌多涨少，全市场超4600股飘绿。</p>\n  <p><strong>央行11月12日日开展3840亿元隔夜逆回购操作，操作利率为1.25%</strong></p>\n  <p>36氪获悉，央行11月12日开展3840亿元隔夜逆回购操作，操作利率为1.25%。</p>\n  <p><strong>美联储2027年议息安排出炉，10月常规利率决议将改为货币政策讨论</strong></p>\n  <p>11月13日，美联储周四公布2027年联邦公开市场委员会（FOMC）修订后的暂定会议日程。全年计划举行8次会议，分别于1月26-27日、3月16-17日、4月27-28日、6月8-9日、7月27-28日、9月14-15日、10月26-27日及11月16-17日举行。其中，10月26-27日会议将专门讨论广泛的货币政策战略问题，不按常规在第二天公布利率决议。2028年首次会议暂定于1月25-26日举行。（金十数据APP）</p>\n  <p><strong>美联储12月加息50个基点的概率为15.3%</strong></p>\n  <p>据CME“美联储观察”：美联储12月加息25个基点的概率为84.7%，加息50个基点的概率为15.3%。美联储到明年1月累计加息25个基点的概率24.4%，累计加息50个基点的概率为64.7%，累计加息75个基点的概率为10.9%。（财联社）</p>\n  <p><strong>知情人士：度小满支付获央行更名许可，启用“满易支付”为存量商标复用</strong></p>\n  <p>11月12日消息，据中国人民银行北京市分行发布非银行支付机构重大事项变更许可信息公示，北京度小满支付科技有限公司获准变更公司名称为北京满易支付有限公司，变更监事为刘晖，变更财务负责人为李竹。对此，有知情人士透露，“满易”并非全新名称，相关商标此前已经完成注册，本次属于存量商标复用，并非临时新设。它此前已经出现在度小满相关的小贷公司和信贷产品中。（新浪科技）</p>\n  <p><strong>长鑫科技副总裁：来自服务器市场的内存需求占比超50%</strong></p>\n  <p>11月12日，在2026 IC China行业大会上，长鑫科技副总裁骆晓东表示，内存需求进入“分层时代”，不同细分市场需求分化，目前服务器市场需求占比超50%，服务器市场高端存储和高性能芯片需求走高。汽车市场单车存储容量也在提升，预计到2030年，车载存储和车规芯片的需求年复合增速将达到30%左右。行业要跳出传统存储仅仅关注容量和速率的固化思路，根据目前的内存需求，内存可拆分为五个核心维度：容量、带宽、写入率、访问粒度和延迟。（第一财经）</p>\n  <p><strong>SpaceX与特斯拉合并谈判取得进展，最早12月宣布交易</strong></p>\n  <p>知情人士透露，马斯克旗下SpaceX与特斯拉的合并谈判正取得进展，双方最早可能于今年12月宣布交易，有望创下全球企业并购规模纪录。不过，交易宣布时间也可能推迟至2027年初。（新浪财经）</p>\n  <p><strong>日本拟就安全风险对AI企业设置处罚条款</strong></p>\n  <p>知情人士周三透露，日本政府正考虑要求人工智能相关企业落实安全保障措施，并对违规行为设置处罚，以此应对先进AI带来的各类风险。该提案在一场围绕AI法律体系的闭门工作组会议上提出。当下市场愈发担忧先进AI模型会出现不可预测的行为；近期还接连发生多起备受关注的数据泄露、非法访问事件，外界怀疑和AI滥用有关。（新浪财经）</p>\n  <p><strong>花旗连续下调英伟达目标价</strong></p>\n  <p>花旗将英伟达目标价从285美元下调至225美元。花旗此前于11月10日将英伟达目标价从315美元下调至285美元。（财联社）</p>\n  <p><strong>8天6板大东方：当前股价与公司经营业绩、行业情况严重偏离，存在市场情绪过热、非理性炒作风险</strong></p>\n  <p>36氪获悉，大东方发布股票交易风险提示公告称，2026年11月3日至2026年11月12日的8个交易日中，公司股票已发生6个交易日涨停，公司股价期间累计涨幅达81.77%，已两次触及上涨异动。公司存在业绩下滑风险，且前三季度仅实现微利。公司主营业务未发生重大变化，股价短期内连续上涨，公司当前股价与公司经营业绩、行业情况严重偏离，存在市场情绪过热、非理性炒作风险，随时存在快速下跌风险。敬请投资者理性决策，审慎投资。</p>\n  <p><strong>消息称SK海力士HBM4良率突破70%</strong></p>\n  <p>据报道，SK海力士的HBM4良率近期已突破70%。不过，SK海力士尚未正式公布具体的良率数据。业界高度重视HBM4良率突破70%这一事实。良率是指合格产品数量与总产量的比值；在相同的计算标准下，良率从60%提高到70%，意味着在相同的生产投入下，合格产品的产量大约增加16.7%。（财联社）</p>\n  <p><strong>国家发改委：11月12日24时起汽、柴油价格每吨分别下调645元、625元</strong></p>\n  <p>36氪获悉，据国家发改委消息，10月29日国内成品油价格调整以来，国际市场原油价格震荡回落，本次调价的前10个工作日平均价格低于上次调价前10个工作日平均价格。根据国际市场油价变化情况，自11月12日24时起，国内汽、柴油（标准品）价格每吨分别下调645元、625元。</p>\n  <p><strong>谷歌与三星电子等合作推出AI智能眼镜</strong></p>\n  <p>谷歌11月12日宣布，与Gentle Monster、Warby Parker和三星电子合作推出配备Gemini技术的全新智能眼镜系列，现已正式开启预售。（界面新闻）</p>\n  <p><strong>SpaceX正研发AI芯片机架，降低对英伟达配套零部件依赖</strong></p>\n  <p>据SemiAnalysis，SpaceX正在研发Kessel，这是一款定制版Vera Rubin NVL72机架，它用无源PCB中板替代原有的NVLink线缆盒。该方案保留Oberon的72个GPU封装、18个计算托盘与9个交换托盘，但将这些托盘围绕中板背靠背排布。SpaceX计划直接向英伟达采购芯片封装，其余零部件自行采购，绕开英伟达L6计算板。这将让SpaceX在供应商选择与元器件采购上掌握更大自主权。（新浪财经）</p>\n  <p><strong>知名科技分析师艾夫斯：马斯克需要向德克萨斯州民主党人“抛出橄榄枝”</strong></p>\n  <p>知名科技分析师丹·艾夫斯（Dan Ives）表示，在民主党赢得中期选举后，埃隆·马斯克必须寻求与德克萨斯州官员达成政治妥协，以维护SpaceX在人工智能数据中心方面的雄心。民主党人吉娜・伊诺霍萨赢得得克萨斯州州长选举后，各界对新建数据中心的审视力度明显加大。她主张在针对电力、水资源及社区建立更强有力的保护措施之前，暂停对相关项目的审批；不过，她也表示愿意与马斯克旗下的公司开展合作。（新浪财经）&nbsp;</p>\n  <p><strong>OpenAI据悉以1.25万亿美元估值融资150亿美元</strong></p>\n  <p>据报道，OpenAI以1.25万亿美元估值融资150亿美元。（界面新闻）</p>\n  <p><strong>联合航空禁止Muse、Instinct等AI智能体预订航班</strong></p>\n  <p>继银行、零售商出于隐私顾虑出台同类禁令之后，联合航空宣布将禁止各类AI智能体与AI助手预订本航空公司的航班。该禁令既适用于在联合航空App、官网直接发起的订票行为，也涵盖通过旅行社与旅游聚合平台完成的订票。航司称，正在更新订票、出票与分销相关政策，同时更新客户帮助页面，帮助用户保护个人信息。（新浪财经）</p>\n  <p><strong>马斯克回应Anthropic或不续租算力：乐意收回</strong></p>\n  <p>针对Anthropic可能在2027年年中后停止租用SpaceX算力的消息，SpaceX CEO埃隆·马斯克回应称，公司乐意收回相关算力。但他认为，实际情况可能恰恰相反。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>拓荆科技：发行股份购买资产并募集配套资金事项获上交所审核通过</strong></p>\n  <p>36氪获悉，拓荆科技公告，公司拟通过发行股份及支付现金方式购买无锡尚积半导体科技股份有限公司82.97%股份、上海泰纳微企业管理有限公司100%股权和无锡宽行企业管理有限公司100%股权并募集配套资金。截至公告披露日，上海证券交易所已审核通过本次交易。本次交易尚需经证监会同意注册后方可实施，能否取得同意注册及最终完成注册时间存在不确定性。</p>\n  <p><strong>龙芯中科：定增申请获上交所审核通过</strong></p>\n  <p>36氪获悉，龙芯中科公告，公司于2026年11月11日收到上海证券交易所出具的审核意见，公司向特定对象发行A股股票申请符合发行条件、上市条件和信息披露要求，上交所将在收到公司申请文件后提交中国证监会注册。本次定增事项尚需获得中国证监会同意注册的决定后方可实施，最终能否获得同意注册及时间尚存在不确定性。</p>\n  <h2>大公司财报</h2>\n  <p><strong>鸿海第三季度净利润775.2亿新台币，创单季新高</strong></p>\n  <p>11月12日，鸿海公布第三季度净利润775.2亿元新台币，创单季新高，季增29%，年增34%。鸿海前三季度净利润达1874.17亿元新台币，创同期新高，年增30%。鸿海表示，第三季度产品组合与营运规模提升，核心获利大幅成长。针对第四季度与全年展望，该公司表示，季对季及年对年皆强劲成长；全年展望上修。鸿海预计2027年AI机柜出货量将实现高双位数增长，市占率提升。（界面新闻）</p>\n  <p><strong>思科第一财季营收185亿美元，同比增长24%，上调全年业绩预期</strong></p>\n  <p>思科当地时间11月12日公布，2027财年第一季度（截至2026年10月24日）营收185.17亿美元，同比增长24%；按美国通用会计准则（GAAP）计算，净利润45.52亿美元，同比增长59%，摊薄后每股收益1.14美元，同比增长58%；非GAAP每股收益1.40美元，同比增长40%。其中，网络业务营收增长43%，产品营收增长32%。思科将2027财年营收预期上调至748亿至758亿美元，非GAAP每股收益预期上调至5.47至5.53美元，并预计面向大型云服务商的AI基础设施业务收入将达到90亿美元，较2026财年总额增长一倍以上。（界面新闻）</p>\n  <p><strong>中芯国际：前三季度净利润73.14亿元，同比增长91.6%</strong></p>\n  <p>36氪获悉，中芯国际公告，2026年前三季度营业收入606.18亿元，同比增长22.4%；归母净利润73.14亿元，同比增长91.6%；扣非净利润56.33亿元，同比增长77.3%。第三季度单季营业收入219.83亿元，同比增长28.1%；归母净利润28.47亿元，同比增长87.6%；扣非净利润26.39亿元，同比增长107.3%。</p>\n  <h2>投融资</h2>\n  <p><strong>机器人制造商Agile Robots融资5亿美元，投资方包括软银和英伟达</strong></p>\n  <p>11月12日，总部位于德国的机器人制造商Agile Robots宣布完成5亿美元融资，累计融资总额增至近20亿美元，公司估值达85亿美元。本轮融资由软银集团领投，英伟达、日立等参投。（界面新闻）</p>\n  <p><strong>“曦选创智”完成5亿元天使轮融资</strong></p>\n  <p>36氪获悉，由优必选、沐曦股份、锋龙股份共同出资设立的具身智能端侧芯片企业“曦选创智”完成5亿元天使轮融资，投后估值40亿元。本轮融资由纪源资本、经纬创投联合领投，多家机构跟投。曦选创智聚焦打造自主可控的具身智能端侧芯片与计算平台，首颗自研芯片定位为面向机器人的“大小脑一体”SoC。公司计划2027年向产业伙伴提供开发验证平台，用于适配和测试，2028年推出首款SoC产品及配套的具身智能整体解决方案。</p>\n  <p><strong>“纬钛机器人”完成数亿元A轮融资</strong></p>\n  <p>36氪获悉，视触觉传感器研发商“纬钛机器人”近期完成数亿元A轮融资，由中车资本、永鑫方舟联合领投，银杏谷资本、木棉花基金、华仓资本、鲁信创投等机构参与投资。</p>\n  <p><strong>AI数据中心初创公司Torus完成5亿美元融资，推出集成储能系统的模块化数据中心</strong></p>\n  <p>11月11日，美国能源存储初创公司Torus宣布完成5亿美元C轮融资，由Magnetar领投，Iconiq Capital、Origin Ventures和Trinity Capital等机构参与。本轮融资将用于生产名为Foundry的新型模块化AI数据中心产品，该产品将电池储能系统与AI计算设备集成在集装箱大小的模块中，AI基础设施公司Hydra Host是其客户之一。（新浪财经）&nbsp;</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-11-13T00:21:02+00:00", "fetched_at": "2026-11-13T04:48:29.245131+00:00", "fingerprint": "728f2e5df64755bc"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨北航博士做AI4S，获亿元融资，要造自驱动实验室", "url": "https://36kr.com/p/4067548192576389?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_4676d91fda7147f390b0a200be4b11c4@6221844_oswg217857oswg2036oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3000</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，面向科学研发的Physical AI公司——青葵智造近日宣布完成亿元A轮融资，由创东方投资、飞荣达股份及金辉大数据共同参与。资金将重点用于核心技术研发、重点行业拓展以及云实验室建设，加速自驱动实验室的产业化落地。</p>\n  <p>青葵智造成立于2021年，核心业务是面向生物医药、化学工业、先进材料、新能源等领域，提供“AI设计—自动化执行—多模态数据回流—模型自适应迭代”的干湿实验闭环解决方案。公司创始人、董事长陈南江为北航博士，曾任职于北航机械学院，在机器人及智能制造领域有十余年连续创业经验。</p>\n  <p>近年来，AI4S（AI for Science）正从计算驱动的科学发现，向AI自主实验执行演进。不过，行业内仍面临着“Execution Gap”（执行鸿沟）与“Data Gap”（数据鸿沟）这样的核心痛点，即数字世界中的智能决策，与真实世界中的实验执行尚未充分打通。</p>\n  <p>“目前不少科学模型仍然依赖公开文献和数据库训练，但公开数据往往存在实验条件记录不完整、失败样本不足等问题。模型可以提出很多假设，但如果缺少真实实验验证和持续的数据反馈，就很难不断提高预测和决策能力。”陈南江向硬氪直言。随着大模型技术的爆发，行业逐渐意识到，没有高质量的结构化湿实验数据，AI在条件筛选与合成层面的能力将遭遇天花板。</p>\n  <p>基于这一判断，青葵智造选择了一条“软硬一体、干湿闭环”的路线。陈南江将一套完整的自动化实验室解决方案类比为人体：底层是负责物理执行的硬件（双手），中层是负责调度的操作系统（神经系统），顶层是负责实验设计决策的科学大模型（大脑）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_1a209678d4e34777877643374ca29537@6221844_oswg738939oswg942oswg628_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>青葵智造自动化合成实验室（图源/企业）</p>\n  <p>在硬件层，NexoLab将经典化学实验动作和流程进行了标准化、数字化和模块化，从标准化执行单元到投料合成、样品处理及分析、分离纯化等工作站，以及标准实验流程等不同层级，都能实现模块化的柔性配置，以适配各类常见反应条件及分析方法。同时充分发挥青葵制造团队的自动化、软件技术积累，实现了常见实验的可靠性、可重复性和一致性。</p>\n  <p>在管理调度层，AI-LabOS将物理设备抽象为可调用的智能体，把不同实验流程分解为不同智能体的标准化实验动作，以实现各类实验流程的适配，同时借助不同层级的数据采集解决方案，实现了覆盖执行单元、实验节拍、反应条件、实验室运营管理等多维度的数据采集和追溯，并可以通过调度仿真与数字孪生技术，实现多台套机器人的协同调度与实验流程编排，让不懂硬件编程的化学家也能快速上手，最大限度的提升实验产出效率。</p>\n  <p>在决策层，MoleMind基于湿实验室产生的多维高质量数据进行各类型模型训练，可以实现包括智能实验设计、设备状态预测、实验数据可靠性评价、实验优化及自迭代、反应条件优化等在内，适用于不同场景的垂类模型，真正的将模型应用到实验辅助分析、实验辅助设计与决策中。</p>\n  <p>“化学实验里有很多细节，比如氮气环境下不同形状物质的加样及称量，平行反应器如何进行热设计和结构设计以保障搅拌和温度曲线的一致性。我们要把这些理解透彻，再转化成软件界面和底层算法。”陈南江表示。目前，青葵智造已获批成为工信部人工智能标准化技术委员会成员单位，并牵头建立市重点实验室。</p>\n  <p>在效率与精度上，相较于传统的人工实验模式，NexoLab可以将实验效率提升数十倍；同时，机器人操作摒弃了人工误差，在实验可靠性、安全性上具有显著优势。AI-LabOS可以通过智能化分析及调度，最大程度提高设备利用率，并实现全维度的数据追溯，改善传统实验室人工管理的无序和低效。MoleMind则充分借助AI的知识沉淀能力，真正让不同维度的数据、知识实现融合、积累、迸发，并最终辅助科学家拓展科学边界。</p>\n  <p>在商业化路径上，青葵智造目前的客户覆盖制药、精细化工、新材料、新能源及科研院所等领域的头部机构，包括中科院、勃林格殷格翰、恒瑞医药、国轩高科等。</p>\n  <p>陈南江透露，由于底层实验环节（如固液混合、投料反应、分析检测等）已实现了高度的模块化和标准化，公司产品的跨行业适配性较强，客户复购率表现良好。</p>\n  <p>在设备交付之外，青葵智造正在探索第二增长曲线。今年下半年，公司建成了首个自持的全自动AI化学机器人实验室，除了为自己的模型训练提供高质量数据。公司也开始尝试对外提供实验即服务（Experiment as a Service）。制药、材料、新能源或科研院所可以通过云端实验入口实现从实验任务到实验结果的双向传递，并可以实时查看包括水氧环境、加热曲线、分析图谱在内的各类实验数据。</p>\n  <p>此外，由于海外人力成本更高、对环境与安全性要求更严，陈南江认为海外市场将成为接下来重点发力的方向。目前，青葵智造已在新加坡和韩国设立办公室，并已经与当地的高校、科研院所及产业客户展开合作。</p>\n  <p><strong>以下是硬氪与青葵智造创始人陈南江的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：现在做AI4S的团队很多，青葵智造的核心差异化在哪里？</strong></p>\n  <p><strong>陈南江：</strong>差异化可以分为两块。第一是行业Know-how的转化。AI4S本身就是一个高度交叉融合的行业，我们团队的基因是机械自动化、软件及AI，但化学领域的实验设计、实验操作、结果分析等有非常丰富的内容和细节，我们需要对这些场景和需求进行充分的了解，并将其转化为标准化、数字化的软硬件模块，并充分借助AI进行各类化学场景的理解、学习和沉淀，与自动化、AI的基因实现融合。</p>\n  <p>第二是真正的干湿闭环。干湿实验闭环说起来简单，但要实现干实验和湿实验两个体系的融合和闭环，是目前行业各类型企业真正面临的问题。我们一直坚持在湿实验体系的基础上进行干实验设计，并坚持用真实实验场景覆盖实验设计、实验执行到实验迭代的全流程验证，并建立围绕这一体系的实验质量评价体系，让干湿实验闭环能够在真实的实验场景下迭代。截止目前，我们已经在科研、产业等领域验证并得到了一些比较好的结果。</p>\n  <p><strong>硬氪：客户是否会担心科学AI产生“幻觉”或错误？目前AI在实验中的信任度如何？</strong></p>\n  <p><strong>陈南江：</strong>这个问题非常关键。我们肯定不能用通用语言模型直接做实验，而是在通用大模型底座上，用湿实验室跑出来的真实垂直数据来训练模型，这会大大消减幻觉。目前在全世界的水平范围内，AI自动生成的实验方案，仍然需要化学家来做最终核准。也就是说，现阶段还是人机结合，没有完全无人。但我们相信，随着高质量实验数据规模的不断扩大，数据标准化程度的逐步提升，AI在某些领域的预测、判断准确率会越来越高，并最终超越人类科学家。</p>\n  <p><strong>硬氪：公司接下来的重点规划是什么？</strong></p>\n  <p><strong>陈南江：</strong>第一是大力发展自持的机器人实验室，大量做真实实验来积累和沉淀高质量结构化数据。在AI4S的细分竞争中，本质就是真实实验数据的竞争。第二是在大量数据基础上，把MoleMind训练得更聪明。第三是海外拓展，中国在软硬件结合的方向上迭代很快。从技术目标上看，我们希望在一两年内让云实验室形成规模优势，把数据池做大。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>创东方投资表示：</strong>“我们看好AI4S从技术验证走向产业应用的发展机遇。青葵智造围绕科学智能决策、实验自动化与数据闭环构建了系统性技术能力，并在真实产业场景中持续验证商业价值。期待公司通过本轮投资，持续拓展在不同领域的商业化应用。”</p>\n  <p><strong>飞荣达表示：</strong>“随着AI算力基础设施快速发展，液冷散热及热管理技术对材料性能、研发效率和工艺优化提出了更高要求。青葵智造在智能实验、材料配方筛选及自动化测试方面的技术积累，与飞荣达在电磁屏蔽材料、功能性材料、热管理材料及液冷等技术方面的业务布局均有协同潜力。期待以本次投资为契机，探索AI与自动化实验技术在材料研发及工艺优化中的应用，加快技术创新与产业化进程。”</p>", "category": "tech", "published_at": "2026-11-13T02:04:43+00:00", "fetched_at": "2026-11-13T04:48:29.245123+00:00", "fingerprint": "0df1874223cc60d6"}, {"source": "36氪 - 最新文章", "title": "超跑面料供应商Alcantara：智驾时代，内饰比拼触感｜最前线", "url": "https://36kr.com/p/4067598702384258?f=rss", "summary": "<p>10月28日，Alcantara在北京意大利文化处办了一场关于色彩、材质与表面工艺的沙龙。表面是材料展示，背后是一条清晰信号：汽车内饰的竞争，正从屏幕、芯片、算力，回撤到内饰设计的品质和触感。</p>\n  <p>过去几十年，Alcantara的标签是超跑。法拉利、兰博基尼、保时捷座舱里的翻毛触感，代表运动与稀缺。但中国市场正在改写这套语法。2026北京车展上，小米SU7 Ultra单车内饰覆盖约5平方米Alcantara，落在座椅、方向盘、仪表台中缝和门板；极氪、红旗等品牌也把它作为内饰主视觉。同一张材料，正从性能符号变成用户可感知的豪华基线。</p>\n  <p>逻辑并不复杂。电动车同质化加剧，三电参数难拉开差距，座舱成了品牌叙事的剩余阵地。面料承担三个功能：一是触感反馈，高摩擦系数让方向盘和座椅在激烈驾驶中不打滑；二是轻量与合规，相比真皮更轻、VOC更低、材料利用率更高；三是情绪价值，颜色、纹理、绒感直接定义这是运动车还是移动客厅。</p>\n  <p>活动圆桌里，Pininfarina中国区总经理李汉卿与消费电子、材料设计代表同台，讨论的其实是同一件事：CMF不再附属造型，而前置到产品定义阶段。智能驾驶渗透后，方向盘使用频次下降，但人对座舱的停留时间变长，面料要同时承接少干预的舒适和可辨识的豪华。</p>\n  <p>对车企来说，面料正在从成本项变成体验资产；对材料商来说，中国市场不再是销售终点，而是CMF创新的试验场。当汽车变成第三空间，触感会比参数更早被人记住。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_00e7f62b7bcc449ea1be141c2ac50401@5809365_oswg3822593oswg3240oswg2160_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">法拉利品牌车型使用Alcantara面料</p>", "category": "tech", "published_at": "2026-11-13T02:58:31+00:00", "fetched_at": "2026-11-13T04:48:29.245114+00:00", "fingerprint": "61add7fdc9f7a49a"}, {"source": "36氪 - 最新文章", "title": "炸了！英伟达最大的雷，是没接班人", "url": "https://36kr.com/p/4067628486267780?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_174aa30f8e6a47b4b585eae8d70f9174@6314151_oswg1176241oswg900oswg1030_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>CFO 接任临时 CEO。</p>\n  <p>&nbsp;</p>\n  <p>文<strong>&nbsp;|</strong>&nbsp;刘思洁</p>\n  <p>封面来源&nbsp;<strong>|&nbsp;</strong>网络</p>\n  <p><br />&nbsp;</p>\n  <p>当地时间2026年11月12日，英伟达官方宣布，联合创始人黄仁勋辞去公司总裁、首席执行官及董事会成员职务，即刻生效。</p>\n  <p>英伟达同时宣布，现任执行副总裁兼首席财务官科Colette Kress，出任临时CEO，并继续担任CFO，直至正式继任者确定。董事会将启动新任CEO遴选程序，同时考虑内部和外部候选人。此外，英伟达董事会还任命Harvey C. Jones担任公司首任董事会主席。</p>\n  <p>公告没有说明辞任原因。但过去一周，围绕黄仁勋私人关系的报道持续发酵，11月8日，英伟达董事会已宣布启动独立调查。</p>\n  <p>执掌33年的创始人，就这样离开了全球市值最高的科技公司之一。</p>\n  <p>英伟达股价也受到冲击。<strong>12日美股开盘，英伟达报150.99美元，较前一日下跌13%，盘中一度触及148.8美元。而在10月6日，英伟达股价创下243.37美元的历史高点，至此已累计下跌近40%。</strong></p>\n  <p>为什么几段出轨绯闻，会让一家公司的创始人和CEO离职？而谁又会是下一任英伟达CEO？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_421552d170644959871046e946c6c402@6314151_oswg1788oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>&nbsp; CEO和下属发生关系，为什么不是私事？</strong><br />&nbsp;</h2>\n  <p>黄仁勋此前已公开承认一段婚外情。随后，《纽约时报》援引五名英伟达前员工的说法，称他还与公司医疗健康业务副总裁金伯莉·鲍威尔（Kimberly Powell）存在婚外情，而鲍威尔直接向他汇报。</p>\n  <p>老板的婚外情，难道不是私生活吗？</p>\n  <p>如果对象是外人，这确实是私事。但当对象是公司员工，尤其是向CEO直接汇报的高管时，事情就变了。<strong>这已经是权力关系，不只是私人关系。</strong></p>\n  <p>美国大型上市公司普遍限制高管与下属之间未披露的亲密关系，逻辑很简单，公司必须确保权力和资源的分配基于能力与业绩，而非私人关系。这类关系一旦未披露，就可能被视为利益冲突和治理缺陷。</p>\n  <p>资本市场层面的压力更直接。欧美大型机构投资者，如养老基金、主权财富基金和大型公募，普遍受ESG（环境、社会和公司治理）投资准则约束。职场性骚扰、权力滥用和重大治理缺陷，都可能拉低公司的ESG评级。如果董事会处理不力，部分被动基金和有合规要求的机构可能被迫减持。</p>\n  <p><strong>所以在美国大型企业里，CEO与下属发生未披露的亲密关系，可能触发人力资源调查、董事会调查，甚至直接导致CEO下台。</strong></p>\n  <p>麦当劳前CEO史蒂夫·伊斯特布鲁克（Steve Easterbrook）就是典型案例。2019年，麦当劳董事会以违反公司政策、判断失误为由解除其职务，起因正是他与一名员工发生了双方自愿的亲密关系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_cc668aae64bf4e9e8d11a30c6afda900@6314151_oswg2308oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>谁会接任黄仁勋？</strong></h2>\n  <p><strong>当下的英伟达最需要什么来度过创始人的卸任和由此带来的一系列风暴？答案或许是稳定。</strong></p>\n  <p>这次人事变动里另一个值得注意的新职位，是董事会主席。这是英伟达成立33年来首次设立这一职位，出任者是Harvey C. Jones。</p>\n  <p>Jones曾任芯片设计软件公司新思科技CEO，自1993年英伟达创立当年起就担任公司董事，也曾在审计委员会、提名与公司治理委员会任职。在CEO突然离任、独立调查仍在进行的时刻，由一位资历最深、熟悉公司治理的老董事出任主席，目的显然是稳住董事会和市场。</p>\n  <p>而Colette Kress似乎正是最适合做临时CEO的人。</p>\n  <p>Colette Kress自2013年起担任英伟达CFO，此前在微软、思科和德州仪器工作过，拥有接近25年的科技行业财务经验。她熟悉英伟达的财务状况、资本市场和公司内部运营，也长期与黄仁勋一起出现在财报会和投资者活动中。</p>\n  <p>目前，英伟达最需要先处理的是一系列非常现实的问题：稳定员工，稳定投资人，维持客户和供应商关系，确保英伟达的财报、产品发布和业务决策不会因为CEO离职而中断。这让Colette Kress成为最自然的过渡人选。</p>\n  <p>但她的短板也很明显，其核心履历是财务管理，而非芯片架构或者CUDA生态，很显然，她无法像黄仁勋一样去定义下一代技术路线，她更像是一个稳定的过渡型CEO。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_dd494aa3d497419291a440b03ad91c51@6314151_oswg112155oswg1080oswg543_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Polymarket上关于谁将接任黄仁勋的预测</p>\n  <p>目前，在预测平台Polymarket上排名靠前的另一个CEO人选，是Ian Buck。</p>\n  <p>Buck目前是英伟达负责超大规模计算和高性能计算业务的副总裁，主管面向大型云服务商和AI客户的硬件、软件及产品合作。他也是CUDA的重要创造者之一。</p>\n  <p>2004年，Buck加入英伟达。在此之前，他在斯坦福大学攻读计算机科学博士，研究的就是如何让GPU承担图形渲染之外的通用计算任务。</p>\n  <p>英伟达能够从一家游戏显卡公司，变成人工智能产业的基础设施公司，CUDA是其中最关键的技术和商业基础之一。Buck参与了这套软件生态的早期建设，也长期负责英伟达的加速计算业务。</p>\n  <p>从技术基因来说，他比Kress更接近英伟达的“技术继承人”。</p>\n  <p>但问题仍然存在，技术负责人和CEO是两种不同的工种。目前公开资料能够证明Ian Buck是英伟达的核心技术和产品负责人，但不能证明他已经具备黄仁勋一样的领导能力。</p>\n  <p>董事会也可能向外部寻找人选。外界讨论的名字还包括Jeff Fisher、Michael Kagan，甚至AMD CEO苏姿丰，但这些目前都只是外界推测。</p>\n  <p><strong>过去33年是黄仁勋的时代，而英伟达最大的风险，或许正是过度依赖黄仁勋一个人。但一家市值数万亿美元的公司，本就不该把命运系于一人。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com 少、但喝得越来越好。</p>\n  <p>他开始注意到无醇啤酒的机会。事实上，由于起步太晚，在几千亿规模的中国啤酒行业里，无醇还是个刚发芽的种子，直到2026年，中国无醇才约占啤酒消费量的1%左右。因此，它真正的参照系在海外——今天的德国、日本无醇市场份额约为10%，在欧美，无醇已经逐渐成为日常消费品。IWSR数据也显示，2025年全球21个主要市场的啤酒总销量微降1%，无酒精啤酒销量却逆势增长8%。</p>\n  <p>更重要的是，年轻人开始展露出对酒精的克制。孙晓楠告诉36氪，知名烈酒集团保乐力加曾与新零交流时提及，他们调研发现，全球40%的年轻人滴酒不沾。与此同时，中国的白酒整体销量腰斩，送礼与商务宴请场景的减少，让高端白酒的价格开始滑落。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_47c1f62d9ec94f4c926fa3bf5ea414cc@5971123_oswg102546oswg467oswg634_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">「新零」无醇啤酒产品图</p>\n  <p>因此，孙晓楠很快开始了人生的第二段创业，创立无醇啤酒品牌新零。但和传统大厂的先有啤酒、再除酒精不同，新零做无醇啤酒的思路是“清酿法”，即从酿酒环节开始，就围绕无醇重新设计。</p>\n  <p>国内目前两条较为主流的脱醇路线，分别是蒸馏法与脱醇法。前者利用酒精78.5℃的沸点，令其蒸发；后者则用半透膜过滤酒精。它们的共同点是，都需要先酿出啤酒，再用技术去除酒精。</p>\n  <p>但孙晓楠告诉36氪，这两套方法有三处硬伤，一是做不到真正的无醇，二是过滤会大量损失风味物质，三是为了保证口感，必须回填香精。</p>\n  <p>从创立起，孙晓楠就决定，新零不做酒精减法，而要重做啤酒。</p>\n  <p>清酿法从麦芽、酵母、发酵方式、温度、压力、设备参数开始，就围绕无醇啤酒设计。几年来，新零已经在原料、工艺、设备以及脱/控醇技术、低能量控制、酒感模拟等环节做了大量自主研发，拥有5项发明专利及20项其他专利。据孙晓楠介绍，产品能做到完全0酒精，同时把嘌呤压到4.2毫克/百毫升，而国标的低嘌呤门槛是≤50毫克/百毫升。</p>\n  <p>这条路走起来并不轻松。孙晓楠把从0到1的过程拆成四道坎：把酒精从有变成无，花了近一年；解决之后才发现，酒精不是最大的问题，好喝才是；口感终于通过了，又撞上批次一致性，这个月好喝，下月为什么不一样；最后一关才是时间，六个月以后还好不好喝，那九个月以后呢？</p>\n  <p>“前三个问题，实验做完就有答案，最后一个只能靠时间。”孙晓楠说。</p>\n  <h3>当喝酒成为一种主动选择</h3>\n  <p>究竟谁在喝无醇啤酒？</p>\n  <p>孙晓楠告诉36氪，新零的用户画像和普通啤酒几乎完全相反：女性占比约65%、男性约35%，而普通啤酒的男性占比超过85%。另外，新零用户中30岁以下人群超过70%，当月复购率超过40%，中产家庭用户占比超过60%。</p>\n  <p>但与他最初想象的不同，这些为无醇消费的年轻人们，为新零提供了一个反共识——喝无醇啤酒的人，并非是因为“不能碰酒精”，而是今天不想碰。</p>\n  <p>不能与不想之间，背后存在巨大的差异。孙晓楠说，酒桌文化在新一代身上明显失效，年轻人喜欢主动微醺，抵触被动喝醉，例如年轻女性，她们会在社交场合选择自带无醇啤酒，\"我不是不给你面子，我也在喝酒，只不过是无醇的\"。</p>\n  <p>他向36氪总结称，这是一种主动性的转变，即“喝到对方肚子里”，变为“喝到自己肚子里”。</p>\n  <p>孙晓楠还记得，自己曾在洲际集团工作时，曾问过酒店的国际总厨，喝过最好喝的啤酒是什么？</p>\n  <p>对方的回答颇为有趣，“只要是免费的酒，就是最好喝的”。</p>\n  <p>在多数西方文化中，喝酒往往被视为一种休闲和放松的方式，无论场合、无论微醺还是喝醉，都可以随时来一杯。但传统中国饮酒文化则注重氛围与礼仪，这也导致在许多社交场合中，人们喝酒是为了他人而饮。</p>\n  <p>如今这种现象正在发生变化，饮酒的快乐，可以与喝醉无关。孙晓楠认为，无醇、低醇与传统啤酒，并不是非此即彼的关系，一个人今天要上班，可以选择无醇，明天要小聚，可以喝低醇微醺，周末露营，又能选择正常酒精度。这也意味着，新零不想成为酒精的替代品，相反，它的解法是制造更多的需求。“我们现在不会用‘人’作为标签划分产品，而是用生活状态和场景划分。”他说。</p>\n  <p>在众多需求里，过年送礼成为最让他意外的一个。近年来，新零无醇啤酒在春节前后的销量有明显抬升，有买过的用户告诉他，自己买新零出于两个心意——一个是让对方尝尝鲜的新意；另一个心意则是心脏的心，希望对方能健健康康。</p>\n  <p>目前，新零的产品体系分为精酿线、国风线与创新线。精酿线最老，拥有皮尔森、比利时白啤、IPA三个口味，面向对啤酒有品鉴偏好的男性；国风线则用桂花、龙井、荔枝、山楂、杨梅这些中国本土风味酿酒，“中国味，中国造”；创新线负责脑洞，代表作是从《哈利·波特》里长出来的黄油啤酒——在原著小说中，它允许被未成年魔法师饮用，新零则用麦芽、酒花、酵母把它酿成了完全零酒精的版本，还带有谷物、饼干和太妃糖的香气，在二次元展会上卖得不错，如今是山姆会员店的主推单品之一。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_e2b91343e9a043ba91907df9df59f1bc@5971123_oswg283991oswg1000oswg1000_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">「新零」黄油风味无醇啤酒</p>\n  <p>在渠道上，新零已经进入山姆、盒马、奥乐齐等新零售渠道。36氪还了解到，新零去年开始正式规模化出海，虽占比不大，但营收已经实现翻倍增长。北美与中东目前都是新零重点拓展的海外区域，在北美，黄油啤酒成为敲门砖，在当地颇受欢迎；而在中东，当地对酒精极度零容忍，在必要的酒会场景上，完全零酒精的无醇啤酒正好补位。</p>\n  <p>团队方面，创始人孙晓楠并非酿酒出身，但常年和消费打交道，早年在Tesco英国、亚马逊、耐克、洲际酒店集团等多家世界500强工作过。目前新零团队不到20人，平均年龄28岁，总酿酒师方志远是国家级啤酒评酒委员，研发团队多有合成生物学背景。</p>\n  <p>孙晓楠告诉36氪，2026年对于新零最重要的是\"做减法\"——聚焦无醇、聚焦真正有毛利的渠道，“做窄路宽，打磨好产品，做时间的朋友。做对了，销售额是结果。”</p>", "category": "tech", "published_at": "2026-11-12T01:00:00+00:00", "fetched_at": "2026-11-12T05:30:42.792470+00:00", "fingerprint": "5be82260a1c3717f"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨海光创始核心技术团队创业AGI架构芯片，获清华系等基金数亿投资", "url": "https://36kr.com/p/4066136377873286?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_dc401f6a05f642878d56533346504cd4@6221844_oswg397580oswg1024oswg576_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/视觉中国</p>\n  <blockquote>\n   <p>本文约<strong>3400</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，原生通用人工智能（AGI）架构芯片研发商——通芯人工智能科技（北京）有限公司（下称“通芯智能”）成立半年已连续完成数亿元种子轮及天使轮融资。融资由清华校友种子基金、北京通用人工智能研究院、松霖科技、平治信息、暗物智能以及豫资涨泉等财务投资人共同参与，集聚产业资本、头部科技VC和财务资本。资金将主要用于芯片流片前的核心架构设计及研发。</p>\n  <p>通芯智能成立于2026年4月，由人工智能科学家、通研院院长、北大和清华讲席教授朱松纯发起，依托北京通用人工智能研究院（通研院）孵化。</p>\n  <p>公司创始核心团队的平均芯片从业经验超过20年，骨干来自海光、百度、字节、阿里等头部芯片与AI团队，创始核心技术团队毕业于清华、北大、中科院、UCLA等院校，完整走过架构定义、前端设计、后端设计、流片、量产交付全链路，科学家团队覆盖大模型、世界模型、物理智能等AI全技术栈。创始人王海洋师从中国计算机事业的奠基人之一夏培肃院士，是龙芯CPU创始成员，曾任海光4代芯片架构负责人，GPU独角兽联创，拥有25年芯片研发及15年SoC架构设计经历，累计持有近百项国内外发明专利，在CPU、GPU、GPGPU等大芯片方向具备丰富的研发和量产经验。</p>\n  <p>当前，以GPGPU、Tensor Core为代表的传统架构主要面向统计式大模型优化，在因果推理、环境交互、物理智能等负载上存在天然不匹配。同时，算力、存力、运力失衡，推高了Token生产与机器人物理智能的落地成本。</p>\n  <p>王海洋表示，AGI竞争已经从单纯比拼峰值算力，转向面向物理世界交互的有效推理能力比拼。Token工厂、物理智能、机器人等产业对硬件成本、功耗高度敏感，行业需要一套原生适配认知推理的新型芯片架构。</p>\n  <p>因此，在当前大语言模型向AGI过渡的产业节点上，通芯智能选择了一条“不做GPU改良版，直接围绕CUV认知架构设计芯片”的差异化路线。</p>\n  <p>通芯智能的芯片设计理念源自朱松纯教授提出的认知（Cognition）、能力（Utility）、价值（Value）三维联合空间，即CUV架构。基于该理论底座，通芯智能以自研的Vector+Tensor+AGI Core三单元架构为基础，打造既支持向量、张量计算，又为物理、社交智能等提供原生支持的高性价比芯片。朱松纯教授表示：“通用人工智能的竞争，本质是架构之争。通芯要做的是把这条路落到硅上：以芯片适配AGI的认知架构，与‘通通’等智能体和大模型协同，构成端到端解决方案。”</p>\n  <p>在技术实现上，通芯智能采用了混合存算一体架构、通用+专用的计算架构以及灵活的云边端统一架构。通过向量矩阵单元、MoE专家模式、多级混合存算一体、图遍历引擎、原生加速STC-PG（时空因果解析图）等自研技术，解决通用GPU跑AGI时存在的“内存墙”、“稀疏不规则”、“图结构推理”等结构性错配问题。</p>\n  <p>据王海洋介绍，公司第一代芯片定位为高性价比的推理芯片，同时支持云端模型工厂和端侧物理智能，端侧对标英伟达的Thor系列，云端对标英伟达B300系列。</p>\n  <p>“随着大模型能力增强，AI正从训练时代走向推理时代。训练模型的需求在下降，而推理需求将占据绝对大头，用户对Token性价比的追求不断提高。”王海洋表示，通芯智能将首款芯片定义为高性价比推理芯片，正是为了回应这一趋势。</p>\n  <p>硬氪进一步了解到，公司成立三个月即完成架构设计和立项，现已进入芯片设计阶段，计划12月初展开FPGA原型验证工作，届时将展示阶段性成果。</p>\n  <p>在商业化落地方面，通芯智能规划了三个市场布局并已初步达成规模合作意向：第一，依托通研院体系及产业战略伙伴，在AGI通用智能体领域展开合作；第二，面向大模型智算集群和Token工厂，与整机厂商及地方智算中心合作，提供高性价比Token算力；第三，面向物理智能与具身机器人，提供端侧大算力推理芯片。</p>\n  <p>此外，公司后续还计划与北大、清华、中科院计算所、头部大模型和具身机器人公司等共建联合实验室，围绕CUV认知架构、物理智能算子、AGI芯片软硬件协同开展联合攻关，打通产学研落地通道。</p>\n  <p><strong>以下为硬氪与通芯智能创始人王海洋的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：通芯智能主打的AGI芯片，跟其他的AI芯片有何不同？</strong></p>\n  <p><strong>王海洋：</strong>举个例子，现在很多做光计算的公司，本质上还是在针对当前的大语言模型做计算加速。但大语言模型并不等于AGI。我们不是做一个更快、更省电的“计算器”，而是面向朱松纯教授提出的CUV认知架构，在硬件底层做原生设计。除了支持向量、张量计算来向前兼容现有的Transformer架构，我们还在芯片里增加了几十个专门针对AGI算法算子的硬件加速器，让未来的物理智能、空间智能算法能够完整、高效地跑在我们的芯片上。这在当前的芯片品类里是一个全新的东西，可以说是“新物种”。</p>\n  <p><strong>硬氪：目前跟产业界的接触中，客户真正在意的是什么？</strong></p>\n  <p><strong>王海洋：</strong>现在大家最在意的其实是推理成本，也就是Token的价格。前几年大家都在拼训练算力，但随着模型能力增强，基座模型公司越来越少，真正的落地主要在推理上。客户看我们的芯片，一是看我们能不能支持未来向AGI演进，二是看性价比。我们把第一代芯片定义为“支持AGI算法的、高性价比的推理芯片”，同时支持云端的智算集群和端侧的具身智能。</p>\n  <p><strong>硬氪：当前整个行业对AGI芯片的需求热情如何？未来有哪些趋势是你们重点关注的？</strong></p>\n  <p><strong>王海洋：</strong>这是一个渐进的过程。大模型发展非常快，但学术界和产业界逐渐发现它的局限性，现在大家都开始向AGI对齐。我们认为AGI芯片正处于类似2017年Transformer文章发表后、到ChatGPT爆发前的过渡阶段。芯片研发从立项到量产至少需要20个月，我们现在来做恰逢其时。</p>\n  <p>从趋势来看，第一是推理将占绝对大头，各种评测乐观一点的认为推理占比会到90%以上。第二是提高计算芯片的计算效率。目前芯片面临算力、存力、运力三大瓶颈，其中内存强是制约计算芯片效率最大的问题。我们提出的混合存算一体，是未来解决存力瓶颈的核心方案。不管未来技术流派怎么变，通过存算一体解决存力瓶颈的计算芯片，会成为绝对的主流，我们在这方面有明确的布局。第三是逐渐向AGI芯片过渡。现在无论学术界、还是产业界都在加快AGI的探索，芯片厂商也会加快布局。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>豫资涨泉资本创始人刘啸东表示：</strong>豫资涨泉资本重点布局科技智造与颠覆性科创技术领域，致力于在国内外寻找并投资真正有技术含量的优质标的。投资通芯智能，是看好训推分离之后推理侧算力的长期机会，也看重公司面向AGI时代提前布局的芯片底层架构。公司的团队也是吸引我们的一个重要原因：通芯智能的这支队伍既有研究院的科研底子，又有来自芯片大厂的近20款大芯片的工程化与量产经验，科学家、产业专家和管理者各管一段。这种“三角形”的结构，恰恰是把创新转化为创业最关键的一环。作为投资人，我们提供资本与耐心，愿与公司一道把架构和生态的根扎深，行稳致远。</p>\n  <p><strong>水木校友基金管理合伙人王学辉表示：</strong>通芯一边是研究通用AI的科学家，一边是亲手把海光、龙芯芯片做出来量产的工程师，公司定位于专门给人形机器人、智能体用的国产新芯片，软硬一体，解决现有芯片搞不定现实世界物理智能的痛点，我们看好大赛道未来前景，也看好团队，希望水木能不断赋能公司尽快实现流片。</p>\n  <p><strong>松霖科技战投负责人韩宗谕表示：</strong>我们看好通芯在AGI芯片与原生模型一体化的核心技术以及具备丰富量产经验的创始团队。本次投资是产业型战略布局，依托松霖在医养、后勤以及家庭场景的全球化产业基础，与通芯形成深度协同，加强具身智能底层算力能力。期待双方共同推进芯片适配、产品验证与商业化落地，共建可控、可落地的国产AGI机器人产业链。</p>\n  <p><strong>普超资本的创始合伙人李立伟表示：</strong>普超资本持续专注布局于人工智能时代的算力基础设施产业链。通芯智能打通AGI理论到芯片架构的技术链路，团队兼具前沿AGI科研积淀与长期算力大芯片全周期量产经验，以差异化架构适配因果关系、多物理场计算需求。我们期待公司软硬件协同落地，夯实国产AGI时代算力底座。</p>\n  <p><strong>青创伯乐创始合伙人兼董事长赖光宁表示：</strong>每一轮技术革命真正落地的时候比的都不是谁的概念更响，而是谁能把稀缺的东西变得便宜、可靠、可规模使用。AGI走到今天，谁能让智能算得更省，谁就掌握了下一阶段产业化的关键。通芯智能选择做AGI芯片，本质上是在参与定义这个时代的算力底座。他们既能在架构上做出原创判断，也扎实地在做落地工作；中国的底层创新，缺的往往就是这一股坚持做下去的劲头。青创伯乐愿意陪它把这件事做成；也希望通芯将来被记住的不只是他们的芯片产品，而是他们为中国AI产业打下的那段地基。</p>", "category": "tech", "published_at": "2026-11-12T02:08:06+00:00", "fetched_at": "2026-11-12T05:30:42.792463+00:00", "fingerprint": "5c7615cc8d8e33ad"}, {"source": "36氪 - 最新文章", "title": "我们需要一个不卖瑜伽裤的lululemon吗？", "url": "https://36kr.com/p/4064801667584896?f=rss", "summary": "<p label=\"正文\">文｜贺哲馨</p>\n  <p>编辑｜乔芊</p>\n  <h3 label=\"二级标题\">失灵</h3>\n  <p>lululemon的创始人奇普·威尔逊（Chip Wilson）曾自诩创造了一台完美的商业机器，以至于他离开之后“即便是一台电冰箱来管理这家公司都能成功”。在这话说出的仅一年之后，这台机器的运转就出现了问题。</p>\n  <p>2025财年，lululemon在最主要的美洲市场营收下滑1%；2026财年跌势加快，第二季度美洲营收下降8%，可比销售跌了12%。今年1月，新款紧身裤Get Low因“透光”投诉暂停线上销售，上一次类似的风波还要追溯到2013年。</p>\n  <p>今年5月底，lululemon在长城办了一场瑜伽活动，现场用了日本太鼓，在社交媒体上惹起众怒，公司随后致歉。到第二季度，中国大陆营收按固定汇率计算下滑2%，可比销售跌了8%，远低于公司预期。股价也一路下行，今年5月初每股约130美元，比2023年底的高点跌去近四分之三。</p>\n  <p>同时董事会还得打起精神，应付一位好斗又极富表演欲的创始人。去年11月，威尔逊在华尔街日报上登了一整版面的广告，称lululemon“宛如一架失事的飞机”；今年春天，他干脆发起代理权之争。同时，门外还有野蛮人环伺——去年12月华尔街激进投资者艾略特管理公司（Elliott Management）建仓逾10亿美元，跻身lululemon最大股东之列。彼时公司刚宣布CEO卸任，正在物色接班人。</p>\n  <p>但在知情人士看来，lululemon今天处境绝非一日之寒。在2024年，这家公司主要市场美国开始出现疲软迹象，5月，时任首席产品官Sun Choe无预警离职，当日公司股价即跌去7%。</p>\n  <p>Wedbush分析师汤姆·尼基（Tom Nikic）说这件事发生在“amid this undercurrent of fear”（市场暗流般的担忧之中），并认为她在lululemon过去七年多的成功中起了关键作用。Sun Choe离职之后，公司宣布不再设首席产品官，产品设计交给入职才四个月的创意总监Jonathan Cheung。</p>\n  <p><strong>有lululemon前员工向36氪表示，Sun Choe离开后，公司明显“失去了增长动力”。</strong>在他看来，接手产品设计的Jonathan Cheung上任一年多，并没有拿出令人印象深刻的产品，一些忠实顾客就此流失。Sun Choe离开后没几个月，时任CEO 凯文·麦克唐纳（Calvin McDonald）也公开承认，女装品类“新品不足”（reduced newness）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_06eaa6d41969431d82115cc1a4cdc8f0@5922386_oswg226342oswg3000oswg1320_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2025财年，lululemon在美洲的利润跌幅明显｜制图：36氪</p>\n  <p>这与市场的反应相符。在社交平台上被推荐为“值得入手”的lululemon单品里，最常出现的仍是Align瑜伽裤、Groove喇叭裤、Scuba卫衣和Define夹克，近三年推出的新品很少入选。</p>\n  <p>另一面，lululemon旷日持久的多品类转型仍未看到阶段成绩：鞋履、跑步、高尔夫、网球等名目里，尚没有一个能单独拎出来。鞋类至今被归入“配饰及其他”，这一类加起来只占总营收的13%。</p>\n  <p>2022年，麦克唐纳提出“Power of Three ×2”五年增长计划：以2021年为基数，到2026年营收翻倍至125亿美元，其中男装和数字渠道营收各翻一番，国际市场营收翻两番。如今时间到了，lululemon预计今年营收最多105亿美元；截至2025财年，男装和电商营收只增长了七成多，国际市场增长了约2.4倍，三项都没有达标。<strong>女装仍是lululemon最大的生意，2025财年贡献约63%的营收，这一比例过去三年几乎纹丝不动。</strong></p>\n  <p>截至8月2日的2026财年第二季度，lululemon营收24.2亿美元，同比下滑4%。撑起品牌的核心单品紧身裤销售下滑约20%。公司似乎陷入蜡烛两头烧的境地，全年营收预期随之下调为同比下滑5%至7%。</p>\n  <p>去年12月，麦克唐纳宣布卸任，今年1月底离开。半年内一系列人事变动随之展开，核心管理层几乎全部换人。最引人关注的是耐克老将海蒂·奥尼尔（Heidi O’Neill）9月8日正式就任CEO，结束了lululemon持续七个多月的临时联席CEO安排。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_25fb3db845d9477eaae0a04240016fbc@5922386_oswg74914oswg430oswg430_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">lululemon首席执行官Heidi O’Neill</p>\n  <h3 label=\"二级标题\">外来和尚</h3>\n  <p>海蒂在耐克工作了超过25年。最近的职位是消费者、产品与品牌总裁，统管全球产品线、品牌与营销，任内压缩了产品开发周期，并把足球和跑步列为优先品类。</p>\n  <p>在此之前，她以消费者与市场总裁的身份负责耐克在170多个国家的业务和损益，更早还主管过全球直营与数字业务，覆盖门店、电商、App和会员体系。</p>\n  <p><strong>接近耐克的知情人士向36氪透露，海蒂是耐克前CEO约翰·多纳霍（John Donahoe）的得力助手，是耐克直营战略和产品创新的关键推动者，也曾是耐克下届CEO的热门人选。</strong></p>\n  <p>lululemon董事会执行主席马蒂·莫菲特（Marti Morfitt）在一份声明中表示：“我们选择海蒂，是因为她经验广泛，曾在大规模业务中成功推行突破性的创意和举措，并且能够以内行的身份推动变革与增长。”</p>\n  <p>另一面，lululemon也终于和创始人达成了暂时的停战协议。今年5月27日，股东大会召开前夕，公司与威尔逊签署合作协议：威尔逊提名的ESPN前首席营销官劳拉·詹蒂莱（Laura Gentile）、昂跑前联席CEO马克·毛雷尔（Marc Maurer）进入董事会，公司还承诺再增补一位具备服装产品与品牌经验的董事；作为交换，威尔逊接受约18个月的停火期，并遵守投票约束和不诋毁条款。</p>\n  <p>海蒂获任的消息公布次日，lululemon股价下跌13%。一种观点认为，她的履历不够“野”。作为在耐克体系里成长起来的职业经理人，她未必能给这家公司带来足够的外部冲击，何况她力推过的直营战略，正是耐克现任CEO贺雁峰（Elliott Hill）上任后着手扭转的方向。</p>\n  <p>但也有分析师认为，lululemon的基本盘没有问题，财务依然健康，用不着传说中的猛药。“一家公司不可能永远保持爆发式增长。”晨星分析师大卫·斯沃茨（David Swartz）说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_3ceee608b1f542a099b79036565606ff@5922386_oswg163360oswg2400oswg1320_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">新品乏力，lululemon的季度库存仍处在相对高的位置 ｜制图 36氪</p>\n  <p>无论如何，新品吸引力不足仍是公司眼下最急迫的问题。“我们看到顾客对营销活动和部分新款式反响不错，但整体而言，产品上市后的市场反应仍然不稳定。”今年9月的第二季度财报电话会上，身兼临时联席CEO与首席财务官的梅根·弗兰克（Meghan Frank）说。</p>\n  <p>海蒂上任刚满一个月就动了产品线的架构。10月7日，她任命Athleta CEO玛吉·高格（Maggie Gauger）为总裁兼首席产品官，统管设计、商品企划、鞋类、产品创新和材料科学，现有的设计与商品负责人都改向她汇报。这个职位在Sun Choe离开后空缺了两年多，其间设计和商品分属两条汇报线，如今重新收归一人。</p>\n  <p>lululemon对产品创新的忽视有其历史和结构上的根源。一位lululemon前高管向《环球邮报》旗下杂志《Report on Business》透露，2018年麦克唐纳上任前夕，公司的汇报结构已经变了，商品企划负责人拿到了更大的决策权。<strong>这是一种鼓励经验和路径依赖而非破坏式创新的安排。</strong>“你最终会变成一个长得跟别人差不多的品牌，”这位前高管说，“一切都很基础，很安全牌。”</p>\n  <p>lululemon在麦克唐纳任内实现了跨越式增长：营收从2017财年的26亿美元涨到2025财年的111亿美元，翻了两番；净利润在2024财年达到18亿美元的高点。但隐患也在这些年里埋下，Sun Choe的出走只是一个缩影。</p>\n  <p>“我不认为任何一个早年待过的人，会觉得它还能回到过去的样子。”曾在lululemon工作近十年的前高管布里·斯坦莱克（Bree Stanlake）说。但她也认为，lululemon需要重新焕发活力。</p>\n  <h3 label=\"二级标题\">sweet spot</h3>\n  <p>很长时间里，lululemon都对品牌形象锱铢必较。“第一个l必须小写。”公关曾这样要求媒体。在英文语境里，小写字母常被视作低调、谦逊、更有人味；而对品牌名写法如此较真，更常见于奢侈品而非运动公司。</p>\n  <p>在那几年，lululemon确实更像一个奢侈品牌，或者说，一家生活方式公司，而不是一个瑜伽品牌。从产品层面看，它的创新也已经很长时间与瑜伽无关了。刚刚结束的进博会上，lululemon一口气发布了三款新品，没有一款是为瑜伽准备的。</p>\n  <p>Ventscape跑步马甲瞄准的是冷天跑步的老难题：起跑时冷，跑开了又闷又潮。它把PrimaLoft ThermoPlume+保暖夹层和网眼面料拼在一起，在保暖和透气之间找平衡。Unrestricted Power训练系列用的是自研的PowerLu面料，主打支撑与灵活兼顾，减少深蹲、举重时衣服的束缚和移位。ShowZero网球系列则通过改变光线与面料的相互作用，让衣服被汗打湿后不易显痕。在一项靠出汗决胜负的运动里，lululemon的技术重点是让人看不出你出了汗。后两款要到2027年才在中国上市。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_c60260f49e6242418a28b34126e951c0@5922386_oswg63468oswg705oswg605_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Ventscape跑步马甲 ｜来源：品牌</p>\n  <p>从某种程度上说，lululemon也确实越来越像一个传统运动品牌。公司介绍，研发这款跑步马甲时，他们找来一群运动员，穿着原型在科罗拉多州的公路上跑了十几公里，再把反馈收集起来，作为后续几代产品迭代的依据。</p>\n  <p>按品牌的说法，lululemon产品的核心是“触感科学”（Science of Feel）：那些名目繁多的“科技”，背后说到底是面料和剪裁。<strong>在更强调动力科学的耐克、阿迪达斯衬托下，主打面料舒适度确实是一个差异化的卖点。</strong>但这是否也把lululemon的优势框在了贴身层（Base Layer）里？要知道，上一个靠贴身层打出名气的Under Armour，至今仍在泥潭里挣扎：截至今年3月的2026财年，它的营收下滑4%至约50亿美元，净亏损4.96亿美元，重组阶段还没走完。</p>\n  <p><strong>接近lululemon的人士告诉36氪，公司在体育营销上的思路也和耐克、阿迪达斯不同，“我们不会强调竞技上的输赢”。</strong></p>\n  <p>话虽如此，lululemon的签约名单上并不缺赢家：七届F1世界冠军刘易斯·汉密尔顿（Lewis Hamilton），在2010年温哥华冬奥会上打进冰球“金球”的西德尼·克罗斯比（Sidney Crosby），两度闯入美网男单四强的弗朗西斯·蒂亚福（Frances Tiafoe），2021年美网女单亚军莱拉·费尔南德斯（Leylah Fernandez），还有高尔夫球手马克斯·霍马（Max Homa）和Min Woo Lee。它还是加拿大奥运代表团的官方装备商。</p>\n  <p>在中国，它今年签下了网球运动员郭涵煜，品牌称她是首位征战全部四大满贯的中国签约球员。只不过在官方表述里，这些人被选中，理由往往是“领导力”和“对社区的积极影响”，而不是奖杯。</p>\n  <p>这到底是有意为之的策略，还是后来者的权宜之计，尚不可知。但这也许让lululemon始终处在一个需要拿捏平衡的中间地带：它想吸引真正热爱运动的人，“目标明确、积极向上”，却又不希望他们太过争强好胜。某种程度上，这比威尔逊口中的“超级女孩”（Super Girls）还难找。在他的回忆录里，完美的超级女孩24岁，受过良好教育，是顶尖运动员，对目标和运动都满怀热情。</p>\n  <p>从消费者的角度，他们似乎也并不想在lululemon买毛衣和裙子。GlobalData董事总经理尼尔·桑德斯（Neil Saunders）批评lululemon的货架上塞了太多“非核心产品”；今年第二季度，“配饰及其他”品类营收下滑13%。弗兰克也承认，公司今年对货品组合做了一些“纠偏”，砍掉了部分偏离核心优势的小配件。</p>\n  <p>更耐人寻味的是，lululemon当年的魔法仍然有效。<strong>紧身裤并没有过时，“穿得像一个热爱运动的富家女”依然备受追捧。</strong>Vuori、Alo Yoga都从lululemon身上学到了不少东西。有的品牌干脆就是lululemon旧部创办的，比如Left on Friday。Vuori在2024年底估值达到55亿美元，Alo则在今年进入了中国市场，计划一口气开出八家门店。</p>\n  <p>安大略运动品牌Azur Fit的创始人艾琳·沃德-威廉姆斯（Erin Ward-Williams）也在店里开瑜伽课。有顾客提醒她，同一商场里的lululemon也在办课，“他们在抄你”。她纠正对方：“他们没有抄我。那本来就是他们开创的。”</p>\n  <p>如今，轮到开创者回头去找那个甜蜜点了。</p>", "category": "tech", "published_at": "2026-11-12T02:20:56+00:00", "fetched_at": "2026-11-12T05:30:42.792456+00:00", "fingerprint": "c7d9a45cec754d53"}, {"source": "36氪 - 最新文章", "title": "联想为何要做词元生意？｜最前线", "url": "https://36kr.com/p/4066221891196036?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_2c55dccc03054ab9986bafa86e86d7eb@6310690_oswg1529519oswg1552oswg1014_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源联想官方</p>\n  <p>文｜肖漫</p>\n  <p>编辑｜袁斯来</p>\n  <p>11月10日，联想发布了“万全混合词元工厂”品牌，并宣布与张家口市政府合作建设首个混合词元母本工厂。</p>\n  <p>按照联想公布的规划，张家口母本工厂初期将建设1.5万P异构算力集群、约100MW智算中心，词元年产量超过2000万亿，峰值词元产出达到每秒2亿。到2030年，相关核心指标预计将在现有基础上提升10倍以上。</p>\n  <p>这意味着，联想希望改变过去从“卖AI设备”为主的业务模式，将算力资源进一步转化为“AI产出”。</p>\n  <p>过去三年，AI产业最确定的生意是算力。</p>\n  <p>从英伟达GPU到服务器、交换机，再到数据中心和配套电力设施，资本和产业资源持续涌入AI基础设施建设。谁能拿到芯片、谁能建设更大规模的算力集群，成为这一阶段竞争的关键。</p>\n  <p>但算力建设并不等于直接商业价值兑现，购买服务器、建设智算中心只是AI投入的开始。模型训练和推理需要持续消耗算力，如何提高设备利用率、降低单位推理成本、让模型稳定完成实际任务，才是AI能否真正进入业务流程的关键。</p>\n  <p>尤其当 AI 从简单地聊天工具走向智能体，Token消耗正不断增加。</p>\n  <p>过去，用户向大模型提出一个问题，模型返回一段答案，Token消耗相对有限。现在，智能体开始承担搜索、分析、决策和执行等连续任务，一次业务流程可能需要多轮模型调用，Token消耗也随之增加。国家数据局数据显示，截至2026年6月，我国日均词元调用量已突破500万亿。</p>\n  <p>这意味着，AI产业链的竞争正在出现新的变化：过去比拼的是谁拥有更多算力，接下来还要比谁能用同样的算力生产更多、更便宜、更有效的Token。</p>\n  <p>中信建投证券计算机行业首席分析师应瑛在会后交流时提到，从报表和投资账面看，AI基础设施仍然占据较高价值，但从未来三年的实际利润增速看，Token运营和应用环节有望承接更多的增长。</p>\n  <p>这与早期云计算产业的发展有相似之处。云计算最初解决的是企业IT资源的供给问题，随后竞争逐渐转向资源调度、平台服务和应用生态。AI基础设施也可能经历类似的过程：从卖算力，走向卖算力服务，再走向卖实际的AI生产能力。</p>\n  <p>在这个过程中，词元工厂成为一种新的基础设施形态，应瑛将其视为“New Cloud”，即新一代云平台。</p>\n  <p>词元工厂并不是简单地把一批GPU集中起来，再向外出售Token。它还需要解决不同算力、模型和业务之间的匹配问题。</p>\n  <p>联想为万全混合词元工厂搭建了“三层混合动力”——底层是联想问天AI基础设施，负责提供异构算力；中间层是万全混合词元工厂，负责算力管理、模型调度和Token生产；上层则是擎天与百应智能体解决方案和服务，将Token转化为具体业务场景中的生产力。</p>\n  <p>联想并不是唯一一个看到Token运营机会的企业。过去两年，不少原本主营服务器或算力设备的企业，也开始向Token运营和服务延伸。云厂商本身拥有算力资源、模型生态和客户入口，也在争夺企业AI基础设施市场。</p>\n  <p>应瑛认为，企业要进入词元工厂市场，可以类比云计算和IDC（互联网数据中心）行业，分硬资源、软运营两个门槛。硬资源方面，土地、电力价格或者服务器基础设施采购部署，只要有一项具备成本优势，就有一定入场基础；软运营方面，则需要能够进行算子调优、搭建高并发云平台的技术团队。即使硬件条件相同，不同运营团队也可能生产出成本差异明显的Token。</p>\n  <p>这意味着，词元工厂并不是一个只靠资本投入就能建立壁垒的行业。算力规模可以通过投资获得，但持续的调度优化、客户理解和运营效率，需要在真实业务中积累。</p>\n  <p>Token生产只是中间环节，企业愿意持续付费的最终原因取决于AI是否帮助它缩短了研发周期、提高了生产效率，或者创造了新的收入。</p>\n  <p>从服务器到智算中心，再到词元工厂，联想实际上是在争夺AI基础设施产业链中更靠近客户、也更接近商业价值兑现的位置。</p>\n  <p>不过，这场竞争才刚刚开始。对于联想而言，建设词元工厂只是第一步，能否把算力、模型和运营能力组合成一门有稳定客户、有持续收入、也有合理利润的生意，才是这场转型真正的考验。</p>", "category": "tech", "published_at": "2026-11-12T03:35:37+00:00", "fetched_at": "2026-11-12T05:30:42.792447+00:00", "fingerprint": "771af91436143677"}, {"source": "36氪 - 最新文章", "title": "写在《影之刃零》发售一周后 | 玩点好的", "url": "https://36kr.com/p/4065714826269824?f=rss", "summary": "<p>文丨果脯</p>\n  <p>现在再聊《影之刃零》本身，可能时间稍晚了。毕竟，满打满算游戏迄今已经上线一周有余，多数玩家都已经顺利完成了一周目，市面舆论也完成低开高走。</p>\n  <p>目前，游戏已经从上线初期的77%好评率，逐步回暖到了现在的94%，并且可能还会持续上涨；另一边的PS商店则有九成用户打出了满分。而在游戏发售72小时后，官方也表示全平台销量已经突破400万份。基于这份成绩，想来未来销量累计突破千万，恐怕也已经是时间问题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_6a62e158613d41ab9da8885b0a199e01@6202862_oswg489864oswg1080oswg555_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《影之刃零》Steam页面</p>\n  <p>但如今再看《影之刃零》，其实仍不乏大量需要思考与纠结的复盘问题。</p>\n  <p>不可否认，哪怕抛开「国单」标签，放眼世界，《影之刃零》都是一款优秀的作品。</p>\n  <p>这个优秀，既来源于游戏本身的质量呈现，也来源于它能在不甚明朗的开局前提下，仍能说服大量玩家，逆转大众对其的第一印象。甚至我亲眼见证了同事从最初对其的各种不满，到最后折服于整段沐小葵的Boss战体验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_fec0dabfbdbb4171a5c7dd525937231e@6202862_oswg592182oswg1080oswg657_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">沐小葵</p>\n  <p>但其中更重要的，或许是《影之刃零》在整个产品身上体现的「成长感」。毕竟市面上已经不乏对其的各类褒赞，我反而想从不足处再聊两嘴这款产品。</p>\n  <p>可能于不少玩家而言，《影之刃零》的通关体验是一个充满和解、接受或是逐步认可的过程。</p>\n  <p>一个明显的特征是，几乎没人会觉得第一二章的内容存在可圈可点之处。相反，更多人的高评价都来源于后续内容足够惊艳，让他们能够「原谅」前期章节的不足。当然，随着玩家逐步上手、熟悉，诸如打击感、战斗节奏等问题也正逐步被适应，对应都负面反馈也就自然而然被削弱。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_cb93fe0b73964b0a828ea96d86f3f2e4@6202862_oswg535234oswg1080oswg609_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Boss舞狮尊主</p>\n  <p>以及一些足够惊艳的传统文化设计</p>\n  <p>但个人来看，许多问题在《影之刃零》身上并没有得以解决，更值得认可的是团队创作者们在整个过程中付诸的思考。</p>\n  <p>毕竟如果每个产品都要追求极致，那么不论是《影之刃零》，还是更早的《明末：渊虚之羽》《黑神话：悟空》，最终都只会变成遥遥无期的空谈。</p>\n  <p>最明显的就是整套动作内容设计。</p>\n  <p>在早期的反馈中，动作内容是存在最多问题的模块，比如大量玩家吐槽「打击感不足」「反馈差」。一方面，这个问题主要受游戏整体内容完成度的影响，像音效、动作，以及各类细微处的技术画面表现，都可能对打击感带来破坏性的影响。更何况，《影之刃零》本身强调高速战斗与博弈，打击感在此间的重要性又要退而求次，完成度并不高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_2bca1dd570584a5c989cdd3670256d77@6202862_oswg1066534oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏里的醉剑可以喝酒</p>\n  <p>说白了，单论动作内容，《浪人崛起》《鬼武者：剑之道》都足够成为《影之刃零》的老师，而《影之刃零》在质感、特色方面则更胜几筹。</p>\n  <p>另一方面，打击感问题一定程度上也是整个武侠题材的锅。</p>\n  <p>不少业内人士在讨论中，更倾向于用《战神4》对标《影之刃零》，核心原因就是《战神4》在题材与沉浸感间达到了绝佳的设计平衡——说白了就是，做出了让玩家认可的「西方神仙大战」。而当年《黑神话：悟空》的各路预告能够惊艳众人，也是因为它做出了足够扎实的东方神话质感。</p>\n  <p>但放在武侠打斗上，这些又是另一回事。</p>\n  <p>在强调动作的游戏里，卡肉、顿帧这种常规设计可以用以突出重量感，高速连段则能够强调速度感和连段体验，但在武侠背景里，《影之刃零》既要确保招式独特、博弈在线，又得让每套攻击都有其专属的技术表现，这显然并不现实——更何况，在传统武侠题材作品里，可能很多东西直接体现起来就是「轻飘飘」，或者说飘逸的，如果想要硬凹，更容易就会把杀人术变成了舞台表演。</p>\n  <p>因此，《影之刃零》最终处理的思路是，把招式「藏」起来，把武器、对抗博弈的重要性提起来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_daa67e485cad425685ae132295149750@6202862_oswg501057oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">白山风雷剑</p>\n  <p>像一些基础性的招式，比如横扫、蹬腿等，会在特殊境地下，随攻击自然触发，这使得不同情境的战斗能展现不同的武学表达，同时也是丰富游戏的特殊交互内容，增加惊喜感。</p>\n  <p>而更加复杂的体系化内容，他们就会针对性做成武器，或是Boss战的的QTE交互。比如在游戏里，每一件武器都有各自的连段特性，并且都配套了数种处决动画，而作为「技能」的影之武装，则会更强调各路武学的表现形式。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_44ed2c8e40ab4837a825fc44b692692e@6202862_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">处决技</p>\n  <p>随着内容广度拓宽，玩家也自然就接受了深度不足的遗憾。更何况，恐怕现今还没有几款游戏，能像《影之刃零》一样把各类武学招数的交互自然地融入到各类战斗之中。哪怕是背靠《流星蝴蝶剑》后出身的《永劫无间》，基本也还是遵循了技能演出的逻辑，没有那么强的交互感。</p>\n  <p>其次则是游戏的心流设计。</p>\n  <p>说句不好听的，《影之刃零》的心流设计存在一定的节奏问题。从地图设计看，它做的是类银河恶魔城式的箱庭地图，但地图各个板块之间的衔接与过渡，基本都是围绕高密度的铃铛（坐火点）来构筑。而一切高密度且无意义的铃铛，恰恰又最容易阻断玩家的沉浸感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_c9a21bd25261414e972a95a0c4bb6dfc@6202862_oswg962491oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏里的幻境地图（里武林）</p>\n  <p>至于铃铛的密度有多高……最夸张的情况莫过于，当你第一章首个Boss战结束后，只需走两步路看一段对话，就会立马发现又有一个铃铛。</p>\n  <p>于是，每个地图中带给玩家推进感的既不是景色变幻，也不是山重水复的惊喜感，而是「下一个铃铛在哪里」。</p>\n  <p>诚然，高密度的铃铛大量减少了玩家的跑图认路成本，但也是在地图设计层面给出了一个相对粗暴的解法。比如《影之刃零》最为重要的地图「庞镇」，其底层的跑路逻辑反而并不如前一章「陆家村」来得精妙，基本只是用铃铛连接了多个重要建筑板块。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_4328b99264044ef0870fa59a0636d96c@6202862_oswg885448oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏最重要的区域庞镇</p>\n  <p>也就是说，在这游戏里玩家的认路逻辑只有两种：一是判断自己有没有开启铃铛，破除地图迷雾；二是看相应地方的收集品、小怪有没有清除。</p>\n  <p>单从设计层面来看，比起纯粹的环境引导，这种设计肯定会更加破坏心流，也比较取巧。但从玩家的角度来看，如果可以，我个人其实更希望80%的游戏选择这一设计方法，毕竟它难度不高也好用，而且……也比较现实。</p>\n  <p>这才是《影之刃零》的可贵之处。</p>\n  <p>《影之刃零》无疑是有野心的，不论是从商业还是IP的角度而言。但过去很多年里，玩家吃过的细糠太多，很多人都忽略了游戏设计究竟有多难。直到近几年，随着国外惊艳全球的大作减少，许多开发者也才渐渐意识到这事。</p>\n  <p>直接游戏本身举例说明的话，这就好比想要击败Boss，80%玩家更轻松的选择都是找一套比较轮椅的战斗套路，而不是像UP主纯黑的视频一样兼顾表演、无伤和Boss交互。一套并不优秀的隐性引导，并不比直接干脆的显性引导好上多少。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_aed5e850d2924761966d17bfea6fcdaa@6202862_oswg417233oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏中的饰品，可以提供各类数值加成</p>\n  <p>就像这个饰品，低手惜之如命，高手嗤之以鼻</p>\n  <p>从这点来看，《影之刃零》，或者说如今有所成就的国单，都有一个难得的品质——克制。</p>\n  <p>这不单指设计层面不要好高骛远，或者说完成比完美重要，还强调给自己、给玩家能够呼吸的空间。无疑，在单机领域层面，国内开发者单论能力，其实并不比国外差多少，更多时候，他们只是没有国外那么好的市场土壤和积累足够深厚的项目管理经验，甚至许多东西（像国产题材的3A设计）还处在一个起步探索的阶段。</p>\n  <p>换而言之，《影之刃零》不是一部基于短板效应的游戏，相反，它只要拿出一段长板，就足以收获玩家认可，而剩下的东西，就是尊重玩家，或者说不为难玩家，比如减少游戏的垃圾时间，更为「慷慨」的游戏数值等等。这些东西，甚至受国外单机游戏冲击，曾变成一部分国内开发者心中的「祖宗之法」，不可轻变。</p>\n  <p><strong>结语</strong></p>\n  <p>可实际上，游戏行业何来「祖宗之法」？</p>\n  <p>游戏作为文娱类商品，比抄作业更可怕的是创作者选择放弃思考。继《黑神话：悟空》《明末：渊虚之羽》之后，国内一度掀起大批量的「类魂」产品风，甚至就连《影之刃零》做了类似坐火点的铃铛，都被不少人拿来比对类魂，说它哪里做得够「魂」，哪里又不「魂」。</p>\n  <p>更进一步来看，国产单机和主机游戏在过去两年迎来了快速增长机会，早前还有已经持续了十年的「索尼中国之星」计划，已经扶持并推出了多款优秀作品。然而游戏行业终归是内容行业，即使索尼扶持之下依然有不少国单折戟。因为在这背后，比抄作业更可怕的是创作者选择放弃思考。</p>\n  <p>不可否认，于很多开发者来说，「类魂」的确是一个低成本、高成功率的选择。但游戏行业从来不只有魂，「魂」也只是一种设计风格，而不应该成为一套可供复用的通解——就像不是只要用UE5做了就能算是3A游戏。</p>\n  <p>甚至个人来看，《影之刃零》能够突出长板，哪怕只在其他系统做出基础线之上的设计，就已经比之纯粹的「抄作业」要优秀了不少。</p>\n  <p>更别说，它本身的许多设计都已经有了自己的思考。比如在普通难度中，很多人都忽略了「六十六天」这一设定，但据梁其伟所述，游戏中这一设定与整套游戏系统bulid有着紧密的联系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261112/v2_04fb34476e94415aae36d9c232a2bbd2@6202862_oswg429459oswg880oswg557_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">甄子丹</p>\n  <p>在多周目解锁的「六十六天」难度里，玩家其实也才能真正理解游戏内许多地图设计的小巧思——比如为什么整个游戏里，最「阴间」的只有能够自爆以命换命的爆弹怪；以及为什么，在前往庞镇前游戏会进入回忆扣除天数，在庞镇及后续地图这一设计又不再可见。</p>\n  <p>《影之刃零》当然是不完美的游戏，甚至我迄今都认为它缺点颇多，甚至其中不少Boss设计都多少有点粪怪潜质。但从市场来看，它又是今年最值得尊重、认可的单机游戏，毕竟单凭设计精神，它就已经超越了国内外整个游戏行业太多创作者了。</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s/wfp-skIx3AwTBGDtfhECqw\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_ ver AI-generated responses and insights based on users' health data reported from their [&#8230;]", "category": "tech", "published_at": "2026-11-10T21:40:31+00:00", "fetched_at": "2026-11-11T04:24:56.328947+00:00", "fingerprint": "daf7e9e96e7de529"}, {"source": "The Verge", "title": "The VR Disney Plus app on Meta Quest now has 3D movies", "url": "https://www.theverge.com/tech/1031256/meta-quest-disney-plus-vr-3d-movies", "summary": "Disney is bringing more than 60 3D movies to the Disney Plus app on Meta Quest. The movies will be available to Disney Plus subscribers as part of an updated Disney Plus app that's rolling out today. The 3D movies you can check out include The Avengers and Black Panther, Meta says. But the updated [&#8230;]", "category": "tech", "published_at": "2026-11-10T22:00:00+00:00", "fetched_at": "2026-11-11T04:24:56.328943+00:00", "fingerprint": "e2816ea59479a5b2"}, {"source": "The Verge", "title": "Microsoft’s DLSS competitor is out for the Xbox Ally X and works in handheld mode", "url": "https://www.theverge.com/tech/1031446/microsoft-automatic-super-resolution-auto-sr-upscaling", "summary": "Microsoft is now rolling out Automatic Super Resolution (Auto SR), an upscaling technology that competes with Nvidia's DLSS, for the Xbox Ally X, Xbox Ally X20, and select Windows Copilot Plus PCs, the company announced today. Auto SR is also getting some new features alongside this official release. In April, Microsoft started testing Auto SR [&#8230;]", "category": "tech", "published_at": "2026-11-11T00:34:24+00:00", "fetched_at": "2026-11-11T04:24:56.328937+00:00", "fingerprint": "ad03d6d88297a6a8"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨英伟达及黄仁勋遭股东集体诉讼，市值两天蒸发2.85万亿；Anthropic正式启动IPO路演；阿里拟分拆平头哥独立上市", "url": "https://36kr.com/p/4064610635781257?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>外交部：中美双方就两国元首年内互动安排保持着沟通</p>\n  <p>全球芯片LOF于11月10日下午开市起停牌至收市</p>\n  <p>董明珠回应格力电器业绩下滑&nbsp;</p>\n  <p>宝马选定LG新能源、三星SDI供应下一代动力电池</p>\n  <p>百事公司北美业务陷入困境，裁员1000人</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>黄仁勋及英伟达，被指控涉嫌欺诈股东</strong></p>\n  <p>当地时间9日，美股收盘五分钟后，英伟达及黄仁勋便遭到股东集体诉讼，指控其涉嫌欺诈股东。分析师认为，一旦黄仁勋离任，英伟达将面临巨大的接班难题。现年63岁的黄仁勋是英伟达的核心支柱，金融数据服务商FactSet的数据显示，黄仁勋是英伟达第五大股东，持股约3.58%。分析师认为，公司目前没有成熟的接班计划，倘若黄仁勋离职，这将是一次大规模的领导层更替，而公司并未为此做好准备。</p>\n  <p>受到黄仁勋出轨事件持续发酵影响，算力芯片巨头周二继续下跌超5%，单日市值蒸发超2090亿美元，约合人民币1.39万亿元。本周前两天，公司市值累计蒸发超4200亿美元，相当于2.85万亿元。（第一财经、财联社）</p>\n  <p><strong>Anthropic正式启动IPO路演，发布相关路演视频</strong></p>\n  <p>Anthropic于11月10日正式启动首次公开募股（IPO）路演，并在官网发布相关路演视频。公司计划发行8.25亿股A类普通股，发行价区间为每股70至78美元，按发行价上限计算，基础发行规模最高约643.5亿美元。其中，Anthropic自身发行约8.014亿股，部分现有股东出售约2365万股。公司拟以代码“ANT”在纳斯达克全球精选市场上市。承销商另拥有30天额外购买最多1.2375亿股的选择权。</p>\n  <p>11月10日，一份文件显示，谷歌、英伟达、AMD、博通、美光、微软及台积电合作伙伴公司已同意通过同步私募方式，合计认购260亿美元的Anthropic无投票权普通股，认购价格与IPO发行价相同。（新浪财经、界面新闻、财联社）</p>\n  <p><strong>阿里巴巴：已正式申请平头哥独立上市</strong></p>\n  <p>36氪获悉，11月10日晚，阿里巴巴集团发布公告称，已向香港联交所交表，申请旗下子公司平头哥独立上市。上市完成后，平头哥仍将是阿里巴巴子公司。公告显示，2026年9月11日，平头哥已向香港联交所递交上市申请，拟通过H股在香港联交所主板独立上市。据悉，IPO具体规模尚未最终确定。截至2026年4月，平头哥真武系列AI芯片累计出货量达56万片。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌宣布Pathways在云端正式全面开放</strong></p>\n  <p>11月9日，谷歌宣布，Pathways现已在Google Cloud Platform正式全面开放。Pathways是谷歌自主研发的大规模分布式机器学习运行系统，曾用于训练Gemini等大型模型，目前向谷歌云客户开放。（财联社）&nbsp;</p>\n  <p><strong>Meta计划组建销售团队，拓展AI产品企业客户市场</strong></p>\n  <p>据报道，Meta Platforms正采取进一步措施，推动AI产品面向企业市场销售。公司已开始组建销售组织，计划向中小型企业销售AI产品，并与咨询公司及系统集成商建立合作关系，以争取大型企业客户。（财联社）</p>\n  <p><strong>马斯克透露擎天柱机器人最新消息</strong></p>\n  <p>特斯拉的人形机器人“擎天柱”是市场关注的焦点产品之一，特斯拉公司首席执行官马斯克日前表示，“擎天柱”将在2027年底左右开始交付，但交付形式可能是“租”而不是“卖”。马斯克表示，擎天柱的初期成本可能与电动汽车差不多，每台机器人的初始成本约为3万美元，之后会降至2万美元左右。马斯克预计擎天柱至少需要一年时间才能达到全面量产，在对外交付前，擎天柱将先在特斯拉的自有工厂中使用。特斯拉方面此前表示，“擎天柱”的工作效率将达到普通人的五倍左右。据业内人士透露，特斯拉可能在12月初开放擎天柱的预订。（央视财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>高盛预测Anthropic 2030年营收突破6000亿美元</strong></p>\n  <p>据Anthropic的主承销投行高盛的预测，Anthropic到2030年营收有望突破6000亿美元，较去年营收增长超130倍。高盛向该笔IPO潜在投资者展示的预测模型显示：公司今年总营收预计约520亿美元，2027年增至1360亿美元，2029年达到4420亿美元，2030年进一步冲高至6000亿美</p>\n  <p><strong>特斯拉国内10月销量暴跌，从第1掉至66名</strong></p>\n  <p>11月10日消息，据懂车帝排行榜最新数据，2026年10月特斯拉Model Y国内零售销量仅为7,807辆，较9月的50,359辆减少42,552辆，排名从第1位直接跌至第66位。从月度走势看，Model Y今年4月至9月的零售销量分别为22,990辆、28,911辆、38,654辆、25,158辆、29,260辆和50,359辆，排名基本稳定在全车型榜前三，6月和9月两度拿下月销冠军。10月榜单上，Model Y排在奔驰E级、丰田亚洲龙之后，销量同比下滑约六成。</p>\n  <p>品牌整体表现同样走低，10月Model 3国内零售1,010辆，特斯拉品牌当月国内零售合计8,817辆，同比下滑66.1%，是2022年7月以来的最低单月成绩，国内零售已连续第5个月同比下滑。（快科技）</p>\n  <p><strong>外交部：中美双方就两国元首年内互动安排保持着沟通</strong></p>\n  <p>11月10日，外交部发言人郭嘉昆主持例行记者会。有记者就中美元首会晤提问。郭嘉昆表示，中美双方就两国元首年内互动安排保持着沟通。（央视新闻）</p>\n  <p><strong>京东科技被曝架构调整，正式拆分“云科技”与“金融科技”两大板块</strong></p>\n  <p>据市场消息，京东科技上周内部官宣重大架构调整：公司正式拆分为“云科技”与“金融科技”两大板块，均与京东零售平级。其中，“云科技”一号位为徐丰。公开信息显示，徐丰是京东集团副总裁、原京东科技数字城市群总裁。2023年1月，京东科技进行组织架构调整，设立“一部三中心”，徐丰由原京东科技数字城市群总裁变动为京东科技销售中心负责人；2023年4月，徐丰升任京东科技总裁，向CEO李娅云汇报。2025年3月，时任京东集团副总裁、京东科技总裁的徐丰由M4-1晋升为M4-2。与此同时，京东探索研究院也被拆分，JoyAI、AI算法等核心部门整体并入云科技，并单列为一个C1部门。对于上述消息，向京东官方求证，截至发稿暂无回应。（新浪科技）</p>\n  <p><strong>贵金属价格波动，中国金币集团发布风险提示</strong></p>\n  <p>36氪获悉，中国金币集团发布关于贵金属价格波动的风险提示，文章表示，近期，受国内外多重宏观因素叠加影响，贵金属价格震荡加剧。广大集藏投资者需树立理性稳健的配置理念，客观认知贵金属市场运行规律，高度重视市场价格波动风险。理性参与、审慎操作，避免盲目追涨杀跌，科学管控投资集藏风险。</p>\n  <p><strong>全球芯片LOF于11月10日下午开市起停牌至收市</strong></p>\n  <p>36氪获悉，景顺长城基金管理有限公司公告，近期，景顺长城基金管理有限公司旗下景顺长城全球半导体芯片产业股票型证券投资基金二级市场交易价格明显高于基金份额净值，出现较大幅度溢价。11月10日中午收盘，本基金二级市场的收盘价为3.118元，截至11月6日，本基金基金份额净值为2.3571元。特此郑重提醒广大投资者，应密切关注二级市场交易价格溢价风险，审慎做出投资决策，如盲目投资，后续可能遭受重大损失。为保护投资者利益，本基金于2026年11月10日下午开市起停牌至当日收市，停牌期间本基金赎回业务照常办理。</p>\n  <p><strong>董明珠回应格力电器业绩下滑</strong></p>\n  <p>格力电器董事长董明珠近日谈及格力电器业绩承压的现状，董明珠表示，原材料铜价格上涨给企业经营带来压力，铜的价格达到铝价的5至6倍。在成本上涨的现实情况下，格力选择坚守产品品质，坚持使用铜材生产相关产品，宁可承受几十亿元的利润损失，也不愿为压缩成本更换材料。“铝也可以用来制作相关零部件，但在稳定性、可靠性、使用持久性方面存在不确定性，最终受损的会是广大消费者。”董明珠说，维护品牌根基，首要就是守住产品品质，不能以牺牲产品质量为代价换取短期经济效益。（界面新闻）</p>\n  <p><strong>央行11月10日开展1900亿元隔夜逆回购操作，操作利率为1.25%</strong></p>\n  <p>36氪获悉，央行11月10日开展1900亿元隔夜逆回购操作，操作利率为1.25%。</p>\n  <p><strong>美股三大指数集体收跌，英伟达跌超5%</strong></p>\n  <p>36氪获悉，11月10日收盘，美股三大指数集体下跌，纳指跌0.74%，道指跌0.3%，标普500指数跌0.38%。大型科技股多数下跌，英伟达跌超5%，近两个交易日累跌超9%，市值累计蒸发超4200亿美元；微软、英特尔跌超2%，苹果、谷歌小幅下跌，亚马逊涨超1%，特斯拉小幅上涨。热门中概股普跌，蔚来、爱奇艺跌超3%，阿里巴巴跌超2%，拼多多、网易、百度跌超1%，小鹏集团、哔哩哔哩小幅下跌，理想汽车涨超1%。</p>\n  <p><strong>美国信用卡债务总额升至1.29万亿美元，创历史新高</strong></p>\n  <p>当地时间11月10日，美国纽约联邦储备银行公布的最新家庭债务报告显示，今年第三季度，美国信用卡债务总额增加220亿美元，达到创纪录的1.29万亿美元，同比增长4.2%。纽约联储研究人员表示，随着通胀高企和借贷成本上升，消费者面临的财务压力持续加大，低收入及信用评分较低的借款人还款困难的情况尤为突出。数据显示，美国新发信用卡的平均利率约为24%，信用卡仍是成本较高的借贷方式之一。(央视新闻)</p>\n  <p><strong>据报英伟达CEO黄仁勋退出两场活动，日程中不再出现其姓名</strong></p>\n  <p>Business Insider援引一名不具名知情人士报道，英伟达首席执行官黄仁勋原定周一晚间在一场非公开CEO论坛上接受Anthropic一名高管的访谈，但目前已不在活动议程中。（新浪财经）</p>\n  <p><strong>理想汽车：“理想i6团购返佣”活动与公司无关</strong></p>\n  <p>36氪获悉，理想汽车法务部发文，关于网络社群以“理想i6团购返佣”为名招募人员下单的情况，理想汽车声明：该活动与理想汽车无关，理想汽车未组织或授权任何组织、个人开展该活动。理想汽车已就相关情况向警方报案，并将积极配合调查。</p>\n  <p><strong>足力健创始人成失信被执行人</strong></p>\n  <p>天眼查显示，近日，足力健老人鞋创始人张京康、张少康、辛俊兰及睢县足力健鞋业有限公司因有履行能力而拒不履行生效法律文书确定义务被肥西县人民法院列为失信被执行人（老赖），涉案金额195.42万余元。睢县足力健鞋业有限公司成立于2017年12月，法定代表人张京康，注册资本约1亿元，经营范围包含生产销售鞋及鞋材、健身器材、足疗机、按摩器械销售等，由张京康、张少康共同持股。值得一提的是，张京康名下多家公司已成失信被执行人（老赖）并被限制高消费。（每日经济新闻）</p>\n  <p><strong>A股再现“大肉签”，中一签最高赚超7万元</strong></p>\n  <p>11月10日，科创板迎来新股钶锐锶（688827.SH）。上市首日，该股便以298.94%的涨幅高开，盘中股价一度冲高至188元，涨幅达314.37%，以45.37元的发行价计算，投资者若中一签（500股）并在盘中高点卖出，浮盈将超过7万元，成为近期A股市场受关注的“大肉签”之一。截至界面新闻发稿，该公司股价已经有所回落，报135元/股，股价上涨了197.55%。（界面新闻）</p>\n  <p><strong>剑桥科技回应“砍单”传闻：与公司实际经营情况不符</strong></p>\n  <p>剑桥科技高管在11月9日召开的第三季度业绩说明会上表示，高速光模块订单需求旺盛，公司已对多项关键物料提前下单锁定产能，为2027年的大批量交付做好准备。目前围绕关键材料、核心器件、生产设备及全球制造体系形成的供应链协同能力，正成为公司重要竞争优势。近期，市场盛传北美大客户数据中心业务出现延迟，担忧订单被砍等消息。“相关传闻与公司实际经营情况不符。公司目前高速光模块订单需求旺盛，产能利用率持续保持高位，生产与交付节奏均按计划稳步推进。”剑桥科技高管回应。（证券时报）</p>\n  <p><strong>宝马选定LG新能源、三星SDI供应下一代动力电池</strong></p>\n  <p>宝马集团9日宣布，新增LG新能源、三星SDI作为第六代高压电芯供应商，并与两家企业分别签署供货合同，计划2020年代末启动交付，供货数量与合同金额未对外披露。（新浪财经）</p>\n  <p><strong>美国通胀数据将检验国债涨势，市场预期12月加息概率超八成</strong></p>\n  <p>债券交易员正等待周二公布的一份关键通胀报告，以寻找美联储政策路径的线索，并判断近期美国国债涨势是否还有延续空间。民主党横扫中期选举后，科技股遭到抛售，投资者纷纷转向避险资产，推动各期限美国国债收益率上周降至9月以来最低水平。随着股市周一显现企稳迹象，10年期美国国债收益率小幅升至4.88%，但仍远低于上月触及的5%以上水平。周二亚洲交易时段，该收益率基本持平。经济学家预计，美国晚些时候公布的消费者价格数据将显示，通胀增速有所放缓，但仍处于高位，使美联储在12月的下次会议上继续面临加息压力。（新浪财经）</p>\n  <p><strong>百事公司北美业务陷入困境，裁员1000人</strong></p>\n  <p>百事公司将在北美裁减约1000个工作岗位，该公司正试图扭转其本土市场销售疲软的局面。“我们对百事公司北美业务有明确的雄心：打造一个更强大、更面向未来的业务，实现行业领先的增长，”百事公司北美业务CEO拉姆·克里希南在周一致员工信中写道。“为此，我们需要更快、联系更紧密、能力更强，同时继续投资于增长——投资于我们的员工、能力和品牌。”未来一周，百事计划裁员，并表示此举旨在精简运营，并更好地连接公司北美业务各团队。根据公司文件，截至12月27日，百事公司在全球拥有约30.6万名员工，其中美国约有12.5万名员工。（新浪财经）</p>\n  <p><strong>韩国KOSPI 200指数期货涨5.76%触发侧车机制，程序化买入暂停5分钟</strong></p>\n  <p>韩国交易所公告称，当天上午9时06分02秒，韩国综合股价指数（KOSPI）200指数期货涨幅超过5%并持续逾一分钟，触发买入侧“侧车”（Sidecar）机制。KOSPI市场程序化买入报价暂停5分钟。公告显示，相关期货合约当时价格为821.04点，较基准价格776.26点上涨44.78点，涨幅为5.76%。（界面新闻）</p>\n  <p><strong>马斯克称特斯拉将退还部分赛博皮卡订金，并为停产决定辩护</strong></p>\n  <p>特斯拉首席执行官埃隆・马斯克为赛博皮卡以及公司这款极具争议的钢制皮卡的停产决定进行辩解，他声称该车订单量远远超过产能。马斯克周一在X平台发文表示，特斯拉大约8个月后将停止赛博皮卡的生产。他同时称，公司会在此之前尽可能多制造该车型，但特斯拉“不得不向大量用户退还订金”。马斯克表示赛博皮卡并非亏损车型，之所以停产，是因为“赛博皮卡复杂工艺带来的机会成本，远远超过增产赛博自动驾驶出租车（Cybercab）所能创造的价值”。（新浪财经）</p>\n  <p><strong>软银：截至第二季度末对OpenAI投资总额546亿美元</strong></p>\n  <p>软银：截至第二季度末对OpenAI投资总额546亿美元。（新浪财经）&nbsp;</p>\n  <p><strong>美国汽油价格自7月以来首次跌破每加仑4美元</strong></p>\n  <p>36氪获悉，11月10日，美国汽油价格自7月以来首次跌破每加仑4美元。</p>\n  <h2>大公司财报</h2>\n  <p><strong>KKR利润走高，手续费相关收益实现增长</strong></p>\n  <p>受益于管理费上涨带来的手续费相关收益增长，这家投资机构季度利润同比走高。KKR周一公布，第三季度利润11.2亿美元，折合每股1.19美元；去年同期利润8.599亿美元，每股0.90美元。FactSet数据显示，公司调整后每股收益为1.78美元，超出分析师1.58美元的预期。受管理费与手续费类业绩收入增长推动，手续费相关收益上涨27%，达到13.2亿美元。公司总营收从去年的55.3亿美元下滑至45.6亿美元。（新浪财经）</p>\n  <p><strong>软银集团上半财年净亏损7680亿日元，去年同期盈利2.92万亿日元</strong></p>\n  <p>11月10日，软银集团公布截至2026年9月30日的2026财年上半年业绩。报告期内，公司净销售额为4.24万亿日元，同比增长13.3%；税前亏损4387亿日元，去年同期为税前盈利3.69万亿日元；归属于母公司所有者的净亏损为7680亿日元，去年同期为净利润2.92万亿日元。投资收益大幅下滑是业绩变化的重要因素。报告期内，集团投资收益为1.73万亿日元，同比下降56%。其中，控股公司投资业务录得投资收益1.08万亿日元，主要来自英特尔股票带来的1.06万亿日元收益；愿景基金投资收益则从上年同期的3.42万亿日元降至7056亿日元。（界面新闻）</p>\n  <p><strong>本田上半财年净利润为5168亿日元，同比增长65.7%</strong></p>\n  <p>11月10日，本田汽车公布截至2026年9月30日的2026财年上半年业绩。报告期内，公司销售收入为12.04万亿日元，同比增长13.2%；营业利润为6487亿日元，同比增长48.1%；税前利润为7409亿日元，同比增长40.5%；归属于母公司所有者的净利润为5168亿日元，同比增长65.7%。本田同时调整2026财年全年业绩预期，预计销售收入为24.4万亿日元，同比增长11.9%，高于此前预期；预计营业利润为7800亿日元，归属于母公司所有者的净利润为5000亿日元。公司预计全年每股收益为128.44日元。（界面新闻）</p>\n  <p><strong>台积电：10月销售额5868.9亿元台币，同比增长59.7%</strong></p>\n  <p>台积电公布10月营收报告。公司当月合并营收约为新台币5868.9亿元，环比增长14.7%，同比增长59.7%。今年1月至10月，台积电累计合并营收约为新台币4.49万亿元，同比增长43.3%。（界面新闻）</p>\n  <p><strong>Rocket Lab预计第四财季营收为2.7亿至2.9亿美元，预估为2.655亿美元</strong></p>\n  <p>Rocket Lab第三财季营收为2.68亿美元，高于预估的2.579亿美元；调整后EBITDA亏损1800万美元，亏损幅度小于预估的2030万美元。公司预计第四财季营收为2.7亿至2.9亿美元，预估为2.655亿美元。（财联社）</p>\n  <p><strong>Hims&amp;Hers Health预计全财年营收为31.3亿至31.5亿美元，低于预估的32.1亿美元</strong></p>\n  <p>Hims&amp;Hers Health第三财季每股亏损14美分，去年同期为每股收益6美分；营收为8.904亿美元，略低于预估的8.928亿美元。公司预计全财年营收为31.3亿至31.5亿美元，低于预估的32.1亿美元。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“泛函数”完成近亿元天使轮融资</strong></p>\n  <p>36氪获悉，AI原生芯片设计公司“泛函数”近日完成近亿元天使轮融资，由上海未来产业基金领投，上海信投、上海科创集团、富海重产基金、徐汇资本、宽桥恒松、无限基金联合投资。本轮融资将重点用于AI原生芯片设计垂类模型训练、全流程工具链迭代、芯片工程与AI算法核心团队扩充，以及客户联合交付与市场拓展。自2026年3月成立以来，“泛函数”已经完成多轮融资。&nbsp;</p>\n  <p><strong>“正元量子”完成天使轮融资</strong></p>\n  <p>36氪获悉，超导量子计算公司“正元量子”宣布完成天使轮融资，正元量子成立于2026年，致力于研发可扩展的超导量子计算机。本次投资方包括深创投、浦东创投、德宁资本、湘江信成、深圳天使母基金等机构，多维资本担任独家财务顾问。本轮融资将主要用于千比特超导量子计算机研发，加速三维封装、低温互连和集成测控等关键技术验证。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong></p>\n  <p>当买房不再划算，为何开始流行“租空房”？</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-11-11T00:15:52+00:00", "fetched_at": "2026-11-11T04:24:56.263231+00:00", "fingerprint": "702914184f314331"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨交大团队获中网投与清华系资本领投亿元级融资，以“原子+光子芯片”切入量子计算", "url": "https://36kr.com/p/4064699766068101?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_268839922fcd4a4580de9f6d314dcea5@6221844_oswg179900oswg2276oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3400</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，中性原子量子计算企业原基量子（Atomology）近期已完成亿元级天使轮融资。本轮融资由中国互联网投资基金（中网投）与清华系资本慕华科创联合领投，另有近10家机构参与跟投。资金将主要用于核心技术研发、工程化平台建设及核心团队扩充，加速推动中性原子量子计算系统从实验室原型向工程化、规模化和工业级产品演进。</p>\n  <p>原基量子成立于2026年4月，从诞生之初便选择了一条区别于传统科研团队的路径：基于中性原子和光子芯片的大规模可工程化量子计算。</p>\n  <p>公司目前研发人员占比超过80%，硕博学历占比超90%，核心成员多来自上海交大、中国科大、牛津大学等顶尖院校。值得一提的是，原基量子由国内光量子计算企业图灵量子孵化而来，核心团队深耕上海交大集成量子信息技术研究中心（IQIT）多年，完整继承了在冷原子、光子芯片及超表面光学等领域的技术积淀，这为团队快速推进工程化落地提供了底层支撑。</p>\n  <p>量子计算的发展本质上是一场寻找最佳量子比特载体的探索。中性原子凭借天然全同、长相干时间以及光镊阵列带来的大规模扩展潜力，被公认为是最具潜力的路线之一。</p>\n  <p>然而，行业普遍面临一个残酷的现实：技术突破不等于产业突破。当前大多数中性原子系统仍由数百个自由空间光学元件、庞大的激光器和复杂的控制系统构成，本质上仍是高度依赖人工调试的“实验室装置”。如何实现规模化制造与长期稳定运行，成为制约产业化的核心痛点。</p>\n  <p>原基量子COO方啸天对此有一个生动的比喻：“传统的实验平台就像是一个需要老手精心维护的精密仪器，一旦环境波动，可能50%以上的时间都在做恢复性工作。”</p>\n  <p>面对这一行业痼疾，原基量子的解法是“芯片化”与“模组化”双管齐下，试图将量子计算机从“手工打磨”变成“流水线制造”。</p>\n  <p>在芯片化方面，团队重点攻克了传统光镊技术难以大规模扩展的物理极限。传统方案依赖AOD、SLM等动态光器件，不仅规模上限被锁死在1万个量级，且存在严重的混频串扰和算法延时。</p>\n  <p>原基量子选择在整晶圆级超精密超表面光子芯片上做文章，通过超表面技术在单芯片上一次性生成百万量级的高密度静态光镊阵列，光路固化，无需复杂的空间光路调试。同时，团队将片上调制器（如铌酸锂电光调制器）与飞秒激光直写三维光波导结合，实现光路和调制器的全芯片化集成，彻底解决动态光镊“分辨率不够、位点串扰、大延时”的痛点。目前，其片上调控芯片带宽已突破110GHz，高密度光波导迭代周期缩短至3天。</p>\n  <p>在模组化方面，针对暂无法芯片化的外围设备，团队将其转化为高精度、高稳定性的标准化工程模组。方啸天强调，学术界追求的是“做好一次”的最高指标，而工业界要求的是“一次做好”的稳定可复制的输出。</p>\n  <p>通过主动反馈控制、恒温系统及精密封装技术，原基量子将复杂的宏观光路系统转化为可插拔、可升级的工业级产品，使其具备流水线制造、快速迭代和易于部署维护的能力。</p>\n  <p>这一“芯片+模组”的工程化路线，也得到了产业界的印证。2026年7月，包括MIT、Harvard、QuEra、Pasqal等全球31家顶尖机构和企业联合发表了一份中性原子量子计算战略的论文，其中专门用一章篇幅论述了“集成光子芯片”对于未来规模化扩展的重要性，涵盖超表面光镊、片上调控与高密度光波导等方向。这与原基量子此前的技术布局高度吻合，团队将其形容为“一种终于被印证的感觉”。</p>\n  <p>在技术演进路线上，原基量子有着清晰的“三步走”规划：大规模静态光镊阵列、可重构光镊阵列、高保真操控与存储。围绕这三个核心，团队制定了明确的研发OKR：在规模上，借助超表面芯片实现10万至100万量级的原子阵列，向百万比特级超级量子计算平台推进；在可重构性上，实现带宽大于200MHz、光镊重构时间小于50毫秒的高速实时反馈控制；在保真度上，结合低温环境与超高真空技术，将原子寿命提升至千秒量级，单比特门保真度目标大于99.99%。最终，通过芯片化与模组化，打通“寿命优势、读出功率门槛、运行中补位吞吐量”三大系统级难题，实现可外推的规模上限。</p>\n  <p>关于商业化落地，方啸天认为，中性原子路线要实现真正的商业价值，必须解决“交付”问题。未来的量子计算机不能是让博士团队现场维护数周只能用几小时的“娇贵设备”，而应该是可以快速部署、轻量化远程运维、接入云平台对外提供服务的工程产品。</p>\n  <p>而在场景选择上，原基量子目前更倾向于与量子计算中心（“量超融合”基础设施）结合，以及生物制药、金融优化等对算力有爆发式需求的领域。</p>\n  <p>“依据团队长期积累的产业经验，我们的策略是发散验证、收敛聚焦，在几个有倾向性的方向上投入，通过实际反馈来迭代工程产品，最终收敛到真正产生价值的核心场景。”方啸天表示。</p>\n  <p><strong>以下是硬氪与原基量子COO方啸天的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：当前做中性原子量子计算的公司不少，原基量子的路线与同行相比，最核心的差异化优势是什么？</strong></p>\n  <p><strong>方啸天：</strong>我们和大多数同行最大的区别在于对“产品”的定义。现在很多团队的做法是基于光学平台搭建量子计算机，这本质上是在做一个更精密的科学仪器。从第一性原理出发，这是两种不同目标所导致的底层逻辑区别。学术界追求的是在特定条件下跑出最高指标，但工业界要求的是在最差的环境下也能稳定可复制的输出。</p>\n  <p>原基量子的底层逻辑是把原子和光子芯片结合。传统的光镊阵列受限于AOD、SLM等空间光调制器的物理极限，规模上限通常在1万个量级，且存在混频和串扰。我们利用超表面光子芯片，可以在单芯片上一次性生成百万量级的静态光镊，而且结合高密度光波导芯片和片上调控的光子芯片，在保证性能的同时还能实现集成和稳定的运转。同时，对于无法芯片化的外围设备，我们做了高度标准化的模组。这套“芯片化+模组化”的体系，让我们的系统具备了流水线制造、快速迭代和易于部署维护的工业级属性。</p>\n  <p><strong>硬氪：量子计算目前普遍被认为离大规模商业落地还有距离，原基量子在商业化节奏和场景选择上是怎么考虑的？</strong></p>\n  <p><strong>方啸天：</strong>我们给自己的要求是，未来2到3年全部聚焦在工程产品的研发上，先把绝对算力和工程稳定性做出来，做出一个真正能交付的“整机”。现在去谈短期的营收并没有太大意义，但我们并不担心近期的市场化，因为团队在交大和产业界已经有大量的技术沉淀，这为我们后续的商业化打下了底子。</p>\n  <p>在应用场景上，我们看重两条线：一是与量子计算中心（如“量超融合”中心）结合，这类国家级或区域级基础设施对系统规模和稳定性有极高要求，非常适合我们的超大规模阵列；二是生物制药、金融优化等对算力有爆发式需求的行业。我们近期的策略是“发散验证、收敛聚焦”，在几个有倾向性的方向上投入，通过实际反馈来迭代我们的工程产品，最终收敛到真正产生价值的核心场景。</p>\n  <p><strong>硬氪：中性原子量子计算未来几年的技术演进方向是什么？原基量子接下来的关键里程碑是什么？</strong></p>\n  <p><strong>方啸天：</strong>中性原子必然朝着“大规模、可重构、高保真”三个方向演进。这也是我们的核心路线图。在规模上，我们通过超表面芯片先实现10万到100万量级的静态阵列；在可重构上，我们利用片上调制器和三维光波导，实现光束的高速、高精度独立控制；在保真度上，结合低温环境、连续装载和超高速低噪声成像技术，不断提升原子寿命和门操作精度。</p>\n  <p>近期我们的工程目标非常明确：第一阶段（M1）实现10万级阵列的稳定连续补位和高保真成像闭环；第二阶段（M2）向百万级阵列推进，并完成分区处理器（存储、交互、读出、回收）的架构验证。量子计算是一场长跑，我们现阶段的任务就是把“工程化”这条最难但最正确的路走扎实，让中国在下一代计算基础设施的竞争中拥有自主可控的核心硬件能力。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>中网投表示：</strong>“量子计算是我国抢占未来科技制高点、实现高水平科技自立自强的关键领域。当前，全球中性原子路线不断取得突破。原基量子同时具备中性原子、光子芯片、超表面以及产业化工程经验，围绕规模化和工程化构建核心能力，这也是我国量子计算产业发展所需要的方向。我们期待公司坚持自主创新，稳步推进技术验证与产业化探索，为我国量子计算创新发展贡献力量。”</p>\n  <p><strong>慕华科创投资团队表示：</strong>\"量子计算正处于从科研突破迈向产业突破的关键阶段，中性原子路线兼具规模扩展能力与高保真潜力，是未来通用量子计算的重要方向。未来量子计算的竞争不仅是物理体系的竞争，更是工程能力、产业协同能力和生态构建能力的竞争。原基量子兼具深厚技术积累和明确工程化路线，不仅有中性原子方向的长期沉淀，更在光子芯片、超表面、系统工程领域形成了独特优势，这种从底层器件到系统平台的完整能力体系，在未来产业化竞争中具备极高价值。\"</p>", "category": "tech", "published_at": "2026-11-11T02:00:00+00:00", "fetched_at": "2026-11-11T04:24:56.263227+00:00", "fingerprint": "4975418a7c4b8485"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨国产半导体模块厂商获近亿元 B 轮融资，营收大幅增长，海外占比近半", "url": "https://36kr.com/p/4064722121823367?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约3800字，建议阅读9分钟</p>\n  </blockquote>\n  <p>硬氪获悉，国产碳化硅（SiC）功率模块厂商利普思半导体（以下简称“利普思”）近日完成近亿元B轮融资，新投资方为上海新微资本。本轮资金将主要用于加大AIDC相关产品研发和全球市场推广。</p>\n  <p>利普思（Leapers）成立于2019年11月，总部位于江苏无锡，是一家专注于第三代半导体碳化硅功率模块研发、制造及销售的企业，致力于为高压、大电流等应用场景提供高功率密度、高可靠性的功率模块及相关解决方案。</p>\n  <p>随着AI数据中心向800V HVDC架构升级，新能源汽车的800V高压平台普及，以及光储充对能量转换效率的要求不断提高，碳化硅在高压、高频、高温等用电场景中的应用价值日益凸显。相较于传统硅基器件，碳化硅具有更高的开关频率、更高的击穿电场强度、更低的开关损耗、更高的转换效率，正成为能源基础设施升级和算力建设的重要基础材料之一。</p>\n  <p>据Yole Group数据，2024年全球碳化硅功率器件市场规模约为34亿美元，预计到2030年将接近100亿美元，年复合增长率约为20.3%。国内方面，2024年中国第三代半导体功率电子市场规模约176亿元，涵盖以碳化硅为主的SiC、GaN器件；预计到2029年将超过460亿元。</p>\n  <p>利普思董事长兼CEO丁烜明介绍称，基于行业需求的增长，2026下半年以来，公司经营业绩同比去年增长幅度超过50%，新合作客户超30家，尤其在固态变压器和固态断路器的产品方面达成战略合作超10家。</p>\n  <p>丁烜明表示，技术优势上，利普思已经建立起一整套自主SiC模块正向设计体系，是国内首家采用自主高导热环氧灌封方案的SiC功率模块厂商，并在降低模块杂感和损耗、提高模块的耐高温、耐高压特性、提高循环功率寿命拥有多项自主知识产权。</p>\n  <p>目前，利普思的产品已广泛应用于电动重卡、工程机械、船舶、低空飞行器等高压电驱系统，以及超充、风电光储、固态变压器（SST）、固态断路器（SSCB）、变频器和轨交电源等场景。</p>\n  <p><strong>既有应用之外，AIDC正成为利普思重点布局的新市场。</strong>利普思已有多款1200V至3300V的SiC功率模组面向AIDC相关应用开展客户送样，部分项目进入可靠性验证阶段，相关产品有望于2027年迎来较为明显的放量。</p>\n  <p>除AIDC市场外，利普思也在推进下一代功率模块的封装技术创新。在今年6月德国PCIM展会上，公司发布了PCB嵌入式SiC模块新方案，将芯片直接嵌入PCB板内，旨在优化电气连接、降低系统杂散电感，并提升系统集成度。围绕这一方向，公司也在探索相关技术在电源领域的应用。</p>\n  <p>全球化布局是利普思的另一项业务基础。丁烜明告诉硬氪，公司已建立覆盖中国、日韩和欧洲、北美的研发及市场网络，在无锡、上海、深圳和日本设有研发中心，并在欧洲设立海外销售中心。公司核心技术团队成员来自蔚来、三菱、东芝、英飞凌、安森美等企业，具备功率半导体研发、产品应用及国际市场拓展经验。目前，公司海外营收已占比接近一半。</p>\n  <p>产能布局方面，目前利普思正在加速建设其扬州车规级功率半导体模块工厂。该工厂预计2027年4月完成通线投产。达产后预计年产能150万只SiC模块。届时，利普思无锡工厂和扬州工厂将达到年产220万只SiC的产能规模，为正在到来的第三代功率半导体需求爆发做准备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261111/v2_25a9233df65f4eb98c75536ca11cde36@5920579_oswg822982oswg1080oswg540_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>以下是硬氪与丁烜明交流节选：</strong></p>\n  <p><strong>硬氪：AIDC场景对碳化硅功率模块的需求有哪些不同？目前相关产品进展到了什么阶段？</strong></p>\n  <p><strong>丁烜明：</strong>AIDC供电链路分为五级：10kV/35kV中压交流经固态变压器SST直转 800V 直流，省去工频变压器、低压UPS、PDU；800V直流母线通过SSCB等固态保护器件向机架配电，母线可直接接入储能、BBU以替代传统UPS；机架内高变比 LLC 降压至54V/48V或12V中间总线；最后经板级多相VRM输出0.6~1.0V给GPU/CPU核心，5V/3.3V供给I/O及外围。</p>\n  <p>我们聚焦的是中压交流到800V直流这一段，核心设备是SST变换环节，配合800V侧的SSCB保护环节。中压侧的高频、高温工况下，碳化硅的优势最为明显。</p>\n  <p>目前，我们已经开发了1200V、1700V、2300V、3300V等多个电压等级的产品，并向国内外多家头部客户送样，部分项目进入可靠性验证阶段。AIDC设备单机功率通常达到数兆瓦，对应的功率模块需求量也比较大。我们正在对接国内外电力设备厂商，并优先推进有机会进入英伟达供应链的项目。</p>\n  <p>但从送样到规模化采购还需要时间。我们预计，相关业务有望在2027年第四季度左右迎来较为明显的放量。</p>\n  <p><strong>硬氪：公司目前在下一代智能SiC&nbsp;PCB功率模块方面有哪些布局？这类产品的技术优势和挑战分别是什么？</strong></p>\n  <p><strong>丁烜明：</strong>PCB嵌入式功率模块的思路，是取消键合线与独立模块外壳，把封装功能并入PCB叠层，也就是芯片直接埋入板内，用微孔电镀铜建立三维互连。它主要有三方面提升：功率回路电感从传统键合模块的10~20nH降到1~2nH，模块体积能缩小一半以上；另外去掉了键合线，也就解决了功率循环里最主要的失效问题，寿命可以达到传统模块的好几倍；而且这种对称叠层结构，本身就适合双面散热。</p>\n  <p>挑战不在电气，而在热与力。SiC的热膨胀系数约4ppm/K，铜是17，FR4更高，温度循环下界面剪切应力集中在微孔底部和芯片边缘，会带来脱粘、空洞和分层——这是量产真正的关键障碍。其次是800V以上的绝缘与局部放电，埋入结构内部空间紧凑，树脂和微孔侧壁是场强集中点。散热本身反而可以通过铜柱直通、内嵌氮化硅陶瓷来解决。还有一点容易被忽略：电感压到2nH以下之后，短路电流上升率更高，保护窗口被压缩到1微秒以内，驱动和保护必须一起重新设计。</p>\n  <p>落地节奏上，我们先锚定AIDC电源。它的800V与车载800V平台电压等级一致，工艺可以复用，但认证周期短、迭代快、连续满载的工况也更接近真实负载，适合先把工艺和良率跑通，再复制到车载和电源。</p>\n  <p><strong>投资人观点</strong></p>\n  <p><strong>新微资本：</strong>随着AI算力基础设施扩容、新型电力系统建设提速，SiC模块的价值日益凸显。利普思凭借自主正向设计和先进封装技术，产品在高压、大电流工况下优势突出，已在电网、重卡、储能、工业等场景建立了扎实的量产记录和客户口碑，并成功打入海外头部供应链。新微资本在功率半导体领域已围绕材料、器件、封装制造和下游应用进行全链条布局，SiC模块正是其中的重要一环。我们看好利普思在AIDC场景的成长空间，将持续为其赋能。</p>", "category": "tech", "published_at": "2026-11-11T02:10:08+00:00", "fetched_at": "2026-11-11T04:24:56.263224+00:00", "fingerprint": "6d1b48ff89abca35"}, {"source": "36氪 - 最新文章", "title": "关注A股市场动态？加入36氪官方交流群，获取每日资讯与企业舆情", "url": "https://36kr.com/p/4064733248083080?f=rss", "summary": "<p><strong>看市场，不只看股价，也要关注企业正在发生什么。</strong></p>\n  <p>每天A股开盘前，市场上总有大量信息值得关注。</p>\n  <p>上市公司发布了什么新公告？哪些企业有了新的业务进展？近期行业出现了哪些变化？热门概念背后，又有哪些值得关注的企业动态？</p>\n  <p>信息越来越多，如何从中快速找到有价值的内容，成为不少市场关注者日常面临的问题。</p>\n  <p>为了让大家更方便地获取市场资讯、了解企业动态，36氪企业全情报持续运营官方股票舆情交流群，围绕A股市场资讯、上市公司舆情和行业热点，为群成员提供日常信息分享与交流。</p>\n  <p>目前，36氪官方交流群持续开放加入，欢迎关注A股市场的朋友参与。</p>\n  <p>&nbsp;</p>\n  <h2><strong>一、每天有哪些值得关注的信息？</strong></h2>\n  <p>加入3 用了什么技术、开发了哪些功能、拥有多少项专利、产品性能达到什么水平……这些内容都很重要，但对于第一次接触项目的人来说，可能还有一个更直接的问题：</p>\n  <p><strong>这个项目，到底解决了什么问题？</strong></p>\n  <p>一款产品功能再丰富，如果没有讲清楚它服务谁、解决什么需求，外界就很难真正理解它的价值。</p>\n  <p>&nbsp;</p>\n  <h2><strong>用户的真实需求，才是项目故事的起点</strong></h2>\n  <p>很多有意思的创业项目，其实都来自一个具体的问题。</p>\n  <p>比如，传统行业的某个环节效率太低，有团队尝试用AI重新设计工作流程；某类消费者长期面临产品选择困难，有创业者从细分需求出发开发新产品；制造业存在一些难以解决的生产问题，技术团队则希望通过新的设备和工艺找到突破口。</p>\n  <p>这些项目最值得介绍的，往往不只是采用了什么技术，而是为什么要做这件事，以及它能给用户带来什么改变。</p>\n  <p>对于创业团队来说，介绍项目时不妨换一种思路：</p>\n  <p>你发现了什么尚未被满足的需求？</p>\n  <p>你的产品具体解决了什么问题？</p>\n  <p>相比现有方案，有哪些不同？</p>\n  <p>目前产品已经走到了哪一步？</p>\n  <p>把这些问题讲清楚，项目的特点和价值自然更容易呈现出来。</p>\n  <p>&nbsp;</p>\n  <h2><strong>好的项目，需要一个讲清楚自己的机会</strong></h2>\n  <p>创业团队每天都在推进产品和业务，但并不是所有有价值的创新，都能自然进入公众视野。</p>\n  <p>尤其是早期项目，可能已经有了不错的技术和产品，却缺少专业的内容传播渠道；也可能在某个细分领域取得了实际进展，但还没有机会向更广泛的行业受众介绍自己。</p>\n  <p>36氪「项目推荐」希望为这些创业项目提供一个展示机会。</p>\n  <p>平台面向硬科技、AI、机器人、消费、企业服务、医疗健康、先进制造等领域开放项目征集。创业团队可以提交项目资料，介绍自己的产品、技术、应用场景和业务进展。</p>\n  <p>审核通过并符合发布要求的项目，有机会获得36氪免费的报道与曝光，让更多人了解项目正在做的事情。</p>\n  <p>我们关注的不只是项目用了什么新技术，也希望看到技术背后的实际需求，以及团队正在创造的价值。</p>\n  <p>&nbsp;</p>\n  <h2><strong>从解决一个问题开始，让更多人认识你的项目</strong></h2>\n  <p>一个创业项目不一定一开始就有完整的商业版图，也不一定已经取得很大的市场成绩。</p>\n  <p>但只要它在认真解决某个问题，就有值得讲述的内容。</p>\n  <p>如果你正在开发一款新产品，探索一个新的技术方向，或者已经在某个细分领域取得实际进展，不妨把项目介绍出来。</p>\n  <p>通过36氪「项目推荐」提交项目资料，让产品、技术和真实的业务故事有机会被更多人了解。</p>\n  <p><strong>好的项目，不只是做出来的，也值得被讲清楚。</strong></p>\n  <p>让好项目，更早被看见。</p>\n  <p><br />📌&nbsp;<strong>免费提交项目：</strong><br /><a href=\"https://36kr.com/seek-report-new\" rel=\"noopener noreferrer\" target=\"_blank\">https://36kr.com/seek-report-new</a></p>\n  <p>📮&nbsp;<strong>项目推荐联系邮箱：</strong><br /><a href=\"mailto:aireport@36kr.com\">aireport@36kr.com</a></p>\n  <p><strong>客服可以扫描下方二维码联系～</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_61e9fced05214f5881a6e6e2ad218743@5284654_oswg50025oswg216oswg210_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加！</p>", "category":
