ether to track vehicles and people&#8217;s movements throughout the day and across [&#8230;]", "category": "tech", "published_at": "2026-08-13T21:46:21+00:00", "fetched_at": "2026-08-14T01:27:59.188826+00:00", "fingerprint": "92f86168f091a213"}, {"source": "The Verge", "title": "‘That is not acceptable’: Judge orders Google to make rival app store installs easier", "url": "https://www.theverge.com/policy/979852/that-is-not-acceptable-judge-orders-google-to-make-rival-app-store-installs-easier", "summary": "One month after Epic Games and Google seemingly stopped fighting over the future of Android app distribution, they were back in a San Francisco courtroom today - where Judge James Donato just ordered Google to make it easier to install rival app stores on Android. It's been nearly three years since a jury unanimously decided [&#8230;]", "category": "tech", "published_at": "2026-08-13T21:53:04+00:00", "fetched_at": "2026-08-14T01:27:59.188821+00:00", "fingerprint": "23291f036d85abb2"}, {"source": "The Verge", "title": "Apple and Epic argue over how much Apple should get from purchases made outside the App Store", "url": "https://www.theverge.com/tech/979967/apple-epic-games-external-links-fees-filing", "summary": "In a new filing in its long-running legal dispute with Epic Games, Apple has proposed a structure that would allow it to collect fees on digital purchases made via external links that don't use the company's in-app purchase system. Epic has already responded, saying that Apple's request is \"far outside of the bounds\" of the [&#8230;]", "category": "tech", "published_at": "2026-08-13T23:13:24+00:00", "fetched_at": "2026-08-14T01:27:59.188814+00:00", "fingerprint": "c1cc3586d9103ea9"}, {"source": "The Verge", "title": "Trump declares 100 percent tariffs on many drones and all aircraft parts", "url": "https://www.theverge.com/policy/979977/trump-declares-100-percent-tariffs-on-many-drones-and-all-aircraft-parts", "summary": "The United States has already banned future foreign drones from entering the United States unless their companies kiss the ring - as well as routers, robots, and Roombas. Now, President Donald Trump is targeting existing drone imports and parts, too. He's going to try to make them cost a lot more. In a presidential action, [&#8230;]", "category": "tech", "published_at": "2026-08-14T01:06:15+00:00", "fetched_at": "2026-08-14T01:27:59.188804+00:00", "fingerprint": "4e68b342015e131c"}, {"source": "36氪 - 最新文章", "title": "AI究竟能帮游戏做什么？我们和阿里云、TapTap制造聊了聊 | ChinaJoy2026现场局", "url": "https://36kr.com/p/3937335101996164?f=rss", "summary": "<p><strong>内容整理 | 刘士武</strong></p>\n  <p>2026 ChinaJoy的主题是“与AI同游”。去年大家还在讨论AI能不能做游戏，今年问题已经变成了如何做，以及做出来之后怎么让更多人玩到。</p>\n  <p>这场对谈是36氪游戏“ChinaJoy现场局·谁在构建AI+数字娱乐下一个十年”系列中的一场，<strong>阿里云高级解决方案架构师陈海生</strong>和<strong>TapTap制造产品负责人赵天一</strong>坐到同一张桌子前。一边是造引擎的，一边是提供云基础设施的，双方正好处于AI时代游戏创作链路的上下游，同时也都是为创作者、玩家带来更好体验基础的厂商。</p>\n  <p>对谈中，三项关键判断被反复讨论：从星火编辑器到TapTap制造是AI时代到来的必然结果；随着AI时代的到来，很多UGC创作者的核心矛盾从“做不出”变成了“谁来玩”，这时候无论是做引擎还是做云底座，都是解决问题的关键环节；现在这个时代做AI游戏工具，最重要的反而是“不被大模型吞噬”。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <h3><strong>以下为对谈实录精选：</strong></h3>\n  <p><strong>36氪游戏：</strong>从星火编辑器到TapTap制造，“可视化编辑器”到“纯AI对话”，这个转变里您个人或团队最大的挑战是什么？</p>\n  <p><strong>赵天一：</strong>我们做星火编辑器的时候，核心是解决“很多人做不出游戏，是因为他掌握不了编程”这个问题。所以我们做了中文可视化编程，让不会写代码的人也能做出游戏。</p>\n  <p>但AI时代来了以后，人们不需要自己写代码了，星火编辑器原有的路线，相当于被AI给吞噬掉了。</p>\n  <p>这个被AI吞噬，是今天我会反复提到的一个现实。AI的进步会持续吞噬很多东西。</p>\n  <p>我们做TapTap制造时遇到的最大挑战，其实也是类似的：AI发展得太快，我们必须找到那些不会被AI吞噬掉的东西去做，才能让小团队的投入有价值。如果做的东西一个月就被AI取代了，那就是浪费生产力。这半年下来，这是最大的挑战。</p>\n  <p>────────────</p>\n  <p><strong>36氪游戏：</strong>去年ChinaJoy大家还在讨论“AI能不能做游戏”，今年主题已经是“与AI同游”。海生老师您是阿里云服务游戏行业多年的资深专家，日常工作中这个体感强吗？有什么项目印象特别深刻？</p>\n  <p><strong>陈海生：</strong>体感非常强烈。</p>\n  <p>去年客户来阿里云，还会问“AI到底能不能写游戏代码”；今年客户已经不怎么问能不能了，他们更关心的是怎么用、怎么用好。</p>\n  <p>我觉得这个变化来自两条技术线的成熟：</p>\n  <p>第一条是MaaS（模型即服务）。阿里云的Qwen3.8-Max模型，已经被直接用到游戏逻辑生成和代码编写这些核心创作环节里。模型能力不再是实验室里的demo，而是可以被嵌到C端产品生产链路的稳定服务。</p>\n  <p>第二条是Agentic Cloud。过去AI大多是聊天辅助，现在Agent可以真正动手写代码、调工具、跑沙箱，最后生成一个可玩的游戏。阿里云提供的Agent Run、Agent Studio Box这些产品，就是让Agent从“会说”变成“会干”的基础设施。</p>\n  <p>让我印象最深的项目，其实是TapTap制造这类UGC创作平台。它能让没有编程经验的用户通过自然语言创作自己想做的游戏。这个链路能跑通，本质上就是MaaS提供了模型能力，Agentic Cloud提供了执行和治理能力。</p>\n  <p>────────────</p>\n  <p><strong>36氪游戏：</strong>过去一两年，从产品视角看，创作者的痛点和需求发生了什么变化？同问阿里云，作为云服务商观察到的是不是同样趋势？</p>\n  <p><strong>赵天一：</strong>我们一直在做UGC游戏引擎，过去围绕的核心需求是用户\"做不出游戏\"。但到了今年，这个问题其实已经消除了——用户在TapTap制造上，一句话就可以做出一个demo，再用几天对话就能做成一个体量完整的游戏。</p>\n  <p>今年上半年，我们上线了大概4000多款这样的游戏。然后就遇到了一个新的问题：我做出来的游戏，谁来玩？</p>\n  <p>中国的市场环境是比较独特的。除了TapTap这样的零分成平台，其他平台的流量都已经被充分定价过了，不太可能给到一个新人做的、没那么完善的游戏。</p>\n  <p>所以这些人做完游戏之后，遇到的最大的问题就是没人玩、没人能看到。我觉得这个问题会长期困扰整个行业的发展。</p>\n  <p><strong>陈海生：</strong>我们观察到的趋势，跟天一老师高度一致。</p>\n  <p>从云厂商视角看，这个演进大概分了三个阶段：</p>\n  <p>第一阶段（两年前）：大家焦虑的是做不出来。模型能写代码、能生图，但缺少运营环境、工具调用、质量评估，创作链路跑不通。本质上是“有MaaS，但没配套的Agentic Cloud”。</p>\n  <p>第二阶段（去年）：Agent能真正执行了。阿里云的Agent Run、Agent Sandbox这些产品，让Agent可以写代码、调工具、跑沙箱，创作闭环基本形成。</p>\n  <p>第三阶段（现在）：问题变成了分发、合规、质量分级。UGC内容爆发之后，平台不能只看能不能做出游戏，更要看做出来的东西能不能上线、有没有违规、质量怎么分级。这就需要Agentic Cloud的可观测治理能力——Agent入口做质量评估，Agent Identity做行为审计。</p>\n  <p>我们的判断是：游戏客户的需求会从买资源，变成买MaaS+Agentic Cloud的全栈能力。</p>\n  <p>────────────</p>\n  <p>36氪游戏：让没编程经验的人用自然语言生成游戏，这个“降低门槛”的过程最难的是什么？同问阿里云，这种产品对底层云服务提出了什么新要求，跟传统游戏厂商需求有什么不一样？</p>\n  <p><strong>赵天一：</strong>最难的可能不是降低门槛本身，而是在维持这个目标的同时，清晰地感知到我们还有另一群用户——还有一个更抽象的对手。</p>\n  <p>TapTap制造主打“人人都能做游戏，想到就能做到”。这是我们一部分用户，他们可能没有基础的游戏制作能力，AI的上限就是他的上限。对这批用户，我们要做的是提高AI在我们工具中运行的上限，让开发者做出来游戏的下限高一点。比如我们给心动专业团队做了一套UI主题库，他们可以一句话换上；还有序列帧工具，可以生成专业序列帧。</p>\n  <p>但我们还有另一批重要用户——他们本身会做游戏。对他们的核心命题是：不能让TapTap制造变成一种约束，反而把他们的生产力拉下来了。</p>\n  <p>怎么解决？我们最近做了一些事：开放大家本地使用自己的Agent；接下来一段时间引擎要开源，让大家可以随便发到任何地方。这些都是给专业开发者解除约束。</p>\n  <p>还有一个更抽象的事——大模型本身是个“幽灵”。它一直在背后持续进步，每一次进步都会吞噬掉一些东西。</p>\n  <p>去年我们觉得系统提示词、Skills（技能模板）、Harness（框架编排）很重要，今年随着模型进步，我们又删掉了好多自己的Skills，因为发现很多东西不用提示，AI自己就能写好了。我们以前还有一些模板去解释\"怎么做一个复杂游戏\"，现在也不用了，因为AI自己就懂。</p>\n  <p>所以我们做每一个需求的时候，都要问自己：这个需求未来会被大模型快速吞噬掉，还是会变成杠杆，放大大模型的进步？</p>\n  <p>作为一个产品经理，每天都在想这些问题。我们是小团队，要把资源投在真正有价值的点。</p>\n  <p><strong>陈海生：</strong>赵老师这个问题点出了AI原生游戏创作平台对传统云架构的根本性改变。</p>\n  <p>传统游戏厂商来阿里云，核心诉求是稳定的运营资源——服务器、数据库、网络安全，支撑游戏跑起来。</p>\n  <p>但TapTap制造这类平台来阿里云，买的是MaaS+Agentic Cloud的全栈能力。具体落在三个方面：</p>\n  <p>第一，怎么引导不懂游戏制作流程的人创作？ 产品层面通过MCP（模型上下文协议）、Skills、Harness引导用户；云底层，阿里云的Agent Run和Agent Teams提供了Scale（弹性扩缩容）和MCP的生态。打个比方，把\"RPG游戏怎么做、MOBA游戏怎么做、平台跳跃游戏怎么做\"的经验封装成可复用的Skills，Agent按Skills执行结构化的工作流。复杂任务还可以通过Agent Teams拆成Worker节点协作完成。</p>\n  <p>第二，怎么保障专业开发者的上限？ 阿里云在网关上增加了降级、限流以及内容安全能力，让它合规。Qwen3.8-Max直接给产品能力提效——在我们实际操作中，一次就能完成游戏的制作。在Agent Cloud层，Agent Run支持无代码、低代码、高代码三种模式，专业开发者可以选择Python、Java或任意框架，不被平台限制。</p>\n  <p>第三，怎么保障多端、移动开发环境的稳定性？ 传统开发环境装在本机，配置复杂、版本冲突。阿里云提供的FC Agent Sandbox和ACS Agent Sandbox，把开发环境挪到了云端隔离沙箱里，支持50多种语言，能跑浏览器自动化，弹秒级弹性。创作者不用关心环境配置，也不用担心AI生成代码在多租户之间互相影响。</p>\n  <p>总结一句话：传统游戏厂商买的是稳定运行游戏的云资源；TapTap制造这类平台买的是\"让Agent替用户做游戏\"、并且可治理的完整基础设施能力。</p>\n  <p>────────────</p>\n  <p><strong>36氪游戏：</strong>0门槛创作时代，作品大量涌入几乎是必然的。TapTap制造在机制上怎么平衡“创作自由”和“内容质量”？从平台技术角度，阿里云能帮平台在内容质量把控上提供什么支持？</p>\n  <p><strong>赵天一：</strong>这件事我们上半年花了蛮长时间去思考，最后花了极短时间落地。</p>\n  <p>之所以想这么久，是因为它动摇了TapTap以前的整个流量分配体系。TapTap去年上半年游戏数量是502款，今年是5000多款——这5000多款里有4699款是TapTap制造做的AI游戏。</p>\n  <p>不管从游戏产量还是用户可触达的游戏数量，都暴增了。我们的审核最高一天进入260款新游，审核同学整个流程都有点崩。</p>\n  <p>后来我们落地了一个体系：不再像以前一样给所有游戏一个冷启动的基础曝光，再回收数据。我们用更少的流量去判断一个游戏的游玩体验——根据它的时长、留存回收数据，再决定要不要曝光给更多用户。</p>\n  <p>这样解决的是：我们只需要很少的曝光就能判断它是不是可能没那么优质的游戏，用户玩到低质游戏的危害就被降低了。我们用很少的曝光容纳现在上线的新游戏后，从里面选出优质的游戏，曝光倾向给到那些做优质游戏的人。对整个生态和对开发者都是有利的。</p>\n  <p><strong>36氪游戏：</strong>从平台技术角度，阿里云能帮平台在内容质量把控上提供什么支持？</p>\n  <p><strong>陈海生：</strong>我们的思路不是先用AI降低门槛，再用人来堵这个洞，而是让AI自己成为质量把关的环节。</p>\n  <p>技术层面分两块：</p>\n  <p>第一块是MaaS的多模态能力。阿里云Qwen3.8-Max的多模态能力可以去看游戏的录屏、截图、音频，判断游戏能不能正常玩、有没有明显的bug、画面风格是什么、游戏类型是什么，甚至可以识别低俗、暴力、侵权这些违规内容，把这些信息直接输入给TapTap制造做辅助内容分级。</p>\n  <p>第二块是Agentic Cloud里的AgentLoop评估体系。核心理念是Agent as a Judge——评估器本身也是一个Agent。可以用预置的评估测评集，也可以自定义评估维度。</p>\n  <p>比如用户说\"我要一个马里奥like的游戏\"，Agent评估器就会检查生成的游戏里是不是有跳跃、有没有敌人、有没有关卡终点。它还能做幻觉检测、正确率检测、任务完成度检测。</p>\n  <p>合规和安全上，Agent Identity可以做行为审计。为每个Agent独立分配身份，访问内容库时需要做凭证安全注入，所有行为都可以做审计。Agent发现越权、数据外发等异常行为时，平台能分钟级预警。</p>\n  <p>总结下来：不拦创作者的自由，但给平台提供一套“事前辅助分级、事中实时评估、事后可追溯”的技术能力。</p>\n  <p>────────────</p>\n  <p><strong>36氪游戏：</strong>AI游戏创作工具越来越多，TapTap制造最核心、最难被替代的竞争力是什么？</p>\n  <p><strong>赵天一：</strong>短期甚至中长期看，大家会看到更多AI工具涌现。现在的时代，搭建一个Agent成本非常低——所有模型都能接入，token成本越来越低，Harness等基建市面上也有大量范例，搭一个基础的东西并不难。</p>\n  <p>但这些基础的东西反而很容易被大模型的进步吞噬掉。可能我做了努力让它在当前模型上表现更好，但下个月模型就把我的努力吞噬了。</p>\n  <p>我们想要做的，是那些不会被大模型吞噬掉的东西。</p>\n  <p>一个是提升引擎的上限——让大模型的进步能够发挥出更多生产力，而不是大模型进步了，把我们引擎的能力给吞掉。</p>\n  <p>另一个是TapTap生态——解决游戏做出来之后的分发问题，让开发者放心做游戏，而不是做完游戏无人问津、心血被时光尘封、也没收到任何反馈。这个链路要做好，商业化也要做好。现在我们的商业化做得还比较基础，但已经有月收入几十万的游戏了，单日收入也有1.5万的——对个人开发者来说，这已经算不错的收入。</p>\n  <p><strong>36氪游戏：</strong>阿里云给TapTap带来的最独特价值是什么？Agentic Cloud“让Agent成为云的一等公民”的理念，在TapTap这个样本上怎么体现？</p>\n  <p><strong>陈海生：</strong>独特价值不是单一产品，而是MaaS+Agentic Cloud的整体能力。具体分四层：</p>\n  <p>第一层：MaaS模型层。TapTap制造灰度接入阿里Qwen3.8-Max做游戏逻辑生成和代码编写。Agent Run和AI网关提供统一调度：降级、限流、token内容安全审核。</p>\n  <p>第二层：Agent Cloud的Agent Run。阿里云的FC Agent Sandbox和ACS Agent Sandbox提供云端隔离环境，是AI生成代码真正跑起来最核心的基础设施。这是TapTap制造\"自然语言→可玩游戏\"闭环的关键基建。</p>\n  <p>第三层：可观测和成本治理。AgentLoop可以做到端到端的Trace，从用户输入、知识库调用、组装Prompt、模型推理、工具调用、沙箱执行，到最后的游戏产物，全链路都可以追踪。还能做到token级别的成本归因，知道每个创作者每个任务花了多少token。</p>\n  <p>第四层：任务质量评估和测评体系。AgentLoop的Agent as a Judge机制，可以提供预置和自定义评估器，判断Agent生成的游戏是不是满足用户意图，给游戏产品做自动化的质量分级。可以作为Prompt、Skill、模型变更的质量门禁。</p>\n  <p>Agentic Cloud在TapTap制造上的体现就是：Agent不再是只调用API的客户端，而是云原生运行调度、可观测、可治理、进化的核心对象。“让Agent成为云的一等公民”这个理念，在游戏行业是先落地了。</p>\n  <p>────────────</p>\n  <p><strong>36氪游戏：</strong>如果真的人人都能做游戏了，两位觉得游戏世界会变成什么样？给那些想拥抱AI但还在观望的游戏开发者一句话建议，两位会说什么？</p>\n  <p><strong>赵天一：</strong>游戏世界会更加分化。一部分人做游戏是为了商业化，做商业化的游戏；一部分人做游戏是为了表达，纯粹走向表达和内容型游戏，因为他的成本足够低、速度足够快。</p>\n  <p>我甚至觉得游戏开发这个事情，或者说游戏内容供给，会跟以前很不一样——以前的周期很长，现在周期很短。周期短了，它就拥有更多想象力：不管是我的开发过程，还是我跟用户连接互动、根据用户建议调整的速度，都快了很多。这里可能会有新的内容机会、新的内容形式出来。</p>\n  <p>给还在观望的开发者的建议：其实很可惜。因为AI对他们而言是一种补位。他可能以前是美术、不会写代码，拥抱AI后，美术部分可能确实被AI替代了一部分，但他本身的审美还在——拿审美去驾驭AI，爆发出来的生产力远高于那些没有审美基础的人。专业的开发者不拥抱AI，其实是对自己才能的浪费。</p>\n  <p><strong>陈海生：</strong>我的建议也很简单：尽快动手做起来，先让AI替你做出第一个最小的闭环，不要等模型完美了再动手。</p>\n  <p>今天已经有MaaS给你现成的模型能力，Agentic Cloud给你现成的运行、观测、评估基础设施。TapTap制造上已经有大量非专业的开发者做出了可玩的游戏——专业的游戏开发者，应该关注的不应该是“会不会被替代”，而是“谁先掌握MaaS+Agent的游戏开发新范式”。</p>\n  <p>至于未来游戏世界的样子，我从个人角度说：我自己比较关注的是碎片化时间和压力比较大的场景——比如我想做一个解压的休闲型游戏，背后的这些大模型和资源成本怎么来扛？这个问题解决了，才能真正到人人做游戏。</p>", "category": "tech", "published_at": "2026-08-13T02:41:23+00:00", "fetched_at": "2026-08-14T01:27:59.097447+00:00", "fingerprint": "7fc9cb498d8e24b4"}, {"source": "36氪 - 最新文章", "title": "最前线｜XTransfer邓国标：中小外贸企业正从新兴产业配套环节寻找机会", "url": "https://36kr.com/p/3937399009459335?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>8月12日，XTransfer举办2026未来外贸大会。来自外贸企业、银行及金融机构的相关人士参会，讨论今年外贸市场的变化及企业出海面临的新机会。</p>\n  <p>过去几年，地缘冲突、海运波动等因素持续影响全球贸易。XTransfer在会上披露的一项客户调研显示，今年其平台上的中小外贸企业出口仍保持一定韧性，企业回款情况有所改善，部分企业在海外市场的议价能力也在增强。</p>\n  <p>XTransfer创始人兼CEO邓国标认为，相比大型企业，中小外贸企业在市场变化中具有更强的灵活性，可以根据订单和需求变化快速调整市场布局。</p>\n  <p>变化也体现在出口产品结构上。</p>\n  <p>根据海关总署相关数据，以人工智能、机器人、创新药等为代表的新兴产业正在成为中国外贸新的增长来源。</p>\n  <p>邓国标观察到，中小企业并不一定直接参与机器人整机、大模型等核心环节，而是更多从产业链配套切入，例如机器人机架、AI服务器散热件以及医疗耗材包装等领域。</p>\n  <p>这是近年来中国外贸结构变化的一个侧面。过去，中小出口企业更多集中在服装、家具、消费电子等传统品类；随着中国制造业向机器人、AI硬件等新产业延伸，一部分供应链企业也开始伴随下游客户寻找海外订单。</p>\n  <p>中小企业跨境交易的需求也在发生变化。随着企业进入更多非欧美市场，本地收款、人民币结汇以及不同国家和地区的合规审核，成为跨境支付企业需要解决的问题。</p>\n  <p>XTransfer成立于2017年，目前主要面向中小外贸企业提供B2B跨境收付款及相关风控服务。按照公司披露的数据，其累计服务企业客户超过100万家，本地收款账户目前覆盖亚洲、非洲、拉美、中东、欧美及澳新等近60个国家和地区。海外买家可以使用当地货币付款，国内出口企业则可通过平台完成结汇。</p>\n  <p>AI也开始进入跨境支付的风控环节。</p>\n  <p>XTransfer目前将AI模型TradePilot用于客户准入、交易真实性验证和反洗钱等流程。公司披露，目前已有72个AI智能体嵌入相关审核流程。相比生成内容，这类AI的主要作用是处理大量交易和企业信息，辅助判断交易风险及合规性。</p>\n  <p>对跨境支付公司而言，中小企业出海范围扩大，也意味着业务覆盖需要进一步向更多国家和地区延伸；而对于中小外贸企业来说，在全球需求仍存在不确定性的情况下，新的增长机会正在从单纯寻找新市场，进一步转向进入新的产业链和产品品类。</p>", "category": "tech", "published_at": "2026-08-13T03:29:52+00:00", "fetched_at": "2026-08-14T01:27:59.097436+00:00", "fingerprint": "8fb37015e366bdf3"}, {"source": "36氪 - 最新文章", "title": "腾讯能不能为存储续命？", "url": "https://36kr.com/p/3937749806464389?f=rss", "summary": "<p>文 | 黄绎达</p>\n  <p>编辑 | 张帆</p>\n  <p>8月12日，腾讯公布了2026年二季度财报。</p>\n  <p>财报显示，腾讯在2026Q2实现收入2047.85亿元，同比增11%；同期实现经营利润672.76亿元，同比增长12%；同期Non-IFRS经营利润录得756.36亿元，同比增长9%。若剔除新AI产品（Hy、元宝、CodeBuddy、WorkBuddy、小微等）的贡献，再调整后的同期Non-IFRS经营利润为861亿元，同比增长19%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_c0ef5465a3fb4b2f88b79d92ba9f3429@5426566_oswg201148oswg1058oswg801_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：腾讯2026Q2财报摘要；资料来源：公司公告，36氪</p>\n  <p>腾讯核心业务的商业模式与稳健增长的业绩无需赘述，投资者关注的重点依然是在AI业务与相关的资本开支上。AI业务方面，Hy3以高性价比打出一定声量的同时，WorkBuddy实现了突破性的用户增长。</p>\n  <p>资本开支方面，对AI的投入力度明显加大。财报显示，本季研发支出为272.8亿元，同比增长35%；资本开支录得527.8亿元，同比增长176%，环比增长65%，进一步兑现了管理层今年下半年资本开支增幅将更加明显的承诺，而且计入资本开支之后，腾讯本季度的自由现金流罕见转负。</p>\n  <p>在腾讯公布业绩后的次日（8月13日），开盘股价直线下跌，日内最大跌幅约4.7%，最终当日收跌4.46%。腾讯财报后的股价表现，主要反映了投资者对腾讯AI投入大幅增加、短期利润和现金流承压，以及AI商业化回报尚未充分兑现”的担忧。</p>\n  <p>那么，基于今年二季度的财报表现以及电话会披露的信息，腾讯加大资本开支背后的核心逻辑都有哪些？对存储行业又会产生什么样的影响？</p>\n  <h2><strong>01 加码资本开支：抢算力、更是抢存储</strong></h2>\n  <p>腾讯加大资本开支的逻辑其实非常直接：现有的游戏、广告等核心业务，商业模式已经相当成熟，虽然规模可观、业绩增长稳健，但未来很难再有高爆发力；<strong>腾讯选择在这个时候大幅增加资本开支，从长期的公司战略来看是以核心业务作为 “现金奶牛”，将赚到的现金流去布局AI，为公司寻找下一个既能带动公司整体业绩增长，同时又能赋能并强化现有业务的新发动机</strong>。</p>\n  <p>从财务数据来看，近5年来，游戏业务收入同比增速长期处于个位数，仅有5个季度高于10%。以腾讯游戏业务当前的体量，本季度8%的同比增速不能说不好，只是不能满足投资者对大型消费科技型企业的长期想象。</p>\n  <p>广告业务虽然长期保持了强劲增长，但其背后的核心动能除了广告主的投放增长外，主要依靠广告加载率的持续小幅提升，考虑到用户的使用体验，未来在广告加载率逐渐触及天花板的情况下，广告收入受制于空间上限，很难始终保持高增长。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_bc4609ebc1c8401681916e99252068c7@5426566_oswg225441oswg1021oswg1084_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：腾讯游戏与广告业务的收入与同比增速；资料来源：wind，36氪</p>\n  <p>再看腾讯资本开支的主要投向：其一，基础设施建设，<strong>管理层在电话会上特别提到了公司在本季度大幅提升了算力采购规模</strong>；其二，支撑自研混元模型升级所需的PAPI与coPAPI推理算力需求；其三，旗下产品与服务中AI能力的持续开发。</p>\n  <p>腾讯算力采购的主要硬件，除算力芯片外，还包括大量的高规格存储与内存设备。<strong>因为算力竞争在物理层面，不仅仅是堆GPU，存储作为信息管道，是决定大模型能否高效运行的核心设备。</strong></p>\n  <p>对于腾讯而言，目前Hy3的参数规模相对较小，腾讯总裁刘炽平在电话会上表示，未来Hy4的参数规模将更大，同时还提出要在性能上击败更大尺寸的模型。而更大的参数规模叠加更强劲的性能表现，同时在用户体验上还要实现快速响应与运行不卡顿，就必须匹配更强的算力，由此对存储也提出了更高的要求。</p>\n  <p>而存储又是典型的强周期型行业，扩产能通常需要1~3年时间不等，供给端具有明显的滞后性。这也意味着，在本轮由AI资本开支大幅扩张驱动下的存储牛市中，需求激增导致三星电子、SK海力士、美光等存储巨头的产能几乎处于满负荷运行的状态，短中期在产能的约束下，存储当前的稀缺性相当突出。</p>\n  <p>供给极度紧张，导致存储价格高企且上涨趋势还在延续，<strong>腾讯选择顶着账面自由现金流转负的压力，明显加大开支去抢算力、囤积存储，本质上是在跟时间赛跑，用真金白银来锁定稀缺资源，确保自家的大模型和云业务不被硬件卡脖子，并且为AI相关的业务备足弹药。</strong></p>\n  <h2 label=\"一级标题\"><strong>02 腾讯下场强化存储基本面逻辑</strong></h2>\n  <p>再看腾讯本季度资本开支的规模，虽然不像硅谷巨头们那般“Capex无上限”，但同比与环比都有大幅增长；特别是在电话会上，关于大模型、CodeBuddy、WorkBuddy、小微等业务的表述，都有大量关于回报的内容，这可以说是出于腾讯一贯务实的基因。</p>\n  <p>而且，基于腾讯自身AI业务的需求与存储的供需格局，腾讯也不会因为短期的利润压力而撤回对AI基建的投入。从短期来看，腾讯核心业务的造血能力十分强劲，短期烧钱对公司基本面的影响有限；长期来看，基于腾讯的基因，所有对硬件的投入，最终都会回到具体的生态场景中去验证。</p>\n  <p>对于存储企业而言，7月至今，三星电子、SK海力士、美光等存储巨头的股价都经历了不同程度的大幅调整，然而从基本面来看，AI资本开支扩张驱动存储企业业绩增长的逻辑并未改变，腾讯的下场反而进一步强化了这一逻辑。而且，腾讯高度重视ROI，在当前存储供给偏紧、价格高企的情况下，依然大幅增加开支，说明存储对于AI基建而言是刚性需求。</p>\n  <p>与此同时，存储产能扩张存在明显滞后，需求的持续增长，进一步拉大了供需缺口，行业高景气亦因此而得以延续。近期存储龙头的股价调整，更多反映投资者获利了结、板块轮动、美联储政策预期利空等因素，而非基本面发生逆转。某种程度上，腾讯的加入反而为这一轮存储行情“续了命”。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-08-13T09:30:13+00:00", "fetched_at": "2026-08-14T01:27:59.097425+00:00", "fingerprint": "70e35fdcb7d642f0"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜美国消费者就关税退税起诉丰田和索尼等日本公司；SpaceX AI：推出Grok 4.6；苹果聘请美国航空前高管出任政府事务负责人", "url": "https://36kr.com/p/3937699820715141?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3937633224129670\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>L&amp;T获超10亿美元英伟达B300 AI工厂订单</strong></a></p>\n  <p>8月13日，印度工程与建筑企业拉森特博洛（L&amp;T）宣布，其旗下Vyoma.AI通过AI基础设施子公司LTN Compute，获得为美国AI云服务商Together AI建设印度最大单集群AI基础设施的订单。项目将部署1万块英伟达B300 GPU，落地于金奈数据中心园区，用于大规模推理、微调和训练。L&amp;T称，这是公司首次进入AI工厂业务。该项目订单金额超过10亿美元，金奈园区一期规划容量250兆瓦，并具备进一步扩展能力。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937615506341255\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星、SK海力士积极引入AI，人员绩效考核与AI部署直接挂钩</strong></a></p>\n  <p>据报道，SK海力士已开始在其位于清州的半导体后端生产线上分阶段部署AI系统。具体涉及的设备尚未披露。该公司目前正在评估设备的生产性能，以及AI系统在生产环境中的有效性和可靠性。评估工作预计将于年底完成。一位业内人士表示，SK海力士负责设备验证人员的关键绩效指标（KPI）已与AI软件的成功验证和部署直接挂钩。三星电子也在积极将AI引入半导体制造业务中，以提高生产效率。据业内人士透露，该公司要求设备供应商将AI Agent作为新订购设备标配。一位消息人士称，三星此前出于安全性和可靠性方面的考虑，对AI采取了较为保守的态度，但最近已转变策略，积极部署AI用于流程控制和更广泛的制造运营。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937535040716167\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK Shipping与H-Line交换资产，打造亚洲最大LNG船队</strong></a></p>\n  <p>8月13日，韩国私募股权巨头Hahn&amp;Co.宣布，其控制的两家韩国航运公司SK Shipping与H-Line Shipping已达成资产与长期合同交换协议。根据协议，SK Shipping将接收来自H-Line的16艘液化天然气（LNG）运输船及相关长期合同；作为对价，SK Shipping将向H-Line转让12艘油轮、相关长期合同以及约3亿美元现金。交易完成后，SK Shipping的LNG船队规模将扩大至32艘，并拥有14艘液化石油气（LPG）船，一举成为亚洲最大、全球第三大LNG运输船运营商。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937333331737984\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美国消费者就关税退税起诉丰田和索尼等日本公司</strong></a></p>\n  <p>据报道，美国消费者正就特朗普政府的关税退税起诉丰田汽车和索尼集团等日本公司。任天堂及优衣库母公司迅销等也面临诉讼；消费者要求退还为应对关税而支付的较高商品价格，这些关税最终遭美国法院推翻。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937293775306115\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>苹果聘请美国航空前高管出任政府事务负责人</strong></a></p>\n  <p>8月13日，据报道，苹果已聘请美国航空集团前政府事务负责人内特·加滕（Nate Gatten）担任公司政府事务副总裁，8月31日正式履新。现任政府事务负责人尼克·阿曼（Nick Ammann）等将转向向加滕汇报。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3937592865717639\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>联想CEO：计划今年晚些时候推出搭载英伟达RTX芯片的AI PC</strong></a></p>\n  <p>联想CEO表示，与英伟达合作，计划在今年晚些时候推出搭载RTX芯片的AI PC；内存短缺不会推迟AI PC的出货，将根据供应情况灵活调整消费电子产品价格。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936698078723460\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX AI：推出Grok 4.6</strong></a></p>\n  <p>SpaceX AI表示，推出GROK 4.6，GROK 4.6的定价设定为每百万TOKEN输入2美元，每百万TOKEN输出6美元。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937128174992770\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>DeepSeek API文档新增“DeepSeek-V4-Pro-0813”模型</strong></a></p>\n  <p>36氪获悉，DeepSeek官方API文档显示，deepseek-v4-pro模型版本已更新为DeepSeek-V4-Pro-0813，调用方法不变，使用deepseek-v4-pro即可调用最新版本。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3937269110373509\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>张雪机车获红杉中国独家新一轮投资，今年营收有望增长2倍以上</strong></a></p>\n  <p>张雪机车近日获得红杉中国独家投资，具体交易条款未予披露。据悉，张雪机车去年营收6.7亿元，今年有望达到20–25亿元，有望实现2倍以上增长；产能方面单月交付量已破万台。本轮融资完成后双方未来将围绕企业治理、人才建设、产业资源和全球化发展展开深度合作。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3937189660327297\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX做空者弹药耗尽，股价自低点反弹逾30%</strong></a></p>\n  <p>押注SpaceX下跌的做空者正迅速撤离该交易，而此时这家新上市公司的股价正从IPO后的低迷中反弹。根据S3 Partners的数据，周三SpaceX的做空比例降至该公司公开交易股票的大约11%，较上周34%的峰值大幅下降。这一下降反映出看空投资者平仓离场，以及在首次主要锁定期到期后，该股可交易流通股的大幅增加。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3937131144576387\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>固态电池步入产业化攻坚期，关键温等静压设备或在明年取得突破</strong></a></p>\n  <p>当前，固态电池尚未大规模量产，“固—固界面接触问题”等长期核心难题仍待解决。从业内采访获悉，温等静压工艺是突破“固—固界面接触问题”的关键方法之一。利元亨、先导智能等设备商已实现温等静压设备出货，科新机电、华自科技、荣旗科技等亦有布局，设备商与电池企业正协同突破这一技术瓶颈。利元亨研究院院长杜义贤展望，2026年到2027年，智能等静压控制技术有望取得根本性突破。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3937655780310153\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>平陆运河首次进行实船单线双向过闸试验</strong></a></p>\n  <p>今天（8月13日），平陆运河实船试验进入第二天。在平陆运河企石枢纽，首次进行了实船单线双向过闸试验，重点检测船舶在船闸内外靠泊和过闸的安全性，这也是平陆运河实船试验过程中最关键的一环。</p>", "category": "tech", "published_at": "2026-08-13T11:47:08+00:00", "fetched_at": "2026-08-14T01:27:59.097412+00:00", "fingerprint": "c75f741fb9af05e1"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨超越腾讯，长鑫科技成中国市值最高上市公司；8734股宇树科技股票遭散户弃购；全国首个“开进银行”的婚姻登记点来了", "url": "https://36kr.com/p/3938602872683907?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>卢伟冰官宣小米澎湃OS4，折叠屏手机意外现身</p>\n  <p>三家外卖平台将率先在京落地“红灯停表”</p>\n  <p>Alo入华首日开门红，线上1分钟破千万</p>\n  <p>三星、SK海力士积极引入AI，人员绩效考核与AI部署直接挂钩</p>\n  <p>iPhone全系或将涨价100美元</p>\n  <p>张雪机车获红杉中国独家新一轮投资，今年营收有望增长2倍以上</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>长鑫科技成中国市值最高上市公司&nbsp;</strong></p>\n  <p>中国存储芯片巨头长鑫科技登陆科创板仅两周多，便首次在收盘市值上超越腾讯，跃居中国AH股市值最高上市公司。8月13日，周四，长鑫科技盘中一度涨超4%，随后回吐涨幅，收盘跌1.2%，总市值约3.54万亿元。同期，腾讯公布二季度业绩后股价跌4.5%，市值降至约3.44万亿元。上市以来，长鑫科技股价累计涨幅已超过500%，成为资金押注中国AI产业链和半导体产业的重要标的。（第一财经）</p>\n  <p><strong>宇树科技，8734股遭弃购</strong></p>\n  <p>宇树科技今日公告，网上投资者缴款认购的股份数量9,698,266股，网上投资者放弃认购数量8,734股；网下投资者缴款认购的股份数量22,650,148股，网下投资者放弃认购数量0股。网上、网下投资者放弃认购股数全部由保荐人（主承销商）包销，保荐人（主承销商）包销股份的数量为8,734股，包销金额为1,317,087.20元，包销股份数量占扣除最终战略配售部分后本次发行数量的比例约为0.03%，包销股份数量占本次发行总规模的比例约为0.02%。（财联社）</p>\n  <p><strong>全国首个“开进银行”的婚姻登记点来了</strong></p>\n  <p>银行不只能办金融业务，还能办理结婚登记了。据天津河西民政官方公众号消息，近日，河西区东海婚姻登记处正式揭牌启用。该登记处坐落在邮储银行天津泗水道支行爱情主题银行内。这也让该行成为了全国首家落户银行网点的婚姻登记点位。据介绍，该登记点位仅受理内地居民结婚登记业务，同步提供免费颁证仪式、移风易俗宣传等。邮储银行泗水道支行工作人员此前在接受每日经济新闻采访时表示，在银行网点预约登记，办理速度会比在民政局稍快，并且可以获得印有新人照片卡面的专属定制银行卡。此外，在办理完结婚登记后，银行也可直接提供新婚家庭金融规划等金融服务。（界面新闻）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>DeepSeek Harness开发者预览版开放测试</strong></p>\n  <p>8月13日，DeepSeek Harness的开发者预览版（v0.1版本）面向全球Harness开发者开放测试，并同步以MIT协议开放源代码。DeepSeek Harness采取“一切皆插件”的设计思路，模型、工具、技能、会话、沙箱、存储、循环、调度、UI等所有Agent能力均由插件组合而成，可自由替换、灵活重组。（界面新闻）</p>\n  <p><strong>DeepSeek调价方案公布，空闲时段价格为高峰的一半，8月17日生效</strong></p>\n  <p>8月13日，深度求索官方宣布将对DeepSeek API价格进行更新调整，采用峰谷定价，空闲时段价格为高峰时段价格的一半。高峰时段为北京时间9:00-12:00、14:00-18:00(其余为空闲时段)。新价格将于北京时间2026年8月17日00:00开始生效。（中新经纬）</p>\n  <p><strong>投资方预计Anthropic将于10月挂牌上市，估值有望达2万亿美元</strong></p>\n  <p>Anthropic近日传出10月将以超高估值上市的消息。尽管面临监管审查、竞争加剧等多重压力，但其惊人的营收增速仍受到投资界的高度追捧。有媒体近日援引多位Anthropic投资方消息称，Anthropic预计将于10月IPO，估值或将达到2万亿美元及以上。若该预测准确，这一惊人估值将超越SpaceX，成为史上规模最大的首次公开募股。（财联社）</p>\n  <p><strong>谷歌DeepMind发布手语转文本模型，手语AI首次落地消费电子</strong></p>\n  <p>当地时间8月12日，谷歌旗下DeepMind对外发布全新多语言手语转文本模型SL2T，这项手语人工智能技术正式搭载至Pixel 11手机系统，实现手语AI第一次落地普通消费电子产品，补齐听障群体智能终端交互短板。（界面新闻）</p>\n  <p><strong>苹果据悉拟向出版商支付最高数亿美元，获取新闻内容以改进AI版Siri</strong></p>\n  <p>8月12日，据报道，苹果正与多家出版商洽谈多年期内容授权协议，以让AI版Siri获取最新新闻和信息。苹果讨论的授权费用预算可能达到数亿美元，并考虑根据合作出版商的内容实际使用情况支付费用。（界面新闻）</p>\n  <h2><strong>大公司/大新闻</strong></h2>\n  <p><strong>三家外卖平台将率先在京落地“红灯停表”</strong></p>\n  <p>36氪获悉，据北京市场监管消息，平台经济“破卷向善”第二次协商对话于2026年8月13日召开，围绕外卖骑手算法优化，组织美团、淘宝闪购、京东外卖三家平台与骑手共商共治，同时邀请专家学者、人大代表建言献策，多方协商优化举措，进一步保护外卖骑手合法权益，守护城市交通平台经济“破卷向善”第二次协商对话于2026年8月13日召开，围绕外卖骑手算法优化，组织美团、淘宝闪购、京东外卖三家平台与骑手共商共治安全秩序。</p>\n  <p><strong>比格比萨创始人赵志强回应“开黄腔”&nbsp;</strong></p>\n  <p>8月12日晚，比格比萨创始人赵志强因抖音评论区一句“一看你照片破戒了”引发争议。面对网友关于其言论是否合适、是否“开黄腔”的质疑，赵志强8月13日回应界面新闻称，相关回复是对网友玩笑的回应，并称评论已经删除。他解释称“破戒”指的是美食照片的吸引力，并非其他含义。对于近期网络争议，他表示只有个别少数人的评论和私信存在侮辱、谩骂和攻击。（界面新闻）</p>\n  <p><strong>中际旭创：拟17.47亿元受让中石科技10.47%股份</strong></p>\n  <p>36氪获悉，中际旭创公告，公司与中石科技控股股东吴晓宁、叶露和HAN WU于2026年8月13日签署股份转让协议，公司拟以现金方式协议受让其持有的标的公司31372504股，占中石科技总股本的10.47%，本次股份转让价格为55.70元/股，股份转让价款合计为人民币1747448473元。本次交易前，公司未持有中石科技股份；本次交易后，公司合计持有中石科技31372504股股份，占中石科技股份总数10.47%。</p>\n  <p><strong>高达100%，美国将对进口无人机及零部件征收关税</strong></p>\n  <p>当地时间8月13日，美国白宫发表声明称，美国总统特朗普当日签署公告，以应对国家安全威胁为由对进口无人机及零部件征收10%至100%的从价关税。（央视新闻）</p>\n  <p><strong>李大霄建议年轻人不要全职炒股&nbsp;</strong></p>\n  <p>近期，近日，前英大证券首席经济学家李大霄在一场以“AI资产重估、科技主线转向，股市的光照向何方？”为主题的直播中，李大霄送给年轻人三句话：第一句话，做好人、买好股、得好报。第二句话，余钱投资、理性投资、价值投资、量力而为。第三句话，不要加杠杆、不要加杠杆、不要加杠杆，赶紧回去上班，不要全职炒股、不要退学炒股。（第一财经）</p>\n  <p><strong>三星、SK海力士积极引入AI，人员绩效考核与AI部署直接挂钩</strong></p>\n  <p>据报道，SK海力士已开始在其位于清州的半导体后端生产线上分阶段部署AI系统。具体涉及的设备尚未披露。该公司目前正在评估设备的生产性能，以及AI系统在生产环境中的有效性和可靠性。评估工作预计将于年底完成。一位业内人士表示，SK海力士负责设备验证人员的关键绩效指标（KPI）已与AI软件的成功验证和部署直接挂钩。三星电子也在积极将AI引入半导体制造业务中，以提高生产效率。据业内人士透露，该公司要求设备供应商将AI Agent作为新订购设备标配。一位消息人士称，三星此前出于安全性和可靠性方面的考虑，对AI采取了较为保守的态度，但最近已转变策略，积极部署AI用于流程控制和更广泛的制造运营。（财联社）</p>\n  <p><strong>iPhone全系或将涨价100美元&nbsp;</strong></p>\n  <p>8月13日消息，苹果计划将现有全部iPhone机型以及下月即将发布的新机价格统一上调100美元。同一消息源还暗示，苹果iPhone 18 Pro、苹果iPhone 18 Pro Max和苹果iPhone Ultra的发布会将于9月8日举行。（第一财经）</p>\n  <p><strong>150年最强厄尔尼诺来袭，全球食品价格飙至近3年最高&nbsp;</strong></p>\n  <p>今年6至7月，厄尔尼诺现象持续增强，业内判断这或是150年来最强的一次。全球食品价格已升至近三年最高点，联合国粮农组织数据显示，7月谷物价格指数环比上涨3.4%，同比上涨6.9%。在大宗商品市场，投资者正对软商品普遍施加“厄尔尼诺风险溢价”。近一个半月，咖啡期货涨价近40%，录得惊人涨幅，蔗糖与棕榈油紧随其后。（21世纪经济报道）</p>\n  <p><strong>五粮液向经销商发禁令：第八代五粮液不得低于800元抛售，低价出货将被处罚</strong></p>\n  <p>8月13日，继收紧渠道补贴后，五粮液再度加码市场管控。从经销商等多方独家获悉，五粮液近期向经销商通知，不得以低于800元/瓶的价格低价抛售第八代五粮液。同时，酒厂也将加强对低价出货和窜货经销商的处罚，进一步稳固区域秩序。截至发稿前，五粮液暂无回应。7月底，五粮液收紧了对渠道经销商的多项补贴投入，经销商的第八代五粮液整体成本对比收紧前成本提高了约50元/瓶。批发价格方面，彼时，第八代五粮液单箱批价大约浮动在4485元-4500元，单瓶批价约748元-750元/瓶。或基于新政影响，截止目前，第八代五粮液单箱批价已升至约4600元-4650元，单瓶批价约767元-775元/瓶。（酒业内参）</p>\n  <p><strong>卢伟冰官宣小米澎湃OS4，折叠屏手机意外现身&nbsp;</strong></p>\n  <p>8月13日，卢伟冰发文：“小米澎湃OS4 Beta版要与大家见面了。这次我们决定不开发布会而是通过更多的用户反馈，持续优化体验。”8月13日上午11点，首批Beta版机型招募在小米社区开启。官方同步发文，详细介绍了新系统在美学设计、性能、AI等方面的升级。传闻已久的小米首款阔折叠手机意外现身。在官方展示图中，包括直板手机、平板电脑，一款采用阔折叠形态的新设备。小米表示，无论在什么比例的设备上使用，应用布局都针对手持场景做了优化。该机将出厂搭载小米澎湃OS 4，并针对阔折叠形态进行专门的桌面和应用布局适配。（新浪科技）</p>\n  <p><strong>美股三大指数集体收涨，奈飞涨超5%</strong></p>\n  <p>36氪获悉，8月123日收盘，美股三大指数集体上涨，道指涨0.13%，纳指涨0.81%，标普500指数涨0.65%。大型科技股多数上涨，奈飞涨超5%，特斯拉、英特尔涨超3%，Meta涨超2%，苹果涨1%，微软、谷歌、英伟达小幅上涨；SpaceX跌超3%，亚马逊小幅下跌。热门中概股跌多涨少，京东跌超7%，拼多多跌超5%，阿里巴巴跌超2%，微博、网易跌超1%；腾讯音乐、爱奇艺涨超2%。</p>\n  <p><strong>韩国央行时隔13年重投黄金，二季度买入约2.5亿美元黄金ETF</strong></p>\n  <p>当地时间8月12日，韩国央行披露，韩国央行今年第二季度买入679765股SPDR黄金ETF，截至6月底持仓市值约2.504亿美元。这是韩国央行13年来首次进行与黄金相关的投资。（界面新闻）</p>\n  <p><strong>特朗普媒体科技集团称超十家华尔街客户已订阅“付费抢先看帖”服务</strong></p>\n  <p>越来越多的华尔街客户正在注册特朗普媒体科技集团推出的一项付费服务，该服务可让用户抢先浏览“真相社交”（Truth Social）平台的最新帖子，部分经济学家认为这项功能属于内幕交易的一种形式。特朗普媒体科技集团由美国现任总统特朗普于2021年创立。该集团透露，已有十余家客户签约使用“真相社交”应用程序编程接口（Truth API）。这项服务于本月早些时候正式上线，能够让华尔街交易商抢先获取平台头部用户（包括特朗普本人）发布的动态，相比普通大众看到帖文的时间提前数毫秒。该服务每月向客户收取6万至10万美元的使用费。（新浪财经）</p>\n  <p><strong>人民币首超港元，登顶香港外汇交易最大货币对</strong></p>\n  <p>香港财资市场公会（TMA）最新公布的香港外汇市场半年度调查结果显示，2026年4月，香港外汇交易日��成交额为9082亿美元，其中美元兑人民币交易量首次超越美元兑港元，跃居香港市场交投最活跃的货币对。具体来看，4月美元兑人民币日均成交2740亿美元，占香港全部外汇交易的30.2%，超过美元兑港元的2402亿美元（占比26.4%）。其中，美元兑离岸人民币交易额达2592亿美元，成为主力。（财联社）</p>\n  <p><strong>Alo入华首日开门红，线上1分钟破千万&nbsp;</strong></p>\n  <p>8月12日零点，Alo在两大平台统一正式开售，开启在中国内地的市场发展。开业当天，ALO空降代言人赵露思，借助本土明星连接中国消费者，帮助品牌完成第一轮曝光和转化。据媒体报道，Alo在天猫上线仅1分钟，成交破1000万元；上线9小时，店铺涨粉超8万；爆品SUIT UP阔腿裤销量超4000条、SUNSET平底德训鞋部分鞋码缺货。在Alo正式官宣入华前，国内电商平台早已存在大量以“Alo”名义销售的商品，海外官网售价约千元的瑜伽裤，在部分店铺售价不足500元，开设天猫旗舰店后Alo的价格也被重新拉回官方体系。其海外官网已经无法在中国内地直接下单。Alo客服表示，后续中国消费者可通过中国官方渠道购买。（时代财经、第一财经）</p>\n  <p><strong>“张雪机车”，获欧盟认证</strong></p>\n  <p>近日，国际独立第三方检测、检验和认证机构德国莱茵TÜV大中华区（下称“TÜV莱茵”）发布消息称，“张雪机车”的500RR摩托车获得由卢森堡交通部颁发的欧盟WVTA证书。此次是张雪机车获得的首份欧盟WVTA证书，标志该车型满足欧盟市场准入要求，可合规进入欧盟成员国及其他认可WVTA认证的国家和地区。（央视新闻）</p>\n  <p><strong>比尔盖茨将会见HD现代集团会长，讨论加强小型模块化反应堆领域合作</strong></p>\n  <p>据消息人士透露，HD现代集团会长郑基善计划于周五在首尔会见美国核能企业泰拉能源创始人兼董事长比尔・盖茨，双方将讨论深化小型模块化反应堆（SMR）领域合作的相关方案。这是他们七个月来首次会面，此前两人曾在瑞士达沃斯世界经济论坛期间有过一次会晤。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>泽璟制药递表港交所</strong></p>\n  <p>36氪获悉，港交所文件显示，8月12日，苏州泽璟生物制药股份有限公司向港交所提交上市申请书，独家保荐人为中金公司。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>张雪机车获红杉中国独家新一轮投资，今年营收有望增长2倍以上</strong></p>\n  <p>张雪机车近日获得红杉中国独家投资，具体交易条款未予披露。据悉，张雪机车去年营收6.7亿元，今年有望达到20–25亿元，有望实现2倍以上增长；产能方面单月交付量已破万台。本轮融资完成后双方未来将围绕企业治理、人才建设、产业资源和全球化发展展开深度合作。（财联社）</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>联想集团：2026/27财年第一财季营收269.4亿美元，同比增长43%</strong></p>\n  <p>36氪获悉，联想集团发布2026/27财年第一财季业绩。业绩显示，第一财季营收269.4亿美元创单季度历史新高，同比增长43%；经调整净利润达10.75亿美元，同比增长176%。其中，人工智能相关收入同比增长60%，占本集团总收入的35%；智能设备业务集团的收入同比增长27%至171亿美元；基础设施方案业务集团收入创85亿美元的单季度新高，同比增长达98%。</p>\n  <p><strong>京东：二季度Non-GAAP净利润89亿元，同比增长20.3%</strong></p>\n  <p>36氪获悉，京东集团披露2026年二季度及中期业绩。二季度，京东集团收入3464亿元；服务收入793亿元，占收入比例提升至22.9%，其中，来自居家场景下的服务收入同比增长69.6%。2026年第二季度非美国公认会计准则下归属普通股东的净利润为89亿元，同比增长20.3%。2026年上半年，京东集团收入6621亿元，其中服务收入同比增长12.9%；京东体系研发投入同比增长53%。</p>\n  <p><strong>中国移动：上半年股东应占利润789亿元，同比下降6.3%</strong></p>\n  <p>36氪获悉，中国移动在港交所公告，2026年上半年，公司营运收入达到5380亿元，同比下降1.1%，同口径实现正增长。其中，主营业务收入达到4527亿元，同比下降3.1%；其他业务收入为854亿元，同比增长11.2%。算力服务、智能服务收入占主营业务收入比达到22.6%，同比提升2.2个百分点。股东应占利润为789亿元，同比下降6.3%，同口径实现正增长，每股盈利为3.64元。公司决定2026年中期派息每股2.51元。</p>\n  <p><strong>华虹宏力：第二季度销售收入7.175亿美元，同比增长26.8%</strong></p>\n  <p>36氪获悉，华虹宏力发布财报，第二季度销售收入创历史新高，达7.175亿美元，同比增长26.8%，环比增长8.6%。毛利率16.5%，同比上升5.6个百分点，环比上升3.5个百分点。母公司拥有人应占利润3860万美元，同比上升385.9%，环比上升84.6%。</p>\n  <p><strong>中芯国际：第二季度公司销售收入30.056亿美元</strong></p>\n  <p>36氪获悉，中芯国际公告，第二季度公司销售收入30.056亿美元，上年同期22.091亿美元。毛利率为25.3%，环比增加5.2个百分点。第三季度，公司收入预计环比增长2%到4%，毛利率指引为26%-28%。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-13T23:56:27+00:00", "fetched_at": "2026-08-14T01:27:59.097392+00:00", "fingerprint": "d8706ae6aebae14b"}, {"source": "少数派", "title": "6 天时间丈量独库公路：我的平安骑行指南", "url": "https://sspai.com/post/112873", "summary": "如果你也想骑一次独库，希望这份来自普通骑行爱好者的实战记录，能让你出发前少踩一点坑。<a href=\"https://sspai.com/post/112873\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-13T03:18:09+00:00", "fetched_at": "2026-08-14T01:27:57.642300+00:00", "fingerprint": "27c16480ecd6903c"}, {"source": "少数派", "title": "TDS REVIEW | 铁三角 ATH-SQ1TW2NC 降噪真无线耳机体验", "url": "https://sspai.com/post/113338", "summary": "SQ1TW2NC 的声音素质、编码配置和降噪综合能力，应该都算是在国内同价位甚至更低价位主流新产品面前不太拿得出手的水平，没有特别明显的功能层面的长板，但你会发现即使如此，它依然有一些点值得国内品牌学习。<a href=\"https://sspai.com/post/113338\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-13T07:01:08+00:00", "fetched_at": "2026-08-14T01:27:57.642293+00:00", "fingerprint": "bf5b9187292c261d"}, {"source": "少数派", "title": "从原理出发，高效搞定夏日营养冷食", "url": "https://sspai.com/prime/story/summer-cold-meal-guide", "summary": "不知道多少人和我一样，夏天吃饭的纠结项往往从「今晚到底吃什么」，变成了「太热了到底要不要吃呢」。天气太闷太热、厨房又没有空调，在想到开火的那一刻又心生畏惧，最后还是点外卖或者随便吃点东西凑合了事。但也 ...<a href=\"https://sspai.com/prime/story/summer-cold-meal-guide\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-08-13T08:01:56+00:00", "fetched_at": "2026-08-14T01:27:57.642286+00:00", "fingerprint": "c48f39c24118edf4"}, {"source": "少数派", "title": "不用改签名，给 Mac 微信聊天记录「搬个家」", "url": "https://sspai.com/post/113225", "summary": "对长期把 Mac 放在固定位置、外置硬盘常年连接的用户来说，它可以让体积庞大的聊天记录不再挤占有限的内置存储。<a href=\"https://sspai.com/post/113225\" target=\"_blank\">查看全文</a>", "category": "tech", "pu hones", "url": "https://www.theverge.com/tech/979241/made-by-google-2026-live-blog-pixel-11-trevor-noah", "summary": "It's almost time for the Made by Google keynote, where the company will show off the brand-new Pixel hardware it announced today. Like last year, it'll be a celebrity-packed live show, though Trevor Noah is hosting instead of Jimmy Fallon. If the 2025 show was any indication, today's broadcast might be something of a cringefest. [&#8230;]", "category": "tech", "published_at": "2026-08-12T21:30:00+00:00", "fetched_at": "2026-08-13T01:29:11.342410+00:00", "fingerprint": "5d2a2655194fb1ba"}, {"source": "36氪 - 最新文章", "title": "Seedance 2.5测评｜ 七维实测，AI视频从片段到叙事，到底进步了多少？", "url": "https://36kr.com/p/3936379078409606?f=rss", "summary": "<p>上半场比的是什么？比谁的数据集更干净、谁的视频动作更连贯、谁的分辨率更高。可落到真实创作场景就会发现，AI视频真正的瓶颈，远不止这些参数的比拼。</p>\n  <p>&nbsp;</p>\n  <p><strong>7月31日，Seedance 2.5正式发布上线。</strong></p>\n  <p>为此<strong>36氪AI测评团队</strong>及<strong>27位36氪AI测评官</strong>，用了一周时间，以西游记部分剧情进行AI 内容还原，从<strong>七个维度</strong>对即梦Seedance 2.5模型进行深度测评。</p>\n  <blockquote>\n   <p><strong>36氪AI测评官：覆盖AIGC内容创作者、AI漫剧团队负责人、4A广告公司创意总监，CG研发、科技行业观察、B站头部 UP以及各行AI 视频生产落地实战专家。</strong></p>\n   <p>&nbsp;</p>\n  </blockquote>\n  <p>本次我们选用《西游记》作为测评载体，正是因为故事国民认知度高，可以规避剧情理解带来的主观偏差，让我们直接审视模型本身的长短板。</p>\n  <p><strong>站在AI视频迭代的转折点，Seedance 2.5的更新，究竟解决了哪些真实生产痛点，又还留下哪些待解难题？</strong></p>\n  <p>&nbsp;</p>\n  <p><strong>先说结论：</strong></p>\n  <p>1、这次升级有<strong>三个硬功能</strong>直接改变了创作方式：时长从15秒翻倍到30秒；参考素材上限从15个拉到50个全模态；新增局部编辑功能。</p>\n  <p>2、画面层面的提升同样明显，运镜有了设计感，动作戏的打击感接近游戏CG，角色表情细腻，整体质感逼近实拍。</p>\n  <p>3、但是<strong>问题</strong>也很明显：</p>\n  <p><strong>&nbsp;·&nbsp;</strong>长镜头人物一致性仍然是最大的痛点。</p>\n  <p><strong>&nbsp;·&nbsp;</strong>模型对提示词理解能力跟不上生成能力，对文学性描述的提示词的理解仍需提升。</p>\n  <p><strong>&nbsp;·&nbsp;</strong>使用成本偏高，完整成片门槛在数百元起步。</p>\n  <p>&nbsp;</p>\n  <p><strong>以下是七大维度的详细测评。</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_c0194b9bca354d8588a413bb0fd8163d@5284654_oswg8758oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">01</p>\n  <h2><strong>空间结构：专业用户的利器</strong></h2>\n  <p>Seedance 2.5支持白模参考，这件事尤其重要。</p>\n  <p>资深测评官普遍给出了较高评价：</p>\n  <blockquote>\n   <p><strong>一个剧组可以先在简单的3D 空间里摆好立方体、圆柱、人物位置和运动路径，再让模型根据这些空间信息，快速生成接近最终视觉效果的预演。它对人物在空间中的位置关系理解得非常准确，谁在前、谁在后、谁面向谁，几乎不会出现明显偏差。</strong></p>\n  </blockquote>\n  <p>相比2.0，Seedance 2.5强化了<strong>空间几何理解能力</strong>。模型不再只是识别参考图中的像素信息，而是能够从3D参考中提取深度信息，重建场景中的三维空间关系。这项能力在上一代产品中还只是雏形，而到了2.5已经逐渐成熟。</p>\n  <p>&nbsp;</p>\n  <p>不过，对于没有3D制作经验的<strong>普通用户</strong>而言，体验则完全不同。</p>\n  <p>测评过程中反复出现一个问题：<strong>当参考图不足时，模型对于人物朝向的判断仍然容易出现偏差。</strong></p>\n  <p>比如：希望生成“孙悟空背对观众、面向妖怪”的场景画面，最终结果却经常出现孙悟空面向观众、背对敌人，人物关系与预期相反。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>造成这一问题的原因在于：<strong>纯文字描述本身缺乏空间深度信息</strong>。模型只能依据语义推断人物朝向，当描述不够具体时，往往会优先生成最常见的正面人物构图。相比2.0，这一问题已有改善，但仍未完全解决，因此普通用户仍需要依赖更精准的提示词，或者通过多次生成不断调整结果。</p>\n  <p>与此同时，Seedance 2.5在<strong>画面空间层次</strong>上的表现则更加稳定。前景、中景和后景之间的关系划分清晰，景深自然，整体画面具备较好的空间纵深感，不再容易出现所有元素堆叠在同一平面的情况。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>我们以《女儿国》为测试场景。最终生成结果中，空间关系清晰，背景模糊过度自然，没有出现明显的穿帮或站位错误，整体空间表达已经接近真实摄影镜头的效果。</p>\n  <p>&nbsp;</p>\n  <blockquote>\n   <p><strong>36氪AI测评观点</strong></p>\n   <p>Seedance 2.5的空间理解能力已经成为其极具竞争力的优势之一，但这一能力目前仍更依赖参考样本。对于专业创作者，它能够显著提升复杂场景的制作效率；而对于普通用户来说，人物朝向依然是最需要优化的体验环节。</p>\n   <p>&nbsp;</p>\n  </blockquote>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_ad39f632fe9d4ef39b367b4431862979@5284654_oswg10246oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">02</p>\n  <h2><strong>镜头语言：运镜终于有了节奏感</strong></h2>\n  <p>如果说空间结构是\"静态的空间\"，那镜头语言就是\"动态的空间\"。</p>\n  <p><strong>新版本的运镜变化，是整体性的。</strong></p>\n  <p>镜头的运动有了节奏，有了呼吸感，有了电影运镜逻辑：一个从近景镜头，速度会有变化，开始慢、中间快、收尾再慢下来，像真正的摄影师在操作。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>这种变化来自模型对镜头语言数据的学习更深入了。2.0时代模型学的是镜头运动的形式，2.5学的是<strong>镜头运动的目的</strong>。它开始理解不同运镜方式对应的情绪和叙事功能，所以动起来就有了章法。</p>\n  <p><strong>最明显的提升是转场逻辑。</strong></p>\n  <p>新版本生成的视频镜头连贯性显著提升，观众观看时不会有明显的断裂感。</p>\n  <p>一位长期制作AI漫剧的测评官评价得很直接：</p>\n  <blockquote>\n   <p><strong>“2.0的分镜更像是AI在拼接镜头，2.5的分镜太自然了。”</strong></p>\n  </blockquote>\n  <p>分镜设计是导演的核心能力之一。如果AI能自主做出有设计感的分镜和运镜，那它触及的就不只是执行层，而是开始进入<strong>创作层</strong>了。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>红孩儿这段的转场是个很好的例子：镜头从红孩儿的火焰特效过渡到下一个场景，用燃烧的火焰作为转场元素，整个过渡非常自然。这已经超出简单镜头移动的范畴，带有叙事思维在里面。</p>\n  <p>虽然它还达不到专业导演的水平，但理解的方向是对的，而且进步速度很快。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_2278ee2ff2384bd6a45768f9d702b9e9@5284654_oswg10324oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">03</p>\n  <h2><strong>运动表现：打击感拉满，走路仍是“玄学”</strong></h2>\n  <p><strong>运动表现在所有测评官的结论高度一致：打击感和交互表现非常出色。</strong></p>\n  <p><strong>一位专业测评官的评价得很真实：</strong></p>\n  <blockquote>\n   <p>“这要是放在三年前，成本至少得10万。”</p>\n  </blockquote>\n  <p><strong>打击感这个东西，听起来很抽象，看一眼你就懂了：</strong>一击打出去，你能感觉到力量，能看到肌肉的绷紧、衣服的飘动、受力反应以及环境因此产生的变化。2.5在这方面的表现，已经接近一些游戏CG的水平。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>能做到这个程度，跟训练数据有直接关系：<strong>Seedance团队专门针对动作类影视素材做了强化训练，让模型学习到了人体运动的物理规律和受力反馈</strong>。这说明2.0模型只学到了动作的外形，2.5学到了动作的力学逻辑。</p>\n  <p><strong>连续动作的稳定性</strong>也得到了大幅提升。2.0常见的卡顿、掉帧、人物消失、道具乱飞的问题，在2.5上明显减少。人物不会再出现乱挥拳的诡异动作，每一下攻击都有明确的目标和轨迹。</p>\n  <p>孙悟空和二郎神对打的测试里，模型还自主添加了特效。火星、火花、能量波动，配合上合适的音效和打击节奏。甚至完成了黑白高光场景的滤镜效果，视觉观感体验超出预期。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_c4007a1adbec4ccfad06ecaf5cf3b2f7@5284654_oswg9510oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">04</p>\n  <p><strong>角色演绎：内心戏更细腻，但对提示词的理解仍有偏差</strong></p>\n  <p><strong>角色演绎</strong>一直是衡量AI视频智能程度的重要指标，也是本次测评中提升最明显、评价分化明显的一项能力。</p>\n  <p>令人惊喜的是，一旦模型准确理解了提示词，它呈现出的角色表演已经远超预期。</p>\n  <p>在测试中，我们设计了12个表达情绪的剧情片段。</p>\n  <p>例如：在小雷音寺的剧情中，孙悟空钻到黄眉大王的肚子之后让他痛不欲生的场景；还有车迟国斗法片段，老国王表示震惊的方式。</p>\n  <p>通过对人物的眼神、面部表情和细微动作让观众清晰感受到情绪表达。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>相比上一代，Seedance 2.5对微表情的刻画明显更加细腻。人物眼神的停顿、嘴角的变化、面部肌肉的轻微运动，都能够随着情绪变化自然调整，角色不再只是完成动作，而开始具备一定的情绪表达能力。</p>\n  <p>这种提升意味着：模型已经开始学习影视表演中的细节，而不仅仅是驱动人物完成一个动作。</p>\n  <p><strong>角色演得好，前提是模型理解了创作者的意图。</strong></p>\n  <p>在测试过程中，我们发现模型对一些抽象描述仍然容易出现理解偏差。</p>\n  <p>例如，我们希望女儿国国王的脸上浮现出淡淡的红晕。最终生成的结果却并非皮肤自然泛红，而是在人物脸部叠加了一圈明显的红色光晕，整体效果十分违和。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>这个案例反映出，模型对于语言和视觉概念之间的映射仍然存在一定偏差。</strong></p>\n  <p>它能够理解“红”“脸”“出现”这些关键词，却未必真正理解“红晕”所代表的是一种皮肤透出的细微色彩变化，而不是一层红色的光效。因此，当提示词包含大量抽象、文学化的表达时，模型更容易按照字面含义进行视觉还原，而不是理解其中真正想表达的画面效果。</p>\n  <p><strong>这也带来了一个比较现实的问题。</strong></p>\n  <p>提示词写得越抽象、越强调意境，模型反而可能出现理解偏差；而如果把描述拆解得足够具体，又容易让生成结果失去自然感，显得过于机械。</p>\n  <blockquote>\n   <p><strong>36氪AI测评观点</strong></p>\n   <p>Seedance 2.5的角色表演能力已经有了明显进步，但如何准确表达自己的创作意图，仍然是创作者需要学习的一门“提示词语言”。对于普通用户来说，也无形中提高了使用门槛。</p>\n   <p>&nbsp;</p>\n  </blockquote>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_b7f8adcf09b24d33b7c48b6cd7ed4108@5284654_oswg10066oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">05</p>\n  <p><strong>画面质感：接近实拍，细节处理仍有破绽</strong></p>\n  <p><strong>画面质感</strong>是用户最容易感知的一项能力，也是 Seedance 2.5 相比上一代提升最明显的部分之一。从最终生成效果来看，无论是光影氛围、材质表现还是人物质感，都已经非常接近真实影视画面。</p>\n  <p><strong>首先是光影。</strong></p>\n  <p>相比2.0较为固定的打光方式，2.5对不同场景的光线氛围已经具备了一定的理解能力。情绪表达偏克制的场景，会采用更加柔和的侧光和较低的整体亮度；动作场景则会强化高光和动态光效，以增强画面的冲击力。 光源方向一致与材质面对光线时的正确反应同样重要。人物皮肤、眼睛、毛孔和衣服的纹理，要随着距离���角度自然变化。</p>\n  <p><strong>画面的整体渲染质量也有明显提升。</strong></p>\n  <p>人物皮肤、服装材质以及环境细节都更加真实，阴影过渡和材质反射更加自然，画面不再像上一代那样带有明显的塑料感和油腻感。如果说 Seedance 2.0 的画面始终像隔着一层薄雾，那么新版本则让整体质感变得更加通透真实。</p>\n  <p><strong>人物细节同样是这一版本的重要进步。</strong></p>\n  <p>上一代最容易暴露AI痕迹的地方，就是人物皮肤过于光滑，缺乏真实肌理，看起来像过度磨皮。而在 2.5 中，人物面部已经能够呈现更加细腻的皮肤纹理，毛孔、皱纹、肤质等细节得到保留，角色整体也更接近真人拍摄的状态。</p>\n  <p>值得一提的是，Seedance 2.5对<strong>参考图的处理方式</strong>也进行了优化。</p>\n  <p>它并不会简单复制参考图，而是在保留主体特征的基础上，对画面进行重新理解和优化。例如，一些参考图中存在的光线、材质或细节瑕疵，模型往往会主动修正，而人物特征和整体风格则能够较好地保留下来。这意味着模型已经开始具备一定的理解后再生成能力，而不是单纯复刻参考图。</p>\n  <p><strong>在整体质感提升的同时，我们也发现了三个细节问题：</strong></p>\n  <p><strong>第一个问题</strong>，<strong>多角色时面���容易扭曲。</strong>当一个画面里出现很多角色时，其中某个角色的面部可能会出现扭曲或变形。背后的原因是计算资源分配的问题，角色一多，每张脸分到的计算资源就少了，细节精度自然下降。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>第二个问题，720P上限是专业用户的硬伤。</strong>2.5目前最高只支持720P，和4K比起来还是缺少质感和细节。对普通用户来说是够用了，但对专业影视创作者来说，720P是没法交付的。</p>\n  <p><strong>第三个问题，文字准确性提升了，但还不够。</strong>2.0时代生成的文字基本是乱码，2.5在这方面有很大提升，大部分时候文字是对的。但还是会出现错别字，而且一旦出现错别字，这个镜头就不能用了。对商业广告来说，交付效率大打折扣。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_2e9a9d4d53204de6b92b47ce5a9a8da9@5284654_oswg10612oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">06</p>\n  <p><strong>一致性：仍是AI视频落地的最大痛点</strong></p>\n  <p>在短镜头中，人物形象通常能够保持较好的稳定性。但当视频时长增加，<strong>人物一致性</strong>依旧是所有 AI 视频模型共同面临的最大问题。</p>\n  <p>在实际测试中，我们遇到了一个非常典型的案例：</p>\n  <p>来看这个三打白骨精的视频片段。重点关注猪八戒和沙僧的人物形象，我们设定沙僧形象为正常的小麦肤色，但在超长视频中，角色肤色发生变化，最终偏向了传统作品中常见的青色形象。猪八戒也从第一次画面转场之后变成了其他传统影视形象。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p>小tips：要保持主体形象完全不变，在提示词里写“参考图中的形象，外貌和着装保持完全一致”，可以增加避免人物形象发生偏移的概率。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_3a4656c2d88647258ec906476fc1d28c@5284654_oswg9690oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">07</p>\n  <h2><strong>版本新功能迭代：重构AI视频生产流程</strong></h2>\n  <p>2.0时代，AI视频更像是一次性片段生成工具。输入提示词产出画面，效果不满意只能全部重制，工作流程单向、不可微调。</p>\n  <p>2.5三大核心更新彻底重构创作逻辑：30秒时长、50个全模态参考素材、局部编辑，3分钟超长视频模式。</p>\n  <p><strong>1.&nbsp;30秒时长：实现完整短片叙事</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_ba486bed3ef74ae8af17b01a7ee8ca93@5284654_oswg11928oswg774oswg160_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片1</p>\n  <p>15秒仅能承载单一镜头、单个动作，无法串联起剧情的起承转合，而30秒拥有完整叙事空间，漫剧、短视频广告、剧情短片甚至能单条完成叙事。</p>\n  <p>B站头部的测评官评价得很客观：</p>\n  <blockquote>\n   <p>“故事的连贯性有了很大的提升，尤其是对于想做好内容的朋友，真的是很大的进步。”</p>\n  </blockquote>\n  <p><strong>2. 50个全模态参考素材：缓解一致性短板</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_13512beeb22b4580ac5a25f2ccf208a9@5284654_oswg171594oswg1080oswg162_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片2</p>\n  <p>支持图片、短视频、音频、文本混合导入，多角度人物图、分镜参考视频可以强制锁定角色、运镜风格，对一致性短板做出针对性优化。</p>\n  <p><strong>3. 局部编辑：告别全盘重制抽卡</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_e1bd743075e14f988472a84e732c60fb@5284654_oswg7112oswg704oswg66_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片3</p>\n  <p>过去的创作中出现一处瑕疵，整条视频就要作废，现在可框选出人物面部、背景、光影单独重绘修改，大幅缩短重复生成视频的创作周期。</p>\n  <p><strong>4. 3分钟超长模式：前瞻性技术试水</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_864cecf835294545abbc3266e9bb8dc1@5284654_oswg13259oswg778oswg166_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片4</p>\n  <p>180秒实测成片后半段形象漂移严重，目前只适合概念测试，离实现商业价值还有一定距离。</p>\n  <blockquote>\n   <p><strong>36氪AI测评观点</strong></p>\n   <p>以前是生成、不满意、抽卡重来，无限循环，现在是生成、微调、交付，效率差了一个量级。</p>\n   <p>&nbsp;</p>\n  </blockquote>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_cb4786fcf52a4513a366d39be0f508ee@5284654_oswg4075oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">08</p>\n  <h2><strong>结语：AI视频的下半场：迭代才刚刚开始</strong></h2>\n  <p>对比半年前同类AI视频产品，Seedance 2.5七维综合得分大幅领先。</p>\n  <p>对短视频创作者、个人漫剧制作者、小型创意工作室而言，已经可以融入日常创作流程，依靠多参考素材、局部编辑功能抵消一部分缺陷；但对于院线级短片、高标准宣传片，受分辨率、一致性限制，现阶段无法直接交付成片。</p>\n  <p>长远来看，本次测评也指明了模型后续迭代的核心方向：</p>\n  <p>第一，从底层算法逻辑解决人物一致性问题；</p>\n  <p>第二，继续打磨文本指令与视觉画面的对齐能力；</p>\n  <p>第三，开放更高分辨率输出权限，满足商业化落地对画面质量的要求。</p>\n  <p><strong>这一轮版本迭代刷新了AI视频的创作上限，但距离交出完美答卷仍有距离。</strong></p>\n  <p>&nbsp;</p>\n  <h2><strong>下期预告：</strong></h2>\n  <p>AI视频的瓶颈在交互端同样重要：</p>\n  <p>怎么写提示词才能让模型准确理解你想要的画面？提示词的上限够不够生成30秒视频？生成一条30秒的视频，实际成本到底是多少？</p>\n  <p>这些问题，也是决定AI视频能不能真正走进日常工作流的关键。</p>\n  <p>下一期，我们将聚焦用户体验与创作效率，从提示词工程、使用成本、创作流程三个维度，继续拆解Seedance 2.5在实际工作流中的真实表现。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_a9f26e2ddbca4ed28fe910fd29297aee@5284654_oswg8826oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_159253abe0af4f2987a4b70c9bc151d1@5284654_oswg216573oswg1080oswg300_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">名片</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_b68846a9eb2745adbf14578f47264089@5284654_oswg270470oswg1061oswg295_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">名片</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_a14491e229ef48fa927164369262ff03@5284654_oswg251788oswg1061oswg295_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">名片</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_06b0150be7bc48f7896c7d5abefa72b8@5284654_oswg20170oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI测评</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_e66610c10e0546229c576521ed139e27@5284654_oswg52368oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">新媒体矩阵</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/jnwFJCTi9gVkcB5iqkhVHA\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪AI测评”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-12T10:45:57+00:00", "fetched_at": "2026-08-13T01:29:11.279350+00:00", "fingerprint": "bc9d283ad3bcb976"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜英特尔增发200亿美元前据悉曾寻求美政府批准；前7个月我国期货市场累计成交额同比增长38.43%；连续两个月突破100万辆，我国汽车出口延续强劲增长态势", "url": "https://36kr.com/p/3936291241901444?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3936243741539463\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星、SK海力士最快本月底公布股东回报，总额或超200万亿韩元</strong></a></p>\n  <p>三星电子与SK海力士或将于本月底公布历史最大规模的股东回报方案。随着人工智能（AI）驱动的存储芯片超级周期推动两家公司的现金创造能力大幅提升，市场甚至开始讨论，两家公司包括特别分红、回购并注销股票等在内的股东回报规模合计可能超过200万亿韩元。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936234601364611\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>苹果商店现山寨版政务App，官方回应：相关部门正协调处理</strong></a></p>\n  <p>近日，福建政务服务APP统一平台（简称“闽政通App”）在苹果应用商店被“假冒”一事在网上引发关注。经查询发现，该假冒的App名为“闽证通”，其在下载页依旧标注自己是“政务便民服务应用”。目前仅在苹果应用商店搜索到该App，部分安卓平台的手机品牌应用商店均未搜索到此应用。对此，闽政通APP官方回应称，目前公司已把相关情况上报，相关部门正在协调处理，同时市民也可以直接在苹果应用商店对App进行举报。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3935823981837442\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英特尔增发200亿美元前据悉曾寻求美政府批准</strong></a></p>\n  <p>当地时间8月11日，英特尔宣布其普通股注册公开发行定价为每股95美元，共发行210526315股普通股，发行规模从此前公布的150亿美元扩大至200亿美元。据报道，英特尔CEO陈立武在公司增发股票前，曾致电美国商务部长卢特尼克寻求批准。美国政府最终决定不参与此次股票发行。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936210176261509\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星在半导体研发中引入Claude模型，耗时一月的设计验证缩短至两天</strong></a></p>\n  <p>据韩媒报道，三星电子已确认引入Anthropic的大语言模型Claude，并大幅缩短了部分半导体设计与验证的周期。在向软件开发人员优先开放Claude的AI编程工具Claude Code仅约三个月后，报道称开发一线便展现出了显著的效率提升。在客户定制SoC的验证工作中，原本预计耗时一个月以上的任务，仅用时两天就完成。内部评估显示，工作效率提升了约15倍。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936212285783433\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>C919首条国际航线开通</strong></a></p>\n  <p>8月12日15时许，由国产大飞机C919执飞的国航CA723航班从北京首都国际机场起飞，前往蒙古国首都乌兰巴托，标志着C919首条国际航线正式开通。目前，国航已运营12架C919客机，开通北京至上海、广州、香港、哈尔滨、重庆等航线，执飞超1.2万班次，安全运送旅客超162万人次。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3936270064237960\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>阿里云推出Agent竞技平台“千问 AI Arena”</strong></a></p>\n  <p>36氪获悉，8月12日，阿里千问AI平台正式上线\"千问AI Arena\"，这是一个面向AI Agent的挑战与评测平台，从真实业务中持续产生挑战任务，为开发者提供模型、运行环境和评测能力，征集并验证能解决实际问题的Agent方案。AI Arena发起的首个任务由千问AI平台与Aidge联合发起，聚焦跨境电商商品上架场景中的真实问题。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3935901507796097\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceXAI推出“全天候数字同事”Grok Bot</strong></a></p>\n  <p>SpaceXAI当地时间8月11日宣布推出AI代理产品Grok Bot，目前处于测试阶段。声明称，Grok Bot是一支全天候在线的智能助手团队，可接受并完成用户分配给它们的实际工作任务。据介绍，Grok Bot拥有独立的云端计算机，可以登录用户已经在用的工具，跨应用、收件箱等场景工作，任务完成后才返回汇报。马斯克在社媒平台X发文称：“我们将在修复早期测试的基本问题、并于本周晚些时候发布Grok 4.6之后，扩大Grok Bot的测试规模。”</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3936220530244996\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>金饰克价一个月飙涨超100元</strong></a></p>\n  <p>在经历阶段性震荡回调后，国际现货黄金近期强势反弹，重新站上4400美元/盎司关口，单周涨幅约7%，截至8月12日下午14时小幅回落至4391美元/盎司。国内金价从8月初的878元/克一路上涨到今天的955元/克，连续上涨80元/克左右。金饰价格也跟着水涨船高，截至8月12日，国内品牌金饰克价逼近1330元关口，周大福足金饰品报1329元/克，周生生足金饰品报1328元/克。金饰价格在7月14日触及低点，当日，周大福足金饰品价格报1217元/克，周生生足金饰品报1214元/克。据此计算，金饰克价一个月内飙涨超100元。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936062233443459\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>淡马锡计划投资三星电子和SK海力士</strong></a></p>\n  <p>据知情人士称，新加坡主权财富基金淡马锡计划投资三星电子和SK海力士，并已与韩国政府方面联系，商讨投资时机。消息人士称，淡马锡计划通过其内部投资团队直接进行投资，而不是通过外部资产管理公司。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3936140949601413\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>连续两个月突破100万辆，我国汽车出口延续强劲增长态势</strong></a></p>\n  <p>从中国汽车工业协会获悉，7月份我国汽车出口表现亮眼，延续强劲增长态势。最新发布的数据显示，今年7月份，汽车出口104.3万辆，环比增长0.6%，同比增长81.3%。其中，新能源汽车出口55.3万辆，环比增长5.7%，同比增长145.5%。记者注意到，自今年4月、5月连续两个月汽车出口超过90万辆后，6月、7月出口迈上新台阶，出口连续两个月突破100万辆。不仅如此，新能源汽车出口占比已连续两个月突破百分之五十。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3936135897316741\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>前7个月我国期货市场累计成交额同比增长38.43%</strong></a></p>\n  <p>从中国期货业协会了解到，以单边计算，今年1-7月全国期货市场累计成交量为61.07亿手，累计成交额为568.98万亿元，同比分别增长18.93%和38.43%。其中7月全国期货市场成交量为10.02亿手，成交额为86.28万亿元，同比分别下降5.31%和增长20.99%。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3935827380042880\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>截至今年6月，我国可再生能源制氢产能规模超140万吨</strong></a></p>\n  <p>国家能源局昨天（11日）发布的《中国氢能发展报告（2026）》显示，截至今年6月，我国以电解水制氢为主要路线的建成和在建可再生能源制氢年产能规模已超140万吨，氢能产业取得积极进展。当前，我国氢能基础设施稳步建设。截至6月，全国累计建成加氢站约620座，建成投运纯氢管道长度超350公里。</p>", "category": "tech", "published_at": "2026-08-12T11:00:16+00:00", "fetched_at": "2026-08-13T01:29:11.279344+00:00", "fingerprint": "69b42cd96e1c3c6e"}, {"source": "36氪 - 最新文章", "title": "最前线｜3999元起，影石发布X6：全景相机开始把更多创作交给AI", "url": "https://36kr.com/p/3936487630650758?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>&nbsp;8月12日，影石Insta360在其布局全景相机的第十年，发布了新一代旗舰全景相机X6，中国大陆地区售价3999元起。 &nbsp;</p>\n  <p>作为一款带有“十年之作”意味的产品，X6承接了影石过去十年在全景影像上的技术迭代与经验积累。相较此前几代主要围绕画质、便携性和全景拍摄体验展开升级，X6除了继续提升画质，更明显的变化在于，影石正把更多取景、跟拍和剪辑工作交给相机和AI完成。</p>\n  <p>在画质方面，X6最高支持8K 50帧全景视频和1.2亿像素全景照片，并搭载影石与索尼联合定制的两颗1/1.1英寸方形传感器。按照影石披露的数据，相比上一代X5，新传感器有效利用面积增加33%，单像素进光量提升300%，主要改善夜景、逆光等复杂场景下的成像表现。</p>\n  <p>相比参数提升，X6更值得关注的是拍摄方式的变化。<br />&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_872fe20c66ae4cb68a70f1afa4db08d5@5836910_oswg1280338oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">X6更值得关注的是拍摄方式的变化。</p>\n  <p>&nbsp;</p>\n  <p>&nbsp;</p>\n  <p>全景相机过去最大的特点，是拍摄时无需提前确定镜头方向，可以在后期重新取景，但这也意味着用户需要花更多时间处理素材。X6新增的云台模式2.0，可以直接输出4K平面视频，同时保留8K全景素材；自动跟拍除了人物，也开始支持动物和物体。搭配头部追踪配件后，相机还可以根据用户视线自动改变拍摄方向。</p>\n  <p>在硬件迭代之外，X6 另一条清晰的升级主线，是强化 AI 对拍摄后流程的接管能力，解决用户“拍完以后还要做什么”的问题，让全景影像进一步从记录走向自动创作与空间重建。</p>\n  <p>X6搭载影石自研全景AI模型PanoMind，可以自动识别素材中的精彩片段并完成剪辑；另一项“时刻Pro”则允许用户通过自然语言告诉系统想做什么样的视频，由AI筛选素材并完成成片。</p>\n  <p>此外，X6还加入3D空间重建。用户可以将拍摄素材转化成可自由浏览的3D场景，让全景相机除了记录视频，还拥有重建3D时空的能力，从任何角度重返人生时刻</p>\n  <p>在产品层面之外，影石的业务也处于持续扩张的阶段。年报显示，2025年营收同比增长74.76%，2026年一季度营收同比继续增长83.11%。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260812/v2_234bbdcec77843a5b2711551b1f69237@5836910_oswg1014716oswg1265oswg710_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">效果图</p>\n  <p>过去两年，影石已经不再只围绕全景相机扩张产品线。除X系列、GO系列和运动相机外，公司还陆续投入全景无人机、云台相机、无线麦克风以及定制芯片等新项目。2025年及2026年一季度，公司在这些战略项目上的投入分别达到7.62亿元和2.62亿元。</p>\n  <p>其中，无人机和云台相关布局指向的并不只是增加新品类。影石在年报中将更长期的方向概括为“摄影机器人”：一方面通过不同相机产品积累光学、传感器和影像算法，另一方面通过无人机和云台增加设备在空间中的运动能力，再叠加自动剪辑和AI理解能力。</p>\n  <p>可以看出，X6依然是影石验证新技术的重要产品之一。</p>\n  <p>从过去几代不断提高分辨率，到这一代加入自动跟拍、AI剪辑和空间重建，全景相机的竞争正在从“拍得更清楚”，进一步转向“如何让用户更少参与拍摄和后期，却获得更完整的内容”。</p>\n  <p>对于已经占据较高市场份额的影石来说，继续提高画质仍然重要，但如何降低创作门槛，以及把过去积累的全景影像、AI和空间感知能力延伸到更多硬件形态，也将成为未来的新重点。</p>", "category": "tech", "published_at": "2026-08-12T12:05:01+00:00", "fetched_at": "2026-08-13T01:29:11.279337+00:00", "fingerprint": "f4a6b95597c341e4"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨星巴克中国否认为降成本取消14薪；DeepSeek V4 Pro正式版上线；“阿里最年轻P10”林俊旸创业，新公司估值20亿美元", "url": "https://36kr.com/p/3937187153132680?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>国际能源署：霍尔木兹海峡持续关闭冲击全球石油市场</p>\n  <p>Anthropic将在AI生成文本中嵌入隐形水印</p>\n  <p>C919完成首次国际商业航线飞行</p>\n  <p>三星在半导体研发中引入Claude模型</p>\n  <p>段永平大幅加仓泡泡玛特</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>星巴克中国否认为降成本取消14薪</strong></p>\n  <p>近日，有传闻称星巴克中国已开启裁员和降低人工成本，比如取消14薪、修改员工合同，除店经理以外的大部分员工改为兼职合同、取消部分带薪假期。对此，记者多方确认，星巴克中国并未取消14薪、修改员工合同乃至取消部分带薪假期。（21世纪经济报道）</p>\n  <p><strong>DeepSeek V4 Pro正式版上线</strong></p>\n  <p>蓝鲸新闻8月13日电，13日凌晨DeepSeek官网更新API文档，DeepSeek V4 Pro对应模型版本更新为DeepSeek-V4-Pro-0813，开发者已可以通过API调用，这意味着DeepSeek V4的两个版本Flash和Pro正式版都完成发布。文档显示，V4 Pro正式版依旧支持1M上下文和384K最大输出，价格为3元/百万Token输入、6元/百万Token输出，缓存命中输入为0.025元/百万Token。据此前消息，DeepSeek于7月底推出V4 Flash正式版，Agent能力大幅增强，后迅速登顶全球Token调用量排行榜。（蓝鲸新闻）</p>\n  <p><strong>林俊旸创办AI公司语用科技，天使轮融资估值20亿美元</strong></p>\n  <p>8月12日，千问前技术负责人林俊旸宣布已在上海创办了一家新公司语用科技，研究方向为横跨数字世界和物理世界的下一代智能体。他同时透露，高榕创投和HSG（红杉中国）共同领投本轮融资，腾讯和上海未来产业基金提供支持。记者从知情人士处获悉，林俊旸所称的“本轮融资”为语用科技天使轮融资，估值为20亿美元。据此前报道，1993年出生的林俊旸，曾是阿里最年轻的P10级技术专家，与智谱AI创始人唐杰、月之暗面（Kimi）创始人杨植麟、腾讯首席AI科学家姚顺雨并称为“基模四杰”。今年3月，林俊旸宣布从阿里离职，开启创业之路。（证券时报、第一财经）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>SpaceX AI：推出Grok 4.6</strong></p>\n  <p>SpaceX AI于8月12日正式发布了全新升级的旗舰级AI模型Grok4.6。SpaceX AI表示，推出GROK 4.6，GROK 4.6的定价设定为每百万TOKEN输入2美元，每百万TOKEN输出6美元。（财联社）</p>\n  <p><strong>谷歌称Gemini的月用户数已超过10亿</strong></p>\n  <p>Alphabet首席执行官Sundar Pichai在社交媒体平台X上发帖称，目前每月有超过10亿人使用Gemini。他说：“这是我们历来增长最快的产品，也是我们第14款用户数量达到10亿的产品”。（新浪财经）</p>\n  <p><strong>Anthropic将在AI生成文本中嵌入隐形水印</strong></p>\n  <p>美国人工智能公司Anthropic计划推出一种隐形水印技术，用于识别由AI生成的文本内容。Anthropic表示，自8月2日及之后发布的模型起，该公司会在Claude AI生成的文本中直接嵌入人类无法察觉、仅机器可识别的水印。人类肉眼看不到该水印，不会降低文本质量与可读性。即便复制粘贴文本，水印也会随之保留，部分轻度编辑操作也无法清除水印。（但大规模改写或翻译操作大概率会破坏该水印标识。）（新浪财经）</p>\n  <p><strong>前OpenAI首席产品官凯文·��尔正在为其新成立的AI科学初创公司寻求至少7.5亿美元估值</strong></p>\n  <p>前OpenAI首席产品官凯文·韦尔（Kevin Weil）正在为其新成立的AI科学初创公司寻求至少7.5亿美元的估值，并计划在本轮融资中募集1.5亿美元。据三位知情人士透露，相关细节尚未最终敲定，仍可能调整。韦尔本人未回应置评请求。（新浪财经）</p>\n  <h2><strong>大公司/大新闻</strong></h2>\n  <p><strong>朱镕基同志逝世</strong></p>\n  <p>中国共产党中央委员会、中华人民共和国全国人民代表大会常务委员会、中华人民共和国国务院、中国人民政治协商会议全国委员会沉痛宣告：中国共产党的优秀党员，久经考验的忠诚的共产主义战士，杰出的无产阶级革命家、政治家，党和国家的卓越领导人，中国共产党第十四届、十五届中央政治局常委，国务院原总理朱镕基同志，因病医治无效，于2026年8月12日11时06分在北京逝世，享年98岁。（新华社）</p>\n  <p><strong>梁文锋拿下宇树科技网下私募最大份额，今年他财富已净增1300多亿元</strong></p>\n  <p>继打新长鑫科技后，梁文锋旗下私募再次打新宇树科技，并拿下私募最大份额。据报道，共135家私募旗下2839只产品获宇树科技网下配售，获配金额合计42.99亿元。其中，梁文锋旗下宁波幻方量化、浙江九章资产共有198只产品获配，合计获配25.82万股，金额约3893.74万元，按配售对象数量计为私募机构中最多。彭博亿万富翁指数显示，截至7月15日，梁文锋净资产达360亿美元（约2440亿元），位列全球第63位；年内财富增长199亿美元（约1342亿元），增幅超120%。（每日经济新闻）</p>\n  <p><strong>段永平大幅加仓泡泡玛特</strong></p>\n  <p>8月12日，据港交所权益披露，段永平管理的H&amp;H International Investment, LLC在泡泡玛特H股的持股比例于08月06日从5.55%升至7.70%。（界面新闻）<span style=\"color: #999999; font-size: 12px; letter-spacing: 0px; text-align: center;\">&nbsp;</span></p>\n  <p><strong>但斌美股持仓“大换血”：减仓谷歌，加仓AI硬件</strong></p>\n  <p>但斌美股持仓最新出炉。从调仓动作来看，相比一季度，东方港湾海外基金的美股持仓可谓“大换血”。具体操作上，东方港湾海外基金清仓了苹果、三倍做多纳斯达克100ETF、特斯拉、CIRCLE INTERNET GROUP INC等6只标的。同时，其新买入英特尔、闪迪、超威半导体、迈威尔科技、Arm Holdings plc ADR、博通、Lumentum等7只标的，上述标的均为AI硬件相关公司。从整体的持仓情况来看，东方港湾美股第一大重仓股仍为谷歌-C，持仓占其组合的比重约为23%，相比一季度有所减仓。（上证报）</p>\n  <p><strong>宇树科技A股“朋友圈”曝光</strong></p>\n  <p>近日，备受瞩目的“人形机器人第一股”宇树科技正式在科创板开启网上、网下申购。这家从杭州走出的“六小龙”企业，从受理到过会仅用时73天，创下年内最快IPO审核纪录。招股书显示，宇树科技本次发行前的前十大股东合计持股71.50%。其中，宇树科技董事长王兴兴直接持有公司23.82%股份，为宇树科技第一大股东；其次为宇树科技股权激励持股平台上海宇翼，持股10.94%。<span style=\"color: #999999; font-size: 12px; letter-spacing: 0px; text-align: center;\">&nbsp;</span></p>\n  <p><strong>C919完成首次国际商业航线飞行</strong></p>\n  <p>8月12日16时58分，中国国际航空公司CA723航班平稳降落在蒙古国新成吉思汗国际机场。执飞这次航班的是中国国产C919大飞机，这是C919投入商业运营以来首次执飞常态化国际定期客运航线，标志着中国国产大飞机国际化发展进入新阶段。C919大型客机是我国首次按照国际通行适航标准自行研制、具有自主知识产权的喷气式干线客机，于2023年5月28日完成首次商业飞行。中国商飞数据显示，截至8月10日，由国航、东航、南航运营的C919客机累计开通57条航线，通航25座城市，安全运送旅客超750万人次。（央视新闻）</p>\n  <p><strong>央行发布2026年第二季度中国货币政策执行报告</strong></p>\n  <p>36氪获悉，央行发布2026年第二季度中国货币政策执行报告。其中提出，将及时谋划出台务实管用的增量政策，加大逆周期调节力度，加力扩大内需、优化供给，推动经济持续向新向优向好发展。坚定不移走中国特色金融发展之路，进一步深化金融改革和高水平对外开放，加快建设金融强国，完善中央银行制度，构建科学稳健的货币政策体系和覆盖全面的宏观审慎管理体系，畅通货币政策传导机制。</p>\n  <p><strong>韩国将要求单一杠杆ETF的新投资者必须完成模拟交易练习</strong></p>\n  <p>韩国将要求单只杠杆交易所交易基金（ETF）的新投资者进行模拟交易练习，进一步收紧对加剧市场波动的这种高风险产品的监管规定。韩国金融服务委员会发布，新投资者购买单只杠杆ETF必须完成至少五天的模拟交易，总时长至少为五小时。新规将于8月19日起实施，适用于韩国境内及境外相关投资。（新浪财经）</p>\n  <p><strong>三星在半导体研发中引入Claude模型，耗时一月的设计验证缩短至两天</strong></p>\n  <p>据韩媒报道，三星电子已确认引入Anthropic的大语言模型Claude，并大幅缩短了部分半导体设计与验证的周期。在向软件开发人员优先开放Claude的AI编程工具Claude Code仅约三个月后，报道称开发一线便展现出了显著的效率提升。在客户定制SoC的验证工作中，原本预计耗时一个月以上的任务，仅用时两天就完成。内部评估显示，工作效率提升了约15倍。（财联社）</p>\n  <p><strong>国际能源署：霍尔木兹海峡持续关闭冲击全球石油市场</strong></p>\n  <p>当地时间8月12日，总部位于巴黎的国际能源署发布最新月度石油市场报告称，受霍尔木兹海峡持续关闭、燃料价格高企以及中东局势影响，全球石油供需均受到明显冲击。国际能源署预计，2026年全球石油需求将下降160万桶/日，降幅较上月预测扩大51万桶/日；全球石油供应预计下降430万桶/日。报告显示，7月全球石油供应增至1.015亿桶/日，但仍较去年同期减少630万桶/日，其中海湾地区仍有830万桶/日产量处于中断状态。7月全球可观测石油库存骤降6900万桶，自战争开始以来累计下降4.1亿桶。（央视新闻）</p>\n  <p><strong>全球最大主权财富基金斩获创纪录1840亿美元利润，首次披露持有SpaceX股份</strong></p>\n  <p>全球最大主权财富基金——挪威主权财富基金周三交出成绩单：受亚洲科技股行情提振，基金回报率达到9.4%，上半年盈利创下新高，超过1840亿美元。基金当前资产规模约2.34万亿美元，投资覆盖50多个国家、7000余家企业，持有全球约1.5%的上市流通股票。基金在半年报中首次对外披露，持有SpaceX 0.05%股份，估值略高于12亿美元。（新浪财经）</p>\n  <p><strong>机构称长江存储市占率首次跻身全球第三</strong></p>\n  <p>8月12日，市场研究机构Counterpoint发布数据称，2026年第二季度NAND闪存市场以出货量计算，三星、SK海力士、长江存储的份额分别为25%、22%、14%，这是长江存储份额首次进入前三。不过，按营收计算，长江存储排名行业第五，落后于美光和铠侠，原因是产品组合集中在消费级应用，高单价数据中心企业级固态硬盘占比相对较低。（第一财经）</p>\n  <p><strong>中际旭创新易盛回应英伟达投资传闻</strong></p>\n  <p>近日，有市场传闻称英伟达计划斥资20亿美元战略入股光模块龙头中际旭创，资金用于新一代光模块研发、全球产能扩充以及泰国新工厂建设；同时英伟达有意成为新易盛港股IPO的基石投资者。8月12日，致电中际旭创，相关人士回应：对于该市场传闻，公司并不了解，以公司相关公告为准。同时，新易盛回应称：对于该传闻，公司不便发表评论，有关于公司H股的事项，请投资者以公告为准。（财闻）</p>\n  <p><strong>上半年全国结婚登记人口超650万</strong></p>\n  <p>8月12日，民政部发布2026年2季度民政统计数据。数据显示，今年上半年全国结婚登记327.5万对（对应655万人），较去年同期减少26.4万对；离婚登记138.3万对，较去年同期增加5.2万对。近年来，我国大力提倡适龄婚育，构建、完善全社会的婚育支持体系。其中，婚姻登记的便利度大幅提升。2025年5月10日起，新修订的《婚姻登记条例》实施，婚姻登记地域限制取消，新人领证不再需要户口本，婚姻登记全国各地通办。（每日经济新闻）</p>\n  <p><strong>美股三大指数收盘涨跌不一，热门中概股普跌</strong></p>\n  <p>36氪获悉，8月12日收盘，美股三大指数涨跌不一，道指跌0.04%，纳指涨0.54%，标普500指数涨0.26%。大型科技股多数下跌，Meta跌超3%，微软跌超2%，亚马逊、特斯拉跌超1%，苹果、谷歌小幅下跌，英伟达、英特尔涨超3%。热门中概股普跌，网易、阿里巴巴、腾讯音乐、哔哩哔哩跌超2%，拼多多、百度、蔚来、理想汽车、小鹏集团跌超1%，京东跌近1%。</p>\n  <p><strong>消费电子业又被通知涨价：微软据称已提高Windows 11授权费用</strong></p>\n  <p>消费电子行业已经因半导体短缺造成成本上涨，而软件方面似乎也显示出不妙的苗头。微软据悉将Windows 11授权费提高7%至10%，幅度较往年明显增加，且CPU越高端授权费越高。华硕、宏碁今年晚些时候拟涨价约5%，其中，华硕产品均价较2025年Q4已涨30%。（财联社）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>面壁智能启动IPO</strong></p>\n  <p>36氪获悉，证监会网站披露，北京面壁智能科技股份有限公司于2026年8月11日在北京证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为中信证券。辅导备案报告显示，该公司无控股股东，公司第一大股东为北京清语启航科技中心（有限合伙），持股比例16.45%。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>xAI联合创始人创立的River AI融资11亿美元，英伟达、AMD参投</strong></p>\n  <p>8月11日，xAI联合创始人伊戈尔·巴布什金（Igor Babuschkin）的初创公司River AI宣布完成11亿美元融资，由General Catalyst和AMP PBC领投，英伟达和AMD Ventures跟投，其他投资者包括Y Combinator和淡马锡。（界面新闻）</p>\n  <p><strong>“希奥端计算”完成数亿元A轮融资</strong></p>\n  <p>36氪获悉，服务器CPU厂商“希奥端计算”完成数亿元A轮融资，并同步将总部迁至南京江北新区。本轮融资由铭哲资本、现象资本联合VC领投，中信建投资本、兆易创新等多家产业资本与投资机构首次入局，老股东持续加码。本次募资将投向三大方向：加速BlueDot V1 芯片回片验证与2026年底小批量试商用；启动第二代CPU产品研发；强化软硬件生态适配与兼容认证，完善服务器CPU开发生态。</p>\n  <p><strong>“艾欧智能”完成数亿元融资</strong></p>\n  <p>36氪获悉，机器人与具身智能数据基础设施企业“艾欧智能”（IO-AI Tech）宣布完成数亿元融资。本轮融资由顺为资本、松禾资本、深创投联合投资，并获得头部机器人本体企业战略投资。本轮融资金将主要用于三方面：持续加大核心产品研发投入，建设多元化研发团队以及加速全球市场拓展，提升机器人规模化应用能力。</p>\n  <p><strong>北京无限宇航科技有限公司完成近亿元A轮融资</strong></p>\n  <p>36氪获悉，近日，北京无限宇航科技有限公司宣布完成近亿元A轮融资。本轮融资由鼎峰科创领投，云鼎资本、泰亚投资跟投，老股东深担创投、松禾创投、守仁共创持续加注。本轮资金将主要用于“太空巴士”系列轨道转移飞行器（OTV）的首飞验证、后续型号研制、工程化迭代及规模化制造能力建设，加速推进“太空巴士”系列产品布局，推动公司由技术验证阶段向商业化运营阶段迈进。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>腾讯：二季度营收2047.85亿元，同比增长11%</strong></p>\n  <p>36氪获悉，腾讯发布2026年第二季度财报。财报显示，二季度腾讯营收2047.85亿元，同比增长11%；其中游戏收入同比增长11%，本土游戏收入增长17%，国际游戏收入按固定汇率计算增长4%；营销服务收入同比增长22%；金融科技及企业服务收入同比增长9%，云服务受惠于AI增量贡献，国际业务拓展和通用云服务需求增长。Non-IFRS经营利润756.4亿元，同比增长9%；若剔除新AI产品影响，Non-IFRS经营利润同比增长19%至861亿元。资本开支527.8亿元，同比增长176%。</p>\n  <p><strong>金龙鱼：2026年上半年净利润22.94亿元，同比增长30.69%</strong></p>\n  <p>36氪获悉，金龙鱼公告，2026年上半年营业收入1228.52亿元，同比增长6.20%。归属于上市公司股东的净利润22.94亿元，同比增长30.69%。归属于上市公司股东的扣除非经常性损益的净利润14.81亿元，同比增长6.61%。公司计划不派发现金红利，不送红股，不以公积金转增股本。</p>\n  <p><strong>超微电脑四季度净销售额111亿美元，同比接近翻番</strong></p>\n  <p>超微电脑8月11日公布四季度净销售额为111亿美元，去年同期为58亿美元；非GAAP稀释后每股普通股净收益为1.70美元，去年同期为0.41美元；财年净销售额为391亿美元，前一财年为220亿美元。超微电脑预计2027财年一季度净销售额将在145亿美元至155亿美元之间。（界面新闻）</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>谷歌发布三款新手机，搭载Google Tensor G6芯片</strong></p>\n  <p>8月12日，谷歌正式发布Pixel 11、Pixel 11 Pro 和 Pixel 11 Pro XL三款新手机。谷歌表示，这些机型在相机性能上进行了重大升级，耐用性得到增强，并搭载了Google Tensor G6芯片，该芯片可运行最新的Gemini Nano模型。（界面新闻）</p>\n  <p><strong>荣耀发布“全球首款机器人手机”，起售价9999元</strong></p>\n  <p>8月12日，荣耀正式发布“全球首款机器人手机”荣耀Robot Phone。据悉，该机搭载行业首发的钛合金云台架构与荣耀自研影像芯片荣耀驭光H1，12GB+512GB版本定价9999元，16GB+1TB版本12999元，8月12日开启预售，8月18日正式开售。(北京商报)</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-12T23:56:32+00:00", "fetched_at": "2026-08-13T01:29:11.279329+00:00", "fingerprint": "784058b4fc9e25e9"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 顺为、宁德时代系联手押注，这家公司要把全球最小丝杠量产千万根", "url": "https://36kr.com/p/3937262359100805?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_99c734bcaf84486587a08808aca71cb0@6221844_oswg98699oswg1280oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2600</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，精密传动部件供应商诺仕机器人（NOUSBOT）近日完成近亿元A+轮融资。本轮由顺为资本领投，宁德时代旗下望千资本跟投。资金将主要用于微型行星滚柱丝杠产能扩张、产品迭代及海外市场布局。</p>\n  <p>至此，公司已完成四轮融资，历史投资方包括上汽创投、浦东科创、联想创投等产业资本。</p>\n  <p>诺仕机器人成立于2023年7月，前身是一家拥有30余年丝杠制造经验的家族企业。公司专注于行星滚柱丝杠及直线执行器的正向研发与全套工艺自产，在深圳设立研发中心，并建有上海及苏州生产制造基地。诺仕机器人创始人徐杨为同济大学机械制造硕士，曾就职于法雷奥集团，在汽车传动与精密制造领域积累了丰富产业经验。</p>\n  <p>“过去8个月，市场发生了翻天覆地的变化。”徐杨告诉硬氪。上一次融资交割是2025年12月，彼时行业主流方案多围绕特斯拉灵巧手展开。而如今，灵巧手公司数量翻倍，技术路线迅速分化，行业已不再满足于“有一只手”，而是将传动需求延伸至手腕、小臂，甚至颈部与面部。</p>\n  <p>徐杨观察到，颈部自由度的要求从以往的一两个骤升至四到六个，对人脸微表情的精细控制提出了极高要求。</p>\n  <p>“这是市场倒逼的结果。”徐杨表示，2025年市面上绝大多数灵巧手“几乎不能用”，仅能维持约200小时寿命便频繁故障。而进入2026年，虽然部分产品能完成简单操作，但距离工业级可靠性仍有差距。</p>\n  <p>在人形机器人线性关节的传动方案中，旋转关节与丝杠之争由来已久。徐杨判断，丝杠将是最终解。</p>\n  <p>徐杨进一步解释，旋转关节虽然容易控制，但是有要力大，又要体积小，是很难做到的，电机堵转发热是常态，至今没有根治，诺仕的丝杠一体化直线关节就会好很多，因为丝杠天然的自锁力可以缓解电机持续工作，它可以间歇工作，不仅解决发热，还省了能耗，延长了寿命，一举多得。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_3c43228d0fec473e87ca61fdd21ff83f@6221844_oswg465018oswg1080oswg642_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">诺仕机器人灵巧手连杆、腱绳方案（图源/企业）</p>\n  <p>目前，诺仕机器人已实现直径仅1.5mm、螺母直径5.5mm的全球最小行星滚柱丝杠量产，精度达C5级，重复定位精度±0.01mm，最大承载力50N。基于该产品集成的微型线性电缸，在U盘大小的体积内可输出15kg推力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_02a6d10444674fb6b96e227e4a984bbe@6221844_oswg336567oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">全球最小行星滚柱丝杠（图源/企业）</p>\n  <p>此外，公司正将执行器向“智能化”方向迭代。新一代一体化智能电缸集成力反馈、精度反馈与温度反馈。比如，力反馈要精确到1%的波动，发热后电机衰退要有报警。这些多维传感数据将回传至机器人大脑与小脑，为精细操作提供闭环决策依据。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260813/v2_d02a67e9384945cca8121869a6dcb90a@6221844_oswg366533oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">全球最小行星滚柱丝杠伺服电缸（图源/企业）</p>\n  <p>硬氪了解到，诺仕的野心并不局限于人形机器人。徐杨向硬氪展示了其“力矩阵”产品规划：纵向按出力从3公斤覆盖至1000公斤，横向则切入医疗手术机器人、锂电涂布、半导体光模块、低空经济等多元场景。</p>\n  <p>以低空经济为例，诺仕已为头部无人机企业供货舵面线性执行器；汽车领域，延锋座椅项目一次性带来8个定点，微型高力密度电缸可大幅削减座椅厚度与重量，获上汽认可。</p>\n  <p>产能方面，目前公司苏州工厂24小时满产，年产能300万根仍供不应求。徐杨表示，按远期百万台人形机器人测算，行星滚柱丝杠年需求将达3000万根，而全球有效产能严重不足。本轮融资后，公司目标年底前将产能提升至1000万根。</p>\n  <p><strong>以下是硬氪与诺仕机器人创始人徐杨的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：微型丝杠从材料到结构都缺乏现成标准，诺仕如何解决寿命与可靠性这一行业最大痛点？</strong></p>\n  <p><strong>徐杨：</strong>这是所有零部件一起存续下来的努力，不仅仅是丝杠，空心杯电机，编码器，驱控板都需要一起坚持到寿命的尽头：300万次负载的应用要求，我们经常一台电缸测试半年之久，现在跑寿命的，还是去年冬天的电缸。我们给自己的要求是丝杆绝不能是短板，奔着百万次寿命去跑测试，把空心杯电机、齿轮箱、磁环全部拉齐到同一水平。</p>\n  <p>现在这几个核心部件基本都能稳定在百万次级别，最高的能到300万次。另外材料也在迭代。以前沿袭医疗或汽车行业丝杆材料，但灵巧手工况完全不同，我们又研发了更适合微型场景的新材料。</p>\n  <p><strong>硬氪：如何看待后来者模仿与巨头下场竞争？</strong></p>\n  <p><strong>徐杨：</strong>国内做丝杠本身门槛就高，再要切到微型行星滚柱领域，竞争对手只剩个位数。我们的策略是跑得早、跑得快。 我们目前已经把单价已经打到百元级别，出货量也越来越高。我也不认为单一专利能挡住所有人，所以我们要做的是“力矩阵”平台，让各行各业但凡用到线性传动，都能在我们这张网里找到最合适的方案。这个平台化壁垒比单个产品壁垒高得多。</p>\n  <p><strong>硬氪：当前行业技术演进最超出预期的是什么？</strong></p>\n  <p><strong>徐杨：</strong>没想到颈部、面部、手腕这些“非典型”关节对丝杠的需求来得这么快。以前脖子基本不动，现在要模拟人类4-6个自由度的微表情和转头动作。更关键的是手腕侧向受力，这种仿生动作对线性执行器的要求极高，旋转关节根本做不到。这说明整个行业对“拟人化”的追求正在倒逼底层零部件快速迭代。对我们来说，哪个部位需要丝杠，我们就快速出方案，这是我们相比海外竞品最大的反应速度优势。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>望千：</strong>行星滚柱丝杠性能全方位碾压其他类型方案，可贵的是在高频往复运动下还能保持微米级的定位精度，如此高精度的直线执行器方案定能逐步渗透到汽车、工业制造、半导体、医药等领域，实现快速增长。</p>\n  <p>滚柱丝杠已经稳居具身机器人成本的榜首，如何低成本+稳定交付+小型化一定会是行业未来发展的关键，而诺仕的特色工艺能实现高精度的滚柱丝杠高质量生产的同时兼顾生产效率，目前小型丝杠也在灵巧手领域保持相对优势，因此我们非常期待诺仕能成为整个直线执行器行业的领头羊企业、隐形冠军。</p>\n  <p>望千资本以硬科技投资为核心，已投标的涵盖AI、具身机器人、新能源新材料领域，重仓半导体设备公司芯上微装和上海微电子，深耕新能源行业的新工艺、新机会，同时也在需求具备共性的行业寻找核心零部件+高附加价值+高技术壁垒优质企业，诺仕机器人是完全符合望千资本的审美标准的。</p>\n  <p><strong>顺为：</strong>顺为看好诺仕发展前景，因为行业发展趋势明确，灵巧手/人形机器人赛道发展已成为大势所趋，而最主要的发展方向（小型化、轻量化、高自由度、稳定性）都需要仰赖微型电缸的性能提升，微型行星滚柱丝杠作为最核心的卡脖子零部件，行业发展趋势高度明确。其次，市场规模长坡厚雪，2024年全球丝杠行业市场规模超过230亿美金，人形机器人场景作为核心增长驱动，有机会带动行星滚柱丝杠市场迎来爆发性增长，预计至2030年全球具身场景行星滚柱丝杠市场规模预计为298亿元，对应微型电缸市场规模达到1,069亿。诺仕产品实力行业领先，创新性采用独家的精密工艺，成功打破对进口磨床的依赖，成为灵心巧手微型电缸主力供应商，覆盖行业头部客户。</p>", "category": "tech", "published_at": "2026-08-13T01:10:39+00:00", "fetched_at": "2026-08-13T01:29:11.279315+00:00", "fingerprint": "c8f0256f7c12833e"}, {"source": "少数派", "title": "派早报：微软已上调 Windows 11 OEM 授权费用、Claude 将为所有生成内容附加隐水印等", "url": "https://sspai.com/post/113343", "summary": "雷蛇那伽梵蛇 V3 专业版无线鼠标发布，铭凡推出 Elite Mini M2 Air-304 迷你主机等。<a href=\"https://sspai.com/post/113343\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-12T00:44:13+00:00", "fetched_at": "2026-08-13T01:29:09.742352+00:00", "fingerprint": "d3e7cb8d933dccbe"}, {"source": "少数派", "title": "我，与「唯一」的 iPhone Air", "url": "https://sspai.com/post/112880", "summary": "在 iPhone Air 之后才发现，有些产品存在的意义，是帮我确认我真正需要什么。<a href=\"https://sspai.com/post/112880\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-12T03:04:34+00:00", "fetched_at": "2026-08-13T01:29:09.742345+00:00", "fingerprint": "70ea7ebf97ce40ea"}, {"source": "少数派", "title": "对话少数派老麦：从 Palm、WebOS 到 AI 硬件，依然不想成为多数派", "url": "https://sspai.com/post/113352", "summary": "《三五环》主播刘飞邀请老麦聊了聊他从 Palm 时代开始的二十年数码时代的经营历程。复盘了少数派如何从一家媒体，一步步跑通「内容+产品」的商业闭环；也聊到了他与罗永浩那段「不打不相识」的往事，以及那些改变了他对科技媒体商业模式认知的故事。<a href=\"https://sspai.com/post/113352\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-12T07:00:00+00:00", "fetched_at": "2026-08-13T01:29:09.742339+00:00", "fingerprint": "b81d66ad2ff49c8c"}, {"source": "少数派", "title": "把「闪念胶囊」（Almost）放到 iPhone 锁屏", "url": "https://sspai.com/post/113219", "summary": "想法被及时、完好的记下来，然后呢？<a href=\"https://sspai.com/post/113219\" target=\"_blank\">查看全文</a>", "category": "tech", "publishe
