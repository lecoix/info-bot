 at a lower cost.\" It also provided some examples of [&#8230;]", "category": "tech", "published_at": "2026-07-16T20:29:27+00:00", "fetched_at": "2026-07-17T02:12:46.613638+00:00", "fingerprint": "27ca79ebdfb92091"}, {"source": "The Verge", "title": "Samsung’s 55-inch Frame art TV is $200 cheaper than usual", "url": "https://www.theverge.com/gadgets/966613/samsung-the-frame-art-tv-deal-sale", "summary": "Samsung’s Frame is different from your average 4K TV. Its biggest selling point involves what it does when you aren’t actively using it. It can display art, turning your living room into a gallery. The Frame has bezels that make it look like — you guessed it — framed art, and its matte finish can [&#8230;]", "category": "tech", "published_at": "2026-07-16T20:47:30+00:00", "fetched_at": "2026-07-17T02:12:46.613632+00:00", "fingerprint": "61ad2162d5206ebf"}, {"source": "The Verge", "title": "Fortnite is getting a bunch of AI-powered ‘personas’", "url": "https://www.theverge.com/games/966815/epic-games-fortnite-ai-powered-personas", "summary": "Get ready for more AI characters in Fortnite. Developer Epic Games is going to let Fortnite creators publish experiences featuring characters with AI-powered voices starting on July 30th, and ahead of that launch, it's created 36 characters with \"consistent voices and personas\" that creators can use as NPCs. The characters include Fortnite staples like Agent [&#8230;]", "category": "tech", "published_at": "2026-07-16T21:30:35+00:00", "fetched_at": "2026-07-17T02:12:46.613621+00:00", "fingerprint": "86194fd02b6b00f0"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨长鑫科技网上发行初步中签率为0.40995452%；特朗普头像将被印上硬币，面值1美元；多家NFC鲜榨果汁生产车间被曝无水果", "url": "https://36kr.com/p/3898973942007684?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>SpaceX市值蒸发近8500亿美元</p>\n  <p>韩国将暂停新的单一股票杠杆ETF上市，以抑制市场波动</p>\n  <p>泡泡玛特创始人王宁带队探访苹果总部</p>\n  <p>亚马逊Leo与南非企业达成协议，预计明年启动卫星互联网服务</p>\n  <p>日本拟采购2.75万颗英伟达Rubin芯片，打造本土机器人AI基础模型</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>长鑫科技：网上发行初步中签率为0.40995452%</strong></p>\n  <p>36氪获悉，长鑫科技公告，根据上交所提供的数据，本次网上发行有效申购户数为9,428,778户，有效申购股数为816,920,125,000股。网上发行初步中签率为0.40995452%。</p>\n  <p><strong>特朗普头像将被印上硬币，面值1美元</strong></p>\n  <p>美国财政部长贝森特15日说，为纪念美国建国250周年，美国铸币局将开始铸造正面印有特朗普总统头像的1美元硬币。该硬币的正面还印有“自由”“我们信仰上帝”“1776—2026”等，背面则是白头海雕图案。特朗普表示，这款硬币令他感到“荣幸”。</p>\n  <p>但批评人士对该硬币的合法性提出了质疑。1866年的一项美国法律规定，在世人物的肖像不得用在美国货币上，但该法律指的是由美国印刷局印制的纸币，硬币则由美国铸币局铸造。（第一财经）</p>\n  <p><strong>多家NFC鲜榨果汁生产车间被曝无水果，相关产品仍在线上售卖</strong></p>\n  <p>近年来，NFC果汁广受消费者欢迎。不少打着“鲜榨”“100%果汁”和“NFC果汁”旗号的菠萝汁、西瓜汁、山竹汁，在电商平台单品销量动辄高达几十万件，但价格却低到让人难以置信。记者实地暗访河南多家代工厂发现，车间根本没有水果和鲜榨设备，所谓“鲜果冷榨果汁”，全靠水、浓缩原浆勾兑而成。厂家坦言，“低价不可能鲜果现榨”，他们往往靠调换包装上的“100%”“NFC”等标注顺序打擦边球。目前多家涉事企业已停产整改。不过，记者发现线上仍有相关产品售卖，且部分瓶身外包装标识未作更改。（齐鲁电视台）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>月之暗面将推出新模型Kimi K3</strong></p>\n  <p>月之暗面将推出新模型Kimi K3，该模型参数规模达2万亿至3万亿。（新浪财经）</p>\n  <p><strong>马斯克旗下SpaceXAI宣布开源Grok Build</strong></p>\n  <p>当地时间7月15日，马斯克旗下SpaceXAI宣布开源Grok Build，并重置所有用户的使用限制。针对用户关于隐私的问题，公司表示，自上线以来，Grok Build完全尊重零数据保留（ZDR）原则。所有用户始终能够在命令行界面中禁用数据上传。在早期测试版中，非ZDR用户默认启用了数据保留。自7月12日起，公司已为所有GrokBuild用户禁用默认数据保留，此外正在删除之前保留的所有编码数据，确保每位用户的偏好得到尊重。（界面新闻）</p>\n  <p><strong>DeepSeek估值超3500亿元</strong></p>\n  <p>开润股份16日晚间的一纸投资进展公告，意外披露了国内头部人工智能企业“深度求索”（DeepSeek）的最新市场估值。按公告数据推算，DeepSeek本轮融资后估值已攀升至约3510亿元。从接近DeepSeek处人士确认，随着本轮融资完成，该公司目前已经开始启动第二轮融资了，但是年底是否冲刺科创板，目前并未确定。 (上证报)</p>\n  <p><strong>日本拟采购2.75万颗英伟达Rubin芯片，打造本土机器人AI基础模型</strong></p>\n  <p>7月16日消息，日本计划采购2.75万颗英伟达下一代Rubin AI芯片，用于构建本土机器人基础AI模型。新成立的Noetra将负责建设大型数据中心，并计划于2027年3月发布首个AI模型，随后持续迭代，未来数年推出面向机器人应用的AI模型。Noetra截至2027年3月已获日本政府3873亿日元资金支持，由软银、丰田汽车支持的Preferred Networks、日本电气等数十家企业参与运营。该项目旨在降低对海外技术依赖，并推动日本到2040年占据全球约60万亿日元机器人市场30%以上份额。（界面新闻）</p>\n  <p><strong>孙正义预计AI机器人市场规模将超290万亿元</strong></p>\n  <p>近期，国际资本市场人工智能相关板块出现剧烈波动，有关“AI泡沫”的争论也愈发激烈。当地时间14日，日本软银集团创始人兼首席执行官孙正义在东京出席一场活动时表示，对AI泡沫的担忧毫无依据，今天质疑AI，就如同当年拒绝汽车和飞机一样荒谬。据共同社报道，当天的活动上，孙正义表示，2040年前后，将有约10亿台搭载AI的人形机器人投入运行，届时，AI机器人的市场规模将扩大到约7000万亿日元（约合人民币292.7万亿元），相当于全球经济总量的20%。（央视财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>美股三大指数集体收跌，SpaceX盘后下跌3%</strong></p>\n  <p>美股三大指数集体收跌。半导体、存储芯片股大跌，费城半导体指数跌超4%，英特尔、美光科技、博通均跌超5%，SK海力士跌超13%，闪迪跌超12%。中概股逆势走强，纳斯达克中国金龙指数涨1.79%。</p>\n  <p>大型科技股表现分化。苹果、微软上涨逾1%，特斯拉跌0.86%、亚马逊跌近2%、英伟达跌超2%，谷歌大跌逾4%。此外，SpaceX股价持续下行，当日跌超3%。该股从6月上市以来高点大幅回落逾31%，市场对其超高估值的质疑持续发酵。（中国证券报）</p>\n  <p><strong>巴菲特：重仓Alphabet系亲自决策，后悔买入过晚</strong></p>\n  <p>传奇投资者沃伦·巴菲特近日接受采访时表示，伯克希尔·哈撒韦近期对谷歌母公司Alphabet的重大投资是由他本人亲自促成，而非新任首席执行官格雷格·阿贝尔。巴菲特透露，是他发起了这笔交易，并坚称自己与接班人阿贝尔保持着极其密切的沟通，虽然两人在重大决策上彼此认可，但他才是此项投资的最终决定者。尽管亲自操刀了这笔巨额投资，现年95岁的巴菲特在受访时坦言，自己犯了未能及早投资Alphabet的错误，他长期以来一直对错失这家科技巨头的早期崛起表示遗憾。（界面新闻）</p>\n  <p><strong>苹果上调AppleCare+服务价格</strong></p>\n  <p>苹果上调AppleCare+服务价格，Mac和iPad月度套餐费用上涨0.5美分，年度套餐上涨5美元，仅影响新用户。（财联社）</p>\n  <p><strong>韩国将暂停新的单一股票杠杆ETF上市，以抑制市场波动</strong></p>\n  <p>韩国将暂停新的单一股票杠杆交易所交易产品上市，以抑制市场波动。此前与三星电子和SK海力士挂钩的杠杆基金需求激增。韩国金融服务委员会周四发表声明称，该禁令将持续有效，直至市场状况稳定。此外，当局还将自8月5日起把杠杆ETF的最低存款额从1000万韩元提高至3000万韩元（20300美元）。这是韩国政府迄今为抑制散户交易狂潮而推出的最全面举措。（新浪财经）</p>\n  <p><strong>泡泡玛特创始人王宁带队探访苹果总部</strong></p>\n  <p>36氪获悉，当地时间7月14日下午，泡泡玛特创始人王宁率领核心高管团队探访美国硅谷苹果总部Apple Park，并与苹果现任CEO Tim Cook、即将上任的新任CEO John Ternus等高管会面。双方围绕创意设计、数字生态与全球消费趋势展开了深入而友好的交流。</p>\n  <p><strong>AI手机概念爆发，智度股份等多股涨停</strong></p>\n  <p>7月16日，AI手机概念持续活跃，带动端侧AI概念整体走强，智度股份直线涨停走出2连板，此前格林精密、福日电子、国光电器、福蓉科技等涨停，豪声电子、慧为智能、电声股份、泓禧科技均涨超10%。消息面上，据界面新闻报道，字节跳动联合中兴努比亚打造的首款AI智能体手机（“豆包AI智能体手机”）今年将有多款机型发布，其中一款将于2026世界人工智能大会期间亮相，其整体备货约20万台，首批备货10万台以内。（财联社）</p>\n  <p><strong>深圳等一线城市租房需求攀升，租金房价比持续抬升</strong></p>\n  <p>与房价相比，房租是和居民生活成本关联更为直接的指标。随着2026年暑期租赁高峰全面到来，深圳等一线城市租房需求快速攀升，租赁市场率先走出调整通道。近日，走访深圳市罗湖区、龙岗区、福田区多个住宅小区与城中村发现，伴随毕业季求职、换房需求集中释放，深圳租赁市场活跃度显著提升，城市人口吸引力与经济活力在租房数据中得到直观体现。从全国范围来看，今年上半年一线城市平均租金实现小幅上涨，正式结束此前连续两年的调整态势。（证券时报）</p>\n  <p><strong>脑机接口迎政策资本双重加持，产业加速打通商业化落地链路</strong></p>\n  <p>7月15日，上海市科委消息，植入式脑机接口手部运动功能代偿系统（NEO）获批上市后的首张处方7月13日在上海开出，全球首例植入手术在复旦大学附属华山医院完成。该款脑机接口产品于今年3月获批上市。7月15日，A股脑机接口概念股走强。行业人士研判，中国脑机接口领域发展水平整体位列全球第一梯队，依托完整产业链与工程师红利具备弯道超车潜力，但仍在脑神经底层基础研究、专用芯片等领域存在短板，业内正从政策引导、产业集聚、技术迭代等多维度破局，稳步打造完整商业闭环。（中证网）</p>\n  <p><strong>现代汽车集团将把波士顿动力转为全资子公司</strong></p>\n  <p>现代汽车集团7月16日表示，将收购软银持有的波士顿动力公司近10%股份，把后者转变为全资子公司。该集团称，此举将有助于其在各项业务中部署先进机器人技术。此前有媒体报道称，这笔交易的价值预计近5000亿韩元（约合3.35亿美元）。（界面新闻）</p>\n  <p><strong>中信证券：建议重点关注医疗健康产业投资机会</strong></p>\n  <p>36氪获悉，中信证券研报称，医药板块继续凸显出刚需的高确定性，同时叠加国内生物医药融资数据的持续高增长，中信证券认为医药创新企业和全球医药产业链企业有望在未来3-5年持续迎来业绩的稳健增长。同时叠加今年Q3开始，国产创新药核心管线即将迎来重磅数据读出催化、具有全球潜力的资产国际化价值有望加速兑现。同时政策大变革也开始逐步重新回归到临床价值和需求导向的市场价格定价体系，带来稳定且持续的国内医药市场环境和长坡厚雪的发展主基调，带来行业成长确定性较高的阿尔法和贝塔。建议重点关注医疗健康产业投资机会。</p>\n  <p><strong>韩国央行将利率上调25个基点至2.75%</strong></p>\n  <p>韩国央行将利率上调25个基点至2.75%，为2023年1月以来首次加息，符合市场预期。（财联社）</p>\n  <p><strong>基金二季报科技调仓现分歧，多只绩优基金维持高仓位</strong></p>\n  <p>今年上半年，科技板块是A股市场当之无愧的“领头羊”，多只重仓科技赛道的权益类基金收益率表现亮眼。最新披露的公募基金二季报显示，尽管多数基金经理依然对科技板块保持着极高配置热情，但针对科技股内部的板块轮动以及估值逻辑，已经产生显著分歧。随着全球AI浪潮持续，科技板块呈现了极高景气度。从近期已披露的基金二季报来看，中欧基金、平安基金、融通基金、红土创新基金和金信基金等多家公募旗下多只绩优基金，对科技股仍然维持高仓位运作，且多只产品单季度取得超高收益。（证券时报）</p>\n  <p><strong>行业景气度得到验证，锂电产业链企业上半年业绩大面积预喜</strong></p>\n  <p>锂电企业2026年上半年业绩预告集中披露，行业上行周期逻辑得到进一步印证。Choice数据显示，截至7月15日收盘，已有35家锂电产业链上市公司发布上半年业绩预告，除3家业绩同比下滑，其余为预增、扭亏或减亏。各企业的“成绩单”显示，从上游锂矿、锂盐，到中游锂电材料，再到下游动力电池、储能赛道，产业链各环节景气度同步回暖。上游锂盐实现量价齐升，相关企业业绩大面积预增；中游隔膜、电解液与下游电池厂商盈利同步修复。（上证报）</p>\n  <p><strong>印度上调柴油和航空燃油出口税，下调汽油出口税</strong></p>\n  <p>印度政府宣布，自7月16日起调整石油产品出口暴利税。其中，柴油出口暴利税从每升8.5卢比上调至15.5卢比，航空涡轮燃料出口税从每升7.5卢比上调至14.5卢比；汽油出口税则从每升4卢比下调至2.5卢比。（财联社）</p>\n  <p><strong>日本议会通过法律，将加密货币重新归类为金融资产</strong></p>\n  <p>日本将加密货币重新归类为金融工具，这一结构性变化确立了加密资产单独征税的法律框架以及未来加密交易所交易基金（ETF）的基础。该立法周三经议会批准修订了《金融工具和交易法》及《支付服务法》（PSA）。该修订将加密货币从主要作为支付工具的框架转变为与其他金融工具一同作为投资对待。新规预计将于2027年生效。（新浪财经）</p>\n  <p><strong>前IBM金融掌门人范斌空降中关村科金，出任高级副总裁</strong></p>\n  <p>7月16日，中关村科金宣布，前IBM金融行业总经理范斌出任高级副总裁，他将负责银行及信贷事业部、财富及保险事业部、联合运营事业部以及海外业务战略及拓展。这步人事落子，透露出中关村科金两大战略意图：加固金融基本盘，提速出海新增长。范斌拥有25年金融咨询经验，是中国区唯一的IBM金融行业学院院士，曾操盘国内大量核心银行系统变革项目。</p>\n  <p><strong>亚马逊Leo与南非企业达成协议，预计明年启动卫星互联网服务</strong></p>\n  <p>亚马逊旗下低轨卫星网络Leo当地时间7月15日宣布，与南非最大固定互联网服务提供商Herotel达成协议，通过一项名为evry的新服务将卫星互联网引入南非。Evry预计将于2027年正式上线，为南非的住宅用户提供网络连接。这是Amazon Leo在非洲达成的首项此类协议。（界面新闻）</p>\n  <p><strong>成立世界人工智能合作组织协定签署仪式在上海举行</strong></p>\n  <p>7月16日，成立世界人工智能合作组织协定签署仪式在上海举行。中共中央政治局委员、外交部长王毅出席并代表中国政府签署协定。协定明确，世界人工智能合作组织是独立的政府间国际组织，遵循《联合国宪章》宗旨，秉持共商共建共享理念，坚持以人为本原则，旨在促进人工智能国际合作和全球治理，确保人工智能朝着有益、安全、公平方向健康有序发展，造福全人类。组织总部设在中国上海。哈萨克斯坦副总理兼人工智能和数字发展部部长马迪耶夫、老挝副总理兼外长通沙万、巴基斯坦副总理兼外长达尔、俄罗斯总统办公厅副主任奥列什金、印度尼西亚经济统筹部部长艾尔朗加等29个国家代表签署协定，成为创始成员国。联合国秘书长古特雷斯等国家和国际组织代表出席仪式。（新华社）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>神州股份科创板IPO审核状态变更为“已问询”</strong></p>\n  <p>36氪获悉，上交所官网显示，7月15日，江苏神州半导体科技股份有限公司科创板IPO审核状态变更为“已问询”。</p>\n  <p><strong>百度：寻求在港交所主板自愿转化为双重主板上市</strong></p>\n  <p>36氪获悉，百度宣布，董事会批准根据香港联交所指引信HKEX-GL112-22寻求于香港联交所主板自愿转换为双重主要上市的动议。预期主要转换事项将于本年度内生效。董事会亦授权本公司管理层进行相关筹备工作并采取必要步骤以完成主要转换事项。主要转换事项后，本公司将成为于香港联交所主板及纳斯达克全球精选市场双重主要上市的公司，其A类普通股及美国存托股将继续于两个证券交易所内买卖（视情况而定），且仍可互相转换。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>台积电二季度净利润为7065.6亿新台币，同比增长77.4%</strong></p>\n  <p>台积电7月16日公布截至6月30日的2026年二季度合并财务报告。合并营收为12703.8亿新台币，同比增长36%，净利润为7065.6亿新台币，同比增长77.4%；毛利率为67.7%，营业利润率为60.3%，净利润率为55.6%。二季度晶圆总营收中，2纳米、3纳米、5纳米和7纳米制程出货分别占比3%、30%、33%和11%，7纳米及更先进制程合计占晶圆总营收的77%。（界面新闻）</p>\n  <p><strong>摩尔线程：预计上半年营业收入同比增长135.12%-149.37%</strong></p>\n  <p>36氪获悉，摩尔线程公告，预计2026年上半年营业收入为16.5亿元—17.5亿元，同比增长135.12%至149.37%。报告期内，得益于人工智能产业的蓬勃发展及市场对全功能GPU的强劲需求，叠加公司夸娥智算集群商业化加速，产品性能获得客户高度认可并实现稳定供货，公司市场竞争优势进一步扩大，推动收入快速增长。</p>\n  <p><strong>海光信息：预计上半年净利润同比增长41.50%到52.32%</strong></p>\n  <p>36氪获悉，海光信息公告，预计2026年上半年实现归属于母公司所有者的净利润与上年同期（法定披露数据）相比，将增加49854.82万元到62854.82万元，同比增长41.50%到52.32%。扣除股份支付的影响后，将增加92478.07万元到105478.07万元，同比增长74.27%到84.71%。</p>\n  <p><strong>奈飞第二季度营收125.6亿美元，同比增长13%</strong></p>\n  <p>奈飞第二季度营收为125.6亿美元，同比增长13%，市场预期为125.9亿美元；营业利润为42亿美元，同比增长11%。公司将全年营收预期下调至510亿至514亿美元，同比增长13%至14%，预计2026年营业利润率为31.5%。（界面新闻）</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>豆包AI手机今年将发布多款机型</strong></p>\n  <p>字节跳动联合中兴努比亚打造的首款AI智能体手机（“豆包AI智能体手机”）今年将有多款机型发布，其中一款将于2026世界人工智能大会期间亮相，其整体备货约20万台，首批备货10万台以内，截至发稿中兴方面对此消息暂无回应。（界面新闻）</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-07-17T00:05:38+00:00", "fetched_at": "2026-07-17T02:12:46.502426+00:00", "fingerprint": "a6cfc8a79f82633c"}, {"source": "36氪 - 最新文章", "title": "独家 | 智谱 ARR 达到10 亿美元，半年增长 15 倍", "url": "https://36kr.com/p/3898662052693894?f=rss", "summary": "<p>文 | 周鑫雨</p>\n  <p>编辑 | 张雨忻</p>\n  <p>智能涌现从多个独立信源处获悉，<strong>截至 2026 年 7 月， 智谱的 ARR（年度经常性收入）已经达到 10 亿美元</strong>。</p>\n  <p>截至发稿前，针对上述信息，智谱未回复。</p>\n  <p>过去一年，AI Coding 和视频生成模型已经成为全球造血能力最强的 AI 赛道。</p>\n  <p>海外，Anthropic 的 Claude Code 仅发布半年，ARR 就飙升至 10 亿美金。这一现金牛产品，也将 Anthropic 的整体 估值抬高到万亿美金（2026 年 5 月），超过了 OpenAI。</p>\n  <p>但此前，对于国内大模型公司能否复刻 Anthropic 的财富神话，市场一直抱有疑问。一方面，背靠企业付费意愿高、订阅生态成熟的北美市场，Anthropic 有天然优渥的商业化土壤。另一方面，Anthropic 的估值，与智谱最新市值仍存在一个数量级的差距——这意味着，Anthropic 有更大量的资金能获取训练资源，这是国内模型厂商还比不了的。</p>\n  <p>但智谱达到 10 亿美金 ARR 的速度，远超预期。曾有投资人对我们表示，智谱的 ARR 预计到 2026 年底，才能达到 10 亿-15 亿美金。</p>\n  <p>一个更直观的对比是：根据Anthropic 的官方数据和智谱财报数据，ARR 从 1 亿美金增长到 10 亿美金，Anthropic 用了 15 个月，智谱仅用了 5 个月。<strong>据知情人士，在2026 年 1 月到7 月期间，智谱的 ARR 增长了 15 倍。</strong></p>\n  <p>智谱是国内最早押注 Coding 路线的模型厂商之一。2025年初，智谱就开始将力量收敛到了对模型 Coding 能力的提升上。智谱创始人唐杰曾形容智谱押注了 Coding 和 Reasoning——一种能与 Agent 共生共荣的模型能力。</p>\n  <p>后续，智谱以平均两个月一版的速度，发布了一系列 Coding 能力位于全球第一梯队的旗舰模型。2026 年 6 月最新上线的 GLM-5.2，即便开源，多个核心指标依然追平甚至超过了 Claude Opus 4.8 以及 GPT-5.5。</p>\n  <p>智谱官方曾提到，<strong>大模型的商业价值可以理解为</strong>“<strong>智能上限 × Token 消耗规模</strong>”，只要模型能力继续领先，调用量就会不断增长。财报显示，<strong>今年 Q1，GLM 的 API 价格累计调高约 83%，海外订阅价格甚至接近 Claude Code，但调用量仍增长约 400%。</strong></p>\n  <p>在用 Token 消耗衡量模型商业化水平的当下，Coding 和视频生成模型代表了两种范式：前者为企业和开发者直接提供生产力，后者则是进入到了工业化内容生产的核心环节。</p>\n  <p>从营收数据上看，Coding 的市场需求已经走向确定，视频生成也是。据智能涌现了解，Seedance2.0 的月营收接近 10 亿元；而高盛预测，可灵 AI 的 ARR 到年底能达到 10 亿美金。</p>\n  <p>不过，确定性的生意，也意味着更激烈的竞争。6 月，MiniMax 发布了 M3，重点强化了 Coding 和 Agent 能力。7 月 16 日，月之暗面也发布了 K3，一个参数量 达 2.8 万亿、综合智力水平仅次于 Claude Fable 5 和 GPT-5.6 Sol 的开源模型。</p>\n  <p>就连海外，随着 GPT-5.6 的发布、ChatGPT 与 CodeX 的合并，OpenAI 在 Coding 领域，也显示出了逆袭 Anthropic 的势头。</p>\n  <p>在当下这个时间点，Coding 之战还远未结束。</p>", "category": "tech", "published_at": "2026-07-17T01:05:04+00:00", "fetched_at": "2026-07-17T02:12:46.502420+00:00", "fingerprint": "7c41cb85511950c0"}, {"source": "36氪 - 最新文章", "title": "自研氢能催化剂关键材料，稳定性提升50%，「铂氢科技」完成数千万元Pre-A轮融资 | 36氪首发", "url": "https://36kr.com/p/3899040301876868?f=rss", "summary": "<p>36氪获悉，苏州铂氢科技源科技有限公司（以下简称「铂氢科技」）宣布完成数千万元Pre-A轮融资。本轮融资由东运创投领投、新晖资本跟投，老股东熔拓资本追投，资金将主要用于催化剂与膜电极新产线建设、研发及运营团队扩充。</p>\n  <p><strong>铂氢科技成立于2023年5月，专注于氢能等新兴领域的贵金属催化剂及膜电极等下游产品研发、生产与销售。</strong>产品矩阵覆盖燃料电池催化剂（铂碳、铂黑、铂钌黑、铂基合金等系列）和水电解催化剂（氧化铱、铱黑、负载型氧化铱、铱钌合金等）两大品类，并申请发明专利和实用新型专利15余件。</p>\n  <p>公司负责人邹亮亮是中国科学院大学博士，现担任苏州科技大学教授、博士生导师，拥有十余年贵金属催化剂研发经验。运营团队核心成员长期在能源和材料领域从事项目研发与市场拓展。</p>\n  <h2><strong>1.以配方和结构设计创新，解决催化剂效率难题</strong></h2>\n  <p>当下我国氢能产业正处在一个微妙的发展节点。一方面，据GEP Research统计，2026年中国在全球氢燃料电池催化剂市场中的占比提升至38.7%，达到108.1亿美元，成为全球最大的单一区域市场。氢能不仅被《能源法》纳入国家能源体系，还被列为“十五五”规划六大未来产业之一。但另一方面，产业实际需求尚未跟上产能规划的步伐，下游订单不足导致上游竞争加剧，产业链利润率不断压缩。</p>\n  <p><strong>在氢能产业链中，催化剂是决定生产系统效率和成本的核心材料之一。其中必需的铂、铱等贵金属原料，供给稀缺且大量依赖进口，因此又是催化剂材料实现国产化与成本优化的关键。</strong></p>\n  <p>邹亮亮表示，铂氢科技选择切入贵金属催化剂赛道，一是基于此前的长期技术积累，二是坚信“贵金属催化剂在未来很长一段时间内，仍然是氢能领域的主流选择”。</p>\n  <p>性能衰减与成本高企是铂基催化剂在反应过程中长期面临的痛点，“主要是因为铂原子在反应中会发生迁移和团聚，颗粒变大后导致活性下降，使催化剂失活”。邹亮亮解释。</p>\n  <p>针对这一痛点，铂氢科技通过对活性颗粒进行结构调控，增强催化剂稳定性，相比传统铂碳催化剂，铂氢科技的Pt/C纳米催化剂在耐久性测试中稳定性可提升40%-50%，3万圈加速老化测试后的性能衰减幅度减少10%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_5df572e74a274183ade4e1a5136f233b@5688585_oswg46786oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">铂氢科技60%铂碳催化剂</p>\n  <p>此外，在PEM电解水制氢领域，铂氢科技采用“模板法”开发富氧纳米氧化铱催化剂，通过构建纳米结构模板，确保催化剂颗粒始终保持小尺寸且分布均匀，充分参与催化反应。该产品的贵金属用量可降至0.4mg/cm²，是行业普遍应用技术的三分之一，电堆能耗低至4.1kWh/m³，理论寿命超过8万小时。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_399446e76586449ebbc5b407080f8039@5688585_oswg124847oswg1080oswg870_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">氧化铱性能对比数据图</p>\n  <h2><strong>2.“先活下去，等风来”</strong></h2>\n  <p>在商业化方面，铂氢科技的直接客户覆盖燃料电池膜电极、电堆企业以及PEM电解水制氢膜电极、电解槽制造商。公司已与中石油等能源、化工、燃料电池汽车厂商等氢能终端应用央企建立合作，并与科润、云帆等产业链上下游伙伴形成横向协同，共同为客户提供从催化剂、膜电极到电堆的一站式解决方案。</p>\n  <p>为减少贵金属损耗，降低原材料成本，铂氢科技也在探索贵金属催化剂的回收模式。</p>\n  <p>邹亮亮透露，2026年铂氢科技上半年实现营收2800万元，预计全年营收可超过4000万元。</p>\n  <p>在此基础上，铂氢科技计划持续投入研发，每年推出3-5款具有市场竞争力的新产品，争取2027年实现营收翻倍，服务客户超过320家，并完成两条核心产线建设，实现催化剂和膜电极的规模化稳定生产。</p>\n  <p>在当下重金属原材料价格不断上涨，产业链上游持续内卷的行业周期里，铂氢科技的短期目标不是盲目追求规模增长，而是保证“等行业风口来的时候，我们还活着，并且做好了准备。”</p>", "category": "tech", "published_at": "2026-07-17T01:09:52+00:00", "fetched_at": "2026-07-17T02:12:46.502413+00:00", "fingerprint": "7f94f143d26d5cee"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 这家人形机器人ODM厂商获千万融资，飞荣达、索辰科技接连下注", "url": "https://36kr.com/p/3899057634363266?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_50b87c3fce99434187077587e61d999f@6221844_oswg477499oswg1202oswg684_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2400</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，人形机器人ODM方案商半醒具身（BXI Robotics）于近期完成千万元级新一轮融资，投资方为A股上市公司索辰科技。本轮资金将主要用于下一代人形机器人研发及海外市场拓展。此前，半醒具身曾于2025年完成首轮机构融资，投资方为上市公司飞荣达。</p>\n  <p>半醒具身成立于2022年，但团队早在2020年便开始了人形机器人的研发工作。公司联合创始人兼CEO陈彦2003年毕业于东南大学计算机专业，在投身机器人创业前拥有多年二级市场量化交易经验；联合创始人刘福强本科毕业于西南科技大学，大学期间连续四年参加全国大学生机器人大赛并多次获奖。</p>\n  <p>公司专注于高动态双足人形机器人的全栈自研，是国内少数同时具备整机设计、核心电机、运动控制算法与场景软件交付能力的团队之一。目前，公司主要为品牌客户提供通用人形机器人ODM服务，方案涵盖白牌整机、关节电机模组、运动控制算法及应用软件开发等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_decd50004f1b4aeb949595812f3089f2@6221844_oswg627045oswg740oswg987_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">半醒具身相关产品展示（图源/企业）</p>\n  <p>选择ODM路线，源于半醒具身团队对市场需求的务实判断。公司创始人陈彦告诉36氪，人形机器人赛道火热之后，大量公司希望快速拥有自有品牌的人形机器人产品，但自研面临研发周期长（通常需要2-3年）、团队组建难、结果不确定等现实痛点。这催生了一个实实在在的ODM市场需求。</p>\n  <p>半醒具身的核心优势在于“全栈自研”。不同于市面上许多方案集成商，半醒从电机做起，逐步补齐了电控、结构设���、运动控制算法等全链条能力。</p>\n  <p>“我们是��整机需求出发，倒推去设计每一个零部件。”陈彦介绍。</p>\n  <p>以关节电机为例，团队在2020年启动项目时，市面上买不到能满足人形机器人后空翻需求的大扭矩电机、高频率电控。半醒便从关节电机模组开始自研，尝试了摆线、行星方案，做出了峰值扭矩800牛米的行星关节电机，还做了电机内水冷方案，配合自研的1000Hz电控系统，做出第一代样机。经过迭代，目前公司已形成BXI-50/70/85三款标准化行星中空关节电机模组，覆盖人形机器人全身31个自由度。</p>\n  <p>在ODM市场，客户决策周期长、单笔金额大，对供应商的可靠性要求极高。半醒具身将“实战验证”“量产交付”作为核心卖点。</p>\n  <p>硬氪了解到，半醒具身是极少数参加过机器人马拉松并完赛的ODM方案商之一。2025年4月，其“精灵2”机器人以未经改装的量产版本参加首届北京人形机器人半程马拉松，以4小时2分19秒完赛，位列第六；2026年4月，“精灵3”再次参赛，以150分钟净时间完赛，排名前列。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_715311378ce2493b9f46221bb60a5502@6221844_oswg808301oswg972oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">半醒具身“精灵3”参赛机器人马拉松（图源/企业）</p>\n  <p>产能方面，半醒具身依托股东飞荣达在深圳和常州的生产基地支持，目前月产能可达数十台，短期内可扩至月产百台以上。公司预计，从2026年7月到2027年7月，单月订单金额有望超过千万元，全年营收预计过亿。</p>\n  <p>公司透露，客户涵盖头部科技互联网公司、多家国内主流车企及机器人企业，类型包括主机厂、二次开发商、具身智能“大脑”研发商，以及纺织、光伏清洁、无人洗车等垂直场景方。</p>\n  <p>海外市场同样是半醒具身的重点方向。目前公司已有美国头部科技公司客户，并正在拓展韩国、日本、欧洲等市场。“任何一个国家都不希望在人形机器人上依赖其他国家，每个当地市场都有巨大的ODM需求。”陈彦说。</p>\n  <p>在研发方向上，半醒具身将重点突破末端执行器（灵巧手）、感知与计算三大模块，以提升机器人“自由执行任务”的能力。</p>\n  <p>他们判断，双足人形机器人“自由移动”的能力已在过去几年得到较好解决，而“自由执行任务”的能力将是行业下一阶段的竞争焦点。</p>\n  <p><strong>以下为硬氪与半醒具身团队的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：相比其他ODM方案商，半醒最大的差异化优势是什么？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们能够真正提供从电机到电控、传感器、算力定制，到运动算法、操作算法的全栈方案，并且是经过量产和赛场验证的。客户跟我们合作，不需要再去找其他供应商，项目失败风险很小。我们就像一个六边形，缺一边都不行。市面上看起来有很多竞争者，但客户真正的选择并不多。</p>\n  <p><strong>硬氪：为什么不做自有品牌，而是选择ODM路线？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们发现了ODM这个金矿，现在要做的就是把手中的金矿挖完。人形机器人的终端市场目前主要是科研机构和实验室，买单方是“资本开支”而非普通消费者。大量公司希望快速拥有自有品牌的人形机器人，但自研周期长、风险高。我们花了五年时间从0走到60分，客户选择跟我们合作，本质上是“花钱买时间”。</p>\n  <p><strong>硬氪：如何看待人形机器人行业的发展节奏？</strong></p>\n  <p><strong>陈彦、刘福强：</strong>我们总是高估短期的趋势，低估长期的发展。2020年我们刚开始做的时候，梦想只是让机器人走起来。到今天，行业已经解决了“自由移动”的问题，接下来会解决“自由执行任务”的问题。</p>\n  <p>我们判断2027年人形机器人就会真正走入生活——不是隔着屏幕看，而是在身边看到。这个行业不是线性增长，而是台阶式的，一旦越过某个临界点，就会迎来集中爆发。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>索辰科技（688507）董秘吴味子：</strong>索辰高度看好半醒科技的底层硬件创新能力、硬核研发团队与标准化量产商业模式。半醒自研机器人核心关节与开放整机底座，实现高精度动态运动调控，技术稀缺且易于落地；轻量化 ODM 交付大幅降低具身智能产业化门槛，与索辰物理 AI 仿真体系高度协同，是衔接仿真与实体机器人落地的关键环节。</p>\n  <p>本次战略入股将推动双方技术产品深度融合，围绕硬件适配、数据迭代、运动控制重构完善具身智能完整技术链条。双方将打破传统机器人封闭硬件壁垒，打造标准化开放轻量化底座，为物理 AI 算法迭代提供专属硬件载体；搭建全域数据闭环，真机运行数据实时回流索辰物理 AI 平台，形成 “仿真训练 — 真机落地 — 数据回传 — 模型优化 — 迭代重训” 循环，持续提升物理模型仿真精度。依托营造・万象大模型重构机器人运动控制逻辑，实现高动态自主运动调控，让硬件成为物理 AI 的实体执行终端，完成物理仿真到实体具身智能落地的重要突破，落地具备高阶作业能力的人形机器人。</p>", "category": "tech", "published_at": "2026-07-17T01:26:47+00:00", "fetched_at": "2026-07-17T02:12:46.502405+00:00", "fingerprint": "328b6eabcb27abe8"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前蔚来、华为智驾核心成员联手创业具身世界模型，三个月内完成数亿元融资", "url": "https://36kr.com/p/3899081603483525?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，具身智能世界模型公司日冕开物（北京日冕机器人有限公司）近期完成连续两轮种子轮融资，融资合计金额达数亿元人民币，由鼎峰科创、远图未来、百度风投、沃衍资本、武岳峰科创、万林国际共同参与投资。同时，新一轮融资也在同步交割中。</p>\n  <p>此前融资资金主要用于自研世界模型 LaMPA 的研发迭代、强化学习体系建设，以及数据闭环和产品交付能力的持续完善。</p>\n  <p>日冕开物成立于2026年3月，聚焦物理世界基础模型研发，希望打造能够理解物理世界、预测环境变化并驱动机器人执行任务的基础模型，帮助机器人从单一场景能力，逐步迈向跨场景泛化。</p>\n  <p><strong>日冕创始团队均为清华自动驾驶背景，主导过行业首批智驾世界模型研发落地以及首批具身强化学习与交付工作。</strong>创始人肖中阳博士，曾主导智驾行业首个复杂交互场景的世界模型交付，该模型已搭载超过70万辆蔚来汽车；团队基座模型负责人，“华为天才少年”钟元鑫博士，曾主导华为新一代智驾世界模型基模的设计与量产落地工作；模型后训练与交付负责人，蔚来Super Spark王云龙博士，曾在智元机器人负责大模型与真机强化学习算法研发工作，并推动了行业首批进厂打工项目落地交付。市场负责人戴亚奇博士，曾任武岳峰科创合伙人，主导投资过数亿美金。</p>\n  <p>随着机器人开始进入复杂场景，行业越来越意识到，仅依赖模仿学习或任务级训练，难以支撑机器人真正具备泛化能力，机器人需要理解物理世界运行规律，并据此预测未来状态、规划动作，这也是世界模型成为具身智能重要技术方向的原因。</p>\n  <p>目前，业内不少研究都会参考图灵奖得主、卷积神经网络之父Yann LeCun（杨立昆）提出的JEPA理论，其核心思想是让模型学习物理世界更抽象、更本质的表征，而不是停留在像素层面的生成。</p>\n  <p>肖中阳向硬氪表示，<strong>JEPA提供了一套理论框架，而机器人真正落地仍有两个关键问题需要回答：物理世界应该如何表征，以及模型如何高效学习这些表征之间的因果关系。</strong></p>\n  <p>围绕这一问题，日冕开物研发了自有世界模型LaMPA。LaMPA的第一个核心创新在于构建了一套<strong>面向物理世界的三重表征体系</strong>。</p>\n  <p>肖中阳解释道，大语言模型之所以能够理解语言，是因为把自然语言转换成了统一的Token。而机器人同样需要一套能够描述物理世界的\"语言\"。LaMPA将机器人需要理解的信息划分为三类。第一类是环境表征（Environment），描述周围物体的位置、关系以及空间结构；第二类是本体表征（Ego），描述机器人自身状态，包括关节位置、受力情况、传感器反馈等信息；第三类则是经验表征（Experience），用于沉淀机器人长期执行任务过程中形成的先验知识，包括物体基本属性和可供性（Affordance），例如物体哪些位置可以抓取、不同任务通常采用怎样的操作顺序等。</p>\n  <p>三类信息共同构成机器人理解物理世界的隐空间（Latent Space），随后交由基础模型学习三者之间的因果关系，从而预测未来状态，并生成机器人的控制动作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_aa087cd1212749c2b8b720f51d292e1b@5920579_oswg442951oswg1080oswg624_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>除了表征方式之外，<strong>LaMPA在基础模型架构上也进行了重新设计</strong>。团队采用了更适合世界模型训练的块扩散（Block Diffusion）结构，旨在兼顾推理效率的同时，提升数据利用效率与模型可扩展性，并为后续大规模训练预留充足拓展空间。</p>\n  <p><strong>基础模型之外，强化学习是机器人最终完成场景交付的重要环节</strong>。肖中阳表示，目前不少强化学习方案依赖人工打分，当场景发生变化，例如光照、工位布局或环境噪声发生变化时，往往需要重新采集大量数据，重新进行后训练，导致部署周期较长。</p>\n  <p>针对这一问题，日冕开物引入了一套可泛化的World Reward Model（世界奖励模型）。这一模型来自基座世界模型，通过蒸馏和后训练，基座模型能够演化出一个专门负责“评价”的模型，判断什么是成功、什么是失败，像“评论家”一样为强化学习提供稳定、一致的反馈。让模型自动判断动作质量，大幅压缩针对新场景的后训练周期，加快工业场景部署效率。</p>\n  <p>据了解，公司目前已与远图未来达成战略合作，<strong>将进入服务器制造这一高精度工业装配场景</strong>，公司计划从服务器制造全流程开始，逐步延伸到前道和后道各项工序，实现全场景的跨产线规模部署</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_d4037219b2a743bb8f656c0453d71797@5920579_oswg588116oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>数据方面，日冕采用“自采+众包+模型增强”的策略：一方面，自建伴随式数据采集系统，沉淀具备场景壁垒的全模态精细操作数据；另一方面，通过数据众包平台获取高质量、多场景原始数据，扩大数据分布并降低采集成本；在数据准备阶段，利用世界模型驱动的数据增强（LCM），进一步提升数据利用效率。</p>\n  <p>未来一年，日冕开物将重点打通世界模型从场景调研、模型训练、现场部署到运行反馈的数据闭环，实现模型持续迭代。</p>\n  <p>长期来看，公司希望围绕模型、数据、交付和商业模式四个层面持续提升Scaling能力，使整套方案能够快速复制至更多工业场景及行业。</p>\n  <p><strong>以下是硬氪与日冕开物创始人肖中阳的交流节选：</strong></p>\n  <p><strong>硬氪：怎么理解日冕世界模型LaMPA&nbsp;和JEPA 之间的关系？</strong></p>\n  <p><strong>肖中阳：</strong>JEPA 是较早提出的一套非常基础的理论体系，其中有很多值得我们借鉴和吸收的地方。尤其是在 latent（隐空间）结构上的描述，我们非常认可。它强调模型应该关注事物的本质特征，而不是被像素级、细节层面的信息牵引，这一点对世界模型的发展非常重要。</p>\n  <p>严格来说，日冕世界模型是在这套理论体系基础上的进一步延伸。但我们并不是先选择某一套理论框架，再去做技术实现，而是从“一个原生世界模型应该如何构建”这个问题出发，探索适合的方法。JEPA 提出了一个重要方向，即模型需要学习一个更具抽象能力的 latent space。但它并没有进一步回答：这个 latent space 应该如何构建。另外，JEPA 也没有限定模型应该采用什么样的基础架构，去理解和预测未来状态。因此，我们也基于自身对世界模型的理解，探索了一套更适合规模化发展的模型范式。</p>\n  <p><strong>硬氪：与远图的合作推进得很快，为什么能够这么快推进从模型到工业场景的落地？</strong></p>\n  <p><strong>肖中阳：&nbsp;</strong>我觉得原因主要有几个。首先是模型本身。我们的世界模型和后训练体系具备比较好的泛化能力，能够快速适应新的场景。</p>\n  <p>其次是产品化思考，我们从创业一开始就比较重视产品化。工业客户需要的并不是机器人替代某一个工序，而是一整套能够快速部署、持续运行的解决方案。我们希望客户在进入新场景后，不需要依赖我们的工程师长期驻场，而是通过少量后训练就能够完成部署。这样交付的不只是自动化设备，而是能够持续学习、快速适应不同岗位的“硅基工人”。</p>\n  <p>因此我们提供的不只是模型，而是一套标准化产品，包括模型、硬件、训练系统，以及我们提出的Workflow Agent。它负责连接模型与真实生产流程，让机器人能够与工厂现有设备、人员和生产节拍协同工作。</p>\n  <p>与远图的合作也不仅是客户关系。远图为我们提供了服务器装配等高精度制造场景，用于验证方案；同时，<strong>双方也围绕装配和测试的共性需求与工序，共同打磨行业级解决方案</strong>，希望将这套能力复制到更多制造场景。</p>\n  <p><strong>硬氪：日冕此前发布了全球首个来自多个场景的双手全掌触觉专业操作数据集PalmDex。开源这个数据集，是出于哪些考虑？</strong></p>\n  <p><strong>肖中阳：</strong>之所以会关注全掌触觉是因为我们认为对力和触觉的理解是精细操作的基石，而精细操作是当前具身智能最痛点也最具价值的方向。此外，我们认为世界模型的发展最终不会依赖某一家公司的数据，而是依赖整个行业的数据生态。相比数据量，我们更关注数据分布。如果模型只学习某一种场景，即使数据再多，泛化能力也会受到限制；真正有价值的是覆盖工业、家庭、商业等不同场景、不同任务的数据，共同构成丰富的数据分布。</p>\n  <p>PalmDex的开源也是基于这样的思考。我们希望搭建一个开放的数据平台，让政府、客户、数据采集公司乃至个人开发者，都可以成为数据提供方，参与整个数据生态建设。</p>\n  <p>其次，这个平台最核心的能力之一其实是<strong>数据的价值发现和定价能力</strong>。作为一家模型公司，我们清楚模型当前最需要哪些数据、哪些数据已经充足、哪些数据仍然稀缺。对于真正稀缺、高价值的数据，就应该给予更合理的激励，让更多社会资源愿意持续参与数据采集。只有形成这样一套市场化的数据供给机制，才能真正实现数据规模和数据分布的持续扩展，最终推动世界模型不断迭代和泛化。</p>", "category": "tech", "published_at": "2026-07-17T01:52:16+00:00", "fetched_at": "2026-07-17T02:12:46.502389+00:00", "fingerprint": "6b37320f02d961a6"}, {"source": "少数派", "title": "翻译「世界杯」的赛事名称，为什么中文比日文更简洁？", "url": "https://sspai.com/post/111086", "summary": "国名也好、赛事名称也好，日语走上了片假名这条路——那为什么日本人不能像中文一样，直接造出「美加墨W杯」这样的简称？<a href=\"https://sspai.com/post/111086\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-16T02:58:08+00:00", "fetched_at": "2026-07-17T02:12:44.935294+00:00", "fingerprint": "3e1d71b2b72dcae5"}, {"source": "少数派", "title": "具透 | macOS 27 首个公开测试版来了，这些是值得你关注的新特性", "url": "https://sspai.com/post/112375", "summary": "全面 ARM 化后的第一个 macOS 版本，Golden Gate 27 还有这些变化。<a href=\"https://sspai.com/post/112375\" target=\"_blank\">查看全文</a>", "category": "tech", "publishe o. The Crusher headphone line differentiates itself from the competition through the use of both full-range and dedicated bass drivers in each ear cup to boost deeper frequencies. Skullcandy admits [&#8230;]", "category": "tech", "published_at": "2026-07-16T00:00:00+00:00", "fetched_at": "2026-07-16T02:09:43.826127+00:00", "fingerprint": "bdf27360478b2ac5"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜LG新能源将为谷歌规模最大的“光储一体”项目供应电池；元宝与京东AI Agent正式打通小程序生态；日本散户持有美元净空头飙至2.79万亿日元，创2008年以来历史之最", "url": "https://36kr.com/p/3896563671222147?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896551911556744\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美团、青桔、哈啰共享单车调价</strong></a></p>\n  <p>近期，美团单车、滴滴青桔、哈啰单车相继在北京等多个城市上调计费规则，三大平台不约而同地采取了“提高起步定价、拉长基础骑行时长”的组合策略：起步价从此前的1.5元/30分钟左右，普遍调整为1.88元至1.99元/60分钟。这成为共享单车行业近年来较大范围的一次集体调价。（金融时报）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896547919644294\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>瓜子二手车线下直卖场首店今日正式开业</strong></a></p>\n  <p>36氪获悉，瓜子二手车线下直卖场首店苏州直卖场今日正式开业。据介绍，瓜子此次重回线下，主打100%个人直卖车源。目前瓜子在沈阳、济南等同类型门店已同步启动，并推动全国落地中。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896537307760261\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>LG新能源将为谷歌规模最大的“光储一体”项目供应电池</strong></a></p>\n  <p>据业内人士周三透露，韩国LG新能源将为谷歌规模最大的太阳能与储能项目供应电池，此举标志着该公司进一步拓展了与AI数据中心激增的电力需求相关的能源基础设施业务。谷歌与可再生能源开发商Cypress Creek Energy在阿肯色州联合公布了“钢铁河能源中心”项目。该项目初期将配置1.6吉瓦（GW）的太阳能发电能力与约2吉瓦时（GWh）的电池储能系统；到2029年，规模将扩大至2.5吉瓦太阳能发电和2.9吉瓦时储能容量。预计LG新能源将供应其在北美生产的JF2 DC Link系统，该系统采用磷酸铁锂电池技术。据消息人士估算，该订单价值达数千亿韩元。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896392008714117\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>微盟旗下AI销售数字员工微盟星拓启动内测</strong></a></p>\n  <p>36氪获悉，7月15日，微盟集团宣布旗下面向B2B场景的AI销售数字员工微盟星拓正式启动内测。该产品覆盖“用户指令→意图解析→策略生成→自动寻客→智能外呼→意向加微”全链路。销售人员只需以自然语言下达一次指令，AI 数字员工即自主完成后续作业，将意向客户直接交付至销售团队。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896380062647944\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>元宝与京东AI Agent正式打通小程序生态</strong></a></p>\n  <p>36氪获悉，7月15日，腾讯宣布元宝与京东AI Agent完成小程序生态打通。京东AI Agent是首个接入元宝的电商垂域合作伙伴，基于双方生态打通，元宝能够为用户提供更加及时、准确的信息反馈，而京东依托其供应链与电商服务体系，为用户提供商品推荐、履约及售后等服务。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896383346820996\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蔚来战略投资长鑫科技：双方将构建稳定、互信的战略供应关系</strong></a></p>\n  <p>蔚来成为长鑫科技战略投资方，承诺认购金额为1.58亿元，锁定期限为18个月。双方将就现有车规级LPDDR4X、LPDDR5X产品开展战略合作，致力于构建稳定、互信的战略供应关系。（证券时报）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896607042766465\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>拜耳与RAGT签署杂交小麦许可协议</strong></a></p>\n  <p>7月15日，拜耳发表声明称，已与欧洲小麦种子公司RAGT签署了一项独家许可协议，目标是到2030年代初期在欧洲和北美同步扩大杂交小麦种子的销售规模。该协议涵盖针对欧洲环境定制的小麦种质资源的许可授权。拜耳称，其公司的目标是到2040年代中期实现杂交小麦年收入高达10亿欧元。（界面）</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896356363814530\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“灵巧智能”完成数亿元A轮融资，上海电气战略入股</strong></a></p>\n  <p>近日，具身智能企业“灵巧智能”（DexRobot）宣布完成数亿元A轮融资，本轮由上海电气战略投资，产业资本与财务资本持续加码。2026年内，公司已先后完成天使轮及A轮两轮融资，融资资金将重点用于灵巧操作全栈技术研发、核心产品迭代、教育/电力/工业三大场景落地及产业生态建设。此外，上海电气旗下上海机电与灵巧智能同步成立两家合资公司——灵机壹动与灵机智联，总注册资本超亿元，分别聚焦核心零部件量产与工业场景解决方案，标志着公司从技术研发迈入产业规模化交付阶段。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896612236265095\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“面壁智能”完成新一轮融资，估值超200亿元</strong></a></p>\n  <p>36氪获悉，面壁智能已完成新一轮融资，投资方包括国家级基金、央企、汽车制造商等各类产业方、财务投资人等。至此，面壁智能2026上半年累计融资金额超50亿元，估值超200亿元，一跃成为端侧智能领域公开估值最大的独角兽企业。面壁智能专注于将原生端侧大模型技术转化为标准化产品，在具身、汽车、手机、低空、民航等核心赛道落地，未来还将拓展至工业、家居、特种领域等。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896573504603784\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星电子推出新款990固态硬盘</strong></a></p>\n  <p>7月15日，三星电子宣布，新款990固态硬盘现已全球陆续上市，提供1TB、2TB两种容量版本。厂商建议零售价分别为269.99美元、529.99美元。（界面）</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896440133355394\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英国将对十六七岁青少年实施社媒“宵禁”</strong></a></p>\n  <p>英国政府7月14日宣布，将对16岁至17岁青少年使用社交媒体实施“宵禁”。这是英国政府继上月宣布将禁止16岁以下人群使用一系列社交媒体应用程序后新的社媒限制举措。英国政府表示，在默认设置状态下，16岁至17岁青少年在0时至6时不能使用社交媒体；旨在诱使用户更长时间浏览的功能，包括视频自动连续播放，也将默认关闭。英国政府6月表示，将效仿澳大利亚，禁止16岁以下人群使用一系列社交媒体应用程序。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896568678614917\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>日本散户持有美元净空头飙至2.79万亿日元，创2008年以来历史之最</strong></a></p>\n  <p>据日本金融期货协会数据显示，散户交易者的美元净空头头寸较上月激增逾三倍，达到2.79万亿日元（约合172亿美元），创下自2008年底有记录以来的历史最大规模。尽管这些看空押注也可能涉及其他货币对，但日元相关未平仓头寸规模庞大，表明其主要集中于美元兑日元持仓。市场普遍猜测日本官方可能再度出手干预以提振日元汇率。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896571579549319\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>央行：上半年人民币存款增加17.76万亿元</strong></a></p>\n  <p>36氪获悉，央行发布2026年上半年金融统计数据报告，6月末，本外币存款余额354.33万亿元，同比增长8.2%。月末人民币存款余额346.44万亿元，同比增长8.2%。上半年人民币存款增加17.76万亿元。其中，住户存款增加7.58万亿元，非金融企业存款增加3.2万亿元，财政性存款增加9715亿元，非银行业金融机构存款增加4.65万亿元。6月末，外币存款余额1.16万亿美元，同比增长13.7%。上半年外币存款增加980亿美元。</p>", "category": "tech", "published_at": "2026-07-15T11:37:31+00:00", "fetched_at": "2026-07-16T02:09:43.715772+00:00", "fingerprint": "ebea35ffa7b6df35"}, {"source": "36氪 - 最新文章", "title": "独家｜面壁智能端侧大模型将搭载三星手机上市", "url": "https://36kr.com/p/3896830362601351?f=rss", "summary": "<p><strong>文｜邓咏仪</strong></p>\n  <p><strong>编辑｜张雨忻 杨轩</strong></p>\n  <p>《智能涌现》独家获悉，端侧大模型公司面壁智能已与三星手机达成合作，其自主研发的MiniCPM系列端侧模型将搭载于三星手机上市，覆盖数款旗舰机型。</p>\n  <p>就在同一日，网信部门发布公告，包括“Apple智能”等7款提供手机端侧生成式人工智能服务完成备案。</p>\n  <p>公告显示，Apple智能、华为小艺AI大模型、OPPO Andes GPT、vivo蓝心端侧大模型、小米澎湃AI、三星盖乐世AI以及努比亚豆包手机大模型共7款服务完成备案。</p>\n  <p>大模型浪潮来临后，端侧AI一直处于技术探索和萌芽期。此次七款手机端侧AI同日获批，是业界的重要里程碑——端侧AI不再是概念演示，进入了规模化落地阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_c47f286e2748467fbc532dd4448e4721@2057308263_oswg372385oswg1080oswg1007_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△来源：网信中国</p>\n  <p>同日，阿里巴巴向媒体确认，阿里千问将作为AI能力集成至Apple智能，覆盖iOS、iPadOS、macOS和visionOS的国行设备，用户无需切换App即可在苹果设备上体验千问的文本与图像理解、内容生成等能力。此后，阿里股价应声上涨超过5%。</p>\n  <p>此前，国内手机厂商的端侧AI能力大多由自研模型支撑——华为有小艺、OPPO有AndesGPT、vivo有蓝心、小米有澎湃AI。而如今，阿里千问落地Apple智能、面壁智能搭载三星手机，这说明了AI模型公司正在成为手机AI能力的重要供给方——手机厂商不必事事自研，端侧模型的市场化分工正在形成。</p>\n  <h2><strong>最早押注端侧AI的初创公司</strong></h2>\n  <p>面壁智能2022年8月在北京成立，孵化自清华大学自然语言处理实验室。联合创始人、CEO李大海曾任知乎合伙人、CTO；联合创始人、首席科学家刘知远现任清华大学计算机系教授；联合创始人、CTO曾国洋在22岁时作为核心工程负责人，训练了中国第一个大语言模型CPM-1。</p>\n  <p><strong>据投资界报道，2026年上半年，面壁智能累计融资超50亿元，估值突破200亿元，成为国内端侧AI领域估值最高的独角兽。</strong></p>\n  <p>面壁智能也是国内最早押注端侧AI的初创公司。2023年下半年，当行业还在追赶云端大模型参数规模时，面壁智能决定全力押注端侧。这个选择在当时并不主流——做大模型的公司都在卷参数、卷算力，端侧模型被视为“做小”的边缘路线。</p>\n  <p>面壁智能的判断基于一个核心方法论：知识密度。2024年，面壁智能与清华大学团队提出“大模型密度定律”（Densing Law），认为开源大模型的最高能力密度约每3.5个月翻一番，同等智能所需的参数规模呈指数级下降。</p>\n  <p>这个判断在后续的模型发布中被逐步验证。2026年5月，面壁联合清华大学、OpenBMB开源的新一代端侧文本基座模型MiniCPM5-1B，参数量仅10亿，在Artificial Analysis Intelligence Index中获得17.9分，超过多款参数规模更大的开源基座模型；另一款MiniCPM-V 4.6仅1.3B参数、6GB内存即可在手机上流畅运行，支持iOS、Android、HarmonyOS等主流操作系统。</p>\n  <p>目前，MiniCPM系列开源模型在GitHub、Hugging Face等平台的累计下载量已突破3800万次。</p>\n  <p>在近期36氪对曾国洋的专访中，他解释了端侧模型的底层逻辑：“端侧是硬限制——如果模型太大，跑不动就是跑不动，补贴钱没用；功耗太高会发热，你不可能补贴一个冰块。”在他看来，做端侧模型的难度并不亚于做大：“做高效是非常难的，不是越大越简单。”</p>\n  <p>端侧模型的落地不只是把模型做高效，还要打通算法、芯片适配、功耗优化、终端部署的全链路。</p>\n  <p>面壁智能已完成对高通、联发科、英特尔、瑞芯微、英伟达、AMD等主流芯片平台的全面适配。在国产芯片方面，面壁智能参与了华为昇腾、寒武纪等国产芯片的软件栈构建，发布了全国首个三值量化大模型BitCPM-CANN，推理阶段可节省约6倍显存。</p>\n  <p>面壁智能也已建立多样化的端侧模型矩阵。比如，最新发布的MiniCPM-o4.5是一个全双工全模态大模型，以9B参数量，就是实现语音、视频、文本的全模态同步交互。</p>\n  <p>端侧模型要在手机上跑起来，得要解决功耗、散热、内存占用、响应延迟，每一个环节都不可缺少。“端侧模型不单看评测效果，还有响应时间、硬件成本，它很难从单一维度胜出。”曾国洋在专访中表示。</p>\n  <p>在汽车端，面壁智能已初步验证了规模化落地能力。其自研端侧智能体SuperMate到2026年底预计将交付超30万台量产车，覆盖吉利、上汽大众、广汽、马自达等品牌，跑通了模型适配、硬件兼容、供应链、终端交付的全链路。</p>\n  <p>三星是全球出货量最大的安卓手机厂商之一，其端侧AI能力此前主要依赖自研的Galaxy AI和与谷歌的合作。据韩媒报道，三星正与谷歌深度合作，将Gemini整合进其设备生态，包括即将于7月22日在伦敦发布的Galaxy Unpacked 2026系列产品。面壁智能的端侧模型在三星体系中具体承担怎样的角色，仍有待进一步确认。</p>\n  <p><strong>封面来源｜AI生成</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_6c2c24f65f7247228a1cf662b54d7799@2057308263_oswg66520oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">👇🏻&nbsp; 扫码加入「智涌AI交流群」👇🏻</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_a87ba363e0ae48e8b74b4237d5a60ffb@2057308263_oswg53751oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzkwMDQ2NDU2Nw==&amp;tempkey=MTM4M19NajZ4NE1neEpiSUhkeU5nMHNmaTk0OERudm5mTHVwNkhjWVI4VnU4Q3BPbzRuS1Myb3RVaXhTU1hVVjZLbkdWNlBRa1E2NUJHcURMY2lHakZ4cW5hQWJOb09wWFNJNzNMblZNOFpKai1lZEYwU1VOeXNlT01jU3NXRjF4REI5SlJCLVFVSVM4d19DVEFXUkl2UnFVTVcyVjZ2akw1U0JhTnBFZk9Rfn4%3D&amp;chksm=418c08c8dab2d6d4008851f34c8852d39ffeb8e16fcac54d22dabe3f4f134b793a56e9d15447&amp;mpshare=1&amp;scene=1&amp;srcid=0715K3lJ8yumyj4T8mEqfzeR&amp;sharer_shareinfo=0fadfb1222bcf2b203f4d9eda85bcb48&amp;sharer_shareinfo_first=0fadfb1222bcf2b203f4d9eda85bcb48#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“智能涌现”</a>，作者：邓咏仪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-15T11:47:14+00:00", "fetched_at": "2026-07-16T02:09:43.715766+00:00", "fingerprint": "c5fdd49e63ee1933"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨国行苹果AI功能完成备案；三家共享单车上调起步价；知情人曝DeepSeek开始筹备IPO", "url": "https://36kr.com/p/3897553391978371?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>澳洲将设AI办公室，限制数据中心能源消耗</p>\n  <p>巴菲特宣布8年内清仓伯克希尔股票</p>\n  <p>前高通自动驾驶工程副总裁将加入英伟达自动驾驶团队</p>\n  <p>长鑫科技：上市后仍将保持无实际控制人的控制权架构</p>\n  <p>谷歌参与建设美国最大太阳能项目，总规模达2.5GW</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>阿里、百度分别为苹果智能提供AI相关能力支撑</strong></p>\n  <p>36氪获悉，网信办公布7款端侧生成式AI服务备案，苹果“Apple智能”大模型7月8日完成备案。阿里千问将为苹果全系列国行设备提供文本、图像生成AI能力，百度则负责配套AI搜索功能，二者共同完善国内版苹果智能套件与Siri功能。</p>\n  <p><strong>三家共享单车上调起步价，拉长基础骑行时长</strong></p>\n  <p>近期，美团单车、滴滴青桔、哈啰单车相继在北京等多个城市上调计费规则，三大平台不约而同地采取了“提高起步定价、拉长基础骑行时长”的组合策略：起步价从此前的1.5元/30分钟左右，普遍调整为1.88元至1.99元/60分钟。这成为共享单车行业近年来较大范围的一次集体调价。（金融时报）</p>\n  <p><strong>知情人曝DeepSeek已开始筹备IPO，最快可能今年提交申请</strong></p>\n  <p>据彭博社报道，知情人士透露，DeepSeek已开始筹备首次公开募股（IPO），规划在内地上市，最快可能于今年提交申请，并在2027年完成上市。据悉，DeepSeek正与会计师事务所合作，力争在今年12月底前完成财务报告，这是IPO申报的必要步骤。相关讨论仍在进行中，IPO时间安排和融资计划可能有所调整，执行将取决于市场状况及公司业绩。（新浪科技）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>澳洲将设AI办公室，限制数据中心能源消耗</strong></p>\n  <p>澳大利亚总理阿尔巴尼斯星期三（7月15日）说，澳洲政府将设立一个“人工智能办公室”，负责管理人工智能（AI）标准的制定，并会强制规定数据中心须成为能源净生产者，以及限制用水量。这个办公室将在总理公署下设立，以确保各内阁部门采取协同一致的全政府应对模式。相关立法将于明年初提交国会。（财联社）</p>\n  <p><strong>Anthropic、黑石集团等联合推出企业AI服务公司Ode</strong></p>\n  <p>7月15日，Anthropic、黑石集团与Hellman&amp;Friedman联合推出今年早些时候公布的企业AI服务公司Ode with Anthropic（简称“Ode”），现以正式名称和品牌亮相。Ode公司由Chris Taylor担任首席执行官，Eddie Siegel担任首席技术官。除创始合伙人外，投资者联盟还包括高盛、General Atlantic、Leonard Green&amp;Partners、阿波罗全球管理公司、新加坡政府投资公司（GIC）和红杉资本。（界面新闻）</p>\n  <p><strong>机构：预估陪伴型人形机器人2030年产值达11亿美元</strong></p>\n  <p>36氪获悉，根据TrendForce集邦咨询最新机器人产业研究，陪伴型机器人已从早期的养老照护陪伴、疗愈设计，拓展至近年来的真人化互动和情感陪伴，日前中国厂商优必选发布超仿生人形机器人U1，象征此类陪伴型产品正式跨入真人化时代。随着全球人口结构走向老龄化、少子化，且独居人口持续增加，陪伴型人形机器人需求获得快速崛起的“陪伴经济”支撑，预估其产值将于2030年达到11亿美元。</p>\n  <p><strong>Xmax AI发布通用实时交互AI视频模型X2.0</strong></p>\n  <p>36氪获悉，15日，Xmax AI正式发布新一代通用实时交互AI视频模型Xmax X2.0，并同步开放API及产业合作接入。Xmax X2.0实时重渲能力升级，实现了CharX实时换人、ClothX实时换装、VibeX实时换风格等多项功能。交互层面，Xmax X2.0统一交互架构把只懂Prompt的模型升级为能理解摄像头、视频流与手势行为的全能模型。</p>\n  <p><strong>Anthropic计划几周内召开IPO投资者会议</strong></p>\n  <p>据知情人士透露，Anthropic正安排与投资者举行会面，为潜在的大规模IPO做准备。消息人士称，负责此次IPO的承销银行将在未来几周安排投资者与这家Claude聊天机器人开发商会面。此前有报道称，Anthropic最早可能于10月启动IPO。（新浪财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>巴菲特称将捐出1400亿美元股票</strong></p>\n  <p>美国知名投资人沃伦·巴菲特7月14日表示，到2034年底将其剩余的伯克希尔-哈撒韦公司股票，价值超1400亿美元，全部捐赠给慈善机构，而这份捐赠名单中并没有包括盖茨基金会。现年95岁的巴菲特自2006年开始捐赠名下资产，自2006年宣布捐出全部财富的计划以来，已累计捐赠了超过610亿美元（约合人民币4128亿元）。（央视财经）</p>\n  <p><strong>毒理的上游药效行业需求高速增长，实验猴市价涨到20万</strong></p>\n  <p>近期“猴子”刷屏投资圈。据报道，实验猴市价已涨到20万，堪比一台中档车。有业内专业人士表示，猴价是供需决定的，毒理的上游药效行业需求高速增长，可以预计2026—2027年对猴子的需求也是快速增长的。供给端前几年主要靠自产，2026年上半年放开了进口，根据行业专家反馈，应该进口了5000只左右，国内自产应该有3万—3.5万只的能力，2025年用猴子的数量约为3.5万只，按照2025年药效20%—30%的增长简单计算，今年毒理猴子的需求可能也是20%的增长，大概需要4.2万只猴。而最新调研反馈，毒理实验还是处于缺猴子的状态，头部公司项目排期已到明年初。（券商中国）</p>\n  <p><strong>罗技广告称消费者像狗被罚20万，品牌方已经介入处理并发布致歉声明</strong></p>\n  <p>因称消费者会因产品降价像狗一样跑过来，知名鼠标品牌罗技分销商上海百事得电子有限公司被认定广告违法，并于近日被上海市静安区市场监管局罚款20万元。</p>\n  <p>据行政处罚决定书，上海百事得电子有限公司为罗技（中国）科技有限公司的分销商，负责罗技在抖音平台的多个账号运营。经查明，2026年3月25日-3月26日，上海百事得电子有限公司在“罗技”账号发布含有“当我一降价，你还不是像狗一样跑过来”侮辱性内容的降价促销视频广告。</p>\n  <p>7月15日，罗技官方客服向记者表示，品牌方为带给用户不好的体验而致歉，此次为个别店铺账号的违规行为，品牌方已经介入处理并发布致歉声明，客服称将把采访予以转达。（南方都市报）</p>\n  <p><strong>长鑫科技：上市后仍将保持无实际控制人的控制权架构</strong></p>\n  <p>7月15日，长鑫科技科创板上市网上投资者交流会举行。长鑫科技副总裁、董事会秘书袁园在回复投资者提问时表示，公司上市后股权结构将进一步分散，前五大股东持股比例均不超过30%，不存在单一持股比例超过50%的股东；此外，公司已建立由股东会、董事会、各专门委员会和经营管理层组成的现代企业治理结构，董事会由11名成员构成，除4名独立董事外，7名非独立董事实际提名方为：清辉长鑫1席，长鑫集成1席，大基金二期2席，合肥集鑫1席，安徽省投1席，职工董事1席，无任何一名股东通过实际支配表决权能够决定长鑫科技董事会半数以上成员的选任，上市后公司预计仍将保持较为分散的董事会提名结构。因此，长鑫科技上市后仍将保持无实际控制人的控制权架构。（上证报）</p>\n  <p><strong>安踏品牌CEO徐阳将离职</strong></p>\n  <p>7月15日，界面新闻自安踏集团获悉，原安踏品牌CEO徐阳因家庭原因辞任该职，集团已批准并将另有任用。安踏集团执行董事、集团联席CEO赖世贤即日起将代理安踏品牌CEO一职，全面负责品牌日常经营与管理工作。（界面新闻）</p>\n  <p><strong>前高通自动驾驶工程副总裁将加入英伟达自动驾驶团队</strong></p>\n  <p>36氪独家获悉，英伟达自动驾驶团队近期发布内部信称，前高通自动驾驶工程副总裁Dheeraj Ahuja将加入吴新宙团队，而原英伟达自动驾驶软件副总裁，负责量产项目的Sarah Tariq则进入职务过渡期。近日，Sarah Tariq也发出了告别信。Dheeraj Ahuja和吴新宙都曾在高通任职，在过去七年多里，Dheeraj一直负责高通的自动驾驶项目，2021年底至2022年，高通成功击退英伟达和Mobileye，拿下了宝马下一代ADAS和自动驾驶平台的订单，Dheeraj正是该项目的直接工程负责人。</p>\n  <p><strong>香港证券市场下调最低上落价位第二阶段将于8月3日生效</strong></p>\n  <p>香港证券市场在第一阶段最低上落价位下调措施实施后取得积极成效。与实施前相比，适用股票的买卖价差收窄35%，订单成交时间缩短30%。在此基础上，香港交易所将于2026年8月3日推出第二阶段措施，进一步优化交易体验，支持香港证券市场持续发展。（证券时报）</p>\n  <p><strong>英国将对十六七岁青少年实施社媒“宵禁”</strong></p>\n  <p>英国政府7月14日宣布，将对16岁至17岁青少年使用社交媒体实施“宵禁”。这是英国政府继上月宣布将禁止16岁以下人群使用一系列社交媒体应用程序后新的社媒限制举措。英国政府表示，在默认设置状态下，16岁至17岁青少年在0时至6时不能使用社交媒体；旨在诱使用户更长时间浏览的功能，包括视频自动连续播放，也将默认关闭。英国政府6月表示，将效仿澳大利亚，禁止16岁以下人群使用一系列社交媒体应用程序。（新华社）</p>\n  <p><strong>美国FCC批准发射阳光反射卫星计划，为地球夜间区域提供应急照明</strong></p>\n  <p>美国联邦通信委员会（FCC）近日批准了一家初创企业的申请，允许其建造并发射一枚反光卫星，该卫星携带巨型聚酯薄膜（Mylar）反射镜，可将阳光反射回地球，为地球的夜间区域提供短暂应急照明。总部位于加利福尼亚州霍桑市的轨道反射公司（Reflect Orbital）于7月9日获得联邦通信委员会的许可。该企业计划发射一枚名为埃雅仁迪尔一号（Earendil-1）的试验卫星，并将其部署在近地轨道运行。（新浪财经）</p>\n  <p><strong>A股成交2.57万亿缩量1328亿</strong></p>\n  <p>7月15日，市场震荡调整，创业板指冲高回落跌超1%，科创50指数高开低走跌超4%。沪深两市成交额2.57万亿，较上一个交易日缩量1328亿。盘面上，市场热点较为杂乱，全市场超3300只个股上涨。</p>\n  <p>从板块来看，医药板块逆势活跃，博瑞医药、迪哲医药、睿智医药20CM涨停，哈药股份4连板，海南海药、昂利康涨停。白酒概念震荡走高，古井贡酒、金种子酒涨停。零售概念异动拉升，新华百货、宁波中百涨停。游戏概念表现活跃，巨人网络、恺英网络涨停。下跌方面，半导体产业链集体调整，存储芯片、算力芯片、半导体设备方向跌幅居前，德明利一字跌停，强一股份、华峰测控、佰维存储、沐曦股份均跌超11%。截至收盘，沪指跌0.29%，深成指跌0.97%，创业板指跌1.21%。（财联社）</p>\n  <p><strong>谷歌参与建设美国最大太阳能项目，总规模达2.5GW</strong></p>\n  <p>谷歌当地时间7月14日宣布，与Cypress Creek Energy在美国阿肯色州启动Steel River Energy Center项目建设。该项目建成后将成为美国最大的太阳能发电设施，也是谷歌全球规模最大的太阳能及储能项目。谷歌将作为锚定投资者和购电方支持项目一期和二期建设，新增1.6GW直流太阳能发电和1.9GWh储能；整个三期项目预计于2029年全部投运，总规模将达到2.5GW直流太阳能发电和2.9GWh储能。（界面新闻）</p>\n  <p><strong>中国日均生产芯片超15亿块</strong></p>\n  <p>今年上半年，规模以上高技术制造业增加值、数字产品制造业增加值分别增长13.3%和12.3%，比一季度都有所加快。特别是全球人工智能技术变革带来的高端算力芯片和存储芯片需求爆发。上半年中国规模以上工业企业的集成电路产量增长23.1%，产量规模达到2798亿块。国家统计局新闻发言人王冠华表示：“这个数字非常庞大，换算下来平均每天生产集成电路超过15亿块。集成电路就是我们平时说的芯片，它广泛应用于智能装备、电子产品当中。”除了集成电路，5G智能手机、3D打印设备、服务机器人等智能产品产量也保持了快速增长；日均词元调用量已达数百万亿，实现了量级式跨越。初步测算，上半年以高技术制造业、数字产品制造业为代表的新动能，以两成多的增加值占比贡献了近五成的工业增长，是拉动工业增长的重要引擎（央视财经）</p>\n  <p><strong>Meta遭员工起诉，被指利用AI系统筛选裁员对象，不公平针对休假员工</strong></p>\n  <p>26名Meta员工本周提起诉讼，指控该公司利用人工智能系统筛选裁员对象，尤其对正在休病假、育儿假或家庭照料假的员工产生了不公平的影响。诉状称，这套评分体系从设计层面就存在缺陷：处于受法律保护的病假、家庭照料假期，或是因身体残障导致工作产出下降的员工，根本无法积累充足评分。诉状还表示，Meta在核算员工评分时并未考虑员工享有的法定休假，也未按照法律要求暂停自动化系统，开展兼顾休假、特殊便利需求的人工单独复核。（新浪财经）</p>\n  <p><strong>印度宣布再投1.28万亿卢比，提升本土芯片制造能力</strong></p>\n  <p>7月15日，据报道，印度承诺再投入1.28万亿卢比（约合133亿美元）以促进国内芯片制造发展。报道称，此项举措将建立在印度2021年推出的100亿美元激励计划基础之上，该计划曾承诺承担半导体项目建设成本的一半。（界面新闻）</p>\n  <p><strong>Stripe与Advent据悉联合提出530亿美元收购PayPal</strong></p>\n  <p>7月15日，据报道，支付公司Stripe与私募股权公司Advent International本月早些时候联合提出以每股60.50美元收购PayPal，交易对PayPal估值超过530亿美元，较PayPal周二收盘价溢价约28%。据悉，该收购提议已获得银行约500亿美元融资承诺。（界面新闻）</p>\n  <p><strong>面壁智能端侧大模型将搭载三星手机上市</strong></p>\n  <p>36氪独家获悉，端侧大模型公司面壁智能已与三星手机达成合作，其自主研发的MiniCPM系列端侧模型将搭载于三星手机上市，覆盖数款旗舰机型。</p>\n  <p><strong>诺基亚与英伟达推出行业首个商用AI-RAN平台</strong></p>\n  <p>7月15日，诺基亚公司发表声明称，公司已与英伟达共同开发出业界首个商用人工智能驱动的无线接入网络（AI-RAN）平台。诺基亚表示，新的网络设备将使电信网络运营商到2028年能够在相同无线频段上传输的数据量翻倍，其预计将于明年上市。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，7月15日收盘，美股三大指数集体上涨，道指涨0.29%，纳指涨0.62%，标普500指数涨0.38%。大型科技股多数上涨，苹果涨超4%，谷歌、Meta、亚马逊涨超3%，微软涨超2%，英伟达小幅上涨；英特尔跌超4%，特斯拉小幅下跌。热门中概股普涨，腾讯控股涨超5%，阿里巴巴、哔哩哔哩涨超4%，小鹏集团涨超3%，唯品会、爱奇艺、理想汽车、拼多多涨超2%，百度、网易涨超1%。</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>越疆科技创业板IPO将于7月22日上会</strong></p>\n  <p>36氪获悉，据深交所网站披露，深交所上市审核委员会定于7月22日召开2026年第45次上市审核委员会审议会议，届时将审议深圳市越疆科技股份有限公司的首发事项。</p>\n  <p><strong>环能涡轮北交所IPO将于7月22日上会</strong></p>\n  <p>36氪获悉，据北交所网站披露，北交所上市审核委员会定于2026年7月22日上午9时召开2026年第69次上市审核委员会审议会议，届时将审议常州环能涡轮动力股份有限公司的首发事项。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>凯尔达：预计2026年半年度净利润同比增长1006%-1191%</strong></p>\n  <p>36氪获悉，凯尔达公告，预计2026年半年度归属于上市公司股东的净利润为2615.11万元-3053.38万元，同比增长1006%-1191%。业绩变动主要系公司产品竞争力提升、下游市场需求回暖，营业收入持续增长，同时股份支付费用同比下降。</p>\n  <p><strong>华联控股：预计2026年半年度净利润同比增长1030%-1423%</strong></p>\n  <p>36氪获悉，华联控股公告，预计2026年半年度归属于上市公司股东的净利润为2300万元-3100万元，同比增长1030%-1423%。业绩变动主要系杭州“钱塘公馆”项目房产销售收入增加及上年同期基数较低。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“问天量子”完成B轮融资</strong></p>\n  <p>36氪获悉，近日，“问天量子”完成B轮融资，获得6亿元资金注入，新进投资方包括海南晴澜、海南量启、淄博汇富齐嘉等多家机构。此次融资资金将主要用于核心技术的规模化商用、量子随机数芯片的量产扩能，以及面向人工智能时代的量子AI融合产品研发。</p>\n  <p><strong>“灵巧智能”完成数亿元A轮融资，上海电气战略入股</strong></p>\n  <p>近日，具身智能企业“灵巧智能”（DexRobot）宣布完成数亿元A轮融资，本轮由上海电气战略投资，产业资本与财务资本持续加码。2026年内，公司已先后完成天使轮及A轮两轮融资，融资资金将重点用于灵巧操作全栈技术研发、核心产品迭代、教育/电力/工业三大场景落地及产业生态建设。此外，上海电气旗下上海机电与灵巧智能同步成立两家合资公司——灵机壹动与灵机智联，总注册资本超亿元，分别聚焦核心零部件量产与工业场景解决方案，标志着公司从技术研发迈入产业规模化交付阶段。</p>\n  <p><strong>“面壁智能”完成新一轮融资，估值超200亿元</strong></p>\n  <p>36氪获悉，面壁智能已完成新一轮融资，投资方包括国家级基金、央企、汽车制造商等各类产业方、财务投资人等。至此，面壁智能2026上半年累计融资金额超50亿元，估值超200亿元，一跃成为端侧智能领域公开估值最大的独角兽企业。面壁智能专注于将原生端侧大模型技术转化为标准化产品，在具身、汽车、手机、低空、民航等核心赛道落地，未来还将拓展至工业、家居、特种领域等。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>三星电子推出新款990固态硬盘</strong></p>\n  <p>7月15日，三星电子宣布，新款990固态硬盘现已全球陆续上市，提供1TB、2TB两种容量版本。厂商建议零售价分别为269.99美元、529.99美元。（界面新闻）</p>\n  <p><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-07-15T23:59:41+00:00", "fetched_at": "2026-07-16T02:09:43.715760+00:00", "fingerprint": "a455fb354591e3b6"}, {"source": "36氪 - 最新文章", "title": "斯年智驾获3亿元C轮融资，自动驾驶重卡赛道再升温｜36氪独家", "url": "https://36kr.com/p/3895721094842249?f=rss", "summary": "<p>自动驾驶重卡赛道，今年显著升温。</p>\n  <p>36氪独家获悉，斯年智驾近日已完成 3 亿元 C 轮融资，由兴证资本、颐道资本联合投资，资金将主要用于新一代车规级自动驾驶方案研发。</p>\n  <p>2026年1-6月，该赛道公开披露的融资已达5起，累计金额近70亿人民币，IPO动作也非常密集。资本热的背后，自动驾驶重卡在商业化层面逐渐拥有清晰的落地答案。港口、矿山、钢铁等封闭场景逐渐对无人重卡形成稳定需求，干线物流等开放场景也伴随政策开始逐渐落地，进入规模化前夜。</p>\n  <p>斯年智驾成立于2020年4月，是一家专注于重载物流领域无人驾驶技术研发与落地的公司，提供港口、园区、干线等多场景的自动驾驶解决方案。</p>\n  <p>目前，斯年智驾的商业模式呈现多车型、多场景、多作业链路的特点。</p>\n  <p>在产品端，无人集卡、无人自卸车和无人平板车构成了斯年的主力阵容。支撑这些产品的，是其自研的一段式世界模型自动驾驶方案，以及域控制器、定位板卡在内的核心硬件。</p>\n  <p>落地模式上，斯年智驾提供两种方案：既可以直接卖整车，也可以提供运力服务。在封闭场景，公司已实现从传统集装箱港口、散杂货堆场，到钢厂、纸厂、铝厂、铁路站场和物流枢纽等场景的落地；在开放场景中，公司也已与部分物流公司和央国企达成合作。</p>\n  <p>封闭场景凭借其确定性优势，依然是自动驾驶重卡落地的核心阵地。</p>\n  <p>虽然车辆已实现全无人化运营，但在实际的物流作业中，装卸与甩挂等周边环节仍需人工介入，这给传统的物流运输模式带来了新的考验。</p>\n  <p>何贝对36氪表示，如何将局部的“无人运输”扩展为全局的“无人作业”，是公司接下来的重点之一。“横向运输的自动化已经实现，能不能引入世界模型和具身智能，对垂直运输及端侧协作进行一体化升级，最终达成封闭场景的完全无人化作业呢？未来3-5年应该会有一个答案”。</p>\n  <p>但何贝预测，开放场景未来将拥有更高的增速。所以本轮融资后，斯年智驾将推动自动驾驶重卡域控制器从非车规级到车规级的升级。</p>\n  <p>CEO何贝向36氪坦言，“域控制器才是无人驾驶的大脑”。在无人驾驶的产品链条中，处在执行端的车辆，无论是油门、刹车还是线控技术都已非常成熟，雷达、相机等传感器则更多只是采集端的工具，“到底能不能把车从有人变无人，其实所有软件都烧在了控制器上”。</p>\n  <p>“我们已经推出了车规级方案”，何贝告诉36氪，车规级标准非常具有挑战，“硬件、操作系统、中间件甚至是上层的软件模型板块都要重新调整和优化”。</p>\n  <p>相较于封闭场景，开放的干线物流场景，常面临长距离颠簸、宽温差波动及强电磁干扰等多重挑战，非车规器件故障风险骤增。从小规模测试迈向大规模商用，从封闭场景驶入开放道路，车规级是自动驾驶企业必须闯过的‘生死关隘’。</p>\n  <p>开放场景面临的挑战不仅有车规级。何贝告诉36氪，“开放场景的数据量比封闭场景要高1-2个量级，过去行业大多都在封闭场景落地，所以我们还有一个重点，就是积累更多数据、优化整个模型”。</p>\n  <p>在国内市场规模化的同时，斯年智驾海外业务也获得新进展。何贝告诉36氪，公司目前已获得某海外头部企业相关域控制器定点项目。</p>\n  <p>斯年智驾的C轮3亿，既是场景物流玩家的一次加注，也折射出这条赛道的共识：封闭场景做透基本盘，开放场景闯过车规关，才有资格谈下一个量级。</p>\n  <h3><strong>以下是斯年智驾CEO何贝与36氪的对话，在不改变原意的基础上，略经编辑：</strong></h3>\n  <p><strong>36氪：封闭场景接下来的重点会是什么？</strong></p>\n  <p><strong>何贝：</strong>怎么让无人运输变成无人作业。重卡只是一个运输工具，它不是装卸工具。从全流程而言，只有自动驾驶重卡，其实是缺了一环的。重卡承担的水平运输加上装卸服务一类的垂直运输，才能构成完整的作业流程。</p>\n  <p>我们现在很多场景，比如要甩挂，现在都是人摇的。那我们考虑的就是，之后是不是可以换成机器人来摇？再比如说，一些叉车吊车设备，是不是完全可以通过具身智能去实现无人化？我们想做的，是转运与装卸全流程的无人化。</p>\n  <p><strong>36氪：这套工作流，目前已经投入测试了吗？</strong></p>\n  <p><strong>何贝：</strong>正在测试研发阶段，还没有那么快，这件事难度很大，我觉得可能需要3-5年才会落地。相较无人驾驶用了10年才落地，无人化物流作业的时间已经很短了。</p>\n  <p>一方面，现在AI的发展，正在加速我们研发和落地的全流程。另一方面，人工确实越来越贵，现在国内很多环卫场景，其实无人化已经跑得比较靠前了，有些功能基本已经不用人了。，全无人化迟早有一天会发生。所以我们认为，晚干不如早干。</p>\n  <p><strong>36氪：所以现在人形机器人非常火热，斯年有相关规划吗？</strong></p>\n  <p>何贝：第一，我们不会去造机器人本体。第二，但我们的域控制器已经有具身智能公司的订单了。斯年的角色，更多是合作与链接。</p>\n  <p><strong>36氪：自动驾驶重卡公司现在的赛点是什么？</strong></p>\n  <p><strong>何贝：</strong>我觉得第一是品牌，现在不太可能会有新公司或者测试类场景出现，公司当前的名声，基本已经决定了客户是否会跟你合作。第二是数据，现在各家公司都在各个场景有自己的建树，那背后就是数据的优势。第三是算力和算力平台，包括上面的数据闭环和飞轮系统。这三点，我觉得是目前各家公司PK的关键。</p>\n  <p><strong>36氪：自动驾驶重卡公司想要盈利，难点在哪？</strong></p>\n  <p><strong>何贝：</strong>如果不算研发里面的毛利，我觉得各家公司都差不多，没有本质上的区别，核心在于你对三费的控制。</p>\n  <p>说白了，销售费用取决于你的业务做的怎么样，以及公司有多大的外围支持。研发费用则取决于你能不能很好地使用AI，以及公司内部产品化做得怎么样。我觉得这两点是限制公司盈利的关键。</p>\n  <p>自动驾驶重卡，其实也是属于汽车制造业圈子的。在中国制造业，利润空间很低，所以只能想办法去降低硬件成本、公司经营的成本。</p>\n  <p>我觉得这是在中国做制造业的Key Point。&nbsp;</p>\n  <p><strong>36氪：现在大家都在出海，对自动驾驶重卡公司而言，出海的意义是什么？</strong></p>\n  <p><strong>何贝：</strong>海外的首要意义，肯定是能挣到钱，但是海外的风险也是跟利润是成正比的。第一，如果价格卖不到国内的3-4倍，那你在海外也挣不到钱。第二，海外的限制非常多。什么地方需要无人？其实一定是发达国家，像欧美、澳洲、日韩，但他们受限于工会，推进速度没那么快。</p>\n  <p>中东、南亚、南美这些地区大部分都是发展中国家，这些地区的人工很便宜，所以他们用无人的唯一理由是提升效率。所以我们目前的订单，也主要集中在这些地区。</p>\n  <p><strong>36氪：无论乘用车还是商用车，自动驾驶公司正在密集IPO，今年是自动驾驶上市的最后一个窗口期吗？</strong></p>\n  <p><strong>何贝：是</strong>不是最后一个不好说，但我们预测到2027年下半年可能会收紧。整个行业肯定是起起伏伏的，就算明年收紧了，说不定后年也会打开。比起上市，我觉得做好业务更重要一点。&nbsp;</p>", "category": "tech", "published_at": "2026-07-16T00:00:00+00:00", "fetched_at": "2026-07-16T02:09:43.715752+00:00", "fingerprint": "2c964e34e439db28"}, {"source": "36氪 - 最新文章", "title": "众筹近400万美金，这家明星AI体育硬件公司做了款多合一教练机器人 ｜产品观察", "url": "https://36kr.com/p/3896586337978244?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>在首款网球发球机卖爆后，庞伯特做了一款多合一AI教练机器人 。</p>\n  <p>这家公司是在一级市场很受关注的标的，2025年半年内完成三轮融资累计数亿元；旗下产品也在全球拥有了30余万用户，设备累计发球总量超20亿次。</p>\n  <p>但当下硬件赛道已经不容小而美的公司慢慢成长，网球赛道涌入了越来越多的对手，国内硬件创业团队快速入局，海外老牌专业设备厂商也在加速占据全球专业市场。</p>\n  <p>庞伯特很早就有拓宽赛道的想法，直到今年5月，其首款多运动合一智能体育AI教练机器人Aura发布，完成了从网球场景的训练工具、到多运动AI教练机器人的落地。这款产品在Kickstarter上线当天，仅5小时众筹金额便超过100万美金，累计金额近400万美元。</p>\n  <p>它的核心思路很直接：与其让用户为每一项运动分别买单，不如用一台设备覆盖尽可能多的场景，包括时下热门的板式网球、匹克球等等。基于所搭载的AI Coach智能教练体系，拓宽产品适用场景与用户覆盖范围。</p>\n  <p>从单一专项的训练工具，到兼容多类隔网运动的AI私教，庞伯特Aura所代表的，是智能硬件从专业竞技赛道向大众运动场景的一次纵深延伸。当设备不再只为少数人的性能指标服务，才能真正还给用户自由开启一项新运动的选择权。</p>\n  <h2><strong>当AI Coach长出「手眼脑」</strong></h2>\n  <p>在庞伯特的产品矩阵中，Aura的定位有些特殊。</p>\n  <p>此前，其PACE系列面向深度爱好者，球速高达130km/h，追求极致的球速、旋转、落点精度等发球性能。而Aura整机仅7公斤，可放入背包随身携带，它所搭载的首创AI Coach智能教练体系，将目标用户锁定在更广谱的大众球类爱好者群体。</p>\n  <p>一位教练的日常教学是怎样的？用手喂球给学员，用眼观察学员的动作，实时指正学员的动作。每一次喂球，都伴随一次即时的反馈与调整。</p>\n  <p>不同于传统视觉分析方案中，设备只能在训练结束后生成报告，用户无法在过程中主动调整，Aura要做的，是完整复刻教练的现场教学——其AI Coach会实时指出问题，通过与用户的动态交互中持续观察、判断和调整发球，在每一次击球中完成指导闭环，而非停留于事后的动作分析。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_c4bb82b0c6c243999c5b719dd7da6478@6022551_oswg6668333oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>但跨球类适配的难度，并非仅算法层面就能解决，还需要平台级的硬件能力。&nbsp;</p>\n  <p>不同球类的物理参数差异极大。单是网球运动，就涵盖了有压比赛用球、无压训练球、适合青少年用户的75%气压软球、以及低龄训练使用的50%气压轻球等多种规格。匹克球亦存在16洞、24洞两种结构，洞数不同，球体重量、风阻系数和飞行轨迹便截然不同。</p>\n  <p>常规单一发球机的夹持与推送结构仅适配一类标准球体，一旦更换球型，就容易出现球体挤压变形、卡球、出球偏移等故障。要让一套送球、落球、击球模块在同时兼容这些物理差异，必须对发球机器人的硬件架构进行系统性重构。</p>\n  <p>在出球前，轮组系统会根据球种差异，调整夹持间距与加速方式。比如网球，需要更大的夹持力和更高的轮速才能产生足够的出球速度和旋转；而匹克球更轻、风阻更大，则自动调整为对应标定参数。</p>\n  <p>“多合一设备的技术门槛并不仅在于‘能否把球发出去’，真正决定产品可用价值的核心难点，是针对不同球体，机器人对出球轨迹与旋转力度的可控性。”庞伯特创始人兼CEO张海波告诉硬氪。</p>\n  <p>由于各类球体的空气动力学特性完全独立，一套通用机械结构无法共用同一套运动参数，因此，团队还必须针对各细分球型搭建独立控制模型，以保证用户在切换运动后依旧拥有稳定、可控的训练手感。</p>\n  <p>如果说多合一发球和供球系统是Aura的“手”，作为执行终端负责精准可控地完成多品类发球，那其AI Coach的能力则建立在视觉感知与算法决策两个层面。“眼”负责捕捉每一次挥拍与球的轨迹，“脑”负责分析数据并给出训练建议。</p>\n  <p>Aura搭载了一个可拆卸的120fps双摄视觉模块Spotter，拥有10Tops端侧算力，配合语言、语音大模型，通过Spotter视觉感知与庞伯特体育大脑深度融合，实现“会看、会想、会指导”。</p>\n  <p>不同于以视觉分析为核心的方案，通过摄像头捕捉用户挥拍动作，生成训练报告与改进建议，它的优势是部署灵活、不依赖特定硬件，但其能力边界也很清晰，无法主动介入训练进程。Aura教练机器人的分野在于，前者从“分析动作”切入，后者从“发起练习”开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_e799c56e33004725a0672047c2f48f68@6022551_oswg7043130oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>基于庞伯特后端的“体育大模型”，背后是其“手-眼-脑”一体化技术架构的完整落地。系统不仅会记录下“球打到了哪里”，还能解析“为什么打到那里”，比如引拍慢了半拍？击球点偏外了？重心转移没跟上？</p>\n  <p>这些判断以语音即时提醒的交互形式，可在击球后实时反馈给用户并给出调整反馈，并驱动发球机器人调整下一组发球策略。在张海波看来，真正的教学必须从“喂球”起步，在动态交互中观察、判断、调整，而非停留在事后的动作分析层面。</p>\n  <p>同时，AI教练的进化同样依赖于高质量数据，这套完整训练闭环将进一步构成独特数据壁垒。庞伯特方面预计，Aura上市后每年可采集超过500万小时有效的高质量运动交互数据飞轮。</p>\n  <h2><strong>从专业化到多合一</strong></h2>\n  <p>作为全球首款提出多运动合一的AI教练机器人，面向大众球类运动爱好者，Aura在产品定义阶段就曾面临不小的争议。张海波向硬氪回忆，彼时团队内部的分歧很直接：“多合一会让用户觉得你什么都做，什么都不专业。”外部合作伙伴和投资机构也表达了类似的疑虑。</p>\n  <p>但他始终没有动摇，这个决策背后源于两重考量。</p>\n  <p>传统体育产品逻辑是“先选定运动、再购买设备”，这恰恰是初学者长期被忽略的核心痛点。在他们还没确定自己的运动偏好时，就得为单一运动支付整套设备成本。</p>\n  <p>根据PPA、Monitor Deloitte等行业调查显示，<strong>匹克球在北美以每年超过30%的增速，成为增长最快的运动之一；板式网球在欧洲的球场数量过去五年翻了近三倍；而网球本身仍是全球参与人数最高的球拍类运动。</strong></p>\n  <p>这三项运动在规则与场地上的相似性，决定了它们的初学人群存在大量重叠。</p>\n  <p>Aura的解决方案是，设备本身兼容三种球，用户按需解锁。“你不必在购买设备之前就做出决定。先用网球入门，哪天想试试匹克球了，在App里支付对应的订阅费用就能解锁。对用户而言，用一次日常体验课相当的花销，就能去尝试自己对另一项运动的兴趣。”张海波说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_1e6063ee328a415fa404dd9a197446f6@6022551_oswg6817991oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>上线结果也印证了他的判断。张海波告诉硬氪，下单用户中，基本全部用户选择了带AI教练功能的版本，选择多运动合一的用户占比也超过一半。</p>\n  <p>这其实是消费心理里一种典型的“价值感知”逻辑：多合一功能未必被高频使用，但它的存在本身放大了用户对产品性价比的判断，降低了首次购买的决策门槛。</p>\n  <p>“它是一个信号，多合一功能意味着用一台设备的成本，享有多种运动的服务，性价比优势不言而喻。”张海波补充道。“用户希望拥有这个可能性，哪怕当下用不上。”</p>\n  <p>而从商业化角度看，对于创业公司来说，多合一功能也是个更具性价比的选择。</p>\n  <p>Aura的策略是把核心机械平台做通用，只在轮组调节和算法参数层面做差异化适配。用单个SKU覆盖网球、匹克球、板式网球等多个品类，供应链物料复用程度更高、生产效率和成本管控更优；而它触达的用户群体，从单一运动人群扩展到了三个重叠度极高的运动人群。</p>\n  <p>标准化设备是硬件入口，真正的价值锚点也进一步向软件定义的运动体验渗透。庞伯特用户可以选择购买单运动版本，后续想解锁匹克球或板式网球，通过App内按月或按年付费即可。</p>\n  <p>这种“硬件平价、软件增值”的模式过去在消费电子领域已被验证，但在智能化AI运动硬件行业仍属少数。它更深层意图的意图在于，先用一套硬件和一套数据系统把用户留在自己的生态里。</p>\n  <p>“用户今天用Aura学网球，数据积累在庞伯特的系统里；三个月后想试试匹克球，不需要再买一台机器，只需在软件端完成一次付费解锁。设备没换，用户没流失，数据还在持续生长。”张海波说。</p>\n  <p>用户想要的不是功能堆叠，而是一个能在动态训练中持续陪伴、实时反馈的“真实存在”。它是一种更具体的需求。庞伯特试图在构建一个越用越聪明的AI教练网络，真正将“数据×算法×硬件×场景”融合并落地为消费级产品。</p>\n  <p>硬件是入口，用户是资产，数据是壁垒，三者闭环一旦形成，对庞伯特而言，真正的护城河就不再是那一台设备，而是一套持续进化的训练系统。Aura要做的，是实时指导的教练，多合一的运动，它从硬件层面重新思考了“一台设备到底能覆盖多少场景”，又用软件和数据把不同场景串联起来，形成一个可扩展的体系。当用户用得越久，系统就越懂TA。</p>\n  <p>这个思路未必是唯一的答案，但它提供了一个被讨论样本：在运动器材这个行业里，让初学者能实现低成本的跨运动切换——并在尝试的过程中，让系统记下每一次挥拍。</p>", "category": "tech", "published_at": "2026-07-16T01:30:00+00:00", "fetched_at": "2026-07-16T02:09:43.715738+00:00", "fingerprint": "8ab0f8b2eba79b0e"}, {"source": "少数派", "title": "角落新声｜从桌面「长」出来的创业空间，我靠这些好物「偷」一点清闲", "url": "https://sspai.com/post/112243", "summary": "编者按：本文是「角落新声」征文活动的入围文章。本次主题征文由声擎冠名，邀你前来分享那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅。8月7日前投稿参与，即有机会获得声擎Cyber5 ...<a href=\"https://sspai.com/post/112243\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T03:00:00+00:00", "fetched_at": "2026-07-16T02:09:42.301241+00:00", "fingerprint": "3a8f8c0212e0c9b2"}, {"source": "少数派", "title": "具透 | iPadOS 27 首个公开测试版中你不容错过的 12 个新特性", "url": "https://sspai.com/post/112338", "summary": "升级到 iPadOS 27 以后，不妨试试这些新功能……<a href=\"https://sspai.com/post/112338\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T07:00:00+00:00", "fetched_at": "2026-07-16T02:09:42.301235+00:00", "fingerprint": "0e03b63137335fd6"}, {"source": "少数派", "title": "Leitra 诞生记：一次未完成的实践", "url": "https://sspai.com/post/112077", "summary": "Leitra 的名字来自我最欣赏的摄影师索尔·雷特（Saul Leiter）。它是一款为数码照片生成接触样张（Contact Sheet）和图像序列的策展工具，受到马格南摄影师创作方式的启发，关注图像之间的停顿与联系，也探索面向未来、与现实互动的创作方式。<a href=\"https://sspai.com/post/112077\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T09:00:00+00:00", "fetched_at": "2026-07-16T02:09:42.301229+00:00", "fingerprint": "038730ac45e91e11"}, {"source": "少数派", "title": "派早报：国行版 Apple Intelligence 完成备案等", "url": "https://sspai.com/post/112373", "summary": "阿里发布实时语音模型 Qwen-Audio-3.0-Realtime、腾龙发布 12-20mm F2.8 镜头等。<a href=\"https://sspai.com/post/112373\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-16T00:22:40+00:00", "fetched_at": "2026-07-16T02:09:42.301218+00:00", "fingerprint": "52ef4304d9d23c40"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7302 CNY ↑+0.49%", "url": "https://www.frankfurter.app/2026-07-15?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-07-15</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7302 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0232 (+0.49%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-07-16T02:09:41.234085+00:00", "fingerprint": "e2abde29286545c5"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
