  }
  header {

    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);

  header h1 { margin: 0; font-size: 18px; font-weight: 600; }

  header button {

    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }

    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;

  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }

    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

t": "2026-07-10T02:35:18.197079+00:00", "fingerprint": "5a913592dd449ea0"}, {"source": "36氪 - 最新文章", "title": "2026·Under36丨绕过旧答案的一代人", "url": "https://36kr.com/p/3888279614274048?f=rss", "summary": "<p>为什么颠覆性的突破总是由年轻人完成？</p>\n  <p>因为他们还没有被旧范式驯服。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f03cb1b75955471cb9807dccd1cb6038@5352461_oswg269oswg900oswg80_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>几乎所有开创一种新范式、完成根本性发明的人，都有某种相似之处：<strong>他们要么足够年轻，要么刚刚进入那个即将被他们改写的领域。</strong></p>\n  <p>1962年，科学哲学家托马斯·库恩在《科学革命的结构》中留下了这个观察。他当时谈论的是物理科学：哥白尼提出日心说时不到四十岁，牛顿发明微积分时二十三岁，爱因斯坦发表狭义相对论时二十六岁。</p>\n  <p>而库恩试图回答的问题是，<strong>为什么颠覆性的突破总是由年轻人完成？答案是简单而残酷的，因为他们还没有被旧范式驯服。</strong></p>\n  <p>在整理完2026年度Under 36入选者的资料之后，我们很难不想起这个判断：新的范式不靠说服旧的人，而是靠一代新人改写。</p>\n  <p>无法否认的是，商业叙事的聚光灯，从那些“看到缝隙的人”转向了“掌握技术的人”。</p>\n  <p>曾经的商业武器是直觉、速度和对用户痛点的嗅觉。他们依旧有效，但另一套创业语法已经覆盖上来。现在，越来越多人带着论文、模型、实验数据、硬件图纸和产业客户进入牌桌。<strong>创业不再只是商业嗅觉的竞技，也变成知识结构的迁移速度之战。</strong></p>\n  <p>而他们中的大多数刚好足够年轻。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_67b7fad249fd480ab41b7c8cf96a0e28@5352461_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>坍塌的商业时差</strong></p>\n  <p><strong>总是奖励年轻人</strong></p>\n  <p>学术训练与创业之间的时间差正在被急剧压缩。十年前一个科学家想创业，常见路径是读完博士、做几年博后、在大公司历练一段，四十岁前后下海。</p>\n  <p><strong>这条路径正在被重写。</strong>曾经需要经过漫长翻译的“论文”们，现在可以被迅速商业转化。Kimi的杨植麟发表的论文成果，直接塑造了后来大语言模型的技术走向。无问芯穹的夏立雪连续五年评为斯坦福全球学科Top 2%科学家。深势科技的张林峰用AI改写了分子动力学模拟的效率上限。</p>\n  <p>这是一种更紧张的创业环境。它奖励年轻人，也惩罚年轻人。有人博士在读时创业，有人读到一半离开，有人本科毕业直接开干。而被奖励的人里，姜哲源在清华读博期间退学，创办松延动力，他造的消费级人形机器人后来登上了央视春晚。尚阳星从南方科技大学以休学身份出来创业，27岁，桥介数物成立第一年便盈利。最年轻的入选者陈源培今年23岁，他的灵初智能在做通用灵巧操作智能体，大多数同龄人还在准备开题的年纪。</p>\n  <p>名单上同样有36岁踩线入选的面孔。梅卡曼德的邵天兰27岁从德国回来，花了九年，产品覆盖50多个国家，国内市占率连续五年居首。利氪科技的惠志峰在线控底盘上扎了四年，做成了90后独角兽。宇树科技的王兴兴把机器人从极客圈层带到更大众的视野，也经历了多年硬件、供应链和工程能力的堆叠。</p>\n  <p><strong>年轻可以是一种年龄，也可以是一种位置。</strong>你可以36岁，可以在一个行业里做了十年，仍然保持对旧共识的警觉。足够年轻和足够久，在技术密集型创业中并不冲突。前者让人敢于偏离路径，后者让人拥有把偏离路径做成产品的耐心。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f27e4fa398d24e87b9f69ec61c2b12b8@5352461_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>同一个方向，一千条岔路</strong></p>\n  <p>对入选创业者和科创者的技术方向做一次分类，结论并不出人意料。超过50人的入局领域与AI或机器人直接相关。</p>\n  <p><strong>但集中是表象。表象之下是剧烈的分化。</strong></p>\n  <p>做具身智能的人很多，每个人选择的位置截然不同。喻超的鹿明机器人赌的是数据，他自研的采集系统把单条采集时间从50秒压到10秒，成本降至传统方案的五分之一。陈万楷的泉智博走的是关节模组的规模化量产，在上游供应链一个不起眼但极关键的生态位站稳了，三年六轮融资，年出货十万台。许晋诚的帕西尼从触觉传感切入，手指内嵌微型传感器的仿生灵巧手在汉诺威工博会上大放异彩。三家企业或许都属于具身智能的标签，但技术路线和商业逻辑之间几乎不存在交集。</p>\n  <p>AI应用侧的光谱，发散更甚。拿到了雷军和京东投资的胡宇航，创立的首形科技核心是打造一颗能表达情绪的仿生人脸。把AI嵌进了Meme文化和社交游戏的张锏，他手中的Rezona四个月周活破150万。而秦宇迪的链宇科技做的是车网互动和AI能源调度，服务对象是国家电网和南方电网。它们唯一的共同点是都可以被归类为AI公司。</p>\n  <p>所有人涌入了同一片森林。但无数岔路并不完全相同。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f386c7fd35ee48ed87b9da3d4320adfe@5352461_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>AI之外，水位同样在上涨</strong></p>\n  <p>AI的声浪太大，容易让人误以为所有机会都被它吞没。但翻到名单的另一侧，会看到另一种更慢，也更接近产业腹地的创业样本。</p>\n  <p>它们面对的不是流量和传播，而是临床试验、产线良率、车规验证、全球专利和客户认证。年轻创业者正在从互联网叙事，转向医疗器械、生命科学、新材料、量子计算和商业航天这样的深水区。</p>\n  <p>医疗健康是最典型的战场。帕母医疗的Cynthia Chen带领企业推进全球首创PADN系统，公司已取得七项FDA认证，并在全球超过60个国家构建专利布局。阶梯医疗的李雪切入微创植入式脑机接口，达普生物的许潇楠则用AI驱动的高通量微流控技术服务药物发现。方向不同，但都是在把高门槛技术推进真实医疗和科研体系。</p>\n  <p>新能源、新材料、量子计算，这些高精尖的硬科技领域也出现了年轻创业者的身影。就算是离大规模商业化仍然遥远的量子计算，也有太一量生的方正浩和华翊量子的赵文定在押注不同方向。也正因为遥远，才需要有人提前进入荒地。</p>\n  <p>还有陈金尧。影石Insta360在2025年完成IPO，海外收入占比超过70%。他的存在提醒人们，技术创业并不只有模型和实验室，也包括产品定义、供应链管理和全球市场能力。</p>\n  <p><strong>AI之外并没有退潮。只是潮水的形态变了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_0e51ac71410245debe0fd7d94ea82056@5352461_oswg8047oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>桌子对面也换人了</strong></p>\n  <p>桌子对面，也换人了。</p>\n  <p>入选U36投资人，平均年龄34.4岁。34.4岁的平均值藏着一条暗线，按通常的入行节点推算，这批人大约在24、25岁开始看项目，到今天已走过十年上下。十年是一个完整募投管退周期的长度，也是一个产业换轨的维度。</p>\n  <p><strong>AI和硬科技给了年轻投资人一次加速上桌的机会。</strong>红杉中国的公元，代表案例包括蓝箭航天、无问芯穹、梅卡曼德；高瓴创投的严文韬，投过字节跳动、小红书、Minimax；云九资本的沈文杰，聚焦壁仞科技、云脉芯联等底层计算与半导体方向；襄禾资本的王晗宇，同时有快手、星动纪元等等组合。</p>\n  <p>这些名字放在一起，几乎可以拼出过去几年中国一级市场的几条主线。AI基础设施、具身智能、半导体、商业航天、智能汽车、新药和平台型科技公司。押中这些标的的人，正在从机构内部“被培养的年轻人”，变成真正参与定价和判断的人。</p>\n  <p>而更年轻的一批人，也在提前进入决策链。他们还没有走完很多个市场周期，却已经被推到更复杂的位置上。原因并不难理解。当创业者越来越年轻、越来越技术化，投资机构需要能和25岁的博士创始人在技术细节上直接对话的人，而这种能力的养成路径和传统的投资人培训体系并不重合。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_decfabcac1d041ac88660b51c6a85893@5352461_oswg9762oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>一些有趣的数字</strong></p>\n  <p>本届Under 36合计108位入选者，涵盖创业者、科创者与投资人各36位。整体平均年龄约33岁。最年轻入选者为灵初智能的陈源培，23岁。科创者群体均龄最低（31.8岁），投资人最高（34.4岁）。</p>\n  <p>学历分布上，博士及博士在读占创业者与科创者总人数的过半，这一比例在Under 36历史上前所未有。清华大学以15人居首，哥伦比亚大学、香港科技大学紧随其后。</p>\n  <p>技术方向上，AI与机器人合计覆盖超过七成入选者。其余方向散布在新能源、医疗健康、量子计算与智能汽车等板块。</p>\n  <p>接近半数入选公司在业务中涉及海外市场或全球化布局。在智能涌现之前，“本土还是全球”尚且是一道选择题；到2026年，对于做硬技术的创业公司而言，这更像一种默认设定。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_ffaec3ea44214a2ba50990f9d0ffe403@5352461_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>库恩论证的过程里，引用过普朗克的一个观点。</p>\n  <p><strong>“新的科学真理并不总是通过说服旧世界获胜。很多时候，它只是等到旧世界慢慢退场，等一代熟悉新规则的人长大。对他们来说，那不再是革命，只是日常。”</strong></p>\n  <p>真正的范式迁移就是这样完成的，安静地，以一种当事人不自知的速度。这份名单上的108个人，此刻大概也是如此。</p>\n  <p>值此时刻，暗涌Waves 2026年度 36 Under 36 名册，正式发布。完整名单如下：</p>\n  <p>排序按创业者、科创者、投资人</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_9500914c17b1490fa5fad6c7fd3abd42@5352461_oswg1891646oswg1080oswg2764_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_a4ed948f285b42f68d479b31bda4d755@5352461_oswg1625701oswg1080oswg2595_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_50972c8b5e6f450abe8f92ebc6275aec@5352461_oswg1650955oswg1080oswg2667_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_661a6cb3754e4d579aeca0110920f77a@5352461_oswg1914925oswg1080oswg2757_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_d3aa5a7fa9e043c3a70ec1f95e4fa100@5352461_oswg1611883oswg1080oswg2581_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_05b21fdf4eba465b9791cecacff54720@5352461_oswg1669628oswg1080oswg2684_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_ecf994a926fe4a81a212fc6ab753789b@5352461_oswg2051844oswg1080oswg2766_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_72fdea0fa108474589dddc447814e57b@5352461_oswg1769970oswg1080oswg2594_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_4128f11e22ba466fa736c47b4ecaac4a@5352461_oswg1777286oswg1080oswg2668_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_8e9b966722c54242b82d16a577584d17@5352461_oswg4950oswg1080oswg72_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-07-09T10:45:37+00:00", "fetched_at": "2026-07-10T02:35:18.108110+00:00", "fingerprint": "287941bc24009bd8"}, {"source": "36氪 - 最新文章", "title": "2026年度「中国股权投资行业投资机构」系列名册正式发布", "url": "https://36kr.com/p/3888289009678854?f=rss", "summary": "<p>Alpha will be made, not found。</p>\n  <p>麦肯锡在2026年初发布的全球私募市场报告中给出了一个精准的判断。Alpha（超额收益）不再是找到的，而是做出来的。持续走低的利率、不断膨胀的估值倍数、唾手可得的廉价融资，这些放大利润的旧杠杆们，在过去十年间逐一消失。以至于，全球封闭式PE募资在2025年同比下滑17%，亚太地区的跌幅接近一半。</p>\n  <p>中国市场的故事更加复杂。钱的源头变了，美元基金退潮之后，国资和产业资本接过了定价权，也接过了游戏规则的书写权。退出的通道也变了，PPT里的“多元化退出策略”，变成了真实发生的交易（至少是一部分GP不得不学会的新手艺）。</p>\n  <p>与此同时，主线变了。<strong>一级市场关于人工智能的叙事，已悄然完成了一次逻辑的更替。</strong></p>\n  <p>2025年，仅具身智能一个方向就吸纳了超过656亿元融资，涌入了近千家公司。更长期看，硬科技在VC投资中的占比五年内从38%攀升至62%。毫无疑问，资本的重心正在沿着技术栈向下游迁移。AI不再是众多赛道之一。它正在以一种几乎不可逆的方式，横切进几乎所有行业的毛细血管。</p>\n  <p><strong>旧秩序松动了，但新秩序尚未落定。</strong></p>\n  <p>过去一年里，我们看到一些从产业腹地生长出来的新机构，以出人意料的速度完成了第一期基金的募集与部署，它们不讲宏大叙事，只做自己看得懂的事情，反而赢得了市场的信任。我们也看到一些老牌机构在AI面前完成了一次认知上的急转弯，重新理解自己过去十年积累的产业资源在新范式下意味着什么。</p>\n  <p>当然，也有一些曾经耳熟能详的名字正在变得安静。沉默不等于出局，但市场的注意力是诚实的。</p>\n  <p>这种中间状态比单纯的寒冬更考验人。而可以确定的是，<strong>时间不再自动站在任何人一边。它只奖励那些真正理解自己在做什么的人。</strong></p>\n  <p>这份名册试图记录的，就是他们。值此时刻，暗涌Waves 2026年度“中国股权投资行业投资机构”系列名册，正式发布。详情请见：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_18c2d7a02a07434f934935bbd539d407@5352461_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>投资人名册</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_9a00baa18728408ba51285e0046e7b0e@5352461_oswg452506oswg1080oswg2022_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_a40ccabcba6647a9bdc94002e6fa79d0@5352461_oswg496515oswg1080oswg2092_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国最受创业者欢迎投资人 TOP100</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_e902a469bf974b18a88c47de55e10d89@5352461_oswg441583oswg1080oswg1756_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>2025-2026年度最活跃投资人 TOP30</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f2ce11b5bc28405797b633133ceb88a0@5352461_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>投资机构名册</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_49c3e56f3b6c499c9dfc63f3ac1a468d@5352461_oswg201209oswg1080oswg1584_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国股权投资行业早期投资机构 TOP50</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_2181ab829def48858b40386ede4b189c@5352461_oswg1330060oswg1080oswg2544_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国股权投资行业创业投资机构 TOP100</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_816166fafc8d46a792e2a2f077eb93f6@5352461_oswg202742oswg1080oswg1584_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国股权投资行业私募股权投资机构 TOP50</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_3ccd5e3313ee4643a0ff71f69a2f8905@5352461_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>年度最具影响力/成长力名册</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_24eda4ef4caa4e85aac86a3dd91425be@5352461_oswg129469oswg1080oswg1363_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国最具影响力早期投资机构 TOP10</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_0d01eb76c93b4988af3fb398433a05a2@5352461_oswg235716oswg1080oswg1363_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国最具影响力创业投资机构 TOP10</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_ca4a66d99a6a479cad04e51223d88e93@5352461_oswg132681oswg1080oswg1363_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国最具影响力私募股权投资机构 TOP10</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_3f08e5fd1f8e4968bd8cdd93e3214657@5352461_oswg131540oswg1080oswg1363_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>中国最具成长力股权投资机构 TOP10</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_37b6d89f46484cee8cd153652141946d@5352461_oswg4950oswg1080oswg72_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-07-09T10:53:27+00:00", "fetched_at": "2026-07-10T02:35:18.108104+00:00", "fingerprint": "dd5b4405106b71e9"}, {"source": "36氪 - 最新文章", "title": "万勋科技发布“柔韧充”自动充电通用服务引擎，以“0.000s无极容差应变”首创混沌服务、全类通解！", "url": "https://36kr.com/p/3888567864851204?f=rss", "summary": "<p>7月9日，万勋科技于北京举办自动充电机器人业务战略发布会，重磅推出行业首个以 “混沌服务” 模式全面覆盖公用、专用、家用所有应用类别的 “柔韧充” 自动充电通用服务引擎及其核心产品。其独一无二的 “0.000s 无极容差应变” 技术特性，在同期发布的三大类别 “全球首例” 应用成果中得到充分展现，正式为行业带来彻底击穿自动充电各场景规模商用核心困局的通用解法。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_80fcf079e0c54966a43e8a606331ae20@5284654_oswg1439272oswg1850oswg1011_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">0.000S 无机容差应变</p>\n  <h2>瞬息万变的混沌不确定性，为自动充电场景带来 “反应速度” 核心挑战&nbsp;</h2>\n  <p>目前，自动充电演示和概念产品层出不穷，但距真正规模商用始终一步之遥。其核心原因在于，从精准控制的演示环节走向真实而复杂的落地应用时，这不再是一个 “把插头对准插座” 的简单表演，而是一个典型的高不确定性、低可控度的 “现实混沌” 场景作业 —— 室内室外、雨雪风霜、昼夜变换与灯光闪烁等，带来环境的混沌与不确定；成百上千的品牌、车型、充电桩型号，相互各异的充电口位置、开盖方式和插口标准等，构成海量且动态增长的 “非标准物体组合”；个体车辆停放的角度、距离、倾斜度次次不同，充电时的人员上下车、行人与宠物的经过、邻车的突然开门或倒车等，使场景内充满了完全无序的动态干扰。 而在进入专用、家用和公用三大类商业运行环境时，自动充电场景的 “混沌不确定性” 又各具挑战：专用充电需求如无人重卡、无人矿卡、无人 bus 等使用习惯相对可控，但往往面对恶劣多变的使用环境；家用充电多对应特定品牌和车型，但运行环境和个体使用习惯则千差万别、难以预料；��具挑战的可能是公用自动充电，叠加了个人车主、运营车辆、robotaxi、无人物流、政府测试等特点迥异的使用群体，现场情况变化与作业复杂度更成几何级数增长，最终彻底超出任何精度与算力堆叠所能覆盖的能力区间。</p>\n  <p>这些海量发生、瞬息万变的现实混沌，最终体现为规模商用必须克服的四大红线和 “反应速度” 核心挑战 —— 安全交互，任何时候绝不能伤人、伤车或伤充电口；高容差率，不论环境和使用如何瞬时变化，均需同时保证作业的可靠性、稳定性和成功率；环境防护，在各类恶劣甚至极端环境下均能稳定工作；易部署易维护，彻底告别高昂的改造成本和意外锁死 —— 这也就决定了真正能规模商用的自动充电机器人，其感知能力、控制能力和决策能力都必须具备近乎于零延时的超高反应速度和极其强大的适应性，从而在复杂作业场景和环境因素下依然保证系统的稳定性，确保作业安全与成功。</p>\n  <p>&nbsp;</p>\n  <h2>0.000s 无极容差应变，通用服务引擎实现 “混沌服务、全类通解”</h2>\n  <p>面对自动充电场景天然的混沌不确定性与对外部环境交互 “反应速度” 的极致要求，万勋科技本次重磅发布的 “柔韧充” 自动充电通用服务引擎，依托 Pliabot® 柔韧具身架构的仿生柔性结构、基于自适应的被动柔性和神经元多模态 AI 等技术特性，实现了行业独有的 0.000s 无极容差应变，真正满足了针对环境混沌、海量非标组合物及无序动态干扰的超快反应要求，从而开辟了衍变无极、随物赋形的全新 “混沌服务” 模式。这一升维破局，不仅完美跨越了安全、容差、环境、部署四大规模商用红线，更得以用同一套技术路线和有限数量的核心产品，轻松覆盖自动充电所有应用类别与细分场景。</p>\n  <p>0.000s 无极容差应变的背后，是万勋科技世界领先的柔韧具身智能在绝对安全性与任务适应性方面的断崖式独占优势。传统技术路线中，基于刚性电机关节的具身智能架构建立在精密机械传动的精确性基础之上，对 “感知 - 识别 - 推理 - 执行” 全链路均提出极高要求，更让快速响应任务过程中的实时变化和安全低成本难以兼顾 —— 针对充电插拔这个 1-2 秒内就完成的瞬态作业，机器人纵有足够精确的事前轨迹规划，实际作业中无可避免的各种随机力场扰动依然会导致每次动作各不相同、必须不断实时适应和调整；而刚性智能架构从感知力变化到完成推理、再到形成动作执行所需的 “百毫秒级全链路反射弧”，在瞬息万变的现实混沌中，难免陷入 “反应不过来” 导致的插不进���卡枪、夹手等一系列困境。 相比之下，“柔韧充” 自动充电通用服务引擎采用具有材料柔性和气体可压缩性等多重柔性的仿生肌肉柔性结构，具备轻、柔、碰撞安全的基于自适应的被动柔性，及低 AI 成本、多场景可快速落地的神经元多模态 AI，以 “本体柔性 + 实时分布式智能轨迹生成” 双螺旋反应机制，将第一交互触点的反应速度降低至 0.000 秒，真正实现衍变无极、随物赋形的实时应变作业。</p>\n  <p>以该引擎为驱动，万勋科技已推出固定式 CF1、滑动式 CS1 等覆盖公用、专用和家用自动充电全部三大类别的核心产品及解决方案，并已快速完成诸多头部客户从单点演示到无人码头、矿区、Robotaxi、Robobus、高端商业和家庭使用等多种落地应用需求。目前，万勋科技正以 “无人化智驾场景全覆盖” 为自动充电业务线的战略目标，与主机厂、场站运营商、能源基建厂商、无人化运营商、地方政府等伙伴深度合作，加速推动全类别全场景解决方案落地，助力各行业客户实现其无人化运营愿景。</p>\n  <p>&nbsp;</p>\n  <h2>挑战行业最极限，三项 “全球首例” 尽显通用服务引擎颠覆性优势</h2>\n  <p>在本次发布会上，万勋科技面向公用、专用和家用三大类别，针对性发布了基于 “柔韧充” 自动充电通用服务引擎的三项 “全球首例” 最新产品 / 应用，以无可辩驳的商业落地成果，尽显 “混沌服务、全类通解” 的颠覆性优势： 【公用】130 + 车型与 300 万次服务，全球首个公共自动充电场站。 公共自动充电面对的是成百上千且不断增长的不同品牌与车型、千差万别的车主群体与使用习惯，以及昼夜变换、雨雪风霜等随机环境变量，其极端海量变化堪称自动充电场景 “皇冠上的明珠”。本次，万勋科技于北京发布的亦庄国际生物医药园自动充电场站，基于 “柔韧充” 自动充电通用服务引擎打造，是全球首个向全社会开放且不限品牌和车型的全天候商业运营自动充电场站，其核心解决方案已成功适配服务 130 余款各品牌车型、累计完成 300 万次验证服务。目前，该场站不仅已无差别开放给广大个人车主自由体验，更积极与政府、车企、Robotaxi 及无人物流企业等对接合作，赋能无人化运营与智慧出行加速落地。</p>\n  <p>【专用】5190 米和 52.9% 标准大气压下，全球首次极限场景自动充电。 矿区、港口、公交场站等专用场景往往面对恶劣多变或混杂的使用环境，特别是在高海拔、低气压等极端条件下，传统方案极易因传感器失灵而失效。日前，万勋科技将其自动充电产品首次送上海拔 5190 米和 52.9% 标准大气压的雪域高原，凭借 “混沌服务” 特性及仿生柔韧材料高环境耐受性成功完成多科目自动充电作业测试，成为全球首个在高海拔极限场景下完成稳定作业的自动充电机器人案例，不仅刷新了行业的环境耐受极限，更以征服高原禁区严酷工况的能力冗余，对所有常规、恶劣工况形成无可匹敌的降维兼容，为各类专用补能需求提供了真正一劳永逸的通解方案。</p>\n  <p>【家用】18 自由度 10 厘米超薄，全球首款与特斯拉联通打通的家用自动充电机器人。 家用自动充电早已在众多车主心中 “种草”，但实际落地需面对安装空间有限、使用习惯多变、意外因素繁多等家用场景挑战。在本次发布会上，万勋科技首次正式披露了全球首款与特斯拉车机系统联通打通的自动充电机器人，基于柔韧技术轻松实现 18 个自由度，具备不伤车、不夹手的原生安全特性，机身厚度仅 10 厘米超瘦身设计，车主仅需 30 分钟即可 DIY 轻松安装，完美实现了自动充电服务在家庭场景中的可靠、安全、易用落地。据计划，该产品将于今年下半年正式发布，并于 2027 年 1 月的 CES 大展上全面启动全球上市计划，具体细节将陆续公布。</p>\n  <p>从 5000 多米挑战极限的高海拔地区，到喧嚣纷杂的城市公共充电场站，再到温馨舒适的私家车位 —— 自动充电机器人的每一次零延时与自适应，都是科技对未来的回应。万勋科技 “柔韧充” 自动充电通用服务引擎正以柔韧具身智能为基石，真正实现 “不挑环境、不挑场景、不挑车型、不挑用户” 的混沌服务与全类通解，积极助力主机厂、场站运营商、能源基建厂商、无人化运营商及地方政府等合作伙伴，加速推进无人矿区、码头、交通枢纽、Robotaxi、Robobus、公共充电站、城市商业综合体、政企示范站、家用充电等全场景落地，大步跨入真正的无人化智驾时代。</p>", "category": "tech", "published_at": "2026-07-09T15:36:08+00:00", "fetched_at": "2026-07-10T02:35:18.108096+00:00", "fingerprint": "f3fd15e7ab329929"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨老乡鸡五年五次冲击上市失败；两款燃油车重回销量榜前十；长鑫科技披露招股意向书，预计7月16日发行", "url": "https://36kr.com/p/3889047503354625?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>花呗就还款页面无法正常打开致歉</li>\n   <li>中芯国际市值超越贵州茅台</li>\n   <li>iPhone 18 Pro Max成本大涨，起步价或维持在9999元</li>\n   <li>英伟达将与Hugging Face合作开发机器人开源模型</li>\n   <li>美国多州可能于下周起诉阻止派拉蒙与华纳兄弟交易</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>老乡鸡五年五次冲击上市失败</strong></p>\n  <p>LXJ International Holdings Limited（简称“老乡鸡”）于2026年1月8日递交港交所的招股书于7月8日失效。这家被称为“中式快餐第一”的企业，五年间已第五次冲击资本市场失败。（界面新闻）</p>\n  <p><strong>两款燃油车重回销量榜前十</strong></p>\n  <p>在短暂告别销量榜前十后，燃油车又杀回来了。在新能源车渗透率连续三个月维持在60%以上的市场趋势下，两款燃油车——丰田凯美瑞与大众朗逸——于2026年6月重回乘用车零售销量前十，打破了5月销量榜没有燃油车的局面。</p>\n  <p>懂车帝发布的5月乘用车零售销量排行榜显示，丰田凯美瑞以17114辆位列第九，大众朗逸以15444辆排名第十。而此前的5月份，销量前十榜单已历史性地被新能源车型包揽。彼时朗逸已跌至第18位，轩逸第20位，凯美瑞更退居第24位。零售销量TOP 10中，特斯拉Model Y以38654辆居首，吉利星愿33359辆位列第二，零跑A10以24865辆位列第三。</p>\n  <p>燃油车此番回温，受到油价相对下行的影响。6月国内成品油价迎来两轮下调，92号汽油两个月累计合计每升下调0.81元。用车成本的实质性下降，在一定程度上修复了燃油车的使用经济性。另一方面，大宗材料及芯片价格的持续上涨，新能源汽车在成本端压力增大，部分车型优惠力度有所收缩。此消彼长之下，燃油车的性价比优势阶段性回升。（第一财经）</p>\n  <p><strong>长鑫科技披露招股意向书，预计7月16日发行</strong></p>\n  <p>36氪获悉，长鑫科技公布科创板IPO招股意向书，预计发行日期为7月16日。据披露，公司本次拟初始公开发行股票66.88亿股，发行股份占公司发行后总股本的比例约为10.00%（超额配售选择权行使前）；发行初始战略配售发行数量为33.44亿股，占初始发行数量的50.00%。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>灵光App升级世界模型体验</strong></p>\n  <p>36氪获悉，7月9日，灵光App正式升级了世界模型体验功能。新版接入蚂蚁灵波最新发布的世界模型LingBot-World 2.0相关能力。相比此前只能“走一走、看一看”，新版最大的变化是让AI生成的世界真正“可玩”起来。用户不仅能在场景中漫步探索，还可以像玩3D游戏一样进行技能操作，AI会根据用户动作实时生成新的场景反馈。</p>\n  <p><strong>OpenAI部署公司据悉将收购应用AI企业Northslope</strong></p>\n  <p>7月8日消息，据报道，OpenAI旗下的独立业务单元“OpenAI部署公司”已同意收购应用人工智能公司Northslope。（界面新闻）</p>\n  <p><strong>OpenAI发布GPT-5.6系列模型，旗舰模型Sol正式开放使用</strong></p>\n  <p>当地时间7月9日，OpenAI宣布，GPT-5.6系列模型正式全面开放，包括旗舰模型GPT-5.6 Sol、均衡型模型Terra和低成本模型Luna。其中，Sol支持全新的Ultra模式，可默认协调4个AI代理并行处理复杂任务，进一步提升代码开发、科研、网络安全及知识工作等场景的效率。OpenAI称，GPT-5.6系列在多项基准测试中实现业内领先，并在保持或提升性能的同时显著降低推理成本和响应时间。公司同时表示，GPT-5.6配备迄今最完善的安全防护体系，并正式支持程序化工具调用，进一步增强复杂任务自动执行能力。（界面新闻）</p>\n  <p><strong>SpaceX AI与Cursor发布面向法律、金融场景的Grok AI模型</strong></p>\n  <p>SpaceXAI发布了一款名为Grok 4.5的新型人工智能模型，该模型是与AI编程初创公司Cursor合作打造的，旨在缩小与Anthropic和OpenAI等竞争对手的差距。Grok 4.5旨在处理包括软件工程、法律和金融服务在内的复杂、长期运行任务，并增强了网络安全能力。新模型旨在“处理复杂且耗时较长的任务”，包括许多顶尖AI开发人员重点关注的软件工程领域。但与Cursor此前的模型不同，Grok 4.5旨在应对更广泛的工作组合，例如法律和金融服务。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>花呗就还款页面无法正常打开致歉</strong></p>\n  <p>7月8日晚间，有大量用户反映支付宝花呗在进行还款时，还款页面无法正常打开。根据用户上传的截图显示，点开花呗页面会出现“网络繁忙”或在账单页面显示“因机构维护，账单暂时无法查看”。针对该问题，支付宝花呗官方客服表示，目前系统升级已完成，可以正常使用了。由此带来的不便深表歉意。客服还称，“花呗有三天宽限期，在宽限期内完成还款，不会影响征信。”（中新经纬）</p>\n  <p><strong>国务院：推动产业结构绿色低碳转型，持续增强新能源、新能源汽车、动力电池等产业竞争优势</strong></p>\n  <p>36氪获悉，国务院印发《“十五五”碳达峰行动方案》。推动产业结构绿色低碳转型。稳妥有序推进重点行业化解结构性矛盾，依法依规淘汰落后低效产能和工艺设备。加强水泥产能规范管理。有力有效管控“两高”项目，强化源头把关，严格节能降碳审查评价，落实新（改、扩）建“两高”工业项目实施碳排放等量或减量置换要求。加快发展绿色能源、绿色制造、绿色服务等绿色低碳产业，持续增强新能源、新能源汽车、动力电池等产业竞争优势，培育氢能、绿色燃料等产业。支持碳管理服务业发展，推广合同能源管理等第三方治理模式，推进数智技术赋能绿色低碳发展。</p>\n  <p><strong>河南老君山景区发布“月薪6万元”招聘</strong></p>\n  <p>7月8日，老君山景区发布老君山招募“云海观察员”，月薪6万元，需住在老君山山顶30天(2026年7月16日至8月15日期间)，每日观测老君山云海变化，招聘面向全国网友。招募报名时间为2026年7月8日—2026年7月15日（7月15日24:00截止视频数据统计）。评选方式为截至2026年7月15日24:00，以话题下视频点赞量为主要评选依据，综合视频内容质量、传播效果及账号合规情况进行评选，最终评选出一名“老君山夏季云海观察员——观小海”。</p>\n  <p>据老君山景区介绍，每年的7、8月，是河南老君山景区云海出现频率最高、观赏效果最佳的时期，为了更好地记录云海变化，给广大网友及时呈现老君山的云海奇观，老君山景区面向全国网友招募云海观察员。据悉，观察员每天需要拍摄制作至少一条云海视频，并以短视频形式对外发布分享。有媒体致电老君山景区询问报名事宜，工作人员表示，景区微信公众号已公布报名方式，目前咨询报名者众多，但全国仅选一人。此外，云海观察员需住在老君山山顶30天。至于住山顶什么地方，上述工作人员表示，这个还不清楚，待确定人选后景区再安排。（第一财经）</p>\n  <p><strong>天赐材料回应“固态电池技术突破”小作文：五年内影响有限</strong></p>\n  <p>据媒体报道，7月8日一份关于\"固态电池技术交流会纪要\"在投资者圈中广泛传播，新一代固态电池技术有望实现电解液、隔膜等传统锂电材料的全面替代，甚至提出电解液行业或将被“完全淘汰”，隔膜等材料亦将被替代。\"我们不认为是这样。\"天赐材料董秘在电话采访中明确否认固态电池冲击论调。其表示，液态电池每年的销售增量和应用场景仍然非常好。“我们认为，固态电池在5年内不会有非常大的占比，这一判断是与宁德时代的共识。（界面新闻）</p>\n  <p><strong>沐曦股份发布澄清公告：“产品订单排到明年”传闻不实，公司仍处亏损状态</strong></p>\n  <p>36氪获悉，沐曦股份发布澄清公告，关注到有媒体报道称，公司部分产品订单已经排到明年甚至之后，经公司核查，上述传闻不属实。公司首席产品官、高级副总裁孙国梁在“活力中国调研行”活动中的发言未对公司订单情况发表观点。公司目前生产经营正常，不存在应披露而未披露的重大信息。公司2026年一季度营业收入5.62亿元，归属于上市公司股东的净利润-9884.24万元，仍处于亏损状态。</p>\n  <p><strong>机构：2026Q2全球PC出货量下滑4.9%</strong></p>\n  <p>36氪获悉，根据IDC数据，2026年第二季度全球PC出货量同比下降4.9%，至6820万台——这是连续九个季度增长后的首次下滑。持续的内存芯片短缺是此次反转的主因，促使厂商尽可能提前压货。中国市场，2026年第二季度PC出货量992万台，同比下降1.6%，同比下滑但表现好于全球，尽管内存价格上涨，但商用政府大型企业需求强劲。</p>\n  <p><strong>小鹏Robotaxi开启内测，何小鹏称Robotaxi是小鹏迈向“机器人汽车”的重要一步</strong></p>\n  <p>记者9日获悉，小鹏集团召开Robotaxi业务首次全员会，并宣布正式启动员工内测。何小鹏表示，未来十年，所有具身智能载体本质都会成为机器人，Robotaxi是小鹏从新能源汽车迈向“机器人汽车”的重要一步，是成为小鹏物理AI版图的关键一子。基于AI时代软硬件融合的发展趋势，小鹏未来将聚焦整车平台、自动驾驶软件及AI能力，打造服务全球合作伙伴的Robotaxi软硬件服务商，通过输出整套解决方案，推动Robotaxi全球化落地。（证券时报）</p>\n  <p><strong>中芯国际市值超越贵州茅台</strong></p>\n  <p>36氪获悉，7月9日，中芯国际A股涨近15%，总市值达1.49万亿元；贵州茅台现跌1.43%，总市值为1.48万亿元。</p>\n  <p><strong>汇丰银行：金价将保持震荡走势，预计年底金价目标为4750美元/盎司</strong></p>\n  <p>汇丰银行表示，黄金价格将保持震荡走势，预计2026年剩余时间内黄金价格将在3800-4700美元/盎司的宽幅区间内波动，并预测年底金价目标为4750美元/盎司。（财联社）</p>\n  <p><strong>商务部等9部门：禁止平台经营者强制或变相强制商户承担补贴、参与促销活动</strong></p>\n  <p>36氪获悉，商务部等9部门印发关于加快零售业创新发展的意见，其中提出，支持品牌商构建合理价格体系，通过完善定价策略缩小线上线下价差。落实《互联网平台价格行为规则》《网络交易平台规则监督管理办法》，引导平台经营者自觉规范价格和补贴行为。重点整治虚假宣传、虚假促销、虚假打折和不公平定价行为。推动落实明码标价，公示促销活动规则、期限、适用范围，禁止平台经营者强制或变相强制商户承担补贴、参与促销活动，向商户转嫁促销成本，以及“0元购”等行为。</p>\n  <p><strong>iPhone 18 Pro Max成本大涨，起步价或维持在9999元</strong></p>\n  <p>7月8日，Counterpoint Research发布了一份物料清单（BoM）成本对比报告。Counterpoint Research分析师指出，预计今年9月发布的iPhone 18 Pro Max（12GB+1TB版本），其硬件成本相比上一代iPhone 17 Pro Max将上涨近300美元（现汇率约合2043元人民币）。尽管苹果可能采取平均上调200美元（现汇率约合1362元人民币）零售价的策略，iPhone 18 Pro Max的毛利率仍预计将略低于2025年的iPhone 17 Pro Max。</p>\n  <p>面对显著的BoM成本压力，苹果预计将采取分容量差异化定价的策略来维持利润。有网友猜测，iPhone 18 Pro Max的起步价很可能维持在9999元，与上一代持平；但512GB、1TB等大容量版本的售价则面临上调压力。这被解读为苹果通过守住基础款价格锚点，同时将成本增量转移至对价格敏感度相对较低的高容量存储版本上。（IT之家）</p>\n  <p><strong>年内港股IPO募资额同比增超95%</strong></p>\n  <p>今年港股IPO市场热度持续走高。随着7月8日Momenta、瑞为技术等5家公司登陆港股市场，年内港股新增上市企业已达92家，首发募资总额2161亿港元，较去年同期的1106亿港元，同比增长95.39%。中国首席经济学家论坛理事陈雳表示，今年港股IPO发行规模大幅增长，是科创企业融资需求释放、港交所上市制度优化、跨境流动性回暖等多重利好共振的结果。港股IPO的提速，既畅通实体直接融资渠道、培育新质生产力，也可进一步夯实香港国际金融中心地位。（证券日报）</p>\n  <p><strong>*ST华闻：申请撤销退市风险警示</strong></p>\n  <p>36氪获悉，*ST华闻公告，公司第十届董事会2026年第一次临时会议审议通过《关于申请撤销退市风险警示的议案》，同意向深圳证券交易所申请撤销因触及《深圳证券交易所股票上市规则》第9.4.1条第(九)项情形而被实施的退市风险警示。</p>\n  <p><strong>英伟达将与Hugging Face合作开发机器人开源模型</strong></p>\n  <p>英伟达宣布与Hugging Face合作，联合开发用于机器人的开源基础模型，将GPU生态与CUDA堆叠，结合Hugging Face庞大模型库及开发者社区，大幅降低机器人AI训练与部署门槛。（财联社）</p>\n  <p><strong>微软Xbox将调整黑曜石工作室，转向开发《辐射》新作</strong></p>\n  <p>当地时间7月8日，据报道，微软公司旗下Xbox正在进行更大范围的一轮重组。知情人士透露，Xbox旗下的黑曜石工作室已取消多个项目，其中包括原计划开发的《宣誓》续作。该工作室将转向开发热门系列《辐射》的一款新作。此外，知情人士称，黑曜石还裁撤了约四分之一员工。（界面）</p>\n  <p><strong>美国多州可能于下周起诉阻止派拉蒙与华纳兄弟交易</strong></p>\n  <p>7月9日，据报道，两位知情人士透露，担心派拉蒙以1100亿美元收购华纳兄弟探索公司会损害市场竞争的美国多州，最早可能于下周提起诉讼以阻止该交易。报道称，消息人士并未具体说明各州担忧的是何种类型的竞争。然而，倡导团体和一些州监管机构已发出警告，称流媒体平台的订阅价格可能上涨，合并后的公司可能裁员，并缩减电影、新闻和其他内容的供应范围。（界面新闻）</p>\n  <p><strong>美国银行转向支持OpenAI，提供5.2亿美元信贷额度争取IPO承销资格</strong></p>\n  <p>7月8日消息，据报道，美国银行近日向OpenAI提供5.2亿美元信贷额度，使OpenAI可动用的信贷额度增至逾50亿美元。据悉，美国银行此前曾拒绝向OpenAI放贷，此次转变部分受到OpenAI筹备首次公开募股（IPO）的推动，希望争取参与这一潜在大型IPO承销。（界面新闻）</p>\n  <p><strong>大众汽车管理层考虑2031年起关闭德国部分工厂</strong></p>\n  <p>据报道，大众汽车执行董事会计划未来五年逐步停止位于德国茨维考和埃姆登两家工厂的生产。位于汉诺威的商用车工厂计划于2032年关闭，位于内卡苏尔姆的奥迪工厂计划于2034年关闭。这四家德国工厂大约有4万名员工。（界面新闻）</p>\n  <p><strong>消息称三星晶圆代工部分制程涨价</strong></p>\n  <p>三星电子已将晶圆代工新客户的供货价格提高了约15%，主要针对需求量大的先进制程节点，例如4nm和5nm，以及部分车用8nm制程节点。在此之前，台积电已通知主要客户，计划将供应价格上调5%至10%。分析师指出，三星的做法并非像台积电那样全面提价，而是更侧重于在需求集中的特定节点上调整价格。（财联社）</p>\n  <p><strong>日本卡乐比将恢复多款零食的彩色包装，此前因“缺油少墨”变黑白</strong></p>\n  <p>日本零食巨头卡乐比（Calbee）7月9日宣布，基于最新采购预期，公司将把此前改为黑白两色包装设计的日本国内部分产品恢复为全彩印刷。今年5月，由于中东局势持续紧张，作为印刷油墨原料的石脑油（石化原料）供应趋于不稳定，该公司宣布变更包装设计。声明称，生产切换计划于今年7月27日所在周开始，采用新包装的产品随后将陆续上市。卡乐比表示，将在密切关注供应状况的同时继续致力于节约资源。（界面新闻）</p>\n  <p><strong>SK海力士募资265亿美元，刷新外国企业赴美IPO纪录</strong></p>\n  <p>当地时间7月9日，SK海力士通过美国存托股份（ADS）发行募资265亿美元，成为外国企业在美国规模最大的首次公开募股。SK海力士以每份149美元发行1.779亿份ADS，ADS将于7月10日在纳斯达克开始交易，代码为“SKHYV”。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，Arm涨超9%</strong></p>\n  <p>36氪获悉，7月9日收盘，美股三大指数集体上涨，道指涨0.27%，纳指涨1.3%，标普500指数涨0.81%。大型科技股多数上涨，Arm涨超9%，Meta涨超4%，特斯拉涨超3%，SpaceX、英特尔涨超2%，亚马逊涨超1%，苹果、微软小幅上涨；谷歌、英伟达、奈飞小幅下跌。热门中概股涨跌不一，爱奇艺涨超8%，阿里巴巴、老虎证券、富途控股、拼多多涨超1%；名创优品、蔚来、小鹏集团跌超2%，理想汽车、哔哩哔哩跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>江苏知原药业股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，江苏知原药业股份有限公司向港交所提交上市申请书。</p>\n  <p><strong>上海燧原科技股份有限公司科创板IPO注册生效</strong></p>\n  <p>36氪获悉，上海燧原科技股份有限公司科创板IPO注册生效。</p>\n  <h2>大公司财报</h2>\n  <p><strong>百事公司：第二季度净营收241.8亿美元，略高于市场预期</strong></p>\n  <p>百事公司第二季度净营收241.8亿美元，预估239.5亿美元；核心每股收益2.20美元，预估2.19美元。（财联社）</p>\n  <p><strong>工业富联：预计2026年半年度净利润同比增长93%-101%</strong></p>\n  <p>36氪获悉，工业富联公告，预计2026年半年度归属于上市公司股东的净利润为234亿元-244亿元，同比增长93%-101%。业绩变动主要系云计算业务中AI服务器收入同比增长超230%，以及800G以上数据中心交换机出货量同比增长1.4倍。</p>\n  <p><strong>兆易创新：预计2026年半年度净利润同比增长1099%</strong></p>\n  <p>36氪获悉，兆易创新公告，预计2026年半年度归属于上市公司股东的净利润为69.00亿元左右，同比增长1099%左右。业绩变动主要系存储芯片行业供给紧张，公司存储芯片产品量价齐升，微控制器产品出货规模增长，带动整体经营业绩大幅增长。</p>\n  <p><strong>神火股份：预计上半年归母净利润同比增长152.04%</strong></p>\n  <p>36氪获悉，神火股份公告，预计2026年上半年归母净利润48亿元，同比增长152.04%。公司业绩增长的主要原因为：报告期内，受电解铝、煤炭产品售价同比上涨、主要原材料氧化铝价格同比下降等因素影响，公司盈利能力大幅增强。</p>\n  <p><strong>天赐材料：预计2026年半年度净利润同比增长908%-1020%</strong></p>\n  <p>36氪获悉，天赐材料公告，预计2026年半年度归属于上市公司股东的净利润为27.00亿元-30.00亿元，同比增长907.84%-1019.82%。业绩变动主要系锂离子电池材料电解液及六氟磷酸锂产品市场需求旺盛，销量显著增长，产能利用率提升，行业供需格局优化带动产品价格上行，整体毛利率提升。</p>\n  <h2>投融资</h2>\n  <p><strong>“逻辑比特科技”官宣数亿元A轮融资</strong></p>\n  <p>36氪获悉，“逻辑比特科技”技正式官宣此前完成的数亿元A轮融资。本轮融资由康君资本、混沌投资联合领投，国开科创、元璟资本、上海未来产业基金、IDG资本、半导体集成电路产业基金中芯聚源和芯联资本，以及弘晖基金、TCL创投、厚雪资本等跟投。此外，老股东经纬创投、东方嘉富、达晨财智、华控基金、深创投、浙大校友基金藕舫天使、华夏恒天在本轮融资中持续加码。此轮融资主要用于研发和建设新一代高性能超导量子芯片和自动化产线、加速部署国际领先的量子计算云平台以及高水平人才招募。</p>\n  <p><strong>“墨奇智能”完成超10亿元天使轮系列融资</strong></p>\n  <p>36氪获悉，近日，具身智能企业“墨奇智能”正式宣布完成超10亿元天使轮系列融资。本轮融资由阿里巴巴、腾讯联袂投资，光合创投等十余家一线机构共同参投，本轮资金将加码基座模型研发与场景落地。</p>\n  <p><strong>“泽塔聚变”完成数亿元天使轮融资</strong></p>\n  <p>36氪获悉，可控核聚变企业“泽塔聚变”近日完成了数亿元天使轮融资。本轮融资由北京市绿色能源和低碳产业投资基金领投，梅花创投、松禾资本、亦庄产投、深开鸿、中科创星等机构联合投资，此次融资将主要用于Z箍缩聚变装置迭代研发、工程体系搭建和人才梯队扩容，进一步推动Z箍缩聚变-裂变混合堆工程落地。</p>\n  <p><strong>“瑞启深空”完成2.2亿元天使轮融资</strong></p>\n  <p>36氪获悉，“瑞启深空”近日完成2.2亿元天使轮融资，投资方为苏高新金控、苏高新投资、卓璞资本等多家机构。资金将主要用于卫星研制与发射、地面系统及早期数据中心搭建。</p>\n  <p><strong>“深度智控”（DeepCtrls）完成数亿元人民币B轮融资</strong></p>\n  <p>36氪获悉，物理AI企业“深度智控”（DeepCtrls）近期完成数亿元人民币B轮融资。本轮融资由晶科能源战略投资，国投创新、招银国际联合领投，红杉中国、源码资本、光远资本、招商局创投等老股东持续跟投。本轮资金将主要用于核心物理AI算法与产品线的持续研发、标准化产品DeepBot的规模化拓展，以及东南亚、中东、欧美等海外市场的进一步布局。</p>\n  <h2>酷产品</h2>\n  <p><strong>阶跃星辰将发布AI智能体手机</strong></p>\n  <p>阶跃星辰即将发布AI终端品牌、智能体系统及其首款AI智能体手机。此前，OpenAI已公开押注新一代AI终端，计划2027年上市。阶跃星辰本次抢先落地AI智能体手机，成为全球大模型厂商中率先迈出这一步的玩家。（财联社）</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-09T23:43:55+00:00", "fetched_at": "2026-07-10T02:35:18.108087+00:00", "fingerprint": "155b00c756d52fd4"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 英伟达全球首家触觉仿真合作伙伴再获数亿融资，上半年订单超去年四倍", "url": "https://36kr.com/p/3889141540370949?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260710/v2_27f38c78baa0435ebc1c560de3f3bb69@6221844_oswg1150800oswg1268oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3100</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，北京他山科技有限公司（以下简称“他山科技”）已于近期完成B轮融资，金额为数亿元。本轮投资方包括均胜电子、太平创新、奥克斯、鹏翎股份、Lavender Hill Capital Partners（LHCP）、洪山资本等产业方，老股东道氏技术、彬复资本追加投资。资金将主要用于触觉传感器及芯片迭代、场景化方案落地及触觉训练平台建设。</p>\n  <p>这家成立于2017年的公司，总部位于北京，是一家专注于人工智能触觉感知技术及全栈式应用解决方案的研发商。核心团队由清华大学、曼彻斯特大学等高校研发人员组成；首席科学家为ARM架构共同发明人、英国两院院士Steve Furber；公司创始人孙滕谌毕业于清华大学自动化系，是平面电容与曲面电容技术发明人。</p>\n  <p>2019年，公司与曼彻斯特大学联合成立全球首个AI触觉感知实验室。经过近多年深耕，他山科技已构建起“芯片-传感器-算法模型-场景应用”的全栈技术体系。</p>\n  <p>触觉感知在机器人行业的重要性正在快速成为共识。据公司观察，2025年触觉传感器在灵巧手中的渗透率已从约20%出头提升至60%以上，且每月仍在持续增长。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260710/v2_77fde8913adb4389be7d0dae974a21b8@6221844_oswg810102oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载他山触觉传感器的灵巧手（图源/企业）</p>\n  <p>市场增长的核心驱动力来自多个维度：其一，随着具身智能从“看见”走向“感知”，触觉作为机器人与物理世界交互的关键感知维度，重要性日益凸显；其二，行业对机器人数据的需求爆发，从仿真到真机训练都离不开触觉数据的支撑。</p>\n  <p>目前，他山科技已构建起覆盖芯片、传感器、算法平台到仿真系统的完整产品矩阵。</p>\n  <p>芯片层面，公司自主研发了全球首款数模混合AI触感芯片，基于脉冲神经网络架构，支持多维触觉信号的低时延、低功耗端侧处理。全新一代大芯片已流片成功，预计今年Q3正式发布。</p>\n  <p>传感器层面，核心产品包括TS-F指尖触觉传感器和TS-E机械手触觉传感器。TS-F集成了接近觉、三维力检测、温差与纹理感知功能，测力分辨率达0.01N，可在非接触状态下识别超30种材质。TS-E广泛适配各类机器人夹爪。今年传感器测量频率已较去年提升3至4倍，后续还将推出带温度感知的多模态传感器。</p>\n  <p>数采与算法平台方面，公司推出TS-V视触融合训练平台及TS-VT数据采集版本，大幅降低触觉算法训练的数据门槛。今年3月和5月，北京石景山数训工厂与湖北潜江数采中心相继落成，聚焦触觉、异构、自主无人数采三大方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260710/v2_504febd12ec34a9da2937013db27b039@6221844_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">TS-VT视触融合训练平台在中国移动合作伙伴大会上展示（图源/企业）</p>\n  <p>模拟仿真层面，他山科技是英伟达Isaac Sim全球首个触觉仿真合作伙伴，自研触觉模拟仿真已开源至MuJoCo和英伟达平台。</p>\n  <p>此外，公司近期发布数据采集手套，支持多模态数据同步采集；并与云迹科技合作推出TS-R触觉感知服务机器人，作为触觉技术落地服务场景的典型示范。</p>\n  <p>在业绩方面，据公司透露，触觉传感器在手订单截至5月底已达2025年全年营收的4倍。公司整体营收截至5月底已超2025年全年。</p>\n  <p>业务结构上，机器人业务增长尤为突出，预计2026年机器人业务将超过汽车业务3至4倍，贡献全年营收的约三分之二。</p>\n  <p>目前，公司已与国内外180余家机器人产业链客户达成深度商业化合作，包括星动纪元、银河通用、自变量等整机厂商，以及因时机器人、强脑科技、灵巧智能等灵巧手头部企业。他山科技在人形机器人触觉传感器细分领域占据超80%出货量。</p>\n  <p><strong>以下为硬氪与他山科技市场及生态副总裁付宜晖的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：触觉感知在行业中的渗透率变化很快，原因是什么？</strong></p>\n  <p><strong>付宜晖：</strong>去年我们的80%市占率是基于全球灵巧手出货量计算的，但当时触觉在灵巧手中的渗透率只有20%出头。从去年Q4开始，几乎所有找到我们的客户，渗透率都提到了60%以上，而且每个月都在增加。</p>\n  <p>行业共识正在快速形成——大家意识到，没有触觉，机器人在物理世界的操作闭环是关不上的。今年模型厂商也开始大规模采购传感器用于数据采集，进一步拉动了需求。</p>\n  <p><strong>硬氪：留意到公司近期在北京和潜江落地了数采中心，接下来公司如何定位自己在产业链中的角色？</strong></p>\n  <p><strong>付宜晖：</strong>我们的定位仍是成为所有下游客户的“触觉基建”。目前市面上80%的触觉传感器都是他山的。行业越来越意识到，触觉需要有自己的算法和模型。所以作为触觉基础设施建设者，我们希望加速触觉专用算法模型的研发、进一步验证场景方向，以此支撑行业发展。</p>\n  <p>今年3月和5月，我们先后在北京石景山和湖北潜江落成两个数采工厂，适配异构本体和不同形态的数据采集方案。我们还和强化学习之父、图灵奖得主理查德·萨顿共建了“机器人幼儿园”，探索让机器人在真实物理环境中通过触觉感知自主试错学习的新范式。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260710/v2_6fc79608212043799a6d54885255cec6@6221844_oswg985333oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图灵奖得主理查德·萨顿介绍与他山科技共建的“机器人幼儿园”（图源/企业）</p>\n  <p><strong>硬氪：如何看待接下来一两年行业的爆发节点？</strong></p>\n  <p><strong>付宜晖：</strong>从硬件渗透率来看，触觉传感器正在从“选配”变成“标配”。从今年Q4开始，基于触觉的算法模型和应用会陆续落地，2027年将是一个爆发点。今年我们在传感器维度的营收已经超过去年一倍，在手订单是去年全年的4倍。这个赛道才刚刚开始。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>均胜电子：</strong>触觉传感器是机器人与物理世界交互的“最后一厘米”核心，亦是目前具身智能实现精密灵巧操作的核心瓶颈，正从“可选配件”升级为精密操作与人机协作的刚需底座。他山科技是国内乃至全球AI触觉感知赛道的领军者，正以“芯片-传感器-算法模型-场景应用”的全栈自研能力，为具身智能产业补上“触觉”这一核心拼图。</p>\n  <p>均胜电子以“自研+投资”长期布局具身智能赛道，以“核心部件+工业场景”双轮驱动，此次投资符合公司布局具身智能产业链核心环节的策略。希望通过此次投资，与他山科技建立并加深在触觉传感器方向的业务协同，共同助力具身行业发展。</p>\n  <p><strong>奥克斯：</strong>随着多模态大模型的快速演进，物理AI的经济价值正处于加速爆发的前夜。不同于自动驾驶以视觉主导的“避障”逻辑，具身智能需通过触觉实现与物理世界的深度交互，触觉感知不仅是实现精密操作的关键基石，亦是产业演进的核心制约因素。他山科技作为行业内具备底层芯片、算法模型与传感器全栈自研能力的标杆企业，通过垂直整合构建了深厚的技术护城河。公司不仅凭借高性能触觉解决方案解决了行业多维度感知的共性瓶颈，率先达成商业化量产，更展现了极广的商业落地宽度：除在具身智能、AI玩具等前沿热点领域占据关键卡位外，在汽车电子、智能家电等成熟产业亦有深厚的落地基础。这种兼具前沿技术爆发力与跨行业抗周期属性的布局，使他山科技成为该赛道中极具投资价值的稀缺科技企业。</p>\n  <p><strong>鹏翎股份：</strong>高精度触觉感知是灵巧手突破操作瓶颈、安全人机交互、复杂物体自适应抓取的底层关键，是具身智能实现通用落地、完成精细化作业的核心抓手，触觉数据更是补齐具身智能多模态训练数据、提升模型泛化能力的核心增量。他山科技构筑行业独有的全栈自研壁垒，是国内极少数同时掌握底层专用传感芯片、触觉算法大模型、柔性传感阵列硬件的触觉方案供应商，独家分布式协同感知架构可完美适配灵巧手复杂抓取、精密操作场景，产品已获得行业头部灵巧手厂商批量订单认可，商业化落地进度、产品交付规模均处于全球第一梯队。</p>\n  <p><strong>太平创新：</strong>他山科技具有对触觉感知领域前瞻性及全局性战略思考，除触觉传感模组本身，探索仿真及真机触觉数据体系建设，上延类脑传感芯片，下至关键场景探索；在场景端，公司除具身智能外，产品也广泛应用于汽车电子、消费家电等多领域；此外，伴随国内老龄化持续深化，康养科技势在必行。触觉是具身智能打通康养场景的核心感知壁垒之一，参与构筑长者及其他家庭成员安全防线，愿他山与众多产业链兄弟公司一道，以科技温度守护银发健康。</p>", "category": "tech", "published_at": "2026-07-10T01:19:37+00:00", "fetched_at": "2026-07-10T02:35:18.108071+00:00", "fingerprint": "b3cbed5033ee2c51"}, {"source": "少数派", "title": "角落新声｜在陌生的城市里，寻找属于自己的角落", "url": "https://sspai.co s working on prototype \"super sensing\" always-aware smart glasses that could continuously record audio and snap photos \"every few seconds,\" according to the Financial Times. The wearer could then ask Meta AI about the captured audio and images. However, the images [&#8230;]", "category": "tech", "published_at": "2026-07-08T22:37:25+00:00", "fetched_at": "2026-07-09T02:32:45.624190+00:00", "fingerprint": "0956ebd23de8c68a"}, {"source": "36氪 - 最新文章", "title": "从跨境电商到AI大模型：一个旅欧10年90后女生的两次出海", "url": "https://36kr.com/p/3886574096265481?f=rss", "summary": "<p>20世纪50年代，“日本制造”对世界来说意味着低廉的价格和三流的产品。到70年代日本家电崛起，巅峰时期美国市场三成的彩电都是日本产品。80年代，丰田、本田、日产等日本汽车品牌接棒家电走向世界。再往后，日本动漫、游戏、音乐等文化娱乐产业开始向海外输出并成为支柱产业。</p>\n  <p>从廉价服装到二次元，日本输出海外的核心产品在过去七十年里换了好几轮，从侧面说明一国出海的主流产品从来不是固定的，会跟着国家的产业能力变迁。</p>\n  <p>这种变迁的剧本也正在今天中国出海人的身上重演。2015年，李露薇从宁波赴法留学。彼时国内大厂刚开始试水跨境电商业务，中国商品开始借助亚马逊、速卖通、eBay等线上渠道进入欧美市场，海运等跨境物流网络开始形成。<strong>还在读研究生的李露薇也顺势抓住时机，于2017年独创了一个B2B2C电商平台Import Market Sales (IMS)，</strong>链接中国的产业带和欧洲的本土电商平台和最终消费者。<strong>该平台专注在户外家具这个细分类目，同时也创建了独立站品牌Avril Paris。</strong>在9年时间内，在没有融资的情况下，累计销售额从0做到了3500万欧元，与法国和英国20多个国际和本土电商平台达成合作，服务8万多名直接客户。</p>\n  <p>在2025年的一次摩洛哥出差期间，李露薇注意到许多本地人都在讨论DeepSeek等中国AI模型。她意识到，世界已经变了，出海的机会点也在转向。</p>\n  <p>1年后，李露薇离开巴黎，来到伦敦加入字节跳动，负责AI大模型全球伙伴和生态系统开拓业务。最近，她向我们讲述了过去10多年的创业故事和她对欧洲市场的观察。以下是李露薇的自述。</p>\n  <p><strong>1.带着7人团队9年累计实现3500万欧元营收</strong></p>\n  <p>10年前第一次在法国创业的时候，我还在留学，发现法国人喜欢住带花园的house，也会花很多的时间和精力打理自己的花园，这让我意识到这是一个被忽略的大市场。恰好我的老家宁波有户外家具产业带，所以我选择了户外家具这个类目进行切入。</p>\n  <p>当时跨境电商还是一个新鲜但陌生的概念，做海外市场主要靠参加展会，通过经销商或者海外大客户下订单，中国产品和海外C端消费者之间隔着一层层进口商、批发商和零售商，市场距离也很远。虽然我手上不缺供应链资源，但没有资金大量存货，所以我就原创了一个新的电商平台架构，做B2B2C，把工厂，本土平台和终端消费者连接起来。<strong>我的初创公司提供品牌授权和营销，供应商供货，平台收取佣金。</strong>这样的模式在当时是没有先例的，我也因此在2017年就入选了法国知名孵化器Station F 进行初创企业的孵化，也在2020年获得了法国经济部French Tech组织颁发的“创新型企业”官方认可。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_db2c5fd3e93b4794a07b09046432dbc7@6244039_oswg186031oswg1080oswg812_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">李露薇在Station F孵化器和同事</p>\n  <p>李露薇在法国Station F孵化器时的照片</p>\n  <p>在欧洲做跨境电商创业涉及供应链、物流、仓储、营销、财务、法务等几个环节。每个环节需要接触的法国公司，我就一家一家去谈合作。在这个过程中，市场营销是最需要本土化的。在一场电商展会上，我和一家营销公司的CEO聊完之后，觉得对方的经验和我很互补，就向他抛出合伙的橄榄枝。</p>\n  <p>法国是一个很难进入的市场。你必须会说法语，要懂当地的法律、税务、文化，因此需要深入当地生活、工作。我这么多年，也是摸着石头过河，慢慢把这条路蹚出来。</p>\n  <p>外国人创业，国际化人才管理也是一个需要积累的经验。我的团队都是本地招聘的，大家在一起共事很多年。我也一直有意保持团队的小规模，这样有助于保持初创企业的灵活性。同时，大量投入内部软件的开发（累计超过30万欧），我也每年都制定新的流程自动化目标，这样才能做到规模化。团队最多的时候也只有7个人，9年累计做了3500万欧元的销售额，人均产出500万欧元/人，这在前AI时代是非常高的人效比。</p>\n  <p><strong>2.从电商到AI</strong></p>\n  <p>2020-2022年期间， 得益于消费者对家居用品的增长和网购需求的爆发，我们的业务达到了高峰，<strong>峰值达到每年700多万欧元销售额，年均增长率82%。</strong></p>\n  <p>但是从2023年开始，法国受到国际局势影响，经历了近40年来最严重的通货膨胀，削���了法国家庭的购买力。法国消费者开始降低非必要支出，也开始比价格，偏好更便宜的东西。Temu、Shein也是从那时候开始在法国流行起来的。</p>\n  <p>去年一些主攻美国市场的跨境电商品牌，因为受到关税冲突的打击，也开始把重心转向欧洲市场，供给变多，产品同质化更严重，市场竞争更加激烈了。在内外承压的局面下，我决定结束这段创业。</p>\n  <p>决定结束电商创业之后我开始想一个问题：前几年做跨境电商，我为什么能成功？</p>\n  <p>一部分确实得益于自己的判断和执行力，但回过头看，如果没有2019-2022年欧洲居家办公催生的网购需求井喷，没有国内制造业对跨境电商平台的集体拥抱，没有线上支付和物流体系的成熟，我再怎么折腾，可能也只是小打小闹的生意。</p>\n  <p>所以寻找产业变迁的趋势，寻找新的生产力浪潮很重要。</p>\n  <p><strong>那下一个浪潮在哪里？</strong></p>\n  <p>2025年春天我飞了一趟摩洛哥，原本想和当地头部企业洽谈跨境电商方向的新机会。但和当地做物流、电商、金融科技的企业领导人聊下来，大家都在激动地说：你们的DeepSeek真的很厉害。这让我意识到世界已经变了，中国的优势产业也发生了巨变。<strong>我开始重点研究中国和欧洲头部的AI企业，以及AI在欧洲的落地情况。</strong></p>\n  <p>在欧洲AI既有巨大的想象力，也和当年的跨境电商一样，正处在爆发前夜。我于2025年秋天参加了法国最大的AI展之一的Adopt AI，发现95%的企业CEO想要AI来提升组织效率，但只有不到5%明白如何落地。</p>\n  <p>和直接创业不同，这次我选择加入一家领先的AI大模型公司。于是我来到伦敦加入字节跳动，做AI大模型的全球伙伴和生态系统开拓工作。</p>\n  <p>在欧洲的大模型市场，OpenAI、Anthropic、谷歌三家基础模型能力最强，是绕不开的对手。欧洲本土也有一些大模型公司，比如法国的Mistral，政府订单基本都会给他们，但这些公司更偏本土化，更专注于单一模型，和中国企业没有正面竞争，更多的是合作对象。</p>\n  <p>和过去中国产品出海靠性价比打开市场不同，在AI领域，只要技术竞争力够强，数据安全和本土合规做到位，部分产品定价甚至可以高于国际企业。</p>\n  <p>但和美国相比，欧洲并不算真正意义上的统一大市场，而是由众多国家的小市场拼起来，合规成本更高，每个国家企业的采购逻辑和商业习惯都不一样。所以对AI模型或AI产品企业来说，在每一个国家都需要重新做本地化适配。</p>\n  <p>这些挑战，和我之前的创业所面临的有很大的相似之处。所以，这次的转型，看似涉及两个行业，实际上是在前10年经验沉淀上的一次迸发，需要的欧洲出海方法论和深度市场理解是一样的。我也很期待，在更国际化的市场，更高增长的赛道，与本土伙伴企业合作，把AI带来的生产力赋能到欧美的本土企业中去。</p>", "category": "tech", "published_at": "2026-07-08T09:33:33+00:00", "fetched_at": "2026-07-09T02:32:45.472573+00:00", "fingerprint": "895e490ccd1b4605"}, {"source": "36氪 - 最新文章", "title": "eVTOL 走向商业化，难点不只在“飞起来”", "url": "https://36kr.com/p/3886750049808389?f=rss", "summary": "<p>低空经济的热度，很多时候是从一架飞行器开始的。</p>\n  <p>过去几年，eVTOL真机亮相、飞行汽车概念升温、低空航线试点、地方产业基金入场，让这个行业快速成为新兴产业里的高频词。相比传统无人机，eVTOL为代表的载人载货飞行器，显然承载了更大的想象力：它不仅指向低空物流、应急救援、城市治理，也指向未来城市空中交通、城际运输和立体出行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_7b2303c9cefe478ea26e243fd10c911e@5510391_oswg1541929oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>这股热度背后，更值得关注的不是市场空间想象，而是产业正在从概念展示进入审定、取证和运行体系建设阶段。</strong>公开资料显示，国内无人驾驶、电动垂直起降等新技术快速突破，已完成19个无人驾驶航空器型号审定工作，在审新兴航空器型号数量超过70个。</p>\n  <p>与此同时，新修订的《中华人民共和国民用航空法》已于2026年7月1日起施行，法律层面进一步完善了支持民航制造业、运输业和低空经济发展的制度安排，也加强了对民用无人驾驶航空器设计、生产、维修和飞行活动的管理。</p>\n  <p>但当行业从概念、试飞和展台展示走向商业化，一个更现实的问题开始浮出水面：飞行器能飞起来，只是第一步。</p>\n  <p>真正决定eVTOL能不能跑起来的，不只是某一款机型的参数，也不只是一次成功飞行，而是它能不能进入一条稳定、合规、安全、成本可控、有人买单的航线。</p>\n  <p>换句话说，eVTOL的商业化，不是把飞行器造出来，而是把一套低空运营系统跑通。</p>\n  <p>一架eVTOL从A点飞到B点，看起来只是一次飞行任务。但如果把这条航线拆开，会发现它背后是一整套系统工程：起降点放在哪里？空域如何协调？适航和运行标准如何满足？乘客或货主为什么付费？天气变化怎么办？安全责任如何划分？运营成本能否被覆盖？维修、保险、调度和应急体系能不能长期支撑？</p>\n  <p><strong>这些问题，正在成为eVTOL从“飞起来”走向“用起来”的关键。</strong></p>\n  <p>低空经济上半场，行业关注谁能先飞起来；下半场，更关键的问题是，谁能让它安全、合规、稳定、低成本地运行起来。</p>\n  <h2><strong>一条航线，远比飞行器复杂</strong></h2>\n  <p>eVTOL 最容易被看见的，是飞行器本身。</p>\n  <p>这并不难理解。相比空域管理、适航审定、运营调度和安全责任，飞行器更直观，也更有传播性。一架可以垂直起降的航空器、一场低空飞行演示、一张未来城市空中交通的想象图，都能快速让公众感受到低空经济的技术进度。</p>\n  <p>但商业化不是展示，适航审定进度，正在成为观察 eVTOL 商业化的重要指标。公开资料显示，国内已完成19个无人驾驶航空器型号审定工作，在审新兴航空器型号数量超过70个。这说明行业已经开始从早期试飞、演示和技术验证，进入更严格的审定与运行准备阶段。</p>\n  <p>以亿航EH216-S为例，公开信息显示，该机型已获得中国民航局颁发的型号合格证、标准适航证和生产许可证；2025年，其相关运营航司又获得运营合格证。运营合格证意味着企业具备安全、合规开展商业飞行的能力，也标志着eVTOL商业化从“产品取证”进一步走向“运营取证”。</p>\n  <p>另一个案例是峰飞V2000CG。民航华东地区管理局信息显示，V2000CG是华东局受理的首个吨级以上电动垂直起降航空器系统项目，审查组基于eVTOL设计及运行特点开展适航审定，历时1年5个月完成型号合格审定工作。</p>\n  <p>这些案例说明，行业已经从“能不能造出来、飞起来”，进入“能不能合规生产、交付、运行”的新阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_e103d5497d9849bbaead8eb4b28452f5@5510391_oswg2716369oswg3840oswg2160_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对&nbsp;eVTOL 来说，真机亮相只是起点。真正进入真实场景之后，它首先要面对的是航线问题。一条&nbsp;eVTOL 航线要成立，至少要回答三个问题。</p>\n  <p><strong>第一个问题是需求是否足够稳定。</strong></p>\n  <p>无论是载人出行还是载货运输，eVTOL 都不能只靠偶发需求形成商业闭环。它需要稳定客流、货流或公共服务需求。比如，城市核心区到机场、城市群之间的短途通勤、海岛和山区运输、应急救援、医疗转运、消防巡查、城际物流等场景，是否真的存在高频、刚性、可付费的需求？</p>\n  <p>如果需求不稳定，eVTOL 就很容易停留在试飞、演示和单点示范。</p>\n  <p><strong>第二个问题是成本是否能够跑通。</strong></p>\n  <p>eVTOL 的成本，不只是飞行器本身的采购和制造成本。真正进入运营后，它还包括适航验证、起降场建设、航线运营、能源补给、维修保障、飞行调度、安全管理、保险和人员培训等成本。</p>\n  <p>这意味着，eVTOL 的商业化并不是简单替代地面交通，而是重构一套新的低空出行或低空运输链路。如果它不能在特定场景中证明时间价值、效率价值或公共服务价值，就很难从“能飞”走向“常态化运行”。</p>\n  <p><strong>第三个问题是责任是否足够清晰。</strong></p>\n  <p>eVTOL 一旦进入城市和公共空间，安全和责任就会成为商业化前提。它飞过哪里、由谁调度、谁来监管、发生事故怎么定责、乘客如何保障、货物如何赔付、数据如何留存，都需要明确规则。</p>\n  <p>这种系统压力已经开始显现。中国民航局公开数据显示，截至2026年3月底，我国实名登记无人机超过380万架，操控员数量超过43万人；2025年，无人机累计飞行4530万小时，同比增长近70%。低空飞行活动规模快速扩大，意味着未来eVTOL等更高安全等级的载人载货飞行器进入低空空域时，对通信、导航、监视、气象、调度和安全监管的要求只会更高。</p>\n  <p>这也是&nbsp;eVTOL 与普通硬科技产品不同的地方。</p>\n  <p>一些技术产品只要性能足够强，就有机会被市场快速接受；但&nbsp;eVTOL 不一样，它天然进入公共空间，涉及空域、安全、城市治理和公众信任。飞行器能飞只是起点，能不能被社会系统接受，才决定它能不能真正扩张。</p>\n  <h2><strong>商业化卡在运营系统</strong></h2>\n  <p>从&nbsp;eVTOL 继续往下看，会发现低空经济真正稀缺的，不只是更先进的飞行器，而是一套能够让飞行器长期运行的运营系统。</p>\n  <p>这套系统至少包括几个层面。</p>\n  <p><strong>首先是适航和安全体系。</strong></p>\n  <p>对载人载货飞行器来说，适航不是附加环节，而是进入商业化的入场券。无论是载人出行还是载货运输，飞行器都必须证明自身在设计、制造、测试、运行和维护环节具备足够安全性。</p>\n  <p>这也是为什么&nbsp;eVTOL 的商业化节奏很难只由企业自身决定。它需要监管体系、测试验证能力、适航审定资源和运行标准同步推进。</p>\n  <p><strong>其次是基础设施。</strong></p>\n  <p>eVTOL 的垂直起降能力降低了对传统机场的依赖，但并不意味着它不需要基础设施。真正运行起来，它需要起降点、能源补给、通信导航、低空感知、气象服务、运行管理和应急保障。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_b14e0054475c472ba9d6af73d153a9f9@5510391_oswg2732524oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这也解释了为什么低空经济不能只靠整机企业推进。中国民航局公开信息提到，低空服务保障能力建设正在加快推进，包括建设民用低空飞行服务调度平台，持续完善低空通信、导航、监视、气象一体化保障能力，推动构建低空监视网络；同时，全国共建成飞行服务站47个，其中38个通过民航地区管理局符合性检查；“十五五”期间，努力实现民用无人机实名登记率100%，有效无人机操控员执照持有人数量超过100万人，民用低空航空器年飞行总量超过8000万小时。</p>\n  <p>对eVTOL而言，这些能力不是背景设施，而是未来能否进入常态化运营的前提。</p>\n  <p><strong>再次是运营调度。</strong></p>\n  <p>eVTOL 进入真实场景后，不是一架飞行器单独飞行，而是多架飞行器、多条航线、多类场景共同运行。如何调度、如何避障、如何应对天气变化、如何处理突发情况，都会影响商业化效率。</p>\n  <p>这也意味着，eVTOL 的竞争不只是整机企业之间的竞争，也会延伸到航电系统、通导监感知、安全监管、低空基建、运行服务等环节。</p>\n  <p><strong>最后是公众信任。</strong></p>\n  <p>载货飞行器可以先从货物和公共服务场景切入，但载人飞行器最终要面对普通乘客。用户是否愿意坐，是否愿意为更快的通勤或城际出行付费，是否相信它足够安全，都会影响&nbsp;eVTOL 的商业化速度。</p>\n  <p>从这个角度看，eVTOL 真正要完成的，不只是技术验证，而是社会信任的建立。</p>\n  <h2><strong>载人之外，载货先行</strong></h2>\n  <p>eVTOL 最有想象力的场景，往往是载人出行。</p>\n  <p>空中通勤、机场接驳、城际飞行、城市群短途运输，这些场景都足够吸引人。它们也最容易让公众理解低空经济的未来图景：原本在地面拥堵中消耗的时间，被一条低空航线重新组织。</p>\n  <p>但从商业化难度看，载人出行也可能是门槛最高的场景。</p>\n  <p>它对安全、适航、运营、保险、公众信任和城市管理的要求更高。一条载人航线，不仅要证明飞行器能飞，还要证明乘客愿意坐、监管允许飞、城市能够管、事故责任可追溯、运营成本可持续。</p>\n  <p><strong>相比之下，载货、应急、消防、巡检、城际运输等场景，可能更早成为&nbsp;eVTOL 和其他载人载货飞行器验证运营能力的切入口。</strong></p>\n  <p>峰飞V2000CG就是一个典型案例。作为吨级以上eVTOL航空器系统项目，它的取证路径说明，货运、应急、特殊区域运输等场景，可能会成为载人载货飞行器率先验证运营系统的入口。公开资料显示，V2000CG主要面向低空物流、紧急物资运输和应急救援等场景，并已完成型号合格审定。</p>\n  <p><strong>这些场景未必像“空中打车”那样有传播性，但它们更容易证明低空经济的实际价值。</strong></p>\n  <p>也就是说，低空经济不能只看“什么时候能空中通勤”，也要看载货、应急、消防、巡检、物流和公共服务这些场景能否率先跑通。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_9bb38ff4d6ce4b948cf5326e69d53369@5510391_oswg3303734oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对&nbsp;eVTOL 而言，商业化可能不是一步到位进入大众出行，而是先在载货和公共服务场景中验证安全、调度、成本和运行体系，再逐步走向更大规模的载人场景。</p>\n  <p>真正重要的问题，不是还有多少飞行器会亮相，而是这些飞行器能进入多少条可重复运行的航线，能服务多少个真实场景。</p>\n  <h2><strong>看懂低空经济，需要进入产业现场</strong></h2>\n  <p>也正因为如此，理解&nbsp;eVTOL 和低空经济，不能只停留在新闻、政策和融资事件里。</p>\n  <p><strong>很多问题，只有进入产业现场才会变得具体</strong>：一架&nbsp;eVTOL 旁边，是否有做航电、动力、材料、通信、定位和安全监管的企业？一条低空航线背后，是否有地方政府、场景应用方和运营服务机构参与？一次低空飞行演示，是否能看到调度、响应、通信和安全机制？一场论坛讨论的，是概念热度，还是适航、运营、合规、人才、保险和场景落地这些真实问题？</p>\n  <p><strong>这也是&nbsp;2026 国际低空经济博览会值得放到行业变化中观察的原因。</strong></p>\n  <p>根据公开信息，2026 国际低空经济博览会将于 7 月 22 日至 25 日在国家会展中心（上海）举办，主题为“驭低空新势，启经济新篇”。本届展会规模预计为 6 万平方米，汇聚 400 余家参展商，并设置 80 余场会议和活动。</p>\n  <p>如果只把它理解为一次低空装备展示，就低估了这类展会在当下的意义。</p>\n  <p>从已公布的参展阵容看，展会一方面聚集了亿航智能、沃兰特航空、时的科技、蓝色向量&nbsp;SKYLA、沃飞长空、峰飞航空、御风未来、览翌航空等 eVTOL 整机厂商；另一方面，也覆盖航空电子、材料增材、通导监感知、安全治理、低空基建等配套环节。</p>\n  <p><strong>这意味着，展会真正值得观察的，不只是&nbsp;eVTOL 真机本身，而是围绕这些飞行器形成的产业协同网络。</strong></p>\n  <p>一架载人载货飞行器要进入商业化，需要的不只是整机厂。它还需要核心零部件企业提供可靠的系统支撑，需要材料企业帮助飞行器减重和提升安全性，需要通信、导航、感知企业保障低空运行，需要安全治理和适航验证体系提供底层保障，也需要地方政府、金融机构、法律服务机构、科研院校和人才平台共同参与。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_f7baf4a6f3a940b1831ca30edebaa153@5510391_oswg3719157oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p><strong>展会把这些角色放到同一个现场，提供了一个观察低空经济商业化进程的窗口。</strong></p>\n  <p>同时，展期内围绕&nbsp;eVTOL、基础设施、安全运营、物流、金融保险、人才教育等方向设置的会议和活动，也对应了 eVTOL 从“飞起来”走向“运营起来”所必须补齐的能力。</p>\n  <p>例如，先进低空飞行器（eVTOL）设计研发、测试与核心零部件技术论坛，指向的是整机和关键系统能力；低空经济基础设施发展大会、低空空管基础设施发展论坛、低空起降场地规划建设发展论坛，讨论的是飞行器进入航线所需要的基础设施；低空安全与运营管理学术论坛、无人机安全专业委员会年度会议、低空金融保险发展论坛，则对应安全、运营、责任和风险保障；低空产业人才发展与教育创新论坛，则回应行业从试飞走向运营后对复合型人才的需求。</p>\n  <p><strong>这些议题看似分散，本质上都指向同一个问题：eVTOL 要真正商业化，不能只有飞行器，还要有基础设施、监管体系、运营服务、金融保险、人才供给和场景组织能力。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4294ac8ea951427ba378dac2d0b94f33@5510391_oswg2438475oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>展会中的低空百大应用飞演、无人机飞行嘉年华、青少年智能救灾创新展示等活动，则提供了另一个角度：让低空经济从产业话题进入具体场景。</p>\n  <p>对公众来说，飞行演示和体验活动的意义，不只是“看飞行器飞起来”，而是看到低空技术如何进入应急、消防、物流、文旅和公共服务。对产业方来说，这些活动则是观察场景需求、验证产品能力、寻找合作入口的现场。</p>\n  <p>因此，这场展会更像一个进入低空经济的产业现场。它不是单纯告诉人们“低空经济很热”，而是让人看到：eVTOL 如何从展台走向航线，载人载货飞行器如何进入真实场景，产业链上下游如何围绕安全运行和商业化落地完成协同。</p>\n  <h2><strong>行业信心来自可复制的场景&nbsp;</strong></h2>\n  <p>低空经济真正进入大众生活时，公众看到的可能是一次机场接驳、一条城际低空航线、一单高时效货物运输、一场低空文旅体验，或者一次更快抵达现场的应急救援。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_180ce4d512eb444186268f3975f240f6@5510391_oswg4953418oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这些都是看得见的应用。</p>\n  <p><strong>但在这些应用背后，真正决定它们能否稳定运行的，是一整套看不见的系统：航线是否稳定，起降点是否完善，适航和监管是否清晰，运营成本是否可控，安全责任是否可追溯，人才是否能够跟上，公众是否能够建立信任。</strong></p>\n  <p>从EH216-S先后取得适航相关证件并推动运营资质落地，到V2000CG这类吨级以上eVTOL完成型号合格审定，再到本届博览会聚合整机、航电、材料、通导监、低空基建、安全运营、金融保险和人才教育等资源，低空经济的进度条已经不只写在单次飞行演示里，而是写在一条越来越清晰的产业协同链条里。</p>\n  <p>eVTOL 的行业信心，不会只来自概念热度，也不会只来自单次飞行演示，而是来自越来越多可被看见、可被体验、可被复制的运行路径。</p>\n  <p>从这个角度看，2026 国际低空经济博览会的标杆意义，不只是集中展示当下的技术和产品，更是提供一个产业现场：让行业参与者、资本方、场景方和公众能够更具体地理解低空经济，更切身地感受载人载货飞行器的产业进度，也更清晰地看到它从概念热度走向商业化落地的路径。</p>\n  <p>低空经济的上半场，行业关注谁能先飞起来；低空经济的下半场，更关键的问题是，谁能让它安全、合规、稳定、低成本地运行起来。</p>\n  <p>飞行器决定低空经济的想象力，运营系统决定低空经济的商业化速度。</p>\n  <p>而一个真正有价值的产业平台，能做的不只是展示当下，更是为行业建立信心，为未来发展提供可被看见、可被体验、可被参与的入口。</p>", "category": "tech", "published_at": "2026-07-08T09:36:57+00:00", "fetched_at": "2026-07-09T02:32:45.472566+00:00", "fingerprint": "1d8c00e8e3e72e7c"}, {"source": "36氪 - 最新文章", "title": "8点1氪｜小米将发布澎程系列增程SUV；OpenAI首席未来学家宣布离职；张小龙辞任粉笔首席执行官、董事会主席", "url": "https://36kr.com/p/3887648675133960?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>工信部：AI编程工具Claude Code存在安全后门隐患，危害严重</li>\n   <li>字节绩效规则调整：加大半年激励，加强字节范与领导力考核</li>\n   <li>沙特阿美大降价吸引亚洲买家，国际机构看空下半年油价</li>\n   <li>欧盟法院驳回苹果上诉，维持App Store和iOS“看门人”认定</li>\n   <li>摩根大通：投资者低估了特斯拉与SpaceX合并的潜在障碍</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>小米汽车新产品系列命名为SKYNOMAD，雷军回复上市时间</strong></p>\n  <p>7月8日，小米汽车官方微博发布主题为“SKYNOMAD”的海报，“SKY”指天空，“NOMAD”指游牧者，海报上带有小米品牌LOGO。据媒体报道，小米汽车首款增程式SUV将归属全新独立子品牌“SKYNOMAD”，计划于2026年下半年正式发布。SKYNOMAD并非此前网传的“红米汽车”，而是小米汽车继SU7、YU7后的新产品新型号。据悉，该车型内部代号为昆仑N3，此前网传的“YU9”命名已被取消。同日，小米创办人，董事长兼CEO雷军在个人账号官宣小米汽车新系列SkyNomad。其评论区下有网友询问车辆发布时间，雷军回复表示“快了”。（界面新闻、36氪）</p>\n  <p><strong>OpenAI首席未来学家宣布离职</strong></p>\n  <p>北京时间7月8日，OpenAI首席未来学家（Chief Futurist）约书亚·阿奇亚姆（Joshua Achiam）在社交媒体发文表示，将于本月离开这家他效力了近九年的公司。34岁的阿奇亚姆表示，离开没有具体原因，而是长久以来深思熟虑的结果。现在全世界都已经知道了AI发展潜力这个“秘密”，那么到顶级前沿实验室围墙之外，似乎也同样可以实现这一使命。他表示，依然坚信人类可以走向一个充满和平、空前繁荣以及充满无限社会与科学可能的未来，无论接下来做什么，他都将继续致力于推动这一愿景的实现。（界面新闻）</p>\n  <p><strong>张小龙辞任粉笔首席执行官、董事会主席</strong></p>\n  <p>36氪获悉，7月8日，粉笔发布公告，因需处理其他个人事务，张小龙已辞任执行董事、首席执行官、董事会主席、董事会薪酬委员会成员及董事会提名委员会主席，且不再担任公司任何职位，即日起生效。粉笔宣布，盛海燕将获委任为执行董事、首席执行官兼董事会主席，自7月8日起生效。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯宣布OpenAI前研究员田永龙入职，参与VLM研发</strong></p>\n  <p>从腾讯相关负责人处获悉，OpenAI前研究员Yonglong Tian（田永龙）已于近期加入腾讯大语言模型部，后续将参与 VLM（视觉语言模型）相关研发。这也是腾讯再次挖角OpenAI。去年12月17日，腾讯宣布升级大模型研发架构，新成立AI Infra部、AI Data部、数据计算平台部，任命前OpenAI高级研究员姚顺雨为“CEO / 总裁办公室”首席AI科学家（向刘炽平汇报），同时兼任AI Infra部、大语言模型部负责人（向卢山汇报），此事一度在社交媒体引发广泛关注。（澎湃新闻）</p>\n  <p><strong>报道称特朗普政府解除对OpenAI的GPT 5.6的限制</strong></p>\n  <p>据报道，特朗普政府解除对OpenAI的GPT 5.6的限制，美国商务部已批准OpenAI广泛推出其先进的GPT 5.6模型。（财联社）</p>\n  <p><strong>SpaceX AI将于7月9日向公众开放Grok4.5</strong></p>\n  <p>马斯克表示，SpaceX AI将于7月9日向公众开放Grok4.5。（财联社）</p>\n  <p><strong>OpenAI将于9日正式发布GPT-5.6系列</strong></p>\n  <p>OpenAI宣布，将于当地时间7月9日正式公开发布GPT-5.6 Sol、Terra和Luna版本。（界面新闻）</p>\n  <p><strong>OpenAI发布GPT-Live语音模型，让ChatGPT更像真人对话</strong></p>\n  <p>OpenAI正式推出新一代语音模型GPT-Live-1和GPT-Live-1 mini，对ChatGPT的语音功能进行了全面升级。新模型采用“全双工”架构，能够同时收听和说话，用户可以在AI回应时随时打断，交互方式更接近真实对话。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>工信部：AI编程工具Claude Code存在安全后门隐患，危害严重</strong></p>\n  <p>近日，工业和信息化部网络安全威胁和漏洞信息共享平台（NVDB）监测发现，AI编程工具Claude Code存在安全后门隐患，危害严重。Claude Code是美国Anthropic公司开发的AI编程工具，可根据文字需求自主完成代码编写、修复等工作。由于其内置了监控机制，未经用户同意即可向远程服务器回传用户地域、身份标识等敏感信息，受影响的Claude Code为2.1.91至2.1.196版本。</p>\n  <p>建议相关单位和用户立即开展全面排查，对于安装上述受影响版本的开发终端，立即卸载或升级至已清除相关后门代码的最新安全版本；加强核心业务网段内开发工具外联权限管控与流量监测，防止敏感数据违规外传。（第一财经）</p>\n  <p><strong>字节绩效规则调整：加大半年激励，加强字节范与领导力考核</strong></p>\n  <p>7月8日午间消息，字节跳动发布全员通知，发布2026半年绩效评估说明，本次绩效将于7月15日启动。通知内容提到，本周期开始，综合绩效E及以上的同学可获得半年激励。公司将加大激励力度，计算基数将从月薪调整为月总包（月薪+月期权/RSU）；发放形式将从100%发现金调整为25%发现金、75%发绩效期权/RSU（两者均按月匀速归属）。此外，字节跳动进一步明确字节范和领导力原则对综合绩效的影响。通知内容称，综合绩效是以业务产出为基础，综合考虑字节范、领导力原则进行整体评估。多数情况下，综合绩效与业务产出评分一致，当字节范或领导力原则表现突出或者存在不足时，可作为综合绩效上调或下调的参考。（新浪科技）</p>\n  <p><strong>B站内测上线网页内容发布平台“Toy”，使用量已突破850万次</strong></p>\n  <p>36氪获悉，B站已从6月起启动小范围内测，上线网页内容发布平台“Toy”。该平台支持将本地创意网页一键发布为站内可直接访问、可玩的互动作品（即Toy作品，简称Toy）。据了解，内测启动一个多月以来，UP主已上传超300件作品，涵盖游戏、互动叙事、工具、测试、报告、画册等多个品类。同时站内公开数据显示，平台用户体验量已累计超850万次。</p>\n  <p><strong>金饰价格集体下调</strong></p>\n  <p>7月8日早盘，现货黄金开盘即失守4100美元/盎司整数关口。8日，国内各大黄金品牌的金饰挂牌价持续下调，部分品牌克价距离年初高点跌幅高达467元。老凤祥报价1246元/克，克价距离年初高点1713元跌467元；周生生报价1249元/克，克价距离年初高点1708元跌459元；周大福报价1252元/克，克价距年内高点1706元跌454元；老庙黄金报价1255元/克，距离年初高点1722元跌467元。（中新经纬）</p>\n  <p><strong>韵达、圆通、申通退出蜂网投资</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，蜂网投资有限公司发生工商变更，上海韵达货运有限公司、上海圆通蛟龙投资发展（集团）有限公司、申通快递有限公司退出股东行列。蜂网投资有限公司成立于2013年12月，法定代表人为黄俊豪，注册资本2.5亿人民币，经营范围包括速递网络软件的研发、设计与制作，并提供相关技术咨询与技术服务等，该公司现由上海易旭朗晟企业管理有限公司全资持股。</p>\n  <p><strong>MiniMax解禁前夕，超八成Pre IPO及基石股东表态长期持有</strong></p>\n  <p>36氪获悉，在MiniMax基石投资者解禁窗口临近之际，超八成 Pre IPO 及基石股东明确表态长期看好并将继续持有。表态机构包括 Aspex、博裕、IDG、Martis Fund等基石投资人，国寿投资、徐汇资本等国资机构，以及阿里、米哈游、云启、明势等早期股东，涵盖产业战略投资者、国际长线基金、国有资本及地方产业投资平台、市场化专业投资机构和公募基金等多元类型。</p>\n  <p><strong>多家银行推出消费贷让利活动，年化利率低至3%</strong></p>\n  <p>暑期消费信贷市场迎来集中营销窗口期。记者在采访中了解到，当前，多家银行正紧抓暑期消费旺季，密集推出消费贷让利活动。其中，部分产品限时优惠年化利率最低可至3%，贴息、微信立减金、利息抵扣券等多重福利也同步上线。受访专家表示，银行推出消费贷让利活动，既是借旺季批量拓展年轻客群的短期营销手段，也是信贷环境、扩内需政策与银行优化资产结构共同驱动的结果。低价让利虽能短期刺激消费，但“价格战”并不具备可持续性，消费贷行业后续竞争重点将从利率比拼转向机构对场景搭建、精细化客群经营与差异化综合服务等方面的打造。（证券日报）</p>\n  <p><strong>高温热浪催生多维降温刚需，清凉经济扩容升级</strong></p>\n  <p>入夏以来，全国大范围高温天气持续出现，民生消暑、工业生产、算力散热等多层次降温需求集中爆发，重塑传统夏日消费格局。高温天气不仅带动家用商用制冷设备海内外订单走高，激活传统清凉消费旺季行情，更推动全社会用电负荷屡创历史新高，电力保供刚需持续释放，同时倒逼AI数据中心加速液冷技术迭代落地。分析人士指出，从民用家电产销两旺、电力产业链稳供增效，到数字基建热管理赛道扩容，清凉经济正摆脱单一季节性属性，实现向实体产业、数字经济的全域延伸与业态升级。上市公司正抢抓结构性风口，在传统赛道提质增效、新兴赛道抢先布局，全方位打开夏日经济增长新空间。（中证报）</p>\n  <p><strong>特朗普：美伊谅解备忘录“已终结”</strong></p>\n  <p>美国总统特朗普7月8日在北约峰会上说，他认为美伊谅解备忘录“已终结”。（新华社）</p>\n  <p><strong>Anthropic扩张美国纽约办公室，员工规模将翻番至1000人</strong></p>\n  <p>据报道，美国人工智能公司Anthropic当地时间7月7日宣布，将租赁位于纽约曼哈顿哈德逊街330号的一栋16层办公楼，并计划今年将纽约员工规模扩大一倍至1000人。Anthropic称，扩张前的纽约办公室已是该公司除旧金山总部外最大的办公地点。（界面新闻）</p>\n  <p><strong>多位“果链”企业人士：预计苹果折叠机可正常交付，“没听说”产品延期发售</strong></p>\n  <p>近期有市场传闻称，苹果首款折叠机产品或因产品组装复杂、良率较低等原因延期发售。对此，记者采访多位苹果链企业人士获悉，苹果折叠机产品方案早已确定，目前相关企业已进入生产旺季，相关产品正常量产中。多位人士还表示，9月交付应该“没问题”，对于产品延期传闻发售，则表示“没听说”。（财联社）</p>\n  <p><strong>沙特阿美大降价吸引亚洲买家，国际机构看空下半年油价</strong></p>\n  <p>近日国际原油供应商相继下调售价。随着霍尔木兹海峡逐步恢复通航，市场地缘风险担忧显著降温，布伦特原油价格大幅回落，国际动力煤价格也重回冲突爆发前的水平。7月6日，全球最大原油生产商沙特阿美大幅下调8月亚洲市场阿拉伯轻质原油售价，意在吸引亚洲买家。多家国际机构看空下半年油价，花旗预计布伦特原油年底或下探至60美元/桶。（证券时报）</p>\n  <p><strong>奈飞、迪士尼和YouTube拟竞购下届世界杯美国转播权，版权费或达20亿美元</strong></p>\n  <p>据报道，奈飞、迪士尼和YouTube有意同福克斯竞购2030年和2034年世界杯美国转播权，亚马逊与苹果也可能入局。知情人士称，预计国际足联与潜在媒体合作伙伴的谈判将在未来三个月内启动。今年早些时候的初步会谈中，国际足联已向各媒体公司通报，针对美国市场的英语和西班牙语转播权很可能会捆绑出售，而不再像包括2026年世界杯在内的过往赛事那样分开出售。各媒体公司的高管正针对每届赛事的美国市场转播权（涵盖英语和西班牙语）制定15亿至20亿美元预算。（界面新闻）</p>\n  <p><strong>欧盟法院驳回苹果上诉，维持App Store和iOS“看门人”认定</strong></p>\n  <p>当地时间7月7日，欧盟法院裁定，驳回苹果对《数字市场法案》（DMA）相关认定的上诉，确认欧盟委员会将App Store和iOS纳入DMA监管范围、认定苹果为这两项服务“看门人”的决定合法。法院同时认为，苹果针对iMessage相关程序提出的诉求不予受理。苹果仍可向欧盟最高法院继续上诉。此次裁决意味着苹果仍需遵守DMA规定的开放竞争义务，也可能进一步增强欧盟利用DMA加强对大型科技平台监管的力度。（界面新闻）</p>\n  <p><strong>摩根大通：投资者低估了特斯拉与SpaceX合并的潜在障碍</strong></p>\n  <p>摩根大通分析师Rajat Gupta表示，尽管特斯拉和SpaceX合并“纸面上看起来合情合理”，但目前围绕合并的猜测低估了阻碍交易的潜在障碍。Gupta称，合并将使首席执行官埃隆·马斯克能够“合并两大平台的愿景、使命和工程领导力”，两家公司共同的人工智能雄心将成为“潜在的战略黏合剂”。不过，这位分析师表示，潜在障碍包括多司法辖区的监管批准；治理和投票权对称性；以及“外界认为合并将是由SPCX主导的收购，而不是对等合并”的看法。他补充说：“总体而言，我们将关注SPCX的收购货币、监管格局以及马斯克在特斯拉的投票权，将其作为潜在合并临近的催化因素”。摩根大通表示，如果交易发生，最可能的结构将是由SpaceX主导、以全股票方式收购特斯拉，Gupta表示，这一交易结构可能最能弥合估值差距，并避免大规模现金支出。Gupta对特斯拉的评级为中性，目标价为475美元。（界面新闻）</p>\n  <p><strong>法拉利高管称中国车企像在开发快销品，驾驶情感是明显短板</strong></p>\n  <p>7月8日消息，法拉利全球营销总监埃马努埃莱·卡兰多表示，暂时并不担心被中国新兴车企赶超。其认为，中国车企在性能方面进步惊人，但驾驶情感仍是明显短板。卡兰多还表示，中国车型与法拉利产品的整体特质差异很大。中国车企更像是在开发快消品，每个月都有新车推出，消费者手里的旧车很快就会显得过时。（新浪汽车）</p>\n  <p><strong>苹果将增加与博通的合作支出，该协议预计超300亿美元</strong></p>\n  <p>苹果将增加与博通的合作支出，该协议预计将超过300亿美元，将生产超过150亿枚美国制造的芯片。（财联社）</p>\n  <p><strong>亚马逊秘密推进Alexa“智能体”计划，成本高昂引发内部担忧</strong></p>\n  <p>7月8日消息，据报道，亚马逊内部规划文件显示，公司正在秘密推进一项名为“Moonraker”的全新Alexa AI项目，旨在将这一语音助手推向AI智能体赛道。然而，该项目极其高昂的研发与运行成本已在公司内部引发广泛担忧。（界面新闻）</p>\n  <p><strong>智谱：配售新H股，所得款项总额预期约314.1亿港元</strong></p>\n  <p>36氪获悉，智谱在港交所公告，根据一般授权配售新H股，每股配售股份的配售价为1588港元。假设所有配售股份获悉数配售予承配人，配售事项所得款项总额预期约为314.1亿港元，而配售事项所得款项净额（经扣除佣金及估计开支后）预期合共约为313.75亿港元。董事会认为，通过配售事项引入额外资金，将有助于进一步增强公司资本实力，支持公司持续推进基座模型研发、技术创新、商业化落地及生态建设。</p>\n  <p><strong>SK海力士美国IPO获得逾七倍的超额认购</strong></p>\n  <p>知情人士表示，SK海力士美国IPO获得逾七倍的超额认购。这家韩国存储芯片制造商计划于周四定价。部分知情人士表示，此次发行1.779亿份美国存托凭证（ADR）吸引了全球多头基金、专注科技领域的基金、主权财富基金以及专注亚洲市场的全球投资者的认购。（新浪财经）</p>\n  <p><strong>美股三大指数收盘涨跌不一，阿里巴巴涨超11%</strong></p>\n  <p>36氪获悉，7月8日收盘，美股三大指数涨跌不一，道指跌1.09%，纳指涨0.2%，标普500指数跌0.28%。大型科技股多数下跌，特斯拉、Meta跌超2%，微软、谷歌跌超1%，亚马逊跌0.96%，SpaceX跌0.78%，奈飞跌0.77%；英伟达涨超3%，苹果涨0.88%。热门中概股普涨，阿里巴巴涨超11%，爱奇艺涨超5%，百度、京东涨超4%，拼多多、腾讯音乐涨超2%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>同创普润科创板IPO审核状态变更为“已问询”</strong></p>\n  <p>36氪获悉，上交所官网显示，上海同创普润新材料股份有限公司科创板IPO审核状态变更为“已问询”。</p>\n  <p><strong>三星电子支持的韩国AI芯片创企Rebellions计划明年在韩IPO</strong></p>\n  <p>据报道，三星电子支持的韩国AI芯片创企Rebellions首席执行官Sunghyun Park表示，该公司计划明年第一或第二季度在韩国IPO。Sunghyun Park称，Rebellions目前已开始产生实际营收，“正因如此，我们正与摩根大通及三星证券的承销团队合作筹备IPO事宜”。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>阿里Q1财报前瞻：云增长45%大超预期，电商利润恢复，闪购减亏快于预期</strong></p>\n  <p>根据市场消息，阿里巴巴2027财年Q1财报前瞻显示，阿里云收入增长加速至45%左右，大超市场预期；整体电商业务（中国电商+AIDC）利润恢复，同⽐持平，好于市场预期；淘宝闪购减亏快于市场预期。前瞻消息显示，在云和AI领域，阿里云季度收入增长加速至45%左右，大超市场预期。阿里云EBITA margin持续改善，从往季的9.1%左右加速提升至低双位数，兑现此前指引。前瞻显示，阿里基本面稳健，股价上行空间较大，截至发稿，港股阿里巴巴涨超13%，报108.3港元\\股。</p>\n  <p><strong>中孚实业：预计2026年半年度净利润同比增长154%-176%</strong></p>\n  <p>36氪获悉，中孚实业公告，预计2026年半年度归属于母公司所有者的净利润为18亿元-19.5亿元，同比增长154.42%-175.62%。业绩增长主要因上下游产业链协同降本、电解铝价格高位运行、铝精深加工高附加值产品开发及节能技改项目推进。</p>\n  <p><strong>德业股份：预计上半年净利润同比增长75%-79%</strong></p>\n  <p>36氪获悉，德业股份公告，预计2026年半年度归属于上市公司股东的净利润为26.68亿元-27.28亿元，同比增长75.28%-79.22%。业绩变动主要系海外储能市场需求旺盛，公司紧抓窗口期实现销售放量。</p>\n  <p><strong>中金公司：预计上半年净利润同比增长78%-90%</strong></p>\n  <p>36氪获悉，中金公司公告，预计2026年半年度实现归属于母公司股东的净利润为人民币77.08亿元到人民币82.27亿元，与上年同期相比，将增加人民币33.78亿元到人民币38.97亿元，同比增加78%到90%。报告期内投资银行、股票业务、财富管理等六柱核心业务协同发力，国际业务同步实现良好增长，带动整体经营业绩同比显著提升。</p>\n  <p><strong>海思科：预计上半年净利润同比增长513%-575%</strong></p>\n  <p>36氪获悉，海思科公告，预计2026年半年度归属于上市公司股东的净利润为7.90亿元-8.70亿元，同比增长513.25%-575.35%。业绩变动主要系创新药国内销售持续快速增长，以及多个产品对外授权交易收到首付款等款项，实现较大金额产品授权收入。</p>\n  <h2>投融资</h2>\n  <p><strong>“快造科技”完成10亿元融资，为一级市场消费级3D打印最大单笔融资</strong></p>\n  <p>36氪独家获悉，消费级3D打印企业“快造科技”（Snapmaker）于近期完成10亿元新一轮融资。本轮融资由凯辉基金领投，好未来战投跟投，美团战投、美团龙珠、高瓴创投、顺为资本���现有股东大比例超额追投，高鹄资本担任独家财务顾问。这是2025年以来消费硬件赛道规模最大的单笔融资之一，也是近两年一级市场消费级3D打印最大规模的单笔融资。</p>\n  <p><strong>“中科新松”完成数亿元A+轮融资</strong></p>\n  <p>36氪获悉，“中科新松”宣布正式完成A+轮数亿元股权融资，本次融资由洪泰基金、鼎晖百孚联合领投，诚通基金、大众聚鼎、广州素元等知名资本跟投，老股东东珺资本加注。</p>\n  <p><strong>“上海星合”完成数亿元融资</strong></p>\n  <p>36氪获悉，高端机床企业“上海星合”近日完成数亿元融资。本轮融资由五粮液基金领投，上市公司麦格米特跟投，深蓝资本担任长期独家财务顾问。融资资金将主要用于高端磨齿机、磨床、铣床等产品的研发投入，并推动新产品及海外市场的商业化。</p>\n  <p><strong>“星辰新能”完成近5亿元第三轮融资，正式开启Pre-IPO轮融资进程</strong></p>\n  <p>36氪获悉，近日，“星辰新能”完成近5亿元人民币第三轮融资。本轮投资方包括绍兴星辉、中信建投资本、四川绿色、东方财富投资、工银资本、长石投资、艾斯能源等多家机构。这是星辰新能继去年完成超3亿元人民币融资后，再次获得资本市场加注。本轮融资落地后，公司正式开启Pre-IPO轮融资进程。</p>\n  <h2>酷产品</h2>\n  <p><strong>谷歌发布会定档8月12日，将发布Pixel 11系列手机</strong></p>\n  <p>谷歌宣布将于美国东部时间8月12日18点在纽约举办Made By Google发布会，将发布Pixel 11系列手机。谷歌Pixel 11系列手机将彻底取消128GB版本，全系机型都将升级至256GB起步，Pro、Pro XL和Pro Fold机型额外提供1TB版本。（界面新闻）</p>\n  <p><strong>整理</strong>｜葡萄</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzI2NDk5NzA0Mw==&amp;tempkey=MTM4Ml9VM3QydVNTV2pHcjd6K2JULVdPZnlPQ0xaa3lxdWdBRmY5UzR2SHloeG9OUzlwcGpSSGVaYzROa2RKRGdLOVYtOGxDUldobHZWanZ3bjB6dkp5dHJhem8tci11bTZmOXFZeTJYbG9XVlc4TlJJQzZPRGZsOGl5aGJ1U2xCU05YbnlSMVdodkFyYnByMGV0SmtqX1ZYVVBqV0pPZE1QUzVaV3FDajVnfn4%3D&amp;chksm=680b875cabea47232952c1de690307f9c85a9fc858269ec9d05799618a402400f3095a600dc8&amp;mpshare=1&amp;scene=1&amp;srcid=0709KdQnLyOW9UQ7K1woMQAF&amp;sharer_shareinfo=363fc028524e091303d2ec0a3ec64aac&amp;sharer_shareinfo_first=306159b703c9171e13b258a68d6157b2#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-09T00:03:11+00:00", "fetched_at": "2026-07-09T02:32:45.472559+00:00", "fingerprint": "eef0ce22dfe3cec1"}, {"source": "36氪 - 最新文章", "title": "上市前夜｜35岁清华学霸冲港股IPO，做出手机指纹中国第二", "url": "https://36kr.com/p/3887659913083392?f=rss", "summary": "<p>本文约3300字，建议阅读7分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>《上市前夜》栏目聚焦企业冲刺资本市场的关键时刻。每一份招股书里，都藏着一家企业上市前的野心、周期与隐忧。这是第四期——极豪科技。</p>\n  </blockquote>\n  <p>近日，极豪科技（JIIOV Technology）正式向港交所递交招股书。这家公司做的不是手机、不是模组，而是藏在手机指纹解锁背后的那颗感知大脑。</p>\n  <p>按沙利文口径，按2025年收入计，极豪在中国智能手机生物识别解决方案市场排名<strong>第二</strong>，份额14.5%；它的指纹传感器已经装进了<strong>中国十大手机品牌里的八家</strong>。听上去是个闷声赚钱的卖铲子故事，但硬氪翻完364页的招股书后发现，这门生意的账本、股东名册和人脉网，远比中国第二要曲折。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_2ed96318b34e42b8a7e643e5d27f3292@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>光学指纹传感器贡献大头收入，亏损收窄</strong></h2>\n  <p>极豪2023—2025年收入分别为2.08亿、3.68亿、4.69亿元，三年复合增速<strong>50.1%</strong>；毛利率从26.3%一路爬到37.6%。最亮眼的是盈利��点：经调整净利润（非国际财务报告准则）从2023年亏6681.4万，收窄到2024年亏1371.2万，到2025年<strong>转正为盈利2046.4万元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_6b5f364f3caa41f087b84dff1d08516f@430412560_oswg51471oswg1080oswg589_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>看着，是熬出头了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_11388459946b40e3b2872632149a1099@430412560_oswg455534oswg1080oswg781_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但经调整口径剔除了两项：以股份为基础的付款（618.4万）和赎回负债账面值变动（2866.4万）。把这两项加回来看国际财务报告准则（IFRS）报表。2025年极豪年内亏损<strong>1438.4万元</strong>。最近三年 IFRS 净亏损分别是9178.2万、3827.7万、1438.4万。</p>\n  <p>亏损确实在快速收窄，但真实的账面还没跨过盈亏线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_9171c53c9db1429bbe670d1d66b125ff@430412560_oswg42994oswg1080oswg499_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>拆开极豪的收入结构能看到，2025年<strong>90.9%来自智能手机解决方案</strong>，贡献4.26亿元。其中是两类指纹传感器的此消彼长：<strong>光学指纹传感器</strong>，屏下指纹用的高阶方案，2025年收入<strong>2.81亿，占比60.0%</strong>，毛利率45.8%。这是增长主引擎，三年时间从0.81亿飙到2.81亿。</p>\n  <p><strong>电容式指纹传感器</strong>，侧边和背面的传统低阶方案，2025年收入1.45亿，占比30.9%，毛利率只有<strong>15%</strong>。且已见顶回落，2024年也是1.45亿，几乎零增长。</p>\n  <p>一升一降的意义很清楚。极豪整体毛利率从26.3%提到37.6%，靠的就是<strong>高毛利的光学指纹在收入里占比越来越大、低毛利的电容指纹被稀释</strong>。光学指纹主要集成在中高端机型，是真正的利润来源。电容指纹更像是走量的存量业务。</p>\n  <p>真正的变量是第三块<strong>技术服务（NRE）</strong>。这块2023年才247.9万，2025年<strong>暴增到3996.4万，占收入8.5%</strong>，毛利率高达<strong>62.3%</strong>。NRE 是一次性工程服务费，对应的是极豪给智能眼镜、具身智能客户做的前期定制开发。</p>\n  <p>侧面来看，这是极豪把故事从手机指纹往智能眼镜+具身智能延伸的第一个想象力。虽然目前占比还小，但增速和毛利率都最猛。</p>\n  <p>算一笔单位经济也能感受这门生意。极豪本质是个 Fabless 芯片+算法公司，芯片交给第三方晶圆代工，自己卖的是专有芯片+算法组合。它可在大幅保留模型精度前提下，把模型的算力需求降低1000倍以上、也能塞进边缘端跑。这是它敢用算法定义硬件、而不是迁就硬件的底气，也是光学指纹能拿到45%毛利的原因。</p>\n  <p>此外，2025年经营活动现金流<strong>转正为1225万元，</strong>2023、2024年分别为-2866.9万、-529.2万。造血刚刚开始，但至少方向对了。</p>\n  <p>值得一提的是，按2025年收入（不含iOS），中国智能手机生物识别前五名合计吃掉80.8%的市场。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_b743a5bd2373477f8b82ca7f11467f38@430412560_oswg73580oswg1080oswg330_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从表中可知，<strong>老大应为汇顶科技，收入约为极豪的3.4倍、份额49.3%，目前是个巨头</strong>。但是在这个整体增长缓慢的成熟赛道里，汇顶增速只有4.1%，而极豪跑出了44.4%的复合增速。</p>\n  <p>前五名里增速第二的公司，复合增速约15%，极豪是其三倍。按出货量计，极豪份额24.1%、也是第二。</p>\n  <p>也就是说，在一个成熟到快见顶的市场里，极豪是唯一一个还在三位数加速增长的玩家。它的差异化叙事是：<strong>别人还在用单场景算法、模组堆叠，极豪是当前中国感知交互市场里唯一有感知交互大模型的公司</strong>，用统一多模态模型把指纹、人脸、手势、眼动、触觉都收进一个架构，理论上能低成本横向扩展到新终端。</p>\n  <p>不过这套数据飞轮+统一模型是不是真护城河，得看智能眼镜和具身智能能不能兑现。目前这两块还主要是 NRE 阶段，其中智能眼镜方案已通过小米、荣耀等四家验证，vivo Vision 也用了极豪的手势方案。具身智能5毫米超薄传感器，2026 Q2 才完成模组开发。</p>\n  <p>极豪的销售模式也决定了客户集中度高，2023-2025年<strong>前五大客户占总收入 99% 、97.4% 、89.6%</strong>，<strong>单一最大客户就占 44.5% 、46.8% 、 41.4%</strong>。2025年集中度虽有下降，但一家客户拿走四成收入，仍是悬在头上的剑。</p>\n  <p>极豪<strong>不直接卖给手机品牌，而是通过代理，把芯片+算法卖给模组制造商</strong>，模组厂再整合成模组交付给品牌。招股书披露的三家大客户，客户集团B做摄像头模组+指纹模组，2023年占收44.5%，2025占比27.4%；客户A做指纹识别模组，2023年占28.2%，2025年占比41.4%。全是模组厂，不是终端品牌。</p>\n  <p>这个位置有利有弊：好处是卡在上游、被八家头部品牌选中，需求有天花板护着；坏处是<strong>极豪隔着模组厂和代理，离终端品牌隔了两层，议价权和订单能见度都受制于中间环节。</strong>一旦某家大模组厂切换供应商或砍单，或许冲击直接而剧烈。供应端同样集中，2025年前五大供应商占采购额84%，其中第一大供应商占比50.1%。</p>\n  <p>不过，极豪2025年<strong>贸易应收周转仅19天、存货周转76天、应付46天</strong>（因为主要通过代理销售、回款快）。这一点跟很多增收不增现金的硬件公司不同，极豪收钱挺利索。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_1cfaaefe26d64201ab5a1bf0dd777d10@430412560_oswg4716oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>无控股股东，旷视科技+豪威班底</strong></h2>\n  <p>极豪2020年成立至今，其完成的股权融资和股权转让为：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_05a08b25c481488c9198ca3326bee838@430412560_oswg52321oswg1080oswg428_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p><strong>第一次股权转让（2021/12）：每股仅&nbsp;2元&nbsp;，涉资1.02亿元。这是全场地板价，资方是北京千寻/北京兴昊（员工持股相关平台）</strong></p>\n  <p><strong>第二次股权转让（2021/12）：每股&nbsp;7元&nbsp;，涉资5000万元，巡星投资（OPPO 生态）透过豪威、下游供应商认识入场；</strong></p>\n  <p><strong>Pre-A 轮（2022/03，结清2022/11）：投入1亿元，每股&nbsp;12.60元，投后估值人民币18.9亿；其中韦豪5000万元、启明4000万、台湾分销巨头大联大1000万等；</strong></p>\n  <p><strong>第三/五/六次转让（2022–2024）：每股稳定在&nbsp;11.27元；</strong></p>\n  <p><strong>第四次转让（2023/08）：每股 9.62元，北京千寻转让4910万给启明；</strong></p>\n  <p><strong>A 轮（2024/06）：海河沄柏投入3300万，每股&nbsp;12.93元，投后估值人民币19.5亿；</strong></p>\n  <p><strong>第七次转让（2026/02，临上市前）：每股&nbsp;13.04元，资方为深圳陆骐1200万、厦门清悦3300万。</strong></p>\n  <p>谁是这场IPO最大赢家？看入场成本就懂。<strong>最早一批以每股2元、7元进来的机构，相对A轮12.93元、更相对未来的招股价，账面浮盈以数倍到几十倍计</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_c8606de89b2f4d61841124fe575df29a@430412560_oswg94406oswg1080oswg388_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但这里有个不寻常的信号，<strong>Pre-A 轮（2022）投后18.9亿，到 A 轮（2024）投后仅19.5亿</strong>。两年多时间，估值几乎没动。这说明极豪在2022—2024年这段时间内，一级市场并没有给它明显溢价。估值的抬升主要压在了这次IPO上，招股书也披露港股上市门槛市值须大于40亿港元。</p>\n  <p><strong>创始人陈可卿，35岁，清华计算机本硕</strong>（2014学士、2017硕士），约15年深度学习与计算机视觉经验。2017至2019年，他是北京旷视科技（Megvii）的副总经理，主导过 Face ID 云身份验证平台的开发。其通过极众创芯（13.72%）和豪宏芯勤（11.98%），合计控制<strong>25.70%投票权。</strong></p>\n  <p>极豪本质是一支从旷视出走的AI视觉团队：<strong>CFO 张亮去年11月加入</strong>，清华、毕马威出身，做过<strong>旷视战略投资高级经理</strong>，又当过港股上市公司爱芯元智（00600）的高级财务总监；<strong>独董许欣然</strong>（33岁），前<strong>旷视首席软件开发工程师</strong>，现任<strong>月之暗面（Kimi 母公司）工程副总裁</strong>；</p>\n  <p>项目管理总监孔沅、算法中心总监汤瑶博士、研发中心总监王海生，<strong>清一色前旷视班底</strong>。</p>\n  <p>招股书中，极豪唯一提到的联合创始人为陈先生（Tan Kah Ong），称“公司创立初期，豪威指派陈先生，就公司设立、初期业务规划、运营体系搭建等一系列基础事务提供战略指导与落地支持”。</p>\n  <p><strong>Tan Kah Ong，56岁，曾任豪威副总裁17年</strong>，如今是豪威投资平台上海韦豪创芯的合伙人兼董事总经理；产品营销总监方军、供应链总监李嗣勇也都出自豪威。豪威本身持股18.40%，是极豪最大的产业股东之一。极豪 Fabless 造芯、要拿晶圆产能、要打进手机供应链，豪威给的是<strong>图像传感器龙头的产业链资源</strong>。</p>\n  <p>产业资本还不止豪威。<strong>OPPO 生态的巡星投资持股4.66%，其最终实益拥有人正是 OPPO 创始人陈明永</strong>；<strong>启明创投</strong>通过启明融乾+启明融凯，合计持有5.40%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_60abd59d6ec44d4ba1e99c36248010bd@430412560_oswg48818oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>值得一提的是，极豪单一最大持股方是北京兴昊，持有22.05%，并无控股股东。</p>\n  <p>极豪的故事，是一支旷视系清华团队，用一颗感知交互大模型，在成熟到快见顶的手机指纹赛道里跑出了三倍于同行的增速，做到了中国第二、覆盖八成头部品牌。</p>\n  <p><strong>排版｜范馨雅</strong></p>", "category": "tech", "published_at": "2026-07-09T00:12:43+00:00", "fetched_at": "2026-07-09T02:32:45.472550+00:00", "fingerprint": "0ecafc4626233c06"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 物理AI公司获晶科能源、国投创新等数亿融资，要做全球能源基础设施“大脑”", "url": "https://36kr.com/p/3887726503688968?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f5ee7e0511474f27833b094691d67fa7@6221844_oswg121767oswg2276oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2200</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，物理AI企业深度智控（DeepCtrls）近期完成数亿元人民币B轮融资。本轮融资由晶科能源战略投资，国投创新、招银国际联合领投，红杉中国、源码资本、光远资本、招商局创投等老股东持续跟投。</p>\n  <p>本轮资金将主要用于核心物理AI算法与产品线的持续研发、标准化产品DeepBot的规模化拓展，以及东南亚、中东、欧美等海外市场的进一步布局，持续夯实“物理AI全球能源基础设施重塑者”的技术与市场底座。</p>\n  <p>深度智控（DeepCtrls）基于自研“PhyAI”物理AI引擎，构建了业内独有的机电能源系统物理AI模型，将物理机理与AI深度耦合，让AI真正“理解”设备底层物理特性，从根源上解决工业AI“黑箱不可信”的行业痛点，使AI具备可解释、可追溯、可迁移等能力。</p>\n  <p>“相比大多数仍停留在‘诊断建议系统’阶段的工业AI，深度智控（DeepCtrls）让AI真正理解物理世界，在真实环境中实现自主寻优、自主决策和闭环控制，已完成从市场主流的L2/L3级控制向L4/L5级AI自治的代际跨越，直击工业与智算中心领域的核心痛点。”深度智控COO张雨馨表示。</p>\n  <p>她进一步指出，以DeepSeek为代表的生成式AI，大幅提升了AI在数字世界的理解与推理能力；DeepCtrls所深耕的物理AI，则聚焦AI在真实物理世界的自动识别、自主决策、自主优化与闭环控制，是AI产业落地的终局形态。</p>\n  <p>这并非蹭热点的命名巧合，却精准道出了AI在不同发展阶段的特点与使命——深度智控（DeepCtrls）的名字与物理AI技术路线，早在2018年公司成立之初就已确立。“DeepSeek聚焦数字世界的‘深度求索’，攻克的是大模型的逻辑推理与内容创造，让AI拥有‘思考的能力’，代表AI的上半场；DeepCtrls则聚焦物理世界的‘深度控制’，攻克的是工业能源系统的自主闭环运行，让AI拥有‘动手的能力’，开启AI下半场。二者共同构成了AI从思考推理、到实体控制的完整产业闭环。”张雨馨表示。</p>\n  <p>这一路线源于创始人李辉博士二十余年的跨领域深耕与积累。从在清华大学深耕物理模型研究，到在美国劳伦斯伯克利国家实验室从事AI与能源的交叉研究，李辉逐步形成了“物理+AI”的技术路径，也为深度智控（DeepCtrls）后续的产品研发与产业化奠定了基础。</p>\n  <p>在张雨馨看来，中国完整且复杂的工业体系，为物理AI提供了全球独有的训练与验证环境。半导体、新能源、数据中心等行业不仅系统复杂、能耗高，而且对控制精度与系统稳定性的要求也极高。这些场景既是过往技术路线难以突破的领域，也成为物理AI最早实现规模化商业闭环落地、最容易跑出技术壁垒的产业场景之一。</p>\n  <p>相比不少物理AI企业仍处于概念与试点验证阶段，深度智控（DeepCtrls）自2023年商业化以来，已连续多年保持营收翻倍增长，去年实现规模化盈利，率先跑通了物理AI的商业闭环，形成了头部客户复购、标准化产品放量、智算中心与海外市场爆发的多轮驱动结构。</p>\n  <p>据了解，深度智控（DeepCtrls）已服务超过360家头部企业客户，包括台积电、长鑫存储、中际旭创、工业富联、腾讯、字节、宁德时代等头部集团企业。海量、高复杂度场景打磨出的技术能力，也逐步形成了海外企业难以复刻的壁垒。目前，深度智控（DeepCtrls）的模型基于超过30万台设备的实时运行数据持续迭代，最终炼出的PhyAI物理AI引擎，模型泛化误差低于3%，逼近系统理论最优极限。</p>\n  <p>这种在国内超复杂场景，打磨验证成熟的产品能力，成为深度智控（DeepCtrls）拓展海外市场的核心优势。2024年，深度智控（DeepCtrls）启动全球化布局，产品快速落地东南亚、中东、北美等十余个国家和地区，2025年海外业务已直接切入海外本土高端制造与智算中心核心场景。</p>\n  <p><strong>硬氪：海外业务核心竞争力是什么？未来全球化布局有什么规划？</strong></p>\n  <p><strong>张雨馨：</strong>一是物理AI的技术代差优势。海外绝大多数能源系统控制仍还停留在L2级专家规则阶段，我们的物理AI产品经头部客户复杂场景打磨成熟，具备自主寻优和闭环控制能力，因此在进入全球市场时具备明显的技术优势。二是海外智算中心市场需求的高速爆发，而能源与温控正成为新的增长瓶颈，这为物理AI产品带来了广阔的市场机会。未来我们会继续巩固东南亚市场，重点布局中东、北美等高价值市场，推动物理AI更深入地进入全球能源基础设施核心场景。</p>\n  <p><strong>硬氪：行业大多数工业AI还停留在概念验证或试点阶段，深度智控是极为稀缺的实现规模化应用且盈利的物理AI企业，核心原因是什么？</strong></p>\n  <p><strong>张雨馨：</strong>核心源于物理AI的底层技术。我们构建了机电能源系统的物理AI模型，将物理机理深度融入AI，并最终实现L4/L5级自主闭环控制。一方面，物理定律打底让AI的决策过程具备可解释性、确定性与可靠性，解决了工业场景“黑箱不可信、不敢用”的落地障碍；另一方面，物理AI模型具备强泛化性，无需在每一个新场景从零积累数据与建模，可跨设备、跨系统、跨场景迁移复制，因而自然能跑通规模化商业闭环。</p>\n  <p><strong>硬氪：未来几年公司的战略重点是什么？</strong></p>\n  <p><strong>张雨馨：</strong>AI产业的发展，正在将能源问题推向前所未有的重要位置。从Deep Learning到Deep Reasoning，再到Deep Controls，AI正在经历一次从数字认知向物理闭环控制的能力跃迁。深度智控（DeepCtrls）正在做的，是让AI不仅能够理解世界，也能够安全、可靠地优化控制真实系统。</p>\n  <p>因而我们的战略将始终围绕“物理AI能源基础设施重塑者”的定位展开：第一是纵向持续深耕PhyAI物理AI引擎，实现全场景覆盖，所有产品最终实现L5级自主智能；第二是横向拓展能力与价值，从即插即用的设备端AI控制模块，到系统级优化控制，再到算电协同与源网荷储一体化的全域能源调度；第三是加速全球化布局，我们最终重塑的，是支撑全球产业与AI算力持续运行的能源基础设施。</p>", "category": "tech", "published_at": "2026-07-09T01:20:08+00:00", "fetched_at": "2026-07-09T02:32:45.472533+00:00", "fingerprint": "043c1c63b95b88de"}, {"source": "少数派", "title": "好的桌面需要设备，更需要灯光：明基×少数派线下店体验空间升级", "url": "https://sspai.com/post/110993", "summary": "如果你最近正在考虑升级自己的桌面，或者想体验墨水屏显示器、屏幕挂灯、阅读灯在真实环境下的使用效果，欢迎来到少数派深圳线下体验店，坐下来试试看。<a href=\"https://sspai.com/post/110993\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T03:00:00+00:00", "fetched_at": "2026-07-09T02:32:44.008726+00:00", "fingerprint": "f5a8fe370d0dbf13"}, {"source": "少数派", "title": "我的出行好伙伴，用 iPhone 一站式解决旅途痛点", "url": "https://sspai.com/post/112044", "summary": "暑期将至，许多「大朋友、小朋友」都会选择在最近两个月内出游。在旅行的过程中，我们难免会遇到各种各样的问题，也会遇到各种各样令人心烦的琐事。如果你恰好在使用iPhone，不妨看看我如何从出发前、在路上、 ...<a href=\"https://sspai.com/post/112044\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T07:14:26+00:00", "fetched_at": "2026-07-09T02:32:44.008719+00:00", "fingerprint": "976375af029ba4cd"}, {"source": "少数派", "title": "乌兰布统，草原观星", "url": "https://sspai.com/post/111923", "summary": "以后争取每年都来乌兰布统这一大片地方走走看看。<a href=\"https://sspai.com/post/111923\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T09:26:49+00:00", "fetched_at": "2026-07-09T02:32:44.008712+00:00", "fingerprint": "e08e042cc9c9cb2f"}, {"source": "少数派", "title": "派早报：GPT-5.6 即将开放使用、Nothing 发布 Phone (4b) 等", "url": "https://sspai.com/post/112091", "summary": "Notion 推出全新应用 Agents、Jolla Phone (2026) 手机正式发售等。<a href=\"https:// cuts-usaid-ebola", "summary": "<p>Experts say cuts have hindered the response to DRC’s Ebola outbreak and resulted in ‘significant numbers’ of deaths</p><p>Elon Musk has an Ebola problem. SpaceX stock dropped precipitously after its initial public offering, and Tesla faces a wave of lawsuits. But instead of focusing on his companies, Musk has posted frequently on X about the US Agency for International Development (USAID), which he helped dismantle – or, in his words, feed into the woodchipper – last year.</p><p>“Elon’s USAID crash-out over the past week has been a thing to behold,” said Jeremy Konyndyk, a former top USAID official who oversaw the agency’s Ebola response in 2014-2015 and the president of Refugees International. “In a way, it’s helpful that Elon is doing this, because it’s putting attention back on the issue of what he did last year.”</p> <a href=\"https://www.theguardian.com/technology/2026/jul/07/elon-musk-doge-cuts-usaid-ebola\">Continue reading...</a>", "category": "politics", "published_at": "2026-07-07T11:00:06+00:00", "fetched_at": "2026-07-08T02:14:28.866015+00:00", "fingerprint": "5f221a2f3a20c2c2"}, {"source": "The Guardian - World", "title": "Catnip lotion as effective as Deet at repelling mosquitoes, study finds", "url": "https://www.theguardian.com/global-development/2026/jul/07/catnip-lotion-as-effective-as-deet-at-repelling-mosquitoes-study-finds", "summary": "<p>Researchers testing a cheap, homegrown oil in Uganda found what cats knew all along – it worked as well as the artificial chemical used globally </p><p>A homegrown catnip lotion has proven “just as effective as Deet” as a mosquito repellant in trials carried out in Uganda.</p><p>Catnip, or <em>Nepeta cataria</em>, is a common herb from the mint family. The chemical in the plant that causes feline euphoria – nepetalactone – also has insect-repelling properties but this has not previously been commercialised.</p> <a href=\"https://www.theguardian.com/global-development/2026/jul/
