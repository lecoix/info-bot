<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

ic Schmidt&#8217;s rocket company for a 2028 mission to Mars", "url": "https://www.theverge.com/science/952988/nasa-relativity-space-eric-schmidt-mars", "summary": "Relativity Space, the rocket company led by former Google executive Eric Schmidt, was picked to launch NASA's Aeolus payload to Mars in 2028, as reported earlier by TechCrunch. Under a new public-private partnership, Relativity Space will provide the \"spacecraft, rocket, and cruise operations\" to fly Aeolus to Mars, where the payload will \"provide the first [&#8230;]", "category": "tech", "published_at": "2026-06-19T18:41:48+00:00", "fetched_at": "2026-06-20T02:54:59.509044+00:00", "fingerprint": "e1579b10df51950e"}, {"source": "The Verge", "title": "Nothing cancels this year&#8217;s CMF phone due to RAM prices", "url": "https://www.theverge.com/gadgets/953066/nothing-cmf-phone-delayed-ram-prices", "summary": "Nothing's next budget phone is the latest victim of RAMageddon. As 9to5Google reports, Nothing co-founder Akis Evangelidis announced in a post on X that a follow-up to the CMF Phone 2 Pro won't be coming this year: We were working on a successor but with memory prices where they are right now, we can't build [&#8230;]", "category": "tech", "published_at": "2026-06-19T21:28:39+00:00", "fetched_at": "2026-06-20T02:54:59.509034+00:00", "fingerprint": "f5404674bb98e882"}, {"source": "36氪 - 最新文章", "title": "硬氪首发|moody前高管搭档大疆骨干入局陪伴机器人，锦秋领投，融资数千万", "url": "https://36kr.com/p/3859926114161665?f=rss", "summary": "<p>硬氪获悉，AI-Native科技潮玩品牌ZuzuZoos查无此园（杭州多蓝艾梦智能科技旗下）近日完成数千万元Pre-A轮融资，锦秋领投、上海复容跟投。此次融资将主要AI大模型迭代、硬件产品扩建、IP生态深化、全球市场拓展、核心团队扩容。</p>\n  <p>ZuzuZoos成立于2025年，聚焦“AI陪伴机器人+AI潮玩”。创始人董晓楠是前摩根士丹利投资银行分析师，曾任新消费独角兽企业moody事业部总经理，任职期间拉动GMV从2亿元增长至10亿元。硬件负责人是前大疆清扫机器人机械结构负责人，深耕机器人及智能硬件领域15余年，主导多款机器人研发与落地。IP设计团队来自泡泡玛特、迪士尼等IP大厂，AI团队来自智谱等头部大模型公司。</p>\n  <p>当下，陪伴机器人赛道已经涌入大量玩家，许多公司追求“更聪明”，董晓楠表示，ZuzuZoos更在意如何让AI角色真正为用户提供情绪体验，于是选择了一条差异化路径：不只是把AI机器人做成“会聊天的电子宠物”，而是尝试把AI、潮玩与IP世界观结合，创造一个有“活人感”和持续生命力的硅基伙伴。</p>\n  <p>“潮玩的底色本就带有反叛精神，消费者第一眼就能体会到它们表达的态度和潮流属性。”因此，ZuzuZoos的首发产品将推出三款原创IP：傲娇的“珍珠”，藏在一个会张合的贝壳里面；拥有柔软硅胶熊掌，会和用户拉手倾听的“小熊”；嘴巴会张合，尾巴会甩动，喜欢陪用户吐槽的“暴躁闺蜜”河马。</p>\n  <p>在这背后是一个宏大而具体的世界观设定:它们共同来自一个被算法统治的外星世界，因为意外出现bug叛逃到了地球，遭到星球警察追捕，于是他们伪装成人类的包挂，栖息在人类的包包上，开启一场与人类在地球的冒险。</p>\n  <p>“这种设定让陪伴机器人跟消费者之间的关系是平行的，有点像‘宠物小精灵走进现实’。”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260619/v2_5dcb133f5a434e3496e8ea9773e459ae@6310669_oswg997287oswg900oswg1200_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宠物小精灵走进现实</p>\n  <p>为了增加活人感，董晓楠介绍，除了外观和物理动作之外，ZuzuZoos看重声音和语言交互系统，因此请了头部大型游戏的主音频做声音系统的开发，每只IP拥有超过100种不同的声音，设定是从外星语开始学习地球语言，通过动作和声音表达情绪，如同硅基版“小猫小狗”。</p>\n  <p>在动作上，ZuzuZoos的产品将实现3-4个自由度，这意味着机器人的四肢或五官会动，能够实现复杂的动作组合。“比如摸它的爪爪，它的耳朵会折下来，表示倾听，或者单只手折过来握住你的手指；摸它的肚子，它会两手拥抱你。结合它的声音，不一样快慢和幅度的动作会有不同的情感表达。”</p>\n  <p>董晓楠认为，回归本质来看，陪伴机器人是在“创造生命”，这与IP公司做的事情非常类似。IP本身就是一个需求明确、高增速且商业化想象空间巨大的赛道，AI和机器人让IP和硬件在AI native时代拥有更强的生命感，而不只是单纯追求高智。</p>\n  <p>以下是硬氪与董晓楠的访谈节选：</p>\n  <p><strong>硬氪：ZuzuZoos的核心用户群体是18-35岁左右的女性，为什么会选择这个特定的人群？</strong></p>\n  <p><strong>董晓楠：</strong>她们是最值得被定位的用户，消费能力强，商业价值极高，而且接受新事物和获取信息的能力都非常快。这也是消费时代变迁的必然结果。虽然“Z世代情绪消费”快被说烂了，但结合马斯洛需求层次理论来看，这一代年轻女性并非物质或效率工具匮乏，大家反而更去追求体验型、内容向的东西。为情绪买单的信号在当下市场已经非常明显，现在是一个做IP的好时代。</p>\n  <p>另外，这也是我个人的人群舒适区。我之前在moody工作了4年，很多爆款产品都是我带队开发的，期间做过极其深入的人群研究，我对这波用户的洞察最深刻、最熟悉。</p>\n  <p>虽然我们从这波人群切入，但最终希望我们的AI陪伴机器人能发展成一个全人群的生意。18-35岁女性的下一波重叠人群就是小朋友，因为给小朋友买单的家长大概率也是30岁上下的女性。未来我们会根据不同人群调整产品，比如推出偏儿童或偏男生化的设计，或者是针对有强烈陪伴需求的老年人市场推出相应形态的产品。</p>\n  <p><strong>硬氪：ZuzuZoos的商业闭环路径是什么？</strong></p>\n  <p><strong>董晓楠：</strong>主要分为几个部分，一是硬件本体销售，价格定位会面向大众消费人群。二是配套周边与盲盒，当IP的故事线和品牌立住后，我们就能开启传统潮玩擅长的生意，我们会销售配套的AI周边，也会做创新型盲盒玩法。</p>\n  <p>我相信硬件是时间的敌人，软件是时间的朋友。前期我们不会在软件上马上收费，还会给用户赠送周边，后期希望通过软件的游戏化玩法进行变现，比如抽卡、IP游戏道具购买等，未来随着交互做得更好，token变现也会变成巨大的一环。总之，AI硬件是入口，真正目标是打造一个能持续运营的AI潮玩生态。</p>\n  <p><strong>硬氪：未来的销售渠道会怎么规划？</strong></p>\n  <p><strong>董晓楠：</strong>我们的市场定位是北美和中国同步做。我对中国市场非常熟悉，团队里负责北美出海的小伙伴拥有多年出海经验，曾帮助一个品牌从零起盘，现在做到年销售额超过2亿，北美市场由他主导。</p>\n  <p>我们的核心策略是线下结合线上。线下体验店冲在前面引流，毛绒和潮玩类的产品非常注重视觉和世界观的场景体验，我们会把线下快闪店做沉浸式场景化体验和设计，这有极强的吸睛和吸流能力。</p>\n  <p>线上我们会结合非常熟悉的KOL打法。在第一波推广寻找垂直且适合“文化IP发酵”的博主。因为我们产品的辐射面很广，无论是宠物类、美妆类还是潮流、潮玩类的博主，都能很好地融入进去。海外市场方面，我们会寻找一些具有国际曝光度，适合做商品化拓展的明星艺人进行合作。</p>\n  <p><strong>硬氪：业内很多陪伴机器人的早期退货率挺高的，因为情感连接需要时间培养。在降低初期退货率和提高长期留存率上，你的策略是什么？</strong></p>\n  <p><strong>董晓楠：</strong>关于退货率高的问题，我之前深入思考过，主要有两个原因，一是硬件门槛过高。很多产品往科技方向走，初始化操作繁琐，很容易第一步时就被劝退。针对这一点，我们做了大量的“减法”，没有一上来就叠加高门槛功能。同时，我们把配对蓝牙、给机器人取名字等步骤，全部设计成了沉浸式的游戏体验，让用户一上来就觉得走进了一个新世界，规避了枯燥感。</p>\n  <p>二是用户会有预期落差。很多竞品在宣传时把对话当成核心，用户买回去发现对话不够丝滑、达不到预期。我们的产品，用户首先是被形象吸引，挂在包上很好看，而且交互很直观，一摸就会动，加之设定是外星生物像婴儿一样学语，逐渐解锁和人类对话，增加了趣味性、陪伴感和粘性，给用户的感觉是一个笨笨的提供情绪价值的小伙伴。</p>\n  <p>关于长期留存率，软硬结合是重中之重。我们的软件融入了丰富的游戏化设计，比如设置日常任务与打卡、能力与情景剧解锁、AI互动等。我们对硬件最佳生命周期的预期是用户能连续挂在包上使用一年左右，到达生命周期后我们会推出二代产品，就像不断推出升级的iphone一样。当然，期间我们会通过不断更新软件玩法来保持新奇感，持续推出异色款潮玩、不同的盲盒配件和衍生周边让用户去装扮，从而拉高用户全年的互动频次和客单价。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-06-19T10:01:25+00:00", "fetched_at": "2026-06-20T02:54:59.393252+00:00", "fingerprint": "7460f502a03baf8b"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 8 部作品", "url": "https://sspai.com/post/111216", "summary": "📅本周新预告《攻壳机动队THEGHOSTINTHESHELL》正式预告6月16日，TV动画《攻壳机动队THEGHOSTINTHESHELL》发布了正式预告，宣布坂本真绫、山路和弘、安元洋贵、中村悠一配 ...<a href=\"https://sspai.com/post/111216\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-19T09:30:00+00:00", "fetched_at": "2026-06-20T02:54:57.813271+00:00", "fingerprint": "246e186c0673fb93"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7482 CNY ↑+0.11%", "url": "https://www.frankfurter.app/2026-06-19?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-06-19</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7482 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0050 (+0.11%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-06-20T02:54:56.617101+00:00", "f ax&#8217;s annual plans are 28 percent off right now", "url": "https://www.theverge.com/gadgets/952326/hbo-max-annual-plan-deal-sale", "summary": "The easiest way to save on a streaming service is often to pay for a year upfront, which HBO Max is currently making a lot cheaper. Through July 15, 2026, new and returning subscribers can get 28 percent off any of HBO Max&#8217;s yearly plans, bringing the ad-supported tier down to $78.99 ($31 off) per [&#8230;]", "category": "tech", "published_at": "2026-06-18T19:18:30+00:00", "fetched_at": "2026-06-19T03:53:08.776011+00:00", "fingerprint": "84a07816d3a172c8"}, {"source": "The Verge", "title": "You can now use the Game Boy Camera with your phone", "url": "https://www.theverge.com/tech/952173/epilogue-gb-operator-game-boy-camera-ios-android-app-iphone", "summary": "The $50 GB Operator is an accessory that lets you connect, play, and authenticate Game Boy, Game Boy Color, and Game Boy Advance cartridges on PCs and other devices. Now it's getting some new functionality for the Game Boy Camera. After turning the Game Boy Camera into a charmingly awful desktop webcam two years ago, [&#8230;]", "category": "tech", "published_at": "2026-06-18T20:22:46+00:00", "fetched_at": "2026-06-19T03:53:08.776004+00:00", "fingerprint": "a054c4b0de102ab2"}, {"source": "The Verge", "title": "Valve is so behind on Steam Controller orders that some won&#8217;t ship until 2027", "url": "https://www.theverge.com/games/952582/valve-steam-controller-reservations-orders-behind-estimated-date", "summary": "Valve has some good news and bad news about Steam Controllers. The good news: If you make a reservation for a Steam Controller, the company will now show you one of three estimates of when you'll be able to actually order your gamepad: by September 2026, by December 2026, or sometime in 2027. The bad [&#8230;]", "category": "tech", "published_at": "2026-06-18T20:26:06+00:00", "fetched_at": "2026-06-19T03:53:08.775993+00:00", "fingerprint": "ea3c8e039dfb0b74"}, {"source": "36氪 - 最新文章", "title": "蔚来补上“智驾课”，任少卿总结：智驾技术创新将重构竞争", "url": "https://36kr.com/p/3858329994875908?f=rss", "summary": "<p>文｜肖漫<br />编辑｜李勤</p>\n  <p>6月18日，蔚来同时向两代平台车型（包含8款NT2.0平台车型、4款NT2.5平台车型，以及6款NT3.0车型）推送了最新版的世界模型，这意味着，蔚来现在能让同一套复杂的智驾代码，现在能跑在不同代际的芯片上。</p>\n  <p>软件迭代节奏被硬件绑架曾是一个困扰行业的难题。很多车企无法在不同版本、配置的车型上迭代同一款软件，这带来的结果是，很长时间内只有使用最新版本硬件的车才能用上最好的软件，老车主被背刺。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_9e6fbd67138e4209a68f73c7e5110934@6310690_oswg2571161oswg4096oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蔚来部署推理跨平台兼容</p>\n  <p>任少卿的团队在 2020 年就在思考如何解决这个问题。蔚来的做法是搭建一套AI Infra——自研工具链铺平不同芯片间的鸿沟，用AI编译器提升车辆的处理速度，用 AI Agent 自动化串联全流程。</p>\n  <p>当时业内主流的做法还是用英伟达的工具进行上层部署。但当时的蔚来判断，车端芯片的工程架构会继续快速迭代，主流的架构仅能用 3-5 年。基于这一判断，蔚来决定只保留最底层的硬件接口层（如 CUDA），在此之上全面自研上层部署软件，包括推理引擎、部署框架。</p>\n  <p>另外，和大多数自研芯片的主机厂一样，蔚来也自研了编译器，实现了自动算子优化，将原本需要 1-2 周的部署时间缩短至 1-2 天，同时让端侧的推理性能提升 20% 以上。</p>\n  <p>任少卿透露，蔚来也已经引入 AI Agent 的自动化工作流，接管了原本需要工程师长时间在电脑前手动盯盘、分布执行的繁琐流程，将一次完整的模型上车部署时间从一天甚至数天，极速压缩到 2 小时以内。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_5d9c99bbd1e6435ea424322e2e0a44e1@6310690_oswg2419230oswg4096oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蔚来智驾软件能力建设</p>\n  <p>AI Infra 实现模型快速上车，车端在实际应用场景中收集高价值数据回传训练，算法团队用这些数据训练出更聪明的模型后，再次交给 AI Infra 流水线去打包上车，实现数据闭环。</p>\n  <p>任少卿直言：“在大模型时代，性能提升三个点，数据需要翻十倍；如果想提升18个点，数据则需要10倍的六次方”。也就是说，如果单靠增加专职测试车队、花钱采集物理数据，很快就会触及成本和规模的物理极限。</p>\n  <p>对于数据的理解，任少卿认为“数据的本质是算力，是‘模型+算力’运行产生的结果”。</p>\n  <p>蔚来在量产车型上以“影子模式”运行最新的待验证大模型，不干预用户驾驶，只做实时推演，一旦模型的判断与人类真实驾驶动作发生分歧，就把这个Corner Case 传回云端。</p>\n  <p>这种验证体系能跨越 NT2 和 NT3 平台，每周无感完成超 4000 万公里的主动安全测试，这相当于 1000 辆测试车连轴跑一年的数据量。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_6896af397ce644e49863a4965fcf5882@6310690_oswg2400917oswg4096oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蔚来数据Infra工程</p>\n  <p>任少卿认为，这种通过车端筛选出的 Corner Case，在总体数据量中可能只占 5%，但它提供的训练价值却比底层常规数据还要大。</p>\n  <p>另外，在云端世界模型中，蔚来会故意给 AI 制造各种极端且违反常规的陷阱，强迫神经网络学习如何在错误状态下把车重新开回正轨。</p>\n  <p>近期，业内普遍感知到蔚来智驾能力有了提升，而在任少卿看来，这并非单点算法的突变，而是对“物理 AI 发展周期”有了全新认知的结果。</p>\n  <p>任少卿将技术的发展分为四个阶段：目标不清晰的第一阶段、存在弯道超车可能的第二阶段、技术路线收敛拼人力的第三阶段，以及红利消失拼细节的第四阶段。</p>\n  <p>但到了 2023 年，随着大模型和世界模型概念的涌现，任少卿判断智驾技术又退回到了鼓励底层创新的“第二阶段”。因此蔚来在两年前果断进行了组织架构的变革，将智驾团队重组成“4x100米接力跑”（预研、主线交付、跨平台适配、量产交付），并将资源倾注在了“第一棒”的预研上。</p>\n  <p>今天外界看到的“世界模型加闭环强化学习”带来的能力提升，其实这场架构变阵叠加 Infra 底座搭好的结果。</p>\n  <p><strong>6月17日，36氪在中关村牛屋和蔚来任少卿及其团队成员进行了交流，内容经编辑：</strong></p>\n  <p><strong>问：现在很多汽车厂商都在自研大算力芯片，为什么蔚来能率先在多平台落地？</strong></p>\n  <p><strong>任少卿团队：</strong>其实在推进自研芯片研发和量产的过程中（2024年流片，到2025年3月量产），我们做了大量的工作。虽然友商布局也很早，在 AI Infra 层面，蔚来从2020年就开始布局了，尤其是自研了推理引擎、部署框架以及 AI 编译器。</p>\n  <p>正是因为有了从2020年以来的这些积累，所以当我们的自研芯片到位时，相关的工程效率已经达到了一定的高度。因此，在芯片流片回来之后，我们很快就做到了跨芯片平台的兼容。</p>\n  <p><strong>问：近期对蔚来智驾的评价有所好转，为什么在这个时间点大家能体验到版本和能力的明显提升？</strong></p>\n  <p><strong>任少卿：</strong>智驾能力的提升无非就是由三件事情构成的：新的算法、底层的硬件和底层的数据体系。</p>\n  <p>如果大家问最近这两年到底发生了什么，确实是算法架构的变化（比如世界模型、闭环强化学习），但是在这些表面之下，更深层的原因是：我们在 2023 年左右认知到，智驾的发展阶段跟前几年不太一样了。</p>\n  <p>大家看到的可能是从 Rule-base（基于规则）变成了端到端或者世界模型。但我们看到的是物理 AI 发展阶段的倒退与重构。我们定义技术的发展分为四个阶段：</p>\n  <p>在 2020 年左右，其实智驾已经进入了第三阶段，大家都在拼堆人、拼策略数量（写几万行代码）。但到了 2023 年左右，随着大模型技术的涌现，我认为智驾又退回到了第二阶段——我们又可以开始用底层的技术创新来解决问题、产生差异化了。</p>\n  <p>所以从那个时候开始，我们不只是在做新算法，也在做组织架构的变革。大概两年前，我们把组织架构变成了类似“4x100米接力跑”的形式：第一棒跑预研，第二棒跑主线状态交付，第三棒跑跨平台适配，第四棒跑具体车型的量产交付。</p>\n  <p>因为技术发展退回到了鼓励创新的第二阶段，所以我们在“第一棒（预研）”上投入了大量的资源。我们布置了不同的预研团队，最后大家看到的宏观结果是“世界模型加闭环强化学习”，但在微观层面，我们有很多创新来支撑这些架构的落地。这才是能力在这个节点爆发的底层逻辑。</p>\n  <p><strong>问：现在智驾多是谈论VLA和世界模型，竞争是不是有一个相对清晰的趋势？</strong></p>\n  <p><strong>任少卿：</strong>算法有不一样的想法非常正常，这也是我觉得人工智能进入 AI 时代或者新技术时代最有意思的点。如果大家都走同一条路，那这个世界其实也不会发展这么快。</p>\n  <p>在过去三年，整个人工智能发展非常快。我自己大概从16年就开始做智驾，从2016年到2022年，智驾的算法，或者说物理世界的算法发展是很慢的，可能最大的变化就是 BEV，最多再加个 OCC，就没了。</p>\n  <p>但是从2022年开始，整体的技术又从非常确定变得非常不确定，涌现了各种各样的机会。我们发布世界模型的时候是24年7月份，但内部开始研发是在23年下半年。那时候对“世界模型”的叫法还没有那么清晰，但是我们的想法比较简单：</p>\n  <p>第一，我们希望这个模型能用完全无监督（unsupervised），或者自监督（self-supervised）的方式去做训练，就是不需要再去标那么多的数据，而且有些数据是你人工标也标不出来的；第二，我们希望它能变成一个多模态混合的方式，也就是统一的网络。</p>\n  <p>在过去三年，我们又赶上了物理世界人工智能快速变化的周期。大家从一个非常确定的、每天干的事情可能跟前三年基本没啥区别的状态里跳出来了。就像原来写 Planning 模型、写 Planning 算法代码的同学，今天干的活儿比三年之前可能也就是多处理一些场景而已。而现在，整个模型架构、训练架构，以及刚才说的数据工程架构，其实都在一体化地发生大变革。</p>\n  <p><strong>问：现在行业内其实有两种不太一样的模型适配方法。一种是拿着筛选后的数据重新训一个小模型；第二种方法是拿着训好的大模型，蒸馏出一个小模型。蔚来认为哪种方法是未来的发展方向？以及目前的做法是什么？</strong></p>\n  <p><strong>任少卿：</strong>其实这两条路在之前的各种人工智能模型发展中一直在不断切换。有时候重新训练会更好，有时候蒸馏出来的效果更好，这跟模型大小、训练方式都有关系。对我们来说，这两个都是成熟的技术栈，所以我们在模型上会具体评估，看针对当前模型哪种方式效果更好。</p>\n  <p>对于我们现在车端跑的这个模型来说，基本上采用蒸馏的概率可能会更大一些。但我觉得，这两者在本质上对现有的算法体系不会产生太大的变化。</p>\n  <p><strong>问：蔚来是否对一些竞品车型进行过体验，比如特斯拉 FSD，蔚来的 2.5 版本在行业内预期的身位大概是什么样？</strong></p>\n  <p><strong>任少卿</strong>：特斯拉确实在数据体量和训练资源上是世界领先的，甚至我觉得它远远大于国内的公司，计算量上可能要高出一个量级以上。</p>\n  <p>单从架构的进度来说，我们在今年上半年推出了基于世界模型的闭环强化学习，然后在这个版本里还会再加一个 SFT（监督微调），应该是不落后于特斯拉的，尤其在闭环这一块，我们算是比较领先的。</p>\n  <p><strong>问：今天讲了很多关于数据的问题，未来是否有可能发展到模型不再需要对数据的强依赖，可以通过更强的 AGI（通用人工智能）能力，直接实现更强的自动驾驶能力？</strong></p>\n  <p><strong>任少卿：</strong>数据才是这个时代 AI 的根源。大家看到，除了算力的提升之外，包括端侧算力、云端算力，在过去5-10年提升了非常多，甚至是百万倍的提升。但是所有的基础模型，包括大语言模型、智驾，以及后面可能更新的一些模型，最根本的问题还是数据。</p>\n  <p>做语言模型可以把互联网的数据直接下载下来，简单做一个清洗，就有几十T甚至更高量级的数据。但是其他所有的应用都需要自己产生数据，都需要自己去解决数据获取的问题，尤其是智驾。</p>\n  <p>智驾要解决的问题就是：首先，要能产生这么大的数据量；第二，要能产生等价于 10 亿网民做筛选的结果。我显然没有这么多人工去干这个事，所以只能通过自动化了。</p>\n  <p>只有当这类既有庞大体量、又明确包含了 Corner Case 的数据产生之后，神经网络才能发挥它的作用。因为直到今天，大模型和神经网络依然是“Data Hungry”（数据饥渴）的，而且越大的模型，对数据的饥渴程度越强。所以，我们必须在物理世界的真实环境里去解决数据的问题。</p>\n  <p><strong>问：业内有一种说法认为，“如果一个自动驾驶只会开车，那么它是开不好车的”。这个您怎么看？意思可能是需要加入其他一些“通识”的数据让这个模型的能力进一步提升。您觉得这种说法有道理吗？</strong></p>\n  <p><strong>任少卿：</strong>这其实分为两个部分。第一是有更多其他来源的数据，比如我们也会用一些互联网数据，这主要是为了增加一些场景的覆盖度。</p>\n  <p>第二就是所谓的“通识”。对于人来说，我们学开车所谓的“通识”实际上就是学交规。在这些层面上，其实有两种让 AI 学习的方式：</p>\n  <p>一种方式是把大语言模型加进去来解决这个问题，我觉得这个方向有用，但在今天而言，这条路还并不是主流路线。</p>\n  <p>我们目前的解决方法实际上是通过闭环强化学习的方式，让模型明确地知道：你不能压白线，你不能闯红灯；或者更好的一种情况，如果智驾系统看到红灯倒计时还有 2 秒，那它可以不用把刹车踩得那么死。通过这种在系统闭环里不断试错、强化学习的方式去拿结果，目前来看更高效，效果也更好。</p>", "category": "tech", "published_at": "2026-06-18T12:20:28+00:00", "fetched_at": "2026-06-19T03:53:08.640975+00:00", "fingerprint": "65404d74e46baa04"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜BilibiliWorld 2026成国内首个海外售票的综合性ACG展会；让AI走进千家万户，17项举措推进“人工智能+消费”发展；快舟十一号遥十三运载火箭发射成功", "url": "https://36kr.com/p/3858015526704129?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3858412283827206\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>滴滴自动驾驶参加伦敦MOVE 2026大会</strong></a></p>\n  <p>6月17至18日，MOVE 2026大会在英国伦敦召开，滴滴自动驾驶在会上分享了来自中国的自动驾驶落地实践。在AI技术方面，滴滴自动驾驶已实现L4级全栈核心技术的自主可控；硬件方面，与广汽埃安联合打造的新一代Robotaxi车型R2已于今年1月交付，正持续在广州和北京等地开展道路测试；在场景应用上，自去年四季度在广州、北京部分示范应用区域开启全天候载客测试以来，滴滴自动驾驶始终保持安全稳定的运行表现。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858271871145217\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>菜鸟：未来4个月将在全球交付4座大型攀爬机器人仓库</strong></a></p>\n  <p>36氪获悉，6月18日，菜鸟副总裁、物流科技事业部总经理毕江华表示，菜鸟自研生产的攀爬机器人经过618大促检验，显著提升了电商供应链的智能作业能力，下一步菜鸟将加快面向全球市场投入攀爬机器人，未来四个月内，将联合电商平台、知名品牌等在国内和欧洲新交付四座大型攀爬机器人仓库。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858449200780292\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>钉钉新CEO发布全员信：成立核心平台业务部，整合悟空与MuleRun团队</strong></a></p>\n  <p>36氪获悉，钉钉新CEO陈宇森今日发布全员信，宣布成立核心平台业务部，负责钉钉等一系列核心业务，由一粟负责。整合悟空与MuleRun两个团队，成立新的悟空团队，由束骏亮负责。将直销、电销、服务商、售前、交付、客户成功团队全面整合，成立客户发展部，由杨猛负责。成立市场部，由筱琬负责。成立公司信息技术部，负责优化迭代公司各业务系统，由邓悟负责。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858395073664261\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>市场监管总局督导货拉拉落实反垄断合规整改</strong></a></p>\n  <p>前期，市场监管总局依据《中华人民共和国反垄断法》公开约谈货拉拉，要求其停止利用算法不合理压低货运价格、利用平台规则实施强制独家车贴等行为，全面开展自查整改，依法合规经营，主动回应各方关切，自觉接受社会监督。市场监管总局加强对货拉拉反垄断合规整改的全过程督导，压实平台主体责任，督促其严格落实整改要求，具体包括：停止利用算法不合理压低货运价格，严格控制多因素计价订单占比，公平合理运用调价算法，推动平均每单运价、每公里运价合理回升，并常态化公示计价规则和运价涨降理由；全面取消强制独家车贴规则，停止提高抽成、罚款等惩罚措施，并将向司机退还不合理费用1.2亿元；切实降低平台抽成费率，平台整体抽成费率由整改前约11%降至约9%，每年可减轻司机负担超13亿元。（央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858186455831560\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>曹操出行入局Robovan，计划投放10万辆</strong></a></p>\n  <p>6月18日，曹操出行在2026国际汽车及供应链博览会（香港）上宣布全面布局Robovan（自动驾驶货运车）领域。公司正式发布RoboX战略，宣布全面AI转型，致力于打造领先的物理AI移动科技平台。作为RoboX战略的重要组成部分，曹操出行计划到2030年累计投放10万辆Robovan，加速构建覆盖物流配送等场景的智能运力网络。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858184796591369\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>BilibiliWorld 2026成国内首个海外售票的综合性ACG展会</strong></a></p>\n  <p>今日，BilibiliWorld 2026（以下简称BW2026）公布售票信息，将于北京时间2026年6月20日18:00全球同步开票，展会将在2026年7月10日至12日在上海国家会展中心举办。本次BW2026将首次在超过190个国家和地区同步开票，成为全国首个面向海外观众售票的综合性ACG展会。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3858274566280453\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>KKR对Altavair的飞机租赁业务承诺投资14亿美元</strong></a></p>\n  <p>6月18日，私募股权公司KKR发表声明称，将承诺投入14亿美元股权资金，继续与Altavair合作扩大其全球商用飞机租赁投资组合。KKR表示，这项最新承诺建立在先前与Altavair合作设立的两个飞机租赁组合基础之上。此次投资主要来自KKR的基础设施和资产抵押融资策略。（界面）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858188204889345\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“Manifold AI流形空间”完成近10亿元PreA轮融资</strong></a></p>\n  <p>36氪获悉，近日，“Manifold AI流形空间”宣布完成新一轮数亿元融资，本轮新投资方包括中国国新旗下国新基金，淡马锡旗下毅峰资本，产业资本北汽产投、芯能创投，同时四家老股东超额追加投资。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3858426262557705\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>高盛：若通胀持续居高不下，美联储9月或开启“连环加息”</strong></a></p>\n  <p>据报道，高盛集团副董事长、达拉斯联储前主席罗伯特·卡普兰日前表示，如果通胀持续居高不下，美联储最早可能需要在9月加息。卡普兰还强调，美联储的政策调整极少是单次行动，利率变动通常会连续进行两到三次。（界面）</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3858455470003465\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>香港将推出五年期国债期货</strong></a></p>\n  <p>36氪获悉，香港证券及期货事务监察委员会（香港证监会）欣然宣布，香港计划于2026年8月3日推出五年期国债期货。经评估市场需求及宏观环境后，五年期国债被选为首先在香港交易及结算所有限公司（香港交易所）买卖的国债期货合约的相关资产。香港交易所一直就须获证监会批准的国债期货的推出作必要准备，并将另行公布合约细节。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858393680270599\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>让AI走进千家万户，17项举措推进“人工智能+消费”发展</strong></a></p>\n  <p>商务部等八部门发布《关于加快“人工智能+消费”发展的实施意见》，围绕提升人工智能+商品消费、扩大人工智能+服务消费等五方面，提出17项具体举措，促进人工智能进千家万户、进千商万店，更好满足人民美好生活需要。此次《意见》从供需两侧同时发力，打通了人工智能应用过程中“有产品无市场”或“有需求无供给”的结构性堵点。在商品消费领域，《意见》提出扩大智能终端供给，推动消费电子产品从功能型向智能型转变。布局人形机器人消费新赛道，加速机器人从工业场景向消费场景渗透。搭建商品首发平台促进新产品触达。打造“人、车、家”全场景联动生态，并将AI与脑机接口、增强现实等前沿技术融合，研发推出一批国际领先的新产品。在服务消费领域，《意见》围绕居家、养老、文旅、住宿餐饮、教育五大场景，也提出了多项务实举措。比如，研究将智能家居及服务应用纳入“好房子”建设指南。指导养老服务机构运用人工智能技术，布局信息化管理、智能安防等技术系统，配备智能护理机器人、康复机器人等产品。应用人工智能技术提升境外人员酒店入住服务便利性。 （央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858362375214082\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>商务部：中欧经贸领域沟通顺畅，中方愿与欧方通过对话协商管控分歧</strong></a></p>\n  <p>36氪获悉，在今天召开的商务部例行新闻发布会上，新闻发言人何亚东表示，中欧经贸领域沟通顺畅。6月9日，商务部副部长兼国际贸易谈判副代表凌激在欧盟总部与欧委会贸易和经济安全总司约根森总司长举行会谈，深入、全面地讨论了中欧贸易投资磋商机制的有关工作，为近期计划举行的部长级磋商做好准备。会谈中，欧方表示，贸易战不是欧盟对华政策目标，对中欧开展建设性对话持积极态度。中方愿与欧方共同落实双方领导人共识，通过对话协商管控分歧，妥处摩擦，促进务实合作，推动双边经贸关系健康稳定发展。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3858187276784649\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>快舟十一号遥十三运载火箭发射成功</strong></a></p>\n  <p>北京时间2026年6月17日11时58分，快舟十一号遥十三运载火箭在酒泉卫星发射中心发射升空，将微厘空间05组卫星送入预定轨道，飞行试验任务取得成功。（央视新闻）</p>", "category": "tech", "published_at": "2026-06-18T12:47:44+00:00", "fetched_at": "2026-06-19T03:53:08.640969+00:00", "fingerprint": "2c48c4d2b3b240a0"}, {"source": "36氪 - 最新文章", "title": "科氪 | 纯粹热爱的城市探索玩家而来 ，爱玛黑翼三大新车集结亮相", "url": "https://36kr.com/p/3858676671599881?f=rss", "summary": "<p>6月17日，爱玛黑翼品牌战略发布会在四川省体育馆盛大开启。体育馆化身爱玛黑翼玩家街区，潮流青年齐聚现场。爱玛黑翼以“全速热爱”为品牌主张，携爱玛黑翼S360电竞版、爱玛黑翼S360赛道版、爱玛黑翼S790赛博版三款车型重磅亮相，首位中国F1车手周冠宇以爱玛黑翼“全速领航员”身份在线助力品牌发布。爱玛黑翼的登场，标志着爱玛电动车在男性出行科技领域树立起全新坐标，正式构建起“他硬核”增长格局，向“时尚科技年轻品牌”全速进阶。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_3bd059806acb49d78b76c92527fc9f2b@517825446_oswg1379258oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>运动产品线全新品类品牌 爱玛黑翼正式亮相</strong></p>\n  <p>爱玛黑翼是爱玛旗下专为年轻男性打造的极速运动产品线品类品牌，为“纯粹热爱的城市探索玩家”而来，倡导“全速热爱”，锚定潮流新青年真实的骑行场景与情感需求，做用户全力追求热爱时“不扫兴的玩伴”。爱玛黑翼0号玩家朱诚介绍，“‘全速’所代表的是决定出发那一刻拉满的热爱状态。”对于骑行这件事，爱玛黑翼不问用户“为什么”“做什么”，只陪用户一起出发，一路奔赴。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_c9b440aedb6648efb63cdacfa014cd2d@517825446_oswg791146oswg1265oswg841_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>当下，电动两轮车行业从功能代步迈向体验升级。爱玛黑翼走在趋势前沿，在外观设计、性能操控、智能配置等方面充分适配男性出行需求，为年轻群体提供“适我化”、智能化骑行体验。爱玛黑翼以此重塑男性出行生活，让出行从通勤刚需升级为驾驶乐趣，让车辆从工具属性延伸为身份表达载体，为男性用户提供一个宣泄情绪、找回自我节奏的移动空间，陪伴用户在出行时刻尽享自由生活。爱玛黑翼的问世，是爱玛年轻化产品战略在男性极速运动领域的关键落子。它凭硬核配置和潮酷外观进入男性视野，开辟出“他硬核”增长极，补全了爱玛在男性性能科技赛道的布局，进一步提升了爱玛全人群覆盖实力。</p>\n  <p>&nbsp;</p>\n  <p><strong>爱玛黑翼新品车型齐亮相，陪伴用户探索城市生活</strong></p>\n  <p>在“爱玛黑翼玩家街区”，爱玛黑翼带来爱玛黑翼S360电竞版、爱玛黑翼S360赛道版、爱玛黑翼S790赛博版三款新品，覆盖“城市日常通勤/短途畅玩”与“城市长途通勤/周末玩乐”两大核心场景，形成从入门到旗舰的完整产品矩阵，让不同风格的玩家，都能全速奔赴自己的热爱。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_cdcc327ebe004f9bbb6f406ca335fb5b@517825446_oswg535225oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>爱玛黑翼S360电竞版是为年轻极速潮流玩家准备的”都市两轮猎装轿跑”，专为城市通勤与短途畅玩设计。爱玛黑翼灵动玩家陈聪介绍，爱玛黑翼S360电竞版设计内核就一句话：“黑翼一骑，极速撤离”，加速够爆，零百加速 10.5 秒；极速够用。最高时速 60km/h；爬坡够劲，搭载峰值最高3000W的雷霆电机，具备13.5度爬坡能力。同时，爱玛黑翼S360主打紧凑车身，街头更快，1250mm的轴距，搭配同级别最小转弯半径、45 度灵动转弯角度，穿街走巷、车流穿梭，新手也能快速上手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_6af88046368a43018b8ecd474bf7b305@517825446_oswg1365589oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>爱玛黑翼S360赛道版为“全速领航员”周冠宇同款限定涂装车型，身披01号信仰涂装，致敬赛道精神，5寸TFT智能全彩屏搭载周冠宇限定主题界面，致敬全速领航员。朱诚分享说，“爱玛黑翼想把周冠宇的这份全速热爱，带回每个玩家的城市日常。赛道上，全速向前，生活里，自由探索，这就是周冠宇和爱玛黑翼共同相信的热爱。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_01f544cdbc114e08a0a93f29f536391a@517825446_oswg303650oswg1265oswg841_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>爱玛黑翼机能玩家汤留洋发布了爱玛黑翼S790赛博版，该车型面向城市长途通勤与周末跑山等场景，以硬核配置挑战高性能电摩赛道上限，推动爱玛品牌年轻化战略升维。他介绍，爱玛黑翼S790赛博版“是专为18到30岁的热血青年打造的机甲战车，够炫酷，够快，够安全，媲美机车的优异操控性能，消灭续航焦虑，具备大满贯的实力。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_d76101c7982d4e26b91ea46d8deff17d@517825446_oswg1073015oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>硬核出圈！爱玛黑翼全速链接Z世代</strong></p>\n  <p>在年轻人眼中，车辆正在成为兴趣圈层的入场券和身份标签，在这一判断之上，爱玛持续推进时尚化、年轻化战略，深耕音乐、体育、电竞等年轻人聚集的兴趣圈层，与年轻人保持着密切、同频的沟通。爱玛黑翼还将启动高校电竞挑战赛，与电竞玩家“为热爱全速猛攻”！爱玛黑翼更是Z世代的“硬核社交货币”，它以品牌之力集合年轻玩家，陪伴他们一起在城市骑行中“开地图”。6月17日，爱玛黑翼在成都猛追湾开启痛街，将猛追湾街头打造成“纯粹热爱聚集地”，吸引大量潮流青年在此享受热爱。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_86425b60af0c45cba929e8593ec3b784@517825446_oswg1676233oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>首位中国F1车手、爱玛黑翼“全速领航员”周冠宇通过视频惊喜亮相发布会，分享自己对竞速的持续热爱和对“全速热爱”的理解：“对待热爱就应该全力以赴，赛场上拼尽全力，追求纯粹的速度。”周冠宇的加入，将赛车运动的竞技热血与爱玛黑翼深度绑定，助力爱玛黑翼快速切入赛车圈层，并辐射电竞圈等男性聚集的兴趣圈层，在年轻群体中形成强大的精神感召力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_bbcbad772c7849e394dfd98472583f5f@517825446_oswg933412oswg1265oswg841_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>热爱在更多圈层唤醒，三位玩车厂牌热情分享自己与车的故事，更有四位现场观众分享自己在电竞、音乐、Fashion、摄影等领域的专属热爱，发布会秒变大型热爱宣言现场，潮流青年用自己的方式喊出自己的“全速热爱”。</p>\n  <p>此外，爱玛电动车还与华为展开深入合作，将通过华为云、华为云盘古大模型等方面合作，持续提升车辆的智能体验。“未来的爱玛黑翼，会更智能、更好玩、更懂你，成为一个更懂年轻玩家的智慧骑行伙伴。”</p>\n  <p>目前，爱玛黑翼S360电竞版、爱玛黑翼S360赛道版、爱玛黑翼S790赛博版已在爱玛线下门店、爱玛电动车京东官方旗舰店同步开售，心怀热爱的年轻玩家可线上下单、预约到店提车，爱玛黑翼与年轻人一起，全速热爱、即刻出发！</p>\n  <p>&nbsp;</p>\n  <p>&nbsp;</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-06-18T12:49:01+00:00", "fetched_at": "2026-06-19T03:53:08.640962+00:00", "fingerprint": "7daec177c3acde7d"}, {"source": "36氪 - 最新文章", "title": "科氪 | 两轮电动车没有天花板，爱玛黑翼要用AI与硬核科技赢得年轻男性的心", "url": "https://36kr.com/p/3858803016881154?f=rss", "summary": "<p>国内两轮电动车市场正悄然迎来一场深层次的“基因突变”。长期以来，大众对两轮电动车的认知被牢牢框定在“代步工具”与“大众精品”的传统叙事里。然而，在四川省体育馆的一场发布会上，爱玛正式发布了旗下专为年轻男性打造的极速运动品类品牌——“爱玛黑翼”（AIMA BLACK WING）。首位中国F1车手周冠宇化身“全速领航员”在线助力，爱玛黑翼S360电竞版、爱玛黑翼S360赛道版以及爱玛黑翼S790赛博版三款硬核新品集结亮相。这场动作透露出的创投信号再明显不过：在女性和基础通勤赛道筑牢绝对壁垒后，传统头部巨头爱玛正以一种颠覆性的姿态，正式向年轻男性性能与运动电摩赛道发起总攻。36氪通过与爱玛科技集团三位核心高管的深度专访，试图拆解两轮电动车从功能代步全面迈向体验升级的下半场逻辑，看他们如何锚定Z世代的硬核社交货币，打破行业所谓的“天花板”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_c4d0109833fc40ad8bc2609c10a102c8@517825446_oswg1379258oswg1265oswg843_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>从行业整体的商业周期来看，“油转电”已经步入了硬核演进的第二阶段。<strong>爱玛科技集团商用产品线总监，兼任零际产品线与高速产品线总监林瀚资</strong>在接受专访时直言，目前国内两轮存量市场面临必然的升级，过去替代的是50CC到100CC的基础代步，现在则更多是125CC到150CC甚至更往上的“油转电时代”。林瀚资指出，在这种趋势下，零零后已经变成了主力，他们的认知和以前完全不同。用林瀚资的话说：“这个人群的特性是，可能继承到父母和祖父母的资产，不用为物质条件发愁，还没房贷，他的消费观变了，他更多会为自己的喜好买单，而不是为智商税买单。”正是这种用户圈层的内生力量与油转电红利的重叠，拉高了大家对高速电摩未来的认知和上限，也让林瀚资判定，高速电摩目前正处于高速增长阶段，现在还不应该去谈论行业的“天花板”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_5bb82ab9483649e5b0a22ffeeb8d8c3f@517825446_oswg76051oswg1280oswg853_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>正是看准了这股结构性红利，爱玛试图彻底打破大众对品牌的固有印象。<strong>爱玛科技集团国内事业部副总裁李鹏</strong>在面对专访时直言，以前大家对爱玛的定位普遍是满足全年龄段或全价格段的“大众精品”，且在女性产品上做到了遥遥领先，被打上了鲜明的时尚标签。但李鹏强调，两轮跟四轮面对的是同样的群体，男性空间里隐藏着巨大的机会点。为此，爱玛的核心战略是从“大众精品”向“时尚+科技+年轻”全速进阶，而在这一战略协同中，核心就是“双轮驱动”——在保持女性“她时尚”健康增长、不掉队的同时，重点发力男性品牌，用“他科技”引爆全新增长极。李鹏坦言，爱玛奋起追击，用了12到14个月的开发周期来打造黑翼品牌，实现产、销、研的一体化拉通，以此作为弯道超车的目标。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_0c602e2cc862412b8ce084988caac428@517825446_oswg87693oswg1280oswg853_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>面对市场上新势力与传统油摩巨头跨界电摩的激烈围剿，大厂的突围不能仅靠概念，必须将时尚的背后垫高硬核的技术。<strong>爱玛科技集团男性科技线总监任彪</strong>在专访中深入介绍了这条专属科技线的整体规划，他指出，年轻男性用户除了高颜值的身份标签外，核心诉求就是硬核技术带来的速度感与帅气感。任彪表示，爱玛黑翼的核心解法是“通过优化性能、智能体验和操控三个点来深挖技术壁垒。”通过在电机、电池以及整个电器的协同方面做系统评价，爱玛黑翼车型实现了超车瞬间通过峰值功率调节，让油门加速感更强，且能通过电驱系统针对山区、天桥、地库等不同场景匹配最佳体验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_43ab210370df4b889d309cba40c665d5@517825446_oswg60968oswg1280oswg853_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>在这种“底层技术大厂化、顶层产品爆品化”的策略下，爱玛黑翼新品展现出了清晰的阶梯式矩阵。主打城市日常通勤与短途畅玩的爱玛黑翼S360电竞版与赛道版，凭借1250mm的紧凑车身、同级最小转弯半径，完美适配都市街道的穿梭冲刺。而由林瀚资负责的高速产品线结晶——爱玛黑翼S790赛博版，则是一台面向18到30岁热血青年的“机甲战车”。林瀚资在回答打造初衷时指出，这完全是基于对人群分级与场景切割的深度用户分析，如同汽车一样，有人需要代步，有人需要出去玩玩和跑机械性能。在实际骑行体验中，S790在速度达到80km/h-90km/h时依然稳定，悬架调校具备极其深厚的摩托车质感。林瀚资强调，这种数字接近100码的高速状态，正是为了满足“轻玩、探索玩家”拓宽城市生活边界的需求，未来高速产品线将以此进行矩阵化的全覆盖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_2f95f63b57b349bf807cf9757ed442cb@517825446_oswg112535oswg1280oswg853_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>更具市场杀伤力的是大厂特有的定价哲学。面对竞争，李鹏坦言爱玛在定价方面做了很多功课：“研发团队要创造爆品，我的成本要严控，以此来满足年轻男性好产品的性价比。”李鹏明确指出，即使是在技术或里程升级、价格带往上走的时候，爱玛依然会坚持“加量不加价”的逻辑，用无法超越的性价比跟友商在竞争中“握手”。在36氪看来，这种通过供应链规模效应沉淀出的价格红线与爆品迭代能力，是那些缺乏供应链根基的新势力玩家所难以企及的壁垒。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_d0f98f7db53143ed8d557a4eed660f99@517825446_oswg118627oswg1280oswg852_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>", "category": "tech", "published_at": "2026-06-18T14:57:40+00:00", "fetched_at": "2026-06-19T03:53:08.640953+00:00", "fingerprint": "5fc23d495039d7ed"}, {"source": "36氪 - 最新文章", "title": "安踏发布“折纸科技”，试图从结构设计寻找跑鞋缓震新方向", "url": "https://36kr.com/p/3859469888508933?f=rss", "summary": "<p>36氪获悉，6月16日，安踏在上海创新创意设计研究院发布全新跑鞋技术平台“折纸科技（ANTA FOLD）”，并同步推出首款搭载该技术的跑鞋产品折纸H1。</p>\n  <p>过去十余年，运动鞋行业的创新主要围绕材料展开。从EVA、TPU到Pebax等高性能发泡材料，各大品牌持续通过中底材料升级提升缓震与回弹表现。近年来，随着材料性能逐渐接近瓶颈，越来越多品牌开始将研发重点延伸至结构设计领域，希望通过几何构型优化进一步释放性能空间。</p>\n  <p>安踏此次推出的“折纸科技”，正是这一趋势下的最新尝试。</p>\n  <p>根据安踏介绍，该项目由安踏创新实验室联合牛津大学、天津大学及浙江大学相关研究团队共同研发。与传统依赖材料软硬度实现缓震不同，折纸科技试图利用特定折叠结构实现受力形变与能量管理，从而构建一套新的中底缓震方案。</p>\n  <p>其核心思路源于折纸工程学（Origami Engineering）。</p>\n  <p>作为一门融合数学、材料学与结构力学的交叉学科，折纸工程近年来已被广泛应用于航空航天、机器人、医疗器械等领域。通过特定的折叠几何结构，材料能够在有限空间内实现更复杂的形态变化，并获得特殊的力学性能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260619/v2_e10820df045d437b86b8e64b3a359039@5922386_oswg178280oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ANTA H1</p>\n  <p>安踏将这一原理引入跑鞋中底设计，通过预设的折叠单元结构，使中底在受到冲击时发生可控形变，在吸收冲击能量的同时提供支撑与回弹。</p>\n  <p>发布会上，多位参与项目研究的学者对相关原理进行了介绍。其中，牛津大学教授由衷分享了折纸结构在工程领域的发展情况，天津大学教授陈焱则从折纸艺术与结构力学结合的角度，介绍了其在现代工业中的应用场景。</p>\n  <p>在产品层面，安踏计划围绕折纸科技构建独立技术平台。</p>\n  <p>首发亮相的折纸H1采用Waterbomb负泊松比结构。所谓负泊松比材料，是指其在受到拉伸时会横向扩张、受压时则同步收缩，与多数传统材料表现出的力学特征相反。这种结构近年来被广泛应用于防护装备、航空结构以及高性能缓震系统研究之中。</p>\n  <p>安踏表示，H1中底内部设置了14个负泊松比结构单元，能够根据足底不同区域的受力变化进行形变调节，在提供缓震效果的同时增强稳定性，主要面向日常跑步与城市通勤场景。</p>\n  <p>除H1外，折纸科技平台未来还将衍生出多个产品方向。</p>\n  <p>其中，代号Z1的产品将采用Square-Twist方形扭转结构，重点提升步态滚动效率；M1则采用Multi-Layer多层折叠结构，进一步强化能量储存与回弹表现，面向更高强度跑步需求。</p>\n  <p><strong>从行业角度来看，结构创新正在成为运动品牌技术竞争的新战场。</strong></p>\n  <p>近年来，包括耐克、阿迪达斯、On等国际品牌均在尝试通过中底结构设计突破传统材料限制。例如耐克的Air气垫系统本质上属于结构缓震方案；On则凭借CloudTec空腔结构建立起差异化技术标签；阿迪达斯近年来也在持续推进3D打印中底与格栅结构研发。</p>\n  <p><strong>相比单纯依靠材料升级，结构创新的优势在于能够实现更加精细化的受力控制，并为产品带来更高的差异化空间。</strong>但与此同时，其研发门槛也更高，需要长期积累力学模型、测试体系以及制造工艺能力。</p>\n  <p>值得关注的是，安踏此次发布活动并未采用传统新品发布会形式，而是以“折叠空间物理课”为主题，将技术讲解与公众科普结合。活动现场设置了学术分享、圆桌讨论以及折纸体验环节，试图以更直观的方式向消费者解释复杂的结构力学原理。</p>\n  <p>在国际市场方面，安踏已于6月13日在美国洛杉矶比弗利山庄旗舰店提前举办折纸H1体验活动，为新品进行预热。</p>\n  <p>过去几年，安踏持续加大对自主科技平台的投入。除了氮科技、虫洞科技、PG7中底等材料体系之外，此次推出的折纸科技意味着其研发方向开始进一步向结构工程领域延伸。</p>\n  <p>对于整个跑鞋市场而言，这一技术能否最终转化为消费者感知明显的产品体验，仍有待市场验证。但从行业发展趋势来看，在材料创新逐渐趋于成熟的背景下，结构创新正在成为运动品牌下一轮技术竞争的重要方向，而折纸科技也为国产运动品牌提供了一个新的技术探索样本。</p>", "category": "tech", "published_at": "2026-06-19T02:16:23+00:00", "fetched_at": "2026-06-19T03:53:08.640937+00:00", "fingerprint": "411c1b8f89cbd775"}, {"source": "少数派", "title": "具透 | visionOS 27 首个开发者测试版中值得关注的新内容", "url": "https://sspai.com/post/111198", "summary": "新环境、弧形窗口，visionOS 27 中值得关系的新内容。<a href=\"https://sspai.com/post/111198\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-18T03:30:00+00:00", "fetched_at": "2026-06-19T03:53:07.003052+00:00", "fingerprint": "10879aa48e7ee19b"}, {"source": "少数派", "title": "Nothing Phone 杂谈：活下去再谈未来，然后呢？", "url": "https://sspai.com/post/110442", "summary": "我依然相信他们能给已成红海的手机市场带来变数与惊喜，正如标志性的透明后盖与微弱闪烁的灯光，每一次触碰都仿佛钟表倒转，回到光芒与图案代表个性的千禧年代。<a href=\"https://sspai.com/post/110442\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-18T07:00:00+00:00", "fetched_at": "2026-06-19T03:53:07.003045+00:00", "fingerprint": "76082596fab2d960"}, {"source": "少数派", "title": "新玩意 244｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/111211", "summary": "编注：我们希望通过「编辑部的新玩意」介绍编辑部成员们最近在用的新奇产品，让他们自己来谈谈这些新玩意的使用体验究竟如何。内容声明：《新玩意》栏目如含有商务内容，将会在对应条目标注「广告」；若有标注「厂商 ...<a href=\"https://sspai.com/post/111211\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-18T09:23:20+00:00", "fetched_at": "2026-06-19T03:53:07.003018+00:00", "fingerprint": "51b8012cad126ccc"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7432 CNY ↓-0.61%", "url": "https://www.frankfurter.app/2026-06-18?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-06-18</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7432 CNY</b> <span style=\"color:#5cb85c;font-size:14px;\">↓ -0.0289 (-0.61%) 贬值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-06-19 for batch editing, style matching from a reference image, and sharing images through VSCO Galleries. VSCO says more features are coming later, [&#8230;]", "category": "tech", "published_at": "2026-06-17T20:43:28+00:00", "fetched_at": "2026-06-18T03:31:00.450591+00:00", "fingerprint": "56269fa5217a3ef5"}, {"source": "The Verge", "title": "Tim Cook says RAM expenses are &#8216;unsustainable&#8217; and Apple is going to raise prices", "url": "https://www.theverge.com/tech/951948/apple-tim-cook-price-increases-ram", "summary": "Apple is planning to raise prices in response to the ongoing memory shortage. In an interview with The Wall Street Journal, Apple CEO Tim Cook says \"price increases are unavoidable:\" We're doing our best to mitigate the huge increases that are being passed to us, and we've been trying to shield our customers from the [&#8230;]", "category": "tech", "published_at": "2026-06-17T21:42:21+00:00", "fetched_at": "2026-06-18T03:31:00.450585+00:00", "fingerprint": "b979a62a9b2d43a6"}, {"source": "The Verge", "title": "Midjourney Medical goes from generating ‘cat images’ to full-body ultrasound scans", "url": "https://www.theverge.com/ai-artificial-intelligence/952011/midjourney-medical-ai-ultrasound-scan", "summary": "Midjourney CEO David Holz just showed off the company's first hardware product and plans to build a San Francisco spa, which he admitted is a bit different from the \"cat pictures\" produced by its AI image generator. Dubbed The Midjourney Scanner, it's an ultrasound-based full-body scanner that uses a ring of sensors to capture vertical [&#8230;]", "category": "tech", "published_at": "2026-06-18T03:12:31+00:00", "fetched_at": "2026-06-18T03:31:00.450575+00:00", "fingerprint": "67d0422be3c1f116"}, {"source": "36氪 - 最新文章", "title": "中科院博士冲上市，市值超105亿港币", "url": "https://36kr.com/p/3857959588418823?f=rss", "summary": "<p>本文约1900字，建议阅读4分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <p>6月17日，中科闻歌（01956.HK）正式启动招股，发行价60.70港元，每手200股，市值105.07亿港元。此次IPO全球发售约1483.46万股，募资总额约9亿港元，预计6月26日在港交所主板挂牌。</p>\n  <p>上市后，中科闻歌将成为\"通用决策大模型第一股\"。在中国企业级大模型市场里，中科闻歌排第八，份额2.2%。这是一家由中国科学院自动化研究所科学家创办的公司，过去三年累计亏掉约5.83亿元（净亏损口径）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_3237579b3ea840d38302b64c40c60b24@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>这是门什么生意</strong></h2>\n  <p>从业绩来看，中科闻歌2023—2025年收入分别为2.5亿、3.18亿、4.05亿元，三年复合增速约27.4%；毛利率从44.0%一路提到50.4%、51.2%；净亏损也从2023年的2.6亿元收窄到2025年的1.67亿元。</p>\n  <p>能明显发现，中科闻歌收入在涨、毛利率超50%、亏损也在收窄。但即使在净亏损中加回股份支付（2025年4451万元）和上市相关开支（2025年2116万元）后，经调整净亏损也分别有1.86亿、 1.15亿、1亿元，对应经调整亏损率 -74.3%、-36.3%、<strong>-24.8%</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_24fdb93ce2d6479fa41d7c22ed4c7a9c@430412560_oswg50260oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>(图源/硬氪整理)</p>\n  <p>也就是说其经调整后仍亏掉四分之一的收入。</p>\n  <p>现金流方面，中科闻歌<strong>经营活动现金流连续三年大额净流出</strong>，2023—2025年分别为-1.83亿、-1.35亿、-1.88亿元，2025年流出反而最大。同期，账上现金及现金等价物从5.24亿一路降到3.25亿元。即使已经是通用决策大模型第一股，自我造血也还不稳定。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_476d36d7d2524da28d181598bd70398c@430412560_oswg27478oswg1080oswg367_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>(图源/硬氪整理)</p>\n  <p>中科闻歌核心产品是自研的决策智能操作系统DIOS，底下有三层：数据底座X-Data、雅意大模型、智能体开发平台DI-Brain。落到到收入，分为三大场景：公共服务、传媒与通信、商企。</p>\n  <p><strong>公共服务</strong>（政府治理、舆情、产业链监测）：2023年收入1.27亿，占比50.7%；2024年收入1.5亿，占比47.2%；2025年收入1.48亿，占比<strong>36.5%</strong>。最近三年占比，从一半掉到三分之一。</p>\n  <p><strong>传媒与通信</strong>（媒体融合、多模态视频生成）：2023年收入0.76 亿，2024年收入0.85亿 ，2025年收入1.22亿。</p>\n  <p><strong>商企</strong>（金融投研、银行合规、品牌舆情）：2023年收入0.36亿，占比14.5%；2024年收入 0.75亿 ；2025年收入<strong>1.29 亿，占比31.9%</strong>。三年翻了 3.5 倍，是真正的增长引擎。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_2e99358b63024fe093346f6f461ba257@430412560_oswg25047oswg1080oswg369_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>(图源/硬氪整理)</p>\n  <p>按交付方式，本地化部署始终占七成以上（2025年72.7%），这意味着收入高度依赖项目制交付，而非可复制的标准化订阅（订阅式服务占比14.2%，仍小）。这也解释了为什么毛利率虽过半、却撑不起盈利——本地化部署是重人力的项目活。</p>\n  <p><strong>客户留存率</strong>（按客户数）从2024年的66.5%回落到2025年的55.4%，但<strong>净收入留存率</strong>（按金额）却从89.8%飙到<strong>139.5%</strong>。也就是说大客户黏性强、单客户价值在涨；但隐患可能是稳定性在变差。</p>\n  <p>中科闻歌最大单一客户贡献了2023—2025年收入的24.3%、19.9%、19.1%，前五大客户合计48.0%、32.5%、37.6%——集中度虽在下降，但依然偏高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_a53a33eac9b3437181de96811a465190@430412560_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>十轮融了12.2亿，中科系班底</strong></h2>\n  <p>从2018年A轮到2025年F+轮，中科闻歌一口气融资<strong>十轮。</strong>累计融资金额超<strong>12.2亿元，</strong>吸引超40家投资机构。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_35aee4cf4ffe444caa8ae544d8a90b98@430412560_oswg228240oswg1080oswg681_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>注意：B轮与F轮每股成本，部分源于2019、2022年两次资本公积转增注册资本对每股口径的摊薄（招股书附注已说明），不宜直接当作估值高低。</p>\n  <p>值得一提的是，十轮稀释下来，<strong>董事长王磊博士IPO前直接持股仅1.78%，IPO后降到约1.63%</strong>。但他靠一致行动协议和一系列持股平台（中科三石、海南新移、闻歌智才、闻歌匠才），具有30.66%投票权。</p>\n  <p>从股东名册里能看到，\"国家队\"聚集明显：国开制造业转型升级基金、中国互联网投资基金（中网投，IPO后3.35%）、央视融媒体产业投资基金、中关村科学城、北京市人工智能产业投资基金、深创投系（深创投+红土科技IPO后约4.1%）、盈富泰克、中科创星等。</p>\n  <p>管理团队中，除了王磊博士来自中科院自动化所之外。CEO罗引博士也来自中科院自动化所，他IPO后直接持股4.24%，是直接持股最多的创始人。CTO曹家也来自中科院自动化所。王磊、罗引与联合创始人曾大军教授（多模态人工智能全国重点实验室副主任）三位通过中科三石（分别持股约75.87%、13.43%、10.70%），成为IPO后第一大股东（15.15%）。</p>\n  <p>此外，其CFO郑超敏去年5月才上任，此前是容诚会计师事务所总监，做了十多年审计。董秘马力，也是去年6月才上任，此前是中金投行部副总裁，和保荐人来自同一家。</p>\n  <p>此次IPO，吸引了6家基石，合计认购3100万美元，约占募资额27%。分别为China Orient Enhanced Income Fund（东方资产系）、嘉实国际资管、前海国际基金、国惠（香港）控股、华泰资本投资、民银国际投资。</p>\n  <p>招股书中，中科闻歌直言对手包括大型AI服务商、软件公司和系统集成商，且它们\"品牌更响、历史更长、客户更多、资源更厚\"。决策智能市场，2025年规模仅约39亿元。</p>\n  <p>中科闻歌的故事，是一群中科院自动化所科学家，用八年时间把\"企业级决策智能\"做成了一门年收入4亿、毛利率过半的生意，也赶在了AI叙事最热的窗口期。</p>", "category": "tech", "published_at": "2026-06-18T01:00:00+00:00", "fetched_at": "2026-06-18T03:31:00.287542+00:00", "fingerprint": "88b1810c7ca68e34"}, {"source": "36氪 - 最新文章", "title": "36氪「2026最具价值成长企业100」正式发布", "url": "https://36kr.com/p/3857980507919622?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_d44f88b31738421594c403c7cbabbe64@5889148_oswg292792oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>&nbsp;</p>\n  <p><strong>时代从不被旁观者定义，它只发生在那些正在成长的人身上。</strong></p>\n  <p>今天，当人们讨论华为、字节跳动、大疆、Tesla或OpenAI时，很容易忽略这样一个事实：在成为行业领导者之前，它们都曾是一家成长中的创业公司。</p>\n  <p>在初期，没有天然的市场地位，没有成熟的商业体系，也未必被所有人看好。但通过持续的技术突破和产品迭代，它们一步步从“挑战者”变成了“定义者”。</p>\n  <p>商业史本质上是一部成长史。<strong>那些最终改变产业格局的公司，往往不是起点最高的公司，而是在漫长竞争中不断积累技术、组织和市场能力的公司。</strong></p>\n  <p>当前，新一轮的技术浪潮正催生更多新赛道与新格局。基于此，今年4月，36氪重磅启动“2026最具价值成长企业100”评选，旨在寻找那些能顺应产业变革、构建长期核心竞争力、持续创造商业与产业价值的创新企业。</p>\n  <p>本次评选历时2个多月，累计收到数百份企业申报。我们从成长力、技术力、资本力、产业力和影响力五大维度出发，围绕营收及订单增长、研发投入与专利积累、机构认可度与融资节奏、全球化布局与产业链位置、团队完整度等核心指标，进行了多轮交叉验证与独立评审，最终遴选出100家<strong>定义未来的成长标杆企业。</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_a95b3037283543fd8a588f15f675f582@5889148_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>如果给这100家入围企业画一张群像，会发现几个很有意思的数据和特征。</p>\n  <p><strong>在地域分布上，北京、深圳、上海在数量上位列前三，分别贡献了26家、21家和14家。</strong>北京、上海两地入围企业多集中在人工智能/大模型、先进制造/机器人/工业自动化、生物医药/医疗器械等领域；而深圳、广州则在消费科技/品牌出海、新能源汽车/智能网联等领域表现强劲。</p>\n  <p>成立时间方面，<strong>入围企业的平均年龄仅为5.5岁，大多数诞生于2020年之后。</strong>这其中既有熬过“资本寒冬”、完成技术验证的“耐力型”选手，也有踩中技术拐点、成立于2022年后的“爆发型”黑马。</p>\n  <p>在增速上，超过70%的企业近12个月营收或订单增速超100%，<strong>其中增速超300%的企业占比高达三分之一。</strong>这些企业主要集中在机器人、半导体及商业航天赛道，正处于从“技术验证”迈向“规模化商用”的关键拐点。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_b62f61a7ee144519b9e62fac57c8f3c1@5889148_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>除了数据，我们也关注到驱动增长的底层逻辑。以下是我们在调研中发现的三个显著趋势。</p>\n  <h3><strong>“顶尖科学家+产业老兵”成硬核创业标配</strong></h3>\n  <p>十年前，一个优秀的创始人画像还是“大厂高管+连续创业者”，而今天，“顶尖科学家+产业老兵”的组合已逐渐成为硬核创业团队的标配。</p>\n  <p>创始人拥有顶尖学术背景（博士、博士后、海外名校），核心合伙人则来自一线产业公司，拥有大规模量产、供应链管理或全球销售的实战经验。</p>\n  <p>产学研的边界，正在被创业本身重新定义。调研数据显示，超过65%的入围企业核心团队兼具“博士学历”与“十年产业经验”，其中45%以上拥有头部科技公司的研发履历。尤其在量子计算、脑机接口等“深水区”赛道，这种配置几乎是入场券。&nbsp;</p>\n  <h3><strong>资本逻辑在迭代，从“融到钱”到“融对钱”</strong></h3>\n  <p>在资本寒冬尚未完全退去的2026年，融资能力依然是成长企业的生命线，但资本的逻辑正在悄然发生改变。</p>\n  <p>从入围企业的融资数据来看，有两个特征非常明显。&nbsp;</p>\n  <p><strong>第一，B轮及以前的企业占比超过60%。</strong>这意味着真正有潜力的成长企业，并不需要等到C轮之后才能被识别。早期投资的质量，正在成为衡量一家机构眼光的关键标尺。&nbsp;</p>\n  <p><strong>第二，产业资本的身影无处不在。</strong>在统计的入围企业中，超过80%的融资轮次中出现了产业投资方，包括车企、电池厂、消费电子巨头、化工集团、医疗设备公司等。产业资本带来的不只是钱，更是场景、客户、供应链和验证机会。</p>\n  <p>对于纯财务投资机构来说，竞争正在变得更加激烈。单纯提供资金和投后赋能，已经不足以打动顶尖创始人。他们需要的，是真正理解产业、能带来订单和技术协同的“聪明的钱”。</p>\n  <h3><strong>迈入“生而全球化”时代</strong></h3>\n  <p>在本次入围的100企业中，我们发现，超过60%的入围企业，在成立之初就已同步布局海外市场，国内和海外同时起步、双线并行。</p>\n  <p>这些企业的海外布局不是简单的销售出海，而是深入到研发中心设立、本地化生产、国际标准认证、甚至海外主体公司注册等层面。北美、欧洲、东南亚、中东是最主要的目标区域。</p>\n  <p>调研还发现，入围企业中，有海外布局且已开拓多个市场的企业，其研发投入占比普遍更高。这也在一定程度上说明，越是全球化，越需要更强的技术壁垒；而更强的技术壁垒，反过来又能支撑更高的定价权和更深的全球化。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_dccb7bba91fa4cc6aeff0fb23ae73374@5889148_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>过去二十年，中国商业的主旋律是“规模与效率”，那是应用层创新的黄金时代，巨头林立，赢家通吃。</p>\n  <p>但到了2026年，这条主线正在边际递减。单纯靠流量驱动的粗放增长已难以为继，模式创新的窗口也在收窄，<strong>真正的竞争力开始向底层技术迁移。</strong></p>\n  <p>我们欣喜地看到，这100家入围企业并未止步于内卷，而是将目光投向了技术密度的提升。此刻，它们或许还未尽数站在聚光灯下，但无疑正在成为下一个产业新格局的定义者。</p>\n  <p><strong>以下为本次“2026最具价值成长企业100”完整名册：</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_269d9a14aa1748b18ceb006dfe7e18c7@5889148_oswg959765oswg1080oswg11364_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>", "category": "tech", "published_at": "2026-06-18T01:09:18+00:00", "fetched_at": "2026-06-18T03:31:00.287536+00:00", "fingerprint": "619209ca5c3b0992"}, {"source": "36氪 - 最新文章", "title": "红杉、阿里押注过的具身大脑公司再融资，上交等投资数亿元｜硬氪首发", "url": "https://36kr.com/p/3856708724315400?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，具身智能企业穹彻智能（Noematrix）近日完成新一轮数亿元融资，本轮融资由无锡数据集团领投，投资方包括上海交通大学AI未来基金（创业基金）、上海创之智科技有限公司（上海创智学院全资子公司）、一村资本等。&nbsp;</p>\n  <p>这也是公司近半年来完成的又一轮融资。此前穹彻智能已获得多家机构加持，包括Prosperity7 Ventures、红杉中国、C Capital、阿里巴巴和Sea Limited等。</p>\n  <p>穹彻智能是硬氪长期关注的企业。公司成立于2023年11月，长期专注具身智能基础模型与系统的自主研发，已发布有核心产品“穹彻具身大脑”（Noematrix Brain），并围绕其构建了覆盖数据采集、模型训练到部署验证、具身机器人应用全流程的软硬件产品体系。</p>\n  <p>具身智能的行业叙事正在经历一次静默的转向。过去两年，赛道内备受追捧的能力是“完成一个动作”，抓取、搬运、行走等任务在实验室或演示台上被反复验证。但自今年以来，一个新的衡量尺度正在浮现：机器人能否在真实物理环境中持续稳定地工作，而非在可控条件下完成一次性展示。</p>\n  <p>这一转向的实质，是从“动作能力”向“工程稳定性”的重心迁移。要让机器人深度理解真实物理世界的运行规律，自主适配复杂环境的不确定性，这正是当前世界模型试图解决的问题。</p>\n  <p>在数据策略上，穹彻智能选择将真实数据与仿真数据并行纳入训练体系，其最早提出的“伴随式数据采集”方案，通过自研外骨骼CoMiner、便携式RoboPocket等数采设备，可以将数据采集以轻量化和低成本的方式拓展至家庭、办公、工业等环境，逐步构建覆盖多样物理场景的数据库。</p>\n  <p>穹彻智能认为真实数据进入模型后会让模型更加稳定和鲁棒，因为它来源于真实物理场景；仿真数据则利用其可规模化优势扩充能力边界。两者配合，而非互相替代。同时，公司还搭建了一套融合AI Agent的闭环系统，由它负责分析任务、下发指令、优化采集行为，再根据数据分布动态调整后续采集任务，极大提升高质量数据获取效率。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260617/v2_fbd40e7b5dc64b48942f68e41ed5a190@6022551_oswg3413410oswg4096oswg4096_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">穹彻智能“伴随式数据采集”方案（图源/企业）</p>\n  <p>这些数据可以为穹彻具身大脑的训练及迭代提供燃料。穹彻智能坚持通用具身智能大模型自研路线，依托海量真实场景数据进行模型预训练，让系统在投入实际使用之前就建立起对物理世界的基本认知；辅以力位混合后训练，进一步校准模型对接触状态和力觉信息的理解精度，使其输出的动作指令不仅在语义层面合理，在物理层面也可执行。</p>\n  <p>通过这套训练流程持续打磨面向实体场景的通用具身大脑Noematrix Brain，为机器人提供了从指令理解、任务规划到环境感知、执行反馈的完整决策闭环能力。同时硬氪了解到，穹彻智能还计划于近期正式发布新一代自研具身智能世界模型。</p>\n  <p>进入具体任务场景，穹彻智能机器人已在药房实现批量落地。其采用的“嵌入式升级”路线，无需改造原有货架结构，仅在2.5平方米空间内完成部署，并且直接对接门店现有订单系统，就能在原有通道环境中稳定运行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260617/v2_6f8446644eb1406593e9219847957acb@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">寻导路径规划（图源/企业）</p>\n  <p>长期以来，药房场景的商业化价值，核心在于解决行业长期存在的人力结构性痛点。线下药房普遍面临夜间订单零散、但必须专人值守的困境，单独雇佣人员值班成本高、性价比极低，是门店长期的纯成本项。而药房线上订单履约工作高度标准化，无需复杂的客户沟通与导购推销，仅需要精准、重复的拣货动作，恰好是机器人最擅长的工作场景。</p>\n  <p>与此同时，一个药房里有几千个SKU，商品由于搜找被翻乱、包装形态各异、货架陈列随时变动。种种复杂任务发生的小概率情况在真实运营状态中是常态。即便适配场景简单、作业流程标准化，但依旧充满实验室难以复刻的复杂变量。</p>\n  <p>穹彻团队表示，药房落地中真正需要应对的，更多是边角案例的积累，而非技术范式的根本突破。“一个红霉素眼膏因为包装太小、摆放角度不标准，用夹爪或吸盘都难以稳定处理；温度计因为悬挂陈列而非盒装，抓取逻辑也需要重新调整。这类特殊商品在整个SKU中占比很小，但恰恰是它们决定了系统能否从实验室迁移到真实场景。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260617/v2_db2457d5fa3f4fb8b7e8f57e79aeddac@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">药房打包（图源/企业）</p>\n  <p>目前穹彻智能已与多家头部连锁药店达成合作，进入商业交付阶段，订单规模已达千台级别。</p>\n  <p>本轮融资后，穹彻智能将持续推进具备强泛化性和高自主决策能力的具身智能大模型的研发与迭代，加速具身智能在通用零售、酒店服务等真实场景落地。</p>\n  <p><strong>以下为硬氪与穹彻智能的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：一套可落地的物理AI具身大脑，现阶段需要具备哪些成熟能力？</strong></p>\n  <p><strong>穹彻团队：</strong>具身大脑真正跑通线下场景，核心离不开三方面能力。</p>\n  <p>首先是成熟稳定的算法能力。穹彻智能早在2021年就发布了通用抓取模型，在此后几年持续迭代，抓取作业的成功率在国际上处于比较领先的水平。这套算法构成了我们药房方案的技术底座，让机器人在面对几千个SKU时仍能保持较高的操作成功率。</p>\n  <p>其次是工程化的落地能力。实验室演示环境相对理想，可走进真实门店，场地布局、商品摆放时刻都在变动，很容易影响机器人作业效果。这不仅要优化算法，还得做好现场调试与硬件适配。依托于过去服务数百家客户、落地上千类场景的交付经验，我们摸索出一套成熟方法，能做到对门店几乎零改动，让机器人快速进场投入使用。</p>\n  <p>此外，还有数据层面的支撑。真实物理环境中有大量实验室无法模拟、需要打磨的边缘场景（corner case）。比如红霉素眼膏，它的包装小、摆放角度不标准，用夹爪或吸盘都难以稳定处理；温度计因为悬挂陈列而非盒装，因此设备在抓取时也需要调整细节。这类特殊商品在整个SKU中占比不大，但恰恰是它们决定了系统能否从实验室迁移到真实场景。解决这些问题的前提，是拥有足够多、足够真实的物理世界数据。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260617/v2_08b391b253e148b793de5971318989b6@6022551_oswg4045636oswg2014oswg1336_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">穹彻智能具身机器人在药店场景中应用（图源/企业）</p>\n  <p><strong>硬氪：零售药店场景中，客户端呈现出哪些新需求与趋势？怎么衡量投入回报？</strong></p>\n  <p><strong>穹彻团队：</strong>穹彻智能现阶段重点聚焦连锁药房场景。线下药房利润空间本就紧张，人工是仅次于房租的第二大成本，因此可以看到，客户端的降本需求非常明确。药房夜间订单虽然零散，但必须有人值守，雇一个人性价比极低，而机器人恰好能承接夜间的线上拣货工作。白天它也能辅助处理订单，算下来单店平均可以减少1.5个人力。</p>\n  <p>这个价值反映在投资回报上，ROI测算逻辑很直接，就是跟人工薪资对标。就落地情况，我们的客户在采购了机器人后，回本周期大约一年半到两年。对于连锁药房来说，这个回报周期已经具备了很强的落地价值。目前落地门店主要集中在一二线城市，广州、沈阳、南通等地已有项目在跑。</p>\n  <h4><strong>投资方评论：</strong></h4>\n  <p><strong>上海交通大学、上海创智学院</strong>长期与穹彻智能在联合实验室、科研攻关等方面保持紧密合作。此次二者旗下投资平台同时入股穹彻智能，标志着彼此合作迈向“技术+资本”深度绑定的新阶段，其中上海交大AI未来基金由交大人工智能学院发起，凝聚交大的校友与行业力量，支持具有重大产业化前景的“交大系”人工智能创新项目。这不仅为穹彻智能持续引进高端科研人才、探索前沿技术提供了坚实后盾，也将巩固其在具身智能科研层面的“护城河”。未来，穹彻智能将联合上海交通大学、上海创智学院在具身智能模型前沿技术领域持续攻坚，加速具身智能技术成果向产业应用转化。</p>\n  <p><strong>无锡数据集团</strong>作为无锡市推动数字经济与数据要素市场化发展的核心力量，将携手穹彻智能等生态伙伴，共同启动了城市级全域“千企百万小时”具身智能高质量数据集联合体行动，并正式发布第一阶段建设成果。下一步，双方将依托无锡数据集团的产业资源与场景治理能力，结合穹彻智能在前沿模型与具身大脑上的技术积淀，深入推进工业数据集建设。双方将充分发挥各自在技术、数据与产业资源上的优势，推动具身智能在真实产线中落地。</p>", "category": "tech", "published_at": "2026-06-18T01:28:16+00:00", "fetched_at": "2026-06-18T03:31:00.287529+00:00", "fingerprint": "f0909c27e59da616"}, {"source": "36氪 - 最新文章", "title": "北大科学家下场做脑机接口，种子轮融了近亿元", "url": "https://36kr.com/p/3855480467543042?f=rss", "summary": "<p><strong>文 | 孙小雯</strong></p>\n  <p><strong>访谈 / 编辑 | 海若镜</strong></p>\n  <p>「暗涌Waves」独家获悉，侵入式脑机接口公司「芯生视界」近日完成近亿元人民币种子轮融资。本轮融资由经纬创投领投，星连资本、燕缘创投、水木创投跟投。</p>\n  <p>当下，侵入式脑机接口已经在治疗瘫痪、脑控外设等医疗场景落地，验证长期植入的安全、有效。与此同时，AI Agent和具身智能技术加速进化，也放大了市场对脑机接口的期待：改写未来“人机交互”的方式，实现人机融合、增强人类。马斯克和他的Neuralink，正是这一叙事的风向标。</p>\n  <p>芯生视界团队集合了多位国家“脑计划”脑机接口方向“青年首席”：创始人王茜来自北京大学心理与认知科学学院、IDG麦戈文脑科学研究所。联合创始人李远宁来自上海科技大学，是卡耐基梅隆大学人工智能和神经科学博士，曾在加州大学旧金山分校Edward Chang实验室（脑机接口顶级实验室）从事博后研究多年。联创团队还包括来自北京大学具身智能、脑机芯片和类脑芯片等方向的专家。</p>\n  <p>这支年轻的科学家团队，出道就<strong>获得了一线科技基金、北大及清华系机构的同时注资。</strong>他们选择的方向也很明确：视觉、语言和具身融合；目标是做万通道、一体式植入的“神经显卡”脑机接口系统。</p>\n  <p>芯生视界联合创始人李远宁认为，视觉是人类最重要的感知输入，语言则是人类对外表达的核心输出。在脑机接口研究中，视觉信息如何高效写入人的大脑，意图和语义又该如何被读出。这既对应失明、失语患者的功能重建，也更接近人机交互的核心问题。</p>\n  <p>为什么第一步选择视觉重建，当下能做到什么程度？脑机接口“神经显卡”究竟意味着什么？视觉、语言和具身智能之间，又如何构成下一代人机交互的桥梁？以下是我们与李远宁的对话（经编辑）：</p>\n  <h2><strong>01 科学家下场</strong></h2>\n  <p><strong>暗涌：芯生视界的几位联合创始人是如何走到一起，决定创立公司的？</strong></p>\n  <p><strong>李远宁：</strong>这其实源于一个对技术终局的共同判断：人类与世界交互的本质，一端是“感知”，一端是“表达”。</p>\n  <p>我和王茜研究人脑视觉、语言皮层时间比较久。十几年前，在CMU攻读博士期间，我便在匹兹堡大学医学中心开展了侵入式的人类视皮层神经编解码研究，发表了多篇关于电刺激产生文字和记忆幻觉的研究。后来我又参与领导了国内最早的侵入式汉语脑机接口研究。</p>\n  <p>与此同时，王茜老师团队在国内率先实现了基于临床病人的视皮层单神经元记录，并在2020年发表了“人类视皮层电刺激诱发彩色视觉幻觉的映射机制”的研究论文。</p>\n  <p>当我们将跨越十年的底层算法、试验数据汇聚，想合作将其真正推向临床转化时，发现急需一套能够精密调控、实现信息双向闭环的硬件基座。</p>\n  <p>为此，我们联合了北京大学主攻脑机硬件芯片的顶尖团队，他们拥有稀缺的工业级流片与规模化量产经验。</p>\n  <p>芯生视界的另一位联创朱毅鑫教授，同样来自北京大学。作为国内少有的曾受邀在NVIDIA GTC全球大会上作报告的具身智能专家，他也被“人机融合”的愿景所打动而加入。</p>\n  <p>至此团队最终聚集了从神经机制解析、底层高通量芯片、前沿临床医学，再到具身AI互联的全链条专家，这也是我们从硅基算力到碳硅融合的技术壁垒。</p>\n  <p><strong>暗涌：现在国内估值百亿的脑机接口公司已有几家，现在入场，会有点晚吗？既往做运动功能重建的公司，所积累的数据和能力，容易泛化到视觉、语言等适应症吗？</strong></p>\n  <p><strong>李远宁：</strong>从公司成立时间来看，我们不算早的。但此前的公司大都是针对运动功能重建，而我们选择的视觉、语言和具身方向，大家都刚刚开始，我们积累可能还更深。</p>\n  <p>运动功能重建积累的数据飞轮，很难迁移到其他认知功能上。</p>\n  <p>运动控制的维度相对较低，但视觉和语言涉及极高维度的非线性编码。在全新的赛道上，芯生视界的积累不仅在算法上，更在于我们的创始团队在临床一线多年，积累了海量的颅内多模态数据，包括百余例患者的视觉皮层电刺激的数据库。这意味着我们不需要从零开始进行临床试错。</p>\n  <h2><strong>02 万通道的可能</strong></h2>\n  <p><strong>暗涌：现在受市场追捧的几家侵入式脑机接口公司，多是从“柔性电极”这一长板入手创业，而芯生视界的解决方案是什么？</strong></p>\n  <p><strong>李远宁：</strong>柔性电极是进入大脑的物理接口，这很重要。但脑机接口背后是一整套系统，真正决定脑机交互上限和信息通量的，是电极之下的芯片和神经编解码算法——这就是我们提出“神经显卡”的原因。</p>\n  <p>现在临床上使用的一些硬件可控性不高，也不是为了高效的双向交互设计的。就像显卡支撑了AI的爆发一样，芯生视界正在构建的“神经显卡”系统，攻克的是大脑极端高带宽数据流的“编解码-重建”闭环，它有可能成为支撑脑机融合、人机共生的核心基础设施。</p>\n  <p><strong>暗涌：业内也有一种声音，脑机接口系统并不一定需要超高通量。马斯克Neuralink开始时植入了1024通道的脑机系统，但实际发挥作用的也只有几百通道？</strong></p>\n  <p><strong>李远宁：</strong>不同任务对通量需求不一样，运动控制需要记录的维度较低。比如手臂运动，只需要不到十个自由度的神经信号，就能实现在二维平面上精准地控制鼠标。</p>\n  <p>而目前所有语言解码的工作，本质上也是解码构音器官的精细运动：只需要十几个自由度的神经信号，就能很好的刻画口唇舌咽等构音器官运动，并解码生成出语音。</p>\n  <p>但真正的视觉重塑和自然语义解码，是另一个量级的工程。你想在盲人的脑海里像素级写入一张清晰的图像，或者直接解码“脑海中飘过的一个复杂抽象想法”，每一个环节对应的都是上千或者上万维度的信息并发。这时，高通量电极和高通量芯片的必要性就出来了。目前马斯克的Neuralink能做到 3000 个通道，我们正在朝万通道努力。</p>\n  <p><strong>暗涌：所以你们认为必须开发高通量的脑机芯片。做脑机芯片的难点有哪些？</strong></p>\n  <p><strong>李远宁：</strong>脑机芯片是“带着镣铐跳舞”。要把这样的芯片植入到大脑，既需要小尺寸、低功耗，又要满足高通量实时并发，还要能够双向交互。</p>\n  <p>这件事并不是无解，和 GPU 相比，当下脑机芯片制程没有那么高。但是在没有规模化的情况下，利润就会很薄。芯片研发很烧钱，小规模流一次片可能就成百上千万。</p>\n  <p>而脑机领域才刚刚起步，投入多少资源，决定能解决多少问题。从这个视角来看，对比芯片、具身智能等方向，脑机接口赛道获得的资金规模还是比较少。</p>\n  <p><strong>暗涌：你们的脑机芯片方案目前是什么进展？</strong></p>\n  <p><strong>李远宁：</strong>我们是国内为数不多流片出28nm级脑机芯片的团队，目前的芯片是256通道，今年应该会出一个更高通量、双向交互的芯片。</p>\n  <h2><strong>03 视觉与语言重建的未来</strong></h2>\n  <p><strong>暗涌：为什么“视觉重建”成为大家现在想要攻克的重要方向？你们团队在此的积累有哪些？</strong></p>\n  <p><strong>李远宁：</strong>从临床需求来看，视觉重建的需求量足够大，且现在没有好的替代解决方案。中国最常见的三种残障类型是肢体、视力和听力残疾，其中肢体残疾有义肢等方案，听力障碍也有人工耳蜗的方案能够部分解决。但在视力障碍领域，针对全盲患者，植入式脑机接口几乎是唯一的复明方案。</p>\n  <p>从研究路径来看，它的第一步验证路线足够清晰。初级视觉皮层有retinotopy机制，即刺激皮层对应的位置，就能产生色觉和光感。</p>\n  <p>王茜老师早在2020年就开展了相关研究，让被试者在受到皮层电刺激之后，描述视野中什么位置产生了画面。比如把视野分成几块后，患者可以感知到左边有红色，右边有蓝色。得益于国内临床资源等优势，此前已研究积累了100多例的实验数据，部分解决了视觉皮层自下而上的简单输入问题。</p>\n  <p>在复杂场景的视觉编码算法方面，神经编码领域有一个两年一度的国际挑战赛叫 Algonauts,&nbsp;主办方会给出一个公开的神经大数据集，要求参赛者提交算法，基于给定的刺激内容来尽可能准确地预测大脑的神经响应活动。这个比赛，2021年和2023年我们团队都拿了全球冠军。不过，2025年我们没有再参赛，而那一年的冠军是 Meta AI。</p>\n  <p><strong>暗涌：此前有脑机接口专家讲到，视觉重建的难度非常大。为什么让“盲人复明”存在巨大挑战？</strong></p>\n  <p><strong>李远宁：</strong>因为还有两个关键的问题没有解决。</p>\n  <p><strong>首先是动态视觉中大脑对环境的补全机制。</strong>我们看世界时，人脑每一刻其实只会接收到很小范围的视觉信息：我们视网膜中真正具备高分辨率的区域非常小，大脑是依靠眼球高频的扫视，结合内部建立的世界模型，来脑补和拼接出完整、连续的视觉场景。</p>\n  <p>这套机制也导致脑机接口的重建异常困难，因为初级视觉皮层并不是简单的前馈网络，存在大量的横向抑制和跨脑区的反馈连接，一个神经元的激活会横向影响周围的神经元，也就是说点亮一处可能会影响另一处，这就加大了视觉编码重建的难度。如果把一万个电极当成一万个独立的像素点去简单粗暴地同时激发，大概率会得到一片模糊。</p>\n  <p><strong>另一个困难是如何利用神经可塑性，让大脑学会接受这样的输入，产生感知。</strong>当我们将经过算法编码的电信号输入盲人的大脑时，对大脑而言，这是一种从未见过的新型“语言”。</p>\n  <p>盲人并非一接上设备就能立刻“看懂”世界，而是需要经历一个类似“强化学习”的主动适应过程。这本质上是利用神经可塑性，让人机共同进化，最终帮大脑重新“长”出一条感知通道。</p>\n  <p><strong>暗涌：脑机接口做视觉、语言这两种功能的重建及研究，对“人机交互”未来的意义是什么？</strong></p>\n  <p><strong>李远宁：</strong>语言和视觉，是我们跟世界交流最核心的输入和输出，视觉提供了我们80%的感知输入，在大脑深处构建起复杂的“世界模型”；语言则负责将这些意识解码并向外输出。</p>\n  <p>但语言本身，其实是受制于人类运动器官物理约束的一种低带宽的有损压缩。芯生视界的终极目标是打破这种束缚，实现高通量的人机交互，在人脑的高维语义空间与大模型、具身AI之间，架起一座直接对接的桥梁。</p>\n  <p>未来，思想的交互也许不再需要被降维成显性的语言或动作。人脑或能与AI实现语义级的直连。这可能不仅是人机交互的终局，更是碳基生命与硅基智能跨越物理边界、走向融合共生的进化一跃。</p>", "category": "tech", "published_at": "2026-06-18T01:34:22+00:00", "fetched_at": "2026-06-18T03:31:00.287521+00:00", "fingerprint": "64f656e592f52496"}, {"source": "36氪 - 最新文章", "title": "12306要忙着赚钱了", "url": "https://36kr.com/p/3858061678760965?f=rss", "summary": "<p>作者&nbsp;|&nbsp;王晗玉</p>\n  <p>编辑&nbsp;|&nbsp;张帆</p>\n  <p>近日，市场监管总局联合中央网信办、国家铁路局，依法约谈携程、同程、去哪儿、飞猪、美团、智行火车票、高铁管家7家旅游出行第三方平台，直指平台在火车票销售领域存在多项不规范经营行为。</p>\n  <p>具体来看，违规行为包括不当宣传“候补帮抢”及付费选座、不当诱导用户“买长乘短”“买短乘长”，不当收集、使用用户个人信息等问题。后续监管部门将加大监管执法力度。</p>\n  <p>此次集中约谈，不仅直指OTA平台火车票业务的乱象根源，也揭开了在线旅游行业围绕出行流量展开的深层博弈。</p>\n  <p>监管收紧的背景下，<strong>传统OTA依赖的流量逻辑正在动摇</strong>，而铁路官方平台跨界拓展酒旅业务的可能性，也让整个在线出行行业迎来新一轮变数。</p>\n  <h3><strong>抢票“加速包”，OTA的“流量加速包”</strong></h3>\n  <p>每逢各大、小长假，打开OTA平台的火车票页面，“极速抢票”“候补加速”“高成功率帮抢”等标语便铺天盖地，甚至各类“抢票”“加速”链接外溢至社交平台。部分平台还推出阶梯式付费加速服务，以“付费越快、抢票概率越高”为卖点吸引用户付费。</p>\n  <p>长期以来，各大OTA着力打造“第三方平台抢火车票比12306更快”的用户认知，将火车票抢票功能作为重要引流入口，<strong>试图凭借铁路出行的庞大客流撬动平台整体流量增长</strong>。</p>\n  <p>但从实际运行规则来看，这一宣传本身存在夸大与虚假成分。</p>\n  <p>此前，无论是12306官网还是相关技术负责人都曾数次表明，<strong>12306未向任何第三方平台开放核心售票接口与优先出票通道。</strong>所有第三方平台的火车票预订、候补抢票服务，本质上均是依托公开网络端口进行排队、刷新操作，和普通用户手动购票、候补没有区别。</p>\n  <p>也就是说，所谓“加速包”“VIP抢票”，并不能改变票务分配规则，也无法提升购票成功率。</p>\n  <p>除此之外，部分平台还刻意引导用户采用“买长乘短”“买短乘长”等方式购票，或在用户购票过程中默认勾选各类增值服务，同时过度收集手机号、出行轨迹、身份信息等隐私数据，这也是本次主流OTA平台被集中约谈的主要原因。</p>\n  <p>透过上述乱象不难看出，OTA发力火车票业务，主要目的除为补齐产品生态之外，更重要的是将铁路出行打造为低成本流量入口。</p>\n  <p>铁路出行受众基数大、使用频次高、用户粘性强，是天然的流量池。</p>\n  <p>因此，<strong>先用火车票抢票、购票服务吸引用户停留，再将铁路客流逐步导流至酒店预订、旅游度假、本地生活等高毛利业务，</strong>也成为OTA平台较为普遍的商业模式。</p>\n  <p>结合头部企业财报数据，或可一窥该模式的成效。</p>\n  <p>携程集团2025年年报显示，公司全年总营收达624.09亿元，归母净利润达332.94亿元，同比增长95.08%。其中住宿预订业务营收261亿元，占总营收比重约41.8%；交通票务业务营收224.89亿元，占比36%，两大核心业务合计占总营收的近八成。</p>\n  <p>从业务增速来看，携程住宿业务营收同比增加21%，票务业务同比增加11%。这显示，<strong>在平台整体盈利中，住宿业务扩张的拉动作用更强</strong>。</p>\n  <p>同时，观察同程旅行财报数据，2025年同程旅行全年营收193.96亿元，交通票务收入79.25亿元，占总营收37.92%，同比增长9.6%；住宿预订收入54.51亿元，占比27.07%，同比增长16.8%。</p>\n  <p>交银国际针对其前几个季度经营表现的多份研报指出，平台整体利润率抬升，核心驱动是住宿业务收入增速持续高于交通票务。</p>\n  <p>此外，<strong>OTA行业面向住宿与票务供应商的抽佣比例不同早已是市场共识</strong>：住宿业务基础抽佣更高，一般在10%-15%之间；交通票务则因定价基本由铁路、航司管控，OTA平台盈利只能依靠加速包、保险等增值服务。</p>\n  <p>这进一步凸显了在OTA平台中，<strong>交通票务侧重用户引流，住宿负责盈利兑现</strong>。</p>\n  <p>由此可见，如果火车票引流渠道受限，那么OTA平台的流量根基将受到冲击。</p>\n  <h3><strong>12306入局，能否吃下酒旅大蛋糕？</strong></h3>\n  <p>监管收紧之下，OTA在火车票领域的营销玩法、盈利空间不可避免将被压缩，铁路出行这一重要流量入口的引流能力也将大打折扣。</p>\n  <p>而当第三方平台逐步失去铁路票务的流量优势，手握海量出行用户的铁路官方平台，是否会向酒旅市场强势出击，分食传统OTA的核心蛋糕？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_74402875237a4411ac92935731f8dc58@5623968_oswg83816oswg557oswg1144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">12306此前已上线“酒店住宿”功能</p>\n  <p>当前，铁路12306拥有国内规模最大的出行用户群体，用户画像覆盖全年龄段、全地域，<strong>且出行需求通常与住宿、旅游需求高度绑定。</strong>此前12306平台已逐步上线酒店、民宿、旅游产品等服务板块，只是尚未大规模推广。</p>\n  <p>相较于传统OTA平台，12306具备两项天然优势：<strong>一是用户信任度高</strong>，作为铁路官方平台，不存在虚假宣传、捆绑消费等问题；<strong>二是流量成本低</strong>，无需像OTA一样投入巨额营销费用获客，依托原有购票流量即可实现自然转化。</p>\n  <p>放眼民航领域，相似的转型路径已有落地。</p>\n  <p>此前，中航信旗下航旅纵横正式上线“民航官方直销平台”功能，被业内称作“民航版12306”，整合国内37家航空公司直销资源，主打价格透明、无捆绑销售、杜绝大数据杀熟，直接对接航司官方渠道，凭借公信力快速抢占市场。</p>\n  <p>这一逻辑同样适用于铁路行业。</p>\n  <p>近年来，铁路系统面临多重经营压力，一边是高铁线路盈利分化，仅少数干线线路能够稳定盈利，大量中西部线路需依靠干线线路收益补贴运营。另一边伴随客流增速回落，<strong>铁路单一票务收入增长见顶，也亟待加快市场化探索，挖掘用户衍生需求，拓宽收入来源。</strong></p>\n  <p>以最繁忙的京沪高铁为例，其增长压力已在近年显现。财报显示，2025年全年，京沪高铁实现营收430.62亿元，归母净利润131.72亿元，同比分别仅微增2.15%、3.16%。</p>\n  <p>观察其毛利率水平，虽绝对值算得上亮眼，但也自2024年以来缓慢下滑，至今年一季度由47.39%下降至45.82%。</p>\n  <p>这一趋势下，堪称“最赚钱”的京沪高铁也开启又一轮调价，将部分动车组列车公布票价上调20%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_e4abceb2df9e4ed59c07740aea046788@5623968_oswg210178oswg563oswg790_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">京沪高铁调价公告</p>\n  <p>尽管“公布票价”并非旅客在购票时需实际支付的票价，但高铁票提价的空间还是抬高了。</p>\n  <p>这在一定程度上体现了铁路行业的运营压力。</p>\n  <p>另一方面，如果12306持续加大酒旅、旅游业务的布局力度，传统OTA的利润空间则将面临挤压。</p>\n  <p>火车票抢票引流渠道收紧，<strong>外部流量获取难度相应加大</strong>。而原本可转化的铁路出行用户，被官方平台直接截留，<strong>核心利润板块难免遭遇冲击</strong>。</p>\n  <p>这一变化对于中小OTA以及主打火车票业务的平台影响或更为明显——它们通常既缺少携程、同程这样的多元化业务布局，也缺乏品牌与资金优势。</p>\n  <p>不过，现阶段12306发展酒旅业务也存在一定短板。传统OTA深耕住宿、旅游市场多年，积累了海量酒店资源，<strong>在产品丰富度、服务精细化、线下供应链整合上优势突出</strong>。</p>\n  <p>但12306作为票务起家的平台，在酒店签约、民宿运营、旅游线路设计、售后服务等方面仍处于起步阶段，短期内难以取代传统OTA。</p>\n  <p>而对OTA平台而言，过去依靠模糊宣传、捆绑增值服务、利用信息差获利的商业模式正面临调整：首先，票务业务将回归“基础服务”属性；其次，降低对铁路流量入口的依赖，在旅游产品、用户体验、供应链整合等方面提升竞争力，则将成未来一段时间各大OTA急需向市场交出的新作业。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260618/v2_9af5d5747dc64d49bcddbc789843a333@5623968_oswg104094oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-06-18T02:25:26+00:00", "fetched_at": "2026-06-18T03:31:00.287505+00:00", "fingerprint": "d354fc67949a5ad7"}, {"source": "少数派", "title": "在香港骑共享单车：访客视角的经验分享", "url": "https://sspai.com/post/110750", "summary": "骑共享单车游香港，听起来似乎不是什么主流选择。的确，香港总体来说对单车不算很友好。特别是港岛、九龙一带，地形起伏大，开发密度高，基本没有条件开辟单车径，政府也明确不鼓励以单车代步。不过，在临近深圳的新 ...<a href=\"https://sspai.com/post/110750\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-17T03:08:23+00:00", "fetched_at": "2026-06-18T03:30:58.965195+00:00", "fingerprint": "b15f96e742876f94"}, {"source": "少数派", "title": "具透 | 动态应用网格、Liquid Glass 微调，watchOS 27 首个开发者测试版一览", "url": "https://sspai.com/post/110958", "summary": "AI 之外，watchOS 27 中还有这些新功能。<a href=\"https://sspai.com/post/110958\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-17T07:00:00+00:00", "fetched_at": "2026-06-18T03:30:58.965188+00:00", "fingerprint": "d48db2a64bee26c1"}, {"source": "少数派", "title": "模糊算法让图像更清晰？游戏里的「抗锯齿」到底在做什么", "url": "https://sspai.com/post/110720", "summary": "前言随意启动一款3D游戏，打开图形设置界面，你大概率能发现一个选项——「抗锯齿」。你可能参考了网上的设置教程，切换到了TAA，抑或是MSAA、DLSS等的设置选项，画面看起来似乎更好了。那么这些字母的 ...<a href=\"https://sspai.com/post/110720\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-17T0
