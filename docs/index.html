岸产投、海通开元为代表的市场化基金、区域国资与券商系资本，则在本轮继续加码。多元股东的持续投入，为公司的产业化进程提供了坚实支撑，也是对其量产进展最直接的确认。</p>\n  <h2><strong>行业背景：载板紧缺与涨价潮叠加，玻璃基板迎来确定性窗口</strong></h2>\n  <p>这轮融资本质上是一次对时间窗口的卡位。AI算力狂飙之下，封装载板持续紧缺，ABF载板供不应求、交期一再拉长；而当芯片封装尺寸不断突破、光模块速率持续跃升，有机基板在热膨胀匹配、高频损耗与布线密度上，正在逼近物理极限。巨头的选择已经给出答案——英特尔宣布玻璃芯基板（GCS）进入大规模量产，台积电CoPoS试产线年内通线，三星、SKC Absolics加速送样与量产准备。玻璃基板，正在从巨头的实验室走向产业的中心。</p>\n  <p>&nbsp;</p>\n  <h2><strong>替代大逻辑：一层“布”卡住了有机基板，三大应用走向全面玻璃基化</strong></h2>\n  <p>比巨头动向更值得关注的，是有机基板的成本地基正在松动。2025年下半年以来，PCB产业链经历了一轮罕见涨价：覆铜板价格大幅攀升，PCB厂商全线调价。而涨价的真正源头，不是铜箔，也不是树脂，而是一层“布”——电子级玻璃纤维布。它的价格较2025年低点翻倍，行业库存降至历史极低位，高端低介电产品被海外厂商高度垄断，而扩产以年计。这层“布”的紧缺，短期内无解。</p>\n  <p>玻纤布之所以不可或缺，是因为它是有机基板的“骨架”，核心使命之一正是热应力匹配：AI服务器PCB层数不断攀升，为了让有机基材的热膨胀系数贴近硅芯片，行业不得不大量使用昂贵的低CTE特种玻纤布。换句话说，<strong>有机基板正在用越来越贵的“布”，去模仿玻璃与生俱来的性能</strong>——玻璃CTE天然与硅匹配，介电损耗远低于有机材料，而且根本不需要这层“布”。当“补丁”的成本越过材料替代的成本拐点，玻璃基化就从可选项变成了必然项。但“玻璃基化”并不是一件事，而是三件事——三大应用的需求逻辑、技术指标与产业节奏，截然不同：</p>\n  <p><strong>第一类，PCB替代——一场由经济性驱动的存量替代，节奏最快。</strong>面向AI服务器背板、高频通信板与新型显示基板，替代对象是FR-4与传统PCB，逻辑简单而锋利：性能更好，成本更低。信号损耗显著降低，显示与HDI基板场景的综合成本大幅优于PCB基板。这一类比拼的是大规模制造与成本控制能力，是当前放量的主战场——2026年，将是玻璃基PCB的替代元年。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_347f933315314b7bacecb2f9f9a631a8@5284654_oswg3007833oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板替代传统PCB示意图</p>\n  <p><strong>&nbsp;</strong></p>\n  <p><strong>第二类，ABF载板替代——由可靠性与供给安全驱动，节奏居中。</strong>面向超大尺寸FC-BGA封装、Chiplet与HBM高带宽存储，替代被海外垄断且持续紧缺的载板。这是一场硬指标的对决：翘曲、线宽线距、孔径与深宽比全面收紧，考验的是精细制程与可靠性验证的深水区能力。相关产品将在2027年逐步推向市场。</p>\n  <p>&nbsp;</p>\n  <p><strong>第三类，Interposer替代——由成本革命驱动的远期替代，空间最大。</strong>面向CoWoS先进封装与CPO光电共封装，替代昂贵的硅TSV中介层：玻璃介电性能显著优于硅，面板级加工利用率更高，综合成本有望大幅低于硅TSV；更关键的是，CPO场景下玻璃可以直接承载光波导，实现光电一体化。这条产业链将在2027-2030年逐步成熟——谁提前卡位，谁就握住了下一代封装的入场券。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_969d298d35a9443f9288dad2f7f6c9d7@5284654_oswg2828838oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃芯基板与玻璃中阶层的应用示意图</p>\n  <p>&nbsp;</p>\n  <p><strong>值得注意的是，当行业目光普遍聚焦GCS（Glass Core Substrate）与GI（Glass Interposer）时，PCB的玻璃基化同样必然快速落地，而Glass PCB有一个残酷前提：替代指标极高，极少企业能够真正满足。</strong>玻璃基板要替代有机PCB，必须同时跨过三道门槛——<strong>成本框架</strong>，多数企业的TGV基板成本模型根本无法闭合；<strong>高铜厚线宽比</strong>，精细线路之下，服务器电源与显示大电流驱动同样要求厚铜，而厚铜恰是行业玻璃覆铜的普遍短板；<strong>全工序直通良率</strong>，这是行业公认的经济性生死线，国内量产水平参差不齐。<strong>巽霖科技是全球极少数三重指标全部通过、且具备量产可能性的企业</strong>：综合成本有望较同类型PCB大幅降低，厚铜能力与精细线路兼得，直通良率行业领先，叠加数倍于行业的覆铜结合强度，保障贴装与返修的长期可靠性。涨价持续的窗口期里，玻璃基板与有机PCB的性价比天平正在反转——而反转之后能接住需求的企业，必须先过这三关。</p>\n  <p>&nbsp;</p>\n  <h2><strong>量产进展：最后一公里已经打通</strong></h2>\n  <p>行业从来不缺概念和样品，缺的是能稳定批量交付的真实产能。在巽霖科技看来，只有工厂落地、良率跑通、成本模型闭合，需求才能从样品订单变成可持续的批量订单。为此，巽霖在天津自主建设了玻璃基板全流程工厂，从切割、减薄、TGV成孔，到PVD金属化、电镀、图形化、阻焊，全制程一厂覆盖，年产能30万平方米。依托源自航空发动机热障涂层体系的自研PVD覆铜技术与Cu-ABX四元合金种子层，公司覆铜结合强度数倍于行业水平，TGV量产孔径与深径比覆盖主流需求，连续VCP电镀产能数倍于传统线体。目前，公司Mini LED背光、COB直显及MIP显示模组基板已进入批量出货阶段，并通过自有模组封装线体获得国内头部客户验证——玻璃基板PCB从实验室走向生产线的“最后一公里”，已被打通。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_ca737d3a8a304616a6f021f1cdf37d7a@5284654_oswg3150534oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板在MicroLED中的应用</p>\n  <p>&nbsp;</p>\n  <h2><strong>加工路径：三套工艺平台递进交互，六级精度逐级跃迁</strong></h2>\n  <p>巽霖的扩产逻辑，不是产能的简单复制，而是围绕TGV成孔、PVD金属化、电镀与图形化等底层能力，构建三套递进且交互的工艺平台，在孔径、孔密度、结构、层数、线宽线距五个维度逐级收紧、逐级打开市场——六级产品，沿三条工艺主线拾级而上。</p>\n  <p>这条路径的起点，是<strong>第一套平台——以减成法为核心的大尺寸玻璃基PCB工艺</strong>：已进入量产的显示背光与COB玻璃基PCB，双面覆铜加TGV垂直导通，大板面、高良率，既是现金流基本盘，也是所有层级的可靠性底座；同一平台收紧图形化精度，即延伸出玻璃基HDI，引入微孔与盲埋孔，实现多层TGV精细布线，切入高速PCB与光模块载板。<strong>第二套平台，是以半加成精细线路与多层键合为核心的高阶互连工艺</strong>：高阶HDI以单元体键合实现层数倍增堆叠，规避逐层压合的累积对准误差，这是巽霖多层化的差异化打法；这套精细线路能力继续向载板延伸，便打开了GCS玻璃芯载板——转向“通孔—填孔—RDL—多层堆叠”的精细制程，直指百亿美金级的ABF存量替代市场，也是本轮融资的研发主攻方向。<strong>第三套平台，面向封装与光的融合</strong>：高精度TGV与玻璃中介层（GI）向更小孔径、更高深宽比与更高通孔密度持续攻关，成本有望大幅低于硅TSV，面向2.5D/3D封装与HBM的远期市场；同一平台上再叠加光加工能力，同板加工离子交换光波导、激光直写改性、光纤穿插孔与精密腔体，最终实现“电路+光路”的同板共构。三套平台并非彼此割裂：减成法平台验证的覆铜可靠性与量产良率，是精细线路与封装工艺的共同底座；而填孔、RDL与光加工中沉淀的精密能力，又持续反哺前两套平台的精度爬升——递进之中，互为支撑。</p>\n  <p>这条六级路径不是跳跃式押注，而是精度迭代的线性演进——与国内PCB大厂“单双面板—多层板—HDI—高阶HDI—IC载板”的爬升逻辑完全同构：孔径持续收紧、线路不断精细、层数从双面走向数十层，本质是共享底层工艺能力上的连续收窄与逐级叠加。<strong>这一模式从根本上规避了行业最大的隐性风险——产线淘汰与投资失效</strong>：TGV、PVD、电镀、曝光、蚀刻等核心制程在三套平台间大量复用，平台升级依靠工艺包迭代与模块化工序叠加，而非推倒重建；每一级产品的量产收入，又反哺下一代研发。本轮融资形成的产能，不会随产品迭代贬值，反而会随精度爬升持续增值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_48e338ae4f5e4964ad08134be1c29637@5284654_oswg3069351oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板产业升级跳转逻辑</p>\n  <p>&nbsp;</p>\n  <h2><strong>投资方与创始人观点</strong></h2>\n  <p>本轮投资方英诺基金表示：“玻璃基板正处在从技术验证走向规模量产的关键窗口期。我们看重巽霖科技在PVD覆铜等底层工艺上的原创突破，更看重其已建成全流程产线并实现批量出货的落地能力——在硬科技投资中，能交付的团队最稀缺。”</p>\n  <p>巽霖科技创始人兼CEO甄真博士表示：“本轮融资是产业伙伴与市场资本对玻璃基板量产路线的双重确认。玻纤布涨价让全行业看清了有机基板的成本天花板，也让玻璃基板的替代价值第一次有了经济学的确定性。接下来，资金将集中投向产能爬坡、封装落地与精度升级——从显示基板到高阶HDI，从玻璃芯载板到光波导，我们用三套递进交互的工艺平台与持续的精度跃迁，让真实的批量交付成为行业需求的最终解。”</p>\n  <p>&nbsp;</p>\n  <p><strong>关于巽霖科技</strong></p>\n  <p>巽霖科技成立于2023年9月，专注于玻璃基板全制程技术的研发与产业化，覆盖TGV通孔、PVD复合镀膜、连续式电镀与精细线路等核心工艺，产品应用于Mini LED背光、COB/Micro LED直显、玻璃基HDI、先进封装载板及光电共封装等领域。公司已实现Micro LED级别线路精度与高密度TGV基板量产，正加速推进从基板到模组、从显示到封装、从电到光的产业版图。</p>", "category": "tech", "published_at": "2026-08-04T08:31:59+00:00", "fetched_at": "2026-08-05T02:03:18.038329+00:00", "fingerprint": "2a904d7000b1f247"}, {"source": "36氪 - 最新文章", "title": "从追番到下单，国风IP正在重塑硬核数码消费", "url": "https://36kr.com/p/3925017067862409?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_b648027c573948238feec75943fa277a@19153231_oswg1479097oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>当国风联名吹到硬核数码</strong></h2>\n  <p>这个夏天，《八仙！》成了暑期档最大的黑马。凭借反套路的剧情设计与极具东方美学的画面一路狂飙，斩获豆瓣8.2的评分，预测总票房达到20亿。</p>\n  <p>想不到的是，电影里那只随手捏出来的“红土鸭子”，竟也成了今年夏天受年轻人追捧的玄学单品。</p>\n  <p>在官方授权店里，这只鸭子上架没多久，就售罄下架。没抢到的网友们也被逼成了野生手艺人，有人用红土陶复刻同款，有人用3D打印自制平替，也有人花两小时用拼豆拼了个2D的鸭子出来。<strong>社交平台上，催促官方赶紧售卖周边的声音也此起彼伏，</strong>“急切想花钱但是花不出去”，“八仙你会做周边吗急死我了”……&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_1ba0cf1b994941cd827b2385fba5b469@19153231_oswg69769oswg1080oswg452_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源@电影八仙</p>\n  <p>可见，<strong>年轻人对国风IP是越来越上头了。</strong></p>\n  <p>数据也证明了年轻人对国风IP的喜爱。《中国青年报》发布的《2025青年国潮趋势报告》显示，<strong>91.6%的年轻人认为国潮产品已更深入地走进了大众日常生活。</strong>也有59.9%的年轻人明显感觉到近些年来，国潮产品的跨界联名愈发多样，品类也越来越丰富。</p>\n  <p><strong>听到了年轻人的呼唤，敏锐的品牌们也开始在国风联名上玩起了新花样。</strong></p>\n  <p>比如最近，蜜雪冰城、美团外卖又与广东粤剧院展开三方跨界联名，推出了包含粤剧文化元素的折扇与挂件，雪王和袋鼠双双披上戏服，折扇一挥，挂件一晃，将国风碰撞出的实用性与文化底蕴拿捏得死死的。</p>\n  <p><strong>这股联名的风潮不只局限于轻量级的工艺品，也刮进了对技术与工艺要求极高的硬核数码硬件圈。</strong></p>\n  <p>7月20日，<strong>迈从和国漫IP《凡人修仙传》联手，重磅推出了售价1299元的高端系列新品——God 60联名款磁轴键盘礼盒。</strong>产品开放预约后，短短几天，预约量迅速突破6万，并在首批抢先购开售后立即售罄。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_ef197a44b82d4053b8664f1cc12db4b3@19153231_oswg4955512oswg5000oswg3333_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">迈从God 60高端系列</p>\n  <p>年轻人对国风 IP 的热爱，正在从内容消费延伸到真实产品选择。<strong>迈从God 60联名款的热度说明，当IP情绪、产品性能和日常使用场景被打通，硬核数码也能成为国风文化的新入口。</strong></p>\n  <p>具体来看，迈从尝试将那个缥缈的修仙世界搬到玩家的桌面上。</p>\n  <p><strong>外包装摒弃了常规的数码纸盒，而是做成了剑匣的模样，盒身上贯穿着云纹样式，仙气十足。</strong>交互设计也极具仪式感，指尖触碰正面的“掌天瓶”滑块，向右轻轻滑动，大庚剑阵的图样像解开封印一般徐徐展开，让人有一种修仙世界里“开匣出剑”的隐秘快感。</p>\n  <p>礼盒中的键盘，整体为青金色，每一行键盘的颜色都不同，<strong>从上到下呈渐变，接通电源的瞬间就能看见键帽展示大庚剑阵的灯光效果。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_9668605148934d97bcd39cb50af7ee32@19153231_oswg797435oswg3205oswg2135_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>键帽也有着不同的设计，左侧是雾透效果键帽，左上角的Esc键被替换成了《凡人修仙传》中黄枫谷发放的入门特权令牌——升仙令。</strong>让人印象深刻的，还有那3枚可替换的金属键帽，分别刻着大庚剑阵的阵眼与代表男主韩立性格与态度的“谨慎行事”和“念头通达”。</p>\n  <p>整个礼盒像是一个百宝箱，印着“可叩响仙门”字样的键盘手托、盲盒般的动画鼠标垫、宗门专属的配件盒、带有名场面显影片的电气灯……甚至连撕拉吧唧、动画贴纸这些小周边都安排得明明白白。&nbsp;</p>\n  <p>在这份溢出屏幕的真心背后，我们也不禁好奇，从极其考究的“剑匣”式包装盒，到定制款异形金属键帽，<strong>一个过去习惯了用主流价位爆品打响知名度的品牌，究竟为这场高端产品推出做了多少准备？</strong></p>\n  <h2><strong>迈从的修炼</strong></h2>\n  <p>过去几年，迈从一直在“修炼”。</p>\n  <p>它始终深耕外设赛道，在键盘、鼠标、耳机的主流价位段专攻性能与品质，连续打造出了Ace 68磁轴键盘、G87机械键盘、A7电竞鼠标、V9电竞耳机等一系列高销量爆品。也通过在品控上的严苛把关，以及诸如“90天只换不修”“24个月质保”的服务承诺，一步步建立起了年轻消费者对其产品性能、软件体验与售后体系的信任。</p>\n  <p>建立在真实体验上的口碑积累，让迈从成为了年轻消费者喜欢的外设品牌——<strong>2025年，迈从经过弗若斯特沙利文认证，拿下了机械键盘全国销量第一的成绩，成为了极具影响力的国产消费电子品牌。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_232ccd7e95164ed5b4a79d1a2d6874c2@19153231_oswg1503270oswg1300oswg867_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>规模做大了，基本盘稳了，迈从决定走出舒适区，向上迈出关键的一步。</p>\n  <p>评估了市面上众多热门IP后，最终将目光锁定在了《凡人修仙传》上。</p>\n  <p>作为许多年轻人心中的国漫Top1，主角韩立出身平凡，没有世家托举，也没有修道基础，却凭借着“谨慎行事”“意志坚定”的行事风格与脚踏实地的修炼，一步步从凡人成长为修仙界巅峰。</p>\n  <p>这种热血又接地气的逆袭轨迹，打动了不少年轻人，也和迈从自身的品牌成长轨迹相契合——<strong>从籍籍无名到全网销量第一，迈从的进阶之路，也像是一场外设界的“修仙”。</strong></p>\n  <p>但要稳稳承接住《凡人修仙传》这样的超级IP，光有精神上的契合还远远不够，必须依靠足够强悍的系统工程能力，将厚重的文化内容与审美意境，转化为消费者真实可感的使用体验。</p>\n  <p><strong>光是在产品设计上，就能看到迈从的很多的用心之处。</strong></p>\n  <p>首先，为了在最了解产品、也最认可紧凑配列的核心用户中建立God高端系列认知，迈从没有选择常规的大配列，而是克制且果断地采用了60配列，<strong>不光将桌面的活动空间还给了鼠标，也给玩家们带来了更专注、纯粹的操作体验，希望借此通过核心用户的体验和口碑，向更广泛人群延伸。</strong></p>\n  <p>在视觉与工艺上，迈从也将细节拉满。在《凡人修仙传》中，最具有代表性的视觉符号就是剑阵，为了给玩家更沉浸的体验，迈从专门设计了镂空的键帽，就是为了在键盘开启后，底部的光芒能完美穿透键帽，呈现出完美的剑阵效果灯光。同时，键盘也配备了定制的RGB剑阵灯光，按压阵眼键时，光效会从中⼼向外发散，让剑阵的视觉与光效实现了完美的联动。</p>\n  <p>“谨慎行事”与“念头通达”两枚异形金属键帽，分别对应Backspace键和Enter键：前者呼应删除操作前的谨慎判断，后者对应确认后的念头通达，<strong>这些别出心裁的小巧思，让玩家在每一次敲击时，都能产生情绪代入与精神共鸣。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_4239310cb7ab4584bf679fd95a57f16f@19153231_oswg1227451oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>在极具仪式感的设计之外，God 60也依然装备了业内顶尖的参数配置。</strong>它搭载了迈从自研的“天问方案”与神核引擎，配合磁悬浮轴体，实现了0.001mm调节精度、256K扫描率、16K回报率以及0.06ms极低延迟，保持着品牌一贯的电竞级硬核性能。</p>\n  <p>一直以来，迈从都主打为用户提供综合体验与定价匹配的高质价比产品。God 60延续了迈从对性能和实用体验的重视，并将过去在主流价位产品中形成的研发、设计和工程能力，进一步延伸至更高价值区间，加入更完整的审美与文化表达。</p>\n  <p><strong>一套组合拳下来，也完美诠释了迈从对God高端系列的定义——高性能、高完成度与高质价比，</strong>致力于在更高的价位段里，为消费者提供了一份融合了硬核性能、惊艳设计与深厚文化底蕴的综合体验。</p>\n  <h2><strong>这一把，高端局</strong></h2>\n  <p>长久以来，年轻人的桌面外设，似乎一直都被海外IP“占据”。</p>\n  <p>在电竞玩家的电脑桌上，出现的大多是漫威宇宙、高达机甲，或者是宝可梦。</p>\n  <p>God 60与《凡人修仙传》这次携手，干脆利落地打破了这个局面。它向市场展示了一次完美的双向奔赴，<strong>一边是自带庞大号召力的国漫IP，另一边是具有极高工程水准的国产外设，二者强强联手，将国风IP和硬核电竞做到了完美融合。</strong></p>\n  <p>对于迈从来说，这次联名既是一次破圈，也是一次“破局”。</p>\n  <p>��借着极具诚意的联名设计，迈从吸引的不光是电竞圈的玩家，也硬控了一波有电竞需求的《凡人修仙传》的粉丝，精巧的“青竹蜂云剑”剑匣与发光的“大庚剑阵”成功满足了用户体验，<strong>在每一次按键、插入、打开和替换中，玩家都能实打实地与那个修仙世界产生了奇妙的情感连接。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_bf3bb92b93f244c399f2d23dbea7987f@19153231_oswg127046oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ChinaJoy上体验God 60的玩家们</p>\n  <p>这波操作，也在年轻群体中刷足了好感度。对他们来说，<strong>键盘既是高频使用的工具，也可以承载性能体验、桌面审美和兴趣表达。</strong></p>\n  <p>迈从围绕年轻玩家对电竞性能、桌面空间和个性表达的需求进行产品定义，并通过God 60将性能体验与文化表达纳入同一套产品逻辑。这套产品能够落地，依赖的也不只是一次设计创意，而是迈从在多产品、多品类上长期积累的系统能力。</p>\n  <p>现在，迈从已经完全具备了覆盖技术研发、产品定义、结构工程、规模供应链协同以及高阶品牌审美表达的系统化能力。<strong>God 60的推出，也让外界对迈从的认知从“高质价比品牌”，蜕变为一个兼具极致性能、高完成度和文化底蕴的品牌。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_31896d3f07bb45ab8c3c4f012f7dddf4@19153231_oswg6706530oswg4037oswg2691_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对已经在主流价位形成稳定优势的迈从而言，进入高端市场意味着主动打破原有舒适圈。品牌需要面对更复杂的产品定义、更高的设计与工程标准，以及用户对稳定性、审美和品牌价值的综合检验。</p>\n  <p>这一步并非否定原有路径，而是将已经经过市场验证的能力推向要求更高的产品区间。<strong>所以迈从走向高端，绝对不等同于简单粗暴的全线涨价，更不是抛弃主流用户。恰恰相反，它是在原本坚固的地基上，盖起了更高的楼。</strong></p>\n  <p>那些曾在主流价位杀疯了的爆款产品，依然会像定海神针一样，牢牢守护着粉丝基本盘，持续扩大用户覆盖，建立并巩固消费者对迈从的绝对信任。而以God 60为代表的高端产品，则肩负着拉升品牌价值天花板，拓宽文化与审美边界的重任。<strong>二者互相补充，也拼出了一张更加健全、可持续的迈从生态蓝图。</strong></p>\n  <p>真正的品牌向上，从来都不是急于求成地靠某个热门IP进行短期包装，而是像迈从一样，甘于沉淀、厚积薄发。</p>\n  <p><strong>God 60的落地，意味着迈从的高端化已经具备了系统能力、产品载体、核心用户路径和更完整的价位段布局。</strong>而对于国产外设品牌来说，怎么打好这把“高端局”，也终于有了稳扎稳打且后劲十足的新解法。 &nbsp;</p>", "category": "tech", "published_at": "2026-08-04T09:38:53+00:00", "fetched_at": "2026-08-05T02:03:18.038322+00:00", "fingerprint": "7f2c259ca480f9fc"}, {"source": "36氪 - 最新文章", "title": "自研高性能分布式解决方案，「芯晓科技」将芯片电源签核周期从几周缩短至几天 | 水下项目", "url": "https://36kr.com/p/3925067918227591?f=rss", "summary": "<p>一枚先进制程芯片从设计、验证，到流片、制造，需要经过上百个环节。其中电源签核（Sign-off）是设计流程最后的、也最重要的一环，相当于建造一栋大楼时对全楼供电系统进行竣工验收。</p>\n  <p>具体来说，电源核签是通过对电源网络的上亿个节点进行整体分析，测试供电网络的功耗、电压降与电迁移等表现，从而决定芯片能否顺利进入量产流片。一旦结果出错，不仅导致芯片性能不达标，甚至会造成流片失败。</p>\n  <p>由于芯片电源网络是由大量金属线组成的互联结构，因此电源签核时必须将其作为一个整体进行分析，“相当于求解一个维度高达数亿的稀疏矩阵方程，完成一次需要大量时间。”「芯晓科技」总经理谢卓解释道。</p>\n  <p>而随着芯片工艺制程不断缩小，晶体管数量指数级增加，电源核签的周期被进一步不断拉长，一次完整的电源签核往往需要几周时间之久。如果分析结果不理想，设计工程师还需要根据反馈修改版图，再重复一轮电源签核。</p>\n  <p>针对这一行业痛点，芯晓科技运用分布式矩阵求解技术，打破电源核签效率制约芯片交付周期瓶颈。公司推出的首款数字电源签核工具“IcPower”，支持7nm等先进工艺，能满足百亿门级芯片电源，在典型测试用例中速度是国外大厂工具的4.5-8.5倍，目前已在国内多家芯片厂商的芯片设计环节投入使用。</p>\n  <h2><strong>1.采用分布式求解技术，提高电源核签效率3-10倍</strong></h2>\n  <p>谢卓在创办芯晓科技以前，曾任国际知名EDA厂商Cadence电源完整性分析工具Voltus的中国技术团队负责人。</p>\n  <p>据他介绍，分布式求解的核心技术思路，来源于计算数学领域的“区域分解法”，通过将电源核签的巨大矩阵拆分为许多可以高效计算的小矩阵，用多台计算机并行运算，从而缩短整体求解时间，每个分析工具在求解大规模问题时候都会采用类似方法，但难点在于各个工具求解的效率会参差不齐。</p>\n  <p>谢卓表示，难点同时集中在算法和工程两方面。</p>\n  <p>一是要切得“科学”，也就是针对电源网络稀疏矩阵的特性，采用基于图论的智能区域分解算法，将百亿级的全局矩阵科学地切分为多个子矩阵，最小化子矩阵间的边界耦合。</p>\n  <p>二是需要运用分布式矩阵求解器优化节点间的通信拓扑和消息传递机制，大幅降低分布式环境下的网络通信开销。在分布式切分求解过程中，还需要引入严格的数值稳定性控制算法，确保分布式计算与单机高精度求解器的结果，达到数学意义上的严格一致，从而满足先进制程严苛的签核精度要求。</p>\n  <p>芯晓科技正是凭借团队在算法和工程层面的技术积累和创新，使IcPower相比国外工具速度提升上3-5倍，“对于一些耗时特别长的动态分析，部分测试水平可以做到10倍以上的速度提升，以前需要跑几周的电源签核，IcPower几天就能完成。”谢卓表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_210c834470104dd991a6a16952f88525@5688585_oswg35555oswg1031oswg440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">IcPower实测性能对比</p>\n  <h2><strong>2.抓住国产替代红利，致力于打造芯片设计平台</strong></h2>\n  <p>和许多近几年出现的EDA工具初创企业一样，芯晓科技切入电源签核赛道也是想抓住当下EDA行业“国产替代”的窗口期。</p>\n  <p>全球EDA市场长期被Synopsys（新思科技）、Cadence（楷登电子）、Siemens EDA（西门子EDA）三大巨头垄断。中国银河证券报告显示，三家在全球市场中的份额约为74%。而近年来不断升级的中美科技博弈，使越来越多国内芯片开始重视使用国产工具，将其作为替代或备份方案。</p>\n  <p>基于性能自信，芯晓科技在商业模式上选择对标国外工具，以软件授权为主，定价与国外工具相当。目前IcPower已在国内多家芯片设计公司投入使用，覆盖国产CPU、GPU、智驾芯片等类型，并在应用过程中借助客户的广泛设计用例与测试平台，不断迭代自身产品性能。</p>\n  <p>谢卓透露，2025年芯晓科技营收达到数百万元。“软件的研发成本基本是固定的，客户越多，盈利能力就能越强。”</p>\n  <p>但他也坦承，拓展客户是当下商业化的难点。“客户往往担心创业公司难以保证产品供应的持续性，因此首选规模更大的企业规模，虽然大公司在创新上的能力可能比不上创业公司。”</p>\n  <p>2026年下半年，芯晓科技计划开启天使轮后的新一轮融资，重点引入产业方资金，目的是在市场拓展方面获得更多帮助。</p>\n  <p>以华为提出的“韬（τ）定律”为代表，随着摩尔定律逐渐逼近物理极限，芯片行业正在从制程微缩转向纵向堆叠，这对电源核签来说意味着分析规模将呈指数级增长。</p>\n  <p>“底层技术积累越强，在这个方向上就越有竞争力。”谢卓表示，接下来芯晓科技的产品路线图也将围绕这一趋势展开，下半年将推出热分析和应力分析产品，支撑完整的热电耦合分析，帮助客户在3DIC设计早期发现芯片堆叠带来的发热和热应力问题。</p>\n  <p>此外，芯晓科技也在探索AI智能体在芯片设计中的应用，使客户通过自然语言就可以调用工具并完成各类设计任务，最终打造一个AI驱动，并能够接入其他EDA工具的芯片设计平台。</p>\n  <p>芯晓科技规划的这条路径最终能否走通，不仅取决于核心技术能否在更多场景中得到验证，还要看未来客户的规模化采购意愿，以及资本市场对公司发展潜力的持续信心。</p>", "category": "tech", "published_at": "2026-08-04T10:27:21+00:00", "fetched_at": "2026-08-05T02:03:18.038297+00:00", "fingerprint": "be708d6cab2e4885"}, {"source": "36氪 - 最新文章", "title": "“车企牌”电池相继上车，不只是PK宁德时代", "url": "https://36kr.com/p/3925382191708552?f=rss", "summary": "<p>“车企牌”电池正在不断涌现，并交付上车。鸿蒙智行推出了巨鲸电池，理想汽车推出了理想牌电池，不久前的7月30日晚，小米正式对外发布了龙甲电池。</p>\n  <p>车企正试图通过自有电池品牌，将电池的每个技术点攥在手中，并抢占用户心智。</p>\n  <p>这些汽车品牌的统一做法，就是“穿透式管理”，从电芯到电池包的技术和性能标准，车企全部主导定义，甚至部分参与电芯材料开发，并对核心供应链和生产制造环节全流程介入和监管。换句话说，“车企牌”电池是车企技术和标准的全面贯彻。</p>\n  <p>“甚至电池厂的核心岗位招聘，车企都要参与面试把关。”有行业人士透露。</p>\n  <p>这与过往的动力电池合作有着明显区别。据36氪了解，长期以来，头部动力电池公司如宁德时代等凭借技术实力，常常为车企供应相对成熟的系统级方案，尤其是旗舰类产品，如麒麟电池、神行电池等，车企能做的往往是提出需求，而定制开发的空间则相对有限。</p>\n  <p>但从“车企牌”电池的核心指标来看，车企往往有着更多的开发需要。比如巨鲸电池主打全温度周期的热防护标准，小米龙甲电池强调2000次循环和500J底部撞击标准等，理想汽车牌电池也追求“8年16万公里电池健康度不低于75%”，蔚来也提出过15年循环寿命的电池研发计划。</p>\n  <p>此外，动力电池做为电动汽车的心脏级零部件，常年占据30%成本结构，车企来把控电池开发和生产的全流程，从长期来看，也能确保供应链的稳定性和成本掌控力。</p>\n  <p>综合来看，车企对动力电池的全流程掌控需要，注定了“车企牌”电池今天开枝散叶的局面。</p>\n  <p>但与此同时，动力电池头部供应商宁德时代，也在竭力塑造消费者对宁德时代电池性能、安全性的认知。在机场、高铁站、商超等人群密集的地方，经常能看到“选电车看电池，认准宁德时代”的广告语。</p>\n  <p>据36氪了解，即便理想i6为欣旺达电池多给了两年延保，但售出的车型中，仍有超过一半的消费者选择了宁德时代电池。</p>\n  <p>因此，当车企试图将自有电池品牌推向台前时，经受过宁德时代“Intel Inside”战略洗礼的消费者，往往会提出这样的质疑——车企自研的电池包能否比得上宁德时代。</p>\n  <p>某种程度上，这似乎是个目前难有定论的问题。</p>\n  <p>不少电池行业人士对36氪表示，宁德时代的壁垒在于工艺管控能力、生产一致性。而且无论车企的自建产线，还是二三线电池厂商都很难在短时间内，追平宁德时代的这一优势，因为“一定要有足够大的生产体量，才能做有效的筛选和试错”。</p>\n  <p>通常情况下，更高的一致性，意味着更低的续航跳水、补能异常，甚至安全事故的概率。但车企自建的产线，和二三线电池厂的生产一致性水平，也可以通过增加测试工序等手段进行一定弥补。</p>\n  <p>而且，尽管在产品一致性上不及宁德时代，但“车企牌”电池亦有其优势。</p>\n  <p>36氪从一些行业人士处了解到，“车企牌”电池的产品定义、设计、生产通常由车企进行全方位管控，部分自研电池的车企，还会监督到电池的二三级子零件供应商，以确保最终的产品性能符合自己的高标准。</p>\n  <p>除此之外，车企对整车更为熟悉，因此“车企牌”电池的BMS算法，“在应用端可能比电池厂更好”。或许未来相当一段时间内，“车企牌”电池都会保持与宁德时代相持而行。</p>\n  <h3><strong>生产一致性，宁德时代的竞争壁垒</strong></h3>\n  <p>动力电池行业历经多年发展，动力电池技术、设备的成熟与普及，令各电池厂商间的技术代差逐渐拉齐。</p>\n  <p>电池产品间的竞争，越来越聚焦于生产的一致性。</p>\n  <p>许多行业人士都承认，宁德时代的电芯一致性，领先一众二三线电池厂。一个相对直观的体现是——“国内电芯，唯一不分档次的厂家就是宁德时代，因为都是一样的”。</p>\n  <p>“一致性不是那么好做的”。有行业人士告诉36氪，几乎所有的生产要素都会到动力电池的工艺控制，包括现场的湿度、温度、杂质、原材料选用等。</p>\n  <p>而电池厂商“一定要有足够大的生产体量，才能做有效的筛选和试错”。因而短期内，二三线电池厂商的生产一致性，很难赶上宁德时代。</p>\n  <p>而一致性之所以重要，是因为它能够直接影响到电池包的容量，甚至有可能引发安全事故。有电池行业人士表示，即便是行业公认更具本征安全的磷酸铁锂电池包，同样强调生产的一致性。</p>\n  <p>评估生产一致性的直接指标，是压差、内阻差异、尺寸差异等。</p>\n  <p>有行业人士举了个例子解释压差对电池包容量的影响：“原本电池包按100度电的容量去设计，但如果其中有颗电芯的电压只能达到98度，那BMS的均衡策略，会在充电时，把其余100度电芯的那两度电，变成热能消耗掉，从而将所有电芯控制在98度的电压范围之内。这就会造成，电池包的实际容量达不到100度的设计目标。”</p>\n  <p>36氪了解到，目前行业内动力电池的BMS策略，多为被动均衡，它能起到上述的“削峰”的作用，却难以“填谷”，——将100度电芯的电量，输送给98度的电芯。</p>\n  <p>“填谷”需要主动均衡的BMS策略，但这项技术的成本远超被动均衡的BMS策略，因此行业里少有企业采用。</p>\n  <p>一位行业人士举了商用车行业的例子：“一套商用车的主动均衡，报价约2万元，而且有价无市。主动均衡的BMS主要用在钛酸锂电池上，因为超大倍率放电，压差太大，加上钛酸锂能量密度本就低。”</p>\n  <p>这也就意味着，由于电芯一致性导致的电池包容量衰减，很难通过Pack层级的BMS策略去平抑。</p>\n  <p>电池包容量衰减，体现在整车上就是续航跳水、补能异常。但电芯一致性给电池包带来的影响还不止于此，有行业人士表示，它还会造成安全隐患。</p>\n  <p>“假如电池包容量跳水30%还在服役，那就很容易过充过放，过充过放的下一步就是起火。”有电池人士对36氪强调，即使是材料体系更为安全的磷酸铁锂，也遵循这一理论。</p>\n  <p>也有电池行业人士指出，生产一致性对电池包性能和寿命的影响，具体会达到什么程度，“这是一个概率问题”。</p>\n  <p>“这涉及到企业评估电池包可靠性的能力。”一位电池工程师表示，“压差到多少程度是可接受的，这需要通过大量统计数据计算。不过部分车企没有那么多数据样本，只能通过模型推理，而模型的精度又考验着企业员工的水平。”</p>\n  <p>他举例说：“假如A车企认为，压差在100毫伏的失效概率是10%，B车企认为100毫伏压差的失效概率是1%，那么基于这个判断，B车企会让电池包继续服役、企业继续监控，A车企则可能更换电池包，更换后的电池包压差只有10毫伏，电池包寿命自然也会延长。也有些车企会通过远程OTA，限制电池包的使用区间，也能够降低电池包失效风险。”</p>\n  <h3><strong>“车企牌”电池如何缩小差距</strong></h3>\n  <p>尽管宁德时代在生产一致性上，保持领先身位，但“车企牌”电池对一致性的重点盯防，希望努力缩小它们与宁德时代产品之间的差距。</p>\n  <p>一家参与自研电池项目的人士告诉36氪，他所在的车企用了很多强筛查手段，去追赶提升电芯品质。</p>\n  <p>他为36氪举了很多例子：“比如用来去除原材料中金属异物的除瓷工艺，行业里通常做两道，我们做四道。”</p>\n  <p>“用来筛查电芯一致性的降压测试，行业通常只做两三次，我们也做四次。”</p>\n  <p>36氪还从一些电池行业人士处了解到，X-ray（X光）检测也是电池厂提升品质的手段之一。</p>\n  <p>一些电池行业人士告诉36氪，X-ray的作用，就是穿透钢壳、铝壳，以及外层的极片，观察是否有极片、隔膜弯折，也能够检测出电池包内叠片或卷绕的结构性缺陷。“比如卷绕出的电芯，不是一个正常圆柱体，X-ray都可以看出来。”</p>\n  <p>据36氪了解，目前宁德时代、远景动力、欣旺达等厂商，都已采用X-ray检测工序来提升制造管控能力。</p>\n  <p>有欣旺达人士对36氪表示：“欣旺达试产线上的电芯，每颗都会经历X-ray检测，每条量产产线上也都会大量使用X ray，可能是每多少颗电芯测一颗，也可能是所有电芯都测。”</p>\n  <p>不过，需要注意的是，一些电池行业人士认为，X-ray究竟能在多大程度上弥补电芯的一致性，仍取决于电池厂商的能力。</p>\n  <p>X-ray能够呈现显性的表征，但如何通过这些判断一致性的风险概率，这也会因电池厂的能力而异。</p>\n  <p>或许，二三线电池厂的电芯级能力，还需要相当一段时间追赶到头部水平，但这并不能简单等同于，“车企牌”电池一定不如宁德时代。</p>\n  <h3><strong>全流程管控，“车企牌”电池的优势</strong></h3>\n  <p>36氪了解到，车企从宁德时代采购整包电池，宁德时代给的是个类似“灰盒”的方案。</p>\n  <p>部分行业人士表示，电芯工艺、材料配方，宁德时代通常是保密的，生产现场的管控车企也难以过多参与。</p>\n  <p>有蔚来工程师对36氪称：“宁德时代几乎什么都不给。”这在一定程度上，印证了宁德时代开放程度较低。有电池行业人士表示，宁德时代会开放给车企的，“主要是一些基本电芯下线测试数据，比如容量、电压、内阻等”。也有电池工程师表示，数模释放、冷板流道等，车企也能看到。</p>\n  <p>这意味着，车企很难深度参与电池包的全流程管理，电池的质量、性能几乎只能依赖宁德时代的管理。</p>\n  <p>但宁德时代的管理，未必总是优于车企。一家头部车企的电池人士告诉36氪，就他们内部测试的结果而言，宁德时代的一些长期性能指标参数，有时可能并非行业最优。</p>\n  <p>他解释：“宁德时代更早摸清了材料的安全边界，所以敢于把边界压得比较极限。”由此引发了这家车企内部的博弈——品牌端希望搭载宁德时代产品，研发端则持反对意见。</p>\n  <p>反之，“车企牌”电池，车企则能够对电池包的设计、开发、生产进行全方位、无死角的管控。理想牌电池正是一个鲜明的案例。</p>\n  <p>有接近理想的行业人士告诉36氪，理想和欣旺达的合作中，“基本上全是理想在操刀，欣旺达是配合。理想电芯开发、材料的人都有，理想牌电池几乎就是理想设计的，欣旺达更多的是扮演代工方的角色”。</p>\n  <p>理想还曾为这个项目，专门招了十来个电芯开发的人员。36氪从部分行业人士处了解到，直到去年，理想在电池上投入的总人员规模，约为300多人。</p>\n  <p>或许也正得益于，理想对理想牌电池的全方位管控，部分理想人士对36氪表示，从售后数据来看，理想牌电池的失效率和宁德时代差不多，个别月份，理想牌电池的失效率甚至低于宁德时代。</p>\n  <p>鸿蒙智行的巨鲸电池也采用全方位管控的思路，以控制产品质量。</p>\n  <p>36氪曾报道过，巨鲸电池是华为的电池开发标准，对外是华为电池品牌。巨鲸电池的开发标准比行业普遍标准都高，“比如高温热失控实验，华为的要求是，在电池包、整车、周边环境都很热，电量又约为100%的情况下，电池包热失控后不会爆炸。很少有比这更严苛的了”。</p>\n  <p>部分接近鸿蒙智行的行业人士表示：“华为从化学体系到原材、工艺、下线检测都会参与。但他们人手相对有限，所以更多的是监督和验证可靠性，有时候可能不会特别深入地参与电芯研发。”但华为这套严格的准入标准，仍能为巨鲸电池的安全性带来一定保障。</p>\n  <p>7月30日晚，小米汽车技术发布会上，小米集团董事长雷军发布龙甲电池时介绍，这是一套由小米主导的动力电池系统化解决方案，由小米负责产品定义、主导电池包设计开发、参与电芯设计开发、进行全流程质量管控。</p>\n  <p>36氪从部分接近小米的行业人士处了解到，小米为了保证自研电池的性能，“找了很多好的SQE一把手来教自己的员工”，去年小米在电池上投入的人力约为100多人，“其中大部分是BMS的人”，小米也在招聘系统设计相关的人，“因为他后面要做很多工业化的东西”，也在逐步补齐自己的电芯能力。</p>\n  <p>和巨鲸电池一样，龙甲电池的安全标准也相对苛刻。雷军在发布会表示：“龙甲电池安全标准超过国标。”比如其中，”500J底部撞击电池功能不失效”这项，许多行业人士认为“这是比较高的标准”，国标要求的是150J底部撞击后，不泄露、不起火、不爆炸。</p>\n  <p>还有行业人士透露，部分自研电池的车企，还会追溯到电池的二三级供应链，比如正负极材料上，制定筛选材料标准。同时车企也会对二三线电池厂的一致性，制定相当于宁德时代的要求。</p>\n  <p>“甚至包括箱体上的盖板等，有质量不达标的，车企的工程师会帮助这些供应商做人员培训、产线改造、质量提升，确保它们的材料能符合车企的标准，这是过去行业里很少有人做的”。</p>\n  <p>“车企牌”电池的另一个优势在于，主机厂的BMS团队，“在应用层做得可能更好，因为控制器之间是有交互的，而主机厂更懂车”。</p>\n  <p>短时间内，汽车行业的动力电池供应，或将分化为两种路线，一种是以宁德为主的高集成式供应，而更多的二三线电池厂商，则会成为“车企牌”电池模式下，被全流程管控的、类似ODM的角色。</p>\n  <p>但是当车企带领电池厂，将能力逐步提升，并且获得消费者认可，龙头公司能做的无疑是进一步开放，并且跟随和融入车企的标准和开发体系，这也正是“车企牌”电池推出的核心初衷：不是为了斗争，而是实现更高的技术和性能标准，推动行业进入更健康的发展轨道。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_05fe80f2256f47eb99556bf2af5ccebe@6215398_oswg24302oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-08-04T15:46:22+00:00", "fetched_at": "2026-08-05T02:03:18.038289+00:00", "fingerprint": "46442eb35e03491e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨马斯克个人财富亏掉2个“黄仁勋”；上海雪花膏母公司破产；日本半导体或面临断供", "url": "https://36kr.com/p/3925868626360706?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>一架上海飞东京航班险撞机，两机垂直高度差仅约20米</p>\n  <p>阿里云容器服务Agent开启商业化收费</p>\n  <p>今年以来港股IPO数量同比增长132%，科技类公司占比过半</p>\n  <p>苹果新任CEO据悉邀请已退休的硬件部门负责人加入管理团队</p>\n  <p>SpaceX上市后首份财报前夕，“木头姐”持续加仓</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>马斯克个人财富缩水约合人民币2.45万亿元，相当于亏掉2个“黄仁勋”&nbsp;</strong></p>\n  <p>据微信公众号“福布斯”消息，6月12日SpaceX上市，马斯克成为全球首位万亿富豪。但他13位数字的身家并未维保持多久——SpaceX的股价此前一路飞升，如今却跌回地表，马斯克在7月单月财富缩水3630亿美元（约合人民币2.45万亿元），创下纪录。这一缩水幅度，甚至超过了全球第2至第10大富豪中任何一人的全部身家，是英伟达CEO黄仁勋身家（1740亿美元）的两倍多。截至美国东部时间8月1日零点，排名第2的拉里·佩奇身家微增10亿美元，约为2920亿美元；而马斯克的身家约为6900亿美元，降至去年12月以来的最低水平。（红星新闻）</p>\n  <p><strong>上海雪花膏母公司破产，财产不足以支付破产费</strong></p>\n  <p>近日，上海市浦东新区人民法院出具（2024）沪0115破151号民事裁定书，宣告上海美兰化妆品有限公司（以下简称“美兰”）破产并终结清算程序。裁定书援引《企业破产法》第四十三条认为，企业现有财产不足以支付破产费用，管理人提请法院直接终止清算，普通债权人无财产可分配。</p>\n  <p>据裁定书配套管理人清算数据，美兰可处置资产仅9.58万元，法院确认债权总额1941.67万元，账面资产连诉讼费、管理人报酬等基础办案成本都无法覆盖。这家诞生于1984年、依靠老上海雪花膏走红的本土老牌日化企业彻底退场。（红星新闻）</p>\n  <p><strong>受地震影响，日本半导体或面临断供</strong></p>\n  <p>7月28日，日本熊本县发生强震，多家半导体相关企业停产至今。九州地区因聚集大量半导体相关企业被称为“硅岛”，熊本县自1970年前后开始吸引半导体企业落户，逐步发展成为日本重要的半导体产业基地。</p>\n  <p>熊本县内聚集着大量半导体相关企业和汽车工厂，有专家表示强震将给相关产业带来严重冲击。不仅是半导体，受零部件供应延迟影响，日本部分汽车制造商的生产也已受到波及。丰田汽车已决定暂停福冈县3家工厂的生产至8月5日，位于爱知县的田原工厂也将于8月3日至7日停产。本田宣布，熊本县大津町的摩托车工厂将停产至8月7日。日产汽车则决定，将福冈县两家工厂的部分生产线停工至8月5日。（金融界、央视网）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>面壁智能开源全球首个Stencil优化AI系统</strong></p>\n  <p>36氪获悉，8月4日，面壁智能联合OpenBMB开源社区正式发布并开源全球首个Stencil（模板计算）优化“自动研究+自动部署”大闭环AI系统ForgeStencil。实测数据显示，ForgeStencil在同精度（fp32）下几何平均加速2.35倍，混合精度下额外提速1.95倍。在真实应用场景中，通用CAE求解器hypre加速3.86倍，电磁仿真FDTD加速2.47倍，核反应堆中子学计算minisweep加速最高达5.78倍。</p>\n  <p><strong>阿里云容器服务Agent开启商业化收费</strong></p>\n  <p>36氪获悉，阿里云宣布，容器服务Agent将于北京时间9月3日10时增加新的技能中心和IM频道等功能并开启商业化收费。本次调整后，相关对话、自主智能运维及定时任务等功能将开始收费。调整过程不会影响存量用户已有设置和历史任务记录。容器服务Agent以积分（Credit）作为计量单位，免费开通，支持按量付费及预付费资源包抵扣。使用容器服务Agent的对话、自主智能运维及定时任务等功能时产生的模型资源消耗会折算为积分进行计费。</p>\n  <p><strong>腾讯混元发布最新语音识别模型Hy ASR 3.0 preview</strong></p>\n  <p>36氪获悉，腾讯混元正式发布新一代语音识别模型Hy ASR 3.0 preview。在开源评测集中，Hy ASR 3.0 preview在多语种的WER（Word Error Rate,词错误率）上都控制在3%左右，其中中文普通话WER 3.34%、英语WER 2.62%、粤语WER 3.12%。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>一架上海飞东京航班险撞机，两机垂直高度差仅约20米</strong></p>\n  <p>8月4日清晨5时44分左右，一架全日空航班在东京羽田机场上空临近降落时，与一架名为“白博士”的日本政府飞行检查飞机险些相撞。“空中防撞系统（TCAS）”启动，避免了飞机碰撞。当时试图降落的飞机是由上海出发、飞往羽田机场的NH968航班，机上共有197名机组人员和乘客。根据飞行轨迹数据显示，当时两机垂直高度差仅约20米，存在极高碰撞风险。全日空航班机组收到TCAS防撞系统告警后立刻执行复飞操作进行避让，现场管制人员随即向日本检查机机组发出严厉问询：“没看到正在降落的航班吗？”全日空已将此事报告给日本国土交通省。（新民晚报）</p>\n  <p><strong>申通快递：终止发行可转债并撤回申请文件</strong></p>\n  <p>36氪获悉，申通快递公告，公司董事会审议通过《关于终止向不特定对象发行可转换公司债券事项并撤回申请文件的议案》。目前公司各项业务经营情况稳定，本次终止向不特定对象发行可转换公司债券事项不会对公司的经营活动及财务稳定性造成重大不利影响。敬请投资者理性投资，注意投资风险。</p>\n  <p><strong>美股三大指数集体收涨，光通信、存储板块集体上涨</strong></p>\n  <p>36氪获悉，8月4日收盘，美股三大指数集体上涨，纳指涨2.59%，标普500指数涨1.79%，道指涨1.71%。光通信、存储板块集体上涨，迈威尔科技涨超12%，英特尔、闪迪涨超10%，康宁涨超9%，Lumentum、SK海力士涨超8%，美光科技涨超7%。大型科技股多数上涨，英伟达涨超2%，谷歌、苹果、特斯拉、微软涨超1%；亚马逊跌超2%，Meta小幅下跌。热门中概股多数下跌，小鹏集团跌超2%，理想汽车、蔚来、哔哩哔哩跌超1%，京东、百度小幅下跌；阿里巴巴涨超1%，拼多多涨近1%。</p>\n  <p><strong>苹果：由于Telegram上内容违反了相关指南，曾短暂将其从App Store下架</strong></p>\n  <p>苹果表示，在审查发现Telegram即时通讯应用中存在违反其“禁止儿童性虐待内容”准则的内容后，曾短暂将其从App Store下架。该公司表示，在“开发者迅速删除了相关内容并封禁了发布该内容的用户”后，已恢复该应用的上架。（新浪财经）</p>\n  <p><strong>麦当劳宣布更换美国业务总裁</strong></p>\n  <p>麦当劳8月4日宣布，在公司拥有超26年工作经验的Skye Anderson出任麦当劳美国总裁，即日起生效，接替已掌管麦当劳美国业务近7年的Joe Erlinger。麦当劳当日公布财报显示，二季度美国市场同店销售额增长0.8%，为2025年年初以来最慢增速。（界面新闻）</p>\n  <p><strong>今年以来港股IPO数量同比增长132%，科技类公司占比过半</strong></p>\n  <p>据Wind数据统计，截至8月3日，今年以来，已经有102家公司成功登陆港股市场，同比增长132%；募资总额约3260亿港元，同比增幅超153%。在年内上市的港股公司中，科技类公司占比超过一半，且“A+H”公司达32家。（21世纪经济报道）</p>\n  <p><strong>7月韩国股市出现历史性暴跌，韩股崩盘后散户失去信心</strong></p>\n  <p>7月韩国股市出现历史性暴跌，KOSPI指数单月重挫22%，创下金融危机以来最大月度跌幅，月内四度触发熔断。尽管月末大盘迎来18%的强势反弹，但散户在反弹当日依旧创纪录净卖出股票，市场信心并未得到修复。</p>\n  <p>此前不少韩国散户受追涨情绪影响，借助政府推出的单股杠杆ETF加杠杆，大举买入三星、SK海力士等AI概念股，5‑6月累计买入规模折合542亿美元，在7月的剧烈震荡中损失惨重。不少投资者心态崩塌，甚至表态不再参与韩股。分析人士提醒，市场去杠杆化短期难以结束，科技与半导体板块的震荡行情或将持续数月，本次崩盘已经深刻改变韩国散户的投资心理。（新浪证券）</p>\n  <p><strong>《智能网联汽车 自动驾驶系统安全要求》强制性国家标准正式发布</strong></p>\n  <p>36氪获悉，据工信部网站，7月30日，工业和信息化部组织制定并归口的《智能网联汽车 自动驾驶系统安全要求》（GB 44721—2026）强制性国家标准由国家市场监督管理总局、国家标准化管理委员会批准发布，拟于2027年7月1日起正式实施。《智能网联汽车 自动驾驶系统安全要求》适用于搭载L3级、L4级（高度自动驾驶）系统的M类和N类车辆，不适用于自动泊车系统。该标准立足中国产业发展与行业监管实际需求，兼顾技术可行性、产业适配性与落地实操性，构建了维度完整、要求清晰、适配国情的安全要求体系。</p>\n  <p><strong>央行将开展5000亿元买断式逆回购操作</strong></p>\n  <p>36氪获悉，为保持银行体系流动性充裕，2026年8月5日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为3个月（92天），到期日为2026年11月5日（遇节假日顺延）。</p>\n  <p><strong>日本央行账户数据显示，无明确迹象表明周一大规模干预汇市</strong></p>\n  <p>据报道，根据对日本央行账户的分析，没有明确迹象显示8月3日进行大规模汇市干预。4日公布的日本央行账户与货币经纪商的预测相比存在约8800亿日元差异，这表明周一可能进行小规模干预，但未提供确凿证据。早前数据显示，日本上周四可能投入8.45万亿日元支撑汇市，上周五又投入5.33万亿日元，与美国联合行动干预汇市。（界面新闻）</p>\n  <p><strong>苹果新任CEO据悉邀请已退休的硬件部门负责人加入管理团队</strong></p>\n  <p>据报道，苹果公司即将上任的首席执行官约翰·特纳斯（John Ternus）正将一位曾在自己负责硬件工程期间共事过的得力助手重新招致麾下，加入其新的管理团队。报道称，特纳斯已聘请劳拉·莱格罗斯加入团队，莱格罗斯此前曾担任硬件工程副总裁，直至2022年退休。（财联社）</p>\n  <p><strong>IDC：2025年中国外骨骼机器人市场规模超16亿元，出货量约2.6万台</strong></p>\n  <p>36氪获悉，国际数据公司（IDC）发布《中国外骨骼机器人市场份额，2025》研究报告显示，2025年中国外骨骼机器人市场规模超过16亿元，出货量约2.6万台。其中，医疗康复市场仍占据主要市场价值，消费助力市场则贡献了七成以上出货量，行业应用持续拓展新的增长空间。</p>\n  <p><strong>印尼财长：印尼将出台刺激政策提振电动车销量</strong></p>\n  <p>印尼财政部长普尔巴亚・尤迪・萨德瓦周二在一场车展活动上表示，印尼政府将于未来数周推出相关举措，推动电动自行车等各类电动汽车消费。普尔巴亚称，这套刺激方案计划覆盖50万辆电动摩托车，将由印尼总统普拉博沃・苏比安托在两三周内正式公布。（新浪财经）</p>\n  <p><strong>韩国赴华游客数量持续增长</strong></p>\n  <p>韩国政府最新统计数据显示，今年1月至6月，韩国访华人数约171.4万人次，较去年同期增长16%。韩国业界普遍认为，中国是“距离近、体验好的海外旅游目的地”，预计2026年全年韩国赴华游客人数将继续保持增长。据韩国《东亚日报》报道，中国正作为“高性价比旅游目的地”受到韩国游客关注，赴华旅游产品持续扩容。特别是中国自2024年11月起对韩国公民实行最长30天免签入境政策，让韩国游客节省签证办理等相关费用，大幅降低出行成本。（财联社）</p>\n  <p><strong>SpaceX上市后首份财报前夕，“木头姐”持续加仓</strong></p>\n  <p>凯茜・伍德在7月最后一周加码布局其最为看好的投资赛道，将SpaceX列为头号买入标的，通过四只基金合计买入约2600万美元。除此之外，伍德在CoreWeave股价回调后，斥资1550万美元购入该股，同时增持价值1430万美元的特斯拉股票。（新浪财经）</p>\n  <p><strong>广告技术公司Teads在纽约法院起诉Google和Alphabet</strong></p>\n  <p>当地时间8月3日，广告技术公司Teads向美国纽约南区联邦地区法院对Google和Alphabet提起诉讼，寻求经济损失赔偿及其他救济措施。该诉��是在美国弗吉尼亚东区联邦地区法院裁定Google在特定广告技术市场存在“非法反竞争行为”之后提出的。（界面新闻）</p>\n  <p><strong>全美25州提起诉讼，反对美政府最新关税措施</strong></p>\n  <p>当地时间8月3日获悉，法庭文件显示，美国有25个州提起诉讼，反对美政府最新关税措施。美国纽约州总检察长宣布，由民主党人领导的25个美国州于当日提起诉讼，起诉美国政府。这些州主张，总统针对来自60个贸易伙伴的商品征收最新一轮关税的举措，超出了其对进口商品征税的法定权限。总检察长称，最新关税只是为了替代那些已被美国最高法院否决的关税措施。新关税范围宽泛得不合法，且绕过了法律规定的针对特定国家的调查程序。（央视新闻）</p>\n  <p><strong>蚂蚁阿福辟谣负责人调整：假消息</strong></p>\n  <p>36氪获悉，蚂蚁阿福官博发文辟谣称，网传“蚂蚁阿福1号位伟鹤调整”为假消息。</p>\n  <p><strong>追凉航线订单暴涨500%</strong></p>\n  <p>2026年民航暑运已过半程，今年暑运市场呈现“启动偏晚、后期旺盛”的特征。近期全国多地持续高温，不少旅客纷纷调整出行计划，将目光投向了自带天然“空调”属性的目的地。数据显示，七月以来“避暑纳凉”“夜游”相关关键词的搜索量环比增长238%。记者查询发现，截至目前，今年暑期机票预订量增幅最高的20条航线中，有近半数属于“追凉航线”。其中，芜湖至贵阳增长5倍。此外，郑州至芒市、广州至延吉的航线增幅均超3倍，惠州至太原航线机票预订量增长2.4倍。（央视财经）</p>\n  <p><strong>英伟达、思科、CrowdStrike等企业推动起草AI网络安全指南</strong></p>\n  <p>据英伟达8月4日声明，Linux基金会发布关于“共享AI发现交换”（SAFE）的征求意见稿。据介绍，SAFE是一套拟议指南，旨在将涉及AI智能体的网络安全事件转化为整个生态系统的共享防护能力。声明称，“开放安全AI联盟”的一个工作组正负责起草SAFE指南。英伟达、思科、CrowdStrike、Hugging Face和Red Hat等联盟成员正与Linux基金会合作，共同推进这一初步提案。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>具身智能初创公司智平方据悉考虑明年在香港上市</strong></p>\n  <p>具身智能初创公司智平方据悉考虑明年在香港上市。（财联社）</p>\n  <p><strong>消息人士称Shein拟八月份在香港进行首次公开募股</strong></p>\n  <p>消息人士称，Shein拟八月份在香港进行首次公开募股，目标估值为300亿至400亿美元。（新浪财经）</p>\n  <p><strong>嘉立创上市</strong></p>\n  <p>8月4日，嘉立创登陆A股。早盘集合竞价嘉立创上涨177.47%，最新市值为1302亿元，报234.35元/股，与发行价84.46元/股相比，中一签开盘即可赚74945元，当日收盘价为208.01元/股。值得一提的是，嘉立创是A股今年以来发行价第二高的新股，仅次于科创板新股恒运昌（发行价为92.18元/股）。(中国证券报)</p>\n  <h2>大公司财报</h2>\n  <p><strong>软银公司第一财季净利润1500.7亿日元，低于市场预期</strong></p>\n  <p>8月4日，软银公司公布2027财年第一季度业绩报告。公司第一财季净销售额为1.81万亿日元，预估为1.76万亿日元；营业利润为3023.0亿日元，预估为2755.4亿日元；净利润为1500.7亿日元，预估为1525.2亿日元。软银仍预计2027财年全年净销售额为7.50万亿日元，营业利润为1.10万亿日元，净利润为5600.0亿日元，股息为8.80日元。（界面新闻）</p>\n  <p><strong>AMD二季度营收115.36亿美元，同比增长50%</strong></p>\n  <p>当地时间8月4日，AMD公布了截至2026年第二季度的财务业绩。公司当季实现总营收115.36亿美元，同比增长50%，刷新单季度营收历史纪录。在GAAP准则下，净利润达22.97亿美元，同比增长163%；稀释后每股收益（EPS）为1.38美元。在Non-GAAP准则下，净利润为27.60亿美元，同比增长253%；每股收益为1.66美元，高于市场分析师预期。数据中心业务成为绝对的核心增长引擎，二季度营收达67.2亿美元，同比暴增107%，占公司总营收的58%。（界面新闻）</p>\n  <p><strong>SpaceX发布上市后首份财报：营收78.14亿美元，同比增长92%</strong></p>\n  <p>36氪获悉，SpaceX发布2026年第二季度财报，这是该公司上市后发布的首份财报。财报显示，SpaceX第二季度营收78.14亿美元，较上年同期的40.71亿美元增长92%；净亏损5.41亿美元，较上年同期的净亏损10.08亿美元收窄46%。</p>\n  <p><strong>汇丰控股：上半年收入377.42亿美元，同比增11%</strong></p>\n  <p>36氪获悉，汇丰控股公告，2026年上半年列账基准除税前利润195.22亿美元，较2025年上半年的158.1亿美元增加37亿美元，增幅为23%。除税后利润153.21亿美元，同比增23%。收入377.42亿美元，同比增11%。净利息收益率为1.61%，较2025年上半年上升4个基点。董事会已通过派发第二次股息每股0.1美元，并有意启动最多10亿美元的股份回购。</p>\n  <p><strong>英国石油公司第二季度调整后净利润57.3亿美元，高于市场预期</strong></p>\n  <p>8月4日，英国石油公司公布第二季度业绩报告。公司第二季度调整后息税前利润为103.1亿美元，预估为92.5亿美元；调整后净利润为57.3亿美元，预估为50.1亿美元；调整后每股收益为0.3692美元，预估为0.33美元。（界面新闻）</p>\n  <p><strong>Grab二季度净利大增620%，上调全年盈利预期</strong></p>\n  <p>Grab公布二季度净利同比大增620%至2.52亿美元；二季度营收从去年同期的8.19亿美元增至9.97亿美元，高于分析师预期的9.91亿美元，增长主要得益于配送、出行和金融服务业务营收增长。Grab预计2026年全年营收将介于41亿美元至41.5亿美元，高于此前预测的40.4亿美元至41亿美元。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“木木西里”完成数千万元B轮融资</strong></p>\n  <p>36氪获悉，近日，南京木木西里科技有限公司宣布完成数千万元B轮融资。本次融资由华瑞集团领投，中盛汇普、巨石资本、江宁经开资本共同跟投。本次募集资金将重点用于核心技术持续研发、生产产线扩建，进一步提升国产高端光学检测仪器研发与规模化交付能力。</p>\n  <p><strong>网络安全初创公司Horizon3.ai融资2.5亿美元</strong></p>\n  <p>总部位于旧金山的提供道德黑客雇佣服务的Horizon3.ai在后期融资中筹集了2.5亿美元。本轮融资由NightDragon和NEA共同领投，这两家机构均曾参与早期融资，此外还有十多家新老投资者参投。Anthropic的Mythos和其他前沿人工智能（AI）模型让网络攻击威力大增，引发了企业界的担忧浪潮，该公司希望借此势头实现发展。（新浪财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>三星探索内存新技术：垂直堆叠于AI加速器之上，密度超传统HBM5十倍</strong></p>\n  <p>金十数据8月5日讯，美东时间8月4日，三星电子在美国加州圣克拉拉举行的未来存储与内存大会(FMS)上推出其V10Bonding V-NAND，即BV-NAND原型产品。该芯片拥有超过400层结构，并采用全新的晶圆键合架构，以提高存储密度并增强性能。三星表示，其BV-NAND技术较上一代V9 NAND将存储密度提高约58%，同时提升读取、写入以及输入/输出性能，以满足人工智能系统对更高容量、更高能效存储解决方案日益增长的需求。三星还展示了其称业界首款zHBM和ZNAND-O架构概念模型。该技术通过垂直堆叠存储单元，在更小空间内存储更多数据。不同于传统HBM与AI处理器并列封装的方式，三星的zHBM会将存储垂直堆叠于AI加速器之上，以缩短数据传输距离，提高带宽,同时提升能源效率。三星表示，其晶圆键合技术有望实现超过传统HBM5内存10倍的存储密度，同时将能源效率提高3倍，并将热阻降低一半以上。（金十数据）</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>机器人复刻人类触觉手感难度颇高，相关技术仍存不少难关。</p>\n  <p><strong>恋爱“越界行为”小调查</strong></p>\n  <p>在一段亲密关系中，人能完整地做自己吗？是否应该划清一条明确的“边界”？</p>\n  <p>很多伴侣间矛盾的根源，都是没对齐彼此的边界底线：对象的手机能不能看；想要独处空间有没有错；和异性朋友单独见面该不该报备；面对性行为时出现犹豫，是否该及时叫停……欢迎扫描下方二维码，告诉我们：你在亲密关系中保留自我的“边界感”在哪里？又会在哪一刻意识到，对方越界了？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_8585f418b5cc4308a8ae0c970a1450f4@5667365_oswg11960oswg195oswg183_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫描二维码参与小调查</p>\n  <p>扫描下方二维码<strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-08-05T00:02:59+00:00", "fetched_at": "2026-08-05T02:03:18.038275+00:00", "fingerprint": "88584bfd7a23d6f5"}, {"source": "少数派", "title": "角落新声｜成年的快乐，是可以将角落铺满全家", "url": "https://sspai.com/post/112738", "summary": "我理解中的角落，不是电影里那种阴暗逼仄、藏着邪恶与不堪的地方，而是生活中时间与现实的锚点。<a href=\"https://sspai.com/post/112738\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-04T02:59:26+00:00", "fetched_at": "2   if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
