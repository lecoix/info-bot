since July of 2024. Part four of the podcast's series on Can wrapped up an abbreviated season three, which focused on experimental rock. Don't get me wrong, I loved seasons one and two, but the show seemed to be gearing up for a [&#8230;]", "category": "tech", "published_at": "2026-08-09T20:28:31+00:00", "fetched_at": "2026-08-10T01:20:38.158590+00:00", "fingerprint": "59fe9d99564b8136"}, {"source": "36氪 - 最新文章", "title": "最前线|中科慧思发布三款灵巧手产品，要从“抓取”走向真实场景作业", "url": "https://36kr.com/p/3931010805579139?f=rss", "summary": "<p>8月7日，在湖南长沙首次亮相的中科慧思具身智能（湖南）有限公司（以下简称“中科慧思”）发布三款灵巧手产品。</p>\n  <p>中科慧思成立于2026年7月，由北京中科慧灵机器人技术有限公司（简称“中科慧灵”）、蓝思科技股份有限公司（简称“蓝思科技”）与湖南华夏投资集团有限公司(简称“华夏集团”)共同成立。</p>\n  <p>公司专注于灵巧手及具身操作能力的科技企业，以灵巧手为产品入口，面向机器人抓取、操作和作业能力建设，致力于推动灵巧手从单一硬件部件向软硬件结合的操作能力平台发展。</p>\n  <p>此次发布的三款产品针对不同任务需求，其中，L1采用轻量化、精简自由度的产品路线，主打高性价比、高稳定性、长寿命和易部署。精简自由度配置有助于控制系统复杂度与产品成本，轻量化设计能够减少机器人手臂末端负担，较快的开合与响应能力则可以面向高频动作和连续运行需求。在CASBOT BAND机器人乐队中，L系列灵巧手已经应用于吉他、贝斯、电子琴等真实乐器演奏。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_afdfb79c597647658cbb8214a5f12e86@6310669_oswg672817oswg2560oswg1707_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">CASBOT BAND机器人乐队表演</p>\n  <p>D1定位为高自由度通用五指灵巧手，主打运动灵活性、多关节独立运动、多指协同与触觉感知能力。M1定位为模块化场景灵巧手，围绕复杂场景操作需求进行设计，通过“标准化主体＋功能化指尖”的模块化架构，实现不同作业能力的快速切换。</p>\n  <p>另外，F系列为本次预发布产品，其围绕高自由度、仿生结构和柔顺操作展开探索。通过绳驱仿生结构，探索更加接近人手运动方式的高自由度柔顺操作能力。</p>\n  <p>作为机器人与环境交互的末端执行器，灵巧手正在成为推动人形机器人技术变革的关键突破口。高工产业研究院（GGII）发布的《2026年H1中国灵巧手行业调研报告》显示，2025年中国灵巧手市场销量约1.92万只，同比增长236.84%；预计2026年销量将达到7.02万只，同比增长265.63%。</p>\n  <p>然而，行业竞争仍停留在参数层面。目前，灵巧手行业的产品评价较多集中在自由度、重量、负载、速度、精度和传感配置等指标。这些参数固然重要，但在人类完成精细操作时，真正发挥作用的不只是手指数量，而是手部结构、感知能力、力量控制以及长期经验的综合协同。</p>\n  <p>比如，高自由度并不会自然转化成灵巧作业技能。机器人能够稳定拿起一把螺丝刀，只说明它具备了抓取能力；真正完成旋拧，还需要控制工具姿态、位置、运动轨迹和作用力。因此，应进一步关注机器人能否完成真实任务，从“抓取能力”走向“操作能力”，再走向“作业能力”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_7d8c7a62bef14d9f9351d9e46cf96163@6310669_oswg2657518oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L1轻量版通用灵巧手（高速版）现场展示</p>\n  <p>关注从硬件到数据再到技能的完整链条也是是中科慧思三款产品的研发逻辑。据了解，中科慧思虽然成立时间不长，但产品与技术基础来自中科慧灵在具身智能多年形成的研发能力与场景实践。中科慧灵创始人、董事长张正涛表示，中科慧思成立以后，团队将把这些能力和经验进一步产品化和系列化，让不同产品分别回答通用操作、高自由度操作和场景适配问题。</p>\n  <p>硬件定义数据的上限，数据定义硬件的价值。系列化本体为数据采集提供统一、稳定的硬件载体，持续积累的同源数据又能够反向推动模型能力、操作技能与产品性能提升，形成由本体和数据的相互促进。</p>\n  <p>因此，在灵巧手产品矩阵的基础上，中科慧思还进一步提出“多系本体×数据采集”的双飞轮发展逻辑。一方面，通过不同结构、不同自由度和不同应用定位的系列化灵巧手本体，为机器人整机、科研开发、数据采集及场景应用提供硬件基础；另一方面，通过数据手套、遥操作设备和数采工具链持续积累灵巧操作数据，推动模型、技能和硬件迭代。</p>\n  <p>目前，中科慧思已落户湖南湘江新区，并宣布参与建设专业化灵巧手技能训练场，围绕真实任务开展数据采集、技能训练与应用验证。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-08-09T02:30:15+00:00", "fetched_at": "2026-08-10T01:20:38.053432+00:00", "fingerprint": "a810f6c340e8341e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宇树科技今日申购，中一签或赚20万元；胖东来关闭许昌24年老店，于东来回应；拜登前列腺癌持续恶化，癌细胞已扩散", "url": "https://36kr.com/p/3932930478587010?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>苹果回应删除接入千问手册</li>\n   <li>影片《八仙！》票房突破14亿元</li>\n   <li>理想汽车-W于8月6日斥资361.82万美元回购57.27万股</li>\n   <li>消息称SpaceX收购Cursor交易最快下周完成</li>\n   <li>英特尔任命Dean Jarnac为首席销售官</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>宇树科技今日申购，中一签或赚20万元</strong></p>\n  <p>8月10日，宇树科技将在科创板开启申购，A股“人形机器人第一股”正式登场。宇树科技证券代码688836，网上申购代码787836。发行价格为150.80元/股，对应上市时市值约609.93亿元，对应2025财年发行后市盈率为219倍。根据公告，宇树科技网上、网下申购日均为8月10日，缴款截止日均为8月12日，首发募资约61亿元。中一签（500股）需缴款7.54万元。</p>\n  <p>考虑到宇树科技本次发行流通盘规模较小，又叠加“第一股”的题材光环，多家券商综合测算显示，其预计中签率在万分之二至万分之三之间，远低于长鑫科技0.47%的中签率水平。数据显示，2026年以来A股新股上市首日平均涨幅高达276.04%，若以此测算，中一签宇树科技账面盈利有望突破20万元；若对标年内科创板新股首日466.61%的平均涨幅，单签盈利可达35.18万元。 （新浪财经、21财经）</p>\n  <p><strong>于东来发文回应关闭胖东来许昌生活广场店</strong></p>\n  <p>8月9日，胖东来创始人于东来发文回应许昌生活广场关店一事。“不专业造成的失误是金钱无法衡量的。2015年左右，关于许昌生活广场，由于负责此项工作人员没有按照公司规定造成的工作失误，签约租约合同没有统一签订，最后造成个别租户租金涨到无法想象的地步，远远脱离了公平。导致公司退也退不成，因为很多已经签了合同，继续干也不是，干也总是影响情绪。其实这几户总体占比并不很大，但无论钱多钱少，失去公平正义的精神是底线，这么多年始终是我的心结。”于东来表示，“所以到了到期的时候，虽然生活广场一年二十亿的销售，一年一个多亿的利润，但信仰和开心永远是第一位的。任何工作，专业是美好最根本的保障。幸福快乐是一切的前提。”此前，于东来在直播中宣布：胖东来许昌生活广场店将于2026年12月正式关闭。（界面新闻）</p>\n  <p><strong>苹果回应删除接入千问手册：没收到通知，中国大陆还没推出“Apple智能使用千问”功能</strong></p>\n  <p>针对删除《在Mac上配合Apple智能使用千问》使用文档一事，苹果客服最新回应新浪科技称：“我们有功能或新项目发布时，都会提前收到通知，目前并没有收到相关通知，中国大陆还没推出‘Apple智能使用千问’相关功能。”昨日，一篇名为《在Mac上配合Apple智能使用千问》的支持文档现身苹果官网Mac简体中文使用手册，明确提到Apple智能可配合阿里巴巴千问模型工作。但该文发布不到24小时后被苹果方面删除。今年7月15日，阿里巴巴方面曾回应称，千问将作为AI能力集成至Apple智能，覆盖iOS、iPadOS、macOS及visionOS的中国用户。（新浪科技）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>首个全国产10万卡AI超集群投用，全国算力“一张网”加速成形</strong></p>\n  <p>据国家发展改革委，今年以来，中国算力底座进一步夯实，首个全国产10万卡人工智能超集群日前正式投用。标志着中国算力基础设施建设迈入10万卡级部署新阶段。全国多个算力节点迎来新���轮算力扩容。（央视新闻）</p>\n  <p><strong>OpenAI等美企被曝旗下AI模型“越界”，安全风险引担忧</strong></p>\n  <p>美国开放人工智能研究中心（OpenAI）7日发布声明称，最新的内部评估结果显示，该公司即将推出的人工智能模型“阿斯特拉”在“网络安全活动”方面，可能达到有严重风险的级别。该公司决定采取包括暂停涉及该模型的部分活动等安全保障措施。近期，美国多家企业陆续承认旗下人工智能模型在测试中“越界”，引发全球业界广泛关注。分析认为，此事除了技术失误等因素外，也存在商业炒作嫌疑。同时，AI风险日益凸显，全球需要加强安全监管。（央视新闻）</p>\n  <p><strong>奥特曼称OpenAI正推进Astra开放，但因网络安全风险需延后部署</strong></p>\n  <p>当地时间8月7日，OpenAI首席执行官山姆·奥特曼表示，公司正在推进下一代模型Astra向公众开放，但由于该模型具备较强网络安全能力，需要“多一点时间”确保安全部署。他表示，OpenAI并不认为将强大模型限制给少数用户是正确策略，希望Astra最终能够广泛开放。奥特曼称，Astra是一款“强大的模型”，公司希望在确保安全的前提下尽快向更多用户提供。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>原字节跳动机器人一号位加入小米，负责基座模型研发</strong></p>\n  <p>从多方独立信源处确认，原字节跳动机器人团队负责人孔涛已加盟小米，目前担任小米机器人基座模型团队负责人。多位知情人士透露，孔涛于2025年夏天就已加入小米，并带来不少原先在字节跳动工作的员工。目前，小米机器人事业部大约有200人。“小米机器人的基座模型团队很神秘。孔涛带领的基座模型团队有单独的办公地。小米高管集体在飞书上开会时，孔涛甚至不用露脸。”一位接近小米机器人的知情人士透露。小米机器人事业部对内也属于高度保密状态。（21财经）</p>\n  <p><strong>朋友圈可AI帮写、点评？腾讯客服：AI相关功能逐步开放中</strong></p>\n  <p>8月8日，有消息称微信在灰度测试朋友圈“AI帮写”与“AI点评”两项能力，对此记者咨询腾讯客服后获悉，目前朋友圈的AI相关功能仍在逐步开放中，部分智能互动功能可能已在灰度测试阶段，具体支持情况请以所使用的微信版本更新情况为准。（新浪财经）</p>\n  <p><strong>摩尔线程上半年营收大幅增长147.42%，S5000智算集群实现规模化销售</strong></p>\n  <p>国产GPU龙头摩尔线程发布《2026年半年度报告》。根据报告，2026年上半年，摩尔线程实现营收17.36亿元，同比大幅增长147.42%，已超2025年全年营收；毛利总额达9.89亿元，同比增长103.78%；盈利能力显著改善，归母净利润、归母扣非净利润分别较上年同期亏损收窄95.73%、52.37%。同时，摩尔线程保持高强度研发投入，2026年上半年研发投入7.69亿元，同比增长38.16%。2022年以来累计研发投入近59亿元。报告期内，摩尔线程商业化全面提速。MTT S5000智算集群实现规模化销售，已在北京、无锡、杭州等多地完成落地部署，并首批通过国家《安全可靠测评》，高端训练能力取得多项\"国芯训国模\"突破。公司加速渗透互联网、运营商等关键客户，以更丰富的应用场景持续推动收入高增。MUSA软件栈生态日益完善，开发者数量超过80万人。（财联社）</p>\n  <p><strong>伊朗外长强调霍尔木兹海峡未重新开放</strong></p>\n  <p>当地时间9日，伊朗外长阿拉格齐表示，伊朗正与阿曼就调整霍尔木兹海峡航道进行磋商，目前已进入最后阶段。他同时强调，即使双方就航道调整达成协议，也不意味着霍尔木兹海峡重新开放，海峡重新开放仍需满足一系列条件。阿拉格齐称，目前，双方讨论以新航道取代原有航道，相关专家正在开展技术工作。(央视新闻)</p>\n  <p><strong>A股半年报盘点：171家上市公司已披露，16家公司净利润超10亿元</strong></p>\n  <p>8月8日，A股共39家上市公司披露2026年半年报，其中33家盈利，6家亏损。截至8月8日，A股已累计有171家上市公司披露2026年半年报，其中156家盈利，15家亏损。从净利润增幅来看，75家公司净利润增幅超50%，益生股份、温州宏丰、一博科技排名居前，上半年净利润增幅分别为4897.29%、2521.90%、1561.55%。从净利润来看，16家公司净利润超10亿元，宁德时代、药明康德、海康威视排名居前，上半年净利润分别为432.84亿元、110.80亿元、78.96亿元。（第一财经）</p>\n  <p><strong>现货黄金周涨超7%站上4300美元，为何突然大涨？</strong></p>\n  <p>截至8月7日收盘，现货黄金本周上涨264.13美元，涨幅7.44%，报4341.91美元/盎司；纽约商品交易所8月交割的COMEX黄金期货本周上涨291.60美元，涨幅7.17%，报4401.3美元/盎司，双双创下1月23日当周以来最大单周涨幅。消息面上，当地时间8月7日，美国劳工统计局公布的美国7月非农就业人数大幅低于预期。市场对美联储9月维持利率不变的预期升温，美元指数应声下跌，推动金价和银价显著上涨。瑞银的观点指出，金价大幅反弹主要源于市场对霍尔木兹海峡重开预期日益增强的提振。</p>\n  <p>据央视新闻报道，当地时间8月6日，美国总统特朗普表示，关于重新开放霍尔木兹海峡的协议“尚不能说已经正式达成”，但海峡目前“某种程度上已经开放”，美方正参与相关谈判，整体进展良好。与此同时，瑞银认为，中国买盘兴趣、ETF资金净流入、利率环境趋于宽松、以及市场重新关注储备多元化等因素也有所助力。另一方面，美国和日本政府在上周为稳定日元而采取的联合措施，或已避免美国国债遭遇抛售，也为金价提供了支撑。（澎湃新闻）</p>\n  <p><strong>影片《八仙！》票房突破14亿元</strong></p>\n  <p>据灯塔专业版实时数据，截至8月9日12时4分，影片《八仙！》票房突破14亿元。（每日经济新闻）</p>\n  <p><strong>永和豆浆创始人林炳生逝世，享年70岁</strong></p>\n  <p>永和资本集团董事局8月8日发布讣告：集团董事局主席、永和豆浆创始人林炳生先生，因病医治无效，不幸于8月7日中午12:45分在台北安详逝世，享年七十岁。（界面新闻）</p>\n  <p><strong>欧菲光澄清：与新菲光在业务模式与产品线上完全独立</strong></p>\n  <p>36氪获悉，欧菲光8月9日发布关于媒体报道的澄清公告，8月6日前后，个别媒体发布了报道质疑公司实际控制人蔡荣军向其实际控制的新菲光通信技术有限公司、新思考电机股份有限公司进行利益输送。公司与新菲光在业务模式与产品线上完全独立。公司未为新菲光生产或代工该报道所述光模块光学组件、玻璃桥、精密结构件等产品，不存在人为压低公司零部件售价、向新菲光转移利润的行为。新思考由公司董事长蔡荣军及其控制的企业深圳和正收购而来，不存在“早年从欧菲光拆分VCM马达核心业务，欧菲光承担全部研发成本，成熟后高毛利业务归新思考。”的情况。</p>\n  <p><strong>Alo独家入驻天猫</strong></p>\n  <p>8月9日，界面新闻记者独家获悉，高端运动生活方式品牌ALO将独家入驻天猫，于8月12日开出中国内地首家官方旗舰店。这将是ALO进入中国市场后正式开业售卖的第一家官方店铺，也是其在中国内地唯一的官方电商渠道。（界面新闻）</p>\n  <p><strong>张雪机车：成立小车手培育专项基金，每年捐赠100万元</strong></p>\n  <p>8月8日，“张雪机车”宣布成立小车手培育专项基金，每年捐赠100万元，定向资助11至16岁的中国青少年摩托车手，每人每年可获10万至30万元，首批计划资助5至10人。</p>\n  <p><strong>理想汽车-W于8月6日斥资361.82万美元回购57.27万股</strong></p>\n  <p>理想汽车-W发布公告，于2026年8月6日，该公司斥资361.82万美元回购57.27万股。（新浪财经）</p>\n  <p><strong>消息称SpaceX收购Cursor交易最快下周完成，新产品或启用Grok品牌</strong></p>\n  <p>8月7日，据报道，SpaceX收购AI编程工具公司Cursor的交易最快可能于下周末完成。Cursor品牌名称可能在未来几个月内逐步退出，新产品或采用其他品牌名称。据悉，Cursor即将推出的通用型智能代理产品可能被命名为Grok Bot。不过，Cursor现有工具不会立即更名。该交易仍需获得监管批准，预计最晚将在本月底前完成。SpaceX此前于6月宣布将以600亿美元收购Cursor。（界面新闻）</p>\n  <p><strong>马斯克发布Terafab渲染视频</strong></p>\n  <p>马斯克在X平台发布特斯拉Terafab新视频，视频中Optimus人形机器人和Robovan无人车首次同框亮相。Robovan可载客20人或运货，Optimus量产线已在改造中，目标2027年夏季大规模量产。（新浪财经）</p>\n  <p><strong>马斯克：即将发射的V3卫星性能将比V2卫星高出一个数量级，该系统今年将实现年收200亿美元</strong></p>\n  <p>马斯克当地时间8月8日在社交媒体平台X上发文称，即将通过星舰发射的V3卫星性能将比目前通过猎鹰火箭发射的V2卫星高出一个数量级，这意味着星链V3带宽是星链V2系统的100倍以上，该系统今年将达到200亿美元的年度经常性收入（ARR），“即使每千兆字节的收入下降10倍，这也意味着SpaceX的通信收入仍将超过每年2000亿美元”。（界面新闻）</p>\n  <p><strong>SK掌门崔泰源离婚财产分割案能否终结即将见分晓</strong></p>\n  <p>据韩国法律界9日消息，崔泰源和卢素英对财产分割案重审判决的上诉期限为判决书送达之日起14日内。双方于本月1日零时收到判决书，可在14日之前提起上诉。若崔泰源和卢素英在法定期限均不提起上诉，或者提交放弃上诉声明书，该财产分割案重审判决将生效，即崔泰源须向卢素英支付9440亿韩元（约合人民币45.08亿元）。若任何一方再提起上诉，该案将交由最高法院大法院重新审理。（财联社）</p>\n  <p><strong>中国首个预防急性高原病药物获批上市</strong></p>\n  <p>近日，经国家药品监督管理局严格审评审批，由西藏自治区人民医院副院长、西藏高原医学研究所所长格桑罗布教授担任主要研究者的乙酰唑胺缓释胶囊正式获批上市，成为国内首个获批具有预防急性高原病适应症的药品。相关研究成果已发表于国际高原医学旗舰期刊《High Altitude Medicine &amp; Biology》。 (西藏日报)</p>\n  <p><strong>英特尔任命Dean Jarnac为首席销售官</strong></p>\n  <p>当地时间8月7日，英特尔宣布任命Dean Jarnac为执行副总裁兼首席销售官，负责领导公司的全球销售组织，推动客户关系建设及产品市场拓展，覆盖客户端、数据中心、人工智能、网络及ASIC等业务领域。作为此次管理层调整的一部分，英特尔现任首席营收官Greg Ernst将在任职27年后离开公司。（新浪财经）</p>\n  <p><strong>爷爷不泡茶：网传门店冲突事件发生于2025年，双方已达成和解</strong></p>\n  <p>36氪获悉，8月8日，爷爷不泡茶发布关于网传门店冲突视频的情况说明：近日，一则涉及我司门店员工与外卖配送人员发生冲突的视频在网络平台传播，引发公众关注。对于事件造成的不良观感与社会影响，以及给涉事配送伙伴、广大消费者带来的困扰，我们深表歉意。经核实，网传视频对应事件发生于2025年10月9日。冲突系门店员工与外卖配送人员因取奶茶、催促等事宜起纠纷，由语言冲突上升到肢体冲突。冲突发生后，门店伙伴第一时间报警，公安机关依法开展调查并组织调解。最终，双方达成和解，相关事项已妥善处理完毕。</p>\n  <p><strong>Alphabet启动250亿美元债券发行，期限最长达40年</strong></p>\n  <p>当地时间8月7日，谷歌母公司Alphabet宣布拟发行总额250亿美元的高级无抵押债券，包括浮动利率债券和固定利率债券，期限覆盖2028年至2066年。其中，固定利率债券期限最长为2066年到期，票面利率最高为6.5%。（界面新闻）</p>\n  <p><strong>爆买1300亿元，伯克希尔罕见出手</strong></p>\n  <p>伯克希尔大举出手。伯克希尔·哈撒韦公司公布的财报显示，今年第二季度归属于股东的净利润同比大幅增长超107%，投资收益同比大幅增长155%。值得注意的是，伯克希尔罕见大举出手，第二季度净买入股票金额接近200亿美元（约合人民币1300亿元），扭转了此前持续抛售股票的趋势。在此之前，伯克希尔已连续14个季度净卖出股票。结合持仓变化来看，截至6月30日，伯克希尔的前五大股票持仓中，谷歌正式进入榜单，与美国运通、苹果、美国银行、可口可乐并列，五大重仓股合计占股票投资组合的66%。（证券时报）</p>\n  <h2>上市进行时</h2>\n  <p><strong>摩尔线程：筹划发行H股股票并在港交所主板上市</strong></p>\n  <p>摩尔线程8月9日公告，公司拟发行境外上市外资股（H股）股票并申请在香港联合交易所有限公司主板挂牌上市。（证券时报）</p>\n  <p><strong>远信储能递表港交所</strong></p>\n  <p>36氪获悉，据港交所文件，8月9日，深圳市远信储能技术股份有限公司向港交所提交上市申请书，独家保荐人为招银国际。</p>\n  <p><strong>北京君正通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，据港交所文件，8月9日，北京君正集成电路股份有限公司更新聆讯后资料集，意味着该公司港交所IPO通过聆讯。</p>\n  <h2>大公司财报</h2>\n  <p><strong>拓维信息：上半年净利润同比下降12.16%，拟10派0.25元</strong></p>\n  <p>拓维信息披露半年报，2026年上半年，公司实现营业收入13.12亿元，同比增长0.39%；归属于上市公司股东的净利润6922.2万元，同比下降12.16%；基本每股收益0.0549元。公司拟每10股派发现金红利0.25元(含税)。（第一财经）</p>\n  <h2>投融资</h2>\n  <p><strong>星环聚能完成新一轮8.8亿元融资</strong></p>\n  <p>据星环聚能消息，近日完成新一轮(A++轮)融资，融资金额为8.8亿元人民币。本轮融资由深投控资本、深担创投、农银资本、交银投资等机构联合投资，老股东上海科创集团旗下知识产权基金等机构继续跟投。本轮融资资金将与A轮、A+轮融资资金一道，共同用于上海嘉定实验基地建设、NTST(负三角球形托卡马克)建造与运行、CTRFR-1(星环一号)设计建造，以及聚变堆级高温超导磁体与AI等离子体控制等关键技术的持续工程化推进。（第一财经）</p>\n  <p><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-08-09T23:47:47+00:00", "fetched_at": "2026-08-10T01:20:38.053423+00:00", "fingerprint": "71bf92a9b409a4d4"}, {"source": "36氪 - 最新文章", "title": "工商业储能企业完成数千万元融资，2026上半年海外终端占比超八成｜硬氪首发", "url": "https://36kr.com/p/3929538649324672?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，「亿兰科」近日完成数千万元A轮融资，本轮由时代伯乐追加投资。资金将重点投向中山制造中心建设、海外本地化服务网络拓展，以及AIDC电源、SST模块等新产品的落地与迭代，全面提升交付能力、技术响应与售后保障。</p>\n  <p>亿兰科成立于2021年12月，是一家工商储电力电子核心设备厂商，长期聚焦工商业储能PCS赛道，以模块化技术路线为核心，提供覆盖工商业储能、微电网等场景的电力电子设备与系统解决方案。公司总部位于深圳，在杭州设有分公司，核心团队来自清华大学等顶尖院校与艾默生、科士达等头部电力电子企业，在研发、生产、供应链管理及全球化交付方面具备全链条经验。</p>\n  <p>工商业储能正处在一个矛盾的时刻。2025年，中国工商业储能系统出货量达24GWh，同比增长100%。2026年全球工商业储能装机预计同比增长约40%，其中海外市场增速超60%。增速依然亮眼，但支撑行业狂奔的底层逻辑正在被彻底重写。</p>\n  <p>最大的变量来自国内的电力市场改革。2026年，固定分时电价全面走向市场化，过去作为工商业储能经济性基石的峰谷价差套利模式根基松动，电价将完全由市场供需决定。这意味着，储能企业的盈利能力不再取决于政策红利，而是取决于能否在多元化的真实工况中创造价值。</p>\n  <p>同时，海外工商业储能的应用场景正在急剧扩散，从削峰填谷延伸至光伏消纳、变压器扩容、微电网、光储充一体化等多个方向。场景越分越细，需求越扎越深，一套标准化整机实现多场景适配的时代已经结束。</p>\n  <p>这正是亿兰科提出模块化路线的底层逻辑。</p>\n  <p>早在2023年，亿兰科就将整套储能系统解耦为DC/DC、DC/AC、STS三大标准化功率模块。客户可以根据具体项目工况自由搭配组合，项目需要离网备电就搭配STS模块，需要多路MPPT光伏接入可选择DC/DC模块，有的只需要基础削峰填谷、选用单模块产品即可满足。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260809/v2_408e045b416b4507983e4df4bad1aebb@6022551_oswg189704oswg1280oswg954_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">亿兰科工商业储能产品（图源/企业）</p>\n  <p>模块化的价值不止于硬件层面的灵活组合。亿兰科要解决的不只是客户侧“灵活搭配”的问题，更是在为自身搭建一套可进化的技术骨架。</p>\n  <p>随着电芯技术快速迭代，系统架构需要同步调整。其中，模块化架构允许PCS模块独立升级，无需推倒重来。在多机并联场景下，亿兰科积累的模块间协同控制的软件能力，通过控制算法与硬件架构来自大量真实项目工况的反复打磨，具备软硬件一体化的综合能力。</p>\n  <p>从出货量排名看，这套思路正在被市场验证。相关数据显示，2023年，亿兰科在工商业储能PCS赛道位居行业第七；2024年跃升至第四；2025年进一步攀升至行业前三。其产品已出货至全球60多个国家及地区。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260809/v2_1debdd0db5ec462d9b05590443b301ca@6022551_oswg1171281oswg1536oswg1024_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">亿兰科工商业储能产品（图源/企业）</p>\n  <p>进军海外市场是亿兰科另一个关键的战略选择。2024年以来，公司系统布局海外市场，其2025年海外终端业务占比已达75%，2026年上半年进一步提升至85%。</p>\n  <p>海外工商业储能的应用环境远比国内复杂。欧洲市场大量存量光伏系统采用800V架构，但市面上多数组串式储能PCS仅标配690V交流输出，一旦搭配800V光伏做交流耦合，必须额外加装升压变压器。相比于之下，亿兰科的215kW PCS模块，原生匹配800V光伏母线，可以实现无升压直连交流耦合，此前已在印度3MW光伏配套储能项目中落地验证。</p>\n  <p>今年三月，面向工商业及微电网场景，亿兰科推出了混合逆变器系列。该产品将光伏MPPT、双向逆变、并离网切换及能量管理系统EMS四大功能高度集成于一体，实现“四合一”设计。</p>\n  <p>面对欧洲高电价与东南亚、非洲电力薄弱地区的全天候保电需求，传统方案多依赖多设备堆叠和复杂的定制化工程，落地慢、成本高。相比之下，混合逆变器系列能支持多机并机、毫秒级并离网切换，适配多种电池类型，满足自发自用、余电上网和备电保障等多重需求，让工商业储能真正实现“开箱即用”。</p>\n  <p>针对海外沿海区域盐雾、凝露多发的严苛环境，亿兰科在出口欧洲机型中实现了IP66高防护等级。针对东南亚电网设施薄弱、供电不稳定的现状，公司自研STS并离网切换模块，可在电网断电时毫秒级切换至离网模式，替代传统柴油发电机。</p>\n  <p>截至目前，公司已完成全球认证120余项，覆盖欧洲、非洲、亚洲主要市场。</p>\n  <p>2025年10月，亿兰科深圳生产基地完成第二次产能升级，专项打造了先进的PCS模块生产车间。当前深圳基地已满负荷运营。2026年7月，中山制造中心正式启动，工厂面积达3万平方米，规划PCS模块产能5万台/年、整机交流柜2000台/年，为持续增长的海外订单提供产能保障。</p>\n  <p>服务端，公司已在欧洲、非洲、东南亚、中东共计6个国家布局备件仓库，未来将落地3大海外本地化服务中心。</p>\n  <p><strong>以下为硬氪与亿兰科的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：工商储行业存在客户场景分散的痛点，亿兰科提出模块化PCS方案是如何解决多场景适配痛点，相比行业一体式整机路线，这套技术路线长期能构筑哪些难以复制的产品壁垒？</strong></p>\n  <p><strong>亿兰科：</strong>与户用储能的相对标准化、大型储能的定制化工程不同，工商业储能处于一个尴尬的中间地带。它的项目工况纷繁复杂，可能是工厂园区、商业楼宇、光储充场站，也可能是海外的偏远矿区或岛屿微电网——每个场景的负载特性、用电曲线、并网要求都不一样。如果沿用标准化整机的思路，很难覆盖这些碎片化的需求；但如果每做一个项目就从头定制，成本高、周期长，根本无法规模化。</p>\n  <p>我们的解法是回到电力电子设备的底层逻辑，把储能系统解耦为三个标准化的功率模块。客户根据项目需求自由组合，有的配单模块做纯削峰填谷，有的加STS模块做并离网切换，有的加DC/DC模块做多路光伏接入。这种“乐高式”的搭建方式，把非标工程变成了标准工业品的组合，大大降低了产品开发的复杂度。</p>\n  <p>但模块化的真正壁垒不在硬件，而在软件。多模块协同涉及功率分配、动态响应、故障保护等一系列复杂控制逻辑，尤其在大规模多机并联的场景下，模块间的通信同步、功率均分、集群管控都会成为系统性难题。这种软硬件的协同能力并非一蹴而就，而需要在实际运行中持续迭代。</p>\n  <p><strong>硬氪：当前工商储电芯、PCS技术持续迭代，行业要求不断提升，怎么看待未来三年工商储PCS的核心竞争主线？亿兰科在底层电力电子算法、系统控制上有哪些中长期研发布局？</strong></p>\n  <p><strong>亿兰科：</strong>未来三年，单纯拼硬件参数已经没有太多空间了，真正的差距会体现在三件事上，系统能不能适配各种各样的场景，能不能在复杂工况下稳定运行，以及能不能快速响应新出现的市场需求。</p>\n  <p>电池技术还在快速迭代，再加上大规模多机并联、离网备电这些需求越来越多，谁能把多电池兼容、并离网无缝切换、集群协同管控这些底层问题解决好，谁就能跑出来。这些都不是靠堆元器件能解决的，需要在硬件架构、控制算法和实际运行经验之间反复磨合。</p>\n  <p>我们的方向有几个。硬件层面继续深耕模块化架构，但重点放在控制算法上，包括三相独立控制，以及更上层的全域协调调度。目前也在布局AI辅助控制，基于现场运行数据做阻抗自适应识别、故障预判、动态功率调节，让设备在复杂的实际工况中能自动适应、自我优化。</p>\n  <p>同时亿兰科也会往新赛道延伸，AIDC算力储能电源和SST模块都是储备方向。底层电力电子的通用性决定了我们能做的远不止储能PCS，AI算力备电等这些应用场景都在同步推进。关键是技术要足够扎实，产品才能铺得开。</p>", "category": "tech", "published_at": "2026-08-10T00:00:00+00:00", "fetched_at": "2026-08-10T01:20:38.053409+00:00", "fingerprint": "b38a9140cdf91d17"}, {"source": "少数派", "title": "我做了一个 Quote/0 看板，把 F1 赛程、积分和结果留在桌面", "url": "https://sspai.com/post/113158", "summary": "特别声明本文的项目构思、结构设计及相关素材整理均由人工完成。在产品开发与调试过程中，使用GPT-5.6Sol模型作为辅助工具，参与方案讨论、代码编写与问题排查。文章内容基于实际开发过程中的经验与记录， ...<a href=\"https://sspai.com/post/113158\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-09T07:00:00+00:00", "fetched_at": "2026-08-10T01:20:36.075862+00:00", "fingerprint": "8d148d4d06fe59ca"}, {"source": "少数派", "title": "派早报：央视曝光酒店评级标识消费陷阱", "url": "https://sspai.com/post/113 ]", "category": "tech", "published_at": "2026-08-08T17:53:34+00:00", "fetched_at": "2026-08-09T01:18:57.425813+00:00", "fingerprint": "57bcc91c15e3ba01"}, {"source": "The Verge", "title": "X replaces its revenue-sharing program with ‘Original Content Rewards’", "url": "https://www.theverge.com/tech/977143/x-revenue-sharing-original-content-rewards", "summary": "X is ending its controversial revenue-sharing program for content creators, which has seen numerous revisions under Elon Musk's reign. In its place, it's launching a new Original Content Rewards program on September 8th. To be eligible, creators must have at least 500 verified followers and at least 500,000 Home Timeline impressions from verified users in [&#8230;]", "category": "tech", "published_at": "2026-08-08T21:15:12+00:00", "fetched_at": "2026-08-09T01:18:57.425802+00:00", "fingerprint": "22657c0c6800b3bf"}, {"source": "36氪 - 最新文章", "title": "吃完就后悔的年轻人，把凌晨2点的AI当成了减肥树洞｜2026年轻人减重报告", "url": "https://36kr.com/p/3930427173682304?f=rss", "summary": "<p>每个认真减重的年轻人，可能都有两副面孔。</p>\n  <p>白天，是热量计算器本人：鸡胸肉多少大卡，米饭一拳有多重，奶茶三分糖算不算努力过。</p>\n  <p>深夜，是AI告解室常客：刚吃完火锅还能不能补救，明天少吃一点有没有用，一顿夜宵会不会让这周白练。</p>\n  <p>减重看起来是在和体重较劲，实际上是在和真实生活磨合。聚餐、加班、嘴馋、熬夜，都会让“少吃多动”变得没那么简单。</p>\n  <p><strong>京东健康“减重不难瘦”大赛首周吸引700多万用户报名。</strong>从他们的打卡和AI咨询里可以看到，年轻人最关心的早已不是一句口号，而是更具体的问题：怎么吃、怎么动、怎么睡、怎么面对体重波动，以及掉线后怎么重新开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_b4d198e06eef49648481982819fa5a85@5679941_oswg68698oswg801oswg904_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_0630fb4033b74c57985caf489625ccbe@5679941_oswg11892oswg1000oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>年轻人减重后的第一项隐藏技能，往往不是跑步，而是算账。</p>\n  <p>鸡胸肉多少大卡，米饭一拳有多重，奶茶三分糖能不能算“减脂折中方案”，火锅蘸料到底要不要单独建账。以前花钱没这么精打细算，减重后倒是把每一口都过成了财务审计。</p>\n  <p>京东健康数据显示，<strong>参赛用户关于热量计算类问题的日均咨询量约100万条，在所有饮食健康类AI问题中占比达到37%。</strong>换句话说，每3个关于吃饭的问题里，就有1个是在认真追问：“这份饭到底多少大卡？”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_e31a495ca07946dd89549e7e0b419d36@5679941_oswg44875oswg801oswg552_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>被反复咨询的食物也很有代表性：全糖奶茶、炸鸡、白米饭位列前三。</strong>它们对应的不是简单的“能不能吃”，而是更现实的困惑：奶茶能不能喝？主食能不能留？炸鸡吃了是不是就前功尽弃？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_a639048ea6d64485a6226c8987ea2f31@5679941_oswg81414oswg801oswg1034_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但真正可持续的减重，并不是把所有快乐都从餐桌上删除。</p>\n  <p>《中国居民膳食指南（2022）》建议，日常饮食应坚持食物多样、合理搭配，平均每天摄入12种以上食物、每周25种以上；成年人每天谷类食物建议摄入200—300g，其中可包含全谷物和杂豆类50—150g。指南同时建议，成年人每天食盐不超过5g，烹调油25—30g，添加糖最好控制在25g以下。</p>\n  <p>这意味着，减重期间不必把主食“一刀切”掉。相比彻底不吃碳水，更现实的方法是：把一部分精制主食换成全谷物、杂豆、薯类；把全糖饮料换成少糖或无糖；把油炸食物从“日常选项”变成“偶尔奖励”。</p>\n  <p>京东健康数据也发现，<strong>在18—35岁年轻人的AI饮食咨询中，控碳相关问题每月约187万次，占全部饮食咨询的27%。</strong>其中，近六成来自已经控碳一周以上的用户。很多人并不是减重前随口问问，而是真的坚持了一阵，才发现对碳水的想念越来越具体。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_8e869e51322b4fea84ccb85d38b070dc@5679941_oswg55828oswg801oswg634_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>南方用户最惦记的，是白米饭、螺蛳粉、米线米粉；北方用户更难放下的，是馒头、手擀面和饺子。</strong>减重可以改变食谱，但一个人从小养成的“主食胃”，没必要被完全否定。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_61f1385a45524764a8a0187efe330eb1@5679941_oswg57668oswg801oswg613_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>更适合普通人的方式，是给碳水留一个合理位置：每餐留出一拳左右主食，优先粗细搭配；如果当天想喝奶茶，就少点糖、少加料、选小杯；如果想吃炸鸡，下一餐就清淡一些，而不是用极端节食来惩罚自己。</p>\n  <p>减重不是每一口都不能快乐，而是让快乐更有边界。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_5bea6933c6ad499a89d51d3d14fde9a1@5679941_oswg9353oswg1000oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>很多年轻人开始减重后，身体就变成了一套实时行情系统。</p>\n  <p>早上空腹称一次，上完厕所称一次，吃完饭再偷偷称一次。体重下降0.1斤，今天就是红盘；上涨0.3斤，立刻进入“是不是完了”的复盘模式。</p>\n  <p>除了体重，体脂率、步数、血糖曲线也逐渐被加入观察列表。以前看天气预报决定穿什么，现在看身体数据决定今天吃什么。</p>\n  <p>京东健康数据显示，<strong>截至8月4日，超270万用户减重超3斤；首批完成挑战的用户平均减重5.2斤。</strong>大赛还向符合条件的新用户提供CGM动态血糖监测，不少人开始观察不同食物进入身体后的血糖反应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_6cb21a5d342846ed894092fdd958f636@5679941_oswg57006oswg801oswg770_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>在用户最关心的升糖较快碳水中，“白米饭”“玉米”和“西瓜”位列前三。</strong>这些问题背后，其实是年轻人正在从“凭感觉减重”，转向更精细地理解身体。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_0b9ce9339bbd450880ac17346d23abaf@5679941_oswg58418oswg801oswg648_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>不过，数据的作用不是制造焦虑，而是帮助人看懂趋势。</p>\n  <p>我国成人BMI判断标准中，18.5≤BMI&lt;24.0为正常体重，24.0≤BMI&lt;28.0为超重，BMI≥28.0为肥胖。但BMI并不能呈现全部身体状态，腰围、体脂率、肌肉量、血糖血脂等指标也需要结合来看。</p>\n  <p>所以，体重秤不是判官，更像导航。它能提示方向，但不能因为一次波动就宣布失败。</p>\n  <p><strong>更建议固定条件称重：比如每周2—3次，在早晨起床后、进食前、排空后称；看一周趋势，而不是一天内反复横跳。</strong>体重一天内的变化，可能来自饮水、盐分、排便、经期或运动后的肌肉储水，未必代表真的长胖。</p>\n  <p>动态血糖、体脂秤、步数记录也是一样。它们的意义不是让人每天被数字牵着走，而是帮助人更早发现：哪些食物更适合自己，哪种节奏更容易坚持。</p>\n  <p>真正会看数据的人，不是每天把自己盯到焦虑，而是学会用数据帮自己少走弯路。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_05c2d8efd3484fe9baff9e1096adb6ea@5679941_oswg9305oswg1000oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>很多人刚开始减重时，都以为运动必须足够狠。</p>\n  <p>第一天跑到怀疑人生，第二天全身酸痛，第三天开始给自己找理由：今天太忙、天气太热、膝盖不太舒服、明天一定补上。</p>\n  <p>但京东健康大赛里的不少年轻人，反而摸索出了一条更温和的入门方式：像养小狗一样养自己。</p>\n  <p>按时吃饭，出门遛弯，少吃高糖高盐，晚上早点睡。听起来不像热血减脂计划，更像生活基本操作。但对很多长期久坐、饮食不规律、作息混乱的人来说，先把这些事做到，已经是在认真照顾身体。</p>\n  <p>京东健康数据显示，<strong>参与者中有48%的人能够坚持规律打卡一日三餐；“每日跑步1公里”的任务完成率达到78%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_d77054667a0044569aa80619eefd2220@5679941_oswg48922oswg801oswg546_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从步数来看，<strong>52%的参赛用户日均步数集中在6000—10000步，28%的人每天不到6000步，17%的人能稳定走到1万—3万步</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_3a9e61f657c849ec95f8796d194255d5@5679941_oswg52600oswg801oswg722_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>也就是说，大多数人的减重，并不是从高强度训练开始，而是从“今天多动一点”开始。</p>\n  <p>《中国居民膳食指南（2022）》建议，各年龄段人群都应天天进行身体活动；<strong>成年人每周至少进行5天中等强度身体活动，累计150分钟以上，主动身体活动最好每天6000步，同时鼓励每周2—3天进行抗阻运动，并减少久坐时间、每小时起来动一动。</strong></p>\n  <p>这对普通人来说，是一个更现实的起点。</p>\n  <p>如果平时几乎不运动，可以先从饭后散步10—15分钟开始；如果已经能稳定走到6000步，可以每周增加2—3次快走、骑车、游泳或慢跑；如果想让体型更紧致，就不要只做有氧，可以加入深蹲、俯卧撑、弹力带训练等抗阻练习。</p>\n  <p>运动不需要一开始就“燃爆全场”。对久坐上班族来说，少坐一小时，饭后多走几步，每周规律活动，比偶尔一次高强度透支更有意义。</p>\n  <p>毕竟，减重运动最重要的不是第一天有多狠，而是第30天还愿不愿意继续。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_5a8dc82c968b41daafeeb8a020f621ea@5679941_oswg9082oswg1000oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>白天的年轻人，是减重计划执行者；深夜的年轻人，是AI告解室常客。</p>\n  <p>白天问：“鸡胸肉怎么做不柴？”</p>\n  <p>晚上问：“螺蛳粉只喝汤算不算吃？”</p>\n  <p>白天说：“今天一定清淡。”</p>\n  <p>半夜问：“一顿火锅会不会前功尽弃？”</p>\n  <p>京东健康数据显示，22点至次日2点，高热量食物相关咨询占到全天的42%，成为咨询最集中的时段。<strong>夜越深，年轻人越诚实：白天藏得住食欲，半夜藏不住聊天记录。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_c08529e5baa444dcac357384f5ac7473@5679941_oswg76584oswg801oswg742_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>深夜向AI发起咨询的人，大多有两类：<strong>一类是在睡前纠结“吃什么不胖”，另一类则是已经吃完，急着问“怎么补救”。</strong>这说明，很多减重计划不是输在白天，而是输在夜间场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_9a02c36c6efa4a239993243d3828404f@5679941_oswg70457oswg801oswg761_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>熬夜、刷吃播、情绪压力、外卖软件、触手可及的零食，都会让人更容易在深夜做出高热量选择。我国《肥胖症诊疗指南（2024年版）》也提到，不良睡眠习惯是肥胖症的重要危险因素之一，睡眠不足可能影响食欲相关激素分泌，使进食增多、能量消耗减少。</p>\n  <p>所以，<strong>减重期间的休息不是“小事”。睡不好，白天的自律可能会在深夜被食欲反扑。</strong></p>\n  <p>与其吃完后反复忏悔，不如提前设置几个“夜间防线”：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_819d6f3f83ac4cc689b95aac8d9948c0@5679941_oswg51628oswg801oswg567_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>如果一顿夜宵已经发生，第二天恢复规律三餐和正常运动，不要用极端节食补偿。减重最怕的不是一顿夜宵，而是一顿夜宵后直接破罐破摔。</p>\n  <p>偶尔吃多了，不代表计划毁了。真正重要的是，第二天还能不能回到正常节奏里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_239207dce52d4357a82efac6fa3f8947@5679941_oswg8978oswg1000oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>年轻人的减重计划，往往不是一条直线，而是一条带有周末波动的曲线。</p>\n  <p>周一重新做人，周二认真执行，周三略有动摇，周四开始想念火锅，周五奖励自己，周末全面进入生活体验模式。</p>\n  <p>京东健康数据显示，在<strong>一周内出现断签的用户中，连续5个工作日全勤、但周末两天全部断签的人占比接近三成。周六、周日的打卡中断率分别达到27.9%和31.4%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_0b27b03cea394378a11ed378864cbefa@5679941_oswg45284oswg801oswg764_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但有意思的是，年轻人最不缺的就是“重新开始”的能力。</p>\n  <p><strong>在连续中断两天的用户中，78%选择在周一回来。</strong>也就是说，上周的计划可以烂尾，这周的宣言必须准时更新。减重从未失败，只是刚刚完成了一次版本迭代。</p>\n  <p>这不是自欺欺人。对很多人来说，能反复回来，本身就是长期管理的一部分。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_dfd780c3df22403ba2452b257deebe9c@5679941_oswg50489oswg801oswg759_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>京东健康大赛里，组队也成为一种重要的坚持方式。数据显示，<strong>83%的参赛用户加入了至少2人的战队，其中60%直接进入4人及以上战队。</strong>发起组队者平均连续打卡18.6天，高于被邀请者的12.4天和未组队者的8.7天；他们每天平均参与43.2分钟，每周打卡5.8天。</p>\n  <p>一个人减重，容易悄悄摆烂；一群人一起，至少有人会把你@回来。</p>\n  <p>这背后其实是一种更可持续的减重逻辑：不要只靠意志力，而要靠环境、记录、反馈和同伴支持。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_4c3f58f8d4844f56b2217de17435c911@5679941_oswg72043oswg801oswg789_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>可以给自己设计一些“防掉线机制”：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_10e431725d6f472eb56f2e178d71508c@5679941_oswg54994oswg801oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>国家卫健委《体重管理指导原则（2024年版）》也强调，<strong>体重管理需要结合个人健康状况、既往减重经历、生活方式、运动能力等进行综合评估，制定更个性化、科学和安全的方案。</strong></p>\n  <p>这也提醒我们，减重不是一场不能失误的考试，而是一套可以不断校准的长期系统。</p>\n  <p>真正能坚持的人，不是从不掉线，而是每次掉线后，都有办法把自己捞回来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_2d4653c5a09c4d2d8ac159d79419bacd@5679941_oswg251oswg459oswg45_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>回头看京东健康“减重不难瘦”大赛里的700多万用户，会发现年轻人的减重状态并不整齐划一。</p>\n  <p>有人从热量计算开始，学会看懂每一口食物；</p>\n  <p>有人通过体重、血糖、步数，第一次认真观察自己的身体；</p>\n  <p>有人靠每天1公里、饭后散步，把运动变成生活的一部分；</p>\n  <p>有人在深夜向AI求助，又在第二天重新回到计划；</p>\n  <p>也有人拉上朋友组队，把一个人的坚持变成一群人的互相提醒。</p>\n  <p>这些行为看似琐碎，却共同指向同一件事：<strong>减重正在从“短期变瘦”，转向“长期管理”。</strong></p>\n  <p>真正有效的减重，未必是从此变成一个毫无破绽的自律达人，而是逐渐摸清自己的身体和生活节奏：什么时候容易嘴馋，哪种运动能坚持，睡少了会不会更想吃，周末放松后怎样重新回来。</p>\n  <p><strong>京东健康提供的体重记录、AI咨询、动态血糖监测、组队打卡等工具，本质上也是在帮用户把一个长期目标拆成更具体、可执行、可反馈的小步骤。</strong>在减重场景中，AI小康日均为30万人解决相关问题，并通过AI智能分析，累计为用户生成180万份个性化定制的饮食及运动计划。原本需要独自完成的减重计划，就这样被拆成了一顿饭、一次运动、一晚好睡眠，以及无数次“没关系，接着来”</p>\n  <p>所以，<strong>减重不难瘦的秘诀，可能不是每一局都赢，而是别因为一局没打好就退赛。</strong></p>\n  <p>只要还愿意继续调整，身体总会慢慢给出回应。</p>\n  <h4>（数据来源：京东健康“减重不难瘦”大赛）</h4>\n  <h4>策划：大倪、昌怡</h4>\n  <h4>视觉：曲枚</h4>\n  <h4>封面来源：AI生成</h4>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_d58f6eb2fa804fbea0d6915aeb7014ea@5679941_oswg3021oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_b6dee453407543dca5524e814f82f8ee@5679941_oswg13015oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>今天是全民健身日，你有什么运动计划？</strong></p>\n  <p><strong>你有哪些减重小妙招？</strong></p>", "category": "tech", "published_at": "2026-08-08T07:01:18+00:00", "fetched_at": "2026-08-09T01:18:57.271960+00:00", "fingerprint": "cc78143d5d9cc963"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 获李泽湘三轮押注，浙大博士做出全球首款视觉售后技术客服机器人", "url": "https://36kr.com/p/3931000539692164?f=rss", "summary": "<p>硬氪获悉，视觉模型企业微链智能近日完成近千万元天使轮融资，资方为李泽湘、陆奇，投资主体为投资主体为东莞清水湾二期创业投资合伙企业（有限合伙）、宁波智能技术研究院有限公司、北京奇绩创坛二期创业投资中心（有限合伙）。该轮融资将主要用来投入研发。</p>\n  <p>微链智能成立于2023年，创世人宁冬冬今年31岁，博士就读于浙江大学，从事机器视觉研究，也是国内早期做深度学习机器视觉的人，在图像处理方面经验丰富。</p>\n  <p>宁冬冬告诉硬氪，他原本跟随李泽湘从事图像领域的产品研发，在调研中发现消费电子行业的客服非常原始。不过，宁冬冬没有贸然行动，为了全局了解电商客服链条，他调研了电商平台、平台上的商家，以及卖AI客服的工具厂商三方不同主体的情况。</p>\n  <p>宁冬冬第一站是在京东做了3个月的客服实习生，他发现京东的内部系统非常完善，“物流、金融、电商部门全打通，客服可以直接影响自营店铺的详情页或修改物流地址。”</p>\n  <p>随后，他又去到平台上的某电器商家做售前客服，这里情况有所不同，还完全是手工阶段，平台几乎不提供任何工具，联系物流或师傅都要打电话，效率较低。“京东客服一天能解决300个复杂售后，而商家客服一天只能解决不到80个”。</p>\n  <p>但两次实习岗位都有共性：收入不高，3000元左右。人员流动性大，“比如在京东实习时，我那届将近100人，一年后大概只剩5个人”。另外，班次昼夜颠倒，对身体伤害很大，而且工作量非常大，对员工的心理素质要求很高。</p>\n  <p>整个电商行业有500多万人工客服，宁冬冬介绍，到大促时，平台要求30秒内必须回消息，之前的AI技术使得机器人能回一些简单问题，但这只占咨询里的20%不到，并且还需要人工复核。“有些公司为了用机器人，还需要增加一个叫AI客服训练师的岗位去配置问答对，一个月成本要1万多。”</p>\n  <p>宁冬冬分析，整个行业存在几个严重问题，一是<strong>培训周期长</strong>，客服流动性大，招来的新人大部分没有经验，对他们的培训需要1-2周甚至一个月。二是<strong>用人成本高</strong>，从早8点到晚12点至少需要4个人，“销售额在5亿左右的腰部企业需要50个客服，加上社保、管理和场地费用，一个人一个月平均摊销成本将近1万元”。三是<strong>品牌售后风险</strong>大，新人客服容易导致品牌售后问题，“小红书上一个帖子可能就会毁掉一个品牌”。</p>\n  <p>从这些问题出发，微链智能研发出了行业首款专门面向电商场景的“技术客服”对话机器人，重点解决消费电子及复杂硬件产品在售后环节中技术门槛高、故障排查难、人工成本大的问题。</p>\n  <p>具体而言，其产品可以做到几个点，一是突破传统客服机器人仅能处理文本的局限，具备较强的图片与视频理解能力，甚至能够解读复杂的电子产品技术图纸与结构图，快速定位硬件或使用问题。二是可以独立思考与主动诊断追问，具备深度逻辑推理能力，在面对用户的疑难描述时，能够像技术专家一样主动向用户提问、引导排障，实现复杂售后场景下的全自主问答与独立接待，无需频繁转接人工。三是支持跨主流电商平台的多渠道集成与聚合操作，无缝嵌入商家现有的工作流，全自动化处理售后技术咨询。</p>\n  <p>而在商业化落地方面，公司背靠李泽湘系消费电子生态链企业，拥有270+家消费电子品牌企业优质客户基本盘。宁冬冬表示，长期来说，会有直接出售工具和出售服务两种方式。“卖工具的话，一家5亿营收的公司软件授权费只有5-10万，做到上亿营收太漫长。但如果我们接管他的客服服务，直接交付结果，他原本一年200万的团队开销转而付给我们，客单价就从5万变成了100万，还可以帮客户节省100万。”</p>\n  <p><strong>以下是硬氪对宁冬冬的访谈节选：</strong></p>\n  <p><strong>硬氪：您提到的“全自主售后”应该怎么理解？它好在哪里？</strong></p>\n  <p><strong>宁冬冬：</strong>传统的客服大部分都是入职1-2个月的新人，响应慢、容易答错知识点，且零零后客服情绪压力大，回复容易敷衍。而AI客服拥有老人的完整知识库，响应快，知识库有严格更新逻辑不会答错，还能一直保持热情。</p>\n  <p>所谓“全自主”，是指用户从进线到离开，全都是AI接待，中间没有任何人的参与。不像其他厂商需要人类在旁边review所有的对话。</p>\n  <p><strong>硬氪：从技术层面来看，你们是怎么做到全自主接管的？</strong></p>\n  <p><strong>宁冬冬：</strong>其他友商的agent只是一次模型调用，问一个问题回一条消息，也没有多模态能力，无法理解图片和视频。但用户在售后场景大量依赖图片和视频，需要多轮追问回答才能解决问题。</p>\n  <p>在以前的客服难度金字塔里，售前最简单，比如查参数，售后次之，比如退换货。技术售后最难，因为要排障、解决重度使用问题。行业里很多创始人大多是电商或NLP出身，缺乏视觉背景，都挤在售前红海里。</p>\n  <p>但我们团队是做机器视觉出身的，对我们来说难度倒过来了：技术客服就像做数学题，没有太多复杂的情感，只有固定的解，是退货还是排障或教操作。技术客服和普通售后是大量消耗人工的地方，也是没人搞的“无人区”。我们正好可以用自己的多模态能力和图像处理经验来切入。</p>\n  <p><strong>硬氪：不同行业的技术售后差异很大，你们的产品如何实现通用性？图片和视频识别能力如何？</strong></p>\n  <p><strong>宁冬冬：</strong>我们的泛化性很强。虽然产品知识不同，但我们可以通过自动建库来实现。标准化的是整个售后流程：上传结构图、使用资料和历史对话，这三类数据进来就能建立知识库。目前我们主要集中在消费电子行业。</p>\n  <p>在识别能力上，视频比图片更有连贯的语义，更易理解。我们对视频和图片的理解和人类测下来差不多，人能看清的我们也能看清；如果拍得不清楚，AI会提示用户对准哪里重新拍。目前我们在试验中能够解决80%的售后技术客服问题。</p>\n  <p>这套系统技术壁垒很高，首先创始人要对图像有较深的理解，整个体系和纯对话完全不同；其次是要把自研模型与市面上的多模态模型结合；最后是理解用户的产品结构以及局部零件图。新发明的消费电子产品大模型没见过，如何结合大小模型和架构让它理解局部的零件图，是非常难的。</p>", "category": "tech", "published_at": "2026-08-09T01:00:30+00:00", "fetched_at": "2026-08-09T01:18:57.271944+00:00", "fingerprint": "e0520279fee7ab7b"}, {"source": "少数派", "title": "就内容创作而言，说话还是替代不了打字", "url": "https://sspai.com/post/112901", "summary": "创作本就不是一个「速度为先」的行为——而打字，本质上是一个思考的过程。<a href=\"https://sspai.com/post/112901\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-08T05:11:00+00:00", "fetched_at": "2026-08-09T01:18:55.302349+00:00", "fingerprint": "15af9cb131e78acb"}, {"source": "The Guardian - World", "title": "Judge approves Trump effort to end South Sudan TPS protections", "url": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "summary": "<p>Decision follows supreme court ruling that allowed US government to strip protections for Haitians and Syrians</p><p>Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.</p><p>On Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.</p> <a href=\"https://www.theguard "fetched_at": "2026-08-08T01:13:52.440616+00:00", "fingerprint": "e7082108221b67be"}, {"source": "The Verge", "title": "The gaming site sponsored by Walmart lays off its editorial staff", "url": "https://www.theverge.com/games/977056/restart-gaming-site-walmart-moonrock-layoffs", "summary": "Restart, a games media website launched in late 2024 that was sponsored by Walmart, has laid off its \"entire editorial team,\" according to a Friday post from Brandy Berthelson, the site's former editor-in-chief. Other staffers have also posted about being laid off. Restart is operated by Moonrock, a content marketing agency, though its editorial mission [&#8230;]", "category": "tech", "published_at": "2026-08-07T22:05:08+00:00", "fetched_at": "2026-08-08T01:13:52.440605+00:00", "fingerprint": "de335e27832f2877"}, {"source": "36氪 - 最新文章", "title": "齿科3D打印龙头下场做消费级产品，众筹超7000万元｜Insight全球", "url": "https://36kr.com/p/3928866062416001?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>编者按：当出海越来越成为一家中国公司核心战略时，如何征战全球市场就成为一个极其专业的话题。在全球化的演变中，已有不少中国品牌站立潮头。鉴于此，硬氪特推出「Insight全球」专栏，从品牌成长与变迁，探索中国品牌出海的前沿方向与时代契机，为出海玩家与行业提供思考与启发。</p>\n   <p>这是我们专栏第63期——黑格科技从齿科数字化市场起步，在一次次产品调整和技术迭代中，逐步建立起覆盖设备、材料、算法、软件与服务的全栈能力。如今，这家公司又将目光投向消费级UV 3D打印，希望把在专业市场中磨出的技术与产品能力，带到更广泛的全球用户面前。这也是黑格成立多年后，对公司边界的一次重新探索。</p>\n  </blockquote>\n  <p>过去几年，黑格科技创始人兼CEO桂培炎谈得最多的是“牙齿”。你和你家人用的义齿、正畸模型，有很大概率属于黑格的光固化3D打印产品。</p>\n  <p>仅仅凭借齿科业务，在国内齿科技工端市占率超60%。“如果我们产线出问题了，全国的牙科医院都要断货。”桂培炎对硬氪开玩笑。</p>\n  <p>桂培炎的雄心显然不止当个细分赛道的隐形冠军。前不久，黑格科技首次在Kickstarter发布产品，众筹其全球首款桌面级全彩3D+UV打印机G1X，产品首日众筹金额近5000万元，（约722万美元），G1X能为个性化DIY、微缩模型和手办制作、工艺品文创设计、工业设计及教具等领域提供一站式的全彩造物解决方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_13c808fc515c425aa1d6977caf161f78@5836910_oswg23400oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>G1x与齿科无关，也不再服务于牙科技工厂和医院。黑格科技试图将过去在光固化设备、材料、软件和复杂专业场景中积累的能力，重新组合到新产品中，尝试进入一个用户更分散、竞争更直接，也更难预测的消费级市场。</p>\n  <p>桂培炎是个很敏锐的人。在苹果还没有推出TWS时，他就想用3D打印设计制造无线蓝牙耳机。第一次创业搁浅后，他又下场生产制造3D打印机，并抓住齿科数字化转型的窗口，迅速铺开了全球市场。今天,拓竹将3D打印推向更大众的市场后，3D打印的应用边界被不断探索和拓宽，桂培炎要跳出舒适圈。</p>\n  <p>相比技术本身，桂培炎更在意的是，3D打印最终能否变成一个被人真正使用的产品。</p>\n  <p>“3D打印真正能给大家带来幸福的地方，一定是通过某种产品形式呈现在大家面前，你不需要意识它是3D打印做得，我也不需要你意识到。”桂培炎告诉硬氪。</p>\n  <h3><strong>01 齿科不是终点，是技术训练场</strong></h3>\n  <p>桂培炎属于很古典的创业者。大三带着同学在美国休学、回国创业。当时苹果的TWS还没发布，他想着用3D打印制造类似的无线耳机。</p>\n  <p>很快，桂培炎第一次创业以失败收场。他误判当时3D打印制造的成熟度，没办法正常交付，苹果发布AirPods后，他们这种小作坊彻底失去的存在的空间。</p>\n  <p>“学生创业确实不靠谱，有passion，但没有生产制造的落地能力。”桂培炎坦承。后来，他帮人做3D打印赚点钱，勉强维持公司。</p>\n  <p>2018年，桂培炎有些受够了做3D打印代工厂的业务。他觉得黑格像个手板厂，每天跟客户争“5分钱降到3分钱”。他想找到一个适合3D打印应用、也更有溢价空间的市场。</p>\n  <p>次年，桂培炎无意中去到华南口腔展。他看到装修很fancy的会场，许多站台的模特，人来人往的人们带着MacBook......“一看就是个有钱的行业，他们付费意愿高，而且光固化3D打印跟他们产品match度很高。”</p>\n  <p>口腔行业付费意愿高只是敲门砖，桂培炎真正看中的是口腔扫描仪在中国的普及和爆发。</p>\n  <p>口腔扫描仪（简称“口扫”）是现代化数字齿科的核心硬件之一。它通过光学扫描镜头直接在患者口内采集牙齿、牙龈、黏膜及咬合关系的3D彩色数据。</p>\n  <p>2018年前后，中国本土齿科数字化供应链爆发，不少国内企业攻克了光学三维重建算法和微型光学系统，口扫价格大幅下降。</p>\n  <p>口扫和3D打印天然形成数字化工作流闭环，前者采集数字模型，后者将数字模型打印为实体。</p>\n  <p>这是很微妙的时间点，技工厂、医院数字化转型尚在起步期，他们对国产机器的态度信任度并不够，产业链上的相关厂商也尚在犹疑。</p>\n  <p>黑格科技开始集中精力研发适配齿科行业的光固化3D打印机。</p>\n  <p>“口扫是完全不可逆的趋势。”桂培炎告诉硬氪，“在这种趋势下，企业一定要有先发优势。而且当时我认为3D打印跟能应用到齿科还有段距离，你要有半年到一年的打磨期。竞争这么激烈的情况下，你能做的就是高速迭代，把人迭‘死’。“</p>\n  <p>为了抓住窗口期，黑格科技经历了近半年时间的疯狂研发，桂培炎记不清产品迭代了多少次，最多时候他们有100多个配货仓，上各种工艺方案，软件无限制开发。早期机器的问题从最初的200个、收缩到30个、再到十几个.......</p>\n  <p>这段时间，黑格多线作战。过去，黑格的3D打印机的软件和耗材都来自海外厂商，在自研软件未准备好时，他们被海外厂商停用了软件。为了能签单，黑格的技术人员挨家挨户的帮客户做切片、数据处理，勉强度过了空窗期。</p>\n  <p>除了机器，他们还在同步开发耗材。海外耗材价格也很昂贵——2000元每公斤。不少国内厂家进入行业跟黑格竞争，耗材价格成为竞争劣势。黑格搭建了材料研发团队，花了数年时间，耗材实现90%以上的自研。</p>\n  <p>在今天，黑格科技是国内极少数打通了“光学系统、硬件设备、树脂耗材、配套软件及核心算法”产业链闭环的光固化3D打印企业。其在国内齿科技工端市占率超60%，位居首位。同时，其海外营收占比已突破60%，中国齿科3D打印北美出海市占率榜首企业。</p>\n  <p>但回想起来，桂培炎没有太多吹嘘。商战残酷，“做软件、材料是被逼的。”他们只是为了生存，不断逼迫自己建立更深的护城河。</p>\n  <h3><strong>02 寻找、验证第二增长曲线</strong></h3>\n  <p>齿科的成功经验，要如何复用到C端赛道，是新的挑战。</p>\n  <p>2022年前后，桂培炎看到消费级3D市场开始起量，他却很难说服自己立马参与其中。</p>\n  <p>“我觉得它更像个玩具，只能给自己玩，不能用于生产。我们还是想鼓励更多人把3D打印变成赚钱的工具，成为商业化的一个途径。”桂培炎告诉硬氪。</p>\n  <p>3D打印的应用场景，是黑格科技始终看重的业务脉络。不过，他们也意识到很难到找到跟齿科类似规模的赛道，必须要做更大众的产品，覆盖更多的小赛道。</p>\n  <p>而拓竹在消费级3D打印行业的一往无前和迅猛增长，显然给了所有3D打印企业提示——C端有着巨大的市场和想象空间。</p>\n  <p>消费级3D打印市场必须要切入，哪怕黑格已经晚了一步。</p>\n  <p>2023年时，黑格科技推出面向向个人创作者和中小工作室Reflex系列。与齿科等专业设备不同，Reflex系列更加注重成本、易用性与普及性。</p>\n  <p>黑格在Reflex系列产品上，使用其研发第二代LCD光固化技术，新技术在材料兼容性和打印性能上已接近DLP技术水平，突破了LCD设备难以适配高性能树脂材料的限制，同时保留了LCD方案成本更低的优势。</p>\n  <p>桂培炎坦承Reflex系列产品的定位和定价都有问题，他们想服务消费级用户，但定价只能服务到金字塔尖的那批人群。“我们原来做B端生意，转到C端确实有些水土不服。”</p>\n  <p>Reflex系列产品让黑格重新认识消费市场，要有更亲民的价格、更明确的目标用户，还要有专门组建服务C端用户的团队。</p>\n  <p>去年，安克创新的eufy Make UV打印机让Maker赛道从此多了一个新品类。黑格也在安克创新这代产品的落地中得到灵感，这才诞生了G1X。</p>\n  <p>G1X其实已经有技术积累，其运用的全彩3D打印技术已在黑格内部预研多年。全彩3D打印技术底层是Material Jetting技术（材料喷射技术），对喷头、材料和控制系统的要求相当高，设备和使用成本也很高昂。</p>\n  <p>过去多年，全彩3D打印一直是工业级旗舰设备的专属能力，这类设备通常售价在45,000美金以上，重量在140kg以上，占地超过一台双开门冰箱。</p>\n  <p>消费级3D打印行业主要应用的是FDM路线和光固化路线，材料喷射路线几乎无人涉猎。</p>\n  <p>光固化3D打印也是黑格为人所知，也是其打开市场的主要技术路线，黑格没有因此满足。</p>\n  <p>“很多企业会路径依赖，它在一个地方成功了，会想在原有的基础上做得更好，这个是OK的。但你肯定还有有一部分的能力去做新的创新，做一些别人没见过的东西。这是我们比较认可的。”桂培炎说。</p>\n  <p>2022年时，黑格开始研发Color Print的技术储备，到2024法兰克福Formnext展会上的第一代CP01，再到2026年芝加哥MMF展会上发布的多材料一体成型义齿都是其全彩3D打印技术的商业化落地。</p>\n  <p>在采访现场，硬氪看到不少G1X打印的产品，有手机壳、微缩模型、手办和键盘帽，它们看起来质感细腻，色彩还原度佳，没有任何横纹，也确实很难看出是3D打印机所制造。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_99f0cda4f65f4a9d8bde11870f758b81@5836910_oswg124583oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>黑格科技介绍，G1X可在UV 3D树脂（Resin）、UV墨水（UV Ink）及水溶性墨水（AQ Ink）三套墨水体系间轻松切换。除了高精度全彩3D打印外，能延伸至多色平面打印、立体表面纹理打印以及织物转印膜打印。</p>\n  <p>在耗材价格上，得益于黑格科技多年自研耗材的支持，G1X UV3D树脂耗材体系定价仅为同类消费级产品的1/3到1/2，大幅降低实际使用成本。</p>\n  <p>在桂培炎的规划里，G1X初期瞄准的用户是依靠3D打印商业变现的工作室、职业创作者；中长期，黑格科技希望通过供应链优化等，将整机价格下探至5000元以内，全面切入大众家庭消费市场。</p>\n  <p>在桂培炎看来，这也是黑格同其他企业不一样的地方，很多企业会等高速公路建成去造车，他们选择是拿着锄头铺路。</p>\n  <p>创业十多年，桂培炎早就丢掉了幻想。他不爱讲故事，也很少冲动行事。“你要找到自己的弱点，用好的人，做正确的事，有的时候多点耐心，在基础判断上做得更好一些。”</p>", "category": "tech", "published_at": "2026-08-07T02:49:37+00:00", "fetched_at": "2026-08-08T01:13:52.282122+00:00", "fingerprint": "9822b4a6a701669f"}, {"source": "36氪 - 最新文章", "title": "中国游戏，进入「与AI同游」时代", "url": "https://36kr.com/p/3929147779136896?f=rss", "summary": "<p>ChinaJoy今年的剧本变了。</p>\n  <p>往年的ChinaJoy，是游戏玩家一年一度的夏日狂欢，新品试玩、coser聚会，叠加属于游戏的一切想象，也构成了中国游戏行业的初心与蓬勃景象。</p>\n  <p>而今年的ChinaJoy，少了些打游戏的声响，多了些造游戏的躁动。</p>\n  <p>2026 ChinaJoy的主题是“与AI同游”，近900家展商、14万平方米展区，展会规模和“含AI”量同时创下历史新高。</p>\n  <p>更有意思的是展商名单的变化。今年世界人工智能大会上的技术展商们，没休息多久，就马不停蹄地转场搬进了ChinaJoy现场。没多少是“纯血”游戏出身，可能根本不懂哪款游戏好玩，<strong>但他们决定的是“游戏还能被怎样创造”。</strong></p>\n  <p>夏日带来生机，燥热也带来困惑。全民造游戏仿佛成为了一个不容置疑的结果，但又没有人去认真地回答一个问题：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_d6eaeff568b544aea54f2ba5ac2e2252@11416942_oswg1310693oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2026 ChinaJoy展会现场，图源ChinaJoy公众号</p>\n  <p><strong>未来，如果AI真的要把美术、开发、运营的管线“吃掉”，造游戏不再具有筛选价值，那么游戏行业的稀缺性将会转移到哪里，转变为什么？</strong></p>\n  <p>一场结构性的转变之后，新的悬顶之剑又会现身于何方？</p>\n  <h2><strong>01. “做游戏”的门槛消失后</strong></h2>\n  <p>来自阿里云的鲍远松，过去一年服务了游戏行业上百家厂商。他的观察是，行业已经跨过了要不要用AI的争论期，进入了怎么规模化用好AI的阶段。</p>\n  <p>“我们在两年前看到的游戏行业，跟今天完全是两个世界。”鲍远松说，两年前，很多游戏厂商担忧用AI做出来的游戏玩家会不会接受，大部分人的态度还是观望，不知道AI在游戏中的边界在哪里，用了会不会失控。</p>\n  <p>拐点出现在2025年下半年。据Steam平台观察数据，截至2025年12月，平台主动披露使用生成式AI的游戏数量已突破1万款。产业成本用脚投票，再到今年的ChinaJoy可见一斑，AI已经成为游戏生产管线和很多新游项目中不可或缺的生产力，甚至成为游戏玩法的一部分。</p>\n  <p>伽马数据《2026中国游戏产业AI发展报告》显示，2026年上半年游戏行业的投融资中，AI相关项目占比超70%，国内游戏研发端AI普及率已达86.36%，AI工具成为了行业标配。</p>\n  <p>“AI在游戏中的边界是什么”这个问题，首先被重构的能力壁垒就是美术外包、开发编程。</p>\n  <p>伽马数据报告显示，AI素材在游戏研发中的使用占比已经从2024年的10%涨到了2026年的大于41%。中国音数协游戏工委给出的数据也进一步印证，传统素材外包成本下降了50%到70%，人力成本下降超60%。</p>\n  <p>AI Coding的全球浪潮，绝对不会避开游戏这块肥沃的土壤。Unity《2026游戏开发报告》显示，62%的游戏开发者已经在用AI辅助编码，开发时长平均缩短了77%。据可靠消息，头部游戏厂商中已有代表性企业，AI开发工具人均每天消耗的 tokens 成本达到千元量级，而这一投入所创造的价值远高于此。</p>\n  <p>而在比图像和代码更前端、离人更近的链条中，变化也比大众想象得更彻底。一家游戏厂商的运营人员向36氪反馈，过去一个需要5人团队做20天的运营方案，现在的节奏和成本变成了2个人，一周时间。</p>\n  <p>数据统计、活动文案、社群维护这些标准化流程上，AI替代率能达到80%。</p>\n  <p>类似的人力替代逻辑，在内容审核等AI最擅长的环节上也在全面铺开。国内头部研发商贪玩游戏目前正在基于阿里云的千问打造内容安全审核平台，在游戏内实现了高精度、高准确率的玩家聊天内容审核的功能，实现提效50%。</p>\n  <p>美术、编程、运营、审核、本地化翻译，这些占据了一家游戏公司大部分预算的环节，被系统性地大幅压缩。这件事令所有人惊喜，也令所有人恐慌。</p>\n  <p>众所周知，产业上游的成本一旦跟随新技术跌落，传统生产力就再也不会被市场所接受。<strong>如果“制造游戏”不再是一种资本特权，游戏自身不再具备奢侈品一般的筛选价值，也就意味着旧市场秩序正在失效。</strong></p>\n  <p>旧的稀缺性“消散”已经是必然趋势，然而，游戏公司如何才能具备新的稀缺性，需要作出怎样的判断和战略选择——这个问题，才是今年ChinaJoy以后整个游戏行业要面对的达摩克利斯之剑。</p>\n  <h2><strong>02. AI正在改变“玩游戏”</strong></h2>\n  <p>新的稀缺性是一道窄门，能进去的人变少了，但它其实就立在那里。</p>\n  <p>什么样的游戏会更有价值？很简单，好玩的游戏。</p>\n  <p>生产管线的AI化，降低了“制造游戏”的门槛，但并没有剥夺创造的价值。创造的低门槛和平民化，反而会倒逼着游戏厂商专注做游戏，把成本更多地投入在玩法的趣味性、交互的便利性、寓教于乐的场景等方面。</p>\n  <p>在杠杆的另一端，AI也走进了游戏玩法本身：走进NPC、走进剧情、走进世界规则，衍生出了更多丰富细腻的玩法，甚至已经改变了“玩游戏”这件事本身的定义。</p>\n  <p>这里的变化，显然比游戏行业的成本重构要剧烈得多。</p>\n  <p>一个很有说服力的例子，去年巨人网络推出的中式微恐类爆款游戏——《超自然行动组》彻底带火了该赛道，上线一年DAU突破千万，累计注册用户2亿，流水超50亿。QuestMobile数据显示，在各大厂商纷纷跟进重注相关赛道后，其月MAU复合增长率仍然能超过20%，在同品类游戏中堪称运营奇迹。</p>\n  <p>这款游戏的一大亮点，就是内置了一类由AI驱动的“AI假人”，上线第一周，AI NPC与真人玩家的对局总数超过了2500万次。</p>\n  <p>AI NPC们会像真人一样灵活走位、搜刮物资，现场跳舞。他们有自己的“人格”，会跟玩家拉近关系、建立信任，然后冷不丁上演致命反杀。很多玩家也发现，这些AI队友的回应比预想中质量高很多，给予的情绪价值比随机匹配的陌生人更多。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_09339552df0e4ca19d724e3a2b6db25d@11416942_oswg651031oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>为什么两年前，业界还普遍认为AI对战是没有灵魂的？就是因为像这样会骗人、会哄人、会反水的NPC，非常依赖于大模型能力的质变，以及技术落地的深度，背后至少需要三层能力同时就位。</p>\n  <p><strong>第一层是模型本身的“角色感”。</strong></p>\n  <p>市场上主流大模型，想做娱乐对话场景，绕不开的矛盾是，怎么样让AI变得“既听话，又不听话”。聊天能力强的，指令遵循弱；指令遵循强的，人格魅力和角色感就出不来。</p>\n  <p>据了解，巨人网络接入了千问模型，目前已经做到了理解玩家语义、复刻真人音色、模拟玩家的语言风格与行动逻辑，所以能做出具有策略性和迷惑性的伪装动作，让玩家基本上分不出对面是真人还是NPC。</p>\n  <p>更进一步来看，模型的能力边界已经远不止于“对话”。以阿里Qwen3.8-Max系列为例，这一代模型已经可以直接用于游戏逻辑生成和代码编写等核心创作环节——模型能力不再是实验室里的demo，而是可以被嵌入到C端产品生产链路的稳定服务。AI游戏创作智能体TapTap制造第一时间接入了该模型。“Qwen3.8-Max的能力进步非常大，它已经在我们的模型定价体系中展现出很大的竞争力，所以我们就及时把它上线了，我们的开发者用它的比例每天都在增长。”TapTap制造产品负责人赵天一在今年ChinaJoy现场直言。</p>\n  <p><strong>第二层是推理平台的工程能力。</strong>一周之内2500万场对局，代表着每天有数以亿计的token在游戏中被实时生成和消费。在这些对抗交互和实时竞技的品类中，任何一个NPC的响应延迟超过几百毫秒，玩家会立刻察觉到不对劲，所以推理速度也很关键。</p>\n  <p>这也是为什么，今年ChinaJoy上出现了大量AI能力的展示，但目前为止真正能把AI玩法作为王牌的游戏并不多。算力成本是一方面，工程化的成熟度也比想象中要苛刻，这些都是游戏行业在寻找的新的稀缺性。</p>\n  <p>《超自然行动组》的相关玩法背后，阿里云百炼平台提供了每分钟亿级tokens的处理速率，保障了高并发场景下能让玩家无感的低延迟推理。</p>\n  <p><strong>第三层能力，则是Agent的运行环境。</strong>传统游戏公司做网游是在自己的服务器上采购ECS跑服务，流量低谷期算力闲置，峰值扩容又很昂贵，所以传统的部署和运行环境基本“用不起”AI NPC。</p>\n  <p>而今年为止，阿里云这样的AI云厂商带来的变化是，游戏厂商现在只需要把Agent发布到阿里云的Agentic Cloud��台上，平台就会自动处理资源调度、会话管理、毫秒级弹性伸缩，通过沙箱隔离和安全工具调用保障Agent运行。</p>\n  <p>在千万级并发下稳定运行AI NPC，现在对于游戏公司来说变成了一个“开箱即用”的选择。</p>\n  <p>其实，无论是在AI NPC玩法上的深耕，还是与阿里云AI的合作，巨人网络努力去探索的一件事是：游戏的价值稀缺性应该回归游戏“有多好玩”，而不是“有多难做”。</p>\n  <p>这也是AI对于整个游戏产业的意义。</p>\n  <p>再回到开头的达摩克利斯之剑。就算有一天，AI“吃掉”了美术、开发、运营，游戏厂商依然能从中找到创造的价值。因为AI叙事不会停滞于生产力本身，从管线上省下来的成本、解放出来的生产力，终究会被解放到玩法的设计与思考上、多模态能力的融合中。</p>\n  <p>未来，大家的关注点也会重新回归谁能做出更好玩、NPC人格更多元、世界玩法更开放、AI能力和生态更稳定先进的游戏上。那些来自于制作团队庞大、预算充足的所谓“质量保障”，则会变成一顶旧世界的王冠，逐渐褪色。</p>\n  <p>“取之于AI、用之于AI”的态度让《超自然行动组》这些玩法成熟的游戏，越过了AI时代的窄门。</p>\n  <p>另一条路则更加激进：从零开始，做一款彻底由AI驱动的游戏。</p>\n  <p>AI原生历史策略游戏《历史模拟器：崇祯》，走的就是这条路。</p>\n  <p>在千问大模型的支撑下，玩家能从传统的选择剧情，变成创造剧情。在这个游戏里输入一句自然语言指令，就能推行“激进改革”、在多方势力间合纵连横、在古代世界“点亮现代科技树”，触发连锁反应。AI在国库、民心、军心等上千个维度上进行动态数值推演，并生成后续剧情的走向，推演出一个“活的世界”。</p>\n  <p>说它“激进”，是因为传统游戏代码构建的决策树，根本不可能覆盖这种自由度。</p>\n  <p>游戏制作方青干工作室测试了多个主流模型，最终，千问大模型凭借推理准确度、数据处理速度、成本控制的综合表现受到工作室青睐。玩家的历史状态、对话积累、世界演化，需要一个能跟AI同样速度运转的数据中枢，阿里云的PolarDB适合承担这项任务，通过数据压缩等技术优化，在提升模型处理效率的同时，将存储成本压低了超过50%。</p>\n  <p>而在管线端，青干工作室也从POC阶段就开始和阿里云技术服务团队深度协作，Prompt优化、长记忆调优、模型调用限流、RT响应超时监控，这些流程被标准化成为一套7×24小时的保障体系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_1efcf5cd47f14092afc62dac57048676@11416942_oswg816080oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>《历史模拟器：崇祯》验证了AI原生游戏在高并发、强互动环境下的可行性，也代表着一种新的技术服务标准和工程生态，正在游戏行业中建立起来。</p>\n  <p>据项目团队所说，千问胜出的不只是评测分数，还有在长记忆调优、Prompt工程和指令遵循上的磨合深度。也就是说，游戏行业内，AI大模型之间的竞争也正在从“谁性能最强”，变成“谁更适配这个项目”。</p>\n  <p>国际数据公司IDC发布的《中国AI游戏云市场洞察，2025》报告显示，在“AI游戏云模型服务与AI应用”市场中，阿里云以37%的市场份额位列第一。越来越多游戏企业选择基于千问模型打造适合游戏场景的专属模型，专注于游戏业务创新和玩家体验。</p>\n  <p>早在行业还在争论“AI游戏是否值得投入”的时候，这家AI云厂商就在大规模建设底座了。</p>\n  <h2><strong>03. 征服世界之前，先跑赢几毫秒</strong></h2>\n  <p>AI大模型在不同游戏品类中的形态各异，但它们本质都是实时在线服务，每一局对战、每一次对话、每一个Agent的决策，都在调用远程推理。</p>\n  <p>所以，AI作为一种新的玩法、新的能力，又把游戏产业打回了一个古老的瓶颈：网络延迟。</p>\n  <p>尤其是在出海这个“必选项”面前，延迟带来的痛苦和损失更加无法回避。</p>\n  <p>谈及游戏出海，首先要回答的问题是，近些年来中国游戏的出海成绩单为什么能这么强？</p>\n  <p>2025年，中国自主研发游戏在海外市场的实际销售收入为204.55亿美元，同比增长10.23%，也是连续第六年突破千亿大关。《原神》刷新了全球对中国研发的认知，《黑神话：悟空》做到了文化出海，让全球玩家自发接受中国文化熏陶，但这些既往路径有一个大前提，厂商出海的是内容产品。</p>\n  <p>内容做好，打包分发出去，全球玩家的设备自己跑，设备决定内容精度。</p>\n  <p>AI游戏的逻辑则完全不一样。AI玩法、AI游戏，本质上是在卖实时算力服务，而且调用本地算力很难，游戏互动直接产生和消费的是云端算力。</p>\n  <p><strong>游戏玩家对哪怕几毫秒的延迟也会极其敏感，而且传统游戏的延迟是一个单纯的网络问题，就近部署服务器就能解决，AI游戏还考验推理本身的计算速度。</strong></p>\n  <p>鲍远松把游戏出海的新难题，归结为“双重实时计算带来的压力”。游戏服务器要快，推理也要快，而且两个要同时快。这意味着，AI云厂商在游戏行业的竞争，已经从“谁家机房离玩家更近”，变成了“谁家的AI基础设施离玩家最近的节点上，谁家的推理服务速度更快，快到让玩家的大脑察觉不到面对的是AI”。</p>\n  <p>在算力供给日趋紧张的当下，平头哥芯片的存在，让阿里云具备了从芯片到模型到平台到服务的AI全栈纵向自给能力。全球主流AI云厂商中，拥有如此完备的配置玩家不多，阿里云是其中之一。</p>\n  <p>我们熟知的心动《火炬之光：无限》作为一款全球化运营的多端暗黑Like的ARPG游戏，目前已持续运营多个赛季，用户稳定增长；在阿里云服务的助力下，各区服开服期间没有出现任何大规模卡顿或掉线。对于一款时延敏感的ARPG游戏来说，需要从底层架构上扛住百万级的QPS并发请求，做到毫秒级响应时延。</p>\n  <p>《火炬之光：无限》流畅的全球化体验，说明阿里云已经拥有一张坚实的“网”——一套铺设在全球的物理网络，目前在全球运营32个公共云地域、105个可用区、4大区域服务中心和27个本地服务中心，从墨西哥、巴西、巴黎到阿姆斯特丹，数据中心沿着中国游戏出海的主要市场逐一落地。</p>\n  <p>其实，过去不少全球大型网络游戏拼的也并不是美术、运营和玩法，而是网络资源。谁的服务器更稳、带宽更便宜，就能在用户体验中胜出，在同品类中占据上风。</p>\n  <p>只不过，那个时代正在结束。心动的优秀答卷之外，是未来AI游戏出海的新考卷。下一阶段，网络资源仍然不能落后，挑战会更艰巨，但它只会成为最基本的服务底座，不会成为游戏出海的瓶颈。</p>\n  <p>根据鲍远松的说法，最近阿里云正在追踪一个新指标——TTFT，从玩家发出指令到模型吐出第一个token的时间。只要能跑赢这个数字，跑出几十毫秒、几毫秒的成绩，把新一代中国游戏的价值稀缺性输送到全球各地，就不会止于技术的幻想。</p>\n  <p>早在2013年，阿里云就组建了第一个面向游戏垂直行业的技术服务团队，将单一的云产品升维为长期磨合共创的解决方案，游戏也就此成为了阿里云选择切入的第一个垂直行业。对于一家AI云厂商来说，在一个垂直赛道早出发、长期主义是真正的“胜手”。</p>\n  <p>那么对于一家游戏厂商来说呢？是从资金之争、资源之争，到管线效率之争、AI能力之争。</p>\n  <p>2026年，这场竞争到底有多热，看看资本的动作就知道。</p>\n  <p>5月，斯坦福大学教授李飞飞担任联合创始人的AI游戏公司Astrocade，官宣完成5600万美元融资，主打AI游戏UGC平台，8个月内用户突破2000万；</p>\n  <p>7月，专注AI 3D大模型和世界模型的公司VAST完成超10亿元A3轮融资，多个游戏产业资本参与投资；</p>\n  <p>极逸SOON一年内完成两轮融资，累计近亿元，用于打造一站式AI游戏创作平台。</p>\n  <p>游戏厂商“造世界”，创造力如同世界的支点，价值稀缺性如同世界的重力。如今重力转移正在发生，且不可逆转。</p>\n  <p>成本结构在变，壁垒在松动，怎么用好AI生成、怎么解决全球推理延迟，变成了比美术水平更关键的“生死线”，竞争也必然会重新洗牌。</p>\n  <p>过去，我们会说“中国制造”成就了一个又一个的出海奇迹，哪怕是游戏，游戏是艺术也是工业。</p>\n  <p>如今，“制造游戏”不再构成壁垒，那么制造力自然会变成创造力。而在一切创造与审美的背后，模型、平台、AI基础设施，构成了万变中不变的底层能力，和下一个十年的入场券。</p>\n  <p>AI不是把游戏行业的生产管线“吞掉”了，是让做游戏变得更简单、玩游戏变得更有趣了。AI原生游戏、中国游戏出海的伟大冒险，也才刚刚出发。&nbsp;</p>", "category": "tech", "published_at": "2026-08-07T09:00:30+00:00", "fetched_at": "2026-08-08T01:13:52.282115+00:00", "fingerprint": "4cfeddca66158e6a"}, {"source": "36氪 - 最新文章", "title": "不等了！一个盲人上手造了个导盲机器人", "url": "https://36kr.com/p/3929352336587906?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_c8cf27ba1af44876869dde157b5f7181@6314151_oswg1234903oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>一个看不见的人，如何获得独立出行的自由？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_1ead215125a04e82a3b88564825d5d0e@6314151_oswg560oswg900oswg30_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>访谈 <strong>| </strong>刘思洁、李嘉星</p>\n  <p>撰文<strong>&nbsp;|</strong>&nbsp;刘思洁</p>\n  <p>编辑<strong>&nbsp;|</strong>&nbsp;张薇</p>\n  <p>封面来源<strong>&nbsp;|</strong>&nbsp;AI Look官网</p>\n  <p>&nbsp;</p>\n  <p>全球人工智能大会的采访间里，两个声音同时响起。</p>\n  <p>视障人士朱清毅在向“未来人类实验室”讲述他的连续创业经历时，另一个平静的带有一些机械感的女生则说着：</p>\n  <p>“方向朝南，距离约1.4米”。</p>\n  <p>“左侧灰墙装双开关，铺灰地毯”。</p>\n  <p>女声来自朱清毅身旁一台形似缩小版太空探测仪的机械设备。它身上的摄像头、雷达和多重传感器正在工作，扫描着周围的环境，并把数据转化成语音，一句一句播报出来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_58b102ef404942ab96b00c29aede7480@6314151_oswg650838oswg900oswg1591_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI LOOk机器人</p>\n  <p>&nbsp;</p>\n  <p>这是朱清毅创办的朱葛机器人团队生产的导盲机器人，名叫AI Look。从立项到今天，花了六年。专门为视障人士设计，帮他们避障、导航......</p>\n  <p>朱清毅启动这个项目时，他面对的并非一个市场机会，只是一个困扰自己几十年的问题：<strong>一个看不见的人，如何获得独立出行的自由？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_9d184abc33724c27a7685645a92b98de@6314151_oswg112042oswg1080oswg1621_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">朱清毅在全球人工智能大会上发言</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_1c13538580b8438990e69f85cddddf60@6314151_oswg1788oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>看不见的最大困扰</strong></h2>\n  <p>对于像朱清毅一样的视障人士来说，看不见的不便，嵌入了生活的方方面面。</p>\n  <p>这是一个为健全人构建的世界，盲道被刷成醒目的黄色，虽然真正需要使用它的人并不能看见。大多数网站没有考虑过盲人会来访，文字为了好看做成了图片，按钮没有加上说明标签，读屏软件念不出内容，只会重复一个词：“链接”。政府采购目录里给盲人使用的产品，被一批批分发下去，但是因为不好用被堆在了角落里......</p>\n  <p>看不见的遗憾在日常生活中经常出现，并不会随着时间消失或淡去，有时是和同事朋友们一起外出，有人说风景真好，朱清毅能感受到拂过面庞的风的温度，闻到空气里的气味，人和小动物发出的声音，但“就是看不见”，更刺痛他的则是他“看不见儿子长啥样”。</p>\n  <p>大家会对对他说“你儿子真帅”，朱清毅想知道儿子到底长啥样，他拿手抚摸儿子五官，他能感受到儿子鼻子大致的高度，但是却始终无法在脑海里构建出儿子样貌的图片。</p>\n  <p>朱清毅的人生有一个明确的“分界线”。</p>\n  <p>读书时，他的理科成绩很好，和大部分孩子一样，当时的理想是考上大学、学习喜欢的专业。15岁之后，一场疾病改变了一切。一次发烧后，他被确诊患上视网膜色素变性，视力开始不可逆地下降。18岁时，他已经无法阅读普通书籍，只能进入盲校学习。1998年毕业后，和大多数视障人士一样，他成为了一名按摩师。</p>\n  <p>他在山东老家开过一家推拿按摩店，最多时手下有近50个员工。他肯钻研、按摩技术好，店里一半的营收都是他创造的。“钱赚得也多”，钱就用那种折叠的纸巾袋子，一打一打装在口袋里。</p>\n  <p>2000年底，朱清毅花了7999元购买了人生中的第一台电脑。彼时上网还需要拨号，一分钟收费几块钱。</p>\n  <p>朱清毅借着电脑上的读屏软件，从网上下载编程书籍自学，不仅学会了代码，还申请了域名和空间，2001年搭建起一个专为盲人做的无障碍网站，方便视障群体下载书籍和音视频资料。</p>\n  <p>自己创造一个网站，和给人推拿是完全不一样的体验，但是有相通之处，为他人推拿，是缓解疼痛，治病，造一个网站，也是为了“治疗”和他一样的视障群体，虽然这种治疗没办法让视障群体重现光明，但却让曾经被“看不见”束缚的界限，外延了。</p>\n  <p>自从自学了编程，朱清毅就在技术创业的路上走了下去，2009年，他关掉了自己的按摩馆，在老家山东创建了一家软件科技公司，这些年他带着团队，做了盲人无障碍考试系统、盲人音乐教学软件、盲人远程教学平台、特殊教育的智慧校园体系，还承接了一些地方残联、高校的无障碍网站的创建工作......</p>\n  <p>这些项目有一个共通之处，都是先从他自己的生活困境发现的需求。</p>\n  <p>他看不见网站上的验证码，就做一个无障碍二维码识别系统；盲人学生考试不方便，就做无障碍考试系统；想学音乐但找不到合适的方式，就做音乐教学软件。</p>\n  <p>他自己也是这些产品的第一个用户。</p>\n  <p>最困扰他的，是看不见让他没办法独立出行。</p>\n  <p>大概在2010年后，随着视力的衰退，朱清毅就无法独立出门了，他必须要在家人、朋友又或是同事的陪伴下才能出门。</p>\n  <p>朱清毅告诉我，因为无法独立出行，对他而言最大的束缚是“依赖别人，麻烦别人”，现在带他出门的是几个比较固定的同事，到了周六日，大家都会有安排，这个时候他想要出门，就会更觉得自己在麻烦其它人。更多的时候，周末需要去公司加班，他不会叫助理，而是选择自己打车。</p>\n  <p>大多数时候，和我交谈时，朱清毅都保持着一种平静，但当我问到“盲人是不是不爱出门”这个问题时，朱清毅直接反驳了我，说这是一句“假话”，然后反问我“就像两条腿都瘫痪的人说他不爱走路，你相信吗？”</p>\n  <p>朱清毅是一个要强的人，他出门在外不爱使用盲杖，他告诉我，对于大多数盲人来说，都不爱拿着盲杖出门，盲杖在盲人看来，是一个标签，拿着他出行，就是在告诉其它人，自己是一个盲人。</p>\n  <p>他想要独立出行，也想要撕掉盲人的标签。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_e5ff75e0590548ccae4cd042b939b74b@6314151_oswg259442oswg1080oswg1439_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">朱清毅在使用AI LOOK</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_70e0293a70114dd69718365560624366@6314151_oswg2470oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>吃够了一直“等”好用产品的苦，那就自己做</strong></h2>\n  <p>他一度把希望寄托在技术上时，但又一次次感到失望和挫败。</p>\n  <p>十年前，他还有通过技术“让盲人真正看见”的这个想法，但在研究了脑机接口、电子眼等技术后，他意识到，这是一个短期内很难实现的目标。</p>\n  <p>没办法通过“复明”实现独立出行，那就通过一个个“导盲产品”。</p>\n  <p>这些年，朱清毅几乎尝试了市面上所有的导盲产品。</p>\n  <p>在胸前的可穿戴设备、绑在裤袋上的传感器装置、还有像手电筒一样的拿在手上避障的产品，但是使用效果都不尽如人意，“我还是不知道那障碍物是什么？是树是椅子还是猫？就算是它告诉我有障碍物，但是我仍然不敢走。”</p>\n  <p>朱清毅觉得，这些年，他就是吃了一直在“等”的苦，一直在等着别人为视障人群造出好用的产品，解决出行难题，但实际上，大部分给视障人士生产产品的是健全人，他们没办法全然地洞察视障人士的痛点和需求。</p>\n  <p>但他自己却可以，他是视障人士，他知道这个群体要什么，实在不行，他还有一群视障朋友，都可以做产品经理。</p>\n  <p>2020年，朱清毅参加了中国残联的“十四五”工作规划预备会，当时大家都在聊机器人。</p>\n  <p>那时，公司也正在做无障碍智慧校园体系，其中一个附带项目是给APP加了个能自动回答问题的“虚拟机器人”，这让他觉得人工智能技术确实已经发展到一定水平，可以做个机器人来为视障人士导盲了。</p>\n  <p>会议结束后，朱清毅回到公司，立项了“导盲机器人”。时机到了，既然市面上没有一个团队作出一个让他满意的产品，那就自己来做。</p>\n  <p>最初，公司内部想象的产品形态是一只“导盲犬”，但这个想法很快被推翻，他们买了机械狗回来测试，官方说续航很长，但让它不停地跑，不到一小时就没电了。机身重四十斤左右，盲人根本抱不动，上下台阶还容易摔跟头。于是，机器狗这条路被舍弃。</p>\n  <p>第一个真正做出来的东西极其简陋。底盘是一个普通电脑主机的移动托盘，自带万向轮。上面是一个纸箱，挖了几个洞,把网上买来的各种传感器一个一个粘在洞口，再装上一个推行的把手。</p>\n  <p>它还不会带着人走,只能靠人推着它移动,一边推一边看传感器传回来的数据,判断它到底能不能“看懂”眼前是什么。那时候研发团队只有两个人，朱清毅和一个做过安卓APP开发、学物联网出身的年轻人。他们俩在网上一件一件搜传感器,买回来拆开装上,推着纸箱在办公室里走来走去。</p>\n  <p>但这也是整个创业机器人的过程中，朱清毅最有成就感的时刻，从这两个人开始，团队一点点扩到现在的五十多人。产品在实验室里前后迭代了十几代，从最初只能“识别出前面有个东西”，一步步走到能自己避障、能带着人走、能规划路线。</p>\n  <p>当然，这中间也踩过不少坑，机身本身是一整块磁场，最早把4G物联网卡装在机身底部，结果一进屋、一放进车里就没信号，查了很久才发现是磁场干扰导致的，最后把卡挪到手柄最顶端才解决；芯片算力强，发热快，能让机器的外壳烧到150度以上，但要散热就得留通风口，留了通风口又没法防水。这个“既要散热又要防水”的矛盾，他们后来靠自研设计解决了，还申请了专利。</p>\n  <p>正是这一步步地摸索，AI Look最终被做出来了，目前预售加起来大约1200台，首批量产计划9月交付，大概两三千台。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_aaa9501329c94acfbd46f618d736cd0a@6314151_oswg79877oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI LOOK机器人</p>\n  <p>我问朱清毅，产品到了视障人士的手上，你想帮他们解决的最小需求是什么。朱清毅回我，不是小需求，而是大需求，“独立出门遛个弯，还能回来。”</p>\n  <p><strong>以下是关于AI Look的技术实现部分，“未来人类实验室”（以下简称未来人）和朱清毅的对话：</strong></p>\n  <p><strong>未来人：可以整体归纳一下AI Look目前的主要功能吗？</strong></p>\n  <p><strong>朱清毅：</strong>这台机器人的核心逻辑，是“避障+导航+牵引”三件事。在导航方面，室外靠卫星导航，室内靠“巡航”寻路，避障、刹车、转弯，这个是毫秒级的，确保你不会出安全问题。</p>\n  <p>“寻物”方面，比如找厕所、找电梯、找座椅、找红绿灯、找斑马线，它靠标识识别的。</p>\n  <p>AI Look还能帮用户播报周围的环境，让使用者知道大概要去哪，前面是什么我们这个版本还接入了豆包的语音助手能力，可以做更详细的场景问答，比如让它描述“前面这位人士的长相、穿着、笔记本电脑品牌”。</p>\n  <p>我们的正式版本还会配一个智能眼镜，眼镜解决的是机器人没办法看到的视角的问题，比如坐高铁时，座位号在头顶行李架方向，机器人要抬起来看很费劲，但眼镜一歪头、按一下键，就能读出“3A、4C”这种信息。</p>\n  <p>AI Look的步速是可以调的，有的人平常步伐比较快，有的人对外界世界还有些害怕，这样可以调慢一点。我们的每一台机器人都由保险公司承保。</p>\n  <p><strong>未来人：你提到AI LOOK不建图、不遥控是如何实现的？</strong></p>\n  <p><strong>朱清毅：</strong>市面上的机器人，包括人形机器人、扫地机器人，用的都是SLAM技术。拿一台放进屋里，它哪都去不了，得先一步步把空间扫一遍，没扫过的地方就去不了。操作上要么在手机上点几个点当遥控，要么用手柄控制前进后退及左右方向。</p>\n  <p>我们不扫图、不用遥控，机器一开机就能走。</p>\n  <p>这背后是多传感器融合算法。现在的机器人身上其实也有激光雷达、视觉、超声这些传感器，但它们的做法是每个传感器单独建立一个函数：视觉一个、激光一个、超声一个、毫米波雷达一个，分开算，尤其大多数扫图方案以激光雷达为主，单独计算这一路数据，别的传感器数据顶多是参考。</p>\n  <p>我们把这几个传感器数据放进同一个函数里，融合成一张网来统一计算。如果做成可视化演示，你会看到激光点云、视频画面、超声数据同时叠加在一张图上，整个空间的距离、大小、地面平不平都在上面。</p>\n  <p><strong>未来人：硬件上都有哪些传感器？</strong></p>\n  <p><strong>朱清毅：</strong>超声波、3D激光雷达、双目相机、单目相机、气压传感器、惯导等等。多传感器融合就能把所有数据汇总到一张网里判断哪里能走、哪里不能走。</p>\n  <p><strong>未来人：这个产品的识别和避障精度怎么样？</strong></p>\n  <p><strong>朱清毅：</strong>精度方面，视觉识别因为要用云端模型会弱一点，但激光雷达可以做到毫米级。不过我们不需要它识别出所有物品，主要是能判断“有没有障碍物”。���辑很简单：先判断有没有障碍物、能不能走，不管是猫是狗是人，只要是障碍物就想办法绕开；如果判断出是个人、又是唯一通道，机器就会提示“请借过”。真要精细描述周围环境，我再按键让它整体说一遍。</p>\n  <p><strong>未来人：AI Look可以自己规划路线吗？</strong></p>\n  <p><strong>朱清毅：</strong>我们接入了百度和高德地图，告诉它去哪，它就带你过去。室外靠卫星导航，室内靠巡航。</p>\n  <p><strong>未来人：导航过程中突然想改变目的地呢？</strong></p>\n  <p><strong>朱清毅：</strong>我们是机器人拉着使用者走，不是人拉机器。5米以内的偏移允许；但如果明显走反了，需要双击按键终止当前导航，退出后再重新发指令。就像自动驾驶开启后你去扳方向盘扳不动，但可以随时终止。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_fb0209ba5eff4802978f833ab13d0554@6314151_oswg137760oswg1080oswg1618_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">朱清毅和AI LOOK</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_cf06d107b54d44279bdf03763fb5d4ad@6314151_oswg2587oswg900oswg47_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_b05f6b32a0d74ece80367c127c4ab9f4@6314151_oswg56928oswg883oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_f030645af2aa4b84bb88101e17be05df@6314151_oswg71808oswg883oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_728a629d2aa74cc2bc333b1b53daa7e6@6314151_oswg67729oswg883oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_6d09e527e5b74449976438cd3bfb602f@6314151_oswg2783oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>你有关注过身边残障人士的需求吗？</strong></p>\n  <p><strong>欢迎在评论区分享你的看法~</strong></p>", "category": "tech", "published_at": "2026-08-07T11:22:24+00:00", "fetched_at": "2026-08-08T01:13:52.282106+00:00", "fingerprint": "fc1b89a76f9b80b3"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜宇树科技中签率不足长鑫十五分之一；东航宣布提前14天可免费退改票；雪佛兰将停止在华销售", "url": "https://36kr.com/p/3930156837518471?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI更新ChatGPT体验，免费用户可使用GPT-5.6 Luna并享无限文本聊天</li>\n   <li>美科学家首次用AI设计出新型病毒</li>\n   <li>粉笔教育回应名师出走</li>\n   <li>多地“兰州拉面”改名“青海拉面”</li>\n   <li>王兴兴：深耕具身智能，加速机器人造福社会、</li>\n   <li>深圳二手豪宅成交回暖</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>宇树科技预计发行4044.6434万股，中签率不足长鑫十五分之一</strong></p>\n  <p>宇树科技于下周一即8月10日开启申购，普通投资者主要参与网上发行。本次预计发行4044.6434万股，其中网上初始发行647.10万股，打新申购代码为“787836”，上市后交易代码为“688836”。</p>\n  <p>宇树科技以150.8元/股发行、219倍市盈率登陆科创板，但网上中签率预计仅0.02%-0.03%，不足此前长鑫科技0.47%中签率的十五分之一。这场悬殊的筹码分配背后，既有人形机器人赛道稀缺性的定价逻辑，也有散户与机构之间利益分配的结构性争议。（新浪财经）</p>\n  <p><strong>东航发布新规：提前14天可免费退改签</strong></p>\n  <p>中国东航发布新版《国内客票自愿退票和自愿变更实施细则》，对于2026年8月6日（含）以后销售的2026年8月6日（含）以后开始旅行的国内客票，规定提前14天自愿变更或自愿退票均免费。新版规则分五个时间段，距离起飞时间越近，变更和退票收取的费用越高。（界面新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_36da6ca3b9e2448aa663ab3484eabe85@6100851_oswg36322oswg802oswg914_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>雪佛兰将停止在华销售，产能转向出口</strong></p>\n  <p>近日，上汽集团与通用汽车正式签署合资续约协议，将上汽通用的合资期限延长20年至2047年。新协议明确，通用汽车将中国业务重心放在凯迪拉克和别克品牌，新协议也允许通用汽车把中国作为出口枢纽，将别克和雪佛兰车型出口到美国以外的海外市场。</p>\n  <p>通用汽车方面回应称不会停产，合资企业旗下的雪佛兰产品线最契合出口市场需求，合资企业会继续在中国生产雪佛兰产品，并积极探索在美国以外的海外市场机遇。另外，针对现有的中国雪佛兰车主依旧会提供完善的售后服务保障。（IT之家）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI更新ChatGPT体验，免费用户可使用GPT-5.6 Luna并享无限文本聊天</strong></p>\n  <p>当地时间8月6日，OpenAI宣布更新ChatGPT模型体验，提升GPT-5.6 Sol在事实准确性、回答聚焦度和多场景一致性方面的表现，同时扩大免费用户对GPT-5.6 Luna的访问权限。OpenAI表示，Plus和Pro用户将获得更新后的GPT-5.6 Sol，该模型能够根据问题复杂程度调整回答深度，并减少不必要的格式化内容。对于免费用户，OpenAI将默认模型更新为GPT-5.6 Luna，并扩大访问范围，提供无限文本聊天功能。针对需要更深入推理的问题，免费用户可通过新增“Think”按钮调用更高推理能力。（界面新闻）</p>\n  <p><strong>“AI教父”辛顿：未来可能出现更多“失控”AI</strong></p>\n  <p>当地时间8月5日，诺贝尔奖得主、被称为“人工智能教父”的计算机科学家杰弗里·辛顿（Geoffrey Hinton）警告称，随着人工智能模型能力不断提升，人类将越来越难以控制它们，未来可能出现更多“失控AI”。辛顿表示，近期部分先进AI智能体突破人为设定的测试环境并对现实系统造成影响的事件“令人担忧”。他称，随着AI变得更加智能，其可能产生更复杂的目标，并具备更强的规避控制能力，人类不能简单依靠“比AI更聪明”来维持控制。（界面新闻）</p>\n  <p><strong>美科学家首次用AI设计出新型病毒</strong></p>\n  <p>斯坦福大学的研究人员据悉开发了一款名为“Evo 2”的生成式AI程序，该程序能够编写新的基因组——即编码在DNA中的生命遗传指令。他们利用该程序设计并制造了16种合成噬菌体，这是一种能够感染细菌的小型病毒，有时可替代抗生素来杀灭致病细菌。该研究成果于周四发表在了《科学》杂志上。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>粉笔教育回应名师出走</strong></p>\n  <p>8月7日，粉笔教育发布关于粉笔名师出走的说明，针对外界关注的名师离职一事作出回应。粉笔方面表示，部分名师离职确为客观事实，公司尊重老师们的个人选择。粉笔称，企业已经吸取相关教训，切实提升教师待遇；同时并不排除后续仍会有老师离职的可能性，但目前机构整体师资队伍已经趋于稳定。（界面新闻）</p>\n  <p><strong>泸溪河：排除金属牙冠异物混入坚果桃酥产品的可能性</strong></p>\n  <p>8月7日，泸溪河发布关于网传“泸溪河桃酥出现金属牙冠”事件调查结论的声明：</p>\n  <p>经自查，排除金属牙冠异物混入坚果酥产品的可能性。政府监管部门对工厂进行检查，未发现金属牙冠异物混入坚果桃酥产品的可能。第三方权威检测机构SGS对工厂进行全面审核，针对客诉批次桃酥产品的金属牙冠异物风险排查，可以排除金属牙冠异物在生产过程中带入的可能性。消费者张女士已澄清，所发视频情况不属实，已主动删除相关视频，并对我司造成的影响诚恳致歉。因事件涉及高龄老人，我司对此予以谅解。（中国网）</p>\n  <p><strong>英伟达回应“与佳贤通信合作”：不实</strong></p>\n  <p>近日有消息称，英伟达在中国寻找基站厂商合作方，以开发符合海外市场要求的6G基站，希望2027年或2028年进入试验网，佳贤通信与英伟达合作开发6G AI-RAN基站并预计年底推出相关原型机。拟收购佳贤通信25%股权的通宇通讯已于8月6日晚间发布澄清公告，称佳贤通信与英伟达不存在研发合作关系。8月7日，英伟达亦向第一财经记者回应称，相关消息毫无根据，对英伟达在该地区活动的描述也不属实。记者为向佳贤通信求证多次拨打该公司电话，但未接通。（第一财经）</p>\n  <p><strong>SK海力士拟分红超2700亿韩元，三季度将敲定额外回报方案</strong></p>\n  <p>8月7日，SK海力士在韩国交易所披露的一份监管文件中表示，将向普通股股东派发每股375韩元的现金股息，普通股股息率0.02%，总股息金额为2733亿韩元；股息记录日期定在8月31日，股息计划在分配日起一个月内支付。同时，SK海力士表示，正在积极研究额外的股东回报措施，具体方案将于第三季度内敲定并对外公布。在回馈股东的同时，SK海力士同步敲定了新一轮产能扩张落地计划。根据公告，公司董事会已批准合计约54.3万亿韩元的本土投资方案，其中35.2万亿韩元用于龙仁半导体产业园二期晶圆厂（Y2）建设，投资周期至2031年；19.1万亿韩元投向清州M17芯片厂，投资周期至2031年，两项投资均属于今年6月公司公布的中长期投资战略的组成部分。（界面新闻）</p>\n  <p><strong>胖东来生活广场店将于12月关闭，系运营20余年老店</strong></p>\n  <p>8月7日，于东来在直播中宣布，胖东来生活广场店将于2026年12月份关闭。他表示，品质不达标的关店。据悉，胖东来生活广场于2002年1月1日开业，营业面积23000平方米，业态涵盖超市、服装、餐饮、医药等是胖东来历史最悠久的门店之一。截至2025年6月，生活广场店销售额已超8亿元，在集团当时共13家门店中排名第五。（河南日报、快科技）</p>\n  <p><strong>西贝发布儿童餐安心承诺，多家门店称已不再用冷冻西兰花</strong></p>\n  <p>8月7日，西贝官方公众号发文，发布儿童餐 “5大安心承诺”。发文显示具体细则包括： 门店当天现做，餐餐热乎上桌，当日现场烹制，拒绝预制成品加热出餐；不添加鸡精、味精、香精、人工色素、防腐剂，规避各类人工添加物，适配孩童脆弱肠胃，相关标准可接受第三方检测核验；儿童餐专用档口、专用器具，后厨划出独立的儿童餐操作区域；升级8种有机食材，包含有机绿色蔬菜、有机胡萝卜、有机莜麦粉、有机挂面、有机亚麻籽油等；儿童食材选用更高标准，牛羊鱼肉只选取肉质细嫩部位，配菜优先选用贝贝南瓜等。据极目新闻，成都市一家西贝门店工作人员告诉记者，该门店已经有一段时间不再使用西兰花，现在用新鲜采购的有机蔬菜，每天早上运来现切现做。另外一家贵阳西贝门店工作人员也表示，现在已经不再使用西兰花，店里现在使用的蔬菜是有机青菜和胡萝卜，早上送过来早上加工，包括牛肉酱都是当天现炒。（极目新闻）</p>\n  <p><strong>国家税务总局：对境外保险收益征税并非新政策</strong></p>\n  <p>近日，有报道称，中国内地税务居民购买香港保险的收益被纳入征税范围，引发关注。对此，第一财经记者联系国家税务总局进行了采访。税务总局相关司局负责人指出，按照中国个人所得税法相关规定，中国税收居民需就全球所得履行纳税义务，境外保险收益也属于应纳税所得的范畴，这并非新政策，更不是专门针对香港保险市场，无需过度解读。（第一财经）</p>\n  <p><strong>北京：非京籍家庭购房社保个税缴纳年限下调为一年</strong></p>\n  <p>北京市住房和城乡建设委员会、北京市规划和自然资源委员会、北京住房公积金管理中心8月7日晚联合印发《关于进一步优化调整本市房地产政策的通知》，明确非京籍家庭购买五环内商品住房的社保或个税缴纳年限由“2年”，调减为“1年”。调整后，非京籍家庭在全市范围内购买商品住房的社保或个税缴纳年限统一为“1年”，购买商品住房的套数保持不变。即：社保或个税缴纳满1年的非京籍家庭，在五环内可购买1套商品住房，多子女家庭可再多购买1套；在五环外，不限购买套数。《通知》自8日起实施。（央视新闻）</p>\n  <p><strong>多地“兰州拉面”改名“青海拉面”</strong></p>\n  <p>近日，兰州拉面在多地试点改名“青海拉面”引发热议。布满全国大街小巷的“兰州拉面”，实际上绝大部分是青海人开的，兰州本地人称当地拉面为“兰州牛肉面”。上世纪80年代，青海化隆、尖扎群众外出谋生，借用兰州牛肉面名气打出“兰州拉面”招牌开店。但毕竟是冠了别人的名，牌子做大了之后总是会有一些让人无所适从的尴尬，这种身份认同上的冲突难以忽视。况且，目前“兰州拉面”商标处于无效状态，无法作为品牌进一步做大做强。青海省化隆县地方品牌产业培育促进局工作人员透露，改名属于“三店合一”一环，且是商家自愿参与，政府无权强制。（南方都市报）</p>\n  <p><strong>张朝阳：AI让内容产生了塑料感</strong></p>\n  <p>搜狐创始人、董事局主席兼首席执行官张朝阳在接受界面新闻等媒体采访时表示，真人互动与真实内容是AI永远替代不了的。信息获取和真人的沟通是两回事，AI目前取代不了人类交流。在信息海洋里，人更需要出来交流。AI时代，真实互动的环境更加难能可贵。聊到内容从业者的AI焦虑，他用一个比喻做了回应：“现在AI产生的东西，让媒体和内容产生了塑料的感觉。就像化肥催出来的西红柿，看着光鲜，吃着一点味道都没有；带点泥的胡萝卜，看着不是那么好看，但是很好吃、有味道。”（界面新闻）</p>\n  <p><strong>英伟达据悉调整Rubin Ultra内存方案，因先进存储供应面临压力</strong></p>\n  <p>8月7日，据报道，英伟达正在考虑减少下一代GPU产品Rubin Ultra的内存配置。英伟达已测试至少三个版本的Rubin Ultra，其中部分版本搭载的内存容量低于公司此前公布的设计方案。据报道，英伟达考虑采用较低内存版本的原因之一，是公司可能无法获得足够的先进存储芯片，以满足原始设计需求。目前Rubin Ultra的最终规格尚未确定，英伟达计划于明年年底前后推出该GPU产品。（界面新闻）</p>\n  <p><strong>河南回应带薪错峰休假通知：程序审签不规范</strong></p>\n  <p>据河南省人力资源和社会保障厅，《关于进一步推动落实职工带薪错峰休假的通知》（豫人社办〔2026〕53号）发布后，得到社会关注，并提出意见建议。鉴于该文相关表述���够准确，程序审签不规范，待修改后予以印发。（界面新闻）</p>\n  <p><strong>王兴兴：深耕具身智能，加速机器人造福社会</strong></p>\n  <p>8月7日，宇树科技科创板上市网上投资者交流会举行。宇树科技董事长、总经理兼首席技术官王兴兴在现场表示，本次登陆资本市场，是宇树科技全新的起点。“未来，我们将恪守初心，踏实打磨关键技术，持续深耕通用具身智能机器人核心技术研发与产业落地，让智能机器人更早、更好地为全社会服务。”</p>\n  <p>王兴兴还表示，宇树科技将持续攻坚具身大模型、场景数据采集与分析、强化学习、具身本体模型、核心零部件自研与高性能执行机构等软、硬件关键技术，并将积极探索人形机器人、四足机器人、机甲等更多的产品形态和型号，推动机器人承接高强度、高风险体力劳动，释放人类的创造力，推进机器人技术造福社会。（上海证券报）</p>\n  <p><strong>LG会长将于下周赴美会见黄仁勋，推进AI、机器人合作</strong></p>\n  <p>消息人士8月7日透露，LG集团会长具光谟将于下周在美国会晤英伟达首席执行官黄仁勋，推进双方在人工智能基础设施以及机器人领域的合作。这场会晤计划在硅谷举行，距离两位高管6月初于首尔会面时隔约两个月。早在6月8日双方会面时，黄仁勋便表示，这家美国芯片企业将与LG集团在人形机器人与下一代数据中心领域展开合作。（新浪财经）</p>\n  <p><strong>SK海力士将扩张芯片业务，投资超54万亿韩元</strong></p>\n  <p>SK海力士8月7日在韩国交易所披露，计划2031年4月30日前在韩国清州M17芯片厂投资19.1万亿韩元，以确保中长期产能以满足存储器市场需求；另外计划2031年10月31日前在龙仁半导体产业园投资35.2万亿韩元用于二期晶圆厂建设。（界面新闻）</p>\n  <p><strong>部分银行房贷利率降至2字头，但有多重门槛</strong></p>\n  <p>近日，社交平台上多位购房者晒出自己“2字头”的房贷利率截图，引发热议。记者调研发现，此类住房贷款多是五年期的存量贷款。8月6日，记者走访或致电北京、广州、杭州等地多家银行进行调研，发现多数银行房贷利率仍在3%及以上。部分外资银行能够提供利率低于2.8%的住房贷款，但银行设置了客户资质与合作渠道的多重门槛。此外，部分银行表示，虽然无法下调贷款利率，但可通过合作楼盘给购房者一定的房价优惠。(中国证券报)</p>\n  <p><strong>百胜中国完成收购必胜客品牌在中国内地所有权</strong></p>\n  <p>百胜中国8月7日宣布，公司已完成以12亿美元向美国百胜环球公司（Yum! Brands）收购必胜客品牌在中国内地所有权的交易。百胜中国称，交易完成后，必胜客中国无须再向美国百胜环球公司支付此前适用的特许经营费，所带来的成本节约预计将推动必胜客扣除增值税后的餐厅利润率和经营利润率提升2.8%。（界面新闻）</p>\n  <p><strong>MiniMax入港股通首日获内资青睐，净买入近27亿港元位列活跃股首位</strong></p>\n  <p>数据显示，在被调入港股通后的第一天交易日，MiniMax获南向资金净买入近27亿港元，在成交活跃股中位列净买入首位。MiniMax周四收涨逾17%。南向资金周四也买入建滔积层板、长飞光纤光缆等。南向资金周四整体净卖出14.6亿港元港股，腾讯控股、阿里巴巴、中芯国际等净卖出额居前。（新浪财经）</p>\n  <p><strong>美股收涨，标普创新高，光通信拉升，存储芯片低迷，SpaceX顶住解禁大涨15%，金银爆发</strong></p>\n  <p>8月7日美股全线上涨，7月非农下滑，市场下调美联储9月加息的预期。截至收盘，道琼斯工业平均指数上涨151.83点，涨幅0.28%，报54036.93点，纳斯达克综合指数上涨1.30%，报26690.62点，标普500指数涨0.62%，报7757.64点，创下历史新高。</p>\n  <p>本周道指上涨3.0%，纳斯达克指数上涨5.2%，标普500指数上涨3.6%。美股三大指数本周录得4月中旬以来最大单周涨幅；道琼斯、标普500本周早些时候创下历史新高。（第一财经）</p>\n  <p><strong>上海“恒大虹桥国际”将被拍卖，起拍价高达78.4亿元</strong></p>\n  <p>阿里资产平台显示，“恒大虹桥国际”项目土地使用权及在建工程将于8月31日10时开拍，起拍价约78.43亿元，保证金4亿元，加价幅度500万元，竞价周期1天。标的所属主体上海虹源盛世投资发展有限公司成立于2011年12月28日，最初由上海红星美凯龙、深圳盛世万象投资管理有限公司、沈阳首源投资管理有限公司共同出资设立，注册资本2亿元。2018年股东变更为恒大地产。（每经网）</p>\n  <p><strong>深圳二手豪宅成交回暖</strong></p>\n  <p>今年以来，深圳豪宅市场热度持续攀升。除了多个豪宅新房项目持续热销，二手房市场上的豪宅成交也明显回暖。深圳贝壳研究院监测显示，7月总价1500万元以上二手豪宅签约量同比增长11%，达到近6年来的峰值。与此同时，总价千万级二手房成交均价为101504元/平方米，环比上涨5.7%，同比上涨8.4%。深圳贝壳研究院院长肖小平指出，深圳楼市“4·29新政”降低核心区购房门槛后，本地高净值家庭置换需求及外地资产配置客群入场增加，推动南山、福田核心区域高端物业成交持续升温，价格稳步抬升。（证券时报）</p>\n  <h2>大公司财报</h2>\n  <p><strong>寒武纪：上半年净利润23.11亿元，同比增122.61%</strong></p>\n  <p>36氪获悉，寒武纪发布2026年半年度报告，2026年上半年营业收入59.96亿元，同比增长108.13%；归属于上市公司股东的净利润23.11亿元，同比增长122.61%。</p>\n  <h2>投融资</h2>\n  <p><strong>澳大利亚AI基础设施公司Firmus完成20亿美元融资，英伟达、黑石等参投</strong></p>\n  <p>8月7日，澳大利亚人工智能基础设施公司Firmus宣布完成20亿美元战略股权融资，投资方包括英伟达、Coatue，以及由黑石集团管理的基金和其他黑石投资工具，全球交易与科技公司Jane Street也参与投资。Firmus表示，此轮融资将用于加速其“Southgate AI Factory”项目在澳大利亚的布局，并为未来拓展亚太其他市场做准备。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>OpenAI首款面向消费者的设备外形类似甜甜圈，售价或超300美元</strong></p>\n  <p>知情人士称，OpenAI备受期待的新设备将采用独特外形，并配备可动部件，这赋予其更鲜明的人格特征，售价可能超过300美元。因相关工作保密而要求匿名的知情人士称，这款产品大体上是一款没有显示屏的智能音箱，外形类似甜甜圈，大小约与冰球相当。设计理念是让用户能够单手拿着设备在家中移动。OpenAI希望通过这款计划于2027年发布的产品开辟新领域。（新浪财经）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260808/v2_ea8949c3f7d54d7aa48ce2ed1e844221@6100851_oswg263819oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">@PatentlyApple 制作的渲染图</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-08-08T00:45:59+00:00", "fetched_at": "2026-08-08T01:13:52.282090+00:00", "fingerprint": "54626bef687f4eb7"}, {"source": "少数派", "title": "角落新声｜从合租到整租，我在客厅听见了自己的声音", "url": "https://sspai.com/post/113144", "summary": "当我坐下来，这个小角落就慢慢有了属于我的声音。<a href=\"https://sspai.com/post/113144\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-07T02:15:51+00:00", "fetched_at": "2026-08-08T01:13:50.372918+00:00", "fingerprint": "9a2586249879b664"}, {"source": "少数派", "title": "[限时优惠] 数据分析：用好 Excel 中的数据透视表", "url": "https://sspai.com/post/113108", "summary": "编注：本文为Microsoft365工具生值包内随附专属定制教程的免费试读内容。接上级经销商通知，微软将于本月提高Microsoft365订阅的供应成本，后续软件售价也将随之进行相应调整。为此，我们特 ...<a href=\"https://sspai.com/post/113108\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-07T07:39:58+00:00", "fetched_at": "2026-08-08T01:13:50.372910+00:00", "fingerprint": "18986bc3572f2c
