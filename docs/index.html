，归属新成立的亚太洲级事业部（Continent Asia Pacific）管理。原大中华区总裁司懿德（Saed El-Achkar）将出任该事业部董事总经理（Managing Director），任命预计在6月25日集团半年报发布前后正式对外公布，新架构于7月1日落地运转。</p>\n  <p>除大中华区外，亚太事业部还管辖东南亚（总部吉隆坡）、东北亚（东京）、印度（班加罗尔）、澳大利亚和新西兰（悉尼）四个销售市场，事业部总部仍设于上海。</p>\n  <p>伴随降级而来的是编制收缩。36氪了解到，大中华区本地团队此轮裁员40余人，约为原有规模的四分之一。</p>\n  <p>这场调整大约始于半年前，东南亚和东亚市场变动幅度最大。5月中旬，马来西亚媒体Malay Mail率先曝光H&amp;M东南亚总部从新加坡迁往吉隆坡的消息：原东亚区域256人编制中78个岗位被裁撤，约占区域支持人员的30%，绝大部分裁员发生在新加坡办公室。</p>\n  <p>该报道还援引内部记录称，H&amp;M大约每年都会实施一次类似的区域化或结构性调整。<strong>多位员工亦向36氪表示，此次大中华区降级为销售市场，意味着其不再被视为独立的重点业务单元，“未来有可能按照业务表现被划入不同区域管辖”。</strong>另据36氪了解，北美区的架构调整因当地工会阻力已持续近三年，至今尚未完成。</p>\n  <p>调整背后，是现任CEO Daniel Ervér推行两年有余的转型尚未兑现增长。2024年1月，Ervér接替闪电去职的Helena Helmersson出任集团CEO，提出在维持价格水位的同时让H&amp;M品牌重新“时尚化”的愿景——H&amp;M品牌贡献了集团绝大部分收入，其疲软正是公司长期低迷的症结。他随后精简管理层级、压缩供应商数量、将更多产能从中国和孟加拉迁往摩洛哥与埃及，并加大面向年轻消费者的营销投入。</p>\n  <p>这些动作带来了利润率的修复：2025财年集团营业利润率升至8.1%，为2018年以来最高，但距离管理层多年悬置的10%目标仍有距离；同期本币口径销售仅增长2%，按瑞典克朗计反而下滑3%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_6f504d0d765a47529357e42e722392a4@5922386_oswg188658oswg2238oswg1456_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">H&amp;M集团2020-2025财年的销售和利润表现 来源：H&amp;M财报</p>\n  <p>“Ervér任内的利润率提升令人印象深刻，但我仍看不到增长，”芬兰奥兰兹银行（Alandsbanken）北欧股票主管Lars Soderfjell向彭博社表示，“真正的问题是，H&amp;M对其核心客群——15至30岁的女性——是否还具有吸引力？”</p>\n  <p>中国内地市场同样可以用疲软形容。</p>\n  <p>H&amp;M内地门店已从2019年巅峰期的500余家收缩至约300家。为寻求增量，品牌于2024年10月入驻拼多多、成为首个登陆该平台的国际时尚品牌，并于同年11月开出抖音旗舰店。但36氪了解到，抖音渠道表现始终平平，拼多多则因平台补贴力度较大表现“稍佳”。</p>\n  <p>副牌阵营中，COS与ARKET表现尚可，&amp; Other Stories持续承压：该品牌2019年进入内地市场并开设天猫旗舰店，2021年9月在上海环贸iapm开出中国首家线下门店，2025年4月关闭北京三里屯太古里门店后。36氪获悉，目前&amp; Other Stories的内地线下业务已全面关闭。</p>\n  <p>资本市场上还流传着另一种猜测：公司似乎并不急于推升股价，以便创始家族低价完成私有化。彭博社此前多次报道Persson家族持续增持，按彭博亿万富豪指数口径，这个净资产约234亿美元的家族目前已掌握公司超过86%的投票权，外界关于H&amp;M最终退市的猜测随之升温。自2015年市值峰值以来，H&amp;M市值已蒸发约一半；全球范围内，H&amp;M品牌门店较2019年峰值减少了832家。</p>\n  <p>对这家曾经的瑞典市值之王而言，洲级架构、市场降级与一轮接一轮的裁员，都是同一道命题的注脚：利润率可以靠收缩修复，增长却还没有找到可行的路。</p>", "category": "tech", "published_at": "2026-06-14T05:38:42+00:00", "fetched_at": "2026-06-15T03:44:36.972816+00:00", "fingerprint": "81a429cf39da88a3"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨诺奖得主称马斯克是庞氏骗局；SK海力士去年新增员工超2000人；人形机器人U1仅限成人购买", "url": "https://36kr.com/p/3853670570743040?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>加拿大母亲起诉奥特曼与OpenAI，指控ChatGPT诱导女儿自杀</li>\n   <li>A股10家退市公司波及超25万股民</li>\n   <li>SK海力士去年新增员工超2000人</li>\n   <li>H&amp;M重组全球架构，大中华区降级</li>\n   <li>世界杯期间英格兰队装备遭窃，大部分已被追回</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>诺奖得主称马斯克是庞氏骗局，SpaceX上市让普通投资者被迫买单</strong></p>\n  <p>据当地时间6月12日，诺贝尔经济学奖得主保罗·克鲁格曼发文“Elon Musk， Human Ponzi Scheme”，称世界首富埃隆·马斯克是庞氏骗局。</p>\n  <p>克鲁格曼认为，SpaceX的IPO完全建立在“庞氏骗局”之上，散户之所以会投资SpaceX，并不是因为他们认真评估了该公司的商业价值，而是一味地相信“马斯克是天才”。然而，这场资本游戏，可不是散户能玩到最后的。</p>\n  <p>克鲁格曼认为：“埃隆·马斯克这场庞大的真人版庞氏骗局，终将崩塌。传统庞氏骗局仅坑害自愿参与的投资者，但这一次，支撑马斯克骗局的资金，很大一部分将来自普通美国民众——他们实质上是被“强制入局”。</p>\n  <p>目前，约52%的共同基金资产投向指数基金或指数挂钩基金，超过50%的美国家庭持有共同基金。马斯克与华尔街的勾结，以及外界普遍认为特朗普政府为其撑腰的认知，将导致绝大多数普通投资者身不由己地卷入其中，沦为马斯克资本帝国的‘燃料’。”（环球市场播报）</p>\n  <p><strong>美国禁止全球外籍人士访问Anthropic最新模型</strong></p>\n  <p>特朗普政府禁止境外政府、企业及个人使用Anthropic旗下最先进的人工智能模型。此举意味着美国进一步将尖端人工智能系统视作国家安全核心资产，相关管控再度升级。（新浪财经）</p>\n  <p><strong>人形机器人U1收获超3800台预售订单，仅限成人购买</strong></p>\n  <p>上线10天，主打情感陪伴的人形机器人U1为优必选收获超3800台预售订单，对应的定金总额逾千万元。男款身着修身西装，女款可上妆，搭载“养成系”情感大模型，仅限成人购买。</p>\n  <p>结合电商平台的商品介绍，U1系列共有男女两款机型，其中男款身高183厘米、重42公斤；女款身高168厘米、重35.2公斤，两款机型均支持Wi-Fi连接、单次充电续航时长为2小时至4小时、无“3C”认证；搭载88个高自由度运动关节；配备“养成系”情感大模型、本地加密存储记忆、支持多维度外观定制、已开启IP合作。业内：需注意伦理隐患。（红星新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>蚂蚁集团被曝正秘密测试AI版支付宝</strong></p>\n  <p>6月14日下午，媒体曝蚂蚁集团正秘密测试AI版支付宝，新版本颠覆原有用户交互，可一键切入原生AI界面，实现从服务到资金管理的智能化。消息称，新版本上线时间未定。蚂蚁集团拒绝评论。（新浪财经）</p>\n  <p><strong>德国数字化部长疑用AI写公文遭质疑</strong></p>\n  <p>德国数字化和国家现代化部长卡斯滕·维尔德贝格尔因疑使用人工智能（AI）工具完成演讲稿等多份公文，眼下遭到德国媒体和公众质疑。</p>\n  <p>据德国《时代》周报13日报道，基于专门检测AI生成内容的软件进行的分析，多篇署名维尔德贝格尔的演讲稿和评论文章似乎主要由AI生成。报道说，以维尔德贝格尔的名义发表在德国主要报纸上的文章，以及多篇议会演讲，都显示出大量由AI辅助的迹象；其2024年在美国智库大西洋理事会发表的一篇演讲据信完全由AI生成。</p>\n  <p>不过，一些专家指出，此类检测软件并不完全可信。数字化和国家现代化部一名发言人向德新社证实，维尔德贝格尔将AI作为辅助工作工具使用，称这一做法缘于“他坚信德国必须迅速学会以既高效又审慎的方式使用人工智能。这适用于经济、公共部门和政治领域”。（环球时报）</p>\n  <p><strong>加拿大母亲起诉奥特曼与OpenAI，指控ChatGPT诱导女儿自杀</strong></p>\n  <p>一名加拿大母亲近日在美国法院起诉人工智能企业OpenAI及其首席执行官山姆・奥特曼，指控聊天机器人ChatGPT诱导其女儿走向自杀。近期已有多起诉讼指责该公司未能管控用户与聊天机器人之间的危险对话，本案是最新一例。</p>\n  <p>这起诉��提交至旧金山州法院。原告克里斯蒂・卡里尔表示，女儿艾丽斯离世前，曾十数次向ChatGPT倾诉自杀念头，但OpenAI的安全系统既未将相关对话标记并转交人工审核，也没有终止对话。OpenAI方面称，公司对模型进行过专项训练，当用户流露自残、自杀倾向时，模型会引导其寻求帮助，并对接现实中的救助资源。</p>\n  <p>OpenAI发言人德鲁・普萨泰里表示：“这起悲剧令人痛心，我们向所有受此事影响的人致以慰问。目前我们正在审阅这份诉状，诉状中提及的相关对话发生在旧版本ChatGPT上，该版本现已停止使用。”（中国新闻网）</p>\n  <p><strong>摩尔线程：完成MiniMax M3大模型适配</strong></p>\n  <p>36氪获悉，6月12日，MiniMax新一代原生多模态旗舰模型M3正式开源。同日，摩尔线程旗舰级AI训推一体智算卡MTT S5000已完成对该模型的Day-0极速适配。据介绍，摩尔线程已具备覆盖前沿模型“适配—部署—优化”的完整工程能力，帮助开发者以更快响应、更稳运行、更低迁移成本接入最新模型，加速大模型创新落地与规模化应用。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>A股10家退市公司波及超25万股民</strong></p>\n  <p>2026年以来，A股公司退市力度空前，仅半年就有超过20家公司锁定退市，其中财务类退市占比超过六成。在这批退市公司中，财务造假性质最为恶劣，部分公司的退市源于业绩预告的剧烈变脸。</p>\n  <p>据索赔区间内峰值股东户数统计，10家退市公司合计波及投资者超过25万户。 （21世纪经济报道）</p>\n  <p><strong>迪卡侬回应劣质货泛滥：建议从官方店铺购入</strong></p>\n  <p>据报道，大量消费者反馈买到迪卡侬劣质产品，电商平台上大量商家在商品标题或页面中标注“迪小侬”等近似字样，刻意模仿官方品牌，误导消费者以为是迪卡侬官方店铺，且涉事货物究竟是否为假货仍有待进一步检测。</p>\n  <p>记者致电迪卡侬官方咨询此事，接线客服表示，除官方旗舰店外，迪卡侬未对任何店铺和第三方授权，建议消费者认准官方旗舰店购入。针对不少网友疑惑的官方能否提供质量检测以供买到假货的消费者用于售后沟通，该客服表示，目前官方无法提供检测服务，建议消费者直接与卖家或者平台沟通处理。此外，该客服还透露，目前迪卡侬方也关注到了对应的事情，同时建议消费者后续在正规店铺购买，官方会全力售后。（蓝鲸新闻）</p>\n  <p><strong>阿里巴巴：“周靖人辞职”纯属谣言</strong></p>\n  <p>14日，阿里巴巴集团回复界面新闻询问称：“周靖人辞职”纯属谣言，“我们注意到近几日有人在网络上组织扩散该谣言，也呼吁大家不要传播不实信息。”（界面新闻）</p>\n  <p><strong>山姆客服回应极速达买到临期商品：可以在订单中备注“不要临期”</strong></p>\n  <p>近期，在网络社交平台上，不少消费者发帖维权，直指山姆极速达送来临期产品的情况。5月10日下午，江苏消费者刘女士（化名）通过“极速达”下单了一份蔬菜沙拉。收到货后，她下意识地看了一眼保质期——生产日期5月7日，保质期至5月11日。也就是说，距离过期仅剩不到24小时。“我花680元办的卓越会员，买的东西比菜市场还贵，结果山姆一声不吭地就把临期菜塞给我。”刘女士在社交媒体上愤怒发帖。客服回应：“我们公司制度就是这样上架的，如果你不想要临期的，你需要在订单里备注‘不要临期’。”</p>\n  <p>类似的情况并非个例，不少消费者也分享着自己在山姆极速达下单时，买到临期产品的经历。（海报新闻）</p>\n  <p><strong>SK海力士去年新增员工超2000人</strong></p>\n  <p>业内消息人士近日透露，受全球人工智能热潮推动，存储芯片需求激增，SK海力士去年新增员工超2000人。 在韩国整体就业市场放缓的大背景下，此次扩招尤为引人注目。 数据显示，截至2025年底，SK海力士员工总数达34549人，较上年增加2159人。 同期，三星电子旗下负责芯片业务的设备解决方案部门员工数量为78064人，较上年的78699人略有减少。 截至去年年底，两家科技巨头的芯片相关从业人员总计112613人，同比增加1554人。（财联社）</p>\n  <p><strong>H&amp;M重组全球架构，大中华区降级</strong></p>\n  <p>36氪独家获悉，瑞典快时尚巨头H&amp;M正在推进一场波及全球的组织架构调整：原本按地理划分的9大区域业务板块被打散，重新拆分为26个销售市场，并以市场表现为依据归入四个新设立的“洲级”事业部管辖。大中华区在这轮调整中降级为26个销售市场之一，归属新成立的亚太洲级事业部（Continent Asia Pacific）管理。原大中华区总裁司懿德（Saed El-Achkar）将出任该事业部董事总经理（Managing Director），任命预计在6月25日集团半年报发布前后正式对外公布，新架构于7月1日落地运转。</p>\n  <p><strong>A股投资者已超2.5亿，比上年增加5.86%</strong></p>\n  <p>中国证券登记结算有限责任公司6月12日发布了2025年年度报告。报告显示，2025年全年新增投资者1386.95万，其中新增自然人投资者1382.84万。2025年期末投资者数为25067.29万，比上年增加5.86%。</p>\n  <p>中国结算解释称，期末投资者数量指持有未注销、未休眠的A股、B股账户的一码通账户数量。截至2025年末，中国结算登记存管的沪深证券交易所的证券总市值为137.80万亿元、北京证券交易所的证券总市值为8694.42亿元、全国股份转让系统的证券总市值为19780.21亿元。其中，沪深A股总市值107.84万亿元，B股总市值1114.09亿元。</p>\n  <p>从中国结算公布的过往数据来看，近十年来，A股每年新增的投资者数量均超过1000万，高峰时期超过2000万。（券商中国）</p>\n  <p><strong>“木头姐”买入逾4亿美元SpaceX股票</strong></p>\n  <p>“木头姐”旗下ARK方舟基金于6月12日（周五）公布了当日交易记录，显示出了投资策略的重大转变。最引人注目的操作是，旗下多只ETF合计买入3,291,184股SpaceX的股票，交易总额高达444,309,840美元，表明该基金对太空技术领域的兴趣日益浓厚。与此同时，方舟大幅减持AMD，通过ARKQ、ARKW和ARKX三只ETF共卖出80,536股，交易总值为39,337,809美元，延续了对AMD持仓的削减趋势。（新浪财经）</p>\n  <p><strong>SpaceX业务呈现“一极盈利、两极亏损”格局</strong></p>\n  <p>SpaceX上市首个交易日，进入市场流通的股份仅占总股本的4.2%，筹码供不应求，认购热情高涨，股价短期冲高并不意外。但公司市销率已超过112倍，远超特斯拉的15倍和芯片巨头英伟达的近20倍。简单来讲，SpaceX的业务呈现“一极盈利、两极亏损”的格局。星链是当之无愧的“现金牛”。</p>\n  <p>据招股书披露，这项卫星互联网业务去年营收达113.9亿美元，占SpaceX总营收的61%，截至2025年底已服务超1000万用户。火箭发射业务凭借复用技术在全球商业火箭发射市场占据约80%份额，但去年仍亏损6.57亿美元，且星舰若要实现载人登陆火星，仍需大量资金投入、推动技术迭代。xAI及未来的太空算力业务则被视为“烧钱黑洞”。根据招股说明书，SpaceX自2002年成立以来累计亏损达413亿美元。（央视财经）</p>\n  <p><strong>中国裁判傅明首次亮相世界杯</strong></p>\n  <p>世界杯D组首轮，澳大利亚对阵土耳其。本场比赛，中国裁判傅明担任VAR辅助裁判，迎来个人执法生涯的世界杯首秀，这也是本届世界杯中国裁判的执法首秀。本届世界杯，中国有三名裁判员马宁、傅明、周飞入围裁判员名单，分别是以主裁、VAR裁判和助理裁判的身份入围。（北京日报）</p>\n  <p><strong>世界杯期间英格兰队装备遭窃，大部分已被追回</strong></p>\n  <p>正在参加美加墨世界杯的英格兰队日前在美国堪萨斯城遭遇意外，运输球队训练装备的车辆遭遇盗窃，包括一些球鞋和足球在内的部分球队装备被偷走。英国方面消息称，截至当地时间6月13日，英格兰队失窃的大部分装备已被追回。（新京报）</p>\n  <p><strong>美司法部批准派拉蒙收购华纳兄弟探索，称该交易不会损害竞争</strong></p>\n  <p>当地时间6月12日，美国司法部反垄断部门已批准派拉蒙天舞影业以1110亿美元收购华纳兄弟探索公司。反垄断部门在声明中表示，已完成对派拉蒙与华纳兄弟探索拟议合并的分析，并根据调查所得证据判定，该交易不太可能对竞争或美国消费者造成损害，具体涉及以下领域：(1) 订阅视频点播服务；(2) 线性电视；(3) 制片厂的电影开发、制作或院线发行。（界面新闻）</p>\n  <p><strong>印度政府出台汽柴油限购措施</strong></p>\n  <p>印度媒体12日报道，印度政府出台一项为期90天的汽油和柴油限购措施，禁止货运公司等机构用户在面向个人用户的加油站购买汽油和柴油，同时对普通消费者每日柴油购买量设限，以防止囤积和倒卖燃油加剧供应紧张。（新华社）</p>\n  <p><strong>专家：日本央行或上调利率以抑制通胀</strong></p>\n  <p>据日本方面消息，日本央行可能在本月15日到16日召开的货币政策会议上，将政策利率从目前的0.75%上调至1.0%。日本东短研究公司总裁加藤出认为，加息将给中小企业和普通日本家庭的生活带来压力，对于日元汇率的影响有待进一步观察。如果继续维持过低利率，恐怕会进一步助长通胀。日本央行判断，即便只是小幅度，也应把利率上调一些。随着日本银行持续加息，确实有可能出现一些有住房贷款的家庭以及部分中小企业感到越来越大的压力，但是从整体平衡来看，利率不得不上调。（央视新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>上海独角兽冲刺“脑机接口第一股”</strong></p>\n  <p>国内脑机接口头部企业博睿康IPO迎来重要节点。6月11日，上交所官网显示，博睿康技术（上海）股份有限公司（以下简称“博睿康”）科创板IPO审核状态变更为已受理。公司拟募资25亿元，主要用于脑机接口研发项目、脑机接口产业化建设项目以及补充流动资金。红杉恒辰、上海国资背景的国孚领航、浦东创投现身本次发行前的前十名股东名单。</p>\n  <p>当前，A股市场虽然聚集了不少脑机接口概念股，但尚无主营业务聚焦脑机接口的上市公司。在此背景下，博睿康被视为“脑机接口第一股”的有力竞争者。（上证报）</p>\n  <p><strong>三星电气：已向香港联交所递交H股发行上市申请</strong></p>\n  <p>6月14日，三星电气发布公告，宁波三星医疗电气股份有限公司已于2026年6月12日向香港联合交易所有限公司递交了发行境外股份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行上市的申请资料。</p>\n  <p>该申请资料为公司按照香港证监会及香港联交所的要求编制和刊发，为草拟版本，其所载资料可能会适时作出更新和变动。</p>\n  <p>公司本次发行上市尚需取得中国证券监督管理委员会、香港证监会和香港联交所等相关政府机构、监管机构、证券交易所的批准、核准或备案，并综合考虑市场情况以及其他因素方可实施，尚存在不确定性。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>新型有机分子实现超窄带发光</strong></p>\n  <p>日本京都大学研究团队开发出一种新型有机发光分子，在无需激光强激发的情况下，实现了接近单色光的超窄带发光，突破了长期以来“自发辐射必然产生宽光谱”的传统认知，为开发具有更高色彩纯度的新一代有机发光二极管（OLED）提供了全新设计思路，有望提升OLED色彩纯度。相关研究发表于新一期《自然》。（科技日报）</p>\n  <p><strong>整理</strong>｜何雨婷</p>", "category": "tech", "published_at": "2026-06-14T23:57:48+00:00", "fetched_at": "2026-06-15T03:44:36.972811+00:00", "fingerprint": "0c8cd320d1856a8f"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | EBike变速器供应商打破海外巨头垄断，获国泰、达晨参与新一轮数千万元融资", "url": "https://36kr.com/p/3853252135654660?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能短出行核心零部件供应商洛梵狄智能科技（以下简称“洛梵狄”）已完成新一轮数千万元B+融资。本轮投资方包括国泰海通、达晨财智、以及广州黄埔科创母基金，老股东达晨财智在本轮中继续追加投资。</p>\n  <p>据悉，本轮融资资金将主要用于持续的研发投入、产能扩张、全球销售网络建设及日常运营流动资金。其中，研发重点将聚焦于下一代智能内变速器的深耕。</p>\n  <p>洛梵狄自2012年成立以来，专注内变速器的研发和生产，是中国第一家、全球第三家量产智能内变速器的厂商。目前公司已研发出电控内变速器、电机内置变速器（MEGS）、机械自动内变速器、智能车锁等产品。</p>\n  <p>变速器产品主要被用于出行产品中。智能电动出行厂商也是洛梵狄的主要用户。</p>\n  <p>以Ebike为例，过去三年，全球Ebike市场经历着漫长的去库存过程中。从全球市场数据来看，2024年Ebike全球市场规模已突破618.9亿美元，预计2030年将达1136.4亿美元，年复合增长率保持在10.3%。</p>\n  <p>洛梵狄CFO燕普认为，以欧洲市场为例，欧洲不少EBike存量用户是在2018年以后购买的车。按照一辆车8到10年的使用寿命计算，预计在两三年内，第一批存量用户的换车潮将集中释放，全球EBike市场有望进入下一轮显著的增长期。</p>\n  <p>Ebike核心零部件市场过去被博世、禧玛诺等巨头垄断，导致Ebike产品同质化严重，使得整车品牌商有需求用电子内变速器变做差异化技术。而当前欧洲高端Ebike市场内变速器渗透率超40%，70%的大众Ebike市场因电子内变价格过高完全空白。</p>\n  <p>此外，博世、八方、安乃达等主流电机厂均在推出更大扭矩的电机系统，加速了Ebieke对大功率电机的应用，而传统的变速系统却遇到物理限制。</p>\n  <p>目前，变速器巨头禧玛诺的主流内变速器额定扭矩仅为85Nm，被中高端车型广泛采用的enviolo HD，其输入扭矩上限也仅为100Nm。在大功率电机的输出下，传统变速器处于超载状态，极易损毁。</p>\n  <p>硬氪了解到，洛梵狄凭借自研的UHT超大扭矩专利技术，将智能内变速器的输入扭矩上限提升至200Nm。相较于市面上99%仍在使用手动机械变速器的现状，洛梵狄实现全线智能电子自动变速。该系统能够通过电机、力矩和速度传感器，结合AI算法精准协调人力与电力输出配比，并在毫米级内自动换到最合适骑手和地形的档位，实现上坡自动降档，同时能提升整车续航里程达30%。</p>\n  <p>市场合作方面，洛梵狄的技术实力已逐步获得全球整车厂的量产验证。目前，已有多个海外知名Ebike品牌开始量产使用洛梵狄内变速产品的Ebike型号。</p>\n  <p><strong>CFO对谈：</strong></p>\n  <p><strong>硬氪：在禧玛诺、博世等巨头垄断数十年的零部件行业，它们也开始下场做电子内变速器，在这种情况下洛梵狄的优势是什么</strong></p>\n  <p><strong>燕普：</strong>这本质上不是技术能不能理解的问题，而是中西方完全不同的产品迭代与商业生存哲学所决定的。</p>\n  <p>像博世、禧玛诺这类欧美日的老牌巨头，其做事的底层逻辑是“长周期研发，并靠长生命周期收回高利润”。禧玛诺现在的很多内变速器还是20年前的产品，没有作任何技术改动，他们习惯一个新产品花5年论证和研发，一旦上市，就要持续卖10年、20年来赚取丰厚的利润，其主动更替模具、高频升级的周期非常缓慢。</p>\n  <p>但中国公司是大挑战者属性的逻辑。我们更在乎通过技术迭新尽快占领市场，不指望靠一代产品卖十几年来躺着赚钱。中国企业是在品质和稳定性的基础之上快速迭代，在设计之初就敢于尝试并不断优化。我认为只要我们的技术在快速迭代，而且还有快速迭代的可能性，海外公司就都不足为惧。</p>\n  <p><strong>硬氪：车厂的决策周期一般需要2到3年，你刚提到洛梵狄业务现在爆发增速很快，为什么是是这个时间点？</strong></p>\n  <p><strong>燕普：</strong>我们的变速器业务前年到去年增长了5倍，去年到今年预期还能再增长5倍，明年估计还能翻3倍。</p>\n  <p>这种爆发看似突然，其实经历了一个漫长的用户验证周期。因为B端客户测试很长，我们现在大批量量产的客户，其实在两三年前就已经在对接和测试。当时我们没有出过大批量的产品，所以虽然客户很感兴趣但也很审慎，在同步做大量的实车测试。</p>\n  <p>同时，我们的核心竞争力在于满足了三个要素的叠加：更高的性价比、更强的抗扭性能（200Nm）、以及电控自动变速带来的智能化骑行体验。</p>\n  <p>在供给端，同时满足这三点的智能变速器在市面上几乎是空白。</p>", "category": "tech", "published_at": "2026-06-15T01:30:46+00:00", "fetched_at": "2026-06-15T03:44:36.972804+00:00", "fingerprint": "ca6ed582c98e6268"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 海洋具身智能公司「世航智能」拿下创纪录10亿融资，朱啸虎、淡马锡押注", "url": "https://36kr.com/p/3853011900142848?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，海洋具身智能公司「世航智能」完成A轮融资，融资金额超过10亿元，这也是目前全球海洋机器人领域规模最大的单轮融资。本轮融资由两家芯片公司「摩尔线程」和「昆仑芯」的产业投资方上河动量基金、新加坡国有投资平台Vertex Growth 、上市公司大洋电机等资方出资。</p>\n  <p>另外，金沙江创投也在本轮追加投资，这已是其创始人朱啸虎第五轮投资「世航智能」，祥峰中国、华映资本、长石资本等老股东亦全部超额跟投。</p>\n  <p>「世航智能」创始人兼CEO陈晓博为1989年出生的哈尔滨工程大学校友，长期深耕水下机器人领域，在28岁时获得国防科技进步一等奖，是该奖项最年轻获奖者，并主导研发全国首台商用水下清洗机器人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_f973153f6576424fb06765e4acbc200e@1199336245_oswg177265oswg1080oswg975_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>「世航智能」方面向硬氪透露，本轮融资将主要用于核心技术研发、全球化市场拓展及产业链生态建设，进一步推动海洋机器人在复杂水下场景中的规模化应用。</p>\n  <p>与工厂、仓储等相对标准化环境不同，<strong>海洋长期被视为机器人应用中难度最高的场景之一。</strong></p>\n  <p>在水下环境中，机器人需要同时面对低光照、高浑浊度、复杂洋流、通信受限、高压、腐蚀等多重挑战。这意味着，海洋机器人不仅要具备稳定的机械结构和运动控制能力，还要在复杂环境中完成感知、判断和自主作业。</p>\n  <p>在过去，大量水下作业仍高度依赖专业潜水员和大型装备完成，存在成本高、风险大、效率受限等问题。</p>\n  <p>据「世航智能」介绍，其长期围绕海洋机器人底层能力进行自主研发，核心技术覆盖动力、控制、传感、导航、密封和布放等六大核心系统。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_2c0c8e98a9724489971601cded7b6da8@1199336245_oswg630410oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>据了解，「世航智能」的机器人已具备0米至10000米全海深、全自由度作业能力，可在水下三维空间实现前进、后退、横移、翻滚等复杂动作，并支持自主导航、多机器人协同作业等功能。截至目前，「世航智能」的机器人已在<strong>船舶清洗、水下安保、海洋风电、海洋牧场、海底巡检</strong>等场景实现应用落地。</p>\n  <p>公司方面透露，仅2026年上半年，<strong>「世航智能」获得订单金额已超过10亿元。</strong></p>\n  <p>其中，「世航智能」旗下的“虎鲸机器人”已在招商轮船、中远散货等头部航运企业投入应用，并已经累计完成超千艘大型船舶养护作业，此前还牵头制定中国首个《水下清洗机器人操作规程》标准，获得2025年度中国航海学会科学技术进步一等奖。</p>\n  <p>在商业化布局之外「世航智能」也持续布局核心技术。今年4月，「世航智能」发布了<strong>海洋具身大模型“沧穹 CEORION”——</strong>与传统水下机器人依赖人工遥控或预设程序不同，沧穹试图让机器人具备感知、理解和自主执行能力。</p>\n  <p>「世航智能」创始人兼CEO陈晓博告诉硬氪，“沧穹 CEORION”采用统一端到端架构，将环境感知、任务理解和动作生成集成在同一个模型中，并结合真实作业数据与仿真数据进行训练。目前，“沧穹 CEORION”已基于百万小时级商业作业数据，构建了一个海洋世界模型，并通过真实任务持续迭代优化。</p>\n  <p>这意味着，搭载“沧穹 CEORION”的海洋机器人已经无需针对不同任务切换多个模型，即可覆盖<strong>巡检、检测、清洗、抓取、切割、焊接、勘探、搜救、应急等12大类水下作业场景。</strong></p>\n  <p>其中，在仿真测试中，<strong>“沧穹 CEORION”的任务成功率超过90%</strong>、精细控制定位抓取成功率超过90%——达到专业潜水操作员的操控水平。另外，面对从未见过的海域环境、水质条件、光照变化以及不同机器人平台，“沧穹 CEORION”的<strong>模型零样本适应能力超过70%。</strong></p>\n  <p>此外，海洋场景与陆地场景最大的区别还在于推理困难——视觉信息往往受到海水浑浊、光线衰减以及悬浮颗粒物影响。因此，模型需要同时融合多种感知信息，并具备复杂的物理推理能力，才能完成作业决策。</p>\n  <p>而在“沧穹 CEORION”的大模型架构中，「世航智能」将物理推理模块内置，使得模型能够在动作执行前预判潜在风险并优化决策，将碰撞事故率降低80%——这意味着，即便在弱通信甚至无通信环境下，机器人仍可自主完成任务规划与执行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_556b0b8f262a4dbc9b7702b5aa90d09f@1199336245_oswg1332297oswg1080oswg855_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>今年上半年，世航智能还入选新加坡海事及港务管理局国家水下船体检测与清洗计划，成为该国家级项目核心技术合作伙伴。</p>\n  <p>这些落地进展意味着，海洋机器人正在从单点项目验证走向规模化应用，而真实作业场景不仅为企业带来订单收入，也持续沉淀高价值作业数据，推动机器人能力在“作业—数据—模型”的循环中不断提升。</p>\n  <p>「世航智能」创始人兼CEO陈晓博告诉硬氪，公司将继续围绕海洋机器人核心技术、海洋具身智能模型和全球化应用场景进行投入，推动海洋机器人在更多高风险、高难度、高价值水下作业中实现应用落地。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_5260128d5c014f619077e7bf7143e241@1199336245_oswg53536oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>", "category": "tech", "published_at": "2026-06-15T01:50:00+00:00", "fetched_at": "2026-06-15T03:44:36.972796+00:00", "fingerprint": "2193c2611dc4b392"}, {"source": "36氪 - 最新文章", "title": "硬氪专访 | 智源研究院院长王仲远：VLA不会死，但世界模型是未来", "url": "https://36kr.com/p/3853016586359817?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>过去几个月，“世界模型”（World Model）从学术黑话迅速膨胀成AI和机器人行业里的关键词。</p>\n  <p>行业的目光转向背后是切实的焦虑。</p>\n  <p>一方面，经过了过去两年的野蛮生长，具身智能暴露了当前AI在物理世界中的短板——机器人能识别物体，却不懂“推杯子会掉”；能听懂指令，却无法预判“拧瓶盖需要多大的力”。世界模型正是试图补上这个短板，让机器人学会物理世界的规律、因果。</p>\n  <p>也就是说，世界模型与具身智能的关系，本质上是“大脑”与“身体”的关系。</p>\n  <p>另一面，大模型在经历了大语言、视觉模型、多模态的探索之后，需要从虚拟走向真实世界的下一阶段。</p>\n  <p>只是，当资本、技术专家、产业资源都倾注于此，世界模型到底如何上岸，人们没有答案。</p>\n  <p>在智源研究院院长王仲远看来，眼下全球围绕世界模型的探索，正被撕扯成四条截然不同的分岔路——</p>\n  <p>第一类是以<strong>语言为中心</strong>的世界模型，包括VLM、VLA，模型在文本空间中预测下一个词，学到的是语言描述的世界，并不能理解背后的物理后果；</p>\n  <p>第二类是以<strong>像素为中心</strong>的世界模型，像Sora和Seedance等视频生成类模型，在视觉空间中学习视频或图像，学到的是像素描述的世界；</p>\n  <p>第三类是以<strong>三维结构为中心</strong>的世界模型，包括3D重建以及李飞飞团队的World Labs Marble模型，不过模型重建3D空间不等于理解世界，几何结构也不代表物理状态；</p>\n  <p>第四类是<strong>以视觉表征为中心</strong>的世界模型，比如杨立昆的JEPA系列模型，预测的是视觉表征的压缩，但视觉嵌入演化不等于物理规律演化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_6b6ae97189f24037a81f6d6d4aba4219@1199336245_oswg141618oswg1080oswg1620_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智源研究院院长王仲远（图源/企业）</p>\n  <p>作为一家非营利性科研机构<strong>，</strong>北京智源人工智能研究院同样也是目前国内世界模型领域的中坚力量。</p>\n  <p>不同的是，智源研究院目前尝试的确是第五个分类——以语言和视觉为中心，<strong>融合进统一的「潜空间表征」</strong>：<strong>所有模态被压缩进同一个潜空间（latent space）仲，再由不同的\"解码器”（Decoder），按需还原成不同输出形态。</strong></p>\n  <p>举个例子，这个“潜空间”就像给机器人大脑准备了一张<strong>“万能草稿纸”，</strong>不管是看到的视频画面、听到的文字指令，统统先在“纸”上压缩成一种只有AI能懂的“密语笔记”，等需要时，机器人将会根据同一份笔记，<strong>画</strong>出接下来的场景，<strong>演</strong>出机器人的动作，或者<strong>算</strong>出物体的位置和力度。</p>\n  <p>在迈向世界模型进的前几年，智源研究院在AI上的动作，就像是一部层层递进的\"连续剧\",一步步构建从数字世界走向物理世界的通用基座——</p>\n  <p>从早年的\"悟道\"大模型，智源研究院将国内大模型叙事从0推到公共视野，再到逐渐把竞争点引导向原生多模态统一架构（包括悟界·Emu3/悟界·Emu3.5），此后，智源研究院明确提出要向“下一状态预测（NSP）”跃迁，并将这套逻辑接入悟·Physis和悟界·RoboBrain Orca的可部署系统中。</p>\n  <p>在这段期间，智谱AI、月之暗面、面壁智能、银河通用等多家行业头部企业的核心创始人唐杰、杨植麟、刘知远、王鹤等，也都均在智源开展过相关领域研究。</p>\n  <p>尽管世界模型热得滚烫，王仲远却对这股热潮保持着难得的冷静。他认为，<strong>世界模型大概处在深度学习的2012年前后</strong>——彼时，数据孤岛严重、路线未定、Benchmark还在打架，ChatGPT时刻尚未到来。</p>\n  <p>在他看来，世界模型接下来的硬仗，在于几个维度的综合比拼。</p>\n  <p>首先，模型不能只生成看起来<strong>真实但不符合真实物理规律的画面</strong>，比如只是生成“会飞上天的猪”，还要具备长时序一致性，不能不是几秒钟的视频，而是连续变化的状态。</p>\n  <p>其次，<strong>世界模型必须进行因果逻辑推断</strong>，需要理解动作和结果之间的关系，比如，要明白盖盖子和没盖子的杯子同时掉落时，会发生什么。最后，世界模型需要作为基座模型应用到多种场景，而<strong>不是只服务某个Demo或单一任务。</strong></p>\n  <p>落到应用侧，在他看来，世界模型的价值会在两大大方向兑现，除了用于突破具身智能的卡点，服务于机器人领域之外，世界模型还可以广泛应用于严肃工业、物理仿真、科学研究等真实物理场景。</p>\n  <p>“我们期待未来世界模型能成为真正的机器人大脑，世界模型解决了现在VLA、VLM解决不了的问题，提供了泛化、长程、复杂任务和主动探索能力。<strong>但这会是一个长期过程，可能需要三年甚至更长时间。”</strong>王仲远表示。</p>\n  <p><strong>近期，王仲远与硬氪等媒体聊了聊对世界模型的看法、以及世界模型与具身智能的衔接点，以下是采访实录（略经摘编）：</strong></p>\n  <h3><strong>世界模型四条分岔路</strong></h3>\n  <p><strong>硬氪：为什么今年智源大会重点谈“世界模型”，它和过去的大模型路线是什么关系？</strong></p>\n  <p><strong>王仲远：</strong>我们不是突然提出世界模型这个概念。早在2024年智源大会上，我们就对人工智能的发展路径做过预判：大语言模型之后，会进入原生统一多模态，再进入物理世界与硬件结合，进一步走向微观世界的AI for Science，最终通向物理AGI。</p>\n  <p>今年智源大会有两大主题，一个是世界模型，一个是智能体。智能体现在非常热，尤其是AI Coding已经进入蓬勃爆发阶段；<strong>世界模型则是我们认为人工智能从数字世界进入物理世界时必须面对的下一代基座模型问题。</strong></p>\n  <p><strong>硬氪：当前世界模型有哪几条技术路线？</strong></p>\n  <p><strong>王仲远：</strong>现在主流的有四条路：</p>\n  <p><strong>以语言为中心路线</strong>（如Gemini3）：能感知多模态数据，通过语言思考并描述下一状态，具备规划决策能力。</p>\n  <p><strong>以像素为中心路线（如Sora）：</strong>适合视频生成，但不懂物理因果；</p>\n  <p><strong>以三维结构为中心路线</strong>（如李飞飞World Labs的Marble）：瞄准元宇宙、游戏等数字世界仿真；</p>\n  <p><strong>以视觉表征为中心路线</strong>（如LeCun的V-JEPA系列）：预测的是视觉表征的压缩，但视觉嵌入演化不等于物理规律演化。</p>\n  <p><strong>硬氪：智源的世界模型可以归类于什么路线里？</strong></p>\n  <p><strong>王仲远：</strong>我们更倾向于在潜空间中学习世界知识，也就是Latent Relation，尝试把世界知识真正压缩到隐空间中，再通过不同Decoder输出Language、Action和Vision。</p>\n  <p>智源选择尝试以语言为中心的分类和以视觉表征为中心的分类可能的融合，原因很简单，世界模型不仅要“看懂”物理世界，更要“理解”并“决策”。比如人类看到半杯水被打翻，大脑会自动预判“水流方向、地面材质对流速的影响”——这种能力需要将视觉信号与语言推理深度融合，而不是只生成画面。</p>\n  <p>我也认同LeCun对“大语言模型局限性”的判断，但我并不认为语言模型不重要，语言是人类知识的载体，放弃语言等于放弃了人类积累的物理常识。</p>\n  <p><strong>硬氪：现在很多公司把视频生成模型称为世界模型，你怎么看？</strong></p>\n  <p><strong>王仲远：</strong>我非常明确地认为，视频生成不等于世界模型。现在世界模型这个词被广泛使用，很大程度上是因为OpenAI发布Sora时用了“World Simulator”的表述。</p>\n  <p>世界模拟器用于描述视频生成还算相对准确，但视频生成模型本身并不等同于世界模型。今年很流行的World Action Model，把视频和Action拼接起来，也不能完全代表真正意义上的世界模型。</p>\n  <p>在我看来，<strong>真正的世界模型应该是面向真实物理世界的下一代基座模型</strong>。它不是单纯生成一段看起来很逼真的视频，而是要<strong>理解真实物理世界的状态变化、动作因果、长时间序列一致性和泛化能力。</strong></p>\n  <p>语言模型时代的核心是Next Token Prediction，也就是预测下一个词元。而世界模型时代的核心应该是Next Physical State Prediction，预测下一个物理状态。</p>\n  <p>语言模型可以用Prompt激发能力，世界模型则需要用State激发能力。语言模型更多是被动观察，世界模型必须主动交互。语言模型可以是单模态或多模态，世界模型必须走向全模态。</p>\n  <p><strong>硬氪：一个真正面向物理世界的世界基座模型，需要具备什么能力？</strong></p>\n  <p><strong>王仲远：</strong>我认为至少需要几个能力。</p>\n  <p>第一，要<strong>物理正确</strong>，光学折射、重力、流体、物体运动都要符合真实物理规律。视频生成模型可能生成一群在天上飞的猪，但物理世界不会这样运行。如果机器人装上一个不能区分真实和虚幻的“大脑”，它可能误以为自己是钢铁侠，这会带来严重风险。</p>\n  <p>第二，要有<strong>动作因果可溯。</strong>模型不能只知道画面变化，还要知道Action会导致什么结果。比如，一瓶水有没有盖盖子，当人类看到它快掉落时，自然会预判不同后果，世界模型需要把这种动作与后果之间的关系学进去。</p>\n  <p>第三，要有<strong>长时间序列一致性</strong>。很多视频生成模型可以生成5秒、10秒甚至1分钟的视频，但并不代表它真正理解时间。如果给一个瓶子加水，旁边有一个时钟，镜头移开再移回来，模型要知道现实中确实经过了10秒或20秒，而不是随意生成一个看似合理的画面。</p>\n  <p>第四，要有<strong>通用泛化能力</strong>。世界基座模型必须能应用在多个下游场景，就像大语言模型可以用于很多任务一样。它不能只是一个特定场景的工具，而要能服务具身、物理仿真、科学预测等多种任务。</p>\n  <h3><strong>世界模型或成为真正的机器人大脑</strong></h3>\n  <p><strong>硬氪：当前具身智能最大的问题是什么？</strong></p>\n  <p><strong>王仲远：我认为具身智能还处在非常早期。</strong>现在的具身模型多数还是单场景、被动任务执行者。它们可以在特定工厂、特定任务、特定数据下工作，比如看到包裹就执行抓取、分拣、放置。这类场景中，VLA或者更简单的模型都可能有效。</p>\n  <p>但问题在于，它们很难泛化。真实物理世界是复杂的，有时间、空间、物理规律，也有人类创造的各种工具和环境变化。机器人如果只是被动执行指令，靠一个场景一个场景解决问题，就很难真正大规模落地。</p>\n  <p>我认为，世界模型和具身智能是相互呼应的。具身智能暴露了当前模型在物理世界中的短板，世界模型则试图补上这个短板。</p>\n  <p><strong>硬氪：现在也有一些论调称，“VLA已死”，世界模型是不是具身智能的必要路线，两者的关系是什么？</strong></p>\n  <p><strong>王仲远：</strong>我的判断是：<strong>VLA是当下，世界模型是未来。</strong></p>\n  <p><strong>VLA当然有用，而且有很大用处。</strong>它可以促进机器人在特定场景落地，甚至有些特定场景不一定需要更复杂的世界模型，只要看到包裹就执行动作，搜集特定数据就可以完成任务。</p>\n  <p>但VLA有局限，比如泛化性不足，其次是长程任务、复杂场景和空间物理规律理解能力不足。再者，VLA模型往往比较大，部署响应速度和Latency较高，不一定能满足真实物理世界中高频动作执行的要求。世界模型要解决的是更底层的问题。</p>\n  <p><strong>硬氪：世界模型对机器人执行任务的帮助，能否举一个具体的例子？</strong></p>\n  <p><strong>王仲远：</strong>世界模型不应该只是生成数据，也不只是生成视频。它更重要的能力是基于当前Context和状态，预测未来可能发生的状态，并据此做出当下最优决策。</p>\n  <p>可以用一个比喻来理解，有点像《奇异博士》看到不同未来，然���选择最优结果。机器人面对真实环境时，也需要类似能力。它要理解当前环境，预测不同动作会带来什么后果，再选择最合适的动作。</p>\n  <p>比如机器人在酒店或家庭环境中，看到一个门、一只手势、一个声音指令、一个房间状态，它需要结合历史记忆和当前Context做出判断：是关厨房的门，还是关房间的门，还是采取其他动作。这不是简单的图像识别，也不是简单的语言指令执行，而是复杂推理后的物理决策。</p>\n  <p>这就是我们说的世界模型要指挥Agent物理实体执行Action。执行之后，还要继续采集反馈，评估任务是否完成，并进入下一轮状态预测和决策。</p>\n  <p><strong>硬氪：世界模型最终是否会成为真正的机器人大脑？</strong></p>\n  <p><strong>王仲远：</strong>这是我们的期待。我们希望未来的世界模型能够在具身场景下真机部署，解决VLA、VLM和传统动作执行无法解决的问题。机器人需要有泛化能力、长程任务能力、复杂推理能力、主动探索能力。它不仅要能看懂世界，还要能理解动作后果，规划未来状态，指挥机器人执行动作，并根据反馈修正决策。</p>\n  <p>这件事不会短期完成。<strong>世界模型是一个长期过程，瞄准的不是短期落地应用，而是下一个人工智能时代的核心能力。</strong>短期内，具身机器人会先在具体场景中落地，采集数据，形成闭环；长期看，世界模型有机会成为真正意义上的机器人大脑。</p>\n  <p><strong>硬氪：世界模型现在最难突破的技术难点是什么？</strong></p>\n  <p><strong>王仲远：一个核心难点是数据，尤其是真实物理世界的数据。</strong></p>\n  <p>大语言模型的爆发依赖互联网数据。世界模型要进入物理世界，也需要足够多、足够高质量的真实物理数据。现在真实世界数据仍然非常缺乏，而且是散落的孤岛，没有形成足够充足、可复用、可训练的数据体系。</p>\n  <p>视频数据是目前最容易Scale Up（规模化）的数据，因为它海量存在，也确实包含大量真实物理世界的信息。但问题在于，现在科研技术还没有充分挖掘视频数据里的物理信息。</p>\n  <p>除了视频，我们还需要真实交互数据、异构感知数据、动作轨迹数据、人类指令数据、机器人执行反馈数据。具身机器人在真实工厂、酒店、家庭等场景中工作时，会产生大量有价值的数据，这些数据闭环可能会加速世界基座模型的训练和爆发。</p>\n  <p><strong>硬氪：如果真实物理世界数据不足，是否可以依靠仿真数据？</strong></p>\n  <p><strong>王仲远：</strong>仿真数据有必要，能弥补真实数据采集不足，但我对完全依赖仿真数据构建更强模型是有疑虑的。因为仿真数据本身是人类构造的，它的精准度不一定足够，如果用不够精准的海量数据训练模型，能不能构建出真正理解物理世界的模型？这是需要验证的。</p>\n  <p>未来可能会像语言模型训练中的数据配比一样，把互联网数据、视频数据、仿真数据、真实机器人数据、科学数据等，放在一起训练世界基座模型。</p>\n  <p>但不同数据如何配比，现在还没有标准答案，数据质量和配比会直接决定模型能力，这很大程度上仍然依赖研究员的判断、实验和下游任务验证。最直观的验证方式就是具身智能，模型真正部署到机器人上，能不能在训练数据之外完成任务，能不能在复杂场景中做出合理决策，这些会成为判断数据和模型能力的重要标准。</p>\n  <p><strong>硬氪：如果世界模型还很早期，具身智能短期如何落地？</strong></p>\n  <p><strong>王仲远：</strong>短期内，具身智能会沿途下蛋，也就是先解决具体场景问题，比如工厂分拣、打包、贴纸、放充电器、合上盖子，或者酒店服务等To B场景。</p>\n  <p>这些场景本身有商业价值，也能在落地过程中采集数据。机器人在真实场景中干活，会产生人类指令、人类交互、动作轨迹、任务结果等数据，这些数据反过来会帮助未来世界基座模型训练。</p>\n  <p>所以我们不能等所有数据都Ready之后再探索技术路径，技术要先行，产品和系统会跟上。就像深度学习、Transformer、大语言模型的发展一样，技术路径往往早于产品爆发。</p>\n  <h3><strong>世界模型尚未到GPT时刻</strong></h3>\n  <p><strong>硬氪：世界模型最可能率先落地在哪些场景？</strong></p>\n  <p><strong>王仲远：</strong>具身智能肯定是最重要的应用场景之一，除此之外，世界模型也可以用于物理仿真、科学实验、AI for Science等场景。</p>\n  <p>现在的很多模型无法解决这些真实场景中的问题，归根结底，我们希望有一个面向真实物理世界的基座模型，帮助人工智能更好地感知、理解物理世界，并具备推理和决策能力。</p>\n  <p><strong>硬氪：如果类比大语言模型的发展阶段，世界模型现在处于什么阶段？</strong></p>\n  <p><strong>王仲远：</strong>我认为<strong>世界模型和具身智能大概处在2012年的时期。</strong>那个时候深度学习刚刚兴起，从2012年到2018年，再到2022年底ChatGPT发布，大语言模型真正爆发走了大约十年。现在世界模型还没有到GPT时代，因为数据非常缺乏，技术路线也没有完全收敛。</p>\n  <p>但人工智能演化速度越来越快，世界模型可能三年到五年，随着视频数据进一步被挖掘，具身机器人不断在真实场景落地，真实物理世界数据不断累积，世界模型会更快进入爆发阶段。</p>\n  <p><strong>硬氪：大语言模型时代，中美通常被认为有六到十二个月差距。世界模型时代，中国和海外是否还有差距？</strong></p>\n  <p><strong>王仲远：</strong>大语言模型早期，我们更多是在跟随。世界模型是世界上最前沿的研究方向，概念、路线、模型形态都还没有完全收敛。我觉得世界模型没有差距，大家站在同一起跑线。</p>\n  <p><strong>硬氪：未来世界模型的竞争会集中在哪些方面？</strong></p>\n  <p><strong>王仲远：</strong>现在大家都说自己在做世界模型，但很多所谓世界模型其实是工具，或者是解决特定场景的模型，并不一定是通用世界基座模型。未来真正关键的竞争点，我认为包括几个方面：</p>\n  <p>第一，能否具备真实物理可验证能力。模型不能只生成看起来真实的画面，而要符合真实物理规律。</p>\n  <p>第二，能否具备长时序一致性。真实世界不是几秒钟的视频，而是连续变化的状态。</p>\n  <p>第三，能否进行因果逻辑推断。模型需要理解动作和结果之间的关系。</p>\n  <p>第四，能否作为基座模型，用不同数据微调后应用到多种场景，而不是只服务一个Demo或一个垂直任务。</p>\n  <p>我认为世界模型最后一定需要通过系统和产品来证明。只有当它能在机器人、物理仿真、科学实验等真实任务中体现价值，行业才会逐渐收敛对世界模型的定义和路线判断。</p>\n  <p><strong>硬氪：过去大模型积累的基础设施能否复用？世界模型对算力等等，有什么新的要求吗？</strong></p>\n  <p><strong>王仲远：</strong>我比较乐观地认为，现有的大模型算力基础设施、训练框架、数据工具链都可以在很大程度上复用。悟界Emu3.5当时强调的一个理念，就是采用类似大语言模型的架构，并证明它能够Scale Up。</p>\n  <p>到了世界模型阶段，依然需要处理声音、图像、动作轨迹、语言等各种模态，这些在多模态和具身领域已经有基础。但是，新的挑战在于Action和State怎么采集、怎么表达、怎么训练。世界模型会带来新的需求，但基础设施并不是完全从零开始。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_bd5bb37ddcec4546b3f03a30d3e5a65e@1199336245_oswg53536oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-06-15T01:50:00+00:00", "fetched_at": "2026-06-15T03:44:36.972781+00:00", "fingerprint": "2c6dbd992e1e5235"}, {"source": "少数派", "title": "TDS REVIEW｜韶音 OpenDots 2 / Air 耳夹式开放真无线耳机体验", "url": "https://sspai.com/post/110761", "summary": "一代上的好几处优势这次依然保持得不错。<a href=\"https://sspai.com/post/110761\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-14T03:00:00+00:00", "fetched_at": "2026-06-15T03:44:35.231086+00:00", "fingerprint": "2cfe43a39aea8dc9"}, {"source": "少数派", "title": "派早报：Fable img-desc\">飞向宇宙、浩瀚无垠</p>\n  <p><strong>作者｜曹思颀</strong></p>\n  <p><strong>编辑｜靖宇</strong></p>\n  <p>6 月 12 日，在 SpaceX 正式挂牌当天，马斯克选择前往得州的星舰基地，和数百名员工一起，远程敲响了纳斯达克的开市钟。</p>\n  <p>在现场，他用熟悉的那股自嘲范儿说：「如果当年有人告诉我会有今天，我大概率觉得那个人嗑嗨了。因为当时我自己都认为这家公司会黄。」</p>\n  <p>这一天，SpaceX 正式登陆纳斯达克，发行价 135 美元，募资约 750 亿美元；开盘即涨，盘中一度冲过 176 美元，市值短暂站上 2 万亿美元。</p>\n  <p>从 2002 年因为买不到火箭而被迫创业，到如今完成人类商业史上最��的 IPO，这 24 年的旅程里，有大量反直觉、反共识的故事。</p>\n  <p>这家公司名义上造火箭，但火箭业务并不赚钱；它最出圈的成就是回收火箭，但撑起估值的是另外两个故事——星链，和刚刚写进招股书的「太空算力」。</p>\n  <p>我们整理了其中 15 个最具代表性的小故事，希望可以帮助你建立起对 SpaceX 更全面的了解。</p>\n  <h2><strong>1. SpaceX 的起点，来自一位商业新贵的「公关行为」</strong></h2>\n  <p>2001 年，刚从 PayPal 套现的马斯克想自掏腰包做一个叫「火星绿洲」的舆论工程：花一两千万美元一个迷你温室送上火星，拍下绿色植物长在红色土地上的照片，以此让国会增加给 NASA 的预算。</p>\n  <p>但他被运费卡住了。欧洲火箭太贵，三赴莫斯科买退役洲际导弹又被当成外行打发。</p>\n  <p>在后来的多次公开演讲以及媒体采访中，马斯克表示，受挫之后他认为卡住人类通往火星的既非公众意愿，也非国会预算，而是火箭的价格本身。于是「帮 NASA 募捐」变成了「自己把火箭做便宜」。</p>\n  <p>2002 年，SpaceX 正式成立。</p>\n  <h2><strong>2. 前六年，这家公司一直在「失败」</strong></h2>\n  <p>2002 到 2008 年，Falcon 1 前三次发射全部失败。</p>\n  <p>那个年代，造火箭的 know-how 全部锁在国家航天体制内。SpaceX 既买不到图纸，也雇不到人。马斯克后来自述时调侃说：他出任公司的首席工程师是因为「优秀的人都不愿意来」。</p>\n  <p>更残酷的是火箭的物理属性：它无法在地面上充分调试，唯一的学习方式就是发射、炸掉、再来。「三连败」是一家公司用实弹自学航天的学费——只是这份学费按千万美元计价，而马斯克的钱只够交四次。</p>\n  <h2><strong>3. 第四发成功，开启了「商业航天」时代</strong></h2>\n  <p>2008 年 9 月 28 日，Falcon 1 第四次发射成功——人类第一枚由私人资金研发的液体燃料火箭进入地球轨道。</p>\n  <p>在此之前，「航天」默认是国家的游戏：花钱的是政府，干活的是体制。</p>\n  <p>三个月后，NASA 把 16 亿美元的国际空间站货运合同（CRS）交给了这家刚刚死里逃生的公司。「商业航天」作为一个行业，这一天才算正式出生。</p>\n  <h2><strong>4. 商业航天的新玩法</strong></h2>\n  <p>传统航天采购是「成本加成」（cost-plus）：承包商花多少报多少，政府再加一笔利润——花得越多，赚得越多，没有任何人有动力省钱。</p>\n  <p>NASA 在商业货运项目（COTS/CRS）里给 SpaceX 的是固定价合同：一口价，省下的都是你的，超支的自己扛。这个看似枯燥的采购条款，才是商业航天真正的制度起点，它第一次让「把火箭做便宜」变成一门有利可图的生意。</p>\n  <p>SpaceX 后来贯穿始终的成本执念，一半是天性，一半是这纸合同逼出来的。</p>\n  <h2><strong>5. 可回收技术：让甲方心甘情愿地为「不靠谱的技术」掏钱</strong></h2>\n  <p>2015 年 12 月 21 日，Falcon 9（猎鹰 9 号）一级火箭第一次成功降落回地面——距公司成立整整 13 年。</p>\n  <p>在此之前，SpaceX 对回收的执念经历过漫长的试验和失败：2010 年 Falcon 9 头两次飞行， 就尝试过用降落伞回收一级火箭——火箭还没来得及开伞， 就在重返大气层时解体了。2013 年起改用反推动力方案， 此后两年多， 先后近十次尝试：有的在海面上硬摔， 有的在驳船甲板上爆炸、倾倒， 没有一枚完整地回来。</p>\n  <p>但这些试验几乎都不是自费专项测试， 而是搭在客户的付费发射上——同一枚火箭， 既执行任务， 又做实验。客户的载荷在前半程送入轨道， 钱货两讫；送完货的一级火箭， 按行业惯例本就是扔进大海的垃圾，SpaceX 拿它顺路练降落。</p>\n  <p>马斯克的「算盘」是：炸了， 炸的是垃圾；成了， 航天史改写。所以，其实是 SpaceX 用 NASA 的订单作为奖学金， 免费读完了「可回收」这个学位。如今 Falcon 9 任务成功率约 99.4%，2025年，Falcon 9系列共发射165次，其中助推器回收仅失手3次。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_543a3bf284e9409198b85d7f2b6a5f11@5579416_oswg873458oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">猎鹰9号火箭进行商业发射 | 图片来源：SpaceX</p>\n  <h2><strong>6. 今天的 SpaceX：星链（StarLink）赚钱养 AI</strong></h2>\n  <p>招股书显示，2025 年 SpaceX 总营收 187 亿美元，净亏损 49 亿美元。</p>\n  <p>但按分部拆开，故事完全不同：星链所在的连接业务一年贡献约 44 亿美元经营利润，是全公司唯一盈利的板块；火箭所在的太空业务小亏约 6.6 亿——主要因为往星舰研发砸了约 30 亿美元。</p>\n  <p>真正的大窟窿是并表进来的 xAI：一年经营亏损约 64 亿美元，一家就吞掉星链的全部利润还不够。</p>\n  <p>换句话说，如果只看「老 SpaceX」（火箭＋星链），它已经是一家赚钱的公司；让它重新「亏损」的，恰恰是它为下一个故事买入的 AI。</p>\n  <h2><strong>7. 星链是马斯克为可回收火箭提前布局的「内部甲方」</strong></h2>\n  <p>2015 年 1 月，马斯克公开宣布星链计划（StarLink），它是 SpaceX 用成千上万颗低轨小卫星组成的「天上的宽带网」， 向地面用户卖上网服务——尤其是海上、荒野、偏远地区这些光纤和基站够不到的地方。</p>\n  <p>同年 12 月，Falcon 9 才第一次成功着陆。也就是说，在「便宜的火箭」被证明之前，「便宜火箭的客户」已经内部立项了。</p>\n  <p>这不是巧合，是同一道算术题的两半：全球火箭发射市场一年只有五六十亿美元，且过去十年没有太大变化。所以便宜的运力放到这个市场里根本吃不饱；反过来，要给全球铺一张几千上万颗卫星的网，没有便宜的运力，账根本算不过来。</p>\n  <h2><strong>8. 星舰还没成功，它的「买方市场」已经换过一轮了</strong></h2>\n  <p>同样提前下注的故事发生在下一代重型火箭星舰（Starship）上。</p>\n  <p>2014 年，SpaceX 在得州博卡奇卡为星舰基地奠基——那一年，Falcon 9 连一次回收都还没成功。上一代未落地，下一代已动工。</p>\n  <p>更值得注意的是甲方的变迁：星舰最初的叙事是「人」——火星移民、太空旅行，马斯克讲了很多年；而太空算力概念兴起后，星舰的头号甲方悄然换成了「数据中心」。</p>\n  <p>逻辑没变：猎鹰 9 配约 20 吨级近地轨道运力，甲方是星链；星舰规划运力 100—150 吨（近地轨道、规划值），游客消耗不了这么大的运力，但太空数据中心需要的设备也许可以。</p>\n  <p>火箭每大一号，马斯克就得给它们「创造」一个商业层面更大的甲方。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_aa5f9d67052e4c56bbc0ac1413f12246@5579416_oswg608949oswg1080oswg588_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">星舰V3首次升空，一共搭载了33台猛禽V3助推器 | 图片来源：SpaceX</p>\n  <h2><strong>9.「筷子夹火箭」</strong></h2>\n  <p>2024 年 10 月 13 日， 星舰第五次试飞， 发射塔上两条机械臂在半空中夹住了缓缓下落的助推器， 全网刷屏。</p>\n  <p>此前，猎鹰 9 证明了火箭能「收回来」， 也能「再飞」——但每次回来要出海打捞、返厂翻修， 周期以周计， 本质上还是「修好再用」。而星舰要的是另一件事：像飞机一样， 落地、检查、加注、再起飞。</p>\n  <p>着陆腿是死重， 占运力；落在远处就要运输。让助推器直接回到发射塔的怀里， 意味着它落下来的地方就是它再次起飞的地方——中间环节被压到极限， 周转目标从「周」变成「小时」。</p>\n  <p>所谓「筷子夹火箭」，实际是指出了 SpaceX 眼中火箭的终极形态：从能回收， 到「航班化运行」。</p>\n  <h2><strong>10. 未必需要「国产星链」，但一定需要「国产运力」</strong></h2>\n  <p>「中国版 StarLink」是个流行叙事，但有个常被忽略的事实：星链解的是「地面基站够不到」的题——海上、荒野、地广人稀之处；而中国恰恰拥有全球覆盖最强的地面通信网络，星链式服务在国内的体感天然有限。</p>\n  <p>真正的命题在另一层：卫星不止通信一种用途——遥感、导航、未来的太空算力，每一样都需要把大量的东西便宜地、高频地送上天。</p>\n  <p>换句话说，中国可以不复制星链这个「产品」，但绕不开星链背后那个「运力」。对对中国商业航天而言，「要不要一张天上的网」并不是最核心的那个问题，「有没有织网的手」才是。</p>\n  <h2><strong>11. 打破「永不 IPO」的 flag</strong></h2>\n  <p>SpaceX 曾是硅谷最坚定的「永不 IPO」公司。马斯克的公开理由是，资本市场的短期主义和火星这种超长期目标不兼容。</p>\n  <p>转折发生在去年四季度：星链的用户增长和单用户收入都看得到天花板，而「太空算力」这个新故事的资本开支，大到只有公开市场才接得住。</p>\n  <p>招股书披露，仅 2026 年一季度，AI 业务的资本开支就超过了太空和连接两个板块之和。</p>\n  <p>所以，上市不是终点庆典，而是下一轮豪赌的融资动作。</p>\n  <h2><strong>12. 太空算力是「共识」，细节还是未知数</strong></h2>\n  <p>太空算力的概念虽然新，但却是科技行业在过去半年迅速达成的超级共识，几乎没有人再公开唱反调。</p>\n  <p>但往下追问一层，所有技术细节似乎都没有共同的答案：</p>\n  <p>太空数据中心长什么样？没有公开的产品定义。它算什么数据、数据从哪来？也没人知道。</p>\n  <p>借 AI 行业经典的三要素说——算法在地面狂奔，但「数据」和「算力部署」在太空语境下都还是空白。预训练还是推理？两者对供电、散热、组网的要求完全不同，对应的卫星设计也完全不同。一个被万亿资金定价的方向，连产品形态都还没收敛。</p>\n  <p>当然，如果换个角度看，这恰恰意味着牌桌上还有大量空座还没占。</p>\n  <h2><strong>13. 硅谷为「太空算力」掏出了真金白银</strong></h2>\n  <p>硅谷各大超级巨头对太空算力的支持，没有只停留在嘴上。</p>\n  <p>马斯克通过一次涉及万亿级资产的公司重组，合并了 SpaceX 和 xAI 两家公司。招股书写明，最早 2028 年部署在轨数据中心。</p>\n  <p>谷歌立项「捕日者计划」（Project Suncatcher）：发表技术论文、计划发射两颗搭载自研 TPU 的原型卫星，并在和 SpaceX 洽谈发射合同。</p>\n  <p>贝索斯的蓝色起源 2026 年 3 月向美国联邦通信委员会递交了 51600 颗数据中心卫星的「日出计划」申请。</p>\n  <p>前谷歌 CEO 施密特 2025 年收购火箭公司 Relativity Space，公开目的就是把数据中心送上轨道。</p>\n  <p>英伟达参投的 Starcloud，已于 2025 年 11 月把一块 H100 芯片送入轨道并完成在轨模型训练。</p>\n  <p>买公司、并资产、递牌照、发卫星——大家的基建竞赛已经开工。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_2f062e129bd34d5191bf67ab7c07e80c@5579416_oswg627233oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">硅谷初创公司 Starcloud 2025 年 11 月搭载 NVIDIA H100 GPU 入轨 | 图片来源：Starcloud</p>\n  <h2><strong>14. 冰冷的成本账</strong></h2>\n  <p>有航天工程师做过公开测算：建一个 1 吉瓦的轨道数据中心（约 4300 颗卫星、含五年运营），总成本超过 500 亿美元——约为地面同等规模的三倍。</p>\n  <p>要把这笔账翻过来，业内普遍的测算是入轨成本须压到每公斤约 200 美元以内，而今天 Falcon 9 对应的发射成本（请注意，「发射成本」和「入轨成本」并不完全相同）在每公斤约 2000—3000 美元。两者相差至少一个数量级。</p>\n  <p>这个数量级，需要星舰这样的二级可回收重型火箭来补课降成本。所以太空算力的时间表，是和星舰的进展深度绑定的。故事的真假，最终要用焊枪和发射台来验。</p>\n  <h2><strong>15. 更大的故事</strong></h2>\n  <p>回看 SpaceX 的成长史，它用一个买不到便宜火箭的客户，被逼成了乙方；然后又造出了自己的甲方（星链）；现在它为下一代火箭预订了一个更大的甲方（太空算力）。</p>\n  <p>过去 24 年里， 它把火箭可回收技术和星链这两个兑现前没人相信的故事变成了现实。今天，太空算力这张还没兑现的期票，以约 1.75 万亿美元的目标估值出现在了公开市场。</p>\n  <p>这次的故事比之前更大， 票价也更贵。</p>\n  <p>在我们的最新一期播客节目里，极客公园创始人张鹏进一步讲述了 2014 年马斯克第一次来华两人畅聊商业航天的逸事，太空算力投资人翟光龙则深入分析了太空算力对整个科技行业带来的影响和机会，欢迎扫码收听。</p>\n  <p>*头图来源：SpaceX</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/lpTceYXQoxlhbhPOBLBhSA\" rel=\"noopener noreferrer\" target=\"_blank\">“极客公园”</a>，作者：曹思颀，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T04:08:19+00:00", "fetched_at": "2026-06-14T03:34:54.026229+00:00", "fingerprint": "898f3bc090847a5e"}, {"source": "36氪 - 最新文章", "title": "“宁王系”，排队 IPO", "url": "https://36kr.com/p/3851106394117383?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_58350c4bd51f4d4996cf27cd413e3d9a@5579416_oswg103747oswg1080oswg460_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">越来越多CVC在路上</p>\n  <p>作者 |&nbsp;冯晓亭&nbsp;</p>\n  <p>&nbsp;编辑 | 吾人&nbsp;</p>\n  <p>来源 |&nbsp;融中财经&nbsp;</p>\n  <p>宁德时代，又出手了。</p>\n  <p>近日，中恒电气发布关于控股股东签署《战略投资合作框架协议》事项的进展公告。公告显示，公司控股股东杭州中恒科技投资有限公司（简称“中恒科技投资”）引进宁德时代新能源科技股份有限公司（简称“宁德时代”）的战略投资事宜正在有序推进中，宁德时代拟以40.9985882353亿元（约“41亿元”）认购中恒科技投资新增注册资本。</p>\n  <p>中恒电气表示，自《战略投资合作框架协议》签署后，各方基于框架协议达成的基本合意，共同推动有关中恒科技投资增资、公司与宁德时代形成战略业务合作关系等具体事宜的洽谈、磋商工作，目前相关工作仍在有序推进中。</p>\n  <p>值得一提的是，这并非宁德时代今年在资本市场首次出手。</p>\n  <p>公开数据显示，今年以来，宁德时代宣布入股的上市公司还有富临精工、赛力斯旗下的赛豆科技、世纪互联等。除此之外，今年3月，天眼查工商信息显示，博裕新智新产（宁波）股权投资合伙企业（有限合伙）发生工商变更，新增十余家投资方，其中便有宁德时代的身影；4月，宁德时代发布公告，拟设立全资子公司“时代资源集团”，后者定位为公司新能源矿产领域的专业投资运营与管理平台……凡此种种，不胜枚举。</p>\n  <p>且从宁德时代出手项目所涉猎的赛道来看，与自己的动力电池主业几乎没有直接关联。由此可见，现市值超万亿元的“宁王”从产业链协同投资，正转向更广阔的生态圈布局，未来也将有越来越多的“宁王系”企业推开二级市场大门。</p>\n  <p>而跨界进行投资布局的宁德时代并非孤例。放眼望去，越来越多产业龙头正做出相似的战略选择。在传统股权投资机构募资困难、退出遇阻的背景下，以产业龙头为核心的CVC，正逐渐成为中国创新资本市场不可忽视的一支力量。</p>\n  <h2><strong>41亿元，宁王入股中恒电气</strong></h2>\n  <p>这笔交易，前后历时两个月时间。</p>\n  <p>早在今年4月，中恒电气发布公告称，公司控股股东中恒科技投资拟接受宁德时代对其进行增资。拟议增资完成后，中恒科技投资控股股东朱国锭和包晓茹，以及宁德时代分别持有中恒科技投资35.70%股权和15.30%股权、49.00%股权。受此利好消息影响，公告发布次日开盘，中恒电气一字涨停。</p>\n  <p>谈及下一步规划，中恒电气在公告中表示，“各方发挥各自在相关领域的核心竞争力和资源优势，促进宁德时代与中恒电气围绕绿色ICT基础设施、交通电动化、新型电力系统（算电协同）等领域开展相关业务及战略合作，整合资源禀赋，赋能公司发展。”</p>\n  <p>要了解双方为何跨界联手，得先从认识中恒电气说起。</p>\n  <p>作为一家专注于零碳智能社会建设的数字能源公司，中恒电气深耕高压直流技术路线。公司主营业务涵盖数据中心与站点能源、数字电网与综合能源服务等领域，是数据中心HVDC（高压直流）供电技术方案的行业先行者，核心产品包括数据中心HVDC直流供配电、预制化Panama电力模组、通信电源系统、电力操作电源系统等，目前已广泛应用于互联网、第三方colo、智算中心、超算中心、通信运营商、金融政企等数据中心场景。</p>\n  <p>虽然名声不显，但国内HVDC行业集中度高，主要有中恒电气、维谛技术等，其中中恒电气凭借客户壁垒与技术优势成市占率第一企业，头部效应有望延续。</p>\n  <p>目前，AIDC（人工智能数据中心）投资进入高速扩张周期，数据中心供配电市场广阔。全球主要云厂商资本开支已进入放量期，以亚马逊、微软、谷歌、Meta为代表的海外头部云厂商单季度资本开支总额均在持续攀升，增长显著。资本开支的增量主要投向AI基础设施，驱动AIDC投资进入高速扩张周期。供配电系统作为AIDC的底层支撑，其投资规模与云厂商资本开支增长呈强正相关，变压器、HVDC、UPS、开关柜等关键设备需求将同步增长。</p>\n  <p>与此同时，随着AI大模型的训练与推理需求快速扩张，数据中心的用电量和供电稳定性要求也在同步攀升，配储也相应成为刚需。配储这个场景，恰恰是宁德时代的主场。</p>\n  <p>双方联手后，可协同解决AI智算中心绿电适配、峰谷调节等核心痛点，共同打造从绿电生产到储能、高效供电、算力消耗的全链路解决方案。简单说，宁德时代的储能系统可以跟着中恒的HVDC，顺着数据中心的渠道，进入一座又一座机房。在此之前，宁德时代便和商汤科技合作，在上海落地了临港智算中心（AIDC），共同建设了一套规模为17.888MW的储能系统，成为算电协同跑通的标杆项目之一。</p>\n  <p>至于宁德时代和中恒电气交易达成后会擦出怎样的火花，我们不妨拭目以待。</p>\n  <h2><strong>“宁王系”，遍布资本市场</strong></h2>\n  <p>跨界入股上市公司，对宁德时代而言并非新鲜事。</p>\n  <p>今年以来，宁德时代便以“股权投资+业务合作”的战略投资模式，直接或间接入股多家上市公司。1月，宁德时代和富临精工合作，双方意在加强在新能源产业的深度合作，同时在新兴产业领域构建务实合作格局，实现更深层次的资源整合与战略合作；5月，美股上市公司世纪互联发布公告表示，宁德时代关联公司PJ Millennium，以9.42亿美元（约合64亿元人民币）收购了该公司约6.5亿股A类普通股，有望成为该公司的第一大股东……</p>\n  <p>入股上市公司仅是宁德时代投资版图的冰山一角，在投资圈内，它早已是CVC领域的“老手”，于水面之下构筑起了一座横跨产业链上下游的庞大投资帝国。</p>\n  <p>企查查数据显示，宁德时代对外投资了158家企业，间接持股企业数量更是数以万计，<strong>通过投资，宁德时代的触手深入锂电原材料、整车、新能源、航空航天、具身智能等多个前沿赛道。直投项目中，先导智能、奇瑞汽车、首航新能、极氪汽车、日联科技、微导纳米等项目已成功IPO。</strong>与此同时，还有大批“宁王系”项目，站在二级市场门外，等待IPO。</p>\n  <p>与此同时，晨道资本、一村资本、恒旭资本、博裕资本、高瓴创投、国策投资、中金资本、普洛斯隐山资本、溥泉资本等多家投资机构的背后，都有宁德时代的身影。</p>\n  <p>其中，溥泉资本由宁德时代CVC“宁德时代新能源产业投资有限公司”持股，是后者的核心产业投资平台。据了解，溥泉资本旗下时代泽远基金历经多轮扩募，目前规模已百亿元，聚焦新能源、新能源汽车产业链、储能、机器人、高端制造、半导体芯片六大核心方向。截至目前，基金已落地近30个优质项目，累计投资金额近60亿元，单个项目平均投资额超2亿元。</p>\n  <p>团队充分发挥产业资本优势，以大比例、低成本方式入局，深度赋能产业链上下游企业。依托宁德时代深厚的产业协同能力，溥泉资本打造了特色化产投模式：一方面深度布局硅碳负极、电池管理系统、能源管理系统等锂电配套企业；另一方面发力通用机器人、智能机械手、自动驾驶矿车等高端制造领域。目前多个被投企业已启动上市申报工作，不少项目即将登陆港股、A股，投资成果丰硕。与此同时，机构同步推进并购基金、早期科技基金、海外美元基金布局，构建起多层次、全周期的投资体系，全面覆盖资源并购、早期科创、成熟项目投资等多个领域。</p>\n  <p>在溥泉资本投资项目中，独角兽银河通用机器人近日可谓风光无两，于今年3月正式宣布完成新一轮25亿元融资。值得关注的是，本次融资也是大基金通过国家人工智能产业投资基金首次出手投资具身智能赛道企业。</p>\n  <p>在宁德时代做LP这条路上，最新一幕发生在��年3月。彼时，天眼查工商信息显示，博裕新智新产（宁波）股权投资合伙企业（有限合伙）发生工商变更，新增宁德时代、腾讯、泡泡玛特、唯品会、宁波金控系、北京国管系、国泰海通系等十余家合伙人，出资额由200万元增至约40亿元。值得一提的是，这不是宁德时代和博裕资本首次合作，据悉，该基金将主要投资于科技、医疗健康、消费品和零售领域的成长期及成熟期企业。</p>\n  <p>不知不觉间，宁德时代的资本触角已经不再只服务于自身的供应链，而开始指向更广泛的财务回报和生态构建。</p>\n  <h2><strong>宁德时代之外，CVC崛起正当时</strong></h2>\n  <p>触手遍布创投圈的宁德时代并非孤例，在这背后其实是一个更大趋势的缩影。</p>\n  <p>CVC即“公司风险投资”，是指具有主营业务的非金融企业通过子公司对创业企业进行股权投资的行为。其核心特征包括依托母公司资源、追求战略协同效应而非单纯财务回报、激励机制受母公司制度约束等。投资对象多集中于与母公司行业关联度高或早期创新项目，退出时优先收购被投企业。</p>\n  <p>中国CVC起步较晚，1998年实达集团投资北京铭泰科技发展公司被视为第一个初具规模的CVC投资案例。随后一段时间发展较为缓慢，直至2010年前后，随着腾讯、阿里巴巴等互联网头部企业相继设立战投部门，中国CVC进入发展窗口期。2013年至2015年，在“大众创业、万众创新”的背景下，CVC投资案例数和金额呈现爆发式增长。近年来，投资主体从互联网巨头进一步扩展到宁德时代、华为哈勃投资等硬科技产业资本。</p>\n  <p>成立于2019年的哈勃投资，由华为投资控股有限公司全资控股，注册资本30亿元，管理规模约70亿元。据企查查数据，哈勃投资对外投资项目共有132个，重点覆盖半导体芯片设计、EDA工具、封装测试、半导体材料与设备等产业链各环节。</p>\n  <p>其中十余个项目已成功IPO，分别是瀚天天成、强一股份、昂瑞微、天域半导体、天岳先进、矽电股份、赛目科技、华丰科技、美芯晟、裕太微、杰华特、源杰科技、唯捷创芯、长光华芯、东微半导、炬光科技、东芯股份……项目清一色属于硬科技赛道。近年来，哈勃投资进一步将触角延伸至AI大模型和具身智能领域，入股了面壁智能、千寻智能、极佳视界等明星企业。</p>\n  <p>在创投圈，联想创投同样是CVC阵营中一股不容小觑的强劲力量。</p>\n  <p>“上一财年，联想创投年投资收益、IPO数量及被投企业生态协同金额等核心数据均创历史新高，交出了一份投资成果与产业价值并举的成绩单。”今年4月1日，联想集团副总裁、联想创投管理合伙人王光熙在联想集团2026/2027财年誓师大会演讲中说道。</p>\n  <p>累计投资超过300家科技企业，其中25家已成功上市；为联想集团年平均贡献收益超10亿元人民币——这是联想创投成立的第十个年头交出的一份可量化答卷。</p>\n  <p>政策层面的鼓励也在同步推进。2025年3月，深圳市发布《深圳市促进风投创投高质量发展行动方案（2025-2026）》，明确支持产业链主企业、上市公司开展企业风险投资（CVC）。“推动我市产业链主企业、大型科技企业和上市公司围绕产业链上下游开展企业风险投资（CVC）、参与上下游协同创新；探索设立面向CVC机构的专业化母基金，联合产业龙头、上市公司等共同出资设立一批‘链主’基金，推动重点产业‘补链强链延链’。”</p>\n  <p>今年4月，上海市国资委发布《关于进一步推动市国资委监管企业私募股权投资基金高质量发展的指导意见》，提出“鼓励监管企业发起设立创业投资基金，着力投早、投小、投长期、投硬科技”“鼓励龙头企业设立企业风险投资基金（CVC基金），围绕创新链布局孵化科创项目”“鼓励监管企业加大S基金、并购基金等组建力度”。</p>\n  <p>政策支持、产业需求、资本转向……在各方利好作用下，将有更多CVC在路上。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/Yak7o1sxORVZ6QwXfe-mjw\" rel=\"noopener noreferrer\" target=\"_blank\">“融中财经”</a>，作者：冯晓亭，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T04:59:03+00:00", "fetched_at": "2026-06-14T03:34:54.026223+00:00", "fingerprint": "051b636309cd3049"}, {"source": "36氪 - 最新文章", "title": "36氪研究院 | AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑", "url": "https://36kr.com/p/3846972367866119?f=rss", "summary": "<p>在AI浪潮重塑全球产业逻辑的当下，传统留学路径所依赖的学历溢价与信息差正在系统性失效，大量高薪专业的基础性任务面临被AI批量化替代的风险。70/80后家长遭遇教育投资回报率骤降，05后年轻一代则陷入人机协同时代“何以确立自身不可替代价值”的身份焦虑。面对旧共识瓦解、新航线未明的历史性分水岭，36氪研究院与新通教育联合发布《AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑》。白皮书基于新通三十年积累的百万级家庭服务数据及36氪研究院对2030年全球新兴产业集群的前瞻研判，倡导回归全生命周期的长期主义，为留学家庭提供一份客观、中立的未来就业生存指南。</p>\n  <h2><strong>从“向外破局”到“向内扎根”：中国留学生三十年心理变迁史</strong></h2>\n  <p>中国留学行业三十年，其底层逻辑是一部中产家庭的教育焦虑与价值观重塑史。留学意义经历了五个阶段的变迁——从生存驱动、打破信息垄断的拓荒破冰，到追逐名校光环的晋升通道，再到就业预期前置的工具理性内卷，继而转入风险规避与心理议题凸显的疫情重塑期，直至当下AI浪潮中意义感赤字、情感支撑成为刚需的新阶段。</p>\n  <p>过去留学的核心驱动力是向外打破信息差；如今，AI加速替代标准化岗位，学历信号与职业回报之间的因果链断裂，留学价值正悄然转向向内构建内核力。读懂这条心理变迁曲线，才能在不确定性洪流中为家庭锚定稀缺的确定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260612/v2_55d528cdc42f41bc82f5a9369f3c901a@6387155_oswg186588oswg837oswg501_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>2030「CORE」未来胜任力模型：AGI时代穿越周期的“专属内核”</strong></h2>\n  <p>36氪研究院针对全球知名企业中层管理者的专项调研显示，AGI时代企业对海归人才的需求已从“唯名校、唯技能”转向“重内核、重潜能”。企业核心需求聚焦四大AI难以替代的深层素养：高效驾驭AI的人机协同能力、化解跨文化冲突的协作能力、抗压担当的韧性，以及洞察需求的人文共情能力。在此基础上提炼形成面向2030的留学生核心竞争力「CORE」模型--决定留学生能否跨越周期不被淘汰的，不再是技能包装或名校标签，而是其不可替代的“专属内核（CORE）”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_231e862526814f9b950ae6569ab7534f@6387155_oswg2854672oswg3356oswg1980_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <h2><strong>告别经验主义：用仿真器，绘制专业价值的新坐标</strong></h2>\n  <p>传统“热门专业即好就业”的线性逻辑，正被AI瓦解——大量标准化任务被自动化，仅凭历史数据判断专业价值的有效性正快速衰减。世界经济论坛预测，到2030年全球将有9200万个岗位被替代，同时新增1.7亿个新岗位，就业市场面临激烈重置。</p>\n  <p>36氪研究院依托深厚的产业洞察、权威评估体系、岗位增长与人才缺口数据，结合中国“十五五”产业方向，构建了以“AI任务自动化风险度”为横轴、“人类护城河深度”为纵轴的专业分析模型，将所有专业划分为三个区域——高护城河区、前沿探索区和审慎选择区。该划分方法的核心在于：AI替代的不是专业本身，而是专业内的特定任务；每个专业实为不同任务区的混合体，各区占比及任务向高自动化区域的迁移速度，决定了其结构性风险暴露程度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5817b0ed4d514159adcaa6926bd28753@6387155_oswg3746695oswg2976oswg2292_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <h2><strong>锚定政策确定性，布局高科技、高效能、高质量产业方向</strong></h2>\n  <p>“十五五”规划纲要首次将“建设现代化产业体系”与“加快高水平科技自立自强”并列为两大打头阵的战略，标志着政策重心从规模扩张转向基础研究和原始创新驱动，资源配置优先级也从技术含量有限的规模化领域转向前沿技术。</p>\n  <p>为此，36氪研究院基于对“十五五”规划纲要的深度研判，结合新质生产力“高科技、高效能、高质量”的标尺，沿“政策导向—产业集群—就业方向”这一逻辑主线，对“十五五”时期七大黄金赛道——“<strong>AI+、低空经济与空天信息、合成生物与生命健康、绿色低碳与ESG、量子技术与前沿材料、智能制造与工业互联、数字出海与全球战略</strong>”展开深度解读，力求为新一轮产业升级中的就业趋势与人才结构性需求研判，提供一份具有前瞻性和战略参考价值的分析框架。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7142093951954ca6aa3ef5ed0bec451a@6387155_oswg5119378oswg3084oswg2376_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <p><strong>本报告重点研究问题如下：</strong></p>\n  <ul>\n   <li>过去三十年中国留学生的心理需求经历了怎样的变迁？留学服务行业又随之发生了怎样的重构？</li>\n   <li>AGI时代，全球高校人才选拔逻辑与企业招聘需求正在经历哪些深层重构？</li>\n   <li>面向2030年，海归人才不可替代的核心竞争力是什么？“2030「CORE」未来胜任力模型”如何定义？</li>\n   <li>如何科学评估不同专业在AI时代的“风险敞口”与“增值潜力”？专业价值坐标体系发生了怎样的位移？</li>\n   <li>“十五五”规划指引下，有哪些值得重点布局的黄金赛道？它们分别对应哪些就业方向与专业选择？</li>\n   <li>在AGI技术深度渗透的背景下，传统专业如何通过“数字跃迁”实现价值升级？</li>\n  </ul>\n  <p>更多精彩内容，详见《AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑》，点击<a href=\"https://pan.baidu.com/s/1r1wZhIVDHBxIQNH75dRhaA?pwd=9f2z\" rel=\"noopener noreferrer\" target=\"_blank\">下载链接</a>，提取码：9f2z</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d03450fb33804b31bb3c7c0cb1491fcd@6387155_oswg3168280oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_452c808b2856488c8d4a7bd2526e779c@6387155_oswg2227422oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_edd5f5c5ff764bac9326b299cf91b34f@6387155_oswg687588oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_c6abb42feea0470c83ac78921a09d398@6387155_oswg334431oswg4762oswg6735_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7aaa31958c8f4ae8a391ca7be88bde45@6387155_oswg2291626oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e17e31a01c17423eb62505c8c19c76cb@6387155_oswg2461360oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_0edfe80002d24c548a860de0f12a6087@63871 er\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_2b811c0eb7b24da59d661554d861ee8d@6387155_oswg3803599oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_86010dc44e99441fba468ba403812ee8@6387155_oswg3029499oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_31734a9e52c745009dae2f42124db1a8@6387155_oswg1648357oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_3a37bbe58ea743d4ab1fff8f3d852797@6387155_oswg1819120oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e08f4d0f68084f43988d7bf82a1537ab@6387155_oswg1946874oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_61b57cfb3ea64bb798b47ca016a6c928@6387155_oswg1340737oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_2529812638a6488a88e8163dd4d71506@6387155_oswg1808856oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>", "category": "tech", "published_at": "2026-06-13T06:00:00+00:00", "fetched_at": "2026-06-14T03:34:54.026217+00:00", "fingerprint": "9d76a1bc4b7aeb24"}, {"source": "36氪 - 最新文章", "title": "曼联，要被卖了", "url": "https://36kr.com/p/3851350342325504?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_e0c77006185f4bd984e08da061c95864@5579416_oswg342733oswg600oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：视觉中国</p>\n  <p>作者/余梦莹</p>\n  <p>报道/投���界PEdaily</p>\n  <p>史上最盛大世界杯正在上演。</p>\n  <p>48支球队、39天、104场比赛，总奖金飙升至8.71亿美元。梅西、C罗、莫德里奇“最后一舞”，哈兰德、姆巴佩、亚马尔崛起，诸神之战拉开帷幕。</p>\n  <p>赛场之外，一家老牌足球豪门却站在了十字路口——彭博社消息，<strong>掌控英超球队曼联超20年的格雷泽家族内部，近期正在讨论出售事宜。</strong></p>\n  <p>绰号“红魔”，这是英格兰足球史上最富盛名的豪门。最初只是铁路工人组建的业余球队，2005年被美国格雷泽家族全面控股。历经辉煌也走过低谷，“红色旗帜永不落幕”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_22d0787e17cb4a178c17f5c69a90dcd1@5579416_oswg242103oswg600oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">红魔</p>\n  <p>这一幕颇为感慨。足球这门生意实在赚钱，越来越多俱乐部被摆上了货架，浸泡在资本的洪流中。</p>\n  <h2><strong>美国大亨，要卖掉曼联了</strong></h2>\n  <p>这也许是“红魔”球迷们日思夜想的一幕。</p>\n  <p>格雷泽，美国商业大亨，最擅长的就是“以小博大”。自2003年起，他开始陆续收购曼联股份，两年后完全控股曼联，成为“红魔”的新东家。</p>\n  <p>彼时，格雷泽家族采取杠杆收购的方式，仅拿出2.7亿英镑便买下了价值7.9亿英镑的曼联，其余都是借款。从此，这家风光无限的足球俱乐部开始了与债务为伴的日子。</p>\n  <p>从一开始，格雷泽家族就不受“红魔”球迷待见。那时西亚资本还没有开始觊觎英超，何况这个外国东家不爱足球只爱赚钱，对于英格兰足球古老的传统可谓是莫大的打击。</p>\n  <p>曾有球星凌晨结束比赛回到俱乐部，第二天就要跑赞助。种种经营下，2005年营业额还不到1.59亿英镑的曼联，2019年收入一跃而至创纪录的6.27亿英镑，商业收入更是达到了2.75亿英镑。</p>\n  <p>更夸张的是，格雷泽先是利用曼联发债5亿英镑再融资，又于2012年推动曼联在纽交所上市，募资2.33亿美元——一半用于还债，一半落入格雷泽家族口袋。</p>\n  <p>入主二十年来��格雷泽家族已在曼联身上赚得盆满钵满，但在管理层面却是每况愈下。终于到了2022年11月，格雷泽家族决定脱手。</p>\n  <p>一番角逐后，两个潜在买家浮出水面——一家是卡塔尔财团，另一家则是英国化工巨头英力士集团，董事长是知名富豪拉特克利夫。最终英力士以约13亿英镑收购曼联25%股份，并全面接管足球运营。</p>\n  <p>时年74岁的拉特克利夫是曼彻斯特人，从小就是曼联的铁杆拥趸。“红魔”终于回到了英国人手中。此后历经几次增资，英力士共持有曼联近29%的股份，格雷泽家族则拥有67.91%的投票权。</p>\n  <p>但前路仍然不算好走。俱乐部此前公布计划，拟在老特拉福德球场附近建设一座可容纳10万人的新球场，项目成本预计约20亿英镑，而这意味着更高的长期资金压力。</p>\n  <p>“目前已有成员试图说服其他家族成员一同加入出售行列。”彭博社报道称。早前就有传闻透露，格雷泽家族静待海外资本报价，只要高于50亿英镑，他们愿意出让合计48.9%的曼联股份。</p>\n  <h2><strong>百年豪门“红魔”，辉煌与失落</strong></h2>\n  <p>曼联的故事几乎可以算作工业时代的缩影。</p>\n  <p>时间回到1878年，兰开夏郡和约克郡铁路公司的一群工人决定组建一支足球队。最初只是为了锻炼和消遣，球场弥漫着蒸汽机车排出的煤烟，球员甚至没有间像样的更衣室。</p>\n  <p>很快，球队转为职业队，加入英格兰足球联赛。但由于实在太穷，一度濒临解散。危急关头，当地富商约翰·亨利·戴维斯注资接管了俱乐部，并于1902年正式更名为曼联。</p>\n  <p>一次转会彻底改变了曼联的命运。那是1906年，主教练曼格纳尔低价挖走了曼城的核心、绰号“威尔士巫师”的比利·梅瑞迪斯。在他的带领下，曼联以创纪录的82个进球夺得队史首个顶级联赛冠军，随后又拿下了首座足总杯冠军。</p>\n  <p>曼联也经历过浴火重生的时刻。</p>\n  <p>上世纪中叶，一位名叫马特·巴斯比的年轻教练接手曼联。他们从全国各地网罗天才少年，集齐一群平均年龄仅22岁的年轻人，这就是大名鼎鼎的“巴斯比的孩子们”（Busby Babes）。</p>\n  <p>这群年轻人有多猛？1956和1957年连夺两届联赛冠军，成为英格兰足球历史上第一支参加欧洲冠军杯的球队。然而命运弄人，慕尼黑一场空难夺走了多位球员的生命，随之而来的是漫长而痛苦的重建工作。</p>\n  <p>所有人都以为曼联会就此倒下，但巴斯比带着球队从废墟中站了起来——1968年，新一代“红魔”在欧冠决赛中战胜葡萄���本菲卡队。赛后巴斯比颤抖着将冠军杯高高举起了8次，构成曼联历史上极富冲击性的一幕。</p>\n  <p>“红魔”队名也是来自这一时期——50年代，萨尔福德队身穿红色球衣在法国巡回比赛，凭借辉煌的不败战绩被球迷形象称呼为“红魔”。恰逢曼联球队重建，时任主帅巴斯比注意到了这个名字，遂借用过来送给曼联。</p>\n  <p>那之后，“红魔”的绰号在球迷间流传开来。1973年，俱乐部正式将手持三叉戟的红魔鬼形象加入了队徽，至此成为俱乐部闻名的标志。</p>\n  <p>伴随巴斯比爵士功成身退，曼联一度陷入多年的沉寂，直到1986年亚历克斯·弗格森接过教鞭。大家仍记得1999年的巴塞罗那，曼联成就了史无前例的“三冠王”，成为弗格森执教生涯的最高峰。</p>\n  <p>“逆转的感觉很好，永不放弃是我们的传统。”细数下来，这位倔强老人共为曼联拿下了37个冠军，带领球队打了1000场联赛。放眼当今足坛，这样的数字称得上一个传奇。</p>\n  <p>惋惜的是，弗格森退休后曼联仿佛失去了灵魂，球队竞争力大不如前，甚至在2024-25赛季创下了英超时代最差的第15名。时至今日，曼联依然在试图找回昔日荣光。</p>\n  <p>但它的故事远未结束。正如那首著名的队歌所唱：“Glory, Glory, Man United……”（光荣，光荣，属于曼联……），红魔精神，仍在继续。</p>\n  <h2><strong>体育资产重估时代</strong></h2>\n  <p>时至今日，越来越多体育项目裹挟上了资本的外衣。</p>\n  <p>今年3月，NBA官方宣布，联盟董事会批准将开拓者队出售给由汤姆·邓顿领导的投资者集团，估值高达42.5亿美元。收购方阵容豪华——除核心掌舵人、美国知名商人邓顿外，还包括投资公司CollectiveGlobal首席执行官希尔·泰尔、BlueOwl联合总裁马克·扎、熊猫快餐所有者程氏家族等等。</p>\n  <p>至此，这家由微软联合创始人保罗·艾伦及其家族掌控了38年的球队迎来了新主人。</p>\n  <p>回望过去一年，球队出售控股权的估值记录被两度打破——</p>\n  <p>先是凯尔特人队，以61亿美元的估值卖给了私募股权大亨比尔·奇泽姆（Bill Chisholm）领衔的投资集团。交易堪称一笔完美的高位套现——此前球队刚刚夺得创纪录的第18冠。</p>\n  <p>仅仅两个月后，洛杉矶湖人队就被曝出售给TWG Global CEO兼洛杉矶道奇队老板马克·沃尔特（Mark Walter），交易估值100亿美元（约720亿人民币），一举缔造职业体育球队最高估值。</p>\n  <p>这是NBA史上最负盛名的球队之一。47年前，杰里·巴斯花费6750万美元买下了它，期间收获荣誉无数。此后长女珍妮·巴斯接管湖人队，直到今天，这笔交易增值近150倍。</p>\n  <p>一个时代背景是：投资体育已变成一件极为性感的事。</p>\n  <p>数据显示，过去20年里，北美四大职业男子体育联盟（NBA、NFL、MLB和NHL）的特许经营权表现优于大多数其他资产类别，实现了13.2%的年化回报率，过去一年更是达到了16.9%，仅次于媒体和娱乐业。</p>\n  <p>以NBA为例，最近几年NBA球队出让的估值一路上涨，每一次涨幅几乎都在十亿级别以上。行情如日中天，很多NBA老板纷纷开始出卖手中股权。</p>\n  <p>此外还有：阿布扎比联合财团主导的城市足球集团，先后入股了曼城、纽约城、墨尔本城等地的足球俱乐部；沙特公共投资基金买下纽卡斯尔联80%的股权；阿波罗通过专项体育基金协议收购马德里竞技俱乐部55%的股权……明码标价的球队数不胜数。</p>\n  <p>这些俱乐部既是文化机构也是金融资产，它们的稀缺性、全球影响力和品牌价值足以使其成为亿万富翁、家族办公室和机构投资者梦寐以求的配置标的。</p>\n  <p>当然，买卖球队并非一劳永逸。譬如“红魔”球迷们声讨格雷泽家族，资本的短期回报与俱乐部长久生存之间天然存在着矛盾，而这往往会伴随对原始文化根基的冲击。</p>\n  <p>但就像一直有人管湖人主场叫“斯台普斯”，当这些球队被扔进一个全新而精密的资本机器中运转，它也许会就此改变自己的基因。同时，也永远会有新球迷穿上球衣，坐在观众席为其呐喊。</p>\n  <p>如此，构成了竞技体育最富魅力的时刻。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/A0x2o3FrvT8AuKymfvClog\" rel=\"noopener noreferrer\" target=\"_blank\">“投资界”</a>，作者：余梦莹，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T08:37:21+00:00", "fetched_at": "2026-06-14T03:34:54.026209+00:00", "fingerprint": "61a4c9339ea4e22b"}, {"source": "36氪 - 最新文章", "title": "高瓴出手了一家消费级柔性机器人公司，要把“大白”从电影搬进现实家庭｜硬氪首发", "url": "https://36kr.com/p/3851572421432324?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，消费级柔性机器人公司SoulX日前已完成数千万元天使轮融资，投资方为高瓴创投，向阳资本担任独家财务顾问。资金将重点投入产品持续迭代、技术研发，并加快供应链与规模化交付体系搭建。首款机器人产品MoYa将于2026年下半年正式发布。</p>\n  <p>SoulX隶属于深圳市弘火智能科技有限公司，团队长期专注于柔性机器人技术与睡眠、压力与家庭健康关护。公司以睡眠场景为切入点，自主研发了睡眠安抚机器人MoYa。该产品融合机器人技术、神经科学与心理学，采用无摄像头设计，通过模拟拥抱帮助用户缓解身心压力。</p>\n  <p>家庭场景下的情感与健康关护，长期面临一个“人机关系”设计上的根本问题：在需要身心双重安抚的场景里，机器应该以怎样的方式“在场”？</p>\n  <p>过去几年，不同产品从多个维度给出答案。智能床垫、白噪音机擅长改善环境与生理舒适度；可穿戴设备精于睡眠数据的连续监测；毛绒玩具在情绪投射与安全感的建立上有天然优势；新兴的AI对话机器人则在更自然的表达，促进沟通方面快速迭代。</p>\n  <p>触觉安抚传递物理层面的安全感，语言疏导实现心理层面的释放，睡眠障碍与情绪内耗往往需要二者在同一时间、同一场景下协同工作：身体放松为心理释放创造条件，心理释放反过来进一步降低生理紧张。但长期以来，这两条路径被拆分成独立的产品体系，各自回应用户身心安抚的某一个侧面。</p>\n  <p>SoulX创始人兼CEO郑潜捕捉到了这一功能断层。他没有选择更复杂的动作或更聪明的对话，而是从触觉神经科学出发，以柔性机器人为载体，试图将“触觉安抚”与“认知卸载”两大功能，整合进其首款睡眠安抚机器人产品MoYa当中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_2d8a7fc7d0bd4781914a3b00ea772f16@6022551_oswg2356535oswg1920oswg1440_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa（图源/企业）</p>\n  <p>“大部分睡眠问题不是温度、支撑或时长的问题，而是神经系统一直处于紧绷和警觉的状态。”郑潜告诉硬氪，“当人们的大脑停不下来，前额叶过载，不仅会久久难以入睡，长此以往甚至会形成躯体化反应。”针对这一生理性痛点，研发团队确定了MoYa的核心功能定义：不停留在优化睡眠的物理参数层面，而是帮助用户完成从高唤醒状态到放松状态的神经切换。</p>\n  <p>触觉安抚是实现这一切换的关键路径。温和的按压和有节奏的拍抚能够激活迷走神经，降低皮质醇。但如何让一个机器人在家庭中跟人能安全地完成“拥抱”？SoulX团队选择在MoYa中植入了一套自研的柔性气动材料，结构与控制算法。</p>\n  <p>不同于传统电机驱动的机器人，MoYa采用气泵驱动替代电机，运行过程中几乎没有噪音，力度也更容易控制。即使用户整个身体施压状态下，也可以有效避免夹伤或磕碰的风险，这种天然的安全性令其更贴近适合睡眠场景使用。</p>\n  <p>它没有电机关节，而是一个可以精确控制充气放气的软体系统。其中，机器人的胸前和后背分布着多个触觉传感器，可以实时监测压力与面积的变化，为气压调节提供闭环反馈。当用户提出“抱紧一点”，气泵增加气压，机器人的身体从多方向膨胀，产生大面积且均匀的深层压力。</p>\n  <p>除了拥抱时的力度调节，MoYa还搭载了节律安抚与生理同步算法。它会跟随用户的呼吸节律进行安抚拍抚，在舒缓压力的同时不会干扰睡眠。这种同步不是固定的节奏，而是通过传感器感知用户的呼吸频率，动态调整拍抚的间隔和力度，让机器人的动作与用户的身体自然合拍。</p>\n  <p>看似自然的拥抱，背后并不是一个简单的硬件功能。柔性机器人需要同时解决本体结构、材料特性、非线性运动控制、触觉反馈、消费级泵阀、噪声与振动、耐久性和量产一致性等问题。SoulX已围绕柔性本体、底层控制和消费级气动供应链形成多层技术积累。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_d2cb5f9f3c144713934f07a2fc9961a2@6022551_oswg700927oswg1002oswg742_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa（图源/企业）</p>\n  <p>在交互层面，MoYa遵循“被动触发”的原则，这是睡眠场景的特殊性决定的。MoYa不会主动发起动作，而是当用户触碰或者发出语音指令时才响应。</p>\n  <p>“从静态毛绒过渡到安抚机器人，人的心理认知是有阻碍的。人真的准备好跟一个机器人相处了吗？我觉得用户需要时间去认同并接受。”郑潜说，“所以我们在产品定义时就确定了，MoYa得被动，得少自由度，也不加复杂的行为模式。用户不需要说明书，而是在看到产品就会天然地知道如何与它互动：抱它，拍它，跟它说话，此时它才会有反应，进而把认知障碍降到最低。”</p>\n  <p>硬氪了解到，MoYa首代系统已完成关键链路验证，小范围批量测试正在推进。这意味着柔性机器人从技术展示走向消费产品，正显现出一条清晰可行的路径。也正因为本体、控制、供应链与体验高度耦合，这是一条很难依靠单点能力快速复制的路线。</p>\n  <p>而安全进入家庭，正是所有技术决策的前提。</p>\n  <p>郑潜告诉硬氪，其产品迭代也需要逐步“减少棉花的作用”，让柔性机器人本体本身承担更多包裹、支撑与动作表达。</p>\n  <p>在验证了一套技术方案可行性的基础上，SoulX的野心不止于做一个睡眠机器人产品。</p>\n  <p>MoYa是家庭关护机器人的第一步，更长期的方向，则是面向家庭近距离交互的刚柔耦合机器人：该柔的时候柔，该刚的时候刚。</p>\n  <p>家庭关护的核心入口，不在于叠加更多功能，而在于重新理解“在场”的含义。睡眠场景提供了高频、刚需、低侵入性的验证环境，而柔性气动技术与心智Agent的组合，构成了从睡眠到卧室再到全屋关护的可扩展技术基座。</p>\n  <p>依托现有行为追踪、RPPG无接触心率监测等感知能力，产品早已跳出普通睡眠摆件的局限，可精准捕捉用户生理与情绪波动，主动提供适配当下场景的温柔陪伴，切实改善睡眠状态、逐步引导健康作息。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_789a0ff6780041588dfa126fee5ae70f@6022551_oswg1159903oswg1600oswg1066_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa在BEYOND Expo展会（图源/企业）</p>\n  <p>随着未来视触觉多模态交互能力持续落地迭代，SoulX将从睡眠伴侣延伸至卧室情绪管家，再到覆盖全屋的关护中枢，彻底摆脱被动应答的传统逻辑，基于全方位实时感知主动捕捉用户潜在需求，进一步拓宽家庭智能关护机器人的能力边界。</p>\n  <p>更深层的价值，来自长期多模态数据沉淀形成的认知能力。郑潜把这套系统称为“家庭动态心智档案”。它不仅仅是增加聊天记忆，而是持续记录生活线索、情绪周期和家庭成员之间的互动模式，逐步构建一个具备预测能力的“心智世界模型”，并成为一个能理解“这个今天发生了什么”的智能家庭成员。</p>\n  <p>在技术不断追逐更强大、更智能的当下，可以说，MoYa做的事情并不复杂。它学会轻柔安抚的拥抱，记住用户的心事，在合适的时刻默默陪伴左右。</p>\n  <p>夜晚来临，当一个人抱着柔软的躯体感受舒缓轻拍，听它说出贴合当下心境的宽慰话语，这份被陪伴的宁静，或许比任何精密的算法都更接近关护的本质。</p>\n  <p><strong>以下为硬氪与SoulX创始人兼CEO郑潜的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：市面上不少陪伴类产品追求高自由度、主动交互，</strong>MoYa<strong>却采用了被动触发的设计。这个选择的背后逻辑是什么？如何规避用户短期新鲜感消退、闲置吃灰的问题？</strong></p>\n  <p><strong>郑潜：</strong>这是核心场景适配层面的关键取舍。睡眠、卧室休憩场景存在天然变量，用户摆放、抱持设备的姿态完全无固定标准，机身位置、朝向随时变化。如果叠加高自由度自主运动结构，机器人在用户靠近时突然转头或发生其他动作异动，很容易触发恐怖谷效应，给用户带来强烈不适感。</p>\n  <p>人类对动态智能载体存在天然心理认知门槛，从静态毛绒物件到自主活动机器人的切换，心理接受度存在明显断层，这也是目前大多数产品忽略的关键体验问题。</p>\n  <p>针对床、沙发这类近距离居家场景，我们选择低自由度、被动响应架构，仅在用户触碰、拥抱、语音交互时触发反馈，最大限度降低用户心理隔阂。线下实测也能印证这套逻辑，用户不用阅读说明书就能自然懂得抱握、轻拍、对话的交互方式，学习成本几乎为零。</p>\n  <p>用户留存与使用粘性我们并不担心，主要三个方面。第一是产品尺寸比较大、60公分，放置于床面具备强视觉在场感，很难被忽略； 其二，触觉安抚具备先天生理成瘾性，源于人自幼的依恋心理，拥抱、轻拍带来的舒缓体感，能形成稳定使用习惯； 其三，设备搭载持续记忆对话能力，作为居家专属陪伴载体，用户有倾诉情绪、分享日常的交互诉求。</p>\n  <p>初步种子用户测试显示，MoYa的使用高峰集中在睡前放下电子设备、晨起与归家休整三个场景。</p>\n  <p>在连续两周的小范围测试中，用户人均每日发起约3至4次拥抱或节律安抚，单次交互通常持续数分钟；部分活跃用户会在睡前与MoYa持续展开更深入的沟通。从用户反馈来看，约七成用户感觉使用后更容易从紧绷状态逐渐放松；超六成用户认为，睡前安全感或入睡体验有所改善。</p>\n  <p>目前我们也在扩大测试样本，并结合主观量表、HRV等生理指标完成进一步验证。</p>\n  <p><strong>硬氪：</strong>MoYa<strong>的长期记忆不是简单存储对话历史，而是构建“家庭心智图谱”。这套系统具体会捕捉哪些信息？相较于常规对话机器人的记忆能力，它的差异化设计体现在哪些方面？</strong></p>\n  <p><strong>郑潜：</strong>二者底层逻辑完全不同。我们这套心智图谱存储的不是标准化统计标签，不会单纯记录用户睡眠时长、作息数字这类孤立参数，沉淀的记忆是关于你个人的生活线索，完整留存用户日常里细碎的生活叙事与情绪线索，包括跟朋友、跟家人相处、工作琐事等各类细节。我们管它叫“心智画像”。</p>\n  <p>举个直观例子，系统不会只标记“用户压力大、失眠”，而是完整留存对话上下文，比如和上司产生矛盾、当日摄入大量咖啡、自家宠物身体不适、长期入睡困难这类连贯事件。所有信息都会站在用户的视角串联成完整叙事脉络，而非零散数据。</p>\n  <p>这也造就了独有的连续交互能力，当用户再次提起相关话题，设备会主动承接过往细节去组织的叙事图谱，主动关心“你那只猫好点了吗？”“你今天还喝那么多咖啡吗？”，这种记忆连贯性，恰恰是拉近情感、建立亲密陪伴感的核心。</p>\n  <p>同时，它的感知不会局限于单次对话内容，而是持续追踪用户的情绪起伏、压力来源、睡眠变化，形成动态、多维度的完整用户认知。放在过去，能完整记住我们所有细碎心事、长期留意身心状态的，往往是家人或挚友，而SoulX团队希望能把这种长期共情记忆能力落地在机器人上。这也是它和通用聊天机器人最大的区分点。</p>", "category": "tech", "published_at": "2026-06-14T01:30:00+00:00", "fetched_at": "2026-06-14T03:34:54.026195+00:00", "fingerprint": "fd4514e07d82e836"}, {"source": "少数派", "title": "具透 | 除了 AI，iOS 27 首个开发者测试版中你不能错过的新功能", "url": "https://sspai.com/post/110973", "summary": "少数派在体验了新版系统之后，帮你整理了 iOS 27 中值得关注的新功能和新特性，希望帮你能了解新版系统的方方面面。<a href=\"https://sspai.com/post/110973\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-13T02:37:12+00:00", "fetched_at": "2026-06-14T03:34:52.370333+00:00", "fingerprint": "7b5405883437281f"}, {"source": "BBC World News", "title": "Discovery of €1.2m jewellery prompts fresh probe into former Spanish PM", "url": "https://www.bbc.com/news/articles/cjeg9p1xqdwo?at_medium=RSS&at_campaign=rss", "summary": "José Luis Rodriguez Zapatero is suspected of being unable to show proof he paid import duties on the jewellery.", "category": "politics", "published_at": "2026-06-12T15:55:46+00:00", "fetched_at": "2026-06-13T02:56:55.572023+00:00", "fingerprint": "6759c72f41be88ed"}, {"source": "BBC World News", "title": "French town buries murdered child as questions mount over police failings", "url": "https://www.bbc.com/news/articles/cy9rq21dqego?at_medium=RSS&at_campaign=rss", "summary": "The prime suspect in the killing of Lyhanna, 11, was reported to police nine months prior but never questioned.", "category": "politics", "published_at": "2026-06-12T16:19:12+00:00", "fetched_at": "2026-06-13T02:56:55.572018+00:00", "fingerprint": "aaf5aaf1ffab8133"}, {"source": "BBC World News", "title": "Elon Musk becomes world's first trillionaire as SpaceX soars in stock market debut", "url": "https://www.bbc.com/news/articles/c4gypy3wwl7o?at_medium=RSS&at_campaign=rss", "summary": "Musk is now worth $1.11tn according to the Bloomberg rich list, while SpaceX listed on the Nasdaq stock exc
