n help speed up the process. It&#8217;s currently on sale for $59.99 ($20 off) at Amazon, matching its best price to date.&#160; From tightening loose screws on furniture to repairing electronics, the [&#8230;]", "category": "tech", "published_at": "2026-07-06T20:24:28+00:00", "fetched_at": "2026-07-07T02:41:10.154882+00:00", "fingerprint": "90cf464d0499a275"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜佑驾创新正式发布四轮足机器人；千问大模型升级实时语音识别大模型Fun-ASR-Realtime", "url": "https://36kr.com/p/3884024701874183?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>郭明錤爆料最新苹果折叠手机：出货量明显不足，或重现“饥饿营销”</strong></p>\n  <p>知名分析师郭明錤分析指出，苹果可折叠iPhone预计2026年下半年出货，但初期供应可能不足。他称自己的行业调查显示，2026年下半年可折叠iPhone的组装出货量约为700万至800万部，第三季度出货量约为50万至100万部，约占苹果总出货量的10%。该产品价格可能在2300至2500美元左右，而供应限制将导致转售价格溢价50%至100%。他认为判断可折叠iPhone销售前景的关键在于2026年末至2027年第一季度。（财联社）</p>\n  <p><strong>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</strong></p>\n  <p>36氪获悉，千问大模型正式升级实时语音识别大模型Fun-ASR-Realtime——一款首字延迟控制在百毫秒级别、识别准确率接近离线模型的流式语音识别模型，支持16种方言和30种语言。</p>\n  <p><strong>沙利文全栈AI云服务报告：阿里云占比40.1%</strong></p>\n  <p>36氪获悉，7月6日，国际市场调研机构沙利文发布《开箱即用的AI云服务——2025中国全栈AI云服务市场报告》。报告显示，2025年中国IaaS、PaaS、MaaS总市场规模达595.9亿元，其中阿里云总收入达239亿元，以40.1%的市场份额位列第一，稳居中国最大AI云服务厂商。</p>\n  <p><strong>宇信科技：公司通过投资专项基金来投资月之暗面股权</strong></p>\n  <p>36氪获悉，宇信科技在互动平台表示，公司通过投资专项基金来投资月之暗面股权。</p>\n  <p><strong>贝斯特：人形机器人业务仍处样品阶段</strong></p>\n  <p>贝斯特公告，公司股票连续3个交易日收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。公司关注到市场对人形机器人等热点概念关注度较高，但公司人形机器人零部件业务仍在样品阶段，2026年上半年相关样品实现营收22.30万元，占公司营收比重约0.03%，业务规模较小，对公司业绩不产生重大影响，未来收益存在重大不确定性。（第一财经）</p>\n  <p><strong>永鼎股份：预计2026年上半年归母净利润5亿元-7亿元，同比增长57%-120%</strong></p>\n  <p>永鼎股份7月5日公告，经江苏永鼎股份有限公司财务部门初步测算，预计2026年半年度实现归属于上市公司股东的净利润50,000万元到70,000万元，与上年同期（法定披露数据）相比将增加18,147万元到38,147万元，同比增加57%到120%。（界面新闻）</p>\n  <h2>投融资：</h2>\n  <p><strong>“开普动能”近期连续完成种子轮及天使轮融资</strong></p>\n  <p>36氪获悉，“开普动能”近期连续完成种子轮及天使轮融资，两轮融资合计金额达数千万元人民币，由零以资本领投、新鼎资本跟投，唯快资本担任长期财务顾问。</p>\n  <p><strong>浙江东方：预计上半年净利润8.72亿元，同比增长约114.25%</strong></p>\n  <p>36氪获悉，浙江东方披露业绩预告，预计2026年上半年归属于母公司所有者的净利润8.72亿元，同比增长约114.25%。</p>\n  <p><strong>大陆集团40亿欧元剥离ContiTech，战略转型聚焦轮胎业务</strong></p>\n  <p>德国大陆集团以40亿欧元出售旗下塑料和橡胶业务ContiTech给孤星基金，预计年底完成交易。此次出售是大陆集团转型为纯粹轮胎制造商战略重组的最后一步，旨在应对全球汽车市场低迷。（界面）</p>\n  <h2>新产品：</h2>\n  <p><strong>腾讯混元Hy3正式发布</strong></p>\n  <p>36氪获悉，7月6日，腾讯混元Hy3正式发布。相比preview版本，它展现出显著强于同尺寸模型且比肩（参数规模2—5倍的）旗舰模型的智能水平，定价进一步降低。据了解，Hy3已在WorkBuddy/CodeBuddy、元宝、Marvis、ima等多个业务接入，API已在腾讯云TokenHub上线，多个海外API平台也将陆续接入。</p>\n  <p><strong>美团LongCat-2.0正式开源</strong></p>\n  <p>36氪获悉，7月6日，美团宣布正式开源LongCat-2.0全部模型权重、推理引擎与核心技术文档。同日，华为昇腾、摩尔线程、沐曦股份等国产芯片厂商，集体宣布完成对该模型的推理适配工作。</p>\n  <p><strong>佑驾创新正式发布四轮足机器人</strong></p>\n  <p>36氪获悉，7月6日，佑驾创新正式发布“Combo”全链路无人物流闭环方案，由其旗下曜行动力打造的四轮足式机器人同步亮相。</p>\n  <h2>今日观点：</h2>\n  <p><strong>野村证券：市场对于“算力过剩”的担忧可能过度了，韩国芯片投资难以快速转化为产能</strong></p>\n  <p>野村证券分析师在最新报告中表示，市场对于“算力过剩”的担忧可能过度了，存储芯片行业距离下行周期还有很长的路要走。市场实际上目前正面临由人工智能需求引发的严重短缺，由于各大芯片厂厂商优先生产利润更为丰厚的高带宽内存（HBM），导致普通DRAM和NAND的供应受限。野村分析师强调，在这样背景下，对于供应过剩的担忧实属过度。由于半导体产业建设和开发周期往往需要很长时间，韩国芯片巨头宣布的项目在数年内可能都不会对供应产生实质性影响。（财联社）</p>\n  <p><strong>华泰证券：关注港股���沽空叠加盈利预期改善的方向</strong></p>\n  <p>36氪获悉，华泰证券研报指出，港股短期建议关注沽空压力较重、盈利预期边际企稳或改善的超跌品种（创新药、电力公用事业等）及高股息防御（银行）。其中创新药基本面继续向上，全球风格再平衡中开始出现补涨，短期空头回补有望延续，建议重点关注业绩指引积极的CXO以及BD潜力大的龙头。对于AI硬件链，短期进一步增配的性价比不高，下一个关键窗口在7月的美股财报季，建议根据浮盈程度对应调整配置敞口。AI软件方面更多是模型领先的个股Alpha机会。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>今年我国电影全产业链产值超2000亿元</strong></p>\n  <p>7月5日消息，2026年暑期消费市场活力涌动，“光影经济”亮眼出圈。在这个“电影的夏天”，超90部类型丰富的影片集中上映，持续点燃大众观影热情。一张小票根连接文旅、商圈、餐饮等多元业态，影院商圈 “双向引流”，观影流量拉动消费增量。今年我国电影全产业链产值已超2000亿元。为持续释放行业动能，国家电影局、市场监管总局出台新规，支持影院业态融合、特色化经营与视听技术升级，推动传统放映厅向沉浸式综合文化空间迭代。内容供给、产业联动、政策赋能多重红利叠加，持续为暑期消费市场注入强劲新活力。（央视财经）</p>", "category": "tech", "published_at": "2026-07-06T10:39:24+00:00", "fetched_at": "2026-07-07T02:41:09.995950+00:00", "fingerprint": "94395b0c5f778400"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨SK海力士本周五将登陆纳斯达克；99万机器人“伴侣”续航撑不过一晚？优必选回应；青海省博物馆回应“国家一级文物发现TCL字样”", "url": "https://36kr.com/p/3884831072514309?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>华为Mate90系列有望搭载基于韬定律的新麒麟芯片</p>\n  <p>央视曝光滴眼液涉事企业被立案，对滴眼液乱象开展调查处置&nbsp;</p>\n  <p>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</p>\n  <p>WPS回应“滥收费、背刺用户”言论</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>SK海力士10日在纳斯达克上市290亿美元规模ADR，创外资企业史上最大规模</strong></p>\n  <p>据报道，SK海力士将以约44万亿韩元规模的美国存托凭证（ADR）在纳斯达克上市，挑战外资企业在美国股市上市的历史最大规模。纳斯达克上市后，SK海力士可在美国正规市场进行交易，并获得纳入纳斯达克100等主要指数的资格，追踪相关指数的交易所交易基金（ETF）的买入资金流入也备受期待。不过，也有声音对AI存储半导体板块的急涨势头是否过热提出警示。随着大型科技企业持续通过债券和股票市场筹集数据中心投资资金，外界对存储行业景气能否持续的担忧与日俱增。（界面新闻）</p>\n  <p><strong>99万机器人“伴侣”续航撑不过一晚？优必选：属行业普遍情况</strong></p>\n  <p>近日，优必选最新发布的全尺寸超仿生机器人U1备受外界关注，其中U1 Ultra男版价格高达99万元，但续航却仅能维持2到4小时，“撑不过一晚”，因此遭到外界质疑。7月6日，优必选方面回应界面新闻称，目前全尺寸人形机器人续航基本上都在2-4小时，这是行业普遍情况。优必选面向家庭和个人的仿生机器人主要是半身版U1 Lite和高配全身版U1 Pro，U1 Ultra是高动态版本，面向商业场景。优必选方面还强调，仿生机器人定位是情感陪伴，这是国家提倡和认可的方向，不是男友、女友或者伴侣。（界面新闻）</p>\n  <p><strong>青海省博物馆回应“国家一级文物发现TCL字样”&nbsp;</strong></p>\n  <p>近日有网友关注到，中国工艺美术馆举办的艺术展上，国家一级文物永乐款鎏金铜观音菩萨像展柜内，从造像下方仰观，观音裙摆、脚踝区域能清晰看见TCL字样。2026年7月6日上午，澎湃新闻致电青海省博物馆，一位工作人员介绍，网友看到的TCL广告字样是一张报纸。这位工作人员介绍，这尊永乐款鎏金铜观音菩萨像2000年左右从瞿昙寺移交至青海省博物馆时，文物的这处就有这张报纸，这张报纸起到封底的作用。</p>\n  <p>佛像封底通常是“装藏”的最后一步。“装藏”是佛教造像仪轨的一项重要内容，是指在塑造或建造好的佛像、佛塔内装入圣物，以此来赋予塔像“神力”的行为。从目前的考古发现来看，已有一些能明确体现装藏的例子，但并不多见。上述工作人员提到，这尊菩萨像封底损坏了，为防止里面的香灰、柏香等物品掉落，瞿昙寺的僧人用报纸封住。“那时候条件没这么完善，没有海绵、无酸纸等这种包装。”这位工作人员解释，用报纸是很常见的操作。</p>\n  <p>此外，青海省博物馆另一位工作人员还提到，瞿昙寺僧人用报纸封底之后，为了保护文物，移交到青海省博物馆之后他们没有再打开。从藏传佛教装藏的情况来看，里面都会有香灰、柏香，有些保存好的装藏还会有经书、宝石。另据青海省文物局一位工作人员介绍，2026年7月5日晚，青海省博物馆已组织专家和技术人员飞赴北京核实文物底部出现TCL字样一事，核实后第一时间会发布情况说明。（澎湃新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_b84b947b83744afcb2e648db1bb17f5a@5667365_oswg26317oswg800oswg440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <h2>AI最前沿</h2>\n  <p><strong>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</strong></p>\n  <p>36氪获悉，千问大模型正式升级实时语音识别大模型Fun-ASR-Realtime——一款首字延迟控制在百毫秒级别、识别准确率接近离线模型的流式语音识别模型，支持16种方言和30种语言。</p>\n  <p><strong>微软Teams加强第三方AI智能体权限管理��需会议组织者确认后方可放行</strong></p>\n  <p>微软发文，宣布为Microsoft Teams会议应用推出全新的AI机器人管理策略，当第三方AI机器人尝试加入会议时，必须先获得会议组织者批准后才能进入。据介绍，目前微软已在Teams管理中心新增“Manage external bots and their access to meetings”管理策略，该功能默认启用，管理员可将该策略应用于指定用户或用户组，当Teams检测到外部AI机器人尝试加入会议时，会先将其置于会议等候室（Lobby），只有在会议组织者确认批准后，机器人才能正式加入会议。当然管理员也可根据企业需求选择关闭这一功能。（新浪财经）</p>\n  <p><strong>腾讯混元Hy3正式发布</strong></p>\n  <p>36氪获悉，7月6日，腾讯混元Hy3正式发布。相比preview版本，它展现出显著强于同尺寸模型且比肩（参数规模2—5倍的）旗舰模型的智能水平，定价进一步降低。据了解，Hy3已在WorkBuddy/CodeBuddy、元宝、Marvis、ima等多个业务接入，API已在腾讯云TokenHub上线，多个海外API平台也将陆续接入。</p>\n  <p><strong>英伟达AI服务器架构据传将延后推出，公司回应称路线图并没有改变</strong></p>\n  <p>由于有消息称英伟达的下一代人工智能（AI）服务器机架架构因制造困难将推迟一年以上推出，亚洲印刷电路板（PCB）板制造商的股价重挫。研究机构SemiAnalysis在X平台发文称，英伟达Kyber NVL144架构系统在PCB制造环节遭遇挫折。英伟达发言人通过书面声明回应称，“我们的路线图并没有改变”。（新浪财经）</p>\n  <p><strong>沙利文全栈AI云服务报告：阿里云占比40.1%</strong></p>\n  <p>36氪获悉，7月6日，国际市场调研机构沙利文发布《开箱即用的AI云服务——2025中国全栈AI云服务市场报告》。报告显示，2025年中国IaaS、PaaS、MaaS总市场规模达595.9亿元，其中阿里云总收入达239亿元，以40.1%的市场份额位列第一，稳居中国最大AI云服务厂商。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>苹果首款折叠屏iPhone Ultra，今年最多产不到千万台</strong></p>\n  <p>7月6日，博主定焦数码爆料，苹果首款折叠屏iPhone Ultra目前已开始小批量生产，最快将在本月底进入大规模量产阶段。由于国内代工厂生产人员紧缺，相关产线正在紧急招工，用工需求十分迫切。值得注意的是，蓝思科技集团近日发布了大规模急招信息，扩招岗位涵盖操作工人、质检员、包装员、技术员等多个类别，月薪5500至7500元，提供包吃住待遇并报销路费，无经验者亦可入职。业界普遍认为，蓝思科技此次集中扩招，极有可能是在为苹果折叠屏iPhone Ultra的量产做人力储备。（快科技）</p>\n  <p><strong>华为Mate90系列有望搭载基于韬定律的新麒麟芯片</strong></p>\n  <p>7月6日，从知情人士处获悉，将于今年秋季发布的华为Mate90系列，计划搭载基于韬定律的新麒麟芯片。华为于今年5月发表了指导半导体产业发展的新原则——韬（τ）定律，其目标是以系统性降低时间常数τ为核心，通过逻辑折叠等技术，持续压缩芯片内部的信号传播时延，从而不断提升晶体管密度，实现半导体与电子系统的持续演进。而将于2026年秋季面世的麒麟芯片，率先采用了逻辑折叠技术，性能大幅提升。（财联社）</p>\n  <p><strong>中公教育：公司近期生产经营情况正常，内外部经营环境未发生且未预计将要发生重大变化</strong></p>\n  <p>36氪获悉，中公教育公告，公司近期生产经营情况正常，内外部经营环境未发生且未预计将要发生重大变化。公司目前没有任何根据深交所《股票上市规则》规定应予以披露而未披露的事项或与该事项有关的筹划、商谈、意向、协议等；董事会确认公司不存在有根据深交所的规定应予以披露而未披露的、对公司股票交易价格产生较大影响的信息；公司前期披露的信息不存在需要更正、补充之处。</p>\n  <p>36氪获悉，深交所发布通报，2026年7月6日，中公教育股票价格出现异常波动，上市公司已发布交易风险提示公告。深交所密切监控该股交易情况，对影响股票正常交易秩序的异常交易行为，依规对相关投资者采取了暂停交易等监管措施。深交所提醒广大投资者关注投资风险，合规审慎交易。</p>\n  <p><strong>WPS回应“滥收费、背刺用户”言论</strong></p>\n  <p>7月6日，针对近期有关“WPS滥收费、背刺用户”的言论，金山办公WPS办公助手发文回应称：WPS免费基础功能在持续增加，从未、也不会将已有免费基础功能变成收费功能；会员权益不上移、不缩水，极个别权益因体验、技术或合作原因确需下架，会提前公告并给出解决方案；少数第三方服务和AI办公智能体等高成本服务，会通过独立权益包或按量计费提供，用户可按需购买，并与WPS会员权益明确区分。（第一财经）</p>\n  <p><strong>快手：腾讯持股比例将由约15.68%下降至9.37%，不再为本公司主要股东</strong></p>\n  <p>36氪获悉，快手公告，已获悉腾讯控股有限公司于2026年7月6日（交易时段后），透过场外大宗交易方式向若干买方出售合共272,947,700股本公司B类股份，该等买方为若干独立第三方且与本公司及其关连人士并无关连。出售事项完成后，腾讯持股比例将由约15.68%下降至9.37%，并不再为本公司主要股东。腾讯表示，其对本集团长远发展前景拥有信心，双方亦会继续维持共赢关系，包括延续双方的战略合作。本公司预期出售事项将不会对本集团营运产生任何重大不利影响。</p>\n  <p><strong>上半年上海脑机接口融资事件数量占全国近60%</strong></p>\n  <p>在6日举行的“活力中国调研行”上海站主题采访活动情况介绍会上，上海市科委主任骆大进表示，上海强化战略敏捷，超前布局前沿科技与未来产业。目前，重点跟踪的战略前沿领域已增至20个。全市集聚脑机接口企业数量占全国1/3，上半年融资事件数量和披露金额分别占全国近60%和40%；集聚了全国半数的中性原子量子计算整机企业、硅光和第四代半导体企业。打造了4个市级未来产业集聚区、2个未来产业培育区。（第一财经）</p>\n  <p><strong>爱仕达与智元机器人签署战略合作协议，五大方向开展深度合作</strong></p>\n  <p>爱仕达下属人形机器人子公司与智元机器人于7月6日正式签署战略合作协议。根据协议，双方将在采购订单与产品交付、具身智能机器人委托制造、具身智能机器人供应链合作、技术支持及场景化赋能、股权投资及合资公司设立五大方向开展深度合作。（财联社）</p>\n  <p><strong>保时捷考虑在德国再裁减4000个岗位</strong></p>\n  <p>当地时间7月5日，据报道，知情人士表示，保时捷考虑在其祖文豪森工厂再裁员多达4000人，此前该公司已同意削减3900个岗位。其中，行政和管理部门将尤其受到影响。下一轮裁员的具体规模预计将在7月底前确定。此外，报道称，保时捷还可能将其魏斯阿赫研发基��的产能减少约30%。（界面新闻）</p>\n  <p><strong>海力士半导体大连公司法定代表人变更</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，爱思开海力士半导体（大连）有限公司发生工商变更，朴元星卸任法定代表人、董事，由李秉起接任。该公司成立于2021年5月，注册资本31亿美元，经营范围包括集成电路制造、集成电路芯片及产品制造、电子元器件制造、集成电路芯片设计及服务等，由SK海力士株式会社全资持股。</p>\n  <p><strong>捷豹路虎中国经销商停售所有国产车型，经销商十年亏损渠道缩水近六成</strong></p>\n  <p>据报道，2026年7月捷豹路虎中国经销商停止进购所有国产车型。此前2026年3月国产车型全系停产（发现运动版、捷豹XEL、XFL、E-PACE已于2025年陆续停产），合资公司终结了所有国产车型生产与销售。多位经销商透露，自2015年国产车型投产以来，国产车在经销端几乎全线亏损，十年间单车平均亏损约3万元。</p>\n  <p>厂家通过进口车与国产车配额捆绑的商务政策（为获得高利润进口车资源，经销商被动承担损失），长期库存压力与配额绑定侵蚀渠道利润并透支国产车型价格体系。2018年经销商数量达历史顶峰约240家，截至目前锐减至百余家（正常运营仅约90家），渠道规模缩水近六成。（财经汽车）</p>\n  <p><strong>央视曝光滴眼液涉事企业被立案，对滴眼液乱象开展调查处置</strong></p>\n  <p>7月5日，总台报道了网售“健字号”滴眼液乱象。河南省南阳市镇平县两家企业在获得行业协会的“健字号”批文后，或提供包装或违规生产所谓“保健用品”，并宣传其护眼功效。目前，已依法控制两家涉事企业的法定代表人和实际控制人袁某某、王某、李某某，对企业涉嫌违法违规行为立案调查；依法查封相关生产设备、材料和台账资料等；向涉事外省企业所在地市场监管部门发函协查；协调网络销售平台下架相关产品。（央视新闻）</p>\n  <p><strong>郭明錤爆料最新苹果折叠手机：出货量明显不足，或重现“饥饿营销”</strong></p>\n  <p>知名分析师郭明錤分析指出，苹果可折叠iPhone预计2026年下半年出货，但初期供应可能不足。他称自己的行业调查显示，2026年下半年可折叠iPhone的组装出货量约为700万至800万部，第三季度出货量约为50万至100万部，约占苹果总出货量的10%。该产品价格可能在2300至2500美元左右，而供应限制将导致转售价格溢价50%至100%。他认为判断可折叠iPhone销售前景的关键在于2026年末至2027年第一季度。（财联社）</p>\n  <p><strong>苹果供应商立讯精密据悉香港的上市价格定在区间顶端</strong></p>\n  <p>苹果供应商立讯精密据悉香港的上市价格定在区间顶端。（21财经）</p>\n  <p><strong>中国航天科技集团商业火箭公司增资至41.7亿，增幅约199%</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，中国航天科技集团商业火箭有限公司发生工商变更，注册资本由13.96亿人民币增至约41.7亿人民币，增幅约199%。该公司成立于2024年9月，法定代表人为候正全，经营范围包括民用航天发射技术服务，火箭控制系统研发，火箭发动机研发与制造，火箭发射设备研发和制造，特种设备设计，技术服务、技术开发、技术咨询、技术交流、技术转让、技术推广等，由中国航天科技集团有限公司、中国长城工业集团有限公司、上海航天设备制造总厂有限公司等共同持股。</p>\n  <p><strong>英特尔回应CPU涨价，入门级产品基本保持原价</strong></p>\n  <p>继DRAM、NAND Flash等存储器价格持续上涨之后，CPU成为最新加入涨价阵营的核心零部件。7月6日，英特尔对该媒体确认了涨价信息。英特尔表示，价格调整是基于不断变化的市场动态定期对供应链以及与之相关成本的持续监控。根据行业对英特产品涨价前后的对比调研，此次涨价主要针对部分消费级酷睿Ultra处理器以及Xeon服务器处理器。其中，高端Xeon服务器产品整体涨幅达到7%至12%，而入门级产品基本保持原价；消费级产品也仅对酷睿Ultra 7 270K Plus、酷睿Ultra 5 250K Plus等部分型号进行了调整。（第一财经）</p>\n  <p><strong>美联储7月维持利率不变的概率为77%</strong></p>\n  <p>据CME“美联储观察”：美联储7月维持利率不变的概率为77%，累计加息25个基点的概率为23%。 美联储到9月维持利率不变的概率为41.9%，累计加息25个基点的概率为47.6%，累计加息50个基点的概率为10.5%。（财联社）</p>\n  <p><strong>印度市场监管机构拟大幅放宽投资者做空股票的限制</strong></p>\n  <p>据报道，知情人士透露，印度市场监管机构计划大幅放宽投资者做空股票的限制，将可用于融券借贷的股票数量近乎翻倍。印度证券交易委员会还计划降低股票融券的保证金要求。（界面新闻）</p>\n  <p><strong>花旗获准成为LPMCL第五家清算行，贵金属业务取得重大进展</strong></p>\n  <p>花旗周一表示，已获准成为第五家在伦敦场外黄金市场进行交易清算的银行，标志着其贵金属业务取得重大进展。此举拓展了支撑日均交易额约1600亿美元的伦敦黄金市场的清算网络，使花旗集团能够直接参与全球贵金属交易的核心结算业务。（财联社）</p>\n  <p><strong>研究人员借助AI技术发现两种新型超导体</strong></p>\n  <p>芬兰阿尔托大学参与的一个国际研究团队利用人工智能（AI）发现两种新型超导体，为更高效筛选和研发超导材料提供了新的技术路径。这一成果有助于加快新型超导体研发进程，为寻找可在室温下工作的超导材料带来新的希望。（新华社）</p>\n  <p><strong>博通将为苹果开发定制ASIC芯片产品，同意扩大技术协作至2031年</strong></p>\n  <p>博通7月6日向美国证监会提交文件，宣布与苹果公司将签署多年期协议，把双方长期技术合作关系延续至2031年。根据协议，博通将为苹果多代产品开发并供应一系列定制ASIC芯片产品。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，7月6日收盘，美股三大指数集体上涨，道指涨0.29%，纳指涨1.12%，标普500指数涨0.72%。大型科技股涨跌不一，特斯拉涨超6%，Meta、Arm涨超2%，谷歌、苹果涨超1%，亚马逊、英伟达小幅上涨；奈飞跌超2%，SpaceX、微软跌近1%。热门中概股普涨，爱奇艺涨超5%，蔚来、B站涨超4%，小鹏集团涨超3%，网易涨超2%，腾讯音乐、阿里巴巴、拼多多涨超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>深圳四方精创资讯股份有限公司再次向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳四方精创资讯股份有限公司再次向港交所提交上市申请书，联席保荐人为招银国际、国信证券。</p>\n  <p><strong>阿根廷可再生能源公司Genneia冲刺美股IPO</strong></p>\n  <p>阿根廷可再生能源生产商Genneia上周四向美国证券交易委员会（SEC）提交文件，计划通过首次公开募股（IPO）筹集至多1亿美元资金，有望成为2019年以来首家在美国上市的阿根廷企业。该公司计划在纽约证券交易所和阿根廷证券交易所双重上市，股票代码为“GENN”。（财联社）</p>\n  <p><strong>超颖电子：拟发行H股并在香港联交所主板挂牌上市</strong></p>\n  <p>36氪获悉，超颖电子公告，公司拟发行H股股票并在香港联交所主板挂牌上市。公司将充分考虑现有股东的利益和境内外资本市场的情况，在股东会决议有效期内或股东同意延长的其他期限内选择适当的时机和发行窗口完成此次H股发行上市。</p>\n  <h2>大公司财报</h2>\n  <p><strong>三星电子预计第二季度营业利润同比暴增1810%</strong></p>\n  <p>三星电子公布第二季度业绩预告，第二季度销售额171.00万亿韩元，同比增长129%，预估169.23万亿韩元，上年同期为74.6万亿韩；第二季度营业利润89.40万亿韩元，同比增长1810%，预估84.2万亿韩元，上年同期为4.7万亿韩元。（财联社）</p>\n  <p><strong>新凤鸣：上半年净利润同比预增94.59%—111.51%</strong></p>\n  <p>36氪获悉，新凤鸣披露业绩预告，预计2026年上半年实现归属于母公司所有者的净利润13.8亿元到15亿元，同比增长94.59%到111.51%。报告期内，行业新增供给有序放缓，景气度回升，市场供需关系优化，产品价差进一步扩大，毛利率同比提升，主营业务盈利能力改善。</p>\n  <p><strong>万华化学：上半年净利润同比预增60.05%—69.85%</strong></p>\n  <p>36氪获悉，万华化学披露业绩预告，预计2026年上半年实现归属于上市公司股东的净利润98亿元到104亿元，同比增长60.05%到69.85%。</p>\n  <p><strong>浙江东方：预计上半年净利润8.72亿元，同比增长约114.25%</strong></p>\n  <p>36氪获悉，浙江东方披露业绩预告，预计2026年上半年归属于母公司所有者的净利润8.72亿元，同比增长约114.25%。</p>\n  <h2>投融资</h2>\n  <p><strong>英国GEO公司geoSurge完成1200万美元种子轮融资</strong></p>\n  <p>36氪获悉，总部位于伦敦的AI公司geoSurge宣布完成1200万美元超额认购的种子轮融资，用于推进其在AI可见性领域的全新方法，帮助品牌塑造自身在ChatGPT、Gemini、Claude等生成式AI系统中的呈现方式。本轮融资由AlbionVC领投，Play Ventures、Octopus Ventures、Celero Ventures、Boost Capital参投，现有投资方Passion Capital与Tuesday Capital跟投，并获得来自Google DeepMind、Microsoft AI与Signal AI的多位天使投资人支持。</p>\n  <h2>酷产品</h2>\n  <p><strong>佑驾创新正式发布四轮足机器人</strong></p>\n  <p>36氪获悉，7月6日，佑驾创新正式发布“Combo”全链路无人物流闭环方案，由其旗下曜行动力打造的四轮足式机器人同步亮相。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-07T00:15:11+00:00", "fetched_at": "2026-07-07T02:41:09.995943+00:00", "fingerprint": "4b46685195ef0170"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨上科大博士团队加速国产超高速光电探测芯片量产，获千万级天使轮融资", "url": "https://36kr.com/p/3884289424437511?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_86e8a7fe5e73441aa2345416e68dcc99@6221844_oswg884550oswg1073oswg723_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2000</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，上海快粼光电科技有限公司（以下简称“快粼光电”）近期已完成数千万元天使轮融资。本轮融资由小苗朗程领投，一村资本跟投。中岚科创担任长期财务顾问，提供产业协同和资本对接服务。此次募集资金将主要用于公司超高速光探测芯片的研发迭代与送样验证，加速国产光探测芯片量产进程以及企业高端人才引进。</p>\n  <p>快粼光电2024年成立于上海，是一家专注于III-V族高速光电探测芯片的研发与产业化的硬科技公司，曾在AI光互联与6G通信核心的光芯片领域刷新世界纪录，填补了国内超高速收端光芯片的空白。</p>\n  <p>快粼光电的核心团队由4位师出同门、平均年龄不到30岁的年轻博士组成。创始人李林泽及三位联合创始人——王景熠、王鲁玉、龙天宇，均源自上海科技大学陈佰乐教授课题组。陈佰乐教授在高速光电子、III-V族半导体、光探测器件领域研究多年，具有深厚的行业影响力，创始人团队成员也有多项研究成果发表在《Nature》、《Nature Photonics》等顶级期刊。</p>\n  <p>AI算力集群正从“算力瓶颈”转向“互联瓶颈”。AI算力集群扩张、数据中心升级、高速光模块迭代，正推动光互联带宽需求爆发式增长。</p>\n  <p>光探测芯片作为高速光接收链路的核心器件，其带宽、响应度、暗电流与可靠性等关键性能，直接影响光互连系统的传输速率、接收灵敏度、链路功耗与规模化应用表现。</p>\n  <p>不过，光探测芯片的相关技术专利多数由国外企业掌握，因此长期以来，国内相关产品的高端光探测芯片高度依赖进口，国产化率偏低，供应链安全与自主可控正面临“卡脖子”的压力。</p>\n  <p>目前产业端已经展开技术攻关，但多数布局仍集中在特定环节或跟进式创新。能够打通从芯片设计到工艺实现、在高性能与量产良率之间取得平衡的完整自研团队仍然稀缺。</p>\n  <p>据创始人李林泽介绍，快粼光电已构建从器件结构设计、III-V族材料外延到封装集成的完整开发体系，围绕数通领域高速光接收需求，持续布局 InP 光探测器（PD）及阵列产品。</p>\n  <p>该系列产品可广泛应用于800G、1.6T、3.2T高速光互连，以及LPO/LRO、NPO/CPO等下一代数据中心网络架构，精准卡位AI算力集群与DCI（数据中心互联）对“超高速、高带宽、低功耗”光电器件的迫切需求，助力低功耗、高带宽光互连系统升级与国内光互联行业的自主可控。</p>\n  <p>业务方面，快粼光电聚焦高速光通信为主、6G太赫兹通信为辅的发展路径，重点布局单波100G、200G及下一代400G光探测芯片，适配800G、1.6T、3.2T高速光模块市场需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_040a8b71628b495cb1267ab61ebc4121@6221844_oswg228270oswg468oswg398_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">超高速光电探测器芯片图（图源/企业）</p>\n  <p>目前，公司已完成核心技术验证，正全力推进量产工艺开发与客户送样，计划2027年实现核心产品规模化交付；同时在6G太赫兹高端芯片领域已实现阶段性收入，技术能力获得行业认可。</p>\n  <p>李林泽告诉硬氪：“光模块厂商对探测芯片的要求非常明确：一是产能，二是可靠性。公司这轮融资的核心目标，就是拿到量产这张门票——在量产产线上生产出的具备高性能、高可靠性的产品交到客户手里。”</p>\n  <p><strong>以下是硬氪与李林泽的对话节选：</strong></p>\n  <p><strong>硬氪：光探测芯片最大的技术难点是什么？快粼光电的解法有何不同？</strong></p>\n  <p><strong>李林泽：</strong>难点在于带宽和效率很难兼得。传统结构下，带宽越高，响应度越低，而这两者对光模块接收端都很关键。我们的UTC-PD结构本质上是把载流子从“两种”变成“一种”，发挥电子快速输运的优势，在不影响效率的同时大幅提升带宽。我们的研发样品能实现超过200 GHz带宽、0.8 A/W的响应度，这两项指标在国际上来看也是第一梯队。</p>\n  <p><strong>硬氪：为什么不先做其它的商业化场景，而是直接瞄准光通信？</strong></p>\n  <p><strong>李林泽：</strong>我们先前也做了太赫兹通信、6G、精密仪器等前沿场景，实现百万级收入。然而对我们来说，太赫兹是长期的星辰大海，而光通信则是算力升级、刚性需求爆发的黄金周期，必须跟时间赛跑。</p>\n  <p><strong>硬氪：从技术验证到量产送样，中间最大的不确定性是什么？</strong></p>\n  <p><strong>李林泽：</strong>最大的不确定性不是技术本身，而是“技术”和“产线”的适配。我们在实验室可以把性能做得很好，但光模块客户要求的不是单颗芯片多快，而是批量出货时每一颗都足够稳定。这需要把我们自己的工艺know-how完整地移植到代工厂的量产线上，包括外延、制程、测试每一个环节的良率控制。我们花了很多时间做资源整合，正全力推进产品的量产开发。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>小苗朗程基金管理合伙人俞佳伟：</strong>本次投资快粼光电是基金在算力基础设施领域的又一投资布局，坚定看好公司即将量产的高性能单波200G/400G PD芯片的产品力，也期待公司的UTC-PD芯片、光混频器产品在光电量测设备、太赫兹通信、全光基站、星地微波通信等潜力领域逐步实现客户导入。</p>\n  <p><strong>一村资本董事总经理李中宇：</strong>快粼光电团队由上海科技大学培育，团队核心成员师出同门，基于MUTC结构光电探测器，实现了世界级的技术突破，是一个典型的硬科技项目。快粼的赛道正在加速增长——1.6T光模块量产在即，3.2T箭在弦上，单波200G/400G PD芯片是确定性升级方向；更远处，公司的UTC-PD是6G太赫兹光混频器的核心器件，一村愿意长期支持快粼成长和发展。</p>", "category": "tech", "published_at": "2026-07-07T01:00:00+00:00", "fetched_at": "2026-07-07T02:41:09.995936+00:00", "fingerprint": "2b8eaafa40c17248"}, {"source": "36氪 - 最新文章", "title": "用AI“复刻”人类细胞、预判药效，「华源智因」获千万级人民币种子轮融资｜36氪首发", "url": "https://36kr.com/p/3883943959621634?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，AI虚拟细胞（AIVC）企业华源智因近期已完成千万级人民币种子轮融资。本轮融资由水木创投领投，募集资金将主要用于多模态测序底层技术迭代，进一步拓展与头部三甲医院的合作，以及团队扩充等。此外，华源智因团队已计划启动新一轮融资。</p>\n  <p>华源智因创始团队由资深医药产业从业者、计算生物学研发人员组成，并邀请到深圳国家基因库等单位专家组成科学顾问委员会，形成科研与产业协同的团队架构。公司CEO杜润诗就读于加州大学洛杉矶分校，是AI领域连续创业者；CTO王艺璇为香港中文大学计算机科学与工程专业博士生，曾在百图生科牵头搭建基因扰动转录效应的预测模型xTrimoSC Perturb。此外，香港中文大学算机科学与工程系助理教授李煜任华源智因首席AI科学家。</p>\n  <p>在新药研发领域，“10年、10亿美金”是公认困境。其中，九成资源流向人体临床试验阶段，但最终仅有10%左右的候选药物能够顺利通过全部临床、成功上市。造成超高失败率的核心原因之一，是动物实验与人体真实生理环境的巨大差异。</p>\n  <p>那么，能否在投入高昂成本进入人体临床试验环节前，先在计算机里模拟出药物进入人体后的真实反应，以降低新药研发的失败率？</p>\n  <p>杜润诗认为，传统AI制药公司大多聚焦于解决研发前端问题，也就是利用AI更高效地找到潜在致病靶点、生成化合物。但这相当于只优化“找药”的第一步，无法完整预判成药后用到人身上时，究竟是否有效、有没有副作用等。而判断“某款药到底值不值得推进人体试验”，才是解决问题的关键。</p>\n  <p>这也是华源智因选择自研Wise-Perturb细胞药物扰动应用模型、专攻人体药效预测的根本原因。</p>\n  <p>简单理解，人类细胞包含约2万个蛋白编码基因，细胞健康状态、病变进程以及药物响应，均由多基因协同调控产生。行业���说的“细胞扰动”，指人为对细胞施加外源干预，主要分为两大研究方向：一是基因编辑扰动，通过敲除、上调特定基因，观测下游基因连锁表达变化，快速定位疾病致病靶点；二是药物分子扰动，将候选药物输入虚拟细胞模型，依托AI完整推演药物作用下细胞内基因、蛋白、信号通路的动态改变，以此评估药物人体疗效与潜在毒性。这也是华源智因现阶段核心研发重心。</p>\n  <p>据介绍，Wise-Perturb主要有两层突破。首先，它针对性弥补传统模型依赖单一RNA测序、脱离真实患者病理特征的短板。传统AI细胞模型训练数据多来源于实验室人工改造永生细胞系，这类细胞脱离人体原生病理微环境，缺少患者个体化基因特征，用于人体药效预测时易产生明显偏差；同时传统测序手段难以同步获取DNA、RNA、蛋白三层关键组学信息，难以完整还原细胞真实调控逻辑。</p>\n  <p>为此，华源智因搭建单细胞多组学整合分析体系，通过同细胞单细胞检测分别捕获细胞DNA、转录组、蛋白组数据，再依托自研多模态融合算法打通三层组学信息，搭建三层金字塔式数据底座，其中，底层为海量通用静态单细胞测序数据集，中层为数亿体外细胞系、PDX模型药物与基因扰动配对实验数据，顶层为稀缺人体临床肿瘤队列给药前后配对测序数据。</p>\n  <p>“我们与超一线头部三甲医院达成创新性合作，共建联合实验室。未来还计划针对各医院的优势科室，定向采集对应适应症的专属数据，训练细分疾病专家模型。希望在未来1-3年，至少与30家头部三家医院实现深度合作。”杜润诗表示。</p>\n  <p>此外，Wise-Perturb的另一特点在于模型的细胞特异性设计。普通AI模型通常默认细胞对药物的反应相同，但现实中，不同细胞的生理机制存在差异，比如，一款药在肺部起效，却有可能会损伤肝脏。因此，华源智因团队在Wise-Perturb中专门加入细胞类型识别架构，使其具备零样本跨细胞、跨癌种、跨新药泛化预测能力，不针对每一种疾病重新大规模训练、依靠少量已知患者数据，就能预测全新病种或药物的人体效果。</p>\n  <p>华源智因提供了两组真实验证案例，其中之一是ADC明星药物DS-8201的跨适应症验证。杜润诗介绍：“我们采用乳腺癌患者临床数据完成模型基础训练，在无卵巢癌患者训练样本的前提下，完成卵巢癌PDX模型药物响应预测，模型打分与动物体内真实药效匹配；对比通用虚拟细胞模型，预测一致性提升。”</p>\n  <p>另一例则是与中国医学科学院肿瘤医院合作的非小细胞肺癌靶向药奥希替尼药效分层研究。“医院提供患者治疗前肿瘤基线测序数据，未同步开放任何临床随访结局，由模型独立输出患者药效分层结果，分层结论与临床长期观测疗效吻合。”杜润诗表示。</p>\n  <p>在华源智因方面看来，这套经过临床样本验证的预测能力，让公司跳出行业“先投入高额研发、后期再拓展客户”的传统路径，成立早期即可对接医疗机构、药企落地真实付费合作。</p>\n  <p>杜润诗介绍称，<strong>目前，华源智因已“收获多家头部三甲医院、跨国药企、AI生物企业的合作订单，多项目服务费已完成回款”</strong>。</p>\n  <p>现阶段，华源智因共有两大核心商业化服务。一是面向药企提供临床前管线价值评估、临床试验入组患者分层定制服务，按项目评估，收取基础服务费或其他收益模式 ；二是与三甲医院共建干湿结合联合实验室，联合开展老药新用挖掘、全新疾病靶点筛选等科研项目。长期规划中，公司还计划推出与药企风险共担、药物上市收益分成的联合研发模式。</p>\n  <p>“我们优先落地小规模验证项目，用可复现、高一致性的预测数据建立客户信任，再持续深化长期合作。当前，人体精准药效预测是行业刚性需求，成熟替代技术方案稀缺，医疗机构与药企愿意开放临床样本数据开展联合研究。”杜润诗总结道。</p>", "category": "tech", "published_at": "2026-07-07T01:05:00+00:00", "fetched_at": "2026-07-07T02:41:09.995927+00:00", "fingerprint": "1e4e6cc0b6665272"}, {"source": "36氪 - 最新文章", "title": "前大疆员工做了款消费级纺织机，拿下红杉、顺为、米哈游等数亿融资｜产品观察", "url": "https://36kr.com/p/3876837605585160?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>浪爪智能（CLAWLAB）创始人胡文鑫，是当下硬件赛道一个不太按常理出牌的人。</p>\n  <p>工程师背景出身，曾就职于大疆、美团等头部大厂，拿过顶级机构的钱，履历足以支撑他选择任何一个被市场验证过的热门赛道，在最短时间内做出产品、讲故事、滚动融资。</p>\n  <p>但胡文鑫扎进了一个过去三十年几乎无人问津的品类：家用纺织机。</p>\n  <p>很少有人知道胡文鑫具体在做什么。浪爪智能成立于2022年12月，近几年里，团队刻意保持水下状态——BP从不外发，没有主动路演或公司传播，有投资人对产品方向感兴趣就直接到办公室看Demo。</p>\n  <p>硬氪独家获悉，过去几年，浪爪智能已连续完成数轮超亿元融资，Pre-A2轮由元璟资本领投、老股东顺为资本超额加注，Pre-A3轮由米哈游领投、老股东元璟及顺为大幅超额加注。此前投资方包括红杉等。</p>\n  <p>选择纺织方向，基于一个极为朴素的认知。“纺织天然切中‘衣食住行’的首位，是一件足够大且真实存在的需求。而定制化DIY，是在刚性需求被满足之后，用户向内探索自我表达、向外输出个性化的自然延伸。”创业初期胡文鑫就判断，这个赛道的天花板足够高，值得用很长的时间去探索。</p>\n  <p>纺织DIY赛道在全球拥有上亿潜在人群，但长期缺少软硬件一体化完整方案。和3D打印赛道不同，家用智能编织机没有可复用的零部件和开源算法，它们能参考的，只有老式编织机。也就是说，胡文鑫要从零定义一台全新的设备。</p>\n  <p>2024年，浪爪智能推出首款产品为自动簇绒枪，仅作为海外小规模市场验证工具，两年累计营收近亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_82fcef95db7f459195b82928eb6c5a84@6022551_oswg2127834oswg1660oswg1208_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能自动簇绒枪（图源/企业）</p>\n  <p>但硬件之外，胡文鑫耗费大量时间打磨的，是一款消费级纺织Station平台。这是一套全新形态物理计算终端，不需要专业制版，通过简易绘图或拍照即可生成编织版型，并完成围巾、娃衣、宠物配饰、小型毛绒制品等多种织物的织造工作。</p>\n  <p>在深圳，只做出90分的硬件，根本无法在丛林中存活，现在创业公司的天花板，其实是软件和生态能力，这个Station平台，也成了浪爪最深的护城河。公司即将发布新款轻量化桌面级编织产品，并搭建内容分享社区，承接爱好者的解压创作与小微定制需求。</p>\n  <p>纺织是最古老的工艺之一。当市场还在追逐可被智能化的新品类时，胡文鑫已经把目光投向了一片体量庞大、尚未被现代计算技术触及的蓝海。</p>\n  <h2>家用智能织造工作站</h2>\n  <p>胡文鑫选择锚定“编织”工具品类，并非出于直觉。早在产品定义阶段，他跟研发团队便对纺织四大类工艺——刺、钩、缝、织——做了系统摸排。</p>\n  <p>他们发现，刺、钩、缝这前三道工艺，其工序天然分散，只能对已有的布料做“加法”或“拼接”，无法独立生成一件完整的织物。而编织可直接以纱线为原料，成型衣物、围巾、配饰、毛绒玩偶等各类立体成品，工序高度闭合，更适配被集成到一站式的智能化设备中，符合“放入原料、制出成品”的桌面造物逻辑。</p>\n  <p>这个差异决定了家庭场景的可能性。编织工艺虽然难度高，但本身足够成体系，可以用智能化的工程方法去解构。</p>\n  <p>而过去三十年，几乎没有企业在这个方向上做过系统性尝试。90年代，家用编织机曾有过短暂的辉煌时期，以银笛、兄弟等老牌品牌长期占据编织设备的主流市场份额，后续还诞生了多款国产手摇编织机产品。这类设备完全依靠纯机械结构，全都需要手动完成。</p>\n  <p>看似简单的编织动作，实则是个高度依赖时序的动态过程——不同版型颜色、不同织针、各行纹路联动，任意一处张力、走位偏差，都会造成整件织物报废。</p>\n  <p>因此，做一台自动化编织设备，首要解决的不是材料堆叠或定点加工的问题，而是如何搭建一套实时感知、调节与补偿的动态控制系统。</p>\n  <p><strong>“很多人觉得编织不就是把线织成布，知道我们开始做了才发现，每个环节都是一个独立的技术难题。”</strong>胡文鑫告诉硬氪，“平针和麻花针的机械动作组合完全不同，粗羊毛和细棉线的张力控制曲线完全不同，一件衣服和一顶帽子的轮廓成型逻辑完全不同。这些差异不能靠调试解决，必须在系统设计之初就被定义清楚。”</p>\n  <p>而横亘在浪爪智能面前的第一道坎，是技术和数据的双重缺失。没有开源算法可以参考，没有现成数据集可以训练，没有成熟供应链可以复用。甚至连“编织动作应该如何被数字化定义”这个最基础的问题，此前都没有人给出过回答。</p>\n  <p>胡文鑫和团队花了近三年时间，将编织工艺逐级拆解为可编程的控制算法，形成了自己的技术壁垒。</p>\n  <p>团队的解法是，将机器人控制、运动规划到计算机图形学等AI硬件能力迁移至产品研发环节。做了一年半，他们终于跑通第一版可靠的编织流程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_96337f2410284bbd8b5d8802175a4523@6022551_oswg878842oswg1058oswg648_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能可编程控制算法（图源/企业）</p>\n  <p>但一台设备要从“工具型”产品进入家庭，真正的挑战在用户交互层。他们必须把设计门槛降到足够低，让一个毫无编织经验的人也能上手，否则产品依然只能停留在专业圈层内部。</p>\n  <p>传统编织的制版极度依赖经验。一个合格的制版师傅需要5到10年的训练，才能看懂图谱、理解针法逻辑、调整纱线参数。</p>\n  <p><strong>浪爪智能团队也在自主研发纺织AI Agent，基于领域知识增强的垂直模型，内置了团队积累的制版算法和编译能力。</strong>进入编织场景后，用户不需要懂复杂的针法和版型参数，上传图片后，一个能理解用户想要什么的设计Agent可自动解析织物风格、提取特征，生成可直接交由机器编织的设计方案。</p>\n  <p>用户只需要通过自然语言描述自己的设计意图，便交由AI Agent完成后续所有编织工作。传统制版师需要几天完成的工作，在这个一站式纺织Station中被压缩至几分钟，完成了一个从“用户意图”到“物理成品”的完整闭环。</p>\n  <p>这或许是这个品类最有趣的地方。它一方面是一个尚未被验证但潜力巨大的蓝海市场，但另一方面又长期缺乏现代化技术的系统性介入，留出了巨大的技术空白。不过也正因为冷门，一旦完成全栈体系搭建，这道护城河的宽度远超单品硬件逻辑所能理解。</p>\n  <p>更深一层的吸引力来自赛道本身。在胡文鑫看来，这不是一个单品类的故事，更具备平台化的可能性。“仅编织机这款设备，在其底层技术底座之上，针对不同细分场景就能衍生出多种差异化的产品定义。我们相信纺织赛道还有大量未被触及的场景和品类等待发掘。”</p>\n  <h2><strong>一个超亿人群的水下市场</strong></h2>\n  <p>当前全球范围内，编织在欧美、东亚等市场热度持续攀升，核心活跃爱好者群体规模达数千万级别，泛潜在覆盖人群规模可破亿。</p>\n  <p>公开社媒平台数据显示，小红书上“织女”相关话题阅读量近9亿，钩针编织、手工钩织等相关话题总流量超30亿；TikTok平台上“crochet（钩针、编织）”标签的观看次数达2000多亿次。</p>\n  <p>人群足够大，这只是第一步。更重要的是，编织的终端产品不需要教育。围巾的温暖、帽子的陪伴、毛衣的柔软、毛绒玩具的治愈感，人对这类情绪型产品的向往是天然的、无需解释的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4d85e7c3d82448d0a60f153610148c50@6022551_oswg3109133oswg2004oswg1152_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">使用浪爪智能织造工作站所产出的编织产品（图源/企业）</p>\n  <p>“平台上用户展示的编织作品只是冰山一角，评论区里那些‘好看’‘我也想要’‘有没有教程’的声音，才是真正的水下需求。”胡文鑫说，“我们不是在创造一个新需求。目前没有产品能够满足这些人想要一件定制毛衣、一个特定图案抱枕的需求。这正是我们的切入点。”</p>\n  <p>破局点在于将耗时数周的重复劳动、制版和织造环节交给机器，让用户保留设计、选择、以及亲手创造的情绪价值，把用户从想要到拥有的耗时和门槛大幅降低。</p>\n  <p>胡文鑫告诉硬氪，这种补偿方式可以催生出一条独特的用户演化路径。大量纺织DIY用户最初进入这个领域，驱动力是情绪性的：解压、打发时间、享受亲手做出一件东西的满足感。随着技能积累和社群影响，一部分人开始从兴趣爱好延伸至轻量化商业阶段，接洽小批量订单。</p>\n  <p>围绕这条从情绪消费到轻量化商业的演化路径，浪爪智能将用户画像划分为四类渗透方向。</p>\n  <p>首批种子用户是存量编织设备的重度使用者。他们或是多年老式编织机的爱好者，或是通过手工编织获得稳定收入的个体创作者，对产品工具有认知基础，痛点直接而具体：手动排花效率低、复杂图案实现困难、良品率不稳定。这类用户不需要被教育“编织机能做什么”，而是真正能解决日常问题的产品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_34c7f46734b94323a357273b4b8397c2@6022551_oswg2116990oswg1402oswg1034_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能自动簇绒枪（图源/企业）</p>\n  <p>第二类目标用户是小B端经营者，比如做娃衣的、织宠物服饰的、接节日定制单等。其核心诉求围绕效率和定制化能力展开，一台设备能有效缩短单件创作周期。这类人群的价值不止于购买设备，其产出的成品也会自然吸引C端用户关注，形成从B端向C端的渗透。</p>\n  <p>最终，浪爪智能的目标是覆盖大众普通消费者，没有DIY创作需求、也不关心编织工艺，而是能否快速获取自己想要的织物。到这一阶段，其产品将脱离造物工具、创作工具的定位，真正落地于家庭场景的小型柔性供应链，实现织物即时定制交付。</p>\n  <p>&nbsp;“这类人群本质上是需求层次不断上移的过程。第一阶段用户解决的是痛点，第二阶段解决的是效率，第三阶段解决的是好看，第四阶段真正实现用户想要就有。”胡文鑫分析。</p>\n  <p>过去三十年，家用编织从“家家一台缝纫机“的生产力需求，逐渐淡出了人们的日常生活，花几周钩一条毯子在快节奏生活中被大多数人放弃。工业时代把编织送进了工厂流水线，标准化的围巾、标准化的毛衣，以最低成本流向每一个货架。效率极大提升，但代价也随之发生：编织原本携带的个体属性被彻底压缩。每一件织物背后那个具体的人、具体的审美选择、具体的表达意图，全部被简化为\"同款\"。</p>\n  <p>但亲手创造的情感需求从未消失。随着硬件供应链的成熟、电机与传感器成本的下降、AI能力的可迁移，让“把一台复杂的编织设备做到消费级产品”第一次具备了可行性。</p>\n  <p>“每个人心里都有想表达的东西。一个喜欢的图案、一种偏好的颜色、一份属于自己的触感，以及附着其上的某段回忆、某种情绪。这些想法不应该被‘批量生产’挡在门外。于是浪爪智能做了一台能放在书桌上的编织机。不是玩具，不是概念，是能真正织出成品的机器。”胡文鑫说。</p>\n  <p>用户的设计从屏幕里生长出来，变成可以触摸的纹理、可以围在肩上的温度、可以送人的独一无二。这台机器解决的问题不是更快或更便宜，而是让织物重新属于具体的人。</p>", "category": "tech", "published_at": "2026-07-07T02:29:47+00:00", "fetched_at": "2026-07-07T02:41:09.995912+00:00", "fingerprint": "4e53685b69ec35b7"}, {"source": "少数派", "title": "自动给文章术语加百科链接，这个方案一分钟搞定", "url": "https://sspai.com/post/111702", "summary": "我给博客做了一个「术语小助手」，让陌生名词不再打断阅读。<a href=\"https://sspai.com/post/111702\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-06T0 me begins on November 12th, which should give you [&#8230;]", "category": "tech", "published_at": "2026-07-05T16:00:00+00:00", "fetched_at": "2026-07-06T02:45:16.807341+00:00", "fingerprint": "2478e3dd36472f08"}, {"source": "The Verge", "title": "Mr. Lif’s Emergency Rations EP is post-9/11 hip hop at its most daring", "url": "https://www.theverge.com/entertainment/961484/mr-lif-emergency-rations-ep-post-9-11-review", "summary": "There was a period in the early aughts when Definitive Jux (nee: Def Jux) seemed like it was going to be the future of hip hop. While the label featured plenty of experimental, boundary-pushing, and politically minded acts, Lif stood out as the most \"conscious rapper\" in the traditional sense. It was clear though, that [&#8230;]", "category": "tech", "published_at": "2026-07-05T18:30:00+00:00", "fetched_at": "2026-07-06T02:45:16.807334+00:00", "fingerprint": "6e9b865319ebd169"}, {"source": "The Verge", "title": "Some of the nation’s rich are letting AI teach their kids", "url": "https://www.theverge.com/ai-artificial-intelligence/961505/wealthy-ai-schools-alpha-forge-prep", "summary": "Most Americans don't trust AI. It's proven that it doesn't know what safe toppings for pizza are. People don't even want to listen to AI music. But none of that matters for some of America's wealthy, who are turning to AI to teach their kids instead of traditional schools. Companies like Forge Prep and Alpha [&#8230;]", "category": "tech", "published_at": "2026-07-05T22:30:54+00:00", "fetched_at": "2026-07-06T02:45:16.807324+00:00", "fingerprint": "62797d7741b41a29"}, {"source": "36氪 - 最新文章", "title": "鄂尔多斯、和达金服共同领投，「贻如科技」完成超亿元A轮融资｜36氪首发", "url": "https://36kr.com/p/3880060701388809?f=rss", "summary": "<p>36氪获悉，生物基皮革公司「贻如科技」完成超亿元A轮融资，本轮融资由鄂尔多斯集团与和达金服共同领投，巢生资本跟投，易凯资本担任独家财务顾问。本轮资金将主要用于推动公司商业化开拓与产能建设，并依托AI技术加速生物基皮革的技术革新与产品迭代。</p>\n  <p><strong>贻如科技成立于2021年，以合成生物学为底层技术，创造以生物基皮革为代表的新一代创新生物基材料</strong>——通过微生物发酵直接生产生物基树脂原料，经加工后制成皮革成品，实现碳排放降低80%以上、部分产品生产成本甚至低于传统油性PU产品、物理性能（耐磨、透气、柔韧）对标真皮水准，由此让大众消费品所需的高性能材料从石油基走向生物基。</p>\n  <p>2024年，贻如科技曾完成由星空资本领投的数千万元Pre-A轮，彼时创始人苏睿对36氪判断，商业化拐点“或许明年到来”。如今，这家长期待在“水面下”、鲜少露面的公司，在全球范围内的商业落地已经突进——<strong>截至2026年第一季度，其皮革产线年产能突破1600万平方米，今年以来的海外订单近亿元，全球化布局序幕也就此正式拉开。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_5c40b3ca463644dbb30fbbc59a10cacb@5748245_oswg304314oswg1271oswg1680_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如 × ANTA ZERO × Kris Van Assche 设计师系列 · 纯素皮革系列</p>\n  <h3>01&nbsp; 走出“实验室叙事”</h3>\n  <p>生物基皮革，尤其是以菌丝体为原料的“蘑菇皮”，曾是过去十年时尚可持续领域最受关注的方向之一。MycoWorks、Modern Meadow、Ecovative等海外公司都曾获得一线机构或奢侈品集团的投资。</p>\n  <p>热闹散场后，这批明星项目大多没跑下去——材料能做出来，但太贵、难以真正量产的瓶颈，使得它只能停在概念秀和小批量联名里。“生物基皮革更贵”，也成了消费者和品牌心照不宣的常识。&nbsp;</p>\n  <p>走到今天，传统皮革仍然普遍面临着碳排放高、供给波动大、品牌ESG压力上升等问题，市场对生物基皮革的兴趣并未消失。但行业的评价标准，已经从“能否做出来”转向“能否便宜且规模化地生产”。</p>\n  <p><strong>成本恰恰是贻如当下的壁垒所在。苏睿向36氪算了一笔账：在欧洲市场，品牌使用真皮的成本折合约300-400元/米，而贻如售价最高的皮革产品约200元/米，多数产品落在80-150元/米的区间，相当于将成本压至真皮的一半以下，“且透水、透气，比真皮更耐用。”</strong></p>\n  <p>背后原因在于，目前在全球范围内，能将生物基皮革做到规模化量产的公司都少之又少。苏睿称，行业内能稳定交付百万米以上的公司屈指可数，贻如也是极少数最早出发、且长期坚持“液体发酵做树脂、再涂覆成革”这条路径的企业。</p>\n  <p>让成本曲线持续下探的另一只手是AI。从菌株筛选、基因编辑设计，到液体发酵工艺的参数寻优与量产良率控制，贻如构建了全链路数据驱动的研发引擎，把生物材料的开发效率与放大成功率推向行业前沿。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_bb9cd692121c4f598a46f13680fdea4a@5748245_oswg1500194oswg1112oswg685_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如科技工厂发酵罐实拍图</p>\n  <p>在产品上，贻如以Mulkol系列做差异化布局：Mulkol-3定位评价人造革替代，采用偏硬质树脂，质感接近高强度工业用料，主打家具、装饰等平价人造革替代场景；Mulkol-5定位高级真皮替代，采用更软的弹性体材料，触感更接近羊皮与真皮，面向手袋、服装等中高端市场。苏睿还透露，针对海外奢侈品牌客户，公司另外推出了更高端的品牌HORA。贻如持续深耕奢侈品及品牌消费市场，通过稳定的产品供给与市场拓展，逐步构建起成熟的业务基础与品牌能力。</p>\n  <p>在此之上，贻如正面向更广阔的高分子生物基材料领域加速延展，逐步向上游材料端布局，着力构建覆盖全球的弹性体原料体系，并同步拓展膜材料与橡胶材料等多元应用方向，相关材料也将进一步走向消费品包装、工业薄膜及各类终端应用场景，持续拓宽产业边界与应用空间。</p>\n  <p>贻如自有研发团队围绕不同应用场景与性能需求持续推进材料开发与技术迭代，不断完善弹性体原料的自主研发能力与产品体系，推动公司从皮革业务出发，逐步迈向以原料开发为核心的材料与生物基创新平台型企业。在该方向上，鄂尔多斯集团旗下的电力冶金集团在可持续能源与低碳冶金及绿色化工材料领域具备深厚积累，并设有合成生物产业专业化平台，将与贻如形成从上游原料、中游生产到下游产品转化的全链条互补。</p>\n  <h3>02&nbsp; 迎来“商业化拐点”</h3>\n  <p>截至2026年第一季度，贻如已与服装、鞋履、箱包、家居、3C等多个应用领域的全球标杆客户达成商业合作：</p>\n  <ul>\n   <li>在运动领域，以安踏为例，贻如已与安踏建立持续深化的合作关系——2025年4月联名骜杰系列鞋款首发落地，同年11月ANTA ZERO × KRIS VAN ASSCHE一期产品开售，2026年3月Kris Van Assche合作系列二期产品开售，9个月内完成三轮迭代与商业合作，验证了生物基材料在头部运动品牌供应链中的可复制性与规模化潜力。</li>\n   <li>在渠道层面，贻如与国际知名面料经销渠道商益彩合作，作为核心经销渠道合作伙伴，借助其全球渠道资源加速产品在各行业的导入。</li>\n   <li>在多元场景层面，贻如已与亚朵、凯宾斯基等品牌围绕酒店与家居场景展开合作；在市政与公共空间领域，其产品已应用于上海南站、上海大宁公园等标杆性项目。</li>\n  </ul>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_097cbc45f86a459c8f66545b1c14ba53@5748245_oswg2873371oswg1112oswg1757_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如 × ANTA ZERO × Kris Van Assche 设计师系列 · 纯素皮革系列</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_97d0d72558564d4cb2cf75963999ff94@5748245_oswg781322oswg1295oswg867_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如科技其他合作案例：酒店场景</p>\n  <p>此外，最值得一提的市场在欧洲——欧洲拥有众多高端时尚消费品牌，且对低碳、可持续材料有强烈而迫切的需求，是生物基皮革最具价值的战场之一。</p>\n  <p>据悉，贻如已在法国落地全资子公司SYNMETABIO，以此作为欧洲区域总部支点，联动英国、德国、意大利、土耳其及北欧各地合作渠道，全域辐射欧洲主要消费市场。在欧盟碳关税（CBAM）的政策背景下，贻如凭借材料的降碳与可持续优势，能为欧洲客户带来切实的成本优势与品牌宣传效应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_56992708b03d4c94bb6427af0902f252@5748245_oswg219967oswg1274oswg852_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">SYNMETABIO海外展会实拍</p>\n  <p><strong>苏睿透露，国际地缘冲突推高了传统供应链的成本，贻如的欧洲订单随之明显跃升，法国全资子公司SYNMETABIO累计接到的订单已接近一亿元，且“几乎全部来自奢侈品牌”。</strong></p>\n  <p>眼下，境外订单已占贻如总业务量的约三分之二，公司也为此搭起了海外质检、海关与运输团队。近半年内，贻如的团队也从约20人扩到了接近70人。</p>\n  <p>业务的快速扩张体现在方方面面，而撑起这些订单的是产能。<strong>贻如与上市公司聚杰微纤以轻资产模式合资成立安徽聚贻科技，目前皮革产线年产能已突破1600万平方米，二期工厂在建。据苏睿介绍，公司下半年还要陆续投产新的制成品工厂。</strong></p>\n  <p>苏睿坦言，贻如会将2026年当作“筹备上市的第一年”来对待，这对一家2021年成立、刚跑通工厂级规模的公司而言显得激进。在行业从“环保叙事”回归“成本与量产”的当下，一家能将皮革成本做到真皮一半以下、并已在欧洲收获过近亿元订单的中国公司，确实提供了一个值得关注的新样本。</p>", "category": "tech", "published_at": "2026-07-05T23:50:00+00:00", "fetched_at": "2026-07-06T02:45:16.698853+00:00", "fingerprint": "4be1d6ea09831d41"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨7-11指控耐克新鞋配色抄袭；A股新版交易规则今起施行；华尔街称苹果采购长鑫内存是为了压价", "url": "https://36kr.com/p/3883400536453381?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>苹果Siri AI秋季上线，仅限iPhone 15 Pro及以上机型</p>\n  <p>蒋方舟再回应被清华教授指控论文造假</p>\n  <p>张雪称负债接近1亿元，本月将还清全部债务</p>\n  <p>黑石集团放弃全球最大数据中心项目，意味着该建设计划已宣告破产</p>\n  <p>印度政府：正调查苹果手机信息泄露事件</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>7-11起诉耐克，指控其新鞋配色抄袭7-11标志性颜色</strong></p>\n  <p>据报道，跨国连锁零售公司7-Eleven（7-11）已在美国得克萨斯州联邦法院起诉运动品牌耐克，指控该公司计划于7月11日推出的运动鞋抄袭了7-11便利店标志性的橙、绿、红三色条纹设计。</p>\n  <p>7-11在2日向法院提交的诉状中称，耐克即将推出的Air Max 95运动鞋采用的颜色与7-11品牌商标极易混淆，消费者会将该设计与7-11品牌联系起来。此外，耐克将该运动鞋的发售日期定为7月11日，这一天恰逢该零售商一年一度的促销活动。（财联社）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_f43e9f51123a49c0b182203f92a08216@5667365_oswg919166oswg1012oswg1272_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">7-11与耐克对比图</p>\n  <p><strong>A股新版交易规则今起施行，主要有5大变化</strong></p>\n  <p>2026年4月24日晚，沪深北交易所修订发布交易规则，新版交易规则将于7月6日起施行。新版交易规则主要有五大核心变化：</p>\n  <p>1、盘后固定价格交易全面扩容。由创业板、科创板股票扩展至全部A股和交易型开放式基金。</p>\n  <p>2、上交所基金收盘阶段交易方式由连续竞价调整为收盘集合竞价，并通过集合竞价产生收盘价。</p>\n  <p>3、板风险警示股票价格涨跌幅限制比例由5%调整为10%。</p>\n  <p>4、深交所创业板引入做市商制度。</p>\n  <p>5、大宗交易机制优化。创业板股票协议大宗交易成交确认时间由15:00至15:30，调整为9:30至11:30、13:00至15:30。北交所无价格涨跌幅限制的股票大宗交易参考价调整为当日竞价交易实时成交均价。（中国证券报）</p>\n  <p><strong>华尔街投行分析称：苹果采购长鑫内存是为了压价</strong></p>\n  <p>近期，由于内存缺货涨价，苹果要采购中国公司的内存的传言已经成为业界的一大焦点，来自华尔街的投行机构给出的意见是苹果采购长鑫内存更多地是作为谈判策略压价。</p>\n  <p>他们认为苹果不太可能有实质意义采购长鑫的内存，原因有三点，第一是美国的政策限制，第二是技术指标达不到苹果的要求，第三是专利风险，三星海力士美光等公司掌握着关键的IP专利，用了之后有可能有法律风险。</p>\n  <p>报告认为苹果醉翁之意不在酒，实际上是想用这个消息来获得谈判优势，把它当作一个谈判筹码。在苹果与美、韩三大内存巨头（三星、海力士、美光）谈判2026年下半年至2027年的合约价格时，长鑫的存在会被苹果拿来施压，以此获得更低的采购价。（快科技）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>苹果Siri AI秋季上线，仅限iPhone 15 Pro及以上机型</strong></p>\n  <p>在今年6月的WWDC 26全球开发者大会上，苹果公司正式发布了基于Apple Intelligence架构的新一代Siri AI系统，标志着这款虚拟助手在语义理解和多任务执行方面迎来重大升级。随着今年秋季iOS 27稳定版的发布，Siri AI将正式向符合条件的用户推送。</p>\n  <p>根据苹果公布的兼容性策略，Siri AI的完整功能将严格限定在支持Apple Intelligence的设备上。在智能手机产品线中，只有iPhone 15 Pro、iPhone 15 Pro Max以及iPhone 16及后续机型能够支持该功能。在平板和电脑端，搭载A17 Pro芯片的iPad mini以及配备M1及以上芯片的iPad和Mac机型均在支持范围内。用户可通过查看设备“设置”中是否出现“Apple Intelligence与Siri”选项，来确认自己的设备是否具备升级资格。（环球网科技）</p>\n  <p><strong>三星存储芯片拟涨价20%，连续第三个季度大幅上调DRAM价格</strong></p>\n  <p>近日，有消息称三星电子正与客户谈判，计划将2026年第三季度通用DRAM平均售价比上一季度提高20%，其中LPDDR价格涨幅或超20%。若最终落地，这将是三星连续第三个季度大幅上调DRAM价格——此前一季度涨幅约90%，二季度涨幅50%至60%，上半年累计涨幅已超过2倍。高盛研报指出，全球存储市场供需不平衡已达到近15年高峰，AI服务器及推理卡需求激增是核心驱动因素。（第一财经）</p>\n  <p><strong>Anthropic拟在澳大利亚布局1.4GW数据中心算力</strong></p>\n  <p>7月5日，据报道，人工智能公司Anthropic计划在澳大利亚采购至少1.4GW数据中心算力，对应建设成本约150亿美元（约216亿澳元），远高于市场此前预期。该公司目标是在2027年底前启用至少1GW算力，并已在澳大利亚设立办公室推进本地化基础设施布局。（界面新闻）</p>\n  <p><strong>特斯拉限制员工AI使用开销，美国多家科技企业收紧AI支出</strong></p>\n  <p>据多家美国媒体3日报道，特斯拉公司将从本月6日开始，限制员工在人工智能工具上的开销。类似措施也被其他多家美国科技企业采用。据报道，特斯拉已向员工发出内部备忘录，宣布自7月6日起，每名员工每周在AI工具上的花费上限为200美元，超出部分须经主管批准。不过，特斯拉员工使用马斯克旗下xAI的Grok模型不计入200美元额度。据悉，Grok在特斯拉员工群体中接受度偏低，多数员工依旧选择使用Anthropic旗下的克劳德。（央视财经）</p>\n  <p><strong>千问智能体功能与服务将于7月15日正式下线</strong></p>\n  <p>据千问平台消息，千问智能体功能与服务将于2026年7月15日正式下线，下线后，用户将无法继续访问相关智能体配置及历史对话记录。（21经济网）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>蒋方舟再回应被清华教授指控论文造假</strong></p>\n  <p>青年作家蒋方舟7月5日在其个人社交平台再发文，题目为《关于肖鹰教授指控我论文“全面造假”的逐项说明》。文中称，肖鹰教授的指控存在系统性的夸大与失实（比如说作者论文“全面造假”），对于这些严重失实、足以损害作者名誉的指控，作者予以明确、坚决的否认。蒋方舟表示，已经于昨日（7月4日）报警，并且将会将相关材料递交给清华大学相关部门，以及用法律手段维护自己的利益。（界面新闻）</p>\n  <p><strong>张雪称负债接近1亿元，本月将还清全部债务</strong></p>\n  <p>7月4日，张雪发布视频称，这个月就不是亿万“负”翁了。张雪透露自己目前负债接近1亿元，这次卖了一点股份，卖完后就会把债务全部还清，“再也不欠钱了”。（界面新闻）</p>\n  <p><strong>高薪专业榜出炉，计算机跌出本科专业月收入前十</strong></p>\n  <p>近期，第三方社会调查机构麦可思研究院发布的《2026年中国本科生就业报告》显示，2025届本科生毕业半年后平均月收入为6435元，微电子科学与工程、电子科学与技术专业分别以7814元和7752元位列前两名，此前常居月收入排行前列的计算机科学与技术、软件工程则跌出前十。</p>\n  <p>前述麦可思报告统计的本科专业月收入前十位中，包括微电子科学与工程、电子科学与技术、光电信息科学与工程以及通信工程4个电子信息类专业，其毕业生主要进入半导体和其他电子元件制造业、通信设备制造业等领域。这意味着，从就业来看，集成电路、智能制造、新材料等与战略性新兴产业和先进制造业相关的专业表现突出。（中国新闻周刊）</p>\n  <p><strong>现货黄金站上4200美元</strong></p>\n  <p>36氪获悉，现货黄金早盘站上4200美元/盎司，创两周新高，日内上涨0.6%。</p>\n  <p><strong>山姆多款澳牛产品涨价，客服回应：牛肉供应链成本上升</strong></p>\n  <p>近日，山姆被曝多款澳牛产品调价，有消费者贴图山姆的澳牛价格大部分上涨30%以上，1200克的澳洲谷饲牛霖售价119.7元左右，目前价格161.7元，900克的澳洲谷饲肥牛薄片此前105.1元，当天价格123.1元。还有消费者表示，碎牛肉涨了10块一斤，牛腱子也涨了不少。</p>\n  <p>对此，山姆客服表示，受澳洲牛肉进口配额以及贸易政策影响，牛肉供应链成本上升，因此上调售价，为保障会员利益，山姆将尽可能承担成本压力，维持价格的合理性区间。（每日经济新闻）</p>\n  <p><strong>世界杯带火佛得角：旅行社火速上新万元定制游，机票酒店搜索量翻倍</strong></p>\n  <p>7月4日，美加墨世界杯1/16决赛，世界杯最大“黑马”佛得角与卫冕冠军阿根廷鏖战120分钟，最终以2:3憾负。虽然输了比赛，但这个此前在国内长期冷门的目的地，一夜之间进入了大量球迷和旅行者的视野。</p>\n  <p>记者注意到，近日多家旅行社火速上架了佛得角相关旅游产品，部分线路为新近定制，而机票和酒店的搜索热度也在急剧攀升。（蓝鲸新闻）</p>\n  <p><strong>黑石集团放弃全球最大数据中心项目，意味着该建设计划已宣告破产</strong></p>\n  <p>美国黑石集团旗下数据中心运营商QTS于2日宣布，已终止在美国弗吉尼亚州的数据中心项目，并撤回所有相关申报文件。这意味着，这座全球最大数据中心园区的建设计划已经宣告“破产”。</p>\n  <p>有分析认为，QTS放弃全球最大数据中心园区项目，反映出美国数据中心的建设热潮已遭遇阻力。民调机构盖洛普5月发布的一项调查显示，71%的美国民众反对在居民区附近建设数据中心，担忧主要集中在能源和水资源消耗、环境污染和噪音等问题。（观察者网）</p>\n  <p><strong>2026暑期档电影票房破20亿</strong></p>\n  <p>据网络平台数据，截至目前，2026年暑期档电影总票房（含预售）突破20亿元。2026年度电影总票房（含预售）突破177亿元。（央视新闻）</p>\n  <p><strong>韩国央行警示三星、SK海力士杠杆ETF或加剧市场波动</strong></p>\n  <p>7月5日，据报道，韩国央行警告称，与三星电子和SK海力士挂钩的单一股票杠杆交易型ETF，可能进一步加剧市场集中度、放大市场波动，并强化单边交易资金流。韩国方面称，韩国央行计划加强监测单一股票杠杆ETF对股市和金融体系的影响。（界面新闻）</p>\n  <p><strong>一部iPhone 17 Pro Max被封入美国250周年时间胶囊，计划于2276年开启</strong></p>\n  <p>为庆祝美国建国250周年，一座名为“AMERICA250”的大型时间胶囊于近日正式封存，计划于2276年美国建国500周年时开启。相应时间胶囊收录了来自美国各州具有代表性的物品，用于记录当代社会的面貌，参考FoxNews视频，一部星宇橙（Cosmic Orange）配色的iPhone 17 Pro Max也被置入胶囊中。（FoxNews）</p>\n  <p><strong>美光科技投资93亿美元扩建先进存储芯片项目，预计2028下半年出货HBM</strong></p>\n  <p>美光科技当地时间周六（7月4日）正式启动其位于日本西部广岛工厂的扩建工程。这项总投资达1.5万亿日元（约合93亿美元）的项目，旨在生产包括高带宽存储器（HBM）在内的先进存储芯片，以满足人工智能（AI）浪潮带来的旺盛需求。HBM是英伟达AI处理器的关键组件，工厂预计将于2028年夏季左右开始出货。</p>\n  <p>近期，美光、三星电子和SK海力士各自都宣布了扩充制造能力的计划。上周SK海力士宣布，计划投资80万亿韩元（约合514.6亿美元），在韩国忠清北道首府清州市新建一座NAND存储芯片工厂。（财联社）</p>\n  <p><strong>贝斯特：人形机器人业务仍处样品阶段</strong></p>\n  <p>贝斯特公告，公司股票连续3个交易日收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。公司关注到市场对人形机器人等热点概念关注度较高，但公司人形机器人零部件业务仍在样品阶段，2026年上半年相关样品实现营收22.30万元，占公司营收比重约0.03%，业务规模较小，对公司业绩不产生重大影响，未来收益存在重大不确定性。（第一财经）</p>\n  <p><strong>业内首个AI-eSIM产业协同平台成立</strong></p>\n  <p>36氪获悉，据人民邮电报，7月3日，在中国信息通信业发展高层论坛上，由中国移动发起的业内首个AI-eSIM产业协同平台——“中国通信企业协会AI-eSIM专业委员会”（以下简称：专委会）正式成立，中国移动物联网公司担任主任单位，天翼物联、联通华盛、火山引擎、腾讯云、观安信息等担任副主任单位。据介绍，专委会汇聚了运营商、芯片设计、算法研究、安全服务及模型应用等领域的头部企业40余家。</p>\n  <p><strong>印度政府：正调查苹果手机信息泄露事件</strong></p>\n  <p>印度电子和信息技术部秘书克里希南2日表示，政府正就塔塔电子大规模数据泄露事件展开调查。这也是印度政府首次就这起事件发声。克里希南说：“我们正在调查。”按他的说法，相关事件已上报负责印度网络安全的下属机构计算机应急响应小组。塔塔电子是苹果公司的零部件供应商，也是苹果手机在印度的主要代工厂之一。据路透社报道，一个团伙日前从塔塔电子窃取大量未公开机密数据并上传至暗网，包括未发布的iPhone 18 Pro零部件供应链信息和机型测试素材等。（新华社）</p>\n  <p><strong>美国启动3亿美元锂采购计划，拟用于补充国家国防储备</strong></p>\n  <p>美国国防部后勤局（DLA）于7月2日发布招标公告，计划通过一项为期5年的不定数量不定期合同，采购电池级碳酸锂，用于补充国家国防储备。本次采购总量上限约为1.6167万吨，合同总金额最高达3亿美元，最低保障采购金额约100万美元，投标截止日期为7月17日。该合同要求供应电池级碳酸锂纯度不低于99.5%，以粉末形态交付，并分阶段执行：首年采购约3657吨，随后逐年递减至第五年约2839吨。交付地点包括纽约州、内华达州、印第安纳州及俄亥俄州等DLA指定仓库。（界面新闻）</p>\n  <p><strong>4nm近售罄、部分8nm接近满载，三星晶圆代工开始选择性接单</strong></p>\n  <p>据报道，业内人士称，随着AI半导体需求升温、全球大型科技公司订单增加，三星电子晶圆代工部门已针对部分制程启动配额机制（allocation），将有限产能集中分配给较重要的客户和制程，将产能优先分配给现有客户，新客户订单则选择性承接。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>天山铝业：上半年净利润同比预增101.52%</strong></p>\n  <p>天山铝业7月5日发布业绩预告，预计2026年上半年实现归母净利润42亿元，同比增长101.52%。报告期内，受益于全球铝行业供需影响，公司电解铝产品销售价格显著上行；与此同时，公司140万吨电解铝绿色低碳能效提升项目按计划顺利推进，量价协同效应叠加公司一体化成本管控成效，电解铝板块盈利实现大幅增长。同时二季度公司下属全资子公司新疆生产建设兵团第八师天山铝业有限公司上调所得税率，影响当期所得税费用。</p>\n  <p>报告期内，公司下游铝深加工板块中，高纯铝受电解电容器行业需求增加等积极因素影响实现量价齐升，增厚公司盈利。同时铝深加工板块中各类铝箔产品市场需求旺盛，订单饱满，公司铝箔产量及良品率大幅提升，对整体利润形成正向贡献。（证券时报）</p>\n  <p><strong>奥来德：预计2026年半年度净利润同比增长492.49%-603.58%</strong></p>\n  <p>奥来德公告，预计2026年半年度归属于上市公司股东的净利润为1.60亿元-1.90亿元，同比增长492.49%-603.58%。业绩变动主要系设备业务核心竞争壁垒持续夯实，产品技术与市场卡位优势充分落地，相关业务收入大幅增长，盈利能力显著提升。（第一财经）</p>\n  <p><strong>浙富控股：预计2026年半年度净利润同比增长121%-156%</strong></p>\n  <p>浙富控股公告，预计2026年半年度归属于上市公司股东的净利润为12.50亿元-14.50亿元，比上年同期增长120.78%-156.11%。业绩变动主要系公司危废处置及再生资源综合利用业务保持稳健运营，产品销量稳步攀升，营业收入及盈利水平较上年同期实现较大幅度增长。（第一财经）原文链接</p>\n  <p><strong>招商轮船：上半年净利润同比预增214%—248%</strong></p>\n  <p>招商轮船7月5日发布业绩预告，预计2026年上半年实现归母净利润66亿元—73亿元，同比增加214%—248%。受供需结构变��及地缘局势等多种因素影响，国际油轮运输市场进入超级景气周期，报告期部分航线现货运费率创出历史新高；国际干散货市场受益于供需持续改善，BDI指数稳步回升。公司核心业务板块中，油轮船队承接一季度的优秀表现，二季度克服海峡封锁后油轮供过于求的阶段性困难，抓住市场机会再次取得良好业绩，环比一季度预计实现利润贡献增长50%左右；公司干散货板块表现同样出色，二季度业绩增速加快，环比一季度预计实现利润贡献增长170%左右。集装箱船队、滚装船队等也呈现稳步复苏趋势。（证券时报）</p>\n  <h2>投融资</h2>\n  <p><strong>具身智能公司光象科技累计完成数亿元天使轮融资</strong></p>\n  <p>近日，光象科技宣布完成累计数亿元天使轮融资，最新一轮融资由珠海科技产业集团、兴证资本、松禾资本、顺禧基金、慕华科创、See Fund、亿宸资本、上市公司行云科技等头部财投与头部产投深度参与，老股东零一创投、L2F光源创业者基金等持续加注。据悉，本轮资金将重点投入物理原生基座模型的研发迭代，并推进具身智能机器人产品的商业化交付。（每日经济新闻）</p>\n  <p>&nbsp;</p>\n  <p><strong>“零食消费”小调查</strong></p>\n  <p>明明没吃多少，零食账单却越来越长。这届年轻人，怎么越来越嘴馋了？&nbsp;</p>\n  <p>零食在年轻人生活中的地位似乎日渐重要。加班到九点，要靠一包“高蛋白肉干”撑到回家；下午路过便利店，顺手就拿一盒冷藏甜品、几颗现制卤味犒劳自己；周末，逛量贩零食店大采购成了日常解压方式——零食，悄悄占据了打工人的生活，成了忙碌日常中的“隐藏刚需”。&nbsp;</p>\n  <p>你买零食时，会因为“高蛋白、0糖、低卡”这些标签多拿一包吗？你多久会试一次没吃过的网红新品？你曾用零食代替过一顿正餐吗？在你心里，零食算一时嘴馋，还是一日续命？欢迎填写“零食消费小调查”，聊聊你心里最想推荐给大家的那款零食~&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_110000032f87442484f657adcfea5329@5667365_oswg6882oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“零食消费”小调查</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-07-06T00:02:20+00:00", "fetched_at": "2026-07-06T02:45:16.698847+00:00", "fingerprint": "278d8e4bc63e2849"}, {"source": "36氪 - 最新文章", "title": "2026，量子计算迟到的狂欢：能拿订单、奔赴IPO、市值破百亿", "url": "https://36kr.com/p/3883513899380744?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_cc7b1492ca7445ce866e3d611c6aae50@6221844_oswg609236oswg642oswg422_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/视觉中国</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>如果在七年前，有人告诉一个投资人，量子计算公司会有订单，还能在纳斯达克上市，市值破150亿美元，对方大概率会把这人当个骗子。</p>\n  <p>他们很多人都记得前几年那场“量子寒冬”。那一年，谷歌用量子处理器完成了一项计算， 200秒算出了超级计算机1万年才能得出的结果。人们以为， 量子霸权实现了，量子计算机真的能解决经典计算机无法解决的问题。</p>\n  <p>狂欢转瞬即逝。那终究只是一次炫目的实验，“大家很快意识到，现阶段的量子计算机不能做任何实用有意义的工作。”一位投资人回忆。</p>\n  <p><strong>谁也没有想到，2026年开始，整个行业忽然开始加速。根据投中嘉川CVSource数据显示，仅今年一季度，国内量子赛道融资总额已达32.04亿元，超过2025年全年。有头部公司不到半年就拿下超过10亿元融资。“融资变得比以往任何时期都容易。” 一位做量子计算的创业者告诉硬氪。</strong></p>\n  <p>二级市场也出现了标志性的事件。6月4日，全球最大量子独角兽Quantinuum登陆纳斯达克。这家营收仅3090万美元、净亏损1.93亿美元的公司，市值已经超150亿美元（约合人民币1000亿元）。&nbsp;</p>\n  <p>国内公司也看到了IPO曙光。本源量子完成近30亿元Pre-IPO轮融资，投前估值达210亿元，创下国内量子计算领域最大单笔融资。这笔投资背后，是中国兵器集团和多个省级政府平台。</p>\n  <p><strong>一位长期关注硬科技的投资人告诉硬氪：“现在的问题不是‘要不要投’，而是‘能不能投进去’。好项目太少，钱太多，大家都在抢。”</strong></p>\n  <p>量子计算不是新故事。过去十年，这个赛道每隔几年就会掀起一轮讨论，但每次都以“技术还早”“商业化太远”收场。投资人们听过太多“量子霸权”的概念，见过太多停留在PPT上的Demo，最后选择观望。</p>\n  <p>但2026年的这一轮热潮不一样。不少公司开始秘密递表，资本回报路径变得清晰，投资人愿意下注。更重要的是，一些公司告诉硬氪，他们已经拿到了金融、安防等领域真实的订单。</p>\n  <p><strong>“这个拐点或许只会出现一次。一旦错过了，可能就没有这样的机会了。”太一量生创始人刘弘斌告诉硬氪，他去年末从工作6年的微软离职，回国创业，最近已经完成3亿元Pre-A轮融资。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_96099a8e18f14f6aae215c857a37da98@6221844_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>为何忽然升温？</strong></p>\n  <p>这一切并非凭空发生。</p>\n  <p>将时间拨回2024年9月，微软与Quantinuum合作，成功纠缠了12个逻辑量子比特，创下量子纠错领域的新纪录。</p>\n  <p>所谓的逻辑量子比特，是由多个物理量子比特通过纠错码编码而成的“虚拟比特”——单个物理比特极易出错，但一群物理比特可以相互纠偏，让整个逻辑比特保持稳定。</p>\n  <p>在此之前，行业一直没能走出实验室。谷歌2019年那台轰动世界的“悬铃木”53比特量子计算机，同样无法跨越这道鸿沟，它的计算结果很快被经典计算机用新的算法反超。</p>\n  <p>直到逻辑量子比特落地，量子纠错才从理论变成实践。此前，量子计算机噪声太大，算完结果经常出错，更像实验室里的科学仪器，没法稳定干活——这就是所谓的NISQ时代（含噪声的中等规模量子阶段）。</p>\n  <p>而这次突破意味着量子计算终于有了自我纠错和反复使用的能力，正式从\"仪器\"迈向了\"计算机\"的雏形。正因如此，这在行业里被视为一道分水岭。</p>\n  <p>技术的发展步伐很快。谷歌用Willow芯片运行“量子回声”算法，速度比经典超级计算机快1.3万倍。</p>\n  <p>而在刘弘斌亲身参与的那台机器中，50个逻辑量子比特的商用机器已被丹麦诺和诺德基金会采购。</p>\n  <p><strong>“从1到50，我们花了不到一年，”他说，“这条指数曲线不会出现第二次。”</strong></p>\n  <p>与此同时，产业界的风向也在转弯。2025年初，英伟达CEO黄仁勋还在断言量子计算需要10到20年，“未来十年几乎不可能迎来使用”。</p>\n  <p>到了同年3月的GTC“量子日”，他公开修正了自己的判断，随后短时间内投资了三家量子公司，覆盖离子阱、中性原子和光子三条技术路线。</p>\n  <p><strong>“之前产业界没有共识，更多是在学术界和资本圈自嗨，”一位量子计算投资人告诉硬氪，“但2025年，产业界的转向非常明显。”</strong></p>\n  <p>有企业透露，他们两年前牵头了工信部的量超融合项目，如今英伟达、沐曦、摩尔线程都在主动寻求合作。“以前是我们找他们，现在是他们找我们。”某企业负责人表示。</p>\n  <p>政策的发令枪在同一时间扣响。2025年末，“十五五”规划把量子科技列为六大未来产业之首。“美国、欧盟早就有量子宣言，我们国家去年终于给了定位。”一位量子计算企业创始人感慨。</p>\n  <p>自那之后，行业真正沸腾。多位企业负责人告诉硬氪，规划出台前，融资要靠自己一场场地跑路演、一家家地谈条款；规划出台后，带着政策导向的大笔资本开始主动上门。</p>\n  <p>国家下场背后，当然还有更严肃和宏大的命题。“2021年，国际局势从混乱走向秩序。但到了2025年，秩序在崩塌。”一位业内人士表示，量子计算在密码破解上的潜力，使其成为国防和金融安全的核心关切。而且，量子行业与AI紧密相关，量子计算可能会彻底解绑算力限制，释放AI的能量。&nbsp;</p>\n  <p><strong>对很多创业公司来说，这可能是“once in a lifetime”的机会。他们要站在潮水刚开始翻涌的地方。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_fbdc08bfadca482ca1e92a8b473fa9c3@6221844_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>拨开泡沫</strong></p>\n  <p><strong>量子计算又走到了周期的波峰。经历过行业起伏的投资人仍心存疑虑。“这次火起来，主要还是十五五政策驱动，基本面没什么本质变化。”一位投资人告诉硬氪。</strong></p>\n  <p>拨开热钱去打捞真实需求，会发现这个行业的买单者仍以科研机构为主。金融、医药更多停留在算法层面的合作，设备还没成熟到可以落地。某量子计算公司向中国移动研究院交付了整机——但运营商仍然买它做科学研究，不是做生产。&nbsp;</p>\n  <p>这揭示了这个行业当下的真实处境：量子计算机更像是一台实验设备，而不是一个可以规模化铺开的生产工具。</p>\n  <p><strong>一位业内资深人士的评价很直接：“很多量子计算的Demo仍是应用示范，没有经济性。”</strong></p>\n  <p><strong>谁都无法回避，行业中大多数企业仍依赖政策支持和资本输血，而非自我造血。短期来看，政府补贴和培育项目仍是它们活下去的主要资金来源。</strong></p>\n  <p>不过，相比之前，量子计算的商业化应用场景有了拓展，更让人振奋的是，订单实实在在地来了。</p>\n  <p><strong>硬氪了解到，有公司在二线城市拿到千万级项目，与消费金融公司合作，用量子算法做小额贷款和风险评估；一家光量子公司在服务多家大型金融机构；还有企业与石油研究院合作，探索运筹优化、油气藏模拟。</strong></p>\n  <p><strong>一位量子计算企业高管判断，未来三年，药物筛选、新材料、催化剂研发等场景有望率先产业化。他们公司已经在金融风控、生物医药等领域与客户展开了实质性合作，部分项目已进入验证阶段。“量子计算不需要等到通用计算机出现才有价值，只要在特定问题上比经典计算机快，就有人买单。”</strong></p>\n  <p>当然，从订单结构看，这些尝试远撑不起真正的商业化付费。</p>\n  <p><strong>“这个行业还需要3-5年才能有突破性产品，整体对标欧美，行业发展还是会延期几年。”一位投资人告诉硬氪。中国科学院院士郭光灿的时间线更为保守，他认为通用量子计算机出现，大概还需要10年。</strong></p>\n  <p><strong>资本不是不知道前路漫长。只是在优质资产稀缺的年代，量子计算成了少数还能押注的选项。几乎所有人都有一个共识：量子计算是下一个AI级别的技术革命。</strong></p>\n  <p>Quantinuum上市，也可以看出这种憧憬还没有破灭。这家由霍尼韦尔量子解决方案部门与剑桥量子合并而成的公司，过去十年研发投入超过20亿美元，从未盈利。资本市场依然给出了超20倍的超额认购，发行价一再上调。&nbsp;</p>\n  <p>这是未来、是比AI还让人惊叹的革命。这个故事最大的瑕疵只有一个：太远了。</p>\n  <p>“这就像是在挖一口井，你知道下面有水，但不知道还要挖多深。有人挖到一半放弃了，有人还在坚持。问题是，谁也不知道还要挖多久。”一位投资人总结。</p>\n  <p><strong>留下来的人，在砸钱占位。“量子计算不是那种三五年就能见分晓的行业，它需要十年以上的耐心。但窗口期很短，错过就再也没有了。”一位从业近二十年的创业者总结。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_cba4787f838d42f7a4b520a7f34a53eb@6221844_oswg4962oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>量子计算的GPT时刻还有多远？</strong></p>\n  <p>和AI过去几十年发展类似，量子计算的技术路线远未收敛，更谈不上爆发。</p>\n  <p>目前，行业里有几条主流路线：超导可以复用半导体产业链，技术成熟度最高；光量子可向下兼容现有技术，能自建产线；中性原子扩展成本低、误差可擦除；离子阱精度最高、错误率最低。</p>\n  <p>选择不同路线的创业者，各有各的逻辑。有人押精度、有人攻克关键技术难点，有人想更快造出机器。</p>\n  <p><strong>“到底最后会是谁胜出，目前来说还是不一定的。但可以肯定的是，未来3-5年，一定会有至少一条路线跑出来。”一位从业者告诉硬氪。</strong></p>\n  <p>但无论选择哪条路，所有创业者都面临同一个问题：在商业化真正到来之前，谁能活下来？</p>\n  <p>没有人能给出确切答案。但所有人的行动，都在指向同一个方向：先囤够资金，再找出路。</p>\n  <p>他们赶上了好时候。</p>\n  <p>国内头部量子计算企业已经进入了上市前的最后冲刺。量旋科技启动Pre-IPO轮融资；图灵量子将2027年定为冲击IPO的目标年份；本源量子则在2025年9月就完成IPO辅导备案，今年6月初完成了近30亿元Pre-IPO轮融资。</p>\n  <p><strong>正因为上市有了清晰路径，一级市场才愿意冒险。有投资人观察，过去半年，量子计算赛道的投资逻辑已经发生了明显变化——从早期的广撒网式布局，转向对头部企业集中押注。“大家发现，真正有技术壁垒、有工程化能力的公司就那么几家，钱再多也投不进去几家。”</strong></p>\n  <p>如果将视野拉到更广阔的维度，量子计算也是大国必备的技术储备。AI时代，算力就是权力。</p>\n  <p>一台拥有300个逻辑比特、保真度达到5个9的量子计算机，运行几十分钟，对应的算力相当于一个吉瓦数据中心连续运行10年。而这样的吉瓦级超算设施，在全世界屈指可数，单个项目的投资规模动辄数百亿美元。</p>\n  <p>美国已经划出了时间线。IBM计划在2028年前后建成集成约200个逻辑量子比特的量子计算原型机。与此同时，有国内企业希望在2030年达到同等量级。这两组数字之间的竞赛，某种程度上也是中美量子计算实力对比的缩影。</p>\n  <p><strong>2026年的量子计算，已经站上了大国科技竞争的前线。从业者们或许会有些不真实感：几年前，量子计算还只是高校实验室里的小众研究方向，创业者是一场场路演中的边缘人物。</strong></p>\n  <p>两三年间，政策加码，资本涌入，人才回流，技术突破，这场持续了数十年的长跑，进入加速阶段。谁能在接下来的三到五年内率先跑通商业化路径，谁就有可能成为量子计算时代的英特尔或英伟达。</p>\n  <p><strong>胜出者或许并非今天的头部公司。“钱并不稀缺，稀缺的是懂产业的钱。这个赛道最终能跑出来的，不会是钱最多的那家，而是最懂怎么把技术变成产品的那家。”一位投资人告诉硬氪。</strong></p>", "category": "tech", "published_at": "2026-07-06T02:15:39+00:00", "fetched_at": "2026-07-06T02:45:16.698840+00:00", "fingerprint": "c632c67e9b71455a"}, {"source": "36氪 - 最新文章", "title": "AI 砍掉的第一批大厂人：高薪，高绩效，高P｜深氪", "url": "https://36kr.com/p/3883456791163138?f=rss", "summary": "<p>访谈｜任彩茹 兰杰 彭倩</p>\n  <p>文｜任彩茹</p>\n  <p>编辑｜乔芊 杨轩</p>\n  <h3><strong>“630”减员，AI是祸首还是替罪羊?</strong></h3>\n  <p>“现在公司有（减员）名单，你在这里面。”5月中的一天，林越被组长叫进会议室，对方开门见山。</p>\n  <p>林越的第一反应是平静，他早有预料。早在今年三四月，一些互联网公司内部便传出要裁员的风声。开年以来，中国互联网大公司围绕AI提效激进开展的token竞赛、培训会、隐形考核等，无处不在。当所有人都被卷入一场“all in AI”的运动时，“裁员一定会发生”就是大家心照不宣的共识。</p>\n  <p>但站在HR门口时，他还是迎来了情绪崩溃的瞬间：手开始发抖，犹豫了很长时间，想着怎么开头，怎么调整自己的举止表情。“我再也不想经历这样的事。”</p>\n  <p>林越月薪2万5，一年前本科毕业，入职携程当后端工程师——当时看，他是极其幸运的一个。互联网招聘红利不再，携程几千份简历只录取不到500人，但他进入的是公司最赚钱的酒店部门，负责为商业化产品写代码。</p>\n  <p>但现在看，月薪2万5、只有一年经验的初级程序员，不裁他裁谁呢？一是赔偿成本低，二是比起对业务通盘更熟的老员工，新人使用AI的效率往往更低。“有业务经验打底，想用AI做什么，有什么影响，老员工更清楚。”林越说。</p>\n  <p>斯坦福大学在一篇名为《Canaries in the Coal Mine?》（《煤矿里的金丝雀？》）的论文中，用“金丝雀”比喻刚踏入职场的年轻人。其研究显示，2022年ChatGPT普及以来，最年轻劳动者的就业大幅下降，到2025年9月，22-25岁软件开发者的就业相比其2022年底的峰值下降了近20%。</p>\n  <p>最近一年，AI让一切更卷了。携程曾是著名的“互联网养老厂”：程序员岗早上10点半上班，午休两小时，下午7点就能准时下班，主APP两周一个迭代。但林越入职没多久，赶上AI&nbsp;Coding能力大爆发，已经卷成一周一个APP迭代，“每天干到10点半”。</p>\n  <p>但这种节奏加快，并不是因为业务有爆发式增长，“而是因为不找事做，就会变成边缘部门，边缘部门就会被砍。”林越告诉36氪。但最终，他还是没有避免“被砍”的命运。</p>\n  <p>不过，“斩杀”也可能是无差别的。</p>\n  <p>苍述完全没想到，自己会是第一批出现在裁员名单上的人。</p>\n  <p>5月的一个周五，上班前半小时，“部门突然拉了一个all hands（全员会），HR直接宣布了结果，告诉大家有这个事儿。”</p>\n  <p>来美团之前，苍述是字节的SSP校招生（Super&nbsp;Special Offer），高薪入职，到最后也是组内同级员工中工资最高的一个。跳槽到美团后，组内的核心项目几乎都被放在他手中，今年本该是苍述的晋升节点。</p>\n  <p>这场裁员潮中，“绩优”、“高P”的保护屏障都失效了。苍述的隔壁组，裁掉的两名员工都在去年取得了“超预期”的绩效评级。裁到最后，苍述所在的小组几乎被全员“端掉”，“这个组名义上还存在，实际已经没人了。”</p>\n  <p>林越得知自己被裁时，才发现平时常常对接的两位前端工程师，“头像不知道什么时候已经灰了”；美团的一个用户增长大群，原本的数百位成员如今只剩一半左右；阿里巴巴的高德、飞猪等业务，也处在剧烈震荡中。</p>\n  <p>“630”成了社交媒体上的热词。它是国内AI真正大规模走进互联网职场的第一个季度末。六月底到七旬中旬，既是许多公司人员汰换的惯例时点，也是这场裁员潮中普遍设定的“last day”。</p>\n  <p>风向标硅谷已经率先在裁员，特征是成批量、规模大。5月，Meta宣布裁员8000人，7000人转岗AI部门，成为硅谷科技公司里最动荡的一家，高管承认“公司士气近20年来最低”；更早时候，亚马逊宣布裁员1.6万白领岗位，把省下的资金投向AI。</p>\n  <p>2021年上一轮裁员潮发生前，国内互联网大公司疯狂扩张边界，高密度地成立一个又一个新业务，一批人被快速招募起来，又快速抹去。</p>\n  <p>但今年裁员潮的内在主线并非这样单一。<strong>AI提效、大而重的老业务增长乏力或深陷竞争泥潭、投资AI新业务带来的现金压力，在这个时段交织并行。</strong>许多被通知离开的人，也很难说得清这些因素孰轻孰重。</p>\n  <p>《哈萨比斯：谷歌AI之脑》的作者称，如同奥本海默创造了原子弹，却无法控制它的使用，追求真理的科学家们也是“万物的破坏者”：我们的工作、思维方式，甚至生存，都可能被“破坏”。十年前的韩国首尔，AlphaGo带给人类棋手李世石最初的破坏。十年后，从硅谷到北京，这种破坏再次蔓延。</p>\n  <p>对大公司而言，AI是船票，它指向大模型或AI应用这类新业务。但新业务能不能干成、何时干成，没人说得准。面对不再增长的老业务，大公司不得不在每一个确定的和不确定的方向上，更加坚决地提效、进而裁员。</p>\n  <p>林越向朋友倾诉裁员遭遇时，被安慰道，“没关系，我们大家都会有这一天，只是你的这天来得更早一些。”但比自我开解更重要的可能是，被AI替代、被大厂裁员后，人们该如何选择、如何行动。</p>\n  <h3><strong>焦虑的高层、加码的中层、发疯的基层</strong></h3>\n  <p>“以前在字节两个月才能做出来的产品demo，我们现在两个星期就能做出来。”一名前字节产品经理、现AI创业公司高管对36氪说，有了Claud Code、Codex这样的工具后，自己团队现在可以3小时做出demo，一周内完成想法验证。</p>\n  <p>“一个产品（经理）就像一个CEO。”他说，组织结构可以随之大幅压缩，信息传递的损耗比大厂少太多，完美“熵减”。</p>\n  <p>当创业公司借助AI快速行动之时，互联网大厂回望自身，是否会觉得自己像迟缓的巨兽？</p>\n  <p>来自大厂最高层的表态，往往是一个信号。</p>\n  <p>今年3月，美团CEO王兴在高管沟通会上谈到自己对AI的看法，“AI Agent对我的冲击比ChatGPT更大，AI注定会创造巨大生产力，也一定会对组织、对工作模式带来很大的变化。”</p>\n  <p>那场沟通会结束不久，美团在全公司范围拉了一场线上大会，核心是宣贯“龙虾”的安装与使用，提倡每位同事安装“龙虾”，以及将日常工作尽可能写成可复用的Skill。</p>\n  <p>会后，在美团核心本地商业从事商家运营的陈宇佳收到通知，需要在每周的周报里加上一个板块，写明自己利用AI做了哪些提效、有什么Skill可以推广到全组和全部门使用。“然后就感受到大家好像拼命在把AI融入自己的工作中。”</p>\n  <p>4月的一天，一位阿里算法工程师毫无征兆地收到部门上一个月的token消耗排行榜，他以170亿token消耗量赫然位列第一名，被公开表扬。部门老板表示，以后年度KPI、晋升考核都将参考这一排行。但一个月后，新的token消耗排行榜没能如期而至，“可能老板也发现了这种排名方式不靠谱。”</p>\n  <p>新的规则接踵而至。部门领导很快又提出，员工需要在工作日的早上11点到下午6点上传每小时的“时报”，由Agent上的插件自动记录代码及对话内容，生成工作总结——这意味着员工无法修改自己的时报内容。就在第二天，hr以近乎争吵的姿态，劝阻了该领导的荒谬制度。</p>\n  <p>类似这样的事情，已经不再让人意外。来自高层的AI焦虑不断下放，中层们层层加码，努力暗示下属，这是一场隐形的汇报竞赛、军备竞赛、淘汰竞赛。</p>\n  <p>尽管没有强制每个人一定要写Skill，陈宇佳的部门领导还是会密切关注每个下属的token用量，不时询问具体情况，“他也不清楚AI具体能做什么，但他说他不允许我们团队的每个人在这次AI浪潮中落后”。有时在工作结束后的私下聚餐中，大家也会接收到老板暗暗传达的一种危机感，“一定要把AI用起来，否���到时候我想拉你们一把都拉不了。”</p>\n  <p>阿里某AI Coding产品的一位工程师告诉36氪，集团一些业务的老板会向他们的产品团队提出请求，希望通过增加数据埋点的方式，“让他清楚地看到团队成员每天使用AI的具体轨迹。”</p>\n  <p>美团的一些中层在接到裁员指标后，甚至会向上递出一份更激进、比例更高的裁员名单——更少的人、更高的AI参与度，某种程度上直接等同于新时代的“管理成绩”。</p>\n  <p>AI提效成了一个任何业务、任何职能都能去“搞一搞”的事情。但关于AI到底能做什么，要怎么落地实现，一条长长的裂缝始终横亘在基层与管理层之间——各级老板对AI赋予无限美好的期待，基层拼命去实现、却总也触及不到那个设想，最终只能疲惫地“表演”。</p>\n  <p>江灵在阿里淘天集团做客户运营，她的工作是尽可能拉齐消费者需求和商家供给。在她看来，老板们总是“把AI想得很智能、很简单”。</p>\n  <p>就拿电商中常见的异常场景“爆单”来说，高层期待通过全量巡检，提前找出所有“爆款”。然而，平台一天的商品量是千万级别，远远超出了现有人力和Token可以负荷的数量，于是只能小范围测试，挑选几十万个商品，由于样本范围太小，命中率往往很低。</p>\n  <p>“作为一个员工，你没法反驳老板的那种期待，你懂吗？”江灵激愤又无奈。</p>\n  <p>很多时刻，江灵觉得自己就像一头驴，有鞭子在后面抽。“累不可怕，没有方向和正反馈，才是最可怕的。你就是不停地拉磨，也不知道最后要去哪里。”</p>\n  <p>“你不能把AI当成一个许愿池用。”一家AI公司的CTO对36氪总结，AI提效有很多前提，基础是数据，但很多公司的数字化本身就没做好；此外，许多流程上的卡点在“人”，是单靠AI无法解决的。</p>\n  <h3><strong>“一代人有一代人的土木”</strong></h3>\n  <p>产品、运营等大厂岗位感受到的还是不确定的焦虑，而程序员只能率先接受被宣判的命运。</p>\n  <p>百度前端工程师李川第一次被AI能力震惊，是在今年初用到Claude Code。“同样的复杂需求，用国内一些大模型可能需要五到六轮对话，用Claude两三轮就搞定了，且完成得更好。”</p>\n  <p>他第二次被AI惊艳，是今年4月。中国大模型公司智谱发布GLM-5.1模型，“一是便宜，二是它的能力完全可以作为Claude Code的平替。”</p>\n  <p>李川当时就意识到自己的饭碗不保。到了5月，他果然出现在“名单”上。</p>\n  <p>如同一枚硬币的两面，一面是2026年5月，Claude Code母公司Anthropic已经实现470亿美元左右的年化收入（ARR），半年时间涨了四五倍；智谱也在近期冲上万亿市值。</p>\n  <p>另一面是AI Coding能力的极速成熟，让程序员成为了这轮裁员潮中的重灾区。“各家首当其冲的几乎都是产研团队，尤其是前端开发、测试开发这样的岗位，通常很容易被老板认为含金量不再。”一位互联网公司HR告诉36氪。</p>\n  <p>2025年，李川以校招生身份进入百度，成为一名前端工程师。一年前参与校招面试时，AI还仅仅扮演着搜索引擎的角色，只能通过简单问答来辅助编程，面试官全程都没有谈及AI。</p>\n  <p>“前端”是李川理想的职业，因为这是一个所见即所得的工作，代码质量直接体现为产品界面上的每个细节。每到过年，告诉家人“打开百度app，上面那个东西是我做的”，会让他尝到成就感和“工作的意义”。</p>\n  <p>多年以来，大公司的程序员被泾渭分明地划分为算法、前端、后端、测试等职能，前端对审美、交互等软性能力要求更高，后端则更需要严谨的技术能力。这一行的薪资水平和“鄙视链”，也直接跟“技术含量”挂钩——前端比测试高，但不如算法工程师和后端工程师。</p>\n  <p>仅仅一年，李川熟悉的一切已经地覆天翻。写代码和改代码的工作被AI大面积接管，程序员的几种职能也模糊了界限。甚至产品经理也能一脚跨进编程的门。</p>\n  <p>阿里的一个开发部门，今年五月接到部门老板的通知，要求大家暂停所有的非紧急需求，每个团队开发一个Agent，以后针对任何业务需求，都只能由产品同事直接与Agent对接。程序员只能修改Agent，不能碰代码。老板还暗示，到今年十月份，做得好的团队将接替不好的团队来维护Agent。</p>\n  <p>腾讯CSIG的技术团队研发了一条为公司App修复bug的流水线——由AI修复bug，程序员只需要在bug解决完成后进行检查，点击“确认”按钮，代码就会合入，它的修复准确率目前可以达到50%。</p>\n  <p>阿里巴巴5月在内部成立了一批全栈小组，让前端、后端和测试工程师都转成“全栈工程师”，成为“超级个体”。6月开始，美团内部也在全面推行前后端开发的合并。</p>\n  <p>转“全栈”理论上是可行的，但实践起来，却是扒掉一层皮的痛苦过程。</p>\n  <p>突然被转为全栈工程师的韩之，根本没有太多时间学习，很快就要开始自己的第一个“全栈”项目，前后端开发、测试由她一人包揽。“现在我所有需求都是‘倒排’的，规定几号几号前上线，”她最近工作强度打满，晚上9点手头的活儿还没干完，“我实在太累了”。</p>\n  <p>但大势不可违。从去年底到今年初，中国几家头部公司都在尽可能地撒钱，推动程序员消耗token，逐渐淘汰“古法编程”。</p>\n  <p>最高峰时，腾讯CSIG团队成员享受的是2000美金/月的token额度，只要诉求合理、有相应的代码产出，用完还可以申请翻倍提额。token使用量也同步被纳入考核，“当你的用量很低时，你的leader会问你为什么。”因此，一些人会把用不完的token额度借给别人。</p>\n  <p>多年以来，大厂程序员意味着高薪与光环。他们是互联网公司的基石，“程序员精神”的内涵是开源与分享，是代码的简洁与优雅，是没有杂音的唯成果论，是看到字符在屏幕上跳动时的兴奋感。</p>\n  <p>但时代变了。几乎每一位受访的程序员都对36氪谈到同样一种感受，“离开AI将无法工作，假如AI‘挂掉’了，我宁愿花大量时间去找新的Codingplan，也不愿意自己去看代码改一改”——再去谈论所谓的“程序员精神”，也显得不合时宜。</p>\n  <p>李川说，昔日一个优秀程序员的修养是学习和迭代，因为过去几十年编程语言一直在变，不学就跟不上技术前沿。他和朋友们周末去咖啡馆研究新技术也是常有的事，“这个群体本身就挺卷的”。但AI恐怖的迭代速度让人彻底失语。</p>\n  <p>“如果AI Coding锁死在25年的水平就好了，能抹平我这种一两年资历和七八年资历人的技术水平，同时又不能真正代替人，还有很多‘对话框’之外的事可做。”林越感叹。但技术不会为谁停车，现在他毫不怀疑，程序员的消亡已经是进行时了，“就像珍妮机发明后的纺织工人一样”。</p>\n  <h3><strong>旧增长没了，新赛马启动</strong></h3>\n  <p>当技术给一家公司的效率注入倍数级杠杆，随后发生的事情无外乎两种——同样的人做更多的事，又或者，一家公司不再需要这么多人。</p>\n  <p>“我们不裁员。”一家软件公司CEO对36氪说，好不容易“调教”出了这些对行业、开发方法富有认知的程序员，每一个都是公司的财富，当AI Coding把编程效率提升了5倍，他要做的不是裁掉4/5的人，而是把业务扩大5倍。</p>\n  <p>这愿望固然美好，但问题在于，市场还有这么多增量吗？</p>\n  <p>被裁之前，林越短暂体会到AI写代码的“解放感”，但很快，他反倒变得更忙了。以往，业务对App细节有迭代需求时，总要等排期慢慢来。现在业务的需求越堆越快，无论可不可行、重不重要，都让研发团队“先做出来试试”。</p>\n  <p>但这些需求在林越看来多少有点“鸡肋”——最小的“banner位”修改一下文案细节，又或是将浮窗广告由“免费取消”改为“积分抵扣”。“产品经理变变这个，变变那个，我们会做AB测试，改后效果能变好的情况真的不多。”</p>\n  <p>“越没有增长的部门越是all in AI，总要找点新故事讲嘛。”苍述说。他既待过外卖业务，也待过无人机业务，以他的亲身感受，前者卷AI的氛围比后者浓得多。</p>\n  <p>一位刚在Meta经历了大裁员的Infra工程师告诉36氪，学会压榨AI后，他和同事们以前没时间做的事情，“现在都想做一做”。但如今一大批人离开，留下的同事又开始把那些必要性不高的工作砍掉。</p>\n  <p>摆在所有人面前的现实是，移动互联网时代跑出的明星产品们，如今都很难再通过“做更多工作”而实质性地推高增长。其中一些公司不仅没有增长，还因激烈的外部竞争而失血严重。</p>\n  <p>2025年外卖大战几家公司烧了2000亿，将美团的利润与现金流拖入泥潭，这让人均贡献利润原本就低的美团率先进入裁员周期。但换个角度看，美团的业务高度依赖线下履约，AI提效空间跟线上化程度更高的公司比是偏小的，“如果连美团都能通过AI提效减员，那其他公司一定会跟进。它是一个风向标。”一位美团员工说。</p>\n  <p>传统现金牛业务广告持续萎缩的百度，在阿里内部长期边缘、贡献微薄的飞猪和高德，也都是类似情况。</p>\n  <p>旧业务的裁员难以避免，那么活水的机会存在吗？</p>\n  <p>一些管理层在谈起裁员话题时，会告诉员工“公司现在也搞AI，可以试着去找找自己能做的项目。”一位美团员工告诉36氪。近日，美团核心本地商业新成立了AI Transformation部门，主要职能是探索用AI梳理业务的内部流程；此外，不少核心中高层也在亲自带队做AI相关项目。</p>\n  <p>字节的一位产品经理王岳告诉36氪，他正在内部创业，做一款面向B端客户的AI提效类产品，“公司鼓励大家去做这样的探索”。在立项之初，他们不仅主动抹掉了“设计”和“测试”两个职能，还要向评审会强调，这款产品未来将节省多少人力成本。王岳的另一位同事在开发AI客服的Agent产品，其2026年的OKR就是“帮助公司裁掉xx%的客服”。</p>\n  <p>如今，这样的项目，在每家大厂都有十余个或数十个小团队在做。“有时候会几个团队做同一个方向，谁跑出来了，公司就集中资源推谁。”——一场新的赛马开始了。</p>\n  <p>变动的除了业务重心，还有组织形态，比如抹去更多中层管理者。</p>\n  <p>腾讯从今年起开始推行项目制，弱化管理职级，给负责人恢复专业职级；美团在今年年中盘点时裁掉了一些L9（事业部总监级），还在近期全面取消X1节点（此前最低的一层管理节点），减少管理层级。</p>\n  <h3><strong>就让我们挥别过去</strong></h3>\n  <p>AI的巨浪究竟会把人带往何处，多数人都还没有一个“顿悟时刻”。</p>\n  <p>离职缓冲期结束前的六月中旬，林越已经在密集推进淘宝、快手和字节的面试。继续“大厂程序员”的职业生涯，仍然是他内心期盼的最优路线。但这些公司的橄榄枝至今没能如愿抛来，“太难了。”林越说。</p>\n  <p>“找到一份工作是容易的，但一旦从大厂去了中厂、小厂，你就不可能再回到大厂了。”在林越心里，放弃大厂某种程度意味着永久性跌落，他不愿“退而求其次”。</p>\n  <p>也有人放下“大厂执念”。李川从百度离职后的第三天，便无缝入职了一家初创公司。顺其自然地，他的岗位从过去的“前端工程师”变成了“全栈工程师”。这家公司的主力产品是办公类的AI Agent，还给他涨了薪。</p>\n  <p>尽管大家都说时代变了、程序员的技能不再可靠，李川仍然有一些“技术憧憬”，希望以技术人员的角色参与到一款被用户喜爱的产品中，而这未必只能在大厂实现。</p>\n  <p>从阿里离开后，江灵入职了一家老牌汽车公司。她如今的工作内容不必强行与AI关联，不用再每天焦虑“老板的AI任务能不能完成”，当然也不用再“拼命表演”。江灵最近负责的一个项目9月30日才上线，“这些任务落在我的舒适区，时间又宽裕，人真的会身心愉悦许多。”</p>\n  <p>最近，她所在的部门每每放出招聘岗位，“都有一堆什么阿里的人过来面试，疯了一样地往制造业跑。”</p>\n  <p>也许程序员群体最终还会留下10%，但苍述不想再找大厂的工作，“去卷成这绝望的10%”。</p>\n  <p>5月被美团裁员后，他果断踏上了创业道路。AI浪潮前，他就以副业形式尝试自己做点什么。彼时，只是建社群、兜售一些技能，就让他体会过月入十万的滋味。</p>\n  <p>今年三四月时，苍述社群里的一些“学员”，已经踩着浪潮投身AI创业，“开了自己的公司，招了很多人，我还苦哈哈在这上班，这对吗？”他问自己。</p>\n  <p>如今，苍述的创业项目是面向海外，围绕罕见病用户的需求开发系统、做独立产品，他也在小红书账号“苍述（戒掉月薪版”与海外社媒上向网友分享进展。主产品之外，他还在多线并行一些小产品，以此保持手感，“一个小工具最多三四天完成，复杂系统可能需要半个月。”——这都远远快于大厂的常规排期节奏。</p>\n  <p>AI或许是人类有史以来最强的智力杠杆，它可以把个人能力放大N倍，可以支撑大部分初创产品的落地，也可以让每一个好的idea被快速看见并定价。</p>\n  <p>生于2000年的苍述说，自己是一个注定创业的人，但假如没有这次裁员，他可能不会在此刻行动。“公司帮我做了决定。”</p>\n  <p>“既往不恋，纵情向前”，这是美团给每位离职员工告别短信中的最后一句话，也是最近许多大厂人离开时会提起的一句话。在AI带来的这场复杂变革里，离开大厂、留在大厂，都无法再延续过去的路径。</p>\n  <p>短暂的“碎”过之后不是躺倒。转行也好，创业也好，先接受变化的人或许能先看到不一样的世界。</p>\n  <p>（周鑫雨对本文亦有贡献；应采访对象要求，文中林越、江灵、李川、王岳为化名）</p>", "category": "tech", "published_at": "2026-07-06T02:26:34+00:00", "fetched_at": "2026-07-06T02:45:16.698831+00:00", "fingerprint": "6a968463b58df8b6"}, {"source": "36氪 - 最新文章", "title": "跨境电商风向转变：新生代不再只拼价格，开始争“定价权”丨最前线", "url": "https://36kr.com/p/3883561480876297?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨最前线</p>\n  <p>6月30日，亚马逊全球开店与福布斯中国联合发布“2026福布斯中国新生代跨境电商30人评选”，30位入选者平均年龄仅35岁，95后已开始崭露头角。</p>\n  <p>入选者既有3D打印、庭院机器人、AI助听器等硬核科技赛道的开拓者，也有家具、家居、服装等传统产业的变革者。他们来自广东、浙江、江苏三省，占比超过75%。更重要的是，这些年轻创业者共同票选出了三个年度关键词：“星辰大海”、“快与慢”和“定价权”。</p>\n  <p>这三个词背后的指向也很有意思：全球化视野、长期主义决心，以及跳出价格战的野心。</p>\n  <p>过去一年，昂听ELEHEAR在美国亚马逊助听器类目做到品牌第一。创始人苗健彰长期深耕AI声学算法，2021年切入助听器赛道，走了一条“很慢”的路——全栈自研。</p>\n  <p>硬氪了解到，助听器行业有一个长期矛盾：传统医疗级产品性能好但价格高昂，线上廉价产品体验糟糕，啸叫、降噪差等问题普遍存在。</p>\n  <p>昂听ELEHEAR的做法是打造全新的AI助听器+远程实时验配模式，自研VOCCLEAR® AI算法，在低功耗、低延迟的苛刻约束下解决声音处理问题，同时通过自建产线和D2C，重构助听器销售链条。2024年10月，昂听ELEHEAR推出旗舰产品BEYOND，定价399美元，以一个全新、普惠的价格带撬动市场。早期种子用户反馈，399产品性能接近高端3000-4000美元助听器，又比以往100美元以下低质产品具有更完整、专业的助听服务体系。</p>\n  <p>同样从技术切入的还有深圳汉阳科技的黄阳，历时8年打造出Yarbo智能庭院机器人，填补消费级扫雪机器人的产业化空白。BOCOMAL波科马的谢秀臻则通过自主研发新型轻量化阻燃材料，将防护服装重量降低35%、透气性提升50%，上线首年单品销量突破15万件。</p>\n  <p>这些案例的共同特征是：不再靠“中国制造”的成本优势打价格战，而是用技术建立自己的定价权。</p>\n  <p>在运营端，AI的应用正在从单点提效升级为系统级的基础设施。亚马逊调研显示，超过98%的受访中国卖家已在运营中使用AI工具，其中16%已进阶到部署AI工作流或智能体。</p>\n  <p>哈库拉玛塔达是这一趋势的典型。创始人孙翔以4人团队起步，两年半做到2500万美元营收，在母婴睡眠细分品类做到亚马逊美国第一。背后是一套由20多个定时启动的AI智能体、6个常驻机器人构成的运营系统，7×24小时自动运转。</p>\n  <p>这套系统的核心不是“写文案”，而是“听用户”。孙翔团队用AI扫描4000多条评论后发现，美国市场消费者选购婴儿睡袋时最看重的卖点是“双向拉链”，而非团队自以为重要的“静音魔术贴”——背后是美国家长对换尿布便利性的真实需求。过去这种洞察需要大量试错，现在AI直接给出了答案。</p>\n  <p>更值得关注的是AI正在参与组织决策。哈库拉玛塔达内部搭建了一个“业务大脑”Agent，掌握公司战略、供应链、各成员能力等全部信息，对下属AI生成的建议进行筛选和判断。</p>\n  <p>本质上，AI已经从执行工具变成了管理系统的一部分。</p>\n  <p>在浙江温州，95后黄强帅接手的家族锅具工厂走了一条不同于纯品牌或纯代工的路线——“OEM+ODM+自有品牌”三轮驱动。</p>\n  <p>他留学期间就开始做跨境电商，2020年回到温州。起初自有品牌和工厂代工是两条并行线，直到他把两者“并轨”。电商团队先把自己当成工厂的“客户”，从市场需求出发反向给工厂下订单。积累的消费者数据被用来在OEM客户提出需求之前预判产品方向，甚至在提案时直接告诉客户“你有潜在问题，我能解决”。</p>\n  <p>这套模式带来的变化是：部分线下商超客户不再要求贴牌，而是主动提出“能不能用你的品牌卖”。工厂从被动接单者变成了有品牌资产的一方。</p>\n  <p>黄强帅还在发起一个跨境OPC创业社区（One Person Company，一人公司），通过共享仓储、物流、合规资源和五年积累的知识库，降低年轻人创业门槛。“我们不求前三年盈利，”他说，“先一起把项目跑起来。”</p>", "category": "tech", "published_at": "2026-07-06T02:43:23+00:00", "fetched_at": "2026-07-06T02:45:16.698813+00:00", "fingerprint": "5c15a55bfdf607a4"}, {"source": "少数派", "title": "背单词更要背释义，FenyiDic 让你记住「熟悉的陌生人」", "url": "https://sspai.com/post/111632", "summary": "每个单词都认识，为什么还是读不懂英文？<a href=\"https://sspai.com/post/111632\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-05T09:08:05+00:00", "fetched_at": "2026-07-06T02:45:14.792552+00:00", "fingerprint": "a7078a3241d4f023"}, {"source": "少数派", "title": "派早报：阿里禁用 Claude 模型", "url": "https://sspai.com/post/111973", "summary": "<p>阿里禁用 Claude 模 ve-deletion", "summary": "The US Department of Energy reportedly deleted about 6,000 pages related to energy conservation as a historic heatwave tears across the country. The deletion was suspiciously timed, following Republican outrage over Mayor Zohran Mamdani asking New Yorkers to help reduce strain on the grid by setting their AC to 78 degrees. Republicans like Ted Cruz [&#8230;]", "category": "tech", "published_at": "2026-07-04T16:19:06+00:00", "fetched_at": "2026-07-05T02:40:17.913899+00:00", "fingerprint": "9480aa2c77d3d161"}, {"source": "The Verge", "title": "NASA launched an emergency mission to stop the Swift Observatory from crashing to Earth", "url": "https://www.theverge.com/science/961459/nasa-emergency-save-swift-observatory-katalyst-space-technologies", "summary": "The Swift Observatory was launched in 2004, but recent solar storms have pushed its orbit lower, and it's in danger of burning up in Earth's atmosphere as soon as this year. To try and stave off its demise, NASA has enlisted Katalyst Space Technologies. The company's Link spacecraft launched Friday with the goal of intercepting [&#8230;]", "category": "tech", "published_at": "2026-07-04T19:06:27+00:00", "fetched_at": "2026-07-05T02:40:17.913888+00:00", "fingerprint": "6871972627480601"}, {"source": "36氪 - 最新文章", "title": "对话傲鲨创始人徐振华：当科幻机甲成为户外装备，外骨骼如何重新定义人机关系？", "url": "https://36kr.com/p/3880770270425089?f=rss", "summary": "<p>《流浪地球2》与游戏《死亡搁浅》中，主角身穿外骨骼行走的人类未来图景，正在成为户外爱好者的真实装备。</p>\n  <p>7月4日，阳澄湖半岛度假区，十几个人身穿“机甲”在湖畔徒步。他们穿的是傲鲨VIATRIX增程动力外骨骼机器人，走几步后很快步伐变得轻盈，这是外骨骼通过学习他们的行走姿态，在抬腿瞬间加上一定推力，使6公里的徒步体验更像一次悠闲的City walk。</p>\n  <p>当天的机甲徒步活动由傲鲨联合户外平台一帐之地共同策划，路线串联沿湖步道、度假空间与生态公园，沿途设置多个观景和换装点位，将前沿科技、户外美学与湖岸风光融为一体，让参与者沉浸式解锁人机协同的徒步方式，感受徒步的松弛感与探索感。</p>\n  <p>作为人类身体力量的延伸，以傲鲨为代表的外骨骼机器人正逐渐从工厂流水线和医院康复科走向户外山野，将突破人体移动和体能限制的能力，进化为一种人机协作的全新出行和运动方式。</p>\n  <p>傲鲨2018年成立于上海，团队前身从医疗康复外骨骼研发起家，很快进入工业应用领域，在应急消防、电力巡检等大量工业物流场景落地应用，海外业务覆盖美国、日本等25个国家和地区。随着轻量化等技术逐渐成熟，2025年傲鲨开始切入消费级外骨骼市场，旗下的消费级品牌VIATRIX凭借独创的Float360浮动式髋关节架构与AI运动部署，先后斩获CES 2026创新奖与第十届中国设计智造大奖银奖。</p>\n  <p>“做消费级外骨骼是我们的核心目标，工业场景的研发也会持续进行，形成‘工业打基础+消费带增长’的双轮驱动。”傲鲨创始人徐振华告诉我们。</p>\n  <h2><strong>1.做更轻、更智能的消费级外骨骼</strong></h2>\n  <p>最早对傲鲨消费级产品产生兴趣的并不是极限运动员和专业越野跑者，而是“办公室坐久了，体能一般、但想走出去看看”的普通人，徐振华发现，其中30-50岁男性尤其居多。</p>\n  <p>女性用户偏少则是因为当前外骨骼产品整体上仍显粗壮，穿戴协调性和拍照效果相对受限。“所以我们也正在材料和系统设计上做持续研发，让外骨骼变得更轻盈、更好看。”徐振华表示，<strong>轻量化和智能化是消费级外骨骼产品的必然趋势</strong>，变轻不仅提高使用舒服度，也能降低动能损耗，使设备更省电，反过来又能让电池尺寸做得更小更轻。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260704/v2_d0f4055d61b44e658712a0f770edb4af@5688585_oswg182314oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">傲鲨外骨骼机器人</p>\n  <p>而智能化则是外骨骼可以真正在户外场景落地的技术基础。几年前一些外骨骼品牌曾发起一轮市场推广，但最终并未获得市场成功。徐振华分析，这背后的关键在于，当时的外骨骼缺少AI能力，只能做运动规划。而每个人的运动习惯、走路步态不同，在爬楼、山路等不确定性环境中很难做到与用户真实运动的高度融合。</p>\n  <p>而如今叠加AI能力后的外骨骼，真正实现了从预设程序到实时学习的跨越。“设备开机后，用户只要走几步，AI就可以自动根据步态进行助力，运动过程中还会不停采集数据进行修正，让设备与用户越来越融合。”徐振华介绍，VIATRIX的自研车规级响应电机能够毫秒级精准输出动力，双腿总计46Nm的动力配合AI步态算法带来腿部力量提升。</p>\n  <h2><strong>2.从一场徒步到一个生态</strong></h2>\n  <p>傲鲨把外骨骼带进山野，并不是从阳澄湖才开始。此前傲鲨在千岛湖策划的机甲徒步活动结束后，这条路线也成为一条常态化线路，傲鲨还联合一帐Camplus在景区布设户外场景租售体验点，为后续游客提供外骨骼租赁的徒步体验服务，打造集户外场景、主题活动、深度体验为一体的特色空间。</p>\n  <p>从千岛湖到阳澄湖，到目前为止，傲鲨已在全国布局20个文旅生态合作网点，先通过活动验证路线、积累内容、渗透核心人群，再将体验产品化为可反复运营的租售点，让用户能在真实的户外场景穿戴体验，再决定是否入手。</p>\n  <p>徐振华表示，这种“科技+文旅”生态的运营模式，不仅有助于打消潜在用户的决策顾虑，还可以通过用户实测数据反哺产品迭代，形成“体验-验证-转化-迭代”的正向循环。</p>\n  <p>除了走进山野，傲鲨也在城市内进驻Haglöfs（火柴棍）线下门店。“国内的外骨骼公司大多缺乏10年以上的户外经验。”徐振华表示，傲鲨选择找最懂户外的品牌“补课”，“向资深的百年户外品牌企业学习，可以更精准地理解客户和场景，迭代调整产品。” 同时，作为一家以产品研发为核心能力的外骨骼科技公司，傲鲨VIATRIX的愿景是联合户外行业的生态伙伴们，以技术赋能，共同打造下一代户外科技装备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260704/v2_92b52c7170c149e6aaaea29d7d6406c6@5688585_oswg121086oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">傲鲨线下门店</p>\n  <p>从单次尝鲜到可持续的户外生活方式，从传统零售终端到深度体验网络节点，傲鲨以这种可复制、可扩展的模式，构建从品类心智占领到商业闭环构建的系统布局。</p>\n  <h2><strong>3.不取代人，是人体力量的延伸</strong></h2>\n  <p>“穿外骨骼爬山，是作弊吗？”</p>\n  <p>徐振华对这个质疑并不陌生：“外骨骼是根据人体动作和指令，做毫秒级响应并进行力学放大，保证用户在体能到达极限时，依然保持理想的技术动作。”</p>\n  <p>换句话说，外骨骼不会替人做决定，而是通过“增程动力”从整体上节约人的体力，让正确动作更省力地完成，从而扩展极限耐力的持续时间。也就是说，在同样的体力极限下，人可以走更远的路，身体机能同样得到充分锻炼。</p>\n  <p>此外，傲鲨外骨骼目前使用的浮动式360关节，可以更好地匹配人体的整体运动灵活度，避免徒步过程中的摔倒和不必要的运动限制。</p>\n  <p>徐振华明确区分了消费级和医疗级外骨骼的边界。在他看来，两者之间的界限不是技术能力的递减，而是产品逻辑的根本不同，后者需要与医生的临床诊断深度结合，涉及复杂的康复评估和风险把控。</p>\n  <p>但在消费端，这两类产品的边界对普通用户来说往往是模糊的。“很多人分不太清楚外骨骼的实际功能，到底什么是医疗的、什么是日常穿戴的。”徐振华说，傲鲨重视售前主动说明，在用户咨询环节向用户做明确的指导和说明。“如果用户有偏瘫、脑卒等问题，我们会明确不推荐他们使用消费级外骨骼。对于年纪较大的用户，也会要求对方拍摄一段行走视频，根据行走情况做一些售前预判”。</p>\n  <p>这种“有所不为”的克制，背后是对外骨骼技术边界的清醒认知。Fortune Business Insights预测，2025年全球可穿戴机器人外骨骼市场规模为24.9亿美元，赛道热度进一步升级，傲鲨等多个品牌已完成多轮融资。但徐振华对行业当下的“爆发”保持理性：“外骨骼不会出现‘iPhone 4时刻’这样的突变，而是在更长时间内持续爬坡，最后靠好的产品能力培养起用户习惯。”</p>\n  <p>外骨骼的快速进化还向人们抛出另一个问题：当技术可以帮助人走得更远时，人的物理“边界”由什么来定义？徐振华看来，不同于人形机器人以替代人为目标，外骨骼追求的是与人的合作，追求保持人的主体性的同时，赋予人更强的力量和更大的自由。</p>", "category": "tech", "published_at": "2026-07-04T03:25:22+00:00", "fetched_at": "2026-07-05T02:40:17.850713+00:00", "fingerprint": "f18d78d32f22084a"}, {"source": "少数派", "title": "[送码] 聆听用户建议，1Capture 新增多项实用截图功能", "url": "https://sspai.com/post/111645", "summary": "各位少数派的朋友好，距离上一次在少数派介绍1Capture已经过去一年。过去这段时间里，我们开发的这款Mac截图与录屏工具继续做了多轮更新，也根据用户反馈补齐了一些更适合团队协作和产品展示的功能。市场 ...<a href=\"https://sspai.com/post/111645\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-04T07:55:48+00:00", "fetched_at": "2026-07-05T02:40:15.464903+00:00", "fingerprint": "3e5547337062546f"}, {"source": "BBC World News", "title": "Anguished families left to identify Venezuela quake victims at makeshift morgue", "url": "https://www.bbc.co.uk/news/articles/c20y2p9qqqko?at_medium=RSS&at_campaign=rss", "summary": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "category": "politics", "published_at": "2026-07-03T21:00:53+00:00", "fetched_at": "2026-07-04T02:30:44.067124+00:00", "fingerprint": "7b29539a1cae4a95"}, {"source": "BBC World News", "title": "France records 2,025 excess
