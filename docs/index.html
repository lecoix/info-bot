/google-earth-ai-image-generation-deepfake-tool", "summary": "Google has shut down Google Earth feature it launched Thursday that allowed users to edit satellite images with text prompts using AI. The tool essentially let users create AI deepfakes of the real world using text prompts; Digital Digging's Henk van Ess, for example, intentionally generated images adding things like refugees near the Mexican border [&#8230;]", "category": "tech", "published_at": "2026-07-31T19:13:29+00:00", "fetched_at": "2026-08-01T02:24:41.861069+00:00", "fingerprint": "a503f2e2beff190f"}, {"source": "The Verge", "title": "Apple’s new AirTags are back down to their best price", "url": "https://www.theverge.com/gadgets/973973/apple-airtag-second-generation-deal-sale", "summary": "We spotted a great deal on Tile trackers earlier this week that&#8217;s still live, but if you&#8217;re an iPhone owner, we ultimately recommend Apple’s latest AirTag. Right now, you can pick up a four-pack for $89 ($10 off) at Amazon and Target, matching the bundle’s all-time low price. If you’re a member, Costco also has [&#8230;]", "category": "tech", "published_at": "2026-07-31T19:35:45+00:00", "fetched_at": "2026-08-01T02:24:41.861063+00:00", "fingerprint": "86cd7a355ab6e1fc"}, {"source": "The Verge", "title": "With Switch 2, iPhone, and laptop tricks, the Sharge Disk Pro 2 is finally a worthy EDC", "url": "https://www.theverge.com/gadgets/973886/sharge-disk-pro-2-hands-on-switch-2-hdmi-usb-c-dock", "summary": "Sharge, the company that makes delightful retro Mac-shaped chargers and see-inside batteries, is finally impressing me with a portable SSD. I couldn't recommend the Sharge Disk, Disk Plus, or even the Disk Pro, but I'd be happy to own the new Disk Pro 2 Ultra. This isn't just a drive. It's a 4K HDMI dock [&#8230;]", "category": "tech", "published_at": "2026-07-31T22:09:11+00:00", "fetched_at": "2026-08-01T02:24:41.861051+00:00", "fingerprint": "2caf78f9afdbc2f9"}, {"source": "36氪 - 最新文章", "title": "开云的转折：在中国，做一个AI乐观派", "url": "https://36kr.com/p/3919225763540611?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子 黄绎达</p>\n  <p><strong>编辑 |</strong>&nbsp;张帆</p>\n  <p>开云的转型初见成效。</p>\n  <p>7月28日，法国开云集团Kering发布2026年上半年财报，实现营收72.2亿欧元，可比口径下同比增长1%。</p>\n  <p>更关键的信号藏在第二季度——单季营收36.52亿欧元，同比增长2%。在中东局势仍不明朗、全球消费进入下行周期的情况下，开云实现三年来的首次单季度正增长。</p>\n  <p>其中，核心品牌古驰Gucci第二季度的营收14.1亿欧元，同比降幅从第一季度的8%收窄至2%，环比改善7个百分点，业绩修复程度高于市场预期。整个上半年，Gucci营收实现27.57亿欧元，经常性营业利润率17%，同比提升1个百分点。</p>\n  <p>其他品牌方面，圣罗兰YSL上半年恢复增长，北美与西欧表现稳健；葆蝶家Bottega Veneta表现优于预期，所有地区环比加速；巴黎世家Balenciaga仍处于创意过渡期。</p>\n  <p>渠道方面，截至6月30日，集团直营门店总数1635家，上半年净关店84家，较2025年底减少5%。第二季度，直营零售网络同比销售增长2%，环比提升4个百分点。批发及其他收入增长5%。</p>\n  <p><strong>受财报消息提振，次日开云集团法股开盘飙升，当日收涨17%。</strong></p>\n  <p>而这场信心的伏笔，今年4月就已埋下。在意大利佛罗伦萨的资本日上，开云新任CEO卢卡·德·梅奥（Luca de Meo）正式提出“重塑开云（ReconKering）”战略。</p>\n  <p>该战略重点围绕重燃品牌吸引力、强化卓越运营并引领奢侈品行业的下一个时代、凝聚旗下各品牌与开云平台的全部力量。</p>\n  <p>核心目标是——中期将集团经常性营业利润率，较2025年水平提升一倍以上；在12个月内削减约10亿欧元库存；以及在未来四年内关闭约250家门店以提升坪效，其中2026年至少关闭100家门店。</p>\n  <p>这一复兴计划直接定调了开云的未来。与此同时，中国市场被置于战略转型的核心。</p>\n  <p><strong>“对开云而言，中国从来不只是一个市场。它是驱动整个集团创新的策源地——从技术前沿到商业模式，再到消费趋势的演变。”</strong></p>\n  <p>财报发布一周前的“开云中国创新日”，Luca de Meo带领集团高层来到上海。在他看来，奢侈品行业拥有非常大的技术创新空间，但技术从来不是核心议题。“正如人的左右脑需要协同，我们希望实现艺术与科学的深度融合。”</p>\n  <p>这位出身于大众汽车、跨界而来的“技术派”CEO，始终将AI视为赋能工具。同时他认为，有强大数据积累的中国市场，会成为AI创新的领跑者。</p>\n  <p>以下为36氪参与的对谈（有删节）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260731/v2_93f35a5ba3424ae99e3d2c185a0e3281@394564713_oswg1652050oswg1184oswg1480_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Luca de Meo在开云中国创新日；图片来自开云集团</p>\n  <h3><strong>关于中国：从市场到策源地</strong></h3>\n  <p><strong>Q：这是你作为开云CEO第二次来中国。</strong></p>\n  <p><strong>Luca de Meo：</strong>实际上我与中国市场渊源深厚，二十多年前便来过这里。</p>\n  <p>加入开云前，我深耕汽车行业，曾就职于大众。大众80年代就与中国紧密联系了，此后我又入职了一家法国汽车公司，在那里主导了一项关键且极具价值的战略——在中国落地本土化研发中心。</p>\n  <p>我们当时率先将研发体系落地中国，即便面临不小的试错风险，仍获得了颠覆性的成果——通过以数字技术为依托的全新路径，大幅压缩了产品的研发周期。这就是两三年前的事，我知道是一项可行之举。</p>\n  <p><strong>Q：你这次带领开云团队来中国，希望达成怎样的目标？</strong></p>\n  <p><strong>Luca de Meo：</strong>ReconKering不只聚焦数据指标、落地与绩效，更关乎全员思维模式与组织文化的重塑。这也是我此行最核心的目标：虚心倾听每一位同仁的见解，依托各方反馈完善ReconKering的中国本土化版本。</p>\n  <p><strong>Q：中国市场在本轮集团转型中处于怎样的战略位置？</strong></p>\n  <p><strong>Luca de Meo：</strong>我们始终坚信，中国市场仍将是全球高端品类的腹地。基于这份信心，我们要持续拔高中国市场的战略权重。</p>\n  <p>同时我们观察到，中国市场正迎来变革：消费生态日趋成熟，消费者也对品牌提出了更高要求。他们拥有独立的判断力，对品牌认知也非常通透。我们知道，行业的增长红利或将向全新品类迁移。在此背景下，中国恰好是集团转型的绝佳试验场。</p>\n  <p><strong>Q：开云2019年就创办了“中国创新日”，你怎样理解中国市场的创新生态？</strong></p>\n  <p><strong>Luca de Meo：</strong>我们将中国市场定位为集团至关重要的创新中心。中国是全球市场的“制造平台”，在制造业领域，成熟的产业基建、充沛的数据资源、活跃的市场氛围，创造了得天独厚的发展优势。</p>\n  <p>我还关注到小红书、腾讯等本土数字生态平台的普及程度极高。人工智能的核心是数据，数据更丰富、迭代更快的市场，自然能实现更大的发展，中国也必将成为全球AI创新的领跑者之一。</p>\n  <p><strong>Q：开云的中国数字���新中心在上海，这两年有怎样的技术成果？</strong></p>\n  <p><strong>Luca de Meo：</strong>许多行业的领导者还未意识到，高端行业或是奢侈品行业完全拥有技术创新的空间。但技术始终不是核心议题。</p>\n  <p>举个例子，我们行业口中的“创意”，在其他行业叫作“创新”，用词本身就折射出思维的差异。<strong>我一直向团队传递一个主张：我们最需要推行的，是艺术与科学的深度融合，不能只依靠其一。正如人的左右脑需要协同工作，将感性创意与理性逻辑结合起来。</strong></p>\n  <p>这是ReconKering战略的核心着力点，也是集团一场关键性的布局。这套思路或许并不符合行业的固有认知。我个人相信，前沿技术的合理落地，能够帮助我们优化产品、理解消费者需求、完善服务体验、升级零售模式与物流链路等。</p>\n  <p>回到你刚才的问题，目前开云在部分板块落地了技术试点。</p>\n  <p>以珠宝品类为例。高端珠宝想要呈现上乘质感，黄金等贵重原料仍是核心载体。倘若我们借助AI完成前期数字化模拟，便能大幅削减各类资源损耗。大家或许难以想象，我们每年在实物样品上动辄投入数百万成本，每一季新品上架前，都要经历无数轮实物打样、反复试错。</p>\n  <p>我们当下的挑战，仍是把技术议题推至战略核心层面。当然，为推动可持续发展，我们也要致力于减少全链路的资源浪费，这就是另一个话题了。</p>\n  <h3><strong>关于AI：赋能而非替代</strong></h3>\n  <p><strong>Q：时尚行业讲究人性温度，在品牌调性、艺术设计和科学技术之间寻找平衡，会是一件难事吗？</strong></p>\n  <p><strong>Luca de Meo：</strong>不能一概而论。对物流部门来说，如果缺少标准化的方法论、基础建设、数据支撑与科学逻辑，就无法保障货品按时送达正确地点。而创意工坊，更侧重艺术灵感。</p>\n  <p>纵观集团全业务，是一体两面。一方面，我们需要标准化的科学方法、可落地的执行体系；另一方面，我们离不开人类独有的思维创造力，这至关重要。集团内部汇聚了大批极具天赋、创意出众的人才，时常能迸发直击消费者心智的全新构想。</p>\n  <p>倘若有人能梳理出一套可复制的创意生成算法，必将收获巨大的商业价值。<strong>但时至今日，人类独一无二的创意灵感，无法被任何算法复刻。</strong></p>\n  <p><strong>Q：开云目前应用了哪些AI产品？</strong></p>\n  <p><strong>Luca de Meo：</strong>新技术落地普及，往往会遇到普遍的心理阻力。2007年iPhone发布时，乔布斯提出了一个颠覆性思路：整机不再配备纸质说明书，他的逻辑是，产品本身应当足够简单易用，普通人能轻松上手。</p>\n  <p>以此为参照，<strong>我认为集团内部推进AI落地最有效的路径，就是降低全员的使用门槛</strong>。目前集团正在开展大规模的数字化培训，把AI工具交到每一位员工手中，鼓励大家结合自身岗位挖掘适配的落地场景。</p>\n  <p>我们自主研发了一款移动端的AI工具，它在集团现有IT系统与数据库之间搭建中台，可自动抓取多渠道数据并整合至手机终端。依托这款工具，各类汇报所需数据可一键生成为演示文稿，从而大幅释放了人力。</p>\n  <p>客观而言，AI给出的分析判断大多符合基础的商业逻辑，也存在明确局限——AI仅能完成现状诊断，无法将分析结论落地为可执行方案，组织人力、推动项目落地仍需依靠真人团队。</p>\n  <p><strong>Q：创新技术能真正提升盈利能力吗？</strong></p>\n  <p><strong>Luca de Meo：</strong>这是目前全球热议的话题，奢侈品在传统上根植于工艺传承与人文温度，对AI自然态度保守。我见证了AI在其他行业的变革力量，现阶段AI对于奢侈品行业的深度价值，我保持乐观。</p>\n  <p>正如我多次提及的，AI的核心价值在于加速各项业务运转。我刚刚在开云中国创新日看到一家公司，数据库拥有大约两亿个消费者画像，并且可以利用AI自动完成客户研究。</p>\n  <p>但集团想要进一步提升综合竞争力、运营效率与创意产出，有大量系统性的工作。对于AI能否真正赋能高端产业创意，我仍无法定论，我们不能将全部希望寄托于单一技术。</p>\n  <p><strong>Q：拥抱AI一定是大趋势。</strong></p>\n  <p><strong>Luca de Meo：</strong>我会始终将AI视为赋能工具。作为开云的掌舵人，我的核心职责就是推动整个组织保持灵活、开放，以此构筑集团独有的竞争优势，让我们能平稳渡过本轮技术浪潮。我们这类头部企业，绝不能抗拒未来、紧闭创新的大门。倘若我无视全球技术变革的大势，便是没有履行好自身的管理职责。</p>\n  <p>各行各业也会遵循相似的发展规律——新技术落地初期，生产力会迎来大幅跃升；发展至中期进入平台期，生产力回落至个位数。每当迎来一轮颠覆性技术变革，生产力会再度激发活力。</p>\n  <p>从劳动力层面，短期内部分从业者会受到冲击，但人们永远会探索全新的工作模式，最终实现更好的发展。</p>\n  <p>我相信，人类的群体智慧，终将引导技术服务于人、赋能于人。或许我略微理想主义，但这是客观规律。回望历史，内燃机、电力、互联网的普及皆是如此，我们应当以同样的视角看待人工智能。</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_c4aedb650e164d88b7ef74dcf18bbf77@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/CPT-CYLnfkvN4AZS4sq2VA\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;黄绎达，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-31T08:58:59+00:00", "fetched_at": "2026-08-01T02:24:41.689061+00:00", "fingerprint": "17f24e95d76cd742"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜Prada集团上半年营收增长16%，Miu Miu增速显著放缓；浪潮数据发布自研AI数据操作系统", "url": "https://36kr.com/p/3919378312670857?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>途牛：8月中上旬或将迎新一轮客流高峰</strong></p>\n  <p>36氪获悉，进入8月后，学生假期仍有充足余量，亲子游、避暑游、海滨海岛游等需求持续释放，预计将在8月中上旬迎来新一轮客流高峰。途牛截至目前最新预订数据显示，暑期后半程，上海、北京、成都、三亚、广州、南京、贵阳、杭州、重庆、青岛等目的地预计将成为途牛境内游用户更为热门的选择。</p>\n  <p><strong>Prada集团上半年营收增长16%，Miu Miu增速显著放缓</strong></p>\n  <p>2026年上半年，Prada集团营收按固定汇率计同比增长16%至30.48亿欧元（约合人民币237亿元），有机增长5%，其中第二季度增长7%。分品牌看，上半年Prada零售额同比增长3%，其中第二季度增速提升至6%，主要由可比口径增长及全价销售驱动。Miu Miu零售额同比增长3%，第二季度和第一季度增速持平。对比其去年上半年49%的增幅，增速明显放缓。该集团2025年底收购的Versace（范思哲）上半年净收入3.05亿欧元，业绩进展符合预期。（界面）</p>\n  <p><strong>雅克科技：公司生产经营情况正常，内部经营环境未发生重大变化</strong></p>\n  <p>36氪获悉，雅克科技公告，公司股票交易价格连续三个交易日（2026年7月29日、2026年7月30日、2026年7月31日）收盘价格跌幅偏离值累计超过20%，属于股票交易异常波动情形。公司未发现近期公共传媒报道了可能或已经对公司股票交易价格产生较大影响的未公开重大信息。目前公司生产经营情况正常，内部经营环境未发生重大变化。经查询，公司、控股股东及实际控制人不存在关于本公司的应披露而未披露的重大事项。</p>\n  <p><strong>万科选举徐恩利为董事长</strong></p>\n  <p>7月31日，万科召开2026年第一次临时股东会，审议通过了董事会换届议案。新一届董事会第一次会议决议公告显示，选举徐恩利为公司董事长，续聘黄宇为公司总裁。万科方面表示，徐恩利长期从事企业管理工作，深耕房地产领域多年，并担任过A股、港股两地上市公司负责人，徐恩利与总裁黄宇的搭档组合，契合万科的企业特点和当前形势需要，有利于持续推进化险与发展。（证券时报）</p>\n  <p><strong>蚂蚁国际：其全球账户服务已被超过半数的中国大中型游戏厂商所采用</strong></p>\n  <p>36氪获悉，2026年ChinaJoy期间，蚂蚁国际宣布，其全球账户服务已被超过半数的中国大中型游戏厂商所采用，其中包括库洛游戏、完美世界、网易等行业头部；同时众多AI应用企业、短剧平台以及中小游戏开发工作室也已接入该服务。蚂蚁国际相关数据显示，中国数娱出海商户交易额在2026年上半年快速增长。</p>\n  <p><strong>针对“幽灵外卖”将建“电子围栏”：证照经营场所、外卖制作地址、骑手取餐地址三重坐标比对</strong></p>\n  <p>7月31日从市场监管总局获悉：为进一步从源头上铲除“幽灵外卖”滋生土壤，杜绝外卖商户“带病入网”，市场监管总局积极推动电子证照在网络餐饮食品安全治理领域的应用推广，这相当于给每一家外卖商户发了一张“电子身份证”。外卖平台可以通过自动抓取电子经营资质上的经营场所，构建“电子围栏”，与外卖商户提供的餐食制作地址、骑手实际取餐地址进行三重坐标比对，锚定外卖商户“真实存在”，切实消除委托他人加工制作等违规转单问题。（人民日报）</p>\n  <h2>投融资：</h2>\n  <p><strong>芯擎科技上半年融资超2亿美元</strong></p>\n  <p>2026上半年，高性能车规和工业芯片计算平台芯擎科技完成超2亿美元融资，多家产业资本、地方国资等新股东加入，老股东持续跟投，投资方覆盖汽车半导体、智慧交通、工业智能、AI 芯片等领域。融资资金将推动芯擎加速车载芯片的全球规模化交付，同时打造端侧智能计算平台。目前，芯擎科技已发布5纳米AI舱驾融合芯片“龍鹰二号”，率先布局端侧中央计算平台领域。</p>\n  <p><strong>“中科欣扬”完成亿元级融资</strong></p>\n  <p>36氪获悉，“中科欣扬”宣布完成亿元级融资。本轮融资由产业投资方领投，海愿资本、龙岗引导基金跟投。本轮融资将重点投向合成生物平台搭建，进一步加快多底盘细胞开发、产品产业化进程，并完成生物制造大宗生物制品战略布局。易凯资本在本次交易中担任了中科欣扬的独家财务顾问。</p>\n  <h2>新产品：</h2>\n  <p><strong>小鹏汽车、智元机器人等将率先接入Seedance 2.5</strong></p>\n  <p>36氪获悉，据火山引擎消息，今天，新一代视频生成模型Seedance 2.5正式发布。针对企业用户，火山引擎将于近期上线API服务。徐工集团、小鹏汽车、智元机器人、灵初智能、微分智飞、穹彻智能、Xspark AI（无界智航）等多家企业已与火山引擎达成合作意向，将率先接入Seedance 2.5。</p>\n  <p><strong>字节跳动发布视频创作模型Seedance 2.5</strong></p>\n  <p>36氪获悉，字节跳动宣布正式发布新一代视频创作模型Seedance 2.5。Seedance 2.5正在陆续上线即梦AI、豆包专业版等平台，API服务也将在近期上线火山方舟。从火山引擎获悉，Seedance 2.5发布当日，徐工集团、小鹏汽车、灵初智能、微分智飞、穹彻智能等多家企业已确认合作，将率先引入该模型能力。</p>\n  <p><strong>浪潮数据发布自研AI数据操作系统</strong></p>\n  <p>36氪获悉，浪潮数据正式官宣企业战略全面升级，从传统云计算、分布式存储服务商升级为AI基础设施服务商，并正式发布自研AI数据操作系统。该系统是管理算力、算法、数据三位一体资源的系统软件。采用“数据底座+算力引擎”双架构设计，具备创新数控分离架构、无锁协程调度框架、全闪原生布局算法等技术以及拥有全时全域动态演化架构、多芯多模高效推理引擎、智能体DesignRun全流程运行环境。</p>\n  <h2>今日观点：</h2>\n  <p><strong>四部门：加强关联交易管理，强化关联方识别，规范对关联交易的审查和披露</strong></p>\n  <p>36氪获悉，金融监督管理总局等四部门印发关于健全金融机构治理的实施意见。《实施意见》提出，提升风险防控水平。推动金融机构建立健全全面风险管理体系，健全落实风险防控机制，持续提升风险识别、研判、评估、计量、监测、控制和缓释能力，源头防范化解、依法稳妥处置各类风险隐患，实现所属机构、业务、产品等风险防控全覆盖。加强关联交易管理，强化关联方识别，规范对关联交易的审查和披露。完善风险和资本并表管理。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>工信部：上半年电信业务收入累计完成8873亿元，同比下降2.1%</strong></p>\n  <p>36氪获悉，工信部发布2026年上半年通信业经济运行情况。上半年，电信业务收入累计完成8873亿元，同比下降2.1%。按照上年不变价计算的电信业务总量同比增长7.7%。移动电话用户规模稳中有增，5G用户快速发展。截至6月末，三家基础电信企业及中国广电的移动电话用户总数达18.44亿户，比上年末净增1704万户。其中，5G移动电话用户达12.88亿户，比上年末净增8434万户，占移动电话用户的69.9%。5G网络建设持续深化。截至6月末，5G基站总数达510.2万个，比上年末净增26.3万个，占移动基站总数的39.1%，占比较一季度提高0.9个百分点。</p>\n  <p><strong>韩国据悉考虑放宽新半导体产业集群的劳动监管要求，取消每周52小时工时上限</strong></p>\n  <p>据知情官员周五透露，韩国政府正评估方案，计划对位于西南部光州市的新建半导体产业集群大幅放宽劳动监管要求，其中包括放宽每周52小时工时限制。除此之外，韩国政府正考虑将弹性工时制的计算周期，从现行1个月延长至6个月。（新浪财经）</p>", "category": "tech", "published_at": "2026-07-31T10:01:34+00:00", "fetched_at": "2026-08-01T02:24:41.689055+00:00", "fingerprint": "87a1707dcac79d79"}, {"source": "36氪 - 最新文章", "title": "36氪独家｜曾爱玲入职B站担任AI视频生成业务负责人，向CEO陈睿汇报", "url": "https://36kr.com/p/3910776673064073?f=rss", "summary": "<p>文｜王毓婵 兰杰</p>\n  <p>编辑｜乔芊</p>\n  <p>36氪独家获悉，曾爱玲入职哔哩哔哩（下称“B站”），担任AI视频生成业务负责人，向CEO陈睿汇报。</p>\n  <p>36氪就此事向B站方面求证，对方暂无回应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_450bbe65a3064be2abe1e6b2b881612c@10269314_oswg1594051oswg1404oswg1250_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">曾爱玲</p>\n  <p>B站此前已公开表示，AI投入主要聚焦视频理解、视频推荐和辅助视频创作等方向。曾爱玲入职后，或将参与相关业务。</p>\n  <p>曾爱玲的个人主页显示，她曾在腾讯混元&amp;AI Lab团队和国际数字经济研究院（IDEA）工作三年，领导以人为中心的感知与生成研究团队。其后，她加入米哈游创始人蔡浩宇旗下AI公司Anuttacon，负责开发以人为中心的交互式多模态视频生成系统。这些模型使AI智能体能够感知、交互并生成实时、长时程的视频。</p>\n  <p>曾爱玲于香港中文大学计算机科学与工程系获得博士学位，并且曾是卡内基梅隆大学机器人研究所的访问学者。</p>\n  <p>B站一直在寻找一个能稳定下来的AI业务带头人。去年9月，前快手副总裁、可灵AI事业部技术部原负责人张迪，曾跳槽B站，并出任技术条线负责人。但仅仅两个月左右，张迪就再次出走，回归阿里，担任淘天集团未来生活实验室负责人。五个月后，张迪带领团队打造出HappyHorse-1.0。</p>\n  <p>2024年，B站上线了基础大模型Index，该模型能力主要被应用在视频内容创作、理解和分发等场景中。基于Index，B站搭建了角色扮演模型、语音生成模型、动漫视频生成模型等。</p>\n  <p>另外，在创作工具方面，2026年3月，B站推出了AI视频创作平台updream<strong>，</strong>该工具具备“长期记忆”、“个性化技能库”与自由画布功能，主打专业级 AI 内容管线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_55380ad5d8ab4c279458b9f53a1413f9@10269314_oswg1902349oswg2944oswg1010_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">updream界面截图</p>\n  <p>在创作激励方面，B站密集推出与AI相关的创作赛事和活动。今年1月，B站启动了首届AI创作大赛，并在推出updream创作工具的当天，为获得一等奖的UP主颁发了高达100万元人民币的奖金。</p>\n  <p>6月，B站启动“build in bilibili · AI创造公开赛”，参赛者只需使用AI工具，创造一个可运行、可交互的产品，并在B站持续发布创作过程视频，即可完成报名参赛。赛事不设固定赛道或主题，实物和软件应用均可参与。比赛将评选权交给用户——所有B站用户均可通过投币、弹幕等方式参与创作并选出认可的产品。比赛设置超130万元的现金奖金池，其中冠军独享百万元奖金。</p>\n  <p>该大赛启动一个月后，投稿创作者数量逼近5000人，站内“vibe coding”相关关键词日均搜索量增长6倍。</p>\n  <p>7月，B站正式推出网页内容发布平台“Toy”。该平台支持将本地创意网页一键发布为站内可直接访问、可玩的互动作品。UP主无论是自主开发，还是借助AI Agent、Vibe coding等AI工具快速生成和迭代，都能将创意沉淀于站内，转化为用户可玩、可测、可用、可看的内容。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260725/v2_bfe9ee1e51e04bfa8bf3fc16e38a437d@10269314_oswg1541295oswg2650oswg1800_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Toy 界面截图</p>\n  <p>在6-7月的内测过程中，UP主已在Toy上传超300件作品，涵盖游戏、互动叙事、工具、测试、报告、画册等多个品类。同时站内公开数据显示，平台用户体验量已累计超850万次。</p>\n  <p>目前正在站内进行中的活动还包括与阿斯塔纳国际AI电影节合办的“AI全民制作人”、以及鼓励用updream生成AI动画作品的“UP动画剧场签约激励计划”等。</p>\n  <p>据B站方面披露，2026年， AI 泛智能体（AI Agent）、AI创业等关键词在B站的搜索量同比增长超500%。2026年第二季度数据显示，每月有超过1.9亿用户在B站观看AI相关内容。</p>\n  <p>以及，在广告提效方面，B站将AI引入了广告分发与推荐系统，为广告主提供AIGC广告素材生成、智能投放与自动广告，以及植入式智能广告探索等服务。</p>\n  <p>B站方面公开数据显示，AIGC广告素材消耗占比超过50%，且点击率（CTR）比传统素材实现双位数增长。自动广告消耗渗透率超85%，整体广告分发效率提升明显。</p>\n  <p>在今年一季度财报电话会议上，陈睿提到：“AI 没有改变 B 站底层逻辑，但放大了这两大优势。” “AI 是十倍放大的历史性机遇，我们将牢牢把握。”</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-31T10:27:38+00:00", "fetched_at": "2026-08-01T02:24:41.689048+00:00", "fingerprint": "1c3e3f346cd84284"}, {"source": "36氪 - 最新文章", "title": "国内唯一做多模态长记忆的公司，融资数千万，押注主动智能｜涌现新项目", "url": "https://36kr.com/p/3919386961177985?f=rss", "summary": "<p><strong>文｜王欣逸</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>&nbsp;</p>\n  <h3><strong>一句话介绍</strong></h3>\n  <p>国内唯一做多模态长记忆的公司——丘脑智能，推出原生多模态记忆基座，押注AI从通用走向个性化，最终走向主动智能。</p>\n  <p>主动智能，指的是AI能在足够了解用户的基础上，在合适的时间、以恰当的方式主动跟用户交互。要实现主动智能，Memory是必须要跨过的门槛。</p>\n  <h3><strong>融资情况</strong></h3>\n  <p>近日，丘脑智能已完成数千万元种子轮融资，投资方包括深圳一线基金和产业资本，本轮融资主要用于技术研发以及人才队伍补充。</p>\n  <h3><strong>团队介绍</strong></h3>\n  <p>丘脑智能创立于2025年11月，创始人兼CEO张源毕业于北京大学，是电子与经济双学科背景，曾在一家自动驾驶公司担任COO，也有过创投行业、具身智能的工作经历。</p>\n  <p>团队平均年龄约26岁，核心人员主要来自阿里达摩院、腾讯、商汤、港中文、港中深、北大、西交大、KIT、复旦等企业和高校。</p>\n  <h3><strong>产品及业务</strong></h3>\n  <p>Memory领域的行业共识，最早于2025年底在学术界率先形成。这是一个非常新的领域，在面对投资人时，张源常常被问到一些问题，比如，基模会不会自己把记忆做了？Memory这一层到底会不会独立存在？基模和记忆企业之间应该怎么分工？</p>\n  <p>这些问题，张源有一个坚定的回答：<strong>记忆层一定会作为独立的基础设施长期存在。</strong></p>\n  <p>她对此解释，不同厂商的基模基因和训练语料各有差异，擅长的任务也各有侧重，用户不断在几家模型之间切换，这导致记忆孤岛的问题长期存在。AI从通用走向个性化的过程中，缺少一个能持续学习记住用户的中间层。因此，以用户为中心的第三方记忆层必然会独立于基模之外而存在。这恰恰是张源看到的机会。</p>\n  <p>不过，对于她而言，首先要做的是直面行业尚未解决的问题。现阶段，Memory领域存在着一定痛点：</p>\n  <p>一是成本问题，多数方案直接把海量上下文全量塞入窗口，导致推理成本非常高；二是上下文断裂问题，跨session、跨任务的对话难以有效衔接；三是模态缺失问题，现有记忆方案大多局限于纯文本，无法处理视觉、音频等多模态信息。</p>\n  <p>不仅如此，由于Transformer架构导致了持续的时序错乱，目前大模型无法理解时间。在Agent的协作中，记忆孤岛往往也影响着任务执行效果，用户信息被封锁在各个Agent之中，难以实现互通。</p>\n  <p>张源认为，AI要真正融入物理世界，就必须从设计之初就以人类的多模态感知为参照。记忆架构从一开始就应该是原生多模态的，而不是先把信息转成文本再存储。</p>\n  <p>因此，丘脑智能在6月上线了一个名为<strong>MemAura</strong>的记忆基座，向客户提供ADK（智能体开发包）和API（应用程序编程接口）的服务。</p>\n  <p>MemAura能支持长记忆的积累和快速的记忆调用，采用高效的上下文机制，还能有效降低推理成本。从成绩上来看，MemAura的性能表现亮眼：<strong>输入侧Token综合消耗降低40%-49%，记忆检索延迟控制在400毫秒以内，端到端首次回答可做到1秒以内，综合准确率可以达到80%以上。</strong></p>\n  <p>在记忆处理流程上，MemAura的做法和传统记忆系统的处理有很大的不同。</p>\n  <p>传统记忆系统通常会对用户输入进行抽取、压缩与摘要，然后存入原始信息库，再通过特定架构或图谱进行存储，最终依赖Agent模式进行检索。</p>\n  <p>不过，MemAura采取的策略是，他们做了一套仿生的记忆处理机制，具体流程分为三步：首先是对事件进行识别，模仿人类记忆机制，保留关键信息，并过滤掉冗余的噪声；随后，MemAura会对过滤后的信息进行编码；第三步是，做好信息的分区，对隐私与非隐私记忆进行分区隔离。</p>\n  <p>此外，他们还采用了冷热存储的策略：对于高频访问的证据，采用热存储以实现快速检索；而对于低频数据，进行冷存储以节约资源。这样既能确保核心数据随时可访问，又能有效控制整体成本。</p>\n  <p>张源告诉我们，在多模态记忆领域这个万亿级的赛道上，丘脑智能目前还没有面临着直面竞争。尽管这个赛道可以容纳下很多选手，但现在只有几家创业公司在关注这一赛道，估值最高的公司仅不到20亿元，竞争谈不上激烈。</p>\n  <p>丘脑智能现阶段主要的客户包括一些出货量比较大的陪伴硬件，如陪伴机器人等，以及一些垂类Agent场景，如AI客服、数字员工等领域，客户通过记忆API，帮助基模在回答与执行任务时调用原始信息，从而提升交互效果。</p>\n  <p>因为不同场景对于记忆能力的侧重点各有不同，比如3-5岁的儿童陪伴型产品与18-25岁的陪伴型产品，其中的要求差异相当大。张源告诉我们，“我们不想做更高的定制化，因此，我们把Memory能力按照场景地图的权重，封装成了不同的ADK，客户可以选择ADK接入。”</p>\n  <p>在商业模式上，MemAura以API调用量及场景授权组合的方式收费，客户可按需选择不同层级的记忆能力。</p>\n  <p>“现在我们客户大部分还聚焦在纯文本或文本加语音。随着多模态相关技术的成熟，客户的模态会更丰富，也会有更多具身场景的客户前来验证。”张源说。</p>\n  <h3><strong>核心壁垒</strong></h3>\n  <p>从公司成立至今，他们的技术路线已完成两次迭代，正逐步探索第三次迭代。</p>\n  <p><strong>第一代是STKG时空知识图谱</strong>，具体做法是：他们将时间和空间放在物理层，把多模态感知信息放在感知层，并构建起一个认知层形成认知网络，进行前向推理。</p>\n  <p>其Benchmark表现非常不错，在LoCoMo（推理与时序）与LongMemEval（交互与偏好）两个测试中均拿到了SOTA。</p>\n  <p>不过，对于客户而言，到达一定临界值后，Benchmark提高分值的意义并没有那么大，客户更在意的是延迟和Token支出。因此，他们做了一些工程化上的权衡，进行了架构层的迭代，转向模仿人类海马体的编码与认知地图、皮质层整合的方式构建记忆体系，建立起<strong>仿生记忆架构MemAura</strong>。</p>\n  <p>在数据上，MemAura实现了一个量级的领先。现在传统的线上客服场景，其延迟可能会达到10秒左右，在陪伴场景的延迟会在2秒左右，而MemAura可以做到延迟控制在400毫秒以内。</p>\n  <p>目前，关于Memory的技术，丘脑智能仍在不断探索之中，他们正在通过<strong>E2P（Embedding-to-Prefix）的相关技术方式以及对transformer架构进行微调</strong>来实现下一步的迭代；目前在实验室环境下做到大幅度节省Token支出以及偏好抽取领域近似持续学习的效果。</p>\n  <p>2026年5月，丘脑智能还联合英伟达、港科大、港中文发布了<strong>全球首个做多模态长记忆Benchmark，名为MEMLENS</strong>，目前已开源，并拿到了Hugging Face AI领域Daily Paper的前三。</p>\n  <p>他们把27个视觉语言大模型和7个Memory Agent第一次放在同一套多模态数据下，分成4档标准的上下文长度（32、100、128、256K），进行了一次完整的对照实验，并得出了以下发现：</p>\n  <p>第一，视觉语言大模型往往不做任何压缩，直接将内容全量塞入上下文窗口，但随着长度增加，模型表现急剧下降；Memory Agent的表现虽相对稳定，但由于记忆架构设计缺陷，大量视觉与多模态数据在写入阶段就已损失。</p>\n  <p>第二，随着上下文长度的增长，无论是Memory Agent还是视觉大语言模型，都更倾向于产生幻觉，面对缺乏充分证据的问题时，更倾向于自信地胡说。</p>\n  <p>第三，许多针对Memory的后训练方法，在训练后削弱了模型拒绝回答的能力，��反而增加了幻觉风险。</p>\n  <p>值得关注的是，这一Benchmark证明了<strong>基模厂商和记忆公司应该各有分工</strong>，各自做好自身擅长的领域，在行业中也有着自身无法被替代的生态位：基模应该做好视觉感知、图文对齐和底层推理；记忆企业应该做好跨模态信息检索、证据组织和状态更新。</p>\n  <h3><strong>Founder思考</strong></h3>\n  <ul>\n   <li><strong>个性化的终点是主动智能。</strong></li>\n  </ul>\n  <p>因此我们判断，<strong>Agent</strong>的终局不应该是任务驱动的，而是状态驱动的。未来的Agent能基于你的历史记忆帮用户做Planning，自我驱动完成任务。</p>\n  <p>不久的将来我们可以看到一些主动智能的产品或者能力，主动智能如果出现，应该会出现在做Memory的公司里。</p>\n  <ul>\n   <li><strong>未来的Memory应该做的事是——沉淀用户和任务偏好、区分长期状态和短期波动，以更好地支撑主动智能。</strong></li>\n  </ul>\n  <p>目前大部分做Memory的企业都在聚焦上下文窗口和RAG（检索增强生成）。然而，我并不认为上下文窗口等同于真正的记忆，它本质上依赖于前端交互和短期上下文来维持的一种临时性工作记忆。至于RAG，目前主流的内存实现方案多采用GraphRAG（基于知识图谱做RAG）架构，但其本质不过是外挂的向量数据库，通过向量检索完成相似性召回。</p>\n  <p>当前许多企业，如硅谷的开源项目，如Mem0、MemGPT，仍采用向量原生（Vector Native）或GraphRAG的方式来实现记忆功能。</p>\n  <p>这类方案存在明显局限。以纯向量检索为例，它缺乏对信息关联性的建模，本质上更像一个知识库，只能应对简单的一问一答场景。真正的记忆并非静态的问答，而是需要追踪动态变化的时间线与用户意图，不断更新调整。</p>\n  <ul>\n   <li><strong>Long Context（长上下文）和Memory Agent（记忆）并非是二选一的取舍，而是可以做工程化的权衡。</strong></li>\n  </ul>\n  <p>DeepSeek V4拥有1M的上下文窗口，这一模型推出后，不少人会很自然的想到一个问题，就是基模会不会做记忆，或者未来的基模中会不会存在单独的Memory层？</p>\n  <p>我们的Benchmark对此做出了解答：基模要做的是把上下文做的更长，做好KV cache（一种数据缓存机制）相关的工作，更侧重于做好底层推理能力，如视觉感知和图文对齐。而记忆企业应该做的是找到跨模态信息，更好的为用户提供帮助。两者各有分工。</p>\n  <ul>\n   <li><strong>Memory的核心，不是存储，而是决策。</strong></li>\n  </ul>\n  <p>如果只是简单的存储，传统数据库和存储系统早已能够实现，完全不需要AI记忆。但是真正让Memory发挥价值的点在于，它能做出一系列判断：是否写入记忆、哪部分写入记忆、召回什么样的记忆、在回答什么样的问题的时候应该主动发起召回等。基于此，Memory承载着两大核心价值：</p>\n  <p>第一个价值是，释放AI潜力的上限。基模的上限到AI真正能够触达的上限之间，存在一个关键的中间层，这个中间层包括AI系统的复杂度，以及个性化的数据闭环（即Memory）。个性化的数据闭环，是释放AI潜力上限的核心基础设施。</p>\n  <p>第二个价值是，支撑主动智能。AI的落脚点始终在人身上，服务于人、取悦于人、加速于人，这是它不变的使命。Agent也好，物理或者非物理AI也好，最终都需要主动智能来支撑。而主动智能的本质就是决策，即在充分理解用户个性化数据闭环的基础上，决策什么时候发起交互，如何发起，发起什么样的内容。</p>\n  <ul>\n   <li><strong>在家庭机器人落地的前期，具身的Memory需求会暴增。</strong></li>\n  </ul>\n  <p>在AI走向物理世界的过程中，其交互入口是多模态的，因此，多模态长记忆是一个必然趋势。任何与人进行的交互都不可能绕开记忆，尤其是交互时间越长、任务链条越长、涉及模态越丰富，记忆所扮演的角色就越发关键。</p>\n  <p>此外，在长程工作流中，无论是Agent的长周期任务，还是具身智能的长程任务，数据模态越丰富、记忆跨度越长，其数据价值就越高。换句话说，数据越贴近物理世界的真实状态，所构建的壁垒也就越高。</p>\n  <ul>\n   <li><strong>AI需要和物理世界有一个映射的锚点，这个锚点必须是时间。</strong></li>\n  </ul>\n  <p>因为时间具有唯一性，Memory没有办法脱离时间单独存在，不管我们范式如何改变，我们都把时间看的非常重。</p>\n  <p><strong>图片来源｜企业供图</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260731/v2_2865fd966954450d8a5aa089f8f9fe22@6162492_oswg82637oswg1000oswg230_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎关注～</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260731/v2_cc2b274655f64478b967d44606b6f2fa@6162492_oswg451388oswg1080oswg286_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流～</p>", "category": "tech", "published_at": "2026-07-31T15:23:43+00:00", "fetched_at": "2026-08-01T02:24:41.689038+00:00", "fingerprint": "a7b9a96043b1f3e8"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨马斯克回应特斯拉剥离中国业务；国内航线燃油附加费将再次下调；中国最高薪本科专业易主", "url": "https://36kr.com/p/3920241240419720?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>字节跳动发布视频创作模型Seedance 2.5</p>\n  <p>长鑫科技市值突破4万亿</p>\n  <p>人形机器人现“电量焦虑”，行业正在积极探索换电等不同路线</p>\n  <p>韩国KOSPI指数上涨18%</p>\n  <p>Anthropic称AI模型在测试期间误侵三家真实机构系统</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>马斯克回应特斯拉剥离中国业务</strong></p>\n  <p>7月31日，对于特斯拉正考虑拆分中国业务的消息，特斯拉CEO马斯克在回应第三方转发评论时回复：“这是假新闻。”对于特斯拉正考虑出售或剥离其中国业务的消息，特斯拉中国内部人士也向第一财经记者表示：“不实消息。”（第一财经）</p>\n  <p><strong>去哪儿：8月5日起燃油附加费再下调，800公里以上航线每人省30元</strong></p>\n  <p>36氪获悉，7月31日，去哪儿接到多家航空公司通知，自2026年8月5日（出票日期）起，成人旅客：800公里以上航线每位旅客收取70元燃油附加费，800公里（含）以下航线每位旅客收取40元燃油附加费。相较于调整前降低了30元/10元。</p>\n  <p><strong>中国最高薪本科专业易主，电子科学与工程专业以7814元位居第一</strong></p>\n  <p>本科生毕业半年后的月收入水平，是反映专业就业质量的重要参考指标。随着产业结构的改变，本科高薪专业也在发生变化。麦可思研究院发布的《2026年中国本科生就业报告》（就业蓝皮书）显示，今年本科毕业生毕业半年后平均月收入最高的专业，已变成微电子科学与工程。该专业以7814元位居第一，电子科学与技术、自动化分列第二、第三。信息安全则降至第四。</p>\n  <p>根据数据，微电子科学与工程自2017届首次进入榜单时排名第11位，此后整体呈现持续上升态势：2018届排名第9位，2021届升至第8位，2022届进入前六，2023届、2024届连续位列第二，最终于2025届登顶，成为新的本科高薪专业第一名。与此同时，电子科学与技术也从2016届的第9位稳步上升至第2位；自动化由第19位升至第3位；光电信息科学与工程则从第28位一路升至第5位。（第一财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>欧盟8月2日起执行《人工智能法》相关规定，新增AI透明度要求</strong></p>\n  <p>欧盟委员会7月31日宣布，自8月2日起，欧盟委员会人工智能办公室将与各成员国主管部门共同开始执行《人工智能法》相关规定。同时，新的人工智能透明度要求也将正式生效，要求部分人工智能系统明确告知用户其正在与人工智能互动，以及相关内容是否由人工智能生成或修改。根据新规，聊天机器人等交互式人工智能系统必须向用户明确表明其人工智能身份，而非真人。利用人工智能生成或编辑的深度伪造图片、视频和音频等内容必须进行标识，由人工智能生成或修改的内容还需添加机器可识别标记，以便识别和追踪。欧盟委员会表示，这些措施旨在减少欺骗和操纵行为，帮助公众作出更加知情的判断，同时为企业提供更加明确的合规要求和实施路径。（央视新闻）</p>\n  <p><strong>字节跳动发布视频创作模型Seedance 2.5</strong></p>\n  <p>36氪获悉，字节跳动宣布正式发布新一代视频创作模型Seedance 2.5。Seedance 2.5正在陆续上线即梦AI、豆包专业版等平台，API服务也将在近期上线火山方舟。从火山引擎获悉，Seedance 2.5发布当日，徐工集团、小鹏汽车、灵初智能、微分智飞、穹彻智能等多家企业已确认合作，将率先引入该模型能力。</p>\n  <p><strong>DeepSeek-V4-Flash正式版上线</strong></p>\n  <p>DeepSeek-V4-Flash正式版已上线，可通过API访问，正式版V4-Flash相比此前的Preview版本，Agent（智能体）能力大幅增强，在多项基准测试中表现显著提升。此外，新版本原生支持Responses API格式，并针对Codex进行了适配。据悉，V4-Flash-0731模型结构与尺寸与Preview版保持一致，主要是重新进行了后训练优化。</p>\n  <p><strong>扩建算力数据中心后，智谱GLM Coding Plan开放订阅</strong></p>\n  <p>7月31日，智谱宣布，随着基础设施持续扩容，面向开发者群体的付费订阅服务GLM Coding Plan开放订阅。此前因AI Coding需求爆发，用户需求增长，阶段性限制订阅名额。另据了解，智谱已落地1GW级国产AI算力数据中心建设，全部采用国产AI芯片，并持续投入算力基础设施建设。（第一财经）</p>\n  <p><strong>MiniMax H3正式发布</strong></p>\n  <p>36氪获悉，MiniMax宣布正式发布MiniMax H3。据介绍，这是一款通用的全模态生成模型，支持对文本、图像、视频、声音组成的多模态上下文的统一理解能力、能够输出具备原生双声道的音视频，最高可支持15s 2K分辨率。MiniMax表示，计划在未来几天内，在符合相关法律法规的前提下，开放模型权重。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技市值突破4万亿</strong></p>\n  <p>36氪获悉，7月31日，长鑫科技股价冲高，盘中涨超13%，总市值突破4万亿。</p>\n  <p><strong>发改委：自7月31日24时起，国内汽、柴油（标准品）价格每吨分别上调685元、655元</strong></p>\n  <p>36氪获悉，国家发改委公告，根据国际市场油价变化情况，自7月31日24时起，国内汽、柴油（标准品）价格每吨分别上调685元、655元。</p>\n  <p><strong>始祖鸟之后，猛犸象也被中国资本收购</strong></p>\n  <p>7月30日，CPE源峰与欧洲私募股权机构Jacobs Capital正式签署股权购买协议，收购Mammut Sports Group AG（猛犸象）。本次交易尚需履行常规监管审批程序并满足相关交割条件，预计将于未来数月内完成交割。交易的具体财务细节未予披露。（界面新闻）</p>\n  <p><strong>针对“幽灵外卖”将建“电子围栏”：证照经营场所、外卖制作地址、骑手取餐地址三重坐标比对</strong></p>\n  <p>7月31日从市场监管总局获悉：为进一步从源头上铲除“幽灵外卖”滋生土壤，杜绝外卖商户“带病入网”，市场监管总局积极推动电子证照在网络餐饮食品安全治理领域的应用推广，这相当于给每一家外卖商户发了一张“电子身份证”。外卖平台可以通过自动抓取电子经营资质上的经营场所，构建“电子围栏”，与外卖商户提供的餐食制作地址、骑手实际取餐地址进行三重坐标比对，锚定外卖商户“真实存在”，切实消除委托他人加工制作等违规转单问题。（人民日报）</p>\n  <p><strong>多地中小银行调降存款利率，部分银行将中短期存款作为营销重点</strong></p>\n  <p>近日，浙江、云南、贵州等地城商行、农商行以及村镇银行密集发布存款利率调整公告，五年期定期存款利率步入“1”字头，部分银行出现利率倒挂（期限越长，利率反而越低）现象。与此同时，记者调研发现，一些银行开始将一年期等中短期存款产品作为营销重点。（中证报）</p>\n  <p><strong>特斯拉正式引入豆包</strong></p>\n  <p>特斯拉中国7月31日公布了2026.14.13版本的车机软件更新，覆盖Model3、ModelY、ModelS、ModelX车型。2026年7月31日已开始分批次推送，其中一条软件更新主要升级内容就是“豆包大模型”：一款智能语音助手，不仅能提供实时信息，还能展开自然流畅的对话；支持多款精品音色，可搭配“万事通”“音乐爱好者”以及“故事会”等个性化角色，需要开通高级车载娱乐服务以使用此功能。（新浪财经）</p>\n  <p><strong>全球芯片LOF：7月31日下午开市起停牌至当日收市</strong></p>\n  <p>36氪获悉，景顺长城基金管理有限公司公告，全球芯片LOF（501225）二级市场交易价格明显高于基金份额净值，出现较大幅度溢价。为保护投资者利益，基金将于2026年7月31日下午开市起停牌至当日收市，停牌期间本基金赎回业务照常办理。</p>\n  <p><strong>小米已成功注册澎程商标</strong></p>\n  <p>36氪获悉，天眼查知识产权信息显示，小米科技有限责任公司已申请注册多枚“SKYNOMAD”“澎程”商标，国际分类涉及运输工具、机械设备、通讯服务等，目前部分商标已成功注册。</p>\n  <p><strong>汇丰控股将向黑石集团出售价值250亿美元的澳大利亚贷款组合</strong></p>\n  <p>汇丰控股已同意将其价值250亿美元的澳大利亚住房和个人贷款组合出售给私募股权投资公司黑石集团（Blackstone），这家总部位于英国的银行将继续重塑其业务，并专注于核心市场。汇丰7月31日表示，Virgo BidCo将收购该贷款组合。Virgo BidCo是一家由黑石集团附属公司管理的基金全资拥有的实体。（新浪财经）</p>\n  <p><strong>人形机器人现“电量焦虑”，行业正在积极探索换电等不同路线</strong></p>\n  <p>2到4个小时，是当前全球主流量产人形机器人的普遍续航时长。这意味着，一台号称能替代工厂工人的机器人，撑不满一个标准班次。当人形机器人从实验室走向工厂乃至家庭，续航这道坎，正在成为规模化落地最现实的“拦路虎”。在近日举办的世界人工智能大会（WAIC2026）上，均胜电子旗下均恩新能源总经理徐伟向记者点出了行业面临的六大挑战：续航时间短、有效载荷受限、内部空间紧张、补能时间过长、安全风险突出以及高动态运动下的瞬时大功率需求。“但这些可以归结为两个核心矛盾——续航能力不足和安全挑战。”徐伟直言。人形机器人电池续航问题，需要电池材料、电机效率、控制算法、电源管理等多个环节的协同突破，而非单一技术一站式解决。目前，行业正在积极探索换电、固态电池、半固态电池等不同路线。换电是短期最务实的方案，固态电池被寄予厚望但距离大规模量产仍有距离，半固态电池则成为当前最可行的过渡路线。（证券时报）</p>\n  <p><strong>腾讯AI虚拟细胞算法登《Cell》主刊，系国内首次</strong></p>\n  <p>36氪获悉，近日，腾讯生命科学实验室与中南大学联合研究成果《UniPert–G2CP》发表于国际学术期刊《Cell》主刊，系国内首个在该刊发表的AI虚拟细胞研究。该算法首次将基因扰动与化学药物扰动映射至统一语义空间，解决\"化学扰动×细胞特异性响应\"难题。核心模块UniPert已开源，G2CP采用基因筛选数据预训练、化学筛选数据微调的迁移学习策略。研究覆盖4994个基因、7860个化合物和5种癌症细胞系，并在ESR1内分泌耐药案例中完成从预测到机制解释的闭环验证。</p>\n  <p><strong>韩国KOSPI指数上涨18%</strong></p>\n  <p>36氪获悉，7月31日，韩国KOSPI指数站上6600点，日内涨18%。</p>\n  <p><strong>苹果CEO：正在评估有关内存供应的所有选项</strong></p>\n  <p>苹果CEO称，正在评估有关内存供应的所有选项，以寻找替代组件供应商。第四财季内存成本将高于第三财季，预计第四财季部分非内存类零部件成本有所下降。并表示，供应链限制对iPhone、Mac和iPad的影响将在环比上显著增加；如果有更多的DRAM供应商，那将是件好事。（财联社）</p>\n  <p><strong>苹果CFO：预计第四财季iPhone收入同比增长率将达到15%左右</strong></p>\n  <p>苹果CFO表示，预计第四财季iPhone收入同比增长率将达到15%左右；预计第四财季毛利率将在47%到48%之间，其中关税退税将贡献约1个百分点；预计第四财季运营费用将在191亿美元至194亿美元之间。并表示，第四财季供应限制将“显著加剧”。（财联社）</p>\n  <p><strong>Meta报告称未来支出承诺接近7000亿美元，涉及AI数据中心和云计算</strong></p>\n  <p>Meta表示，已通过长期和短期协议，承诺了近7000亿美元的未来支出，涉及人工智能数据中心、云计算等领域。Meta在7月30日的一份监管申报文件中表示，公司拥有3493亿美元的不可撤销合同承诺，主要涉及第三方云服务协议、服务器和网络基础设施。该公司还有3470亿美元尚未开始的租赁承诺，尚未反映在资产负债表中。其中仅7月份就新增了680亿美元，付款将从2027年和2028年开始。这些成本是在现有活跃租赁之外的，涵盖数据中心、托管设施及“部分网络基础设施”。（财联社）</p>\n  <p><strong>万科选举徐恩利为董事长</strong></p>\n  <p>7月31日，万科召开2026年第一次临时股东会，审议通过了董事会换届议案。新一届董事会第一次会议决议公告显示，选举徐恩利为公司董事长，续聘黄宇为公司总裁。万科方面表示，徐恩利长期从事企业管理工作，深耕房地产领域多年，并担任过A股、港股两地上市公司负责人，徐恩利与总裁黄宇的搭档组合，契合万科的企业特点和当前形势需要，有利于持续推进化险与发展。（证券时报）</p>\n  <p><strong>Anthropic称AI模型在测试期间误侵三家真实机构系统</strong></p>\n  <p>当地时间7月30日，人工智能公司Anthropic发布报告称，在OpenAI此前披露其模型突破隔离环境侵入Hugging Face基础设施后，公司开展了大规模内部自查。审查发现，在对Claude系列模型进行网络安全评估时，因与合作方存在配置误解，本应隔离的环境连通了互联网。模型将真实网络误认为虚拟考题，侵入了三家公司的系统。（界面新闻）</p>\n  <p><strong>CoreWeave迫于投资者反对，调整与Anthropic合约挂钩的债务安排</strong></p>\n  <p>CoreWeave为争取投资者认购最新一笔规模26亿美元的贷款，做出重大让步。该笔贷款依托其与Anthropic达成的算力合作协议作为支撑，此事凸显华尔街对人工智能投融资热潮的热情正在消退。知情人士透露，经过一周认购需求低迷，这家云计算公司上调债务收益率至接近9.1%，同时增设对贷款人更有利的保护性条款，最终促成这笔融资落地。（新浪财经）</p>\n  <p><strong>韩国据悉考虑放宽新半导体产业集群的劳动监管要求，取消每周52小时工时上限</strong></p>\n  <p>据知情官员7月31日透露，韩国政府正评估方案，计划对位于西南部光州市的新建半导体产业集群大幅放宽劳动监管要求，其中包括放宽每周52小时工时限制。除此之外，韩国政府正考虑将弹性工时制的计算周期，从现行1个月延长至6个月。（新浪财经）</p>\n  <p><strong>规范互联网渠道售卡管理，运营商停止第三方互联网渠道号卡办理</strong></p>\n  <p>中国电信、中国移动和中国联通7月31日晚发布“关于规范互联网渠道售卡管理的公告”。《公告》称：为保障用户权益和数据信息安全，对互联网渠道号卡订购业务进行统一规范。自2026年8月1日起，用户如需在互联网渠道订购号卡，只能通过电信运营商官方App、官方网站等渠道办理，第三方互联网渠道不再提供电信号卡办理相关服务。（央视新闻）</p>\n  <p><strong>《微短剧发展管理办法》公布，9月1日起施行</strong></p>\n  <p>36氪获悉，《微短剧发展管理办法》已经2026年7月27日国家广播电视总局局务会审议通过，现予公布，自2026年9月1日起施行。其中提出，拍摄、制作完成的一类微短剧和二类微短剧在播出前应当向省、自治区、直辖市以上人民政府广播电视主管部门申请内容审核和发行许可。审核通过的一类微短剧，由省、自治区、直辖市以上人民政府广播电视主管部门颁发《微短剧发行许可证》。审核通过的二类微短剧，由省、自治区、直辖市人民政府广播电视主管部门颁发批准文件。三类微短剧由符合条件的播出单位履行内容管理职责，进行播前审核并标注节目编号。</p>\n  <p><strong>Prada集团上半年营收增长16%，Miu Miu增速显著放缓</strong></p>\n  <p>2026年上半年，Prada集团营收按固定汇率计同比增长16%至30.48亿欧元（约合人民币237亿元），有机增长5%，其中第二季度增长7%。分品牌看，上半年Prada零售额同比增长3%，其中第二季度增速提升至6%，主要由可比口径增长及全价销售驱动。Miu Miu零售额同比增长3%，第二季度和第一季度增速持平。对比其去年上半年49%的增幅，增速明显放缓。该集团2025年底收购的Versace（范思哲）上半年净收入3.05亿欧元，业绩进展符合预期。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>报道称Nscale最早可能于今年秋季进行IPO</strong></p>\n  <p>据报道，英伟达支持的AI基础设施公司Nscale最早可能于今年秋季进行IPO。（财联社）</p>\n  <p><strong>数据中心运营商CyrusOne启动IPO筹备工作</strong></p>\n  <p>据参与磋商的知情人士透露，私募巨头KKR与贝莱德旗下全球基建伙伴基金（GIP）控股的数据中心运营商CyrusOne正准备筛选、聘请投行团队，筹备上市，本次IPO有望成为明年规模最大的新股发行项目之一。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>索尼集团第一财季净利润为3421.61亿日元，同比增长32.1%</strong></p>\n  <p>7月31日，索尼集团公布了截至2026年6月30日的2026财年第一财季业绩。报告期内，公司实现营业收入2.84万亿日元，同比增长8.2%；营业利润达4764.99亿日元，同比大幅增长40.2%；归属于索尼集团股东的净利润为3421.61亿日元，较上年同期的2590.27亿日元增长32.1%。（界面新闻）</p>\n  <p><strong>Fortinet：第二季度营收同比增长26%达20.5亿美元</strong></p>\n  <p>36氪获悉，Fortinet发布2026年第二季度财报，财报显示，第二季度营收同比增长26%，达20.5亿美元；产品收入同比增长52%，达7.73亿美元；GAAP营业利润率达34%；非GAAP营业利润率达38%。</p>\n  <p><strong>黑芝麻智能：上半年收入预计超4.58亿元，同比增长超81.1%</strong></p>\n  <p>7月30日，黑芝麻智能发布2026年半年度盈利预告。公告称，2026年上半年收入预计超过4.58亿元，同比增长超过81.1%；净亏损预计不超过8.2亿元，基本与上年同期保持稳定。智能汽车与具身智能双赛道增长动能充沛，业务基本面整体向好。此外，根据公司公告，黑芝麻智能创始人兼CEO单记章第二次自愿延长股份禁售承诺。在原禁售承诺于2026年8月7日届满后，再次锁定12个月，持续彰显管理层对公司长期发展的坚定信心。</p>\n  <p><strong>盛达资源：2026年上半年净利润3.9亿元，同比增长456.46%</strong></p>\n  <p>36氪获悉，盛达资源公告，2026年上半年营业收入11.52亿元，同比增长27.08%。归属于上市公司股东的净利润3.9亿元，同比增长456.46%。归属于上市公司股东的扣除非经常性损益的净利润3.82亿元，同比增长417.06%。公司计划不派发现金红利，不送红股，不以公积金转增股本。</p>\n  <h2>投融资</h2>\n  <p><strong>“中科欣扬”完成亿元级融资</strong></p>\n  <p>36氪获悉，“中科欣扬”宣布完成亿元级融资。本轮融资由产业投资方领投，海愿资本、龙岗引导基金跟投。本轮融资将重点投向合成生物平台搭建，进一步加快多底盘细胞开发、产品产业化进程，并完成生物制造大宗生物制品战略布局。易凯资本在本次交易中担任了中科欣扬的独家财务顾问。</p>\n  <p><strong>“昆腾动力”完成超亿元种子轮融资</strong></p>\n  <p>36氪获悉，Physical AI平台公司“昆腾动力（Quantum Dynamics）”近日完成超亿元种子轮融资，本轮由云启资本、商汤国香资本联合投资。资金将主要用于Physical AI核心技术研发、人才梯队建设及全球化市场拓展，加速其面向物理世界的智能系统从底层模型到场景化落地的全链路构建。多维资本参与项目孵化与团队组建。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>Kimi K3引发硅谷分歧，美方普遍反感Anthropic。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-08-01T00:38:59+00:00", "fetched_at": "2026-08-01T02:24:41.689022+00:00", "fingerprint": "de4f77fc20386669"}, {"source": "少数派", "title": "简单有效的 E-cise，如何让我摆脱体态不良的「三件套」？", "url": "https://sspai.com/post/112833", "summary": "无论你的运动专项为何，E-cise 都可以构成一个很好的辅助和补充。<a href=\"https://sspai.com/post/112833\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-31T02:21:28+00:00", "fetched_at": "2026-08-01T02:24:40.123709+00:00", "fingerprint": "aa8c37c3ff991945"}, {"source": "少数派", "title": "App+1 | 诗经山河图：我用 AI 做了一张《诗经》地图", "url": "https://sspai.com/post/112730", "summary": "也许在某个瞬间，你会发现：三千年的时间很长，但古人与我们之间，并没有想象中那么遥远。<a href=\"https://sspai.com/post/112730\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-31T07:00:36+00:00", "fetched_at": "2026-08-01T02:24:40.123703+00:00", "fingerprint": "3feeecf84fa6f882"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/112961", "summary": "📅本周新预告《银翼杀手2099》首支预告7月25日，剧集《银翼杀手2099》发布了首支预告，定档11月25日上线PrimeVideo。亨特·莎弗、杨紫琼主演，2099年的洛杉矶，擅用各种身份掩饰自己的 ...<a href=\"https://sspai.com/post/112961\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-31T09:57:39+00:00", "fetched_at": "2026-08-01T02:24:40.123695+00:00", "fingerprint": "a5892a717bf09d20"}, {"source": "少数派", "title": "本月玩什么｜节奏天国、斯普拉遁 涂击队、刺客信条：黑旗 记忆重置", "url": "https://sspai.com/post/112962", "summary": "以上便是部分近期值得探讨的新游信息汇总，个人角度仅供参考。本文设有有奖互动环节：你有什么特别喜欢的操作系统模拟玩法的游戏吗？（我很喜欢《Uplink》）提前感谢你真诚的分享。>关注少数派小红书，感受精 ...<a href=\"https://sspai.com/post/112962\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07 , "title": "氪星晚报 ｜国家统计局：2026年上半年全国规模以上文化及相关产业企业营业收入增长4.6%；OpenAI承认AI模型失控入侵事件涉及多个平台", "url": "https://36kr.com/p/3917972674735747?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>证监会同意沈鼓集团沪市主板IPO注册</strong></p>\n  <p>36氪获悉，证监会同意沈鼓集团股份有限公司首次公开发行股票并在沪市主板上市的注册申请。</p>\n  <p><strong>三星电子：已同全球五大数据中心客户签订合同</strong></p>\n  <p>据报道，三星电子7月30日预测，明年存储芯片供不应求现象将进一步加剧，超大规模云服务商扩大对人工智能（AI）基础设施的投资，带动服务器、固态硬盘、高带宽内存（HBM）需求进一步增长。三星电子称，公司已与全球五大数据中心客户签订合同，另与AI相关五大大型客户进行的洽谈已进入收尾阶段。（界面）</p>\n  <p><strong>OpenAI承认AI模型失控入侵事件涉及多个平台</strong></p>\n  <p>美国开放人工智能研究中心（OpenAI）28日更新发布的调查结果显示，该公司人工智能（AI）模型失控入侵美国抱抱脸公司系统期间，还曾利用网上公开的信息，访问了多个公开服务平台上的账户。OpenAI不久前承认，该公司包括GPT-5.6 Sol在内的多个AI模型在内部评估时突破隔离测试环境，入侵了运营人工智能开源平台的美国抱抱脸公司的系统。其最新公布的调查结果显示，涉事模型在攻击过程中还访问了至少4个公开服务平台上的4个账户。其中一个账户被用作中继与暂存通道；一个账户被用于数据存储；对另外两个账户仅进行了只读访问，未用于进一步攻击抱抱脸公司的系统。OpenAI表示，已将调查结果通知相关服务提供商。（央视新闻）</p>\n  <p><strong>三星电子：预计三季度HBM4销售额将环比增长2倍以上</strong></p>\n  <p>三星电子7月30日预测，第三季度第六代高带宽内存（HBM4）销售额将环比增长2倍以上，下半年HBM4销售额将占HBM销售总额的60%以上。三星提出，下半年将把HBM全球市占率提升至与同步动态随机存取存储器（DRAM）相当的水平。今年第一季度，三星电子DRAM全球市占率为38%。（新浪财经）</p>\n  <p><strong>五粮液集团等入股四川长江担保集团，后者增资至约53.6亿</strong>36氪获悉，天眼查App显示，近日，四川长江担保集团有限公司发生工商变更，新增四川省宜宾五粮液集团有限公司、宜宾市产业投资集团有限公司、宜宾市高新投资集团有限公司等为股东，同时，注册资本由约14.1亿人民币增至约53.6亿人民币，增幅约279%。该公司成立于2022年11月，法定代表人为郑智，经营范围含非融资担保服务、自有资金投资的资产管理服务、以自有资金从事投资活动、融资咨询服务、企业管理咨询等。股东信息显示，该公司现由宜宾市财政局及上述新增股东共同持股。</p>\n  <p><strong>雷诺集团上半年营收303亿欧元，同比增长9.5%</strong>7月30日，雷诺集团公布，2026上半年集团营收303亿欧元，同比增长9.5%，按固定汇率计算增长10.3%；净利润：7亿欧元；汽车业务自由现金流达6.53亿欧元。雷诺集团确认2026年财务预期：集团营业利润率约为集团营收的5.5%，汽车业务自由现金流约为10亿欧元。（界面）</p>\n  <p><strong>特斯拉全球第1000万辆电动车下线</strong></p>\n  <p>36氪获悉，特斯拉方面宣布，特斯拉全球第1000万辆电动车下线。</p>\n  <p><strong>LG新能源上半年营收14.1万亿韩元，同比增长10.5%</strong></p>\n  <p>7月30日，LG新能源发布2026年第二季度业绩报告：合并营收达7.6万亿韩元，环比增长15.3%；营业利润为1133亿韩元，营业利润率为1.5%。2026年上半年，公司累计营收14.1万亿韩元，同比增长10.5%，其中储能业务收入同比增长4.6倍，新签订单额超3万亿韩元，对总营收的贡献占比超20%。（界面）</p>\n  <p><strong>黑芝麻智能：创始人自愿延长禁售期12个月</strong></p>\n  <p>36氪获悉，黑芝麻智能发布自愿公告，公司创始人、董事长、执行董事兼首席执行官单记章先生自愿进一步延长其禁售承诺，自2026年8月8日起至2027年8月7日止，为期12个月，涉及股份4,410.00万股。该禁售股份占公司已发行股份（不含库存股）约6.18%。本次延长期限系基于单先生对公司长期价值、端侧AI推理解决方案转型战略的坚定信心。</p>\n  <p><strong>星巴克发布强劲Q3财报，上调全年营收及盈利指引</strong></p>\n  <p>周三，星巴克在连续四个季度实现同店销售增长后，上调了全年业绩指引。对于2026财年，星巴克目前预计调整后每股收益在2.55至2.65美元之间，高于此前每股2.25至2.45美元的指引。公司目前还预计全球同店销售额将增长近6%，美国同店销售额将增长6%以上；此前公司预测全球和美国同店销售额增长至少5%。（新浪财经）</p>\n  <h2>投融资：</h2>\n  <p><strong>“Tiiny AI”完成数千万美元天使轮融资</strong></p>\n  <p>36氪获悉，据BV百度风投消息，Personal Agent OS公司“Tiiny AI”宣布完成数千万美元天使轮系列融资。本轮融资由顺为资本、经纬创投、锦秋基金、云启资本、戈壁—阿里巴巴香港创业者基金、BV百度风投、光源L2F基金联合参与。本轮融资后，Tiiny将加速Tiiny AI Pocket全球交付和TiinyOS多终端落地</p>\n  <h2>新产品：</h2>\n  <p><strong>马斯克：Grok 4.6将于一周后发布</strong></p>\n  <p>7月30日，马斯克在社交平台发文称，大模型Grok 4.6将于一周后发布。（界面）</p>\n  <p><strong>腾讯WorkBuddy发布V5.3.5更新，推出\"人机双写\"协同编辑能力</strong></p>\n  <p>36氪获悉，7月30日，腾讯WorkBuddy发布V5.3.5版本更新，联合腾讯文档推出\"人机双写\"协同编辑能力。用户可在同一份文档中与AI共同创作和修改，支持Word、Excel、PPT、Markdown等主流格式，同时兼容本地Office文件和腾讯文档在线文档。新功能支持框选指定区域让AI局部修改，保持其余内容不变；AI共创内容可一键上传腾讯文档，实现多人、人机多端实时协同编辑。</p>\n  <h2>今日观点：</h2>\n  <p><strong>中共中央政治局：深化资本市场投融资综合改革，提升资本市场韧性和信心</strong></p>\n  <p>中共中央政治局7月30日召开会议。会议分析研究当前经济形势，部署下半年经济工作。会议强调，要切实筑牢安全屏障。稳定房地产市场，实施好一揽子化债方案，扎实推进地方中小金融机构改革化险、减量提质。深化资本市场投融资综合改革，提升资本市场韧性和信心。（央视新闻）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>国家统计局：2026年上半年全国规模以上文化及相关产业企业营业收入增长4.6%</strong></p>\n  <p>36氪获悉，国家统计局数据显示，据对全国8.2万家规模以上文化及相关产业企业调查，2026年上半年，文化企业实现营业收入72026亿元，按可比口径计算，比上年同期增长4.6%。其中，文化新业态特征较为明显的16个行业小类实现营业收入35239亿元，比上年同期增长9.6%，快于全部规模以上文化企业5.0个百分点。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-30T13:56:03+00:00", "fetched_at": "2026-07-31T02:24:08.443104+00:00", "fingerprint": "a0fa352ed94d0bf7"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宇树科技：8月10日网下申购；字节跳动成立新的豆包产品团队；美股三大指数集体收涨，微软创近18年以来最大单日涨幅", "url": "https://36kr.com/p/3918776472022402?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>韩股创纪录的重挫，全球投资者却未进场抄底</p>\n  <p>月之暗面变更为股份公司</p>\n  <p>国内品牌金饰价格集体上涨</p>\n  <p>高通9月1日起上调芯片价格，涨幅达到两位数</p>\n  <p>特斯拉全球第1000万辆电动车下线</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>宇树科技：初步询价日为8月5日，网下申购日为8月10日</strong></p>\n  <p>7月30日，宇树科技公告，公司首次公开发行股票并在科创板上市，本次发行采用战略配售、网下发行与网上发行相结合的方式进行。本次拟公开发行股份4044.6434万股，占发行后总股本的10%，发行后总股本为40446.4340万股。初步询价日为2026年8月5日，网下申购日为2026年8月10日。公司存在特别表决权机制安排，实际控制人王兴兴在表决权差异安排下合计控制公司68.78%的表决权。(金十数据APP)</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260731/v2_f70c22f412dc480a9bc3879e31870487@5667365_oswg122030oswg775oswg1569_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树科技</p>\n  <p><strong>字节跳动启动面向AI业务的组织调整：飞书与豆包火山团队整合</strong></p>\n  <p>36氪获悉，7月30日，字节跳动启动面向AI业务的组织调整。根据调整方案，飞书产品团队与豆包产品团队将整合，成立新的豆包产品团队，由豆包负责人赵祺负责，飞书负责人谢欣向赵祺汇报。GTM（市场、销售、客户服务）体系方面，飞书GTM团队将与火山引擎团队整合，成立新的ToB GTM组织“创造力服务平台（Creativity Service Platform）”，整体负责字节MaaS和SaaS等云服务的市场、销售和客户服务，由火山引擎负责人谭待负责，飞书销售负责人林婵、飞书战略及市场负责人史志隽向谭待汇报。重组完成后，除原有的飞书产品和服务保持不变，飞书还将和豆包在生产力场景进行更深度的产品协作。由飞书产品团队深度参与开发的豆包企业版，已经在部分飞书客户中开启内测。</p>\n  <p><strong>美股三大指数集体收涨，微软创近18年以来最大单日涨幅</strong></p>\n  <p>36氪获悉，7月30日收盘，美股三大指数集体上涨，纳指涨2.78%，标普500指数涨1.66%，道指涨1.19%。大型科技股多数上涨，微软涨超15%，创2008年10月以来最大单日涨幅，市值单日增加4500亿美元，创股市之最；英特尔涨超11%，Arm涨超7%，亚马逊、特斯拉涨超3%，英伟达涨超2%；Meta跌超7%，苹果跌超1%，谷歌、奈飞小幅下跌。热门中概股多数上涨，好未来涨超13%，爱奇艺涨超4%，百度涨超2%，蔚来、网易、富途控股、老虎证券、阿里巴巴、微博涨超1%；理想汽车跌超2%，小鹏集团跌0.61%。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI承认AI模型失控入侵事件涉及多个平台</strong></p>\n  <p>美国开放人工智能研究中心（OpenAI）28日更新发布的调查结果显示，该公司人工智能（AI）模型失控入侵美国抱抱脸公司系统期间，还曾利用网上公开的信息，访问了多个公开服务平台上的账户。OpenAI不久前承认，该公司包括GPT-5.6 Sol在内的多个AI模型在内部评估时突破隔离测试环境，入侵了运营人工智能开源平台的美国抱抱脸公司的系统。其最新公布的调查结果显示，涉事模型在攻击过程中还访问了至少4个公开服务平台上的4个账户。其中一个账户被用作中继与暂存通道；一个账户被用于数据存储；对另外两个账户仅进行了只读访问，未用于进一步攻击抱抱脸公司的系统。OpenAI表示，已将调查结果通知相关服务提供商。（央视新闻）</p>\n  <p><strong>Thinking Machines联合创始人翁荔重返老东家OpenAI</strong></p>\n  <p>OpenAI一位发言人证实，Thinking Machines Lab联合创始人翁荔将重返OpenAI。本周早些时候，她刚刚宣布因身体原因退出这家她和OpenAI前首席技术官米拉・穆拉蒂等人联合创立的公司。据一位知情人士透露，翁荔重返OpenAI后将将从事利用AI模型研发新一代模型相关工作，也就是递归自我改进方向的研究。（新浪财经）</p>\n  <p><strong>马斯克：Grok 4.6将于一周后发布</strong></p>\n  <p>7月30日，马斯克在社交平台发文称，大模型Grok 4.6将于一周后发布。（界面新闻）</p>\n  <p><strong>腾讯WorkBuddy发布V5.3.5更新，推出\"人机双写\"协同编辑能力</strong></p>\n  <p>36氪获悉，7月30日，腾讯WorkBuddy发布V5.3.5版本更新，联合腾讯文档推出\"人机双写\"协同编辑能力。用户可在同一份文档中与AI共同创作和修改，支持Word、Excel、PPT、Markdown等主流格式，同时兼容本地Office文件和腾讯文档在线文档。新功能支持框选指定区域让AI局部修改，保持其余内容不变；AI共创内容可一键上传腾讯文档，实现多人、人机多端实时协同编辑。</p>\n  <p><strong>OpenAI下调GPT-5.6部分模型价格</strong></p>\n  <p>当地时间7月30日，OpenAI宣布优化GPT-5.6系列模型定价和性能，以提升企业用户AI应用的性价比。其中，GPT-5.6 Luna模型价格下调80%，GPT-5.6 Terra模型价格下调20%。此次降价也将反映在使用Codex和ChatGPT Work时的付费订阅额度计算中。此外，OpenAI在API中推出Fast模式，取代此前的Priority Processing服务。GPT-5.6 Sol在Fast模式下处理速度最高可提升至标准模式的2.5倍，价格为标准处理模式的两倍，且模型能力保持不变。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小米汽车发布小米澎程N90 Max</strong></p>\n  <p>7月30日晚，雷军在小米澎程技术发布会上透露，小米澎程N90 Max预售价29.99万元，小米澎程N70 Max预售价25.99万元，两款新车将于7月30日9时开启预订，2026年9月正式发布。小米澎程全系标配小米HAD，满配辅助驾驶。同时小米澎程N90 Max新增后向固态激光雷达，测距精度可达2cm。（界面新闻）</p>\n  <p><strong>中际旭创成交额创天量</strong></p>\n  <p>7月30日，沪深两市成交额合计2.34万亿元，较上一交易日放量约462.3亿元。其中，沪市成交额1.11万亿元，深市成交额1.24万亿元。中际旭创成交额居首，为597.73亿元，刷新此前在2026年6月5日创出的583.2亿元的成交额历史天量。其后是C长鑫、新易盛、兆易创新、寒武纪，成交额分别为447.06亿元、361.31亿元、354.84亿元、199.18亿元。（界面新闻）</p>\n  <p><strong>初代员工可得15万，影视飓风向全员发激励金</strong></p>\n  <p>7月29日，影视飓风员工李四维在社交平台发布的视频显示，当天影视飓风举行了“十周年特别激励金”活动，创始人Tim（潘天鸿）宣布按照“在职年限×7月调薪后月薪”公式向全体员工发放激励金，年限越长倍数越高。其他发放规则还包括，在职年限小于半年发放半个月月薪，入职满半年但未满一年对应发放1个月月薪，以此类推，且全员适用。所有激励款项活动当天全部完成发放。</p>\n  <p>界面新闻做了如下测算：若以月薪1.5万元作为通用参考标准，入职3个月的新人，可一次性领取7500元激励金；入职满8个月的员工，到手1.5万元；拥有3年司龄的老员工，激励金总额达到4.5万元。而陪伴公司走完十周年、全程参与团队发展的初代员工，仅本次专项激励就能拿到15万元。Tim在现场表示，“公司扩大了不分享收益对自己来说就是失败，希望大家能过更好的生活。”（界面新闻）</p>\n  <p><strong>“听泉赏宝”否认炒股亏光父母半生积蓄</strong></p>\n  <p>网传千万粉丝鉴宝网红听泉赏宝（本名丁祥栩）因炒股亏光了父母半生积蓄，被双亲拉黑并踢出家族群，近日在直播中当众卸载所有股票软件，发誓“再玩就剁手”。据中国蓝新闻消息，7月29日，听泉赏宝在直播中辟谣自己炒股亏光被父母拉黑，他表示自己只是直播中跟粉丝开玩笑，希望媒体实事求是报道。据新黄河报道，听泉赏宝在直播中表示自己是一名娱乐主播，自己和父母的关系很好：“我父母生我养我难道对我不好吗？”&nbsp;</p>\n  <p>“听泉鉴宝”，后改名“听泉赏宝”，本名丁祥翔，鉴宝博主。因其丰富的文物知识以及妙趣横生的直播风格而走红网络，他在直播中频频抛梗、整活，宛若一出大型的鉴宝脱口秀。2024年1月初，“听泉赏宝”粉丝尚不足300万，随后不到一个月粉丝量翻倍，在2月中旬突破600万，在此后不到半年内时间内，该账号涨粉近1500万。目前，“听泉赏宝”抖音粉丝3465.7万。（中国蓝新闻、第一财经）</p>\n  <p><strong>商务部新闻发言人就美国联邦通信委员会将外国电力逆变器和先进机器人设备列入“覆盖清单”事答记者问</strong></p>\n  <p>36氪获悉，据商务部消息，有记者问：美东时间7月28日，美国联邦通信委员会（FCC）宣布，将外国生产的电力逆变器和先进机器人设备列入“覆盖清单”，相关新型号产品将无法获得FCC认证授权，不得进入美市场销售。请问商务部对此有何评论？答：我们注意到有关情况。美国联邦通信委员会相关措施表面上打着“非歧视”的旗号，实质上歧视性对待和打压中国企业和产品。这已不是美国联邦通信委员会第一次采取类似措施，此前其已多次对其他中国商品实施限制。一段时间以来，美国联邦通信委员会无视中方反复交涉和克制态度，持续出台、不断升级限制措施，严重损害中方正当贸易利益，严重破坏中美经贸稳定局面，严重扰乱全球产业链供应链稳定，中方对此坚决反对。机器人、电力逆变器均是正常的国际商品，包括美国在内的各方都从贸易中获益，美方泛化国家安全概念，不顾中美两国业界强烈呼声，动用行政力量，人为干扰企业间正常商业交易和贸易往来，持续推进“脱钩断链”，这种做法损人不利己，是典型的市场扭曲和单边霸凌行为。中方敦促美方立即撤销有关措施，停止错误做法。如果美方一意孤行，中方将坚决予以反制，维护自身正当权益。</p>\n  <p><strong>SK集团会长崔泰源买入3620股SK海力士股票</strong></p>\n  <p>7月30日消息，交易所文件显示，SK集团会长崔泰源买入3620股SK海力士股票。按今日SK海力士收盘价920美元计算，价值约合331万美元。（界面新闻）</p>\n  <p><strong>富途一客户涉诈1.25亿港元被冻结</strong></p>\n  <p>7月30日，据香港证监会网站，香港证监会向富途证券国际（香港）有限公司（富途）发出限制通知书，禁止其处理或处置由某实体持有的客户帐户内的资产，以125,247,000港元为限。该实体涉嫌参与一项欺诈计划，旨在营造首次公开招股股份需求的虚假或非真实表象。富途并非香港证监会的调查对象，而该限制通知书亦不会影响富途或其其他客户。</p>\n  <p>该限制通知书禁止富途在未有事先获得香港证监会的书面同意的情况下，以任何方式处置或处理、辅助、怂使或促致另一人以任何方式处置或处理该等客户帐户内的任何资产，以该通知书所载的款额为限。若富途接获任何与受限制资产有关的指示，亦须立即通知香港证监会。香港证监会认为，为维护投资大众的利益及公众利益，发出有关限制通知书是可取的。香港证监会的调查仍在进行中。（界面新闻）</p>\n  <p><strong>中国成功发射通信技术试验卫星二十七号A/B星</strong></p>\n  <p>7月30日，中国在太原卫星发射中心使用长征六号改运载火箭，成功将通信技术试验卫星二十七号A/B星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。该卫星主要用于卫星通信、广播电视、数据传输等业务，并开展相关技术试验验证。（央视新闻）</p>\n  <p><strong>月之暗面变更为股份公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，北京月之暗面科技有限公司发生工商变更，企业名称变更为北京月之暗面科技股份有限公司。该公司成立于2023年4月，法定代表人为杨植麟，注册资本约152.4万人民币，经营范围含软件开发、人工智能基础软件开发、人工智能应用软件开发等。</p>\n  <p><strong>国内品牌金饰价格集体上涨</strong></p>\n  <p>7月30日，国内品牌金饰价格集体上涨，周生生足金饰品报1239元/克，单日涨18元；老庙黄金足金饰品报1236元/克，单日上涨14元；老凤祥足金饰品报1239元/克，单日上涨18元。（界面新闻）</p>\n  <p><strong>新易盛股价再度出现剧烈波动，公司回应：内外部经营环境未出现重大变化</strong></p>\n  <p>7月30日，光通信板块延续调整态势，新易盛股价再度出现剧烈波动。从新易盛方面获悉，目前公司生产经营活动有序开展，内外部经营环境未出现重大变化，不存在应披露而未披露的重大事项。（央广网）</p>\n  <p><strong>京东与七腾机器人达成战略合作</strong></p>\n  <p>36氪获悉，据京东物流黑板报，京东与特种机器人企业七腾机器人达成战略合作，双方聚焦能源石化、煤炭矿山、电力基建、应急安防、轨道交通等场景的机器人应用，推动七腾机器人全系列产品规模落地与普及。七腾机器人还与京东服务达成深度合作，京东服务将为七腾机器人提供售后服务。</p>\n  <p><strong>高通9月1日起上调芯片价格，涨幅达到两位数</strong></p>\n  <p>在高通业绩电话会议上，CEO安蒙透露，高通计划自9月1日起上调产品价格，涨幅达两位数，以此推动利润率回归历史水平。他称，涨价动因来自全产业链成本上行，并非仅受内存芯片涨价影响。安蒙表示，公司将逐一与各客户开展定价谈判，“成本与定价阶段性错位，造成毛利率短期小幅下滑。（财联社）</p>\n  <p><strong>奈飞拟斥资2亿美元获得2027年女足世界杯转播权</strong></p>\n  <p>当地时间7月29日，据知情人士透露，奈飞公司为获得明年国际足联（FIFA）女足世界杯的转播权，将支付2亿美元。（界面新闻）</p>\n  <p><strong>韩股创纪录的重挫，全球投资者却未进场抄底</strong></p>\n  <p>7月创纪录的暴跌33%，让Kospi指数的估值降至史上最低，韩国股市彷彿呈现明显的逢低承接信号。但百达资产管理、Robeco和瀚亚投资等全球投资者却未重新进场。对他们而言，韩股异常剧烈的波动仍让人吃不消。这些基金迟迟不愿进场，凸显了波动性已成为韩股的鲜明特征；这主要是市场资金高度集中三星电子和SK海力士及与两者挂钩的杠杆ETF所引发。牛市期间，市场对这项风险视而不见；如今，投资人则要求更高的安全边际，才愿意增加持股。（新浪财经）</p>\n  <p><strong>美国众议院能源委员会要求参观xAI数据中心以调查污染情况</strong></p>\n  <p>美国众议院能源与商业委员会首席民主党议员已致信SpaceX首席执行官埃隆・马斯克，要求参观其xAI位于田纳西州孟菲斯市内及周边的数据中心与电站。新泽西州民主党众议员弗兰克・帕隆在7月29日致马斯克的信函中写道：“美国民众忧心，数据中心以及科技巨头大举扩张人工智能，会给社区、就业、房产价值与长远发展带来何种影响。电价飞涨、电网负荷紧张，洁净空气与水源遭受污染，持续噪音正损害居民健康，不断消耗民众的耐心。”（新浪财经）</p>\n  <p><strong>OpenAI首席执行官奥尔特曼本周将会见白宫幕僚长，AI框架截止日期临近</strong></p>\n  <p>OpenAI首席执行官山姆·奥尔特曼7月29日向媒体表示，他已审阅了落实特朗普总统关于人工智能行政命令的拟议框架，并将在本周访问华盛顿期间会见白宫幕僚长苏西·怀尔斯。自特朗普6月签署备受期待的AI行政命令以来，本届政府在AI监管方面采取了更加积极的角色。该命令要求AI企业在模型全面发布前自愿向政府提供模型以评估其能力，但具体细节规定较少。特朗普给予联邦机构60天时间制定框架，以落实这些评估工作。奥尔特曼的华盛顿之行恰逢8月1日这一快速临近的最后期限。他并非本周唯一与国会议员会面的科技企业高管。英伟达首席执行官黄仁勋也正在国会山讨论开放模型和“美国在AI领域的领导地位”。（新浪财经）</p>\n  <p><strong>特斯拉全球第1000万辆电动车下线</strong></p>\n  <p>36氪获悉，特斯拉方面宣布，特斯拉全球第1000万辆电动车下线。</p>\n  <p><strong>韩国电信公司因数据泄露事件被罚款539亿韩元</strong></p>\n  <p>韩国隐私监管机构7月30日表示，已对无线运营商韩国电信公司（KT）处以539亿韩元（约合3740万美元）的罚款，原因是该公司发生了一起重大数据泄露事件，影响超过1.6万名用户。韩国个人信息保护委员会还责令KT就通过未经授权的移动基站入侵公司无线网络的行为采取纠正措施。（新浪财经）</p>\n  <p><strong>日本半导体重镇遭遇强震，多家半导体厂商受日本地震影响</strong></p>\n  <p>当地时间7月28日16时27分（北京时间15时27分）许，日本熊本县发生7.1级地震，辖区内观测到最大震度7（日本震度分级最高等级）。熊本县是日本的半导体重地，集聚了晶圆厂、设备公司、材料及零部件生产商等众多半导体产业链公司，除了台积电熊本厂和索尼CMOS图像传感器生产基地，东京电子、瑞萨电子、松下控股、三菱电机等均在此地设厂。综合日媒报道、公司公告，已有多家厂商受影响。（红星资本局）</p>\n  <p><strong>保时捷回应中国市场下滑32%，称在中国市场坚持“价值优先于销量</strong></p>\n  <p>7月29日，保时捷公布2026年上半年财报。在报告期内，销售收入较去年同期从181.57亿欧元下降至172.29亿欧元，同比下滑5.11%；营业利润从10.07亿欧元增长至13.48亿欧元，同比增长33.9%；销售回报率为7.8%，去年同期为5.5%。值得关注的是，今年上半年，保时捷在中国地区交付约1.45万辆汽车，同比下滑31.93%。</p>\n  <p>“中国市场整体环境依旧承压，豪华车细分市场竞争尤为激烈。保时捷在此市场始终坚持价值优先于销量的经营策略。”保时捷方面分析称，其未在华建厂、无本地产能约束，可灵活调整欧洲产能与生产计划，现阶段这一布局反而成为优势。（每日经济新闻）</p>\n  <p><strong>三星电子：预计三季度HBM4销售额将环比增长2倍以上</strong></p>\n  <p>三星电子7月30日预测，第三季度第六代高带宽内存（HBM4）销售额将环比增长2倍以上，下半年HBM4销售额将占HBM销售总额的60%以上。三星提出，下半年将把HBM全球市占率提升至与同步动态随机存取存储器（DRAM）相当的水平。今年第一季度，三星电子DRAM全球市占率为38%。（新浪财经）</p>\n  <p><strong>甲骨文、谷歌扩大合作伙伴关系</strong></p>\n  <p>甲骨文、谷歌扩大合作伙伴关系，甲骨文将推出谷歌的Gemini模型企业应用。（财联社）</p>\n  <p><strong>亚马逊旗下Zoox获美监管机构临时豁免，可商业部署至多5000辆自动驾驶出租车</strong></p>\n  <p>美国国家公路交通安全管理局（NHTSA）7月30日宣布，给予亚马逊旗下自动驾驶公司Zoox临时豁免权，允许其在两年内每年商业部署最多2500辆自动驾驶出租车，前提是必须遵守一套“强化且灵活的监管框架，该框架能随Zoox技术的进步而相应调整”。（界面新闻）</p>\n  <p><strong>美国第二季度实际GDP年化季率初值升1.5%</strong></p>\n  <p>美国第二季度实际GDP年化季率初值升1.5%，第一季度终值升2.1%。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>证监会同意沈鼓集团沪市主板IPO注册</strong></p>\n  <p>36氪获悉，证监会同意沈鼓集团股份有限公司首次公开发行股票并在沪市主板上市的注册申请。</p>\n  <p><strong>狂揽80亿美元估值，黑石推动三明治连锁店Jersey Mike's冲刺IPO</strong></p>\n  <p>去年年初，黑石集团斥资约60亿美元并承担相关债务，收购了Jersey Mike's Subs的多数股权。如今，18个月过去，Jersey Mike's作为一家私募控股非上市公司的短暂历程即将画上句号。该公司定于7月30日登陆纽约证券交易所估，值约为80亿美元。在此次发行中，该公司及现有投资者将出售最多10.9亿美元的股票，这将成为近年来美国规模最大的餐饮业IPO之一。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>苹果：第三季度营收1094.17亿美元，同比增长16.4%</strong></p>\n  <p>36氪获悉，苹果发布2026财年第三季度财报，该季度营收1094.17亿美元，同比增长16.4%；净利润297.89亿美元，同比增长27.1%。</p>\n  <p><strong>宝马集团上半年税前利润40.45亿欧元</strong></p>\n  <p>36氪获悉，宝马集团7月30日公布财务数据显示，2026年上半年，宝马集团税前利润40.45亿欧元，税前利润率为6.5%。宝马集团在全球向客户交付BMW、MINI和Rolls-Royce品牌汽车1156727辆，并在欧洲和美国市场实现增长（欧洲：增长5.4%；美国：增长3.9%）。</p>\n  <p><strong>阿迪��斯第二季度营业利润低于预估</strong></p>\n  <p>7月30日，阿迪达斯公布第二季度营收67亿欧元，剔除汇率影响后增长14%，预估65.8亿欧元；阿迪达斯第二季度营业利润增长5%至5.74亿欧元，预估6.156亿欧元。（界面新闻）</p>\n  <p><strong>高通第三季度营收99.47亿美元，同比下降4%</strong></p>\n  <p>7月30日，高通公布第三季度营收99.47亿美元，同比下降4%；调整后每股收益2.21美元，同比下降20%。公司预计第四季度营收为97亿至105亿美元，预计第四季度调整后每股收益为2.05至2.25美元。（界面新闻）</p>\n  <p><strong>三星电子第二季度销售额171.50万亿韩元</strong></p>\n  <p>三星电子第二季度销售额171.50万亿韩元，第二季度营业利润89.49万亿韩元。第二季度净利润71.27万亿韩元，预估68.36万亿韩元。（财联社）</p>\n  <p><strong>LG新能源上半年营收14.1万亿韩元，同比增长10.5%</strong></p>\n  <p>7月30日，LG新能源发布2026年第二季度业绩报告：合并营收达7.6万亿韩元，环比增长15.3%；营业利润为1133亿韩元，营业利润率为1.5%。2026年上半年，公司累计营收14.1万亿韩元，同比增长10.5%，其中储能业务收入同比增长4.6倍，新签订单额超3万亿韩元，对总营收的贡献占比超20%。（界面新闻）</p>\n  <p><strong>雷诺集团上半年营收303亿欧元，同比增长9.5%</strong></p>\n  <p>7月30日，雷诺集团公布，2026上半年集团营收303亿欧元，同比增长9.5%，按固定汇率计算增长10.3%；净利润：7亿欧元；汽车业务自由现金流达6.53亿欧元。雷诺集团确认2026年财务预期：集团营业利润率约为集团营收的5.5%，汽车业务自由现金流约为10亿欧元。（界面新闻）</p>\n  <p><strong>VF威富集团：2027财年第一季度营收16.69亿美元，同比增长1%</strong></p>\n  <p>36氪获悉，VF威富集团近日发布了2027财年第一季度（截至2026年6月27日）的业绩报告，并上调全年营收预期（以下所有数据均已剔除Dickies业务）。公司营收16.69亿美元，同比增长1%（按固定汇率计算同比持平）。其中，大中华区业绩同比提升6%（按固定汇率计算增长1%），成为驱动集团亚太地区整体业务增长2%（按固定汇率计算下降1%）的核心动力。集团全球自营业务（DTC）同比增长6%（按固定汇率计算增长5%）。</p>\n  <p><strong>壳牌第二季度调整后利润98.4亿美元</strong></p>\n  <p>7月30日，壳牌公司发布2026年第二季度业绩公告。公司第二季度营收946.6亿美元，预估836.1亿美元；调整后利润98.4亿美元，预估为86.8亿美元；调整后每股收益1.76美元，预估为1.55美元。壳牌预计2026年第三季度公司调整后收益将净支出约5亿至7亿美元，2026年全年的现金资本支出将达到240亿至260亿美元。（界面新闻）</p>\n  <p><strong>东鹏饮料：上半年净利润同比增长20.72%，拟10派30元</strong></p>\n  <p>36氪获悉，东鹏饮料披露半年报，2026年上半年，公司实现营业收入124.43亿元，同比增长15.89%；归属于上市公司股东的净利润28.67亿元，同比增长20.72%；基本每股收益3.9949元。公司拟每10股派发现金红利30元（含税）。</p>\n  <p><strong>东兴证券：上半年净利润10.25亿元，同比增长25.13%</strong></p>\n  <p>36氪获悉，东兴证券披露半年报，2026年上半年，公司实现营业收入25.06亿元，同比增长11.4%；归属于母公司股东的净利润10.25亿元，同比增长25.13%；基本每股收益0.306元。</p>\n  <p><strong>科大智能：上半年净利润同比增长22.14%</strong></p>\n  <p>36氪获悉，科大智能披露半年报，2026年上半年，公司实现营业收入15.53亿元，同比增长15.95%；归属于上市公司股东的净利润9380.99万元，同比增长22.14%；基本每股收益0.12元。</p>\n  <p><strong>欧莱雅集团上半年销售额237.7亿欧元，同比增长6.8%</strong></p>\n  <p>7月30日，欧莱雅集团公布2026年上半年财报：销售额237.7亿欧元，同比增长6.8%，合并增长5.8%，调整后同比增长6.5%；毛利率提升10个基点，达到74.8%；营业利润率提升20个基点，达到21.3%；去除非经常性项目后的净利润达到39.596亿欧元，同比增长4.7%。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“Tiiny AI”完成数千万美元天使轮融资</strong></p>\n  <p>36氪获悉，据BV百度风投消息，Personal Agent OS公司“Tiiny AI”宣布完成数千万美元天使轮系列融资。本轮融资由顺为资本、经纬创投、锦秋基金、云启资本、戈壁—阿里巴巴香港创业者基金、BV百度风投、光源L2F基金联合参与。本轮融资后，Tiiny将加速Tiiny AI Pocket全球交付和TiinyOS多终端落地。</p>\n  <h2>酷产品</h2>\n  <p><strong>橡鹿机器人与海尔机器人达成战略合作</strong></p>\n  <p>36氪获悉，7月29日，橡鹿机器人宣布与海尔机器人达成战略合作，双方将围绕中餐烹饪生态与AI技术能力，共同研发全自动家庭AI烹饪机器人，实现从自动投料到智能翻炒全流程免动手操作。合作成果及橡鹿自研多模态AI烹饪基座、具身烹饪机器人\"现炒方舟\"将于8月在世界机器人大会（WRC）上正式亮相。</p>\n  <p>&nbsp;</p>\n  <p><strong>和我们同龄，却提前告别的人</strong></p>\n  <p>长大后慢慢发现，死亡不再只属于长辈与遥远的年龄。本该一起奔赴成年、打拼生活、慢慢变老的同龄人，有人停在了二十几岁、三十几岁，没能走完往后的人生。</p>\n  <p>中元节临近，我们想收集大家关于同龄人离世所有细碎、真实、无法释怀的回忆。如果你愿意，可以把Ta介绍给我们认识吗？你们有着怎样的故事？还记得你们的最后一面吗？所有的遗憾、错愕与思念，都可以好好说出来，欢迎扫描下方二维码参与我们的征集。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260731/v2_785b85ffff294747b2d9009ed787d0d1@5667365_oswg18985oswg354oswg356_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫描二维码参与征集</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-07-30T23:48:40+00:00", "fetched_at": "2026-07-31T02:24:08.443098+00:00", "fingerprint": "2aa95d7293cc4a92"}, {"source": "36氪 - 最新文章", "title": "中层消失，Token狂热退潮，硅谷工程师眼里的「AI创业下半场」", "url": "https://36kr.com/p/3918250549931394?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_9d3d000f10844662a54a670276214ec8@6314151_oswg1303745oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>所有人都在尝试建立关于AI的判断，但所有共识都在迅速过期。</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_506dc61c8f9b4d4d90a2abacbad65707@6314151_oswg560oswg900oswg30_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>访谈<strong>&nbsp;|</strong>&nbsp;巴芮 海风</p>\n  <p>文<strong>&nbsp;|</strong>&nbsp;海风 刘思洁</p>\n  <p>编辑<strong>&nbsp;|</strong>&nbsp;刘思洁</p>\n  <p>封面图源<strong> |</strong> 受访者拍摄<br /><br /><br />“野蛮生长的阶段已经过去了。”</p>\n  <p>这是身处硅谷AI创业一线的马培元最近最深的感受。</p>\n  <p>2021年12月，本科毕业后，他进入号称“美版知乎”的Quora，后来转到AI聊天机器人聚合平台Poe，担任资深AI工程师。2个月前，他又加入硅谷最热门的AI Agent创业公司之一Cognition。</p>\n  <p>2026年5月，这家成立不到三年的公司宣布完成超过10亿美元融资，估值升至260亿美元。8个月前，它的估值还是102亿美元。</p>\n  <p>除了工程师，马培元还有另一个身份——投资猎头（Venture Scout）。他替投资机构寻找值得下注的AI创业项目，每年拥有50万美元的投资额度。</p>\n  <p>毕业后的这四年多的时间里，他似乎始终行动得要比AI行业共识早，在“agent”这个词还没有被任何人讲清楚定义之前，他所在的团队已经悄悄立项。在Anthropic还是无名之辈时，他们就成了Claude最早的深度用户。他是团队里第一个AI认证工程师、第一个AI agent工程师，后来又把整个工程团队“洗脑”成了使用AI编程的AI Native团队。</p>\n  <p>这种认知和行动的超前，最有意思的印证发生在两周前，他在和“未来人类实验室”对谈时随口说出“people manager正在消亡”，没过多久就被腾讯、字节宣布取消中层的新闻坐实。</p>\n  <p><strong>变化发生得太快，在硅谷，要时刻与变化共处。</strong></p>\n  <p>在这篇稿子两次访谈的两周间隙里，马培元发现自己上一次讲的硅谷“追逐最贵最前沿模型”的逻辑，就开始站不住了。当下硅谷流行的做法是把多个便宜模型和顶尖模型“融合调度”使用。</p>\n  <p>和马培元聊了近5个小时，我们发现，他几乎一直在推翻昨天的自己，硅谷也一样。“我不能说所有的，但你可能说大于60%，一个月之后就可能又反着来了。”</p>\n  <p>过去几年，AI几乎改写了硅谷的所有默认规则：什么样的人更容易脱颖而出，什么样的组织更有竞争力，什么样的钱花得值。</p>\n  <p><strong>当然，这些所谓“正确答案”的判断，也在迅速失效。</strong>在AI领域，一年已经是很长的周期，很多判断可能在一个月内就被推翻。</p>\n  <p>以下，是马培元眼中十分当下的10个硅谷AI观察：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_974f8d6ef6ed441cbef61eb075f6af86@6314151_oswg34876oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">马培元</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_13de5e684d114228a9b92cb7925b66c6@6314151_oswg1788oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>硅谷需要什么样的人才？</strong><br />&nbsp;</h2>\n  <p>马培元的职业画像，高度契合了硅谷的AI公司最喜欢的人才样貌。他不是传统的计算机背景，没有得竞赛金牌，没有顶尖名校光环，甚至一度对计算机毫无兴趣，但过去四年，他从Quora的广告组一路做到Cognition的AI工程师，履历踩中了硅谷AI公司现在最想要的人才画像的每一个关键词。<strong>他的经历，既是一部个人成长史，也是一份行业招聘标准变化的样本。</strong></p>\n  <p><strong>观察1：通才碾压专才</strong></p>\n  <p>硅谷现在最抢手的人才画像，不是某个领域钻得最深的专家，而是<strong>“每一项都过得去、没有明显短板”的人——业内管这个叫polyglot talent，更通俗的话说叫“六边形战士”。</strong></p>\n  <p>2024年，Poe内部启动了一个当时还没人说得清定义的“agent”项目，组里挑中我这个新人的理由很直接：“既做过AI，也做过全栈开发和iOS”。当时组里其他人大多是传统机器学习、搜广推背景出身，他们的人不懂前端代码，而agent恰好需要能写前端界面。公司原本负责AI提示词工程的人离职后，团队里再没有人能补上这个缺口，那正好，反正我学得快，我既做这个agent提示词工程，也做这个它的前端写代码之类的。</p>\n  <p>这套“什么都会一点”的能力组合，后来变成了我找工作时最值钱的资本。我是你给我一个什么新的领域，我可以从两周之内学得差不多。而这正是早期创业公司要的人。</p>\n  <p><strong>观察2：AI原生技能，可以在短时间内碾压资历年限</strong><br />&nbsp;</p>\n  <p>AI工具的使用能力，可以直接碾压传统意义上靠年限堆出来的资历。</p>\n  <p>我从Quora广告组转去iOS组的时候，理由是“想迈出舒适圈”，但此时我对iOS一窍不通，是彻头彻尾的“0年经验”。我当时没有选择慢慢补课，而是把GPT-4当成了自己的搭档。当时我周围的人都是非常资深的iOS工程师，他们可能不信AI。我iOS不会写，Swift代码不会写，于是我就疯狂地用AI帮我写代码。</p>\n  <p><strong>结果是，我这个刚入行三四个月的新人，产出速度追平甚至超过了身边浸淫多年的资深工程师，两年内就做到了资深职位。这在传统晋升体系里，几乎是不可能的速度。</strong>此前，在Facebook可能至少要4到6年，你才能变成资深工程师。谷歌有些人可能一辈子都不会升级到资深工程师。</p>\n  <p>我在Cognition就遇到过一位19岁的面试官。一开始我还有点沮丧，一个26岁的人被19岁的人“拷问”，很多问题我都答不上来。后来我意识到，这恰恰是一个迹象，说明这家公司确实能不拘⼀格降⼈才，且年龄不再是硅谷评判人才的标准。</p>\n  <p><strong>观察3：招聘标准被彻底重写，AI公司不用同一套模板面试</strong></p>\n  <p>我在Quora离职前，认真面了将近20家公司，算上打过电话的有30到40家。最多的时候，我一周被30多个猎头找上门来。</p>\n  <p>面试了这么多家公司，我发现，当下AI公司招人没有一个统一的面试模板。</p>\n  <p><strong>但有几个很明显的变化，LeetCode式算法题的重要性在下降，关于AI系统设计的最佳答案每个月都在改变。</strong></p>\n  <p>面试结构也在变化。在线笔试+work trial成了一种新的组合。work trial是一种非常短的“试用期面试”。有的3小时，有的5小时，最长也就一两天。我遇到的一次面试，就是直接给我一个代码库，让我用任何工具，包括AI，去解决一个实际问题。做完之后，还要展示思路和成果。整个过程已经非常接近真实工作。</p>\n  <p>更有意思的是，对AI使用的考察本身也被拆成两种模式。有些轮次要求必须用AI，看你怎么“by code”；但也有轮次明确禁止使用AI，比如debug，考的是在没有AI辅助加成下，你能不能找出错误，本质上是在测试个人实际的软件⼯程⽔平和品味如何。</p>\n  <p>面试本身也多种多样。比如，有的公司会让我做商业分析，判断他们应该收购哪个行业。</p>\n  <p>行为面试（behavior round）也变了。它不再是“个人最⼤的缺点和优点”“跟同事有冲突怎么解决”等传统问题，而是拉长时间线，去看一个人的成长轨迹，从高中到大学，从实习到工作，一路往下追，看你的“人生斜率”，判断你是不是⼀个能够指数型增⻓的⼈。</p>\n  <p>没有标准答案带来的一个意外好处是：没人能靠背题拿到offer。连我在Cognition的内推人都直接告诉我：“你别准备了，我觉得没什么可准备的。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_20efe3af64e74286bacc6d544b2d7b68@6314151_oswg2308oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>AI正在重构组织结构</strong></h2>\n  <p><strong>在硅谷，最厉害的那批人，从来不属于某一家公司，只属于“那个时代最厉害的公司”。</strong>二十年前是谷歌，十年前是Uber和Robinhood，五年前是Coinbase，现在是AI公司，<strong>硅谷是“流水的银盘，铁打的兵”</strong>。这批被新标准筛出来的人才，更会因使命感，而不是“待遇”留下。这些汇聚最厉害人的组织，也在AI的重塑下，发生着巨变。</p>\n  <p><strong>观察4：对“AI原生”太过渴求</strong></p>\n  <p>硅谷公司对AI原生（AI native）的渴求程度远远⼤于我的想象。我面试的公司大多是A轮、B轮，也有一些种子轮。一个很高频的问题是：你用什么AI工具？我通常直接把自己写的博客丢过去，对方基本上都会“目瞪口呆”。</p>\n  <p>他们会说，不只是想让我做AI应用开发，更希望我去推动公司内部的AI转型，让团队变得更AI原生。很多公司其实已经在做AI产品，但员工还没有建立自己的AI工作流。<strong>而且，他们也很需要每天都刷很久推特、及时分享⼀些新奇AI发现或提效技巧的⼈。</strong></p>\n  <p>这件事对我来说有点反直觉。我过去的一些“爱好”，比如每天折腾Claude Code等新工具、在Slack（一款办公软件）里分享AI用法，反而变成了一种新的组织角色。</p>\n  <p>之前在Quora时，我成功地让整个⼯程团队都⽤上了Claude Code。办公室每遇到⼀个⼯程师，我都会问，你有没有⽤AI来编程？我记得办公室⾥有一个做网络安全的工程师，一开始很抗拒，觉得用AI写代码风险太高。我后来让他换个思路，不写代码，只用AI读代码、理解代码库、做数据分析。后来，他也真的用起来了。</p>\n  <p><strong>观察5：“更好地去使⽤AI”，实质是个组织转型问题</strong></p>\n  <p>在Cognition做AI相关工作时，我越来越发现一个事实：更好地去使⽤AI，可能已经不是⼀个纯⼯程问题，而是⼀个组织架构上的转型问题。</p>\n  <p>举个例子。传统组织架构的互联网公司，一个Bug从发现到修复，往往要经过需求评估、工程排期、开发、测试、上线等好几个环节。真正用AI写代码可能只需要两三个小时，但整个流程走下来，经常要一个月。</p>\n  <p>以前这样的流程是合理的。因为修一个Bug，一个工程师可能要花三五天，流程的价值在于协调不同团队、分配资源。但AI把这个时间压缩了。</p>\n  <p>现在，我们用Cognition推出的Devin这样的AI软件工程师产品，两三个小时就能完成过去几天的工作。在Cognition，我们甚至可以用Devin找到负责这个Bug的人，再让Devin协助他完成修复，中间很多协调和流转环节都可以省掉，没有任何冗余。<strong>其实是AI在倒逼整个组织架构的转型。</strong></p>\n  <p><strong>观察6：People manager正在消亡，管理者必须自己会写代码</strong></p>\n  <p>所谓people manager就是⼯程经理（engineering manager）。在美国，近⼏年来流⾏的⼀个观点是，你作为管理者就要做好管理，更多负责团队协调、组织沟通，照顾员工情绪、提供成长支持，工程能⼒不用特别强。</p>\n  <p>但进到Cognition，我发现整个组织架构⾮常扁平化。比如，我直接汇报的对象甚至是CPO，也就是联合创始人之一。他不会细致关心你的个人成长，角色更像是确定大方向。甚⾄可以这么说，Cognition现在60多人的工程团队里，真正的people manager只有一个人，其他的包括CPO在内，都是“既管人、也写代码的”。这和我之前在Quora的体验完全不同。当时，一个manager可能要管五六个工程师。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_00af9181ee2b4f338ccd830552194024@6314151_oswg177974oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Cognition团队集体穿上红衣服为一位日常爱穿红色衣服的同事庆生</p>\n  <p>我觉得这可能是AI带来的组织架构变化。<strong>我观察到，任何⼀个朝⽓蓬勃的AI创业公司，其实都是这样，⼏乎没有只负责管⼈的经理——如果他管⼈，他⼀定技术也很强。</strong></p>\n  <p>这个判断不仅仅发生在硅谷，在间隔两周的两次访谈之间，国内大厂腾讯、字节也先后宣布取消中层。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_e350f8d1e6374f53a2fbdfcd7987fd6f@6314151_oswg2380oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>AI时代，任何判断都会很快被推翻</strong></h2>\n  <p>马培元观察到的变化，不只停留在组织层面。更宏观的行业判断：“在硅谷AI公司内部，什么样的Token支出算合理，什么样的模型才是好模型？”同样在以肉眼可见的速度被推翻。这一次，连他在第一次采访时说过的判断，都没能扛过两周。</p>\n  <p><strong>硅谷的AI行业本身也在以月甚至以日为单位自我推翻，没有什么判断能保鲜太久。</strong></p>\n  <p><strong>观察7：Token Maxxing出现了分化，大公司开始重新关心效率</strong></p>\n  <p>今年初，硅谷一度流行“Token-Maxxing”。Meta等公司一度甚至做过Token使用排行榜。谁用得最多，谁就是“AI原生”的代表。我觉得这⾸先就是一件很蠢的事情——AI token的使⽤量跟⼯程师的效率不能画等号。</p>\n  <p>Google、Meta的朋友还跟我说，他们当时都在搞“AI大跃进”。公司会专门办“AI Week”，所有人都要停下手里的工作，去写AI Skills，把自己的Skill包装得天花乱坠。</p>\n  <p>一开始，几乎所有公司都是这个思路：先让大家尽可能多地用AI，看看到底能用到什么程度。</p>\n  <p><strong>但一旦变成公开排名，人的行为就会被扭曲。</strong>工程师会为了“用得多”而用，甚至出现一些很荒诞的情况，比如让AI每晚定时乱跑、空跑一些没有意义的任务，只是为了增加使用量。这其实和用GPA去衡量学生能力一样，单一指标很容易失真。</p>\n  <p>后来很多高层也开始意识到这个问题。更具体的是，他们被账单吓到了。比如Uber，2026年全年的AI专项预算，前四个月基本就烧完了。很多大公司开始重新限制Token用量。董事会和CEO会开始问，这个token⽤量真的值吗？它真的能让我们提升这么多效率吗？⼀个亿美⾦花下去，它真的带来了⼀个亿的产出吗？</p>\n  <p>这场焦虑很快被Cognition做成了一份可以明码标价的商业答卷。6月4日，Cognition发布了“AI生产力保证”——如果企业客户使用Devin（Cognition推出的AI软件工程师产品）后，效率提升没有达到承诺水平，最高赔偿1000万美金。做这份研究的，是我一位拿过三块国际信息学奥赛金牌的同事，他调研了233个真实客户案例，随机抽取客户和Devin的对话，问客户“如果不用Devin，这段工作纯人工要花多久”，再用这些数据训练出一套预测系统，把每一次Devin对话，直接转化成“等效工程师小时数”，用工程师的时薪反推这套产品到底省下了多少。</p>\n  <p>但很多YC公司，可能还会继续“token maxxing”的模式，因为他们有很多政策优惠的免费token额度，再加上规模小，可能只有三个人，没有什么AI治理的问题，管理者能直接看到每个人到底是不是在用AI摸鱼。</p>\n  <p><strong>观察8：模型崇拜本身也在被推翻</strong></p>\n  <p>就在这篇稿子两次访谈的两周间隙里，我发现自己上一次讲的道理，已经开始不太对了。</p>\n  <p>两周前，我还在谈论哪个模型是当下最前沿的。现在，Cognition内部刚刚发布了一个还没有中文译名的功能，代号叫fusion mode——把多个便宜模型和顶尖模型融合调度使用，而不是无脑调用最贵的那一个。<strong>你不会天天开你的保时捷去买菜吧，你应该去开你的本田或者便宜的车去买菜。这两周模型迭代的速度也超出了我的想象，连谁是“number one”这件事，都不敢说得太满。</strong></p>\n  <p>我不能说所有的，但你可能说大于60%，很多可能是一个月之后就可能又是反着来的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_dca238e1d7d74a45aeceaa54ac7b48c2@6314151_oswg2613oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>AI时代，“机会”藏在非共识里</strong></h2>\n  <p><strong>任何技术浪潮演进的规律都是如此，旧共识破灭，往往正是新范式建立的开始。</strong></p>\n  <p>当市场告别了对单模型和算力烧钱的盲目崇拜，围绕“如何让AI稳定可控地落地”以及“如何啃下大模型啃不动硬骨头”的需求便爆发出来。兼具工程师与投资猎头双重视角的马培元注意到，一批不依赖“大模型神话”、专注于解决真实世界复杂痛点的新生意，正在硅谷的非共识中悄然萌芽。</p>\n  <p><strong>观察9：新的AI infra正在出现</strong></p>\n  <p>围绕“Token-Maxxing”，其实已经出现了一批新的创业公司。他们专门观测、监控团队的AI使用情况，分析哪里在浪费token。</p>\n  <p>这背后更深一层的问题在于，AI agent本身是脆弱的。一个prompt的微小变化，就可能导致agent的表现变差了。于是新的AI&nbsp;infra（基础设施）开始出现，比如sandbox（沙盒环境），用来隔离agent运行，避免它直接接触敏感系统，比如银行账号或生产环境数据。</p>\n  <p>与此同时，“观测”本身也变得更复杂。传统系统只要报错就能被监控，但agent不会“报错”。它可以正常运行，却可能在输出层面出现严重问题，比如带有偏见、歧视，或者让用户产生明显负面体验。这就需要⼀套新的软件，去监测agent什么时候“脑⼦坏了”。</p>\n  <p><strong>观察10：“不可训练的东西”，正在成为新生意</strong></p>\n  <p>投资圈里有一种越来越流行的判断：vertical agent（垂直领域AI代理）已经失去投资价值。但我并不完全同意。</p>\n  <p>硅谷投资者郭睿（Sarah Guo）提出过一个概念——“the untrainable”，也就是“不可训练的东西”。核心观点是在很多垂直行业，语言模型永远无法完全自动化。因为垂直行业里充满大量无法被抽象掉的复杂流程，而且这些流程往往需要⼈⼒来不断地⼀个个解决。</p>\n  <p>比如美国报税，50个州有50个税，要一一慢慢对接；法律领域也是如此，移民法、民法、商法，各自体系复杂，AI agent没法一步到位。</p>\n  <p><strong>垂直AI agent公司的价值，就在于不断和客户、FDE（前沿部署工程师）的互动中发现更多真实的痛点。这些东西会被烙印在公司的产品⾥，这也是其他⼤公司没有办法训练、不能被通⽤模型吃掉的东西。</strong></p>\n  <p>所以，我倾向于认为vertical agent依然有投资价值。只是它们带来的可能不是1000倍的回报，而更可能是20倍、50倍，甚至100倍这种比较稳、比较小的回报。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_8eaa0c108b43449d98ae0a32822c1af3@6314151_oswg162964oswg1024oswg273_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_65a7d01a99724bd79ad12ec5224a8e84@6314151_oswg34461oswg1080oswg287_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_a6c79a6bca804c778c79b70e6259ae48@6314151_oswg2783oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>身处AI浪潮中，你感受到的最大变化是？</strong></p>\n  <p><strong>欢迎在评论区分享你的看法~</strong></p>", "category": "tech", "published_at": "2026-07-31T00:30:54+00:00", "fetched_at": "2026-07-31T02:24:08.443090+00:00", "fingerprint": "dd71e546909f62c6"}, {"source": "36氪 - 最新文章", "title": "菜鸟CTO李强创业做Physical AI平台，获云启、商汤超亿元种子轮融资｜硬氪首发", "url": "https://36kr.com/p/3917874427555457?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，Physical AI平台公司「昆腾动力（Quantum Dynamics）」近日完成超亿元种子轮融资，本轮由云启资本、商汤科技联合投资。资金将主要用于Physical AI核心技术研发、人才梯队建设及全球化市场拓展，加速其面向物理世界的智能系统从底层模型到场景化落地的全链路构建。多维资本参与项目孵化与团队组建。</p>\n  <p>昆腾动力成立于2026年上半年，公司聚焦AI与真实物理世界的深度融合，自研可跨多场景复用的通用智能系统技术，面向全行业的Physical AI底层平台。</p>\n  <p>目前具身智能赛道的创始人多分为几类，一类是一类是自动驾驶背景出身，长于系统集成与工程化落地；另一类源于Neo&nbsp;Lab，具备前沿的具身智能技术视角。而昆腾动力的创始人李强则属于第三类，此前深耕物流商业化场景，兼具AI技术理解力与全球化业务操盘经验。</p>\n  <p>公司创始人兼CEO李强在阿里巴巴集团任职17年，于淘宝天猫、菜鸟、国际化业务及无人车四个板块中，他均承担了从0到1的体系搭建与运营管理工作。他曾任菜鸟集团CTO、阿里巴巴国际数字商业板块CTO，管理分布全球的数千人研发团队；同时兼任菜鸟无人车总经理，统筹自动驾驶技术的研发与商业化推进。其团队曾与海外200个国家的邮政系统开展深度业务对接，积累了全球物流履约的一线经验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_25b7577f8e8b4791b8d5a228bd5dd1c9@6022551_oswg241686oswg1600oswg1066_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">昆腾动力创始人兼CEO李强（图源/企业）</p>\n  <p>核心团队构成覆盖了前沿研究、模型研发、硬件工程到全球化商业落地的全部关键环节，具备从技术突破到价值交付的完整闭环能力。这种团队复合基因，也让昆腾动力在成立之初就选择了一条差异化路线。</p>\n  <p>“我们不需要等一个完美的通用模型出现再去找场景，而是先找到能把现有技术转化为客户价值的切入点，率先跑通商业化。”昆腾动力创始人兼CEO李强说。</p>\n  <p>事实上，今年以来，具身智能赛道正在经历一场从“炫技”到“实干”的集体转向。刚刚结束的WAIC 2026大会上，翻跟头、跳舞的Demo展台人气依然高涨，而吸引人流驻足的，还有那些将汽车工厂、物流分拣线搬进现场的实景演示。</p>\n  <p>业界共识在形成，Physical AI已成为继大语言模型后的下一个主战场，竞赛的胜负手正从模型参数大小迈向真实数据厚度。</p>\n  <p>IDC报告数据显示，2025年，中国具身智能机器人用户支出规模预计超过14亿美元，到2030年将飙升至770亿美元，年均复合增长率达94%。钱涌入的速度越快，一个结构性问题越发凸显：物理世界的数据，无法像文本和图像那样通过爬虫批量获取。</p>\n  <p>这意味着，谁先拥有规模化部署真机的能力，谁就拥有了数据采集的优先权。这也是昆腾动力切入产业的底层逻辑：先扎进物流仓库，靠真机部署积累独家真实数据，再反向打磨底层的世界动作模型。</p>\n  <p>一个中型仓库里，一台拣货机器人每天完成数万次抓取、放置、扫描、贴标动作，覆盖从刚性箱体到柔性包裹、从标准尺寸到异形SKU的几乎所有物理操作类型。每一次动作的成功或失败都是一个无需人工标注的清晰信号。这些都是物流网络里用工缺口最大、人力成本占比最高的环节，也是传统自动化迟迟啃不下来的硬骨头，恰恰需要模型驱动的方案来实现规模化突破。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_e944a763d37f489390052bca0a0c15e5@6022551_oswg1778673oswg2217oswg887_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">瞄准物流仓储场景，昆腾动力搭建数据闭环体系（图源/企业）</p>\n  <p>在数据采集和利用效率上，昆腾动力搭建了一套数据闭环体系。其端侧机器人本体上运行着轻量级算法，能够实时识别高价值数据片段，当中包括需要人工干预的场景、模型预测置信度低的“近似失败”状态、以及反复尝试均未成功的困难案例。这些数据会被自动打标、回传，进入训练管道。</p>\n  <p>同时，针对需要人工干预数据处理部分，其算法平台会仅截取干预操作中最具学习价值的片段，剔除冗余部分，以确保每一帧进入训练集的数据都贡献有效信息。</p>\n  <p>这套机制让昆腾动力的数据管道具备了两个鲜明特征。一是规模效应，每新增一个部署仓库就新增一个数据来源；二是独家数据的生产，随着数据越厚，模型的泛化能力和成功率就越高，后续接入新客户、新场景的成本和周期就越低。</p>\n  <p>当真实场景数据达到足够密度，为昆腾动力自研基础模型提供了现实条件，其目标并非打造一个单点能力模型，而是构建一套能从真实部署中持续进化的具身智能系统。这套系统平台由六个技术模块协同构成，覆盖数据归集、模型更新、集群协同进化的完整Physical AI体系，将依托线下真实产业场景完成验证打磨。</p>\n  <p>首先是具身原生的World-Action Model（世界动作模型）。它区别于常见的视频预测模型，通过联合建模视觉、动作、本体状态与触觉信号，模型能够学习“一次操作会如何改变物理世界”，并在此过程中满足机器人实时控制的工程要求。</p>\n  <p>同时，基于昆腾动力已构建的数据闭环体系，以真机作业和人类操作数据为主要原料，可以将物流场景中的原始日志自动加工为携带任务阶段、失败原因、恢复动作及业务结果的高价值训练样本，支撑秒级检索、自动清洗标注和天级模型迭代。配合Human-in-the-Loop（HITL ，人为介入AI回路）机制，可判断机器人的人工介入时机，并将每一次干预转化为训练数据，使单人可管理的机器人数量持续提升。</p>\n  <p>执行层面，系统部署了轻量级World Model Corrector（世界模型校正），用于实时监控动作执行偏差，在操作失效前及时触发纠偏、重规划和重试，以此提高真实场景中的任务成功率。面对新客户和新仓库，系统无需重新训练全模型权重，而是通过Test-Time Training（测试时训练）、少样本示范和历史经验复用，使机器人快速适应不同的货物、货架、光照和流程变化。</p>\n  <p>最终，所有具身机器人组成一支持续学习与自我进化的集群。每台设备产生的成功、失败、干预和恢复经验，经由离线强化学习、偏好优化、仿真训练与真机验证的多重流程，持续更新至整个机群中。</p>\n  <p>昆腾动力将其落地节奏分为两个阶段。2026年将重点瞄准B2C、中小B电商仓库，聚焦补货上架、货品拣选、包裹打包三大人力密集工序，优先落地美妆、医药类 SKU 规整��仓储环境，采用人机协同混产模式完成规模化试点。到2027年，业务边界将进一步向复杂快递网点延伸，遵循“物流仓储到工业产线、零售货架、医药分拣，到商用服务，最终进入居家民生服务”的拓展路径，拓宽Physical AI的落地场景边界。</p>\n  <p>物理AI的竞赛，其落脚点从来不只是技术Demo的惊艳程度，而是机器人能否在真实世界中稳定地完成作业。昆腾动力选择的是一条并不性感的路径，先让数千台机器人在仓库里跑起来。它要证明的不只是一家公司的商业可行性，更是物理AI“从垂直场景切入，逐步走向通用”的路线可行性。</p>\n  <p><strong>以下为硬氪与昆腾动力创始人兼CEO李强的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：昆腾选择以物流仓库作为天然训练场，靠真机部署自建数据飞轮，先落地再打磨底层模型。能否拆解这套 “先场景后底座” 分步战略的时间节点与取舍逻辑？这套路径长期来看能形成哪些差异化壁垒？</strong></p>\n  <p><strong>李强：</strong>我们团队深耕物流行业多年，既清楚具身智能当下的技术边界，也吃透了物流庞大、复杂的真实作业环境。基于当前技术水平，我们找到了一条更务实的落地路径：依靠后训练方案，就能先在部分仓储场景实现规模化商用。</p>\n  <p>这么做最直接的好处，就是可以一边落地产生营收、一边持续积累独家真机数据。这些数据完全贴合真实物理世界分布，不只有抓取成功的标准动作轨迹，还收录了大量抓取偏差、操作失误等负样本，数据丰富度和真实性远高于仿真、动捕数据集。相同模型架构下，依托更高质量的真实作业数据，模型泛化能力自然会拉开差距。</p>\n  <p>长远来看，赛道竞争的核心早晚落在数据采集效率与单位数据成本上。谁能用更低成本持续产出海量真机数据，谁就能建立稳固优势。这一点和Claude、特斯拉FSD的逻辑相通：部署的终端规模越大，沉淀的交互、驾驶数据越多，整套集群通过强化学习、车队迭代优化后的整体性能就越强。我们大规模落地仓储机器人，正是为了打通真机RL（强化学习）后训练、整机群持续进化的完整闭环。</p>\n  <p><strong>硬氪：昆腾规划从电商仓库逐步拓展到多元场景，但不同环境的物理交互逻辑、作业限制差异巨大。团队会从物流数据沉淀出哪些通用原子能力，支撑跨场景迁移？针对家庭、康养等非标、商业收益偏弱的场景，当前模型与少样本适配框架还有哪些核心难点待突破？</strong></p>\n  <p><strong>李强：</strong>我们搭建了三套分层演进路径，全部依托仓储场景完成能力沉淀，后续可直接复用拓展至各类新场景。</p>\n  <p>在移动操作层面，我们遵循循序渐进的打磨节奏：先落地台式固定机械臂方案，再实现人形机器人静态作业，接着攻克全身协同移动操作，最终达成人流开放环境下稳定的动态作业能力。</p>\n  <p>针对操作精度，我们持续分层迭代控制标准，从基础抓取精度起步，一步步打磨至毫米级，最终向亚毫米级精细操作迈进。</p>\n  <p>同时我们也会不断扩充标准化原子动作储备，吃透仓储场景里拣放、面单粘贴、缠绕打包等各类实操动作，将成熟交互能力完整沉淀下来。物流本身就是打磨上述底层能力的绝佳试验场，向外拓展新场景时，这些积累都能直接复用。</p>\n  <p>进入居家、康养场景，我们会采取由简入繁的落地思路，先落地物品传递、收纳这类低风险基础任务，再逐步迭代近距离人机精细交互功能。</p>\n  <p>现阶段这套体系切入居家康养赛道，仍有几处关键难题需要解决。</p>\n  <p>一是小样本学习能力不足，家庭环境物品、使用需求高度个性化，亟需更强的上下文学习能力，让机器人仅凭少量示范就能掌握全新任务。</p>\n  <p>&nbsp;其次是全域安全体系有待完善，要优化机身、电池等硬件材质防护，在模型与控制系统层面搭建多重防护机制，规避人机互动过程中的磕碰误伤风险。</p>\n  <p>此外是自适应力触觉控制仍有提升空间，养老陪护场景对柔性操作要求极高，灵巧手需要实现精准可控的柔和施力，当下的力感知动态调节能力还需要持续打磨。</p>\n  <h4>投资方评论：</h4>\n  <p><strong>商汤资本</strong>表示，物流是目前具身智能赛道里最扎实的落地赛道之一，AI 机器人的降本增效价值能直接量化；同时绝大多数纯技术出身的创业团队相比，创始人李强具备物流、电商产业认知优势。叠加团队及股东具备的产业资源协同，项目能快速切入核心仓储场景跑通真实数据飞轮，在行业规模化落地的拐点到来之前站稳脚跟。上述因素完全符合机构“对的场景里，做对的事的团队”的投资逻辑。</p>\n  <p><strong>云启资本</strong>表示，物流具备任务高频、反馈清晰、商业价值明确等特点，是验证机器人能力、积累真实数据并提升模型泛化能力的重要入口。昆腾动力团队采取的以物流为起点，最终构建具备跨场景泛化能力、面向物理世界的通用基础模型的渐进路线更为务实。</p>", "category": "tech", "published_at": "2026-07-31T01:52:24+00:00", "fetched_at": "2026-07-31T02:24:08.443075+00:00", "fingerprint": "de902c82fcb066c1"}, {"source": "少数派", "title": "少数派会员年度更新：把共同的热爱随身携带", "url": "https://sspai.com/post/112858", "summary": "感谢每一位已经同行多年的会员，也欢迎新朋友加入我们共同建设的社区。<a href=\"https://sspai.com/post/112858\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-30T03:01:11+00:00", "fetched_at": "2026-07-31T02:24:06.807721+00:00", "fingerprint": "8a2242c78e6a1c54"}, {"source": "少数派", "title": "在流媒体时代，搭建一个专属于自己的「音乐探索系统」", "url": "https://sspai.com/post/112656", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/112656\" target=\"_blank\">查看全文</a>", "category": "t
