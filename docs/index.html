nergy of the largest [&#8230;]", "category": "tech", "published_at": "2026-09-07T14:59:41+00:00", "fetched_at": "2026-09-08T02:47:26.503567+00:00", "fingerprint": "fcaefa90288e8259"}, {"source": "The Verge", "title": "Six years later, Sony revisits its legendary XM4 headphones", "url": "https://www.theverge.com/tech/990687/sony-announces-xm4c-headphones", "summary": "Six years ago Sony and Bose were in the middle of a noise-canceling battle, with each new model of headphones better than the last. In the fall of 2020, Sony released the WH-1000XM4 headphones to wide acclaim. They sat atop best headphones lists for years, thanks to their great sound, competitive ANC, and compact size, [&#8230;]", "category": "tech", "published_at": "2026-09-07T16:00:00+00:00", "fetched_at": "2026-09-08T02:47:26.503561+00:00", "fingerprint": "2be377a0f12f54a1"}, {"source": "The Verge", "title": "Audi’s new A2 E-tron is its most affordable and efficient EV yet", "url": "https://www.theverge.com/transportation/991081/audi-a2-etron-ev-specs-price", "summary": "When shopping for an electric vehicle, affordability is becoming a more common trait. But affordable and energy efficient is truly a rare breed. Often you have to sacrifice one for the other. Want something affordable? Great, here's a range loser. Want something that goes the distance? Be ready to pay the price. Surprisingly, here comes [&#8230;]", "category": "tech", "published_at": "2026-09-07T20:03:41+00:00", "fetched_at": "2026-09-08T02:47:26.503554+00:00", "fingerprint": "11147936aa911180"}, {"source": "The Verge", "title": "First Xiaomi, then the world: why Arm might give phone gaming a huge graphics boost", "url": "https://www.theverge.com/games/990676/arm-neural-rendering-mali-g2-ultra-xiaomi-xring-o3", "summary": "China is getting first crack at a British technology that might change how mobile games are made and played. Today, the Xiaomi 18 Fold launches in mainland China with an Arm Mali G2-Ultra NX graphics processor inside its custom Xring O3 chip. What's so special about that? After five years of development, Arm now has [&#8230;]", "category": "tech", "published_at": "2026-09-08T02:00:00+00:00", "fetched_at": "2026-09-08T02:47:26.503542+00:00", "fingerprint": "8d7dc77c7e0ca564"}, {"source": "36氪 - 最新文章", "title": "速卖通登上IFA展台：AI硬件品类出海翻倍，Brand+在欧11国品牌销售渗透率超50%｜最前线", "url": "https://36kr.com/p/3973327354573057?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>IFA 2026展会现场，\"出海四小龙\"之一的速卖通首次出现在这个全球顶级消费电子展。展台上，9家中国品牌的产品罗列排开，品类从AI智能眼镜、仿生扑翼飞行器、3D打印机到电动自行车，覆盖了近年最热门的几个赛道。</p>\n  <p>这个场面放在几年前很难想象。一个跨境电商平台不谈卖货、不推爆款，转而对外展示第三方品牌出海，映射出跨境行业正在发生的叙事转变。</p>\n  <p>欧盟税改落地之后，跨境行业迎来一轮剧烈的行业洗牌。关税成本上升，直接冲击依靠低价走量的经营模式。</p>\n  <p>这一背景下，速卖通在8月欧盟市场销售额逆势增长97%，核心原因是Brand+品牌计划带来的缓冲。品牌商品客单价更高，关税占比可以被溢价空间消化；加上大量商品从欧洲本地仓发货，避开了跨境包裹的关税冲击。截至今年8月，Brand+在德国、法国、波兰等11个国家，品牌销售渗透率突破50%。</p>\n  <p>具体到出海品类中，AI硬件是速卖通品牌业务增长最快的板块。官方数据显示，2026年1‑7月，平台AI硬件品类出海规模同比实现翻倍。</p>\n  <p>速卖通IFA展台上出现了多家国内硬科技企业，包括极摩客、魔法原子等由技术驱动型初创公司；有英格威、纵维立方这种从亚马逊体系迁移过来的成熟品牌；还有ILIFE、Seauto这类完全在速卖通生态里成长起来、依托平台完成海外市场渗透的案例。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_5bce60d32d7a4656b9014927b7f18927@6022551_oswg724071oswg2560oswg1707_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">速卖通IFA 2026展台</p>\n  <p>以ILIFE为例，该品牌借助平台资源进入波兰市场，目前，当地每十户家庭就有一台ILIFE扫地机器人，品牌近一年在平台销售额接近翻三倍；Seauto欧洲订单中，超过九成来自速卖通。这些案例印证了，基于速卖通平台，它不仅是卖货渠道，也能成为企业进入新市场的跳板。</p>\n  <p>展会期间，速卖通宣布Brand+三大能力升级。第一，讲全域营销方案拓展到更多新市场，在美国、韩国、巴西等国复制欧洲成功经验；第二，AI运营工具升级，为品牌开放选品分析、定价策略和多语种内容生成工具；第三，欧洲本地仓配扩容，除西班牙、法国、波兰官方仓外，德国官方仓将于9月中旬正式开仓，为商家降低10%的仓配成本。</p>\n  <p>这套模式的支撑逻辑依托于速卖通\"营销+分销\"体系，站内有品牌专属的营销IP矩阵，站外连接了上万名网红和数十万联盟站长，全年200场营销活动；物流端则靠覆盖27国的仓配网络和库存预测工具来保证履约效率。</p>\n  <p>其中，Brand+作为一个品牌出海的服务中台，可帮助从用户认知建立到订单履约交付，覆盖了品牌进入新市场所需的主要环节。目前小米、荣耀、安克、李宁、泡泡玛特、宇树等品牌已签约入驻，品牌活跃买家渗透率超三成，品牌GMV占比接近40%。平台预计在2026年推动2000个中国品牌海外规模翻倍。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_5a659c5f5b1748ffbaf633d01fac1120@6022551_oswg417208oswg2560oswg1707_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">速卖通IFA 2026展台</p>\n  <p>Ad Age、The Harris Poll等相关榜单显示，目前，速卖通在全美Z世代消费者中的品牌吸引力增速排在第一位，已超过了Lululemon、Grok等本土品牌。</p>\n  <p>尼尔森出海报告也显示，品牌出海正在告别亚马逊一家独大的时代。89%欧洲用户发生过购物平台迁移，其中，从亚马逊转向速卖通的用户占比达到14%。速卖通欧洲用户年度消费增速达到25%，高于亚马逊19%的水平。</p>\n  <p>品牌出海不能只靠线上流量，速卖通正加速欧洲本地生态布局。包括与德国头部返现平台Payback合作，通过3500万会员的本地网络帮新品牌降低信任门槛；与AWIN的联盟营销合作累计GMV超10亿欧元，服务Brand+品牌上百个等。</p>\n  <p>今天，中国跨境电商正在经历一轮角色转换。税改和贸易规则的变化挤压了低价铺货的生存空间，海外消费者对品质和品牌的诉求在上升。</p>\n  <p>过去品牌出海的首选往往是亚马逊，现在多平台布局成了更理性的选择。但品牌出海不是把货发出去就行，从用户认知到本地化营销到供应链履约，每一环都是门槛。</p>\n  <p>速卖通Brand+的探索价值在于，它试图提供一条可复用的路径：不靠价格内卷，而是用平台能力帮品牌建立海外用户心智。</p>\n  <p>当然，这件事还远没到终点。不同市场的文化差异、供应链稳定性、用户心智培育，都是长期工程。但从IFA上能看到的一个变化是，一批中国硬科技企业不再满足于做代工厂，开始走向全球消费市场的前台。而跨境电商平台的角色，也正在从流量通道变成品牌出海的基础设施。</p>", "category": "tech", "published_at": "2026-09-07T12:40:05+00:00", "fetched_at": "2026-09-08T02:47:26.419572+00:00", "fingerprint": "a7f6d39bad8cc84e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨711被曝员工为完成指标自掏腰包“换购”；豆包手机9月16日正式发布；“存储龙头”江波龙今日港股上市", "url": "https://36kr.com/p/3974017109979392?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>黄仁勋发文祝贺OpenAI</li>\n   <li>最高法发文明确“AI换脸拟声”等案件裁判规则</li>\n   <li>捷豹路虎中国回应全球裁员传闻</li>\n   <li>小米澎程N70Pro发布，售价20.99万元</li>\n   <li>特斯拉推出限时优惠政策，购买Model 3/Y现车享现金激励5000元起</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>711被曝员工为完成指标自掏腰包“换购”</strong></p>\n  <p>9月6日，一消费者在711便利店（北新桥店）购物后发现，购物小票上多出两瓶可乐，但其表示并未购买。质疑门店工作人员私自刷取顾客钱款、私吞商品。9月7日，涉事门店工作人员回应称，公司每日有“换购任务”，涉事员工因未完成指标，在顾客结账时自行添加了可乐“换购”，但没扣消费者的钱，“她自己现金购买。”该工作人员同时称，711便利店都有考核压力，最近上级给的压力较大，促销活动设了指标，涉事员工临近下班为完成考核目标擅自在消费者订单中增加了商品。（界面新闻）</p>\n  <p><strong>全球首款AI智能体手机将于9月16日正式发布</strong></p>\n  <p>36氪获悉，据中兴通讯消息，9月7日，中兴努比亚宣布，搭载豆包手机助手的全新量产旗舰努比亚NaviX Ultra将于9月16日正式发布。据介绍，作为全球首款AI智能体手机，努比亚NaviX Ultra重构了人机交互方式，实现一句话让手机从“需要用户手动操作”的工具进化成“能替用户办事”的智能助手。</p>\n  <p><strong>江波龙：香港公开发售获40.32倍认购，最终发售价236港元</strong></p>\n  <p>今日，知名存储模组龙头江波龙（301308.SZ）将在港交所正式主板挂牌上市，股票代码（09976.HK），发售价236港元/股，正式形成“A+H”两地上市架构。36氪获悉，江波龙在港交所公告配发结果，香港公开发售获40.32倍认购，国际发售获3.88倍认购；最终发售价236.00港元，所得款项净额68.032亿港元，H股股份将于2026年9月8日开始在香港联交所买卖。（财联社、36氪）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>黄仁勋发文祝贺OpenAI：GPT-6 Astra用10万NVLink 72芯片完成训练，AGI正式到来</strong></p>\n  <p>黄仁勋于当地时间9月6日发帖称，OpenAI的GPT-6 Astra模型由约10万+ NVIDIA Grace Blackwell NVLink72集群训练完成。他还在社交媒体上祝贺OpenAI团队，并直言“AGI已到来”。此外，黄仁勋还提到从ChatGPT到o1再到Astra，这一路走了4年。他同时透露，下一批40万GPU即将上线，暗示算力军备竞赛仍在加速。（财联社）</p>\n  <p><strong>千问办公推出“多人工作台”</strong></p>\n  <p>36氪获悉，近日，阿里巴巴旗下Agent产品“千问办公”推出业内首个“多人工作台”。用户简单描述需求，即可生成并发布一个最多支持百人同时在线协作的网页，承载复杂的业务流程。该功能适用于活动组织、家校协同和企业协作等场景，可解决SaaS软件采购成本高、定制软件开发耗时高的难题。</p>\n  <p><strong>腾讯混元：已专项优化Hy4 preview“复杂任务下的长思考、过度自我验证”等问题</strong></p>\n  <p>36氪获悉，腾讯混元&amp;WorkBuddy联合团队发布Hy4 preview模型升级公告，混元Hy4 preview首发接入WorkBuddy以来，收到了广大用户与开发者的积极体验和热情反馈。针对“复杂任务下的长思考、过度自我验证”等问题，团队进行了专项优化并全量上线。通过Bench指标与人工评测双重监控，在不损失任务效果的前提下，优化版本显著降低了任务轮次及输入输出token消耗。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技回应“与苹果合作”，透露上半年服务器领域产品贡献增加</strong></p>\n  <p>9月7日长鑫科技召开2026年半年度业绩说明会。此前市场传言苹果已在测试长鑫科技的芯片。长鑫科技总经理赵纶回应称，公司以开放的态度与全球优质客户探讨合作机会，公司产品在性能、质量和供应稳定性方面已具备与国际主流厂商竞争的能力。至于HBM（高带宽内存）领域的进展，赵纶表示，公司将按照既定的技术路线图和商业计划保持产品与制程工艺的持续迭代。赵纶表示，服务器市场需求旺盛，上半年公司持续在该领域拓展业务，在下游需求提升等因素推动下，公司应用于服务器领域的产品贡献增加。关于国产光刻机DUV导入验证情况，长鑫科技称，公司围绕供应链建设采取了一系列措施，重点聚焦国产供应链的开发与验证，带动半导体设备等产业链核心环节协同发展。（第一财经）</p>\n  <p><strong>摩尔线程回应20cm跌停：2500万股解禁，请理性看待</strong></p>\n  <p>9月7日，摩尔线程约2577.45万股首发网下配售限售股上市流通，占总股本的5.48%。这部分股份来自上市时参与打新的公募、社保、保险等网下机构投资者，锁定期9个月，至此到期。按上一交易日收盘价估算，解禁市值约134亿元。限售股解禁触及20%跌停，报415.49元/股，总市值1953亿元。据公司证券业务人员回应，9月7日为公司首发网下配售股份解禁节点，合计2500多万股限售股上市流通，股份主要来自上市阶段参与打新的公募、网下机构投资者，属于上市后正常的资本时间节点。 公司相关人士表示，本次属于大额网下机构配售股份解禁。面对流通盘放大带来的市场波动，公司方面呼吁广大投资者理性处理、理性看待本次解禁带来的股价变化。（新浪科技）</p>\n  <p><strong>英特尔CPU传再涨价10%，高通、联发科趁隙抢攻IPC、IoT空缺</strong></p>\n  <p>据报道，供应链人士透露，2025年底以降，英特尔（Intel）PC用CPU持续涨价，2026年10月5日，再传出英特尔的PC CPU预估“再涨10%”。同时，毛利率偏低的Small Core产品线，恐走向EOL（End of Life），藉由缩减低毛利产品改善整体获利，这些都是英特尔执行长陈立武的策略调整。而业界也估计，Arm阵营的高通（Qualcomm）、联发科，将有机会抢进工业电脑（IPC）、物联网（IoT）晶片领域。供应链业者表示，因整体供应链成本攀升及部分产品需求强劲，英特尔PC CPU自2025年底以来接连涨价，2026年第1季调涨约10%，7月再调涨部分消费级及服务器级CPU，涨幅从数十美元至逾千美元。（新浪财经）</p>\n  <p><strong>小米18 Fold售价公布，10999元起售</strong></p>\n  <p>36氪获悉，小米18 Fold折叠屏手机售价公布：10999元起起售。据了解，该产品首发搭载玄戒O3，率先搭载长鑫LPDDR6内存，带宽高达113.8GB/s，电池容量达6000mAh。</p>\n  <p><strong>小米澎程N70Pro发布，售价20.99万元</strong></p>\n  <p>36氪获悉，在小米秋季发布会上，小米澎程N70pro正式发布，20.99万元起；N70 Max 23.99万元起。小米澎程N70定位中大型五座增程SUV，全系满配辅助驾驶，搭载700TOPS NVIDIA Thor芯片。</p>\n  <p><strong>雷军：玄戒O100和玄戒D100明年正式商用</strong></p>\n  <p>36氪获悉，9月7日，小米秋季旗舰新品发布会在京举办。小米集团创始人、董事长兼CEO雷军正式发布两款搭载玄戒O3的旗舰产品：小米18 Fold和小米平板9 Pro Max。小米18 Fold搭载小米自主研发设计的玄戒O3 AI旗舰处理器、小米澎湃OS 4和小米MiMo端侧大模型，这是小米芯片、AI、OS三大自研技术首次在一款终端上集结。雷军还披露，玄戒O100和玄戒D100也将于明年正式商用。</p>\n  <p><strong>宇树科技：首次实现人形机器人全自主搏击</strong></p>\n  <p>36氪获悉，宇树科技发布视频称，UnifoLM-X2-1.0突破世界-动作大模型瞬时规划、决策和动态交互执行等瓶颈，实现高动态、强交互、实时实现对未来预测和规划，实现人形机器人全自主搏击。验证了世界模型驱动的人形机器人大规模落地部署的基础可行性。</p>\n  <p><strong>中金公司：吸收合并东兴证券和信达证券已获证监会批复同意，9月15日起停牌</strong></p>\n  <p>36氪获悉，中金公司公告，公司此前拟通过发行A股股票换股吸收合并东兴证券、信达证券。2026年9月7日，中国证监会同意注册并核准本次吸收合并，中金公司拟新增31.04亿股；核准东方资产、信达资产成为中金公司主要股东，分别取得6.37亿股、13.29亿股，占发行后股份总数8.03%、16.76%。</p>\n  <p><strong>央行：8月末黄金储备升至7,673万盎司</strong></p>\n  <p>财联社9月7日电，央行数据显示，中国8月末黄金储备升至7,673万盎司，连续22个月扩大黄金储备。 （财联社）</p>\n  <p><strong>星宇股份：总经理周晓萍扣薪12个月，人力资源总监免职</strong></p>\n  <p>常州星宇车灯股份有限公司发布处罚决定，称鉴于8月初对部分新入职大学生事项处理不当造成的重大影响，经公司经理办公会决议，决定对负有管理责任的公司总经理周晓萍给予扣薪12个月的处理；对负有直接领导责任的副总经理李树军调整其分工，不再分管人力资源，并给予扣薪6个月的处理；对人力资源总监俞志明给予免职处理；对人力资源部部长李梅给予降职调岗处理。另据了解，常州当地官方对于星宇股份的处罚即将发布。（澎湃新闻）</p>\n  <p><strong>高德将推出“扫雷榜”？公司客服回应</strong></p>\n  <p>近日，据蓝鲸新闻援引知情人士消息，高德计划将于9月10日发布一款依托AI与大数据能力研发的“扫雷”产品。界面新闻了解到，近期在社交平台上出现多条高德新功能的截图。有网友称，高德正在内测“扫雷榜”，覆盖餐饮、景点、酒店、停车、商场等多元消费场景。该功能会根据用户评价，将餐饮店、景区、停车场、酒店分别列入排队避雷、体验避雷、卫生避雷等负面榜单。界面新闻就此事向高德地图客服咨询，对方表示：“目前没有相关信息。”（界面新闻）</p>\n  <p><strong>中国首份办公Agent用户行为：前20%用户消耗近九成算力，“头部效应”明显</strong></p>\n  <p>36氪获悉，国内首份《中国办公Agent用户行为不完全报告》发布，根据LobsterAI真实用户数据显示，办公Agent的使用呈现明显的“头部效应”，前20%用户消耗了87.4%的算力，其中前5%的用户独占53.5%的token消耗。同时，付费用户表现出极高黏性，其在token消耗、任务量和月活跃天数上分别达到免费用户的6.2倍、5.2倍和3.0倍，重度使用是付费的主要驱动力。除简单问答之外，用户开始将更加复杂、长周期的深度工作托付给Agent。数据显示，单次任务规模在5个月内增长3.1倍，8月环比增幅高达53%。</p>\n  <p><strong>最高法发文明确“AI换脸拟声”等案件裁判规则</strong></p>\n  <p>最高人民法院9月7日发布关于依法审理涉人工智能纠纷案件的意见，加强数字时代民事权益司法保障，促推人工智能健康有序发展。意见共5个部分24条，精准聚焦社会各界关注的“AI换脸拟声”、“AI幻觉”侵权、“网络开盒”、“大数据杀熟”、自动驾驶、AI模型训练、开源软件、知识产权保护等问题，针对性明确涉人工智能案件实体裁判和诉讼程序规则。（新华社）</p>\n  <p><strong>沐曦股份：曦云C700产品在正常推进中</strong></p>\n  <p>9月7日，沐曦股份高管在公司2026年半年度业绩说明会上表示，曦云C600已于2026年5月实现量产并通过中国信息安全测评中心与国家保密科技测评中心联合开展的国家安全性及可靠性测评，产能较有保障。曦云C700系列是基于国产先进工艺开发的下一代通用GPU芯片，拥有更高的性能，于2025年4月立项，目前正处于设计开发阶段，芯片的核心设计、功能验证已大部分完成，正在进行更深入的性能调优。公司会按设计、验证、流片、软件适配、客户测试和量产导入的流程推进。（证券时报）</p>\n  <p><strong>二季度平均每天超10万张信用卡“悄然离场”，行业加速转型质量优先</strong></p>\n  <p>央行最新公布的数据显示，截至二季度末，全国共开立信用卡和借贷合一卡6.77亿张；与一季度末的6.87亿张相比，二季度单季度减少约1000万张。这意味着，2026年二季度，平均每天有超10万张信用卡从市场中“消失”。与此同时，A股42家上市银行近期披露的2026年半年报数据显示，多家银行信用卡发卡规模、信贷余额均同比下滑。业内人士指出，在拓中收、降不良的整体趋势下，商业银行信用卡业务已全面放弃过去“广撒网”的跑马圈地策略，转而主动缩量、升级打法，向优质客户与高频交易等场景发起定向进攻。（证券时报）</p>\n  <p><strong>捷豹路虎中国回应全球裁员传闻</strong></p>\n  <p>针对近日有关捷豹路虎全球裁员4000人的报道，捷豹路虎中国回应称，中国市场目前没有相应的组织优化调整计划，捷豹路虎中国业务运营正常，销售、售后服务及经销商网络均正常运行。（第一财经）</p>\n  <p><strong>时隔6年，华为再发高性能芯片</strong></p>\n  <p>华为7日在广州发布Mate XT 2三折叠手机，搭载最新的麒麟9050 Pro芯片，这是首款采用逻辑折叠技术的高性能芯片。据了解，麒麟9050 Pro在单芯片内将逻辑单元分层排布，如同从平层升级为复式，内部增设垂直互联通道，好似加装“电梯”，信号传输路径更短、时延更低、性能更好。这也是继华为Mate40全球发布会之后，华为时隔六年在旗舰发布会上推出全新麒麟芯片。（财联社）</p>\n  <p><strong>苹果新机价格遭泄露：折叠屏iPhone Ultra或超1.3万元</strong></p>\n  <p>9月7日，据外媒GSMArena消息，距离苹果9月9日秋季新品发布会临近，海外运营商沃达丰在埃及、澳大利亚的后台标价意外流出，曝光iPhone 18 Pro、iPhone 18 Pro Max以及首款折叠屏iPhone Ultra的预估地区售价，折叠机型价格涨幅格外突出。泄露信息显示，埃及市场中iPhone 18 Pro标价98000埃及镑（约合人民币12936元），iPhone 18 Pro Max为105000埃及镑（约合人民币13860元），对比当地iPhone 17 Pro系列，涨幅大约10%。而折叠屏iPhone Ultra的预标价达到 155750埃及镑（约合人民币20559元），相比上代Pro机型价格大涨约70%。澳大利亚渠道的爆料显示，iPhone Ultra 提供256GB、512GB、1TB三种存储版本，对应3699澳元（约合人民币17881元）起，业内据此推算美版Ultra起售价或将落在2000美元（约合人民币13425元）附近。（环球网）</p>\n  <p><strong>AI长剧带火影视板块，机构扎堆调研的绩优潜力股仅7只</strong></p>\n  <p>近期，A股市场影视板块表现活跃，多只AI影视概念股大幅上涨。消息面上，近日，博纳影业相关负责人表示，由博纳出品制作的东方超写实灵智共创长篇电影《三星堆：未来往事》即将登陆全国院线，这将是国内首部AI深度参与制作的院线超写实动画长片。从调研情况来看，截至9月4日，共有近30只AI视频概念股今年以来获得机构调研，23只概念股获得10家及以上机构调研，凌云光、中文在线、三七互娱等6只概念股获得百余家机构调研。进一步来看，上述23只概念股中，机构一致预测2026年净利润增幅有望超过30%的个股仅有7只，包括盛天网络、凌云光、巨人网络等。（证券时报）</p>\n  <p><strong>华为、苹果正面交锋，折叠屏手机市场将迎“72小时对决”</strong></p>\n  <p>9月7日下午至10日凌晨，华为、小米、苹果将在72小时内接连发布各自的折叠屏旗舰手机。华为与苹果首次在折叠屏赛道正面交锋，小米同台竞技，三大品牌在同一周、同一品类、同一价格带上“短兵相接”，这在折叠屏品类诞生七年来尚属首次。（上证报）</p>\n  <p><strong>个人养老金基金扩容，新增“固收＋”赛道</strong></p>\n  <p>个人养老金基金产品谱系有望迎来进一步扩容。近日，从业内获悉，多家基金公司收到监管部门下发的《关于做好含权二级债基、偏债混合基金纳入个人养老金基金产品名录工作的通知》，近期将推动符合一定条件的含权二级债基、偏债混合基金纳入个人养老金基金产品名录。含权二级债基、偏债混合基金等通常被市场归入广义“固收＋”产品范畴，这类产品以固收资产作为底仓，同时通过股票、可转债、偏股型基金等资产增强收益，在纯债基金与权益基金之间形成较为丰富的风险收益梯度。随着此类产品进入个人养老金基金产品池，个人养老金投资者的产品选择有望进一步丰富。（证券时报）</p>\n  <p><strong>理想汽车：自研电池将全面搭载到所有车型</strong></p>\n  <p>36氪获悉，理想汽车发布关于“理想汽车将全系搭载自研电池”的进展同步。目前，理想自研电池已经在理想L8、理想L6、理想i8上进行搭载，后续，理想自研电池将全面搭载到所有的车型。</p>\n  <p><strong>三星与SK海力士库存降至不足10天用量</strong></p>\n  <p>三星电子与SK海力士的存储半导体库存已降至不足10天供应量，市场担忧明年可用库存或将耗尽。分析师表示，随着人工智能（AI）基础设施投资以前所未有的速度扩张，存储芯片市场即将面临严重的供应短缺。（新浪财经）</p>\n  <p><strong>特斯拉推出限时优惠政策，购买Model 3/Y现车享现金激励5000元起</strong></p>\n  <p>36氪获悉，据特斯拉消息，即日起至2026年9月30日（含）前下单并提车，Model 3全系现车享现金激励5000元，Model Y全系现车享现金激励10000元。同时，Model 3部分车型还可申请享受8000元保险补贴。享受所有政策优惠后，Model 3售价222500元起；Model Y售价253500元起。</p>\n  <p><strong>SpaceX竞争对手完成历史性首飞，称行业正 “迫切渴求” 更多火箭运力</strong></p>\n  <p>德国火箭企业Isar Aerospace上周末首次成功实现入轨，为欧洲商业航天行业树立一座里程碑。该公司计划增加发射频次，以此满足其口中蓬勃增长的市场需求。公司首席商务官斯特拉・吉伦周一接受采访时表示，企业当前重心是扩大生产规模；航天行业正“迫切渴求”更多发射运力，伊萨尔航空航天手握超100亿欧元（折合116亿美元）的项目储备订单。（新浪财经）</p>\n  <p><strong>大众汽车重组获批后劳资博弈未止，工会反对“放手裁员”</strong></p>\n  <p>大众汽车工会领导人警告首席执行官Oliver Blume，上周达成的重组协议并不意味着管理层获得了放手推进改革的授权，这预示着围绕就业岗位和工厂未来的争论仍将持续。工会方面周一在大众汽车内部网发布声明表达上述立场。这凸显出Blume面临的挑战：他正从为重组计划争取广泛支持，转向敲定各工厂和项目的具体实施细节。尽管监事会认可了他的总体改革方向，但许多最具争议的措施仍需制定详细方案、获得进一步批准，并与实力强大的员工代表展开谈判。（新浪财经）</p>\n  <p><strong>美国劳工节周末汽油均价首次站上4美元，刷新假日纪录</strong></p>\n  <p>进入2026年劳工节周末，美国汽油价格再度成为市场焦点。美国汽车协会数据显示，全美普通无铅汽油均价约为4.14美元/加仑，9月6日部分统计口径达到4.15美元，9月7日协会数据显示约为4.147美元/加仑。这是有记录以来美国劳工节期间普通汽油全国均价首次突破4美元，也超过2012年9月3日创下的3.82美元/加仑假日纪录。去年同期均价仅约3.19至3.20美元，意味着一年时间内每加仑上涨接近1美元。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>燧原科技公布科创板IPO发行结果</strong></p>\n  <p>9月7日，燧原科技公告，公司首次公开发行股票并在科创板上市的发行结果已公布。本次发行价格为142.18元/股，发行数量为4,303.5173万股。回拨机制启动后，网下最终发行2,409.9639万股，���上最终发行1,032.85万股，网上发行最终中签率为0.02455315%。网上投资者放弃认购16,874股，网下投资者无弃购，弃购股份全部由保荐人（联席主承销商）包销，包销金额239.91万元，占本次发行总规模约0.04%。本次发行费用合计3.09亿元。（界面新闻）</p>\n  <p><strong>傲拓科技科创板IPO获上市委会议通过</strong></p>\n  <p>36氪获悉，上海证券交易所上市审核委员会2026年第49次审议会议于2026年9月7日召开，审议结果为傲拓科技股份有限公司首发事项符合发行条件、上市条件和信息披露要求。</p>\n  <h2>投融资</h2>\n  <p><strong>“氦星光联”完成超5亿元A2轮融资</strong></p>\n  <p>36氪获悉，近日，“氦星光联”正式宣布完成A2轮融资，融资总金额超5亿元人民币，刷新国内空间激光通信赛道单笔融资纪录，2026年年内累计融资已超7亿元。本轮融资由雄安科技创新成长股权投资基金、武汉光谷科创产业投资基金联合领投，常州毅岭致星、青岛钰湖引力柒号、赛特威尔控股有限公司等机构共同投资。融资资金将重点投向超高速激光通信组网产品研发、产能扩充与应用场景拓展。</p>\n  <p><strong>“中科世通亨奇”完成近5亿元B系列融资</strong></p>\n  <p>36氪获悉，智能决策基础设施服务商“中科世通亨奇”近日宣布完成近5亿元B系列融资。本轮融资由中国兵器集团下属南方德茂基金、北京市信息产业基金、联通创投、厚纪资本、太平科创基金、广发信德、芯能创投等机构共同投资，老股东乐礼资本连续三次加注。此轮募集资金将重点用于AOS核心技术研发、“世通灵境”产品体系升级、行业生态建设及重点市场拓展，推动公司从国防等高可信场景向运营商、金融、能源电力、政府治理等关键行业复制。</p>\n  <p><strong>“阿法龙”近日完成超亿元人民币B轮融资</strong></p>\n  <p>36氪获悉，“阿法龙”近日宣布完成超亿元人民币B轮融资。本轮由老股东梅花创投领投，德阳国资、宁波国资跟投。资金将主要用于大视场角光波导芯片的研发攻坚、四川德阳量产基地的产能扩建，以及光通信器件业务的产业化落地。</p>\n  <p><strong>“紫创智械”完成数千万元融资</strong></p>\n  <p>36氪获悉，紫创智械（上海）科技有限公司宣布完成数千万融资。投资方包括毅达资本及头部产业方，多家行业产业方也在关注及交割中。目前，紫创智械已与徐工汉云、山推股份达成战略合作，将具身智能软件能力与主机资源深度融合，共同推进智能装载机、智能挖掘机等产品的研发与落地。</p>\n  <h2>酷产品</h2>\n  <p><strong>余承东：Mate XT 2三折叠手机售价19999元起</strong></p>\n  <p>36氪获悉，9月7日，华为常务董事余承东在新品发布会上宣布，Mate XT 2非凡大师三折叠手机搭载最新的麒麟9050 Pro芯片，售价19999元起。</p>\n  <p><strong>HarmonyOS 7正式发布</strong></p>\n  <p>36氪获悉，据华为终端消息，HarmonyOS 7正式发布。据介绍，该系统在底层架构上实现进化，围绕空间美学、智能、性能、安全与互联五大维度实现升级，语音助手小艺同样升级为系统级智能体。</p>", "category": "tech", "published_at": "2026-09-08T00:19:24+00:00", "fetched_at": "2026-09-08T02:47:26.419566+00:00", "fingerprint": "eaa289807c901455"}, {"source": "36氪 - 最新文章", "title": "AICRON参与《金特务》制作，韩国主流剧集首次引入AI生成内容｜早期项目", "url": "https://36kr.com/p/3966062388780290?f=rss", "summary": "<p>AI参与传统影视制作已经不是新鲜事，但最终呈现往往比较粗糙，《金特务：本色回归》中一段难辨真假的场景则在缩小这种差距。</p>\n  <p>这部作品改编自Man's story的同名网络漫画，在韩国SBS电视台和Netflix上同步播出，创下了2026年韩国迷你剧的收视纪录，并在Netflix全球非英语剧集榜连续三周登顶。</p>\n  <p>其中一段主角截停反派车队并发生打斗的场景，全程由AI完成，其中包括撞车、火拼等大场面，也包括近身肉搏的复杂动作。</p>\n  <p>许多网友得知这一段内容是AI制作的后感叹，难以看出与实拍的区别。这段情节中，仍有一些细节不符合物理规律，但整体并不影响观看体验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_0c212df6ca7946b3b4f29f4cd2803119@5899452_oswg118688oswg894oswg929_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>AICRON就是制作这段内容的工具和公司，由韩国影视制作公司MORPHEUS创立。为了适应当下AI影视的潮流，MORPHEUS与韩国文化娱乐公司NextPlay Entertainment.Ltd（简称“NPE”）预计创立一家合资公司，围绕AI CRON加大对AI影视的投入。</p>\n  <p>AICRON是一个AI视频生成工具和平台，已经接入了包括Seedance、可灵、GPT Image、Veo等在内的150个大模型，涵盖了图像、视频、音频、文本、3D视觉等260余种AI功能，并且以节点的形式呈现、贯穿整个生产流程。</p>\n  <p>创作者可以在一张画布上自由调用不同的大模型，生产多种内容，并根据需要进行组合。</p>\n  <p>相较于国内许多画布类工具的低价竞争，AICRON更强调好用、完成度高，以及让普通的C端创作者也能创造出影视级的产出，譬如《金特务》中的片段。</p>\n  <p>AICRON的创始人LEE SOO&nbsp;YOUNG本身有着超20年的传统影视行业经验，以及丰富的AI使用经验，熟悉海内外不同大模型的特点、专长以及迭代，由此，创始人和其他类似背景的团队成员，可以将自身从业经验融入到工具流程中。</p>\n  <p>“例如在拍摄电影过程中，光源摆放在不同的位置，会形成效果皆然不同的效果。能把握、预测这种不同的人，往往需要丰富的传统影视从业经验。”LEE SOO&nbsp;YOUNG表示。</p>\n  <p>团队将这类经验沉淀为多个Agent和工作流，可以让使用者结合自己需要进行调用，由此保证生成内容的完成度和专业性。</p>\n  <p>此外，AICRON本身也支持记录个人的工作流。用户可以根据自己的需求定制工作流，并保存为数据资产。</p>\n  <p>在创始人的演示中，当用户在AICRON上输出自己的需求后，工具会根据相关需求生成人物形象、三视图和视频，期间会自动调用最适配这一需求的数十个大模型，并把这一过程以线条的方式呈现在不同节点之间，供用户查看、改写和记录。</p>\n  <p>这个选择、留存的过程，有利于用户自由创作，也构成了这一工具的优势。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_d9df6669dcba4cdd9baa200548a5aaeb@5899452_oswg1497416oswg2090oswg1168_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>目前，AICRON一共有三档收费标准，其中中档的收费是59美元/月，对应4500cron（可以理解为积分），能生产约30min的视频。</p>\n  <p>AICRON还推出了适配团队协作的解决方案——AICRON Teams，在沉淀数据资产的功能上，还有“团队仪表板”功能，可以让用户一目了然地掌握token使用量与积分消耗情况，适配广告代理、VFX（视觉特效相关）工作室等团队。</p>\n  <p>注资AICRON的NPE，联合创始人是李洪大（LEE HONG&nbsp;DAE），深耕中韩影视行业数十年，有着丰富的影视制作经验。NPE计划建立完整的AI影视制作流程，布局横跨院线电影、网剧等多个领域，生产包括AI原生内容以及利用AI辅助实拍的作品。电影上，NPE已经与《首尔之春》导演金性洙，《劫机》导演金圣瀚合作开发AI电影作品，预计明年上线。</p>\n  <p>在AI上的尝试和投入，是NPE押注AICRON的主要原因。前者所具备的内容能力和IP储备，也可以反哺AICRON。</p>\n  <p>整体来讲，NPE负责内容策划、制作和IP运营，MORPHEUS及AICRON提供AI工具与工作流，OTT平台承接发行和商业化，可以覆盖整个AI影视生产链路。</p>\n  <p>目前AICRON的收入来源主要是AI影视内容承制和工具付费，二者贡献收入占比分别是50%。创始人表示，今年AICRON预计可以实现近千万元人民币的收入，并有望在2027年实现2-3倍的增长。</p>", "category": "tech", "published_at": "2026-09-08T00:30:00+00:00", "fetched_at": "2026-09-08T02:47:26.419559+00:00", "fingerprint": "e0bf3e39b24cc3ab"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 99年同济副教授、前大疆骨干创业世界模型，成立不到一月融资数千万", "url": "https://36kr.com/p/3973553316081920?f=rss", "summary": "<p>硬氪获悉，世界模型企业「WorldMind」（寰宇心生）近日完成数千万元天使轮融资。资方为元生资本，此次融资将主要用于团队建设和扩张，以及基础设施和基础模型训练。点石资本担任公司独家财务顾问。</p>\n  <p>WorldMind成立于2026年9月，核心团队聚焦具身智能、世界模型与脑科学的交叉融合。创始人兼CEO任云帆出生于1999年，曾任大疆算法预研骨干，博士毕业于香港大学MaRS Lab，后赴苏黎世大学RPG开展博士后研究。26岁入选国家级青年人才，现任同济大学博导、长聘副教授。</p>\n  <p>CTO张奇为悉尼科技大学人工智能博士、国家级青年人才，担任科技部“脑科学与类脑智能”重大专项青年科学家，长期聚焦脑视觉解码与类脑智能研究，首创脑视觉编解码Mind-X系列方法。团队另有多位海内外名校毕业博士，长期从事世界模型、具身智能、多模态大模型相关研究，在世界模型领域拥有深厚技术积累。</p>\n  <p>过去两年，世界模型逐渐成为具身智能领域最热的关键词之一。行业正在面对一个比“让机器人会做动作”更基础的问题：机器究竟该如何理解真实世界。语言模型的Scaling Law已经证明，只要不断增加数据、算力和模型规模，能力可以持续涌现。但现实世界并不是一套可以无限抓取的互联网文本。它连续、多模态、开放，而且永远存在新的物体、新的场景和新的变化。</p>\n  <p>WorldMind的判断是，世界模型真正需要寻找的，可能并不是一条简单复制语言模型的Scaling路径。采访中，创始人任云帆表示，他们还没有看到世界模型的Scaling Law被真正验证。于是他换了一个问题，机器人真的需要理解整个世界吗？</p>\n  <p>任云帆认为，答案是否定的。一个厨房机器人首先需要理解的可能只有十几平米的厨房。WorldMind把这种有限、具体、与智能体直接相关的环境称为“小世界”，背后借用的是Jakob von Uexküll提出的“环世界”概念。这也把一个无法穷举的问题变成了可以训练、可以部署、也可以获得真实反馈的问题。</p>\n  <p>“但小世界不是孤岛”，任云帆强调，家庭里的接触和摩擦，可能在工厂、仓储场景里以另一种形式出现。于是，一个场景解决的问题，不只是为了场景本身，而是在为一个更大的世界模型积累知识，WorldMind希望先在家庭、工厂、仓储、户外等具体场景中建立一个个可验证的模型，再把不同小世界中共同存在的物理规律提取出来，逐渐形成更大的世界模型基座。</p>\n  <p>这也是他们对“Scaling”的另一种理解，Scaling并不一定意味着从一开始就拥有海量数据，而可以从一个足够好的小世界起步。任云帆认为，如果先把一个具体行业问题解决到足够高的水平，相当于找到一个很好的Scaling起点，那么未来随着场景增加、数据增加、行业扩展，模型才有可能真正沿着一条曲线向上生长。</p>\n  <p>基于这样的认识，WorldMind把世界模型分为四个部分，知识、记忆、推演、校准。知识对应相对稳定的客观规律，比如牛顿力学、流体、材料、光照。记忆则更像智能体自己的经历，记录最近发生了什么、物体如何运动、机器人刚刚做过什么。</p>\n  <p>在传统直觉里，一个模型如果要同时面对越来越多的任务，似乎就必须越来越大。但WorldMind认为，真正需要不断增长的是对世界的知识，而不是负责理解“下一步会发生什么”的神经推演模块。“就像传统物理引擎一样，无论机器人是在预测一辆车下一秒的位置，还是判断一个瓶子被推了一下之后会怎么运动，底层都可以归结为动力学和运动学问题。”除此之外，模型还需要不断接受真实世界的反馈，用新的数据修正自己的预测。</p>\n  <p>目前，WorldMind已自主研发记忆增强世界模型与脑启发世界动作模型两项核心技术。其中记忆增强世界模型，首次将快慢系统机制引入世界模型的训练与推理过程，通过动态记忆机制与时空双流引导机制，实现高保真环境建模，并显著提升真机数据利用效率，降低世界模型训练成本。相关模型在权威世界模型评测基准WorldArena1.0开源榜单中位列第一，并在最新发布的WorldArena2.0多个评测赛道中稳居前三。</p>\n  <p>后者则通过引入大脑输出拷贝机制与自我中心4D世界知识架构，构建了“世界推演-空间规划-动作生成”的分层联合架构与统一混合专家模型，位列世界动作模型全球榜仿真开源第一。再往现实里走，则是无人机等真机上的世界模型在线自校准，让模型和策略在真实世界中同步学习，持续进化。</p>\n  <p>因此，他们现在做的产品，并不是一个单纯意义上的“机器人模型”，而是从世界预测到动作执行，再到真实世界反馈的完整链条。</p>\n  <p><strong>以下是与WorldMind创始人任云帆的访谈节选：</strong></p>\n  <p><strong>硬氪：你们强调从小世界做起，不同小世界之间具体是怎么实现共享的？</strong></p>\n  <p><strong>任云帆：</strong>我们认为每一个小世界中存在的长尾问题，本质上往往是统一物理规律在这个场景中的一种投影。</p>\n  <p>比如家庭服务机器人可能只能通过家庭场景的数据覆盖80%的情况，剩下20%的长尾问题可能涉及接触力学、摩擦等物理规律。但这些规律在工厂、仓储或者其他场景中可能是更常见的数据分布。我们可以从其他场景中学习这些物理规律，再用它们补足家庭场景中的长尾问题。</p>\n  <p>所以，小世界不是孤岛。各个小世界能够共同维护一个共享的大世界模型基模，而大的世界模型又可以把更加完整的模型和物理规律蒸馏给每一个下游的小世界，形成上下行的数据和知识交互。</p>\n  <p><strong>硬氪：你们的世界模型架构和其他世界模型最大的区别是什么？</strong></p>\n  <p><strong>任云帆：</strong>标准的世界模型通常是根据当前状态和即将采取的动作，预测下一个状态。我们的模型会把知识和记忆从状态中单独拿出来。也就是说，我们对下一时刻的预测，不仅取决于当前状态，还取决于模型对世界的认知，也就是世界知识，以及刚刚执行过的任务和历史记忆。</p>\n  <p>这样分解之后，一个好处是模型学习到的物理规律不再隐式地纠缠在状态空间中，而是具有相对明确的物理意义。我们可以显式维护知识和记忆，更好地进行知识共享和记忆提取，也能够用更小的模型在某一个垂域取得更好的效果。</p>\n  <p><strong>硬氪：你们最初希望从哪些场景实现落地？</strong></p>\n  <p><strong>任云帆：</strong>前期从实用和公司发展的角度，我们可能会挑一些“硬骨头”，比如目前比较难解决的家庭服务场景，以及多元性很强的厨房场景。一方面可以展示公司的研发实力，另一方面也希望真正实现落地。</p>\n  <p>具体的落地方向，则取决于我们目前正在沟通的几个行业共创伙伴，大致会包括一些行业场景、工业场景以及To B的厂房、产线等。这些场景的设备往往非常非标，我们希望用一套统一的模型让机器人完成不同场景下的任务，并且能预测场景的变化。比如工地场景，世界模型可以有两个用途。第一是作为机器人的训练场，为挖掘机等\"大具身\"设备提供训练能力，也可以用于VLA数据采集或者强化学习，解决目前具身智能还没有解决的一些问题；第二是预测整个工地的变化，比如混凝土干燥、天气对场景的影响等，从而帮助进行工期或者设计规划。</p>\n  <p>我们希望先定义好一两个封闭场景，寻找行业共创伙伴，在真实场景中把数据采集、模型训练、实际应用和数据回流整个闭环跑起来。这是我们比较踏实、也比较关注的落地方向。</p>\n  <p><strong>硬氪：目前落地最大的工程挑战是什么？</strong></p>\n  <p><strong>任云帆：</strong>这个问题肯定是难的，否则也不会到现在还没有一个通用的解决方案。但我们解决问题的方法，是把事情Narrow Down，不去试图一次解决整个行业的问题，而是先把一个具体场景和任务完整做好，把数据回流体系建立起来。</p>\n  <p>目前我们已经在实验室桌面这种比较可控的场景做了一些验证。下一步进入真实场景后，一定会遇到各种Corner Case。To B场景整体相对可控，但会比实验室复杂很多。真正需要工程能力的是，如何把知识、记忆和数据回流整个Pipeline跑通。算法方面我们非常有信心，但工程方面还需要投入更多时间和精力。</p>\n  <p>只要把环境定义得足够Compact，把场景定义得足够封闭，这件事情的上下限其实都很清楚。Worst Case是在一个任务中完成环境推演和动作执行，这一点现在的方法已经可以做到。我们真正想探索和突破的是上限，也就是这个世界能够从一张桌子、一条产线逐渐扩大到整个工厂。</p>\n  <p>所以我们不会怀疑整套Pipeline能不能落地。只要场景定义得足够清晰，一条产线或者一个任务做到比较好的效果是可以实现的。我们真正关心的是它能不能从小到大实现更好的泛化。</p>", "category": "tech", "published_at": "2026-09-08T01:30:00+00:00", "fetched_at": "2026-09-08T02:47:26.419550+00:00", "fingerprint": "8e80460b10851a15"}, {"source": "36氪 - 最新文章", "title": "清华博士做具身大脑拿下九轮融资，他说机器人行业不存在所谓ChatGPT时刻｜硬氪专访", "url": "https://36kr.com/p/3973012275785986?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>在一众清华系创业者中，千诀科技创始人高海川很特别。他从不以学院派自居。他给自己的定位简单直接，在硬氪采访中，他说：“我首先要考虑商业现实，其次才是搞技术的。”</p>\n  <p>2019年，还在清华实验室做研究的他，就敏锐的捕捉到了机器人大脑的商业机会，但他没有着急创业，而是把这份想法存了整整四年。直到2023年，在判断机器人智能进入工程化和商业落地窗口后，高海川才离开学校，正式创立千诀科技。</p>\n  <p>这种务实和清醒贯穿了千诀后来的成长。</p>\n  <p>硬氪获悉，千诀科技近日完成数亿元A+轮融资。本轮融资由元禾厚望、筱光资本、芯能创投、英诺天使基金、京铭资本、未来边际创投等市场化机构及产业方投资人共同参与。Maple Pledge 枫承资本长期出任私募股权融资顾问并参与本轮投资。成立以来，公司累计已完成9轮融资。</p>\n  <p>创立第一天，千诀对商业化的定位就很清晰。当时，行业畅想着把ChatGPT融合进具身机器人，靠大模型就能解决落地的全部难题。千诀却选择了一条少有人走的路。</p>\n  <p>高海川其实很早就开始研究前沿方向。早在2017年，团队核心成员还在清华实验室时，就锁定了预测式世界模型这条技术主线，并且在国际比赛拿到了很好的成绩。</p>\n  <p>但千诀早期没有讲过这类故事，当所有人沉迷于通用人形机器人的未来时，高海川却说：“<strong>机器人行业不存在所谓的ChatGPT时刻。不会出现某一个单点技术突破，就带来全赛道瞬间爆发的拐点。”</strong></p>\n  <p>他并非悲观或唱衰行业，只是在实际落地中认清了现实。千诀的第一批订单不是人形机器人，而是选择从餐饮、保洁、酒店服务机器人等已经具备明确需求的产品和场景切入。</p>\n  <p>高海川清楚地看到落地中会遇到问题，他也并不认为数据采集的问题短期内能够解决。所以，千诀内部两条线并行，研发团队沿着预测式世界模型的主干，基于多项式表征架构，探索一切可能的细分算法路线；落地团队扎进酒店、零售、家庭服务这些场景里，一个客户一个客户地啃，在真实应用中去优化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_faec423d079546fa996bb3be396be7ce@6022551_oswg208251oswg1080oswg645_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人在咖啡店自主配送（图源/企业）</p>\n  <p>“客户不在乎你的技术架构、算法模型，而是这东西能不能帮他收拾好酒店客房里乱丢的拖鞋。”高海川告诉硬氪。</p>\n  <p>在CTO章天任眼里，高海川是个“非典型的清华人”。虽然拥有长期的技术研究经历，但他并不以论文数量或技术概念作为创业的唯一评价标准。高海川很少插手具体的技术方案，而是把精力放在业务方向上，跟团队一起讨论什么该做、什么不该做，同时想清楚公司长远的路径怎么走。</p>\n  <p>他也很少被外界风向所影响，对热点有很干脆的判断。比如对大脑公司造本体，他就认为，<strong>“为了融资的可能性很大。这本身就是行业浮躁的缩影，不是技术逻辑，是资本逻辑。”</strong></p>\n  <p>具身智能赛道虹吸海量资金后，如今也到了给出进展的时刻。但显然，很多公司除了漂亮的PPT和展台Demo，还是拿不出实际结果。</p>\n  <p>千诀似乎没有这样的惶恐。高海川从来不去讲抽象的概念，“再好的技术，如果落不到真实场景，拿不到客户认可，就没有实际价值。”高海川说。</p>\n  <p><strong>以下是硬氪同千诀科技创始人兼CEO高海川的对谈实录，内容经编辑：</strong></p>\n  <h2><strong>投资人不再为炫酷Demo买单</strong></h2>\n  <p><strong>硬氪：站在一线产业从业者的视角，今年具身智能赛道相比此前，你观察到最直观、根本性的行业变化是什么？</strong></p>\n  <p><strong>高海川：</strong>行业进入眼下阶段，发展速度往往是最快的，它已经走出了学术圈的价值定义方式。</p>\n  <p>过去大家看的是一次性演示、Demo、榜单排名；现在更关注真实的落地指标，比如任务成功率、连续运行时长、异常恢复能力、部署成本、数据迭代速度。投资人的评价标准也变了，不再因为一个炫酷的Demo就出手。</p>\n  <p>这种变化正在海内外同步发生。我们也可以看到，行业评价标准的关键词正围绕这几个维度收敛，包括长尾反馈闭环、系统工程等概念被提及的频率越来越高。</p>\n  <p>尽管还没有一个统一的架构能适配所有场景，但共识在形成。作为产品，这不再是一个一次性交付的SaaS系统，而是一整套系统工程，依靠模型体系与真实用户反馈数据，在实际落地运行的过程中持续迭代、协同进化。</p>\n  <p><strong>硬氪：过去一年，从端到端、VLA到世界模型的技术热点快速切换，你们怎么看待市场对新的路线或概念的态度？</strong></p>\n  <p><strong>高海川：</strong>其实路线层出不穷，是当前AI领域的普遍现象，不仅具身智能，多模态模型、语言模型都是这样。但关键是，技术根基没变。在细分层级上技术路线并非互斥，对于系统框架而言，往往只需增加一个解码器，主干网络和特征表征就可以复用。</p>\n  <p>要判断一条路线是否可行，不能看短期的声量。任何细分路线在特定阶段都有它的长处，也有它的短板。所以\"新\"不代表\"好\"，真正的检验标准是市场，由几个基本指标着手，比如数据效率怎么样、样本效率高不高、迭代成本多少、系统长时间跑稳不稳定、泛化能力强不强等。这些才是决定技术路线到底能走多远的东西。</p>\n  <p><strong>硬氪：千诀成立第一天就在做预测式世界模型，你们是在什么时间点确定这条路线的？</strong></p>\n  <p><strong>高海川：</strong>国内预测式世界模型的风口，是因为Yann LeCun出来创业做AMI Labs后，一批长期从事相关研究、之前没有被市场充分关注的团队走到聚光灯下。千诀也是其中之一。</p>\n  <p>但事实上，2018年，World Model领域第一篇论文刚发表时，我们团队就已经开始基于视频游戏VIZDOOM竞赛做Model-based Control的研究，并且在国际比赛拿到了很好的成绩。</p>\n  <p>我们当时看到的是一个确定性极强的长期方向。所以当世界模型在今年被推上风口时，千诀在技术层面已持续积累了近十年。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_b7882b21e01b476f80cf3d29132aa663@6022551_oswg192449oswg1280oswg442_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《Quantifying and Optimizing Simplicity via Polynomial Representations》，提出利用多项式表征对神经网络的“简单性”进行量化与优化（图源/企业0</p>\n  <p><strong>硬氪：在世界模型概念爆火之前，业界对它的真实认知是什么？千诀早期为什么没有选择更主流的VLA路线？</strong></p>\n  <p><strong>高海川：</strong>千诀成立是在2023年，业内普遍认为，将ChatGPT接入人形机器人就能解决一切问题。但这个判断明显低估了数据稀缺性。真实机器人数据的采集成本太昂贵了，时间成本、破坏性成本都非常高。这就意味着，算法必须具备极高的样本效率，才有可能跨越商业化的门槛。</p>\n  <p>VLA与世界模型并不是完全对立的技术路线，VLA在语言理解和直接生成动作等方面具有自身优势。但如果只依赖端到端的策略学习，面对数据稀缺、环境变化和分布外任务时，仍然可能面临较高的数据需求和泛化挑战。所以千诀从一开始就很明确，不走Model-free的路线，而是选择预测式世界模型，这在当时甚至还没有成为具身大脑领域的行业共识。</p>\n  <p>在有限数据条件下，我们希望能提高模型的数据利用效率、跨场景泛化能力以及在动态环境中的持续决策能力。</p>\n  <p>另一点也很关键。开放式场景里的动态随机性干扰，恰恰是Transformer架构的强项；机器人不能只根据当前输入生成一次动作，还需要根据新的观察不断更新对环境的判断。这要求模型不仅具备多模态信息和时序关系的建模能力，还要具备较强的跨场景泛化能力。</p>\n  <p>我们选择预测式世界模型，是希望通过学习与任务相关的状态表征和变化规律，让机器人能够预测行动可能带来的结果，并在动态环境中持续调整决策和规划，减少对固定场景和既有数据分布的依赖。这些因素叠加在一起，支撑了我们的技术判断。</p>\n  <h2><strong>做本体不应该成为融资工具</strong></h2>\n  <p><strong>硬氪：作为机器人智能基础设施提供方，你们怎么理解整机厂商选择外部智能底座的真实诉求？客户通常有哪些顾虑？</strong></p>\n  <p><strong>高海川：</strong>整机厂商最大的顾虑，其实是生态位冲突。一个本身有B端客户、有本体品牌的厂商，在选择大脑时，如果发现供应商也有本体品牌，哪怕只是存在潜在的竞争可能性，这个合作大概率就谈不下去了。这不是技术问题，是信任问题。</p>\n  <p><strong>我们希望通过适配不同形态的机器人，降低本体厂商在智能能力上的重复研发和适配成本，帮助合作伙伴更快完成产品落地，而不是跟伙伴们去争夺本体品牌或终端客户。</strong></p>\n  <p><strong>至于做本体这件事，在国内或许有它特殊的融资价值，甚至在某些阶段可以变成一张“复活卡”。这本身就是行业浮躁的缩影，不是技术逻辑，是资本逻辑。</strong></p>\n  <p><strong>硬氪：机器人的矛盾在于，实验室Demo指标很漂亮，一旦迁移到真实物理世界，性能就可能出现断崖式下滑。要实现大规模商业化复制，最大瓶颈到底是算法、工程适配，还是真实物理场景的数据闭环？</strong></p>\n  <p><strong>高海川：</strong>算法经过这么多年迭代，能力储备其实已经相对充足。当下真正的瓶颈，是数据还没有真正到位。在算力、算法、数据这三要素里面，算力与算法基本已经就绪，真正拖慢脚步的是数据供给。</p>\n  <p>机器人的数据稀缺，是这个赛道独有的困境。物理世界的真实数据，只能依靠机器人实体去主动采集，这和大语言模型完全不一样。语言模型可以继承互联网几十年沉淀下来的海量公开文本；但机器人领域并没有经历过大规模人工操控机器人、沉淀大规模物理交互数据集的历史阶段。</p>\n  <p>没有这份先天积累，过去行业才被迫把希望更多寄托在算法和算力之上，但数据短板绕不开，必须寻找新解法。</p>\n  <p>这是我们必须认清的现实，<strong>机器人行业不存在所谓的ChatGPT时刻。不会出现某一个单点技术突破，就带来全赛道瞬间爆发的拐点。</strong>行业的前进路径，只能是由一个个真实场景驱动，循序渐进完成市场渗透。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260213/v2_9ca6398121f64a87813edf2fcc5defc8@6022551_oswg108580oswg1704oswg1278_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载千诀世界模型的机器人自主执行餐桌清洁任务（图源/企业）</p>\n  <p><strong>硬氪：如何判断哪些机器人能力可以跨本体复用，哪些能力天生就无法跨本体迁移？</strong></p>\n  <p><strong>高海川：</strong>目前行业基本上已经形成共识，任务规划、对客观物体交互逻辑的理解可以跨本体。不管是带机械臂的四足机器人，还是人形机器人的机械右手，抓取杯子这件事背后，对杯子会如何发生位移、如何被外力改变状态的认知是相通的。它回答的是“杯子会被如何操作”，而不是“我这个躯体该怎么去操作杯子”。</p>\n  <p>而“我该怎么操作杯子”，也就是对应执行器本体控制的部分，是和硬件形态深度绑定的。无论是四足、无人机还是人形机器人，本体的运动控制逻辑完全不同，这一部分无法直接跨本体迁移。</p>\n  <p>“一脑多形”这套跨本体复用模型的能力上限，由���据底座决定。即便模型架构设计足够先进，一旦缺少对应分布的数据支撑，真实场景下任务成功率会出现显著下滑。千诀希望将任务理解、环境认知和决策规划等共性能力沉淀下来，根据不同本体的能力边界进行组合和调整，在提高复用效率的同时，保留对具体执行系统的针对性适配。</p>\n  <p><strong>硬氪：从产业侧来看，B端客户并不关注VLA、世界模型等技术路线差异，现阶段具身智能商业化落地的核心评判标准和真实客户诉求是什么？</strong></p>\n  <p><strong>高海川：</strong>产业客户根本不关心你用的是VLA还是世界模型，他们在乎的是：这东西能不能让我少雇一个人？能不能让仓库的拣货错误率降下来？具身智能落地，本质上就是在解决这些琐碎而具体的问题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260213/v2_361db1c7c152490fb88c9b856dbe6b35@6022551_oswg2171413oswg1536oswg1024_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">千诀预测式世界模型（图源/企业）</p>\n  <p>举个例子，我们给酒店做的机器人，任务就是从脏衣篓里把衣服捡出来放进洗衣机。这个动作听起来简单，但要稳定运行、不卡壳、不夹衣服、适应不同材质和叠放状态，里面全是工程细节。客户不会因为你用了多先进的预测式世界模型就多付一分钱，他只看这个活儿干得漂不漂亮、故障率高不高、值不值这个价。</p>\n  <p>再比如，一个能整理鞋柜、捡纸团、找手机的机器人，放在人形上可能卖20万，但用户的实际感知价值也就3000块。这中间的落差就是落地最真实的困境。对千诀来说，研发可以朝最酷的方向走，但产品推向市场的时候，必须把它裁剪到用户愿意掏钱的那个形态。</p>\n  <h2>“我首先要考虑商业现实，其次才是搞技术的”</h2>\n  <p><strong>硬氪：从清华实验室的课题组到创业，你个人最大的思维转变是什么？哪些事情是创业之后才被现实重新教育的？</strong></p>\n  <p><strong>高海川：</strong>如果还停留在实验室做学术研究，大家的评价标尺是很简单、很纯粹的，就是看算法、看论文、看技术路径能不能跑通，追求把技术本身做到极致。但创业之后，这套评价体系完全变了。</p>\n  <p>我一直觉得，我首先要考虑商业现实，其次才是搞技术的。当然，并不是说技术不重要，而是创业者必须对产品、客户和商业结果负责。千诀团队里有不少博士，但我们做的不是学院派创业——我们既做底层学术研究，也做工程转化，但研究不能脱离真实需求，而要与机器人在实际场景中面临的问题相互验证。</p>\n  <p>在商业世界，拿下真实落地的客户才算胜利，单纯的算法突破不算胜利。再好的技术，如果落不到真实场景，拿不到客户认可，就没有实际价值。</p>\n  <p>具身智能赛道的概念更新迭代很快，资本热度也会带来大量的外部噪声。作为企业管理者，需要去分辨哪些是真正有价值的技术演进，哪些只是市场炒作出来的故事，守住我们的路线，不会被外界热点带着随波逐流。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260907/v2_6be13a668d3a4efb994fedeb89e82ba5@6022551_oswg170088oswg1707oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高海川（左四）和千诀团队在办公室合影，摄于2023年（图源/企业）</p>\n  <p><strong>硬氪：一批具身本体企业逐步迈入上市窗口期，资本也在期待大脑、模型、数据层跑出独立的上市公司。上市卡位会影响千诀的技术路线选择与内部资源倾斜策略吗？</strong></p>\n  <p><strong>高海川：我们不会把上市时间作为决定技术路线和资源配置的首要因素。资本市场能够为企业带来资金资源支持，但一家技术公司的长期行业位置，决定它能走多远的，永远是技术本身、产品能力和落地效果。</strong></p>\n  <p>市场上存在一个普遍误区，就是会过度放大“上市时间窗口”的决定性作用。客观来讲，IPO本身并不能锁定企业的行业站位。</p>\n  <p>现阶段，具身赛道最核心的矛盾并不是资金缺口，而是真实商业场景的落地。上市能带来品牌背书，但对场景拓展的直接拉动作用相当有限。只有当行业完成技术收敛、竞争核心彻底转向资本博弈时，上市才会成为决定性变量。但在当下，核心矛盾依然是场景。</p>\n  <p>不可否认，资本市场会基于上市预期对不同技术路线给出差异化估值定价。<strong>但当前整个具身赛道并不缺钱，资本的边际效用已经明显下降。</strong></p>\n  <p>我们的策略是牢牢锚定主干技术路线，不发生摇摆，同时对各类细分方向算法能力做融合吸收，而不是被外部资本叙事牵着走、绑架技术选择。</p>\n  <p><strong>硬氪：目前，具身赛道资本叙事的热度跟商业化落地的进度之间存在明显温差，业界普遍存在泡沫焦虑，你如何看待这种市场情绪？</strong></p>\n  <p><strong>高海川：</strong>行业热度的起伏，更多是资本周期在起作用，不完全是企业基本面的映射。站在当下去看，确实到处都有问题；但拉长到产业演进的尺度上，很多阶段性难题会随着时间自行消解。</p>\n  <p>对企业来说，既不能因为资本热度高就盲目扩张，也不能因为市场进入调整期就否定长期价值。关键是区分哪些事情需要长期坚持，哪些事情需要快速验证。要建立速决战的思维，别陷入消耗型的持久战。</p>\n  <p>依赖泡沫红利扩张的企业，在资本退潮的时候会受到剧烈冲击，业务惯性太大，想调头已经来不及了。千诀从一开始就没有跟随泡沫叙事，这几年下来，内部也形成了速战速决的惯性，不管资本环境冷还是热，我们始终按自己的节奏在跑。这不是一种策略选择，而是一家企业能否持续运转下去必须具备的底层能力。</p>\n  <p><strong>硬氪：随着行业逐步脱离表演叙事，更加看重真实场景闭环，据你们观察，尚未解决的共性卡点主要集中在哪些地方？</strong></p>\n  <p><strong>高海川：</strong>现在大家确实不迷信展台Demo了，都在追真实闭环，还有几道绕不过去的坎需要被解决。</p>\n  <p>首当其冲，肯定还是数据问题。真机采集成本太高，仿真数据只能辅助替代不了真实交互。域外泛化更难，数据不到位，模型再好换了新场景也容易失效。</p>\n  <p>其次是大脑小脑的协同和跨本体适配，目前还没有统一的工程解法。不能幻想着一套模型通吃所有硬件。换形态的工程成本依然很高。</p>\n  <p>第三，技术范式本身还没收敛。关于\"世界模型\"定义差别很大，论文Demo的效果跟真实商业落地之间的差距依然明显。</p>\n  <p>第四，技术理想和商业现实经常错位。Demo可以展示能力上限，但客户看的是价值跟价格是否匹配。高端原型很强，落地就要裁剪简化到大众能接受的价位。市场教育、客户心智这些非技术因素，也会拖慢速度。</p>\n  <p>最后，是如何平衡前沿研发和商业化交付。不能把未经充分验证的技术直接交给付费客户，商用版本必须稳健；但企业也不能全扑短期项目，放弃底层探索。怎么分配资源、怎么区分实验室版本和交付版本，这是所有企业都要持续解决的问题。</p>", "category": "tech", "published_at": "2026-09-08T02:00:00+00:00", "fetched_at": "2026-09-08T02:47:26.419533+00:00", "fingerprint": "d9fe6137c0cce379"}, {"source": "少数派", "title": "定义了 Apple 10 年的白色产品：iBook G3 Snow 怀旧手记", "url": "https://sspai.com/post/114103", "summary": "在金属机身成为 Mac 产品线标配的今天，让我们重温这台 2001 年的 iBo strong>运营商晒iPhone 18售价，折叠版预计14999元起</strong></p>\n  <p>9月5日，海外运营商沃达丰泄露定价数据，iPhone 18系列涨幅约10%远低于此前传闻的大幅抬价，Pro版美版起售价仅涨约100美元，首款折叠屏iPhone Ultra美版约1999-2099美元，测算国行预计Pro版9999元起、折叠版14999元起。（快科技）</p>\n  <p><strong>财政部将发行特别国债，支持8家中央金融企业补充资本</strong></p>\n  <p>财政部将于近期发行3000亿元特别国债，支持8家中央金融企业补充核心一级资本。当日，工商银行、农业银行、进出口银行、中国信保、中国人保、中国人寿集团、中国太平、中国再保等8家中央金融企业分别发布了增资计划。业内人士表示，此次财政部对8家中央金融企业增资，属于“未雨绸缪”的前瞻性安排，是支持中央金融企业高质量发展、助力宏观经济行稳致远的主动作为。</p>\n  <p>保险方面，财政部向中国人寿保险（集团）公司注资350亿元，向中国人保定向增发募集不超过150亿元，向中国太平注资70亿元，三家合计570亿元。此次注资将有效增强保险机构的风险抵御能力，推动偿付能力等关键指标稳健提升，夯实长期可持续发展根基。</p>\n  <p>银行方面，工商银行拟募资不超过1000亿元，其中财政部认购700亿元，中国烟草及其关联企业认购300亿元；农业银行拟募资不超过1600亿元，其中财政部认购1300亿元，中国烟草、地方烟草及双维投资等认购300亿元。两家银行募集资金在扣除发行费用后，将全部用于补充核心一级资本。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI称需要扩大对齐失范事件的披露范围</strong></p>\n  <p>OpenAI：针对模型能力发展的新阶段，我们需要扩大对齐失范事件的披露范围。目前，我们以及更广泛的人工智能行业，尚未建立明确标准，用以报告在训练、评估以及部署阶段出现的对齐失范问题。其中既包含不属于传统安全事件，但有助于理解人工智能行为、预判未来风险的各类案例。我们正在搭建一套相关框架，将在未来数周对外公布；与此同时，我们正就上述问题与全球数十家政府监管机构开展协作。（新浪财经）</p>\n  <p><strong>Kimi、MiniMax即将在天猫开店</strong></p>\n  <p>智谱电商平台首店落地天猫后，Kimi、MiniMax、阶跃星辰等多家大模型厂商也都在与天猫接洽中，未来将入驻天猫开设官方旗舰店，开售Token订阅套餐产品。（上证报）</p>\n  <p><strong>Anthropic预计9月底才公布招股说明书</strong></p>\n  <p>媒体引知情人士报道，Anthropic预计将在美国11月中期选举开始前的几天完成上市。报道称，两名知情人士透露，招股说明书预计要到9月底才会公布，而不是按照此前时间表最早于下周发布。知情人士还表示，包括上市时间在内的相关计划仍可能发生变化。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>玛莎拉蒂回应被曝与华为合作：不对市场传闻或猜测发表评论</strong></p>\n  <p>日前，据媒体报道，Stellantis集团正就旗下豪华品牌玛莎拉蒂与华为、江淮汽车开展长期产业合作谈判。9月4日，另有媒体报道称，双方已进入深度磋商阶段，计划将华为鸿蒙智行平台应用于玛莎拉蒂车型，目标是2027年底推出首款联合开发的量产车。报道还提及合作模式或将采用双品牌策略：该车型在中国市场以尊界豪华品牌销售，面向全球市场则挂玛莎拉蒂车标。</p>\n  <p>9月5日，Stellantis集团亚太区执委会成员、传播副总裁王超回应：“作为正常业务运营的一部分，Stellantis集团持续与全球行业伙伴就不同议题保持沟通与交流，始终致力于为客户提供最佳的出行解决方案。我们不对市场传闻或猜测发表评论。正如此前所宣布的，玛莎拉蒂品牌的未来战略及发展规划将于今年12月在意大利摩德纳（Modena）举办的投资者日活动上正式公布。在此之前，我们不对任何相关市场传闻或猜测作进一步评论。”（每日经济新闻）</p>\n  <p><strong>lululemon股价“腰斩”，超23亿美元市值蒸发</strong></p>\n  <p>9月4日美股lululemon股价跌17.38%，创八年多来新低，超23亿美元市值蒸发。今年以来，该股累计跌幅已超52%。此前一天，lululemon发布2026财年第二季度财报，在第二季度，公司全球净营收为24.16亿美元，同比下降约4%；按固定汇率口径下降5%。净利润为3.29亿美元，低于去年同期的3.709亿美元。</p>\n  <p>这3.29亿美元净利润里藏着一笔意外之财——当季公司确认了1.345亿美元的IEEPA关税退款及410万美元相关利息，为每股收益贡献了约0.86美元。剔除这笔一次性收益后，调整后EPS约为2.06美元，同比实际降幅超过三成。（每日经济新闻）</p>\n  <p><strong>紫金矿业就财报文字错误致歉</strong></p>\n  <p>近日，紫金矿业（HK2899）2026年半年度中被发现多处基础性文字错误引发热议。</p>\n  <p>9月5日，紫金矿业（HK2899）发布《关于定期报告财务报表附注部分相关文字错误的更正公告》。公告称，经核查，上述错误不涉及定期报告中的财务数据、会计科目及经营指标，不会对公司已披露各期定期报告的真实性、准确性、完整性产生实质影响。紫金矿业（HK2899）表示，“公司谨向投资者和相关单位致以诚挚歉意。后续，公司将进一步完善内部信息披露管理制度，严格校核审批流程，同时加强与年审会计师事务所的沟通协调，避免此类问题再次发生。”（新浪财经）</p>\n  <p><strong>泡泡玛特王宁到访LVMH集团总部，集团掌门人率家族成员接待</strong></p>\n  <p>据新浪科技消息，近日，泡泡玛特创始人王宁和LVMH集团主席兼CEO Bernard Arnault（贝尔纳·阿尔诺）在法国巴黎LVMH集团总部会面，这也是二人首次会面，王宁还现场赠送阿尔诺一只拉布布。据悉，王宁现场赠送阿尔诺的是MEGA LABUBU 十周年纪念款，属于全球限定发售款式。据了解，一同参与会面的还有LVMH集团大公主、迪奥Dior首席执行官Delphine Arnault（德尔菲娜·阿尔诺）以及LVMH集团核心高管、LV全球CEO Pietro Beccari（皮埃特罗·贝卡里）。（新浪科技）</p>\n  <p><strong>多国推进黄金储备本土化布局</strong></p>\n  <p>全球多国都在加快调整黄金储备存放布局，降低对欧美单一托管体系的依赖。自2013年起，多国陆续启动海外黄金储备回迁。世界黄金协会2026年央行黄金储备调查显示，过去12个月里，19%的央行提高了国内黄金储备比例，或者把储备地点做了多元化配置，一年前这个比例只有7%，寄存于纽约、伦敦金库的央行数量持续减少。（CCTV国际时讯）</p>\n  <p><strong>问界回应“预制车”传闻：纯属谣言，已报案</strong></p>\n  <p>针对近期网络上有关问界M6某车型为“预制车”、“穿越车”的传闻，问界汽车发文表示，通过对车辆识别代号核实查证，该车辆的实际制造年月为“2026-7”，相关自媒体账号所发布或转载的车辆铭牌信息系经过P图或AI修改生成的虚假信息，由此而产生的公司生产“预制车”“穿越车”的说法纯属谣言。该公司表示，网络不是法外之地，目前其已保留证据并向公安机关报案。（财联社）</p>\n  <p><strong>A股再现主动退市，多元化退市格局持续完善</strong></p>\n  <p>2026年，A股主动退市已现三起案例。从年初德邦股份成为年内首家主动退市公司，到瓦轴B因控股股东发起全面要约收购而私有化退市，再到8月底“彩电第一股”*ST康佳A拟以股东会决议方式主动撤回A股和B股上市，主动退市成为这些上市公司“不约而同”的选择。“主动退市在法律上是一种止损策略。”广东华誉品智律师事务所郭嗣彦律师对记者表示，对于*ST康佳A这类困境企业，主动退市可为公司保留更多自主权，为后续资产重组或引入战略投资者创造更灵活的空间。（上证报）</p>\n  <p><strong>国内首款AI辅助创新药获批上市</strong></p>\n  <p>据西湖大学消息，由西湖大学、西湖实验室、西湖制药联合研发的创新药——盐酸伊司特韦片（商品名：艾普司韦）近期正式获得国家药品监督管理局附条件批准上市。这是西湖大学首款完全自主研发的1类创新药，用于成人轻型、中型新型冠状病毒感染的治疗。1类创新药是中国药品注册分类中的最高级别，代表从0到1的源头创新，其核心在于拥有全新的化学结构、全新的作用机制，且具备明确的临床价值。（财联社）</p>\n  <p><strong>就业超预期引爆加息恐慌，比特币失守8万</strong></p>\n  <p>据Woofun AI消息，周五美国公布的就业数据大幅超越市场预期，直接触发市场对美联储维持紧缩政策的担忧，Bitcoin价格随即跌破80,000美元关口。宏观流动性收紧预期迅速传导至衍生品市场。9月加息25基点的概率由52%跃升至59%。Woofun AI整理数据显示，2年期美国财政部债券收益率飙升7.6个基点，10年期与30年期分别上行3.2个基点和1个基点；美元指数（DXY）上涨0.3%至99.3点。高收益率提升了美元资产吸引力，而强势美元则加剧了加密资产的融资成本，形成双重压制。（新浪财经）</p>\n  <p><strong>“国家反诈AI”APP上线</strong></p>\n  <p>为进一步提升防范电信网络诈骗工作的信息化、智能化水平，帮助群众有效识诈防诈，近日，公安部刑侦局指导，上海市公安局自主研发的“国家反诈AI”APP正式上线。 “国家反诈AI”APP融合了大语言、多模态模型和智能体技术，用户通过手机输入可疑场景，该APP即可完成风险研判、识别诈骗套路、推送典型案例，从“文字+语音+视频”等多个维度拆解诈骗手法，提供识别防范对策。（新华社）</p>\n  <p><strong>特斯拉股价重挫近6%，市值一夜蒸发近6000亿元</strong></p>\n  <p>截至9月4日（周五）美股收盘，特斯拉股价大幅收跌，报354.08美元/股，跌幅达5.92%，盘中最大跌幅超6%，收盘市值13985亿美元，较上一个交易日蒸发约880.5亿美元（约合人民币5909亿元）。消息面上，美东时间周四，Cybercab（赛博无人驾驶电动车）正式在美国奥斯汀投入运营，而在美国得克萨斯州奥斯汀举行的Cybercab活动上，由于披露的新信息有限，未能满足投资者预期。这场活动仅限受邀者参加，没有现场直播，首席执行官马斯克也未现身。此外，美国国家公路交通安全管理局（NHTSA）当天对约1000辆Cybercab展开监管审查，重点审查特斯拉用于证明车辆符合联邦机动车安全标准的流程及技术数据。（每日经济新闻）</p>\n  <p><strong>韩国今年累计出口额7094亿美元破纪录</strong></p>\n  <p>韩国关税厅最新统计显示，截至9月5日下午1时，韩国今年累计出口额为7094亿美元，超过去年全年的7093亿美元历史最高纪录。据韩国方面消息称，今年尽管面临中东局势等严峻外部环境，但在半导体带动下，韩国主要出口品类保持增长。今年前8个月，韩国半导体出口额为2812亿美元，同比增长169.6%。半导体在整体出口中所占比重达到40.6%。（证券时报）</p>\n  <h2>投融资</h2>\n  <p><strong>AI初创公司Gimlet完成3亿美元融资</strong></p>\n  <p>AI初创公司Gimlet完成3亿美元融资，由Andreessen Horowitz领投，估值达30亿美元。���财联社）</p>\n  <h2>酷产品</h2>\n  <p><strong>特斯拉Robotaxi下月或实现全天候运营</strong></p>\n  <p>9月6日消息，特斯拉AI负责人Ashok Elluswamy日前在社媒平台X称，特斯拉Robotaxi自动驾驶无人出租车距离“实现24小时全天候运营”已经不远。他表示，待“v15计划中的下一项技术”完成整合后，24小时全天候运营将在“下个月左右”上线。 目前特斯拉Robotaxi服务在美国已实现每周7天运营，运营时间为每天6时至22时，覆盖奥斯汀、达拉斯、休斯敦、迈阿密、奥兰多和坦帕等城市。（新浪财经）</p>\n  <p><strong>整理</strong>｜何雨婷</p>", "category": "tech", "published_at": "2026-09-07T00:01:50+00:00", "fetched_at": "2026-09-07T02:34:28.088435+00:00", "fingerprint": "573d54d243bb7552"}, {"source": "少数派", "title": "让 Apple Watch 记录的每一趟游泳数据更有意义：即刻游", "url": "https://sspai.com/post/114076", "summary": "对于使用AppleWatch游泳的人来说，记录一次游泳并不困难。在手表上打开体能训练App，选择开始游泳，结束后就能在Apple健身中看到完整的游泳表现，包括时间、距离、卡路里、配速、心率等数据。但真 ...<a href=\"https://sspai.com/post/114076\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-06T07:00:00+00:00", "fetched_at": "2026-09-07T02:34:26.487643+00:00", "fingerprint": "720a9bf308d81129"}, {"source": "少数派", "title" tps://36kr.com/p/3968898900095491?f=rss", "summary": "<p>PEL夏季赛圆满收官，赛场烽烟落幕，但电竞热爱永不降温，对于职业选手和满怀期待的玩家们来说，新的旅程也即将开启。</p>\n  <p>9月11日，由斗鱼与《和平精英》联合推出的电竞直播综艺《PEL奇遇时光三亚篇》将正式开启。本次直播内容集结了全明星阵容，PEL明星选手带队，斗鱼平台头部主播及优质电竞KOL齐聚三亚，将在碧海椰林之间展开一场持续四天的海岛竞技之旅。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_2732ab58e9204a7ebc0de73420fe06f2@16519798_oswg1423082oswg1155oswg650_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《PEL奇遇时光三亚篇》</p>\n  <h3><strong>PEL全明星阵容齐聚三亚，海岛冒险之旅启程</strong></h3>\n  <p>《PEL奇遇时光三亚篇》将由TEC·33Svan、深圳STE·芷田、杭州KSG.吒宝、杭州LGD·猫猫四位PEL职业选手带队，集结职业选手、斗鱼主播、电竞KOL、专业主持多重圈层嘉宾，在椰林海风间组队迎接各类挑战，阵容含金量拉满，队员间的化学反应值得期待。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_e0b27e9cf40d48f8909c034a5f13750c@16519798_oswg2163903oswg2136oswg948_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">明星选手齐上阵</p>\n  <p>浙江RSG无痕、福州NV·Ydd、4AM·mingskr、LTG魏无羡、TJB·白小纯等一众实力人气PEL职业选手；惜兮未曦CCVC、若若跑的贼快、艾琳、百变姑姑肖淑洁等斗鱼平台头部人气主播；Dy花老湿、苏哲、武子弈、幸福等知名KOL及PEL专业主持小鱼也将全程参与，全员齐聚三亚，解锁沉浸式海岛奇遇电竞之旅。</p>\n  <h3><strong>四天高强度挑战自我，冒险奖杯花落谁家？</strong></h3>\n  <p>9月11日-14日的四天时间里，嘉宾们将参加神秘⼈“P岛主”特设的奇遇冒险杯赛，以组别为单位展开“奇遇冒险杯”的竞技之旅。赛程层层递进，分别从团队协作、体力意志、综合素养与全局策略四大维度展开角逐，搭配阶梯式现金的奖励方式，充分调动每位嘉宾的竞技热情与胜负欲。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_89931b9ec567412a941a79cdbbc5ef1a@16519798_oswg926273oswg1198oswg649_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《PEL奇遇时光三亚篇》</p>\n  <p>9月11日开播首日，全体嘉宾正式集结三亚，开启破冰互动，通过雷神小赛、PEL团队运动会等趣味比拼，快速拉近队员距离，凝聚团队默契。值得一提的是，队员中将安排三名卧底全程隐匿身份完成专属任务，四天赛程里卧底是否被成功识破揪出，也将直接左右最终战队成绩与比赛结果。</p>\n  <p>次日，四大战队将迎来体能与意志的试炼，以海上5KM接力赛为重头戏，沙滩热身、室内游戏及和平精英手游对抗赛轮番登场，从体能挑战到电竞赛场，全方位考验选手的爆发力、耐力与临场抗压能力。第三日则继续跳出传统电竞赛场，以趣味料理王大赛为核心，考验各战队的统筹规划能力、团队配合度与临场创意，解锁选手与主播赛场之外的不同魅力。</p>\n  <p>收官日将在水上乐园开启终极策略博弈，迎来卧底指认环节，最终决出本次奇遇冒险之旅的“精英冒险队”。紧张刺激的竞技对抗过后，松弛治愈的全员狂欢之夜将为整场活动画上圆满句号。直播期间，平台还将开放在线投票通道，观众可自主投票选择挑战内容，全程参与节目进程，让每一轮比拼都充满未知与惊喜，大幅提升节目互动性与观赏性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_5c38b0e63d5344f5abf5cb7a36b4d171@16519798_oswg921564oswg1075oswg603_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《PEL奇遇时光三亚篇》</p>\n  <p>此前，斗鱼《和平精英冒险之旅》已先后走过长白山、阿勒泰、舟山等地，邀请选手、主播们来到线下，结合地域特色推出了一系列内容丰富的直播节目。本次落地三亚，《PEL奇遇时光三亚篇》内容升级，平台继续发挥以游戏为核心的社区优势、主播生态及内容运营能力，通过优质PGC内容持续深化厂商合作，并为广大电竞爱好者带来更加新鲜有趣的内容体验。</p>\n  <p>当“特种兵”化身“冒险家”，嘉宾们将在椰风海韵里碰撞出怎样的新鲜火花？9月11日至9月14日，锁定斗鱼官方直播间，一同见证这场南国奇遇冒险吧。</p>", "category": "tech", "published_at": "2026-09-05T08:00:00+00:00", "fetched_at": "2026-09-06T02:36:45.150927+00:00", "fingerprint": "f565113ef9f5c63e"}, {"source": "36氪 - 最新文章", "title": "别谈具身和AI，欧洲不相信「黑科技」｜直击IFA 2026", "url": "https://36kr.com/p/3970179970036225?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>2026年9月，柏林的初秋被雨水浸透，展览中心灰色的建筑群在晨光里安静展开，像一台刚启动的精密设备。在这座信奉“工程师文化”的城市，习惯用确定性和流程感丈量一切。</p>\n  <p>想看点不同寻常产品的人，来IFA会非常失望。</p>\n  <p>你看不到会飞的扫地机，场馆里也没有人形机器人做家务。大门外，招牌最醒目的仍然是赞助商常客TCL。</p>\n  <p>科技记者、自媒体人大概率会有些无聊，但如果你是个经销商、或者想为新家添置一些新家电，来这里一定能找到解决方案。</p>\n  <p>活动现场，我们随处可见带有IFA图标的彩色背板，“The future is now.”这句标语被挂在展馆的许多角落，字样格外显眼。</p>\n  <p>但IFA是个实用主义的展会。每台设备旁边都贴着技术参数卡和适用场景说明，法国用户手握着扫地机地盘，反复对比抹布结构差异，确认机械臂的实际作用；还有专门从荷兰、澳洲飞来的经销商围着一台割草机，半蹲下身研究底盘刀片。它是企业们做生意、找客户的场地，不是秀技术肌肉的展示台。</p>\n  <p>围观的人最爱问的只有一句话：你这个产品到底现在能解决什么问题？</p>\n  <p>所以，任何还想做海外市场的企业，不能也不敢缺席IFA。 根据IFA展会官方统计，今年共有928家中国内地企业参展，加上84家香港展商，中国参展商总数突破千家，在1900多家参展商中占比近半。这个数字同比2025年增长了近35%。它热度仍然很高，我们去德国参会的签证提前一个月跨城申请，而平常淡季，通常只需要半个月。</p>\n  <p>即便人潮涌动，这里还是少了一些新闻。不同于拉斯维加斯CES的兴奋和炫目，IFA的气质是另一种色彩，它严肃、克制、务实。在柏林这个古老的城市，举办了102年的IFA还是那样平静稳定，一切都不慌不忙。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_34f4ec6a51cf4301b9d94ef8abf4b169@6022551_oswg117673oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">IFA场馆外追觅广告大屏（图源/硬氪拍摄）</p>\n  <h2>别聊AI和具身，告诉我怎么割草地</h2>\n  <p>对穗升科技创始人王时远来说，IFA并不是陌生的战场。过去很多次，他是以安克高管的身份站在这里，熟稔地操盘着这套中国硬件出海不可缺席的标准打法。</p>\n  <p>直到2026年柏林，他换了一重完全不一样的身份，作为一家初创AI硬件公司的创始人，守在相比以往并不算大的展位上。</p>\n  <p>身份切换带来的视角冲击很强烈。他依旧能看到熟悉的展会喧嚣，也读出了完全不一样的市场信号。</p>\n  <p>欧洲似乎被抛在AI浪潮之后。一个很微妙的细节反复在展位上演：当他用国内惯常的话语体系聊AI Agent、Memory硬件概念时，现场观众的反应普遍迟缓，很难快速理解。他只能说：“这能用AI搭建一个属于你自己的全天知识库”，对方立刻开始追问具体怎么用、数据怎么存、能不能适配现有工作流。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_1a57450aa8b546edbc5f26345ade34ba@6022551_oswg82879oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">穗升科技展台上，王时远与海外用户交流（图源/硬氪拍摄）</p>\n  <p>而国内追逐了整整两年的“具身智能”热潮，在IFA现场几乎找不到回声。</p>\n  <p>走进任何一个机器人品牌的展台，基本听不到世界模型、空间智能这类词汇。展台屏幕上循环播放的不是机器人翻跟头的炫酷动作，而是割草机在雨后湿滑的斜坡上停住、扫地机的机械臂探入桌椅腿缝隙、擦窗机器人紧贴弧形玻璃边缘滑过。</p>\n  <p>一位参展商半开玩笑地向硬氪总结道，“在深圳，你要是不在PPT里写两页‘具身智能’，投资人都不理你；但在柏林，你要是不把草坪割好，用户当场就走人。”&nbsp;</p>\n  <p>这句话背后，是一整套关于技术叙事明显的区域性差异。</p>\n  <p>欧洲用户经历了一次身份转换。未岚大陆欧洲业务总经理Ryan Kong向硬氪表示，其人群属性正从“技术关注者”转变为“体验结果关注者”。</p>\n  <p>“现场用户的提问方式彻底改变，他们不再追问技术原理，而是细致到问每个零件怎么影响割完的草坪效果。”Ryan Kong说。</p>\n  <p>过去几年，割草机器人赛道迭代速度极快，每代产品都能带来肉眼可感知的体验升级。随着渗透率抬升，欧洲用户正逐步完成从“找产品”到“找体验”再到“找品牌”的认知演进。以德国为代表的高渗透率市场，已经率先进入第三阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_62c2b306258740fbbb0187b3eb6bc66c@6022551_oswg225165oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">未岚大陆展台上的模拟草坪（图源/硬氪拍摄）</p>\n  <p>这种变化直接反映在今年的IFA展台设计上。未岚大陆不再只讲无边界、三合一导航这些概念，而是开始讲“刺猬”。在欧洲自然保护意识盛行的背景下，把“避开刺猬”纳入产品叙事，意味着品牌开始从技术参数的比拼转向满足当地的价值主张。</p>\n  <p>库犸则在展区梳理了一条十年四代产品的演进路径，直观展示每一代产品所解决的具体问题：能不能爬坡、会不会滑下来、边角能不能割干净。“用户先是学会了用真实使用效果评判产品好坏，然后才具备辨别品牌差异的能力。”库犸全球品牌负责人Angel表示。割草机器人的竞争，正在从技术参数的比拼转向体验承诺的交付。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_c8a570b79ff644f1b9a86dc8cd7f3098@6022551_oswg223428oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">库犸展出消费级及商用级割草机器人、泳池机器人（图源/硬氪拍摄）</p>\n  <p>耐士劳的展台叙事今年也发生明显转向，户外庭院生态微缩场景成为展示重点。割草机器人穿行于模拟果园，通过自主规划路径，展示复杂环境下的稳定定位与自主导航能力；通过现场草坪场景的爬坡演示大坡度工况下的运动控制能力。消费级产品外，耐士劳今年还首次展出了商用割草机器人，产品版图从家庭庭院延伸至高尔夫球场、足球场等专业草坪场景。</p>\n  <p>这些转变直接体现了企业在IFA的投入逻辑。品类教育走向成熟，对参展厂商来说，其核心目标不再是渠道拓展，而是借助展会直观让用户感受到，这些产品足够可靠、实在。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_8fc07b7fba31409eb4adafd903d45f9a@6022551_oswg150659oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐士劳割草机器人产品矩阵（图源/硬氪拍摄）</p>\n  <p>“技术到底解决具体客厅、院子里的什么真实问题，才是欧洲市场评判好坏的唯一标尺。”追觅扫地机器人业务总裁孟佳告诉硬氪。</p>\n  <p>“这里几乎没有人会问我们，扫地机搭载的究竟是哪家供应商的雷达，也几乎没有人追问背后用了什么AI大模型。”孟佳发现，欧洲媒体和经销商问的问题往往更直接，比如“机械臂能伸进桌椅腿多深”“蒸汽拖地杀的是什么菌”等细节，用户也更关心“能不能避开宠物的呕吐物”。</p>\n  <p>这些琐碎的问题在柏林展馆里或许显得“不够前沿”，但却足够具体、直接，指向的是一种高度务实的决策习惯，用户和渠道把产品拆解成一个个真实场景中的具体动作，逐一验证它的可用性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_13191162556c44a5a3c3f7d786c64081@6022551_oswg135880oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">追觅展出系列扫地机器人产品（图源/硬氪拍摄）</p>\n  <p>隔着幕墙的另一个世界，国内舆论正热烈讨论具身智能、世界模型、AI大模型落地。柏林展馆里，人形机器人大多安静地站在角落，像一个技术点缀，而不是故事主角。</p>\n  <p>沿着展馆一路走过去，扑面而来的是一种笃定的务实感。黑白电品牌占据了最大面积的展位，TCL、美的、海信的展台被布置成完整的厨房或客厅场景，冰箱、烤箱、洗碗机、洗衣机依次排开，参展观众可以直接拉开门，摸一摸内壁的材质，感受一下关门的手感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_fc4b24ccd92b4979abbbb4388dcea0da@6022551_oswg113483oswg1080oswg750_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">TCL展台上（图源/硬氪拍摄）</p>\n  <p>手机配件、储能电源、办公设备等这些以往在国内展会、CES上被被匆匆略过的背景板，没什么话题性，也谈不上新鲜感。但在IFA，它们分布在各自独立的场馆内，品类划分清晰明确：你想找什么类型的产品，顺着路牌走过去就能找到。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_8a415aa5834f405aa736bac19462ea4d@6022551_oswg107080oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">穗升科技展出的AI Memory硬件Memoket（图源/硬氪拍摄）</p>\n  <p>产品摆在台面上，标签写着参数和价格，像一份安静的货架目录。概念和原型在这里并不受欢迎，展厅里多数展台陈列着成熟、确定、已经量产的产品。</p>\n  <p>技术名词在欧洲市场更多扮演着帮助用户理解的“解释工具”角色，而非“营销卖点”。&nbsp;</p>\n  <p>AI硬件公司和具身智能，零星分布在各个角落。相比家电厂商动辄几百平的展区，它们大多只是一个格子间、一张桌子、几台样机。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_be3d4c4235bb418fa91e3ee324684384@6022551_oswg96975oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">CyboPal桌面机器人（图源/硬氪拍摄）</p>\n  <p>Looki展台上，几台穿戴相机错落陈列。现场工作人员没有过多展开AI算法或Agent功能的介绍，只用一句话让路过的参观者停下脚步，“这是一台旅行记录相机，你戴着它出游、逛展、参加聚会，它就能自动帮你完成记录。”另一边，观众的好奇也跟此前如出一辙，更关心实实在在电池续航、存储扩容、极端环境下可靠性等问题。</p>\n  <p>追觅在IFA 2026现场搭建了一个完整的家庭场景，用ECHO S1单臂轮式机器人演示了一套完整的家务流程，从识别散落的脏衣物、打开洗衣机门、依次放入滚筒、自动设定洗涤程序并启动。整个过程中，没有炫技式的空翻或舞蹈，只有与日常生活直接相关的动作链条。</p>\n  <p>我们基本没有看到人形机器人，连头部公司银河通用也只是摆了几台不能动的样机。少数还有动作的机器人，包括魔法原子展台一只套着熊猫外壳的四足机器人。因为“可爱”，它吸引了一些视线，但它周围的参观者最关注的问题还是：“这个东西什么时候能上市？”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_534485628e33456b9be3c68c6d62df3c@6022551_oswg125656oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">魔法原子展台的“熊猫”在演示中（图源/硬氪拍摄）</p>\n  <h2>中国公司必须在场</h2>\n  <p>柏林展览中心内，中国厂商的展位越铺越广，各家发布会和现场演讲也越办越密。</p>\n  <p>但展台背后的故事已经发生变化。</p>\n  <p>过去，中国企业参加IFA的目标很单纯：刷存在感、见渠道、拿订单。展会是一支大喇叭，把产品信息广播出去就行。</p>\n  <p>如今，出海竞争白热化。在欧洲这样重视线下经销商系统的区域，中国公司要到现场才能抓住它们的诉求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_48bba233d6db48dcadb94c9dc7cbe776@6022551_oswg153058oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">海外观众在清闲智能上试用动态人机工学椅（图源/硬氪拍摄）</p>\n  <p>“以前欧洲渠道商关注‘性价比’，现在越来越看重‘质价比’，你的品牌是不是可靠、产品是否真正符合欧洲本土用户的使用习惯，关系到大家能合作多久，以及未来几年渠道的生意该怎么做。”孟佳说。</p>\n  <p>这也是IFA在媒体上没太多声量，但厂商们挤预算也要参展的关键原因。欧洲终究还是一个保守的市场。欧洲渠道商还没有形成去中国选品牌的习惯，所以IFA带来的本地化线下触达，是一笔必须承担的显性成本。“如果只看本地服务价格，会觉得性价比不高，但这个成本必须花，没有办法去计算性价比。”科沃斯相关负责人告诉硬氪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_7e12cac99dca408ab83a26ade0f6d8bf@6022551_oswg149862oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">科沃斯&amp;添可展台上，现场观众试用洗地机（图源/硬氪拍摄）</p>\n  <p>不过，在投入逻辑集体转向效率的当下，IFA的价值坐标正在被重新定义，从“让更多人知道我”，转向“让关键的人信任我”。展位面积不再是衡量投入的标尺，真正的竞争发生在展馆之外。</p>\n  <p>“欧洲渠道不会因为一封邮件或者线上投放就接纳你，做生意首先要成为对方的‘朋友’，建立信任圈。”云鲸智能全球品牌负责人Icey Bin说。云鲸今年在IFA展馆附近独立举办了品牌发布会，定向邀请全球媒体和渠道伙伴。</p>\n  <p>说到底，欧洲不是靠小投入赌爆款的地方。会场上的交流和展示只做到了“被看见”，但能不能真正登上KA卖场货架，背后是整套本地化能力，不是靠一次展位搭建就能完成。</p>\n  <p>IFA结束后，真正的考验才刚刚开始。欧洲渠道商要求的“质价比”比想象中更严苛，合规认证的清单比想象中更长，售后服务的投入比预估中更重。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_8defd718508d4bd1b42dd2479bd87c36@6022551_oswg145745oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸2026秋季全球品牌发布会现场（图源/硬氪拍摄）</p>\n  <p>美的相关负责人也告诉硬氪，对美的而言，IFA是“长期经营欧洲市场的重要触点，而不是一次孤立的营销活动”。这种定位决定了它的评估方式，“不是展位面积有多大，不是现场签了多少单，而是客户沟通质量、品牌影响力和后续业务机会。”</p>\n  <p>说到底，欧洲不是靠小投入赌爆款的地方。会场上的交流和展示只做到了“被看见”，但能不能真正登上KA卖场货架，背后是整套本地化能力，不是靠一次展位搭建就能完成。IFA结束后，真正的考验才刚刚开始。欧洲渠道商要求的“质价比”比想象中更严苛，合规认证的清单比想象中更长，售后服务的投入比预估中更重。&nbsp;&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_092e60a681ad4dd79a5f6671d1fbb61f@6022551_oswg154517oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">影石展位上出现了巨大的X6模型机（图源/硬氪拍摄）</p>\n  <p>当然，对于以穗升科技为代表的创业公司，IFA的价值更为直接。预算有限，它们无法在展馆核心位置拿大展位，但IFA的全球辐射力天然地充当了精准流量的过滤器。</p>\n  <p>王时远告诉硬氪，仅9月4日一天，就有数十个渠道商直奔他们展位。这些渠道商中既有德国本地代理，也有来自南欧、东欧、中东、菲律宾甚至日本的渠道商。其中一位日本代理商完全不会讲英文，两个人就那么“拿着手机，讲一句翻译一句”，依然坐下来聊了很久。</p>\n  <p>对于初创公司而言，这种精准流量的转化效率，往往比展位大小更能决定参展的实际价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260905/v2_6b34a19cffaf4125a563ec0c88f72b90@6022551_oswg148042oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;浩瀚在现场搭建的微型景观（图源/硬氪拍摄）</p>\n  <p>柏林傍晚六点，展馆开始清场，人员陆续离场。灯光渐次暗下来，广播里用德语和英语循环播放着闭馆通知。</p>\n  <p>“The Future is Now”的彩色背板还立在展厅入口，醒目依旧。在欧洲，“未来”似乎有不同的意味。这里似乎慢了半拍，但在其他地区的人跟随者AI狂奔时，IFA的温吞却代表另一种市场仍然存在：有些无聊，节奏太慢、但更审慎，某些时刻甚至让人有更多安全感。</p>\n  <p>几天前，王时远特意去柏林最大的消费电子零售卖场MediaMarkt实地走访，发现偌大的门店里，“只有一个AI产品，就是Meta的眼镜”。</p>\n  <p>他能感知到一个强烈的市场信号：AI硬件在欧洲仍处于极其早期的阶段。“这里面竞争相对小，但需求大，”他说，“机会才刚刚开始——不，应该说，还没真正开始。”</p>\n  <p>IFA开幕时，ChatGPT发布新模型。世界还在向前狂奔，但在柏林，这些展馆里的企业，决定抛掉那些遥远的故事。它们回到商业的起点，一单一单地把生意做下去。</p>", "category": "tech", "published_at": "2026-09-05T11:00:00+00:00", "fetched_at": "2026-09-06T02:36:45.150914+00:00", "fingerprint": "f801f8dd652259da"}, {"source": "少数派", "title": "最值得买的顶级公路车？TREK 八代 Madone 评测", "url": "https://sspai.com/post/114040", "summary": "它没有卷到极致的轻量化，也没有最极端的气动数据，但综合实力稳稳站在顶级公路车的第一梯队。<a href=\"https://sspai.com/post/114040\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-05T08:00:01+00:00", "fetched_at": "2026-09-06T02:36:43.631379+00:00", "fingerprint": "d1cc99152fc6eb0e"}, {"source": "BBC World News", "title": "UN votes to adopt new world map to reflect Africa's true size", "url": "https://www.bbc.co.uk/news/articles/ce30vp55dnlo?at_medium=RSS&at_campaign=rss", "summary": "The Togo-sponsored resolution was backed by 164 nations - with the US as the only nation to vote against it.", "category": "politics", "published_at": "2026-09-05T00:53:11+00:00", "fetched_at": "2026-09-05T02:40:05.701812+00:00", "fingerprint": "3e9e18fb16b0ab11"}, {"source": "BBC World News", "title": "Europe targeted by spiralling campaign of sabotage - and Russia is the chief suspect", "url": "https://www.bbc.co.uk/news/articles/c5y4g6meekro?at_medium=RSS&at_campaign=rss", "summary": "Germany has blamed Russia for an attack on Leipzig airport but there has been a series of suspicious incidents elsewhere.", "category": "politics", "published_at": "2026-09-04T16:49:15+00:00", "fetched_at": "2026-09-05T02:40:05.701807+00:00", "fingerprint": "9465fb417d50df5c"}, {"source": "BBC World News", "title": "Trump's peace envoys to visit Moscow and Kyiv over weekend", "url": "https://www.bbc.co.uk/news/articles/c23x0z48x0no?at_medium=RSS&at_campaign= theverge.com/gadgets/990425/gopro-nick-woodman-starman-letter", "summary": "GoPro CEO Nick Woodman said in a letter to customers that making cameras is still his company's \"core DNA,\" after a proposed $285 million acquisition by Starman was announced earlier this week. He claims the merger puts GoPro in a better position to continue developing its content creation tech, after saying in the deal announcement [&#8230;]", "category": "tech", "published_at": "2026-09-04T18:00:45+00:00", "fetched_at": "2026-09-05T02:40:04.302587+00:00", "fingerprint": "cb40d44592507eac"}, {"source": "The Verge", "title": "The White House is making arcade games racist", "url": "https://www.theverge.com/policy/990520/trump-arcade-games-maga-copyright", "summary": "The PR masterminds at the White House just released a series of vaguely policy-themed \"arcade\" games, some of which are racist - and modeled on real games whose copyright holders may not be too happy to be associated with the MAGA agenda. The Tetris Company has already responded to \"Build the Wall,\" which is obviously [&#8230;]", "category": "tech", "published_at": "2026-09-04T19:42:54+00:00", "fetched_at": "2026-09-05T02:40:04.302582+00:00", "fingerprint": "84cc6f131818be7c"}, {"source": "The Verge", "title": "Audacity 4 is a complete revamp of the ‘world’s most popular’ audio editor", "url": "https://www.theverge.com/tech/990658/audacity-4-update-audio-editing", "summary": "Audacity 4 has been in the works for some time, and had its own mini controversy last year when an unfortunate redesigned logo started making the rounds. The final version of the new icon isn't nearly as bad as the early rendition that was circulating last October. But more importantly, all the promised improvements to [&#8230;]", "category": "tech", "published_at": "2026-09-04T21:23:50+00:00", "fetched_at": "2026-09-05T02:40:04.302572+00:00", "fingerprint": "15d18e641db586c8"}, {"source": "36氪 - 最新文章", "title": "IFA 2026前线｜蓝海赛道下的内卷现实，科沃斯如何回答全球化与具身智能考题", "url": "https://36kr.com/p/3968822489198851?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>2026年柏林，IFA 2026展会现场，家用机器人成为中国硬件军团的一大看点。扫拖地、擦窗、庭院割草、泳池维护等多品类机器人集中展出，覆盖场景从室内延伸至户外，从地面拓展至立面与水面。</p>\n  <p>其布局变化也折射出整个家用机器人行业近年来的演变趋势，从单一品类的纵深突破，走向全场景、多品类的平台化竞争。</p>\n  <p>当地时间9月3日，IFA开幕前一天，福布斯行业评估报告发布，正式将科沃斯评定为全球NO.1家用机器人品牌，综合得分8.56分。这份评定不只看市场份额，它考察的是一个更完整的维度，全球化运营的纵深、多品类商业化的落地能力、从上游供应链到下游品牌端的技术与渠道壁垒。</p>\n  <p>放眼全球大盘，家用服务机器人的增长逻辑依旧成立。IDC报告数据预测，2026年中国清洁机器人市场规模接近34亿美元，同比增长18%。其中，中国厂商出货量占全球份额85%以上，从供应链到产品定义，中国硬件公司正在深度主导这条赛道。</p>\n  <p>国内市场的现实体感形成反差。2026上半年，国内扫地机器人销额同比下滑4.0%，销量同比下滑4.6%。</p>\n  <p>一边是长期广阔的增量空间，一边是国内市场短期遇冷、成本抬升的现实压力。国内家庭扫地机器人渗透率仅5-7%，已经被充分教育的存量用户成为争夺的核心。</p>\n  <p>在这一背景下，2026年上半年，科沃斯实现营收利润双位数增长，总营收达103.41亿元，同比增长19.18%；净利润12.48亿元，同比增长27.40%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_8cb1e70dbc044b8588d9f61477a16d79@6022551_oswg4022625oswg2198oswg1468_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">科沃斯扫地机器人在IFA 2026上展出（图源/企业）</p>\n  <p>财报数字的背后，科沃斯的解法落在三个相互关联的方向：加快业务重心在海外市场布局、复用成熟技术栈拓展家庭多场景硬件、搭建完整技术底座去迎接物理AI时代。</p>\n  <p>海外业务是支撑科沃斯本轮增长最核心的变量。数据显示，科沃斯上半年海外收入占品牌总营收49.0%，二季度首次突破51.0%，这是品牌成立近三十年来海外收入首次反超国内。</p>\n  <p>具体业务端，科沃斯主品牌海外营收同比上涨46.5%，添可海外营收同比增长40.6%；擦窗、割草、泳池机器人等新兴品类海外增速尤为突出，营收同比增幅达到75.1%。</p>\n  <p>海外市场的爆发不是短期流量红利，真正的全球化不等于“把货卖出去”，而是产品、供应链、服务整套体系适配全球市场。</p>\n  <p>2015年前后，科沃斯确立了产品本地化思路，针对不同地区的住宅环境和使用习惯进行定制化适配，并将其形成了一套“3S”技术框架，即Space（空间感知）、Setting（场景理解）和Service（服务交付）。</p>\n  <p>科沃斯集团副董事长、科沃斯机器人CEO钱程在IFA 2026演讲中指出，第一层是空间感知；机器人需要具备基础的感知能力，借助雷达与传感器技术，以厘米级、毫米级的精度对室内外环境进行测量与建图，这是后续一切决策的前提。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_7aa5b2d6c8f84d55b221bf2e9497ed7a@6022551_oswg4697609oswg2222oswg1490_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">科沃斯集团副董事长、科沃斯机器人CEO钱程（图源/企业）</p>\n  <p>第二层是场景理解。室内与室外、厨房与卧室、有无宠物的家庭，不同空间对机器人的任务要求截然不同。当AI识别出地板上的污渍或家中有宠物时，扫地机会自动调整清洁策略，提升吸力或切换清扫模式。场景感知能力让机器人从“执行指令”进化到“理解环境”，并根据环境变化自主调整行为。</p>\n  <p>第三层是服务交付。空间与场景的认知不止于室内。户外草坪在不同地区差异，比如欧洲南部的草种与北欧不同，美国与澳大利亚的草坪养护习惯也各有特点；泳池的形态、材质、布局同样千差万别。只有深入理解这些细分场景的具体差异，才能为不同市场提供真正适配的产品与服务。</p>\n  <p>全球化打开外部增长空间，而同源技术驱动的多品类布局，则挖掘家庭内部的增量。</p>\n  <p>科沃斯的品类扩张并非无逻辑跨界。扫地机器人迭代十年沉淀下的感知、导航、避障、运动控制能力，正在被系统性地复用到更多家庭任务中。</p>\n  <p>窗宝是这套复用逻辑下最先跑通的品类。扫地机在地面识别障碍物的避障算法，被迁移至立面场景用于识别窗框、把手与玻璃边缘；应对地毯和门槛的越障动力，则复用为窗宝爬坡和跨越窗框的控制基础。这套迁移支撑窗宝连续三年全球市场第一，拿下65%的市占率，2025年销量突破100万台，2026上半年已成为百万级独立品类。</p>\n  <p>同样，割草机器人GOAT将室内复杂家居环境下的导航避障能力，迁移至开放庭院，从识别地面数据线、宠物粪便，延展为识别树木、花坛和户外家具；SLAM算法从室内二维地图升级为庭院三维建模。泳池机器人ULTRAMARINE则将路径规划算法从泳池水面迁移至水下环境，避障逻辑复用自窗宝对立面异形结构的识别经验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_1be8734e159c499689b70d96fc3eff50@6022551_oswg5724779oswg2252oswg1494_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">科沃斯割草机器人GOAT（图源/企业）</p>\n  <p>三个新品类，共享同一个技术底座。从地面到立面、庭院、泳池，科沃斯完成的是技术能力的横向迁移，而非盲目的品类堆叠。</p>\n  <p>但家用机器人的想象空间远不止工具，具身智能落地正在重写人们的想象边界。</p>\n  <p>科沃斯正基于服务机器人测试其自研的“世界模型”，大模型承担人机交互的沟通接口，借助人类的先验知识与语言引导，辅助机器人完成物理世界的动作，优先实现可落地的产品形态。</p>\n  <p>在此基础上，公司也推出有仿生陪伴机器人“毛团儿”、开源具身机器人平台“八界”，加速从确定性家务工具，延伸到人机交互、具身智能的前沿领域探索。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_348d09bcd095455e9f5d2c1e8ec59bb6@6022551_oswg3159931oswg2262oswg1494_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">科沃斯仿生陪伴机器人“毛团儿”（图源/企业）</p>\n  <p>今天，福布斯的行业评级、中国厂商包揽全球扫地机销量前列，标志国内家用机器人产业完成从跟随者到行业定义者的身份跃迁。但定义赛道不等于解决全部难题。</p>\n  <p>行业竞争正在从单一硬件的参数比拼，转向多场景机器人体验的全面较量，并进一步延伸至AI物理执行能力的深层竞争。这条赛道的落地周期，远比市场想象的更为漫长。</p>\n  <p>回到IFA 2026现场。擦窗机器人沿着玻璃立面安静攀爬，割草机器人在模拟庭院中自动规划路径，泳池机器人潜入水下清理壁面，这几类形态各异的机器并列展出，勾勒出科沃斯对“家庭”的理解：不仅是地面，立面、庭院、泳池甚至未来的陪伴空间，都应该被机器人覆盖。</p>\n  <p>用对空间与场景的持续理解，把“让机器人服务每个人”从一句话，拆解成一个个具体品类，再交付到全球不同家庭的日常生活中。这不是一场短跑，而是一场没有终点的长跑。</p>\n  <p>对于已经在行业里行进了二十余年的公司而言，在不确定中保持耐心、在长周期里持续投入，本身就是这门生意的常态。</p>", "category": "tech", "published_at": "2026-09-04T09:51:31+00:00", "fetched_at": "2026-09-05T02:40:04.156381+00:00", "fingerprint": "87df4c9e64afc064"}, {"source": "36氪 - 最新文章", "title": "BP海投了三个月，投资人还是不知道你干什么", "url": "https://36kr.com/p/3968905217536264?f=rss", "summary": "<h3>项目很多，真正容易被读懂的并不多</h3>\n  <p>今天缺的不是创业项目。新产品、新技术、新品牌、新模式每天都在出现。对投资人、产业方和潜在客户来说，信息越多，筛选越贵。他们真正要判断的，从来不是你讲得激不激动，而是这几个更硬的问题：这个问题是否真实存在？客户为什么非用你不可？产品已经验证到哪一步？和市场上已有方案相比，差异是不是可被理解的？团队凭什么有机会把这件事做成？</p>\n  <p>现实里，不少团队不是没有内容，是内容散在各处。技术放在一堆参数里，客户案例埋在聊天记录里，进展写在内部周报里，商业逻辑只存在创始人脑子里。对外一讲，要么过技术、要么过愿景，就是过不了“让人一次看懂”这一关。</p>\n  <p>有的项目把篇幅堆在技术细节上，商业价值却没讲清；有的已经有付费客户，材料里却拼不出完整业务闭环；还有的其实到了阶段性进展，只因为缺少一次公开、克制、专业的表达，行业外部很难建立认知。价值和表达之间，隔着一道很难自己跨过去的沟。「项目推荐」要做的，就是把这道沟填短：不是帮你编一个更响的故事，而是把已经存在的产品、客户、进展和判断，整理成符合行业阅读习惯的内容。</p>\n  <h3>一次结构化提报，比从零写文章更重要</h3>\n  <p>第一次把项目讲给外人听，本来就不容易。团队内部觉得“这还用解释吗”，外部第一次接触的人却缺背景。于是材料越写越长，重点越来越糊。</p>\n  <p>「项目推荐」因此把提报做成结构化采访，而不是让你交一篇命题作文。项目方围绕企业基本情况、产品与服务、目标客户、行业市场、商业模式、竞争优势、发展阶段这些关键问题作答。先把真实情况说全，再谈表达。</p>\n  <p>随后AI参与信息整理和初稿生成，降低第一次公开表达的时间成本。但AI不是终点。项目内容仍要经过人工审核。因为一篇项目内容的核心不是辞藻，是真实性、逻辑性和信息价值。AI适合处理大量信息、理清结构、提升效率；编辑负责内容边界和基本质量。两者加在一起，项目方才能用更低的沟通成本，完成一次相对完整的公开表达。最终出来的，不是一份自我介绍，而是能让外部读者快速建立认知的项目内容：你是谁，你在解决什么，做到哪了，为什么现在值得被看见。</p>\n  <h3>一篇项目内容，可以变成长期资产</h3>\n  <p>很多创业公司在不同阶段重复做同一件事：向投资人发BP，向客户介绍产品，向产业方寄资料，向合作伙伴解释模式。每一次都要重新组织语言。如果企业已经有一套相对完整、经得起公开阅读的内容，这些沟通会轻很多。投资人可以先建立基本判断，FA介绍项目时有公开信息可引用，园区、孵化器和产业服务机构对外推荐时也不必只靠口头转述。</p>\n  <p>对还在做品牌建设的早期公司，这一点尤其重要。市场认知不只来自投放。一次清楚的行业表达、一篇能被外部理解的项目内容，同样是在积累信任。所以「项目推荐」要解决的，不是“今天发不发一篇稿”，而是帮项目逐步形成自己的公开内容资产。这份资产会跟着公司走。融资时它是前置阅读材料，招人时它是业务说明书，谈合作时它是背景页。清楚，本身就是竞争力。</p>\n  <h3><strong>现在，向36氪提交你的项目</strong></h3>\n  <p>如果你正在创业，或者正在服务一批值得关注的创业项目，无论是项目方、FA、投资机构、园区、孵化器还是产业服务机构，都可以通过36氪「项目推荐」提交项目。</p>\n  <p>经过项目信息审核后，符合内容要求的项目将进入后续内容生产与发布流程。</p>\n  <p>如果你的项目已经有产品、有客户、有技术积累、有商业进展，或者正在验证一个新的行业机会，那么现在，也许正是把它认真介绍给更多人的时候。</p>\n  <p><strong>免费提交项目链接：</strong><a href=\"https://36kr.com/seek-report-new\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>https://36kr.com/seek-report-new&nbsp;</strong></a></p>\n  <p><strong>36氪项目推荐联系邮箱：aireport@36kr.com</strong></p>\n  <p>客服可以扫描下方二维码联系~</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260827/v2_82444f25299549868e00ec8f9505810b@5284654_oswg124679oswg357oswg537_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加</p>\n  <p>让项目先把自己讲清楚。</p>\n  <p>至于它能够走多远，交给市场去回答。</p>", "category": "tech", "published_at": "2026-09-04T10:09:14+00:00", "fetched_at": "2026-09-05T02:40:04.156377+00:00", "fingerprint": "1e975f018397f1f7"}, {"source": "36氪 - 最新文章", "title": "🌟 拒绝单打独斗，来线下“抓”活的AI搭子！36氪AI·OPC全国奇幻漂流发车", "url": "https://36kr.com/p/3968954216821248?f=rss", "summary": "<p>每天几百个新模型，自己关在屋子里摸索实在太心累。为了让大家把好AI真正“用起来”，36氪AI平台正式发起OPC（一人公司）全国系列线下聚会，目前已经开到了全国12个主要城市。</p>\n  <p>我们不想搞那种在台上干巴巴念PPT的单向输出。这次，每个城市的主理人都准备了完全不同的“限定盲盒”玩法，主打一个真诚、硬核，甚至有点野生：</p>\n  <p>☕️ <strong>也许是一场不吐不快的 Coffee Chat</strong></p>\n  <p>大家点杯美式，吐槽哪些AI工具是智商税，顺便交换一下压箱底的神仙工作流，看看怎么把最趁手的工具无缝塞进日常业务里。</p>\n  <p>💰 <strong>也许是一场毫无保留的“搞钱局”</strong>&nbsp;</p>\n  <p>拒绝画大饼，直接复盘那些真正拿到结果的真实案例。怎么低成本跑通你的第一个MVP（最小可行性产品）？第一批客户到底去哪找？怎么定价和交付？同行直接把底牌掀给你看。</p>\n  <p>💻 <strong>也许是带电脑直接上的硬核工作坊或资源局</strong>&nbsp;</p>\n  <p>缺运营找运营，缺技术找技术。甚至带你现场开脑洞，一点点拆解AI到底是怎么挤进五花八门的传统行业和冷门岗位的。</p>\n  <p>不管你是正在跑业务的独立开发者、自媒体狂人，还是脑子里刚冒出个点子想验证，只要你想摆脱孤军奋战，想认识点懂行的同路人，这里都有你的位置。</p>\n  <p>这里不灌鸡汤，只讲人话。带着你的真问题来，拿走能落地的下一步。</p>\n  <p>👇 <strong>选定你的城市，看看主理人们准备了什么惊喜？下滑扫码或点击表单，抢个前排座位。AI时代的野蛮生长，我们线下见！</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_60fbfca67edf42c58454a1273d9c02e0@6430009_oswg8135oswg400oswg400_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">北京活动详情</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_0ed2e1fee8c8449eb1dece91ffd37dfc@6430009_oswg8176oswg400oswg400_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">上海活动详情</p>\n  <p><strong>（各个城市陆续补充中，请大家持续关注！）</strong></p>", "category": "tech", "published_at": "2026-09-04T10:31:20+00:00", "fetched_at": "2026-09-05T02:40:04.156371+00:00", "fingerprint": "45b787bd275e60fe"}, {"source": "36氪 - 最新文章", "title": "万千气象北京行：走进朝阳区时尚消费产业", "url": "https://36kr.com/p/3969230710583555?f=rss", "summary": "<p>9月4日上午，由中央网信办网络社会工作局、北京市委网信办主办，新京报贝壳财经承办的“中国式现代化的万千气象”网络名人北京行活动来到朝阳区。网络名人一行先后来到首创郎园STATION、泡泡玛特城市乐园。</p>\n  <p><strong>多元消费显生机</strong></p>\n  <p>在首创郎园STATION，网络名人们走进AIGC视频产品创新中心。屏幕上播放着精美的短片，它们有的场景宏大，有的角色生动，有的充满奇幻创意，这些都是采用AIGC制作方式生成的内容。创新中心构建了“软件+硬件+应用+服务”的全产业链生态体系，打造面向全行业开放共享的公共服务平台，助力世界产业提质增效。</p>\n  <p>创新中心里，AIGC视频产业发展链路徐徐展开。从基模到特效、资产、成片，海螺AI、墨境天合、优酷、爱奇艺、鼎盛嘉禾等公司的创意成果令人目不暇接。网络名人们在观影厅中沉浸式观看了鼎盛嘉禾出品的短片，屏幕上的画面拥有4K的清晰度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_50c9ffc27bee4b6ca7fdae24ff37a72d@1200352198_oswg146634oswg2048oswg1280_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人们观看AIGC影片）</p>\n  <p>漫步园区，装潢风格各异的店面映入眼帘。网络名人们走进“珐璞乐时”，来自景德镇的陶器陈列眼前，陶艺之美从景德镇来到北京。在它的不远处，“有海以后”是一个集合咖啡与潜水的综合空间，它提供33米深的城市潜水池，主视觉中海洋的蓝色和沙滩的金色相互交织。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_2ec3ec14e9c8417d8c7fed5cd254ad43@1200352198_oswg161037oswg1817oswg1280_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人们在“有海以后”）</p>\n  <p>郎园SATION中，餐饮、出版、娱乐等行业的创意在这里落地，城市消费的多元可能正在迸发。</p>\n  <p><strong>时尚创新促活力</strong></p>\n  <p>在泡泡玛特城市乐园的入口，映入眼帘的是充满童趣与奇幻氛围的喷泉装置。在这里，泡泡玛特将其潮玩形象带进现实生活，游客们可以走进LABUBU的精灵部落，在PIPPO的佳酿小屋开怀畅饮，品味TYCOCO的喷气实验室里改良的爆米花。</p>\n  <p>在入口处领取集章护照，网络名人们开启了本次泡泡玛特城市乐园之行。乐园设有火车游览、海盗船、跳楼机等游乐项目，另有多个嘉年华游戏和园区表演。网络名人坐上旋转木马，登上海盗船，在“幸运球大冒险”、“欢乐投递”、“金币捞趣”等游戏中大显身手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_2d4b4a475faf42c59433003653376330@1200352198_oswg241093oswg1872oswg1280_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人们体验嘉年华）</p>\n  <p>园区内，随处可见满载而归的人，他们拿着形色各异的泡泡玛特玩偶，这是参与嘉年华游戏获得的奖品。在这里，与偶遇的NPC打招呼，有机会收获即兴互动与贴纸奖品，还可以看到园区设立的精彩表演。</p>\n  <p>泡泡玛特城市乐园展示了IP与粉丝更深入的连接方式，让消费者成为故事的一部分。创新的时尚形式提供新的消费场景，也令朝阳区充满活力。</p>", "category": "tech", "published_at": "2026-09-04T15:13:03+00:00", "fetched_at": "2026-09-05T02:40:04.156364+00:00", "fingerprint": "142dbfad791d2a97"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨大众汽车宣布全球裁员10万；月之暗面据悉计划今年在香港进行IPO；国家统计局：全国打工人周均工作48.2小时", "url": "https://36kr.com/p/3969804742111746?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>苹果Face ID技术被控专利侵权</p>\n  <p>持股市值超100亿，腾讯成燧原科技IPO最大赢家</p>\n  <p>字节新一代豆包手机采用长鑫科技LPDDR5X内存</p>\n  <p>美国零售柴油价格创历史新高</p>\n  <p>消息人士：玛莎拉蒂正与华为、江淮汽车洽谈合作项目</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>大众汽车全球裁员10万</strong></p>\n  <p>北京时间9月4日，受大众集团宣布重组计划消息影响，大众汽车股价大涨近10%，截至发稿，涨幅回落至5%左右。消息面上，据《中国汽车报》报道，北京时间2026年9月4日，大众汽车集团监事会在德国沃尔夫斯堡召开专项会议，全票通过首席执行官奥利弗·布鲁姆提出的“未来计划”全面重组方案。该方案历经数月内部博弈与多方阻力终于获批，标志着大众集团近年力度最大的结构性改革正式进入落地实施阶段。本次重组围绕降本增效、产能优化、产品迭代、人力调整多维展开。人员优化方面，大众在原有规划基础上再裁5万个全球岗位，累计裁员规模达10万人，主要通过自愿离职、自然流失、岗位整合方式推进，平稳化解用工调整压力。（21世纪经济报道）</p>\n  <p><strong>月之暗面据悉计划今年在香港进行IPO</strong></p>\n  <p>月之暗面据悉计划今年在香港进行IPO，寻求募资至多50亿美元。（财联社）</p>\n  <p><strong>全国打工人周均工作48.2小时</strong></p>\n  <p>据国家统计局数据，今年7月全国企业就业人员周平均工作时间为48.2小时。在互联网与新兴产业密集的城市，不少大厂白领在采访中表示，下午往往是一天工作中最容易“不在状态”的时段，随着工作时间累积，疲惫感和注意力下降更加明显。《劳动午报》此前报道，从人体生理节律来看，下午3点至6点处于人体状态容易波动的时段。合理调整工作节奏、保障必要休息，才能让劳动者保持更好的工作状态，在效率与健康之间找到平衡，正在成为数字时代职场发展的新共识。（宁波晚报）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>ChatGPT、Grok、Claude集体宕机后服务现已恢复</strong></p>\n  <p>当地时间9月3日，OpenAI旗下ChatGPT、SpaceXAI旗下Grok和Anthropic旗下Claude几乎同一时间开始出现大规模宕机事件，服务现已恢复。ChatGPT、Claude和Grok均在其服务状态页面表示故障已解决。（界面新闻）</p>\n  <p><strong>中国儒意推出AI产品Kaori Go，今年已推出三款AI产品</strong></p>\n  <p>36氪获悉，近日，中国儒意推出面向内容创作工作流的Kaori Go。此前，公司已推出主打互动内容生成的映火工场，以及此前6月16 日发布会亮相、专注动作资产提取的C-LIVE。三者分别落在内容生产的上游资产、中游流程与下游产品三个环节，拼成一条从真实素材到可玩内容的AI生产链路。</p>\n  <p><strong>知乎AI Works更新：支持应用一键部署</strong></p>\n  <p>36氪获悉，9月4日，知乎AI Works项目广场迎来重要更新，在新版本中增加项目一键部署功能。开发者可以在知乎上传完整的项目工程包，由平台承接云端构建和部署流程。AI Works不仅将复杂的部署操作优化为可反馈的产品流程，让上线过程更加简洁高效，而且提供多层安全检测和发布审核机制，确保项目符合相关规定和安全标准。今年6月，知乎AI Works正式上线，支持创建并发布AI项目，上线不到三个月，已沉淀超过2600个AI项目。</p>\n  <p><strong>Anthropic据悉接近敲定150亿美元的上市前信贷安排</strong></p>\n  <p>据知情人士透露，Anthropic PBC接近敲定将其循环信贷额度扩大至150亿美元，为这家人工智能公司在公开提交备受瞩目的IPO文件之前扫清了一道障碍。知情人士表示，摩根士丹利将负责牵头，高盛、摩根大通和花旗也将在信贷安排中担任重要角色。此前报道称，这四家银行同时也是此次IPO交易的主要承销商。知情人士此前表示，Anthropic希望通过此次IPO筹资规模达到甚至超过SpaceX。企业通常会在正式确定IPO承销银行分工前，先完成循环信贷安排。巴克莱和富国预计也将在该贷款中担任重要角色。（新浪财经）</p>\n  <p><strong>DeepMind与谷歌研究院推出WeatherNext 3全球气象AI模型</strong></p>\n  <p>DeepMind与谷歌研究院推出WeatherNext 3全球气象AI模型。（新浪财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>曾毓群“炮轰”速成车</strong></p>\n  <p>9月3日，在2026世界动力电池大会上，宁德时代董事长曾毓群发表主题演讲时“炮轰”新能源行业速成乱象。曾毓群表示，今年上半年国内新能源汽车销量超过740万辆，上市新车超过600款，平均每天接近三辆；还有些动力电池产品，出现了批量故障，触目惊心。“大家比速度、比参数、比价格，开发周期越来越短，但却以牺牲产品质量和消费者的信任为代价”。今年以来，“速成车”多次引发业内讨论。有数据显示，过去约54个月的汽车开发周期普遍缩短至18到24个月，有些甚至缩短到了12个月。一位自主品牌研发人员在接受界面新闻采访时表示，基于现有电动平台，一款新车型最快只需要6个月的开发时间就能投向市场，相当于上半年完成产品定义，下半年实现量产。（界面新闻）</p>\n  <p><strong>多国从美国运回黄金</strong></p>\n  <p>荷兰中央银行2日公布，该行今年3月至8月将约86吨黄金储备从美国纽约和加拿大渥太华转移至英国伦敦，以分散风险，做好危机应对准备。荷兰央行的新闻公报说，约59吨黄金通过在纽约市场出售、再从伦敦市场购入的方式实现转移，超过27吨黄金从美国和加拿大以实物形式运输至荷兰宰斯特，另有数量相当、符合国际市场标准的黄金从宰斯特转移至伦敦。今年4月，法国央行宣布，完成对存放于纽约多年的129吨黄金的替换。这批黄金自20世纪20年代末以来一直托管在纽约。德国在2013年至2017年间从美国运回了300吨黄金。德国央行目前在纽约仍存放1236吨黄金，约占其总储备的37%。（央视新闻）</p>\n  <p><strong>证监会开出2.3884亿巨额罚单</strong></p>\n  <p>证监会对元道通信股份有限公司及其时任董事长李晋、董事吴志锋、副总经理兼财务总监曹亚蕾的欺诈发行及信息披露违法行为作出行政处罚。经查明，2019年至2022年，元道通信通过虚构工作量确认单等方式虚增营业收入，其公告的证券发行文件中编造重大虚假内容，2022年年度报告信息披露存在虚假记载。</p>\n  <p>证监会决定对元道通信处以2.3884亿元罚款，对李晋处以750万元罚款并采取5年证券市场禁入措施，对曹亚蕾处以600万元罚款并采取4年证券市场禁入措施，对吴志锋处以300万元罚款。（财联社）</p>\n  <p><strong>特斯拉，市值一夜蒸发超6000亿元</strong></p>\n  <p>9月4日，美股开盘后，特斯拉股价大跌，跌幅一度超6.2%，市值1.39万亿美元，较上一个交易日的1.49万亿美元跌去约1000亿美元（约合人民币6778亿元）。美东时间周四，特斯拉在美国得克萨斯州奥斯汀举行发布会，正式发布量产版Cybercab无人驾驶出租车。这款车型采用双门双座布局，彻底取消了方向盘、油门刹车踏板和后视镜，完全依赖特斯拉FSD完全自动驾驶系统运行。在售价方面，Cybercab目标售价低于3万美元，每英里运营成本控制在0.2美元以内。摩根士丹利分析师安德鲁·佩尔科科（Andrew Percoco）在报告中指出：“如果周四的活动仅仅是一场揭幕仪式，实际投入使用的车辆数量有限，我们预计特斯拉股价将会下跌。（财联社）</p>\n  <p><strong>苹果，将迎史上最大规模产品发布潮</strong></p>\n  <p>科技记者马克·古尔曼发文称，苹果将在2026年至2029年推出大批新产品及升级产品，发布规模可能成为公司历史最大。苹果新任CEO约翰·特努斯将于9月9日首次主持新品发布会，预计推出新款iPhone和Apple Watch，这也将成为新一轮产品发布潮的开始。古尔曼称，苹果未来几年将推出折叠iPhone、首款触控屏OLED MacBook、带屏智能家居中枢、智能眼镜、配备摄像头的AirPods等新品，并持续更新iPad、Mac及Apple Watch等产品线。部分产品仍处于开发阶段，发布时间可能调整或取消。（财联社）</p>\n  <p><strong>美股开盘：三大指数涨跌不一，稀土股走高，Lululemon股价暴跌</strong></p>\n  <p>美股三大指数开盘涨跌不一，道琼斯指数跌0.32%，标普500指数跌0.13%，纳斯达克综合指数涨0.01%。Lululemon跌超19%，公司下调全年利润和销售预期后。地球成像公司Planet Labs涨超7%，公司第二季度营收超出市场预期。稀土股走高，MP材料公司、美国稀土公司、Critical金属公司涨超5%。（财联社）</p>\n  <p><strong>央行下周一将开展5000亿元买断式逆回购操作</strong></p>\n  <p>36氪获悉，为保持银行体系流动性充裕，2026年9月7日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为3个月（89天），到期日为2026年12月5日。</p>\n  <p><strong>苹果Face ID技术被控专利侵权</strong></p>\n  <p>据报道，巴斯夫子公司创迈思（trinamiX）当地时间9月3日在美国得州西区联邦地区法院提起诉讼，指控苹果iPhone 15至17系列、iPad Pro等产品所用Face ID技术侵犯其7项面部身份验证相关专利。诉状称，涉案技术源于巴斯夫2010年有机太阳能电池研究，后由2014年成立的创迈思持续研发，聚焦皮肤材质识别以防范照片及3D面具欺骗。创迈思要求苹果方面赔偿损失并停止进一步侵权行为，但未具体说明赔偿金额。（新浪财经）</p>\n  <p><strong>美光计划进行大规模设备投资，HBM产能有望翻倍</strong></p>\n  <p>据科创板日报援引媒体报道，美光计划在年底前进行大规模设备投资，以提升最新一代HBM——HBM4 12层产品的供应能力。此举旨在弥补其相较于三星电子和SK海力士在HBM产能方面的不足，从而提高市场份额。美光计划在今年年底前新增最多6万片/月的HBM产能（按晶圆计）。去年美光的HBM产量约为4万至5万片/月，以此计算，美光HBM产能将是去年的两倍有余。一位熟悉相关情况的业内人士表示：“美光正在进行大规模设备投资，以快速提升HBM4的生产能力。预计到今年年底，美光将拥有约10万片/月规模的HBM产能。”（财联社）</p>\n  <p><strong>曝西贝拖欠员工离职补偿金，贾国龙：2028年才能给</strong></p>\n  <p>9月4日，据新浪科技报道，西贝近日被曝拖欠离职员工款项，涉及2025年年终奖、离职补偿金及退股回购款。报道称，今年7月底，西贝方面向员工提出协议变更。调整后的方案为：2025年年终奖，于2026年年底前分5次支付，每次20%，有利息约定的，2026年7月1日前执行原约定，之后执行年息8%；离职补偿尚有部分金额未支付，自2026年7月1日起按年8%计息，2027年上半年支付15%，下半年支付15%，2028年上半年支付25%，下半年支付25%；股权转让价款尚有部分金额未支付，自2026年7月1日起按年8%计息，2028年12月31日前再根据业务恢复情况分期支付。贾国龙表示，要相信公司能缓过来，款项现在不能及时给，要等到2028年才能给。（新浪科技）</p>\n  <p><strong>古天乐公司被指欠债近1.3亿元，紧急回应</strong></p>\n  <p>近日，天下一电影制作公司以及创办人古天乐被追讨1.3亿元债务引发关注。9月4日，天下一电影制作公司发声明回应：原告提出的案情，并不完整，尤其是原告未有披露曾经被剔除公司注册并解散近三年时间，而期间我们一直无法联系到其授权负责人。再者，原告在案情中，作出违反无损害原则和受合约约束的披露，本公司对此保留追究权利，我们会与律师严肃处理此事。鉴于案件已进入司法程序，现阶段不便作进一步评论，感谢大家关注。（21世纪经济报道）</p>\n  <p><strong>持股市值超100亿，腾讯成燧原科技IPO最大赢家</strong></p>\n  <p>随着国产云端AI芯片龙头燧原科技正式开启科创板新股申购，作为公司第一大外部股东的腾讯成为此次IPO最引人注目的赢家。腾讯不仅通过旗下平台在战略配售中拿出2.48亿元获配174.71万股，更在IPO前通过腾讯科技（上海）有限公司直接持有燧原科技7726.70万股、占比19.9493%，是燧原科技第一大外部股东；加之其一致行动人苏州湃益持股0.3087%，腾讯系发行前合计持股20.2580%，发行后约20.26%。按发行价计算，腾讯系持有燧原科技的市值约126亿元。从Pre-A轮到IPO，腾讯连投6轮，叠加本次战配增持，让它成为获利路径最多元的参与者。（界面新闻）</p>\n  <p><strong>苹果备受期待的折叠屏iPhone目前初期日产量仅“数百台”</strong></p>\n  <p>消息人士称，苹果备受期待的折叠屏iPhone目前初期日产量仅“数百台”，主要原因是该公司执行极为严苛的品控标准。（新浪财经）</p>\n  <p><strong>字节新一代豆包手机采用长鑫科技LPDDR5X内存</strong></p>\n  <p>据媒体报道，字节与中兴联合研发的新一代豆包手机——努比亚NaviX Ultra，将搭载长鑫最高速率10667Mbps的LPDDR5X内存。官方表示，这也是国产10667Mbps高速LPDDR5X内存芯片首次实现量产落地应用。（财联社）</p>\n  <p><strong>消息人士：玛莎拉蒂正与华为、江淮汽车洽谈合作项目</strong></p>\n  <p>媒体援引知情谈判人士消息，斯特兰蒂斯集团旗下玛莎拉蒂正在与华为、江淮汽车展开磋商，拟在中国组建技术与产业联盟。该媒体称，相关协议尚未敲定，但合作目标是在2027年前实现全面落地。斯特兰蒂斯并未就其与华为、江淮的谈判作出详细置评，仅表示不对传闻发表看法，“作为常规商业活动的一部分，斯特兰蒂斯会与全球多家行业企业就各类议题开展沟通。”（新浪财经）</p>\n  <p><strong>美国零售柴油价格创历史新高</strong></p>\n  <p>伊朗战事与俄乌冲突扰乱全球市场，美国零售柴油价格创下历史纪录，能源推升的通胀压力或将进一步加剧。美国汽车协会数据显示，9月3日，这一应用广泛的燃料全美加油站平均零售价达到每加仑5.85美元。需求旺季即将到来，全球供应紧张局势持续演化，柴油价格就此超越2022年6月的历史高点。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>辛帕智能北交所IPO过会</strong></p>\n  <p>36氪获悉，北交所上市委员会召开2026年第82次审议会议。审议结果显示，上海辛帕智能科技股份有限公司符合发行条件、上市条件和信息披露要求。</p>\n  <p><strong>江波龙：H股发售价已厘定为每股236港元</strong></p>\n  <p>江波龙9月4日在港交所公告，发售价已厘定为每股H股236.00港元（不包括1.0%经纪佣金、0.0027%证监会交易征费、0.00565%联交所交易费及0.00015%会财局交易征费）。假设全球发售于2026年9月8日（星期二）上午八时正（香港时间）或之前成为无条件，则预期H股将于2026年9月8日（星期二）上午九时正（香港时间）在联交所主板开始买卖。H股将以每手50股H股为单位买卖。（界面新闻）</p>\n  <p><strong>天赐材料：香港联交所审议公司发行港股上市</strong></p>\n  <p>36氪获悉，天赐材料公告，香港联交所上市委员会于2026年9月3日举行上市聆讯，审议公司本次港股发行上市的申请。公司本次发行上市的保荐人已于2026年9月4日收到香港联交所向其发出的信函，其中指出香港联交所上市委员会已审阅公司的上市申请，但该信函不构成正式的上市批准，香港联交所仍有对公司的上市申请提出进一步意见的权力。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>lululemon第二财季净营收24亿美元，同比下降4%</strong></p>\n  <p>当地时间9月3日，lululemon公布截至2026年8月2日的2026财年第二季度财务业绩：净营收为24亿美元，同比下降4%，按固定汇率计算下降5%；净利润为3.292亿美元，即稀释每股收益2.92美元，同比下降6%。公司预计2026财年第三季度净营收将在22.90亿美元至23.20亿美元之间，下降10%至11%；稀释每股收益预计将在0.93美元至0.98美元之间。2026财年全年，公司预计净营收将在103.50亿美元至105.00亿美元之间，下降5%至7%；稀释每股收益现预计将在9.48美元至9.73美元之间。（界面新闻）</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>Cybercab，目标售价低于3万美元</strong></p>\n  <p>美东时间周四，特斯拉在美国得克萨斯州奥斯汀举行发布会，正式发布量产版Cybercab无人驾驶出租车。值得一提的是，虽然特斯拉过去通常会对重大产品发布进行直播，但这次发布会却异常“低调”：特斯拉并未进行任何直播活动，现场发布活动仅限受邀人士参加，受邀者还需签署保密协议，在发布会结束前禁止透露任何相关信息。据了解，这款车型采用双门双座布局，彻底取消了方向盘、油门刹车踏板和后视镜，完全依赖特斯拉FSD完全自动驾驶系统运行。在售价方面，Cybercab目标售价低于3万美元，每英里运营成本控制在0.2美元以内。（财联社）</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-09-05T00:57:02+00:00", "fetched_at": "2026-09-05T02:40:04.156351+00:00", "fingerprint": "bba7108cabbe2081"}, {"source": "少数派", "title": "在 16:10 屏幕普及的当下，聊聊那台最后的 4:3 版 ThinkPad T61p", "url": "https://sspai.com/post/113990", "summary": "在 2026 年用一台 4:3 屏幕的 ThinkPad 是一种什么体验？<a href=\"https://sspai.com/post/113990\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-04T03:25:29+00:00", "fetched_at": "2026-09-05T02:39:37.236732+00:00", "fingerprint": "9bc44bea3b1bbd87"}, {"source": "少数派", "title": "开学季 | 超级闹钟、算教学周、统计作业：三条快捷指令让学校生活轻松一点", "url": "https://sspai.com/post/114117", "summary": "研究一下iOS自带的快捷指令，可能会让你的学习生活也轻松不少。<a href=\"https://sspai.com/post/114117\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-04T07:01:57+00:00", "fetched_at": "2026-09-05T02:39:37.236727+00:00", "fingerprint": "3c0dc5b3f8821531"}, {"source": "少数派", "title": "新学期，新气象：正版软件 & 付费栏目限时优惠", "url": "https://sspai.com/post/114110", "summary": "多款付费栏目和正版软件上新，以及口碑、质量都非常优秀的现有产品优惠活动，快来看看有没有你需要的吧。<a href=\"https://sspai.com/post/114110\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-04T07:11:46+00:00", "fetched_at": "2026-09-05T02:39:37.236721+00:00", "fingerprint": "0dde3abe053226ae"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 8 部作品", "url": "https://sspai.com/post/114175", "summary": "📅本周新预告《哈利·波特》剧集先导预告9月2日，剧集《哈利·波特与魔法石》发布了先导预告，第一季共8集，将于12月25日上线HBOMax。原作者J·K·罗琳担任执行制片人，多米尼克·麦克劳克林、阿拉贝 ...<a href=\"https://sspai.com/post/114175\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-04T09:32:48+00:00", "fetched_at": "2026-09-05T02:39:37.236711+00:00", "fingerprint": "115127a07efab303"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.8341 CNY ↑+0.02%", "url": "https://www.frankfurter.app/2026-09-04?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-09-04</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.8341 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0009 (+0.02%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-09-05T02:39:35.972625+00:00", "fingerprint": "225c04cd167c7361"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
