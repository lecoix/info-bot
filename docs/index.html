f a truck? We can't say, but a Redditor has legit-looking photos of a prototype Xbox controller that's almost certainly the Xbox Elite Series 3. Incredibly, they claim they bought the pad for $200 on OfferUp. In May, a Brazilian regulator's leaked images revealed that Xbox [&#8230;]", "category": "tech", "published_at": "2026-08-11T22:36:35+00:00", "fetched_at": "2026-08-12T01:26:57.229060+00:00", "fingerprint": "9099c17defc10a28"}, {"source": "The Verge", "title": "Saber denies replacing Rideshare Stimulator&#8217;s writers with ChatGPT", "url": "https://www.theverge.com/games/978558/rideshare-stimulator-writer-ai-saber-interactive", "summary": "After a former lead writer claimed Saber \"replaced me with ChatGPT,\" CEO Matthew Karch now claims, \"Neither Saber nor Unigine have replaced any writers with AI,\" for the Rideshare \"Stimulator\" game announced last month, developed by Unigine. The writer, Stella Sacco, says differently, however, posting on Bluesky that \"I was lead writer on this one! [&#8230;]", "category": "tech", "published_at": "2026-08-12T00:39:26+00:00", "fetched_at": "2026-08-12T01:26:57.229049+00:00", "fingerprint": "2d93b9c8f35a1abe"}, {"source": "36氪 - 最新文章", "title": "是蓝海，也是慢海：一个中国电商人在非洲的25年拓荒史", "url": "https://36kr.com/p/3934727276494210?f=rss", "summary": "<p>在今年出版的一本新书《How Africa Works》中，作者乔・斯塔威尔将非洲描述为“最后一片蓝海”。基于七年田野调查与文献研究，他认为非洲过去经济落后、工业化水平低，是因为人口密度过低、分布稀疏，导致消费市场分散，并且水电网络等基础设施的铺设只能以高成本覆盖少数人员，难以形成专业的产业链分工。</p>\n  <p>而如今非洲拥有近16亿人口、平均年龄不到20岁，是全球人口结构最年轻的大陆，人口密度也在逐年提升，能够摊薄水电、道路、物流等基础设施的铺设成本，支撑起规模化的消费市场和专业化分工。越来越多中国人和企业也把生意触角延伸到非洲。<strong>据海关总署披露，过去十年中非贸易额翻了一番，中国连续16年保持非洲第一大贸易伙伴地位。</strong></p>\n  <p>从智能手机到摩托车，从太阳能产品到日用品，大量中国制造正在涌入非洲市场。深圳供应链产出的3C产品经拉各斯、内罗毕等集散中心流向整个非洲，义乌生产的日用百货铺满非洲各地的露天集市、社区夫妻店和路边摊位。</p>\n  <p>在涌向非洲的人潮中，廖旭辉是来得最早、扎得最深的人之一。</p>\n  <p>2000年开始，廖旭辉就开始接触非洲贸易，帮助朋友在深圳组织货源（淘库存纺织品）；2003年，他辞去国内稳定的工作，凭着拼凑的30万本金，从深圳批发VCD卖到非洲多哥。当时非洲是典型的卖方市场，电子产品供不应求，廖旭辉也因此迅速挣到在非洲的第一桶金。</p>\n  <p>2005年多哥当地局势波动，廖旭辉出于安全考虑，安排团队离开多哥暂撤到邻国，让他至今都难以忘记的是，<strong>在离开的日子里，有一位非洲本地员工帮他们照看仓库，直到当地秩序恢复。这件事也坚定了廖旭辉在非洲发展的信心。</strong></p>\n  <p>从2006年到2008年，他把生意从西非铺到中非、东非的二十多个国家，还在当地打造了自有的家电品牌LEADDER，主营DVD、音箱、电视等视听产品。</p>\n  <p>彼时，电商在中国刚刚起步，大多数非洲人更不知道电商为何物，<strong>廖旭辉已经再次转身，创立跨境电商平台Toafrica（2015年升级为Amanbo），比Jumia等非洲本土电商平台的出现还要早三年，而中国卖家大规模涌进非洲做电商更要到十年之后。</strong></p>\n  <p>作为国内最早聚焦非洲市场的跨境电商平台，Amanbo是工信部认定的对非数字经济合作重点项目，平台已在喀麦隆、肯尼亚、多哥、科特迪瓦等多个国家设立本地运营中心和海外仓，业务覆盖非洲30余个主要国家，连接1万家中国供应商和20余万非洲本地B端商家。</p>\n  <p>起步如此之早，困难远超想象：当时多数国家网速只有5K/S，打开一张商品图都要等几分钟；一天停三四次电，服务器经常断连；出了首都就是泥巴路，物流根本送不到。因此他试过做离线数据库、自建WiFi站点，更踩过无数坑，最后得出结论：<strong>商业创新不能抢先太多，布局太早只能当“铺路石”。</strong></p>\n  <p>过去20多年，廖旭辉从未离开非洲，和斯塔威尔一样始终相信非洲经济终将崛起。他说：“非洲是蓝海但也是慢海，没有快钱，去非洲的人越来越多，但是真正沉下来做好业务的不多，很多人待两年就走了，给长期坚持的留下空间。”</p>\n  <p>以下是我们与廖旭辉的对话：</p>\n  <p><strong>1.初闯非洲做到行业前三</strong></p>\n  <p><strong>36氪：能否介绍一下，您赚到第一桶金的过程？</strong></p>\n  <p>廖旭辉：最早接触非洲是2000年前后，一位朋友派驻非洲，我在深圳帮他对接国内采购，发了几批货后我发现，这是个尚未被充分关注的市场，有巨大潜力。</p>\n  <p>2003年，我带着30万本金开始西非多哥的VCD批发生意。当时非洲是典型的卖方市场，一条20尺标准柜的货，国内采购成本30万元，到岸后能卖到60万元，扣完运费、清关等成本，单柜净利润近20万元。</p>\n  <p>2006年到2008年，我们的生意进入快速扩张期，从多哥陆续拓展到喀麦隆、坦桑尼亚等国，覆盖西非、中非、东非三大区域近20个国家。同期我们还推出了自有的家电品牌LEADDER，主打DVD、音箱等视听产品，只用三年就做到西非行业前三。</p>\n  <p><strong>36氪：打造自有品牌LEADDER阶段，你们是如何开展市场推广的？</strong></p>\n  <p>廖旭辉：不用搞那些高大上的，接地气最管用。</p>\n  <p>最早做品牌没钱投广告，我们就从本地人最熟悉的日常场景切入。比如批发市场的搬运工每天扛着货在市场里穿行，我们就给他们发印着品牌logo的T恤，让他们变成免费可移动的人形广告牌；我们还会给出租车司机送礼品，请他们把品牌贴纸贴在车身上，也是遍布全城的移动广告位。</p>\n  <p>当时非洲互联网普及率很低，连电视都谈不上普及，我们熟悉的投放线上广告、电视广告根本触达不到核心目标用户，反而是这种落地的传播方式效果最好。</p>\n  <p><strong>36氪：中国商家理解非洲市场时，最常见的误区是什么？</strong></p>\n  <p>廖旭辉：最普遍的误区是把非洲当成铁板一块的统一大市场。实际上拥有16亿人口的非洲是54个完全独立的市场，不存在一套方案打遍整个非洲的可能——很多商家连一个国家的市场都没摸透，就想着做全非洲的生意，必然会踩坑。</p>\n  <p>最直观的差异是产品标准：法殖民地国家用欧规两圆插头，英殖民地国家用英规三方插头，同一款电器插头不对，根本无法上架销售。消费偏好差异也很大：东非消费者更看重产品实用性，优先选择带USB读卡功能的机型；西非消费者则偏好功能齐全的产品，认为功能越多性价比越高。文化与宗教差异同样显著：北非、西非穆斯林人口占比高，东非则以基督徒为主，产品设计、营销内容都需要适配当地的文化宗教习惯。</p>\n  <p><strong>2.非洲电商布道者：市场教��逾10年</strong></p>\n  <p><strong>2008年您已经将自有品牌做到西非行业前三，为什么会选择转向做电商平台？</strong></p>\n  <p>廖旭辉：主要有三方面原因：我本身是中国最早一批接触电商的人，1998年就做过电商相关业务，对这个赛道比较敏感，当时国内电商行业快速发展，阿里即将上市，让我看到电商模式在非洲的可能性；二是2008年金融危机冲击了传统批发业务，线下批发生意增长遇到瓶颈；三是自有品牌业务和批发业务存在渠道冲突，经销商意见比较大，综合考虑下我们决定转型做线上平台。</p>\n  <p>但当时非洲做电商的基础条件差到超出想象：网络速率只有5K/S，打开一个网页需要几分钟，商品图根本加载不出来；电力供应极不稳定，一天要停三四次电，网络随时会中断；道路交通条件差，除了核心首都区域之外，大部分地区基本没有配送能力。</p>\n  <p>为了适配本地市场，我们做过很多现在看来很“笨”的尝试：开发离线商品数据库，让用户到线下门店把商品库下载到本地，选好商品后再回到门店同步订单；在大型批发市场自建WiFi站点，解决商户上网的问题。前前后后改了三版界面，投入了大量资金，踩了无数坑，最后总结出一句话：商业创新可以抢先一步，但不能抢先太多。<strong>如果布局太早，基础设施还没跟上，就很可能变成行业“先烈”。</strong>非洲电商真正开始起量也就是最近三五年的事，之前的十几年全是市场培育期，熬不住的玩家基本都退出了。</p>\n  <p><strong>36氪：除了网速、电力、道路这些基础设施问题，当时做电商还遇到了哪些困难？</strong></p>\n  <p>廖旭辉：最核心的死结是当地价格与到岸成本倒挂。一件国内售价9.9元人民币的T恤，跨境空运运到消费者手里的物流成本是15美元，物流成本比商品本身的价值还高——定价高了普通消费者买不起，定价低了必然亏损。这就让非洲跨境B2C形成了一个走不出去的死循环：消费能力过低与到岸成本过高的冲突短时间不会消失。</p>\n  <p>其次是退货成本高，跨境电商的平均退货率在20%—30%，退回的商品还要再承担一次跨境运费，只要发生退货基本就是亏损。</p>\n  <p><strong>36氪：现在非洲线上交易的规模是多大？</strong></p>\n  <p>廖旭辉：从整个非洲的零售结构来看，目前线上零售仅占社会零售总额的5%-8%，基本来自中高收入的年轻群体，剩下90%以上的交易仍然发生在线下，在批发市场、集市、商超、夫妻店、路边小商贩手里。如果做纯线上生意，相当于主动放弃了95%的市场空间，只抓住了规模最小、对服务最挑剔的一小部分用户，自然很难把规模做起来。</p>\n  <p><strong>36氪：纯线上不行的话，适合非洲的电商是什么样的？</strong></p>\n  <p>廖旭辉：我们踩了这么多年坑，发现在非洲卖货还是要做全渠道。<strong>我做了一套OSO的模式，也就是Online（线上商城）+Social（社交渠道）+Offline（线下门店）三者结合。</strong>其中线上端是官方商城，线下是合作的门店和网点；而Social端不只是Facebook、TikTok这类线上社交平台，还包括线下的社交场景——教堂、集市，我们给用户提供社交营销平台AMP（Amanbo Marketing Partner）。</p>\n  <p>这套模式的核心不是和线下商家抢生意，而是赋能线下商家：帮线下的流量做数字化沉淀，同时把线上的流量导到线下完成交付，这样的模式才能适配非洲的市场环境，能够长期跑通。</p>\n  <p>很多人问我，非洲未来会不会长出像中国淘宝、拼多多那样的电商平台？我觉得也许会，但绝对不是现在，还得等。等网速、电力这些基础设施再完善，等物流网络能铺到县城和乡镇，等普通人养成线上支付的习惯，等大众的消费能力再上一个台阶，这些都不是三五年能完全到位的。</p>\n  <p>我2009年就开始做纯线上电商，早了整整10年，花了很多钱做市场教育。现在如果还有人抱着“抄中国模式做非洲淘宝”的想法进来，大概率还是要当铺路石。商业是跟着市场阶段走的，不能跳步。先扎到线下做全渠道，跟着市场一起成长，等风口真来的时候，你已经在这扎根了，才能接住机会。</p>\n  <p><strong>36氪：对于现在想在非洲找机会的商家，Amanbo有什么服务可以提供？</strong><br />廖旭辉：基于对中非合作的综合判断以及AI对行业的冲击和影响，Amanbo正在调整我们的产品和服务策略。战略上，死磕非洲不变。策略上我们将顺应时代和技术潮流，最大限度免费对国内外用户开放Amanbo平台，整合国内外合作伙伴，以专业服务协助用户实现高效交付及本地化支持，同时提供金融产品（供应链金融、跨境结算、分期付款等），借此与用户、合作伙伴构建高粘性互动，共建AI时代背景下中非合作智慧大生态，让大家真正实现抱团出海，共创共赢，助力中非合作提质升级。<br />具体来说，除平台以外，从基本的中非商业知识普及、产品诊断到市场调研、商机验证、渠道建设到品牌出海、项目咨询、产业陪跑等，都可以找我们；Amanbo将不再是电商平台定位，而是基于Amanbo数字底座的中非合作综合服务平台。</p>\n  <p><strong>3.电商之外非洲还有更多机会</strong></p>\n  <p><strong>36氪：除了电商之外，非洲还有哪些机会？</strong></p>\n  <p>廖旭辉：不要一说到非洲就只想到电商，机会太多了。</p>\n  <p>未来5到10年，产业出海是大趋势。现在东南亚市场已经是红海，竞争非常激烈，而非洲16亿人口的市场竞争烈度低很多，还可以依托非洲大陆自贸区做转口贸易——自贸区覆盖54个国家，区域内贸易零关税，在一个国家设厂，产品可以无关税卖到整个非洲，市场空间非常大。</p>\n  <p>产业落地选址主要看几个维度：政治环境稳定、有自贸区政策支持、劳动力成本低、最好靠海有港口方便物流、接近客户或市场。目前产业聚集的主要区域包括北非的摩洛哥、埃及，东非的肯尼亚，西非的拉各斯、加纳以及南非等。</p>\n  <p>其次是进口贸易机会，现在非洲很多产品进入中国享受零关税政策：非洲的牛羊肉加工成牛肉干运到国内，成本比国内低很多，品质也不错；还有咖啡、可可、坚果、矿产这类资源品，非洲的品质高、价格低，运回国内竞争力很强。做非洲生意最好进出口双向布局，能够对冲汇率波动的风险，如果只做单边生意，一旦汇率下跌，赚的利润很容易被汇兑损失吃掉。</p>\n  <p>除此之外，传统贸易、品牌代理、本地分销、服务贸易、项目投资等很多赛道都还没有充分竞争，相对国内来说都是蓝海市场，非洲的机会从来不是只有电商这一条路。</p>\n  <p><strong>36氪：很多想去非洲的商家会对当地基础设施有顾虑，面对路不好、电不够、网也慢等现实问题，您怎么看？</strong></p>\n  <p>廖旭辉：我就说一句话：路都修好了，你还来干嘛？</p>\n  <p>等基础设施都完善了，本地企业成长起来，欧美大公司也都进场，哪里还有中小商家的机会？20年前的深圳不也是这样，要什么没什么，这和人种、文化没关系，就是发展阶段的问题，等发展到一定程度，这些问题自然会解决。</p>\n  <p>路不好需要修路，缺电需要建电站，网差需要铺网络，物流不畅需要做物流——每一个短板背后，都是实实在在的机会。<strong>你能解决多大的问题，就能拿到多大的市场。</strong>现在非洲刚好站在起飞的节点上，人口密度已经跨过了规模经济的门槛，市场开始启动，这个时候进场，刚好能赶上发展红利。</p>\n  <p><strong>36氪：除了基础设施，很多商家觉得非洲员工不好管理，甚至担心当地的安全问题，您怎么看这种刻板印象？</strong></p>\n  <p>廖旭辉：不是人的问题，是管理方式不对，核心是你得尊重本地人。</p>\n  <p>2005年多哥战乱，我们所有中国员工都撤到邻国避难，有个平时与我们相处不错的本地员工，冒着战乱的风险帮我们守了10个月仓库，一件货都没丢。</p>\n  <p>疫情的时候也是一样，很多靠中国人盯着的公司直接停摆，我们本土化做得早，90%以上都是本地员工，业务全靠他们扛，降低了很多损失和影响。</p>\n  <p><strong>36氪：对于现在想在非洲找机会的中小商家，您有什么具体的建议？</strong></p>\n  <p>廖旭辉：第一，先想明白你要干什么？贸易？电商？投资开厂？第二，再选国家和用户，再选品，选国家和用户比选品还重要，选对了事半功倍，选错了再努力也没用。第三，不要想当然，别拿国内经验直接套，有条件先去当地看看，了解清楚市场再动手。并且不要什么都自己来，尽可能本土化，用好当地人，相信当地人，但同时做好管控。第四，别只盯着电商，传统贸易、做品牌、建厂、做进口、做投资，都可以看看，机会很多。做跨境电商的话，别选太便宜太重的东西，物流成本扛不住，选点当地买不到的、有差异化的产品。第四，循序渐进，先小批量试销，跑通了再慢慢扩大，一上来就all in死得快。</p>", "category": "tech", "published_at": "2026-08-11T07:01:17+00:00", "fetched_at": "2026-08-12T01:26:56.984366+00:00", "fingerprint": "73988c18cd61700c"}, {"source": "36氪 - 最新文章", "title": "自研微米级工业具身机器人，已进入博世产线，「国奥科技」完成近亿元A+轮融资 | 36氪首发", "url": "https://36kr.com/p/3934853676088448?f=rss", "summary": "<p>2026年被业界视为“人形机器人量产元年”，然而数量扩张不等于产业成熟，部分企业仍停留在样机和演示阶段，商业化路径尚不清晰。</p>\n  <p>“现在3C大厂基本不会考虑使用泛化的人形机器人。”国奥科技创始人李思阳博士说。</p>\n  <p><strong>在他看来，产量与工业场景落地之间的鸿沟不是AI大模型不够强，而是本体的运动控制能力远远无法达到工业场景要求。</strong>“好比一个人的大脑已经发育到二十岁，身体还停留在三岁的水平。”</p>\n  <p>国奥科技正在尝试补齐这块短板。基于其自研多自由度电机（即同时实现直线和旋转运动的双自由度电机）生产的工业机器人，目前已销售给德国博世，并在多家头部大厂的产线上实现预运行。</p>\n  <p><strong>我们了解到，近期国奥科技刚刚完成近亿元A+轮融资，由深创投、基石资本、粤科金融投资。深创投也是去年6月A轮融资的老股东。资金将主要用于工业具身机器人量产及机器人BU组建。</strong></p>\n  <p>国奥科技成立于2019年，是工业自动化领域国产替代趋势下，凭借技术突破在行业打开市场的典型样本，目前已在「ZR电机」这一细分品类确立头部地位，产品进入国内某头部芯片企业、歌尔股份、舜宇光学等头部客户供应链。</p>\n  <p>为什么选择从精密电机走向机器人整机解决方案？“我们在成立之初就确立了不卖模组，直接做整机的目标。因为只有足够懂精密电机的公司，才能将本体的运动能力发挥到极致，让机器人真正到工厂里干活。”李思阳这样回答。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260811/v2_68a21a426d9e4f89a56a3dace6453868@5688585_oswg294478oswg1080oswg716_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国奥科技产品矩阵</p>\n  <h2><strong>1.围绕核心ZR电机技术，搭建多场景产品矩阵</strong></h2>\n  <p>精密电机是工业自动化的“心脏”，这一领域此前长期被海外厂商垄断。随着过去几年国产替代在工业自动化领域持续推进，国奥科技也在这一趋势下创立。</p>\n  <p>但海外电机厂商往往提供“电机+驱动器+控制算法”的一整套闭环解决方案，把硬件和算法一起售卖，因此整机厂商更换电机供应商的成本很高，替换动力天然不足。</p>\n  <p>“要让客户改用国产电机，不可能只靠便宜或者优化几个参数，必须实现指数级的性能提升。”<strong>李思阳表示，这种指数级级别的提升意味着要对电机的底层电磁结构进行重构。</strong></p>\n  <p>传统电机只能做旋转或直线一个维度的运动，因此需要两组电机加机械传动，实现Z轴升降加R轴旋转，不仅体积大、负载重，力控精度也受到限制。李思阳团队研究的多自由度电机则是在同一动子结构下，通过磁场变化同时实现直线和旋转运动，全部直驱、无机械传动，使电机在力控精度和ZR轴稳定性指标上实现关键突破。</p>\n  <p>半导体固晶机是国奥科技ZR电机最早实现国产替代的验证场景之一。据李思阳介绍，ZR电机进入固晶机取放头后，设备相比传统方案在精度、可靠性和效率上的参数都有3-5倍提升，整机制造成本反而降低。</p>\n  <p>ZR电机产品除了进入国内固晶机设备龙头新益昌，还批量供货长园半导体、科瑞技术、长川科技等多家国内知名封测设备厂。</p>\n  <p>过去一年，国奥科技围绕双自由度电机的底层技术，将产品向更多高价值工业场景延伸。<strong>目前产品矩阵分为核心部件和集成解决方案两大板块，前者是技术根基与营收基本盘，后者提供新的市场增长。</strong></p>\n  <p>核心部件以ZR电机标准品为主，覆盖半导体、3C等领域，服务歌尔股份、舜宇光学等几十家头部客户。李思阳表示，目前在ZR电机这一细分品类，国奥科技已成为市场认知中最先被想到的供应商。</p>\n  <p>集成解决方案则更接近汽车制造、工业机器人等终端客户，虽然当前对整体营收的贡献还不足10%，但从市场增长空间来看，是当前产品研发迭代的必然路径。</p>\n  <p>2026年4月，国奥科技发布全球首台搭载双自由度关节的工业级具身机器人「G-Tools」，在FAIR plus 2026机器人全产业链接会上成功抓取一根直径0.5mm的细针并精准穿过微孔，实现微米级定位精度（±2μm）与高精度力控（±0.05N）。</p>\n  <h2><strong>2.从电机核心供应商，到工业具身机器人领域的“ABB”</strong></h2>\n  <p>从商业化路径来看，国奥科技的策略是“从高往低打”。</p>\n  <p>“对初创公司而言，工业自动化行业并不容易进入，缺乏行业资源的前提下，产品从一开始就必须具备足够强的竞争力。”李思阳解释。</p>\n  <p>所以国奥科技选择先切入半导体行业，通过打造“半导体级”产品，并与国内某头部芯片企业等头部客户建立合作，在高精度、高可靠性的要求下完成产品验证和市场教育，建立起品牌信任度。</p>\n  <p>但半导体核心部件的市场容量有限，收入天花板明确。相比之下，以果链为代表的3C领域市场体量巨大，且技术指标要求相对宽松，因此国奥科技在半导体行业站稳脚跟后，“降维”进入竞争激烈的3C领域，通过大批量交付发挥规模效应，进一步摊薄整体成本。</p>\n  <p>李思阳介绍，国奥科技的电机产品已进入歌尔股份、舜宇光学等海外3C巨头企业供应链核心企业的产线，用于终端产品的制造和检测设备。</p>\n  <p>为更好把控3C等领域的量产交付质量和项目成本，国奥科技2024年在赣州布局第一个自有机加工厂和装配工厂，2025年中实现量产，目前产能为1800-2000台/月。接下来国奥科技计划在珠三角和长三角地区新增两家工厂，分别用于工业机器人与精密电机的研发与量产交付。</p>\n  <p>工业机器人是国奥科技正在攻克的下一个关键行业。<strong>与以往不同，这次国奥科技选择不做关节模组供应商，而是直接做整机。</strong>李思阳的考虑是，下游客户对电机的认知不足以发挥双自由度电机的全部优势。“如果对方不知道怎么用，我们的产品也发挥不了最大价值。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260811/v2_0b8edd7f26804b0e88b0d08e2c7ec9cc@5688585_oswg317186oswg860oswg516_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国奥科技工业机器人</p>\n  <p>事实上，做整机是李思阳从公司成立之初就确立的目标，“以前公司还太小，资金、团队都不足以支撑”。到了2026年，国奥科技预计年营收达到近亿元并实现盈利，团队规模也从去年的60人扩张至140人，“做整机的时机已经成熟。”</p>\n  <p><strong>“我们对标的不是optimus，而是ABB。”</strong>李思阳表示，国奥科技虽然也在机器人的运动控制上下功夫，但与当下主流的具身机器人公司走的是两条不同的路，不比拼机器人跳舞、跑步、叠衣服等泛化能力，而是以达到3C产线要求为目标。“先把一项能力做到工业级，再谈泛化才有意义。否则机器人大脑能力再强，本体也接不住，产品只能停在demo状态。”</p>\n  <p>为保持自身在多自由度电机技术上的竞争力，国奥科技已在香港设立研发中心，与香港理工大学共建先进电机实验室。李思阳还透露，团队此前在研发双自由度电机时，已同步储备球形电机技术。球形电机不局限于直线或旋转，可实现270-360度球面运动。</p>\n  <p>“一只机器人手臂最多需要三个球形电机，自由度和灵活度就可以超过现在的七轴机械手，<strong>我们认为会是机器人关节的终极解决方案，有可能在未来3-5年内走向市场。</strong>”李思阳判断。</p>", "category": "tech", "published_at": "2026-08-11T10:01:10+00:00", "fetched_at": "2026-08-12T01:26:56.984359+00:00", "fingerprint": "5955157ec0d58554"}, {"source": "36氪 - 最新文章", "title": "继Seed、Flow后，字节又成立一个AI一级部门，直指「数据」｜36氪独家", "url": "https://36kr.com/p/3934936980667776?f=rss", "summary": "<p>《智能涌现》从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI 数据与安全，与Seed、Flow、抖音等部门平行，负责人为王赢磊（Adam Wang）。</p>\n  <p>这是继2023年底成立Seed和<a href=\"https://36kr.com/p/2536362002884358\" rel=\"noopener noreferrer\" target=\"_blank\">Flow</a>两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。负责人王赢磊此前为TikTok平台责任负责人和TikTok直播负责人。“王赢磊负责的直播业务曾是TikTok最主要的营收来源之一，在字节内部有过赫赫战功。”一位接近字节的人士表示。</p>\n  <p>《智能涌现》就上述消息向字节求证，截止发稿，暂无回复。</p>\n  <p><strong>在模型、产品之后，字节这一次直指AI数据。</strong></p>\n  <p>据《智能涌现》了解，这个新部门的前身之一，是由TikTok创始团队成员傅越（花名 Yuyi）于2023年成立的数据团队Global Data，原来的规模在百人左右。这个精干的团队起初为 Dola（豆包海外版）、TikTok等国际业务服务，而后负责为Seed的模型训练做数据采购和质量管控。团队内部设有产品经理、数据工程、采购、质检运营、安全合规等多个职能。</p>\n  <p>除Global Data之外，AI数据与安全部门还整合了多个此前分散的 AI 数据部门，包括集团数据中台DMC，以及Flow下属的AI数据平台AIDP等团队人员。</p>\n  <p>多位知情人士对我们表示，这一部门的整合和正式成立从2026年6月初开始，而由于涉及多个部门整合，这些部门之间业务又多有重叠，当前字节还在不断梳理架构，优化人员。</p>\n  <p>数位接近该部门的人士告诉我们：<strong>整合后的新部门，会是一个横跨基座模型到业务团队的庞大数据团队，其核心职能是为字节所有大模型，提供跨模态的数据服务</strong>。<strong>团队的职责也覆盖数据生产全流程：标准制定、寻源采购、合成清洗、质量评测等。</strong></p>\n  <p>在7月底的Seed全员会上，久未露面的张一鸣表态：字节在大模型攻坚上“坚决不蒸馏”。而在8月5日的字节跳动全员会上，CEO梁汝波也表示：“字节大语言模型会坚定自研，做好基本功，接受短期落后，坚持优化长期，最重要的是动作不要变形。” 这些决定必将导向，在字节的大模型攻坚中，数据的重要性不断上升。</p>\n  <p>跳出字节，我们也看到全球AI行业正在发生结构性变化：当公开互联网数据被穷尽，模型竞争的核心变量正从算法和算力，转向真实世界的高质量数据。</p>\n  <h2>字节的庞大数据帝国</h2>\n  <p>字节在AI数据上的投入，在国内大厂中一直是最坚决的。</p>\n  <p>一个重要原因是，Seed从成立之初就定下了“不做蒸馏”的原则。字节在几乎所有模型上的目标都是达到全球第一梯队甚至SOTA，这是通过蒸馏难以达到的。如果所有数据都要靠自己合成、采买、清洗，势必需要一个庞大的团队来支持。</p>\n  <p>这个团队有多庞大？<a href=\"https://36kr.com/p/3885177884078083\" rel=\"noopener noreferrer\" target=\"_blank\">《智能涌现》曾独家报道</a>，在字节内部，仅为Seedance做模型数据评测的团队就有上千人。每一位Seedance算法工程师的背后，往往都配着十余位数据同事做支持。</p>\n  <p>与之形成对比的是，很多视频领域赛道的头部创业公司，内部评测团队达到数十人就已经算比较大的投入。而Seedance 2.0的成功，也被多位从业者称为“一场数据的胜利”。</p>\n  <p>这让字节更加坚定了对数据的投入。</p>\n  <p>首先是预算层面。<a href=\"https://36kr.com/user/5783683\" rel=\"noopener noreferrer\" target=\"_blank\">《智能涌现》曾独家报道</a>，在世界模型和Coding模型的训练上，字节2026年初的数据预算已超过千万美元级别，并且“如果觉得不够，可以随时追加预算”。</p>\n  <p>《智能涌现》还了解到，目前字节数据团队也已经采取赛马机制，团队内部按方向划分——世界模型、代码、高难学科等。在如今模型的商业逻辑日渐清晰的背景下，字节的每个数据项目，也需要核算ROI。</p>\n  <p>字节之外，各大厂都在加强数据投入。从去年开始真正发力大模型的腾讯，近半年来频繁以高达三倍的薪资从字节的数据团队挖人。</p>\n  <p>阿里、腾讯在数据采购上的预算都有明显增长，且不断加码投资。一位数据行业人士告诉《智能涌现》，大厂目前都有一定的数据排他策略，比如设定数据集独家期限、或阶段性买断供应商核心人员。</p>\n  <p>“数据是当下大模型竞争中最具决定性的变量。”这已经成为大语言模型、具身智能、世界模型、AI4S等几乎所有明星细分方向上的共识。</p>\n  <p>但是，2026年的数据市场现状是，AI公司需求旺盛，从预训练到后训练，都面临高质量数据供给稀缺的瓶颈。</p>\n  <p>对字节而言，接下来的挑战是如何让一个千人规模的数据组织，仍然能够快速响应模型前沿的变化。毕竟，在模型能力边界还在快速变化的阶段，今天最稀缺的数据，在半年后可能就会失去价值。</p>\n  <h2>全球模型竞争都走向数据军备赛</h2>\n  <p>过去一年里，全球的大模型攻坚都面临一个趋势：在推理范式缓慢收敛的前提下，算法架构带来的能力提升趋缓。<strong>数据已经成为决定模型能力上限最重要的变量，甚至没有之一。</strong></p>\n  <p>跟字节等中国大厂相比，海外大模型公司对于数据的投入还要高出数倍。<strong>硅谷头部大模型公司的外部数据预算正在以每年数十亿美元的量级快速膨胀。</strong>比如Anthropic，仅在2025年就为RL数据拨出了超过10亿美元的预算。</p>\n  <p>这使得数据成为了 2026 年硅谷增长最快的赛道之一。最典型的是硅谷明星公司Mercor，年化收入从去年的5亿美元涨到今年年中的20亿美元，其中91%来自OpenAI、Anthropic等头部模型公司，估值则飞涨至200亿美元，这家公司成立仅三年。</p>\n  <p>为什么数据突然变得如此重要？根本原因在于，互联网上的公开数据几乎已经被穷尽。</p>\n  <p>过去三年，模型训练所需的数据经历了从公域到私域的转变。公开的互联网中有大量的报告、文档，但缺少人类如何产出这些结果的过程，比如如何理解模糊的意图、寻找上下文、犯错和修正。</p>\n  <p>比如，在Coding之外，还有医生、律师、科研等高精尖领域任务，通用模型还没有解决得很好。当模型要提升能力，像真实专家一样工作时，它还需要大量自然产生的“过程数据”。这些数据往往藏在真实的工作流程里，比如企业内部沉淀的代码库、员工日常操作留下的痕迹等等。</p>\n  <p>AI所需的数据，正在从公域转向了私域。而大量私域数据的采集，成了大模型公司新的争夺点。</p>", "category": "tech", "published_at": "2026-08-11T10:36:54+00:00", "fetched_at": "2026-08-12T01:26:56.984352+00:00", "fingerprint": "69ee2d849c887647"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域；两大能源央企参投宇树科技；入职未满一年，OpenAI伦理负责人宣布离职", "url": "https://36kr.com/p/3935139481631880?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>广聚能源：上修半年度业绩预告，上半年净利润同比预增603.02%—635.24%</strong><br />36氪获悉，广聚能源发布2026年半年度业绩预告修正公告，修正后公司预计2026年半年度归属于上市公司股东的净利润为6555.96万元—6856.42万元，同比增长603.02%—635.24%。修正原因为公司持有参股企业妈湾电力14.42%股权，于二季度末确认2025年度分红事宜，增加公司报告期投资收益4039.04万元，相应增加报告期归属于上市公司股东的净利润4039.04万元。公司以前年度一般于第三季度或第四季度确认妈湾电力投资收益，该事项系参股企业分红决议提前，不属于非经常性损益。</p>\n  <p><strong>报道称SK海力士重启中国NAND闪存生产基地2号工厂建设，将产能扩大约50%</strong></p>\n  <p>据报道，SK海力士重启了中国大连NAND闪存生产基地2号工厂的建设，将产能扩大约50%。大连2号工厂于4年前动工，但受存储器行业低迷影响，工程长期处于停滞状态。SK海力士计划在今年年底前引入半导体生产设备，并于明年上半年正式投产。 （中新经纬）</p>\n  <p><strong>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</strong><br />从招聘土木工程人才，到大手笔布局智算中心，AI正在推动科技公司的资产边界向土地、电力和数据中心延伸。近期，DeepSeek官网出现一则招聘信息，其中称“每一代人都会遇到属于自己的基础设施革命”，在职位要求中，电气、暖通、环境、土木等均被列为符合需求的专业。DeepSeek的这一动作释放出一个微妙信号：过去主要依靠外部算力资源的模型公司，开始向算力基础设施更深处延伸。（第一财经）</p>\n  <p><strong>冬海集团二季度营收同比增长48.1%至77.88亿美元</strong></p>\n  <p>Shopee母公司冬海集团8月11日公布了截至2026年6月30日的第二季度财务业绩。公司本季度实现GAAP营业收入77.88亿美元，同比增长48.1%；毛利润达35.50亿美元，同比增长47.3%；净利润达4.58亿美元，同比增长10.6%；调整后EBITDA为9.17亿美元，同样实现了10.6%的同比增长。（界面）<br /><strong>两大能源央企参投宇树科技</strong></p>\n  <p>锁定A股“具身智能第一股”，8月10日，宇树科技股份有限公司正式开启申购，其中中国石油集团昆仑资本有限公司和南方电网产融控股集团有限公司双双现身战略配售名单，引起市场关注。据了解，此次发行采用战略配售、网下发行与网上发行相结合的方式，战略配售总量808.93万股，占发行量的20%。昆仑资本和南网产融作为“与发行人经营业务具有战略合作关系或长期合作愿景的大型企业或其下属企业”参投，获配股数均为90.329万股，各获配约1.36亿元，锁定期12个月。（中国电力报）<br /><br /><strong>AI算力引爆，24只概念股上半年净利润预增</strong></p>\n  <p>人工智能算力需求爆发式增长，多家海内外巨头计划大幅提升数据中心产能。据统计，A股布局数据中心产业链的概念股超过百只，今日城地香江、杭钢股份涨停，盛弘股份上涨12.92%，旭光电子、铜牛信息等涨幅居前。从业绩上来看，45只概念股已公布半年度业绩相关公告。按半年报、业绩快报、业绩预告净利润下限顺序统计，4股上半年扭亏为盈，2股同比减亏，24股归母净利润实现同比增长，其中利通电子、富瀚微增幅均在1000%以上。（证券时报）</p>\n  <p><strong>字节跳动新成立AI数据与安全部门，与Seed、Flow、抖音等部门平行</strong><br />36氪从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI数据与安全，与Seed、Flow、抖音等部门平行，负责人为王赢磊（Adam Wang）。这是继2023年底成立Seed和Flow两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。负责人王赢磊此前为TikTok平台责任负责人和TikTok直播负责人。</p>\n  <p><strong>曝字节Seed AI数据安全负责人将离职，官方暂无回应</strong><br />据市场消息，字节Seed AI数据与安全负责人傅越（Yuyi）将于近期离职，其职位将由TikTok平台责任团队负责人、原TikTok直播负责人王赢磊（Adam Wang）接任。对此消息，字节方面暂无官方回应。消息称，傅越在字节Seed直接汇报给吴永辉，之前负责Global Data，目前是AI数据与安全的一号位。（新浪科技）</p>\n  <p><strong>消息称谷歌DeepMind求职者可填特殊表，绕过AI简历筛选</strong></p>\n  <p>有消息称，谷歌DeepMind AGI安全与协调团队鼓励公司求职者在提交常规申请的同时，额外填写一份特殊表格，以规避简历被公司内部人工智能系统筛除的风险。有业内人士指出AI招聘工具尚处早期阶段，实现招聘全自动化愿景任重道远。（财联社）</p>\n  <p><strong>阅文集团：上半年短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多</strong></p>\n  <p>8月11日，阅文集团发布2026年中期业绩报告。报告显示，上半年阅文集团收入达35.3亿元，同比增长10.7%。上半年阅文GMV达7.8亿元，同比增长60%；短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多；IP版权收入达16.1亿元，同比增长41.9%。</p>\n  <p><strong>康师傅控股：2026年上半年营收405.4亿元人民币，同比增长1.1%</strong></p>\n  <p>36氪获悉，康师傅控股在港交所公告，上半年营收405.4亿元人民币，同比增长1.1%；公司股东应占经调整溢利24.3亿元人民币，同比上涨15.2%。</p>\n  <p><strong>现代汽车工人本周将举行为期四天的部分罢工</strong><br />现代汽车工会周二表示，由于未能与管理层就薪资问题达成协议，本周将举行为期四天的部分罢工。该汽车制造商的工会称，决定于周三和周四进行四小时罢工，并在周五和周日举行六小时罢工。上个月，现代汽车工会已进行了总计30小时的部分罢工，并拒绝在四个周六执行特殊班次，导致预估生产损失约42510辆。（新浪财经）</p>\n  <p><strong>扎克伯格：Meta将推动“个人超级智能”普及，反对AI能力集中于少数机构</strong><br />当地时间8月10日，Meta首席执行官马克·扎克伯格发布长文《未来属于所有人》，表示Meta将推动“个人超级智能”普及，并继续支持开放源代码AI模型。他称，开放模型有助于避免AI能力过度集中，让更多个人和企业获得先进AI工具。扎克伯格表示，当前开放源代码生态“强大”，限制开源AI将导致AI进一步集中化，不利于安全和经济发展。他透露，Meta超级智能实验室已启动，未来将恢复发布部分开源模型。在谈及AI模型训练中的蒸馏技术时，扎克伯格表示，模型从其他模型中学习是开源生态的重要原则，不应将蒸馏简单视为有害行为。（界面）</p>\n  <p><strong>入职未满一年，OpenAI伦理负责人宣布离职</strong><br />随着外界愈发审视OpenAI的人工智能模型研发方式，已有多名安全研究人员相继离职；在此背景下，OpenAI伦理事务主管克洛伊・巴卡拉尔入职未满一年便选择离开这家初创企业。此次离职是近几周OpenAI接连发生的多起备受关注的高管离任事件之一，一同离开的还有安全系统主管约翰内斯・海德克、首席未来学家、前目标对齐负责人约书亚・阿基阿姆。（新浪财经）</p>\n  <p><strong>韩国总统李在明呼吁对量子计算等未来产业进行大规模战略投资</strong></p>\n  <p>韩国总统李在明周二在内阁会议上呼吁对未来产业进行大规模战略投资，包括小型模块化反应堆（SMR）、可再生能源和航空航天，重申了他推动韩国工业实力发展的承诺。李在明提到，小型模块化反应堆、可再生能源、量子计算、航空航天和先进生物学是未来行业中将决定全球领导地位的关键领域。对这些领域的战略投资应与对半导体和人工智能等大型项目的投资一样彻底和密集地推进。（财联社）<br /><br /><strong>智谱ZCode用户突破100万，推出四项新功能</strong><br />8月11日，记者获悉，智谱AI编程产品ZCode宣布全面升级，Goal、Subagents、Remote Control及闲时任务正式上线，推动Coding Agent从对话辅助走向复杂任务自主交付。ZCode用户数已突破100万。（证券时报）<br /><br /><strong>腾讯WorkBuddy升级多端同步能力</strong><br />36氪获悉，腾讯WorkBuddy宣布升级多端同步功能，实现了PC、App、小程序三端的任务、对话记录与产物的实时同步，并支持手机上远程对电脑端任务进行授权与停止。</p>\n  <h2>投融资：</h2>\n  <p><strong>“寻明生科”再获总额1亿美金的B系列融资</strong><br />36氪获悉，近日“寻明生科”再获总额1亿美金的B系列融资。首轮由Granite Asia（前身为纪源资本GGV亚洲业务）独家投资；后续轮次由产业投资人领投，弘晖基金跟投，启明创投、经纬创投及纽尔利资本等老股东追加。距离公司披露3500万美元A+轮融资，仅过去3个多月。</p>\n  <h2>新产品：</h2>\n  <p><strong>知情人士：微软计划明年大幅增产下一代AI芯片</strong><br />两名熟知相关规划的知情人士透露，微软计划在明年大幅增产自研下一代人工智能芯片，希望以此吸引Anthropic等大型云服务商客户采用自家芯片。当前一代自研芯片Maia 200市场接受度偏低，但微软仍推进扩产计划。其中一位知情人士称，微软计划今年秋季对外正式发布全新Maia 300芯片，最快下月即可亮相。另一名知情人士表示，这家云计算巨头已与芯片代工厂台积电洽谈，锁定30万片以上Maia 300的代工产能，交付时间定在2027年；该订单规模远超微软迄今为止量产的数万片Maia 200。（新浪财经）</p>\n  <h2>今日观点：</h2>\n  <p><strong>京投发展：公司股票价格短期涨幅较大，可能存在非理性炒作风险</strong><br />36氪获悉，京投发展公告，公司股票于8月10日、8月11日连续两个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。截至公告披露日，除公司已披露的筹划重大资产出售暨关联交易事项、筹划购买资产暨关联交易事项外，不存在其他应披露而未披露的重大事项和风险事项。鉴于公司股票价格短期涨幅较大，可能存在非理性炒作风险，公司敬请广大投资者注意二级市场交易风险，理性决策，审慎投资。<br /><strong>但斌回应投资人质疑：东方港湾在7月深度回调中没有大幅减仓，仅极小比例结构性微调</strong></p>\n  <p>36氪获悉，东方港湾董事长但斌回应投资人质疑，长江东方港湾2号目前依旧保持满仓状态，在7月本轮深度回调之前，该基金重仓AI产业链标的，一路坚持、未做大规模减仓，本轮跟随AI赛道出现了较大幅度回撤。东方港湾在2023年把握了英伟达为代表的全球AI核心机会，对A股本土AI产业链的布局启动偏晚，直到2026年才全面全力以赴重仓。本轮7月大跌行情中，东方港湾没有恐慌割肉、没有大幅减仓，仅做了极小比例的结构性微调。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>上半年中国人形机器人出货量占全球97%</strong><br />据彭博社10日报道，一份最新行业研究报告显示，2026年上半年，中国人形机器人制造商出货量占据了全球97%以上市场份额。美国加州研究公司Smart Analytics Global（SAG）的数据显示，今年上半年，全球人形机器人出货量总计约1.91万台，是去年同期5100台的三倍多。市场份额方面，总部位于上海的智元机器人超越了总部位于杭州的宇树科技，夺得第一。今年上半年，智元机器人出货量为8400台，占全球出货量的44%，而宇树科技的出货量为5900台，市场份额占比31%。这两家公司的出货量均远超特斯拉、Figure AI和Agility Robotics等美国头部人形机器人企业。（央视财经）</p>\n  <p><strong>2026年度电影票房突破245亿元</strong><br />据网络平台数据，截至8月11日，2026年度电影总票房（含预售）突破245亿元，《飞驰人生3》《功夫女足》《给阿嬷的情书》暂列2026年度电影票房榜前三。（央视财经）</p>", "category": "tech", "published_at": "2026-08-11T13:26:26+00:00", "fetched_at": "2026-08-12T01:26:56.984343+00:00", "fingerprint": "b4d562dee161583a"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨最高套现166亿，李嘉诚又卖海外资产；宇树科技中签结果出炉；胖东来公布“委屈奖”，3名员工共获补偿7万元", "url": "https://36kr.com/p/3935774730878341?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</li>\n   <li>英伟达牵头5000亿美元融资大单</li>\n   <li>Meta遭1.4万亿美元天价索赔，几乎等同其全部市值</li>\n   <li>腾讯WorkBuddy升级多端同步能力</li>\n   <li>为确保世锦赛期间不被猴子干扰比赛，印度羽协将聘请驯猴师入驻赛事场馆</li>\n   <li>董明珠：自己是靠产品成为“网红”</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>最高套现166亿，李嘉诚又卖海外资产</strong></p>\n  <p>继今年年初高位脱手英国核心电网资产之后，李嘉诚旗下长和系再度推进海外成熟基建资产变现。8月11日，据财联社，李嘉诚家族旗下旗舰基建平台长江基建集团(01038.HK)已委托摩根士丹利与巴克莱银行，正式开启澳大利亚分布式能源企业EDL Energy的控股权售卖流程，项目估值区间介于20亿至30亿澳元（约合110.8亿至 166.6 亿港元）。按照交易时间表，竞标机构需要在9月提交无约束力的初步报价，公司计划于今年年底之前敲定正式转让协议。若本次EDL Energy成功易手，这将成为李嘉诚家族今年以来在澳洲市场最大的一笔资产处置交易。对于这笔潜在交易，长建方面尚未作出回应。(每日经济新闻、财联社）</p>\n  <p><strong>宇树科技中签结果出炉</strong></p>\n  <p>8月11日，宇树科技公告称，中签号码共有19414个，每个中签号码只能认购500股宇树科技A股股票。宇树科技此次科创板IPO发行价为150.80元/股，中一签（500股）需缴款7.54万元。</p>\n  <p>8月11日晚间，宇树科技网上网下中签结果出炉，网上中签比例0.01809759%，在今年已上市的93只新股中，中签率偏低；网下投资者的配售比例为0.03341824%，今年有网下打新的46只上市新股中位居第六位。截至目前，今年网上中签率最高的新股为长鑫科技，为0.47141739%。宇树科技的网上中签占长鑫科技的3.8%，小于1/26；网下中签占长鑫科技的19%，小于1/5。（中新经纬、第一财经）</p>\n  <p><strong>胖东来公布“委屈奖”，3名员工共获补偿7万元</strong></p>\n  <p>8月10日，胖东来官方账号公布了两起侵犯员工人格尊严的典型案例。被侵犯的3位员工，其中两位分别获得1万元，一位获得5万元补偿。目前，其中一起涉及精神疾病患者的案件已进入民事诉讼程序。数据显示，2025年全年，胖东来侵犯人格尊严补偿奖共发放39.2万元，共36例。</p>\n  <p>胖东来在公示中公司明确表示，对任何侵犯人格尊严的行为，将按照补偿标准对受侵犯人员进行补偿和关怀，同时坚决通过法律途径维权，不接受任何形式的调解、和解。（财闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Manus将恢复独立运营</strong></p>\n  <p>8月11日，Manus发布《致Manus用户的一封信》。Manus表示，即将恢复以独立公司的形式运营，作为恢复独立运营的一部分，同时为遵守特定司法辖区的监管要求，部分用户在2025年12月29日当天或之后产生的数据，将于2026年8月23日08:00起至8月24日期间（SGT）被删除。受影响的用户可以从现在起至2026年8月23日07:59（SGT）备份数据，并可从2026年8月25日08:00（SGT）起恢复数据。在此期间，未受影响的用户可以照常使用Manus，无需采取任何行动。（界面新闻）</p>\n  <p><strong>入职未满一年，OpenAI伦理负责人宣布离职</strong></p>\n  <p>随着外界愈发审视OpenAI的人工智能模型研发方式，已有多名安全研究人员相继离职；在此背景下，OpenAI伦理事务主管克洛伊・巴卡拉尔入职未满一年便选择离开这家初创企业。此次离职是近几周OpenAI接连发生的多起备受关注的高管离任事件之一，一同离开的还有安全系统主管约翰内斯・海德克、首席未来学家、前目标对齐负责人约书亚・阿基阿姆。（新浪财经）</p>\n  <p><strong>英伟达据悉开发万亿参数开源AI模型Nemotron 4，欲挑战顶级开源模型</strong></p>\n  <p>据报道，英伟达正在开发新一代开源人工智能模型Nemotron 4，预计参数规模至少达到1万亿，目标是与全球领先的开源大模型竞争。英伟达希望通过开放模型生态扩大AI应用范围，并进一步推动市场对其GPU算力的需求。英伟达此前已推出Nemotron系列开源模型，包括拥有3400亿参数的Nemotron-4 340B系列，主要用于大语言模型训练数据生成、模型开发和企业AI应用。（界面新闻）</p>\n  <p><strong>腾讯WorkBuddy升级多端同步能力</strong></p>\n  <p>36氪获悉，腾讯WorkBuddy宣布升级多端同步功能，实现了PC、App、小程序三端的任务、对话记录与产物的实时同步，并支持手机上远程对电脑端任务进行授权与停止。</p>\n  <p><strong>扎克伯格：Meta将推动“个人超级智能”普及，反对AI能力集中于少数机构</strong></p>\n  <p>当地时间8月10日，Meta首席执行官马克·扎克伯格发布长文《未来属于所有人》，表示Meta将推动“个人超级智能”普及，并继续支持开放源代码AI模型。他称，开放模型有助于避免AI能力过度集中，让更多个人和企业获得先进AI工具。扎克伯格表示，当前开放源代码生态“强大”，限制开源AI将导致AI进一步集中化，不利于安全和经济发展。他透露，Meta超级智能实验室已启动，未来将恢复发布部分开源模型。在谈及AI模型训练中的蒸馏技术时，扎克伯格表示，模型从其他模型中学习是开源生态的重要原则，不应将蒸馏简单视为有害行为。（界面新闻）</p>\n  <h2>大公司/大新闻</h2>\n  <p><strong>字节跳动新成立AI数据与安全部门，与Seed、Flow、抖音等部门并行</strong></p>\n  <p>36氪从多个独立信源处获悉，字节跳动近期成立了一个新的一级部门——AI数据与安全，与Seed、Flow、抖音等部门串联，负责人为王赢磊（Adam Wang）。这是接着负责负责2023年底成立Seed和Flow两个AI一级部门后，字节围绕AI业务成立的又一个一级部门。人王赢磊接下来为TikTok平台责任负责人和TikTok直播人。</p>\n  <p><strong>7月销量前十仅一款燃油车</strong></p>\n  <p>尽管丰田在中国销量一路下滑，但在刚刚过去的7月，卡罗拉锐放却成为销量前十中唯一的燃油车。懂车帝援引的乘联分会数据显示，7月乘用车零售销量前十榜单中，丰田卡罗拉锐放以14510辆的成绩位列第八，较上月排名大幅上升了28个名次。其余九席全部被新能源车型占据。</p>\n  <p>吉利星愿以32306辆夺冠，零跑A10以26424辆位列第二、特斯拉Model Y以25158辆排名第三。特斯拉Model Y也是销量前十中单价最高的车型，官方指导价26.35万~31.35万元。（第一财经）</p>\n  <p><strong>英伟达牵头5000亿美元融资大单</strong></p>\n  <p>最新消息显示，全球最大的一批金融巨头正与英伟达合作，筹集5000亿美元资金用于人工智能基础设施建设——这将成为华尔街迄今规模最为庞大的贷款行动之一。多位了解相关谈判情况的人士透露，阿波罗全球管理、黑石集团、贝莱德、博枫资产管理、高盛、KKR在内的财团将与英伟达建立合作关系，共同投资人工智能（AI）基础设施建设。知情人士称，这项交易最早可能于日内晚些时候宣布。这项潜在的合作凸显出，英伟达正越来越积极地为自身及客户筹集资金，以继续建设支撑当前AI热潮的芯片、供电设施和数据中心。（财联社）</p>\n  <p><strong>游戏科学杨奇回应《黑神话：钟馗》进度：暂不用AI，坚持“手搓”</strong></p>\n  <p>8月10日，游戏科学联合创始人、《黑神话》系列美术总监杨奇在社交平台分享团队新作研发思路，明确现阶段正在开发的《黑神话：钟馗》，将会在设计、游戏资产制作环节主动避开AIGC生成式工具。事件起因源自杨奇分享的观影感悟，他在自己微博账号发贴，称诺兰全新影片《奥德赛》是“史诗电影的标准答案，深受启发”。随后有网友在评论区提问“AI能否加快研发”，杨奇回应，设计和资产阶段会远离aigc，但并非抵触AI，他以诺兰仍用传统技术拍摄新片为例称，“没有什么末班车是非赶不可的”，未来使用AI仍有充足时间。（界面新闻）</p>\n  <p><strong>董明珠：自己是靠产品成为“网红”</strong></p>\n  <p>8月10日，格力电器举行2026届毕业生入职仪式。据格力电器透露，2026年吸呐380多所高校优秀毕业生共计6514人。董明珠出席入职仪式并发表讲话。董明珠表示，格力多年来持续大规模招收应届毕业生，是源于对自主人才培养路线的坚守。当前市场环境下部分企业出现裁员等情况，但格力始终坚守不裁员承诺，将全方位呵护青年成长。在讲话中董明珠还提及自己被认为是“网红”，她回应到，自己并不是靠社交平台，花钱打造出来的“网红”，而是依靠格力的好产品而成为“网红”，企业的使命也不是只有赚钱，更要有创造美好生活的梦想。（第一财经）</p>\n  <p><strong>足坛球星年薪榜：C罗19亿元断层领跑，本泽马、姆巴佩分列第二、第三</strong></p>\n  <p>近日，Capology发布的足坛球星年薪榜，C罗以2.119亿英镑（折合人民币19亿元）的年薪断层领跑，第二名本泽马1.292亿镑，第三名姆巴佩6050万镑。C罗的2.119亿镑年薪由固定薪资、进球奖金（每球约8万英镑）、助攻奖金（每球约4万英镑）以及联赛/亚冠夺冠奖金（分别约1100万和900万美元）等浮动条款组成。（湖北日报）</p>\n  <p><strong>为确保世锦赛期间不被猴子干扰比赛，印度羽协将聘请驯猴师入驻赛事场馆</strong></p>\n  <p>2026年世界羽毛球锦标赛将于‌8月17日至23日‌在‌印度新德里‌的英迪拉·甘地体育馆举行。为确保本届世锦赛进行期间不被猴子干扰，赛事组委会特意邀请了一批能够模仿长尾叶猴叫声的驯猴师作为工作人员。今年早些时候在英迪拉·甘地体育馆举办的羽毛球印度公开赛期间，一只恒河猴就出现在了观众席，不由得让外界质疑起印度的办赛能力。在印度，恒河猴泛滥成灾，它们经常闯入建筑物，袭击毫无防备的行人或居民。为了避免遭受恒河猴的侵扰，印度人选择将体型更大的长尾叶猴安置在建筑物内，以此驱赶恒河猴。（体坛周报）</p>\n  <p><strong>巨力索具需补税及滞纳金702万元</strong></p>\n  <p>8月10日，演员杨子家族旗下上市公司巨力索具发布公告称，公司近期根据税务机关要求，对涉税事项开展自查，经自查，公司需补缴税费677.85万元、滞纳金24.47万元，税费及滞纳金合计702.32万元。巨力索具称，本次补缴税款事项不涉及行政处罚。公司将按照税务机关要求及时补缴税款、滞纳金。8月11日，巨力索具股价开盘后一度跌超4%，截至收盘，跌幅收窄至2.97%，报8.16元/股，最新市值约78亿元。（第一财经）</p>\n  <p><strong>Meta遭1.4万亿美元天价索赔，几乎等同其全部市值</strong></p>\n  <p>8月10日，据央视网报道，脸书母公司Meta本周将再次站上联邦法庭被告席。8月12日，由加利福尼亚州、科罗拉多州、肯塔基州和新泽西州四州联合提起的诉讼将在加州奥克兰联邦法院启动陪审团筛选程序，检方指控Meta旗下社交媒体平台成瘾性设计对未成年人造成伤害，向其索赔高达1.4万亿美元。这一数字几乎与Meta当前的总市值持平，创下全球消费者保护领域诉讼的最高索赔纪录。（央视网）</p>\n  <p><strong>芝商所将扩大白银期货24小时交易，继黄金期货焦点后进一步拓展贵金属交易</strong></p>\n  <p>8月11日，芝加哥商品交易所集团宣布，计划自9月11日起在获得监管批准后，将24小时交易服务扩展至100盎司白银期货合约。昨天，芝商所已于7月24日推出1盎司黄金期货24小时交易，周末交易额累计超过2亿美元。芝商所称，白银兼具贵金属和工业金属属性，能够帮助投资者应对宏观经济变化和需求出现。（界面新闻）</p>\n  <p><strong>苹果仍计划明年推出20周年全玻璃iPhone机型</strong></p>\n  <p>知名科技记者马克·古尔曼8月10日发文称，知情人士透露，苹果公司并未改变产品路线图，仍计划明年推出纪念iPhone问世20周年的全玻璃旗舰机型。杰富瑞分析师10日早些时候将苹果评级从“持有”下调至“跑输大市”，下调依据来自供应链调查——结果显示，苹果原定于2027年9月推出的全玻璃iPhone因“生产良率过低”已被叫停。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，8月11日收盘，美股三大指数集体下跌，道指跌0.34%，纳指跌0.6%，标普500指数跌0.32%。大型科技股多数下跌，SpaceX、谷歌跌超3%，亚马逊跌超2%，奈飞、苹果跌超1%，微软、英伟达小幅下跌；特斯拉、Meta小幅上涨。热门中概股普跌，腾讯音乐跌超11%，哔哩哔哩跌超5%，京东、网易跌超4%，阿里巴巴、富途控股、百度跌超3%，拼多多跌超2%。</p>\n  <p><strong>上半年中国人形机器人出货量占全球97%</strong></p>\n  <p>近日，一份最新行业研究报告显示，2026年上半年，中国人形机器人制造商出货量占据了全球97%以上市场份额。美国加州研究公司Smart Analytics Global（SAG）的数据显示，今年上半年，全球人形机器人出货量总计约1.91万台，是去年同期5100台的三倍多。市场份额方面，总部位于上海的智元机器人超越了总部位于杭州的宇树科技，夺得第一。今年上半年，智元机器人出货量为8400台，占全球出货量的44%，而宇树科技的出货量为5900台，市场份额占比31%。这两家公司的出货量均远超特斯拉、Figure AI和Agility Robotics等美国头部人形机器人企业。（央视财经）</p>\n  <p><strong>越南VinSpace与SpaceX签署协议，计划明年二季度实现卫星发射入轨</strong></p>\n  <p>越南企业集团Vingroup当地时间8月11日宣布，旗下成员公司VinSpace与SpaceX签署卫星发射合同。根据协议，VinSpace的卫星将于明年二季度通过SpaceX的Transporter Rideshare计划发射入轨。声明称，通过该协议，VinSpace将测试自主研发的卫星模块，并逐步提升在卫星系统管理和未来商业应用方面的能力。（界面新闻）</p>\n  <p><strong>美联储鹰派释放强硬信号：一次加息还不够</strong></p>\n  <p>克利夫兰联储主席贝丝·哈马克（Beth Hammack）表示，美联储可能需要多次加息，才能推动通胀率降至央行2%的目标水平。当地时间周一（8月10日），哈马克在接受采访时表示：“总体而言，我认为一次25个基点的加息可能不会对经济产生太大影响。因此，可能需要进行若干次加息。”但她补充称，“我不希望预先判断这个数字究竟是多少。”两周前，美联储宣布将联邦基金利率目标区间维持在3.5%至3.75%之间不变，当时包括哈马克在内的三位委员投下了反对票，三人倾向于在会议上加息25个基点。（财联社）</p>\n  <p><strong>报道称SK海力士重启中国NAND闪存生产基地2号工厂建设，将产能扩大约50%</strong></p>\n  <p>据报道，SK海力士重启了中国大连NAND闪存生产基地2号工厂的建设，将产能扩大约50%。大连2号工厂于4年前动工，但受存储器行业低迷影响，工程长期处于停滞状态。SK海力士计划在今年年底前引入半导体生产设备，并于明年上半年正式投产。（中新经纬）</p>\n  <p><strong>DeepSeek招土木工程师，科技大厂争锋延伸至传统资源领域</strong></p>\n  <p>从招聘土木工程人才，到大手笔布局智算中心，AI正在推动科技公司的资产边界向土地、电力和数据中心延伸。近期，DeepSeek官网出现一则招聘信息，其中称“每一代人都会遇到属于自己的基础设施革命”，在职位要求中，电气、暖通、环境、土木等均被列为符合需求的专业。DeepSeek的这一动作释放出一个微妙信号：过去主要依靠外部算力资源的模型公司，开始向算力基础设施更深处延伸。（第一财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>昆仑万维：筹划发行H股股票并在香港联交所主板上市</strong></p>\n  <p>36氪获悉，昆仑万维公告，公司计划发行境外上市外资股（H股）股票并申请在香港联交所主板挂牌上市。截至目前，公司正积极与相关中介机构就本次发行并上市的相关工作进行商讨，除本次董事会审议通过的相关议案外，其他关于本次发行并上市的具体细节尚未确定。</p>\n  <h2>投融资</h2>\n  <p><strong>“寻明生科”再获总额1亿美金的B系列融资</strong></p>\n  <p>36氪获悉，近日“寻明生科”再获总额1亿美金的B系列融资。首轮由Granite Asia（前身为纪源资本GGV亚洲业务）独家投资；后续轮次由产业投资人领投，弘晖基金跟投，启明创投、经纬创投及纽尔利资本等老股东追加。距离公司披露3500万美元A+轮融资，仅过去3个多月。</p>\n  <p><strong>“模量科技”完成数千万元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“模量科技”近日完成由猎鹰投资、益华资本投资的数千万元Pre-A轮融资，点石资本担任财务顾问。本轮资金用于研发团队和产线扩建、全球业务拓展。</p>\n  <p><strong>CoreWeave完成26亿美元AI基础设施贷款融资</strong></p>\n  <p>8月10日，CoreWeave宣布完成26亿美元延期提款定期贷款融资，以支持其AI云平台的持续扩张及已承诺的客户部署项目，融资期限约为五年。融资所得资金将用于采购和部署专用于客户合同的高性能计算（HPC）基础设施。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>腾讯音乐：二季度营收89.3亿元，同比增5.8%</strong></p>\n  <p>36氪获悉，腾讯音乐公告，二季度营收89.3亿元，同比增5.8%；二季度NON-IFRS净利润26.9亿元，同比增4.4%。</p>\n  <p><strong>阅文集团：上半年短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多</strong></p>\n  <p>8月11日，阅文集团发布2026年中期业绩报告。报告显示，上半年阅文集团收入达35.3亿元，同比增长10.7%。上半年阅文GMV达7.8亿元，同比增长60%；短剧及AI漫剧业务收入达4.3亿元，是去年同期的3倍多；IP版权收入达16.1亿元，同比增长41.9%。</p>\n  <p><strong>康师傅控股：2026年上半年营收405.4亿元人民币，同比增长1.1%</strong></p>\n  <p>36氪获悉，康师傅控股在港交所公告，上半年营收405.4亿元人民币，同比增长1.1%；公司股东应占经调整溢利24.3亿元人民币，同比上涨15.2%。</p>\n  <p><strong>工业富联：2026年上半年净利润237.4亿元 同比增长95.99%</strong></p>\n  <p>36氪获悉，工业富联公告，2026年上半年营业收入5578.61亿元，同比增长54.63%。归属于上市公司股东的净利润237.4亿元，同比增长95.99%。归属于上市公司股东的扣除非经常性损益的净利润229.84亿元，同比增长96.99%。基本每股收益1.2元。本公司计划不派发现金红利，不送红股，不以公积金转增股本。</p>\n  <p><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-11T23:59:35+00:00", "fetched_at": "2026-08-12T01:26:56.984327+00:00", "fingerprint": "df679ba3f48b8ea7"}, {"source": "少数派", "title": "不喜欢对照式译文的阅读体验？Ovid 让你「按需」查看原版书籍", "url": "https://sspai.com/post/113263", "summary": "因为不太喜欢传统 <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
