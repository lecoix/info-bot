o Cure and production classic Bjork records like Vespertine. But Drew Daniel, one half of Matmos, is fiendishly prolific. When he's not literally dreaming up new viral music genres, he's also putting out records [&#8230;]", "category": "tech", "published_at": "2026-07-12T19:40:00+00:00", "fetched_at": "2026-07-13T02:23:22.319670+00:00", "fingerprint": "5319d8e88f524635"}, {"source": "The Verge", "title": "Lorde says Ray-Ban Meta AI glasses are ‘not sexy’", "url": "https://www.theverge.com/ai-artificial-intelligence/964539/lorde-says-ray-ban-meta-ai-glasses-are-not-sexy", "summary": "Lorde was performing at the Real Cool Festival in Madrid on Thursday and took some time during her set to speak out against AI glasses. While she didn't specify any brands in particular, it's likely she was taking a shot at festival sponsor Ray-Ban, which has collaborated with Meta on a pair of AI smartglasses. [&#8230;]", "category": "tech", "published_at": "2026-07-12T20:10:19+00:00", "fetched_at": "2026-07-13T02:23:22.319661+00:00", "fingerprint": "1dbb10ceec9d2e3e"}, {"source": "36氪 - 最新文章", "title": "消失的150亿美元，有下文了", "url": "https://36kr.com/p/3892321158773251?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_fefded03ae9e4b91aef653818623f8b9@5579416_oswg20884oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">这场秘密增持的故事断续延宕了二十余年。</p>\n  <p>作者 黎曼</p>\n  <p>2026年7月，奢侈品行业的目光同时聚焦在两个法庭上。</p>\n  <p>一个是中国法庭。苏州市中级人民法院就LV诉新茶饮品牌茉莉奶白商标侵权案作出一审判决，认定茉莉奶白侵害LV七件四叶花卉图形注册商标专用权，判赔金额合计1030万元。目前该判决尚未生效，茉莉奶白方面已公开回应将依法提起上诉。</p>\n  <p>了解LV的朋友会知道，茉莉奶白商标侵权案只是LVMH执着于商标维权的冰山一角。从韩国炸鸡店的招牌字体，到美国作坊的老花洗手液瓶，再到荷兰艺术家画布上的一只难民手袋，过去二十年里，只要有人触碰那个老花标识，哪怕只是擦了一点边，LVMH的法务函总会精准送达。业内流传一个说法：LVMH的法务团队规模超过百人，年预算上亿欧元。数字未经证实，但在全球主要法域的商标判例里，LVMH作为原告的出庭频率确实无人能及。</p>\n  <p>这种对品牌控制的极致追求，LVMH在资本战场上也有所体现。</p>\n  <p>几乎在同一时期的巴黎法院上，LVMH集团向法庭提交了一份长达20页的答辩文件，首次系统披露本世纪初秘密增持爱马仕股份的完整过程，LVMH曾一度成为爱马仕除了其家族外的第二大股东。</p>\n  <p>案件的起因是现年83岁的爱马仕第五代继承人尼古拉·皮埃什于2025年提起诉讼，称自身损失估值超过150亿美元（约合1080亿元），LVMH集团及其董事长贝尔纳·阿尔诺均被列为被告。</p>\n  <p>这场秘密增持的故事断续延宕了二十余年，期间不断有零星报道流出。如今这份答辩文件终于浮出水面，让我们得以从头梳理整场棋局。</p>\n  <h2><strong>股权的裂缝</strong></h2>\n  <p>故事要从爱马仕家族内部的一处裂缝说起。</p>\n  <p>1993年，爱马仕在巴黎泛欧证券交易所上市。尽管走向公开市场，庞大的爱马仕家族依然保留了74%的股权，分散在200多位家族成员手中，没有一人的持股超过5%。</p>\n  <p>对于任何想染指爱马仕的人来说，这是一个危险的结构：股份足够分散，但也足够团结。家族成员之间有一个不成文的默契，绝不向外人出售股份。</p>\n  <p>但总有例外。</p>\n  <p>尼古拉·皮埃什，爱马仕创始人的第五代后裔，曾任集团董事会成员，一度是集团最大个人股东。他曾在爱马仕做过高管，但没多久就离开了。之后他创立过自己的时装公司，做过滑水教练，最后干脆什么也不干，靠着爱马仕的股份分红生活。</p>\n  <p>1998年前后，皮埃什从法国移居瑞士，远离了家族的管控。他把自己的资产，包括那笔价值连城的爱马仕股份，全权交给了一位瑞士财富管理人：埃里克·弗雷蒙德。</p>\n  <p>皮埃什签了一份“自由裁量管理授权”。这意味着，弗雷蒙德可以替他决定什么时候买、什么时候卖，不需要一笔笔过问。</p>\n  <p>这个签字，后来成了整场风暴的起点。</p>\n  <p>时间来到2001年，迎来了一场关键会面：弗雷蒙德找到了阿尔诺的亲信皮埃尔·戈德。</p>\n  <p>根据LVMH在20页文件中的说法，弗雷蒙德提议与皮埃什结成联盟。皮埃什当时因在家族企业中缺乏话语权而感到不满，正寻求在公司治理中发挥更大作用。</p>\n  <p>LVMH辩称，集团的目标并非收购皮埃什的股份，而是希望与他结成股东联盟，以此影响爱马仕的战略决策，并争取吸引其他家族成员加入。</p>\n  <p>此后多年里，弗雷蒙德与皮埃什曾多次和阿尔诺、戈德会面，地点包括LVMH旗下波尔多滴金酒庄。弗雷蒙德还与爱马仕家族的其他成员建立了密切联系。</p>\n  <p>真正让事态升级的，是2007年。那一年，弗雷蒙德告知LVMH集团，有大量爱马仕股票即将流入市场，并威胁称除非集团迅速出手，否则他会将这些股票卖给其他竞争对手。LVMH表示，正是这一警告促使集团搭建了股权互换合约结构，开始秘密建仓。</p>\n  <p>股票掉期是一种金融衍生品。简单来说，LVMH没有直接在二级市场买入爱马仕股票，那样会触发信息披露义务。而是通过与银行对赌，间接获得股价上涨的收益，同时瞒天过海地积累了持仓。从2001年到2002年，LVMH通过子公司收购了爱马仕4.9%的股份。2007年，LVMH恢复增持，通过金融中介和子公司购买股权衍生品，每一笔持仓都控制在5%以下，以规避信息披露义务。</p>\n  <p>这套操作，让阿尔诺在爱马仕家族的视线之外，悄无声息地布下了一张网。</p>\n  <p>2010年10月24日，炸弹引爆了。那是周三的早晨，爱马仕时任CEO帕特里克·托马斯接到了阿尔诺的来电。他告诉托马斯，LVMH集团已经通过现金结算的股权互换，购得了爱马仕14.2%的股份，算上已持有的可换股衍生工具，总持股量达到17.1%，一举成为爱马仕除家族之外的第二大股东。</p>\n  <p>随后，阿尔诺公开宣布了这笔持仓，整个奢侈品行业为之震动。</p>\n  <p>爱马仕家族的愤怒可想而知。一个竞品，在家族毫不知情的情况下，已经摸到了家门口。更可怕的是，阿尔诺的胃口远不止于此。到2012年12月31日，LVMH的持股比例进一步攀升至22.6%。</p>\n  <p>爱马仕家族闻讯后迅速行动。2011年，家族成员将大部分个人所持股份集中起来，成立控股公司，将超过半数股份锁定，以防被收购。这是一场反击，家族用团结筑起了一道墙，把门口的“野蛮人”挡在了外面。</p>\n  <p>皮埃什呢？他没有加入家族控股，而是保留了个人持股。外人以为这是彰显个性，但后来的事态证明，那可能正是他遭遇“资本渗透”的一个致命的漏洞。</p>\n  <p>双方的官司打了一年。最终，法国金融市场监管机构认定LVMH集团未及时披露建仓行为，并作出处罚。2014年，双方达成和解：LVMH承诺不再增持，并将持有的爱马仕股份全部转让给LVMH的股东。法国司法也在2015年对相关纠纷作出“不予起诉”裁定。据市场测算，这笔投资最终为LVMH带来了约38亿欧元投资收益。</p>\n  <p>故事似乎到此结束。</p>\n  <h2><strong>150亿美元，凭空消失了</strong></h2>\n  <p>真正的炸弹，埋在十几年后。</p>\n  <p>2022年夏天，皮埃什把弗雷蒙德叫到家里，问了一句话：“我之前叫你给园丁家转100万瑞士法郎，你转得怎样了？”</p>\n  <p>这位园丁在皮埃什家工作多年，与妻子一同照料皮埃什的日常起居。皮埃什晚年无子女，园丁夫妇是他生活中最亲近的人之一。出于信任与回报，皮埃什曾委托弗雷蒙德从自己的账户中转出一笔钱给园丁一家。</p>\n  <p>弗雷蒙德支支吾吾。一旁的园丁妻子听出了不对劲，事后告诉皮埃什：“我们根本就没有收到过什么转账。”皮埃什感觉不对，聘请了法律团队和咨询公司，对自己的财务状况做了全面审查。</p>\n  <p>这一查，天塌了。账户早就空空如也。其中90%的爱马仕股份，早在2008年就被转卖了。600万股爱马仕股份，按巴黎司法法院的估计，价值约150亿美元。皮埃什的财富，在他毫不知情的情况下，蒸发了。</p>\n  <p>2023年9月，皮埃什在瑞士对弗雷蒙德提起三起诉讼。瑞士法院2024年判定皮埃什自愿委托且无证据支持欺诈指控。</p>\n  <p>无果后，皮埃什没有放弃。2025年，皮埃什再度正式向巴黎法院提起民事诉讼，将LVMH集团、董事长阿尔诺、阿尔诺家族控股公司以及已故的理财师弗雷蒙德列为共同被告。他称自己名下价值约150亿美元的600万股爱马仕股份，被长期信任的财务顾问以秘密手段转手给了LVMH。</p>\n  <p>更耐人寻味的是，弗雷蒙德在起诉两个月后，于2025年7月死亡。就在法国检方对他展开“背信和资产挪用”刑事调查期间，他在瑞士结束了自己的生命。案件最关键的证人，就这样消失了。</p>\n  <p>巴黎检方已启动调查，并于近期宣布对三名律师展开正式调查，其中一名律师曾在十余年前LVMH集团大举收购爱马仕股票期间为该集团提供服务。5月18日，一名瑞士律师因涉嫌严重背信罪共犯、窝藏背信所得等罪名接受正式调查。5月27日，另一名律师因涉嫌在2001年至2014年间参与挪用皮埃什的爱马仕股份至LVMH而接受调查。目前三名律师均否认存在不当行为。</p>\n  <p>LVMH最近开始了反击，也就有了开头所说的，LVMH向巴黎法院提交了一份长达20页的答辩文件。</p>\n  <p>这是LVMH首次公开回应这场纠纷。文件的核心论点是：LVMH是被无端卷入的。皮埃什之所以将阿尔诺与LVMH牵扯进案件，完全是因为后二者有能力支付巨额赔偿，而弗雷蒙德的遗产及其名下公司不具备相应偿付能力。</p>\n  <p>“如果皮埃什未收到出售其股票的款项，那是他与弗雷蒙德之间的纠纷，与LVMH集团无关。”</p>\n  <p>LVMH坚称，对任何涉嫌挪用资产的行为“完全不知情”。集团始终认为交易属于正常资本合作，从未获知弗雷蒙德存在任何侵占客户资产的行为。</p>\n  <p>但调查人员发现了一条关键线索：皮埃什持有的约6%爱马仕股份中，有很大一部分当时正是通过与LVMH的股票掉期交易，转入法国兴业银行的。调查人员正在核实，参与交易的人员中，是否有人明知流入LVMH秘密持仓的这些股票，是在所有者不知情的情况下被转让的。</p>\n  <p>对此，皮埃什的律师回应称，目前所有责任认定仍需等待法国刑事调查结果，在调查结束之前，没有任何一方能够排除嫌疑。</p>\n  <p>2010年的那场收购战，LVMH输了。爱马仕家族用团结守住了控制权。但15年后，阿尔诺的名字再次出现在爱马仕股权纠纷的被告席上。这一次的金额更大，案情也更扑朔迷离。</p>\n  <p>在爱马仕的世界里，一只手袋可以等待数年。一笔股权，却能消失二十多年。究竟是谁拿走了它？而那位最关键的证人，弗雷蒙德，已经无法开口了。</p>\n  <p>为防止类似皮埃什的财富蒸发事件再次发生，爱马仕家族于2022年成立了统一的家族办公室Krefeld。其由八个独立的家族办公室和投资工具整合而成，汇聚了爱马仕家族不同分支的财富。其管理文件将所有权严格限制为家族第三代埃米尔-莫里斯·爱马仕的后代。</p>\n  <p>据悉，Krefeld直到2024年才开始正式运行，目前投资了法国保险公司Albingia，还和KKR一起入股了健康美容集团Anjac Health &amp; Beauty。</p>\n  <p>据彭博亿万富翁指数，掌控爱马仕财富的逾100名家族继承人合计净资产达1860亿美元，是欧洲最富有的家族之一。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/NVHTxesGIE7uiKqKwvZC4Q\" rel=\"noopener noreferrer\" target=\"_blank\">“投中网”</a>，作者：黎曼，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-12T07:16:34+00:00", "fetched_at": "2026-07-13T02:23:22.249010+00:00", "fingerprint": "03bba7f974e94d58"}, {"source": "36氪 - 最新文章", "title": "腾讯重仓一个IPO", "url": "https://36kr.com/p/3892352153942530?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_c894ac412b53423a9e1b8871398bc19b@5579416_oswg950837oswg960oswg640_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：视觉中国</p>\n  <p>作者/杨继云</p>\n  <p>报道/投资界PEdaily</p>\n  <p>深圳超级IPO来了。</p>\n  <p>日前，深圳云豹智能股份有限公司（简称“云豹智能”）创业板IPO申请正式获深交所受理，成为又一家选用创业板第四套上市标准申报上市的企业，冲刺“国产DPU第一股”。</p>\n  <p>回想6年前，斯坦福博士萧启阳在深圳创办云豹智能，专注于DPU赛道。这个团队启航两个月后，千亿DPU赛道开始爆发。至今，他背后站着腾讯等一支长长的投资人队伍。</p>\n  <p>腾讯无疑最为重仓，已成为云豹智能最大股东。与广东国资押注的粤芯半导体一起，云豹智能成为大湾区又一标志性的半导体案例。</p>\n  <h2><strong>斯坦福博士，干出深圳独角兽快IPO了</strong></h2>\n  <p>先从创始人萧启阳说起。</p>\n  <p>他出生于中国香港，早年赴美求学，学术履历极为耀眼：以最高荣誉（Summa Cum Laude）同时毕业于纽约大学（数学和计算机科学学士）和纽约库珀大学（电子工程学士），24岁即获得斯坦福大学电子工程博士学位，此后先后在加州大学尔湾分校、麻省理工学院任教。</p>\n  <p>博士期间，萧启阳主攻人工智能和神经网络方向。他的一项成果曾破解AI领域三十多年未解的理论难题，受到\"人工智能之父\"Marvin Minsky的高度赞誉并亲自撰写序言。</p>\n  <p>第一次创业是在2002年，他在硅谷联合创办了芯片公司RMI，后被博通以37亿美元的现金高价并购，震惊业界。</p>\n  <p>2020年，目睹算力国产替代的机会，萧启阳再次创业。考虑到国内人才和成本优势，这一年8月，他回到深圳创办云豹智能——在很多人还在讨论CPU、GPU的时候，专攻DPU。</p>\n  <p>说来也巧，不久后，英伟达在GTC大会上正式推出DPU概念，黄仁勋提出\"CPU+DPU+GPU\"的\"三芯\"战略，DPU赛道迅速成为\"兵家必争之地\"。</p>\n  <p>此后云豹智能快速崛起。自主研发了国内首款高性能、通用可编程DPU SoC芯片，网络带宽达400Gbps，相比传统方案性能提升4倍、功耗降低50%以上。仅用4年时间，就完成了从FPGA验证到6nm SoC量产的全过程。</p>\n  <p>根据招股书，目前云豹智能能够提供包括弹性网络与存储、虚拟化、安全及低时延RDMA等功能在内的一站式解决方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_5ed9ae8811b844d39fe096ac17cdecaf@5579416_oswg111769oswg830oswg625_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">招股书</p>\n  <p>招股书显示，云豹智能2023年、2024年、2025年营收分别为17万、3635万、3.7亿元；净亏损分别为6.67亿、6亿、11.9亿元；扣非后净亏损分别为6.7亿、6.2亿、5.6亿。尽管2025年营收同比增长超900%，云豹智能依然处于亏损状态。</p>\n  <p>由此，深圳又一个超级IPO浮现。</p>\n  <h2><strong>VC/PE云集，腾讯成最大股东</strong></h2>\n  <p>芯片创业，无疑是烧钱黑洞。</p>\n  <p>截至递交招股书前，云豹智能也经历了数轮融资。最早是在2020年底，彼时公司刚注册两个月，就一口气拿下五源资本、正心谷资本、中芯聚源、华业天成、耀途资本、弘卓资本等投资机构加持的种子轮融资。</p>\n  <p>半年后，云豹智能再次完成阵容豪华的天使轮融资，包括红杉中国、深创投、腾讯、五源资本、华业天成、QBN Capital。萧启阳曾在演讲中提到，“创立云豹智能时，我只有一个人，拿到天使轮之后才敢去请创始团队。”</p>\n  <p>正是在这一轮中，云豹智能迄今最重要的股东出现——腾讯。这是腾讯首次入局，此后连续重注。</p>\n  <p>2021年9月，云豹智能完成A轮融资，腾讯再次出手数亿元人民币，其它投资方除了红杉中国、深创投、五源资本等老股东外，还包括淡马锡、蔚来资本、正心谷资本、华西村股份旗下投资平台一村资本、民生银行上市金融控股平台民银资本、耀途资本等等。</p>\n  <p>至此，云豹智能成为国内DPU独角兽。</p>\n  <p>随后的融资更是势如破竹——2023年拿下阳光保险、国信资本、润信新观象产业基金等的融资，2024年后政府引导基金进场，深圳市引导基金和宝安区产业投资引导基金B轮融资；2025年，IDG资本、杭州产投、杭实资管、萧山资本等三家杭州国资、鹏鼎控股、云尖信息等产业方悉数进场，老股东参与。</p>\n  <p>2025年11月底，同创伟业、东方富海、基石资本等几家深圳本土VC一举加持，IDG资本、腾讯再度参与其中。此后估值超过140亿元。</p>\n  <p>IPO前，<strong>腾讯通过关联主体以19.7792%的持股成为云豹智能的第一大股东</strong>，而公司实际控制人萧启阳、张学利合计直接持有公司7.1520%的股权，通过云豹创芯、云豹创智两个持股平台间接控制公司22.6588%的表决权。</p>\n  <p>这也提示了一种风险：腾讯作为第一大股东，未来在二级市场增持或减持都可能对公司控制权稳定性产生影响。</p>\n  <h2><strong>创业板窗口，大湾区开启上市潮</strong></h2>\n  <p>终于轮到深圳了。</p>\n  <p>过去很长一段时间，深圳在半导体领域的标签更多是“消费电子应用”和“终端制造”。在这一轮AI算力大爆发的浪潮中，围绕国产算力的资本竞赛正全面提速，深圳急需一个能代表底层核心技术的超级IPO。</p>\n  <p>此前国产GPU的IPO浪潮中，摩尔线程、沐曦、壁仞科技等多集中在北京、上海等地，如今云豹智能冲刺“国产DPU第一股”，恰好为深圳在“基础设施芯片”维度补上了一块重要拼图。</p>\n  <p>由此望去，大湾区半导体资本化正在形成梯队效应。</p>\n  <p>不久前，粤芯半导体技术股份有限公司（简称“粤芯半导体”）创业板IPO成功过会，拟募资75亿元。对于投资方来说，这同样是一场漫长押注——八年前，粤芯半导体从广州黄埔的一片空地起步，后来成为粤港澳大湾区第一家实现量产的12英寸晶圆制造企业。</p>\n  <p>一路走来，在这只广州超级独角兽背后，广东国资几乎贯穿其每一轮融资，寄予沉沉的厚望。</p>\n  <p>看上去，粤芯半导体代表了大湾区在晶圆制造领域的突破，云豹智能则代表了大湾区在高端芯片设计（DPU）领域的突围。</p>\n  <p>此刻，他们乘着创业板改革红利的东风。</p>\n  <p>粤芯半导体选择适用创业板第三套上市标准，是继大普微之后，创业板第二家未盈利过会企业；而今年4月创业板正式启用“第四套上市标准”，看重研发投入和市值，而非短期净利润，此后云豹智能IPO顺利推进。他们都向硬科技企业释放信号——只要技术过硬、研发够高、成长性够强，资本市场的大门已经敞开。</p>\n  <p>创业板开始热闹。自2024年9月以来，创业板指累计上涨约150%，成为A股最醒目的主线之一；放眼望去，创业板已经成为中国硬科技公司最密集的资本市场样本之一。</p>\n  <p>这当中，大湾区的硬科技军团已经吹响了突围的号角。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/Y3JO515mIJFeXxksMYHpYw\" rel=\"noopener noreferrer\" target=\"_blank\">“投资界”</a>，作者：杨继云，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-12T07:59:37+00:00", "fetched_at": "2026-07-13T02:23:22.249003+00:00", "fingerprint": "2b0241f2de7f584c"}, {"source": "36氪 - 最新文章", "title": "“背后空无一人”的LV，这次中国人彻底不买账了", "url": "https://36kr.com/p/3892442708032264?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_151ed01a2ca44322849efe08bf9ed073@5579416_oswg92435oswg1024oswg764_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>最近，广西一场洪水，又双叒叕让不少品牌登上热搜。</p>\n  <p>在一众的品牌捐款名单里，除了常见的消费巨头互联网大厂之外，人们还看到了一个新面孔，那就是茉莉奶白。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_e60ecdabea92463a9c0f4ce12d094481@5579416_oswg129585oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">茉莉奶白</p>\n  <p>有人说，“自己淋雨，还想着给别人撑伞”。毕竟前不久，茉莉奶白自己还相当焦头烂额。</p>\n  <p>本来好好卖20块一杯茶饮，突然被一个卖3万包的顶级大牌闹到跟法庭相见，理由是杯子上的四叶草“近似”。网友一句话总结到位：</p>\n  <p><strong>LV跌倒，茉莉奶白吃饱。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_4267b091a80b48fc839165107fb9b37c@5579416_oswg77528oswg1080oswg1161_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV跌倒，茉莉奶白吃饱。</p>\n  <p>这话没毛病。毕竟，从现实看茉莉奶白确实输了，苏州中院一审判下来，茉莉奶白赔LV1030万，千万赔偿，创下新茶饮商标侵权判赔纪录。</p>\n  <p>然而这一次，热搜上的舆论却并没有站在赢家这边。</p>\n  <p>有网友发现自家砖墙四叶花纹跟LV老花像，“好怕LV告我家房子”。还有网友翻出各种类似LV花样的东西：公厕装饰、墙砖甚至还有人民币等等，表示还好LV没看见。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_80b97242a73341179046d6d5a7d61bc5@5579416_oswg109115oswg1080oswg1054_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">砖墙四叶花纹</p>\n  <p>连官媒都发出灵魂拷问，“老祖宗留下的东西，我们自己反倒不能用了吗？应该探索建立中华民族传统美学数据库。”</p>\n  <p>质疑归质疑，然而这些都不能挡着LV“大杀特杀”。茉莉奶白不是第一个，有人扒出了LV这些年的战绩，光是近五年，侵害商标权的风险信息一共1691条，2024年单年207起，2026年刚过半已经56起。</p>\n  <p>如此多的法庭见，已经不是维权两个字能简单解释的了。还有人调侃说，LV在中国的法务部，比设计部还忙。</p>\n  <p>“告完你的告你的”LV，从这几年的现实来看，不像维权，更像维生。</p>\n  <h2><strong>5年打上千场官司：茶饮、餐厅、酒......</strong></h2>\n  <p>这些年的LV，已经不再是过去那个“不谙人间烟火气”的LV了。</p>\n  <p>能一己之力打破奢侈品高冷结界告小微企业，还是因为早就尝到过甜头。</p>\n  <p>最开始，它的矛头还是对准不出名的素人草根。</p>\n  <p>几年前，南京一家做中古风的餐吧，因为吧台装饰和蛋糕包装上用了点花卉图案，当时还特意改过一轮怕侵权。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_9056c9c4b6b6438ea5a4ded01797ba9e@5579416_oswg146664oswg1080oswg868_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中古风餐吧</p>\n  <p>结果LV还是虽迟但到，一上来就要索赔120万。</p>\n  <p>今年3月判LV胜了，认定侵权赔6万维权开支2万，合计11万。听着不多，可这家店已经亏了200多万倒闭。</p>\n  <p>当然，LV的维权之路还远没到尽头，胆子也是越来越大，开始盯上一些有头有脸的品牌或公司。</p>\n  <p>这些年，卖葡萄酒的贸易公司、回味鸭血粉丝汤、酒吧……都不幸踩中雷区，被LV告了个遍。</p>\n  <p>那些街边小店、个体户，主打一个公平对待，只要logo视觉元素有近似可能，一律纳入射程。</p>\n  <p>很多人不知道，连向太都进了LV的维权名单。</p>\n  <p>这几天，向太自己爆料，早年拍张柏芝《天生购物狂》，剧组场景里用了点花叶纹道具，LV律师函直接寄到她桌上准备起诉。</p>\n  <p>然而这一次，屡战屡胜的LV却罕见踢到铁板上了。</p>\n  <p>不像一般默默忍受的商家，向太不会惯着，而是直接找对方高层硬刚，LV无奈只能撤诉。</p>\n  <p>同样硬刚LV的还有周大福。在茉莉奶白侵权风波几天后，网友发现周大福在LV店附近开了一个原创老花装饰展，摆出1300年前的宝相花，被网友称“贴脸开大LV”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_97fa495b6d134e9d832a5ba5a4bacc9b@5579416_oswg150264oswg1080oswg1195_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">周大福</p>\n  <p>再到茉莉奶白，更是一夜激起民愤纷纷指责LV，人们彻底不忍了，甚至要把LV跟“公厕”扯上关系。</p>\n  <p>法理全赢，舆论全输，这是LV这波维权最魔幻的地方。</p>\n  <p>其实，网友不是不懂商标法。大家意难平的是，浓眉大眼的LV，赖以维权的那个四叶花卉老花，往上追是隋唐的宝相花，再往上是新石器时代的柿蒂纹，唐代紫檀琵琶上就有。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_b52603e0d590403cb789dd43074b67d3@5579416_oswg74084oswg1080oswg909_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宝相花</p>\n  <p>这是中国老祖宗的审美，但现在却变成了LV借鉴中国的传统纹样，二次设计抢先注册，最后反过来告国内企业。</p>\n  <p>说穿了，这轮维权狂欢根本不是冲商标擦边去的，是冲能赔钱的人去的。</p>\n  <p>正如网友说的：</p>\n  <p>“过去LV打假还有体面。现在LV打官司，更像是急了。”</p>\n  <h2><strong>LV百年护城河，对年轻人不好用了</strong></h2>\n  <p>为何LV这些年开始频繁维权，被网友调侃成“告完你的告你的”？</p>\n  <p>根源还是因为——日子不好过了。</p>\n  <p>从这些年LV的发展来看，如果被侵权是逃不开的烦恼，那么产品就是它一块更长期的心病。</p>\n  <p>就拿一点来说，最早LV卖的不是包，是欧洲老钱的生活方式。曾经从明星到普通人，LV的老花花纹几乎就是拉风神器。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_34ef427a120e48329ca33d0efaab10e0@5579416_oswg95000oswg1080oswg654_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>出门背LV，路人会觉得你有钱。但现在背，别人未必会多看一眼。</p>\n  <p>人们对品牌高高在上的认知开始松动，这对于大牌无疑是暴击。为了挽尊，LV自己动了两刀，然而从现实看，刀刀都砍了个寂寞。</p>\n  <p><strong>第一招涨价，却在年轻人面前吃瘪了。</strong></p>\n  <p>很多奢侈品大牌为了自救的王炸，就是涨价。</p>\n  <p>毕竟，涨价后很容易换来门店排队。消费者的逻辑是晚买更贵，买涨不买跌，所以越涨价越被疯抢。</p>\n  <p>所以，LV在2025年4月曾启动涨价策略，普通手袋涨600元，经典款涨超1000元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_9e00fe92c3aa4d74bea32ecd53eac490@5579416_oswg114899oswg1080oswg980_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>然而LV没想到的是，如今的年轻人对这套打法彻底不认了。</p>\n  <p>2025年LV全年营收808亿欧元，同比降5%；净利润108亿欧元，一口气滑13%。LV 所在的时装皮具部门，2025年营收377.7亿欧元，连续两年跌了8%。</p>\n  <p>去年二季度更是交出30年来最差单季成绩单，管理层自己都承认失速的导火索在中国。</p>\n  <p>为什么年轻人不买账了？答案是：<strong>拒绝无理由溢价。</strong></p>\n  <p>大牌本来就很贵，更尴尬的是，产品公价年年涨，流通价却悄悄在往下滑。年轻人现在买包前先查红布林、只二二手平台，早买早赚的理财神话不复存在，所以很多人并不接受简单粗暴的涨价。</p>\n  <p>同时，一些国潮原创包，质感逼格不输大牌，设计也更懂中国人。年轻人想的很明白，为一个logo标花一两万，不如拿一两千支持国货。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_5e1471c15e4744f7bfe5bc322ebe337a@5579416_oswg130638oswg1080oswg1098_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p><strong>第二招开店更扎心，反让看家本事被小弟们截胡。</strong></p>\n  <p>在年轻人这里吃了瘪，按理来说，LV还有忠诚的中年中产粉丝。</p>\n  <p>这些人更有钱，也不会随便因为价格涨跌改变自己的习惯。但现在，他们的新宠也是越来越多。</p>\n  <p>这些年，隔壁Celine、Miu Miu等后浪靠年轻化设计，吃掉了原本属于LV的预算，连Coach在2025年Q1同店同比涨15%，接的就是抛弃传统大牌的中产。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_cc8d6d6c1d904bae862a86e40147e1b4@5579416_oswg151432oswg1080oswg964_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>为什么中产也开始倒戈了？在这背后，可以说，是LV少了他们最看重的护城河——稀缺感。</p>\n  <p>很多人不知道，LV过去几年，门店大开特开，从一线铺到三四线，贵阳、昆明机场全铺上，更早的时候是把招牌挂进了无数非核心城市，老花满大街都是。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_ae4d6726dab14b44908e5eba33a1b3a1@5579416_oswg26565oswg1080oswg421_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">社媒评论</p>\n  <p>正如奢侈品专家周婷一针见血，当用户从咬咬牙也难买到，变成随处可见够得着，大牌的光环就没了。</p>\n  <p>价格敏感的年轻人嫌贵，中产在乎的稀缺感也在减弱，LV只能把委屈往肚子里咽。</p>\n  <h2><strong>LV跌下神坛，背后是时代变了</strong></h2>\n  <p>正主告山寨，这些年已经屡见不鲜。</p>\n  <p>过去，很多人往往会站在正主这边怒斥山寨者，但现在越来越多的人反过来，开始为被告者鸣不平。</p>\n  <p>就像不久前，河南南阳一家卖8块钱一碗豌杂面的夫妻店渝见小面，因为商标问题被巨头遇见小面告上法庭，舆论却相当的一边倒，最后遇见小面也取消了诉讼。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_513a675857d4487f877116b7c72e2118@5579416_oswg75490oswg1080oswg707_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">渝见小面</p>\n  <p>没想到遇见小面好不容易平息下去的争议，后脚LV也陷进去了。</p>\n  <p>说到底，商标是护城河，不是摇钱树。甚至这一告，吃相难看是其次，反而更加暴露软肋。</p>\n  <p>为什么现在的人，如此反感大牌维权了？</p>\n  <p><strong>第一，是LV在中国维权的那套，外国��不好使。</strong></p>\n  <p>很多人不知道，LV在中国成功维权背后，在国外无一例外都是碰壁。</p>\n  <p>在老家法国，以及日本意大利美国，凡是涉及“老花、四叶草”这种案子，基本是全输。</p>\n  <p>比如在2023年，LV告自家法国老乡Zadig&amp;Voltaire，打了两年依然最后被巴黎法院判输，甚至还反手判LV要交3万欧诉讼费。好家伙，原来LV在国内告赢的，全是国外告输的？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_34b07d24d1b843f8ba3ad892e2bd34d3@5579416_oswg95000oswg1080oswg654_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>但从茉莉奶白这一次的舆论反噬能看出，中国消费者有了文化自信，不会再任由LV继续为所欲为。</p>\n  <p>尤其是告到停业餐吧与小微商户，这画风就更不对了，不像是捍卫品牌，更像是一种创收。这也是为什么网友观感不佳，品牌官号持续掉粉，更有不少消费者表态要“脱粉”。</p>\n  <p><strong>第二也是最致命的，LV自己也没新故事了。</strong></p>\n  <p>其实这些年，比起维权，LV拿不出过硬的产品才是原罪。</p>\n  <p>自从2022年，在CarryAll之后再无现象级爆款，2026年搞个洒水壶包，却被嘲博眼球，也没掀起什么水花。</p>\n  <p>一个数据很扎心，在LV皮具业务里，经典“老花”系列依然占超六成营收，还是公司的摇钱树。</p>\n  <p>纵观同行，爱马仕用手表系列给自家业绩回血，Miu Miu也推出新的保龄球包一度刷屏，年轻女生依然买账。</p>\n  <p>话说回来，LV维权的利器“老花”，从现实来看，与其说是它的护城河，更像是它的束缚。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_9121dd4800224184acab2ca33d7438da@5579416_oswg112590oswg1080oswg699_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV</p>\n  <p>这些年无数品牌的相似老花设计，再加上太多山寨包的出现，人们对其早已经视觉疲劳了。</p>\n  <p>一个老花显然不能吃遍天，成也老花，败也老花，LV不能再在“老花”的老本上躺赚，更不能妄想改个配色就让用户乖乖为涨价买单。</p>\n  <p>就像LV掌门人阿尔诺自己曾承认，“2026年不会太轻松”，如果不虚心听取中国用户的反馈，接下来的日子只能更艰难。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_8d1ea042f12e428aaf17b23e24d29d28@5579416_oswg44594oswg1076oswg630_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">LV掌门人阿尔诺</p>\n  <p>总之，想要真正度过危机，LV接下来的重心绝不是维权或刷脸。</p>\n  <p>放下套路好好做产品，才是得人心的杀手锏。</p>\n  <p><strong>向外攻击只能弄丢粉丝，向内防守才能赢得路人。</strong></p>\n  <p>图片来源于网络，侵权请联系删除</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/xRpYgkPqFE_5_XOtbrYcIQ\" rel=\"noopener noreferrer\" target=\"_blank\">“金错刀”</a>，作者：江源，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-12T09:29:03+00:00", "fetched_at": "2026-07-13T02:23:22.248969+00:00", "fingerprint": "0e5c4c90fb5aecc5"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨SK海力士CEO称史上最大存储短缺将在明年到来；苹果起诉OpenAI窃取商业机密‌；赛力斯预计上半年净亏损15亿元-18亿元", "url": "https://36kr.com/p/3893305996442118?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>世界杯决赛一块草皮卖3050元，上架后很快售空</li>\n   <li>中国石化完成对中国航油重组</li>\n   <li>巨力索具因误导性陈述被罚450万元</li>\n   <li>SK海力士考虑“内存即服务”模式，或允许客户租赁而非购买芯片</li>\n   <li>马斯克据悉要求特斯拉员工转向使用Grok</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>SK海力士CEO：2027年将成为存储行业历史上供应最紧张的一年</strong></p>\n  <p>美东时间周五（7月10日）晚间，SK海力士首席执行官郭鲁正（Kwak Noh-jung）向外界预计，2027年将成为存储行业历史上供应最紧张的一年。“现在客户纷纷前来SK海力士寻求长期供货协议。需求持续增长，而我们的产能却存在限制。尽管我们正尽最大努力扩充产能，但即使到2030年以后，客户需求仍可能高于公司的供应能力。”他说。他还表示美国在晶圆厂选址候选名单中，但尚未做出决定。公司将优先选择成本、土地、水电和技术工人条件优越的地点，美国、日本和东南亚均在考虑范围内。（新浪科技、证券时报）</p>\n  <p><strong>苹果在重磅诉讼中起诉OpenAI窃取商业机密‌，OpenAI回应</strong></p>\n  <p>苹果公司以窃取商业机密为由起诉OpenAI，指控该公司通过协同行动窃取苹果未发布产品的相关信息。苹果称OpenAI鼓动其员工分享未发布产品的相关信息、零部件、图纸及其他资料，以此来开发自家的全系列硬件产品。苹果要求OpenAI停止相关行为、销毁所有苹果的专有资料，并重新设计其待发布产品，确保其中不包含任何苹果的技术。对此，OpenAI回应称对其他公司的商业秘密不感兴趣，OpenAI仍专注于打造创新技术。（财联社）</p>\n  <p><strong>赛力斯：预计上半年净亏损15亿元-18亿元</strong></p>\n  <p>36氪获悉，赛力斯公告，预计2026年上半年归母净利润亏损15亿元到18亿元，上年同期盈利29.41亿元。受存储芯片、工业金属、碳酸锂等主要原材料价格上涨等因素的影响，公司生产成本随之增加；基于审慎性原则并进一步夯实整体资产质量，结合资产后续收益预期，对部分因技术迭代、车型换代导致适配性有限的存量资产调整账面价值。受上述因素影响，公司核心子公司问界汽车业绩出现波动，由盈转亏。因此，预计公司本期合并口径归属于上市公司股东的净利润为负值。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Meta紧急下线争议AI生图功能</strong></p>\n  <p>社交媒体巨头Meta本周推出一项允许用户通过@提及公开Instagram账号、利用他人公开内容生成AI图像的新功能。该功能上线时默认允许公开内容被引用，引发美国演员工会等机构对肖像权侵犯以及犯罪风险的强烈担忧。Meta表示，相关功能“未能达到预期效果”，因此决定全面下线。（财联社）</p>\n  <p><strong>FansAI收购OPC公司新映科技</strong></p>\n  <p>7月11日消息，AI内容和互动影视公司垚城智能（FansAI）宣布全资收购AI音乐应用新映科技，这是OPC领域目前少见的探索性并购案例。（新浪财经）</p>\n  <p><strong>腾讯洽购Manus？知情人士：腾讯仍将保留少数股东地位</strong></p>\n  <p>7月11日，有消息称腾讯正在洽谈成为通用AI Agent公司Manus的最大股东，据该消息，由腾讯牵头的中方资本组团以约20亿美元估值从Meta手中回购Manus的全部股权。记者向腾讯方面求证，截至发稿腾讯方面暂无回应。另有知情人士向记者透露，此次交易后，腾讯仍将保持少数股东地位，但不会控股。（南方都市报）</p>\n  <p><strong>马斯克据悉要求特斯拉员工转向使用Grok</strong></p>\n  <p>据报道，马斯克在一份备忘录中告知特斯拉员工，鉴于Grok 4.5的Token成本低于竞争对手，员工们应“尽可能”切换到Grok。他还要求工程师直接通过电子邮件向他反馈有关该模型的信息。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>智谱创始人唐杰发内部信：“GLM时刻”之后，什么是更重要的事</strong></p>\n  <p>36氪独家获悉，7月11日，智谱创始人唐杰，在智谱发布了主题为《巨浪已来》的内部信。其中提到，智谱将不追求短期的应用变现，而是直指AGI的下一个高地：长程任务能力、完全自治的智能体系统、自我进化、极致安全治理。过去半年来，智谱收获了创立以来的高光时刻：市值较半年前上市初期涨了10倍，并在2026年 6月，跻身“万亿港元俱乐部”。</p>\n  <p><strong>长鑫科技IPO周四迎来网上申购，将成为今年A股市场规模最大的IPO</strong></p>\n  <p>根据发行安排，7月16日，长鑫科技IPO将迎来网上申购，作为国产存储芯片巨头，5月27日IPO过会，6月12日注册生效，长鑫科技此次科创板上市，拟融资金额高达295亿元，将成为今年A股市场规模最大的IPO，也是科创板史上的第二大IPO，仅次于中芯国际的532亿元。长鑫科技网上发行申购上限为167.2万股，顶格申购需配沪市市值1672万元。Wind数据显示，长鑫科技是今年以来发行股票数量最多的新股，同时也是科创板历史上发行股票数量最多的新股。这意味着，长鑫科技的中签率预计较高。（央视财经）</p>\n  <p><strong>美���共和党“鹰派”参议员林赛·格雷厄姆去世</strong></p>\n  <p>美国共和党“鹰派”参议员林赛·格雷厄姆办公室通讯主任于美东时间7月12日凌晨在社交平台发文称，格雷厄姆因突发急病，于当地时间7月11日晚去世，终年71岁。据了解，林赛·格雷厄姆，1956年出生于美国南卡罗来纳州，共和党参议员，生前任美国参议院预算委员会主席。格雷厄姆在多数外交和安全议题上持强硬立场，他与美国总统特朗普关系密切，外界认为他是促使特朗普对伊朗开战的重要推手之一。他曾将美伊战事描述为一场“对石油资源的争夺”。（CCTV国际时讯、极目新闻）</p>\n  <p><strong>世界杯决赛一块草皮卖3050元，上架后很快售空</strong></p>\n  <p>2026美加墨世界杯决赛将在纽约新泽西体育场举行，但国际足联已提前发售决赛场地的草皮，价格为每份450美元（约合人民币3050元）。这款草皮藏品在国际足联官方商店上架后很快售空。国际足联官方商店的样品图片显示，一小片绿色草皮封装在有机玻璃立方体中，上面印着“纽约新泽西体育场”、比赛时间等字样。外包装是一个黑色盒子。产品套装还包含一个U盘，里面有一段认证视频。该商品的尺寸标注为“17.5×17.5×17.5”，但没有标注单位，也没有说明这是草皮、有机玻璃立方体还是外包装的尺寸。该商品将在世界杯决赛结束后开始发货，目前仅面向美国、欧洲发货。（央视财经）</p>\n  <p><strong>宇树G1机器人完成两例活体手术，登上《自然》</strong></p>\n  <p>国际学术期刊《Nature》近日发表了一篇题为《人形机器人用于外科手术的活体可行性研究》的论文。该研究由加州大学圣迭戈分校（UCSanDiego）团队完成，成功利用宇树G1人形机器人通过远程操作为两头活猪实施了腹腔镜胆囊切除术，这也是全球首例登上《Nature》的人形机器人活体手术研究。不过，研究团队也强调，人形机器人要在临床部署中真正替代或辅助人类医生，仍需克服一系列技术挑战。</p>\n  <p><strong>大疆回应无人机吊人救援：不建议模仿，救援受损设备将免费维修</strong></p>\n  <p>据蓝鲸新闻报道，针对近日广西洪灾中出现的无人机“空中吊人”救援行为，大疆官方昨日回应称，原则上无人机严禁载人，吊人仅属救援紧急情况下的特殊操作，后续仍不建议模仿。官方信息显示，参与此次救援的多为大疆FC100和FC200系列运载无人机，售价区间为77999元至170999元。针对救援工作，大疆农业及运载系列已推出售后关怀政策，凡在救援期间出现故障或损坏的设备，经核实后由授权服务门店提供免费维修保障。（蓝鲸新闻）</p>\n  <p><strong>Meta面临1.4万亿美元罚款，被指控侵害未成年人权益</strong></p>\n  <p>美国4州联合指控“元”公司（Meta）利用成瘾算法诱导未成年人，并隐瞒其对青少年心理健康的负面影响，索赔高达1.4万亿美元；全美已有29州就此提起诉讼。与此同时，欧盟委员会依据《数字服务法》发布初步报告，要求Meta修改“自动播放”“无限滚动”等成瘾性设计，否则面临全球年收入6%的巨额罚款。Meta否认指控，并表示将继续抗辩。（央视财经）</p>\n  <p><strong>离开俞敏洪后，孙东旭与前东方甄选主播石明、天权合伙开公司</strong></p>\n  <p>近日记者查询发现，“美丽明天（北京）科技有限公司”于7月10日成立，企查查app显示，该公司股东共有三人分别是孙东旭与石明、郭天权。与东方甄选前CEO孙东旭、前主播明明、天权同名。三人分别出资340万与330万元，其中孙东旭持股比例最多为34%，任经理、董事、财务负责人。此外，国家企业信用信息公示系统显示，该公司经营范围包含鲜肉批发；鲜肉零售；水产品批发；水产品零售；新鲜水果批发；新鲜水果零售；新鲜蔬菜批发；新鲜蔬菜零售；化妆品批发；化妆品零售；演出经纪；网络文化经营等。（蓝鲸新闻）</p>\n  <p><strong>小米回应澎程N90的定价猜测</strong></p>\n  <p>小米汽车官方回应全新增程SUV澎程的网传售价传闻，称不少猜测脱离造车基础成本逻辑，呼吁大众理性看待定价预期，新车主打家庭多元空间，和现有轿车产品线平行，近期就会公布确切发布时间，准确信息以官方渠道为准。&nbsp;</p>\n  <p>此外在答网友问第 259 集中，小米还针对澎程的上市准备工作、澎程这么大的车开起来是否会有压力、撕车衣视频是什么等问题进行了解答。（新浪财经）</p>\n  <p><strong>特斯拉下令冲刺年产10万台Optimus，马斯克放话：必须实现，否则撤换整个采购团队</strong></p>\n  <p>近期，多位特斯拉供应链知情人士透露，特斯拉近期已向供应商下发具体的Optimus零部件采购指引。特斯拉要求，今年9月前产能需提升至每周1000台，年底前把产量提升到每周2000至2500台。按年底周产能推算，届时供应商将具备向特斯拉供应约10万台Optimus零部件的年化能力。据媒体报道，马斯克曾在会上向团队下达了明确的命令：必须在年底前实现产能目标，否则整个Optimus采购团队将被撤换。有供应链人士表示，这比任何纸面上的订单指引都更能体现特斯拉的决心。（21世纪经济新闻）</p>\n  <p><strong>消息称迪士尼考虑推出免费版Disney+服务</strong></p>\n  <p>据悉，迪士尼正在考虑探索免费流媒体服务，让用户可以不花钱观看 Disney+ 的部分内容。过去十年来，各大流媒体平台订阅服务价格不断上调，反而让越来越多观众流向 YouTube 等免费平台。迪士尼的免费流媒体服务究竟会提供哪些内容仍不得而知。但该公司已在今年早些时候布局竖屏短视频领域，将原创内容与宣传片结合。（IT之家）</p>\n  <p><strong>中国石化完成对中国航油重组</strong></p>\n  <p>据中国石化新闻办消息，中国石化宣布完成对中国航油的重组工作，中国航油正式成为中国石化二级全资子公司。这是推进中央企业战略性、专业化重组的重要举措，也是服务国家战略、应对国际竞争的主动作为，将提升保障国家航空能源供应安全能力和水平，推动航空能源供应绿色低碳转型，更好地服务人民美好出行需要。（央视新闻）</p>\n  <p><strong>巨力索具因误导性陈述被罚450万元</strong></p>\n  <p>36氪获悉，巨力索具公告，公司收到河北证监局下发的《行政处罚决定书》，因在深交所互动易平台回复投资者提问时未准确披露商业航天领域产品应用情况、订单金额及占比等，构成误导性陈述。河北证监局决定对公司责令改正，给予警告，并处以450万元罚款；对时任董事会秘书张云给予警告，并处以300万元罚款；对时任总经理杨超给予警告，并处以200万元罚款。</p>\n  <p><strong>SK海力士考虑“内存即服务”模式，或允许客户租赁而非购买芯片</strong></p>\n  <p>SK海力士正在考虑以新的方式销售其内存芯片的使用权，包括所谓的“内存即服务”，这意味着客户可以向这家韩国公司租用存储资源，而无需购买芯片。“我们实际上可以提供其他商业模式，”SK集团会长崔泰源在接受彭博电视采访时表示。“我们可以成为存储服务提供商，提供‘内存即服务’。未来，这实际上是我们可以关注的另一个领域。”（财联社）</p>\n  <p><strong>OpenAI安全系统负责人据悉将离职</strong></p>\n  <p>据报道，在OpenAI重组之际，该公司安全系统负责人Johannes Heidecke本周告知员工其将离职。此次重组旨在整合OpenAI的安全团队和研究团队。备忘录显示，OpenAI首席研究官Mark Chen表示，安全团队将向公司研究副总裁兼整合负责人Mia Glaese汇报工作，后者将兼任研究与安全副总裁。此前领导 OpenAI安全团队的Saachi Jain将成为公司临时安全系统负责人，向Glaese汇报工作。（界面新闻）</p>\n  <p><strong>三菱汽车将量产人形机器人，未来或考虑对外销售</strong></p>\n  <p>三菱汽车7月9日表示，将在日本工厂启动人形机器人量产。三菱汽车与其投资的新兴企业Highlanders共同开发的人形机器人将于2027年左右投产，并率先导入自有工厂使用，未来还将考虑对外销售。公司将在生产发动机的京都工厂闲置空间新建生产设备，月产能计划为1000台。（界面新闻）</p>\n  <p><strong>上半年中国创新药对外授权规模接近去年全年</strong></p>\n  <p>2026年上半年，中国共计获批38个创新药，11个新靶点、新机制药物均为国产。与此同时，中国创新药同期对外授权的交易总额接近1100亿美元。12日，在北京·昌平生命科学论坛上，国家药监局药品注册管理司相关负责人披露了中国创新药发展的最新“成绩单”。根据国家药监局统计，2025年全年，中国创新药对外授权的交易总额为1356.55亿美元。换言之，今年上半年，中国创新药对外授权规模已接近去年全年。（第一财经）</p>\n  <p><strong>欧洲央行的Moulin认为人工智能可能加剧通胀波动</strong></p>\n  <p>欧洲央行管委Emmanuel Moulin表示，人工智能对通胀的影响难以预测，而且可能导致价格波动加剧。“由于人工智能同时作用于供需两方面的变量，因此对通胀的总体影响尤为难以预测，”Moulin在Investir刊登的评论中表示。“此外，其影响可能不仅体现在通胀水平，还可能体现在通胀的波动。”这位法国央行行长表示，由于资本支出增加，人工智能短期内可能具有通胀效应，但随着生产率提升，后续则可能抑制通胀。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>长江存储，31人IPO“辅导天团”亮相</strong></p>\n  <p>长江存储IPO辅导工作迎来首期进展更新。7月10日，证监会官网披露其辅导工作第一期报告，一个细节尤为抢眼——中信证券、中信建投两家券商合计派出31人组成辅导团队，如此规模在近年IPO项目中并不多见。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“鹰瞰智翼”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，具身智能仿生扑翼飞行机器人公司“鹰瞰智翼”已于近期完成数千万元A轮融资。本轮融资是公司在三个月内完成的第三轮融资，由元禾璞华领投，孚腾资本、厚雪资本跟投。资金将主要用于首款消费级产品的量产备货、市场拓展，团队扩充以及下一代具身智能扑翼机器人与流体仿真引擎的研发。</p>\n  <p><strong>整理</strong>｜迟雨</p>", "category": "tech", "published_at": "2026-07-12T23:55:49+00:00", "fetched_at": "2026-07-13T02:23:22.248960+00:00", "fingerprint": "af3e3af3b0ad53e4"}, {"source": "36氪 - 最新文章", "title": "年入4亿、服务600+品牌，膳食补充剂原料商「纽邦生物」获近2亿元C+轮融资｜36氪首发", "url": "https://36kr.com/p/3890940898867712?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，南京纽邦生物（NNB Nutrition）近期已完成近2亿元人民币融资。本轮融资由国寿股权领投、老股东明熙资本跟投，募集资金主要用于产品研发、新工厂建设等。这也是纽邦生物半年内完成的第二笔超亿元人民币融资。</p>\n  <p><a href=\"https://36kr.com/p/3096473908923911\" rel=\"noopener noreferrer\" target=\"_blank\">纽邦生物</a>专注于膳食补充剂原料研发，累计推出40余款原创原料，在研产品管线超100项，覆盖运动营养、体重管理、认知健康、抗衰等领域，服务雀巢、联合利华、百事等600余个终端品牌；公司自建制剂工厂、生物合成工厂，并规划建设占地超200亩、年产万吨级的综合工厂。2025年，纽邦生物全年营收突破4亿元人民币。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260711/v2_abaf0a8172174cbd959750b9002e31c9@5930287_oswg565903oswg2294oswg959_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纽邦生物产品矩阵示意</p>\n  <p>纽邦生物创始人廖琪林深耕膳食补充剂行业十余年，据他观察，近年来，健康消费市场有两大转变，一是需求端从基础营养转向精准调理；另一方面，便捷性成为重要消费诉求，消费者期待通过日常饮食、饮品直接获取营养与调理功效。这也使得过往倾向于做片剂、粉剂、软糖等传统形态产品的终端品牌，如今在大力布局适配日常场景的功能饮料、特色功能食品。</p>\n  <p>“这类新型产品形态已成为主流。而下游需求端与产品形态的革新，也改变了终端品牌对我们这类原料供应商的选择标准。如今，在功能功效、合规等基础要求之外，他们更看重原料在这些新剂型、新应用场景中的实际表现，比如是否具备更好的稳定性、溶解性、口感适配性和配方兼容性。”廖琪林解释。</p>\n  <p>传导至上游环节，这意味着原料企业需同步实现研发效率、研发能力和覆盖广度等维度的提升。基于此，纽邦生物内部已升级原料筛选标准，推出Pure、Potent、Precise“3P”标准，要求原料兼具高纯净度、功效强的同时，在使用剂量上“足够精准、足够小”。</p>\n  <p>廖琪林介绍，不同于行业多数原料厂商，纽邦生物一直坚持以创新药研发逻辑开发膳食营养原料。这其中的关键一点是，公司会按照“类似创新药研发的标准设计相关临床试验研究，并将相关数据提供给合作方”，以证明产品的安全性和功效性。截至目前，纽邦生物已落地数十项临床前和临床试验，未来仍将按照每年新开10余项试验的速度推进。</p>\n  <p>支撑这种高标准临床研发的，是纽邦生物搭建的多技术融合研发矩阵，主要覆盖合成生物学、化学合成、植物提取、制剂四大核心技术路线。“这种‘多端融合’的布局，使得我们不需要局限在单一技术路径内，而是以市场终端需求为导向，灵活调配工艺、提高研发效率。目前，我们有多款产品均依靠这种模式协同完成开发。”</p>\n  <p>据介绍，纽邦生物曾有一款代表性产品，在项目研发初期，团队原本计划依托合成生物学工艺完成量产。但该品类属于行业全新创新品类，公开技术研究储备稀少，公司自身配套工艺体系也尚未完善，难以直接落地生物合成路线。</p>\n  <p>为抢抓市场窗口期、抢先布局赛道形成先发优势，纽邦生物团队先落地化学合成工艺，实现产品商业化投放。后来，团队虽攻克了合成生物学相关的技术瓶颈，却发现，单独使用化学合成或合成生物学方法都存在短板，复合工艺才是最优方案，最终实现生产效率与产品稳定性双重提升。</p>\n  <p>谈及近两年，一批合成生物概念企业涌入营养原料赛道，廖琪林认为，两者的核心战场不完全相同，纽邦生物主要从事“未曾被商业化的创新原料研发”，而部分合成生物公司主打低成本发酵工艺，把现有产品“通过新生产方式重做一遍”，因此不会对公司构成直接冲击。</p>\n  <p>“实际上，我们也在构建自己的合作伙伴体系，如果这类合成生物学企业在某个技术点或品类上有优势，我们也希望大家能一起合作开发新产品，或将他们已经做出来的、具备技术优势的产品，利用纽邦生物的体系进行更好的商业化。”</p>\n  <p>商业化层面，相较于传统原料贸易销售，“要素品牌（Ingredient Branding）”是纽邦生物当前主打的差异化模式。它通常指核心供应商面向消费者打造独立品牌，依靠消费者对该要素的认同，带动终端品牌主动选用自己的产品，形成双向赋能。例如，打出“Intel Inside”的英特尔、影音领域的杜比、徕卡光学镜头、宁德时代动力电池等均采用这套模式。</p>\n  <p>廖琪林介绍，经过多年实践，纽邦生物的要素品牌“在市场上的影响力不断提高”。目前，业内已有数百家终端品牌选择在产品标签中展示、宣传纽邦生物的原料品牌。“比如，我们曾经与卡戴珊相关品牌合作过一款产品，使用了纽邦生物的两款原料作为核心配方。卡戴珊本人也曾经在不同场合、不同内容中提到过这两款原料。”</p>\n  <p>另据了解，针对计划出海的跨境营养品牌，纽邦生物除供应原料外，还可配套提供全球化代工体系，提供美国、欧洲多地合规工厂生产资源，一站式完成海外成品落地；并依托海外渠道资源，协助合作品牌对接当地线下零售终端，打通海外上架链路，开拓海外消费市场。</p>\n  <h3>投资人观点：</h3>\n  <p>国寿股权表示：创新功能原料是膳食营养补充剂筑牢行业壁垒、实现提质扩容的核心支点。随着大众健康消费意识持续提升，叠加全球功能原料市场需求逐步增长，行业整体迈入创新驱动的发展新阶段。纽邦生物长期布局创新功能原料赛道，在细分领域持续开展业务布局，为银发人群及更广泛消费者提供健康相关产品解决方案。我们希望依托本次投资合作，助力纽邦生物在全球膳食补充剂市场中走出中国创新路径。</p>\n  <p>明熙资本表示：膳食补充剂兼具大健康与消费品双重属性，随着全球消费者健康管理意识提升，以及终端产品形态从传统营养补充向更日常化、场景化的功能食品与功能饮品延展，创新功能原料正成为驱动行业升级的核心变量。纽邦生物长期坚持以创新药研发逻辑开发膳食营养原料，围绕多元技术路径持续构建产品研发、临床验证、专利保护与要素品牌等多维壁垒，形成了兼具研发深度与商业化效率的平台型创新能力。作为老股东，明熙资本持续看好纽邦生物对终端需求的深刻洞察、持续推出高品质创新原料的能力，以及面向全球市场的长期成长潜力。</p>", "category": "tech", "published_at": "2026-07-13T00:00:00+00:00", "fetched_at": "2026-07-13T02:23:22.248946+00:00", "fingerprint": "4aa9a653a94fa652"}, {"source": "少数派", "title": "6月音乐精选：不得不听的 17 张……没错 17 张专辑！", "url": "https://sspai.com/post/112035", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/112035\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-12T02:03:12+00:00", "fetched_at": "2026-07-13T02:23:20.346656+00:00", "fingerprint": "63a882634 almost ready to bring it to market. The duo brought it to the MusicRadar offices for an in-depth first look and revealed that it will be launching [&#8230;]", "category": "tech", "published_at": "2026-07-11T20:57:42+00:00", "fetched_at": "2026-07-12T02:21:37.553083+00:00", "fingerprint": "7b1d27bd90a85f69"}, {"source": "36氪 - 最新文章", "title": "独家 | 智谱创始人唐杰发内部信：「GLM 时刻」之后，什么是更重要的事", "url": "https://36kr.com/p/3891132709206784?f=rss", "summary": "<p>文 | 周鑫雨</p>\n  <p>编辑 | 张雨忻</p>\n  <p>《智能涌现》独家获悉，2026 年 7 月 11 日，智谱创始人唐杰，在智谱发布了主题为《巨浪已来》的内部信。</p>\n  <p>过去半年来，智谱收获了创立以来的高光时刻：市值较半年前上市初期涨了 10 倍，并在 2026 年 6 月，跻身“万亿港元俱乐部”——这个数字，是百度市值的近 3 倍，并且超过了小米。7 月 8 日，首批股票解禁后，智谱依然稳住了股价。</p>\n  <p>这也是当下 AI 大模型赛道，最性感的故事：押注对的技术方向，换来斐然市场口碑和商业化成绩。</p>\n  <p>抽丝剥茧，智谱起飞的根源，离不开一年前对 Coding 的押注。2025 年初，智谱就开始重新分配资源，将力量收敛到了对模型 Coding 能力的提升上。</p>\n  <p>一场活动上，清华大学计算机系教授、智谱创始人唐杰点出了押注 Coding 的理由：DeepSeek R1 的出现，标志着 Chat 范式的探索已经基本结束。后DeepSeek时代的模型训练范式，他形容智谱“Bet（赌）”了 Coding 和 Reasoning——一种能与 Agent 共生共荣的模型能力。</p>\n  <p>事实证明，这是一次成功的赌注。</p>\n  <p>如今，AI Coding 已经成了 AI 商业化的最近端。一个典型的案例，是同样靠押注 Coding，对 OpenAI“弯道超车”的 Anthropic。2024 年 1 月，Anthropic 的年化收入还只有 8700 万美金；2026 年 6 月，它的 ARR 已经突破 470 亿美元，</p>\n  <p>2025 年 7 月发布的旗舰模型 GLM-4.5，到 2026 年 6 月上线并开源的 GLM-5.2，让智谱跻身全球 AI Coding 第一梯队。 开源的 GLM-5.2，多个核心指标已经追平甚至超过了 Claude Opus 4.8，以及 GPT-5.5。</p>\n  <p>技术能力，也体现在了营收上。智谱 2025 年财报显示，截至报告期末（2026 年 3 月），MaaS 平台的 ARR 达到了 17 亿元，过去一年提升了 60 倍。</p>\n  <p>而唐杰的内部信，向我们展示了后 Coding 时代，智谱押注的新命题：</p>\n  <ul>\n   <li><strong>长程任务能力</strong>（Long Horizon Task）</li>\n   <li><strong>完全自治的智能体系统</strong>（Autonomous Agent System）</li>\n   <li><strong>自我进化</strong>（Self-Evolving）</li>\n  </ul>\n  <h3>以下是唐杰的内部信内容：</h3>\n  <p>巨浪已来</p>\n  <p>——致每一位智谱人和关心人工智能未来的伙伴</p>\n  <p>请允许我借这篇文章，谈三件事：我们是谁，我们如何看待这个时代，以及我们决定全力倾注的战略方向。</p>\n  <h4>（一）我们是谁：“本质、反直觉、专注”</h4>\n  <p>智谱从不是一家追风口的公司。它从一间实验室里长出来，带着这间实验室二十年的方法论。这套方法论可以用三个词概括：本质、反直觉、专注——想得足够深，才敢选得足够反；选得足够反，就必须守得足够久。</p>\n  <p>回望来路，我们几乎每一个关键选择都曾经显得“反直觉”。2006年，我们守着一台台式机上的学术搜索系统坐冷板凳，因为我们想清楚了那背后是“挖掘学科演化机理”这件值得用十年回答的事；2021到2022年，当“让机器像人一样思考”被绝大多数人视为登月般的疯狂计划时，我们抽调资源、押注千亿参数，做出了GLM-130B——那是ChatGPT引爆世界整整一年半之前；而在智谱2026年1月8日H股上市的那一天，我们把它当作一个全新的起点，坚定地全面回归基础模型研究，全力冲击下一代模型。</p>\n  <p>别人敲钟，我们归零。这不是姿态，这是信念——既然终点是AGI，那么短期利益或者行业风口，都只是通向终局的沿途风景。</p>\n  <p>支撑我们一路走到今天的，是一种极致的专注和至真至纯的理想主义。学术搜索系统从一台台式机做到千万用户，我们用了十年；大模型这条路，我们又做了近十年，并且还会坚定深耕，继续走下去。今天的智谱，是一群愿意追问本质、敢于反直觉，又能专注地把事情做到底的人——这就是智谱核心竞争力的来源。</p>\n  <h4>（二）我们如何看待这个时代：智能的上界正在被改写</h4>\n  <p>如果说过去二十年我们学会了一件事，那就是：真正的商业机会，从来不在产品和模式的微调里，而在智能上界的跃迁中。这是我们对当下AI变革最根本的判断，也是我们最想传递给大家的认知。</p>\n  <p>这一次变革，本质不是一次产品创新或商业模式创新，而是技术革命本身抬高了“智能上界”。谁能率先将该上界向上推升一寸，谁就能重新定义千行百业的能力边界。所有聚焦第一性原理的新一代AI企业，争夺的正是这一寸的突破。</p>\n  <p>而智能上界的演进，有一条清晰的路径。人工智能正在完成从感知智能到认知智能的跨越——机器不再只是“看见”和“听见”，而是开始“理解”和“推理”。而下一步，正指向AGI。</p>\n  <p>我们对AGI有一个朴素而苛刻的定义：AGI不是某一个天才的智慧，而是全人类智慧水平的总和。它理应具备创造出“相对论”级别原创知识的能力，这是我们衡量是否真正到达巅峰的唯一标准。通往这个终点的道路上，有几座必须翻越的山峰，它们也正是今天技术浪潮最汹涌的地方：</p>\n  <p>第一座：<strong>长程任务能力（Long Horizon Task）</strong></p>\n  <p>今天最令人兴奋的突破，是让模型学会完成一个极长的任务——不是即时问答，而是跨越数周、数月乃至数年的规划与执行。例如，一个模型可以不知疲倦地在软件中寻找漏洞，本质上是在学习一名顶级安全专家的思维方式，然后通过机器的耐力把它放大。</p>\n  <p>第二座：<strong>完全自治的智能体系统（Autonomous Agent System）</strong></p>\n  <p>在长程任务之上，能够自主驱动、协同作业、7×24小时运转的智能体群体将成为新的生产力形态。我们曾提过“一人公司OPC”，但技术的脚步比预想更快——我们正在走向“全自动化公司NPC”。记忆（Memory）、持续学习（Continual Learning）、自我评判（Self-Judge）这三个曾被认为需要范式变革才能解决的难题，现已在技术与应用的双重驱动下逐步消解：长上下文与检索增强生成（RAG）逼近记忆雏形；模型迭代频次的提升本身即在逼近持续学习；前沿模型已显露自我评判的萌芽。</p>\n  <p>第三座：<strong>自我进化（Self-Evolving）</strong></p>\n  <p>这是最艰难、也最诱人的一座。AI训练AI已经成型——模型自己写代码、自己清洗与合成数据、自己训练自己。这或许会消耗一些算力，却节省了最宝贵的人力与时间。而在大模型时代，速度是最重要的，快速迭代会直接拉开认知的代际差距。当海外头部企业开始筹建百万乃至两百万芯片级别的算力集群，其真正的用途，很可能正是让模型自己训练自己。</p>\n  <p>翻过这三座山之后，会发生什么？</p>\n  <p>AI将开始学习什么是“我”，什么是自我认知；再往后，它会触及人类的情感；更远处，是意识本身。从感知到认知，从认知到通用，从通用走向超级智能（ASI）——这条路已经铺开，巨浪已来，且不可逆转。</p>\n  <p>这并非我们一家之言。Google DeepMind在《From AGI to ASI》报告中给出了一个冷峻的论断：即便单个模型的能力永远停在人类水平，只要算力还在增长，超级智能可能会被硬生生“挤”出来。他们推演，若全球可运行AGI实例以每年十倍速增长，五年后将达一亿个。这些共享同一底层大脑、思考效率百倍提升且零成本复制经验的智能体，在群体层面即等同于ASI。换言之，从AGI迈向ASI，既需要算法层面的突破，也需要超大算力资源的汇聚。</p>\n  <p>这种不可逆转的趋势将自上而下穿透整个技术栈：当AGI到来，今天的应用或许都要被重构为AI原生，甚至不再需要这些应用；操作系统可能被重写，未来你打开电脑，看到的将是一个“LLM OS”，所有功能按需生成（generate on demand）；再往深处，是对运行了八十年的冯·诺依曼体系的挑战。金融、法律、电商、互联网……没有一个行业会置身事外。很多朋友找到我，说想变革企业、追赶AI的步伐，但真正洞察到“这场不可逆变革已然开启”者，仍属寥寥。</p>\n  <h4>（三）我们全力倾注的方向：“摸高”</h4>\n  <p>认清趋势之后，剩下的就是选择。而智谱的选择，一如既往地“反直觉”—— 在行业普遍加速商业变现的当下，我们决定向上突破。</p>\n  <p>我们将这一战略命名为 “Touch High（摸高）计划”。在人工智能从感知、认知向完全通用智能跨越的历史节点，智谱将以“摸高”的姿态，挑战当前技术的物理与算法极限。未来两年，我们计划战略性投入——不追求短期的应用变现，而是直指AGI的下一个高地。</p>\n  <p>这笔投入将集中在四大核心引擎上：</p>\n  <p>其一，长程任务。让AI从“即时问答”走向“宏大工程”，研发新一代记忆架构，使模型贯穿项目全生命周期“边学、边做、边记”，并具备将宏大目标（如“设计一种新型抗癌药物分子”）自主拆解为数千个可执行子任务的顶层能力。</p>\n  <p>其二，自治智能体系统。从“智能助手”走向“数字员工”，构建包含成千上万个不同专业“性格”与“技能”的智能体社会，让它们自主辩论、协作、审查代码、调度资源，实现“自动驾驶”级别的数字生产力。</p>\n  <p>其三，完全自我训练（Fully Self Training）。在人类高质量数据即将耗尽之际，把算力转化为进化的燃料——建设高质量合成数据工厂，通过AI与AI的博弈对抗（Self-Play）实现知识的“无中生有”，并在安全沙盒内赋予系统重构自身代码的能力，让进化速度挣脱人类工程师的物理限制。</p>\n  <p>其四，极致安全治理。这是四大引擎中我最想着重强调的一个。</p>\n  <p>能力越强大，安全约束机制也必须越稳固。智谱创立伊始即确立准则：AI必须服务于人类福祉，服务于国家战略。公司摒弃外挂式安全补丁，坚持将人类伦理、社会规范及国家法律法规作为底层公理写入模型价值函数；计划投入百亿级资源攻坚“机械可解释性”，厘清模型决策背后的神经元逻辑，推动黑盒系统向透明可解释系统转变；同时积极参与国际AI治理，防范AI技术被滥用。</p>\n  <p>这种紧迫感并非杞人忧天。当海外最前沿的顶级模型因风险考量而暂缓全面公开发布，其企业负责人公开警示AI的深远影响将深刻重塑全球力量格局时，我们更应清醒：超级智能的实现与超级对齐的研究，必须同步推进。这也是我们在面对颠覆性技术时反复审视的命题——历史一再表明，当一项技术抵达足以改变文明进程的力量量级时，安全就不再是附属品，而是技术得以存续与被允许应用的根本前提。</p>\n  <h4>（四）开放生态：智能普惠和安全治理的底层逻辑</h4>\n  <p>我们始终认为，人工智能作为引领未来的战略性技术，其长远发展离不开开放协同的产业生态。前沿智能的价值不仅在于技术突破本身，更在于它能否广泛赋能千行百业、惠及每一位开发者。我们坚信，真正的安全并非建立在技术封闭与壁垒之上，而是源于阳光下广泛的共建、共享与监督。</p>\n  <p>正是基于对技术普惠的深刻认同，智谱给出了自身的战略答卷。近日，我们发布了迄今能力最强的开源模型 GLM-5.2，它支持真正可用的百万（1M）上下文，在长程任务上继续保持领先，面向全量用户开放，并将以最宽松的 MIT 协议正式开源——任何人都可以下载、部署、商用，没有主体界别。这是公司以产品形态表达的坚定态度。</p>\n  <p>我们选择相信另一条路：前沿智能不应只属于少数人，也不应被少数规则随时收回。它应该开放、可用、可构建，并服务于每一位开发者。</p>\n  <p>这与“摸高”并不矛盾，反而是一体两面：我们一只手向上摸高，挑战智能的极限；另一只手向下铺路，让最前沿的能力尽可能地开放与普惠。摸到的高度属于全人类，修成的道路也属于每一个人。</p>\n  <h4>（五）结语：为什么是现在，为什么是我们</h4>\n  <p>有人会问：为什么智谱上市后反而还要继续倾注核心资源、向最不确定的方向“摸高”？因为我们相信一个朴素的道理：真正的登顶者，会把山修成路。</p>\n  <p>我们想清楚的那个本质，曾通过“悟道大模型”项目凝聚成几百位科学家的共识，又通过智谱的产业投资和整个生态，变成一代创业者起跳的基石。今天，我们想把这条路修得更高、更宽——高到能保护我们自己、守卫国家安全，高到能让人类有机会探索更多未知，探索宇宙的奥秘；也宽到能让每一位开发者、每一个团队，都走得上来。</p>\n  <p>在AGI时代，这些曾经遥不可及的事，第一次有了实现的可能。这正是我们这一代国人最大的幸运，也是最重的责任。</p>\n  <p>巨浪已来，趋势不可逆转。智谱要做那个迎着浪头、向上摸高的人。</p>\n  <p>不登顶，就是失败。</p>\n  <p>这一次，我们要摸到的，是属于全人类的那个高度。</p>\n  <p>智谱创始人 唐杰</p>\n  <p>2026年7月11日</p>", "category": "tech", "published_at": "2026-07-11T11:28:29+00:00", "fetched_at": "2026-07-12T02:21:37.454097+00:00", "fingerprint": "7392b4597f3a068b"}, {"source": "36氪 - 最新文章", "title": "近百名玩家涌入具身数据 : 一年融资44.7亿，谁能真靠“卖数据”赚钱？", "url": "https://36kr.com/p/3892027841362694?f=rss", "summary": "<p>林方舟 发自 凹非寺</p>\n  <p>在湖南郴州，一家中国移动营业厅挂牌“具身数据采集5S店”，普通顾客领一套夹爪、手套和头戴相机，经过简单培训，就能边做家务，边采集机器人训练数据。</p>\n  <p>首期投放的1000套设备，满产状态下每年能采集100万小时数据。我仿佛听到了商家心里打的小算盘：既采了数据，又赚了眼球，4A广告公司都应该来学学。（doge）</p>\n  <p>具身数采类似的“花活”还有不少：有的为了采数据免费上门保洁（欢迎来我家），有的把数采做成VR游戏，还有的把机器人接入互联网，采集员不用跑到数采工厂，远程就能“云操控”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_426cea8d4ed241cb84408213126fa22e@5579416_oswg1018637oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <p>不过，以上案例看完笑一笑就好了，真要采到符合要求的数据其实并不简单。之所以“花活”层出不穷，都是因为机器人实在是太缺数据了。</p>\n  <p>眼下大家都在牟足了劲采数据，但还少有人全面梳理过这个行业的图谱。</p>\n  <p><strong>量子位不完全统计了97家国内具身数据玩家的情况</strong>，其中70家做数据采集，27家做数据infra。</p>\n  <p>过去一年（2025年7月1日至2026年7月1日），15家「不做本体、不做模型、只做数据的<strong>独立具身数据服务商</strong>」，共融资约44.7亿元。</p>\n  <p>在资本对具身智能“猛猛上头”的当下，这个数字其实并不算多。量子位此前统计，今年上半年，具身“大脑派”公司半年就融了223亿元。</p>\n  <p>为了帮你看清具身数据行业，我们总结了以下十个行业现状。</p>\n  <h2><strong>数据怎么采？</strong></h2>\n  <p><strong>现状1：数据采集技术路线分为四大类，跨路线采集赛道最拥挤</strong></p>\n  <p>目前主流具身数据采集的技术路线可以分为四大类：</p>\n  <p>真机遥操：人类操控真实机器人执行任务，同步采集动作、状态及传感器数据。</p>\n  <p>无本体采集：人直接完成示范，通过动捕、夹爪映射、第一视角相机等设备采集动作，无需机器人参与。</p>\n  <p>仿真合成：在虚拟环境中批量生成机器人交互数据，用于模型训练。</p>\n  <p>互联网视频蒸馏：从互联网视频中提取人类动作知识，转化为具身模型可学习的数据。</p>\n  <p>量子位不完全统计的70家数采公司/平台中，有30家同时走多条采集路线，占43%，例如：真机遥操+无本体、真机遥操+仿真、无本体+仿真、全路线等。</p>\n  <p><strong>走跨路线采集方案的玩家，比单独押注任何一条路线的玩家都要多。</strong></p>\n  <p>行业常用数据金字塔来形容机器人训练所需的数据结构。目前没有任何一种数据采集方式能够独自满足机器人的训练需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_c2d5d42267734d41aaac6fc949bc9d29@5579416_oswg1053460oswg1024oswg1536_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△</p>\n  <p><strong>现状2：单独押注真机遥操路线的玩家最多</strong></p>\n  <p>依次分析每条技术路线。</p>\n  <p>单独押注真机遥操路线的最多，有22家，占31%。</p>\n  <p>这22个玩家中，13家是国资数据平台，7家是机器人公司（生产机器人硬件或开发具身大模型的公司），还有1家从AI数据标注行业转型，1家从工业装备制造领域跨界。</p>\n  <p>机器人公司有硬件优势和真实需求，做真机遥操采集是自然而然的选择。</p>\n  <p>而国资数据平台的优势则是“不怕重”。遥操是重资产路线，需要买本体、租场地、雇操作员，这些恰好都是国资平台容易调动的资源。</p>\n  <p>单独押注无本体采集路线的公司有15家，占21%。</p>\n  <p>这条赛道的公司最年轻，绝大多数都成立于2024年9月之后。</p>\n  <p>无本体采集路线的技术也最丰富，子类包括：Ego视角、UMI、动作捕捉、sEMG肌电、触觉采集……</p>\n  <p>而单独押注仿真合成的玩家有2家：松应科技和谋先飞（Motphys）。</p>\n  <p>仿真赛道曾经的知名玩家，如今都选择把鸡蛋放在多个篮子里。</p>\n  <p>比如，曾以仿真数据为核心的光轮智能，也开始采集人类数据；曾是最坚定的仿真派之一的银河通用，今年6月发布了全身遥操作系统，拥有了遥操数据采集能力。</p>\n  <p>原因有两方面：外部，真机数据和人类数据的供给快速增加，价格持续下降，仿真数据的规模和成本优势被削薄；内部，sim2real gap仍没有太好的解法，很难高保真还原真实世界中的摩擦、形变、力觉与触觉反馈。</p>\n  <p>单独押注互联网视频蒸馏路线的也只有1家：枢途科技。</p>\n  <p>这家公司从互联网单目RGB视频里提取多模态机器人训练数据，宣称能把综合采集成本降到行业平均水平的千分之五。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_4feabe3e8063467789d7678f6c228084@5579416_oswg964343oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <h2><strong>玩家是谁？</strong></h2>\n  <p><strong>现状3：独立数据服务商已成最大的玩家群体</strong></p>\n  <p>如果不按技术路线，而是按身份分类，97名玩家可分为5类：</p>\n  <p>独立数据服务商39家，占40%；</p>\n  <p>国资数据平台25家，占26%；</p>\n  <p>机器人公司24家，占25%；</p>\n  <p>工业和IT跨界公司5家，占5%，例如来自物流、装备制造、自动化工程等领域的公司；</p>\n  <p>大厂平台型公司4家，占4%，例如华为、京东等。</p>\n  <p>可以看到，<strong>最大的玩家群体是独立数据服务商。</strong></p>\n  <p>这说明：具身数据已经成长为一条独立赛道，不再是机器人公司的附属部门。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_6a2f527e1519466fa104d9665351a07f@5579416_oswg1017151oswg1024oswg1536_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△</p>\n  <p><strong>现状4：三分之二玩家“具身原生”，三分之一玩家“跨界转型”</strong></p>\n  <p>再换一种分类方式，将所有具身数据行业玩家分为“具身原生”和“跨界转型”两类。</p>\n  <p>“具身原生”公司成立之初主业就是具身数据或具身智能相关业务；“跨界转型”公司多从AI数据标注、自动驾驶、动作捕捉或工业领域转型而来。</p>\n  <p><strong>97名玩家中，65家“具身原生”，占67%；32家“跨界转型”，占33%。</strong></p>\n  <p>再拆开来看，数采公司和数据infra公司的构成完全相反。</p>\n  <p><strong>70家数采公司里，57家“具身原生”，约占八成；27家数据infra公司里，19家“跨界转型”，约占七成。</strong></p>\n  <p>为什么infra吸引转型公司，采集行业却多是新玩家？</p>\n  <p>很多具身数据infra玩家是AI数据标注公司，例如海天瑞声、数据堂、云测数据等。他们积累的管线、质检和交付能力，很适合平移到具身数据infra环节。</p>\n  <p>而具身数据没有现成数据，采集环节则要从零构建资产，老玩家没有优势，新公司反而容易轻装上阵。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_c7294ce48d05400191af1f1c500badb4@5579416_oswg1193352oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <h2><strong>产能与布局</strong></h2>\n  <p><strong>现状5：全行业年产能160万至180万小时，短期目标扩大15到20倍</strong></p>\n  <p>现有具身数据产能是多少？离市场需求还有多少差距？</p>\n  <p><strong>量子位不完全统计，具身数据行业现有年产能为：160万至180万小时+7000万至8000万条。</strong></p>\n  <p>行业的短期目标为：未来1-3年内，产出2500万至3500万小时+亿条级数据。如果仅看小时数，短期目标是现有产能的15-20倍。</p>\n  <p>需要注意的是，<strong>由于各家机构披露口径不同，小时数和条数目前没有统一的换算标准，因此在这里并行列出。</strong></p>\n  <p>这些数字只统计了真机遥操数据和无本体采集数据，剔除了仿真合成数据。产能通过公司/平台已披露的数据保守估计而来，实际数字可能还会更多。</p>\n  <p>而机器人训练数据的总需求量，目前仍然未知。但可以参考大语言模型的锚点：LLM可以吃掉整个互联网现成的语料，机器人需要的数据却只能一条一条采。有统计称，截至今年初，全球高质量真实物理交互数据总量只有约50万小时，不足LLM训练数据量的两万分之一。</p>\n  <p>换个角度看，即便产能短期目标全部兑现，相比大语言模型的数据量，可能也只是刚够到起跑线。产能与需求之间仍然存在巨大差距。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_e8de603176b74a5d97f6f5bd9e4a26ca@5579416_oswg862058oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <p><strong>现状6：全国六成省份建有数采工厂，目前长三角分布最多</strong></p>\n  <p>这些数据都是在哪里采集的？</p>\n  <p>量子位不完全统计，全国的数采工厂已经铺到20个省份，其中国资背景的数采工厂覆盖16个省份。</p>\n  <p>数采工厂主要分布在长三角、京津冀和珠三角地区。其中，长三角以30座居首。</p>\n  <p>不少人力成本较低的三、四线城市也成为数采工厂的选址地，例如宿迁、自贡、郴州、运城、德清等。</p>\n  <p>分布模式和技术路线相关。遥操类数采工厂散布各省，轻资产的无本体路线公司则扎堆在一线城市。</p>\n  <p>不少城市正在打造数采重镇的城市名片。</p>\n  <p>例如，无锡是全国首个提出城市全域数据采集概念的城市。它做的最重要的事是：鼓励制造业、服务业企业开放产线、平台，将真实场景作为数据采集厂，采集机器人最稀缺、也最实用的数据。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_ca776295b66643c98af1291545a2a820@5579416_oswg696372oswg1080oswg982_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△</p>\n  <h2><strong>钱往哪流？</strong></h2>\n  <p><strong>现状7：15家独立具身数据服务商过去一年融资约44.7亿元</strong></p>\n  <p>再来看看最能说明问题的指标：钱。</p>\n  <p>由于机器人公司的数据业务无法从整体融资中剥离，我们圈出<strong>15家过去一年有融资记录的“独立具身数据服务商”</strong>，这些公司的融资情况在行业中很有代表性。</p>\n  <p>先解释一下，“独立具身数据服务商”的筛选标准有三条：不做通用机器人本体，不训练具身模型，具身数据为核心业务。</p>\n  <p>量子位不完全统计，过去一年间（2025年7月1日至2026年7月1日），这15家“独立具身数据服务商”共完成34起融资，合计约44.7亿元人民币。</p>\n  <p>融资的时间段高度集中。<strong>2026年4月至6月三个月内，融资事件数量占了四成多。</strong>这和今年上半年具身智能全行业的资本狂热息息相关。</p>\n  <p>量子位曾统计，2026年上半年，具身智能全行业共融资约438亿元。</p>\n  <p><strong>具身数据赛道一年融的钱，只是具身智能全行业半年融资的零头，说明起码在眼下，这个赛道还并不够“性感”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_af442b5785254817b3b2b12319cb2e76@5579416_oswg2125170oswg1080oswg1080_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <p><strong>现状8：独立具身数据服务商可划分为3个梯队，分化明显</strong></p>\n  <p>再往下深扒一层，具身数据行业内部发展并不平衡。</p>\n  <p>这15家“独立具身数据服务商”可以划分为三个梯队：</p>\n  <p>第一梯队光轮智能最突出。</p>\n  <p>这家公司过去一年完成6起融资，共融资31亿元，约占总融资额的七成。</p>\n  <p>它还是唯一一家披露估值的“独立具身数据服务商”。最新估值超20亿美元，约合人民币超135亿元，是全球首个具身数据独角兽。</p>\n  <p>第二梯队有11家公司，例如简智机器人��诺亦腾机器人、渊澈太初、觅蜂科技等。</p>\n  <p>第二梯队的公司，过去一年累计融资在数千万至数亿元间，融资阶段大多为Pre-A 轮及以前，只有几家成立时间较早的AI数据标注转型公司突破了A轮。</p>\n  <p>第三梯队的公司有3家：枢途科技、智域基石、补天石科技。</p>\n  <p>他们过去一年的累计融资在数千万元级别，融资轮次为天使轮，业务还处于早期验证阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_0c651b0b3a134e5e8dc41a23f4c7df7c@5579416_oswg677185oswg1080oswg864_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△</p>\n  <p><strong>现状9： 69家投资机构出手，没有一家重仓</strong></p>\n  <p>从资本的角度看，过去一年，共有69家投资机构投过这15家“独立具身数据服务商”。</p>\n  <p>出手最多的国方创投，投了3次；出手2次的有5家投资机构；剩下63家机构，都只投了1次。</p>\n  <p>对照具身模型融资热时头部机构抢占份额、连续加注的景象，<strong>眼下，具身数据赛道虽然方向有共识，但标的还没有共识，没有真正敢重仓的投资机构。</strong></p>\n  <p>资本的谨慎有理由：相较于想象空间极大的具身“大脑”，具身数据是“劳动力密集型”的生意，价格会越卷越低，客户需求量也有相对明确的预期，天花板就在那里。</p>\n  <p>但也有投资人告诉量子位，具身数据行业存在一定的延展想象空间：一方面，这是一个全球生意，国外的市场很大；另一方面，数据采集的能力还能迁移到模型评测等，成为物理AI的基础设施。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_7c09db8d848947a19fc05d3f657743d4@5579416_oswg414827oswg1080oswg592_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△</p>\n  <p><strong>现状10：半数以上“独立具身数据服务商”成立不到一年</strong></p>\n  <p>总的来看，<strong>独立的具身数据行业仍处于较早期的阶段。</strong></p>\n  <p>公司发展处于早期。半数以上近一年融到资的“独立具身数据服务商”成立时间不足一年。</p>\n  <p>融资处在早期。15家“独立具身数据服务商”中，13家公司的最新轮次在A轮及以前。</p>\n  <p>商业模式处在早期。没有一家公司披露过利润。仅弈人科技一家自称盈利，但也没公开利润的具体数字。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260712/v2_28c41f9d8c8744edb9f34118359e50d2@5579416_oswg1563666oswg1080oswg1080_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具身数采</p>\n  <p>最后，把以上十个现状总结成三句话：</p>\n  <p>第一句，具身数据行业已经成长为一条独立赛道，吸引大量玩家涌入，并且正在成为AI领域新增就业岗位的蓄水池、地方经济活力的新引擎。</p>\n  <p>第二句，这条赛道仍然处于早期阶段，许多问题还没解决，许多共识还没形成，许多变量还没收敛。</p>\n  <p>第三句，资本的态度最诚实。鲜有公司验证过：“纯卖数据”是一门赚钱的生意。VC还在撒网阶段，没人能看清哪条鱼最大。</p>\n  <p>接下来的一两年，大概率就是这门生意的验证窗口。产能会不会兑现，价格会卷到哪里，谁先把利润表拿出来，决定了具身数据商能否真正成为赚钱的“卖铲人”。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/rIkON8mkMBGpufN2Tikt7Q\" rel=\"noopener noreferrer\" target=\"_blank\">“量子位”</a>，作者：关注前沿科技，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-12T02:16:07+00:00", "fetched_at": "2026-07-12T02:21:37.454083+00:00", "fingerprint": "3c22840d69a57371"}, {"source": "少数派", "title": "暴雨和洪涝的季节，这些技巧助你从容自保", "url": "https://sspai.com/post/68024", "summary": "面对暴雨、内涝等自然灾害，你应该做什么准备？有人溺水时，该如何正确救援？这篇文章帮你掌握一些必要的知识，面对危情不再慌乱。<a href=\"https://sspai.com/post/68024\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-11T07:05:21+00:00", "fetched_at": "2026-07-12T02:21:35.702511+00:00", "fingerprint": "f018dcd0e2676d65"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
