nced that two of [&#8230;]", "category": "tech", "published_at": "2026-10-09T21:50:00+00:00", "fetched_at": "2026-10-10T04:02:36.983280+00:00", "fingerprint": "8d0d5e3b472fdee1"}, {"source": "36氪 - 最新文章", "title": "别等项目成功了，才开始讲它的故事！", "url": "https://36kr.com/p/4018406199021449?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_4e6d6d7519d346149d1a6ff054467b00@5284654_oswg1999231oswg1828oswg860_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪项目推荐</p>\n  <p>在创业圈，有很多这样的项目：一支团队花了几年时间打磨技术，终于让产品走进真实应用场景；一家初创公司深耕细分领域，解决了一个长期存在的行业问题；还有一些创业者，正在把一个新想法变成真正的产品。</p>\n  <p>它们可能还没有很高的知名度，也未必拿到了亮眼的融资成绩，但正在发生的变化，本身就值得被关注。</p>\n  <p>现实中，创业团队往往把大部分精力放在产品、客户和业务增长上，对外传播则被放在了后面。等到需要融资、拓展市场或寻找合作伙伴时，才开始整理项目资料，思考该如何向外界介绍自己。</p>\n  <p>但一个项目的价值，不只体现在融资、营收和规模上。</p>\n  <p>一次技术突破、一个新产品的落地、一家标杆客户的合作，都是企业成长的重要节点。它们不仅记录着项目的发展，也能帮助外界理解团队正在解决什么问题，以及项目未来可能走向哪里。</p>\n  <p>&nbsp;</p>\n  <h2><strong>好项目不必等到足够出名，才开始讲述自己的故事。</strong></h2>\n  <p>对于创业团队来说，持续梳理和表达项目进展，不只是宣传，也是建立外部认知的一种方式。把产品讲清楚，把创新点说明白，把真实进展记录下来，才能让更多人有机会理解项目的价值。</p>\n  <p><strong>36氪「项目推荐」希望为创业项目提供这样的机会。</strong></p>\n  <p>无论是硬科技、企业服务、消费、医疗健康，还是先进制造领域的项目，都可以通过「项目推荐」提交介绍，申请免费的报道与曝光机会。无论项目处于早期探索阶段，还是已经有产品落地、取得新的业务进展，都可以从讲清楚自己正在做的事情开始。</p>\n  <p>一次报道并不意味着项目一定会获得合作或业务机会，但它可以为企业增加一个公开展示的渠道，让项目有机会进入更广泛的视野。</p>\n  <p>如果你正在做一个创业项目，或者近期有新的产品发布、技术突破、业务落地等进展，不妨把这些故事整理出来，向36氪「项目推荐」提交项目介绍。</p>\n  <p>创业的价值，不只在于最终走到了哪里，也在于一路上创造了什么。</p>\n  <p>&nbsp;</p>\n  <p>📌&nbsp;<strong>免费提交项目：</strong><br /><a href=\"https://36kr.com/seek-report-new\" rel=\"noopener noreferrer\" target=\"_blank\">https://36kr.com/seek-report-new</a></p>\n  <p>📮&nbsp;<strong>项目推荐联系邮箱：</strong><br /><a href=\"mailto:aireport@36kr.com\">aireport@36kr.com</a></p>\n  <p><strong>客服可以扫描下方二维码联系～</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_61e9fced05214f5881a6e6e2ad218743@5284654_oswg50025oswg216oswg210_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加！</p>\n  <p>&nbsp;</p>\n  <p><strong>36氪「项目推荐」</strong></p>\n  <p><strong>让好项目，更早被看见。</strong></p>", "category": "tech", "published_at": "2026-10-09T08:55:54+00:00", "fetched_at": "2026-10-10T04:02:36.858550+00:00", "fingerprint": "a279a2b316b5f9af"}, {"source": "36氪 - 最新文章", "title": "尊界踏板断裂背后：百万豪车，每一个零件都得较真", "url": "https://36kr.com/p/4018053011951493?f=rss", "summary": "<p>制动踏板断裂，这个看似离谱的故障，出现在了一辆百万级豪车上。</p>\n  <p>10月8日，懂车帝发布测试视频显示，在时速100至0的连续刹停试验中，尊界V800连续三辆车制动踏板都被踩断。视频显示，三辆车踏板断裂位置一致，均为包裹踏板转轴的塑料加强件。懂车帝视频显示，断裂当下，驾驶员对踏板施加的力已超1600N。</p>\n  <p>视频一经发布，便引发全行业热议，江淮汽车股价连续两日跌停，同时引发监管部门的密切关注。</p>\n  <p><strong>36氪独家获悉，今日，中汽中心紧急向各大车企发出关于制动踏板总成材质的调研问卷，着重关注非金属材质在踏板总成的应用。该动作，通常被行业视为法规修订的准备工作。</strong></p>\n  <p>针对这一测试，尊界汽车已发布回应，称制动系统按照高于国家标准的要求完成开发与验证，且用户在实际使用场景中，未曾发生踏板支架底座断裂故障。但尊界希望为用户提供更高的安全冗余，将进一步优化该部件的设计。</p>\n  <p>目前强制性国标仅要求，车辆最大制动效能时，踏板力需≤500N。而另有一推荐性标准指出，汽车制动踏板在施加1500±20N后，保持5秒，重复5次，踏板永久变形幅度应≤5mm，并且无裂纹。</p>\n  <p><strong>也就是说，汽车制动踏板能承受多大踩踏力而不断裂，事实上完全取决于车企的内部自定标准。</strong></p>\n  <p>有产业人士告诉36氪，即便是百万元级豪车，国内供应商对制动踏板总成的报价也不超过百元。由于单价低、技术创新少，踏板部分的研发并不受重视，车企几乎没有设置专门的工程师岗位负责。</p>\n  <p>而36氪同步了解到，即便已在中国深耕本土化多年，部分传统豪华品牌仍将制动踏板总成的生产牢牢攥在手中，由欧洲自有工厂制造，进口至国内组装，分毫不敢假手于人。</p>\n  <p>这则新闻全民热议的背后，实质是万千消费者对百万级豪车安全性的期待。</p>\n  <p>自1972年奔驰与博世联合开发ABS防抱死系统，并将其搭载在S级轿车上时，安全便开始成为豪华车的第一属性。时至今日，豪华车依然比普通车拥有更全面、更精细的安全配置。</p>\n  <p>在鸿蒙智行的家族中，尊界车型的安全气囊、车身超强钢、激光雷达等传感器数量都较其他车型更多；碰撞前座椅主动防护、追尾预判等安全功能，同样也选择在价位最高的尊界品牌首发搭载。</p>\n  <p>百万级豪华车，应该拥有行业最高的安全标准，已经成为行业共识。</p>\n  <h3><strong>百万级豪车应有的安全：标准高、研发强、投入足</strong></h3>\n  <p>一辆百万级的汽车，制动踏板的成本往往只有100元。当智驾、悬架、芯片、电池等成为车企比拼的重点时，制动踏板的重要性自然容易被忽略。</p>\n  <p>实际上，百年传统豪华品牌在此已经有成熟经验，而且往往都已建立一套比中标、欧标、美标等国家标准更严苛的企业内部安全标准，可供行业参考或者借鉴。</p>\n  <p>36氪从行业中梳理获悉，他们对踏板最大承载力的要求普遍接近4000N，相当于5-6个成年人站在踏板上，仍不能断裂；</p>\n  <p>并且需要做-35℃至80℃的环境温度测试，无论极热还是极寒，踏板在2000N踩踏下，都仅能有不影响性能的轻微变形；而目前，中国汽车法规体系中，仅有一项推荐性标准中包含8℃至38℃环境温度测试。</p>\n  <p>同时，这些豪华品牌的测试工况也不局限于法规要求的正面踩踏，还包括了用户使用场景中常见的左右侧面踩踏，尽可能模拟用户在紧急状况下可能的踩踏角度。</p>\n  <p>当然，标准只是门槛，传统豪华品牌真正的护城河，是它们有能力让这些高标准从纸面落到车辆上。</p>\n  <p>有知情人士告诉36氪，<strong>目前，这些豪华品牌在制动踏板上，依然采用全进口零件，“40万以上的高端车，用的制动踏板几乎都是车企自己设计、自己建厂制造的。欧洲工厂生产好了，海运发到国内来组装的”。</strong></p>\n  <p>这些传统豪华品牌如今逐渐把新车开发权交给中国研发团队，甚至也在推动百万元级豪车的国产化，“但制动踏板的设计，依然需要总部拍板”，该人士表示，这些品牌并不信任中国供应商的开发能力。</p>\n  <p>36氪了解到，出于轻量化需求，制动踏板总成中大部分材料都已更换为工业塑料，踏板和踏板臂还保留金属材质设计。保时捷等跑车品牌，甚至已将部分车型的踏板臂更换为工业塑料类材质。</p>\n  <p>“工业塑料便宜又轻巧，但压力就给到研发团队了”，一位负责踏板总成设计的工程师人士告诉36氪，踏板总成设计的难点在于，不同车型踏板和踏板臂的形状角度各不同，研发需要精准分析受力结构，在受力板块合理布置加强筋，以满足车企提出的各项要求。</p>\n  <p>他向36氪指出，目前国内制动踏板供应商的仿真能力还有待进步，研发团队更像是在试探性答题，“仿真系统和台架测试的结果差异比较大。研发团队只能去试，这里加一根加强筋能不能过，但实际上，就算过了，也只是在你测试的工况下通过了，用户不会完全按照你测试的工况去踩刹车。不搞懂底层原理，你很难保证自己的踏板有足够高的安全性”。</p>\n  <p>上述知情人士告诉36氪，传统豪华品牌在供应商选型时，非常看重供应商对技术Know-How的理解，“他们不允许自己品牌百万元级车上，出现一个不知道为什么要这么设计的零件，所以最后这些车企还是选择自己来做”。</p>\n  <p>在制动系统中，踏板总成无论单价还是技术门槛都排在末尾。这导致车企和供应商都吝于在这个几十块的零件上倾注心血。然而，机械结构的安全没有捷径，它恰恰需要最笨拙的反复试验来达成。</p>\n  <p><strong>“这也是传统豪华品牌，跟现在新势力豪华的区别。一切安全要求，都需要开发费的支撑”</strong>，有供应链人士告诉36氪，百万级豪车的产量极少，一年1万辆已经非常可观，“踏板的单价不高，现在行业都控制成本，即便是百万豪车，国内供应商的踏板总成报价也不会超过100元”。</p>\n  <p>这也就意味着，一个百万级豪车制动踏板的项目标的，可能不超过100万元。</p>\n  <p>但制动踏板总成的开发成本至少在数百万元级，“百万级豪车的量太少了，靠规模很难摊薄研发成本”，该人士向36氪表示，主机厂通常应该向供应商支付开发费，“你给欧洲豪华品牌做项目，就算设计方案没通过，最终没入选，他们也会付开发费。但很多国内主机厂，就算车是百万级的，就算定点量产了，可能也就只付20%的开发费”。</p>\n  <p>安全本就是奢侈品。当规模小、利润薄、开发费寥寥无几时，安全还能得到保障吗？百万级豪车的安全，远不只是纸面标准，更是企业研发实力、开发周期与项目成本博弈后的最终答卷。</p>\n  <p>中国汽车品牌如今正集体冲击高端，陆续推出百万级豪车，部分车型月销量甚至反超传统豪华品牌，成为细分赛道领跑者。这些国产豪车在发布会上，同样大谈安全：隐藏式门把手的三重电源冗余、激光雷达数量、气囊配置，无一不令人眼花缭乱。</p>\n  <p>但传统豪华品牌之所以能数十年屹立不倒，靠的从来不只是整车系统级的安全设计，更在于其对制动踏板、车内每一根细小线束这些不起眼的零件，都设定了严苛标准，并为之倾注了真金白银的实质性投入。</p>\n  <h3><strong>踏板断裂，无法预防吗？</strong></h3>\n  <p>标准之外，公众更关心一个直白的问题：踏板断裂这类设计或质量缺陷，难道在量产之前就无迹可寻、无法拦截吗？</p>\n  <p>“几乎���有车企会设置研发和质量岗位专门负责制动踏板”，有研发工程师告诉36氪，车企的制动工程师通常同时负责卡钳、制动盘/制动片以及制动踏板总成的开发工作。</p>\n  <p>所以主流做法为主机厂制定研发指标，制动踏板供应商进行结构设计。主机厂的研发指标，不仅包含法规要求的踏板最大承载力，还有成本、轻量化等要求。</p>\n  <p>36氪了解到，汽车零部件级的设计验证，通常由供应商进行。在制动踏板的最大承载力上，供应商完成结构设计后，会首先在公司自己开发的仿真系统中验证结构的可行性，如是否可以承载2000N甚至更大力的踩踏。设计方案在仿真系统中跑通、获车企首肯后，便将进行实体零件试制，进行台架测试。</p>\n  <p>该工程师向36氪坦言，在最大承载力这项测试中，行业主流做法是，供应商出具测试合格的报告便验收，“部分车企会在首次引入新供应商时做复核测试，但现在成本和开发周期压得很紧，几乎已经没车企主动做复测了，供应商的报告说可以，那就可以了”。</p>\n  <p>而车企制动研发工程师后续的工作重点，则聚焦在调节踏板行程、如何小于500N便能释放最大制动力、以及踏板感的调校上，不会再单独进行踏板暴力踩踏试验。</p>\n  <p>有法规认证工程师告诉36氪，新车上市前，零部件和整车还要在国家认证的第三方机构进行相关测试，“踏板最大承载力属于零部件级别认证，行业里绝大部分做法，都是供应商自行送检，然后向车企提供合格报告。车企基本只核查报告，不会核查具体试验过程”。</p>\n  <p>主机厂对整车负责，零部件供应商对零部件负责，该人士坦言，“如果研发工程师的经验不够，看不出猫腻，那基本就是各方凭良心办事了”。</p>\n  <p>踏板断裂的原因，也可能是质量缺陷。</p>\n  <p>事实上，汽车零部件众多，供应链存在分级制度，各级供应商都会对零部件质量进行一次质量把控。“比如踏板后面的制动系统，供应商的产线其实都有防呆设计，如果制动片供应偷偷削薄2mm，那么卡钳供应商就会发现制动片无法安装在指定位置；再往上还有Tier 1企业对整体性能再做一次把控”，有产业人士告诉36氪，一个零部件出事，整个链条都会被追责。</p>\n  <p>但制动踏板总成有其特殊性，零部件产品从供应商工厂下线后，便直接发往车企的整车工厂进行拼装。这意味着，刹车踏板总成这一零部件，在质量风险上，并没有缓冲带。</p>\n  <p>百万豪车的高溢价，诱人却烫手。消费者为豪车的高溢价买单，本质上是在为那些法规未覆盖、却需企业额外投入的安全冗余付费。车企想稳稳接住这份利润，就必须舍得下本钱，为安全留出足够的冗余、缓冲与制度保障。</p>\n  <p>尊界踏板断裂是一记警钟，但好在，在智能电动汽车发展的新十年，行业焦点已经回归安全这一本质。</p>", "category": "tech", "published_at": "2026-10-10T00:00:16+00:00", "fetched_at": "2026-10-10T04:02:36.858544+00:00", "fingerprint": "99f43e51974808fd"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨特朗普买入Meta股票；山姆宣布拟限制亲友卡绑定；豆包开通水、电、燃气等生活缴费功能", "url": "https://36kr.com/p/4019297973735560?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Anthropic据悉组建专门团队对接2028年总统候选人</li>\n   <li>中国手机迎来新一轮涨价潮，部分机型涨幅达1000元</li>\n   <li>B站申请JILIJILI等商标</li>\n   <li>广东汕头在全国率先推出“词元出海贷”</li>\n   <li>英国大学生申领贷款将需达到最低标准</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>特朗普买入Meta股票，最高达2500万美元</strong></p>\n  <p>最新财务披露文件显示，特朗普8月21日买入最高达2500万美元Meta股票，此后Meta股价累计涨32%。据CNBC分析，特朗普8月共517笔证券交易，总额约7430万至2.733亿美元，买入至少4420万美元，卖出至少3010万美元。文件还显示，他8月18日买入SpaceX优先无担保债券，金额100万至500万美元，票面利率5.35%，2031年7月到期，时值签署扩大美国商业航天运输政策前两天。(券商中国)</p>\n  <p><strong>山姆宣布拟限制亲友卡绑定，工作人员回应</strong></p>\n  <p>10月9日，山姆会员商店宣布拟更新《山姆会员商店会员章程》，现公开征求意见。《山姆会员商店会员章程》拟新增：自首次激活亲友卡之日起每365天，该亲友卡关联的实名身份信息仅能用于激活两名个人主卡会员的亲友卡，且每次仅能激活一名个人主卡会员的亲友卡。征求意见期满如无更改，则于2026年10月16日生效。</p>\n  <p>对此，山姆工作人员解释称，上述变更对主卡会员并无影响，主要影响的是持有亲友卡用户。对于上述举措是否为了打击倒卖副卡的行为，客服称可以这么说，“二手交易平台上（购卡）可能后续会影响会员权益，我们确实会做章程的更新。”（财联社、蓝鲸新闻）</p>\n  <p><strong>豆包开通水、电、燃气等生活缴费功能</strong></p>\n  <p>近期记者发现豆包App内可通过语音或打字完成水、电、燃气等生活缴费操作。接近豆包人士表示，豆包正在逐步建设包括出行服务、生活缴费等生活场景下的办事能力。记者实测发现，登录抖音账号、完成户号绑定后即可使用该功能，但当前不同城市的缴费功能开通情况有所不同，缴费服务尚未完全接通。国庆节前，豆包刚宣布新增机票预订、火车票购买、打车出行和路线导航等多项服务，并上线“出行用豆包”专属入口，涵盖地图导航、交通出行、酒店住宿、吃喝玩乐四大场景。(每日经济新闻)</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic宣布禁止“虐待”其旗下AI</strong></p>\n  <p>据报道，Anthropic对其AI使用政策作出调整，以应对新的高风险滥用行为。其中一项最重要的变化是，禁止对Claude进行“持续且不必要的虐待或残忍行为”。此次更新指出，终止对话仍是“主要执行机制”；对于是否会采取进一步的执行措施（例如可能封禁用户），Anthropic未予置评。Anthropic表示，新政策更新“仅适用于极端情况，即用户在毫无明显目的的情况下反复对我们的模型实施残酷行为。该政策不适用于用户常见的不满、反驳、黑暗创意主题，以及模型测试和研究等情况。”（新浪财经）</p>\n  <p><strong>Anthropic据悉组建专门团队对接2028年总统候选人</strong></p>\n  <p>据报道，美国人工智能初创公司Anthropic 正着手设立一个针对2028年大选的“总统级对接”计划，组建一支内部团队，直接就人工智能相关议题与美国两党总统候选人展开对接，协助公司高层制定政治策略，并负责运营公司的政治资助项目。（新浪财经）</p>\n  <p><strong>三名遭解雇安全研究员发布联名公开信，OpenAI回应</strong></p>\n  <p>OpenAI 8日发文称，公司已在完成内部调查后，与Jasmine、Mikita和Tomek三名安全研究人员结束合作，原因是其违反了处理敏感信息的相关政策。OpenAI称，调查发现的问题超出三人在公开信中披露的内容，因此坚持终止雇佣关系的决定。此举并非针对三人提出的AI安全担忧或表达不同意见，内部安全讨论和研究争论一直是日常工作的一部分，公司对此持积极鼓励态度。同时，OpenAI表示，正在推进敲定与第三方安全评估机构的合作协议，并将在未来几周公布细节。（第一财经）</p>\n  <p><strong>Meta深陷信任危机，而AI产品逆势爆火</strong></p>\n  <p>Meta因产品易致青少年沉迷、危害心理健康，遭美国多州诉讼，累计巨额罚款赔偿，超八成美国民众呼吁加强监管。但Meta业绩攀升，用户量、营收同比上涨。其AI智能体Muse可自主完成复杂长周期任务，上线仅一个月下载量超500万，周活跃用户破300万，增速超越北美同期ChatGPT。不过，Muse需调取大量隐私数据，用户顾虑重重，Meta称将上线隐私虚拟机保障安全。业内表示，能否重塑公众信任，或是其AI转型成败关键。(环球网资讯）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>江淮汽车两日市值蒸发百亿，9日开盘一字跌停</strong></p>\n  <p>10月9日开盘，江淮汽车一字跌停，截至收盘，报22.75元/股，总市值为512.82亿元。对比9月30日收盘619.22亿元的总市值，短短两个交易日，公司市值合计缩水超百亿元。资本市场的剧烈波动，源自一则汽车极限测评视频引爆的质量舆情风波。10月8日，懂车帝实测显示，三台全新尊界V800在连续紧急制动中，刹车踏板支架全部断裂。（新京报）</p>\n  <p><strong>iPhone 18 Pro系列被曝削减零部件产量，供应链人士回应：订单总量未发生实质性变化</strong></p>\n  <p>10月9日，有媒体报道称，由于内存芯片成本飙升，苹果被迫提高新款iPhone售价，进而导致消费者需求下降。目前，苹果已告知部分供应商削减新推出的iPhone 18 Pro和iPhone 18 Pro Max的零部件产量。不过，对于上述减产传闻，从供应链人士处了解到，目前相关订单总量并未发生实质性变化。“结合苹果官网销售情况来看，目前iPhone 18 Pro Max多数规格型号的预计到货时间仍在3至4周。”（每日经济新闻）</p>\n  <p><strong>中国手机迎来新一轮涨价潮，部分机型涨幅达1000元</strong></p>\n  <p>2026年10月9日零时起，华为调整nova16系列建议零售价，nova16、nova16 Pro均上调400元，nova16 SE上调200元，渠道提货价同步上调。同日，小米17 Ultra全系售价上调，涨幅达1000元：标准版起售价由6999元升至7999元，定位更高的徕卡版起售价由7999元升至8999元，小米官网在售版本定价已全部完成调整。今年3月起，OPPO、vivo已先后对在售机型调价；9月1日小米、荣耀等品牌也曾跟进一轮集中调价，其中小米17系列涨幅为200元至500元，荣耀Magic8涨幅在300元至500元区间。(界面新闻)</p>\n  <p><strong>创业板指70个交易日跌超31%，中信：科技行情或四季度启动</strong></p>\n  <p>10月9日创业板指一度跌破3000点，2026年6月25日至今的70个交易日跌超31%，为2025年11月27日以来新低。中信证券研报表示，下一轮科技行情启动窗口大概率在2026年四季度，还需要加息预期边际逆转、新叙事凝聚共识、资金面完成再平衡三方面条件验证。建议坚持结构重于仓位，关注港股模型迭代、互联网平台、硬件技术升级、国产半导体设备等结构性机会。（新浪财经）</p>\n  <p><strong>美股收盘：道指涨逾400点，三大指数周线齐涨</strong></p>\n  <p>美东时间周五，在科技板块的带动下，美股三大指数集体收涨，周线均录得上涨。截至收盘，道琼斯工业平均指数上涨423.31点，涨幅0.83%，报51654.95点；标普500指数上涨46.15点，涨幅0.59%，报7811.51点；纳斯达克综合指数上涨172.83点，涨幅0.64%，报27366.17点。大型科技股涨跌不一，亚马逊涨3.29%，微软涨2.38%，特斯拉涨2.05%，谷歌涨0.87%，Meta跌0.31%，英伟达跌0.52%，苹果股价下跌1.1%。（财联社）</p>\n  <p><strong>百度、银河通用机器人等入股简智机器人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，简智机器人关联公司简智新创（北京）机器人科技有限公司发生工商变更，新增北京百度网讯科技有限公司、银河通用机器人旗下苏州盖博特科技有限公司等为股东，同时，注册资本由约19.3万元人民币增至约1052.4万元人民币。</p>\n  <p>该公司成立于2025年5月，法定代表人为陈建兴，经营范围包括服务消费机器人制造、服务消费机器人销售、软件开发等，现由陈建兴、北京简智新创一号智能科技合伙企业（有限合伙）及上述新增股东等共同持股。</p>\n  <p><strong>财政部安排使用5500亿元地方政府债务结存限额</strong></p>\n  <p>9日，记者从财政部了解到，财政部近日安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩大有效投资。下达地方的5500亿元地方政府债务结存限额中，一般债务结存限额3000亿元，全部分配县区使用，专门用于提高县区一般公共预算保障能力，支持地方更好发展；专项债务结存限额2500亿元，分配给今年第四季度有实际项目资金需求的地区，向经济大省倾斜，支持有关地区优先保障在建项目资金需求，新建项目聚焦“六张网”建设等重点领域，有效发挥政府投资带动作用。财政部将指导督促各地更好衔接项目储备和债券发行，加快发行节奏，畅通拨付链条，尽快形成实物工作量，促进政策早落地、早见效。（央视新闻）</p>\n  <p><strong>奈飞据悉正进行组织重组，预计将影响约5%的员工</strong></p>\n  <p>奈飞据悉正进行组织重组，预计将影响约5%的员工，相关公告最早可能于下周发布。（财联社）</p>\n  <p><strong>中欧贸易投资磋商机制第二次例会联合声明</strong></p>\n  <p>36氪获悉，据商务部消息，2026年10月8-9日，中国商务部部长王文涛与欧盟委员会贸易和经济安全委员马罗什·谢夫乔维奇在北京举行中欧贸易投资磋商机制（以下简称机制）第二次例会。双方进行了务实、富有成效的讨论，并形成成果共识清单。双方重申，作为关键贸易伙伴，在世贸组织规则框架下，妥善处理双方分歧，致力于继续稳定双边经贸关系，并使其更加平衡。双方商定，将于2027年3月召开机制第三次例会，在此之前双方将保持密切沟通，包括1月举行部长级视频会议。</p>\n  <p><strong>B站申请JILIJILI等商标</strong></p>\n  <p>36氪获悉，天眼查知识产权信息显示，近日，B站运营主体上海幻电信息科技有限公司申请注册多枚“JILIJILI”“ILIILI”商标，国际分类涉及科学仪器、通讯服务、网站服务、社会服务等，当前商标状态为商标申请中或等待实质审查。值得一提的是，上海幻电此前还曾申请注册多枚名称与“bilibili”相近的商标，包括“CILICILI”“DILIDILI”“EILIEILI”“GILIGILI”“HILIHILI”“KILIKILI”“OILICILI”等，国际分类涉及教育娱乐、通讯服务、科学仪器、网站服务等。其中，“GILIGILI”“KILIKILI”等部分商标状态显示为已注册。</p>\n  <p><strong>央行：未来的人民币汇率，不会刻意升值，也不会刻意贬值</strong></p>\n  <p>中国人民银行8日发布关于人民币汇率的政策立场文件，首次全面、系统阐述人民币汇率的政策立场。人民币汇率一向关注度极高，央行这次在立场里也再次重申：中国坚持让市场在汇率形成中发挥决定性作用。中国实行的是市场化汇率制度，2017年之后就彻底退出了常态化干预。未来的人民币汇率，不会刻意升值，也不会刻意贬值。我们仍然将尊重市场、守住底线、不搞博弈、不玩套路，这就是未来几年人民币汇率最核心、最确定的大趋势。（央视新闻）</p>\n  <p><strong>北方稀土：第四季度稀土精矿交易价格调整为不含税38769元/吨</strong></p>\n  <p>36氪获悉，北方稀土公告，公司2026年第四季度稀土精矿交易价格调整为不含税38769元/吨（干量，REO=50%），REO每增减1%、不含税价格增减775.38元/吨。</p>\n  <p><strong>广东汕头在全国率先推出“词元出海贷”</strong></p>\n  <p>针对词元出海企业普遍存在的轻资产抵押不足、跨境运营资金周转压力大的痛点，在中国人民银行广东省分行的指导下，中国人民银行汕头市分行联合汕头市财政局、汕头华侨试验区，推动中国银行汕头分行创新推出全国首个面向词元出海场景的专项金融服务方案——“词元出海贷”，并落地首笔100万元专项授信。（界面新闻）</p>\n  <p><strong>权益类基金成立门槛拟降至5000万元</strong></p>\n  <p>36氪获悉，中国证监会就《公开募集证券投资基金运作管理办法（征求意见稿）》及配套规则公开征求意见。征求意见稿支持权益类基金发展，拟将权益类基金、基金中基金（FOF）等产品的成立门槛，从规模2亿元、份额2亿份，分别降至5000万元、5000万份，固收类基金成立门槛维持不变。</p>\n  <p><strong>苹果任命新任并购负责人</strong></p>\n  <p>苹果新一任并购主管，由史蒂夫·史密斯接替阿德里安·佩里卡；佩里卡将继续负责iCloud、Fitness+以及新闻业务。史密斯将向首席财务官基万·帕雷克汇报，并购团队重回财务部门管理，这是2019年以来首次。同时，卡森·奥利弗晋升为App Store副总裁。本次人事变动是苹果服务部门一系列领导层调整的一部分。埃迪·库将接管App Store及其他团队；佩里卡与奥利弗·舒瑟被视作库的潜在继任人选。（新浪财经）</p>\n  <p><strong>东日本铁路公司609万条个人信息可能外泄</strong></p>\n  <p>东日本铁路公司（JR东日本）10月9日发布消息称，集团旗下信用卡“Viewcard”等服务累计约609万条包含电子邮箱等内容的个人信息可能外泄，原因是软银子公司IDC Frontier（东京）面向企业提供的云服务遭到非法访问。JR东日本表示，姓名、住址及银行卡号并未泄露。（界面新闻）</p>\n  <p><strong>英国大学生申领贷款将需达到最低标准</strong></p>\n  <p>据知情人士消息，英国政府正在酝酿新方案，要求大学生达到最低入学标准，方可申领政府助学贷款。部长们将在数周内公布限制助学贷款申领资格的相关计划。政策重点将放在英语能力上，官员考虑将普通中等教育证书（GCSE）英语科目合格设为贷款申领门槛。英国亦可能就更低标准开展咨询，允许采用其他英语资质证明。英国教育部证实，将会研究设置助学贷款最低英语要求的 “多种备选方案”。（新浪财经）</p>\n  <p><strong>央行9月公开市场国债买卖净投放1000亿元</strong></p>\n  <p>36氪获悉，中国人民银行公布2026年9月中央银行各项工具流动性投放情况。中央银行贷款方面，常备借贷便利（SLF）净投放2亿元；中期借贷便利（MLF）净投放2000亿元，抵押补充贷款（PSL）净回笼14亿元；公开市场业务方面，隔夜、7天期逆回购净回笼860亿元，公开市场国债买卖净投放1000亿元。</p>\n  <p><strong>美股光通信龙头Lumentum称2029年初的产能已售罄</strong></p>\n  <p>美国光通信龙头Lumentum首席执行官Hurlston当地时间周五表示，该公司直至2029年初的光器件产能已全部售罄。Hurlston表示，部分产品到明年仍有约70%的需求无法满足，另有部分产品到2028年仍有30%的需求无法满足。（财联社）</p>\n  <p><strong>比亚迪：当前闪充车型订单需求旺盛，公司首要目标是加快二代刀片电池产能爬坡</strong></p>\n  <p>36氪获悉，比亚迪在互动平台表示，公司产品定价会综合市场竞争、用户需求、长期品牌战略、产能释放节奏等多维度因素统筹考量。当前闪充车型订单需求旺盛，公司首要目标是加快二代刀片电池产能爬坡，全力提升交付能力，保障消费者购车体验。产品相关价格信息请以官方发布为准。</p>\n  <p><strong>科技巨头承诺投入24亿美元支持特朗普政府AI科研计划</strong></p>\n  <p>当地时间10月8日，特朗普政府周四在华盛顿举行的一场峰会上宣布，硅谷巨头承诺投入24亿美元来加强科学研究，这是华府推动和利用人工智能技术的最新举措。白宫表示，这些捐赠将为政府的“创世纪计划”提供AI工具和算力额度，该计划旨在利用AI推动科研，并为超过15个联邦机构提供支持。已宣布的投入包括英伟达10亿美元、AMD 5亿美元、OpenAI 2亿美元，以及Anthropic和Alphabet旗下谷歌各1.5亿美元。此外，特朗普政府还计划投入逾1亿美元，用于面向美国STEM领域研究人员的教育项目。(上海证券报)</p>\n  <h2>上市进行时</h2>\n  <p><strong>上交所终止企查查主板发行上市审核</strong></p>\n  <p>36氪获悉，据上交所，因企查查科技股份有限公司及其保荐人中信证券股份有限公司撤回发行上市申请，根据《上海证券交易所股票发行上市审核规则》第六十三条有关规定，上交所终止其发行上市审核。</p>\n  <h2>大公司财报</h2>\n  <p><strong>中国巨石：前三季度净利润同比预增100%至110%</strong></p>\n  <p>36氪获悉，中国巨石公告，预计2026年前三季度实现归属于上市公司股东的净利润为51.36亿元至53.93亿元，同比增加100%至110%。2026年前三季度，玻纤主要下游应用领域需求增加，产品量价齐升。公司通过加快产品结构优化、加大技术创新力度、加强市场开拓等措施提升盈利能力。</p>\n  <p><strong>环旭电子：9月合并营业收入为74.87亿元，同比增加25.64%</strong></p>\n  <p>36氪获悉，环旭电子公告，公司2026年9月合并营业收入为74.87亿元，较去年同期的合并营业收入增加25.64%，较2026年8月合并营业收入环比增加15.03%。公司2026年1月至9月合并营业收入为468.80亿元，较去年同期的合并营业收入增加7.42%。</p>\n  <p><strong>景旺电子：第三季度净利润同比预增205.46%到264.74%</strong></p>\n  <p>36氪获悉，景旺电子公告，预计2026年第三季度实现归属于母公司所有者的净利润9.12亿元到10.89亿元，同比增加205.46%到264.74%，环比增加147.20%到195.18%。</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果即将推出触屏Mac</strong></p>\n  <p>苹果公司计划在10月27日周二前后举办产品发布会，正式推出旗下首款触屏版MacBook以及全新一代iPad mini。本次发布会还将同步亮相搭载M6芯片的14英寸MacBook Pro与iMac新品，目标用户群体是视频制作、照片编辑、音乐创作领域的创意专业人士。新款MacBook Pro机身将比现款更轻薄，配备OLED屏幕；全新iPad mini则搭载OLED显示屏，升级了视频会议摄像头与重新设计的扬声器系统。（科创板日报）</p>\n  <p class=\"editor-note\"><strong>整理丨</strong>宋清瑜</p>", "category": "tech", "published_at": "2026-10-10T00:04:26+00:00", "fetched_at": "2026-10-10T04:02:36.858538+00:00", "fingerprint": "b6330f9aeffd7bcc"}, {"source": "36氪 - 最新文章", "title": "用AI降低激光焊使用门槛，这家公司完成数千万元融资｜36氪首发", "url": "https://36kr.com/p/4019439680327817?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能激光金属加工设备公司LaserCyber已完成数千万元融资，由启高资本投资、为溪创投跟投，苍竹资本担任长期独家财务顾问。</p>\n  <p>LaserCyber于2025年8月成立于深圳，定位为“桌面智能激光工厂”。公司首款激光焊机产品L1系列覆盖600W、900W和1200W三个功率段，可完成手持焊接、切割和激光清洗，并可与专用的C1平台连接，完成更精细的平面切割。产品主要面向海外小型加工厂、车库工作室和金属创作者。目前，LaserCyber首款产品已登陆Kickstarter众筹，获得超百万美金支持。</p>\n  <p>焊接是一个成熟而庞大的工业市场，激光焊是其中快速起量的细分领域。Grand View Research的数据显示，全球弧焊设备仍是百亿美元规模，激光焊机则在十亿美元量级。传统电弧焊发展时间长、设备价格低、适用范围广，目前仍占据主流；激光焊体量较小，但正从工业自动化设备向手持式和桌面化产品延伸。</p>\n  <p>与传统电弧焊相比，激光焊用高能量密度光束集中加热金属，焊接速度更快、热影响区更小，材料变形和后续打磨也更少；尤其在4毫米以下的中薄板加工中优势明显。其应用已覆盖汽车零部件、电子器件、医疗设备，以及厨具、门窗、金属家具和汽车钣金等场景。</p>\n  <p>中国厂商已在B端、C端布局激光焊接市场。大族激光、华工激光等工业激光设备企业已推出手持激光焊产品；近两年，xTool、XLASERLAB等则把焊接、切割和清洗整合进更轻量的设备，面向小型工坊和海外Maker。</p>\n  <p>刘宸伯是LaserCyber的创始人兼CEO，此前曾负责XLASERLAB的海外品牌的搭建与众筹，并取得百万美金的众筹成绩。在他看来，消费级激光焊机的核心用户并非泛家庭人群，而是有明确加工需求的海外Maker和小型工坊经营者。</p>\n  <p>“我们的客户主要是35岁至65岁的欧美男性，他们往往有自己的车库，或者经营一家小型加工厂。东西坏了需要焊接，或者想自己加工一些零件时，激光焊接工具对他们来说是刚需。”刘宸伯告诉硬氪。</p>\n  <p>LaserCyber推出的L1系列覆盖600W、900W和1200W三个功率段，一台设备集成手持焊接、切割和清洗，并通过其独家技术能力，实现铜、铝等高反射材料的焊接和加工。在此前的消费级小型焊机中，铜、铝等高反射材料难以加工，需要使用专门设备。</p>\n  <p>“过去普通小焊机基本只能焊铁和不锈钢，焊铜、焊铝往往要换不同的机器。L1希望把这些材料放到同一台设备里处理，用户只需选择材料即可。”刘宸伯告诉硬氪。</p>\n  <p>L1的另一个特点是集成化。其送丝机构被置于机身内部，用户不再需要分别配置焊机和送丝机；自动送丝和回抽设计则用于减少收弧时焊丝粘连。刘宸伯表示，LaserCyber并非简单缩小工业设备，而是重新组织光源、焊枪、送丝、控制系统和交互软件之间的配合。</p>\n  <p>用AI降低激光焊机的学习门槛是L1的另一大特点。LaserCyber介绍称，L1通过内置软件系统帮助新手用户一键开启操作，能够快速上手。对于成熟用户，则提供了多维参数调节选择，保持产品对专业用户的适配度。</p>\n  <p>硬氪了解到，参数库主要来自团队多年积累的焊接工艺数据，后续计划通过社群运营来进一步提高参数库的多样性。</p>\n  <p>在产品设计上，LaserCyber通过独有的AI软硬件体系实现产品的预测性维护和用户的技术迭代。</p>\n  <p>将AI能力集成进焊枪并不容易。LaserCyber寇令涛告诉硬氪，焊枪内部要同时容纳多路技术，团队为此对焊枪前后进行了约7至10轮迭代。与此同时，把水冷、送丝和控制模块压进一体化机身，也提高了散热、可靠性和量产一致性的要求。</p>\n  <p>安全性也是消费级激光焊机产品必须注意的问题。L1系列属于高功率第四类（Class 4）光纤激光设备。公司称，产品正按SGS流程推进面向欧盟和美国市场的CE、RED及FDA合规工作。</p>\n  <p>团队方面，创始人兼CEO刘宸伯毕业于上海交通大学，拥有互联网广告、海外营销和激光工具品牌运营经历；联合创始人兼CTO寇令涛拥有超过15年的激光研发经验，曾任海目星切割事业部总工程师、大族激光智能装备公司研发总监。</p>\n  <h3><strong>CEO对谈</strong></h3>\n  <p><strong>硬氪：你们提到AI和小模型，这套系统的训练数据从哪里来，能够覆盖多少种材料和工况？</strong></p>\n  <p><strong>刘宸伯：</strong>初始工艺参数来自团队过去在工业端积累的焊接数据和测试经验，先覆盖常见材料、厚度和功率组合。我们还会把环境温度、散热状态等变量纳入计算，让设备在不同环境下自动调整参数。</p>\n  <p><strong>硬氪：像xTool也在做激光焊，在品牌和软件上已经有积累。LaserCyber作为一个新品牌，最难被复制的差异是什么？</strong></p>\n  <p><strong>刘宸伯：</strong>我们高度认可xTool的品牌和产品能力，但激光焊接、激光切割是LaserCyber的主业，不是从其他产品线延伸出来的一项尝试。我们的差异不是单个参数，而是三部分一起做：用抗高反光源处理铜、铝材料，把送丝、焊接、切割和清洗做成一体，再用AI降低工艺门槛。围绕金属加工重新配合光源、焊枪、控制系统和软件，这套整体能力才是最难被复制的。</p>", "category": "tech", "published_at": "2026-10-10T02:26:03+00:00", "fetched_at": "2026-10-10T04:02:36.858530+00:00", "fingerprint": "5d4f2f0c5b7ff4bb"}, {"source": "36氪 - 最新文章", "title": "世界的下一个版本，由我们定义 ｜2026苏客松招募启动", "url": "https://36kr.com/p/4019446240857993?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_65478eede5284479881424ea03dd1b32@6438729_oswg1985117oswg1200oswg4776_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片1</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_9e9c3253f7814911a9610ca49740ddc0@6438729_oswg1058358oswg1080oswg3693_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片2</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_b224b13a0ba8425da8aae1381831eaa0@6438729_oswg537735oswg1080oswg2077_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片3</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_be4653e32c474ff9aa11102c211d2a65@6438729_oswg1060041oswg1080oswg1738_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片4</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_1b15480bd96941b283994a361ab795db@6438729_oswg463066oswg1080oswg1765_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片5</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/ ublished_at": "2026-10-08T22:32:04+00:00", "fetched_at": "2026-10-09T04:17:30.067079+00:00", "fingerprint": "4268295049087d74"}, {"source": "36氪 - 最新文章", "title": "两年破5800万DAU，三角洲的“赢”没有标准答案", "url": "https://36kr.com/p/4017128711278725?f=rss", "summary": "<p>10月8日，《三角洲行动》公布最新日活跃数据——5800万。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_95698ed261a14e1cb1b319a2d164d001@242988687_oswg891993oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">两周年之际，《三角洲行动》国服日活用户突破5800万</p>\n  <p>据官方披露，游戏国服日均活跃用户数再创新高，突破5800万，延续了今年初国服 DAU 突破 5000 万后的增长势头。在不久前的重庆二周年庆典上，琳琅天上团队再次抛出重磅研发蓝图：5v5 回合制拆弹玩法「黑潮爆破」Beta 赛季即日起上线，11月推出 UE5 引擎升级，同时公布了突破性的跨难度新地图「围城·瓦尔基里」与长线叙事「群星计划」。</p>\n  <p>中国音像与数字出版协会数据显示，2025 年国内游戏用户规模达 6.83 亿，增速已放缓至 1.35%；伽马数据等统计也表明，移动端 TOP100 列表中老产品收入占比高达 94.8%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_8fcebbd0720b4ea7aa5fbb0a952dfe87@242988687_oswg112666oswg1080oswg520_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：中国游戏产业研究专家委员会&amp;伽马数据（CNG）</p>\n  <p>整个中国游戏市场已步入“存量主导”时代。对于一款已经证明过自身爆发力的大 DAU 产品而言，行业更关心的命题是：《三角洲行动》凭什么能够做到真正的长青？</p>\n  <p>答案或许就藏在制作人 Shadow 与主策划 Ricky 在周年庆期间受访时反复提到的一句话里：“在三角洲里，赢，没有标准答案。”</p>\n  <h2><strong>01 千万级大盘，装不下“单一答案”</strong></h2>\n  <p>“这个产品是跟玩家以及整个三角洲生态一起成长起来的。” 制作人 Shadow 坦言。在采访中，他清晰地梳理出了《三角洲行动》上线两年来的用户演进路线：上线初期，团队瞄准的是「找到自己」，先解决「我是谁，产品核心定位是什么”；此后随着DAU一路飞涨，在核心射击玩家之外，内容向、二次元、大众与手游用户大规模涌入，团队越来越意识到：三角洲的盘子已经从核心射击玩家演进到多元的大众玩家。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_41926b4b43a0461aad77d479d11bfb74@242988687_oswg760524oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《三角洲行动》上线初期slogan</p>\n  <p>传统竞技射击厂商习惯“立规则”——比K/D、比段位、榜单，过去的三角洲也有从“普通-机密-绝密”的线性成长路径，但在数千万不同背景的玩家面前，这种单一路径必然失效。</p>\n  <p>“很多用户并不需要我们给他设定一条固定的路径。” Shadow 表示。“在三角洲里，玩家关注是多元的，不仅是‘你是什么段位？’或者‘你的KD是多少？’，还有‘你这个赛季有没有摸到新大红？’&nbsp;，‘你的隐藏成就xxx完成没有？’”，</p>\n  <p>当产品大到一定体量，官方不可能再用统一到规则框定玩家，而“供给土壤，让故事自然发生”是三角洲破局的方式。</p>\n  <h2><strong>02 每投一个玩法，都希望投到“透”</strong></h2>\n  <p>在这个庞大的生态里，如果你是「鼠鼠」，你可以四处搜刮物资，见人就跑，用最小的代价啃完最丰富的物资；如果你想要「猛攻」，可以拉满顶级战备进图“厮杀”，追求纯粹高燃爽打；也有玩家迷恋收集“手办”，把各种炫彩娃娃集满一面墙；还有玩家专门整活，在游戏里不打不搜，集体跳一曲“得吃舞”、发一句「新年快乐」化解干戈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_072fedb992fb4f3e94cf26445fa0d3c7@242988687_oswg671776oswg1080oswg1969_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玩家盘点的“炫彩娃娃”</p>\n  <p>面对庞杂的需求，Shadow给出的答复是：“每投一个玩法，都把它投到透、做到极致。”</p>\n  <p>渴望快节奏纯粹钢枪的群体，可以享受5v5回合制的黑潮爆破；针对追求博弈落差的群体，即将上线打破次元壁、拥有强故事题材的烽火地带新地图「瓦尔基里」，用一堵高墙划分内外城，将风险与收益的选择权完全交还给玩家；而全面战场也在继续加大技术投入，满足玩家对大场面临场感与“娱乐爽游”的诉求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_c9989ecd8d494b4ca8ed84fe40f5f62c@242988687_oswg941052oswg1080oswg570_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">二周年公布烽火地带新地图「瓦尔基里」</p>\n  <p>而纵向来看，搜打撤（烽火地带）里的每张图也要“做到透”，去满足不同流派的多元用户。用Shadow的话来说，是利用不同地图特性和对用户需求的洞察，在“搜打撤”模式中做平台化。以最新赛季的长弓溪谷2.0改版为例，这张地图原本就凭借开阔的风光和相对平缓的对抗压力，成为新手和休闲玩家偏爱的“避风港”。官方敏锐捕捉到这种既有的玩家习惯，引入了钓鱼、口琴等交互玩法，将原本就偏低压的地图顺势演变为一个惬意的社交沙盒——有人在水边静静坐上一整天，有人开着载具做起了“滴滴打船”生意，有人拿起口琴随机偶遇自己的“子期”，甚至有玩家专门进图拍照打卡。</p>\n  <h2><strong>03 官方幕后搭台，玩家幕前执导</strong></h2>\n  <p>十几万玩家协力解密官方隐藏彩蛋，最终彩蛋里复刻了弹琴的阿萨拉小兵，以及一个个社区高光回忆和真实留言，把无数玩家看泪目；周年庆现场，玩家的情绪一路被精彩的发布会和音乐会带动，不断高呼「新年快乐」、「三角洲，牛X」；而社区投票产生的“十大名梗”也正儿八经地登上庆典舞台······这些不与传统FPS竞技数据挂钩的内容，却构成了这款游戏真正吸引人的东西。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_dedbbb4128e048b4a331d124bac00c3d@242988687_oswg90041oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内彩蛋画面</p>\n  <p>谈及如何挑选这些社区内容做进游戏彩蛋时，主策划 Ricky 给出了解答：“说‘挑选’不太准确。我们在周年庆里放小兵弹琴，是因为去年看到那条学生 Cos 阿萨拉小兵弹琴的视频，让我们深受感动。我们不是在筛选玩家内容，更多是在致敬。 想把这些美好让更多人看到，这与致敬经典作品是一个道理。”</p>\n  <p>另一方面，做大DAU产品最忌“一刀切”蛮干，主策划 Ricky 与 Shadow 并不避讳曾经的踩坑经验，为了解决生态流动性问题，项目也成立了专项小组，小步快跑地在幕后维护好生态的平衡。“用户和生态是流动的，也是不断成长的。”“既保护好硬核钢枪的爽感，也让新手或低枪法门槛的玩家能找到本命干员。”</p>\n  <p>Shadow和Ricky在采访中常提及一句话：“最好的故事以及最好的体验是玩家创造出来的。”&nbsp;</p>\n  <p>我想，这句话或许是对三角洲过去两年最好的注解：好的游戏，是为玩家提供土壤，接得住玩家需求，让各类玩家都能各尽其兴，乐在其中；教玩家怎么玩才算\"对的\"的时代，已经过去了。</p>\n  <h2><strong>04 走向世界的“三角洲”，长青IP的全球野心</strong></h2>\n  <p>对于一款想要长青的产品而言，纯粹的玩法机制决定了初始的爆发力，但鲜活的人物塑造与长线叙事能力，才是决定 IP 寿命与走向全球的终极法宝。</p>\n  <p>纵观过往的 FPS 赛道，绝大多数服务型射击游戏（GaaS）在叙事上都陷落于“工具化”的尴尬境地，角色的设计服务于机制排位，玩家对角色的选择更多因为技能、数值，缺乏情感羁绊，一旦玩法新鲜感退潮，产品也更易面临用户流失。</p>\n  <p>而对于想要“走向世界”的国产 FPS 而言，高质量的 IP 叙事与人物塑造，更是破除文化壁垒的“通用货币”。 在欧美等海外成熟市场，玩家从小接受 AAA 级大作的洗礼，对射击游戏的诉求早已超越了“单纯对枪”——他们消费的是IP的故事感与沉浸感。如果仅凭玩法机制出海，极易遭遇文化隔阂与同质化竞争，水土不服；唯有通过鲜活立体的角色形象与深刻的世界观叙事，才能建立跨越地域与文化的情绪共鸣，留住用户心智。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_cbc8f6dcb4f0428fa3d00cfcf41fd9f5@242988687_oswg773984oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">群星计划正式亮相</p>\n  <p>《三角洲行动》在二周年庆典上抛出了长线叙事的「群星计划」，并重磅首发了&nbsp;3 条干员叙事PV。三条PV不再满足于展示技能打法，而是将镜头深入干员的性格底色、命运抉择与阵营纠葛。它们将干员从“技能工具”提升为有血有肉的“故事主角”，不仅大大提升了干员的辨识度，也让《三角洲行动》有机会蜕变为面目清晰、具备极强叙事张力的 IP 宇宙。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_f6e22c143dce450fb135dc33a459d3d4@242988687_oswg126283oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">无数玩家自发repo</p>\n  <p>随着烽火世界杯落户瑞典斯德哥尔摩，长线叙事计划的公布；从玩法突破到IP面目的愈发清晰，《三角洲行动》用极具战略定力的投入证明：它要做的不仅是一款高DAU长青游戏，更是一个能代表国产工业水准、征服全球市场的顶级射击IP。</p>\n  <h2><strong>结语 &nbsp;从“玩点好的”到“我来同你玩，怎么玩你说了算”</strong></h2>\n  <p>上线初期，《三角洲行动》的 Slogan 是“玩点好的”。那是产品在供给侧的强力宣言——用顶级画质、硬核枪感和高品质体验征服市场。可能有人觉得《三角洲行动》变了。从高燃爽打变成包罗万象，成为需要承接全需求的产品。但它贯彻的其实仍是初心“始终为玩家提供高品质内容”。</p>\n  <p>「玩点好的」解决的是游戏如何给玩家提供更好的体验；「我来同你玩，怎么玩你说了算」，是一款大 DAU 产品走向成熟的标志。它不再定义成功，而是化作一片肥沃且自由的土壤，进一步把选择权交还给玩家——你可以追求胜��，追求刺激，可以钓鱼、整活、收藏，也可以因为一个陌生人的善意，留下属于自己的故事。</p>\n  <p>游戏提供的是一个足够丰富的世界，而真正决定这个世界最后长成什么样的，是里面的每一个玩家。</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s/wSkalc_koITNlNdZef3ziA\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-10-08T11:22:32+00:00", "fetched_at": "2026-10-09T04:17:29.977373+00:00", "fingerprint": "cfa7e12ebdf6a3ad"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨国际金价回调，金饰克价已暴跌约150元；A股千元股仅剩3只；711印度门店全部关闭", "url": "https://36kr.com/p/4017873472884616?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>粤万年青：澄清董事长欧先涛未涉航班冲突传闻，已报案处理</li>\n   <li>711印度门店全部关闭</li>\n   <li>2026年诺贝尔文学奖揭晓</li>\n   <li>腾讯据悉考虑发行至多50亿美元离岸债券</li>\n   <li>消息称三星手机四季度最高减产30%</li>\n   <li>Manus完成超5亿美元新一轮融资</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>国际金价显著回调，金饰克价已暴跌约150元</strong></p>\n  <p>近期，国际金价经历显著回调，COMEX黄金期货跌破每盎司4200美元，国内沪金击穿每克900元关口，品牌金饰价格较高点累计下跌每克150元左右。受金价下行带动，深圳水贝首饰金挂牌价回落至每克1061元。</p>\n  <p>金价回调叠加节日促销，让这个全国最大的黄金珠宝集散地迎来了外地游客的购金热潮。一名黄金导购表示，国庆期间每天至少带30到40组外地客户到水贝购买黄金。与此同时，水贝市场的“国际面孔”悄然增多，钻石类首饰和高品质金饰尤其受到海外游客的青睐。（央视财经）</p>\n  <p><strong>A股千元股仅剩3只：联讯仪器、源杰科技、贵州茅台</strong></p>\n  <p>受半导体、通信板块走低影响，10月8日高价股群体中权重最大的科技类个股普遍下跌。其中，寒武纪跌幅近3%，股价收报于981元，收盘价时隔近1个半月再次回落至千元下方。至此，全市场千元股数量缩减至3只，分别为联讯仪器（1420元）、源杰科技（1290.40元）、贵州茅台（1255.79元）。</p>\n  <p>若百元股角度统计，其指数8日盘中创8月4日以来近2个月新低，同时即将逼近7月30日录得的阶段低点，近7个交易日累计回撤近12.95%。具体个股来看，长光华芯、源杰科技、芯原股份、宏景科技、东山精密、晶丰明源、联特科技、优迅股份、仕佳光子、鼎通科技等共23股近7日跌幅超20%。（财联社）</p>\n  <p><strong>711印度门店全部关闭</strong></p>\n  <p>日本零售业巨头7&amp;I控股公司10月6日发布声明说，其旗下连锁便利店品牌7-11位于印度的所有门店均已关闭。日本媒体称，7-11便利店因不敌当地竞争对手而退出印度市场。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>英伟达支持的AI数据中心公司Firmus上市遇阻</strong></p>\n  <p>英伟达支持的澳大利亚AI数据中心运营商Firmus Grid原计划通过首次公开募股（IPO）筹集至多55亿美元，有望跻身澳大利亚历史上规模最大的IPO之一。然而，随着投资者对公司上市后股价表现及现有股东潜在抛售压力的担忧加剧，Firmus的上市计划正面临不确定性。</p>\n  <p>10月8日，公司按计划结束IPO询价簿记，但最终发行价格及交易结构仍不明确。受相关消息影响，Firmus现有股东Maas Group Holdings在悉尼交易时段股价一度暴跌30%，创下该股有记录以来的最大跌幅。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>江淮汽车回应尊界V800刹车踏板支架断裂</strong></p>\n  <p>10月8日，针对尊界V800刹车踏板支架断裂一事，江淮汽车方面向记者表示，公司已关注到此事，目前正在调查中，还在多方做测试，有结果后会有官方说明。</p>\n  <p>这一风波起源于懂车帝在10月8日对外放出的场地实测视频。视频显示，三台全新的尊界V800在封闭场地开展百公里时速至静止的紧急制动试验，连续多次重刹后，车辆刹车踏板支架先后出现断裂问题。故障出现于第2至第4次全力制动，一旦支架断裂，车辆常规脚刹功能直接失效，驾驶员只能依靠挂入P挡实现应急减速。</p>\n  <p>10月8日，江淮汽车盘中跌停，报24.72元/股。截至收盘，成交额为36.14亿元，换手率达6.35%，最新市值为557.23亿元。（贝壳财经、21财经）</p>\n  <p><strong>粤万年青：澄清董事长欧先涛未涉航班冲突传闻，已报案处理</strong></p>\n  <p>36氪获悉，粤万年青公告，公司关注到网络平台出现“9月28日东航MU6741航班客舱冲突事件涉事旅客为公司董事长欧先涛”的不实言论。经核实，公司针对上述传闻说明如下：网络流传涉及公司董事长、总裁欧先涛的相关内容均不属实，欧先涛从未乘坐该航班，上述信息系无任何事实依据的恶意捏造，已构成对公司董事长个人名誉及公司商业信誉的侵害。欧先涛已向公安机关报案并获受理，公司也同步就相关传播内容开展证据留存与保全工作。公司将根据相关法律法规，对编造、散布上述不实信息的主体依法追究法律责任，坚决维护公司及全体投资者的合法权益。</p>\n  <p><strong>2026年诺贝尔文学奖揭晓</strong></p>\n  <p>2026年10月8日晚7点，诺贝尔文学奖名单揭晓：获奖者是加拿大诗人安妮·卡森。评委会给她的评语是：“她大胆创新的作品，在与古典传统充满趣味的对话中，为当代文学创造了新的形式。”</p>\n  <p>安妮·卡森被誉为“英语文学中最重要的在世诗人”，深受哈罗德·布鲁姆、桑塔格、翁达杰等一流评论家和作家的推崇。布鲁姆称其为“在世诸天才之一”，可与艾米丽·勃朗特和艾米丽·狄金森相提并论。（封面新闻）</p>\n  <p><strong>美国上周首次申领失业救济人数为19.7万人，小幅低于预期</strong></p>\n  <p>美国上周首次申领失业救济人数为19.7万人，预估为20万人。（财联社）</p>\n  <p><strong>波长光电：公司及董事长等被提起公诉，涉走私国家禁止进出口货物罪</strong></p>\n  <p>36氪获悉，波长光电公告，公司收到上海市人民检察院第三分院《起诉书》，公司及董事长黄胜弟等四人被以涉嫌走私国家禁止进出口的货物罪提起公诉。涉案金额为2010.85万元，案发于2023年8月至2025年4月。公司称诉讼预计不会对持续经营能力产生重大影响，目前生产经营正常，判决结果存在不确定性。</p>\n  <p><strong>腾讯据悉考虑发行至多50亿美元离岸债券</strong></p>\n  <p>据知情人士称，腾讯控股在考虑发行至多50亿美元的离岸债券。这些债券可能以美元和离岸人民币计价，最早或于本月发行。腾讯6月已通过发行长期美元和人民币债券筹集了近47亿美元资金，创其2020年以来最大发债规模，所得资金主要用于债务再融资，以及包括开发AI产品和服务在内的一般公司用途。（新浪财经）</p>\n  <p><strong>台积电9月销售额同比增长54.6%</strong></p>\n  <p>台积电9月销售额5118.6亿元新台币，环比下降0.6%，同比增长54.6%。台积电2026年前三季度营收38987.3亿新台币，同比增长41.1%。（财联社）</p>\n  <p><strong>贝索斯首次明确蓝色起源上市时间表：已融资100亿美元、估值最高1400亿美元</strong></p>\n  <p>亚马逊创始人杰夫·贝索斯10月7日表示，旗下太空公司蓝色起源（Blue Origin）未来可能进行首次公开募股（IPO），但距离正式上市仍有数年时间。这是贝索斯迄今对蓝色起源潜在上市计划最明确的表态之一。今年早些时候，蓝色起源完成成立以来首轮大规模外部融资，筹集100亿美元，估值达到约1300亿至1400亿美元。随着公司获得美国政府数十亿美元的太空项目合同，并加快推进重型运载火箭计划，蓝色起源正逐步扩大外部融资规模。（新浪财经）</p>\n  <p><strong>消息称三星手机四季度最高减产30%</strong></p>\n  <p>据韩媒报道，三星电子旗下的移动体验事业部（MX）已开始削减今年第四季度的产量，预计减产幅度高达30%。外界认为，此举原因是假日季内存芯片价格大幅上涨，导致营业利润率承压。多位行业消息人士7日透露，该部门近期要求合作伙伴将产品供应量减少20%至30%。因此，三星电子第四季度智能手机产量预计将下降至多30%。（财联社��</p>\n  <p><strong>美股三大指数收盘涨跌不一，英特尔跌超5%</strong></p>\n  <p>36氪获悉，10月8日收盘，美股三大指数涨跌不一，纳指跌1.25%，标普500跌0.47%，道指涨0.1%；大型科技股多数下跌，英特尔跌超5%，美光科技、SK海力士、SpaceX跌超4%，英伟达、亚马逊跌超2%，微软跌超1%，特斯拉、谷歌、Meta小幅下跌，苹果涨超1%；热门中概股普跌，蔚来跌超3%，百度、阿里巴巴跌超1%，网易、理想汽车、哔哩哔哩、京东、小鹏集团、拼多多小幅下跌。</p>\n  <p><strong>苹果给开发者下硬规定：明年4月所有App必须适配折叠屏</strong></p>\n  <p>10月8日，据了解，苹果近日面向全球应用开发者公布针对首款折叠屏iPhone Duo的应用提交新规，要求开发者适配iPhone Duo，否则从明年4月起，新应用和更新都无法通过App Store审核。该政策标志着苹果正式建立折叠屏iPhone的应用上架准入标准。（财联社）</p>\n  <p><strong>特朗普8月买入最高2500万美元Meta股票</strong></p>\n  <p>根据新披露的财务文件，美国总统特朗普在8月完成500多笔证券交易，其中包括最高2500万美元Meta股票；他还购入最高500万美元SpaceX债券，这笔投资发生在他签署一份覆盖面广泛的备忘录前两天，该备忘录旨在扩张美国商业航天运输体系。这份18页文件显示，特朗普投资组合交易依旧十分活跃，只是相比6、7月有所放缓，那两个月他各自披露超1000笔交易。（新浪财经）</p>\n  <p><strong>央行：近年来中国贸易的一个重要结构性变化，是对汇率变化的敏感度明显下降</strong></p>\n  <p>36氪获悉，央行发布人民币汇率的政策立场指出，近年来中国贸易的一个重要结构性变化，是对汇率变化的敏感度明显下降。从贸易结构看，中国出口结构转型升级，从低端劳动密集型产品为主向中高端、多样化产品转变。过去5年，中国高技术产品进出口年均增长7.9%，2025年同比增速进一步升至11.4%，对整体外贸增长的贡献率接近六成。中国出口商不再是单纯的价格接受者，而是嵌入全球供应链，可与上下游企业共担汇率成本。从贸易相关的金融服务看，外贸企业更多使用汇率避险手段，约30%的贸易采用人民币结算，企业外汇套保比例也达到30%左右，进一步降低了贸易对汇率波动的敏感性。未来这些比例有望进一步提升。</p>\n  <p><strong>美股Q3财报季将登场，英伟达美光“唱主角”</strong></p>\n  <p>美股Q3财报季将于下周正式拉开帷幕。据ZeroHedge的一项分析，英伟达和美光预计将占标普500指数Q3每股收益增长的三分之一以上。该分析还发现，总体而言，人工智能基础设施公司预计将驱动标普500指数Q3每股收益增长的一半以上。（财联社）</p>\n  <p><strong>国庆假期1546.2万人次出入境，日均220.9万人次</strong></p>\n  <p>据国家移民管理局通报，今年国庆假期全国边检机关共保障1546.2万人次中外人员出入境，日均220.9万人次，较去年同期增长6.7%；单日出入境通关最高峰出现在10月4日，达239.7万人次。其中，内地居民出境444.4万人次，较去年同期增长9.3%；外国人入境68.2万人次，适用免签政策入境50.5万人次，较去年同期分别增长5.4%、9.2%。共计查验出入境交通运输工具73.2万架（艘、列、辆）次，较去年同期增长14.7%。（央视新闻）</p>\n  <p><strong>人社部就《新就业形态劳动者权益保障办法（征求意见稿）》公开征求意见</strong></p>\n  <p>36氪获悉，为了保障新就业形态劳动者合法权益，明确平台企业、平台用工合作企业、新就业形态劳动者的权利和义务，推动新就业形态健康发展，人力资源社会保障部、交通运输部、文化和旅游部、国家卫生健康委、市场监管总局、国家医保局、国家网信办共同研究起草了《新就业形态劳动者权益保障办法（征求意见稿）》，现向社会公开征求意见。</p>\n  <p><strong>市场监管总局持续开展网络食品销售虚假宣传整治，立案调查1.4万件</strong></p>\n  <p>国庆节期间，市场监管总局指导各地市场监管部门深入推进网络食品销售虚假宣传专项整治行动，紧盯节令食品、网红食品、保健食品等网络销售重点，对虚假宣传、误导消费等问题“零容忍”，严厉打击违法违规行为。今年以来，全国累计检查食品经营主体82.1万家次，发现问题7.2万个，立案调查1.4万件，罚款6130.4万元，移送公安机关289件。网络平台违规链接及虚假宣传信息得到大量清理，资质信息公示不全等问题得到有效整改，食品经营整体合规水平有效提升。（央视新闻）</p>\n  <p><strong>保时捷将削减车型衍生版本数量，高端车型计划涨价20%</strong></p>\n  <p>10月7日，跑车制造商保时捷在资本市场日上披露，将优化车型衍生版本数量，使产品组合更聚焦于有吸引力的高端细分市场。公司计划将车型衍生版本数量减少约20%，以降低产品组合的复杂性。预计中期内，每个车型衍生版本的平均销量将提升约30%。据披露，保时捷计划将其高端车型售价平均提高20%，并将推出一款911衍生车型。到2030年，保时捷高端车型的平均价格预计将从今年的约27万欧元升至超33万欧元。保时捷表示，到2030年计划每年至少推出一款定义品牌形象的新产品。（界面新闻）</p>\n  <p><strong>亚马逊多个团队再度裁员</strong></p>\n  <p>据媒体最新报道，亚马逊员工周二称，公司多个业务部门开启新一轮裁员。媒体看到消息显示，一批员工在内部Slack频道发文，表示收到邮件通知岗位被撤销。这个近3.7万名成员的频道瞬间充满提问，大家关心遣散补偿、内部岗位投递权限，以及是否还会收到更多裁员通知。消息显示本次裁员覆盖多个业务单元，包含客服、平台支持、亚马逊零售业务的工程岗位，同时波及印度与英国团队。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>上交所终止赛克赛斯科创板发行上市审核</strong></p>\n  <p>36氪获悉，据上交所官网显示，赛克赛斯生物科技股份有限公司科创板IPO审核状态变更为“终止”。</p>\n  <p><strong>传音控股正式启动香港联交所主板招股</strong></p>\n  <p>36氪获悉，传音控股日前正式启动香港联交所主板招股，A+H双重上市进程进入关键阶段。业绩方面，2026年上半年公司实现营收354.31亿元，同比增长21.85%；归母净利润17.73亿元，同比增长46.22%；扣非净利润14.80亿元，同比增长64.98%。本次港股募资净额将主要投向AI与终端技术研发、全球品牌及渠道拓展、移动互联网与物联网生态建设，助力公司向“手机+移动互联服务+扩品类”科技生态平台转型。</p>\n  <h2>大公司财报</h2>\n  <p><strong>LG能源第三季度合并营收9.64万亿韩元</strong></p>\n  <p>LG能源第三季度合并营收9.64万亿韩元，高于此前预期的8.48万亿韩元。LG能源第三季度营业利润为7560亿韩元，高于预期的3654.8亿韩元。（新浪财经）</p>\n  <p><strong>百事公司第三季度营收252.74亿美元，同比增长5.6%</strong></p>\n  <p>百事公司公布2026年第三季度业绩，营收252.74亿美元，同比增长5.6%；有机营收增长3.1%，核心每股收益2.34美元，同比增长2%。公司上调全年有机营收增长预期至约3%，净营收增长约6%，但将核心每股收益增长预期下调至2.5%至3.5%，反映成本压力及利润率挑战。公司表示，国际市场表现强劲，并将持续通过创新及成本削减措施支持投资。（界面新闻）</p>\n  <p><strong>东岳硅材：预计前三季度归母净利润为5.47亿元-5.67亿元</strong></p>\n  <p>36氪获悉，东岳硅材公告，预计前三季度归母净利润为5.47亿元-5.67亿元。2026年前三季度，受市场环境及行业供需格局改善影响，公司主要产品价格上涨。原材料方面，工业硅采购价格同比下降，甲醇、一氯甲烷价格同比上涨，整体单位生产成本有所下降，综合毛利率提升。2025年第三季度受“7・20”火灾事故影响，公司当期亏损3933.74万元，使得前三季度归母净利润为285.67万元，本期利润指标与上年同期不具备可比性。报告期内，公司预计非经常性损益对归属于上市公司股东净利润的影响金额为4,200万元左右，主要为非流动资产处置损益等项目所致。</p>\n  <h2>投融资</h2>\n  <p><strong>Manus完成超5亿美元新一轮融资</strong></p>\n  <p>36氪获悉，Manus母公司蝴蝶效应于近日完成超过5亿美元新一轮融资。本轮融资由博裕投资、IDG资本领投，老股东腾讯、红杉中国、真格基金继续加持。</p>\n  <p><strong>“比特幻境”完成数亿元人民币天使轮融资</strong></p>\n  <p>36氪获悉，智能眼镜品牌NIMO所属公司“比特幻境”近日完成数亿元人民币天使轮融资，最新估值达15亿元。本轮投资方包括博华资本、戈壁创投、元禾璞华，以及尚势资本等相关投资机构。融资资金将主要用于产品研发、渠道拓展及海外市场布局。</p>\n  <p><strong>“白犀牛”完成1亿美元C轮融资</strong></p>\n  <p>36氪获悉，10月8日，L4自动驾驶公司“白犀牛”正式宣布完成C2轮融资，C轮融资金额累计达到1亿美元。C2轮融资由隐山资本领投，湘潭国资、深重投、湖南财信、韩国友利金融集团、博正资本等跟投，本轮融资资金将重点投向L4端到端技术与物理AI能力迭代、城市运营网络持续拓展，同时持续深化与产业伙伴的生态协同，跑通技术、产品、运营、生态的完整闭环。</p>\n  <p class=\"editor-note\"><strong>整理丨</strong>何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-10-08T23:54:50+00:00", "fetched_at": "2026-10-09T04:17:29.977369+00:00", "fingerprint": "71ed44b23858b238"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜「闹翻天PLAYFULLY」获青山资本投资，为世界造一张“中国球星卡”", "url": "https://36kr.com/p/3987542281862149?f=rss", "summary": "<p>作者｜任彩茹</p>\n  <p>36氪获悉，新兴收藏级卡牌公司「闹翻天PLAYFULLY」（以下简称“闹翻天”）近期完成新一轮融资，青山资本领投，天使轮老股东Adam Zhu持续追投，领甪资本担任长期财务顾问。本轮资金将主要用于全球顶级体育IP的获取与拓展、产品研发与工艺创新以及全球化全渠道建设。</p>\n  <p><strong>「闹翻天」创立于2024年下半年，核心团队深耕文体IP运营、潮流衍生品开发与卡牌行业多年。公司创始人曹磊拥有20年体育产业运营及投资经验，曾在全球最大体育管理公司IMG任职多年，也曾在苏宁投资、曜为资本、复星集团、IDG等机构负责文体投资与产业运营。</strong></p>\n  <p>2024年8月，闹翻天以电竞头部IP王者荣耀职业联赛（KPL）衍生品切入市场，产品上线首月营收突破百万元，首年即完成千万级营收并实现盈利。在此基础上，团队将核心方向聚焦于自身具备资源壁垒与专业沉淀的赛道——顶级体育IP与球星卡。</p>\n  <p>2025年3月，闹翻天拿下阿根廷国家足球队为期五年的亚洲独家授权合作，并与足球巨星梅西达成官方球星卡签字合作。随后又于2026年7月再度锁定比利时国家足球队的独家授权，并通过旗下球星卡品牌「HEROCK」在世界杯期间陆续推出阿根廷国家队HALO、RADIANCE等系列收藏卡，以及面向大众圈层的“10元包”普及型产品RUNE。</p>\n  <p>近日，闹翻天旗下阿根廷系列卡牌正式进入全球权威卡牌评级机构CGC和PSA的评级体系，同时，闹翻天持续在国内交易平台屡创高价成交记录，其中RADIANCE梅西一编一亲签卡以12万元整于9月成交。这都标志着闹翻天作为新锐本土球星卡发行商在国际主流收藏卡评价标准中得到认可。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_c5350c215da54bdaa0c1d46a53cbc279@5748245_oswg711468oswg832oswg556_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">梅西签字照及已获得评级的HEROCK卡牌（来源：闹翻天）</p>\n  <p>当前，国内卡牌与潮玩赛道正经历从野蛮生长向专业化、精细化运营的洗牌期。一方面，依托动漫、影视、二次元的“谷子”与娱乐卡牌面临生命周期短、热点轮动快、流量焦虑加剧的挑战；另一方面，传统球星卡市场长期被海外巨头垄断，二级市场过度金融化与高昂门槛将绝大多数大众消费者拒之门外。闹翻天试图以“产品第一”为支点，依托中国成熟的供应链与创意设计能力，重塑兼具收藏价值与大众文化属性的体育衍生品生态。</p>\n  <h3 label=\"二级标题\">01 既做圈内认可的球星卡，也要带它走向大众</h3>\n  <p>在衍生品行业中，IP的选择决定了商业模型的底层生命周期。与生命周期往往只有数月至一两年的影视剧和阶段性热点动漫相比，体育IP拥有更好的恒定性与自驱成长力。每年规律进行的大小赛事，新星的涌现与老将的传奇时刻，会源源不断地为体育IP注入新的内容与情感。</p>\n  <p>同时，体育IP的获取门槛也更高，尤其在国际头部IP争夺中，单纯的资金优势早已失效。在阿根廷国家队亚洲独家授权的竞标中，不乏开出数倍乃至数十倍溢价的竞争对手，而阿根廷足协最终选择与闹翻天达成合作。</p>\n  <p>曹磊将这一突围归结为深度的产业信任与专业IP孵化能力的结合，“在体育行业，国际版权方非常挑剔。他们不仅看重合作历史与履约确定性，更看重你懂不懂体育、能不能把产品做好，以及是否具备长期培育IP和球迷生态的复合能力。”</p>\n  <p>“产品第一”，是闹翻天的信条之一。<strong>针对长期被欧美体系主导的球星卡工业设计，闹翻天在对标国际主流工艺（如折射Refraction、稀缺平行卡Parallel、官方签字与实物切割卡）的同时，创新性地将中国在地文化融入国际体育藏品。</strong></p>\n  <p>例如，闹翻天团队与敦煌、故宫等文化IP进行联名合作，在设计中融入中国自己的文化和审美，产品设计和质量也获得了IP方与诸多球星的认可，甚至有多位球员在签字后主动提出，希望留下一些闹翻天的卡作为收藏。曹磊笑称，每次找球员签字，自己最提心吊胆的事情就是担心球员签完字以后要把卡拿走收藏。“因为有些卡只有一编（One of One）, 全世界只有一张，被拿走了就会影响到整个产品的配置。”</p>\n  <p>长期以来，海外巨头的高定价把球星卡在一定程度上变成了少数人的溢价游戏，但闹翻天希望打破“小圈子”。 <strong>“一个健康且有生命力的市场应当呈现‘金字塔’结构——塔尖是高净值藏家的顶级收藏与投资流转，庞大的塔基则是大众爱好者、青少年与普通家庭的文化认同与日常消费。”</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_0a1f05b72d1d4c0da35a8df0ed1ef72c@5748245_oswg544591oswg1255oswg1671_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">10元包RUNE系列的产品（来源：闹翻天）</p>\n  <p>为此，闹翻天构建了兼顾专业与普惠的分层产品矩阵。在金字塔中端，推出官方零售价为699元/盒（内含6包共30张）的中端产品HALO等系列收藏卡，单张卡片均价约20余元，以高品质折射工艺与亲民定价对标海外动辄数千上万元的同级产品；<strong>在金字塔基座，闹翻天于2026年7月中旬推出“阿根廷国家队官方收藏卡10元包”， 将价格门槛降至大众与青少年触手可及的水平，同样有机会拆出稀有特卡与签名。</strong>在世界杯结束后，闹翻天还发行了零售价17500元的高端产品RADIANCE光辉系列，也在短时间内售罄，取得了良好的市场反馈。</p>\n  <p><strong>渠道侧，高客单价收藏卡主要依托线上拆卡直播间、拼团社群及线下专业卡店沉淀高粘性核心用户；而10元包则全面铺向潮玩集合店、商超便利店及下沉市场路边店。</strong>这种兼顾专业藏家与泛体育爱好者的布局，也成为闹翻天推动球星卡从“少数人炒作”回归为“大众文化陪伴”的落脚点。</p>\n  <h3 label=\"二级标题\">02 把中国创意写进全球体育故事</h3>\n  <p>从全球产业视角来看，球星卡与体育衍生品是一门被反复验证过的超级生意。北美体育消费巨头Fanatics最新估值已达数百亿美元，老牌卡牌巨头帕尼尼（Panini）年营收亦达数十亿美元体量。</p>\n  <p>全球成熟市场已经证明，体育卡牌并非单纯的纸质收藏品，而是连接体育IP、粉丝文化、收藏、交易与社群的一种长期消费形态。曹磊告诉36氪，在美国，球星卡消费人群占总人口比例接近10%，形成了跨越近百年的代际传承文化；而在中国，体育卡牌的受众渗透率尚不足0.1%，背后100倍的增量空间极其广阔。</p>\n  <p>从国内潮玩卡牌视角再来看，中国正在形成自己的卡牌文化。近年来，动漫、游戏、影视等IP持续推动卡牌消费普及，消费者对“抽卡、收藏、交换、评级、交易”的认知不断成熟，尤其年轻消费者已逐渐成为卡牌市场的重要参与者。从闲鱼卡牌年度报告数据上可以看到，2025年前三季度平台集换式卡牌交易额同比提升84%，球星卡交易额同比提升104%，体育卡牌正在成为中国卡牌市场的重要增长品类。</p>\n  <p>这也意味着，中国体育卡牌并非从零开始培育市场，而是在已经形成的卡牌消费文化基础上，进入一个新的体育IP增长阶段。与此同时，年轻人和青少年正在成为未来体育收藏文化的重要新增人群。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_4f3a3bdf8e8141d19d23084a77967ba3@5748245_oswg160353oswg832oswg456_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">海外球星卡产业链及部分独角兽公司一览（来源：闹翻天）</p>\n  <p>进一步落到衍生品角度，曹磊发现长期以来，国内体育衍生品市场存在显著的“供给侧断层”：产品形态数十年来停留在球衣、围巾、帽子、水杯等传统“老三样”上，设计同质化严重、缺乏创意与情感交互。与此相对的是，全球体育赛事正面临观众老龄化与注意力碎片化的挑战，版权方也非常迫切需要吸引女性、青少年及年轻家庭客群的加入。</p>\n  <p><strong>闹翻天并未将自身局限在狭义的“卡牌公司”定义中，而是希望将中国公司在潮玩领域积累的设计创意、创新能力与制造优势，全面赋能至体育衍生品赛道。</strong>近年来，全球体育IP的共识之一是希望吸引更多女性和家庭用户尤其是青少年关注和消费体育，公司正围绕体育IP逐步探索卡牌产品之外的多元潮流品类，使传统偏硬核、重男性的体育IP转化为高颜值、趣味性强的泛娱乐生活方式消费品，为体育IP创造更多产品品类，提升可玩性和复购率。</p>\n  <p>品类与人群的拓展之外，中国成熟的创新与生产能力，也助推闹翻天在海外市场“冒头”——<strong>尽管闹翻天成立时间不长，但其阿根廷系列卡牌已通过境外经销商网络主动采购，销往泰国、马来西亚、印度尼西亚、新加坡等东南亚核心市场，以及中国香港、中国澳门等地，甚至部分展会限定PR卡在二级市场上被海外藏家溢价求购。在eBay上，闹翻天的卡牌交易量也在逐步上升。</strong></p>\n  <p>海外市场具备成熟的体育消费认知与更强的购买力，而中国成熟的文化消费品供应链不仅能够实现极致的性价比与快速出货，在工艺精细度与玩法设计上也已具备全球竞争力。</p>\n  <p>谈及未来，曹磊告诉36氪，闹翻天将持续以体育IP为锚点，一方面深化国际顶级赛事资源的签约布局，逐步形成多IP矩阵；另一方面，则围绕已有IP持续做深，逐步探索球星卡之外的多元衍生品，提升单一IP的商业价值和用户覆盖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_f18722d84f7c4242a89e65cd365d6d3d@5748245_oswg1091589oswg1274oswg476_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">闹翻天电竞产品、KPL衍生品产品图（来源：闹翻天）</p>\n  <p>在市场拓展上，闹翻天将以中国市场为基础，逐步向东南亚及其他海外市场拓展，通过本地化的产品设计、渠道和内容运营，将已验证的产品能力复制到更多市场，形成“多IP、多产品、多市场”的发展路径。在运营端，公司将进一步打通线上社群、球票权益兑换、球星线下见面会等球迷专属权益，<strong>让产品不只是一个收藏品，也成为连接IP与粉丝的入口。</strong></p>\n  <p>最终，闹翻天希望立足亚洲，面向全球，以体育IP为核心切入口，通过持续的产品创新做深IP价值，并将成熟的产品能力逐步复制到更多IP和市场。</p>\n  <h2>投资人观点：</h2>\n  <blockquote>\n   <p><strong>天使投资人Adam Zhu：</strong>之所以持续看好国产卡牌机会，是因为中国市场本身足够大，同时拥有全球领先的供应链和越来越强的产品创新能力，海外市场也正在为中国品牌提供更多机会。而闹翻天真正吸引我的，是这家公司和这个团队能够把IP、产品和供应链非常好地结合起来，并以中国市场为基础，进一步走向海外。这个方向的想象空间很大。</p>\n  </blockquote>", "category": "tech", "published_at": "2026-10-09T02:00:46+00:00", "fetched_at": "2026-10-09T04:17:29.977364+00:00", "fingerprint": "7afe041fe65d6e95"}, {"source": "36氪 - 最新文章", "title": "美央构建物理AI路径闭环：把人体变成可计算的真实世界", "url": "https://36kr.com/p/4018021038657411?f=rss", "summary": "<h2><strong>万美京AIMIRA构建\"感知—理解—决策—执行—反馈\"产品闭环，回答物理AI核心命题</strong></h2>\n  <p>当AI走出屏幕，游戏规则彻底改变：真实的人体有空间结构、组织状态与一刻不停的时间变化；软件说错一句话可以重新生成，机器做错一个动作，结果可能无法撤回。物理AI难的从来不是更大的模型，而是\"感知—建模—决策—执行—验证—再学习\"这条长链路。广州美央创新科技（Calilia国际集团/万美京AIMIRA）已把这条链路落成产品体系：FAITH是感知入口，\"女娲\"人体真实世界模型负责建模与理解，医疗级智能硬件与具身设备执行，效果与长期变化再回流系统。</p>\n  <p>美央创始人蒋宇振博士表示：\"女娲不是一个什么都能答的'人体大模型'，而是一套围绕真实人体、兼具空间结构和时间维度的多模态真实世界模型。数字人解决'如何呈现一个人'，我们解决'如何让机器持续理解这个真实的人正在发生什么变化'。\"</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_d41e0f24bbb4445e8fd71d9d997e2a04@5284654_oswg950953oswg650oswg365_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图1</p>\n  <p>&nbsp;</p>\n  <h2><strong>从3DGS出发：既要画得像，更要量得准</strong></h2>\n  <p>女娲不是数字人：从三维高斯泼溅出发，构建”量得准”的人体世界模型。三维高斯泼溅（3DGS）兼顾外观与渲染效率，但\"画得像\"不代表\"量得准\"。美央采用高斯表达与点云、三维网格协同的混合路线：高斯层保留逼真外观，标定几何提供测量接口，时间序列追踪同一个人的变化。团队三维数据底座累计储备约2659万张多视角高清人体图像，部分建模流程仅需5至20秒，指向的是可持续交付的三维资产生产能力。</p>\n  <p>只有一个精细的三维表面仍不等于理解人体：一处凹陷可能对应软组织容量，一条注射路径的风险取决于皮下血管。美央在二维三维视觉、多光谱皮肤信息之外，进一步指向超声软组织与血管、光热与扩散波等无创感知，建立\"个人长期动态数字档案\"——不同时间点的影像、状态与治疗信息联合对齐、随时间复利。医疗场景边界明确：新模态必须经过验证，临床能力按注册范围表达，不替代现有标准诊断手段。</p>\n  <p>感知—决策—执行：FAITH与医疗级硬件：把女娲接进真实服务</p>\n  <p>物理AI的商业题是：模型需要真实数据，数据来自部署，部署需要有人买单。美央的解法是让交付与模型建设同场景推进：围绕头、脸、身年轻化服务，\"评估—方案—执行—结果—再次评估\"闭环同时支撑商业交付与技术积累。执行端，ASP-1M硬件本体于2026年7月取得国家药监局三类医疗器械注册证，为后续AI辅助与自动化执行提供硬件基础。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_13e811543f324dc987e3855889e43c2a@5284654_oswg878014oswg650oswg337_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图2</p>\n  <p>&nbsp;</p>\n  <p>收入路径从硬件、耗材与服务起步，向模型和智能体订阅延伸，并通过第三方设备接入与技术授权扩大复用。FAITH已完成产品化，存量设备智能化取得部分付费验证，下一阶段重点是形成经常性收入。</p>\n  <p>&nbsp;</p>\n  <h2><strong>从理解人体，到理解设备与世界</strong></h2>\n  <p>广州美央创新科技有限公司正推进以人体为入口的物理AI基础设施建设。公司与华南理工大学成立物理AI联合实验室，围绕机器遗忘、边缘智能与隐私保护开展研究，汇聚陈俊龙、王迎军、Andreas Mandelis等院士的跨学科科研力量。美央以FAITH多模态感知和“女娲”人体真实世界模型，衔接智能决策、具身执行与结果反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_8b74448d34134c7fb47c625a1390cdad@5284654_oswg318735oswg650oswg414_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图3</p>\n  <p>&nbsp;</p>\n  <p>这也指向美央的长期志向：建立国之重器真实世界模型基础底座。从理解一个真实的人，到理解一台持续运行的设备，美央积累的始终是同一种能力：让机器的判断有现实依据，让物理行动有结果可验。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-10-09T02:22:54+00:00", "fetched_at": "2026-10-09T04:17:29.977357+00:00", "fingerprint": "7fd5c378fb6cafce"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨航天老兵创业做高分辨率遥感相机，连续完成多轮次近亿元融资", "url": "https://36kr.com/p/4018036253626502?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2300字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，北京重眸科技有限公司（以下简称“重眸科技”）近日宣布完成多轮次近亿元融资，由民银国际、亦庄种子基金、远翼投资联合投资，资金将用于0.5米分辨率遥感相机批量投产、标准化产能建设以及更高分辨率遥感相机产品研发。</p>\n  <p>重眸科技成立于2024年，是国内商业航天领域首家专注0.5米及优于0.5米分辨率光学遥感相机的高新技术企业。公司能够提供星载一体化设计、高品质遥感相机研发和制造等一揽子解决方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_e5e066c7fac0494989b4f90889d475bb@5920579_oswg845583oswg1080oswg619_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>公司创始人马波曾任职于航天东方红、中国卫星，参与主持了多个国家级重点航天项目。团队核心成员均来自航天“国家队”及头部商业航天企业，平均从业年限超过15年，具备0.5米及优于0.5米分辨率相机从设计、装调、测试到规模化交付的全流程工程化经验。</p>\n  <p>目前，卫星遥感正从传统的专业领域应用逐步走向更广泛的商业与大众市场，全球遥感产业进入加速发展阶段。根据公开行业统计数据，截至2025年4月，国内已公开规划建设的遥感星座中有75个光学遥感星座，涉及光学卫星数量超万颗。大规模星座组网浪潮之下，市场对0.5米高品质光学遥感载荷需求快速释放，但能够兼顾高性能、可工程落地、且具备批量交付能力的商业相机供给还存在显著缺口。</p>\n  <p>面向遥感定量化应用的长远发展需求，重眸科技致力于提供更具“质价比”的高分相机产品及系统化解决方案，解决光学遥感相机产能不足、成本居高不下的难题。</p>\n  <p>0.5米及优于0.5米分辨率的遥感相机研制技术门槛高，高度依赖工程化研制经验。重眸科技技术团队覆盖高分相机研制全链条，且此前已累计近30台0.5米及优于0.5米分辨率相机的研制经验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_ffbfe60124d84ea1818741b996de242d@5920579_oswg474261oswg733oswg516_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>0.5米分辨率相机对应的光学系统尺寸通常已进入“大口径”范畴，对结构件的加工精度与结构稳定性提出了极高要求。重眸科技目前已突破1000mm口径主反射镜的研制技术，可实现优于0.015个波长的面型精度，从而保障稳定的在轨成像质量。同时，公司在光学系统的轻量化和热控设计及刚度耦合设计方面建立了精细化能力，使相机在轨运行过程中，即便处于复杂的力学与温度变化环境中，仍能保持光轴稳定。</p>\n  <p>围绕上述核心技术，重眸科技目前已在多个关键工程环节打通从设计、器件加工到整机装调、测试的完整能力链条，掌握关键技术Know-how。</p>\n  <p>产品策略上，重眸科技采取“1+X”模式，即标准化型谱产品与定制化产品协同发展。当前，公司已规划多款标准化产品，包括500公里轨道0.5米分辨率、12公里幅宽的五谱段与九谱段型号，以及150公里幅宽九谱段产品，同时布局面向未来的优于0.5米分辨率产品。这些标准化型号可实现快速交付，并在此基础上根据不同应用场景进行模块化定制。产品面向商业卫星总体、行业星座运营商、垂直终端应用领域等，覆盖生态监测、农业估产、防灾减灾等定量遥感应用场景，适配商业星座规模化组网需求。</p>\n  <p>交付进展方面，公司今年将完成3米分辨率、0.5米分辨率、态势感知相机等多台相机的研制，计划四季度陆续交付客户。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261009/v2_36f89cab45d540e28b193707a5062930@5920579_oswg1023010oswg1080oswg673_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>今年年初，重眸科技在亦庄完成产线建设，目前已正式投入运营并具备批量生产能力。首批产品正在产线进行装调。据了解，该产线年产能可达10至15台0.5米级高分辨率相机，并有望于明年实现规模化交付。</p>\n  <p><strong>以下为创始人交流节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：怎么理解高分辨率光学载荷研制领域中系统化工程经验的壁垒或者稀缺性？</strong></p>\n  <p><strong>马波：</strong>光学载荷不是简单的器件拼接，而是一套复杂的系统工程。纸面设计方案好看只是第一步，从图纸落地为上天可用的产品，要串联起设计、加工、装调、测试，还要考虑发射冲击、太空温变、震颤等各类在轨工况。单一环节能力强远远不够，需要整套链路的经验沉淀。</p>\n  <p>这类经验要靠大量项目的实践积累，很难单纯依靠理论和仿真完全覆盖。尤其是装调环节，镜头设计的再好，装不出来等于零。如果说装配是体力活的上限，那么装调是手艺活的天花板。零部件即便单项全部合格，公差会不断累积，最终影响整机成像质量。装配是把零件组装到位，装调则要边装配、边检测、边校正，通过定心、修圈等手段，抵消各类误差，把纸面设计真正变为性能达标的实物产品。</p>\n  <p>从样机生产到可批量交付的产品能力，这中间需要全链条工程经验的沉淀。重眸科技积累了从图纸设计、精密装调、整机测试到规模化交付的工程经验。团队里设计师懂装调、装调师懂设计，能够把用户实际应用需求翻译成清晰的设计指标，最终落地制造出高分辨率智能相机。这种跨环节打通的系统化工程能力，恰恰是当前商业航天光学载荷领域比较稀缺的。</p>\n  <p><strong>硬氪：“定量遥感”和“定性遥感”的区别是什么，为什么“定量遥感”的需求会成为高分商业遥感载荷的发展机遇？</strong></p>\n  <p><strong>马波：</strong>简单来讲，传统定性遥感更多是“看清是什么”，比如识别地物轮廓、辨别目标类型；而定量遥感是要“算出是多少”，可以从影像里提取出温度、植被长势、水体参数等可量化的数据。</p>\n  <p>它把卫星影像从一张“照片”变成可分析计算的数据源，价值会被成倍放大。不管是农业估产、生态环境评估、灾害损失评估，还是自然资源精细化管理，都离不开定量遥感的数据支撑。随着各行各业数字化转型提速，市场不再只满足“看得见”，更需要“算得准”，这也正是高分商业遥感载荷巨大的发展机遇。</p>\n  <p><strong>硬氪：采用标准化型谱产品与定制化产品协同的策略是出于怎样的考虑？</strong></p>\n  <p><strong>马波：</strong>对商业航天来说，标准化意味着更低成本和更高交付效率。通过型谱化产品，可以减少重复研发，提高供应链复用率，也能更快满足客户需求。但不同行业、不同应用场景对遥感相机的需求差异明显，比如轨道高度、幅宽、谱段配置、分辨率等都会不同。因此，我们会在标准化产品基础上，结合垂直行业客户的具体需求，做针对性配置调整和模块化定制。</p>", "category": "tech", "published_at": "2026-10-09T02:41:09+00:00", "fetched_at": "2026-10-09T04:17:29.977345+00:00", "fingerprint": "be70e7c25f770c7a"}, {"source": "少数派", "title": "扔掉的是杂念，掌控的是生活：我的断舍离实践经验", "url": "https://sspai.com/post/115209", "summary": "断舍离从来不是为了追求极致的空旷，而是为了在混乱的生活里，重新夺回对空间的掌控权。<a href=\"https://sspai.com/post/115209\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-08T06:42:14+00:00", "fetched_at": "2026-10-09T04:17:28.019222+00:00", "fingerprint": "273d4a47b764d4f1"}, {"source": "少数派", "title": "从开源清理工具到付费 Mac 应用，用户教会了我如何做产品：Mole", "url": "https://sspai.com/post/113843", "summary": "最近我写了不少关于独立开发的思考，想着要汇总一下，就把Mole从开源CLI做到Mac付费软件这一路聊一聊：我当时是怎么想的，哪些事情做下来真的有用，也许能给正在做自己作品的朋友一些输入。去年国庆我在三 ...<a href=\"https://sspai.com/post/113843\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-08T08:10:51+00:00", "fetched_at": "2026-10-09T04:17:28.019217+00:00", "fingerprint": "e153334db2d905dc"}, {"source": "少数派", "title": "iPhone Duo：苹果，终究还是对强迫症下手了", "url": "https://sspai.com/post/115282", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/115282\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-08T09:28:11+00:00", "fetched_at": "2026-10-09T04:17:28.019212+00:00", "fingerprint": "358bd2f15053262e"}, {"source": "少数派", "title": "派早报：英伟达 RTX Spark 新品一览、Anthropic 发布 Claude Haiku 5.5 模型等", "url": "https://sspai.com/post/115532", "summary": "XMG 发布 PRO 18 系列笔记本、OpenAI 宣布在 ChatGPT 上线 GPT-6 模型<a href=\"https://sspai.com/post/115532\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-09T00:51:10+00:00", "fetched_at": "2026-10-09T04:17:28 08T04:12:10.397354+00:00", "fingerprint": "3d4fe48f52fe06bb"}, {"source": "The Verge", "title": "BMW’s iX4 SUV is a 428-mile defensive weapon against China’s EV takeover", "url": "https://www.theverge.com/transportation/1006837/bmw-ix4-ev-range-price-specs-tesla-china", "summary": "While much of the automotive world sits dumbfounded as China gobbles up all its customers, BMW continues to roll out extremely well-crafted, technologically advanced electric vehicles that impress in both drive quality and price. The latest is the BMW iX4, a coupe-shaped SUV that puts a sportier spin on the automaker's iX3. The iX4 is [&#8230;]", "category": "tech", "published_at": "2026-10-07T22:01:00+00:00", "fetched_at": "2026-10-08T04:12:10.397345+00:00", "fingerprint": "07f028a05d607400"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨中国航协回应东航空姐跪地道歉事件；DeepSeek新一轮融资逼近1000亿；安踏集团正式成为彪马最大股东", "url": "https://36kr.com/p/4016467711316101?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>SpaceXAI官宣更名SpaceXSI</li>\n   <li>OpenAI将在欧盟为ChatGPT和Codex文本输出添加隐形水印</li>\n   <li>2026年诺贝尔化学奖、物理学奖揭晓</li>\n   <li>7-11便利店退出印度</li>\n   <li>苹果一号电脑或拍出80万美元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>中国航协回应东航空姐跪地道歉事件</strong></p>\n  <p>10月7日，中国航协发文回应“东航空姐跪地道歉”事件。中国航协称，东航航班客舱服务中，餐车偶发触碰旅客，当班乘务员、乘务长多次致歉并开展服务补救后，该旅客仍对乘务员进行言语攻击与威胁。目前，东航已完成证据固定并正式报案。中国航协表示，乘务员人格尊严和履职权益受法律保护，旅客辱骂、恐吓工作人员已超出正常维权边界，涉嫌违反民用航空法和治安管理处罚法，并呼吁旅客文明乘机、理性维权。（澎湃新闻）</p>\n  <p><strong>DeepSeek新一轮融资逼近1000亿</strong></p>\n  <p>10月6日，据媒体报道，杭州深度求索人工智能基础技术研究有限公司（以下简称“DeepSeek”）已接近锁定最新一轮至少800亿元人民币融资，最终规模按已签署条款清单可逼近1000亿元，远超公司最初约500亿元募资目标。此前有报道称，DeepSeek本轮目标估值约5000亿元人民币，但未言明投前或投后估值。本轮融资规模或近千亿元，意味着DeepSeek实际估值水平并未较此前完成的首轮有明显提升。消息指出，以上融资程序接近收官，宁德时代与腾讯控股或成为承诺出资金额最高的投资方，且所筹资金将为公司IPO铺路。（21世纪经济报道）</p>\n  <p><strong>安踏集团完成收购彪马29.06%股权，正式成为最大股东</strong></p>\n  <p>36氪获悉，10月7日，安踏体育用品有限公司宣布，已完成以15.055亿欧元现金对价向Pinault家族的投资公司Artémis SAS收购全球标志性运动品牌彪马（PUMA）所属公司PUMA SE 29.06%股权的交易，并已获得所有相关监管机构批准及满足惯例交割条件，安踏集团正式成为彪马的第一大股东。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI面向全球所有ChatGPT用户全面上线GPT-6</strong></p>\n  <p>OpenAI面向全球所有ChatGPT免费及付费用户全面上线GPT-6，正式取代GPT-5.6 SOL与GPT-5.6 LUNA。GPT-6集成Astra安全技术改进，强化针对网络、生物与暴力领域滥用的防护。（财联社）</p>\n  <p><strong>马斯克率先为AI改名，SpaceXAI官宣更名SpaceXSI</strong></p>\n  <p>10月4日，马斯克在社交平台X上正式确认，旗下人工智能业务SpaceXAI将更名为SpaceXSI。他在回复网友提问时直接表态：“是的，我们会做出这个改变”，并补充称“不再叫AI，叫SI，这样更好”。随后，马斯克还发文宣称“SpaceX是一家超级智能公司”。这意味着，SpaceXAI在短短数月内将迎来第二次品牌更名。今年2月，马斯克旗下的航天公司SpaceX以全股票方式收购了他创立的人工智能公司xAI，Grok大模型和社交平台X也随之并入SpaceX体系。7月，xAI正式完成品牌重组，更名为SpaceXAI，同步更换了标识和X平台用户名。（新浪财经）</p>\n  <p><strong>谷歌AI图像模型Nano Banana 2.1发布，提升视觉设计、蒙版编辑、主体一致性</strong></p>\n  <p>IT之家10月7日消息，谷歌于今日正式发布了Nano Banana 2.1，这是该公司AI图像生成与编辑模型的升级版本。谷歌强调，新版Nano Banana 2.1实现了全方位提升，在视觉设计、基于蒙版的图像编辑以及主体一致性这几方面的进步尤为突出。改进后的主体一致性对于Gemini用户而言实用性很强，可以保证同一个人物或者物体在多次生成结果当中保持样貌统一。谷歌Nano Banana 2.1现已逐步部署上线，覆盖Gemini应用、谷歌搜索的AI模式、Google AI Studio、Google Flow、Stitch、谷歌广告以及Gemini企业平台。（IT之家）</p>\n  <p><strong>OpenAI将在欧盟为ChatGPT和Codex文本输出添加隐形水印</strong></p>\n  <p>IT之家10月5日消息，OpenAI今日宣布，为配合《欧盟人工智能法案》的内容透明要求，未来几周将在欧盟地区符合条件的ChatGPT和Codex文本输出中加入机器可识别的隐形水印。据介绍，文本水印技术名为textGrain（文本粒水印），会在模型选词过程中嵌入不可见的统计信号。检测器通过识别该信号，判断一段文本是否带有OpenAI水印。据了解，OpenAI下一步将在欧盟推广文本水印。未来几周，团队将仅在欧盟所有计划中向符合条件的ChatGPT和Codex用户引入文本水印功能。值得一提的是，OpenAI不会在发布时将文本水印设为全球默认。（IT之家）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>星巴克回应“无糖饮料”含糖</strong></p>\n  <p>10月6日，据中新经纬消息，近日有消费者在美国西雅图地区发起诉讼，指控星巴克八款蛋白饮料虽标注“无糖（Sugar-Free）”，但实际上含有不同量的糖，涉嫌虚假宣传。界面新闻查询星巴克美国官网看到，一款16盎司的冰无糖香草蛋白拿铁，营养表中明确标注含糖量为9克；同规格热款无糖香草蛋白抹茶，总糖含量达到16克，更大杯型20盎司版本总糖甚至达到20克。产品配料表写有牛奶以及乳清分离蛋白（来源于牛奶）。对此，星巴克方面表示，饮料中的糖分来自牛奶，产品本身没有加糖，使用了无糖糖浆调味。星巴克发言人则称，“公司一直持续、清晰地在产品公告、菜单、营销材料、官网和APP中，提供其蛋白质饮料、无糖选项、定制选择和营养成分的有关产品信息，我们打算坚决辩护。”</p>\n  <p><strong>2026年诺贝尔化学奖揭晓，2名科学家获奖</strong></p>\n  <p>当地时间10月7日，瑞典皇家科学院决定将2026年诺贝尔化学奖授予2名科学家。奖项授予亨利·卡根（Henri Kagan）和硤合宪三（Kenso Soai），以表彰他们在不对称有机合成中的非线性效应和自催化方面的发现。获奖者将平分1200万瑞典克朗（约合802万元人民币）奖金。（中国基金报）</p>\n  <p><strong>苹果强制开发者适配iPhone Duo</strong></p>\n  <p>苹果首款折叠屏手机iPhone Duo将于10月23日正式发售，苹果出台相关强制适配规则，明确自2027年4月起，所有应用必须提供iPhone Duo适配专属截图，否则将无法更新上架。目前该要求尚处于过渡期，未完成适配的旧应用仍可正常运行，若到2027年4月后相关应用仍未补齐对应适配截图，将无法进行更新操作。（凤凰网科技）</p>\n  <p><strong>保时捷：计划员工规模削减25%，汽车业务净现金流利润率目标9%-12%</strong></p>\n  <p>保时捷在资本市场日发布会材料中表示，集团中期目标销售营业回报率为10%-15%，汽车业务净现金流利润率目标9%-12%。长期目标为集团销售营业回报率15%，汽车业务净现金流利润率12%。集团中期营收目标区间410亿欧元至450亿欧元，现金生成能力预计实现超比例增长。公司计划通过精益运营与成本削减，将盈亏平衡点降至20万辆以下。公司中期管理层岗位裁减40%。员工规模削减25%，战略目标为裁减30%。（新浪财经）</p>\n  <p><strong>苹果一号电脑或拍出80万美元</strong></p>\n  <p>一台罕见的苹果一号电脑正在邦瀚斯拍卖行进行线上拍卖，开放竞价日期为本月（10月）4日至14日，估价为50万美元至80万美元。据拍卖行介绍，这台电脑由原主人于1976年购入，主板上有苹果联合创始人沃兹尼亚克的签名。苹果一号电脑是苹果公司的首款电脑产品，以组装好的电路板形式出售，当时售价666美元，目前确认存世的不足75台。（央视财经）</p>\n  <p><strong>美联储10月维持利率不变的概率为80.6%</strong></p>\n  <p>据CME“美联储观察”：美联储到10月维持利率不变的概率为80.6%，累计加息25个基点的概率为19.4%。美联储到12月维持利率不变的概率为21.7%，累计加息25个基点的概率64.1%，累计加息50个基点的概率为14.2%。（财联社）</p>\n  <p><strong>国际能源署成员国同意加快释放1亿桶石油储备</strong></p>\n  <p>当地时间7日，国际能源署（IEA）发表声明说，其成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投放市场，预计还可释放约1亿桶石油。声明还说，针对当前柴油市场供应紧张的情况，其成员国同意在条件允许的情况下优先投放柴油。（央视新闻）</p>\n  <p><strong>美股三大指数收盘集体下跌，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，10月8日收盘，美股三大指数集体下跌，道指跌0.66%，纳指跌0.22%，标普500指数跌0.22%。大型科技股涨跌不一，奈飞、亚马逊涨超1%，苹果、谷歌、英特尔、微软小幅上涨；SK海力士、Meta跌超2%，特斯拉、英伟达小幅下跌。热门中概股涨跌互现，京东涨2%，蔚来、网易涨超1%，理想汽车、小鹏集团小幅上涨；富途控股跌超3%，阿里巴巴、百度跌超2%，老虎证券跌超1%。</p>\n  <p><strong>印度央行近四年来首次加息，暗示可能进一步收紧货币政策</strong></p>\n  <p>印度央行近四年来首次加息，随着通货膨胀加剧和货币贬值，印度央行也和亚洲其他央行一道收紧货币政策。印度央行货币政策委员会一致投票决定提高基准利率25个基点至5.5%，符合彭博调查所得大多数经济学家的预测。这是自Sanjay Malhotra于2024年12月出任行长以来首次加息。印度央行将货币政策立场从“中性”调整为“校准式收紧”，释放出未来可能进一步加息的信号。（新浪财经）</p>\n  <p><strong>7-11便利店退出印度</strong></p>\n  <p>据新华社报道，日本零售业巨头7&amp;I控股公司6日发布声明说，其旗下连锁便利店品牌7-11位于印度的所有门店均已关闭。法新社援引7&amp;I控股公司发言人消息报道，获得相关特许经营权后，信实零售公司2021年10月在孟买开设了印度的首家7-11便利店，发展最好的时候在印度共开店约60家。声明中，7&amp;I控股公司未说明7-11便利店退出印度的原因。但据《读卖新闻》等日本媒体报道，7-11便利店遭遇了来自印度本土零售商的激烈竞争。（新华社）</p>\n  <p><strong>2026年诺贝尔物理学奖揭晓</strong></p>\n  <p>当地时间10月6日，瑞典皇家科学院决定将2026年诺贝尔物理学奖授予弗朗西斯·哈尔岑，以表彰他对冰立方中微子天文台的决定性贡献以及对天体物理来源高能中微子的发现。（央视新闻）</p>\n  <p><strong>2026国庆档总票房破11亿</strong></p>\n  <p>36氪获悉，据灯塔专业版消息，2026年国庆档（10月1日—10月7日）档期总票房突破11亿，《神探之痕迹》《什么意思夫妇》《生化危机：爆发夜》《欢迎来龙餐馆》《小猪佩奇·完美假期》位列档期票房前五。</p>\n  <p><strong>派拉蒙天舞完成对华纳兄弟收购</strong></p>\n  <p>经过数月的竞购角逐以及法律拉锯战，派拉蒙天舞公司10月6日宣布完成对华纳兄弟探索公司价值约1100亿美元的收购，打造出一家横跨好莱坞和新闻行业的全新超级传媒集团。这是美国传媒行业历史上规模最大的并购交易之一。（新华社）</p>\n  <p><strong>中国央行连续第23个月增持黄金</strong></p>\n  <p>中国9月末黄金储备报7747万盎司（约2409.59吨），环比增加74万盎司（约23.02吨），8月末黄金储备报7673万盎司（约2386.57吨）。中国央行已连续第23个月增持黄金。（财联社）</p>\n  <p><strong>三星电机计划斥资近50亿美元在韩国和越南扩产半导体基板</strong></p>\n  <p>据报道，三星电机计划到2028年在韩国和越南投资近50亿美元，用于半导体基板生产，进一步提升越南在人工智能服务器和高性能计算关键零部件生产中的地位。其中一项投资规模为4.27万亿韩元（32亿美元），用于韩国世宗工厂，是公司迄今针对单一产品进行的最大规模投资；另一项投资规模为2.51万亿韩元（18.7亿美元），用于越南子公司。该公司曾于2022年宣布将在越南北部太原省测试FC-BGA基板。如今该设施的扩建表明试生产结果符合预期，公司已准备好进入大规模量产阶段。（财联社）</p>\n  <p><strong>国内航线燃油附加费将上涨</strong></p>\n  <p>10月6日消息，根据航班管家DAST，航司最新通知，自10月10日起，国内航线燃油附加费将上调：800公里以上航段收取90元，比8月、9月涨20元；800公里以下收取50元，比8月、9月涨10元。（第一财经）</p>\n  <p><strong>全球纯燃油车新车销量占比首次跌破50%，上半年纯汽油车占比降至49%</strong></p>\n  <p>据财联社报道，Mobility Global最新数据显示，2026年上半年，纯汽油车型占全球新车销量的49%，这是历史上纯汽油车销量占比首次跌破五成，且较2021年的73%大幅下降了24%。数据还显示，今年上半年，整体汽车市场规模收缩约5%，而纯汽油车销量的下滑幅度达到了大盘的两倍。业内人士将市场加速转变归因于油价。即受中东冲突影响，燃油价格大幅飙升，消费者开始寻求用车成本更低的车型。（财联社）</p>\n  <p><strong>SpaceX据悉拟融资400亿美元用于购买英伟达芯片</strong></p>\n  <p>媒体援引知情人士报道称，马斯克旗下的SpaceX正寻求融资400亿美元，用于购买英伟达芯片，凸显人工智能（AI）算力需求依然强劲。该报道称，SpaceX寻求约100亿美元银行贷款并计划发行300亿美元投资级债券，为芯片采购融资。阿波罗全球管理预计将牵头这笔交易，并协助向投资者出售SpaceX债券。交易预计于2027年完成。（新浪财经）</p>\n  <p><strong>俄罗斯辟谣肺鼠疫传言</strong></p>\n  <p>据环球时报援引法新社等媒体6日报道，在有报道称俄罗斯伊尔库茨克地区一名实验室技术人员疑似感染肺鼠疫身亡后，俄罗斯方面否认正在实施针对肺鼠疫的防疫措施，并就社交媒体上的传言做出澄清。据了解，近日俄罗斯当地媒体报道称，这名死者可能因试管破裂而感染了肺鼠疫，200名可能与她有过接触的人员已被隔离。伊尔库茨克州州长科布泽夫表示，俄罗斯消费者权益保护和公益监督局的检查发现，该女子死于肺炎，但具体病因“未确定”。（环球时报）</p>\n  <p><strong>恒生科技指数将把成分股扩充至50只</strong></p>\n  <p>恒生指数公司宣布恒生科技指数咨询结果，将对恒生科技指数进行六项改革，并将于12月实施。第一，取消合资格候选公司必须属于恒生行业分类系统五个指定行业的要求。第二，整合及拓展现有主题，并新增前沿科技主题。修订后的六大科技主题为：数码平台及解决方案；人工智能；先进硬件；机器人及自动化；云端；前沿科技。第三，将科技子主题由16个增至24个，以配合上述六大科技主题的修订。第四，引入分组选股机制，将选股范畴由主板上市公司修订至恒生综合大中型股指数成份股。第五，采用双组别选股机制，分别以市值排名及收入增长排名作为选股准则。非现有成份股另须符合过去三个月日均成交额最少一亿港元的要求；按收入增长排名入选的成份股，则须于最近连续两个财政年度均录得最少五亿港元的年收入。第六，将成份股数目由30只增加至50只，其中按市值排名选取首40只，余下10只则按过去十二���月的收入增长排名选取。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>快手可灵AI计划最早明年赴港上市，至少融资10亿美元</strong></p>\n  <p>据了解，快手旗下视频生成大模型可灵AI计划最早明年赴港上市，至少融资10亿美元。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>月之暗面据悉完成IPO前融资，最新估值约500亿美元</strong></p>\n  <p>据知情人士透露，月之暗面已经完成最后一轮私募融资，估值约500亿美元，并正推进明年第一季度在香港进行首次公开募股（IPO）。（新浪财经）</p>\n  <p><strong>多家阿联酋基金以及贝莱德据悉商谈参与OpenAI最新一轮300亿美元融资</strong></p>\n  <p>知情人士称，包括MGX在内的多家阿联酋投资基金正在与OpenAI洽谈，可能参与这家人工智能巨头最新一轮300亿美元融资。其中一位知情人士表示，这些基金将组成一个财团参与OpenAI这轮融资。另一位人士称，这些阿联酋基金讨论的合计投资金额最高达到100亿美元。知情人士表示，贝莱德也在商谈参与这轮融资。融资仍在进行中，具体条款可能发生变化。因涉及未公开信息，这些知情人士要求匿名。（智通财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果与LG联合开发门铃门锁等</strong></p>\n  <p>据报道，苹果公司即将进军智能家居设备领域，新品将包括与LG电子联合开发的门铃、温控器以及其他配件。这些产品将纳入一个设备生态系统，该系统不仅支持苹果的新款智能家居中枢，还可以搭配升级后的HomePod mini和全新的电视机顶盒使用。报道称，与LG电子联合开发的产品还包括智能门锁、室内安防摄像头、室外安防摄像头以及泛光灯摄像头，产品将使用LG品牌对外发售。（财联社）</p>\n  <p class=\"editor-note\"><strong>整理丨</strong>昌怡</p>", "category": "tech", "published_at": "2026-10-08T00:04:11+00:00", "fetched_at": "2026-10-08T04:12:10.220396+00:00", "fingerprint": "f5e9ff96110f1c5a"}, {"source": "36氪 - 最新文章", "title": "深创投、元禾原点押注一家水下机器人，9个月内已完成5轮融资丨36氪首发", "url": "https://36kr.com/p/4016617284014210?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_6bbddb851b8e4b2aac0302863ab4c161@6221844_oswg2657809oswg1683oswg935_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2900</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，海洋具身智能公司卫澜深海在9个月内已完成5轮融资，轮次推进至天使++++轮，核心股东包括深创投、元禾原点、国策资本等机构，老股东英诺天使持续加注。资金主要用于训练水下具身智能模型，建设水下具身智能训练中心，以及深化机器人在海洋油气能源场景下的应用。卫澜深海想做的事情，可以用一句话概括：用机器人拓展人类的海洋能力边界，代替昂贵且危险的水下人工作业。</p>\n  <p>创始人张大禹98年出生，西安交通大学博士、助理教授，拥有12年水下无人系统研发经验，高中起申请发明专利30余项，发表顶刊论文10余篇，主持2项国家级项目。卫澜深海已经组建了覆盖具身智能研发、工业部门国家队、水下能源行业市场的全链条顶尖团队。卫澜深海CTO是出身中国船舶集团的总设计师，主持型号装备等十余项国家级重大科研项目，总经费超过20亿元。</p>\n  <p>卫澜深海聚焦海洋具身智能机器人领域，专注海洋具身智能平台技术研发以及水下机器人产业应用。公司已经构建由真实业务驱动的具身智能数据训练管线，通过“通用平台+模块化载荷”的方式实现水下泛化作业能力。目前公司已经为海洋业主客户交付海底能源设施全自主巡检作业服务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_14042a2ef0e341f5aa8e6c4cac33ed9e@6221844_oswg73297oswg813oswg338_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>海洋当中藏有3倍于陆上的巨量资源，但人类不是水生生物。即使经过数百万年的进化，海平面以下仍然是人难以触及的高危环境；即使通过复杂的水下作业保障体系，潜水员也只能形成极为有限的作业能力——人在水下待不住，也待不起。卫澜深海研发的「超级蛙人号」海洋具身智能机器人就是要突破人类在水下能力边界，在海平面以下完成自主作业，去挖掘数百年来人类尚未触及的海底宝藏。</p>\n  <p>在海洋环境中，一个具身智能机器人的价值不仅仅是代替了一个劳动力，而是代替了整个水下作业保障体系。深度超过120米的饱和潜水作业需要一艘专业的饱和潜水支持船和数十名保障人员，报价超过100万元/天。人工水下作业保障体系的巨大成本是海洋具身智能的收益率。另外，在海洋环境中具身智能机器人硬件条件更容易超越人。即使对标���英潜水员，机器人的下潜深度是潜水员的5倍以上，机器人的作业范围是潜水员的千倍以上，可达到200公里。因此，水下作业极有可能是具身智能首个大规模代替人类的场景。</p>\n  <p>海洋环境与陆地环境有巨大差别，研发在海洋可随时调用的具身智能机器人需解决三方面问题。第1个是水下感知问题。因为水和空气是不同的介质，可见光在水下的衰减频率远高于陆地上，简言之，水下难以看清10米之外的物体。第2个是可靠性问题。水下作业场景对任务成功率和可靠性指标要求严苛，水下的作业对象是昂贵的海底基建，如果机器人不能有效应对corner case，将面临停产等重大损失。第3个是能源问题。水下作业区域距离岸上电网极远，且需覆盖的水下作业区域跨度极大。</p>\n  <p>为了解决以上三大问题，卫澜深海研发了「超级蛙人号」海洋具身智能机器人，其中“水下机器人通用平台”负责远程投送和水下灵巧作业，“海底星链基座”作为水下能源通讯载体。“水下机器人通用平台”的声光磁跨尺度感知融合方案把声学、光学和磁场信息融合，使机器人获得超人类的水下感知能力，机器人可以像海豚一样直接处理声呐信息。“海底星链基座”突破了深海超低流速启动问题和叶轮偏航问题，可在全海域全海底地形实现快速部署，为水下机器人平台提供能源和通讯支持。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_22b1a5c9b46743e7be7566e96263670e@6221844_oswg165627oswg1080oswg697_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>硬氪了解到，“水下机器人通用平台”的水下定位精度误差不超过1米、准确率达95%以上，双6自由度机械臂负载10公斤以上，续航48小时，最大航速12节，具备3节全向抗流能力，可以在恶劣的海况下完成精细水下作业。“海底星链基座”的能量捕获面积可达10平方米，是机器人投影面积的数十倍，可以达到动力电池级别的水下供电能力。作为对比，波音公司发布的“Lamprey”水下智能机器人的捕能面积仅能达到机器人投影面积的50%，难以提供千瓦级的水下供电能力。对比诺斯罗普·格鲁曼公司的温差能方案以及Pliant Energy Systems的介电体捕能方案，卫澜深海在水下供电能力和系统可靠性方面处于国际领先地位。</p>\n  <p>经过十余年的技术积累，卫澜深海目前已经交付了第四代“超级蛙人号”海洋具身智能机器人，为海洋业主客户完成了海底能源设施全自主巡检作业项目。</p>\n  <p>“目前用机器人代替水下作业是行业共识，但技术路线还没有收敛。”张大禹说。卫澜深海强调“错位合作”——卫澜深海第一步先在海洋业主客户的存量海底基建中打通垂向应用场景，再随海洋产业的增量市场做泛化水下作业。</p>\n  <p>在完全实现水下作业无人化方面，他给了一条类似L2到L3自动驾驶的路线：先基于仿真器数据训练一个基础作业模型，将搭载了预训练模型的机器人嵌入现有水下基建维保流程中，让机器人处于人可实时干预修正的条件下完成自主作业，在部署阶段不断收集作业数据和人类的反馈数据，这些数据用于不断训练作业模型，逐渐从人在环路过渡到全自主无人干预的水下作业。</p>\n  <p><strong>以下为硬氪与公司创始人张大禹的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：卫澜深海的商业化路径是怎样的？&nbsp;</strong></p>\n  <p><strong>张大禹：</strong>水下作业市场，客户最关心的是你能不能把水下作业需求干完、干好，而不是你的模型参数和泛化能力。因此，我们商业模式分三步：做示范性项目、卖标准化服务能力、卖机器人。</p>\n  <p>我们第一步不是卖整机，而是用标准化服务能力绑定大客户。先完成2到3个强示范性服务案例，验证新模式的效率以及成本优势，进而推动大量的标准化服务，整合行业水下作业标准，搭建水下无人作业体系，最后，退回到整机供应商，以“通用平台+模块化载荷”的方式在确保产品可靠性的同时，实现水下泛化作业能力。</p>\n  <p><strong>硬氪：水下感知是困扰行业几十年的难题，卫澜深海的解法是什么？</strong></p>\n  <p><strong>张大禹：</strong>水下感知最大的问题是数据缺失。岸上可以用互联网级别的数据训练VLA模型，水下几乎没有声光磁同步数据。所以我们开发了水下具身智能仿真器，具备声场、视觉和磁场的感知训练能力，可以在模拟不同水域的水下作业场景并生成大量数据，目标是把声学、视觉和磁场信息融合，让机器人像海豚一样直接处理声呐信息，而不是先看到一个声呐图像再去二次判别。这需要大量的数据和基模相关的工作，也是我们目前投入最多的方向。</p>\n  <p><strong>硬氪：公司目前阶段最大的挑战是什么？</strong></p>\n  <p><strong>张大禹：</strong>我们有两个核心问题需要解决。第一是水下数据问题，我们开发了水下具身智能仿真器并跑通了由真实业务驱动的数据管线。第二是极致的机器人可靠性。如果只做移动观测平台，可靠性可以满足；但要做物理交互，比如用机械手拧阀门，需要更强的可靠性以及对corner case的处置能力。水下环境中一旦机器人卡死，将造成严重的安全事故。我们今年要完成长时间无故障运行，这是最关键的挑战。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>深创投：</strong>海平面以下是全球最大的高危环境，也是迫切需要具身智能代替人类的场景。在这个领域需要强大的正向研发能力，才能克服海洋中的难题，进而开发人类未曾开发的宝藏。我很高兴看到卫澜深海团队在海洋具身智能领域的积累和进步，期待他们在建设海洋强国的路途上闯出一片天地。</p>\n  <p><strong>元禾原点：</strong>3.6亿平方公里的海洋孕育着无限机遇，在人难以触及的环境中去拓展人类能力边界，可以彻底开发巨量海洋资源。我很看好卫澜深海团队在水下能源供应和自主作业方面的技术积累，期待他们的水下作业解决方案可以改变行业，拉近人类和海洋的距离，在向海图强的国家战略中贡献自己的力量。</p>", "category": "tech", "published_at": "2026-10-08T02:35:03+00:00", "fetched_at": "2026-10-08T04:12:10.220385+00:00", "fingerprint": "847ea099c552de7e"}, {"source": "36氪 - 最新文章", "title": "硬氪首发丨AI眼镜企业天使轮融资数亿，已与线下数百家门店合作月发售数千台", "url": "https://36kr.com/p/4016645063217281?f=rss", "summary": "<p>硬氪获悉，智能眼镜品牌NIMO所属公司比特幻境近日完成数亿元人民币天使轮融资，最新估值达15亿元。本轮投资方包括博华资本、戈壁创投、元禾璞华，以及尚势资本等相关投资机构。融资资金将主要用于产品研发、渠道拓展及海外市场布局。</p>\n  <p>比特幻境成立于2025年7月，2026f年4月，NIMO将收首款产品推向市场。目前，NIMO月度销售规模已达数千台，正持续推进产品在LOHO线下门店的布局,并已与香港上市公司、拥有逾50年行业积累的国际眼镜制造商雅视光学(01120.HK)达成深度合作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_160356abc10c42ae89b193938461f236@6310669_oswg78086oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NIMO首款产品</p>\n  <p>如果把过去几年的智能眼镜看作一场功能竞赛，NIMO试图走的是另一条路——先把智能眼镜重新做成一副“愿意戴”的眼镜。这源于创始团队的观察：在资本持续关注智能眼镜的同时，现实生活中普通人仍然很难频繁看到身边有人佩戴智能眼镜。</p>\n  <p>联合创始人何迪龙判断，这个品类真正要跨过的门槛，并不只是显示、AI或芯片能力，而是能否让智能功能自然进入眼镜原本的形态、佩戴和消费逻辑。</p>\n  <p>在这一理念上，NIMO的定位为时尚科技眼镜品牌，团队给产品设定的前提并不是“在眼镜上增加多少智能功能”，而是首先让它成为一副具备日常佩戴属性的眼镜——外形、比例、材质、触感和佩戴舒适度，都需要回到传统眼镜的评价体系中。</p>\n  <p>这一判断也直接影响了NIMO对产品功能的取舍。相比把摄像头、音频、更多主控芯片等能力尽可能塞进镜框，NIMO在首款产品中主动砍掉了部分功能，把有限的重量和空间留给显示、结构和佩戴体验。</p>\n  <p>何迪龙提到，NIMO在调研了大量用户需求后发现，眼镜的佩戴舒适是用户选择购买智能眼镜的第一需求，拍照和扬声器极大的增加了产品体积，让用户产生了佩戴不适感，对极致的重量追求最终导致NIMO做出了功能取舍，“同时我们也在定制全新的摄像头和扬声器方案在未来给到用户更多的场景选择。”</p>\n  <p>这种“先做一副好眼镜”的产品定义，最终落到了光学、结构和材料等一系列技术选择上。</p>\n  <p>显示系统的起点，是一枚尺寸仅0.06英寸的MicroLED微显示芯片。据了解，该芯片属于全球最小尺寸的量产硅基微显示产品，功耗较同类芯片降低70%。微型化的显示核心，为光机与整机设计释放出更多空间；更低的显示能耗，则为产品在保持轻量化的同时实现更长续航提供支持。</p>\n  <p>围绕这枚微显示芯片，NIMO将自研超微型光机的体积压缩至0.03cc，即30立方毫米，并将投射影像的光学核心集成于镜腿前端的铰链区域，让复杂的显示能力隐入眼镜原本的轮廓。</p>\n  <p>与之配合的，是厚度0.6mm的体全息波导镜片。通过近乎隐形的光栅设计与精细的漏光控制，镜片在呈现信息的同时，保持通透自然的外观，减少显示时向外透出的绿光。</p>\n  <p>轻量化则是另一条贯穿产品设计的技术路径。NIMO目前产品重量约29克，何迪龙称，这是行业内首次实现显示类AI眼镜做到30g以内，镜框采用高分子复合碳纤维材质，结构中使用β钛合金铰链，并通过前端光机、镜腿尾部电池以及两侧元件的布局进行配重。</p>\n  <p>对智能眼镜而言，重量本身只是一个结果，更关键的是重量落在哪里、镜腿是否产生压迫，以及长时间佩戴后的实际感受。因此，NIMO并没有把“29克”单独作为产品卖点，而是把材料、结构、铰链和前后配重放在同一个系统里考虑。采访中团队也提到，传统眼镜的制造工艺，如抛光，电镀等后工艺同样被纳入产品开发，这背后的逻辑是让智能眼镜在电子产品之外，也具备传统眼镜对触感、表面和结构细节的要求。</p>\n  <p>在供应链上，NIMO采取的并不是简单采购标准件的方式，而是试图把上游供应链拉进共同研发。何迪龙表示，部分关键器件并没有现成的成熟方案，而是由NIMO提出产品需求和技术方案，再与供应商共同完成开发。例如0.03cc微型光机，就是围绕镜腿空间重新定义后的结果。</p>\n  <p>商业化层面，NIMO也选择了一条更接近传统眼镜行业的路径。谈及线下合作，何迪龙告诉硬氪，对于NIMO而言，线下门店并不只是增加一个销售入口，而是因为智能眼镜依然需要面对传统眼镜行业的验配、试戴、镜片更换、售后和用户教育等问题——如果产品的第一属性仍然是“眼镜”，那么它就需要进入用户原本购买眼镜的场景。</p>\n  <p>从更长期来看，NIMO希望智能逐渐成为眼镜自然拥有的一种能力，让用户仍然基于审美、佩戴需求和生活方式选择眼镜，同时获得显示和智能功能。“最终我们希望NIMO做的并不只是一个单一的智能眼镜产品，而是把眼镜本身、智能能力和未来的应用生态结合起来，让智能眼镜真正成为一个用户愿意长期佩戴的产品。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261008/v2_12a499929bf74c099e2dfa78de43a1e0@6310669_oswg82228oswg900oswg900_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NIMO首款产品</p>\n  <p><strong>以下是硬氪与NIMO联合创始人何迪龙的访谈节选：</strong></p>\n  <p><strong>硬氪：NIMO为什么要从“眼镜”本身出发做智能眼镜？你们对产品的核心判断是什么？</strong></p>\n  <p><strong>何迪龙：</strong>我认为智能眼镜首先还是一副眼镜。它不能只是把很多功能堆在眼镜上，而是要先解决眼镜本身的问题，包括好不好看、戴得舒不舒服，以及是不是适合亚洲人的脸型。</p>\n  <p>所以我们从一开始就比较强调“眼镜感”，希望用户戴上之后首先觉得它是一副正常、好看的眼镜，而不是一个电子设备。在这个基础上，我们再把智能能力放进去。</p>\n  <p>我们也会主动砍掉一些我们认为没有必要的功能，因为如果所有东西都往上加，最后可能会变成一个功能很多、但用户并不愿意长期佩戴的产品。对我们来说，智能眼镜真正能够普及的前提，还是用户愿意每天戴它。</p>\n  <p><strong>硬氪：在产品设计上，NIMO具体是怎么解决“智能”和“眼镜”之间的矛盾的？</strong></p>\n  <p><strong>何迪龙：</strong>我们其实花了很多精力在重量、材料、结构和佩戴体验上。</p>\n  <p>比如镜腿采用的是β钛材料，鼻托也做了适配亚洲人脸型的设计，同时使用碳纤维等材料去做轻量化。产品本身大概是29克，如果再加上定制镜片，根据度数和折射率不同，最终重量可能会到34到36克左右。</p>\n  <p>我们还保留了很多传统眼镜制造的工艺。比如镜腿抛光本身就需要几天时间，木纹颗粒的抛光甚至需要连续做两天两夜。我们希望它在拿掉电子属性之后，依然是一副做工比较完整的眼镜。</p>\n  <p>电池也是一个比较大的挑战。我们用了钢壳电池，目前实际使用中没有观察到明显发热的问题，充电15分钟可以到80%左右。显示部分则尽量做到隐形，透光率可以达到98%，让用户在正常状态下不会明显感觉到它是一块显示设备。</p>\n  <p><strong>硬氪：目前用户真正会怎么使用NIMO？你们为什么没有把功能做得特别复杂？</strong></p>\n  <p><strong>何迪龙：</strong>目前我们比较关注的其实是一些和用户日常生活直接相关的功能，比如股票、新闻、消息、地图、提词、翻译，以及自动亮度等。</p>\n  <p>我们希望这些功能能够自然地融入佩戴场景，而不是为了展示技术而增加功能。比如提词、翻译这些功能，本质上都是让信息直接出现在用户眼前，减少用户频繁拿手机的动作。</p>\n  <p>未来我们也会考虑开放SDK和开发者生态。我们认为，智能眼镜最终不一定只是我们自己去定义所有应用场景，开发者可以基于眼镜本身的能力去开发更多东西。我们现在更希望先把硬件、显示和基础能力做好，再逐步把生态打开。</p>\n  <p><strong>硬氪：从市场反馈来看，智能眼镜距离真正进入大众市场还有多远？NIMO目前在怎么推进这件事？</strong></p>\n  <p><strong>何迪龙：</strong>我们今年4月份开始正式出货，最开始大概有1000台左右的预订，之后每个月也有几千台的量级。现在我们的渠道主要包括抖音、京东，以及线下门店，目前大概有150家左右。我们比较重视线下，是因为智能眼镜和普通消费电子不太一样，用户很多时候需要真正戴上去、体验之后，才能理解它到底有什么价值。</p>\n  <p>但线下也会遇到一些问题，比如不同门店员工对产品的理解程度不一样，消费者对智能眼镜本身的认知也还在建立。所以我们会做线下培训，希望工作人员可以在比较短的时间内把产品的主要功能完整演示出来，让用户快速理解。</p>\n  <p>从这个角度来说，我们觉得智能眼镜的普及不仅是硬件问题，也需要用户教育和渠道一起成熟。</p>", "category": "tech", "published_at": "2026-10-08T03:03:19+00:00", "fetched_at": "2026-10-08T04:12:10.220372+00:00", "fingerprint": "0dcb44213ac56baa"}, {"source": "少数派", "title": "罗马：永恒之城，永恒于世", "url": "https://sspai.com/post/114845", "summary <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
