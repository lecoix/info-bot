  <p>该事件全网监测到传播篇次<strong>51条</strong>。重点监测平台中，<strong>微信公众号</strong>是事件的主要传播渠道。</p>\n  <p><strong>｜事件影响分析</strong></p>\n  <p><strong>交易流动性恢复影响（利好）：</strong>公司完成股票异常波动核查后正式复牌，恢复了股票的二级市场正常交易权限，解除了此前停牌带来的交易限制，保障了投资者的交易权利。</p>\n  <p><strong>监管核查风险解除影响（利好）：</strong>公司完成股票交易异常波动的核查工作，未发现存在违规事项，解除了此前因异常波动可能面临的监管风险</p>\n  <p><strong>高估值偏离基本面影响（利空）：</strong>公司披露自身相关指标严重偏离基本面，股票估值显著高于行业整体水平，存在估值回归的压力，对公司股价形成直接压制</p>\n  <p><strong>非理性炒作风险提示影响（利空）：</strong>公司明确提示股票可能存在市场情绪过热和非理性炒作情况，交易风险大，随时可能快速下跌，将抑制投机资金进场并引发部分投资者的抛售意愿</p>\n  <p><strong>公司经营基本面影响（中性）：</strong>本次公告仅涉及股票交易异常波动核查及复牌事项，未披露公司核心经营业务的相关变动，公司自身经营基本面未发生实质性改变</p>\n  <p><strong>短期来看，</strong>公司复牌后受高估值压力、非理性炒作风险提示等因素影响，市场情绪可能快速降温，叠加投机资金离场，股价大概率面临显著下行压力，存在快速下跌的可能。</p>\n  <p><strong>长期来看，</strong>本次事件仅围绕二级市场交易波动展开，未对公司核心经营基本面造成实质影响，公司长期股价表现仍将回归自身经营基本面，但当前过高的估值水平需要一定时间回归合理区间</p>\n  <p><strong>｜股价影响趋势分析</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_0928bffe5d3345e98d7e7989551e9064@5284654_oswg29830oswg492oswg279_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">股价影响图</p>\n  <p>&nbsp;</p>\n  <h3><strong>专业观点：短线资金仍保持较高关注</strong></h3>\n  <p><strong>·&nbsp;牛股启蒙（看多）：</strong></p>\n  <p>指数震荡在预期范围内无需过度关注，重点需关注。盘面情绪，妖股爱丽家居复牌出狱后被市场认为具。备上涨动能;结合今年市场针对异动个股的监管规律，主动压制异动的个股最终多出现腰斩走势，而主动突破异动被特停的个股复牌后未出现核按钮，多会继续补涨或调整横盘后走出二波趋势，爱丽家居代表股权线方向，后续或存在补涨或震荡后走出二波行情的可能。</p>\n  <p><strong>·&nbsp;逻辑寻龙&nbsp;（看多）：</strong></p>\n  <p>近期连板股整体行情表现向好，赚钱效应较为突出，连板梯队完整且持续向上拓展高度，市场短线交易氛围活跃，爱丽家居作为当前连板梯队的最高板标的，受到短线资金的重点关注，其后续短线走势或与当前连板行情的延续性高度绑定，具备较强的短线操作关注价值，整体短期发展趋势偏向积极。</p>\n  <p>&nbsp;</p>\n  <h3><strong>企业全情报的价值：帮助投资者提前发现值得关注的企业动态</strong></h3>\n  <p>股价上涨只是结果。</p>\n  <p>真正重要的是，在市场情绪形成之前，能否第一时间发现企业发生了什么，以及这些事件可能带来的影响。</p>\n  <p>帮助投资者从\"看到股价上涨\"，升级为\"提前发现值得关注的企业动态\"，更高效地筛选机会、跟踪企业变化，而不是等市场行情启动后再进行事后复盘。</p>\n  <p><strong>更多爱丽家居股价走势、舆情分析及专业观点，欢迎进入36氪企业全情报小程序查看。</strong></p>\n  <p>*数据来源：红麦聚信(北京)软件技术有限公司&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_69436e04e5304f93bdae42cf0c515118@5284654_oswg2504oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">END</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzkzNTc1NTg2OA==&amp;tempkey=MTM4Nl8zTXFONTFXMlVXNFhQVGNsQ1VncEdqS25xdXNlTFF0SEs5OVdvenphR29iSExuWm9xZzU4NndaUjBMZUsxaUZRNExJMm12c2VSSDFwTkNCQlhmdWpJSUZCQU5jcTNtdHVQeDFaYXRVdjZwVU53MzRNSmM5TXpTWDYzZmUxcHRtZU9xXzM3QjJ2dTRtWFlla3hlNV94MGVLUnUzVF9mOGkzelFWdW9Rfn4%3D&amp;chksm=c2abbb95f5dc328375e85edce3390a7def7751dcc5311a2f50f837f5a960035134b6e2c0bf29&amp;token=644557827&amp;lang=zh_CN#rd\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪企业舆情报告”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-06T08:35:47+00:00", "fetched_at": "2026-08-07T02:26:31.779266+00:00", "fingerprint": "33df22b0bc58ddb1"}, {"source": "36氪 - 最新文章", "title": "Nothing发布首款耳夹耳机Clip Pro，549元的价格能搅动市场吗？丨最前线", "url": "https://36kr.com/p/3927801692862848?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_37155d4d50c345438f84bcc4599c4174@6221844_oswg1414760oswg1006oswg1162_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>耳夹耳机赛道迎来了一位新玩家。</p>\n  <p>8月4日晚上，消费科技品牌Nothing旗下的子品牌——CMF by Nothing带着它的首款耳夹耳机Clip Pro进入战场，定价549元。</p>\n  <p>CMF成立仅三年，已凭借其标志性的设计语言在全球60多个国家和地区售出数百万台产品。此次发布的Clip Pro，被市场看作其补全开放式耳机版图的关键落子。</p>\n  <p>从行业整体来看，耳夹耳机的核心痛点始终是佩戴舒适度与音质的平衡。这次新品，CMF的选择是回归声学与人体工学的本质。</p>\n  <p>佩戴层面，Clip Pro没有沿用市面上常见的固定弧度夹持方案，而是通过OpenFit Arc设计对耳夹形态进行精细化重构。</p>\n  <p>一个30mm长的C-桥结构将受力分散至三个触点，内部嵌入的0.5mm钛合金丝则让C-桥拥有了40°至53.5°的弹性开角。这意味着它能自适应不同厚度和弧度的耳廓，而非强迫用户去适应产品。</p>\n  <p>音质层面，开放式结构天生的物理短板是低频流失。Clip Pro选择在硬件端下功夫。</p>\n  <p>据介绍，10.8mm双磁路动圈单元配合TPU+LCP复合振膜，从振膜材料与磁路效率上为低频响应打好基础；Malleus低音增强算法则在补偿低频的同时同步抑制高频失真，而非简单粗暴地抬升EQ；Hi-Res认证与LDAC支持则进一步确保了无线传输环节的信息量。</p>\n  <p>这套“先硬件后算法”的逻辑，先保证单元能发出好声音，再用算法弥补了结构局限。</p>\n  <p>此外，当大多数耳机厂商致力于将更多功能塞入触控面板时，CMF选择了一条反向路径——保留机械旋钮。</p>\n  <p>Clip Pro充电盒上保留了Smart Dial智能旋钮，提供了旋转调音、按压切歌、长按配对的实体交互逻辑。同时，耳机本体上同样保留了独立的物理按键，让用户在运动出汗或佩戴手套的场景下更容易操控。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_98fa3ccb4e09459f89885f6349192940@6221844_oswg237522oswg992oswg580_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Clip Pro（图源/企业）</p>\n  <p>根据IDC最新数据，2026年第一季度，全球开放式耳机出货量同比增长39.9%，其中耳夹式产品占比首次突破半数，已达到54.3%，正式成为开放式耳机的主流形态。</p>\n  <p>从CMF产品矩阵来看，Clip Pro对CMF而言意义特殊。在此之前，CMF的音频产品线以Buds（入耳式降噪）和Neckband Pro（颈挂式）为主。Clip Pro的加入，标志着CMF正式进入增长最迅速的开放式耳机战场。</p>\n  <p>而市场定位来看，549元的预售价恰好卡位在一段空白地带。目前百元以下市场被白牌占领，千元以上则由Bose、华为等品牌固守，Clip Pro能否在中间价格带打开局面，有待市场验证。</p>", "category": "tech", "published_at": "2026-08-06T08:46:46+00:00", "fetched_at": "2026-08-07T02:26:31.779261+00:00", "fingerprint": "293816f4af1c56ab"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨DeepSeek宣布大幅涨价；贾国龙再创业，开店“天边羊多”；河南试行周五下午弹性离岗", "url": "https://36kr.com/p/3928685883308165?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>字节跳动内部严禁蒸馏开源模型</li>\n   <li>中信证券：韩股杠杆去化尚未完成</li>\n   <li>印尼电商企业自11月1日起代征卖家收入所得税</li>\n   <li>字节跳动全员会：整合豆包、飞书与火山引擎，AI业务重点转向ToB生产力</li>\n   <li>万科组织架构再“瘦身”：办公事业部解散，事业部缩减至7个</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>DeepSeek宣布大幅涨价</strong></p>\n  <p>8月6日，DeepSeek公告：“计划近期整体上调DeepSeek API服务的定价，预计涨幅较大，请合理安排您的使用。具体方案以正式通知为准。”8月3日，海外开发者平台OpenCode披露了一组数据：8月1日当天，DeepSeek V4 Flash在其平台上单日处理Token总量达8万亿。其中5万亿来自免费试用额度，3万亿来自开发者付费调用。（每日经济新闻）</p>\n  <p><strong>贾国龙再创业，新店“天边羊多”近期开业</strong></p>\n  <p>8月5日，记者获悉，在“天边砂锅焖面”之后，西贝创始人贾国龙探索的新业态“天边羊多”于8月7日在北京开出全国首店。</p>\n  <p>记者在天边店小二官方公众号发布的预告视频看到，“天边羊多”新店将主打内蒙古鲜羊肉到店加工，菜品包括羊肉烧麦、烤羊肉串、手把肉、涮鲜羊肉锅等，视频中特别强调了“好肉不用腌，只撒一把盐”“鲜羊直达”等特色。记者从接近西贝的人士处了解到，天边羊多定位鲜羊料理，属于西北菜，是西贝在西北菜基因上的品牌延伸与场景深耕。（每日经济新闻）</p>\n  <p><strong>河南试行周五下午弹性离岗，领导干部要带头休假</strong></p>\n  <p>近日，河南省委组织部、省人力资源社会保障厅等六部门联合印发《关于进一步推动落实职工带薪错峰休假的通知》（以下简称《通知》），《通知》明确，凡连续工作满12个月的职工，不分编制、合同、劳务派遣或临时用工，均平等享受带薪年休假。</p>\n  <p>为了让职工轻松规划短途、长途出行，新政推出灵活拼假方案。《通知》提出，鼓励职工将带薪年假与周末、法定小长假、寒暑假、中小学春秋假等衔接，形成3—7天弹性长假。有条件的单位可调整夏季作息，试行周五下午弹性离岗，构建“周五半天+周末+年假”短途度假模式。（极目新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>字节跳动内部严禁蒸馏开源模型</strong></p>\n  <p>8月6日，记者从字节跳动内部人士处获悉，今年国内竞争对手开源模型的快速发展给字节跳动带来更大的压力。在近日的内部会议中，字节跳动创始人张一鸣表示，做模型要坚持长期主义、延迟满足感，而不是用别人的输出，换一时的榜单排名。</p>\n  <p>今年以来，国内AI大模型竞争已经极为激烈，几乎每隔几天就有新模型发布，每当有一个强大的开源新模型发布，字节跳动内部关于蒸馏的争论就会升温。澎湃新闻记者了解到，张一鸣很少在Seed团队的会议上发言，但此次明确表态，字节跳动“应该愿意为长期目标牺牲一部分短期收益”。</p>\n  <p>据了解，字节跳动内部对开源模型严禁蒸馏，甚至通过API检测等方式在内部加强相关限制，张一鸣认为，蒸馏会干扰真正意义上的长期技术突破。（澎湃新闻）</p>\n  <p><strong>Meta推出Muse Code：面向大型代码库的AI智能体</strong></p>\n  <p>在人工智能应用赛道一度略显落后的Meta，正加速追赶同行。本周，该公司推出一款全新终端编码智能体，帮助程序员处理大型软件代码库中的复杂开发任务。Meta首席执行官马克・扎克伯格周三在社交媒体发文表示，目前处于测试版的Muse Code能够“在大型代码仓库中完成完整软件工程任务”，涵盖“方案规划、代码编写、结果验证”全流程。用户仅需一条命令即可安装Muse Code，底层依托Meta此前发布的代码大模型Muse Spark。面对大型项目时，它会自动生成多个智能体并行开展工作。（新浪财经）</p>\n  <p><strong>豆包接入原生音视频全双工大模型SeedRealtime</strong></p>\n  <p>36氪获悉，豆包宣布视频通话功能升级，正式接入原生音视频全双工大模型SeedRealtime。</p>\n  <p><strong>小红书加大AI投入：布局AI社交方向，开启AI陪伴产品自研</strong></p>\n  <p>小红书正全面提速AI战略，布局AI社交产品、AI社区互动工具等方向，从后台技术应用转向前台自研、产品化与生态化全面竞速。小红书近日正密集招募AI应用研发人才。其中，“AI社交产品经理”岗位职责包括：主导AI陪伴产品的设计与打造，探索AI在情感连接、兴趣匹配、个性化互动等维度的深度应用，构建有温度的AI陪伴体验。（新浪科技）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>三星海力士美光产能提前售罄，内存短缺或持续至2027年</strong></p>\n  <p>据科技媒体近日报道，内存芯片供应紧张态势预计将持续至2027年，业内消息人士透露，三大内存原厂已基本完成明年的产能分配谈判。简言之，三星(SSNLF)、SK海力士(SKHY.US)和美光(MU.US)2027年的预计内存供应已全部售罄，且暂无新增产能规划。&nbsp;</p>\n  <p>报道称，三大供应商已分配完毕2027年全部DRAM和HBM产能。客户最终获得的配货量仅为其初始请求的60%至70%。业内人士指出，2027年将进入内存短缺最严峻的阶段。配货数量目前已基本敲定，但最终发货定价将更接近交付时确定。（金融界）&nbsp;</p>\n  <p><strong>宇树科技：确定本次发行价格为150.80元/股</strong></p>\n  <p>36氪获悉，宇树科技公告，经发行人和保荐人（主承销商）根据初步询价结果，综合评估公司合理投资价值、同行业上市公司估值水平、所属行业二级市场估值水平等方面，充分考虑网下投资者有效申购倍数、市场情况、募集资金需求及承销风险等因素，协商确定本次发行价格为150.80元/股，网下发行不再进行累计投标询价。投资者请按此价格在2026年8月10日（T日）进行网上和网下申购，申购时无需缴付申购资金。</p>\n  <p><strong>中信证券：韩股杠杆去化尚未完成</strong></p>\n  <p>韩国KOSPI指数跌幅扩大至5%，三星电子跌超6%，SK海力士跌超9%。8月6日，中信证券发布研报指出，目前韩国散户杠杆已快速去化，但观测的指标显示风险尚未完全出清，券商融资余额7月31日单日缩水10%，创年内最大降幅，显示场内杠杆仍在快速去化，同时7月30日与31日散户单日爆仓强平金额仍超千亿韩元，爆仓率仍处于7%—8%高位，远高于市场稳定状态下的1%水平。韩国平准基金规模有限，韩国国民年金入场有道德风险，预计后续市场波动率仍将处于相对较高水平。（每日经济新闻）&nbsp;</p>\n  <p><strong>美股三大指数集体收跌，热门中概股多数下跌</strong></p>\n  <p>36氪获悉，8月6日收盘，美股三大指数集体下跌，道指跌0.85%，标普500指数跌0.18%，纳指跌0.06%。大型科技股涨跌不一，微软涨超2%，苹果、Meta小幅上涨，谷歌跌超1%，英伟达、特斯拉、亚马逊小幅下跌。热门中概股多数下跌，阿里巴巴、百度、蔚来跌超1%，理想汽车、小鹏集团、拼多多小幅下跌，网易涨超1%，京东、哔哩哔哩小幅上涨。</p>\n  <p><strong>华为数据存储产品副总裁：存储涨价有一定影响，目前可以保证客户供应</strong></p>\n  <p>8月6日，在2026华为数据存储用户精英论坛上，华为数据存储产品线副总裁吴俊杰表示，客观地讲，全球范围内存储颗粒价格上涨是有影响的，今年业界友商都进行了多次价格调整，涨价对华为的战略也造成了一定影响，华为跟全球的客户和伙伴都进行了充分、透明的沟通，包括什么时间点会有什么影响。整体上，华为存储对客户的供应是可以保证的。吴俊杰进一步补充，华为在全球存储颗粒采购量都非常大，有稳定的上游供应链，也相对多元化，公司做了充分的预测和一些供应的保障。（澎湃新闻）&nbsp;</p>\n  <p><strong>印尼电商企业自11月1日起代征卖家收入所得税</strong></p>\n  <p>印尼税务总局周三晚间表示，雅加达方面为提振购买力第二次推迟该计划后，印尼各电商平台将于11月1日起，对平台内卖家的收入征收所得税。印尼税务总局称：“此次推迟实施，是为在政府重点关注当前经济形势的背景下，维护民众购买力。”税务总局补充，已向卖家征收的所得税将予以退还。（新浪财经）&nbsp;</p>\n  <p><strong>万科组织架构再“瘦身”：办公事业部解散，事业部缩减至7个</strong></p>\n  <p>万科正式撤销办公事业部。调整后，公司事业部数量由8个缩减至7个。据知情人士透露，办公事业部撤销后，各个项目并入各自城市公司，事业部负责人卢冰转任中航万科负责人，事业部部分员工转岗至城市公司，部分员工按优化方案获赔离职。目前，万科官网组织架构资料也已作出更新。对此调整，截至发稿，万科方面暂无官方回应。（新浪财经）&nbsp;</p>\n  <p><strong>DeepSeek近期获国家人工智能产业投资基金等入股</strong></p>\n  <p>36氪获悉，据报道，近日，DeepSeek计划大幅涨价，相关话题引发关注。天眼查App显示，DeepSeek关联公司杭州深度求索人工智能基础技术研究有限公司近期发生工商变更，新增国家人工智能产业投资基金合伙企业（有限合伙）、杭州程砺企业管理咨询合伙企业（有限合伙）为股东，注册资本由1500万人民币增至约1644.7万人民币。该公司成立于2023年7月，法定代表人为裴湉，经营范围包括人工智能应用软件开发、软件开发、数据处理服务等。</p>\n  <p><strong>字节跳动全员会：整合豆包、飞书与火山引擎，AI业务重点转向ToB生产力</strong></p>\n  <p>8月6日，字节跳动CEO梁汝波在年中全员会上介绍豆包、飞书、火山引擎整合背景时表示，AI在生产力上的发展快于预期，ToB变得更重要，飞书新增客户中已有超九成同步采购飞书AI产品。梁汝波将字节业务战略原则总结为“高度优先，粗主干，优化长期”，三大核心业务为AI、信息平台与交易服务，三者紧密相关，均通过计算换智能实现公司使命。抖音作为\"主干\"业务拉动电商与生活服务，未来豆包也将成为“主干”。（新浪财经）</p>\n  <p><strong>住房消费跻身大宗消费首位，多个热点城市正研究出台住房消费提振举措</strong></p>\n  <p>7月份，国务院批复的《扩大消费“十五五”规划》对外发布，将住房消费纳入大宗耐用商品消费范畴并置于首位。有机构认为，房地产的政策定位或向“防风险与促消费并重”转变。记者获悉，多个热点城市正谋划出台住房消费提振举措。其中，成都着力从优供给、增需求、去库存、稳预期方面提出住房销售政策，包括优化供给促进供需平衡、支持住房消费满足多元需求等，目前相关政策尚在内部研究中，最终确定后将第一时间公开发布；合肥正结合国家政策导向，会同相关部门统筹研究促进“大消费”部门协同联动行动方案。（证券时报）&nbsp;</p>\n  <p><strong>韩国6月国际收支经常项目顺差497.3亿美元，连续两个月刷新单月最高顺差纪录</strong></p>\n  <p>韩国央行8月6日发布的���步统计显示，韩国6月国际收支经常项目实现497.3亿美元顺差，连续两个月刷新单月最高顺差纪录。货物贸易实现478.9亿美元顺差，创下单月最高纪录。出口同比大增84.5%，为1123.7亿美元，货物出口超过1000亿美元尚属首次。按品目看，以海关数据为准，计算机及周边设备（282.7%）、半导体（196.9%）、无线通信设备（60.6%）等的出口大幅增加。（界面新闻）&nbsp;</p>\n  <p><strong>现货黄金突破4300美元</strong></p>\n  <p>36氪获悉，现货黄金日内涨超1%，向上突破4300美元/盎司关口，为6月18日来首次。&nbsp;</p>\n  <p><strong>多家期货公司终止居间人合作，行业获客进入专业价值比拼新阶段</strong></p>\n  <p>8月以来，一德期货、信达期货、中原期货、红塔期货、国联期货等期货公司纷纷发布公告：终止与全部居间人的居间业务合作，禁止任何机构或个人以公司居间人名义从事相关活动；原居间人介绍客户的日常服务，转为公司客户经理或官方客服人员直接对接处理。中国期货业协会最新数据显示，截至8月4日，期货公司的存续居间人数量仅剩36人，较高峰时期的4万余人大幅缩减，表明行业“去居间化”进程已近尾声。对此，受访人士表示，这是期货行业发展从“规模导向”转向“质量导向”的必然结果。随着监管层对适当性管理、投资者保护的要求越来越高，以及期货经营机构推进高质量发展，行业获客渠道将迈入专业价值比拼的新阶段。（上证报）&nbsp;</p>\n  <p><strong>需求旺盛景气度高，光模块“噪音”影响有限</strong></p>\n  <p>受一则涉及光模块出口的传闻影响，8月5日A股开盘后，光模块龙头企业“易中天”（新易盛、中际旭创、天孚通信）股价大幅低开。对此，多位业内人士在接受记者采访时表示，早在2025年，市场就传出过光模块等产品可能被限制的消息，行业对此已有预判并做了部分准备。短、中期看，鉴于旺盛的市场需求，中国的庞大产能、超高效率、更低成本等因素，海外严格禁止进口中国光模块的可能性较小，产业受到冲击相对有限；但长期看，中国厂商部分海外市场的份额可能将会受到一定影响。（上证报）&nbsp;</p>\n  <p><strong>马斯克：内存芯片的需求增长速度远远超过了供应增速</strong></p>\n  <p>马斯克表示，投资者不应为内存芯片的需求而感到的担忧，AI热潮中最大的瓶颈之一是内存。他指出，内存芯片的需求增长速度远远超过了供应增速。马斯克对存储芯片的需求状况具备很强的发言权，因为特斯拉和SpaceX均是存储芯片重要买家。（财联社）&nbsp;</p>\n  <p><strong>美团：燃油费下调当日，机票搜索量同比涨42%</strong></p>\n  <p>36氪获悉，8月5日起，国内航线燃油附加费迎来年内连续第三个月下调。调整后的标准为：800公里以上航线每位成人旅客收取70元，800公里（含）以下航线每位成人旅客收取40元。美团数据显示，燃油费下调当日，机票搜索量同比增长42%。其中，北京、广州、成都、深圳、上海等地市民游客出行热度最高，其中，北京到上海、广州到上海、广州到北京、成都到三亚、成都到乌鲁木齐成为预订热度Top 5航线。&nbsp;</p>\n  <p><strong>OpenAI要求美法官驳回苹果诉讼，称“窃取商业机密”指控“毫无依据”</strong></p>\n  <p>据报道，OpenAI当地时间8月5日请求美国法官驳回苹果公司有关窃取商业机密的诉讼，称后者的指控“毫无依据”。此前，苹果公司上月以窃取商业机密为由起诉OpenAI，指控后者通过协同行动窃取苹果未发布产品的相关信息。苹果称，OpenAI鼓动其员工分享未发布产品的相关信息、零部件、图纸及其他资料，以此来开发自家的全系列硬件产品。苹果要求OpenAI停止相关行为、销毁所有苹果的专有资料，并重新设计其待发布产品，确保其中不包含任何苹果的技术。（界面新闻）&nbsp;</p>\n  <p><strong>前小鹏副总裁陈永海加入众擎机器人担任运营总裁</strong></p>\n  <p>前小鹏集团产品副总裁陈永海已加入众擎机器人，担任运营总裁，向董事长及CEO赵同阳汇报。陈永海此前是高德地图产品运营的负责人，2022年加入小鹏，后又负责其产品中心。（21财经）&nbsp;</p>\n  <p><strong>马东辉启动内部改革，理想直面被模仿困境</strong></p>\n  <p>从多方独立信源处获悉，7月最后一个工作日，理想汽车发布了一份任命公告。为了提升产品竞争力，经研发技术委员会的批准，公司将分批设立跨领域融合的产品和技术创新工作组。与此同时，理想汽车总裁马东辉还在一份共享文档里对创新工作组启动的初衷、核心理念、达成路径等进行了充分的解释。目前理想汽车的产品部依然存在，但和巅峰时期相比，人数已经少了4/5。一位知情人士告诉我们，原来产品部管辖的智驾产品、座舱产品等重要业务都已经被拆分，目前产品部里有约50人都是负责“理想商城”相关的工作。（21财经）&nbsp;</p>\n  <p><strong>巴克莱：人形机器人可能在2035年后实现大规模部署</strong></p>\n  <p>巴克莱分析师在一份研究报告中表示，人形机器人的部署可能在2035年之后实现大规模化。他们指出，目前许多关于人形机器人的炒作反映的是预先设定好的演示、人工控制的远程操作或特定任务的自动化，而不是真正的通用自主性。为了实现真正的通用自主性，人形机器人需要“感知、推理和适应性行为“。人形机器人的部署最终可能与自动驾驶汽车类似，后者花费了十多年的时间。因此他们表示，大规模的经济应用可能更接近2035年而不是2030年，而近期的部署将集中在狭窄、受控的工业应用场景上。（新浪财经）&nbsp;</p>\n  <p><strong>台积电N2制程产能充足但DRAM短缺，苹果iPhone 18备货面临压力</strong></p>\n  <p>独立科技记者Tim Culpan表示，距离苹果iPhone 18系列及折叠屏手机iPhone Ultra发布仅剩数周，台积电N2制程生产的A20 Pro处理器晶圆良率表现良好、产能充足，但由于DRAM内存供应严重短缺，已完成的处理器晶圆无法进行后续封装，导致库存积压，并给苹果及供应链备货带来压力。Tim Culpan说，苹果及其供应链组装商正紧急寻求更多移动设备DRAM芯片供应。目前苹果主要依赖美光科技供应DRAM，同时也向SK海力士和三星采购。Tim Culpan称，台积电N2制程并非影响iPhone出货的瓶颈，A20 Pro处理器生产已基本准备就绪。（界面新闻）&nbsp;</p>\n  <p><strong>*ST萃华：部分年度财务信息涉嫌虚假记载，可能触及重大违法强制退市情形</strong></p>\n  <p>36氪获悉，*ST萃华公告，公司因涉嫌信息披露违法违规于2026年2月9日被证监会立案调查。截至2026年8月6日，监管调查初步查明，公司披露的部分年度财务信息涉嫌虚假记载，可能触及重大违法强制退市情形。若后续经证监会行政处罚认定的事实触及重大违法强制退市情形，公司股票将被实施重大违法强制退市。同日，公���收到深交所关注函，要求就股票可能被实施重大违法强制退市进行充分风险提示。</p>\n  <p>大公司财报</p>\n  <p><strong>德国商业银行二季度净利润8.98亿欧元超预期，同比增94%</strong></p>\n  <p>德国商业银行8月6日公布二季度营收33.0亿欧元，同比增加9.3%，预估32.6亿欧元；净利润8.98亿欧元，同比增加94%，预估8.564亿欧元；预计全年营收大约132亿欧元，此前预计132亿欧元，预估132.4亿欧元。声明称，今年7月，德国商业银行申请规模至多12亿欧元的下一轮股票回购计划，该计划已获欧洲央行批准。（界面新闻）</p>\n  <p><strong>西门子三季度营收207.9亿欧元超预期</strong></p>\n  <p>西门子8月6日公布三季度营收207.9亿欧元，同比增加7.3%，预估206.5亿欧元；自由现金流41.5亿欧元，同比增加42%。（界面新闻）</p>\n  <p><strong>软银集团一季度净利润3473.3亿日元超预期</strong></p>\n  <p>软银集团8月6日公布一季度净利润3473.3亿日元，预估1658.3亿日元；销售净额2.02万亿日元，预估1.97万亿日元。（界面新闻）</p>\n  <p><strong>柠萌影视：预计2026上半年净利润同比增长77.7%至255.4%</strong></p>\n  <p>36氪获悉，柠萌影视发布了正面盈利预告，预计在2026年上半年取得净利润约2000万元至4000万元。2026年上半年预期录得净利润预计同比增长77.7%至255.4%，预期录得归属于股东的净利润预计同比增长84.8%至269.7%，预期录得经调整净利润预计同比增长38.5%至177.0%。</p>\n  <h2>投融资</h2>\n  <p><strong>“和光智成”完成天使轮数千万融资</strong></p>\n  <p>36氪获悉，近日，AI新材料企业“和光智成”完成天使轮数千万融资，此次融资将主要用于团队扩招与自主实验室扩容。</p>\n  <p><strong>“松鼠动力”完成超2亿元A轮系列融资</strong></p>\n  <p>36氪获悉，户外出行硬科技企业“松鼠动力”近日完成超2亿元A轮系列融资，投资方包括元禾璞华、元禾厚望、厚雪资本、金沙江联合资本、天堂硅谷、中科创达、光远和声基金、不同资本、神骐资本、活水资本及春珈资本等产业资本与专业财务机构。本轮资金将重点投入Evotrex-PG5整车车规级深度验证、研发测试，加快产线搭建与产能扩建工作，全面扩充制造能力，以保证2027年大批量交付目标顺利落地。</p>\n  <h2>酷产品</h2>\n  <p><strong>兆易创新发布两款人形机器人专用MCU</strong></p>\n  <p>36氪获悉，8月5日，兆易创新发布两款人形机器人关节驱动专用MCU。GD32F50MxxG采用252MHz Cortex-M33内核，合封自研三相栅极驱动器与4路运放，单芯片替代分立方案，适配24~48V电机，计划12月量产。GD32H77R搭载600MHz Cortex-M7内核，集成EtherCAT从站与双百兆PHY，支持主流编码器接口，已开放样品。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-08-06T23:48:22+00:00", "fetched_at": "2026-08-07T02:26:31.779256+00:00", "fingerprint": "77c02eb91199565d"}, {"source": "36氪 - 最新文章", "title": "赋予机器人“空间直觉”，「Ommo Technologies」获数千万美元A轮融资｜36氪首发", "url": "https://36kr.com/p/3927419946629256?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>当AI开始尝试理解物理世界时，一个最基础的问题悄然浮出水面：机器人究竟如何感知自身在空间中的位置？</p>\n  <p>视觉能告诉它看到了什么，编码器会告诉它关节转了多少度，力觉、触觉则会告诉它摸到了什么。但当机械手抓取柔软物体、手指相互遮挡，或进入狭小腔体的时候，所有这些传感方式都可能失效。因为，这些“物理条件下的天然局限”，会导致机器人丢失对自己末端位置的感知。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_a80da1693bb44953a09eb3ccc6d5f0ba@5930287_oswg187492oswg1269oswg379_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：</p>\n  <p>这正是Ommo Technologies（下称“Ommo”），一家空间智能技术公司试图解决的问题。36氪获悉，近期，Ommo已完成数千万美元A轮融资。本轮融资由香港鼎珮集团（VMS Group）、某知名基金联合领投，康君资本跟投，点石资本担任长期独家财务顾问。</p>\n  <p>此外，本轮募集资金将用于核心产品空间定位系统的技术迭代与量产体系建设，推进公司产品在具身智能、先进制造、医疗等场景的合作落地。</p>\n  <p>Ommo创始人郑敏杰介绍，自己的创业起点源于大学时期对3D交互技术的探索，并做过一款交互电子书，让纸质书籍也能实现数字化交互。创办OMMO后，团队也曾尝试延续这类技术方向，却在产品落地时遇到一个技术难题，即“现有成熟定位技术难以持续捕捉空间内无约束、高精度的完整动作”。</p>\n  <p>“我们调研过光学、毫米波雷达等各类主流或非主流定位技术，但认为它们都很难达到消费级产品所需的全场景优质交互体验。以主流光学定位为例，它绕不开物理层面的硬伤，一旦被物体遮挡视线，追踪就直接失效。比如，微创手术使用的柔性内窥镜进入人体后完全遮挡，无法依靠光学方案完成定位。”郑敏杰表示。</p>\n  <p>经过多轮论证，Ommo团队走向自研底层技术的路线，并定下硬性标准：硬件低成本、支持大规模量产，且能稳定输出超高三维交互精度。永磁磁场定位路线因此成为Ommo的最终选择。</p>\n  <p>实际上，磁场定位本就是业内为解决光学定位遮挡问题而采取的替代方案，已沿用多年。只是，传统方案依靠线圈通入交边电流来产生磁场，虽能“透视”，但工程缺陷突出，易受金属、周边电磁设备干扰，且大空间部署需要巨型线圈，设备轻量化、小型化难度高。</p>\n  <p>永磁定位虽也属于磁场追踪路线，但磁场生成逻辑与传统方案不同。它主要依靠永磁体机械旋转来生成特征磁场。这个差异带来了两个关键优势，一是摆脱传统电磁必备的大型线圈与磁放大结构，使整套硬件可以做得非常小巧；二是从底层磁场设计解决了传统电磁定位最难攻克的金属干扰瓶颈。</p>\n  <p>“我们主要从两个层面解决这项问题。首先，采用低频准静态永磁信号，削弱导电金属产生的涡流效应及其产生的二次磁场干扰；其次，我们采用高复杂度的特征磁场编码，对环境扰动进行识别和矫正。简单打比方来说，传统电磁设备通常依赖规则周期信号和预设磁场模型，一旦波形失真就彻底‘抓瞎’；而Ommo设计的磁信号包含专属特征——��似具有多个可识别点的‘五角星形’或‘异形椭圆’，即便受到干扰也只是局部波形形变，核心特征依然保留，且配套算法可以实时识别畸变，并完成误差修正。”</p>\n  <p>它就像是在物理空间内搭建了一个小型“室内北斗”，作为磁场发射源的主机内部有一个持续旋转的永磁体，微型磁力传感器则实时采集所在位置的磁场信号，并由算法解算完整的6DoF位置与姿态数据。目前，系统可在规定工作范围内达到亚毫米级精度，磁传感器最小约0.8毫米，比一粒米的宽度还小，可嵌入机器人末端、可穿戴设备或医疗器械，适用于狭小、遮挡及持续交互的复杂环境。</p>\n  <p>据介绍，围绕这一底层技术，Ommo已形成覆盖磁场建模、空间解算、传感器、精密机械、电子系统、生产测试和质量管理的全栈团队。核心成员拥有Apple、Intel、Riot Games、TTI、Samsung等科技企业经历，多位成员具备连续创业，以及将产品从原型研发推进至规模化制造的完整经验。</p>\n  <p>永磁定位看似建立在成熟磁体和MEMS传感器之上，真正实现商业化仍需同步解决复杂磁信号生成、非金属精密机械、传感器标定、空间解算、无线同步及量产一致性等多重工程问题。Ommo用多年时间将这些环节整合为可重复生产、可由客户验证的完整系统，这种跨机械、电子、算法与制造的全栈积累，也构成了公司长期的技术壁垒。</p>\n  <p>“另外，我们在设计之初就兼顾了低成本产业化的问题。磁铁材料依托新能源车产业链已实现规模化量产，传感器芯片则来自成熟的消费电子供应链。”郑敏杰表示。</p>\n  <p>最初，Ommo这套永磁定位技术先在医疗手术导航场景落地。郑敏杰介绍，这是因为“手术室场景高度受控、且容错率趋近于零，其严苛标准适合用于验证系统基础精度”。公司已建立符合ISO 13485标准的质量体系，并与全球头部手术导航企业开展多年技术验证。截至目前，Ommo合作客户覆盖国内外百余家医疗器械企业，多款配套导航设备进入医疗器械申报阶段，细分场景覆盖神经外科、骨科/运动医学、齿科等领域。</p>\n  <p>医疗场景外，具身智能赛��是Ommo当前重点布局的市场。郑敏杰注意到，过去一年来，不少具身领域的客户因设备无法完成高精度柔性操作，在线下落地时遭遇技术瓶颈。比如，机器人在抓取、插接、旋拧等动作中，操作越精细，微小位姿误差越容易在接触后被放大为滑移或失败。“这些客户主动找到我们，希望用高精度传感器弥补操作误差。”</p>\n  <p>另一方面，整个具身行业正面临“三维物理实操数据集极度稀缺”的共性痛点。大语言模型可以依托互联网中的海量数字化文字完成训练，但机器人训练需要的三维实操数据，尚未完成规模化采集。</p>\n  <p>比如，一只机械手拿起水杯又掉落，到底是因为没抓紧、抓错了位置，还是物体在抓取过程中发生形变导致操作失败？这需要末端姿态数据、触觉数据等多模态信息才能回答。目前，行业已使用视频、光学动捕、IMU、编码器和力触觉传感器采集数据，但在手指互相遮挡和持续接触过程中，仍较难低成本获得连续、绝对、高精度的6DoF轨迹。</p>\n  <p>这是Ommo看到的新机会。Ommo定位系统的精度和稳定性已在医疗赛道经过充分验证，可迁移至具身领域搭建数据采集平台。目前，公司首款数据采集手套已搭载医疗级永磁传感器，用于采集人类手部实操姿态。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260806/v2_36e3827e55394045aaa3d8d122f0c1e7@5930287_oswg1068084oswg1268oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：</p>\n  <p>郑敏杰坦言，这部分市场“成长速度比自己想象中快很多”。今年以来，公司已陆续对接多家具身客户并展开合作，同时决定加速推进全套产品体系落地进程。</p>\n  <p>在郑敏杰看来，空间智能是“物理AI的底层神经中枢”。大语言模型相当于机器人的大脑，负责理解指令、输出决策；机械臂、灵巧手是机器人肢体，完成物理实操。而Ommo打造的永磁定位体系，则负责打通环境感知与肢体执行之间的实时反馈通路，“复刻人类与生俱来的三维空间感知能力”。</p>\n  <p>“我们希望让机器人真正拥有稳定的‘空间直觉’，这或许也是AI从数字世界真正走进物理世界的不可或缺的底层基础设施。”郑敏杰表示。</p>\n  <h3><strong>相关方观点：</strong></h3>\n  <p>VMS合伙人伍兆威表示，精度、体积与环境适应性这几项要求往往难以兼顾，Ommo的空间感知系统把它们收在了同一套方案里，并在手术导航这类容错极低的场景中经受了检验。多年真实场景中沉淀的标定算法与数据，构成了比硬件更深一层的壁垒。而机器人末端在抓取、插接、装配中面对的遮挡、狭小与持续接触，本质上是同一个问题。VMS期待与Ommo长期同行，把这套能力带向更广阔的产业。</p>\n  <p>康君资本团队表示，从追求稳定、极致精准的医疗场景跃迁到不断演进、无限泛化的具身领域，Ommo借助自身工程与算法能力，突破了技术的应用边界，成为构建物理AI的基石。康君资本看好Ommo技术平台的发展前景，期待发挥生命科学与医疗领域的产业资源，支持Ommo走向前沿应用。</p>\n  <p>点石资本合伙人黄峻表示，作为Ommo的长期独家财务顾问，点石资本见证了公司从原创技术、产品工程化到跨场景拓展的完整过程。Ommo的稀缺性来自底层技术的原创性、高要求场景中的验证能力，以及面向更广阔空间智能市场的延展潜力。我们将继续陪伴公司前行，持续嫁接产业与资本资源，坚信Ommo终将成为具备长期竞争力的空间智能平台。</p>", "category": "tech", "published_at": "2026-08-07T00:30:00+00:00", "fetched_at": "2026-08-07T02:26:31.779249+00:00", "fingerprint": "e1bced5d2513a5da"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 拿下头部消费电子客户订单，这家超高精度金属3D打印公司完成Pre-A轮融资", "url": "https://36kr.com/p/3928769679686019?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_a44052babee746e9a8084edbe404d477@6221844_oswg840156oswg2542oswg1440_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2600</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，苏州德悟科技有限公司（下称“德悟科技”）已于近期完成数千万元Pre-A轮融资，本轮由金沙江联合资本和金投致源共同投资。资金将主要用于超高精度SLM设备的迭代研发、打印服务产线扩产及市场拓展。</p>\n  <p>德悟科技2024年5月成立于苏州，专注于超高精度金属3D打印SLM（选区激光熔化）设备的研发、生产、销售及打印服务，是国内少数掌握微米级金属增材制造核心技术的公司之一。</p>\n  <p>目前，公司业务覆盖设备研发、AI+设计服务、打印服务，为消费电子、医疗器械、航空航天等行业提供高精度、复杂微小金属零部件的制造解决方案。</p>\n  <p>德悟科技核心创始人学术与从业背景覆盖研发到商业化全链条：团队核心人员核心成员来自上海交大、西工大、英属哥伦比亚、亚琛工大等知名高校，拥有金属增材设备及工艺、AI for Science（软件仿真、参数自主优化等）及投资机构等多重技术和产业背景，首席科学家为亚琛工大博士、深耕增材设备及材料开发多年。团队整体具备材料、机械、流体力学、机器学习等多学科技术能力及多维商业化经验。</p>\n  <p>硬氪了解到，传统金属3D打印在精度、表面粗糙度及后处理成本方面长期存在瓶颈，难以满足精密零部件的批量化制造要求。</p>\n  <p>目前，德悟科技自主研发的超高精度SLM设备，将成型公差控制在±10微米以内，表面粗糙度Ra值最低可达1微米，可成型壁厚仅30微米的极薄结构。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_a87ddbed5c1945998031fc50377e241c@6221844_oswg276799oswg779oswg1145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">医疗器械功能件（图源/企业）</p>\n  <p>这一技术优势在成本端体现尤为明显。公司创始人王洲向硬氪介绍，常规3D打印由于精度不足，打印出的零件往往只是“粗胚”，需经过大量CNC打磨、抛光等后处理工序，后处理成本通常占总成本的70%左右。而德悟的高精度打印直接将表面光洁度做到接近成品标准，将后处理成本压缩至10%-20%，综合成本较传统方案降低30%-40%。</p>\n  <p>“客户最终算的是全链条成本。有些件我们打印成本比普通打印贵一点，但后处理省下来的钱远大于这个差价。”王洲说。</p>\n  <p>目前，公司已完成设备多次迭代，自研了包含精细结构超高精度工艺控制、小光斑光路系统、小粒径粉末平场风场设计等核心模块的技术体系，并已申请三十余项相关国内外专利。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_61ba9eb4d5954d3294ff951f585f1d57@6221844_oswg498561oswg943oswg1386_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">医疗器械功能件（图源/企业）</p>\n  <p>从应用场景来看，德悟科技最初以航空航天为切入点，逐步拓展至医疗器械领域。但自2025年下半年起，消费电子客户的需求开始集中爆发。</p>\n  <p>“海外头部消费电子客户在智能穿戴设备的设计上，全面转向轻量化和复杂结构。手表、戒指、智能眼镜等产品对微型金属精密件的需求一下子起来了。”王洲判断，消费电子的研发周期通常有3-5年，当前这些项目处于设计验证的中后期，未来1-2年内将进入量产阶段，因此相关需求也会大大增加。</p>\n  <p>在客户层面，德悟科技已与国内多家果链上市企业、商用航天科研院所、苏州国家实验室、上海交大、西工大、头部医疗器械厂商等建立了合作关系。其中，王洲透露，目前公司已与多家海外及国内头部消费电子品牌开展合作。</p>\n  <p>公司规划2026-2027年自持设备数量增至20-30台，中长期目标为60-80台。此外，公司计划在日本、韩国、欧洲市场同步推进海外布局。</p>\n  <p><strong>以下是硬氪与公司创始人王洲的对话（经编辑）：</strong></p>\n  <p><strong>硬氪：德悟的技术路线与市面主流金属3D打印的核心差异是什么？</strong></p>\n  <p><strong>王洲：</strong>核心差异不在能不能打印，而在“打印出来之后还需要多少工序”。传统SLM打印出来的件，后处理成本占70%，我们把这个比例压到了10%-20%。能做到这一点的关键在于我们的设备从光斑控制、铺粉层厚到风场设计都围绕“直接出成品”来优化，而不是只追求成型尺寸或打印速度。表面光洁度做到Ra≤1.5μm，很多医疗和消费电子件就可以免后处理直接用了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260807/v2_e422287834c441659aea7b269096efd7@6221844_oswg484046oswg936oswg1376_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">医疗器械功能件（图源/企业）</p>\n  <p><strong>硬氪：消费电子和航空航天、医疗相比，客户的决策逻辑有什么不同？</strong></p>\n  <p><strong>王洲：</strong>航空航天客户追求的是“能不能做出来”，医疗客户看重“能不能认证通过”，消费电子客户只看一件事——“单件综合成本能不能降下来”。消费电子量太大了，价格极其敏感。我们的技术路线天然适合消费电子，因为后处理省下来的成本是实打实的。这也是为什么海外头部消费电子客户从去年下半年开始集中找到我们，他们设计端已经在往超高精度结构走了，传统3D打印满足不了，我们刚好能接住。</p>\n  <p><strong>硬氪：高精度技术如何真正转化为对客户可量化的成本优势？</strong></p>\n  <p><strong>王洲：</strong>成本账要算全链条，不能只看打印环节。传统3D打印一个零件，打印成本占30%，后处理占70%。我们的打印成本可能比普通3D打印贵一些，因为设备精度高、打印时间长，但我们把后处理从70%压到10%-20%。</p>\n  <p>以一个100元的零件为例，普通方案是30元打印加70元后处理，我们可能是40元打印加15元后处理，综合成本55元，客户省了45%。而且随着消费电子进入量产，多激光大幅面设备会把打印成本进一步拉低，这个优势还会扩大。客户最终不是买一台设备，是买一个能够量产交付的解决方案。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>金沙江联合资本表示：</strong>微米级金属3D打印是金属增材制造发展多年以来，一个极具战略价值的拓展方向。德悟科技实现的微米级打印精度超越了传统MIM工艺的极限，在小尺度下打开了全新的制造可能性。与此同时，该技术能够实现超高的表面光洁度，大幅减少了后续机加工处理的环节，在精度和成本两个维度上实现了突破。</p>\n  <p>目前，德悟的核心技术已在医疗及航空航天领域实现了批量应用与验证，在3C消费电子领域也正处于上量前夕。智能穿戴设备对轻量化和集约化的追求是长期趋势，这一技术的应用前景值得高度期待。</p>\n  <p>我们认为，3D打印的设计自由度叠加微纳尺度的精密制造能力，在复杂精密结构件领域具备了显著的优势，未来有望成为高端制造中必不可少的环节。随着技术持续迭代和下游应用不断拓展，将形成技术突破与场景扩展的正向循环，开辟更广阔的市场空间。</p>\n  <p><strong>金投致源表示：</strong>当下国内金属增材制造赛道分化趋势显著，多数厂商聚焦通用型设备赛道厮杀，超精密微米级成型技术属于行业稀缺的差异化创新方向，也是国内高端微小精密零部件突破海外工艺垄断的核心突破口。</p>\n  <p>传统加工方式以及市面主流 普通精度3D 打印设备，很难兼顾微型复杂结构成型、低粗糙度与低成本量产三大需求。德悟自主研发极小光斑搭配超薄层厚成套工艺体系，从光路、铺粉系统到配套工艺软件形成完整自研闭环，能够一步成型高精度微型零件，大幅缩减后续精加工工序，在综合生产效率与成品良率上形成独有的技术壁垒。</p>\n  <p>我们认为，中大尺寸构件制造与微尺度精密打印是金属增材制造两条并行发展路线，互补而非替代、各自拥有广阔市场。德悟以设备、工艺、配套服务一体化的完整解决方案切入高精度打印细分赛道，有望打造国内超精密金属 3D 打印龙头。</p>", "category": "tech", "published_at": "2026-08-07T01:11:41+00:00", "fetched_at": "2026-08-07T02:26:31.779237+00:00", "fingerprint": "f6a4d3e804cffbcb"}, {"source": "少数派", "title": "角落新声｜音乐，刻在时光里的私人地图", "url": "https://sspai.com/post/113017", "summary": "没什么特别的，但无处不在，刚刚好。<a href=\"https://sspai.com/post/113017\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-06T02:14:58+00:00", "fetched_at": "2026-08-07T02:26:30.331735+00:00", "fingerprint": "291c766392704f15"}, {"source": "少数派", "title": "TDS REVIEW | vivo TWS 5 Pro 降噪真无线耳机体验", "url s", "url": "https://www.theverge.com/ai-artificial-intelligence/976004/elon-musk-grokipedia-ai-wikipedia-not-updating-dead", "summary": "xAI's Grokipedia, an online encyclopedia with AI-generated articles that Elon Musk once promised would be a \"massive improvement\" over Wikipedia, apparently hasn't been updated since April 24th, according to a report from Lawfare. \"As far as we can tell, no entry has changed in more than three months,\" Lawfare said. Grokipedia launched in v0.1 in [&#8230;]", "category": "tech", "published_at": "2026-08-06T00:25:10+00:00", "fetched_at": "2026-08-06T02:07:41.573466+00:00", "fingerprint": "dd083223721c924d"}, {"source": "36氪 - 最新文章", "title": "早期项目 | 从智能喂养切入，一家创业公司想搭建母婴AI生态", "url": "https://36kr.com/p/3926013599086727?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>母婴市场在全球拥有万亿级规模。中国的母婴消费市场规模已突破5万亿元，年均增速保持12%的稳健水平；全球母婴市场总量更是达到约2万亿美元。</p>\n  <p>庞大的母婴市场背后，其智能化渗透率较低，尚不足1%。全球母婴家庭普遍面临养育压力大、成本高、信息繁杂等核心痛点，而传统母婴产品仍停留在基础功能阶段，智能化程度不足、生态割裂，无法满足新一代家庭需求。以喂奶为例，不少家庭依然采用着极为原始的“手背测奶温”、手工记录喂养数据等方式。</p>\n  <p>在全球超万亿美元规模的母婴市场中，虽然母婴智能设备市场发展快速，智能喂养、发育监测和孕产科技也已成为全球增速较快的核心品类，但整体智能化渗透率较低，尚不足1%。</p>\n  <p>成立于2026年（团队2022年起于硅谷研发母婴产品）的奇世智能，选择切入母婴赛道中最痛的“科学喂养”环节。其即将首发的核心产品——智能奶瓶和智能冲奶机，正是试图用AI改变新生代父母的喂养体验。</p>\n  <p>在奇世智能创始人李志刚看来，真正的智能硬件不仅仅是“连接蓝牙、展示数据”，而是必须具备“数据抓取、处理分析、主动反应”的完整闭环。</p>\n  <p>以奇世智能发布的智能奶瓶为例，它并非传统的“容器”，而是一个集成多维传感器的终端。在喂养过程中，奶瓶底部的隐形传感模块能够自动识别奶量、奶液温度以及喂养时长。如果温度过高或过低，瓶身会通过红/蓝灯直观预警；配合专属的加热模块，它甚至能实现自动保温。更为核心的是，这些数据将实时同步至云端，结合宝宝的体重、月龄等指标，AI会自动生成精准的喂养报告，并在下一次喂养前主动推送定制化的喂养计划。</p>\n  <p>在奶嘴的设计上，奇世智能团队查阅大量人类及哺乳动物哺乳方式的学术论文，发现传统奶嘴“过于容易吸吮”会导致婴儿胀气、吐奶，甚至影响口腔发育。基于此，奇世研发了“仿生实心奶嘴”，不仅在外形上模拟母乳的45:55偏心比例，其内部结构也仿造人类乳腺的微观通道，精准还原了婴儿吸吮母乳时所需的自然阻力。</p>\n  <p>与其配套的智能冲奶机则旨在减少育儿的繁琐问题。用户只需确保粉仓和水仓余量充足，机器便能根据不同品牌奶粉的最佳冲调比例和温度（如70度水温冲调），自动完成精准落粉、无气泡均匀混合，并直接输出适合宝宝饮用温度（约40度）的奶液。设备还自带自清洁与紫外线消毒功能，将原本繁琐、易出错的冲奶过程收敛为“一键操作”。</p>\n  <p>奇世智能以AI+母婴智能硬件为核心，聚焦全球备孕期、孕期、哺乳期全生命周期场景，通过“硬件终端+AI算法+云端服务”三位一体模式，打造覆盖全球母婴全周期的系统化智能解决方案，适配不同国家、不同地域的育儿理念与消费习惯。</p>\n  <p>目前，奇世智能已规划了多达59款��能母婴产品，覆盖从备孕、孕期、分娩、产后恢复、哺乳到0-4岁婴儿护理及早教的全生命周期。</p>\n  <p>在李志刚看来，母婴场景具有极强的时间连续性，单一硬件容易随婴儿成长被淘汰，但在公司的产品规划中中，从孕期睡眠数据到哺乳喂养记录，能够打通家庭健康数据系统，既能提升用户生命周期价值，更能为公司构筑数据护城河。</p>\n  <p><strong>CEO对谈</strong></p>\n  <p><strong>硬氪：你们规划了多达59款产品，这对于一个不到30人的初创团队来说显得非常“重”。为什么不选择先打磨一两款爆品，等赚到钱了再去拓展？</strong></p>\n  <p><strong>李志刚：</strong>这个行业凑热闹的人很多，但我们不是。我们在硅谷花了近三年时间做产品规划和技术预研，之所以规划这么多，是因为我们把母婴看作一个连续的、长达三四年的完整生命旅程，而不是一个个孤立的消费节点。</p>\n  <p>如果我们只做一款爆品，比如智能婴儿车，婴儿长大了用户就流失了。但通过生态布局，孕期的产品是产后产品的入口，哺乳产品是早教产品的入口，用户在我们的生态里流动而不是流出。同时，这也是数据的要求，只有全周期的数据打通，AI才能真正理解从妈妈睡眠到宝宝发育的因果关联。</p>\n  <p>我们当然会一款一款地去落地推向市场（比如今年先上奶瓶和冲奶机），但在这个赛道，如果你一开始没有全局的生态视野和长远的底层架构，以后再想把这些割裂的数据和体验缝合起来，是根本做不到的。我们想做的是能持续几十年解决核心痛点的事业，而不是赚快钱。</p>", "category": "tech", "published_at": "2026-08-05T02:53:47+00:00", "fetched_at": "2026-08-06T02:07:41.415761+00:00", "fingerprint": "7d7bd6f8bac30295"}, {"source": "36氪 - 最新文章", "title": "好想来：最简单的生意，为股东赚最多的钱", "url": "https://36kr.com/p/3926534429653123?f=rss", "summary": "<p>作者&nbsp;|&nbsp;范亮</p>\n  <p>编辑&nbsp;|&nbsp;张帆</p>\n  <p>不久前，《财富》中国500强榜单发布。按ROE（美元计价口径）对上榜企业进行排序，福建万辰（88%）力压泡泡玛特（56%）夺得第一。</p>\n  <p>ROE（净资产收益率）衡量的是企业1元净资产能够在当年赚得多少利润。对公众而言，福建万辰是一个略显陌生的名字，但万辰旗下的“好想来”量贩零食店已经开遍大街小巷。做金针菇起家的万辰，在短短几年时间里，依靠向量贩零食店业务转型，把营收从5亿做到了500亿，资本市场也给出了4年20倍的回报。</p>\n  <p>不过，量贩零食店本质上是一个低客单价、低利润率的生意。万辰集团究竟是如何跑出如此之高的ROE？这种高ROE又能否持续？</p>\n  <h3><strong>高周转的经营特性</strong></h3>\n  <p>按传统的杜邦分析法，ROE可以分解为：</p>\n  <p>ROE=净利润/股东权益=净利率×资产周转率×权益乘数。当存在少数股东权益，即上市公司仅持有子公司部分股权时，还需要使用归母净利润、归母股东权益的口径。</p>\n  <p>万辰集团在量贩零食产业链中的位置是供应链管理和品牌运营，门店主要依靠加盟商扩张，公司负责选品和供应。由于产品大多来自知名消费品牌，终端售价受限，同时还要给加盟商留足利润空间，2025年万辰集团零食业务毛利率仅12.32%，综合净利率4.71%，对应归母净利率仅约2.61%，因此利润率并不是高ROE的主要来源。</p>\n  <p><strong>在利润率有限的情况下，解释万辰高ROE的关键，就转向了资产周转率和资产负债率。</strong></p>\n  <p>传统的制造业公司，大量资金往往沉淀在购买厂房设备、备货（存货）之中，产品销售后通常也难以快速回款，进一步加大企业的资金负担，降低投入资本的使用效率。2025年我国规模以上制造业平均存货周转天数为22天，应收账款回款天数约69天。</p>\n  <p>但万辰集团和鸣鸣很忙由于产品主要依靠外购，因此并非像传统食品制造业需要投入大量的固定资产。更值得关注的是存货周转和回款速度：</p>\n  <p>万辰集团2025年的存货周转天数为18天，应收账款周转天数仅为0.11天。鸣鸣很忙存货周转天数约12.56天，应收账款周转天数0.44天。更进一步，对比零售行业，中信商超和便利店指数的存货周转天数约52天，应收账款周转天数约5天。</p>\n  <p>极低的存货周转、应收账款周转天数，意味着万辰集团仅需少量资金备货，且货物销售后可以立即回款，极大降低了对资金的占用。</p>\n  <p>总体而言，<strong>这种高周转的业务模式，既是万辰集团、鸣鸣很忙等零食品牌优异运营能力的体现，同时也是量贩零食店持久运营的基础</strong>：持续追踪消费者需求变化，通过小批量灵活供货及时满足需求。</p>\n  <h3><strong>过去以债务融资为主，ROE分母低</strong></h3>\n  <p>但高周转仍不能完全解释万辰的高ROE。鸣鸣很忙的ROE约为28%，二者净利率、周转率相近，差距主要来自资本结构。2025年万辰集团资产负债率达到74.61%，鸣鸣很忙则只有35.84%，万辰的权益乘数因而明显更高。</p>\n  <p>此外，万辰的量贩零食业务并非全部由上市公司持有，计算权益乘数时还需从股东权益中剔除少数股东权益，仅保留归母股东权益，这会进一步缩小ROE的分母。<strong>因此综合来看，万辰集团的超高ROE主要来自高周转、高负债率和较低的归母权益基数。</strong></p>\n  <p><strong>万辰负债率偏高，与其融资方式有关。</strong>自2022年布局量贩零食以来，公司仅在2024年进行过一笔2亿元定向增发，日常运营和并购更多依靠借款，以及延长应付账款账期；鸣鸣很忙则长期采用股权融资。作为上市公司，万辰相较当时未上市、缺乏抵押物的鸣鸣很忙，也天然具有借款优势。</p>\n  <p>不过，万辰能否长期维持当前ROE水平，仍存在较大不确定性。随着利润持续积累，归母净资产将自然增加；如果公司后续完成H股发行并募集权益资金，在其他条件不变的情况下，权益乘数和ROE都可能下降。</p>\n  <p><strong>因此，未来需要重点观察公司的资本配置：是提高分红、维持一定杠杆，还是保留利润、偿还借款并继续收购少数股权。</strong>但即使公司未来权益乘数下降，使万辰ROE逐步接近鸣鸣很忙，只要高周转和盈利能力能够保持，其ROE仍可能处于较高水平。</p>\n  <h3><strong>更多利润正在回归上市公司股东</strong></h3>\n  <p>万辰在量贩零食领域的布局，可以概括为<strong>实控人先在表外孵化部分业务，再由上市公司并表，随后通过外延并购迅速扩大规模，并通过少数股权收购与存量股份转让相配合，绑定被收购品牌的核心人员</strong>。陆小馋最初由实控人表外孵化，好想来、来优品、吖嘀吖嘀和老婆大人则通过并购获得。</p>\n  <p>2024年以来，万辰原股东陆续向彭德建、周鹏、张海国转让上市公司股份。三人均来自被并购品牌的创始或核心团队，截至2026年6月初已进入万辰前十大股东，其中彭德建、周鹏还将表决权委托给实控人王泽宁。</p>\n  <p>这些交易具有两方面意义：<strong>一是让被收购方成为上市公司股东并继续参与经营，强化利益绑定；二是收回部分子公司少数股权，使更多量贩零食业务利润归属于上市公司股东。</strong></p>\n  <p>万辰初期并未收购相关零食品牌的全部股权，因此一部分子公司净资产被计入少数股东权益，相应利润也被计入少数股东损益。<strong>通过后续收购少数股权，原本属于少数股东的部分利润也陆续转为归母利润。</strong></p>\n  <p>具体来看，彭德建、周鹏向上市公司转让子公司少数股权，与其从原股东处受让上市公司股份，虽然相关公告未将二者明确界定为关联安排，不过，其受让上市公司股份的对价与出售少数股权所得大体匹配，股份转让价格相较同期二级市场价格又存在明显折让。<strong>从交易结果看，这一系列安排体现出“退出子公司持股、转为持有上市公司股份”的整体思路。</strong>相比之下，张海国受让股份的价格和规模与前两者存在较大差异，更接近一项单独的股权利益绑定安排。</p>\n  <p>另外万辰集团这种类似“用上市公司股份换子公司股权”的操作，是<strong>通过实控人转让存量股份，而非直接增发的方式来完成。</strong>归母净利润增加，但股本总额并未增加，万辰集团股东的EPS还因此进一步提升，并未损害股东利益，是一个较为巧妙的安排。</p>\n  <p>根据财报披露，万辰集团少数股东损益占净利润的比例，已从2024年的50.65%下降至2026年一季度的约35%。<strong>剩余未收回的少数股权主要由实控人王泽宁持有，如果公司延续此前的整合路径，未来不排除继续将其收购至上市公司体内，但收购方式可能会以增发或上市公司自有资金等途径完成。</strong></p>\n  <h3><strong>门店扩张之后，增长靠什么？</strong></h3>\n  <p>过去几年，万辰的增长主要依赖于门店的急剧扩张。截至2025年底，万辰与鸣鸣很忙分别拥有约1.8万家和2.2万家门店，国内合计市占率超75%。若按当前鸣鸣很忙突破3万家店的进度，预计到2026年底，两家巨头的合计门店数将攀升至5.5万至6万家。</p>\n  <p>由于两家公司约六成门店分布在下沉市场，这一体量正逼近行业物理天花板。按合计5.5万家店、80%的行业市占率反推，全国三线及以下市场的零食店约有4.2万家。若以全国约1.8万个建制镇计算，相当于平均每个镇需要容纳2.3家门店。</p>\n  <p>再按单镇1.52万人、单店年GMV约450万元测算，平摊至镇上居民人均年消费额需达600元（约占2025年我国城镇居民人均食品烟酒消费支出的5%以上）。这一测算虽然粗略，但反映出下沉市场已基本告别可以无脑复制的“跑马圈地”时代，存量门店基数的扩大，将使行业未来的门店增长率自然放缓。</p>\n  <p>为了寻找新增长极，万辰正在探索两条新路径：<strong>一是开发定制化及自有品牌商品，以提高毛利率；二是引入低温短保饮料、冷冻食品及IP授权商品，以提升单店收入。</strong>然而，这些尝试目前尚未在财务报表上得到明显验证，公司总营收依然由新开店驱动。在第二增长曲线形成之前，资本市场对万辰的后续利润增速和估值溢价大都持观望态度。</p>\n  <p>因此，未来判断万辰成长性的指标，必须从“门店总数”切换至同店销售增长率、闭店率、自有品牌收入占比以及新品类毛利率。如果后续门店增速放缓，而上述同店效率指标能够持续改善，公司仍能依靠单店效益和利润率支撑增长；反之，若开店放缓且同店效率无法提升，收入与利润的高增逻辑将难以维持。</p>\n  <h3><strong>以什么视角看万辰？</strong></h3>\n  <p>在量贩零食高成长逻辑的推动下，万辰股价在2023至2025年间累计涨幅超15倍。进入2026年，即便在科技股等板块出现回调的背景下，万辰依旧跑赢大盘，年内逆势上涨。在业务带来显著回报后，市场当前的博弈焦点在于：现阶段估值是否已经透支了未来增长空间。</p>\n  <p>目前，万辰与鸣鸣很忙的静态市盈率均在32倍左右；按2026年Wind一致预期归母净利润计算，两者的动态PE分别为18.3倍和20.59倍。这一偏低的动态市盈率水平，反映了资本市场对连锁门店“触顶放缓”的担忧。</p>\n  <p>类似的担忧早已在其他万店消费企业中上演，例如蜜雪集团（2025年营收增幅约35%）和古茗（增速约46%）的静态估值已分别回落至13倍和16倍左右。这表明，市场定价的核心已不再是历史的高增速，而是门店触及瓶颈后如何维持增长。</p>\n  <p>不过，<strong>即使未来成长增速放缓，万辰轻资产、超高周转的商业特性，也为其提供了极强的自我造血和潜在分红能力</strong>。以当前18.3倍的动态PE反推，公司潜在的最高股息率可超5%。若未来万辰的资金需求（如收购、建厂）逐步减小，并将派息率提升，其潜在股息率将极具吸引力。</p>\n  <p>参考双汇发展等高分红消费股5%至7%的股息率，<strong>万辰完全具备在中长期由“高成长股”向“红利股”过渡的潜质</strong>。因此，当下审视万辰可以采用双重逻辑：向上看，自有品牌及单店新品类的渗透能否接替开店红利，打开单店天花板；向下看，在增速放缓后，其出色的现金流和高周转特性能否转化为高额分红，则成为能否支撑估值的关键。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-08-05T11:18:30+00:00", "fetched_at": "2026-08-06T02:07:41.415755+00:00", "fingerprint": "ff3e11ae8a1de042"}, {"source": "36氪 - 最新文章", "title": "以 AI 赋能名中医传承教育：韩学杰传承工作室与传神素问在京签约", "url": "https://36kr.com/p/3926621101422721?f=rss", "summary": "<p>名老中医���生积累的学术思想与临证经验，如何借助数智技术实现“可学、可传、可续”？2026年8月4日，传神素问（武汉）数智科技有限公司（以下简称“传神素问”）与韩学杰传承工作室在京举行战略合作签约仪式，双方将依托中医大模型与数字孪生技术，共建“中医九法五径智能传承模型”，探索名医学术思想数智化传承的新范式。韩学杰教授出席签约仪式并见证签约。</p>\n  <p>此次合作正值国家“十五五”规划开局之年。2026年7月，《中医药振兴发展“十五五”规划》正式印发，明确提出以数智化转型、中西医协同为牵引推进中医药传承创新发展。在此背景下，本次合作正是对这一战略部署的积极响应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_4fbc5c884b954f7385ffebdadab8aad7@5284654_oswg1424284oswg1265oswg878_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片1</p>\n  <h2><strong>名医经验传承呼唤AI数智化破题</strong></h2>\n  <p>中医药传承历来依赖“师带徒”的口传心授模式，人才培养周期长、优质师承资源有限、名医隐性经验难以系统沉淀，是长期困扰行业的现实课题。与此同时，人工智能技术在医疗健康领域加速落地，但从技术能力到课程教学、案例研学、模拟训练与科研整理等真实应用场景之间，仍存在“最后一公里”的距离。</p>\n  <p>如何让名医“只可意会”的辨证心法转化为可保存、可调用、可训练的数字资产，让基层医师和青年中医能够更高效地学习、验证和应用，正是此次合作的出发点和落脚点。</p>\n  <h2><strong>以韩学杰学术体系为内核，以数智孪生技术为承载</strong></h2>\n  <p>韩学杰教授是第七批全国名老中医药专家学术经验继承工作指导老师、沈氏女科第20代传承人，从事中医药临床与科研近40年，系统构建了中医九法五径临证法则、中医三维七要诊断法则及手舌面三维望诊法等学术成果。其中，中医九法五径临证法则自2020年推广以来，已有数千名基层医师验证其实用性和有效性。</p>\n  <p>传神素问依托母公司传神全栈自主“根原创”的任度大模型核心技术底座，自主研发“传神素问中医大模型”，该模型已通过中国信通院可信AI中医药大模型评估并获得4+级高评级。公司构建了“名中医数字孪生+中医大模型”双引擎技术底座，可将名医的学术思想、临床经验、诊疗思维转化为可保存、可调用、可传承、可迭代的数字化资产，形成“沉淀—学习—训练—应用—迭代”的完整闭环。</p>\n  <p>本次合作立足双方技术创新与中医药学术积淀优势，锚定三大战略路径开展深度协作：</p>\n  <p><strong>一是共建“中医九法五径智能传承模型”。</strong>双方将对韩学杰教授的医案、手稿、专著、课程资料等进行合规脱敏、结构化处理、专家标注与模型训练，构建可交互、可学习、可复盘的数智分身，服务于知识问答、案例推演、辨证训练及临床参考场景。模型明确定位于学术传承、教学辅助与临床参考，不替代医师开展诊断、处方和治疗等医疗行为。</p>\n  <p><strong>二是打造数智化传承教育内容体系。</strong>面向中医爱好者、基层医师和青年中医群体，探索开发课程教学、模拟跟诊、案例研学与辨证训练等模块，构建“教、学、练、用”一体化传承教育闭环。数字孪生不替代真人师承，而是为传统带教增加可重复、可扩展的训练场景，助力解决优质师承资源供需矛盾。</p>\n  <p><strong>三是联合开展中医药标准化与临床科研。</strong>推动临床资料和学术经验的数字化沉淀，为名医经验向标准化、可推广的临床方案转化提供数据基础。</p>\n  <p>签约仪式上，传神素问董事长何恩培表示：“我们的目标不是复制简单的对话工具，而是让AI理解名中医的辨证思维，将其沉淀为可长期传承的数字化资产，转化为青年医生和基层医生可学习、可训练、可调用的工具。”韩学杰教授表示：“希望通过智能传承模型，让更多基层医生和学员能够在学习中与模型交互、复盘，加快对中医知识的理解和灵活运用。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_7eae23579bc2416c8c0ef9adb967552d@5284654_oswg1318223oswg1258oswg775_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片2</p>\n  <h2><strong>赋能中医现代化，探索可复制的名医数智传承新范式</strong></h2>\n  <p>本次合作旨在探索中医AI从“有技术”走向“有场景、有应用、有价值”的落地路径。业内专家指出，此次合作为破解名医传承中“经验难量化、思维难复制、教学难扩展”的痛点提供了新的解题思路。未来，双方将持续推进模型迭代与场景拓展，探索形成可复制、可推广的数智传承模式，助力优质中医药资源下沉基层，为中医药传承创新发展和人才队伍建设贡献数智力量。</p>", "category": "tech", "published_at": "2026-08-05T12:46:00+00:00", "fetched_at": "2026-08-06T02:07:41.415749+00:00", "fingerprint": "2f54a24b880b3fb2"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨长鑫拒绝苹果压价，坚持报价高于三星电子、SK海力士；宇树科技开启科创板IPO初步询价；韩国宣布进入“国家灾难状态”", "url": "https://36kr.com/p/3927280128539015?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>DeepSeek让英伟达市值一夜蒸发4万亿</li>\n   <li>国内首个辅助生殖诊疗AI智能体上线</li>\n   <li>员工用代码17小时删光公司89TB数据，被判五年十个月有期徒刑</li>\n   <li>国内航线燃油附加费8月5日起再次下调</li>\n   <li>段永平对泡泡玛特持股比例降至5.55%</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>苹果考虑将中国长鑫存储纳入新的供应链，但压价失败</strong></p>\n  <p>据韩国IT媒体《Digital Daily》引述业内人士报道，苹果此前为了降低成本，曾考虑将中国长鑫存储纳入新的供应链，但如今在进一步压低采购价格的谈判中遭遇阻力。苹果近期为了缓解下一代iPhone及其他智能设备的制造成本压力，与长鑫存储就LPDDR5X等移动DRAM的供货价格进行了谈判，但其降价要求遭到拒绝。据了解，长鑫存储坚持的报价甚至高于三星电子、SK海力士，或者至少与二者处于相近水平。（中国基金报）</p>\n  <p><strong>宇树科技开启科创板IPO初步询价，市场预估IPO市值或将超400亿元</strong></p>\n  <p>据此前公告，8月5日为宇树科技科创板IPO初步询价日，询价完成后将于8月10日开启申购，网上、网下申购日均为8月10日，缴款截止日为8月12日。</p>\n  <p>本次宇树科技IPO拟募资42.02亿元，公开发行新股4044.64万股，占发行后总股本的10%，发行后总股本为4.04亿股。市场预估宇树科技IPO市值将达到400亿元以上，根据科创板新股申购单位500股和发行预估市值测算，宇树科技IPO发行价格约为104元/股，一签新股约缴款5.2万元，但具体IPO询价偏离情况仍有待市场参与者确定。（央视财经）</p>\n  <p><strong>因高温天气持续，韩国宣布进入“国家灾难状态”</strong></p>\n  <p>韩国总统李在明4日宣布，因高温天气持续，韩国正式进入“国家灾难状态”。他表示，情况非常严重，自5月份以来，全国已报告近2000例高温相关疾病、16人死亡。李在明并强调，面对极端气候常态化，政府须从根本上革新灾害应对体系，提升高温风险意识，以保障国民生命安全。</p>\n  <p>另据韩联社报道，韩国气象厅4日上午11时起对首尔东南和西南区域发布高温重大警报，这是今年6月韩国高温预警系统升级以来，首尔首次发布最高级别高温警报。自2日以来，韩国多地遭遇40摄氏度以上高温天气，其中，庆尚南道梁山日间气温连续五天超过40摄氏度，2日更升至42.5摄氏度，刷新韩国最高气温纪录。受高温天气影响，韩国中暑患者数量持续增加，多人心跳骤停甚至死亡。（韩联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>苹果公司请求法官即刻禁止OpenAI使用其商业秘密</strong></p>\n  <p>苹果公司在指控OpenAI有组织窃取其将发布产品的信息案中再次出击，请求联邦法官立即下令这家人工智能企业停止使用它所指的被窃商业秘密。该公司寻求法庭颁令，要求OpenAI归还所有机密信息，并停止任何获取其它非公开信息的企图。苹果要求该命令在诉讼进行期间持续有效。（新浪财经）</p>\n  <p><strong>OpenAI披露第三方测试越界事件，AI模型评估期间误连公网</strong></p>\n  <p>当地时间8月4日，OpenAI发布声明称，在近期第三方网络安全评估中，因测试环境配置及安全防护调整，旗下GPT-5.6 Sol等模型出现越界接入公网的事件。在英国人工智能安全研究所的测试中，模型因未获明确边界限制且禁用安全分类器，擅自注册外部账号并搭建网络隧道；在测试公司Irregular的评估中，测试环境配置错误导致模型将真实网站误认为虚拟靶机并进行了攻击。OpenAI表示，相关测试已被叫停并完成隔离封堵，未造成实质影响。公司正与业界合作重新审查评估流程，以完善高风险测试的安全标准。（界面新闻）</p>\n  <p><strong>国内首个辅助生殖诊疗AI智能体上线</strong></p>\n  <p>近日，由锦欣生殖旗下成都锦欣信息科技有限公司自主研发的“IVF领航员”（IVF Co-pilot）系统，在四川锦欣西囡妇女儿童医院（毕昇院区）启动试点。据了解，这是辅助生殖领域首个面向医生（To Doctor）的临床辅助AI智能体。该系统面向辅助生殖诊疗全流程，当前聚焦IVF（试管婴儿）促排方案及启动用药的辅助评估。系统将医院临床经验、IVF专业知识、临床算法与本地大模型融入电子病历工作流，为医生提供可比较、可追溯、可复核的辅助信息和临床决策参考。（新浪财经）</p>\n  <p><strong>谷歌AI业务迎重大人事变动：哈萨比斯卸任DeepMind首席执行官，首席科学家迪恩离职</strong></p>\n  <p>谷歌当地时间8月5日宣布，谷歌DeepMind首席执行官杰米斯·哈萨比斯（Demis Hassabis）将转任该部门董事长兼Alphabet首席科学家。现任谷歌首席AI架构师、长期担任哈萨比斯副手的科雷·卡武克丘奥鲁（Koray Kavukcuoglu）将出任高级副总裁，接手哈萨比斯的大部分职责，向Alphabet首席执行官桑达尔·皮查伊直接汇报工作。</p>\n  <p>谷歌另外宣布，长期参与制定谷歌AI战略、已在公司任职27年的首席科学家杰夫·迪恩（Jeff Dean）将离职，同谷歌高级研究员桑杰·格马瓦特（Sanjay Ghemawat）筹建一家独立企业，旨在加速机器学习、科学和工程领域的探索发现。（界面新闻）</p>\n  <p><strong>Meta推出首款AI编程智能体，向Anthropic和OpenAI发起挑战</strong></p>\n  <p>Meta正在推出其首款名为Muse Code的编程智能体，力图挑战Anthropic和OpenAI。这个新工具，类似于Anthropic的Claude和OpenAI的Codex助手，使得人们能够在单一用户界面内更轻松地构建应用程序，同时管理大量AI驱动的数字智能体，这些智能体可以帮助支持软件开发过程。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>华尔街日报：DeepSeek曾让英伟达市值一夜蒸发4万亿</strong></p>\n  <p>《华尔街日报》指出，2025年1月，DeepSeek-R1模型开源发布后，英伟达单日市值暴跌近6000亿美元，叠加科技巨头、电力企业同步下挫，合计市值蒸发约一万亿美元，成为中美AI竞赛一个标志性拐点。如今，DeepSeek时刻的出现正变得越来越频繁。（央视网）</p>\n  <p><strong>员工用代码17小时删光公司89TB数据，被判五年十个月有期徒刑</strong></p>\n  <p>90后算法工程师王某任职北京东城某科技公司，公司曾通知全员将A集群数据迁移至新服务器，王某知情却留存旧集群账号权限。2024年9月3日，他登录旧集群执行强制删库代码后离岗，该程序持续运行17小时，清除89TB文生3D、渲染AI模型与配套训练数据，直接瘫痪公司AI游戏研发线。6月26日本案二审宣判，法院驳回王某上诉，以破坏计算机信息系统罪判处其五年十个月有期徒刑，同时需赔偿企业经济损失20.4万余元。（检察日报）</p>\n  <p><strong>美股三大指数收盘涨跌不一，SpaceX跌超13%</strong></p>\n  <p>36氪获悉，8月5日收盘，美股三大指数涨跌不一，道指涨0.49%，标普500指数跌0.17%，纳指跌0.83%。大型科技股涨跌不一，英伟达涨超3%，奈飞、苹果、英特尔、Meta小幅上涨；SpaceX跌超13%，谷歌跌超4%，特斯拉、亚马逊、微软跌超1%。热门中概股多数下跌，爱奇艺跌超3%，小鹏集团、蔚来、哔哩哔哩跌超2%，网易、百度、京东跌超1%；百济神州、富途控股涨超1%。</p>\n  <p><strong>DeepSeek重启融资，投前估值5000亿元</strong></p>\n  <p>多名交易人士透露，大模型公司DeepSeek重启了第二轮融资，本轮计划募资500亿元，投前估值约5000亿元，并计划将在8月下旬完成签约。DeepSeek在今年4月开启了首轮融资，并在6月完成交割，该轮融资金额500亿元，估值超过3500亿元，成为中国AI大模型史上首轮融资规模最大的公司。多位投资人提到，DeepSeek第二轮融资至少在7月中旬就已开启，但在7月底突然暂停，当时一些谈判候补名单上的投资人被告知签署融资协议的计划暂缓。（财经杂志）</p>\n  <p><strong>SpaceX价值1010亿美元限售股将解禁</strong></p>\n  <p>据彭博社5日报道，马斯克旗下火箭、卫星和AI公司SpaceX股价跌破发行价后，仍未离场的投资者即将面临新一轮考验。价值 1,010亿美元（注：现汇率约合 6,830.56 亿元人民币）的限售股将于当地时间周四解禁，庞大的新增供应可能再次冲击股价。</p>\n  <p>SpaceX在非公开市场经营20多年，投资者结构本就十分庞杂。今年早些时候收购xAI，加上马斯克此前买下Twitter，进一步扩大了股东范围。招股书显示，首轮解禁完成后，SpaceX可交易股票将从目前约6.39亿股增至最多15.5亿股，流通规模增加一倍以上。（IT之家）</p>\n  <p><strong>国内航线燃油附加费8月5日起再次下调</strong></p>\n  <p>从多家航空公司了解到，从8月5日起销售的国内航线机票燃油附加费再次下调。调整后的国内航线燃油附加费标准为：800公里以上航线每位成人旅客收取70元燃油附加费，800公里（含）以下航线每位成人旅客收取40元燃油附加费，相较于调整前分别降低了30元和10元。这是今年6月以来第三次下调国内航线燃油附加费，进一步降低旅客出行成本。（央视新闻）</p>\n  <p><strong>马斯克回应一个月亏掉2.45万亿元：我是（前）万亿富翁</strong></p>\n  <p>马斯克遭遇“黑色七月”，一个月财富缩水约3630亿美元，折合人民币2.45万亿元，相当于亏掉两个“黄仁勋”。如果每天要花掉100万美元，这笔亏掉的钱够他花994年。</p>\n  <p>媒体消息，马斯克一度成为全球首位万亿富豪。但随着SpaceX股价巨震，他的身家快速回落，这一缩水幅度，已经超过全球第二到第十大富豪中，任何一人的全部身家。截至美国东部时间8月1日零点，马斯克的身家回落到6900亿美元，降至去年12月以来的最低水平。面对财富急速缩水，马斯克本人在社交平台上发帖自嘲：“我是（前）万亿富翁。”（看看新闻Knews）</p>\n  <p><strong>美国启动史上最大规模撤籍行动，25人被起诉，包括“假结婚”团伙华人</strong></p>\n  <p>当地时间8月3日，美国司法部宣布，已向联邦法院提起诉讼，寻求撤销25名。</p>\n  <p>根据起诉书，这25人主要瑞典及中国台湾地区等，相关诉讼于7月20日至8月3日期间陆续向联邦法院提交。美国代理司法部长布兰奇在一份声明中表示，这是美国历史上规模最大的一次集中撤销归化公民国籍行动，预告这仅仅是个开始。（中国侨网）</p>\n  <p><strong>每秒2.4公里，SpaceX火箭残骸撞上月球了</strong></p>\n  <p>北京时间8月5日14时35分，一枚在太空中漂泊了近19个月SpaceX猎鹰9号火箭第二级残骸，以每秒约2.4公里的速度撞击月球西侧的爱因斯坦陨石坑附近区域，完成了它最终的宿命。这枚“猎鹰9”号火箭第二级残骸编号为“2025-010D”，来自2025年1月15日的一次重大发射任务。（界面新闻）</p>\n  <p><strong>段永平回应减持泡泡玛特：并非二级市场直接抛售减持，而是期权合约履约</strong></p>\n  <p>36氪获悉，8月5日，据港交所权益披露，段永平管理的H&amp;H International Investment对泡泡玛特H股的持股比例于2026年7月30日从7.65%降至5.55%。段永平在雪球表示，本次减持并非二级市场直接抛售减持，而是期权合约履约，按交易约定交付对应股份造成。</p>\n  <p><strong>于东来发布胖东来未来三年计划</strong></p>\n  <p>8月5日，胖东来创始人于东来在社交平台发布胖东来未来三年要专注完成的计划。（第一财经）</p>\n  <p><strong>商务部：加强无人机相关两用物项对美国出口管制</strong></p>\n  <p>8月5日，商务部发布公告，根据《中华人民共和国出口管制法》和《中华人民共和国两用物项出口管制条例》等法律法规有关规定，为维护国家安全和利益、履行防扩散等国际义务，决定加强无人机相关两用物项对美国出口管制。现将有关事项公告如下：对列入《中华人民共和国两用物项出口管制清单》的无人机及其关键零部件、相关技术对美国出口，逐案从严审核，不适用许可便利措施。本公告自公布之日起正式实施。（央视新闻）</p>\n  <p><strong>美国海关已退回约1000亿美元关税</strong></p>\n  <p>美国国土安全部下属海关与边境保护局官员4日向美国国际贸易法院披露的数据显示，美国海关已退回约1000亿美元此前根据美国《国际紧急经济权力法》征收的关税。美国海关与边境保护局官员表示，超过1280亿美元的关税退款请求已经被受理。当前，已退款金额大约占特朗普政府援引该法征收的1650亿美元关税的60%。（新华社）</p>\n  <p><strong>微软将在雷德蒙德裁员605人</strong></p>\n  <p>8月5日，据报道，微软将在美国华盛顿州雷德蒙德园区裁员605人，裁员自2026年9月4日起生效。（界面新闻）</p>\n  <p><strong>特朗普敦促美参议院通过全年采用夏令时法案</strong></p>\n  <p>美国总统特朗普4日在社交媒体发文，敦促国会参议院尽快通过全年采用夏令时的相关法案，称绝大多数美国人都要求将夏令时永久化。7月14日，美国众议院通过《阳光保护法案》。根据该法案，目前美国实行的夏令时将固定为全年采用的时间，不再每年两次转换，法案同时允许各州申请不实行全年夏令时。在众议院通过后，法案将提交参议院审议，如获通过，将提交总统特朗普签署。（新华社）</p>\n  <p><strong>局域网交易线路关闭，“近交易所”机房租金暴涨</strong></p>\n  <p>随着交易所关闭机房内原有局域网交易线路，将交易行情接入方式统一变更为广域网，一场“近交易所”机房争夺战正悄然进行。“目前金桥（上交所金桥数据中心）周围，标准4000瓦机柜每个月要1万左右，之前大概7000一个月，今年3、4月份就已经‘限售’了。”</p>\n  <p>记者从一位从事机房租赁业务的人士处了解到，目前上交所附近的机房“一柜难求”，相较之前价格大幅上涨。这一说法也得到多家量化机构的证实。“有的租赁价格翻了几倍。”一位量化私募机构人士说，尽管不能进交易所机房，但靠近交易所数据中心对速度提升仍有帮助。（第一财经）</p>\n  <p><strong>周大福周生生老庙金饰每克集体上涨8-10元左右</strong></p>\n  <p>多家品牌金饰价格单日集体上涨8-10元左右。8月5日，周大福足金饰品报1240元/克，单日上涨9元；周生生足金饰品报1237元/克，单日上涨10元；老庙足金饰品报1236元/克，单日涨8元；老凤祥足金饰品报1237元/克，单日上涨9元。（界面新闻）</p>\n  <p><strong>马斯克称硬件制造除中国外无对手，将用火箭技术造数据中心</strong></p>\n  <p>在SpaceX公布二季度财报的电话会上，SpaceX创始人马斯克在回答提问时表示，SpaceX和特斯拉是地球上硬件实力最强的两家公司。“除了中国之外，也许算上中国也是”。马斯克表示，会将从火箭和卫星领域积累的专业知识应用于地面数据中心的规模化建设，“我们发现，即使将制造火箭所积累的少量经验应用到数据中心建设中，也能带来巨大的收益。”马斯克还表示，预计未来的数据中心在电力供应和冷却能力的需求将远超预期。他同时透露，已经和英伟达讨论，预计明年将获得其相当一部分GPU产能。（新浪科技）</p>\n  <p><strong>韩国检方调查石化企业涉嫌价格串通，LG化学等7家公司遭搜查</strong></p>\n  <p>韩国首尔中央地方检察厅公平贸易调查部8月5日对LG化学、韩华解决方案、爱敬化学、OCI、乐天精密化学、PKC、UNID等7家石化企业及相关人员展开扣押搜查，调查其涉嫌对多种石油化工产品进行价格串通。检方怀疑上述企业多年间就PVC、增塑剂、烧碱、盐酸等8类产品的价格上涨进行事前协商。此前，韩国公平交易委员会已于今年5月发现相关涉嫌串通线索，并启动现场调查。（界面新闻）</p>\n  <p><strong>暑期联名经济热度高涨，多家公司加码“IP+消费”</strong></p>\n  <p>暑期消费市场热潮涌动，食品饮料品牌纷纷加码“IP+消费”，密集推出跨界联名活动，抢抓暑期旺季市场。业内人士表示，暑期联名经济热度高涨，背后有双重驱动：一是传统消费赛道竞争日趋激烈，品牌需依托IP传递情绪价值、升级消费体验；二是这一模式契合消费者持续攀升的情绪消费诉求。在政策持续扶持下，“IP+消费”赛道增长空间广阔，消费潜力有望进一步释放。（证券时报）</p>\n  <p><strong>供强需弱格局尚未扭转，生猪价格短期反弹阻力较大</strong></p>\n  <p>短暂反弹后，国内生猪市场再度转弱，现货、期货价格同步承压。数据显示，截至8月4日，国内外三元生猪出栏均价为10.33元/公斤，较7月7日阶段性高点跌超9%；全国农产品批发市场猪肉平均价格回落至15.77元/公斤。近期，生猪期货主力2609合约价格也一度跌至10635元/吨，创下上市以来新低。业内人士认为，养殖端集中出栏叠加高温天气导致猪肉消费进入传统淡季，阶段性供需错配是本轮生猪价格回落的主要原因。与此同时，二季度末全国能繁母猪存栏量已降至3780万头，接近3750万头的正常保有量目标，行业去产能步伐明显加快。（中证报）</p>\n  <h2>上市进行时</h2>\n  <p><strong>东方空间：已启动IPO辅导准备工作</strong></p>\n  <p>东方空间2026年融资动作频繁。此前，东方空间获同创伟业、上海科创、中航弘华、元佑瑞泽等知名专业投资机构数亿元Pre-C轮融资，所融资金将用于“引力二号”大型液体可回收火箭的研发和生产。据悉，东方空间即将完成C轮融资，并已启动IPO辅导准备工作。（证券时报）</p>\n  <p><strong>软银支持的OfBusiness正在考虑重启其在印度的IPO计划</strong></p>\n  <p>据知情人士透露，科技供应链与融资平台OfBusiness的运营方OFB Tech Pvt正考虑重启首次公开募股计划，此次募资规模最高可达8亿美元。该公司由软银集团支持，正与Axis Capital Ltd、摩根士丹利、摩根大通和花旗集团合作，为潜在上市做准备。相关人士表示，不愿透露姓名，因信息属于内部机密。他们称，公司计划最迟于11月提交招股说明书草案。此前数年前曾尝试上市的OfBusiness因市场环境疲软而搁置。此次重启的发行预计将新增最多2亿美元的股份，其余部分由现有股东出售。（新浪财经）</p>\n  <p><strong>中国人工智能公司演语科技据悉考虑香港IPO</strong></p>\n  <p>据知情人士透露，人工智能（AI）设计智能体Lovart背后的中国初创公司演语科技正考虑在香港进行首次公开募股（IPO）。知情人士称，该公司正就潜在的股票发售事宜与顾问进行初步磋商。因讨论为私下进行，这些知情人士要求匿名。与此同时，知情人士表示，演语科技接近通过一笔交易融资，本次融资将使该初创企业的估值达到30亿美元。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>本田第一财季净利润4509.15亿日元，同比增129.3%</strong></p>\n  <p>本田8月5日发布第一财季财报显示，公司当期实现营业收入6.06万亿日元，同比增长13.5%。本期营业利润大幅增长117.4%至5307.67亿日元；税前利润增长107.0%至6050.27亿日元；净利润达4509.15亿日元，同比大增129.3%。基于对市场环境及汇率变化的评估，本田向上修正了全年的业绩预期。公司预计全财年营业收入将达到24.15万亿日元（同比增长10.8%），营业利润预计为6500亿日元，净利润预计为4000亿日元。全年预计每股派息70日元。（界面新闻）</p>\n  <p><strong>英飞凌第三财季营收41.72亿欧元，利润7.97亿欧元</strong></p>\n  <p>英飞凌公布2026财年第三季度（截至2026年6月30日）业绩：营收41.72亿欧元，利润7.97亿欧元，利润率19.1%。基于欧元/美元汇率1.15的假设，公司预计2026财年第四季度营收约47亿欧元，实现13%的增长。利润率预计约为23%。目前公司预计全年营收约为163亿欧元（此前指引为：与上一财年同比显著增长）。调整后毛利率预计继续保持在40%~46%的区间，利润率预计继续维持在约20%的水平。（财联社）</p>\n  <p><strong>嘉能可上半年净利润44.05亿美元，同比扭亏</strong></p>\n  <p>嘉能可8月5日发布了2026年上半年业绩报告。公司营业收入同比增长49%至1,744.3亿美元。期内调整后EBITDA大幅增长86%至101.15亿美元，经营现金流（FFO）同比增158%至81.29亿美元。归属于股东的净利润由上年同期的亏损6.55亿美元大幅扭亏为盈，达到44.05亿美元。嘉能可还公布，公司计划于2026年10月在澳大利亚证券交易所（ASX）进行CDI形式的二次上市，以拓展澳大利亚高达4.4万亿澳元的养老基金及当地资本市场。（界面新闻）</p>\n  <p><strong>闪迪第四财季营收同比增长372%，净利润69亿美元</strong></p>\n  <p>闪迪公司公布2026财年第四季度财务业绩。第四财季营收为89.7亿美元，环比增长51%，同比增长372%；GAAP净利润为69.0亿美元（摊薄每股净收益43.97美元），上年同期净亏损2300万美元。环比营收增长中约三分之一来自销量增加，三分之二来自价格上涨。闪迪2026财年全年营收为202.5亿美元，同比增长175%，GAAP净利润为114.3亿美元（摊薄每股净收益73.76美元），上年同期净亏损16.4亿美元。闪迪预计2027年第一季度营收将在103.0亿至108.0亿美元之间，非GAAP摊薄每股净收益预计在44.00至46.00美元之间。（界面新闻）</p>\n  <p><strong>Shake Shack第二季度总营收为4.176亿美元，同比增长17.2%</strong></p>\n  <p>8月5日，Shake Shack公布2026年第二季度业绩报告。公司第二季度总营收为4.176亿美元，同比增长17.2%。其中公司自营门店销售额为4.034亿美元，授权经营收入为1,420万美元。第二季度同店销售额同比增长3.5%。第二季度调整后息税折旧及摊销前利润为6,120万美元，同比增长3.9%。（界面新闻）</p>\n  <p><strong>迪士尼公司第三财季营收252亿美元，同比增长7%</strong></p>\n  <p>8月5日，华特迪士尼公司公布2026财年第三季度业绩：营收252亿美元，同比增长7%；摊薄每股收益1.51美元，同比下降48%。公司目前目标是在2026财年进行至少90亿美元的股票回购。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“哲源科技”完成近2亿元A2轮融资</strong></p>\n  <p>36氪获悉，北京哲源科技有限责任公司在A2轮获得近2亿人民币融资。本轮融资由圣湘生物携产业基金领投，中科创星作为老股东持续跟进，张江科投等联合跟投。本轮融资将主要用于高价值创新IP的持续产出与全球资产布局，以及基于生命世界模型驱动的AI4S平台升级。</p>\n  <p><strong>红杉资本完成100亿美元新一轮融资</strong></p>\n  <p>红杉资本完成100亿美元新一轮融资。今年已经向除SpaceX之外的投资者回报50亿美元。（财联社）</p>\n  <h2>酷产品</h2>\n  <p><strong>Lucid将在“运营重整”期间推迟推出平价电动车</strong></p>\n  <p>Lucid首席执行官周二表示，该公司计划于2027年下半年推出更实惠的电动汽车，将原定于今年晚些时候的上市计划推迟，目前公司正在进行重大业务审查并削减成本。作为公司所谓“运营重置”计划的一部分，Lucid计划今年节省14亿美元现金，主要通过削减产量和库存来实现，此前该公司第二季度亏损持续扩大。（新浪财经）</p>\n  <p><strong>整理</strong>｜王浩阳</p>", "category": "tech", "published_at": "2026-08-05T23:56:04+00:00", "fetched_at": "2026-08-06T02:07:41.415741+00:00", "fingerprint": "7446fbe2c0c4bf50"}, {"source": "36氪 - 最新文章", "title": "前安克高管做智能房车，获元禾、厚雪等超2亿融资，首款产品2027年初量产｜硬氪首发", "url": "https://36kr.com/p/3924907874318728?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，户外出行硬科技企业松鼠动力近日完成超2亿元A轮系列融资，投资方包括元禾璞华、元禾厚望、厚雪资本、金沙江联合资本、天堂硅谷、中科创达、光远和声基金、不同资本、神骐资本、活水资本及春珈资本等产业资本与专业财务机构。</p>\n  <p>本轮资金将重点投入Evotrex-PG5整车车规级深度验证、研发测试，加快产线搭建与产能扩建工作，全面扩充制造能力，以保证2027年大批量交付目标顺利落地。</p>\n  <p>松鼠动力成立于2023年，是一家聚焦户外电动化与智能化产品研发、制造与全球化运营的硬科技初创企业，旗下品牌Evotrex以自研整车发电储能一体化技术为核心，面向全球户外出行市场，为新一代消费群体提供离网旅居解决方案，致力于推动房车行业的电动化、智能化与能源自主化升级。</p>\n  <p>此前，公司在CES 2026上正式发布了首款产品Evotrex-PG5，定位智能增程拖挂房车，主打离网场景下的能源自持能力，售价12万美元起。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_a3291ded702f4c2dba1f64d57ed1371f@6022551_oswg4101139oswg2140oswg1418_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">松鼠动力首款产品Evotrex-PG5（图源/企业）</p>\n  <p>房车行业的电动化窗口正在打开。这是一个年增量数十万台、存量超过1400万辆的全球市场。随着户外旅居、长途自驾、移动办公、户外商业、应急储能等多元需求持续爆发，具备自主发电、大容量储能、智能能源调度能力的电动拖挂房车，成为出行科技赛道兼具落地确定性与长期增长空间的新风口。</p>\n  <p>据松鼠动力官方数据，Evotrex-PG5预订单量大幅超出内部预期，其中售价159990美元的顶配Premium车型订单占比达90%；北美户外群体购车需求旺盛，消费群体早已突破纯电动车用户圈层，大众市场接受度显著高于预期，以30至45岁的户外运动爱好者为主，涵盖滑雪、冲浪、越野等细分群体。</p>\n  <p>传统房车的电力系统高度依赖营地接入，出厂标配通常仅为2至3度电，用户即便后装电池组，可扩展空间也极为有限。这意味着一旦离开营地，房车的电力供给便无法支撑空调、热水器、厨电等高功率设备的连续运转，长时间离网几乎不可能。</p>\n  <p>松鼠动力的技术方案跳出了“增加电池容量”这一单向思路，采用国内乘用车市场已充分验证的增程路线。PG5配备75升油箱与43度电池组，增程器热效率超过40%，每升燃油可发电超3度，总计可提供约270度可用电量。这一配置意味着车辆在脱离营地的情况下，仍可支撑一个四口之家连续数天甚至一周以上的正常居住用电。</p>\n  <p>反映在行驶场景中，PG5的电机系统在被拖行时可提供辅助动力，缓解电动皮卡拖挂后续航大幅衰减的行业通病；增程器在行驶中可反向为前车充电，实质上构成了“加油—发电—充电”的闭环。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_7c8c446e88194ddf828a1c0da2901905@6022551_oswg5191934oswg2586oswg1414_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">从能源生产到居住体验的重新设计（图源/企业）</p>\n  <p>而在静态场景下，PG5则更接近一个集成车载发电、大容量储能与全域智能能源管理的一体化移动能源平台，而非传统意义上的居住拖挂。除了休闲露营和远程居家办公，它还具备向移动餐车、零售车、景区导览车等商业场景延伸的潜力，甚至可作为家庭储能单元为住宅反向供电。</p>\n  <p>目前，PG5已全面启动全场景可靠性验证工程，测试体系覆盖牵引续航、能源管理系统、行驶稳定、制动安全、车身结构耐久、涉水雨淋及多国合规认证等极限工况，确保增程动力系统在真实复杂环境下的稳定输出，为规模化量产奠定品质基础。</p>\n  <p>能源能力是底盘，而用户所感知到的产品力更多体现在居住体验和智能化交互层面。智能化层面，PG5集成了电动遮阳帘、脚踏板、尾门等控制模块，并配备星链卫星接口，即使车辆在无地面基站覆盖的偏远区域也可稳定联网。针对房车长期停放的特点，PG5还具备家庭储能功能，可通过线路连接为住宅供电。</p>\n  <p>在与用户交互最频繁的内装上，松鼠动力基于预订用户的真实反馈，新增了模块化可拆卸餐桌座椅、72英寸一体式车载巨幕影院、带封闭防虫网的后置露台系统以及多款定制内饰主题。这些配置的调整，团队计划于2026年下半年向所有预订用户同步完整产品更新方案，量产前还将上线可视化配置平台，并支持用户自行组合整车功能与内饰套件。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_2c7bca4cd0a94fb4b39e99ea46a11ce5@6022551_oswg1651982oswg4590oswg1529_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Evotrex-PG5内部模块化设计图样（图源/企业）</p>\n  <p>可以说，松鼠动力对Evotrex-PG5的定位，不是“配置更高的电动化房车”，而是一套从能源生产到居住体验被重新设计的完整系统。</p>\n  <p>从休闲露营、远程居家办公，到户外商业经营与应急备用供电，它既跑在路上，也停在野外，同时还是一个可以按需配置的居住单元，以满足用户对出行自由、能源自主与全场景互联的核心诉求。</p>\n  <p>松鼠动力的产品线规划依托于平台化逻辑，首款PG5定位高端，以确立品牌技术优势并验证市场定价能力，后续公司还将推出在核心体验上保持一致、但配置和材料调整的平价版本，覆盖更广泛的消费群体。团队预判，平台化布局完成后，后续产品的研发和推出节奏将明显加快。</p>\n  <p>“过去传统房车产品同质化严重，经销商是强势方。当我们带着预售订单去谈判时，话语权就发生了转移。”松鼠动力创始人兼CEO萧昂对硬氪表示。目前，随着松鼠动力订单量持续攀升并大幅超出内部预测、多家产业合作意向落地，扩产已成为团队对当前最紧迫的核心任务之一。</p>\n  <p>未来，公司还计划在美国本地搭建覆盖产品规划、交付到全周期维保的完整服务网络，以支撑后续批量化交付的服务需求。</p>\n  <p><strong>以下为硬氪与松鼠动力创始人兼CEO萧昂的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：房车离网能源自持能力的瓶颈业界已有共识，PG5选择增程方案而非纯电大电池路线，底层判断是什么？</strong></p>\n  <p><strong>萧昂：</strong>房车的核心痛点不是“有没有电”，而是“能不能持续有电”，而纯电方案的天花板很明显，它解决的是驻车场景的用电问题，解决不了房车全生命周期的能源自持。</p>\n  <p>我们拆过三个使用场景。驻车场景只是其中之一，另外两个是闲置场景和行驶场景，纯电路线在后者上天然受限。</p>\n  <p>驻车场景下，270度电意味着一个四口之家在野外连续生活一周，空调、热水器、厨电全开，能源冗余度依然充足，你不需要精打细算、不需要关这个关那个来省电。这叫“体验不妥协”。北美市场对这一点极其敏感，他们的使用习惯是24小时不关空调，所以如果产品提供的电量如果只够“够用”，对用户来说就是“不够”。</p>\n  <p>闲置场景很多人忽略了。房车80%的时间停在家里，这是行业长期存在的结构性问题——资产闲置。我们把整车变成一个家庭储能单元，拉根线往家里一接就能反向供电。这个功能在北美有明确市场需求，比如极端天气频发的情况下，电网稳定性差，家庭备电是刚需。</p>\n  <p>行驶场景是纯电路线最大的结构性缺陷。电皮卡拖挂后续航衰减60%到70%是行业通病，不是因为电池不够大，而是拖挂风阻和载重原因，其带来的物理损耗无法通过增加电池容量解决。我们在拖挂端加了驱动电机提供辅助动力，大幅降低续航衰减；同时增程器在行驶中持续发电，维持43度电的大电池满电，停下来以后还可以反向给前车补电。</p>\n  <p><strong>硬氪：PG5计划2027年大批量交付，从样车到年产千台的规模化量产，最大的工程化挑战在哪里？</strong>&nbsp;</p>\n  <p><strong>萧昂：</strong>最大的矛盾，是市场高涨的交付预期与我们对产品耐久可靠性标准之间的平衡，这也是我们本轮融资重点加码整车测试验证的核心原因。&nbsp;</p>\n  <p>我们的产品融合线控底盘动力、增程发电系统、储能逆变、乘用车级的整车结构、内饰以及智能化多套系统，复杂度甚至更甚于一台增程式乘用车。传统房车行业长期依赖手工改装，缺乏标准化车规量产体系。</p>\n  <p>第一重挑战是全维度可靠性验证。北美FMVSS安全、EPA排放、锂电热失控防护、长距离牵引耐久、高低温全域环境测试数百项强制标准缺一不可，任何一项测试整改，都会拉长量产周期，我们不希望为了追赶行业交付节奏压缩验证环节，宁愿投入更多资金与时间完成极限工况全流程摸底，从源头规避批量交付后的质量隐患。</p>\n  <p>第二重挑战是跨领域供应链深度协同。我们增程方案串联燃油发电、牵引助力、双向补能、家用反向供电四大模块，需要同步整合新能源汽车、房车内饰、消费电子等完全不同的供应链体系，要统一对齐车规级品质标准，同步稳定放量，磨合周期远长于单一品类硬件。</p>\n  <p>第三重是出海合规与规模化产线同步落地。北美针对房车的安全、锂电、燃气系统认证类目繁多，批量生产前必须完成全套合规备案；同时全球预订单远超预期，我们一边搭建高标准产线、打通稳定供应链实现年产千台爬坡，一边持续迭代整车耐久测试体系，双线并行不能偏废。</p>\n  <p>行业里不少玩家优先冲交付、牺牲长期可靠性，但我们认为，用户与渠道的口碑是品牌的立命之本。本轮募集资金很大一部分持续投入整车全场景验证，就是要在扩产提速的同时，守住品质与可靠性底线，这也是我们和赛道其他品牌长期差异化竞争的根基。</p>", "category": "tech", "published_at": "2026-08-06T01:30:00+00:00", "fetched_at": "2026-08-06T02:07:41.415727+00:00", "fingerprint": "b97776c84a971382"}, {"source": "少数派", "title": "角落新声｜桌面音箱进化史：换了 4 套搭配，我才明白自己的「心声」", "url": "https://sspai.com/post/112891", "summary": "从最初放个音箱响了就行的混沌，到后来对摆位与频响的死磕，这篇文章记录的，是我如何在这 1 平米的空间里，通过对声音和设备的不断调整，一步步厘清并重构自己精神生活一角的全过程。<a href=\"https://sspai.com/post/112891\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-05T02:15:19+00:00", "fetched_at": "2026-08-06T02:07:39.491427+00:00", "fingerprint": "c7e9e767eefcd686"}, {"source": "少数派", "title": "Bookology：从藏书到笔记，打造你的私人阅读档案", "url": "https://sspai.com/post/112953", "summary": "作为长期阅读的用户，多年以来，我一直在使用Kindle、AppleBooks、PDF等多种工具读书。在管理阅读方面，我使用多款应用来进行：管理书籍我使用的是Calibre；追踪阅读和数据统计，我使用计 ...<a href=\"https://sspai.com/post/112953\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-05T07:15:56+00:00", "fetched_at": "2026-08-06T02:07:39.491421+00:00", "fingerprint": "efb6de7fcaa07f77"}, {"source": "少数派", "title": "196 张盗版碟，和我的游戏启蒙史", "url": "https://sspai.com/post/112831", "summary": "游戏首先要传播出去才会具备被用户接受和讨论的价值，那些曾经陪伴你我的盗版游戏，是否也为今天的你埋下过一颗种子？<a href=\"https://sspai.com/post/112831\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-05T09:24:34+00:00", "fetched_at": "2026-08-06T02:07:39.491414+00:00", "fingerprint": "c101c218efbbeea9"}, {"source": "少数派", "title": "派早报：华为发布尊界 MPV 及多款新品等", "url": "https://sspai.com/post/113110", "summary": "英伟达宣布 Alpamayo 2 Super AI 开放商用、NVM Express 发布十一项规范集更新等。<a href=\"https://sspai.com/post/113110\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-0
