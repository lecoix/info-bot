nce Labs division. The Muse Image model now powers the image-making tools across the Meta AI app, Instagram, and WhatsApp, and it's coming soon to Facebook and Messenger, according to an announcement on Tuesday. It's part of the growing Muse family of AI [&#8230;]", "category": "tech", "published_at": "2026-07-07T20:31:58+00:00", "fetched_at": "2026-07-08T02:14:27.614997+00:00", "fingerprint": "779fe69a19a664e4"}, {"source": "The Verge", "title": "Netflix is about to host videos from BuzzFeed, Condé Nast, and other publishers", "url": "https://www.theverge.com/streaming/962528/netflix-digital-media-brands-streaming", "summary": "Starting on August 3rd, Netflix's streaming library will include video content from dozens of digital media brands including BuzzFeed, Cond&#233; Nast, Hearst Magazines, People Inc, and Tastemade. As reported earlier by TechCrunch, the deal includes a mix of licensed past videos and new ongoing series that would have typically been published on YouTube or other [&#8230;]", "category": "tech", "published_at": "2026-07-07T21:37:19+00:00", "fetched_at": "2026-07-08T02:14:27.614992+00:00", "fingerprint": "2671f7ae2b26e9d4"}, {"source": "The Verge", "title": "Of course viewers are giving up on Netflix shows", "url": "https://www.theverge.com/entertainment/962382/netflix-season-two-viewrship-dropoff-beef-avatar-one-piece-tiktok", "summary": "Even though Netflix is the world's most popular paid streaming service, the company has been struggling to keep viewers watching its series after their first seasons. Beef - the streamer's anthology about people locked in feuds - lost 70 percent of its viewership when it returned earlier this year. There seems to be some confusion [&#8230;]", "category": "tech", "published_at": "2026-07-07T21:58:39+00:00", "fetched_at": "2026-07-08T02:14:27.614986+00:00", "fingerprint": "718442ff55c6dbca"}, {"source": "The Verge", "title": "Meta’s glasses will turn off the camera if you tamper with the privacy light", "url": "https://www.theverge.com/gadgets/962514/meta-privacy-light-tampering-smart-glasses-update", "summary": "Amid public backlash over its smart glasses, Meta announced that it will be updating its glasses with a new feature that will disable the camera when it detects that someone has tampered with or destroyed the glasses' privacy LED light. The update is meant to address modders who have taken actions such as physically drilling [&#8230;]", "category": "tech", "published_at": "2026-07-07T23:55:19+00:00", "fetched_at": "2026-07-08T02:14:27.614977+00:00", "fingerprint": "3f32262a31b3c2f3"}, {"source": "36氪 - 最新文章", "title": "瑞为技术暗盘破发，收盘跌17%｜敲钟时刻", "url": "https://36kr.com/p/3885560015220997?f=rss", "summary": "<blockquote>\n   <p>《敲钟时刻》栏目聚焦企业正式登陆资本市场的关键时刻。每一次敲钟之后，市场都会给出它对一家企业增长、估值与成色的第一重答案。</p>\n  </blockquote>\n  <p>在7月7日下午的暗盘，<strong>视觉具身智能第一股瑞为技术（07656.HK）</strong>破发了<strong>。</strong>暗盘收在17.99港元，较21.66港元的发行价跌16.94%，对应市值54.92亿港元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_b2063cbd802e4df784ed1882a2a42c13@430412560_oswg679827oswg1290oswg2464_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>整个暗盘交易中，盘中最高冲到<strong>25港元</strong>，涨15.4%；最低砸到<strong>16.07港元，</strong>跌25.8%；<strong>振幅高达41.23%</strong>，均价20.26港元，全天成交额5310万港元。</p>\n  <p>瑞为此次IPO，<strong>既没有引入基石投资者，也没有设置绿鞋（超额配股权）机制。</strong>无基石带来的连锁反应是：<strong>全流通、且薄。</strong></p>\n  <p>这次全球发售2808.70万股，仅占发行后总股本的<strong>9.20%。</strong>按发行价算，绝对流通市值只有约6.08亿港元。因为没有基石锁定，这9.20%从上市第一刻起就<strong>全部可以自由交易</strong>。</p>\n  <p>薄盘＋全流通＋无稳价，是一个天然放大波动的组合。可售筹码少，一点买盘就能冲高，一点卖压也能砸穿。暗盘里25.00到16.07港元的巨大区间，就是这种薄筹码在无稳价环境下的双向甩动。它可能在情绪好时助涨，但在情绪弱时，同样会加速下跌。</p>\n  <p>情绪和结构之外，还有估值这本账。按发行价21.66港元，发行后约3.05亿股，发行市值约66.1亿港元，<strong>静态市销率约12.9倍</strong>。<strong>而瑞为2025年收入同比只增长了12.1%，</strong>2023、2024、2025年收入分别为2.42亿、3.95亿、4.43亿元。</p>\n  <p>IPO前的最后一轮E轮，2025年8月完成后的投后估值是人民币35.5亿元。<strong>发行市值约是它的1.61倍，即便暗盘破发后也还有1.34倍。</strong></p>\n  <p>作为18C身份冲刺的新股，瑞为2023、2024、2025年净利润分别是-3258万、+829万、-6815万，中间2024年短暂盈利。</p>\n  <p><strong>但应收账款是压在报表上的大石头。</strong>2025年末，瑞为的应收账款净额高达<strong>5.87亿元，反超全年4.43亿的收入</strong>；周转天数从200天一路飙到<strong>440天</strong>（2025上半年一度1047天）。</p>\n  <p>毛利率最高（59.2%）的智慧民航，2025年收入不升反降24.7%；顶上来的是低毛利（16.4%）的政府驱动安全驾驶订单。</p>\n  <p>暗盘属于场外交易，对这家公司真正的考验，从来不在暗盘那两个小时，而在上市之后。明天首日上市表现如何，持续关注。</p>", "category": "tech", "published_at": "2026-07-07T12:59:57+00:00", "fetched_at": "2026-07-08T02:14:27.412631+00:00", "fingerprint": "4d76fc98a1f2b201"}, {"source": "36氪 - 最新文章", "title": "「德睿智药」获5200万美元B轮融资，AI设计的减肥药已进入3期临床｜36氪首发", "url": "https://36kr.com/p/3885479689465858?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36 氪获悉，德睿智药近期已完成 5200 万美元B轮融资，投资方包括头部人民币和美元基金，凯乘资本为独家财务顾问。募集资金将用于AI制药引擎Molecule Arts Platform（MAP）升级迭代，完善其多智能体（Multi-Agent）协同体系与临床数据闭环（Clinical Data-in-the-Loop），以及推进自研口服GLP-1小分子MDR-001的III期临床和商业化、拓展其他差异化创新药管线。</p>\n  <p>德睿智药的愿景是成为AI Native生物制药公司，创始人兼CEO牛张明拥有多年德国AI医疗上市公司CTO经验。他认为，传统新药研发高度依赖资深专家经验，需要合成数百上千个分子反复试错。但如今，AI技术的突破正有望不断颠覆这一传统路径，将大海捞针般的“试错式”新药研发模式，转变为由数据驱动的可计算、可迭代的“标准化创造”。</p>\n  <p>这也是德睿智药搭建MAP的初衷。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_92db90325a1b449a886c7f9f82d0dbc0@5930287_oswg1303508oswg7680oswg4320_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">德睿智药Molecule Arts Platform（MAP）技术平台示意（图源：德睿智药）</p>\n  <p>据介绍，Molecule Arts Platform（下称“MAP”）平台共分为3层架构：第一层是AI设计层，整合了公司自研的PharmkGPT生物学平台、Molecule Pro小分子制药平台和Molecule Dance结构生物学平台，可覆盖小分子、多肽等多种类型药物从临床前到IND申报的全流程。</p>\n  <p>第二层干湿互补实验平台主要承担数据供给工作，主要由干实验仿真系统Proxima Matrix和湿实验室Proxima Foundary同步运转，持续产出高质量训练数据支撑AI模型迭代。“德睿智药自有200张显卡自主训练生物医药基座大模型、自建数据产线，目的是让制药公司更接近一个能快速迭代的AI Native公司，并通过标准化实验室定制化产出模型需要的高质量数据。”牛张明表示。</p>\n  <p>第三层则是Clinical Pro临床AI平台，它并非简单沉淀临床数据，而是试图把临床反馈纳入研发系统，用于校正前期计算和实验判断。这也是德睿智药区别于其他AI制药企业的核心壁垒。这些反馈部分来自于德睿智药通过自有临床管线积累的临床研究数据或临床数据，比如，Clinical Pro已依托GLP-1管线MDR-001沉淀超1300例脱敏临床相关数据。</p>\n  <p>“我们没有把MAP单纯定义为一个AI工具，而是一套可以持续学习、��化的药物研发系统。其核心愿景是，<strong>通过AI多智能体助手连接起临床前到临床的全流程数据，‘Clinical Data-in-the-Loop’，持续自我迭代。这样，每一条管线无论成败，产生的真实数据都能反向提升平台能力，进而降低后续新药研发成本与失败概率</strong>。”牛张明表示。</p>\n  <p>目前，MAP的首款验证药物MDR-001已于2025年底经进入III期临床阶段。公司已在国内完成招募760名受试者，合作临床中心近50家。若顺利，该药物“有望于未来2-3年内在中国上市”，冲击千亿美金GLP-1市场。</p>\n  <p>回顾MDR-001研发历程，德睿智药团队在8个月内、合成80余个全新小分子的情况下，就完成PCC（临床前候选分子）确认，从立项到启动III期临床用时约为4年半、投入约2300万美金（德睿智药提供数据称，这一效率达到行业平均10倍以上）。而传统方法下，一款创新药从设计到进入III期临床往往需7-9年时间，耗资3-4亿美元。</p>\n  <p>这种高效率并非个例。得益于AI技术的赋能，创业至今，德睿智药团队仅40余人，但已有15条创新管线在研，储备5款PCC、并在在中美两地取得3项IND批件。MDR-001之后，针对胰腺癌等无有效治疗方案实体瘤的WEE1 &amp; YES1双靶点药物MRANK-106也已获批临床。药物类型上，德睿智药的管线资产覆盖GPCR��分子胶、别构抑制剂、双靶点肿瘤小分子等多种前沿药物模态。</p>\n  <p>牛张明认为，随着AI技术逐步全方位进入公司的研发体系，未来AI Native Pharma公司的价值也不再局限于单纯的Biotech框架内。“传统Biotech估值逻辑来自单药NPV模型，而AI Native制药企业验证的是更高效生产药物的方法，就德睿智药而言，这便是MAP系统。随着越来越多药物管线的推进，MAP可以把既往研发经验迁移到后续管线中，形成持续复用的研发飞轮。”</p>\n  <p>这也曾是上一代CADD（计算机辅助药物设计）企业遵循的路径。以全球CADD先驱，市值1200亿美金的福泰制药（Vertex&nbsp;Pharma）为例，公司通过计算机精准设计分子的战略，持续推出数款年销售额超百亿美元的重磅药物，成长为千亿市值制药巨头。其经历证明，掌握最先进计算工具、最高预测精度后，或许能用更精简的资源撬动更大的商业回报。</p>\n  <p>如今，德睿智药希望以此为目标，打造AI时代的福泰制药，让“每一次分子设计、实验数据和临床结果都成为下一轮创新的起点”。公司期待持续将重磅药物推进临床乃至商业化，并以药品销售为公司提供稳定现金流，反哺AI技术平台的迭代，不断产出具备全球竞争力的新药资产。</p>", "category": "tech", "published_at": "2026-07-08T00:00:00+00:00", "fetched_at": "2026-07-08T02:14:27.412626+00:00", "fingerprint": "f7300762c4294ebb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨前华为天才少年吐槽DeepSeek面试，称面试官质疑他抄袭；苹果折叠屏已在量产；特朗普呼吁购买戴尔电脑，引发戴尔暴涨百亿美元", "url": "https://36kr.com/p/3886238403129353?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>网传“7月1日新规：新车智驾芯片自主化率不低于70%”系谣言</p>\n  <p>商业银行不良处置仍在加速，上半年全行业转让核销合计至少5000亿</p>\n  <p>国家外汇管理局：截至2026年6月末，中国外汇储备规模为34163亿美元</p>\n  <p>汇丰暂停向风险较高的私募信贷客户提供贷款</p>\n  <p>SpaceX公布AI数据中心计划，同步推进星链卫星脱轨</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>前华为天才少年吐槽DeepSeek面试，称面试官质疑他抄袭</strong></p>\n  <p>7月6日，前华为“天才少年”李博杰在社交平台公开吐槽DeepSeek的面试流程，提及流程较慢且繁琐，面试官存在态度问题，质疑他抄袭，他感到“被严重冒犯”。面试过程并不愉快，他还被面试官质疑抄袭。“因为在代码面试中有两个屏幕，面试官说我不断在瞟左边的屏幕，说我在抄代码，让我停止抄代码，并说如果我不能证明我没有在抄代码，面试就无法继续下去了。”李博杰选择了终止面试，并认为面试官的表现，与他想象中的DeepSeek不同。</p>\n  <p>李博杰是中国科学技术大学计算机科学博士、华为首批“天才少年”计划入选者，其个人网站介绍显示，他曾在SIGCOMM SOSP、NSDI、ATC、PLDI等顶级会议上发表多篇论文，曾获ACM中国优秀博士学位论文奖和“���软学者”奖学金。他目前正在投身大模型创业，是Pine AI首席科学家。DeepSeek表示在“努力将所有部门的规模扩大至少一倍”，并承诺让新人直接参与最核心、最重要的任务，希望员工能够快速成长为行��顶尖人才。对于这次面试，DeepSeek并未有官方置评。（第一财经）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4a53a5122fbd42318e1dffbd7d7afe8c@5667365_oswg243940oswg1080oswg1598_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">李博杰社媒截图</p>\n  <p><strong>苹果折叠屏已在量产</strong></p>\n  <p>多方消息表明，苹果首款折叠屏iPhone落地进度提速。记者从产业人士处求证获悉，该款折叠屏iPhone已经在量产阶段。代工龙头富士康率先启动大规模招工，为新机生产储备人力。7月7日，赣州富士康发布公众号招聘文章，要求招聘18至50岁员工，主要从事苹果手机精密组件的生产与加工；7月6日，富士康人资发文招募临时工，招聘范围覆盖龙华/观澜苹果A事业群、龙华三赢事业群。据悉上述业务群涉及折叠屏iPhone组装。（上海证券报）</p>\n  <p><strong>特朗普呼吁购买戴尔电脑，引发戴尔暴涨百亿美元</strong></p>\n  <p>美国总统特朗普在白宫活动上再次公开呼吁美国人购买戴尔电脑，其言论引发戴尔股价一度上涨近10%——这已经是最近特朗普第三次为戴尔公司“喊单”。美东时间7月6日，特朗普在椭圆办公室举行了一场“敲钟仪式”，同时敲响纽交所和纳斯达克的开市钟，庆祝“特朗普账户”的首个交易日——这是一种为18岁以下儿童提供税收优惠的投资工具。在仪式上，特朗普专门点名呼吁美国人出门买戴尔电脑：“出去买一台戴尔电脑吧。”而在他身边站着的，正是戴尔公司创始人迈克尔·戴尔本人。特朗普在活动上，直接表达了对迈克尔·戴尔及其妻子苏珊·戴尔的支持和赞美，此前两人已承诺向“特朗普账户”项目捐赠超过60亿美元。这并非特朗普首次公开支持戴尔公司。今年2月和5月，他都曾用类似措辞称赞戴尔公司的捐赠行为。（中新经纬）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯“吐司”iOS版正式上线</strong></p>\n  <p>36氪获悉，7月6日，腾讯旗下的AI应用生成及灵感共创平台“吐司”iOS版正式上线。作为一款零门槛的VibeCoding产品，用户只需用自然语言描述需求，就能借助吐司生成并调整专属App。据了解，吐司将于8月面向开发者生态全量开放一站式上架服务、商业化组件能力以及更多API能力。</p>\n  <p><strong>支付宝AI开放平台开启邀测</strong></p>\n  <p>36氪获悉，7月7日，支付宝正式上线AI开放平台，面向商家、机构、服务商、智能终端、大模型平台等生态伙伴开放AI接入能力。</p>\n  <p><strong>AI小程序成长计划上新混元Hy3</strong></p>\n  <p>36氪获悉，据腾讯公开课，小程序成长计划再次升级，据了解，本次升级把资源扶持加码到底，大模型Token额度从1亿提升至10亿，AI生图额度从1万张提升至10万张；同时模型全面升级至混元最新模型Hy3与Hy Image 3.0生图模型。</p>\n  <p><strong>微软开始在部分软件中改用自研AI模型，减少对OpenAI和Anthropic依赖</strong></p>\n  <p>微软公司寻求降低人工智能成本，正开始在Excel和Outlook等软件产品中以自研模型取代OpenAI和Anthropic的模型。据一位知情人士透露，这两款广泛使用的软件中，每周有数以万计的AI任务由微软内部开发的MAI人工智能模型完成。该知情人士表示，此前Excel和Outlook更多依赖OpenAI和Anthropic的模型。（新浪财经）</p>\n  <p><strong>Meta推出AI图像生成模型，接入聊天机器人和Instagram</strong></p>\n  <p>Meta Platforms Inc．发布一款新的图像生成式人工智能（AI）模型，这是该公司一年前斥资数十亿美元重建AI实验室、由Alexandr Wang担任首席AI官以来首次发布此类模型。该公司在博客文章中表示，这款名为Muse Image的模型周二上线Meta AI聊天机器人。它还将嵌入Meta旗下多款社交应用，包括Instagram和WhatsApp。用户可以利用该模型根据文本提示生成图像，也可以要求它修改现有图片。广告主也将很快能够使用该模型来制作营销材料。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美股三大指数集体收跌，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，7月7日收盘，美股三大指数集体下跌，道指跌0.25%，纳指跌1.16%，标普500指数跌0.45%。大型科技股涨跌不一，Meta涨超2%，亚马逊涨0.75%，英伟达涨0.71%，微软涨0.54%，奈飞涨0.21%，谷歌涨0.16%；英特尔跌超9%，SpaceX、Arm跌超6%，特斯拉跌超4%，苹果跌0.64%。存储芯片股继续下挫，闪迪(SNDK.O)跌7%，西部数据(WDC.O)跌近8%，美光科技(MU.O)跌4.7%。热门中概股多数下跌，爱奇艺跌近7%，富途控股跌超4%，小鹏集团、蔚来、老虎证券、百度跌超2%，哔哩哔哩、拼多多、名创优品、京东跌超1%；唯品会涨超1%，理想汽车涨0.25%，阿里巴巴涨0.23%。</p>\n  <p><strong>网传“7月1日新规：新车智驾芯片自主化率不低于70%”系谣言</strong></p>\n  <p>36氪获悉，近日，有网民发布题为《7月1日新规正式落地！新车智驾芯片自主化率不低于70%》的文章。文中称“7月1日，工信部联合市监总局出台的《新能源汽车车规级AI芯片技术规范》正式强制执行”，并称“国内生产、销售的所有新能源乘用车���智驾芯片全链路关键技术自主化率必须达到70%以上，不达标车型禁止申报、生产、上牌”。经工业和信息化部核查，并未发布过该文件，也从未就新能源车芯片技术自主化率作出规定。</p>\n  <p><strong>商业银行不良处置仍在加速，上半年全行业转让核销合计至少5000亿</strong></p>\n  <p>商业银行仍在加快不良资产的处置。银登中心和机构最新统计数据显示，上半年银登中心转让不良为1011亿元，结合前5个月商业银行不良核销4868亿元，粗略合计上半年全行业不良资产处置至少超5000亿元。（财联社）</p>\n  <p><strong>中国规上工业企业人工智能应用普及率已超30%</strong></p>\n  <p>工业和信息化部科技司副司长甘小斌在7月7日举行的上海市新闻发布会上表示，今年人形机器人全年整机产量有望突破10万台。制造业是人工智能赋能应用的主战场。目前，中国规上工业企业人工智能应用普及率已超30%，人形机器人开始“进工厂、下车间”。目前工业和信息化部正会同各方深入实施“模数共振”“人形机器人与具身智能实景实训”等专项行动，挖掘高价值应用场景。大会期间，中国—金砖国家人工智能发展与合作中心将发布“国际人工智能伦理治理行动计划”。（界面新闻）</p>\n  <p><strong>国家外汇管理局：截至2026年6月末，中国外汇储备规模为34163亿美元</strong></p>\n  <p>36氪获悉，国家外汇管理局统计数据显示，截至2026年6月末，中国外汇储备规模为34163亿美元，较5月末下降260亿美元，降幅为0.75%。2026年6月，受主要经济体宏观经济数据、主要央行货币政策及预期等因素影响，美元指数上升，全球主要金融资产价格表现涨跌互现。汇率折算和资产价格变化等因素综合作用，当月外汇储备规模下降。中国经济总体平稳、向新向优发展，有利于外汇储备规模保持基本稳定。</p>\n  <p><strong>暑假机票价格大跳水，多条热门航线票价低于高铁</strong></p>\n  <p>进入7月，2026年暑运正式启幕。受暑运航班增加、燃油附加费大幅下调等因素影响，今年暑期机票价格成为近年来的“洼地”，7月上旬多条热门航线机票售价甚至低于高铁二等座票价，带动机票预订量大涨。根据航班管家最近几天的票价监测，暑运期间的平均经济舱票价比去年同期和2019年同期都要低。比如暑运第五天（7月5日）的平均票价831.5元，同比2025年下降2.3%，同比2019年下降7.6%；暑运第四天的平均票价822.4元，同比2025年下降2.3%，同比2019年下降2.4%。</p>\n  <p>7月7日，界面新闻查询航旅纵横发现，从北京出发，有多条航线价格低至200元起。具体包括北京—吕梁、北京—鞍山，价格200元起；北京—长治，价格210元起；北京—榆林、北京—太原，价格220元起。另外，北京到长春、武汉、南昌和西安等多个省会城市的机票价格也都在300元以内。（界面新闻）</p>\n  <p><strong>浙大求是鹰商标注册与阿玛尼无关，代理人辟谣浙大连夜抢注商标</strong></p>\n  <p>有网友发现，浙江大学校徽中的“求是鹰”图案和奢侈品品牌阿玛尼的logo相似，引发讨论。</p>\n  <p>杭州恒慧商标事务所有限公司顾问张奕峰负责代理浙江大学的商标注册事务，他告诉第一财经记者，浙江大学之前注册过整体校徽图案的商标，但没有注册过单独的“求是鹰”图形。去年年底对这个图形进行了商标注册申请，主要因为当时有很多小公司在冒用这个图案，和大家提到的奢侈品牌没有关系。（第一财经）</p>\n  <p><strong>亏损加剧叠加需求淡季，7月建材计划产量继续走低</strong></p>\n  <p>据SMM调研重点生产钢企56个样本数据：7月螺纹计划产量742.8万吨，较6月实际产量减少38.97万吨，降幅4.98%；7月螺纹日产23.96万吨，环比降幅8.05%。7月线盘计划产量319.7万吨，较6月实际产量增加1.87万吨，增幅0.59%；但7月线盘日产10.31万吨，环比降幅2.66%。焦炭第十轮提涨发起，落地虽处于博弈阶段，但钢厂6月经过额外的3-4轮提涨，产成材效益持续压缩，部分企业已处于亏损阶段，现阶段钢厂盈利率在33.33%，较6月下降明显，目前普遍效益水平在（-200-100）之间。（财联社）</p>\n  <p><strong>汇丰暂停向风险较高的私募信贷客户提供贷款</strong></p>\n  <p>据英国《金融时报》7日援引知情人士的话报道，汇丰银行最近几周告知部分客户，由于决定停止向收益不足以弥补风险的私募信贷基金放贷，因此将不再续签客户的贷款协议。知情人士还补充说，汇丰银行将转而专注于向风险较低的私募信贷基金放贷。（财联社）</p>\n  <p><strong>韩国股市7月7日再次熔断</strong></p>\n  <p>韩国交易所7月7日公告称，当地时间13时51分34秒，启动KOSPI指数熔断机制，交易暂停20分钟。韩国交易所（KRX）7月7日公告称，当地时间10时23分41秒，因KOSPI200近月期货价格较前一交易日基准价下跌5.12%，触发韩国股市“边车”（程序化交易临时停牌）机制。根据规定，KOSPI市场程序化卖单暂停5分钟，以缓解市场短期剧烈波动。此次触发时，KOSPI200近月期货报1227.32点，较基准价1293.58点下跌66.26点。（界面新闻）</p>\n  <p><strong>智谱涨幅扩大至10%</strong></p>\n  <p>36氪获悉，智谱涨幅扩大至10%。此前智谱辟谣“撤回A股IPO辅导备案”：不属实，存在恶意炒作之嫌，A股发行辅导工作已完成。</p>\n  <p><strong>Omdia：中国半导体市场规模将在2026年超过8000亿美金，存储芯片市场总额暴涨262.9%</strong></p>\n  <p>36氪获悉，Omdia报告显示，2026年中国半导体市场预计同比增长率将大幅上修至92.9%，达8120.8亿美元，相较于《AMFT出货量：中国——2025年四季度更新》版本（2026年中国半导体市场预计增长31.26%，市场规模将达到5465亿美元）整体上调了2656亿美金，增幅达到48.6%。根据Omdia 2026年二季度最新数据显示，2026年中国半导体存储市场预计增长率大幅上修至262.9%，达4496亿美元。</p>\n  <p><strong>SK海力士大幅波动放大杠杆ETF风险，韩国政府称将研究完善措施</strong></p>\n  <p>随着SK海力士股价波动加剧，追踪SK海力士股价两倍涨跌幅的单只股票杠杆交易所交易基金（ETF）之间，收益率差距也扩大至超过5个百分点。市场指出，由于产品结构和基金管理能力的差异正在直接反映到收益率上，投资者需要提高警惕。与此同时，韩国副总理兼企划财政部长官具润哲表示，针对单一个股杠杆产品，“正在讨论完善方案”。（财联社）</p>\n  <p><strong>汇丰暂停向风险较高的私募信贷客户提供贷款</strong></p>\n  <p>据英国《金融时报》7日援引知情人士的话报道，汇丰银行最近几周告知部分客户，由于决定停止向收益不足以弥补风险的私募信贷基金放贷，因此将不再续签客户的贷款协议。知情人士还补充说，汇丰银行将转而专注于向风险较低的私募信贷基金放贷。（财联社）</p>\n  <p><strong>Meta称美国四个州在8月的青少年安全诉讼中寻求1.4万亿美元罚款</strong></p>\n  <p>Meta7月6日在一份法庭文件中表示，美国四个州正寻求对其处以1.4万亿美元的罚款，指控该公司设计其Facebook和Instagram平台旨在使年轻用户上瘾，并误导公众对其安全性存在误解。Meta在回应各州总检察长提交的关于如果各州胜诉应如何计算罚款的文件时提出了这一数字。（新浪财经）</p>\n  <p><strong>SpaceX公布AI数据中心计划，同步推进星链卫星脱轨</strong></p>\n  <p>太空探索技术公司SpaceX7月6日公布了一项新的AI数据中心建设计划，同时确认正在按计划推进约100颗第一代星链卫星的脱轨操作。这标志着这家由埃隆·马斯克领导的航天企业正加速向AI基础设施领域延伸布局。根据公司发布的信息，SpaceX计划在美国中西部建设一座专门面向AI工作负载的数据中心，将直接利用其星链卫星网络提供的高速低延迟数据回传能力。（新浪财经）</p>\n  <p><strong>LG新能源预计第二季度营业利润将因电动汽车需求疲软而下降77%</strong></p>\n  <p>韩国电池制造商LG能源解决方案（LGES）7月7日表示，预计4月至6月的营业利润将下降77%，至1130亿韩元（7391万美元），原因是电动汽车（EV）需求疲软继续拖累电池销售。相比之下，LSEG SmartEstimate的预测利润为2490亿韩元，该预测主要参考了那些预测准确率更高、更稳定的分析师的观点。（新浪财经）</p>\n  <p><strong>智谱基石解禁日获近七成基石投资者表态长期持有</strong></p>\n  <p>7月7日，记者获悉，智谱在基石投资者解禁窗口临近之际，获多家机构投资者明确表态长期看好并将继续持有。表态机构包括JSC International Investment Fund SPC、WT Asset Management、Optimas Capital Limited和智谱早期股东及基石投资人凌云光技术股份有限公司等，合计持股占本次解禁基石股数的近七成，涵盖了国家级战略资本、地方政府产业引导基金、大型国企产业基金及市场化专业投资机构。（证券时报）</p>\n  <p><strong>中国央行连续第20个月增持黄金</strong></p>\n  <p>36氪获悉，据央行数据，中国6月末黄金储备报7544万盎司，5月末黄金储备报7496万盎司，为连续第20个月增持黄金。6月末外汇储备报34162.6亿美元，5月末34422.38亿美元。</p>\n  <h2>上市进行时</h2>\n  <p><strong>玻色量子启动IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，北京玻色量子科技股份有限公司于2026年7月6日在北京证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为国泰海通证券。</p>\n  <h2>大公司财报</h2>\n  <p><strong>招商证券：上半年净利润同比预增93%—112%</strong></p>\n  <p>36氪获悉，招商证券披露业绩预告，预计2026年上半年实现归属于母公司股东的净利润净利润为100亿元—110亿元，同比增长93%—112%。</p>\n  <p><strong>光库科技：上半年净利润同比预增170%—190%</strong></p>\n  <p>36氪获悉，光库科技披露业绩预告，预计2026年上半年实现归属于上市公司股东的净利润1.4亿元—1.5亿元，同比增长170%—190%。</p>\n  <p><strong>瑞芯微：上半年净利润同比预增60.03%—71.33%</strong></p>\n  <p>36氪获悉，瑞芯微披露业绩预告，预计2026年上半年营业收入28.7亿元至29.1亿元，同比增长40.28%至42.24%；归属于母公司所有者的净利润8.5亿元至9.1亿元，同比增长60.03%到71.33%。</p>\n  <h2>投融资</h2>\n  <p><strong>“迈巨微电子”完成数千万元融资</strong></p>\n  <p>近日，“迈巨微电子”完成数千万元融资，由华宝新能领投，老股东欣旺达、启赋资本持续加注，资金将主要用于智能单电芯级多维监测传感器芯片MagiCell™的量产导入、MagicFETs™与MagicAFE™系列产品线的迭代扩产，以及面向工商业储能和汽车电子市场的研发与市场拓展。迈巨微电子是一家专注于锂电池安全管理芯片和智慧电芯传感器芯片解决方案的国产半导体设计公司，已形成覆盖全电压段的完整芯片产品矩阵。</p>\n  <p><strong>“逸文科技（Even Realities）”宣布完成Pre-B轮融资</strong></p>\n  <p>7月6日，“逸文科技（Even Realities）”宣布完成Pre-B轮融资，融资金额为1.5亿美元，投后估值超10亿美元，正式跻身独角兽行列。本轮融资由美团龙珠及美团战投领投，腾讯及其他老股东超额跟投。成立不到三年，逸文科技已经完成多轮融资，投资方包括红杉资本、鼎晖投资、爱尔眼科、青山资本等一众一线机构。（中国基金报）</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-07-08T00:09:01+00:00", "fetched_at": "2026-07-08T02:14:27.412620+00:00", "fingerprint": "5f8a03c510a28f7d"}, {"source": "36氪 - 最新文章", "title": "36氪独家 | 快造科技完成10亿元融资，为一级市场消费级3D打印最大单笔融资", "url": "https://36kr.com/p/3885728813691145?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪独家获悉，消费级3D打印企业快造科技（Snapmaker）于近期完成10亿元新一轮融资。本轮融资由凯辉基金领投，好未来战投跟投，美团战投、美团龙珠、高瓴创投、顺为资本等现有股东大比例超额追投，高鹄资本担任独家财务顾问。</p>\n  <p><strong>这是2025年以来消费硬件赛道规模最大的单笔融资之一，也是近两年一级市场消费级3D打印最大规模的单笔融资。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_cddc5ad8eb444fcd88b935717212245b@5836910_oswg416616oswg864oswg486_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>此外，硬氪独家了解到，得益于U1这代产品，快造科技营收同比增长10倍。</strong></p>\n  <p>过去十年，消费级3D打印经历了从概念到落地的完整周期。不过长期以来，单色、单材料的产品体验将其局限在工程师、极客群体和部分消费者中——用户能打印的东西\"不够好看、不够好用\"，是制约市场破圈的核心瓶颈。</p>\n  <p>\"多色多材\"打印技术的成熟，正在打破这一瓶颈，也是U1破局市场的关键。当一台桌面设备能够同时实现多色外观与多材内里的结合，3D打印的输出物将具备接近消费品的品质——不再是\"打印一个单色零件再进行组装\"，而是\"直接创造出一个可即刻使用的彩色成品\"。</p>\n  <p>这一变化的意义在于技术体验能够跨过\"够用\"门槛，迎接更大的消费级市场。</p>\n  <p>多色多材料已成为消费级3D打印的共识方向。然而，当前行业主流方案依赖单喷头反复换料，每次换色都需要抽料、进料和冲刷，导致打印一个多色模型动辄数十小时，产生大量废料，且较难支持多材料混合打印。这对普通大众而言，远未达到消费级体验。</p>\n  <p>快造科技选择突破更难的技术创新路线。其旗舰产品U1采用4独立工具头+SnapSwap™快速换头系统的全新架构，从底层重新设计多色打印的工作流。相较传统方案，U1实现了5倍打印效率提升、耗材浪费减少约80%。这不是参数层面的渐进优化，而是架构层面的代际跨越。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_e03da1c4c08e4f9882a2a371a4314ffe@5836910_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>市场的反馈已验证该判断：U1在Kickstarter平台筹得2061万美元（约1.5亿元人民币），获得全球超2万名用户支持，刷新全球3D打印品类众筹历史纪录。过去半年，快造科技从众筹爆发到规模化交付，实现新品的闭环验证，<strong>目前已实现超10万台交付</strong>。</p>\n  <p>在快造科技看来，下一步的商业机会在于围绕创造行为本身构建生态——硬件是入口，耗材实现复购，内容社区创造粘性，AI实现创作门槛的降低。</p>\n  <p>硬氪了解到，快造科技今年的战略重心是模型站点建设，帮助用户实现一键打印，并积极探索AI工具的应用，降低3D设计门槛。未来公司希望从单点设备能力走向系统性生态构建：让用户不仅\"能打印\"，更\"想打印、会打印、持续打印\"，真正实现“让每个人都能在物理世界中自由创造”。</p>", "category": "tech", "published_at": "2026-07-08T00:50:00+00:00", "fetched_at": "2026-07-08T02:14:27.412612+00:00", "fingerprint": "39bd01a8bf20414d"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 获上海国投领投，这家量子传感企业产品已落地惯性导航、气体监测等", "url": "https://36kr.com/p/3886301334630407?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_7d290a69b7d74c58a7ac5cdb3d51b253@6221844_oswg529905oswg804oswg535_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，上海量感智能科技有限公司（以下简称“量感智能”）近日已完成数千万元天使轮融资，由孚腾资本（上海国投旗下）领投，六禾创投跟投。</p>\n  <p>量感智能公司于2023年9月成立，由上海交通大学量子感知研究所成员孵化。公司聚焦量子传感方向，已推出的产品覆盖惯性导航、气体监测等市场。公司同步深耕量子 AI 技术研发与应用，推动相关算法和硬件模块快速实现商业化落地。同时，公司结合量子传感与量子智算，致力于打造量子智能传感器。</p>\n  <p>硬氪了解到，量感智能联合创始团队共四人，均来自上海交通大学。其中创始人是国内最早一批从事量子信息科技研究的学者之一，90年代起进入该领域，现为上海交大长聘教授、博导，德国洪堡学者，上海交大量子感知与信息处理研究所所长。</p>\n  <p>量子技术正在经历从实验室到产业化的关键转折。量子传感作为量子信息三大方向之一，与实际应用场景的距离相对更近，落地探索较快。</p>\n  <p>近年来，电力电网对痕量气体监测的刚性需求、惯性导航领域对高精度低成本陀螺仪的迫切期待等，都为量子传感技术提供了明确的市场空间。</p>\n  <p>公司依托自研的光量子增强核心技术，搭建了覆盖量子惯性导航、量子气体监测的产品体系：</p>\n  <p>一是多梯度量子导航设备，可实现降本提效，优化无人装备作业能力，高端技术能够突破国内工艺瓶颈、填补行业空白，适配高端装备、军民相关核心应用场景、科研领域等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4c05ed93177d4ee89e099d552cea7026@6221844_oswg43146oswg314oswg314_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">量子陀螺仪（图源/企业）</p>\n  <p>二是电力量子气体监测设备，检测灵敏、作业高效，可满足高压设备全天候监测需求，有望打破外资品牌的行业垄断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_b93baa656f2645f091d07ab8a3df20c3@6221844_oswg43144oswg385oswg289_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">量子气检仪（图源/企业）</p>\n  <p>公司目前处于小批量试制阶段，已有少量订单交付，客户包括电网公司、航天院所等。</p>\n  <p><strong>以下为硬氪与量感智能公司副总经理陈康的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：量感智能的技术路线与市面上其它量子传感公司有何不同？</strong></p>\n  <p><strong>陈康：</strong>量感智能公司选择光量子增强技术作为核心实现手段，室温即可运行，突破口是“量子增强技术”。针对该技术，创始团队已经研究打磨了超过十五年，相继取得了一批优秀的科研成果、技术成果和工程成果，并在相关应用场景中得到了测试和应用验证。所研制的产品，通过量子增强技术放大微弱信号、抑制系统噪声，可直接与现有传感器架构无缝融合，不改变原有供应链和用户使用习惯，产品具有良好的鲁棒性和稳定性。</p>\n  <p><strong>硬氪：目前量子相关技术都仍较为前沿，你们核心技术的商业落地为何那么快？</strong></p>\n  <p><strong>陈康：</strong>量子精密测量是量子信息三大方向里最贴近产业应用的。特别是，我们的创始团队一直采取“机理探索、技术攻关、样机研制”的思路进行整体布局，因此早期开展的相关技术，经过多年打磨后已经具备了工程实践和应用能力。针对光量子增强技术，我们已经开展不少于15年的机理研究和技术积累，完成了从原理到工程实践的一些列验证，研制出了性能优异的量子增强模块产品，为其它系列产品的研制打下了扎实基础。例如，我们基于量子增强技术研发出微型光量子陀螺仪，核心部分只有米粒大小，却可以达到导航级精度，去年进一步完成了外场星载测试验证，目前正在进行工程实现以及相关应用验证。又如：几年前我们提出了基于量子增强技术的高灵敏、快速、多组分痕量气体检测新方案，并在此基础上研制出了量子气检仪样机，并通过了CNAS第三方检测认证，某电网公司采购后，该产��效果得到认可，现在正在推进后续合作。</p>\n  <p><strong>硬氪：公司接下来的战略重点是什么？</strong></p>\n  <p><strong>陈康：</strong>重点围绕三个方面，公司将继续基于光量子增强技术，以 “量子感知” 为基础、“量子智算” 为高度、“量子感算” 为方向，为客户提供高性能产品和高价值解决方案。</p>\n  <p>一是产品打造；目前以量子传感器扎根市场，打磨产品、优化迭代，以量子陀螺仪为例，在提升精度的同时把体积做小，覆盖军民两用市场。下个阶段，将量子传感器和量子智能相结合，打造量子智能传感设备或者系统。</p>\n  <p>二是市场培育，量子技术对很多行业来说还是新事物，客户需要时间验证稳定性和经济性。去年我们的营收已经突破千万，未来增长我们主要打造现有场景的复制。</p>\n  <p>三是团队扩充，相信有资本的加持后，公司的科研团队和市场团队能够得到快速成长，产品研发的速度和市场开拓的速度能够得到质的提升。为公司打开更大的市场。加速量子产品和产业的实际落地。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>孚腾资本表示：</strong>“十五五”规划将量子科技列为未来产业重点方向，其中量子测量产业化路径最为清晰，能够直接突破高端传感器的“卡脖子”问题，并快速嵌入现有工业与科研体系。上海交大量子感知团队长期深耕量子技术，在量子传感领域实现多项突破性进展。已推出量子陀螺仪（系列）、气检仪（系列）等产品，并在市场得到小试，形成了明确的产业化基础，展现出良好的发展前景。</p>\n  <p><strong>六禾创投表示：</strong>我们坚定看好量感智能在量子精密测量领域的先发优势与技术壁垒。量子信息技术正迎来从实验室走向工程化落地的关键拐点，而高精度量子传感是产业化最先、也最具确定性的核心方向之一。量感智能团队在量子增敏测量技术方面实现了机理创新，其产品方案已在高精度导航定位、气体监测等关键场景完成验证。本轮融资后，我们期待量感智能加速核心产品的批量交付与标杆客户拓展，成为量子精密测量的头部创新力量。</p>", "category": "tech", "published_at": "2026-07-08T01:10:36+00:00", "fetched_at": "2026-07-08T02:14:27.412598+00:00", "fingerprint": "51be2894aa1b5943"}, {"source": "少数派", "title": "新手日记的「为什么」与「写什么」", "url": "https://sspai.com/post/111655", "summary": "如何迈出日常写作的第一步？<a href=\"https://sspai.com/post/1116 ss. It&#8217;s currently on sale for $59.99 ($20 off) at Amazon, matching its best price to date.&#160; From tightening loose screws on furniture to repairing electronics, the [&#8230;]", "category": "tech", "published_at": "2026-07-06T20:24:28+00:00", "fetched_at": "2026-07-07T02:41:10.154882+00:00", "fingerprint": "90cf464d0499a275"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜佑驾创新正式发布四轮足机器人；千问大模型升级实时语音识别大模型Fun-ASR-Realtime", "url": "https://36kr.com/p/3884024701874183?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>郭明錤爆料最新苹果折叠手机：出货量明显不足，或重现“饥饿营销”</strong></p>\n  <p>知名分析师郭明錤分析指出，苹果可折叠iPhone预计2026年下半年出货，但初期供应可能不足。他称自己的行业调查显示，2026年下半年可折叠iPhone的组装出货量约为700万至800万部，第三季度出货量约为50万至100万部，约占苹果总出货量的10%。该产品价格可能在2300至2500美元左右，而供应限制将导致转售价格溢价50%至100%。他认为判断可折叠iPhone销售前景的关键在于2026年末至2027年第一季度。（财联社）</p>\n  <p><strong>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</strong></p>\n  <p>36氪获悉，千问大模型正式升级实时语音识别大模型Fun-ASR-Realtime——一款首字延迟控制在百毫秒级别、识别准确率接近离线模型的流式语音识别模型，支持16种方言和30种语言。</p>\n  <p><strong>沙利文全栈AI云服务报告：阿里云占比40.1%</strong></p>\n  <p>36氪获悉，7月6日，国际市场调研机构沙利文发布《开箱即用的AI云服务——2025中国全栈AI云服务市场报告》。报告显示，2025年中国IaaS、PaaS、MaaS总市场规模达595.9亿元，其中阿里云总收入达239亿元，以40.1%的市场份额位列第一，稳居中国最大AI云服务厂商。</p>\n  <p><strong>宇信科技：公司通过投资专项基金来投资月之暗面股权</strong></p>\n  <p>36氪获悉，宇信科技在互动平台表示，公司通过投资专项基金来投资月之暗面股权。</p>\n  <p><strong>贝斯特：人形机器人业务仍处样品阶段</strong></p>\n  <p>贝斯特公告，公司股票连续3个交易日收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。公司关注到市场对人形机器人等热点概念关注度较高，但公司人形机器人零部件业务仍在样品阶段，2026年上半年相关样品实现营收22.30万元，占公司营收比重约0.03%，业务规模较小，对公司业绩不产生重大影响，未来收益存在重大不确定性。（第一财经）</p>\n  <p><strong>永鼎股份：预计2026年上半年归母净利润5亿元-7亿元，同比增长57%-120%</strong></p>\n  <p>永鼎股份7月5日公告，经江苏永鼎股份有限公司财务部门初步测算，预计2026年半年度实现归属于上市公司股东的净利润50,000万元到70,000万元，与上年同期（法定披露数据）相比将增加18,147万元到38,147万元，同比增加57%到120%。（界面新闻）</p>\n  <h2>投融资：</h2>\n  <p><strong>“开普动能”近期连续完成种子轮及天使轮融资</strong></p>\n  <p>36氪获悉，“开普动能”近期连续完成种子轮及天使轮融资，两轮融资合计金额达数千万元人民币，由零以资本领投、新鼎资本跟投，唯快资本担任长期财务顾问。</p>\n  <p><strong>浙江东方：预计上半年净利润8.72亿元，同比增长约114.25%</strong></p>\n  <p>36氪获悉，浙江东方披露业绩预告，预计2026年上半年归属于母公司所有者的净利润8.72亿元，同比增长约114.25%。</p>\n  <p><strong>大陆集团40亿欧元剥离ContiTech，战略转型聚焦轮胎业务</strong></p>\n  <p>德国大陆集团以40亿欧元出售旗下塑料和橡胶业务ContiTech给孤星基金，预计年底完成交易。此次出售是大陆集团转型为纯粹轮胎制造商战略重组的最后一步，旨在应对全球汽车市场低迷。（界面）</p>\n  <h2>新产品：</h2>\n  <p><strong>腾讯混元Hy3正式发布</strong></p>\n  <p>36氪获悉，7月6日，腾讯混元Hy3正式发布。相比preview版本，它展现出显著强于同尺寸模型且比肩（参数规模2—5倍的）旗舰模型的智能水平，定价进一步降低。据了解，Hy3已在WorkBuddy/CodeBuddy、元宝、Marvis、ima等多个业务接入，API已在腾讯云TokenHub上线，多个海外API平台也将陆续接入。</p>\n  <p><strong>美团LongCat-2.0正式开源</strong></p>\n  <p>36氪获悉，7月6日，美团宣布正式开源LongCat-2.0全部模型权重、推理引擎与核心技术文档。同日，华为昇腾、摩尔线程、沐曦股份等国产芯片厂商，集体宣布完成对该模型的推理适配工作。</p>\n  <p><strong>佑驾创新正式发布四轮足机器人</strong></p>\n  <p>36氪获悉，7月6日，佑驾创新正式发布“Combo”全链路无人物流闭环方案，由其旗下曜行动力打造的四轮足式机器人同步亮相。</p>\n  <h2>今日观点：</h2>\n  <p><strong>野村证券：市场对于“算力过剩”的担忧可能过度了，韩国芯片投资难以快速转化为产能</strong></p>\n  <p>野村证券分析师在最新报告中表示，市场对于“算力过剩”的担忧可能过度了，存储芯片行业距离下行周期还有很长的路要走。市场实际上目前正面临由人工智能需求引发的严重短缺，由于各大芯片厂厂商优先生产利润更为丰厚的高带宽内存（HBM），导致普通DRAM和NAND的供应受限。野村分析师强调，在这样背景下，对于供应过剩的担忧实属过度。由于半导体产业建设和开发周期往往需要很长时间，韩国芯片巨头宣布的项目在数年内可能都不会对供应产生实质性影响。（财联社）</p>\n  <p><strong>华泰证券：关注港股���沽空叠加盈利预期改善的方向</strong></p>\n  <p>36氪获悉，华泰证券研报指出，港股短期建议关注沽空压力较重、盈利预期边际企稳或改善的超跌品种（创新药、电力公用事业等）及高股息防御（银行）。其中创新药基本面继续向上，全球风格再平衡中开始出现补涨，短期空头回补有望延续，建议重点关注业绩指引积极的CXO以及BD潜力大的龙头。对于AI硬件链，短期进一步增配的性价比不高，下一个关键窗口在7月的美股财报季，建议根据浮盈程度对应调整配置敞口。AI软件方面更多是模型领先的个股Alpha机会。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>今年我国电影全产业链产值超2000亿元</strong></p>\n  <p>7月5日消息，2026年暑期消费市场活力涌动，“光影经济”亮眼出圈。在这个“电影的夏天”，超90部类型丰富的影片集中上映，持续点燃大众观影热情。一张小票根连接文旅、商圈、餐饮等多元业态，影院商圈 “双向引流”，观影流量拉动消费增量。今年我国电影全产业链产值已超2000亿元。为持续释放行业动能，国家电影局、市场监管总局出台新规，支持影院业态融合、特色化经营与视听技术升级，推动传统放映厅向沉浸式综合文化空间迭代。内容供给、产业联动、政策赋能多重红利叠加，持续为暑期消费市场注入强劲新活力。（央视财经）</p>", "category": "tech", "published_at": "2026-07-06T10:39:24+00:00", "fetched_at": "2026-07-07T02:41:09.995950+00:00", "fingerprint": "94395b0c5f778400"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨SK海力士本周五将登陆纳斯达克；99万机器人“伴侣”续航撑不过一晚？优必选回应；青海省博物馆回应“国家一级文物发现TCL字样”", "url": "https://36kr.com/p/3884831072514309?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>华为Mate90系列有望搭载基于韬定律的新麒麟芯片</p>\n  <p>央视曝光滴眼液涉事企业被立案，对滴眼液乱象开展调查处置&nbsp;</p>\n  <p>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</p>\n  <p>WPS回应“滥收费、背刺用户”言论</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>SK海力士10日在纳斯达克上市290亿美元规模ADR，创外资企业史上最大规模</strong></p>\n  <p>据报道，SK海力士将以约44万亿韩元规模的美国存托凭证（ADR）在纳斯达克上市，挑战外资企业在美国股市上市的历史最大规模。纳斯达克上市后，SK海力士可在美国正规市场进行交易，并获得纳入纳斯达克100等主要指数的资格，追踪相关指数的交易所交易基金（ETF）的买入资金流入也备受期待。不过，也有声音对AI存储半导体板块的急涨势头是否过热提出警示。随着大型科技企业持续通过债券和股票市场筹集数据中心投资资金，外界对存储行业景气能否持续的担忧与日俱增。（界面新闻）</p>\n  <p><strong>99万机器人“伴侣”续航撑不过一晚？优必选：属行业普遍情况</strong></p>\n  <p>近日，优必选最新发布的全尺寸超仿生机器人U1备受外界关注，其中U1 Ultra男版价格高达99万元，但续航却仅能维持2到4小时，“撑不过一晚”，因此遭到外界质疑。7月6日，优必选方面回应界面新闻称，目前全尺寸人形机器人续航基本上都在2-4小时，这是行业普遍情况。优必选面向家庭和个人的仿生机器人主要是半身版U1 Lite和高配全身版U1 Pro，U1 Ultra是高动态版本，面向商业场景。优必选方面还强调，仿生机器人定位是情感陪伴，这是国家提倡和认可的方向，不是男友、女友或者伴侣。（界面新闻）</p>\n  <p><strong>青海省博物馆回应“国家一级文物发现TCL字样”&nbsp;</strong></p>\n  <p>近日有网友关注到，中国工艺美术馆举办的艺术展上，国家一级文物永乐款鎏金铜观音菩萨像展柜内，从造像下方仰观，观音裙摆、脚踝区域能清晰看见TCL字样。2026年7月6日上午，澎湃新闻致电青海省博物馆，一位工作人员介绍，网友看到的TCL广告字样是一张报纸。这位工作人员介绍，这尊永乐款鎏金铜观音菩萨像2000年左右从瞿昙寺移交至青海省博物馆时，文物的这处就有这张报纸，这张报纸起到封底的作用。</p>\n  <p>佛像封底通常是“装藏”的最后一步。“装藏”是佛教造像仪轨的一项重要内容，是指在塑造或建造好的佛像、佛塔内装入圣物，以此来赋予塔像“神力”的行为。从目前的考古发现来看，已有一些能明确体现装藏的例子，但并不多见。上述工作人员提到，这尊菩萨像封底损坏了，为防止里面的香灰、柏香等物品掉落，瞿昙寺的僧人用报纸封住。“那时候条件没这么完善，没有海绵、无酸纸等这种包装。”这位工作人员解释，用报纸是很常见的操作。</p>\n  <p>此外，青海省博物馆另一位工作人员还提到，瞿昙寺僧人用报纸封底之后，为了保护文物，移交到青海省博物馆之后他们没有再打开。从藏传佛教装藏的情况来看，里面都会有香灰、柏香，有些保存好的装藏还会有经书、宝石。另据青海省文物局一位工作人员介绍，2026年7月5日晚，青海省博物馆已组织专家和技术人员飞赴北京核实文物底部出现TCL字样一事，核实后第一时间会发布情况说明。（澎湃新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_b84b947b83744afcb2e648db1bb17f5a@5667365_oswg26317oswg800oswg440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <h2>AI最前沿</h2>\n  <p><strong>千问大模型升级实时语音识别大模型Fun-ASR-Realtime</strong></p>\n  <p>36氪获悉，千问大模型正式升级实时语音识别大模型Fun-ASR-Realtime——一款首字延迟控制在百毫秒级别、识别准确率接近离线模型的流式语音识别模型，支持16种方言和30种语言。</p>\n  <p><strong>微软Teams加强第三方AI智能体权限管理��需会议组织者确认后方可放行</strong></p>\n  <p>微软发文，宣布为Microsoft Teams会议应用推出全新的AI机器人管理策略，当第三方AI机器人尝试加入会议时，必须先获得会议组织者批准后才能进入。据介绍，目前微软已在Teams管理中心新增“Manage external bots and their access to meetings”管理策略，该功能默认启用，管理员可将该策略应用于指定用户或用户组，当Teams检测到外部AI机器人尝试加入会议时，会先将其置于会议等候室（Lobby），只有在会议组织者确认批准后，机器人才能正式加入会议。当然管理员也可根据企业需求选择关闭这一功能。（新浪财经）</p>\n  <p><strong>腾讯混元Hy3正式发布</strong></p>\n  <p>36氪获悉，7月6日，腾讯混元Hy3正式发布。相比preview版本，它展现出显著强于同尺寸模型且比肩（参数规模2—5倍的）旗舰模型的智能水平，定价进一步降低。据了解，Hy3已在WorkBuddy/CodeBuddy、元宝、Marvis、ima等多个业务接入，API已在腾讯云TokenHub上线，多个海外API平台也将陆续接入。</p>\n  <p><strong>英伟达AI服务器架构据传将延后推出，公司回应称路线图并没有改变</strong></p>\n  <p>由于有消息称英伟达的下一代人工智能（AI）服务器机架架构因制造困难将推迟一年以上推出，亚洲印刷电路板（PCB）板制造商的股价重挫。研究机构SemiAnalysis在X平台发文称，英伟达Kyber NVL144架构系统在PCB制造环节遭遇挫折。英伟达发言人通过书面声明回应称，“我们的路线图并没有改变”。（新浪财经）</p>\n  <p><strong>沙利文全栈AI云服务报告：阿里云占比40.1%</strong></p>\n  <p>36氪获悉，7月6日，国际市场调研机构沙利文发布《开箱即用的AI云服务——2025中国全栈AI云服务市场报告》。报告显示，2025年中国IaaS、PaaS、MaaS总市场规模达595.9亿元，其中阿里云总收入达239亿元，以40.1%的市场份额位列第一，稳居中国最大AI云服务厂商。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>苹果首款折叠屏iPhone Ultra，今年最多产不到千万台</strong></p>\n  <p>7月6日，博主定焦数码爆料，苹果首款折叠屏iPhone Ultra目前已开始小批量生产，最快将在本月底进入大规模量产阶段。由于国内代工厂生产人员紧缺，相关产线正在紧急招工，用工需求十分迫切。值得注意的是，蓝思科技集团近日发布了大规模急招信息，扩招岗位涵盖操作工人、质检员、包装员、技术员等多个类别，月薪5500至7500元，提供包吃住待遇并报销路费，无经验者亦可入职。业界普遍认为，蓝思科技此次集中扩招，极有可能是在为苹果折叠屏iPhone Ultra的量产做人力储备。（快科技）</p>\n  <p><strong>华为Mate90系列有望搭载基于韬定律的新麒麟芯片</strong></p>\n  <p>7月6日，从知情人士处获悉，将于今年秋季发布的华为Mate90系列，计划搭载基于韬定律的新麒麟芯片。华为于今年5月发表了指导半导体产业发展的新原则——韬（τ）定律，其目标是以系统性降低时间常数τ为核心，通过逻辑折叠等技术，持续压缩芯片内部的信号传播时延，从而不断提升晶体管密度，实现半导体与电子系统的持续演进。而将于2026年秋季面世的麒麟芯片，率先采用了逻辑折叠技术，性能大幅提升。（财联社）</p>\n  <p><strong>中公教育：公司近期生产经营情况正常，内外部经营环境未发生且未预计将要发生重大变化</strong></p>\n  <p>36氪获悉，中公教育公告，公司近期生产经营情况正常，内外部经营环境未发生且未预计将要发生重大变化。公司目前没有任何根据深交所《股票上市规则》规定应予以披露而未披露的事项或与该事项有关的筹划、商谈、意向、协议等；董事会确认公司不存在有根据深交所的规定应予以披露而未披露的、对公司股票交易价格产生较大影响的信息；公司前期披露的信息不存在需要更正、补充之处。</p>\n  <p>36氪获悉，深交所发布通报，2026年7月6日，中公教育股票价格出现异常波动，上市公司已发布交易风险提示公告。深交所密切监控该股交易情况，对影响股票正常交易秩序的异常交易行为，依规对相关投资者采取了暂停交易等监管措施。深交所提醒广大投资者关注投资风险，合规审慎交易。</p>\n  <p><strong>WPS回应“滥收费、背刺用户”言论</strong></p>\n  <p>7月6日，针对近期有关“WPS滥收费、背刺用户”的言论，金山办公WPS办公助手发文回应称：WPS免费基础功能在持续增加，从未、也不会将已有免费基础功能变成收费功能；会员权益不上移、不缩水，极个别权益因体验、技术或合作原因确需下架，会提前公告并给出解决方案；少数第三方服务和AI办公智能体等高成本服务，会通过独立权益包或按量计费提供，用户可按需购买，并与WPS会员权益明确区分。（第一财经）</p>\n  <p><strong>快手：腾讯持股比例将由约15.68%下降至9.37%，不再为本公司主要股东</strong></p>\n  <p>36氪获悉，快手公告，已获悉腾讯控股有限公司于2026年7月6日（交易时段后），透过场外大宗交易方式向若干买方出售合共272,947,700股本公司B类股份，该等买方为若干独立第三方且与本公司及其关连人士并无关连。出售事项完成后，腾讯持股比例将由约15.68%下降至9.37%，并不再为本公司主要股东。腾讯表示，其对本集团长远发展前景拥有信心，双方亦会继续维持共赢关系，包括延续双方的战略合作。本公司预期出售事项将不会对本集团营运产生任何重大不利影响。</p>\n  <p><strong>上半年上海脑机接口融资事件数量占全国近60%</strong></p>\n  <p>在6日举行的“活力中国调研行”上海站主题采访活动情况介绍会上，上海市科委主任骆大进表示，上海强化战略敏捷，超前布局前沿科技与未来产业。目前，重点跟踪的战略前沿领域已增至20个。全市集聚脑机接口企业数量占全国1/3，上半年融资事件数量和披露金额分别占全国近60%和40%；集聚了全国半数的中性原子量子计算整机企业、硅光和第四代半导体企业。打造了4个市级未来产业集聚区、2个未来产业培育区。（第一财经）</p>\n  <p><strong>爱仕达与智元机器人签署战略合作协议，五大方向开展深度合作</strong></p>\n  <p>爱仕达下属人形机器人子公司与智元机器人于7月6日正式签署战略合作协议。根据协议，双方将在采购订单与产品交付、具身智能机器人委托制造、具身智能机器人供应链合作、技术支持及场景化赋能、股权投资及合资公司设立五大方向开展深度合作。（财联社）</p>\n  <p><strong>保时捷考虑在德国再裁减4000个岗位</strong></p>\n  <p>当地时间7月5日，据报道，知情人士表示，保时捷考虑在其祖文豪森工厂再裁员多达4000人，此前该公司已同意削减3900个岗位。其中，行政和管理部门将尤其受到影响。下一轮裁员的具体规模预计将在7月底前确定。此外，报道称，保时捷还可能将其魏斯阿赫研发基��的产能减少约30%。（界面新闻）</p>\n  <p><strong>海力士半导体大连公司法定代表人变更</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，爱思开海力士半导体（大连）有限公司发生工商变更，朴元星卸任法定代表人、董事，由李秉起接任。该公司成立于2021年5月，注册资本31亿美元，经营范围包括集成电路制造、集成电路芯片及产品制造、电子元器件制造、集成电路芯片设计及服务等，由SK海力士株式会社全资持股。</p>\n  <p><strong>捷豹路虎中国经销商停售所有国产车型，经销商十年亏损渠道缩水近六成</strong></p>\n  <p>据报道，2026年7月捷豹路虎中国经销商停止进购所有国产车型。此前2026年3月国产车型全系停产（发现运动版、捷豹XEL、XFL、E-PACE已于2025年陆续停产），合资公司终结了所有国产车型生产与销售。多位经销商透露，自2015年国产车型投产以来，国产车在经销端几乎全线亏损，十年间单车平均亏损约3万元。</p>\n  <p>厂家通过进口车与国产车配额捆绑的商务政策（为获得高利润进口车资源，经销商被动承担损失），长期库存压力与配额绑定侵蚀渠道利润并透支国产车型价格体系。2018年经销商数量达历史顶峰约240家，截至目前锐减至百余家（正常运营仅约90家），渠道规模缩水近六成。（财经汽车）</p>\n  <p><strong>央视曝光滴眼液涉事企业被立案，对滴眼液乱象开展调查处置</strong></p>\n  <p>7月5日，总台报道了网售“健字号”滴眼液乱象。河南省南阳市镇平县两家企业在获得行业协会的“健字号”批文后，或提供包装或违规生产所谓“保健用品”，并宣传其护眼功效。目前，已依法控制两家涉事企业的法定代表人和实际控制人袁某某、王某、李某某，对企业涉嫌违法违规行为立案调查；依法查封相关生产设备、材料和台账资料等；向涉事外省企业所在地市场监管部门发函协查；协调网络销售平台下架相关产品。（央视新闻）</p>\n  <p><strong>郭明錤爆料最新苹果折叠手机：出货量明显不足，或重现“饥饿营销”</strong></p>\n  <p>知名分析师郭明錤分析指出，苹果可折叠iPhone预计2026年下半年出货，但初期供应可能不足。他称自己的行业调查显示，2026年下半年可折叠iPhone的组装出货量约为700万至800万部，第三季度出货量约为50万至100万部，约占苹果总出货量的10%。该产品价格可能在2300至2500美元左右，而供应限制将导致转售价格溢价50%至100%。他认为判断可折叠iPhone销售前景的关键在于2026年末至2027年第一季度。（财联社）</p>\n  <p><strong>苹果供应商立讯精密据悉香港的上市价格定在区间顶端</strong></p>\n  <p>苹果供应商立讯精密据悉香港的上市价格定在区间顶端。（21财经）</p>\n  <p><strong>中国航天科技集团商业火箭公司增资至41.7亿，增幅约199%</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，中国航天科技集团商业火箭有限公司发生工商变更，注册资本由13.96亿人民币增至约41.7亿人民币，增幅约199%。该公司成立于2024年9月，法定代表人为候正全，经营范围包括民用航天发射技术服务，火箭控制系统研发，火箭发动机研发与制造，火箭发射设备研发和制造，特种设备设计，技术服务、技术开发、技术咨询、技术交流、技术转让、技术推广等，由中国航天科技集团有限公司、中国长城工业集团有限公司、上海航天设备制造总厂有限公司等共同持股。</p>\n  <p><strong>英特尔回应CPU涨价，入门级产品基本保持原价</strong></p>\n  <p>继DRAM、NAND Flash等存储器价格持续上涨之后，CPU成为最新加入涨价阵营的核心零部件。7月6日，英特尔对该媒体确认了涨价信息。英特尔表示，价格调整是基于不断变化的市场动态定期对供应链以及与之相关成本的持续监控。根据行业对英特产品涨价前后的对比调研，此次涨价主要针对部分消费级酷睿Ultra处理器以及Xeon服务器处理器。其中，高端Xeon服务器产品整体涨幅达到7%至12%，而入门级产品基本保持原价；消费级产品也仅对酷睿Ultra 7 270K Plus、酷睿Ultra 5 250K Plus等部分型号进行了调整。（第一财经）</p>\n  <p><strong>美联储7月维持利率不变的概率为77%</strong></p>\n  <p>据CME“美联储观察”：美联储7月维持利率不变的概率为77%，累计加息25个基点的概率为23%。 美联储到9月维持利率不变的概率为41.9%，累计加息25个基点的概率为47.6%，累计加息50个基点的概率为10.5%。（财联社）</p>\n  <p><strong>印度市场监管机构拟大幅放宽投资者做空股票的限制</strong></p>\n  <p>据报道，知情人士透露，印度市场监管机构计划大幅放宽投资者做空股票的限制，将可用于融券借贷的股票数量近乎翻倍。印度证券交易委员会还计划降低股票融券的保证金要求。（界面新闻）</p>\n  <p><strong>花旗获准成为LPMCL第五家清算行，贵金属业务取得重大进展</strong></p>\n  <p>花旗周一表示，已获准成为第五家在伦敦场外黄金市场进行交易清算的银行，标志着其贵金属业务取得重大进展。此举拓展了支撑日均交易额约1600亿美元的伦敦黄金市场的清算网络，使花旗集团能够直接参与全球贵金属交易的核心结算业务。（财联社）</p>\n  <p><strong>研究人员借助AI技术发现两种新型超导体</strong></p>\n  <p>芬兰阿尔托大学参与的一个国际研究团队利用人工智能（AI）发现两种新型超导体，为更高效筛选和研发超导材料提供了新的技术路径。这一成果有助于加快新型超导体研发进程，为寻找可在室温下工作的超导材料带来新的希望。（新华社）</p>\n  <p><strong>博通将为苹果开发定制ASIC芯片产品，同意扩大技术协作至2031年</strong></p>\n  <p>博通7月6日向美国证监会提交文件，宣布与苹果公司将签署多年期协议，把双方长期技术合作关系延续至2031年。根据协议，博通将为苹果多代产品开发并供应一系列定制ASIC芯片产品。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，7月6日收盘，美股三大指数集体上涨，道指涨0.29%，纳指涨1.12%，标普500指数涨0.72%。大型科技股涨跌不一，特斯拉涨超6%，Meta、Arm涨超2%，谷歌、苹果涨超1%，亚马逊、英伟达小幅上涨；奈飞跌超2%，SpaceX、微软跌近1%。热门中概股普涨，爱奇艺涨超5%，蔚来、B站涨超4%，小鹏集团涨超3%，网易涨超2%，腾讯音乐、阿里巴巴、拼多多涨超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>深圳四方精创资讯股份有限公司再次向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳四方精创资讯股份有限公司再次向港交所提交上市申请书，联席保荐人为招银国际、国信证券。</p>\n  <p><strong>阿根廷可再生能源公司Genneia冲刺美股IPO</strong></p>\n  <p>阿根廷可再生能源生产商Genneia上周四向美国证券交易委员会（SEC）提交文件，计划通过首次公开募股（IPO）筹集至多1亿美元资金，有望成为2019年以来首家在美国上市的阿根廷企业。该公司计划在纽约证券交易所和阿根廷证券交易所双重上市，股票代码为“GENN”。（财联社）</p>\n  <p><strong>超颖电子：拟发行H股并在香港联交所主板挂牌上市</strong></p>\n  <p>36氪获悉，超颖电子公告，公司拟发行H股股票并在香港联交所主板挂牌上市。公司将充分考虑现有股东的利益和境内外资本市场的情况，在股东会决议有效期内或股东同意延长的其他期限内选择适当的时机和发行窗口完成此次H股发行上市。</p>\n  <h2>大公司财报</h2>\n  <p><strong>三星电子预计第二季度营业利润同比暴增1810%</strong></p>\n  <p>三星电子公布第二季度业绩预告，第二季度销售额171.00万亿韩元，同比增长129%，预估169.23万亿韩元，上年同期为74.6万亿韩；第二季度营业利润89.40万亿韩元，同比增长1810%，预估84.2万亿韩元，上年同期为4.7万亿韩元。（财联社）</p>\n  <p><strong>新凤鸣：上半年净利润同比预增94.59%—111.51%</strong></p>\n  <p>36氪获悉，新凤鸣披露业绩预告，预计2026年上半年实现归属于母公司所有者的净利润13.8亿元到15亿元，同比增长94.59%到111.51%。报告期内，行业新增供给有序放缓，景气度回升，市场供需关系优化，产品价差进一步扩大，毛利率同比提升，主营业务盈利能力改善。</p>\n  <p><strong>万华化学：上半年净利润同比预增60.05%—69.85%</strong></p>\n  <p>36氪获悉，万华化学披露业绩预告，预计2026年上半年实现归属于上市公司股东的净利润98亿元到104亿元，同比增长60.05%到69.85%。</p>\n  <p><strong>浙江东方：预计上半年净利润8.72亿元，同比增长约114.25%</strong></p>\n  <p>36氪获悉，浙江东方披露业绩预告，预计2026年上半年归属于母公司所有者的净利润8.72亿元，同比增长约114.25%。</p>\n  <h2>投融资</h2>\n  <p><strong>英国GEO公司geoSurge完成1200万美元种子轮融资</strong></p>\n  <p>36氪获悉，总部位于伦敦的AI公司geoSurge宣布完成1200万美元超额认购的种子轮融资，用于推进其在AI可见性领域的全新方法，帮助品牌塑造自身在ChatGPT、Gemini、Claude等生成式AI系统中的呈现方式。本轮融资由AlbionVC领投，Play Ventures、Octopus Ventures、Celero Ventures、Boost Capital参投，现有投资方Passion Capital与Tuesday Capital跟投，并获得来自Google DeepMind、Microsoft AI与Signal AI的多位天使投资人支持。</p>\n  <h2>酷产品</h2>\n  <p><strong>佑驾创新正式发布四轮足机器人</strong></p>\n  <p>36氪获悉，7月6日，佑驾创新正式发布“Combo”全链路无人物流闭环方案，由其旗下曜行动力打造的四轮足式机器人同步亮相。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-07T00:15:11+00:00", "fetched_at": "2026-07-07T02:41:09.995943+00:00", "fingerprint": "4b46685195ef0170"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨上科大博士团队加速国产超高速光电探测芯片量产，获千万级天使轮融资", "url": "https://36kr.com/p/3884289424437511?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_86e8a7fe5e73441aa2345416e68dcc99@6221844_oswg884550oswg1073oswg723_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2000</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，上海快粼光电科技有限公司（以下简称“快粼光电”）近期已完成数千万元天使轮融资。本轮融资由小苗朗程领投，一村资本跟投。中岚科创担任长期财务顾问，提供产业协同和资本对接服务。此次募集资金将主要用于公司超高速光探测芯片的研发迭代与送样验证，加速国产光探测芯片量产进程以及企业高端人才引进。</p>\n  <p>快粼光电2024年成立于上海，是一家专注于III-V族高速光电探测芯片的研发与产业化的硬科技公司，曾在AI光互联与6G通信核心的光芯片领域刷新世界纪录，填补了国内超高速收端光芯片的空白。</p>\n  <p>快粼光电的核心团队由4位师出同门、平均年龄不到30岁的年轻博士组成。创始人李林泽及三位联合创始人——王景熠、王鲁玉、龙天宇，均源自上海科技大学陈佰乐教授课题组。陈佰乐教授在高速光电子、III-V族半导体、光探测器件领域研究多年，具有深厚的行业影响力，创始人团队成员也有多项研究成果发表在《Nature》、《Nature Photonics》等顶级期刊。</p>\n  <p>AI算力集群正从“算力瓶颈”转向“互联瓶颈”。AI算力集群扩张、数据中心升级、高速光模块迭代，正推动光互联带宽需求爆发式增长。</p>\n  <p>光探测芯片作为高速光接收链路的核心器件，其带宽、响应度、暗电流与可靠性等关键性能，直接影响光互连系统的传输速率、接收灵敏度、链路功耗与规模化应用表现。</p>\n  <p>不过，光探测芯片的相关技术专利多数由国外企业掌握，因此长期以来，国内相关产品的高端光探测芯片高度依赖进口，国产化率偏低，供应链安全与自主可控正面临“卡脖子”的压力。</p>\n  <p>目前产业端已经展开技术攻关，但多数布局仍集中在特定环节或跟进式创新。能够打通从芯片设计到工艺实现、在高性能与量产良率之间取得平衡的完整自研团队仍然稀缺。</p>\n  <p>据创始人李林泽介绍，快粼光电已构建从器件结构设计、III-V族材料外延到封装集成的完整开发体系，围绕数通领域高速光接收需求，持续布局 InP 光探测器（PD）及阵列产品。</p>\n  <p>该系列产品可广泛应用于800G、1.6T、3.2T高速光互连，以及LPO/LRO、NPO/CPO等下一代数据中心网络架构，精准卡位AI算力集群与DCI（数据中心互联）对“超高速、高带宽、低功耗”光电器件的迫切需求，助力低功耗、高带宽光互连系统升级与国内光互联行业的自主可控。</p>\n  <p>业务方面，快粼光电聚焦高速光通信为主、6G太赫兹通信为辅的发展路径，重点布局单波100G、200G及下一代400G光探测芯片，适配800G、1.6T、3.2T高速光模块市场需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_040a8b71628b495cb1267ab61ebc4121@6221844_oswg228270oswg468oswg398_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">超高速光电探测器芯片图（图源/企业）</p>\n  <p>目前，公司已完成核心技术验证，正全力推进量产工艺开发与客户送样，计划2027年实现核心产品规模化交付；同时在6G太赫兹高端芯片领域已实现阶段性收入，技术能力获得行业认可。</p>\n  <p>李林泽告诉硬氪：“光模块厂商对探测芯片的要求非常明确：一是产能，二是可靠性。公司这轮融资的核心目标，就是拿到量产这张门票——在量产产线上生产出的具备高性能、高可靠性的产品交到客户手里。”</p>\n  <p><strong>以下是硬氪与李林泽的对话节选：</strong></p>\n  <p><strong>硬氪：光探测芯片最大的技术难点是什么？快粼光电的解法有何不同？</strong></p>\n  <p><strong>李林泽：</strong>难点在于带宽和效率很难兼得。传统结构下，带宽越高，响应度越低，而这两者对光模块接收端都很关键。我们的UTC-PD结构本质上是把载流子从“两种”变成“一种”，发挥电子快速输运的优势，在不影响效率的同时大幅提升带宽。我们的研发样品能实现超过200 GHz带宽、0.8 A/W的响应度，这两项指标在国际上来看也是第一梯队。</p>\n  <p><strong>硬氪：为什么不先做其它的商业化场景，而是直接瞄准光通信？</strong></p>\n  <p><strong>李林泽：</strong>我们先前也做了太赫兹通信、6G、精密仪器等前沿场景，实现百万级收入。然而对我们来说，太赫兹是长期的星辰大海，而光通信则是算力升级、刚性需求爆发的黄金周期，必须跟时间赛跑。</p>\n  <p><strong>硬氪：从技术验证到量产送样，中间最大的不确定性是什么？</strong></p>\n  <p><strong>李林泽：</strong>最大的不确定性不是技术本身，而是“技术”和“产线”的适配。我们在实验室可以把性能做得很好，但光模块客户要求的不是单颗芯片多快，而是批量出货时每一颗都足够稳定。这需要把我们自己的工艺know-how完整地移植到代工厂的量产线上，包括外延、制程、测试每一个环节的良率控制。我们花了很多时间做资源整合，正全力推进产品的量产开发。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>小苗朗程基金管理合伙人俞佳伟：</strong>本次投资快粼光电是基金在算力基础设施领域的又一投资布局，坚定看好公司即将量产的高性能单波200G/400G PD芯片的产品力，也期待公司的UTC-PD芯片、光混频器产品在光电量测设备、太赫兹通信、全光基站、星地微波通信等潜力领域逐步实现客户导入。</p>\n  <p><strong>一村资本董事总经理李中宇：</strong>快粼光电团队由上海科技大学培育，团队核心成员师出同门，基于MUTC结构光电探测器，实现了世界级的技术突破，是一个典型的硬科技项目。快粼的赛道正在加速增长——1.6T光模块量产在即，3.2T箭在弦上，单波200G/400G PD芯片是确定性升级方向；更远处，公司的UTC-PD是6G太赫兹光混频器的核心器件，一村愿意长期支持快粼成长和发展。</p>", "category": "tech", "published_at": "2026-07-07T01:00:00+00:00", "fetched_at": "2026-07-07T02:41:09.995936+00:00", "fingerprint": "2b8eaafa40c17248"}, {"source": "36氪 - 最新文章", "title": "用AI“复刻”人类细胞、预判药效，「华源智因」获千万级人民币种子轮融资｜36氪首发", "url": "https://36kr.com/p/3883943959621634?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，AI虚拟细胞（AIVC）企业华源智因近期已完成千万级人民币种子轮融资。本轮融资由水木创投领投，募集资金将主要用于多模态测序底层技术迭代，进一步拓展与头部三甲医院的合作，以及团队扩充等。此外，华源智因团队已计划启动新一轮融资。</p>\n  <p>华源智因创始团队由资深医药产业从业者、计算生物学研发人员组成，并邀请到深圳国家基因库等单位专家组成科学顾问委员会，形成科研与产业协同的团队架构。公司CEO杜润诗就读于加州大学洛杉矶分校，是AI领域连续创业者；CTO王艺璇为香港中文大学计算机科学与工程专业博士生，曾在百图生科牵头搭建基因扰动转录效应的预测模型xTrimoSC Perturb。此外，香港中文大学算机科学与工程系助理教授李煜任华源智因首席AI科学家。</p>\n  <p>在新药研发领域，“10年、10亿美金”是公认困境。其中，九成资源流向人体临床试验阶段，但最终仅有10%左右的候选药物能够顺利通过全部临床、成功上市。造成超高失败率的核心原因之一，是动物实验与人体真实生理环境的巨大差异。</p>\n  <p>那么，能否在投入高昂成本进入人体临床试验环节前，先在计算机里模拟出药物进入人体后的真实反应，以降低新药研发的失败率？</p>\n  <p>杜润诗认为，传统AI制药公司大多聚焦于解决研发前端问题，也就是利用AI更高效地找到潜在致病靶点、生成化合物。但这相当于只优化“找药”的第一步，无法完整预判成药后用到人身上时，究竟是否有效、有没有副作用等。而判断“某款药到底值不值得推进人体试验”，才是解决问题的关键。</p>\n  <p>这也是华源智因选择自研Wise-Perturb细胞药物扰动应用模型、专攻人体药效预测的根本原因。</p>\n  <p>简单理解，人类细胞包含约2万个蛋白编码基因，细胞健康状态、病变进程以及药物响应，均由多基因协同调控产生。行业���说的“细胞扰动”，指人为对细胞施加外源干预，主要分为两大研究方向：一是基因编辑扰动，通过敲除、上调特定基因，观测下游基因连锁表达变化，快速定位疾病致病靶点；二是药物分子扰动，将候选药物输入虚拟细胞模型，依托AI完整推演药物作用下细胞内基因、蛋白、信号通路的动态改变，以此评估药物人体疗效与潜在毒性。这也是华源智因现阶段核心研发重心。</p>\n  <p>据介绍，Wise-Perturb主要有两层突破。首先，它针对性弥补传统模型依赖单一RNA测序、脱离真实患者病理特征的短板。传统AI细胞模型训练数据多来源于实验室人工改造永生细胞系，这类细胞脱离人体原生病理微环境，缺少患者个体化基因特征，用于人体药效预测时易产生明显偏差；同时传统测序手段难以同步获取DNA、RNA、蛋白三层关键组学信息，难以完整还原细胞真实调控逻辑。</p>\n  <p>为此，华源智因搭建单细胞多组学整合分析体系，通过同细胞单细胞检测分别捕获细胞DNA、转录组、蛋白组数据，再依托自研多模态融合算法打通三层组学信息，搭建三层金字塔式数据底座，其中，底层为海量通用静态单细胞测序数据集，中层为数亿体外细胞系、PDX模型药物与基因扰动配对实验数据，顶层为稀缺人体临床肿瘤队列给药前后配对测序数据。</p>\n  <p>“我们与超一线头部三甲医院达成创新性合作，共建联合实验室。未来还计划针对各医院的优势科室，定向采集对应适应症的专属数据，训练细分疾病专家模型。希望在未来1-3年，至少与30家头部三家医院实现深度合作。”杜润诗表示。</p>\n  <p>此外，Wise-Perturb的另一特点在于模型的细胞特异性设计。普通AI模型通常默认细胞对药物的反应相同，但现实中，不同细胞的生理机制存在差异，比如，一款药在肺部起效，却有可能会损伤肝脏。因此，华源智因团队在Wise-Perturb中专门加入细胞类型识别架构，使其具备零样本跨细胞、跨癌种、跨新药泛化预测能力，不针对每一种疾病重新大规模训练、依靠少量已知患者数据，就能预测全新病种或药物的人体效果。</p>\n  <p>华源智因提供了两组真实验证案例，其中之一是ADC明星药物DS-8201的跨适应症验证。杜润诗介绍：“我们采用乳腺癌患者临床数据完成模型基础训练，在无卵巢癌患者训练样本的前提下，完成卵巢癌PDX模型药物响应预测，模型打分与动物体内真实药效匹配；对比通用虚拟细胞模型，预测一致性提升。”</p>\n  <p>另一例则是与中国医学科学院肿瘤医院合作的非小细胞肺癌靶向药奥希替尼药效分层研究。“医院提供患者治疗前肿瘤基线测序数据，未同步开放任何临床随访结局，由模型独立输出患者药效分层结果，分层结论与临床长期观测疗效吻合。”杜润诗表示。</p>\n  <p>在华源智因方面看来，这套经过临床样本验证的预测能力，让公司跳出行业“先投入高额研发、后期再拓展客户”的传统路径，成立早期即可对接医疗机构、药企落地真实付费合作。</p>\n  <p>杜润诗介绍称，<strong>目前，华源智因已“收获多家头部三甲医院、跨国药企、AI生物企业的合作订单，多项目服务费已完成回款”</strong>。</p>\n  <p>现阶段，华源智因共有两大核心商业化服务。一是面向药企提供临床前管线价值评估、临床试验入组患者分层定制服务，按项目评估，收取基础服务费或其他收益模式 ；二是与三甲医院共建干湿结合联合实验室，联合开展老药新用挖掘、全新疾病靶点筛选等科研项目。长期规划中，公司还计划推出与药企风险共担、药物上市收益分成的联合研发模式。</p>\n  <p>“我们优先落地小规模验证项目，用可复现、高一致性的预测数据建立客户信任，再持续深化长期合作。当前，人体精准药效预测是行业刚性需求，成熟替代技术方案稀缺，医疗机构与药企愿意开放临床样本数据开展联合研究。”杜润诗总结道。</p>", "category": "tech", "published_at": "2026-07-07T01:05:00+00:00", "fetched_at": "2026-07-07T02:41:09.995927+00:00", "fingerprint": "1e4e6cc0b6665272"}, {"source": "36氪 - 最新文章", "title": "前大疆员工做了款消费级纺织机，拿下红杉、顺为、米哈游等数亿融资｜产品观察", "url": "https://36kr.com/p/3876837605585160?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>浪爪智能（CLAWLAB）创始人胡文鑫，是当下硬件赛道一个不太按常理出牌的人。</p>\n  <p>工程师背景出身，曾就职于大疆、美团等头部大厂，拿过顶级机构的钱，履历足以支撑他选择任何一个被市场验证过的热门赛道，在最短时间内做出产品、讲故事、滚动融资。</p>\n  <p>但胡文鑫扎进了一个过去三十年几乎无人问津的品类：家用纺织机。</p>\n  <p>很少有人知道胡文鑫具体在做什么。浪爪智能成立于2022年12月，近几年里，团队刻意保持水下状态——BP从不外发，没有主动路演或公司传播，有投资人对产品方向感兴趣就直接到办公室看Demo。</p>\n  <p>硬氪独家获悉，过去几年，浪爪智能已连续完成数轮超亿元融资，Pre-A2轮由元璟资本领投、老股东顺为资本超额加注，Pre-A3轮由米哈游领投、老股东元璟及顺为大幅超额加注。此前投资方包括红杉等。</p>\n  <p>选择纺织方向，基于一个极为朴素的认知。“纺织天然切中‘衣食住行’的首位，是一件足够大且真实存在的需求。而定制化DIY，是在刚性需求被满足之后，用户向内探索自我表达、向外输出个性化的自然延伸。”创业初期胡文鑫就判断，这个赛道的天花板足够高，值得用很长的时间去探索。</p>\n  <p>纺织DIY赛道在全球拥有上亿潜在人群，但长期缺少软硬件一体化完整方案。和3D打印赛道不同，家用智能编织机没有可复用的零部件和开源算法，它们能参考的，只有老式编织机。也就是说，胡文鑫要从零定义一台全新的设备。</p>\n  <p>2024年，浪爪智能推出首款产品为自动簇绒枪，仅作为海外小规模市场验证工具，两年累计营收近亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_82fcef95db7f459195b82928eb6c5a84@6022551_oswg2127834oswg1660oswg1208_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能自动簇绒枪（图源/企业）</p>\n  <p>但硬件之外，胡文鑫耗费大量时间打磨的，是一款消费级纺织Station平台。这是一套全新形态物理计算终端，不需要专业制版，通过简易绘图或拍照即可生成编织版型，并完成围巾、娃衣、宠物配饰、小型毛绒制品等多种织物的织造工作。</p>\n  <p>在深圳，只做出90分的硬件，根本无法在丛林中存活，现在创业公司的天花板，其实是软件和生态能力，这个Station平台，也成了浪爪最深的护城河。公司即将发布新款轻量化桌面级编织产品，并搭建内容分享社区，承接爱好者的解压创作与小微定制需求。</p>\n  <p>纺织是最古老的工艺之一。当市场还在追逐可被智能化的新品类时，胡文鑫已经把目光投向了一片体量庞大、尚未被现代计算技术触及的蓝海。</p>\n  <h2>家用智能织造工作站</h2>\n  <p>胡文鑫选择锚定“编织”工具品类，并非出于直觉。早在产品定义阶段，他跟研发团队便对纺织四大类工艺——刺、钩、缝、织——做了系统摸排。</p>\n  <p>他们发现，刺、钩、缝这前三道工艺，其工序天然分散，只能对已有的布料做“加法”或“拼接”，无法独立生成一件完整的织物。而编织可直接以纱线为原料，成型衣物、围巾、配饰、毛绒玩偶等各类立体成品，工序高度闭合，更适配被集成到一站式的智能化设备中，符合“放入原料、制出成品”的桌面造物逻辑。</p>\n  <p>这个差异决定了家庭场景的可能性。编织工艺虽然难度高，但本身足够成体系，可以用智能化的工程方法去解构。</p>\n  <p>而过去三十年，几乎没有企业在这个方向上做过系统性尝试。90年代，家用编织机曾有过短暂的辉煌时期，以银笛、兄弟等老牌品牌长期占据编织设备的主流市场份额，后续还诞生了多款国产手摇编织机产品。这类设备完全依靠纯机械结构，全都需要手动完成。</p>\n  <p>看似简单的编织动作，实则是个高度依赖时序的动态过程——不同版型颜色、不同织针、各行纹路联动，任意一处张力、走位偏差，都会造成整件织物报废。</p>\n  <p>因此，做一台自动化编织设备，首要解决的不是材料堆叠或定点加工的问题，而是如何搭建一套实时感知、调节与补偿的动态控制系统。</p>\n  <p><strong>“很多人觉得编织不就是把线织成布，知道我们开始做了才发现，每个环节都是一个独立的技术难题。”</strong>胡文鑫告诉硬氪，“平针和麻花针的机械动作组合完全不同，粗羊毛和细棉线的张力控制曲线完全不同，一件衣服和一顶帽子的轮廓成型逻辑完全不同。这些差异不能靠调试解决，必须在系统设计之初就被定义清楚。”</p>\n  <p>而横亘在浪爪智能面前的第一道坎，是技术和数据的双重缺失。没有开源算法可以参考，没有现成数据集可以训练，没有成熟供应链可以复用。甚至连“编织动作应该如何被数字化定义”这个最基础的问题，此前都没有人给出过回答。</p>\n  <p>胡文鑫和团队花了近三年时间，将编织工艺逐级拆解为可编程的控制算法，形成了自己的技术壁垒。</p>\n  <p>团队的解法是，将机器人控制、运动规划到计算机图形学等AI硬件能力迁移至产品研发环节。做了一年半，他们终于跑通第一版可靠的编织流程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_96337f2410284bbd8b5d8802175a4523@6022551_oswg878842oswg1058oswg648_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能可编程控制算法（图源/企业）</p>\n  <p>但一台设备要从“工具型”产品进入家庭，真正的挑战在用户交互层。他们必须把设计门槛降到足够低，让一个毫无编织经验的人也能上手，否则产品依然只能停留在专业圈层内部。</p>\n  <p>传统编织的制版极度依赖经验。一个合格的制版师傅需要5到10年的训练，才能看懂图谱、理解针法逻辑、调整纱线参数。</p>\n  <p><strong>浪爪智能团队也在自主研发纺织AI Agent，基于领域知识增强的垂直模型，内置了团队积累的制版算法和编译能力。</strong>进入编织场景后，用户不需要懂复杂的针法和版型参数，上传图片后，一个能理解用户想要什么的设计Agent可自动解析织物风格、提取特征，生成可直接交由机器编织的设计方案。</p>\n  <p>用户只需要通过自然语言描述自己的设计意图，便交由AI Agent完成后续所有编织工作。传统制版师需要几天完成的工作，在这个一站式纺织Station中被压缩至几分钟，完成了一个从“用户意图”到“物理成品”的完整闭环。</p>\n  <p>这或许是这个品类最有趣的地方。它一方面是一个尚未被验证但潜力巨大的蓝海市场，但另一方面又长期缺乏现代化技术的系统性介入，留出了巨大的技术空白。不过也正因为冷门，一旦完成全栈体系搭建，这道护城河的宽度远超单品硬件逻辑所能理解。</p>\n  <p>更深一层的吸引力来自赛道本身。在胡文鑫看来，这不是一个单品类的故事，更具备平台化的可能性。“仅编织机这款设备，在其底层技术底座之上，针对不同细分场景就能衍生出多种差异化的产品定义。我们相信纺织赛道还有大量未被触及的场景和品类等待发掘。”</p>\n  <h2><strong>一个超亿人群的水下市场</strong></h2>\n  <p>当前全球范围内，编织在欧美、东亚等市场热度持续攀升，核心活跃爱好者群体规模达数千万级别，泛潜在覆盖人群规模可破亿。</p>\n  <p>公开社媒平台数据显示，小红书上“织女”相关话题阅读量近9亿，钩针编织、手工钩织等相关话题总流量超30亿；TikTok平台上“crochet（钩针、编织）”标签的观看次数达2000多亿次。</p>\n  <p>人群足够大，这只是第一步。更重要的是，编织的终端产品不需要教育。围巾的温暖、帽子的陪伴、毛衣的柔软、毛绒玩具的治愈感，人对这类情绪型产品的向往是天然的、无需解释的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4d85e7c3d82448d0a60f153610148c50@6022551_oswg3109133oswg2004oswg1152_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">使用浪爪智能织造工作站所产出的编织产品（图源/企业）</p>\n  <p>“平台上用户展示的编织作品只是冰山一角，评论区里那些‘好看’‘我也想要’‘有没有教程’的声音，才是真正的水下需求。”胡文鑫说，“我们不是在创造一个新需求。目前没有产品能够满足这些人想要一件定制毛衣、一个特定图案抱枕的需求。这正是我们的切入点。”</p>\n  <p>破局点在于将耗时数周的重复劳动、制版和织造环节交给机器，让用户保留设计、选择、以及亲手创造的情绪价值，把用户从想要到拥有的耗时和门槛大幅降低。</p>\n  <p>胡文鑫告诉硬氪，这种补偿方式可以催生出一条独特的用户演化路径。大量纺织DIY用户最初进入这个领域，驱动力是情绪性的：解压、打发时间、享受亲手做出一件东西的满足感。随着技能积累和社群影响，一部分人开始从兴趣爱好延伸至轻量化商业阶段，接洽小批量订单。</p>\n  <p>围绕这条从情绪消费到轻量化商业的演化路径，浪爪智能将用户画像划分为四类渗透方向。</p>\n  <p>首批种子用户是存量编织设备的重度使用者。他们或是多年老式编织机的爱好者，或是通过手工编织获得稳定收入的个体创作者，对产品工具有认知基础，痛点直接而具体：手动排花效率低、复杂图案实现困难、良品率不稳定。这类用户不需要被教育“编织机能做什么”，而是真正能解决日常问题的产品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_34c7f46734b94323a357273b4b8397c2@6022551_oswg2116990oswg1402oswg1034_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">浪爪智能自动簇绒枪（图源/企业）</p>\n  <p>第二类目标用户是小B端经营者，比如做娃衣的、织宠物服饰的、接节日定制单等。其核心诉求围绕效率和定制化能力展开，一台设备能有效缩短单件创作周期。这类人群的价值不止于购买设备，其产出的成品也会自然吸引C端用户关注，形成从B端向C端的渗透。</p>\n  <p>最终，浪爪智能的目标是覆盖大众普通消费者，没有DIY创作需求、也不关心编织工艺，而是能否快速获取自己想要的织物。到这一阶段，其产品将脱离造物工具、创作工具的定位，真正落地于家庭场景的小型柔性供应链，实现织物即时定制交付。</p>\n  <p>&nbsp;“这类人群本质上是需求层次不断上移的过程。第一阶段用户解决的是痛点，第二阶段解决的是效率，第三阶段解决的是好看，第四阶段真正实现用户想要就有。”胡文鑫分析。</p>\n  <p>过去三十年，家用编织从“家家一台缝纫机“的生产力需求，逐渐淡出了人们的日常生活，花几周钩一条毯子在快节奏生活中被大多数人放弃。工业时代把编织送进了工厂流水线，标准化的围巾、标准化的毛衣，以最低成本流向每一个货架。效率极大提升，但代价也随之发生：编织原本携带的个体属性被彻底压缩。每一件织物背后那个具体的人、具体的审美选择、具体的表达意图，全部被简化为\"同款\"。</p>\n  <p>但亲手创造的情感需求从未消失。随着硬件供应链的成熟、电机与传感器成本的下降、AI能力的可迁移，让“把一台复杂的编织设备做到消费级产品”第一次具备了可行性。</p>\n  <p>“每个人心里都有想表达的东西。一个喜欢的图案、一种偏好的颜色、一份属于自己的触感，以及附着其上的某段回忆、某种情绪。这些想法不应该被‘批量生产’挡在门外。于是浪爪智能做了一台能放在书桌上的编织机。不是玩具，不是概念，是能真正织出成品的机器。”胡文鑫说。</p>\n  <p>用户的设计从屏幕里生长出来，变成可以触摸的纹理、可以围在肩上的温度、可以送人的独一无二。这台机器解决的问题不是更快或更便宜，而是让织物重新属于具体的人。</p>", "category": "tech", "published_at": "2026-07-07T02:29:47+00:00", "fetched_at": "2026-07-07T02:41:09.995912+00:00", "fingerprint": "4e53685b69ec35b7"}, {"source": "少数派", "title": "自动给文章术语加百科链接，这个方案一分钟搞定", "url": "https://sspai.com/post/111702", "summary": "我给博客做了一个「术语小助手」，让陌生名词不再打断阅读。<a href=\"https://sspai.com/post/111702\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-06T03:30:41+00:00", "fetched_
