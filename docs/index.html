ttps://img.36krcdn.com/hsossms/20260922/v2_71670853da7548a8b0056d115d819a6c@12547972_oswg104404oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_252367efe06e4bf28599fae19aa3f44b@12547972_oswg105275oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_e4d7c8fc1e1d4b8f9abfc10a6aa51f4e@12547972_oswg106859oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_beb772c0e464483ab02c6fb06e11672b@12547972_oswg94369oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_e778b5b0c39d4bbc85427720869a12ff@12547972_oswg46468oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_0ecdf1a0b5a44a47befdf999e0822626@12547972_oswg109341oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_14720409a63f4f0c8a852abd9ccfd103@12547972_oswg107196oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_b196d753894c4be5995e348de352397e@12547972_oswg103987oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_edfd593cd6b14a7f8b5641afc95011a9@12547972_oswg109586oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_c1de51da1c4a414d99fe7d9d67441984@12547972_oswg95030oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_b9661f659b6c4fceaaf06486cde72132@12547972_oswg69868oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_32bea023ba2b4f2fbe14068696f14dbc@12547972_oswg76145oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-09-22T23:30:00+00:00", "fetched_at": "2026-09-23T03:01:20.689240+00:00", "fingerprint": "6098773f62398396"}, {"source": "36氪 - 最新文章", "title": "海面具身智能公司半年完成3亿融资，曾获李泽湘、高秉强、阿里、元禾系等投资｜硬氪首发", "url": "https://36kr.com/p/3992518229818372?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄楠</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，海面具身智能公司「欧卡智舶」近日完成数亿C轮融资，半年累计规模达3亿元，本轮由西高投领投，元禾璞华、三元资本跟投。资金将主要用于海面物理AI的技术迭代、船舶通用大脑APAS系统的场景拓展，以及C端水上休闲业务的产品推进。</p>\n  <p>本轮融资距离上一轮交割仅间隔半年。自2019年正式开启商业化进程以来，欧卡智舶已获得多轮资本加持，投资方包括姚期智院士创立的图灵创投、李泽湘教授旗下XbotPark及HKX基金、高秉强教授旗下Brizan Ventures、阿里巴巴创业者基金、厚雪资本与元禾重元等机构。</p>\n  <p>欧卡智舶聚焦海面具身智能赛道，专注船舶智能驾驶技术研发与水面具身机器人产业应用，围绕“AI for Boats”战略，已构建“通用大脑+本体终端”的一脑多体产品架构。其底层以全栈自研的海面物理AI为基底，上层通过船舶智能驾驶系统ORCA-APAS（Advanced Pilot Assistance System），将智驾能力向不同船型、不同水域及不同应用场景规模化复用。</p>\n  <p>创始人兼CEO朱健楠博士毕业于西北工业大学，在校期间即主导水面无人驾驶技术研究，后与合伙人程宇威、池雨豪联合创办欧卡智舶，是全球最早一批投入水面无人驾驶研发的团队之一。多位核心成员曾就职于大疆、华为等头部科技企业，具备从算法研发到硬件量产的全链条经验。其研发人员占比超70%，已累计取得200多项核心专利。</p>\n  <p>欧卡智舶是全国唯一同时获得中国船级社四项核心认可证书的企业，具备最高合规等级船舶全无人驾驶能力。截至目前，公司已在全球13个国家落地了超千艘无人船艇，累计无人化航行里程超200万公里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_41b5918d2e4f4481be0b4b0198fa8a22@6022551_oswg96332oswg1080oswg635_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">船舶智驾系统 应用于海上无人艇（图源/企业）</p>\n  <p>海洋，正在成为具身智能落地的一片特殊场域。</p>\n  <p>海面作业的人力缺口正在持续扩大，高风险属性也愈发突出。BIMCO与国际航运公会（ICS）最新数据显示，2026年全球商船队已面临约4万名持证高级船员缺口；相比2021年，高级船员需求增长23.1%，预计到2030年还需要新增约12万名高级船员。</p>\n  <p>与此同时，海事巡检、风电油气运维、海上作业等场景同样长期面临“缺人难招、有人难留”的困境。恶劣海况、连续值守与高风险作业环境，又进一步放大了人员安全与供给压力。</p>\n  <p>“海面作业场景对无人系统的需求，有其独特的价值逻辑。”欧卡智舶创始人兼CEO朱健楠告诉硬氪。不同于陆地机器人，其核心逻辑是用机器协助、并替代部分人力来实现降本增效，海洋场景则在此基础上，还增加了安全与人身风险两重刚性约束。</p>\n  <p>“海洋的作业场景更需要无人化，因为它的高危、它的高价值，它的ROI测算，只是如何去解决非标和特别的研发问题。行业现在要做的，是从需求共识走向产品共识，再到产品的标准化和量变。”朱健楠说。</p>\n  <p>海面作业面临一组与陆地场景截然不同的底层约束，它必须面对持续变化的风浪洋流、高盐雾腐蚀、离岸通信遮挡，以及浪涌扰动带来的动态安全风险。这也就决定了，海面智能化不能直接平移陆地无人驾驶的技术方案，必须从海面物理规律出发完成体系化重构。</p>\n  <p>这正是欧卡智舶切入的核心赛道，推动海面作业从人力驱动模式，转向AI具身智能主导的智能化作业范式。</p>\n  <p>欧卡智舶构建了一套海面物理AI的完整闭环，从数据飞轮、物理躯干到具身大脑，形成“技术研发—产品量产—规模交付—数据回流—算法迭代”的全栈能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_1d375c551c6c4bca955a8843458c5837@6022551_oswg75380oswg1080oswg478_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欧卡智舶产品架构图（图源/企业）</p>\n  <p>底层是数据飞轮。欧卡智舶已积累5000万级水面和海面样本集，覆盖不同水域类型、光照条件、风浪等级和季节变化，构建了全球首个覆盖海面自动驾驶多模态与水面垃圾样本的数据集。数据按类别划分，既有面向无人艇的，也有面向航运和内河内湖的，形成了全数据要素的覆盖。</p>\n  <p>中层是物理躯干。在核心部件层面，团队自研了毫米波雷达、域控制器等关键硬件。其中，域控制器采用多路输入、模块化输出的架构设计，可以接入发动机、毫米波雷达、视觉、激光雷达、声呐、流速计等不同来源的数据，预留了25路传感器接口，输出端则统一为决策指令与执行信号。</p>\n  <p>这意味着，无论客户是航运船还是游艇，底层硬件接口都是标准化的，差异主要体现在输入数据类型上，比如航运船可能接的是四推进器加侧推、声呐，游艇仅需要单推进器或双推进器。通过系统层面的配置切换，即可适配从小艇到大型商货船的不同需求。</p>\n  <p>上层为整套方案的关键——具身大脑，即船舶智能驾驶系统ORCA-APAS。这套系统依托感知识别、定位解算、规划决策与运动控制一整套算法链路，可以提供船舶环境感知、自主航行、主动避障、自动靠离泊等能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_7b0ae7db36664b4da339432a9e8d7814@6022551_oswg102198oswg960oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ORCA-APAS应用于海上巡逻艇（图源/企业）</p>\n  <p>针对不同智能化等级与业务场景，APAS划分了A、B、C三套子系统：A系统主打海上风电、公安海警、渔政海事等全无人特种船体场景，覆盖远程遥控直至完全自主运行的完整能力；B系统主要服务游艇、公务艇等中小型船艇，聚焦高级辅助航行体验；C系统则面向大型商货船，重点实现智能航行与航路优化。</p>\n  <p>这套“一脑多体”架构的核心，在于通用大脑的跨船型复用能力。同一套算法底座，适配不同智能化等级需求和应用场景，实现全水域、全船型、全航速、全场景的L2至L4级智能驾驶覆盖。</p>\n  <p>商业化落地上，欧卡智舶并未选择同时铺开，而是沿着一条梯度路径推进，以B端场景为起点建立数据与交付闭环，再向C端延伸；以低速水域验证技术稳定性，再向高速、远海场景拓展。</p>\n  <p>B端是欧卡智舶当前主要的营收来源。围绕智慧水域运维，公司已形成覆盖水面清洁、海上运维、环境巡检和应急救援的产品矩阵，由无人清洁船、无人割草船到水利巡检船、海洋无人艇，产品线沿场景需求逐步延展。客户实测数据显示，其环卫船作业效率达到人工的3到5倍，综合运营成本降低40%以上。朱健楠向硬氪透露，其环卫船业务复购率持续提高，收入相比去年已翻番。</p>\n  <p>智慧滨水经济则是B端能力向更广泛场景的延伸。欧卡智舶推出了“漾、汐、漫”三款产品，形成覆盖高、中、大众消费群体的滨水经济产品矩阵，漾是具备L4级自动驾驶能力的水上超级空间，汐是面向景区观光场景的新能源智能游船，漫是主打亲水休闲体验的水上露营平台。目前智能游船已进入50个景区，文旅场景的商业闭环正在逐步成型。</p>\n  <p>C端水上休闲是欧卡智舶最新布局的方向。公司瞄准海洋智能游艇品类，已于近期在法国戛纳游艇展完成产品首发。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_ff70104a11b14d60841d42798523c648@6022551_oswg186714oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欧卡智舶智能电动游艇（图源/企业）</p>\n  <p>除了整机游艇外，欧卡智舶船舶智驾系统APAS也在向更轻量化的水上娱乐硬件渗透。桨板正是其中一个已进入规模化出货的品类。</p>\n  <p>公司同北美头部桨板品牌达成合作，将船舶智驾系统APAS嵌入其桨板产品。通过定航定速、悬停停靠（AutoParking）等功能，可大幅降低水上操作门槛，让入门用户也能快速上手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_1e4b2058b51f4b499a96a12ea123e444@6022551_oswg97661oswg1080oswg640_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">APAS在桨板产品上应用（图源/企业）</p>\n  <p>当前，欧卡智舶正加快推进全球化布局，海外业务成为公司重要增长极。公司已与东南亚、荷兰等国家和地区的客户达成合作，为当地船艇提供智能驾驶解决方案。</p>\n  <p>海面具身智能的核心价值，远不是把陆地上的无人驾驶技术搬到海上，而在于从海面场景的本质需求出发，重新定义感知、决策与控制的逻辑。</p>\n  <p>欧卡智舶以海面物理AI为底座，用通用大脑实现跨船型、跨场景的智驾能力复用，用本体终端覆盖从水域运维到滨水经济的多元场景。从B端的降本增效与安全替代，到C端水上休闲设备的智能化渗透，欧卡智舶正试图在海面这一特殊场域中，构建从技术到产品到商业化的完整闭环。</p>\n  <p><strong>以下为硬氪与欧卡智舶创始人兼CEO朱健楠的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：基于 “一脑多体” 架构，船舶智驾系统APAS需要适配多元船型与水域工况。从模型训练和大脑架构层面，你们如何平衡底座通用性和各场景的专项性能？</strong></p>\n  <p><strong>朱健楠：</strong>这个问题可以从数据通用性、应用层调度，以及硬件算力分级三个层面来看。</p>\n  <p>首先底座通用性的建设来自数据与系统架构。欧卡智舶自研的域控制器搭载了双GPU，具体到数据采集阶段，我们就按照水域类型、光照条件、风浪等级、季节做精细化标签，数据集覆盖无人作业艇、航运船舶、内河内湖等多元工况。除了海南、舟山、湖州、西安、南通多处测试基地持续产出样本，在真实场景数据不断训练算法。</p>\n  <p>在应用侧，APAS可以进一步划分A、B、C三套智驾子系统。A系统服务海上风电、渔政海事这类全无人特种船体；B系统面向桨板、游艇这类消费级水上娱乐装备；C系统适配内河与远洋航运。我们并不会专门为每个场景开发一套独立硬件，而是让通用大脑保持不变，通过切换工作模式完成适配，以此实现能力复用。</p>\n  <p>在此基础之上，还要应对不同工况带来的泛化难度差异。从内河低速走向远海高速，环境扰动不断变大，模型泛化难度是逐级提升的。内河内湖低速场景相对友好；远海、高海况下，海浪扰动强，对感知控制的挑战会陡增。为此，我们对域控制器也做了分级，高算力版本双GPU可达到100TOPS算力，面向远海复杂工况；低算力版本40TOPS，满足内河低速场景需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_8d4ea023af9246ea9cc3c812a5979477@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">船舶智驾系统应用于226m远洋散货船-嘉通轮（图源/企业）</p>\n  <p>当前，这套体系可以覆盖绝大多数50节船型，远海场景也可支撑，能够匹配现阶段绝大多数业务需求。这套“通用预训练数据底座+软件模式隔离+硬件算力分级”的组合，也是我们用来缓解多域数据带来的性能冲突，平衡通用能力与场景专项表现的核心手段。</p>\n  <p><strong>硬氪：欧卡智舶同时布局ToB和ToC两条线，从商业化逻辑来看，这两类业务在价值创造方式、付费主体和规模化路径上有什么差异？</strong></p>\n  <p><strong>朱健楠：</strong>本质差异在于价值主张不同。</p>\n  <p>ToB的业务逻辑，核心是把AI和自动驾驶当成效率工具来用，客户买的是降本增效和安全合规。付费方大多是作业方或运营方，决策链条偏理性，ROI算得清楚。由于海洋作业场景高风险、高人力成本、高价值产出等特性，其天然适合无人化，这些是刚需。</p>\n  <p>目前，行业正在从需求共识走向产品共识，下一步是标准化和规模化复制。但这个方向的难点、痛点也很明确，场景非标、研发投入大、交付周期长，怎么把非标需求收敛成标准化产品，是ToB能不能起量的关键。</p>\n  <p>面向C端市场，关键在于用户把智能化与体验升级绑定，价值锚点是便捷性和驾乘感受。终端用户的决策往往更感性，品牌认知和体验感知的权重更高。</p>\n  <p>衔接的来看，大趋势其实已经很清晰。不管是京东、小鹏等国内头部大厂入局游艇赛道，还是阿兹慕等海外老牌游艇厂商开始拥抱AI，智能、新能源游艇已经成为市场热议的方向。但现在行并不缺趋势共识，缺的是一套完整的端到端落地解决方案，即能让用户实实在在感知到，水上智能化究竟能带来怎样的体验。</p>\n  <p>这也是为什么欧卡智舶团队没有只做智驾方案对外输出，而是选择孵化自有整机品牌。先把产品做出来，让市场看见智能电动游艇真实的产品形态与价值，后续再去谈规模化推广。</p>", "category": "tech", "published_at": "2026-09-23T01:30:00+00:00", "fetched_at": "2026-09-23T03:01:20.689235+00:00", "fingerprint": "dd1a49512f596210"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨雷军否认打新宇树挣100亿；罗永浩宣布播客暂停更新；Meta Muse爆火，扎克伯格身价一日暴涨1600亿元", "url": "https://36kr.com/p/3995341472125056?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>贝森特将Hugging Face事件归责OpenAI管理层，称责任在人而非AI</p>\n  <p>7天免费试用却扣费958元，多邻国被质疑诱导消费</p>\n  <p>微信新版本上线私密发表功能，朋友圈可一键仅自己可见</p>\n  <p>苹果高管：不建议给iPhone贴膜</p>\n  <p>白宫宣布推出“特朗普电视”</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>雷军回应打新宇树赚了100多亿：不是我投的，不是打新</strong></p>\n  <p>9月21日晚，雷军在露营直播中回应了关于宇树科技上市后其“打新赚翻”的说法。雷军表示，投资宇树的主体是顺为资本，并非其个人出资。顺为是宇树A轮唯一投资方，他与创始人王兴兴相识十余年。该笔投资属于一级市场早期天使风险投资，并非二级市场打新套利。雷军谈及初衷，称自己早年融资不易，二十年来一直推动国内天使投资，扶持初创青年，这也是小米与顺为布局产业链、生态链的一环。他呼吁媒体不要为流量制造话题，笔下留情。直播中，雷军还回应了此前访问宇树科技，“脚踹机器人”的趣事。他称踢机器人是创始人王兴兴提议的测试，并赞叹其平衡性出色。（界面新闻）</p>\n  <p><strong>罗永浩宣布播客暂停更新</strong></p>\n  <p>9月22日，有网友留言询问能不能更新播客节目《罗永浩的十字路口》，罗永浩回复：卷进舆论漩涡期间，为了避免连累嘉宾，原则上是不播的，其实已经录好的有好几期了。近日，罗永浩差评野人先生、罗永浩与西贝贾国龙的纠纷等频频登上热搜引发关注。（第一财经）</p>\n  <p><strong>Meta Muse爆火，扎克伯格身价一日暴涨1600亿元</strong></p>\n  <p>当地时间9月21日，Meta股价大涨近12%，推动公司创始人马克·扎克伯格的估计净资产单日增加约250亿美元，升至2536亿美元。福布斯称，此次上涨主要受富国银行上调Meta目标股价，以及投资者对Meta新款自主AI助手Muse的信心推动富国银行当天将Meta目标股价从640美元上调至796美元，并维持“增持”评级。Meta本月早些时候新推出的人工智能（AI）智能体Muse上线后迅速登上移动应用排行榜榜首，可自主完成预订旅行、发送邮件及管理联网家居设备等任务。扎克伯格此前将Muse视为Meta实现“个人超级智能”的一步。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Muse被亚马逊火速封禁&nbsp;</strong></p>\n  <p>Meta的最新AI代理Muse，本质上是一款可以替用户“动手”的AI助手，核心能力是自主执行任务，包括订票、处理邮件、调用Meta旗下社交媒体等。9月21日当天，Meta股价大涨，被视为AI代理成为主流的信号。但在AI代理获得消费市场青睐的同时，它与互联网平台的冲突也暴露出来。</p>\n  <p>9月20日，亚马逊封禁Muse的操作，用户让Muse在亚马逊下单时会收到警告：“未经授权的AI代理违反亚马逊使用条款。”亚马逊回应称，从未授权Muse进行相关操作，而Muse在执行任务时也不会主动表明自己的AI身份，同时还可能接触和存储用户的账户信息、订单记录等数据。公司曾试图说服Meta将亚马逊排除在Muse的操作范围之外，但未能成功，因此最终选择禁止Muse代替用户在平台上购物。Meta尚未就亚马逊的封禁作出回应。（21世纪经济报道）</p>\n  <p><strong>PayPal与Meta合作，支持通过AI智能体购物支付</strong></p>\n  <p>9月22日，PayPal宣布与Meta达成合作，将支持PayPal用户通过Meta旗下Muse个人AI智能体，在全球PayPal商户中实现购物和结账。（界面新闻）</p>\n  <p><strong>知情人士：DeepSeek将向联合国安理会介绍AI风险</strong></p>\n  <p>9月22日，据媒体报道，两位知情人士透露，中国人工智能初创企业DeepSeek将于本周向联合国安理会通报人工智能带来的风险。联合国安理会将于当地时间9月23日召开会议，讨论人工智能与国际安全问题。（中新经纬）</p>\n  <p><strong>OpenAI再推两款GPT-6模型：Sol、Luna定价降50%</strong></p>\n  <p>美东时间9月22日周二，OpenAI宣布推出GPT-6 Sol和GPT-6 Luna两款新模型。距离OpenAI发布其号称“全球最智能”的旗舰模型GPT-6 Astra还不到三周，OpenAI已经进一步补齐GPT-6产品线，并将部分Astra的能力带入更快、更便宜的模型。</p>\n  <p>此次两款模型的另一个核心看点是价格：OpenAI宣布，GPT-6 Sol和GPT-6 Luna的API价格较GPT-5.6的促销定价还低50%。OpenAI称，这是由于其进一步提升了缓存和推理效率，并将节省的成本直接让利给用户。根据OpenAI公告，Sol和Luna即日起面向Plus、Pro、Business、Enterprise及Edu用户，在ChatGPT Work和Codex中提供，同时开放API；免费版和Go版用户则可以在桌面端应用中体验GPT-6 Luna。（网易科技）</p>\n  <p><strong>Claude Opus 5.5发布，典型任务运行成本降低40%</strong></p>\n  <p>9月22日，Anthropic发布Claude Opus 5.5，这是Claude 5.5系列的首款模型。按照Anthropic的定位，Opus仍是Claude三条主力产品线中能力最强、价格最高的一档。与两个月前发布的Opus 5相比，Opus 5.5并没有继续强调单纯扩大模型规模，而是将重点放在三个方向：提升编程、计算机操作和知识工作能力，降低完成真实任务的总体成本，以及强化复杂任务中的行为约束。Anthropic称，Opus 5.5在多数工作中的表现已经达到Claude Fable 5.1的水平，但典型任务的运行成本比Opus 5降低约40%。（新浪科技）</p>\n  <p><strong>小米发布MiMo-V2.6模型</strong></p>\n  <p>36氪获悉，小米9月22日凌晨正式发布并开源了全新的Xiaomi MiMo-V2.6系列。团队表示，MiMo-V2.6系列包含Pro和Flash两个原生全模态模型。MiMo-V2.6-Pro在Artificial Analysis Intelligence Index（AA综合智能指数）中取得46分，但与最强的闭源模型Claude Fable5.1和GPT-6 Astra相比，仍有差距。团队称，MiMo-V2.6系列沿用V2.5系列的API定价，MiMo-V2.6-Pro刷新了国产模型的性价比纪录：在同等智能水平下，价格为海外模型的1/20至1/60。</p>\n  <p><strong>贝森特将Hugging Face事件归责OpenAI管理层，称责任在人而非AI</strong></p>\n  <p>美国财政部长斯科特·贝森特表示，近期涉及OpenAI先进人工智能模型的黑客事件，责任在于该公司的管理层，但他并未进一步暗示可能会产生什么后果。“关于Hugging Face事件，责任在OpenAI管理层，而不是一群智能体，”贝森特周一接受采访时表示。他说，自己赞同麻省理工学院研究实验室联席主席Daniel Huttenlocher的观点，即“应该由人类负责，而不是AI”。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>英伟达市盈率降至十多年来最低</strong></p>\n  <p>9月22日消息，据报道，英伟达未来12个月预期市盈率已降至不足17倍，为十余年来低位，约为2025年估值的一半。尽管公司预计2027财年营收和净利润分别增长90%和99%，但内存芯片等关键零部件成本上升正挤压利润率，分析师预计第四财季毛利率将降至72%以下。英伟达股价今年以来上涨22%，但涨幅落后于多数芯片股。市场同时担忧AI资本开支持续性及Meta、谷歌等大客户自研AI芯片可能加剧竞争。（界面新闻）</p>\n  <p><strong>吴泳铭：2032年阿里云数据中心规模将超20GW</strong></p>\n  <p>36氪获悉，9月22日，阿里巴巴CEO吴泳铭在云栖大会表示，当前客户AI需求非常强劲，将全力投入AI基础设施建设，目标到2032年阿里云运营的全球数据中心规模超过20GW。当天，平头哥发布最强国产AI芯片真武V900，算力提升至真武M890的3倍。据悉，平头哥AI芯片的年出货量将大幅提升。</p>\n  <p><strong>钟薛高创始人力挺西贝：西贝要是倒了，是中国餐饮行业的倒退</strong></p>\n  <p>9月20日晚，钟薛高创始人林盛在个人账号直播中，谈及西贝倒闭传言。林盛称西贝要是真的倒了，肯定是中国餐饮行业的倒退，西贝一直是在品质、质量安全管理、原材料管理做得非常好的企业，是餐饮行业内的标杆性企业。近日，“西贝被曝将彻底倒闭”的话题登上微博热搜。有大V发文称，西贝将在两三个月内彻底倒闭。（每日经济新闻）</p>\n  <p><strong>中国工信新闻：“去宁德化”论调要不得</strong></p>\n  <p>36氪获悉，工信部旗下媒体中国工信新闻发文表示，最近一段时间，“去宁德化”在新能源汽车行业被反复炒作。车企调整供应链、增加供应商、布局自研，本是正常的市场行为，却被不断包装成“去宁德化”，甚至渲染成整车企业与动力电池企业之间的对立。热闹背后，真正值得讨论的不是“谁替代谁”，而是中国新能源汽车进入高质量发展阶段，究竟需要怎样的产业竞争。舆论如果动辄鼓吹“去某某化”，把本土龙头企业与产业链其他企业人为对立起来，并不符合中国汽车产业今天所处的发展阶段。（中国工信新闻）</p>\n  <p><strong>苹果高管：不建议给iPhone贴膜&nbsp;</strong></p>\n  <p>近日，苹果硬件工程副总裁 Tom Marieb 在公开采访中明确表态，不建议普通用户给 iPhone 额外贴屏幕保护膜。他坦言，每次看到有人给 iPhone 屏幕贴保护膜的时候，自己都会感到浑身不自在，因为团队在屏幕耐刮和耐磨方面进行了大量研发，希望用户直接体验原厂屏幕。</p>\n  <p>此番言论引发网友热议。不少数码爱好者直接指出，无论消费级手机玻璃的材料性能再怎么迭代升级，至今都没有哪家厂商能做出完全扛住环境里无处不在的石英颗粒的玻璃。据了解，第二代超瓷晶面板玻璃首次应用于 iPhone 17 系列，其抗刮擦能力是前一代的三倍。iPhone 18 Pro 和 iPhone Duo 的正面屏幕均配备了这种第二代超瓷晶面板。（21世纪经济报道）</p>\n  <p><strong>7天免费试用却扣费958元，多邻国被质疑诱导消费</strong></p>\n  <p>近日，多位网友在社交平台发帖，质疑多邻国（Duolingo）的“会员免费试用”业务故意诱导消费，存在“免费陷阱”。有网友表示，自己免费使用多邻国三四个月，之后在App内看到Super Duolingo家庭套餐“7天免费体验”的订阅入口，点击完成订阅后，并未出现7天试用倒计时，而是直接被扣除738元年度订阅费用。也有网友称，多邻国扣款前没有任何提醒，一个多月后，自己才发现；另有网友表示，自己订阅了免费试用七天后，被扣了958元。9月22日，界面新闻就上述质疑多次致电多邻国，截至发稿前电话未接通。（界面新闻）</p>\n  <p><strong>中塑股份暴涨超900%，中一签最高浮盈超26万元</strong></p>\n  <p>新股N中塑复牌后继续拉升涨超900%，最高报580元。若按该价格计算，投资者中一签(500股)浮盈约26.24万元。资料显示，中塑股份主要从事改性工程塑料的研发、生产和销售。（界面新闻）</p>\n  <p><strong>沃尔玛中国调整双业态采购负责人</strong></p>\n  <p>36氪获悉，沃尔玛中国宣布两项核心采购线人事任命，涉及山姆会员商店与沃尔玛商店两大业态。任命内容显示，现任美国山姆会员商店非食品采购高级副总裁Sean Jackson将外派至中国，出任山姆会员商店首席采购官，直接向山姆会员商店业态总裁刘鹏汇报。与此同时，现任沃尔玛中国副总裁、山姆会员商店非食品采购负责人Amber Bynum调任沃尔玛商店首席采购官，向沃尔玛商店业态总裁祝骏汇报，计划10月中旬正式到岗，未来一个月内完成岗位交接。</p>\n  <p><strong>企业境外反垄断合规指引修订草案公开征求意见</strong></p>\n  <p>市场监管总局9月22日就《企业境外反垄断合规指引(修订草案征求意见稿)》公开征求意见，进一步引导我国企业增强海外反垄断合规意识，防范相关法律风险。意见反馈截止日期为2026年9月29日。为帮助企业了解域外最新反垄断监管趋势，本次修订总结并新增了反垄断立法和执法变化，如在垄断协议、滥用市场地位、经营者集中等专章中嵌入境外反垄断执法机构对数字经济的关注。明确了欧盟、美国、德国等司法辖区最新经营者集中申报标准等，提示企业关注外商投资安全审查和外国补贴审查制度。针对域外反垄断诉讼和调查高发的趋势，在行政罚款及刑事责任外，新增了主要司法辖区关于发起私人民事诉讼的规定。(央视新闻)</p>\n  <p><strong>国家发改委：推动北斗产业规模在5年内超过1万亿元</strong></p>\n  <p>国家发展改革委政策研究室副主任、委新闻发言人李超9月22日在国家发展改革委9月份新闻发布会上说，推动北斗产业规模在5年内超过1万亿元，实现北斗规模应用的市场化、产业化和国际化新突破。(新华财经)</p>\n  <p><strong>微信新版本上线私密发表功能，朋友圈可一键仅自己可见</strong></p>\n  <p>近日有网友发现，微信更新至8.0.78版本后，朋友圈新增“私密发表”入口，发布内容将自动设为仅自己可见，发布后也可调整为公开状态。此前发布私密朋友圈，需要在发布页手动选择权限，新入口简化了操作流程。据实测，该功能正处于安卓、iOS端灰度测试阶段，部分用户暂未收到更新推送，无法看到该入口，后续将分批上线。本次版本更新还升级了微信内置小微AI，新增好友对话、图片解读、AI相册存储、写真生成、图片扩图能力。同时优化多项细节：好友资料页增加备注编辑快捷入口，内置相机支持焦段快速切换与微距模式，聊天列表左滑按钮、弹窗菜单采用圆角与液态玻璃新视觉样式。（极目新闻）</p>\n  <p><strong>杉杉股份：拟51.06亿元投建年产15万吨锂离子电池负极材料一体化基地项目</strong></p>\n  <p>36氪获悉，杉杉股份公告，公司拟投资建设内蒙古杉杉科技年产15万吨锂离子电池负极材料一体化基地项目，总投资约51.06亿元，其中固定资产投资约43.18亿元。项目建设期17个月，计划2027年3月开工，2028年7月竣工。项目建成后将形成年产15万吨负极材料一体化产能，并配套5万吨石墨化产能。本次投资尚需提交股东会审议，并需取得环评、能评等审批备案。</p>\n  <p><strong>白宫宣布推出“特朗普电视”</strong></p>\n  <p>美国白宫9月21日宣布推出“特朗普电视”，美国媒体称之为“一个在YouTube平台全天候24小时播放特朗普政府过往活动的流媒体频道”。当晚，题为“特朗普电视：精华电视台”的直播活动在白宫官方YouTube频道上线，首先播出了特朗普今年7月3日在拉什莫尔峰（俗称“总统山”）的演讲。白宫在社交媒体上发文说，“‘特朗普电视’现已开播。全天候24小时、实时更新，汇集过往精彩瞬间、重要公告以及本届政府最新、最重要的内容，都在同一处。”美国媒体报道说，尚不清楚“特朗普电视”是否会现场直播特朗普及其政府的活动。（界面新闻）</p>\n  <p><strong>沙特据报重启东西输油管道，或于周二恢复延布港出口</strong></p>\n  <p>9月22日，据报道，沙特阿拉伯已重启东西输油管道，并可能于当天晚些时候恢复从红海延布港出口原油，管道目前以低速输油。(界面新闻)</p>\n  <p><strong>全球油轮运费飙升，超大型油轮运价暴涨超400%</strong></p>\n  <p>美伊冲突爆发半年多，叠加霍尔木兹海峡通航持续受阻，全球石油运输市场迎来极端行情，超大型油轮运价比冲突前暴涨超400%，运往亚洲的油价随之走高。数据显示，休斯顿运往亚洲的原油，每桶运费约26美元，占到WTI原油期货价格的四分之一。9月中东至中国航线超大型油轮日租金突破100万美元，达到冲突前5倍以上。高昂运费推高船东收益，不少亚洲炼油厂放弃中东原油，转向更近货源采购，中小油轮运价同步上涨。</p>\n  <p>运价走高源于海峡地缘风险抬升航运风险溢价，油轮绕行非洲南端，拉长运输周期、损耗有效运力。当前美伊尚未达成协议，运费短期大概率维持高位，加剧全球输入型通胀。（21世纪经济报道）</p>\n  <p><strong>诺和诺德宣布裁掉1.3万个岗位</strong></p>\n  <p>去年9月份宣布要裁员9000人的诺和诺德，于9月21日在伦敦举办的资本市场日上披露了最终减员情况。诺和诺德方面表示，通过本轮组织调整，公司节约成本超100亿（15.35亿美元）丹麦克朗，帮助公司重新投向商业化与研发；过往调整累计涉及约1.3万个岗位，目前全球全职员工为6.6万人。诺和诺德本轮人员优化背后，核心动因是支撑公司七成以上营收的王牌产品司美格鲁肽，正面临增长承压的挑战。2026年上半年，诺和诺德司美格鲁肽产品组合（包括降糖以及减重适应证在内），合计销售额为1121.93亿丹麦克朗（约175.25亿美元），收入已落后竞品礼来的替尔泊肽约102亿美元。（第一财经）</p>\n  <p><strong>第二大股东清仓离场，绿茶集团股价较高点近腰斩&nbsp;</strong></p>\n  <p>港股绿茶集团（06831.HK）上市仅1年4个月，第二大股东合众集团旗下Partners Gourmet 已通过场外交易清仓全部持股，彻底退出。截至9月22日收盘，绿茶集团报4.995港元/股，涨幅1.52%；对比2025年7月9.81港元的历史高点，股价回撤49.08%，近乎腰斩。</p>\n  <p>早在今年4月，公司便披露该股东合计出售1.0614亿股，占总股本15.96%，交易完成后将不再持股。（界面新闻）</p>\n  <p><strong>美心月饼打六折冲上热搜，五星酒店月饼被三折甩卖&nbsp;</strong></p>\n  <p>记者走访多家线下商超发现，即便离中秋还有四五天，月饼促销潮已然开启。美心、半岛、英记、荣华等传统高端月饼品牌多款礼盒，在线下普遍打出7-9折。而在香港本地，叠加支付方式优惠，美心月饼部分产品在促销期间折扣已低至六折。二手平台上多数五星级酒店月饼礼盒三折甩卖，价格低至200元以下。一位经销商表示，深圳JW万豪月饼礼盒官方售价298元至498元，目前最低99元；成都W酒店原价258元月饼礼盒149元可到手；广州丽思卡尔顿原价388元雅致礼盒仅售110元，428元专属礼盒也只卖228元。（界面新闻）</p>\n  <p><strong>美股三大指数涨跌不一，闪迪涨超6%</strong></p>\n  <p>36氪获悉，9月22日收盘，美股三大指数涨跌不一，纳指涨0.45%，标普500平收，道指跌0.36%；大型科技股有涨有跌，闪迪涨超6%，美光涨5%，特斯拉、英伟达、苹果小幅上涨，亚马逊、谷歌跌超1%，微软、Meta小幅下跌；热门中概股普涨，蔚来、拼多多、理想汽车、网易涨超1%，哔哩哔哩、阿里巴巴、京东、百度、小鹏集团小幅上涨。</p>\n  <p><strong>港交所拟降交易审批门槛，新股分拆上市锁定期缩至一年</strong></p>\n  <p>香港交易所继续推进上市机制改革，并展开为期10周的公众咨询。咨询文件中披露，本次改革涉及多项上市公司交易及分拆业务上市的简化安排。继上一阶段上市机制改革瞄准新股，本轮第二阶段的上市机制改革聚焦发行人上市后的持续监管规定，涵盖须予公布的交易、关连交易及分拆上市三大范畴。新规旨在使香港上市发行人日后进行重大收购、出售及分拆子公司上市，变得更加灵活快捷。根据现行港股《上市规则》，上市发行人进行的交易须按资产、盈利、收益、代价等百分比率划入不同类别：规模测试达到5%但低于25%的交易属“须予披露的交易”，只需刊发公告；达到25%但低于75%（出售事项）或100%（收购事项）的属“主要交易”，须刊发通函并经股东大会批准；规模更大的交易则归入“非常重大的收购事项”及“非常重大的出售事项”两个类别。（财新网）</p>\n  <h2>上市进行时</h2>\n  <p><strong>彤程新材开启招股，9月29日上市交易</strong></p>\n  <p>9月21日，半导体光刻胶公司彤程新材公告，拟全球发售6811.87万股H股，香港公开发售于当日9时启动，预期9月29日于联交所上市交易。公司发售价区间为39.00–44.00港元/每股，按区间均价41.5港元测算，本次H股募资约28.27亿港元。</p>\n  <p><strong>欢创科技：拟全球发售1158.88万股H股，发售价58.85港元</strong></p>\n  <p>36氪获悉，欢创科技公告，公司拟全球发售11588800股H股，香港发售股份1158900股H股，国际发售股份10429900股H股，另有15%的超额配股权；发售价为每股58.85港元；预期股份将于2026年9月30日开始在香港联交所买卖。</p>\n  <h2>投融资</h2>\n  <p><strong>红杉、云启领投，“华超神控”完成2亿元Pre-A轮融资</strong></p>\n  <p>近日，非侵入AI脑机接口公司“华超神控”（BCI-Sonics）宣布完成2亿元人民币Pre-A轮融资。本轮融资由红杉中国与云启资本联合领投，比邻星投资、元禾控股、徐汇科创投、德石投资跟投，老股东经纬创投、德联资本持续加注。循光资本持续担任独家战略财务顾问。所募资金将用于产品研发、核心人才引进、临床研究推进和AI基础设施建设。此前，公司已相继完成由经纬创投领投的天使轮和由德联资本、道远资本联合领投的天使+轮融资，成立至今累计融资近3亿元。</p>\n  <p><strong>“智冉医疗”获超6亿元融资</strong></p>\n  <p>36氪获悉，侵入式脑机接口公司“智冉医疗”完成了新一轮融资，估算本轮融资金额超6亿元人民币。其中，顺禧基金、济峰资本、君联资本、红杉资本、国寿资本、元生创投、顺为资本、美团龙珠、中关村科学城、杏泽资本、佳银资本、中科创星、华盖资本、丹麓资本等参与投资。按此前公开信息，自去年8月完成超3亿元A轮融资至今，智冉累计融资超过12亿元。</p>\n  <p><strong>“龙讯旷腾”完成亿元级B1轮融资</strong></p>\n  <p>36氪获悉，近日AI4S企业“龙讯旷腾”完成亿元级B1轮融资，老股东同创伟业持续加码，国泰海通开元和中新资本联合投资。此次融资将用于研发团队扩充、干湿闭环搭建、商务体系建设。</p>\n  <p><strong>“庆为航空”完成超5000万元新一轮融资</strong></p>\n  <p>36氪获悉，“庆为航空”近日完成超5000万元新一轮融资，由中信建投资本、光谷科创投、江西金控资本联合投资。这是公司继高瓴创投、松禾资本、梅花创投之后，在半年内完成的第三轮融资。资金将主要用于加速高安全等级（DAL A）电传飞控计算平台和智能座舱显示系统的研发与适航进程。</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果新款Mac mini和Mac Studio今日上市</strong></p>\n  <p>9月22日，苹果宣布新款Mac mini和Mac Studio正式上市。Mac mini搭载M6或M5 Pro芯片，起售价分别为899美元和1699美元；Mac Studio搭载M5 Max或M5 Ultra芯片，起售价分别为2499美元和5499美元。（财联社）</p>\n  <p><strong>整理丨李琪</strong></p>", "category": "tech", "published_at": "2026-09-23T01:55:19+00:00", "fetched_at": "2026-09-23T03:01:20.689228+00:00", "fingerprint": "9672f7cc8a26ef81"}, {"source": "36氪 - 最新文章", "title": "当所有项目都开始说同一种话，如何让你的项目脱颖而出？", "url": "https://36kr.com/p/3995396694610049?f=rss", "summary": "<p>如果最近看过不少创业项目介绍，可能会发现一个有意思的变化：</p>\n  <p><strong>很多项目越来越像了。</strong></p>\n  <p>AI+教育、AI+营销、AI+客服、AI+医疗；智能硬件、机器人、企业服务、行业解决方案……</p>\n  <p>再往下看几段，往往又是熟悉的表达：</p>\n  <p>“通过AI技术提升效率。”</p>\n  <p>“解决行业长期存在的痛点。”</p>\n  <p>“打造下一代智能化解决方案。”</p>\n  <p>这些话不能说错。</p>\n  <p>但问题是，当越来越多项目都在使用同一套语言介绍自己时，<strong>真正不同的东西反而越来越难被发现。</strong></p>\n  <p>&nbsp;</p>\n  <h3><strong>01 先从一个熟悉的标签开始</strong></h3>\n  <p>尤其是早期项目。</p>\n  <p>很多团队其实已经做了不少事情：产品有了，客户有了，技术也经过了验证。</p>\n  <p>但到了介绍自己的时候，最后留下来的往往只有几个标签：</p>\n  <p>AI、机器人、平台、SaaS、智能制造。</p>\n  <p>标签很容易理解，却很难让人真正记住一个项目。</p>\n  <p>同样是做AI，有的团队解决的是一个非常具体的工作流程；同样是机器人，有的项目真正改变的是某个细分行业的生产方式。</p>\n  <p>如果只看一句项目简介，这些差异很容易被忽略。</p>\n  <p>&nbsp;</p>\n  <h3><strong>02 真正有意思的东西，往往藏在标签下面</strong></h3>\n  <p>一个项目到底值不值得关注，很多时候不是看它用了什么热门概念。</p>\n  <p>更值得看的，可能是几个很具体的问题：</p>\n  <p><strong>为什么有人开始做这件事？</strong></p>\n  <p><strong>产品到底解决了什么问题？</strong></p>\n  <p><strong>有没有真实的用户愿意使用？</strong></p>\n  <p><strong>项目现在走到了哪一步？</strong></p>\n  <p>这些信息看起来没有那么“热闹”，却更容易让一个项目从一堆相似的项目里真正区别出来。</p>\n  <p>而对于早期项目来说，这些变化本身也值得被记录。</p>\n  <p>&nbsp;</p>\n  <h3><strong>03 不是所有项目一开始就有标准答案</strong></h3>\n  <p>创业项目很少是一开始就完整的。</p>\n  <p>可能最初只是一个想法，后来做出了产品；</p>\n  <p>可能先有技术，再慢慢找到具体的应用场景；</p>\n  <p>也可能产品已经上线，但团队还在不断调整商业模式。</p>\n  <p>所以，有些项目值得关注，并不是因为它现在已经足够成熟，而是因为<strong>它正在发生变化。</strong></p>\n  <p>这也是36氪「项目推荐」持续寻找项目的一个原因。</p>\n  <p>我们希望看到的，不只是已经被大量讨论的热门项目，也包括那些正在产品验证、市场探索和商业化过程中的新项目。</p>\n  <p>&nbsp;</p>\n  <h3><strong>04 把项目真正做过的事情讲出来</strong></h3>\n  <p>基于这些项目，36氪「项目推荐」也在持续推出不同的内容形式。</p>\n  <p><strong>「36氪项目新势榜」</strong></p>\n  <p>每周从项目推荐中发现正在成长的新项目，通过榜单集中呈现，让更多项目有机会进入行业视野。</p>\n  <p><strong>「项目开麦」</strong></p>\n  <p>通过视频采访，让项目团队直接讲清楚自己在做什么、为什么做，以及目前走到了哪一步。</p>\n  <p>比起一套标准化的项目介绍，我们更希望听到项目本身的故事。</p>\n  <p>因为创业项目真正有意思的地方，往往不是那几个熟悉的标签，而是：</p>\n  <p><strong>一个团队为什么决定解决这个问题，以及他们已经走了多远。</strong></p>\n  <p>如果你正在做一个项目，或者身边有正在做新产品、新技术、新业务的团队，也可以把项目推荐给36氪「项目推荐」。</p>\n  <p>不需要先把自己包装成一个成熟项目。</p>\n  <p>把现在正在做的事情讲清楚，就够了。</p>\n  <p><strong>有些项目值得关注，恰恰是因为它还在变化。</strong></p>\n  <p>&nbsp;</p>\n  <p>📌&nbsp;<strong>免费提交项目：</strong><br /><a href=\"https://36kr.com/seek-report-new\" rel=\"noopener noreferrer\" target=\"_blank\">https://36kr.com/seek-report-new</a></p>\n  <p>📮&nbsp;<strong>项目推荐联系邮箱：</strong><br /><a href=\"mailto:aireport@36kr.com\">aireport@36kr.com</a></p>\n  <p><strong>客服可以扫描下方二维码联系～</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_61e9fced05214f5881a6e6e2ad218743@5284654_oswg50025oswg216oswg210_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加！</p>\n  <p><strong>36氪「项目推荐」</strong></p>\n  <p><strong>让好项目，更早被看见。</strong></p>", "category": "tech", "published_at": "2026-09-23T02:48:28+00:00", "fetched_at": "2026-09-23T03:01:20.689215+00:00", "fingerprint": "fa03522ba766abfa"}, {"source": "少数派", "title": "少数派独家｜泡泡骚 Low Pro 碳纹黑款，把握持与支撑收进 2.6mm", "url": "https://sspai.com/post/114823", "summary": "如果你关注了前段时间的少数派众测，应该已经见过PopSockets泡泡骚LowPro极薄站立支架。它是一款颠覆以往所有磁吸支架形态的产品，够薄、够轻，最重要的是足够好用。这款在活动中预告过的独家款支架 ...<a href=\"https://sspai.com/post/114823\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-22T02:44:06+00:00", "fetched_at": "2026-09-23T03:01:19.245437+00:00", "fingerprint": "952b4f492c305980"}, {"source": "少数派", "title": "Coast：用十年经验，给记账这件事一个「终点」", "url": "https://sspai.com/post/114479", "summary": "从大学时代入不敷出开始记账，到 10 年后发现记账数据没有被充分利用，再到用 Vibe Coding 把自己的想法做成了一款 App——10 年的记账经验变成了产品设计的基础，而 Vibe Coding 让一个非技术出身的人有能力把这些想法实现出来。<a href=\"https://sspai.com/post/114479\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-22T06:39:39+00:00", "fetched_at": "2026-09-23T03:01:19.245386+00:00", "fingerprint": "5ac750e89d86e937"}, {"source": "少数派", "title": "怀旧手记｜25 年前的笔记本，如何兼顾轻薄、时尚与性能？", "url": "https://ssp "2026-09-21T23:48:56+00:00", "fetched_at": "2026-09-22T03:01:09.359316+00:00", "fingerprint": "5b6bd826831acf44"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨闲鱼回应“暗藏涉黄产业链”；西贝被传倒闭后，贾国龙最新发声；AMD总市值首次突破1万亿美元", "url": "https://36kr.com/p/3993831103347713?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI敦促美国牵头为人工智能制定全球标准</li>\n   <li>钟南山团队发现肺结节发病新趋势</li>\n   <li>黄仁勋：没有什么比能够缴纳更多税款更让我感到快乐的了</li>\n   <li>抖音“试水”基金跳转入口</li>\n   <li>五角大楼“披萨指数”飙升</li>\n   <li>A股“股王”联讯仪器市值距高点蒸发超400亿元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>闲鱼回应涉黄：成立专项小组严打色情引流，呼吁各平台联合行动</strong></p>\n  <p>36氪获悉，针对被媒体曝光存在暗藏涉黄产业链的问题，闲鱼表示，坚决对利用色情内容进行引流、欺诈的违法行为说不，已成立专项小组，并建立“前置识别—即时处置—警企联动”等综合防控治理机制，坚决打击。2026年1月至今，闲鱼已累计冻结色情引流类风险账号98358个。闲鱼主动将相关线索移送公安部门，今年以来已成功警企协同打击色情团伙15个。</p>\n  <p><strong>西贝被传倒闭后，贾国龙最新发声</strong></p>\n  <p>9月21日，澎湃新闻获悉，在9月20日的一场会议上，西贝创始人贾国龙发表演讲称，站在民营企业家的角度，结合西贝这一惨痛的教训，有几点体会和呼吁，“恳请监管部门进一步厘清高流量网络账号的言论边界，区分正常舆论监督、观点辩论和恶意贬损、商业诋毁、网络软暴力。”贾国龙在演讲中称，对于手握巨大流量，发生纠纷，绕开行业行政投诉、调解、诉讼等正当法定渠道，转而在互联网公开煽动舆论、悬赏造势、挂人引战，甚至株连打击当事人的合作伙伴，应予以规范。（澎湃新闻）</p>\n  <p><strong>AMD总市值首次突破1万亿美元</strong></p>\n  <p>超威半导体（AMD）美股盘中涨幅扩大至9.5%，股价突破613美元，总市值首次突破1万亿美元，成为全球市值突破万亿美元的半导体公司之一。截至当地时间2026年9月21日，收盘价615.52美元，上涨55.70美元，涨幅9.95%（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI敦促美国牵头为人工智能制定全球标准</strong></p>\n  <p>OpenAI敦促美国牵头与其他国家共同为前沿人工智能（AI）制定标准，以回应对AI潜在危害日益加剧的担忧。OpenAI周一在博客文章中表示，为了安全地发展人工智能，有必要制定国际技术标准，特别是帮助界定涉及AI模型的哪些类事件应当通报，明确各国如何开展AI发展合作，以及改善开发此类技术所需算力的获取。“要让AI的持续进步安全有益，既需要推进对齐研究，也需要制定共同标准，为各实验室和各国的AI开发提供指引，”OpenAI表示。（新浪财经）</p>\n  <p><strong>智谱回应数据隐私争议：ZCode即将正式开源，并开展安全审计</strong></p>\n  <p>近期卷入数据隐私安全争议的ZCode，即将迎来开源。智谱方面表示，此次开源是回应外界对ZCode数据处理担忧的第一步；未来还将推动ZCode更加彻底地走向社区化，欢迎外界下载、检查代码，共同参与改进。在安全性方面，智谱透露，已邀请中国信息通信研究院对ZCode开展安全审计，重点核查数据留存情况。未来还将建立常态化的产品安全漏洞报告机制，欢迎开发者伙伴共同检查、反馈问题，平台将根据问题严重等级给予相应回报。（澎湃新闻）</p>\n  <p><strong>亚马逊官宣接入Kimi K3，Kimi与海外云厂商分成模式正式落地</strong></p>\n  <p>36氪获悉，亚马逊云科技（AWS）旗下大模型服务平台Amazon Bedrock日前宣布接入开源大模型Kimi K3，全球企业开发者可通过Bedrock直接调用，此前传闻的Kimi与海外云厂商收入分成合作正式落地。据了解，月之暗面正与多家海外云厂商推进收入分成合作，云厂商在其平台上架Kimi模型，并基于模型调用量与月之暗面进行分成，这是中国大模型公司首次以分成模式向全球三大云厂商输出模型能力。</p>\n  <p><strong>马斯克旗下SpaceXAI发布Grok 4.7模型</strong></p>\n  <p>当地时间9月21日，马斯克旗下SpaceXAI正式发布Grok 4.7模型，每百万Token输入定价2美元。（界面新闻）</p>\n  <p><strong>Kimi Code桌面客户端上线</strong></p>\n  <p>36氪获悉，Kimi Code官方桌面客户端macOS和Windows版同步上线。针对开发者的实际工作流，桌面端还提供内置终端、浏览器和Git状态查看等功能，支持直接运行和调试项目、审阅代码改动，关联PR状态，方便跟踪代码评审与合并进度。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>特斯拉机器人团队在长三角审厂，多家企业已获订单</strong></p>\n  <p>特斯拉机器人团队落地宁波审厂一事受到资本市场广泛关注。从产业链人士处获悉，特斯拉机器人团队已经于上周在拓普集团、三花智控、均胜电子等供应链企业开启审厂工作。上述企业主要供给关节模组、执行器、精密结构件等核心机电部件。“在本次审厂前，这些企业都已经拿到了特斯拉人形机器人的订单，只是或多或少的区别。审厂将对相关产线质量、合规等方面开展评估，通过后将很快开始生产。”上述人士提到。（澎湃新闻）</p>\n  <p><strong>钟南山团队发现肺结节发病新趋势</strong></p>\n  <p>2026年8月，钟南山团队发表在国际期刊《癌症科学进展》上的一项研究，对一万余名偶然发现肺结节的人进行了2～3年的随访，参与者覆盖全国16个省份、23家医院。在这上万人的大数据里，研究团队发现，偶发肺结节的发病出现了一个非常明显的新趋势：</p>\n  <p>女性占56.56%，中位年龄53岁，男性中位年龄55岁；从不吸烟者占71.34%，其中女性非吸烟者比例高达97.1%，男性非吸烟者也有37.8%；71.10%的人有二手烟暴露史。在这项研究里，被肺结节找上的人，女性占了多数，从不吸烟的人也占了多数。而且，女性的发病年龄比男性更早。（人民日报）</p>\n  <p><strong>黄仁勋：没有什么比能够缴纳更多税款更让我感到快乐的了</strong></p>\n  <p>英伟达CEO黄仁勋在周日的一次采访中表示，如果美国加州在今年秋季投票通过拟议的“亿万富翁税”，他并不介意为此多缴纳数十亿美元的税款。“能够负担得起在五年内缴纳80亿美元税款，这是一种特权。”黄仁勋说，“我视其为一种特权，也是一种责任。没有什么比能够缴纳更多税款更让我感到快乐的了。”“我不怕交税——我只怕变穷，”他说。（财联社）</p>\n  <p><strong>抖音“试水”基金跳转入口</strong></p>\n  <p>在《金融产品网络营销管理办法》即将实施之际，抖音悄然开通买基金的功能。界面新闻记者实测发现，点击“我的钱包”即可进入理财页面，在页面最下端已经上线了基金接口。用户点击后即可进入基金页面，设置了活期理财、银行存单、稳健理财、红利基金、追求收益五个子菜单，分别对应货币基金、债券基金、固收+、主动权益基金、QDII等多个类型的公募产品。不过，由于抖音没有基金销售牌照，所以用户在点击具体的产品详情时，就会跳出华泰证券的开户页面。除了华泰证券，用户还可以选择浙商证券和中金财富等其他两家券商进行开户。（界面新闻）</p>\n  <p><strong>支付宝宣布组织调整和全新任命</strong></p>\n  <p>《科创板日报》21日讯，蚂蚁集团CEO韩歆毅发布全员信，宣布支付宝进行组织调整与人事任命。根据调整，支付宝事业群、数字支付事业群和芝麻信用事业部将组建全新的支付宝事业群。吴敏芝将担任新支付宝事业群总裁，并兼任蚂蚁CPO。吴敏芝于2021年8月加入蚂蚁集团。在此之前在阿里巴巴集团任职20余年，先后担任阿里巴巴国际贸易事业群总裁、B2B事业群总裁、阿里巴巴首席客户官等岗位。（科创板日报）</p>\n  <p><strong>阿里巴巴任命刘大一恒为QwenLLM团队新负责人</strong></p>\n  <p>据两位知情员工透露，阿里巴巴集团已任命资深AI研究人员刘大一恒担任Qwen（通义千问）大语言模型项目负责人。知情人士表示，在今年早些时候历经多轮组织重组后，刘大一恒的任职，进一步厘清了Qwen团队的管理层架构。阿里巴巴一年一度的云栖大会将于周二开幕，在大会官网的演讲嘉宾名单页面，刘大一恒的个人肖像位置十分突出，紧随集团主席蔡崇信、首席执行官吴泳铭之后。官网标注其职务为Qwen大语言模型项目负责人。（新浪财经）</p>\n  <p><strong>中国人民银行召开外资金融机构座谈会</strong></p>\n  <p>36氪获悉，据中国人民银行网站，9月21日，中国人民银行召开外资金融机构座谈会，听取外资金融机构意见建议，研究进一步优化营商环境、推动金融业高水平对外开放有关工作。座谈会上，潘功胜介绍了当前中国经济金融形势和货币政策实施情况，听取意见建议，并就各机构关心的问题交流回应。潘功胜表示，中国经济运行总。体平稳向好，结构持续优化，高质量发展不断取得新进展。中国人民银行将认真落实党中央、国务院决策部署，实施好适度宽松的货币政策，为经济稳定增长和金融市场平稳运行营造良好的货币金融环境。继续推动金融高水平开放，持续完善政策供给，稳步扩大金融市场双向开放，不断优化跨境支付服务，更加便利人民币国际使用。各外资金融机构认为，今年以来中国人民银行在深化金融业改革开放、优化营商环境、便利人民币国际使用等方面的系列举措取得积极进展。希望持续优化相关政策，并加强与市场的沟通。</p>\n  <p><strong>A股“股王”联讯仪器市值距高点蒸发超400亿元</strong></p>\n  <p>9月21日午后，A股高价股整体低迷，“股王”联讯仪器盘中一度跳水跌超7%，截至13:21跌超6%，最新市值2367亿元，跟上一个交易日相比，市值半日蒸发近167亿元；跟历史高位2772亿元相比，已回撤超过400亿元。此外，源杰科技、频准激光、北方华创、蘅东光、宇树科技-W、精智达纷纷下滑。（21世纪经济报道）</p>\n  <p><strong>显示器也开始涨价了，部分产品90天涨幅达13.49%</strong></p>\n  <p>据界面新闻报道，继内存、固态硬盘价格大幅上涨后，涨价压力正加速向产业链下游传导，显示器价格已出现明显上涨迹象。记者查询得物APP上一款泰坦军团的显示器，近90天数据显示，该产品价格从482元涨至547元，上涨65元，涨幅约13.49%。记者查询京东上一款KTC的显示屏，慢慢买APP数据显示，该款产品在8月20日曾跌至1064.34元的近60日低点，9月10日以来则出现上涨，最新价格为1199.7元。KTC京东旗舰店客服对此回应称，价格会因活动力度或市场波动而变化，可能出现部分商品涨价或降价的情况。（界面新闻）</p>\n  <p><strong>比特币突破85000美元</strong></p>\n  <p>行情显示，截至9月21日，比特币涨至85004.4美元，过去24小时内涨5.56%；以太坊涨至2743.67美元，过去24小时内涨6.17%。（财联社）</p>\n  <p><strong>四川大学：有吸烟等消费型不良嗜好，将取消学费减免资格</strong></p>\n  <p>日前，四川大学发布《关于开展2026-2027学年本科生学费减免工作的通知》，其中明确，有下列情况之一者，取消学费减免资格：1．违反国家法律、学校规章制度，受到处分者。2．在提供相关证明或填写相关材料中弄虚作假者。3．有吸烟、酗酒、沉迷网络或其他消费型不良嗜好者。4．有其他不符合减免条件者。（界面新闻）</p>\n  <p><strong>大众汽车被剔除出欧洲蓝筹股指数</strong></p>\n  <p>大众汽车15年来首次被剔除出欧元区最重要的蓝筹股指数。交易员表示，此举可能进一步加剧这家德国车企股价所承受的下行压力。大众股价已较2021年股市上涨期间的高点下跌逾四分之三，目前徘徊在约16年来的低位。该指数自称追踪欧元区各行业的“龙头企业”。这凸显出低成本竞争对手的崛起给汽车行业带来的威胁，也反映出市场对大众历史性重组计划的怀疑。该计划将削减10万个工作岗位。分析师表示，随着追踪该指数的交易所交易基金（ETF）抛售所持股份，大众被剔除可能加剧其股价压力。（财联社）</p>\n  <p><strong>奥迪德国总部阻止AUDI车型进入德国市场？上汽奥迪回应</strong></p>\n  <p>9月21日，上汽奥迪主理人谢施奇发文，针对近日网传“奥迪德国总部阻止AUDI车型进入德国市场”及海外AUDI平行进口车相关报道进行澄清。谢施奇在文中表示，部分报道援引自外媒刊载的奥迪发言人表述，该段内容属于售后服务范畴，意在表达奥迪无法对非官方支持的平行进口AUDI车辆提供售后服务保障，因为这些平行进口车会被视作第三方车辆，并非对品牌的不认可。针对相应过激及断章取义的言论，将取证并采取相应法律手段。（界面新闻）</p>\n  <p><strong>AI基建遭遇社区抵制，美国680亿美元数据中心项目受阻</strong></p>\n  <p>据报道，研究机构Data Center Watch当地时间9月21日表示，今年4月至6月期间，美国约45个总价值680亿美元的数据中心项目因当地反对而遭到叫停或推迟。目前全美多地社区正推动出台暂停建设数据中心的禁令，且往往在开发商正式申请许可前便已启动相关行动。Data Center Watch报告显示，约30个州议会已提出或通过涉及数据中心选址、电力供应及用水问题的相关规定。（界面新闻）</p>\n  <p><strong>黄仁勋：警惕AI末日叙事，部分人士意在谋求豁免现行法律管控</strong></p>\n  <p>英伟达CEO黄仁勋直指达里奥与奥特曼借“失控人工智能”造势，以此规避现行法律下的巨额诉讼风险。“不要让这种末日论调，使得他们得以豁免于现有法律。要读懂言外之意：他们其实并非要求新增法律，而是希望摆脱我们当下已有的法律约束。”（新浪财经）</p>\n  <p><strong>派拉蒙天舞就收购华纳兄弟案与12州达成和解</strong></p>\n  <p>当地时间9月21日，派拉蒙天舞公司已与美国加利福尼亚州及其他11个州达成和解协议。这些州此前曾提起诉讼，试图阻止该公司与华纳兄弟探索公司之间价值1100亿美元的合并交易；此次和解为这两大好莱坞巨头的合并扫清了障碍。据悉，加州总检察长罗布·邦塔当日在洛杉矶举行的新闻发布会上宣布了这一和解消息。</p>\n  <p>这一决定是派拉蒙天舞公司寻求收购华纳兄弟探索公司过程中的最新进展，若交易达成，该联合体将成为娱乐行业规模最大、实力最强的公司之一。（央视新闻）</p>\n  <p><strong>日本65岁以上高龄者占比创历史新高</strong></p>\n  <p>日本总务省9月20日公布的人口推算数据显示，截至9月15日，日本65岁以上高龄者数量约为3624万人，约占总人口29.6%，占比创下历史新高。（新华社）</p>\n  <p><strong>五角大楼“披萨指数”飙升</strong></p>\n  <p>9月19日，美国驻中东多国大使馆发布安全警示称，由于中东局势紧张，安全环境仍然复杂，存在发生不可预见的局势升级的可能性，身处中东地区的美国人应“保持高度警惕”，注意航班取消、空域关闭和旅行中断等情况。同日，美国“披萨指数”追踪网站发布的数据显示，五角大楼附近的披萨店当天订单数出现激增。据美媒此前报道，“披萨指数”通过追踪五角大楼附近披萨店的订单数推测美国国防部是否存在加班，借此预测美国的军事行动。在“沙漠风暴”、美军空袭伊朗核设施等军事行动前，五角大楼附近披萨店就曾出现订单激增的情况。（环球网）</p>\n  <p><strong>港交所拟将主要交易门槛提至50%</strong></p>\n  <p>9月21日，港交所发布《上市机制竞争力检讨（第二阶段）》咨询文件，建议调整上市发行人须予公布交易、关连交易及分拆上市的监管规则。其中，界定主要交易的重要性门槛拟由现行25%提高至50%。按建议，任何一项百分比率达到25%但低于50%的交易，将归类为须予披露的交易，并以加强公告披露要求取代通函及股东批准规定。</p>\n  <p>港交所表示，此次改革旨在协助上市发行人更灵活、高效地开展公司交易，同时为投资者提供稳妥保障，维持市场信心。（21世纪经济报道）</p>\n  <p><strong>2026年上半年全球四足机器人出货3.5万台，行业场景撑起长期增长空间</strong></p>\n  <p>36氪获悉��据Counterpoint咨询消息，2026年上半年，全球四足机器人出货量接近35000台，其中40%用于行业应用场景。各垂直行业需求爆发，将持续拉动四足机器人产业增长。凭借文娱科教赛道先发优势，宇树占据整体市场龙头地位。在长期增长潜力更可观的行业应用领域，智元酷拓与云深处分列第一、第二。行业应用需求持续增长叠加具身智能技术进步，有望推动该市场规模在2030年突破100亿美元。</p>\n  <p><strong>上交所：将持续关注沈鼓集团</strong></p>\n  <p>9月21日，上交所发布关于沈鼓集团相关情况的通报：沈鼓集团（601091）自2026年9月17日上市以来，股票价格大幅波动。部分投资者在交易该股过程中存在影响股票交易正常秩序的异常交易行为，上交所持续对违规投资者采取了自律监管措施。公司已发布风险提示公告，提醒广大投资者理性决策，审慎投资。</p>\n  <p>9月21日，该股交易2次触及盘中临时停牌。上交所将持续对该股上市初期交易予以密切关注，依规采取自律监管措施。（界面新闻）</p>\n  <p><strong>*ST元道：收到股票终止上市决定</strong></p>\n  <p>36氪获悉，9月21日，*ST元道(301139.SZ)公告称，公司收到深交所终止上市决定，因首次公开发行股票披露文件存在虚假记载，触及创业板股票上市规则相关终止上市情形。公司股票于2026年9月30日复牌并进入退市整理期，为期十五个交易日，预计最后交易日期为10月27日。</p>\n  <p><strong>银河微电：拟10.78亿元投资高端核心器件产业化及创新能力建设项目</strong></p>\n  <p>36氪获悉，银河微电公告，为提高集成电路分立器件产品的生产加工制造能力，扩大集成电路分立器件产品的生产规模，公司拟以自有或自筹资金10.78亿元投资实施“高端核心器件产业化及创新能力建设项目”，项目建设周期3年，预计开工时间为2027年1月1日。</p>\n  <p><strong>智谱AI增资至约4876万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，智谱AI关联公司北京智谱华章科技股份有限公司发生工商变更，注册资本由约4656万人民币增至约4876万人民币。该公司成立于2019年6月，法定代表人为刘德兵，经营范围含人工智能基础软件开发、人工智能应用软件开发、数据处理和存储支持服务、数据处理服务、信息技术咨询服务、人工智能理论与算法软件开发、数字内容制作服务、大数据服务等，由唐杰、天津三快科技有限公司、广西腾讯创业投资有限公司等共同持股。</p>\n  <p><strong>江波龙完成回购计划</strong></p>\n  <p>A股存储龙头江波龙公告称，公司此前拟以不低于人民币4亿元、不超过人民币8亿元回购股份，回购价格不超过人民币735元/股，用于股权激励或员工持股计划。2026年9月8日至2026年9月18日，公司实际回购A股股份229.06万股，占A股总股本的0.53%，成交总金额为8亿元(含交易费用)，本次回购计划已实施完毕。（财联社）</p>\n  <p><strong>威华达控股31.86亿港元引入特斯联为战略股东</strong></p>\n  <p>36氪获悉，威华达控股公告，以每股2.7港元向Nova Scope Ventures Limited发行11.8亿股新股，对价约31.86亿港元，引入AI战略股东特斯联。此次交易被列为公司长期重大投资。交易完成后，特斯联将成为威华达主要股东，双方将依靠各自产业及技术优势达成深度战略协同，深化国产AI产业布局。</p>\n  <p><strong>美股三大指数集体收涨，英特尔涨超12%</strong></p>\n  <p>36氪获悉，9月21日收盘，美股三大指数集体上涨，纳指涨2.26%，标普500涨1.49%，道指涨0.71%；大型科技股集体走强，英特尔涨超12%，Meta涨超11%，特斯拉涨超3%，英伟达涨超2%，亚马逊、微软、谷歌涨超1%，苹果小幅上涨；热门中概股涨多跌少，百度、阿里巴巴涨超2%，哔哩哔哩、京东、网易涨超1%，拼多多、蔚来小幅上涨，理想汽车跌超5%，小鹏集团跌超1%。</p>\n  <p><strong>美国零售柴油价格已正式突破每加仑6.50美元大关，刷新历史名义最高纪录</strong></p>\n  <p>根据美国汽车协会（AAA）最新发布的数据，全美零售柴油平均价格已飙升至每加仑6.5050美元，成为全美柴油价格的全新峰值。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>罗博特科：拟全球发售1187.60万股H股，发售价不超436港元</strong></p>\n  <p>36氪获悉，罗博特科在港交所公告，公司拟全球发售1187.60万股H股，香港发售股份118.76万股H股，国际发售股份1068.84万股H股；最高发售价为每股436.00港元；预期股份将于2026年9月29日开始在香港联交所买卖。</p>\n  <p><strong>本末科技：拟全球发售5000万股H股，发售价21.60港元</strong></p>\n  <p>36氪获悉，本末科技在港交所公告，公司拟全球发售5000万股H股，香港发售股份250万股H股，国际发售股份4750万股H股；发售价为每股21.60港元；预期股份将于2026年9月29日开始在香港联交所买卖。</p>\n  <p><strong>景旺电子：拟全球发售7294.43万股H股，发售价不超69.88港元</strong></p>\n  <p>36氪获悉，景旺电子在港交所公告，公司拟全球发售72944300股H股，香港发售股份7294500股H股，国际发售股份65649800股H股；最高发售价为每股69.88港元；预期股份将于2026年9月29日开始在香港联交所买卖。</p>\n  <h2>投融资</h2>\n  <p><strong>仿星器企业“鸿鹄未来能源”完成数亿元融资</strong></p>\n  <p>近日，仿星器企业“鸿鹄未来能源”宣布完成数亿元融资，由上海未来产业基金、社保基金中关村自主创新专项基金（君联资本担任管理人）、光合创投、交大母基金、上海孚腾资本、上海闵金投、耀途资本、芯联资本、云启资本、德同资本、鸿富资产、启高资本、仁智资本、奇绩创坛等机构共同参与，公司早期投资人戴立忠博士亦持续加注。融资将用于“鸿鹄致远一号”高温超导仿星器的研发建造、团队扩充及公司运营等。</p>\n  <h2>酷产品</h2>\n  <p><strong>贾跃亭发布九款机器人</strong></p>\n  <p>近日，贾跃亭旗下FF召开新品发布会，一次性推出9款EAI机器人产品，覆盖人形、四足、轮臂三大形态，零售价从9990美元至137900美元。顶配机型折算后最高达到92万元，发布之后就可以直接对外销售交付。这次一共是5大机型、9种配置，不光出硬件，还同步上线4套行业解决方案，分别面向K12教育、科研、安防、巡检场景，不只是做演示样机，目标直接对准学校、工厂、园区、矿山这些真实落地环境。</p>\n  <p><strong>整理丨</strong>李琪</p>", "category": "tech", "published_at": "2026-09-22T00:15:14+00:00", "fetched_at": "2026-09-22T03:01:09.252701+00:00", "fingerprint": "c2c907cb9b6ea092"}, {"source": "36氪 - 最新文章", "title": "AI长剧首次上星，股价连续涨停，芒果TV“用内容做AI”的AIGC逆向实验｜专访", "url": "https://36kr.com/p/3993401668909827?f=rss", "summary": "<p>8月31日，神话题材季播剧《后西游记》第一季“花果山篇”正式在湖南卫视与芒果TV双平台播出。</p>\n  <p>该剧由芒果TV出品、AIGC创新内容中心制作、伯璟文化承制，是“广电 21 条”发布后首部采用“边审边播”模式的剧集，也是AI长剧首次上星。</p>\n  <p>受此利好，芒果超媒股价连续两日涨停。</p>\n  <p>为了更好地延续这一热度，在9月17日的芒果共创生态大会上，芒果TV AIGC创新内容中心总经理任旭表示，《后西游记》“战天宫篇”（6—10集）将于今年国庆期间上线播出。</p>\n  <p>围绕《后西游记》，芒果在AIGC上的布局浮出水面，大致可以概括为三部分——制作、厂牌，以及创作平台，覆盖整个AIGC的生产流程。</p>\n  <p>在上述大会上，芒果超媒发布了灵创剧场，定位为芒果AIGC精品内容厂牌，重点规划三条赛道：精品女频中长剧集、国风经典IP，以及少儿动画。</p>\n  <p>宣布与优秀创作者和头部影视公司共同创作精品内容。</p>\n  <p>与此同时，基于芒果大模型的AIGC平台——芒果灵创也再次走到台前，据芒果TV副总裁、首席技术官卢海波的表述，芒果灵创在专业影视创作领域已经达到国际领先水准，《后西游记》的呈现，就是这一能力的验证。接下来将开放芒果的技术产品生态，让更多人参与进来。</p>\n  <p>在题材方向的选择上，任旭如此解释《后西游记》的选择——“现在很多AIGC内容是男性向，但我们平台沉淀了大量女性用户，所以我们会做女性向的内容。”比如打造《女将归来》，聚合花木兰、穆桂英、樊梨花等人物搭建女性英雄宇宙IP，以系列化开发模式构筑市场差异化竞争力。</p>\n  <p>在任旭看来，芒果做AIGC的逻辑起点不是技术，而是内容本身。“我们其实是长在内容里面的平台。”她提出，“要用内容做AI。”</p>\n  <p>以下为36氪与任旭的对话，经编辑：</p>\n  <h3>第一部分：「用内容来做AI」</h3>\n  <p><strong>36氪：芒果是什么开始布局AIGC相关业务的？</strong></p>\n  <p>我们公司从2018年就开始在人工智能算法领域进行布局，研发多模态AI模型，可以说，在国内长视频平台中，我们布局和研发垂类模型起步非常早。我们通过“马栏山杯”国际音视频算法大赛招募人才，把算法领域的一线技术人才招募进来。2024年我们搭了“芒果大模型”，2025年在这个模型基础上搭建了“芒果灵创AIGC创作平台”。</p>\n  <p>2024年的时候，我们有一个先遣团队叫“棱镜工作室”，开始做AIGC相关的内容。今年年初，我们成立了AIGC一级中��。可以看到我们是一步一步在技术基础上，结合内容一起做的。</p>\n  <p><strong>36氪：芒果做 AIGC和其他平台最核心的差异在哪里？</strong></p>\n  <p>如果说别的平台是用AI去做内容，那我们应该是“用内容来做AI”。我们的差异化在于：我们其实是长在内容里面的平台。湖南广电本来就是做内容创意的，我们有内容、有需要进化的场景，平台自然会沉淀和成长。</p>\n  <p><strong>36氪：目前在内容层面具体聚焦哪些方向？</strong></p>\n  <p>在内容赛道规划上，我们将锚定三大差异化方向，覆盖少儿动画、经典&nbsp;IP 创新、女性向精品中长剧，兼顾长剧、中剧、系列化内容开发。</p>\n  <p>一方面，深耕AI少儿动画赛道，推出自主IP《咕噜比事务所》、共创项目《猪猪侠之失控纪元》、打造自有AI音乐儿歌厂牌《芒果妙喵儿歌》等，完善少儿AIGC产品矩阵，沉淀动画全链路生产经验。</p>\n  <p>另一方面，会锁定国风经典IP价值，打造系列化东方美学内容矩阵。以《后西游记》为起点，平台持续推进《搜神》《辛追的一生》等国风项目开发；打造《女将归来》，聚合花木兰、穆桂英、樊梨花等人物搭建女性英雄宇宙IP。</p>\n  <p>同时，聚焦女性用户偏好，我们将在甜宠、情感、悬疑、古言等高热度赛道上系统化打磨《十里芳菲》《翡色》等重点项目。其中，《风起玲珑骨》《成凤》作为我们布局拟真人长剧赛道的首部战略级作品，直接对标S级真人长剧制作标准，将在视效、叙事节奏与人物逻辑上全面采用拟真级生成技术。</p>\n  <p>另外，未来我们会更多跟PUGC模式打通，和市场上涌现的超创（优秀独立创作者）合作，开放芒果的IP，请他们来赋能和合作。</p>\n  <p><strong>36氪：“二创AI化”是什么意思？</strong></p>\n  <p>任旭：比如我们已经上线的《忙忙碌碌寻宝藏》衍生短剧《白昼逆行》。我们在上线之前，就已经和节目组融合创作，通过AIGC前置做一个衍生的互动漫剧。播出的时候，漫剧的互动内容和综艺节目直接打通，里面有线索可以在两个内容之间循环。</p>\n  <p><strong>36氪：这是漫剧，还是仿真人剧？</strong></p>\n  <p>这个是漫剧。但其他项目我们有做仿真人的。比如我们可能会对之前一些电视剧做仿真人的衍生内容。可能主线剧情已经完整了，那就考虑副线，比如丰富男二女二的故事，做衍生的剧集或者角色向的内容。</p>\n  <h3>第二部分：商业化难题如何解决</h3>\n  <p><strong>36氪：你们怎么跑通商业模式？你们做这个事情前期是不是也要贴钱？</strong></p>\n  <p>我们其实不叫“贴钱”。人家是有AI技术以后要做内容，我们首先是有内容，技术是用来做内容升级和融合的。我们打的是“内容+技术”双前锋的战略定位，土壤就不太一样。</p>\n  <p>商业化当然要做。一方面，这些内容做出来之后，对会员付费、衍生付费都有价值。我们希望通过内容升级和互动化，给会员更好的体验，这在会员端会有落地。另一方面，分账本身就有收入。广告端也有合作——广告客户也在寻求新的创意和更低的成本，目前汽车、药品行业已经开始进场尝鲜。</p>\n  <p>更重要的是，我们希望通过这些内容合作，推动生产机制和生产结构的变革，让大家都用上AI，内容创新，成本下降，这才是“内容+技术”融合往前走的目标。同时，我们也希望最终把芒果灵创推向市场，实现它的商业化。</p>\n  <p><strong>36氪： 所以芒果灵创未来可能会对外开放，给外部的创作者用？</strong></p>\n  <p>芒果灵创是一个聚合性平台，里面有我们自研的模型，同时也有外部的、你能想到的最新的模型。因为芒果一直深耕影视行业，所以很多一线模型的新版本我们接入得更快、更早，对影视行业的垂类用户来说应该比较受用。2025年做了这个平台之后，就是全市场开放的。</p>\n  <p><strong>36氪：你们的大模型相比其他有什么不同之处？</strong></p>\n  <p>首先，模型的训练底座很重要。芒果本身就是内容，我们所有的技术产品是“内容长出来的AI”。技术从2018年开始布局，但内容是沉淀了20多年的综艺、剧集、脚本等等。我们有自有的、版权的，数十PB的内容，还有自己导演的创意和方法。这些都是我们的壁垒，不会对外开源。</p>\n  <p>其次，我们在底座模型上做了很多优化。比如图像融合方面，一个古代服装上的图案，用通用模型容易出现光影质感差、图案变形。我们经过精细化调优，出来的效果就好很多，特别适合古装、仙侠、玄幻这些题材。</p>\n  <p>另外，我们开发了很多定制化的工具箱。比如画布功能，你画一条线、一个箭头，或者调一下“3D摄像机”的角度，就能生成特定视角的画面。大量这种看似小但是对影视创作者来说很趁手功能，都集成在我们平台上。</p>\n  <p><strong>36氪：芒果灵创哪些AI功能使用频率比较高？</strong></p>\n  <p>我们考虑的是更精细化的、精品化的影视创作，所以希望把最好的模型第一时间给到用户。我们和模型方定期开定制交流会，把需求直接反馈给他们，他们也会请开发人员过来做定制培训。</p>\n  <p>自研平台方面，画布、3D摄像机、融图功能都是创作同事反馈使用率和好评度都相当高的功能。另外我们是一个集成化的影视创作平台，需要团队协作，而不是一个人生完图又跑到另一个平台生视频。你把剧本丢进来，AI帮你梳理分镜脚本，导演勾选，分配给组员生产镜头，整个过程是顺的、丝滑的。团队协作功能在整个业界我们走得比较靠前，而且迭代频率很高。</p>\n  <p>《后西游记》进一步把上述单点工具组合成项目级生产流：算力、模型与云端管线共同支撑人设、分镜、镜头生产和成片后期，平台能力的考题也由“能否生成一个好镜头”转向“能否让近百人围绕同一审美和进度稳定协作”。</p>\n  <h3>第三部分：对长视频平台来说，AIGC反而是新机会</h3>\n  <p><strong>36氪：你刚才提到AIGC对内容生产的提效，有没有具体的例子？比如制作效率或成本上？</strong></p>\n  <p>可以做个对比。传统三维动画成本很高。做一个5分钟的动画，传统需要10到15人甚至几十人的团队打磨，花50到60万才能搞出来。用AIGC方式，人员成本降下来了。原来培养一个三维动画师要学几年，现在有AI，只要有动画思维、导演思维，靠工程化就能做优化。现在一个超级team，以周为单位产出一集。成本甚至降到几千元一分钟，跟原来比起来太可观了。</p>\n  <p>以前做长动画，买一个IP做10分钟一集、26集，从策划到上线要一年半。找好一点的公司做，大概8万到9万一分钟，总投入1000多万。投产要一年半以后才知道能不能赚钱。</p>\n  <p>现在做Cluebie的长动画，4月份开始策划，暑假上线，两三个月完成。成本几千元一分钟，是原来的十分之一甚至更低。效率提升5到10倍都不止。原来做动画片的公司可能20个人，现在只要5个人。影视剧也一样，从做IP到呈现剧集，原来最快一年半，现在只要三到四个月。</p>\n  <p><strong>36氪：你们和大侦探、歌手这些头部S级节目合作，筛选第一批合作IP的标准是什么？磨合上有没有困难？</strong></p>\n  <p>我们优选头部的、能和AIGC更好结合的节目。比如《大侦探》就比《妻子的浪漫旅行》更合适。节目组自己也知道哪些IP能更好地跟技术结合、焕新。影视剧方面，我们首选古装、仙侠、玄幻、科幻，不会首选现实主义题材。</p>\n  <p>磨合上，刚开始肯定有困难。大家传统工作模式习惯了，边界需要摸索。我们选择小切口，不做大的主线介入，先从衍生做起。比如“嫌疑人自述”，先不做正片，做衍生。做了之后双方共同建立标准化流程：从剧本阶段讨论，做双审机制，一张图怎么表达才不冲突主线。目前与《忙忙碌碌寻宝藏》节目联动的衍生短剧《白昼夜行》在芒果TV站内也已经上线，通过独特画风与故事获得一众好评。</p>\n  <p><strong>36氪：你们内部会有AI焦虑吗？很多媒体公司、大厂都在推全员AI。</strong></p>\n  <p>我们真的不会。我们每天都挺兴奋，因为我们明确感觉到创意才是核心，AI只是“器”。技术是给我们赋能的。我们的节目、剧集最看重创意本身，现在又能降成本、提效率，大家很欢迎。</p>\n  <p>集团同事一直希望我们开第三期班，大家都想学，想知道怎么用到自己的工作中。可能我们和北京一些地方不太一样——我们每天都和AI交流，下班了还要玩一个小时。是那种“人+AI”被激活和点燃的感觉。</p>\n  <p>在培训营里，所有人热情都很高涨，不是说要你每个月必须出几条片子、必须用AI，反倒是自发的。</p>\n  <p><strong>36氪：AI对你们做节目剪辑也有很大赋能吧？</strong></p>\n  <p>对。从2018年开始，我们内部已经嵌入了很多AI能力，比如智能擦除、智能剪辑、AI配音、“多语言翻译”等等。这些用户看不到，但已经帮我们节约了几千万的成本。原来要采购这个技术那个技术，要多少人去做，现在技术在里面要么提效要么降本。</p>\n  <p><strong>36氪：这两年长剧受短剧冲击很大，各家财报都能看出来。现在AI工具成熟后，大家又开始从短剧往长剧跑，你们也说要去做AI长剧。这个演化过程为什么会发生？</strong></p>\n  <p>从内容角度，我们往长剧探索不是简单的从短变长，而是追求品质升级。好的故事需要更长的叙事篇幅来承载情感和场景，这是内容本身的需求。很多电影、拟真人剧讲故事的方式需要时间长的搭建。</p>\n  <p>从技术角度，一开始AI不成熟，做不了长内容。后来模型进步了，很多OPC和小的组织发现不需要大投资、大班底就能制作，但他们也是从小的片段开始尝试。优秀的创作者被传统影视公司挖走，就是希望给他们更大的赋能。所以初期看到更多的是AI短剧，但现在技术嫁接到精品内容上，长剧甚至AI电影就会出现。这是一个自然的过程。</p>\n  <p><strong>36氪：红果接下来也要发力AI长剧，甚至做漫剧上院线。他们做短剧时已经冲击了长剧，再做长剧会不会对长剧平台造成更大冲击？</strong></p>\n  <p>不会吧。用户本身不完全重叠。他们给市场提供了更多内容，让大家看得更多。平台定位和基因不一样，做出的内容也不一样。对长视频平台来说，AIGC反而是新机会——成本颠覆、生产关系重构、内容形态革新，这是推动长视频变革的重要一步。</p>", "category": "tech", "published_at": "2026-09-22T00:30:00+00:00", "fetched_at": "2026-09-22T03:01:09.252697+00:00", "fingerprint": "edc07a96a101d75f"}, {"source": "36氪 - 最新文章", "title": "港科大团队推冷原子系统标准化方案，获量旋科技等两轮数千万融资丨36氪首发", "url": "https://36kr.com/p/3993888512801792?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_bada1adfba17418ca93e83bbfe970b54@6221844_oswg731065oswg1267oswg844_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2400</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，深圳市冰辰量子技术有限公司（下称“冰辰量子”）已于近期连续完成两轮数千万元级天使系列融资。天使轮由元禾璞华、产业投资方量旋科技联合领投，天使+轮由中赢创投领投，金雨茂物、祥峰投资、辰峰资本、源来资本跟投，产业方璇相科技跟投，翊荣资本担任长期财务顾问。融资资金将主要用于场地建设、人才引进及核心产品迭代。</p>\n  <p>冰辰量子2026年3月成立于深圳，是一家专注于中性原子量子计算上游核心装备的科技公司。公司以冷原子系统为切入点，致力于将传统“手搓”式的实验室装置转化为标准化、可量产的高性能产品，解决中性原子量子计算产业化过程中的工程化难题。</p>\n  <p>公司创始人兼首席科学家陈鹏毕业于中国科学院上海光学精密机械研究所，师从我国冷原子领域先驱王育竹院士，现任香港科技大学（广州）助理教授，曾先后在香港科技大学、中国科学技术大学从事科研工作。</p>\n  <p>中性原子量子计算在过去几年间经历了快速发展。2023年Atom Computing率先突破1000量子比特门槛，2024年加州理工学院团队实现了超过6100个量子比特的阵列，单比特操控精度达99.98%。</p>\n  <p>谷歌、微软、英伟达等科技巨头纷纷布局这一路线，海外QuEra、Pasqal、Atom Computing等企业持续输出技术里程碑，国内中性原子整机创业团队也快速涌现。</p>\n  <p>然而，产业链上游的标准化供给能力仍滞后于下游需求的膨胀。冰辰量子试图解决的就是中性原子上游的标准化问题。</p>\n  <p>陈鹏早在10年前便在中国科学技术大学（上海研究院）牵头开发了国际上首款小型化锶原子里德堡冷原子系统，为后续产品化奠定了基础。但当时这套系统只能适配单一元素，仍停留在学术原型阶段，尚未形成可量产的产品。</p>\n  <p>随后，团队在香港科技大学（清水湾）建设更高温区的磁性原子——铒原子超冷量子简并系统的过程中，遭遇了蓝光激光器性能不足、超高真空系统和高温原子炉失败、激光冷却俘获铒原子数量少、冷原子装载时间长等多重关键技术挑战，被逼到绝境后，陈鹏构思出了一种全新的“双光束塞曼减速”方案，为实现铒原子量子简并奠定了关键基础。这个方案后来成为团队核心技术之一，被继承到了现在的产品原型机中。</p>\n  <p>2024至2025年，陈鹏团队在香港科技大学（广州）的新实验室中开展相关研究工作。经过攻关，陈鹏团队成功demo了第二代通用化产品，实现了“同一套系统兼容两种不同元素”的关键突破，并刷新了冷原子装载效率纪录。</p>\n  <p>目前，公司首款产品——高通量冷原子源系统已具备交付能力。该系统采用全球首创的“双光束塞曼减速器+二维磁光阱”混合增强架构，可将冷原子装载效率提升两个数量级以上，同时支持碱金属、碱土金属等多元素跨族兼容，体积仅为传统方案的三分之一至四分之一，大幅提升了冷原子系统的集成度与工程化水平。</p>\n  <p>据公司CEO陈子霆透露，产品原型机已获得多个科研与头部中性原子整机厂商的订单，成熟条件下交付周期最快可压缩至一个月。</p>\n  <p>“我们的思路和竞争对手不太一样，”陈子霆表示，“友商接到客户需求后从零开始定制设计，本质上偏外包服务。但我们做的是标准化产品，底层技术可以复用，摊薄迭代成本，长期竞争力更强。客户想要的只是一个即插即用的设备，不应该去操心方案怎么搭。”</p>\n  <p>在业务延伸方面，公司在同步研发第三代冷原子源，目标是将系统装载率较第二代再提升一个量级以上，并优化对稀有元素的适配能力。</p>\n  <p>同时，公司还规划了在量子模拟、精密测量等领域的产品线。此外，公司透露，冷原子源与半导体领域的分子束外延技术同源，未来不排除向半导体设备领域拓展。</p>\n  <p><strong>以下为硬氪与冰辰量子CEO陈子霆的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：冰辰的核心技术和传统方案差异在哪？壁垒是什么？</strong></p>\n  <p><strong>陈子霆：</strong>传统方案分两种。一种是单光束塞曼减速器，纯手搓，缠线圈，换一个元素就得重新设计，性能比我们差好几倍，而且没法规模化量产。另一种是二维磁光阱，适配度很窄，只能适配部分元素。</p>\n  <p>冰辰的方案是完全原创的双光束塞曼加二维磁光阱混合架构，原子装载率在提升一到两个量级的同时，体积还缩小70%，且真空度提升了一到两个量级，维护周期可以拉长到四五年。这个技术不是凭空来的，从创始人陈老师10年前的第一代小型化系统，到我们在香港做亚洲首个铒量子简并实验时积累的关键双光束技术，再到2024年第二代通用产品，铺垫了超过10年。</p>\n  <p><strong>硬氪：中性原子量子计算市场还在早期，相关市场需求会不会太小？</strong></p>\n  <p><strong>陈子霆：</strong>我觉得不能静态看市场规模。首先中性原子量子计算过去两三年是指数级发展，已经能到万比特规模，接下来要到十万、百万比特。</p>\n  <p>冷原子源相当于水龙头，物理比特就是从原子流里“抓鱼”，水流不够宽就抓不到足够多的鱼。所以越往后期，对我们的需求越刚性。其次，中性原子的应用不止于量子计算，精密测量、量子模拟、矿产勘探，甚至军工领域都有需求。与此同时，海外已有对标产品在出货，用户普遍反馈海外产品易用性低、性能无法达到标准，我们的产品性能更优，具备出海潜力。</p>\n  <p>我们不赌量子计算哪天爆发，即使只看科研和精密测量这些确定性场景，生意本身也是成立的。</p>\n  <p><strong>硬氪：你们会做整机吗？怎么看和下游客户的关系？</strong></p>\n  <p><strong>陈子霆：</strong>短期明确不做整机。第一，我们和整机公司聊过，如果对方知道你做整机，合作肯定有顾虑。第二，我们现在体量小，拉长战线不符合商业规律。第三，我们团队特质是务实，不想被资本或热潮绑架，初心是把上游这一件事做好。我们更希望做上游标准件，拿激光器做例子，五年前大家还手搓激光器，现在都买现成的，近期国内头部激光器企业也成功IPO，冷原子源也会是这个趋势。我们专注工程化，把产品打磨透，让客户把精力放在下游应用研发上，这才是产业链该有的分工。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>元禾璞华表示：</strong>量子科技是面向未来的核心硬科技赛道，目前虽然处于行业早期阶段，但兼具科学价值与长期产业红利。我们看好冰辰量子团队兼具科研深度与工程化能力，能够把前沿理论转化为可落地的产品。相信陈老师和团队依托香港科技大学量子中心，能够继续汇聚研发人才，为量子科研和整机提供关键支持。元禾璞华依托在半导体、光子领域长期积累的产业资源，将在供应链、行业客户对接等维度全方位赋能冰辰量子，助力企业突破关键技术，推进国产量子装备商业化进程。</p>\n  <p><strong>量旋科技表示：</strong>当前，量子科技正加速从实验室研究走向工程验证与产业化落地阶段。科研基础设施与核心装备的自主可控，正在成为支撑整个量子产业大厦的关键地基。</p>\n  <p>在这一进程中，量旋科技看好冰辰量子以及以陈鹏团队为代表的核心研发团队。团队不仅在中性原子量子科技等前沿方向具备扎实科研积累，更展现出量子行业中稀缺的工程化落地能力，能够持续将前沿理论研究成果转化为可部署、可迭代、可规模化应用的真实产品。</p>\n  <p>随着量子科技产业进入快速发展期，面向科研机构与整机厂商提供关键支撑的核心装备，将成为产业生态中具备长期确定性的基础环节。</p>\n  <p>未来，量旋科技将继续依托自身在产业生态、供应链资源、技术验证及客户场景等方面的优势，全方位赋能冰辰量子，共同推动国产量子核心装备的商业化进程，助力量子产业基础设施走向自主可控、成熟可靠的新阶段。</p>\n  <p><strong>中赢创投表示：</strong>冰辰量子卡位中性原子量子计算最上游的冷原子源环节，是支撑比特规模跃升的核心装备，从原理层面突破传统方案瓶颈，推出标准化、高通量、多元素兼容的商用冷原子源，打开量子计算、量子模拟、量子精密测量三大应用场景。中赢创投本轮领投，看好团队具备稀缺的原创技术与工程化复合能力，精准填补产业链空白，成为万亿量子产业不可或缺的源头。</p>\n  <p><strong>金雨茂物表示：</strong>冰辰量子定位为中性原子量子计算机上游关键冷原子源系统提供商，基于陈鹏教授团队在中性原子领域20年的深厚技术积淀和强大的工程落地能力，成功推出了高通量、小型化的冷原子源系统，凭借创新的架构，标准化的产品设计，能大幅缩短中性原子计算机的搭建周期，原子装载率提升两个数量级。我们看好中性原子作为实现通用量子计算机最有机会的一条技术路径，冷原子源系统、光镊系统作为中性原子计算机最核心的子系统，高度标准化、超高可靠性的冷原子源系统是中性原子计算机的基石。相信冰辰量子在陈鹏教授务实、创新的理念带领下，完全有机会成为中性原子领域最关键、最具备拓展前景的铲子提供商。</p>\n  <p><strong>祥峰投资表示：</strong>祥峰投资长期看好中性原子量子计算的潜力，而冷原子源作为产业链上游的核心器件，长期缺乏高性能、标准化的系统级产品。冰辰量子团队兼具学术功底与工程化能力，凭借二十余年的冷原子积累，以全球首创的方案，在装载率、小型化和多元素支持上实现数量级领先，真正解决了行业“手搓”的痛点。我们相信冰辰量子有望成为中性原子生态中不可替代的上游基石企业，很荣幸能陪伴公司共同成长。</p>\n  <p><strong>辰峰资本表示：</strong>我们坚定看好冰辰量子，核心逻辑在于——中性原子量子计算正处于从实验室走向产业化的爆发拐点，而冰辰精准卡位了这条赛道最稀缺的上游环节。当前冷原子源系统仍以实验室\"手搓\"为主，国外禁运且无标准化产品，而冰辰可提供通用型、高性能、标准化的冷原子源系统。团队独创的双光束赛曼减速器+2D MOT混合架构，原子装载效率提升超100倍，体积仅为同类设备的1/3，且光学窗口可实现零沉积、两年以上免维护，远超传统系统需数月清洁一次的局限；同时是全球唯一实现跨族多元素兼容的系统。更难能可贵的是，团队具备从学术源头创新到工程化产品落地的完整闭环能力，叠加量旋科技等产业龙头的战略协同。在量子计算这场大国博弈的军备竞赛中，投资上游核心装备是最具确定性的路径，冰辰正是我们在这个方向上找到的最优解。</p>\n  <p><strong>源来资本表示：</strong>源来资本长期投资前沿科技的底层核心技术。中性原子量子计算正迈向规模化，量子比特数的持续增加对冷原子系统提出更高要求。冰辰团队在中性原子核心部件设计、系统构建和量产均具备深厚学术经验和产业资源，期待冰辰持续突破中性原子量子计算的基础能力。</p>", "category": "tech", "published_at": "2026-09-22T01:13:56+00:00", "fetched_at": "2026-09-22T03:01:09.252693+00:00", "fingerprint": "8e736398d872ef0a"}, {"source": "36氪 - 最新文章", "title": "营收数亿后，这家硬件公司又用世界模型做了个AI高尔夫训练助手｜Insight全球", "url": "https://36kr.com/p/3992495927393026?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄楠</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p><strong>编者按：</strong>当出海越来越成为一家中国公司核心战略时，如何征战全球市场就成为一个极其专业的话题。在全球化的演变中，已有不少中国品牌站立潮头。鉴于此，硬氪特推出「Insight全球」专栏，从品牌成长与变迁，探索中国品牌出海的前沿方向与时代契机，为出海玩家与行业提供思考与启发。</p>\n   <p>这是我们专栏第65期——从家庭智能硬件起步，成立7年的积加科技已构筑起AI原生硬件全栈能力，年营收数亿，拥有数百万终端用户。最近，他们进入AI运动硬件领域，推出首款由世界模型驱动的高尔夫发球监测仪G10 Pro，从单视角反演三维人体动作，让设备从“看球”转向“看懂人”。自Kickstarter上线后，累计众筹金额超200万元。</p>\n  </blockquote>\n  <p>积加科技CEO蒲立，是AI硬件赛道一个不太按常理出牌的人。</p>\n  <p>这是一家已经成立7年的公司，但很少为外界知晓。它们的产品包括家庭智能摄像头、可视门铃、自然观测硬件产品，年营收数亿，在全球超150个国家和地区拥有数百万终端用户。</p>\n  <p>这在硬件赛道是一个很不错的数据。积加也低调完成了多轮融资，投资方包括线性资本、经纬中国、元璟资本、达晨财智、金沙江创投、华创资本等机构。</p>\n  <p>但积加并非一家简单的硬件公司。和很多同行不同，它的总部在AI算法人才聚集的北京。</p>\n  <p>国内大多数硬件厂商仍保持着传统的售卖逻辑，先敲定硬件形态，打磨产品参数，AI只是后期叠加的辅助功能，用来丰富卖点、提升溢价。</p>\n  <p>但蒲立跳出了这套惯性打法。对他而言，AI不是锦上添花的插件，而是贯穿产品全程的核心内核。尤其在大模型汹涌而来后，硬件本身只是载体，在这个新时代做硬件，需要全然不同的思路。蒲立反复思考，如果AI才是核心，硬件结构怎么设计？需要采集什么数据？以什么形态存在？和用户建立什么样的关系？</p>\n  <p>2024年，蒲立和团队把目光投向了一个看起来跨度极大的新方向：AI运动硬件。他们选定的第一个切入场景，是公认难度最高的运动项目之一——高尔夫。</p>\n  <p>9月17日，积加科技旗下运动科技品牌NeoPace发布首款高尔夫发球监测仪产品G10 Pro。这是全球第一款由世界模型驱动的发球监测仪（Launch Monitor），自上线Kickstarter以来，累计众筹金额超200万元。G10 Pro采用众筹即发货的模式，将在众筹结束后即时发货，首批量产产品将在2026年内送达用户。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_e17a19754075434b8fb834939583ec8b@6022551_oswg993535oswg1080oswg687_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">积加首款高尔夫发球监测仪产品G10 Pro（图源/企业）</p>\n  <p>这也是这个时代非常典型的硬件产品：硬件本身只是入口，真正的门槛是背后的算法和AI能力。靠某种巧思穿透大市场的创业神话，已经越来越稀少。</p>\n  <p>在资本共识越来越分明时，它们只会流向少数同时具备供应链积累和AI算法能力的公司。</p>\n  <h2><strong>世界模型，让AI“看懂”人</strong></h2>\n  <p>其实，高尔夫训练助手早已是个成熟市场。</p>\n  <p>但过去高尔夫训练硬件产品只在一种思路上优化，也就是不断提高球体飞行数据的捕捉精度，包括球速、起飞角度、旋转数值、落点轨迹，各项指标被反复打磨至极致。</p>\n  <p>这套迭代逻辑很好地服务了职业球员的需求，他们需要精准的数据来调校装备、优化挥杆细节。但对多数基础爱好者和进阶球手而言，只盯着“结果”的硬件体系，却缺失了训练反馈最关键的一环。数据能告诉他们球飞向了哪里，但无法解释为什么。看不到原因，下一次挥杆也无从调整。</p>\n  <p>“这也是大部分兴趣类进阶用户���共性痛点。单纯的工具设备，往往撑不起用户提升能力的诉求。”蒲立告诉硬氪。</p>\n  <p>相比于关注“球”的动态，积加选择从另一个维度切入：将“人”的动作纳入智能分析范畴。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_314b34fb13e34f46bf8c17991e0292dc@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">人体姿态3D重建（图源/企业）</p>\n  <p>人的动作是球体运动的唯一物理输入端。高尔夫挥杆过程中，人体206块骨骼、约360个关节和600多块肌肉同时发动，在不到两秒内完成高度同步的时序协调，但凡任何环节出现毫厘级偏差，都会在杆头触球瞬间被放大为球路上清晰可见的偏移或失误。</p>\n  <p>为了看懂人体的动力逻辑，积加首款高尔夫发球监测仪产品G10 Pro没有沿用传统监测框架，而是把底座搭在团队自研的TrainerIQ Human-Centric世界模型上。</p>\n  <p>这个模型以人体运动生物力学为核心建模对象，目标不止停留在视觉层面的动作捕捉，而是从单视角信号中，反演三维人体运动序列与发力过程，实现对动作机制的可解释解析，让设备从“看懂画面”进阶到“看懂人的动作”。</p>\n  <p>这项能力有很高的技术门槛。由于高尔夫用户绝大多数时候是在练习场、室内打位或户外草地上独自练球，无法架设多机位设备。设备只能从一个角度拍摄，画面信息有限，挥杆过程中最关键的转胯、重心转移、手腕释放等细节，很容易被遮挡或遗漏。一旦关键动作缺失，分析就会失准。</p>\n  <p>积加从数据端补上这个短板。团队搭建了专属的高尔夫运动数据体系，并积累了数十万组高精度运动样本。在数据采集阶段，用多视角把动作完整记录下来；训练阶段只给模型提供一个视角，让它从单一画面中还原动作，其余视角则用来验证还原的准确性。</p>\n  <p>这样做的目的，是让模型先吃透标准的人体挥杆力学规律，再适配普通用户的单视角画面做推演，用全域数据弥补单一视角的信息不足。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_0c206f622a994592a36e2dc80a8a9604@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">全域数据弥补单一视角信息不足（图源/企业）</p>\n  <p>举个例子，当用户在练习场打完一杆，G10 Pro根据正面画面里肩膀、手臂、髋部的位移和节奏，结合已学到的生物力学规律，世界模型可以推演出这一杆在三维空间里的完整动作序列，并判断头有没有前后移动、腰和手谁先启动、发力顺序是否合理等。最后，再将这些信息转化成用户能听懂的训练反馈。</p>\n  <p>这套世界模型的能力，最终落到产品体验上，才是G10 Pro与传统设备拉开差距的地方。</p>\n  <p>传统方案大多停留在“记录”层面，完成基础画面的捕捉，无法解读动作与运动结果背后的因果关系。TrainerIQ世界模型的不同在于，它试图理解运动背后的物理规律与因果逻辑，并在此基础上推演尚未发生的优化场景。</p>\n  <p>它不仅能复盘用户这一杆的挥杆细节和击球结果，还能基于用户原本的动作，模拟体态调整、发力优化、节奏修正之后，挥杆轨迹会变成什么样，击球效果又会发生什么变化。因此，用户看到的不再只是“这一杆打得好不好”，而是“如果改掉这个动作，下一杆可能会怎样”。</p>\n  <p>可以看到，这套模型本质上就是把训练逻辑模型化、常态化。它不是给所有人一套标准答案，而是结合每个人的身体条件和动作习惯，给出更适合其自身的改进方向。</p>\n  <p>“每个人的挥杆没有标准答案，其训练成长路径同样不该被统一范式束缚。” 蒲立说。借助TrainerIQ世界模型，用户独有的发力习惯、差异化的技术短板、循序渐进的训练节奏，都能转化为可解读的时序数据、可对比的运动轨迹，成为下一次挥杆可落地的调整依据。</p>\n  <h2><strong>搭建分层式系统复用平台</strong></h2>\n  <p>G10 Pro从立项之初就没有走“大而全”的产品路线。积加把高尔夫硬件作为运动版块的首发产品，也有市场层面的权衡。</p>\n  <p>在海外成熟的高尔夫监测设备市场，用户普遍认可专业训练硬件的价值，不需要从头培育市场认知。</p>\n  <p>但这也是一群极度聪明的用户，他们不会为噱头买单。所以积加没有把力气花在把参数做得更漂亮，而是把自己放在“辅助训练”的位置，它不会一次性把所有动作问题都抛给用户，而是先判断当前最该改的是哪一个，让反馈更聚焦、更可执行。</p>\n  <p>“当今天AI能看懂一段挥杆动作，拆解出发力链条、定位到动作短板、给出可执行的优化方案，这种信息密度和指导意义就完全不同了。它不再是泛泛的内容生成，而是针对具体的人、具体的动作，给出具体的判断。”蒲立告诉硬氪。</p>\n  <p>在积加团队看来，硬件是一次性入口，订阅服务才是品牌与用户长期关系的开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_da51ce4bd43d4a5c80c1bb1ec7172ae0@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI高尔夫训练助手（图源/企业）</p>\n  <p>产品布局上，积加也没有追求一款机型打穿所有人群。主力机型先锚定核心进阶用户，再沿同一赛道向上、向下延伸，逐步覆盖更宽的用户分层，形成有梯度的产品矩阵。</p>\n  <p>但高尔夫只是这套逻辑的第一个落点。当硬件入口、订阅服务和分层产品矩阵在高尔夫上跑通之后，积加真正关注的，是支撑其运转的底层能力。</p>\n  <p>这也正是积加平台化路径的起点。从场景中捕捉具体需求，把解决需求的能力拆解成可复用的分层能力，再用这套分层平台去覆盖更多运动品类。</p>\n  <p>“真正的平台化不是技术的迁移复用，而是底层核心技术标准化、垂直场景能力模块化、商业运营体系通用化的分层式架构——用可沉淀的通用能力，对冲多赛道拓展的试错成本，而非彻底消除研发投入。”蒲立说道。</p>\n  <p>在这套分层体系中包括了三大跨品类直接迁移的核心能力。</p>\n  <p>最底层是通用人体感知技术。依托TrainerIQ世界模型，团队沉淀了标准化的人体骨骼解算、发力时序推演、单视角三维重建、动作因果归因能力。这套对人体动态和生物力学逻辑的理解，不绑定高尔夫单一运动，而是所有人体运动分析的通用技术底座。</p>\n  <p>往上一层是AI原生硬件工程能力。视觉与雷达融合的感知框架、低算力设备的算法补偿方案、户外复杂工况的成像与测温适配、轻量化自动对位工程体系，都已经完成标准化打磨，可快速适配不同运动的硬件采集需求，无需每款产品从零重构硬件架构。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_e47d9e5f9d494961921d686ae5b2711f@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">传感系统（图源/企业）</p>\n  <p>再往上是兴趣类消费硬件的商业化资产。从过去家庭场景、自然观察硬件沉淀下来的海外渠道、圈层用户运营体系、AI增值服务订阅模式、长效用户留存体系，已经形成成熟的C端硬件商业化闭环，能够快速复用在运动赛道，降低新品市场落地成本。</p>\n  <p>目前，积加科技其他的运动品类产品已进入规划阶段，预计明年上半年逐步落地。</p>\n  <p>过去数十年，大众运动训练慢慢走入了工业化、标准化的循环。专业训练硬件不断刷新数据精度，通用的挥杆范式、模板化的纠错思路成为行业主流，成套的标准化训练方案以低门槛流向每一位爱好者。训练效率被大幅拉高，运动原本的个体属性被不断稀释。</p>\n  <p>随着AI人体理解的可迁移能力逐步落地，专业级的动作解析、因果归因与个性化指导能力下放至消费硬件，普通用户拥有专属的智能训练助手，第一次具备了规模化落地的可行性。</p>\n  <p>这也是AI原生硬件优化的方向。不是更聪明的工具，而是让每一个具体的人，被设备真正看懂。也只有这样的公司能穿越周期。</p>", "category": "tech", "published_at": "2026-09-22T02:00:00+00:00", "fetched_at": "2026-09-22T03:01:09.252689+00:00", "fingerprint": "b6e3606ebd11e143"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨高瓴投过的飞控与显示系统供应商再获超五千万元融资，半年内连融三轮", "url": "https://36kr.com/p/3993975293836292?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2500字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，高安全等级飞控与显示系统供应商深圳市庆为航空科技有限公司（简称“庆为航空”）近日完成超5000万元新一轮融资，由中信建投资本、光谷科创投、江西金控资本联合投资。</p>\n  <p>这是公司继高瓴创投、松禾资本、梅花创投之后，在半年内完成的第三轮融资。资金将主要用于加速高安全等级（DAL A）电传飞控计算平台和智能座舱显示系统的研发与适航进程。</p>\n  <p>在2026年低空经济投融资持续升温的背景下，资本正从整机制造向核心机载系统延伸。据不同口径统计，今年国内低空领域投融资事件超过160起，总规模近300亿元。然而，国内真正具备DAL A级（民航最高安全等级）机载核心航电系统研制与适航能力的企业，仍是极少数。</p>\n  <p>庆为航空成立于2023年，总部位于深圳南山，2024年底在西安设立研发中心，2026年在成都设立机载适航电子科技有限公司，主要研制可适航的高安全等级电传飞控计算平台、智能座舱显示系统和综合模块化开放平台，即民用飞行器的“大脑和神经系统”。</p>\n  <p>飞控计算机和显示系统直接决定飞行器的安全可靠控制与指示。对于以多座级载客为目标的低空飞行器（eVTOL）而言，必须满足高安全性与高可靠性标准，同时兼顾低成本、可扩展和可复用的商业需求。</p>\n  <p><strong>庆为航空是国内少数可独立完成电传飞控计算平台和座舱显示系统两个DAL A级产品研制与适航的企业。</strong>创始人郭庆深耕航空工程领域二十一年，曾先后从事7型飞机研制；公司核心团队来自国内外航空企业，曾参与国内多型重要民用飞行器的研发工作，拥有丰富的民机产品研制实践经验。</p>\n  <p><strong>产品层面，公司布局了3*2异构非相似飞控计算平台、智能座舱显示系统两个产品线，分别对应飞行器的“大脑”和“神经中枢系统”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_46b99d5528fe42f3a5d304396d3c6643@5920579_oswg222095oswg1025oswg690_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DAL A级 3*2异构非相似飞控计算平台（图源/企业）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_1d99fdda1414473bb9bfe04c065c60ab@5920579_oswg35049oswg189oswg284_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DAL A级综合显示系统（图源/企业）</p>\n  <p><strong>值得注意的是，公司飞控和显示两型产品通过底层平台复用可实现两型产品的协同开发。</strong>郭庆向硬氪介绍，两型产品底层技术复用率可达70%，覆盖电源、计算模块、I/O、驱动、实时操作系统、软件中间件和集成开发环境等底层要素。“平台复用不仅可以节省大量研发时间、人力和资金成本，也能帮助主机厂降低飞行器TC取证的研发费用和研制周期，加快整机取证。”</p>\n  <p>在低空经济从“能飞”迈向“取证载客”的关键阶段，主机厂对飞控和座舱显示系统的需求正从“能用”转向“能设计、可取证、保量产、可持续适航”的全生命周期管理。庆为航空已于2025年12月完成设计保证系统（DAS）建立，当前正在构建设计机构许可（DOA）与生产机构许可（POA）双支柱能力。</p>\n  <p>研发体系上，公司产品全生命周期开发遵循ARP-4754B、ARP-4761A、DO-160G等系统与安全性标准；软件符合DO-178C、硬件符合DO-254，均按DAL A/B级要求研制；工具鉴定按DO-330的TQL-1/TQL-2执行；并采用DO-331基于模型的开发方法。</p>\n  <p>目前，公司飞控产品之一的CTSOA独立取证项目已获民航局成都机载设备审定分中心受理，正在开展设计批准审查，取证完成后，该产品将作为标准货架机载设备，面向系统级供应商和主机厂销售，并可按程序批准装机。随机取证方面，公司规划承接适量主机客户，长期与主机客户携手完成飞行器的TC取证和后续规模化交付。</p>\n  <p>公司产品目前可覆盖通航、低空、公务机及干支线客机等场景，并已有头部主机客户订单、研制合同及产品交付。</p>\n  <p><strong>以下为创始人问答：</strong></p>\n  <p><strong>硬氪：3×2异构非相似飞控计算平台的设计具体解决了什么痛点？</strong></p>\n  <p><strong>郭庆：</strong>民用航空对飞控系统的安全性要求极高，失效概率需要低于10⁻⁹/飞行小时。因此，飞控系统不仅要解决单个硬件发生随机故障的问题，还要避免因设计缺陷等共因故障导致整个系统失效。</p>\n  <p>3×2异构非相似架构，就是针对这两类风险设计的。系统由3台飞控计算机组成，每台计算机内部又设置两个独立的计算通道，分别负责命令和监控。在此基础上，两个通道在硬件和软件层面都采用异构非相似设计。例如，在硬件设计的非相似，使用不同厂商或不同架构的芯片；在软件设计的非相似则可以采用不同的开发团队、语言或工具。这样，即使某一类硬件或软件存在系统性缺陷，也可以通过异构、非相似设计解决单点随机故障并降低共模故障风险。</p>\n  <p><strong>硬氪：两型产品的平台复用是庆为航空的一大优势，公司为什么要布局综合模块化开放平台，并推动飞控和显示两型产品的平台复用？</strong></p>\n  <p><strong>郭庆：</strong>核心还是希望通过平台化和模块化设计，提高产品的复用率和开发效率，降低开发成本和适航成本。民用航空的安全标准和适航体系具有全球通用性，因此我们从一开始就希望按照全球标准和可控的全球供应链来开发具备国际竞争力的机载电子产品。</p>\n  <p>最初我们聚焦飞控计算平台，但研发过程中发现，显示系统在底层技术上也可以复用飞控平台大量技术。经过供应链梳理和大量预研工作，我们发现，两型产品的技术技术复用率可以达到70%。</p>\n  <p>因此，我们进一步把这些共用的底层能力抽象出来，形成综合模块化开放平台，在这个平台上开发飞控计算平台和显示计算平台。这样，硬件计算平台可以通用化，软件应用可以独立开发，不同产品之间能够共享底层能力，也可以根据不同飞机和系统需求进行组合。</p>\n  <p>这种开放、模块化的架构也与国际航空电子领域的MOAA（模块化开放航空电子架构Modular and Open Avionics Architectures）、MOSA（模块化开放系统架构Modular and Open Systems Architectures）等架构理念相通，能够通过明确的接口和功能定义实现不同系统和供应商之间的互操作，实现硬件平台通用化、软件应用独立化，同时降低产品研发和全生命周期成本。</p>\n  <p><strong>硬氪：要实现综合模块化开放平台及两型产品的平台复用有哪些难点？</strong></p>\n  <p><strong>郭庆：</strong>最核心的难点，是找齐满足民用航空适航要求的底层软硬件组件，并完成适配、集成、验证和适航认证。这涉及三类关键组件，一是能够同时满足民用航空符合性证据要求、性能和功耗要求，安全领域应用范围广，而且生命周期支持的处理器；二是已经具备完整符合性证据、已在民用航空领域实际应用并取得认证的实时操作系统和文件系统；三是显示系统涉及的图形库、图形驱动和图形开发工具。</p>\n  <p>此外，还要把处理器、实时操作系统、文件系统、图形库、图形驱动和图形开发工具等全部适配到我们的硬件平台上，并完成大量的开发和认证工作。不同厂商的IP和技术体系也需要通过软件中间件或支持层实现解耦和衔接，同时还要保证各方的知识产权边界清晰。两型产品线都需要正向开发，都需要采用复杂系统工程方法才能严谨的完成。</p>", "category": "tech", "published_at": "2026-09-22T02:42:52+00:00", "fetched_at": "2026-09-22T03:01:09.252680+00:00", "fingerprint": "e370fec0660257e9"}, {"source": "少数派", "title": "体验过华为 Pura X View 后，他们最想留下的「阔体验」是……", "url": "https://sspai.com/post/114734", "summary": "不久前，我们发起了「华为PuraXView新品探索计划」，请大家去线下 quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加！</p>\n  <p><strong>让好项目，更早被看见。</strong></p>", "category": "tech", "published_at": "2026-09-20T06:35:44+00:00", "fetched_at": "2026-09-21T03:01:35.755190+00:00", "fingerprint": "a251a77734041b38"}, {"source": "36氪 - 最新文章", "title": "大模型，开始集体变小", "url": "https://36kr.com/p/3991436755057415?f=rss", "summary": "<p>&nbsp;</p>\n  <p>文 | 李炤锋 王欣逸</p>\n  <p>编辑 | 张雨忻</p>\n  <p>&nbsp;</p>\n  <p>在深圳，林舟所在的AI创业公司只有十个人，大部分工作都靠 AI 来完成——每天数百个Agent（智能体）同时运行，它们分头写代码、做研究。</p>\n  <p>而驱动这些Agent的，一直都是OpenAI的GPT系列模型。</p>\n  <p>但随着团队交给Agent的任务越来越多，林舟发现GPT跟不上了——他们当时使用的GPT5.6，一次只能同时处理两三个任务。“GPT能处理的并发任务有限，会耽误我们的工作进度。”林舟说，团队开始寻找能让更多任务同时运行、调用价格也更低的模型。</p>\n  <p>DeepSeek V4.1 Flash成了新选择。9月以来，团队试用了Claude和几款国产模型，最后选中V4.1 Flash：它能完成手头的开发任务，反馈更快，调用费用也更低。林舟说，这是他们眼下“性价比最高”的选择。</p>\n  <p>今年更早的时候，Google CEO Sundar Pichai在 Google I/O大会上说，据他了解，有些公司到了5月，全年Token预算就已经快用完了。就以Google自己为例，其内部AI编程工具每天消耗的Token也从3月的5000亿涨到5 月的超过3万亿。</p>\n  <p>而就是在这次大会上，Google推出了速度更快、成本也更低的Gemini 3.5 Flash，瞄准更日常的开发和工作场景——今年以来，OpenClaw掀起的“龙虾”热潮，让普通用户也开始用Agent处理各种工作事务，这是比编程更日常、更低门槛、更高频的需求。</p>\n  <p>与此同时，越来越多的小参数模型开始出现。因为任务越来越多，模型的调用也会更频繁，若使用几千亿甚至两三万亿参数的旗舰模型，用户要承担的费用会非常高；并且大参数模型的速度也快不起来，会大大增加用户的等待时间。</p>\n  <p><strong>模型厂商，尤其是中国模型厂商，接连推出Flash版本的小参数模型，争的正是这批过去也在由旗舰模型完成日常需求。</strong>Flash，意为“闪电”。模型厂商通常用这样的命名来表示更快、价格更低的模型版本：它每次运行调用的参数较少，适合用来反复处理日常任务；而复杂问题仍可交给Pro等旗舰模型。</p>\n  <p>7月31日，DeepSeek发布V4 Flash正式版；8月26日，阿里Qwen团队的Qwen3.8-Flash-Next与智谱的GLM-5.3-Flash同日亮相；9月，DeepSeek又推出V4.1 Flash。这几款模型参数大小不一，均在千亿级别（从100B-500B的参数区间），远小于当前的旗舰模型万亿级别的参数。</p>\n  <p>两个月前，<strong>当DeepSeek V4 Flash正式发布后，有开发者把它的评测成绩和完成任务的成本画在一张图上，提出所谓“斩杀线”：那些性能不如V4 Flash，做同样的任务却更贵的模型，就这样被“斩杀”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_cfa4fd2c7f0d49c2bb34f7d14fb29b30@6252890_oswg113305oswg1280oswg976_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">灰色区域内的模型被 DeepSeek V4 Flash “斩杀”，来源：Artificial Analysis</p>\n  <p>8月下旬，美国编程Agent平台Cline开始免费提供一款未公布身份的模型。Cline称，不到一周，这款模型承担了平台超过11%的推理量。随后，智谱认领了这款模型，正是后来推出的 GLM-5.3-Flash。此前，智谱创始人唐杰在业绩会上谈到下一代模型，他说，公司“不会做一个大而无用的模型”。</p>\n  <p>事实上，“小模型”阵营还在不断扩大。<strong>智能涌现了解到，月之暗面和腾讯混元，都在推动Flash模型版本的开发。</strong></p>\n  <p>另一方面，今年以来，资本市场已经给中国模型公司押下高额赌注，这一背景下，商业化就成了更现实的问题。</p>\n  <p>公开数据显示，到今年8月，智谱的ARR（年化收入）约为16亿美元，其市销率高达46倍；尚未上市的DeepSeek，估值更是高达其预估年化收入的163倍。而大洋彼岸的 Anthropic，市销率约为 20 倍。中国模型公司在商业化上还有很长一段路要走。</p>\n  <p><strong>所以，中美模型竞争也出现了另一条主线：在继续追求 AGI，争夺模型能力上限的同时，谁能让性价比更高的模型完成更多真实任务、服务更多用户？谁能用高性价比的模型打开更大市场，创造更多营收？</strong></p>\n  <p>&nbsp;</p>\n  <h3>01 一场模型效率革命</h3>\n  <p><strong>切换模型后，林舟的一大体验改善是模型的响应快多了</strong>。</p>\n  <p>团队经常会需要几十个Agent同时写代码，他会边看进展边调整指令；发现方向不对，马上让模型修改。此前用Codex，他常要等模型输出一长段内容，才能插手纠正。“无论你是用CLI格式，还是用它原生的App，响应都要很长时间。”而一旦遇到长项目，模型需要整理此前的对话内容，使用GPT-5.6时，又要再多等上一阵。“但切换到V4.1 Flash后，你跟他说什么，他能立马反馈你。”</p>\n  <p>今年以来，Scaling Law 仍是大模型研发的主线。今年发布的Qwen3.8-Max总参数达2.4T（T表示万亿个参数），Kimi K3达2.8T。按Elon Musk今年4月披露的对比推算，当时的Claude Opus约有5T，尽管Anthropic并未确认这一数字。</p>\n  <p>这些超级模型固然触碰到了更高的智能，但更大的底座需要更多训练和部署资源；Agent场景下反复调用模型时，使用模型的成本也会指数级增加。</p>\n  <p>换用V4.1 Flash后，<strong>林舟另一个明显的感受是调用成本大大下降。</strong>他举了团队做小应用的例子：一名同事独自完成开发，“差不多三四美金，就成了一个小App出来”。</p>\n  <p>模型服务平台Requesty 8月的周榜单显示，<strong>DeepSeek V4 Flash占平台上实际Token用量约三分之一，排在所有模型首位</strong>。而在此前的第三方评测中，<strong>它与美国GPT-5.6 Luna高推理版本的综合得分接近，完成同组任务的成本低约六成。</strong></p>\n  <p>“模型公司也开始更多关注真实的市场需求，会更多去听开发者的声音。”一位基模研究员对智能涌现说。小模型一轮训练所需的时间和资源更少，能更快让用户看到他们用模型跑出来的东西是否可行，是否需要调整。<strong>“用小模型搞开发，可以更快地做版本迭代，更快拿认知。”</strong></p>\n  <p>而在日常工作中，这位研究员自己也会按任务需求来选模型。他举例说，修改实验脚本这类简单但工作量大的任务，交给GPT处理可能要20分钟，使用DeepSeek V4 Flash就只需要2分钟。“既然任务没有那么难，我就只希望模型赶紧把这件事情做完。”</p>\n  <p>正是在这样的用户场景驱动下，<strong>近期各家发布的Flash模型大都在400B以下</strong>（B表示十亿个参数）：DeepSeek V4 Flash总参数284B；GLM-5.3-Flash总参数320B；Qwen3.8-Flash-Next的主模型为125B。</p>\n  <p>“从训练的角度上来，300B和更大一些的模型，在能力上可能差不太多。”这位研究员说，自己做过不同尺寸的训练实验。在他使用的那批数据和训练方案下，<strong>约300B的模型已经能学进更大模型输出的长推理链。</strong></p>\n  <p>2025年发表于《Nature Machine Intelligence》的一项研究分析了51个开源模型，发现要在知识、推理、数学和代码等五项测试中取得相近成绩，所需的参数越来越少。研究者称之为“能力密度”提高：同样大小的模型，能做更多事。</p>\n  <p>Qwen3.8-27B是一个近期例子。在Qwen公布的同组测试中，它在编程测试SWE-bench Pro中得61.7分，上一代同尺寸模型为53.5分；在长程办公测试CoWorkBench中得70.7分，上一代为61.0分。</p>\n  <p>模型要解决的问题也随用户变化。这位研究员举例说，编程产品常回答程序员怎样写代码、管理项目；到了办公场景，问题变成了“我Excel的公式记不住怎么办”“怎么把这个论文写了”。</p>\n  <p>底层工作仍可能是写代码，但实际要完成的工作复杂度可能是降低的。从Code到Work，一场模型的效率和成本革命正在发生。</p>\n  <p>&nbsp;</p>\n  <h3>02 从“编程”到“日常办公”</h3>\n  <p>“我觉得会是两条路。”对当下Agent分化出的“编程”和“办公”两种产品，一位Code Agent创业者这样评价道。编程和办公产品都需要模型理解指令、写代码、调用工具，但面向的用户群体不同。他认为，<strong>面向普通人的办公产品，“一定需要的极致地省钱，极致的性价比。”</strong></p>\n  <p>今年1月，腾讯混元负责人姚顺雨在AGI-Next峰会上谈到用户需求的差别：企业做生产力任务时仍愿意使用能力最强的模型，但普通用户多数时候不需要。</p>\n  <p>两类用户选模型的方式也不同。“程序员会自己分辨哪些任务用更贵的模型，哪些用更便宜的。”普通用户未必知道处理表格、撰写报告需要多强的模型。上述创业者说：“这是办公 Agent的产品经理要想办法去解决的问题。”</p>\n  <p>今年1月，Anthropic推出Claude Cowork，让原本主要辅助写代码的Agent也能处理桌面办公任务。OpenAI随后推出ChatGPT Work，也是让用户直接交代一项工作，而不必在对话框里逐步提问。</p>\n  <p>与此同时，国内产品也从编程走向办公。3月，腾讯云CodeBuddy团队推出WorkBuddy；8月，阿里整合QoderWork、悟空和MuleRun，推出千问办公；而在差不多时间，字节将飞书、TRAE Work等产品的办公能力整合到豆包，推出“豆包工作”。</p>\n  <p>QuestMobile报告显示，2026年7月，腾讯WorkBuddy有658.2万月活跃用户；PC客户端用户当月人均使用19次。</p>\n  <p>面对数百万用户反复交办的日常任务，办公Agent不能只按复杂编程的标准选模型。在一些WorkBuddy用户社区中，有用户这样评价DeepSeek V4 Flash和GLM-5.3-Flash：“有这两个Flash干活基本够用。”而在企业端，一位接近智谱的人士表示，GLM-5.3-Flash发布后，不少企业客户对这款总参数320B的模型表示出浓厚兴趣。</p>\n  <p><strong>而在真实的办公Agent使用场景里，执行任务的模型甚至可以更小，小到百亿级别。</strong></p>\n  <p>聚焦办公Agent的创业公司元空智能，已经在元空AI Work中用上几十B的模型。团队基于开源模型做后训练，让它处理更垂直的任务；通用任务则调用云端的混合模型。</p>\n  <p>用户交办任务，产品替他选模型，这样的模式下，元空团队观察到用户其实对交互的速度十分敏感。一位团队成员说：“<strong>我们现在系统稍微慢一点点，一分钟之内一堆用户马上就找过来了</strong>。”</p>\n  <p>事实上，一些办公任务甚至都不需要用到DeepSeek Flash的最高思考强度。一位元空团队成员说，这样做对他们的部分任务“其实是过剩的，会输出非常非常多Token，产生大量成本浪费”。</p>\n  <p>元空智能在权衡任务效果和Token消耗，千问办公也把任务分成两档：标准模式处理日常办公，高级模式应对更难的问题。8月底，千问办公将Qwen3.8-Flash应用于标准模式。</p>\n  <p>按千问办公公布的测试结果，标准模式完成单项任务的速度提高约一倍，平均Token消耗减少75%；这一模式可以完成其定义的约95%的日常任务，更难的任务则交给高级模式。</p>\n  <p>&nbsp;</p>\n  <h3>03 更大，但也更卷的市场</h3>\n  <p>几个月前，美国创业公司Lindy宣布开始使用一款中国模型——把由平台管理的大部分日产工作Agent调用，从Claude Sonnet、Gemini切换到了DeepSeek V4 Flash。公司披露，切换后这部分调用的模型费用下降约九成。</p>\n  <p>“这是公司成立以来，对成本结构影响最大的一次调整，产品质量没有受到影响。”Lindy的创始人Flo Crivello这样说道。</p>\n  <p>8月下旬，一款名为Ox-Alpha的匿名模型进入海外编程Agent平台OpenCode和模型平台OpenRouter，立刻引起大范围讨论。</p>\n  <p>美国编程Agent公司Cline拿自家代码库中的真实故障进行了测试：Ox-Alpha和另一款模型都修好了问题，但前者消耗的输出Token只有后者约三分之一。</p>\n  <p>这款被中国用户戏称为“牛来”的模型，上线不到一周，仅在OpenCode就有约50万人使用；8月26日，智谱认领了这款模型——GLM-5.3-Flash。“牛来”模型与智谱的旗舰GLM-5.3形成了高低搭配——难题靠旗舰，日常任务则给 Flash 版本。</p>\n  <p>开发者的免费试用只是第一步。显然，<strong>中国模型公司希望借Flash的能力和价格，进入全球Agent产品，</strong>让用户的更多日常任务转向自己的模型。</p>\n  <p>这几乎是一个被 DeepSeek 带起来的市场。全球范围内，DeepSeek在V4 Flash发布后调用量一直居高不下。OpenRouter6月数据显示，DeepSeek占该平台Token用量的份额，从年初的9%升至6月初的18%；增长主要来自Agent任务。到5月底，V4 Flash已占DeepSeek系列Agent任务Token用量的70%。</p>\n  <p>DeepSeek 让其他模型厂商看到，在300B-500B区间的Flash模型，有着巨大市场潜力——这是一个被拓宽出来的新市场。</p>\n  <p>不同类型的模型去打不同定位的市场，模型厂商赚钱的概率也会提升。</p>\n  <p>从市场角度看，旗舰模型和Flash模型正在形成不同的战场。但是在大模型研发团队看来，这似乎又并非是两个对立的策略。</p>\n  <p>一位业内人士表示，旗舰模型仍有继续训练的价值。他把它比作车企的赛车：“它不一定能量产，但会有一些技术下放。”在他看来，旗舰探索出来的能力和训练经验，最终可以进入服务更广泛用户的小模型。</p>\n  <p>比如，智谱上周披露，一个由GLM-5.3驱动的Infra Agent，参与了GLM-5.3-Flash推理服务的搭建与优化，并成功将GLM-5.3-Flash部署到了国产芯片上。从初步适配到投入生产，不到两周；经过优化，同一套服务处理请求的能力提高到最初的约三倍。</p>\n  <p>另一方面，Flash模型也成了下一代模型的试验场。Qwen先在Qwen3.8-Flash-Next上使用计划用于Qwen4的新架构；据团队介绍，这款模型的训练算力消耗约为Qwen3.7-Plus的九分之一。</p>\n  <p>这场竞争不只发生在中国厂商之间，美国模型公司也参与了进来。</p>\n  <p>价格战已经打响。</p>\n  <p>7月，OpenAI将较轻量的GPT-5.6 Luna价格下调80%。在OpenAI公布的客户反馈里，美国办公Agent公司Dust称，换用Luna处理同类任务后，速度提高了40%，费用降低了40%。显然，在全球范围内，模型厂商们都在试图用更小的模型，凭借速度和价格优势争取到的Agent客户。</p>\n  <p>OpenAI 首席财务官Sarah Friar写道：“只要质量够用，低价模型就会被用于更多任务。” 而“模型处理更多任务”给模型公司带来的收入反馈，我们或将在下一个季度见到。</p>\n  <p>*文中林舟为化名</p>", "category": "tech", "published_at": "2026-09-20T08:00:00+00:00", "fetched_at": "2026-09-21T03:01:35.755183+00:00", "fingerprint": "c23d09ddd3f56675"}, {"source": "36氪 - 最新文章", "title": "主题演讲：从3000万到世界一流：长安汽车如何把速度转化为全球信任｜36氪2026 East Forward 出海大会", "url": "https://36kr.com/p/3991497021537285?f=rss", "summary": "<p>2026年，中国企业出海正在从“寻找增量”，走向更长期的全球经营。9月17日，以“潮起之时，靠岸相见”为主题的2026 East Forward第二届·36氪出海大会在上海举行。来自消费、科技、制造等领域的出海企业、投资机构，以及全球化服务商汇聚现场，围绕本地化经营、用户洞察、供应链、合规、渠道与全球组织等现实问题展开讨论。当“走出去”已不再是少数选择，企业需要面对真正的问题：如何在海外市场活下来、扎下去，把一次市场突破变成持续经营，并逐步建立属于自己的全球竞争力。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_1a9eb3cec62d4502bdc019560cea4bbc@6301044_oswg79253oswg720oswg1080_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>Peter Larko | 长安汽车海外品牌公关总监</strong></p>\n  <p><strong>Peter Larko：</strong>下午好。这是午餐后的第一场会议，我很荣幸在这里。我的名字是——Peter Larko，在过去的几年里，我荣幸地担任了长安海外品牌公关总监，与来自100多个市场的同事紧密合作，这些年来，我也见证了这家拥有164年历史的企业不断实现自我革新。</p>\n  <p>我见证了长安在中国汽车品牌中以最快的速度实现累计销量突破3000万辆。我想问你们一个问题：一个品牌需要什么才能从被看见转变为真正被信任？从中国品牌转变为真正的全球品牌？答案，我认为，就在于一个中文的词，“安心”。</p>\n  <p>今天，我想和大家分享长安如何踏上这段旅程：从3000万辆汽车销量走向世界级品牌，从中国速度走向全球信任。同时，我也想分享这一过程中遇到的一些挑战。</p>\n  <p>2025年12月，长安成为了最快达到3000万辆的中国汽车品牌，实现了累计产量里程碑。更值得一提的是，其背后的速度和加速度。第一个千万，花费了三十年，第二个千万，花费了七年，第三个千万，仅用了四年半的时间。</p>\n  <p>这不仅仅是增长，更是能力、信任和志向的体现。截至2025年年底，我们建立了22个海外制造基地，包括我们在泰国的首个海外新能源汽车制造基地，海外总产能达到35万辆。我们进入了21个新市场，把我们的产品带到了118个国家和地区。</p>\n  <p>速度让长安迅速被看见。但坦诚地讲，在多个市场，我们赢得了关注，但可能还没有真正走进用户的心里。所以，仅靠知名度，无法成就世界级品牌，什么才能做到？答案在于承诺：向每一位客户承诺安全、可持续发展，以及持久的信赖。那么，我们如何兑现这一承诺？这始于北斗天枢计划。我们坚信，安全是最大的豪华。相信我，这不只是一个营销口号，它是一种理念，贯穿于我们所做的每一件事。我们已经投资超过600亿人民币，并汇聚了7500多名全球顶尖人才和智能系统。，来打造我们的SDA，即天枢智能，其设计具备网络安全防护功能，能够持续演进，最重要的是，它是安全的，不仅体现在传统碰撞防护的意义上，而且在更广泛的层面上，在过去，汽车安全是指物理保护，比如安全带和安全气囊，还有缓冲区的设置。后来，主动安全技术逐步加入，比如自动刹车、车道保持等功能。当然，这些仍然很重要，但如今，安全涵盖了用户体验的各个维度：驾驶安全、生理安全、心理安全和情感安全。但要实现这种多维安全智能，智能助手必须建立在坚如磐石的基础之上，而这正是我们的SDA发挥作用的地方。中央环网架构，一站式端到端大模型，七重双备份冗余，这三项技术让我们有信心向用户承诺一件事：安心无忧，每一公里都是如此。我们还拥有长安汽车天枢智能实验室，这是全国首个智能汽车安全技术全国重点实验室，专门致力于智能汽车智能安全技术研究。</p>\n  <p>正是在这里，我们把承诺落实为真正的工程能力：共有200个实验室，全天候不间断测试，超过40万次虚拟模拟场景，以及330万公里的测试里程。</p>\n  <p>一个世界级的品牌，也必须对地球负责。这便是香格里拉计划的由来。我首先要提一下我们的“金钟罩电池”，这是一款完全自主研发的电池系统，实现了长寿命、真安全、高效率和快速充电。</p>\n  <p>在动力总成方面，我们开发了蓝鲸超擎动力系统，我们相信这是中国为全球混合动力市场提供的解决方案。这花费了六年时间，汇聚了1000多名工程师，凝聚了1500多项授权专利。它开创了一种混合模式，智能且无缝地平衡燃料与电力。</p>\n  <p>为了进一步建立全球信任，长安汽车董事长朱华荣先生，于2023年4月在上海宣布了“海纳百川”计划。这是我们面向国际化扩张的战略蓝图。初步成果积极向好，2025年，长安海外销量达到63.7万辆，同比增长18.9%，并在15个重点市场中位列中国品牌前两名。</p>\n  <p>因此，今年4月，我们在“海纳百川”计划下公布了更具雄心的目标。这将推动我们从以产品贸易驱动的模式，转向覆盖制造、贸易、投资、服务和ESG的一体化全业务模式，并实现协同发力。为实现这一雄心，我们正在七个核心维度上推进转型：首先，技术。在长安，技术存在的意义在于为人类服务，而非追逐规格参数。蓝鲸超擎动力系统超越了以发动机为先的传统设计理念，转而平衡燃料与电力。SDA试点项目是长安自主研发的端到端智能驾驶系统，旨在提供安全、丝滑、好用的体验，适用于所有驾驶场景。</p>\n  <p>其次，我们的产品正逐渐从全球同步的开发模式，转向全球原生、区域定制模式。这意味着我们的平台实现了全球标准化，产品则实现区域差异化，以确保每个市场都能精准满足客户需求。</p>\n  <p>第三，品牌。我们将以蓝鲸超擎和天枢智能为技术支撑，通过深蓝S05、启源Q05和引力CS55等全球车型进行落地，并以用户能够真正感受到的方式表达品牌价值——让有温度的技术，使每一段旅程更安全、更智能、更绿色。</p>\n  <p>第四，合作关系。在接下来的三年里，我们将深化与全球合作伙伴的关系，超越传统的供应或分销模式。我们正转向共同创造，以及技术、产品、品牌方面的共同发展和相互支持，还有制造方面的产能共享，构建一个开放、稳定、长期的全球生态系统。</p>\n  <p>第五，投资。在未来三年内，我们的投资将重点聚焦于四个领域：产品研发、品牌升级、服务升级以及生态系统建设，将资源投入到对用户最关键的领域。</p>\n  <p>第六，服务方面，我们正在加速构建全球服务网络，并完善备件系统和区域备件中心、服务中心及呼叫中心在每个核心市场，实现全天候响应，快速支持，让支持真正近在咫尺。</p>\n  <p>第七，同样重要的是团队。未来三年，我们的海外员工队伍将大幅扩大，超过70%的人将是本地雇佣的。同时，我们将推动全球供应链总就业人数超过15,000人。我们将在这七个战略维度上持续推进，追求一个非常明确的目标，即将海外销售额提高到150万到180万，到2030年实现这一目标。</p>\n  <p>在座的几乎所有人，都走在同一条路上：把一家为单一市场打造的企业，带到全球多个市场去赢得一席之地。所以，与其继续讲我们取得了哪些成绩，不如说说几件真正困难的事。我这么说是什么意思呢？作为一家中国企业，我们有时会发现，人们往往已经对我们的汽车形成了固有看法，甚至还没亲眼见过我们的汽车，更别说开过我们的车了。老实说，你很难仅靠说服改变别人已有的认知，营销活动的效果也是有限的。</p>\n  <p>真正能打破这些障碍的，是可靠的质量，经过独立第三方验证的测试、强有力的质保支持，以及经久耐用的车辆表现。这就是你赢得信任的方式，在任何市场中，而不是靠头条新闻，也不是靠发布会，而是靠耐心，并且始终践行承诺。</p>\n  <p>第二，将欧洲设计与中国制造相结合，我们创造了全球协同效应，这使我们能够突破障碍。我们在都灵和慕尼黑的设计中心，让我们得以接触那些毕生深耕欧洲汽车和欧洲客户的人才。我们的制造基础，则赋予我们难以匹敌的速度和规模。问题在于，人们很容易把欧洲的贡献当作最后一道工序——在已经定型的决策上做造型修饰。但只有当它介入到概念阶段，早到足以改变一项工程决策，而不是去装饰一项工程决策时，它的价值才会真正显现。</p>\n  <p>第三，不存在所谓的全球客户。北欧的冬季、海湾地区的高温和沙尘、南美洲的路况，以及不同地区的充电基础设施，都不一样。右舵驾驶、车联网能力也必须与本地应用适配，还要符合当地的数据规则，因此我们建立了全球产品验证系统。它覆盖224个国家和地区，进行24小时不间断测试，覆盖各种气候和道路条件。我们进行了3万次测试，涵盖了16个车辆属性，从零部件到系统，再到整车。正如我之前提到的，我们每天都会进行3.3公里的模拟训练。所有这些训练，都是为了让我们能够真正为新市场打造汽车，而不是简单把一辆中国车改装后出口。这辆车是专为那个市场打造的，从零开始打造的。</p>\n  <p>速度可以复制，信任不能。这正是“卖到一个市场”与“真正属于一个市场”之间的区别。</p>\n  <p>这让我回到最开始的地方：安心。安心不是一项可以安装的功能，也不是一句可以自我标榜的承诺。它是客户最终认定你已赢得的东西——而往往，远在你自以为已经赢得它之后。中国汽车行业正处于一个历史转折点。此时此刻，我们正在从规模领先转向质量领先，从国内竞争转向全球竞争，从追随者转变为如今定义未来出行的引领者。但我认为，这个时代的主导叙事不在于速度，而在于信任。</p>\n  <p>而让世界信任我们、让我们真正跻身世界一流的，是我们兑现承诺的能力。它是“北斗天枢”计划带来的安全，“香格里拉”计划带来的可持续，以及 “海纳百川”计划带来的深度本地化。它更是扎根重庆所赋予的诚信底色——这座城市把挑战化为优势，也一直是我们把长安带向世界的家园。</p>\n  <p>我们带着长安走向世界，从重庆走向世界，从3000万迈向世界一流，这就是我们正在进行的征程。非常感谢。</p>", "category": "tech", "published_at": "2026-09-20T08:45:02+00:00", "fetched_at": "2026-09-21T03:01:35.755177+00:00", "fingerprint": "cd455f13197c77f8"}, {"source": "36氪 - 最新文章", "title": "世界杯进入早场谁接住了清晨的餐饮订单？百威早点铺为百威无醇和店家找到了新的生意机会", "url": "https://36kr.com/p/3991595471895300?f=rss", "summary": "<p>2026年美加墨世界杯共有104场赛事，换算成北京时间，半数以上比赛集中在清晨5点‑12点。对于国内上班族来说，观赛时间撞上睡眠、早餐与通勤，过去围绕深夜看球形成的消费模式，也随之发生改变。</p>\n  <p>&nbsp;</p>\n  <p>消费数据已经体现出消费时段的转移。来自京东外卖的监测显示，世界杯期间凌晨4‑5点早餐订单较赛前上涨约60%，5‑6点订单增幅接近50%。虽然只是单一平台数据，不能代表整个行业，但足以说明清晨时段催生出新的消费需求。汉堡、汤粥、水饺这类方便配送、适合边看边吃的品类，增长速度超过传统早点。</p>\n  <p>&nbsp;</p>\n  <p>当下观赛消费分化为三类场景：凌晨场次更适合居家，夜宵与外卖继续受益；清晨赛事和通勤时间重叠，早餐、咖啡、便利店商品更容易被消费者选购；只有少数焦点赛事，才会带动用户线下聚集。能否抓住这波新增订单，关键看门店能否匹配赛事时段营业，而非单纯依靠营销宣传。</p>\n  <p>&nbsp;</p>\n  <p>咖啡与快餐品牌天然具备时间优势。不少咖啡品牌借世界杯，通过球队、球星相关合作吸引球迷，带动饮品销售、门店到店以及会员增长。快餐连锁则侧重门店端运营，上线赛事相关主题产品，部分门店打造观赛主题空间。不同于酒吧需要临时调整早间营业，快餐本身就拥有早餐班次、外带流程与早班人力，赛事更多是给门店带来新的消费理由，不用重构整套经营模式。</p>\n  <p>&nbsp;</p>\n  <p>咖啡、快餐以及便利店的共同优势，是已经具备成熟的晨间运营能力，产品标准化，消费者可以快速完成选购。世界杯只是放大部分产品热度，不需要门店为赛事彻底改动原有营收结构。部分烘焙店、商场也将开门时间提前至6点半，在原有早餐业务基础上叠加赛事氛围，也是同样逻辑。</p>\n  <p>&nbsp;</p>\n  <p>相比之下，酒吧与酒类品牌要适应早场赛事则难度更高。酒吧拥有大屏、适合多人观赛的环境，但清晨营业会带来人力、能耗、备餐成本的上升；工作日早晨，含酒精饮品也很难成为主流选择。不少门店和品牌转向无醇饮品、早餐套餐，或是联动其他餐饮业态探索新方案，把赛事时差带来的挑战转化为新的经营思路。</p>\n  <p>&nbsp;</p>\n  <p>但夜间经营门店的难题，并不只是简单举办晨间观赛活动。不同轮次赛事、不同球队热度带来客流差距悬殊，社区、商圈、写字楼周边门店的晨间需求也各不相同。即便统一物料可以快速落地，门店依旧要逐场权衡人力、食材投入，控制经营成本。</p>\n  <p>&nbsp;</p>\n  <p>体育赛事营销可以拉动短期订单，但餐饮行业本身正处于营销高投入的竞争环境。营销投入走高，不一定直接转化为门店经营效率提升。因此不同业态，需要用务实指标衡量早场赛事带来的收益：咖啡快餐重点关注活动过后会员留存、门店日常销售表现；酒吧需要核算晨间营收能否覆盖新增成本；外卖平台则观察早间订单高峰是否具备可复制性。品牌曝光不等于门店实际盈利。</p>\n  <p>&nbsp;</p>\n  <p>大型赛事能够短暂改写大众消费时间，但“早上看球吃早餐”未必会演化成长期消费习惯。赛事落幕之后，真正留存下来的，依旧是品牌沉淀的供应链、门店网络和用户基础。对商家而言，更大的考验在于，面对消费者时间的临时变动，能不能以较低成本，灵活适配市场变化。</p>", "category": "tech", "published_at": "2026-09-20T10:21:38+00:00", "fetched_at": "2026-09-21T03:01:35.755168+00:00", "fingerprint": "21faac69b2b9f4df"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“电子工业大米”价格飙涨；报告显示农村彩礼均值降至3.86万元；特朗普要给“人工智能”改名", "url": "https://36kr.com/p/3992398887926784?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>谷歌承认其AI模型在安全测试中侵入三家公司系统</li>\n   <li>博主曝西贝已起诉罗永浩，“就要开庭了”</li>\n   <li>公积金新规正式施行</li>\n   <li>许嵩背后公司太合音乐冲刺IPO</li>\n   <li>千叶珠宝多店清仓甩货，金饰低至990元/克</li>\n   <li>“啄木鸟维修换开关收2800元”后续：全额退费，并赔偿2000元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>“电子工业大米”价格最高涨十倍，高容量MLCC现货被炒至原价2至10倍</strong></p>\n  <p>MLCC（多层陶瓷电容器），被业内称为“电子工业大米”。小到手机家电，大到AI服务器、新能源汽车，几乎所有电子设备都离不开。近期元器件市场走出极端分化行情：AI拉动高容量型号缺货疯涨，部分现货暴涨数倍；普通消费级产品冲高回落，一冷一热的背后，是AI算力浪潮的搅动。行情从5月底开始发酵。AI算力需求爆发的消息传导至元器件市场，海外大厂将消费级产能大量转向AI高端产品，市场担忧常规物料供给收紧，渠道商纷纷囤货扫货。进入6月，现货市场进入“一天一价、甚至一小时一价”的火热状态，部分热门型号短短一个月涨幅达7—8倍，现货最高被炒至原价的2—10倍。（财联社）</p>\n  <p><strong>农科院报告：农村农户彩礼均值降至3.86万元</strong></p>\n  <p>9月19日，中国农业科学院农业经济与发展研究所在浙江杭州发布《中国农业农村微观数据观测报告2026》。这一报告依托中国农业科学院农业农村微观数据观测系统，深度挖掘了2012~2023年的连续追踪观测数据。调研横跨全国20个省份、新疆生产建设兵团和1个计划单列市，精准锁定578个行政村与12480户固定观察农户，系统呈现了新时代中国农业农村发展的微观图景。</p>\n  <p>该报告显示，调查中样本农户的彩礼均值从2019年的4.67万降到2023年的3.86万，人情支出占比从17.1%降到11.5%，村均文化组织从2012年的0.97个增长到2023年的1.18个，合唱团、书画协会、志愿服务队等新型组织不断兴起，乡村精神文明建设进入提质增效新阶段。（光明日报）</p>\n  <p><strong>特朗普要给“人工智能”改名</strong></p>\n  <p>据国是直通车，美国总统特朗普在社交媒体上发起了一项改名投票。他指出，很多人认为“人工智能”这一说法并不准确，表述也十分生硬。对于这一新现象，更为雅致且准确的叫法可以是卓越智能（Superior Intelligence）、极致智能（Extreme Intelligence），或是至高智能（Supreme Intelligence）。特朗普呼吁所有人都参与投票，选出最贴合“这场不断发展的‘革命’”的新名称。截至目前，已有超17万人进行了投票，目前得票领先的“新名字”是“卓越智能”（Superior Intelligence，简称“SI”），得票率为40.6%。数小时后，埃隆·马斯克在这个帖下回了一句话。他没有简单的做选择题，而是说：“它将聪明到让我们无法理解。”（财联社）</p>\n  <h2>AI 最前沿</h2>\n  <p><strong>DeepSeek公布节假日计费规则</strong></p>\n  <p>DeepSeek公布最新API峰谷计费规则，调休上班的周末、中国法定节假日全天均按空闲时段计费，此前已将周末全天统一按低谷收费。（IT之家）</p>\n  <p><strong>Anthropic据悉考虑在IPO前发布新AI模型</strong></p>\n  <p>Anthropic正考虑推出一款新的人工智能（AI）模型，以应对OpenAI自发布GPT-6 Astra以来所形成的势头。根据企业支出管理平台Ramp的最新数据，GPT-6 Astra约占该平台追踪的企业AI支出的13%，Anthropic旗下Claude Fable则约占8%。这引起了一些原本有意投资Anthropic的投资者的担忧。他们表示，正重新评估Anthropic作为企业级AI工具领先提供商的地位。在上市时间表方面，据最新报道，Anthropic可能将IPO推迟至美国11月中期选举结束之后。（财联社）</p>\n  <p><strong>谷歌承认其AI模型在安全测试中侵入三家公司系统</strong></p>\n  <p>美国谷歌公司18日承认，其人工智能（AI）模型“双子座”今年5月在网络安全能力测试中，侵入了三家真实公司的系统。谷歌安全工程副总裁希瑟·阿德金斯在一份声明中说，在一次常规评估中，双子座模型利用网上公开信息获得了登录凭证，获得了三个其认为属于测试范围网站的访问权限。谷歌已确保三个相关实体获知此事，并与测试合作方调整测试流程。（新华社）</p>\n  <p><strong>智谱MaaS平台上线数据内容不留存机制</strong></p>\n  <p>36氪获悉，9月20日晚间，智谱MaaS平台官方宣布，近期将上线数据内容不留存功能，为企业和开发者用户提供更严格的数据隐私保护。智谱表示，这个功能并不意味着任何情形下都不留存数据。Batch API、File API等需要在平台侧持久化保存任务或文件的功能不在上述覆盖范围内，以及法律法规要求留存、为核查涉嫌违规或滥用行为的情况，平台可能按有关要求留存相关数据30天及以上。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>9月LPR报价出炉：1年期和5年期以上利率均保持不变</strong></p>\n  <p>36氪获悉，央行公告，9月1年期贷款市场报价利率（LPR）为3.0%，5年期以上LPR为3.5%，1年期和5年期以上LPR保持不变。</p>\n  <p><strong>长鑫科技宣布第五代技术平台正式量产</strong></p>\n  <p>36氪获悉，9月20日，长鑫存储在世界制造业大会上正式宣布第五代DRAM技术平台实现量产。本次大会同步展出两款基于G5平台打造的LPDDR5X量产产品，单颗容量均为24Gb，较上一代同类型产品提升50%，分别采用496Ball、245Ball封装规格，可适配中高端智能手机、便携式消费电子等不同场景需求，目前均已进入规模量产阶段。</p>\n  <p><strong>机票价格创三年来同期最低</strong></p>\n  <p>今年中秋和国庆假期之间仅隔三个工作日，部分游客通过“请3休13”拼出超长假期，带动8天以上深度环线游报名持续走高。假期预计呈现“前短后长”的双波峰出游格局：中秋3天以省内周边短途家庭游为主，国庆7天集中释放国内长线游需求，赏秋、海滨度假、亲子游热度居前。随着假期战线拉长，国庆机票价格迎来近三年同期低点。去哪儿旅行数据显示，9月27日至10月1日期间，机票均价创近三年同期最低。（21世纪经济报道）</p>\n  <p><strong>博主曝西贝已起诉罗永浩，“就要开庭了”</strong></p>\n  <p>在爆料西贝将在两三个月内彻底倒闭后，博主“理记”再发文称西贝已起诉罗永浩。9月20日，微博大V“理记”发文表示：“知道为啥他上个月突然跳出来吗？因为西贝起诉了罗永浩，就要开庭了，他跑出来操控舆论给法院施压。这次突然碰瓷野人先生也是一石二鸟，一方面跟钟薛高复出有关，另一方面是想篡改历史制造出‘我只是消费者吐槽’的舆论风向。”此前一日，“西贝被曝将彻底倒闭”的话题登上微博热搜。西贝回应界面新闻称，“目前全国门店均正常运营，我们也会继续用心做好产品与服务，继续坚守品质，用心接待每一位顾客。也恳请大家理性看待网络信息。”（界面新闻）</p>\n  <p><strong>公积金新规正式施行</strong></p>\n  <p>2026年9月20日起，新修订的《住房公积金管理条例》正式施行。这是该条例继2002年、2019年之后的又一次系统性重大调整。新条例将原来6种提取情形修改为9种，装修自住住房、支付物业费都能用公积金，灵活就业人员也可自愿缴存住房公积金。今后，职工支付房租提取公积金，不再设置房租超过家庭工资收入规定比例的门槛。同时新增住房消费提取场景：装修自住住房、支付自住住房物业费可提取住房公积金；另外，国务院批准的其他住房消费情形也纳入提取范围。（21世纪经济报道）</p>\n  <p><strong>黄仁勋夫妇捐赠43.8万股英伟达股票</strong></p>\n  <p>当地时间9月18日，美国证券交易委员会（SEC）披露的文件显示，9月17日，英伟达CEO黄仁勋与妻子的信托无偿赠出合计43.8万股公司股票，其中29.2万股赠予黄仁勋夫妇基金会，14.6万股赠予一家捐赠人建议基金。9月18日，英伟达股价收涨1.34%，报222.27美元，市值为5.4万亿美元。按此计算，捐赠股票价值约9735万美元（约合人民币6.52亿元）。（第一财经）</p>\n  <p><strong>中泰证券一名员工私下代客操盘，7年亏掉9200万元</strong></p>\n  <p>9月18日，湖南证监局披露行政处罚决定书，中泰证券从业人员杨文明因私下接受客户委托买卖证券，被给予警告并罚款50万元。2017年至2024年间，杨文明接受谭某委托，通过下达交易指令操作张某的普通及信用证券账户，两账户合计交易25.3亿元，合计账面亏损9206.22万元。不过，杨文明接受委托期间未产生违法所得。最终，湖南证监局决定对杨文明给予警告，并处以50万元罚款。（澎湃新闻）</p>\n  <p><strong>罗永浩称点6份外卖3份是臭的，拒绝透露踩坑餐厅店名</strong></p>\n  <p>9月20日晚，罗永浩发微博称：“出差和团队一起在深圳赶一个项目，夜里加班点外卖，点到一家在福田区就有两家分店的港式茶餐厅（大众点评两千多条评论分别打了4.6和4.3；2026年必点榜上榜餐厅），结果送过来六份外卖，竟然三份都有异味臭味。这家茶餐厅的名字是……嗯，好吧，都不容易。”评论区有网友询问店名，罗永浩回复：想都不要想！（每日经济新闻）</p>\n  <p><strong>千叶珠宝多店清仓甩货，金饰低至990元/克</strong></p>\n  <p>北京商报报道，千叶珠宝多家线下门店开始清仓甩货，其中距离千叶珠宝总部最近的芳圆里店金饰克价低至990元。店员表示，将千叶珠宝的存货清空后，门店将换牌经营，售卖其他品牌黄金珠宝。但也有其他千叶珠宝门店并未受到影响，继续正常开店运营，有消费者到店一次选购30多件。实地走访过程中，记者发现，多家千叶珠宝线下门店仍在正常经营。据多家媒体报道，千叶珠宝实际控制人林明杰（董事长、总裁、董事会秘书）及其妻子高晓松（董事、副总裁）自2026年9月起失联，原因不明。（财联社）</p>\n  <p><strong>司美格鲁肽成“变质回流药”重灾区</strong></p>\n  <p>近期，广州医保部门依托药品追溯码大数据预警，联合公安打掉一个非法收售“回流药”的犯罪团伙。“回流药”指通过医保报销开出、被药贩子低价回收后非法转售的药品。执法人员发现，本应冷链保存的药品被存放在30多摄氏度、闷热潮湿的仓库内，嫌疑人发货时用泡沫箱、铝箔纸等伪装冷链保存，掩盖药品脱离冷链甚至可能变质的事实。该系列案件中，涉案金额最大的药品为司美格鲁肽。目前，警方已查获多处仓储窝点，扣押8000余盒涉案药品。（财联社）</p>\n  <p><strong>西贝成立新公司</strong></p>\n  <p>天眼查App显示，近日，武汉西贝明友餐饮管理有限公司成立，法定代表人为李明友，注册资本40万人民币，经营范围含餐饮管理、组织文化艺术交流活动、新鲜水果零售、日用百货销售、会议及展览服务等。股东信息显示，该公司由西贝餐饮集团有限公司全资持股。9月20日，据九派新闻报道，武汉西贝明友餐饮管理有限公司注册地为光谷世界城广场一家经营多年的西贝门店，门前正在装修升级，将于近期重新对外营业。（21世纪经济报道）</p>\n  <p><strong>国家能源局：8月份全社会用电量再破万亿，负荷创历史新高</strong></p>\n  <p>36氪获悉，据国家能源局消息，2026年8月，全社会用电量再破万亿，达到10332亿千瓦时，同比增长1.7%；用电负荷创历史新高达到15.6亿千瓦，较上年最大负荷高4969万千瓦，共有7天超过上年最大负荷。</p>\n  <p><strong>上海市卫健委回应“延长育儿假”建议</strong></p>\n  <p>针对人大代表提出的完善育儿假、强化月经假落实的建议，上海市卫健委作出答复。上海现行规定为符合条件夫妻，子女满三周岁前，双方每年各享有5天育儿假，休假期间工资照发。卫健委表示，将联合多部门研究延长育儿假、优化成本分担的可行性，适时提出修法建议。</p>\n  <p>关于月经假，上海现有法规仅对部分重体力、特殊岗位女职工经期给予调岗或1天公假。卫健委将配合人社部门调研，简化月经假申请流程。（澎湃新闻）</p>\n  <p><strong>永辉步步高回应减少胖东来商品</strong></p>\n  <p>近日，有消费者告诉蓝鲸记者，永辉、步步高等“胖改”超市中，胖东来品牌的商品变少了。有浙江的消费者表示：“附近一家永辉超市内胖东来啤酒没有了”，一名四川的消费者则提到：“之前一直购买的胖东来洗面巾没有了”。来自湖南的消费者同样讲到：“附近步步高超市内胖东来商品好像变少了。”</p>\n  <p>永辉超市客服对此回应称，不同门店内，胖东来的个别商品可能出现暂时缺货的情况，到货后会第一时间补货上架。蓝鲸记者分别询问了永辉、步步高超市。永辉表示，此前引进的胖东来商品一般不会受影响，所有商品的常规货架一直都有的，但是专区、流水台这些额外位置，会视情况进行调整。步步高方面则表示，商品种类会根据当地消费者需求进行定期调节，胖东来商品并未出现大规模变动。（蓝鲸新闻）</p>\n  <p><strong>“啄木鸟维修换开关收2800元”后续：全额退费，并赔偿2000元</strong></p>\n  <p>近日，“啄木鸟维修换1个开关收费2800元”事件引发关注。9月18日，据荔枝新闻报道，杨女士称，媒体报道次日，平台的处理态度发生明显转变，不仅全额退还2800元维修费，还额外赔偿2000元。维修报价单显示，电路漏电检测费为每小时168元、10小时计费共1680元，另收间歇性跳闸修复费439元、设备使用费585元、63安漏电保护器配件费96元。</p>\n  <p>近年来，啄木鸟维修曾连续两年被央视“3·15”晚会点名，2024年因维修收费过高被曝光，2025年又因无病乱修、小病大修、乱收费等问题再次被点名。（界面新闻）</p>\n  <p><strong>瑞银：全球AI领域资本支出2027年升至1.4万亿美元，九成增量来自内存涨价</strong></p>\n  <p>瑞银目前预计，2026年人工智能资本开支将接近1万亿美元，2027年进一步攀升至约1.4万亿美元，而这一增长背后的最主要原因是内存成本大幅上涨。瑞银估算，内存相关开支将从2025年的710亿美元飙升至今年的3670亿美元，2027年达到9230亿美元。其余AI相关成本预计在2026年为6310亿美元，2027年回落至5250亿美元。这意味着，今年内存成本上涨贡献了约60%的AI资本开支增量；而到2027年，随着其他零部件支出下滑，内存成本增幅甚至将超过AI资本开支的全部净增量。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>许嵩背后公司太合音乐冲刺IPO</strong></p>\n  <p>许嵩背后公司太合音乐正冲刺港股IPO，2026年6月已提交招股书。招股书显示，太合音乐于2014年正式成立，由海蝶音乐、麦田音乐、大石版权三大华语老牌厂牌整合而成，业务源头可追溯至1987年创立的海蝶音乐。2023年至2025年，公司收入分别为8.6亿元、14.19亿元以及13亿元；毛利分别为3.27亿元、3.88亿元以及3.96亿元；年内利润分别为3385.2万元、5567.2万元以及1.2亿元。从毛利率来看，公司的整体毛利率分别为38%、27.4%以及30.5%。太合音乐连续两年向单一艺人的采购金额超过3亿元，且占比均超三成。多家媒体推测此艺人即为许嵩。（21世纪经济报道）</p>\n  <p><strong>9月21日可申购宇特光电</strong></p>\n  <p>宇特光电此次发行股份总数为1767万股，网上发行股份数量为1237万股。网上申购股份数量上限为61.83万股。宇特光电的申购代码是920157，发行价为13.75元/股，发行市盈率为14.99倍，参考行业市盈率为73.59倍。</p>\n  <p>宇特光电公司是一家专注于光连接产品研发设计、精密制造与销售业务的国家级专精特新“小巨人”企业，致力于为光通信领域设备商、系统集成商、国内外电信运营商、光电子器件企业提供高性能的光连接整体解决方案。2023年至2025年，宇特光电的营业收入分别为2.12亿元、2.53亿元、3.33亿元；归母净利润分别为4186.71万元、4644.71万元、6916.95万元。（财联社）</p>\n  <p><strong>9月24日可申购粤芯半导体</strong></p>\n  <p>粤芯半导体此次发行股份总数为5.13亿股，网上发行股份数量为5126万股。网上申购股份数量上限为12.80万股，顶格申购需配深市市值128万元。粤芯半导体的申购代码是301660，发行价与发行市盈率均尚未披露，参考行业市盈率为73.18倍。</p>\n  <p>粤芯半导体是广东省首家实现量产的12英寸晶圆制造企业，是全球少数专注于模拟芯片领域的特色工艺晶圆代工企业之一。公司总部位于广州，被称为“广州第一芯”。2026年上半年，公司营业收入为17.77亿元，同比增长68.76%，归母净利润为-10.52亿元，同比增长12.41%。公司尚未盈利且存在累计未弥补亏损，预计最早将于2029年合并口径实现扭亏为盈。（财联社）</p>\n  <p><strong>德明利：向特定对象发行股票申请获深交所审核通过</strong></p>\n  <p>36氪获悉，德明利公告，9月18日收到深交所告知函，公司申请向特定对象发行股票获得深交所上市审核中心审核通过。</p>\n  <p>偷偷融资</p>\n  <p><strong>“硅基流动”完成B+轮二期和C轮融资</strong></p>\n  <p>36氪获悉，硅基流动宣布，近日，硅基流动完成B+轮二期和C轮融资。至此，公司2026年度累计股权融资额近29亿元。参与B+轮二期及C轮融资的投资方包括中国互联网投资基金、国新基金、中国移动链长基金、中国东方资产国际、京能基金、上海仪电智算基金、建投华科、北创投、翠微基金、成都科创投、江西金控、成都高新倍特基金、中泰资本、华安嘉业、华胜天成、紫光资本、智路资本、拓尔思、鹏鹞环保、兆讯科技、睿智基金、执君资本和瞰道悟新基金，以及天创资本携山东铁投产投、山东铁路基金战略参与。老股东耀途资本、盛奕资本和国泰创投集团追加投资。</p>\n  <p><strong>“御水飞行”完成千万级天使轮增资</strong></p>\n  <p>36氪获悉，智能水翼艇公司“御水飞行”完成千万级天使轮增资，本轮由一点科创投资控股（香港）有限公司与COCOON INVESTMENTS TWO LIMITED投资，松禾资本继续加注。公司成立于2025年，曾获得李泽湘旗下XBOTPARK基金千万元级投资。其核心产品为电动水翼艇，通过水翼将船体抬离水面，首款产品已获订单并开始交付。</p>\n  <p><strong>“Moonback”完成数千万元首轮融资</strong></p>\n  <p>36氪获悉，宠物智能科技品牌“Moonback”近日完成数千万元首轮融资，投资机构为AI上市公司。本轮融资将主要用于AI算法、研发和市场团队建设。</p>\n  <h2>酷产品</h2>\n  <p><strong>19999元起，上纬新材旗下启元机器人开售</strong></p>\n  <p>2026年9月20日举行的启元机器人新品发布会上获悉，启元机器人现已开售，10月1日起按订单顺序陆续发货。上纬新材CEO田华在会上透露，启元Q1与启元T1售价均为19999元，启元Q1探索版为26999元，启元T1 Pro售价为29999元。此外，启元机器人即将推出基于Harness架构的机器人Agent以及家务基座大模型PrimeMind。</p>\n  <p><strong>最复杂、速度最快的分子计算机诞生，可实现100比特、连续25次不同运算</strong></p>\n  <p>据最新一期《自然》杂志报道，爱尔兰梅努斯大学的研究人员研制出一种新型DNA分子计算机，可利用DNA分子相互作用完成加法、乘法和除法等数学运算。这是目前已报道的最复杂、速度最快的分子计算机，已实现100比特计算，并可连续完成多达25次不同运算。这项研究有望为低能耗计算和长期数据存储提供新的技术路径。（科技日报）</p>\n  <p><strong>整理丨</strong>李琪</p>", "category": "tech", "published_at": "2026-09-20T23:58:19+00:00", "fetched_at": "2026-09-21T03:01:35.755152+00:00", "fingerprint": "ce1a0db30250f5a5"}, {"source": "少数派", "title": "给电话加上「辅助驾驶」？我们想听听你的意见", "url": "https://sspai.com/post/114717", "summary": "会议开到一半，手机亮了：一个陌生号码。你盯着屏幕犹豫了几秒，不知道这会是推销、客户，还是外卖员。直接挂掉，又得惦记着会不会耽误正事；接起来，不方便说，聊完还得整理待办。轮到你主动打电话，也不轻松。邀约 ...<a href=\"https://sspai.com/post/114717\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-20T03:01:47+00:00", "fetched_at": "2026-09-21T03:01:34.523737+00:00", "fingerprint": "c2a5dfbc653474bd"}, {"source": "少数派", "title": "觉来知打明钟未，忽听邻家叫佛声：佛国老挝行记", "url": "https://sspai.com/post/114495", "summary": "这是一趟水陆空三栖的旅行——在万象的街头巷尾无意间推门而入点了一份炸五花肉套饭，味道香上了头发根；在万荣连跳两天水，最高的 8 米跳台跳下来砸得屁股很疼，各种户外活动性价比拉满；琅勃拉邦的慢生活，从清晨薄雾中的布施开始到日落时分反射着金光的湄公河结束。<a href=\"https://sspai.com/post/114495\" target=\"_blank\">查看全文</a
