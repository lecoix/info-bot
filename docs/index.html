/hsossms/20261029/v2_559562a5a8e847419ffde66259a4ace8@19153231_oswg547077oswg900oswg480_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>在具身智能行业仍热衷于用高难度动作展示技术进步时，智元创新日上呈现了另外一种思路。&nbsp;</p>\n  <p>在这场发布会上，没有太多眼花缭乱的机器人特技，也没有太多夺眼球的集体舞蹈，反而更像是一场信息密度极高的技术研讨会。甚至，在世���中心的入口，智元还设置了一大面“论文墙”，呈现智元团队近期的核心技术进展。</p>\n  <p>过去三年，机器人学会了跑、跳、后空翻，但走出实验室才发现，单一技术突破撑不起复杂环境中的稳定工作。当GPT-6 Astra等大模型展现出物理任务规划能力后，“真实部署”已从口号，变成行业必须回答的问题。</p>\n  <p><strong>智元的回答是一套组合拳：</strong></p>\n  <p>GO-3 Preview具身基座大模型、AGILE通用运动智能算法框架、WITA-OMNI原生多模态交互大模型分别攻坚作业、运动、交互三大难关；灵渠OS 1.0与AHA3第三代硬件架构从软硬件两端拉通统一端口；Worken（有效智能工时）则试图为物理AI的实际劳动产出建立度量衡。</p>\n  <p>也就是说，智元几乎把整条技术链摊开，逐个击破模型、数据、硬件、软件的各个卡点。</p>\n  <p>智元的种种动作，共同指向了同一个方向——<strong>机器人行业下一阶段竞争的胜负手，不再是谁更会打拳，而是谁能把过去三年的成绩落地部署到实际场景里，将其转变成源源不断的生产力。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_c338f9e69ff2416c97cd81f00f3e6efb@19153231_oswg4264403oswg2516oswg1368_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>智元联合创始人、总裁兼CTO彭志辉在发布会上给出的数字，恰好为这个判断提供了注脚：2026年上半年，智元机器人营收接近20亿元，智元通用AI机器人累计下线达20000台。</p>\n  <p>在会后接受访谈时，他坦言，<strong>“万台下线，只是制造业的胜利，万台上岗，才是物理AI的胜利”。</strong></p>\n  <h2><strong>具身部署不再拼单点技术</strong></h2>\n  <p>过去几年，机器人行业出现了一种常见的竞争方式：不断刷新某项能力的上限，比如比跑得更快、跳得更高，谁能完成更复杂的抓取动作。而当机器人真正部署进工作场景后，这套旧有的评价逻辑明显不够用。</p>\n  <p>不妨想象一个工厂里一项极其普通的任务：“走到货架前取一件物品，再将它送到指定位置。”</p>\n  <p>听起来轻松，若由机器人执行，这项简单任务可以被解构为几个挑战——机器人要判断物品在哪、怎样抓取；搬运过程中需实时应对突发情况，有人突然经过要及时避让；工作人员临时改变任务，还需要听懂新要求。</p>\n  <p>也就是说，一个小小的任务，分别涉及作业能力、交互能力、运动能力，任意一项都不可或缺。</p>\n  <p><strong>智元此次推出的多项核心成果——譬如GO-3 Preview、WITA-OMNI、AGILE，正是基于现实落地的基础痛点展开。</strong></p>\n  <p>GO-3 Preview最核心的意义正是，让机器人如何更好地理解自己即将执行的动作。</p>\n  <p>近年来VLA成为具身智能重要技术方向，让机器人像大模型理解文字一样理解环境和指令并生成动作。</p>\n  <p>但传统VLA存在一个卡点：机器人纵使知道下一步该做什么，却不一定清楚这个动作的后果，比如想拿起桌上杯子时，可能把旁边东西打落。</p>\n  <p>GO-3 Preview的核心突破是“先预测，后动作”的一体化决策机制。也就是说，机器人拿到任务后，会先综合多路摄像头画面和指令，搞清楚“要做什么、环境如何”；接着在内部推演几种可能的情况；最后从中选一个最靠谱的方案行动。相当于行动之前先三思，而不是边做边想。</p>\n  <p>除了持续探索具身智能大脑模型之外，智元此次还盯上了一个被巨头基模公司集体忽略、却不可或缺的重要方向——全模态端到端交互大模型。<strong>“交互，正是机器人产生价值的必经入口、第一入口，所有的场景都离不开交互”，</strong>智元合伙人、联席总裁、中央研发部总裁、交互业务体系总裁熊彦如此表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_140104dbb0994848896c2876253d61be@19153231_oswg233691oswg1907oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>以前人类与机器人交互的模式基本是，要先喊它名字“唤醒”它，然后一问一答、干等回复。而WITA-OMNI大模型把人机交互的底层逻辑完全改了。</p>\n  <p>在发布会现场，熊彦与搭载该模型的机器人远征A3的趣味互动——不需要唤醒词，在噪音复杂的现场，机器人还能准确判断你是不是在跟它说话，且快速打断切换问题也不会影响交互。</p>\n  <p>经现场测试，WITA-OMNI模型的响应速度最快只有400毫秒，支持20多种情感表达，能听懂73种语言。在WITA-OMNI模型的加持下，机器人终于从一台被动听指令的机器，变成了一个能聊天的小伙伴。</p>\n  <p>值得注意的是，这两项模型近期均交出了硬核成绩单。</p>\n  <p>据介绍，GO-3 Preview登顶RoboDojo、RoboTwin、RoboColiseum三大行业权威评测榜单，并将于2026年底全面开源；WITA-OMNI则拿下Daily-Omni全模态理解、TimeLens-Bench视频时序定位、EmbSpatialBench具身空间推理、MMAU复杂音频理解四项榜单第一名。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_bead18090b79475884e6190379060ed6@19153231_oswg195352oswg4096oswg877_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_37316d8b393949109612a6d84fc9c792@19153231_oswg631746oswg7168oswg1536_img_jpeg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>有了“先想后做”“擅长聊天”的大脑之后，机器人还需要一副跟得上的身体。</p>\n  <p>此次智元发布的AGILE正是一项全新的通用运动智能算法框架。可以这么理解：机器人可以像人一样，眼睛看到变化，身体立刻就能做出合适的反应，一气呵成。</p>\n  <p><strong>从GO-3 Preview到WITA-OMNI再到AGILE，智元同时推进作业智能、交互智能、运动智能三条线——让机器人既知道该做什么，又能稳稳做出来，还能自然跟人配合。</strong></p>\n  <p>不过，会想、会动、会聊三种能力齐备，还不意味着机器人就能顺畅运转。它们必须在同一条时间轴、同一个状态空间里实时衔接。否则，就可能出现这样的情况：大脑下了指令，小脑接不住；小脑接住了，交互又掉线。</p>\n  <p>协同，正是具身智能落地在“三智”之外的下一道槛。</p>\n  <h2><strong>机器人落地的下一道槛，在模型之外</strong></h2>\n  <p>协同不能只是一句口号，而是需要真正从底层出发，为机器人设计一套专门的“粘合剂”，把各个部分有机组织起来。</p>\n  <p><strong>在智元创新日上，智元的另一项核心创新成果便是第三代硬件架构AHA3。</strong>它不是给旧方案打补丁，而是从底层重新设计了一套能同时承载运动、交互、作业三套智能的统一控制平台，让“三智”真正在物理层面串联起来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_8aebbabc12994fd8b4cfcf500e02b47d@19153231_oswg6260205oswg3744oswg2496_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这也是一项切中行业痛点的设计。过去几年机器人行业造硬件，最大的问题是碎片化——模型和系统各自为政，靠线缆和协议勉强连在一起。这也导致了，过去机器人身体里塞满了控制器，又大又重，散热也不过关。而据智元在发布上披露，这套系统带来的直接好处是：控制系统体积缩小了一半，响应速度翻了近一倍。</p>\n  <p>不过，仅仅重新设计硬件架构这套骨架还远远不够，还需要一套更好的“结缔组织”。</p>\n  <p>一直以来，机器人仍处于手搓状态，根源是机器人身上有大量不同的传感器、控制器和执行器，这些硬件来自不同厂商，采用不同的接口和通信方式。对于开发者来说，这无疑是一种灾难——如果每接入一种新设备，都需要重新编写大量底层代码，产品的开发和升级十分复杂。</p>\n  <p><strong>所以，智元的灵渠OS 1.0的作用便是，把硬件、通信、智能三层全部打通，让机器人第一次有了统一操作系统。值得注意的是，这也是业内首个具身智能原生操作系统。</strong></p>\n  <p>对于工程师们来说，他们最可感的变化是，灵渠OS 1.0直接让所有硬件接入变得像插U盘一样简单——通过重新定义硬件的接入标准，摄像头、传感器、机械臂等15类、共计100多种外设插上就能用，不用再费劲处理驱动。</p>\n  <p>灵渠OS 1.0除了有打通的意义之外，关键还够快。当机器人每秒发1000次运动指令，灵渠OS 1.0还能把每次间隔的误差不到4微秒。打个比方，人眨一次眼的时间里，机器人已经发了300多条指令，每条都准时到毫秒不差。</p>\n  <p>不过，智元并不打算独享这份基础设施的便利性。</p>\n  <p><strong>在智元创新日上，智元宣布与开放原子开源基金会共建中国人形机器人开源社区</strong>，在本体硬件、数据评测、操作系统、大小脑等核心方向推动技术转化与行业标准制定，并向基金会捐赠灵渠OS项目。双方将组织联合开发、测试验证和具身智能人才培养，建设全球开放繁荣的技术生态。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_84f29359fc5940b1a525b617b9a8ccc8@19153231_oswg15229019oswg4608oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>同时，灵渠OS 1.0计划于2026年底全面开源，届时将开放经过量产验证的约2亿行代码、5000多个生态软件包，推动机器人能力成为可复用的产业基础。</p>\n  <p>对开发者来说，灵渠OS 1.0相当于把一众智能能力做成了“技能包”，开发者们不用从零造轮子，直接实现对运动智能、交互智能、作业智能三大方向的开箱即用。</p>\n  <p>“你永远想象不到合作伙伴会给我们带来什么样的惊喜，这就是生态的魅力。所以我们必须把基座搭好，把更多的机会留给我们的合作伙伴”，智元合伙人、高级副总裁、通用业务部总裁王闯表示。</p>\n  <p>回望智元创新日发布的核心内容，智元基本已经实现了模型、硬件、系统三层自研和互相打通。这种技术纵深和覆盖广度，在具身智能行业内其实并不多见。</p>\n  <p>这套完整体系的终极考场，或许不在实验室里，而在真实落地的每一个场景里。</p>\n  <h2><strong>通用机器人开始干活，需要一把新标尺</strong></h2>\n  <p>过去几十年以来，工业机器人有一套成熟且简单的方法计算这笔钱花得值不值。只要计算这台机器每小时能生产多少个零件、乘以零件单价，减去电费和维护等成本，很快就能算出来回本周期。</p>\n  <p>不过，当通用具身智能机器人落地，行业急需一把全新的标尺来衡量价值——这是因为，具身智能机器人的工作岗位并不固定，可能今天在组装线上打螺丝，明天就去负责物流装配了。</p>\n  <p><strong>所以，在解决了基础技术布局之后，智元还试图为具身智能的新质生产力探索统一“度量衡”，提出了Worken（有效智能工时）这一新概念。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_f577704a722a49a1bde69bc8e600824b@19153231_oswg4227428oswg4800oswg3202_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>其实，也可以把它理解成具身智能时代领域的“Token”——Token衡量的是AI在数字世界里生成了多少内容，Worken衡量的则是机器人在物理世界里真正干了多少有价值的活。</p>\n  <p>按照智元的定义，Worken=活跃机器人数量×自主工作时长×产出效能比。</p>\n  <blockquote>\n   <p>（注：活跃机器人数量即当期在线、能正常干活的机器人数；自主工作时长即机器人不需要人管、自己干活的连续时间；产出效能比概念里，智元把一个熟练工人按标准方法、在单位时间内做出的合格产出，定义为1.0，机器人的实际产出除以这个标准定额，得出的比值就是效能比——等于1是达标，大于1.0就是比人干得还好。）</p>\n  </blockquote>\n  <p>通过这个定义，智元试图为物理AI建立一套新的评价框架，让机器人的新质生产力变成一个可以跨行业、跨场景比较的数字。</p>\n  <p>其实，Worken的意义还不止于算账，它背后牵出的是一个更深层的变化：未来机器人的资产属性可能正在被重新定义。</p>\n  <p>在过去，传统设备卖出去之后只会越来越旧。但到具身智能机器人领域，情况则完全不同——硬件虽然会折旧，但模型会升级、技能会扩展，甚至多台机器人还能一起实现自进化。也就是说，具身智能机器人的硬件在贬值，但智能在升值。</p>\n  <p><strong>所以，未来评估一台机器人，比的不再是性价比，而是“智价比”——用户花的每一分钱，会在整个生命周期里能持续创造多少有效智能工时。</strong></p>\n  <p>可以想象一下，在未来，一台机器人，是一件产品，但当一百万台持续在线、共享经验的机器人连在一起，他们或许不再是孤立的硬件，而是一种“云”，是一项持续生长的基础设施。</p>\n  <h2><strong>智元“跃迁”</strong></h2>\n  <p>回过头看这次A.I.DAY，也可以捕捉到智元的三项“跃迁”讯号。</p>\n  <p><strong>第一跃，是从打磨单点技术，走向构建全栈能力。</strong></p>\n  <p>当过去行业习惯比谁动作更炸裂，智元选择埋头苦干，把模型、硬件、系统三层全部啃了一遍——GO-3 Preview、AGILE、WITA-OMNI等突破了机器人的“想、动、聊”，智元还给这三套智能系统造了粘合剂，AHA3管硬件，灵渠OS1.0管软件。</p>\n  <p>而且，智元不是选择将这几个强项拼装，而是从底到顶长成一套体系。</p>\n  <p>“全栈自研不是可选的选择题，而是必选题”，彭志辉在会后向一众媒体表示，“本体是下限，模型是上限，智元必须做到模型能力足够泛化、本体足够可靠、软硬件综合系统能力达标，部署态对具身智能公司提出了全栈的要求。”</p>\n  <p>他直言，智元是一家面向场景的全栈公司，“我们的想法的很简单——把技术做得可以复用，把产品竞争力打磨得够强，这就是我们最核心的价值。”</p>\n  <p><strong>第二跃，是从销售机器人硬件，走向布局产业生态。</strong></p>\n  <p>技术底座铺好后，规模化落地成了水到渠成的事。智元没把机器人当展品卖，而是当成岗位去交付——龙旗南昌工厂里，8台精灵G2并入平板质检产线，6天处理17000多件产品，成功率99.99%；横琴长隆超500台机器人常态化上岗，覆盖七大场景；爱仕达门店里，100台灵犀X2当“硅基导购”，3天带动销售223万元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_7ae51a0af93f44c4a5afd3312c40f5e4@19153231_oswg4885262oswg3500oswg2333_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>但这些案例只是起点。具身智能的战场不在单点订单，而在场景密度——几乎没有哪家能靠自己吃下千行百业。</p>\n  <p>所以，智元把已经验证的全栈能力拆成开放底座，发起“元苼生态发展计划”。据介绍，智元未来五年投入超20亿元、2026年先行落地1亿元。</p>\n  <p>简单说，智元把操作系统、开发工具和模型整套能力全部开放，当开发者、高校、合作伙伴共用一套底座，多方汇聚创造力将会碰撞、滋长出新的生态。</p>\n  <p><strong>第三跃，也是最有野心的一跃：从参与产业竞争，走向探索重新制定产业规则</strong>。</p>\n  <p>当行业还在比卖了几台机器人时，智元提供了机器人生产力度量衡，告诉行业和场景方，如何真正衡量通用具身智能机器人的价值。</p>\n  <p>可以展望的未来是，当客户开始用Worken来评估采购决策，或许整个行业的竞争维度就被改写了，也会产生新的商业叙事。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_a9a6cbea2c274b45ab934d13626d0f0a@19153231_oswg4093579oswg2424oswg1382_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>王闯在会后的媒体访谈中也袒露了自己的畅想，他认为，若Worken未来能走向普及，机器人付费也可能从过去的“买设备”转向“生产力套餐”。</p>\n  <p>设想一下：用户购买Worken套餐包、预定任务后，机器人厂商或按实际消耗量扣费，并且提供服务不同场景下多台机器人的组合。不过，他认为这会是一个渐进演变的方向，Worken的商业模式还会会有很大的想象空间。</p>\n  <p><strong>其实，如果把三次跃迁连起来看，可以发现智元本质上是在推动机器人从实验室里的技术展示，变成物理世界里的基础设施和新质生产力。</strong></p>\n  <p>正如智元联合创始人、联席总裁、具身业务体系总裁姚卯青表示的——“每一个大热的科技赛道都会有自己的周期。对于机器人行业，我认为未来能真正走下去的公司，必须具备全链路把技术和产品转化为可衡量生产力的能力，真正在生产环节里提供可量化的价值。”</p>\n  <p>而我们也可以从中清晰透视出智元正在发生的变化——它不已再满足于在既有的机器人竞争框架中争夺领先位置，而是开始尝试改变竞争本身的方式。</p>\n  <p>或许，这才是此次以“跃迁”为主题的A.I.DAY，最值得玩味的地方。</p>", "category": "tech", "published_at": "2026-10-29T14:25:57+00:00", "fetched_at": "2026-10-30T04:05:48.800180+00:00", "fingerprint": "6189abba693c8ab9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨外交部回应三丽鸥取消Vivant联名；科创50指数创新低；上海一宜家餐厅开始实行“消费入座”，周二、周四有保安劝离", "url": "https://36kr.com/p/4047618190883331?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>宇树回应净利润下滑：系算力、大模型方向研发投入增加所致</p>\n  <p>美国司法部调查英伟达收购HuggingFace</p>\n  <p>美国知名投资人质疑美联储利率决议</p>\n  <p>机器人也有KPI考核标准了，智元发布首个“工时KPI”Worken</p>\n  <p>成都国星宇航科技股份有限公司通过港交所上市聆讯</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>外交部回应三丽鸥取消Vivant联名</strong></p>\n  <p>10月29日，外交部例行��者会上，有记者问：日本三丽鸥公司取消了和一部日剧的合作，原因是剧中对华人角色的刻画引发公众反感。请问发言人对此有何回应？</p>\n  <p>外交部发言人郭嘉昆表示，我们注意到有关报道。这部电视剧再次暴露出日本国内始终存在一股势力，企图通过文化产品丑化、抹黑中国，散播仇华情绪，应当引起国际社会和日本国内有识之士的警惕。（央视新闻）</p>\n  <p><strong>科创50指数创新低，较年内高位回撤45%</strong></p>\n  <p>AI产业链股29日集体下挫，拖累科创50指数走低，盘中一度跌超4%至1223.62点，创2025年9月初以来新低，且较今年6月份高位回撤45%。</p>\n  <p>午后PCB概念持续下挫，华正新材、奥士康、景旺电子、鹏鼎控股、沪电股份跌停，生益电子跌超10%，澳弘电子触及跌停，胜宏科技、深南电路、超声电子、鼎泰高科均跌超8%。</p>\n  <p>消息面上，全球科技股普遍走弱，行业巨头的失望业绩令市场重新审视庞大的AI支出。韩股市场三星电子因芯片利润不及预期一度跌6%，而美股市场Alphabet Inc.因销售额低于预期在盘后交易中暴跌10%。(新浪证券)</p>\n  <p><strong>宜家中国回应上海徐汇餐厅须“消费入座”</strong></p>\n  <p>近日，有网友反映，继星巴克之后，上海徐汇宜家餐厅平日也开始实行“消费入座”，周二、周四有保安劝离占座不消费的顾客。</p>\n  <p>宜家中国表示：您所关注到的顾客温馨提示，是宜家上海徐汇商场基于顾客反馈及门店日常运营开展的倡议，其目的是进一步提升顾客用餐体验。宜家重视每一位顾客的体验，我们希望与消费者共同营造更加舒适有序的购物环境。 （界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>美国司法部调查英伟达收购HuggingFace</strong></p>\n  <p>美国司法部目前已对英伟达拟以129亿美元（约合人民币866亿元）收购开源AI模型托管平台Hugging Face的交易展开反垄断调查，重点评估这笔英伟达史上最大收购是否会让其掌控AI生态的关键分发节点。</p>\n  <p>Hugging Face是全球开源AI社区的核心枢纽，拥有超过1800万开发者、300万个模型和50万个数据集。收购它，相当于控制了AI模型分发的“高速公路”，英伟达承诺交易完成后将保持平台的开放与免费，并计划在2027年上半年完成交割。（快科技）</p>\n  <p><strong>腾讯混元Hy4、Hy4 flash即将发布首次引入视觉理解能力</strong></p>\n  <p>10月29日，在2026腾讯全球数字生态大会上，腾讯宣布Hy4即将发布。相比Hy4 preview，Hy4实现了全面大幅提升，尤其强化了各类长程和真实生产力任务的能力，显著提升了思维链效率，并首次引入视觉理解能力。Hy4 flash也会在近期发布，提供极致性价比的实用模型。</p>\n  <p>���年8月28日，腾讯混元发布并开源新一代大语言模型Hy4 preview，总参数770B、激活参数49B，上下文长度突破1M。Hy4 preview在模型尺寸、上下文长度、数据规模上都进行了显著扩展，模型能力稳居开源模型第一梯队。(上海证券报)</p>\n  <p><strong>智元GO-3 Preview与Genie Master计划全面开源</strong></p>\n  <p>36氪获悉，在2026智元创新日上，智元联合创始人、联席总裁、具身业务体系总裁姚卯青现场正式发布新一代具身基座模型GO-3 Preview。姚卯青透露，智元计划于2026年底全面开源具身基座模型GO-3 Preview和具身Agent框架Genie Master。</p>\n  <p><strong>阿里云盘企业版CDE Agent计费模式调整通知</strong></p>\n  <p>36氪获悉，阿里云公告，为进一步降低CDE Agent的使用门槛，为您提供更加灵活、便捷的使用体验，自2026年11月25日起，将对Agent的购买及使用计费方式进行调整。Agent数量不再作为独立商品单独购买和计费。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技：近期有不法分子及非法中介机构冒名发布虚假招聘信息</strong></p>\n  <p>长鑫科技29日发布提醒：近期，公司再次发现有不法分子及非法中介机构，假借“长鑫科技”、“长鑫集团”、“长鑫存储”名义，在网络平台上散布虚假招聘信息。长鑫科技提醒：请勿下载不明软件，不点击陌生链接，不向非官方人员提供个人敏感信息；不参与付费或做任务获取招聘机会的活动；不轻信非官方社交账号散布虚假承诺，虚构岗位地点与薪资等。（财联社）</p>\n  <p><strong>美国知名投资人质疑美联储利率决议</strong></p>\n  <p>当地时间10月28日，美联储结束为期两天的货币政策会议，宣布将联邦基金利率目标区间维持在3.75%至4.00%不变。美国知名资管机构双线资本创始人，素有“新债王”之称的杰弗里·冈拉克在接受CNBC采访时指出，本次美联储按兵不动的做法，其实令人难以理解。因为能源和大宗商品价格持续上涨带来的压力，仍可能使得通胀在未来几个月内重新回到4%上方。接下来，除非油价出现明显回落，否则美联储必须在12月加息。冈拉克的判断，也与市场对12月政策走向的押注相呼应。芝加哥商品交易所的美联储利率观测工具数据显示，目前市场预计美联储12月加息的概率接近80%。（央视财经）</p>\n  <p><strong>滔搏回应耐克线上渠道调整：就库存回收和促销补贴等资源支持与品牌方持续沟通</strong></p>\n  <p>10月28日晚间滔搏公布截至2026年8月31日止六个月业绩。上半财年年收入109.13亿元，同比下降11.3%；公司权益持有人应占利润6.63亿元，同比下降16.03%。管理层在电话会上表示，叠加消费环境持续低迷，未来一段时期集团将面临较大业务挑战，短期内对收入和利润的影响仍然显著，将持续评估相关影响，对短期经营持审慎态度。滔搏管理层指出，此次调整是行业渠道格局重构背景下品牌方的渠道策略调整，并不意味着双方合作基础发生变化，双方线下合作保持不变。滔搏理解品牌方清理线上渠道、重塑品牌力的做法，正就库存回收和促销补贴等资源支持与耐克持续进行沟通。（澎湃新闻）</p>\n  <p><strong>油价30日起上调，国内汽、柴油价格每吨分别应上调440元、420元</strong></p>\n  <p>10月15日国内成品油价格调整以来，中东地缘紧张局势升级，国际市场原油价格大幅上涨。为减缓对国内的冲击，国家再次对成品油价格采取调控措施。根据现行价格机制计算，自10月29日24时起，国内汽、柴油（标准品）价格每吨分别应上调440元、420元，统筹兼顾减轻下游用户负担和保障成品油安全稳定供应，调控后实际上调345元、335元。</p>\n  <p>国家发展改革委将指导成品油生产销售企业全力做好成品油生产和调运，确保市场稳定供应，并配合有关部门加大市场监督检查力度，严厉查处不执行国家价格政策等违法违规行为，切实维护市场秩序，保护消费者利益。(新华社)</p>\n  <p><strong>机器人也有KPI考核标准了，智元发布首个“工时KPI”Worken</strong></p>\n  <p>“物理AI时代，拿什么度量机器的价值？”10月29日，在上海世博中心举行的2026智元创新日（AIGBOT INNOVATION DAY）上，智元联合创始人、总裁兼CTO彭志辉发布了首个定义物理AI价值的度量衡：Worken（有效智能工时），用于衡量机器人自主作业的实际产出。</p>\n  <p>在彭志辉看来，每一个产业时代，都有自己的“度量衡”：蒸汽时代用马力度量机器的力量，电力时代用千瓦时度量机器的能量，数字AI时代用token度量机器的思考。“Worken的计算公式为Worken（有效智能工时）=有效智能工时＝活跃机器人数量×自主工作时长×产出效能比。”记者现场了解到，这一指标将在机器人制造数量之外，进一步衡量机器人能否自主、持续地完成有价值的工作，以及实际创造了多少成果。(每日经济新闻)</p>\n  <p><strong>荷兰国际集团宣布全球裁员约400人，预计每年削减成本7500万欧元</strong></p>\n  <p>荷兰国际集团（ING）公布，计划重组批发银行业务，预计全球裁员约400人，相关调整将于2027年3月1日起生效。公司预计，相关措施将产生约1.75亿欧元税前裁员费用，并每年削减成本约7500万欧元，自2028年起全面生效。该行第三季度净利润为18.5亿欧元，同比增长3.5%；税前利润增长5.7%至27.05亿欧元。（财联社）</p>\n  <p><strong>机构：MacBook Pro新机入局，预估2027年全球OLED笔记本出货年增逾40%</strong></p>\n  <p>36氪获悉，根据TrendForce集邦咨询最新显示器产业研究，Apple（苹果）发布的MacBook Pro with PROLED XDR Display首度导入串联式OLED触控屏幕，标志着MacBook显示技术与操作体验的重要转变。TrendForce集邦咨询预估，这款新机于2027年的出货量将介于120万至150万台间，Apple切入OLED笔记本市场，也已激励面板厂加速相关显示技术发展。TrendForce集邦咨询预估，即使整体笔记本市场近两年皆呈现下滑，2026年OLED笔记本整机出货量仍可望年增近40%，2027年将再成长40%以上。</p>\n  <p><strong>四大行总市值盘中突破10万亿元大关，创出历史新高</strong></p>\n  <p>10月29日上午，银行指数大涨超1%，刷新阶段新高。青岛银行、成都银行、齐鲁银行等个股均涨超3%。四大行也全线上涨，工商银行涨超2%，创出历史新高。值得一提的是，中农工建四大行总市值盘中突破10万亿元大关，创出历史。新高。其中，工商银行总市值超过2.9万亿元，建设银行超过2.35万亿元，农业银行逼近2.6万亿元，中国银行超过2.1万亿元。(证券时报)</p>\n  <p><strong>DoorDash宣布以约170亿美元收购生鲜平台Instacart</strong></p>\n  <p>10月29日消息，外卖配送平台DoorDash宣布以约170亿美元收购生鲜杂货配送平台Instacart，交易预计将帮助DoorDash的杂货配送业务更好地与亚马逊、沃尔玛竞争。</p>\n  <p>DoorDash起家于餐厅外卖配送，此前已建立自己的杂货配送业务，但长期面临Instacart、Uber、沃尔玛和亚马逊的竞争；同时对手们也在渗入其核心的餐食配送腹地，Uber 先后收购了Postmates和Delivery Hero。本次收购完成后，DoorDash将借助Instacart成熟的杂货市场平台及其零售商合作网络，扩大在线杂货配送的份额。(IT时代网)</p>\n  <p><strong>百度确认副总裁吴甜离职，97后接棒</strong></p>\n  <p>日前，业内有传闻称百度集团副总裁、百度研究院副院长吴甜已离职，百度公关经理在朋友圈确认了该消息。她表示，吴甜已结束在百度的任职，而百度的技术工作仍在向前推进。据了解，吴甜长期负责百度人工智能技术、平台与生态，推动飞桨深度学习平台和文心大模型等成果落地 。公开信息显示，吴甜2006年从浙江大学毕业后加入百度，长期在人工智能领域工作。</p>\n  <p>今年7月，1997年出生的孙天祥加入百度，担任基础模型研发部负责人。值得一提的是，日前百度智能云事业群组（ACG）已完成新一轮业务架构重构的消息。（快科技）</p>\n  <p><strong>Alphabet债务风险指标上升，财报令AI举债担忧再起</strong></p>\n  <p>Alphabet Inc.股价周四暴跌之际，其债务违约保护成本上升。此前该公司业绩令人失望，加剧了市场对其举债支持的巨额人工智能（AI）支出可能无法获得回报的担忧。根据ICE Data Services，该公司五年期信用违约互换（CDS）报价一度上升5.3个基点，至每年84个基点，为9月21日以来最大升幅。CDS会随投资者担忧加剧而上升。Meta Platforms Inc.和芯片公司博通等企业的CDS也出现上升。标普全球市场财智固定收益定价执行董事Gavan Nolan表示，如果AI投资取得回报，股票投资者可能获得巨额收益；但如果局面恶化，债券持有人则要承担损失。（财联社）</p>\n  <p><strong>Anthropic成为SpaceX最大单一客户，每月贡献或高达约30亿美元</strong></p>\n  <p>知情人士称，Anthropic成为SpaceX最大单一客户，第三季度为马斯克旗下这家横跨人工智能、卫星和火箭业务的公司贡献了逾三分之一的营收。SpaceX上周在一份申报文件中表示，上季度约34.5%的营收来自AI部门的单一客户。该部门现名为Super Intelligence，提供算力服务。因涉及未公开信息而不愿具名的知情人士称，文件中被称为“客户B”的就是Anthropic。Anthropic的IPO披露文件显示，该公司同意在截至2029年的合同期内最多支出1205亿美元。文件显示，从今年12月开始，这相当于每月约31亿美元。（财联社）</p>\n  <p><strong>美股三大指数集体收跌，谷歌跌超12%</strong></p>\n  <p>36氪获悉，10月29日收盘，美股三大指数集体下跌，纳指跌1.38%，标普500跌0.3%，道指跌0.25%；大型科技股多数下跌，谷歌跌超12%，闪迪跌超5%，美光科技、亚马逊跌超4%，英特尔跌超3%，英伟达、特斯拉、微软小幅下跌，Meta、苹果涨超1%；热门中概股跌多涨少，理想汽车跌超2%，小鹏集团、阿里巴巴、百度跌超1%，网易、哔哩哔哩小幅下跌，拼多多涨超2%，微博涨超1%，京东小幅上涨。</p>\n  <p><strong>宇树回应净利润下滑：系算力、大模型方向研发投入增加所致</strong></p>\n  <p>10月28日晚间，宇树科技披露2026年第三季度报告。公司单季营收6.65亿元，同比增长69.93%；归母净利润1.13亿元，同比下滑17.37%，环比降幅接近50%。针对利润下滑，宇树科技董秘办相关人士表示，主要系算力、大模型方向的研发投入增加所致。该人士同时称，拉长周期看影响可控，单季度仅呈现阶段性变化；现阶段研发投入依托募投资金规划，不会盲目加码。（财联社）</p>\n  <p><strong>美国9月核心PCE同比上涨3.1%，美联储12月或加息25个基点</strong></p>\n  <p>美国商务部公布的数据显示，9月美国个人消费支出价格指数同比上涨3.6%，剔除食品和能源价格后的核心个人消费支出价格指数同比上涨3.1%。分析认为，受中东地缘冲突推升国际油价影响，能源价格上涨带动9月整体通胀反弹，市场关注企业是否将燃油成本转嫁给消费者。核心PCE是美联储最看重的通胀指标，其服务业分项反映国内价格压力是否顽固，一旦该细分项数据进一步走高，金融市场将更多押注美联储在今年12月举行的议息会议上加息25个基点。（央视财经）</p>\n  <p><strong>天元重工上市首日涨120.54%</strong></p>\n  <p>10月29日，德阳企业天元重工在北交所挂牌上市，成为2026年四川首家登陆北交所的企业。上市首日，该股高开高走，开盘价12.26元/股，较发行价4.48元/股上涨173.66%；截至收盘报9.88元/股，涨幅120.54%，总市值21.14亿元。（川观新闻）</p>\n  <p><strong>微软启动10批次美元高等级债券发行，为2017年以来首次</strong></p>\n  <p>微软启动10批次美元高等级债券发行，为2017年以来首次。微软盘前涨幅收窄至1%，此前一度涨超4%。（财联社）</p>\n  <p><strong>澳大利亚部分投资主管对Anthropic的IPO计划持谨慎态度</strong></p>\n  <p>Anthropic PBC即将进行的重磅首次公开募股（IPO），为澳大利亚市场带来一个新的人工智能投资标的，不过当地部分投资主管对此持谨慎态度。“这是一家了不起的公司，”澳大利亚养老基金UniSuper首席投资官John Pearce周四在墨尔本举行的CFA澳大利亚投资大会小组讨论中表示。至于这“能否转化为一项绝佳的投资，那就是另一回事了”。Pearce表示，Anthropic估值达到约2万亿美元可能“有些勉强”。他还说，该公司目前仍处于巨额亏损状态，要在三四年内实现正现金流并创造可观利润，将是一个“艰巨的目标”。（新浪财经）</p>\n  <p><strong>谷歌母公司持有SpaceX股票公允价值达752亿美元</strong></p>\n  <p>谷歌母公司Alphabet在季度报告中披露，截至2026年9月30日，公司持有的SpaceX股票公允价值为752亿美元，但短期内出售受到限制。（界面新闻）</p>\n  <p><strong>台积电以约12亿美元收购友达光电台中工厂及相关设施</strong></p>\n  <p>36氪获悉，据台交所公告，台积电从友达光电股份有限公司收购位于台中市的九处工厂及相关设施，交易总金额388亿元台币（12亿美元），供营运和生产使用。友达光电发布公告称，预计处分收益约185亿元台币。公司致力于轻资产运营模式、盘活资产和改善财务结构。</p>\n  <h2>上市进行时</h2>\n  <p><strong>成都国星宇航科技股份有限公司通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，据港交所文件，成都国星宇航科技股份有限公司通过港交所上市聆讯。</p>\n  <h2>大公司财报</h2>\n  <p><strong>江波龙：第三季度归母净利润37.45亿元，同比增长436.60%</strong></p>\n  <p>36氪获悉，江波龙公告，第三季度实现营收146.3亿元，同比增长123.74%；归母净利润37.45亿元，同比增长436.60%。前三季度实现营收387.18亿元，同比增长131.37%；归母净利润143.22亿元，同比增长1909.68%。</p>\n  <p><strong>中际旭创：前三季度归母净利润222.38亿元，同比增长211.81%</strong></p>\n  <p>36氪获悉，中际旭创公告，前三季度实现营收695.47亿元，同比增长178.13%；归母净利润222.38亿元，同比增长211.81%。第三季度实现营收277.69亿元，同比增长171.83%；归母净利润85.87亿元，同比增长173.74%。</p>\n  <p><strong>澜起科技：第三季度归母净利润12.4亿元，同比增长161.98%</strong></p>\n  <p>36氪获悉，澜起科技公告，前三季度实现营收54.14亿元，同比增长33.44%；归母净利润32.37亿元，同比增长98.32%。第三季度实现营收20.79亿元，同比增长45.97%；归母净利润12.4亿元，同比增长161.98%。</p>\n  <p><strong>比亚迪：第三季度归母净利润100.20亿元，同比增长28.08%</strong></p>\n  <p>36氪获悉，比亚迪公告，第三季度实现营收2214.88亿元，同比增长13.59%；归母净利润100.20亿元，同比增长28.08%。前三季度实现营收5663.04亿元，同比增长0.01%；归母净利润223.45亿元，同比下降4.24%。</p>\n  <p><strong>泸州老窖：第三季度净利润同比下降57.03%，环比增长111%</strong></p>\n  <p>10月29日，泸州老窖(000568.SZ)公告称，第三季度营业收入为41.95亿元，同比下降37.14%；归属于上市公司股东的净利润为13.32亿元，同比下降57.03%。前三季度实现营业收入146.68亿元，同比下降36.58%；归属于上市公司股东的净利润为56.71亿元，同比下降47.31%。业绩变动主要系本期产品销量减少影响所致。小财注：公司Q3净利润13.32亿，Q2净利润6.31亿，据此计算，Q3净利润环比增长111%。(财联社)</p>\n  <p><strong>中国石化：第三季度归母净利润133.61亿元，同比增长57.2%</strong></p>\n  <p>36氪获悉，中国石化公告，第三季度实现营收7697.35亿元，同比增长9.3%；归母净利润133.61亿元，同比增长57.2%。前三季度实现营收2.21万亿元，同比增长4.4%；归母净利润389.88亿元，同比增长30%。</p>\n  <p><strong>阿迪达斯三季度全球营收达73亿欧元，创历史新高</strong></p>\n  <p>36氪获悉，阿迪达斯发布第三季度财报。第三季度，阿迪达斯全球营收达73亿欧元，创历史新高，同比增长7%；营业利润10亿欧元；毛利率同比提升2.5个百分点至54.3%。阿迪达斯大中华区实现营收11.38亿欧元，同比增长13%；前9个月实现营收32.27亿欧元，同比增长15%。</p>\n  <p><strong>招商证券：第三季度归母净利润66.58亿元，同比增长80.65%</strong></p>\n  <p>36氪获悉，招商证券公告，第三季度实现营收122.11亿元，同比增长58.10%；归母净利润为66.58亿元，同比增长80.65%。前三季度实现营收341.12亿元，同比增长86.98%；归母净利润为172.82亿元，同比增长94.81%。</p>\n  <p><strong>吉利汽车：第三季度实现营收990亿元，同比增长10%</strong></p>\n  <p>36氪获悉，吉利汽车发布第三季度财报，第三季度实现营收990亿元，同比增长10%；核心归母净利润达52.1亿元，同比增长32%。前三季度公司总收入2726亿元，同比增长13%；核心归母净利润149亿元，同比增长41%。</p>\n  <h2>酷产品</h2>\n  <p><strong>心言机器人发布具身家庭智能体“巴布”&nbsp;</strong></p>\n  <p>36氪获悉，10月29日，心言机器人正式发布具身家庭智能体“巴布（Bubbo 1）”。心言机器人公司成立于2025年，专注家庭情感智能机器人的研发。本次发布会上推出的巴布（Bubbo 1），基于心言自研的Bubbo OS，实现了全新的伙伴式交互，从“外部”视角构建起一套“Family Agent”，识别家庭中的每一位成员并关注成员之间的关系。</p>\n  <p>在感知层面，巴布共有13类、26个传感器；输出层面，巴布拥有6个自由度和两块表情屏，能够理解复杂情感。除此之外，巴布内置了基于摄像头的心率检测，能够起到非医疗级的提示作用，分析检测对象的心率变化，并且已与测测智能戒指达成合作，可实现设备间的数据共享，时刻感应用户的情绪变化。10月29日起，巴布（Bubbo 1）在京东等官方渠道正式发售���售价9499元，前1000名订购者享受7999元优惠价。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>地球Online公测？谷歌“虚拟世界”Genie 4发布，逼真到发指。</p>\n  <p>&nbsp;</p>\n  <p><strong>FDE：从硅谷到中国，AI 落地的最后一公里</strong></p>\n  <p>硅谷在抢百万年薪的FDE，国内小红书却在避雷“高级外包”，36氪《AI局内人》邀请到了国内大厂FDE专家、中国和硅谷FDE创业者，一起聊聊FDE到底是什么工种？生存真相是什么？</p>\n  <p><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-30T00:12:47+00:00", "fetched_at": "2026-10-30T04:05:48.800176+00:00", "fingerprint": "88df58dbcfc99a51"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨固态电池“卖铲人”获红榕、明势等押注，已完成数十吨交付", "url": "https://36kr.com/p/4047672620611844?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_5139bc4b82404fd59ce3daa029a4a72d@6221844_oswg10002800oswg3072oswg4096_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3500</strong>字，建议阅读<strong>9</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，全固态电池关键原材料硫化锂生产商——四川全固态新材料有限公司（下称“四川全固态”）已完成数千万元A轮融资。本轮融资由红榕资本、明势创投领投，天泓投资、兴湘科创及老股东英诺天使跟投。拓深资本、启辰资本担任财务顾问，北京卓晖律师事务所担任法律顾问。资金将主要用于百吨级产线的设备升级与产能扩充、长沙研发中心搭建以及团队建设。</p>\n  <p>在全固态电池产业化前夜，这家成立于2024年的初创公司，正试图在巨头林立的锂电产业链最上游，撕开一道口子。</p>\n  <p>硫化锂并非一个新事物。早在2015年，四川全固态创始人于清炎便在日本客户的委托下首次接触到这一材料。彼时，国内全固态电池尚处于实验室的基础理化性质研究阶段，市场需求极少。但于清炎看中的是前沿材料早期的卡位价值。多年市场工作的历练，让他对红外光学、光伏、半导体掺杂、光通信等材料的应用与解决方案有着体系化认知，并逐步积累了国内早期从事材料研发的学者与电解质企业资源——这为日后切入硫化锂赛道埋下了伏笔。</p>\n  <p>硫化锂之所以关键，在于它是硫化物固态电解质不可或缺的原材料。无论是Li(2)S-P(2)S(5)二元体系，还是Li(10)GeP(2)S(12)、Li(6)PS(5)X三元体系，硫化锂均为核心前提材料。据东方证券研究所测算，在硫化物电解质成本中，硫化锂占比高达60%。</p>\n  <p>“也有人尝试在技术上绕开硫化锂、用其他原料替代，但经过十几年验证，从学术上基本走不通。”四川全固态CTO黄晓向硬氪表示。</p>\n  <p>与五硫化二磷、氯化锂等已有万吨级工业应用的材料不同，硫化锂在历史上几乎没有其他工业用途，供应链长期缺失——这恰恰给了初创公司从0到1建立工艺体系的容错空间。</p>\n  <p>当前，硫化锂的制备工艺路线尚未完全收敛。行业主流路径多以氢氧化锂为锚定点，每制备一公斤硫化锂约需消耗两公斤氢氧化锂，远期成本约为氢氧化锂价格的两倍，相较于液态电池材料缺乏竞争力。</p>\n  <p>四川全固态的选择，是绕过这一路径。公司已自主研发多种硫化锂制备工艺，其中“一步合成法”已实现突破——解决了无序放热问题，反应转化率近乎100%，并免除了高耗能、高固定资产投入的提纯环节。据公司披露，其量产工艺远期具备进一步下探至10万元/吨以下的空间。</p>\n  <p>“我们选择当前这条技术路线，核心是为了支撑全固态电池远期实现固液同价。”黄晓表示。目前硫化物电解质价格高达数百万元一吨，若硫化锂成本无法大幅下降，全固态电池在电芯层面的价格竞争力将无从谈起。</p>\n  <p>知识产权方面，公司已公开10项专利，另有十余项专利在审，并同步布局了硫化物、氧化物、硒化物、碘化物等固态电解质前体材料的全套解决方案。其中，硒化物因在正极侧不生成气体、可显著提升安全性能，被公司内部视为下一代潜力材料，目前已完成实验室开发，小试线搭建接近完成。</p>\n  <p>商业化进展方面，四川全固态迄今为止已完成数十吨硫化锂交付。客户涵盖国内头部硫化物电解质企业及部分主机厂，同时已与韩、日、美等海外客户建立合作。</p>\n  <p>据公司透露，2026年前三季度交付量已达去年全年3倍，预计全年营收突破2000万元。另据追光新能源统计，2025年四川全固态在硫化锂供应商中排名已达第二。</p>\n  <p><strong>以下为硬氪与四川全固态创始人团队的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：全固态电池常被视为液态电池的补充，你们如何判断它的终局形态？</strong></p>\n  <p><strong>四川全固态：</strong>要看清全固态电池的终局，首先要跳出“材料替代”的旧视角。以往的液态电池迭代，本质上都是正负极化学体系的更替，而全固态电池是一次形态层级上的跃迁——它不是某一种体系的升级，而是一个全新的技术平台。它对应的正负极体系既可以兼容现有所有液态电池体系，又能进一步打开特殊体系的空间，既能覆盖消费电子，又能延伸至深海深空、动力、储能等全场景。换句话说，液态电池能做到的它都能做，液态电池做不到的，它也能做到。全固态电池是储能领域难度最高的山峰，但山峰的另一侧，是对当前液态电池体系的整体重构——它对标的是90年代锂离子电池对铅酸电池的迭代关系，而非简单的补充。</p>\n  <p><strong>硬氪：硫化锂行业当前最大的不确定性是什么？</strong></p>\n  <p><strong>四川全固态：</strong>任何前沿产业在从0到1的过程中，都要经历从政策驱动向市场驱动的接力，全固态电池正处于这个接力的关键节点。过去两三年，需求从实验室级别向千吨级别演进，千吨级硫化锂大致对应5至10GWh的全固态电芯——这意味着上游材料的需求量级，正在与产业化进程同频共振。当前最大的不确定性，在于全固态电芯技术突破的节奏，电芯端每一次突破，都会实时传导至硫化锂需求端。</p>\n  <p>但有一点是确定的：我们做的这些材料，在液态电池产业链中并不存在，它们是全固态产业与生俱来的“基础设施”。所以我们的选择是——不赌短期节奏的波动，而是押注整个产业的方向。</p>\n  <p><strong>硬氪：初创公司资源有限，面对上市公司和头部企业下场，你们的应对策略是什么？</strong></p>\n  <p><strong>四川全固态：</strong>在上游材料领域，规模从来不是唯一的胜负手，卡位的时机与技术纵深同样关键。一方面，硫化锂市场规模尚小，上市公司投入的资源和精力严重不足，这给了我们时间窗口。另一方面，技术问题是难倒大多数创业者的第一道门槛，第二道是资金。这两年投在新能源方向的资金是有限的，我们基本占据了赛道大部分的资源。</p>\n  <p>更重要的是，双方的竞争逻辑根本不同：上市公司追求标准品的规模复制，而我们聚焦固态电解质前体材料，拼的是技术迭代速度和客户定制化响应速度——这恰恰是大企业决策链难以匹配的。这个赛道的竞争，不是“大鱼吃小鱼”，而是“快鱼吃慢鱼”。我们的策略很清晰：在窗口期内把技术纵深和客户黏性做实。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>领投方红榕资本表示：</strong>锂电产业的变革已经进入深水区，液态电池的性能天花板之下，全固态是必须翻越的下一座高山，而固态材料的成熟进度，决定了整个赛道的时间表。四川全固态新材料立足西南锂电集群，直面界面、纯度、规模化等行业共性难题，坚持长期主义投入基础创新。基础材料没有捷径，壁垒源于日复一日的工艺迭代。期待公司携手上下游伙伴共建国产固态生态，持续输出稳定、高性能的核心原料，以本土材料力量，支撑我国动力电池向更高安全、更高能量密度的时代跨越。</p>\n  <p><strong>领投方明势创投表示：</strong>下一代电池体系的胜负手，始于核心化学原料的工业化破局。硫化锂之于硫化物固态电池，既是决定经济性的成本中枢，也是影响电化学表现的品质命门。四川全固态新材料跳出传统路径依赖，凭借全球独家的固/固合成改良工艺，攻克了高纯原料规模化制备的工程挑战，并在下游头部客户的严苛验证中确立了出货优势。明势创投坚信具备底层创新与工程兑现力的团队能够引领产业突围，期待公司加速释放量产势能，筑牢新一代能源变革的材料基石。</p>\n  <p><strong>老股东英诺天使表示：</strong>四川全固态聚焦硫化物全固态电池核心原材料硫化锂赛道，依托国内固态电池重大研发专项政策东风，行业远期市场空间可达千亿规模，是下一代动力电池产业的关键上游环节。公司硫化锂产品处于行业第一梯队，已实现吨级稳定出货，成为多家头部电解质企业一供，下游客户资源优质。核心团队拥有十余年锂电材料研发、生产及市场拓展经验。公司技术与客户壁垒初步成型，成长逻辑清晰，期待公司为国产固态电池产业持续贡献价值。</p>", "category": "tech", "published_at": "2026-10-30T01:05:49+00:00", "fetched_at": "2026-10-30T04:05:48.800172+00:00", "fingerprint": "a5c6ef67f9a5689e"}, {"source": "36氪 - 最新文章", "title": "AI进入细胞工厂，资本等的「大结果」快到了？", "url": "https://36kr.com/p/4046754792543106?f=rss", "summary": "<p>文 | 刘凌果</p>\n  <p>编辑 | 海若镜</p>\n  <p>10月14日，诺贝尔化学奖得主David Baker团队连发两篇《Nature》，宣布AI能从头设计蛋白酶；9月以来，Claude、Gemini 4接连宣称具备发现、设计新酶的能力。</p>\n  <p>AI4S水温沸腾，以酶为关键工具的昔日顶流“合成生物”，能否复制AI制药的升温路径，借由AI证明自己，重获资本青睐？</p>\n  <p>“直至今年，大多数企业都没从坑里爬出来。包括当年顶尖VC投的一批公司，甚至估值倒挂。”回顾上一周期，一位投资人感慨。</p>\n  <p>五年前，合成生物也曾风头无两。但此后，随着一批企业倒在中试和商业化，资本退潮，“以生物造万物”变得模糊而遥远。</p>\n  <p>进入今年，AI打开新想象，上一轮出清也让一些项目估值回落，部分投资人透露，又开始关注这一赛道。“今年肯定是有回暖的，但不是回到2021年的状态，主要基于AI和‘十五五’政策驱动。”森瑞斯创始人罗小舟告诉36氪。</p>\n  <p>“既要菌株、代谢通路设计，关键酶的研发能力，又要放大生产经验，还要选品市场规模够大。”英诺科创基金执行董事李英杰将“六边形战士”作为自己的考察标准。</p>\n  <p>10月12日至13日，2026生物制造大赛前沿技���赛道复赛在京举行。从医药中间体、色素到油脂、材料，项目各异，“AI含量”普遍升高；今年获数亿元级融资的微元合成、天鹜科技、利德健康，也无一例外将部分募资投向AI。</p>\n  <p>AI正在怎样改变合成生物，又有哪些坑，AI还没填上？</p>\n  <h2><strong>2026年了，AI能否放大研发优势？</strong></h2>\n  <p>在酶设计上，AI已开始大展拳脚。</p>\n  <p>酶是细胞中的催化工具，帮助原料转化为目标产物。设计更稳定、高效的酶，是提高产品得率重要一步。过去，研究人员主要依靠分析、经验和反复试错来“大海捞针”；AI基于对海量蛋白质序列等的学习，则能更快挑出更具潜力的候选酶，大幅缩短筛选时间。</p>\n  <p>以欣贝莱的乳果糖项目为例，CTO刘华涛介绍，团队通过AI计算平台，从三万多条酶序列中筛选、锁定了一百条进行合成，湿实验验证后，其中约二十条序列表现出催化活性。随后，通过理性设计，AI根据每轮实验数据继续设计突变体。多轮迭代后，表现最好的突变体，活性提高至原来的约5倍，稳定性提升约3倍。AI介入后，用时3个月，实现了野生型酶到工业酶的转变。</p>\n  <p>“对比盲筛，AI能使研发周期缩短大约80%，”刘华涛总结道。</p>\n  <p>光找到一种“能干”的酶还不够。在细胞将底物一步一步转化为目标产物的过程中，往往需要多种酶接力配合。如今，AI也被用于优化细胞内多种酶协作的代谢通路。</p>\n  <p>森瑞斯创始人罗小舟介绍，在角鲨烯项目中，AI综合产量、多个酶表达量等实验数据，推断哪个环节可能“拖了后腿”，再给出具体的调整建议。</p>\n  <p>不过，研发前端找到更好的酶和菌株，只是第一步。进入工厂，它们还要适应不同的设备和生产条件。</p>\n  <p>欣贝莱的达泊西汀中间体项目从实验室到工厂放大的过程中，原始工艺在匹配工厂设备的过程中就遇到了瓶颈，由于生产设备转速比较低，无法像小试那样通过高速离心进行破乳，于是，团队从工艺约束倒推，借助AI提高酶对有机溶剂的耐受性，实现非水相催化，通过工艺调整解决生产问题，最终解决乳化、分离难题。</p>\n  <p>“生产设备稍微改造一下，不止几十万、几百万元，”刘华涛说，相当于AI帮团队省去了这部分成本。</p>\n  <p>小试、中试的工艺放大，是让众多企业折戟的“死亡谷”，AI正在尝试一步一步地填上这些“天坑”。</p>\n  <p>英诺科创基金李英杰介绍，一家企业在完成百升级小试后，进入工厂百吨发酵罐，因罐体、搅拌等设备条件变化，需重新适配工艺参数。加之一次发酵要七天，失败后只能重新投料、再试，落地投产比预期略有延后。</p>\n  <p>“小罐里的培养液相对更容易搅拌均匀；但罐体放大后，不同位置的溶氧、pH和底物浓度会有所差异，导致菌株的生长环境随之变化，小试阶段没暴露的问题浮出水面。”百仑生物AI技术负责人罗洪振解释，中试及量产中，导致产量波动、得率下降的因素众多，对工艺开发而言有点像“黑箱”。</p>\n  <p>AI带来的变化，和改造酶类似，让“黑箱”变得可预测，提前排雷、减少试错。“最近工厂发生一件让现场人员觉得很‘amazing’的事，我把生产批报交给AI分析，它判断一个阀门可能存在问题，工作人员起初不信，实际检查后，发现偏差确实达到约10%。”罗小舟说。</p>\n  <p>类似的变化，也发生在蓝晶微生物的一个中试项目中。蓝晶微生物首席科学家饶驰通介绍，项目连续运行五六个批次，产量始终不稳定，工艺人员多次调试也没能解决。经AI分析后，大约在一周内锁定了原因，调整后产量才稳定下来。</p>\n  <p>不过，目前AI更多用于预测风险、排查堵点，尚不能替代“老师傅”作出决策。何时补料、怎样调整搅拌和通气，仍需负责人员判断；出现染菌、设备偏差等异常，具体操作仍得由“老师傅”接手。</p>\n  <p>这背后既有数据限制，也有决策责任。AI掌握的信息主要来自传感器，范围相对受限；未被记录的异常，难以成为它的学习材料，因此缺少处置经验。另外，如果发生误判，可能导致整批物料报废，因此当下决策结果仍需由人把关。</p>\n  <h2><strong>AI还没填上的坑：谁来买？</strong></h2>\n  <p>事实上，相较技术端的提升，受访企业和投资人认为，行业近几年更显著的变化，是选品更紧贴真实市场需求。目前，这也是AI帮助最少、但对公司业绩影响最大的环节。</p>\n  <p>对品类真实市场需求的错判，是过去几年许多合成生物企业“最痛的领悟”。</p>\n  <p>美国生物塑料先驱企业Danimer Scientific曾投入巨资推进PHA产业化，2022年将年产能扩至5500万磅，希望以可降解材料切入吸管、餐具、食品包装等一次性塑料市场。但随后由于订单不足，产能严重闲置，导致单位生产成本居高不下；叠加星巴克调整订单及债务压力，公司2024年前三季度营收同比下降26%，净亏损约7180万美元，最终于2025年3月申请破产保护。</p>\n  <p>原本市场需求明确的产品，在集中扩产后，也会因供给过剩而降价。</p>\n  <p>用于无糖饮料、烘焙食品等的代糖赤藓糖醇，在2021年前后因需求激增、利润走高，吸引三元生物、诸城东晓、保龄宝等企业集中扩产。到2023年5月，国内年产能已达38万吨，远超全球实际需求，价格从每吨4万元一度跌至9500元，部分新增产能随后停产或转产。</p>\n  <p>公司能生产什么，与客户愿意买什么，有时是两道错位的题目。</p>\n  <p>“有时网上都在提某产品的痛点，但真正与客户交流后会发现，这些痛点只是浮于表面，与真实需求天差地别。”罗小舟认为，合成生物公司应尽早接触市场、摸清市场，提前核算客户可接受的成本、产品形态等。</p>\n  <p>经过上一轮“市场教育”，目前企业的选品逻辑主要向两条路线收敛：一是沿着明确的下游需求提前布局产品；二是切入已有市场，以更低成本替代现有供应方式。</p>\n  <p>医药中间体便是第一条路线的代表之一。“从我们投资的企业来看，早年很多团队集中攻坚黄酮类、复杂萜类（如紫杉醇等）、多肽（GLP‑1）、氨基酸衍生物（麦角硫因、5‑HTP）这类结构复杂产物。后来发现做基础生化原料、医药单体、食品与饲料类功能原料，这些品类开发效率更高、落地更快，也更贴近真实市场需求。”华大松禾生科基金管理合伙人曾晓玉指出。</p>\n  <p>生物农药也是类似逻辑。围绕植物病原菌、病虫害等具体问题开发多肽产品，需求场景比较清晰。同时，生物农药具有较高的监管门槛，开发成本和周期又低于人用药；产品一旦跑通，合规资质、客户等也能进一步构成壁垒。</p>\n  <p>对于通过成本优势替代化学合成、植物提取等现有供应方式的第二条路线，李英杰表示，芳香族化合物、甘草酸、生物基橡胶等产品有相对明确的市场，无需重新培育需求；但价格要降至现有水平的50%-80%，才可能推动客户更换供应方式，仅便宜10%，替代动力可能仍不足。</p>\n  <p>在选品上，AI目前能力仍十分有限，主要用于扩大选品搜索范围。例如，有的企业通过AI梳理海量文献，从中寻找自然界已存在、却尚未量产的“潜力股”。</p>\n  <p>另一方面，AI带来的研发提速，也让企业更倾向于避开容易开发的产品。比如，原本三个月能完成的产品，即使提效十倍，也仅将周期缩短至约九天，竞争者同样容易追赶；如果是过去需三年以上才能完成的复杂产品，研发周期缩短至三个月，AI创造的时间差可能才真正有价值。</p>\n  <p>基于这一判断，罗小舟表示，森瑞斯基本不做合成路径少于10步的产品。</p>\n  <h2><strong>资本还在等什么？</strong></h2>\n  <p>当前，AI已嵌入酶、细胞代谢通路、发酵工艺等环节的优化，研发端显著提速；但经过上一阶段的教育，已经投资过合成生物的投资人们，不再愿意只为“技术”买单。</p>\n  <p>多位生物背景的投资人表示，很多团队都在配置AI能力，但AI还没有转化为估值溢价，也不足以让他们加速出手。</p>\n  <p>他们要看技术落到商业的全链：AI+干湿实验闭环是否跑通；研发提速能否传到生产端，变成更低的单位成本；成本下降后，又能否换来订单。</p>\n  <p>换言之，小试、中试数据，营收和利润，这些更硬的业绩才能左右投资人手里的筹码。</p>\n  <p>“行业竞争的重心，已经从谁能设计出更好的菌株，转向谁能把 DBTL循环压缩到极致。这是这波 AI 浪潮带来的底层工具与研发范式革新，也会让我们从投资的角度来重构这个行业的评估框架。”曾晓玉提到。多位投资人也表达了相似看法：干湿实验闭环，构建出更高效的DBTL（设计-构建-测试-学习）循环，是合成生物最为关键的一环。</p>\n  <p>从Anthropic自建湿实验室，到OpenAI与Ginkgo Bioworks联手搭建自主实验闭环，当大量真实数据在7×24小时的循环中不断产生、回流，模型也将根据实验反馈持续迭代，进一步提高产品得率、稳定性，以及在中试、生产端等提前预判并排除更多风险因素。</p>\n  <p>而无效试错的减少，终将逐步显现在成本、业绩曲线上。当下，越来越多的合成生物企业尝试让AI接管实验室。谁能率先冲线，便有可能在风再起时，拿到“大结果”。</p>\n  <p>要让DBTL真正转起来，绕不开算法、算力和数据三大基本要素。其中，算法各家多基于开源蛋白质大模型继续开发；算力需求因任务而异，单酶预测相对有限。</p>\n  <p>最难速成，也最可能拉开企业AI能力差距的，目前在数据。</p>\n  <p>首先数据稀缺。罗小舟介绍，许多具体生物任务只有万级或十万级数据，百万级都不常见；即使基因组序列达到数十亿、上百亿条，没有对应的实验标注，意义也非常有限。</p>\n  <p>同时，越往生产端，数据越难得。一种菌株从孔板筛选、500毫升小试，走到百升级中试和工厂生产，每上一个台阶，培养条件随之改变，原有数据无法直接套用；规模越大，单次实验消耗的原料、设备和时间也越多，批次数据很难快速积累；此外，数据还受限于硬件“视野”，传感器无法检测的变量，AI自然也无从习得。</p>\n  <p>企业只能先“盘活”已有数据。今年，蓝晶微生物把智能体接入原有自动化研发平台的过程中，饶驰通表示，投入最大的并非智能体开发，而是历史数据的整理。“至少过去四五年，自动化平台采集的实验数据、发酵批报和文档，都要重新分类、归纳和标签化，以此构建本地数据库。这项工作花了很大精力。”但成果也相对显著，当前，蓝晶的发酵过程预测模型已使用几十个维度、数百个批次的数据，可以预测2小时、4小时后的变化。</p>\n  <p>为持续获得新数据，各家都在打通AI与自动化实验室，让“大脑”能直接调动“手脚”。</p>\n  <p>据了解，眼下仍有两处断点：一是AI给出的方向性建议，无法直接落到每一步的具体执行；二是成形的实验方案也不能直接转化为机器设备指令，例如从哪个孔取样、取多少，再向哪个孔加样等具体动作，仍需人来充当“翻译”。</p>\n  <p>主要是因为，一项实验意图要变成湿实验中的真实操作，需依次经过方案设计、SOP（标准操作流程）、设备代码、物理执行和结果反馈等多层转换。每往下走一层，都要将上一步的语言进一步拆解、细化，直到机器能够准确执行。</p>\n  <p>换言之，AI能提供一份精美、详尽的菜谱，但如何让锅、铲和炉灶能自己读懂、理解菜谱，并自动完成烹饪，仍有难度。</p>\n  <p>AI无疑让合成生物跑得更快了，但场边的资本仍在观望，谁会是率先将速度兑现的那一个？</p>", "category": "tech", "published_at": "2026-10-30T01:31:17+00:00", "fetched_at": "2026-10-30T04:05:48.800167+00:00", "fingerprint": "1a8a259a2a2002fb"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨前华为VP创业做AI原生电力资产运营，获宁德时代旗下基金数千万美元A轮融资", "url": "https://36kr.com/p/4047734928259592?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约3600字，建议阅读9分钟</p>\n  </blockquote>\n  <p>硬氪获悉，总部位于瑞典的AI原生电力资产运营商Green Voltis近日宣布完成数千万美元A轮融资，由宁德时代支持设立的美元基金Lochpine Capital 独家投资。</p>\n  <p>本轮融资资金将主要用于三个方面：继续加大Aether AI电力交易智能体与Chronos并网控制系统的研发投入、欧洲重点市场的业务拓展，以及AI基础设施领域的布局。</p>\n  <p>Green Voltis创始人史耀宏，创业前在华为工作16年，曾任华为副总裁，先后担任中东地区部总裁、软件产品线总裁、中国区政企常务副总裁、云与计算中国区总裁，长期负责华为在海外市场的业务拓展和云计算业务。2023年离开华为后投身欧洲电力市场，用AI交易和能量管理系统运营灵活性资产。</p>\n  <p>Green Voltis的核心团队还汇聚了来自华为、爱立信、T-Mobile等ICT领军企业，以及Rolls-Royce、Brady、Varberg Energi等电力系统与电力交易专业公司的人才。</p>\n  <p>如今，AI算力竞争正在将电力推向新的产业瓶颈。在美国，部分数据中心选择通过自建燃气电站等方式获取电力，而在欧洲，天然气高度依赖进口，碳价和气候立法让新建化石电源既不经济、也难获批，而电网扩容的速度远赶不上算力需求，在法兰克福、阿姆斯特丹、都柏林等核心枢纽，数据中心并网排队可长达七到十年。</p>\n  <p>在这一背景下，数据中心能否成为电网可调节的灵活性资产，开始影响其获取电力的效率。对于储能等灵活性资产而言，如何通过交易和控制系统提升收益，也直接关系到项目的经济性和融资能力。</p>\n  <p>Green Voltis的切入点，是为独立储能和风光配储项目提供从并网到交易的一站式服务。公司的本地工程团队负责并网调试及辅助服务资质认证，帮助项目尽快具备运营条件；自研Chronos能源管理系统（EMS）则负责电站现场控制，并支持构网型运行。公司希望通过控制系统与交易平台的协同，将储能设备从单纯的硬件资产转变为能够参与电力市场、持续创造收益的运营资产。</p>\n  <p>其中，Aether AI电力交易智能体是公司的核心研发投入方向。与传统流程型软件主要按照预设规则执行交易不同，Green Voltis从创业之初便选择AI原生架构，希望将市场预测、交易决策与执行连接起来，利用电价预测和量化策略，动态优化不同市场的收益机会。</p>\n  <p>欧洲电力市场的交易机制，为这套系统提供了应用空间。史耀宏向硬氪介绍，欧洲日内市场普遍采用连续交易机制，价格会随着供需变化持续波动；同时，在满足市场规则和交付约束的前提下，储能资产可以参与日前、日内及调频等多个市场和产品。如何在不同市场之间分配有限的储能功率和容量，成为影响收益的关键。</p>\n  <p>Green Voltis采用的策略称为Revenue and Capacity Stacking，即收益与容量叠加。简单来说，系统不是在每个时段只选择一个市场，而是综合预测不同市场的价格和容量需求，在满足各项交付约束的前提下，协同配置多个交易产品。为了实现这一策略，公司不仅自研交易平台，也自研EMS，以便将不同产品的功率曲线进行组合，并协调交易决策与现场控制。</p>\n  <p>牌照是另一道门槛。Green Voltis选择自持关键电力市场牌照，而不是完全依赖第三方持牌机构开展交易。史耀宏介绍，全瑞典仅有2家VPP公司持有BRP牌照。目前，公司已在欧洲10个国家布局电力市场准入。</p>\n  <p>收益表现上，公司提供数据显示，其所管理储能资产的收益持续高于Clean Horizon储能收益指数，而同期行业平均水平约为该指数的75%。</p>\n  <p>在灵活性资产运营之外，Green Voltis正将同一套能力延伸至AI基础设施领域。其判断是，欧洲数据中心面临的核心问题不只是建设机房和采购GPU，还包括如何获得电力，以及如何在满足电网要求的前提下尽快投运算力。</p>\n  <p>因此，Green Voltis将自身定位为Power-to-Compute运营商，而非传统的数据中心开发商：一端连接电网，另一端连接算力，尝试将稀缺的并网容量转化为可快速交付的算力资源。公司计划与合作伙伴共同推进数据中心项目，从具备建设条件的场地入手，打通中高压电力接入、供配电、储能与GPU功率控制等环节，让数据中心在必要时能够配合电网调节负荷。</p>\n  <p>史耀宏透露，公司目前已在北欧储备约120兆瓦具备并网条件的数据中心用地（Powered Land），公司希望在后续项目中，将电力接入条件与供配电、算力部署和灵活性控制能力进一步整合。</p>\n  <p><strong>以下为硬氪与史耀宏交流节选：</strong></p>\n  <p><strong>硬氪：您离开华为后，为什么会选择进入欧洲电力市场？</strong></p>\n  <p><strong>史耀宏：</strong>我在华为期间负责过云计算相关业务。那时我们希望通过云和AI赋能千行百业，但也逐渐意识到，如果对行业缺乏深入理解，就很难真正为客户创造价值。因此，离开华为后，我希望把过去在ICT领域积累的技术和经验带到具体行业中，深耕AI与产业结合的机会。</p>\n  <p>能源市场体量大、变化多，既有复杂的行业规则，也有大量值得探索的机会。与此同时，我们过去做的很多业务偏软件、偏运营，与电力交易和新能源资产运营在底层逻辑上有一定相通之处。当然，能源行业的专业门槛很高，所以我们从创业之初就非常重视跨领域团队建设。联合创始人和研发负责人来自华为，电力解决方案相关的核心人员则主要在欧洲组建。我们希望把ICT技术积累与本地电力行业经验结合起来，解决能源市场中的实际问题。</p>\n  <p><strong>硬氪：公司的核心竞争壁垒体现在哪些方面？如何转化为储能资产的收益优势？</strong></p>\n  <p><strong>史耀宏：</strong>我们的竞争优势主要体现在三个方面。</p>\n  <p>第一是牌照。我们从创业之初就选择自持关键牌照，包括BRP（平衡责任方）、BSP（平衡服务提供方）及售电相关牌照。这样，我们就可以自主制定和执行交易策略，而不必受到其他持牌方的限制。牌照决定了我们能否充分发挥自身的交易能力。在我们已经开展电力交易的北欧市场，VPP（虚拟电厂）领域能够自持相关牌照的初创企业并不多。</p>\n  <p>第二是技术架构。我们从2024年创业之初，就选择采用AI原生的技术架构来解决电力交易问题。与传统的流程型软件相比，我们希望通过AI和量化技术，更及时地处理市场信息、预测价格变化并执行交易，因此能够支持更高频的交易决策。从目前我们观察到的市场情况来看，已经具备一定规模的企业中，采用传统流程型软件的仍然比较多。</p>\n  <p>第三是交易策略。我们采用一种多市场、多产品协同交易的策略，即Revenue and Capacity Stacking。简单来说，就是在同一时间段内，根据不同市场的价格、容量和交付规则，同时参与多个电力市场的交易，而不是每个时段只选择一个市场。要实现这一策略，除了交易平台本身的能力，还需要底层能源管理系统（EMS）的配合。我们选择自研EMS，一个重要原因就是当时欧洲市场上常见的本土EMS产品普遍不支持我们需要的功率叠加功能。不同市场的交易产品有各自的功率曲线和交付要求，需要将多条曲线进行组合，同时满足各项约束，这对系统的控制和优化能力提出了很高要求。</p>\n  <p><strong>硬氪：公司目前已在欧洲10个国家布局电力市场准入，AI交易系统如何兼顾底层能力的跨市场复用与针对不同市场的本地化适配？</strong></p>\n  <p><strong>史耀宏：</strong>欧洲各国的电力市场正在逐渐走向统一。欧洲输电系统运营商网络（ENTSO-E）等机构推动了一系列共同标准，日前和日内市场也通过相应的市场耦合机制不断加强联动。总体来看，欧洲市场中有相当一部分规则和技术要求是共通的。</p>\n  <p>但由于各国电力系统的历史和能源结构不同，具体的市场规则仍然存在差异。因此，我们并不是用一套完全不变的模型直接覆盖所有国家，而是在统一的技术平台和核心能力之上，根据不同市场的规则进行适配。对于规则相近的区域，调整成本相对较低；对于差异较大的市场，则需要更多针对性的训练和算法迭代。</p>\n  <p>其中，日内市场的差异尤其值得关注。不同国家的化石能源、核电和可再生能源占比不同，电力供需的波动特征也会不同，这会影响价格预测所需的数据，以及模型训练和迭代的方式。我们的目标是在尽可能复用底层技术和交易能力的同时，针对各个市场的具体情况进行调整。</p>\n  <p><strong>硬氪：公司不是传统的数据中心开发商，为什么要布局Power-to-Compute？目前约120兆瓦的项目储备意味着什么？</strong></p>\n  <p><strong>史耀宏：</strong>我们一直希望围绕AI与电力的交叉点开展业务。最初，我们主要布局储能等灵活性资产，后来也拓展到光伏、风电等项目。随着AI基础设施发展，数据中心成为电力市场中越来越重要的变量。在欧洲，数据中心不仅需要绿电，也面临电网接入限制。如果不能提供一定的灵活性，并网审批和电力接入可能需要等待很长时间。我们希望把并网预认证、电力交易和自研EMS等能力应用到AIDC场景，让数据中心成为能够与电网协同的灵活性资产。</p>\n  <p>我们的定位是Power-to-Compute，即打通从电力到算力的链条，与合作伙伴共同推进从中高压电力接入、供配电到GPU功率控制的整合。约120兆瓦是我们目前在北欧储备的、具备土地和并网条件的项目规模，并不意味着这些数据中心已经全部建成或投入运营。下一步的关键，是把这些条件转化为能够实际交付的算力项目。</p>\n  <p><strong>硬氪：此次融资由宁德时代旗下基金独家投资？双方的合作会如何形成互补？</strong></p>\n  <p><strong>史耀宏：</strong>欧洲储能市场正在从单纯销售设备，向系统集成、工程交付、运维和电力交易等端到端服务转变。对客户而言，评价储能系统的价值，最终不能只看电池或设备性能，还要看它能否真正提高项目收益。</p>\n  <p>如果企业能够将设备、工程交付、运维和电力交易整合起来，就能更直接地对客户的实际收益负责。但对很多储能集成商来说，在欧洲建立自己的交易能力并不容易，因此与专业的电力交易公司合作，是一种可行的路径。我们与宁德时代的合作，建立在能力互补的基础上。宁德时代拥有更强的产业资源、客户基础和项目储备，我们的优势则在于电力交易、AI预测和储能资产运营，能够帮助客户进一步挖掘项目收益。</p>", "category": "tech", "published_at": "2026-10-30T02:10:29+00:00", "fetched_at": "2026-10-30T04:05:48.800155+00:00", "fingerprint": "ec5140eddf0eb265"}, {"source": "少数派", "title": "让 Agent 读懂你的身体：数据处理篇", "url": "https://sspai.com/prime/story/how-to-analyze-health-data-with-agent", "summary": "在上一篇文章《让Agent读懂你的身体：数据获取篇》中，我花了很大的篇幅讲清楚了第一个问题：Agent怎样拿到数据。如果照着实践完，你大概率已经收获了一份存储了运动健康数据的SQLite、Markdo ...<a href=\"https://sspai.com/prime/story/how-to-analyze-health-data-with-agent\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-10-29T03:29:46+00:00", "fetched_at": "2026-10-30T04:05:47.175783+00:00", "fingerprint": "8d0dab125ed60899"}, {"source": "少数派", "title": "如何成为不吃压力的「大心脏」？", "url": "https://sspai.com/post/117244", "summary": "适合别人的抗压方式为什么不适合自己？你也该知道的抗压方法论<a href=\"https://sspai.com/post/117244\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-29T09:05:38+00:00", "fetched_at": "2026-10-30T04:05:47.175779+00:00", "fingerprint": "c86651425583d4f6"}, {"source": "少数派", "title": "新玩意 254｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/117791", "summary": "编注：很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑部的新玩意」介绍编辑部成员们最近在用的新奇产品，让他们自己来谈谈这些新玩意的使用体验究竟如何。内容声明：《新玩意》栏目如含有 ...<a href=\"https://sspai.com/post/117791\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-29T09:26:58+00:00", "fetched_at": "2026-10-30T04:05:47.17 y": "tech", "published_at": "2026-10-28T21:57:45+00:00", "fetched_at": "2026-10-29T04:05:00.233579+00:00", "fingerprint": "b6ad05727112179f"}, {"source": "The Verge", "title": "Adam Mosseri says negativity around AI is ‘going to get worse’", "url": "https://www.theverge.com/ai-artificial-intelligence/1021644/adam-mosseri-instagram-ai-negativity", "summary": "Asked about AI and the trend of college students booing tech CEOs at graduation ceremonies, Instagram head Adam Mosseri acknowledged in an interview that a lot of people really don't like AI, and it's not just young people and creatives. Appearing on the Colin and Samir podcast to talk about the launch of widescreen and [&#8230;]", "category": "tech", "published_at": "2026-10-28T23:05:39+00:00", "fetched_at": "2026-10-29T04:05:00.233573+00:00", "fingerprint": "3b64f2126ca310fc"}, {"source": "The Verge", "title": "Anduril now says its BlueChip laptop will meet Buy American standards at launch", "url": "https://www.theverge.com/policy/1021554/anduril-bluechip-65-percent-domestic-buy-american", "summary": "On Tuesday, defense contractor Anduril and chipmaker Qualcomm announced a partnership to build laptops entirely in the United States, starting with a single model in 2027. They also announced a \"long-term goal\" of pushing the computer industry to create \"a fully domestic supply chain.\" Even a single Made-in-USA laptop would be a surprise, because no [&#8230;]", "category": "tech", "published_at": "2026-10-29T02:22:46+00:00", "fetched_at": "2026-10-29T04:05:00.233562+00:00", "fingerprint": "cfd5e9071be8aa35"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨服务长征、蓝箭、C919，这家特种运输车企业完成数千万元融资", "url": "https://36kr.com/p/4045129016382339?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2100字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，扬州伏尔坎机械制造有限公司（以下简称“伏尔坎”）近日完成数千万元融资，由投控东海（深投控）投资。</p>\n  <p>伏尔坎成立于2016年，是一家专注于多功能特种运输车辆研发与制造的企业，产品主要面向航空航天、军工、大型工程设备、化工罐体、精密仪器及风电设备等超限大件运输场景。公司同时布局日本市场，是国内唯一可实现特种运输车辆整车出口日本的企业。</p>\n  <p>火箭、飞机、风电叶片、光刻机，这些装备的运输看似属于物流环节，却对车辆的承载能力、振动控制、姿态稳定性和空间适应能力提出了极高要求。</p>\n  <p>伏尔坎总经理朱其安向硬氪介绍，公司主要围绕“五超”货物，即超高、超长、超宽、超重货物以及超精密仪器，提供定制化运输解决方案。与标准化商用车辆不同，这类产品通常需要从运输方案设计、底盘结构、液压系统到专用部件进行针对性开发，研发与生产环节都具有较高的定制化程度。</p>\n  <p>在超低与超重运输方面，伏尔坎的超低平板车货台最低可降至离地1厘米，以适应限高路段的通行要求；多功能组合运输车的承载能力最高可达800吨。针对更大吨位的重型装备，公司还布局了自行走模块化运输装备（SPMT），相关产品承载能力覆盖120吨至1000吨，可在不依赖牵引车的情况下自主行驶，并支持原地转向、远程遥控和智能故障检测。</p>\n  <p>超精密仪器运输则更考验车辆的减震与制动能力。以光刻机运输车为例，伏尔坎采用气囊减震设计及ECAS电控空气悬架系统，以降低路面不平带来的振动和冲击。此外，公司还通过多轴液压结构、电气控制和液压控制系统，实现车轴升降、平台自动调平等功能，配合随动转向、遥控主动转向等技术，提升车辆在复杂道路和狭窄空间内的通行能力。部分车型的车轮最大转向角度可达54度。</p>\n  <p>目前，伏尔坎的国内客户主要集中在航空航天领域。2024年，伏尔坎承担海南文昌发射中心长征八号火箭地面保障任务，实现国内首次火箭垂直公路运输。针对火箭直立运输的特殊要求，公司开发了配备液压调平系统、车架多点支承切换机构及安全报警系统的专用车辆，以改善轮轴负荷分配和整车稳定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_16d183ef6f1f4336adc9a34fc2dc6f4e@5920579_oswg1505813oswg1080oswg787_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>2025年，公司承担航天一院载人登月航天器箭体运输地面保障任务，并为蓝箭航天朱雀三号火箭提供长途运输车辆。后者针对直径达4.5米的箭体进行设计，已完成4000公里高速公路测试。车辆采用空气悬架系统降低路面振动，并通过模块化设计和多轴联动转向结构，适应不同箭体的运输需求。据介绍，该车型能够在满足相关通行条件的情况下，通过限高5米的路段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_b425b6b4ce574adca7c726cb53844791@5920579_oswg791774oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>航空领域，2025年，公司中标C919机翼及C909飞机运输项目。针对飞机机身转场，车辆采用凹形货台与可伸缩副车架结构，以适应不同运输状态下的车身宽度需求；货台配备升降机构，最低可降至接触地面，便于飞机部件装卸。同时，车辆通过牵引销上方的减震气囊吸收牵引车传递的振动，并设置防护结构，降低运输过程中外部飞溅物对机身的影响，目前正与欧洲空客公司共同研发飞机机翼运输设备。</p>\n  <p>相比国内市场，日本市场是伏尔坎另一块重要业务来源。据朱其安介绍，日本市场目前约占公司业务的50%左右，日本相关车辆年需求量约为500台左右。</p>\n  <p>朱其安表示，日本在超高、超宽、超长、超重货物的运输环节有较严格的运输管理，普通车辆难以满足相关要求，专业特种运输车辆因此形成较为稳定的需求，工程机械，精密仪器和风力设备是当地特种运输车辆的重要应用场景。</p>\n  <p>此外，公司同时承担全球其他市场的散单销售，包括东南亚、南美、欧洲及中东地区。</p>\n  <p><strong>以下为硬氪与朱其安交流节选：</strong></p>\n  <p><strong>硬氪：特种运输车辆的技术要求与普通运输车辆有很大差异，公司如何根据不同货物的特点进行定制化设计？</strong></p>\n  <p><strong>朱其安：</strong>我们的产品主要面向“五超”货物。不同货物的运输要求差异���大，比如光刻机内部有大量精密元器件，对运输过程中的振动和冲击非常敏感；火箭采用直立式运输时，则需要重点控制车辆的振幅、平衡和整体稳定性，避免运输过程中出现过大晃动。</p>\n  <p>因此，我们需要根据货物的尺寸、重量、结构和运输姿态，对车辆的承载能力、减震系统、液压结构、转向和自动调平功能进行针对性设计。超重运输重点解决承载、升降和转向问题，精密仪器运输则更关注减震和制动缓冲。我们提供的不只是车辆，还包括从运输方案构思、结构设计到专用部件定制和整车生产的一整套解决方案。</p>\n  <p><strong>硬氪：您认为特种运输车辆行业的核心竞争壁垒是什么？</strong></p>\n  <p><strong>朱其安：</strong>我认为主要有几个方面。</p>\n  <p>第一是客户积累和市场判断能力。这个行业的订单存在不确定性，如果不能持续深耕市场，没有稳定的客户资源和长期的行业积累，就很难判断未来的订单需求。</p>\n  <p>第二是定制化研发与工程能力。即使是同一个客户，每次需要运输的货物也可能不同，企业需要从方案设计、零部件定制到整车生产，具备完整的工程实施能力。这要求技术团队拥有足够的行业经验，能够根据货物特点主动提出解决方案。</p>\n  <p>第三是功能技术和专利积累。由于车辆变形程度高，车辆的升降、转向、自动调平、车身拓宽和延长等功能，都涉及具体的机械结构与控制技术，需要通过长期研发积累形成技术壁垒。</p>\n  <p>第四是成本控制和生产资质。专用车辆涉及大量非标零部件，生产损耗和项目成本与标准化产品存在明显差异。企业需要了解不同项目的成本构成和盈利边界，才能在承接订单时做好成本测算。同时，生产企业还需要具备相应的专用车生产准入资质。这些条件共同构成了行业的进入门槛。</p>", "category": "tech", "published_at": "2026-10-28T05:58:42+00:00", "fetched_at": "2026-10-29T04:05:00.167737+00:00", "fingerprint": "5936938f92794e52"}, {"source": "36氪 - 最新文章", "title": "在25万人的纽约漫展，一家中国公司排起了长队", "url": "https://36kr.com/p/4045364265358471?f=rss", "summary": "<p>在刚刚过去的10月21日至23日，第二十四届上海玩具展如期举行。</p>\n  <p>23万平方米的展馆里，2700多家展商、5400多个品牌一字排开，拖着样品箱的海外买家超过1万人。</p>\n  <p>而在本次玩具展上，还出现了一位专程赶来的苏格兰小马宝莉粉丝——他几乎集齐了所有小马宝莉卡牌，正计划申请吉尼斯世界纪录。这样的场景，放在十年前很难想象。中国卡牌，也正在出现在越来越多海外展会的展台与货架上。</p>\n  <p>上海玩具展如此热闹。那么几乎同期，在大洋彼岸、全球流行文化的腹地——刚刚落幕的纽约漫展，又是怎样的景象？</p>\n  <h2><strong>在美国漫展排起长队</strong></h2>\n  <p>10月8日至11日，曼哈顿已经转凉，但因纽约动漫展（NYCC），Javits中心是另一重热度。</p>\n  <p>今年恰逢NYCC二十周年，主办方把主题定成了纽约人自己的游乐场——康尼岛（Coney Island）。周五到周日的门票提前售罄，四天里，约25万人涌入这座玻璃展馆，打扮成各式角色的观众，成了曼哈顿西区街头最显眼的风景。</p>\n  <p>二十年前，也就是2006年，第一届NYCC的观众只有3万人。二十年，翻了八倍。但增长的不只是人数。今年嘉宾的出席阵容堪称豪华：尼古拉斯·凯奇、海登·克里斯滕森等影星登台，《火影忍者》的声优竹内顺子与杉山纪彰现身周六的活动，《龙珠超》新作选择在这里举行全球首映。</p>\n  <p>怎么解释这种热度？主办方ReedPop的市场总监Fallon Prinzivalli给了一个很“反互联网”的答案：“在这个数字时代，我们反而要面对面聚在一起——线上刷得再多，也比不上现场的能量。”</p>\n  <p>不过，走进展馆才会发现另一层变化。在超级英雄与绝地武士的展台之间，亚洲IP、卡牌与收藏玩具的浓度，正肉眼可见地变高。过去，这里是好莱坞与美漫的绝对主场。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_4929d97ab267457b85b1afddb57b4e74@1267484143_oswg1462434oswg1034oswg790_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这背后是一个更大的产业事实：2024年，中国已经超过美国和日本，成为全球最大的集换式卡牌市场。某种意义上，中美两大市场，在NYCC的展馆里正面相遇。</p>\n  <p>而相遇最具体的发生地，是1143号展位。这个展位前的队伍，排得不比任何一家好莱坞展台短。但队伍里的人等的不是明星，也不是签名——他们在等一场“教学”，教他们的，是一家中国公司卡游（KAYOU）。</p>\n  <p>在后期的上海玩具展，那位专程赶来的苏格兰粉丝想要集齐的，也正是卡游出品的小马宝莉卡牌。至此，从纽约到上海，卡游的展位前集齐了来自全球各地的同一类人群——他们对某一IP充满热爱，并愿意为一张卡片倾注时间与精力。</p>\n  <h2><strong>粉丝也是参与者，卡牌的生态变了</strong></h2>\n  <p>那么，又应该如何理解卡游这家公司？</p>\n  <p>卡游是中国集换式卡牌行业的头部企业。<strong>招股书显示，2024年，卡游的营收100.57亿元，经调整净利润44.66亿元，国内集换式卡牌市占率71.1%。</strong></p>\n  <p>而本年度，是卡游第二次参加NYCC。如果说2025年首登纽约时，它的任务是“被认识”，2026年再来，展位的动作变了：不再只是展示，而是“教美国粉丝怎么玩”。</p>\n  <p>据介绍，卡游在现场开设了TCG教学，粉丝可以在展位上直接学玩《小马宝莉》集换式卡牌。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_6bb835132d624a89be504cf02e643b67@1267484143_oswg1304010oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>漫展首日，卡游抢先预览了2027年《小马宝莉》第六辑“月亮版”、明年1月发售的“闪耀版”，以及明年面世的迷你卡；同日举办的粉丝文化论坛上，孩之宝全球消费者营销高级经理Claire O'Sullivan、《小马宝莉》官方插画师Andy Price 与卡游团队同台。</p>\n  <p>值得关注的是，论坛上落地的粉丝共创活动“Chase the Magic”，这算是这届NYCC最有人情味的一幕之一——卡游通过抽奖，邀请一位粉丝设计一匹属于自己的小马。中奖者David Abdelmaseih与女儿共同设计的“Banannie Bloom”，被官方采纳，成为真正的卡牌角色。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_d4cffa581fd1471ebb103eb6e558160f@1267484143_oswg95267oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>Abdelmaseih夫妇从十几岁就开始集卡，如今用卡牌带女儿入坑。</p>\n  <p>“这匹小马是我们全家一起设计的。它是一匹陆马，因为我们想告诉小朋友：看见这个世界的美好，不需要魔法——因为世界本身已经足够美。”他说，孩子们最喜欢的，就是“爸爸妈妈当年有，现在我们也有”的东西。“从今往后，她们一生都会拥有一匹属于自己的小马。”</p>\n  <p><strong>对卡游而言，Chase the Magic不是一次抽奖营销，而是“面向核心粉丝做体验式运营”的样本，也是其“收藏策略”的关键一环：粉丝在这里不只是消费者，而是参与者，甚至是产品的共同作者。</strong></p>\n  <p>今年10月的上海玩具展上，卡游相关负责人曾系统阐述过这套策略：依托制造工艺与设计整合能力，提升单卡的收藏价值；以“Collect到Co-create”的生活方式链路扩展消费场景，从收藏起步，逐步走向用户参与的内容共创，产品边界则从传统卡牌延展到日常生活场景。</p>\n  <p>说得直白些：卡牌只是入口，不是终点。一<strong>张几块钱的卡，把消费者带进第一层——Collect，一个低门槛的收藏入口。</strong></p>\n  <p>第二层是“让收藏有地方去”，这也是“生态”二字真正的体现。</p>\n  <p>卡牌买回家，如果只是塞进抽屉，就是一次性买卖。所以卡游把链路往后接，推出了可穿戴卡牌配件、穿戴饰品、展示类卡牌衍生品、迷你卡等产品形态，让卡牌被戴在身上、摆在桌上，融入粉丝的日常穿搭。</p>\n  <p>再以《KPop猎魔女团》为例，卡游用迷你收藏卡、可穿戴卡牌配件和穿戴饰品，把卡牌从“收藏品”做成了“可展示的潮流配饰”。粉丝可以把喜欢的角色卡挂在包上、配进穿搭，卡牌随之变成一种可以在社交平台上分享的粉丝身份表达。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_f8c2701fed634e73a48d3b4c4d6938b9@1267484143_oswg102964oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>上海玩具展上，卡游相关负责人同样表示，公司正从传统卡牌延展至穿戴类饰品、展示类卡牌衍生品等创新品类，让卡牌的收藏属性与佩戴、观赏、日常使用等场景相融合。从粉丝的角度，<strong>收藏品的一半价值在于“被看见”，而卡游把“被看见”做成了产品。</strong></p>\n  <p>第三层是Co-create。Chase the Magic式的官方共创，加上社区里的交换、晒卡与二次创作，把单向的买卖关系，变成持续互动的关系。这条“Collect到Co-create”的链路一旦跑通，复购和社区黏性，就不再是问题。</p>\n  <h2><strong>闯美一年，愿景变现实</strong></h2>\n  <p>实际上，卡游在美国市场的存在感，绝不仅限于漫展上的排队人潮。</p>\n  <p>一个月前的2026洛杉矶玩具展，卡游在the Toy Building设立展厅，接待北美的经销商、零售商与授权方；展后的一场邀约制行业聚会，则把商业沟通变成了高质量的行业交流与市场验证场景。</p>\n  <p>产品层面，2026年5月，《小马宝莉》TCG已在北美全面发售；品类则从卡牌延展至穿戴类饰品、展示类卡牌衍生品、文具和立体玩具。</p>\n  <p>更硬的认证来自第三方：专业数据统计机构Circana的数据报告，卡游在美国市场的销售体量已入围美国玩具市场前50。<strong>从2025年9月正式宣布进入美国市场算起，这一切发生在一年之内。</strong></p>\n  <p>当然，美国市场本身并不缺少强敌——宝可梦、万智牌在这里经营了数十年。手握弹药的同时，卡游也在布局未来。</p>\n  <p>据介绍，卡游的国内授权IP有100多个，海外授权IP为十几个。2026年，海外独占授权的《魔鬼大卡车》（Monster Jam）与《魔法俏佳人》带来新的增长预期；进入2027年，《无敌少侠》《刺猬索尼克》《JOJO的奇妙冒险》《魔法少女小圆》将陆续加入——这些IP分别触达游戏玩家、超级英雄受众、动漫社群与成人藏家。</p>\n  <p>渠道的铺设也很“美式”，这一年来，卡游先后进入沃尔玛、亚马逊、Target、GameStop、Barnes &amp; Noble等主流零售终端。线上渠道，则通过TikTok Shop和直播电商品牌Crossing触达用户。</p>\n  <p>这正是卡游出海路径的核心：不是把中国的内容卖到海外，而是拿着中国打磨成熟的产业链与玩法，去运营全世界的IP，再把这套收藏生活方式卖回给全世界。</p>\n  <p>更关键的是，卡游在“IP创造”上也在落子。上海玩具展上，其自有艺术家品牌 OYYO旗下三款原创IP同场展出：甜酷双子星Hari &amp; Hacci已延展至毛绒、盲盒、配饰，森林小毛怪Weirdolls与治愈系小女孩Otti也将以多种产品形式推向全球市场。从“IP引进”到“IP创造”，卡游不想只做授权IP的运营者。</p>\n  <p>聚焦美国市场，卡游接下来的动作可以归纳为四件事：</p>\n  <p>一是IP拓展，2027年新IP陆续落地，《小马宝莉》第六辑与迷你卡上市；</p>\n  <p>二是渠道深耕，在已进入的主流零售基础上继续加密，TCG赛事与线下活动走向体系化；</p>\n  <p>三是品类扩张，重点发力穿戴类与展示类卡牌衍生品；</p>\n  <p>四是形态结合创新，让卡牌与穿戴、展示、文具、立体玩具等品类互相嵌合，不断扩展收藏生态的边界。洛杉矶玩具展式的“展厅＋邀约制行业聚会”，也将成为固定的行业沟通场景。</p>\n  <p>最后把卡游放进中国玩具出海的坐标系，它的独到之处会更加清楚。</p>\n  <p>乐高式的出海是“因地制宜”——为每个市场匹配本土IP故事，用IP给产品加价；泡泡玛特式的出海是“渠道先行、爆款外溢”——把国内验证过的爆款铺向全球门店。</p>\n  <p><strong>卡游走出了第三条路：它不只是把货铺出去，而是用中国的产业链和收藏体系设计能力，运营全世界的IP，再用“Collect到Co-create”的收藏生态，把粉丝从买家变成参与者。</strong></p>\n  <p>一直以来，卡游的愿景都是“把全球粉丝的热爱，转化为可收藏、可展示、可穿戴、可社交、可共创的生活方式”。闯美一年，也依托卡游原创性的出海逻辑与收藏生态战略，这个愿景正在变成现实。</p>\n  <p>消费者会怎么选择？纽约漫展的排队人群已经给出了答案。</p>\n  <h4>*免责声明：</h4>\n  <h4>本文内容仅代表作者看法。&nbsp;</h4>\n  <h4>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</h4>", "category": "tech", "published_at": "2026-10-28T09:59:42+00:00", "fetched_at": "2026-10-29T04:05:00.167730+00:00", "fingerprint": "20fd908b22803d59"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨姆巴佩中国代言收入近2200万欧元；长鑫科技已被纳入上证指数；宇树科技：前三季度净利润3.87亿元，同比增长270.54%", "url": "https://36kr.com/p/4046203581289345?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>特朗普将“正式禁用”AI一词</p>\n  <p>泡泡玛特回应业绩大跌，管理层称高基数叠加“炒娃降温”</p>\n  <p>iPhone Duo首次支持Apple Pencil，仅限USB-C款且需有线配对</p>\n  <p>海力士DRAM到2029年产能已售罄</p>\n  <p>小鹏机器人固态电池小批量量产</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>姆巴佩中国代言收入近2200万欧元，占商业总收入38%</strong></p>\n  <p>姆巴佩涉华不当言论事件爆发后，中国市场在不到24小时内完成品牌解约、平台清退的全链条动作，这一过程不仅在国内引发强烈反响，也迅速进入全球主流媒体的报道视野，不同定位的国际媒体从商业、体育伦理、公众人物责任等多个维度展开讨论，让这起事件成为全球体育商业领域极具标志性的反面案例。</p>\n  <p>英国《金融时报》第一时间将这起事件定性为“顶级体育明星触碰区域市场红线的典型失误”。报道中专门算了一笔账：姆巴佩此前在中国市场的年度代言收入接近2200万欧元，占他个人全球商业总收入的38%，这次多家头部品牌集体解约，直接让他损失了近四成的稳定商业收入，且后续几乎没有任何挽回的可能。(光明日报)</p>\n  <p><strong>长鑫科技已被纳入上证指数</strong></p>\n  <p>根据中证指数公司网站，长鑫科技已被纳入上证综合指数，权重为4.67%，当前为指数第一大权重股。农业银行、工商银行位于第二、三位，权重占比为3.83%和3.77%。长鑫科技也被纳入上证科创板综合指数，权重为15.74%，也为第一大权重股。根据编制方案，权重因子于每月第二个星期五的下一交易日或新计入样本权重超过15%时调整。（第一财经）</p>\n  <p><strong>宇树科技：前三季度净利润3.87亿元，同比增长270.54%</strong></p>\n  <p>36氪获悉，宇树科技交出上市后首份业绩报告。2026年第三季度营业收入6.65亿元，同比增长69.93%；归母净利润1.13亿元，同比下降17.37%。2026年前三季度营业收入18.17亿元，同比增长55.71%；归母净利润3.87亿元，同比增长270.54%；研发费用同比增长191.48%，主要来自模型研发和算力投入的大幅增长。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>特朗普将“正式禁用”AI一词</strong></p>\n  <p>美国总统特朗普27日在社交媒体“真实社交”发文，表示将很快在“所有相关文件”及其他场合“正式禁止”使用“人工智能（AI）”一词，理由是这一表述“不准确”。不过，帖文中没有具体说明禁令将如何落实。他在帖子中还点名批评美国《华尔街日报》，称后者仍在使用“非常糟糕和不准确”的“人工智能”称谓。</p>\n  <p>特朗普9月29日签署行政令，将“人工智能”改称为“超级智能”。10月4日，他在社交媒体宣布组建“超级智能工作组”，任命包括国家情报总监杰伊·克莱顿在内的领导团队。特朗普表示，该工作组的使命是协调联邦政府的各项工作，“确保美国在超级智能领域继续保持全球领先地位”。（第一财经）</p>\n  <p><strong>豆包工作电脑操作能力升级：Mac锁屏后可继续执行任务</strong></p>\n  <p>10月28日，记者从豆包方面获悉，近期，豆包工作电脑操作能力升级，屏幕点击精度、速度提升，更准、更快。用户在对话中直接提出操作电脑的相关需求，经授权后，豆包工作可自动查看电脑屏幕，模拟人工鼠标和键盘操作相关应用。</p>\n  <p>在任务执行方面，用户可进入“设置→工作任务模式设置”，开启“允许豆包在锁屏时工作”。启动该功能并经过用户授权后，豆包工作可在Mac锁屏时继续执行需要操作的电脑任务。用户离开电脑时，还可以通过手机向这台锁屏的Mac下达任务，并在手机上查看返回结果。使用时，Mac需保持开机、联网，豆包客户端持续运行，设备保持唤醒。(上海证券报)</p>\n  <p><strong>智元GO-3 Nano Preview登顶RoboTwin，平均成功率85.01%</strong></p>\n  <p>36氪获悉，近日，RoboTwin公布的最新榜单显示，智元GO-3 Nano Preview以85.01%的平均成功率位列第一。公开资料显示，RoboTwin主要考察复杂场景下的双臂协同操作与环境泛化能力，通过不同场景和任务设置，评测模型在目标识别、动作协调及环境变化适应等方面的表现。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>泡泡玛特回应业绩大跌，管理层称高基数叠加“炒娃降温”</strong></p>\n  <p>针对第三季度业绩大幅下滑，泡泡玛特在业绩电话会上进行了详细回应。首席运营官司德将业绩下滑归因于2025年同期异常的高基数与二手市场“炒娃”热度的回落。他指出，去年三季度是公司历史上单季销售最高的季度，业务集中爆发导致今年同比压力巨大，且去年三季度线上渠道因抢购和炒货热度极高，基数异常偏高；今年二级市场炒娃热度明显回落，这是线上渠道下滑幅度更大的最主要原因。</p>\n  <p>面对业绩压力，公司明确了“保品牌、不打价格战”的应对基调。司德在电话会上明确表示，公司不会用大额满减或打折去拉动线上销量，线上重心将回归正常零售，弱化炒货属性；目前公司库存水位已自8月开始回落，9月底已呈明显下降趋势，管理层强调“暂时不会做大规模的促销活动”。(界面新闻、每日经济新闻)</p>\n  <p><strong>OpenAI据悉计划采购谷歌AI芯片，进一步降低对英伟达的依赖</strong></p>\n  <p>10月27日，OpenAI据悉正计划采购谷歌自主研发的人工智能芯片，以扩大算力规模并实现芯片供应来源多元化。此次潜在交易涉及谷歌张量处理单元（TPU），但双方尚未确定最终协议条款。随着AI模型训练和推理需求持续增长，OpenAI正在寻求英伟达GPU之外的算力来源，同时与博通合作开发代号为“Jalapeno”的自研AI芯片，进一步完善其算力供应体系。（新浪财经）</p>\n  <p><strong>iPhone Duo首次支持Apple Pencil，仅限USB-C款且需有线配对</strong></p>\n  <p>根据苹果官方说明，iPhone Duo首次支持Apple Pencil，但目前仅支持Apple Pencil（USB-C），首次配对还需要通过USB-C线缆连接。相比iPad上更加成熟的手写笔体验，iPhone Duo的支持范围明显有限。考虑到它拥有7.6英寸内屏，手写批注和绘画确实有一定使用空间，但目前的配对方式多少有些不够方便。（财联社）</p>\n  <p><strong>韩国KOSPI指数收涨6.63%，SK海力士涨近11%</strong></p>\n  <p>10月28日，日经225指数收涨1.08%，报63954.19点；韩国KOSPI指数收涨6.63%，报6012.44点。其中，SK海力士涨近11%，三星电子涨超9%。(财联社)</p>\n  <p><strong>豆包否认“横店与字节合作将15万群演肖像声音喂给大模型”</strong></p>\n  <p>10月28日，豆包公关负责人刘星发文称，“横店与字节合作，将15万名群演的肖像和声音喂给字节大模型”的传言严重失实。刘星表示，横店影视AI服务平台项目，其实是希望建设一套公共数字基础设施，把影视基地实景等资产做成高质量数据集，帮助剧组更高效地选景、筹备和拍摄，也降低中小影视企业使用AI的门槛，让更多创作者有条件把作品做好。火山引擎在该项目中是技术支持方，所有数据资产，都归横店或授权方所有。这个项目涉及到任何人的肖像和声音使用，肯定都需要获得本人的授权。本项目的数据也不会用于训练字节大模型。(财联社)</p>\n  <p><strong>知名“牛散”章建平夫妇重仓二股，三季度新进东材科技与方正科技</strong></p>\n  <p>随着三季报披露，知名“牛散”章建平及其妻子方文艳的最新持仓动向浮出水面。与半年报相比，章建平新进成为东材科技（601208.SH）第三大股东，持股2974.73万股，占总股本2.94%；方文艳新进成为方正科技（600601.SH）第七大股东，持股4069.94万股，占总股本0.92%。</p>\n  <p>据不完全统计，除上述两只新进标的外，章建平三季度还增仓了云南锗业，方文艳则同时新进了华正新材（持股4.96%）和科翔股份（持股1.63%）。夫妇二人的调仓路径，整体指向了AI算力硬件上游的电子材料与PCB环节。(财联社、每日经济新闻)</p>\n  <p><strong>科创板首只市值股退市</strong></p>\n  <p>*ST卓然(688121.SH)公告称，公司于2026年10月28日收到上交所下发的《终止上市事先告知书》。因公司股票已连续20个交易日每日收盘市值均低于3亿元，触及终止上市情形，上交所将按规定对公司股票作出终止上市决定。公司可在收到通知后5个交易日内申请听证。</p>\n  <p>*ST卓然将成为科创板首只市值退市股，截至28日收盘，*ST卓然股价为0.40元，总市值9345万元，已不足1亿元。(财联社)</p>\n  <p><strong>IDC：2029年60%的企业多数业务流程将AI优先，2026年仅为13%</strong></p>\n  <p>36氪获悉，国际数据公司（IDC Research, Inc.，简称IDC）预测，到2029年，60%的全球2000强（G2000）企业将让多数业务流程以AI优先的方式运行。IDC同时预测，到2028年，70%的全球2000强企业（G2000）将具备持续验证AI智能体决策的能力，而目前这一比例仅为14%。</p>\n  <p><strong>小鹏机器人固态电池小批量量产</strong></p>\n  <p>小鹏集团副总裁顾捷表示，小鹏IRON机器人固态电池已小批量量产下线，机器人目前处于SOP前的阶段。在2025年小鹏科技日上，官方宣布全新一代人形机器人IRON将在行业内首次应用全固态电池。该公司计划于2026年底实现高阶人形机器人的规模化量产，并预计从2027年起陆续进驻全球小鹏门店及商业场景，承担导购、讲解等服务。（第一财经）</p>\n  <p><strong>美联储宣布维持利率不变</strong></p>\n  <p>美国联邦储备委员会28日结束为期两天的货币政策会议，宣布将联邦基金利率目标区间维持在3.75%至4%不变。这一决定符合市场此前广泛预期。（央视新闻）</p>\n  <p><strong>主力资金监控：宁德时代净卖出超9亿</strong></p>\n  <p>盯盘数据显示，10月28日主力资金净流入电子、通信、半导体等板块，净流出电新行业、非银金融、有色金属等板块，其中电子板块净流入117.16亿元。个股方面，中际旭创资金净买入22.91亿元位居首位，兆易创新、新易盛、工业富联主力资金净流入居前；宁德时代遭净卖出9.71亿元位居首位，五粮液、西安奕材-U、源杰科技主力资金净流出额居前。(财联社)</p>\n  <p><strong>Anthropic拟向散户分配最多20%的IPO股份，摩根大通负责美国市场认购</strong></p>\n  <p>人工智能公司Anthropic正考虑将首次公开募股（IPO）发行股份的15%至20%分配给个人投资者，并已选定摩根大通负责美国市场的散户认购业务。按照此前投资者提出的估值预期，Anthropic上市估值可能达到1.4万亿至1.5万亿美元，最高甚至达到1.75万亿美元，有望成为全球规模最大的科技企业IPO之一。（新浪财经）</p>\n  <p><strong>韩国因强制应用内支付对谷歌、苹果合计罚款637亿韩元</strong></p>\n  <p>据报道，韩国媒体与通信委员会（KMCC）发表声明称，韩国监管机构因谷歌和苹果涉嫌强制应用内支付，对其合计处以637亿韩元罚款。其中，谷歌被罚429亿韩元；苹果被罚208.1亿韩元。监管机构认定，这两家运营商实施了《电信业务法》所禁止的行为，并决定发出纠正令，要求其修改业务程序。（界面新闻）</p>\n  <p><strong>A股震荡反弹超4100股上涨，物理AI与存储芯片全线爆发</strong></p>\n  <p>10月28日，A股三大指数震荡反弹，创业板指表现强势，盘中一度涨超3%。截至收盘，沪指涨0.71%，深成指涨2.15%，创业板指涨3.12%，全市场超4100只个股上涨。沪深两市成交额达1.98万亿元，较上一个交易日显著放量。</p>\n  <p>盘面上，科技成长主线全线反攻。物理AI与机器人概念掀涨停潮，福莱新材8天5板创历史新高，安培龙、伟创电气等多股20CM涨停；存储芯片方向受隔夜SK海力士业绩超预期及美股存储股大涨催化，长鑫科技、兆易创新、佰维存储等集体走强；算力硬件与CPO概念同步回暖，中际旭创、新易盛涨幅居前。此外，创新药板块午后异动拉升，常山药业、博瑞医药领涨。(证券时报、财联社)</p>\n  <p><strong>宝马正在推进星闪数字钥匙方案，预计于2030年上车</strong></p>\n  <p>记者从知情人士处获悉，宝马正在推进星闪数字钥匙方案，意向由意法半导体、恩智浦供应兼具蓝牙、星闪的多模芯片，用于车辆无感解锁，并计划2030年上车。(蓝鲸新闻)</p>\n  <p><strong>海力士DRAM到2029年产能已售罄</strong></p>\n  <p>近日，SK海力士表示，DRAM和HBM到2029年的产能已全部售罄。</p>\n  <p>SK海力士总裁兼CEO郭鲁正在财报会上透露，截至目前，SK海力士已经和包含全球头部云服务商在内的14家核心客户签署长期协议（LTA）。已经敲定的LTA订单，叠加当前和客户正在磋商的需求，“未来三年直至2029年，我们的DRAM以及HBM产能实际上已经近乎售罄。”公司判断，内存供需紧张格局或将延续至2030年，同时公司也将采用弹性投资节奏防范周期风险。(财联社)</p>\n  <p><strong>恒生指数公司表示将Anthropic纳入恒生港美科技指数</strong></p>\n  <p>36氪获悉，恒生指数公司公告，恒生港美科技指数的编算方法调整，将于截至2026年9月30日之指数检讨中采用，相关的成份股变动将于2026年12月14日（星期一）生效。指数名称及指数代码将维持不变。此外，Anthropic(ANT.O)将加入指定美国上市成份股名单。此变更将以Anthropic确认上市作实。9只美国上市成份股的比重将于Anthropic的第7个交易日收市后重新计算至等权重，新增成份股和更新后的成份股比重将于Anthropic的第11个交易日生效。</p>\n  <p><strong>泡泡玛特遭南向资金净卖出6.55亿港元</strong></p>\n  <p>南向资金净卖出8.04亿港元，泡泡玛特、长飞光纤光缆、建滔积层板分别遭净卖出6.55亿港元、2.88亿港元、1.45亿港元。净买入方面，智谱、中芯国际、中国海洋石油净买入额位列前三，分别获净买入5.55亿港元、5.33亿港元、4.87亿港元。（第一财经）</p>\n  <p><strong>美国司法部就英伟达收购Hugging Face展开问询</strong></p>\n  <p>美国司法部已就英伟达收购开源平台Hugging Face的交易将如何影响人工智能领域的竞争展开问询，与此同时，反垄断执法部门仍在推进对这家芯片设计公司行为的多年调查。司法部近期的问询涉及英伟达的收购、投资和销售行为，以及该公司是否曾向客户施压。对于Hugging Face交易，司法部官员询问，这笔收购是否会让英伟达掌控AI领域一个基础性的分发渠道。（新浪财经）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，10月28日收盘，美股三大指数集体上涨，纳指涨0.27%，道指涨0.19%，标普500指数涨0.28%。大型科技股涨跌不一，SK海力士涨超13%，甲骨文涨超10%，闪迪涨超7%，英特尔、谷歌涨超1%，亚马逊小幅上涨；Meta、英伟达跌超1%，苹果、奈飞、特斯拉、微软小幅下跌。热门中概股多数下跌，新东方跌超12%，腾讯音乐、哔哩哔哩、知乎、网易、名创优品、老虎证券、拼多多跌超1%；百度、理想汽车涨超1%。</p>\n  <p><strong>美国商品期货交易委员会拟将交易商持仓报告发布频率提高至每周两次</strong></p>\n  <p>当地时间10月27日，美国商品期货交易委员会（CFTC）主席迈克尔·塞利格宣布，计划于2026年底前将交易商持仓报告（COT）发布频率从每周一次提高至每周两次。根据新安排，周一数据将于周三发布，周三数据将于周五发布，发布时间均为美国东部时间下午3时30分。此举将报告数据的发布滞后时间从3天缩短至2天，以便市场参与者更及时地了解农业市场交易头寸及活动情况。委员会正通过系统现代化和自动化推进相关工作。（界面新闻）</p>\n  <p><strong>韩国监管部门调查Bithumb信息泄露事件，称尚未发现用户信息遭泄露</strong></p>\n  <p>10月28日，韩国金融委员会表示，已联合金融监督院、金融安全院及数字资产交易所联合协会等机构，就Bithumb等主要虚拟资产服务商遭遇网络攻击召开紧急检查会议。Bithumb报告称，发现员工及子公司、合作企业员工信息可能遭泄露，目前仍在核查用户信息是否受影响；遭入侵的是员工办公支持系统，尚未发现涉及虚拟资产钱包地址等可能被用于非法支付或转移资产的信息泄露。监管部门已启动现场调查，并表示将加强跨机构协作和消费者保护，同时研究强化虚拟资产行业等领域的网络安全措施。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>摩尔线程：前三季度营收32.89亿元，同比增319.15%</strong></p>\n  <p>36氪获悉，摩尔线程公告，2026年第三季度实现营业收入15.52亿元，同比增长1773.92%；归母净利润4926.04万元，扣非归母净利润2007.24万元，均实现扭亏为盈。2026年前三季度实现营业收入32.89亿元，同比增长319.15%；归母净利润3769.73万元，扣非归母净亏损1.31亿元，亏损大幅收窄。前三季度研发投入13.40亿元，同比增长55.72%，营收增长主要系智算产品在AI算力基础设施行业加速落地。</p>\n  <p><strong>梅赛德斯-奔驰：第三季度营收307亿欧元</strong></p>\n  <p>36氪获悉， 梅赛德斯-奔驰集团股份公司公布2026年第三季度财报。第三季度营收307亿欧元，上年同期营收321亿欧元；集团息税前利润17.7亿欧元，上年同期息税前利润7.5亿欧元；净利润15.2亿欧元，上年同期净利润11.9亿欧元。报告息税前利润的增长主要反映了较上年同期调整额的降低。经调整后的集团息税前利润下降15%至17.8亿欧元。</p>\n  <p><strong>谷歌第三季度营收1275.8亿美元，低于预估的1279.3亿美元</strong></p>\n  <p>谷歌第三季度营收1275.8亿美元，同比增长25%，预估1279.3亿美元；服务收入963.0亿美元，同比增长11%，预估984亿美元；广告营收820.1亿美元，同比增长11%，预估835.7亿美元；云收入307.1亿美元，上年同期151.6亿美元，预估291亿美元；其他业务营收3.72亿美元，同比增长8.1%，预估3.878亿美元；每股收益2.12美元，上年同期2.87美元；经营利润405.8亿美元，同比增长30%，预估431.6亿美元；营业利益率32％，上年同期31％，预估33.7％；资本支出513.6亿美元，上年同期239.5亿美元，预估557.8亿美元。（财联社）</p>\n  <p><strong>中国电影：第三季度净利润7228.86万元，同比下降59.10%</strong></p>\n  <p>36氪获悉，中国电影公告，2026年第三季度营业收入10.79亿元，同比下降10.97%；净利润7228.86万元，同比下降59.10%。2026年前三季度营业收入25.91亿元，同比下降11.53%；净利润亏损3777.09万元，扣非净利润亏损1.84亿元。</p>\n  <p><strong>三只松鼠：第三季度净利润757.44万元，同比下降65.99%</strong></p>\n  <p>36氪获悉，三只松鼠公告，公司第三季度营业收入20.42亿元，同比下降10.48%；归母净利润757.44万元，同比下降65.99%。前三季度营业收入73.22亿元，同比下降5.63%；归母净利润2.57亿元，同比增长59.71%。</p>\n  <p><strong>LG电子第三季度营收23.82万亿韩元，同比增长8.9%</strong></p>\n  <p>LG电子修正第三季度业绩数据。公司第三季度营收为23.82万亿韩元，同比增长8.9%；营业利润为7819亿韩元，同比增长13.5%；归母净利润为6632亿韩元，同比增长72.2%。前三季度，公司累计营收为71.38万亿韩元，同比增长9.2%；营业利润为4.03万亿韩元，同比增长55.9%；归母净利润为2.15万亿韩元，同比增长20%。（界面新闻）</p>\n  <p><strong>中国太保：第三季度净利润收入794.28亿元，同比下降68.4%</strong></p>\n  <p>36氪获悉，中国太保公告，前三季度实现营业收入2915.64亿元，同比下降15.5%；归属于上市公司股东的净利润364.03亿元，同比下降20.3%。第三季度营业收入794.28亿元，同比下降45.0%；归属于上市公司股东的净利润56.28亿元，同比下降68.4%。</p>\n  <h2>投融资</h2>\n  <p><strong>“百奥几何”完成1亿美元A轮系列融资</strong></p>\n  <p>36氪获悉，近日，AI Native生物制药公司“百奥几何”宣布完成A+轮融资。至此，公司A轮系列融资超1亿美元。本轮融资由国寿资本领投，老股东上海生物医药基金再度加码。国开科创、瑞力投资、国方创投及头部生物医药产业方等多家机构跟投，老股东达晨财智持续加注，指数资本继续担任独家财务顾问。本轮融资将重点用于GeoFlow（分子水平）与GeoCell（细胞水平）两大微观世界模型的持续迭代、高通量自动化实验室扩建和自研药物管线的商业化落地。</p>\n  <p><strong>“派阑昆微”连续完成两轮融资</strong></p>\n  <p>36氪获悉，近日，光互连企业“派阑昆微”连续完成两轮融资，累计融资数亿元人民币。第一轮由隆湫资本（LP为锐捷网络、沪电股份）、纪源资本领投，第二轮由光合创投、隆湫资本领投，中芯聚源跟投。老股东锦秋基金、龙芯创投、腾业创投、张江浩珩、水木清华等继年初完成种子轮投资后持续加码。势能资本长期担任独家融资顾问。此次融资将主要用于投入三维光电封装能力、面向量产需求采购晶圆等产能以及搭建完整的光I/O研发团队。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong>近日，京东“Aidol创造营S2冒险季”DemoShow路演直播圆满落幕，50余款AI新品与创客团队作品亮相，覆盖办公生产力、家庭健康、运动训练、情感陪伴、创意智造多元生活场景。演员王珞丹、歌手胡彦斌等嘉宾组成“Aidol助推团”，现场体验测评各类AI创新硬件，共同解锁AI技术落地日常的全新可能。</p>\n  <p>一家1800人的公司，正在管着8000个“AI员工”——这是明略科技正在跑的真实组织实验。腾讯云 Agent Runtime 为可托管的“数字员工”提供支撑，既能同时带十万个AI跑起来，又能像管员工一样把每个AI的权限管住。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>程序员面试可以带AI了，但是面试约不到了。</p>\n  <p>&nbsp;</p>\n  <p><strong>Floatboat：搭个工作台，做一门生意</strong></p>\n  <p>不懂代码，用大白话搭出专属 AI 应用，还能上架赚钱。Floatboat 工作台直播，三位真实用户现场演示内容、外贸、教育三种完全不同的玩法，边看边聊。</p>\n  <p>&nbsp;</p>\n  <p><strong>你人生中捅过最大的娄子是什么？&nbsp;</strong></p>\n  <p>可能是一次崩盘的工作项目、一场搞砸的关键考试、一段破裂的关系、一个失败的决定。在那个你闯了祸、踩了坑的瞬间，脑海中的念头是？ 完了，天要塌了，这辈子完了。&nbsp;</p>\n  <p>我们习惯性地把一次纰漏视同于人生的溃败，但这些问题或失败真的带来了灾难吗？或许并没有，事情总会慢慢落地，生活依然要继续往前走。&nbsp;</p>\n  <p>人这一生的容错空间到底有多大？欢迎扫码二维码参与征集：曾经让你觉得会毁掉一切的“错误”，最后是否以不曾想到的方式轻轻翻篇？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_602b2a5fae114ed081527c32b2542d5f@5667365_oswg13985oswg256oswg256_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码 参与调研</p>\n  <p class=\"editor-note\"><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-29T00:13:55+00:00", "fetched_at": "2026-10-29T04:05:00.167722+00:00", "fingerprint": "7f857d888f191965"}, {"source": "36氪 - 最新文章", "title": "“对不起，我们不投具身智能了”", "url": "https://36kr.com/p/4046281658307456?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>具身赛道里，那个有些疯狂的投资人，开始收手了。</p>\n  <p>很少有人会质疑他的地位。他出现在某机器人上市公司早期投资人名单中、又是另一家具身智能头部企业的幕后人。在很多年中，他和公众视野保持着谨慎的距离。但在一级市场，他以风格凌厉和激进著名。</p>\n  <p>“他的判断很疯狂，没有前面那堆乱七八糟的（调研），就是我要投你，就投了，一个礼拜钱到账。”一位熟悉的投资人告诉硬氪。</p>\n  <p>如今，这个很少犹豫的人，忽然冷淡下来。他会告诉一些创始人：“这个项目要给董事会看一下。”接着，再也没有实际的回复。</p>\n  <p>对具身智能的创业者而言，2026年秋天，一切忽然开始崩裂。从气候已经凛冽的北京，到仍如盛夏的深圳，整个具身智能市场，正浸入同一片寒意中。</p>\n  <p>三家对具身充满热情的头部机构收紧了口袋。其中一家机构的投资人开会时明确：“<strong>收紧对具身智能的投资”、“对具身项目谨慎做判断”，另一家最近一个半月几乎没有具身项目上会。</strong></p>\n  <p>资本市场很现实，也很冷酷。深圳一位具身智能创业者9月前还在正常推进融资，9月后再找FA，对方告诉他：我们不接具身项目了——他在半个月中就成了不被欢迎的人。</p>\n  <p>他很难责怪FA。一位头部FA告诉硬氪，他近期收到的具身项目“<strong>应该少了一半</strong>”。这倒不算坏事，因为具身项目根本卖不动，“以往一个月能卖出去的项目，现在都卡住了，预计没有三到六个月搞不定”。最终，他们不得不提高接项目的门槛。</p>\n  <p>具身在很短时间中，就从FA心中“优先级最高的项目“变成了“滞销货”。有时，创业者还会被他们质疑：“几个月前市场最热的Timing，你们都错过了。我是不是可以认为，你们的市场Sense不够？”</p>\n  <p>其实，一位FA私下里说，自己更多是觉得可惜。他一次次提到“时机“。“如果那家公司踩中了timing，应该能够以一个非常好的价格非常快交割的。”他告诉硬氪，这家公司的失败，只是因为当下大家的“决策成本太高了”。</p>\n  <p>没人能准确指出，究竟从哪一张多米洛骨牌开始倒下。但时间很清晰，多名行业人士告诉硬氪，转折点出现在今年九月。</p>\n  <p>根据行业服务平台NE时代统计，<strong>9月具身智能领域的融资额相比8月掉了四成。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_74e9ce6b332e478fa2a24fa697b50c78@1199336245_oswg88006oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>很多事在短短几周集中爆发。</p>\n  <p>作为行业风向标的宇树上市，市值一度下跌一半。接着，具身上市公司CEO在朋友圈公开点明一些公司收入造假。关于“多家具身公司IPO暂停”的传言开始私下流传。从那以后，几家头部公司“动作一下就变形了，一下就很紧张。”</p>\n  <p>狂热进军被掐断得如此突然，以至于有些不真实。</p>\n  <p>数月前，还有一家具身智能创始人还很骄傲地告诉硬氪他们的估值涨幅线——今年2月，公司估值仅仅2个亿；到7月份，估值顶到30亿以上。<strong>短短5个月涨15倍。</strong>有公司为了谁第一个估值破200亿大打公关战，还有头部公司为了抢上市名额互放冷枪。</p>\n  <p>当资本从行业撤退，这一切争斗看上去甚至有些荒诞。过去三年，具身智能赛道制造了上百家初创公司，推出多家估值百亿的明星企业。而现在，他们之中的大多数，都处于飘摇不安的悬停状态。</p>\n  <p>一位投资人告诉硬氪，他的同行朋友们，有的已经不再关注具身智能，也有些乐观的人持币观望着——他们总认为，一切还远未到结局。</p>\n  <p>他给出了判断，现在正属于具身智能这一波周期里头的末期。行业势必需要经历一段震荡期，才可能进入相对稳定的阶段。他预计，<strong>这个时间点可能要等到2027年下半年，甚至2028年上半年。</strong></p>\n  <p>“大家都在等那个下半场，一起等。”</p>\n  <h2><strong>制造独角兽</strong></h2>\n  <p>具身行业的喧嚣，本就带着浓郁的投机气息。我们调研发现，所谓很多估值炫目的明星项目，主要靠推手操盘。</p>\n  <p>过去几年，行业里流行一种“全新”的创业融资模式，有投资人称其为<strong>“攒局式创业“</strong>。</p>\n  <p>这种玩法是，某些有资源的“攒局者”首先瞄准特定画像的人物，比如<strong>技术天才科学家、有丰富行业经验的大厂高管</strong>等，再鼓动他们下海当创始人。这些“攒局者”身份一般是投资机构，品牌声量未必突出，但手握丰厚的地方资源、资本网络。</p>\n  <p>而在他们决定创业之时，攒局者会拿出一整套计划，目的只有一个：推高估值，击鼓传花。</p>\n  <p>首先TA会帮助对方包装与造势。拎出大厂背景、技术天才、成功创业经验等标签，再推动项目进入一级市场的视野。</p>\n  <p>这群人都是利用人性的高手。一位FA告诉硬氪，过去一段时间，他们给出的投资决策点只有两天。他们会告诉对方：截止到明天晚上x点，必须给个决定。至于项目的更多材料，创始人访谈，安排不了。“你不投的话，下个人等着投。”</p>\n  <p>要是对方还在犹豫，他们会再推一把：“因为咱们关系好，我告诉你，xx机构想投，xx机构也想投。你不要，我就给另外的人。”</p>\n  <p>这种极限谈判之下，一些没什么经验的投资人很容易丧失理性。“整体就是一个非常 fomo （害怕错失）的情绪。”</p>\n  <p>相比于制造紧张的气氛，更重要的是提前安排融资节奏。上述投资人称，一些“攒局者”会<strong>在前几轮引入头部美元基金，并设法推动这些机构在后续融资中持续追加投资。</strong>而头部机构的不断加注，成为了吸引其他投资者入局的重要筹码。</p>\n  <p>除了投资上的出谋划策，“攒局者”们还会公司提供很多实用攻略，比如怎么拿订单、怎么“造”收入等等。</p>\n  <p>在这种设计精密的布局中，公司按照走线一步步推高估值。前述投资人称，类似项目<strong>第一轮估值往往是1亿美金左右起步、第二轮一般翻倍至15亿元、第三轮是25-40亿元。</strong>而且，有些特别有卖点的项目也会出现超募现象， “<strong>有时候第三轮估值一下子就跳到50亿或者更多”。</strong></p>\n  <p>这是一套运行精密的机器。 投资机构未必需要等待一家机器人公司真正完成商业化，便可能通过后续融资带来的估值上涨，获得账面收益。于是，在这场估值游戏中，技术团队、投资机构与FA之间心照不宣，推动雪球越滚越大，直至Pre-IPO。</p>\n  <p>不过，这种机制能够持续运转，有一个重要前提：公司能成功上市。而当上市路径掐断，新增资金不再积极入场，原本不断上涨的估值链条，也就从底层开始松动。</p>\n  <h2><strong>旧投资逻辑倒塌</strong></h2>\n  <p>一些敏锐的投资人，其实早在上半年就在刻意控制投资节奏。“<strong>大家置身局里，肯定知道投资是疯狂的、动作是变形的，所以当投资到达顶峰，势必就会下降</strong>”，一位投资人向硬氪分析。</p>\n  <p>但他们无法预判，究竟泡沫会在何时，因为何事破裂。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_ae9494fcda9242acad49834d9a04c82c@1199336245_oswg68879oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>事实上，多位行业人士向硬氪表示，这轮降温并非由某一件事单独引发，而是<strong>一级市场、二级市场、学术圈多因素共振的结果。</strong></p>\n  <p>首先，经过三四年的密集投资，头部机构基本已经完成了具身智能布局。</p>\n  <p>到2026年，资本几乎已经覆盖了具身智能整个产业链的所有卡点。2024年，热钱袭向硬件本体、2025年转向机器人大脑、核心零部件（灵巧手、传感器、触觉、仿生脸等），再到今年流向具身数据、世界模型。几乎每个领域都缔造了一批百亿估值公司。</p>\n  <p>一个根本没有商业化的产业，显然不可能容纳如此多独角兽，只是每个人都在正确的时间找到了接盘的人。一位投资人士甚至直言，投资逻辑简单到，“<strong>我只需要判断你上市的可行性，能赚钱就可以投</strong>”。</p>\n  <p>在这种交易逻辑下，二级市场给予机器人公司的估值越高，一级市场就越有理由为尚未上市的创业公司支付更高价格。一位投资人直言：“<strong>「宇树们」涨得越高，其实对未上市的公司融资是越好的。”</strong></p>\n  <p>如今，二级市场没办法提供他们期待的回报。8月上市的宇树科技，股价从上市首日1100元高点一路下跌，最大回撤超过六成（近日股价回升至720元）；9月上市的梅卡曼则跌破发行价；极智嘉曾出现破发，越疆科技股价也较历史高点大幅回落。</p>\n  <p>这些都是上岸幸运儿，更让投资人无法接受的，是手里的公司或许拿不到上市通行证。但他们也无法给出政策的走向。</p>\n  <p>除了资本市场出路堵塞，技术层面的最新进展，也在撼动部分投资人此前的判断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_b1eb22e92f1348228eafb605265236b2@1199336245_oswg114021oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>据过去两年，具身智能领域涌现出一批以VLA、世界模型等技术为核心的创业公司，它们试图为机器人打造通用大脑。而到今年9月，OpenAI发布GPT-6 Astra——尽管它并非专门面向机器人训练的模型，却也引起了具身智能行业的震荡。</p>\n  <p>比如，宇树王兴兴近期在一场演讲中提到，经他们实测，GPT-6 Astra可以在零训练情况下，仅仅通过<strong>提示词</strong>，就让机器人完成绘画。令人惊喜的是，机器人还会自主完成更换颜料、清洗画笔等配套工作。“<strong>未来大模型可能‘击穿’物理AI</strong>。”他这样判断。</p>\n  <p>而在国内，硬氪了解到，<strong>DeepSeek在内的国内基础模型厂商近期也在密集接触具身智能企业</strong>，探索进入这一领域的机会。字节跳动也在为具身模型招聘工程师和负责人。</p>\n  <p>显然，<strong>大模型厂商才是足以吞噬具身大脑创业公司的巨兽</strong>。有投资人在采访中向我们抛出了一个问题：如果一家具身创业公司花费近百亿元训练出的模型能力，未来可以由通用基础模型实现，那么这些公司此前建立的技术壁垒，还值不值上百亿的估值？</p>\n  <h2><strong>过冬</strong></h2>\n  <p>话语权已经逆转。 “以前往往是项目方觉得，‘我值这个价’，现在是投资机构认为，‘你不值这个钱’。”</p>\n  <p>寒意让很多具身公司纷纷改变姿态。</p>\n  <p>一家具身大脑公司的创始人告诉硬氪，近期他们改变了融资策略。</p>\n  <p>此前，他们更倾向于集齐几家知名投资机构，由头部机构领投，完成一轮规模较大的融资。如今，他们则转向“小步快跑”，只要有投资机构愿意进入，就可以启动新一轮融资。</p>\n  <p>“<strong>我们必须要抢时间，存过冬粮</strong>。”这位创始人告诉硬氪。</p>\n  <p>一些高估值的头部具身公司则开始收缩战线。</p>\n  <p>硬氪独家获悉，某估值超过200亿元的头部具身智能公司，<strong>近期正在推进组织架构调整，将此前分拆出去的子公司重新整合，并精简研发架构</strong>。而部分估值超过百亿元的具身智能公司，也出现了裁员、撤回offer等情况。</p>\n  <p>投资人已经不再轻易为轻飘飘的愿景付费。</p>\n  <p>一位投资人告诉硬氪，现在他们对具身智能项目提出了几点明确的要求——<strong>公司需要有清晰的商业化落地场景、真实的市场需求、创始团队中最好要具备产业资源且能推动产品落地的成员。</strong></p>\n  <p>“现在很难出手纯粹的实验室叙事，只能给到比较低的估值价格。”这位投资人说。</p>\n  <p>一些过去边缘化的项目，反而成了如今为数不多的选择。多位投资人向硬氪表示，<strong>近期部分资金反而开始流向一些过去不被“看好”的项目。</strong></p>\n  <p>这些公司未必拥有最亮眼的技术背景，也不一定致力于打造通用机器人，故事不够性感，但在特定行业和场景中，已经找到了明确的客户需求，拿到了真实订单，包括一些上游零部件、关节或设备厂商。</p>\n  <p>“<strong>大家现在终于能回归正常的投资判断逻辑</strong>。”上述投资人说。</p>\n  <p>当乐声停止，他们终于开始反思过去。</p>\n  <p>一位具身智能公司创始人向硬氪感慨，当前行业最大的矛盾之一，是人们对机器人发展的速度抱有过高期待。</p>\n  <p>“汽车用了200年才变成现在这个样子，而大家希望机器人用5年就变成汽车那样。<strong>资本总是过早地相信未来，又在遭遇挫折时，过早失去耐心</strong>。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_5da662afbeb1483487ec2b057ad0848f@1199336245_oswg79490oswg1280oswg399_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">&nbsp;</p>", "category": "tech", "published_at": "2026-10-29T01:32:34+00:00", "fetched_at": "2026-10-29T04:05:00.167707+00:00", "fingerprint": "e57cc19dfbb19e40"}, {"source": "少数派", "title": "断舍离只是起点：打造能长期经营的实用主义衣柜", "url": "https://sspai.com/post/116990", "summary": "只扔不买是没有用的，穿衣服时不多费心神才是目的。<a href=\"https://sspai.com/post/116990\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-28T07:00:00+00:00", "fetched_at": "2026-10-29T04:04:58.654266+00:00", "fingerprint": "0b2ee362173dd30f"}, {"source": "少数派", "title": "备受期待的国产 3A 游戏新作：《影之刃零》游玩体验", "url": "https://sspai.com/post/117725", "summary": "编注：《影之刃零》（PhantomBladeZero）是由中国游戏开发商「灵游坊」（S-GAME）自主研发的暗黑武侠动作冒险游戏，采用虚幻引擎5打造。游戏以独特的「功夫朋克」美学为特色，将中国传统武侠 ...<a href=\"https://sspai.com/post/117725\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-28T09:37:22+00:00", "fetched_at": "2026-10-29T04:04:58.654259+00:00", "fingerprint": "2abe74b180654242"}, {"source": "少数派", "title": "派早报：Apple 推出触控款 MacBook Pro、华为发布多款新品等", "url": "https://sspai.com/post/117750", "summary": "Google 推出世界模型 Genie 4、索尼推出手机主摄图像传感器 LYTIA 720 等。<a href=\"https://sspai.com/post/117750\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-29T00:26:49+00:00", "fetched_at": "2026-10-29T04:04:58.65
