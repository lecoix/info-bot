-10T00:28:49+00:00", "fetched_at": "2026-11-10T05:44:59.364244+00:00", "fingerprint": "05e31abb81030e94"}, {"source": "36氪 - 最新文章", "title": "最前线｜仰望鼎曜阿联酋全球首发，预估售价200万元", "url": "https://36kr.com/p/4062540807099270?f=rss", "summary": "<p>11月7日，比亚迪旗下仰望品牌在阿联酋阿布扎比全球首发超豪华行政旗舰轿车——仰望鼎曜。这也是仰望首次以完整品牌形象在海外举行全球发布会，意味着比亚迪的全球化战略，正从规模扩张进一步迈向高端品牌引领。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_77148fee987649918d87e402fad6501f@16862410_oswg209564oswg1707oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">仰望鼎曜，图源：现��拍摄</p>\n  <p>此次发布的鼎曜包含行政版与山河鼎韵限量版，后者已经开启预订，预估售价约200万元，预计2027年第二季度交付。作为仰望全新的超豪华行政旗舰，鼎曜将竞争视野进一步延伸至劳斯莱斯、宾利等传统超豪华品牌所在的市场。</p>\n  <p>与传统豪华品牌强调历史传承不同，仰望希望通过东方文化与前沿技术，建立一套属于中国品牌的豪华叙事。</p>\n  <p>鼎曜以“大器鼎成”为设计理念，从中国传统礼器“鼎”中汲取灵感。新车长宽高分别达到5600×2030×1590mm，轴距3500mm，采用方正威仪的车身轮廓，以及礼宾级中轴对开门设计。前脸点阵式宝石格栅、甲骨文车标等元素，则进一步强化了东方文化辨识度。</p>\n  <p>车内采用中轴对称布局，强调行政座舱的秩序与尊崇感。山河鼎韵限量版还融入苏绣、和田玉等中国传统工艺，试图将中国文化从视觉符号延伸至豪华体验。</p>\n  <p>技术仍然是仰望冲击超豪华市场的核心支点。</p>\n  <p>鼎曜搭载易四方四电机独立驱动系统，具备高速爆胎稳行、应急浮水等极端场景安全能力；新一代云辇全主动车身控制系统，可通过路面预瞄实时调节悬架，兼顾大型行政轿车所需的舒适性与稳定性。</p>\n  <p>智能化方面，鼎曜搭载全新一代天神之眼智能辅助驾驶系统，首次应用比亚迪自研璇玑A3智驾芯片，支持高速、城市领航及泊车辅助等功能。同时，新车配备第二代刀片电池及闪充技术，CLTC工况续航超过1000公里。</p>\n  <p>这些技术共同指向仰望对于豪华的另一种定义：不只依赖昂贵材料与传统工艺，更通过底层技术创新，将安全、性能和舒适转化为豪华体验。</p>\n  <p>鼎曜的全球首发，也发生在比亚迪出海规模快速增长的节点。</p>\n  <p>数据显示，比亚迪新能源乘用车出口量从2022年的5.59万辆增长至2025年的104.96万辆，2026年1—10月进一步达到150.74万辆，已超过去年全年。阿联酋是其海外市场增长的缩影，今年前三季度，比亚迪当地销量达到11495辆。</p>\n  <p>过去几年，中国汽车出海的主要竞争力来自新能源技术、供应链效率与产品性价比。随着规模持续扩大，如何在全球市场建立高端品牌认知，成为中国车企需要回答的新问题。</p>\n  <p>选择阿布扎比首发鼎曜，正是一次具有象征意义的尝试。中东拥有成熟的超豪华汽车消费市场，也是全球顶级汽车品牌的重要竞技场。</p>\n  <p>从追求出口规模，到以旗舰产品输出技术标准与品牌价值，比亚迪正在尝试推动高全球化竞争的一次升级。而鼎曜能否真正进入全球超豪华汽车消费者的选择名单，将成为检验这一战略的重要标尺。</p>", "category": "tech", "published_at": "2026-11-09T13:10:46+00:00", "fetched_at": "2026-11-10T05:44:59.161862+00:00", "fingerprint": "bdf4dd66b783caa9"}, {"source": "36氪 - 最新文章", "title": "SK-II推出新精华，押注PITERA™科研叙事延伸高端护肤生意", "url": "https://36kr.com/p/4062617457235081?f=rss", "summary": "<p>36氪获悉，11月6日，SK-II在第九届中国国际进口博览会上发布全新护肤浓缩精华液，品牌将其称为“神仙锁精华”。这款产品以SK-II核心成分PITERA™为基础，加入精华油微珠，主打紧致、抗皱和保湿等功效。它也被放进品牌原有的“神仙水”产品体系中，形成一套新的搭配方案。</p>\n  <p>从产品设计看，新精华并非另起一套成分叙事，而是围绕PITERA™做配方延展。根据品牌资料，产品采用浓缩PITERA™与精华油微珠复配的方式，提出“先渗后锁”的配方逻辑：前者承担滋养和渗透，微珠则在皮肤表面形成保护膜。每瓶50毫升产品据称含约1.6万颗微珠，平均尺寸约0.7毫米。品牌将其与含有超过90% PITERA™的护肤精华露（即“神仙水”）组合，分别对应保湿、紧致等不同功效诉求。</p>\n  <p>SK-II同时公布了一组围绕压力与皮肤老化的研究数据。品牌称，其研究团队对49,677个基因表达进行测序，发现氧化压力会扰乱701个基因的表达；另有针对亚洲女性的研究显示，压力与皮肤状态变化存在关联。不过，这些数据来自品牌及其母公司宝洁的研究，新闻资料未完整披露研究设计、对照条件和统计细节，不能直接等同于新产品在真实消费人群中的功效结论。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_7460f6fca3bb411fba31d27d5f2185aa@5922386_oswg753884oswg1004oswg670_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">SKII“神仙锁精华”</p>\n  <p>在功效测试方面，品牌提供的资料显示，33名35至54岁的中国女性连续6周、每天早晚使用新精华后，抗皱和紧致指标相较使用前有所改善，且在第2周、第4周和第6周呈递进趋势。神仙水与新精华搭配使用的测试，则分别涉及2025年36名女性的保湿度、光泽度测试，以及2026年32名女性在前臂进行的紧致度、细腻度测试。样本量较小，且部分测试在前臂进行，结果更适合作为产品功效验证材料，而非对所有消费者效果的保证。</p>\n  <p>新品发布背后，<strong>是SK-II在高端护肤市场继续依靠核心单品和成分资产维持竞争力的策略。</strong>PITERA™已成为品牌最具辨识度的技术标签，“神仙水”则是其长期主力产品。此次将新精华与神仙水绑定，既能借助成熟单品的消费者认知降低新品教育成本，也为品牌提供了提高客单价、推动多件连带购买的机会。至于新品的定价、上市渠道和销售目标，品牌暂时并未披露。</p>\n  <p>从母公司宝洁的财务表现看，美妆业务仍是集团增长较快的板块。宝洁2026财年（截至2026年6月30日）美妆业务净销售额为160.23亿美元，同比增长7%；有机销售额增长5%。但其中护肤品类有机销售额持平，宝洁解释称，超高端品牌SK-II的增长被大中华区护肤业务销量下滑所抵消。这意味着SK-II的高端产品增长仍有一定韧性，但尚不足以完全对冲中国市场的量端压力。</p>\n  <p>进入2027财年第一季度（2026年7月至9月），宝洁美妆业务净销售额同比增长6%至44.1亿美元，有机销售额增长5.4%。不过，宝洁并未单独披露SK-II的收入、销量或中国市场表现，无法据此判断新产品能为品牌带来多大增量。集团2026财年总净销售额为870.32亿美元，同比增长3%；大中华区占集团净销售额约7%。</p>\n  <p>对SK-II而言，新精华的意义不只在于增加一个SKU，更在于把已有的成分研究转化为新的产品组合和消费场景。在中国高端护肤市场竞争加剧、消费者对功效证据要求提高的背景下，品牌需要证明PITERA™的科研叙事能够持续转化为可感知的产品差异。新品能否真正带动增长，最终仍取决于上市后的复购表现、渠道动销，以及其能否改善品牌在大中华区面临的销量压力。</p>", "category": "tech", "published_at": "2026-11-09T14:28:41+00:00", "fetched_at": "2026-11-10T05:44:59.161856+00:00", "fingerprint": "c605d61a4aa63e9d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨外媒称黄仁勋或被英伟达免职，尚未指定接班人；突然大规模封号，ChatGPT回应；买烟可优先结账？零食有鸣回应", "url": "https://36kr.com/p/4063180322526336?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>王健林任万达商管董事长</li>\n   <li>董宇辉自有品牌回应“首款蛋糕9个月保质期”</li>\n   <li>玛莎拉蒂将与尊界合作，推动本地化生产</li>\n   <li>美民主党拟对马斯克等发起调查</li>\n   <li>SpaceX拟在得州建设240亿美元超级计算设施</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>外媒：黄仁勋或被英伟达免职，尚未指定接班人</strong></p>\n  <p>美东时间11月8日，英伟达创始人兼CEO黄仁勋于致员工信中承认婚外情，并向董事会、员工及全球股东致歉。英伟达董事会已宣布由独立董事和外部律师启动调查。彭博社报道称，作为英伟达联合创始人，黄仁勋以亲力亲为、不知疲倦的管理风格著称。这家公司尚未公布明确的接班计划，黄仁勋也没有明显的指定接班人。他多次表示希望在未来数十年继续执掌英伟达，并围绕自己建立了一种非正式的组织架构度。据路透社报道，美国投资机构Yorkville Ives的合伙人兼高级董事总经理丹·艾夫斯表示：“显然，根据董事会的调查结果，黄仁勋可能被免去首席执行官职务。”（中新经纬）&nbsp;</p>\n  <p><strong>突然大规模封号，ChatGPT回应</strong></p>\n  <p>11月8日，多家技术社区集中曝出OpenAI突发大规模账号封禁事件，大量用户在Reddit、国内开发者社群反馈ChatGPT账号无预警停用，其中包括每月订阅费用为200美元的Pro用户。部分用户表示，账号被封前没有收到任何通知，长期积累的聊天记录和工作资料也因此无法访问。</p>\n  <p>有网友推测这是OpenAI防止用户薅羊毛，开始限制同一台设备的账号上限。业内人士表示，OpenAI这个举止，绝非突然。之前，他们开启了逆向反代，还将ChatGPT和Codex合并为一个Token池。几天前，他们就悄悄锁死了单设备的付费号上限。还上线了一份《理解ChatGPT的支付卡与设备限制》的官方文件，将Go、Plus以及Pro 100、Pro 200、Pro 500档位，全部纳入了硬性配额管控。</p>\n  <p>对此，OpenAI Support账号作出回复，表示由于涉及具体账号信息，无法在公开社区论坛处理账号停用申诉。用户应通过封禁通知邮件中的链接提出申诉；如果没有收到邮件，可以通过官方申诉表单或帮助中心联系客服。该回复并未解释用户账号被封的具体原因。（第一财经）&nbsp;</p>\n  <p><strong>买烟可优先结账？零食有鸣回应</strong></p>\n  <p>近日，有网友在社交平台发帖称，零食有鸣某门店张贴着“购买香烟者优先结账”的提示，并称“保证真烟，假一赔百”。该消息迅速在网上发酵，引发大量网友吐槽。有消费者在评论区留言，“只听过军人优先、急救优先，第一次看到买烟优先”。还有人表示，“要是大家都排着队，有人直接优先，换谁心里都会不舒服”。大家普遍认为，商家可以设置快速通道，但不能以购买香烟作为享受优先服务的门槛。这种差异化对待，本身就容易传递出不利于控烟的导向。</p>\n  <p>11月9日，界面新闻就此联系零食有鸣客服核实上述提示是否属于品牌统一制度。客服人员向界面新闻记者表示，“目前公司没有出台相关文件，不是公司整体的规定”。客服同时说明，售卖香烟有着明确资质门槛，门店必须先办理烟草专卖零售许可证，才可以开展卷烟零售业务，香烟货源需要门店从当地烟草公司采购，进货链路不经过品牌总部，不过品牌方对加盟门店具备相应的介入管理权限。针对上述争议性告示，客服称会把线索移交给对应监督部门核实处理。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic公布新版Fable和Mythos模型</strong></p>\n  <p>Anthropic PBC公布了Mythos和Fable人工智能模型的新版本，寄希望在备受期待的美股上市前巩固其在AI开发领域的领先地位。Anthropic表示，定于周一发布的Fable 5.2能够处理难度更高的软件工程工作，执行控制机器人等更多与硬件相关的任务，并处理长期运行的项目。该模型还能够同时协调超过1000个AI智能体。同一型号的Mythos 5.2在网络安全和生命科学领域的防护措施更少，将通过此前公布的验证计划向部分机构推广。Anthropic表示，这两款模型都比之前的版本更快，而Fable的价格更低。（新浪财经）</p>\n  <p><strong>千问办公2.0发布，为首个支持多人与Agent协作的Team Agent</strong></p>\n  <p>36氪获悉，11月9日，千问办公发布2.0版本，这是其上线三个月以来最大的一次升级。该版本推出了行业首个支持多人与Agent协作的功能“协作”，同时上线“人机共创”、“资料空间”、“自动任务”和“三端互联”等核心能力，让Agent从服务个人走向服务团队和组织。目前，所有功能已在千问办公客户端全量上线。</p>\n  <p><strong>阿里云Token Plan额度上调70%以上</strong></p>\n  <p>36氪获悉，11月9日，阿里云上调Token Plan个人版订阅额度，Lite、Essential、Standard三档套餐月费不变，月度额度提升约74%至78%。&nbsp;</p>\n  <p><strong>Anthropic估值预期骤降40%，美股科技股遭抛售AI巨头承压</strong></p>\n  <p>近期，大量美国科技股遭抛售，AI领域投资回报受到越来越多的审视。据报道，部分潜在投资者准备给予Anthropic1.2万亿至1.3万亿美元的IPO估值，较此前预期的2万亿美元下降至多40%。而英国《金融时报》的最新报道称，投资者预计Anthropic估值可能接近1.5万亿美元。另据外媒报道，OpenAI最新一轮融资已完成110亿美元，后续份额预计在未来数周完成，本轮融资总规模可能增至200亿美元，公司估值约为1.25万亿美元。报道称，OpenAI最初的目标是以1.4万亿美元的估值筹集至少300亿美元资金，但当前市场环境下，公司不得不缩减融资计划。（彭博社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>国务院关税税则委员会：在2个月内继续暂停实施24%的对美加征关税税率，保留10%的对美加征关税税率</strong></p>\n  <p>36氪获悉，国务院关税税则委员会发布关于调整对原产于美国的进口商品加征关税措施的公告。为落实中美两国元首华盛顿会晤达成的成果共识，根据《中华人民共和国关税法》、《中华人民共和国海关法》、《中华人民共和国对外贸易法》等法律法规和国际法基本原则，经国务院批准，自2026年11月10日13时01分起，调整《国务院关税税则委员会关于对原产于美国的进口商品加征关税的公告》（税委会公告2025年第4号）规定的加征关税措施，在2个月内继续暂停实施24%的对美加征关税税率，保留10%的对美加征关税税率。&nbsp;</p>\n  <p><strong>王健林任万达商管董事长</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，大连万达商业管理集团股份有限公司发生工商变更，陈洪涛卸任董事长，由王健林接任。值得一提的是，王健林曾于2012年卸任该公司董事长。该公司成立于2002年9月，法定代表人为陈洪涛，注册资本约271.6亿人民币，经营范围包括商业综合体管理服务、非居住房地产租赁、物业管理等，由大连万达集团股份有限公司、王健林、Tencent Mobility Limited等共同持股。</p>\n  <p><strong>ST思科瑞：自11月11日起复牌并撤销其他风险警示，证券简称变更为“思科瑞”</strong></p>\n  <p>36氪获悉，ST思科瑞公告，公司股票将于2026年11月10日停牌一天，自11月11日起复牌并撤销其他风险警示，证券简称由“ST思科瑞”变更为“思科瑞”，扩位简称变更为“思科瑞微电子”，证券代码不变，日涨跌幅限制仍为20%。&nbsp;</p>\n  <p><strong>董宇辉自有品牌回应“首款蛋糕9个月保质期”&nbsp;</strong></p>\n  <p>近日，与辉同行推出的自有品牌“禾与春时”首款产品千层蛋糕系列，因标注保质期9个月引发争议，不少网友质疑产品是否添加大量防腐剂，属于“科技与狠活”。11月9日，界面新闻问询禾与春时旗舰店在线客服“这款蛋糕9个月保质期是否是防腐剂保鲜”，客服回应：9个月是“未拆封、-18℃以下冷冻保存”的保质期，靠的是冷冻保鲜+密封包装，不是靠防腐剂。客服还表示，蛋糕是自有品牌“禾与春时”的自营品，原料资质、质检都齐全合规，吃得安全又放心。（界面新闻）&nbsp;</p>\n  <p><strong>玛莎拉蒂将与尊界合作，推动本地化生产</strong></p>\n  <p>11月9日获悉，玛莎拉蒂与尊界的合作项目名为“玛莎拉蒂Design”，该项目为华为、江淮和Stellantis的三方合作。目前，新车外观已确认，规划明年第四季度有进一步量产动态。（第一财经）&nbsp;</p>\n  <p><strong>尊界或推全新子品牌，定价40-50万区间、主打SUV车型</strong></p>\n  <p>从知情人士处获悉，尊界或将推出一个全新子品牌，定价区间在40-50万左右，车型主打SUV。“其与玛莎拉蒂的合作分属于两个项目，目前（子品牌）具体细节尚未正式确定。”该知情人士透露。此前有市场传闻称，玛莎拉蒂母公司Stellantis、华为、江淮三方合作接近落地，目前规划两款全新纯电车型，整车将由尊界超级工厂负责制造。（财联社）&nbsp;</p>\n  <p><strong>WorkBuddy致歉，发布补偿措施</strong></p>\n  <p>11月8日晚，腾讯旗下AI工具WorkBuddy发布《关于DeepSeek-V4.1 Flash折扣活动的说明与补偿公告》，就优惠活动调整未及时公告向用户致歉，并公布补偿方案：11月5日14:00至11月8日23:59使用过DeepSeek-V4.1 Flash的账号，该期间使用DeepSeek-V4.1 Flash模型所产生的积分消耗全部按原价5折优惠结算，差额部分（即实际消耗积分总额的50%）将全部返还。该返还无需申请，系统自动核算并返还，预计7个工作日内到账。（第一财经）</p>\n  <p><strong>央行11月9日开展1820亿元隔夜逆回购操作</strong></p>\n  <p>36氪获悉，2026年11月9日，中国人民银行以固定利率、数量招标方式开展了1820亿元隔夜逆回购操作，全额满足了一级交易商需求。操作利率1.25%。</p>\n  <p><strong>人民币兑美元中间价报6.7188</strong></p>\n  <p>36氪获悉，11月9日，人民币兑美元中间价报6.7188，下调20点。</p>\n  <p><strong>上周公募调研逾2000次，电子等行业受青睐</strong></p>\n  <p>公募排排网数据显示，上周（2026年11月2日—11月8日），共有142家公募机构参与到A股调研活动中，覆盖到27个申万一级行业中的170只个股，合计调研达2173次，较以往周度调研数据相比，展现出较高的调研热情。上周6个行业公募调研次数超100次，其中电子行业被调研479次居首，此外，医药生物和机械设备公募调研次数均不少于200次。（证券时报）&nbsp;</p>\n  <p><strong>美民主党拟对马斯克等发起调查</strong></p>\n  <p>美国国会民主党议员8日表示，明年1月民主党接管国会后，将对美国亿万富翁埃隆·马斯克、白宫办公厅主任斯蒂芬·米勒及部分企业发起调查。民主党籍的联邦众议员罗伯特·加西亚与联邦参议员伊丽莎白·沃伦当天在电视访谈中作出上述表态。（新华社）&nbsp;</p>\n  <p><strong>苹果开源HALO，触觉感知成A股映射焦点</strong></p>\n  <p>苹果研究团队近日在arXiv披露人形机器人自主控制系统HALO并开源相关代码。该成果主要验证了语义层零样本迁移的可行性，但对A股板块的影响更偏叙事强化，受益方向将集中于补齐触觉感知这一明确技术短板的相关环节。（新浪财经）</p>\n  <p><strong>SpaceX拟在得州建设240亿美元超级计算设施</strong></p>\n  <p>SpaceX计划在得克萨斯州建设一座配备独立天然气发电厂的人工智能超级计算设施，项目总投资达240亿美元，约为该公司比特币持仓价值的17倍。持有比特币的SpaceX于今年6月完成了历史上规模最大的首次公开募股（IPO），如今该公司计划在得克萨斯州建设一座自行供电的超级计算设施。（新浪财经）&nbsp;</p>\n  <p><strong>上交所ETF连续28个交易日净流入，合计金额逾5400亿元</strong></p>\n  <p>9月22日至11月6日，上交所ETF连续28个交易日净流入，合计净流入金额5412.35亿元。其中，11月3日单日净流入634.54亿元，创年内新高。分产品看，9月22日至11月6日，净流入前三的为沪深300ETF华泰柏瑞（951.52亿元）、科创50ETF华夏（716.95亿元）、沪深300ETF易方达（601.15亿元）。（证券时报）&nbsp;</p>\n  <p><strong>伯克希尔·哈撒韦公司准备发行日元债券</strong></p>\n  <p>据知情人士透露，伯克希尔哈撒韦公司已委托瑞穗证券和美银证券，筹备一项潜在的基准规模日元计价、固定利率、高级无担保债券发行计划。该债券将在美国证券交易委员会（SEC）注册。知情人士称，该交易的正式宣布预计将在近期进行，但“需视市场状况而定”。（新浪财经）&nbsp;</p>\n  <p><strong>欧洲央行行长拉加德暗示12月将加息</strong></p>\n  <p>欧洲央行行长克里斯蒂娜·拉加德在接受日本《读卖新闻》采访时暗示，欧洲央行有可能在下个月举行的管理委员会会议上再次加息。拉加德指出，“我们知道未来几个季度的通胀数据仍将居高不下”，表达了对物价上涨的危机感。关于12月加息，她表示：“根据我们目前掌握的信息，除非发生重大变化，否则政策走向将符合我的预期。”（新浪财经）&nbsp;</p>\n  <p><strong>马斯克：SpaceX与Anthropic算力合约并非单向押注</strong></p>\n  <p>风投家Chamath Palihapitiya此前提出，SpaceX与Anthropic的算力合同里包含解约条款，SpaceX可借此向这家AI实验室大幅抬价。11月8日，埃隆·马斯克对此作出反驳，称这笔交易并非单向押注。马斯克8日晚间在X平台回复AI评论员Rohan Paul转发的Palihapitiya讲话片段时写道：“当然，这是双向约束。如果算力供给充足、价格走低，SpaceX的收入也会下滑。赌场里输赢自负，双方都没什么好抱怨的。”（新浪财经）</p>\n  <p><strong>软银公司上调全年业绩预期，上半年营收和营业利润均创历史新高</strong></p>\n  <p>11月9日，日本电信运营商软银公司公布2027财年上半年财报，并上调全年业绩预期。公司预计全年营收将达到7.9万亿日元，高于此前预测的7.5万亿日元；营业利润预期从1.1万亿日元上调至1.16万亿日元；归属于母公司股东的净利润预期从5600亿日元上调至6100亿日元，部分反映了出售Energy Global优先股权益所带来的收益。（新浪财经）</p>\n  <p><strong>英伟达宣布对多家韩国AI创企投资计划</strong></p>\n  <p>英伟达11月9日发布声明称，公司高管与韩国科学技术信息通信部副部长共同会见超20家韩国初创企业，涵盖基础模型、物理AI、AI基础设施以及AI半导体等领域。英伟达宣布投资韩国AI互连技术创企Point2，并计划进一步投资AI实验室Motif Technologies、物理AI创企RLWRLD和企业级AI公司Upstage。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股普涨</strong></p>\n  <p>36氪获悉，11月9日收盘，美股三大指数集体上涨，纳指涨2.74%，标普500涨2.35%，道指涨2.15%；大型科技股普涨，美光科技、闪迪涨超6%，特斯拉、Meta涨超5%，亚马逊、微软、苹果涨超2%，谷歌小幅上涨，英伟达跌超4%；热门中概股多数下跌，爱奇艺跌超5%，阿里巴巴、拼多多跌超3%，京东、哔哩哔哩跌超2%，理想汽车、百度跌超1%，网易小幅上涨。</p>\n  <p><strong>AMD：第五代EPYC处理器为谷歌TPU 8tx提供主机基础设施</strong></p>\n  <p>11月9日，AMD宣布，第五代EPYC服务器处理器将为谷歌云TPU 8tx提供主机基础设施。TPU 8tx是首个支持硬件强制机密计算的云端TPU系统。双方将结合AMD EPYC处理器、Infinity Guard安全技术及谷歌TPU算力，帮助企业在云端运行推理、微调和强化学习等AI工作负载，同时保护敏感数据。AMD表示，其EPYC处理器已成为全球超过10家主要超大规模云服务商及前沿AI实验室的主机CPU选择。（财联社）</p>\n  <p><strong>谷歌宣布Pathways在云端正式全面开放</strong></p>\n  <p>11月9日，谷歌宣布，Pathways现已在Google Cloud Platform正式全面开放。Pathways是谷歌自主研发的大规模分布式机器学习运行系统，曾用于训练Gemini等大型模型，目前向谷歌云客户开放。（财联社）</p>\n  <p><strong>高盛数据显示，对冲基金上周快速抛售全球科技股</strong></p>\n  <p>因为担心美国民主党可能会阻碍数据中心建设，引发了对AI交易的急剧重新评估，对冲基金上周以有纪录以来最快的速度之一抛售全球科技股。科技股是上周全球和美国遭净卖出幅度最大的板块，其百分比金额大致追平高盛集团自2016年以来的数据。根据该银行截至11月6日的主经纪业务数据，这也引发了四个月来最大规模的单一股票净卖出潮。(财联社)</p>\n  <p><strong>荣昌生物:签署泛RAS(ON)小分子抑制剂全球独占许可协议，将支付首付款5000万元、最高里程碑付款48.7亿元</strong></p>\n  <p>36氪获悉，荣昌生物公告，公司与烟台荣昌制药签署《许可协议》，获得泛RAS(ON)小分子抑制剂全球独占性许可。公司将支付首付款5000万元，最高里程碑付款48.7亿元，并按年度净销售额3%-7%支付特许权使用费。公司现有肿瘤产品管线目前主要专注于实体肿瘤ADC及双特异性抗体，本次引进的泛RAS(ON)小分子抑制剂项目可补充现有管线、拓宽公司肿瘤产品组合，并为日后与公司管线内其他资产开展联合开发创造机会。</p>\n  <p><strong>马斯克：特斯拉可能将出租而非出售Optimus机器人</strong></p>\n  <p>马斯克最新表示，特斯拉很可能会向客户出租其人形机器人，而不是出售。特斯拉已经在其弗里蒙特工厂启动了optimus的早期量产，预计将在2027年底左右开始向外部客户交付。（财联社）</p>\n  <p><strong>SK海力士拟扩充美国团队，深化与核心客户合作</strong></p>\n  <p>SK集团11月9日表示，韩国芯片厂商SK海力士准备扩充美国地区员工规模，此举意在加强与英伟达等美国核心大客户的联系。SK集团称，SK海力士计划在12月3日前后新增高管任命、重组美国业务体系。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>神州半导体IPO申请11月16日上会</strong></p>\n  <p>36氪获悉，上海证券交易所上市审核委员会定于2026年11月16日召开2026年第58次上市审核委员会审议会议。审议江苏神州半导体科技股份有限公司的首发事项。&nbsp;</p>\n  <p><strong>Sakana AI计划最早2027年秋季进行IPO</strong></p>\n  <p>据报道，日本AI公司Sakana AI准备进行首次公开募股（IPO），最早可能于2027年秋季在日本或美国上市。该公司已聘请高盛担任IPO顾问。（财联社）</p>\n  <p><strong>龙行天下上交所IPO过会</strong></p>\n  <p>36氪获悉，上交所上市审核委员会召开2026年第57次上市审核委员会审议会议，审议结果显示，广东龙行天下科技股份有限公司首发符合发行条件、上市条件和信息披露要求。</p>\n  <h2>大公司财报</h2>\n  <p><strong>搜狐：第三季度总收入为1.33亿美元</strong></p>\n  <p>36氪获悉，11月9日，搜狐公司公布2026年第三季度财务报告。财报显示，搜狐第三季度总收入为1.33亿美元。其中，搜狐公司营销服务收入为1500万美元，在线游戏收入为1.14亿美元。财报显示，第三季度营销服务收入为1500万美元，同比增长10%；在线游戏收入为1.14亿美元，同比下降30%；净亏损为1500万美元。&nbsp;</p>\n  <p><strong>五大航空央企净赚约47亿，上年同期约51.9亿元</strong></p>\n  <p>10月底，航空产业上市公司三季报陆续披露。中航沈飞、中航西飞、航发动力、中航机载和中航光电，这五家分别对应整机、发动机、机载系统和连接器等航空装备关键环节的央企上市平台，前三季度合计实现归母净利润46.78亿元。相比上年同期约51.9亿元的水平，这张“赚钱地图”并不平整。有的公司收入和利润同步回落；有的收入增长超过两成，但利润仍未厚起来；也有公司靠新增需求维持了两位数增长。（每日经济新闻）</p>\n  <p><strong>神农集团：10月商品猪销售收入5.91亿元，同比增长49.24%</strong></p>\n  <p>36氪获悉，神农集团公告，2026年10月份，公司销售商品猪42.84万头，同比增长55.9%（其中，向集团内部屠宰企业销售商品猪6.55万头）。商品猪销售收入5.91亿元，同比增长49.24%。商品猪销售均价9.83元/公斤，环比下降6.02%。&nbsp;</p>\n  <p><strong>环旭电子：10月合并营业收入66.44亿元，同比增加18.87%</strong></p>\n  <p>36氪获悉，环旭电子公告，公司2026年10月合并营业收入为66.44亿元，同比增加18.87%，环比减少11.25%。公司2026年1月至10月合并营业收入为535.24亿元，同比增加8.72%。</p>\n  <h2>投融资</h2>\n  <p><strong>理想汽车旗下创投公司增资1亿元</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，重庆车之辕创业投资有限公司发生工商变更，注册资本由6亿元人民币增至7亿元人民币，增加1亿元。该公司成立于2022年3月，法定代表人为王扬，经营范围为创业投资（限投资未上市企业），由重庆车之轩科技有限公司全资持股。天眼查集团信息显示，该公司为理想汽车集团成员企业。</p>\n  <p><strong>“优理奇机器人”完成5亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“优理奇机器人”完成5亿元Pre-A轮融资。老股东谢诺投资、涌铧投资连续多轮超额追加投资，新进机构包括绿地集团、柯力传感、华工创投、新景富盈、红鸟启航基金、玉林产投等产业及财务投资人。</p>\n  <p><strong>抖音旗下星罗拾光增资至约363.83亿元</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，深圳星罗拾光科技有限公司发生工商变更，注册资本由283.825亿元人民币增至363.825亿元人民币，增加80亿元，增幅约28.19%。该公司成立于2022年9月，法定代表人为石玉磊，经营范围含信息系统集成服务、软件开发、货物进出口、技术进出口、计算机软硬件及辅助设备批发和零售等。由抖音集团（香港）有限公司全资持股。</p>\n  <p><strong>“清析智研”完成近亿元天使轮融资</strong></p>\n  <p>近日，“清析智研”完成近亿元天使轮融资，投资方包括中芯聚源、高瓴创投、智元机器人、风物资本、东方嘉富及多家产业背景基金。成立不到半年，清析智研已在AI+材料研发与产业交付上取得阶段性进展，累计签约订单数千万元，客户涵盖先进制造、半导体、新材料等领域的产业企业与科研机构，并已与头部智能终端客户签署材料全栈委托研发订单。同时，公司即将发布全球首个全模态专家级智能表征分析模型，进一步推动专业模型能力的产品化。此外，清析自主研发的新一代稀土永磁材料已推进中试转化，目标于2027年实现量产。</p>\n  <h2>酷产品</h2>\n  <p><strong>2027款岚图知音将于11月13日上市</strong></p>\n  <p>36氪获悉，11月9日，岚图汽车正式官宣：智慧超充纯电大五座SUV 2027款岚图知音，将于11月13日正式上市。</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-11-10T00:01:00+00:00", "fetched_at": "2026-11-10T05:44:59.161850+00:00", "fingerprint": "e724940bbcf4f08b"}, {"source": "36氪 - 最新文章", "title": "让eVTOL从产品成为商品，交易与运力服务商「零界航空」完成千万元天使轮融资｜36氪首发", "url": "https://36kr.com/p/4063336242549893?f=rss", "summary": "<p>36氪获悉，<strong>eVTOL交易与运力服务商安徽天泽零界航空有限公司（以下简称“零界航空”）近日完成千万元天使轮融资，由上海互翔投资管理有限公司独家投资。</strong>本轮资金将主要用于推进验证基地的建设与运营、完善OC运行体系、拓展主机厂合作网络、建设数字化平台与专业团队等。</p>\n  <p>今年5月，民航局披露过一组数据：国内已有19个无人驾驶航空器完成型号审定，在审型号超过70个。航空器下线指日可待，但属于它们的航线却还没有画好。一个更朴素的问题来到台前：造出来之后，谁来买、谁来飞、谁来为每一次飞行兜底？</p>\n  <p>这是一段横亘在产品和商品之间的空白。</p>\n  <p>“主机厂负责把技术变成产品，造出安全、可靠、成本可控的航空器。而运行是另一套逻辑，要面对的是安全责任、空域协调、属地资源、机队调度、客户账期等诸多问题。”零界航空创始人吴振亚说。</p>\n  <p>换句话说，eVTOL要真正成为商品，靠的不再是制造能力的延伸，而是投入真实场景、跑通商业闭环的运行能力。零界航空切入的正是这一段：不造飞机，专注交付后的持续运营与资产流转，让飞机真正飞得起来、算得过账。</p>\n  <h2><strong>起飞前，先想好怎么“落地”</strong></h2>\n  <p>零界航空的起点是一段招商引资的历史。在推动主机厂落地并和地方政府开展合作的过程中，一个现实问题浮出水面：<strong>地方有场景和预算，主机厂有产品，但中间的交易组织和持续运行，需要一个专业角色来补位。</strong>零界航空也就此诞生。</p>\n  <p>“主机厂把技术变成产品，这一段已经卷得很充分了。”吴振亚说，“但低空经济接下来的竞争，不是比谁造的飞机多，而是谁先在安全边界之内，把常态化运行跑通。企业多飞出一班合规航线，政府手里就多一份放开空域的底气。”</p>\n  <p>零界航空的起手式，是组织融资租赁交易。今年9月，零界与峰飞、皖江金租签署三方战略合作协议，协议包含30架V2000CG凯瑞鸥的采购，首批5架将于年内交付，其中2架已在9月完成交付。这也是吨级eVTOL第一次以可分期购入资产的形态进入市场。</p>\n  <p>融资租赁在航空业并不新鲜，但eVTOL是个例外——没有运营历史，没有残值曲线，无法进行风控定价。破解这个局面的办法，是把物权、资金流和运营权切分开来，金融机构直接向主机厂放款，地方客户以小额租金获得使用权；零界则在其中用回购和运营兜底，从而换取金融机构的放款意愿。</p>\n  <p>“重资产金融化有它自己的历史路径。飞机、船舶、工程机械，都是先有一批公司持续把租金跑出来，才慢慢长出残值曲线和二级流转市场。”在吴振亚看来，eVTOL市场现在缺少的，是第一组被完整记录下来的真实现金流。</p>\n  <p><strong>所以把飞机租出去只是第一步，更关键的命题在于交付之后如何让它在一座城市里产生价值，变成一件可持续管理的资产。</strong></p>\n  <p>围绕这个命题，零界航空搭建了由“airOS”和“零界飞选”组成的数字化底座，把原本难以量化的航空器运行和资产交易，转化为可监控、可计价、可复制的标准体系，并据此向地方客户提供四类服务。</p>\n  <p><strong>一是选型与交付验收。</strong>基于数字化交易平台“零界飞选”和AI交易智能体，在众多机型中帮客户匹配真实场景需求，把控交付标准。</p>\n  <p><strong>二是金融方案设计。</strong>为不同预算结构的客户匹配购买或租赁的资产结构，缓解客户现金流压力。</p>\n  <p><strong>三是搭建运行体系。</strong>协同进行OC取证，提供机队调度、安全管理等运行服务，让航空器具备持续运行的基础条件。</p>\n  <p><strong>四是数据反馈。</strong>airOS平台把每一架航空器的飞行时长、任务频次、维修记录和运营成本结构化地沉淀下来。对监管侧，这些数据能够为城市低空安全运行提供参考；对主机厂，真实的航线反馈有助于支撑产品研发迭代；对金融侧，持续发生的飞行数据和租金流水都能够转化为可量化的资产信用，为eVTOL这个新资产类别积累定价依据。</p>\n  <p>“所以客户买走的不是一架飞机，而是一整套能飞起来、管理好、算得过账的运营服务方案。”吴振亚说。在eVTOL缺乏真实商业闭环的当下，这套方案切中了两个要害：用融资租赁解决“买得起”，用运行体系和数字底座解决“信得过”，为低空经济从制造走向商业兑现，提供了一个可落地的观察样本。</p>\n  <h2><strong>把难走的路，先走一遍</strong></h2>\n  <p>零界把第一批验证押在两座基地上。</p>\n  <p>位于山东滨州的合资公司，是零界航空落下的第一子。零界与峰飞航空在滨州共同成立了区域运营平台，这也是峰飞唯一一家对外合资公司。首批凯瑞鸥货运eVTOL落地后，将围绕沿海与园区场景开展常态化物流飞行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_4674c61f9bae47f7af35691ee3ef3e92@6413691_oswg1441407oswg1885oswg1259_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">滨州基地交付的凯瑞鸥货运eVTOL</p>\n  <p>另一座基地位于陕西榆林，零界联合地方国有投资平台与科研机构，以租赁方式引入多架航空器，主要验证资产如何被租赁、如何被计价、以及期满如何回购或流转。</p>\n  <p>两个基地的侧重点不同，指向的是同一个命题：<strong>一座城市如何从零走向常态化运行，以及这套体系能否形成可复制的运营和成本模型。</strong></p>\n  <p>从航线组织、安全记录、异常处置到最终沉淀下来的运行数据，这些在真实场景中跑出来的经验，也将成为空域管理协同和地方监管标准制定所需要的参考实证。</p>\n  <p>“我们想先把难走的路走一遍。”吴振亚说，“等一座城市通过这几班货机，确认常态化运行是可控、可预期的，才能去打开更大片的空域、批准更多的场景。零界希望在这个过程里，扮演的是探路者，而不只是一个做生意的企业。”</p>\n  <p>这套模式也开始带来实际的收益。据吴振亚透露，榆林项目加之此前在河南、安徽等地落地的国资租赁与运行服务，零界航空今年的整体营收已达千万元。</p>\n  <p>基于两个基地的运行情况，零界航空计划在2027年继续拓展城市节点，进一步扩大验证范围。对于新节点的选择，吴振亚主要有四项考量：是否存在真实且持续的任务需求，地方政策与产业配套是否支持，空域是否允许常态化飞行，以及是否有能够承接属地资源的合作方。</p>\n  <p>“优先选择海岛、沿海及地广人稀地区等具有物流、巡检或应急救援刚需的场景。这类地区交通成本高、替代方案少，客户愿意为运输效率付费的空间更大。”他说。这一选择也呼应了监管层“先载货后载人、先远郊后城区”的发展路径。</p>\n  <p>长期来看，零界航空希望从当前自购飞机、验证场景的模式，逐步转向平台化运营。当运行数据和商业模型被充分验证后，航空器资产可以由地方平台、通航公司或其他客户持有，零界则作为平台方，负责连接航线航路、运力供给和付费买家，提供运力调度、运行管控等服务，“终极目标是成为低空出行领域的‘滴滴’。”</p>\n  <p>用吴振亚的话说，低空经济当前不是一个赚钱的行业，但未来一定是一个值钱的行业。零界航空现在要做的，是把“值钱”这个判断通过真实场景验证出来，逐步摸索出一套能被市场验证、能被资本定价的城市航空商业体系。</p>", "category": "tech", "published_at": "2026-11-10T02:40:42+00:00", "fetched_at": "2026-11-10T05:44:59.161841+00:00", "fingerprint": "f235ad7f26f9bd1b"}, {"source": "36氪 - 最新文章", "title": "2026商业世界值得关注的人，齐聚WISE现场丨首批嘉宾正式官宣", "url": "https://36kr.com/p/4063344462304388?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_5b6ef5035a374bbcbf7c5fbffe743aad@6301044_oswg2002676oswg5001oswg1407_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>又是一年11月，36氪WISE2026商业之王大会，今年在北京亦庄和你见面。</p>\n  <p>WISE商业之王大会像一扇持续打开的窗口，每一年都向我们展示中国商业世界不断发生的变化。今年是WISE大会走过的第14年，从互联网浪潮到AI时代，从商业模式创新到技术驱动的产业变革，每一年，都有新的故事发生，也总有一群人，率先走向变化的中心。</p>\n  <p>2026年，这些变化变得更加具体。AI不再只是屏幕里的对话框，机器人开始走进真实生活，新的创业方式、新的商业机会不断涌现。那些曾经关于未来的讨论，正在成为今天真实发生的商业故事。</p>\n  <p>今年的WISE，我们一起聊聊，新技术如何真正走进商业？新的增长机会正在何处发生？那些站在变化一线的人，又在做出怎样的判断与选择？</p>\n  <p>于是，我们邀请了那些在商业一线探索与行动的人，继续和大家在WISE相见！</p>\n  <p>WISE2026商业之王，首批嘉宾，正式官宣。更多惊喜还在路上！扫描海报或文章底部“观众报名二维码”即可报名参会，席位有限，早鸟票仅剩最后五天，期待和你现场相见！</p>\n  <h2><strong>首批嘉宾阵容</strong></h2>\n  <p><strong>王兴兴丨宇树科技股份有限公司创始人、CEO、CTO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_4ef18ee1ef024f8d8057c4f7e1d114f2@6301044_oswg177060oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>王兴兴，宇树科技（Unitree）创始人、CEO、CTO。在硕士研究生期间，全球范围内，个人创先研发了使用低成本外转子无刷电机驱动的高性能四足机器人XDog，开创了全球低成本高性能足式机器人的技术先河。XDog机器人在2016年受到了国内外多家媒体的报道，在全球机器人圈内获得巨大反响。</p>\n  <p>随后2016年8月创立了宇树科技（Unitree），在全球率先公开零售高性能四足机器人，全球销量历年领先，显著推动了全球高性能四足机器人和人形机器人的商业化进程。累计提交国内外专利申请200余项。带领公司获美团、腾讯、阿里、红杉、顺为、经纬等的多轮投资。曾带领团队让公司产品登上央视牛年春晚、冬奥会开幕式、Super Bowl和央视蛇年春晚、马年春晚等。荣获 2025 年中国青年五四奖章、2025 年第六届全国非公有制经济人士优秀中国特色社会主义事业建设者、2025《时代》周刊“全球 100 位最具影响力 AI 人物”，2026《时代》周刊封面人物，第四届全国创新争先奖状等荣誉。</p>\n  <p><strong>夏立雪丨无问芯穹联合创始人兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_6130eeb9835b4bfeaf67340da659ed75@6301044_oswg170050oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>夏立雪，无问芯穹联合创始人兼首席执行官，学士与博士均毕业于清华大学电子工程系，师从汪玉教授。长期致力于人工智能系统设计方法学研究，他在大语言模型的压缩加速、生成式AI模型芯片等领域的相关工作，是世界首个面向深度学习语音合成领域的定制化硬件设计，在国际上处于领先地位。发表学术论文30余篇，谷歌学术引用3500余次，连续五年入选斯坦福全球学科Top 2%科学家榜单，连续两年入选AI 2000人工智能全球最具影响力学者榜单（芯片方向Top100）。曾获2025年全国工业和信息化系统劳动模范、2025央视年度十大AI人物、2025财富40U40商业精英等荣誉。2023年创立无问芯穹，在他的带领下，无问芯穹已发展成为AI 基础设施领域最具代表性的高新技术企业之一。</p>\n  <p><strong>郝建业丨天津大学菁英教授、博士生导师、MemoraX AI创始人兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_1bf54cde64d04e9bb6441b6e28316a5a@6301044_oswg195287oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>郝建业，天津大学菁英教授、博士生导师、MemoraX AI创始人兼CEO，国家优秀青年科学基金获得者，博士毕业于香港中文大学，曾于麻省理工学院从事博士后研究。长期深耕深度强化学习、多智能体系统与具身智能，在ICML、NeurIPS、ICLR及Nature Communications等国际顶会顶刊发表论文150余篇，谷歌学术引用超1.5万次，获国际会议最佳论文奖4次、NeurIPS竞赛冠军4次。曾任华为诺亚方舟决策推理实验室主任、大模型算法实验室主任、华为医疗军团技术总裁，主导多个AI产业项目从0到1孵化。</p>\n  <p>2026年创立MemoraX AI，专注于构建下一代AI记忆基础设施，致力于突破大模型长期记忆能力瓶颈。目前，公司已推动长期记忆技术在医疗、金融、软件开发、智能终端等10多个行业实现商业化落地，并在成立半年内完成三轮数亿元融资。</p>\n  <p><strong>王翔丨高山新域创始合伙人、小米集团前总裁、高通大中华区前总裁</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_d3698487670c4e33ba606dd168328df8@6301044_oswg228648oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>王翔，高山新域创始合伙人、小米集团前总裁、高通大中华区前总裁，2015年加入小米集团，历任高级副总裁、国际业务部总裁，小米集团总裁及代理首席财务官等职务，主导国际业务拓展与知识产权体系建设，为小米全球化扫清专利障碍并建立专利壁垒。2022年12月卸任集团总裁，转任高级顾问。</p>\n  <p>后转向科技创业孵化与投资，创立高山新域并担任创始合伙人，聚焦AI应用、科技出海与智能制造三大方向，助力年轻创业者链接中国供应链与全球市场。现任具身智能产业联盟联席理事长。</p>\n  <p><strong>郭后扬‌丨诺瓦聚变创始人、董事长兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_245483ff218546fc985e4d3d85e34b13@6301044_oswg182003oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>郭后扬‌，美国物理学会会士（APS Fellow）、特聘专家，现任福耀科大·诺瓦核聚变创新研究院院长、福耀科技大学特聘教授，也是全球极少数同时深度参与托卡马克与场反位形（FRC）两大主流聚变路线的科学家，学术与工程经历横跨亚洲、欧洲、美国的顶尖机构：曾任全球最大托卡马克JET偏滤器再循环组组长与实验负责人、美国能源部最大FRC研究计划负责人、TAE Technologies首席科学家、美国最大托卡马克General Atomics DIII-D边界等离子体与材料研究中心创始人兼主任、中科院EAST托卡马克研究室主任，且具备国内多家聚变企业CTO经历，在基础理论和装置建造等多方面具有宝贵的实践经验。这一横跨东西方院校企业、贯通两条聚变路线的复合履历，构成了参与全球未来能源科学范式定义所必需的学术和产业背景。</p>\n  <p><strong>张翼丨未来不远机器人创始人兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_9251a25c94624b76a57b4f12bb753ea8@6301044_oswg1359578oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>张翼，未来不远机器人创始人兼CEO，前美股互联网上市公司掌门教育创始人兼CEO。2022年，创立未来不远机器人，获得包括真格基金，博裕创投，字节等多轮近10亿融资。目前未来不远机器人已经进入500多个家庭进行付费使用，是全球首个进入真实家庭环境使用的通用机器人。</p>\n  <p><strong>赵燕 | 华熙集团董事长、华熙生物董事长兼总裁</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_c7db7a366b76450c96bad7e62b940645@6301044_oswg171120oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>赵燕，华熙国际投资集团董事长、华熙生物（688363.SH）董事长兼总裁，现任北京市政协常委、海淀区人大代表、全国工商联执委、全联女企业家商会常务会长、北京市工商联副主席。1989年创立华熙国际，建设运营五棵松“双奥场馆”，开创“华熙LIVE”模式。2000年创立华熙生物，率先实现透明质酸生物制造，市场份额全球第一。曾获全国三八红旗手、中国经济年度人物、福布斯中国杰出商界女性100等荣誉。</p>\n  <p><strong>李志飞丨出门问问创始人、CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_8747d5a9e61f4199b24fee9df254d613@6301044_oswg245826oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>李志飞，出门问问创始人兼CEO，约翰霍普金斯大学计算机系博士，自然语言处理与人工智能专家，前Google总部科学家。</p>\n  <p>2012年，李志飞离开Google回国创办出门问问。过去十余年，他持续带领公司穿越移动互联网、AIoT与生成式AI多个技术周期，主导研发并商业化落地语音助手、智能硬件、多模态大模型及AIGC产品，包括魔音工坊（海外版DupDub）、奇妙元、奇妙问等。</p>\n  <p>同时，他围绕Agent能力与AI原生工作流，探索新一代AI原生应用与硬件形态，推出TicNote、CodeBanana等Agentic AI产品。在这一过程中，李志飞形成了一条中国创业者中较为少见的、连续跨代际转型的实践路径，并持续探索AGI的工程实现与商业化边界。</p>\n  <p>李志飞带领的出门问问先后获得红杉资本、真格基金、Google、SIG、歌尔声学等知名机构投资，并于2024年4月24日在香港交易所上市，被称为“AIGC 第一股”。</p>\n  <p><strong>樊耀塬丨纳开量子创始人兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_1deebc62458740569735d5677ee2676b@6301044_oswg172182oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>樊耀塬，1998年出生，北京大学物理学院本科、电子学院量子电子学博士，从事冷原子研究超8年。博士期间主导搭建国内首台超冷原子干涉陀螺仪系统，并联合搭建国内首台超冷原子布洛赫振荡型重力仪。2026年以优秀毕业生身份完成博士学业，同年4月创立纳开量子，致力于中性原子量子计算机研发。公司掌握将9种元素原子冷却至10nK以下温区的核心工艺，已交付量子模拟整机“纳开一号”并获千万级市场订单，成立数月内完成破亿元天使轮及天使+轮融资，高瓴创投、长石资本等机构参与。</p>\n  <p><strong>陈天润 | 魔芯科技创始人、CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_ce79fc5c444145e3bf7ad1d6481c3c64@6301044_oswg1150217oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>魔芯科技创始人兼CEO陈天润系浙江大学博士，师从中国工程院院士潘云鹤。深耕空间智能与4D世界模型领域，在Science、Nature Photonics、IEEE TPAMI等期刊及ICCV、CVPR、ICML、SIGGRAPH等会议发表高水平论文50余篇。多项研究成果入选会议Highlight、Oral、Spotlight，获2024年Chinagraph最佳论文奖。同时担任NeurIPS、ICML、CVPR国际会议审稿人。2022年荣获共青团中央科技创新最高奖项“中国青少年科技创新奖”，系浙江省高校唯一获奖者。先后入选2024福布斯Forbes Asia 30 Under 30、2022胡润U30中国创业先锋、2023创业30 Under 30+等青年科创领域主流权威榜单。</p>\n  <p><strong>亓鲁（Gavin）丨影石创新研究院院长</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_ddf152fe611f4abfb26b500c1c98d184@6301044_oswg170440oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>亓鲁（Gavin），影石创新研究院院长，武汉大学计算机学院教授、博士生导师，国家级高层次青年人才。累计发表学术论文80余篇，其中CCF-A类论文一作与通讯论文40余篇，学术引用逾19,000次，担任TPAMI编委。现任影石Insta360研究院负责人及首席人工智能官，推动智能影像与AI技术在产品端的融合。</p>\n  <p><strong>周子寒丨群核科技首席科学家</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_f5b753bb66e74e04a4288092c228d7d8@6301044_oswg173661oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>周子寒，群核科技首席科学家，“国家级海外高层次青年人才”，清华大学自动化系学士，美国伊利诺伊大学厄巴纳香槟分校（UIUC）电子与计算机工程硕士/博士，曾任宾夕法尼亚州立大学信息科学与技术学院助理教授（长聘轨）。在计算机视觉和机器学习领域有深入的研究成果，特别是三维视觉方向。在学术领域已经发表了40余篇论文，研究结果发表于CVPR，ICCV，ECCV，TPAMI，TIP，TMM等顶级的国际会议与杂志，引用超过5000次。</p>\n  <p>2013年1月-2021年4月就职于美国宾夕法尼亚州立大学信息科学与技术学院，历任研究员、助理教授（长聘轨），聚焦三维计算机视觉前沿研究；</p>\n  <p>2021年5月加入群核科技，任首席科学家，主导三维空间智能技术和群核科技世界模型的自主创新研发。</p>\n  <p><strong>李柯宏丨酷哇科技联合创始人兼COO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_1464af3207d54e85ac5abe35478f9f22@6301044_oswg158837oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>李柯宏，酷哇科技联合创始人、COO，负责公司经营与商业化。曾任职于美元VC，后进入产业，完整经历机器人产品从定义、落地到复购盈利的全过程。</p>\n  <p><strong>信晓旭丨后摩智能联合创始人、产品副总裁</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_85bfa8b6d778478dbb90a0960c933875@6301044_oswg191161oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>信晓旭，后摩智能联合创始人、产品副总裁，具有15年以上计算芯片产品、市场和销售经验，曾任海思计算芯片产品总监，负责海思昇腾系列多款AI芯片的产品定义和市场推广，涵盖自动驾驶、安防、数据中心等领域。在Cavium（被Marvell 60亿美金收购）作为中国区创始团队成员之一，带领团队将中国区业务从零做到数亿人民币。</p>\n  <p><strong>曹芳宁丨多维资本创始人</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_73af8a5c27124170bcb49dd583f58808@6301044_oswg1201465oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>曹芳宁女士是多维资本创始人。创立多维资本前，她曾任罗兰贝格全球合伙人，拥有超十年战略咨询经验，深扎汽车与消费产业，曾任上海市政府高级顾问及三家上市公司独董。2015年创立多维资本以来，她带领团队聚焦硬科技、前沿科技行业的投融资和跨境并购业务，累计完成几百亿美元交易，被誉为“跨体系产业架构师”。</p>\n  <p><strong>刘扬 | 原力无限联合创始人&nbsp;</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_3a9f5932e4f149e99e3e282c0b9e9a40@6301044_oswg158512oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>刘扬，原力无限联合创始人，北京航空航天大学硕士，连续创业者，拥有20余年科技行业从业经历。曾任职于腾讯、百度、迪士尼等企业，长期深耕智能驾驶与人工智能领域。联合创立原力无限，负责产品规划与商业化落地，推动具身智能机器人向真实产业场景转化。</p>\n  <p><strong>朱清毅丨朱葛机器人创始人、董事长、CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_dd90e435a3a743f1a4f1827644171f63@6301044_oswg169533oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>朱清毅，视障科技创业者，（瑞士）新华都商学院EMBA，中国残联无障碍技术专家。2001年创办全国首个视障无障碍信息网站，2009年创立朱葛机器人，主导研发“AI LOOK”盲人助理机器人，融合激光雷达与深度视觉，主打无需预扫图、无需遥控、开机即走，致力于用具身智能解决视障群体出行难题。公司已完成Pre-A轮融资，产品进入小批量交付阶段。</p>\n  <p><strong>周顺波丨欧拉万象创始人兼CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_5f5a0e2c5c604987a6216d045163b1e8@6301044_oswg1306249oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>香港中文大学机器人学博士，华为“天才少年”，曾任华为云物理智能创新Lab负责人、首席技术专家，从0到1搭建华为具身智能团队。2026年3月创立欧拉万象，专注可养成家庭机器人，推动机器人从极客场景走向大众家庭，公司半年内完成四轮融资。</p>\n  <p><strong>于亚飞丨EverHarbour AI智能眼镜总经理</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_8c71706f9e814f1d80132bfc8d7e1663@6301044_oswg1797368oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>于亚飞，EverHarbour AI 智能眼镜总经理。</p>\n  <p>从投资人转型为 AI 眼镜产业的实践者，他带领团队秉持以“优雅不彰，自在随行”为核心品牌理念，围绕舒适佩戴、优雅设计、全天候长续航与 AI 能力原生融合三条主线打磨产品，推动 AI 会议智能整理、多音效开放式听音等能力在真实工作与生活商务场景中落地。</p>\n  <p>在2026全球影像场景产业大会，上品牌提出“先理解用户，再定义产品”是独到观点。</p>\n  <p><strong>曹静文丨萤石网络董事会秘书</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_0613c36ea3d44878a346d591da78c769@6301044_oswg181919oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>曹静文，美国伊利诺伊大学香槟分校金融与会计本科双学位。曾任德勤全球总部金融服务行业高级审计师，后历任海康威视内控部高级内审、董事会办公室投资者关系经理。2024年5月起任萤石网络董事会秘书，负责公司治理、信息披露与投资者关系管理，以及公司战略市场部。</p>\n  <p><strong>吕志威 |&nbsp;广汽领程营销企划部部长&nbsp;</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_bb6f3bc5fe3a4dc48b6a7a6d10d74847@6301044_oswg170369oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>吕志威，全面统筹公司营销规划、营销策略、品牌建设、市场推广、公关传播、大型市场活动策划执行、数字化营销等。平衡短期获客目标与长期品牌建设，支撑公司业务增长，助力品牌在新能源商用车赛道加速破圈。</p>\n  <p><strong>邓堃丨黑芝麻智能应用工程副总裁</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_645a8a3d4b694a478eecc8a1acac2fd9@6301044_oswg223406oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>邓堃，黑芝麻智能应用工程副总裁，领导团队开发基于黑芝麻智能芯片的自动驾驶平台化算法应用、SOC应用、系统集成应用。领导团队为OEM/Tier1客户提供黑芝麻智能芯片、算法、工具链相关的技术支持和工程落地。</p>\n  <p><strong>张虹丨可计算开店Locxx.ai CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_7f1a58d7bea64f9db9b4743ca7dfca1d@6301044_oswg166320oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>张虹，实体零售空间智能决策创业者。曾任头部本地生活平台供应链产品经理、新零售产品经理，从0到1搭建营销与流量交易体系，执掌零售空间交易体系LCN十年。现主导研发零售空间流量底座模型，用AI把选址、客流与拓店从经验判断转为可验证的计算，为连锁品牌与新锐品牌交付开店决策能力。</p>\n  <p><strong>鲁扬丨PureblueAI 清蓝创始人&amp;CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_205763fe13d148909f4f1a098d2e5f4c@6301044_oswg1495230oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>鲁扬毕业于清华⼤学中⽂系，20余年科技⾏业经验。前字节跳动⽕⼭引擎市场总经理、⾖包⼤模型市场负责⼈，前销售易市场副总裁，早年在IBM/联想/京东等企业任职。中国商⼴协数委员会常务理事，⻁啸奖、⾦匠奖等营销奖项专家评委，《To B增⻓实战》系列书籍联合作者。获2023中国⼗⼤⾸席品牌官、第⼗五、十七届⻁啸奖年度⼈物等称号。</p>\n  <p><strong>曲凯丨42章经创始人</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_ad8c2a1c53d54286beb7308389f2b95f@6301044_oswg191627oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>曲凯，杜克大学研究生，中信《创投42章经》一书作者，福布斯中国30 under 30。曲凯在“得到”上的专栏获得超20万付费订阅，在知乎上拥有数十万粉丝，并曾多次荣获36氪及虎嗅年度“最受欢迎作者”。42章经是目前国内AI领域头部媒体，拥有超过15万播客订阅，与超过35万微信公众号订阅，订阅者包括字节跳动创始人张一鸣、美团创始人王兴等等。2023年以来，42章经成功帮助数十家AI赛道公司获得融资，并参与其中数家投资。</p>\n  <p><strong>张阳丨Wanaka CEO</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_10d48823d45a444d9903a371825c4686@6301044_oswg179349oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>张阳，90后连续创业者。曾任职于小米和字节跳动，负责国际化出海产品，主导过从0到千万级DAU的增长。2022年离开字节后先后创办社交产品LiveIn与AI教育产品Answer AI，后者年经常性收入达300万美元。2025年创立Wanaka，定位AI驱动的UGC游戏创作与熟人社交平台，对标“游戏界的抖音”，天使轮获锦秋基金等机构数百万美元投资，估值5000万美元。产品分为网页端AI游戏引擎与移动端社交应用，主打让普通用户通过对话与拖拽即可创作游戏，并分享给朋友一起玩。</p>\n  <p>以上嘉宾是WISE2026商业之王大会首批官宣的嘉宾，更多惊喜还在路上！&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_f4c9ff203df749c2bad73dbd99f16392@6301044_oswg57930oswg1024oswg1024_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>扫描该二维码即可报名参会，席位有限，早鸟票仅剩最后五天，期待和你现场相见！</p>\n  <p>同时，WISE2026商业之王特别策划的“产业对接会”还在火热招募中，扫描下方二维码即刻报名“产业对接会”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_7a9e921f76e7490ca0b32c82cabc27c3@6301044_oswg126914oswg1024oswg1024_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261110/v2_0d4ec58f32444890871fb3dcebc0d6b7@6301044_oswg122562oswg1023oswg1023_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-11-10T02:57:39+00:00", "fetched_at": "2026-11-10T05:44:59.161825+00:00", "fingerprint": "bd332eaa9ad29663"}, {"source": "少数派", "title": "一家人的客厅，和一个人的深夜 — Sonos Beam Ultra 与 Ace Ultra 体验", "url": "https://sspai.com/post/118227", "summary": "本文是少数派联合Sonos发起的SonosPlay众测活动（第二期）「最佳体验官」奖项获奖文章，奖品为免费保留送测的SonosAceUltra。除本文外，本期获得优秀体验官的作者及文章是：mivans ...<a href=\"https://sspai.com/post/118227\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-09T07:40:22+00:00", "fetched_at": "2026-11-10T05:44:42.783657+00:00", "fingerprint": "6d019ce92974060a"}, {"source": "少数派", "title": "双十一 | 少数派会员、正版软件、付费栏目限时优惠", "url": "https://sspai.com/post/118799", "summary": "多款付费栏目和正版软件上新，以及口碑、质量都非常优秀的现有产品优惠活动，快来看看有没有你需要的吧。<a href=\"https://sspai.com/post/118799\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-09T08:24:03+00:00", "fetched_at": "2026-11-10T05:44 17日及18日在伦敦盛大举行。机遇展汇聚来自50多家香港与北京市、上海市、西安市，以及大湾区内地城市的企业，共提供超过200个职位空缺，涵盖了银行金融、创新科技、工程建造及专业服务等领域，不仅为国际英才拓展了更多选择空间，更彰显香港与内地城市的强劲联动，合力出海。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_33cc26fe5fba4dedb38968089ed94c9c@5510391_oswg2187384oswg5472oswg3648_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对于许多正考虑跨境职业发展的专业人士而言，这次机遇展的意义不仅在于规模，更在于它把通常分散在不同渠道的职位与行业信息，集中到了一个可以面对面交流的空间里，让选择不再是一个城市与另一个城市之间的取舍，而是整个区域内多种职业路径的组合。</p>\n  <h2><strong>从展位到对话：连接如何发生？</strong></h2>\n  <p>两日活动共吸引逾4,500人次参与，当中职业博览区是两天里最热闹的地方。企业招聘代表与参会者面对面交流，热情解答求职人才查询，与参会者分享职位要求、团队文化、签证流程。现场交流也转化为实际成果：参展企业共收到超过1.2万份简历，部分求职人才更获现场面试。对企业而言，这是精准对接全球人才的机会；对人才而言，这是一场零距离、高效率的直接对话。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_d5f824d6909b434885ef727074885c09@5510391_oswg4540848oswg5917oswg3704_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>广州市南沙区粤港澳人才协作中心是参展单位之一，其总监罗静颖对现场反应印象深刻。她表示：“我们非常高兴看到现场的热烈程度超出预期。”活动一开始就不断收到来自全球各地人才的咨询，“今天我们已收到约一百份简历，但这只是线下数量；还有一些人才通过电子邮件发送电子版简历，后续我们也会进行深入匹配和筛选。”</p>\n  <p>有参展企业代表认为，机遇展让企业与全球人才直接交流，物色具国际视野及跨文化协作经验的人才，支持业务拓展。</p>\n  <p>在创新与科技领域，内地企业参与尤为集中。过去几年，中国企业在人工智能、智能制造、生物科技等领域的全球竞争力持续上升，对国际人才的需求也随之增长。香港作为国际金融中心和国际人才枢纽，提供连接全球人才与内地产业需求的通道。</p>\n  <p>罗静颖同时指出：“无论是在人工智能、生物医药，还是集成电路、新能源等领域，南沙都为产业发展提供了很好的环境与土壤。这次活动发挥了香港作为‘超级联系人’的优势，帮我们企业连接到许多国际化人才资源。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261105/v2_e30601d8ca5c4cf393e68720d84d30bc@5510391_oswg858845oswg1125oswg750_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>粤港澳大湾区正发展成为全球创新和产业协同的重要区域。作为区域内的国际城市，香港担当着连接全球人才与内地产业需求的重要角色，从人才进入内地的中转站，逐步延伸为长期落户生活、拓展事业的目的地。</p>\n  <p>未来，香港更会通过北部都会区（北都）等大型项目持续延伸联动优势。北都占地约300平方公里，其中河套深港科技创新合作区香港园区聚焦研发，新田科技城提供大规模先进制造空间，将创造大量高增值岗位。这些项目意味着未来十年、二十年里，大湾区内部会出现更多跨城市的职业路径。</p>\n  <p>粤港澳大湾区发展专员林雅雯在机遇展的专题演讲中亦谈到《香港第一个五年规划》与大湾区建设，指出香港会参与大湾区建设成为具有全球影响力的国际一流湾区和世界级城市群，其中北都作为香港深度参与大湾区建设的主平台，将推动教育、科技、产业、人才和城市建设协同发展。她鼓励当地人才来港发展，立足香港，把握大湾区机遇。</p>\n  <h2><strong>论坛与工作坊：传信息，也拓人脉</strong></h2>\n  <p>本次全球人才机遇展不仅通过职业博览“汇机遇”，还借助论坛和工作坊“传信息”与“拓人脉”。</p>\n  <p>论坛聚焦香港及中国内地的发展机遇、人才概况与市场趋势。现场汇聚了政商界领袖、已来港发展的国际人才，以及资深人力资源代表，从政策、行业和个人经验几个层面把信息逐一拆解。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_8242527f57714282b789f0a577fe0b35@5510391_oswg4553756oswg6961oswg4641_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>工作坊则更偏向实践应用，两天安排多场主题分享，内容从职业路径到求职策略与面试技巧。演讲者中既有企业高管，也有熟悉香港招聘市场的人力资源代表，还有在国际金融专业机构任职、熟悉跨境人才流动的讲者。同时，参会者完成指定活动任务，更可获得免费简历咨询、ATS简历优化及职业形象照拍摄等服务。</p>\n  <p>跨境职业决策从来不是单一变量的计算，薪酬、税率、签证便利度固然关键，但工作机会、行业生态、生活文化等因素同样影响选择。对于香港人才办而言，这次机遇展既是推广香港，也是把发展机遇具体呈现在人才面前、协助其决策的平台。</p>\n  <p>其中，来自英国的大学生Leo Wickert表示，父亲在香港工作让他两次到访香港，并喜欢上香港的生活方式、美食、自然环境、高效节奏以及职业发展机遇。此次参展，他重点关注金融尤其是审计职位，认为现场面对面交流比网上查资料收获更大，工作坊也让他更好把握行业趋势，尽早规划发展路径。若有合适机会，他会积极把握。</p>\n  <h2><strong>香港人才办：搭桥引路，持续支持</strong></h2>\n  <p>作为活动主办方，香港人才办负责论坛议题设计、展位组织等。香港人才办总监陈海劲表示，机遇展让全球人才了解香港和中国内地的事业发展机会，并与企业直接交流和进行职业配对。他强调，香港人才办的支持不会随展会结束而中止，会继续在全球推广香港，针对性引进国家和香港发展所需的人才。</p>\n  <p>这次活动成效在会后仍在持续显现。根据活动后问卷调查，近九成表示活动加深了他们对香港和中国内地的了解，更有九成半受访者表示活动让他们更有兴趣探索香港及中国内地的发展机遇，可见活动取得积极成果。&nbsp;</p>\n  <p>这次伦敦机遇展，是香港人才办开展了超过100次的外访之一。未来，香港人才办会继续走出去，在亚太、欧洲及北美等地区举办推广活动，助力香港和内地企业“拼船出海”，帮助企业精准对接全球人才，并把香港的优势与机遇带到人才面前。</p>\n  <p>想要了解更多香港人才办未来举办的活动信息，可关注香港人才办网站获取最新动态。</p>", "category": "tech", "published_at": "2026-11-09T02:25:54+00:00", "fetched_at": "2026-11-09T04:20:06.927162+00:00", "fingerprint": "bde8bfaa8fca51ba"}, {"source": "36氪 - 最新文章", "title": "一年融5轮，首颗星计划明年一季度发射，「谱星航天」连续完成两轮近3亿元融资｜融资首发", "url": "https://36kr.com/p/4061912127247490?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>36 氪获悉，<strong>光学载荷与微纳卫星系统解决方案提供商「谱星航天」已于近期连续完成Pre-A+、A轮两轮融资，融资规模近3亿元</strong>，投后估值达数十亿元 ，资金将主要用 于团队建设、研发投入，以及首个轨道面 128 颗星的投产与快速组网。</p>\n  <p>Pre-A+轮由老股东金浦智能、联融志道追加投资，新鼎资本跟投；A轮由长发基金、闵金投、长兴基金联合领投，贵州省高新基金、崇山资本等机构跟投。谱星航天成立一年，共完成 5 轮融资，累计融 资金额近 6 亿元，是今年商业航天资本热潮中，卫星赛道融资节奏最快的公司之一。</p>\n  <p>谱星航天专注光谱定量遥感领域，是36氪长期关注的企业。其核心打法是将“光学遥感定量化能力”与“卫星批产工程化能力”深度结合，<strong>计划分批次发射共计1024颗高光谱定量卫星，目标是构建全球天覆盖的高光谱定量遥感星座</strong>，为客户提供小时级大气监测、天覆盖高光谱影像及高精度航线监测等服务。</p>\n  <p>具体到产品序列，谱星航天规划了载荷、卫星与技术服务三大板块，逻辑上依次递进，现阶段以载荷和卫星两大板块为业务推进重点。从卖载荷、卖卫星到卖服务，最终想成为具备核心载荷及卫星研制能力的光谱定量遥感数据运营商。</p>\n  <p>据创始人贺小军透露，谱星的团队规模已从年初的20人快速聚集至70余人，多数具备5到8年以上的航天光学遥感从业经验，其中近三成为AI与数据方向人才，这也是其下半年以来的招聘重点，AI技术已经渗透到系统研发、光谱遥感、数据处理以及遥感应用等全链条。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_410ee39b274640aa84b7d4614114d493@577536001_oswg1121886oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">长春谱星空间卫星工厂投入使用</p>\n  <p>当然，对于一家创业公司来说，资金和团队只是起点，人才密度、资本效率与组织效率的乘积，需要在业务进度上得到更直接的体现。</p>\n  <p>贺小军提到，长春谱星空间的卫星工厂已经投入使用，目前在研的16颗卫星及50余台光学载荷已经导入，正在开展小批量试制和工艺过程的持续迭代，预计最终产能还可以进一步提升。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_c08f833560cc46bf983c143abba4f4d8@577536001_oswg106306oswg1080oswg642_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">整星热真空试验</p>\n  <p>具体到产品落地的时间表，谱星航天为某客户研制的一颗科学探测卫星、两颗自主运营的光谱定量遥感卫星，目前均已进入总装环试阶段，其余十余颗卫星也即将进入桌面联试阶段。</p>\n  <p>按照贺小军的规划，2027年底谱星航天在轨运营的光谱定量遥感卫星将达到十余颗，开始地市级天覆盖定量遥感应用示范，公司也即将开始首批示范区的征集工作。</p>\n  <p>“<strong>客户的科学探测卫星预计能在春节前完成总装，一季度发射</strong>，完成该科学星座首发星验证，开展卫星平台及科学载荷性能评估，推动产品定型，为后续的30余颗小批量组网奠定基础。”贺小军表示。</p>\n  <p>“<strong>我们自主运营的两颗光谱定量遥感卫星预计一季度完成研制，4月份完成发射</strong>，开展卫星平台及大气同步探测光谱仪、高分辨光谱相机、压缩光谱成像仪等载荷性能评估，完成产品定型。”贺小军提到，这两颗自运营卫星也将输出试点区域的天覆盖数据用于定量遥感应用示范，并沉淀垂类遥感大模型训练所需的高品质数据集，为后续谱星1024颗卫星组网铺路。</p>\n  <p>商业化方面，此前我们了解到的是，谱星航天已签订的正式合同总额达数亿元，涵盖卫星定制、载荷研制及技术服务。但客观来看，目前谱星航天产品仍处于首台套研制阶段，尚未开始批量交付，收入释放存在时间差，业绩需要等到发射节点之后，随批产交付节奏逐步兑现。</p>\n  <p>贺小军透露，<strong>2026年公司的确认收入大约会在数千万量级。</strong></p>\n  <p>“今年的确是航天产业十年难遇的黄金窗口期，谱星抓住了机会。但我们也清醒地认识到，这种大风口不会持续太久，行业终归会回归常态。”在贺小军看来，只有不断为行业客户创造价值，才能把窗口期的热度沉淀为可复购、可持续的商业闭环。</p>\n  <p>客观来看，过去全球商业遥感领域的发展更多由供给驱动，卫星越造越多、分辨率越拍越高，但需求端并没有跟上，政府订单消化了大部分产能，真正的市场化收入占比有限。对商业用户来说，真正需要的是能够支撑业务的决策和判断——只有嵌入产业的实际生产流程，形成数据采集、处理、服务的正循环，商业遥感应用市场的空间才会真正打开。</p>\n  <p>谈及行业节奏与市场预期，贺小军表示，可回收火箭带来的发射成本下降已成共识，对谱星的商业闭环是重要助力。但另一方面，谱星卫星重量轻，通过合理设计甚至可实现“一箭百星”的快速发射，所以<strong>发射并不是主要瓶颈，真正的瓶颈在需求端，关键是遥感应用的付费意愿。</strong>“从大B到小B再到C，每一步商业模式的探索，都意味着资本、人力与技术的持续投入。当谱星的付费用户数量突破10万，或许就意味着航天遥感行业的拐点真正到来。”</p>\n  <h3><strong>投资机构评价：</strong></h3>\n  <p><strong>新鼎资本：</strong>谱星航天深耕高光谱定量遥感，兼具光学载荷自主研发和微纳卫星整星研制能力。公司核心团队既有整星总体设计经验，也经历过卫星批量研制和在轨验证。公司已凭借整星和光学载荷产品赢得客户订单，并规划建设自有高光谱星座，为未来持续提供遥感数据服务打下基础。新鼎资本长期关注商业航天产业链。我们看好星座建设带来的制造需求，也看好高质量遥感数据在行业应用中的长期价值。谱星从卫星研制向数据服务延伸的成长路径，正是本次投资吸引我们的地方。期待与团队长期同行，共同推动高光谱遥感的商业化应用。</p>\n  <p><strong>长发基金：</strong>空天信息是国家重点布局的战略方向，光谱定量遥感是商业遥感里高潜力赛道。谱星航天成建制的工程团队、自主可控的核心技术，以及“载荷&nbsp;-&nbsp;卫星&nbsp;-&nbsp;星座&nbsp;-&nbsp;数据服务” 一体化布局，具备很强的产业带动价值。我们作为联合领投方，看好谱星航天的技术路线与商业化潜力，期待和团队一起把高精度光谱遥感服务推向更多行业场景，为空天信息基础设施与遥感产业高质量发展贡献力量。</p>\n  <p><strong>闵金投：</strong>我们坚定看好谱星航天的发展。定量高光谱遥感是商业遥感赛道极具价值的方向，公司规划的星座具备广阔商业想象空间。同时公司立足光学载荷、微纳卫星研制，具备短期内订单落地、实现营收的能力，成长确定性突出。核心团队拥有一线航天工程经验，对行业规律理解透彻。本次投资也是对区内优质硬科技企业的加码支持，期待谱星航天立足闵行、发挥自身优势，赋能“火箭星城” 建设。</p>\n  <p><strong>长兴基金：</strong>卫星是系统工程之巅，而总体单位是这顶王冠上的明珠。谱星团队兼具航天“国家队”级的星座级工程实力与敏锐的市场化商业思维，拥有光学遥感领域全链条、工程化、产品化的头部一线经验，正是我们寻找的“链主”之才。我们投资谱星，投资的不只是一家企业，更是一条产业链、一个产业集群——以卫星总体为牵引，让结构、载荷、星载电子等上下游伙伴在长春开放集聚、协同共赢，让“造卫星，找长春”从愿景变为行业共识，成为这座城市崭新的产业名片。</p>\n  <p><strong>贵州省高新基金：</strong>谱星航天吸引我们的，是其站在高光谱遥感这一技术与产业发展的交汇点上，业务方向顺应高光谱遥感从定性观测走向定量应用的趋势。公司通过自主研制光学载荷和卫星，并延伸至数据处理和行业应用，着力推动遥感数据从“能够观测”向“能够量化”发展，让空间信息成为可用于产业决策的生产要素。目前，高光谱遥感在各行业中的应用仍处于持续拓展阶段，公司的产品和服务也正在更多场景中不断验证和完善。随着光谱遥感在各行业渗透率持续提升，谱星航天有望成为连接航天基础设施与行业数字化应用的重要纽带。</p>\n  <p><strong>崇山资本：</strong>谱星航天创始人贺小军博士，曾主持55颗卫星研制工作，深耕载荷、整星研制、数据运营全链路，是业内少有的覆盖三大环节的领军人物。公司锚定“光谱+定量”遥感核心路线，切入航天新兴赛道，差异化布局，避开与同行的正面竞争；依托光谱指纹识别、高精度辐射定标技术，实现遥感观测从“看见形态”到“读懂成分、量化指标”的跨越，打造独有的技术价值，首轨128颗卫星频轨资源已获批复，构筑起排他性先发优势。公司研发团队积淀深厚、专业功底扎实，兼具突出创新能力，为企业长远发展持续注入核心动能。崇山资本投资谱星航天，坚信谱星航天将秉持务实笃行的底色，向新而行，实现跨越式发展的战略目标。</p>", "category": "tech", "published_at": "2026-11-09T02:32:10+00:00", "fetched_at": "2026-11-09T04:20:06.927156+00:00", "fingerprint": "2399a97cbe483692"}, {"source": "36氪 - 最新文章", "title": "36万「中女」，一年买走52亿江南布衣", "url": "https://36kr.com/p/4061858250773385?f=rss", "summary": "<p><strong>作者 |&nbsp;谢芸子</strong></p>\n  <p><strong>编辑 | 张帆</strong></p>\n  <p>消费行业集体过冬的2026年，江南布衣反而迎来了巅峰。</p>\n  <p>10月20日，江南布衣报收23.2港元，当天达到上市以来的最高价23.66港元，年初至今累计涨幅超过29%。</p>\n  <p>支撑股价的，是公司发布的最新财报。</p>\n  <p>在截至6月30日的2026财年，江南布衣营收60.46亿元，同比增长9.0%；归母净利润9.97亿元，同比增长11.7%；毛利率66.6%，净利率16.5%。</p>\n  <p>另据浦银国际报告，2026财年后的7月至今，江南布衣流水持续获得高单位数增长，国庆黄金周的流水增长更是超过10%。</p>\n  <p>把对比维度放大到整个行业。</p>\n  <p>尽管江南布衣与安踏体育、波司登、海澜之家不在一个量级，但从股价及业绩涨幅看，今年以来，江南布衣算是领跑了整个行业。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_c6ea48b0c3f44f2fb4d8b0bce15d310e@394564713_oswg311675oswg1262oswg450_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">表格来自Wind；数据截自2026年11月5日</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_a316997de8e54a6c8902d333559db283@394564713_oswg49176oswg1044oswg567_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自Wind</p>\n  <p><strong>“小而美”的公司实现反超，多少有些反直觉。</strong></p>\n  <p>消费分级时期，非必选消费普遍焦虑；户外当道，传统时装品牌更多处于增长困境。</p>\n  <p>再从消费者感知看，江南布衣仍与两个标签相连：一是设计上“有些夸张、看不懂”，二是五年前的那场“邪典童装”风波。这些构成了大众对这个品牌的第一层“滤镜”。</p>\n  <p>挨骂与赚钱同时发生在一家公司，看似矛盾，实则是筛选的结果——<strong>江南布衣不需要人人喜欢，只需要喜欢的人一直购买。</strong></p>\n  <h3><strong>谁在为江南布衣买单？</strong></h3>\n  <p>1994年，李琳与丈夫吴健在杭州开始经营服装生意，随后转向自主设计。</p>\n  <p>独立分析师唐小唐回忆，江南布衣创立之初主打“反传统”路线，以“人文、自然、强调剪裁”的设计为特色，早期用户多是文化、传媒领域的知识分子。</p>\n  <p>这种基因延续至今，宽松廓形、自然色、棉麻等材质的肌理感，使江南布衣在商场拥有一定辨识度——它不依赖醒目Logo，消费者买的是“看起来就像江南布衣”，而不是某一件当季爆款。</p>\n  <p>最新财报中，JNBY的目标客户定义为25至40岁的现代女性，强调她们好奇心强，善于发现平凡生活中的惊喜与诗意。<strong>这是官方定位，并不等同于真实的会员画像。</strong></p>\n  <p><strong>社交平台上流传的另一个词或许更贴切——“中女”。这个词通常指30岁以上、有稳定消费力、为自我取悦穿衣的女性。</strong></p>\n  <p>有“老粉儿”告诉36氪，JNBY一开始的设计非常独特，“有些雷霆配色穿上身很好看”，“但设计经常神一阵鬼一阵”。</p>\n  <p>在她的感知中，购买这一品牌的多是一些“生活在一、二线城市、体制内或‘老企业’工作，有一定消费力的女性”。“她们逛商场不一定去奢侈品区，却也看不上朗姿、伊芙丽，觉得不够有设计感或是过于年轻”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_a2c37dd85b8743c6a11601bbe9e00535@394564713_oswg967204oswg1266oswg565_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">JNBY2026春夏新品；图片来自官方微博</p>\n  <p>当然，小规模样本不足以代表全部会员。</p>\n  <p>东吴证券7月报告显示，江南布衣的主力价格带为500至2000元，低于地素时尚的1000至4000元。<strong>这些女装都谈不上便宜，却能使消费者就算在低线城市，也能买到一种不完全追随大众、区别于快时尚与运动风格的服装。</strong></p>\n  <p>这批用户的购买力，最终体现在财报数据里。</p>\n  <p>按江南布衣2026财年的零售规模计算，一、二线城市带来的合计贡献52.3%，三线及以下城市贡献47.7%。这至少能说明，江南布衣的消费人群在各城市的分布相对均衡。<strong>而比会员画像更关键的，是复购。</strong></p>\n  <p>2026财年，江南布衣活跃会员账户超过61万个。对比雅戈尔在2021年披露的190万活跃用户，这一数据不算多，但购买力强。</p>\n  <p>报告期内，江南布衣会员贡献的零售额占比超过80%；年度购买超过5000元的高价值会员超过36万人，贡献零售额52亿元，占线下渠道零售总额超过六成。<strong>粗略折算，这批高价值会员2026财年的人均消费超过1.44万元，是公司真正的基本盘。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_5fbb22ac45114178b33404f65e11e0e6@394564713_oswg24325oswg894oswg204_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据公开数据制表</p>\n  <h3><strong>十年维修与“一个盒子”&nbsp;</strong></h3>\n  <p>对于服装品牌，设计负责找到第一批用户。但江南布衣所说的“自然、简约、诗意”，始终是“形而上”的表述，消费感知因人而异。</p>\n  <p>不只是江南布衣，同行对自身风格的定义也多是抽象标签。</p>\n  <p>太平鸟的定位是“悦享品质时尚”，不强调固定的设计师语言；地素DAZZLE则偏向都市潮流，东吴证券将其设计概括为“图案、装饰和不对称”，官方称之为“矛盾冲突美学”。</p>\n  <p><strong>不过，定位差异并不等同于鲜明的辨识度。</strong></p>\n  <p>疫情后，消费者更看重稳定性与普适性，各品牌今年秋冬的新品也呈现一定趋同。小红书等社交平台上，已有用户吐槽JNBY的风格越来越保守，“班味儿很重”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_ff44ac94077b4ff088b8dc7804a0445f@394564713_oswg1181529oswg1264oswg566_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">从左到右，依次为JNBY、太平鸟、DAZZLE的秋冬新品</p>\n  <p>当独特风格不再是优势，留住用户的砝码落到了运营。</p>\n  <p>江南布衣的会员体系主要有银卡与金卡两级，权益包括“专属折扣、生日特权、洗护福利、十年维修”等。</p>\n  <p>以往，这种“管家式”的服务多存在于奢侈品牌，且成衣类的产品保修基本在1年内。在中高端女装赛道，江南布衣的会员服务是绝对的少数派。</p>\n  <p><strong>在帮助会员降低洗护成本的同时，江南布衣还替消费者——尤其是那部分没时间逛街的职业女性节省了决策成本。</strong></p>\n  <p>《21世纪商业评论》曾报道，江南布衣花费两三年的时间打磨了一套算法，其中的“线上数据洞察看板”为会员添加了“材质、版型、颜色”等偏好标签。导购会根据这些标签，主动推荐产品。</p>\n  <p>按公司CMO黄盛的表述，这套系统的推荐命中率达到70%；基于会员标签的广告投放效率同样可观——在腾讯平台的时尚女装领域“投1元挣7元”，ROI仅次于UR和优衣库。</p>\n  <p><strong>比标签更具感知力的是“BOX+不止盒子”。</strong></p>\n  <p>公开资料显示，在江南布衣，用户每年只需花费399元，就可以收到6次搭配好的服装组合。免费试穿，中意的留下，不适合的退回。&nbsp;</p>\n  <p>此外，针对金卡会员，江南布衣还特别推出了“1对1”搭配师的定制服务。&nbsp;</p>\n  <p>到这里，私域的闭环已经完成——<strong>设计负责筛选，服务负责留下。</strong>腾讯智慧零售也曾披露，江南布衣的企业微信社群渗透率达到35%，属于行业头部水平。&nbsp;</p>\n  <h3><strong>一年只净增1家店</strong></h3>\n  <p>与会员服务形成对照的，是近乎“抠门”的线下拓店。</p>\n  <p>2026财年，江南布衣全球门店总数为2118家，全年仅净增1家。这并不意味着渠道停滞：2026财年年中，公司门店总数一度达到2163家，下半财年净减少45家。门店调整的同时，渠道结构也在变化。</p>\n  <p>全球范围看，江南布衣自营门店全年净增9家至501家，经销商门店净减8家至1617家。报告期内，自营收入同比增长10.7%，经销收入仅增长1.3%；2025财年则是自营收入下滑6.2%、经销收入增长9.6%。</p>\n  <p><strong>两年间的此消彼长，或许反映出公司现阶段的渠道取舍。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_6798eda0041647d8939b5ec2e6804791@394564713_oswg6835oswg803oswg86_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据财报数据制表</p>\n  <p>门店之外，精打细算的还有货品。</p>\n  <p>江南布衣没有线上专供款，全国门店与线上共享“一盘货”，减少缺码、断货与局部滞销。在零售行业，线上线下打通是数字化的重要一环，江南布衣则把这笔收益直接算了出来。</p>\n  <p>2026财年，库存共享及分配系统为江南布衣带来的增量零售额达到14.05亿元，同比增长23.6%。这部分增长来自现有货品与渠道的重新匹配，而非简单的扩店。</p>\n  <p>同期，江南布衣线上收入增长20.5%，线下仍贡献约76%的收入。线上负责持续触达用户、调配货品，门店继续提供试穿、面料感知和搭配服务。</p>\n  <p>可以看出，江南布衣不是停止扩张，而是选择性扩张：关掉低效店，把资源投向高端购物中心、优质点位，进行店铺升级。它关注的不在门店数量，而是新店能否带来增量，现有门店能否产生持续收益。</p>\n  <p><strong>这种选择，也建立在购物中心对其招商价值的认可上。</strong></p>\n  <p><strong>“江南布衣一直是购物中心重量级的招商品牌，只要想做零售都会跟它联系。”</strong></p>\n  <p>在上海购物中心协会品牌专业委员会秘书长杜斌的观察中，江南布衣的门店销售相对平稳，这种平稳在疫情后更显珍贵。“自2026年以来，只要是持续开店的品牌，都会被购物中心重视。”</p>\n  <h3><strong>只做固定的生意，天花板已现</strong></h3>\n  <p>只不过，江南布衣的增长焦虑并没有消失。</p>\n  <p>唐小唐的判断指向更长期。他认为，江南布衣的核心客群规模基本固定，已触及天花板，后续无大规模拓客空间。且与疫情前相比，公司近年来的营收增速明显放缓。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_4546a34bc2b2460bbe14dac51162732e@394564713_oswg164430oswg1252oswg723_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind数据制图</p>\n  <p><strong>关键问题在于，江南布衣除主品牌之外，尚未出现同等量级的增长引擎。</strong></p>\n  <p>近年来，江南布衣也在发展更偏年轻通勤的LESS。在唐小唐的介绍中，集团对LESS的定位类似Miu Miu与Prada的层级关系。</p>\n  <p>2026财年，LESS营收7.31亿元，同比增长17.4%，且其毛利率达到70.2%，甚至超过主品牌JNBY的69.9%，是集团内毛利率最高的品牌之一。‌</p>\n  <p>不过从部分消费者感知看，LESS与JNBY的风格差异不大。它能否形成足够清晰的第二客群，仍需观察。</p>\n  <p><strong>更明显的短板在速写。</strong>这个2005年推出的男装品牌，2026财年收入下降1.1%至7.12亿元，门店由308家减至283家。</p>\n  <p>CEO吴华婷说得直接：“我没有办法改变男性穿着和喜好的习惯。”这句话也揭示了家庭复购的限度。江南布衣至今未把在女装积累的认同复制到男性品牌。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_8985e63646aa4333ae16dd90e684756c@394564713_oswg106367oswg827oswg319_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据财报数据制表</p>\n  <p>值得关注的是，江南布衣仍在寻找新的入口。2026年9月，江南布衣宣布与意大利高端鞋履及皮具品牌Marsèll合作，独家负责其在大中华区的运营。</p>\n  <p>财报会上，CFO范永奎特别提到“江南布衣要成为一个有国际影响力的百年品牌”，重点向海外市场和生活方式两大方向长期布局。至少目前，江南布衣的海外收入占比仅0.6%，新品类也未见水花。</p>\n  <p>在这一过程中，外部竞争不只来自女装竞品。</p>\n  <p>Euromonitor数据显示，2019年至2025年，国内女装市场规模复合增速约-0.7%，同期运动服市场复合增速约4.6%。两组数据不能直接证明运动服与女装的替代关系，但<strong>‌‌当人们更愿意为功能性与运动场景支付溢价，中高端女装的消费优先级自然下降。</strong></p>\n  <p><strong>有江南布衣用户对36氪坦言，近年来她的衣橱更多是lululemon以及不需要费精力打理、有自然褶皱的Pleats Please。</strong>前者提供运动场景和身体感受，后者提供设计辨识度，两者分走的是同一批客群的预算与品牌注意力。</p>\n  <p>增长的故事讲到这里，股东回报是另一本账。</p>\n  <p>2026财年，江南布衣派息率达110%，这份“慷慨”涵盖上市十周年的特别派息，也足以证明现金流充裕。<strong>但特别股息本身不能代替对新客、新品牌和新品类的投入。</strong></p>\n  <p>现如今的江南布衣，已向市场证明了小众审美可以做成一门超过60亿的生意。接下来要回答的问题是——除了让老客继续买，如何吸引更多新人下单。如果这个问题迟迟没有答案，高分红也只意味着一家成熟公司的暂时性收获，而非下一轮增长的开始。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_3d4bd354d84c467684fae9ae4f4eeeb4@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzIzOTk2Mjc1Mg==&amp;mid=2247629433&amp;idx=1&amp;sn=1d0574c8bc038198295faba4cad9cd1f&amp;chksm=e839f268f085f3448d0e5cfa0bcc23c7c94c4bd3932e2c4ca6235f876c31b1dcf85519a52d1f&amp;mpshare=1&amp;scene=1&amp;srcid=1109ALJzNHdlJWTi1eMHaEMg&amp;sharer_shareinfo=4f3a10f0139e3443a0c89153813aa3e5&amp;sharer_shareinfo_first=4f3a10f0139e3443a0c89153813aa3e5#rd\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;张帆，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-11-09T02:39:33+00:00", "fetched_at": "2026-11-09T04:20:06.927148+00:00", "fingerprint": "5675fcbc6223ea77"}, {"source": "36氪 - 最新文章", "title": "122天、团队不止翻倍，耐克首批本土源创系列幕后｜专访", "url": "https://36kr.com/p/4059160873046920?f=rss", "summary": "<p>很长时间，耐克在中国最为人称道的“本土化”，几乎都在广告里。</p>\n  <p>2008年8月18日，刘翔在鸟巢因伤退赛，次日耐克在报纸上登出新广告：“爱运动，即使它伤了你的心。”2020年春节，W+K上海为耐克拍了一支短片：姑姑和侄女为一个红包你推我让，从客厅一路较劲成一场体能对决。人们记住了广告里的中国式人情，却很少有人记得那几年耐克在中国卖的是哪件衣服。</p>\n  <p>上个月，这家运动巨头在中国推出首批由本土团队设计的系列，作为对外界质疑这家公司创新速度和能力的回应。</p>\n  <p>“中国市场是一个能够不断激发灵感、创造产品的地方，中国消费者的独特性为耐克提供了一个很好的机会，让我们能进一步投入本土消费者洞察。”负责这一系列的耐克大中华区本土产品源创副总裁Flavia Cervantes告诉36氪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261108/v2_1b2c1b5a1a9b4595b34c11b439fed711@5922386_oswg4611107oswg2000oswg2999_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐克大中华区本土产品源创副总裁Flavia Cervantes&nbsp;</p>\n  <p>加入耐克前，Cervantes在奢侈时尚和生活方式品牌工作了约十年。在耐克，她先在全球产品创新团队任职，后加入欧洲、中东及非洲区（EMEA）的本土产品团队Express Lane。</p>\n  <p>这个团队的历史要追溯到2017年前后：耐克推行“消费者直接攻势”（Consumer Direct Offense）战略，在北美、西欧和中国先后设立Express Lane，任务是“快速创造、更新和交付产品，以回应消费者需求”，目标是把产品开发周期缩短一半。</p>\n  <p>2017年也是球鞋文化的顶峰，耐克几乎独占鳌头，与Off-White合作的“The Ten”正是那一年发布。复刻和联名在全球卖得火热，Express Lane做的更多是“更新”：在现有鞋型上换材料、换配色，推动售罄。设在上海的Express Lane还要同时服务上海��首尔和东京，更像一个面向东亚的快速反应中心，而不是专为中国设计产品的团队。那些年耐克的“中国特供”，多半是春节限定的红金配色和刺绣，很少触及版型本身。</p>\n  <p>但按照Cervantes的说法，一切都和过去不一样了。</p>\n  <p>“我们正在投入大量资源扩充团队。”Cervantes说，<strong>团队规模“超过翻倍”。</strong>更大的变化在职能上：团队补充了过去没有的能力和岗位，从材料、面料的选择到廓形设计、产品线搭建，都在上海完成。</p>\n  <p>速度也变了。据《华尔街日报》，耐克一款新品从开发到上市，通常需要约18个月，一些鞋类的开发周期还要更长。但首批本土源创系列只用了122天，Cervantes说，这“很可能是耐克有史以来最快的系列”。<strong>至于往后的节奏，她不愿剧透，只说一年推出的系列“不止三次”。</strong></p>\n  <p>首批系列分为Nike 流形系列和Jordan立势系列两条线，只有服装。设计以纯色为主，靠廓形、剪裁和叠穿说话，比耐克过去带中式元素的产品克制得多：一套裙裤可拆可叠，有三种穿法；部分外套采用三合一设计，应付换季和不同场合。团队还为中国市场开发了五种新面料。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261108/v2_972047ceae864d4f9e195c910bf3beb2@5922386_oswg164091oswg1500oswg900_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐克在本届进博会上展示第一季本土源创系列｜来源：品牌</p>\n  <p>首批产品偏向生活方式，这也恰恰是运动鞋服里最受潮流左右、也最容易陷入折扣的品类。Cervantes表示，后续将扩展到专业运动，并做到“从头到脚”统一设计，鞋类也会加入。</p>\n  <p>“我们说快速推出新品，不是为了追潮流，也不是为了快而快。”在Cervantes看来，追上潮流只是第一步，持续交付好产品、让年轻人“一再回到我们这里”，才是耐克的目的。<strong>为此，团队也在摸索：属于中国市场的产品“一致性”是什么。</strong></p>\n  <p>所谓一致性，即是让消费者在看到logo之前就认出你。1982年，Bruce Kilgore设计的Air Force 1作为篮球鞋问世，按惯例一两季后就会停产；巴尔的摩三家零售商不断向耐克求货，这双鞋才在1984年重回货架。此后四十年，耐克几乎没动过它的鞋型，只是一年年地换配色、做联名，把一双白色AF1做成了街头的基本款。</p>\n  <p>1987年，建筑系出身的Tinker Hatfield受巴黎蓬皮杜中心外露结构的启发，在Air Max 1的中底开了一扇窗，让气垫“被看见”；此后Air Max家族一代代改款，那扇窗始终都在。这些鞋没有去追潮流，但最后潮流总是能够回到它们身上。</p>\n  <p>而经典最初的生命力，往往来自离消费者最近的地方。AF1当年能够回到货架，靠的不是总部的判断，是巴尔的摩街头的需求。Cervantes的团队也想从这里起步：团队成员的爱好本身就是素材库，有同事参加越野跑和徒步群，有不少跑者，也有人本身就是艺术家和创作者。她来中国两个月，对小红书上消费者拆解产品、讨论细节的专业程度印象深刻。</p>\n  <p>“我们真正想做到的，是看到自己的产品也能被这样审视和展示：它们能解决问题，搭配得当，并带有只有耐克才能提供的创新。”</p>\n  <p>首批源创系列以限量形式只在部分线下门店发售。被问及是否会像ACG那样开设专门门店，Cervantes表示本土源创系列将是耐克零售新概念的重要组成部分，也没有透露线上安排。</p>\n  <p>不过，据我们了解，耐克未来很长一段时间都将以线下为重心，目的是重塑品牌的高端形象。从2027年1月1日起，滔搏、宝胜在电商平台上经营的耐克线上店铺也将停止运营。</p>\n  <p>“但我们最想要的，是这种面对面的体验，让消费者亲眼看到、亲手感受我们做了哪些不一样的事。”Cervantes最后说。</p>", "category": "tech", "published_at": "2026-11-09T02:39:59+00:00", "fetched_at": "2026-11-09T04:20:06.927139+00:00", "fingerprint": "61cefff3f28a94c0"}, {"source": "36氪 - 最新文章", "title": "「国家队」的作业不好抄", "url": "https://36kr.com/p/4061923101660041?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄绎达</p>\n  <p>编辑&nbsp;|&nbsp;张帆</p>\n  <p>时隔两年，A股投资者又听到了一个熟悉的声音：“924又来了？”</p>\n  <p>11月2日，央行、金融监管总局和证监会再度联手，推出了一系列稳定资本市场的政策举措：包括开展新一轮证券、基金、保险公司互换便利操作，将股票回购增持再贷款转为长期制度性安排，并将再贷款利率由1.25%降至1%。</p>\n  <p>与此同时，证监会宣布拟优化上市公司股份回购规则，进一步放宽回购条件，并推动新募集的18只主动ETF加快建仓，为市场提供增量资金支持。中国国新、中国诚通等“国家队”资金的投资动向也再次引发市场关注，由此进一步强化了投资者对“国家队”在市场低迷时期入场的预期。</p>\n  <p>更为关键的是，上述举措很容易让投资者联想到2024年9月24日的那场政策发布会。当时，央行行长潘功胜在介绍首期5000亿元互换便利工具时明确表示，如果实施效果良好，还可以再来5000亿元，甚至第三个5000亿元。这番近乎“弹药无限”的表态，极大提振了投资者信心，随后A股开启了一轮迅猛上涨，由此诞生了令人印象深刻的“924行情”。</p>\n  <p>不过，与当时的政策力度相比，本轮央行的表述明显更加温和，政策重心更多落在现有工具的优化和落实上。11月3日，央行开展了1000亿元互换便利操作，政策支持依然明确，但节奏相对克制。某种程度上，经历了上一轮市场短时间内的大幅上涨，管理层或许也更加重视市场修复的节奏，在稳定投资者信心的同时，又要避免短期的情绪过热。</p>\n  <p>那么，国家队的入场是否意味着A股已经触底了呢？这次“924行情”还能重演吗？</p>\n  <h2><strong>历史复盘：国家队的抄底表现如何？</strong></h2>\n  <p>在过去近20年中，中央汇金、证金公司等“国家队”资金已经多次在A股市场大幅调整期间入场。从历史表现来看，国家队的买入时点往往接近市场的阶段性底部，而且随着国家队资金的进场，A股在多数情况下均有不同程度的反弹。虽说国家队不是每次都能够精准的抄到最低点，但中长期表现已然证明其具备极强的择时能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_43b77ce8b8d04af4a3d0ff2c772758df@5426566_oswg436302oswg1080oswg528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：近二十年国家队入场与A股大盘表现；资料来源：华西证券，36氪</p>\n  <p>2008年，全球金融危机持续蔓延，A股大盘在经历近一年的大幅下跌后，市场情绪已经极度低迷。同年9月，中央汇金宣布增持工商银行、中国银行和建设银行，并承诺未来一年继续增持。</p>\n  <p>此后，上证指数继续下探，并于10月末触及1665点的阶段性低位；随着国内货币政策转向宽松，叠加四万亿投资计划的刺激，以及全球金融市场逐步恢复稳定，A股则开启了一轮大幅反弹。至2009年8月，上证指数最高回升至盘中3478点，较前期低点累计上涨超100%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_fc484e6d4a1f46909c9b8baff1d708fc@5426566_oswg249388oswg1080oswg793_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：上证指数2008~2010年间表现；资料来源：wind，36氪</p>\n  <p>2011年至2013年，A股又经历了一轮持续时间较长的市场调整。</p>\n  <p>在此期间，面对经济增长放缓的压力、货币政策转向紧缩及欧债危机的冲击，中央汇金于2011年10月宣布增持工、农、中、建四大行股票；2012年10月，汇金再次宣布增持四大行，并承诺未来六个月还将继续买入。不过，这两次增持均未能立即扭转市场下跌的趋势，直到2012年12月，上证指数才出现一轮阶段性反弹，但力度相对有限。</p>\n  <p>2013年6月，国内市场流动性骤然收紧，A股则出现了大幅度的下跌调整，汇金公司于6月下旬宣布增持银行股和保险股。在国家队下场的同时，市场资金面紧张的局面也逐步缓解，上证指数在1849点（6月25日）附近见底，随后开启一轮V字型反弹，到当年9月的阶段性高点，指数累计上涨15%。</p>\n  <p><strong>2015年的股灾可以说是国家队大规模入场最具代表性的案例。</strong></p>\n  <p>同年6月，上证指数在站上5178点历史阶段性高点后迅速下跌，投资者恐慌情绪快速蔓延，集中抛售引发市场踩踏。汇金公司于7月宣布已在二级市场买入相关ETF产品，并将继续相关操作，证金公司等机构也相继采取稳定市场的措施。</p>\n  <p>国家队入场后A股并未立即终结下跌，而且还在当年8月再次出现大幅调整，直到2016年1月才真正触底。随着持续的去杠杆，市场流动性压力明显缓解，A股才逐渐恢复稳定；从大盘指数开始反攻，至2018年1月下旬的阶段性高点，上证指数从2016年初低点累计反弹约34%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261109/v2_ef4ce6fcb1ec4bea91aaa3e0957017ee@5426566_oswg254969oswg1080oswg793_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：上证指数2015~2018年间表现；资料来源：wind，36氪</p>\n  <p>最近一轮典型的国家队入场发生在2023~2024年间。2023年10月，汇金公司宣布增持四大行，并计划未来六个月继续增持。2024年2月，汇金公司进一步宣布扩大ETF增持范围，加大增持力度。彼时，A股已经经历了长时间的调整，市场估值和投资者情绪均处于近10年的低位。此后，上证指数从2024年2月~5月间有一轮小幅反弹。</p>\n  <p>尽管市场随后再度调整，但在9月24日，央行、金融监管总局和证监会联合推出一揽子金融政策，市场对流动性环境和经济前景的预期明显改善，投资者信心迅速恢复，推动A股迎来一轮快速上涨。至10月8日，上证指数盘中最高触及3674点，较9月低点累计反弹36%，成交额也在当时刷新历史新高。</p>\n  <p>从国家队历次入场的时机来看，虽然未必是抄在市场的最低点，但大多处于A股深度调整、投资者情绪极度低迷的阶段，即便入场后大盘还会继续下探，随着市场环境的逐步改善，后续往往能够迎来一轮较为可观的反弹。<strong>由此可见，国家队的抄底能力主要体现在能够把握市场深度调整带来的投资机会，并具备承受大幅波动的能力。</strong></p>\n  <h2><strong>02 国家队的优势：买得低，也拿得住</strong></h2>\n  <p><strong>首先，市场深度调整往往伴随着非理性抛售，为国家队提供了合理的买入机会。</strong></p>\n  <p>在A股深度调整的后期，市场往往会出现超出基本面变化的恐慌性抛售，资产价格下跌加重投资者焦虑，止损与杠杆平仓又推动价格继续下行，由此形成负反馈循环，2015年股灾便是如此。</p>\n  <p>在上述交易环境中，市场估值整体被快速压缩，并存在大面积错杀的情况。国家队恰恰在情绪最为恐慌、风险溢价较高的时候为市场提供买盘，因此期间整体的持有成本相对较低。随着政策、流动性等利好的持续释放，被动抛售减弱、市场预期改善，前期过度压缩的估值便具备了修复空间。</p>\n  <p>国家队历次抄底的操作，恰恰体现了巴菲特那句经典的投资理念：“在别人贪婪时恐惧，在别人恐惧时贪婪。”</p>\n  <p><strong>其次，国家队更突出的优势在于长期持有能力，这也是普通投资者最难复制的核心点。</strong></p>\n  <p>跌多了会反弹可以说是常识，而真正困难的是在买入后承受继续下跌的痛苦。即便估值已经足够便宜，但投资者还是会受到浮亏、仓位约束、杠杆、情绪压力等因素的影响，特别是在持续下跌且无重大利好，反弹看似遥遥无期的时刻，投资者很容易怀疑当初的判断。</p>\n  <p>再看国家队，不仅承担稳定市场的政策职能，能够在市场波动较大时保持持续投资，负债端相对稳定。即使入场后出现浮亏，国家队的定力也使其具备跨越较长周期的能力。2015年7月国家队入场后，市场又经历两轮深跌，正好说明与买到最低点相比，是否拥有足够的资金和定力更为重要。</p>\n  <p><strong>第三，国家队入场往往与政策环境的改善相互配合，进一步提高了市场反弹的可能性。</strong></p>\n  <p>国家队直接买入股票或ETF，主要意在承接抛盘、缓解短期流动性压力，并向市场释放稳定市场的政策信号。但是根据历史经验，市场反弹往往需要重大利好的持续释放，这些利好主要分为以下三类：</p>\n  <p>1.流动性改善，典型如2008年的降息降准、2015年后杠杆压力逐步缓解；</p>\n  <p>2.政策支持，如2008年的大规模投资计划、2024年9月的政策组合拳；</p>\n  <p>3.外部环境缓和，如2008年全球金融危机后的风险偏好修复。</p>\n  <p>从节奏来看，国家队作为稳定市场的政策工具，进场通常在市场需要支撑的时候，而上述利好则往往在国家队入场后逐步显现。从2008年汇金宣布增持到2009年市场反弹，从2024年2月扩大ETF增持规模到9月政策转向，都能看到这种先进场稳定市场、再等待利好释放的过程。</p>\n  <p><strong>国家队凭借稳定的资金来源和较强的持有能力，能够承受政策见效前的市场波动，并静待市场反弹带来的投资回报。</strong></p>\n  <p>所以，国家队入场为投资者提供了重要的投资信号，而真正决定反弹力度和持续性的关键因子，是流动性、政策面和基本面的改善预期。因此，国家队抄底最值得普通投资者借鉴的，或许就在市场极度恐慌时，为自己的判断留出足够长的兑现时间，较强的定力才能让这份潜在回报有机会转化为最终的投资收益。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-11-09T02:44:37+00:00", "fetched_at": "2026-11-09T04:20:06.927124+00:00", "fingerprint": "ee67ab4851e6c05c"}, {"source": "少数派", "title": "苹果产品那些不够颠覆，却值得被学习的细节", "url": "https://sspai.com/post/118114", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/118114\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-08T03:18:54+00:00", "fetched_at": "2026-11-09T04:20:05.559257+00:00", "fingerprint": "543d4ee10b08d01c"}, {"source": "少数派", "title": "派早报：特斯拉将停产 Cybertruck", "url": "https://sspai.com/post/118805", "summary": "<p>特斯拉将停产 Cybertruck</p><p>深圳在 APEC 前夕整顿非法市场</p><p>美国数据中心股持续遭抛售，大量建设项目被取消</p><p>京津冀三地消协组织敦促航司、平台规范机票退改签</p><p>FBI 警告冰柜网络安全攻击风险</p><p>广电总局部署开展新一轮微短剧专项治理工作</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/118805\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-08T22:41:56+00:00", "fetched_at": "2026-11-09T04:20:05.559250+00:00", "fingerprint": "8f86ea1ee9c83da8"}, {"source": "少数派", "title": "双十一好物精选：Sonos Play 85 折送充电套装，CD 机加赠透明面盖", "url": "https://sspai.com/post/118612", "summary": "从墨水屏到手机壳，从磁吸信息屏到CD播放器，这些看似平常的数码产品，经过一些新的设计和尝试，也能带来不太一样的使用体验。今年双十一，各大平台的促销活动陆续开始，不过满减、凑单等规则可 .99. Considering an annual Costco membership runs $65, that discount almost offsets [&#8230;]", "category": "tech", "published_at": "2026-11-07T16:00:00+00:00", "fetched_at": "2026-11-08T04:03:41.890546+00:00", "fingerprint": "949ca82ab4607078"}, {"source": "The Verge", "title": "The UV-tracking Gem made me rethink how sunlight affects my health, not just my appearance", "url": "https://www.theverge.com/tech/1023230/the90-gem-necklace-hands-on-impressions", "summary": "With temperatures rising to the 90s in Los Angeles, avoiding the heat wasn't exactly an option while I was at a relative's outdoor party in August. So I sat beneath a patio umbrella with a powerful fan nearby, figuring I was protected from the sun and heat. Half an hour later, I felt exhausted, dizzy, [&#8230;]", "category": "tech", "published_at": "2026-11-07T17:00:00+00:00", "fetched_at": "2026-11-08T04:03:41.890535+00:00", "fingerprint": "70f1531fce2b0561"}, {"source": "36氪 - 最新文章", "title": "运动市场，打到骨折", "url": "https://36kr.com/p/4055180749198208?f=rss", "summary": "<p>文｜贺哲馨</p>\n  <p>编辑｜乔芊<br />&nbsp;</p>\n  <h3>调整</h3>\n  <p>2026年下半年，你很难找到一份好看的运动品牌财报。</p>\n  <p>国内头部品牌在同一季度首次集体出现零售流水负增长。安踏和FILA季度流水同比下跌，是2022年后的首次。李宁流水低单位数下降，电商是唯一的增长。特步主品牌同样中单位数下跌。361度是四家头部中唯一全线增长的一家，上半年营收增速也已放缓至8%。</p>\n  <p>耐克仍在下行通道，最新季度营收112亿美元，下降5%，管理层预计2027年全年营收下降个位数。彪马的降幅收窄至6.3%，但仍在下滑。</p>\n  <p>还在增长的国际品牌中，阿迪达斯三季度营收增长7%，但主要靠服装，鞋类与去年持平。昂跑二季度按固定汇率增长21.6%，最大的美洲市场只增长13%，不及预期；HOKA增速继续放缓至6.8%，母公司下调其全年增长预期至个位数。</p>\n  <p><strong>但流水数字本身不是重点，重点是它背后的信号：运动市场似乎正在经历一轮全球范围内的促销周期。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_4b0eb8b54bf3485ebed5bef39f908a1f@5922386_oswg255148oswg2400oswg1424_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">制图：36氪</p>\n  <p>北美和欧洲市场的促销和折扣集中在经典款和生活方式鞋类。在最新一季的财报电话会上，阿迪达斯CEO比约恩·古尔登认为“欧洲和北美市场已经饱和”，对生活方式鞋类的销售产生影响。他提到，“行业的一些主要产品线正在大幅打折”。</p>\n  <p>Dick's Sports将促销的源头归结到品牌本身。“一些品牌在自己网站上大幅促销，外溢到整个市场”，首席执行官Ed Stack说。言下之意是，<strong>头部品牌牵头打折，让经销商不得不跟进。</strong></p>\n  <p>Dick's Sports在全美拥有超过850家门店，是最大的运动全品类连锁经销商，主力售卖经典和生活方式鞋款，因此受到折扣冲击较大。通常来讲，生活方式鞋类定价更低，折扣频率和幅度大，更容易受到整体市场环境的波动。</p>\n  <p>除了休闲品类之外，专业产品也并未能幸免于此次风暴，但这似乎是国内市场特有的处境。</p>\n  <p>过去两年，国产品牌大量生产碳板专业跑鞋，导致产能过剩，市场陷入价格战。电商平台让比价更直接透明，专业跑鞋的价格水位被大幅度拉低。下半年，耐克自有渠道和第三方经销商开始大幅打折。专业跑鞋的价格水位继续下沉，国产品牌的生存空间被两头挤压，折扣幅度和库存指标随之加深。</p>\n  <p>国信证券数据显示，三季度末安踏主品牌全渠道库销比（即期末库存金额与当期销售金额的比例）约5个月，同比持平；大货线下折扣约71折，同比持平；线上折扣48折，同比加深2个百分点。FILA大货全渠道库销比维持在6个月以下，同比改善0.3个月；线下折扣72折，同比加深2个百分点，线上折扣接近6折，同比持平。</p>\n  <p>据中金数据，2024年三季度，特步主品牌零售折扣约七五折，库销比约4个月；特步公告显示，2026年三季度零售折扣为七至七五折，库销比升至4.5至5个月。两年间，折扣小幅加深，库存压力增加。</p>\n  <h3>各家反应</h3>\n  <p>按照行业惯例，运动品牌新品上市3个月内通常维持原价，3个月后才逐步进入八折区间。但在眼下的折扣环境里，各品牌新品的打折节点都不同程度地提前，折扣幅度也更深。</p>\n  <p>据媒体报道，7月，一款定价649元的耐克新品发售十余天后，价格就跌到五折左右；一款4月上市、定价999元的耐克跑鞋，7月在滔搏线上店以六折出售。后一件事的背景是：耐克宣布收回线上经销权，经销商要赶在年底前清仓。</p>\n  <p>国产品牌的折扣幅度与此相当。不同的是，在国际品牌渠道清仓式打折的冲击下，国产品牌连专业旗舰也难守价格：特步8月发布的160X 8.0 PRO，如今在旗舰店约六折即可入手；安踏最新的顶级碳板竞速鞋C10 PRO 2，线上已出现五七折的优惠。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_4c7e9b147e5347abace0607de7837658@5922386_oswg224554oswg2400oswg1564_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">制图：36氪</p>\n  <p>对占据大部分货架的国际品牌来说，减少出货是清理市场最快的办法，能缩短阵痛期。</p>\n  <p>耐克从2023年前后开始逐步削减Dunk、AJ1和Air Force 1等经典鞋款的供应。Dunk新配色从2023年的150多款，减到2025年的几十款；最新一季，Dunk的收入又被主动砍掉近一半。即便如此，市面上仍能见到多年前推出的Dunk在售。耐克时任CFO在6月称，售罄（sell-through）\"依然困难\"。</p>\n  <p>过去一年，阿迪达斯将重心放在服装上。古尔登提到，Originals鞋类目前负增长，但库存“低得多”，新品也在控制节奏，因为“把新品推进打折环境没什么意义”。</p>\n  <p>Samba之后，阿迪达斯并没有贸然推出下一款生活方式鞋，从去年的Superstar到今年的Stan Smith，阿迪达斯始终在谨慎试水休闲时尚品类的市场反应。此外，它还需要承受彪马“不计代价”的库存处理，这让古尔登对欧洲市场第四季度改善没有抱太高的预期。</p>\n  <p>采取减少出货的还有昂跑。这家公司在第二季度就已经主动缩减了面向北美批发商的供货量，导致当季北美批发渠道仅增长12.7%，不足去年同期增速的一半。管理层无法就市场何时恢复正常给出答案，但表示第三季度北美批发终端动销较第二季度明显回升。</p>\n  <p>增速持续放缓的HOKA，一边强调高端定位和全价销售，一边已经开始下探价格带。明年1月，定价115美元的Fly Pace将上市，用来吸引新消费者；HOKA还将推出受1970年代跑鞋启发的低帮鞋款Cielo 70，加码生活方式品类。CEO Stefano Caroti承认，HOKA可能在“120美元以下更紧凑的价格带”丢掉份额。</p>\n  <h3>何时回归</h3>\n  <p>针对这轮促销的起因，一种主流观点认为这是供给问题，而非需求问题。</p>\n  <p>Glossy今年7月的一篇报道援引行业人士称，如今北美促销环境很大部分是因为大型品牌在过去三年推出了过多的鞋款，客观上造成了市场供应大于需求。古尔登和耐克CEO贺雁峰（Elliott Hill）也在不同场合承认了供给过剩：古尔登说，一旦供应减少，“你们就会再次看到好的数字”；贺雁峰则承认，耐克在Jordan上“一直在过度供应经典复刻款”。</p>\n  <p>至于这部分鞋款何时清完，一心清库存的彪马CEO Arthur Hoeld表示，公司库存将在年底前恢复正常；古尔登则推测，到2027年下半年，“我们会处在不同的局面”，但他也说“可能只是希望和推测”。</p>\n  <p>但也有分析师认为，促销环境的本质是整个运动市场创新乏力，新品没有对上消费者的需求。Stifel分析师Peter McGoldrick在今年的返校季运动鞋调查中，把总主题概括为“缺乏新意”，称调查结果显示“灵感匮乏”。在此之上又叠加了通胀等外部因素，市场整体不景气。</p>\n  <p>市场调研公司Circana的数据显示，今年三季度，美国鞋类销售额与去年同期持平，销量则下降中个位数。Circana鞋类与配饰行业顾问贝丝·戈德斯坦（Beth Goldstein）说，消费者仍会为“能表达身份认同”的鞋买单，前提是品牌拿出“让人觉得相关”的产品。</p>\n  <p>再看国内。7月、8月全国服装鞋帽零售额分别同比下降1.0%和0.5%，9月才转正，靠的是电商交易增长，线下渠道仍然疲软。</p>\n  <p>在世界杯带来的服装热度退去之后，阿迪达斯选择再次在专业领域发力。明年，阿迪达斯将跑鞋品类延展出Hyperboost和Supernova，分别对应舒适和日常。<strong>古尔登对36氪表示，阿迪达斯已经拥有了“市面上最好的专业竞速跑鞋”，接下来的任务就是将产品优势扩展到更广泛的大众跑者群体。</strong></p>\n  <p>耐克的动作同样密集。10月13日，它在中国推出首批“本土源创系列”，包括NIKE Sportswear流形系列和JORDAN Streetwear立势系列，主打一件多穿、适应不同天气。贺雁峰称这是首个“出自中国、为中国打造”的系列，并且刻意只在线下门店首发。耐克中国团队正尝试把产品从概念到消费者的周期压缩到120天。</p>\n  <p>专业线上，耐克两个月内推出了4款跑鞋创新，从面向4小时以上跑者的入门竞速鞋Swooshfly，到采用双层Air Zoom的超级跑鞋。11月1日的纽约马拉松上，瑞典选手Andreas Almgren穿着尚未发售的Apex夺得男子冠军。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261104/v2_fb23ccb09ea343bf8ccdd1897bd8f061@5922386_oswg165726oswg430oswg430_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">脚踩NIKE Apex的纽约马拉松跑者</p>\n  <p>国产运动品牌则继续把掘金方向放在户外，这里有始祖鸟口碑受挫后让出的新空间。安踏集团旗下的迪桑特和可隆，三季度零售额增长25%至30%。</p>\n  <p>安踏也在用自己的子品牌接住这部分需求。脱胎于北京冬奥会旗舰店的“安踏冠军”，定价比安踏主品牌高三到五成，主打越野跑、徒步和滑雪，已经开进始祖鸟、迪桑特所在的高端商场。</p>\n  <p>据报道，截至2025年年中，安踏冠军的门店规模扩大了7倍，单店年销售额破千万的门店超过13家。凯乐石则把越野跑鞋线FUGA做成了独立品牌：今年3月开进北京大兴机场，8月在法国霞慕尼开出欧洲首店。据悦跑数据研究院统计，FUGA在国内越野跑赛事中的穿着占有率为34.8%，排名第一。</p>\n  <p>当折扣周期来临，有的公司在止损，有的在等待时机。我们无法预测市场走向，正如一位消费投资行业人士所说：“因为我们本来就是历史的一部分。”</p>", "category": "tech", "published_at": "2026-11-08T03:05:46+00:00", "fetched_at": "2026-11-08T04:03:41.766589+00:00", "fingerprint": "c5c059657e68baeb"}, {"source": "少数派", "title": "一个 05 后的个人数码编年史", "url": "https://sspai.com/post/116750", "summary": "我只想回应自己的感受，自己的记忆，只是因为那时候我满腔少年心气，对一切都充满好奇，对未来充满憧憬。<a href=\"https://sspai.com/post/116750\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-07T09:05:06+00:00", "fetched_at": "2026-11-08T04:03:40.156184+00:00", "fingerprint": "40d421f07dcad8a7"}, {"source": "The Guardian - World", "title": "ANC faces bruising defeat in South African local elections with 80% of ballots counted", "url": "https://www.theguardian.com/world/2026/nov/06/anc-faces-defeat-south-african-local-elections", "summary": "<p>Former liberation movement’s share of national vote almost 14 percentage points below 2021 result</p><p>The African National Congress is on course to suffer a bruising defeat in South Africa’s local elections, with the once dominant party of Nelson Mandela falling to under a third of the vote nationally with more than 80% of ballots counted.</p><p>Wednesday’s fragmented vote marks another stage in the decline of the ANC, which has led national governments since the end of white minority apartheid rule in 1994. High unemployment, crime, corruption and poor local service delivery have all contributed to <a href=\"https://www.theguardian.com/world/2026/nov/04/anc-south-africa-local-elections-water-outages-power-cuts\">voters turning away from the party</a>.</p> <a href=\"https://www.theguardian.com/world/2026/nov/06/anc-faces-defeat-south-african-local-elections\">Continue reading...</a>", "category": "politics", "published_at": "2026-11-06T12:48:37+00:00", "fetched_at": "2026-11-07T04:22:03.543429+00:00", "fingerprint": "127af6818ff60c96"}, {"source": "The Guardian - World", "title": "Kenyan doomsday sect leader jailed for 200 years for murder of 190 children", "url": "https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie", "summary": "<p>Paul Mackenzie convicted over deaths of children and one adult after followers were o
