<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

rwards? Not so much. Eufy&#8217;s Omni C28 robot vacuum / mop hybrid can help, and thanks to an early Black Friday deal, you can pick it up at a new low price of $379.99 ($420 off its original price) at Amazon, Best Buy, or directly from Eufy [&#8230;]", "category": "tech", "published_at": "2026-11-20T19:15:00+00:00", "fetched_at": "2026-11-21T05:22:25.498861+00:00", "fingerprint": "7fb40abee5825fd2"}, {"source": "The Verge", "title": "Rockstar says GTA VI made $3.79 billion in its first day", "url": "https://www.theverge.com/games/1036279/gta-vi-sales", "summary": "GTA VI earned $3.79 billion in its first day of sales, which set \"a new record for entertainment across any medium,\" according to an announcement from Rockstar Games. The game also sold 32.5 million preorder copies. \"It is with immense gratitude that we enter a new chapter of Rockstar Games with the release of Grand [&#8230;]", "category": "tech", "published_at": "2026-11-20T19:35:06+00:00", "fetched_at": "2026-11-21T05:22:25.498856+00:00", "fingerprint": "580903835fa712d8"}, {"source": "The Verge", "title": "YouTube is reportedly preparing to settle social media addiction claims for $3 billion", "url": "https://www.theverge.com/streaming/1039096/youtube-social-media-addiction-school-districts-settlement", "summary": "YouTube is preparing to pay $3 billion to thousands of school districts to settle claims that its \"addictive design\" harmed kids, according to Bloomberg. Sources tell the publication that YouTube reached the agreement \"in principle,\" and that the deal would also include new safeguards for teens. The settlement would allow Google to avoid a wave [&#8230;]", "category": "tech", "published_at": "2026-11-20T20:43:52+00:00", "fetched_at": "2026-11-21T05:22:25.498846+00:00", "fingerprint": "28a72b175fa002be"}, {"source": "36氪 - 最新文章", "title": "Anthropic上市首日涨17%，市值一度冲至2万亿刀，AI热潮还能持续多久？", "url": "https://36kr.com/p/4077873869099904?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_c6a1dc1594024cd28bb63bb580d5c2a6@6314151_oswg1060749oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>Anthropic与科技巨头们唇齿相依</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_728e7b84a2254c5ab9cc000f76d339b9@6314151_oswg560oswg900oswg30_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>文<strong>&nbsp;|</strong>&nbsp;刘思洁</p>\n  <p>封面来源 |&nbsp;Unsplash</p>\n  <p><br />&nbsp;</p>\n  <p>11月19日，Anthropic（Nasdaq：ANT）<strong>正式登陆纳斯达克</strong>，股票发行价最终定在83美元，开盘价111.50美元，盘中最高涨至115.10美元，按完全稀释口径计算，市值一度约<strong>2.08万亿美元，按已发行股份计算约1.51万亿美元，</strong>收盘报97.17美元，收盘时较发行价高约17%。</p>\n  <p>其募资额也超越SpaceX，为813亿美元，刷新了全球IPO募资纪录。盘中最高时，Anthropic一度成为全球市值第六大的上市公司（<strong>完全稀释市值口径），</strong>位于Apple、Microsoft、Nvidia、Alphabet和Amazon之后。</p>\n  <p><strong>截至2026年9月30日约有5300名员工，按照盘中最高时市值计算，也就是说人均创造了3.925亿美元的市值，约为英伟达的4.7倍。而按照招股书的披露，过去12个月人均创造的营收超过660万美元。按照盘中最高股价计算，其七位联创的身家合计超过1900亿美元。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_eb7558d0d87d46078edcd168870b2746@6314151_oswg99723oswg1080oswg687_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Anthropic、英伟达、SpaceX三家公司人均创造的市值（数据取11月19日各家最高市值计算）</p>\n  <p><strong>此前，业内普遍存在一个担忧，Anthropic的上市，预示着AI行业泡沫要破了。</strong>10月，投资者还在谈论Anthropic上市估值可能达到约2万亿美元，临近上市，市场讨论回落到约1.2万亿至1.4万亿美元。而到上市时市值则又冲高至2万亿美元。</p>\n  <p>市场情绪起伏，在上市首日的股价上也得到了体现，最终收盘回落至97.17美元，而美股三大指数也全部收跌，道指跌2.19%，标普500指数跌2.02%，纳斯达克综合指数跌2.25%。<strong>尽管Anthropic首日收盘仍高于发行价，市场整体却在抛售股票，可见，投资者对高估值科技股和AI相关风险仍保持谨慎。</strong></p>\n  <p>当下，政策环境为AI的发展增加了一层不确定性。美国中期选举后，民主党将在明年1月取得国会多数。其党内近期的政策讨论更强调对AI公司加强问责、保护劳动者和消费者，并关注数据中心对电力、环境和当地社区的影响。</p>\n  <p>翻阅Anthropic的招股书，可以看到AI产业扩张的两个不同切面：收入快速增长的同时，算力和基础设施投入也在急剧扩大。Anthropic已签下大规模的多年算力采购和租赁安排，还使用可转换票据等方式为部分算力租赁提供融资。</p>\n  <p>从商业角度看，<strong>对Anthropic这样AI巨头来说，最大的问题不是继续拿资本、建算力，更应担忧的是：在需求波动、成本高企和政策收紧的夹击下，巨额投入能否持续兑现为商业回报。</strong></p>\n  <p>AI的泡沫破了吗？</p>\n  <p>本文从Anthropic的融资、产业链关系、收入和算力承诺入手，剖析这场AI资本盛宴由什么支撑，又会在哪些环节遇到压力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_2e99a21376b846f7b15b22d27ed64a0f@6314151_oswg1788oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>从1.24亿美元A轮融资，到2万亿美元市值，Anthropic如何一步步变大？</strong></h2>\n  <p>Anthropic最早公开披露的融资是2021年的A轮，由Skype联合创始人、投资人Jaan Tallinn领投，融资1.24亿美元。随着融资规模的扩大，投资者也从早期个人投资人和风投，扩展到大型基金、主权财富基金及科技公司。</p>\n  <p>2025年的E、F轮分别融资约35亿和130亿美元，2026年的G、H轮则分别融资300亿和约650亿美元。H轮后，公司披露的投后估值达到9650亿美元。<strong>融资规模与估值在短时间内同步跃升，是这段融资史最直观的特点。</strong></p>\n  <p>可见，从2025年开始，投资者对其模型能力、客户增长和未来市场规模的预期明显升高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_a2414bf5d1b04f70b471b1c0919e28ea@6314151_oswg137566oswg1080oswg643_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">融资规模和市值变化图</p>\n  <p><strong>Anthropic的融资跃升，发生在全球资本集中涌向AI的背景下。</strong></p>\n  <p>经济合作与发展组织（OECD）统计，2025年AI企业获得约2587亿美元风投，占全球风投总额的61%，是2022年占比的两倍。</p>\n  <p>到了2026年上半年，世界知识产权组织（WIPO）统计的AI融资占全球风投金额已升至77%，OpenAI、Anthropic和xAI三家就占近43%。</p>\n  <p>融资热潮并未平均惠及整个AI行业，越来越集中在少数头部公司和超级大额交易中。</p>\n  <p>Anthropic的估值上升，正受益于这场资本集中的游戏。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_e60306b4679348548e42e481f37ac911@6314151_oswg2308oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>投钱的公司，也在卖算力、云服务和销售渠道</strong></h2>\n  <p>Anthropic与科技巨头之间，形成了多重交织的关系：它们既可能是投资人，也可能是云服务、算力或芯片供应商。在一些情况下，还可能通过可转债或融资额度提供资金。</p>\n  <p>以亚马逊为例，IPO前，其通过可转债和优先股投资了约180亿美元。</p>\n  <p>它既向Anthropic投资，又是其云服务和训练合作伙伴，AWS还通过Bedrock提供Claude的销售渠道。与此同时，Anthropic承诺未来向AWS采购大量算力。</p>\n  <p><strong>资本流入之后，Anthropic又要把相当一部分资金用于购买同一批巨头提供的云服务和算力。投资关系与供应链关系就这样连在了一起。</strong></p>\n  <p>这张关系网也延伸到其它美国大型科技公司，可以看到，美股“七姐妹”，也就是占据标普500指数总市值近40%的七家企业中，有四家都和Anthropic有投资及合作供应链关系。</p>\n  <p>——Amazon、Google、Microsoft、Nvidia分别以不同方式参与其中，既可能投资，也可能提供云、芯片或销售渠道。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_3d07bba5ed124c05b460ad8a79b349bd@6314151_oswg245885oswg1080oswg749_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">巨头们和Anthropic错综复杂的关系</p>\n  <p>目前，云平台还是Claude重要的销售。通过云服务商marketplace购买Claude产生的收入占比，从2023年的11%升至2025年的47%。2026年前九个月约为44%。对Anthropic来说，通过这些云平台销售Claude，可以借用这些平台已经建立的企业客户关系、采购流程和云上基础设施，让企业客户更容易试用、采购并接入Claude。</p>\n  <p>对Anthropic来说，这些关系有助于获得扩张所需的资金、算力和企业客户入口。对巨头来说，则可能带来股权收益、云服务收入、芯片需求或模型生态中的位置。</p>\n  <p>这种交织关系也延续到了上市阶段。Anthropic在11月10日公布的最新招股书披露，Google、Nvidia、Microsoft等七家公司同意在IPO同时，按发行价合计购买260亿美元的不带投票权的N类股票。</p>\n  <p><strong>Anthropic的增长因此与大型科技公司的资本和基础设施深度相连，巨头们互相依赖，也在这场狂欢中共同获利。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_5b5bf5e81d0f4b57a9c42867feb7fdf8@6314151_oswg2380oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>收入能否证明需求是真的？</strong></h2>\n  <p>据招股书披露，截至2026年9月30日的九个月，Anthropic收入为332.42亿美元。其中，按使用量计费收入263.06亿美元，占约79%。订阅收入69.36亿美元，占约21%。换句话说，它的收入大头是大客户调用Claude、消耗算力后产生的费用。</p>\n  <p>这意味着客户使用得越多，Anthropic收入可能越高，如果客户减少调用、转向更便宜的模型，或者预算收紧，这部分收入也可能波动。</p>\n  <p>Anthropic将过去12个月消费超10万美元的客户，视为衡量企业级市场渗透率的核心指标。截至2026年9月底，这类客户贡献了过去9个月约74%的收入，数量超过11900家。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_741827c7d35148659f44ab12c877aa0d@6314151_oswg85764oswg1080oswg689_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">各类收入占比</p>\n  <p><strong>Anthropic的故事是否能继续，取决于大客户能否持续使用Claude，使得收入能覆盖长期的算力投入。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_800388a865a44c989cf88d8ee802bea7@6314151_oswg2613oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>算力压力，欠未来的账</strong></h2>\n  <p><strong>截至2026年9月的九个月，Anthropic营业亏损约12.6亿美元，净亏损约1040.39亿美元。</strong></p>\n  <p><strong>不过净亏损中有约943.24亿美元来自可转债、衍生品和SAFE等项目的公允价值变动，主要是融资估值上升带来的账面调整，这不等于公司在这九个月里实际花掉了同样多的现金。&nbsp;</strong></p>\n  <p><strong>同期，公司经营活动现金流为正约66亿美元。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_27ef3c8388b84842acee8bc88e717fc4@6314151_oswg86891oswg1080oswg709_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">亏损来源图，与现金流对比</p>\n  <p>更实在的经营压力在算力成本上。<strong>Anthropic披露，2026年前九个月的算力和基础设施费用约188亿美元，相当于同期收入的约57%，并称这项费用预计在可预见时期内仍是最大运营开支。</strong></p>\n  <p>招股书披露，截至2026年9月底及之后，公司已签订的算力、基础设施采购和租赁安排，承诺支出合计约9009亿美元。这些钱分布在多年合同中的未来支出，公司预计约4516亿美元将在2030年底前发生，未来12个月预计到期约707亿美元。</p>\n  <p>这些承诺也把Anthropic与多家供应商长期绑定：公司承诺向Amazon至少支出1100亿美元、向Google Cloud至少支出约1213亿美元、向Microsoft 至少支出472亿美元。另外还向SpaceXAI、Nscale、Lambda等采购GPU算力，并通过 Broadcom等安排租赁计算设备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_a11e06119eb245858c949d9a9abdcef0@6314151_oswg2374oswg900oswg181_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>AI泡沫要破了吗？</strong></h2>\n  <p>AI行业的债务在扩张，据CNBC报道，高盛统计，今年超大规模云厂商已发债约2960亿美元，超出年初预测的2500亿美元，并预计明年达到4400亿美元，另有约3000亿美元的项目级融资。太平洋投资管理公司（PIMCO）称，AI相关借款人已占今年美国非金融投资级长期债券发行量的近一半。压力信号出现了：算力云服务商CoreWeave一只2032年到期的债券，收益率升破16%。</p>\n  <p><strong>这种靠举债支撑基建扩张的模式，不得不让人想到2000年前后的电信泡沫。当时的一个典型特征是设备商向客户提供融资，客户再用这笔钱购买设备，最后需求跟不上产能建设的速度，链条断裂。</strong></p>\n  <p>AI产业链里已经出现了类似结构。</p>\n  <p>Anthropic也在这条链条上。招股书披露，它可以向博通或其指定的融资伙伴发行最高420亿美元的可转换票据，专门用于支付租赁基于谷歌TPU的设备的租金，设备由博通向谷歌购入，再租给Anthropic的子公司，租期五年，租金合计约1252亿美元，票据约覆盖其中的三分之一。</p>\n  <p>正常情况下，票据年利率9%，利息计入本金，持有人可按30日均价的90%折价转股。在协议约定的收入条件未达标期间发行的票据，利率为13%，转股折价为15%。</p>\n  <p>截至2026年9月底，票据尚未发行，公司称预计IPO前不会出售。但若一旦动用，风险主要体现为对现有股东的稀释。而博通既是设备出租方，又是潜在债权人，招股书也提示了这种与供应商之间的利益冲突。</p>\n  <p>真正说明融资环境变化的，是评级预期。据《金融时报》报道，Blackstone是Anthropic一笔约630亿美元芯片融资的主要投资者，它此前告诉投资者，Anthropic有望在2027年前获得投资级评级，后来改口，称上市后更可能是BB档的“高级垃圾债”评级；KBRA已在6月给出BB+。评级越低，融资越贵，而Anthropic和它的供应商扩张算力，都离不开这类融资。</p>\n  <p>这条链条上的供应商也是如此。招股书新增的风险因素写明，部分算力提供方和基础设施伙伴依赖第三方融资或信用支持来采购芯片、建设产能，一旦融资不可得或更贵，已约定的算力可能被延迟、重新定价、减少或无法交付。</p>\n  <p>比如Nscale，合同要求它在截止日前尽最大努力，为GPU系统和数据中心取得融资。&nbsp;</p>\n  <p>场地同样是前提。Anthropic与Lambda那份约349亿美元的协议约定，若Lambda没能在约定日期前拿到数据中心的设施租约，任何一方都可以终止。11月10日的招股书修正案披露，Lambda没有按时拿到租约，这份协议目前可由任何一方终止。双方均未发出终止通知，Anthropic称目前不打算终止。</p>\n  <p>Anthropic的招股书没有给出“AI泡沫已经破裂”的确定答案。公司收入仍在快速增长，经营现金流为正，这次的IPO认购热潮也显示其仍有大量资金支持。但另一面，算力和基础设施费用已占前九个月收入约57%，多年期采购和租赁承诺约9009亿美元，融资方也开始重新评估相关风险。</p>\n  <p>对于投资者来说，真正应该关心的风险正是在未来——需求能否追赶上算力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_12d39773d41e45cd996c3e794a166e06@6314151_oswg56928oswg883oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_9416eb5a82254baca52a46cf91623da4@6314151_oswg2783oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>你觉Anthropic��价后市走向是？</strong></p>\n  <p><strong>欢迎在评论区分享你的看法~</strong></p>", "category": "tech", "published_at": "2026-11-20T09:14:53+00:00", "fetched_at": "2026-11-21T05:22:25.377494+00:00", "fingerprint": "bf0443663fed95c1"}, {"source": "36氪 - 最新文章", "title": "一届学生60万？外国玩家：想来中国上学了 | 玩点好的", "url": "https://36kr.com/p/4077807099057031?f=rss", "summary": "<p>文丨句号</p>\n  <p>编辑丨果脯</p>\n  <p>“如果我是老师，我肯定不会对学生这么坏。”</p>\n  <p>可能是在被罚站时，也可能是被老师喊来家长后，这样的想法总是会瞬间被唤醒。《我带过的最差一届》（以下简称《最差一届》），一款非对称式派对游戏，给了玩家们一次师生身份转换的机会。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_c8072a67d4634387aee487f5312c5c79@6449318_oswg422961oswg800oswg450_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《我带过的最差一届》官方宣传图</p>\n  <p>由B站up主夜之黄泉带队顽核社开发，《最差一届》在Steam新品节上斩获超过60万下载量，发售首日销量即达成10万份。爆笑的节目效果引得各路主播纷纷加入这场校园乱斗，在中文社区之外，中式校园题材也吸引着越来越多的海外玩家。</p>\n  <h2><strong>01 追我的不只是情怀，还有老师？</strong></h2>\n  <p>在《最差一届》中，玩家分为不对称的两个阵营，与现实相符，老师在游戏中需要以一敌多，而学生阵营更加考验团队协作，搭配默契才有取得胜利的可能。</p>\n  <p>游戏没有剧情，玩家自己的经历就是最好的新手引导。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_5bdd90a1cbb648c8892444fbd8a32e34@6449318_oswg590718oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>蓝白校服配上天然呆的大眼睛，学生们给人带来的第一印象绝对是软萌的，但他们挑衅的动作摆出来，你又会瞬间觉得他们有些欠管教。</p>\n  <p>这是因为有些真人玩家混进了这批NPC的队伍，惹老师生气就是他们来到学校的使命，不要让他们离开你的视线，否则你将想象不到他们会做出怎样的恶作剧。《最差一届》可不是一个和平的游戏。</p>\n  <p>和经典的非对称对抗游戏不同，学生的任务不是狂点QTE修电机，也不需要拉点和砸板，学生与老师的关键博弈点在于课桌底下的小动作。相比于现实的校园，他们做得更加出格，大家的课桌中一本书都不剩，而是被各种各样的“垃圾食品”取代了位置。薯片、可乐、干脆面、泡泡糖，只要不被老师抓住，你甚至可以从头吃到尾。吃掉更多的东西，积累足够的捣蛋值，便可取得阵营胜利。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_bd930c14f7c7462dbf9d70bf1a23969a@6449318_oswg619633oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>作为老师，自然不会允许学生在自己的课堂上胡作非为。老师具有更高大的身材以及充满压迫感的容貌，和现实的教师一样，站在讲台上或者是教室后门，能将整个教室的小动作看得一清二楚。对于违规违纪的坏学生，老师将展示自己惊人的FPS天赋，用粉笔将学生爆头后，再像拎小鸡似的将学生捆在讲台上罚站。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_e26c14c7daf3455fbbf544962aca9b2f@6449318_oswg145588oswg858oswg479_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>面对老师，有时候身法好不如演得像，当你想要干坏事，抓住老师写板书的空档期是最保险的做法。游戏最刺激的点就在于此，你需要一边低头吃东西，一边观察老师的下一步动作。当老师即将写完板书回头，你必须在瞬间完成放下薯片、收起抽屉、拿起课本等一系列操作。</p>\n  <p>当老师巡视到你身边，你还得抽空翻翻课本、用一双大眼睛望向老师，展示一番你的天真无邪。老师站在身边，下一秒是扔出粉笔，还是默默走开，这种提心吊胆的感觉，是游戏能成为笑点制造机的关键。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_e35b004afb314716ac9f761621c836b2@6449318_oswg936481oswg1080oswg579_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>假如只是偷吃零食，这届学生还算得上安分，只有当你进一步清查抽屉，才能够真正理解他们“最差一届”的含金量。学生冷不丁的就会从抽屉掏出闪光弹和烟雾弹对讲台上的老师进行攻击，还能熟练操作无人机进行远程救援，为了与学生对抗，老师也可以启用摄像头与雷达来增加自己的眼线，打学生们一个措手不及。</p>\n  <p>学生们扔扔道具就好了，而老师考虑的就要多了。作为金牌教师，拿粉笔无差别打击学生未免有失风度，于是游戏为老师添加了体力机制。老师奔跑和投掷粉笔都会消耗体力，错抓好学生将会受到扣除体力值的惩罚，只有在讲台上写板书时体力才会得到回复。为了应对精力充沛的学生，老师只有合理运营体力才能打好这场拉锯战。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_b6358f047804474591607363f1a8d739@6449318_oswg429897oswg793oswg404_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>游戏正式上线后具有更加丰富的地图选择，封闭的教室不再是师生大战的唯一场景，从机房到寝室，从厕所到操场，每个地方都可能成为两方对决的“刺激战场”。不同的地图设置了不同的场景交互，玩家能够在其中全方位重温自己的校园记忆。</p>\n  <p>趁着老师下台巡视的机会，从教室后门潜入老师的办公室，将抽屉内的盒饭吃个干净；在微机课上，悄悄切出老师的操作界面，打开角落的黄金矿工玩个痛快。曾经在校园中压抑的天性，在这一刻得以全部释放。</p>\n  <p>当玩家下课来到厕所，你会发现隔间里的人赖着不走，都在争分夺秒地啃食零食。学生们为了争取更高的分数，吃过的零食包装袋也顾不及冲进马桶，吃得太多时，包装袋甚至直接堆成了小山从隔间内溢出。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_4eab99782b4e4f4d8d723f421393ab8d@6449318_oswg864560oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>《最差一届》里，老师再也不会占用学生的体育课，学生可以与NPC一起，畅快地绕圈跑步，也能够假装掉了鞋带，偷偷跑到自动售货机面前大吃一顿。在对局中，广播站成为老师和学生的必争之地，学生想要播放《雨爱》和“哈基米音乐”，要先闯过老师手里的教鞭。</p>\n  <p>游戏正式上线后还加入创意工坊，玩家可以尽情接入mod，用自己喜欢的角色开办一场校园cosplay。曾经连头发长了一寸都要判“死刑”，而现在，一般的奇装异服在猫娘学生和奶龙老师面前已经有点不够看了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_837e8ee11b6d46779272d9985a528311@6449318_oswg371340oswg804oswg543_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Steam创意工坊界面截图</p>\n  <p>《最差一届》有着不同于现实校园的自由，但这种创意并不会使玩家感到陌生。当你邀约自己的旧友加入游戏，你会发现，那些散落在校园每个角落的欢声笑语，仍然还是我们熟悉的温度。</p>\n  <h2><strong>02 中式校园这么大，老外很想来看看</strong></h2>\n  <p>蓝白校服与校园生活，这种搭配并不是第一次在中文社区走红。</p>\n  <p>国产原创动画《茶啊二中》于2014年开播，动画的内容是一群师生最平常最普通的校园故事，但他们一口气将这个故事讲述了十二年，足够陪伴一名中国孩子从小学到大学。动画组于2026年7月开播第六季，剧集中塑造的王强、贾淳、石老师等经典形象，得到全网5000万粉丝的青睐。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_10825b265d204a8aae742f7719382e50@6449318_oswg831536oswg720oswg954_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《茶啊二中》官方宣传海报</p>\n  <p>十二年时间，动画的建模水平有着极大的改良，但人物服装仍然是朴素的蓝白运动服，制作组并没有把校园的象征符美化到脱离现实的地步，而是坚持用最真诚的日常打动每一个观众。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_3a94cf0ec46c4cc9a57203f4e4260932@6449318_oswg847699oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">动画剧集内截图</p>\n  <p>在学生时期看校园作品，我们往往用它们作为自己的嘴替。还记得当初玩《中国式家长》的时候，总是会想让自己的家长去感受一下作品出表达的内核，去体会下当时校园的我们承载着过多的期望，到底过的有多不容易。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_48c4b646b0184f15a0d1561ca38704c0@6449318_oswg67155oswg1080oswg432_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《中国式家长》游戏宣传图</p>\n  <p>而从校园离开后，对于学校里发生的日常，除了共鸣之外，还多了一份“怀念”的味道。</p>\n  <p>上个月，灭霸短剧火遍全网，一句“灭霸的爸爸叫什么”，成为不少人与校园伙伴心照不宣的口头语。跳出漫威原著的框架，在中式校园的背景下，“灭霸父亲”这个身份被赋予了新的名字——灭建国。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_f3828d7e34494b118c2f7ccff00ea0c1@6449318_oswg185287oswg1080oswg1068_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Bilibili平台up主“在酒馆的溟歌”原创漫画</p>\n  <p>在AI短剧中，灭霸与复仇者联盟一笑泯恩仇，在这个平行世界中，大家都是学校中的一分子，各位超能力者也只是能力比较突出的“普通学生”。</p>\n  <p>没吃过海底捞的灭霸，为了与同伴合群而穿上潜水服出门；灭霸暗恋黑寡妇，钢铁侠替他送出超长蛋挞撮合两人；嘲笑深夜emo文案后，灭霸一言不合就要告老师，钢铁侠只能献出辣条充当封口费；被父亲批评后，灭霸下定决心要做一个无情的学习机器……每一个小故事，总能让我们找到自己的影子。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_b64fa2d881a34af6ac8b7e4bd605c96d@6449318_oswg707296oswg1080oswg705_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">社区AI二创图</p>\n  <p>灭霸短剧很滑稽，但有时也很动人。B站up主在“灭建国”梗的基础上接续创作，一部《灭建国的超能力》在站内播放超600万。短片内，灭建国拥有“将任何事物消灭一半”的能力，但一辈子只能够使用一次，灭建国在高考、结婚、创业等人生节点时，都没舍得使用。但在儿子灭霸受伤时，灭建国毫不犹豫地启动了能力，帮助灭霸减少了一半伤痛。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_51d3c22ba5774586bd54c89d93203a27@6449318_oswg1220265oswg1080oswg907_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Bilibili平台up主“抽象生活先生”原创漫画截图</p>\n  <p>同学的友谊、家人的爱、老师的陪伴，中学时期全心投入学习的日子很苦涩，但经历过后才能感受到这些苦涩中的微光更加温暖。与其说是校园生活本就幸福，不如说是时间冲淡了苦，只给记忆存下成长的本味。在规则为主的校园，很多情绪没有表达的窗口，不能明目张胆喜欢一个人，不能抛开学业发展自己的兴趣爱好，面对焦虑不能轻易认输，连接家与校园的，往往只剩下一座四四方方的电话墙。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_cb0204810c264d9ca9efc5454d9fcbe7@6449318_oswg319805oswg627oswg407_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">央美毕业展网络照片</p>\n  <p>这种对校园又爱又恨的情感，除了在中文社区爆火外，同样感染了不少海外玩家。尽管游戏的海外译名并没有像“最差一届”这样的文化符号意义，但玩家们还是对中式校园堪比坐牢的固有印象有所改观。</p>\n  <p>“你们在学校真的可以涮火锅吃吗？”这是我在《最差一届》的英文房中，一位外国朋友对我发出的诚恳疑问。</p>\n  <p>在Steam评论区中，还有一位法语玩家坦言，自己的朋友放弃了高中结业，这款游戏让他怀念起过去的事。青春未结的遗憾，许多人在游戏中得到了补足，或许曾经在学校中偷藏手机被发现的经历很惨痛，但在游戏中，这种“轻惩罚”的机制让你可以更加放心大胆地去突破规制，寻找曾经更活跃且更有想象力的自己。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_6f6aa3435ea9433fa5f6c5527bfa7f0e@6449318_oswg172522oswg1080oswg729_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Steam评论区截图</p>\n  <p>在对局中，一些玩家终于理解了老师的辛苦，因为游戏里“老师体力太少”，“学生太多管不过来”，经常把扮演“老师”的玩家整到力竭，而游戏中的老师往往只是1v5或1v6，现实中的老师需要对付的是十倍于此的学生。</p>\n  <p>而一位老师也在评论区中表示自己的庆幸，自己的学生还好只是会打瞌睡和玩手机，倒不至于向老师扔闪光弹。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_c34ed1e7fa91479d80280af07de27cf6@6449318_oswg122793oswg903oswg294_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Steam评论区截图</p>\n  <p>地图中，不少地方还埋藏了暖心的小彩蛋，例如黑板上总会时不时刷新老师关切的话语，表示即使我们离开校园，老师也坚持用最朴素的情感联系着每一届教过的学生。这种纯粹的师生情，正是维系不同文化背景的玩家一同进行游戏的精神内核，虽然我们的校园环境各异，但在游戏中，你总能联想到在此背景下给你留下深刻印象的那个，或者是那群人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_defb7f4545d5410182f2a5c226af8576@6449318_oswg53331oswg1080oswg600_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《我带过的最差一届》游戏内截图</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_02434da151d94460a41b5bb1310c94d1@6449318_oswg489521oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《我带过的最差一届》游戏内截图</p>\n  <p>据制作人黄泉透露，在游戏demo阶段，《最差一届》的海外玩家占比约15%。这意味着，在武侠与仙侠等经典国风题材之外，中式校园这一叙事场景，正在悄悄成为国产游戏出海的新路径，为了感受这种校园里纯粹的快乐，不少外国玩家甚至愿意在游戏中上一节汉语言课。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_033bb8f2c4954f39a631df9da8f641fa@6449318_oswg703827oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小黑盒社区截图</p>\n  <p>游戏上线后市场表现亮眼，首周销量突破60万份，但制作组并未松懈，短时间内便上线了新版本的“秋游大巴”地图和更加生动有趣的舞蹈动作，让游戏的欢乐属性更上一层楼。</p>\n  <p>不难注意到，《最差一届》制作组从demo到上线再到第一次版本更新，相隔的时间非常短暂，一方面可能是考虑到游戏的同质化玩法很容易使玩家丢失新鲜感，而丰富的校园场景资源还有很大的开发余地；另一方面，《最差一届》的开发门槛较低，微信小程序上已经出现不少借助AI仿制的同类作品。</p>\n  <p>AI虽然能仿造游戏的外衣，但对于玩法的核心则很难做出实质性改变，让游戏的主要吸引力从情怀转向内容本身，是黄泉带领团队亟待要做的事。</p>\n  <p>本文<a href=\"https://mp.weixin.qq.com/s/662ObvsK8WSbyMkkGJdgyA\" target=\"_blank\">首发自“36氪游戏”。</a></p>", "category": "tech", "published_at": "2026-11-20T10:14:14+00:00", "fetched_at": "2026-11-21T05:22:25.377488+00:00", "fingerprint": "455454e818cb219e"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨黄仁勋或将创办新公司；水贝金价一度跌破800元/克；纳指100进入技术性熊市", "url": "https://36kr.com/p/4078827757310856?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>上证50ETF尾盘爆量拉升，成交突破215亿创成交额历史天量</p>\n  <p>英伟达市值被谷歌超越</p>\n  <p>12306重磅升级通知服务</p>\n  <p>马斯克试图与MAGA阵营切割</p>\n  <p>段永平：好公司未必要上市，字节6000亿美元估值下我会有兴趣</p>\n  <p>A股三大指数集体收跌，全市场超5200股飘绿</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>黄仁勋或将创办新公司</strong></p>\n  <p>前英伟达首席执行官黄仁勋的去向成为硅谷热议话题。科技媒体Semafor记者预测，黄仁勋休整后或重返AI行业，有可能创办一家新半导体公司，或向业内盟友筹集500亿美元创业资金，但该内容仅为预测，目前并无信息证实其已筹资或成立新公司。该记者表示英伟达董事会做出与黄仁勋切割的决定经过深思熟虑，很难因外部压力更改。另有业内人士认为黄仁勋仍存在回归英伟达的可能性，若其创业，或将对英伟达形成竞争，英伟达短期产品规划已定，长期发展则要看下一任CEO的能力。（财联社）</p>\n  <p><strong>水贝金价一度跌破800元/克</strong></p>\n  <p>在深圳水贝咨询商家了解到，11月20日中午1点多，该市场实时金价一度跌破800元/克，达797元/克，而这一价格在11月19日还为超840元/克，如果不算手工费，同样购买5克的黄金首饰，11月19日买的11月20日已经亏去200多元。不过到下午2点多，水贝金价重回800元/克上方，目前约为806元/克，如果是购买金条，价格更低至每克760多元。金价下跌，位于深圳水贝的水贝金座、金展珠宝广场等人头攒动。据了解目前顾客购金主要出于婚庆、送礼、投资等多种需求，也有顾客在观望，称“先来看看款式，等金价降了再买。”（贝壳财经）</p>\n  <p><strong>美股抹去年内所有涨幅，纳斯达克100指数走入技术性熊市</strong></p>\n  <p>当地时间11月20日，美股三大指数集体大幅收跌，截至收盘，道琼斯指数跌1.93%，连跌第五天，报48147.33点；标普500指数跌3.7%，连跌第七天（创2020年来最长连跌纪录），报6910.39点；纳斯达克综合指数跌5.28%，报22617.73点，抹去了年内所有涨幅。</p>\n  <p>三大指数均录得4月以来最低收盘价，其中道指和标普双双进入回调区间（较高点回落10%），纳指本周早些时候已经率先进入回调区间。</p>\n  <p>科技股纯度更高的纳斯达克100指数周五跌幅更大，达到5.61%，也抹去了年内所有涨幅，并且较高点回落20%，进入技术性熊市。（新浪财经）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>腾讯混元正式开源Hy4</strong></p>\n  <p>36氪获悉，腾讯混元宣布Hy4正式开源，可在GitHub、Hugging Face、ModelScope和GitCode社区下载部署。混元LLM模型已全部开源，包括Hy3 preview、Hy3、Hy4 preview、Hy4、Hy4 flash等。</p>\n  <p><strong>苹果公司研发自己的AI智能体，拟与OpenAI和Anthropic竞争</strong></p>\n  <p>苹果公司正在开发可以代表用户完成任务的自主AI智能体，并希望进入这个已被OpenAI、Anthropic PBC、Meta Platforms Inc.及其他公司占据的快速增长的市场。苹果公司本周在网站上列出的招聘信息揭示了这一计划。其中一则信息称，苹果正在为一款主动式、智能AI助手寻找一位高级工程师经理。根据招聘信息，该系统将代表用户编写代码、浏览网页、控制应用程序和操控设备。（新浪财经）</p>\n  <p><strong>腾讯云：2026年11月18日12时起，DeepSeek原厂服务端联网搜索免费</strong></p>\n  <p>36氪获悉，腾讯云公告，自北京时间2026年11月18日12时起，调用DeepSeek原厂直供模型（即模型名称中带“原厂直供”标识的模型）时触发的服务端搜索（Search）、网页抓取（Fetch）不再计费，仅按模型Token用量计费。对于11月18日12:00:00后产生的服务端联网搜索费用，我们将启动退费，费用将于11月30日23:59:59前统一退还。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>字节高管辟谣离职</strong></p>\n  <p>11月20日，网传原抖音CEO、剪映和即梦AI负责人张楠，原飞书CEO谢欣将从字节跳动离职。字节跳动相关负责人回应称信息不准确。谢欣本人发文辟谣，称离职消息为假，浪费大量时间回复问询。（第一财经）</p>\n  <p><strong>苹果相机及照片软件业务负责人离职</strong></p>\n  <p>据报道，苹果公司负责相机及照片软件业务的高管已经离职。知名科技记者古尔曼援引知情人士的话称，乔恩·麦考马克（Jon McCormack）已于10月底退休，结束了其在苹果公司超过八年的职业生涯。他此前负责管理iPhone的“相机”和“照片”应用，以及决定用户如何拍摄、查看和编辑照片及视频的底层技术。报道称，苹果尚未任命新的副总裁来直接接替麦考马克的职位，他此前的下属将在其他高管的领导下接手相关职责。（界面新闻）</p>\n  <p><strong>贾国龙切入火锅赛道，新店人均消费102元</strong></p>\n  <p>11月19日，西贝旗下“天边冰煮鲜羊”呼和浩特首店开业，由原天边砂锅焖面门店改造而来，人均102元，标志着天边系列正式切入内蒙古冰煮羊火锅赛道。天边系列今年多次调整业态，从焖面到鲜羊料理再到火锅，扩张后续乏力，门店数量冲高后回落。西贝主品牌门店持续收缩，贾国龙夫妇已将所持西贝餐饮集团全部直接股权质押。此前西贝曾披露大额亏损，通过关店、孵化新品牌自救。（界面新闻）</p>\n  <p><strong>娃哈哈董事长据悉已辞职，商标归属仍悬而未决</strong></p>\n  <p>11月20日，界面新闻获悉，娃哈哈集团董事长许思敏已辞职，该消息公司尚未回应，其辞职或与12月1日即将实施的《食品委托生产监督管理办法》带来的法定责任风险有关。当前娃哈哈商标归属、授权使用问题仍未彻底厘清，商标转让手续尚未办结，娃哈哈集团与宏胜体系之间的权责划分存在不确定性，叠加渠道经销商保证金回款不及预期，企业经营仍面临多重挑战。（界面新闻）</p>\n  <p><strong>英伟达市值被谷歌超越</strong></p>\n  <p>11月20日美股开盘后，英伟达股价跌幅扩大至4.5%，报139.43美元，创下2025年6月以来股价新低，总市值回落至3.36万亿美元，市值被谷歌反超。该股收盘跌14.01%，报125.53美元。（财联社）</p>\n  <p><strong>12306重磅升级通知服务</strong></p>\n  <p>新增候补兑现、列车变动实时推送，多渠道同步提醒旅客出行动态。11月20日起，铁路部门在12306App系统通知新增候补兑现情况、列车运行调整通知服务。旅客办理购票、改签、退票、候补等业务，相关信息将同步通过App通知、微信/支付宝、预留邮箱推送；列车停运、折返、席位调整等变动，也会通过App、短信及时告知。旅客可在首页右上角查看通知消息，也可前往设置开启通知权限。（中国铁路）</p>\n  <p><strong>马斯克试图与MAGA阵营切割</strong></p>\n  <p>美东时间11月18日，马斯克公开表态称自己不属于MAGA阵营，坦言在中期选举中投入巨额资金支持共和党，如今回看感觉相当愚蠢。此前马斯克曾公开支持MAGA运动，累计向共和党捐赠4.45亿美元。11月19日特朗普回应，仍视马斯克为朋友，但同时提醒MAGA有明确内涵，偏离者不会有好结果。本次中期选举民主党拿下参众两院控制权，后续民主党议员计划对马斯克相关事项发起调查，马斯克也在推进太空算力中心布局。（参考消息、界面新闻）</p>\n  <p><strong>台积电子公司斥资5亿美元认购Anthropic股票</strong></p>\n  <p>台积电11月19日公告称，旗下子公司TSMC Partners,Ltd.投资Anthropic，认购其602.41万股N类普通股，每股价格83美元，交易总金额约5亿美元（499999968美元），价格与IPO发行价相同。（界面新闻）</p>\n  <p><strong>GTA6发售首日获得23.6亿美元收入</strong></p>\n  <p>历经13年等待，《GTA 6》正式发售，Sensor Tower估算截至周四晚间销量2458万份，带来约23.6亿美元收入，约为《GTA5》首日销售额三倍。本作Metacritic媒体均分99分，跻身游戏史上最高分作品。业内预计PC版及线上模式或2027年上线，其线上生态的商业化潜力被机构重点看好，游戏发售还将带动主机、外设、外卖等上下游消费。（财联社）</p>\n  <p><strong>华泰证券辟谣：网传市场言论非公司研究所相关人员发表</strong></p>\n  <p>36氪获悉，华泰证券发布声明：我司关注到近期部分网络、境外平台传播的相关市场言论。经核实，该内容并非我司研究所相关人员发表，属于不实信息。我司所有证券研究观点，均严格按照监管要求履行内部审核流程后对外发布。请广大投资者理性甄别网络信息，不要采信、转发该不实内容。对于编造、传播不实信息的行为，我司支持当事人依法维护自身合法权益。</p>\n  <p><strong>段永平：好公司未必要上市，字节6000亿美元估值下我会有兴趣</strong></p>\n  <p>36氪获悉，11月20日，投资人段永平通过其账号“大道无形我有型”回答网友提问时称，字节跳动确实很强，但他们好像没有上市的计划。这是一个很好的例子，好公司未必就一定要上市的。字节目前市场估值大概在6000亿美元，这个价钱我会有兴趣的。</p>\n  <p><strong>A股三大指数集体收跌，全市场超5200股飘绿</strong></p>\n  <p>36氪获悉，A股三大指数集体收跌，沪指跌1.22%，深成指跌3.09%，创业板指跌3.54%；电脑硬件、互联网、工业机械板块领跌，汇成真空跌超14%，品高股份跌超13%，江波龙跌近7%；石油天然气、保险、银行板块涨幅居前，中国石油涨超4%，工商银行涨超3%，中国平安涨超1%；全市场超5200股飘绿。</p>\n  <p><strong>美光：2027年存储芯片供需形势会比今年更加紧张</strong></p>\n  <p>美光科技总裁兼首席技术与产品官Scott DeBoer在接受采访时表示，存储芯片的供需在很长一段时间内都无法达到平衡。他指出，在可预见的未来，供需找不到明确的平衡点，预计2027年供需形势会比2026年更加紧张。（财联社）</p>\n  <p><strong>上证50ETF尾盘爆量拉升，成交突破215亿创成交额历史天量</strong></p>\n  <p>尾盘上证50ETF华夏爆量拉升一度涨1%，早盘一度跌超2%，现成交额突破215亿，较11月19日全天增超7倍，刷新此前在2026年1月28日创下的214.5亿元的历史天量。（财联社）</p>\n  <p><strong>贷款方试图禁止SpaceX将价值400亿美元芯片发射到太空</strong></p>\n  <p>知情人士透露，为SpaceX最新一笔430亿美元债务融资提供支持的贷款方，正试图限制埃隆·马斯克，不允许他把这笔融资的抵押品——高端AI芯片发射到太空，用于其轨道数据中心计划。SpaceX方面称，这笔债务对应的芯片计划在地面使用。但贷款方心存顾虑：如果公司后续决定把这笔作为贷款抵押物的贵重芯片送入太空，一旦发生违约，贷方将无法收回、处置这些半导体资产。（财联社）</p>\n  <p><strong>Anthropic数学家声称借助Claude证明黎曼猜想</strong></p>\n  <p>Anthropic员工、数学家Levent Alpöge对外表示，在大模型Claude协助下完成黎曼猜想证明，还称已经证明范围更广的广义黎曼猜想。该证明已经通过Lean工具做形式化编码校验，不过整个论证的正确性仍有待全球数学界核验。黎曼猜想是千禧年百万美元悬赏的顶级数学难题，距今已有167年历史。若证明最终成立，将对整个数论领域带来变革，也标志AI数学能力实现重大跨越。（财联社）</p>\n  <p><strong>招商银行发布贵金属业务市场风险提示</strong></p>\n  <p>36氪获悉，招商银行发布贵金属业务市场风险提示称，近期贵金属市场的不确定性因素较多，价格波动加剧。请投资者提高贵金属业务的风险防范意识，基于自身财务状况、风险承受能力及投资经验，理性开展贵金属投资活动，合理控制贵金属资产持仓规模，避免短期投机或跟风交易，从长期资产配置视角理性配置贵金属资产，控制投资总量，做好多元布局。</p>\n  <p><strong>韩国驳回特斯拉为FSD提交的车辆安全标准豁免申请，要求补充相关材料</strong></p>\n  <p>韩国国土交通部周五表示，由于申请材料不全，无法受理特斯拉公司提出的豁免当地车辆安全标准的请求，该请求旨在获准在韩提供其“全自动驾驶”（FSD）功能。韩国国土交通部称，韩国交通安全公团已通知特斯拉韩国公司，进行技术评估尚需进一步核实并补充相关材料。（新浪财经）</p>\n  <p><strong>三星任命存储与移动业务独立负责人，联席CEO人选不变</strong></p>\n  <p>根据三星电子发送的一份电子邮件声明，在联席CEO全永铉（Jun Young-hyun）和卢泰文（TM Roh）的领导下，三星电子分别任命了存储和移动业务的新负责人。黄尚俊（Sang Joon Hwang）晋升为总裁，并将出任存储业务负责人。崔元俊（Won-Joon Choi）被任命为移动业务负责人。全永铉将继续负责设备解决方案（DS）部门，卢泰文将继续担任设备体验（DX）部门负责人；两人将继续履行联席CEO的职责。（新浪财经）</p>\n  <p><strong>英伟达接近以逾5亿美元收购扩散式AI初创公司Inception</strong></p>\n  <p>据报道，英伟达接近以逾5亿美元收购扩散式AI初创公司Inception。（界面新闻）</p>\n  <p><strong>SK海力士将成为铠侠第一大股东</strong></p>\n  <p>SK海力士将把所持铠侠控股的债券转换为无投票权股份，从而成为铠侠第一大股东。这家韩国存储芯片公司周五公布转股方案，称转股完成后其在铠侠的持股比例将达到14.1%。(新浪财经)</p>\n  <p><strong>财政部在香港成功发行美元主权债券</strong></p>\n  <p>36氪获悉，据财政部，11月19日，中华人民共和国财政部代表中央政府在香港特别行政区成功发行了20亿美元主权债券，发行期限为3年期，发行利率为4.821%。此次美元主权债券受到市场热烈欢迎，国际投资者认购踊跃，总认购金额723亿美元，是发行金额的36倍。此次美元主权债券投资者类型丰富，地域分布广泛。亚洲、欧洲和中东、美洲投资者分别占比52%、34%、14%，主权类、基金资管、银行和保险、交易商等类型投资者分别占比59%、29%、11%、1%。此次发行的债券将全部在香港联合交易所上市。</p>\n  <p><strong>最新LPR公布</strong></p>\n  <p>中国央行将一年期和五年期贷款市场报价利率（LPR）分别维持在3%和3.5%不变，为连续18个月保持不变。</p>\n  <p><strong>美股恐慌指数VIX升至30，刷新3月底以来盘中最高水平</strong></p>\n  <p>美股恐慌指数VIX升至30，刷新3月底以来盘中最高水平。截至11月20日下午，道琼斯指数期货跌0.24%，标普500指数期货跌0.78%，纳斯达克100指数期货跌1.66%。(财联社)</p>\n  <p><strong>摩尔线程：实控人提议回购5亿至10亿元股份</strong></p>\n  <p>36氪获悉，摩尔线程公告，公司收到实际控制人、董事长、总经理张建中提议回购公司股份的函，拟使用自有资金和/或自筹资金，通过集中竞价交易方式回购部分A股股份，回购资金总额不低于5亿元且不超过10亿元，回购股份拟用于员工持股计划或股权激励。</p>\n  <p><strong>铜价跌至3月份以来最低，AI交易抛售潮殃及金属市场</strong></p>\n  <p>随着全球需求担忧不断加深，市场经历一周动荡后，铜价跌至3月份以来最低水平。伦敦金属交易所（LME）3个月期铜期货一度跌逾3%，本周表现势创近十年来最差单周表现之一。此轮抛售由多重因素推动，其中最迫切的担忧是人工智能支出能否能够持续，以及铜在AI建设中发挥的作用。（新浪财经）</p>\n  <p><strong>继大疆之后，影石部分产品或将涨价</strong></p>\n  <p>存储芯片涨价潮下，继大疆上调Osmo Pocket 4、Osmo Pocket 4P、Osmo Nano多款产品价格后，影石创新线下门店传出消息，旗舰云台相机Luna系列预计12月15日涨价约300元，其余系列暂不调价，目前官方暂未下发正式涨价通知。本次涨价主要源于NAND闪存等上游元器件成本抬升，内置大容量存储的影像产品承压明显，佳能等厂商也已发出涨价预警。（界面新闻）</p>\n  <p><strong>香港家族办公室大举解除39亿美元AI押注，清仓美光、西部数据等股票</strong></p>\n  <p>由对冲基金老将Larry Chen创立的香港家族办公室上季度削减股票持仓，正值投资者更广泛撤离AI相关资产之际。根据在美国提交的13F文件，截至第三季度末，Anther Capital Ltd.已不再持有此前价值约39亿美元的股份，主要集中在与AI相关的硬件和芯片制造商。包括西部数据和美光科技在内的这些投资，曾出现在Anther前一季度提交的13F文件中。（财联社）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>袁记食品集团股份有限公司通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，港交所文件显示，袁记食品集团股份有限公司通过港交所上市聆讯。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“原子矩阵”完成数亿元人民币B轮融资</strong></p>\n  <p>36氪获悉，中性原子量子计算公司“原子矩阵”近日宣布完成数亿元人民币B轮融资。本轮融资由杭州产投集团、杭州高新金投、成都科创投、鸿瑞达投资、博世创投、广州海珠城发、川创投等机构共同参与，集合多地国资平台、产业资本及市场化投资机构。本轮融资将为公司链接区域资源、落地量超融合试点、深化产业生态合作提供支撑。一年内，原子矩阵已连续完成五轮股权融资，累计融资总额突破10亿元。</p>\n  <p><strong>“基元科技”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，国内覆盖二维半导体集成电路制造生长—转移—检测全流程的专用产线设备商“基元科技”近日完成数千万元天使轮融资，由朝晖芯华基金领投（朝晖资本与中芯国际创始人张汝京博士联合管理），宁创投、常州高新投、南慧创投等跟投，云岫资本担任后续融资财务顾问。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>闲鱼：2027财年Q2日活同比增长23%，订单量同比增长29%</strong></p>\n  <p>36氪获悉，11月19日，阿里巴巴集团发布2027财年Q2财报。财报显示，本季度闲鱼日均活跃用户同比增长23%，订单量同比增长29%。数据显示，过去一年闲鱼服务类订单增长87%，其中AI编程、AI漫剧等AI相关服务订单增长达157%。</p>\n  <p><strong>文远知行：第三季度收入同比增长88%，Robotaxi收入首次突破亿元</strong></p>\n  <p>36氪获悉，文远知行公布2026年第三季度未经审计业绩，期内实现收入3.215亿元人民币，同比增长88%，环比增长38.8%;毛利1.381亿元，同比增长约145%，毛利率升至43%，同比提升10.1个百分点。其中，海外业务收入1.469亿元，同比增长171.5%，占总收入45.7%；Robotaxi业务收入首次突破1亿元，同比增长204%，其中海外收入占比超过90%。第三季度公司净亏损3.10亿元，上年同期为3.073亿元；非国际财务报告准则经调整净亏损3.365亿元。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>比亚迪发布可10秒折叠的方向盘</strong></p>\n  <p>11月19日，比亚迪发布折叠智舱，推出可10秒收纳的折叠方向盘，将搭载于方程豹钛9，面向L3、L4高阶自动驾驶场景。该方向盘具备双状态气囊保护、防夹功能，启停寿命可达8万次。新车折叠智舱版售价32.99万元，这套方案攻克了气囊、结构可靠性等行业量产难点。业内认为该技术属于面向自动驾驶的前置布局，但受国内L3落地节奏影响，短期内日常使用频次有限。（界面新闻）</p>\n  <p><strong>整理丨李琪</strong></p>", "category": "tech", "published_at": "2026-11-21T01:19:00+00:00", "fetched_at": "2026-11-21T05:22:25.377481+00:00", "fingerprint": "37bd676214a5ed25"}, {"source": "36氪 - 最新文章", "title": "最前线｜半导体业务成主线，TCL中环增持中环领先股权至98.52%", "url": "https://36kr.com/p/4078863230800768?f=rss", "summary": "<p>近日，&nbsp;TCL中环（002129.SZ）公告称，拟向50名交易对方发行股份，购买中环领先65.80%的股份。交易完成后，其持股比例将由32.72%升至98.52%。</p>\n  <p>同时，本次购买资产的股份发行价为7.59元/股，交易对价尚待审计评估后协商确定。公司还拟募集配套资金，主要用于中环领先项目建设。目前交易处于预案阶段，尚需履行后续审议及监管程序。</p>\n  <p>11 月 16 日，TCL 中环也召开了媒体沟通会。36 氪从沟通会获悉，这笔交易发生在两项主业的不同周期位置：光伏业务仍在修复，半导体硅片业务已出现盈利改善。</p>\n  <p>TCL中环希望在AI需求向上游材料传导的过程中，提高半导体业务的权益贡献，同时提升公司的资源配置与管理效率。</p>\n  <h3>增持背后考量</h3>\n  <p>据公司披露，2026年前三季度，中环领先实现营收49亿元，同比增长15%，整体实现盈亏平衡。其中，第三季度营收18.58亿元，同比增长23%；净利润8000万元，并实现单季度经营性盈利。</p>\n  <p>从一季度亏损、二季度微利，到三季度盈利改善，中环领先的经营变化，是此次增持的重要背景。管理层表示，今年二季度以来，公司在业务端感受到AI及泛工业需求复苏带来的增长，部分业务陆续进入量价齐升阶段。</p>\n  <p>中环领先此前已纳入TCL中环合并报表，截至今年9月30日，TCL中环净资产规模超过320亿元，其中半导体材料业务净资产217亿元，约占公司净资产总额的70%。此次增持将提高上市公司对其未来利润及净资产的权益比例。</p>\n  <p>36氪也在会上进行了追问：除了增加利润份额，这次收购能解决哪些现有股权结构下难以推进的问题？</p>\n  <p>管理层解释，中环领先的外部股东众多，各类主体均有相应的治理要求，重大经营事项需要履行多方审议流程。持股比例提高后，有助于提升决策和管理效率，加快其全球领先战略，</p>\n  <p>使研发投入、产能扩建等需求能够快速形成决策并匹配资源，同时从上市公司层面统筹人才激励。</p>\n  <p>这给出了财务收益之外的另一层逻辑：在需求增长的窗口期，产线何时扩建、资金如何到位，会影响企业承接订单的节奏。股权进一步集中，为缩短内部决策链条提供了条件。</p>\n  <h3>AI需求如何转化为硅片利润</h3>\n  <p>半导体硅片是制造芯片的基础材料。管理层判断，AI正拉动逻辑和存储芯片需求，并有望进一步带动功率、电源管理等产品需求，这轮增长的持续时间可能超过以往传统周期。</p>\n  <p>公司披露，前三季度中环领先12英寸产品出货同比增长24%，8英寸及以下产品同比增长18%。不同尺寸的产品均有增长，但盈利表现存在差异。</p>\n  <p>管理层解释，部分特色工艺产品一直保持盈利，主要承压的是12英寸轻掺产品。这部分业务仍处于产能爬坡阶段，折旧摊销负担较重，国内竞争也较激烈。随着产量提升，固定成本得到摊薄，再叠加价格修复，公司的整体盈利能力逐步改善。</p>\n  <p>这意味着，需求增长能为硅片企业带来多少利润，取决于产能利用率、良率和产品结构。即使处于上行阶段，企业也需要把新增订单转化为稳定生产，才能消化前期投入。</p>\n  <p>全产品布局则给中环领先提供了更多客户切入口。管理层提到，不少客户同时拥有不同尺寸的晶圆厂，或经历了从8英寸向12英寸的发展过程。覆盖多个产品门类，有助于公司持续服务同一客户的不同产线需求。</p>\n  <p>按照公司规划，宜兴、徐州两个基地的12英寸产能将在2026年底合计达到100万片/月，2027年上半年接近130万片/月。同时，公司将推进高端逻辑、存储及高端封装用硅片的研发和验证。管理层强调，需要结合客户导入节奏和产能排产，将通过验证的产品转化为稳定供货。</p>\n  <p>这些投入，也体现出两项主业在当前阶段的不同任务。公司表示，将继续保持新能源光伏与半导体材料双主业经营。光伏业务侧重改善经营和现金流，通过现有产能技改、BC技术转化及全球化开拓提高竞争力，暂时没有其他大规模新增硅片产能规划；半导体业务则重点支持12英寸产能建设和高端产品研发。</p>", "category": "tech", "published_at": "2026-11-21T01:55:14+00:00", "fetched_at": "2026-11-21T05:22:25.377466+00:00", "fingerprint": "780e7f4c4c224da6"}, {"source": "少数派", "title": "游戏史最高分，不负 13 年的等待：《GTA 6》游玩体验", "url": "https://sspai.com/post/119327", "summary": "编注：本文首发于「篝火营地」，原作者多边形。少数派经授权后转载，仅对文章格式略作调整。原标题：《侠盗猎车手6》游戏评测：10分｜篝火。作为RockstarGames时隔13年推出的《侠盗猎车手》系列新 ...<a href=\"https://sspai.com/post/119327\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-20T07:34:26+00:00", "fetched_at": "2026-11-21T05:22:23.851824+00:00", "fingerprint": "48521dbb3304a699"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/119337", "summary": "📅本周新预告《克里夫·布斯的惊险再冒险》终极预告11月18日，《好莱坞往事》续集电影《克里夫·布斯的惊险再冒险》发布了终极预告，将于11月25日在北美上映，12月23日上线Netflix。大卫·芬奇执 ...<a href=\"https://sspai.com/post/119337\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-20T09:54:01+00:00", "fetched_at": "2026-11-21T05:22:23.851819+00:00", "fingerprint": "8e3c5051b370a23c"}, {"source": "少数派", "title": "这群在鸿蒙写应用的年轻人，只想做点「用得上」的", "url": "https://sspai.com/post/119291", "summary": "上周末，今年正式被列入「全国普通高校学科竞赛排行榜」的2026鸿蒙高校创新赛在南京大学迎来全国总决赛颁奖典礼。华为董事、终端BGCEO何刚出席现场致辞并为获奖选手颁奖。他在现场表示，HarmonyOS ...<a href=\"https://sspai.com/post/119291\" target=\"_blank\">查看全文</a>", "categor
