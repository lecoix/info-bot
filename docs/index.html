pper\"><img src=\"https://img.36krcdn.com/hsossms/20260726/v2_8d96bf1237474d739b80a982e540b79d@5721530_oswg3876062oswg2796oswg1558_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">飞行重卡 AT8000&nbsp;</p>\n  <p><strong>全球重载无人货运标杆，8 吨级 “空中重卡” 定义行业新高度</strong></p>\n  <p>飞行重卡 AT8000 是牧羽天航空深耕重载货运 eVTOL 领域的全新力作，最大起飞重量达 8000 公斤（8 吨），远超同类在研机型，是目前全球公认的重载货运 eVTOL 天花板。</p>\n  <p>核心性能：最大有效载重 3500 公斤（增程），巡航速度 252 公里 / 小时，满载航程 1000 公里（增程），可覆盖市县、山村、海岛等全场景低空物流网络。</p>\n  <p>创新构型：采用18 升力旋翼（4 个倾转）+2 推进旋翼的半倾转混动架构，垂直起降更稳定、巡航效率更高，兼顾高可靠性与长续航能力。</p>\n  <p>全栈自研：从概念设计、气动布局、结构强度到航空动力电机、全机航电系统，实现自主可控，具备全复合材料整机研发制造能力，核心技术完全自主知识产权。</p>\n  <p><strong>开启低空物流新时代，赋能多场景商业化应用</strong></p>\n  <p>区别于传统低空物流装备，AT8000 聚焦 “重载、远距、高效” 核心需求，可广泛应用于高时效物流配送、生鲜冷链运输、应急物资投送、海上补给、偏远地区物资保障等低空货运场景，真正实现 “门到门” 点对点直达运输。</p>\n  <p>相比传统陆运，飞行重卡AT8000 聚焦在急、难、险、贵的货运场景，不受地面交通限制、大大提升货运时效性，可有效解决生鲜，冷链和偏远地区、海岛、山区等地物流难题，为现代物流体系建设提供全新解决方案。</p>\n  <p><strong>里程碑节点密集推进，商业化运营进入倒计时</strong></p>\n  <p>自研发启动以来，牧羽天航空飞行重卡AT8000 已完成缩比机的验证飞行，充分验证飞机的系统可靠性。此次整机机身下线后，牧羽天航空将快速推进后续总装、系统集成、地面测试及首飞工作，同步加速适航认证进程，力争早日投入商业运营，抢占全球重载低空物流市场先机。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-27T08:23:39+00:00", "fetched_at": "2026-07-28T02:06:06.958016+00:00", "fingerprint": "ed5d6a9f1c9fefd2"}, {"source": "36氪 - 最新文章", "title": "2026年，为什么资本更青睐“会赚钱”的AI应用？", "url": "https://36kr.com/p/3913706151400583?f=rss", "summary": "<p>今年 WAIC 前夕，月之暗面发布了 Kimi K3，发布即破圈。但资本市场的注意力，更多地落在了另一件事上。</p>\n  <p>过去半年，这家明星大模型公司估值翻了 6 倍，目标 300 亿美元，同步推进赴港 IPO。而在 2025 年底的跨年夜全员信中，创始人杨植麟写下了一句话：2026 年聚焦 Agent，不以绝对用户数量为目标。</p>\n  <p>估值半年翻 6 倍的同时，他们也主动放弃了 DAU 这个过去两年颇被资本市场追着看的指标。</p>\n  <p>足以证明，用户规模虽仍旧重要，但不再是 AI 应用估值的唯一硬通货，新的叙事主线，重新回到了产品形态长期可持续的商业化。</p>\n  <p>资本评估 AI 的 benchmark 变了：过去两年盛行的是算力补贴换规模，但账面 DAU 只撑得起估值，撑不起毛利。资本市场发现，互联网时代的圈地打法在 AI 这里行不通，算力成本和留存曲线接连“显出原形”，曾经被寄予厚望的爆款产品也开始一批批退场。</p>\n  <p>行业拐点由此到来，资本不再为规模本身买单，转向了商业化质量验证。</p>\n  <p>新逻辑之下，拥有稳健商业模型的公司，反而有了更多作为“良币”留下来的机会，拿到更好的估值。比如，最近完成了超亿元 B 轮融资的海艺，就是一家被资本看好的稳健型企业：来自成都，面向全球，以“为 C 端而生”作为商业哲学，过去几年持续做出了爆款 AI 应用，财务数据也已经比较漂亮。</p>\n  <p>潮水退去之后，更值得追问的是：什么样的 AI 应用，能“站着赚钱”？</p>\n  <h2><strong>商业化质量验证，拐点已至</strong></h2>\n  <p>AI 应用层过去两年的主流叙事，是资本联手企业一起和硅谷比烧钱，所以规模优先、算力补贴，先把对手清退，毛利问题“留给以后”。这样的打法在资本宽松期跑得通，但在2025 年下半年已经开始显出疲态。</p>\n  <p>算力成本居高不下、获客成本越摊越高、留存数据普遍不好看，VC 烧不起了，估值逻辑自然也随之切换到了商业化验证。</p>\n  <p>然而，主流大模型和 AI 应用的商业化动作，过去几年其实从未停过，解法也各不相同。</p>\n  <p>订阅制稳定卖算力是很常见的路径，ChatGPT Plus、Claude Pro、Kimi都在走这条路，API 计费面向个人用户和开发者。广告变现的路径被一些高频轻量的应用采纳，AI 创作工具的 Credit 点数体系则是 Midjourney 这类平台的主流模式。每条路径都有人在试，也都跑出过阶段性数字。</p>\n  <p>商业化的热闹持续了两年，一直有人在赚钱，但一直在赚钱的人却很少。</p>\n  <p>一个令人唏嘘的例子是Character.Al，这家公司是全球 AI 角色互动赛道的标杆。Business of Apps数据显示，其2024年8月峰值月活达到了 2800 万，但接下来的几个月不增反降，到 2025 年 1 月已经流失了约 800 万月活。也是在2024年，Google 协议收编两位创始人，拿下其大模型的非独家许可权后，公司也停止了自研模型。</p>\n  <p>Inflection AI 的轨迹也类似，融了 13 亿美元，估值一度 40 亿美元，旗下产品 Pi 后来限流，创始人出走微软，转向企业服务。</p>\n  <p>两家明星公司的共同点，是都曾拥有过令人羡慕的用户规模和融资数字，但都没能跨过算力成本和留存曲线的检验。</p>\n  <p>因此，商业化大家都在做，但 2026 年行业也基本达成了共识：AI 的发展不能仅以商业化论成败，月活和付费数字远不是终点。在高昂的算力面前，高质量的商业化其实是一件很难的事。</p>\n  <p>那么对于 AI 来说，什么才算高质量的商业化？</p>\n  <p>这个问题，过去两年没人认真回答过，因为所有人都忙着抢规模，但现在已经到了必须回答的节点。答案其实也不复杂：用户愿不愿意为真实价值持续付费，能不能形成正毛利与高留存的组合。</p>\n  <p>毛利率，回答的是“这门生意能不能覆盖算力和获客成本”，留存和续费率回答的则是“用户体验过付费产品以后，还会不会留下来”。前者决定了商业模型是否成立，后者决定产品的价值是否真实有效。</p>\n  <p>这两个数字比 DAU 和付费用户人数，更能说明一家 AI 应用公司是否具有长期自成长性、以及抗风险的能力。</p>\n  <p>海艺给出的公开数据是：整体毛利率超过 40%，ARPPU（每付费用户平均收益）约 60 美元，核心产品续费率已超过60%。全球 AI ToC 应用市场，大多数企业目前仍然困在亏损换规模的循环里，能在毛利和留存两个维度同时跑到这个量级的公司，在应用层属于极少数。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_a6f6acae072d4e4db0b2bbec874b74b8@5510391_oswg2921886oswg2097oswg1180_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>海艺不是一家新公司，做的也不是新赛道。2023 年起步于成都，组织上全球化原生，以多模态AI创作社区起家，产品形态并不陌生：生成图片、训练 LoRA、做视频、聊角色。</p>\n  <p>但就是这样一个看起来”平凡而熟悉“的生意，财务结构在这轮商业化质量的拐点里，显得格外亮眼。</p>\n  <h2><strong>三条曲线，一个逻辑</strong></h2>\n  <p>高续费率、高 ARPPU 是前提，正毛利是答案，财务数据背后资本真正关心的问题是：海艺是怎么做到的，能不能长期保持下去。</p>\n  <p>高质量的商业化，本质是对的产品加上对的商业逻辑。因此，分析一家应用层公司，还是要回归去看他们做出了哪些产品，产品之间存在哪些逻辑闭环。</p>\n  <p>海艺的产品矩阵目前包含三条曲线。第一条是起家的 AI 多模态创作社区 SeaArt，用 36 个月的时间沉淀出了 200 万个 AI 原生创作资产，涵盖模型、LoRA、工作流和模板。</p>\n  <p>第二条是 AI 短剧平台 MoreShort，上线 6 个月之后月流水就突破了百万美元。</p>\n  <p>第三条是 AI 角色互动产品 SeaSoul，4 个月做到了日活 50 万，人均单日在线时长超过 66 分钟。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_61fab152dd964eb08979ad0060c72160@5510391_oswg180975oswg1242oswg2208_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>可以看出，三条曲线形态完全不同，分别是创作社区、短剧消费、角色互动，但共同点也很明显：都是在全球竞争激烈、从巨头到创业公司疯狂布局圈地的生意中，以极快的运营速度交出了AI资产和营收的答案。</p>\n  <p>站在这种“战场级”赛道上，一家公司能连续完成应用层的快速启动，在数据上接连跑通全球化运营，做出爆款，有两个不可或缺的结构。</p>\n  <p>更容易看到的一层是能力互锁。海艺把自身的产品体系拆成了五项能力：多模态生成、智能体互动、内容分发推荐、投流增长、商业化变现。</p>\n  <p>海艺先在创作社区里跑通了从内容生成、用户留存到付费变现的商业逻辑，再把关键环节抽象成了可复用的能力模块，搬到不同的产品形态中。</p>\n  <p>反过来，三条产品线也在持续深化这套能力体系，创作社区场景积累角色资产和生成模型，MoreShort 在短剧消费场景中训练分发效率和变现路径，SeaSoul 在角色互动场景中打磨智能体的对话与留存。</p>\n  <p>正向循环之下，新产品的验证周期也被大幅压缩，SeaArt 用了 36 个月，MoreShort 压缩到 6 个月，SeaSoul 只用了 4 个月。同一套能力结构带来的爆款效应，在不同形态的产品上得到了复现。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_af98f7e9aa9e45149d4d9bc0b5043f73@5510391_oswg1770850oswg2050oswg1289_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>大多数 AI 应用验证不了高质量的商业化模型，也正是因为能力结构不完整。比如模型生成做得好，但不擅长做分发和投流，或者增长做得猛，但预判不到哪些内容增长直接能对应商业化变现。最好的情况是，单点应用的商业逻辑跑通了，但无法快速复制到下一个产品，错过了窗口期。</p>\n  <p>再往里去看，战略逻辑体现为一条完整的用户路径：角色是入口、故事是消费、互动是关系。</p>\n  <p>用户先通过角色进入产品，在故事消费中产生内容付费，在互动关系中沉淀留存。因此，三条产品线看似是不同场景下的需求展开，背后的用户行为模型其实只有一个。</p>\n  <p>AI 应用和互联网时代的圈地打法，底层逻辑其实很不一样：互联网的逻辑是先圈用户再变现，规模本身即壁垒，因为边际成本趋近于零。而AI 应用的算力成本是持续发生的，每一次生成都要付费给算力，规模越大成本越高。</p>\n  <p>这也就是为什么，AI 应用层的算力成本和获客成本很容易被卡在一家公司刚刚成为资本明星的阶段。常见现象是付费用户越多、算力成本越高，规模化之后反而负载不起，用户体验持续下滑，最后留不住人。</p>\n  <p>算力补贴换规模的理想看似美好，但其实经不起长期商业化质量的检验。能真正跑通的，是能把能力结构化、把单位经济模型算清楚的那一类公司。</p>\n  <h2><strong>生态的飞轮，怎么转起来</strong></h2>\n  <p>钱往哪里流、钱来自于哪里，是判断一家公司走向最直接的方式。</p>\n  <p>刚刚完成了B轮融资的海艺，本轮由视觉中国、华盖创赢、祥峰投资联合领投，广发信德、天投资本、川创投、广州合伟永晟等机构共同投资。历史股东名单里，还有阿里、腾讯、招银国际、钟鼎资本、Actoz、上海人工智能产业系列基金、和溋资本等知名产业基金和机构。</p>\n  <p>把名单拆开看，三类投资人的诉求各不相同，对应的却是 AI 应用需要同时满足的几个标准。</p>\n  <p>投资机构要的是增长曲线、生态差异化和商业化持续验证的能力，投的是能穿越周期的财务回报。</p>\n  <p>产业方更在意上下游生态协同，比如视觉中国作为 A 股上市的全球视觉内容版权服务平台，要的是 AI 时代的内容供给和 B 端商业化场景。地方政府基金更多考虑的则是产业落地和全球化 AI 应用标杆。</p>\n  <p>“资本+产业+政府”的组合在同一轮融资名单里出现，证明海艺也同时拿得出这三样东西：商业化质量的硬数据、产业生态协同的延展性、区域产业的带动能力。</p>\n  <p>全球化用户规模和内容资产，作为海艺的“家底”，恰好能回应这几个要求：累计注册 6500 万，月访问量超过 3000 万，海外用户占比超 90%，覆盖日本、美国、巴西、俄罗斯等核心市场；用户单日生成内容超过 1000 万张图片与 50 万条视频，这是所有商业化故事的底座。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_7a12c7762f8d46b4abab9e6c5683bdd0@5510391_oswg2385511oswg2097oswg1196_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>海艺的内容资产涵盖模型、LoRA、工作流、模板和 Agent，是全球规模尤为可观的AI创作资产库之一，创作者的内容持续丰富平台生态，平台增长与商业化能力的提升又能为创作者带来更多分发和变现机会。</p>\n  <p>除了核心的ToC生态之外，海艺也在把模型服务、AI 资产管理、Agent 能力以及全球化投放的基础设施向 B 端、P 端和 OPC （一人公司）团队开放，在自有生态之外连接了更多的外部共创者。</p>\n  <p>创作者可以在统一的基础设施上，跑完从角色设定、视觉生成、剧情生产到商业化分发的完整链路，独立创作者和小团队也能做过去只有强IP、大公司才做得起的事。</p>\n  <p>在视觉中国的内容产业支持下，海艺将会在广告、营销、出版、影视这些向外延展的场景中，更快完成数字内容的合规和渠道开拓，这也是AI 产品全球化的硬门槛。</p>\n  <p>扎根于成都本土的产业链，是这家全球化公司的另一个生态落点。海艺联合四川天府新区打造了“天府 T·OPC 星海创业营”，为 AIGC 创作者提供算力、工具和政策支持，培育一人公司生态，帮助轻量化团队完成 AI 原生内容的生产与商业化。</p>\n  <p>AI 内容消费的终局长什么样，现在没人能给出明确的答案。可能是某种尚未被定义的产品形态，也可能是以一种我们从未想象过的方式和主流终端，重新组织创作、消费和社交的关系。</p>\n  <p>而处在风口之上的海艺，回答的是一个更宏观、更长期的问题：一家 AI 应用公司在2026年，可不可以不烧钱，可不可以做到正毛利，让用户为真实价值持续付费？</p>\n  <p>答案已经得到验证。</p>\n  <p>剩下的事情，是把这个爆款制造系统和生态协同的边界继续往外推，一边造血，一边让资本市场、产业方、政府基金、全球创作者生态实现合力。</p>", "category": "tech", "published_at": "2026-07-27T09:48:07+00:00", "fetched_at": "2026-07-28T02:06:06.958012+00:00", "fingerprint": "025671f226344ea0"}, {"source": "36氪 - 最新文章", "title": "清华博士团队创业，这家公司要给飞机做氢能「心脏」｜36氪首发", "url": "https://36kr.com/p/3913736066028932?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>航空新能源动力系统，正在酝酿新的变革。</p>\n  <p>36氪获悉，航空新能源动力系统解决方案供应商<strong>「易氢动力」已完成数千万元天使+轮融资，由红鸟启航基金和贵州科创天使基金领投，水木清华校友种子基金，启迪之星创投，楹辉创投，金源合及天使会跟投。</strong>本轮资金主要用于航空级液冷燃料电池产品的开发及验证，以及空冷燃料电池在多场景的商业化推广及应用。</p>\n  <p>过去十年，氢燃料电池研发与产业化应用主要集中在汽车领域，已形成相对清晰的降本路线和成熟标准，但在航空领域，国内氢能应用的发展并不同步。</p>\n  <p>氢能航空并非新的概念，事实上，欧洲早在21世纪初就开始论证航空新能源动力系统不同路线方向的优缺点和路径可行性。氢燃料电池的核心优势在于，能量密度高、环境适应性更强。相对于动力电池，其航程可提高3倍以上，并且补能快、低温性能好，<strong>更适合eVTOL“空中出租车”高频周转的商业模式。</strong></p>\n  <p>对比传统航空煤油和SAF，从长期来看，其燃料成本更低，在兼顾性能达标与经济可行性方面具备优势。</p>\n  <p>但受限于上游技术迭代、产业配套和应用成本问题，在较长一段时间里，氢能航空这一技术路径在国内处于共识未到、需求初显的状态。</p>\n  <p>随着近些年绿电、绿氢得到很好的推广及应用，易氢动力创始人张科勋的判断是，<strong>“氢能作为燃料的使用成本，在中国会很快的低于航空煤油。氢能最终会凭借成本优势在航空业成为首选的技术路线。”</strong></p>\n  <p>作为欧阳明高院士孵化的氢能产业链创业项目，易氢动力团队核心班底均来自清华大学，创始人兼CEO张科勋为清华大学汽车系博士，自2002年就开始深耕新能源动力系统研发及产业化工作。</p>\n  <p>依托清华大学在燃料电池领域超过20年的技术积累与产业资源，早在2018年，项目组就开始对氢能在航空领域的应用做详细的技术论证，并于2020年联合西工大启动第一个课题研究，做国内第一个航空专用的30kW液冷燃料电池。</p>\n  <p>“最初的起步其实很艰难，因为（第一款液冷产品）所有零部件、原材料都要按照航空级标准重新定制开发，研发周期长、技术难度高，投入也比较大，用了大概三四年的时间，这也是易氢动力成立的背景。”</p>\n  <p>张科勋提到，过去氢能航空的先进性在国内并没有被广泛认可，但好在，新的共识正在加速形成。</p>\n  <p>随着低空经济和商业航天风口的接踵而至，燃料电池在大功率、长续航、高适应性等性能上的优势开始被更多人关注到 ， 目前 国内多家头部航空 主机厂也在加速推进氢能动力系统的研发及验证。而在此之前，易氢动力已经默默耕耘了数年。</p>\n  <h2><strong>先啃“硬骨头”</strong></h2>\n  <p>啃下第一款30kW液冷燃料电池这块“硬骨头”，让易氢动力在创业初期便建立了一套区别于车用燃料电池系统的工程认知。而航空级和车规级的区别，是理解这家公司技术版图的关键。</p>\n  <p>在张科勋看来，<strong>航空级动力系统的能力要求主要体现在三个维度：</strong>极高的环境适应性（比如万米高空、低温低压等环境）、极致的可靠性（比如上万小时的寿命、高安全性的适航认证要求）以及对功率密度的苛刻要求。</p>\n  <p>易氢动力的技术布局，有一条从能力溢出到场景收敛的清晰脉络。</p>\n  <p>目前，其产品体系围绕液冷与空冷两条路线展开，二者在定位、功率、环境适应性上形成鲜明互补。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_eaa8404294e94ac8a37c12fc7435ed34@577536001_oswg45834oswg1080oswg483_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">30kW液冷燃料电池动力系统</p>\n  <p><strong>液冷燃料电池是易氢动力长期押注的技术主线。</strong>它的特点是功率大（百千瓦级）、环境适应性强，可支撑万米高空、极寒等严苛工况，寿命目标上万小时。从2020年开始研发起步的30kW液冷燃料电池，易氢动力如今已迭代至90-110kW，未来规划拓展到三百千瓦级产品。</p>\n  <p>张科勋提到，目前液冷路线已基本完成核心技术攻关，处于从1到10的产品化阶段，接下来的核心任务是配合主机厂做适航导向的工程开发。</p>\n  <p>在液冷的技术主线之外，空冷燃料电池则是易氢动力在2024年基于低空经济窗口期做出的战略延伸。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260727/v2_c5c92b9f9873439e80141000b2493dd8@577536001_oswg35077oswg1080oswg506_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">空冷燃料电池动力系统</p>\n  <p>空冷燃料电池的特点是功率较小（通常在10kW以下）、技术难度相对较低，但开发迭代快、落地周期短，更适合以无人机为主的低空经济领域场景应用。</p>\n  <p>用了不到一年时间，易氢动力的空冷产品就完成了三轮迭代，已进入场景应用拓展阶段。</p>\n  <p>这两条路线的战略分工也相对明确：<strong>液冷锚定长期技术壁垒和利润空间，空冷承担短期现金流和技术迭代试验平台的双重角色。</strong></p>\n  <p>用更短期的商业回报，反哺液冷这条更长周期的技术主线，博长期定价权。</p>\n  <h2><strong>闯入主流</strong></h2>\n  <p>在液冷方向，一个重要的进展是，易氢动力目前已成为中国商飞在氢能动力系统方向的合作供应商。此外，易氢动力也与多家eVTOL整机厂建立合作，共同推进其氢能机型的研制。</p>\n  <p>当然，一款航空级产品从验证到批产，周期极为漫长。适航标准的探索、整机验证的复杂性，都决定了液冷燃料电池在短期内很难贡献规模化营收。</p>\n  <p><strong>空冷方向则承担了业务快速放量的期待。</strong></p>\n  <p>从落地节奏来看，2025年下半年，易氢动力已完成空冷产品解决方案的开发及验证，接下来将重点在低空经济领域进行推广，解决过去锂电池“够不到”的长航时场景。</p>\n  <p>“动力电池把能用的场景都探索完了，剩下的长续航、高寒这些电池满足不了的场景，就是氢能的机会。”张科勋提到，在无人机巡检、低空物流等细分领域，氢能方案能提供3-4倍于锂电池的续航，覆盖半径从几公里拓展到上百公里，而目前易氢动力整套空冷系统解决方案的价格与纯电方案基本能实现持平。</p>\n  <p>一组数据是，2025年和2026年，<strong>成飞用易氢动力系统开发的高空无人机在使用气氢作为燃料的情况下，分别实现了连续飞行30小时和24小时的记录。</strong></p>\n  <p>无人机巡检场景是易氢动力今年的重点推广领域，其整套空冷解决方案在上半年已实现数百万收入，2026年的目标是在巡检场景做到数千万级营收。</p>\n  <p>低空物流则是其下一个重点推广方向，针对该场景应用的空冷产品解决方案目前处于开发阶段，将于下半年启动验证推广。</p>\n  <p>从节奏上看，空冷今年的任务是快速放量，而液冷的规模化营收，张科勋预计至少要到明后年才会逐步显现。</p>\n  <p>在国内，尽管当下氢能航空的适航仍处于刚起步的阶段，节奏上慢于欧美，但张科勋对中国在氢能航空领域的后发优势相对笃定。</p>\n  <p>在产业端，一个关键性的信号是绿氢的成本优势，<strong>随着国内绿氢成本的快速下降，氢能动力系统在燃料端的价格优势将进一步凸显。</strong>“一旦技术成熟，我们市场迭代的速度会比国外快得多，就像电动车一样，很可能弯道超车。”张科勋说。</p>\n  <p>在这个新旧动能转换的十字路口，易氢动力作为一家创业公司，给出的解法也并不复杂。在长周期里，用“液冷”锚定住技术稀缺性的价值；在短周期里，用“空冷”回答如何“先活下来”的现实问题，抓住氢能航空动力系统产业化的窗口期，构建长期竞争壁垒。</p>", "category": "tech", "published_at": "2026-07-27T10:19:29+00:00", "fetched_at": "2026-07-28T02:06:06.958007+00:00", "fingerprint": "0512006c9b427ef5"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜美国大型企业告别裁员潮重启招聘；英伟达、微软、IBM等数十家企业成立新联盟，旨在共同保障AI安全；《光伏行业成本核算模型通则》发布，引导行业有序竞争", "url": "https://36kr.com/p/3913320648971395?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3913742527714433\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>汇丰控股将在新加坡设全球人工智能卓越中心，并招聘超100名AI专家</strong></a></p>\n  <p>汇丰控股7月27日宣布，将于今年下半年在新加坡设立全球人工智能卓越中心（CoE），旨��开发可扩展至集团全球网络的AI能力，并计划招聘100多名AI专家。声明称，该卓越中心初期将专注于提升客户财富管理体验、引入智能化的财资解决方案以及开发AI赋能的数字支付。（界面）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913798998201732\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>小米MiMo-V2.5登OpenRouter全球周榜、月榜双第一</strong></a></p>\n  <p>36氪获悉，7月27日，OpenRouter最新数据显示，小米MiMo-V2.5登上全球大模型调用量周榜、月榜双第一，成为当周全球调用量唯一突破10T的模型。5月以来，MiMo-V2.5全球调用量持续攀升，单周token量从1.46T逐步升至10.46T，两个月增长约 616%。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913549997692288\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美团AI“小团”全面升级</strong></a></p>\n  <p>36氪获悉，7月27日，美团宣布旗下本地生活AI原生助手“小团”全面升级。新版“小团”在搜索、问答和决策辅助之外，进一步升级代理执行能力：用户提出需求后，“小团”可结合实时信息，协助完成下单、打车、订位等各类本地生活服务相关操作。截至目前，“小团”的信息服务已覆盖全国2800多个城市，累计完成超过7亿次商家信息校验，收录用户评价超过13亿条。今年五一假期期间，“小团”相关服务累计曝光超过39亿次。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913527712109955\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>韩国交易巨头与LG CNS合作，在代币化测试中将应收账款上链</strong></a></p>\n  <p>韩国最大的贸易公司 POSCO International 已开始在区块链上对贸易应收账款进行代币化试点，该试验有望加快其全球子公司之间的商业支付速度。该公司去年通过涵盖钢铁、能源及电池材料的业务实现了222亿美元的收入。该公司表示，正与LG集团的技术部门LG CNS合作，在Layer-1区块链Injective（INJ）上发行、转让及结算应收款项，两家公司在一次新闻简报会上向CoinDesk透露。此次试点使用的是由浦项制铁海外业务及其交易对手之间的真实贸易产生的应收账款，而非模拟交易。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913491656693120\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>企业微信智能助理“大圆”开启内测</strong></a></p>\n  <p>36氪获悉，据微信派消息，企业微信智能助理“大圆”现已开启内测，支持调用企业微信智能文档、智能表格、会议、日程等几十项能力。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913371415106949\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美国大型企业告别裁员潮重启招聘</strong></a></p>\n  <p>美国各大巨头企业坦言：到头来或许还是需要扩招人手。过去数月，大型用人单位始终将招聘视作成本高昂的最后备选方案。如今各行各业用工策略集体出现转向。近几日，铁路巨头CSX、谷歌母公司Alphabet等多家企业均向投资者透露，计划通过招聘达成增长目标、抢抓新兴技术发展机遇。这场至少小幅扩充人员编制的扩招动作，彻底扭转了人工智能时代大部分时间里企业的主流论调。此前受经济前景不确定性影响，加之企业普遍认为人工智能可承接大量岗位工作，头部企业基本冻结了人员新增。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913680378893703\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英伟达、微软、IBM等数十家企业成立新联盟，旨在共同保障AI安全</strong></a></p>\n  <p>7月27日，英伟达、微软、Adobe、SpacexAI、IBM、SAP、戴尔、思科等企业宣布成立开放安全人工智能联盟，旨在构建和共享开放工具，以促进AI的负责任使用。该联盟成员还包括Cadence、Capital One、Cloudera、Cloudflare、Cognition、CrowdStrike、Databricks、DoorDash、Elastic、慧与、Hugging Face、LangChain、Linux基金会、NAVER、NetApp、Nous Research、OpenClaw、Palantir、Palo Alto Networks、Red Hat、Reflection AI、Salesforce、SK电讯、ServiceNow、西门子、Snowflake、Synopsys、Thinking Machines Lab和TrendAI。（界面）</p>\n  <h2>投融资：</h2>\n  <p><a href=\"https://36kr.com/newsflashes/3913502872589700\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>物理AI公司“正奇未来”8个月完成3轮数亿元天使融资</strong></a></p>\n  <p>近日，物理AI公司正奇未来宣布，8个月完成3轮数亿元天使系列融资，核心资方为鼎晖VGC投资、线性资本、上汽集团恒旭资本、柏睿资本、正轩投资、周大福投资等。公司定位“技术+产品”双驱动，聚焦Door-to-Door移动任务，其核心品牌QUORRA专注于打造短途出行机器人。目前，品牌首款产品已量产，并在全球十多个国家和地区拿到商业订单，计划年内于海外开展DTC业务，并同步完成天猫、京东旗舰店的开设以及国内多个省市线下门店网点的铺设。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3913573466313862\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>《光伏行业成本核算模型通则》发布，引导行业有序竞争</strong></a></p>\n  <p>今天（27日），《光伏行业成本核算模型通则》正式发布，这将以统一标尺引导行业有序竞争。据了解，这一核算模型通过统一“硅料—硅片—电池—组件”全产业链的成本计算范围、计算系数和计算模型，形成贯通产业链的成本核算框架，可破除行业内成本核算口径不一、各自表述的乱象。这是光伏行业管理从自律倡议走向制度化、标准化的重要一步。（央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913508035532160\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>57个国家和3个国际组织确认参加今年进博会国家展</strong></a></p>\n  <p>中国国际进口博览局党委书记、副局长吴政平在27日举行的第九届进博会新闻通气会上介绍，第九届进博会已有57个国家和3个国际组织确认参加国家展，摩尔多瓦、罗马尼亚和联合国开发计划署将首次参展。（央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913802652161409\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>工信部：加快编制出台智能网联新能源汽车产业发展“十五五”规划</strong></a></p>\n  <p>7月27日，工业和信息化部装备工业一司司长郭守刚在2026世界智能网联汽车大会媒体圆桌会上介绍了我国智能网联汽车产业发展情况。下一步，工信部将加快编制出台智能网联新能源汽车产业发展“十五五”规划，深入贯彻落实《国家标准化发展纲要》，加快突破一批关键核心技术，加速重点标准研制、国际协调和贯彻实施，深入推进“车路云一体化”应用试点、生产准入和上路通行试点，推动建立贯通全产业链的生态体系。（澎湃）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3913751496070536\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美宣称拟对中国人工智能企业开展调查并实施制裁，商务部回应</strong></a></p>\n  <p>商务部新闻发言人就美宣称拟对中国人工智能企业开展调查并实施制裁答记者问。问：近日，美国一些高级官员公开表示将针对中国人工智能企业所谓“蒸馏”美前沿模型开展调查，并可能以“窃取美国知识产权”等为由制裁中国企业。请问中方对此有何评论？答：我们注意到有关情况。中方一贯反对美方将科技经贸问题政治化、工具化，以各种莫须有的理由污名化中国企业并实施制裁。美方罔顾有关中国企业人工智能模型与美前沿模型发布时间非常接近、中国部分模型能力已处于领先地位等事实，给中国企业扣上所谓依靠“蒸馏”“窃取美国知识产权”等帽子，还威胁进行打压制裁。这些做法缺乏事实依据，没有法理支撑，在实践上搞双重标准，属于典型的人工智能霸权主义行径。中方敦促美方倾听中美两国业界客观、理性声音，纠正霸权思维，停止对中国企业的抹黑和制裁威胁。对于任何实质性损害中方利益的行为，中方将采取一切必要措施，坚定维护自身正当合法权益。希望美方切实落实两国元首共识，同中方相向而行，加强人工智能对话、沟通，共同推动人工智能向上向善，通过推进并完善人工智能治理造福两国和世界。（央视新闻）</p>", "category": "tech", "published_at": "2026-07-27T11:37:06+00:00", "fetched_at": "2026-07-28T02:06:06.958001+00:00", "fingerprint": "f48e7fd72b5d5a0f"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨李斌现身长鑫科技答谢晚宴；瑞幸打赢“泰国瑞幸”，获赔近2000万；澳门政府发布美素佳儿奶粉铅超标事件最新检测结果", "url": "https://36kr.com/p/3914520847570307?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>2026暑期档电影票房已突破57亿</li>\n   <li>茅台多地直营店：53度、500ml飞天茅台售价提至1719元/瓶</li>\n   <li>长鑫科技上市半日，7名高管晋升“10亿身家”</li>\n   <li>巴西总统卢拉：美持续在关税上对巴施压系战略错误</li>\n   <li>苹果公司称多项服务出现故障，包括App Store</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>蔚来战投长鑫科技浮盈超7亿，李斌现身答谢晚宴</strong></p>\n  <p>7月27日，国产存储龙头企业长鑫科技正式登陆科创板，一举成为A股最大市值公司。截至当天收盘，公司报49元/股，全天涨幅465.82%，总市值3.31万亿元。值得注意的是，近日，蔚来现身长鑫科技IPO战略配售名单，承诺认购金额1.58亿元人民币，锁定期18个月。按发行价8.66元/股计算，蔚来认购约1824.48万股。以27日收盘价49元/股计算，蔚来账面浮盈约7.4亿元，收益率超465%。当天，有博主发布照片显示，长鑫科技日前在上海举办了上市答谢晚宴，主题为“长铸十载 鑫启未来”，蔚来创始人李斌现身晚宴现场，手持红酒面带笑容。（界面新闻）</p>\n  <p><strong>瑞幸打赢“泰国瑞幸”，获赔近2000万</strong></p>\n  <p>7月27日，瑞幸官方微博转发了泰国知名律所Tilleke&amp;Gibbins发布的一则消息。消息显示，泰国专门案件上诉法院近日宣布，瑞幸咖啡诉泰国瑞幸商标侵权案二审胜诉，维持一审原判。法院认定被告恶意抢注商标和侵权行为，判令被告撤销已注册的瑞幸商标，永久禁止在与咖啡业务相关的经营活动中使用瑞幸商标，包括“LUCKIN COFFEE”“瑞幸咖啡”以及鹿头标识。同时，法院判令被告向瑞幸赔付损害赔偿金1000万泰铢，外加逾8500万泰铢的持续性损害赔偿金，总金额累计逾9500万泰铢（约合1918万元人民币）。</p>\n  <p>早在2021年，瑞幸计划落地泰国市场前夕，当地多名主体抢先注册包含“LUCKIN COFFEE”英文标识、“瑞幸咖啡”中文字样、小鹿图形全套商标，同步注册近似企业名称与公章，并依托抢注商标开设线下咖啡门店。2023年12月，泰国皇家50R集团（50R group）曾向法院提交诉讼，要求法庭判决中国瑞幸咖啡赔偿经济损失100亿泰铢（约20亿元人民币），法院对此已立案受理。此后瑞幸与抢注方开展多轮前置商标争议程序，该案曾引发各界对泰国境内境外合法品牌权利人保护问题的大规模讨论。（界面新闻）</p>\n  <p><strong>澳门政府发布美素佳儿奶粉铅超标事件最新检测结果</strong></p>\n  <p>澳门政府官网7月27日晚间发文称，多部门联合跟进“皇家美素力1号”婴儿奶粉铅超标事件，在同时增检该品牌1-4号共13个样本，重金属铅检测未见异常。卫生局设儿科急诊绿色通道，所有求诊者无铅中毒紧急情况。</p>\n  <p>7月25日，澳门特别行政区政府网站曾发布消息，称皇家美素力1号奶粉被检出铅含量超标。菲仕兰公告回应称，菲仕兰香港有限公司在接到通知后，对同批次的产品在第三方权威实验室进行确认检测，最终检测结果和结论为产品铅含量未超出标准，检出结果为＜0.007mg/KG，澳门食安标准为＜0.02mg/KG。（第一财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>美团AI“小团”全面升级</strong></p>\n  <p>36氪获悉，7月27日，美团宣布旗下本地生活AI原生助手“小团”全面升级。新版“小团”在搜索、问答和决策辅助之外，进一步升级代理执行能力：用户提出需求后，“小团”可结合实时信息，协助完成下单、打车、订位等各类本地生活服务相关操作。截至目前，“小团”的信息服务已覆盖全国2800多个城市，累计完成超过7亿次商家信息校验，收录用户评价超过13亿条。今年五一假期期间，“小团”相关服务累计曝光超过39亿次。</p>\n  <p><strong>小米MiMo-V2.5登OpenRouter全球周榜、月榜双第一</strong></p>\n  <p>36氪获悉，7月27日，OpenRouter最新数据显示，小米MiMo-V2.5登上全球大模型调用量周榜、月榜双第一，成为当周全球调用量唯一突破10T的模型。5月以来，MiMo-V2.5全球调用量持续攀升，单周token量从1.46T逐步升至10.46T，两个月增长约 616%。</p>\n  <p><strong>阿里AI Agent“千问办公”小范围测试</strong></p>\n  <p>36氪获悉，阿里新款AI Agent产品“千问办公”开始小范围测试，目前上线的是本地桌面客户端，后续将陆续上线网页端和钉钉内置版。</p>\n  <p><strong>美团CatPaw全新上线，已在多个真实业务场景中完成验证</strong></p>\n  <p>36氪获悉，7月27日，美团全场景AI Agent平台CatPaw全新上线。该平台提供开箱即用的AI工作台，以及企业级Agent开发与托管能力，旨在帮助企业和商家构建可协作、可管理的AI帮手，推进日常业务的智能化处理，提升商家经营效率。目前，CatPaw已在美团内部覆盖9万名员工、搭建超过3万个Agent，并在餐饮、美业、宠物医院等多个真实业务场景中完成验证。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>日本作家东野圭吾去世，终年68岁</strong></p>\n  <p>日本作家东野圭吾于当地时间23日因结肠癌去世，终年68岁。东野圭吾凭借直木奖获奖作品《嫌疑人X的献身》以及被改编成影视作品、在日本国内外广受欢迎的《白夜行》等众多畅销小说而闻名。</p>\n  <p>东野圭吾1958年出生于大阪市。从大阪府立大学电气工程系毕业后，他一边在一家制造厂担任工程师，一边开始写作生涯。1985年，他凭借推理小说《放学后》荣获江户川乱步奖，该小说讲述了一起发生在女子高中的密室谋杀案，这也是他的出道作。1999年，他凭借小说《秘密》荣获日本推理作家协会奖。</p>\n  <p>2005年出版的《嫌疑人X的献身》是他的代表作，讲述了一位拥有数学天赋的高中教师试图实施完美犯罪，而他的老朋友——一位物理学家——则试图破解这桩谜案。这部作品巧妙地将出人意料的真相与纯粹的爱情故事融合在一起，荣获了直木奖和本格推理奖。（第一财经）</p>\n  <p><strong>美股三大指数收盘涨跌不一，苹果重返全球市值第一</strong></p>\n  <p>36氪获悉，7月27日收盘，美股三大指数涨跌不一，道指涨0.51%，标普500指数涨0.02%，纳指跌0.18%。大型科技股涨跌不一，苹果涨超1%，总市值逼近5万亿美元，再次超越英伟达，成为全球第一；谷歌涨超2%，微软涨超1%，奈飞涨0.44%；英伟达跌近5%，特斯拉跌超1%，英特尔跌0.7%，亚马逊跌0.31%，Meta跌0.22%。热门中概股普涨，腾讯音乐涨超5%，富途控股、理想汽车、哔哩哔哩涨超4%，小鹏集团、网易涨超3%，蔚来、阿里巴巴、京东、拼多多涨超2%。</p>\n  <p><strong>中际旭创据悉将把香港发售价定在每股980港元，低于最高推介价格</strong></p>\n  <p>据媒体援引知情人士透露，中际旭创目前告诉潜在投资者，其香港上市交易的价格势将定在低于最高推介价格的水平上。知情人士称，该公司将把价格定在每股980港元；由于事未公开，知情人士要求匿名。之前的最高推介价格为1010港元。另据36氪获悉，港交所27日公告，若中际旭创相关股票成功上市，其中际旭创股票期权将于2026年7月30日开始交易，涵盖每月及每周到期合约，合约买卖单位为50股，持仓限额为5万张。（新浪财经）</p>\n  <p><strong>2026暑期档电影票房已突破57亿元</strong></p>\n  <p>据网络平台数据，截至27日零点，2026年暑期档电影总票房（含预售）已突破57亿元，2026年度电影总票房（含预售）已突破214亿元。（央视新闻）</p>\n  <p><strong>茅台多地直营店：53度、500ml飞天茅台售价提至1719元/瓶</strong></p>\n  <p>记者获悉，近期北京、上海等地茅台直营店已将53度、500ml飞天茅台售价提升至1719元/瓶，高于i茅台平台1639元/瓶的售价。一位茅台直营店人士对记者表示，此举主要是为推行以消费者为中心的市场化改革，价格随行，未来茅台直营店定价或将综合门店运营成本等因素，对标市场零售端的实际成交价，以保障市场公平。（财联社）</p>\n  <p><strong>长鑫科技上市半日，7名高管晋升“10亿身家”</strong></p>\n  <p>截至7月27日早盘收市，长鑫科技报54.65元/股。该公司14名董事、高级管理人员、核心技术人员及其近亲属合计间接持有该公司20.34亿股，按照54.65元/股计算，持股市值合计达到1111.79亿元，每人的持股市值均超1亿元。其中，董事长朱一明和董事、总裁、核心技术人员曹堪宇持股市值超过百亿元，分别为869亿元、115.96亿元。另有5名高管持股市值超过10亿元，分别为执行副总裁朱文菊（29.15亿元），联席总裁张羽（27.65亿元），高级副总裁、财务负责人黄丹阳（19.83亿元），高级副总裁、核心技术人员李红文（15.23亿元），副总裁、董事会秘书袁园（11.07亿元）。（第一财经）</p>\n  <p><strong>公司推出大额回购方案的原因？是不是会常态化？宁德时代回应</strong></p>\n  <p>宁德时代7月24日的业绩说明会上，关于“公司推出大额回购方案的原因？是不是会常态化？”的问题，宁德时代称，近期资本市场有一定波动，公司股价也有所下跌，综合考虑公司财务状况、行业地位、资本市场等因素，且为应对未来可能因市场波动而出现公司股价大幅下滑、估值与公司实际价值不匹配的情况，公司推出了回购计划，本质上是对公司长期发展前景充满信心。回购事项需要综合考虑诸多因素，公司将根据具体情况一事一议、逐项进行审慎分析及合规审议。（证券时报）</p>\n  <p><strong>黄金销售端持续回暖，回收业务遇冷</strong></p>\n  <p>近期，国际金价出现震荡。进入暑期，深圳水贝黄金市场人气明显回暖。作为国内最大的黄金珠宝集散地，近期这里迎来不少外地游客，询价和试戴的客流络绎不绝。有商户表示：“7月份环比6月份，我们整体销量增长了10%左右。”近期水贝的婚庆类黄金饰品销售尤为亮眼，多家婚庆主题的金店人气十足。消费偏好也出现变化，小克重、轻量化黄金饰品更受年轻消费者青睐。与黄金销售端的持续回暖相比，单纯的黄金回收业务则显得相对冷清。与黄金销售端的持续回暖相比，单纯的黄金回收业务则显得相对冷清。走访水贝多家回收门店了解到，受近期黄金回收价格回落的影响，直接卖金变现的客户明显减少。（央视财经）</p>\n  <p><strong>腾讯云：7月27日起TDSQL-C MySQL版产品架构2.0正式商业化计费</strong></p>\n  <p>36氪获悉，腾讯云公告，TDSQL-C MySQL版产品架构2.0即将结束公测，自北京时间2026年7月27日00:00:00起，正式商业化计费。产品架构2.0的计费项分为计算资源和存储资源，其中，计算资源（CPU、内存）的价格和产品架构1.0相同；存储资源的价格与产品架构不同（低于产品架构1.0），详细计费价格请参见产品价格。</p>\n  <p><strong>巴西总统卢拉：美持续在关税上对巴施压系战略错误</strong></p>\n  <p>当地时间7月26日，巴西总统卢拉在美媒《华盛顿邮报》上发文，批评美国近期对巴西接连施加关税压力的做法。卢拉在文中表示，巴美之间的谈判以及美国最高法院的裁决，废止了去年7月开始的第一版关税政策。但今年7月，美国政府决定对巴西征收12.5%至37.5%的新关税。新的关税不仅不公平，而且是一个战略错误：它们损害了美国经济和与巴西的伙伴关系，还将在中长期导致目前两国高度整合的生产链出现混乱，巴西企业将用其他合作伙伴取代美国供应商。（央视新闻）</p>\n  <p><strong>特斯拉Optimus项目遭“泼冷水”知名投资人：短期不会产生收入</strong></p>\n  <p>特斯拉CEO马斯克将人形机器人称为该公司“有史以来最重要产品”，然而美国一位知名投资者日前警告称，马斯克要让特斯拉Optimus机器人实现商业成功可能需要漫长的时间，因为其不仅难以制造，且短期内不太可能带来收入。投资公司Gerber Kawasaki的首席执行官Ross Gerber表示，制造人形机器人最大的障碍是复制人类独特的身体能力。Gerber还质疑了以消费者为中心的人形机器人商业机会，称投资水平与短期收入潜力不匹配。（财联社）</p>\n  <p><strong>苹果公司称多项服务出现故障，包括App Store</strong></p>\n  <p>苹果公司系统状态页面显示，包括App Store在内的多项服务出现故障。受影响的其他服务包括Apple Music、Apple TV、Apple Music订阅服务、AppleCare以及Apple School Manager。用户在部分平台上可能遇到服务响应缓慢或无法使用的情况。苹果表示，App Store、Apple Music和Apple TV正在进行例行维护，服务可能暂时不可用。（新浪财经）</p>\n  <p><strong>汇丰据悉即将达成协议，将澳大利亚贷款业务售予黑石</strong></p>\n  <p>据知情人士透露，汇丰控股接近把其在澳大利亚的贷款业务出售给黑石集团，这是集团行政总裁艾桥智领导下精简业务行动的一部分。知情人士说，总部美国的另类资产管理公司黑石在竞购过程中击败其他公司，成为汇丰贷款业务最有可能的买家。汇丰和黑石各自的代表均不予评论。（新浪财经）</p>\n  <p><strong>英伟达、微软、IBM等数十家企业成立新联盟，旨在共同保障AI安全</strong></p>\n  <p>7月27日，英伟达、微软、Adobe、SpacexAI、IBM、SAP、戴尔、思科等企业宣布成立开放安全人工智能联盟，旨在构建和共享开放工具，以促进AI的负责任使用。该联盟成员还包括Cadence、Capital One、Cloudera、Cloudflare、Cognition、CrowdStrike、Databricks、DoorDash、Elastic、慧与、Hugging Face、LangChain、Linux基金会、NAVER、NetApp、Nous Research、OpenClaw、Palantir、Palo Alto Networks、Red Hat、Reflection AI、Salesforce、SK电讯、ServiceNow、西门子、Snowflake、Synopsys、Thinking Machines Lab和TrendAI。（界面新闻）</p>\n  <p><strong>软银为投资OpenAI股权的400亿美元贷款新增21家放款机构</strong></p>\n  <p>知情人士透露，软银集团为投资美国科技巨头OpenAI安排的400亿美元过渡贷款，现已进入大规模分销阶段，新增21家金融机构参与放贷。不愿具名、因事项未公开而匿名受访的知情人士表示，这批新增机构是原有放贷阵容之外的新增投资方，合计分得约70亿美元贷款额度。其中阿布扎比第一银行、新加坡政府投资公司（GIC）、渣打银行各自承贷近10亿美元，剩余额度由多家欧洲、日本及中国台湾地区银行分持。（新浪财经）</p>\n  <p><strong>美国大型企业告别裁员潮重启招聘</strong></p>\n  <p>美国各大巨头企业坦言：��头来或许还是需要扩招人手。过去数月，大型用人单位始终将招聘视作成本高昂的最后备选方案。如今各行各业用工策略集体出现转向。近几日，铁路巨头CSX、谷歌母公司Alphabet等多家企业均向投资者透露，计划通过招聘达成增长目标、抢抓新兴技术发展机遇。这场至少小幅扩充人员编制的扩招动作，彻底扭转了人工智能时代大部分时间里企业的主流论调。此前受经济前景不确定性影响，加之企业普遍认为人工智能可承接大量岗位工作，头部企业基本冻结了人员新增。（新浪财经）</p>\n  <p><strong>英伟达用Vera处理器加速下一代CPU和GPU设计</strong></p>\n  <p>英伟达发文称，随着工程团队致力于开发越来越复杂的CPU、GPU和人工智能系统，现代芯片设计的复杂性也在不断增加。为应对这一挑战，英伟达正部署Vera应用于其下一代CPU和GPU开发的EDA工作流程。（新浪财经）</p>\n  <p><strong>SK海力士上市助推韩国推进美元回流计划</strong></p>\n  <p>SK海力士赴美上市募资创下纪录，韩元受此提振大幅反弹，韩国监管当局因此获得新动力，推动各大出口企业将海外美元资金汇回本土。这家芯片厂商通过本次上市融资265亿美元，市场观测到其持续抛售美元，直接为韩元后续走强奠定基础。在上周召开的工作会议上，韩国财政部副部长许昌呼吁出口商将更大比例海外营收兑换为韩元，并收回长期滞留境外的资金。（新浪财经）</p>\n  <p><strong>消息人士：OpenAI一周后才发现其智能体对外展开黑客攻击</strong></p>\n  <p>据知情人士透露，侵入科技公司Hugging Face的OpenAI智能体（agent）曾连续数日展开黑客攻击行动，而OpenAI直到威胁已被遏制、且联邦调查局（FBI）接到通报后过了相当一段时间，才发现这一情况。该智能体是一种几乎不需要人工监督即可做出决策并执行复杂任务的程序。据两位知情人士透露，该智能体于7月9日前后试图逃离OpenAI内部隔离的测试环境。（新浪财经）</p>\n  <p><strong>三星李在镕与OpenAI奥特曼会面，双方或讨论AI基础设施合作</strong></p>\n  <p>当地时间7月25日，三星电子会长李在镕在美国旧金山会见OpenAI首席执行官山姆·奥特曼。OpenAI未透露双方会谈具体议题，但业内人士认为，双方可能讨论扩大在AI基础设施领域的合作，包括高带宽内存（HBM）、动态随机存取存储器（DRAM）以及先进晶圆代工制造等。（界面新闻）</p>\n  <p><strong>汇丰控股将在新加坡设全球人工智能卓越中心，并招聘超100名AI专家</strong></p>\n  <p>汇丰控股7月27日宣布，将于今年下半年在新加坡设立全球人工智能卓越中心（CoE），旨在开发可扩展至集团全球网络的AI能力，并计划招聘100多名AI专家。声明称，该卓越中心初期将专注于提升客户财富管理体验、引入智能化的财资解决方案以及开发AI赋能的数字支付。（界面新闻）</p>\n  <p><strong>东方证券：拟作价251.2亿元购买上海证券100%股权</strong></p>\n  <p>36氪获悉，东方证券公告，公司拟通过发行A股股份及支付现金方式，收购上海证券100%股权，交易对价251.2亿元。其中，股份对价235.5亿元，现金对价15.7亿元。此次发行股份价格为10.29元/股，合计发行约22.89亿股，占发行后公司总股本的比例为21.22%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>君乐宝港股上市正常推进</strong></p>\n  <p>近日，君乐宝乳业集团股份有限公司（以下简称“君乐宝”）港股上市申请因届满六个月有效期而进入常规程序性更新调整，引发市场关注。7月27日，君乐宝相关负责人表示，这属于港股上市申报中的正常流程安排，目前正有序推进财务加期审计，待完成后将及时更新并重新递交申请资料。在业内看来，这一节点恰好为外界重新审视这家中国乳业头部企业的经营基本面与中长期价值提供了窗口。（证券日报）</p>\n  <h2>大公司财报</h2>\n  <p><strong>老铺黄金：预计上半年净利润同比增长约83%至85%</strong></p>\n  <p>36氪获悉，老铺黄金公告，预计2026年上半年实现收入约人民币198亿元至人民币204.5亿元，同比增长约60%至66%；销售业绩（含税收入）约人民币227亿元至人民币233.5亿元，同比增长约60%至65%；非国际财务报告准则计量经调整净利润约人民币43.1亿元至人民币43.6亿元，同比增长约83%至85%。</p>\n  <p><strong>沃达丰集团第一季度服务收入86.3亿欧元</strong></p>\n  <p>7月27日，沃达丰集团公布第一季度业绩报告。第一季度服务收入86.3亿欧元，市场预期为82.8亿欧元。沃达丰预估2027财年调整后自由现金流预计为26亿至29亿欧元。（界面新闻）</p>\n  <p><strong>神火股份：上半年净利润47.81亿元，同比增长151.06%</strong></p>\n  <p>36氪获悉，神火股份披露半年报，2026年上半年，公司实现营业收入247.91亿元，同比增长21.35%；归属于上市公司股东的净利润47.81亿元，同比增长151.06%；基本每股收益2.16元。</p>\n  <h2>投融资</h2>\n  <p><strong>“词元无限”完成天使++轮融资，累计融资金额达数亿元</strong></p>\n  <p>36氪获悉，近日，企业级AI Agent基础设施专属服务商“词元无限”宣布完成天使++轮融资。本轮融资由临芯投资领投，华控基金跟投，这也是词元无限在一个月内完成的第二笔融资，累计融资额已达数亿元人民币。资金将主要用于加速打造其企业级AI Agent基础设施平台，深化与清华大学、北京航空航天大学等高校的联合研究，并持续构建面向Agent应用范式的下一代基础设施。</p>\n  <p><strong>物理AI公司“正奇未来”8个月完成3轮数亿元天使融资</strong></p>\n  <p>近日，物理AI公司正奇未来宣布，8个月完成3轮数亿元天使系列融资，核心资方为鼎晖VGC投资、线性资本、上汽集团恒旭资本、柏睿资本、正轩投资、周大福投资等。公司定位“技术+产品”双驱动，聚焦Door-to-Door移动任务，其核心品牌QUORRA专注于打造短途出行机器人。目前，品牌首款产品已量产，并在全球十多个国家和地区拿到商业订单，计划年内于海外开展DTC业务，并同步完成天猫、京东旗舰店的开设以及国内多个省市线下门店网点的铺设。</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果眼镜或亮相WWDC27</strong></p>\n  <p>7月26日，科技记者马克·古尔曼称，苹果即将推出的智能眼镜计划最早于明年6月举行的全球开发者大会WWDC27上亮相，并于明年秋季正式发布。代号为N50的苹果智能眼镜原计划于今年晚些时候亮相，并于2027年初正式发售。（新浪财经）</p>\n  <p><strong>腾讯WorkBuddy正式上架鸿蒙电脑应用市场</strong></p>\n  <p>36氪获悉，7月27日，据腾讯云消息，腾讯WorkBuddy正式上架鸿蒙电脑应用市场，成为鸿蒙平台首个桌面办公智能体。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-27T23:36:45+00:00", "fetched_at": "2026-07-28T02:06:06.957986+00:00", "fingerprint": "8b8fc014a3ccc558"}, {"source": "少数派", "title": "角落新声｜不再烧 Hi-Fi 后，我在走步机上给音乐留了一小时", "url": "https://sspai.com/post/112705", "summary": "我的「听音角落」并不完全是一个空间。它是一部旧手机、一枚小尾巴、一副老耳机、一台走步机，以及晚上没有被其他事情占走的那一个小时。<a href=\"https://sspai.com/post/112705\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-27T02:47:56+00:00", "fetched_at": "2026-07-28T02:06:05.437750+00:00", "fingerprint": "069a062e2891cea3"}, {"source": "少数派", "title": "Windows 设计史 05 | 你怀念的 Windows 7，或许最具「人情味」", "url": "https://sspai.com/post/101668", "summary": "好用有时比创新更重要。<a href=\"https://sspai.com/post/101668\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-27T07:00:00+00:00", "fetched_at": "2026-07-28T02:06:05.437745+00:00", "fingerprint": "a126a40c0b4c32f3"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/112785", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/112785\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-27T09:34:04+00:00", "fetched_at": "2026-07-28T02:06:05.437740+00:00 <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
