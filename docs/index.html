ed_at": "2026-09-12T21:41:36+00:00", "fetched_at": "2026-09-13T02:50:13.460654+00:00", "fingerprint": "593440c97619d82b"}, {"source": "36氪 - 最新文章", "title": "主题演讲：中国太空钙钛矿光伏与新一代空间能源系统开拓者｜36氪2026产业未来大会", "url": "https://36kr.com/p/3978950863485960?f=rss", "summary": "<p>2026年，产业投资进入深水区，资本、技术与产业加速融合，旧的投资逻辑不再使用，新的共识正在诞生。2026产业未来大会聚焦新周期机遇，共探产业未来与“中国之光”的诞生。 9月9日至10日，由36氪主办的2026产业未来大会以“深水之上，共振新生”为主题的在北京亦庄举行。来自国资平台、产业投资基金、企业CVC、创新企业及专家学者走到一起，聚焦量子科技等未来产业走向产业化。大会深度探讨当下前沿技术与产业视角，集中展示超导、光量子、离子阱等技术路线突破，分享大量具体产业场景、产业体系搭建、与异构计算前景。共同探讨科技产业投资的未来。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_426a35ec45fe452a94584ec2445d70e8@6301044_oswg825109oswg828oswg552_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>演讲者：烁威光电 联合创始人&amp;CTO 徐帆</strong></p>\n  <p>徐帆：感谢主持人的介绍，也感谢产业未来大会的邀请。我是来自烁威光电的徐帆。今天向大家介绍一下烁威光电在太空钙钛矿光伏领域的发展思路和现状。这个题目也体现了公司的愿景：成为中国太空钙钛矿光伏与新一代空间能源系统领域的开拓者和领军者。</p>\n  <p>我的汇报主要分为三个部分。首先是行业与市场格局。早期，包括马斯克在内的产业参与者已经在太空光伏领域进行了多种尝试；同时，国家“十五五”规划也把商业航天、新能源、新材料等纳入重要战略方向。</p>\n  <p>在相关政策支持下，我们认为从2026年开始，太空光伏迎来了一个重要的发展窗口。随着低轨星座进入密集发射阶段，卫星数量不断增加，单星功率也从早期小功率卫星向未来大功率卫星演变。对于中低轨卫星而言，太阳能仍然是最主要、最成熟的能源获取方式。</p>\n  <p>从市场空间看，相关应用将从通信、导航、遥感卫星，逐步延伸到太空算力卫星，以及更长期的天基能源基础设施。我们判断，随着空间基础设施不断发展，市场规模有望从千亿元级走向十万亿元级甚至更高。再看卫星能源系统的发展趋势，以Starlink卫星为例，太阳翼面积已经从初代的20多平方米增加到目前的数百平方米，这也反映出单星功率需求正在不断提升。</p>\n  <p>右侧是算力卫星的公开示意图。可以看到，太阳翼设计面积达到600平方米，翼展约70米，几乎与波音747客机翼展相当。如果全部采用现有高成本技术，仅太阳翼一项，单星成本就会达到极高水平。</p>\n  <p>因此，未来空间能源技术的发展将持续追求更低成本、更高效率和更高能质比，这也回到我们公司的核心方向：研发新一代钙钛矿太空光伏技术。目前主流太空光伏技术主要有两类。</p>\n  <p>第一类是晶硅，第二类是砷化镓。我国目前采用较多的是第二代砷化镓薄膜电池，但砷化镓的成本仍然是影响其大规模应用的重要因素，单平方米售价可达20万至30万元。面对未来大规模卫星部署和商业航天市场的极速发展，成本高昂的砷化镓电池将面临成本降低的挑战。</p>\n  <p>我们团队选择的钙钛矿光伏属于第三代新型光伏技术，原料储备丰富、成本较低，同时兼容柔性衬底，能够较好满足未来太空应用需求。相比之下，砷化镓受稀有金属材料和高成本等因素制约；第一代晶硅作为过渡方案，在进一步提升效率、降低重量等方面也面临一定挑战。钙钛矿技术与太空应用场景具有较好的适配性，在轻量化方面具有明显潜力，有望实现约80%的减重；同时电池效率也有很高的发展空间；更重要的是，从材料和制造体系来看，其成本具有较大的下降潜力，裸片成本有望达到当前砷化镓的约1/20。我们认为，到2028年左右，钙钛矿有望与砷化镓形成多技术路线并存的格局；从中长期看，随着技术成熟度和可靠性的持续提升，钙钛矿有望成为太空光伏和空间能源领域的重要技术路线之一。</p>\n  <p>第二部分，介绍一下我们公司的情况。</p>\n  <p>我们公司全称为北京烁威光电科技有限公司，研发总部以及太空光伏相关产线都位于亦庄经开区。公司成立于2023年4月，目前是国家高新技术企业、科技型中小企业、创新性中小企业和北京市知识产权试点单位。</p>\n  <p>我们团队在专利、标准和论文方面都有较丰富的积累，目前拥有50余项专利。昨天，我们联合中国星网、上海空间电源研究所等单位，共同发布了行业首个面向太空应用的钙钛矿太阳能电池技术规范标准，同时也获得了十四五国家重点研发计划科技示范产品等荣誉。</p>\n  <p>国内地面光伏企业很多，但太空光伏并不是地面光伏的简单延伸。我们从多个维度把它归纳为五重门槛：无论是光谱条件、光伏电池本身，还是空天环境、评价验证和供应链体系，太空光伏与地面光伏都存在显著差异，因此需要建立一套更加针对空间应用的技术、产品和验证体系。</p>\n  <p>烁威光电团队具有较强的航天原生背景。早在2018年，公司核心成员就开始围绕临近空间开展相关工作；此后从2023年公司成立开始，持续聚焦钙钛矿太空应用场景。2024年至2026年，公司也逐步形成了与两支“国家队”深度合作的格局。</p>\n  <p>我们团队的航天技术积累，从距离地表约35公里的临近空间开始，目前已经面向上千公里以及未来更远的深空场景。2018年8月，团队首席科学家依托北京大学、西北工业大学、中科院空天院，将相关钙钛矿电池搭载在临近空间气球上开展试验；2021年，首席科学家涂用广教授担任美国NASA相关项目评审专家；2023年公司成立后，全面聚焦钙钛矿太空应用，并与航天科技集团上海空间电源研究所持续开展研究合作；2025年，我们联合上海空间电源研究所、西北工业大学、上海交通大学在空间电源全国重点实验室下成立柔性光伏技术联合实验室；2026年6月，深空探测实验室战略入股公司，双方开始进一步深化战略合作，未来将继续围绕深空能源开展探索。</p>\n  <p>目前，我们与两支“国家队”保持深度合作。</p>\n  <p>我们与811所成立了联合实验室，未来将依托811所在轨搭载通道，在军品项目联合申报、后续量产采购和股权合作等方面开展合作。</p>\n  <p>在深空探测实验室方面，我们主要面向深空能源，联合成立了深烁空间电力应用联合创新中心，围绕未来规模化空间星座、地球轨道、地外星体轨道、行星探测等方向开展前沿研究。</p>\n  <p>这也使我们成为国内唯一同时与两大国家级太空能源科研力量开展深度合作的钙钛矿企业。我们不仅关注近期的太空光伏应用，也在积极布局更长期的深空能源。</p>\n  <p>在空天光伏技术体系方面，面对复杂的空天环境，我们围绕单晶化钙钛矿、抗辐照稳定性、太空光谱适配等方向，在宇航级材料、工艺和电池衬底等方面进行了重点布局和研发。</p>\n  <p>在产品布局上，我们采取“刚柔并济”的路线：既有刚性钙钛矿电池，也有可卷绕、薄型化的柔性钙钛矿产品。相关产品已经获得国内外及航天院所的测试检测报告，航天科技集团也出具了公司产品应用场景证明，以及稳定性相关报告，整体测试表现良好。</p>\n  <p>这是我们推出的“御曦”系列产品矩阵，包括三款面向宇航级应用的钙钛矿电池芯片。产品名称取自国学经典，分别命名为“天垣”“垂云”“太素”三个系列。</p>\n  <p>天垣系列主要具备刚性和轻量化优势，面向低成本空间应用，未来适合通导遥卫星的批量替代场景。</p>\n  <p>垂云系列的核心优势是柔性可卷绕，具有较高收纳比，未来适用于大型算力卫星、大型空间站、星座等场景。</p>\n  <p>太素系列是基于钙钛矿技术的叠层电池，效率可达到30%以上，未来能够满足卫星对更小占用面积和更高单位面积功率的需求。</p>\n  <p>基于这三款钙钛矿电池芯片，今年3月我们在深圳商业航天展会上发布了行业首款系统级钙钛矿太阳翼“御曦天垣”系列。该产品主要搭载刚性、轻量化的天垣电池芯片，实现从电池片到太阳翼整板系统的集成。产品3月发布，很快就获得了首笔太阳翼订单。同时，今年我们也将密集开展常态化卫星搭载和临空测试，加速验证产品在真实环境中的性能表现。</p>\n  <p>这也关系到我们的企业定位。刚才提到，太空光伏供应链与地面光伏存在明显差异。商业航天过去市场规模相对有限，因此除传统“国家队”体系外，相关市场化供应链在部分环节仍处于不断完善的过程中。</p>\n  <p>因此，我们也针对供应链进行了一系列布局，包括为航天级钙钛矿材料和部件寻找合适供应商；同时依托811所、深空实验室等国家级研究机构，推进一批面向太空级材料的测试和工艺需求。</p>\n  <p>我们主要通过四个抓手推进合作：依托空间电源全国重点实验室联合实验室开展季度会议，并邀请产业、政府、媒体和投资人参与；牵头军品项目申报；联合深空实验室参与顶层指南编写；以及争取在量产后进入国家队优先采购体系。我们认为，这些布局将有助于进一步提升公司在太空钙钛矿光伏领域的影响力。</p>\n  <p>最后介绍公司的发展愿景。我们认为，太空钙钛矿光伏的整体商业化路径可以分为三个阶段。2026年至2028年处于验证期，技术成熟度尚未达到9至10级，因此这一阶段需要通过持续测试、搭载和迭代，让产品可靠性逐步获得客户认可。</p>\n  <p>2028年以后将逐步进入商业化阶段，主要销售电池片、太阳翼以及电源系统等偏系统级产品；2030年以后，随着大型星座建设推进，公司将在合适情况下向能源服务型企业发展。</p>\n  <p>根据整体规划，早期将面向通信、导航、遥感卫星，以钙钛矿光伏电池片逐步拓展应用；中长期则进一步面向新一代太空能源系统，以及未来空间能源基础设施建设。</p>\n  <p>欢迎感兴趣的投资机构与我们进一步交流和对接。</p>\n  <p>以上是我的全部汇报，感谢大家聆听。谢谢！</p>", "category": "tech", "published_at": "2026-09-12T03:10:14+00:00", "fetched_at": "2026-09-13T02:50:13.298486+00:00", "fingerprint": "403ce58b0a046f4c"}, {"source": "36氪 - 最新文章", "title": "外滩大会：AI新人类，登场", "url": "https://36kr.com/p/3980309439265793?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_5abccdfab33540bfaa5645f4cbeb0c75@19153231_oswg10132977oswg2738oswg3134_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>九月的黄浦江畔，又一年外滩大会如约而至，</p>\n  <p>1场主论坛、40余场见解论坛，600余位嘉宾都聚在外滩大会讨论“共创AI新经济”。</p>\n  <p>这次科技盛会气质不同了，如果只盯着老牌大咖，你可能会错过今年真正的主角——</p>\n  <p>主论坛上，青年科学家与诺奖得主同台，具身智能一线的青年创业者和学者集体亮相；</p>\n  <p><strong>官方更是早早定调：95后创业者与投资人，将成为本届大会的“年轻新势力”；另一边，大会的黑客松AI Coding大赛吸引的上万名参赛者，近七成不满18岁，最小的只有6岁。</strong></p>\n  <p>聚光灯，正在悄悄转向最年轻的一代。这里已是AI新人类的主场。</p>\n  <p>我们一个个看。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_3be094fc62a64da8b5018ba4b9509a96@19153231_oswg58345oswg899oswg876_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_cccbd47c417e4ac799c30e7d7666a92b@19153231_oswg916922oswg1754oswg1291_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>陈博远的履历表上，学术和创始人两个身份始终同时推进。北大元培学院入学后，大一即进组做科研、同年中稿NeurIPS，此后又拿下NeurIPS Oral（全球录取率不足0.5%）和ACL 2025最佳论文（全球仅四篇，另一篇中国团队出自DeepSeek）。另一头，2026年初，尚未毕业的他就和师兄吉嘉铭创立逆矩阵科技（Physis），做通用世界基座模型，成为估值最高的00后AI公司之一。</p>\n  <p><strong>在本科还没读完时，他已经跳过了“毕业、进大厂、再谈理想”的全部中间环节，直奔产业线——这条路径本身，就是AI原生一代的入场方式。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_591727f90c7b423c8a43b2dd407eb2fa@19153231_oswg809410oswg1754oswg1292_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>安歌大概是这份名单里最小的“AI技术原住民”——9岁，拿下外滩大会黑客松一等奖得主。她把一场七天的深山陶艺夏令营，做成了线上作品《泥土实验室：泥土变形记》：没有编程基础，以ChatGPT、Kimi为主、Claude为辅，用口语化沟通的方式两天迭代到7.4版本；作品用原生JavaScript+Canvas写成，零框架零依赖，整座数字博物馆都被浓缩在一条链接里。</p>\n  <p><strong>对她来说，AI不是需要专门学习的新技术，而是从小就在手边的表达方式。这就是AI native人类最写实的模样。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_4d99a87c434449d5bab4befa74ff6a65@19153231_oswg52417oswg899oswg787_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_22b994b52aeb4766aa3b7072078617bd@19153231_oswg603197oswg1080oswg795_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>王梦迪的学术履历，几乎重新定义了“快”。14岁从北京八中少年班考入清华，24岁拿下MIT博士学位，29岁成为普林斯顿当年最年轻的终身教授，2024年摘得控制领域最高荣誉之一Donald P. Eckman奖——这个奖项每年全球仅授予一人。如今她执掌普林斯顿AI加速创新中心，研究重心转向“让科学可验证”的基础设施，她把原本需要数月的石墨烯实验流程自动化、封装成API供全球科研机构调用，还在探索面向实验室的智能操作系统LabOS。</p>\n  <p><strong>这位不靠熬年限站上学术塔尖的青年人才，将继续探索AI如何成为加速全人类科学发现的底层引擎。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_0221c7edc5f14ad785dd54fc5228bc92@19153231_oswg408192oswg1080oswg733_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>杨灵是典型的“成果先行”型学者，他曾在普林斯顿大学ECE/Princeton AI Lab博士后研究员，现已回国入职北大国际机器学习研究中心，助理教授、研究员、博导一步到位。在北大期间，他创立了Discovery Intelligence Group与Gen-Verse开源社区，项目累计千万级使用量，70余篇论文发表于NeurIPS、ICML、ICLR等顶会，多篇拿下Oral（Top 1%）、Spotlight（Top 3%）与Best Paper Award。</p>\n  <p><strong>未来，学者的价值不再需要论资排辈，纯看学术成果的输出。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_e60c759e8e244d3fadc966292d193ccf@19153231_oswg57819oswg899oswg863_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_1a7e2bf17c0f4c509b3774170452f155@19153231_oswg1088494oswg1754oswg1285_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>沈宇军是带着硬核的学术履历走向产业一线的人。清华电子系出身、博士毕业于香港中文大学，师从汤晓鸥教授，在CVPR、ICCV、NeurIPS等顶会顶刊发表论文百余篇，Google Scholar引用逾万次。2024年起，他出任蚂蚁灵波首席科学家，今年带队一口气开源多款具身智能模型、发布全栈大脑2.0，引领“具身原生”新范式。</p>\n  <p><strong>在学界与产业之间，他把论文编码进了机器人的“大脑”里——学术最硬的人，正在离产线最近的地方。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_4c050b193ee947e589c8310b065ddb90@19153231_oswg1280638oswg1754oswg1369_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>许华哲身上有一种罕见的反转——在明星独角兽的巅峰时刻选择离开，自己下场造一家新公司。他是“伯克利归国四子”之一，清华叉院助理教授、博导，顶刊顶会论文五十余篇，拿过机器人顶会CoRL'23最佳系统论文奖。2026年2月，他离开星海图创立破壳机器人，四个月即完成近亿美元Pre-A轮融资。</p>\n  <p><strong>他不把人形机器人送进工厂拧螺丝，而是直奔最难的C端家庭通用机器人。混乱的家庭空间才是通用智能最好的训练场，产业这一棒，他要自己跑。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_63cece6be3ca483194fc1009f0ea702c@19153231_oswg48506oswg899oswg786_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_af8b58137e7a4a54ae0a13c53238b6de@19153231_oswg946792oswg1754oswg1353_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>吴迪的商业嗅觉，是在公司最难的时候被验证的。2023年，公司账上现金流紧张时，他带队不跟随当时主流的“2D升3D”捷径，死磕“原生3D”路线——2024年发布的原生3D大模型框架CLAY拿下国际图形学顶会SIGGRAPH最佳论文提名，并基于此发布了全球首个原生3D大模型产品Hyper3D Rodin，直接引领了全行业的主流技术转向。如今公司B端客户数与收入已超过行业其他公司总和，海外收入占比80%，2026年CES上黄仁勋的主题演讲就采用了其技术。</p>\n  <p><strong>他坚持科研从第一天起就必须“Production-Ready”，把60%-70%的收入继续投入研发——对这代创业者来说，商业化不是终点，而是从始而终的路线。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_a9e0f15ef60a482b837cea8ed9fc4389@19153231_oswg45959oswg899oswg785_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_fe06305519d546e485aebc060b71b535@19153231_oswg1020331oswg1754oswg1291_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>中科大计算机背景的孙东来自称“全干工程师”，一个人包揽产品全栈。他的创业习惯是先验证再动手：写Dreamoo第一行代码前，他先发了一条梦境记录调研帖，零投放炸出二三十万浏览，产品上线一个月即获4000多用户并拿到融资。Dreamoo被收购后，他又从软件跨入硬件创立默造MuteVox——从自己在公共场合不方便开口与AI交流的痛点出发，做出一款可穿戴消音面罩。产品从黑客松原型到上线京东众筹只用了一个月，首月获千余人支持，默造目前已完成Pre-Seed和Seed两轮百万元级融资。此外，他还是“徽客松”发起人、奇绩F25孵化项目成员，获评“小红书最佳00后开发者”。</p>\n  <p><strong>一个人，从写代码、做应用，到跑工厂、打磨硬件，他将“全干工程师”的能力延伸到了新的创业领域。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_8d486150a3434628a86091377a521996@19153231_oswg640956oswg1754oswg1291_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>山音的工作室只有一个人，却能完成过去一整个剧组的事。上戏戏文本科、港岭南艺术科技与商业硕士毕业，进入AI影像领域后，他开始尝试把过去需要多个影视工种协作完成的工作，压缩进更小的创作单元中。他的作品《积木》获得2025 Inspiring Asia最佳AI影片，并入围FIRST惊喜影展；《狗事》获得新片场AI大赛金奖、VACAT瓦卡奖银奖及AI Internal Film Festival最佳实验电影；《阿明的一天》入围大众电影百花奖AIGC推优单元。</p>\n  <p><strong>相比传统影视团队固定的工种分配，山之音工作室更接近于一个小型创作核心，AI对山音最大的改变，是把过去分散在许多工种之间的创作控制权，重新交回了一部分给创作者本人。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_1d1e9ca96b2e4821ada2ce0933da6bbc@19153231_oswg52190oswg899oswg785_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_bfb00f103f4a426bb31220f78041ccf8@19153231_oswg781478oswg1754oswg1229_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>小狮日记大概是程序员里最会打鼓的、鼓手里最懂IT的。做过IT工程师的他，如今转型为粉丝数百万的科技创意博主。他曾在家里复刻哈利波特的魔杖，随手一指就能随便开关家电，他还做过一朵会自己上班的宠物“电子云”，做过模拟汽车颠簸的“总裁哄睡床”，他总能把有趣的生活灵感变成实体，用一种带有诗意的眼光，发挥AI技术的优势。</p>\n  <p><strong>他的产品展现了技术可以如何抚慰人心，像他这样的跨界创作者，为AI领域带来了更多人文关怀的色彩。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_3e8d59e9430a4678b819f57760e9edd4@19153231_oswg296oswg459oswg45_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>你可能已经意识到，外滩大会的面貌和许多人想象中不太一样了。</p>\n  <p>今年大会的主题追问，从“AI能做什么”变成了“AI如何创造新的增长”。</p>\n  <p><strong>当AI从生成走向执行，这届年轻人的务实恰好踩在了行业的转向点上。</strong></p>\n  <p>技术周期的闸门一旦打开，就不会只开一条缝。</p>\n  <p>今天他们站上了论坛和赛场，明天或许就能改写产业与规则本身。</p>\n  <p>大幕刚刚拉开，可以期待，AI新人类们会带来更多惊喜时刻。</p>\n  <p>&nbsp;</p>\n  <ul>\n   <li>策划：许嘉婧</li>\n   <li>视觉：曲枚</li>\n  </ul>", "category": "tech", "published_at": "2026-09-12T11:26:17+00:00", "fetched_at": "2026-09-13T02:50:13.298476+00:00", "fingerprint": "39f74a543bdd3a4b"}, {"source": "36氪 - 最新文章", "title": "获达晨财智、元禾璞华数千万投资，这家物理AI企业自研WMM世界机理模型丨36氪首发", "url": "https://36kr.com/p/3981147673345033?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260913/v2_99b5bd833209489584c4f485bed69339@6221844_oswg276717oswg1269oswg772_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2900</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，元始智能科技（南通）有限公司（简称“元始智能”）已完成数千万元Pre-A轮与Pre-A+轮融资，分别由达晨财智与元禾璞华投资。资金将主要用于产品研发团队扩建与标准化产品矩阵的打造。</p>\n  <p>这家成立于2022年7月的公司，是一家面向工业场景的物理AI公司，长期目标是让AI理解物理世界的状态与规律，并在真实环境中稳定行动。落到当前的产品上，就是以自研WMM（World Mechanism Model）世界机理模型为核心的软硬一体解决方案：在成熟的存量工业装备上叠加边缘端智能处理器与工艺包，让设备从“自动化”走向“自主化”。</p>\n  <p>元始智能由CEO金骏阳博士和CTO董云龙博士带领，核心成员具有剑桥大学、清华大学、华中科技大学等高校背景，以及华为等科技企业的产业经验。公司的核心技术主要基于华中科技大学袁烨教授团队近十八年来在系统辨识、复杂动力学与机理建模领域的研究积累。早期，这些研究主要在CPS系统建模与控制框架下展开，如今为公司的物理AI工作提供方法基础。在公司的产品体系里，这套积累正被转化为可工程交付的机理模型、工具链与工艺包。</p>\n  <p>公司成立后，技术层面延续物理AI方向，应用层面则明确聚焦工业落地。</p>\n  <p>这一选择基于两个判断：一是机床、机械臂和专用设备等工业装备已运行多年，硬件系统成熟、控制边界清晰，工艺目标也可检验；二是公司团队在高校阶段就已围绕航空航天、船舶轨交等场景完成大量技术验证，并承担多项国家级重大专项，具备把机理建模能力沉淀为工业产品的产业基础。</p>\n  <p>“物理AI是人工智能下一步的创新浪潮，”元始智能判断，“以前AI主要处理数据，做单向信息流转、采集、分析、展示。现在产业界希望AI真正介入物理世界，和装备做动态交互。”</p>\n  <p>要实现这个跃迁，元始智能认为AI需要理解当前状态、预见动作后果，并在物理约束下可靠行动。这也是公司产品架构的设计主线——模型、工具链与边缘硬件围绕同一套物理约束协同工作。</p>\n  <p>硬氪了解到，元始智能的核心技术是自研的WMM（World Mechanism Model）世界机理模型，它同时是公司全栈产品包的技术底座。其核心思路是在模型学习中引入动力学结构和物理约束，让数据用于辨识规律，减少对全工况数据覆盖的依赖。</p>\n  <p>这也体现了元始智能对技术路线的理解：“WMM仍然使用数据，只是不把全部知识都交给数据去记忆。模型要学到的，不只是如何完成一次任务，还有动作如何改变物理世界。”公司希望，通过机理约束与数据学习的结合，提升模型在工况变化时的可控性与可解释性。</p>\n  <p>而WMM的两个技术重点均针对工业落地痛点：</p>\n  <p>其一，提高连续过程的稳定性。通过Koopman隐空间动力学约束，模型不仅预测“下一步动作”，也学习系统随时间的演化，目标是降低多步预测与控制中的误差累积。</p>\n  <p>其二，探索跨任务的规律复用。团队尝试将Grasp（抓取）、Twist（旋拧）、Insert（插入）等基础操作沉淀为可复用的物理模块，再根据新任务进行组合与适配。这一路线希望减少每个任务都从头学习的成本，实际复用程度仍需在具体设备和工况中检验。</p>\n  <p>目前，元始智能的产品形态是软硬一体化解决方案，目标是为存量装备逐步增加感知、判断和自主调整能力：硬件层面是PRIMACT R100实时物理智能平台，承载核心模型算法与工业交互接口，支持本地部署、本地推理；软件层面包含工具链和工艺包——工具链用于开发和适配工业AI模型，工艺包则针对具体设备和工艺场景，将物理规律与控制逻辑沉淀为可复用的行业模块。</p>\n  <p>“我们不是纯软件公司，”元始智能强调，“在工业里，要交互的对象是物理装备，光有软件形态不够，必须通过硬件接口去控制设备。这是公司坚持软硬一体产品路线的原因。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260913/v2_1f11ea2267bf48f088c2535cc193810b@6221844_oswg303849oswg1080oswg578_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">PRIMACT R100实时物理智能平台（图源/企业）</p>\n  <p>基于这套软硬一体的产品，公司希望在尽量保留原有控制系统和生产流程的前提下，对存量工业设备做智能化升级。工业客户把可靠性放在第一位，这意味着产品不仅要能够接入，还必须在时延、扰动和长期运行等约束下证明自身价值。</p>\n  <p>据公司介绍，目前元始智能已与中航工业、中核集团、中船重工、中国中车、中天科技等十余家行业客户开展合作与验证，提供数字建模与预测性维护、精密控制等多种智能化解决方案。</p>\n  <p><strong>以下为硬氪与元始智能的访谈内容节选（经编辑）：</strong></p>\n  <p><strong>硬氪：为什么选择从工业具身智能场景切入来做？</strong></p>\n  <p><strong>元始智能：</strong>我们关注的长期问题，是让机器理解真实世界，并在其中稳定行动。但通用能力需要在具体场景中逐步建立。元始智能选择先做能交付、能验收的场景，而不是一开始就追求一个模型适用所有设备。</p>\n  <p>工业不一样。工业装备已经成熟了，加工机床、机械臂、专用设备都是用了很多年的东西，工艺目标和控制边界也比较清晰。我们的产品就是给它们增加感知、判断和自主调整能力，让装备从“自动化”逐步走向“自主化”。先解决一个工艺问题，跑稳一台设备，再把经过验证的规律复用到下一台设备，这是我们选择的路径。</p>\n  <p><strong>硬氪：与其他物理AI公司相比，最大的差异在哪里？</strong></p>\n  <p><strong>元始智能：</strong>技术路线上，我们更强调在模型学习中引入动力学结构和物理约束。工业数据往往有限，试错成本又很高，不能依赖穷尽所有工况来训练模型。我们的思路是让有限数据用于辨识规律，并在工况变化时检验这些规律能否继续成立，这是核心差异。</p>\n  <p>从商业化角度看，我们关注的不只是单次任务能否完成，还包括设备在扰动下能否保持稳定、换一种工况后需要多少重新调试，以及工程师能否理解系统的判断。团队与行业客户开展的合作与验证，就是在这些具体问题上检验技术，而不只是展示一次演示效果。</p>\n  <p><strong>硬氪：接下来产品迭代的重点方向是什么？</strong></p>\n  <p><strong>元始智能：</strong>核心是做端侧轻量化和推理效率提升，让更复杂的模型在有限算力和严格时延约束下稳定运行。</p>\n  <p>为什么要做端侧？部分工业场景的数据不能出工厂，有些场景还存在联网限制，所以模型必须能本地部署、本地推理。这是物理AI在这些场景落地的硬约束。</p>\n  <p>我们还会继续把“工具链+工艺包”体系做深，让同一行业内的适配成本持续降低。原始工业数据可以留在客户现场，团队需要沉淀的是可迁移的动力学结构、算法模块与部署方法。每一台新设备接入，已验证的知识能复用多少、适配时间能缩短多少，是衡量产品化水平更直接的尺度。</p>\n  <p>更长远看，我们并不把自己限定在某一种工业设备上。机床、机械臂和移动操作机器人形态不同，却都要处理同一组问题：感知当前状态，理解系统如何演化，预见动作后果，并在约束中可靠行动。今天的边缘处理器、工具链和工艺包，是这些能力的产品载体；WMM则指向能够跨设备、跨任务复用的基础能力。</p>\n  <p>从大处着眼、从小处着手，这和“农村包围城市”的思路相通：先让一个工艺跑稳，再让能力在一类设备上复制，最后把规律沉淀为平台。我们希望，WMM能沿着这条路径，由局部的确定性逐步走向更广泛的通用性，成为能够理解并作用于物理世界的通用人工智能（AGI）的一项基础能力。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p>Pre-A+轮投资方元禾璞华表示：“AI的下一站是真正介入并控制物理世界。元始智能是我们在这一方向上看到的稀缺标的：团队把在动力学与机理建模领域的多年积累，沉淀为了标准产品，并用军工级的可靠性要求验证了产品力。元始通过为AI注入物理规律，让模型在数据稀缺、可靠性至上的工业场景中也能稳定、可迁移地工作，这件事情拥有巨大的产业价值。”</p>", "category": "tech", "published_at": "2026-09-13T01:13:10+00:00", "fetched_at": "2026-09-13T02:50:13.298460+00:00", "fingerprint": "c6c80dedf4a05aca"}, {"source": "少数派", "title": "与 AI 搏斗失败后重新开始找工作：经验分享与半可靠避雷指南", "url": "https://sspai.com/post/114461", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/114461\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-12T07:00:00+00:00", "fetched_at": "2026-09-13T02:50:11.725168+00:00", "fingerprint": "6ad7062b57c53c73"}, {"source": "The Guardian - World", "title": "$15m fund launched to create ‘unstoppable momentum’ to end FGM worldwide", "url": "https://www.theguardian.com/global-development/2026/sep/11/15m-fund-launched-to-create-unstoppable-momentum-to-end-fgm-worldwide", "summary": "<p>Her Horizon Fund seeks $100m to stop practice harming 230m women and girls globally  </p><p>Frontline activists and leaders in the fight against female genital mutilation, which has affected more than <a href=\"https://data.unicef.org/topic/child-protection/female-genital-mutilation/\">230 million women and girls worldwide</a>, have welcomed an unprecedented $15.5m (£11.4m) fund aimed at creating “unstoppable momentum” to finally end the practice.</p><p>The launch of the fund comes as <a href=\"https://equalitynow.org/resource/reports/global-backlash-against-womens-and-girls-rights-words-and-deeds-update-2025/\">women’s rights are increasingly under attack</a> and donor funding is in sharp decline, particularly for work led by FGM survivors in local communities. It is thought to be the largest single philanthropic contribution to ending the practice of FGM.</p> <a href=\"https://www.theguardian.com/global-development/2026/sep/11/15m-fund-launched-to-create-unstoppable-momentum-to-end-fgm-worldwide\">Continue reading...</a>", "category": "politics", "published_at": "2026-09-11T04:00:04+00:00", "fetched_at": "2026-09-12T02:51:52.165660+00:00", "fingerprint": "c5b3938ea60451e9"}, {"source": "BBC World News", "title": "Arrest made over the death of black woman found hanged from tree in Mississippi", "url": "https://www.bbc.co.uk/news/articles/cqjkejq5750o?at_medium=RSS&at_campaign=rss", "summary": "Tasia Fortune's body was found  in the lot of an abandoned home in Mississippi in August.", "category": "politics", "published_at": "2026-09-12T02:29:49+00:00", "fetched_at": "2026-09-12T02:51:51.891658+00:00", "fingerprint": "6b0c0920807809bb"}, {"source": "BBC World News", "title": "Passenger train derails in France leaving at least 44 injured", "url": "https://www.bbc.co.uk/news/articles/c8d37dm8d8mo?at_medium=RSS&at_campaign=rss", "summary": "France's transport minister says 180 passengers were on board the train operating the Rouen-Caen route in Normandy.", "category": "politics", "published_at": "2026-09-11T21:25:32+00:00", "fetched_at": "2026-09-12T02:51:51.891652+00:00", "fingerprint": "7f16c3464a2172ba"}, {"source": "BBC World News", "title": "Tragic death of woman who testified against father in notorious mafia murder of mother", "url": "https://www.bbc.co.uk/news/articles/c39mr81j2j1 essage seen by TechCrunch. WordPress Executive Director Mary Hubbard confirmed Mullenweg's return to the CEO role in a Friday post on X, which the official WordPress account shared and [&#8230;]", "category": "tech", "published_at": "2026-09-11T17:16:59+00:00", "fetched_at": "2026-09-12T02:51:51.329021+00:00", "fingerprint": "ea9404204aef2f49"}, {"source": "The Verge", "title": "Lawyer fined $5K over AI-hallucinated witnesses in a murder case", "url": "https://www.theverge.com/ai-artificial-intelligence/994207/chatgpt-new-mexico-lawyer-fined-murder-appeal", "summary": "New Mexico's Supreme Court is punishing a lawyer for including AI-fabricated witnesses and fake police testimony in an appeal for his client's murder conviction, according to a report from Reuters. In a filing on Wednesday, the court fined Stephen Aarons $5,000 and held him in contempt for failing to \"verify the factual claims and legal [&#8230;]", "category": "tech", "published_at": "2026-09-11T20:44:02+00:00", "fetched_at": "2026-09-12T02:51:51.329012+00:00", "fingerprint": "136a4de1f8b5907b"}, {"source": "36氪 - 最新文章", "title": "不评判好坏，只鼓励创作：这款AI原生游戏，让人人都享受讲故事", "url": "https://36kr.com/p/3978711556684805?f=rss", "summary": "<p class=\"image-wrapper\"><span style=\"letter-spacing: 0px;\">文丨寒刃&nbsp;二几</span></p>\n  <p>到了2026年，AI叙事游戏仍然要面对一个灵魂拷问：在完全自由的文本创作中，玩家到底该怎么知道自己要讲什么？</p>\n  <p>6年前，在《千夜之书1001》还只有基于GPT-2的雏形demo时，制作人起司就在尝试回应这个问题。如今，经过数年的开发和迭代，《千夜之书1001》终于为玩家搭起了一套“脚手架”，帮助玩家享受讲故事的乐趣。</p>\n  <p>《千夜之书1001》是国内最早一批试水AI原生叙事玩法的项目。故事背景脱胎于经典文本《一千零一夜》，玩家扮演的山鲁佐德，在与妹妹的故事接龙中意外解锁将文字故事中的武器化作实体的能力。玩家需要持续为AI国王讲述故事，从而制造武器，最终杀死残暴的国王。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_adb6866985944f91ae9d8e15284eec56@6427981_oswg762404oswg1080oswg505_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏steam商店页面</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_588af19cccf145c295e499cfccde8cdc@6427981_oswg627334oswg1080oswg611_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">最终决斗画面</p>\n  <p>对于一款把“AI对话”本身变成玩法的游戏来说，“让玩家开口”只是第一步。玩家讲什么，AI如何理解，游戏如何回应玩家的创作，都是《千夜之书1001》接下来需要回答的问题。</p>\n  <h3><strong>人人都能从讲故事中获得快乐</strong></h3>\n  <p>《千夜之书1001》的早期DEMO称作《1001夜》，体验非常简洁：</p>\n  <p>玩家唯一需要做的事情就是给AI国王讲故事，在故事中<strong>自然</strong>讲出含有武器的内容，并最终用这些武器击败国王。在这个过程中，AI国王会基于自己的人设背景对故事做出反馈和引导，意图过于明显的故事可能惹怒国王，直接触发处决结局。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_6bbcc89af9c340018c28305f52a629ee@6427981_oswg1760460oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏早期画面</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_b9259927c8bc45a98be91fe04a63bd11@6427981_oswg335674oswg1080oswg610_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">处决结局</p>\n  <p>对于本就擅长讲故事的玩家来说，游戏的乐趣显而易见：与AI国王斗智斗勇的同时，创作本身就是快乐的。讲出精彩或离谱的故事，也颇具成就感。</p>\n  <p>但如何让不擅长讲故事，或疲于创作的玩家，也能享受讲故事的乐趣？起司表示，要给玩家搭好“脚手架”。</p>\n  <p>首先，游戏需要让玩家知道怎么开始讲故事。早期DEMO只有一句话的提示，如今游戏加入了“灵感卡”系统，可以把进入寝殿前的经历直接当做故事的开头。另外多周目游玩的玩家，还可以选择“故事书”续写上一局没写完的故事。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_5d99b816f5c84c15a3a2094ddb9d8feb@6427981_oswg120543oswg835oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">灵感卡与故事书界面</p>\n  <p>游戏还加入一项“辅助名字”功能。起因是起司发现，如果玩家把自己认识的人或者熟悉的角色写进故事里，往往会有更好的节目效果，于是干脆顺着这个行为设计功能。在北京Dice Con展会现场，有多位玩家以“牛来”为主角创作，引得众人围观，视频在小红书获得近400点赞。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_222158d9c4a745cb805cc17a2d05af42@6427981_oswg3069073oswg4096oswg3430_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">展会现场视频</p>\n  <p>有了顺畅的开头，游戏还需要让玩家知道自己的讲述正在产生什么影响。早期版本中，国王的情绪状态是半隐藏的，玩家往往要等到国王生气，才意识到自己的行为已经改变了他的状态。后续团队发现，游戏可以不给故事的文本打分，而给讲故事中的操作加分，比如激怒国王或哄国王开心，一句话里触发了多个道具等。这样明确的反馈可以帮助玩家理解游戏正在发生什么，从而更明确自己下一步行动。</p>\n  <p>起司表示，这一设计的目标并不是鼓励“好故事”，而是对所有“讲故事”的行为做出鼓励。种种设计都是让玩家觉得，<strong>讲故事本身是一件有趣、值得投入，而且能够得到回报的事情。</strong></p>\n  <p>所以《千夜之书1001》也对于玩家的各种“骚操作”非常包容。比如把“刃”这样的字眼写进“辅助名字”里，就可以轻易让国王再次提到这个名字，并触发武器。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_d16395f9d3f142bc906403b93748c825@6427981_oswg1475350oswg1021oswg1008_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国王的故事中出现了寒刃的名字</p>\n  <p>在起司看来，这些行为并不一定需要被当成Bug修复。只要玩家能够想到一种方式，利用系统让故事产生意料之外的结果，这本身就是一种游戏行为，也是游戏乐趣的一部分。</p>\n  <h3><strong>从“讲故事”到“玩故事”</strong></h3>\n  <p>最早的《千夜之书1001》是起司在博士期间的研究项目，还发了论文。但随着项目越来越大，想承载的东西越来越多，它也逐渐从一个实验性Demo变成了一款完整的游戏。这意味着游戏需要有完整的剧情与世界观，让碎片化的即兴创作，落地为有温度、有记忆点、可长线沉淀的游戏内容。</p>\n  <p>起司认为，自己在开发过程中犯过最大的错误，就是低估了剧情的难度。单纯复刻《一千零一夜》的故事是远远不够的，起司希望女主成为一个“真实存在过的人”，有自己的生命历程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_8e7c2a8cbd1c4bb8bbc09621409384b3@6427981_oswg305115oswg1080oswg564_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">山鲁佐德的童年故事</p>\n  <p>在创作期间的大量废案让起司真切体会到，为什么业内都说“游戏的第二关最难做”。团队最初为女主刺杀国王的行为设计的动因，是妹妹遭遇意外，但这样的设定，会让妹妹没有主体性。经过与编剧的反复磨合，团队最终引入咒印的核心设定，让女主的抗争与救赎更有支撑，整体故事逻辑也更加严密自洽。</p>\n  <p>补全世界观和人物背景后，起司认为，如今的《千夜之书1001》，很像一个叙事游戏。后续剧情还会出现园丁、医生、将军等形形色色的角色；女孩们手腕的咒印设定、山鲁佐德踏上救赎之路的初衷，所有伏笔与留白，都会在剧情中逐一揭晓。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_be35de553efa4405ab340c1e78a4009a@6427981_oswg63019oswg1080oswg769_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">在故事中，女孩们的手上会浮现出咒印。当咒印变红，她们就会成为国王的“新娘”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_fa430695b856408aaec84746a9ad3b95@6427981_oswg303437oswg1080oswg544_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">山鲁佐德与想要成为将军的童年好友</p>\n  <h3><strong>团队是从游戏里生长出来的</strong></h3>\n  <p>《千夜之书1001》的另一个特别之处是，作为一款AI原生游戏，它是随着AI的发展一步步成型的，见证了这个快速迭代的AI时代。</p>\n  <p>最初的Demo可以追溯到6年前起司大学时期做的一次课题，当时GPT-2刚刚流行。《千夜之书1001》的开发团队正式组建并运作起来，其实只有一年多。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_6e090b02bae542ebb146b9b605132041@6427981_oswg264786oswg1080oswg512_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">团队简介</p>\n  <p>从学术项目到上线Steam，《千夜之书1001》的商业化没有一个清晰的“转折时刻”。起司认为，这更像是一种渐进式的生长。随着大模型逐渐成熟，行业开始出现新的生态，团队自身也不断成长，而这个Demo本身又逐渐证明了自己“值得被继续做下去”。</p>\n  <p>由于没有同类参考作品，项目自始至终没有固定的发展方向，甚至难以界定游戏的类型。团队依靠玩家反馈，一点点调整优化内容。早期，Demo还在作为学术项目研发，团队曾经研究过实时场景生成等功能，来让玩家获得更强的沉浸感和反馈。但后来发现效果并不好，玩家接受度也不高，于是直接砍掉。起司认为，这类决策更多是在不断与玩家碰撞之后做出的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_58efea4ecddc4685a21d24071e498922@6427981_oswg478029oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">被砍掉的实时场景生成功能</p>\n  <p>同样，这款游戏的制作团队，也不同于多数独立游戏工作室。起司形容团队是“随着游戏的完善慢慢生长出来的”，而不是走立项、拉投资、研发、发行的路子。</p>\n  <p>AI技术的发展，也改变了团队的工作流。现在团队的非技术人员，也可以通过vibe coding制作玩法demo，甚至直接完成一些小型功能的研发。队内也形成了“show me the demo”的工作方式，策划提出新需求时，会先做出demo给到程序，简化沟通和开发流程。</p>\n  <p>这也正是本作最特别的地方：游戏、团队、技术三者同步成长，构成了《千夜之书1001》项目的核心底色。AI原生游戏本就是个没有成熟参考、固定方向的全新赛道，项目更新、团队建设、技术迭代同步进行，彼此相互影响、共同成型。</p>\n  <p>聊起对AI行业的看法，起司表示，如果不是技术乐观者，大概也不会愿意深耕AI原生娱乐。她认为未来token成本会持续降低，AI技术也会持续进步，整条赛道还有很大的发展空间。在起司看来，当下各类AI原生游戏之间，比起竞争，更像是互相陪伴、共同成长。</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s/HR1zVXj12SpKt-BkX9II-g\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-09-11T08:50:08+00:00", "fetched_at": "2026-09-12T02:51:51.207911+00:00", "fingerprint": "edb77ef98284ed18"}, {"source": "36氪 - 最新文章", "title": "硬氪专访丨对话iRobot：扫地机行业到了纠偏时刻", "url": "https://36kr.com/p/3978780178627332?f=rss", "summary": "<p>时隔多年，iRobot再次站上了国际消费电子展的舞台。</p>\n  <p>9月初，柏林IFA展会上，iRobot发布了新旗舰Roomba875，并把大量展区留给了一台尚未命名的子母双机概念机。这次重返国际顶级展会。官方将其定义为“把品牌重新带回世界舞台”的信号：“这个品牌带着更好的产品、更好的姿态回来了。”</p>\n  <p>这轮回归带着明确的自我修正意味。过去几年，iRobot留给外界的印象并不算好：手握3000多项专利却长期不落地，一个平台沿用多年不迭代，被贴上“保守”的标签。而在受访负责人看来，行业同样到了一个需要纠偏的节点——扫地机器人全球平均渗透率只有10%出头，行业却在不断卷单一参数，把消费者越带越远。</p>\n  <p>一些数据已经在验证纠偏的价值。iRobot日本市场市占率从年初的约40%，到上个月已经回到72%。本次IFA展会上，单一欧洲国家的经销商已经为iRobot产品准备了5000万欧元的投入预算。</p>\n  <p>硬氪在IFA现场与iRobot联席CEO李昊聊了近一个小时，从发展战略、产品理念、业务策略，到中国消费者变化、渠道竞争与团队配合，聊聊一个老品牌在新时代的新思考。以下是经过编辑整理的对话实录。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_24402b387d4545a0944251ea841a3bf0@5925182_oswg912722oswg1080oswg720_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h2><strong>回归国际展会</strong></h2>\n  <p><strong>硬氪：这次参加IFA，对iRobot来说有什么战略意义？想通过这场展会传递什么信号？</strong></p>\n  <p><strong>李昊：</strong>这个展会对我们来说有两个主要意义。一个是发布产品本身，昨天刚上市的新旗舰875，以及首次亮相的概念机；另一个是，这个品牌蛮久没有出现在各类国际展会上了，所以参展本身也是一个把品牌重新带回世界舞台的信号——告诉大家，我们回来了，这个品牌现在带着更好的产品、更好的姿态回来了。</p>\n  <p>产品理念上，无论是旗舰875还是概念产品，核心想讲的就一句话：不要去卷参数，回到产品本身。对消费者来说，无论功能说得多么花哨，到最后其实就是两个点：清洁力怎么样？在好的清洁力之下，覆盖率够不够？我们想把清洁能力和覆盖能力真正提升上去，给消费者一个回归产品本身的体验。</p>\n  <p><strong>硬氪：以全新的姿态回来面对消费者，想给他们讲一个什么样的故事？</strong></p>\n  <p><strong>李昊：</strong>我想讲的不一样，是建立在一个不变的愿景之上的。iRobot的愿景我一开始就非常认同：让机器人去做人类不该做、不想做的事，把人解放出来，把时间真正还给消费者，让他们去做自己认为真正重要的事情。</p>\n  <p>要变的是什么呢？十几年前，iRobot完成了这个行业第一次大变革——从“没有家庭机器人”到让大众认知家庭机器人。现在我想做的是第二个变革：现在有家庭机器人了，但消费者对它们并不完全满意，渗透率也没上去。我要做的是让家庭机器人变成像大家电一样、真正根植到用户心中的产品。</p>\n  <p>这就是为什么我反复强调要抛去噱头、回到体验。你看洗衣机、电视，消费者买的时候已经很清楚自己要什么了，扫地机还没有——行业去卷吸力，标30KPa、40KPa、50KPa，会误导消费者以为那就是清洁力。其实行业内的人都知道不是。消费者现在缺的，就是一个“什么代表清洁力”的认知，我们希望把这个认知带回来。</p>\n  <h2><strong>不靠单一参数，靠系统式的组合</strong></h2>\n  <p><strong>硬氪：以新的品牌形象登陆欧洲市场，我们跟别家真正的差异化在哪？核心竞争力体现在什么方面？</strong></p>\n  <p><strong>李昊：</strong>回到消费者能理解的两个点：一是更强的清洁力，这是产品存在的核心价值；二是覆盖率——清洁力再强，到不了某些地方，就等于没清洁。</p>\n  <p>尤其对中国的消费者，他们买扫地机的客单价是偏高的，说明大家愿意为这件事买单，那我们更不能让消费者失望。如果消费者买回去发现扫地机是一个并不值得买的东西，他们就不再愿意买，渗透率就永远上不去。</p>\n  <p><strong>硬氪：聊聊875吧，作为这次带来的旗舰产品，它想传递什么？</strong></p>\n  <p><strong>李昊：</strong>875就是基于我刚才说的那套理念开发的。旗舰该有的智能性能、运动性能都有，我不赘述，核心讲对消费者最有价值的点。</p>\n  <p>第一，干清洁。大吸力不是完全没用，但它是流量和吸力之间的一个平衡。我们不去管参数标多少，而是找最好的流量和吸力平衡点，让扫地机在地毯上有最好的清洁能力。找到平衡之后还有个问题——流量会散失，因为扫地机不会完全贴死在地面。怎么减少流量损失？靠整个主动密封装置的设计。875的密封系统能大幅减少流量损失，地毯除尘率基本对标头部吸尘器品牌，而不是跟扫地机比。</p>\n  <p>这个点以前大家觉得只对欧美重要，现在要加上中国了——中国现在的装修趋势是意式，而意式装修里很重要的一个元素就是客厅的大地毯。中国消费者对地毯本来就认知偏弱，很多人纠结“要不要买地毯”卡在“怎么清洁”，我们希望把这个问题交给875去处理。</p>\n  <p>第二，湿清洁。这是中国和欧洲消费者最关心的，尤其是中国家庭油污很常见。油污最好的清洁方式就是常识：清洁剂加高温。我们做的就是用热雾加清洁液去融化油污，再靠一个很强的滚筒完成“洗涤机一样的清洁能力”。我不会刻意强调“我给了300RPM”，但转速确实关键——扫地机经过地面的时间就那么多，转速高意味着多擦几遍；再加上行业内最大的滚筒接触面积，单位时间内摩擦走过的长度最长，重污才能在融化的基础上被真正擦干净。</p>\n  <p>你会发现很多时候它都是一个组合。像iRobot最早开创、到现在所有竞争对手都在用的三段式清洁——边刷先聚拢、中扫往上赶、风机再吸进去——干扫是这样，湿清洁我们也做成多段式的组合。我们不靠单一参数，靠系统式的组合把清洁力拉到最高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_d336330a53e44fcda81d9342e1bd7a15@5925182_oswg1605369oswg1067oswg1600_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>硬氪：以您的产品技术背景看，一个好的扫地机应该是什么样？</strong></p>\n  <p><strong>李昊：</strong>四个点，清洁力+覆盖率+智能性+免维护。清洁力和覆盖率，解决的是“你要把活干了”的问题；智能性解决的是未来方向，一方面辅助前两点，比如用AI做多次复拖识别，另一方面往服务机器人、家庭管家的方向演进，这是智能性的战略价值；最后是免维护——消费者除了要尝鲜，他要的是省心，要的是一个成熟稳定的大家电。</p>\n  <p>你看洗衣机、电视、冰箱，需要维护的都很少。扫地机什么时候能到这个程度？我在看任何一个产品规划、技术规划的时候都会问：这个规划是否落在四个点里、是否解决里面的核心问题？如果不解决，那可能你做的就是一个伪命题。</p>\n  <h2><strong>扫地机替代洗地机的可能性出现了</strong></h2>\n  <p><strong>硬氪：这次展会上很大的面积给了概念型产品，它在你们的产品序列里意味着什么？</strong></p>\n  <p>李昊：还是从清洁力和覆盖率讲。875在湿清洁上已经有很多突破，但清洁力还有继续向上的空间，而这个空间需要的是体积。为什么手持洗地机吸面条很轻松？因为它长，可以装一个非常强的风机，这是扫地机以前很难做到的。那把扫地机做高一点，是不是就具备了这样的能力？这台概念机的母机主机，就预留了进一步大幅提升清洁力的空间——我会把机身做高，去容纳更强劲的风机。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_91338fdb13724fd6a4662334ee3f19d1@5925182_oswg500324oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;iRobot概念机</p>\n  <p>这里有个很关键的巧思：母机的占地面积跟现在的扫地机基站没什么区别。我们调研过，对大部分空间敏感的家庭来说，大家缺的不是垂直空间，缺的是投影面积。所以它不额外占你的地，却开拓了大幅提升清洁力的可能性——相当于一个会移动的基站，加上更强的清洁能力。</p>\n  <p>第二个是子机，核心解决覆盖率。两个场景：一个是错层，这对所有扫地机器人来说目前都是无解的，我们的方案把子机带到不同层去；另一个就是你提过的“桌子腿问题”——大家做测试的时候把餐桌摆得规规整整，看着空间挺大，但真实生活里吃完饭凳子是要推回桌底的，凳腿和桌腿交叉在一起，没有任何算法能穷举这种可能性，这时候就看两件事：算法对不同场景的适应能力，以及物理层面有没有最好的空间适应性。子机要提供的，就是比任何单一机器人更好的通过性，把覆盖率的“最后一公里”补齐。</p>\n  <p>比如一个家庭，全球平均覆盖率如果假设在80%，我们能不能通过更小更薄、子母机、更高阶的越障，做到90%、95%？在这个基础上再做更深度清洁，这就是母机存在的价值。所以Roomba Duo不是一个边缘场景的产品，它是把“清洁力+覆盖率”这套系统能力再往上推一层的产品。</p>\n  <p><strong>硬氪：展厅里那个吸面条的演示还挺让人新奇的。</strong></p>\n  <p><strong>李昊：</strong>吸面条本身确实是个吸眼球的展示，日常很少有人会吸到面条，但它核心要突出的是重污清洁能力。吸面条是洗地机常用的性能展示，扫地机行业以前没有，因为扫地机的重污能力还没到这个地步。现在我们把扫地机做到跟洗地机一样的清洁力，再把覆盖率覆盖到原来需要手动清洁的边角——扫地机真正替代洗地机的可能性就出现了，消费者不用再买那么多产品，一个省心的机器就能把活干完。</p>\n  <h2><strong>核心是做每个地区的本地化</strong></h2>\n  <p><strong>硬氪：站在海外市场的角度，iRobot这种成熟国际品牌，你们在品牌打法上有什么心得？</strong></p>\n  <p><strong>李昊：</strong>最关键的一点，是你得理解海外每个地区的消费者——这跟我做产品的思路一致，回到消费者视角。你刚才用了“出海”这个词，其实比较笼统，这个世界上不是只有中国和外国，而是有很多国家，核心是要做每个地区的本地化。</p>\n  <p>拿日本举例，日本年初市占率大概40%，上个月已经回到72%。怎么做到的？从产品到营销，都要理解日本消费者到底要什么。日本家庭空间偏小，消费者在乎的是足够小的空间占用——这个消费感知人人都有，但再往深想一步：所谓小，到底是薄还是直径小？日本消费者缺的是投影空间，所以你在乎的应该是直径小。所以我们把“mini”这个概念在日本打透了：基础款247直径的mini，往上还有298直径的“大号mini”。同样的产品到了别的国家，mini根本不是宣传重点，卖点是清洁性能；在日本，小直径就成了核心痛点。</p>\n  <p>欧洲也是一样。欧洲有比较多老房子、错层结构，所以Roomba Duo“把子机放到错层上”这个价值点是能讲通的。但如果未来中国全是精装大平层，你跟中国消费者讲错层，大家甚至不知道错层是什么。所以本地化一定是最关键的点——我们有很强的本地渠道、本地团队、本地理解，这是非常宝贵的资产。</p>\n  <p><strong>硬氪：为什么继续用iRobot这个品牌？这个品牌有什么优势吗？</strong></p>\n  <p><strong>李昊：</strong>iRobot本身是一个非常伟大的品牌，有很多未来的可能性，没有必要去做变更。首先它有非常忠实的用户基础和全世界范围的品牌认知；其次，说句可能反常识的话——Roomba这个词在消费者里的认知程度，其实比iRobot还高，在美国人们会说“我用的是Roomba”，不会说“我用的是iRobot”。</p>\n  <p>那为什么还要坚持iRobot这个品牌？你看过去有iPhone、iPad、iWatch，但未来，我认为这些“i”都不如iRobot。我们不会永远只focus在清洁赛道，iRobot这个名字本身有非常大的未来可能性，我们要做的是把这个品牌的价值巩固、完善，让消费者意识到它。</p>\n  <p>至于“低调”的问题，我觉得iRobot本身没那么低调，只是过去这些年因为运营模式显得低调了。现在我们要通过更好的产品、更好的信息传递，让大家认识到品牌的理念、价值观，以及我们真正以用户视角为中心的部分。</p>\n  <p><strong>硬氪：中国的消费者这几年有什么新变化？</strong></p>\n  <p><strong>李昊：</strong>两个层面。第一是消费者认知在回归理性。中国扫地机市场全球占比非常大，但中国消费者对这个品类的了解偏晚、渗透率也偏低，前几年大家处于很宽容、很愿意尝鲜的状态，也为自己的尝试买了不少单。现在消费者对“清洁这件事本身”理解更透彻了，对自己需要什么样的产品开始清晰——过去大家把扫地机当尝鲜的东西，现在既要尝鲜，更要它能解决家里的问题。美国用户早就把扫地机当工具了，中国正在经历这个转变。</p>\n  <p>第二是家居环境的变化。中国装修从早期的没风格，到地中海、法式、新中式，再到现在非常明显的意式趋势。有个细节：现在精装房交付的地板基本都是浅灰偏哑光的，而拆地板是件很复杂的事，这个颜色基本决定了后面只能往意式走——新中式、法式、美式都不太合适了，意式好看又符合精装房交付标准，一定会成为主流趋势。而新意式现在是全球性的现象级趋势，美国的新家庭也往这个方向走。家具种类、桌椅沙发、布局都会随之变化，扫地机怎么契合这种环境，是我们该去研究的。</p>\n  <h2><strong>洗衣机、冰箱不是我们的方向</strong></h2>\n  <p><strong>硬氪：叠加人形机器人、具身智能的想象，扫地机这个市场会不会发生我们没有看到的变化？</strong></p>\n  <p><strong>李昊：</strong>我个人观点是，完全具身进入家庭还需要时间。作为消费品，价格永远是关键要素，具身的成本还是比较贵的。但我非常看好这个方向的未来，它一定会往更多形态发展，不局限于纯扫地机，可能是“轮子+机械臂”的方式承载更多功能，像一个更高的家庭管家。中间阶段我更倾向于一个方向：基于扫地机这种移动底盘，加上3D传感器，再加上机械臂。</p>\n  <p><strong>硬氪：很多中国企业每年都在扩品类，你们在品类上怎么规划？</strong></p>\n  <p><strong>李昊：</strong>两个方向。第一是清洁相关领域——扫地机、洗地机、吸尘器我们都会考虑，iRobot和在清洁层面深耕了很久，我们在北美已经发布了洗地机，今年接下来在中国也会发布。第二是机器人相关类目，iRobot在这个领域积累很深，展台下面你能看到我们不止做扫地，还有很多机器人技术的积累。我们会围绕清洁和机器人两个方向不断延伸。</p>\n  <p>但我们不会乱做，洗衣机也搞一个、冰箱也搞一个，那不是我们的方向。</p>\n  <p><strong>硬氪：怎么克制这种诱惑？看到新品类、新机会，不做其实挺难的。</strong></p>\n  <p><strong>李昊：</strong>任何一个行业，你光去看，无论红海与否，都能看到机会点。但要做还是不做，要回归理性判断。我们有一套评估模型，简单说就是“五看”：看宏观、看行业、看市场、看用户、看竞争，最后再看自己。这样每个行业你都能看到一个大概的ROI——所有行业都有ROI，但资源永远是有限的，你一定要聚焦。</p>\n  <p>同样2000个人的团队，我可以去做很多品类，但我更期望先用这2000个人聚焦做好几个品类，去解决那个核心问题——消费者买了两次之后不想再买的问题。改变行业，这是我们真正期待的事情。</p>\n  <p><strong>硬氪：您自己是技术出身？</strong></p>\n  <p><strong>李昊：</strong>对，我是研发和产品背景出身，现在宏观都会管理，但更熟悉的还是产品和研发。不过我说的产品和研发视角不是工程师视角，而是从消费者出发的视角——早年我做纯产品研发的时候，就喜欢到各个国家跟经销商、零售商聊天，问他们的痛点和问题，再基于这些去规划产品。</p>\n  <h2><strong>技术卷到了平滑段，市场的活力还在</strong></h2>\n  <p><strong>硬氪：今年在IFA逛下来，包括欧洲AI行业的发展，有什么让您印象深刻的？</strong></p>\n  <p><strong>李昊：</strong>从产品技术层面，我看了部分展馆，会感觉有点陷入僵局了——还是不断卷单一参数，逐渐走到技术曲线的平滑段，缺乏新意。所以我说我们今年还蛮不一样，都是从系统层面、消费者层面思考问题。</p>\n  <p>但从另一个视角看，市场的活力还在：人流在这里，大量产品需求、消费者需求、渠道需求都在。关键是各个品牌方怎么去满足这些需求。</p>\n  <p><strong>硬氪：所以您对行业是中性还是乐观？</strong></p>\n  <p><strong>李昊：</strong>对行业我非常乐观。它正处在一个要往下一个渗透率阶段蓬勃发展的阶段——现在还是很低，全球平均渗透率，发达国家加上中国也就10%出头，空间是有的；产品成熟度也渐渐到了，开始出现真正有用的系统性解决方案。</p>\n  <p>市场角度我也乐观。这两天我见了非常多经销商、零售商，他们的需求很大，而且有大动作——比如单一国家的经销商，已经开始准备5000万欧元的大投入。</p>\n  <p><strong>硬氪：经销商渠道的竞争现在也像产品和参数这么激烈吗？</strong></p>\n  <p><strong>李昊：</strong>挺激烈的，这源于行业变化。欧洲过去以线下渠道为主，是一个赢者通吃的模式——积累越深、关系越硬，就会持续变大。但现在渠道的多样性，包括线上渠道的可能性出现，给了很多新兴公司机会，无论是中国公司还是本土新公司。竞争在变激烈，渠道复杂度在变高，营销复杂度也在变高——从传统PR到现在大量红人的引入。但机会也更多：谁能更适应新的营销和市场规则，谁就能获得更多市场份额。</p>\n  <p><strong>硬氪：现在展会上80%都是中国企业，卷到最后是中国企业卷中国企业，展会会不会越来越没意思？</strong></p>\n  <p><strong>李昊：</strong>还好。展会存在的意义，永远是服务当地的用户和当地的客户，参展商是谁并不改变这一点。目前中国公司势头比较强劲，所以中国公司更多；未来如果有其他国家崛起，也会有更多别国公司出现，参展商的竞争永远存在。</p>\n  <p>但展会本身很重要——比如这两天我会见很多经销商、零售商，这是一个非常好的机会去跟大家共识我们的产品：我们为用户创造什么价值、方向在哪里。我们的经销商伙伴都是合作十几二十年的老伙伴，大家一条心去共创一个品牌，价值就很大。</p>\n  <h2><strong>打破，再融合</strong></h2>\n  <p><strong>硬氪：反过来问，这次焕新归来，最不希望外界记住的刻板印象是什么？</strong></p>\n  <p><strong>李昊：</strong>过去这些年，iRobot可能传递了一个相对保守的印象：追求稳定，喜欢把一个平台做稳定之后，连续几年都卖一样的平台。这个要改变。</p>\n  <p>iRobot其实有非常庞大的技术积累——3000多件专利。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_8968ba882abd43438c00e990549960e4@5925182_oswg695625oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">iRobot展示其3000多项专利</p>\n  <p>核心问题是之前的思路偏保守：如果这个平台work，就一直让它work下去，有了新技术先储备着。现在我们认为，为了满足消费者的需求，应该把更多的创新真正应用到产品上，把储备的技术落地到消费者的真实场景里。我们不再是那个“平台能用就一直用”的公司，我们会更创新、更年轻。虽然我们有36年历史，但现在也是一家年轻的公司——昨天发布产品时，我们的节目表演都是rap的形式，就是想告诉大家：我们历史很悠久，但我们非常潮、非常年轻化、充满活力。</p>\n  <p><strong>硬氪：这次借着IFA见了很多经销商，讲得最多的是什么？讲得最少的是什么？</strong></p>\n  <p><strong>李昊：</strong>讲得最多的是产品策略，但我不是去讲技术细节，而是讲我为什么开发这些产品、从用户心智出发是什么样的——因为最后营销和销售不只我们发力，经销商也要发力，他们是否理解、能否把信息传递给消费者，很关键。所以我要跟他们共识：这个产品怎么从消费者视角出发，真正的优势是什么。</p>\n  <p>高层级战略的事反而不怎么聊了——我1月份就开始管理，一直在到处跑，跟经销商都很熟，战略、合作关系这些1月份就聊过了。聊得最少的是商务商业的细节，或者要谈判的事情，因为大家都建立在绝对的互信和对品牌的热爱之上，都愿意多走一步。</p>\n  <p><strong>硬氪：最后一个问题，您希望给iRobot的伙伴们讲些什么？</strong></p>\n  <p><strong>李昊：</strong>我希望跟大家说，所有人都把心态打开：所有我们认为不对的事、错误的事，都大胆提出来，把它解决掉，我们永远做正确的事。这是快速调转不正确方向的机会，我们要非常快地把过去觉得不对的事情都改掉，长此以往，iRobot会不断进化，同时带动清洁机器人行业往正确的路线前进。</p>", "category": "tech", "published_at": "2026-09-11T09:24:46+00:00", "fetched_at": "2026-09-12T02:51:51.207904+00:00", "fingerprint": "2cabe828266daf5e"}, {"source": "36氪 - 最新文章", "title": "和梁文锋师出同门，浙大00后做世界模型，将再融10亿元｜36氪首发", "url": "https://36kr.com/p/3978921197140998?f=rss", "summary": "<p><strong>文｜王欣逸</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>世界模型赛道将再添一笔大额融资。</p>\n  <p>《智能涌现》独家获悉，近日，专注4D世界模型领域的魔芯科技即将完成新一轮融资，融资规模或达10亿元，估值也有望跃升至近100亿元。这将是他们今年的第五轮融资，也是近一个月以来的第二轮融资。</p>\n  <p>据了解，上一轮融资完成后，魔芯科技的估值已近40亿元，这也意味着，新一轮融资完成后，仅一个月的时间，其估值将增长至约2.5倍。</p>\n  <p>魔芯科技即将迎来新一轮融资，这为似乎慢慢冷静下来的世界模型赛道，又添了一把火。消息显示，魔芯科技已于日前完成股份制改造，新一轮融资也延续了此前产业资本密集参与的特点，历史股东有深创投、浙创投、华为哈勃、联想控股、富瀚微、晶科能源、中芯聚源、杰华特、Prosperity7 Ventures、鼎晖百孚、龙芯创投等。</p>\n  <p>创始人兼CEO陈天润是一位00后，也是浙江大学计算机科学与技术学院2022级博士生，师从中国工程院院士、原浙江大学校长潘云鹤，和DeepSeek创始人梁文锋是同门师兄弟。他的研究方向是三维视觉、空间智能、世界模型算法，在Science、Nature Photonics等期刊以及ICCV、CVPR等会议上发表50余篇论文。</p>\n  <p>魔芯科技创立于2021年，最早是做3D打印硬件出身，最初的定位是做消费级打印硬件，主要面向家庭、学生以及创意爱好者，累计营收数千万元。</p>\n  <p>在3D方向的多年积累让陈天润发现，3D AI建模有自己的Scaling Law，于是一个更大胆的决定逐渐成形，2024年底，他决定带着团队转向空间智能，做3D场景建模以及世界模型。“无论是机器人还是自动驾驶，最终都需要一个能理解和模拟物理世界的‘大脑’，我们做的就是这个‘大脑’。”陈天润提到。</p>\n  <p>成绩单也很快交上。2025年12月，魔芯科技发布了交互式世界模型KOKONI-World原型，今年7月，魔芯联合潘云鹤院士团队、华为云发布了全球首个Flash World Model——MoWorld，该模型的参数量为28B，采用MoE（混合专家）架构。这是一个高帧率的交互式世界模型，用户可以通过图像、文本等输入方式，生成完整的、符合现实物理逻辑的高清3D场景，支持六自由度（6-DoF）相机控制，并支持生成长达2000帧的视频。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_8fd092c2b7614aafb2ae30071101504a@6162492_oswg489468oswg824oswg459_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△基于一张照片、一段视频，MoWorld可以建构出模拟真实物理世界的4D模型，图源：企业</p>\n  <p>高帧率，体现在它能够以每秒50帧的速度实现实时3D生成；实时交互，指的是用户可以通过键盘、鼠标等实时控制视角与动作，模型在接收到输入后即时生成下一帧画面，并保持空间结构、物体位置和历史状态的一致性。</p>\n  <p>MoWorld论文中提到，在计算机图形学和交互媒体领域，30FPS被广泛认为是实现实时渲染、提供流畅交互体验的最低阈值。而50FPS的帧率，意味着每帧只需要20毫秒生成，能够快速响应用户指令，在具身智能、自动驾驶等对延迟相当敏感的场景尤其重要。</p>\n  <p>魔芯科技的世界模型无需依赖高端GPU，全栈基于国产NPU设计，构建了一个从数据生成、预训练、蒸馏到高效推理的框架，这一模型全程跑在昇腾NPU超节点上，就推理成本来看，其方案能比同规模GPU方案降低约70%，仅为现有世界模型的30%-50%。</p>\n  <p>世界模型，几乎成了今年海内外大厂以及创业公司的必争之地，英伟达、Google、腾讯、阿里、字节等科技巨头都推出或着手推出自己的世界模型；热钱也相继进入世界模型创业公司中，极佳视界今年来已相继完成三轮10亿元以上的融资，Liber AI则是8个月连续完成5轮融资。</p>\n  <p>站在世界模型的风口上，魔芯科技也快速拿下一轮又一轮融资，在即将完成的新一轮10亿级融资的前20天，他们刚刚披露完上一轮5亿元级融资，深创投、浙创投、华为哈勃、联想控股等参投，此前他们还完成了3轮亿元级融资：3月华为哈勃参投的近亿元Pre-A+轮融资，5月浙创投、联想之星等参投近亿元战略轮融资，以及6月完成的数亿元A轮融资，华为哈勃参投。</p>\n  <p>与此同时，实现世界模型的路径也不尽相同。李飞飞派认为，世界模型的核心是空间智能，必须构建可测量、可编辑、可进入的显式三维结构，而不仅仅是逼真画面的生成；而杨立昆派选择走潜空间预测方向，提出JEPA（联合嵌入预测架构），让模型能理解视觉的因果，推测在某一个抽象空间里下一时刻的状态会变成什么样。</p>\n  <p>魔芯科技选择的是另一条路线——隐式结构路线，让AI不直接生成画面像素，而是先在内部建立一个“3D空间+时间”的抽象表示，所有场景都从这个表示中生成。不仅如此，他们更强调高帧率的实时交互以及全栈国产NPU部署的工程落地。</p>\n  <p>低成本、高实时性的特点，也让魔芯在成本侧及产业落地上更具备优势，在人形机器人、自动驾驶等行业中，依托MoWorld-3D搭建的数字仿真训练场，能为机器人训练提供大量的训练场景，让机器人在虚拟的产线、居家环境等空间中完成高频次的动作演练，为具身智能规模化提供基础设施。</p>\n  <p>MoWorld模型发布后，魔芯已在工业数字孪生、具身智能训练、城乡规划和文旅消费等多个场景加快推进探索和落地应用。</p>\n  <p>魔芯科技为非“模型native”的公司提供了一个很好的样本，不过，在英伟达、腾讯、World Labs（李飞飞的创业公司）等巨头和明星公司的夹击中，魔芯能否站稳脚跟，答案才刚刚开始书写。</p>", "category": "tech", "published_at": "2026-09-11T11:49:47+00:00", "fetched_at": "2026-09-12T02:51:51.207898+00:00", "fingerprint": "49d805408831a2bd"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨房贷延长到40年但申请人不能超过35岁？机构回应；长鑫利润率反超三星SK海力士；戴尔市值一夜飙升2500亿元，创历史新高", "url": "https://36kr.com/p/3979727038004226?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>月之暗面借Kimi K3加速增长，2026年底年化收入目标20亿美元</p>\n  <p>多家券商收紧个人程序化交易接入</p>\n  <p>OpenAI据报考虑放缓前沿AI开发，奥特曼希望其他公司跟进</p>\n  <p>国际油价11日下跌</p>\n  <p>明星AI研究员离开Meta，加盟Anthropic</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>房贷延长到40年但申请人不能超过35岁？机构回应</strong></p>\n  <p>8月28日，中国人民银行、国家金融监督管理总局联合印发《关于改革完善房地产信贷管理推动加快构建房地产发展新模式的意见》，将个人住房贷款期限由最长30年延长至最长40年。</p>\n  <p>北京地区房屋中介机构人士表示：“贷款年限跟房龄、房子结构、建筑模式、贷款人的年龄均有关系。”根据银行不同，通常“借款人年龄+贷款期限”不超过70年或75年。建设银行一位贷后管理部门人士表示：“公积金暂不参与延期。”且公积金年限认定较为严格。“砖混住宅47减房龄，钢混住宅57减房龄，在住建委新改造名单的可以按67减房龄。”</p>\n  <p>而存量按揭申请延长还款期限政策进度不一，以北京地区为例，建设银行贷后管理人员表示“存量房的相关政策细则仍在研讨中。”（界面新闻）</p>\n  <p><strong>长鑫利润率反超三星SK海力士，成最高盈利水平存储厂商</strong></p>\n  <p>9月11日消息，全球经济调查分析平台QUICK FactSet最新数据显示，2026年第二季度，长鑫存储息税前利润率达到82%，一举超过SK海力士（76%）和三星电子半导体业务（70%），成为当期全球盈利水平最高的存储芯片厂商。同期，长鑫存储的营收较上年增长约10倍，在长鑫存储、三星、SK海力士、美光、铠侠和闪迪六家企业中增速最高。（界面新闻）</p>\n  <p><strong>美股科技巨头暴涨近12%创新高，市值一夜飙升2500亿元</strong></p>\n  <p>北京时间9月12日凌晨，美股科技巨头戴尔科技股价大幅飙涨近12%，股价报567.14美元，创出历史新高，市值最新报3606亿美元，一夜暴增约385亿美元（约合人民币2582亿元）。</p>\n  <p>消息面上，戴尔科技最新披露的业绩全面超预期，并大幅上调全年业绩指引，进一步印证AI基础设施投资热潮持续升温。（21世纪财经报道、券商中国）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阿里云：Token Plan个人版升级，新增12类Agent Harness工具</strong></p>\n  <p>36氪获悉，9月11日，据阿里云消息，阿里云Token Plan个人版升级。据介绍，原有价格及Credit额度保持不变，Standard和Pro套餐新增Agent Harness工具权益与用量，覆盖搜索、网页解析、图像生成、语音处理、代码执行等12项Agent开发常用能力。</p>\n  <p><strong>OpenAI据报考虑放缓前沿AI开发，奥特曼希望其他公司跟进</strong></p>\n  <p>9月11日，据报道，OpenAI首席执行官山姆·奥特曼本周在公司全员会议上表示，公司可能放缓前沿人工智能开发，并考虑与其他AI实验室协调行动。OpenAI首席科学家雅库布·帕乔茨基近期也表示，AI企业应在必要时协调放缓未来开发，直至建立共同安全标准。近期，多家AI公司员工公开警告快速推进AI发展的风险。7月底，逾1000名主要AI企业员工签署请愿书，呼吁建立放缓AI开发的机制。OpenAI近期已暂停部分模型训练，此前其AI智能体被曝突破安全环境并攻击第三方网站，也进一步引发外界对先进AI网络安全能力及安全防护的担忧。（界面新闻）</p>\n  <p><strong>彩云科技：AI团队两次刷新大模型训练速度世界纪录，相关代码已并入官方开源仓库</strong></p>\n  <p>36氪获悉，近日，人工智能企业彩云科技宣布其基础模型算法团队，在全球开源AI技术竞速项目NanoGPT Speedrun中，连续两次刷新大模型训练速度世界纪录，将达标训练时间压缩至1分16秒。相关代码已正式并入官方开源仓库。据了解，两项纪录是彩云科技团队在模型架构上的两项原创性创新——DCMHA（可动态组合多头注意力）和MUDD（多路动态稠密连接），分别于2024年和2025年发表于国际机器学习顶级会议ICML，并均入选口头报告。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>iPhone 17系列：官网涨价，线下大降价</strong></p>\n  <p>苹果秋季新品发布会后，虽然官方网站上调了iPhone 17系列售价，但是线下渠道开始降价促销。9月11日，界面新闻记者以消费者身份咨询苹果在北京的多家门店获悉，iPhone 17系列线下降价幅度为500-800元。其中，北京华贸购物中心苹果直营店工作人员表示，目前门店iPhone 17系列中，17e参与国补后的售价是4799元，比官网5299元便宜500元。北京海淀区一家苹果门店工作人员称iPhone 17原价6799元，目前优惠500元，优惠之后的价格为6299元。</p>\n  <p>另据界面新闻了解，iPhone 17 Pro系列自官网下架后，目前全北京仅两家门店有货。上述北京海淀区苹果门店工作人员对界面新闻表示，iPhone 17 Pro 256GB售价8999元，自9月9日凌晨起推出800元优惠，优惠完之后价格为8199元。苹果多家门店的工作人员均表示，如果想购买性价比高的iPhone 17系列产品，可以前往京东Apple产品自营旗舰店。界面新闻在京东Apple产品自营旗舰店查询获悉，iPhone 17 256GB价格5469元，比此前的5999元降了500元，比苹果官网价格便宜1330元。</p>\n  <p>谈及iPhone 17系列优惠的原因，苹果相关门店工作人员未作正面回应。此外，工作人员提醒称，目前京东等授权平台均没有电源适配器出售，该产品只能在苹果官方购买。（界面新闻）</p>\n  <p><strong>零钱通不能用于支付？腾讯回应：为谣言，相关功能不受影响</strong></p>\n  <p>近日有市场传言称，微信零钱通不能用于支付。就此，腾讯方面回应称，近期网传相关不实内容为谣言，零钱通始终坚持合规运营，相关功能不受影响，用户可放心使用。（界面新闻）</p>\n  <p><strong>国际油价11日下跌</strong></p>\n  <p>截至当天收盘，纽约商品交易所10月交货的轻质原油期货价格下跌2.43美元，收于每桶100.05美元，跌幅为2.37%；11月交货的伦敦布伦特原油期货价格下跌3.02美元，收于每桶104.61美元，跌幅为2.81%。(金十数据)</p>\n  <p><strong>美股收盘：三大股指收涨</strong></p>\n  <p>美股周五收盘，道指初步收涨0.98%，标普500指数涨0.86%，纳指涨0.96%。高通(QCOM.O)涨2.88%，英特尔(INTC.O)涨2.61%，SpaceX(SPCX.O)涨2.04%，亚马逊(AMZN.O)涨1.94%；闪迪(SNDK.O)跌3.5%，甲骨文(ORCL.N)跌1.82%，美光科技(MU.O)跌0.22%。纳斯达克中国金龙指数涨0.4%，百度(BIDU.O)涨0.89%，阿里巴巴(BABA.N)涨0.68%。(金十数据)</p>\n  <p><strong>宁德时代开启巨额回购</strong></p>\n  <p>宁德时代9月11日公告，公司分别于2026年7月24日、2026年8月12日召开第四届董事会第十八次会议和2026年第一次临时股东会，审议通过了《关于回购公司A股股份方案的议案》，同意公司使用不低于200亿元（含本数）且不超过400亿元（含本数）自有或自筹资金以集中竞价交易方式回购公司部分A股股份，用于注销并减少公司注册资本，回购期限为自公司股东会审议通过回购股份方案之日起12个月内。截至2026年9月11日，公司累计回购60.43万股，占公司总股本的0.0131%，回购价格区间为330.15元/股至331.61元/股，累计使用资金2亿元。（界面新闻）</p>\n  <p><strong>英伟达拟斥资100亿美元，参投Anthropic IPO</strong></p>\n  <p>英伟达据悉正洽谈投资Anthropic的大型IPO项目，英伟达正就向Anthropic的首次公开募股投资高达100亿美元进行谈判。‌Anthropic拟通过IPO募资至多1000亿美元，估值约2万亿美元。（金十数据）&nbsp;</p>\n  <p><strong>燧原科技登上资本舞台，中一签赚16万</strong></p>\n  <p>9月11日，“国产GPU四小龙”之一的燧原科技正式登陆科创板。上市首日，公司股价以410元开盘，较142.18元的发行价上涨188.37%；盘中一度冲高至475元，涨幅达234%，总市值一度超过2000亿元。收盘价为397元/股，较发行价142.18元上涨约179%。此前，摩尔线程、沐曦股份已登陆科创板，壁仞科技已登陆港股。随着燧原科技挂牌，“国产GPU四小龙”已悉数登上资本舞台。（中国新闻周刊）</p>\n  <p><strong>“美联储传声筒”：美联储下周势将加息，但只加息一次无法解决问题</strong></p>\n  <p>据报道，“美联储传声筒”Nick Timiraos最新撰文称，投资者已基本认定美联储下周将进行三年来首次加息，更难的问题是之后会怎样。由于美联储内部几乎没人认为单次加息25个基点足以压低通胀，若下周决定加息，则反映的是利率此前处于错误水平的判断，一次加息无法解决问题。自1990年代以来，美联储仅有一次“一次性”加息。沃什7月曾表示不认为美联储擅长“微调”，分析人士称，一位对微调持怀疑态度的主席不太可能加息25个基点后便宣布任务完成。沃什上月表示，没有太多证据显示借贷条件正在限制经济活动。如果以这一理由推动加息，市场自然会追问利率需要升至多高。如果缺乏解释，市场可能会将一次加息解读为更大规模行动的开始。因此，本周投资者不再将9月会议视为单次会议的问题。市场目前预计，到明年6月累计加息次数至少达到三次，高于此前预计的两次。(金十数据）</p>\n  <p><strong>多家券商收紧个人程序化交易接入</strong></p>\n  <p>近日多家券商收紧个人客户程序化交易接入，旨在进一步落实今年8月28日两协会发布的《证券公司交易信息系统接入管理规范（试行）》。根据文件相关要求，严禁个人投资者通过“类外接”方式开展程序化交易，包括文件交互服务等。还了解到，多家券商正在清理个人投资者依托反采策略对接券商系统的存量违规接入业务。目前监管及券商行业已全面启动外接系统整改工作，多家券商组建专项工作组推进排查、权限关停与存量清退工作。行业预计，本次整改第一阶段工作将于今年11月落地完成。（财联社）</p>\n  <p><strong>美国8月CPI同比增长3.4%</strong></p>\n  <p>美国劳工统计局当地时间11日公布的数据显示，美国8月消费者价格指数（CPI）同比上涨3.4%；剔除食品和能源价格后的核心CPI同比上涨2.4%。（央视财经）</p>\n  <p><strong>国家发改委：9月11日国家对成品油价格实施调控，调控后实际上调260元、250元</strong></p>\n  <p>36氪获悉，8月28日国内成品油价格调整以来，美伊冲突再度升级，国际市场原油价格持续大幅上涨。为减缓国际油价上涨对国内的冲击，在保持现行价格机制框架的基础上，对国内成品油价格采取临时调控措施。根据现行价格机制计算，9月11日国内汽、柴油（标准品）价格每吨分别应上调435元、420元，调控后实际上调260元、250元。</p>\n  <p><strong>月之暗面借Kimi K3加速增长，2026年底年化收入目标20亿美元</strong></p>\n  <p>月之暗面着眼于到今年年底将年化收入大幅提升至20亿美元。知情人士称，月之暗面年度经常性收入（即衡量未来销售表现的一项指标）8月份已突破10亿美元，高于6月份的3亿美元。这一跃升得益于公司7月份发布的人工智能模型Kimi K3。该模型迅速跃居多项性能基准测试前列。部分知情人士称，随着消费者和企业对Kimi订阅服务以及月之暗面在线托管模型的兴趣日益浓厚，公司目前预计其收入规模还将再次翻番。知情人士表示，公司内部预测是到今年年底实现20亿美元的年化收入。因相关信息未公开，知情人士要求匿名。（新浪财经）</p>\n  <p><strong>新版充电宝3C认证实施规则落地，已发出首批32张3C认证证书</strong></p>\n  <p>为强化移动电源产品源头治理，市场监管总局于5月25日修订并发布新版《强制性产品认证实施规则移动电源、锂离子电池和电池组》。近期，有关认证机构已按照新版实施规则发出首批32张3C认证证书。（央视新闻）</p>\n  <p><strong>雀巢宣布提高部分产品价格</strong></p>\n  <p>瑞士食品巨头雀巢集团全球首席执行官费耐睿9月9日表示，为应对能源、货运和原材料成本上升，雀巢正在重新规划产品结构，提高部分产品价格，并且削减消费者不愿意花更多钱买的产品。近期，雀巢出售了其瓶装水业务的半数股权，同时也退出了维生素、矿物质补充剂业务。2025年，雀巢实现销售额894.9亿瑞士法郎，约合7382亿元人民币。（央视财经）</p>\n  <p><strong>千叶珠宝线上店全清空，店员回应</strong></p>\n  <p>9月10日，主办券商东北证券发布风险提示性公告称，无法与千叶珠宝实际控制人林明杰以及其妻子高晓松取得联系，原因不明。9月11日查询发现，千叶珠宝京东、淘宝、小红书等平台的官方旗舰店均无在售产品。其中，千叶珠宝在京东和微信小店上产品全部清空。北京多家千叶珠宝线下门店店员均表示，目前千叶珠宝的部分加盟店仍在正常经营。北京海淀区一家千叶珠宝加盟店员工表示：“我们是加盟店，有自己的老板。品牌选定几个厂家，加盟店是直接向厂家拿货，目前不影响顾客来门店消费和拿货。”（中新经纬）</p>\n  <p><strong>阳光电源，光储产品涨价</strong></p>\n  <p>财联社记者从产业链人士获悉，阳光电源9月11日向下游客户发送产品调价告知函，自9月20日起对光储产品实施价格上调，产品包括光伏逆变器、储能变流器及储能系统，产品调价幅度为5%—15%。公司在函件中表示，本轮上游物料涨价幅度持续超出预期，成本上行态势尚未出现明显缓和，现有产品定价已难以覆盖原材料、生产制造、技术迭代升级以及售后运维的综合投入。为保障产品品质稳定可靠、供货交期可控，避免因压缩成本导致产品性能、供货时限及服务品质受损，经公司多轮审慎评估，我司决定对相关产品价格进行适度调整。（财联社）</p>\n  <p><strong>蚂蚁灵波CEO朱兴回应“融资原因”：不是因为缺钱缺卡</strong></p>\n  <p>近日，2026外滩大会举行。期间，蚂蚁灵波CEO朱兴与媒体进行对话。谈及蚂蚁灵波为何要追求独立融资上市，朱兴首先强调：“不是因为缺钱缺卡（才融资）”。“融资主要解决两个问题，第一个是对于高级人才，我们该用什么样的激励机制去容纳。第二个原因是，行业的成长要经历非常多周期，我们要让公司更高效化，（独立融资）以便我们更好的面对竞争。”他如是道。（新浪科技）</p>\n  <p><strong>美光称将发放史上最高员工奖金</strong></p>\n  <p>美光科技9月11日宣布，将向全球逾六万名员工发放奖金，金额创史上最高。中国台湾地区的员工将获得相当于35至68个月薪资的整体奖励。美光表示，去年8月29日前到职的中国台湾地区员工每人100万台币奖金，其余则依在职期间按比例发放。最高者达基本目标500%的年度绩效奖金，以及额外股票奖酬。美光表示，中国台湾地区员工现金薪酬将从170万台币起；初阶工程师平均现金薪酬为290万台币，包含以授予价值计算的股票奖酬后，平均整体薪酬为340万台币。美光年度绩效调薪股票奖酬将达100%覆盖，让每位员工都能成为公司股东。（新浪财经）</p>\n  <p><strong>半导体公司Analog Devices拟收购Alif Semiconductor</strong></p>\n  <p>近日，Analog Devices, Inc.与Alif Semiconductor宣布，双方已达成最终协议，ADI将以13.5亿美元全现金交易收购Alif。根据双方董事会已批准的协议条款，ADI将向Alif股东支付13.5亿美元的前期现金对价，具体以最终协议条款为准。此外，ADI还可能会支付最高2亿美元的额外或有对价。该交易预计将于2026年底前完成，具体取决于惯常的交割条件，以及修订版《1976年哈特-斯科特-罗迪诺反垄断改进法案》规定的适用等待期（及其任何延期期限）届满。（界面新闻）</p>\n  <p><strong>欧洲央行官员据悉倾向进一步收紧政策，最快10月份再次加息</strong></p>\n  <p>知情人士称，欧洲央行官员预计将进一步加息，下一次行动最快可能就在10月。消息人士透露，虽然政策制定者的看法仍将取决于未来公布的经济数据，但要想压低3%以上的通胀率，可能需要进一步收紧货币政策。（新浪财经）</p>\n  <p><strong>明星AI研究员离开Meta，加盟Anthropic</strong></p>\n  <p>据知情人士透露，明星AI研究员安德鲁·塔洛克（Andrew Tulloch）即将离开Meta平台公司。去年Meta曾向他开出价值超10亿美元的薪酬包，邀请其入职。一位知情人士称，塔洛克将加入Anthropic。他本人未回应置评请求，Meta也拒绝就其离职一事发表评论。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>Altera据报拟最快今年启动IPO，募资规模或超20亿美元</strong></p>\n  <p>9月10日，据报道，英特尔和银湖资本支持的芯片制造商Altera正准备秘密提交首次公开募股（IPO）申请，最早可能于今年上市。公司已选定巴克莱、花旗、摩根大通和摩根士丹利担任承销商，IPO募资规模可能超过20亿美元。（界面新闻）</p>\n  <p><strong>天通股份：筹划发行H股并在香港联交所上市</strong></p>\n  <p>36氪获悉，天通股份公告，公司为推进全球化战略布局，正筹划发行H股股票并在香港联交所主板上市。截至公告披露日，相关细节尚未确定，该事项不会导致控股股东及实际控制人变更。本次H股上市方案确定后，尚需提交董事会及股东会审议，并经证监会、香港联交所等监管机构备案或批准，能否最终实施存在不确定性。</p>\n  <h2>大公司财报</h2>\n  <p><strong>Adobe第三财季营收同比增长13%至67.6亿美元</strong></p>\n  <p>当地时间9月10日，Adobe公布2026财年第三财季业绩。财报显示，公司当季营收同比增长13%至67.6亿美元，GAAP净利润为18.3亿美元；GAAP摊薄后每股收益为4.62美元，非GAAP每股收益为6.13美元。Adobe表示，AI业务年化经常性收入同比增长超过150%，同时创意及生产力产品月活跃用户数突破10亿。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“超维动力”完成超5亿元人民币天使+轮系列融资</strong></p>\n  <p>36氪获悉，“超维动力”完成超5亿元人民币天使+轮系列融资，由新加坡淡马锡控股旗下VC机构祥峰资本、方广资本、万石资本等加注。该笔融资将用于加速“数据-模型-本体”迭代，并推动具身智能的产品化落地。</p>\n  <p><strong>“上海星翼芯能”完成Pre-A轮战略融资</strong></p>\n  <p>36氪获悉，太空光伏电池与核定材料企业“上海星翼芯能”近日完成Pre-A轮战略融资。本轮由钧达股份、上海未来产业基金、临港蓝湾资本、南浔陆遥、新阳半导体联合创始人相关产业投资人共同参投，老股东中科神光持续加码。资金将主要用于技术迭代、空间环境试验及卫星在轨验证，加速太空钙钛矿光伏电池与太空级CPI柔性封装衬底材料的商业化落地。</p>\n  <p><strong>“维刻量光”完成超亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，离子阱量子计算公司“维刻量光”近期已完成超亿元Pre-A轮融资，由九智资本领投，正轩资本、瀚晖资本跟投。此前公司曾完成一轮天使轮融资，半年内连续完成两轮。本轮资金将主要用于产线扩大及整机建设。目前正启动新一轮融资，多维资本担任长期独家财务顾问。</p>\n  <h2>酷产品</h2>\n  <p><strong>特斯拉中国正式上线全新MODEL Y全轮驱动高性能版</strong></p>\n  <p>36氪获悉，特斯拉中国正式上线全新MODEL Y全轮驱动高性能版，售价36.9万元起。</p>\n  <p><strong>支付宝将推出AI钱包智能体</strong></p>\n  <p>36氪获悉，据支付宝消息，支付宝将推出AI钱包智能体。</p>\n  <p><strong>谷歌推出Gemini Windows桌面应用，支持快捷键唤起AI助手</strong></p>\n  <p>当地时间9月10日，谷歌宣布推出Gemini Windows桌面应用，支持Windows 10和Windows 11，可通过“Alt+Space”快捷键快速唤起Gemini，在当前工作界面直接获得AI帮助。该应用支持多步骤任务处理，可调用Gmail、Google Drive等应用中的信息生成内容，并支持通过Nano Banana生成图片、使用Gemini Omni生成视频。谷歌表示，更多原生桌面功能将陆续推出。（界面新闻）</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事。</strong>人均700块的“搬砖”赛，中产的钱还是这么好挣？</p>\n  <p>&nbsp;</p>\n  <p><strong>“存钱心态”小调查</strong></p>\n  <p>现在的年轻人，似乎总在为存钱感到焦虑。每个打工人可能都会立下一个每月存钱的FLAG，但，实现了多少呢？</p>\n  <p>工资到账，还完花呗交完房租，余额就没剩多少；刷会社交媒体，直播间出来钱包就又瘪了一圈；省吃俭用一个月，出门滑个雪就努力清零……“我也没买啥啊，我钱呢？”这成了当代年轻人的未解之谜。</p>\n  <p>你现在有存钱的习惯吗？存钱的最大阻碍来自哪里？欢迎填写“年轻人存钱行为小调查”，聊聊你的存钱态度和成果~</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260912/v2_fea5146becb24b389fec3ad3f5d4900b@5667365_oswg8384oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“存钱心态”小调查</p>\n  <p><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-09-12T01:11:02+00:00", "fetched_at": "2026-09-12T02:51:51.207889+00:00", "fingerprint": "e70bdc7d3486d3a2"}, {"source": "36氪 - 最新文章", "title": "情感智能珠宝硬件公司完成天使轮融资，荣耀AI Connect生态企业等押注｜硬氪首发", "url": "https://36kr.com/p/3977590035119112?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，情感智能珠宝硬件企业SHAKESPEARE莎士比亚近日完成数千万元天使轮融资，由荣耀AI Connect生态企业极选智能、国内头部珠宝DP服务商瑞钰控股共同出资。势能资本长期担任公司独家财务顾问。融资资金将主要用于核心算法迭代、多模态情感交互模型开发、新品类的珠宝工艺研发及全球化渠道拓展。</p>\n  <p>莎士比亚2025年成立于杭州，公司定位“情感智能珠宝”品牌，致力于将传统珠宝工艺与智能穿戴技术深度融合，为提供具备情感陪伴能力的智能珠宝产品。其首款产品为AI身心健康陪伴戒指，已于2026年4月在国内市场正式发售。</p>\n  <p>莎士比亚创始人杨勋忠历任茵曼COO，茵曼内衣创始人，韩束总经理，其创办的瑞钰控股作为年销售额超20亿元的头部品牌服务商，服务过周大生、周大福、潮宏基、老庙等国内主流珠宝品牌。核心团队来自清华、北大、中科院、复旦、浙大等顶尖院校，覆盖计算机、人工智能、医学心理学等领域，形成消费、技术、医疗、审美交叉的复合型能力底座。</p>\n  <p>珠宝与智能穿戴，正在发生一场关于品类定义的碰撞。</p>\n  <p>全球珠宝市场坐拥数千亿美元的存量规模，智能穿戴赛道同样处于高速增长阶段。然而两个行业的交汇处，长期存在一片空白地带。传统珠宝的核心价值在于材质、工艺与审美表达，但其交互模式是单向的，用户佩戴一枚戒指，戒指不会感知、不会回应、不会陪伴。而智能穿戴的核心价值在于持续的数据采集与反馈，但其产品形态长期受限于数码产品范式，设计逻辑长期围绕功能参数展开，与珠宝级审美之间存在一定距离，难以承载情感表达与审美价值。</p>\n  <p>要拆解莎士比亚的产品定义，绕不开珠宝与智能穿戴两个行业底层逻辑的根本不同。在杨勋忠看来，这一赛道机会并非是把智能模块简单塞进珠宝外壳，而在于从产品定义、硬件架构到工艺路径的每一个环节，都重新回答“珠宝如何理解用户”这个问题。</p>\n  <p>其中，公司已发布的首款智能珠宝产品序章系列，研发历时超过一年，历经十余次版本迭代。在毫米级的内部空间里，莎士比亚选择了“低功耗BLE主控+高集成PPG前端+六轴运动传感器”的架构方案，并集成了体温传感器、加速度传感器、PPG光学传感器等核心器件。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_66fe67950d4e48dbb062560b910a730c@6022551_oswg6427713oswg8192oswg5474_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">首款智能珠宝产品序章系列（图源/企业）</p>\n  <p>续航方面，产品采用间歇式自适应采样策略，而非持续高频采集；静息与睡眠场景下提高PPG采样频率以保证数据精度，运动场景下则主动降低频率以控制功耗。整机电池容量约14.1mAh，续航可达7至10天，支持用户自定义监测频率，同时实现IP68级防水，整机重量控制在3至6克，佩戴时几乎无感。</p>\n  <p>然而，真正构成壁垒的并非器件堆叠，而是在电子工程与珠宝工艺之间跨行业的协同能力。</p>\n  <p>“智能戒指和珠宝结合，没有想象中那么简单，并不是两个东西加起来就可以了。”杨勋忠表示。一枚成品的诞生需要跨越器件选型、电子结构重排、注胶密封、真金电镀、手工抛镶五大环节、二十余道工序，由多家工厂跨区域协同完成。</p>\n  <p>产品的核心难点之一，是将电子芯片完整收纳进一枚真正闭环的戒指环体。市面上不少智能戒指受限于器件布局，内圈并非完整圆形：芯片等元器件没有安置空间，只能向内圈挤占位置，形成凸起的平台结构。</p>\n  <p>莎士比亚团队重新设计了PCB板结构，取消传统充电口凸起平台，让电子机芯实现环形一体化成型，内圈采用人体工学圆弧内倒角，最终用户触摸到的贵金属内圈完整圆润、没有任何凸起，贵金属材质也进一步拉高了产品整体质感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_d77bfd95d9e4485ca577406eebfa1a02@6022551_oswg249423oswg1174oswg740_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">戒指内部结构图（图源/企业）</p>\n  <p>另一处差异化创新，是颠倒电镀与芯片装配的工序。此前通行的方法是先电镀、后装芯片，由于电子器件娇贵高温高酸环境都可能损伤芯片，先完成外壳电镀再装入芯片是最省事的路径。但同时，其代价是外壳电镀后无法再做整体打磨，表面质感始终达不到珠宝级标准。</p>\n  <p>莎士比亚反其道而行，先装配芯片并做好防护，电镀层（如镀银 / 镀金）并在壳体表面施加纳米防护涂层并进行珠宝级手工抛光，整套工艺的生产成本数倍于行业常规方案。产品成型交由传统珠宝工匠落地。经过3D起版倒模、手工精修，采用高奢珠宝爪镶工艺镶嵌培育钻石，全程由专业团队质检把控。戒指壳体选用925纯银，高配版本为18K金、纯金贵金属材质，兼顾佩戴质感与保值属性。</p>\n  <p>硬件工艺解决了产品物理佩戴层面的门槛，而情感智能解决的是“如何让用户愿意佩戴”的问题。</p>\n  <p>杨勋忠告诉硬氪，传统智能戒指侧重的是生理健康数据，心率、血氧、睡眠质量。而莎士比亚在生理数据的基础上，把维度提升到了心理层面。“我们会先通过心率变异性（HRV）、皮电等数据，投射用户的情绪变化、压力水平和心理活力，再通过互动沟通给出解决方案。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_a735422e81594a348f4f2a0e5e452b44@6022551_oswg2507219oswg2190oswg1246_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">首款智能珠宝产品序章系列（图源/企业）</p>\n  <p>团队自研了基于个性化机器算法和语义生成模型的情感智能体系，涵盖数据采集、数据处理、状态模型、情感计算与应用服务的完整闭环。当用户佩戴戒指后，系统通过持续采集生理数据并结合用户交互，逐步建立个性化的情绪基线。随着佩戴时间增长，系统对用户情绪状态的理解会持续加深，从感知情绪波动逐步演进到预判情绪需求。</p>\n  <p>“从功能上，传统智能戒指只解决身体层面的问题，我们同时解决心理层面的问题。”杨勋忠表示。</p>\n  <p>根据Precedence Research测算，2025年，美国行为及心理健康服务市场规模达到948亿美元；在中国，睡眠研究会调研显示，超过60%的年轻人面临不同程度的睡眠与情绪压力问题。而目前，仅一线城市预约心理医生就往往需要数月等待。</p>\n  <p>莎士比亚的定位，正是通过日常佩戴的智能珠宝，将情绪感知与陪伴能力嵌入用户的生活流中，在健康监测之外，提供一种低门槛、高频次的心理支持方式。</p>\n  <p>所有内容、渠道与海外路径的起点，都不是品牌叙事本身，而是用户真正在哪里、以什么姿态、为什么愿意被“看见”。</p>\n  <p>在渠道与营销层面，国内市场的渠道与营销遵循“内容种草—心智占位—线上线下承接”的路径。产品上市前，团队通过明星与KOL合作完成高密度曝光，在建立品牌认知的同时为后续转化预埋势能。市场反馈也验证了这一节奏——在天猫88会员节活动中，莎士比亚拿下了智能戒指单品排行榜第一、第三和第五名。</p>\n  <p>线下则通过与超过80%的上市珠宝品牌的既有合作经历，以联名款、快闪店、买手店、数码合作店等多元形式快速触达用户。目前，其产品已进驻INNO100全球创新旗舰店和荣耀深圳湾旗舰店，后续将入驻荣耀旗下数千家店铺以及国美、顺电、机器时代、中免等渠道，计划2028年开设首家线下旗舰店，逐步扩展至各城市核心CBD商区。</p>\n  <p>海外市场的推进遵循“北美先行、欧洲承接、日韩渗透”的梯度策略。北美是科技与极客文化的高势能区，作为品牌势能外溢的第一站；欧洲依托奢侈品与设计话语权，进一步强化品牌的设计语言与工艺叙事；日韩则借潮流与IP文化的渗透力，完成在亚洲核心市场的文化认同与心智锚定。这不是简单的地理扩张，而是基于文化适配与心智梯度设计的全球化路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_c0e733d9249d42e59655f10f7ee351a9@6022551_oswg1155730oswg1256oswg1164_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">莎士比亚产品系列（图源/企业）</p>\n  <p>莎士比亚的用户策略并非把核心用户视为单纯的购买者，而是将其纳入品牌共建的链条。通过KOL内容合作完成第一轮心智渗透后，团队以共创计划、限量发售、线下体验等方式，把早期用户逐步沉淀为品牌的种子用户。这些人既是产品迭代的早期反馈者，也是圈层传播的关键节点，用户本身反过来也能成为品牌势能的放大器。</p>\n  <p>国内的转化矩阵、海外的势能梯度与用户的圈层裂变，三条线最终被压进同一个长期品牌资产里，在每个触点上得以让用户被精准识别、被有效承接、被持续打动。</p>\n  <p>智能珠宝的核心价值，不在于把传感器塞进戒指，而在于以情感理解为锚点，重构人与饰品之间的关系。 珠宝不再是静态的装饰物，而是能够感知、陪伴、回应的数字灵魂伴侣。以珠宝工艺承载智能感知，以情感算法驱动交互体验，莎士比亚所正试图重新定义“穿戴”二字的边界。</p>\n  <p><strong>以下为硬氪与莎士比亚创始人杨勋忠的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：</strong>从硬件形态来看，戒指能捕捉到的生理信号是有限的。怎么通过一枚戒指去理解用户的情绪状态？</p>\n  <p><strong>杨勋忠：</strong>戒指能采集的信号维度确实有限，所以我们做的不是“读心”，而是“读身”，即通过生理信号的变化去倒推情绪状态的可能性。当前一代产品核心信号来自三个方面：心率变异性（HRV）、体动数据，以及体温、心率、睡眠等基础生理信号。</p>\n  <p>HRV是目前情绪识别领域研究最充分的生理指标之一。当人处于压力或焦虑状态时，交感神经占主导，HRV会显著降低；而在放松、愉悦的状态下，副交感神经激活，HRV会升高。我们采集的是连续时域和频域两个维度的HRV特征，时域上看NN间期的标准差，频域上看低频和高频成分的比值变化。</p>\n  <p>皮电反应跟踪的是皮肤电导率的细微波动，这个信号直接受汗腺活动调控，而汗腺又由交感神经驱动——情绪唤起越强，皮电响应越明显。这是情绪强度的一个独立维度。</p>\n  <p>体动数据用来做上下文标注，人在运动时心率自然会升高。当然，系统也会需要把这种“生理性波动”和“情绪性波动”区分开。</p>\n  <p>算法层面分两步走。第一步是基线建模；用户佩戴的前几天，系统在静息、运动、工作、睡眠等多种场景下采集数据，建立这个用户个人的生理信号基线，而不是套用统一的人群阈值。第二步是异常检测；当实时信号偏离基线达到一定幅度时，系统标记为情绪波动事件，再结合用户当时的活动状态和后续交互反馈，不断校正模型的判断逻辑。</p>\n  <p>目前，这套系统在用户佩戴后的两到三天内可以给出初步的情绪趋势判断，随着数据积累和交互反馈的增加，模型的个性化精度会持续提升。此外，我们还在开发的第二代产品，将会增加更多辅助信号。</p>\n  <p><strong>硬氪：从行业数据来看，智能穿戴设备普遍面临佩戴率持续走低的问题，很多用户买回去之后一两周就闲置了。莎士比亚在产品定义上怎么回应这个问题？</strong></p>\n  <p><strong>杨勋忠： </strong>这是智能穿戴行业一个长期被讨论但始终未被很好解决的问题，用户留存。销量和活跃用户是两个完全不同的维度。很多产品卖出去之后，用户新鲜劲一过就不再佩戴了。</p>\n  <p>原因在于，此前市场上绝大多数智能戒指的产品定义起点是“功能硬件”，核心设计语言围绕传感器排布、芯片选型和数据精度展开。这决定了它在形态上首先是一个需要用户“为了某个功能而戴上”的设备，所以用户会有意识地在需要监测的时候佩戴，而日常场景下佩戴意愿会持续衰减。</p>\n  <p>根源在于，传统智能穿戴的品牌和用户之间缺乏审美连接和情感连接，导致最终的佩戴动机来自于实用主义的驱动。</p>\n  <p>莎士比亚的起点不同。我们首先是珠宝品牌，其次才是智能设备。珠宝的第一性原理是“佩戴本身就构成价值”，它不需要有功能，用户也会戴。如果一枚戒指本身不好看、不够有质感、无法融入日常穿搭，它就不可能成为一个每天都会被佩戴的物件。当用户愿意为了审美本身而戴上它，数据采集、算法优化的前提条件就成立了。</p>\n  <p>这个顺序很重要，不是因为要监测心率而戴，而是因为戴着好看，顺便完成健康数据的持续追踪。如果只是围绕科技语境下的效率叙事出发，会把自己绕进去。通过珠宝嵌入科技和文化，在用户心智中才能完成从“阶段性工具”到“长期陪伴信物”的跃迁。</p>\n  <p>目前莎士比亚的日活率相较行业均值高出数倍。用户在购买一段时间后仍然愿意每天佩戴，因为它本身就是一枚日常可戴的珠宝戒指，无论是否记得充电，佩戴动机始终成立。</p>", "category": "tech", "published_at": "2026-09-12T02:30:00+00:00", "fetched_at": "2026-09-12T02:51:51.207874+00:00", "fingerprint": "1fe29d5d1d2dc466"}, {"source": "少数派", "title": "新 iPhone 配件精选：多种组合一次配齐", "url": "https://sspai.com/post/114414", "summary": "iPhone18Pro/ProMax即将开售，这次我们围绕新iPhone准备了几种常用配件，并整理成了五种配件组合，覆盖机身防护、充电、数据连接和磁吸支撑。其中，日常防护组合优惠29元，防护充电组合优 ...<a href=\"https://sspai.com/post/114414\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-11T04:00:00+00:00", "fetched_at": "2026-09-12T02:51:26.883256+00:00", "fingerprint": "4ddfce12769e7ce4"}, {"source": "少数派", "title": "「正常」已是不易：聊聊不那么标新立异的理想 i6", "url": "https://sspai.com/post/113605", "summary": "如果你想买一辆能够长期持有、同时又足够「正常 <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
