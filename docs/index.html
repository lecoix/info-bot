留最新一代芯片用于内部训练。此举有望把市场对Meta“高资本开支、收入回报有限”的担忧，转向对其新增高利润收入选择权的重估。按德银测算，Meta到2027年底AI相关算力可能达到8至11.5GW，其中可对外出售容量约1.2至2.7GW；假设75%实现销售、每GW年化收入100亿至150亿美元，Meta 2027年可新增收入90亿至300亿美元，较市场预期收入高3%至10%，基准情景约175亿美元。（财联社）</p>\n  <p><strong>东岳硅材：上半年净利润同比预增904.88%—952.28%</strong></p>\n  <p>36氪获悉，东岳硅材发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股 东的净利润为4.24亿元—4.44亿元，比上年同期增长904.88%—952.28%。</p>\n  <p><strong>圣诺生物：控股股东拟4000万—5000万元增持公司股份</strong></p>\n  <p>36氪获悉，圣诺生物公告，控股股东四川赛诺投资有限公司计划4000万元—5000万元增持公司股份，中国银行股份有限公司四川省分行已向赛诺投资出具《贷款承诺函》，同意为赛诺投资增持公司股票提供专项贷款，贷款金额最高不超过4500万元，期限3年。</p>\n  <p><strong>中金岭南：上半年净利润同比预增87.89%—114.73%</strong></p>\n  <p>36氪获悉，中金岭南发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股东的净利润为10.5亿元—12亿元，同比增长87.89%—114.73%。</p>\n  <p><strong>金龙鱼旗下富裕生物科技公司增资至25.6亿，增幅约33%</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，益海嘉里（富裕）生物科技有限公司发生工商变更，注册资本由19.25亿人民币增至25.6亿人民币，增幅约33%。该公司成立于2018年4月，法定代表人为陈学松，经营范围包括粮食收购、粮油仓储服务、谷物销售、饲料原料销售等，由益海嘉里金龙鱼食品集团股份有限公司全资持股。</p>\n  <p><strong>韩华集团计划到2040年在航空航天和AI领域投资55万亿韩元</strong></p>\n  <p>韩国最大的国防和航空航天企业韩华集团周五表示，计划到2040年在航空航天和人工智能 （AI） 领域投资55万亿韩元（约合356 亿美元），用于开发运载火箭、卫星和AI数据中心。（新浪财经）</p>\n  <p><strong>FF洛杉矶总部人去楼空？公司回应：不实</strong></p>\n  <p>7月3日，法拉第未来发布声明称， 公司日前关注到近部分网络平台流传所谓“FF洛杉矶总部人去楼空”等不实信息。FF位于汉福德的工厂并未关闭，此次系全球总部正常搬迁至洛杉矶硅滩（El Segundo）。网传视频所拍摄地点为FF曾经位于Gardena市的旧总部，今年3月底开始不再由FF使用。所谓“FF洛杉矶总部人去楼空”的说法具有严重误导性，属于对公司正常办公地点搬迁事实的恶意歪曲。（界面）</p>\n  <p><strong>苹果iOS 27 Beta版操作系统最新SDK包括Apple智能功能</strong></p>\n  <p>36氪获悉，苹果开发者微信公众号发文宣布，iOS 27 Beta版操作系统现可下载。最新SDK带来新功能，包括平台设计优化、Apple智能功能，以及新的AI开发框架。</p>\n  <p><strong>西贝餐饮集团退出小女当家</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，深圳小女当家企业管理有限公司发生工商变更，原股东内蒙古西贝餐饮集团有限公司退出，新增广州品芯悦谷企业管理有限公司为股东。该公司成立于2020年4月，法定代表人为罗红勇，注册资本771.6万人民币，经营范围包括餐饮管理、餐饮咨询服务等，现由深圳市大罗企业管理有限公司、宁波普师企业管理咨询有限公司及上述新增股东共同持股。</p>\n  <p><strong>阿里云宣布AI原生数据库服务产品Databridge Agent功能收费</strong></p>\n  <p>36氪获悉，阿里云官网显示，AI原生数据库服务产品Databridge Agent将于2026年8月1日正式转商业化计费。</p>\n  <h2>投融资：</h2>\n  <p><strong>星河动力增资至5.2亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，北京星河动力航天科技股份有限公司发生工商变更，注册资本由约4.3亿人民币增至约5.2亿人民币，增幅约21%。该公司成立于2018年2月，法定代表人为刘百奇，经营范围包括航空航天的技术开发、技术转让、技术咨询、技术服务等，由北京至远探索管理咨询中心（有限合伙）、刘百奇、刘建设等共同持股。</p>\n  <p><strong>“格式塔科技”完成4.2亿元天使+轮融资</strong></p>\n  <p>36氪获悉，“格式塔科技（Gestala）”宣布完成4.2亿元人民币天使+轮融资。本轮融资由华映资本领投，C资本、红杉中国、蓝思科技、中电健康基金、创新工场、临港科创投资、复旦复容资本、国泰创投等多家国内外头部投资机构跟投。道彤投资、云时资本、清松资本、戈壁创投等老股东持续超额加码认购。华兴资本担任独家财务顾问。</p>\n  <h2>新产品：</h2>\n  <p><strong>xTool O1 UV打印机正式发布</strong></p>\n  <p>36氪获悉，近日，xTool在德国柏林举办欧洲品牌发布会，正式向全球推出xTool O1 UV打印机。O1将UV、DTF、DTG、UV DTF四种打印能力整合进一台设备，覆盖木材、金属、亚克力、玻璃、石材、织物、皮革等多种材料。此外，xTool还推出了Atomm创作者平台，并通过AImake等AI工具，帮助用户完成从想法到设计、从设计到制作的转化。</p>\n  <p><strong>Github Copilot接入开源模型Kimi K2.7</strong></p>\n  <p>36氪获悉，月之暗面宣布，Github Copilot接入第一个开源模型Kimi K2.7。 ​​​</p>\n  <p><strong>小鹏MONA L03预售开启</strong></p>\n  <p>36氪获悉，7月2日晚，小鹏MONA L03预售开启，并将于7月16日德国慕尼黑全球上市。</p>\n  <h2>今日观点：</h2>\n  <p><strong>腾讯龙虾QClaw产品经理张舒昱离职，称内部并无“赛马”</strong></p>\n  <p>7月2日，有消息称腾讯QClaw负责人张舒昱已离职。记者关注到，张舒昱本人在社交平台上发帖称，自己已于6月29日从腾讯离职。她还回顾了自己第一次做C端产品QClaw的历程，并提到“QC和WB是同一个老板，部分时间增长团队都是同一批人组成”，以此澄清腾讯内部QClaw和workbuddy从来没有“赛马”。记者就此向腾讯方面求证，截至发稿尚无回应。另有知情人士向南都记者表示，张舒昱为QClaw产品经理。（南方都市报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>央行等部门就《金融业网络安全管理办法（征求意见稿）》公开征求意见</strong></p>\n  <p>36氪获悉，据央行网站，为进一步规范金融业网络安全管理，中国人民银行、国家金融监督管理总局、中国证券监督管理委员会、国家外汇管理局联合起草了《金融业网络安全管理办法（征求意见稿）》，现面向社会公开征求意见。</p>\n  <p><strong>国务院：加强海上风电、油气等开发建设活动监管</strong></p>\n  <p>36氪获悉，国务院印发《美丽中国建设“十五五”规划》，其中提到，深化海洋生态环境保护。健全陆海统筹、近远海协调联动的海洋生态环境保护格局。划定国家生态环境治理重点海域及其控制区域、省级重点海域范围，实施综合治理攻坚。深化陆源污染治理与管控，加强海洋垃圾清理和资源化利用，基本完成重点海域入海排污口排查整治。强化海水养殖环境整治与监管，提升海水浴场等亲海区域环境品质。加强海上风电、油气等开发建设活动监管。有序推进海洋生态环境综合调查，开展典型海洋生态系统保护修复及成效评估，加强重要海洋物种及其栖息地保护与监管。推进潮白河—渤海湾、九龙江—厦门湾等从山顶到海洋保护治理机制创新。</p>", "category": "tech", "published_at": "2026-07-03T10:55:45+00:00", "fetched_at": "2026-07-04T02:30:43.353957+00:00", "fingerprint": "65b10e1e648b9da2"}, {"source": "36氪 - 最新文章", "title": "秋声 | 袁进辉新公司冲港股IPO，成立不到三年", "url": "https://36kr.com/p/3879814941437956?f=rss", "summary": "<p>本文约2700字，建议阅读6分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>AI大爆发之际，越来越多公司走向资本市场。每一份招股书翻动的声音里，都藏着一家公司想说与未曾明说的全部。</p>\n   <p>鉴于此，硬氪特推出「秋声」专栏。秋声取自欧阳修《秋声赋》，借“听秋声”之意，产业冷暖，辨公司成色，记录企业冲刺IPO途中那些被写下与被隐藏的真实。这是我们第七期，硅基流动。</p>\n  </blockquote>\n  <p>Q2的最后一天，硅基流动向港交所递交了上市申请，此次IPO是以18C未商业化公司身份申报。<strong>联席保荐人为华泰与海通国际</strong>。</p>\n  <p>如果你在AI开发者圈子，硅基流动（SiliconFlow）这个名字不会陌生。它就是那个在DeepSeek爆火时，第一个把R1/V3部署到国产芯片上跑token服务的平台。它的招股书数据也确实炸裂：注册用户两年多冲破1000万、2024年12月至2026年4月的日均token吞吐量增长12倍、付费客户一年涨292倍，估值两年半更是飙到77亿。</p>\n  <p>但硬氪翻遍347页招股书后，会发现一个华丽增长曲线背后的冷峻事实：<strong>硅基流动在亏本卖token，2025年毛利率是−24%。</strong></p>\n  <p>硅基流动于2023年8月成立，至今未满三年，招股书称是中国领先的开放、独立<strong>词元（token）供应平台。</strong>本质是AI推理基础设施公司。它把英伟达、AMD，以及昇腾、沐曦、摩尔线程等异构算力聚合起来，用自研推理引擎和算力编排系统，把底层算力翻译成标准化的token供应，通过公有云服务（无服务器token服务+专属实例）和本地部署解决方案两条线交付。</p>\n  <p>按第三方口径，按2025年token年吞吐量计，它是<strong>中国最大的独立生态token供应商、所有token供应商中位列前五</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_3e9ef59cd2444250a67b7714f51d40b7@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>一门卖1元钱token、成本1.24元的生意</strong></h2>\n  <p>硅基流动的收入曲线极其陡峭：2023年成立前4个月，收入仅6000元，2024年734.6万元，2025年<strong>5533.0万元</strong>。一年增长逾七倍，但收入之下的成本结构，才是这门生意真相。</p>\n  <p>看毛利率的三年轨迹：2023年<strong>83.3%</strong>，2024年<strong>39.4%，</strong>2025年<strong>−24.0%</strong>。2025年，硅基流动的销售成本高达6863.2万元，是当年收入5533万元的<strong>124.0%</strong>。换句话说，<strong>它每卖出一块钱的token，背后的算力等成本要花1.24元，毛利直接为负，当年毛亏1330.2万元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_7cef20b6deb947eea142ccedb15a3ce4@430412560_oswg178013oswg1080oswg561_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_86d838a9bc904c3eb5bf72f5b194a948@430412560_oswg126593oswg1080oswg460_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这是当前AI推理token价格战的直接投影。大模型API价格一路血洗、大厂把token单价打到地板。硅基流动作为中间层，其成本压力主要来自算力租赁。2025年，算力资源成本5962.7万元，占销售成本86.9%。招股书也提到，2025年销售成本大增正是快速扩大算力资源消耗以支持不断增长的服务需求所致。</p>\n  <p>另外两条费用线中：</p>\n  <p><strong>研发开支2025年2.09亿元，是当年收入的378.1%</strong>；三年研发累计2.84亿（2023年1084万→2024年6448万→2025年2.09亿）。</p>\n  <p><strong>销售及营销开支2025年8374.3万元，是收入的151.4%</strong>。</p>\n  <p>收入5533万，光研发加销售两项就烧掉近3亿。于是2023-2025年净亏损为 1222.3 万、8191.5 万、<strong>3.45 亿元</strong>，2025 年净亏损率 −624.4%，每股亏损 33.33 元。即便按经调整口径，加回股份支付 1.35亿 + 赎回负债利息 2307.6 万，2025 年经调整净亏损仍达<strong>1.871亿元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_4bc28488e0de461ebb5c07111835a9a8@430412560_oswg166586oswg1080oswg569_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>经营活动现金流连续三年更是净流出，2025 年经营性现金净流出 1.72亿元。好消息是它有七轮融资，2025 年末现金及等价物 1.71 亿、另有 1 亿定期存款。</p>\n  <p>在2025 年收入结构中，公有云服务 2926.1 万元，占比52.9%。其中无服务器词元服务 1430 万 、专属实例 1500 万；本地部署解决方案 2606.9 万元，占比47.1%。即一边走开发者和中小企业的规模化流量，另一边走大企业和机构的高客单项目。</p>\n  <p>其中<strong>无服务器付费客户</strong>，从2455 到71.6万，<strong>增约 292 倍</strong>。已服务 1.3万企业客户、平台累计支持 170+ 模型。无服务器活跃用户2025年为545.3万，2026年前4个月为145.4万。2024年至2025年，专属实例客户由7家增至49家，2026年前4个月为20家；本地部署客户由28家降至20家，2026年前4个月分别为5家，但单客户收入大幅提升。</p>\n  <p>但硅基流动并非直接购买芯片，而主要通过合作方租赁算力资源。招股书募资用途里，多个大项都写明资金将用于<strong>租赁算力资源。</strong>其五大供应商（算力及云服务商）采购集中度高，2025 年五大供应商占采购额 70.8%、最大单一供应商 20.4%。此外，<strong>有两名主要业务伙伴同时是客户又是供应商</strong>。</p>\n  <p>在风险提示里，硅基流动表示<strong>在很大程度上依赖高质量开源 AI 模型的可得性</strong>。一旦模型停止开源、或授权条件生变，它的核心供给就会受冲击。</p>\n  <p>如果只看运营数据，硅基流动增长很快。2024年末、2025年末及2026年4月底，其注册用户数分别为12.7万、919.7万、1028.2万；从2024年12月至2026年4月，其日均词元吞吐量约增长12倍；其中2024年至2025年增长241.1%，2025年12月至2026年4月进一步增长254.7%。</p>\n  <p>但这些流量，最终在2025年只兑换出5533万元收入，而且是负毛利兑换。2025年，硅基流动销售成本达6863.2万元，占收入124.0%，整体毛损率为24.0%。用户、吞吐与付费客户的爆炸增长，和微薄且负毛利的变现之间，横着一道巨大的鸿沟。</p>\n  <p>招股书亦坦承，无服务器token服务面向开发者与中小企业、多为预付低价消耗，这类流量规模大、单价低、还要贴着成本甚至低于成本供给。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_3e5126a4ddd346529781e68f66e1ffd9@430412560_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>七轮融资，估值从2.8亿飙到77亿</strong></h2>\n  <p>硅基流动从2023年12月至2026年6月，<strong>两年半融资七轮</strong>（天使、天使+、Pre-A、A、A+、B、B+）。事实上，其融资款净额<strong>仅动用约32%</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_f02b7f919de24fc08bdd644d1026d7a3@430412560_oswg23095oswg790oswg428_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>投后估值从天使轮的 2.8 亿元，飙到 B+ 轮的 77.40 亿元。两年半涨 27.6 倍，每股成本涨 13.4 倍。</strong></p>\n  <p><strong>仅在2026年，硅基流动就完成了三轮，从A+轮的31亿元、涨到B轮的50亿，再到B+轮。值得一提的是，B+ 轮就在递表前一个月刚完成。按 B+ 投后 77.4 亿元人民币测算约合 84 亿港元，刚好踩在 18C未商业化公司上市门槛上。</strong></p>\n  <p>股东结构中，<strong>控股股东为袁进辉，直接持 14.35%。再通过员工激励平台</strong>（硅基创新/未来/探索各 7.85% + 硅基卓越 6.59%），合计控制约<strong>44.48%</strong>投票权；<strong>阿里巴巴持股 7.42%</strong>，派驻董事陈英杰；华为持股<strong>4.07%</strong>；<strong>创新工场持股4.01%</strong>；苏州耀途（耀途资本，半导体 VC）持股3.01%；南京绿涌持股3.01%<strong>；王慧文持股2.06%；</strong>普华基金持股1.81%；国泰君安持股 1.56%；<strong>商汤0.64%、壁仞0.39%</strong>、金蝶、美团。</p>\n  <p>创始人<strong>袁进辉，今年45岁</strong>，清华大学计算机博士、西安电子科技大学本科。从OneFlow到SiliconFlow，一人身兼多职：<strong>董事会主席、CEO、总经理兼财务负责人</strong>。袁进辉是 AI 老兵。2013–2016 年任微软（中国）主管研究员，主导开发过当时全球最快的大规模主题模型训练系统 LightLDA；2017–2023 年创立并主导<strong>深度学习框架公司OneFlow（一流科技），</strong>后被王慧文创立的光年之外收购，最终并入美团。2023 年 8 月，他带着 OneFlow 的核心班底转身做了硅基流动——CTO 柳俊丞、COO 赵震均为 OneFlow 旧部，副总经理曾华则来自京东集团副总裁。</p>\n  <p>非执行董事<strong>陈英杰，49岁，为阿里战略投资部董事总经理</strong>，同时兼任 MiniMax 非执行董事。</p>\n  <p>硅基流动的故事，是一支 OneFlow 老兵带队、踩中 AI 推理与 token 革命大浪潮的超级增长团队。但<strong>2025年在亏本卖token、毛利率−24%（销售成本达收入124%）</strong>；研发烧掉收入的378%、销售烧掉151%；收入5533万却亏3.46亿。IPO后究竟值多少钱，只有招股阶段才知道了。</p>\n  <p><strong>首页图源｜企业官网</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>", "category": "tech", "published_at": "2026-07-03T11:12:32+00:00", "fetched_at": "2026-07-04T02:30:43.353951+00:00", "fingerprint": "e726efa738e4a1a1"}, {"source": "36氪 - 最新文章", "title": "400家starup聚集、阿斯利康重押13亿欧元，创新药出海欧洲绕不开这座城｜最前线", "url": "https://36kr.com/p/3879807100023040?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>2026年6月底，西班牙瓦尔德希伯伦大学医院（Vall d’Hebron University Hospital）宣布完成欧洲首例单孔机器人儿科肾输尿管切除术。</p>\n  <p>瓦尔德希伯伦大学医院是西班牙规模最大的综合医院之一，年接诊量过百万人次，在整个欧洲医疗系统内，这家医院对前沿医疗技术、产品的探索都称得上“先锋”。此前，世界首例供体来自安乐死患者的面部移植手术就在这里完成。</p>\n  <p>本次，医院方面对36氪表示，支持完成这场“有里程碑意义的儿科手术”的核心设备，来自中国手术机器人公司术锐机器人。这是瓦尔德希伯伦大学医院首次以直销形式采购中国医疗器械，落地后，预计每年可为医院新增200-300台微创机器人手术，成为打通中国高端医疗器械进入欧洲临床场景的关键通道。</p>\n  <p>一台手术机器人的落地，其实只是中、西生命健康产业深度交融的缩影。</p>\n  <p>在地中海沿岸的巴塞罗那，这座曾以高迪建筑、港口航运和汽车产业闻名的城市，早已成长为欧洲第四大生命科学创新高地。</p>\n  <p>近期，受西班牙加泰罗尼亚贸易投资局（Catalonia Trade &amp; Investment）邀请，36氪实地走访加泰罗尼亚首府巴塞罗那地区的生物医药产业园区、头部药企研发中心，试图还原这片地中海沿岸土地上正在发生的产业变革。</p>\n  <h2><strong>产业生态成型：</strong></h2>\n  <h2><strong>加泰罗尼亚打造欧洲生命科学创新沃土</strong></h2>\n  <p>Jaume Baró是加泰罗尼亚政府企业与竞争力秘书长兼贸易投资局局长（Secretary of Business and Labor），他提供的一组数据显示：当前，区域内共有1523家生命科学相关企业，吸纳就业人口占当地总人口的7.3%、GDP贡献值为4.1%；对外出口则稳居西班牙首位，全国46%的医药产品出口由加泰罗尼亚完成。2024年，医药品类贡献了近九成本地出口总额。</p>\n  <p>从外商投资角度，2020-2024年五年间，当地生命健康产业的外商直接投资总额达22.8亿欧元，落地46个外资项目、创造6050个优质岗位，全西班牙“一半以上的生命科学外资全部流向加泰罗尼亚”。</p>\n  <p>深究起来，加泰罗尼亚生命科学产业之所以能在南欧脱颖而出，持续吸引全球制药企业“重仓”，核心在于以巴塞罗那生命科学园（Parc Científic de Barcelona，PCB）为核心枢纽，搭建起的产、学、研、医、资一体化的闭环生态。这套成熟的资源串联机制，既源源不断孵化本土创新企业，也为外来投资者提供了难以快速复制的发展土壤。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_dfe62d284e544984aa88a9c33c6a9cc0@5930287_oswg6647055oswg5712oswg4284_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">巴塞罗那生命科学园（PCB）园区规划示意</p>\n  <p>PCB成立于1997年，是西班牙首个专业生命科学科技园。当前，园区已打通医疗实验室与临床端资源通道，实现基础科研、临床验证和产业转化无缝衔接，形成一套可持续的创新循环：科研人员依托高校实验室产出前沿技术，依托园区共享平台完成早期验证，再借助本地海量多中心临床资源完成人体试验，最终孵化商业化企业。</p>\n  <p>可作为佐证的一组数字是：由加泰罗尼亚政府与巴塞罗那市政府联合创建的本土公私合营基金会Biocat统计显示，2015-2025年十年间，加泰罗尼亚生命健康领域已诞生超过400家初创公司。另据了解，全西班牙九成以上的临床试验，都是在加泰罗尼亚完成的。</p>\n  <p>PCB市场营销与传播总监Grisha Domakowski介绍，当前，这套生态已跑出成熟范本。比如，从事基因疗法开发的SpliceBio就曾入驻PCB园区，其核心管线SB-007是一款针对遗传性视网膜退行性疾病的基因疗法，已进入临床研究阶段。2025年6月，SpliceBio曾完成一笔1.35亿美元的B轮融资，创下加泰罗尼亚生命科学领域单轮融资纪录。</p>\n  <p>与此同时，PCB完善的资源串联能力，也是海外制药企业在此布局的核心原因。Jaume Baró提到，海外生命科学企业选择在此落地的核心动因里，产业集群、科创资源各占40%。而 PCB正是集群与科创资源的核心载体，跨国企业无需从零搭建完整研发配套，入驻即可对接高校博士人才库、第三方CRO，甚至是产业资本、知识产权服务机构等，大幅缩短研发落地周期。</p>\n  <p>以英国制药巨头阿斯利康在当地的布局为例。2020年，阿斯利康选址巴塞罗那打造全球生物医药创新中心，计划到2027年时总计再次投资13亿欧元。自2023年投入运营以来，该中心已开展接近400个研发项目和190项临床试验，覆盖肿瘤、心血管、罕见病等疾病领域。</p>\n  <p>除此之外，日本AGC Pharma Cheminaik、东和制药、美国远程医疗企业Teladoc Health等也已相继在加泰罗尼亚落地，累计投资数亿欧元、创造数千高端产业岗位。</p>\n  <p>Jaume Baró认为，这种“临床、科研、产业、资本”打通的竞争力，使得头部医疗机构、科研中心、活跃的初创生态和成熟制药企业之间相互赋能，天然成为全球创新企业进入欧洲的门户。</p>\n  <h2><strong>引进到共创，</strong></h2>\n  <h2><strong>中西生命科学合作步入深水区</strong></h2>\n  <p>当一个区域的产业生态走向成熟，其目光必然向外延伸，即寻找新的技术源头、拓展更大的市场腹地。加泰罗尼亚生命科学产业的演进轨迹也遵循了这一逻辑。过去十年间，这个地中海产业集群完成了从内部积累到外部链接的跃迁。</p>\n  <p>而中国创新力量的崛起，恰好与这一需求形成了互补。</p>\n  <p>这种互补，根植于两个医疗体系各自禀赋的深层差异。瓦尔德希伯伦大学医院院长lbert Salazar认为，中欧医疗体系架构存在差异，但“双方均拥有值得互相借鉴的成熟经验”。</p>\n  <p>“中国在AI技术落地、数字健康平台、远程医疗、超大人口体量医疗服务管理等领域展现出极强的落地能力，欧洲医疗机构可以向其学习数字化转型推进速度、医疗技术规模化普及等方面的落地经验。而欧洲医疗体系的优势则在于一体化公立医疗体系、循证医学体系、临床治理规范等方面。因此，双方合作最大机遇在于优势互补：欧洲对外输出临床验证、医疗质控相关经验，中国则具备技术规模化落地、创新产业生态、工业化发展的突出能力。”lbert Salazar表示。</p>\n  <p>如今，这一判断正在被越来越多的实际合作印证。</p>\n  <p>伴随着中国本土创新药产业逐渐完成从\"跟随式仿制\"到\"源头式创新\"的跨越，为自研新药寻找能够合作开发全球市场的欧美制药公司，成为中国创新药企近两年的核心任务。2025年，中国创新药BD出海总金额基数已达到1300亿美元。某种程度上，这一角色转换从根本上重塑了中国与欧美企业的合作内涵。</p>\n  <p>有关注中国创新药企出海的FA人士观察到，此前，欧洲很多药企对中国市场的布局虽很早，但风格偏保守，实际合作不如中、美药企业频繁。但自2025年开始，欧洲部分制药公司从C level层面开始，对“了解中国市场的诉求变得格外强烈，哪怕仅是出于个人职业发展的角度”。</p>\n  <p>在加泰罗尼亚，本土企业同样在调整姿态。今年3月，老牌皮肤病龙头制药公司阿尔米拉（Almirall,ALM）正式在上海设立办公室，负责在中国挖掘合适创新药项目、搭建合作关系。阿尔米拉首席科学官Karl Ziegelbauer向36氪表示，中国市场是公司的“补充性布局”，旨在依托各类合作拓宽创新研发边界。</p>\n  <p>早在2022年，阿尔米拉就曾与先声药业（02096.HK）达成过合作，共同开发一款治疗斑秃和特应性皮炎的新药，里程碑付款最高达4.92亿美元。今年3月，公司又与华海药业（600521）子公司华奥泰达成全球研究合作及许可协议，共同开发一款早期单抗候选药物，累计付款最高可达3.4亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_1a7bba88d54e4edf89f035fe6100d845@5930287_oswg209005oswg1706oswg1279_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">阿尔米拉（Almirall）研发管线示意</p>\n  <p>Ziegelbauer认为，中国创新企业普遍具备“执行效率高、运营灵活敏捷、创新产业生态高速迭代”的优势。“在上海设立办公室后，我们并不会设定年度交易规模指标，优先考核标准为科研质量与战略匹配度，确保筛选得到的研发资产能够为皮肤病患者带来真正、颠覆性的治疗价值。”</p>\n  <p>“双方的合作早已不局限于商品贸易，开展联合创新项目、产业合作、技术转让、研发协同、双向投资的案例持续增多。”Jaume Baró如此评价当前合作态势。</p>\n  <h2><strong>中、西生命科学合作的下一程</strong></h2>\n  <p>然而，机遇与挑战并存。</p>\n  <p>“当前，双方在生命科学领域合作上的仍存在挑战，比如各国监管规则繁杂、地缘政治不确定性、文化差异，这要求所有合作方建立互信，保持稳定、树立长期发展视野。”Jaume Baró坦言。</p>\n  <p>整体而言，过去五年间，中国企业在欧洲的国际化布局更多集中在制造业领域，生命科学产业仍处于相对早期阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_a1b65c1b1a9c44ee8cb0e52efe3a6b99@5930287_oswg419041oswg1200oswg800_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">加泰罗尼亚本地工业园区DFactory，已有多家中国医疗器械企业入驻</p>\n  <p>这不仅是因为欧洲市场与中国药品器械监管体系差异显著，跨国临床试验、产品注册流程复杂，拉长项目落地周期，由此抬高了合作成本；同时，生命科学行业准入门槛远高于制造业，难以照搬整车、化工行业独立建厂的模式，企业合资，或开展科研合作因此成为主流，但也容易因为合作权责、知识产权分配易产生分歧。</p>\n  <p>PCB市场、传播与竞争情报部门主管Silvia Labé也提到，园区曾接待过大量来自中国的医药代表团，覆盖政府单位、企业、医疗机构及科研机构等，他们来访的核心诉求大多是学习本地生物医药产业模式、探索合作机会。但有些时候，“代表团参访结束后，难以持续对接、跟进”。“由于资源有限，我们会比较谨慎地选择合作对象。对我们来说，远在欧洲，想全面了解中国当前的生物医药产业变化并不容易。”</p>\n  <p>针对如何深化合作，加泰罗尼亚政府已制定明确策略。Jaume Baró介绍，加泰罗尼亚贸易投资局在上海、北京、香港设立办事处，为有意赴加投资的中国企业提供全流程服务：从协助准备投资申报材料、选址、签证办理、人才招聘到投资落地后的持续跟进。赴加投资的中国企业还可申请专项基金资金扶持。</p>\n  <p>“我们的最终目标，是让加泰罗尼亚成为中国创新技术进入欧洲的核心门户之一，并成为双方企业在技术、产业协同上的可靠合作方。”Jaume Baró表示。</p>", "category": "tech", "published_at": "2026-07-03T12:28:30+00:00", "fetched_at": "2026-07-04T02:30:43.353944+00:00", "fingerprint": "8089d75c214aa477"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 剑桥副教授创业硅光芯片，已合作欧莱雅、华为，获一亿投资", "url": "https://36kr.com/p/3879991356157952?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_7bba92fd871f49ea8ca5e3fcabde20c7@6221844_oswg1504240oswg956oswg895_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，硅基光电子集成芯片研发商光引科技近期已完成1亿元Pre-A轮融资，投资方包括光子强链基金、善达投资、长飞基金、洛阳英才、中科创星、西安财金。资金将主要用于上海新实验室建设、人才招募及量产推进。</p>\n  <p>光引科技2021年成立于徐州，核心团队孵化自英国剑桥大学研发团队。创始人程祺翔为剑桥大学博士、剑桥大学副教授，在光子集成领域深耕超16年，曾就职于华为海思光电团队。公司核心技术团队多名成员来自剑桥大学，硕士/博士占比达66%。</p>\n  <p>据QYResearch数据，2024年全球微型和mini光谱仪市场规模约为4.6亿美元，预计2031年将达8.22亿美元，年复合增长率8.8%，其中芯片型光谱仪占据最大市场份额，主要用于可穿戴设备、相机、智能手机等领域。</p>\n  <p>另据The Business Research Company报告，微型光谱仪市场预计将从2025年的11.8亿美元增长至2030年的21.5亿美元，复合年增长率达12.8%，可穿戴光谱仪应用是主要增长驱动因素之一。</p>\n  <p>光引科技专注于硅基光电子芯片设计及光谱传感解决方案，产品形态为微型化光谱传感模组，可应用于可穿戴设备人体健康检测、医美皮肤检测、工业与食品物质检测等场景。</p>\n  <p>与传统台式光谱仪相比，光引科技将精密光学系统集成至米粒大小的芯片上，采用“计算式光谱仪”技术路线。</p>\n  <p>传统光谱仪依赖棱镜或光栅等物理分光元件，需要精密的光学结构和机械部件，对环境要求苛刻、成本高昂。而计算式光谱仪通过芯片上的采样单元对入射光进行编码，再利用算法从少量测量数据中重建完整光谱信息，从而大幅压缩体积并降低成本。</p>\n  <p>据公司介绍，其光谱芯片波长覆盖范围达600-2500nm，分辨率最高可达0.01nm，尺寸为米粒大小，预估量产后成本可控制在20美元以内。作为对比，目前市面主流光谱模组产品价格多在100-2000美元区间，尺寸从指甲盖到充电器大小不等。</p>\n  <p>光引科技副总裁徐康宁向硬氪表示，公司目前主要客户包括欧莱雅、华为、小米等头部企业，包括与欧莱雅联合开发检测皮肤胶原蛋白含量的设备，与华为、小米等展开电驱动芯片及算法适配合作。此外，在工业领域，公司也与多家酒企合作，利用光谱传感器监控发酵过程中酒精度、淀粉、还原糖等物质变化。</p>\n  <p>近几年，公司预计加速推进产品量产，持续向头部客户送样验证并逐步获得市场认可。</p>\n  <p><strong>以下是硬氪与徐康宁的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：目前产品还没有量产，主要难点是什么？</strong></p>\n  <p><strong>徐康宁：</strong>我们做的光谱传感赛道很特殊，业内没有完全符合我们技术的产业链，包括光源、封装技术、测试设备都没有完全匹配的。我们需要自己去搭建独特的工艺和产线。目前约80%的能力可以在市面上找到供应商覆盖，剩下20%需要我们自己采购设备、培训人员、开发工艺。</p>\n  <p><strong>硬氪：对比现有的PPG（光电脉搏波）方案，公司技术在价格和性能上存在哪些差异？</strong></p>\n  <p><strong>徐康宁：</strong>我们的技术方案对比现有智能手表里的PPG模组，价格大概贵2到5倍，具体取决于测量的指标和应用领域。但我们能测的参数更多，精度更高，是PPG的上位替代。</p>\n  <p>传统的PPG技术主要依赖光电脉搏波信号，能测量的参数局限于心率、血氧等少数指标。而光谱传感可以检测胶原蛋白、血糖、乳酸、酒精等多种生物标志物。我们的目标是把光谱传感器搭载进所有智能手表中，实现“腕上诊所”的愿景。</p>\n  <p><strong>硬氪：公司今年有一个大的战略调整，是计划切入光交换领域吗？</strong></p>\n  <p><strong>徐康宁：</strong>是的。我们的技术基础是硅基光电子，剑桥团队的三大方向分别是光交换、光传感、光计算。公司此前重点在传感领域，从今年开始会着重在上海建立一个团队，去做硅基光电子光交换方向的产品。</p>\n  <p>硅光技术在光通信领域正迎来快速增长，据行业机构预测，硅光技术在光模块市场的份额将从2025年的30%翻倍至2030年的60%。我们的创始人早期多年也在做光交换，这是他非常熟悉的领域，也是公司未来重要的第二增长曲线。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>中科创星观点：</strong>&nbsp;作为光引科技早期的投资方之一，我们从天使轮+起就坚定看好这支团队。一路携手走来，企业成长远超预期，我们对光引的未来充满信心。</p>\n  <p><strong>长飞基金观点：&nbsp;</strong>光引科技在光芯片领域的技术积累与长飞的产业资源高度互补。双方在产业链协同上合作紧密，期待共同推动光通信产业升级。</p>\n  <p><strong>善达投资观点：</strong>很高兴看到徐州本地培育出光引科技这样优秀的硬科技企业。从落地到成长，我们见证了团队扎实的研发能力和执行力，是徐州科创力量的代表。</p>\n  <p><strong>西安财金观点：</strong>光引科技的核心技术壁垒扎实，在光芯片国产化进程中具备关键价值。我们持续看好企业的技术路线，期待其成为行业标杆。</p>\n  <p><strong>光子强链基金观点：</strong>光引科技是光子产业链上的关键一环，其光芯片技术对补链强链具有重要战略价值。我们坚定支持企业突破核心技术，助力国产光子产业自主可控。</p>", "category": "tech", "published_at": "2026-07-04T01:00:00+00:00", "fetched_at": "2026-07-04T02:30:43.353935+00:00", "fingerprint": "ae9874917ff150f8"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜阿里内部全面禁用Claude Code；FF洛杉矶总部人去楼空？公司回应：不实；微软砸25亿美元组建6000人AI新公司", "url": "https://36kr.com/p/3880629882679301?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>三部门：调整节能汽车、新能源汽车车船税优惠政策</li>\n   <li>三星传获Meta超10万亿韩元AI芯片代工订单</li>\n   <li>茉莉奶白小程序更换彩色Logo</li>\n   <li>Meta打算出售富余算力引发科技股回落</li>\n   <li>英伟达前光互连技术高管Ashkan Seyedi加入艾迈斯欧司朗</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>因存在植入后门风险，阿里内部全面禁用Claude Code</strong></p>\n  <p>36氪从阿里内部人士处获悉，因近期Claude Code被曝存在植入后门的安全风险，阿里经综合评估后已将其列入高风险软件名单。自7月10日起，阿里将全面禁止内部员工在办公环境下使用Claude Code，并推荐使用Qoder作为替代方案。</p>\n  <p><strong>FF洛杉矶总部人去楼空？公司回应：不实</strong></p>\n  <p>7月3日，法拉第未来发布声明称，公司日前关注到近部分网络平台流传所谓“FF洛杉矶总部人去楼空”等不实信息。FF位于汉福德的工厂并未关闭，此次系全球总部正常搬迁至洛杉矶硅滩（El Segundo）。网传视频所拍摄地点为FF曾经位于Gardena市的旧总部，今年3月底开始不再由FF使用。所谓“FF洛杉矶总部人去楼空”的说法具有严重误导性，属于对公司正常办公地点搬迁事实的恶意歪曲。（界面新闻）</p>\n  <p><strong>微软砸25亿美元组建6000人AI新公司</strong></p>\n  <p>当地时间7月2日，微软宣布成立全新运营实体——微软前沿公司（Microsoft Frontier Company）。该业务依托微软现有人工智能工具，主要为企业客户落地有成效的人工智能部署项目。微软将为该项目投入25亿美元资金，并配备6000名行业专家与工程技术人员。据微软商业业务总裁贾德森·阿尔托夫（Judson Althoff）介绍，这项业务远超所谓前沿部署工程（FDE）的范畴，将打造业内规模最大、综合实力最强、以业务成果为核心导向的工程团队。</p>\n  <p>该部门将整合微软现有的FDE工程师、技术顾问、支持人员以及具备行业经验的销售团队。新公司将为客户提供AI技术选型与系统集成服务，涵盖微软自有模型及外部模型，并与企业自身的专有数据进行深度结合。客户将保留所有成果与开发成果的所有权，无需将结果回传给微软。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Github Copilot接入开源模型Kimi K2.7</strong></p>\n  <p>36氪获悉，月之暗面宣布，Github Copilot接入第一个开源模型Kimi K2.7。</p>\n  <p><strong>阿里云宣布AI原生数据库服务产品Databridge Agent功能收费</strong></p>\n  <p>36氪获悉，阿里云官网显示，AI原生数据库服务产品Databridge Agent将于2026年8月1日正式转商业化计费。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>国家发改委：自7月3日24时起，国内汽、柴油（标准品）价格每吨分别下调950元、915元</strong></p>\n  <p>36氪获悉，据国家发改委，6月18日国内成品油价格调整以来，国际市场原油价格快速回落后小幅波动运行，本次调价的前10个工作日平均价格低于上次调价前10个工作日平均价格。根据国际市场油价变化情况，自7月3日24时起，国内汽、柴油（标准品）价格每吨分别下调950元、915元。</p>\n  <p><strong>多家品牌金饰价格大涨，周生生克价1266元</strong></p>\n  <p>7月3日，国内黄金饰品价格对比显示，多家黄金珠宝品牌公布的境内足金首饰价格较2日有所上调，老凤祥报价1260元/克，较前一日1230元/克涨30元；周生生报价1266元/克，较前一日1236元/克涨30元；周大福报价1262元/克，较前一日1233元涨29元；老庙黄金报价1261元/克，较前一日1235元/克涨26元。（界面新闻）</p>\n  <p><strong>三星传获Meta超10万亿韩元AI芯片代工订单，2纳米中长期积压订单看涨</strong></p>\n  <p>7月3日，据报道，三星电子正成为全球大科技公司自研AI芯片（ASIC）的核心生产基地，其中长期积压订单有望逼近50万亿韩元。Meta正推进与三星晶圆代工合作设计并生产价值超10万亿韩元的下一代ASIC。其自研AI加速器“MTIA”已锁定三星为合作伙伴，计划采用2纳米尖端工艺量产数十万组。同时，美国AI巨头Anthropic也在评估使用其2纳米工艺开发芯片。（界面新闻）</p>\n  <p><strong>国家金融监督管理总局决定对众邦银行实施接管</strong></p>\n  <p>国家金融监督管理总局、湖北省人民政府关于对武汉众邦银行股份有限公司实施接管的公告。鉴于武汉众邦银行股份有限公司（以下简称众邦银行）出现严重信用风险，为保护存款人和其他客户的合法权益，依照《中华人民共和国银行业监督管理法》和《中华人民共和国商业银行法》有关规定，国家金融监督管理总局决定对众邦银行实施接管。（央视新闻）</p>\n  <p><strong>三部门：调整节能汽车、新能源汽车车船税优惠政策</strong></p>\n  <p>36氪获悉，财政部、税务总局、工业和信息化部发布关于调整节能汽车、新能源汽车车船税优惠政策的公告。自2027年1月1日起，取消对节能汽车减半征收车船税政策，取消对纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车免征车船税政策；纳税人新取得及本公告实施前已取得的上述类型车辆，应按照《中华人民共和国车船税法》及其实施条例和其他相关规定征收车船税。</p>\n  <p><strong>科技板块遭遇深度调整，机构建议聚焦细分龙头</strong></p>\n  <p>7月2日，A股市场迎来大幅调整。分析人士认为，本轮调整并非基本面逻辑的逆转，而是上半年科技板块极致分化行情下交易拥挤、筹码结构脆弱等风险因素的集中释放。经历半年大幅上涨后，部分高位品种估值与预期透支较为严重，短期回调具有一定的合理性。但从中长期维度来看，AI产业趋势并未改变，机构普遍建议投资者在调整过程中保持定力，关注具备核心竞争力的细分龙头，同时适度配置高股息资产以平滑组合波动。（中证网）</p>\n  <p><strong>茉莉奶白小程序更换彩色Logo，此前被判赔LV超千万元</strong></p>\n  <p>因商标侵权纠纷一审被判向LV赔偿1000万元后，茉莉奶白更换头像的消息引发关注。7月2日晚上，茉莉奶白小程序会员中心原本黑色的Logo换成了彩色Logo，相关话题也冲上社交平台热搜。7月3日，记者就“换Logo是否与LV诉讼一事有关”的问题咨询茉莉奶白客服，工作人员对界面新闻表示：“抱歉给您添麻烦了，我司将依法提起上诉，未来我们将持续专注品质与服务，不负信任。”（界面新闻）</p>\n  <p><strong>腾讯游戏暑期未保行动：每周限玩3小时</strong></p>\n  <p>36氪获悉，7月3日，腾讯游戏发布“2026年暑期未成年人保护专项行动”，每周限玩3小时，升级“AI双引擎防沉迷”模式：游戏外，成长守护焕新AI版本，接入腾讯混元与DeepSeek双模型，家长可通过对话式交互完成信息查询与账号管控，提升管理便捷度；游戏内，健康系统推出AI巡航功能，内置“AI守卫”，基于玩家行为进行动态风险分级，并在人脸识别基础上，新增声纹检测、年龄识别等多模态验证，实现全链路干预，提高冒用、代过门槛。</p>\n  <p><strong>关停“杠杆炒金”通道，银行拧紧个人贵金属业务风险阀门</strong></p>\n  <p>6月以来，包括交通银行、招商银行、工商银行在内的多家国有大行、股份制银行密集“踩刹车”——宣布将于7月停办代理上海黄金交易所个人贵金属交易业务。在业内人士看来，这是银行主动进行风险管理的举措，通过提前压缩高风险投机业务，防范极端行情下的客户违约风险、声誉风险，同时帮助投资者规避贵金属价格波动带来的资金损失。（中证网）</p>\n  <p><strong>Meta打算出售富余算力引发科技股回落，业内人士：算力租赁市场并未降温</strong></p>\n  <p>科技巨头Meta（脸书）打算出售富余算力的消息，引发AI算力过剩恐慌，全球科技股普遍回落，A股存储、光模块、PCB（印制电路板）、MLCC（多层片式陶瓷电容器）等热门科技股纷纷下跌。与此同时，作为算力产业链上游链主，英伟达推出新型AI基础设施合作模式，计划通过收入分成和信用支持的合作模式，向快速增长的AI生态系统开放计算资源。有从业者表示，当前算力租赁市场并未降温，在手订单充沛。（证券时报）</p>\n  <p><strong>阿里云发布Qoder企业版</strong></p>\n  <p>36氪获悉，阿里云发布Qoder企业版，为企业提供个人云端知识库QMind，支持跨产品、跨设备、跨人员的知识共享。同时推出资源池化的Credits付费模式，企业管理员可按需为成员动态分配额度。</p>\n  <p><strong>华谊兄弟电影公司被执行1406万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，华谊兄弟电影有限公司新增三则被执行人信息，执行标的合计1406万余元，执行法院均为北京市朝阳区人民法院。该公司成立于2015年12月，法定代表人为王忠磊，注册资本1亿人民币，经营范围包括电影、网络剧制作、发行等，由华谊兄弟传媒股份有限公司全资持股。</p>\n  <p><strong>曝特斯拉限流AI开支</strong></p>\n  <p>北京时间7月3日凌晨，The Information援引特斯拉内部备忘录消息称，特斯拉将从7月6日起，把每名员工使用AI的费用限制在每周200美元（现汇率约合1359元人民币）以内。</p>\n  <p>就在几个月前，特斯拉还要求员工更积极地使用AI。政策如此迅速地转向，说明即便企业把未来押注在AI上，也很难控制不断增加的使用成本。多名参与特斯拉AI部署工作的人员称，过去半年，管理层一直在整合员工各自使用的AI工具，要求全公司采用经过批准的模型，并建立统一的安全规范。但统一方案刚刚成形，特斯拉很快又开始限制支出。（新浪科技）</p>\n  <p><strong>Meta低调推出AI社交应用Pocket，主打互动小游戏</strong></p>\n  <p>Meta近期在部分地区悄然上线了一款名为Pocket的人工智能社交应用。该平台允许用户通过输入简单的文字提示词，生成并分享名为“gizmo”的互动式小型游戏。Pocket被定义为一个“与朋友共同创作、分享及探索gizmos”的平台，每个gizmo都是由AI生成、可交互且能直接游玩的趣味内容。（新浪财经）</p>\n  <p><strong>英伟达前光互连技术高管Ashkan Seyedi加入艾迈斯欧司朗，出任光互连业务负责人</strong></p>\n  <p>艾迈斯欧司朗（ams OSRAM）当地时间7月2日宣布，曾任英伟达光互连技术高管的Ashkan Seyedi已正式加入公司，担任光互连业务线副总裁兼总经理，负责推动面向下一代AI数据中心的光互连技术发展。Seyedi此前在英伟达负责光互连技术研发，参与推动面向AI集群和数据中心的高速光通信技术发展。（界面新闻）</p>\n  <p><strong>美国三大蛋企涉价格操纵，同意支付330万美元并捐赠5300万枚鸡蛋以达成和解</strong></p>\n  <p>美国司法部与17个州的总检察长本周与三家全美最大的鸡蛋生产商达成和解协议，以解决它们涉嫌在2022年6月至2025年3月期间串通操纵鸡蛋价格的指控。涉案企业包括卡尔-梅因食品公司、弗索瓦公司和希克曼蛋业。调查发现，三家企业通过私下协调竞标活动，向市场分析机构厄纳-巴里提交数据时谎称存在更大需求，从而人为抬高Urner Barry每日发布的鸡蛋价格基准。Urner Barry的定价指数被广泛应用于全美鸡蛋供应合同，直接影响零售商和消费者支付的鸡蛋价格。（新浪财经）</p>\n  <p><strong>苹果iOS 27 Beta版操作系统最新SDK包括Apple智能功能</strong></p>\n  <p>36氪获悉，苹果开发者微信公众号发文宣布，iOS 27 Beta版操作系统现可下载。最新SDK带来新功能，包括平台设计优化、Apple智能功能，以及新的AI开发框架。</p>\n  <p><strong>黄仁勋穿过的皮夹克将被拍卖</strong></p>\n  <p>7月3日消息，《商业内幕》报道，苏富比拍卖行将于7月7日起，拍卖一件英伟达CEO黄仁勋穿过的黑色皮夹克，最终成交价预计在4万-6万美元（现汇率约合27.2万- 40.8万元人民币）之间。根据鉴定机构给出的信息，这件皮夹克由奢侈品牌Tom Ford打造，黄仁勋本人曾于2023年穿过它。并且，夹克上还带有黄仁勋的亲笔签名。（第一财经）</p>\n  <p><strong>韩国联合三星、SK等企业推出312万亿韩元投资计划，重点布局半导体与航天产业</strong></p>\n  <p>7月3日，韩国副总理兼企划财政部长官具润哲宣布，将推动各大企业在东南部（岭南���区）投资超312万亿韩元（约2040亿美元），以发展先进制造和AI产业。具体规划中，SK集团、三星、韩华及现代汽车将分别注入约140万亿、60万亿、55万亿和42万亿韩元，重点布局半导体、AI和航天等领域；LG与斗山也将跟进投资。此外，韩国还公布了以泗川为核心的国家航天战略，旨在打造南部沿海航天产业带。（界面新闻）</p>\n  <p><strong>欧盟拟出台未成年人社媒禁令</strong></p>\n  <p>“欧洲动态”网站7月2日援引多名欧盟官员的表态披露称，欧盟委员会主席冯德莱恩计划于9月16日在欧洲议会发表年度“盟情咨文”时公布在欧盟范围内禁止未成年人使用社交媒体的计划。一个未成年人上网安全研究咨询小组预计本月13日提交相关报告，为欧委会提供建议。报道说，尚不清楚欧委会将把使用社交媒体的年龄门槛定在多少岁，以及这项计划具体如何落实。（央视新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>应能微电子启动北交所IPO辅导</strong></p>\n  <p>36氪获悉，证监会官网显示，江苏应能微电子股份有限公司已启动上市辅导，拟在北交所上市，辅导机构为申万宏源证券承销保荐有限责任公司。</p>\n  <p><strong>EG集团旗下坎伯兰农场申请美国IPO</strong></p>\n  <p>据报道，EG集团旗下坎伯兰农场申请美国IPO。</p>\n  <h2>投融资</h2>\n  <p><strong>“格式塔科技”完成4.2亿元天使+轮融资</strong></p>\n  <p>36氪获悉，“格式塔科技（Gestala）”宣布完成4.2亿元人民币天使+轮融资。本轮融资由华映资本领投，C资本、红杉中国、蓝思科技、中电健康基金、创新工场、临港科创投资、复旦复容资本、国泰创投等多家国内外头部投资机构跟投。道彤投资、云时资本、清松资本、戈壁创投等老股东持续超额加码认购。华兴资本担任独家财务顾问。</p>\n  <h2>酷产品</h2>\n  <p><strong>小鹏MONA L03预售开启</strong></p>\n  <p>36氪获悉，7月2日晚，小鹏MONA L03预售开启，并将于7月16日德国慕尼黑全球上市。</p>\n  <p><strong>xTool O1 UV打印机正式发布</strong></p>\n  <p>36氪获悉，近日，xTool在德国柏林举办欧洲品牌发布会，正式向全球推出xTool O1 UV打印机。O1将UV、DTF、DTG、UV DTF四种打印能力整合进一台设备，覆盖木材、金属、亚克力、玻璃、石材、织物、皮革等多种材料。此外，xTool还推出了Atomm创作者平台，并通过AImake等AI工具，帮助用户完成从想法到设计、从设计到制作的转化。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-07-04T01:03:44+00:00", "fetched_at": "2026-07-04T02:30:43.353919+00:00", "fingerprint": "98caa9d9cbcf858f"}, {"source": "少数派", "title": "这四个工作习惯，或许也能帮你找到掌控感", "url": "https://sspai.com/post/111708", "summary": "无论你追求的是更高的职位、更自由的时间、还是某种更纯粹的成就感，有一件事大概是共通的：那就是尽量让自己的人生，少一点完全依赖运气的成分，多一点可被掌控、可被验证的路径。<a href=\"https://sspai.com/post/111708\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-03T03:00:00+00:00", "fetched_at": "2026-07-04T02:30:41.348477+00:00", "fingerprint": "e95fe e-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_479f75a076024a17bafa8bcb0cb1a26d@5362858_oswg1152334oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>撰文｜深海</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_66e81b6f11544b53b6d7c7c632c151c1@5362858_oswg4801oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>网文里的“系统流”，被拍成了职场短剧</strong></h2>\n  <p>千禧年初的网文圈，有三大经典题材在爽文届立于不败之地：无限流、快穿流、系统流。</p>\n  <p>这三大爽文战神体横空出世时，对IP界几乎是降维打击。当传统小说还在费劲搭世界观、铺人物成长弧光时，系统流已经绕过漫长的发育过程，直接把爽感推到最大。系统，这个堪称bug的存在，无论主角进入什么样的世界副本，面对不同的任务、危机和奖励，它总会尽职尽责地当好一个无情的辅助工具，记录进度、提示规则、保存道具、结算积分、解锁技能……换句话说，一切琐事都干扰不到主角的成长，主角只管尽情体验人生。</p>\n  <p><strong>20年前这还只是一种遥不可及的畅想，但2026年，这个AI能力超速发展的时代，系统流已经越来越像一种现实剧本。</strong></p>\n  <p>最近，联想天禧AI推出了一部定制短剧《我的AI搭档之“禧”从天降》，拍的就是系统流和现实职场的结合。故事围绕一个职场新人叶天展开。叶天是一个普通打工人，被上司打压、被克扣奖金、被否定能力，职场新人该踩的坑一个没落下。但意外获得天禧AI后，他在一系列职场危机中化险为夷，一路逆袭。</p>\n  <p>这部短剧有种复古的爽感——爽点都是经典桥段：主角受委屈，系统从天而降；反派设局，系统现场拆局；任务压顶，系统直接开工。<strong>只是这一次，网文里的“金手指系统”，变成了以AI Agent为核心能力的天禧AI。</strong></p>\n  <p>故事这样开始。临近下班的叶天像往常一样倒霉，被上司要求当天完成一个全部门三个月都没啃下来的赛事营销方案。情绪崩溃之下，他把手机扔进水杯，没想到手机在水中亮起，天禧AI弹窗出现：“检测到宿主过去一个月内被姚主管说能力不行67次……我将出手。”</p>\n  <p>主角被现实逼得走投无路时，金手指上线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_cca9c0f795f44cf1ac3a4632b40dc648@5362858_oswg623909oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>紧接着，天禧AI扫描了叶天桌面上的方案、赛事集锦、外卖优惠券和工资到账记录，给了他一个基本状态判定：工资不高、任务不少、情绪不稳、离职未遂。叶天的日常事务被系统量化成了可以评判的指标后，系统开始了他的宿主分析，奖金为什么被扣、方案是谁做的……天禧AI调出了他的历史资料、赛事信息和原设计方案草稿后，快速完成了基础方案，再根据公司预算有限、不能大规模铺投放的现实情况，调整成更适合公司的“蹭热点”打法。</p>\n  <p>在这里，短剧制造的爽感不只是简单的“AI替人写PPT”——这功能还停留在初始阶段。系统给叶天的帮助是更高层面的，通过高速整理历史信息、生成框架，系统判断出经常上班看球的叶天，并不是单纯在摸鱼，其实他的大脑已经在进行资料研究，他对营销方案战略的把握和意识都是有积累的。</p>\n  <p><strong>所以，天禧AI并不是抢了主角的风头替他干活，而是帮主角把他已有的潜能引导出来，发挥到最大。系统就是最强辅助。它让被长期打压的叶天知道，他不是无能，而是被低估，从而实现心态到能力上的全方位觉醒。</strong></p>\n  <p>更爽的打脸桥段一个接一个。在汇报现场。叶天展示方案时PPT被人删空，公司又突然断网。上司借机发难指责他没完成工作、上班摸鱼，要求公司开除他。但叶天的“歪嘴龙王”时刻马上来了，天禧随即激活离线守护和企业级私有云备份，在断网情况下帮助叶天现场重建PPT，还根据现场人员状态判断出删文件的犯人。反派本想制造公开羞辱，反而把叶天推上了公开翻盘的舞台。</p>\n  <p>不得不说，很久没看过那么接地气的系统流短剧了。这大概是每个打工人都会做的梦——把“随身系统”塞进自己的现实生活，让这位全能助手帮你识别处境、拆解任务、保存资料、调用工具，关键时刻它会出手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_9e69b3d225574e668ace7575a38d67da@5362858_oswg1047639oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>但，看完短剧观众就会马上意识到，等等，这“系统流”，说的可不就是AI Agent吗？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_33af2161af874091a41ccafb2e45d739@5362858_oswg5678oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>看完短剧你就理解了AI Agent，而且想要一个</strong></h2>\n  <p>看叶天一路开挂爽赢职场，观众很难不冒出一个念头：现实里也能有这样一款AI搭档的话，工作里的破事是不是能少很多？</p>\n  <p>至此《“禧”从天降》高明地完成了种草——它没有上来就给观众解释AI Agent是什么、递上一份科技说明书，而是先让观众跟着叶天体验一遍AI Agent能帮你做什么，包括但不限于被临时派活时帮你速推方案、文件出问题时上云端恢复进度、和客户沟通语言不通时实时翻译、信息过多时把它们分类整理成核心价值判断。</p>\n  <p><strong>这些问题，放在剧情里是爽点；放回现实里，就是普通用户对AI Agent最朴素的期待。</strong></p>\n  <p>过去，“AI Agent”对很多人来说都是一个有点悬浮的技术名词。它听起来很先进，经常出现在行业讨论里，但到底和豆包类的对话型AI有什么区别？我又为什么要装一个放进电脑里？很多用户都没有体感，技术名词一旦离开真实场景，就会变得难以理解。</p>\n  <p><strong>但短剧是天生的情景大师，它给了AI Agent一个非常好的理解入口</strong>：主人公叶天不是技术精英或专业玩家，他就是一个被任务追着跑、被琐事消耗的普通打工人，他用的AI Agent就是联想天禧AI，他在剧里获得的“系统助攻”，也都能在天禧AI的现实能力中找到对应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_41efac0c5aec40cba288be5f6b865e0e@5362858_oswg631035oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>比如，叶天第一次真正用天禧处理工作是在下班前十分钟赶赛事营销方案。剧里，天禧调取了他过去积累的赛事浏览记录、方案草稿和工作痕迹，把这些零散信息重新组织成方案素材。这个情节看着像开挂，本质上讲的却是AI Agent最关键的能力，即理解用户长期积累下来的电子痕迹、习惯偏好和上下文。</p>\n  <p>在真实的办公场景里这是一个非常具体的痛点。一个人写过的Word、看过的PDF、改过的Excel、没来得及整理的PPT、散落在本地文件里的资料，一般时候用户想不起来它们的存在。<strong>平时，它们只是躺在库里的死文件，在AI Agent介入后却可以被盘活，搬进知识库，成为AI Agent理解用户、帮助用户完成任务的素材。</strong></p>\n  <p>再看会议室里的断网反杀。天禧AI在叶天被设局陷害时启动的离线守护和企业级私有云备份，这是AI Agent可以轻易完成的任务，Agent日常就能持续理解任务链路、自动保存文件上云，在日常运行中就把关键文件、任务进度和上下文同步好。天禧Claw强调的零部署、开箱即用、端云协同、多端接力等特性，构成了短剧情节里那个“关键时刻从不掉链子”的强大系统。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4b513e8b0dd440558a497eae003de22f@5362858_oswg457813oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>接下来的剧情也巧妙展示了AI Agent的多功能。剧中叶天被上司质疑英语能力，却能借助天禧的实时同声传译，顺利和跨国项目客户沟通；上司还想进一步陷害叶天，故意在开会时把他叫走，想安个擅离职守的罪名，而天禧AI实时帮叶天生成虚拟影像继续参会，并用AI妙记留下完整会议纪要，帮叶天反手打了上司脸；在为营销方案寻找赛事代言人时，叶天在训练基地偶遇过气球员皮特，也是借助天禧AI调取球员的往期训练和比赛数据，判断出这个老将仍有竞技和传播的价值，最终说服对方为项目代言。</p>\n  <p>这些情节设计对应到真实的AI Agent，就是AI同声传译、AI妙记，以及AI Agent的信息整合判断功能。<strong>如果单独拿出来说，正儿八经的产品介绍大家不想费劲分析，但放进短剧里，它们就变成了观众能立刻理解的职场瞬间。</strong></p>\n  <p>看到一个打工人被AI搭档营救、逆袭翻盘，观众也自然被种草了这款最强帮手——原来，所谓的AI Agent，就是那个靠谱的随身系统“金手指”。一部短剧，用最朴素的方式让观众看明白了AI Agent。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4cac3db44d6545aa8347fffaf19d4537@5362858_oswg512766oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_edd0ed1f1cd54e77985c675c079fdb31@5362858_oswg5664oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>从短剧走出后，天禧AI早在现实里运转起来了</strong></h2>\n  <p>从短剧走出后，回到现实世界的观众会发现，剧里的天禧AI并不只是一个爽剧设定，这个“金手指系统”，已经在现实世界中高效运转起来了。</p>\n  <p><strong>世界杯期间，联想作为本届FIFA世界杯官方技术合作伙伴高频带着天禧AI出镜。</strong>2026 FIFA世界杯开赛前夕，联想在北京开启“2026年FIFA世界杯联想嘉年华”启幕站，围绕混合式AI展示了一系列体育AI方案，并计划通过全国31城活动，把世界杯的技术体验和消费场景推到更多用户面前。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_ddf1f56480234d57b5af0bd4a6e8a058@5362858_oswg149307oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>短剧里的叶天做的是球赛营销策划，现实里，联想也把AI能力真正放进世界杯。天禧AI已经真正走进了专业级别的赛事规划中——<strong>在全球赛事层面，联想面向FIFA打造了世界杯足球AI超级智能体FIFA AI Pro。</strong>它会基于FIFA历史数据和战术分析数据，协调多个智能体，为球队对比、战术调整、球员个性化比赛分析提供支持。</p>\n  <p>联想还展示了3D数字人可视化方案、裁判视角AI视频增强系统等能力。出现复杂判罚时，联想天禧AI可以帮忙把赛事场景转化成更直观的3D影像；裁判第一视角也能通过AI视频增强，足球比赛里那些更专业的细节能被AI翻译成更易于理解的内容。</p>\n  <p>而在中国足球场景中，作为中足联全栈AI战略合作伙伴，联想也推出了中足联专属AI智能体“足智多谋AI”，服务赛事运营、赛事监管和指挥调度。围绕足球，联想打造了一个全方面维度的AI Agent，完整覆盖从专业赛事运营到大众消费端的全链路，实时赋能足球赛事。</p>\n  <p><strong>在普通观众层面，更直观的AI Agent赋能体验来自于“天禧AI足球智能体”——它就像一个“世界杯版随身系统”。</strong>一个球迷打开天禧AI足球智能体，最开始可能只是想查一下今晚有没有比赛，或者自己支持的球队下一轮对谁。用得多了后，AI Agent会开始展现它的智能，在用户选择主队后围绕这支球队推送赛程变化、球员动态、阵容变化、比赛提醒等各类信息。</p>\n  <p>世界杯本身就是一个信息量爆炸的场景。在小组赛密集推进阶段，球队状态天天变，伤病名单、历史交锋、积分形势、赛程压力都会影响下一场比赛，普通球迷很难把这些信息长期追全，更不用说整理成一套清楚的判断。天禧AI足球智能体会帮用户把分散的信息收拢起来，跟着比赛进程不断调整信息，而不只是劳烦用户一次次从零开始查询。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_511e81e807e24f7dbf887e39a0136738@5362858_oswg192554oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>当然，世界杯赛事只是天禧AI Agent功能集中展示的场景之一，它是普通观众理解和接纳Agent的入口，并不是终点。</strong>在世界杯赛事期间用户习惯了系统的陪伴，它也会逐渐渗透到工作、生活的不同场景，在别的大小事务上成为用户的好帮手。工作里，它也能整理文件、生成纪要、同步资料、辅助写作；进入生���场景，它还能提醒事项、跨设备接力、调用不同工具完成任务。</p>\n  <p>由爽感短剧种草的“随身系统”幻想被点燃后，这份对AI Agent的渴望也会蔓延到真实的生活中。世界杯赛事把幻想落到一个全民关注的现实场景里，让用户第一次上手感受到AI Agent的好用。等赛事热度过去后，那个处理日常琐事、帮人持续推进任务的好用帮手，也会真正留下来。</p>\n  <p>人手一个AI Agent跟随左右的日子，可能已经比想象中更近了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_a77ef2c498e248c6b38f828c1905bacc@5362858_oswg3021oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_74c0136c87c843a38f668487a3c15066@5362858_oswg13015oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>你在追世界杯吗？</strong></p>\n  <p><strong>你会需要这样一个AI Agent吗？</strong></p>", "category": "tech", "published_at": "2026-07-02T13:22:24+00:00", "fetched_at": "2026-07-03T02:32:59.765650+00:00", "fingerprint": "115a0043a7035fe8"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜证监会同意宇树科技科创板IPO注册；Meta“带崩”科技股？业内人士：算力过剩系误读", "url": "https://36kr.com/p/3878550357946625?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>奥飞娱乐：上半年净利润同比预增305.30%—413.38%</strong><br />36氪获悉，奥飞娱乐发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股东的净利润为1.5亿元—1.9亿元，比上年同期增长305.30%—413.38%。</p>\n  <p><strong>雀巢称消费者因价格压力避开中等包装产品</strong></p>\n  <p>雀巢表示，在美国消费者专注于产品可负担性、购买者纷纷转向大包装或经济型包装而避开中等规格产品的背景下，该公司正努力控制价格。（新浪财经）</p>\n  <p><strong>盐湖股份：上半年净利润同比预增131.38%—142.95%</strong></p>\n  <p>36氪获悉，盐湖股份发布业绩预告，预计上半年净利润60亿元—63亿元，同比增长131.38%—142.95%。</p>\n  <p><strong>Meta“带崩”科技股？业内人士：算力过剩系误读</strong></p>\n  <p>7月2日，A股科技股大跌，半导体、算力硬件、存储芯片等板块跌幅较大。以科技股扎堆的“双创板”为例，创业板指和科创综指分别下跌5.71%和5.64%。从市场情况来看，A股科技股大跌源于Meta对外出售算力的消息被市场解读为算力过剩。然而，多位业内人士认为，该消息属于误读，Meta出售算力不是AI资本支出的结束，而是意味着AI基建商业模式成熟。（证券时报）</p>\n  <p><strong>抖音电商上线“肖像保护功能”</strong></p>\n  <p>36氪获悉，近日，抖音电商在北京举办“侵权仿冒治理开放日”活动，正式宣布上线“肖像保护功能”。平台将利用模型识别、核验授权信息、阻断相似内容传播等功能，主动识别并拦截AI仿冒、盗用素材等交易类侵权内容。据抖音电商披露，截至2026年6月，平台已累计处置侵权仿冒达人账号超1.2万个，处置仿冒带货商品超4.8万个，处置仿冒带货内容超26.1万条。与此同时，抖音电商“肖像保护功能”已主动拦截侵权账号9.2万个。</p>\n  <p><strong>知情人士辟谣一汽奥迪中方一把手换帅：不实消息</strong></p>\n  <p>据媒体报道，就一汽奥迪中方一把手被曝换帅的传言，一汽奥迪方面知情人士表示，不实消息，目前郭永锋仍为一汽奥迪销售有限责任公司执行副总经理。自2025年9月1日起，郭永锋开始担任一汽奥迪销售有限责任公司执行副总经理，全面负责一汽奥迪在华所有国产及进口车的销售、售后服务、网络及品牌营销工作。（财联社）</p>\n  <p><strong>普华永道预计2026年香港IPO融资额将达到3800亿港元</strong></p>\n  <p>普华永道预计2026年香港IPO融资额将达到3800亿港元。（财联社）</p>\n  <p><strong>北京君正：DRAM三季度价格会继续上调，四季度存在继续调价的可能性</strong></p>\n  <p>36氪获悉，北京君正近日接受机构调研时表示，DRAM涨价比较多，一季度国内客户开始调价，二季度国内客户仍在继续涨价，同时海外客户也陆续开始调整价格，预计二季度收入和毛利率会继续增长；三季度价格会继续上调，四季度的价格政策要到三季度才能确定，不过目前看四季度供应仍然较为紧张，存在继续调价的可能性。随着客户用部分SRAM产品来代替DRAM方案，部分SRAM芯片二季度价格也有所上涨。NOR Flash一、二季度都有涨价，涨价幅度总体来说比DRAM要小，NOR Flash虽然产能也在趋紧，但比DRAM要好很多，一季度公司Flash产品线实现了很好的收入增长，其中销量的增长占比较大。三季度的价格是根据具体产品和具体客户情况确定的，不一定都会调价。由于公司存储芯片持续在涨价，预计各季度毛利率会环比有所增长。</p>\n  <p><strong>证监会同意宇树科技科创板IPO注册</strong></p>\n  <p>36氪获悉，证监会同意宇树科技股份有限公司首次公开发行股票并在科创板上市的注册申请。</p>\n  <p><strong>小红书：世界杯开赛至今，足球内容日均发布量环比增长10倍</strong></p>\n  <p>36氪获悉，近日，小红书发布了《世界杯小组赛观赛报告》。小组赛期间，平台直播观看时长达到了开赛前的90倍，平台直播观看人次达到了开赛前的40倍，世界杯与足球内容曝光量达282亿。开赛至今，足球内容日均发布量，环比5月增长了10倍。</p>\n  <p><strong>香奈儿收购巴黎衬衫制造商Charvet</strong></p>\n  <p>7月2日，据报道，香奈儿表示，将收购总部位于巴黎的男装衬衫制造商Charvet。交易条款未予披露。Charvet是一家成立于1838年的法国高端衬衫制造商，主营衬衣与领带定制业务，在巴黎旺多姆广场设有专卖店。（新浪财经）</p>\n  <p><strong>理想“动刀”产品部：拆分整车和智驾产品，并入研发</strong></p>\n  <p>36氪从多位知情人士处获悉，理想即将围绕产品决策流程进行新一轮组织架构调整，计划将产品部的部分关键职能拆分，并入研发部门。从群组关系来看，理想汽车产品部由范皓宇负责，包含电动本体、空间智能、自动驾驶终端产品、交互设计、平台运营、App与官网等。了解调整动向的人士向36氪透露，目前调整主要针对电动本体和自动驾驶等核心产品定义团队，其中已经明确的是，产品部的电动本体定义团队，拆分并入刘立国带领的整车研发部门；自动驾驶终端产品团队将并进詹锟带领的基座模型研发团队。“可能也有一部分体验相关的产品人员进入刘杰的产品线。”一位知情人士说道。<a href=\"https://mp.weixin.qq.com/s/LpG5oLwglvx8A1rHPRnTEA\" rel=\"noopener noreferrer\" target=\"_blank\">原文</a></p>\n  <h2>投融资：</h2>\n  <p><strong>德国无人机制造商Quantum Systems获得12亿美元融资</strong></p>\n  <p>德国国防科技公司Quantum Systems周四表示，已筹集12亿美元新资金，这使这家无人机制造商的估值达到约80亿美元，这也是迄今为止欧洲国防科技公司获得的最大规模私募融资之一。这一估值较一年前高出约八倍。这家总部位于慕尼黑的公司表示，本轮融资得到了国际投资者的支持。（新浪财经）</p>\n  <p><strong>“灵珠”完成天使轮融资</strong></p>\n  <p>36氪获悉，AI创作平台“灵珠”近日完成了天使轮融资，由TikTok天使投资人韦海军领投。</p>\n  <h2>新产品：</h2>\n  <p><strong>秦淮数据投运行业首个算力中心SST商用项目</strong></p>\n  <p>36氪获悉，7月2日，行业首个算力中心SST（固态变压器）智能直流供电商业化项目在秦淮数据环首都·桑园云计算产业基地正式投运，标志着算力中心供配电体系实现从“工频”到“高频”、从“交流”到“直流”的范式突破。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>前5月我国软件业务收入同比增长10.3%</strong></p>\n  <p>记者从工业和信息化部了解到，今年前5个月，我国软件和信息技术服务业运行态势良好，软件业务收入同比增长10.3%。数据显示，今年前5个月：我国软件业务收入62451亿元，同比增长10.3%；软件业利润总额同比增长2.2%；软件业务出口达到276.5亿美元，同比增长12.8%。（央视新闻）</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-02T14:16:31+00:00", "fetched_at": "2026-07-03T02:32:59.765645+00:00", "fingerprint": "9b97fda7d8efea05"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“具身智能第一股” 宇树科技上市申请通过；SK海力士单日市值蒸发10000亿元；配置失误引发0元抢购潮，霸王茶姬致歉", "url": "https://36kr.com/p/3879158039834629?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>苹果拟于今明两年推出至少五款新iPhone</p>\n  <p>AI版支付宝开放公测，上线72项办事技能</p>\n  <p>特朗普回应“利用职位牟利”：股市在涨，大家都在赚钱</p>\n  <p>LV起诉茉莉奶白，茉莉奶白被判赔1030万元</p>\n  <p>6月赴日航班取消1488个</p>\n  <p>安克创新港股上市首日破发</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>证监会同意宇树科技科创板IPO注册</strong></p>\n  <p>7月2日，证监会网站显示，同意宇树科技首次公开发行股票注册。这意味着，全球首家在IPO前实现人形机器人规模化盈利的企业正式拿到A股“入场券”，将成为A股“人形机器人第一股”。&nbsp;</p>\n  <p>宇树科技从今年3月20日科创板IPO申请获受理，再到7月2日注册生效，仅用时104天。其创下科创板预先审阅机制落地以来的最快审核纪录，也成为科创板预先审阅机制落地以来继长鑫科技之后的又一标杆案例。（科创板日报）&nbsp;</p>\n  <p><strong>亚太股指重挫，SK海力士单日市值蒸发10000亿元</strong></p>\n  <p>7月2日，全球科技股罕见降温。截至收盘，亚太多数股指重挫。A股上证指数跌2.03%，深证成指跌3.85%，创业板指跌5.71%，科创50指数跌7.7%。算力硬件股大幅调整，剑桥科技、华工科技等跌停；半导体芯片股集体下挫，兆易创新、长电科技等跌停。北方华创、金海通及晶方科技等多股跌停。日经225指数收盘下跌1741.81点，跌幅2.47%，报68958点。韩国KOSPI指数下跌7.89%，为6月8日以来最低收盘水平。三星电子收跌9%，SK海力士收跌超14%。SK海力士单日蒸发1600亿美元市值（约合人民币10000亿元），总市值降至约1万亿美元。（中国经济网）</p>\n  <p><strong>配置失误引发0元抢购潮，霸王茶姬紧急致歉</strong></p>\n  <p>7月2日凌晨，霸王茶姬线上点餐小程序突发系统异常，原定上线的新品特惠饮品标价全部变为0元，大量消费者闻讯涌入下单，瞬时高流量直接挤垮小程序后台。当日上午，霸王茶姬湖北子公司发布官方致歉声明，公司7月2日推出的“远山鲜沏”系列9.9元特惠活动，因运营后台配置失误，产品意外以0元上架，才引发大规模免费下单抢购事件。声明公布后续解决方案，7月2日零点至系统修复前，所有标价0元生成的订单全部统一取消。为弥补故障给消费者带来的不佳体验，每位受影响用户的账户将直接到账三张 “远山鲜沏” 系列0.01元无门槛兑换券。霸王茶姬湖北子公司还表示，事件发生后，公司已全面复盘内部流程与系统审核机制，坚决杜绝此类失误再次发生。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>AI版支付宝开放公测，上线72项办事技能</strong></p>\n  <p>36氪获悉，7月2日，AI版支付宝“阿宝”完成新一轮产品迭代并正式开放公测。iOS 和安卓系统用户在应用商店或支付宝App内搜索“阿宝”或“蚂蚁阿宝”进行更新体验。本次升级围绕生活服务垂域模型能力、服务生态和用户陪伴体系三方面展开，优化用户通过自然对话办理各类生活服务的使用体验。同时，从数千项生活办事服务中精选出72项智能办事技能，作为公测阶段的首批上手清单。&nbsp;</p>\n  <p><strong>Anthropic或正与三星洽谈定制人工智能芯片</strong></p>\n  <p>7月2日，据报道，有三位知情人士表示，Anthropic已启动自研AI芯片的早期工作，并与三星电子就潜在制造合作进行了洽谈。（界面新闻）&nbsp;</p>\n  <p><strong>Meta首席执行官扎克伯格称AI智能体开发未达预期</strong></p>\n  <p>据报道，Meta首席执行官马克·扎克伯格表示，过去四个月AI的智能体开发“并未以我们预期的方式加速”。扎克伯格补充称，包含大规模裁员在内的重组工作本可以更“干净利落”，公司对新架构的押注“目前还没有取得成效”。（新浪财经）&nbsp;</p>\n  <p><strong>英伟达推出AI基础设施新合作模式</strong></p>\n  <p>英伟达当地时间7月1日宣布推出全新的AI基础设施合作模式，将通过收入分成（Revenue-sharing）和信用支持（Credit-support）机制，与AI云服务商共同建设大规模、多租户AI工厂，帮助初创企业、模型开发者、企业及科研机构更快获得AI算力，同时为英伟达创造与算力使用量挂钩的持续性收入。根据方案，AI云厂商将部署基于英伟达DSX AI Factory架构的AI工厂，对外提供云计算服务。首批合作伙伴包括Sharon AI和Firmus。其中，Sharon AI计划部署最多4万块NVIDIA Grace Blackwell GB300 GPU；Firmus将在印度尼西亚巴淡岛建设DSX AI工厂园区，规划扩展至360兆瓦电力规模，并部署最多17万块英伟达GPU。（财联社）&nbsp;</p>\n  <p><strong>阿里整合QoderWork、悟空、MuleRun，将推出新的生产力AI产品</strong></p>\n  <p>36氪获悉，阿里巴巴正在对旗下Agent产品线进行整合：以QoderWork为基础，整合悟空、MuleRun的能力，整合升级成一款更强大的面向企业生产力场景的AI产品。新产品由陈宇森负责。阿里巴巴方面回应称，QoderWork、悟空、MuleRun现有产品服务未来将无缝升级，所有用户权益不会受影响。&nbsp;</p>\n  <p><strong>Meta将推出自有预测市场应用Arena</strong></p>\n  <p>Meta曾就收购预测市场公司Kalshi进行过谈判，但最终决定自行开发名为Arena的预测市场应用，采用虚拟货币而非真实资金下注。据透露，Meta首席执行官马克·扎克伯格去年在Kalshi人气飙升时会见了该公司CEO塔雷克·曼苏尔，讨论可能的收购事宜，但谈判未能推进。关于谈判破裂的原因存在不同说法，有消息称曼苏尔不愿出售，也有说法称Meta认为Kalshi面临的法律和伦理问题过于复杂。（新浪财经）&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>理想“动刀”产品部：拆分整车和智驾产品，并入研发</strong></p>\n  <p>36氪从多位知情人士处获悉，理想即将围绕产品决策流程进行新一轮组织架构调整，计划将产品部的部分关键职能拆分，并入研发部门。从群组关系来看，理想汽车产品部由范皓宇负责，包含电动本体、空间智能、自动驾驶终端产品、交互设计、平台运营、App与官网等。了解调整动向的人士向36氪透露，目前调整主要针对电动本体和自动驾驶等核心产品定义团队，其中已经明确的是，产品部的电动本体定义团队，拆分并入刘立国带领的整车研发部门；自动驾驶终端产品团队将并进詹锟带领的基座模型研发团队。“可能也有一部分体验相关的产品人员进入刘杰的产品线。”一位知情人士说道。</p>\n  <p><strong>美光CEO再次暗讽苹果：低价采购是造成内存短缺的关键</strong></p>\n  <p>美光科技首席执行官最新表示，过去几年里，一些客户要求内存制造商降低价格，从而带来了一些负面影响。2023年美光的价格降到了原来的1/3，导致无力投资新的产能。美光的这番暗讽被普遍认为是针对其大客户苹果发出的，尽管他并未直接提及苹果的名字。美光与苹果之间的对峙，代表着内存公司与消费电子制造商的市场平衡因人工智能发展而改变。（新浪财经）</p>\n  <p><strong>马斯克两度否认SpaceX要造手机</strong></p>\n  <p>当地时间7月1日，有报道称SpaceX向一些投资者展示了一款类似于iPhone但“更纤薄”的原型机，该原型机将运行SpaceX的专有操作系统。知情人士表示，该设备还将采用SpaceX于2月份收购的xAI公司的AI技术，并使用高通公司的芯片。报道还显示，上述设备在公开展示前已向相关方进行过演示，但其设计在早期阶段，可能会有所修改。对此，马斯克予以否认，在社交平台发文称“完全不属实”。受上述消息带动，高通股价盘中一度跳涨超3%，股价短时站上190.99美元，但在马斯克回应后又下跌了1.55%，创下5月6日以来阶段新低。</p>\n  <p>SpaceX要造手机的消息并非首次传出。今年2月，曾有消息称SpaceX正考虑开发一款能够直接连接“星链”的移动设备。马斯克当时同样回应称，消息不实，SpaceX并未在开发手机。（界面新闻）</p>\n  <p><strong>苹果拟于今明两年推出至少五款新iPhone</strong></p>\n  <p>7月1日消息，据报道，苹果公司正计划在今年下半年至2027年上半年期间，发起一项雄心勃勃的iPhone新品发布计划，预计将推出至少五款新机型。尽管目前整个科技行业正面临供应链零部件短缺的困境，但苹果仍决定加大折叠屏手机的出货量，超出市场此前预期。报道称，苹果还计划于2027年上半年推出首款M7芯片，并发布第二代iPhone Air、入门版iPhone 18等产品。不过，由于内存和芯片供应紧张，部分产品发布时间仍可能调整。（界面新闻）</p>\n  <p><strong>张雪峰11岁女儿接手张雪峰公司股份</strong></p>\n  <p>7月2日消息，苏州研途教育科技有限公司近日发生工商变更，张雪峰（张子彪）退出，退出前任公司监事并持股约10.86%，退出后其所持股份由女儿张姩菡接手。公开信息显示，张姩菡，2015年6月出生，目前尚未成年。（界面新闻）</p>\n  <p><strong>腾讯QClaw负责人发长文宣布离职</strong></p>\n  <p>7月2日，腾讯AI助手QClaw产品负责人张舒昱在社交平台发文称，已于6月29日正式结束在腾讯的工作。她于2025年9月加入腾讯，在职约10个月，目前尚未透露下一站。关于张舒昱离职一事，记者向腾讯方面求证，截至发稿未获具体回应。（潇湘晨报）&nbsp;</p>\n  <p><strong>特朗普回应“利用职位牟利”：股市在涨，大家都在赚钱</strong></p>\n  <p>当地时间7月1日，特朗普回应了批评人士关于他“利用总统职位牟利”的指责，他说：“因为股市在上涨，大家都在赚钱。你有401（k）退休账户吗？大约上涨了85%左右。（你得说）谢谢您，特朗普总统。所以我们所有人都在赚钱。”他当天还对记者表示，“我不插手我的私事——我的钱由专人管理。嗯，在我当总统之前我就赚了很多钱，他们帮我投资，但我从不跟他们说话。我从来不——我甚至都不跟他们联系。”据了解，401（k）是美国最常见的企业养老金账户，账户资金通常投资于股票、基金等资产，因此股市上涨时，账户资产也可能随之增值。（中国新闻社、财联社）</p>\n  <p><strong>马斯克晒Optimus产线合照</strong></p>\n  <p>当地时间7月1日，马斯克发布了一张大合照，并配文称，在弗里蒙特工厂参观Optimus机器人生产线。这一言论可能代表着特斯拉的人形机器人Optimus正进入关键的量产阶段。特斯拉弗里蒙特工厂一直是该公司在美国的先锋制造中心，曾经用于生产特斯拉旗舰车型Model S轿车和Model X SUV，如今已成为该公司人形机器人生产线的所在地。（财联社AI daily）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_2318e6832c5a474dac4c52c059d693c7@5667365_oswg194047oswg1080oswg1389_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>安克创新港股上市首日破发</strong></p>\n  <p>7月2日，“充电宝一哥”安克创新（00668.HK）正式登陆港交所主板，完成A+H两地上市布局，但开盘瞬间即跌破99.32港元的发行价。截至午间休市，安克创新报94.05港元，跌5.31%，市值为548.23亿港元。午后，存储芯片概念持续下挫，兆易创新封跌停，成交超304亿元。记者拨打兆易创新投资者热线，对方工作人员回复：“公司目前生产经营一切正常，正值半年报披露窗口期，其他情况不便透露。”安克创新港股发行价对应A股收盘价折价约26%。其全球发售总量4663.28万股H股，配售结构采用9:1配比，90%股份投向国际机构认购，仅10%面向香港散户公开发售，同步设置15%超额配股权用于绿鞋稳定股价。（界面新闻、第一财经、财联社）&nbsp;</p>\n  <p><strong>6月赴日航班取消1488个</strong></p>\n  <p>航班管家DAST最新统计显示，6月共有25条中日航线取消全部航班。整个6月中国大陆赴日本共有1488个航班取消，取消率为37.5%。今年上半年TOP20通航国家中，韩泰日航班量位列前三，其中赴韩航班量超2019年水平，赴泰国、日本恢复率仅64.7%、53.5%。（界面新闻）</p>\n  <p><strong>“电子布大厂”富乔工业宣布涨价30%</strong></p>\n  <p>有市场消息称，由于制造成本上涨及市场供不应求，“电子布大厂”富乔工业近日向客户发出涨价通知，宣布旗下电子布产品价格上调15%至30%，新价格自2026年7月1日起执行。7月2日上午，记者致电富乔工业的核心经营主体富乔（东莞）玻纤有限公司进行了求证。该公司回应称，本轮调价已正式落地。其中，面向传统PCB、消费电子领域的普通E-glass电子布统一涨价30%；面向AI服务器、高速高频板等应用的低介电常数（Low DK2）电子布涨价15%。（上海证券报）</p>\n  <p><strong>LV起诉茉莉奶白，茉莉奶白被判赔1030万元</strong></p>\n  <p>7月2日消息，苏州市中院就路易威登马利蒂（Louis Vuitton Malletier，简称“LV”）诉茉莉奶白商标侵权案作出一审判决。法院认定，深圳市茉莉奶白餐饮管理有限公司及吴中经济开发区东侠饮品店侵害LV 7件四叶花卉图形注册商标专用权。茉莉奶白主体公司应在判决生效之日起10日内赔偿LV经济损失1000万元、维权合理开支30万元，合计1030万元。7月2日，记者致电茉莉奶白创始人张伯丞，其在电话中回复称，将上诉。记者在国家知识产权局商标检索发现，茉莉奶白申请的相关四叶花卉图形商标处于“驳回复审”或“无效”状态。（新黄河）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_132d202e40264398a5420ee46cab8aca@5667365_oswg161665oswg1080oswg1400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>北京君正：DRAM三季度价格会继续上调，四季度存在继续调价的可能性</strong></p>\n  <p>36氪获悉，北京君正近日接受机构调研时表示，DRAM涨价比较多，一季度国内客户开始调价二季度国内客户仍在继续涨价，同时海外客户也陆续开始调整价格，预计二季度收入和毛利率会继续增长;三季度价格会继续上调，四季度的价格政策要到三季度才能确定，不过目前看四季度供应仍然较为紧张，存在继续调价的可能性。随着客户用部分SRAM产品来代替DRAM方案，部分SRAM芯片二季度价格也有所上涨。NORFlash一、二季度都有涨价，涨价幅度总体来说比DRAM要小，NORFlash虽然产能也在趋紧，但比DRAM要好很多，一季度公司Flash产品线实现了很好的收入增长，其中销量的增长占比较大。三季度的价格是根据具体产品和具体客户情况确定的，不一定都会调价。由于公司存储芯片持续在涨价，预计各季度毛利率会环比有所增长。&nbsp;</p>\n  <p><strong>腾讯市值重回4万亿港元</strong></p>\n  <p>7月2日，腾讯控股股价涨超2%，市值重回4万亿港元。这是腾讯股价连续第三个交易日上涨。今年3月腾讯市值曾跌破5万亿港元，6月又跌破4万亿港元。（第一财经）</p>\n  <p><strong>SK海力士将于2029年在清州建成NAND闪存工厂</strong></p>\n  <p>SK海力士将在忠清南道清州新建一座大型NAND闪存晶圆厂，目标于2029年投入运营。包括该项目在内，SK集团计划在忠清地区总投资170万亿韩元，涵盖先进封装和人工智能数据中心领域，旨在打造全球AI枢纽。（新浪财经）</p>\n  <p><strong>雀巢称消费者因价格压力避开中等包装产品</strong></p>\n  <p>雀巢表示，在美国消费者专注于产品可负担性、购买者纷纷转向大包装或经济型包装而避开中等规格产品的背景下，该公司正努力控制价格。（新浪财经）</p>\n  <p><strong>知情人士辟谣一汽奥迪中方一把手换帅：不实消息</strong></p>\n  <p>据媒体报道，就一汽奥迪中方一把手被曝换帅的传言，一汽奥迪方面知情人士表示，不实消息，目前郭永锋仍为一汽奥迪销售有限责任公司执行副总经理。自2025年9月1日起，郭永锋开始担任一汽奥迪销售有限责任公司执行副总经理，全面负责一汽奥迪在华所有国产及进口车的销售、售后服务、网络及品牌营销工作。（财联社）</p>\n  <p><strong>全球人工智能数据中心面临极端高温威胁</strong></p>\n  <p>一家气候风险分析机构近日公布的研究数据称，目前全球数据中心高达79%的算力容量面临着各种突发气候灾害的威胁，包括洪水、极端大风及山火等，这些灾害可能导致运营中断、停机时间增加，并推高保险和维修成本。目前，各大科技企业也正意识到气候因素给人工智能数据中心运行带来的挑战，并探索解决方案。微软公司表示，正在通过选址、完善冗余系统和实时监控等手段，来管理极端高温和恶劣天气带来的风险。英伟达公司上周表示，其新型的人工智能服务器可以在最高45摄氏度的冷却液环境下运行。英伟达称，冷却液温度提高1摄氏度，就可以使冷却系统能耗降低约4%。（科创板日报）</p>\n  <p><strong>美股三大指数收盘涨跌不一，特斯拉跌超7%</strong></p>\n  <p><strong>36氪获悉，7月2日收盘，美股三大指数涨跌不一，道指涨1.14%，纳指跌0.8%，标普500指数平收。大型科技股涨跌不一，特斯拉跌超7%，Arm跌超6%，Meta跌超4%，英伟达跌超1%，谷歌小幅下跌；奈飞、苹果涨超4%，SpaceX涨超2%，微软涨超1%，亚马逊小幅上涨。热门中概股多数下跌，爱奇艺跌超4%，小鹏集团、蔚来、百度跌超3%，阿里巴巴、网易、B站、微博、理想汽车跌超1%；京东涨超1%。</strong></p>\n  <h2>上市进行时</h2>\n  <p><strong>胜达克半导体启动上市辅导</strong></p>\n  <p>36氪获悉，证监会官网显示，胜达克半导体科技（上海）股份有限公司已启动上市辅导，招商证券担任辅导机构。&nbsp;</p>\n  <p><strong>深圳宏芯宇电子股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳宏芯宇电子股份有限公司向港交所提交上市申请书。&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>快手：旗下视频生成大模型可灵AI落地近30亿美元融资</strong></p>\n  <p>快手在港交所公告，快手旗下领先的视频生成大模型可灵AI落地近30亿美元融资，投后估值有望达到180亿美元。此次融资，可灵AI创下全球视频大模型公司最大额融资纪录，标志着其独立商业化发展进程正式开启。本轮融资由CPE源峰、国方创投、BlueFive、腾讯、中关村科学城基金（联合国科投资）、中信证券联合领投，以及数十家一线机构共同参与。据悉，该轮融资汇聚阿里云、百度等顶级产业资本，华策影视和芒果产业投资人（厚为资本）等头部文娱产业方积极参与。（财联社）&nbsp;</p>\n  <p><strong>“乐享科技”完成近5亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“乐享科技”今日正式官宣完成近5亿元Pre-A轮融资。至此，乐享科技成立仅一年半，累计融资总额已达10亿元人民币。本轮融资由蚂蚁集团领投，产业方吉利资本、三七互娱，元禾璞华跟投，老股东 Monolith持续超额跟投，投资者汇集了顶级战投方、产业投资人与市场化基金。本轮融资资金将重点用于六项核心技术自研、人才引入、全球化市场渠道拓展等。</p>\n  <p><strong>德国无人机制造商Quantum Systems获得12亿美元融资</strong></p>\n  <p>德国国防科技公司Quantum Systems周四表示，已筹集12亿美元新资金，这使这家无人机制造商的估值达到约80亿美元，这也是迄今为止欧洲国防科技公司获得的最大规模私募融资之一。这一估值较一年前高出约八倍。这家总部位于慕尼黑的公司表示，本轮融资得到了国际投资者的支持。（新浪财经）</p>\n  <p><strong>“高云半导体”完成数亿元Pre-IPO轮融资</strong></p>\n  <p>36氪获悉，“高云半导体”宣布完成Pre-IPO轮融资交割落地。本次融资总规模达数亿元。本次Pre-IPO轮融资由广开基金、广州工控资本、越秀产业基金、广州金控基金、知识城创投、国创集团（大湾区国创中心资产管理平台）、番禺产投等本地国资共同参与。同时，本次成功引入多家产业资本，包括恒旭资本、仁发投资、梁溪科创产业二期母基金（博华产投管理），以及专业科技投资机构朗姿韩亚、景祥资本、中广创投等。</p>\n  <p><strong>“灵珠”完成天使轮融资</strong></p>\n  <p>36氪获悉，AI创作平台“灵珠”近日完成了天使轮融资，由TikTok天使投资人韦海军领投。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>海尔的Agent OS，已经开始进入研发、采购、生产、客服等核心业务场景。&nbsp;</p>\n  <p>&nbsp;</p>\n  <p><strong>“零食消费”小调查</strong></p>\n  <p>明明没吃多少，零食账单却越来越长。这届年轻人，怎么越来越嘴馋了？&nbsp;</p>\n  <p>零食在年轻人生活中的地位似乎日渐重要。加班到九点，要靠一包“高蛋白肉干”撑到回家；下午路过便利店，顺手就拿一盒冷藏甜品、几颗现制卤味犒劳自己；周末，逛量贩零食店大采购成了日常解压方式——零食，悄悄占据了打工人的生活，成了忙碌日常中的“隐藏刚需”。&nbsp;</p>\n  <p>你买零食时，会因为“高蛋白、0糖、低卡”这些标签多拿一包吗？你多久会试一次没吃过的网红新品？你曾用零食代替过一顿正餐吗？在你心里，零食算一时嘴馋，还是一日续命？欢迎填写「零食消费小调查」，聊聊你心里最想推荐给大家的那款零食~&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_20ba7d60512a4b4d8249b0ae493e42ff@5667365_oswg20714oswg512oswg512_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“零食消费”小调查</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-03T00:06:38+00:00", "fetched_at": "2026-07-03T02:32:59.765639+00:00", "fingerprint": "eb0c2654de447f4a"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 省级实验室团队做电氢耦合解决方案，获厦门高新投领投", "url": "https://36kr.com/p/3879274157928449?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，厦门启航氢能技术有限公司（以下简称“启航氢能”）近日完成新一轮融资，本轮由厦门高新投领投，融资资金将主要用于电氢耦合关键装备及离网制氢相关核心技术的持续研发投入与产品迭代升级。</p>\n  <p>启航氢能成立于2024年4月，<strong>技术起源于嘉庚创新实验室电氢耦合研究团队。</strong>公司专注于电氢耦合技术及应用场景的装备研发、生产与销售，核心团队在电力电子技术、智能电网与电化学等领域拥有近20年研究积累。嘉庚创新实验室是福建省政府设立的省级高水平科研平台之一，其氢能产业集群由实验室主任郑南峰院士、氢能研究院方晓亮院长牵头布局。</p>\n  <p>氢能在新型能源体系中承担着连接电力系统与终端用能的关键角色，尤其在风光等波动性可再生能源大规模接入背景下，如何实现高效、稳定的电力转化与消纳，成为产业落地的核心问题。其中，“<strong>电氢耦合”是决定绿氢效率与成本的关键环节，</strong>通过更精细的电源控制、更智能的系统级调度与离网制氢/微电网制氢架构设计，电氢深度耦合相关技术可以显著提升绿氢系统的稳定性与经济性。</p>\n  <p>区别于传统电源大厂仅提供通用型电源的路径，启航氢能基于对电化学特性的深刻理解，开发出了更加适配电解槽的智能电源系统。通过独家控制算法，更好地解决了电解槽冷启动电流冲击、运行期谐波损伤及老化期内阻补偿等全生命周期痛点。</p>\n  <p>目前，<strong>公司已完成IGBT制氢电源、离网制氢/微电网制氢解决方案及燃料电池逆变器三大产品系列的研发，构建起较为完整的电氢耦合核心电气产品矩阵。</strong></p>\n  <p>其中制氢电源产品覆盖液冷与风冷两种技术路线，功率范围从30kW延伸至20MW，并包括针对PEM电解槽的专用电源及光伏直驱制氢方案，可适配6–4000标方制氢规模场景。同时公司已启动下一代更高效率更低成本制氢电源的预研工作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_d65587b6160049309e342b0f083fb440@5920579_oswg147836oswg675oswg592_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在制氢微电网方面，公司可提供200kW–50MW级系统级解决方案，通过1500V直流或10~35kV交流中压架构实现中远距离电能传输与组网，并形成标准化模块化方案以支持快速部署。</p>\n  <p><strong>启航氢能定位为第三方氢能电气装备与系统解决方案供应商，不生产电解槽，而是面向电解槽厂商与终端能源业主提供配套能力。目前公司已先后合作超过50家电解槽企业，覆盖国内主流厂商的多数参与者，同时布局国内大客户及海外市场。</strong></p>\n  <p><strong>以下为硬氪与启航氢能CTO魏闻的交流节选：</strong></p>\n  <p><strong>硬氪：国内制氢电源赛道已有英特利、阳光电源等玩家，IGBT制氢电源也有多家在布局。请问启航氢能的“不可替代性”体现在哪里？</strong></p>\n  <p><strong>魏闻：</strong>我们的优势主要体现在三个层面。第一是工程化能力和产品对标能力。团队本身来自产业一线，具有十余年超大功率电力电子设备开发经验，在工程实现上积累比较扎实。我们对标的目标非常明确，就是世界顶级平台。在核心产品方面，目前我们已经能够做到和世界顶级公司的产品处于同一技术水平线，而不是停留在实验室阶段。</p>\n  <p>第二是对电解槽材料机理的研究及对前沿方向的延展能力。厦门大学及嘉庚创新实验室拥有世界级的电化学研究团队和实验支撑平台，足以支撑我们通过跨学科交叉融合，把学术界的最新研究和方法论引入研发体系中；跳出单一的电力电子视角研究制氢电源，而是建立起覆盖电解槽材料机理、整槽特性、离网制氢以及系统级解决方案的整体研究路线图，立志打造“更懂电解槽的制氢电源与电氢耦合解决方案”，从根本上推动行业技术演进。</p>\n  <p>第三是产品迭代速度。我们的组织机制相对灵活，能够更快完成从研发到产品化的闭环，且便于联合行业大客户开展定制化设计。行业里一代产品的开发周期通常在三年左右，我们内部的目标是压缩到一年半，最长不超过两年，比行业主流厂商提前一年以上推出新产品。因此，我们不是只追求技术不落后，而是逐步通过节奏优势形成产品和技术的领先。</p>", "category": "tech", "published_at": "2026-07-03T02:02:30+00:00", "fetched_at": "2026-07-03T02:32:59.765631+00:00", "fingerprint": "e8b3bba48b17551b"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 获宁德时代旗下基金领投数千万美元，智能出行公司上市首月已成印尼电摩品类订单第一", "url": "https://36kr.com/p/3877990989819909?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能两轮出行企业「OMOWAY」（目蔚科技）近期连续完成A轮和A+轮融资，单轮融资金额均为数千万美元。其中，A+轮由宁德时代支持设立的美元基金Lochpine Capital领投，A轮由Monolith领投，中金资本旗下基金及老股东真格基金跟投。</p>\n  <p>成立不到两年时间，OMOWAY已获得数轮融资。截至目前，其股东阵容包含红杉、真格、Monolith、中金等头部财务投资机构，还包括Lochpine Capital、星航资本（小鹏系基金）、惠友资本（比亚迪联创设立）等新能源产业投资方。</p>\n  <p>得益于充足资金和产业资源的支持，OMOWAY产品在全球市场的商业化落地也在咋加速。今年6月，OMOWAY首款旗舰产品OMO-X正式开启全球首发交付，首站落地印尼。</p>\n  <p>硬氪了解到，上市首月，OMO-X便登顶印尼全国电摩品类订单量第一。</p>\n  <p>长期以来，全球摩托车市场主要被日系燃油品牌主导，且行业普遍面临“高端智能产品溢价过高、普惠产品缺乏科技感”的痛点。OMOWAY的快速破局，则凭借智能化驱动带来的降维体验，打破当地传统出行产品的固有格局。</p>\n  <p>具体到产品层面，在智能化与硬件配置上，OMO-X全系标配数字钥匙、自动边撑和远程控车等功能，并搭载了摩托车行业少见的10.25英寸汽车级智能交互大屏，而行业主流屏幕在5-7英寸左右；此外，同时，车辆采用了常见于豪华汽车的自研双叉臂后连杆悬挂结构，有效提升操控稳定性和骑行舒适感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_fa6b125ee79c453f9932c2e78ffe3617@5836910_oswg487705oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在产品布局上，OMO-X Smart（智能版）聚焦智能化出行体验，通过数字化交互与智能生态连接，让骑行更加便捷高效；而其推出的OMO-X Balance（自平衡版）是全球首台量产落地的自平衡摩托车，OMOWAY团队针对摩托车“易倒、难扶”的痛点问题，通过引入源自航天领域的陀螺仪稳定技术，标配低速平衡辅助，大幅提升骑行稳定性。</p>\n  <p>为了适应复杂的真实路况，OMOWAY为OMO-X研发了强化学习模型。在云端仿真环境中，系统通过海量数据训练，优化了电机输出与陀螺仪扭矩的协同逻辑。在行驶安全方面，OMO X搭载了由双前视摄像头与四个鱼眼摄像头组成的360°全景视觉方案。在低速行驶过程中，面对湿滑路面、复杂弯道或潜在碰撞场景时，系统可通过预判风险，控制电机、转向与刹车系统提前介入，从而修正行驶姿态，提供主动安全防护。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_2b125ab79e674ccdb18de40abfb64b36@5836910_oswg179806oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>OMO-X各项动态能力的底层支撑，是OMOWAY自主研发的OMO-ROBOT通用技术架构。该架构将人工智能、机器人技术与车辆工程深度融合，涵盖了感知、决策、执行与信息传递的全链路闭环。在这一技术架构基础上，OMOWAY推出100%全自研的轮式机器人Mobility One，今年内有望发布原型。</p>\n  <p>以底层的技术架构为驱动，OMOWAY正加速其全球市场的版图拓展。作为出海首站，OMOWAY目前在印尼已铺设数十家经销商网络，全面覆盖雅加达、万隆、泗水及巴厘岛等核心区域。</p>\n  <p>未来，OMOWAY还将陆续进军泰国、新加坡以及欧洲市场。公司计划以智能两轮出行为起点，逐步向即时配送、、公共服务、家庭等多场景延伸，推动交通工具向智能伙伴进化，让高智能的产品体验进入每个家庭。</p>", "category": "tech", "published_at": "2026-07-03T02:26:11+00:00", "fetched_at": "2026-07-03T02:32:59.765618+00:00", "fingerprint": "7bc353d6e12cfa3d"}, {"source": "少数派", "title": "家用游戏机的新选择，Steam Machine 玩起来怎么样？", "url": "https://sspai.com/post/111763", "summary": "本文由IGN中国编译自IGNUS相关内容，原作者JacquelineThomas、编译者Tony，少数派经IGN中国授权转载，仅对文章格式略作调整。阅读原文>在经历八个月的等待之后，SteamMach ...<a href=\"https://sspai.com/post/111763\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T04:16:09+00:00", "fetched_at": "2026-07-03T02:32:58.221060+00:00", "fingerprint": "0760d825ec428276"}, {"source": "少数派", "title": "共创试读 | 给童年一份礼物：从是什么到为什么，找到合适的掌机", "url": "https://sspai.com/post/111069", "summary": "近年来，伴随着复古浪潮的席卷而来，许多玩家似乎又重新关注起了一些老游戏、老设备。从2022年的3DS涨价风波，到后来层出不穷的所谓「开源掌机」，大家似乎都在寻找一个通往童年的入口，重新回味那些历久弥新 ...<a href=\"https://sspai.com/post/111069\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T07:00:00+00:00", "fetched_at": "2026-07-03T02:32:58.221055+00:00", "fingerprint": "cf4aefe814bc76ec"}, {"source": "少数派", "title": "iOS 剪贴板管理工具 Procut：换个方式收藏碎片化信息", "url": "https://sspai.com/post/110950", "summary": "你一定有过这样的经历：在小红书刷到一篇感兴趣的笔记，复制链接想稍后再看，结果淹没在聊天记录里再也找不到了。微信群里有人分享了一个公众号文章，随手复制了链接，等真正有空时却想不起存到了哪里。收到快递取件 ...<a href=\"https://sspai.com/post/110950\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T09:35:25+00:00", "fetched_at": "2026-07-03T02:32:58.221048+00:00", "fingerprint": "5f706921dff9317d"}, {"source": "少数派", "title": "派早报：大疆发布 DJI Mic Mini 2S 迷你无线麦克风
