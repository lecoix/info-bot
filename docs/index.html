ummary": "A new firmware update for the $449 Bose QuietComfort Ultra Headphones Gen 2 adds support for Bluetooth LE Audio and Auracast as beta features. The flagship Ultra headphones are the first from Bose to support the audio sharing technology, which the company plans to bring to more devices soon. Only a few major manufacturers include [&#8230;]", "category": "tech", "published_at": "2026-09-28T19:31:24+00:00", "fetched_at": "2026-09-29T03:55:09.331425+00:00", "fingerprint": "fa414384ca3b5546"}, {"source": "The Verge", "title": "AMD is acquiring AI company World Labs in a deal worth more than $8 billion", "url": "https://www.theverge.com/tech/1001749/amd-world-labs-ai-acquisition-deal", "summary": "AMD announced today that it's acquiring World Labs, an AI research lab co-founded by the prominent researcher Dr. Fei-Fei Li, in an all-stock deal worth approximately $8.2 billion. World Labs launched in 2024 and was valued at $1 billion in a matter of months. The startup launched its first commercial product, a world generation model [&#8230;]", "category": "tech", "published_at": "2026-09-28T21:31:35+00:00", "fetched_at": "2026-09-29T03:55:09.331417+00:00", "fingerprint": "721d3fef7b9b02d6"}, {"source": "36氪 - 最新文章", "title": "36氪专访丨华为诺亚生成式大模型负责人创业家庭具身，一年融了超10亿", "url": "https://36kr.com/p/4003270787993737?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_c0e818f2e6e64a648172cb0cc0df4383@6221844_oswg1822911oswg1672oswg941_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>6900</strong>字，建议阅读<strong>17</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>在华为系具身赛道创业公司中，诺因智能算是融资较为顺利的一家。</p>\n  <p><strong>硬氪获悉，这家成立于2025年8月的公司，近日宣布完成单笔数亿元人民币天使+++轮融资。本轮融资由京东相关基金领投，正心谷资本、南山战新投和华登投资跟投。距离上一轮5亿元融资，仅过去一个多月。</strong></p>\n  <p>创立诺因智能前，李银川同时具有具身智能、大模型、自动驾驶三方面的研发和落地经验。25岁时，他从北理工和哥大联培博士毕业后加入华为，27岁担任诺亚方舟实验室生成式大模型方向负责人。30岁那年，他离职成立诺因智能。在他看来，家庭机器人是将大模型能力转化为实际产品的重要机会。</p>\n  <p>2025年春晚后，具身智能受到资本市场的广泛关注。机器人叠衣服、倒咖啡、收拾桌子的视频也频繁出现在公众视野中，让外界看到了机器人进入家庭的可能。不过，从演示走向日常使用，还需要面临更复杂的场景：换一个房间、换一套杯碟、换一种家务，机器人能否依然稳定完成任务？</p>\n  <p>这正是诺因智能希望解决的问题。李银川回忆，创业之初，行业更多关注工业场景和模仿学习，而他选择了一条以泛化能力为核心、面向家庭场景的技术路线。在他看来，机器人进入家庭，需要同时解决适应性和成本问题：模型要能应对不同家庭中的任务，产品价格也要落在普通消费者可以接受的范围内。</p>\n  <p>为此，他们开发了技术底座GLOW，���是一套生成式具身大模型架构。它由多个模块协同，让机器人从“复现训练过的动作”，逐步走向“解决没有完整见过的任务”。数据上，诺因90%采用合成数据，整体成本可以降低10到100倍；训练上，世界模型无需生成完整视频画面，也能推演动作后果；执行上，模型单次推理可以输出完整动作序列，降低调用频率。</p>\n  <p>同时，诺因智能推出首款消费级家庭具身机器人KNOWIN-X1。它采用全折叠双臂构型，折叠后高度控制在40厘米以内，可以适配桌面、地面、沙发、洗衣机等家庭空间。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_34daa83c7ea24b4ea732bf1b95af0232@6221844_oswg457525oswg1080oswg442_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">KNOWIN-X1（图源/企业）</p>\n  <p>当然，这些产品离大规模落地还有相当距离。而资本持续注入，其中一部分原因是诺因智能的人才密度。公司在不到一年内扩至200人以上。其中，算法团队博士及以上学历人才占比超过三分之二，半数成员毕业于QS世界大学排名前30的院校。团队已汇聚多位华为“天才少年”。</p>\n  <p>对于行业前景，李银川仍持乐观态度。他认为，整个赛道近期可能会有所波动，但远没到泡沫彻底破灭的阶段，关键还是要看具身大模型何时出现能力涌现。</p>\n  <p>对于这一点，业内仍未达成共识。有人认为，机器人行业不会出现类似“ChatGPT时刻”的节点，但李银川认为，智能涌现只是时间问题。</p>\n  <p>“如果具身模型有一天真正出现能力涌现，机器人的商业价值毫无疑问会远超大语言模型，我认为可能是其10倍以上。”他告诉硬氪。</p>\n  <p>我们和李银川聊了聊创业以来的思考，以及他对家庭具身智能的观察。以下是硬氪与诺因智能创始人李银川的对话。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_f2fc8dd4cca340c3bc951939fddee6c3@6221844_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>从华为出来创业</strong></p>\n  <p><strong>硬氪：当初决定从华为诺亚出来创业时，你是怎么想的？决定性因素是什么？</strong></p>\n  <p><strong>李银川：</strong>我出来创业，主要是想做一个全球最泛化的具身大模型，真正孵化出商业价值，所以选择了To C具身智能。在华为诺亚时，我觉得如果回去做To B、To G，对具身大模型研发的支持力度会比较有限。华为的战略还是把昇腾做好，做好“黑土地”，让大家都用昇腾，而不是把所有上层应用都自己做。所以我更希望出来做家庭机器人。</p>\n  <p><strong>硬氪：你当时就想好了要做家庭方向吗？当时是怎么考虑的？</strong></p>\n  <p><strong>李银川：</strong>我当时应该算是国内比较早出来讲家庭机器人的人之一。我有两个非共识。</p>\n  <p>第一，2025年上半年，大家普遍认为具身智能就是操作、模仿学习、进工厂，这是当时的共识。但我当时就在讲，我们要做能够泛化的技术路线，真正做出可泛化的具身模型，而不是过拟合。只有具备泛化能力，才有机会进入To C家庭场景。这是我们在技术路线选择上的第一个非共识。</p>\n  <p>第二，在了解了当时市场上的机器人售价后，我们有信心通过新的垂直整合方式，把机器人成本降下来。成本降下来，To C才有机会。不能一台机器人卖几十万元，那普通消费者根本买不起。</p>\n  <p>因为这两个非共识，我觉得这件事有机会，所以决定出来做。</p>\n  <p><strong>硬氪：你说有信心把成本降下来，具体的判断依据是什么？</strong></p>\n  <p><strong>李银川：</strong>比如具身数据成本，我们测算过，并不是所有数据都需要通过真机操作采集，这一点现在已经逐渐成为行业共识。我们90%使用合成数据，整体成本可以降低10到100倍。</p>\n  <p>数据成本降下来之后，就是机器人本体。我们核心团队充分交流后认为，通过完整自研，而不是采购别人的零部件进行组装，同样可以把成本做得比较低。</p>\n  <p><strong>硬氪：你们一直强调模型的泛化能力。但现在家庭机器人的基础能力还没有特别强，这个阶段强调泛化，会不会有些早？</strong></p>\n  <p><strong>李银川：</strong>家庭机器人现在交互能力不强，很重要的原因就是它不够泛化，所以我们才更需要做泛化模型。目前行业里很多架构并没有真正朝泛化去做，而是在比谁能把单点任务做到更好。</p>\n  <p>大部分具身公司都在发布很酷炫的Demo，但对真正落地考虑得还不够。现在的家庭机器人有点像早期自动驾驶，做出一段特定道路上的效果，就觉得L4、L5时代马上要来了，但实际上中间还有很长的路。</p>\n  <p>让家庭机器人真正落地，核心是把基础能力做到足够通用。机器人进家最难的，不是完成一次精巧的演示，而是在不同家庭里都能稳定把活干完。这件事最难，所以我们才强调要做最泛化的大模型。</p>\n  <p><strong>硬氪：那你觉得现在具身智能行业的真实发展水位在哪里？</strong></p>\n  <p><strong>李银川：</strong>整个赛道其实还好。具身大模型还没有到能力涌现的时刻，但一些头部学者判断这个时间不会特别远，有人觉得是一两年，也有人觉得是三五年。</p>\n  <p>等真正出现能力涌现的时候，我认为机器人赛道的商业价值会比大语言模型更有想象力。现在大语言模型公司的估值普遍比具身公司高一个数量级，平均来看差10倍没有太大问题。它们现在的盈利也没有那么高，只是大家已经看到能力涌现之后比较明确的增长空间。</p>\n  <p>但如果具身模型有一天真正出现能力涌现，机器人的商业价值毫无疑问会远超大语言模型，我认为可能是其10倍以上。所以回头看，如果具身模型真正涌现，具身公司的估值可能还有非常大的增长空间。</p>\n  <p>整个赛道近期可能会有波动，但我觉得远没到泡沫彻底破灭的阶段，关键还是看具身大模型什么时候出现能力涌现。</p>\n  <p><strong>硬氪：为什么你觉得现在整个行业的进展还不够快？</strong></p>\n  <p><strong>李银川：</strong>我觉得现在大部分具身公司，包括整个行业，还不够聚焦。大家一直沿着比酷炫Demo的方向发展，只会把市场预期拉得越来越高，但离真正交付越来越远。</p>\n  <p>如果行业能更聚焦真正有价值的场景，认真做数据，把数据量做上来，把数据成本降下来，整个行业的发展会顺利很多。</p>\n  <p><strong>硬氪：这是不是因为大家都觉得，真正落地还很远？</strong></p>\n  <p><strong>李银川：</strong>对，所以这样发展下去，会导致整个行业变得不太健康。</p>\n  <p><strong>硬氪：现在市场对具身智能的投资逻辑有没有发生变化？投资人会越来越看重什么？</strong></p>\n  <p><strong>李银川：</strong>我觉得很快会发生变化。此前行业处于概念验证和高预期阶段，资本更看重技术前景；但随着产品逐渐走向真实场景，市场逻辑自然会回归本质。</p>\n  <p>所以未来投资人不会再简单为团队背景买单，而会更看重企业能否真正落地到场景中，并形成可持续的商业闭环和造血能力。</p>\n  <p><strong>硬氪：具身智能的发展很像在重复自动驾驶的故事。你觉得未来也会走类似的路径吗？</strong></p>\n  <p><strong>李银川：</strong>肯定会有很多相似的地方。自动驾驶公司很多，有坚持做L3的，也有一开始就要做L4的，后来确实出现了很明显的分化。具身公司也会一样。</p>\n  <p>有些自动驾驶公司一开始就定位做L4、甚至L5，我并不看好。我觉得真正商业价值最大的，反而是早期定位做L3、一步一个脚印往前走的企业。这对我们来说，也有很多可以借鉴的地方。</p>\n  <p><strong>硬氪：你们是怎么划分机器人智能等级的？</strong></p>\n  <p><strong>李银川：</strong>我们之前定义过L1到L5的智能能力标准。L1更像玩具、遥控和DIY产品，有可玩的商业价值；L2可以完成基础家务，但还是有限、固定场景，比如在固定环境中完成单一任务；L3能够在一个家庭里完成较长链条的任务闭环，人可以处于待命接管状态，让机器人长时间自动运行，把整理、清洁、洗衣等任务做到比较高的成功率，想象空间可以对标一个基础的家庭助手。L4可以进一步对标保姆的大部分能力，L5则是机器人具备更加通用的能力，甚至可以完成很多原本需要人来完成的工作，这就更加遥远。</p>\n  <p>但机器人并不需要发展到L4、L5，才能产生商业价值。我们重点希望先把L3的商业价值打穿，同时持续向L4探索，验证模型的泛化能力。但现阶段过早孵化L4的商业价值，还是比较困难的。</p>\n  <p><strong>硬氪：L4的想象空间主要在哪里？</strong></p>\n  <p><strong>李银川：</strong>如果真正做到L4，可能需要充分对标一个保姆的大部分能力。</p>\n  <p>但实际上，大部分消费者买机器人时，对机器人的期待并不会像对保姆一样高。如果售价不贵，能够稳定帮忙做一些家务，已经可以产生很大价值。</p>\n  <p>比如扫地机器人，大家的期待其实很明确，它能把地扫干净就可以了，但一样形成了很大的市场。如果机器人能够把很多家务做好，商业价值就已经可以孵化出来。</p>\n  <p>同时，家庭场景中的能力还可以向外辐射到一些半To C场景，比如迎宾、递水、陪伴，以及其他商业场景，并不一定需要完整达到保姆的能力。</p>\n  <p>而如果真的要像保姆一样收拾家庭，对速度、成功率，甚至做饭等能力，要求就会高很多。</p>\n  <p><strong>硬氪：如果先做专用或特定场景，再逐步走向泛化，这条路径会不会更现实？</strong></p>\n  <p><strong>李银川：</strong>从技术路线来看，做专用能力对做泛化能力的帮助其实不大，两者的技术差异非常大。</p>\n  <p>有些公司可能先做专用模型，把商业价值跑通，赚到钱之后再去孵化泛化模型。从商业路径上看，这当然可以理解，就是先做简单的事情赚钱，再做复杂的事情。但从技术路线演进来看，我觉得它并不是一条自然的路径。</p>\n  <p>做过拟合的系统和做大模型，本质上是两件事。语言模型十年前就能写诗，很小的LSTM也可以写古诗、背诵内容，但真正到今天的大模型才产生巨大的商业价值。原因是它具备了更强的推理能力，能够理解人的意图，也足够泛化，生产力才真正被释放出来。</p>\n  <p>具身智能也是一样。如果大家一直拼命做过拟合场景，把所有工程师都投入到单点任务的工程交付里，这些能力不会自然沉淀到通用模型底座里。从技术路线来看，它对最终的泛化模型帮助并不大，只能说可以提前产生一些收入。</p>\n  <p><strong>硬氪：那诺因怎么在坚持泛化路线的同时，解决商业化和收入问题？</strong></p>\n  <p><strong>李银川：</strong>这也是我们正在持续解决的问题。我们已经找到了一些方法，在坚持泛化大模型长期目标的同时，沿途不断找到商业价值。</p>\n  <p>并不是一定要卷过拟合场景才能赚钱。同样是在消费级、To C的很多场景里，只要能力做得足够泛化，就会有很多场景可以适配我们的机器人，我们也可以找到中间的盈利点。</p>\n  <p>只要商业模式能够跑通，我们还是会坚持走最泛化的技术路线。</p>\n  <p><strong>硬氪：你说的中间盈利点，可以具体举个例子吗？</strong></p>\n  <p><strong>李银川：</strong>比如我们现在主要在做整理、清洁、洗衣这样的家务机器人，同时也可以寻找这些能力在其他场景中的应用。</p>\n  <p><strong>硬氪：具身智能距离真正大规模商业化，还需要跨过哪些关键难关？</strong></p>\n  <p><strong>李银川：</strong>现在只能说，我们已经把这条路线的可行性初步跑通了。比如数据降本、本体降本，以及模型泛化能力，都得到了一些验证。</p>\n  <p>但真正做到量产，以及达到非常高的作业成功率和商业化标准，都还需要持续攻坚。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_694987da7e2f45628156b065a14b66e3@6221844_oswg4716oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>更务实的世界模型</strong></p>\n  <p><strong>硬氪：业内对合成数据一直存在一些质疑，你们怎么看？</strong></p>\n  <p><strong>李银川：</strong>合成数据关键还是看怎么用。首先，生成的数据质量够不够高；其次，数据有没有真实标签，标签够不够准确，这些都是挑战。</p>\n  <p>如果这些问题能够解决，我们对基础家务场景做过测算，合成数据的能力是足够覆盖的。</p>\n  <p><strong>硬氪：用合成数据训练出来的模型，和真实家庭环境之间会不会存在较大差距？</strong></p>\n  <p><strong>李银川：</strong>主要还是看生成引擎和模型架构本身。我们生成的场景和真实家庭已经比较接近，不是传统意义上那种纯仿真数据。更重要的是，不同模型路线对Sim-to-Real的敏感程度并不一样。传统模仿学习更强调拟合人类真实操作轨迹，如果仿真中的动作轨迹、接触和动力学与真实世界存在偏差，模型就容易把这些偏差一起学进去。</p>\n  <p>我们的路线不是简单复现一条真实轨迹，而是通过统一的自回归模型，把视觉、语言、空间关系和动作统一建模，让模型先理解当前世界状态、任务目标和动作结果，再生成新的动作。因此，合成数据更重要的是提供准确的空间关系、物体状态、动作结果和训练标签，而不是要求每一条轨迹都和真人操作完全一致。最后再通过少量真实数据和真机执行反馈持续对齐，进一步缩小Sim-to-Real的差距。</p>\n  <p><strong>硬氪：后续会考虑自己采集真实数据吗？</strong></p>\n  <p><strong>李银川：</strong>会考虑，我们现在也在自己采集一些数据，包括Ego-Centric第一人称视角数据等。但比例比较小，我们没有大规模去做需要真人操作的真机数据采集。</p>\n  <p><strong>硬氪：在诺因的GLOW架构里，你认为哪些能力尤其重要？</strong></p>\n  <p><strong>李银川：</strong>我们在GLOW里面，比较早地把一整套世界模型和具身大模型框架梳理清楚，并完整地组合起来使用。大致可以分成三类。</p>\n  <p>第一类，是以前做视频生成的公司或者学者在做的世界模型，通过视频生成去生成真实世界。在我们这里对应KnowinDream。我们没有把它直接叫世界模型，而是叫生成式具身数据引擎，本质上是一套合成数据引擎，用来生成大量Ego-Centric 3D数据。</p>\n  <p>第二类，是从仿真路线发展过来的技术，更强调对世界进行可交互建模。我们叫KnowinWorld。机器人可以在里面对推理后的动作提前进行尝试，并基于尝试结果自主演进、修正动作参数，它是一套可交互3D世界模型。</p>\n  <p>第三类，是通过隐空间学习方法，让模型学习物理关系和世界因果。在最新的GLOW架构里，我们把原来的Brain和Act能力统一到了KnowinGLOW中，用同一个多模态自回归模型完成视觉理解、空间推理、任务规划和动作生成，理解和行动在统一表征下端到端学习。</p>\n  <p>这三类能力，再加上外围的记忆、自主演进以及上层决策调度机制，几类能力融合在一起，才能构成机器人在家庭中的完整闭环。</p>\n  <p>所以我们不会刻意强调某一个模块是不是“完整的世界模型”，我们更强调的是，怎么把家庭具身大模型真正做到足够泛化，这是一条比较务实的路线。</p>\n  <p><strong>硬氪：GLOW强调从训练、执行到反馈形成闭环，并持续自我进化，这一过程具体是怎么实现的？</strong></p>\n  <p><strong>李银川：</strong>比如在世界模型里，我需要让机器人把一个水瓶摆正。大模型早期用了一些训练数据，其中90%是合成数据。如果某些标签还不够准确，最终生成的动作轨迹就可能存在偏差，水瓶可能没有完全摆垂直，而是有一定倾斜。</p>\n  <p>碰到这种情况，我们可以在交互引擎里对最终结果进行打分，再根据结果对参数进行调整。</p>\n  <p>其次，在世界模型里纠正一遍以后，我们还会进行真机测试。真机产生的正负样本数据会继续回流到底座，通过RL等方式进行强化学习和对齐，帮助模型进一步调整参数。</p>\n  <p>整个过程有点类似现在大模型做代码。早期做Code模型时，需要很多人去调数据；现在模型可以自己推演、自己探索，通过编译器观察代码执行结果，再根据结果打分，反过来推动模型内部能力对齐。</p>\n  <p>我们希望在机器人领域建立的，也是一整套类似的自主演进体系。进一步说，就是让真实执行反馈回流到数据生成和训练链路，形成“模型变强—数据变好—下一代模型更强”的RSI递归自我改进闭环。</p>\n  <p><strong>硬氪：KnowinWorld和传统物理模拟器，是完全不同的技术路线，还是本质上比较接近？</strong></p>\n  <p><strong>李银川：</strong>我觉得它和物理仿真器的技术路线还是比较接近的。</p>\n  <p>早期的物理模拟器、仿真器其实就已经具备很强的可交互性，但覆盖度、真实感等方面存在比较大的问题，所以后来大家不太愿意强调这条路线。</p>\n  <p>现在随着技术升级，数据量更多了，引擎生成的数据更逼真，渲染效果更好，物理建模也更加完善，所以大家开始把这类技术叫世界模型。</p>\n  <p>从我的理解来看，它也可以看作是从传统物理引擎逐步演进而来的升级版技术。</p>\n  <p><strong>硬氪：GLOW从执行、反馈再回到数据和训练，完成一次完整闭环迭代，大概需要多久？</strong></p>\n  <p><strong>李银川：</strong>内部做验证时，迭代其实非常快。</p>\n  <p>比如做一个新能力，先生成一批数据，专门合成之后交给KnowinGLOW训练，训练完成后再进行动作推理和对齐。整套流程走一遍，现在可能一两天就可以完成。</p>\n  <p>目前我们的数据量和模型规模还没有达到大语言模型那么夸张的量级，相对来说还是“小模型”，所以迭代速度很快。</p>\n  <p>未来随着数据量越来越大，我们希望把一次完整版本升级控制在一到两周左右。</p>\n  <p><strong>硬氪：你们为什么选择折叠双臂构型？当时主要考虑了哪些家庭场景需求？</strong></p>\n  <p><strong>李银川：</strong>早期其实也不是现在这个设计，我们去年尝试过很多不同的形态。但有一个方向一直很明确：机器人如果要进家庭，一定要尽量往小做。</p>\n  <p>我们不希望家里放一个很大的“铁疙瘩”，不工作的时候还占地方，搬不动，也很碍事。所以我们希望机器人尽量小、圆润，不工作的时候可以折叠起来，让人不会觉得危险。收起来之后就是一个比较紧凑的方块，也不容易伤到人。</p>\n  <p>目前人形机器人在噪音、安全性等方面都还有一些问题，整个技术也没有完全成熟。所以我们现阶段选择先做底盘，稳定性更高，续航也比较好，而且更安静。</p>\n  <p>折叠这个想法其实很多人可能都想过，但真正实现起来难度还是挺高的。</p>\n  <p><strong>硬氪：复杂到什么程度的任务，是现阶段机器人做不了的？</strong></p>\n  <p><strong>李银川：</strong>从技术架构上讲，其实很难简单说哪一类任务是“绝对做不了”的，更多还是要考虑真正落地的难度。</p>\n  <p>比如做饭，从架构上看当然可以做，但离真正落地还很远，因为里面要考虑的问题太多。就算机器人能做饭，还要考虑谁买菜、谁洗菜。如果用户需要提前把菜买回来、洗好、全部准备好，只让机器人完成最后一步做饭，其实也未必有很大的实际价值。</p>\n  <p>所以我们更关注的不是“理论上能不能做”，而是哪些能力能够真正稳定落地，并给用户创造价值。</p>", "category": "tech", "published_at": "2026-09-29T01:00:00+00:00", "fetched_at": "2026-09-29T03:55:09.124246+00:00", "fingerprint": "bc887b361c2aeeab"}, {"source": "36氪 - 最新文章", "title": "岳麓大会观察：当AI走出聊天框，湖南的老本行有了新价值", "url": "https://36kr.com/p/4003807739105158?f=rss", "summary": "<p>文｜杨媛</p>\n  <p>编辑｜彭孝秋</p>\n  <p>近日，2026岳麓大会在长沙举行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_839ec781167242599b14e128a35fb3f8@430412560_oswg1290916oswg1266oswg844_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>今年的大会几乎被AI包围。从AI+机器人、AI+先进制造，到AI+脑机接口、AI+数字内容，大会设置多个AI相关主题论坛。同期举行的AI+创新创业展，则把1600平方米展区按照数据、模型、硬件三大技术要素展开，汇集68家企业、156件展品。其中，仅硬件与终端产品展区就聚集40家企业、106件展品。</p>\n  <p>机器人、无人矿卡、工业视觉、端侧模型、高质量数据集……相比单纯讨论模型参数，现场更密集出现的是已经开始进入具体产业场景的AI产品。</p>\n  <p>作为大会举办地，湘江新区也是湖南AI产业较为集中的区域。主办方称，目前新区集聚人工智能及关联应用企业超1600家，规上企业营收达440亿元；近百家具身智能重点企业在此集聚，相关产业营收突破百亿元。</p>\n  <p>这也提供了一个观察湖南参与这一轮AI竞争的窗口。</p>\n  <p>如果以基础模型、头部AI创业公司和风险资本密度衡量，湖南并不是国内AI产业最显眼的区域。从全国范围来看，北京、深圳、上海、杭州等城市集聚了更多AI企业和大模型资源；湖南备案大模型数量虽然居中部前列，但放到全国，体量仍然有限。</p>\n  <p>但当AI开始从数字世界进入物理世界，另一套能力正在变得重要。工厂、矿山、工程机械，以及过去几十年围绕这些产业形成的工程经验、生产数据和制造能力，正在成为AI落地的另一种基础设施。</p>\n  <p>这恰恰是湖南的老本行。</p>\n  <h3><strong>AI进入物理世界</strong></h3>\n  <p>在岳麓大会展厅里，机器人是最显眼的一类展品。</p>\n  <p>中科云谷带来了双足、轮式人形机器人以及四足机器狗；视比特展示了全尺寸工业人形焊接机器人；万为机器人则带来了应用于巡检、安防等场景的移动机器人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_7d10af65458b4d23b904c538d9c2f0ce@430412560_oswg1249634oswg1266oswg844_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>但当机器人真正进入工厂、矿山和工程现场，问题已经不只是“能不能造出机器人”。</p>\n  <p>中联重科、中科云谷机器人事业部副总经理佘玲娟告诉硬氪，相比数字世界，工程机械面对的是更加复杂的真实环境，机械、电气、液压系统以及大量非线性变化，都会造成仿真训练与真实部署之间的“Sim-to-Real Gap”。</p>\n  <p>而传统制造企业过去积累的工程能力，在这里开始发挥作用。</p>\n  <p>“我们原来有很多数据，也有很多机电原理和机理模型的积淀。”佘玲娟表示。由于了解设备参数背后的机理和误差来源，企业可以更快完成从仿真环境到真实设备的适配。</p>\n  <p>据中联重科介绍，目前已开发4大类8款具身智能机器人样机，数十台人形机器人已在300多条智能产线的近20个场景中验证。</p>\n  <p>工程机械智能化也提供了另一种落地路径。</p>\n  <p>佘玲娟认为，真正能够替代人的通用人形机器人仍需要时间，但挖沟、刷坡、吊装等工程任务本身拥有明确的工法和容错范围，并不需要等待通用机器人能力完全成熟。“世界模型不需要像人形机器人那么成熟，它就可以搭载到工程机械上产生真正的用处。”</p>\n  <p>这意味着，当AI开始进入物理世界，过去属于传统制造业的机械、电气、液压、工艺和工程数据，也开始成为AI落地所需要的一类技术资产。</p>\n  <h3><strong>制造业，正在提供另一种AI基础设施</strong></h3>\n  <p>工程知识之外，制造业留下的另一项资产是数据。</p>\n  <p>过去几年，大模型大量依赖互联网文本、图片和视频训练。但当AI进入自动驾驶、机器人和工业设备，真实世界中的设备运行、工艺流程和机器交互数据开始变得重要。</p>\n  <p>长沙是首批国家数据标注基地之一。主办方称，目前湘江新区集聚26家重点数据标注企业，建成23个行业高质量数据集，标注数据总量超过10000TB。</p>\n  <p>当地的数据公司也在跟着AI产业发生变化。</p>\n  <p>2015年成立的谱蓝科技，最早从地理信息数据标注起步，随后进入自动驾驶，目前业务已经延伸至大模型、具身智能等领域。公司称，其已经建立数据标注、高质量数据集评测和模型训练等平台。</p>\n  <p>另一端，模型也开始往真实终端走。</p>\n  <p>湖南汇视威选择了端侧AI。公司称，其视觉生成模型“橘洲”基于国产算力进行原生训练，并实现手机端离线运行，目前业务覆盖模型训练压缩、端侧部署优化等环节。</p>\n  <p>这些企业的体量和技术路线各不相同，但指向了同一个变化：当AI从云端进入汽车、机器人和工业设备，竞争不再只发生在模型本身，还延伸到数据、硬件适配、终端部署和工程交付。</p>\n  <p>而这些环节，与湖南原有的制造业基础产生了更多交集。</p>\n  <h3><strong>把场景变成资源</strong></h3>\n  <p>当然，有制造业，并不意味着AI会自然进入工厂。</p>\n  <p>技术公司不知道产业真正需要什么，传统企业也未必知道AI能够解决什么，是技术落地过程中长期存在的问题。</p>\n  <p>湖南正在尝试把“场景”本身组织起来。今年，湖南建立应用场景超市。主办方称，目前已归集279个场景、294项能力供给，入驻企业457家，让技术供给与产业需求进行对接。</p>\n  <p>对AI而言，场景的意义还不只是找到客户。模型进入真实产业后，很多问题只有进入现场才能暴露；设备运行产生新的数据，数据又可以回到模型训练和迭代中。因此，工厂、矿山和工程现场不只是AI最终的应用出口，也开始参与技术本身的迭代。</p>\n  <p>这可能是湖南参与这一轮AI竞争时更值得关注的地方。</p>\n  <p>当然，制造业场景并不能自动转化为AI竞争力。目前，湖南在基础模型、部分核心软硬件和高端人才等环节仍有明显的补强空间。相比北京、深圳、上海、杭州形成的AI产业生态，湖南也仍存在差距。但AI产业本身也在出现新的问题。</p>\n  <p>过去几年，人们关心的是：模型还能变得多聪明？现在，当AI开始控制机器人、汽车和工业设备，另一个问题正在变得重要：模型究竟能不能真正干活？</p>\n  <p>这时，评价体系也随之发生变化。算法之外，需要机械、电气和液压；模型之外，需要设备、工艺和现场交付；训练之外，还需要来自真实机器的持续反馈。</p>\n  <p>从湘江新区正在聚集的具身智能企业，到AI进入工程机械、矿山和生产线，一个变化已经开始出现：当AI开始走出聊天框、进入物理世界，湖南过去几十年积累的制造能力，或许正在成为它参与这一轮AI竞争的另一张牌。</p>", "category": "tech", "published_at": "2026-09-29T01:27:28+00:00", "fetched_at": "2026-09-29T03:55:09.124242+00:00", "fingerprint": "62f49ee4196104df"}, {"source": "36氪 - 最新文章", "title": "斯坦福博士后做柔性触觉传感器，再获亿元级融资｜硬氪首发", "url": "https://36kr.com/p/4001313474645888?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，途见科技（北京）有限公司（以下简称“途见科技”）近日完成亿元级Pre-A++轮融资，由顺禧资本所管理北京市人工智能产业投资基金和北京市新材料产业投资基金联合领投。资金将重点用于底层核心技术研发、自动化产线建设和工艺迭代，并完善具身智能数据采集工具与消费级终端的供应链配套，加快技术成果向终端产品转化。</p>\n  <p>自成立以来，途见科技聚焦可拉伸多模态柔性电子皮肤及触觉感知系统的研发与制造，并以触觉手套、Ego视觉采集方案和SDK为入口，布局触觉数据采集、多模态时间同步与触觉模型算法。创始人兼CEO赖建诚长期专注柔性电子皮肤材料、器件与系统集成领域研究，曾在斯坦福大学鲍哲南院士实验室从事博士后研究，并主导科技部首批国家重点研发计划颠覆性技术创新专项等国家级重点项目。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_3df2d83b2d944520add320727fa26920@6022551_oswg101322oswg1500oswg1002_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">途见科技创始人兼CEO赖建诚（图源/企业）</p>\n  <p>触觉正成为具身智能从“能走能动”迈向“可靠干活”的关键拼图。</p>\n  <p>过去几年，行业技术突破主要集中在视觉感知与运动控制两大方向。依托视觉模型，机器人可以识别环境、定位物体；结合运动控制算法，能够规划行进路线、复刻复杂肢体动作。但这些能力大多属于远距离感知和非接触式运动执行。一旦机器人执行抓取、装配等精细物理交互任务，仅靠视觉难以直接获取接触力、形变等力学信息，感知短板随之显现。</p>\n  <p>不同于视觉可依托互联网海量公开图像、视频完成训练，触觉目前缺乏现成可复用的大规模语料。抓取、按压、滑动等物理交互中的作用力大小与方向、接触面受力分布、滑移趋势和温度差异等信息，通常需要在真实接触的瞬间产生并实现采集。</p>\n  <p>一套稳定可用的触觉感知系统，需要准确定位接触点位、保持信号稳定，并在接触面实现完整、一致的采样。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_14bfea1d2a564a889ad891a9a9ffd8bd@6022551_oswg128094oswg1920oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">途见触觉数采手套（图源/企业）</p>\n  <p>底层材料与器件工艺是实现这一目标的基础。途见科技的柔性电子皮肤触觉感知系统采用自研的弹性体复合电子浆料体系，在控制成本的同时，拉伸率超过100%且可完全回弹，弯曲半径小于1毫米，可适配异形复杂曲面，提升动态形变场景下的使用稳定性。</p>\n  <p>在此基础上，单片电子皮肤集成多模态传感阵列，标准产品每平方厘米布设400个传感单元；依托拓扑结构设计，可同步采集压力、温度、切向力、表面纹理以及接近觉等多维信息。其中，接近觉可在物体尚未接触时，最远于20厘米处感知其靠近；切向力传感器则通过单点感知与阵列化设计，获取曲面不同位置的切向力信息。</p>\n  <p>硬件实现可靠、稳定的感知只是第一步。如何持续获取高质量触觉数据，并让模型有效使用这些数据，是触觉技术走向具身智能应用的下一道关口。</p>\n  <p>途见推出的TachinGlove柔性触觉数据采集手套，可采集法向力、切向力等多模态信息，具备千级传感点位，能感知mN级微小力。核心的空抓无脏信号设计更是为提高触觉数据纯净度、降低后续清洗成本提供了源头解决方案。</p>\n  <p>有了好的硬件入口，还要实现高质量触觉数据的稳定大规模获取、完成多模态信息时间对齐，并最终输出可供模型直接调用的有效信息。</p>\n  <p>当前一条重要路径，是借助穿戴式触觉采集设备完成数据积累。操作人员佩戴触觉手套完成各类实操动作，设备同步记录触觉信号、画面信息与手部姿态，将人类在真实物理世界的操作经验转化为机器人可学习的多模态训练素材。其优势，是无须等待高自由度灵巧手整机成熟，就可在真实操作中持续积累触觉\u001e视觉\u001e姿态对齐的数据。</p>\n  <p>但穿戴式采集并非简单地把传感器集成到手套本体，关键在于产出的数据能否满足模型训练要求。若触觉信号与视觉画面存在时间差，“看见”和“触摸”的信息便难以对应，影响训练效果。</p>\n  <p>针对这一问题，途见在推出TachinGlove触觉手套时配套自研Ego方案，实现触觉与视觉的毫秒级时间对齐；客户也可借助官方SDK，对自有Ego设备进行数据同步校准。经过对齐处理，触觉数据具备了接入多模态训练链路的基础条件。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_27e7d7420cf84fb0851a96d94bb9bab9@6022551_oswg131821oswg1920oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">途见触觉数采手套（图源/企业）</p>\n  <p>此外，途见在TachinGlove正式发布的一个月后，又推出了TachinGlove Snap快拆版，使采集模块能够重复使用，更适合高频率、多批次的数据采集场景，为高质量触觉数据的规模化积累提供支持。</p>\n  <p>但仅仅完成数据采集与时间同步还远远不够。下游客户并不会直接解析传感器点阵输出的底层原始电信号，更需要经过加工后的高层语义输出：识别接触事件、判断交互状态，输出可直接对接系统的标准化结果。“有些客户没有意愿去处理底层传感信号，更希望拿到已经完成解析的输出，例如发生了哪类接触行为、交互对象具备哪些特征，从而能够直接接入模型与控制系统。”赖建诚说。</p>\n  <p>这也意味着触觉企业的能力边界不能局限在硬件制造，算法与模型能力同样至关重要。基于对齐后的触觉数据，途见正在搭建触觉专家模型，围绕接触语义理解、滑移检测、空间受力解析和多源时间对齐等能力，探索触觉与视觉、语言、运动控制的VTLA多模态融合。</p>\n  <p>从产业应用看，穿戴式触觉采集设备的价值，早已超出传感器硬件本身，而是为整个触觉智能赛道搭建起可复用的数据底座。稳定采集、精准同步与模型化解析相互衔接，才能让触觉数据从原始信号走向可复用的训练和交互信息。</p>\n  <p>目前，途见以材料和器件工艺为底座，以触觉手套与消费级电子皮肤为产品入口，叠加高精度数据同步、触觉专家模型、VTLA多模态融合的上层能力，进一步搭建起“硬件+数据+模型”的完整触觉感知解决方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_90c87f2b606546a6af35def5d0394eb2@6022551_oswg180040oswg2000oswg1333_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">途见柔性触觉技术在灵巧手上应用（图源/企业）</p>\n  <p>在商业化进度上，途见科技并没有把全部赌注押在具身智能赛道。一方面，公司面向机器人本体企业提供灵巧手全覆盖触觉、机械臂防碰撞和全身感知方案；另一方面，将技术向智能汽车、消费硬件、健康监测、情感陪伴等场景延伸，落地智能座舱感知与防夹系统、智能睡眠监测床垫、足底姿态康复感知设备、AI交互玩偶等产品。</p>\n  <p>不同业务场景下，客户的核心诉求各有侧重。处于研发阶段的具身智能更看重方案适配能力；消费级硬件则对成本、器件寿命和批量生产一致性提出更高要求。</p>\n  <p>目前，部分灵巧手项目仍处于小批量定制开发阶段，产品指节结构差异较大，开模与人力成本分摊到少量样品上，推高了单件价格。相比之下，消费硬件往往是十万级起订量的标准化订单，一套模具便可持续投产，能够充分摊薄开模、工艺、人力等各项投入，把器件单位成本压到更低水平。</p>\n  <p>赖建诚表示，“单纯依托机器人领域的科研小单，很难实现触觉器件的规模化降本，我们需要借助消费端标准化量产，完成整套供应链的成本闭环。”</p>\n  <p>从具身智能到消费级应用，途见科技正在验证一条从材料创新到系统输出的完整路径。按照规划，公司将在北京建设自动化产线，将柔性电子皮肤的制备从手工间歇模式升级为连续性制造，以提升规模化交付能力。</p>\n  <p><strong>以下为硬氪与途见科技创始人兼CEO赖建诚的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：当前业界对触觉交互的技术路线是否形成相对统一的共识？工程化卡点主要集中在哪些维度？</strong></p>\n  <p><strong>赖建诚：</strong>业内对于触觉传感系统的关键评价维度，已经形成初步共识。其中有两点尤为关键：一是传感单元的空间分布能力，二是输出信号的保真与准确度。</p>\n  <p>实际开发中，首先要避免空间采样定位偏差。如果接触点作用于阵列左侧，传感输出的坐标却偏向中部，这类空间定位误差会直接引发系统算法误判，影响功能可靠性。</p>\n  <p>另一类问题是传感阵列的感知盲区：在外力均匀加载、应力弥散分布时，阵列内部若有局部采样点缺失，形成类似“斑秃”的感知空洞，就会导致全域触觉感知的一致性被破坏。参加行业展会时，我通常会直接对诸多参展的样机做按压、摩擦等实机测试，一些在实验室标定条件下不易显现的问题，可能在更接近真实使用场景的测试中暴露。</p>\n  <p>整个行业仍在解决触觉传感的工程化问题。据部分下游客户反馈，一些方案存在需要频繁标定、传感信号漂移等情况；即使将连续变化的模拟信号简化为触发判断，也可能出现误触发或漏触发。要进入实际应用，长期稳定性与信号一致性必须经得起验证。</p>\n  <p><strong>硬氪：目前触觉传感赛道参与者众多，站在行业视角，如何看待未来1到3年的竞争格局？</strong></p>\n  <p><strong>赖建诚：</strong>现在赛道涌入大量同行，我认为这是一个积极信号。但要看到，当前触觉技术真正的竞争对手，其实并非行业内的同类方案，而是纯视觉方案。</p>\n  <p>从具身智能兴起至今，始终存在一种观点，即仅凭视觉信息就可以解决机器人绝大部分感知任务，触觉并非必需。但触觉要证明的是，缺少触觉感知，很多任务就无法高质量完成 —— 视觉可以复刻动作表象，却无法捕捉接触交互背后的物理本质。</p>\n  <p>现在入局者变多，代表行业正在走向成熟，但最终会走向怎样的格局？核心落脚点，是做出真正适配具身智能需求、可落地的产品，其中有两个基础底线，一是外形与形态的适配能力，二是传感数据的保真度。</p>\n  <p>仅仅做出可用的硬件，本身就已经是巨大挑战。触觉传感器属于全新的自研器件，需要在材料、器件和工艺上持续研发，并不像部分赛道可以通过现有零部件集成拼装出成品。这有点类比早年柔性显示行业，当时涌现出一大批创业公司，都瞄准柔性显示赛道；但只有真正做出性能达标、满足终端实际需求的产品，解决形态适配、弯折可靠性这类硬性指标之后，行业才完成一轮收敛。这非常考验企业的综合工程实力。</p>\n  <p>未来1-3年，我们首要目标是实现高性能、高可靠触觉传感器件的规模化量产，同时要建立与具身智能客户深度协同的能力。企业不能只停留在硬件交付层面，还需要将触觉信息转化为模型可调用的结构化表征（词元化），降低下游集成成本。</p>\n  <p>所以往后看，具备长期竞争力的触觉企业，不仅要掌握制造能力，还需要补齐算法与模型能力，形成软硬一体化的综合能力，和下游客户开展深度协同开发。</p>", "category": "tech", "published_at": "2026-09-29T02:30:00+00:00", "fetched_at": "2026-09-29T03:55:09.124237+00:00", "fingerprint": "a761460a188f1345"}, {"source": "36氪 - 最新文章", "title": "S创上海2026圆满落幕：站在时代中央，做全球创新的“超级连接器”", "url": "https://36kr.com/p/4003936207982726?f=rss", "summary": "<h2>S-Tron Shanghai 2026 Wraps Up: Standing at the Forefront of Times as a Global Innovation “Super Connector”</h2>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_19d9291e7b68429bb4d51b3430266633@6301044_oswg111005oswg830oswg468_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>9月23日，S创上海2026正式落幕。</strong>作为第六届“海聚英才”全球创新创业峰会创业周的重要活动之一，本届大会由漕河泾开发区联合主办。为期两天的大会汇聚全球创业者、投资人、企业与创新力量，在科技、资本、产业与文化的交汇中，持续构建全球创新连接网络。</p>\n  <p>On September 23, S-Tron Shanghai 2026 officially concluded.As one of the key events of the Entrepreneurship Week of the 6th Shanghai Talent+ Global Innovation &amp; Entrepreneurship Summit, this year’s S-Tron Shanghai was co-hosted with Caohejing. Over two days,&nbsp; the event brought together entrepreneurs, investors, enterprises, and innovators from around the world, forging a global innovation network where technology, capital, industry, and culture converge.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_cd99ebdd4c4544cbb0a0189632836f35@6301044_oswg638019oswg1600oswg1067_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h3>全球创新力量，集中到场Global Innovators Turn Out in Force</h3>\n  <p>本届大会吸引 <strong>15,000+专业观众</strong>，其中包括5,000+创始人、3,000+投资人及3,800+大企业与生态机构代表。</p>\n  <p>This year’s event drew <strong>over 15,000</strong> <strong>professional attendees</strong>, including more than 5,000 founders, 3,000 investors, and 3,800 representatives from major corporations and ecosystem organizations.</p>\n  <p>近200位嘉宾登台分享，<strong>50%为国际嘉宾，来自20多个国家和地区，80%为首次加入S创生态</strong>。与此同时，来自全球近30个国家和地区的600+创业项目参与路演招募，最终120+项目进入复赛及Showcase。</p>\n  <p>Nearly 200 speakers took the stage, <strong>50% being international guests from more than 20 countries and regions</strong>; <strong>80% of them joined the S-Tron ecosystem for the first time</strong>. Meanwhile, over 600 startup projects from nearly 30 countries and regions entered the pitch competition, and more than 120 projects advanced to the semifinals and Showcase.</p>\n  <p>大会之外，<strong>50+场周边活动</strong>同步展开，让创新连接从主会场延伸至更广泛的产业与创业社群。</p>\n  <p>Beyond the main event, <strong>over 50 side events</strong> ran in parallel, extending innovation connections from the main venue into a broader industry and startup community.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_fe90afa367bc466ebc51a7bfbd36c888@6301044_oswg675990oswg1600oswg1067_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h3>从产业创新，到科技与艺术跨界From Industrial Innovation to Where Technology Meets Art</h3>\n  <p>现场展区同样呈现出多元的创新生态。</p>\n  <p>The exhibition floor showcased an equally diverse innovation ecosystem.</p>\n  <p>近<strong>30家特装展商</strong>、<strong>91家初创企业</strong>集中亮相，覆盖AI、机器人、生命健康、绿色科技、未来出行等前沿领域。今年首次设立的 创意展区（<strong>Creator Zone）</strong>，则带来18个AI魔术、智能灯光、AI声音、VR等先锋项目，进一步探索科技与艺术的交汇边界。</p>\n  <p>Nearly <strong>30 featured exhibitors and 91 startups</strong> showcased their offerings across AI, robotics, healthcare and life sciences, green tech, and future mobility. The Creator Zone, launched for the first time this year, featured 18 pioneering projects including AI magic tricks, smart lighting, AI audio, and VR, further exploring the boundary where technology and art intersect.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_0f20337cd93f433ba53238e517f879df@6301044_oswg790980oswg1600oswg1067_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h3>40%国际化，让连接真正发生40% International Participation Makes Real Connections Happen</h3>\n  <p><strong>40%的整体国际化程度</strong>，成为本届大会的重要特征。</p>\n  <p>来自德国、法国、新加坡、韩国、美国、印度及拉丁美洲等地区的代表团参与舞台、展览及10余场国家主题活动。不同市场的资本、技术与创业者在S创现场相遇，也让中国创新与全球创新之间的连接更加具体。</p>\n  <p><strong>A 40% overall international presence</strong> was a defining feature of this year’s event.</p>\n  <p>Delegations from Germany, France, Singapore, South Korea, USA, India, and Latin America took part in stage sessions, exhibitions, and more than 10 country-themed events. Capital, technology, and entrepreneurs from various markets met face to face at S-Tron, making connections between Chinese and global innovation more tangible.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_53446cf7e7c24de0a1c6f097d2788c68@6301044_oswg598095oswg1600oswg1067_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>与此同时，来自<strong>612</strong>所海内外高校、科研院所及企业的青年实践者提交了<strong>1543志愿者</strong>份申请，共同参与大会生态建设。大会全程践行绿色无纸化办会，以数字化方式减少传统会展资源消耗。</p>\n  <p>In addition, young practitioners from 612 universities, research institutes, and enterprises at home and abroad submitted 1543 volunteers applications to jointly build the event ecosystem. The event adopted green and paperless practices throughout, leveraging digital approaches to reduce resource consumption for conventional exhibitions and conferences.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_a78f9fd8deb247c8a128f5326f986519@6301044_oswg22327376oswg6000oswg4000_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <h3>生态永不闭幕，2027定格新时间The Ecosystem Never Closes: 2027 Date Announced</h3>\n  <p>两天大会落幕，但连接仍在继续。现场，S创同步公布了未来三年的大会举办时间。故事还在继续，等待每一位创业者来续写！</p>\n  <p>从项目与资本，到产业与全球市场，S创正在持续成为连接创新者、资本与产业的重要节点。</p>\n  <p>2027年9月22-23日，我们S创上海2027见。</p>\n  <p>Two days may have come to an end, but the connections continue. At the event, S-Tron announced the dates for the next three years.The story is far from over. We can’t wait to see every entrepreneur create their own chapter.</p>\n  <p>From projects and capital to industry and global markets, S-Tron continues to serve as a vital hub linking innovators, investors, and industry.</p>\n  <p>See you at S-Tron Shanghai 2027 on September 22–23, 2027.</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_d086a5ee906746af89d0bfa0d142b1f9@6301044_oswg13540279oswg5359oswg9019_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-29T03:38:45+00:00", "fetched_at": "2026-09-29T03:55:09.124231+00:00", "fingerprint": "587efd507af2e4b5"}, {"source": "36氪 - 最新文章", "title": "圆桌：「具身智能」 打通技术到场景的最后一公里｜36氪 2026 产业未来大会", "url": "https://36kr.com/p/4003813673865351?f=rss", "summary": "<p>2026年，产业投资进入深水区，资本、技术与产业加速融合，旧的投资逻辑不再使用，新的共识正在诞生。2026产业未来大会聚焦新周期机遇，共探产业未来与“中国之光”的诞生。 9月9日至10日，由36氪主办的2026产业未来大会以“深水之上，共振新生”为主题的在北京亦庄举行。来自国资平台、产业投资基金、企业CVC、创新企业及专家学者走到一起，聚焦量子科技等未来产业走向产业化。大会深度探讨当下前沿技术与产业视角，集中展示超导、光量子、离子阱等技术路线突破，分享大量具体产业场景、产业体系搭建、与异构计算前景。共同探讨科技产业投资的未来。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_74efb08a9fe34ca7822241716410ca88@6301044_oswg814799oswg828oswg552_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>王子璇｜云时资本执行董事</strong></p>\n  <p><strong>向其奇｜360集团 投前负责人</strong></p>\n  <p><strong>段亚辉｜盛宇投资 合伙人</strong></p>\n  <p><strong>崔轲迪｜BV百度风投 执行董事</strong></p>\n  <p><strong>石亚琼｜锦秋基金 副总裁</strong></p>\n  <p><strong>王子璇：</strong>各位好，这是今天最后一场圆桌。我们讨论的话题也非常有意思——具身智能如何打通技术到场景的最后一公里。过去一年，整个具身智能市场确实非常火热。我是云时资本的王子璇，非常荣幸今天以主持人的身份和大家探讨这个话题，因为更多时候我也是坐在嘉宾席上和大家一起讨论。</p>\n  <p>首先，在正式开始之前，从其奇总开始，请各位依次简单介绍一下自己以及所在机构的情况。</p>\n  <p><strong>向其奇：</strong>大家好，我是360的向其奇，过去几年主要关注AI方向。</p>\n  <p>段亚辉：大家好，我是盛宇投资的段亚辉。盛宇投资是一支具有深厚产业背景的基金，成立20多年来一直聚焦硬科技领域。目前重点关注半导体、商业航天、具身智能三大赛道，我们始终以产业合伙人的心态，陪伴并赋能优秀的初创团队。</p>\n  <p><strong>崔轲迪：</strong>大家好，我是轲迪，来自百度风投。我们是由百度集团发起的双币早期投资基金，我主要负责前沿科技投资。其实今天很多话题都与我们的投资方向相关，比如脑机接口领域，我们是博睿康和智冉非常早期的股东；商业航天领域，我们投资了轨道辰光等企业，刚好也都在亦庄和海淀。我们也是较早一批投资具身智能的机构，从2023年开始关注这个产业，到现在差不多已经有4年时间，WRC也连续参加了四五届。</p>\n  <p><strong>石亚琼：</strong>我是锦秋基金的石亚琼。锦秋基金成立于2022年，当时我们观察到大语言模型带来的产业变革，因此围绕下一代智能系统进行系统性投资，方向包括AI芯片、具身智能、AI应用、AI硬件以及硬核科技。具身智能是我们系统关注的方向，从2023年开始持续投资，基本覆盖具身智能各个产业链环节，从大脑、小脑、本体，到灵巧手、触觉、传感器、面部等，代表性投资公司包括宇树科技、流形空间、章鱼动力，以及最近上市的Momenta等。</p>\n  <p><strong>王子璇：</strong>非常感谢各位。其实宇树上个月上市了，峰值市值达到4000多亿元，虽然现在有所回调，但仍然是一家非常优秀的公司。过去两年，具身智能在一级市场也基本是融资额最高的赛道之一。今天我们不妨翻过这张成绩单，看一看成绩背后的情况。</p>\n  <p>现在大家普遍关注的一个问题，就是具身智能从实验室里的“能做到”，到车间里的“能用”，中间确实隔着最后一公里，包括可靠性、成本、场景定义和数据飞轮。所以我们先从第一个问题开始讨论。</p>\n  <p>想问问大家，如果单纯从“干活”的角度来看，今天的具身智能机器人相当于几岁的人类？先给大家一个大致标尺：3岁的小朋友能走路，但需要有人看着；5岁的小朋友能够听懂指令、帮忙拿东西；7岁的小朋友已经能完成一些简单任务，但复杂任务仍然比较困难。放到具身智能场景里，大家觉得现在机器人的可靠性和连续作业能力，大概相当于几岁的小朋友？另外，机器人的能力会线性增长，还是会出现突变式增长？现在手、脑、眼这些“器官”里，到底是哪一个环节跟不上，或者最需要发展？大家可以广泛谈一谈。</p>\n  <p>石亚琼：我把这个问题拆解一下。就我自己的观察而言，今天我们谈的是“干活”，但干活能力和年龄并不是100%对应的。其实在相对专用的机器人领域，机器人已经干了很多活，也工作了很长时间。今天我们真正讨论的是通用人形机器人到底相当于几岁，这件事本身存在争议。从产业视角来看，我觉得今天存在几种不同的价值。</p>\n  <p>一种卖的是“上限”。比如今天通用人形机器人更多体现的是能力上限的价值，很像运动员或者童星，解决的是稀缺性问题。如果这种稀缺性足够强，比如跳得足够高、足够远，或者能够完成人做不到的事情，就能够产生价值。所以今天它可能已经像一个能够“干活”的童星或者运动员。</p>\n  <p>但大家通常想象的是“上班”的场景，这时候要求的是机器人的能力下限：不管遇到什么问题，都能够以合理的节拍稳定工作8个小时，出了问题还能自行恢复。对于一些专用机器人而言，上一代产品已经解决了不少类似场景。但今天的通用人形机器人是否适合进入这样的场景，我认为仍然存疑。这是我的观点。</p>\n  <p><strong>崔轲迪：</strong>就像我们之前一直分享的一样，我们可能不会从这个角度出发。从2023年开始投资具身智能时，我们其实很少讨论机器人“干活”这件事。当时我们把具身智能和人形机器人产业分开来看，更多从“智能”的角度理解这个产业。如果从智能的角度去理解，它更符合Power Law，也就是幂律发展的逻辑：前期进展非常缓慢，但达到某个临界点以后，能力会以非常高的速度加速增长。</p>\n  <p>所以，我们更关注整个产业中“智能”发展的速度。再往下拆，我们更关注不同具身公司的训练投入以及基础模型的发展。我们认为，当基础模型达到一定临界点之后，再去讨论“干活”这件事，对我们而言可能更有价值。这是我们的思路，可能和部分同行不太一样。</p>\n  <p><strong>段亚辉：</strong>首先，我的观点和主持人的设定稍微有些不同。我们不会直接用人类年龄做线性对比。不管是3岁、5岁还是7岁的孩子，本身都具有自主探索能力。比如一个3岁的孩子想吃糖，会自己剥糖纸；想喝水，会自己拿杯子；如果杯子比较重，也会主动多用一点力。</p>\n  <p>但对机器人来说，目前仍然主要基于模仿学习，你教它什么，它就会什么。所以从这个角度来看，直接和人类年龄做线性类比并不完全合适。不过从我们了解的情况来看，从去年Q4开始，已经有机器人进入结构化场景真正开始“干活”，而且ROI也可以算得出来。</p>\n  <p>第二，至于未来能力是线性增长还是爆发式增长，我认为随着数据增加以及更多细分场景落地，机器人的技能可能会出现爆发式提升。至于刚才提到的“器官”发育卡点，我认为目前可能仍然主要在大脑端。我们希望进一步提升基础模型的潜力和能力上限，从而推动整个具身智能行业实现质的飞跃。</p>\n  <p><strong>崔轲迪：</strong>其实就像刚才几位嘉宾分享的，我觉得这个问题确实比较难回答。我们现在甚至还没有真正找到适合这一代具身智能的应用场景。如果一定要类比上一代工业机器人或者此前的家用机器人，我觉得现在的能力可能还处在一个非常早期、近似“胚胎”的阶段，大脑基本还没有真正长起来，手也只相当于刚刚长出两根手指。</p>\n  <p>所以，现在讨论“干活”可能还是稍微有点远，很难做特别准确的判断。增长一定会存在跳跃式的阶段。具身智能的核心还是智能，而智能的核心是模型。在模型架构都还没有确定的情况下，一定存在跳跃式增长的空间；如果架构确定以后只做Scaling，那可能更接近线性增长。现在我们还没有找到真正适合具身智能方向的模型，大家都还在探索，因此这个领域仍然有很多值得期待的空间。</p>\n  <p><strong>王子璇：</strong>看来大家还是有一定共识的，目前“大脑”和人类相比仍然存在比较大的gap。下一个问题，我们回到具体场景和效益来讨论。此前具身智能讲家庭场景会多一些，但目前真正落地比较多的还是工业场景。虽然现在很多具身智能机器人公司已经有收入，但有收入并不等于这个产业真正具备经济效益。进入具体场景以后，大家最终还是会算一笔账：在某一个生产环节里，用机器人替代人力，到底是不是比雇人更便宜。</p>\n  <p>目前大家看到比较多的场景，包括工业搬运、质检、分拣或者3C装配等。想请各位分享一个最近看到的比较扎实、真实的场景，也就是不是依靠补贴或者其他非市场化因素，而是在真实商业关系中，具身智能已经能够承担一部分工作。同时也请大家聊一聊，已经跨过经济效益线的场景到底有哪些共性？下一批可能跨过效益线的场景又会在哪里？大家会不会围绕这样的场景进行投资？</p>\n  <p><strong>向其奇：</strong>我觉得这个问题本质上是在讨论商业化。商业化可以简单拆成硬件和软件两部分。过去五年，尤其是具身智能相关硬件的成长速度非常快。短短五年时间，我们看到很多核心零部件从完全不可用，发展到今天已经能够基本使用，这本身已经是非常快的进展。</p>\n  <p>同时，也可以看到很多本体公司和零部件公司确实拿到了一些真实订单。虽然有人会质疑，说大家只是把存货变成现金流，再把现金流变成存货，但我觉得至少还是存在一部分真实的商业需求。</p>\n  <p>所以，硬件这几年的发展其实比我的预期更快。至于软件，也就是模型，我对模型商业化的理解是：商业化的本质应该是模型能力的溢出，而不是目标。这个阶段，我也和很多具身智能公司的创始人交流，他们往往都是技术背景，但总会给我讲很多商业化故事。坦率说，我觉得双方都很辛苦。我甚至建议各家具身模型公司，直接把“商业化”三个字从BP里删掉，否则你讲得难受，我听得也难受。</p>\n  <p>所以，我觉得这个阶段没有必要相互折磨。现在唯一真正需要做、而且应该重度投入的一件事，就是做模型，把模型能力的上限提高。这是整个具身智能赛道的根基，没有模型，这个赛道本身就不应该存在。</p>\n  <p>因此，对于模型商业化，我现阶段完全没有期待。我只是希望模型能够真正向前走一步。</p>\n  <p><strong>段亚辉：</strong>我亲眼见到过两个比较具体的场景。第一个是从去年Q4开始，已经有企业在结构化场景中实现了O2O前置仓的无人化部署：一端连接淘宝、美团等线上平台，另一端由机器人在无人前置仓中进行值守和作业。另一个场景是物流分拣。今年无论是在WAIC还是WRC上，都能看到物流包裹分拣机器人。去年大约每小时能够处理400件，今年上半年已经达到1000到1200件，最近WRC上还有企业能够做到1800件。可以明显看到产品在快速迭代，也能够看到它们在具体场景中的真实落地。</p>\n  <p>这两个场景有一个共性，就是任务相对明确，同时操作对象具有一定泛化性。比如快递场景面对不同形态的包裹，前置仓则面对不同的瓶瓶罐罐，但整体仍然是在结构化环境中运行。至于下一批可能跨过效益线的场景，我们也做过一些初步思考，可能会出现在泛服务、To C、轻操作等领域，未来会逐渐开始探索和落地。谢谢！</p>\n  <p><strong>崔轲迪：</strong>我们内部其实总结过投资策略的变化。从2023年到2025年，我们的策略经历了从“本体+智能”，到“数据+智能”，再到“场景+智能”的变化。从场景角度，当时我们只是画了几个大方向：一批公司做工业，一批做泛生活或者零售场景。但到2025年底，我们把执行了三年的这套投资策略基本推翻了。</p>\n  <p>我们发现，最早支持的一些公司起初做工业场景，后来也会逐渐进入零售；原来做零售场景的公司，也开始讲家庭场景、探索家用产品；做基础模型、本体或者数据的公司，也都在向上游或下游拓展。结合我们过去投资自动驾驶的经验来看，这其实是产业早期非常正常的状态。所以到后来，我们很少再执着于某一个具体场景。</p>\n  <p>截至2026年，如果只讨论那些已经具备商业化闭环的场景，我会关注两类。一类是格斗、表演等娱乐型场景；另一类是真正能够干活的场景。比如我有一位朋友做咖啡机器人，在很多商业场所都能够看到机器人做拉花咖啡、拿铁，而且确实能够赚钱，也不完全是传统纯自动化设备。</p>\n  <p>所以，截至2026年，如果暂时不讨论基础模型能力，这些具体场景已经能够形成比较明确的商业化闭环。但整体上，我对产业的判断和向总非常接近。我更关注基础模型和智能能力，具体场景能不能形成商业化闭环，并不是我作为早期投资人、早期VC最关注的问题。</p>\n  <p><strong>石亚琼：</strong>我们的观点和前面三位比较一致。具身智能投资大致可以分为三个阶段：第一阶段投资硬件、本体技术提升以及上游产业链；第二阶段，也就是我们认为当下真正的重点，是模型能力和大模型机会；第三阶段才会进入场景。所以我认为今天这个阶段谈大规模商业化仍然稍微早了一些，也很难真正看清。</p>\n  <p>刚才其奇总有一点我非常认同，商业化本质上应该是技术的外延和溢出。今天能够看到的溢出，主要还是来自本体能力的提升。但我觉得还有一个稍微不同的角度：大家谈商业化往往只想到“干活”，但商业演出是不是一个产业？科研是不是一个产业？这些同样也是商业化场景，并不是只有制造业才算商业化。</p>\n  <p>第二，从模型角度来看，现在还是应该追求模型能力上限的提升，这一部分距离大规模商业化可能还比较远。但我们也观察到，前一阶段算法能力的提升已经开始产生一些外溢。比如在制造业场景中，我们看到一轮换机潮正在出现。上一轮机器人融资高点大概在2021年至2022年，当时正好伴随中国制造业技改周期，那一批机器人进入工厂后已经运行四五年，今年也开始迎来换机周期。</p>\n  <p>我们和一些潜在客户交流时发现，他们已经注意到今天软件算法能力的进展，也开始考虑：原来一台机器人只能执行一个动作，今天是不是能够处理不同零件、完成多个动作，变得更柔性？我觉得这就是软件算法能力外溢带来的一个小变化。</p>\n  <p>与此同时，价格下降也会解锁新的应用场景。比如我们最近观察到，一些潜在客户正在研究能不能使用四足机器人做园区配送。如果能够把整套产品方案的价格降到1万美元以下，就可能去做一些过去经济上不可行的事情。所以，技术能力的外溢和成本下降，也会不断解锁新的场景。</p>\n  <p><strong>王子璇：</strong>谢谢。其实刚才的讨论已经回答了下一个问题的一部分，但我们还是继续展开聊一下。具身智能要真正大规模下场干活，目前确实存在不少卡点。有人认为问题在模型，有人认为在数据，也有人认为在零部件耐用性。但刚才大家无一例外都提到了模型的重要性，“脑”本身可能是核心，商业化也可能只是模型能力实践后的外溢。想请大家再聊一聊，如果在模型、数据和零部件这三个方向里选一个当前最棘手的问题，会是哪一个？另外，这三个方向里有没有某个环节其实并不是当前真正的瓶颈，但市场对它的渲染有些过度？</p>\n  <p><strong>石亚琼：</strong>从我自己的观察来看，今天模型的核心卡点还是要投入足够多的精力，找到真正能够Scaling的模型技术路线，做大规模、高质量的数据，把模型能力真正做强。</p>\n  <p><strong>崔轲迪：</strong>我们机构做具身智能，其实已经是第二次完整经历类似的技术产业周期。我们机构本身也比较年轻，2017年才开始大规模投资，此前完整经历过自动驾驶从技术平台早期发展到场景落地。根据上一次的经验，如果把自动驾驶看成一个10年的周期，大概到第6年大家才开始真正讨论初步场景，而要真正算ROI和UE模型，可能要到产业发展的第10年。</p>\n  <p>所以我现在很少和大家讨论商业化，主要是因为我已经不再用这个问题反复折磨自己。我甚至会认为，在一个产业非常早期的时候，如果一直追问“商业化不闭环怎么继续”，可能本身对早期产业的发展规律理解还不够深。早期公司总有办法继续发展，这是我们过去得到的一个经验。</p>\n  <p>包括科研本身，也会产生很多小规模商业化，让公司能够持续向前。现在最大的卡点，我并不认为是Scaling本身，而是“如何Scaling”更重要。此前我们经历过大规模数采建设，今年非常明显的一点，是舆论和产业关注已经不再集中于单纯扩大数据采集规模，而是开始讨论数据质量、数据精度以及如何用更好的数据提升模型起点，也就是说，整个行业已经从单纯追求数量转向追求质量。</p>\n  <p>无论如何，我不认为大家现在已经找到了具身基础模型真正的Scaling Law，但我们知道它一定会存在。现在更像处于大规模实验阶段，只有实验积累出足够多结果以后，才可能真正进入Scaling阶段。从美国现有具身基础模型公司的版本演进也能看出来，2025年从π0开始，现在可能还没有真正发展到π1。我们可以把π1类比GPT-1，而我一直认为，我们现在仍然处在GPT-1之前的阶段。所以，我认为真正的卡点是具身智能的Scaling和Agentic架构究竟应该怎么设计。</p>\n  <p><strong>王子璇：</strong>明白，可能所谓“最后一公里”反而需要更长时间去等待，而不是现在急于去看最后一公里。请亚辉总分享一下。</p>\n  <p><strong>段亚辉：</strong>刚才提到的几个方向，我认为都是卡点。但如果一定要从中选一个，我会选数据。现在最需要解决的问题，是如何获得有效、多样、高质量的数据。前两年行业建设了大量数采厂，但很多数据其实高度重复，有效性并不高。</p>\n  <p>举个例子，比如视触觉，它的优势是分辨率比较高，但缺点是体积相对较大。对于模型来说，不同类型的数据可能都需要，因此不仅要强调数据规模，还要强调多样性，以及数据是否真正适配模型、能够帮助模型提升。</p>\n  <p><strong>向其奇：</strong>我是一个非常坚定的模型派。2021年、2022年的时候，我在智源研究院工作，当时比较有幸参与了中国大模型最早期的一些投资和孵化，有几件事情让我印象非常深。2022年，很多朋友问我：“AI都不行了，你们为什么还要搞AI？”过了不到半年，2023年春节以后，又有很多朋友问我：“具身这么火，你们为什么不投具身？”</p>\n  <p>市场风口来得快，去得也快，但技术主线、模型主线始终在向前发展。2023年、2024年到2025年上半年，我一个具身项目都没有投。核心原因有两个：第一，我很难想象在没有数据、没有模型的情况下，直接去讲具身商业化；第二，当时市场上大部分公司的工作仍然基于模仿学习做微调，我也很难想象，仅靠这种方式能够真正做出一个具身模型，或者提高智能能力的上限。</p>\n  <p>到2025年底，我观察到行业开始出现一些实质性进展。最直接的一点是，大家真正开始系统性做数据采集了。当然，在数采这件事上我们也走过很大的弯路，浪费过很多资源。比如数采到底应该由谁来发起，是第三方公司、创业公司还是大厂？当时因为行业热度很高，很多参与者都进来做这件事。</p>\n  <p>直到2025年底，类似WMI这样的路径开始被认为可能有效，一些创业公司也逐渐往这个方向转。我当时把市场上的具身智能公司系统梳理了一遍，挑选了一些在WMI方向上布局比较早、做得比较扎实的公司进行了投资，也算真正开始进入具身智能领域。</p>\n  <p>让我比较欣喜的是，一年以后再看，这几家公司进展都比较快。虽然最近一两个月具身智能热度有所回落，但我反而更加乐观。因为确实已经有很小一部分公司真正开始做模型，把模型能力持续向前推进，扎扎实实提升智能能力的上限。我现在对这个方向反而更有信心。</p>\n  <p><strong>王子璇：</strong>看来大家还是“模型派”叠加“数据派”，比较关注这两个核心问题。下面聊一个稍微轻松一点的话题。今年很热闹，比如世界机器人大会、机器人运动会，都出现了各种各样的场景。请大家简单分享一下，今年有哪些场景是让你第一反应“心里一沉”、或者“一惊”、或者真正感到兴奋的？</p>\n  <p>比如人形机器人是不是越来越像人了？大家是不是已经不再集中展示翻跟头，而是开始做操作任务？或者又看到机器人频繁摔倒？请大家分享一个自己觉得比较有意思的场景。从媒体角度看到了什么，从投资人角度看到了什么，或者大众对哪些现象可能存在误判？</p>\n  <p><strong>向其奇：</strong>我有一个比较明显的体感。去年机器人展示更多还是一些基础运动能力，比如跑跳、翻滚等，看起来很有意思，但我认为其中很多公司更像是在做具身时代的“壳”，主要把本体做出来。今年有一个很明显的变化，大家开始往操作台迁移，至少减少了很多遥操作展示。有的公司甚至开始尝试长程任务、世界模型等相对新的方向，把操作能力继续向前推进。包括去年我们投资的一些公司，今年在5分钟到10分钟的长程操作任务上已经出现比较明显的突破。</p>\n  <p>为什么这让我比较兴奋？因为我确实第一次肉眼看到了具身模型具备Scaling的可能性，这件事我在去年还没有真正看到。所以我认为，现在才真正到了具身智能开始的阶段。下一步反而应该把聚光灯稍微撤掉，让这些模型公司踏踏实实回到实验室里，多做工程、多做实验，把操作能力继续向前推进。</p>\n  <p><strong>段亚辉：</strong>分两个场景来说。第一是世界机器人大会，今年机器人无论跑步还是跳舞，整体表现相比去年都有非常明显的提升。背后反映的是核心零部件、本体设计、散热系统设计等整个产业链能力的大幅提高和快速迭代，这是一个非常明显的进步。另一方面，去年很多比赛还依赖遥操作，今年已经有不少比赛能够自主跑完全程，这也说明智能能力在逐步提升。</p>\n  <p>第二，从WRC现场来看，今年真正能够下场“干活”的展品明显多起来了。尤其像触觉、灵巧操作等方向，展示数量比往年明显增加，也能够看到比较直观的进步。这些都是我觉得比较亮眼的地方。</p>\n  <p>另外，刚才主持人也提到一个容易造成误判的点。比如“世界模型”这个概念今年明显有些过热，甚至出现什么东西都往世界模型里装的情况，概念本身被炒得有些虚浮。但从另一个角度看，这也反映出市场确实在关注具身智能当前的核心痛点。最终这些问题以什么技术形式落地，我们也会继续密切跟踪。谢谢！</p>\n  <p><strong>崔轲迪：</strong>从我们过去的投资经验来看，一个机构喜欢什么样的具身产品，和机构、投资人本身的性格以及偏好有非常大关系。以我们机构为例，我们团队很多核心成员都有消费电子行业背景，我老板也是石头、追觅、九号非常早期的投资人。因此，我们团队一直对消费电子和硬件产品的美观度有比较强的要求，甚至带有一些个人偏执。从消费电子时代，到汽车时代，再到今天做具身智能，我们对审美的要求始终很高。以WRC为例，我们被投公司今年在C端展区可能占了接近三分之一的展位，但如果我看到某家公司机器人迭代两年以后还是特别丑，我还是会拍张照片直接告诉他们：“这个机器人太丑了。”甚至我们在做数采设备、WMI相关设备时，也会用消费电子时代积累的审美和ID设计标准去要求团队。我们比较关注的一点就是：产品首先得好看。</p>\n  <p>第二件事，我们特别关注“好玩”。我们投了很多具身公司，我个人最喜欢的一个是维他动力。维他最早做机器狗，今年又做了一些家用人形产品。它在我们的portfolio里并不是估值最高的公司，但却是我个人很喜欢的一家公司。一个很重要的原因是，每一年WRC，维他的展台都会有非常多小朋友围着看。如果说一个不是我们投资的产品，我以前非常喜欢商汤做的元萝卜围棋机器人，也是因为它非常有趣。</p>\n  <p>我们今年还在继续投资具身智能。虽然大家都说具身融资开始降温，但我们仍然持续在投。我最近比较喜欢的一家公司叫藦卡，它围绕具身智能做一些世界模型相关的小游戏。今年去他们展台时，还是会看到很多小朋友在那里玩。这类场景会让我非常有成就感。所以我个人比较关注的两个关键词就是：好看和好玩。</p>\n  <p><strong>石亚琼：</strong>我补充一个稍微不一样的视角。我此前有比较长时间的媒体工作经历，基本每一届WRC都会去。从媒体观察来看，以前现场外媒记者很少，但今年外媒记者明显增加了很多，包括不少海外媒体主编和KOL都直接来到现场，不只是采访，还有现场直播。这在过去并不常见，我觉得它反映了海外对中国机器人产业认知正在发生变化。</p>\n  <p>过去海外对中国的印象更多是硬件能力强、生产制造能力强、供应链能力强、规模化生产能力强。但今年随着中国具身智能公司的发展，无论软件还是硬件，都出现了非常明显的提升。</p>\n  <p>比如本体方面，运动控制算法的进步带来了非常大的能力提升。无论是宇树机器人跳舞，还是今年各种机器人运动会上不断刷新成绩，都让很多外媒开始惊讶：中国机器人是不是正在快速缩小和全球领先水平的差距？Twitter上甚至不断有人@Google，问为什么当年把波士顿动力卖掉。我觉得这就是一个很有意思的视角变化。</p>\n  <p>我觉得未来这一代中国具身智能公司，甚至不只是具身智能公司，都存在一个非常大的全球市场机会。这是这一代创业者必须解决的问题，同时也是非常重要的历史机遇。现在比如我的邮箱里，经常会收到一些中东LP发来的陌生邮件，以前完全没有接触过，但他们在网上看到我们投资了机器人公司，就主动来交流。</p>\n  <p>因为他们认为，中国机器人产业在全球具有非常强的竞争力，与美国相比并没有形成明显的代际差距。我认为美国今天在底层研发上的确仍然领先一些，投入也更大，但从长期来看，中国公司的差距并没有那么大。</p>\n  <p><strong>王子璇：</strong>这一点和云时的观点也比较接近。全球化确实是非常重要的议题，中国未来可能不只是“硬件领先”，也有机会在软件和智能能力上形成竞争力。最后一个讨论议题，最近一两个月具身智能确实有所降温。想问问大家，现在是不是仍然处于泡沫期？大家判断具身智能的泡沫会不会破、什么时候可能调整？第二个层面，如果泡沫真的出现调整，大家的策略会是什么？长期来看，产业链里最终最受益的是谁，是本体厂商、场景方，还是纯模型公司？另外，如果回顾2026年这个时间点，大家会把它定义成什么样的一年？是泡沫元年、商业化元年，还是某一个真正的起点？请大家综合聊聊。</p>\n  <p><strong>石亚琼：</strong>我觉得“泡沫”这个问题其实很难回答。因为泡沫对投资人来说是一个难题，但对创业者来说，反而可能意味着一个非常好的机会，说明你有机会融到足够多的资金去支持自己的梦想。我认为，一项技术如果是中美竞争中的关键要素，同时也是人类已经形成共识的技术趋势，那么它一定会出现泡沫。历史上已经反复证明，这类技术几乎都会经历泡沫。</p>\n  <p>一级市场和二级市场有一点很不一样。二级市场更多是在投资产业规律，你大致知道产业规律是什么、什么时候泡沫可能破裂、什么时候产业逻辑可能发生变化。但一级市场投得比较早，本质上投的是那些有能力改变产业规律的创业者。他们可能通过技术创新，也可能通过商业模式创新，最终打破原有产业规律，真正拉开一个身位。</p>\n  <p>所以在这样的背景下，我们不应该用静态眼光去看创业者，而应该相信他们的自主性和能动性。即使身处泡沫环境，他们也可以通过自己的策略改变结果。比如资金获取能力本身也是一种能力，也是一种商业策略。所以不管现在是否存在泡沫，我觉得都应该相信这一代创业者的能力，对他们保持信心。</p>\n  <p>第二点，泡沫是怎么产生的？本质上还是供需关系。对创业者来说，需要关注产品本身的供需关系，同时也要关注资金和资产之间的供需关系。今天非常明显的一点是，好的资金仍然在不断涌入具身智能行业。除了政府持续加码，一二级市场的热情也会反过来影响一级市场的投资。</p>\n  <p>另外，我们和海外投资人交流时也能感受到他们正在密集关注这一领域。过去几年，全球LP资金里有相当一部分投向SpaceX、OpenAI、Anthropic等企业。这些资金未来两年也可能逐渐回流到GP手中，而GP同样需要重新进行资产配置。</p>\n  <p>所以，长期资金量本身也会影响泡沫最终会以什么方式演化、在什么时间点变化，我认为这个变量也必须考虑。对创业者来说，账面上只要还有足够的钱、没有离开牌桌，就始终还有机会。因此，大家应该充分利用当前的市场环境，让自己活得更久。</p>\n  <p><strong>崔轲迪：</strong>具身智能其实只是我们整个投资版图中的一部分。比如刚才我也非常认真地听了脑机接口的panel，我们也投资脑机接口；在参与商业航天投资时，大家同样会问我有没有泡沫。我感觉现在刚好处在一个周期轮转阶段。根据上一轮周期的经验，周期下行的时候很难受，周期上行的时候其实也一样难受，只是难受的方式不太一样。</p>\n  <p>所以，我现在不会花太多精力判断“泡沫什么时候破”，我更关心的是，要让一家创业公司真正穿越周期，它究竟需要多少钱。我们会大概算一笔账：在当前这个周期里，公司手里要有多少钱，才能活到下一个周期。如果现金储备低于我们心里的预期，我会及时提醒创始人；如果他们的钱远远高于我的预期，我可能连投后服务都不会主动提供太多，因为我认为这也是对他们的一种尊重。总结一下，我现在的观点是：投资可能有周期，但创业企业没有周期。</p>\n  <p><strong>段亚辉：</strong>提到泡沫，我们认为这个赛道的确存在泡沫。但如果让我回答什么时候破、什么时候调整，我现在也回答不了。</p>\n  <p>我们认为具身智能是一个非常重要的赛道，可能是10年甚至更长周期的“长坡厚雪”。对于这样一个赛道，无论处于上行周期还是下行周期，我们都会持续关注、持续下注，这也是我们整体的投资策略。</p>\n  <p>至于2026年处于什么阶段，我认为应该算是商业化元年的起点。当然，这个阶段同时也伴随着泡沫，也有可能在年底出现一定调整。我们往往容易高估短期技术发展的速度，同时低估长期技术发展的幅度。从更长周期来看，我认为具身智能仍然是一个非常宏大的赛道。谢谢！</p>\n  <p><strong>向其奇：</strong>过去几年，我在具身智能领域大致看到三类��司：</p>\n  <p>第一类，因为具身智能有热度，市场突然出现大量公司，无论一级还是二级市场，有些公司本身和具身智能并没有真正关系，只是在追逐概念热度。我认为这种公司才是真正意义上的泡沫，这类项目我基本没有参与。</p>\n  <p>第二类，看团队背景似乎和具身智能有一定关系，想做的事情也足够大，甚至创业第一天就已经考虑未来如何上市。和他们的创始人、老股东交流时，也经常会很神秘地告诉我一些与具身智能本身并没有太大关系的信息。大模型阶段其实也出现过不少类似公司。我把它们定义为“事件型创业公司”：因为一系列外部事件而创业，未来也大概率会因为另外一些事件而瓦解，这类公司我同样不会投资。</p>\n  <p>第三类，是团队本身比较优秀，而且真正踏踏实实做模型的公司。这些人从骨子里相信大模型和智能这件事，我认为这一点非常重要。他们也相信，今天真正需要解决的核心问题首先是智能，再用智能去解决其他非智能问题。我非常偏好这类项目。因为具身智能的市场热度很高，这类公司的估值涨得也很快，但只要它一直在做真正与模型相关的事情，有一天如果把这条路真正走通，它所形成的模型能力完全有可能消化掉今天的高估值。从某种程度上来说，现在的泡沫对这些真正做技术的公司甚至是一种养料。</p>\n  <p>我的目标其实非常明确，就是找模型。我自己的动作也比较收敛，只做一件事——牢牢守在智能这条主线上，在非常早期的阶段去孵化、投资和挖掘那些模型能力非常强的早期团队，陪最优秀的人一起走下去。希望通过5到10年的时间，真正把具身智能这个问题解决掉。</p>\n  <p><strong>王子璇：</strong>非常感谢各位嘉宾非常真实、坦诚的分享。我们今天关于“具身智能最后一公里”的圆桌讨论到这里结束。谢谢各位！</p>", "category": "tech", "published_at": "2026-09-29T03:45:32+00:00", "fetched_at": "2026-09-29T03:55:09.124217+00:00", "fingerprint": "cd815c03f9c1f565"}, {"source": "少数派", "title": "摸鱼+3 | 还剩三天班，一天一个解谜游戏", "url": "https://sspai.com/post/114967", "summary": "节后再说！<a href=\"https://sspai.com/post/114967\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-28T03:00:30+00:00", "fetched_at": "2026-09-29T03:55:07.747342+00:00", "fingerprint": "ba85d00041c9d4d1"}, {"source": "少数派", "title": "比起折痕， iPhone Duo 的交互设计更加令人着迷", "url": "https://sspai.com/post/114972", "summary": "一起来看看 Apple 是如何围绕一块会改变形状的屏幕，重新思考人与界面的关系。<a href=\"https://sspai.com/post/114972\" target=\"_blank\">查看全文</a>", "category": "tech", "publishe /out-of-the-park-baseball-cozy-sim-video-game-review", "summary": "If you were to ask me what game or game series I've sunk the most time into, the answer would be easy: Out of the Park Baseball (OOTP). I have spent roughly 2,300 hours, according to Steam, playing various editions of the game. OOTP isn't like MLB The Show or Super Mega Baseball. It's not [&#8230;]", "category": "tech", "published_at": "2026-09-27T21:59:57+00:00", "fetched_at": "2026-09-28T03:17:35.676430+00:00", "fingerprint": "8c713bebedaca020"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨苹果确认iPhone 18 Pro存在严重系统漏洞；甲骨文爆雷，市值蒸发近1500亿；特斯拉中国又宣布降价", "url": "https://36kr.com/p/4002308115517316?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>接连发生失控事件，OpenAI再次暂停其最先进模型训练</p>\n  <p>中国移动、中国电信、中国联通，集中叫停“0元购机”</p>\n  <p>罗永浩回应“劣质溜溜凳”事件：东方甄选平台也卖了将近1000万</p>\n  <p>扎克伯格成全球第四富豪</p>\n  <p>特斯拉Semi电动卡车开启量产交付</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>苹果确认iPhone 18 Pro存在严重系统漏洞，会导致手机突发卡死</strong></p>\n  <p>苹果已经对外正式证实，旗下最新发布的iPhone 18 Pro以及iPhone 18 Pro Max两款机型当中，存在一项和Face ID面容识别功能相关的严重系统漏洞。 这一漏洞会导致设备在特定的面部识别解锁或者身份验证场景下突发卡死，紧接着就触发系统自动重启，直接打断用户正在进行的操作。</p>\n  <p>不少首批拿到新机的用户已经在社交平台、苹果官方支持社区集中反馈相关问题，当用户尝试在暗光环境、握持角度偏斜的特殊场景下，或是通过第三方应用调用Face ID完成生物识别支付、账户登录操作时，手机屏幕会瞬间直接冻结，随后设备进入黑屏状态，显示苹果标识进行软重启。(快科技)</p>\n  <p><strong>美国科技巨头甲骨文爆雷，市值蒸发近1500亿&nbsp;</strong></p>\n  <p>最新消息显示，甲骨文就新墨西哥州数据中心发出不可抗力通知。该公司正采取措施，以避免在新墨西哥州建设的大型数据中心产生巨额支出，这为该项目增添了新的变数。</p>\n  <p>据报道，知情人士透露，科技巨头甲骨文已向项目开发商——Blue Owl Capital Inc. 旗下的一家子公司发出通知，并援引了不可抗力条款。该人士称，甲骨文公司并未试图作为该站点的主要租户退出项目，而是计划若数据中心“Project Jupiter”因故受阻、未能按计划在2028年投入运营，则推迟支付相关款项。</p>\n  <p>截至北京时间25日23:13，该股跌超5%，最新总市值为4148亿美元。对比9月23日收盘的4371.11亿美元，市值蒸发约223亿美元（约合人民币近1500亿元）。（第一财经)</p>\n  <p><strong>特斯拉中国又宣布降价，一个月内降价两次</strong></p>\n  <p>9月25日，特斯拉中国宣布，2026年10月31日（含）前下单，Model 3 全系限时尾款立减5000元，Model Y 部分车型限时尾款立减7000元。叠加5年0息等政策优惠后，Model 3售价222500元起，首付7.99万元，月供低至约2377元；Model Y售价256500元起，首付7.99万元，月供低至2944元。</p>\n  <p>9月7日，特斯拉中国宣布，9月30日前下单并提走现车，Model 3全系（含高性能版）现金激励5000元，Model Y全系（含Model Y L）现金激励10000元。（红星新闻）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>接连发生失控事件，OpenAI再次暂停其最先进模型训练</strong></p>\n  <p>OpenAI在25日发布的一份技术报告中称，9月20日，一个在沙盒中执行搜索训练任务的智能体，利用训练沙盒中DNS过滤不足的漏洞，绕过网络限制，通过DNS访问了外部公共聊天机器人服务。在此之前，该智能体曾使用内置搜索工具，并尝试直接访问搜索引擎但未成功。</p>\n  <p>报告指出，OpenAI的对齐监控系统在事件发生15分钟内即触发警报，人工审查团队在3分钟后介入，并在2.5小时后终止了该训练任务。针对漏洞，OpenAI已在两个独立防护层部署了拦截控制措施。公司表示，虽然本次事件严重程度低于此前的安全事故，但为下一阶段加固防线提供了重要信号。</p>\n  <p>这是OpenAI三个月内第二次暂停模型开发。7月下旬，OpenAI承认，其网络安全训练与评估场景中的人工智能体绕过网络限制，侵入美国“抱抱脸”公司的部分系统。智能体突破了原本互相隔离的运行环境建立通信、欺骗评估人员并试图掩盖作弊行为，上述每一步操作均无人类指令干预。这一“越界”行为引发了外界对人工智能安全和监管的广泛担忧。（央视新闻）</p>\n  <p><strong>美国一家AI实验室：AI演化出自己的方言</strong></p>\n  <p>近日，美国一家AI实验室发现，当多个智能体在虚拟“社会”中协作时，开始用一种超现实的“方言”聊天，关键是人类根本看不懂。面对一个越来越复杂、甚至可能脱离人类掌控的AI世界，AI治理的全球行动迫在眉睫。（CCTV国际时讯）</p>\n  <p><strong>Claude刷新物理学世界纪录，仅用一个提示词、花了几千美元</strong></p>\n  <p>9月26日，Anthropic官宣，Claude拿下了理论物理的一项前沿纪录。它在几乎无人类干预的情况下，连续运行数天，一举攻克了高能物理学界出了名难算的“九圈散射振幅”计算难题。具体来说，它算出了平面N=4超杨-米尔斯理论里六粒子振幅的九圈结果，人类此前的纪录停在八圈。</p>\n  <p>杨-米尔斯模型（Yang-Mills）其中的“杨”，指的正是物理学泰斗杨振宁先生。他与米尔斯在1954年共同创立的“杨-米尔斯理论”，是整个现代粒子物理学的基石。基于它的任何高阶计算，都堪称人类脑力的极限挑战。</p>\n  <p>Claude完成这项“神级挑战”，仅仅只用了一个提示词，花了几千美元。几天后交回的答案，光其中一部分展开就有300亿项。负责给AI验证结果的物理学家Lance Dixon感慨：“我身边的大多数理论物理学家其实早就承认，大模型迟早会颠覆物理学，只是不知道那一天什么时候砸到自己头上。对我来说，那一天是9月1日。”（IT之家）</p>\n  <p><strong>特朗普将于周二推出AI驱动的新网站America.gov</strong></p>\n  <p>美国总统特朗普将发布一个由人工智能（AI）驱动的新网站，整合目前分散在各联邦机构网站上的政府信息和资源。福克斯新闻称，特斯拉首席执行官埃隆·马斯克、英伟达首席执行官黄仁勋以及Blue Origin首席执行官Dave Limp预计将出席此次活动。这个名为America.gov的网站将于周二正式推出。（新浪财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>A股新指数即将发布</strong></p>\n  <p>上海证券交易所和中证指数有限公司将于2026年9月29日正式发布上证创新药科创领先指数和上证科创板软件服务指数，为市场提供更丰富的投资标的。</p>\n  <p>上证创新药科创领先指数从科创板和上证主板上市公司中选取40只研发水平高、成长性好的创新药领域上市公司证券作为指数样本，同时提升科创板样本权重，反映上述板块中创新药领域上市公司证券的整体表现。上证科创板软件服务指数从科创板选取40只软件开发、软件服务等领域的上市公司证券作为指数样本，以反映科创板软件服务行业上市公司证券的整体表现。（财联社）</p>\n  <p><strong>中国移动、中国电信、中国联通集中叫停“0元购机”</strong></p>\n  <p>在三大运营商线下营业厅，不少消费者都碰到过“免费领手机”“办宽带送礼品”的宣传。看似是办套餐就能白拿手机，实际是‌签了贷款合同‌，每月话费里包含还款金额。有消息称，9月24日起，三大运营商金融分期购机业务暂停，不能再新增办理这类0元拿手机业务。</p>\n  <p>记者致电电信、联通运营商客服以及移动“和包信用购”客服，对方都表示，此类分期购机项目已经暂停。9月24日起，中国移动的“和包信用购”、中国电信的“橙分期”、中国联通的“沃分期”均已全面暂停新增办理分期购机，恢复时间未定。（央视财经）</p>\n  <p><strong>续签高通专利许可，苹果一夜飙涨5000亿</strong></p>\n  <p>当地时间9月25日，苹果和高通续签全球专利许可协议，将于2027年4月1日生效。消息一出，苹果大涨，收盘涨1.53%至341.07美元，盘中最高345.34美元，创历史新高。单日市值增加约751亿美元，折合人民币超5000亿元，总市值逼近4.98万亿美元。(新浪财经)</p>\n  <p><strong>罗永浩回应“劣质溜溜凳”事件：东方甄选平台也卖了将近1000万</strong></p>\n  <p>近日，交个朋友直播间因售卖劣质溜溜凳引发舆论风波。9月25日，罗永浩通过微博回应本次事件。罗永浩表示，“事件前期运营部门存在疏忽大意，这件事之前之所以没有引起交个朋友运营部门足够的重视，是因为虽然卖了两三百万，但实际上日常退货及投诉的没有很多，所以他们疏忽大意了。不管怎么样，这是一起严重的质量管理事故。感谢媒体和网友们的监督，如果不是上了热搜，有可能到现在还没发现问题的严重性。”罗永浩还提到，经团队核查，东方甄选平台也销售了近千万元同款溜溜凳，是该产品最大代销商。（财联社）</p>\n  <p><strong>豆包手机助手致歉，称未对腾讯游戏操作</strong></p>\n  <p>近日，有玩家反馈，在搭载了豆包手机助手的努比亚NaviX Ultra上，登录王者荣耀或进行匹配对战时，会出现提示设备环境异常、被强制踢下线的情况。</p>\n  <p>豆包手机助手在官方社区对此事进行回应称：“经过确认，豆包手机助手全程未对腾讯游戏系统进行任何操作，AI也不存在任何违规点击、外挂或模拟行为。目前团队仍在持续与腾讯相关方接洽沟通，但截至目前暂未收到对方的明确回复。对此我们深表歉意。”</p>\n  <p>豆包手机助手还建议称，用户暂时不要在努比亚NaviX Ultra上反复尝试登录王者荣耀。“如果您的账号已经出现被封禁等情况，建议同步通过官方游戏客服渠道进行申诉/投诉，以便更快恢复账号。如有最新进展，我们会及时同步大家。”（界面新闻）</p>\n  <p><strong>美联储10月加息的概率为64.8%</strong></p>\n  <p>据CME“美联储观察”：美联储10月会议维持利率在3.75%-4.00%不变的概率为35.2%，加息25个基点的概率为64.8%。美联储到12月维持利率在3.75%-4.00%不变的概率为7.6%，累计加息25个基点的概率为41.6%，累计加息50个基点的概率为50.9%。（财联社）</p>\n  <p><strong>五仁月饼回收价1000元一吨，高于果馅、豆沙等其他口味月饼</strong></p>\n  <p>市场上在售月饼的保质期普遍较短，通常在30天至90天左右。过期的月饼，会去哪儿？首先是销毁。过期月饼还可以进行饲料化应用。9月23日，河北省某饲料厂工作人员向记者介绍，该饲料厂常年回收临期、过期库存食品尾货，包括饼干、月饼等，进行饲料化原料用途，并承诺不会二次流入市面销售。该工作人员称，用作饲料的月饼，不能出现发霉、异味等变质情况；此外，不同馅料的月饼，回收价格也不一样。“五仁月饼的回收价格高一些，约1000元/吨，果馅、豆沙等其他口味的月饼价格低一些，约800元/吨。”工作人员称，五仁月饼里含有大量瓜子、花生等坚果，营养成分高，馅料干。(中新经纬)</p>\n  <p><strong>扎克伯格成全球第四富豪</strong></p>\n  <p>美国《福布斯》网站报道，当地时间9月24日，Meta首席执行官马克·扎克伯格身家超越戴尔科技董事长兼首席执行官迈克尔·戴尔，成为全球第四大富豪。（中新经纬）</p>\n  <p><strong>马斯克说中国AI花小钱办大事：单位算力产出的性能几乎是全球顶尖水平</strong></p>\n  <p>日前，马斯克接受央视财经专访。“AI领域迭代速度太疯狂了，快到让我头晕目眩。有时候睡前刚看到一项重大突破，一觉醒来又是新突破，到午饭时又有新成果问世……”谈及中国AI发展，他表示，中国的AI大模型整体而言非常出色，单位算力产出的性能几乎是全球顶尖水平。他认为中国解决算力问题的速度，会比大多数人预想更快。大概两到三年内，中国就能依靠光刻技术与芯片制造补齐算力缺口。（央视新闻）</p>\n  <p><strong>阿玛尼将与路威酩轩（LVMH）、欧莱雅开启股权出售谈判。</strong></p>\n  <p>9月27日消息，阿玛尼将与路威酩轩（LVMH）、欧莱雅开启股权出售谈判。（财联社）</p>\n  <p><strong>欧盟官员警告欧盟面临能源价格危机</strong></p>\n  <p>据欧洲媒体9月25日报道，欧盟能源委员丹·约根森当天在给欧盟各国能源部长的信中称，受伊朗战事对全球油气市场的影响，欧盟正面临能源“价格危机”。他呼吁欧盟成员国考虑采取措施减少天然气和电力需求，以应对即将到来的冬季。（CCTV国际时讯）</p>\n  <p><strong>开市客公布75亿美元大规模扩张计划</strong></p>\n  <p>在又一个业绩亮眼的财季过后，仓储会员店开市客（Costco Wholesale）公布2027财年75 亿美元资本开支方案，加速推进业务扩张。公司计划本财年新开33家仓储门店，其中包含5家迁址门店。这将帮助开市客进一步靠近首席执行官罗恩・瓦克里斯设定的长期目标：每年净增约30家门店。截至2026财年末，开市客在全球共有939家仓储门店，当年资本项目投入达64亿美元。（新浪财经）</p>\n  <p><strong>Meta在美国新墨西哥州败诉，或面临高达2190亿美元罚款</strong></p>\n  <p>美国新墨西哥州总检察长劳尔·托雷斯表示，在陪审团裁定Meta Platforms Inc.违反州法律后，他将寻求对该公司处以最高达2190亿美元的罚款。陪审团认定，Meta在言论政策和数据隐私政策方面误导公众，从而违反了新墨西哥州法律。（财联社）</p>\n  <p><strong>火车票预约购票最新调整：最远预约日期由60天逐步调整为30天</strong></p>\n  <p>9月26日起，铁路部门对京沪高铁、京沪铁路试点的火车票预约购票服务的可预约日期范围从开车前第60天至第17天，逐步调整为开车前第30天至第17天。旅客通过铁路12306手机客户端“预约购票”专区填报预约需求，9月26日当天可预约11月24日前车票；9月27日至10月26日为调整过渡期，最远可预约11月24日的车票；10月27日起，可常态化预约开车前第30天至17天的火车票。（央视新闻）</p>\n  <p><strong>苹果因侵犯触觉反馈专利，被判需支付57亿美元赔偿金</strong></p>\n  <p>圣地亚哥联邦陪审团周五裁定，苹果公司侵犯塔克申技术公司专利，需赔付超过57亿美元。涉案专利是iPhone与苹果手表产品使用的振动相关技术。美国加利福尼亚州南区联邦地区法院陪审团经过两天部分时段的审理后认定，苹果侵犯了塔克申两项触觉反馈专利（专利号：美国专利10659885号与10820117号）的权利要求，但侵权并非故意行为。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>Solidigm据悉计划于2027年进行首次公开募股，估值可能达到1500亿美元</strong></p>\n  <p>消息人士称，SK海力士旗下Solidigm计划于2027年进行首次公开募股，估值可能达到1500亿美元。Solidigm本周已与多家银行举行上市推介会，以确定IPO承销商等相关安排。Solidigm此次在美国上市可能募资150亿美元。（财联社）</p>\n  <p><strong>粤芯半导体：创业板IPO网上发行中签率0.0424%</strong></p>\n  <p>36氪获悉，9月27日，粤芯半导体公告，公司首次公开发行股票并在创业板上市网上申购情况及中签率公布，本次发行价格12.01元/股，初始发行5.13亿股，超额配售选择权全额行使后发行总股数扩大至5.90亿股。网上发行有效申购户数1443.54万户，有效申购股数4233.83亿股。回拨机制启动后，网上最终发行1.79亿股，中签率0.0423786759%，有效申购倍数2359.68倍。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>特斯拉Semi电动卡车开启量产交付</strong></p>\n  <p>9月25日，特斯拉宣布Semi电动卡车开启量产交付。据马斯克介绍，该车搭载特斯拉辅助驾驶功能，Megacharger可提供兆瓦级充电功率。（界面新闻）</p>\n  <p><strong>影石正布局AI眼镜，或采用“分体电池”设计</strong></p>\n  <p>有接近影石创新人士透露，当前影石创新正在布局AI眼镜赛道，并在进行相关研发，未来或将推出自己的AI眼镜产品。此前，影石创新获得了一项名为“可穿戴式眼镜”的实用新型专利授权。专利摘要显示，该眼镜主体佩戴于头部，电池装置与眼镜主体分离、���戴于身体其他部位，通过电连接线供电，目的是“减轻用户头部负重，降低长时间佩戴的压力”。这一“分体电池”设计思路，与当前主流AI眼镜将电池塞入镜腿的方案明显不同，更接近长时间佩戴拍摄的工程取向。（新浪科技）</p>\n  <p><strong>整理丨</strong>何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-09-28T00:01:40+00:00", "fetched_at": "2026-09-28T03:17:35.594406+00:00", "fingerprint": "b0a0e10b0d1ee0de"}, {"source": "36氪 - 最新文章", "title": "九合、险峰投了家消费级外骨骼，《流浪地球》用过，营收破亿｜产品观察", "url": "https://36kr.com/p/4001317788995717?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>冰雪覆盖的末日地表，救援队队员身披布满管线的机械外骨骼，在冰天雪地之中徒步运送火石，借结构助力扛起重型武器、拖拽坠落同伴，最后合力推动行星发动机的撞针完成救援任务。</p>\n  <p>这是电影《流浪地球》中，留给大众关于外骨骼最深刻的想象。 而对于傲鲨智能创始人徐振华来说，这是一次很重要的出圈机会。</p>\n  <p>徐振华是汽车电子系统出身，曾参与联合创立璟和技创、傅利叶智能，从事医疗康复机器人的研发，又带着团队在工业外骨骼里摸爬滚打了整整八年，其营收在2025年破亿。公司也先后融资数亿元，投资方包括九合创投、明势资本、险峰长青等知名基金。今年，傲鲨正式推出消费级外骨骼机器人VIATRIX X。</p>\n  <p>当行业已经诞生估值几十亿的公司时，看上去傲鲨来得有些“晚”，甚至为此主动选择放慢了早期一些融资节点。</p>\n  <p>但徐振华没有太着急。在他看来，消费级外骨骼就像一个六边形战士，必须在续航、重量、发热量、穿戴舒适性与动力输出之间，找到一个“极其苛刻的平衡点”。&nbsp;他不能将不成熟的产品推向市场。</p>\n  <p>当一众厂商都在抢抓时间构筑先发壁垒，傲鲨的入局节奏，反而成为团队避开同质化赛道、重新思考产品定位的机会。</p>\n  <p>所以傲鲨花了两年多，自研核心动力系统和浮动式髋关节架构，提出全新的户外外骨骼设计理念，希望帮助普通白领克服复杂的山野路况。他们或许讲不出太多浮夸的叙事，不过徐振华很了解，外骨骼这种极度考验细节体验的产品，最终要让用户长期买单，靠的只有技术能力。</p>\n  <h2><strong>车规级技术下放</strong></h2>\n  <p>外骨骼是一个极其看重“综合调教”的硬件。外骨骼不是普通穿戴设备，而是一台穿在人身上的机器。它的任何性能短板，都会直接作用于人体的真实感受，稍有不属实，用户就会扔到角落。</p>\n  <p>但它的性能提升，很难由某一项参数的单独优化来驱动。助力、重量、续航等指标彼此耦合，提升助力，意味着更大的电机、更高的功率，代价是重量增加与发热加剧；延长续航，依赖更大的电池，而重量恰恰是穿戴设备的硬约束；加快响应，需要更强的算力，但算力本身同样带来功耗与热量。可以说，厂商都没有找到最优解。</p>\n  <p>“外骨骼过去一直停留在参数竞赛阶段，单点极致仍然有价值，但参数提升越往上走边际收益递减。最后拼的是工程体系的整合能力。”傲鲨智能的创始人兼CEO徐振华告诉硬氪。</p>\n  <p>傲鲨智能最新发布的消费级产品VIATRIX X，是这套工程整合思路的一次落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_19691204448f4202bcbcdcc91cbbc194@6022551_oswg4482453oswg2274oswg1490_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">VIATRIX X（图源/企业）</p>\n  <p>对外骨骼来说，动力系统是整机性能的底层基座，设备的助力输出、续航表现、轻量化控制、热稳定性等核心体验与性能上限，最终都由电机与驱动架构决定。因此，VIATRIX X最先做的，是动力与热管理的底层重构。</p>\n  <p>动力提升通常伴随着发热加剧，但设备紧贴人体，用户不会接受一台贴在腿上发烫的机器。在结构上，傲鲨研发团队没有依靠额外散热硬件被动降温，而是将热管理前置到电机设计本身。</p>\n  <p>VIATRIX X自研了动力方案，采用了汽车领域很常用的扁线绕组设计。</p>\n  <p>过去，传统电机多采用圆线绕组，槽满率仅78.5%左右，槽满率低，同样体积的电机里铜线塞得不够满，电阻大、发热多、效率低。而傲鲨采用的扁线绕组，截面槽满率能达到97%，相当于在同样体积里塞进的铜线更多，电阻变小、发热更少。</p>\n  <p>这种车规级技术下放，带来的直接收益是效率跃升，可以将VIATRIX X的综合效能提升20%至30%，最终在有限机身空间内，兼顾更强助力比保持较低发热量，解决佩戴闷热的问题。</p>\n  <p>效率提升也直接减少了产品体积。相比上一代产品，VIATRIX X体积减小40%，整机重量降至2.58千克。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_7b9d26dd201c4435a1579d7181575f5a@6022551_oswg5576355oswg2224oswg1474_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">车规级技术下放（图源/企业）</p>\n  <p>如果说动力结构和轻量化决定了外骨骼的“能力上限”，那么算法调度决定的是这些能力以什么节奏、什么方式释放出来。</p>\n  <p>在算法端，傲鲨自主研发了一套自动能量管理系统，核心是根据剩余电量动态调整外骨骼的助力上限。系统设置了一个“Boost模式”，即外骨骼的“冲刺档”，可以助力输出最强，适合爬坡、负重或短时高强度行走，但功耗也最高。</p>\n  <p>用户穿戴VIATRIX X行走过程中，系统会随电量消耗分档管理：满电时允许全开Boost；电量降到75%以下，逐步收窄助力上限，25%以下关闭Boost，不再提供最强助力；10%以下只保留基础档位，维持最基本的行走辅助。</p>\n  <p>这不是简单的电量保护，而是把长距离徒步中的体力分配逻辑算法化。</p>\n  <p>人在正常行走时往往不会刚出发就全力冲刺，而是会根据路况分配体力。外骨骼自动能量管理系统需要配合用户自己的节奏，既避免中途断电，也保证产品能在用户需要助力时提供帮助。</p>\n  <p>除了电量分配，外骨骼产品所提供的助力也必须卡在步态周期的正确窗口里。抬腿、摆动、落地、蹬伸，每个阶段需要不同的介入方式。人类自身的触觉反应时间大约在120至200毫秒，外骨骼如果慢于这个节奏，就很难与人的动作同步，助力就会错位，不仅帮不上忙，反而会形成拖拽感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_35c3d9f5078b4760b2e6fb92ef2ee194@6022551_oswg2750506oswg2216oswg1460_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">VIATRIX Xmolle快挂系统（图源/企业）</p>\n  <p>VIATRIX X同样使用了车规级步态识别芯片，并将AI自适应算法的反应时间压缩到0.5至1毫秒。这让设备能快速跟随用户节奏，在每一步中按步幅大小等比例介入。</p>\n  <p>“外骨骼的助力逻辑本质上不是替代人，而是补足人。人的运动是一个连续的‘意图—发力—调整’过程，设备要真正融入这个闭环，就必须同时回答两个问题：给多少助力，以及在什么时候提供。”徐振华指出��“所以外骨骼最终不是一件工具，而是一套穿在身上的协作系统。”</p>\n  <p>这些能力用户未必能逐一感知，却决定了产品在真实场景里的稳定性和完成度。正是这些细节，让VIATRIX X并不是一台只供极客尝鲜的试水样机，而更接近一款可以日常使用的消费级产品。</p>\n  <h2><strong>从工业走进山野</strong></h2>\n  <p>傲鲨切入户外赛道，并不是一次市场风口下仓促的业务转向。</p>\n  <p>早期傲鲨的工业外骨骼，核心服务于搬运作业，虽然具备行走能力，但由于工人大多时间专注搬抬重物，对持续长距离行走的需求并不突出。</p>\n  <p>2023年前后，一批电力巡检、森林消防、边境巡逻的行业客户提出了新诉求，为了匹配长时间翻山行进的需求，需要更小巧、专注步行减负的设备。为此，傲鲨在产品定义上进行了一次重心调转，弱化大载荷搬运能力，把轻量化与步行助力放到设计的第一位。</p>\n  <p>直到2024年，始祖鸟发布MOBILE膝盖助力系统，迅速引爆了整个市场的认知。这也让傲鲨看到了切入泛消费市场的机会。</p>\n  <p>但傲鲨并不是简单转向消费电子逻辑。到VIATRIX X，这款脱胎于工业体系的外骨骼真正瞄准的，却是体量更为庞大的泛户外群体。最典型的就是平日里久坐办公、周末到山野徒步的中产白领。</p>\n  <p>而山野野外不同于工厂内平整的铺装路面，转弯、跨沟、侧身避让、坡道姿态调整都是常态。</p>\n  <p>由于人体髋关节的运动是多轴复合运动，但传统刚性外骨骼的机械转轴与人体生物关节轴线存在偏移。所以不少外骨骼产品在实验室、平路环境测试表现亮眼，一旦进入复杂山地，就会出现卡胯、摩擦等不适感，直接毁掉户外体验。</p>\n  <p>这正是傲鲨坚持自研Float360四自由度浮动式髋关节架构的原因。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_318897c5ae0c4e7a9d27cdc5b9f02bdb@6022551_oswg1642045oswg1682oswg1102_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Float360滚珠结构（图源/企业）</p>\n  <p>“人的髋关节非常灵活，可以向三个主要方向活动，我们研发的四自由度浮动式外骨骼髋关节，能全面覆盖人体大腿与髋关节的运动轨迹。”徐振华告诉硬氪，传统外骨骼的髋关节大多仅有一个或两个转轴，本质上是用机械结构去规定人的运动轨迹。</p>\n  <p>而Float360在髋部与大腿之间布置了多组浮动关节，把原本被锁死的运动维度打开，让外骨骼的转轴不再固定在一个点上，而是随人体姿态实时调整，更贴合人体髋部与大腿的复合运动轨迹，给肢体动作预留充足的随动冗余。</p>\n  <p>Float360的设计思路，也折射出消费级外骨骼行业正在形成的共识：多自由度的竞争，从来不是比拼转轴数量的纸面数字，核心在于重构人和机器的关系。</p>\n  <p>“所谓有效自由度，价值是把动作主动权交还给使用者，在完整保留人体原生活动能力的前提下叠加助力。”徐振华说。</p>\n  <p>但这套设计理念仅靠线上文字、演示视频很难让户外人群建立切身感知。为此，傲鲨选择与瑞典头部户外品牌火柴棍合作，二者目标用户高度重合，都是面向热爱徒步、山野出行的户外爱好者。</p>\n  <p>依托火柴棍的线下资源，傲鲨落地常态化体验点位，用户可以直接到门店亲身穿戴外骨骼，直观感受自由度与助力效果。通过真实试用体验完成认知教育，逐步在核心户外圈层沉淀用户心智。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260927/v2_b194c6166c934ebfb47dac7badfa5957@6022551_oswg4245272oswg2054oswg1496_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">傲鲨外骨骼产品在火柴棍门店展出（图源/企业）</p>\n  <p>在徐振华看来，人类进入山野本就离不开科技加持。冲锋衣解决防水保温，碳纤维材料实现装备轻量化，登山杖提供物理支撑；而外骨骼更进一步，它是一套输出力学辅助的智能化设备。</p>\n  <p>和辅助的冲锋衣等类似，外骨骼的终极命题从来不是制造 “超人”，而是学会如何尊重人的身体。</p>\n  <p>它不会消除徒步本身的疲惫，也无法替代人在山野中的体验与坚持，但它可以让人走得更远，有机会抵达依靠自身难以抵达的山野。</p>", "category": "tech", "published_at": "2026-09-28T01:30:00+00:00", "fetched_at": "2026-09-28T03:17:35.594397+00:00", "fingerprint": "16b9225c247b7c3d"}, {"source": "36氪 - 最新文章", "title": "清华教授张跃钢：固态电池卡在“两个界面”，锂金属电池试图绕过去｜最前线", "url": "https://36kr.com/p/4001096388448137?f=rss", "summary": "<p>固态电池，未必是下一代锂电池的唯一答案。</p>\n  <p>日前，在北京的2026锂金属电池前沿论坛（LMBF 2026）论坛上，36氪与大会主席、清华大学长聘教授张跃钢进行了一次交流。</p>\n  <p>过去几年，固态电池几乎成为动力电池行业最热门的技术方向之一，但在张跃钢看来，行业首先需要厘清一个基本概念：固态电池和锂金属电池，本来就不是两个可以直接比较的技术代际。</p>\n  <p>原因是，两者属于不同的分类维度。</p>\n  <p>电池的能量密度，主要由正负极材料决定。正极可以是磷酸铁锂、高镍三元、富锂锰基乃至硫，负极则经历了从石墨向硅碳、锂金属的演进；而所谓固态和液态，区分的是电解质形态。</p>\n  <p>换句话说，固态电池改变的是电解质，锂金属电池改变的是负极。真正决定一块电池能装进去多少能量的，首先还是正负极。因此，锂金属负极电池同样是下一代电池技术的关键演进分支。</p>\n  <p>而在张跃钢看来，行业目前炙手可热的固态电池路线，仍有多项材料技术难关需攻克。</p>\n  <p>据介绍，张跃钢是清华大学长聘教授，国际著名材料科学家，30余年国内外材料科研经历，先后就职于日本电气基础研究所、美国斯坦福大学、英特尔、伯克利国家实验室、中国科学院等，在纳米材料、能源存储技术等领域取得多项重要研究成果。</p>\n  <h3>固态电池，卡在两个<strong>“</strong>界面<strong>”</strong></h3>\n  <p>固态电池最吸引行业的地方，是用固态电解质替代易燃的有机液态电解液，从而应用更前沿的正负极材料，将能量密度推高至500Wh/kg级别。但今天困扰行业的仍然是固态电解质的界面问题，而张跃钢向36氪详细拆解了这些难题。</p>\n  <p>张跃钢认为，核心问题其实可以归结为两个“界面”。</p>\n  <p>第一个是正极内部的微观界面。</p>\n  <p>电池正极并不是一整块致密材料，而是由大量颗粒构成，内部存在大量纳米级孔隙。液态电解液可以像水一样渗入这些微小空间，与正极材料充分接触；但固态电解质很难做到这一点。</p>\n  <p>如果为了改善离子传输而加入更多固态电解质，又会挤占真正储存能量的活性材料空间，最终拖累整块电池的能量密度。</p>\n  <p>第二个问题是负极与固态电解质之间的界面以及锂枝晶问题。</p>\n  <p>过去一个常见判断是，固态电解质机械强度更高，可以物理阻挡锂枝晶。但张跃钢认为，经过十余年的研究，目前各种固态电解质仍然没有真正解决这一问题。</p>\n  <p>固体材料天然存在微观缺陷，锂会沿着缺陷继续生长。一旦形成贯穿通道，甚至可能迅速导致内部短路。</p>\n  <p>此外，固体和固体之间不像液体一样能够充分润湿，本质上更接近“点接触”。为了降低界面阻抗，需要增加电解质比例以及工作压力，但这又与提高能量密度的目标形成矛盾。</p>\n  <p>因此，电池下一代技术的另一条演进思路则是，暂时保留液态电解液，率先把负极换成锂金属。</p>\n  <p>这条路线过去最大的障碍同样是锂枝晶。</p>\n  <p>锂在反复沉积过程中很难始终保持绝对平整，会逐渐长出类似树枝一样的结构。一旦枝晶持续生长并刺穿隔膜，就可能造成内部短路。</p>\n  <p>张跃钢介绍，目前一个重要解决思路，是利用液态电解液中的添加剂，在锂金属表面形成SEI保护膜。当这层膜在充放电过程中出现裂缝，添加剂可以继续反应，对破损区域进行动态修补。</p>\n  <p>通过这种方式，枝晶可以被控制在微米尺度，从而大幅降低其持续生长导致短路的风险。但代价也很明显。SEI膜不断破损、修补，就意味着电解液会被持续消耗。</p>\n  <p>按照张跃钢给出的进展，目前相关锂金属电池已经可以实现上百次循环，部分500Wh/kg级高比能产品已超过300圈，400Wh/kg级产品可达600圈，但距离新能源汽车普遍要求的上千次循环仍有距离。</p>\n  <h3>第一批锂金属电池，可能先<strong>“</strong>飞上天<strong>”</strong></h3>\n  <p>张跃钢判断，锂金属电池更现实的商业化路径是先进入无人机、eVTOL，再进入具身智能机器人，最后才是新能源汽车。</p>\n  <p>原因并不复杂。</p>\n  <p>对于汽车而言，300次甚至600次循环显然不够；但对于航空器而言，重量直接关系到航程和载荷，每提升一点能量密度都可能产生更高的商业价值。因此，无人机和eVTOL愿意为高比能电池支付更高成本，也更有动力率先采用新技术。</p>\n  <p>机器人也是类似逻辑。随着具身智能进入实际应用，续航时间、重量和瞬时功率都会成为核心指标，高能量密度电池的价值会被进一步放大。</p>\n  <p>按照张跃钢的判断，如果<strong>400Wh/kg</strong>级锂金属电池未来两三年能够把循环寿命提升至上千次，就有机会进入车企验证；<strong>500Wh/kg</strong>级产品如果达到<strong>700—800</strong>次循环，也可能开始上车测试。</p>\n  <p>在张跃钢看来，今天，液态电解液可能帮助锂金属负极率先产业化；几年以后，当更高比能的正极材料，例如硫正极，出现新的需求，固态电解质又可能重新成为重要拼图。</p>\n  <p>所谓“下一代电池”，最终也许不会属于某一个听起来足够革命性的技术名词，而属于那套最先同时解决能量密度、界面和循环寿命的材料组合。</p>", "category": "tech", "published_at": "2026-09-28T02:36:17+00:00", "fetched_at": "2026-09-28T03:17:35.594381+00:00", "fingerprint": "08332242a629baf3"}, {"source": "少数派", "title": "本月玩什么｜鬼武者 剑之道、火焰纹章 万缕千丝、轨道双子星等", "url": "https://sspai.com/post/115056", "summary": "《鬼武者》系列的惊艳复活，《风花雪月》的世界观延续，赛璐珞动画风格的双人历险……<a href=\"https://sspai.com/post/115056\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-27T09:50:09+00:00", "fetched_at": "2026-09-28T03:17:34.347603+00:00", "fingerprint": "8be83ce6425884f2"}, {"source": "少数派", "title": "派早报：OpenAI 称与苹果合作效果不佳", "url": "https://sspai.com/post/115079", "summary": "<p>OpenAI 称与苹果合作效果不佳</p><p>iPhone 4「天线门」媒体问答录像时隔十六年现身</p><p>F-Droid 2.0 发布</p><p>三星冰箱固件升级后罢工，影响韩国用户过中秋</p><p>Excel 单元格将支持数组</p><p>微软不再使用 Copilot+ PC 品牌</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/115079\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-27T23:03:45+00:00", "fetched_at": "2026-09-28T03:17:34.347592+00:00", "fingerprint": "5b7a44f209b711d3"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
