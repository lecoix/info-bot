e": "36氪 - 最新文章", "title": "毕业多年，全网却抢着重做一道语文题", "url": "https://36kr.com/p/3943421440212104?f=rss", "summary": "<p>毕业这么多年，全网突然争着做一道小学语文填空题。</p>\n  <p><strong>题目长这样：（xxx）稳定存钱，（xxx）环游世界。补关联词。</strong></p>\n  <p>小学二年级水平。但就是这么一道题，能让全网吵成一锅粥。</p>\n  <p>第一反应，大多数人填的是“只要稳定存钱，就能环游世界”。逻辑很硬，没钱还想出门？但很快有人掀桌子：“我填‘一边稳定存钱，一边环游世界’怎么就不行了？凭什么非得先吃够苦才配享福？”接着又有人冷笑：“与其稳定存钱，不如环游世界。存钱的尽头不就是过得爽点吗？本末倒置个什么劲。”</p>\n  <p>这些答案，官方都判对。</p>\n  <p><strong>这道题是8月17日汉堡王在支付宝“疯狂碰友日”活动里出现的。</strong>用户在汉堡王门店用支付宝“碰一下”就能答题抽权益。官方也准备得够周全，备了一堆正确答案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_395b0d1129864df88134f6818e74a260@19153231_oswg124776oswg1080oswg2103_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但网友们照样捧着被判“错误”的答案，冲上社交媒体“赛博升堂”，把自己的思路掰开揉碎讲得头头是道。一道填空题，活生生被答成了人生态度辩论赛，还站队。</p>\n  <h2><strong>你是哪一派？</strong></h2>\n  <p>评论区早就盖成高楼了。翻了一遍，大概三派。</p>\n  <p><strong>人数最多的，还是“延迟满足派”。</strong></p>\n  <p>“只有稳定存钱，才能环游世界。”“必须稳定存钱，为了环游世界。”“先能稳定存钱，再去环游世界。”</p>\n  <p>主打一个卧薪尝胆，先苦后甜。钱是硬门槛，没钱寸步难行。刚毕业不久的年轻人深有体会，存钱就像硬指标，账上数字不涨就心慌。还在实习的大学生@G&nbsp;说职场就是打怪升级，爆金币是唯一动力，但赚了钱也不敢乱花。“我就想攒个大的，再奖励自己一次旅游。”学生党没钱没假期，刚入职更不敢请长假，忍，攒，等，一条路走到黑。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_e6ab9d74e41645e0a5327f44bbc6d30a@19153231_oswg61685oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>另一派完全不吃这套。</p>\n  <p>“一边稳定存钱，一边环游世界。”“不仅稳定存钱，还要环游世界。”</p>\n  <p><strong>苦和甜必须同步到账，谁跟你玩延迟满足那套。</strong>青春有保质期，玩心说退就退。工作五年的小学老师@X&nbsp;在答题区甩了一句：“等我存够钱，可能已经没有想去玩的冲动了。”人家有寒暑假，完全能做到两手抓。敢这么填的，要么是职场运气不错，要么就是自己把日子盘明白了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_4da9ab198b5c40dc8caad70a2e9076f6@19153231_oswg20018oswg1080oswg201_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>水哥填的是“（一边）稳定存钱，（一边）环游世界”。他说这就是他一直在做的事。他打赌女儿会写“（爸爸）稳定存钱，（我）环游世界”，结果女儿填的是“（先）稳定存钱，（再）环游世界”。小姑娘认真解释：环游世界是稳定存钱的结果。</p>\n  <p>爸输得挺彻底。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_fcbd0f9e0d8845a8af01910729e51e64@19153231_oswg123581oswg1080oswg2084_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>还有一派，直接掀桌。</p>\n  <p>“与其稳定存钱，不如环游世界。”“宁愿稳定存钱，也不环游世界。”</p>\n  <p><strong>二选一，爱谁谁。</strong>有人压根没有攒钱规划，赚多少花多少，及时行乐拉满；也有人对诗和远方没兴趣，就想窝着，手上有粮心里不慌，楼下晒晒太阳就挺好。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_20249b27244145dba15e6203d26b1d62@19153231_oswg88092oswg1080oswg392_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>说到底，这题的答案根本不是关联词。你填的是自己的人生态度。<strong>题眼把“存钱”和“环游世界”怼在一起，逼你回答一个老掉牙的问题：先吃苦，还是先享受？</strong></p>\n  <h2><strong>别拿代际说事</strong></h2>\n  <p>乍一看，这题是按年龄站队的。</p>\n  <p>老一辈眼里苦永远排在甜前面，他们字典里甚至没有“旅游”这词，出门就是铺张浪费；90后开始背包客穷游，00后更狠，低成本环游世界挑战，存钱和看世界两不耽误。</p>\n  <p><strong>姜思达填的是：“（以后再）稳定存钱，（现在先）环游世界。”</strong>手动加顺序。理由很直接：钱肯定要，环游世界也不便宜，但比存钱更重要的，是敢把钱花在路上。缺了再挣。</p>\n  <p>这几乎是年轻人的活法宣言。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_f117a789ba7747a0a6f2549371358cd1@19153231_oswg158096oswg1080oswg1844_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但翻完评论区你会发现，代际差异根本兜不住这事。</p>\n  <p>填“只有稳定存钱，才能环游世界”的，不少是走入职场的95后。手里有点存款，但还是怕——怕不确定性，怕哪天断粮。年纪不大，胆子不大。</p>\n  <p>填“一边一边”的，反而有不少是已经存够底气的80后。尤其是觉醒的中女，年轻时拼过了，如今家庭稳定、积蓄在手，开始补偿自己。周末飞别的城市度个假，甚至冲去新加坡看演唱会，比谁都勤。</p>\n  <p><strong>更绝的是，同一个人，不同心境下，答案也不相同。</strong></p>\n  <p>15号发工资那天：</p>\n  <p>只要稳定存钱，就能环游世界。月底余额见底：</p>\n  <p>只有稳定存钱，才能环游世界。刚休完假回来：</p>\n  <p>与其稳定存钱，不如环游世界。996干了一年哪儿也没去：</p>\n  <p>必须稳定存钱，为了环游世界。</p>\n  <p>所以别扯什么代际。<strong>这道题测的是你当下的状态——你和自己的生活处得怎么样？手里的余额够不够让你松弛？钱还是不是你的头号焦虑？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_ccbabc161b264d879c35cfde86824cc6@19153231_oswg80062oswg1080oswg725_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>《格外的活法》里有句话挺戳人。吉井忍花了七年采访那些活在主流赛道之外的人，她在前言里写：“我也暂时不那么急着寻找答案。看目前的样子，路变窄了，但还可以走。”</p>\n  <p>书里的人面对日常的琐碎和烦躁，不着急找答案，接受状态模糊的自己，用现有的能力应对不确定性。</p>\n  <p><strong>人生可不是等存够钱才开始的游戏。</strong></p>\n  <h2><strong>标答？不存在的。</strong></h2>\n  <p>官方准备的正确答案已经够多了，但还是框不住所有人。</p>\n  <p>答题页面里，一堆人收到“回答错误”后扭头就发社交媒体：“凭什么我填的不算对？”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_9438f1b295944fb1abfd9b838dc37721@19153231_oswg17461oswg1080oswg239_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>有人填：<strong>“又能稳定存钱，还能环游世界。”</strong>——为什么不能找一份环游世界的工作？数字游民已经把工位搬去了大理、清迈、巴厘岛，工作游玩两不误。</p>\n  <p>有人填：<strong>“不管稳定存钱，必须环游世界。”</strong>——破罐破摔怎么了？反正也存不下，不如先快活。钱能再挣，时光溜走了就是溜走了。</p>\n  <p>还有人填：<strong>“只想稳定存钱，不想环游世界。”</strong>——凭什么非得开眼看世界？我就想存够钱提前退休，做个FIRE族，窝在自己的世界里追剧打游戏，楼下吸口新鲜空气，不行吗？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_3a43b6b52fb94f5eb669d8cf184d8202@19153231_oswg270583oswg1080oswg733_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>这些超纲的答案，往往牵引出更具体的人生。而具体的人生，往往更动人。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_306e0e8eaa2c47b48c35bd022169be84@19153231_oswg73970oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>语文题可以有标准答案，但人生没有。在真实的困境面前，从来没有什么二选一。年轻人都是在存钱和享受的博弈里，把日子经营得越来越像自己的。</p>\n  <p><strong>支付宝和汉堡王出的这道题，最聪明的地方在于——它没打算教你怎么活。它只出了半句话，括号留给你。</strong></p>\n  <p>而这届年轻人接过笔，填上了自己的“非标准人生”。</p>\n  <p>所以，你填什么？</p>", "category": "tech", "published_at": "2026-08-17T09:40:02+00:00", "fetched_at": "2026-08-18T00:57:30.174198+00:00", "fingerprint": "673653a47399053d"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机；高盛称市场对美联储加息的预测仍过于激进", "url": "https://36kr.com/p/3943607663443073?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>超讯科技：上半年净利润5172.53万元，同比下降28.25%</strong><br />36氪获悉，超讯科技披露半年报，2026年上半年实现营业收入5.65亿元，同比下降64.92%；归属于上市公司股东的净利润5172.53万元，同比下降28.25%；基本每股收益0.33元。</p>\n  <p><strong>锅圈：上半年实现营收39.47亿元，同比增长21.8%</strong><br />36氪获悉，锅圈发布半年报，2026年上半年实现营收39.47亿元，同比增长21.8%；净利润2.13亿元，同比增长12.1%；核心经营利润2.25亿元，同比增长18.3%。</p>\n  <p><strong>吉利汽车桂生悦‌回应管理层调整：从创始人驱动迈向由制度和团队驱动的成熟期</strong></p>\n  <p>36氪获悉，8月17日，吉利汽车控股有限公司宣布管理层调整规划。吉利汽车董事会副主席桂生悦称：“这标志着吉利汽车已从‘创始人驱动’的创业期和发展期，迈向了由‘制度与团队驱动’的成熟期，企业从依赖个人魅力与权威，转向依赖组织系统和人才梯队，意味着企业治理更透明、决策更专业、管理更科学。对内部人才而言，也是天花板打破的信号”。</p>\n  <p><strong>森马服饰：上半年净利润同比增长47.45%，拟10派1.5元</strong><br />36氪获悉，森马服饰披露半年报，2026年上半年，公司实现营业收入67.22亿元，同比增长9.32%；归属于上市公司股东的净利润4.79亿元，同比增长47.45%；基本每股收益0.18元。公司拟每10股派发现金红利1.5元（含税）。</p>\n  <p><strong>钶锐锶科创板IPO过会</strong><br />36氪获悉，8月17日，上交所上市审核委员会召开2026年第47次上市审核委员会审议会议，审议结果显示，广东钶锐锶数控技术股份有限公司首发符合发行条件、上市条件和信息披露要求。</p>\n  <p><strong>新联电子：上半年净利润4.53亿元，同比增长140.95%</strong></p>\n  <p>36氪获悉，新联电子披露半年报，2026年上半年，公司实现营业收入4.08亿元，同比增长8.25%；归属于上市公司股东的净利润4.53亿元，同比增长140.95%；基本每股收益0.54元。</p>\n  <p><strong>大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机</strong><br />从大疆创新（DJI）获悉，美国当地时间8月14日，大疆创新诉美国国防部案迎来重大实质性进展。美国哥伦比亚特区联邦巡回上诉法院裁定，下级法院需重新审理大疆被列入五角大楼“中国军事企业”（CMC）黑名单一案。这一裁决标志着大疆在美长达数年的相关法律维权取得了重要的程序性胜利。针对上诉法院的这一最新裁决，大疆向记者提供的声明称：“我们欢迎美国上诉法院作出的这一积极裁决，这是最终纠正不当列名的重要一步。该裁定也进一步印证了大疆一贯坚决反对将产品与技术用于任何军事或战争用途的立场。未来，我们将继续通过法律途径，坚决捍卫公司及全球用户的合法权益。”（环球时报）</p>\n  <p><strong>千问办公开源MyContext，为Agent打造全新的上下文基础设施</strong><br />36氪获悉，千问办公于近日开源了全新的上下文基础设施“MyContext”。它可以把海量异构的个人工作数据加工成Agent易理解的专属工作档案，让Agent读懂用户和真实业务工作流，并最终在决策和执行等环节实现人机协同，提升Agent在工作场景下的表现。</p>\n  <p><strong>小米SU7系列累计交付突破50万台</strong><br />36氪获悉，据小米汽车消息，小米SU7系列累计交付突破50万台。</p>\n  <h2>投融资：</h2>\n  <p><strong>AI视频生成平台Higgsfield完成4亿美元新一轮融资</strong><br />据报道，AI视频生成平台Higgsfield成功完成4亿美元的新一轮融资，投资者包括DST Global、高盛、Liberty Global以及英特尔旗下投资部门等。本次融资将Higgsfield的估值推升至54亿美元。数据显示，公司今年8月的年化收入已高达7亿美元，与一年前仅约2000万美元的规模相比，增长34倍。（界面）</p>\n  <h2>新产品：</h2>\n  <p><strong>支付宝发布国内首个智能体商业底座</strong><br />36氪获悉，支付宝今日发布首个全栈智能体商业底座及多智能体跨端互联AHA协议体系，联合千问、华为、OPPO、比亚迪、吉利等20余家企业共建智能体互联生态。据了解，支付宝旗下超级服务智能体“阿宝”目前完成了超过一万项服务的AI化接入，服务跨端支持5大手机品牌、16家主流车企。</p>\n  <p><strong>宇树科技发布“超人”</strong><br />36氪获悉，宇树科技发布新机“超人”。宇树科技称，该人形机器人突破全人类极限。0.85米腿长，可原地跳高2米，极限速度12.66m/s，超越全世界全人类原地跳高和奔跑速度记录。全新整机刚用3个多月研发出来，未来几个月还有很大的完善空间。</p>\n  <h2>今日观点：</h2>\n  <p><strong>国家统计局：下沉市场消费活力在增强</strong><br />8月17日，国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，随着县域商业体系的加快建设，物流配送体系、信息网络向乡村延伸，下沉市场的消费活力在增强。1—7月份，乡村消费品零售额占社会消费品总额比重为13.4%，比上年同期提高了0.2个百分点。（证券时报）</p>\n  <p><strong>高盛称市场对美联储加息的预测仍过于激进</strong><br />8月17日，据报道，高盛集团表示，鉴于全球最大经济体的通胀正在降温，市场对美联储加息的押注仍然过于激进。该投资银行的首席经济学家Jan Hatzius在给客户的一份报告中写道，由于零售销售数据下滑，就业数据不及预期以及通胀增速放缓，美联储在9月会议上加息已变得“极不可能”。Hatzius在周日发布的报告中写道：“根据我们的基线经济预测，通胀形势接下来更有可能进一步改善而非再次恶化。我们仍然认为市场对联邦基金利率的定价过于鹰派。”（界面）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>国家统计局：1—7月份全国网上商品和服务零售额117214亿元，同比增长4.8%</strong><br />&nbsp;</p>\n  <p>国家统计局新闻发言人付凌晖在17日举行的国新办新闻发布会上说，今年1至7月份，我国装备制造业和高技术制造业增势良好，工业机器人产量同比增长28.5%，3D打印设备、锂离子电池产量同比分别增长52.3%、40.2%。（央视新闻）<br />&nbsp;</p>", "category": "tech", "published_at": "2026-08-17T12:54:00+00:00", "fetched_at": "2026-08-18T00:57:30.174188+00:00", "fingerprint": "78be6bf14bd69cad"}, {"source": "36氪 - 最新文章", "title": "全球供应链重构关键期，出海企业的本地化实战与挑战｜超级会氪厅", "url": "https://36kr.com/p/3938833643961733?f=rss", "summary": "<p>对于不少中国出海企业来说，2026年称得上是全球化布局从横向铺开转向纵向深入的一年。</p>\n  <p>过去几年，中国企业出海的逻辑已经发生深刻变化。在早期的“产品出海”阶段，企业关心的是如何把产品通过各种渠道卖出去，解决线下流量获取、线下物流履约和支付结算等问题。</p>\n  <p>但到了2026年，关税持续加码迫使“产能出海”成为新的趋势。从越南的电子制造集群、泰国的家电生产基地、墨西哥的汽车零部件产业带到中东的新兴工业区，中国企业在新兴市场的身影越来越密集。</p>\n  <p>出海企业产能迁移的步伐加快，挑战也随之升级。企业在海外完成落脚的第一步后，开始面对真正扎根本地市场的新命题——关税波动、区域市场差异、跨区域协同等挑战，迫使出海企业进一步审视原有的全球运营模式。</p>\n  <p><strong>能否下好供应链全球化布局的“一盘棋”，建立一套多个市场有效协同的全球运营体系，是决定出海企业能否真正在海外市场站稳脚跟的必备能力。</strong></p>\n  <h2><strong>工厂容易搬出国，但管理很难跟上</strong></h2>\n  <p>很多企业出海后发现，把产线搬到海外并不难，难的是如何重构海外工厂的运营和管理制度。</p>\n  <p>一些成熟大公司虽然已在国内搭建起完善的管理系统，但试图将这套系统搬到海外时，往往会遇到大量现实阻碍。比如因为当地网络基础设施跟不上，制造执行系统运行卡顿；当地技术人员不习惯国内自动化设备的操作逻辑、报表格式，企业培训成本高、周期长；甚至有企业将国内系统的界面语言翻译为本地语言时，因为表达不够准确地道，当地员工难以理解，导致工作效率反而降低。</p>\n  <p>在管理层面，由于信息沟通与决策链路被拉长，总部对海外工厂的掌控力也难以达到国内水平。库存水位是否合理、生产进度是否正常、品质数据是否达标……这些问题在国内随时可以通过系统实时查看。但到了海外，由于沟通被迫退回到Excel报表、电子邮件等方式，不仅这些问题难以及时得到解决，还会产生数据滞后、口径不统一等新麻烦。</p>\n  <p>当然，也有先行者已经摸索出一些解法，比如某家电企业的泰国工厂通过AI应用覆盖多个核心业务场景，大幅提升成品合格率和订单处理效率。也有企业在海外工厂构建“云-边-端”协同的数字化架构，通过智能排产系统实现设备效率的提升。</p>\n  <p>但是这些成功实践的背后，是大量的试错、投入和时间成本。对于大多数中小型出海企业来说，仍然难以在资源有限的情况下，找到适合自身阶段的海外工厂管理模式。</p>\n  <p>另一个实操层面的难题是产业链协同。虽然产业链集群“抱团出海”已经成为行业共识，但“走出去”以后利益机制如何设计，协作效率如何保障等问题，至今没有标准答案。而如果核心供应商不跟着一起走，企业只得从零开始在本地重构海外供应链，难度系数再上一个台阶。</p>\n  <h2><strong>本地化运营：不只是物理空间迁移</strong></h2>\n  <p>虽然出海企业普遍深知本地化运营的重要性，但往往首先想到的是建厂、招人、铺渠道，忽略了数字化层面的本地化。</p>\n  <p>随着业务规模变大，数字化资产的管理难度也会同步增加。不同于工厂、产品这些有形资产，企业在多个国家开展业务时，对品牌名称、后台数据、供货系统等数字化资产的使用、存储和流动等不可避免存在差异，稍有不慎就可能付出巨大代价。</p>\n  <p>越来越多出海企业意识到，数字品牌资产管理和落地在本地化运营体系中的重要性，如何建立一套清晰的框架统筹品牌数字资产的全球化运营，确保品牌标识在任何一个关键市场都能被有效保护和管理，已成为出海企业不可忽视的基础工作。</p>\n  <p><strong>2026年8月19日，36氪将联合威瑞信在深圳共同举办「深水规则」· 出海系列超级会氪厅线下活动，我们特别邀请到威瑞信客户管理部高级总监张志等深耕新兴市场的基础设施服务商与出海实战操盘手。</strong></p>\n  <p>嘉宾们将围绕<strong>“本地化运营”</strong>与<strong>“供应链重构”</strong>两大核心议题，就产能转移决策、海外工厂数字化、数字品牌资产保护等关键议题，分享各自的实战经验与趋势洞察，并与参会企业从多维度展开探讨。</p>\n  <p><strong>欢迎出海企业的创始人、CEO及供应链、运营、海外业务负责人报名活动，共探中国企业全球化突围的务实路径。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_dee1fabeb65b4d45a225cf613fa1822f@6385117_oswg2479000oswg1080oswg5873_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-08-17T13:33:42+00:00", "fetched_at": "2026-08-18T00:57:30.174177+00:00", "fingerprint": "6cf079e5564e4a40"}, {"source": "36氪 - 最新文章", "title": "硬氪专访 | 荣耀李健：在行业下行期，做一款9999元的云台手机", "url": "https://36kr.com/p/3943831281663362?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>Robot Phone或许是荣耀CEO李健上任来压力最大的一款产品 。</p>\n  <p>8月12日的发布会现场，荣耀Robot Phone背部的摄像头缓缓升起，跟着音乐摆动。它还瞄准了眼前的拍摄对象，随着人物不断转来转去，像一颗长在手机上的“机器人脑袋”。 以前固定在手机背板里的摄像头，第一次“动”了起来。</p>\n  <p>Robot Phone售价9999元起，作为荣耀“阿尔法战略”后的首款新形态产品，这不仅是一款把价格攻到万元级的高端旗舰手机，也集中投射了荣耀对AI手机的想象。</p>\n  <p>在早已沉寂的手机赛道，这款产品带来了少有的亮色。</p>\n  <p>但它的诞生伴随着波折和动荡。在与硬氪等媒体交流的一个半小时里，李健提到了18次“压力”、12次“难”。</p>\n  <p>过去一年，内存成本上涨、全球手机市场空间缩减超过10%——约等于掉走了一家大型手机公司完整的份额。在这种严酷的环境中，荣耀依旧需要探索第二曲线，拿出一款重磅产品，拿回牌桌上的位置。</p>\n  <p>“如果用一幅画描述荣耀当前的状态，我认为它就像一只准备起飞的雄鹰，遭遇了狂风暴雨，正处于关键阶段。”李健告诉硬氪。</p>\n  <p>哪怕他们高管自己“都心里打鼓”， 荣耀也只能走完最难的那条路。</p>\n  <p>Robot Phone工程难度极高。手机原本已被芯片、电池、镜头和散热系统占满，而Robot Phone还要放入一套由100多个精密零件组成的机械系统，同时还要保证机身厚度控制在9毫米厚、248克重的极限里。</p>\n  <p>为此，荣耀对工业设计和内部架构调整了十多个版本，前后花了大半年，引进了钛合金、盾构钢等全新的材料方案，最终才把电机整体做到2.6克——约等于半张A4纸的重量。</p>\n  <p>把云台做小做轻之外，还要耐用。</p>\n  <p>在Robot Phone上，云台与主板之间共有68根线，其中19根是同轴线。这些线既要塞进有限的机身空间，还要经得起云台反复升降和旋转——尤其是，作为一款日常使用的手机，它还要满足手机行业出厂前极其残酷的跌落、滚筒测试，与其他手持云台独立产品完全不是一个难度量级。</p>\n  <p>更大的问题出现在发布前一两个月。</p>\n  <p>荣耀产品线总裁方飞告诉硬氪，当时，团队发现翻转机构的寿命只能达到约一年，距离手机的正常使用周期还有明显差距。</p>\n  <p>但Robot Phone 是一款不能失败的产品。“我们的压力很大，直到前面一个月我们的高管还在问到底做的怎么样。AI能力、影像能力、设计的水平最后汇总到Robot Phone这里。”李健说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_0284c97563e343d88628476af28437e9@1199336245_oswg472445oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>随后在短短一周内，荣耀测试了18种材料方案，并同时协调材料、加工、模组、整机、研发等团队集体攻坚，最终才将设计寿命提升至五年。</p>\n  <p>经过这样的捶打后，Robot Phone卖点突出，和云台相机、手机，都做到了区隔。</p>\n  <p>影像方面，荣耀与德国摄影设备厂商阿莱（ARRI）合作，引入多种专业影像功能（ARRI LogC3曲线、伪色监看、峰值对焦等），兼顾专业创作者的需求。</p>\n  <p>在AI方面，荣耀与阿里千问大模型深度合作，Robot Phone也搭载了系统级智能体架构，能够结合图像、声音和手势，理解用户及周围环境，完成规划和执行。李健对下一代手机的判断是，手机将从“应用的容器”变成“智能体的载体”，而AI不再只是聊天框，而是跳出屏幕，对现实世界作出反馈。</p>\n  <p>其实，选择在此时推出一款结构复杂、投入不低、市场尚未得到验证的产品，对荣耀而言完全不是一个轻松的决定。不过荣耀交出了漂亮的结果——预定超过 40 万台；开售一分钟电商全平台售罄。</p>\n  <p>此外，李健在采访中透露，即将于9月28日发布的旗舰新机Magic9 将全面承接 Robot Phone 沉淀的 AI、影像、底层算力技术，实现旗舰产品力跨越式升级，是历代Magic系列中升级最多，变化最大的一代。</p>\n  <p>“人最怕成见，希望大家可以掀掉过去对荣耀的印象，重来新的一页。”李健这样期待着。</p>\n  <p><strong>以下是硬氪与李健、荣耀产品线总裁方飞的部分交流实录（略经摘编）</strong></p>\n  <p><strong>硬氪：如何理解荣耀当下的发展状态？</strong></p>\n  <p><strong>李健：</strong>如果用一幅画描述荣耀当前的状态，我认为它就像一只准备起飞的雄鹰，遭遇了狂风暴雨，正处于“逆势破局、风雨新生”的关键阶段。</p>\n  <p>当前，两股力量正在交汇。一股是向下的压力，全球内存供应紧张，消费电子行业承压，全球手机的市场空间往下跌了百分之十几；同时，受特殊历史背景影响，荣耀面临的竞争压力也更为突出。</p>\n  <p>另一股是向上的力量。在荣耀进行战略调整以来，技术、产业、生态三方面都处于快速向上拉的过程。</p>\n  <p>就像一艘船，被一正一反两股力量打了之后容易晃，晃了之后就会晕，晕了之后就搞不清楚状态，但我觉得没关系。一个企业不经历磨难是不可能伟大的，我们感谢这个时代内存的压力、感谢竞争的压力，反倒会锻炼荣耀坚强的队伍。</p>\n  <p><strong>硬氪：既然手机厂商现在处于一个比较艰难的阶段，为什么荣耀会选择Robot Phone这样比较超前的项目？</strong></p>\n  <p><strong>方飞：</strong>Robot Phone最初源于我们对于移动影像形态的思考。随着视频记录越来越普遍，我们希望把云台与手机结合起来，但真正的难点是：如何在保证握持感和便携性的同时，把云台装进一部小尺寸手机。</p>\n  <p>为此，我们的团队对工业设计和内部架构进行了十几轮调整，光ID设计和架构设计配合的雕琢就有十几个版本，大半年时间都在折腾这件事。后来，钛合金、盾构钢、定制电机等方案，都是为解决空间、强度和可靠性问题引入的。</p>\n  <p>云台内部有数十根线缆，还需要实现三轴运动和TOF感知，结构非常复杂。但到发布前一两个月，我们发现翻转机构的寿命只能达到约一年。</p>\n  <p>所以我们的团队在一周内测试了18种材料方案，并协调材料、加工、模组、整机、研发、采购、供应和交付团队共同解决，最终将设计寿命提升到五年。</p>\n  <p>其实，在阿尔法战略提出后，我们需要重新定义荣耀手机的产品方向，去年4月至6月，我们明确将AI多模态、具身智能与影像结合，把Robot Phone定位为具身智能AI影像手机。</p>\n  <p>但是当时我们几个高管都心里打鼓，但我们认为，不确定性也代表机会，我们肯定要蹦起来够得着的东西，而不是躺着就能做出来的东西。</p>\n  <p><strong>硬氪：在全球消费电子市场承压的情况下，您如何看待荣耀上半年在全球市场的表现，海外市场和中国市场分别是什么情况？</strong></p>\n  <p><strong>李健：</strong>今年上半年，荣耀全球销量增长9%、收入增长11%，是安卓厂商中增长最快的品牌之一。</p>\n  <p>再看中国市场，我们一季度表现较好，但二季度受到涨价的影响，目前市场份额超过10%。数据听起来可能没有那么好，但中国区市场正在企稳回升。根据BCI数据，7月荣耀是中国市场唯一环比正增长的厂商，是份额提升最大的厂商，排名回到国内第四。</p>\n  <p>再看海外市场，今年上半年，荣耀海外销量增长20%、收入增长26%，在荣耀已经进入的海外重点市场中，份额超过10%的国家有十多个。</p>\n  <p>分享一组数据：</p>\n  <p>拉美市场收入增长约15%，其中墨西哥增长67%，墨西哥是很难做的市场；</p>\n  <p>中东市场份额我们排名第二，仅次于三星；在沙特，我们的手机排名第二、平板排名第一；</p>\n  <p>东南亚市场，马来西亚市场份额排名第一，超过苹果三星；</p>\n  <p>欧洲市场上半年增长超过60%，包括AIoT在内的全场景业务增长98%。</p>\n  <p>总体来说，我们在海外一枝独秀，国内是承压的，但也在回升。</p>\n  <p>此外，荣耀的海外业务增长也呈现出结构性变化：全场景及AIoT产品增长98%。过去海外的线上不行，现在线上增长接近100%。</p>\n  <p>从价格段来看，因为内存上涨的原因，我们400美金到800美金手机档位增长了425%——上半年这么难增长4.2倍。</p>\n  <p><strong>硬氪：能否分享一下，未来AI手机发展的方向是什么样的？</strong></p>\n  <p><strong>方飞：</strong>Robot Phone代表了我们对AI手机的一种探索。我们判断，以前手机是装应用的容器，未来会变成“智能体的舞台”，能理解人的意图，帮助用户规划，并完成任务。</p>\n  <p>AI手机还会根据用户的习惯和所处场景，主动提供服务。这背后会带来OS的变革、服务模式、应用模式的变革。</p>\n  <p>另外，AI不能只停留在软件层面，还要和具体产品结合。比如，办公类AI可以更多地用在大屏设备上，影像类AI可以帮助用户拍摄和创作，游戏类AI则可以结合高性能手机来提升体验。</p>\n  <p>但要实现这一点，关键是让设备拥有对用户的长期记忆，并持续了解用户的行为变化。同时，AI既要在手机本地运行，也要使用云端能力——本地处理速度快、成本低，云端则可以完成更复杂的任务。</p>\n  <p>我觉得，这种变化不只会发生在手机上，PC、平板、眼镜和其他穿戴设备都会改变，也可能出现新的产品形态。过去主要依靠触屏操作，未来语音、手势等交互方式会越来越多。</p>\n  <p>同时，家庭场景也可能出现一个统一的中心，用来管理手机和其他设备中的数据、内容与计算能力，让用户在不同设备之间切换时，服务仍然能够延续。现在还没有完全解决的问题是，不同品牌的设备和AI如何相互协作。</p>\n  <p><strong>硬氪：Robot Phone和人形机器人、荣耀其他的手机产品之间，有哪些技术是共用的？</strong></p>\n  <p><strong>李健：</strong>人形机器人和Robot Phone以及很多技术确实共栈的。因为手机本身具备高可靠、强通信的特性，包括续航，业界很少知道机器人电池荣耀可以自己制造的，我们有真正的电池产线的。</p>\n  <p>在人形机器人用到的一些无人控制，包括电机、高强度的轻薄材料、仿真技术，以及人形机器人发展中的多媒体交互、影像交互、人机交互、语音交互，都可以利用共栈到手机的平台上，这个技术底座和人形机器人非常契合的。</p>\n  <p><strong>硬氪：现在有一些友商正在做云台相机的单独产品，Robot Phone立项的时候，有没有想过单独做一个独立的形态？为什么一定要融合进手机？</strong></p>\n  <p><strong>李健：</strong>我们在做Robot Phone的时候确实没有考虑过做单独的云台产品，因为我们期望找到一个形态既能够体现荣耀的影像，又能够体现荣耀AI的能力。</p>\n  <p>我从来不认为Robot Phone只是一个纯影像的手机，我们费了这么大劲做AI方面和人的互动，这只是开始。我们要让AI走出屏幕，后面一堆的事可以去想象。</p>\n  <p>这个形态出来，我们一定要把标杆立上去，我们的压力很大，直到前面一个月我们的高管还在问到底做的怎么样。AI能力、影像能力、设计的水平最后汇总到Robot Phone这里。</p>\n  <p><strong>硬氪：Robot Phone是集大成的产品，集合了荣耀在AI、影像、硬件上的种种创新，在Magic9上会如何承接Robot Phone的技术探索？</strong></p>\n  <p><strong>李健：</strong>Magic9里面AI的能力将会远超其他所有终端厂商的能力，同时，我们也在努力提升AI能力、影像能力，Agentic OS也会在Magic9上做一个全新的尝试。</p>\n  <p>新的形态虽然会有一些不足，但我相信在一个成熟形态下，会让大家感觉Magic9值得等待。人最怕成见，希望大家可以掀掉过去对荣耀的印象，重来新的一页。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_b8de74b6dbc64fa98e663a848c5122c7@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-08-18T00:00:00+00:00", "fetched_at": "2026-08-18T00:57:30.174165+00:00", "fingerprint": "284aaa537db88a77"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨李书福辞任董事会主席，吉利汽车管理层大调整；iPhone17或全球涨价，最高涨价近千元；宇树科技发布“超人”", "url": "https://36kr.com/p/3944273186241673?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>DeepSeek API 8月17日正式调价，最高涨幅达1100%&nbsp;</p>\n  <p>大涨12%，长鑫市值约为2.5个茅台</p>\n  <p>豆包支持手机远程操控电脑</p>\n  <p>旺旺食品旗下多家公司已注销</p>\n  <p>人民币对美元汇率升破6.74，创三年半新高</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>吉利汽车宣布管理层调整：李书福辞任董事会主席，安聪慧接任</strong></p>\n  <p>36氪获悉，吉利汽车控股有限公司宣布对管理层进行调整，自2026年8月18日起，李书福辞任吉利汽车控股有限公司董事会主席及执行董事职务。为表彰李书福多年来对公司发展做出的卓越贡献，他获任为公司终身荣誉主席。李书福继续担任浙江吉利控股集团董事长。安聪慧获任吉利汽车控股有限公司董事会主席。此外，李东辉辞任吉利汽车控股有限公司董事会副主席职务，继续担任公司执行董事。桂生悦辞任吉利汽车控股有限公司行政总裁职务，获任公司董事会副主席，继续担任公司执行董事。淦家阅获任吉利汽车控股有限公司行政总裁。</p>\n  <p>针对李书福卸任吉利汽车董事会主席一事，吉利汽车董事会副主席桂生悦在2026年中期业绩发布会上回应称，这是吉利汽车去家族化的宣言，标志着公司将不再依赖个人魅力和权威，未来治理将更加透明，决策将更加专业和科学。（36氪、第一财经）</p>\n  <p><strong>iPhone 17系列或月底前全球涨价，单台最高涨近千元</strong></p>\n  <p>iPhone 17系列或即将迎来一轮全球性调价。8月17日，供应链内部消息称，苹果计划在2026年8月底前完成全球各区域iPhone 17系列调价，全机型涨价上限不超千元人民币，调价标准可参照此前日本落地的涨价方案。</p>\n  <p>就在7月18日，日本市场上调了iPhone、Apple Watch及AirPods系列产品售价，为苹果近年来在该地区首次大范围价格调整。具体来看，iPhone 17 Pro Max最高存储版本售价由32.98万日元升至35.48万日元，上涨2.5万日元（约合人民币1060元）；iPhone 17起售价由12.98万日元升至14.28万日元，涨1.3万日元（约合人民币551元）。Apple Watch Series 11、Ultra 3及AirPods系列产品也同步提价。市场认为，成本上升、汇率变化及供应链因素推动价格调整。在中国市场，苹果尚未宣布调整iPhone 17系列的价格，但在6月上调了Mac、iPad全系硬件定价，覆盖MacBook全系列、iPad全系、Mac桌面设备、Vision Pro与HomePod。（界面新闻）</p>\n  <p><strong>宇树科技发布“超人”</strong></p>\n  <p>36氪获悉，宇树科技发布新机“超人”。宇树科技称，该人形机器人突破全人类极限。0.85米腿长，可原地跳高2米，极限速度12.66m/s，超越全世界全人类原地跳高和奔跑速度记录。全新整机刚用3个多月研发出来，未来几个月还有很大的完善空间。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek API 8月17日正式调价，最高涨幅达1100%&nbsp;</strong></p>\n  <p>8月17日，DeepSeek API正式涨价。DeepSeek官方公众号8月13日曾发布消息称，对DeepSeek API价格进行更新调整，采用峰谷定价，空闲时段价格为高峰时段价格的一半。高峰时段为北京时间9:00-12:00、14:00-18:00(其余为空闲时段)。新价格于北京时间8月17日00:00开始生效。</p>\n  <p>以旗舰模型DeepSeek-v4-pro为例，高峰时间段，V4 Pro每百万tokens输入（缓存未命中）9元，涨幅200%；输出27元，涨幅350%；缓存命中输入0.3元，涨幅1100%。空闲时间段，V4 Pro每百万tokens输入（缓存未命中）4.5元，输出13.5元，缓存命中输入低至0.15元。DeepSeek-V4-Pro正式版于8月13日发布，该版本增强了智能体（Agent）能力。当时，DeepSeek-V -Pro价格是轻量级模型V4 Flash的大约三倍。以每百万tokens计算，V4 Pro输入是0.025元（缓存命中）和3元（缓存未命中），输出则是6元。相比之下，V4 Flash对应的价格分别为0.02元、1元和2元。</p>\n  <p>据了解，DeepSeek此次推出峰谷定价的核心初衷，是平衡日间算力拥堵问题。借助市场化价格杠杆，引导企业开发者错峰调度大模型任务，分流高峰算力压力，从而提升整体平台运行稳定性。（界面新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_29942a6c91004efda3c83ec062c0de4d@5667365_oswg45786oswg1080oswg595_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DeepSeek API 新定价</p>\n  <p><strong>千问办公开源MyContext，为Agent打造全新的上下文基础设施</strong></p>\n  <p>36氪获悉，千问办公于近日开源了全新的上下文基础设施“MyContext”。它可以把海量异构的个人工作数据加工成Agent易理解的专属工作档案，让Agent读懂用户和真实业务工作流，并最终在决策和执行等环节实现人机协同，提升Agent在工作场景下的表现。</p>\n  <p><strong>英伟达为OpenAI俄亥俄州AI数据中心提供最高1050亿美元担保</strong></p>\n  <p>8月17日，英伟达宣布与SB Energy达成多年期合作，推进美国俄亥俄州PORTS Technology Campus大型AI数据中心建设。OpenAI将作为该项目租户，使用约4.25吉瓦IT负载容量部署英伟达全栈DSX AI工厂平台。英伟达已就相关租赁安排提供最高1050亿美元的剩余价值担保，并可自行决定为额外约3.8吉瓦容量提供信用支持。（界面新闻）</p>\n  <p><strong>OpenAI与英伟达扩大计算机会，到2030年计算规模或达6000亿美元</strong></p>\n  <p>根据英伟达发布的新闻稿，OpenAI将在PORTS-Pike建设并运营一座世界级的人工智能工厂。AI工厂将采用英伟达的全栈DSX AI工厂平台，包括GPU、CPU、网络和基础设施软件。 初步部署预计将提供4.25吉瓦的AI工厂产能。PORTS-Pike部署的每代NVIDIA AI工厂系统约可代表150万块NVIDIA GPU，约占1500亿美元至2000亿美元的NVIDIA收入。经过20年的发展，该站点支持多次升级周期。 NVIDIA也可能选择将PORTS-Pike的安排延长至初始4.25吉瓦以上，以确保剩余的3.75吉瓦容量。OpenAI承诺将在2030年前大规模部署NVIDIA AI基础设施。OpenAI现有和计划中的承诺约占NVIDIA计算12吉瓦，如果NVIDIA将PORTS-Pike协议扩展至约16吉瓦，将有机会扩展至约16吉瓦。 英伟达表示，在这些层面上，这一机会代表到2030年NVIDIA计算量约为6000亿美元。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>宇树科技：股票将于8月19日在上海证券交易所科创板上市</strong></p>\n  <p>36氪获悉，宇树科技公告，公司股票将于8月19日在上海证券交易所科创板上市。</p>\n  <p><strong>美股三大指数集体收跌，热门中概股涨跌不一</strong></p>\n  <p>36氪获悉，8月17日收盘，美股三大指数集体下跌，道指跌0.51%，纳指跌0.32%，标普500指数跌0.52%。大型科技股多数下跌，Meta、微软跌超3%，奈飞跌超2%，特斯拉、谷歌、亚马逊、苹果、英伟达小幅下跌；闪迪涨超8%，SpaceX涨超4%。热门中概股涨跌不一，老虎证券涨超5%，小鹏集团、富途控股涨超4%，拼多多涨超2%，蔚来、理想汽车涨超1%；名创优品跌超8%，京东、爱奇艺、微博、哔哩哔哩跌超1%。</p>\n  <p><strong>特朗普：美国不寻求延长与伊朗的谅解备忘录</strong></p>\n  <p>8月18日讯，美国总统特朗普表示，美国目前不寻求延长与伊朗的谅解备忘录。特朗普称，伊朗希望达成协议，但不会接受他认为“必要的”协议内容。特朗普再次提出将霍尔木兹海峡宣布为美国领土的想法，并重申美国控制该海峡。他同时声称，目前霍尔木兹海峡保持开放，油价正在下行。(金十数据APP)</p>\n  <p><strong>大涨12%，长鑫市值约为2.5个茅台</strong></p>\n  <p>8月17日，长鑫科技（688825.SH）股价大涨，并创下上市以来新高。截至当天收盘，报61.8元/股，涨12%，最新总市值4.13万亿元，是A股目前市值最高的个股，其市值约为贵州茅台的2.5倍（最新总市值1.62万亿元）。（界面新闻）</p>\n  <p><strong>支付宝发布国内首个智能体商业底座</strong></p>\n  <p>36氪获悉，支付宝今日发布首个全栈智能体商业底座及多智能体跨端互联AHA协议体系，联合千问、华为、OPPO、比亚迪、吉利等20余家企业共建智能体互联生态。据了解，支付宝旗下超级服务智能体“阿宝”目前完成了超过一万项服务的AI化接入，服务跨端支持5大手机品牌、16家主流车企。</p>\n  <p><strong>中国在稀土检测关键技术领域取得重要进展</strong></p>\n  <p>8月17日了解到，近日，中国在稀土检测关键技术领域取得重要进展。长期以来，高纯稀土中稀土杂质含量准确测定面临基体干扰的难题，并严重制约稀土产品质量的精准把控。为突破这一技术瓶颈，依托江西理工大学建立的国家市场监督管理总局重点实验室（稀土产品检测与溯源）开展专项技术攻关，经过研究团队的不懈努力，检测技术取得突破，整体技术能力迈上新台阶。研究团队成功研发出多项稀土检测关键技术，其中电感耦合等离子体串联质谱法直接测定高纯稀土中的稀土杂质含量技术尤为突出。该技术成功突破了传统检测方法需要提前对基体进行分离、存在检出限高等瓶颈，具备高灵敏度、高准确性和快速检测等显著优势，能够直接精准测定高纯稀土中的痕量稀土杂质，为稀土产品质量控制提供了坚实有力的技术支撑。（央视新闻）</p>\n  <p><strong>两部门：研究完善成品油消费税制度，完善成品油定价机制</strong></p>\n  <p>36氪获悉，国家发展改革委、国家能源局印发《石油天然气发展“十五五”规划》。其中提到，推动上游供气主体多元化。促进城镇燃气企业整合重组，规范化经营，落实好天然气上下游价格联动机制。规范供气企业行为，更好发挥天然气合同基础性作用，完善储气调峰市场机制。加强民生用气保障。研究完善成品油消费税制度。完善成品油定价机制。定期校核跨省天然气管道运输价格。</p>\n  <p><strong>豆包支持手机远程操控电脑</strong></p>\n  <p>8月17日，豆包发布产品更新，“工作任务”模式新增手机远程控制电脑功能。同一账号授权后，用户在手机端下达任务指令，可以由已连接的电脑端读取本地文件、操作软件完成执行，进度和结果实时回传手机，帮助用户在通勤、离开工位等各类场景中自动执行任务，提升效率。（第一财经）</p>\n  <p><strong>贵州茅台低开3.5%，失守1300元关口</strong></p>\n  <p>8月17日，A股主要指数集体高开，上证指数低高开0.07%，深证成指高开0.31%，创业板指高开0.18%，科创综指高开0.27%。有色金属、农业、算力硬件等板块涨幅居前，大消费低迷，白酒股领跌，贵州茅台低开CRO概念回调。贵州茅台低开3.5%，失守1300元关口。消息面上，贵州茅台发布2026年半年度报告，上半年归属于上市公司股东的净利润445.17亿元，同比下降1.95%。其中公司Q2净利润172.74亿，Q1净利润272.43亿，据此计算，Q2净利润环比下降36%。（每日经济新闻）</p>\n  <p><strong>胖东来今年已成立2家新公司</strong></p>\n  <p>36氪获悉，据媒体报道，近日，于东来在直播中宣布许昌胖东来生活广场店将于2026年12月关闭。该广场内厂商代表称，他们的合作方就是胖东来，胖东来从来没有涨过他们的房租。天眼查App显示，许昌市胖东来商贸集团有限公司成立于1997年9月，法定代表人为于东来，注册资本5660万人民币，控制企业信息显示，今年以来，该公司已成立胖东来餐饮（郑州）有限公司、许昌市胖东来乐予文化娱乐有限公司。</p>\n  <p><strong>旺旺食品旗下多家公司已注销</strong></p>\n  <p>36氪获悉，日前，旺旺集团的一封内部公开信流传网络，董事长蔡衍明将集团2026财年第一季度的业绩失速直接定性为“重大经营危机”。天眼查App显示，旺旺集团关联公司旺旺（中国）投资有限公司成立于2004年9月，法定代表人为李玉生，注册资本5000万美元，经营范围包括在中国的食品、饮料以及相关产品及房地产、医疗机构等国家允许外商投资的领域依法进行投资等。对外投资信息显示，该公司旗下多家企业已注销。此外，该公司存在历史被执行人信息。</p>\n  <p><strong>人民币对美元汇率升破6.74，创三年半新高</strong></p>\n  <p>36氪获悉，人民币对美元汇率在在岸和离岸市场双双升破6.74关口。8月17日，人民币对美元即期汇率盘中升破6.74关口，创下2023年2月上旬以来新高。离岸市场上，人民币对美元汇率同样升破6.74关口，至6.7388，同样刷新3年半新高。</p>\n  <p><strong>钉钉全球商业总裁杨猛将离任，下一站蚂蚁集团</strong></p>\n  <p>钉钉新管理层完成组织调整不到两个月，负责商业化多年的核心高管杨猛即将离任。记者从接近钉钉的知情人士处获悉，钉钉全球商业总裁、客户发展部负责人杨猛已完成离职相关内部流程，计划加入蚂蚁集团。阿里钉钉悟空副总裁任卿（花名“易统”）将接手杨猛负责的商业化工作。（21世纪经济报道）</p>\n  <p><strong>大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机</strong></p>\n  <p>从大疆创新（DJI）获悉，美国当地时间8月14日，大疆创新诉美国国防部案迎来重大实质性进展。美国哥伦比亚特区联邦巡回上诉法院裁定，下级法院需重新审理大疆被列入五角大楼“中国军事企业”（CMC）黑名单一案。这一裁决标志着大疆在美长达数年的相关法律维权取得了重要的程序性胜利。针对上诉法院的这一最新裁决，大疆向记者提供的声明称：“我们欢迎美国上诉法院作出的这一积极裁决，这是最终纠正不当列名的重要一步。该裁定也进一步印证了大疆一贯坚决反对将产品与技术用于任何军事或战争用途的立场。未来，我们将继续通过法律途径，坚决捍卫公司及全球用户的合法权益。”（环球时报）</p>\n  <p><strong>中信资本收购阿里旗下灵犀互娱已正式生效</strong></p>\n  <p>从接近交易的人士处获悉，灵犀互娱CEO周炳枢于8月17日发布内部信，确认阿里巴巴集团与中信资本旗下信宸资本已正式达成交易协议。根据协议安排，阿里巴巴将出让所持有的灵犀互娱股份，信宸资本将成为灵犀互娱的新任股东。此前，有报道称，中信资本旗下信宸资本以超15亿美元（折合人民币超101亿元）收购阿里巴巴灵犀互娱。（上证报）</p>\n  <p><strong>英伟达高管、黄仁勋之女将于8月18日到访LG电子机器人中心</strong></p>\n  <p>行业消息人士8月17日透露，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）计划于本周晚些时候到访LG电子公司在韩国的机器人中心。黄敏珊定于8月18日访问，计划与LG电子高层官员就双方在人工智能（AI）基础设施和机器人领域深化合作的事宜举行闭门会谈。预计此次会谈将主要聚焦机器人业务，地点设在LG电子位于首尔南部正在建设的数据工厂。（新浪财经）</p>\n  <p><strong>亚马逊修改使用条款，再度禁止用户发起集体诉讼</strong></p>\n  <p>根据亚马逊当地时间本月14日更新的使用条款，这家全球电商与科技巨头带回了曾在2021年被移除的一系列争议处理条款，再度禁止用户发起集体诉讼。此次更新的争议条款还表示，用户与亚马逊的争议或索赔应通过具有约束力的仲裁而非法律诉讼解决（例外包括符合小额索赔法庭管辖范围、涉及知识产权、涉及全体公众利益），双方放弃在法院提起诉讼并由法官或陪审团审判的权利。（新浪财经）</p>\n  <p><strong>高盛助攻英伟达：5000亿美元计划，破解AI基建最大资金瓶颈</strong></p>\n  <p>英伟达正着手解决AI热潮中日益凸显的核心制约——融资难题。高盛已开始与保险公司、银行及资产管理公司接洽，推动英伟达动员超过5000亿美元资金，用于AI基础设施建设。此举有望让客户在无需将全部成本压在自身资产负债表上的情况下，持续采购日益昂贵的英伟达系统。这项于8月10日宣布的计划，将英伟达与高盛、阿波罗、贝莱德、黑石、布鲁克菲尔德和KKR等机构联合起来，打造独立的融资平台，专门服务于英伟达驱动的AI基础设施。英伟达可能为相关交易提供最高1250亿美元（约占总规模25%）的支持。（新浪财经）</p>\n  <p><strong>韩国散户扎堆个股杠杆ETF，券商与交易所两月大赚超千亿韩元手续费</strong></p>\n  <p>自跟踪三星电子与SK海力士的单一股票杠杆、反向ETF上市以来，韩国交易所与各家券商两个多月累计赚取手续费收入超1170亿韩元。有观点指出，个人投资者蜂拥入局这类高风险产品，负责市场运营的交易所与提供交易中介服务的券商赚取了巨额手续费。17日从金融监督院、韩国交易所获取并提交的数据显示：三星电子、SK海力士相关单一股票杠杆及反向ETF自5月27日上市至上月末，交易所与券商合计收取相关手续费达1172.6亿韩元，相关产品共计16只。交易活跃的交易日，交易所单日手续费收入便可突破10亿韩元。6月24日手续费收入10.51亿韩元，上月14日达10.11亿韩元。（财联社）</p>\n  <p><strong>美国要求韩国将存储芯片作为首个对美投资重点</strong></p>\n  <p>韩国政府原计划于本月晚些时候公布的首个对美投资项目，因美国突然要求韩国投资存储芯片生产设施而面临不确定性。多名未具名执政党人士称，美国要求韩国投资存储芯片项目，是8月13日韩国总统府闭门贸易会议讨论的核心议题。韩国政府最初将能源领域作为首个重大对美投资项目的优先方向。一位未具名官员称，美国正在调整优先事项，并提出额外要求。与会人士普遍认为，鉴于三星电子和SK海力士已承诺在韩国Honam地区进行大规模投资，在美国投资存储芯片项目实际上会很困难。（新浪财经）</p>\n  <p><strong>OpenAI总裁回应高管流失潮：并非十分反常</strong></p>\n  <p>OpenAI总裁格雷格・布罗克曼于周一回应，淡化市场对这家人工智能公司高管流失的担忧，他认为这一轮离职潮“实际上并非十分反常”。布罗克曼表示：“我其实觉得，OpenAI和其他机构的区别在于我们处在极高的聚光灯下，每一次人员离职都会受到格外审视，而普通企业的人员变动不会遭遇这样的待遇。”“公司发展历经不同阶段，各个时期都有不同的管理团队。”布罗克曼周一称，“我和萨姆・奥尔特曼始终留在公司，我认为，正是这种韧性以及团队多元性，让我们变得更强大。”（新浪财经）</p>\n  <p><strong>机构警告全球食品价格通胀或迎来新一轮危机</strong></p>\n  <p>美国金融机构摩根大通日前发布最新报告预计，全球食品价格通胀率将从今年上半年的2.8%提升至明年上半年的5%。这家机构表示，下一次全球通胀冲击可能不会出现在加油站，而是在超市的食品货架。摩根大通在报告中警告，中东战事导致霍尔木兹海峡通行受阻，加之强厄尔尼诺可能造成农作物减产，多重因素叠加将冲击农业生产，导致食品价格在2027年上半年居高不下。（新华社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>湖南裕能新能源电池材料股份有限公司递表港交所</strong></p>\n  <p>36氪获悉，港交所文件显示，8月17日，湖南裕能新能源电池材料股份有限公司向港交所提交上市申请书，中信建投国际和汇丰为联席保荐人。</p>\n  <p><strong>软银向建筑机器人公司Gravis Robotics投资2亿美元</strong></p>\n  <p>8月17日，Gravis Robotics宣布完成2亿美元A轮融资，由软银投资。公司称，这是建筑机器人领域规模最大的A轮融资，将用于推进重型工程机械自动化，并在全球建筑工地扩大部署。Gravis Robotics成立于2022年，由苏黎世联邦理工学院孵化，主要开发用于挖掘机等重型工程机械的人工智能系统。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>传音控股：上半年净利润同比增长46.22%，拟10派8元</strong></p>\n  <p>36氪获悉，传音控股披露半年报，2026年上半年实现营业收入354.31亿元，同比增长21.85%；归属于上市公司股东的净利润为17.73亿元，同比增长46.22%；基本每股收益1.54元。公司拟每10股派发现金红利8元（含税）。</p>\n  <p><strong>吉利汽车：2026年上半年收入超1700亿元，核心归母净利润同比增长46%</strong></p>\n  <p>36氪获悉，吉利汽车控股有限公司发布2026年中期业绩，上半年公司总营收达1736亿元，同比增长15%，创历史新高。核心归母净利润达96.8亿元，同比增长46%；核心归母净利率5.6%，同比增长27%。毛利率提升至17.9%，单车收入同比提升16%至11.2万元。</p>\n  <p><strong>新联电子：上半年净利润4.53亿元，同比增长140.95%</strong></p>\n  <p>36氪获悉，新联电子披露半年报，2026年上半年，公司实现营业收入4.08亿元，同比增长8.25%；归属于上市公司股东的净利润4.53亿元，同比增长140.95%；基本每股收益0.54元。</p>\n  <p><strong>中材科技：上半年净利润12.08亿元，同比增长20.93%</strong></p>\n  <p>36氪获悉，中材科技披露半年报，2026年上半年，公司实现营业收入162.57亿元，同比增长21.95%；归属于上市公司股东的净利润12.08亿元，同比增长20.93%；基本每股收益0.7197元。</p>\n  <p><strong>多氟多：上半年净利润5.12亿元，同比增长897.19%</strong></p>\n  <p>36氪获悉，多氟多披露半年报，公司上半年实现营业收入70.36亿元，同比增长62.55%；归属于上市公司股东的净利润5.12亿元，同比增长897.19%；基本每股收益0.43元/股。</p>\n  <p><strong>宁波韵升：上半年净利润2.74亿元，同比增长154.18%</strong></p>\n  <p>36氪获悉，宁波韵升披露半年报，2026年上半年，公司实现营业收入33.37亿元，同比增长42.02%；归属于上市公司股东的净利润2.74亿元，同比增长154.18%；基本每股收益0.2547元。</p>\n  <h2>投融资</h2>\n  <p><strong>AI视频生成平台Higgsfield完成4亿美元新一轮融资</strong></p>\n  <p>据报道，AI视频生成平台Higgsfield成功完成4亿美元的新一轮融资，投资者包括DST Global、高盛、Liberty Global以及英特尔旗下投资部门等。本次融资将Higgsfield的估值推升至54亿美元。数据显示，公司今年8月的年化收入已高达7亿美元，与一年前仅约2000万美元的规模相比，增长34倍。（界面新闻）</p>\n  <p><strong>“猿声科技”连续完成三轮融资，金额超亿元</strong></p>\n  <p>36氪获悉，具身触觉企业“猿声科技”宣布连续完成三轮融资，分别由恒信华业、上富电技和拓普集团领投，曦晨资本等财务机构跟投，融资额超亿元人民币。据公司披露，猿声科技首款多维触觉标准产品推出后，已进入多家国内外头部灵巧手、机器人及数据采集客户的量产项目，年内传感器订单总规模达到数十万颗。</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-08-18T00:05:17+00:00", "fetched_at": "2026-08-18T00:57:30.174144+00:00", "fingerprint": "cd7d406aef02fdc4"}, {"source": "少数派", "title": "成年人包里的唯一一支笔：模块笔入门导购", "url": "https://sspai.com/post/113445", "summary": "如果你的包里想带一支笔以备不时之需，这支笔应该就是你想要的。<a href=\"https://sspai.com/post/113445\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-17T03:00:00+00:00", "fetched_at": "2026-08-18T00:57:28.568420+00:00", "fingerprint": "fc1926e72d0ecb71"}, {"source": "少数派", "title": "当陶瓷水杯遇上像素屏：PixelMug 体验", "url": "https://sspai.com/post/113448", "summary": "如今，伴随着科技和生产力的发展，许多曾经只存在于科幻作品里的创意都逐渐变成了现实。各种新奇酷炫的产品，也开始在人们的刚需之外提供不一样的解法。尤其是那些无关「生产力」、单纯为了让生活变得更有意思的产品 ...<a href=\"https://sspai.com/post/113448\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-17T05:55:17+00:00", "fetched_at": "2026-08-18T00:57:28.568413+00:00", "fingerprint": "847f1a3e05075f69"}, {"source": "少数派", "title": "分享我知识管理 12 年来最重要的经验：INL 结构", "url": "https://sspai.com/post/113368", "summary": "你是不是有几百个笔记，超级乱，都懒得打开？今天我们介绍一个方法，可以让你不怎么整理，就能快速找到重点。<a href=\"https://sspai.com/post/113368\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-17T07:00:00+00:00", "fetched_at": "2026-08-18T00:57:28.568406+00:00", "fingerprint": "e3f51528cda5a0a7"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/113544", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/113544\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-17T10:14:56+00:00", "fetched_at": "2026-08-18T00:57:28.568394+00:00", "fingerprint": "6f5136259d44ae6b"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.8018 CNY ↑+0.58%", "url": "https://www.frankfurter.app/2026-08-17?from=AUD&to=CNY", "summary": "< ver. Amazon framed this as a \"fast and efficient\" way to resolve issues, but it notably would [&#8230;]", "category": "tech", "published_at": "2026-08-16T17:35:02+00:00", "fetched_at": "2026-08-17T00:58:34.023070+00:00", "fingerprint": "dba4ca149f58c3fa"}, {"source": "The Verge", "title": "Open Mike Eagle and Kenny Segal crafted a hip hop breakup masterpiece", "url": "https://www.theverge.com/entertainment/980799/open-mike-eagle-and-kenny-segal-doomed-review", "summary": "\"Breakups are… tough.\" It's the opening lines of an interlude towards the end of DOOMED! Called \"It Happens in Every Universe.\" It's also basically the thesis of the entire record. It's no grand revelation, but it's a well-trodden subject that Open Mike Eagle manages to mine for artistic gold. Eagle's subject matter is usually personal, [&#8230;]", "category": "tech", "published_at": "2026-08-16T20:31:37+00:00", "fetched_at": "2026-08-17T00:58:34.023063+00:00", "fingerprint": "e85ee583580cef8b"}, {"source": "The Verge", "title": "OpenAI reportedly disbanded its preparedness team", "url": "https://www.theverge.com/ai-artificial-intelligence/980817/openai-disbands-preparedness-team", "summary": "According to the Financial Times, OpenAI disbanded its preparedness team at the end of last month. The job of the preparedness team was to assess if models posed serious risks and develop ways to mitigate those risks. (You know, like the possibility that it could go rogue and hack another company.) According to FT, responsibility [&#8230;]", "category": "tech", "published_at": "2026-08-16T21:32:56+00:00", "fetched_at": "2026-08-17T00:58:34.023054+00:00", "fingerprint": "d1b7ed52e00e3aef"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨Anthropic有望2万亿美元估值上市；旺旺集团面临重大经营危机；Sorry勒索病毒正在国内传播", "url": "https://36kr.com/p/3942852697652356?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>宇树科技未上市先疯抢，部分中介出价520元/股</p>\n  <p>SK海力士董事长道歉，价格涨太快我很抱歉</p>\n  <p>段永平1300亿持仓曝光，大幅减持英伟达、谷歌</p>\n  <p>美图RoboNeo正式上线短剧专业版</p>\n  <p>小熊电器上半年净利下降4成，海外增长未能对冲国内压力</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>Anthropic有望2万亿美元估值上市，成为史上规模最大的IPO</strong></p>\n  <p>《财富》（fortune）8月13日发布博文，报道称Anthropic计划2026年10月以2万亿美元（现汇率约合13.51万亿元人民币）估值IPO上市，其规模将超过SpaceX，成为史上规模最大的IPO。业内指出，Anthropic已于6月向美国证券交易委员会秘密提交IPO相关文件，进入静默期，受此约束，企业不得对外发布涉及自身财务表现的公开信息。</p>\n  <p>今年Anthropic推出多款性能优于竞品的模型，同时聚焦面向企业客户的销售业务。公司于5月公布其年化营收已经突破470亿美元（现汇率约合3,175.75亿元人民币）。（IT之家）</p>\n  <p><strong>旺旺创始人发布公开信：旺旺集团面临重大经营危机</strong></p>\n  <p>近日，旺旺集团创始人蔡衍明一封内部公开信在网络上传播。信中直言公司第一季度业绩及利润表现未达预期，将其定性为“重大经营危机”，要求内部反思产品创新不足、渠道老化等深层问题。不少网友对旺旺情怀仍在，纷纷为其支招，其中最高频的建议为减糖，15日，“旺旺最大的对手竟是糖”登上微博热搜。</p>\n  <p>记者注意到，随后，“旺仔俱乐部”发布了一篇图文回应网友们的减糖呼声，晒出一系列无糖及低糖的旺旺新品，其中包括饮料、零食等。这篇图文提到，“未来将继续勇于尝试，努力成为更好的旺旺。”（北京日报）</p>\n  <p><strong>网络安全预警：Sorry勒索病毒正在国内传播</strong></p>\n  <p>近日，国家计算机病毒应急处理中心、计算机病毒防治技术国家工程实验室联合发布安全预警，中国境内已出现多起“Sorry”勒索病毒攻击案例。该病毒入侵后会加密用户设备内全部重要文件，统一追加“Sorry”后缀，同时留存勒索信。</p>\n  <p>不同于普通恶意程序需要用户手动点击、授权安装，“Sorry”勒索病毒可借助系统漏洞实现无感入侵，隐蔽性、攻击性更强。记者走访网络安全专家，通过实景测试完整还原病毒加密、勒索的全流程。专家表示，这次的勒索病毒，与以往大多数需要欺骗网民主动安装的程序不同，而是通过系统漏洞，直接登录服务器，入侵过程用户毫无感知。（央视网）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>“千问办公”首发上线GLM-5.3、DeepSeek V4 Pro两款模型</strong></p>\n  <p>阿里巴巴旗下Agent产品“千问办公”首发上线GLM-5.3和DeepSeek V4 Pro两款前沿模型。即日起，用户可在产品首页的“前沿模型”档位直接选用。加上此前首发上线的Qwen3.8-Max，千问办公目前已支持三款国产旗舰模型。</p>\n  <p><strong>英伟达据悉拟向软银旗下SB Energy投资30亿美元</strong></p>\n  <p>8月16日，据报道，英伟达正就向软银旗下SB Energy投资最多30亿美元进行谈判。SB Energy正在美国俄亥俄州开发一个大型数据中心项目，为OpenAI提供算力基础设施。据悉，该投资是英伟达、OpenAI与SB Energy围绕俄亥俄州数据中心项目提供约1000亿美元信贷支持的谈判组成部分。英伟达拟在项目签署时投资约15亿美元，其余资金可能通过SB Energy计划中的首次公开募股（IPO）投入。SB Energy最快拟于9月上市，预计募资至少50亿美元。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>知情人士回应追觅大家电解散：业务正常做</strong></p>\n  <p>近日，“网传追觅大家电解散”相关话题登上微博热搜，引发广泛关注。据流出内容，疑似追觅AWE期间冰箱相关业务供应商存在未结款情况，打算组团维权，引发大量供应商评论并唱衰追觅。部分人员甚至牵扯提及追觅裁员缩减、创始人俞浩卖掉私人飞机等事。</p>\n  <p>对于前述消息，截至发稿公司暂无回应。记者注意，目前发布该帖子的供应商已经删除相关内容。有接近追觅的知情人士透露，目前相关业务仍在“正常做”。（新浪科技）</p>\n  <p><strong>宇树科技未上市先疯抢，部分中介出价520元/股</strong></p>\n  <p>宇树科技场外“暗盘交易”悄然兴起。目前多家中介通过各类渠道收购该股新股，报价分歧较大，部分中介出价520元/股（发行价150.8元/股），亦有中介报价410元/股；不少中签者也主动上网寻觅买家。值得注意的是，这类“暗盘交易”以往常见于北交所新股，近期正向科创板明星股扩散。记者此前注意到，在长鑫科技上市前，也有中介高价回收该股新股，当时中介的报价是36元/股（发行价8.66元/股）。（券商中国）</p>\n  <p><strong>SK海力士董事长道歉，价格涨太快我很抱歉</strong></p>\n  <p>日前，SK集团会长崔泰源在SK海力士韩国总部接受媒体采访时，用这样的措辞形容当前的存储芯片市场。“价格涨得太快了，对此我真的很抱歉。”崔泰源表示。这并非崔泰源首次发出警告。今年7月，SK海力士在纳斯达克上市之际，他就曾指出AI时代内存需求呈指数级增长，未来五年产能翻倍仍难满足。而在此次专访中，他的预判更加具体、也更加紧迫。（上海证券报）</p>\n  <p><strong>黄仁勋投了马斯克210亿美元，为SpaceX第六大投资者</strong></p>\n  <p>英伟达当地时间14日向美国证券交易委员会提交的监管文件显示，截至今年二季度末，公司持有马斯克旗下SpaceX约1.228亿股A类股票，价值约210亿美元，为SpaceX第六大投资者。</p>\n  <p>根据金融数据机构FactSet的数据，SpaceX第一大股东为马斯克本人，按二季度末股价测算，其持股账面价值约8500亿美元。而英伟达的210亿美元持仓是该公司第二大股权持仓，仅次于英特尔。受近期SpaceX股价回调影响，该持仓当前市值已缩水。SpaceX股价14日收于140美元，较6月底的170.86美元下跌约18%，英伟达持股对应市值降至约172亿美元。报道称，英伟达对SpaceX的持股并非直接买入，而是源于今年1月对马斯克人工智能公司xAI的100亿美元投资。2月，SpaceX 以换股形式收购xAI，合并后实体估值1.25万亿美元，英伟达持有的xAI股权由此转换为SpaceX股权。（21世纪经济报道）</p>\n  <p><strong>段永平1300亿持仓曝光，大幅减持英伟达、谷歌&nbsp;</strong></p>\n  <p>截至二季度末，由段永平管理的H&amp;H International Investment基金总持仓市值约191亿美元，约合人民币1370亿元，较去年四季度末的200亿美元有所下降。二季度，段永平继续增持拼多多，重新买入阿里巴巴，同时减持苹果、英伟达、谷歌、微软等，清仓台积电、CrowdStrike等个股。（证券时报）</p>\n  <p><strong>今年以来港股IPO基石投资额同比增长158.3%&nbsp;</strong></p>\n  <p>今年以来，越来越多的机构投资者参与港股IPO基石投资。数据显示，截至8月14日，年内共有102家公司在港交所上市，募资总额达3287.58亿港元，同比增长154.17%。其中，84家公司IPO引入了基石投资者，涉及951笔投资，同比增长291%；基石投资额1392.1亿港元，同比增长158.3%。（证券日报）</p>\n  <p><strong>SK海力士上半年人均薪酬68.7万，较去年同期增长约23%</strong></p>\n  <p>SK海力士今年上半年营业总收入131.90万亿韩元（现汇率约合6,292.95亿元人民币），同比增长230.8%; 归母净利润134.15万亿韩元（现汇率约合6,400.3亿元人民币），同比增长788.16%；毛利率81.63%，同比增长26.24个百分点。财报显示，SK 海力士今年上半年公司员工人均薪酬为1.44亿韩元（现汇率约合68.7万元人民币），较去年同期的1.17亿韩元（现汇率约合55.8万元人民币）增长约23%。（IT之家）</p>\n  <p><strong>摩根大通：明年或爆发全球粮食危机，全球食品通胀率将从2.8%升至5%</strong></p>\n  <p>摩根大通日前警告称，下一轮全球粮食危机可能正在酝酿之中，或于明年爆发。该行分析师将驱动因素归结为“五个W”：战争（War）、天气（Weather）、仓储（Warehousing）、水（Water）和浪费（Waste）。</p>\n  <p>在一份题为《粮食安全即国家安全：一场不断叠加的风暴》（Food Security Is National Security: A Compounding Storm）的新报告中，由驻伦敦资深全球经济学家Nora Szentivanyi领衔的团队警告称，霍尔木兹海峡航运中断，以及潜在的历史级超强厄尔尼诺现象的出现，可能会削弱农作物产量、制约农业生产，并使食品通胀在2027年上半年持续居高不下。她预计，全球食品通胀率将从2026年上半年的2.8%加速升至明年上半年的5%。（新浪财经）</p>\n  <p><strong>上海迪士尼正扩建“飞越地平线”，第九大主题园区建设迎新进展</strong></p>\n  <p>第九大主题园区——蜘蛛侠主题园区建设迎来又一重要里程碑。继今年6月主题园区游乐设备轨道安装完成后，首批乘骑设备已于数日前就位，乘骑设备调试工作即将启动。上述消息于正在美国加利福尼亚州召开的迪士尼终极粉丝大会D23（以下简称“D23粉丝大会”）公布。此外，上海迪士尼乐园内标志性主题景点“翱翔·飞越地平线”的扩建工作正在同步推进；毗邻乐园的两座全新主题酒店的扩建工作也在进行中。（红星新闻）</p>\n  <p><strong>哈佛持有价值22亿美元SpaceX股份</strong></p>\n  <p>哈佛大学投资管理机构披露持有价值22亿美元SpaceX股份。这家机构早年投资埃隆・马斯克旗下火箭企业，在SpaceX重磅上市后收获巨额回报。哈佛管理公司于周五在监管申报文件中披露该持仓。在其规模43亿美元的美股投资组合里，SpaceX成为持仓市值最高的单一标的。这笔持仓充分体现：SpaceX在6月创下纪录的IPO，为一众大学捐赠基金带来丰厚收益。不少高校捐赠基金早在十余年前就通过风投渠道布局这家公司。根据最新公开数据，截至2025年6月，哈佛管理公司管理资产规模约570亿美元。并非只有哈佛受益于SpaceX登陆公开市场。加州大学旗下投资机构申报文件显示，持有价值约10亿美元SpaceX股票；北卡罗来纳大学、圣路易斯华盛顿大学同样持有该公司投资。</p>\n  <p><strong>李录大举加仓拼多多，持仓仅剩8只&nbsp;</strong></p>\n  <p>李录掌管的喜马拉雅基金，则大手笔清仓美国银行、西方石油、穆迪、标普全球、MSCI、H&amp;R Block等6只个股，同时大举加仓拼多多和伯克希尔B股。其中，拼多多更是被翻倍增持。截至二季度末，喜马拉雅基金总持仓市值由上季末的32亿美元升至37亿美元，持仓数量则进一步压缩至8只。（证券时报）</p>\n  <p><strong>美图RoboNeo正式上线短剧专业版</strong></p>\n  <p>36氪获悉，美图RoboNeo正式上线短剧专业版。美图RoboNeo短剧专业版围绕短剧洞察、3D场景搭建、团队协作及创作资产管理四大方向进行能力升级。官方资产库提供服装、发型、配饰、场景等素材，并支持快速生成角色三视图。</p>\n  <p><strong>澳研究人员利用干细胞培育出人类心脏瓣膜组织</strong></p>\n  <p>澳大利亚研究人员日前利用干细胞在实验室培育出人类心脏瓣膜组织，可用于研究心脏瓣膜的发育和病变过程，并可用于测试相关疾病的治疗方法。研究成果已发表在美国《细胞－干细胞》杂志上。澳大利亚默多克儿童研究所发布消息说，由该机构牵头的研究团队培育出的组织能够再现人类心脏瓣膜的分子特征和复杂结构。</p>\n  <p>研究团队成员霍莉·福格斯说，这项成果解决了心脏瓣膜生物学研究中的一项重要难题。此次培育出的组织有助于研究心脏瓣膜如何发育、成熟并发生病变，也可用于在实验室中测试潜在治疗方法。研究人员还用培育出的组织开展了炎症性瓣膜疾病相关测试。实验显示，当培育出的组织接触与风湿性心脏病相关的炎症蛋白后，组织变得僵硬，并出现与患病人类心脏瓣膜相符的生物标志物。（央视新闻）</p>\n  <p><strong>伯克希尔·哈撒韦第二季度增持谷歌</strong></p>\n  <p>当地时间8月14日，据报道，伯克希尔·哈撒韦在第二季度清仓了星座品牌（STZ）；减持了克罗格（KR）、第一资本金融（COF）、纽柯钢铁（NUE）、Ally金融（ALLY）、达维塔（DVA）。增持了谷歌A（GOOGL）、谷歌（GOOG）、达美航空（DAL）、莱纳房屋（LEN）、梅西百货（M）。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>迈时光电IPO辅导备案获受理</strong></p>\n  <p>中国证监会公示信息显示，苏州迈时光电股份有限公司的上市辅导备案申请于8月14日获受理，辅导机构为国泰海通证券。此次辅导备案获受理，标志着迈时光电进入上市辅导阶段。迈时光电成立于2015年，是一家在全球光互联领域具备垂直整合能力的平台型光学技术企业，长期专注于无源光器件的研发、生产与销售。（投中网）</p>\n  <h2>大公司财报</h2>\n  <p><strong>Anthropic第二财季营收超过115亿美元，较上年同期飙升至少13倍</strong></p>\n  <p>Anthropic PBC向潜在投资者表示，其第二季度营收较上年同期增长至少13倍。文件显示，Anthropic最近一个完整季度的初步营收超过115亿美元，2025年同期为7.87亿美元，今年第一季度为47.3亿美元。文件还显示，Anthropic在2026年第二季度调整后营业利润转为正值。相关讨论仍在进行中，这些数据仍可能调整。（财联社）</p>\n  <p><strong>小熊电器上半年净利下降4成，海外增长未能对冲国内压力</strong></p>\n  <p>8月13日，小熊电器披露2026年半年度报告。上半年，公司实现营业收入23.49亿元，同比下降7.34%；归属于上市公司股东的净利润1.20亿元，同比下降41.30%；扣非净利润1.09亿元，同比下降41.59%。利润降幅明显高于收入，反映出需求走弱之外，公司还面临成本、费用及业务结构变化带来的压力。（华尔街见闻）</p>\n  <p>整理｜何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-08-17T00:01:57+00:00", "fetched_at": "2026-08-17T00:58:33.929022+00:00", "fingerprint": "eff329a952264452"}, {"source": "36氪 - 最新文章", "title": "科创板上市公司投资脑机接口，微灵医疗获超亿元融资  ｜36氪独家", "url": "https://36kr.com/p/3941648190242185?f=rss", "summary": "<p>文｜刘凌果 胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪独家获悉，医学脑机接口企业微灵医疗，近日完成超亿元人民币融资。本轮融资由君重资本领投,英诺特（688253.SH）作为该基金的核心产业出资人，募集资金将重点用于推进植入式脑机接口核心产品的临床验证，加快医疗器械注册申报进程，完善生产制造体系建设，并持续拓展面向神经功能修复领域的临床应用布局。此前，微灵医疗已获得高榕资本、生命园创投、鼎晖投资、力合科创等多家一线投资机构加持。</p>\n  <p>微灵医疗成立于2019年，是36氪持续跟踪的脑机接口企业。“让天下没有难治的脑病。”是微灵贴在总部墙壁上的一句话。这个聚焦于严肃医疗的愿景，在当下水温沸腾的脑机接口赛道，似乎不如“人机交互”显得性感。</p>\n  <p>执着于治疗脑疾病，与创始人李骁健的学术履历、所接受的科学训练强相关。过去二十余年，李骁健的研究一直围绕大脑功能解析和脑疾病干预治疗展开。</p>\n  <p>从中科院生物物理研究所博士毕业后，李骁健在美国佐治亚医学院、西北大学芬博格医学院工作近10年。回国后，他加入中国科学院深圳先进技术研究院开展脑机接口技术研发，现为南方医科大学粤港澳大湾区脑科学与类脑研究中心和珠江医院双聘教授。</p>\n  <p>最近，李骁健因关于投资人的大胆“开麦”在圈内引发热议。在他看来，大家对脑机接口市场前景各有理解，无可厚非。“有人看好人机交互的想象空间，有人聚焦消费级应用的潜力。”但需要警惕的是“只关注太远的未来，忽略眼前的风险和困境”。</p>\n  <p>脑机接口问世50年，真正推进临床研究也不过是这几年的事。“踏踏实实先做好严肃医疗场景”，把技术积累扎实，是李骁健心中更好的选择。</p>\n  <p>在这个维度上，他找到的可行路径是：既然损伤就在大脑，就先修复大脑。“脑损伤患者往往因神经受损、神经信号无法有效传导，从而丧失或部分丧失对肢体的控制能力。但如果患者的大脑能正常产生运动意图，我们其实可以通过脑机接口技术修复受损的神经通路，实现脑网络的重塑。”</p>\n  <p>在李骁健看来，“脑”是脑机接口技术无可动摇的核心，而“机”是服务于脑的，通过引导脑网络的重塑过程，不但可以修复脑损伤，更可以发掘和推高大脑潜能。</p>\n  <p>比如，对于因脑卒中、脑外伤等脑损伤而导致运动功能受损的患者来说，“重获对原生肢体的控制能力能为患者带来更为直接的获益”；对于神经损伤过重，修复空间较小的患者来说，可以考虑部分功能修复、部分功能替代的协同方案。</p>\n  <p>微灵医疗这一覆盖神经功能恢复全过程的技术体系，被李骁健概括为“先诊后治，修替一体”。“国际上有好几个团队都造了脑机接口这把‘枪’，现在的关键问题是，靶在哪里？”</p>\n  <p>精准诊治脑疾病、保护修复脑神经，是他认为当下最迫切的临床需求，也是脑机接口证明自身确切临床价值的起点。</p>\n  <h2><strong>修复神经，</strong></h2>\n  <h2><strong>一场关于“重塑”的系统性工程</strong></h2>\n  <p>“修复神经”乍一听有些玄妙，其底层科学依据是大脑的神经可塑性。需要澄清的是，这里的“修复”，并非让已坏死的神经组织“复活”，而是借助植入式脑机接口通过脑机训练，让患者残存的神经环路重新组织，形成功能代偿。</p>\n  <p>李骁健将这一过程概括为神经系统的“网络重组、环路重塑和功能重建”：脑损伤后，原有神经网络会发生重组，脑机训练可以引导受损环路代偿性重塑，最终，新的环路实现原生功能的重建。这个过程中，脑机接口扮演的是“教练”角色，环路中的神经元是“运动员”。脑机接口训练残存的神经元学会代偿那些受损的神经元，重新联通中断的神经环路。</p>\n  <p>微灵医疗在全植入式脑机接口方面的系统性能力，并非只体现在某款面向具体适应症的医疗器械上，而是进一步延伸为一套植入式脑机接口临床平台。</p>\n  <p>它的硬件部分由电子植入体、体外控制器与神经刺激器、外骨骼等效应辅具组成，通过无线方式供电和传输皮层脑电信号。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260816/v2_05da48ccf9cf4130a8b153e903ac5c8e@5930287_oswg455361oswg1080oswg500_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">微灵医疗产品矩阵示意</p>\n  <p>其中，柔性薄膜皮层电极是这套系统贴近大脑的“触角”。据介绍，微灵的柔性电极厚约10微米，单片覆盖数厘米长宽。电极铺于脑皮层表面，不刺入脑组织，可以在较大范围内采集不同脑区的神经活动。李骁健表示，电极片的形貌、触点间距和大小以及植入位置和周期等技术参数，都由要解决的具体临床问题决定。</p>\n  <p>由此，脑机接口定制平台为探索不同适应症的脑机疗法提供了灵活调整的空间，让治疗方案可以“因病而异”。“设备的外观看起来可能差不多，但放置的脑内环路靶区不一样，电极形貌也会不同；包括芯片的功能，采集和刺激的通道配置，也不一样。”李骁健说。</p>\n  <p>据了解，该植入式脑机接口系统用于严重脑损伤患者神经修复的定制款已启动IIT（研究者发起临床）研究。今年6月中旬，广东某医院完成了该款脑机接口植入体的植入手术。</p>\n  <p>李骁健介绍，受试患者一年半前脑干出血致昏迷，经抢救后意识逐渐清醒，但因脑干损伤导致“闭锁综合征”，已退化到微意识状态。闭锁综合征患者也被形容为“清醒的囚徒”，患者虽意识完全清醒，但全身瘫软，无法说话、活动，只有眼球微动。“或许只有脑机接口能帮帮他了。”</p>\n  <p>接受脑机接口植入手术后，该患者进行了约一周的艰难脑机训练，恢复到了清醒的“闭锁态”；再经过四周的植入式脑机治疗，患者的左上肢已经由完全瘫软状态提升到可完成独立抬起小臂、轻松抬腕等多个手势，并能捏住轻小物体。下一阶段，患者有望使用遥控手柄与外界进行轻度交互。</p>\n  <p>“从患者受益角度，要先把闭锁态打开个突破口，让他能够跟家属进行简单交流。先恢复一只手的活动力对患者的受益很关键，且关掉脑机系统不影响继续使用，因为手是他自己控制的。”李骁健表示。</p>\n  <p>之所以一上来就做高难度的“脑机原位功能重建”，主要考量在于：“我们有深厚的理论功底和技术支撑，先在需求最迫切、治疗条件最困难的重症病例中验证安全有效，后面做损伤程度较轻的适应症，应该更加从容了。”特别是危重症患者对新疗法的需求更为迫切，从伦理角度，也更容易获得开展临床试验的支持。</p>\n  <p>基于此，微灵现阶段仍将资源聚焦在更明确的中枢神经系统疾病和患者群体上。据了解，公司计划继续扩展临床研究试验，以进一步覆盖更广泛的脑疾病类型。</p>\n  <h2><strong>读出脑功能边界，</strong></h2>\n  <h2><strong>辅助医生精准决策</strong></h2>\n  <p>如果说，修复是神经发生损伤之后重建信号通路。有没有可能，赶在神经功能被疾病带走前，先找到它，保住它？</p>\n  <p>当前，微灵医疗另一个重要研究课题就是“如何在神经功能尚未受损前，识别并保护关键脑功能区域”。针对这一临床需求，公司推出面向脑功能保护的辅助诊断系列产品，由柔性薄膜皮层电极、高通量颅内脑电图机和智能解码软件共同构成。</p>\n  <p>其中，柔性薄膜皮层电极阵列，可贴附于患者脑皮层表面采集高通量神经电生理信号，空间分辨率达亚毫米级别，并已经过数百例临床实验验证，进入三类医疗器械注册阶段。</p>\n  <p>与之配套的高通量颅内脑电图机，专为神经外科设计，可与分析软件配合，用于辅助诊断场景。</p>\n  <p>针对癫痫、帕金森、抑郁症、意识障碍等神经功能性疾病，该系统可有效弥补 CT、核磁等传统影像学检查的局限。“影像观察的是脑部结构，脑机接口技术定位的是脑功能区。” 李骁健表示。</p>\n  <p>以癫痫为例，致痫灶的异常放电具有动态特征，传统影像往往难以完整呈现异常放电起源与信号传播路径，脑机接口技术则可以持续采集并解析不同脑区的神经电信号，为致痫灶的精准定位提供依据。</p>\n  <p>对于脑肿瘤、脑出血等器质性病变，微灵医疗的产品可协助医生区分病灶与重要脑功能区的位置关系，缓解临床上“最大化切除病灶”与“最大程度保留脑功能”之间的现实矛盾。</p>\n  <p>李骁健介绍，肿瘤侵入可能形成对原有功能区的挤占，而语言、运动等脑功能出于代偿，可能迁移至邻近区域，导致病灶与重要功能区相互交错，使得医生在切除病灶时容易误伤关键功能区，增加引发失语、瘫痪等术后功能缺损的风险。</p>\n  <p>对此，微灵的解决思路是，通过在脑皮层表面贴附柔性薄膜电极，实时采集并解码脑电信号，实现毫米级空间分辨率的脑功能区测绘，为外科手术提供功能层面的导航参考，辅助医生精准操作。</p>\n  <p>简单理解，就是直接读取患者脑内的神经活动，把功能区“画”出来。在“术中唤醒”状态下，患者按照指令完成肢体运动、语言等任务，系统实时分析并呈现功能区，辅助医生精准操作。</p>\n  <p>之所以选择将电极贴在脑皮层表面，也是为了把这张功能图尽可能“画全”。在辅助诊断场景下，首要任务是看清语言、运动等多功能区的分布范围，毫米级空间分辨率便可满足临床需求。贴附脑皮层表面的路径不仅可以减少损伤，也能实现较大面积的信号覆盖。</p>\n  <p>商业化方面，在面向脑保护的辅助诊断方向上，微灵医疗的颅内高通量脑电图机和配套的多款脑皮层薄膜电极阵列正在注册阶段，预计将在未来1-2年内陆续获批上市；在脑损伤修复和脑疾病治疗方向上，微灵医疗全植入式脑机接口系统将持续推进多中心临床试验，并启动面向广泛适应症的临床探索。</p>", "category": "tech", "published_at": "2026-08-17T00:30:00+00:00", "fetched_at": "2026-08-17T00:58:33.929007+00:00", "fingerprint": "4831809392252f5b"}, {"source": "少数派", "title": "浏览器扩展合集： 我们为你找到了这 6 款实用、 有趣的「新玩意」", "url": "https://sspai.com/post/113495", "summary": "在浏览器扩展这边，近期又有哪些好用、有趣的「新玩意」呢？<a href=\"https://sspai.com/post/113495\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-16T04:48:21+00:00", "fetched_at": "2026-08-17T00:58:32.544696+00:00", "fingerprint": "160e7a4da950c999"}, {"source": "少数派", "title": "派早报：😭（放声大哭）成为最流行 emoji", "url": "https://sspai.com/post/113524", "summary": "<p>😭（放声大哭）成为最流行 emoji</p><p>美国要求合作方在中美 AI 竞赛中「选边站」</p><p>ChatGPT 上线使用历史记录功能</p><p>美国政府敦促苹果不要购买中国内存芯片</p><p>uBlock Origin 放弃维护 Facebook 广告规则</p><p>索尼加速向娱乐业务转型</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/113524\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-16T22:54:56+00:00", "fetched_at": "2026-08-17T00:58:32.544684+00:00", "fingerprint": "62f4a4fd0a9a158b"}, {"source": "The Guardian - World", "title": "Moroccan police arrest more than 100 people as they "published_at": "2026-08-15T20:45:00+00:00", "fetched_at": "2026-08-16T01:01:03.022551+00:00", "fingerprint": "015b3666d4504b20"}, {"source": "The Verge", "title": "Matt Groening lets slip that Simpsons: Hit &#038; Run might be making a comeback", "url": "https://www.theverge.com/entertainment/980720/matt-groening-simpsons-hit-run-d23", "summary": "At D23, when asked about the potential for a sequel to the cult classic The Simpsons: Hit &#38; Run game, Matt Groening replied, \"I think the original game is coming back in some form,\" before current showrunner Matt Selman added, \"or not.\" The tone in both of their voices and the body language suggests that [&#8230;]", "category": "tech", "published_at": "2026-08-15T21:56:13+00:00", "fetched_at": "2026-08-16T01:01:03.022541+00:00", "fingerprint": "9d66eb2ab3eb9634"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨追觅首台手机售价超20万，带创始人俞浩签名；韩国宣布2030年实现登月；胖东来计划招聘20名刑期5年以上刑满释放人员", "url": "https://36kr.com/p/3940086573759874?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>微信朋友圈未来不会推出二次编辑功能</li>\n   <li>遭“薅羊毛式”黑灰产诈骗，东方甄选回应</li>\n   <li>宜家拟处置上海宝山商场物业</li>\n   <li>阿里超15亿美金向中信资本出售灵犀互娱</li>\n   <li>英伟达宣布CPO交换机全面量产</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>追觅首台手机售价超20万：24K足金镶宝石，带俞浩签名</strong></p>\n  <p>8月13日，追觅手机负责人在朋友圈透露，公司已正式交付001号AURORA手机。据其透露，三万美金（约合人民币20.23万元）交易款项已全部到账，其中首付款1万美金，尾款21184美金。其称，这是 “中国智能手机历史上迄今为止卖出去单台售价最高的旗舰智能手机”。从曝光图片来看，手机不仅背面带有追觅创始人俞浩签名，而且还附带专属编码的典藏证书。证书信息显示，甄选24K足金材质，并镶嵌珍稀宝石。（钱江晚报）</p>\n  <p><strong>韩国宣布2030年实现登月</strong></p>\n  <p>8月12日，韩国总统李在明在青瓦台举行“未来增长动力七大尖端技术发布会”，并公布“七大尖端项目”战略：分别是2029年研制国产100量子比特计算机，2030年实现登月，2035年推动国产小型模块化反应堆（SMR）商业部署，并实现脑机接口产品商业化。七大方向还包括核聚变、下一代可再生能源、先进生物技术，以及关键矿产和材料供应链。李在明表示，韩国必须把握当前半导体产业带来的机遇，为后AI时代做好准备。（上游新闻）</p>\n  <p><strong>胖东来：计划招聘20名刑期5年以上刑满释放人员</strong></p>\n  <p>8月14日，胖东来发布郑州店招聘退伍边防军人及刑释人员提前公告。公告称，在本次招聘中，胖东来计划招聘100名为祖国边疆做出巨大贡献的退伍边防军人，20名刑期5年以上的刑满释放人员，并为其设立专属报名投递通道。胖东来表示，这也是基于人性的善良和美好，希望各个群体的人们都能够得到社会的尊重和关爱，能够让每个人有尊严地生活，成为文明先进生活理念的践行者和传播者，活得像光一样，照亮更多人的生命，造福国家和社会。据介绍，以上招聘人员的报名及面试流程与其他应聘者一致，具体招聘时间、岗位、人数、要求、报名方式等信息，后期将通过胖东来官方渠道正式发布。（鞭牛士）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic：Q2营收同比暴涨14倍</strong></p>\n  <p>据业内人士看到的文件显示，Anthropic PBC在向潜在投资者推介时透露，公司第二季度的营业收入较去年同期实现了约14倍的巨幅增长。文件显示，这家Claude聊天机器人开发商在最新结束的季度中报告的初步营收超过115亿美元。作为对比，其在2025年同期的营收仅为7.87亿美元，而今年第一季度则为47.3 亿美元。此外，文件还显示，Anthropic在2026年第二季度的调整后营业利润为正。据悉，目前相关数据仍处于内部复核阶段，最终结果可能会有所调整。（财联社）</p>\n  <p><strong>智谱正式发布GLM-5.3</strong></p>\n  <p>36氪获悉，智谱正式发布GLM-5.3。据介绍，与GLM-5.2相比，GLM-5.3的基座模型没变，但通过极致的后训练Scaling大大提高了模型的智能上界。GLM-5.3是编程能力最强的开源模型，在内部自建体感评测中较GLM-5.2提升50%，在包括Terminal Bench 3.0、Agents' Last Exam （CLI）在内的公开基准测试中取得开源第一。</p>\n  <p><strong>消息称苹果针对中国市场训练了一款AI模型</strong></p>\n  <p>消息人士称，苹果专门针对中国市场训练了一款AI模型，该AI模型的训练据悉得到阿里巴巴的支持。（财联社）</p>\n  <p><strong>OpenAI任命Dali Rajic为首席营收官</strong></p>\n  <p>8月13日，OpenAI宣布，Dali Rajic将加入OpenAI担任首席营收官，领导OpenAI的全球营收团队。现任首席营收官Denise Dresser将在过渡期结束后离开OpenAI，寻求其他发展机会。OpenAI称，公司产品目前每周活跃用户超过10亿，服务企业超过200万家，是去年同期的两倍，而Denise为这一切的实现做出了巨大贡献。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>旺旺董事长发内部信：公司面临重大经营危机，没有贡献的人就要被淘汰</strong></p>\n  <p>2026年8月初，旺旺集团董事长蔡衍明发布致全体旺旺人的公开信，将2026财年第一季度（4月至6月）业绩未达预期定性为“重大经营危机”，要求内部反思产品创新不足、渠道老化等问题，并推动改革。蔡衍明表示，“对公司有感情的旺旺人要痛定思痛，不合理、无效的费用就不应该花，该节省的费用一定要当作自己家的钱来节省；新的业务做法一定要勇敢、积极尝试。集团现在要的是能有贡献、有功劳的旺旺人！没有产出、没有功劳的，都会需要被淘汰！”（蓝鲸新闻）</p>\n  <p><strong>1700余件“心机商标”被宣告无效</strong></p>\n  <p>近日，国家知识产权局商标局网站公布了一批“依职权宣告无效的带有欺骗性的商标”。在公布的名单中，一些看似普通的词语成为部分企业营销宣传的工具。比如“土猪”“土鸡”“手擀”“手打”等，容易让消费者联想到散养、手工制作、品质更高等特质，属于从品质工艺进行误导；而含有“零卡”“零糖”“零添加”“劲白”等词语的商标，容易让消费者从特定成分或功效进行联想；“香港大药房”“树上熟”等名称，则是在商品的产地、来源等方面进行误导。目前，已有1782件相关商标被宣告无效。专家表示，这些商家注册商标的目的不单纯是为了起一个名称，而是把一些表达商品质量、数量、产地来源甚至功效成分的名称注册成商标，给消费者带来误导。（央视新闻）</p>\n  <p><strong>沃尔玛入华三十年，持续加大在华投资</strong></p>\n  <p>8月12日，沃尔玛中国在深圳举行三十周年活动。活动现场，沃尔玛中国围绕五座重要城市合作举行集中签约仪式。此次签约覆盖山东烟台沃尔玛及山姆业态合作意向书，北京昌平、辽宁沈阳的沃尔玛门店合作协议，以及湖北武汉、江苏南通的山姆会员商店合作协议，聚焦不同区域需求，持续拓展沃尔玛中国双业态服务网络。此外，沃尔玛中国正式揭晓全新雇主品牌“精彩由沃开始”，以行动诠释面向未来的发展战略。（品牌专题）</p>\n  <p><strong>杨子家族旗下公司上半年净利骤降近六成</strong></p>\n  <p>8月13日晚间，巨力索具（002342.SZ）披露2026年半年报，报告期公司实现营业收入13.09亿元，同比增长14.79%；归属于上市公司股东的净利润380.01万元，较上年同期935.08 万元同比下降59.36%；扣除非经常性损益后的归母净利润1099.98万元，同比增长96.48%。公司综合毛利为18.84%，同比提升0.84个百分点。营收规模实现两位数增长，但归母净利润大幅回落，扣非与归母净利润出现明显背离。（界面新闻）</p>\n  <p><strong>微信官方：朋友圈未来不会推出二次编辑功能</strong></p>\n  <p>8月14日，微信官方账号“微信派”发布《为什么朋友圈没有编辑功能？》一文。其中提到，“朋友圈现在、过去、未来都不会有二次编辑功能”。微信表示，朋友圈的英文是“Moments”，当下那一瞬间。正是因为“不可更改”，这种记录才具备绝对真实性。与其让所有人都活在“什么都可能被改过”的朋友圈里，不如让手误那几秒自己消化掉。（第一财经）</p>\n  <p><strong>腾讯混元资深研究员徐灿转岗微信WeLM</strong></p>\n  <p>36氪从相关人士处获悉，混元资深研究员徐灿在近期加入腾讯WeLM团队，从事大模型研发相关工作。多名知情人士透露，在姚顺雨接手腾讯大语言模型研发前，徐灿在混元LLM体系中担任后训练一个方向上的负责人。值得一提的是，这次转岗发生在微信持续强化自研大模型和Agent能力的阶段。6月，微信原生AI助手“小微”已进入小范围灰度测试，可通过文字或语音操作微信原生功能，并调用小程序完成服务任务。</p>\n  <p><strong>遭“薅羊毛式”黑灰产诈骗，东方甄选回应</strong></p>\n  <p>8月13日晚，东方甄选发文称，涉嫌恶意骗取东方甄选订单退款，相关犯罪嫌疑人已被警方采取强制措施。全文如下：“近日，东方甄选在订单数据日常监测中发现大量异常仅退款订单，涉及金额较大，存在'薅羊毛式'黑灰产诈骗嫌疑。公司立即固定证据并向公安机关报案，全程配合调查取证。经警方缜密工作，目前，某张姓犯罪嫌疑人因涉嫌诈骗罪，已被警方依法采取刑事强制措施，案件正在进一步办理中。东方甄选始终坚持以客户为中心，持续提升客户服务质量，注重客户体验。同时，我们对于任何触碰法律底线、违背诚信原则的行为，坚决依法维权，绝不姑息。未来，东方甄选将持续完善风控体系，加大对恶意退赔、职业索赔等行为的排查与打击力度。感谢广大客户的关心与支持！”（第一财经）</p>\n  <p><strong>SK海力士：明年将迎最严重“存储荒”</strong></p>\n  <p>8月13日，SK海力士董事长崔泰源在公司韩国总部接受了媒体专访。他在采访中再次强调了存储需求的爆发式增长，并表示明年将出现最严重的“存储荒”。他还肯定了其合作伙伴英伟达在AI基建浪潮中的重要性，并反驳了外界对SK海力士过度依赖英伟达的担忧。（财联社）</p>\n  <p><strong>宜家拟处置上海宝山商场物业</strong></p>\n  <p>界面新闻获悉，宜家中国近日就上海宝山商场物业后续安排发布说明。英格卡集团(Ingka Group)已正式委托仲量联行，代理旗下中国市场部分已停运商场自持物业的处置工作，上海宝山商场物业在列。宜家上海宝山商场2013年开业，2026年停运，接待访客近3000万人次。宜家中国表示，该自持物业位于上海市宝山区，总建筑面积约10.5万平方米，目前资产已全面清空、产权清晰，可按现状即时交付。项目未来可探索改造为社区商业综合体、融合文旅元素的体验式消费空间或其他创新业态。（界面新闻）</p>\n  <p><strong>上市公司频现1元甩卖子公司股权</strong></p>\n  <p>据记者不完全统计，2026年以来，已有十余家上市公司先后发布公告，以1元的名义对价挂牌出售旗下子公司的股权。被低价甩卖的子公司股权的标的多数业绩连续亏损，不少甚至处于资不抵债的状态。在业内人士看来，这类“白菜价”转让的表层逻辑，主要是上市公司急于将亏损资产从合并报表中剥离，优化当期的财务报表，从而保住上市资格，维持自身在资本市场的正常融资能力，但交易边界模糊，低价转让不良资产背后潜藏着更大的风险。（界面新闻）</p>\n  <p><strong>英伟达宣布CPO交换机全面量产</strong></p>\n  <p>8月14日，英伟达宣布Spectrum-X Ethernet Photonics已进入全面量产阶段，为面向AI工厂的下一代大规模扩展网络基础设施提供支持。英伟达表示，Spectrum-X Ethernet Photonics专为吉瓦级AI工厂网络需求设计，实现激光器数量减少4倍、功耗降低5倍、平均故障间隔时间（MTBI）提升10倍。该产品由台积电、矽品、Lumentum、天孚通信、鸿海等供应链伙伴参与制造、封装及组装。（界面新闻）</p>\n  <p><strong>阿里超15亿美金向中信资本出售灵犀互娱</strong></p>\n  <p>据报道，阿里旗下灵犀互娱的买方已经确定，为中信资本旗下的信宸资本（Trustar Capital），出售价格预计超过15亿（约合101亿元人民币）。（21财经）</p>\n  <p><strong>广东省首个词元经济专项金融产品“Token贷”在广州海珠发布</strong></p>\n  <p>广东省首个词元经济专项金融产品“Token贷”在广州海珠区发布。以中国银行广州分行为例，针对海珠算力中小微企业针对性研发专属融资产品——算力Token贷，按合同/Token消耗额度核定额度，可提供信用、应收账款质押、订单融资为主的担保方式，亦可组合保证、抵押等组合担保，进一步扩大额度。新公司亦可在原经营企业提供连续经营佐证材料、或提供担保的情况下按订单申请融资。据悉，中国银行前期试单授信资金已达2800万元。（界面新闻）</p>\n  <p><strong>中央汇金、证金公司退出贵州茅台前十股东</strong></p>\n  <p>8月14日晚间，贵州茅台(600519.SH)发布2026年半年度报告。报告显示，中央汇金资产管理有限责任公司、中国证券金融股份有限公司退出前十大股东。此前贵州茅台一季报显示，汇金公司持有1039.71万股，占总股本的0.83%。证金公司持有403.75万股，占总股本的0.32%。此外，华夏上证50、华泰柏瑞沪深300ETF均退出十大股东之列。报告显示，2026年上半年，贵州茅台营收907.03亿元，同比增长1.47%；利润总额614.38亿元，同比下降2.13%；净利润445.17亿元，同比下降1.95%。经营活动产生的现金流量净额706.91亿元，同比增长438.84%。（21实际经济报道）</p>\n  <p><strong>特斯拉SpaceX合并传闻再起，马斯克薪酬激励或高达8240亿美元</strong></p>\n  <p>一档播客节目指出，如果马斯克促成特斯拉和SpaceX合并，他可能获得最高8240亿美元的财富。按特斯拉去年批准的薪酬方案，马斯克在达成运营目标和市值目标后，最多可获4.23亿股特斯拉股票。华尔街认为，若特斯拉发生控制权变更，则运营目标视为达成，且市值目标也更容易达成。（财联社）</p>\n  <p><strong>德国汽车行业就业人数降至21年来最低</strong></p>\n  <p>德国联邦统计局14日发布的数据显示，德国汽车行业就业人数持续减少，今年已降至2005年以来最低水平。截至今年活跃，德国汽车行业就业人员共有约69.15人，比一年前减少4.23人，降幅为5.8%。据德新社报道，各汽车行业就业部门是德国工业部门中的人员减少最快的部门。德国汽车行业中，汽车零部件及配件供应商评判最多，就业人数同比减少7.6%；汽车制造商就业人数减少6.1%。德国其他工业部门就业人数也有所减少，但降幅相对较小。同时期，德国制造业就业人数同比减少2.7%，至529人。（研究院）</p>\n  <p><strong>美股大型科技股盘前普涨，闪迪涨超6%</strong></p>\n  <p>36氪获悉，美股大型科技股盘前普涨，截至发稿，闪迪涨超6%，英特尔涨超1%，特斯拉涨0.42%，英伟达涨0.31%，Meta涨0.26%，微软涨0.23%，亚马逊涨0.18%，谷歌涨0.07%，苹果涨0.05%。</p>\n  <h2>投融资</h2>\n  <p><strong>“亮源新创”完成数亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，近日，“亮源新创”宣布完成数亿元Pre-A轮融资。本轮融资由国科投资领投，招商局创投、襄禾资本等机构参与投资，资金将主要用于超大规模具身智能模型训练、多模态数据基础设施建设、软硬件全栈平台研发以及高人才密度的团队扩张。</p>\n  <p><strong>“什方科技”连续完成两轮融资</strong></p>\n  <p>36氪获悉，专注工业场景功能性涂层数字喷印技术的企业“什方科技”连续完成两轮融资。自B轮起至本次B+轮收官，融资总额近3亿元。由五源资本、创世伙伴创投、同创伟业及产业战略投资机构恒旭资本、小米集团、蔚来资本联合入局，多家老股东同步追加投资。</p>\n  <h2>大公司财报</h2>\n  <p><strong>Coach母公司Tapestry 2026财年营收80亿美元，同比增长14%</strong></p>\n  <p>当地时间8月13日，Coach母公司Tapestry公布2026财年第四季度及全年业绩。第四季度营收18.77亿美元，同比增长9%；营业利润4.42亿美元，上年同期营业亏损5.84亿美元。全年营收80.04亿美元，同比增长14%；营业利润19.14亿美元，上年同期为4.15亿美元；稀释后每股收益7.27美元，上年同期为0.82美元。（界面新闻）</p>\n  <p><strong>小菜园：上半年收入29.03亿元，同比增长7.0%</strong></p>\n  <p>36氪获悉，小菜园发布2026年中期业绩。报告期内，公司实现收入29.03亿元，同比增长7.0%，营收规模再创新高；净利润2.89亿元，同比下降24.3%。</p>\n  <p><strong>平安银行：上半年净利润256.96亿元，同比增3.3%</strong></p>\n  <p>36氪获悉，平安银行公告，2026年上半年营业收入706.17亿元，同比增长1.8%。归属于本行股东的净利润256.96亿元，同比增长3.3%，上年同期净利润248.7亿元。中期利润分配方案为每10股派发现金股利2.49元（含税）。</p>\n  <p><strong>贵州茅台：上半年营业收入907.03亿元，同比增长1.47%</strong></p>\n  <p>36氪获悉，贵州茅台公告，2026年上半年实现营业收入907.03亿元，同比增长1.47%；净利润445.17亿元，同比下降1.95%。</p>\n  <p><strong>生益科技：上半年净利润同比增长130.42%</strong></p>\n  <p>36氪获悉，生益科技公告，2026年上半年实现营业收入190.26亿元，同比增长50.05%；归属于上市公司股东的净利润32.87亿元，同比增长130.42%。</p>\n  <p><strong>泰佩思琦：第四季度销售额19亿美元，同比增长9%</strong></p>\n  <p>36氪获悉，泰佩思琦集团公布截至2026年6月27日的2026财年第四季度及全年业绩。第四季度销售额19亿美元，同比增长9%，按备考恒定汇率计算增长11%，主要由COACH品牌15%（按固定汇率计算为14%）的业绩增长带动。2026财年全年销售额80亿美元，同比增长14%，按备考恒定汇率计算增长17%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>传音港股上市获证监会备案</strong></p>\n  <p>8月14日，中国证监会国际合作司发布关于深圳传音控股股份有限公司境外发行上市备案通知书，公司拟发行不超过132,386,200股境外上市普通股并在香港联合交易所上市。（界面新闻）</p>\n  <p><strong>优邦科技创业板IPO定于8月21日上会</strong></p>\n  <p>36氪获悉，深圳证券交易所上市审核委员会定于2026年8月21日召开2026年第53次上市审核委员会审议会议，审议东莞优邦材料科技股份有限公司。</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-08-15T01:06:47+00:00", "fetched_at": "2026-08-16T01:01:02.904026+00:00", "fingerprint": "4cae2c9c85664c91"}, {"source": "36氪 - 最新文章", "title": "中科大孵化，国内唯一通用光量子计算整机企业完成超亿融资丨36氪首发", "url": "https://36kr.com/p/3940103536491910?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_ee2f8844c28f4632a64237e645a545ed@6221844_oswg638507oswg3264oswg1301_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2200</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，合肥硅臻芯片技术有限公司（以下简称“硅臻芯片”）近日完成超亿元融资。本轮融资由韦豪创芯、共达电声（002655）联合领投，华策影视（300133）、苏创投、苏金控、创领资本、后浪资本等机构跟投。融资资金将主要用于万比特专用光计算集群与通用量子计算芯片组的研发。</p>\n  <p>硅臻芯片2020年成立于合肥，核心技术源自中国科学技术大学郭光灿院士领衔的中国科学院量子信息重点实验室。公司由教育部长江学者、中国科学技术大学光学与光学工程系执行系主任陈巍，国家杰青、中国科学院量子信息重点实验室副主任任希锋，以及中科大博士、博士期间即从事光量子芯片研发的丁禹阳三位联合创始人共同创立，核心团队在集成光量子领域拥有超过20年技术积累，全部来自中科大郭光灿院士团队。</p>\n  <p>目前，硅臻芯片已构建从核心光量子器件到整机系统的完整技术布局。硅臻芯片总经理丁禹阳表示，公司成立的初衷是“基于光量子芯片技术，让量子密码、量子测量、量子计算三项技术落地到实用化”。</p>\n  <p>在具体产品落地上，硅臻走出了两条清晰的商业化路径。</p>\n  <p>量子计算方向，2025年11月，硅臻在量子科技产业大会上发布了基于硅光集成芯片的通用可编程量子计算机，可通过云平台访问接入。该整机是国内唯一可运行通用量子算法的光量子计算整机。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_e53b83bb4f4f43f29ea366f88138d60e@6221844_oswg185651oswg559oswg647_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">基于硅光集成芯片的通用可编程量子计算机（图源/企业）</p>\n  <p>此外，公司在专用光计算领域已完成5000比特级设备内部验证，基于芯片集成方案相比于同类光纤方案具有成本和性能上的绝对优势。丁禹阳透露，该产品预计在今年年底推出上市。</p>\n  <p>值得关注的是，硅臻近期在通用光量子计算领域取得关键突破。公司联合中科大量子信息重点实验室，首次在片上成功实现4光子16量子比特GHZ态、单光子4量子比特簇态的稳定生成，是目前在光量子芯片上演示的最大规模纠缠态。团队还在该平台上演示了Grover搜索算法，平均识别概率达98.7%。</p>\n  <p>量子安全方向，硅臻自主研发的QRNG-10量子随机数发生器芯片，是国内首款毫米级QRNG芯片，基于量子放大自发辐射原理，也是目前国内最先通过国家密码管理局商用密码检测中心测评的QRNG芯片。</p>\n  <p>据丁禹阳透露，该芯片已签订单约20万片，累计出货量在量子科技相关单品中位居前列。在客户拓展上，芯片已集成至SIM卡中，产品还适配于国家电网电表加密芯片及家庭摄像头等智能终端。丁禹阳预计，随着抗量子密码相关国家标准的出台，QRNG芯片年出货量可达百万片级别。</p>\n  <p>在商业化节奏上，硅臻有明确的短中长期策略：短期靠QRNG芯片造血，已验证商业模式并实现持续复购；中期靠万比特专用光计算设备贡献营收；长期则瞄准百万比特通用光量子计算机，是国内唯一直接对标PsiQuantum和Xanadu的量子计算企业。</p>\n  <p><strong>以下是硬氪与硅臻芯片总经理丁禹阳的访谈（经编辑）：</strong></p>\n  <p><strong>硬氪：市场普遍关注量子比特数量，保真度这个指标常常被忽略。硅臻怎么看这两者的关系？</strong></p>\n  <p><strong>丁禹阳：</strong>比特的数量肯定是追求的，但保真度同样关键。保真度可以理解为量子比特的质量——如果单比特保真度是99.9%，就相当于有0.1%的错误率。10个比特放在一起，正确率就是(1-0.1%)的10次方。比特数越多，保真度带来的影响越是指数级放大。</p>\n  <p>所以我们的逻辑是：比特数目和质量要同步推进，两者缺一不可。增加比特数是所有量子计算赛道的最终目标，但保真度决定了这些比特是否真正可用。</p>\n  <p><strong>硬氪：光量子计算和其他技术路线比，核心优势到底在哪？</strong></p>\n  <p><strong>丁禹阳：</strong>主要有两点。第一，我们团队本身就是做光量子出身的，有超过20年的积累。第二，光量子计算是明确能解释清楚“怎么从4个比特变到百万比特级别”的路线。</p>\n  <p>其他路线单台设备做到一定比特数后物理尺寸可能就到头了。而只有光量子可以在常温下直接通过光纤传输。其他路线最终都要转成光来传，绕不开我们的技术。</p>\n  <p><strong>硬氪：从产业视角看，硅臻走到百万比特还需要解决什么？</strong></p>\n  <p><strong>丁禹阳：</strong>这不是科研问题，是工程问题。我们是一家芯片设计公司，需要找到能在损耗、工艺上满足光量子芯片需求的晶圆厂深度合作，共同开发定制工艺。这需要大量的工程迭代，跟工厂磨工艺、调参数、反复验证。这也是为什么本轮融资要把产业资本引进来，光有技术不够，得有制造端的深度协同才能把百万比特这件事真正落地。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>韦豪创芯陆正杨：</strong>本次投资硅臻，立足于光量子计算赛道长远的商业化潜力。企业深耕硅光量子路线，设备支持常温常压工作，能够兼容成熟CMOS硅光产线，对比超导、离子阱方案拥有可观的量产成本优势，产业化前景优越。公司核心团队源自中科大量子信息实验室，兼具顶尖科研积淀和芯片落地经验，属于国内稀缺、可实现通用光量子计算机全链路自主研发的企业，构筑起深厚的技术壁垒。硅臻现已问世国内首台搭载硅光集成芯片的4比特通用可编程光量子计算机，同步布局KLM、MBQC主流技术架构，攻克高维光子编码、公里级分布式量子互联等核心技术，先发优势扎实，具备较高成长确定性。</p>\n  <p><strong>创领资本王帅：</strong>量子科技作为未来产业的领头羊，是我们认为今后至少5-10年里最值得关注的赛道，当下投资量子科技就相当于5年前投资人工智能和算力产业。硅臻芯片是创领资本系统性梳理和接触量子产业相关标的后，认为最具代表性的光量子标的，也是当前最值得关注的高性价比标的。尤其是，近期硅臻芯片在MBQC技术上的进展，标志着硅臻芯片成为国内首家实现片上构建规模化图态的光量子计算企业，让百万量子比特光量子计算机的研发落地具备现实可行性，也标志着硅臻芯片在未来有望跻身世界级光量子企业的行列。</p>", "category": "tech", "published_at": "2026-08-15T01:20:56+00:00", "fetched_at": "2026-08-16T01:01:02.904017+00:00", "fingerprint": "12da04a2e3dbf1cd"}, {"source": "36氪 - 最新文章", "title": "从众筹到问鼎欧美，VITURE与XR行业的五年", "url": "https://36kr.com/p/3940540064562563?f=rss", "summary": "<p>大家都说，XR眼镜是一个奇怪的品类。</p>\n  <p>参数每年都在刷新，销量每年都在增长，但二手平台上，“只用过两次”“戴了半小时头晕”“吃灰半年出了”的转卖帖，好像慢慢变得比任何一个消费电子品类都密集。</p>\n  <p>行业常常将品类留不住用户、留不住用户的时间，归咎于技术还不够成熟。</p>\n  <p>VITURE创始人姜公略给出的是另一个关于“过去五年”的解释。</p>\n  <p>“2022年之前的眼镜，本质上都是投屏器，相当于一台外接显示器。但用户期待的、我们在做的，是一台电脑，一个能计算、能交互、有内容的all-in-one终端设备。”</p>\n  <p>“清晰”和“清晰又聪明”的巨大区别，指向了行业的核心矛盾。投屏器只能从技术上让用户的眼前再多出现一块大屏，但XR眼镜这个品类，如果只能回答用户一个问题，这个问题应该是：我今天为什么要多戴一副眼镜。</p>\n  <p>用了五年时间来回答这个问题的VITURE，2021年，创业开始，还是一家只有10个人的公司，在Kickstarter上打破了Oculus保持多年的众筹纪录。五年后，它成为了欧美出货量第一的XR眼镜品牌。</p>\n  <p>五年多后的8月6日，品牌成立的五周年当天，<strong>VITURE全球同步发布了Pro 2</strong>。</p>\n  <p>上市一周后，第一批用户也给出了真实体验反馈：<strong>开售一周，VITURE Pro 2斩获京东XR眼镜当周单品SKU第一，海外也成为多个亚马逊站点的Best Seller。本周，三大权威科技媒体Gizmodo，Tom's Guide及PCMag，也几乎同时给出了一致的“同价位最棒的XR眼镜体验”评价。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_2ba825a399b04a83b6e1a97bbfa1e007@5510391_oswg472995oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>新一代产品给市场带来了三个关键词：63克，1999元，可近视调节。没有更fancy的叙事，这家公司仍然在从“老问题”切入新问题，关心用户戴不戴得住、买不买得起。</p>\n  <p>这两个支点，究竟怎么才能撑起XR的真需求？</p>\n  <h2><strong>1999元的“空盒子”</strong></h2>\n  <p>在与36氪的对谈中，姜公略说，他最近养成了一个新习惯：拿起装Pro 2的眼镜盒，总觉得里面是空的，必须要打开确认一眼，才相信眼镜真的放在了里面。</p>\n  <p>一个已经做了超过五年XR眼镜的产品专家，这次终于把自己也“骗过去”了。</p>\n  <p>63克比上一代VITURE Pro轻了20%，镜框最厚处都不到18毫米，宣称是目前全行业最薄。</p>\n  <p>架构是全新的，光机做了轻量化设计，框体和镜腿用上了航空级金属和塑料材质。姜公略说，如果去掉近视调节，重量可以压到60克以下，但他们毫不犹豫地保留了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_e09602d6e5224f78a295c27043fd9bd1@5510391_oswg601595oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>取舍背后被重视的另一个数字是，中国有6亿近视人口。<strong>Pro 2支持双眼独立0到500度屈光调节，</strong>转动拨盘就能对焦，不用另配近视插片。对国内用户来说，近视调节绝对是XR眼镜的入场券，跨不过这道门槛，产品参数和场景再好也和中国市场没关系。</p>\n  <p>重量降下来以后，新的利基市场也开始水到渠成。</p>\n  <p>目前，XR眼镜行业男性用户占了八成以上，其中一个关键原因是产品太重，女性戴起来觉得压鼻子。Pro 2的前期体验里，不少女性用户都在反馈同一句话：“这是第一款我能戴的眼镜。”</p>\n  <p>XR产品适配的人群正在肉眼可见地变宽。姜公略预期，女性用户里观影人群的比例会明显高于游戏玩家，好的观影体验也会让用户自发地花更多时间在XR眼镜上进行内容消费与交互。</p>\n  <p>再看价格，<strong>1999元是VITURE第一次把旗舰级体验压进千元价位，</strong>也是同价格档位的产品里唯一用了索尼Micro-OLED屏的，完全没有妥协。索尼屏在色彩还原度、亮度和寿命上有口皆碑，行业默认是高端线的配置，得益于VITURE每年翻倍式的高曲线增长所带来的供应链议价能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_f3c4d905e480434db0bcf7dc372059bb@5510391_oswg862554oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>其他性能方面，Pro 2能达到1600尼特峰值亮度，目前是行业巅峰亮度，大白天靠窗也能看清，UltraClarity 3.0全彩超锐利把清晰度推到了新高度。以往，XR眼镜基本都可以做到中心清晰，但边缘则会稍有模糊。但这次Pro 2把字幕和暗部细节都处理得干净利落，视线从中心移到边缘时画面不会抖动或拉伸。此外，Pro 2拥有SGS A+低视觉疲劳认证，用户连续佩戴3小时不会出现明显的疲劳，被誉为一副真的可以“戴的久”眼镜。</p>\n  <p>这看似是几个简单的关键数字，但如果你过去几年买过任何一副XR眼镜，你会知道它们在实际体验中有多重要。</p>\n  <p>类比苹果的产品线定位，姜公略给Pro 2找的参照物是MacBook Air。</p>\n  <p>几代之前，MacBook Air的定位是拓展人群的入门款，配置和性能不如老款MacBook Pro，但今天的Air已经比两三年前的Pro强得多。VITURE Pro 2的逻辑一模一样：在价格和轻量化上更亲民，但在硬件上绝不廉价，把强大的性能和无感的体验，同时塞进了一副架在脸上的设备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_971ceebc92e64cd387b3fa00e6323ddd@5510391_oswg693012oswg1080oswg510_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>“一个东西可能很贵，但只要它给用户创造的价值更多，那就是好的；如果能用更低的价格买到，价值感的增益就会更大。”姜公略说，这就是MacBook Air和本次的新品VITURE Pro 2共同分有的产品哲学。</p>\n  <p>这可能也是科技圈很多人私下称“VITURE是最具苹果感的XR公司“的原因。</p>\n  <p>上市一周后，用户的早期反馈也很真实地反映了这一点。VITURE Pro 2在小红书上被提到最多的三个词，是轻薄、清晰、近视友好。</p>\n  <p>有用户描述它“和普通太阳镜差不多重，长时间佩戴鼻梁和耳朵没什么压迫感，躺床上看剧很舒服”；还有近视用户把它称为“懒人福音”，因为转动拨盘就能对焦，省去了另配镜片的麻烦。</p>\n  <p>地铁、高铁、酒店床头，成为了“百寸巨幕”出现频率最高的几个场景。</p>\n  <p>当然，用户也会提到他们期待下一代产品能达到的体验，在XR这个还处于行业早期的品类，用户愿意分享它、夸奖它，甚至提出自己的“Wish list”期待清单，往往才是一个新品类开始被认真对待、一个电子设备被当成了日常需求的标志。</p>\n  <h2><strong>VITURE五年，三次“反直觉”</strong></h2>\n  <p>姜公略毕业于哈佛，曾经在Google硅谷总部参与过Google Glass和Material Design。他后来复盘，Google Glass的先锋性毋庸置疑，但项目的问题在于技术形态先有了，再去找使用场景。用户的第一反应永远是同一句话：我不需要它。</p>\n  <p>在这个行业里，先有鸡还是先有蛋的问题，可能并不是一个纠缠不清的因果螺旋。</p>\n  <p>2021年，姜公略和原Google Glass团队成员在北京和旧金山创立了VITURE。公司的第一条产品信条听起来就像在给自己拆台：打造XR眼镜的第一性原理，是承认用户“并没有多戴一副眼镜的需求”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_825ec0dd4af841a78ee190b4c63074c3@5510391_oswg768816oswg1080oswg721_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>那么，既然用户没有天然的理由选择你，你就必须找出那个让他们无法拒绝的场景。</p>\n  <p>也就是从学会了自我证伪的第一天开始，VITURE选择了一条与行业主流相反的路。五年的时间，当初在第一性原理指引之下做出的选择，也在三个关键时刻逼出了三次可能不会被理解的决策。</p>\n  <p>“也许并不划算，但必须坦诚。”回溯过往的时候，姜公略直言。</p>\n  <p>第一次，他们决定的事情是：做一台“电脑”，不做投屏器。</p>\n  <p>2022年4月，VITURE在Kickstarter上线了第一款产品VITURE One。因为当时公司只有10个人，几乎没有营销预算，所以也没有拍一个专业的功能演示视频，而是拍了一部电影小短片：三个宿舍学生，一个人背着电视，另外两个人戴着眼镜出去旅行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_50807d9e902d48adab60e50a39a1c66b@5510391_oswg1137607oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从头到尾只讲了一件事：旅行的路上怎么打游戏。</p>\n  <p>这条视频被不少海外用户评为Kickstarter史上最棒的众筹视频之一，因为它没有拼命解释这副眼镜能做什么，它选择直接推给你一个能立刻代入的画面。结果是众筹拿下了超过300万美元的成绩单，打破Oculus保持多年的XR眼镜品类纪录。</p>\n  <p>但对于一个新生事物来说，比用户好奇心砸出来的现金更重要的是产品形态。</p>\n  <p>VITURE One推向市场的其实并不是一副眼镜，是三件套：眼镜、颈环、魔宝坞。</p>\n  <p>这家公司自研的颈环是第一个把计算单元和眼镜结合在一起的设备，内置了YouTube、Netflix，还能远程串流PS和Xbox；魔宝坞专为Switch而生，让VITURE成为了第一个支持Switch双人同屏游戏的XR品牌；电致变色技术也是从VITURE One开始进入这个行业的。</p>\n  <p>“第一个做创新的公司永远是最难的。”姜公略告诉36氪，可以说，今天行业里常见的颈环、外置计算单元、全设备适配，全都始于那场众筹。</p>\n  <p>站在今天回看，今天的节点，在刚出发时就已经埋下了答案。</p>\n  <p><strong>第二次“拒绝”共识，是选择了先打欧美，再回中国。</strong></p>\n  <p>大多数国产硬件品牌的习惯是先在国内打磨产品，再带着成熟的经验和模板出海，VITURE则是一家”生而全球化”的公司：成立第一天，就在硅谷和北京设了双总部，市场动作的第一站直接登陆Kickstarter，直面对消费电子新品类容忍度最高、价格敏感度相对较低的第一批欧美用户。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_9e6e3a6d1b0242669acc29ecc506002b@5510391_oswg797884oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这个选择后来被证明是相当明智的，不但帮助VITURE避开了中国市场昂贵的教育成本，直接带着一个被市场验证过的产品参与“百镜大战”，早期也成功地以众筹的方式拿到了更有想象力的资金、市场曝光度、品牌粘性，再去找供应链做创新、谈价格、滚雪球，先发优势越来越明显。</p>\n  <p>但与此同时，它也留下了一个误读：进入中国太晚，国内不少人把VITURE当成了后来者。</p>\n  <p>实际上，2022年4月，VITURE的三款产品就已经相当完整。彼时，大语言模型尚未在普通人的工作生活中平地惊雷，而现在市面上90%的智能眼镜，技术逻辑与场景概念也都还不知从何谈起。</p>\n  <p>那一年的年底，VITURE One拿下了《时代》周刊年度最佳发明奖项，是该年唯一上榜的AR/VR消费级产品。</p>\n  <p>接下来的几年，VITURE Pro长期位列多个国家亚马逊智能眼镜的畅销榜。2024年11月，它成为第一个进驻Best Buy的XR品牌，在全美200家门店销售，再铺到澳大利亚的JB Hi-Fi、欧洲Media Markt、英国Selfridges百货，席卷了全球接近500家线下超市货架。</p>\n  <p>IDC数据显示，2024年Q4 VITURE在美国AR市场份额超过50%，2026年Q1成为欧美出货量第一的XR品牌。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_085ea4cbb6dc4bec868ea2d33a90fef5@5510391_oswg103373oswg1080oswg850_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>荣归中国市场这个“故里”，却是2024年才开始的。</p>\n  <p>但中国市场与全球市场之间并没有不可逾越的壁垒，欧美实打实的出货量很容易就能成为国内早期采用者群体心目中的天然信用背书。进驻顺电和香港丰泽不久，VITURE就做到了AR眼镜销量第一。今年618，VITURE最新旗舰款Beast首次��战电商大促，一举拿下了京东XR眼镜的单品SKU销冠。CINNO Research刚刚发布的2026年第二季度报告，给出了一个更硬的数据：在国内高端AR眼镜市场，VITURE的销量和销售额双双登顶第一。</p>\n  <p><strong>第三次反直觉的决策，是最先服务那群“最难讨好”的人。</strong></p>\n  <p>当下，XR行业已经分野出好几条路径。有些厂商不做显示，做带摄像头和AI的音频眼镜，走时尚轻量化路线；有些押注一体机，赌计算平台的终局。所有人都在求变、求稳，反倒是敢在一开始被看好的“显示屏之路”上一往无前的人，已经越来越少。</p>\n  <p>但总要有人立身于强风之中。VITURE和姜公略的打法就是以“不变”的第一性原理应万变，把显示做到极致，死磕游戏玩家。</p>\n  <p>在XR这个领域里，游戏玩家是所有用户里最难伺候的。清晰度差一点会骂，延迟高一点会骂，手柄手感不对也会骂，但一旦玩爽了，忠诚度和口碑传播的欲望也是所有用户里最强的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_34b5419d1cc84d6c99aa39955899d86c@5510391_oswg768727oswg1080oswg655_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>姜公略自己就是个重度游戏玩家，平时戴着自家眼镜打CS，世界杯期间沉迷玩EA SPORTS FC。所以他瞄准的第一个场景特别具体，就是汲取游戏专用设备的灵感，踩着任天堂的石头过河。对于游戏玩家来说，Switch和Steam Deck掌机屏幕太小，PC显示屏和电视够大但不可能随身带走，用眼镜玩游戏刚好能塞进这个市场，填上这个缝隙。</p>\n  <p>五年下来，VITURE也不负众望地围绕游戏搭了一整套软硬件生态。</p>\n  <p>包括和八位堂联名的拉伸式手柄，成为行业第一支专为XR眼镜设计的游戏手柄；自研的SpaceWalker App把多屏联动等能力免费开放给所有用户，Immersive 3D系统能把任何普通视频实时转成3D空间内容。</p>\n  <p>2025年底，VITURE与《赛博朋克2077》推出了五周年联名限定款眼镜，全球限量一万台，上线即售罄。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_130e3c89814e4de5bf32fdc20e99df9e@5510391_oswg929166oswg1064oswg568_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>对于消费电子产业来说，比官方规划更有说服力的，永远是用户们自己迸发和生长出来的用法。</p>\n  <p>有人修车的时候用XR眼镜把维修资料和教程悬浮在眼前，边看边学；有的用户深夜哄孩子睡觉以后，客厅电视开不了，但用XR眼镜还能安静看完一部电影；还有无人机玩家把它连上第一视角，有开发者在Vibe Coding的时候用它同时盯好几个AI Agent的进度。</p>\n  <p>今年5月发布的VITURE Beast，把显示能力推动到了能撑起多屏办公的水平，支持飞书、PPT、编程等多个界面同时展开，也让XR眼镜这个品类第一次从娱乐设备跨进了生产力终端的赛道。Beast能被研发出来，并迅速发售，根本原因还是在于XR眼镜兼具移动端的便携性和PC的大屏，从而衍生出了大量的生产力需求场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_6dfa59d4abbd4ba2bc401a8f91c788d8@5510391_oswg733257oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在用户自己发现“竟然还能这样用？”之前，没有一家XR眼镜厂商敢说能在短期内做好XR办公的市场教育。</p>\n  <h2><strong>2027年，起飞，入云</strong></h2>\n  <p>姜公略对XR行业的窗口期判断，比大多数同行要理性一些。</p>\n  <p>他说，如果说2025年算是XR眼镜一个朦胧的起点，2026年会是一个确定性的起点，2027年是行业真正起飞的时候，发动机开满全力加速，2028年真正腾飞，飞机彻底离开地表。</p>\n  <p>为什么XR在大众和资本心目中，站在了一个比较微妙的节点上？</p>\n  <p>姜公略判断，是因为现在行业正处在第三阶段的前夜，“大家都在描绘一个仿佛鲸鱼跃身击浪的未来。用户觉得它很酷，但下一句就会说‘我不需要它’。”</p>\n  <p>破局之道也很简单，就是乘风而起、伺机而动、做对形态、找对场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_5101d847d3a44ff5a79b90d7d17f179e@5510391_oswg1958595oswg990oswg1238_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>至于消费电子领域一贯而言之的“iPhone时刻”，姜公略认为，很多概念都是事后追认的，在iPhone发布之前，没有人知道它长什么样，而XR的魅力和机会也正是终局形态的未知。</p>\n  <p>“我们希望不断突破行业创新的边界，回头再去看的时候，可能才会发现某个产品、某个应用，已经成为了我们所谓的iPhone时刻。”</p>\n  <p>起飞的条件现实而苛刻，但也比外界想象得快。上游三个变量同步成熟，缩短了像VITURE这样的终端厂商的弯路：</p>\n  <p>首先，最重要的仍然是芯片端。去年开始，有越来越多带空间计算能力的芯片进入眼镜品类，Beast已经搭载了原生3DoF计算能力，未来制程更高、功耗更低、算力更强。一个充分的例证是TWS耳机，以前的耳机是无源有线设备，现在已经有不错的计算能力了，在姜公略看来，眼镜会走完全一样的路。</p>\n  <p>第二个是VITURE“死磕”的显示端。Micro OLED正在进入新分辨率时代，过去几年行业标配是1080P，未来两三年会迎来换代。目前，Micro LED在480P基础上持续缩小体积，缩小到能融入普通眼镜的尺寸，下游终端就会爆发一波新的红利期。</p>\n  <p>上面提到的定价1999元的VITURE Pro 2，能在千元档的设备上用索尼Micro-OLED，本身也是这条供应链上降价曲线的产物。</p>\n  <p>第三个是传输端，无线短距传输芯片也是姜公略紧盯的行业方向。一个不可逆的大趋势是，眼镜终将走向无线化，而且这件事已经是“箭在弦上”了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_df33b63205f844459ca1159f7fd4f747@5510391_oswg718595oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>回到一开头XR眼镜为什么“用户黏性低”“买来吃灰”这个问题上，与其得出用户对新品类缺乏耐心的结论，不如先厘清产品形态和行业周期，承认有一部分细分品类就是还没到达足以留住用户的阶段，至少还没做到在某些特定的功能场景上成为比手机更好的解决方案。</p>\n  <p>在姜公略看来，沉浸式的数字体验、全天候佩戴，这两种需求场景指向的是两种完全不同的产品，虽然看起来都是智能眼镜，但产品的本质泾渭分明。</p>\n  <p>VITURE一直主攻的是前者，因为这里的供应链跑得更快、也更容易找到具有稀缺性价值的场景，全天候产品则需要继续等待上游的成熟、用户认知的合适时间点。姜公略认为，那会是未来十年到二十年里最令人兴奋的赛道之一，但不一定是现在该讲的故事。</p>\n  <p>既然没想着让用户每天像拿手机一样如影随形，那么沿着Beast的生产力工具思路发力纵深场景，就变成了一个新的增长点。因此在消费端之外，VITURE的同一套光学和显示能力也在往更专业的场景渗透。</p>\n  <p>今年AWE(世界增强现实博览会)上，VITURE和英伟达、斯坦福Cong Lab联合发布了全球首款支持英伟达XR AI平台的工业级AI眼镜&nbsp;Helix，正式进入了基因编辑、药品研发这些几乎不容出错的高门槛场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_2ef1a13021394cd6a5a0ff46e7b4c65c@5510391_oswg273635oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>五周年期间，VITURE还宣布了另一个面向中国市场的动作：和滴滴出行达成了战略合作，致力于把XR体验带进城市出行的高频场景。这周，合作率先在上海陆家嘴中心商场落了地。一辆写着“滴滴一下，视界大开”的极氪009停在商场门口，车里没有常规的车载屏，坐进去会看到一副VITURE Pro 2眼镜，戴上后146英寸的虚拟巨幕立刻在眼前展开，车厢随之变成了一个随行的私人影院、游戏间或移动办公室。</p>\n  <p>8月14日至16日，一百位滴滴V7、V8会员受邀进入VITURE XR体验间，会在45分钟之内体验这套玩法，让普通视频一键升维成3D巨幕，连上Switch 2或PS5直接在车里打主机游戏，或是借SpaceWalker展开多块虚拟办公屏。</p>\n  <p>这些新探索的背后是同一条主脉络：先让产品能在真实的生活和工作里被用起来，让用户主动发现需求，再让场景自己向外生长。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260815/v2_976c28684cd3458a8d4e607f890396b2@5510391_oswg1192995oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>说到向外生长，姜公略最近印象最深刻的一个画面，发生在一趟从旧金山飞往纽约的航班上。</p>\n  <p>飞机起飞前，他照例掏出自己的眼镜和颈环开始办公，旁边的乘客看了一眼，笑了笑，也从包里掏出了一副VITURE Beast眼镜。整整六个多小时的飞行时间，两个人从头戴到尾，心照不宣。</p>\n  <p>没人说话，但双方也都知道身边的人正在把本来无聊需要打发的飞行时间，变成一段高质量的沉浸式体验。只不过那位乘客大概率不会知道，坐在他旁边的普通用户就是VITURE的创始人。</p>\n  <p>“五年，对新生儿来说，在逐渐看见这个世界；对VITUR来说，在逐渐被这个世界看见。”</p>\n  <p>这是姜公略五周年时写给团队的话。</p>\n  <p>在承认用户“并没有多戴一副眼镜需求”的五年之后，他在香港丰泽电器门口看到了自己亲手做出来的产品，在科隆Gamescom上被游戏玩家从一件T恤logo认出来，又在旧金山的航班上和一个陌生人坐在一起，沉浸在各自的数字世界里同乘了六个小时。</p>\n  <p>在经历了这些并不宏大、但真诚而温暖的时刻以后，他得出的行业判断是：2027年，XR这架飞机会起飞。</p>\n  <p>飞机上装载的是普通人的未来，也是一家创业公司、一个品类、一个现在还在被质问“是否变得奇怪”的消费电子叙事，从被忽视、被反驳、到被认出、被需要的梦想与过程。</p>\n  <p><strong>“历史上每一场技术变革，都始于一群敢于相信和拥抱未来的人。”</strong>姜公略在五周年给团队的信里这样写道。&nbsp;</p>", "category": "tech", "published_at": "2026-08-15T10:00:00+00:00", "fetched_at": "2026-08-16T01:01:02.904000+00:00", "fingerprint": "f407c4efe61b5c38"}, {"source": "少数派", "title": "有毒职场正在炼成：OKR 变成 KPI，敏捷开发变成切碎的瀑布", "url": "https://sspai.com/post/111974", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/111974\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-15T07:07:54+00:00", "fetched_at": "2026-08-16T01:00:59.935809+00:00", "fingerprint": "0ebfd6a95cf03d1a"}, {"source": "The Guardian - World", "title": "American missionary kidnapped in Niger freed after nine months", "url": "https://www.theguardian.com/world/2026/aug/14/american-missionary-kevin-rideout-niger-released-kidnapping", "summary": "<p>Kevin Rideout, who was abducted by unknown assailants in Niamey, said to be in good health and in care of US officials</p><p>An Ameri
