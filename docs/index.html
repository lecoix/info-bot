虑成为核心诉求。据易观《Z 世代新母婴人群消费洞察 2023》，51% Z 世代宝妈选购母婴产品优先选择智能款，44.1% 认为智能产品安全性更高，43.1% 看重便捷性。结合多份行业调研，新一代父母核心需求分为四点：</p>\n  <p><strong>职场育儿双重压力，急需减负工具</strong></p>\n  <p>92% Z 世代夫妻为双职工，95 后家庭母婴支出占家庭收入 30%，育儿投入更高，但夜间频繁起夜查看尿裤严重挤压休息时间，碎片化睡眠带来强烈育儿疲惫。他们不愿牺牲全部个人生活，迫切需要智能设备承接重复性看护工作，平衡工作、亲子与自我空间。</p>\n  <p><strong>数字原住民，信奉数据化科学养育</strong></p>\n  <p>95.4% 年轻父母购买母婴产品前会全网对比测评、成分与技术，拒绝长辈主观育儿经验；76.4% 推崇 “孩本位” 平等养育，宝宝哭闹、皮肤泛红、睡眠不安等问题，不再依靠主观猜测，而是需要温湿度、排泄、睡姿等客观生理数据作为护理依据。</p>\n  <p><strong>三重需求闭环：宝宝健康、自我松弛、低碳环保</strong></p>\n  <p>宝宝端：高度重视尿裤亲肤透气、低致敏，排斥闷湿引发红臀；</p>\n  <p>家长端：追求低焦虑育儿，希望设备主动预警风险，无需时刻紧绷精神；</p>\n  <p>社会端：可持续消费意识提升，反感一次性纸尿裤大量耗材浪费。</p>\n  <p><strong>智能化为高质量亲子陪伴腾挪空间</strong></p>\n  <p>年轻父母认知清晰：智能产品不是放任不管，而是减少无效看护劳动。省去整夜查尿裤、频繁更换的精力后，可专注亲子互动、情绪安抚，实现 “省力不缺席” 的新型亲子关系。</p>\n  <p>&nbsp;</p>\n  <h3><strong>AI“芯”升级，</strong></h3>\n  <p><strong>政策与消费双向驱动智能化浪潮</strong></p>\n  <p>母婴行业的智能化变革并非偶然，政策导向与新生代父母的育儿消费升级构成两大底层驱动逻辑，整条赛道正式进入AI技术深度渗透、落地商用的新阶段。</p>\n  <p>2025年11月，国家发改委等六部门联合印发《关于增强消费品供需适配性进一步促进消费的实施方案》，明确提出推动婴童产品向精细化、品质化、智能化升级，将健康监护、贴身护理类智能产品列为重点发展品类光明网。</p>\n  <p>与此同时，作为全球孕婴童产业风向标，2026上海CBME国际孕婴童展紧跟政策与市场消费升级趋势。本届展会增设智能制造专属展区，推出 “新星计划” 扶持智能贴身护理、可持续育儿科创品牌。CEENEW 吸牛裤作为 AI 智能布尿裤新锐品牌参展，完整展出搭载神兽超感 AI 感知系统的全系产品，是尿裤赛道少数实现贴身实时生理监测的差异化产品。</p>\n  <p>CBME展会释放的行业趋势与政策导向、消费需求形成完美共振：当下 Z 世代父母对科学、轻量化育儿的需求爆发，市场急需兼顾安全、环保、全天候健康监测的贴身母婴产品。</p>\n  <p>&nbsp;</p>\n  <h3><strong>有温度的 AI 智能尿裤</strong></h3>\n  <p><strong>直击 95 后父母深层育儿痛点</strong></p>\n  <p>吸牛裤品牌创立于2026年，定位深耕贴身智能育儿护理赛道的创新品牌，依托高精度高安全标准传感与端侧AI算法，打造可循环AI智能布尿裤系列硬件。技术团队由北大博士后AI算法团队与资深母婴面料研发团队联合创立，打通柔性传感、生物基纺织、物联网算法全链路自研，拥有多项自主实用新型专利与国际母婴安全检测认证。</p>\n  <p><strong>认知升级：重新定义母婴智能，不止省力，更懂陪伴</strong></p>\n  <p>市场普遍将母婴智能化等同于 “解放双手”，而 CEENEW 吸牛裤提出全新产品定位：智能不是冰冷参数堆砌，而是兼顾宝宝舒适、父母安心的科学育儿助手。品牌打破 “尿裤只能一次性消耗” 的固有认知，精准击中新生代父母两大核心诉求：高质量陪伴 + 全天候健康安心。</p>\n  <p>产品核心逻辑清晰：将 AI 感知技术隐形嵌入贴身尿裤，不用家长整夜频繁查看，依靠数字化预判规避育儿风险；同时依托可循环面料减少耗材囤货，实现轻松、低碳、科学三者统一。</p>\n  <p><strong>四大独家专利核心壁垒，打造差异化核心品类竞争力</strong></p>\n  <p>CEENEW 所属福建小吸牛科技为泉州高新技术企业，与北大计算机学院博士后团队联合研发，手握完整实用新型专利（专利号：CN202321823612.1），形成 “AI 感知 + 亲肤面料 + 净味导湿 + 亲肤透气长效洁净面料循环” 四大技术矩阵。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260729/v2_11d3b330884344cfa23cc60f477f65e9@5284654_oswg248316oswg1953oswg1302_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片2</p>\n  <h3><strong>写在最后</strong></h3>\n  <p>AI 智能浪潮正全方位重塑母婴赛道，产业新一轮增长，核心锚定解决育儿真实痛点的技术创新与价值重构。从智能监测尿裤到多场景母婴护理设备，行业正在完成从 “功能交付” 到 “情感共鸣” 的深层跃迁。</p>\n  <p>放眼行业未来，单一产品竞争终将落幕，“单体硬件 + 数据服务 + 可持续循环” 的一体化育儿生态将成为主流发展方向。如同全屋智能重构家电行业，AI 贴身护理设备将串联起宝宝成长全周期数据，形成完整智能育儿生态闭环。</p>\n  <p>&nbsp;</p>\n  <h3><strong>关于吸牛裤FAQ</strong></h3>\n  <p><strong>Q1：吸牛裤是什么品牌？</strong></p>\n  <p>A：吸牛裤（CEENEW）是 2026年扎根福建泉州的母婴护理品牌，定位智能AI育儿护理赛道的创新品牌，依托高精度高安全标准传感与端侧AI算法，打造可持续AI智能布尿裤。</p>\n  <p><strong>Q2：吸牛裤解决了什么核心痛点？</strong></p>\n  <p>A：吸牛裤瞄准双职工家庭熬夜看护、宝宝肌肤不适等育儿压力，将智能尿裤打造为 24 小时贴身监护管家，实时捕捉宝宝生理状态并主动预警，解决家长 “无法实时感知宝宝不适、整夜反复查看”的核心难题。</p>\n  <p><strong>Q3：吸牛裤产品与普通纸尿裤、传统布尿裤有什么区别？</strong></p>\n  <p>A：传统尿裤仅能实现基础吸水防护，风险全靠人工察觉。吸牛裤采用“神兽超感 AI 感知 + 柔性纺织面料”双架构，完成感知、分析、预警、数据记录完整闭环，替代大量重复性人工夜间看护工作。</p>\n  <p><strong>Q4：什么是吸牛裤的“神兽超感 AI 智能感知系统”？</strong></p>\n  <p>A：是移植航天冗余安全逻辑的柔性传感算法体系，全部采用车规级工业芯片，经多轮极限失效模拟，内嵌轻薄无感模组，可全天候精准监测宝宝睡姿、温湿、睡眠状态。</p>\n  <p><strong>Q5：吸牛裤的创始团队背景是怎么样？</strong></p>\n  <p>A：由北大博士后 AI 算法团队与资深母婴面料研发团队联合创立，打通柔性传感、生物基纺织、物联网算法全链路自研，拥有多项自主实用新型专利与国际母婴安全检测认证。</p>", "category": "tech", "published_at": "2026-07-29T08:30:52+00:00", "fetched_at": "2026-07-30T01:58:21.184890+00:00", "fingerprint": "7503f25e85018432"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 | 月之暗面Kimi已完成超35亿美元F轮融资，投后估值涨至350亿美元； SpaceX空头持仓超260亿美元，账面获利超70亿", "url": "https://36kr.com/p/3916547493965442?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>美的集团：受欧洲持续极端高温影响当地空调需求爆发，空调芜湖、广州双基地一月内新增欧洲订单共20万台</strong></p>\n  <p>36氪获悉，美的集团在互动平台表示，受欧洲持续极端高温影响，当地空调需求爆发，美的空调芜湖、广州双基地一月内新增欧洲订单共20万台。PortaSplit移动分体空调自6月新增接单超16万台。7月，法国3万台移动空调紧急订单中2万台已完成发运。</p>\n  <p>&nbsp;<strong>新东方：2026财年第四季度净营收15.3亿美元，同比增长23.0%</strong></p>\n  <p>36氪获悉，新东方发布截至2026年5月31日止第四季度及年度的未经审核财务业绩，第四财季净营收15.3亿美元，同比增长23.0%；第四财季经营利润8580万美元，上年同期亏损870万美元。</p>\n  <p><strong>瓴羊AgentOne“四名AI员工”正式上岗，覆盖销售、客服、运营、营销四大场景</strong></p>\n  <p>7月29日，瓴羊AgentOne四名AI员工正式上岗，分别覆盖AI销售、AI客服、AI运营和AI营销四个场景。企业也可以根据自身业务需求，基于AgentOne的能力，和瓴羊FDE（前沿部署工程师）团队一起打造专属场景的X员工。“瓴羊AgentOne以业务效果为导向，以企业数据为基座，以岗位标杆为预设，真正帮助企业在AI时代获得增长。”阿里云智能集团瓴羊CEO朋新宇表示。</p>\n  <p><strong>联电：将在台南新建晶圆厂，以满足AI需求</strong></p>\n  <p>联电7月29日宣布，将扩建新加坡厂区无尘室产能，并同步于台南科学园区展开新厂外壳工程。此项扩产计划，旨在满足客户近期需求。联电表示，将在台湾兴建一座全新晶圆厂房，作为未来第七期（P7）及第八期（P8）厂区基地。台南新厂将扩大公司在先进封装领域的布局。（界面）</p>\n  <p><strong>月之暗面Kimi已完成超35亿美元F轮融资，投后估值涨至350亿美元</strong></p>\n  <p>月之暗面Kimi已完成F轮融资，融资金额超35亿美元，投后估值涨至350亿美元。因超目标金额3倍多，本轮融资系提前关闭，原定8月开始的G轮（Pre IPO轮）已提前开始，投前估值升至500亿美元。（财联社）</p>\n  <p><strong>美邦股份：上半年净利润5106.74万元，同比增长41.32%</strong></p>\n  <p>36氪获悉，美邦股份披露半年报，公司上半年实现营业收入5.55亿元，同比增长14.34%；归属于上市公司股东的净利润5106.74万元，同比增长41.32%；基本每股收益0.38元。</p>\n  <p><strong>爱马仕二季度销售增长7%</strong></p>\n  <p>法国奢侈品集团爱马仕近日公布的第二季度业绩显示，该公司当季销售额达41亿欧元，按固定汇率计算同比增长7%，符合市场预期。从区域市场看，除中东地区外，所有市场在截至6月底的三个月内均实现增长。（新浪财经）</p>\n  <p><strong>宝马拟在德国裁员数千人，通过自愿离职计划削减成本</strong></p>\n  <p>据报道，宝马集团计划向德国数千名员工提供自愿离职补偿方案，作为公司削减成本、提升竞争力的一部分。宝马全球计划削减约8000个岗位，其中大部分将来自德国市场。此次自愿离职计划主要面向研发、产品规划及其他企业职能部门员工，生产线工人不在适用范围内。公司还计划在未来几个月精简管理层级。该方案预计10月启动，并持续至2027年。（新浪财经）</p>\n  <h2>新产品：</h2>\n  <p><strong>国产首颗OLED TDDI芯片量产</strong></p>\n  <p>36氪获悉，近日，集创北方自主研发的国内首颗OLED显示触控一体化（TDDI）芯片ICNA3611实现在国内知名品牌主流机型中的规模化量产。</p>\n  <h2>投融资：</h2>\n  <p><strong>“智谷天厨”获招商局创投领投近亿元融资</strong></p>\n  <p>近日，智能烹饪机器人企业“智谷天厨”官宣完成新一轮近亿元战略融资。本轮融资由招商局创投领投，跃迁资本跟投，云启资本、啟赋资本等老股东超额追投。融资完成后，公司将持续推进物理 AI 研发，并加速中式及泛亚洲餐饮的全球化落地。</p>\n  <h2>今日观点：</h2>\n  <p><strong>商务部办公厅：进一步加力推动城市一刻钟便民生活圈建设</strong></p>\n  <p>36氪获悉，商务部办公厅印发关于进一步加力推动城市一刻钟便民生活圈建设的工作通知。通知提出，各地要加快工作进度，划定便民生活圈总量，明确逐年建设数量，按照有关规划安排，在保证质量的前提下，2026年完成全国建设1万个便民生活圈的既定目标。各地要依托便民生活圈开展丰富多彩的惠民促销活动，推动国货“潮品”、外贸优品、本地精品、国际名品进社区，依法依规设置展区展台，丰富社区消费场景。要鼓励家电以旧换新、数码和智能产品购新补贴政策参与主体，在社区举办宣传促销活动，引导生产、销售、平台、售后服务和回收企业在社区设立便民服务点。要鼓励汽车生产、流通、回收企业在社区宣传汽车以旧换新政策，在有条件的社区开展汽车展示展销、体验试驾等活动。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>外交部回应美国实施先进机器人进口限制</strong></p>\n  <p>针对美国联邦通信委员会宣布对外国制造的先进机器人实施进口限制，包括中方占有主导地位的人形机器人，外交部发言人毛宁7月29日在例行记者会上说，中方一贯坚决反对美方泛化国家安全概念打压中国企业。保护主义提升不了美国的竞争力，只会损害美国企业和消费者的利益。中方将继续采取必要措施，坚定维护中国企业的正当合法权益。（新华社）</p>\n  <p><strong>英国央行据悉评估主经纪商对亚洲股票的风险敞口</strong></p>\n  <p>7月29日，据报道，英国央行正在评估在伦敦运营的投资银行对亚洲股票的风险敞口，以降低与少数人工智能相关公司有关的集中度风险。监管机构据悉正在评估银行如何通过英国业务，为对冲基金及其他机构的亚洲投资提供融资。受人工智能热潮推动，少数亚洲公司吸引了大量对冲基金资金流入，其中包括SK海力士和台积电。对部分银行而言，亚洲地区对这类融资业务的收入贡献可能超过欧洲。（界面）</p>", "category": "tech", "published_at": "2026-07-29T11:04:52+00:00", "fetched_at": "2026-07-30T01:58:21.184884+00:00", "fingerprint": "4ccab96e6e6bdc84"}, {"source": "36氪 - 最新文章", "title": "让AI先吃，这个国民级健康难题有解了", "url": "https://36kr.com/p/3916800672656773?f=rss", "summary": "<p>在科学减重这件事上，继战略投资薄荷健康之后，蚂蚁阿福又放了个大招。</p>\n  <p>7月29日，蚂蚁阿福宣布升级上线“AI拍饮食”功能，用户拍食物照片发给阿福，就能自动估算营养和热量信息，获得健康饮食搭配建议和运动消耗计划等，还支持一健存入个人健康档案，建立“热量账户”。吃得对不对，多不多，一目了然。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260729/v2_f160e5f7d56e4cb0bd4c116828463895@19153231_oswg3087755oswg6106oswg4071_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>阿福此次推出“AI拍饮食”功能，并非是一项孤立动作。</p>\n  <p>一个月前，36氪曾报道，蚂蚁阿福发起“科学减重1亿斤”号召，推出“1分钱”低价供应体脂秤、升级AI功能，发起21天打卡挑战赛等三大行动，帮助大众科学管理体重，建立日常健康习惯。</p>\n  <p>这场“全民科学减重行动”带来的风潮超出预期。越来越多人加入“减重”大军，爬华山、游东湖、骑单车、跳单杠等场景都出现了阿福陪练、陪游的身影。目前全国已有近150万网友参与科学减重行动，减重超过200万斤。</p>\n  <p>在运动之外，吃什么，怎么吃，往往是减重中最难也是最容易忽略的一环。普通人很难持续、准确地记录自己吃了多少，热量是否超标，搭配是否合理。对大众来说，阻碍科学减重的，并非缺少意愿，而是缺少一种足够专业、低门槛、且能长期坚持和反馈的趁手工具。</p>\n  <p>“减重”这一全民健康管理场景，有望诞生出一个“国民级健康AI应用”。而能否将这一场景做深做透，正是全民AI健康入口的试金石。</p>\n  <h2><strong>战投薄荷的化学反应：“AI营养师”学成归来</strong></h2>\n  <p>让AI“看懂”中餐，其实并不简单。</p>\n  <p>在AI健康管理赛道，将饮食“数字化”一直是难题。相较遵循标准化食材、分量和烹饪逻辑的西餐，中餐不仅菜系繁多、食材组合灵活，同一道菜因火候、配料的不同，热量和营养差距就可能悬殊。</p>\n  <p>这也导致市面上的饮食记录工具普遍易出现品类误判等问题，数据库本身的更新和维护也不容易。</p>\n  <p>阿福上线“AI拍饮食”，首先就是希望解决这类问题。</p>\n  <p>36氪了解到，在技术层面，蚂蚁阿福专门升级了基础模型的多模态等能力，可提升食物识别的准确率；“AI拍饮食”功能还会调用薄荷健康成熟的本土化饮食数据库，后者收录了160万条食物信息条目。</p>\n  <p>这两者的结合，让每一次菜品识别、热量测算都有了专业能力支撑。</p>\n  <p>此外，在保证识别准确度的基础上，阿福也顾及到了用户使用门槛的问题，通过“拍”“记”“改”三个核心功能，让日常饮食管理不再费力。</p>\n  <p>想做好饮食管理，核心是了解每餐营养信息，而“拍”这个动作极大降低了专业营养知识获取的门槛。用户打开阿福，对着食物拍一张照片，系统会自动识别和呈现营养信息，直观展示这一餐总热量，并拆分碳水、蛋白质、脂肪三类宏量营养素的具体数值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260729/v2_0b0fbd4391074bbb838a8679612d58e4@19153231_oswg2141945oswg4590oswg3316_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>完成这些只是基础，想追踪营养摄入情况，就要靠“记”。用户可以将识别出的热量和营养数据一键存入个人健康档案，形成一份完整的饮食进度记录。该账户会记录历史热量摄入，并结合成年人标准热量摄入量，给出饮食优化方案。</p>\n  <p>比如，一顿“玉米+茶叶蛋+豆浆”的早餐组合总热量约350-430千卡。但除了这些，阿福还会告诉你，最好再搭配一个番茄补充维生素C、餐后半小时喝200ml温水，协助消化玉米中的粗纤维；或者，如果阿福发现到用户没有记录晚餐，还会主动推送搭配方案，提醒减少夜间加餐，从源头规避多余热量堆积。</p>\n  <p>此外，考虑到少数复杂菜品的识别偏差，或偶尔“剩饭”等问题，阿福补充了“改”的功能，在饮食记录过程中，用户可灵活修改食物的名称、克数等信息。</p>\n  <p>这相当于给每个人开一个专属的“热量账户”，让普通人可以实时掌握饮食热量“收支”、及时调整膳食结构，让科学饮食管理落地到一日三餐。</p>\n  <p>也正是凭借这部分能力，阿福把过去繁琐、容易中断的饮食记录，变成了一次拍照、一次对话就能完成的轻量化动作。用户不需要再手动搜索食物热量，也不需要再自己计算营养配比，更不必依赖复杂的专业知识，就能快速获得科学的饮食建议。</p>\n  <h2><strong>“阿福先吃”背后，科学减重1亿斤更靠谱了</strong></h2>\n  <p>体重管理本质上是一个长链条、多环节协同的健康场景，只有打通测量、记录、分析、饮食、运动等多个环节，才能实现更精准的科学减重和长期健康管理。</p>\n  <p><strong>科学减重的起点，是全面了解自己的身体指标。</strong></p>\n  <p>今年6月底，发起“科学减重1亿斤”行动后，阿福首先通过“1分钱”领体脂秤，普及基础的减重工具，把科学减重硬件门槛打下来。很多用户领秤后，第一次全面了解自己的体重、体脂率、脂肪量等身体状况。</p>\n  <p>据蚂蚁阿福天猫旗舰店数据，目前，AI体脂秤领取量已突破100万台；除了体脂秤外，阿福还支持用户绑定市面上的主流健康硬件，包括苹果、华为、小米等智能手环、手表，以及鱼跃、欧姆龙等血压计、血糖仪设备。智能设备“朋友圈”持续扩容，也有望让用户全面了解个人的健康状况，真正迈上科学减重的道路。</p>\n  <p>此后，越来越多的网友和社会力量加入到这场健康行动中来，并带动了“健身热”、“燃脂游”、“骑行热”等多种健康活动。在健身房、村口湖边、公园运动角、五岳景区，不少加入这场“全民减重行动”的普通人，开启随地“大小练”。科学减重从个人行为，变成一场全民的健康团建。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260729/v2_07500a6fcb95403b98002b7e7903bfa1@19153231_oswg1611645oswg1474oswg646_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>阿福升级推出的“AI拍饮食”功能，则更是补齐“吃”这一最关键，也最易被忽视的健康环节。</strong>本质上，它是把专业、昂贵的营养师服务做得更普惠，解决普通人“不知怎么吃，吃什么”的饮食痛点，相当于是一位专属的“AI营养师”，把繁琐、专业的饮食管理，变成可随手记，分析、调整的日常健康管理行为。</p>\n  <p>如今，越来越多人开始“让阿福先吃”，科学减重不再只是靠短期热情驱动而是形成长期的健康生活习惯。吃饭前拍一下，吃饭后记一笔，看似只是简单的动作，背后却是饮食决策方式的改变，也是健康管理链条融入生活的开始���</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260729/v2_109a6b9efac540b1a59fa6af42b519df@19153231_oswg296284oswg1284oswg1142_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>从补贴体脂秤、降低减重门槛，到AI提供运动指导，再到饮食管理服务，阿福的一系列动作环环相扣，不仅逐步形成科学减重的“测、动、吃”服务闭环，也让“减重1亿斤”这个听起来似乎“离谱”的目标变得越来越“靠谱”。</p>\n  <h2><strong>全民闯关减重，有望诞生“国民级”健康AI入口</strong></h2>\n  <p>如果我们仅功能升级层面来理解“AI拍饮食”，或许低估了它的长期价值。</p>\n  <p>阿福想做的，其实是以高频的减重需求为起点，帮用户整合起多维度的健康档案，延伸出一条清晰、深入的健康管理路径，让“主动管理健康”从理念走向落地。</p>\n  <p>当前，国内健康管理赛道存在较明显的服务碎片化问题。消费级的记录饮食、健身体检，重医疗属性的线上问诊、购药，通常分属不同独立产品，各平台服务相互隔绝，就像一座座“孤岛”。</p>\n  <p>而人体健康本是完整统一的体系，饮食、运动、睡眠、体检等行为等深度关联，只依靠单一维度的信息和服务，很难给出精准、贴合个体情况的健康建议。</p>\n  <p>长期来看，大健康领域需要一个更通用的“国民级AI入口”。<strong>这也意味着，以阿福为代表的专业健康AI应用崛起，有潜力整合起碎片化、割裂的健康服务，建立以个人为中心的健康服务体系，实现“All in One”。</strong></p>\n  <p>首先，从减重领域，逐步拓展到睡眠、慢病、复健等更多日常健康管理场景。长期完整的饮食、运动行为，可以构建出立体的用户健康画像，这样，当用户遇到感冒、过敏、心血管养护等健康问题，咨询阿福时，阿福更能结合个人长期生活习惯，给出更准确的健康建议。</p>\n  <p>不妨畅想一下，未来，如果一位受高血糖、脂肪肝困扰的用户，日常饮食记录显示他长期偏爱精制碳水、蔬菜摄入不足，同时绑定的智能手环记录提示他餐后血糖波动较大。基于这些连续的、交叉验证的信息，阿福既会建议他“少吃高糖食物”，也能结合个人档案中的热量摄入、运动消耗等数据，给出更细致的选择：如晚餐用杂粮饭代替白米饭，搭配一份清炒时蔬，餐后散步20分钟。</p>\n  <p>第二重延伸，则关乎信任和服务的正向循环。健康产品核心比拼的是用户长期的信任度。连续、完整的个人健康信息，能持续提升AI健康问答的精准度，沉淀为用户长期信赖。在此基础上，平台可以进一步联动三甲医院减重科室、线上问诊通道、健康配套消费服务等资源，搭建起从日常健康管理到专业医疗干预的完整通路。</p>\n  <p>在这个意义上，“科学减重1亿斤”的底层逻辑，并非单纯追求一个数字目标，而是希望通过体重管理这个国民级的需求切口，帮助更多人在日常生活中建立起主动管理的健康意识，从“每餐吃什么”开始，更加了解自己的健康状态，逐步减少疾病的发生和演变。</p>\n  <p><strong>从某种程度上说，在减重这个国民级难题上闯关成功，才有望真正诞生国民级的健康AI入口。</strong></p>", "category": "tech", "published_at": "2026-07-29T14:21:47+00:00", "fetched_at": "2026-07-30T01:58:21.184877+00:00", "fingerprint": "a492c38aeb2a2d4d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨超1100名AI公司员工联名请愿美国政府；桃酥吃出假牙冠？山姆、泸溪河回应；月之暗面Kimi已完成超35亿美元F轮融资", "url": "https://36kr.com/p/3917362478148993?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>C长鑫成交额达400亿元</p>\n  <p>国家烟草专卖局约谈爱奇迹（深圳）技术有限公司</p>\n  <p>外交部回应美国实施先进机器人进口限制</p>\n  <p>宝马拟在德国裁员数千人，通过自愿离职计划削减成本</p>\n  <p>美联储宣布维持利率不变</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>Anthropic首席执行官等多位AI大牛签署联名信，呼吁控制人工智能发展步伐</strong></p>\n  <p>超过1100名来自领先人工智能公司的高管及员工联名签署了一封公开信，呼吁美国政府“支持国际社会共同打造技术与治理工具，以此对前沿自动化人工智能的发展节奏实施有序管控”。这封信于当地时间7月28日发布，并获得了Anthropic与OpenAI的支持，签署者包括Anthropic首席执行官达里奥・阿莫代伊、OpenAI首席科学家雅各布・帕霍茨基、谷歌安全与对齐副总裁安卡・德拉根，以及Meta AI首席科学家赵晟佳。上周，在一场网络安全测试中，OpenAI模型突破内部测试系统，并入侵模型代码库平台 Hugging Face，引发人工智能行业从业人员警觉。（新浪财经）</p>\n  <p><strong>桃酥吃出假牙冠？山姆、泸溪河回应</strong></p>\n  <p>7月29日，“泸溪河桃酥吃出牙冠”登上热搜。一名来自大连的网友在社交平台发布视频称，自己在山姆超市购买的泸溪河桃酥中吃出了疑似金属牙冠的异物。该网友表示，已就此联系山姆客服，但双方未就赔偿达成一致，目前已向12315投诉，正在等待处理。</p>\n  <p>对此，山姆客服回应：“山姆高度重视食品安全与会员体验。在收到会员相关反馈后，我们已对该涉事批次的商品进行下架封存。同时，我们第一时间启动了抽检以及溯源核查，并积极配合监管开展相关调查工作。同时，为维护会员合法权益，我们一直积极与该会员联系沟通，将依法依规妥善处理后续事宜。”</p>\n  <p>7月29日，泸溪河食品发布声明：近日关注到消费者在社交平台发布视频，称其在某商店购买的泸溪河单片密封包装桃酥里吃出三颗金属假牙排，对此公司高度重视，第一时间成立专项小组，立即开展当天的全生产线检视，对该批次产品进行排查，确保产品安全。泸溪河始终将食品安全放在首位，已将相关情况主动向政府监管部门报备，邀请政府监管部门到工厂检查，将与政府部门保持沟通与汇报。（第一财经）</p>\n  <p><strong>月之暗面Kimi已完成超35亿美元F轮融资，投后估值涨至350亿美元</strong></p>\n  <p>月之暗面Kimi已完成F轮融资，融资金额超35亿美元，投后估值涨至350亿美元。因超目标金额3倍多，本轮融资系提前关闭，原定8月开始的G轮（Pre IPO轮）已提前开始，投前估值升至500亿美元。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI的ChatGPT周活跃用户数接近10亿</strong></p>\n  <p>据OpenAI内部披露的信息，该公司旗下聊天机器人周活跃用户量即将突破10亿大关。这一里程碑原本是企业计划在去年年底达成的目标。尽管比原定预期晚了七个月才有望实现该目标，但ChatGPT上线不足四年就积累如此庞大的用户规模，即便不算增速第一，也属于互联网应用中增长速度最快的产品之一。公司发言人对此未予置评。（新浪财经）</p>\n  <p><strong>深信服AI在CyberGym评测跻身全球前四，国内第一</strong></p>\n  <p>36氪获悉，近日，在面向AI安全能力的国际基准测试CyberGym中，Sangfor AI在依托纯国产基座模型（GLM-5.2）的固定模型配置下，系统面对涵盖ARVO与OSS-Fuzz的全量高难度漏洞挑战，在1507项任务中成功解决1301项，整体成功率达到86.3%。最终整体评测成绩跻身全球前四，位列国内参评团队第一。</p>\n  <p><strong>OpenAI发布开源版Codex&nbsp;Security CLI</strong></p>\n  <p>OpenAI当地时间7月28日在社交媒体平台X发文称，已发布开源版Codex Security CLI。用户现可利用该工具扫描代码仓库、跨多次运行追踪发现的问题、验证修复结果，并将安全检查纳入持续集成和持续交付（CI/CD）流程。OpenAI表示，该产品目前仍处于早期发布阶段，未来将根据用户反馈持续改进。（界面新闻）</p>\n  <p><strong>Artium AI成为OpenAI高级合作伙伴，助力企业开发定制化智能体AI方案</strong></p>\n  <p>7月29日，美国智能体AI软件咨询公司Artium AI宣布，已加入OpenAI合作伙伴网络，成为OpenAI高级合作伙伴。公司表示，未来将与OpenAI合作，帮助企业在金融服务、医疗、科技、电信、媒体和娱乐等领域构建、部署和扩展定制化智能体AI解决方案。（新浪财经）</p>\n  <p><strong>腾讯混元开源AngelSpec</strong></p>\n  <p>36氪获悉，7月29日，腾讯混元团队宣布正式开源AngelSpec。一个覆盖drafter训练、架构设计到线上部署的投机解码框架，并同步开源Hy3-A21B的MTP与DFly drafter权重及训练代码。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>《中华人民共和国反网络暴力法（征求意见稿）》公开征求意见</strong></p>\n  <p>36氪获悉，为了预防、制止和惩治网络暴力，加强反网络暴力工作，保护个人、组织的合法权益，维护国家安全和社会公共利益，按照有关立法规划计划安排，国家互联网信息办公室会同有关部门起草了《中华人民共和国反网络暴力法（征求意见稿）》，现向社会公开征求意见。</p>\n  <p><strong>美股三大指数集体收跌，存储板块大跌</strong></p>\n  <p>36氪获悉，7月19日收盘，美股三大指数集体下跌，道指跌2.19%，纳指跌1.74%，标普500指数跌1.52%。存储板块大跌，美光科技跌近10%，闪迪跌超7%，迈威尔科技跌超6%，英特尔跌超5%；科技股普跌，英伟达跌超3%，特斯拉跌超2%，亚马逊、Meta跌超1%。热门中概股多数上涨，理想汽车涨超4%，拼多多涨超3%，小鹏集团、哔哩哔哩涨超2%，京东、网易涨超1%，阿里巴巴小幅下跌。</p>\n  <p><strong>C长鑫成交额达400亿元</strong></p>\n  <p>36氪获悉，截至7月29日下午两点，C长鑫成交额达400亿元，现涨11.7%，总市值超3.51万亿元。</p>\n  <p><strong>智驾“小蓝灯”相关国标已启动制修订</strong></p>\n  <p>36氪获悉，7月29日，中国汽车标准化研究院发文称，当下多款搭载驾驶辅助“小蓝灯”的车型存在灯光滥用问题，夜间蓝光易造成眩光，干扰其他驾驶员判断；同时该类车辆易遭近距离跟车、恶意加塞，提升道路通行风险。该文表示，现行GB 4785—2019未对智驾外部蓝灯作出明确规定，按标准原则，车辆不可加装法规未定义的外部光信号装置。国际相关工作组对该类指示灯利弊仍��争议。全国汽车标准化技术委员会正在主管部门指导下，开展GB 4785《汽车及挂车外部照明和光信号装置的安装要求》标准制修订，同时配合开展加强“激进式”产品创新设计准入审查和测试验证管理相关工作，进一步规范车辆灯具安装使用，提升汽车产品安全性能。</p>\n  <p><strong>雷军回应小米为何要做增程车：增程市场远未饱和，大有可为</strong></p>\n  <p>36氪获悉，雷军微博发文解释小米澎程为什么要做增程。“增程还是纯电，没有技术路线的绝对优劣，只有产品体验的高下之分。”雷军表示，增程市场远未饱和，反而大有可为。“小米澎程的增程，解决了非常多槽点，和早期增程已经不可同日而语”。</p>\n  <p><strong>AI短剧半年规模超220亿元，产业爆发重塑内容生产逻辑</strong></p>\n  <p>今年上半年，AI短剧交出了一份远超市场预期的成绩单。DataEye最新数据显示，今年1月至5月AI短剧市场规模已突破220亿元，全年有望冲击400亿元大关，国内AI短剧用户在今年上半年突破6亿。当前，从平台到制作方，从技术提供方到内容创作者，各方都在热议一个共同话题——AI正在从根本上重塑短剧的生产逻辑与商业边界。业内人士普遍认为，AI短剧已走过试探期，规模化的产业爆发正在发生。（中证报）</p>\n  <p><strong>比亚迪李云飞：投资长鑫科技5000万元为公司行为，董事长王传福不存在个人对外投资情形</strong></p>\n  <p>针对比亚迪参与长鑫科技首轮融资情况，比亚迪集团品牌及公关处总经理李云飞表示，该投资六年前（2020年12月）由比亚迪股份出资5000万元完成，公司董事长王传福仅持有比亚迪相关股份，未以个人名义对外投资入股其他任何企业，不存在个人对外投资情形。同时，公司所有对外投资，均统一以比亚迪股份有限公司主体名义开展，公司高管从未以个人名义参与任何对外投资项目。“近年来公司开展的各项股权投资业务，均为企业层面的市场化投资行为。”李云飞表示。（财联社）</p>\n  <p><strong>国家烟草专卖局约谈爱奇迹（深圳）技术有限公司</strong></p>\n  <p>36氪获悉，针对日常监管中发现的爱奇迹（深圳）技术有限公司涉嫌违法违规生产经营、合规管理薄弱等突出问题，近日，国家烟草专卖局依法对爱奇迹（深圳）技术有限公司负责人进行了行政约谈，要求其严格遵守《中华人民共和国烟草专卖法》、《中华人民共和国烟草专卖法实施条例》及《电子烟管理办法》等规定和国家限制类产业政策，切实履行合规经营主体责任，严格落实电子烟监管要求，建立健全内部合规管理体系，全面提升企业管理水平。</p>\n  <p><strong>中际旭创回应光模块降价传闻</strong></p>\n  <p>7月28日晚，中际旭创在电话会议上表示，针对行业1.6T光模块价格降幅较大的市场传闻，公司1.6T的ASP远高于市场传言，行业不存在恶性竞争。当前整体行业需求非常旺盛，原材料紧缺，1.6T交付紧张，只有少数厂商具备大规模交付1.6T的能力。公司产品定价具备竞争力，能够稳定维持毛利率水平。（界面新闻）</p>\n  <p><strong>兆易创新：5月6日至6月12日朱一明合计减持约44亿元公司股份</strong></p>\n  <p>36氪获悉，兆易创新公告，公司股东朱一明在2026年5月6日至6月12日期间，通过集中竞价和大宗交易方式合计减持公司股份1111.06万股，占公司总股本的1.58%，减持总金额约44亿元。减持计划实施完毕后，朱一明与其一致行动人香港赢富得有限公司合计持有公司股份4770.09万股，占公司总股本的6.80%。</p>\n  <p><strong>Momenta获德国全境L4级测试许可，系首家获批中国企业</strong></p>\n  <p>36氪获悉，7月29日，Momenta宣布获得德国联邦机动车运输管理局（KBA）颁发的L4级自动驾驶测试许可，可在德国全国城市道路开展测试，无需逐城申报。这是中国企业首次获此资质。受此消息影响，Momenta港股收涨超10%。</p>\n  <p><strong>外交部回应美国实施先进机器人进口限制</strong></p>\n  <p>针对美国联邦通信委员会宣布对外国制造的先进机器人实施进口限制，包括中方占有主导地位的人形机器人，外交部发言人毛宁7月29日在例行记者会上说，中方一贯坚决反对美方泛化国家安全概念打压中国企业。保护主义提升不了美国的竞争力，只会损害美国企业和消费者的利益。中方将继续采取必要措施，坚定维护中国企业的正当合法权益。（新华社）</p>\n  <p><strong>张小龙卸任粉笔关联公司职务</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，粉笔关联公司北京粉笔蓝天科技有限公司发生工商变更，张小龙卸任法定代表人、经理、董事，由罗成兴接任。该公司成立于2015年2月，注册资本1000万人民币，经营范围包括教育咨询服务、软件开发等，由张小龙、北京粉笔盒子企业管理合伙企业（有限合伙）、魏亮共同持股。据媒体报道，此前，粉笔发布公告称，张小龙将不再担任公司任何职位，即日起生效。</p>\n  <p><strong>SK海力士：AI投资并未明显放缓</strong></p>\n  <p>SK海力士表示，从与客户的实际沟通看，主要云服务厂商仍在提出更多存储芯片供应需求，AI投资并未明显放缓。（中证报）</p>\n  <p><strong>SK海力士跌逾17%，创纪录最大跌幅</strong></p>\n  <p>36氪获悉，截至7月29日中午十二点，韩国KOSPI指数跌幅扩大至11%。SK海力士跌逾17%，创纪录最大跌幅。</p>\n  <p><strong>韩国将召开紧急会议讨论市场形势，此前韩股连续两日触发熔断</strong></p>\n  <p>韩国将于当地时间7月29日晚间召开紧急会议，讨论股市暴跌后的市场形势，跌势已令投资者持仓市值蒸发数十亿美元。韩国议员柳东秀表示，会议将由财政部长具润哲主持，韩国主要金融监管部门负责人都将参加，会议定于当地时间下午6时开始。韩国Kospi指数较6月高点已暴跌约40%。SK海力士公布的业绩弱于预期后，加剧了市场跌势，并引发投资者对人工智能投资热潮的质疑，同时散户抛售加速。此次下跌导致韩国股市连续第二个交易日触发全市场熔断机制。（界面新闻）</p>\n  <p><strong>韩国财政部长：为在未充分审慎评估情况下推出单只股票杠杆型ETF致歉</strong></p>\n  <p>韩国财政部长表示，为在未充分审慎评估情况下推出单只股票杠杆型ETF致歉。韩国股市7月29日再度遭遇重挫，KOSPI指数一度跌超12%，失守5300点，较历史高点累计下跌超43%。存储龙头SK海力士一度跌逾17%，创纪录最大跌幅，较6月历史高点累计下跌57%，市值跌破6300亿美元。（财联社）</p>\n  <p><strong>宝马拟在德国裁员数千人，通过自愿离职计划削减成本</strong></p>\n  <p>据报道，宝马集团计划向德国数千名员工提供自愿离职补偿方案，作为公司削减成本、提升竞争力的一部分。宝马全球计划削减约8000个岗位，其中大部分将来自德国市场。此次自愿离职计划主要面向研发、产品规划及其他企业职能部门员工，生产线工人不在适用范围内。公司还计划在未来几个月精简管理层级。该方案预计10月启动，并持续至2027年。（新浪财经）</p>\n  <p><strong>爱马仕二季度销售增长7%</strong></p>\n  <p>法国奢侈品集团爱马仕近日公布的第二季度业绩显示，该公司当季销售额达41亿欧元，按固定汇率计算同比增长7%，符合市场预期。从区域市场看，除中东地区外，所有市场在截至6月底的三个月内均实现增长。（新浪财经）</p>\n  <p><strong>国产首颗OLED TDDI芯片量产</strong></p>\n  <p>36氪获悉，近日，集创北方自主研发的国内首颗OLED显示触控一体化（TDDI）芯片ICNA3611实现在国内知名品牌主流机型中的规模化量产，标志着中国在高端显示驱动芯片领域完成技术突破与商业化应用的关键跨越，为国产替代与产业链自主可控按下“加速键”。</p>\n  <p><strong>知情人士：市场监管总局将开展光伏行业价格合规指导活动</strong></p>\n  <p>从业内人士处获悉，国家市场监督管理总局价格监督检查和反不正当竞争局定于7月31日开展光伏行业价格合规指导活动，邀请参会单位包括中国光伏行业协会和相关光伏行业企业。此次会议为指导光伏行业加强成本核算，落实《光伏行业成本核算模型通则》，遏制非理性竞争。（财联社）</p>\n  <p><strong>长江存储：网传“核心3D NAND专利全部19项权利要求被裁定无效”系严重误导性描述</strong></p>\n  <p>36氪获悉，长江存储科技有限责任公司7月29日发布声明：一、网传“美国专利商标局于7月28日裁定长江存储核心3D NAND专利全部19项权利要求无效”等信息，系严重误导性描述。二、网传“长存相关概念股全线暴跌”系基于上述误导信息所作的恶意编造，相关描述与事实严重不符。三、2023年11月以来，长江存储在美国发起对美光科技公司的专利侵权诉讼，共涉及27项专利、295项专利权利主张，目前仍在审理中。公司不对正在进行中的诉讼发表评论，相关进展在公开渠道均可查询。四、长江存储始终坚持自主创新，依法合规经营，高度重视知识产权布局与保护。请相关账号及平台立即停止一切失实报道和恶意传播。公司将保留追究相关单位及人员法律责任的权利。（界面新闻）</p>\n  <p><strong>OceanBase回应融资报道：全力投入AI数据创新，与资本市场保持开放沟通</strong></p>\n  <p>36氪获悉，7月29日，针对有关首次外部股权融资的报道，OceanBase回复表示，公司全力投入AI时代的数据技术与产品创新，将持续与资本市场保持开放沟通。对于融资规模、投资机构及具体进展，OceanBase未作进一步回应。此前，媒体报道称，OceanBase正在与投资者洽谈A轮融资，目前已与多家头部投资机构接洽，目标融资规模约20亿至30亿元人民币。知情人士称，此次融资将帮助OceanBase进一步增强独立运营能力，并支持其向AI数据平台领域拓展。</p>\n  <p><strong>扎克伯格：美国不应为了在竞赛中占据优势，而封禁中国AI模型</strong></p>\n  <p>据英国《金融时报》、路透社7月29日报道，美国元公司首席执行官扎克伯格在接受媒体采访时表示，美国不应为了在人工智能（AI）竞赛中占据优势，而封禁中国AI模型。（环球网）</p>\n  <p><strong>美联储宣布维持利率不变</strong></p>\n  <p>当地时间7月29日，美国联邦储备委员会结束为期两天的议息会议，宣布将联邦基金利率目标区间维持在3.5%至3.75%之间不变，这也是美联储今年以来第五次维持利率不变。（央视财经）</p>\n  <p><strong>FAA拟豁免部分规定，加快SpaceX及Blue Origin火箭发射审批</strong></p>\n  <p>美国联邦航空管理局(FAA)提出的新规则，将有利于Elon Musk旗下SpaceX、Jeff Bezos创立的Blue Origin，以及其他火箭发射公司。FAA的新规则将容许该机构豁免部分商业太空牌照及许可证在13项法律下的要求，包括《国家环境政策法》、《濒危物种法》、《清洁水法》及《清洁空气法》的部分条文、《国家历史保护法》及《海洋哺乳动物保护法》。（财联社）</p>\n  <p><strong>诺奖级AlphaFold团队被拆散，DeepMind科研战略迎重大调整</strong></p>\n  <p>最新消息显示，谷歌DeepMind已解散其旗下AlphaFold团队。AlphaFold论文最初作者中的大多数成员在过去一年里已被重新分配岗位。这支团队打造了凭借蛋白质结构预测技术获得诺贝尔奖认可的人工智能（AI）系统，这一调整标志着这家全球顶尖AI研究机构正在重新制定科研战略。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“尧乐科技”完成Pre-A+新一轮融资</strong></p>\n  <p>36氪获悉，柔性触觉感知企业“尧乐科技”近日完成Pre-A+新一轮融资，本轮融资由鼎和高达领投，上市公司常熟汽饰、祖龙娱乐跟投，云道资本担任长期独家财务顾问。资金将主要用于柔性织物传感技术研发、产品性能迭代升级，加快数据手套产能拓展和批量交付，并完善数据采集、标定与接口能力，加速面向具身智能、世界模型与智能座舱等场景落地。</p>\n  <h2>大公司财报</h2>\n  <p><strong>微软第四财季净利润同比增长31%，Azure年收入首超1000亿美元</strong></p>\n  <p>微软公司7月30日发布了截至6月30日的2026财年第四季度及全年财报。财报显示，按照美国通用会计准则（GAAP）计算，微软第四财季总营收为900.07亿美元，较上年同期的764.41亿美元增长18%，按固定汇率计算同比增长17%；净利润为357.66亿美元，较上年同期的272.33亿美元增长31%。（凤凰网科技）</p>\n  <p><strong>Meta第二季度营收608.0亿美元，略高于市场预期</strong></p>\n  <p>Meta第二季度营收608.0亿美元，预估602.4亿美元；每股收益6.18美元，上年同期7.14美元。预计第三财季营收为610亿至640亿美元；分析师预估631.7亿美元。（财联社）</p>\n  <p><strong>保时捷上半年交付量同比下降16.5%，营业利润增至13.48亿欧元</strong></p>\n  <p>7月29日，保时捷公布，2026年上半年销售收入较去年同期从181.57亿欧元下降至172.29亿欧元；营业利润从10.07亿欧元增长至13.48亿欧元；销售回报率为7.8%（去年同期：5.5%），汽车业务EBITDA利润率为18.3%（去年同期：16.0%）；汽车交付量下降16.5%，至122306辆；汽车业务纯电动汽车份额降至19.4%（去年同期：23.5%）。（界面新闻）</p>\n  <p><strong>宝洁第四财季净销售额212亿美元，同比增长2%</strong></p>\n  <p>宝洁公司7月29日公布了截至2026年6月30日的2026财年第四季度及全年财报。在第四财季，公司实现净销售额212亿美元，同比增长2%。受成本及非核心调整等因素影响，第四季度稀释每股收益同比下降15%至1.26美元，核心每股收益下降3%至1.43美元。展望2027财年，宝洁预计全年的销售额与有机销售额增长率将在1%至3%之间，核心每股收益预计在6.89美元至7.11美元区间。（界面新闻）</p>\n  <p><strong>巴斯夫集团第二季度销售额172亿欧元，同比增长16.4%</strong></p>\n  <p>7月29日，巴斯夫集团披露，2026年第二季度销售额为172亿欧元，同比增长16.4%。这主要归因于价格大幅上涨（上涨11.5%）和销量增长（增长7.3%）。价格增长主要由化学品、表面处理技术、材料和工业解决方案业务领域推动。2026年第二季度EBITDA增至20亿欧元，而去年同期为13亿欧元。（界面新闻）</p>\n  <p><strong>福特汽车二季度净亏损13亿美元，营收同比下降4%</strong></p>\n  <p>当地时间7月28日，福特汽车公司公布，2026年第二季度营收为483亿美元，同比下降4%；净利润为负13亿美元，同比下降13亿美元；调整后息税前利润为25亿美元，同比增长4亿美元。该公司将全年调整后息税前利润指引上调至100亿-110亿美元（此前为85亿-105亿美元），调整后自由现金流上调至60亿-70亿美元（此前为50亿-60亿美元）。（界面新闻）</p>\n  <p><strong>瑞银二季度总营收137亿美元超预期，同比增长13%</strong></p>\n  <p>瑞银7月29日公布第二季度总营收137.0亿美元，同比增长13%，预估132.6亿美元；净利润28.0亿美元，同比增长17%，预估24.7亿美元。瑞银宣布启动另一项30亿美元的股票回购计划，计划最迟明年二季度末完成。（界面新闻）</p>\n  <p><strong>Visa三季度调整后净利润63亿美元超预期，同比增加7.9%</strong></p>\n  <p>Visa当地时间7月28日公布三季度净营收116.3亿美元，同比增加14%，预估114亿美元；调整后净利润63.0亿美元，同比增加7.9%，预估61.5亿美元；调整后每股收益3.32美元，上年同期2.98美元，预估3.23美元。（界面新闻）</p>\n  <p><strong>西部矿业：上半年净利润41.69亿元，同比增长123%</strong></p>\n  <p>36氪获悉，西部矿业发布2026年半年度业绩快报，报告期内实现营业收入394.43亿元，同比增长25%；归属于上市公司股东的净利润41.69亿元，同比增长123%。</p>\n  <p><strong>美邦股份：上半年净利润5106.74万元，同比增长41.32%</strong></p>\n  <p>36氪获悉，美邦股份披露半年报，公司上半年实现营业收入5.55亿元，同比增长14.34%；归属于上市公司股东的净利润5106.74万元，同比增长41.32%；基本每股收益0.38元。</p>\n  <p><strong>和我们同龄，却提前告别的人</strong></p>\n  <p>长大后慢慢发现，死亡不再只属于长辈与遥远的年龄。本该一起奔赴成年、打拼生活、慢慢变老的同龄人，有人停在了二十几岁、三十几岁，没能走完往后的人生。</p>\n  <p>中元节临近，我们想收集大家关于同龄人离世所有细碎、真实、无法释怀的回忆。如果你愿意，可以把Ta介绍给我们认识吗？你们有着怎样的故事？还记得你们的最后一面吗？所有的遗憾、错愕与思念，都可以好好说出来，欢迎扫描下方二维码参与我们的征集。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260730/v2_0e50732e5aae414eabb77c249fb5f045@5667365_oswg18985oswg354oswg356_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码参与征集</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-07-29T23:50:17+00:00", "fetched_at": "2026-07-30T01:58:21.184868+00:00", "fingerprint": "6de8f8458a232a87"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜本末科技前合伙人创业做电助力渔轮，获高瓴、启明投资", "url": "https://36kr.com/p/3916820073623171?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，海洋科技消费品公司「蓝色涌现」近日完成数千万人民币天使+轮融资，本轮投资方包括高瓴创投、启明创投、云沐资本，老股东天使投资人高秉强教授、奇绩创坛、松禾创投联创等持续加注，累计融资超5000万人民币，云沐资本担任独家财务顾问。本轮资金将主要用于核心产品的技术研发迭代，以及产品上市后的市场销售渠道搭建。</p>\n  <p>蓝色涌现成立于2024年，首款产品是面向海钓场景的电助力渔轮，产品已在用户内测阶段。</p>\n  <p>相比北美、日本和欧洲等成熟市场，海钓在国内仍处于参与人群与消费市场逐步发展的阶段，但在全球有相当大的市场规模。联合国《第三次世界海洋评估》估算，全球每年约3亿人参与休闲钓鱼，其中约1.21亿人参与海洋休闲钓鱼，相关年支出至少470亿美元。</p>\n  <p>在蓝色涌现创始人兼CEO吴赛尔看来，海洋类的落地场景，虽然技术壁垒深、挑战极大，但具备极高的商业天花板和生态承载力。一旦跨越规模化门槛，海洋能容纳远超陆地的用户体量。</p>\n  <p>对海洋场景的探索，蓝色涌现选择从电助力渔轮切入。渔轮是个相当成熟的品类，不过，吴赛尔认为，传统产品主要解决机械传动和精密制造问题，而现在可以充分迁移机器人技术提升电机、电控和数据能力。</p>\n  <p>渔轮负责放线、收线和控制鱼线张力，是人与鱼直接博弈的核心装备。蓝色涌现在产品设计上，不是让机器替人钓鱼，而是增强人在海上的持久性，以及对抗环境不确定性和大鱼带来的疲劳感。电助力介入耗费体力的环节，同时保留判断、操控和搏鱼过程。</p>\n  <p>吴赛尔告诉36氪：“电助力渔轮会面向两类用户：新手可以获得更平滑的学习曲线；资深钓手则能借助以往渔轮不曾记录的数据复盘和训练。”围绕完整钓程，其产品会加入游戏化交互与记录功能，希望让一次出海形成可回看、可表达的故事。</p>\n  <p>要实现这一产品构想，蓝色涌现团队要完成一系列机器人技术下放到渔轮产品中的场景化改造。</p>\n  <p>第一个难题来自空间。渔轮需要长时间握在手中，其体积和重量不能明显偏离用户熟悉的产品形态，同时还要容纳电机、电控、传动及供电系统，并在高湿、高盐的海洋环境中工作。</p>\n  <p>第二个难题是强人机交互。传统机器人通常更强调机器与机器之间的控制，而渔轮需要连续数小时与人的手直接连接。人的触觉十分敏感，电机输出、力矩变化和控制响应上的细小问题，都会直接影响使用体验。</p>\n  <p>鱼线的柔性进一步增加了控制难度。团队既要解决电机稳定性、力矩放大、减速器设计和重复定位精度等机器人领域的基础问题，也要处理柔性鱼线在受力和运动过程中的不确定性。</p>\n  <p>“我们没有为了技术而技术。”吴赛尔告诉36氪，团队从自身和钓友的真实痛点出发，把资源集中在影响控制、交互和易用性的环节。</p>\n  <p>为了让鱼线更容易穿过导线规这一细微但真实的痛点，蓝色涌现单独设计了一套结构，前后修改十余版；产品右侧的人体工学结构也经过约一年调整，既要方便操作，也要稳定实现预期效果。</p>\n  <p>在渔轮之外，蓝色涌现将AI视为进入海洋的长期能力。海钓涉及何时出海、目标鱼种、天气变化、鱼饵准备和钓点判断等大量决策。鱼群发现也并非只靠单一声呐设备，而是综合地形、气象、船队信息和钓手经验进行推理。蓝色涌现希望未来利用AI梳理这些信息，辅助用户规划钓程。</p>\n  <p>吴赛尔表示，蓝色涌现目前主要在通用大模型平台上进行探索，未来可能结合小规模专业数据集，但具体技术路线尚未成熟。海洋环境受到天气、洋流和波浪等因素影响，现有数据不足，模型预测能力仍然有限。</p>\n  <p>团队方面，吴赛尔曾任本末科技合伙人，长期从事电机相关工作。蓝色涌现核心成员主要拥有大疆RoboMaster及机器人行业背景，也有成员具备美国市场经验。钓鱼是团队共同的爱好，过去两年，团队主要围绕首款渔轮进行研发和内测。</p>\n  <p><strong>CEO对谈</strong></p>\n  <p>硬氪：很多海钓用户享受与大鱼搏斗的过程。加入电助力，会不会反而削弱钓鱼的乐趣？</p>\n  <p>吴赛尔：真正钓大鱼时，即使是非常资深的钓手，也需要船长、船员配合，有时还要开船追鱼。它本来就是一项有团队精神的运动，不是人和鱼之间纯粹的力量对抗。鱼爆发的时候，你要和它比耐力；鱼疲劳的时候，你要和它比爆发，整个过程非常讲究节奏和策略。我们不是替用户把鱼钓上来，而是希望让更多人有一条平滑的学习曲线，同时给资深用户增加新的可能性。机器增强的是人的能力，但判断和故事仍然属于用户。</p>\n  <p>硬氪：公司对海洋科技的设想很大，为什么现阶段只从一款渔轮开始？</p>\n  <p>吴赛尔：我们的愿景其实很简单，就是希望以后去海上钓鱼是一件说走就走、没有太多负担、每个人都能体验的事情。现在真正体验过海钓的人还非常少，但我觉得人生至少值得有一次这样的体验，哪怕晕船也很值得。</p>\n  <p>我们当然想把整个产业的体验闭环，也希望和合作伙伴携手解决天气预测不稳定、晕船这些痛点，但现在还是先从一个切入点开始，一步一步来。</p>", "category": "tech", "published_at": "2026-07-30T01:00:42+00:00", "fetched_at": "2026-07-30T01:58:21.184852+00:00", "fingerprint": "28c50665abeed77a"}, {"source": "少数派", "title": "角落新声｜没有书房，也要给音乐留一个角落：聊聊我的黑胶「窝棚」", "url": "https://sspai.com/post/112715", "summary": "无论处在什么环境里，都别忘记：我们有听音乐的权利。<a href=\"https://sspai.com/post/112715\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-29T03:00:01+00:00", "fetched_at": "2026-07-30T01:58:19.313421+00:00", "fingerprint": "f2bf3ff335f1377c"}, {"source": "少数派", "title": "陕北看海，黄土难寻", "url": "https://sspai.com/post/112761", "summary": targeting China with a new import ban on \"advanced robotic devices\" and power inverters made in foreign countries, as reported earlier by Reuters. In an announcement on Tuesday, the Federal Communications Commission says the ban will include \"mobile\" robots, such as humanoid and quadruped models - but it is not limited [&#8230;]", "category": "tech", "published_at": "2026-07-28T22:37:53+00:00", "fetched_at": "2026-07-29T02:09:14.413672+00:00", "fingerprint": "b1ee046911e8283e"}, {"source": "36氪 - 最新文章", "title": "科氪 | 定义AI睡眠健康新赛道 东莞数字人体与智慧睡眠创新联合体落地慕思", "url": "https://36kr.com/p/3915239611739781?f=rss", "summary": "<p>7月27日，东莞市数字人体与智慧睡眠创新联合体揭牌暨工作推进会在慕思健康睡眠股份有限公司（以下简称“慕思”）总部举行。本次工作推进会由东莞市科学技术局、厚街镇人民政府指导，慕思、广东华中科技大学工业技术研究院联合主办，东莞市相关职能部门、顶尖高校、三甲医疗机构、产业链核心企业、投资机构及主流媒体代表约300人参会。</p>\n  <p>推进会同步举行聘任与授牌仪式，正式聘任中科院院士、华中科技大学副校长尹周平为东莞市数字人体与智慧睡眠创新联合体首席科学家，聘任慕思集团CTO陈文泽为行政总师。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_a3b3238c71314b798e6fc4aaf75b9913@517825446_oswg729268oswg1269oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>伴随AI、传感技术与临床医学的深度迭代，传统睡眠家居已突破单一硬件属性，迈入数字化、医疗级的智慧健康服务新阶段。创新联合体通过搭建家居制造、前沿工科、临床医学、数字算力深度协同的一体化创新平台，为传统家具产业数智化升级、培育制造业新质生产力开辟全新路径，这也是慕思立足东莞世界级家具产业根基，以人工智能赋能传统制造、布局未来生命健康赛道的标志性实践。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_954c694b343c4ae2b7f0e0de8e4d835f@517825446_oswg3741229oswg4000oswg2666_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>六位一体聚势启新，打造“人工智能+生命健康”融合标杆</strong></p>\n  <p>当下，失眠多梦、睡眠质量差等问题普遍存在，隐匿性睡眠慢病威胁大众健康。传统睡眠管理依赖主观判断、事后补救，而AI与大健康产业的深度融合，正推动睡眠管理从被动调理转向主动守护，睡眠健康智能体可依托多维数据监测与智能算法，精准识别睡眠问题、预警健康风险，让专业化睡眠医疗服务下沉至家庭日常场景。慕思集团副董事长姚吉庆在致辞中表示，慕思深耕健康睡眠领域二十余年，已完成从“预见AI”到“成为AI+终端应用”的战略闭环。依托国家级CNAS实验室、百万级人体工学数据模型及百亿级睡眠行为数据、自研潮汐算法与睡眠垂类大模型，实现无感生理监测、AI个性化睡眠干预与分析的产业化。</p>\n  <p>AI、传感科学、人因工程与临床医学的深度融合，正在重构睡眠产业发展模式。在全体嘉宾的共同见证下，东莞市数字人体与智慧睡眠创新联合体正式揭牌。创新联合体由慕思牵头，广东华中科技大学工业技术研究院担任秘书处，思谷智能、科恒、璟博方、华为云等产业链龙头企业共同参与，华中科技大学、北京航空航天大学、中山大学、广东工业大学，以及北京大学第三医院、东莞市人民医院、东莞市妇幼保健院等多家医疗机构提供技术支撑。</p>\n  <p>东莞市科学技术局党组书记<a href=\"http://dgstb.dg.gov.cn/xxgk/zfxxgk/zfxxgkml/zzjg/ldfg/content/post_2154688.html\" rel=\"noopener noreferrer\" target=\"_blank\">钟靖平</a>表示：“该联合体从筹备到组建，很难得的是一直坚持“医学导向”，从真实的医学需求和具体的应用场景出发，不作简单的技术应用和堆叠，而是从真实的临床场景中提炼出具有普遍意义的医学科学问题，再以此为起点，拉通北京大学第三医院、东莞市人民医院、东莞市妇幼保健院等多家顶尖医疗资源深度参与，组织高校、科研院所和企业开展协同攻关。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_63565f8747424a6b82c883a0e3abd8ce@517825446_oswg1128189oswg1264oswg842_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>姚吉庆向大会阐释联合体三大核心任务，一是攻坚睡眠医学与睡眠人因工程两大理论机制，突破睡眠人体建模、无感监测等关键共性技术；二是打造数字人体AI+智慧化研究型病房和多中心全流程数字健康临床验证体系，加速智慧睡眠创新产品的落地推广；三是赋能东莞传统家居产业转型升级，培育产业新业态，打造国民健康新范式，助力健康中国2030战略落地。</p>\n  <p>聘任仪式上，尹周平院士表示：“创新联合体作为新型科研创新机构���契合当前非线性双向创新范式，以企业真实场景需求牵引基础科研突破，是产学研医用深度协同、开展有组织创新的优秀实践。”随后钟靖平书记和肖洪书记共同为北京大学第三医院、东莞市人民医院、东莞市妇幼保健院等多家合作医疗机构集中授牌，正式设立联合体“AI智慧化研究型病房”，打通居家睡眠监测与医院临床诊疗双向通道，完善临床验证与医企协同网络。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_9061e3d3141747e89c6be344d1026d87@517825446_oswg838730oswg1269oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>研发睡眠健康智能体，构建全周期睡眠健康闭环</strong></p>\n  <p>陈文泽向全体参会代表作创新联合体整体建设进展专项汇报。他表示，联合体以推动东莞传统优势产业与未来重点产业深度融合发展为目标，打造国民健康新范式。</p>\n  <p>当前，物理AI和生命健康产业的融合仍面临诸多行业痛点，存在睡眠状态难以全周期动态观测、睡眠专病知识图谱欠缺、睡眠慢病风险预警模型缺位等挑战，联合体规划七大核心子项目，涵盖睡眠医学理论、睡眠人因工程、睡眠监测、睡眠分析、睡眠干预、睡眠大模型、临床评价与示范推广体系，形成“临床医学数据输入—多模态监测设备采集—多类睡眠模型运算—智能寝具硬件落地—临床验证优化—居家睡眠生态服务输出”的完整创新闭环。</p>\n  <p>联合体以智能寝具为载体，集成开发智慧睡眠垂直领域AI大模型，构建数字人体与健康睡眠临床验证平台，打造具备AI决策能力的“健康智能体”，推动健康管理模式从“被动就医”向“主动预警”转变。陈文泽介绍，联合体自主研发睡眠垂类大模型已完成基础知识库与本地部署模型搭建，并落地慕思T12系列产品，实现睡眠报告生成、个性化改善方案推送及智能问答。依托大模型可实现睡眠微环境联动调节，结合实时睡眠监测、语音交互指令，联动慕思T12床垫、电动床、灯光、空调等全屋设备动态优化睡眠环境。在产品研发层面，联合体创新推出AI个体化睡眠支撑系统，从单一静态智能调节进阶为AI人体识别、物理结构定制、动态自适应三重能力叠加，适配用户差异化支撑需求。</p>", "category": "tech", "published_at": "2026-07-28T11:48:20+00:00", "fetched_at": "2026-07-29T02:09:14.166324+00:00", "fingerprint": "7b9645339837c1b6"}, {"source": "36氪 - 最新文章", "title": "36氪研究院 | 2026年中国智能硬件行业发展研究报告", "url": "https://36kr.com/p/3915066350327176?f=rss", "summary": "<p>当前，AI技术正加速向实体经济各领域渗透深化，智能硬件作为AI能力落地实体场景的核心载体，已进入产品能力升级与产业价值提升的关键发展阶段。腾讯研究院2026年3月的调研数据显示，国内已有80.8%的消费者购买或使用过至少一类AI相关硬件产品，其中32.0%的用户表示将在未来三个月增加相关消费支出，消费端市场需求具备稳步向上的支撑基础。与此同时，端侧AI芯片、轻量化大模型、多传感融合等底层技术不断取得突破，推动智能硬件逐步降低对云端算力的依赖，本地自主感知、分析决策与功能迭代的能力持续增强，产业端的数字化赋能效果也得到了较为明显的改善与提升。然而，行业发展仍面临碎片化竞争加剧、供应链成本承压、场景规模化落地不足、数据安全合规要求升级等现实挑战。传统依托硬件参数堆砌、低价代工走量的增长路径，已难以适配AI原生阶段的竞争要求。基于上述行业背景，36氪研究院发布《2026年中国智能硬件行业发展研究报告》，系统梳理行业发展脉络与产业生态格局，拆解产业链上中下游的升级方向，并结合典型企业实践，研判未来技术演进、场景拓展与全球化布局趋势，为行业各方参与者提供多维度的决策参考。</p>\n  <h2><strong>中国智能硬件迈入AI原生发展初期，端侧自主智能正在重构产品核心逻辑</strong></h2>\n  <p>国内智能硬件已完整走完单品智能化阶段，当前正从场景互联向AI原生智能阶段过渡。新一代智能硬件在研发阶段即内嵌本地AI算力单元，可脱离云端自主完成环境感知、多模态交互与动态决策，打破了传统固定联动指令的局限。产品核心竞争力从硬件规格参数转向端侧AI体验，消费端与产业端均围绕本地自主智能能力展开差异化创新，行业整体进入智能范式切换的关键节点。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_180fa232608f4419b8e69a2862a9f76d@12547972_oswg32216oswg1084oswg390_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>全产业链价值格局深度重塑，上中下游协同升级突破增长边界</strong></h2>\n  <p>上游核心元器件向AI定制化、高集成、国产化方向持续迭代，嵌入式系统与AI算法同步完成原生适配，为终端产品筑牢技术底座；中游研发、制造、集成环节沿软硬协同、柔性提效、场景增值主线突破价值洼地，扭转传统制造环节低毛利困境；下游终端向多场景纵深渗透，产业链整体从单一硬件制造向软硬一体化价值运营升级，各环节协同打开产业长期增长空间。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_d2c37a3b0d864b09bb3b1fcbec6861b5@12547972_oswg64836oswg1083oswg543_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_2bd77d0e0cc64d08a388cdd05d0bebc2@12547972_oswg112428oswg1083oswg431_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>消费与产业终端双线扩容，智能机器人成为横跨B/C两端的增长新物种</strong></h2>\n  <p>消费端智能手机、AI PC、智能家居、可穿戴设备加速AI能力下沉，交互体验向无感化、主动式升级，驱动存量市场的替换需求；B端车规级终端、工业制造终端向高算力边缘智能演进，深度支撑产业数字化改造，释放企业级采购增量。智能机器人作为兼具消费与商用属性的新赛道，非人形产品已实现规模化落地，人形机器人迈入放量前夕，成为跨场景拉动行业增长的核心新动力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_8d26d10cab6249b387deb46da420ec7f@12547972_oswg30907oswg1083oswg402_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>出海模式完成价值升维，AI能力构建中国智能硬件全球化竞争新壁垒</strong></h2>\n  <p>中国智能硬件出海跳出传统低价代工的路径依赖，进入“生而全球化”的高质量发展阶段。企业在产品定义阶段即锚定全球市场，以硬件为载体输出本地化AI服务与场景解决方案，前置合规布局并共建海外产业生态，逐步形成海外市场验证反哺国内创新的双向循环，全球竞争优势从成本效率转向技术、生态与服务的复合价值。</p>\n  <p><strong>本报告重点研究问题如下：</strong></p>\n  <p>•&nbsp;推动中国智能硬件行业发展的核心驱动力主要包括哪些？</p>\n  <p>•&nbsp;中国智能硬件行业发展经历了哪些阶段，当前处于哪一阶段？</p>\n  <p>•&nbsp;智能硬件产业链上中下游分别有哪些发展新动向？智能硬件产业链上、中、下游分别由哪些环节构成？</p>\n  <p>•&nbsp;智能硬件市场有哪些主要参与主体？各类主体分别具备哪些竞争优势与能力短板？</p>\n  <p>•&nbsp;智能硬件行业有哪些代表性企业？其发展路径对行业同类企业有何借鉴意义？</p>\n  <p>•&nbsp;AI原生发展阶段下，智能硬件行业面临核心挑战有哪些？行业应如何平衡技术创新与合规风险？</p>\n  <p>•&nbsp;未来三到五年，中国智能硬件行业将呈现哪些技术、场景、市场等哪些发展趋势？</p>\n  <p>&nbsp;</p>\n  <p>更多精彩内容，详见《2026年中国智能硬件行业发展研究报告》，点击<a href=\"https://pan.baidu.com/s/1y7of0b9L35dVXhwQbGb90g?pwd=wptf\" rel=\"noopener noreferrer\" target=\"_blank\">下载链接</a>，提取码：wptf</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_3487074ec56d4274bea71edae16cad3f@12547972_oswg2084704oswg1190oswg1683_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_2cb7bdc98bc349a4a7582097e7157dd0@12547972_oswg509336oswg1190oswg1683_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_7c21347a9ba044708b637470ec27246d@12547972_oswg138684oswg1190oswg1683_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrappe 6krcdn.com/hsossms/20260728/v2_78ee7c951a8e485cb0cc3a8ef8dcf798@12547972_oswg126080oswg1190oswg1683_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-07-28T23:30:00+00:00", "fetched_at": "2026-07-29T02:09:14.166318+00:00", "fingerprint": "3a067c99dee4cc9d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨韩国考虑为“借钱炒股”封顶20%；雷军打新长鑫科技浮盈7亿？小米高管回应；月之暗面Kimi K3正式开源", "url": "https://36kr.com/p/3915953688604296?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>李宁此前起诉多个网络账号名誉侵权案，已取得胜诉判决</li>\n   <li>小米已注册澎程关联商标</li>\n   <li>泡泡玛特城市乐园涨价</li>\n   <li>英伟达据悉签署价值高达500亿美元的得州数据中心租赁协议</li>\n   <li>“抱抱脸”向OpenAI索赔1亿美元算力</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>韩国考虑为“借钱炒股”封顶20%</strong></p>\n  <p>韩国KOSPI指数尾盘扩大跌幅，日内大跌11%，自4月14日以来首次跌破6000点，较6月峰值跌超30%。据韩国《中央日报》中文网28日报道，韩国金融监管当局决定，若单一股票杠杆产品投资过热未能平息，将引入个人投资上限等追加监管措施。目前正在重点研究将个股杠杆投资额限制在全部金融投资产品投资额20%以内的方案。韩国官方此前披露的统计数据显示，截至7月13日，7月累积强制平仓规模达到3442亿韩元(约合人民币15.7亿元)，超120万个杠杆散户账户触及保证金追缴线，其中约32万至36万个账户已经被券商全额强制平仓，部分账户甚至出现倒欠券商资金情况。（中新经纬）</p>\n  <p><strong>雷军打新长鑫科技浮盈7亿？小米高管回应。</strong></p>\n  <p>7月27日，长鑫科技集团股份有限公司正式登陆科创板，上市首日股价大涨，收盘涨幅达465.82%，市值升至3.28万亿元，成为A股市值最高公司。根据长鑫科技此前公告，武汉一家参与长鑫科技战略配售，获配股数为1824.48万股。按发行价8.66元/股计算，该公司上市首日获利7.36亿元。这家公司为武汉壹捌壹零企业管理有限公司，成立于2021年，办公地址位于武汉东湖高新区。</p>\n  <p>值得注意的是，武汉壹捌壹零企业管理有限公司是小米科技全资子公司，根据股权信息显示，小米科技的董事长是雷军，雷军持有小米科技97.48%的股份。</p>\n  <p>7月28日，小米集团董事长特别助理、战略市场部副总经理徐洁云对此回应称，“朋友们看个乐呵就行，别当真。其实不能这么算，这是个公司投资行为，具体子公司实体跟个人财富没法混成一谈，另，顺便再次祝福长鑫。”（澎湃新闻）</p>\n  <p><strong>月之暗面Kimi K3正式开源</strong></p>\n  <p>36氪获悉，7月27日晚，月之暗面发布Kimi K3的模型权重、技术报告，并开源支撑Kimi K3模型训练的关键Infra技术：MoonEP、FlashKDA和AgentEnv。据介绍，Kimi K3是一个拥有2.8万亿参数的混合专家（MoE）模型，具备原生视觉理解能力，并支持100万token的上下文窗口。月之暗面表示，现在每个人都可以下载并部署Kimi K3模型，无论是用于内部研发，还是嵌入到面向终端用户的产品中，均可自由使用。</p>\n  <p>7月28日，伴随月之暗面开源Kimi K3模型，国家超算互联网AI社区正式上线相关模型及API调用服务。企业和开发者通过API一键调用，快速下载Kimi K3模型文件并进行部署开发，即可使用2.8万亿参数开源大模型能力。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>灵光App上线“一键部署”</strong></p>\n  <p>36氪获悉，近日，灵光App上线闪应用“一键部署”功能，并向所有用户开放。用户使用Codex、Claude Code、Cursor、Qoder、Trae、Workbuddy等AI工具创建的应用，可通过灵光提供的部署Skill，一键发布为“灵光闪应用”，并同步在PC端和灵光App内展示与分发。同时，灵光还开放了包括大模型、搜索、LBS、地图、存储等在内的30余项免费API能力。</p>\n  <p><strong>中国启动人工智能大模型IPv6能力提升专项行动</strong></p>\n  <p>记者7月28日从雄安新区了解到，“人工智能大模型IPv6能力提升专项行动”由中央网信办联合北京、上海、浙江、深圳四地网信办，会同5家头部大模型企业在雄安新区共同启动，推动生成式大模型应用，全面支持IPv6，为智能时代筑牢网络根基。7月28日还正式启动了雄安新区IPv6单栈部署行动。雄安新区将全面推进单栈IPv6部署，从夯基础、广赋能、强攻关、育生态四个维度协同发力，到2030年新建片区将全面实现IPv6单栈规模化运行。（央视新闻）</p>\n  <p><strong>微软AI发布网络安全模型MAI-Cyber-1-Flash，漏洞检测性能提升并降低50%成本</strong></p>\n  <p>微软AI（Microsoft AI）当地时间7月27日发布首款网络安全专用模型MAI-Cyber-1-Flash，并将其集成至多智能体漏洞识别与修复平台MDASH。微软表示，该组合在CyberGym漏洞检测基准测试中取得95.95%的成绩，超过Mythos、Gemini和GPT系列模型，同时相比现有MDASH方案降低约50%成本。微软同时推出智能体安全系统Perception，用于持续监控、修补漏洞并应对新型威胁。（界面新闻）</p>\n  <p><strong>亚马逊云服务与AI公司Recursive签署价值4.1亿美元多年期合作协议</strong></p>\n  <p>7月28日，亚马逊云服务（AWS）宣布与人工智能公司Recursive达成一项价值4.1亿美元的多年期协议。Recursive将指定AWS作为其云服务提供商，并在亚马逊云服务平台上运行其自动化AI研究系统。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美股三大指数收盘涨跌不一，热门中概股多数上涨</strong></p>\n  <p>36氪获悉，7月28日收盘，美股三大指数涨跌不一，道指涨1.03%，标普500指数涨0.21%，纳指跌0.22%。大型科技股涨跌不一，奈飞、谷歌涨超2%，微软涨超1%，苹果、英伟达小幅上涨；英特尔跌超5%，特斯拉、亚马逊、Meta小幅下跌。热门中概股多数上涨，理想汽车涨超4%，网易、京东、腾讯音乐涨超2%，微博、蔚来、拼多多涨超1%；富途控股、老虎证券跌超2%。</p>\n  <p><strong>长鑫科技最大国有投资人发声</strong></p>\n  <p>7月27日，国产存储龙头——长鑫科技集团股份有限公司（简称“长鑫科技”）正式登陆上交所科创板。截至当天收盘，长鑫科技报49.00元/股，上涨超过465%，成交额超1400亿元，创A股单日成交额历史新高，总市值约3.28万亿元，超越工商银行登顶A股“股王”。27日晚间，长鑫科技的创始股东和最大国有投资人——合肥产投集团发文表示祝贺。</p>\n  <p>合肥产投集团介绍，2016年，在合肥市委、市政府决策部署下，集团投资长鑫科技。10年来，集团连续重仓投资长鑫项目，陪伴其穿越行业周期，走过了一段矢志创新的奋进之路。（第一财经）</p>\n  <p><strong>长鑫科技，将被纳入MSCI中国全股票指数</strong></p>\n  <p>7月28日晚，明晟公司（MSCI）公告称，长鑫科技因IPO新股上市，将被纳入MSCI中国全股票指数，于8月10日正式生效。（第一财经）</p>\n  <p><strong>个税收入达9000亿元，高收入群体缴税占绝大多数</strong></p>\n  <p>“十五五”规划纲要提出，增加低收入群体收入，提高中等收入群体比重，推动形成橄榄型分配格局。2026年7月28日，国务院新闻办新闻发布会上，国家税务总局总审计师王世宇介绍，从上半年收入和6月30日第七次个税综合所得年度汇算的情况看，个税调节收入分配的效应持续显现。</p>\n  <p>个人所得税是优化收入再分配、促进社会公平的重要工具。王世宇介绍，汇算数据显示，个税收入达9000亿元，高收入群体缴税占绝大多数。今年上半年，税务部门征收的个人所得税同比增长约13%，成为中国第三大税种。（界面新闻）</p>\n  <p><strong>小米已注册澎程关联商标</strong></p>\n  <p>36氪获悉，近日，小米展出了一辆小米澎程测试车，目前该车已经路测行驶近6万6千公里。天眼查知识产权信息显示，小米科技有限责任公司已申请注册多枚“SKYNOMAD”“澎程”商标，国际分类涉及运输工具、机械设备、通讯服务等，目前部分商标已成功注册。</p>\n  <p><strong>叮咚买菜：截至2026年6月，自有品牌渗透率达68.5%</strong></p>\n  <p>36氪获悉，叮咚买菜披露旗下品牌叮咚V5升级后的首份数据：截至2026年6月，自有品牌渗透率达68.5%，非生鲜自有品牌GMV占比超35%。其中叮咚V5拥有200余支SKU，在规模不变的情况下，GMV同比增长50%。</p>\n  <p><strong>李宁此前起诉多个网络账号名誉侵权案，已取得胜诉判决</strong></p>\n  <p>7月28日，李宁（中国）体育用品有限公司发布《关于名誉侵权案胜诉的声明》。声明称，就此前起诉多个网络账号名誉侵权案，该公司已取得胜诉判决。法院依法判令被告承担相应法律责任并赔偿损失。</p>\n  <p>2025年5月，李宁公司发布律师声明称，多名网络用户在互联网平台上捏造和散播诸如“捧高踩低”“势利眼”等不实言论，虚构和煽动“退货”及由此带来的“股价暴跌”等恶意话题。对此，该公司表示已完成取证，并采取法律手段，追究相关侵权行为人的法律责任，坚决捍卫自身合法权益。（第一财经）</p>\n  <p><strong>国家药监局明确：服用感冒灵期间不得开车</strong></p>\n  <p>近日，国家药监局发布公告，根据药品不良反应评估结果，为进一步保障公众用药安全，决定对感冒灵口服制剂（颗粒、胶囊、片、茶）说明书实施统一修订，集中完善警示语、禁忌、不良反应、注意事项等四大核心板块。本次修订强调：服药期间不得驾驶机、车、船、从事高空作业、机械作业及操作精密仪器等。这意味着，吃完感冒灵不能开车了！</p>\n  <p>就上述修订影响等问题，部分头部感冒灵生产企业均表示暂不接受采访。某连锁药店负责人告诉记者，本次国家药监局修订感冒灵说明书不会对终端感冒药销售造成明显影响。该类药品仅短期季节性按需服用，区别于慢性病长期用药，且市场存在无嗜睡副作用的替代感冒药，能满足司机、特殊作业人群需求，消费分流幅度可控。（第一财经）</p>\n  <p><strong>泡泡玛特城市乐园涨价</strong></p>\n  <p>7月28日，泡泡玛特城市乐园小程序发布公告，7月30日起完成升级的奇遇森林区域将全面对外开放。伴随园区游乐设备、演艺内容与沉浸式场景的全面扩容，乐园也将启用全新阶梯式门票定价体系，这是继今年4月30日部分新片区开放后的第二次票价调整。据公告，新版门票价格方案票价划分为平日、高峰日、特定高峰期三档，同时区分入园观光票、标准游乐票、含嘉年华次数套票三类产品，覆盖不同游客需求。具体定价显示，标准乐园游乐票平日178元/人、周末及常规节假日高峰日208元/人，暑期、国庆等特定高峰期238元/人；包含3次嘉年华游戏的组合套票对应价格分别为228元、258元、288元；仅用于入园拍照打卡、不包含大型游乐设备的观光票，平日售价98元，高峰日与特定高峰期统一为128元/人。（界面新闻）</p>\n  <p><strong>AI短剧上线安徽卫视引争议</strong></p>\n  <p>近日，AI短剧《桃花潭记》上线安徽卫视，画面明确标注“AI制作”。有人惊呼安徽卫视很超前，也有观众吐槽人物表情僵硬，观感缺少人情味。据悉，《桃花潭记》是国内首部全AI流程制作的非遗题材中剧。全剧共20集，单集时长约10分钟，播出时片头明确标注了 “AI制作”及“AIGC导演” 字样。（蓝鲸新闻）</p>\n  <p><strong>财政部、税务总局：9月1日起对部分企业土地免征城镇土地使用税</strong></p>\n  <p>36氪获悉，财政部、税务总局两部门公告，自2026年9月1日起，对企业自有或通过承租、无偿使用等方式取得并用于下列用途的土地，免征城镇土地使用税。包括石油天然气（含页岩气、煤层气）生产企业在工矿区内的消防、防洪排涝、防风、防沙设施用地，厂区（含生产、办公、生活区）以外的铁路专用线、公路用地； 油气长输管道线路用地及施工临时用地； 供电企业的输电线路（含杆塔基础）用地及其施工临时用地等。</p>\n  <p><strong>《功夫女足》总票房突破20亿，暂列2026年度票房榜第二</strong></p>\n  <p>36氪获悉，据灯塔专业版，截至7月28日，《功夫女足》总票房（含预售）突破20亿，暂列2026年度票房榜第二。</p>\n  <p><strong>上半年税务部门累计征收税费收入16.7万亿元</strong></p>\n  <p>7月28日上午，国务院新闻办举行新闻发布会。国家税务总局相关负责人介绍，今年上半年，税务部门累计征收税费收入16.7万亿元。其中，税收收入超过10万亿元，同比增长4.9%。这主要得益于经济运行总体平稳向好，与税收收入密切相关的PPI持续回升，以及部分新兴领域和重点行业发展势头强劲。同时，社会保险费收入完成4.5万亿元，非税收入完成1.8万亿元，国家的财力保障不断夯实。（央视新闻）</p>\n  <p><strong>英伟达据悉签署价值高达500亿美元的得州数据中心租赁协议</strong></p>\n  <p>7月28日，据报道，英伟达与数据中心开发商Hut8签署了租赁承诺，计划在得克萨斯州租赁一座容量达1吉瓦（GW）的超大型数据中心，总租金规模最高可达500亿美元。交易的核心细节显示，初始15年的租赁合同价值约196亿美元；若包含后续30年的续约选项，总价值将升至500亿美元。（界面新闻）</p>\n  <p><strong>百度香港主要上市转换再提速，8月26日将召开股东特别大会</strong></p>\n  <p>36氪获悉，7月28日，百度集团发布通函，披露公司拟于8月26日召开股东特别大会，审议与自愿转换为香港联交所主要上市相关的授权及配套决议案。此前，百度已于7月16日公告推进在香港联交所主板自愿转换为主要上市，并于7月22日获香港联交所确认收悉申请。此次披露股东特别大会安排，意味着百度香港主要上市转换流程在两周内连续推进三步，进展明显提速。</p>\n  <p><strong>国际油价“急刹车”，国内能化期货显著“降温”</strong></p>\n  <p>上周还在一路猛冲的国际原油价格，7月27日突然踩下“急刹车”，布伦特原油期货、NYMEX WTI原油期货合约日内跌幅一度均超过7%。与此同时，当日国内能源化工期货普遍下跌，其中原油、燃料油期货主力合约跌幅均超过8%。业内人士认为，本轮国际油价快速下跌主要是因为美伊局势释放缓和信号，市场此前计入油价的地缘风险溢价集中回吐，多头资金随之获利离场。展望后市，地缘局势仍存在反复的可能，全球原油低库存也对油价形成支撑，但高油价对需求的抑制作用等也不容忽视。短期来看，国际油价或进入高位宽幅震荡阶段。（中证报）</p>\n  <p><strong>苹果公司在美国推出设备升级租赁计划，iPhone每月租金17.99美元起</strong></p>\n  <p>苹果公司在美国推出设备升级租赁计划，iPhone每月租金17.99美元起，AppleWatch每月租金11.99美元起。iPhone/Watch可享受12-24个月租赁，Mac/iPad可享受24-36个月租赁。（财联社）</p>\n  <p><strong>“抱抱脸”向OpenAI索赔1亿美元算力</strong></p>\n  <p>日前，俗称“抱抱脸”的人工智能开源社区，遭遇OpenAI智能体入侵。当地时间26日，“抱抱脸”联合创始人兼首席执行官向OpenAI 提出两项要求，一是公开智能体全部轨迹，二是将1亿美元算力用于支持开源社区。该事件也为AI行业安全敲响警钟。本月21日，OpenAI承认，旗下一款智能体在内部测试中“失控”，突破了隔离环境，自主入侵了人工智能开源社区“抱抱脸”。这起事件最终不得不以求助中国开源模型，才得以化解危机。（央视财经）</p>\n  <p><strong>YouTube与NBC环球达成合作协议，将为美用户提供流媒体捆绑服务</strong></p>\n  <p>7月27日，美国流媒体平台YouTube与媒体巨头NBC环球（NBCUniversal）宣布深化战略合作。根据双方达成的协议，自2027年初起，美国本土的YouTube Premium订阅用户将无需支付额外费用，直接获取NBC环球旗下流媒体平台Peacock Premium的会员权益。（新浪财经）</p>\n  <p><strong>Anthropic：从未主张禁止开放权重模型</strong></p>\n  <p>Anthropic首席执行官达里奥·阿莫代伊当地时间7月27日发表文章称，Anthropic从未主张全面禁止开放权重AI模型。他表示，具备一定安全性的开放权重模型能够扩大AI技术获取范围，为企业、开发者和研究人员提供价值，但应通过针对性监管降低潜在风险。对于此前多家科技企业支持开放权重模型的公开信，阿莫代伊表示赞同开放模型能够扩大AI经济参与度、促进竞争并增强用户控制，但不同意“开放模型必然更容易建立安全防护”的观点。他认为，开放权重模型一旦发布，开发者将难以撤回或控制其使用方式，相关风险应通过严格测试而非预设判断来评估。（界面新闻）</p>\n  <p><strong>《财富》世界500强第一易主</strong></p>\n  <p>今年《财富》世界500强排行榜上，亚马逊成为全球最大公司，终结了沃尔玛连续十二年的领跑纪录。沃尔玛位列第二。中国的国家电网有限公司继续位列第三。排在第四和第五位的分别是联合健康集团和沙特阿美公司。（第一财经）</p>\n  <p><strong>苹果拟大举发力智能家居，以Siri AI为核心推出新品</strong></p>\n  <p>在智能家居市场长期处于追赶者地位之后，苹果公司正准备发起新一轮大举进军，推出一系列全新硬件和软件产品。据报道，苹果计划很快拉开这轮智能家居产品攻势的序幕，率先推出一款以全新Siri人工智能助手为核心的家庭中枢设备。此外，知情人士称，苹果还准备发布新一代Apple TV机顶盒以及升级版HomePod mini。知情人士表示，这三款产品均已接近推出。其中，新款Apple TV和HomePod mini计划于今年秋季发布，而家庭中枢设备预计将在今年10月至明年年初之间推出。（财联社）</p>\n  <p><strong>寒武纪：拟推500万股限制性股票激励计划</strong></p>\n  <p>36氪获悉，寒武纪7月28日发布2026年限制性股票激励计划（草案），拟向激励对象授予500万股限制性股票，占公司总股本的0.80%。本激励计划首次授予部分涉及的激励对象共计945人，约占公司全部职工人数1107人（截至2025年12月31日）的85.37%。激励计划限制性股票的授予价格（含预留授予）为每股750元。此次激励计划针对不同激励对象设置了差异化的业绩考核要求。第一类激励对象考核年度为2026—2028年三个会计年度，业绩考核目标为：2026年营业收入不低于135亿元，2026—2027年累计营业收入不低于405亿元，2026—2028年累计营业收入不低于1000亿元。第二类激励对象及第三类激励对象考核年度为2027—2028年两个会计年度。第三类激励对象额外设置了以2025年扣除股份支付影响后的净利润为基数，2027年净利润增长率不低于300%、2028年不低于500%的考核指标。</p>\n  <h2>上市进行时</h2>\n  <p><strong>中国机器人制造商跨维智能据悉正考虑在香港上市</strong></p>\n  <p>中国机器人制造商跨维智能据悉正考虑在香港上市。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>SK海力士第二季度营业利润同比增长557.2%</strong></p>\n  <p>7月29日，SK海力士公布，2026财年第二季度销售额为79.3万亿韩元，环比增长50.9%，同比增长256.8%；营业利润为60.5万亿韩元，环比增长61.0%，同比增长557.2%。（界面新闻）</p>\n  <p><strong>联合利华上半年营收256亿欧元，基础销售额增长4.8%</strong></p>\n  <p>联合利华（Unilever）7月28日公布2026年上半年业绩，实现基础销售额增长4.8%，其中销量增长4.2%，价格增长0.6%。公司表示，第二季度基础销售额增长5.8%，销量增长5.5%，增长势头较第一季度加快。上半年，联合利华营业额为256亿欧元，同比增长0.5%。基础营业利润为52亿欧元，同比增长0.9%，基础营业利润率为20.3%，同比提升10个基点。基础每股收益增长2.4%至1.61欧元，摊薄后每股收益下降2.5%至1.38欧元。公司自由现金流达到15亿欧元。（界面新闻）</p>\n  <p><strong>梅赛德斯-奔驰集团第二季度销售额320.6亿欧元</strong></p>\n  <p>梅赛德斯-奔驰集团第二季度销售额320.6亿欧元，预估321.3亿欧元；第二季度调整后EBIT 23亿欧元，预估17.2亿欧元。（财联社）</p>\n  <p><strong>飞利浦二季度销售增长4%，上调利润和现金流预期</strong></p>\n  <p>当地时间7月27日，飞利浦公布2026年第二季度业绩，集团销售额达44亿欧元，同比增长4%（可比口径）。受美国关税退款影响，公司营业利润升至6.09亿欧元，调整后EBITA利润率提升至16.4%；自由现金流达2.22亿欧元。飞利浦重申全年销售增长预期，并将调整后EBITA利润率预期由此前的12.5%-13.0%上调至13.5%-14.0%，自由现金流预期提高至15亿至17亿欧元。（界面新闻）</p>\n  <p><strong>LVMH 2026上半年实现营收386.44亿欧元</strong></p>\n  <p>法国奢侈品巨头路威酩轩（LVMH）当地时间7月27日发布2026财年上半年业绩报告显示，上半年实现总营收386.44亿欧元（有机增长2%），经常性业务利润达86.91亿欧元，营业利润率维持在22.5%的高位，净利润为56.97亿欧元，自由现金流同比增长2%至41.00亿欧元。（界面新闻）</p>\n  <p><strong>金山办公：预计2026年半年度净利润同比增长209.98%-263.89%</strong></p>\n  <p>36氪获悉，金山办公公告，预计2026年半年度实现营业收入32.14亿元-34.13亿元，同比增长20.95%-28.43%；归属于母公司所有者的净利润23.16亿元-27.19亿元，同比增长209.98%-263.89%；扣除非经常性损益的净利润22.88亿元-26.86亿元，同比增长214.63%-269.35%。业绩增长主要因公司持续推进AI能力与办公场景深度融合，前期研发投入转化为产品竞争优势和商业化成果，部分对外投资基金项目实现较好投资回报。</p>\n  <h2>投融资</h2>\n  <p><strong>“昌郁医药”完成2.5亿元D轮融资</strong></p>\n  <p>36氪获悉，据启点资本消息，“昌郁医药”宣布完成2.5亿元人民币D轮融资。本轮融资由倚锋资本、高特佳投资联合领投，另有嘉兴远帆、Real Capital Global等机构共同参与。启点资本连续担任财务顾问。本轮融资资金将主要用于昌郁医药首发产品XG005在美国开展Ⅲ期急性疼痛临床研究，并支持公司核心产品管线的持续开发及全球化推进。</p>\n  <p><strong>“国科超导”完成超亿元融资</strong></p>\n  <p>36氪获悉，近日，“国科超导”完成超亿元新一轮融资。本轮融资由国科创投领投，中关村资本、顺禧基金、鼎峰、水木清华校友种子基金等老股东持续追加，东恒石油、北京科创亦庄直投基金、东方证券、中科神光、中赢创投、纳珍投资等多家机构共同参与。本轮融资资金将重点用于铁基高温超导材料的性能攻关、中试线建设与产能爬坡、下游应用场景的验证拓展，以及核心岗位人才梯队扩充。</p>\n  <p><strong>“德塔智能”完成近5亿元天使++轮融资</strong></p>\n  <p>36氪获悉，人形机器人基础模型公司“德塔智能”近日完成近5亿元天使++轮融资，本轮投资方包括多家上市公司产业方和财务投资机构。资金将主要用于人形机器人基础模型持续迭代，加快自研数采设备的量产与数据闭环建设，扩充核心研发团队，以推动技术在真实工业场景中的工程化落地与验证。</p>\n  <p><strong>“TabTin”完成6000万元天使轮融资</strong></p>\n  <p>36氪获悉，近日，上海摹范科技有限公司旗下的人和Agent协作平台“TabTin”完成6000万元天使轮融资，由字节跳动早期天使投资人领投，源洋资本担任独家财务顾问。本轮资金将用于深化人机协作体验、完善原生工作应用并拓展企业客户。</p>\n  <h2>酷产品</h2>\n  <p><strong>极氪9X五座版正式上市</strong></p>\n  <p>36氪获悉，7月28日，极氪9X五座版正式上市。新车推出Ultra版、Hyper版、曜黑版3个版型，权益后限时售价45.19万元起。</p>\n  <p><strong>比亚迪：人形机器人计划八月发布</strong></p>\n  <p>针对人形机器人目前进展情况，比亚迪官方回应称，计划八月在“迪空间”亮相发布。此前比亚迪曾在“迪空间”发布一张人形机器人宣传海报，海报称“八月初，有个新朋友，想来认识你”。 （财联社）</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-07-28T23:54:15+00:00", "fetched_at": "2026-07-29T02:09:14.166312+00:00", "fingerprint": "bddaef5d9c8403e5"}, {"source": "36氪 - 最新文章", "title": "自研SNN类脑芯片、做医疗设备的“上游大脑”，「米能科技」获数千万元融资｜36氪首发", "url": "https://36kr.com/p/3878652674715905?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪独家获悉，近期，前沿生理类脑芯片企业米能科技完成数千万元股权融资，本轮由蓝湾资本、锡创投联合投资。本次募资将全部投入医疗级标准化模组量产迭代、全链路闭环生理调控系统工程落地，以及全国医疗设备厂商规模化生态导入进程。</p>\n  <p>米能科技相关负责人观察到，当前，全球医疗硬件产业正迎来“底层技术范式变革”。“传统MCU+ANN（微控制器+人工神经网络）通用算力方案，诞生于图像、文本离散数据场景，较难适配人体连续、微弱、高噪声生理时序信号。而长期可穿戴、闭环神经干预、居家慢病全周期管理等前沿赛道始终存在功耗、延迟、安全三重底层瓶颈。市场需要一套原生适配人体��理特征、符合医疗器械全流程合规的一体化底层平���。”</p>\n  <p>基于此，米能科技选择聚焦医疗设备上游底层算力基础设施研发，已打造“生理感知—事件计算—安全调控”全闭环原生软硬件平台。公司自研从模拟信号采集、脉冲事件编码、类脑稀疏计算到硬件级安全干预的整套底层技术，不涉足终端整机制造，为各类医疗设备厂商输出可快速集成、适配临床规范的标准化底层能力包。<strong> 2025年，这个模式已产生规模化营收。</strong></p>\n  <p>米能科技相关负责人介绍称，当前，行业主流传统算力主要采用“固定窗口、持续全量采样计算”模式，无论人体信号有无异常，芯片均不间断完整运算，因此会产生无效算力损耗，带来续航缩水、设备发热、干预响应滞后等问题。</p>\n  <p>米能科技自研数模混合脉冲神经网络（SNN）类脑内核，复刻人脑神经异步工作逻辑，是“面向时序生理信号的下一代原生计算架构”。</p>\n  <p>该平台内置专属生理脉冲编码机制，仅在（脑电图）、ECG（心电图）、EMG（肌电图）等生理波形出现特征突变、产生有效事件时才唤醒算力单元；无异常体征状态下芯片自动进入深度超低功耗休眠态，实现设备7×24小时不间断在线监护，从硬件架构根源解决长期穿戴设备功耗痛点。</p>\n  <p>这种设计与当前医疗器械行业的发展趋势相契合。过去，行业重心集中在手术、影像设备，针对确诊疾病进行短期治疗。但当前，市场需求也在向慢性病、精神类疾病、老年病等需要长期院内外联合管理的场景延展，这类病症需要居家、院内持续监测，可穿戴医疗设备逐渐成为刚需。</p>\n  <p>“依托原生事件驱动设计，我们的产品在端侧实时事件识别、微弱信号响应延迟两大维度具备一定技术优势，有助于匹配居家慢病长效监测、无创脑机交互、康复闭环调控等场景的需求。”该负责人表示。</p>\n  <p>据介绍，米能科技的整套类脑计算内核配套专属生理算法库、硬件安全防护逻辑，并非通用开源算法二次改造，具备完整底层知识产权壁垒。</p>\n  <p>当前，整套平台由三层自研硬件体系构成，形成完整生理信号处理闭环，各层级软硬件协同优化，无第三方通用器件适配损耗：首先是多模态生理感知阵列，它适配干/半干电极复杂佩戴环境，可捕捉微弱体表生物电、光学体征连续波形，完成高精度模数标准化转换，兼容多类人体生理信号同步采集；其次是事件驱动类脑计算内核，这也是平台的核心技术载体，可实现低功耗生理事件筛选、人体状态分层评估，输出可用于干预的标准化事件指令。</p>\n  <p>此外，最后一层是医疗级可编程调控单元，内置多层硬件安全防火墙，所有干预输出均经过硬件级规则校验，规避算法黑盒风险，当前优先落地临床认可度最高的电生理干预模式，长期布局多模态无创调控技术管线。</p>\n  <p>“三层硬件配套统一开发工具链、标准化测试数据集和全流程安全管控规则，厂商无需多厂商联调，可直接嵌入自有医疗终端，大幅缩短整机研发与注册周期。”前述负责人表示。</p>\n  <p>商业化层面，针对医疗行业客户“研发能力分层明显的特征”，比如部分头部企业具备完整研发团队，仅需采购芯片用于设备升级、成本优化；而大量临床医生等职业出身的初创团队，更擅于发现临床需求，缺少硬件研发、医疗器械注册、供应链管控能力，对完整解决方案的需求更强。</p>\n  <p>对此，米能科技搭建覆盖芯片、模组、开发套件、联合调试、注册支撑的五级阶梯交付体系，覆盖产业全类型参与者：其中，L1是纯底层硬件供应，面向具备完整自研能力头部医疗企业；L2为标准化硬件模组交付，提供预联调成熟信号链路；L3为模组+全套开发SDK与临床参考设计，适配中型设备厂商；L4包含软硬件联合工程调试，提供定制化算法适配服务；L5提供医疗器械注册全套技术文档与小批量量产支撑，赋能临床出身初创团队。</p>\n  <p>当前，米能科技的客户覆盖居家消费医疗、专业康复、神经医学设备多类厂商，不同层级交付方案可灵活匹配客户落地节奏，形成分层商业矩阵。</p>\n  <p>“我们采用‘消费医疗提速、严肃医疗筑墙’的双轨商业化战略，因为消费健康赛道标准化模组落地周期短，可快速规模化导入，产生稳定现金流，验证底层平台通用性；严肃神经医疗赛道技术壁垒深厚、产品附加值更高，依托三甲医疗机构联合工程样机开展临床验证，多条慢病干预管线已进入伦理评估前置阶段，远期成长空间广阔。”米能科技相关负责人表示。&nbsp;</p>\n  <p>现阶段，米能科技已落地睡眠自主神经调节、运动康复、慢性疼痛居家干预多条成熟管线，与多家三甲医疗机构共建生理闭环验证体系，持续迭代适配临床真实场景的底层算法与硬件方案。远期技术版图将延伸至脑科学科研设备、多类身心慢性病长效无创干预前沿赛道，不断拓宽生理事件计算技术的产业边界。</p>", "category": "tech", "published_at": "2026-07-29T00:15:00+00:00", "fetched_at": "2026-07-29T02:09:14.166303+00:00", "fingerprint": "12545aacc1ac84df"}, {"source": "36氪 - 最新文章", "title": "柔性触觉感知企业获新一轮融资，预计2026年公司营收翻10倍｜硬氪首发", "url": "https://36kr.com/p/3915175290901889?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，柔性触觉感知企业「尧乐科技」近日完成Pre-A+新一轮融资，本轮融资由鼎和高达领投，上市公司常熟汽饰、祖龙娱乐跟投，云道资本担任长期独家财务顾问。资金将主要用于柔性织物传感技术研发、产品性能迭代升级，加快数据手套产能拓展和批量交付，并完善数据采集、标定与接口能力，加速面向具身智能、世界模型与智能座舱等场景落地。</p>\n  <p>尧乐科技以柔性织物传感为硬件入口，面向具身智能与世界模型所需的真实物理交互数据采集与预处理。创始人兼CEO吕莉蕴曾任国际汽车电子头部企业Harman首席架构工程师，曾主导多模态传感器融合计算平台的研发工作；核心团队成员多来自中科院、密歇根大学、北京大学等头部院校，覆盖底层传感材料到上层智能算法的全链条研发能力。</p>\n  <p>随着人形机器人本体、电机、关节控制等硬件工程逐一突破，行业竞争发生阶段性切换，深层制约来自数据供给的结构性短缺。根据《中国具身智能产业发展报告》报告显示，截至2026年初，全球高质量真实物理交互数据总量约为50万小时，而训练具备基础泛化能力的通用具身模型至少需要千万小时级数据，缺口达九成以上。</p>\n  <p>相较于视觉、文本可通过线上渠道大规模归集的训练素材，触觉模态存在独特供给瓶颈。触觉信号源于实体间直接物理接触，仿真环境可以模拟物体的形状和位置，却难以复现真实场景下压力分布、摩擦力、材质形变等复合力学特征，仿真数据集与真实触觉真值存在固有偏差，无法作为高质量训练素材完全替代真人实采数据。这也倒逼行业从物理端寻找数据获取的新方式。</p>\n  <p>数采手套作为连接人类操作与机器人学习的物理接口，既能捕捉真实操作中的接触力学信号，又能以相对标准化的形态实现规模化部署，成为当前填补触觉数据空白的关键路径之一。</p>\n  <p>尧乐科技即将发布的数据手套，其创新在于将传感功能直接融入织物结构，实现材料与器件的一体化。创始人兼CEO吕莉蕴告诉硬氪，当前主流的数采手套方案，多采用印刷电路或薄膜传感器贴合于织物表面，传感器层与织物层分离，往往需要多层结构叠加。</p>\n  <p>“这种方案在实验室环境或短期演示中尚可运行，一旦进入真实场景，多层结构带来的位移、褶皱、汗渍等问题，就会直接影响数据质量。”吕莉蕴说。</p>\n  <p>尧乐的方案是将传感能力直接嵌入织物结构本身。基于公司自主研发的“金属纱线+三明治矩阵”传感器，将金属拉丝合金纱线编织成导电网络，嵌入多层织物构成的矩阵中。其中，纱线采用纯金属材质，而非涂层或电镀工艺，导电性和一致性更持久。其手套在手套掌心及指节均覆盖高密度感知阵列，实现精准的数据采集。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_fea3cabf6a304e0784ad77591b2e1ca7@6022551_oswg103798oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据手套传感点分布概念示意图（图源/企业）</p>\n  <p>一体织造成型后，传感电路与布料融为一体，无需多层贴合或外挂传感器阵列。这一结构消除了传统手套因层间滑移带来的信号误差，手指弯曲时不会产生相对位移，空抓也不会因面料褶皱触发无效信号，从根本上提升了数据采集的可靠性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260728/v2_1d76b715e620414bbd6a86f99b92f995@6022551_oswg2551114oswg1920oswg1080_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">织物即传感器（图源/企业）</p>\n  <p>当触觉从具身智能的“可选配置”演变为“基础感知层”，数据手套作为连接人类操作与机器人学习的物理接口，其产业位势正在被重新定义。从实验室走向规模化部署，手套能否被采集人员长期、高频、无负担地使用，直接决定了数据获取的真实性和可持续性。这也是尧乐科技采取了模块化设计的价值所在。</p>\n  <p>其手套采集盒集成供电、信号处理和存储模块，手套本体可单独替换、水洗维护，既保障了长期采集任务的连续性，也降低了故障后的维修门槛。</p>\n  <p>从商业模式看，硬件是入口，数据是更长线的商业价值所在。尧乐科技交付给客户的不仅是手套，还包括数据采集、清洗、标定和时间轴对齐等预处理服务。经过校准的传感器具备良好的一致性，无批次差异或单只手套间的偏差问题，有效降低了客户在模型训练阶段的数据清洗成本。</p>\n  <p>今年以来，国内瞄准柔性触觉感知方案的电子皮肤手套厂商数量迅速增长，技术路线覆盖印刷薄膜、视触觉、织物传感等多个方向。行业竞争的关键节点在于，谁能率先在保证数据准确性的前提下，实现规模化量产与成本下探。</p>\n  <p>“我们的优势在于车规级场景积累的可靠性与供应链管理经验，具备向机器人场景迁移的核心能力基础。在产品定位上，我们认为数据手套更像是一种‘消耗品’，传感器本身不需要用十年不坏，相反，它更需要在寿命期内数据准确，做便宜、可替换，比只追求稳定耐用更符合用户的真实需求。”吕莉蕴告诉硬氪，2026年，尧乐科技数据手套业务预计将占到整体营收的一半以上，公司全年营收预计翻10倍。</p>\n  <p><strong>以下为硬氪与尧乐科技创始人兼CEO吕莉蕴的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：据你们观察，今年尧乐的行业客户对数据的需求主要集中在哪些类型？他们在需求上有什么本质差异？</strong></p>\n  <p><strong>吕莉蕴：</strong>现在整个行业最缺的就是真人的触觉数据，这个缺口非常大。从客户画像来看，其需求大致可以分成几类。</p>\n  <p>第一类是具身智能公司和做世界模型的团队，这也是公司当前最主要的客户群体。他们要的是操作数据，用来训练灵巧手或机器人完成具体任务。这类客户特别强调数据的“异构性”，即不能只采一个人的操作方式、也不能只针对某一种物体，不同人手型、发力习惯、操作节奏的差异，对模型泛化能力很关键。另外他们对数据预处理要求也特别高，时间轴要对齐、传感器之间要同步、压力数据和图像数据要能对应上，这些基础工作如果做得不好，后期数据的实用性会受到影响。</p>\n  <p>第二类是大型工业企业和物流公司，比如UPS这类。他们本身就有工人戴着劳保手套在生产线上工作，需求不是训练机器人，而是做劳动健康风险评估和效率优化，通过采集手部动作和受力数据，分析哪些动作容易造成劳损、哪些工序劳动强度偏高，进而优化作业流程。这类需求在海外特别多，尤其是欧洲和日本，企业对员工健康合规要求很高，也愿意为此付费。与第一类客户不同，这些企业不需要多模态融合或复杂标定，而是得能直接能读懂的生物力学指标，比如关节受力峰值、重复性动作频次，对数据解读维度完全不同。</p>\n  <p>第三类是医疗康复领域，比如手部功能恢复监测、中风患者康复训练评估等，要的是精细化动作追踪和长期变化趋势，要求传感器具备很好的重复性和一致性。如果传感器本身的漂移比康复进展还大，数据就没有临床价值。</p>\n  <p>也正因为不同客户目标差异很大，所以我们不是卖一个标准化手套就结束了，而是要根据应用场景做不同配置和不同维度的数据分析。我们更倾向于跟客户深度合作，帮他们做一部分数据分析，在此基础上共享数据资源。硬件铺进去只是第一步，数据怎么用、怎么帮客户产生价值，才是更长线的事。</p>\n  <p><strong>硬氪：市面上做柔性传感器的厂商不少，包括印刷薄膜、视触觉等不同技术路线，客户选择尧乐科技方案的原因是什么？</strong></p>\n  <p><strong>吕莉蕴：</strong>客户来找我们，根本原因就是市面上很多方案在数据准确性上存在问题。</p>\n  <p>现在市面上常见的电子手套多为印刷薄膜类，在薄膜、TPU或布料上印刷传感器，或者把视触觉集成进去。但这类材料的问题在于，它本身并不是天然适合做手套的材质。人类戴手套基本都是织物形态，胶皮手套戴一小会儿就要摘，不透气会产生汗渍。</p>\n  <p>同时，由于印刷薄膜方案通常需要多层结构，把传感器夹在中间，多层结构带来的问题是太厚、不透气，汗渍会导致传感器衰减和漂移；层与层之间在抓取时容易产生滑移；如果手套没有专门针对手部立体结构做过版型，手指弯曲时材料会褶皱，空抓时传感器就已经误触发了，还会出现所谓的“脏数据”或“鬼影噪声”。</p>\n  <p>尧乐的做法是从源头解决这些问题。一体编织成型，没有多层结构，手套成型时传感电路已经被织进去，手指弯曲时不存在层间滑移问题。</p>\n  <p>此外，我们在手套内部还设计了空气层和支撑结构，让传感器尽量只在真正接触受压时响应，从物理层面减少无效信号；腕部主控盒还内置了广角摄像头，可以对照接触情况做双重校验，空抓时摄像头一看就知道手里没东西，数据可以交叉验证。</p>\n  <p>可以说，客户选择尧乐，正是因为我们对织物传感器的理解更深，从材料、工艺、织法，再到量产、标定、交付，是系统性的能力，能把数据采集的“前处理”做到位，而不是把一堆含噪的原始数据扔给客户自己去清洗。这也是织物传感路线在数据采集场景下不可被替代的价值所在。</p>\n  <h4>投资方观点：</h4>\n  <p><strong>云道资本创始合伙人曹稷山</strong>认为，一级市场正从“本体够不够炫”，转向追问真实物理交互数据从哪里来、能否规模化喂给模型。触觉公司很多，能量产交付的却不多；关键看有没有在汽车等高标准行业跑通定点与批量——因为世界模型要的是可复用、可训练的数据产能。尧乐的价值，不在又一种传感器，而在把人类真实接触变成可进入训练链条的数据入口；硬件是门票，数据接口与标准化，才是估值弹性所在。</p>\n  <p><strong>鼎和高达管理合伙人王莹</strong>表示，我们过往投资组合中的禾赛、Momenta、六分科技等，都指向同一命题——让机器更好感知、预测并作用于物理世界。尧乐所做的，正是这一命题在物理交互数据侧的关键拼图。鼎和高达将依托我们丰富的产业生态矩阵，为尧乐提供从供应链协同到市场拓展的深度支持。本次投资我们协助引入常熟汽饰，也正是看到海外主机厂对OCS（乘客分类系统）逐步形成刚需。希望通过投资和赋能一同将中国车规级量产方案推向海外，全力支持尧乐出海业务拓展。</p>\n  <p><strong>祖龙娱乐首席财务官李轶</strong>表示，我们坚定地看好尧乐作为触觉数据基建的长期价值，押注中国企业在新一轮AI科技创新中，正凭借极致的工程化能力与丰富的场景密度，从底层基础设施发力，在全球Physical AI竞争中跑出独有的“中国加速度”。</p>", "category": "tech", "published_at": "2026-07-29T01:30:00+00:00", "fetched_at": "2026-07-29T02:09:14.166288+00:00", "fingerprint": "4afe8187699268a4"}, {"source": "少数派", "title": "索尼抛弃实体游戏光盘，谁成为了转型代价？", "url": "https://sspai.com/post/112774", "summary": "占核心营收和利润支柱的业务，是不是应该追求最为稳妥的业务方向和逻辑？这个问题对于强大的索尼而言，答案大不相同。<a href=\"https://sspai.com/post/112774\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-28T03:02:53+00:00", "fetched_at": "2026-07-29T02:09:12.595209+00:00", "fingerprint": "46f46ad4f86202ad"}, {"source": "少数派", "title": "从《奥德赛》观影聊聊 IMAX 影院的分类", "url": "https://sspai.com/post/112380", "summary": "聊聊 IMAX 放映系统的区别及影厅选择策略，帮你选到视效更震撼、更接近导演创作意图的版本。<a href=\"https://sspai.com/post/112380\" target=\"_blank\">查看全文</a>", "category": "tech", "publish
