source": "The Verge", "title": "Lamborghini’s flagship Revuelto levels up with SV trim", "url": "https://www.theverge.com/transportation/979807/lamborghini-revuelto-sv-specs-performance", "summary": "A lot of automakers talk about wanting to minimize or eliminate driver distractions so as to make the experience of driving more rewarding and safer overall. Lamborghini has a different strategy; it wants the driver to become one with their vehicle. This helps explain the storied super car maker's tagline for the new Revuelto SV: [&#8230;]", "category": "tech", "published_at": "2026-08-14T18:00:00+00:00", "fetched_at": "2026-08-15T00:57:50.562430+00:00", "fingerprint": "32ac4b05ec31c23b"}, {"source": "The Verge", "title": "A RAMageddon guide to back-to-school laptop shopping", "url": "https://www.theverge.com/tech/979996/best-laptops-students-middle-high-school", "summary": "If you’re a student looking for an affordable laptop, I have bad news and I have good news. The bad news is that computer prices are out of whack due to the ongoing RAM and storage crunch, making some a little pricier than they used to be and others wildly more expensive. The good news? [&#8230;]", "category": "tech", "published_at": "2026-08-14T18:32:47+00:00", "fetched_at": "2026-08-15T00:57:50.562424+00:00", "fingerprint": "d9e355ea0c339df8"}, {"source": "The Verge", "title": "Samsung has new Galaxy headphones in the works", "url": "https://www.theverge.com/gadgets/980547/samsung-galaxy-h1-over-ear-headphones", "summary": "Strings of code in Samsung's Galaxy Wearable app hint at an upcoming pair of over-ear headphones that could compete with the AirPods Max, SamMobile reports. Samsung's reportedly referring to the headphones as the \"Galaxy H1,\" and SamMobile says they could launch sometime in 2027. That would make these the company's first pair of over-ear headphones [&#8230;]", "category": "tech", "published_at": "2026-08-14T19:18:45+00:00", "fetched_at": "2026-08-15T00:57:50.562412+00:00", "fingerprint": "cca1a97690bf9684"}, {"source": "36氪 - 最新文章", "title": "泡泡玛特的「日本老师」，在中国赚翻了", "url": "https://36kr.com/p/3939155401948549?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑</strong> <strong>|</strong> 张帆</p>\n  <p>8月12日，Hello Kitty的母公司三丽鸥在东京股市经历了一场“血洗”。</p>\n  <p>财报公布当日，三丽鸥股价盘中跌幅达18%，创下了近十年来的最大单日跌幅。日兴证券的分析师给出的评价很直接，“本次财报表现平淡，无超预期亮点。”</p>\n  <p><strong>这多少有点反直觉。</strong>从财报看，截至今年6月的2027财年一季度，三丽鸥的表现并不差：营收520.35亿日元，同比增长20.7%。净利润方面，公司实现155.16亿日元，同比增长9.3%。</p>\n  <p>问题出在营业利润不符合预期。</p>\n  <p>一季度，三丽鸥的营业利润为224.4亿日元，同比增长11.1%；此前市场预期的营业利润是234亿日元，相比少了近10亿日元。<strong>更关键的是，过去几个季度，三丽鸥几乎在每次财报披露后都会“上调指引”，这次却“维持不变”。</strong></p>\n  <p><strong>这等于向市场释放了一个信号，三丽鸥的增长放缓或已出现。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_5c2da2bfdbc14433ad7f33ba56190707@394564713_oswg43505oswg1022oswg570_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind截图</p>\n  <h3><strong>一只白猫和阿里鱼</strong></h3>\n  <p>1974年，Hello Kitty诞生。这个没有嘴巴、没有固定表情、永远五头身的卡通形象，在随后的五十年里成为全球最赚钱的IP之一。它的母公司三丽鸥，也从一家礼品店逐渐发展为IP巨头。</p>\n  <p>但随后的故事并非坦途。2015财年起，三丽鸥陷入长达七年的业绩低谷，营收与利润双降，过度依赖Hello Kitty的弊端显现。</p>\n  <p>转折发生在2020年。在这一年，创始人辻信太郎的孙子辻朋邦接任社长，以“利润优先”为原则推动改革。<strong>主要措施包括——关闭亏损门店，削减大量赘余SKU，将战略重心从单一IP转向多角色运营，从自营零售转向高毛利授权，从日本本土向海外市场突围。</strong></p>\n  <p>在这一过程中，中国成为三丽鸥全球复兴的最大变量。催生这一变量的，是阿里鱼在授权运营上的系统性重构。</p>\n  <p>2022年7月，阿里旗下IP交易及创新平台阿里鱼与三丽鸥签约，获得包括Hello Kitty、美乐蒂、酷洛米在内的26个形象在中国大陆、为期五年的独家代理权，合作自2023年1月1日起生效。</p>\n  <p><strong>对阿里鱼而言，三丽鸥是业绩爆发的重要引擎。</strong></p>\n  <p>大麦娱乐（原阿里影业）财报显示，在截至2026年3月31日的财年，以阿里鱼为核心的IP衍生业务收入达到21.7亿元，同比增长60%，是公司第二大收入来源。阿里鱼在《2025全球顶级授权代理商报告》中，以41亿美元总销售额位列全球第六。</p>\n  <p><strong>同时对于三丽鸥，阿里鱼解决了其在中国市场的“渠道”与“本土化运营”两大痛点。</strong></p>\n  <p>从官方披露的数据来看，仅2024年，就有超过200家品牌与三丽鸥达成授权合作，累计3万余个SKU投入市场。</p>\n  <p>线下渠道的扩张同样激进。截至2025年12月底，三丽鸥在中国累计开出59家门店，比上一财年多了31家。这意味着，三丽鸥在中国市场不再是收过路费的IP授权，而是亲自下场卖货。</p>\n  <p>财报数据能更直观地反映三丽鸥改革的成效。</p>\n  <p>在截至今年3月的2026财年，三丽鸥营收1940亿日元，同比增长33.9%；营业利润达到793亿日元，同比增长48.4%。</p>\n  <p>其中，中国市场的销售额飙升至314.4亿日元，同比激增83.2%。酷洛米超越Hello Kitty成为中国区“销冠”，大耳狗、美乐蒂、半鱼人等角色均跻身成交榜前十。</p>\n  <p>从集团的角度看，Hello Kitty在这一财年的营收占比，已从2016年的60.6%下降到37.3%。这说明，三丽鸥已摆脱了对单一IP的依赖困境。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_e0aaf999c1b44595ac13cde3a571cbb7@394564713_oswg230345oswg834oswg645_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自三丽鸥《决算说明资料》</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_f3c98162c89443bbb3a1f350ad64a2cc@394564713_oswg109103oswg1080oswg609_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind及财报制图</p>\n  <h3><strong>与泡泡玛特成为“对照组”</strong></h3>\n  <p>但三丽鸥依然在财报中披露了风险。</p>\n  <p>“作为公司增长战略的核心，公司计划重点在中国与北美两大市场扩张业务，无法保证该战略能够取得成功。”在北美，公司仍在消化税收影响，销售虽有复苏迹象但难言爆发；在中国，当市场基数达到一定量级，83.2%的高增速不可持续。</p>\n  <p>实际上，在三丽鸥蓬勃发展的这些年，后起之秀泡泡玛也在疯狂成长，尤其是自2024年起，LABUBU成为现象级IP。</p>\n  <p>而这两家公司也常被放在一起被对比。</p>\n  <p>从商业模式来看，三丽鸥与泡泡玛特都采用无叙事的形象IP。</p>\n  <p>Hello Kitty没有嘴巴，LABUBU也从不开口说话。用户可以将自己的情绪自由投射到角色本身。这种故事情节的“留白”，让IP拥有了跨越代际的生命力。</p>\n  <p><strong>曾有分析人士在东方财富网发文，将泡泡玛特概括为“三丽鸥的IP逻辑+Funko的潮玩机制+名创优品的零售效率”。从这个视角，三丽鸥算得上是泡泡玛特的“日本老师”。</strong></p>\n  <p>只不过，缺乏故事支撑的短板同样明显——IP与用户的情感联结深度有限，没有剧情的持续输出，用户的注意力易被分散。</p>\n  <p>现阶段，两家公司也都在试图通过游戏、大电影补全内容叙事能力；同时布局线下乐园，增加与用户的互动与情感联结。</p>\n  <p>当然，这样的后天努力相当不易。</p>\n  <p>双方商业模式的不同则在于，泡泡玛特是“重资产直营”。截至2025年末，泡泡玛特全球门店数达到630家，靠自有零售网络掌握定价权。另一边的三丽鸥，尽管也在中国大力扩张直营门店，却仍是“轻资产授权”的逻辑。</p>\n  <p><strong>也正因业务切入点的不同，三丽鸥与泡泡玛特从不是纯粹的竞争关系，而是重要的合作伙伴。</strong></p>\n  <p>今年3月，泡泡玛特正式发售“THE MONSTERS×三丽鸥家族系列”搪胶毛绒挂件盲盒。发售仅一分钟，泡泡玛特官方渠道即售罄，线上瞬间售出超过3万件。</p>\n  <p>三丽鸥的经典IP让LABUBU触达到更广泛的消费群体，泡泡玛特的潮玩机制也为三丽鸥注入了新的活力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_622391fac3094a5d9e6d50174a218057@394564713_oswg116802oswg1080oswg1439_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">THE MONSTERS×三丽鸥家族系列</p>\n  <p><strong>一个明确的事实是，在资本市场，两家公司都在或主动或被动的挤出泡沫。过去依赖规模与高增长的估值逻辑正被重塑，市场更看重聚焦于IP运营的精耕细作与实际转化效率。</strong></p>\n  <p>当三丽鸥连续数年的增长神话遇到增速放缓的拐点，8月12日的股价跌幅或许只是一个开始。在用“可爱”这门生意穿越周期后，三丽鸥需要继续向市场证明，自己不只会卖毛绒玩具和“授权贴纸”，而是一个能横跨内容、商品、体验和数字娱乐的综合IP集团。</p>\n  <p>某种程度上，泡泡玛特也不外如是。</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_9d7764e85217408e819083b0b87d3b95@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/2IFoas42_Oo8MFmx-c6OlA\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;张帆，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-14T09:26:14+00:00", "fetched_at": "2026-08-15T00:57:50.387543+00:00", "fingerprint": "b44a127cf83586cf"}, {"source": "36氪 - 最新文章", "title": "阿里灵犀再传15亿美元出售，或许这就是中国游戏行业的现实", "url": "https://36kr.com/p/3939187139935369?f=rss", "summary": "<p>灵犀互娱这次真的要易主了？</p>\n  <p>据彭博社报道称，亚洲私股权公司信宸资本接近达成收购阿里巴巴集团控股有限公司视频游戏业务的交易。知情人士表示，信宸资本成为了灵犀互娱最有可能的买家，其出价高于包括电子游戏制造商在内的其他竞购方。据他们透露，此次交易对这家工作室的估值可能超过15亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_9c61223f7ca14d3bbd76977cd38f3454@6427981_oswg502528oswg1080oswg808_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：彭博社</p>\n  <p>截至发稿，灵犀互娱以及信宸资本未作回应。</p>\n  <p>前不久的6月23日，就有多家媒体报道，阿里巴巴集团正计划出售旗下游戏业务品牌灵犀互娱，整体报价70亿至90亿元人民币（约合10.38亿~13.35亿美元），低于本次曝出的出售价格。</p>\n  <p>从市场估值和收入情况来看，灵犀互娱并非处于爆发式增长阶段，而是一个现金流稳定、增长曲线已长期平稳的成熟业务。至于为何频繁被曝业务出售，可能要从灵犀互娱的产品和发展路线说起。</p>\n  <h3>01</h3>\n  <p>灵犀最重要的现金牛产品，是《三国志·战略版》。</p>\n  <p>《三国志·战略版》上线于2019年，截至目前全球注册用户突破1亿。在Sensor&nbsp;Tower等榜单上，常年盘踞中国手游收入榜前列，是国内SLG赛道里商业化能力最稳定的产品之一。</p>\n  <p>按各大第三方平台数据，2025年这款产品月流水大致维持在1.8亿至2.5亿元区间。考虑到SLG品类本身“赛季卡包+新武将”主导收入的特性，这种量级的流水对一款上线已7年的产品而言，已属长线运营的典范。</p>\n  <p>当然，灵犀的价值和愿景不止于一个爆款。</p>\n  <p>灵犀互娱目前下辖5个研发工作室（平平无奇、南瓜、星辰、鸢、创新）和2个运营业务线（九游、交易猫）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_e218299304f04f5e90feb6e86d5ee46a@6427981_oswg152002oswg608oswg1080_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《如鸢》</p>\n  <p>其中，《三国志幻想大陆》《三国志幻想大陆2：枭之歌》是三国IP在卡牌与二创方向的延伸；《如鸢》是它在女性向三国题材上的一次成功尝试；其他诸如《救世者之树：新世界》《信长之野望：真战》等产品，也是灵犀在自研或发行方向探索的成果。</p>\n  <p>从自研和运营的产品矩阵来看，灵犀互娱试图在SLG之外建立第二条增长曲线。当然，截至目前，这些产品的体量与《三国志·战略版》还不在一个量级。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_6123869e7b734e4c8a1aea250cca9f9d@6427981_oswg125640oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《三国志幻想大陆2：枭之歌》</p>\n  <p>产品之外，灵犀的内部组织也发生过变化。</p>\n  <p>2025年8月，灵犀互娱在阿里内部的汇报线从大文娱事业群董事长樊路远调整至阿里巴巴集团CFO徐宏。在大公司里，汇报线的变动通常不是简单的组织行为。</p>\n  <p>樊路远在2024年12月的一场内部演讲曾引发争议，外界很多人也因此认为自研游戏业务难以融入阿里体系。从源头来讲，这番争议与阿里游戏的起点有关。</p>\n  <p>灵犀互娱的起源，是2017年阿里以约10亿元收购的广州简悦（由网易前COO詹钟晖创办），在并入阿里大文娱后，品牌升级为灵犀互娱。灵犀互娱从诞生之日起，就是一家带有网易系基因的游戏公司，而被阿里收编后，文化上或许始终没有完全融入阿里体系。樊路远演讲里的那句“没有阿里的血脉”，表达的也是这种长期存在的认同断层。</p>\n  <p>而徐宏接管的背景，是阿里正在推进的1+6+N业务改革。从银泰、高鑫零售，再到盒马等非核心资产的调整，所有方向看上去都指向同一件事，那就是阿里正在把重心押到AI和云计算等领域上。</p>\n  <p>换句话说，是“把游戏做成行业头部”重要，还是“这块业务能卖多少钱”更重要？这个问题的答案，或许在频繁的收购传闻中能窥探一二。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_647a2b598b5f49359383469be62bc33d@6427981_oswg1343831oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《三国志战略版》</p>\n  <p>2026年6月，灵犀互娱被传出被卖的消息。从扩张游戏版图收购灵犀，到从资本和战略层面做出回答，这中间的距离恰好是十年。</p>\n  <h3>02</h3>\n  <p>阿里收购灵犀互娱的十年，某种程度上是中国互联网公司生态扩张逻辑从兴起到退潮的一个注脚。</p>\n  <p>2014年前后，BAT同时进入边界延伸阶段：腾讯从社交向游戏延伸，百度从搜索走向内容，阿里围绕电商构建覆盖消费、娱乐、金融、服务的超级生态，影视、音乐、体育、文学、游戏，几乎所有能占据用户时间的领域都被纳入版图。</p>\n  <p>阿里做游戏的逻辑并不复杂：用户既然已经在淘宝购物、在支付宝支付，理论上也可以在阿里的生态里娱乐、消费和社交。从代理、发行到自研，从收购到投资，几乎所有路径都试过。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_969813b2a21044a3bc400ce8c1dbbf42@6427981_oswg28944oswg480oswg187_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">灵犀互娱所在的广州阿里办公区</p>\n  <p>但游戏行业后来证明，它不是一个仅依靠流量导入就能跑通的生意。</p>\n  <p>腾讯和网易占据行业头部位置，并不是因为拥有更多用户，而是因为建立起了成熟的研发体系、发行体系以及爆款生产机制。游戏本质上更接近内容工业，需要创意、研发、运营、社区和长期投入，这些能力很难通过资本或者流量快速复制。</p>\n  <p>从更长的时间尺度看，灵犀互娱的故事可以分成两段。</p>\n  <p>前一段是2017年至2019年。阿里以约10亿元收购广州简悦，团队带着网易系基因进入阿里体系。三年后，《三国志·战略版》上线。这款由灵犀互娱早期团队主导开发的三国题材SLG，打破了当时国内SLG市场的既有格局，长期稳居国内iOS畅销榜前10。从产品角度看，这是阿里游戏史上最具标志性的爆款。从组织角度看，这也是简悦系团队在阿里体系内交出的最重要的成绩单。</p>\n  <p>后一段是2019年至今。《三国志·战略版》的成功没有带来第二款同等级别的现象级产品。整个灵犀互娱的收入结构、利润结构，主要围绕这一款产品运转。当一家公司的估值越来越依赖单一产品时，它的估值逻辑就会逐渐从成长型公司向现金流资产靠拢。</p>\n  <p>而现金流资产，恰恰是最容易被摆上货架的那一类。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_adf7a13271c046ae826935c93a2a90fa@6427981_oswg157510oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《决胜巅峰》j</p>\n  <p>灵犀互娱再次易主，并非行业孤例。</p>\n  <p>以沐瞳科技为例，这家MOBA手游《Mobile&nbsp;Legends:&nbsp;Bang&nbsp;Bang》（国服：《决胜巅峰》）的开发商，2021年被字节跳动收购，2026年又被转手卖给沙特Savvy&nbsp;Games&nbsp;Group，两次交易估值从40亿美元涨至70亿美元。</p>\n  <p>五年时间，沐瞳的代表作MLBB始终是东南亚地区最头部的MOBA游戏，甚至成为了很多国家的国民级游戏，但依然阻挡不了公司两度易主。</p>\n  <p>对阿里来说，15亿美元或许是一个相对合理的估值区间。对灵犀的员工来说，这是又一次“公司是别人的、但项目还是自己的”的中国游戏行业现实。</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/HR1zVXj12SpKt-BkX9II-g\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-08-14T09:54:02+00:00", "fetched_at": "2026-08-15T00:57:50.387537+00:00", "fingerprint": "62b59aa4a239435d"}, {"source": "36氪 - 最新文章", "title": "独家 | 腾讯混元徐灿转岗微信WeLM，微信AI进入加速阶段", "url": "https://36kr.com/p/3939234424700041?f=rss", "summary": "<p>&nbsp;</p>\n  <p>文 | 李炤锋</p>\n  <p>编辑 | 张雨忻</p>\n  <p>智能涌现从相关人士处获悉，混元资深研究员徐灿在近期加入腾讯WeLM团队，从事大模型研发相关工作。</p>\n  <p>多名知情人士透露，在姚顺雨接手腾讯大语言模型研发前，徐灿在混元LLM体系中担任后训练一个方向上的负责人。值得一提的是，<strong>这次转岗发生在微信持续强化自研大模型和Agent能力的阶段</strong>。6月，微信原生AI助手“小微”已进入小范围灰度测试，可通过文字或语音操作微信原生功能，并调用小程序完成服务任务。</p>\n  <p><strong>公开招聘信息也显示，微信近期在招聘WeLM推理优化及Agent方向研究人员，徐灿的加入或将进一步补充WeLM在训练、推理及复杂任务执行方面的研发力量。</strong></p>\n  <p>这位有微软亚洲研究院背景的资深研究员，长期从事合成数据、指令数据构造及大模型后训练研究。尤其在强化学习反馈、自动评测和训练数据迭代方面的积累，与WeLM当前强化模型训练及复杂任务能力的方向具有较高契合度。</p>\n  <p>知情人士称，徐灿近两年在混元参与后训练工作的经验，可能正是WeLM看重的部分。</p>\n  <h3><strong>01 混元LLM重要成员，专注Agent和后训练方向</strong></h3>\n  <p>混元发生的这一岗位变动，与团队过去一年间的技术路线调整和人员更迭关系紧密。</p>\n  <p>徐灿在大模型行业的知名度，可以追溯到他在微软时期创建的WizardLM项目。<strong>2023年4月，他以第一作者身份发布WizardLM论文，提出Evol-Instruct方法：让大模型自动增加已有任务的难度、限制条件和推理步骤，再利用生成的复杂指令训练模型。</strong>这套方法随后被用于WizardCoder、WizardMath等项目，并逐步扩展至代码、数学、模型评估和强化学习等方向。</p>\n  <p>2025年5月，徐灿宣布离开微软，加入腾讯混元，据悉他当时已入职半年。在他之前，Swin Transformer主要作者胡瀚（近期已从腾讯离职）也于2025年初从微软亚洲研究院加入混元。此后，以胡瀚、徐灿等微软背景研究人员为代表的团队，开始使用“混元X”署名，研究覆盖多模态理解、视觉推理和大语言模型，是当时混元内部重要的技术力量。</p>\n  <p>智能涌现了解到，在这一时期，徐灿在大语言模型后训练方向承担了重要职责。</p>\n  <p><strong>2025 年下半年，随着姚顺雨加入腾讯并接手相关业务，混元团队原有的技术与组织格局开始迅速变化，徐灿的职责也发生调整。</strong></p>\n  <p>同年12月，腾讯正式官宣重组大模型研发架构，姚顺雨兼任AI Infra部和大语言模型部负责人，并以部门负责人身份向卢山和刘炽平汇报；王迪则继续担任大语言模型部副总经理，向姚顺雨汇报，徐灿也在这时转向后训练方向。</p>\n  <p>智能涌现了解到，姚顺雨入职后，混元继续从各大基模厂商团队引入研究人员。<strong>仅在后训练领域，就有至少两名某大厂核心成员进入混元，与徐灿所在团队并行推进不同技术方向。</strong></p>\n  <p>2025年下半年，一些公开报道曾将徐灿描述为混元后训练的主要负责人。但实际上，混元后训练业务在当时已经被拆分成多个小组，徐灿负责其中一个方向。据智能涌现了解，后训练团队的几个小组之间，曾围绕数据组织、系统提示词和产品工程路径等方向展开探索。</p>\n  <p>在混元几经调整后，近期徐灿的公开社交媒体显示其身份为腾讯混元Principal Researcher，即资深研究员，他今年仍时常以作者身份出现在混元相关论文中。</p>\n  <p><strong>据了解，WeLM长期保留独立的语言模型和强化学习研发能力，也需要合成数据、奖励模型和后训练经验。徐灿过去数年积累的技术经验，恰好可以在这支团队中找到新的承接空间。</strong></p>\n  <p>&nbsp;</p>\n  <h3><strong>02 混元之外，WeLM在大模型上独立探索</strong></h3>\n  <p><strong>这一次人才流动，正好卡在腾讯内部两套大模型研发体系并行运转的时间点。</strong></p>\n  <p>姚顺雨接手混元后，腾讯开始进一步整合分散在内部各团队的AI研发资源。2025年12月，TEG（腾讯技术工程事业群）新设AI Infra（人工智能基础设施）部、AI Data（人工智能数据）部和数据计算平台部，姚顺雨同时负责AI Infra部和大语言模型部。</p>\n  <p>数月后，成立近十年的腾讯AI Lab被撤销，部分研究人员并入大语言模型部，另有部分人员转入产学研合作中心。这一轮调整把模型研发、数据、训练基础设施和原有基础研究力量，进一步收拢到姚顺雨主导的混元体系内。</p>\n  <p>然而，在腾讯基础模型研发组织中，WXG（微信事业群）仍保留着相对独立的研发团队。</p>\n  <p><strong>2022年，微信团队发布中文预训练语言模型WeLM。论文披露，WeLM拥有100亿参数，在18项中文任务上超过多个同等规模模型，部分表现可匹配参数量大25倍的模型，并一度开放模型试用申请。</strong></p>\n  <p>2025年8月，微信团队又公开WeChat-YATT，这是一套面向大语言模型和多模态模型的RLHF训练框架。该框架主要解决控制器扩展、动态采样和GPU资源调度等问题，论文称其已用于训练支撑微信产品功能的模型，并面向大规模用户服务。</p>\n  <p>与此同时，一些大模型技术已经进入视频号、朋友圈的推荐和广告系统，但值得关注的是，这其中采用的模型并不都来自WeLM体系。例如，部署在视频号和朋友圈广告召回环节的LEADRE，底层使用的就是10亿参数混元模型。</p>\n  <p><strong>时间来到2026年，腾讯方面披露的技术文档显示，新一代WeLM转向高度稀疏的MoE架构。其中一个基础版本总参数约800亿，每次推理激活约30亿参数；团队随后通过深度扩展形成约1300亿参数、激活约49亿参数的变体。</strong></p>\n  <p>2026年7月9日，微信AI团队又公开Hidden Decoding研究，披露WeLM-HD4-80B和WeLM-HD4-617B两个模型。该方法在不扩大原有Transformer骨干的情况下，为每个Token增加内部计算，并首次将这类长度维度扩展方法应用到100B参数以上的MoE模型。</p>\n  <p>小微内测后，WeLM也开始被外界关注，很多解读认为，WeLM是一款专为微信训练的“低成本小模型”。</p>\n  <p>但据行业人士分析，WeLM团队着眼于驱动AI对微信进行彻底的改造，包括但不限于聊天、社交、小程序服务等场景。</p>\n  <p>这意味着，WeLM团队既要研发低激活参数模型，以提升产品部署效率；也要探索6000亿参数级别的大模型，持续突破能力上限。</p>\n  <p><strong>在这样的背景下，WeLM与混元之间在资源层面既是协作方，也是竞争者，两个团队既有阶段性的探索工作的重合，也会发生类似的人才流动。</strong></p>\n  <p><strong>两大基模团队背后，是C端AI入口之争</strong></p>\n  <p>腾讯的C端AI主力产品元宝，于今年年初上线的元宝派功能，让混元和微信两大体系在产品层出现了一次交集。</p>\n  <p>彼时，元宝派试图把AI引入多人社交场景，支持群聊总结、图片生成、共同娱乐等功能。微信团队也罕见地释放出部分传播资源，元宝派邀请可以经由微信好友、群聊和朋友圈扩散。</p>\n  <p>对元宝而言，这相当于获得了腾讯最核心的关系链入口；对微信而言，这也是一次观察AI能否重新组织社交关系的产品实验。</p>\n  <p>然而，在微信方面“有限”的资源共享的背景下，元宝并没有成长为预期中的腾讯C端突破口。</p>\n  <p>只看春节期间，元宝派和红包玩法确实一度冲上流量高点。腾讯方面披露，截至今年2月18日，元宝日活跃用户超过5000万，月活跃用户达到1.14亿。</p>\n  <p>但这轮增长红利，却并未持续沉淀。QuestMobile数据显示，红包活动结束后，元宝日活很快回落至春节前水平；到2026年3月，元宝独立App月活为5735万，未进入亿级AI应用阵营，只有豆包、千问和DeepSeek三款产品月活超过1亿。</p>\n  <p>与此同时，微信迅速落地了传闻已久的原生AI助手“小微”。它采用多模型协同路线：一些行业内测反馈显示，“小微”主模型为微信团队自研的WeLM，部分回答会调用DeepSeek。</p>\n  <p>今年6月，微信开放平台开始允许小程序接入微信AI生态：在自动模式下，平台可以读取小程序源码、分析页面结构，让微信AI直接操作；在开发模式下，开发者也可以将业务能力封装为经平台审核后供微信AI调用的技能。</p>\n  <p>从“小微”的功能形态看，Agent是微信将AI接入聊天、社交和小程序服务的关键能力，关系到AI能否真正理解需求并完成操作。徐灿在后训练和Agent方向积累的经验，或可帮助WeLM强化任务规划、工具调用及复杂任务执行能力。</p>\n  <p>WeLM被定位于重点兼顾用户隐私、微信场景适配和成本效率。面对微信庞大而复杂的用户场景，未来的微信Agent既要理解用户意图，也要在不同服务之间规划任务、调用工具并稳定完成操作。这将对模型的后训练、奖励设计、任务评估和执行稳定性提出更高要求。</p>\n  <p>在这一背景下，WeLM团队看重候选人在通用大模型后训练领域的经验，似乎在情理之中。</p>\n  <p>事实上，在混元和WeLM背后，不难发现<strong>腾讯在AI入口上有着两套组织逻辑：混元拥有更集中的算力、数据和模型研发资源；WeLM拥有微信的原生入口、内容生态、小程序服务和真实用户反馈。</strong></p>\n  <p>只是，这两套逻辑都需要一个强大的技术底座来支撑。</p>\n  <p><strong>智能涌现了解到，此前，WeLM和混元团队已共享了部分算力资源分配。此次人才转岗至WeLM，也进一步指向这两套大模型研发体系的同步运转，将在模型和产品层面进一步延续。</strong></p>", "category": "tech", "published_at": "2026-08-14T10:50:14+00:00", "fetched_at": "2026-08-15T00:57:50.387530+00:00", "fingerprint": "ffb73086ee311edc"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜五粮液出手稳价；谷歌推出Gemini 3.7 Flash模型；7月贷款利率保持低位水平", "url": "https://36kr.com/p/3939192336465028?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://www.36kr.com/newsflashes/3939141879627139\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>特斯拉SpaceX合并传闻再起，马斯克薪酬激励或高达8240亿美元</strong></a></p>\n  <p>一档播客节目指出，如果马斯克促成特斯拉和SpaceX合并，他可能获得最高8240亿美元的财富。按特斯拉去年批准的薪酬方案，马斯克在达成运营目标和市值目标后，最多可获4.23亿股特斯拉股票。华尔街认为，若特斯拉发生控制权变更，则运营目标视为达成，且市值目标也更容易达成。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938552904842624\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>五粮液出手稳价</strong></a></p>\n  <p>8月13日，记者从多位经销商处获悉，五粮液约一周前向经销商下发通知，取消以前部分渠道政策，并明确第八代五粮液出货价格不得低于800元/瓶。针对低价窜货、低价抛售行为，品牌方将视情节采取罚款等处罚措施。不过，有经销商向记者表示，只要不是大范围的恶意窜货，实际执行中一般不会轻易处罚。截至发稿，五粮液官方未就此发布书面文件或公开回应。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3939100381887622\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英伟达宣布CPO交换机全面量产</strong></a></p>\n  <p>8月14日，英伟达宣布Spectrum-X Ethernet Photonics已进入全面量产阶段，为面向AI工厂的下一代大规模扩展网络基础设施提供支持。英伟达表示，Spectrum-X Ethernet Photonics专为吉瓦级AI工厂网络需求设计，实现激光器数量减少4倍、功耗降低5倍、平均故障间隔时间（MTBI）提升10倍。该产品由台积电、矽品、Lumentum、天孚通信、鸿海等供应链伙伴参与制造、封装及组装。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3939070420286857\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>高性价比中国大模型兵临城下，美头部AI实验室大幅降价应对</strong></a></p>\n  <p>OpenAI等美国头部AI实验室近期大幅下调中端AI模型价格以留住客户，Silicon Data数据显示7月中旬以来客户采购美国头部实验室模型的实际支出已降近四分之一。AI使用成本持续走高，中国AI企业凭借模型的高性价比优势不断获取新的客户，令美国科技行业感到担忧。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938876560505992\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士考虑合资建设存储芯片工厂，降低资本支出和产能过剩风险</strong></a></p>\n  <p>8月14日，据报道，SK集团董事长崔泰源在接受采访时表示，SK海力士正考虑以合资方式建设新的存储芯片工厂，以降低传统行业盛衰周期下巨额资本支出和产能过剩带来的风险。崔泰源还警告称，目前存储芯片供应紧张的局面将在2027年进一步加剧。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938675213057161\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>小马智行与Uber扩大合作，计划在欧洲5城部署超2000辆Robotaxi</strong></a></p>\n  <p>36氪获悉，小马智行与全球出行平台Uber宣布，双方进一步扩大战略合作，将在欧洲5个城市部署超过2000辆小马智行Robotaxi。标志着欧洲自动驾驶行业将迈入千辆级规模的新阶段。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938599102807170\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>谷歌推出Gemini 3.7 Flash模型</strong></a></p>\n  <p>8月13日，谷歌发布新版Gemini Flash。公司表示，新推出的Gemini 3.7 Flash在代码调试等编程任务上的表现优于上一代，并且更有能力一次生成接近可直接投入生产环境的代码。谷歌还表示，这些模型可以用更少的提示完成应用开发，改善开发者体验，并降低运行模型所需的词元成本。从周四起，谷歌的AI生产力智能体Gemini Spark将由3.7 Flash提供支持。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938720679067011\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“亮源新创”完成数亿元Pre-A轮融资</strong></a></p>\n  <p>36氪获悉，近日，“亮源新创”宣布完成数亿元Pre-A轮融资。本轮融资由国科投资领投，招商局创投、襄禾资本等机构参与投资，资金将主要用于超大规模具身智能模型训练、多模态数据基础设施建设、软硬件全栈平台研发以及高人才密度的团队扩张。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://www.36kr.com/newsflashes/3939166606327176\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>阿维塔雍军回应争议：华为“非必要项”系误读</strong></a></p>\n  <p>阿维塔科技副总裁雍军公开回应近期争议，他表示：阿维塔跟华为有着深度合作，原意是并不希望华为单独为阿维塔定制一个版本，而是做全行业共享的平台技术。阿维塔07L采用联创模式打造，车辆B柱上拥有联创标志，同时，引望团队与阿维塔协同作战，该车型上应用了诸多华为技术。此外，在顶层战略上，中国长安集团与华为于深圳已签署全域战略合作框架协议，未来，阿维塔与华为还会有更加深度的合作。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://www.36kr.com/newsflashes/3939121503173764\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>7月贷款利率保持低位水平</strong></a></p>\n  <p>从中国人民银行获悉，今年以来，我国贷款利率保持低位水平，7月延续下行态势。7月份，企业新发放贷款加权平均利率略低于3%，比上年同期低约0.2个百分点；个人住房新发放贷款加权平均利率约3.1%，与上年同期基本持平。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938653582736514\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>2025年我国安全应急装备重点领域产业规模突破1万亿元</strong></a></p>\n  <p>记者从中国电子信息产业发展研究院了解到，“十四五”以来，我国安全应急装备产业快速发展。2025年重点领域产业规模突破1万亿元，形成了覆盖安全防范、应急处置和安全应急服务的产业体系。</p>\n  <p><a href=\"https://www.36kr.com/newsflashes/3938603422891143\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>AI影视爆火催生多个新工种，人才需求正大幅攀升</strong></a></p>\n  <p>AIGC导演、AI音频编剧、AI生图师、AI抽卡师（AI视频生成师）……在头部短剧企业嘉兴九州文化传媒有限公司（下称“九州文化”），AI内容创作相关的岗位已占全员的60%，其中有不少这样充满特色的AI相关岗位。AI技术在影视行业的应用逐渐深化，AI短剧、AI漫剧等AI影视内容产量大幅提升。AI影视内容的火爆带动了相关人才需求的增长。传统影视企业的主要岗位包括策划、剪辑、导演等，而在以生产AI影视内容为主的影视企业，一批颇具特色的新岗位对AI影视人才的需求正大幅攀升。九州文化相关人士向记者介绍，公司近一年来员工总数从约3000人快速扩张至9000余人，净增6000人，新增岗位几乎全部集中于AI内容生产链条。</p>", "category": "tech", "published_at": "2026-08-14T13:02:49+00:00", "fetched_at": "2026-08-15T00:57:50.387521+00:00", "fingerprint": "224e0265e167d863"}, {"source": "36氪 - 最新文章", "title": "「意图经济」爆火背后：年轻人想做旅行里的甩手掌柜", "url": "https://36kr.com/p/3939439529622917?f=rss", "summary": "<p>你有没有过这种情况，旅行还没开始，人已经开始累了。</p>\n  <p>打开小红书搜目的地，划到手指发酸，几十条笔记刷下来，内容长得越来越像。同一个机位、同一句“绝美出片”、同一份“三天两夜特种兵攻略”。</p>\n  <p>想比个价，得在5、6个APP间来回横跳。攻略攒了一堆，可这些内容分散在图片、视频、长文里，没有一个能直接拿来用，<strong>最后还得打开备忘录，一条一条手动敲：Day1住哪、Day2怎么去、几点的票、中转要多久。</strong></p>\n  <p>手机里装满了APP，但最烦人的事还得自己干，相当于自带干粮给它打工。“意图经济”这个词翻红，就在于精准击中了人们对传统平台服务溢价的不满。</p>\n  <p><strong>“意图经济”翻译成人话就是：用户只管讲明白想要什么，剩下的闹心事交给机器去办。</strong>对被“旅行内耗”榨干的年轻人来说，这句话几乎带着点解放的意味，那个替你跑腿的角色，第一次可以不再是你自己。</p>\n  <p>问题是，这句话能不能兑现。</p>\n  <p>试着把这些琐事甩给AI，让它帮忙规划一下？确实省了不少划手机的时间，方案生成得又快又漂亮，可细看才发现问题不少：推荐的酒店查无此店，给出的航班时刻和实际班次对不上，甚至会出现它信誓旦旦地说某个博物馆“周一闭馆需避开”，结果公共节假日人家其实不休息的情况。</p>\n  <p>做攻略原本是为了省心，结果比上班还累。有时明明网上的信息都是真的，拼起来却不一定能走通。比如有人让你落地北京大兴机场后，两个小时直奔故宫。丝毫不考虑从机舱到网约车等候区的距离，没有40分钟根本走不下来。<strong>信息差和经验差，是攻略最难填的两个坑，</strong>一旦漏算，轻则赶不上开园、错过末班车，重则一整天的行程全部推倒重来。</p>\n  <p>所以，AI到底能不能把一趟旅行真正安排明白？</p>\n  <p><strong>最近，飞猪推出了全新的旅行AI飞猪帮帮，主打“一句话就出发”。</strong>和只负责聊天、回答问题的AI不同，它试图把旅行里的规划、搜索、预订乃至一系列琐事都接过去，让用户从“告诉它我要什么”，一路走到“事情真的办成”。</p>\n  <p><strong>行业里有个说法：凡事号称“一句话生成XX”的，大多都是智商税。</strong></p>\n  <p>为了验证它是否真能把我们从“旅行内耗”里解救出来，后浪研究所深度体验了飞猪帮帮在几个最头疼场景下的表现。接下来，就带大家看看这个长出了双手的AI&nbsp;Agent，到底能不能让人放心当个“甩手掌柜”。</p>\n  <h2><strong>别人的攻略能直接变成我的行程吗？</strong></h2>\n  <p>我选择了一篇小红书爆款笔记：“西安citywalk，湘子庙到含光门”。不用切换任何页面，把链接贴进常驻在APP底部的飞猪帮帮智能面板，然后等回答。</p>\n  <p>它倒是反应很快。几秒钟后，一份完整的3天2晚行程路书就生成了。出发地自动识别到了我当前的所在城市北京，出发日期合理性过关，按照打工人的周末游习惯，给了一个“周五晚出发、周日晚返回”的建议。</p>\n  <p>飞猪帮帮还补了一句：<strong>“相比刚才的笔记，本攻略补齐了从含光门登城墙的电梯攻略、每日动线衔接以及周边高口碑的烤肉与创意菜推荐。”</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_0600639aef8b48628e021009d21dd7a2@6062546_oswg113666oswg449oswg552_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>三天的路线摊开在地图上，按颜色区分：Day1城墙片区、Day2大雁塔片区、Day3教堂片区。走向基本贴合原笔记，但细节上又做了修正。陕西历史博物馆门票紧俏，提醒提前预约；8月西安紫外线强，建议傍晚5点后再上城墙。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_7ed1c7fe3ea84e0c90c9c52ff4eeda32@6062546_oswg100516oswg401oswg513_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>攻略是极简版的，要用的时候，可以让它动手升级成路书。</p>\n  <p>这一点与大家都在用的通用AI有很大不同。从话术来看，通用AI毫无疑问表现更好，推理过程鞭辟入里、生成方案表达优美，相比之下飞猪帮帮就略显逊色了；<strong>从可执行性来看，飞猪帮帮的优势巨大，时空和路网合理性、旅行建议针对性上更胜一筹，尤其是其详细版的路书。</strong></p>\n  <p>点开路书细看，它把原攻略里散落在图文和视频里的信息重新拆解、对齐到了飞猪的供应链上。Day1的动线是湘子庙—书院门—碑林博物馆—西安城墙—钟鼓楼广场，保留了原帖的Citywalk精髓，但每个景点下面都附了推荐理由和具体建议。</p>\n  <p>比如湘子庙逛完可以顺路去Virgo Coffee喝杯樱桃燕麦拿铁，碑林逛完建议打车或骑行去含光门，含光门遗址博物馆里有电梯直达城墙上方。<strong>这些细节原帖没提，但对于一个不爱爬楼梯的人来说，能不能找到含光门的电梯入口，体验差得不是一星半点。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_0dd68dda7d95434d984e6ac2fdf91eac@6062546_oswg223350oswg603oswg529_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_6c227e0859a24e0283af10b138faea0e@6062546_oswg236451oswg587oswg529_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>飞猪帮帮的建议给出了具体的商品：</strong>南门附近新开业的酒店，可以步行到湘子庙，非常方便；晚餐推荐永宁门的醉长安，4.6分超赞，还标了“必点两斤重的超级狮子头”；西安城墙门票53元起。东航MU2120，大兴20:30起飞，620元，可以直接预订——是的，“直接预订”的意思是，如果这个时候你愿意说“帮我下单”，它会乖乖生成订单页，让你确认费用细节后，再执行下单动作。带钱的事情，AI现阶段还是很谨慎。但单论能力，它确实已经能做到不跳转、不用点击，就在原界面内完成付款。</p>\n  <p>这些都是社交平台网红攻略或者通用AI往往不会替你操心的事。<strong>往下翻还有一张预算参考表，交通、住宿、门票分别算好，总计1737元起，甚至能拖着滑块把预算从1032元一路调整到7224元，得到不同档位的方案。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_977f3145718540fd9b0f3da4e89bce85@6062546_oswg55295oswg527oswg630_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>如果你经常担任团建组织者，还可以把这份路书以长图形式分享到微信群里，</strong>收集完“想看兵马俑”“想吃得再地道点”这些团队的意见后，截图丢回对话框。它会自动识别、参考，再给一版照顾了大家的新方案。</p>\n  <p>飞猪帮帮没有把攻略换个格式复述一遍。它把“怎么去、能不能订、多少钱”这几个原本要靠自己一条条查的东西一次性补全了。预算这块甚至给到了能拖动的可视化区间，这是普通攻略帖完全做不到的。</p>\n  <p>不过在实测中我们也发现，如果原攻略里包含了一些极度小众、未被公共数据库或飞猪平台标准化收录的冷门地标（比如某条街角网红小摊），AI在匹配精准商品时仍需人工进行二次确认。<strong>但即便如此，它已经将过去动辄需要两三个小时的“做攻略”时间，压缩到了只需确认最终方案的几分钟内。</strong>未来或许时间能更短，但是短时间和靠谱的感觉如何平衡，或许是那时飞猪的产品经理们要面对的新功课。</p>\n  <p>从一条网红攻略到一张可预订的行程单，中间那些原来需要我手动填的坑，飞猪帮帮基本都有能力帮忙填。</p>\n  <h2><strong>能不能聊着聊着就把事情搞定？</strong></h2>\n  <p>真正让我觉得交互方式变了的，还有另一个场景。</p>\n  <p>在西安行程生成后，我想调整酒店。原本推荐的酒店什么都好，但不是宠物友好，没办法让我带着狗狗一起住。传统App的筛选逻辑是：点进酒店频道—选择入住日期—勾选“允许携带宠物”—再筛选“景观房”，最后让系统按照距离排序列出具体的酒店列表。</p>\n  <p>操作路径长，而且“能看到夜景”这种感性诉求在筛选栏里基本不存在。<strong>但在飞猪帮帮的对话框里，我可以直接语音告诉它：“找一个距离湘子庙1000米以内、房间能看到夜景且宠物友好的酒店。”</strong></p>\n  <p>它理解了这个需求，给出了几家符合条件的酒店。西安钟楼永宁里亚朵酒店，距离湘子庙直线350米，标注了“允许携带宠物”和“提供亚朵标志性的舒适景观房”，点击预订就能支付。另一家是2024年新开业的希尔顿花园酒店，设施现代，且品牌通常对宠物友好。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_a3f7d2e8d753425c81ed74784836d623@6062546_oswg1362447oswg1080oswg1670_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>以前我们用App，是在学习它的语言：比如“宠物友好”藏在哪个筛选项里、怎么找“景观房”的标签。现在是App在学习我们的语言，就像聊天一样，它来翻译成它能理解的条件组合，再去匹配和执行。</p>\n  <p><strong>总的来说，AI Agent改变了App和人交互的方式。</strong></p>\n  <p>其实这就是近两年一直被讨论的LUI（语言用户界面），说白了就是不用再一层层点菜单、勾选项。直接开口说需求，AI听懂了就去执行。与之相对的是我们熟悉的GUI（图形用户界面），也就是点按钮、滑列表这种图形化操作。市面上一些打着“AI”旗号的旅行产品，做法通常是在原来的App里加一个对话框。这种逻辑是AI in X，AI更像是一个额外挂上去的功能模块。</p>\n  <p><strong>但飞猪的思路更像是X in AI，整个产品能被AI这套语言逻辑驱动起来。</strong></p>\n  <p>不过从目前的设计来看，飞猪也没有过于激进，GUI方式依然被保留下来，毕竟在给定条件的标品筛选上，姜还是老的辣。但在必要的时候，用户可以在LUI界面让AI Agent帮自己操作GUI。</p>\n  <p>作为一家商业公司，保持一些“老登”时代的产物，不是什么奇怪的事。另一方面，为了AI而AI、在用户习惯了的场景里强行做改变，可能又滑向了另一个极端。</p>\n  <p><strong>以用户的真实需求、真实效率出发，而不是从是否性感、是否有宏大叙事出发，这是飞猪帮帮目前在产品主张上给人留下的一个印象。</strong></p>\n  <p>当然，这种交互方式实测下来也不是完全没有瑕疵。毕竟“能看到夜景”这种需求，本身就比“距离1000米”更难被标准化验证。飞猪帮帮可以根据酒店的景观房、位置和已有信息进行匹配，但最终住进哪一间房、窗外到底能看到怎样的夜景，还是最好在下单前确认一下。</p>\n  <p>但把一句带着好几个限定条件的“人话”精准翻译成几家具体可订的酒店，这种“能动嘴就不动手”的操作已经让人体会到了交互方式质变所带来的爽感。</p>\n  <h2><strong>旅行中最烦人的琐事，能办成吗？</strong></h2>\n  <p>如果说规划路线和搜索酒店还算“行前准备”，那么真到了出行阶段，那些甩不掉的琐碎杂活，才是榨干年轻人出游精力的罪魁祸首。</p>\n  <p>这也是飞猪帮帮真正让我觉得惊喜的地方，<strong>它开始处理那些我明明知道该怎么办，却懒得亲自去办的琐事。</strong></p>\n  <p>比如酒店升房。如果你是某大牌酒店的会员，入住前其实可以打电话问问前台有没有免费升级房型的机会。道理大家都懂，万一捡到一个升级，几百上千块的差价就省下来了。但真正到了入住当天，大多数人的状态可能是：拖着箱子到了酒店，只想赶紧check in，前台经理面带微笑地迎接你，但因为当下没有库存，升房这茬索性就不提了。</p>\n  <p>就算提前沟通，也得自己找电话、从前台转到另外一个部门、报名字和手机再看一看。成功了当然开心，没成功也得接受现实。</p>\n  <p>这件事，现在可以直接交给飞猪帮帮了。它会自动联系酒店前台，用会员权益去询问能不能升级。<strong>发布会现场，我们听到了AI打出一通电话与酒店协商的真实录音：先说明身份和需求，再向前台确认能否从原来的房型升级到豪华大床房，得到确认后，还会再次核实订单信息。</strong>整段对话听起来和真人打电话没什么区别。</p>\n  <p>最妙的地方是，它替你争取的是一个你很容易忘记使用的权益。</p>\n  <p>值机也是一样。以前为了选一个好座位，得记得值机时间，到了点赶紧打开App，输入订单、进入值机页面，再从一大片座位里抢一个自己想要的位置。尤其是前排靠窗这种热门座位，稍微晚一点，可能就只剩下最后一排。</p>\n  <p><strong>现在可以提前告诉飞猪帮帮：“帮我值机，尽可能前排靠窗，如果没有，靠过道也可以。”等航空公司开放值机，它会自动去完成这件事。</strong>这种体验其实很像多了一个靠谱的助理：它能记住，并且长线操作这件事。让它去办事，你忙别的就好。</p>\n  <p>不过，这里飞猪也坦诚，值机功能的好用与否，不完全取决于AI能力的高低，背后还涉及到航司的接口、不同程度的授权与合作。目前值机功能只覆盖了一部分，未来扩大范围也同时需要行业侧共同为适配AI时代而做出努力。</p>\n  <p>最能体现办事能力的，还有旅行中真正出意外的时候。</p>\n  <p>假设我买了一张机票，结果临出发前航班取消了。我们的第一反应通常是自己查通知、找改签入口、打航空公司电话，改完机票之后又突然想起来：那我订的酒店怎么办？机场接送怎么办？门票怎么办？如果是中转行程就更麻烦，前一张航班变了，后面的所有安排可能跟着一起塌。</p>\n  <p>飞猪帮帮能做的是，在用户授权后持续关注航班状态。<strong>一旦收到航班取消通知，它会结合原本的旅行计划和航司改签政策，分析怎样调整对后续行程影响最小；如果同一个目的地还有接送机等关联订单，也可以进一步协助处理退改。</strong></p>\n  <p>体验下来，这种“主动办事”确实有了“智能”的感觉。</p>\n  <p>它的好用，在于真正有了连接物理世界的履约与代办能力。从过去事事都要自己设闹钟、打电话的“操心命”，到如今交代一句话就有AI在后台默默帮忙盯着进度，解决突发风险。被服务的情绪价值，可能才是人类底层最喜欢的AI创造。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260814/v2_99c61391a3a34e8392fd36aa1f39d487@6062546_oswg351oswg1080oswg43_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>当越来越多的决策与琐事可以一股脑地交给&nbsp;AI，大家会发现，<strong>它真正改变的是把人从繁琐的“旅行内耗”中彻底解脱出来，去重新享受旅行本身。</strong></p>\n  <p>再往前看一步，为什么让旅行AI真正落地的，是飞猪这类OTA（在线旅行社），而不是那些看起来无所不能的通用大模型？</p>\n  <p><strong>因为能聊和能订之间，隔着整个供应链。</strong>旅行AI真正落地的门槛，是它能不能摸到真实世界的供给。通用大模型可以给你一份看起来完美的行程单，但它不知道哪张机票真的能出票，哪间房真的能订到。而OTA多年来搭建的供应链和数据体系，恰恰是这件事的地基。所以，飞猪帮帮能做到这些，一点都不意外。</p>\n  <p>（图片源自飞猪APP截图）</p>", "category": "tech", "published_at": "2026-08-14T14:08:10+00:00", "fetched_at": "2026-08-15T00:57:50.387506+00:00", "fingerprint": "0ff327494dd2dc42"}, {"source": "少数派", "title": "派早报：深度求索推出开源 Agent 框架 DeepSeek Harness 及配套插件生态", "url": "https://sspai.com/post/113434", "summary": "阿里千问开放平台上线菜鸟智能体，Brave 和  Firefox 浏览器宣布将继续支持 uBlock Origin 扩展程序等。<a href=\"https://sspai.com/post/113434\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-14T00:52:24+00:00", "fetched_at": "2026-08-15T00:57:48.928630+00:00", "fingerprint": "519955c6c9e88723"}, {"source": "少数派", "title": "App+1 | 把图标收进格子，DeskBox 让桌面整洁有序", "url": "https://sspai.com/post/112279", "summary": "DeskBox 让 Windows 桌面上散落的文件、待办和临时信息，都有一个顺手的位置。<a href=\"https://sspai.com/post/112279\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-14T02:54:21+00:00", "fetched_at": "2026-08-15T00:57:48.928624+00:00", "fingerprint": "dc85078408cd929f"}, {"source": "少数派", "title": "声擎×少数派｜「角落新声」征文活动获奖结果公布", "url": "https://sspai.com/post/111709", "summary": "那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅，是如何被你切片、重排并注入新生的？<a href=\"https://sspai.com/post/111709\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-14T03:44:03+00:00", "fetched_at": "2026-08-15T00:57:48.928617+00:00", "fingerprint": "40892d1f85e594ff"}, {"source": "少数派", "title": "你初高中时的书单里，总有本「东野圭吾」吧？", "url": "https://sspai.com/post/113416", "summary": "纪念并且感谢他为我们留下的推理世界。<a href=\"https://sspai.com/post/113416\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-14T07:00:00+00:00", "fetched_at": "2026-08-15T00:57:48.928609+00:00", "fingerprint": "ceb571bbec7d9ffd"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 9 部作品", "url": "https://sspai.com/post/113459", "summary": "📅本周新预告《不存在的罪人》正式预告8月11日，电影《不存在的罪人》发布了正式预告，将于10月2日在北美上映。迈克尔·肖沃特执导，安妮·海瑟薇、达科塔·约翰逊、乔什·哈奈特主演，当红小说家留下未竟手稿 ...<a href=\"https://sspai.com/post/113459\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-14T09:50:02+00:00", "fetched_at": "2026-08-15T00:57:48.928597+00:00", "fingerprint": "f3fe60adbf44247d"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7742 CNY ↑+0.40%", "url": "https://www.frankfurter.app/2026-08-14?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-08-14</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7742 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0191 (+0.40%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-08-15T00:57:47.825481+00:00", "fingerprint": "a99fed52104fafb0"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
