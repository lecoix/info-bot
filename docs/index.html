<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

": "2026-10-31T03:49:55.683495+00:00", "fingerprint": "8edfa603fa5ede8d"}, {"source": "36氪 - 最新文章", "title": "新石器4亿美元融资背后，物流小车行业走到哪一步了｜最前线", "url": "https://36kr.com/p/4048024522553603?f=rss", "summary": "<p>10月20日，新石器宣布完成E轮近4亿美元融资，由博裕投资与某国家级基金联合领投，阿里巴巴AEF NextGen香港基金、广汽资本、纪源资本、淡马锡旗下Vertex Growth等参投。</p>\n  <p>这是今年以来国内自动驾驶领域最大单笔融资之一，新石器CEO余恩源在一场媒体沟通会中对外透露，原计划融2亿美元，最终接近4亿，本轮融资是超募结果。</p>\n  <p>融资本身不是新闻的全部。真正值得关注的，是这笔钱背后，资本对物流小车这门生意的评判标准，正在发生明显转移。</p>\n  <p>过去几年，自动驾驶行业习惯用里程、接管率、激光雷达数量和模型参数讲故事。但在无人配送这个细分场景，新石器CEO余恩源反复强调一个指标：TCO，即全生命周期综合运营成本。</p>\n  <p>他把TCO拆成硬件、安全、技术、云服务、运维等近十项子指标，再向下细化为几十个可执行项：比如免充气轮胎，看似微小，却是没有司机换胎场景下的真实成本项；比如车辆生命周期从5年拉到8年，日均有效服务时长从12小时提升到18小时。</p>\n  <p>这套算法的客户侧版本很简单：传统人力配送一公里约1元，无人车自身TCO可以将成本压到0.25元，售价压到0.5元，对于客户而言，成本可以直接下降一半。</p>\n  <p>这就是物流小车的商业化逻辑，当政策逐步放开、场景逐步起量，决定采购的不再是技术情怀，而是运营账本。</p>\n  <p>新石器目前的收入结构里，卖车仍占大头。但余恩源表示，新石器希望未来逐步从卖产品转向卖服务，把车做成履约服务，由合作伙伴持有资产、获取客户、负责充换电运维，新石器则提供核心的自动驾驶能力和调度系统。</p>\n  <p>他认为，物流行业是一个开放性复杂系统。3000多万辆城配存量车、上千万种货物类别、千奇百怪的末端场景，没有任何一家企业都服务不过来。开放性意味着机会，新石器给自己定位的不是汽车公司，而是运力网络运营商。</p>\n  <p>把制造环节交给上汽大通、五菱、广汽，自己则守住场景认知和运营体系，新石器认为，物流小车行业未来的利润池，不在整车毛利，而在规模化运营后的边际成本递减。</p>\n  <p>新石器的海外业务也在同步推进，目前已进入20多个国家，中东、欧洲、东南亚、东北亚同步推进，余恩源透露，内部目标是3-6年内，海外收入超过国内。</p>\n  <p>他同时指出，出海的难点不在卖车，而在合规。数据不能出境、云资源、员工团队都需要本地化，路权逐城谈判。并且单一区域规模不够，商业模型也跑不通。市场和政府的双重支持下，中东地区将是新石器的重点海外市场。</p>\n  <p>面对GPT-6、世界模型、VLA等大模型浪潮，新石器的态度意外冷静。余恩源的判断是：底座模型越强，应用层越受益；但物流场景要的不是最强模型，而是ROI最好看的模型。</p>\n  <p>目前，新石器的技术投入集中在三个方面：端到端模型与数据飞轮、产品效能迭代以及云端调度系统。余恩源表示，单个城市无人车密度超过有人商用车，负责调度的云端大脑便会成为刚需。而这套调度系统，非常依赖实际运营经验。</p>\n  <p>2026年被新石器定义为无人配送爆发元年，政策持续利好，规模同比增长约三倍，但更值得注意的是场景边界的松动。</p>\n  <p>过去无人车主战场是电商快递，今年开始外溢到工厂内部运输、仓到仓、服装集群、产业园区。余恩源坦言，不少场景是被合作伙伴拽进去的，原本以为不成立，跑起来才发现成本结构较专用AGV和面包车更好。</p>\n  <p>对于行业是否格局固化的提问，余恩源的回答是：现在只是春秋时代。</p>\n  <p>一方面，头部公司在车队规模、供应链、路权积累上已经拉开身位；另一方面，场景仍在扩散、成本曲线仍在下探、政策细则仍在试点。尾部没清，头部也没稳。</p>\n  <p>余恩源在沟通会的最后表示，新石器把安全写进了全员OKR第一条，他认为，未来三年最大的变量，不是模型多强，而是安全与舆情。一次恶性事件或大面积干扰公共交通，都可能让地方政策收紧。</p>", "category": "tech", "published_at": "2026-10-30T07:25:27+00:00", "fetched_at": "2026-10-31T03:49:55.514576+00:00", "fingerprint": "3227b12918fbc110"}, {"source": "36氪 - 最新文章", "title": "AI初创企业的下半场：钱往哪里去？", "url": "https://36kr.com/p/4048078906800642?f=rss", "summary": "<p>作者｜王晗玉</p>\n  <p>编辑｜张帆</p>\n  <p>2026年的风险投资市场，正在上演一场前所未有的“AI大分流”。据Crunchbase数据，今年上半年全球初创企业融资额约5100亿美元，已超过去年全年；仅第一季度，约80%的风险投资便流向了AI公司。OpenAI单轮融资1220亿美元、估值冲上8520亿美元，Anthropic则以9650亿美元估值反超，成为全球最有价值的AI初创企业。</p>\n  <p>狂热之下，分化同样剧烈：头部模型公司融资能力依旧惊人，大量垂直应用却是有用户、难见利润。</p>\n  <p>市场不再比模型参数，开始比应用落地，“AI下半场”的拐点叙事，正在取代此前的算力军备竞赛——对于仍在牌桌上的初创企业而言，生存规则已经变了。</p>\n  <p>当全球资本涌向高增长机会，下一站究竟在哪里？11月2日至3日，香港金融科技周×StartmeupHK 2026即将举行，市场目光将再度聚焦这座连接内地创新与全球资本的城市。在科技周启幕前，36氪与华映资本创始管理合伙人季薇、香港投资推广署署理初创企业总裁吕缙勇进行了深入交流，试图回答一个问题：AI初创企业的下半场，什么才是真正的判断标准？</p>\n  <h3><strong>拼过模型参数，再拼“数据飞轮”</strong></h3>\n  <p>“阅项目”无数的季薇先给出一套大致的分析框架：AI投资可分为基础层、模型层与应用层三层。基础层涵盖GPU、高速光互联、先进封装、存储体系乃至供电热管理，以及推理调度、异构算力适配、数据治理与安全等系统级环节。</p>\n  <p>外界对“算力投入过度”的质疑，在她看来更多是节奏问题，而非方向问题——<strong>基础设施投入与收入形成之间，天然存在周期错配</strong>。正如2000年前后，海底光缆与交换机先于互联网公司的盈利而繁荣，彼时谷歌甚至还没有收入。</p>\n  <p>真正决定一个细分赛道能走多远的，是她数次提及的“数据飞轮”：<strong>数据以什么成本获取、以什么形态进入模型，能否在短时间内形成正反馈、反哺模型能力</strong>。</p>\n  <p>这也是为什么编程是目前收入规模最大的AI应用——代码对错一目了然，正反馈极强；而视频生成虽需求真实，却因反馈难以标准化，模型提升的难度高得多。正如OpenAI停掉Sora，Anthropic从未碰过视频，背后正是对这一点的判断。</p>\n  <p>市场的验证来得很快。Cursor年化收入在一年内从突破10亿美元涨至约26亿美元，GitHub Copilot付费用户已超470万。在季薇看来，任何一个AI应用赛道的天花板，最终都取决于市场规模与用户注意力总量，而非单点技术炫技。</p>\n  <p>吕缙勇则从需求侧补充了另一层标准：能否解决真实、高频、高价值的痛点，客户是否清晰、有付费意愿，技术壁垒能否持续转化为成本优势——经历过互联网泡沫洗礼的人都知道，泡沫破裂后活下来的公司，无一例外先站稳了商业模式。</p>\n  <h3><strong>具身智能：最热闹的赛道，最“早期”的阶段</strong></h3>\n  <p>在季薇眼中，具身智能依然是AI应用里最活跃的领域，也是最“早期”的领域。模型发布与评测的频次仍在持续，说明最聪明的大脑还在涌入，只是尚未等到属于它的“chatGPT时刻”——<strong>她给出的保守时间预期是5-10年，但非常相信这个时刻会到来</strong>。</p>\n  <p>一个被反复澄清的观点是：具身智能不等于人形机器人。它可以是海底的仿生形态、低空的自主飞行器，也可以是太空中的柔性机器人，去做人类到不了的地方的工作。</p>\n  <p>华映资本在这些方向均有布局，包括低空自主飞行机器人，以及中国首家在太空完成验证的柔性机器人；其投资的具身智能世界模型公司——自变量机器人——也是目前在香港活跃的世界模型团队之一。</p>\n  <p>吕缙勇同样认为，具身智能是“模型+硬件+数据+场景反馈”的系统工程，各环节尚未真正咬合：打螺丝仍需人类工程师在旁边兜底，物流搬运的稳定性也远未达标，眼下能落地的更多是巡逻、巡检这类相对受限的场景。</p>\n  <p>市场的预测也在印证这种“早期”共识。摩根士丹利预计，中国人形机器人市场规模今年约20亿美元，2030年或达150亿美元；不同机构对广义具身智能的测算口径差异明显，从数千亿到万亿不等。</p>\n  <p>对香港而言，<strong>AI与智能制造、AI for Science、绿色能源管理，以及金融、医疗、物流等高价值企业级应用，正是未来3-5年最有潜力的方向</strong>。</p>\n  <p>吕缙勇特别提到，香港的研究型大学沉淀了大量科研IP，AI介入实验室的意义在于把“爱迪生式的试错”大幅缩短——从干实验到湿实验，减少人为失误、提高命中率，这可能催生一批高价值的突破性成果。而大湾区的制造生态正在与香港的科研资源加速融合，也让具身智能的供应链有了更现实的落地土壤。</p>\n  <h3><strong>现金流成为创始人的必修课</strong></h3>\n  <p>当36氪问及那些手头现金快撑不下去的中小AI初创公司该何去何从，吕缙勇的建议很直接：<strong>尽早做一次冷静的现金流分析</strong>，聚焦能带来正向现金流的业务，砍掉非核心开支；资金见底时，应坦诚与战略投资者沟通，而非等危机爆掉后才求助。政府补助也应尽早纳入规划，而非临到融资时才想起申请。</p>\n  <p>季薇也提到，<strong>现金流管理是创始人的必修课</strong>，“口袋里只剩1-6个月的钱，还在问该怎么花，多半要反省自己的规划能力”。</p>\n  <p>在她看来，<strong>业务的里程碑必须与融资的里程碑咬合推进</strong>——从政府科研经费、早期机构的成果转化支持，到市场化机构，再到能带来订单与资金的产业资本，每一步都要提前规划，而不是埋头干一年再抬头找钱。</p>\n  <p>她也认为，并购不应被视为危机管理，而是发展过程中的主动选择，真正的“1+1&gt;2”才值得做。</p>\n  <p>结合过往投资案例，季薇专门提到一个真实的转型样本：一家原本做培育钻石自动化切割打磨的公司，凭借核心工艺积累转向芯片堆叠所需的散热材料，在半导体领域找到了第二曲线。在她看来，AI在各行各业的应用都还在早期，拥有核心技术壁垒的公司，换个赛道再试一次，并不算晚。</p>\n  <h3><strong>如何答好“出海”这道题</strong></h3>\n  <p>谈及即将到来的香港金融科技周×StartmeupHK 2026，季薇透露，她将在科技周上与另外两位嘉宾带来一场对话，主题是《全球资本新动向：解码下一个黄金投资赛道》，“其实跟今天聊的还挺类似的”。吕缙勇笑着接了一句：“今天已经剧透了。”</p>\n  <p>而站在香港市场，话题也自然落到了内地企业出海这道必答题上。</p>\n  <p>季薇专门提到华映资本参与投资的协作机器人企业法奥机器人，这家公司在2025年位居中国协作机器人总销量第一、海外出货量第一。在季薇看来，它的发展很契合一句话——“Think Global, Act Local”（全球化思考，本地化运营）。</p>\n  <p>季薇认为，传统出海路径往往是先设海外主体、参展、签代理，再找客户需求；但真正有效的路径或许恰是从客户出发，想清楚对方需要什么、预算多少、谁做采购决策、替代方案有哪些、数据如何处理、售后由谁负责等问题。</p>\n  <p>因此，<strong>数据合规、知识产权、出口管制与安全审查等一系列规划要前置到产品设计阶段，而不是铺完市场再补课。</strong>她也不建议一上来就全球铺开，而是先在一个标杆市场跑通，再向相邻市场复制。</p>\n  <p>吕缙勇对此的补充是，跑业务除了要快，更要精准接地气。企业出海要尽量避免把内地“跑省份”的复制打法直接搬到海外——每个城市的文化、法规甚至历史背景都不同，尊重当地规则、组建本地销售与交付团队，接地气地跑业务往往比技术本身更重要。</p>\n  <p>在这套出海叙事里，香港的独特角色也正被重新理解。研发、供应链与应用场景可以放在一小时生活圈内的大湾区，国际融资、区域总部、合规架构与人才引进则落在香港。依托普通法体系与国际仲裁经验，海外客户更愿意与香港主体签约；香港也正帮助企业把内地的创新能力，转化为国际客户可以长期信任的商业关系。</p>\n  <p>过去一年多，华映资本把香港视为“再创业”的基地：申请牌照、筹备港币基金，未来投向将面向全球优秀创业者与前瞻性技术突破，并深度参与香港本地高校的科研转化。同时据季薇观察，越来越多的风险投资同行也正在加强在香港的布局。</p>\n  <p>来到AI下半场，香港这个连接内地创新与全球资本的双向门户，也不再只是大企业的上市终点站，而正成为更多AI初创企业的出海桥头堡。一如吕缙勇送给出海企业的建议：出海之前，先来海边看看。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_6fa547b36f8a45fe87f30b87e20bf256@5623968_oswg104094oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-10-30T08:00:29+00:00", "fetched_at": "2026-10-31T03:49:55.514570+00:00", "fingerprint": "456d00e6a36ef3d0"}, {"source": "36氪 - 最新文章", "title": "第一批用上WorkBuddy的乙方，已经提前下班了", "url": "https://36kr.com/p/4048085285763584?f=rss", "summary": "<p><strong>撰文｜深海</strong></p>\n  <p><strong>封面来源｜《装腔启示录》截图</strong></p>\n  <p>乙方，大概是职场里最“时间贫困”的一群人。</p>\n  <p>客户的需求就是个盲盒，在打开对话框之前，你永远不知道这次是“简单优化一下”，还是“我们换个方向试试”。广告公司的大楼灯总是亮到深夜，只因甲方的意见历经层层审批，在最后关头才能抵达乙方的信箱。</p>\n  <p>乙方的时间总是非常紧迫的。但工作做不完倒也真不是因为没灵感，恰恰相反，很多时候是甲方要的太多，而每一份创意都要被单独包装成一套能汇报、能交付的完整材料。很妙的创意，都要经历一整套形式整改，把它翻译成客户听得懂的逻辑、老板看得见的重点，以及设计、文案和渠道同事都能够执行的方案。</p>\n  <p>所以乙方听起来是内容行业，说穿了却是流水线上的搬砖工。</p>\n  <p><strong>好在，打工人已经学精了，懂得给自己的工作“摇人”——他们接上了AI同事，把那些最耗时间的执行工作交出去，终于有机会提前下班。</strong></p>\n  <p>这位新同事，就是WorkBuddy。</p>\n  <h2><strong>AI同事，为打工人的创意“续命”</strong></h2>\n  <p>乙方的工作就像一场接力赛。想出一个好点子只是跑完了第一棒，后面还有资料梳理、方案搭建、文案打磨、视觉呈现，环环相扣地等待着你，以及让你血脉喷张的“再调一版看看”。</p>\n  <p><strong>谁懂一个人跑完这些环节的无力？但接上一位靠谱的AI同事后，打工人就像有了一位外包供应商，不再是单打独斗。</strong></p>\n  <p>互联网大厂打工人张六一，每逢提案前48小时，焦虑型人格就会准时上线。项目组常常是平地一声惊雷，又整了什么需要宣传的新活儿，接着就请策划同事迅速协同，把他们的“半成品”包装成还值得一看的新品。这种强行“从无到有”的需求已经不是第一次了，每次她都要同时准备几个方向，请各位同事审阅，挑一个还能看的继续改。</p>\n  <p>过去她经常要处理突发需求到深夜1点多才打车回家。但成为职场老油条后，她总结出了一套新的应对策略——她会在记事本上罗列几个核心概念，写下她根据过往经验包装出的金句，以及那些一闪而过的想法雏形，它们仅仅出于好像可以延展，但还暂时无法向他人展示的阶段。</p>\n  <p><strong>接着，把这些key message打包丢给WorkBuddy，让它拆解概念，形成三套完整的传播方案。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_7442dba0e6bc4454a28dabc688af05cf@6062546_oswg164507oswg1080oswg802_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>紧接着，AI同事就会帮她拆出待办清单：人群怎么分析，亮点怎么提炼，传播主题怎么确立，渠道怎么规划。AI同事早就帮她预设好了难缠的同事会怎么challenge她，并把没写清楚的板块一一列举。</p>\n  <p>方向逐渐清楚后，WorkBuddy还能继续协助梳理选题、打磨文案、提供Slogan备选。等六一拍板后，再把方案整理成一份完整的PPT。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4ce34b473e034209893ce9b27cf5b979@6062546_oswg359275oswg1080oswg797_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>根据六一的经验，虽然AI大模型在创意上还没有办法给她太多的帮助，但在完成这些琐碎的执行工作上，效果拔群。<strong>这就是人脑和人机最高效的组队方式。她称之为让AI同事给创意“续命”。</strong></p>\n  <p>这种工作模式，尤其适合那些挑剔的“感觉者”甲方。如果客户看完表示“内容没问题，就是整体感觉不太对”，或者说“案例可以，但文风/形式还不够趣味”，那她也不必逐字逐句修补，直接几个抽象的形容词丢过去，就能让方案统一翻新。就这样，小张终于摆脱了“PPT工人”的定位，变回了真正负责判断方向的策划。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_88c358343e5e4963884cca50034595bc@6062546_oswg282169oswg1080oswg798_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>当然，方案通过仅仅只是个开始。在创意进入落地阶段，执行层面的琐碎才真正开始。</p>\n  <p>在无数繁琐的事务中，六一最苦恼的是整理活动出席嘉宾和媒体投放名单。她经常需要在一长串达人名单里，理清人员、报价、档期和投放内容区隔度。这么多投放资源，人工整理相当费眼，对ADHD来说还相当不友好。经常是做到一半被另一位嘉宾的信息吸引注意，又忘记了手头刚才在做什么事。</p>\n  <p>正因如此，AI工作台出现后她觉得自己是最大的受益者。<strong>现在她会把这些突然出现的update，直接复制给WorkBuddy，让它整理成结构清晰的排期表和预算表。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_f94944f1c4fc4abda5e33da49b3405a5@6062546_oswg132367oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>前段时间她追了热播剧《早春晴朗》，其中有个被广告人猛猛吐槽的过时桥段：女主因为能记住Excel快捷键被同事夸赞，成功职场救火。<strong>Excel列表之前确实让六一很是头疼，但现在，她可以直接口头描述，让WorkBuddy帮自己修改表格信息，效率大大提高。</strong></p>\n  <p>有了AI同事的加入后，人类能把更多精力投入在创意本身，发挥主动性。</p>\n  <h2><strong>偷偷用上AI同事的打工人，约等于拥有一支广告团队</strong></h2>\n  <p>其实做内容的人，多少都经历过这种时刻：大脑放空的时候文思泉涌，一坐到电脑前就又四大皆空。</p>\n  <p>内容行业的人都认可一个道理——创意是需要滋养的，否则它就像水一样从大脑皮层上滑过，最后只留下一句“我刚才好像想到一个特别好的东西”。<strong>而有了AI同事，相当于身边多了一支24小时在线的执行团队，它专门负责把转瞬即逝的想法拓展为成熟的内容。</strong></p>\n  <p>在某中小厂做渠道运营的李狒狒对此深有体会。不如说她的主要工作就是为同一套宣传物料做适配，针对不同的平台“入乡随俗”。视频号、公众号、小红书、微博、抖音，热搜话题要有针对性，封面要匹配平台调性，文案的语气、输出角度、整体气质都要相应改变，不能完全照搬。</p>\n  <p>看起来，狒狒好像是在做同一件事，却仿佛同时完成了五个项目。现在她会把这“五个项目”都外包给AI同事——一套标准化素材丢给WorkBuddy，让它生成不同平台需要的尺寸、风格和文案。</p>\n  <p>狒狒再也不必再把下班时间献给机械性的调整工作，她的“一人团队”里已经多了一位专管渠道适配的执行，值得一提的是<strong>WorkBuddy自带Skillhub，已经接入了小红书、公众号、抖音和视频号等运营技能，连不同渠道的表达方式也预存好了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_1c01b0cc45b34592826dde09db33fac5@6062546_oswg391412oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>找图和做视频，则是另一个时间黑洞。</strong>尤其是制作Vlog、花絮等内容时，经常会受到不同协作方发来的细小需求，可能只是某个画面的某一帧要加个马赛克；某个画面有些单调，需要配一点后期花字；这一帧画面的人脸偏暗，能不能调色调亮一点。</p>\n  <p>这些细小的需求，每次返工都要从头到尾生成修改一遍，尤其是AI生成素材风格不统一，就更容易让画面产生割裂感。在多个需求涌来时，就会造成更大的时间浪费。</p>\n  <p><strong>狒狒现在的做法，先用WorkBuddy的设计创意模式确定一张满意的样图，再让整套素材沿着这个方向生成。</strong>WorkBuddy接入了腾讯Miora，在生成平面、视频等多模态视觉资产时可以尽量保持统一的风格。WorkBuddy首页的创意设计专区，也覆盖了平面、视频、网页、品牌等不同创作方向。</p>\n  <p>并且在WorkBuddy里，她可以多窗口执行任务，一边是同步改着短视频脚本，一边是等着Miora产出成果，哪里不合适就当场点进Miora画布调整，不必等一整套内容做完后，才发现内容存在割裂感，再调回去重新返工。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4cc18f7a4ecd46aba301b0a08de5551a@6062546_oswg857295oswg1080oswg801_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>现在，狒狒只需要有一个WorkBuddy，不需要再打开多个软件窗口来回切换了。她记得自己刚开始工作时，还试图和公司申请配备一台显示器，好多窗口协作，但公司以“仅给技术部门配备显示器为由拒绝了”，她只能每天羡慕隔壁程序员的显示器。</p>\n  <p><strong>好在现在不用担心这个问题，狒狒可以把从描述想法到拿到素材的过程，都收进WorkBuddy的同一个任务里。乙方总把更下游的执行方叫“丙方”。如今，乙方打工人也能召唤自己的“AI丙方”了。</strong></p>\n  <h2><strong>乙方的效率差距，从AI同事开始拉开</strong></h2>\n  <p>越来越多打工人发现，召唤一位AI同事，简直就是职场大减负。</p>\n  <p><strong>重点不是AI能帮你把这件事做得更快，而是有些事能被丢出去，终于不必由你亲手做了</strong>——当内容策划、文案创作和视觉制作中的部分工作可以由AI协助推进，乙方的工作重心也会随之变化。</p>\n  <p>过去，一个人的精力常常被切割成许多小块——刚进入创意思考，就要跳出去处理格式；刚准备研究用户画像，又被拉去微调素材。等回来继续之前的工作，又要从头开始调整状态。一天看起来很忙，真正留给判断和洞察的时间却不多。</p>\n  <p>当AI同事接手部分重复性工作后，创作者才有机会把更多精力放回判断创意方向、理解客户需求和打磨内容细节上。与此同时，一个人的内容生产能力也有了拓展的可能。多平台、多规格的任务可能是一刻钟就被解决，冗长的流程也被缩短成了一个简略的任务窗口。<strong>一个人，也能借助AI同事成长为能够统筹内容落地的多面手。</strong></p>\n  <p><strong>这种变化未必会让每个人都立刻“升职加薪，走向人生巅峰”，但至少能让时间重新变得可支配。省下来的精力，可以继续研究内容，也可以拿来享受生活。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_d4528d17c17c4f6c8be364dc022f9e66@6062546_oswg768708oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图为AI生成</p>\n  <p>或许你会发现，某些同事最近的精神状态变好了，离开办公大楼也是越来越早了——那可能AI同事已经悄悄上岗了。</p>\n  <p>乙方的下一轮竞争不是比在岗时间。<strong>当大家的AI工具都走上正轨，真正的差距会转向谁能稳定组织工作流，谁能更快更清楚地拆解需求，谁能让人和AI各自做擅长的事。</strong></p>\n  <p>那么，从WorkBuddy开始这次职场升级，会是个不错的选择。它不是一个来抢饭碗的对手，更像一位终于到岗的好帮手。可以先试着把手里最烦的一件小事交出去，像是把零散的Brief理成清晰的需求清单，给卡住的Slogan补几个能继续讨论的方向，把定下来的创意概念整理成客户看得懂的提案，再生成几套适配不同平台的视觉，给老板一个直观的感受……</p>\n  <p><strong>要知道，创意行业的打工人省下来的不只是几个操作步骤，更是被反复打碎的注意力。</strong>少一些在琐碎执行里的无谓消耗，就能多留一点时间给洞察提炼、审美积累和生活感受。希望每一位引入AI同事的打工人，都能天天准时下班。</p>", "category": "tech", "published_at": "2026-10-30T08:12:08+00:00", "fetched_at": "2026-10-31T03:49:55.514564+00:00", "fingerprint": "08e2266920ff871f"}, {"source": "36氪 - 最新文章", "title": "72道工序、灵巧手进厂打螺丝：临界点数采手套发布，要补上触觉数据缺口｜最前线", "url": "https://36kr.com/p/4048092462070017?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>2026年10月29日，智元创新日·灵巧操作分论坛上，临界点（AGILINK）对外展示了灵巧手走向工业真实工况的关键进展。</p>\n  <p>在绍兴卧龙产线的POC验证工位，OmniHand灵巧手完成了对同系列灵巧手的出厂整机性能测试，连续跑完72道工序，从物料上料、螺丝锁固到自检、下料归位，全程无需人工实时干预。整套流程单轮耗时8.5分钟，比熟练人工的8分钟慢30秒，任务成功率达98%，可连续作业8小时。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_218895dffdcf401db1fabe4618a1aa8d@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">OmniHand灵巧手对同系列灵巧手进行出厂整机性能测试（图源/企业）</p>\n  <p>其中，螺丝锁固挑战最大。防脱螺丝本身存在毫米级晃动，叠加螺丝枪自重、线缆牵拉带来的反冲，手部只要偏移1毫米，枪头末端偏差就会放大到3至4毫米。测试过程中，团队还人为制造了机械臂推动、工装底座偏移、光照变化等干扰，灵巧手依靠视觉与触觉联动实时纠偏，遇到拧入失败也能自动回退、重新对位。</p>\n  <p>整套作业的稳定性，来自真机强化学习对单步操作能力的优化，以及工业部署智能体框架的支撑。后者负责工序校验、失败回滚与工站之间的状态同步。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_4ebb3902e3dc4718bb396d2a69a079bb@6022551_oswg2234240oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">绍兴卧龙产线（图源/企业）</p>\n  <p>临界点CEO乔天杰将这次产线测试定义为灵巧手行业从开发态走向部署态的标志性节点。“开发态比的是Demo精不精彩，部署态考核的是节拍、成功率、稳定性和ROI。”</p>\n  <p>在他看来，夹爪经过数十年迭代，可以覆盖工业场景70%至80%的确定性工序；灵巧手的目标是攻克夹爪难以胜任的余下20%至30%复杂精细操作。使用通用灵巧末端执行器，可以适配多类工序，减少传统产线中专机专用带来的改造成本与场景局限。</p>\n  <p>产线POC验证了硬件与作业框架在真实工位上的可行性，同时也把行业长期存在的数据短板摆上台面。</p>\n  <p>临界点首席具身科学家黄碧丹指出，当前多数灵巧操作模型训练依赖纯视觉数据集，缺失力反馈、触觉滑动等真实物理交互信息。模型在仿真中表现优异，迁移到真实物理环境却极易失效；温度、剪切力、接触形变这类触觉维度，很难靠仿真生成，必须经由真实物理交互采集。</p>\n  <p>而主流的两类数据采集路径各有短板：真机遥操采集的数据质量高，但成本昂贵、极度依赖专业操作人员，难以大规模扩量；第一人称Ego人手视角数据获取门槛低、场景覆盖广，但单纯依靠视觉跟踪，缺少真实触觉信息，精度有限，更多仅适合预训练，不足以支撑高精度精细操作任务。</p>\n  <p>针对上述痛点，临界点在活动上正式发布OmniGlove Pro数采手套，并开启量产交付，试图从数据源头确立新的质量评判标准。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_5c449b026e404bb0b1d0d955f2786d3b@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">OmniGlove Pro数采手套（图源/企业）</p>\n  <p>传统数采多以视觉层面人手动作复刻相似度作为标尺；“真机Ready”的核心逻辑是，人手在特定场景完成操作，经手套采集与后端处理后，机器人本体能在相同场景条件下复现完整任务，以此作为数据合格的核心判定依据。</p>\n  <p>硬件层面，OmniGlove Pro指尖采用EMF磁场定位与IMU抗干扰融合方案，全手布置高密度触觉感知点位，位姿与触觉信号保持高帧率输出，整只手套重量控制在较轻水平。在织物手套形态下，EMF提供指尖定位基准，全手触觉点位用于补偿柔性形变带来的��端定位误差。</p>\n  <p>形态选型上，团队选择织物手套方案，对日常操作侵入性更低，更适合长时间、大规模持续采集。同时，临界点自研的OmniHand灵巧手本体出厂时同样配置织物触觉手套，数采手套与执行本体在触觉点位分布和外形上尽量对齐，以降低从人类采集数据向机器人执行端映射时的信息损耗。</p>\n  <p>官方数据显示，截至2026年10月，临界点OmniHand系列灵巧手累计量产突破1.5万台。乔天杰认为，万台级量产是灵巧手走向商用部署的基础门槛，只有到达这一量级，供应链交付稳定性、整机良率收敛和成本下探才具备现实条件。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_23795ca2a8284b0487931e7967f7213f@6022551_oswg4364776oswg6000oswg3375_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智元创新日·灵巧操作分论坛（图源/企业）</p>\n  <p>依托工业与商用服务两条真实部署线的持续迭代，临界点灵巧手已在珠海长隆商用交互场景实现常态化运行；卧龙电驱的灵巧手工位预计年内完成正式产线并线。</p>\n  <p>从卧龙产线的工位验证，到OmniGlove Pro建立“真机Ready”的数据采集标准，临界点正试图跑通一条闭环路径：真实部署场景产生交互数据，高质量采集数据反哺模型迭代，迭代后的模型再解锁更多新工序。</p>\n  <p>活动现场，临界点宣布向本体厂商、场景集成方和模型研发团队开放触觉数据、操作模型与工业部署框架，以生态协作的方式扩大数据供给和场景覆盖。</p>", "category": "tech", "published_at": "2026-10-30T10:57:32+00:00", "fetched_at": "2026-10-31T03:49:55.514557+00:00", "fingerprint": "810e444560fae6e2"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨币安遭黑客攻击，致其30亿美元资产被冻结；“张雪机车”商标回归张雪；美股收盘纳指重挫700点，英伟达市值蒸发1.4万亿元", "url": "https://36kr.com/p/4049089058126344?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <ul>\n   <li>全球“股王”再度易主，传苹果2028年推出大屏折叠iPad</li>\n   <li>姆巴佩曾代言饮品被商家清理库存，部分门店单日销量为0</li>\n   <li>日本无印良品运营商称超2700万条用户信息或外泄，MUJI中国回应国内数据独立存储</li>\n   <li>首付降到4万以内，特斯拉推出“5年0息”购车方案</li>\n   <li>11月5日起，国内航线燃油附加费再上调</li>\n   <li>野人先生获首轮融资</li>\n  </ul>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>币安遭黑客攻击，致其30亿美元资产被冻结</strong></p>\n  <p>10月30日，全球最大加密货币交易所币安（Binance）曝出重大安全突发事件，市场多方消息显示该交易所热钱包疑似遭遇黑客入侵，导致其冻结了逾30亿美元的资产，并引发数字代币价格大幅下挫。币安方面表示，团队已注意到有关潜在安全问题的报告并正在积极调查，目前用户资金完全安全。此前，币安已暂停提币和币安Alpha交易。</p>\n  <p>加密货币存储公司Ballet Global Inc.创始人Bobby Lee表示，币安遭黑客攻击中被窃的比特币，恐怕已经不可能追回。Lee在周五接受采访时表示，那些比特币都一去不返了。被窃的比特币全都已经落到黑客手中。业界形容，这是加密货币圈历来规模最大的黑客攻击。币安已暂停所有存取，并承诺承担所有损失。（财联社）</p>\n  <p><strong>“张雪机车”商标回归张雪</strong></p>\n  <p>日前，重庆市知识产权局披露，“ZXMOTO”等一批核心商标完成注册，权利归属重庆张雪机车工业有限公司，历经多轮博弈，“张雪机车”这一品牌名称在法律层面正式回归创始人张雪。张雪呼吁广大创业者，创业之初就要及时布局注册自有商标，守住品牌的法律防线。业内专家表示，张雪机车的经历提醒广大创业者，知识产权保护不是成名之后的锦上添花，而是创业之初就应当做好的未雨绸缪。(央视财经)</p>\n  <p><strong>美股收盘：纳指重挫700点；英伟达市值一夜蒸发1.4万亿元；英特尔暴跌28%</strong></p>\n  <p>美东周五美股集体收跌，科技股遭遇抛售，纳指大跌2.86%，创下6月以来最大单日跌幅。英伟达跌4.22%，单日市值蒸发约1.4万亿元；英特尔暴跌28.58%，创历史第二大单日跌幅，存储、光通信、半导体板块普遍重挫。苹果市值反超英伟达，重回全球第一。资金转向防御板块，医疗、必需消费品走强，油价因地缘紧张涨超2%。纳斯达克中国金龙指数小幅收跌0.27%。（财联社）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>Anthropic成为SpaceX最大单一客户，每月贡献或高达约30亿美元</strong></p>\n  <p>知情人士称，Anthropic成为SpaceX最大单一客户，第三季度为马斯克旗下这家横跨人工智能、卫星和火箭业务的公司贡献了逾三分之一的营收。SpaceX上周在一份申报文件中表示，上季度约34.5%的营收来自AI部门的单一客户。该部门现名为Super Intelligence，提供算力服务。因涉及未公开信息而不愿具名的知情人士称，文件中被称为“客户B”的就是Anthropic。Anthropic的IPO披露文件显示，该公司同意在截至2029年的合同期内最多支出1205亿美元。文件显示，从今年12月开始，这相当于每月约31亿美元。（财联社）</p>\n  <p><strong>MiniMax H3开源生态持续拓展，英伟达团队开源4K视频增强方案</strong></p>\n  <p>36氪获悉，英伟达联合麻省理工的Efficient-Large-Model团队，在Hugging Face上线基于MiniMax H3的Open-H3-Regenerate-2K视频增强项目，权重与推理代码同步开放。该方案可将低清视频草稿重生成高清视频，支持2K输出、最高原生4K重生成，只训练新增细化LoRA，搭配潜空间放大器、稀疏注意力等技术提速。单张B200 GPU处理5秒2K视频，优化后耗时压缩至22.45秒，速度提升近3.9倍；评测显示其感知画质优于官方H3-Regenerate-2K API。MiniMax H3自8月开源后热度高涨，一月下载超2400万次，衍生模型超300个，海内外多个团队持续开发适配工具与衍生模型。</p>\n  <p><strong>启元机器人推出PrimeSim世界模型，登顶WorldSimProbe LIBERO榜单</strong></p>\n  <p>36氪获悉，10月30日，启元机器人推出PrimeSim世界模型并登顶WorldSimProbe LIBERO榜单，刷新机器人仿真表现。PrimeSim是一款面向机器人训练的世界模型仿真器，为机器人构建可交互、可试错、可持续学习的虚拟世界，让策略验证与强化学习能够在其中高效开展。测试中，利用它进行强化学习，策略成功率从61.7%提升至73.2%。</p>\n  <p><strong>记忆张量MemT 1.0开源10天累计下载破10万</strong></p>\n  <p>36氪获悉，近日，记忆张量（MemTensor）发布消息称，其记忆原生模型MemT 1.0自10月20日上线Hugging Face、GitHub以来，累计下载量已突破10万次，日均下载超1万次。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>全球“股王”再度易主，传苹果2028年推出大屏折叠iPad</strong></p>\n  <p>美股科技股回调，苹果周五跌幅更小，市值5.03万亿美元，再度反超英伟达（4.93万亿美元）重夺全球市值第一，英伟达单日市值缩水约1.4万亿元，这是苹果7月底短暂超越后再次登顶。另有消息称苹果正在测试首款大屏折叠iPad，展开尺寸可达18~20英寸，参考华为MateBook Fold设计，目标弱化屏幕折痕，预计2028年发布，康宁、GIS业成集团参与供应链；行业预估首年出货50‑100万台，定位高端，定价高昂，该项目尚未获苹果官方确认，上市时间存在不确定性。（财联社）</p>\n  <p><strong>光模块“易中天”前三季度合计净赚357亿元，三家龙头业绩大幅增长</strong></p>\n  <p>随着中际旭创、新易盛、天孚通信三季报全部披露，在全球AI算力基础设施建设拉动下，这三家A股光模块龙头前三季度合计营收1061.48亿元，归母净利润合计约356.93亿元，整体保持高增，单第三季度合计归母净利润133.09亿元。分企业来看，中际旭创营收、利润领跑，前三季度营收接近700亿元，净利润超220亿元；新易盛前三季度营收超318亿元，净利润超113亿元，增长势头强劲；天孚通信营收规模47.5亿元相对更小，但净利润超20亿元，利润增速跑赢营收增速。（界面新闻）</p>\n  <p><strong>阿里巴巴、苹果达成合作，千问将集成至Apple智能</strong></p>\n  <p>阿里巴巴与苹果宣布达成合作，把千问大模型集成进Apple智能，中国用户可在Siri、写作工具以及视觉智能当中调用千问的图文理解、内容生成能力。相关功能11月4日随iOS开发者Beta版开启测试，12月iOS 27.3正式版面向国内用户上线。（科创板日报）</p>\n  <p><strong>日本无印良品运营商称超2700万条用户信息或外泄，MUJI中国回应国内数据独立存储</strong></p>\n  <p>10月30日，无印良品日本运营商良品计划发布声明，MUJI APP遭非法访问，最多约2726万条用户信息存在外泄风险，涉及邮箱、出生日期、性别，不含信用卡、姓名、住址等信息，公司提醒用户警惕钓鱼邮件。同日MUJI中国回应，该事件仅影响日本APP用户，国内会员信息存储在独立服务器，按本地法规不会传输至境外。（财联社、界面新闻）</p>\n  <p><strong>马斯克公布Neuralink脑机新产品进展，盲视技术静待监管审批</strong></p>\n  <p>马斯克在社交平台X披露脑机公司Neuralink两款产品最新进展，首款产品“心灵感应（Telepathy）”支持仅凭意念和电脑、他人交流，马斯克预测数年内输出带宽将超越人类说话、打字，远期希望可以帮助失能患者恢复手脚活动能力。第二款产品“盲视（Blindsight）”工程层面已经就绪，可帮助失明、先天失明患者重获光明，该项目拿到FDA突破性医疗器械资格，仅代表加速审评，不等同确认安全有效。该产品已完成猴子长期动物实验，一只猴子植入设备已达三年，尚未公开人体植入结果，人体植入计划需要等待监管放行。不同于读取大脑信号的心灵感应，盲视是向大脑写入视觉信息。（科创板日报）</p>\n  <p><strong>恒大物业：要约人与卖方订立有关公司约51.016%股份的购股协议</strong></p>\n  <p>36氪获悉，恒大物业在港交所公告，董事会已获清盘人及要约人通知，于10月28日（交易时段后），彼等订立购股协议，据此，卖方已有条件同意出售，而要约人已有条件同意收购销售股份（即合共55.15亿股股份，占于购股协议日期已发行股份总数的约51.016%，且为各卖方在公司的全部持股），总现金代价为40.26亿港元。公司已向联交所申请股份于10月30日上午9:00起恢复买卖。</p>\n  <p><strong>于东来发文支持消费入座，建议餐厅可拒绝外带食物就餐</strong></p>\n  <p>10月30日，胖东来创始人于东来在社交平台发文表示，希望培养良好商业秩序与消费习惯，建议制度支持消费入座，兼顾商家与消费者权益，同时支持餐厅行业拒绝外带食物就餐。（界面新闻）</p>\n  <p><strong>姆巴佩曾代言饮品被商家清理库存，部分门店单日销量为0</strong></p>\n  <p>10月29日，广州线下市场传出消息，姆巴佩涉华不当言论风波之后，其曾经代言的饮品遇冷，有商家反馈该款饮品单日销量为零，商家不愿继续售卖，目前正在清理剩余库存，不少消费者也表示相关产品已经无人问津。此前多家国内品牌已经官宣终止和姆巴佩的合作，坚决对伤害民族感情的言行零容忍。（头条新闻）</p>\n  <p><strong>首付降到4万以内，特斯拉推出“5年0息”购车方案</strong></p>\n  <p>特斯拉推出全新“特从容”5年0息分期购车方案，进一步降低购车门槛。以Model 3后轮驱动版为例，首付3.99万元起，尾款3.99万元，五年月供最高约2429元，全程免息。原有5年0息方案首付门槛也由7.99万元下调至3.99万元，五年月供最高约3094元，无尾款。同时车型配套限时优惠，Model 3限时降价1万元，Model Y限时降价4000元。（财联社）</p>\n  <p><strong>周六福发布声明回应昆明门店大额黄金交易纠纷</strong></p>\n  <p>10月30日，周六福珠宝发布声明表示，媒体报道中曹女士的相关陈述仅反映事件部分情况，目前案件处于法院审理阶段，涉案款项性质有待查明，一切以法院生效裁判为准，公司正积极配合司法机关处理。据此前报道，曹女士2026年1月在周六福昆明全资子公司门店支付361.8万元定金购黄金，既未提货也未收到退款；门店经理汤某东涉嫌职务侵占已被刑拘，曹女士起诉要求公司承担连带责任，法院已立案并完成财产保全，冻结账户可用金额434.16万元。（财联社）</p>\n  <p><strong>三位民营火箭创始人首登胡润百富榜，三家企业冲刺科创板IPO</strong></p>\n  <p>10月27日发布的《2026胡润百富榜》，蓝箭航天张昌武、天兵科技康永来、中科宇航杨毅强三位民营火箭创始人首次上榜，身家分别为110亿元、90亿元、70亿元，合计270亿元。三人路线各有差异：蓝箭航天主打液氧甲烷可复用火箭，天兵科技布局液氧煤油火箭，中科宇航固液并行。三家都在推进科创板上市，蓝箭航天、中科宇航目前审核中止，企业仍未盈利，均预计最早2029年盈利；天兵科技处于上市辅导阶段。账面财富来自一级市场估值，体现资本对商业航天赛道的看好，2026年国内商业航天市场规模有望达3.5万亿元。（界面新闻）</p>\n  <p><strong>科大讯飞回应高管薪酬质疑</strong></p>\n  <p>针对投资者提出的高管涨薪疑问，科大讯飞在深交所互动平台回应。按照薪酬制度测算，刘庆峰、吴晓如2025年应发薪酬合计近2796万元，二人考虑到公司发展阶段，为把更多资源倾斜奖励A类优秀员工，主动下调年薪，实际分别领取410万元、300万元。2025年全体高管合计薪酬1860.85万元，较2024年小幅上升。公司同时披露三季报，前三季度营收同比增长、归母净利润扭亏，现金流改善明显。（界面新闻）</p>\n  <p><strong>英特尔：服务器CPU供不应求，预计出货量将在2026年和2027年均增长超过30%</strong></p>\n  <p>英特尔管理层美东时间周四在2026年第三季度财报电话会议上表示，数据中心成Q3增长核心，服务器CPU供不应求。CFO David Zinsner表示，工厂网络和外部供应商支持了更高的服务器CPU产出。按当前展望，DCAI全年收入有望较年初预期高出近100亿美元。管理层预计，行业仍将��2027年及2028年处于供应受限状态。公司还预计，行业服务器CPU出货量将在2026年和2027年均增长超过30%，若供应更充足，增速还会更高。（财联社）</p>\n  <p><strong>现代汽车集团将成立特殊目的公司开发AI数据中心</strong></p>\n  <p>现代汽车集团周五表示，计划于下月成立两家特殊目的公司（SPC），旨在开发人工智能（AI）数据中心；此举是其向AI基础设施领域扩张战略的一部分。现代汽车集团表示，其旗下关联公司——包括现代汽车、起亚、现代摩比斯、现代工程建设以及现代AutoEver——将参与此次投资。其中一家特殊目的公司（SPC）将负责数据中心建设及基础设施开发，而另一家则将负责图形处理器（GPU）相关服务。该集团表示，计划于2027年3月在位于首尔西南约200公里处的群山（Gunsan）新万金（Saemangeum）填海区为该项目动工。项目目标是在2030年初投入商业运营。（新浪财经）</p>\n  <p><strong>11月5日起，国内航线燃油附加费再上调</strong></p>\n  <p>机票销售平台飞常准APP接航司通知，自11月5日起，调整国内航线旅客运输燃油附加费征收标准。800公里(含)以下航段向每位成人旅客收取燃油费80元，800公里以上航段向每位成人旅客收取燃油费140元；较此前分别上涨了30元和50元。（界面新闻）</p>\n  <p><strong>闪迪：将100%的盈余现金返还给股东，第一财季已投入50亿美元用于股票回购</strong></p>\n  <p>闪迪管理层美东时间周四在2027财年第一财季电话会议上表示，本季度营收增长中“约60%归功于销量增长，40%归功于价格上涨。”基于强劲的订单可见度，闪迪预计第二财季营收将在122亿至126亿美元之间，同时，公司承诺将100%的盈余现金返还给股东，本财季已豪掷50亿美元用于股票回购。（财联社）</p>\n  <p><strong>存储器上市企业三季报成绩单亮丽</strong></p>\n  <p>多家存储器行业A股上市公司披露2026年三季报，上述公司前三季度业绩普遍实现较快增长。2026年三季报数据显示，佰维存储、德明利、君正股份、东芯股份今年前三季度归属于上市公司股东的净利润都创下历史同期新高。近期，存储器板块行业高景气度的持续性成为市场关注焦点，苏商银行特约研究员付一夫表示：“本轮存储器行业景气度有望延续。从行业发展趋势来看，未来存储器行业的竞争重心不是单纯比拼产能规模，而是聚焦技术升级。”（证券时报）</p>\n  <p><strong>亚马逊CEO：预计5-10年AWS云业务有望成长为万亿美元营收规模业务</strong></p>\n  <p>美东时间周四盘后，亚马逊首席执行官安迪·贾西在亚马逊财报电话会上，对其AWS云业务前景绘制了极为宏大的前景。他表示：“AWS的年化收入已达1840亿美元，但发展机遇依然巨大……我们预计AWS 2027、2028每年同比增速都将高于40%，未来5-10年有望成长为万亿美元营收规模业务。”（财联社）</p>\n  <p><strong>盘活存量增厚业绩，A股公司多元化“瘦身”提质量</strong></p>\n  <p>近期，不少A股上市公司明显加快“瘦身健体”的步伐。据记者不完全统计，9月至今，有201家上市公司披露资产或股权出售事宜，交易标的涉及土地厂房、闲置物业、金融资产及子公司股权等，总金额超过240亿元，其中部分项目交易金额超过10亿元。“这些交易背后的商业考量不尽相同。”和泰资产研究总监郑卜生对表示，有的企业为盘活存量、聚焦主业，有的着眼于回笼资金，也有经营承压的公司希望借助一次性收益改善年度业绩。（上证报）</p>\n  <p><strong>Alphabet债务风险指标上升，财报令AI举债担忧再起</strong></p>\n  <p>Alphabet Inc.股价周四暴跌之际，其债务违约保护成本上升。此前该公司业绩令人失望，加剧了市场对其举债支持的巨额人工智能（AI）支出可能无法获得回报的担忧。根据ICE Data Services，该公司五年期信用违约互换（CDS）报价一度上升5.3个基点，至每年84个基点，为9月21日以来最大升幅。CDS会随投资者担忧加剧而上升。Meta Platforms Inc.和芯片公司博通等企业的CDS也出现上升。标普全球市场财智固定收益定价执行董事Gavan Nolan表示，如果AI投资取得回报，股票投资者可能获得巨额收益；但如果局面恶化，债券持有人则要承担损失。（财联社）</p>\n  <p><strong>韩国电力国企放弃入股SpaceX电站项目转向主攻运维</strong></p>\n  <p>据30日韩国国会及发电行业消息，韩国中部电力调整方案，放弃直接入股“SpaceX AI综合电站项目”，改为以无股权投入的运维服务商身份参与该项目。对于投资计划变更的原因，中部电力解释：“在与SpaceX合并之前，xAI对外来投资持积极态度；合并完成后，其外部融资需求下降，因此我们撤回了投资意向。”中部电力一名负责人表示：“该项目最初规划就是运维为本、配套股权投资；评估过程中，鉴于SpaceX AI不再需要外部资金，我们调整方向，主攻运维服务。”（新浪财经）</p>\n  <p><strong>通用汽车认罚2.2亿美元，就出售驾驶员数据诉讼达成和解</strong></p>\n  <p>通用汽车公司已同意支付2.2亿美元，就一项诉讼达成和解。该诉讼由美国35个州及华盛顿特区共同提起，指控通用汽车将驾驶员数据出售给保险公司。参与此次和解的多位州检察长于周四宣布了这一消息。此前，由俄勒冈州的丹·雷菲尔德（Dan Rayfield）和华盛顿州的尼克·布朗（Nick Brown）牵头的一个由两党州总检察长组成的联盟对通用汽车发起了诉讼。通用汽车在和解协议中并未承认存在不当行为。（新浪财经）</p>\n  <p><strong>“十五五”全国算力用电量预计年均新增1000亿千瓦时以上</strong></p>\n  <p>从国家能源局10月30日举行的新闻发布会上了解到，预计“十五五”时期，全国算力用电量年均新增1000亿千瓦时以上，到2030年将达到8000亿千瓦时，占全社会用电量的6%左右。（央视新闻）</p>\n  <p><strong>中方决定将APEC商务旅行卡持卡人在华最长停留期延长至90天</strong></p>\n  <p>为持续便利亚太区域商务人员往来，中方决定将APEC商务旅行卡持卡人在华最长停留期由60天延长至90天，自2026年11月1日起实施。（央视新闻）</p>\n  <p><strong>日本9月失业率为2.4%</strong></p>\n  <p>日本9月失业率为2.4%，预期为2.50%，前值为2.50%。（界面新闻）</p>\n  <p><strong>美联储前副主席：12月或加息50基点</strong></p>\n  <p>美联储前副主席罗杰·弗格森周四表态，12月加息50个基点存在可能性。美国9月PCE通胀升至3.6%，核心PCE升至3.1%，持续高于2%政策目标，若届时不加息，美联储或将面临信誉受损。弗格森还预判，美联储12月大概率加息，2027年仍会再有一到两次加息。多名业内经济学家同样警示通胀顽固，12月存在大幅加息50基点的风险。美联储本周维持利率在3.75%–4%不变，两名委员支持加息25个基点。经济数据方面，美国三季度GDP年化增速达3.4%，就业数据保持稳健。CME美联储观察显示，当前市场押注12月加息25个基点概率接近75%，加息50基点概率约24%。（财联社）</p>\n  <p><strong>日本央行12月议息会议成为下一次加息的合理时机</strong></p>\n  <p>明治安田综合研究所高级经济学家Kazutaka Maeda：展望报告表明，随着日本央行对人工智能（AI）相关需求带动的出口和资本支出持更为乐观的态度，其政策重心已进一步转向通胀与经济活动面临的上行风险。尽管其通胀预测总体上仍与2%的目标保持一致，但日本央行似乎越来越意识到通胀可能会超调的可能性。日本央行可能不再坚持此前假设的每半年加息一次的节奏，而是正在考虑每三个月加息一次，这使得12月的议息会议成为下一次加息的合理时机。（新浪财经）</p>\n  <p><strong>日本股市迎重大调整，东证指数开启成分股大精简</strong></p>\n  <p>本周五日本东证指数（TOPIX）启动第二阶段改革调仓，683只个股进入分阶段降权名单，流动性不达标标的将在两年内逐步移出指数。新规抬高流动性门槛，本次新增35只成分股，含日本麦当劳、东映动画、尤尼克斯。</p>\n  <p>降权分8个季度平滑实施，2027年10月设有一次复核“补考”机会。改革后成分股数量将缩减近四成，但市值覆盖率仍维持96.4%以上。</p>\n  <p>有约160万亿日元资金跟踪该指数，上市公司打响“保位战”，通过提升流通股、改善盈利来满足标准；降权标的则将持续承受被动卖出压力。（财联社）</p>\n  <p><strong>现货黄金失守3900美元关口</strong></p>\n  <p>10月30日消息，现货黄金跌破3900美元/盎司，为去年10月以来首次，日内大跌约3%。（界面新闻）</p>\n  <p><strong>黑石集团据悉计划以19亿美元出售位于东京市中心的办公楼</strong></p>\n  <p>据知情人士透露，黑石集团计划以约3000亿日元（约合19亿美元）的价格，出售东京花园露台纪尾井町综合体的写字楼部分。这些因该事项尚未公开而要求匿名的知情人士称，这家总部位于纽约的另类资产管理公司目前正在与潜在买家进行谈判。他们还表示，黑石集团也在考虑将该物业的部分受益权打包成数字证券，以便向个人投资者出售较小的份额。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>菜鸟首单公募REIT在深交所上市</strong></p>\n  <p>36氪获悉，“中金菜鸟REIT”在深圳证券交易所上市。中金菜鸟REIT首发基金份额共计5亿份，每份发售价格为2.980元/份，募集资金合计14.90亿元。该基金原始权益人为“杭州传欣”，基金管理人为“中金基金”，计划管理人及财务顾问为“中金公司”。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>野人先生获首轮融资</strong></p>\n  <p>10月30日，界面新闻获悉，东方Gelato品牌野人先生拿到黑蚁资本投资，这是品牌成立15年来首轮融资，金额未披露，资金将用于供应链、门店拓展及海外探索。该品牌前身为野人牧坊，国内门店超1800家。此前9月罗永浩吐槽其定价偏高、口感一般引发热议，风波后品牌抖音粉丝不降反增。（界面新闻）</p>\n  <p><strong>“四川全固态”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，全固态电池关键原材料硫化锂生产商“四川全固态”已完成数千万元A轮融资。本轮融资由红榕资本、明势创投领投，天泓投资、兴湘科创及老股东英诺天使跟投。拓深资本、启辰资本担任财务顾问，北京卓晖律师事务所担任法律顾问。资金将主要用于百吨级产线的设备升级与产能扩充、长沙研发中心搭建以及团队建设。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>长鑫科技：前三季度净利润1320.4亿元，同比扭亏为盈</strong></p>\n  <p>36氪获悉，长鑫科技公告，2026年前三季度实现营业收入2690.24亿元，同比增长738.51%；归属于上市公司股东的净利润1320.4亿元，同比扭亏为盈。第三季度实现营业收入1187.14亿元，同比增长613.18%；归属于上市公司股东的净利润544.35亿元，同比扭亏为盈。业绩变动主要系全球DRAM产品供不应求，公司产品销售数量和销售价格大幅上涨，叠加单位成本下降，产品毛利大幅上升所致。</p>\n  <p><strong>长飞光纤：第三季度净利润32.03亿元，同比增长1741.52%</strong></p>\n  <p>36氪获悉，长飞光纤公告，2026年前三季度实现营业收入191.24亿元，同比增长86.12%；归属于上市公司股东的净利润61.28亿元，同比增长1204.63%。第三季度实现营业收入93.16亿元，同比增长139.42%；归属于上市公司股东的净利润32.03亿元，同比增长1741.52%。业绩变动主要系受智算中心加速建设影响，行业进入上行周期，主营业务收入结构改善，主要产品销售量及平均单价均实现同比较大增长所致。</p>\n  <p><strong>赛力斯：2026年第三季度净利润14.2亿元</strong></p>\n  <p>36氪获悉，赛力斯公告，2026年第三季度营业收入280.8亿元，同比下降41.66%；归属于上市公司股东的净利润14.2亿元，同比下降40.12%；扣非净利润亏损13.65亿元，同比下降159.54%。前三季度营业收入855.73亿元，同比下降22.58%；归属于上市公司股东的净利润亏损2.97亿元，同比下降105.59%；扣非净利润亏损37.44亿元，同比下降178.53%。</p>\n  <p><strong>燧原科技:2026年前三季度营收23.32亿元，同比增长331.74%</strong></p>\n  <p>36氪获悉，燧原科技公告，2026年第三季度营业收入12.12亿元，同比增长395.34%；归属于上市公司股东的净利润亏损1.22亿元。2026年前三季度营业收入23.32亿元，同比增长331.74%；归属于上市公司股东的净利润亏损7.54亿元。</p>\n  <p><strong>星巴克：第四财季归母净利润为6.772亿美元，高于去年同期的1.331亿美元</strong></p>\n  <p>星巴克公布季度业绩，其国际咖啡馆表现不及预期。不过，其美国业务转型继续取得进展。星巴克报告第四财季归母净利润为6.772亿美元（合每股59美分），高于去年同期的1.331亿美元（合每股12美分）。剔除重组和减值成本及其他项目后，公司报告每股收益80美分。净营收下降4%至91.4亿美元。据StreetAccount数据，公司全球同店销售额增长7.2%，受平均客单价增长推动，高于华尔街预期的6%。本季度交易量增长1.8%。星巴克美国咖啡馆同店销售额增长7.7%，高于StreetAccount预期的6.5%。（新浪财经）</p>\n  <p><strong>亚马逊第三季度AWS净销售额459.8亿美元，高于预期</strong></p>\n  <p>亚马逊第三季度销售净额2019.4亿美元，预估2022.6亿美元；AWS净销售额459.8亿美元，预估456.8亿美元；每股收益1.89美元，预估1.97美元；经营利润280.8亿美元，预估260.6亿美元；营业利益率13.9％，预估12.9％；北美运营利润率+7.7％，预估+6.61％；执行费用300.0亿美元，预估297.1亿美元。亚马逊预计第四季度销售净额2400亿美元至2,470亿美元，市场预估2445.2亿美元；预计经营利润285亿美元至335亿美元，市场预估329.9亿美元。（财联社）</p>\n  <p><strong>中国中免：前三季度净利润36.7亿元，同比增长20.25%</strong></p>\n  <p>36氪获悉，中国中免公告，2026年前三季度营业收入388.21亿元，同比下降2.61%；归母净利润36.7亿元，同比增长20.25%；扣非净利润36.44亿元，同比增长20.00%。第三季度单季营业收入111.66亿元，同比下降4.66%；归母净利润5.64亿元，同比增长24.64%；扣非净利润5.65亿元，同比增长28.19%。公司拟每股派发现金红利0.40元(含税)，以截至报告披露日总股本20.78亿股测算合计派发现金红利8.31亿元(含税)，占前三季度归母净利润22.65%。</p>\n  <p><strong>中金公司：前三季度净利润132.45亿元，同比增长101.71%</strong></p>\n  <p>36氪获悉，中金公司公告，2026年前三季度营业收入307.15亿元，同比增长47.95%；归母净利润132.45亿元，同比增长101.71%；扣非净利润130.96亿元，同比增长101.93%。第三季度单季营业收入114.12亿元，同比增长43.87%；归母净利润50.46亿元，同比增长125.63%；扣非净利润50.62亿元，同比增长125.69%。业绩增长主要因手续费及佣金净收入以及金融工具投资产生的收益净额增加、营业利润率上升。</p>\n  <p><strong>闪迪预计第二财季营收为122亿至126亿美元，市场预估为121亿美元</strong></p>\n  <p>闪迪预计第二财季营收122亿至126亿美元，预估121亿美元；预计调整后毛利率84.5%至85.5%，预估84.8%；预计调整后每股收益55至57美元，预估52.72美元；预计调整后运营费用5.4亿至5.6亿美元。闪迪第一财季业绩营收110.3亿美元，预估106.9亿美元；数据中心营收48亿美元；边缘业务营收58.3亿美元；消费业务营收3.97亿美元；调整后每股收益49.51美元，预估46.36美元；每股收益52.60美元；现金及现金等价物51.4亿美元，预估93.9亿美元；自由现金流63.1亿美元；调整后毛利率85.1%，预估84.5%。（财联社）</p>\n  <p><strong>中国人寿：前三季度净利润894.3亿元，同比下降46.7%</strong></p>\n  <p>36氪获悉，中国人寿公告，2026年前三季度营业收入3678.12亿元，同比下降31.6%；归属于母公司股东的净利润894.3亿元，同比下降46.7%；扣非净利润895.46亿元，同比下降46.7%。第三季度归属于母公司股东的净利润亏损450.59亿元，扣非净利润亏损450.14亿元。</p>\n  <p><strong>招商银行：第三季度净利润400.31亿元，同比增长3.06%</strong></p>\n  <p>36氪获悉，招商银行公告，2026年前三季度实现营业收入2648.52亿元，同比增长5.34%；归属于本行股东的净利润1164.76亿元，同比增长2.38%。第三季度实现营业收入866.71亿元，同比增长6.41%；归属于本行股东的净利润400.31亿元，同比增长3.06%。</p>\n  <p><strong>工商银行：第三季度净利润1119.58亿元，同比增长9.97%</strong></p>\n  <p>36氪获悉，工商银行公告，2026年第三季度营业收入2209.74亿元，同比增长9.45%；归属于母公司股东的净利润1119.58亿元，同比增长9.97%。2026年前三季度营业收入6671.37亿元，同比增长9.19%；归属于母公司股东的净利润2856.4亿元，同比增长5.83%。</p>\n  <p><strong>农业银行：第三季度净利润901.65亿元，同比增长10.84%</strong></p>\n  <p>36氪获悉，农业银行公告，2026年第三季度实现营业收入2083.83亿元，同比增长15.14%；归属于母公司股东的净利润 1+00:00", "fingerprint": "e3dddaa642ef074e"}, {"source": "36氪 - 最新文章", "title": "部署态加速，智元要打通物理AI全链路", "url": "https://36kr.com/p/4047032889800965?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_559562a5a8e847419ffde66259a4ace8@19153231_oswg547077oswg900oswg480_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>在具身智能行业仍热衷于用高难度动作展示技术进步时，智元创新日上呈现了另外一种思路。&nbsp;</p>\n  <p>在这场发布会上，没有太多眼花缭乱的机器人特技，也没有太多夺眼球的集体舞蹈，反而更像是一场信息密度极高的技术研讨会。甚至，在世���中心的入口，智元还设置了一大面“论文墙”，呈现智元团队近期的核心技术进展。</p>\n  <p>过去三年，机器人学会了跑、跳、后空翻，但走出实验室才发现，单一技术突破撑不起复杂环境中的稳定工作。当GPT-6 Astra等大模型展现出物理任务规划能力后，“真实部署”已从口号，变成行业必须回答的问题。</p>\n  <p><strong>智元的回答是一套组合拳：</strong></p>\n  <p>GO-3 Preview具身基座大模型、AGILE通用运动智能算法框架、WITA-OMNI原生多模态交互大模型分别攻坚作业、运动、交互三大难关；灵渠OS 1.0与AHA3第三代硬件架构从软硬件两端拉通统一端口；Worken（有效智能工时）则试图为物理AI的实际劳动产出建立度量衡。</p>\n  <p>也就是说，智元几乎把整条技术链摊开，逐个击破模型、数据、硬件、软件的各个卡点。</p>\n  <p>智元的种种动作，共同指向了同一个方向——<strong>机器人行业下一阶段竞争的胜负手，不再是谁更会打拳，而是谁能把过去三年的成绩落地部署到实际场景里，将其转变成源源不断的生产力。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_c338f9e69ff2416c97cd81f00f3e6efb@19153231_oswg4264403oswg2516oswg1368_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>智元联合创始人、总裁兼CTO彭志辉在发布会上给出的数字，恰好为这个判断提供了注脚：2026年上半年，智元机器人营收接近20亿元，智元通用AI机器人累计下线达20000台。</p>\n  <p>在会后接受访谈时，他坦言，<strong>“万台下线，只是制造业的胜利，万台上岗，才是物理AI的胜利”。</strong></p>\n  <h2><strong>具身部署不再拼单点技术</strong></h2>\n  <p>过去几年，机器人行业出现了一种常见的竞争方式：不断刷新某项能力的上限，比如比跑得更快、跳得更高，谁能完成更复杂的抓取动作。而当机器人真正部署进工作场景后，这套旧有的评价逻辑明显不够用。</p>\n  <p>不妨想象一个工厂里一项极其普通的任务：“走到货架前取一件物品，再将它送到指定位置。”</p>\n  <p>听起来轻松，若由机器人执行，这项简单任务可以被解构为几个挑战——机器人要判断物品在哪、怎样抓取；搬运过程中需实时应对突发情况，有人突然经过要及时避让；工作人员临时改变任务，还需要听懂新要求。</p>\n  <p>也就是说，一个小小的任务，分别涉及作业能力、交互能力、运动能力，任意一项都不可或缺。</p>\n  <p><strong>智元此次推出的多项核心成果——譬如GO-3 Preview、WITA-OMNI、AGILE，正是基于现实落地的基础痛点展开。</strong></p>\n  <p>GO-3 Preview最核心的意义正是，让机器人如何更好地理解自己即将执行的动作。</p>\n  <p>近年来VLA成为具身智能重要技术方向，让机器人像大模型理解文字一样理解环境和指令并生成动作。</p>\n  <p>但传统VLA存在一个卡点：机器人纵使知道下一步该做什么，却不一定清楚这个动作的后果，比如想拿起桌上杯子时，可能把旁边东西打落。</p>\n  <p>GO-3 Preview的核心突破是“先预测，后动作”的一体化决策机制。也就是说，机器人拿到任务后，会先综合多路摄像头画面和指令，搞清楚“要做什么、环境如何”；接着在内部推演几种可能的情况；最后从中选一个最靠谱的方案行动。相当于行动之前先三思，而不是边做边想。</p>\n  <p>除了持续探索具身智能大脑模型之外，智元此次还盯上了一个被巨头基模公司集体忽略、却不可或缺的重要方向——全模态端到端交互大模型。<strong>“交互，正是机器人产生价值的必经入口、第一入口，所有的场景都离不开交互”，</strong>智元合伙人、联席总裁、中央研发部总裁、交互业务体系总裁熊彦如此表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_140104dbb0994848896c2876253d61be@19153231_oswg233691oswg1907oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>以前人类与机器人交互的模式基本是，要先喊它名字“唤醒”它，然后一问一答、干等回复。而WITA-OMNI大模型把人机交互的底层逻辑完全改了。</p>\n  <p>在发布会现场，熊彦与搭载该模型的机器人远征A3的趣味互动——不需要唤醒词，在噪音复杂的现场，机器人还能准确判断你是不是在跟它说话，且快速打断切换问题也不会影响交互。</p>\n  <p>经现场测试，WITA-OMNI模型的响应速度最快只有400毫秒，支持20多种情感表达，能听懂73种语言。在WITA-OMNI模型的加持下，机器人终于从一台被动听指令的机器，变成了一个能聊天的小伙伴。</p>\n  <p>值得注意的是，这两项模型近期均交出了硬核成绩单。</p>\n  <p>据介绍，GO-3 Preview登顶RoboDojo、RoboTwin、RoboColiseum三大行业权威评测榜单，并将于2026年底全面开源；WITA-OMNI则拿下Daily-Omni全模态理解、TimeLens-Bench视频时序定位、EmbSpatialBench具身空间推理、MMAU复杂音频理解四项榜单第一名。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_bead18090b79475884e6190379060ed6@19153231_oswg195352oswg4096oswg877_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_37316d8b393949109612a6d84fc9c792@19153231_oswg631746oswg7168oswg1536_img_jpeg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>有了“先想后做”“擅长聊天”的大脑之后，机器人还需要一副跟得上的身体。</p>\n  <p>此次智元发布的AGILE正是一项全新的通用运动智能算法框架。可以这么理解：机器人可以像人一样，眼睛看到变化，身体立刻就能做出合适的反应，一气呵成。</p>\n  <p><strong>从GO-3 Preview到WITA-OMNI再到AGILE，智元同时推进作业智能、交互智能、运动智能三条线——让机器人既知道该做什么，又能稳稳做出来，还能自然跟人配合。</strong></p>\n  <p>不过，会想、会动、会聊三种能力齐备，还不意味着机器人就能顺畅运转。它们必须在同一条时间轴、同一个状态空间里实时衔接。否则，就可能出现这样的情况：大脑下了指令，小脑接不住；小脑接住了，交互又掉线。</p>\n  <p>协同，正是具身智能落地在“三智”之外的下一道槛。</p>\n  <h2><strong>机器人落地的下一道槛，在模型之外</strong></h2>\n  <p>协同不能只是一句口号，而是需要真正从底层出发，为机器人设计一套专门的“粘合剂”，把各个部分有机组织起来。</p>\n  <p><strong>在智元创新日上，智元的另一项核心创新成果便是第三代硬件架构AHA3。</strong>它不是给旧方案打补丁，而是从底层重新设计了一套能同时承载运动、交互、作业三套智能的统一控制平台，让“三智”真正在物理层面串联起来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_8aebbabc12994fd8b4cfcf500e02b47d@19153231_oswg6260205oswg3744oswg2496_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这也是一项切中行业痛点的设计。过去几年机器人行业造硬件，最大的问题是碎片化——模型和系统各自为政，靠线缆和协议勉强连在一起。这也导致了，过去机器人身体里塞满了控制器，又大又重，散热也不过关。而据智元在发布上披露，这套系统带来的直接好处是：控制系统体积缩小了一半，响应速度翻了近一倍。</p>\n  <p>不过，仅仅重新设计硬件架构这套骨架还远远不够，还需要一套更好的“结缔组织”。</p>\n  <p>一直以来，机器人仍处于手搓状态，根源是机器人身上有大量不同的传感器、控制器和执行器，这些硬件来自不同厂商，采用不同的接口和通信方式。对于开发者来说，这无疑是一种灾难——如果每接入一种新设备，都需要重新编写大量底层代码，产品的开发和升级十分复杂。</p>\n  <p><strong>所以，智元的灵渠OS 1.0的作用便是，把硬件、通信、智能三层全部打通，让机器人第一次有了统一操作系统。值得注意的是，这也是业内首个具身智能原生操作系统。</strong></p>\n  <p>对于工程师们来说，他们最可感的变化是，灵渠OS 1.0直接让所有硬件接入变得像插U盘一样简单——通过重新定义硬件的接入标准，摄像头、传感器、机械臂等15类、共计100多种外设插上就能用，不用再费劲处理驱动。</p>\n  <p>灵渠OS 1.0除了有打通的意义之外，关键还够快。当机器人每秒发1000次运动指令，灵渠OS 1.0还能把每次间隔的误差不到4微秒。打个比方，人眨一次眼的时间里，机器人已经发了300多条指令，每条都准时到毫秒不差。</p>\n  <p>不过，智元并不打算独享这份基础设施的便利性。</p>\n  <p><strong>在智元创新日上，智元宣布与开放原子开源基金会共建中国人形机器人开源社区</strong>，在本体硬件、数据评测、操作系统、大小脑等核心方向推动技术转化与行业标准制定，并向基金会捐赠灵渠OS项目。双方将组织联合开发、测试验证和具身智能人才培养，建设全球开放繁荣的技术生态。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_84f29359fc5940b1a525b617b9a8ccc8@19153231_oswg15229019oswg4608oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>同时，灵渠OS 1.0计划于2026年底全面开源，届时将开放经过量产验证的约2亿行代码、5000多个生态软件包，推动机器人能力成为可复用的产业基础。</p>\n  <p>对开发者来说，灵渠OS 1.0相当于把一众智能能力做成了“技能包”，开发者们不用从零造轮子，直接实现对运动智能、交互智能、作业智能三大方向的开箱即用。</p>\n  <p>“你永远想象不到合作伙伴会给我们带来什么样的惊喜，这就是生态的魅力。所以我们必须把基座搭好，把更多的机会留给我们的合作伙伴”，智元合伙人、高级副总裁、通用业务部总裁王闯表示。</p>\n  <p>回望智元创新日发布的核心内容，智元基本已经实现了模型、硬件、系统三层自研和互相打通。这种技术纵深和覆盖广度，在具身智能行业内其实并不多见。</p>\n  <p>这套完整体系的终极考场，或许不在实验室里，而在真实落地的每一个场景里。</p>\n  <h2><strong>通用机器人开始干活，需要一把新标尺</strong></h2>\n  <p>过去几十年以来，工业机器人有一套成熟且简单的方法计算这笔钱花得值不值。只要计算这台机器每小时能生产多少个零件、乘以零件单价，减去电费和维护等成本，很快就能算出来回本周期。</p>\n  <p>不过，当通用具身智能机器人落地，行业急需一把全新的标尺来衡量价值——这是因为，具身智能机器人的工作岗位并不固定，可能今天在组装线上打螺丝，明天就去负责物流装配了。</p>\n  <p><strong>所以，在解决了基础技术布局之后，智元还试图为具身智能的新质生产力探索统一“度量衡”，提出了Worken（有效智能工时）这一新概念。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_f577704a722a49a1bde69bc8e600824b@19153231_oswg4227428oswg4800oswg3202_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>其实，也可以把它理解成具身智能时代领域的“Token”——Token衡量的是AI在数字世界里生成了多少内容，Worken衡量的则是机器人在物理世界里真正干了多少有价值的活。</p>\n  <p>按照智元的定义，Worken=活跃机器人数量×自主工作时长×产出效能比。</p>\n  <blockquote>\n   <p>（注：活跃机器人数量即当期在线、能正常干活的机器人数；自主工作时长即机器人不需要人管、自己干活的连续时间；产出效能比概念里，智元把一个熟练工人按标准方法、在单位时间内做出的合格产出，定义为1.0，机器人的实际产出除以这个标准定额，得出的比值就是效能比——等于1是达标，大于1.0就是比人干得还好。）</p>\n  </blockquote>\n  <p>通过这个定义，智元试图为物理AI建立一套新的评价框架，让机器人的新质生产力变成一个可以跨行业、跨场景比较的数字。</p>\n  <p>其实，Worken的意义还不止于算账，它背后牵出的是一个更深层的变化：未来机器人的资产属性可能正在被重新定义。</p>\n  <p>在过去，传统设备卖出去之后只会越来越旧。但到具身智能机器人领域，情况则完全不同——硬件虽然会折旧，但模型会升级、技能会扩展，甚至多台机器人还能一起实现自进化。也就是说，具身智能机器人的硬件在贬值，但智能在升值。</p>\n  <p><strong>所以，未来评估一台机器人，比的不再是性价比，而是“智价比”——用户花的每一分钱，会在整个生命周期里能持续创造多少有效智能工时。</strong></p>\n  <p>可以想象一下，在未来，一台机器人，是一件产品，但当一百万台持续在线、共享经验的机器人连在一起，他们或许不再是孤立的硬件，而是一种“云”，是一项持续生长的基础设施。</p>\n  <h2><strong>智元“跃迁”</strong></h2>\n  <p>回过头看这次A.I.DAY，也可以捕捉到智元的三项“跃迁”讯号。</p>\n  <p><strong>第一跃，是从打磨单点技术，走向构建全栈能力。</strong></p>\n  <p>当过去行业习惯比谁动作更炸裂，智元选择埋头苦干，把模型、硬件、系统三层全部啃了一遍——GO-3 Preview、AGILE、WITA-OMNI等突破了机器人的“想、动、聊”，智元还给这三套智能系统造了粘合剂，AHA3管硬件，灵渠OS1.0管软件。</p>\n  <p>而且，智元不是选择将这几个强项拼装，而是从底到顶长成一套体系。</p>\n  <p>“全栈自研不是可选的选择题，而是必选题”，彭志辉在会后向一众媒体表示，“本体是下限，模型是上限，智元必须做到模型能力足够泛化、本体足够可靠、软硬件综合系统能力达标，部署态对具身智能公司提出了全栈的要求。”</p>\n  <p>他直言，智元是一家面向场景的全栈公司，“我们的想法的很简单——把技术做得可以复用，把产品竞争力打磨得够强，这就是我们最核心的价值。”</p>\n  <p><strong>第二跃，是从销售机器人硬件，走向布局产业生态。</strong></p>\n  <p>技术底座铺好后，规模化落地成了水到渠成的事。智元没把机器人当展品卖，而是当成岗位去交付——龙旗南昌工厂里，8台精灵G2并入平板质检产线，6天处理17000多件产品，成功率99.99%；横琴长隆超500台机器人常态化上岗，覆盖七大场景；爱仕达门店里，100台灵犀X2当“硅基导购”，3天带动销售223万元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_7ae51a0af93f44c4a5afd3312c40f5e4@19153231_oswg4885262oswg3500oswg2333_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>但这些案例只是起点。具身智能的战场不在单点订单，而在场景密度——几乎没有哪家能靠自己吃下千行百业。</p>\n  <p>所以，智元把已经验证的全栈能力拆成开放底座，发起“元苼生态发展计划”。据介绍，智元未来五年投入超20亿元、2026年先行落地1亿元。</p>\n  <p>简单说，智元把操作系统、开发工具和模型整套能力全部开放，当开发者、高校、合作伙伴共用一套底座，多方汇聚创造力将会碰撞、滋长出新的生态。</p>\n  <p><strong>第三跃，也是最有野心的一跃：从参与产业竞争，走向探索重新制定产业规则</strong>。</p>\n  <p>当行业还在比卖了几台机器人时，智元提供了机器人生产力度量衡，告诉行业和场景方，如何真正衡量通用具身智能机器人的价值。</p>\n  <p>可以展望的未来是，当客户开始用Worken来评估采购决策，或许整个行业的竞争维度就被改写了，也会产生新的商业叙事。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_a9a6cbea2c274b45ab934d13626d0f0a@19153231_oswg4093579oswg2424oswg1382_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>王闯在会后的媒体访谈中也袒露了自己的畅想，他认为，若Worken未来能走向普及，机器人付费也可能从过去的“买设备”转向“生产力套餐”。</p>\n  <p>设想一下：用户购买Worken套餐包、预定任务后，机器人厂商或按实际消耗量扣费，并且提供服务不同场景下多台机器人的组合。不过，他认为这会是一个渐进演变的方向，Worken的商业模式还会会有很大的想象空间。</p>\n  <p><strong>其实，如果把三次跃迁连起来看，可以发现智元本质上是在推动机器人从实验室里的技术展示，变成物理世界里的基础设施和新质生产力。</strong></p>\n  <p>正如智元联合创始人、联席总裁、具身业务体系总裁姚卯青表示的——“每一个大热的科技赛道都会有自己的周期。对于机器人行业，我认为未来能真正走下去的公司，必须具备全链路把技术和产品转化为可衡量生产力的能力，真正在生产环节里提供可量化的价值。”</p>\n  <p>而我们也可以从中清晰透视出智元正在发生的变化——它不已再满足于在既有的机器人竞争框架中争夺领先位置，而是开始尝试改变竞争本身的方式。</p>\n  <p>或许，这才是此次以“跃迁”为主题的A.I.DAY，最值得玩味的地方。</p>", "category": "tech", "published_at": "2026-10-29T14:25:57+00:00", "fetched_at": "2026-10-30T04:05:48.800180+00:00", "fingerprint": "6189abba693c8ab9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨外交部回应三丽鸥取消Vivant联名；科创50指数创新低；上海一宜家餐厅开始实行“消费入座”，周二、周四有保安劝离", "url": "https://36kr.com/p/4047618190883331?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>宇树回应净利润下滑：系算力、大模型方向研发投入增加所致</p>\n  <p>美国司法部调查英伟达收购HuggingFace</p>\n  <p>美国知名投资人质疑美联储利率决议</p>\n  <p>机器人也有KPI考核标准了，智元发布首个“工时KPI”Worken</p>\n  <p>成都国星宇航科技股份有限公司通过港交所上市聆讯</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>外交部回应三丽鸥取消Vivant联名</strong></p>\n  <p>10月29日，外交部例行��者会上，有记者问：日本三丽鸥公司取消了和一部日剧的合作，原因是剧中对华人角色的刻画引发公众反感。请问发言人对此有何回应？</p>\n  <p>外交部发言人郭嘉昆表示，我们注意到有关报道。这部电视剧再次暴露出日本国内始终存在一股势力，企图通过文化产品丑化、抹黑中国，散播仇华情绪，应当引起国际社会和日本国内有识之士的警惕。（央视新闻）</p>\n  <p><strong>科创50指数创新低，较年内高位回撤45%</strong></p>\n  <p>AI产业链股29日集体下挫，拖累科创50指数走低，盘中一度跌超4%至1223.62点，创2025年9月初以来新低，且较今年6月份高位回撤45%。</p>\n  <p>午后PCB概念持续下挫，华正新材、奥士康、景旺电子、鹏鼎控股、沪电股份跌停，生益电子跌超10%，澳弘电子触及跌停，胜宏科技、深南电路、超声电子、鼎泰高科均跌超8%。</p>\n  <p>消息面上，全球科技股普遍走弱，行业巨头的失望业绩令市场重新审视庞大的AI支出。韩股市场三星电子因芯片利润不及预期一度跌6%，而美股市场Alphabet Inc.因销售额低于预期在盘后交易中暴跌10%。(新浪证券)</p>\n  <p><strong>宜家中国回应上海徐汇餐厅须“消费入座”</strong></p>\n  <p>近日，有网友反映，继星巴克之后，上海徐汇宜家餐厅平日也开始实行“消费入座”，周二、周四有保安劝离占座不消费的顾客。</p>\n  <p>宜家中国表示：您所关注到的顾客温馨提示，是宜家上海徐汇商场基于顾客反馈及门店日常运营开展的倡议，其目的是进一步提升顾客用餐体验。宜家重视每一位顾客的体验，我们希望与消费者共同营造更加舒适有序的购物环境。 （界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>美国司法部调查英伟达收购HuggingFace</strong></p>\n  <p>美国司法部目前已对英伟达拟以129亿美元（约合人民币866亿元）收购开源AI模型托管平台Hugging Face的交易展开反垄断调查，重点评估这笔英伟达史上最大收购是否会让其掌控AI生态的关键分发节点。</p>\n  <p>Hugging Face是全球开源AI社区的核心枢纽，拥有超过1800万开发者、300万个模型和50万个数据集。收购它，相当于控制了AI模型分发的“高速公路”，英伟达承诺交易完成后将保持平台的开放与免费，并计划在2027年上半年完成交割。（快科技）</p>\n  <p><strong>腾讯混元Hy4、Hy4 flash即将发布首次引入视觉理解能力</strong></p>\n  <p>10月29日，在2026腾讯全球数字生态大会上，腾讯宣布Hy4即将发布。相比Hy4 preview，Hy4实现了全面大幅提升，尤其强化了各类长程和真实生产力任务的能力，显著提升了思维链效率，并首次引入视觉理解能力。Hy4 flash也会在近期发布，提供极致性价比的实用模型。</p>\n  <p>���年8月28日，腾讯混元发布并开源新一代大语言模型Hy4 preview，总参数770B、激活参数49B，上下文长度突破1M。Hy4 preview在模型尺寸、上下文长度、数据规模上都进行了显著扩展，模型能力稳居开源模型第一梯队。(上海证券报)</p>\n  <p><strong>智元GO-3 Preview与Genie Master计划全面开源</strong></p>\n  <p>36氪获悉，在2026智元创新日上，智元联合创始人、联席总裁、具身业务体系总裁姚卯青现场正式发布新一代具身基座模型GO-3 Preview。姚卯青透露，智元计划于2026年底全面开源具身基座模型GO-3 Preview和具身Agent框架Genie Master。</p>\n  <p><strong>阿里云盘企业版CDE Agent计费模式调整通知</strong></p>\n  <p>36氪获悉，阿里云公告，为进一步降低CDE Agent的使用门槛，为您提供更加灵活、便捷的使用体验，自2026年11月25日起，将对Agent的购买及使用计费方式进行调整。Agent数量不再作为独立商品单独购买和计费。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技：近期有不法分子及非法中介机构冒名发布虚假招聘信息</strong></p>\n  <p>长鑫科技29日发布提醒：近期，公司再次发现有不法分子及非法中介机构，假借“长鑫科技”、“长鑫集团”、“长鑫存储”名义，在网络平台上散布虚假招聘信息。长鑫科技提醒：请勿下载不明软件，不点击陌生链接，不向非官方人员提供个人敏感信息；不参与付费或做任务获取招聘机会的活动；不轻信非官方社交账号散布虚假承诺，虚构岗位地点与薪资等。（财联社）</p>\n  <p><strong>美国知名投资人质疑美联储利率决议</strong></p>\n  <p>当地时间10月28日，美联储结束为期两天的货币政策会议，宣布将联邦基金利率目标区间维持在3.75%至4.00%不变。美国知名资管机构双线资本创始人，素有“新债王”之称的杰弗里·冈拉克在接受CNBC采访时指出，本次美联储按兵不动的做法，其实令人难以理解。因为能源和大宗商品价格持续上涨带来的压力，仍可能使得通胀在未来几个月内重新回到4%上方。接下来，除非油价出现明显回落，否则美联储必须在12月加息。冈拉克的判断，也与市场对12月政策走向的押注相呼应。芝加哥商品交易所的美联储利率观测工具数据显示，目前市场预计美联储12月加息的概率接近80%。（央视财经）</p>\n  <p><strong>滔搏回应耐克线上渠道调整：就库存回收和促销补贴等资源支持与品牌方持续沟通</strong></p>\n  <p>10月28日晚间滔搏公布截至2026年8月31日止六个月业绩。上半财年年收入109.13亿元，同比下降11.3%；公司权益持有人应占利润6.63亿元，同比下降16.03%。管理层在电话会上表示，叠加消费环境持续低迷，未来一段时期集团将面临较大业务挑战，短期内对收入和利润的影响仍然显著，将持续评估相关影响，对短期经营持审慎态度。滔搏管理层指出，此次调整是行业渠道格局重构背景下品牌方的渠道策略调整，并不意味着双方合作基础发生变化，双方线下合作保持不变。滔搏理解品牌方清理线上渠道、重塑品牌力的做法，正就库存回收和促销补贴等资源支持与耐克持续进行沟通。（澎湃新闻）</p>\n  <p><strong>油价30日起上调，国内汽、柴油价格每吨分别应上调440元、420元</strong></p>\n  <p>10月15日国内成品油价格调整以来，中东地缘紧张局势升级，国际市场原油价格大幅上涨。为减缓对国内的冲击，国家再次对成品油价格采取调控措施。根据现行价格机制计算，自10月29日24时起，国内汽、柴油（标准品）价格每吨分别应上调440元、420元，统筹兼顾减轻下游用户负担和保障成品油安全稳定供应，调控后实际上调345元、335元。</p>\n  <p>国家发展改革委将指导成品油生产销售企业全力做好成品油生产和调运，确保市场稳定供应，并配合有关部门加大市场监督检查力度，严厉查处不执行国家价格政策等违法违规行为，切实维护市场秩序，保护消费者利益。(新华社)</p>\n  <p><strong>机器人也有KPI考核标准了，智元发布首个“工时KPI”Worken</strong></p>\n  <p>“物理AI时代，拿什么度量机器的价值？”10月29日，在上海世博中心举行的2026智元创新日（AIGBOT INNOVATION DAY）上，智元联合创始人、总裁兼CTO彭志辉发布了首个定义物理AI价值的度量衡：Worken（有效智能工时），用于衡量机器人自主作业的实际产出。</p>\n  <p>在彭志辉看来，每一个产业时代，都有自己的“度量衡”：蒸汽时代用马力度量机器的力量，电力时代用千瓦时度量机器的能量，数字AI时代用token度量机器的思考。“Worken的计算公式为Worken（有效智能工时）=有效智能工时＝活跃机器人数量×自主工作时长×产出效能比。”记者现场了解到，这一指标将在机器人制造数量之外，进一步衡量机器人能否自主、持续地完成有价值的工作，以及实际创造了多少成果。(每日经济新闻)</p>\n  <p><strong>荷兰国际集团宣布全球裁员约400人，预计每年削减成本7500万欧元</strong></p>\n  <p>荷兰国际集团（ING）公布，计划重组批发银行业务，预计全球裁员约400人，相关调整将于2027年3月1日起生效。公司预计，相关措施将产生约1.75亿欧元税前裁员费用，并每年削减成本约7500万欧元，自2028年起全面生效。该行第三季度净利润为18.5亿欧元，同比增长3.5%；税前利润增长5.7%至27.05亿欧元。（财联社）</p>\n  <p><strong>机构：MacBook Pro新机入局，预估2027年全球OLED笔记本出货年增逾40%</strong></p>\n  <p>36氪获悉，根据TrendForce集邦咨询最新显示器产业研究，Apple（苹果）发布的MacBook Pro with PROLED XDR Display首度导入串联式OLED触控屏幕，标志着MacBook显示技术与操作体验的重要转变。TrendForce集邦咨询预估，这款新机于2027年的出货量将介于120万至150万台间，Apple切入OLED笔记本市场，也已激励面板厂加速相关显示技术发展。TrendForce集邦咨询预估，即使整体笔记本市场近两年皆呈现下滑，2026年OLED笔记本整机出货量仍可望年增近40%，2027年将再成长40%以上。</p>\n  <p><strong>四大行总市值盘中突破10万亿元大关，创出历史新高</strong></p>\n  <p>10月29日上午，银行指数大涨超1%，刷新阶段新高。青岛银行、成都银行、齐鲁银行等个股均涨超3%。四大行也全线上涨，工商银行涨超2%，创出历史新高。值得一提的是，中农工建四大行总市值盘中突破10万亿元大关，创出历史。新高。其中，工商银行总市值超过2.9万亿元，建设银行超过2.35万亿元，农业银行逼近2.6万亿元，中国银行超过2.1万亿元。(证券时报)</p>\n  <p><strong>DoorDash宣布以约170亿美元收购生鲜平台Instacart</strong></p>\n  <p>10月29日消息，外卖配送平台DoorDash宣布以约170亿美元收购生鲜杂货配送平台Instacart，交易预计将帮助DoorDash的杂货配送业务更好地与亚马逊、沃尔玛竞争。</p>\n  <p>DoorDash起家于餐厅外卖配送，此前已建立自己的杂货配送业务，但长期面临Instacart、Uber、沃尔玛和亚马逊的竞争；同时对手们也在渗入其核心的餐食配送腹地，Uber 先后收购了Postmates和Delivery Hero。本次收购完成后，DoorDash将借助Instacart成熟的杂货市场平台及其零售商合作网络，扩大在线杂货配送的份额。(IT时代网)</p>\n  <p><strong>百度确认副总裁吴甜离职，97后接棒</strong></p>\n  <p>日前，业内有传闻称百度集团副总裁、百度研究院副院长吴甜已离职，百度公关经理在朋友圈确认了该消息。她表示，吴甜已结束在百度的任职，而百度的技术工作仍在向前推进。据了解，吴甜长期负责百度人工智能技术、平台与生态，推动飞桨深度学习平台和文心大模型等成果落地 。公开信息显示，吴甜2006年从浙江大学毕业后加入百度，长期在人工智能领域工作。</p>\n  <p>今年7月，1997年出生的孙天祥加入百度，担任基础模型研发部负责人。值得一提的是，日前百度智能云事业群组（ACG）已完成新一轮业务架构重构的消息。（快科技）</p>\n  <p><strong>Alphabet债务风险指标上升，财报令AI举债担忧再起</strong></p>\n  <p>Alphabet Inc.股价周四暴跌之际，其债务违约保护成本上升。此前该公司业绩令人失望，加剧了市场对其举债支持的巨额人工智能（AI）支出可能无法获得回报的担忧。根据ICE Data Services，该公司五年期信用违约互换（CDS）报价一度上升5.3个基点，至每年84个基点，为9月21日以来最大升幅。CDS会随投资者担忧加剧而上升。Meta Platforms Inc.和芯片公司博通等企业的CDS也出现上升。标普全球市场财智固定收益定价执行董事Gavan Nolan表示，如果AI投资取得回报，股票投资者可能获得巨额收益；但如果局面恶化，债券持有人则要承担损失。（财联社）</p>\n  <p><strong>Anthropic成为SpaceX最大单一客户，每月贡献或高达约30亿美元</strong></p>\n  <p>知情人士称，Anthropic成为SpaceX最大单一客户，第三季度为马斯克旗下这家横跨人工智能、卫星和火箭业务的公司贡献了逾三分之一的营收。SpaceX上周在一份申报文件中表示，上季度约34.5%的营收来自AI部门的单一客户。该部门现名为Super Intelligence，提供算力服务。因涉及未公开信息而不愿具名的知情人士称，文件中被称为“客户B”的就是Anthropic。Anthropic的IPO披露文件显示，该公司同意在截至2029年的合同期内最多支出1205亿美元。文件显示，从今年12月开始，这相当于每月约31亿美元。（财联社）</p>\n  <p><strong>美股三大指数集体收跌，谷歌跌超12%</strong></p>\n  <p>36氪获悉，10月29日收盘，美股三大指数集体下跌，纳指跌1.38%，标普500跌0.3%，道指跌0.25%；大型科技股多数下跌，谷歌跌超12%，闪迪跌超5%，美光科技、亚马逊跌超4%，英特尔跌超3%，英伟达、特斯拉、微软小幅下跌，Meta、苹果涨超1%；热门中概股跌多涨少，理想汽车跌超2%，小鹏集团、阿里巴巴、百度跌超1%，网易、哔哩哔哩小幅下跌，拼多多涨超2%，微博涨超1%，京东小幅上涨。</p>\n  <p><strong>宇树回应净利润下滑：系算力、大模型方向研发投入增加所致</strong></p>\n  <p>10月28日晚间，宇树科技披露2026年第三季度报告。公司单季营收6.65亿元，同比增长69.93%；归母净利润1.13亿元，同比下滑17.37%，环比降幅接近50%。针对利润下滑，宇树科技董秘办相关人士表示，主要系算力、大模型方向的研发投入增加所致。该人士同时称，拉长周期看影响可控，单季度仅呈现阶段性变化；现阶段研发投入依托募投资金规划，不会盲目加码。（财联社）</p>\n  <p><strong>美国9月核心PCE同比上涨3.1%，美联储12月或加息25个基点</strong></p>\n  <p>美国商务部公布的数据显示，9月美国个人消费支出价格指数同比上涨3.6%，剔除食品和能源价格后的核心个人消费支出价格指数同比上涨3.1%。分析认为，受中东地缘冲突推升国际油价影响，能源价格上涨带动9月整体通胀反弹，市场关注企业是否将燃油成本转嫁给消费者。核心PCE是美联储最看重的通胀指标，其服务业分项反映国内价格压力是否顽固，一旦该细分项数据进一步走高，金融市场将更多押注美联储在今年12月举行的议息会议上加息25个基点。（央视财经）</p>\n  <p><strong>天元重工上市首日涨120.54%</strong></p>\n  <p>10月29日，德阳企业天元重工在北交所挂牌上市，成为2026年四川首家登陆北交所的企业。上市首日，该股高开高走，开盘价12.26元/股，较发行价4.48元/股上涨173.66%；截至收盘报9.88元/股，涨幅120.54%，总市值21.14亿元。（川观新闻）</p>\n  <p><strong>微软启动10批次美元高等级债券发行，为2017年以来首次</strong></p>\n  <p>微软启动10批次美元高等级债券发行，为2017年以来首次。微软盘前涨幅收窄至1%，此前一度涨超4%。（财联社）</p>\n  <p><strong>澳大利亚部分投资主管对Anthropic的IPO计划持谨慎态度</strong></p>\n  <p>Anthropic PBC即将进行的重磅首次公开募股（IPO），为澳大利亚市场带来一个新的人工智能投资标的，不过当地部分投资主管对此持谨慎态度。“这是一家了不起的公司，”澳大利亚养老基金UniSuper首席投资官John Pearce周四在墨尔本举行的CFA澳大利亚投资大会小组讨论中表示。至于这“能否转化为一项绝佳的投资，那就是另一回事了”。Pearce表示，Anthropic估值达到约2万亿美元可能“有些勉强”。他还说，该公司目前仍处于巨额亏损状态，要在三四年内实现正现金流并创造可观利润，将是一个“艰巨的目标”。（新浪财经）</p>\n  <p><strong>谷歌母公司持有SpaceX股票公允价值达752亿美元</strong></p>\n  <p>谷歌母公司Alphabet在季度报告中披露，截至2026年9月30日，公司持有的SpaceX股票公允价值为752亿美元，但短期内出售受到限制。（界面新闻）</p>\n  <p><strong>台积电以约12亿美元收购友达光电台中工厂及相关设施</strong></p>\n  <p>36氪获悉，据台交所公告，台积电从友达光电股份有限公司收购位于台中市的九处工厂及相关设施，交易总金额388亿元台币（12亿美元），供营运和生产使用。友达光电发布公告称，预计处分收益约185亿元台币。公司致力于轻资产运营模式、盘活资产和改善财务结构。</p>\n  <h2>上市进行时</h2>\n  <p><strong>成都国星宇航科技股份有限公司通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，据港交所文件，成都国星宇航科技股份有限公司通过港交所上市聆讯。</p>\n  <h2>大公司财报</h2>\n  <p><strong>江波龙：第三季度归母净利润37.45亿元，同比增长436.60%</strong></p>\n  <p>36氪获悉，江波龙公告，第三季度实现营收146.3亿元，同比增长123.74%；归母净利润37.45亿元，同比增长436.60%。前三季度实现营收387.18亿元，同比增长131.37%；归母净利润143.22亿元，同比增长1909.68%。</p>\n  <p><strong>中际旭创：前三季度归母净利润222.38亿元，同比增长211.81%</strong></p>\n  <p>36氪获悉，中际旭创公告，前三季度实现营收695.47亿元，同比增长178.13%；归母净利润222.38亿元，同比增长211.81%。第三季度实现营收277.69亿元，同比增长171.83%；归母净利润85.87亿元，同比增长173.74%。</p>\n  <p><strong>澜起科技：第三季度归母净利润12.4亿元，同比增长161.98%</strong></p>\n  <p>36氪获悉，澜起科技公告，前三季度实现营收54.14亿元，同比增长33.44%；归母净利润32.37亿元，同比增长98.32%。第三季度实现营收20.79亿元，同比增长45.97%；归母净利润12.4亿元，同比增长161.98%。</p>\n  <p><strong>比亚迪：第三季度归母净利润100.20亿元，同比增长28.08%</strong></p>\n  <p>36氪获悉，比亚迪公告，第三季度实现营收2214.88亿元，同比增长13.59%；归母净利润100.20亿元，同比增长28.08%。前三季度实现营收5663.04亿元，同比增长0.01%；归母净利润223.45亿元，同比下降4.24%。</p>\n  <p><strong>泸州老窖：第三季度净利润同比下降57.03%，环比增长111%</strong></p>\n  <p>10月29日，泸州老窖(000568.SZ)公告称，第三季度营业收入为41.95亿元，同比下降37.14%；归属于上市公司股东的净利润为13.32亿元，同比下降57.03%。前三季度实现营业收入146.68亿元，同比下降36.58%；归属于上市公司股东的净利润为56.71亿元，同比下降47.31%。业绩变动主要系本期产品销量减少影响所致。小财注：公司Q3净利润13.32亿，Q2净利润6.31亿，据此计算，Q3净利润环比增长111%。(财联社)</p>\n  <p><strong>中国石化：第三季度归母净利润133.61亿元，同比增长57.2%</strong></p>\n  <p>36氪获悉，中国石化公告，第三季度实现营收7697.35亿元，同比增长9.3%；归母净利润133.61亿元，同比增长57.2%。前三季度实现营收2.21万亿元，同比增长4.4%；归母净利润389.88亿元，同比增长30%。</p>\n  <p><strong>阿迪达斯三季度全球营收达73亿欧元，创历史新高</strong></p>\n  <p>36氪获悉，阿迪达斯发布第三季度财报。第三季度，阿迪达斯全球营收达73亿欧元，创历史新高，同比增长7%；营业利润10亿欧元；毛利率同比提升2.5个百分点至54.3%。阿迪达斯大中华区实现营收11.38亿欧元，同比增长13%；前9个月实现营收32.27亿欧元，同比增长15%。</p>\n  <p><strong>招商证券：第三季度归母净利润66.58亿元，同比增长80.65%</strong></p>\n  <p>36氪获悉，招商证券公告，第三季度实现营收122.11亿元，同比增长58.10%；归母净利润为66.58亿元，同比增长80.65%。前三季度实现营收341.12亿元，同比增长86.98%；归母净利润为172.82亿元，同比增长94.81%。</p>\n  <p><strong>吉利汽车：第三季度实现营收990亿元，同比增长10%</strong></p>\n  <p>36氪获悉，吉利汽车发布第三季度财报，第三季度实现营收990亿元，同比增长10%；核心归母净利润达52.1亿元，同比增长32%。前三季度公司总收入2726亿元，同比增长13%；核心归母净利润149亿元，同比增长41%。</p>\n  <h2>酷产品</h2>\n  <p><strong>心言机器人发布具身家庭智能体“巴布”&nbsp;</strong></p>\n  <p>36氪获悉，10月29日，心言机器人正式发布具身家庭智能体“巴布（Bubbo 1）”。心言机器人公司成立于2025年，专注家庭情感智能机器人的研发。本次发布会上推出的巴布（Bubbo 1），基于心言自研的Bubbo OS，实现了全新的伙伴式交互，从“外部”视角构建起一套“Family Agent”，识别家庭中的每一位成员并关注成员之间的关系。</p>\n  <p>在感知层面，巴布共有13类、26个传感器；输出层面，巴布拥有6个自由度和两块表情屏，能够理解复杂情感。除此之外，巴布内置了基于摄像头的心率检测，能够起到非医疗级的提示作用，分析检测对象的心率变化，并且已与测测智能戒指达成合作，可实现设备间的数据共享，时刻感应用户的情绪变化。10月29日起，巴布（Bubbo 1）在京东等官方渠道正式发售���售价9499元，前1000名订购者享受7999元优惠价。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>地球Online公测？谷歌“虚拟世界”Genie 4发布，逼真到发指。</p>\n  <p>&nbsp;</p>\n  <p><strong>FDE：从硅谷到中国，AI 落地的最后一公里</strong></p>\n  <p>硅谷在抢百万年薪的FDE，国内小红书却在避雷“高级外包”，36氪《AI局内人》邀请到了国内大厂FDE专家、中国和硅谷FDE创业者，一起聊聊FDE到底是什么工种？生存真相是什么？</p>\n  <p><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-30T00:12:47+00:00", "fetched_at": "2026-10-30T04:05:48.800176+00:00", "fingerprint": "88df58dbcfc99a51"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨固态电池“卖铲人”获红榕、明势等押注，已完成数十吨交付", "url": "https://36kr.com/p/4047672620611844?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261030/v2_5139bc4b82404fd59ce3daa029a4a72d@6221844_oswg10002800oswg3072oswg4096_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3500</strong>字，建议阅读<strong>9</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，全固态电池关键原材料硫化锂生产商——四川全固态新材料有限公司（下称“四川全固态”）已完成数千万元A轮融资。本轮融资由红榕资本、明势创投领投，天泓投资、兴湘科创及老股东英诺天使跟投。拓深资本、启辰资本担任财务顾问，北京卓晖律师事务所担任法律顾问。资金将主要用于百吨级产线的设备升级与产能扩充、长沙研发中心搭建以及团队建设。</p>\n  <p>在全固态电池产业化前夜，这家成立于2024年的初创公司，正试图在巨头林立的锂电产业链最上游，撕开一道口子。</p>\n  <p>硫化锂并非一个新事物。早在2015年，四川全固态创始人于清炎便在日本客户的委托下首次接触到这一材料。彼时，国内全固态电池尚处于实验室的基础理化性质研究阶段，市场需求极少。但于清炎看中的是前沿材料早期的卡位价值。多年市场工作的历练，让他对红外光学、光伏、半导体掺杂、光通信等材料的应用与解决方案有着体系化认知，并逐步积累了国内早期从事材料研发的学者与电解质企业资源——这为日后切入硫化锂赛道埋下了伏笔。</p>\n  <p>硫化锂之所以关键，在于它是硫化物固态电解质不可或缺的原材料。无论是Li(2)S-P(2)S(5)二元体系，还是Li(10)GeP(2)S(12)、Li(6)PS(5)X三元体系，硫化锂均为核心前提材料。据东方证券研究所测算，在硫化物电解质成本中，硫化锂占比高达60%。</p>\n  <p>“也有人尝试在技术上绕开硫化锂、用其他原料替代，但经过十几年验证，从学术上基本走不通。”四川全固态CTO黄晓向硬氪表示。</p>\n  <p>与五硫化二磷、氯化锂等已有万吨级工业应用的材料不同，硫化锂在历史上几乎没有其他工业用途，供应链长期缺失——这恰恰给了初创公司从0到1建立工艺体系的容错空间。</p>\n  <p>当前，硫化锂的制备工艺路线尚未完全收敛。行业主流路径多以氢氧化锂为锚定点，每制备一公斤硫化锂约需消耗两公斤氢氧化锂，远期成本约为氢氧化锂价格的两倍，相较于液态电池材料缺乏竞争力。</p>\n  <p>四川全固态的选择，是绕过这一路径。公司已自主研发多种硫化锂制备工艺，其中“一步合成法”已实现突破——解决了无序放热问题，反应转化率近乎100%，并免除了高耗能、高固定资产投入的提纯环节。据公司披露，其量产工艺远期具备进一步下探至10万元/吨以下的空间。</p>\n  <p>“我们选择当前这条技术路线，核心是为了支撑全固态电池远期实现固液同价。”黄晓表示。目前硫化物电解质价格高达数百万元一吨，若硫化锂成本无法大幅下降，全固态电池在电芯层面的价格竞争力将无从谈起。</p>\n  <p>知识产权方面，公司已公开10项专利，另有十余项专利在审，并同步布局了硫化物、氧化物、硒化物、碘化物等固态电解质前体材料的全套解决方案。其中，硒化物因在正极侧不生成气体、可显著提升安全性能，被公司内部视为下一代潜力材料，目前已完成实验室开发，小试线搭建接近完成。</p>\n  <p>商业化进展方面，四川全固态迄今为止已完成数十吨硫化锂交付。客户涵盖国内头部硫化物电解质企业及部分主机厂，同时已与韩、日、美等海外客户建立合作。</p>\n  <p>据公司透露，2026年前三季度交付量已达去年全年3倍，预计全年营收突破2000万元。另据追光新能源统计，2025年四川全固态在硫化锂供应商中排名已达第二。</p>\n  <p><strong>以下为硬氪与四川全固态创始人团队的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：全固态电池常被视为液态电池的补充，你们如何判断它的终局形态？</strong></p>\n  <p><strong>四川全固态：</strong>要看清全固态电池的终局，首先要跳出“材料替代”的旧视角。以往的液态电池迭代，本质上都是正负极化学体系的更替，而全固态电池是一次形态层级上的跃迁——它不是某一种体系的升级，而是一个全新的技术平台。它对应的正负极体系既可以兼容现有所有液态电池体系，又能进一步打开特殊体系的空间，既能覆盖消费电子，又能延伸至深海深空、动力、储能等全场景。换句话说，液态电池能做到的它都能做，液态电池做不到的，它也能做到。全固态电池是储能领域难度最高的山峰，但山峰的另一侧，是对当前液态电池体系的整体重构——它对标的是90年代锂离子电池对铅酸电池的迭代关系，而非简单的补充。</p>\n  <p><strong>硬氪：硫化锂行业当前最大的不确定性是什么？</strong></p>\n  <p><strong>四川全固态：</strong>任何前沿产业在从0到1的过程中，都要经历从政策驱动向市场驱动的接力，全固态电池正处于这个接力的关键节点。过去两三年，需求从实验室级别向千吨级别演进，千吨级硫化锂大致对应5至10GWh的全固态电芯——这意味着上游材料的需求量级，正在与产业化进程同频共振。当前最大的不确定性，在于全固态电芯技术突破的节奏，电芯端每一次突破，都会实时传导至硫化锂需求端。</p>\n  <p>但有一点是确定的：我们做的这些材料，在液态电池产业链中并不存在，它们是全固态产业与生俱来的“基础设施”。所以我们的选择是——不赌短期节奏的波动，而是押注整个产业的方向。</p>\n  <p><strong>硬氪：初创公司资源有限，面对上市公司和头部企业下场，你们的应对策略是什么？</strong></p>\n  <p><strong>四川全固态：</strong>在上游材料领域，规模从来不是唯一的胜负手，卡位的时机与技术纵深同样关键。一方面，硫化锂市场规模尚小，上市公司投入的资源和精力严重不足，这给了我们时间窗口。另一方面，技术问题是难倒大多数创业者的第一道门槛，第二道是资金。这两年投在新能源方向的资金是有限的，我们基本占据了赛道大部分的资源。</p>\n  <p>更重要的是，双方的竞争逻辑根本不同：上市公司追求标准品的规模复制，而我们聚焦固态电解质前体材料，拼的是技术迭代速度和客户定制化响应速度——这恰恰是大企业决策链难以匹配的。这个赛道的竞争，不是“大鱼吃小鱼”，而是“快鱼吃慢鱼”。我们的策略很清晰：在窗口期内把技术纵深和客户黏性做实。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>领投方红榕资本表示：</strong>锂电产业的变革已经进入深水区，液态电池的性能天花板之下，全固态是必须翻越的下一座高山，而固态材料的成熟进度，决定了整个赛道的时间表。四川全固态新材料立足西南锂电集群，直面界面、纯度、规模化等行业共性难题，坚持长期主义投入基础创新。基础材料没有捷径，壁垒源于日复一日的工艺迭代。期待公司携手上下游伙伴共建国产固态生态，持续输出稳定、高性能的核心原料，以本土材料力量，支撑我国动力电池向更高安全、更高能量密度的时代跨越。</p>\n  <p><strong>领投方明势创投表示：</strong>下一代电池体系的胜负手，始于核心化学原料的工业化破局。硫化锂之于硫化物固态电池，既是决定经济性的成本中枢，也是影响电化学表现的品质命门。四川全固态新材料跳出传统路径依赖，凭借全球独家的固/固合成改良工艺，攻克了高纯原料规模化制备的工程挑战，并在下游头部客户的严苛验证中确立了出货优势。明势创投坚信具备底层创新与工程兑现力的团队能够引领产业突围，期待公司加速释放量产势能，筑牢新一代能源变革的材料基石。</p>\n  <p><strong>老股东英诺天使表示：</strong>四川全固态聚焦硫化物全固态电池核心原材料硫化锂赛道，依托国内固态电池重大研发专项政策东风，行业远期市场空间可达千亿规模，是下一代动力电池产业的关键上游环节。公司硫化锂产品处于行业第一梯队，已实现吨级稳定出货，成为多家头部电解质企业一供，下游客户资源优质。核心团队拥有十余年锂电材料研发、生产及市场拓展经验。公司技术与客户壁垒初步成型，成长逻辑清晰，期待公司为国产固态电池产业持续贡献价值。</p>", "category": "tech", "published_at": "2026-10-30T01:05:49+00:00", "fetched_at": "2026-10-30T04:05:48.800172+00:00", "fingerprint": "a5c6ef67f9a5689e"}, {"source": "36氪 - 最新文章", "title": "AI进入细胞工厂，资本等的「大结果」快到了？", "url": "https://36kr.com/p/4046754792543106?f=rss", "summary": "<p>文 | 刘凌果</p>\n  <p>编辑 | 海若镜</p>\n  <p>10月14日，诺贝尔化学奖得主David Baker团队连发两篇《Nature》，宣布AI能从头设计蛋白酶；9月以来，Claude、Gemini 4接连宣称具备发现、设计新酶的能力。</p>\n  <p>AI4S水温沸腾，以酶为关键工具的昔日顶流“合成生物”，能否复制AI制药的升温路径，借由AI证明自己，重获资本青睐？</p>\n  <p>“直至今年，大多数企业都没从坑里爬出来。包括当年顶尖VC投的一批公司，甚至估值倒挂。”回顾上一周期，一位投资人感慨。</p>\n  <p>五年前，合成生物也曾风头无两。但此后，随着一批企业倒在中试和商业化，资本退潮，“以生物造万物”变得模糊而遥远。</p>\n  <p>进入今年，AI打开新想象，上一轮出清也让一些项目估值回落，部分投资人透露，又开始关注这一赛道。“今年肯定是有回暖的，但不是回到2021年的状态，主要基于AI和‘十五五’政策驱动。”森瑞斯创始人罗小舟告诉36氪。</p>\n  <p>“既要菌株、代谢通路设计，关键酶的研发能力，又要放大生产经验，还要选品市场规模够大。”英诺科创基金执行董事李英杰将“六边形战士”作为自己的考察标准。</p>\n  <p>10月12日至13日，2026生物制造大赛前沿技���赛道复赛在京举行。从医药中间体、色素到油脂、材料，项目各异，“AI含量”普遍升高；今年获数亿元级融资的微元合成、天鹜科技、利德健康，也无一例外将部分募资投向AI。</p>\n  <p>AI正在怎样改变合成生物，又有哪些坑，AI还没填上？</p>\n  <h2><strong>2026年了，AI能否放大研发优势？</strong></h2>\n  <p>在酶设计上，AI已开始大展拳脚。</p>\n  <p>酶是细胞中的催化工具，帮助原料转化为目标产物。设计更稳定、高效的酶，是提高产品得率重要一步。过去，研究人员主要依靠分析、经验和反复试错来“大海捞针”；AI基于对海量蛋白质序列等的学习，则能更快挑出更具潜力的候选酶，大幅缩短筛选时间。</p>\n  <p>以欣贝莱的乳果糖项目为例，CTO刘华涛介绍，团队通过AI计算平台，从三万多条酶序列中筛选、锁定了一百条进行合成，湿实验验证后，其中约二十条序列表现出催化活性。随后，通过理性设计，AI根据每轮实验数据继续设计突变体。多轮迭代后，表现最好的突变体，活性提高至原来的约5倍，稳定性提升约3倍。AI介入后，用时3个月，实现了野生型酶到工业酶的转变。</p>\n  <p>“对比盲筛，AI能使研发周期缩短大约80%，”刘华涛总结道。</p>\n  <p>光找到一种“能干”的酶还不够。在细胞将底物一步一步转化为目标产物的过程中，往往需要多种酶接力配合。如今，AI也被用于优化细胞内多种酶协作的代谢通路。</p>\n  <p>森瑞斯创始人罗小舟介绍，在角鲨烯项目中，AI综合产量、多个酶表达量等实验数据，推断哪个环节可能“拖了后腿”，再给出具体的调整建议。</p>\n  <p>不过，研发前端找到更好的酶和菌株，只是第一步。进入工厂，它们还要适应不同的设备和生产条件。</p>\n  <p>欣贝莱的达泊西汀中间体项目从实验室到工厂放大的过程中，原始工艺在匹配工厂设备的过程中就遇到了瓶颈，由于生产设备转速比较低，无法像小试那样通过高速离心进行破乳，于是，团队从工艺约束倒推，借助AI提高酶对有机溶剂的耐受性，实现非水相催化，通过工艺调整解决生产问题，最终解决乳化、分离难题。</p>\n  <p>“生产设备稍微改造一下，不止几十万、几百万元，”刘华涛说，相当于AI帮团队省去了这部分成本。</p>\n  <p>小试、中试的工艺放大，是让众多企业折戟的“死亡谷”，AI正在尝试一步一步地填上这些“天坑”。</p>\n  <p>英诺科创基金李英杰介绍，一家企业在完成百升级小试后，进入工厂百吨发酵罐，因罐体、搅拌等设备条件变化，需重新适配工艺参数。加之一次发酵要七天，失败后只能重新投料、再试，落地投产比预期略有延后。</p>\n  <p>“小罐里的培养液相对更容易搅拌均匀；但罐体放大后，不同位置的溶氧、pH和底物浓度会有所差异，导致菌株的生长环境随之变化，小试阶段没暴露的问题浮出水面。”百仑生物AI技术负责人罗洪振解释，中试及量产中，导致产量波动、得率下降的因素众多，对工艺开发而言有点像“黑箱”。</p>\n  <p>AI带来的变化，和改造酶类似，让“黑箱”变得可预测，提前排雷、减少试错。“最近工厂发生一件让现场人员觉得很‘amazing’的事，我把生产批报交给AI分析，它判断一个阀门可能存在问题，工作人员起初不信，实际检查后，发现偏差确实达到约10%。”罗小舟说。</p>\n  <p>类似的变化，也发生在蓝晶微生物的一个中试项目中。蓝晶微生物首席科学家饶驰通介绍，项目连续运行五六个批次，产量始终不稳定，工艺人员多次调试也没能解决。经AI分析后，大约在一周内锁定了原因，调整后产量才稳定下来。</p>\n  <p>不过，目前AI更多用于预测风险、排查堵点，尚不能替代“老师傅”作出决策。何时补料、怎样调整搅拌和通气，仍需负责人员判断；出现染菌、设备偏差等异常，具体操作仍得由“老师傅”接手。</p>\n  <p>这背后既有数据限制，也有决策责任。AI掌握的信息主要来自传感器，范围相对受限；未被记录的异常，难以成为它的学习材料，因此缺少处置经验。另外，如果发生误判，可能导致整批物料报废，因此当下决策结果仍需由人把关。</p>\n  <h2><strong>AI还没填上的坑：谁来买？</strong></h2>\n  <p>事实上，相较技术端的提升，受访企业和投资人认为，行业近几年更显著的变化，是选品更紧贴真实市场需求。目前，这也是AI帮助最少、但对公司业绩影响最大的环节。</p>\n  <p>对品类真实市场需求的错判，是过去几年许多合成生物企业“最痛的领悟”。</p>\n  <p>美国生物塑料先驱企业Danimer Scientific曾投入巨资推进PHA产业化，2022年将年产能扩至5500万磅，希望以可降解材料切入吸管、餐具、食品包装等一次性塑料市场。但随后由于订单不足，产能严重闲置，导致单位生产成本居高不下；叠加星巴克调整订单及债务压力，公司2024年前三季度营收同比下降26%，净亏损约7180万美元，最终于2025年3月申请破产保护。</p>\n  <p>原本市场需求明确的产品，在集中扩产后，也会因供给过剩而降价。</p>\n  <p>用于无糖饮料、烘焙食品等的代糖赤藓糖醇，在2021年前后因需求激增、利润走高，吸引三元生物、诸城东晓、保龄宝等企业集中扩产。到2023年5月，国内年产能已达38万吨，远超全球实际需求，价格从每吨4万元一度跌至9500元，部分新增产能随后停产或转产。</p>\n  <p>公司能生产什么，与客户愿意买什么，有时是两道错位的题目。</p>\n  <p>“有时网上都在提某产品的痛点，但真正与客户交流后会发现，这些痛点只是浮于表面，与真实需求天差地别。”罗小舟认为，合成生物公司应尽早接触市场、摸清市场，提前核算客户可接受的成本、产品形态等。</p>\n  <p>经过上一轮“市场教育”，目前企业的选品逻辑主要向两条路线收敛：一是沿着明确的下游需求提前布局产品；二是切入已有市场，以更低成本替代现有供应方式。</p>\n  <p>医药中间体便是第一条路线的代表之一。“从我们投资的企业来看，早年很多团队集中攻坚黄酮类、复杂萜类（如紫杉醇等）、多肽（GLP‑1）、氨基酸衍生物（麦角硫因、5‑HTP）这类结构复杂产物。后来发现做基础生化原料、医药单体、食品与饲料类功能原料，这些品类开发效率更高、落地更快，也更贴近真实市场需求。”华大松禾生科基金管理合伙人曾晓玉指出。</p>\n  <p>生物农药也是类似逻辑。围绕植物病原菌、病虫害等具体问题开发多肽产品，需求场景比较清晰。同时，生物农药具有较高的监管门槛，开发成本和周期又低于人用药；产品一旦跑通，合规资质、客户等也能进一步构成壁垒。</p>\n  <p>对于通过成本优势替代化学合成、植物提取等现有供应方式的第二条路线，李英杰表示，芳香族化合物、甘草酸、生物基橡胶等产品有相对明确的市场，无需重新培育需求；但价格要降至现有水平的50%-80%，才可能推动客户更换供应方式，仅便宜10%，替代动力可能仍不足。</p>\n  <p>在选品上，AI目前能力仍十分有限，主要用于扩大选品搜索范围。例如，有的企业通过AI梳理海量文献，从中寻找自然界已存在、却尚未量产的“潜力股”。</p>\n  <p>另一方面，AI带来的研发提速，也让企业更倾向于避开容易开发的产品。比如，原本三个月能完成的产品，即使提效十倍，也仅将周期缩短至约九天，竞争者同样容易追赶；如果是过去需三年以上才能完成的复杂产品，研发周期缩短至三个月，AI创造的时间差可能才真正有价值。</p>\n  <p>基于这一判断，罗小舟表示，森瑞斯基本不做合成路径少于10步的产品。</p>\n  <h2><strong>资本还在等什么？</strong></h2>\n  <p>当前，AI已嵌入酶、细胞代谢通路、发酵工艺等环节的优化，研发端显著提速；但经过上一阶段的教育，已经投资过合成生物的投资人们，不再愿意只为“技术”买单。</p>\n  <p>多位生物背景的投资人表示，很多团队都在配置AI能力，但AI还没有转化为估值溢价，也不足以让他们加速出手。</p>\n  <p>他们要看技术落到商业的全链：AI+干湿实验闭环是否跑通；研发提速能否传到生产端，变成更低的单位成本；成本下降后，又能否换来订单。</p>\n  <p>换言之，小试、中试数据，营收和利润，这些更硬的业绩才能左右投资人手里的筹码。</p>\n  <p>“行业竞争的重心，已经从谁能设计出更好的菌株，转向谁能把 DBTL循环压缩到极致。这是这波 AI 浪潮带来的底层工具与研发范式革新，也会让我们从投资的角度来重构这个行业的评估框架。”曾晓玉提到。多位投资人也表达了相似看法：干湿实验闭环，构建出更高效的DBTL（设计-构建-测试-学习）循环，是合成生物最为关键的一环。</p>\n  <p>从Anthropic自建湿实验室，到OpenAI与Ginkgo Bioworks联手搭建自主实验闭环，当大量真实数据在7×24小时的循环中不断产生、回流，模型也将根据实验反馈持续迭代，进一步提高产品得率、稳定性，以及在中试、生产端等提前预判并排除更多风险因素。</p>\n  <p>而无效试错的减少，终将逐步显现在成本、业绩曲线上。当下，越来越多的合成生物企业尝试让AI接管实验室。谁能率先冲线，便有可能在风再起时，拿到“大结果”。</p>\n  <p>要让DBTL真正转起来，绕不开算法、算力和数据三大基本要素。其中，算法各家多基于开源蛋白质大模型继续开发；算力需求因任务而异，单酶预测相对有限。</p>\n  <p>最难速成，也最可能拉开企业AI能力差距的，目前在数据。</p>\n  <p>首先数据稀缺。罗小舟介绍，许多具体生物任务只有万级或十万级数据，百万级都不常见；即使基因组序列达到数十亿、上百亿条，没有对应的实验标注，意义也非常有限。</p>\n  <p>同时，越往生产端，数据越难得。一种菌株从孔板筛选、500毫升小试，走到百升级中试和工厂生产，每上一个台阶，培养条件随之改变，原有数据无法直接套用；规模越大，单次实验消耗的原料、设备和时间也越多，批次数据很难快速积累；此外，数据还受限于硬件“视野”，传感器无法检测的变量，AI自然也无从习得。</p>\n  <p>企业只能先“盘活”已有数据。今年，蓝晶微生物把智能体接入原有自动化研发平台的过程中，饶驰通表示，投入最大的并非智能体开发，而是历史数据的整理。“至少过去四五年，自动化平台采集的实验数据、发酵批报和文档，都要重新分类、归纳和标签化，以此构建本地数据库。这项工作花了很大精力。”但成果也相对显著，当前，蓝晶的发酵过程预测模型已使用几十个维度、数百个批次的数据，可以预测2小时、4小时后的变化。</p>\n  <p>为持续获得新数据，各家都在打通AI与自动化实验室，让“大脑”能直接调动“手脚”。</p>\n  <p>据了解，眼下仍有两处断点：一是AI给出的方向性建议，无法直接落到每一步的具体执行；二是成形的实验方案也不能直接转化为机器设备指令，例如从哪个孔取样、取多少，再向哪个孔加样等具体动作，仍需人来充当“翻译”。</p>\n  <p>主要是因为，一项实验意图要变成湿实验中的真实操作，需依次经过方案设计、SOP（标准操作流程）、设备代码、物理执行和结果反馈等多层转换。每往下走一层，都要将上一步的语言进一步拆解、细化，直到机器能够准确执行。</p>\n  <p>换言之，AI能提供一份精美、详尽的菜谱，但如何让锅、铲和炉灶能自己读懂、理解菜谱，并自动完成烹饪，仍有难度。</p>\n  <p>AI无疑让合成生物跑得更快了，但场边的资本仍在观望，谁会是率先将速度兑现的那一个？</p>", "category": "tech", "published_at": "2026-10-30T01:31:17+00:00", "fetched_at": "2026-10-30T04:05:48.800167+00:00", "fingerprint": "1a8a259a2a2002fb"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨前华为VP创业做AI原生电力资产运营，获宁德时代旗下基金数千万美元A轮融资", "url": "https://36kr.com/p/4047734928259592?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约3600字，建议阅读9分钟</p>\n  </blockquote>\n  <p>硬氪获悉，总部位于瑞典的AI原生电力资产运营商Green Voltis近日宣布完成数千万美元A轮融资，由宁德时代支持设立的美元基金Lochpine Capital 独家投资。</p>\n  <p>本轮融资资金将主要用于三个方面：继续加大Aether AI电力交易智能体与Chronos并网控制系统的研发投入、欧洲重点市场的业务拓展，以及AI基础设施领域的布局。</p>\n  <p>Green Voltis创始人史耀宏，创业前在华为工作16年，曾任华为副总裁，先后担任中东地区部总裁、软件产品线总裁、中国区政企常务副总裁、云与计算中国区总裁，长期负责华为在海外市场的业务拓展和云计算业务。2023年离开华为后投身欧洲电力市场，用AI交易和能量管理系统运营灵活性资产。</p>\n  <p>Green Voltis的核心团队还汇聚了来自华为、爱立信、T-Mobile等ICT领军企业，以及Rolls-Royce、Brady、Varberg Energi等电力系统与电力交易专业公司的人才。</p>\n  <p>如今，AI算力竞争正在将电力推向新的产业瓶颈。在美国，部分数据中心选择通过自建燃气电站等方式获取电力，而在欧洲，天然气高度依赖进口，碳价和气候立法让新建化石电源既不经济、也难获批，而电网扩容的速度远赶不上算力需求，在法兰克福、阿姆斯特丹、都柏林等核心枢纽，数据中心并网排队可长达七到十年。</p>\n  <p>在这一背景下，数据中心能否成为电网可调节的灵活性资产，开始影响其获取电力的效率。对于储能等灵活性资产而言，如何通过交易和控制系统提升收益，也直接关系到项目的经济性和融资能力。</p>\n  <p>Green Voltis的切入点，是为独立储能和风光配储项目提供从并网到交易的一站式服务。公司的本地工程团队负责并网调试及辅助服务资质认证，帮助项目尽快具备运营条件；自研Chronos能源管理系统（EMS）则负责电站现场控制，并支持构网型运行。公司希望通过控制系统与交易平台的协同，将储能设备从单纯的硬件资产转变为能够参与电力市场、持续创造收益的运营资产。</p>\n  <p>其中，Aether AI电力交易智能体是公司的核心研发投入方向。与传统流程型软件主要按照预设规则执行交易不同，Green Voltis从创业之初便选择AI原生架构，希望将市场预测、交易决策与执行连接起来，利用电价预测和量化策略，动态优化不同市场的收益机会。</p>\n  <p>欧洲电力市场的交易机制，为这套系统提供了应用空间。史耀宏向硬氪介绍，欧洲日内市场普遍采用连续交易机制，价格会随着供需变化持续波动；同时，在满足市场规则和交付约束的前提下，储能资产可以参与日前、日内及调频等多个市场和产品。如何在不同市场之间分配有限的储能功率和容量，成为影响收益的关键。</p>\n  <p>Green Voltis采用的策略称为Revenue and Capacity Stacking，即收益与容量叠加。简单来说，系统不是在每个时段只选择一个市场，而是综合预测不同市场的价格和容量需求，在满足各项交付约束的前提下，协同配置多个交易产品。为了实现这一策略，公司不仅自研交易平台，也自研EMS，以便将不同产品的功率曲线进行组合，并协调交易决策与现场控制。</p>\n  <p>牌照是另一道门槛。Green Voltis选择自持关键电力市场牌照，而不是完全依赖第三方持牌机构开展交易。史耀宏介绍，全瑞典仅有2家VPP公司持有BRP牌照。目前，公司已在欧洲10个国家布局电力市场准入。</p>\n  <p>收益表现上，公司提供数据显示，其所管理储能资产的收益持续高于Clean Horizon储能收益指数，而同期行业平均水平约为该指数的75%。</p>\n  <p>在灵活性资产运营之外，Green Voltis正将同一套能力延伸至AI基础设施领域。其判断是，欧洲数据中心面临的核心问题不只是建设机房和采购GPU，还包括如何获得电力，以及如何在满足电网要求的前提下尽快投运算力。</p>\n  <p>因此，Green Voltis将自身定位为Power-to-Compute运营商，而非传统的数据中心开发商：一端连接电网，另一端连接算力，尝试将稀缺的并网容量转化为可快速交付的算力资源。公司计划与合作伙伴共同推进数据中心项目，从具备建设条件的场地入手，打通中高压电力接入、供配电、储能与GPU功率控制等环节，让数据中心在必要时能够配合电网调节负荷。</p>\n  <p>史耀宏透露，公司目前已在北欧储备约120兆瓦具备并网条件的数据中心用地（Powered Land），公司希望在后续项目中，将电力接入条件与供配电、算力部署和灵活性控制能力进一步整合。</p>\n  <p><strong>以下为硬氪与史耀宏交流节选：</strong></p>\n  <p><strong>硬氪：您离开华为后，为什么会选择进入欧洲电力市场？</strong></p>\n  <p><strong>史耀宏：</strong>我在华为期间负责过云计算相关业务。那时我们希望通过云和AI赋能千行百业，但也逐渐意识到，如果对行业缺乏深入理解，就很难真正为客户创造价值。因此，离开华为后，我希望把过去在ICT领域积累的技术和经验带到具体行业中，深耕AI与产业结合的机会。</p>\n  <p>能源市场体量大、变化多，既有复杂的行业规则，也有大量值得探索的机会。与此同时，我们过去做的很多业务偏软件、偏运营，与电力交易和新能源资产运营在底层逻辑上有一定相通之处。当然，能源行业的专业门槛很高，所以我们从创业之初就非常重视跨领域团队建设。联合创始人和研发负责人来自华为，电力解决方案相关的核心人员则主要在欧洲组建。我们希望把ICT技术积累与本地电力行业经验结合起来，解决能源市场中的实际问题。</p>\n  <p><strong>硬氪：公司的核心竞争壁垒体现在哪些方面？如何转化为储能资产的收益优势？</strong></p>\n  <p><strong>史耀宏：</strong>我们的竞争优势主要体现在三个方面。</p>\n  <p>第一是牌照。我们从创业之初就选择自持关键牌照，包括BRP（平衡责任方）、BSP（平衡服务提供方）及售电相关牌照。这样，我们就可以自主制定和执行交易策略，而不必受到其他持牌方的限制。牌照决定了我们能否充分发挥自身的交易能力。在我们已经开展电力交易的北欧市场，VPP（虚拟电厂）领域能够自持相关牌照的初创企业并不多。</p>\n  <p>第二是技术架构。我们从2024年创业之初，就选择采用AI原生的技术架构来解决电力交易问题。与传统的流程型软件相比，我们希望通过AI和量化技术，更及时地处理市场信息、预测价格变化并执行交易，因此能够支持更高频的交易决策。从目前我们观察到的市场情况来看，已经具备一定规模的企业中，采用传统流程型软件的仍然比较多。</p>\n  <p>第三是交易策略。我们采用一种多市场、多产品协同交易的策略，即Revenue and Capacity Stacking。简单来说，就是在同一时间段内，根据不同市场的价格、容量和交付规则，同时参与多个电力市场的交易，而不是每个时段只选择一个市场。要实现这一策略，除了交易平台本身的能力，还需要底层能源管理系统（EMS）的配合。我们选择自研EMS，一个重要原因就是当时欧洲市场上常见的本土EMS产品普遍不支持我们需要的功率叠加功能。不同市场的交易产品有各自的功率曲线和交付要求，需要将多条曲线进行组合，同时满足各项约束，这对系统的控制和优化能力提出了很高要求。</p>\n  <p><strong>硬氪：公司目前已在欧洲10个国家布局电力市场准入，AI交易系统如何兼顾底层能力的跨市场复用与针对不同市场的本地化适配？</strong></p>\n  <p><strong>史耀宏：</strong>欧洲各国的电力市场正在逐渐走向统一。欧洲输电系统运营商网络（ENTSO-E）等机构推动了一系列共同标准，日前和日内市场也通过相应的市场耦合机制不断加强联动。总体来看，欧洲市场中有相当一部分规则和技术要求是共通的。</p>\n  <p>但由于各国电力系统的历史和能源结构不同，具体的市场规则仍然存在差异。因此，我们并不是用一套完全不变的模型直接覆盖所有国家，而是在统一的技术平台和核心能力之上，根据不同市场的规则进行适配。对于规则相近的区域，调整成本相对较低；对于差异较大的市场，则需要更多针对性的训练和算法迭代。</p>\n  <p>其中，日内市场的差异尤其值得关注。不同国家的化石能源、核电和可再生能源占比不同，电力供需的波动特征也会不同，这会影响价格预测所需的数据，以及模型训练和迭代的方式。我们的目标是在尽可能复用底层技术和交易能力的同时，针对各个市场的具体情况进行调整。</p>\n  <p><strong>硬氪：公司不是传统的数据中心开发商，为什么要布局Power-to-Compute？目前约120兆瓦的项目储备意味着什么？</strong></p>\n  <p><strong>史耀宏：</strong>我们一直希望围绕AI与电力的交叉点开展业务。最初，我们主要布局储能等灵活性资产，后来也拓展到光伏、风电等项目。随着AI基础设施发展，数据中心成为电力市场中越来越重要的变量。在欧洲，数据中心不仅需要绿电，也面临电网接入限制。如果不能提供一定的灵活性，并网审批和电力接入可能需要等待很长时间。我们希望把并网预认证、电力交易和自研EMS等能力应用到AIDC场景，让数据中心成为能够与电网协同的灵活性资产。</p>\n  <p>我们的定位是Power-to-Compute，即打通从电力到算力的链条，与合作伙伴共同推进从中高压电力接入、供配电到GPU功率控制的整合。约120兆瓦是我们目前在北欧储备的、具备土地和并网条件的项目规模，并不意味着这些数据中心已经全部建成或投入运营。下一步的关键，是把这些条件转化为能够实际交付的算力项目。</p>\n  <p><strong>硬氪：此次融资由宁德时代旗下基金独家投资？双方的合作会如何形成互补？</strong></p>\n  <p><strong>史耀宏：</strong>欧洲储能市场正在从单纯销售设备，向系统集成、工程交付、运维和电力交易等端到端服务转变。对客户而言，评价储能系统的价值，最终不能只看电池或设备性能，还要看它能否真正提高项目收益。</p>\n  <p>如果企业能够将设备、工程交付、运维和电力交易整合起来，就能更直接地对客户的实际收益负责。但对很多储能集成商来说，在欧洲建立自己的交易能力并不容易，因此与专业的电力交易公司合作，是一种可行的路径。我们与宁德时代的合作，建立在能力互补的基础上。宁德时代拥有更强的产业资源、客户基础和项目储备，我们的优势则在于电力交易、AI预测和储能资产运营，能够帮助客户进一步挖掘项目收益。</p>", "category": "tech", "published_at": "2026-10-30T02:10:29+00:00", "fetched_at": "2026-10-30T04:05:48.800155+00:00", "fingerprint": "ec5140eddf0eb265"}, {"source": "少数派", "title": "让 Agent 读懂你的身体：数据处理篇", "url": "https://sspai.com/prime/story/how-to-analyze-health-data-with-agent", "summary": "在上一篇文章《让Agent读懂你的身体：数据获取篇》中，我花了很大的篇幅讲清楚了第一个问题：Agent怎样拿到数据。如果照着实践完，你大概率已经收获了一份存储了运动健康数据的SQLite、Markdo ...<a href=\"https://sspai.com/prime/story/how-to-analyze-health-data-with-agent\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-10-29T03:29:46+00:00", "fetched_at": "2026-10-30T04:05:47.175783+00:00", "fingerprint": "8d0dab125ed60899"}, {"source": "少数派", "title": "如何成为不吃压力的「大心脏」？", "url": "https://sspai.com/post/117244", "summary": "适合别人的抗压方式为什么不适合自己？你也该知道的抗压方法论<a href=\"https://sspai.com/post/117244\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-29T09:05:38+00:00", "fetched_at": "2026-10-30T04:05:47.175779+00:00", "fingerprint": "c86651425583d4f6"}, {"source": "少数派", "title": "新玩意 254｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/117791", "summary": "编注：很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑部的新玩意」介绍编辑部成
