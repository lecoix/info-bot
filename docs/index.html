;&#799;&#798;&#797;&#796;&#793;&#792;&#791;&#790;&#1161;&#821;&#820;&#808;&#807;&#802;&#801;&#828;&#827;&#826;&#825;&#819;&#818;&#817;&#816;&#815;&#814;&#813;&#812;&#811;&#810;&#809;&#806;&#805; What am I supposed to do with this? It's un-Googleable. Unpronounceable. It doesn't even render the same way on various platforms. It looks one way on YouTube Music. Another on Apple Music. And yet another on Bandcamp. Even the artist name &#10446;&#10311;&#41594;&#4314;&#3901;&#2951;&#8226;&#795;)&#3968;&#9694; [&#8230;]", "category": "tech", "published_at": "2026-07-19T21:02:45+00:00", "fetched_at": "2026-07-20T03:23:39.128422+00:00", "fingerprint": "9de240d548475ac5"}, {"source": "36氪 - 最新文章", "title": "从烤披萨到拿快递，满场跑的机器人终于要进你家了｜WAIC 2026全面探展", "url": "https://36kr.com/p/3902007640459145?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_83063848fca04df59f0b43be0d23d136@2057308263_oswg1278705oswg900oswg1027_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">史上最热的WAIC都整了哪些活？看这一篇就够了。</p>\n  <p><strong>文｜邓咏仪 周鑫雨 王欣逸 温丽虹</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>如果你想知道今年的AI圈第一盛事热度如何，只要来上海感受逼近40度的高温，就能同频共振。</p>\n  <p>没有很热，只有更热。</p>\n  <p>7月17日，2026年世界人工智能大会在上海世博展览馆正式开幕。展览面积首次突破10万平方米，1100余家企业参展，3000余项展品集中亮相，超300款产品全球首发。从展商数量来看，和2023年400家、2025年800家相比——两年翻了一倍还多。</p>\n  <p>从网传的消息来看，本届WAIC门票售罄的日子比以往也要更早——<strong>原价168元的单日票已经被黄牛炒到近十倍价格，三天通票则被炒到3000元。</strong></p>\n  <p>论坛阵容同样也比此前要更豪华。9位图灵奖、诺贝尔奖得主出席本届WAIC大会，强化学习之父理查德·萨顿、深度学习三巨头之一约书亚·本吉奥悉数到场。</p>\n  <p>继2023年的数十款大模型竞相争抢风头，2024年应用井喷，2025年的具身爆发，2026年的WAIC可以说真正做到全面开花——展品的多样性远胜以往，超过108款芯片、261款大模型、208款具身智能终端，都在这次展会中亮相。</p>\n  <p>如果说以前WAIC还在追问“模型、具身到底行不行”，那2026年的答案已经很明晰：无需多问，把AI用起来才是正经事。</p>\n  <p>从AI手机，再到满场跑收快递、做比萨、做手磨咖啡的机器人，再到数不清的Agents……<strong>所有AI公司，都在回答同一个命题：AI如何开始真正干活？AI不再是PPT里的概念，它要当你的同事、你的助手、你的生活搭子了。</strong></p>\n  <p>按照惯例，《智能涌现》编辑部继续暴走世博展览馆，为你带来这份2026 WAIC探展报告。以下是我们精挑细选的展区亮点：</p>\n  <h2><strong>具身：OMG，你吓到我了</strong></h2>\n  <h3><strong>豆脚：请自行感受……</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_0bd924892e42440aba92a0685e75993f@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">“豆脚”机器人</p>\n  <p>不是展品，但成功吸引（吓到）观众的，非“豆脚”莫属。</p>\n  <p>“豆脚”，顾名思义，豆包的脸以下全是脚。这并非“豆脚”第一次当显眼包——ta不仅顶着“初音未来”的脸（初代叫做“腿音未来”）出现在小红书黑客松上，还踊跃参加了今年4月的亦庄机器人马拉松。</p>\n  <p>但这个看似荒诞的产品，代表了一个趋势：具身开发的门槛正在变低。“豆脚”开发者张子豪，是同济大学的学生；“豆脚”的脚，来自1万元出头的小派机器人；豆包的脸和头壳，则是3D打印出来的。</p>\n  <h3><strong>宇树科技：再现春晚拳法</strong></h3>\n  <p>向来在WAIC上最会整活的宇树，这次搬来了2026年春晚同款的机器人节目。6个型号的人形机器人，表演了拳击、群舞的才艺。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_224050c2d4e145c0a301eb97ce9a67ca@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">宇树机器人</p>\n  <p>除了“旧活”，新品也同样声势浩大。无论在世博中心入口，还是自家展台，宇树都展出了全球首款载人变形机甲GD01——这款高达2.8米，酷似机动战士高达的“铁人”，可以在双足和四足间切换，官方定位是交通工具。</p>\n  <p>当然，“一户一甲”的时代还很遥远。GD01创下了宇树产品的售价之最：390万元起。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_ad6da852bb6e4d40889c047bcc45e5b2@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">宇树GD01</p>\n  <h3><strong>加速进化：人形界“阿根廷”</strong></h3>\n  <p>宇树的舞台在春晚，加速进化的主场是世界杯。</p>\n  <p>WAIC上，加速进化将刚刚在2026年RoboCup机器人世界杯中夺冠的Booster T系列人形机器人，搬到了展台，秀了一把球技。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_69714623bf8f45f0b81014b8c55713ea@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">加速进化Booster T系列人形机器人</p>\n  <p>相较于RoboCup中的T1，加速进化带来的则是最新发布的T2旗舰机型。这款机器人搭载的是英伟达Thor芯片，直接刷新了双足人形机器人的算力纪录，同时提升了动态平衡、长时任务规划的能力。</p>\n  <p>最终，这款机器人的职业使命不是踢球，而是教育科创和工业巡检。</p>\n  <h3><strong>恒之未来：做“小狗”，我们是认真的</strong></h3>\n  <p>在众多面目抽象的机器狗中，恒之未来却在认真做真正的“小狗”。</p>\n  <p>“现在的机器狗，都不像狗。我们的差异化就是把狗做得足够仿真。”据工作人员介绍，这款Hengbot机器狗“哮天”，主打宠物陪伴，目前是全球最小的仿生狗。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_84ff4b3839c841a98b850d031bff3b7d@2057308263_img_gif?x-oss-process=image/quality,q_90\" /></p>\n  <p class=\"img-desc\">恒之未来Hengbot机器狗“哮天”</p>\n  <p>与此同时，“哮天”还开放了二次开发接口，用户可以根据不同的使用场景和个人需求，修改机器狗的算法，来实现不同的功能。</p>\n  <h3><strong>豆包手机热度之余，努比亚做了只AI宠物</strong></h3>\n  <p>宣传了十多天的豆包手机2.0——努比亚NaviX Ultra，这次被封进了展示柜里。</p>\n  <p>它有四种配色，分别是蓝境（蓝紫色）、幻梦（粉色）、黑色以及白色，其背部的摄像头为横向排布，侧面还有一个单独的橙色按键，用于调用AI，唤醒豆包AI智能体。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_6cefb79f866249dd8186fea065ade2fa@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">努比亚NaviX Ultra</p>\n  <p>此前官宣的努比亚AI宠物机器人iMoochi，恰好赶上WAIC的第一天上线开卖。</p>\n  <p>iMoochi主打情感陪伴，比起聪明的人，它更像是有性格、语言体系的宠物。工作人员告诉我们，iMoochi不同系列产品的星座、MBTI都不一样，还会使用“iMoochi语”对人类做出回应。</p>\n  <p>比如，我们遇到的这只白色iMoochi是白羊座，还喜欢被抚摸鼻子。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_bfc777fdc9594f2da1f0806ba464f57a@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">努比亚AI宠物机器人iMoochi</p>\n  <h3><strong>AI家人们来了：帮你做完这个做那个</strong></h3>\n  <p>2026年的具身展区的一大变化，一定是帮你干家务活的AI生活搭子变多了，也变强了。</p>\n  <p>如此多的厂商都切入了家庭场景——有躺在掌心小小一个，眨巴着大眼睛求抚摸的小可爱；</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_78c9191aaf394a48aa8195069c7d9cd7@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">傅利叶桌面级机器人GR Nano</p>\n  <p>也有实干型选手，能屈能伸，帮忙看护老人、小孩等群体；</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_d773a1e90fec4360b3f1e7cb41de1e4b@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">诺因智能折叠双臂具身机器人KNOWIN-X1</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_2894f3720f15472999d16708d1dac69b@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">乐享科技小人形机器人M1，能够自主登上滑轮底座，在家庭场景内移动</p>\n  <p>原来只能帮你接咖啡的AI家人，现在升级到可以做手磨咖啡、甚至烤比萨了；</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_7838c137ece84516b97127166d429ab8@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">优里奇保姆机器人，可以做手磨咖啡、画糖画、烤披萨</p>\n  <p>在某城市展区，机器人已经上岗，勤勤恳恳帮忙倒垃圾了；</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_1916911b1f9c40b897953d3a8a2dfddb@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">城市环卫机器人</p>\n  <p>还有帮大家解决顶头疼的家务的：拿快递、把脏衣服拿出来、陪孩子玩儿、帮孩子整理玩具的——这样一个多功能家庭助手，租金每月3000元，心动吗？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_f65d4dcdcf9746b4aa4605fcdea90068@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">未来不远家庭机器人，正在将洗好的衣服拿出来</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_c9507af617a345c0b7a56df27a34e797@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">未来不远家庭机器人，已经进入超过500户家庭</p>\n  <p>未来不远机器人对我们表示，尽管工业、迎宾等是具身赛道落地的首批场景，但“家庭”已经成为2026年形成的又一个共识场景。家庭场景有更多生活类刚需，商业天花板高，也更考验机器人的泛化、通用能力；而RL训练范式的变化，对数据的重视，让具身大脑有了长足的进步——这也是家庭场景增长迅猛的原因。</p>\n  <h3><strong>像人，有时大可不必</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_b47fd625c89745b5973840b9cd056ec0@2057308263_oswg119618oswg654oswg368_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">某文旅机器人</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_7677f6a92484462c9269c3c2da1d497f@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">首形科技机器人</p>\n  <p>在不少具身厂商的展台，你能看到一排“新疆姑娘”“秦始皇”“小书童”对你点头、微笑、挥手致意，很逼真，但也有些掉San……根据这些厂商介绍，这些“人”将落地到迎宾、文旅等场景。</p>\n  <p>有时，机器人也不必那么像人：）</p>\n  <h3><strong>京东：让你当一回数采机器人</strong></h3>\n  <p>一众奇形怪状的机器人里，京东搞来的具身设备走的是实用路线：一个戴上以后就可以采集数据的头戴式设备。</p>\n  <p>我们尝试戴上后拿取商品，从大屏里就可以看到第一视角的画面，也是做了一回机器人本人了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_d0f6186a395741ba9e8820b703b86bc3@2057308263_oswg105108oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">JoyEgoCam头戴式数据采集设备</p>\n  <h2><strong>模型厂商们，不止基模</strong></h2>\n  <h3><strong>阿里：想用AI耳机和AI眼镜一起帮你办事</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_3ebb828837014190a7e22a1cbb5af332@2057308263_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">千问AI耳夹式耳机Qwen Clip</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_4bdfbe2f65df446cad011b1e75118d2d@2057308263_oswg136416oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">千问AI眼镜</p>\n  <p>今年AI对视听交互体验提升的一大核心，首当其冲就是全双工模型。</p>\n  <p>简单来说，以往大模型和人类的交互时，往往是一问一答——用户需要耐心听完第一轮回答，再点击下一轮对话。流畅的对话、打断动作，对大模型而言是很有挑战的。</p>\n  <p>而具备全双工模型的产品，就相当于让AI“长了耳朵”，能够对用户忽然的打断、插话等动作准确识别，并且能同时完成识别这个需求还有生成新一轮答案的的工作。</p>\n  <p>怎么样，是不是和人类正常聊天的方式更像了？</p>\n  <p>而阿里的AI眼镜在WAIC之际，升级成了“智能体眼镜”——不仅能边听边说，还能实时判断交互意图，准确区分用户指令与环境对话。</p>\n  <p>而且，引入眼动追踪和Always-on视觉感知系统，通过内置PPG和温度传感器，可测量心率、血氧、HRV等数据，可以为为用户提供个性化的AI健康解读报告。</p>\n  <h3><strong>百度：Agents、芯片两手抓</strong></h3>\n  <p>作为在大模型赛道早早入局的百度，2026年也重点呈现了自家的Agents全家桶——面向办公场景的AI上班搭子“百度搭子”，Vibe Coding的“秒哒”，也有面向生活场景的相册管理“一刻”、百度网盘GenFlow等Agents产品等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_610b22573c574ebcbd015ba8ce47f004@2057308263_oswg129590oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">百度秒哒</p>\n  <p>除此之外，今年百度也把昆仑芯模组搬了过来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_087138f271cd409894bdfa53203ec3d1@2057308263_oswg155712oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">百度昆仑芯模组</p>\n  <h3><strong>Kimi：朴实的展台，不朴实的模型</strong></h3>\n  <p>今天凌晨，用高达2.8万亿参数的模型再度震惊世界的Kimi，在WAIC现场里却是相当低调。</p>\n  <p>没有什么酷炫的demo，只有朴实的打卡和开发者交流活动……</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_c07d1fb6547e46219b377f29d1b02b61@2057308263_oswg59135oswg459oswg612_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Kimi展台</p>\n  <h3><strong>智能体手机的答卷，阶跃先交上了</strong></h3>\n  <p>四天前的发布会上，阶跃星辰一口气发布了AI终端品牌STEPX、智能体原生操作系统Step AOS、智能体Amoo以及大模型原生智能体手机STEPX Neo，这些也顺理成章成为阶跃展台的焦点。</p>\n  <p>现场可以看到，想要在STEPX Neo手机上下载App，直接用语音和Amoo对话就能实现。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_24116555f1f1442da3b7c017e80dfa73@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">阶跃STEPX Neo</p>\n  <p>拼完8万块积木需要多长时间？你或许没有尝试过，但在阶跃展台的另一边，原力灵机正联合阶跃星辰发起了拼装长城模型挑战，6台机器人连续肝15个小时，背后执行任务的模型，是原力灵机最新的具身通用基础模型以及阶跃的基础大模型。</p>\n  <p>至于能否完成这项挑战，明天就可以见分晓了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_2cc37b7aaad941e49131f4fb1893db58@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">原力灵机x阶跃星辰 拼装长城模型挑战</p>\n  <h3><strong>视频模型跨向世界模型的第一站：爱诗的游戏，生数的具身</strong></h3>\n  <p>视频生成赛道中的创业双子星，爱诗和生数，在西岸会场上演了物理空间意义上的同台竞技。</p>\n  <p>场外，两家最新的大额融资都刚刚落定；场内，两者展台的主要叙事又不约而同指向了世界模型。不过，有关世界模型应该如何落地，两家公司的答案并不相同：<strong>爱诗落地游戏，生数则要做具身大脑。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_ff881d435679493a8e9f5865963d020f@2057308263_oswg92947oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：生数科技</p>\n  <p>在展区，爱诗展示了7月14日刚上线的游戏引擎PixVerse Game。用户可以通过输入文字Prompt，或者基于模板直接生成一款无限生成的影游。</p>\n  <p>“实时互动生成”，是这款游戏引擎的特点。比如，当我们输入“将敌人变成狮子”的指令后，游戏剧情中的蝎子就变成了狮子。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_a6400ba8f747491f943f84a46b65f2ca@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">爱诗游戏引擎PixVerse Game</p>\n  <h3><strong>芯片：中杯、大杯、超大杯</strong></h3>\n  <p>半导体依然是2026年AI圈最热的话题——无论股市的涨跌还是供应链的悲喜，都绕不开它。</p>\n  <p>走进任何一个半导体展位，都难以躲开汹涌的人潮。而今年参展的芯片厂商恨不得把展示模型做得越大越好，仿佛这样才能凸显“超节点”的气势。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_8595841733d44e45b956532bb8eb102f@2057308263_oswg216560oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">华为昇腾950超节点</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_56cc91fd410041efa3b68bbf0deedb6d@2057308263_oswg195529oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">沐曦科技曦景S600超节点</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_d89994f9ae0c47009bf2c6a9d3ae862a@2057308263_oswg157881oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中兴OEX超节点</p>\n  <h2><strong>扎堆的应用，花样百出的AI硬件</strong></h2>\n  <h3><strong>腾讯：只要用我的AI产品，都是我的好Buddy</strong></h3>\n  <p>2026年，Agents，尤其是虾类产品（OpenClaw），是腾讯AI当之无愧的一个亮点。</p>\n  <p>走进腾讯的展台——你能想到的Claw产品都在这了，C位则是WorkBuddy——如今国产类OpenClaw产品的领头羊。</p>\n  <p>除此之外，你也可以体验到WorkBuddy、CodeBuddy、QClaw、Marvis、吐司、Miora（妙镜）、ClawPro等，以及面向智能体搭建的开发平台和云平台。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_351647f00c564b1289bf25894c56289b@2057308263_oswg121836oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">腾讯QClaw、Workbuddy、CodeBuddy</p>\n  <p>腾讯高突猛进的模型成果，也吸引了不少观众。首先，除了前两周发布的Hy3正式版，能实现毫秒级生图的图像3.0模型、3D生成引擎v3.0和世界模型2.0也有亮相。</p>\n  <p>现场还放置了一个关于Skillhub的Skills娃娃机，随机掉落Skill介绍和Token权益。此外还有一些互动小装置，如手绘表情包生成器，可以绘制出自己的专属表情。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_a3b06c2c31a945a0a95b6e6d086cc1eb@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">手绘表情包生成器</p>\n  <p>展会现场，腾讯在展位上搭了一台高约两米的巨型屏幕，当观众的手机连上，向数字助手发出指令，大屏会实时直播AI后台的思考过程：拆解任务、搜了什么资料、调用了哪些工具。任务跑完，就能在微信或企业微信里看到结果。</p>\n  <h3><strong>蚂蚁：敢不敢称称自己几斤几两？</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_4ba1aeacd29541b586fbef0437712bbf@2057308263_oswg801665oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蚂蚁阿福</p>\n  <p>在一众秀肌肉的AI展台中间，蚂蚁的“阿福”展位画风清奇——玩法很简单：现场踏上体脂秤，称出自己“几斤几两”，就能免费把这台秤带回家。（在40度高温暴走暴汗一天的我们表示：不用称也知道今天瘦了……）</p>\n  <p>目前，阿福已经陪伴全国人民累计减重135万斤，超过100万斤的目标。阿福希望作为你的AI减重搭子长期陪伴，督促你管住嘴迈开腿。</p>\n  <p>减重只是阿福的其中一个能力。目前，阿福用户已突破1亿，日均处理超1000万次健康咨询，并且还在发挥更大的作用——帮助偏远地区的留守老人、乡村医生。以往，服务村民健康一线的乡村医生，往往要独自负责上千人的健康，自身也面临年龄偏大、专业水平参差不齐等困难，有了阿福，看病效率能够明显提升。</p>\n  <h3><strong>百川：AI基模厂商里最懂看病的</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_78e1344e270449b7ba4bc406959e0367@2057308263_oswg841716oswg828oswg622_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">百川智能</p>\n  <p>百川智能在WAIC展出的核心应用，是5月份发布的“百小医”，一款定位为“全病程管理”的AI家庭医生。</p>\n  <p>这款AI家庭医生想包办你看病的全流程：看病前帮你梳理症状、别到了诊室一问三不知；看完病帮你读懂那张天书般的检查报告；日常还替全家记住复查、吃药和体检日程——比家人催你还准时。还能替全家记住复查、用药和体检的日程。目前，它同时提供App和微信机器人两个入口，共享同一份健康档案。</p>\n  <p>展台墙上一字排开三块大屏：肿瘤科AI助手、AI肿瘤医生、AI儿科医生，从帮患者“听懂自己得了什么病”，到帮医生做治疗决策，再到解决儿科用药剂量拿捏不准的老难题，构筑了一套医疗决策支持系统，帮助医生提供更优质的治疗决策。</p>\n  <h3><strong>Rokid：看一眼，就付款</strong></h3>\n  <p>如果你想在Rokid展台买一杯咖啡，工作人员会告诉你，戴上Rokid眼镜，看着支付宝二维码，说一声“乐奇，支付xx元”，就能成功付款。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_87eeba755f084794a076adb0a6abada9@2057308263_oswg85708oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Rokid</p>\n  <p>背后，Rokid打通了支付宝和微信两大支付系统——这也是全球首家打通支付体系的AI眼镜厂商。为了确保支付足够安全，Rokid采用了声纹识别技术，并且搭建了账号绑定和授权系统。</p>\n  <h3><strong>东亚家庭的AI硬件，教学是基本功</strong></h3>\n  <p>在AI硬件扎堆的WAIC，对家长有致命诱惑的一句介绍词是：“我们可以教孩子。”</p>\n  <p>灵宇宙带来的是今年5月30日上市的一款掌上小方机，提供了“拍照实物”“AI角色教学”“AI相机”等功能。工作人员告诉我们，小方机上架京东的首日销售额就达到了百万元，“买的都是不想让孩子玩手机的家长。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_25ab91feb24e494e9d0dc447b88d6b3b@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">灵宇宙掌上小方机</p>\n  <p>教学的理念，也融入了不少主打情感陪伴的AI玩具中。比如AI情感陪伴社区“测测”背后的心言集团，展出了家用机器人Bubbo 1。在陪伴之余，工作人员介绍，Bubbo还开放了二次开发接口，能够让孩子在互动的过程中学习编程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_831413d71f3b40178bd3f3cd270dbbdf@2057308263_img_gif?x-oss-process=image/quality,q_90\" /></p>\n  <p class=\"img-desc\">心言集团家用机器人Bubbo 1</p>\n  <h3><strong>讯飞：能让孔子“穿越”回现代的AI黑板</strong></h3>\n  <p>除了进家庭的教学硬件之外，AI还在以另一种形式进入学校教学。</p>\n  <p>讯飞的同窗AI黑板不仅是一块黑板，它还长出了眼、耳和大脑，能作为AI助教同步开展课程教学。在抽象的立体几何、跨越时空的历史人物等教学需求上，AI黑板能带来完全不同的体验。</p>\n  <p>它还能复制出教师的数字分身，想象一下，上自习的时候打瞌睡，黑板能用班主任的声线马上提醒同学，这不得一个激灵马上清醒过来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_c4762c5311de43f7800d8fdec9136f84@2057308263_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">讯飞同窗AI黑板</p>\n  <p><strong>封面来源｜作者拍摄</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_23d8000a423b445b93a7058c519fa360@2057308263_oswg66520oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">👇🏻&nbsp; 扫码加入「智涌AI交流群」👇🏻</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_58f6b0ff62fb4edea29ee09b52dc156c@2057308263_oswg53751oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/W7FX1nqEx-V9LSkwXBED7A\" rel=\"noopener noreferrer\" target=\"_blank\">“智能涌现”</a>，作者：智能涌现编辑部，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-20T01:20:44+00:00", "fetched_at": "2026-07-20T03:23:39.051582+00:00", "fingerprint": "b922de401f1b1fbb"}, {"source": "36氪 - 最新文章", "title": "腾讯云ADP 4.0海外版发布，要把企业级智能体带到全球市场 | 最前线", "url": "https://36kr.com/p/3901396207584902?f=rss", "summary": "<p>腾讯云的企业级智能体平台，正式出海了。</p>\n  <p>7月18日，在2026世界人工智能大会上，腾讯云正式发布了智能体开发平台 ADP 4.0海外版，同步升级智能工作台、Claw 模式、Skill 广场三大核心模块，围绕触达、交互、生态、连接四大能力做了全面国际化适配。</p>\n  <p>ADP 的全称是 Agent Development Platform，定位为企业级 AgentOps 平台，覆盖智能体的构建、分发和治理全生命周期。</p>\n  <p>简单来说，它解决的是企业智能体从建立、运行到管理的问题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260719/v2_889aa2ddb3f543e0ac25904b96326611@2057308263_oswg883734oswg1268oswg710_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智能体开发平台 ADP 4.0海外版</p>\n  <p>这次企业级智能体海外版的核心升级集中在四个方面：一是渠道，Claw 应用支持 LINE、Telegram 等主流海外社交渠道，一站发布即可跨区域触达全球用户；</p>\n  <p>而在交互体验上，智能工作台支持自定义时区与多区域调度，模型输出可跟随用户输入语言自动响应；</p>\n  <p>在开放生态上，模型广场已经接入多家国际主流大模型，平台 Skill 完成国际化适配；并且，平台深度接入 Google Workspace、Confluence、Jira 等海外主流 SaaS 应用。</p>\n  <p>ADP 4.0的一个关键能力升级是 Agent 与 Workflow 双向互调。吴运声在采访中解释了这个设计的逻辑：企业在实际使用中，有些事情是模糊的、开放的，适合用 Agent 方式处理，这会消耗较多 Token；但一些确定性的流程，可以用 Workflow 来做，不需要反复消耗 Token。两者结合，既满足业务需求，又降低成本。</p>\n  <p>这套逻辑在国内也已经有了标杆案例。比如，找钢网基于 ADP 4.0 Claw 模式搭建了企业中台数字员工，接入企业微信，覆盖订单、物流、财务、仓库、发票等多类场景。Agent 负责理解开放问题，Workflow 负责执行严谨业务流程，两者在同一个应用中协同工作。</p>\n  <p>海外市场，ADP 4.0同样已有落地成果。如今，某大型医疗集团利用 ADP 构建了覆盖智能导诊、门诊预约、急诊风险识别等全流程的 AI 医疗助手，预计可独立处理80%以上常规咨询和预约，整体预约效率提升50%以上，患者平均等待时间缩短30%。而另一家海外头部运营商基于 ADP 重构统一客服平台后，整体运维成本预计降低30%-40%，新业务上线周期从数周缩短至数天，应用开发效率预计提升70%以上。</p>\n  <p>吴运声在采访中表示，ADP 的客户数较去年至少翻倍增长。他将增长归因于两点：一是今年 Agent Loop 能力变强，以前不太好做的事情在能力上已经可以支持；二是客户在日常生活和工作中已经被教育了，教育成本大大降低。</p>\n  <p>尽管当前ADP仍以国内市场为主，海外重点看东南亚等区域，会综合考虑市场人口、基建情况、政治环境和对华关系。在印尼，腾讯云已经做了不少私有化项目，在企业内部安装部署智能体。</p>\n  <p>值得注意的是，吴运声在发布中还提出了“十大行业百大场景生态计划”，邀请生态伙伴从客服、经营分析、交易自动化等高频场景切入，依托 ADP 底座和伙伴的行业 Know-how，把智能体带进千行百业。同时，腾讯云还升级了腾讯乐享 Agentic 知识库作为知识底座，与 ADP 的能力底座形成配合。</p>\n  <p>2026年，OpenClaw带来的Agent热潮，也让很多企业迅速将Agent应用到生产流程中。当被问及 WorkBuddy 和 ADP 的关系时，吴运声打了个比方：WorkBuddy 像是员工个人的智能助手，企业管理者未必知道员工用了什么；而 ADP 是云端一体化方案，做好的智能体可以发布出来供团队使用，使用情况对企业完全透明。两者是并存关系，面向不同场景。</p>\n  <p>进入2026年，企业级智能体赛道正在快速升温。吴运声认为，企业最关心的是可信、可控——“我得知道到底是谁做了什么，后面所有东西都要可审计、是安全的。”这也是 ADP 相较于个人级智能体产品的核心差异：管控性更强，可以设定权限，支持全链路可观测和审计，并能直接集成到企业原有的 CRM 或 OA 系统中。</p>\n  <p>从更大的视角看，这次 ADP 4.0海外版发布，是腾讯云将国内打磨成熟的企业级智能体能力向全球市场输出的关键一步。中国模型的性价比优势已经被海外中小企业认知，而企业级智能体平台的出海，意味着竞争从 Token 层上升到了应用层。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-20T01:30:27+00:00", "fetched_at": "2026-07-20T03:23:39.051578+00:00", "fingerprint": "58ff93039dd79c0d"}, {"source": "36氪 - 最新文章", "title": "从“连得上”到“算得懂”，天基通算融合初创公司押注无人系统，首轮融资数千万元｜36氪首发", "url": "https://36kr.com/p/3903365398185857?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>封面来源｜Pexels</p>\n  <p>中国低轨卫星星座的规模化部署已经进入关键时间窗口。</p>\n  <p>一组直观的数据进展是：中国星网已完成第一代组网，垣信卫星在轨运行卫星数量突破200颗，长征十号乙型火箭成功完成全球首次海上网系回收，头部商业公司的可回收火箭也将迎来关键首飞节点。</p>\n  <p>当“上天”这件事的成本有望迅速下降，产业链的注意力也在从“怎么把卫星打上去”转向一个更务实的问题：<strong>卫星组网之后，要给谁用、怎么用？</strong></p>\n  <p>这个问题目前还没有标准答案，但市场上不乏想要给出解法的玩家。</p>\n  <p>一家成立不到半年、聚焦“无人系统通算融合”的初创企业<strong>「星联天枢」，近日正式宣布完成数千万元天使轮融资</strong>，这也是星联天枢完成的首轮融资。</p>\n  <p>简单来说，星联天枢的核心业务是让无人机、无人车、无人船等无人系统，通过一套极轻的卫星通信终端直连卫星，并将采集到的数据在卫星上完成AI处理与决策，再把结果回传地面——<strong>这套“地数天算”的模式，不是单纯的卖设备，而是要把通信和算力打包，面向无人系统提供通算一体的服务解决方案。</strong></p>\n  <p>这也是一个信号。它意味着，在中国低轨星座从试验验证走向规模化商用的过渡期里，产业链条上的创业者们已经开始深入更具体的应用场景，去<strong>探索太空基础设施能力到底如何变现这个关键命题。</strong></p>\n  <h2><strong>为什么是现在？为什么是无人系统？</strong></h2>\n  <p>星联天枢的核心班底来自中国电科54所、航天八院和中科院，创始人程英辉的履历带有鲜明的“国家队”底色。2013年至2024年间，他任职于中国电科54所，历任卫星通信系统主任设计师、副总师、总师，深度参与低轨卫星互联网工程、某高轨卫星通信系统等重点型号。</p>\n  <p>驱动程英辉下场创业的核心要素是产业拐点的到来——中国的火箭技术、卫星平台整合能力不断进步，卫星互联网已经从过去的小众赛道走进全球视野，Starlink的演进路径也让他相信，“接下来，中国在卫星通信和通算一体方向上，会迎来一个大的爆发。”</p>\n  <p>而关于<strong>“为什么选择从无人系统切入”</strong>，则指向更深层的产业判断。</p>\n  <p>程英辉对无人系统的定义比较宽泛，涵盖无人机、自动驾驶汽车、无人船、具身机器人等各类平台。他认为，<strong>在接下来的3-5年，这些来自不同领域的无人系统会是卫星互联网核心的增量用户群体。</strong></p>\n  <p>需求是紧迫的。</p>\n  <p>一方面，无人系统对网络有刚性需求，地面网络在很多场景下难以满足，比如无人机飞上百米高空，地面网络连接就会基本中断，远洋无人船更近乎是通信孤岛。在这些场景中，卫星互联网就是一个很好的解决方案。</p>\n  <p>那么，既然数据上天是最优解，“只做通信”和“通算一体”之间该怎么选，就变得非常明确。卫星数据流量原本就比地面要贵，相比把所有原始数据都传回地面再处理，在星上完成数据处理并回传决策结果，流量成本更低、时延更短。</p>\n  <p>“无人系统会是最快需要‘上天’去计算数据的一类用户，这也是我们提出通算一体的初衷。”程英辉说。当然，未来的无人系统通信，并不是要用户在卫星和其他方式之间做选择，而是会走向星地融合的立体网络，根据任务需求、所处环境、成本预算等因素，智能地选择最优链路。</p>\n  <p>不过坦率地说，这个方向还处于早期建设阶段。</p>\n  <p>国内两大低轨星座都还没有正式商用，流量费的定价体系尚未建立，星上智算能力仍需验证。这意味着无论是终端设备的大规模出货，还是通算服务的商业模式跑通，也都还需要等待上游基础设施的进一步成熟。</p>\n  <p>程英辉对时间的判断相对冷静，“市场真正爆发，快的话三年，慢的话五年。但到了那个时间节点，我们也会真正形成自我造血的能力。”</p>\n  <h2><strong>太空算力的路径分野与现实选择</strong></h2>\n  <p>如果把实现“通算一体”的长期目标拆开，星联天枢现阶段重点要做的其实是两件事：<strong>一是让无人系统能稳定地直连卫星；二是在卫星上能针对无人系统的特定数据做高效处理。</strong></p>\n  <p>这两个目标也分别指向其现阶段的两款核心产品，无人系统的智能卫星终端，和面向无人系统的星载智能计算载荷。</p>\n  <p>在端侧，要把产品尽可能地做到轻量化，尤其是在航空场景中，重量和体积的优化直接对应客户真实的使用和决策门槛。星联天枢第一款面向无人系统的智能卫星终端重量为2kg，据悉是目前国内最轻量化的Ka波段宽带卫星通信终端。</p>\n  <p>星侧产品的技术难度和研发周期显然更“重”一些，值得关注的点在于其架构路线选择的差异化。</p>\n  <p>与“堆GPU算力”的方案不同，星联天枢采用异构计算架构。这背后的逻辑是，不追求绝对的算力峰值，而是基于需求场景，从无人系统的数据特征反推技术路线与硬件设计。</p>\n  <p>“无人系统承载的载荷类型太多了——光学、红外、SAR、激光��达，各种数据类型都不一样。如果全部用GPU来处理，效率很低，成本和功耗都高。”程英辉提到，“我们是瞄着最早需要上天处理的数据来做产品定义，那硬件架构就需要适配不同类型的数据。”在星上功耗和散热能力有限的现实条件下，这种适配性设计在工程上更具可行性。</p>\n  <p><strong>只有当端侧和星侧的部署进一步上量，数据才能真正协同起来，形成“通算一体”的解决方案。</strong>从产品验证到规模扩张，这个过程大概也需要3到5年。</p>\n  <p>对星联天枢来说，今年最重要的两件事情是，自研卫星终端产品要尽快落地，预计在9月推出首批样机，目前已与国内某应急管理无人机项目、新能源重卡企业、某交通集团等达成合作；年内完成地面的“无人系统地数天算”验证系统搭建，先把整个流程在地面跑通，明年再推进到星地联合实验阶段，把算力载荷真正打上天去做在轨验证。</p>\n  <p>一个远期目标是，程英辉希望星联天枢能够成为无人系统领域的头部天基通信智能服务商。</p>\n  <p>这个方向的选择，某种程度上也折射了国内太空算力赛道的路线分野。</p>\n  <p>当前国内押注太空算力的公司大体可以分为两类。一类是想直接构建天基数据中心的玩家，路径更接近“先搬算力上天，再慢慢降成本”，对标的是星舰+Starlink的远期逻辑，实现前提是火箭发射成本、卫星能源系统、散热技术、芯片抗辐照等关键瓶颈的逐一打通。另一类则是星联天枢选择的，不直接与地面算力比成本，先在无人系统等刚性场景中形成闭环，再向更大的生态扩展。</p>\n  <p>两种路径背后，是对太空算力产业化时间节奏判断的差异。</p>\n  <p>在程英辉看来，<strong>太空算力成本追平地面还需要很长时间，聚焦无人系统的通算服务，优势就在于商业闭环的节奏更快。</strong>至少在卫星初步组网之后，先解决给谁用、怎么用的问题。</p>\n  <p>看向更远的未来，他们也在试图回答一个更大的问题：当卫星互联网不再是稀缺资源，太空基础设施之上的应用层会是什么样子。</p>\n  <p>对一家成立不足半年的初创公司而言，谈终局还为时过早。但至少，它给出了一个不同于“搬数据中心上天”的解题思路。而从方向正确到商业跑通之间，星联天枢还需要用产品落地、客户验证和在轨数据，一步步填平这段所有硬科技公司都绕不开的路。</p>", "category": "tech", "published_at": "2026-07-20T02:30:06+00:00", "fetched_at": "2026-07-20T03:23:39.051573+00:00", "fingerprint": "b81a7f773aa25518"}, {"source": "36氪 - 最新文章", "title": "谁还在卷参数？WAIC2026全是能干活的实体AI！", "url": "https://36kr.com/p/3903383663478403?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_e32de2f0c5594d36a095422c0a59723b@6381723_oswg61886oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_1cdcfc695e2f43fd9e7364eee2f1c101@6381723_oswg798oswg900oswg60_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;7月17日-20日，一起在WAIC2026现场，看见人工智能真正进入产业深处。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_d08ee0ce6d4e4952ad83fd01f664b6ff@6381723_oswg269oswg900oswg80_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_6a8f9842a04c4e47b84d024f6f5a2e2f@6381723_oswg284oswg1080oswg26_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>过去一年，围绕AI行业的讨论正在变得更具体。大模型能力仍在持续迭代，但外界关注的重点，已经不再只停留在模型参数、模型发布和单点能力展示上。随着智能体、具身智能、空间智能、AI基础设施等方向不断演进，行业开始更频繁地追问：AI如何进入真实流程，如何完成复杂任务，又如何在产业场景中形成可持续价值。</p>\n  <p>这种变化背后，是AI竞争维度的继续扩展：模型能力仍是基础，但企业真正要面对的，已经包括数据质量、工程系统、场景理解、交付能力和商业闭环等更复杂的问题。智能体需要从工具调用走向任务协同，机器人需要在真实场景中完成稳定作业，AI视频和空间智能正在改变内容生产与三维世界理解，算力、连接和云服务也在支撑更大规模的应用落地。模型能力仍是起点，但不再是全部答案。</p>\n  <p>这也让今年的WAIC有了更清晰的观察价值：当AI从技术热词变成产业变量，真正值得追问的，不再只是“它有多强”，而是“它如何被使用、如何被交付、如何形成新的商业秩序”。</p>\n  <p>作为全球人工智能领域的重要盛会，2026世界人工智能大会将于7月17日-20日在上海世博展览馆举办。本届大会以“智能伙伴共创未来”为主题，聚焦人工智能前沿技术、产业应用与生态协同。作为大会生态合作伙伴与特别支持媒体，36氪将继续以“氪话未来直播间”为内容窗口，深入WAIC第一现场，通过“直播对话+探展直击”的形式，连接大会、企业展台与产业现场，把复杂技术讲清楚，把产业变化讲透彻，把AI正在发生的真实进展带给更多观众，又或许是潜在的合作伙伴。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_6d35d3e8cbf74575b4b4bd09ec083535@6381723_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;直播对话：聊透“AI战术板”</strong></h2>\n  <p>AI行业正在进入一个更侧重“解决方案”的阶段。</p>\n  <p>过去，行业讨论的重点是模型、参数、算力和技术路线；现在，更多问题指向了真实业务：一个Agent如何真正进入招聘、医疗、办公、汽车服务等行业流程？一家AI企业如何从产品能力走向交付能力？一个智能系统如何与人的工作方式重新配合？</p>\n  <p>今年“氪话未来直播间”将带来一场AI Agent专题对话，以禾蛙Domi猎头Agent首发为切口，观察智能体进入专业服务流程的真实路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_801106b4cb79499b9d4f9ba505ef78ff@6381723_oswg75486oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>精彩看点：</strong>7月17日15:00-15:40 Domi来了：���头Agent首发丨禾蛙WAIC 2026</p>\n  <p><strong>看点前瞻：</strong>当Domi进入猎头行业，它改变的可能不只是简历筛选效率，而是岗位理解、人才匹配和顾问协作的整个流程。猎头Agent能否理解复杂岗位需求？能否降低企业、顾问与候选人之间的信息摩擦？这场对话将从Domi首发切入，观察垂类Agent走向真实业务现场的路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_af27b62758b7417ba11d796bc8b89170@6381723_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 探展直击：</strong></h2>\n  <h2><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;今年WAIC，36氪继续“暴走”</strong></h2>\n  <p>如果说直播对话回答的是“行业正在想什么”，那么探展要回答的就是“技术正在改变什么”。</p>\n  <p>今年WAIC现场，36氪将化身“战地记者”带领观众深入创新“前线”，通过探展直播的形式，开启一场从技术突破到应用落地的沉浸式探馆之旅。观众将走进穹彻智能、华沿机器人、易鑫集团、联汇科技、PPIO、阿里云等企业展台，围绕AI基础设施、汽车消费服务、空间智能、具身智能与通信连接等代表性方向，近距离了解人工智能技术如何从模型能力走向真实场景。从AI视频创作到机器人服务，从智能终端到AI应用基础设施，36氪将通过现场演示、企业交流与产品体验，呈现不同企业在人工智能领域的创新探索，带观众发现AI技术背后的产品价值与行业变化。</p>\n  <p>沿着暴走团路线，向大家提前剧透：</p>\n  <ul>\n   <li>走进穹彻智能展台，你或许会发现，机器人离真正\"上岗\"已经比想象中更近。从真实数据采集到模型训练，再到商业场景落地，穹彻智能将完整展示其具身智能技术路线，呈现机器人如何不断学习、持续进化并参与真实服务。那么，机器人如何从一次次真实交互中积累经验？支撑机器人能力提升的数据体系是如何构建的？具身智能距离规模化商业应用还有多远？或许在这里，你会看到具身智能迈向规模化应用的更多可能。</li>\n   <li>华沿机器人展台将展示七轴人形手臂HY7与ECHO5系列产品，我们可以在现场看到机器人完成电子迷宫挑战、挥手互动等任务，并通过VR遥操作体验机器人在远程控制下执行物品递送等动作。除此之外，华沿还将展示结合中医大模型的AI理疗机器人，呈现具身智能在健康服务场景中的探索。在现场我们可以直观感受到人形手臂如何实现更加精准灵活的动作控制？具身智能机器人如何从单一功能展示走向真实场景应用？</li>\n   <li>在易鑫展台，我们将看到AI如何重塑汽车金融服务流程：从分期预审、身份认证到审核放款，首次发布的AI智能一体机将传统线下冗长的办理流程压缩为更高效、更注重隐私保护的自助体验，数字人提供7×24小时全程引导服务。在现场我们还能进一步感知一体机背后的AI实力。通过Ai demo演示，了解多个AI Agent是如何自主协同运作，驱动外呼、智能风控、客服等汽车金融服务全链路。这些原本发生在后台的智能能力，都将在现场得到更直观的呈现。</li>\n   <li>一套模型，能不能同时驱动无人机、PC和可穿戴设备？Om AI联汇给出的答案就在展台现场。搭载VLX系列端侧流式多模态模型的多款终端产品将集中亮相，其中，自主无人机将成为展台的一大看点。从无人机、PC到可穿戴设备，一个多模态模型如何适配不同终端，并实现视觉理解、内容创作与智能交互？现场还将展示模型在巡检、办公、可穿戴等多个场景中的落地应用，带你近距离了解端侧物理AI如何真正走向日常使用。</li>\n   <li>PPIO展台将带你走进AI Agent的“工作现场”：从模型调用、工具协同到复杂任务执行，Token工厂、Agent沙箱与Harness平台将完整演示智能体运行的全过程。看完现场演示后，你将更加理解AI Agent为什么需要自己的“工作环境”?开发者又如何让它24小时在线、安全稳定地完成任务？如果你想知道下一代AI应用是如何真正跑起来的，不妨来这里寻找答案。</li>\n   <li>在阿里云展台，你会看到AI如何从一块芯片、一组算力，逐步走向企业的真实应用场景。从平头哥自研AI芯片、智算基础设施，到通义千问大模型及企业级Agent平台，阿里云将展现人工智能从技术底座到产业实践的完整路径。我们可以看到企业如何借助大模型快速构建专属智能体？工业制造、科学研究、金融办公等领域又如何通过AI实现效率提升？现场多个应用案例，将呈现AI加速融入千行百业的新趋势。</li>\n  </ul>\n  <p>今年的“氪话未来直播间”，36氪希望做的，不只是带着观众看热闹，更是把展台背后的技术路径、产品逻辑和产业变化讲清楚。</p>\n  <p>从AI Agent到具身智能，从空间智能到AI基础设施，从汽车消费服务到端侧多模态应用，AI正在进入越来越具体的业务场景。它不再只是一个被讨论的技术方向，而是正在变成企业产品、服务流程和产业协作的一部分。</p>\n  <p>7月17日-20日，锁定36氪视频号、36氪抖音账号@氪财经，36氪“氪话未来直播间”，以及36氪微博。我们将在WAIC2026现场，和你一起看见AI走向真实世界的最新进展。</p>\n  <p><strong>更多现场报道，扫码查看WAIC专题页：</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_c794b2a8cd8943b79ab5668fa85577b6@6381723_oswg33981oswg1080oswg1080_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_1dabeb52dba94db7a72543f73a38888b@6381723_oswg237740oswg1080oswg596_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_719e69a87bb04561b5ece95701b8d6b3@6381723_oswg4950oswg1080oswg72_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-07-20T02:49:41+00:00", "fetched_at": "2026-07-20T03:23:39.051565+00:00", "fingerprint": "8c14075b7fd0baa3"}, {"source": "36氪 - 最新文章", "title": "在WAIC地下一层找机会的年轻人：光鲜是过去，眼下是生存", "url": "https://36kr.com/p/3903396279125888?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_f53cbd875e6d4c2f97ef3a292cadebb9@6381723_oswg1461014oswg900oswg1027_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">6个年轻创业者在WAIC的故事</p>\n  <p><strong>文｜温丽虹 王欣逸</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>在上海世博的WAIC现场，想找初创公司的主场H4得颇费一番功夫。</p>\n  <p>经安检进入主会场，远远只看到会场墙壁上H1到H3的标识。跟随汹涌人群挤进一楼主展馆，几名忙着操纵具身智能机器人的知名厂商工程师翻了翻他们群聊里的展会地图，抱歉地告诉我，他们也不清楚：“这里只有H1到H3，没有H4。你是不是去分会场找找？”</p>\n  <p>属于初创团队的场地在主展馆地下一层偏居一隅，一道亮黄色的大门默不作声地支在场馆西北侧的角落。穿过这道大门，就是遍布初创公司的一方天地。</p>\n  <p>来之前，我们知道并非所有的AI创业者与科创公司都对参加WAIC怀抱热情。但对于手握产品与创业理想，又欠缺助力的初创团队来说，参与这次展会是一件有点“不得不去”的事情。</p>\n  <p>你能轻易辨认出那些为这个机会拼尽全力的人。他们中的一些人，手中用于演示的样机还贴着临时修补的胶带，但站在那里时，目光总在捕捉每一个放慢脚步的观众。一天下来，他们所做的，就是把产品的逻辑和未来的愿景一遍遍说给人听。</p>\n  <p>也有些人，连展位的方寸之地都无法拥有。他们穿梭在展馆的人流里，胸前挂着的参会证可能是整个团队团队唯一的入场凭证。接到一个现场互动辩论环节的邀请，他们从深圳奔赴上海，只为了在活动方既定的规则内，见缝插针地向现场观众介绍自己的产品和愿景，在一两句话之内讲清楚自己是谁、在做什么，并且期待台下海海人群中，有伯乐精准地识别到与他合作的可能。</p>\n  <p>凡此种种，这些即时、高强度的自我推销，本身就是一种稀缺的能力，也是许多初创团队的创业者在资源匮乏中不约而同习得的生存技巧。尽管他们中的很多人，在过去有着光鲜的职场履历，但投身创业后，这些履历能帮上忙的地方很少。</p>\n  <p>不少团队告诉我们，拿到一个展位，交费是最后的事情，如果没有被基金、孵化园等推荐，初创团队往往没办法拿到这张入场券。而对于OPC而言，进场的方式更为严苛，要从近700个项目里争夺22个席位，录取率约为3%。</p>\n  <p>能拥有一个展位，即便只有5平米不到，在参展者眼中也极具诱惑力。它意味着一次连续3天不间断地被外部世界看到、被询问、与人交换联系方式的机会。这种机会，在许多初创团队日常的创业生活里是稀缺的。</p>\n  <p>除了研发产品，他们的时间通常被寻找资金和出路占满，与之相对的是，他们与外部的连接往往局限。大大小小的展会，是少数能让他们的产品与真实世界发生接触、进行自我表达的机会，像WAIC这样量级的超大型展会，更是难能可贵。没有一个需要机会的人，会拒绝这样一个展位。</p>\n  <p>我们和其中的一些人聊了聊，想知道在起点处，当资源、人脉、关注都尚未到来的时候，他们付出了怎样的代价站到了这里，又是以怎样的野心面对世界与未来。</p>\n  <h3><strong>故事一：被塞满的日程表</strong></h3>\n  <p>曾歆勋从深圳来。他没有展位，只有一张参会证。周四登上从深圳飞往上海的航班时，他带了一张参会证和一张排满的日程表。</p>\n  <p>他们全部的展示机会就是在腾讯小程序在现场举办的快闪活动上，一个互动辩论环节。这个活动不是路演舞台，有自己的流程和规则。曾歆勋要做的，是在规则之内找到一处处间隙，把自家的产品与自己对市场的观察和信心讲出来。这不是一个完美的契机，但却是会场内仅有的机会。</p>\n  <p>曾歆勋的产品叫“良配”，一款基于AI的婚恋应用。</p>\n  <p>现场辩题是“AI情感产品要‘用完即走’还是‘长期粘性’”。曾歆勋站的是正方，“用完即走”。他拿过话筒阐述观点：婚恋场景里，用户真正需要的不是跟AI一直聊下去，而是在最短时间内找到对的人，然后离开产品，回到真实的关系里去。产品退居其后，人才是目的。</p>\n  <p>这个阐述，也符合“良配”的理念。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_c93a85fe1dce44ecbecc27fdb561a4dd@6381723_oswg93630oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△曾歆勋在WAIC现场</p>\n  <p>对曾歆勋这样的初创者来说，这场大会在几天之内把投资人、产业方、媒体、开发者、潜在合作方都压缩进了同一个空间，制造了一个难得一遇的临时生态。平时散落在各个城市、各个写字楼里的人，这几天都在同一个场馆里走动，人和人之间的边界暂时模糊了。</p>\n  <p>他把这几天的行程排得很满。周四到上海就去见投资人。周五参观WAIC的展览，中午和一位投资方吃饭，聊了整个下午。周六上午和FA沟通，下午参加微信开发者活动。这些日程延绵到周日，穿插着数个正式的媒体访谈。周一离开上海，他也不回广东，而是去南京见一位综艺导演，准备通过与婚恋综艺的合作，把自己的产品推到更多用户的面前。</p>\n  <p>融资和PR，是他现阶段最重要的事。团队的计划分两块：一边做用户增长，另一边投入模型研发，让大模型学会人际关系匹配。两件事都需要钱，都需要被看见。</p>\n  <p>过去一整年，他几乎都把自己关在深圳南山的办公室里，带着研发团队训模型、开发产品。曾歆勋上一份工作在Kimi，他说杨植麟也是这个节奏，研发阶段隐于人前，全身心投入产品和团队，到了需要推向市场的节点，再频繁出现，为产品站台。</p>\n  <p>“创始人需要时刻知道，此刻哪个环节最需要我。”曾歆勋说。现阶段，那个环节在融资，在PR。在上海的五天，他把自己从产品里拔出来，装进一张排满的日程表里。</p>\n  <h3><strong>故事二：商汤001号员工和他AI家庭成员</strong></h3>\n  <p>Leo的展点，是模力社区展位内的一张桌子。模力社区是上海张江打造的垂类模型产业生态集聚区，这次WAIC，他们在自己的展位上划出一片区域，入选团队都能分到一张桌子，Leo在把带来的样机、一台用于展示的电脑和一叠宣传册摆在了桌子上。</p>\n  <p>Leo和团队的产品叫CookiePi，一款AI角色互动硬件，由一个Cookie触发器加多个Pi角色端组成。用户把角色端放进玩偶、手办、家居摆件里，可以让AI角色以具身形态散落在生活空间里，主动聊天、即兴表演、共同生活。</p>\n  <p>团队创始人叫徐持衡，是商汤科技001号员工，师从汤晓鸥教授，与团队共同开发的人脸识别技术，是商汤科技早期最重要的技术里程碑之一。2025年他创办酷奇奇，WAIC举办前，刚刚宣布拿了数千万元种子轮融资。</p>\n  <p>但在WAIC的这张桌子上，这些背景不写在脸上。观众走过来，Leo需要在一两句话之内讲清楚这是什么、能做什么。一天下来，这套动作重复几十遍。左右都是别的团队，声音互相干扰，观众的注意力随时被旁边的演示拉走。</p>\n  <p>这张桌子对她来说，是这段时间的一个锚点。从5月到现在，团队在跑内测、迭代产品、追每一波流量，节奏快到来不及停下来看一眼自己走了多远。展会逼着他们停下来，把样机摆出来，把产品逻辑讲清楚。在这个过程里，她能感觉到哪里还不够、哪里已经立住了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_05c4cde5f35c47bf8fbf7e7f7af18ea4@6381723_oswg143060oswg1080oswg1080_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△酷奇奇展位</p>\n  <p>早在两个月前，科技博主“小狮日记”发了一条视频，用AI手搓智能家庭成员，全网播放超过2000万。那条视频不是酷奇奇投放的商单，但酷奇奇的投资人、合作伙伴、上下游都以为在说酷奇奇。</p>\n  <p>“小狮日记”在视频里埋了一句话，说在找这样子的硬件量产团队。Leo看到了，不仅抓紧时间联系“小狮日记”，也用官号去视频评论区，一条一条地，对每一个说“想要量产”的人说：我们可以。以前她没做过这种在评论区拉人的事。问她会不会怕尴尬，怕被讨厌。她说：“天降流量，考虑不了到底会不会被讨厌，我先试了以后再说。”那天她从评论区捞了30个用户。后来与小狮日记谈合作，怕对方“开溜”，一旦发现对方站起来，她就赶紧按住肩膀：“你等一下！”</p>\n  <p>近期，为了建立用户付费意愿，和用户使用体验反馈基准测试，Leo开始了付费1000元的MVP测试。参与用户每天需要回答体验感上的问题，包括设备操作是否流畅、角色是否“聪明”“懂你”“有个性”。测试测试日期最后一天的问卷里，会直接问：“如果再也不能使用CookiePi你会失望吗”，80%以上的用户填了“会非常失望”，甚至有人在归还设备的时候郑重其事地拍了告别视频，叮嘱酷奇奇的运营同学，“早点让我和比奇堡家族再见面”。</p>\n  <p>这批用户的使用时长，也超出了预期。很多人一次用两个小时，如果不是机器没电，她们还能继续聊。为此，酷奇奇做了防沉迷，让机器在充电时不能用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_aeca136f88244df2a13318dd4823e3dd@6381723_oswg108706oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△酷奇奇团队与“小狮日记”团队</p>\n  <p>WAIC期间，有内测用户特地来场馆找Leo，想看看产品。三天下来，Leo觉得累但值得。</p>\n  <p>Leo想好了，回北京的第一件事就是要跟产品部门的同事商量定价。作为一款AI陪伴产品，随着新功能上线和迭代，token的成本不好预估，后续还有新功能要上，这不是一个简单的年费计划就能解决的问题。</p>\n  <h3><strong>故事三：如果Liblib做了你们的产品怎么办</strong></h3>\n  <p>“如果Liblib做了你们的产品怎么办？”刘如山在和投资人交谈中，被问到了一个这样的问题。</p>\n  <p>她不知道怎么回答。要和已经拿到多轮融资的同赛道明星创业公司直面竞争，她想不到怎么赢。与此同时，她还在面临着两件事：培养出的员工被竞争对手高薪挖角，已经过会的一轮融资最终被撤回。</p>\n  <p>Mulan AI（木兰AI）创立于2024年5月，除了刘如山外，还有两位创始人——前土豆网的7号员工与前携程网的20号员工。</p>\n  <p>刘如山近来时常感到愧疚，总念着那笔遭撤回的投资，觉得与自己脱不开干系。她认为，自己并不在一级市场严格的“创始人画像模板”当中，“如果我有从字节出来的产品经理的经历，或者有一个清北的学历，投资人也许就会投进来了。”她常常跟不同的人这样说。</p>\n  <p>刘如山曾经当过近五年的全职妈妈，在一家世界500强干了12年，还创下某SaaS公司史上最快升合伙人的记录。当ChatGPT出现后，她做出了一个大胆的决定：放弃稳定的工作，加入到AI初创的行列中。</p>\n  <p>Mulan AI是一家做视频营销Agent的初创公司。在H4展区，和他们一样在做AI视频的创业公司，有一整列，几乎涵盖了这一赛道的所有可能性。在Mulan AI的展位隔壁，是一家清北背景的年轻团队，在创业之初迅速拿到了第一轮融资。位居其中，Mulan AI并未显现出明显的过人之处。</p>\n  <p>Mulan AI是行业里最早推出融合画布、工作流与视频Agent的团队之一。区别于行业里常见的输入指令直接生成视频，Mulan AI可以让AI来进行画布编辑与工作流编排，将创作流程封装为可复用的工作流模板。具体来说，用户可以输入脚本，平台能一键生成统一风格的角色、场景、物品等数字资产，支持用户逐帧调整时长、旁白、视觉参数等细节，AI自动完成初剪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_e12dde59994e48809cecff44f733e149@6381723_oswg213189oswg1080oswg628_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">���Mulan AI生成工作流界面，图源：官方</p>\n  <p>创业的世界里，不可能每个参与者都能品尝胜利的果实。一年来刘如山逐渐意识到一个现实：视频AI赛道的头部厂商，如Liblib等字节系创业公司，产品迭代速度相当快，与其直面竞争是不明智的。</p>\n  <p>这次来WAIC，她决定把融资的事情先放一放，希望能链接上更多的客户，并逐渐开拓海外市场，找到属于自己的位置。</p>\n  <h3><strong>故事四：想成为乔布斯的年轻人</strong></h3>\n  <p>SlashVibe是一台半个手掌大的灰色电脑外接设备，出现在WAIC现场时，它还是一台尚未覆漆的工程样机。王炳翰说，正如iPod之于乔布斯一样，这台SlashVibe只是他打开未来愿景的敲门砖。</p>\n  <p>他站在人群中的姿态带着一种难以言说的热忱，目光在人群中逡巡，捕捉每一个放慢脚步的观众，为他们讲述准备好的完整讲解，把产品的逻辑、团队的思考、未来的想象，一遍遍地说给人听。</p>\n  <p>王炳翰与合伙人罗丹滨的团队叫“自然映射”，产品是一台名为SlashVibe的外接硬件，帮助使用者更高效、有序地调用电脑里的AI Agent。为了站到WAIC的展位上，他们赶了半个月的工，第一次把嵌入式外机和软件部分完整串了起来。团队正调整设计形态，计划在11月投入生产，首批约5000个。设备的最终形态虽为无线连接，但为了现场演示的稳定性，他们还是决定用数据线把硬件与电脑连接起来，展出时，样机的链接线一端，上还贴着白色的临时用于固定的胶带。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_1b4c34bf016940e59e6b6920339d8d11@6381723_oswg130416oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△展会现场的SlashVibe样机</p>\n  <p>去年刚做SlashVibe的时候，很多人无法理解，为什么人们会需要一个新的交互设备来跟AI做输入和输出。投资人反复问他们：这个需求真的存在吗？到了今年4月再融资，同样的问题仍然被提起。王炳翰和团队花了很长时间，去解释“为什么”。</p>\n  <p>转变发生在6月30日。OpenAI发布了一款联名键盘，定位为面���AI开发场景的专用输入设备。等到7月再聊融资，王炳翰发现，问题变了。对方不再问“为什么要做”，而是问“你们要怎么做”。</p>\n  <p>“对大公司来说，证明一个需求的存在只需要说一句话。但对小公司来说，把同一件事讲清楚，要付出的则多的多。”王炳翰说。团队自创立就相信这个需求必然存在，信心的来源不是大公司的动向，而是前期反复做的用户访谈、用户体验测试和深度思考。OpenAI的入场让事情在外界眼中变得确定了，但这份确定不是由他们来完成的。</p>\n  <p>他把这称为“初创团队的无奈”，停了停又说：“但可能也是初创最有趣的地方。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_b26348e6b8c14bf78917d04a868da236@6381723_oswg172979oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△自然映射团队</p>\n  <p>王炳翰面对投资人时，总能感觉大家需要的是一种“非共识的确定性”：既要在共识形成之前入场，又要确定这个需求确实存在。这本身是一个悖论。一个产品在多数人还没看懂的时候投资回报才可能是更大的，但投资人又需要它被证明是“确定会被需要的”。在被证明之前，你不够确定，在被大公司证明之后，你又不是稀缺的了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_ea3dd6ec91624efab680efc2164efe75@6381723_oswg2319194oswg1080oswg2348_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△王炳翰</p>\n  <p>SlashVibe是王炳翰与罗丹滨实现野心的一个起点。他们的愿景，是做AI时代的入口。他把这比作乔布斯创造苹果手机的过程：“在造出来iPhone之前，先造出了iPod。SlashVibe就是我们的iPod，是我们展开愿景的第一步。”</p>\n  <h3><strong>故事五：3%的录取率</strong></h3>\n  <p>H4馆的175个项目中，有22个席位是OPC（一人公司）项目。获批展位入场前，近700个项目经历了八个赛区的“独立先锋挑战赛”，经历数轮比拼，决出了22个入场名额。</p>\n  <p>文浩因拿下武汉赛区的铜牌，以展商的身份进入了WAIC会场。</p>\n  <p>现场，他总是时不时从展位上消失——除了照顾自己的展位，他和很多OPC项目创业者一样，要抽时间去其它摊位串门，看看同行在做什么。对于这些“闯”出来的项目来说，WAIC是一次难得与行业见面、交流想法的机会。由于人手太少，他不得不在守住摊位和出门看看之间来回切换状态。</p>\n  <p>从腾讯离职后，文浩开始探索各种创业的可能性，他目前在做的是安全可信的Agent执行环境，并拿下了足够维持项目生存的订单。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_1a5914f1e377440987ba27e466b77f1f@6381723_oswg130023oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△偶尔空荡的摊位，图源：作者拍摄</p>\n  <p>对于OPC而言，让产品被看到，并不是一件容易的事情。</p>\n  <p>但文浩有自己的办法。WAIC开始前几天，他在自己的平台上做了一个关于WAIC活动汇总的网站，到今天为止，这个网站已经注册了2000多名用户。想要在短时间内快速获得用户，文浩的做法是，添加了50多个WAIC面基群，在群里做起了地推。</p>\n  <p>另一位OPC项目负责人崔永兴，做了个可以在微信对话框记账的小程序，叫“点记账”。为了推广产品，他开始坚持不懈地发小红书。最初这些推广帖子每天只有几十个浏览数，这显然不是他想要的。不过，他很快找到了窍门，切换路线转向了热门帖子的评论区，“帖子火了，连带着我的评论都能上千赞。”</p>\n  <p>靠着这个零成本的方式，两个月的时间里，点记账的累计用户数超过了两万。在付费订阅上，用户想要成为成为会员，30元即可永久买断。和微信高绑定、功能简单、容易触达用户，成了用户选择点记账的原因。</p>\n  <p>自今年5月被裁员后，崔永兴一直在专注做小程序创业。尽管收入暂时只够交房租买零食，但对他而言，这已经是一个相当不错的开始。</p>\n  <p>创业是一趟孤独而不确定的路途，对于OPC创业者来说更是如此。一名OPC创业者曾对《智能涌现》感慨，做OPC创业，再多的困难当前，最不稳定的因素，其实是创业者是否坚持的决心。</p>\n  <p>眼下，崔永兴似乎也步入了这种状况。来WAIC，他希望能在这里想清楚未来的去处，是要All-in点记账，还是再看看其他工作及创业领域。</p>\n  <p><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;封面来源｜作者拍摄</strong></p>\n  <p><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;👇🏻&nbsp; 扫码加入「智涌AI交流群」👇🏻</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_27bf3b5cf81e44229f9088f5b8240e01@6381723_oswg66852oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_2a7a55abaec94b59a8d0547b219b2520@6381723_oswg186227oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_f51ba50f8aa749999ab8723595194a98@6381723_oswg232414oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_4b57718f103943debb8aa7b2b9dd2dc6@6381723_oswg225397oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-07-20T03:02:32+00:00", "fetched_at": "2026-07-20T03:23:39.051552+00:00", "fingerprint": "7c6c09b12c3282b6"}, {"source": "少数派", "title": "TDS REVIEW | 索尼 WH-1000XX 无线降噪头戴耳机体验", "url": "https://sspai.com/post/112374", "summary": "这篇文章是TDSStudio在少数派上的第26篇文章，依然是全平台首发。1000XTheColleXion，这是索尼1000X系列的十周年纪念产品线。完全想不到跟群友们畅聊MDR-1000X的时代已经 ...<a href=\"https://sspai.com/post/112374\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-19T03:00:00+00:00", "fetched_at": "2026-07-20T03:23:37.424319+00:00", "fingerprint": "aa0f548c30d26d82"}, {"source": "少数派", "title": "派早报：锂电池消费税分阶段恢复征收", "url": "https://sspai.com/post/112498", "summary": "<p>锂电池消费税分阶段恢复征收</p><p>白宫提词器操作员利用内幕信息下注被查</p><p>LG 显示器连接电脑后自动安装广告程序</p><p>新一代豆包手机不再模拟点击操作</p><p>亚马逊错发数亿美元云服务账单</p><p>京沪线试点 12306 预约购票，最早提前 60 天</p><p>看看就行的小道消息</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/112498\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-19T23:11:33+00:00", "fetched_at": "2026-07-20T03:23:37.424309+00:00", "fingerprint": "6fb38d4157315539"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
