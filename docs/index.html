addresses, and office locations of more than 41,000 employees, including those in US Immigration and Customs Enforcement (ICE) and Customs and Border Protection (CBP), according to TechCrunch and Wired. The [&#8230;]", "category": "tech", "published_at": "2026-10-28T21:57:45+00:00", "fetched_at": "2026-10-29T04:05:00.233579+00:00", "fingerprint": "b6ad05727112179f"}, {"source": "The Verge", "title": "Adam Mosseri says negativity around AI is ‘going to get worse’", "url": "https://www.theverge.com/ai-artificial-intelligence/1021644/adam-mosseri-instagram-ai-negativity", "summary": "Asked about AI and the trend of college students booing tech CEOs at graduation ceremonies, Instagram head Adam Mosseri acknowledged in an interview that a lot of people really don't like AI, and it's not just young people and creatives. Appearing on the Colin and Samir podcast to talk about the launch of widescreen and [&#8230;]", "category": "tech", "published_at": "2026-10-28T23:05:39+00:00", "fetched_at": "2026-10-29T04:05:00.233573+00:00", "fingerprint": "3b64f2126ca310fc"}, {"source": "The Verge", "title": "Anduril now says its BlueChip laptop will meet Buy American standards at launch", "url": "https://www.theverge.com/policy/1021554/anduril-bluechip-65-percent-domestic-buy-american", "summary": "On Tuesday, defense contractor Anduril and chipmaker Qualcomm announced a partnership to build laptops entirely in the United States, starting with a single model in 2027. They also announced a \"long-term goal\" of pushing the computer industry to create \"a fully domestic supply chain.\" Even a single Made-in-USA laptop would be a surprise, because no [&#8230;]", "category": "tech", "published_at": "2026-10-29T02:22:46+00:00", "fetched_at": "2026-10-29T04:05:00.233562+00:00", "fingerprint": "cfd5e9071be8aa35"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨服务长征、蓝箭、C919，这家特种运输车企业完成数千万元融资", "url": "https://36kr.com/p/4045129016382339?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2100字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，扬州伏尔坎机械制造有限公司（以下简称“伏尔坎”）近日完成数千万元融资，由投控东海（深投控）投资。</p>\n  <p>伏尔坎成立于2016年，是一家专注于多功能特种运输车辆研发与制造的企业，产品主要面向航空航天、军工、大型工程设备、化工罐体、精密仪器及风电设备等超限大件运输场景。公司同时布局日本市场，是国内唯一可实现特种运输车辆整车出口日本的企业。</p>\n  <p>火箭、飞机、风电叶片、光刻机，这些装备的运输看似属于物流环节，却对车辆的承载能力、振动控制、姿态稳定性和空间适应能力提出了极高要求。</p>\n  <p>伏尔坎总经理朱其安向硬氪介绍，公司主要围绕“五超”货物，即超高、超长、超宽、超重货物以及超精密仪器，提供定制化运输解决方案。与标准化商用车辆不同，这类产品通常需要从运输方案设计、底盘结构、液压系统到专用部件进行针对性开发，研发与生产环节都具有较高的定制化程度。</p>\n  <p>在超低与超重运输方面，伏尔坎的超低平板车货台最低可降至离地1厘米，以适应限高路段的通行要求；多功能组合运输车的承载能力最高可达800吨。针对更大吨位的重型装备，公司还布局了自行走模块化运输装备（SPMT），相关产品承载能力覆盖120吨至1000吨，可在不依赖牵引车的情况下自主行驶，并支持原地转向、远程遥控和智能故障检测。</p>\n  <p>超精密仪器运输则更考验车辆的减震与制动能力。以光刻机运输车为例，伏尔坎采用气囊减震设计及ECAS电控空气悬架系统，以降低路面不平带来的振动和冲击。此外，公司还通过多轴液压结构、电气控制和液压控制系统，实现车轴升降、平台自动调平等功能，配合随动转向、遥控主动转向等技术，提升车辆在复杂道路和狭窄空间内的通行能力。部分车型的车轮最大转向角度可达54度。</p>\n  <p>目前，伏尔坎的国内客户主要集中在航空航天领域。2024年，伏尔坎承担海南文昌发射中心长征八号火箭地面保障任务，实现国内首次火箭垂直公路运输。针对火箭直立运输的特殊要求，公司开发了配备液压调平系统、车架多点支承切换机构及安全报警系统的专用车辆，以改善轮轴负荷分配和整车稳定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_16d183ef6f1f4336adc9a34fc2dc6f4e@5920579_oswg1505813oswg1080oswg787_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>2025年，公司承担航天一院载人登月航天器箭体运输地面保障任务，并为蓝箭航天朱雀三号火箭提供长途运输车辆。后者针对直径达4.5米的箭体进行设计，已完成4000公里高速公路测试。车辆采用空气悬架系统降低路面振动，并通过模块化设计和多轴联动转向结构，适应不同箭体的运输需求。据介绍，该车型能够在满足相关通行条件的情况下，通过限高5米的路段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_b425b6b4ce574adca7c726cb53844791@5920579_oswg791774oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>航空领域，2025年，公司中标C919机翼及C909飞机运输项目。针对飞机机身转场，车辆采用凹形货台与可伸缩副车架结构，以适应不同运输状态下的车身宽度需求；货台配备升降机构，最低可降至接触地面，便于飞机部件装卸。同时，车辆通过牵引销上方的减震气囊吸收牵引车传递的振动，并设置防护结构，降低运输过程中外部飞溅物对机身的影响，目前正与欧洲空客公司共同研发飞机机翼运输设备。</p>\n  <p>相比国内市场，日本市场是伏尔坎另一块重要业务来源。据朱其安介绍，日本市场目前约占公司业务的50%左右，日本相关车辆年需求量约为500台左右。</p>\n  <p>朱其安表示，日本在超高、超宽、超长、超重货物的运输环节有较严格的运输管理，普通车辆难以满足相关要求，专业特种运输车辆因此形成较为稳定的需求，工程机械，精密仪器和风力设备是当地特种运输车辆的重要应用场景。</p>\n  <p>此外，公司同时承担全球其他市场的散单销售，包括东南亚、南美、欧洲及中东地区。</p>\n  <p><strong>以下为硬氪与朱其安交流节选：</strong></p>\n  <p><strong>硬氪：特种运输车辆的技术要求与普通运输车辆有很大差异，公司如何根据不同货物的特点进行定制化设计？</strong></p>\n  <p><strong>朱其安：</strong>我们的产品主要面向“五超”货物。不同货物的运输要求差异���大，比如光刻机内部有大量精密元器件，对运输过程中的振动和冲击非常敏感；火箭采用直立式运输时，则需要重点控制车辆的振幅、平衡和整体稳定性，避免运输过程中出现过大晃动。</p>\n  <p>因此，我们需要根据货物的尺寸、重量、结构和运输姿态，对车辆的承载能力、减震系统、液压结构、转向和自动调平功能进行针对性设计。超重运输重点解决承载、升降和转向问题，精密仪器运输则更关注减震和制动缓冲。我们提供的不只是车辆，还包括从运输方案构思、结构设计到专用部件定制和整车生产的一整套解决方案。</p>\n  <p><strong>硬氪：您认为特种运输车辆行业的核心竞争壁垒是什么？</strong></p>\n  <p><strong>朱其安：</strong>我认为主要有几个方面。</p>\n  <p>第一是客户积累和市场判断能力。这个行业的订单存在不确定性，如果不能持续深耕市场，没有稳定的客户资源和长期的行业积累，就很难判断未来的订单需求。</p>\n  <p>第二是定制化研发与工程能力。即使是同一个客户，每次需要运输的货物也可能不同，企业需要从方案设计、零部件定制到整车生产，具备完整的工程实施能力。这要求技术团队拥有足够的行业经验，能够根据货物特点主动提出解决方案。</p>\n  <p>第三是功能技术和专利积累。由于车辆变形程度高，车辆的升降、转向、自动调平、车身拓宽和延长等功能，都涉及具体的机械结构与控制技术，需要通过长期研发积累形成技术壁垒。</p>\n  <p>第四是成本控制和生产资质。专用车辆涉及大量非标零部件，生产损耗和项目成本与标准化产品存在明显差异。企业需要了解不同项目的成本构成和盈利边界，才能在承接订单时做好成本测算。同时，生产企业还需要具备相应的专用车生产准入资质。这些条件共同构成了行业的进入门槛。</p>", "category": "tech", "published_at": "2026-10-28T05:58:42+00:00", "fetched_at": "2026-10-29T04:05:00.167737+00:00", "fingerprint": "5936938f92794e52"}, {"source": "36氪 - 最新文章", "title": "在25万人的纽约漫展，一家中国公司排起了长队", "url": "https://36kr.com/p/4045364265358471?f=rss", "summary": "<p>在刚刚过去的10月21日至23日，第二十四届上海玩具展如期举行。</p>\n  <p>23万平方米的展馆里，2700多家展商、5400多个品牌一字排开，拖着样品箱的海外买家超过1万人。</p>\n  <p>而在本次玩具展上，还出现了一位专程赶来的苏格兰小马宝莉粉丝——他几乎集齐了所有小马宝莉卡牌，正计划申请吉尼斯世界纪录。这样的场景，放在十年前很难想象。中国卡牌，也正在出现在越来越多海外展会的展台与货架上。</p>\n  <p>上海玩具展如此热闹。那么几乎同期，在大洋彼岸、全球流行文化的腹地——刚刚落幕的纽约漫展，又是怎样的景象？</p>\n  <h2><strong>在美国漫展排起长队</strong></h2>\n  <p>10月8日至11日，曼哈顿已经转凉，但因纽约动漫展（NYCC），Javits中心是另一重热度。</p>\n  <p>今年恰逢NYCC二十周年，主办方把主题定成了纽约人自己的游乐场——康尼岛（Coney Island）。周五到周日的门票提前售罄，四天里，约25万人涌入这座玻璃展馆，打扮成各式角色的观众，成了曼哈顿西区街头最显眼的风景。</p>\n  <p>二十年前，也就是2006年，第一届NYCC的观众只有3万人。二十年，翻了八倍。但增长的不只是人数。今年嘉宾的出席阵容堪称豪华：尼古拉斯·凯奇、海登·克里斯滕森等影星登台，《火影忍者》的声优竹内顺子与杉山纪彰现身周六的活动，《龙珠超》新作选择在这里举行全球首映。</p>\n  <p>怎么解释这种热度？主办方ReedPop的市场总监Fallon Prinzivalli给了一个很“反互联网”的答案：“在这个数字时代，我们反而要面对面聚在一起——线上刷得再多，也比不上现场的能量。”</p>\n  <p>不过，走进展馆才会发现另一层变化。在超级英雄与绝地武士的展台之间，亚洲IP、卡牌与收藏玩具的浓度，正肉眼可见地变高。过去，这里是好莱坞与美漫的绝对主场。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_4929d97ab267457b85b1afddb57b4e74@1267484143_oswg1462434oswg1034oswg790_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这背后是一个更大的产业事实：2024年，中国已经超过美国和日本，成为全球最大的集换式卡牌市场。某种意义上，中美两大市场，在NYCC的展馆里正面相遇。</p>\n  <p>而相遇最具体的发生地，是1143号展位。这个展位前的队伍，排得不比任何一家好莱坞展台短。但队伍里的人等的不是明星，也不是签名——他们在等一场“教学”，教他们的，是一家中国公司卡游（KAYOU）。</p>\n  <p>在后期的上海玩具展，那位专程赶来的苏格兰粉丝想要集齐的，也正是卡游出品的小马宝莉卡牌。至此，从纽约到上海，卡游的展位前集齐了来自全球各地的同一类人群——他们对某一IP充满热爱，并愿意为一张卡片倾注时间与精力。</p>\n  <h2><strong>粉丝也是参与者，卡牌的生态变了</strong></h2>\n  <p>那么，又应该如何理解卡游这家公司？</p>\n  <p>卡游是中国集换式卡牌行业的头部企业。<strong>招股书显示，2024年，卡游的营收100.57亿元，经调整净利润44.66亿元，国内集换式卡牌市占率71.1%。</strong></p>\n  <p>而本年度，是卡游第二次参加NYCC。如果说2025年首登纽约时，它的任务是“被认识”，2026年再来，展位的动作变了：不再只是展示，而是“教美国粉丝怎么玩”。</p>\n  <p>据介绍，卡游在现场开设了TCG教学，粉丝可以在展位上直接学玩《小马宝莉》集换式卡牌。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_6bb835132d624a89be504cf02e643b67@1267484143_oswg1304010oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>漫展首日，卡游抢先预览了2027年《小马宝莉》第六辑“月亮版”、明年1月发售的“闪耀版”，以及明年面世的迷你卡；同日举办的粉丝文化论坛上，孩之宝全球消费者营销高级经理Claire O'Sullivan、《小马宝莉》官方插画师Andy Price 与卡游团队同台。</p>\n  <p>值得关注的是，论坛上落地的粉丝共创活动“Chase the Magic”，这算是这届NYCC最有人情味的一幕之一——卡游通过抽奖，邀请一位粉丝设计一匹属于自己的小马。中奖者David Abdelmaseih与女儿共同设计的“Banannie Bloom”，被官方采纳，成为真正的卡牌角色。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_d4cffa581fd1471ebb103eb6e558160f@1267484143_oswg95267oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>Abdelmaseih夫妇从十几岁就开始集卡，如今用卡牌带女儿入坑。</p>\n  <p>“这匹小马是我们全家一起设计的。它是一匹陆马，因为我们想告诉小朋友：看见这个世界的美好，不需要魔法——因为世界本身已经足够美。”他说，孩子们最喜欢的，就是“爸爸妈妈当年有，现在我们也有”的东西。“从今往后，她们一生都会拥有一匹属于自己的小马。”</p>\n  <p><strong>对卡游而言，Chase the Magic不是一次抽奖营销，而是“面向核心粉丝做体验式运营”的样本，也是其“收藏策略”的关键一环：粉丝在这里不只是消费者，而是参与者，甚至是产品的共同作者。</strong></p>\n  <p>今年10月的上海玩具展上，卡游相关负责人曾系统阐述过这套策略：依托制造工艺与设计整合能力，提升单卡的收藏价值；以“Collect到Co-create”的生活方式链路扩展消费场景，从收藏起步，逐步走向用户参与的内容共创，产品边界则从传统卡牌延展到日常生活场景。</p>\n  <p>说得直白些：卡牌只是入口，不是终点。一<strong>张几块钱的卡，把消费者带进第一层——Collect，一个低门槛的收藏入口。</strong></p>\n  <p>第二层是“让收藏有地方去”，这也是“生态”二字真正的体现。</p>\n  <p>卡牌买回家，如果只是塞进抽屉，就是一次性买卖。所以卡游把链路往后接，推出了可穿戴卡牌配件、穿戴饰品、展示类卡牌衍生品、迷你卡等产品形态，让卡牌被戴在身上、摆在桌上，融入粉丝的日常穿搭。</p>\n  <p>再以《KPop猎魔女团》为例，卡游用迷你收藏卡、可穿戴卡牌配件和穿戴饰品，把卡牌从“收藏品”做成了“可展示的潮流配饰”。粉丝可以把喜欢的角色卡挂在包上、配进穿搭，卡牌随之变成一种可以在社交平台上分享的粉丝身份表达。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_f8c2701fed634e73a48d3b4c4d6938b9@1267484143_oswg102964oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>上海玩具展上，卡游相关负责人同样表示，公司正从传统卡牌延展至穿戴类饰品、展示类卡牌衍生品等创新品类，让卡牌的收藏属性与佩戴、观赏、日常使用等场景相融合。从粉丝的角度，<strong>收藏品的一半价值在于“被看见”，而卡游把“被看见”做成了产品。</strong></p>\n  <p>第三层是Co-create。Chase the Magic式的官方共创，加上社区里的交换、晒卡与二次创作，把单向的买卖关系，变成持续互动的关系。这条“Collect到Co-create”的链路一旦跑通，复购和社区黏性，就不再是问题。</p>\n  <h2><strong>闯美一年，愿景变现实</strong></h2>\n  <p>实际上，卡游在美国市场的存在感，绝不仅限于漫展上的排队人潮。</p>\n  <p>一个月前的2026洛杉矶玩具展，卡游在the Toy Building设立展厅，接待北美的经销商、零售商与授权方；展后的一场邀约制行业聚会，则把商业沟通变成了高质量的行业交流与市场验证场景。</p>\n  <p>产品层面，2026年5月，《小马宝莉》TCG已在北美全面发售；品类则从卡牌延展至穿戴类饰品、展示类卡牌衍生品、文具和立体玩具。</p>\n  <p>更硬的认证来自第三方：专业数据统计机构Circana的数据报告，卡游在美国市场的销售体量已入围美国玩具市场前50。<strong>从2025年9月正式宣布进入美国市场算起，这一切发生在一年之内。</strong></p>\n  <p>当然，美国市场本身并不缺少强敌——宝可梦、万智牌在这里经营了数十年。手握弹药的同时，卡游也在布局未来。</p>\n  <p>据介绍，卡游的国内授权IP有100多个，海外授权IP为十几个。2026年，海外独占授权的《魔鬼大卡车》（Monster Jam）与《魔法俏佳人》带来新的增长预期；进入2027年，《无敌少侠》《刺猬索尼克》《JOJO的奇妙冒险》《魔法少女小圆》将陆续加入——这些IP分别触达游戏玩家、超级英雄受众、动漫社群与成人藏家。</p>\n  <p>渠道的铺设也很“美式”，这一年来，卡游先后进入沃尔玛、亚马逊、Target、GameStop、Barnes &amp; Noble等主流零售终端。线上渠道，则通过TikTok Shop和直播电商品牌Crossing触达用户。</p>\n  <p>这正是卡游出海路径的核心：不是把中国的内容卖到海外，而是拿着中国打磨成熟的产业链与玩法，去运营全世界的IP，再把这套收藏生活方式卖回给全世界。</p>\n  <p>更关键的是，卡游在“IP创造”上也在落子。上海玩具展上，其自有艺术家品牌 OYYO旗下三款原创IP同场展出：甜酷双子星Hari &amp; Hacci已延展至毛绒、盲盒、配饰，森林小毛怪Weirdolls与治愈系小女孩Otti也将以多种产品形式推向全球市场。从“IP引进”到“IP创造”，卡游不想只做授权IP的运营者。</p>\n  <p>聚焦美国市场，卡游接下来的动作可以归纳为四件事：</p>\n  <p>一是IP拓展，2027年新IP陆续落地，《小马宝莉》第六辑与迷你卡上市；</p>\n  <p>二是渠道深耕，在已进入的主流零售基础上继续加密，TCG赛事与线下活动走向体系化；</p>\n  <p>三是品类扩张，重点发力穿戴类与展示类卡牌衍生品；</p>\n  <p>四是形态结合创新，让卡牌与穿戴、展示、文具、立体玩具等品类互相嵌合，不断扩展收藏生态的边界。洛杉矶玩具展式的“展厅＋邀约制行业聚会”，也将成为固定的行业沟通场景。</p>\n  <p>最后把卡游放进中国玩具出海的坐标系，它的独到之处会更加清楚。</p>\n  <p>乐高式的出海是“因地制宜”——为每个市场匹配本土IP故事，用IP给产品加价；泡泡玛特式的出海是“渠道先行、爆款外溢”——把国内验证过的爆款铺向全球门店。</p>\n  <p><strong>卡游走出了第三条路：它不只是把货铺出去，而是用中国的产业链和收藏体系设计能力，运营全世界的IP，再用“Collect到Co-create”的收藏生态，把粉丝从买家变成参与者。</strong></p>\n  <p>一直以来，卡游的愿景都是“把全球粉丝的热爱，转化为可收藏、可展示、可穿戴、可社交、可共创的生活方式”。闯美一年，也依托卡游原创性的出海逻辑与收藏生态战略，这个愿景正在变成现实。</p>\n  <p>消费者会怎么选择？纽约漫展的排队人群已经给出了答案。</p>\n  <h4>*免责声明：</h4>\n  <h4>本文内容仅代表作者看法。&nbsp;</h4>\n  <h4>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</h4>", "category": "tech", "published_at": "2026-10-28T09:59:42+00:00", "fetched_at": "2026-10-29T04:05:00.167730+00:00", "fingerprint": "20fd908b22803d59"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨姆巴佩中国代言收入近2200万欧元；长鑫科技已被纳入上证指数；宇树科技：前三季度净利润3.87亿元，同比增长270.54%", "url": "https://36kr.com/p/4046203581289345?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>特朗普将“正式禁用”AI一词</p>\n  <p>泡泡玛特回应业绩大跌，管理层称高基数叠加“炒娃降温”</p>\n  <p>iPhone Duo首次支持Apple Pencil，仅限USB-C款且需有线配对</p>\n  <p>海力士DRAM到2029年产能已售罄</p>\n  <p>小鹏机器人固态电池小批量量产</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>姆巴佩中国代言收入近2200万欧元，占商业总收入38%</strong></p>\n  <p>姆巴佩涉华不当言论事件爆发后，中国市场在不到24小时内完成品牌解约、平台清退的全链条动作，这一过程不仅在国内引发强烈反响，也迅速进入全球主流媒体的报道视野，不同定位的国际媒体从商业、体育伦理、公众人物责任等多个维度展开讨论，让这起事件成为全球体育商业领域极具标志性的反面案例。</p>\n  <p>英国《金融时报》第一时间将这起事件定性为“顶级体育明星触碰区域市场红线的典型失误”。报道中专门算了一笔账：姆巴佩此前在中国市场的年度代言收入接近2200万欧元，占他个人全球商业总收入的38%，这次多家头部品牌集体解约，直接让他损失了近四成的稳定商业收入，且后续几乎没有任何挽回的可能。(光明日报)</p>\n  <p><strong>长鑫科技已被纳入上证指数</strong></p>\n  <p>根据中证指数公司网站，长鑫科技已被纳入上证综合指数，权重为4.67%，当前为指数第一大权重股。农业银行、工商银行位于第二、三位，权重占比为3.83%和3.77%。长鑫科技也被纳入上证科创板综合指数，权重为15.74%，也为第一大权重股。根据编制方案，权重因子于每月第二个星期五的下一交易日或新计入样本权重超过15%时调整。（第一财经）</p>\n  <p><strong>宇树科技：前三季度净利润3.87亿元，同比增长270.54%</strong></p>\n  <p>36氪获悉，宇树科技交出上市后首份业绩报告。2026年第三季度营业收入6.65亿元，同比增长69.93%；归母净利润1.13亿元，同比下降17.37%。2026年前三季度营业收入18.17亿元，同比增长55.71%；归母净利润3.87亿元，同比增长270.54%；研发费用同比增长191.48%，主要来自模型研发和算力投入的大幅增长。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>特朗普将“正式禁用”AI一词</strong></p>\n  <p>美国总统特朗普27日在社交媒体“真实社交”发文，表示将很快在“所有相关文件”及其他场合“正式禁止”使用“人工智能（AI）”一词，理由是这一表述“不准确”。不过，帖文中没有具体说明禁令将如何落实。他在帖子中还点名批评美国《华尔街日报》，称后者仍在使用“非常糟糕和不准确”的“人工智能”称谓。</p>\n  <p>特朗普9月29日签署行政令，将“人工智能”改称为“超级智能”。10月4日，他在社交媒体宣布组建“超级智能工作组”，任命包括国家情报总监杰伊·克莱顿在内的领导团队。特朗普表示，该工作组的使命是协调联邦政府的各项工作，“确保美国在超级智能领域继续保持全球领先地位”。（第一财经）</p>\n  <p><strong>豆包工作电脑操作能力升级：Mac锁屏后可继续执行任务</strong></p>\n  <p>10月28日，记者从豆包方面获悉，近期，豆包工作电脑操作能力升级，屏幕点击精度、速度提升，更准、更快。用户在对话中直接提出操作电脑的相关需求，经授权后，豆包工作可自动查看电脑屏幕，模拟人工鼠标和键盘操作相关应用。</p>\n  <p>在任务执行方面，用户可进入“设置→工作任务模式设置”，开启“允许豆包在锁屏时工作”。启动该功能并经过用户授权后，豆包工作可在Mac锁屏时继续执行需要操作的电脑任务。用户离开电脑时，还可以通过手机向这台锁屏的Mac下达任务，并在手机上查看返回结果。使用时，Mac需保持开机、联网，豆包客户端持续运行，设备保持唤醒。(上海证券报)</p>\n  <p><strong>智元GO-3 Nano Preview登顶RoboTwin，平均成功率85.01%</strong></p>\n  <p>36氪获悉，近日，RoboTwin公布的最新榜单显示，智元GO-3 Nano Preview以85.01%的平均成功率位列第一。公开资料显示，RoboTwin主要考察复杂场景下的双臂协同操作与环境泛化能力，通过不同场景和任务设置，评测模型在目标识别、动作协调及环境变化适应等方面的表现。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>泡泡玛特回应业绩大跌，管理层称高基数叠加“炒娃降温”</strong></p>\n  <p>针对第三季度业绩大幅下滑，泡泡玛特在业绩电话会上进行了详细回应。首席运营官司德将业绩下滑归因于2025年同期异常的高基数与二手市场“炒娃”热度的回落。他指出，去年三季度是公司历史上单季销售最高的季度，业务集中爆发导致今年同比压力巨大，且去年三季度线上渠道因抢购和炒货热度极高，基数异常偏高；今年二级市场炒娃热度明显回落，这是线上渠道下滑幅度更大的最主要原因。</p>\n  <p>面对业绩压力，公司明确了“保品牌、不打价格战”的应对基调。司德在电话会上明确表示，公司不会用大额满减或打折去拉动线上销量，线上重心将回归正常零售，弱化炒货属性；目前公司库存水位已自8月开始回落，9月底已呈明显下降趋势，管理层强调“暂时不会做大规模的促销活动”。(界面新闻、每日经济新闻)</p>\n  <p><strong>OpenAI据悉计划采购谷歌AI芯片，进一步降低对英伟达的依赖</strong></p>\n  <p>10月27日，OpenAI据悉正计划采购谷歌自主研发的人工智能芯片，以扩大算力规模并实现芯片供应来源多元化。此次潜在交易涉及谷歌张量处理单元（TPU），但双方尚未确定最终协议条款。随着AI模型训练和推理需求持续增长，OpenAI正在寻求英伟达GPU之外的算力来源，同时与博通合作开发代号为“Jalapeno”的自研AI芯片，进一步完善其算力供应体系。（新浪财经）</p>\n  <p><strong>iPhone Duo首次支持Apple Pencil，仅限USB-C款且需有线配对</strong></p>\n  <p>根据苹果官方说明，iPhone Duo首次支持Apple Pencil，但目前仅支持Apple Pencil（USB-C），首次配对还需要通过USB-C线缆连接。相比iPad上更加成熟的手写笔体验，iPhone Duo的支持范围明显有限。考虑到它拥有7.6英寸内屏，手写批注和绘画确实有一定使用空间，但目前的配对方式多少有些不够方便。（财联社）</p>\n  <p><strong>韩国KOSPI指数收涨6.63%，SK海力士涨近11%</strong></p>\n  <p>10月28日，日经225指数收涨1.08%，报63954.19点；韩国KOSPI指数收涨6.63%，报6012.44点。其中，SK海力士涨近11%，三星电子涨超9%。(财联社)</p>\n  <p><strong>豆包否认“横店与字节合作将15万群演肖像声音喂给大模型”</strong></p>\n  <p>10月28日，豆包公关负责人刘星发文称，“横店与字节合作，将15万名群演的肖像和声音喂给字节大模型”的传言严重失实。刘星表示，横店影视AI服务平台项目，其实是希望建设一套公共数字基础设施，把影视基地实景等资产做成高质量数据集，帮助剧组更高效地选景、筹备和拍摄，也降低中小影视企业使用AI的门槛，让更多创作者有条件把作品做好。火山引擎在该项目中是技术支持方，所有数据资产，都归横店或授权方所有。这个项目涉及到任何人的肖像和声音使用，肯定都需要获得本人的授权。本项目的数据也不会用于训练字节大模型。(财联社)</p>\n  <p><strong>知名“牛散”章建平夫妇重仓二股，三季度新进东材科技与方正科技</strong></p>\n  <p>随着三季报披露，知名“牛散”章建平及其妻子方文艳的最新持仓动向浮出水面。与半年报相比，章建平新进成为东材科技（601208.SH）第三大股东，持股2974.73万股，占总股本2.94%；方文艳新进成为方正科技（600601.SH）第七大股东，持股4069.94万股，占总股本0.92%。</p>\n  <p>据不完全统计，除上述两只新进标的外，章建平三季度还增仓了云南锗业，方文艳则同时新进了华正新材（持股4.96%）和科翔股份（持股1.63%）。夫妇二人的调仓路径，整体指向了AI算力硬件上游的电子材料与PCB环节。(财联社、每日经济新闻)</p>\n  <p><strong>科创板首只市值股退市</strong></p>\n  <p>*ST卓然(688121.SH)公告称，公司于2026年10月28日收到上交所下发的《终止上市事先告知书》。因公司股票已连续20个交易日每日收盘市值均低于3亿元，触及终止上市情形，上交所将按规定对公司股票作出终止上市决定。公司可在收到通知后5个交易日内申请听证。</p>\n  <p>*ST卓然将成为科创板首只市值退市股，截至28日收盘，*ST卓然股价为0.40元，总市值9345万元，已不足1亿元。(财联社)</p>\n  <p><strong>IDC：2029年60%的企业多数业务流程将AI优先，2026年仅为13%</strong></p>\n  <p>36氪获悉，国际数据公司（IDC Research, Inc.，简称IDC）预测，到2029年，60%的全球2000强（G2000）企业将让多数业务流程以AI优先的方式运行。IDC同时预测，到2028年，70%的全球2000强企业（G2000）将具备持续验证AI智能体决策的能力，而目前这一比例仅为14%。</p>\n  <p><strong>小鹏机器人固态电池小批量量产</strong></p>\n  <p>小鹏集团副总裁顾捷表示，小鹏IRON机器人固态电池已小批量量产下线，机器人目前处于SOP前的阶段。在2025年小鹏科技日上，官方宣布全新一代人形机器人IRON将在行业内首次应用全固态电池。该公司计划于2026年底实现高阶人形机器人的规模化量产，并预计从2027年起陆续进驻全球小鹏门店及商业场景，承担导购、讲解等服务。（第一财经）</p>\n  <p><strong>美联储宣布维持利率不变</strong></p>\n  <p>美国联邦储备委员会28日结束为期两天的货币政策会议，宣布将联邦基金利率目标区间维持在3.75%至4%不变。这一决定符合市场此前广泛预期。（央视新闻）</p>\n  <p><strong>主力资金监控：宁德时代净卖出超9亿</strong></p>\n  <p>盯盘数据显示，10月28日主力资金净流入电子、通信、半导体等板块，净流出电新行业、非银金融、有色金属等板块，其中电子板块净流入117.16亿元。个股方面，中际旭创资金净买入22.91亿元位居首位，兆易创新、新易盛、工业富联主力资金净流入居前；宁德时代遭净卖出9.71亿元位居首位，五粮液、西安奕材-U、源杰科技主力资金净流出额居前。(财联社)</p>\n  <p><strong>Anthropic拟向散户分配最多20%的IPO股份，摩根大通负责美国市场认购</strong></p>\n  <p>人工智能公司Anthropic正考虑将首次公开募股（IPO）发行股份的15%至20%分配给个人投资者，并已选定摩根大通负责美国市场的散户认购业务。按照此前投资者提出的估值预期，Anthropic上市估值可能达到1.4万亿至1.5万亿美元，最高甚至达到1.75万亿美元，有望成为全球规模最大的科技企业IPO之一。（新浪财经）</p>\n  <p><strong>韩国因强制应用内支付对谷歌、苹果合计罚款637亿韩元</strong></p>\n  <p>据报道，韩国媒体与通信委员会（KMCC）发表声明称，韩国监管机构因谷歌和苹果涉嫌强制应用内支付，对其合计处以637亿韩元罚款。其中，谷歌被罚429亿韩元；苹果被罚208.1亿韩元。监管机构认定，这两家运营商实施了《电信业务法》所禁止的行为，并决定发出纠正令，要求其修改业务程序。（界面新闻）</p>\n  <p><strong>A股震荡反弹超4100股上涨，物理AI与存储芯片全线爆发</strong></p>\n  <p>10月28日，A股三大指数震荡反弹，创业板指表现强势，盘中一度涨超3%。截至收盘，沪指涨0.71%，深成指涨2.15%，创业板指涨3.12%，全市场超4100只个股上涨。沪深两市成交额达1.98万亿元，较上一个交易日显著放量。</p>\n  <p>盘面上，科技成长主线全线反攻。物理AI与机器人概念掀涨停潮，福莱新材8天5板创历史新高，安培龙、伟创电气等多股20CM涨停；存储芯片方向受隔夜SK海力士业绩超预期及美股存储股大涨催化，长鑫科技、兆易创新、佰维存储等集体走强；算力硬件与CPO概念同步回暖，中际旭创、新易盛涨幅居前。此外，创新药板块午后异动拉升，常山药业、博瑞医药领涨。(证券时报、财联社)</p>\n  <p><strong>宝马正在推进星闪数字钥匙方案，预计于2030年上车</strong></p>\n  <p>记者从知情人士处获悉，宝马正在推进星闪数字钥匙方案，意向由意法半导体、恩智浦供应兼具蓝牙、星闪的多模芯片，用于车辆无感解锁，并计划2030年上车。(蓝鲸新闻)</p>\n  <p><strong>海力士DRAM到2029年产能已售罄</strong></p>\n  <p>近日，SK海力士表示，DRAM和HBM到2029年的产能已全部售罄。</p>\n  <p>SK海力士总裁兼CEO郭鲁正在财报会上透露，截至目前，SK海力士已经和包含全球头部云服务商在内的14家核心客户签署长期协议（LTA）。已经敲定的LTA订单，叠加当前和客户正在磋商的需求，“未来三年直至2029年，我们的DRAM以及HBM产能实际上已经近乎售罄。”公司判断，内存供需紧张格局或将延续至2030年，同时公司也将采用弹性投资节奏防范周期风险。(财联社)</p>\n  <p><strong>恒生指数公司表示将Anthropic纳入恒生港美科技指数</strong></p>\n  <p>36氪获悉，恒生指数公司公告，恒生港美科技指数的编算方法调整，将于截至2026年9月30日之指数检讨中采用，相关的成份股变动将于2026年12月14日（星期一）生效。指数名称及指数代码将维持不变。此外，Anthropic(ANT.O)将加入指定美国上市成份股名单。此变更将以Anthropic确认上市作实。9只美国上市成份股的比重将于Anthropic的第7个交易日收市后重新计算至等权重，新增成份股和更新后的成份股比重将于Anthropic的第11个交易日生效。</p>\n  <p><strong>泡泡玛特遭南向资金净卖出6.55亿港元</strong></p>\n  <p>南向资金净卖出8.04亿港元，泡泡玛特、长飞光纤光缆、建滔积层板分别遭净卖出6.55亿港元、2.88亿港元、1.45亿港元。净买入方面，智谱、中芯国际、中国海洋石油净买入额位列前三，分别获净买入5.55亿港元、5.33亿港元、4.87亿港元。（第一财经）</p>\n  <p><strong>美国司法部就英伟达收购Hugging Face展开问询</strong></p>\n  <p>美国司法部已就英伟达收购开源平台Hugging Face的交易将如何影响人工智能领域的竞争展开问询，与此同时，反垄断执法部门仍在推进对这家芯片设计公司行为的多年调查。司法部近期的问询涉及英伟达的收购、投资和销售行为，以及该公司是否曾向客户施压。对于Hugging Face交易，司法部官员询问，这笔收购是否会让英伟达掌控AI领域一个基础性的分发渠道。（新浪财经）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，10月28日收盘，美股三大指数集体上涨，纳指涨0.27%，道指涨0.19%，标普500指数涨0.28%。大型科技股涨跌不一，SK海力士涨超13%，甲骨文涨超10%，闪迪涨超7%，英特尔、谷歌涨超1%，亚马逊小幅上涨；Meta、英伟达跌超1%，苹果、奈飞、特斯拉、微软小幅下跌。热门中概股多数下跌，新东方跌超12%，腾讯音乐、哔哩哔哩、知乎、网易、名创优品、老虎证券、拼多多跌超1%；百度、理想汽车涨超1%。</p>\n  <p><strong>美国商品期货交易委员会拟将交易商持仓报告发布频率提高至每周两次</strong></p>\n  <p>当地时间10月27日，美国商品期货交易委员会（CFTC）主席迈克尔·塞利格宣布，计划于2026年底前将交易商持仓报告（COT）发布频率从每周一次提高至每周两次。根据新安排，周一数据将于周三发布，周三数据将于周五发布，发布时间均为美国东部时间下午3时30分。此举将报告数据的发布滞后时间从3天缩短至2天，以便市场参与者更及时地了解农业市场交易头寸及活动情况。委员会正通过系统现代化和自动化推进相关工作。（界面新闻）</p>\n  <p><strong>韩国监管部门调查Bithumb信息泄露事件，称尚未发现用户信息遭泄露</strong></p>\n  <p>10月28日，韩国金融委员会表示，已联合金融监督院、金融安全院及数字资产交易所联合协会等机构，就Bithumb等主要虚拟资产服务商遭遇网络攻击召开紧急检查会议。Bithumb报告称，发现员工及子公司、合作企业员工信息可能遭泄露，目前仍在核查用户信息是否受影响；遭入侵的是员工办公支持系统，尚未发现涉及虚拟资产钱包地址等可能被用于非法支付或转移资产的信息泄露。监管部门已启动现场调查，并表示将加强跨机构协作和消费者保护，同时研究强化虚拟资产行业等领域的网络安全措施。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>摩尔线程：前三季度营收32.89亿元，同比增319.15%</strong></p>\n  <p>36氪获悉，摩尔线程公告，2026年第三季度实现营业收入15.52亿元，同比增长1773.92%；归母净利润4926.04万元，扣非归母净利润2007.24万元，均实现扭亏为盈。2026年前三季度实现营业收入32.89亿元，同比增长319.15%；归母净利润3769.73万元，扣非归母净亏损1.31亿元，亏损大幅收窄。前三季度研发投入13.40亿元，同比增长55.72%，营收增长主要系智算产品在AI算力基础设施行业加速落地。</p>\n  <p><strong>梅赛德斯-奔驰：第三季度营收307亿欧元</strong></p>\n  <p>36氪获悉， 梅赛德斯-奔驰集团股份公司公布2026年第三季度财报。第三季度营收307亿欧元，上年同期营收321亿欧元；集团息税前利润17.7亿欧元，上年同期息税前利润7.5亿欧元；净利润15.2亿欧元，上年同期净利润11.9亿欧元。报告息税前利润的增长主要反映了较上年同期调整额的降低。经调整后的集团息税前利润下降15%至17.8亿欧元。</p>\n  <p><strong>谷歌第三季度营收1275.8亿美元，低于预估的1279.3亿美元</strong></p>\n  <p>谷歌第三季度营收1275.8亿美元，同比增长25%，预估1279.3亿美元；服务收入963.0亿美元，同比增长11%，预估984亿美元；广告营收820.1亿美元，同比增长11%，预估835.7亿美元；云收入307.1亿美元，上年同期151.6亿美元，预估291亿美元；其他业务营收3.72亿美元，同比增长8.1%，预估3.878亿美元；每股收益2.12美元，上年同期2.87美元；经营利润405.8亿美元，同比增长30%，预估431.6亿美元；营业利益率32％，上年同期31％，预估33.7％；资本支出513.6亿美元，上年同期239.5亿美元，预估557.8亿美元。（财联社）</p>\n  <p><strong>中国电影：第三季度净利润7228.86万元，同比下降59.10%</strong></p>\n  <p>36氪获悉，中国电影公告，2026年第三季度营业收入10.79亿元，同比下降10.97%；净利润7228.86万元，同比下降59.10%。2026年前三季度营业收入25.91亿元，同比下降11.53%；净利润亏损3777.09万元，扣非净利润亏损1.84亿元。</p>\n  <p><strong>三只松鼠：第三季度净利润757.44万元，同比下降65.99%</strong></p>\n  <p>36氪获悉，三只松鼠公告，公司第三季度营业收入20.42亿元，同比下降10.48%；归母净利润757.44万元，同比下降65.99%。前三季度营业收入73.22亿元，同比下降5.63%；归母净利润2.57亿元，同比增长59.71%。</p>\n  <p><strong>LG电子第三季度营收23.82万亿韩元，同比增长8.9%</strong></p>\n  <p>LG电子修正第三季度业绩数据。公司第三季度营收为23.82万亿韩元，同比增长8.9%；营业利润为7819亿韩元，同比增长13.5%；归母净利润为6632亿韩元，同比增长72.2%。前三季度，公司累计营收为71.38万亿韩元，同比增长9.2%；营业利润为4.03万亿韩元，同比增长55.9%；归母净利润为2.15万亿韩元，同比增长20%。（界面新闻）</p>\n  <p><strong>中国太保：第三季度净利润收入794.28亿元，同比下降68.4%</strong></p>\n  <p>36氪获悉，中国太保公告，前三季度实现营业收入2915.64亿元，同比下降15.5%；归属于上市公司股东的净利润364.03亿元，同比下降20.3%。第三季度营业收入794.28亿元，同比下降45.0%；归属于上市公司股东的净利润56.28亿元，同比下降68.4%。</p>\n  <h2>投融资</h2>\n  <p><strong>“百奥几何”完成1亿美元A轮系列融资</strong></p>\n  <p>36氪获悉，近日，AI Native生物制药公司“百奥几何”宣布完成A+轮融资。至此，公司A轮系列融资超1亿美元。本轮融资由国寿资本领投，老股东上海生物医药基金再度加码。国开科创、瑞力投资、国方创投及头部生物医药产业方等多家机构跟投，老股东达晨财智持续加注，指数资本继续担任独家财务顾问。本轮融资将重点用于GeoFlow（分子水平）与GeoCell（细胞水平）两大微观世界模型的持续迭代、高通量自动化实验室扩建和自研药物管线的商业化落地。</p>\n  <p><strong>“派阑昆微”连续完成两轮融资</strong></p>\n  <p>36氪获悉，近日，光互连企业“派阑昆微”连续完成两轮融资，累计融资数亿元人民币。第一轮由隆湫资本（LP为锐捷网络、沪电股份）、纪源资本领投，第二轮由光合创投、隆湫资本领投，中芯聚源跟投。老股东锦秋基金、龙芯创投、腾业创投、张江浩珩、水木清华等继年初完成种子轮投资后持续加码。势能资本长期担任独家融资顾问。此次融资将主要用于投入三维光电封装能力、面向量产需求采购晶圆等产能以及搭建完整的光I/O研发团队。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong>近日，京东“Aidol创造营S2冒险季”DemoShow路演直播圆满落幕，50余款AI新品与创客团队作品亮相，覆盖办公生产力、家庭健康、运动训练、情感陪伴、创意智造多元生活场景。演员王珞丹、歌手胡彦斌等嘉宾组成“Aidol助推团”，现场体验测评各类AI创新硬件，共同解锁AI技术落地日常的全新可能。</p>\n  <p>一家1800人的公司，正在管着8000个“AI员工”——这是明略科技正在跑的真实组织实验。腾讯云 Agent Runtime 为可托管的“数字员工”提供支撑，既能同时带十万个AI跑起来，又能像管员工一样把每个AI的权限管住。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>程序员面试可以带AI了，但是面试约不到了。</p>\n  <p>&nbsp;</p>\n  <p><strong>Floatboat：搭个工作台，做一门生意</strong></p>\n  <p>不懂代码，用大白话搭出专属 AI 应用，还能上架赚钱。Floatboat 工作台直播，三位真实用户现场演示内容、外贸、教育三种完全不同的玩法，边看边聊。</p>\n  <p>&nbsp;</p>\n  <p><strong>你人生中捅过最大的娄子是什么？&nbsp;</strong></p>\n  <p>可能是一次崩盘的工作项目、一场搞砸的关键考试、一段破裂的关系、一个失败的决定。在那个你闯了祸、踩了坑的瞬间，脑海中的念头是？ 完了，天要塌了，这辈子完了。&nbsp;</p>\n  <p>我们习惯性地把一次纰漏视同于人生的溃败，但这些问题或失败真的带来了灾难吗？或许并没有，事情总会慢慢落地，生活依然要继续往前走。&nbsp;</p>\n  <p>人这一生的容错空间到底有多大？欢迎扫码二维码参与征集：曾经让你觉得会毁掉一切的“错误”，最后是否以不曾想到的方式轻轻翻篇？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_602b2a5fae114ed081527c32b2542d5f@5667365_oswg13985oswg256oswg256_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码 参与调研</p>\n  <p class=\"editor-note\"><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-29T00:13:55+00:00", "fetched_at": "2026-10-29T04:05:00.167722+00:00", "fingerprint": "7f857d888f191965"}, {"source": "36氪 - 最新文章", "title": "“对不起，我们不投具身智能了”", "url": "https://36kr.com/p/4046281658307456?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>具身赛道里，那个有些疯狂的投资人，开始收手了。</p>\n  <p>很少有人会质疑他的地位。他出现在某机器人上市公司早期投资人名单中、又是另一家具身智能头部企业的幕后人。在很多年中，他和公众视野保持着谨慎的距离。但在一级市场，他以风格凌厉和激进著名。</p>\n  <p>“他的判断很疯狂，没有前面那堆乱七八糟的（调研），就是我要投你，就投了，一个礼拜钱到账。”一位熟悉的投资人告诉硬氪。</p>\n  <p>如今，这个很少犹豫的人，忽然冷淡下来。他会告诉一些创始人：“这个项目要给董事会看一下。”接着，再也没有实际的回复。</p>\n  <p>对具身智能的创业者而言，2026年秋天，一切忽然开始崩裂。从气候已经凛冽的北京，到仍如盛夏的深圳，整个具身智能市场，正浸入同一片寒意中。</p>\n  <p>三家对具身充满热情的头部机构收紧了口袋。其中一家机构的投资人开会时明确：“<strong>收紧对具身智能的投资”、“对具身项目谨慎做判断”，另一家最近一个半月几乎没有具身项目上会。</strong></p>\n  <p>资本市场很现实，也很冷酷。深圳一位具身智能创业者9月前还在正常推进融资，9月后再找FA，对方告诉他：我们不接具身项目了——他在半个月中就成了不被欢迎的人。</p>\n  <p>他很难责怪FA。一位头部FA告诉硬氪，他近期收到的具身项目“<strong>应该少了一半</strong>”。这倒不算坏事，因为具身项目根本卖不动，“以往一个月能卖出去的项目，现在都卡住了，预计没有三到六个月搞不定”。最终，他们不得不提高接项目的门槛。</p>\n  <p>具身在很短时间中，就从FA心中“优先级最高的项目“变成了“滞销货”。有时，创业者还会被他们质疑：“几个月前市场最热的Timing，你们都错过了。我是不是可以认为，你们的市场Sense不够？”</p>\n  <p>其实，一位FA私下里说，自己更多是觉得可惜。他一次次提到“时机“。“如果那家公司踩中了timing，应该能够以一个非常好的价格非常快交割的。”他告诉硬氪，这家公司的失败，只是因为当下大家的“决策成本太高了”。</p>\n  <p>没人能准确指出，究竟从哪一张多米洛骨牌开始倒下。但时间很清晰，多名行业人士告诉硬氪，转折点出现在今年九月。</p>\n  <p>根据行业服务平台NE时代统计，<strong>9月具身智能领域的融资额相比8月掉了四成。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_74e9ce6b332e478fa2a24fa697b50c78@1199336245_oswg88006oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>很多事在短短几周集中爆发。</p>\n  <p>作为行业风向标的宇树上市，市值一度下跌一半。接着，具身上市公司CEO在朋友圈公开点明一些公司收入造假。关于“多家具身公司IPO暂停”的传言开始私下流传。从那以后，几家头部公司“动作一下就变形了，一下就很紧张。”</p>\n  <p>狂热进军被掐断得如此突然，以至于有些不真实。</p>\n  <p>数月前，还有一家具身智能创始人还很骄傲地告诉硬氪他们的估值涨幅线——今年2月，公司估值仅仅2个亿；到7月份，估值顶到30亿以上。<strong>短短5个月涨15倍。</strong>有公司为了谁第一个估值破200亿大打公关战，还有头部公司为了抢上市名额互放冷枪。</p>\n  <p>当资本从行业撤退，这一切争斗看上去甚至有些荒诞。过去三年，具身智能赛道制造了上百家初创公司，推出多家估值百亿的明星企业。而现在，他们之中的大多数，都处于飘摇不安的悬停状态。</p>\n  <p>一位投资人告诉硬氪，他的同行朋友们，有的已经不再关注具身智能，也有些乐观的人持币观望着——他们总认为，一切还远未到结局。</p>\n  <p>他给出了判断，现在正属于具身智能这一波周期里头的末期。行业势必需要经历一段震荡期，才可能进入相对稳定的阶段。他预计，<strong>这个时间点可能要等到2027年下半年，甚至2028年上半年。</strong></p>\n  <p>“大家都在等那个下半场，一起等。”</p>\n  <h2><strong>制造独角兽</strong></h2>\n  <p>具身行业的喧嚣，本就带着浓郁的投机气息。我们调研发现，所谓很多估值炫目的明星项目，主要靠推手操盘。</p>\n  <p>过去几年，行业里流行一种“全新”的创业融资模式，有投资人称其为<strong>“攒局式创业“</strong>。</p>\n  <p>这种玩法是，某些有资源的“攒局者”首先瞄准特定画像的人物，比如<strong>技术天才科学家、有丰富行业经验的大厂高管</strong>等，再鼓动他们下海当创始人。这些“攒局者”身份一般是投资机构，品牌声量未必突出，但手握丰厚的地方资源、资本网络。</p>\n  <p>而在他们决定创业之时，攒局者会拿出一整套计划，目的只有一个：推高估值，击鼓传花。</p>\n  <p>首先TA会帮助对方包装与造势。拎出大厂背景、技术天才、成功创业经验等标签，再推动项目进入一级市场的视野。</p>\n  <p>这群人都是利用人性的高手。一位FA告诉硬氪，过去一段时间，他们给出的投资决策点只有两天。他们会告诉对方：截止到明天晚上x点，必须给个决定。至于项目的更多材料，创始人访谈，安排不了。“你不投的话，下个人等着投。”</p>\n  <p>要是对方还在犹豫，他们会再推一把：“因为咱们关系好，我告诉你，xx机构想投，xx机构也想投。你不要，我就给另外的人。”</p>\n  <p>这种极限谈判之下，一些没什么经验的投资人很容易丧失理性。“整体就是一个非常 fomo （害怕错失）的情绪。”</p>\n  <p>相比于制造紧张的气氛，更重要的是提前安排融资节奏。上述投资人称，一些“攒局者”会<strong>在前几轮引入头部美元基金，并设法推动这些机构在后续融资中持续追加投资。</strong>而头部机构的不断加注，成为了吸引其他投资者入局的重要筹码。</p>\n  <p>除了投资上的出谋划策，“攒局者”们还会公司提供很多实用攻略，比如怎么拿订单、怎么“造”收入等等。</p>\n  <p>在这种设计精密的布局中，公司按照走线一步步推高估值。前述投资人称，类似项目<strong>第一轮估值往往是1亿美金左右起步、第二轮一般翻倍至15亿元、第三轮是25-40亿元。</strong>而且，有些特别有卖点的项目也会出现超募现象， “<strong>有时候第三轮估值一下子就跳到50亿或者更多”。</strong></p>\n  <p>这是一套运行精密的机器。 投资机构未必需要等待一家机器人公司真正完成商业化，便可能通过后续融资带来的估值上涨，获得账面收益。于是，在这场估值游戏中，技术团队、投资机构与FA之间心照不宣，推动雪球越滚越大，直至Pre-IPO。</p>\n  <p>不过，这种机制能够持续运转，有一个重要前提：公司能成功上市。而当上市路径掐断，新增资金不再积极入场，原本不断上涨的估值链条，也就从底层开始松动。</p>\n  <h2><strong>旧投资逻辑倒塌</strong></h2>\n  <p>一些敏锐的投资人，其实早在上半年就在刻意控制投资节奏。“<strong>大家置身局里，肯定知道投资是疯狂的、动作是变形的，所以当投资到达顶峰，势必就会下降</strong>”，一位投资人向硬氪分析。</p>\n  <p>但他们无法预判，究竟泡沫会在何时，因为何事破裂。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_ae9494fcda9242acad49834d9a04c82c@1199336245_oswg68879oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>事实上，多位行业人士向硬氪表示，这轮降温并非由某一件事单独引发，而是<strong>一级市场、二级市场、学术圈多因素共振的结果。</strong></p>\n  <p>首先，经过三四年的密集投资，头部机构基本已经完成了具身智能布局。</p>\n  <p>到2026年，资本几乎已经覆盖了具身智能整个产业链的所有卡点。2024年，热钱袭向硬件本体、2025年转向机器人大脑、核心零部件（灵巧手、传感器、触觉、仿生脸等），再到今年流向具身数据、世界模型。几乎每个领域都缔造了一批百亿估值公司。</p>\n  <p>一个根本没有商业化的产业，显然不可能容纳如此多独角兽，只是每个人都在正确的时间找到了接盘的人。一位投资人士甚至直言，投资逻辑简单到，“<strong>我只需要判断你上市的可行性，能赚钱就可以投</strong>”。</p>\n  <p>在这种交易逻辑下，二级市场给予机器人公司的估值越高，一级市场就越有理由为尚未上市的创业公司支付更高价格。一位投资人直言：“<strong>「宇树们」涨得越高，其实对未上市的公司融资是越好的。”</strong></p>\n  <p>如今，二级市场没办法提供他们期待的回报。8月上市的宇树科技，股价从上市首日1100元高点一路下跌，最大回撤超过六成（近日股价回升至720元）；9月上市的梅卡曼则跌破发行价；极智嘉曾出现破发，越疆科技股价也较历史高点大幅回落。</p>\n  <p>这些都是上岸幸运儿，更让投资人无法接受的，是手里的公司或许拿不到上市通行证。但他们也无法给出政策的走向。</p>\n  <p>除了资本市场出路堵塞，技术层面的最新进展，也在撼动部分投资人此前的判断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_b1eb22e92f1348228eafb605265236b2@1199336245_oswg114021oswg1024oswg683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自视觉中国</p>\n  <p>据过去两年，具身智能领域涌现出一批以VLA、世界模型等技术为核心的创业公司，它们试图为机器人打造通用大脑。而到今年9月，OpenAI发布GPT-6 Astra——尽管它并非专门面向机器人训练的模型，却也引起了具身智能行业的震荡。</p>\n  <p>比如，宇树王兴兴近期在一场演讲中提到，经他们实测，GPT-6 Astra可以在零训练情况下，仅仅通过<strong>提示词</strong>，就让机器人完成绘画。令人惊喜的是，机器人还会自主完成更换颜料、清洗画笔等配套工作。“<strong>未来大模型可能‘击穿’物理AI</strong>。”他这样判断。</p>\n  <p>而在国内，硬氪了解到，<strong>DeepSeek在内的国内基础模型厂商近期也在密集接触具身智能企业</strong>，探索进入这一领域的机会。字节跳动也在为具身模型招聘工程师和负责人。</p>\n  <p>显然，<strong>大模型厂商才是足以吞噬具身大脑创业公司的巨兽</strong>。有投资人在采访中向我们抛出了一个问题：如果一家具身创业公司花费近百亿元训练出的模型能力，未来可以由通用基础模型实现，那么这些公司此前建立的技术壁垒，还值不值上百亿的估值？</p>\n  <h2><strong>过冬</strong></h2>\n  <p>话语权已经逆转。 “以前往往是项目方觉得，‘我值这个价’，现在是投资机构认为，‘你不值这个钱’。”</p>\n  <p>寒意让很多具身公司纷纷改变姿态。</p>\n  <p>一家具身大脑公司的创始人告诉硬氪，近期他们改变了融资策略。</p>\n  <p>此前，他们更倾向于集齐几家知名投资机构，由头部机构领投，完成一轮规模较大的融资。如今，他们则转向“小步快跑”，只要有投资机构愿意进入，就可以启动新一轮融资。</p>\n  <p>“<strong>我们必须要抢时间，存过冬粮</strong>。”这位创始人告诉硬氪。</p>\n  <p>一些高估值的头部具身公司则开始收缩战线。</p>\n  <p>硬氪独家获悉，某估值超过200亿元的头部具身智能公司，<strong>近期正在推进组织架构调整，将此前分拆出去的子公司重新整合，并精简研发架构</strong>。而部分估值超过百亿元的具身智能公司，也出现了裁员、撤回offer等情况。</p>\n  <p>投资人已经不再轻易为轻飘飘的愿景付费。</p>\n  <p>一位投资人告诉硬氪，现在他们对具身智能项目提出了几点明确的要求——<strong>公司需要有清晰的商业化落地场景、真实的市场需求、创始团队中最好要具备产业资源且能推动产品落地的成员。</strong></p>\n  <p>“现在很难出手纯粹的实验室叙事，只能给到比较低的估值价格。”这位投资人说。</p>\n  <p>一些过去边缘化的项目，反而成了如今为数不多的选择。多位投资人向硬氪表示，<strong>近期部分资金反而开始流向一些过去不被“看好”的项目。</strong></p>\n  <p>这些公司未必拥有最亮眼的技术背景，也不一定致力于打造通用机器人，故事不够性感，但在特定行业和场景中，已经找到了明确的客户需求，拿到了真实订单，包括一些上游零部件、关节或设备厂商。</p>\n  <p>“<strong>大家现在终于能回归正常的投资判断逻辑</strong>。”上述投资人说。</p>\n  <p>当乐声停止，他们终于开始反思过去。</p>\n  <p>一位具身智能公司创始人向硬氪感慨，当前行业最大的矛盾之一，是人们对机器人发展的速度抱有过高期待。</p>\n  <p>“汽车用了200年才变成现在这个样子，而大家希望机器人用5年就变成汽车那样。<strong>资本总是过早地相信未来，又在遭遇挫折时，过早失去耐心</strong>。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261029/v2_5da662afbeb1483487ec2b057ad0848f@1199336245_oswg79490oswg1280oswg399_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">&nbsp;</p>", "category": "tech", "published_at": "2026-10-29T01:32:34+00:00", "fetched_at": "2026-10-29T04:05:00.167707+00:00", "fingerprint": "e57cc19dfbb19e40"}, {"source": "少数派", "title": "断舍离只是起点：打造能长期经营的实用主义衣柜", "url": "https://sspai.com/post/116990", "summary": "只扔不买是没有用的，穿衣服时不多费心神才是目的。<a href=\"https://sspai.com/post/116990\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-28T07:00:00+00:00", "fetched_at": "2026-10-29T04:04:58.654266+00:00", "fingerprint": "0b2ee362173dd30f"}, {"source": "少数派", "title": "备受期待的国产 3A 游戏新作：《影之刃零》游玩体验", "url": "https://sspai.com/post/117725", "summary": "编注：《影之刃零》（PhantomBladeZero）是由中国游戏开发商「灵游坊」（S-GAME）自主研发的暗黑武侠动作冒险游戏，采用虚幻引擎5打造。游戏以独特的「功夫朋克」美学为特色，将中国传统武侠 ...<a href=\"https://sspai.com/post/117725\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-28T09:37:22+00:00", "fetched_at": "2026-10-29T04:04:58.654259+00:00", "fingerprint": "2abe74b180654242"}, {"source": "少数派", "title": "派早报：Apple 推出触控款 MacBook Pro、华为发布多款新品等", "url": "https://sspai.com/post/117750", "summa 科技创始人、首席科学家陶虎对36氪介绍称，这样做，一是因为脑机接口已上升到国家战略层面，国资领投能带来更强的政策支持力度；二是考虑到后续产业协同问题。在他看来，当前，市场上仍没有专为脑机接口而生的电极公司、芯片公司或算法公司，因此，只有和上下游合作方携手，先“把脑机接口整个产业做起来”，行业天花板才能抬更高。</p>\n  <p>2026年，头部脑机接口公司被“抢额度”的情况已非个例。在陶虎的体感中，3、4年前，投资人眼中的脑机接口还是“相对稚嫩的科幻概念”，大家喜欢听“国内首个”“最高通道”或“中国版Neuralink”的故事；但如今，脑机接口已经是被认真正视的产业，市场更关心临床效果、患者获益、供应链自主可控，以及最终交付的产品。</p>\n  <p>技术和产品方面，脑虎科技自研了全植入、全无线、全功能“三全”脑机接口系统。顾名思义，全植入，就是将包括电池在内的所有核心器件都植入体内，体表没有外露部件；全无线，是指供电和数据传输都通过无线完成，哪怕是患者洗澡、睡觉、社交也不受影响；全功能，则是让同一套系统既能做运动解码，也能做语言解码和环境控制。</p>\n  <p>陶虎认为，“三全”方案能更好规避传统植入手术的感染风险问题，且有望持续、稳定地采集真实数据。在传统方案中，导线会穿过皮肤连接体外设备，是细菌进入颅内的通道，感染风险较高。而有线供电时患者又处于紧张状态，采集到的未必正常生活下的脑电。全植入加全无线，相当于堵住了这两个入口。</p>\n  <p>在这个意义上，脑机接口也不再是一个需要外部设备维持的实验系统，而是成为一个“能够独立工作的植入式系统”。</p>\n  <p>为了实现这一点，脑虎科技在设计植入方案时，选择将柔性电极贴在硬膜下的大脑皮层表面，电池、处理器、天线等高发热单元放在胸部皮下。陶虎解释，插入大脑皮层看似更“精细”，但随着脑组织晃动、颅内压变化，很容易造成电极移位或脱落。此外，一旦引发免疫反应，神经被炎症包裹，信号就会衰减，严重时还要二次开颅。贴在皮层表面，信号质量和深插基本一致，长期可靠性反而更好。未来如果要提升通道数，只需提高电极密度。</p>\n  <p>反映在患者身上，是脑虎一直追求的“不伤脑、不烧脑、可复制”，即电极不穿刺脑实质、热源远离大脑，手术借用成熟的DBS范式，神经外科医生经培训后便可独立操作。“我们希望，这套方案能带来患者尊严的回归。”</p>\n  <p>据脑虎科技提供数据，截止目前，该方案已完成65例临床试验；今年7月，“三全”脑机接口系统已正式进入三类医疗器械注册临床阶段，由复旦大学附属华山医院牵头开展GCP注册临床试验，毛颖教授团队担任主要研究者，并联合全国近20家三甲医院共同开展。</p>\n  <p>9月底，脑虎科技曾披露最新一例探索，将这套脑机接口产品的能力展示得更具体。例如，在真实生活场景中，一名受试者借助AI智能眼镜的同步定位和建图（SLAM）能力，完成视觉感知和动态建模，识别他关注的区域，并列出可控设备。然后，他用脑机接口确认意图，能自主调节病床、开关灯光和其他家用设备。</p>\n  <p>整条链路中，脑机接口是底层连接，XessOS（脑虎科技自研的脑机操作系统）负责把意图翻译成设备指令。</p>\n  <p>陶虎把这套方向称为“BCI+AI”。在他看来，脑机接口“不只是医疗器械，更是人类智能与人工智能融合的接口”，应由人负责提出目标和判断，AI和机器承接执行。一方面，脑机接口的高质量神经数据需要AI大模型做精准解码；另一方面，具身智能和大模型缺的正是“意图”的入口。</p>\n  <p>但陶虎很清楚，当前的数据量还远远不够。“几十例临床数据储备，还做不到让算法在不同患者之间无缝迁移，有可能我在这个病人身上调的模型，换到下一个人身上就不管用了。”他的判断是，至少要几百例甚至几千例，才能形成可归纳、可复现、可移植的算法。</p>\n  <p>在陶虎的设想中，脑机接口的发展会经历两个阶段。第一阶段便是现在，用有创的“三全”系统服务高位截瘫、失语、失明等重症患者，让他们“从病人回到正常人”，能独立交流、控制设备、自己生活。</p>\n  <p>第二阶段在未来3-5年后，通过有创脑机接口作为金标准，去校准信号弱、不稳定的无创方案，让脑机接口从病床走向普通人的日常，让“正常人成为超人”。“无创是行业的未来，但无创信号太差，必须用有创的高质量数据去校准。”陶虎认为。</p>", "category": "tech", "published_at": "2026-10-28T00:30:00+00:00", "fetched_at": "2026-10-28T03:43:55.048362+00:00", "fingerprint": "148242e18f573e7c"}, {"source": "36氪 - 最新文章", "title": "对话星连资本张鸣晨：在清华挖宝，看教授的虎气、猴气与熊气", "url": "https://36kr.com/p/3997098817310595?f=rss", "summary": "<p>文 | 海若镜</p>\n  <p>&nbsp;</p>\n  <p>又一支清华系基金募到了新钱，这一次是张鸣晨和他创立的星连资本。</p>\n  <p>年轻的星连资本，2021年出道时投了智谱天使＋轮，此后一路加仓，一期基金40%的钱押在智谱。勇猛加仓的故事，还发生在基流、生数科技、面壁智能身上。</p>\n  <p>对基流，他们连投了五六轮，投成了外部第一大股东。基流以15亿估值融资的关口，原本谈好的投资人临时爽约，张鸣晨说，“没关系，我们领”。不到一年，基流估值翻了10倍。</p>\n  <p>见到张鸣晨前，我理解他可能是很敢bet的激进型投资人，但他自评“还挺保守”，打牌也很少梭哈。重仓有机会homerun的公司，以高风险搏高收益，在他看来是美元基金的常规打法，他称星连资本是<strong>“披着人民币外衣的美元基金”</strong>。而今，他们募到了美元。</p>\n  <p>暗涌Waves获悉，10月星连资本一期美元基金完成首关；8月人民币成长基金首关；4月投早期的人民币三期基金完成首关。成立至今，“一期基金投出的AI项目，有三分之一在IPO轨道上。”</p>\n  <p>张鸣晨理解的保守，第一层意思是不赌假说。如果把一个复杂任务拆成8步，他不会在只解决了2步时下场；而是等学术界啃下6个，只剩2个最难的问题时，才投钱入局。</p>\n  <p>聊AI技术时，他直言“哲学没用，直接定量”。海外一款新芯片被市场热议，他不参与定性讨论，直接找几家模厂问，用完效果如何——听到事实，结束讨论。</p>\n  <p>典型的理工科思维。</p>\n  <p>在张鸣晨看来，星连重仓的胆量，<strong>源于“离得足够近”。</strong></p>\n  <p>张鸣晨本科、硕士都在清华大学自动化系，可以自然融入清华技术创业者的圈子。基��科技创业之初，没有客户，张鸣晨通过朋友帮他们协调了一批GPU，完成技术验证。投资只是一个开始。AI公司变化快，跟创始团队处得像同事，作为”一个战壕里的兄弟“，他了解重点被投的订单、管线、潜在需求，这些“明牌”让他敢于追投。</p>\n  <p>对于“投教授”，投资圈里常有摇摆，投与不投都有100个理由。<strong>张鸣晨是坚定的投资派，他定义星连资本是一家Researcher Fund，自2021年起坚定地“不投大厂，投大学”，因此，星连70%的项目出自清华。</strong></p>\n  <p>如今，市场逐步有了共识：AI正在像数学，最顶尖的1000人做了全行业95%的贡献。早于市场两年半的转向，让张鸣晨捕捉到了国内顶级研究员的机会，也更深地融入了清华创业生态，能采集到在小圈子里流通的那些信息。星连与清华大学九个研究AI的院系合作，“有的研究员刚入组，创业项目就已推了过来”。</p>\n  <p>如何判断教授的商业化潜力？他说要看“三气”：虎气、猴气、熊气。如何形成能支撑VC变现的顶级认知？<strong>“七分技术，三分直觉”</strong>。在张鸣晨看来，看的项目足够多，做的决策足够多，获得的反馈足够多，就能形成“投资手感”，像训练AI一样。</p>\n  <p>在移动互联网时代，张鸣晨作为谷歌中国第一批员工、而后加入红点中国成为合伙人，曾投资过小马智行、Opay、趣头条等。张鸣晨如何通过楼天城认识了唐杰？清华圈为什么创业成功率高？只投教育系统筛选出的“第一名”，会不会错过outlier？新的美元LP看了中国模厂后体感如何？</p>\n  <p>就诸多问题，我们与张鸣晨聊了聊，以下是「暗涌Waves」与张鸣晨的对话（经编辑）：</p>\n  <p>&nbsp;</p>\n  <h2><strong>保守入局，激进加仓</strong></h2>\n  <p><strong>「暗涌」：智谱，是星连资本一期基金投的第一个项目？</strong></p>\n  <p><strong>张鸣晨：</strong>对，2021年那轮我们是领投，之后连着投了四轮。一期基金里，有40%的钱投到了智谱。其他还投了无问芯穹、辉羲智能，后面也都在加仓。</p>\n  <p><strong>「暗涌」：最初怎么接触到智谱，又是怎么下决定投的？</strong></p>\n  <p><strong>张鸣晨：</strong>在红点中国时，我投资了小马智行。小马智行CTO楼天城，曾经被称为是“中国编程第一人”，清华计算机04级、姚班开山大弟子，清华很多人都叫他“楼教主”。有天他就说，你们一定得认识一下唐杰，计算机系vision最好的老师之一，非常厉害。唐杰老师拿了系里历史上第一篇ACM best paper。现在大家发得比较多了，但在2020年之前，那真的是凤毛麟角。</p>\n  <p><strong>「暗涌」：那时候智谱已经在创业了么？</strong></p>\n  <p><strong>张鸣晨：</strong>还没有。但他已经带着一批人在做项目，杨植麟、刘知远等都是他们一个组。当时他们在智源研究院，做出了中国全行业第一个大模型，叫“悟道”。<strong>为什么叫“悟道”呢？因为模型是在五道口训的。</strong></p>\n  <p>这个团队，其实就是中国大模型的黄埔军校，国内模厂的很多技术主力，都是这里走出去的。大家掌握了炼丹的技巧，开枝散叶，形成了中国大模型的整体格局。</p>\n  <p>智谱起家的业务是知识图谱，所以他叫智谱。干大模型这件事，一定程度上是我跟唐老师一起讨论出来的。当然最后拍板还是智谱自己的团队，但我们起到了重要作用。智谱体系内训的第一个模型，花的就是星连那笔钱。</p>\n  <p><strong>「暗涌」：那考虑过投Kimi么？</strong></p>\n  <p><strong>张鸣晨：</strong>当然。但三四年前，愿意在早期bet大模型的钱就那么一些，资本供给侧是零和游戏，所以比较紧张，我们就重点押在智谱上。现在大家都看明白了，这些都成了“国宝级项目”，一堆钱追着投。</p>\n  <p><strong>「暗涌」：智谱上市后股价大涨大跌，LP会追着问吗？</strong></p>\n  <p><strong>张鸣晨：</strong>也会。上市后都是公开信息，高点时市值超万亿，自然受关注。但二级市场波动很正常，它不光是基本面决定的，还跟宏观货币供应、板块轮动等很多因素有关，像弹簧，围绕fundamental上下波动。</p>\n  <p>我们更关注智谱的商业基本面。中期业绩会上，他们披露了新数据，计算下来8月单月收入相当于前6个月总和，增速非常快。</p>\n  <p><strong>「暗涌」：投中一个明星项目不算罕见。但持续加仓，挺考验魄力。基流，你们投了几轮，把自己投成第一大外部股东？</strong></p>\n  <p><strong>张鸣晨：</strong>大概五、六轮吧。基流一开始找到我时，只有非常强的技术，没有客户。聊完以后，我不光给了投资，还帮着联系了智谱，协调出一批GPU，支持他们做技术验证。所以，我不光给第一张term sheet（投资意向书），还给第一张商业合同。</p>\n  <p>为什么清华创业成功率高？首先肯定技术过硬，其次清华人真抱团，遇到事情真帮忙。</p>\n  <p><strong>「暗涌」：投基流的几轮里，哪些是雪中送炭，哪些轮得抢份额？</strong></p>\n  <p><strong>张鸣晨：</strong>我记得非常清楚，15亿估值时，原本谈好的一个投资人掉了，公司给我打电话，我说没关系，我们来领投。那是去年的事，不到一年，基流现在估值已经150亿了。</p>\n  <p><strong>「暗涌」：敢连续加仓，底气来自哪里？</strong></p>\n  <p><strong>张鸣晨：</strong>我们跟企业走得很近，与创始团队相处就像同事，有事随时打电话。所以对公司既有订单、未来管线、潜在订单需求等，都非常清楚。外部投资人对业务未必能了解这么全面，特别AI企业，三个月可能完全变样。</p>\n  <p>大家是一个战壕里的兄弟，一起把生意做大。那他遇到困难会找我，有好事也会想到我。比如，基流有卡可以出租了，我们投的哪些企业需要算力，也能最早知道。</p>\n  <p><strong>「暗涌」：估值翻了几倍后，再追投会犹豫么?</strong></p>\n  <p><strong>张鸣晨：</strong>投资要往后看。今天这个价格投下去，后面还能不能有10倍的投资回报？如果有，今天就是好价。单看估值是100亿、1000亿，判断不了贵不贵。我们对基流的业务足够了解，所以没有犹豫。</p>\n  <p><strong>「暗涌」：所以重仓加注，在星连比较普遍？</strong></p>\n  <p><strong>张鸣晨：</strong>智谱、生数、面壁、基流等，这些项目我们都多轮加仓。</p>\n  <p><strong>「暗涌」：很多项目都需要重度陪伴，管得过来吗？</strong></p>\n  <p><strong>张鸣晨：</strong>投的企业多了，有的也长大了。有点像家里孩子多，老大带老二、老二带老三，互相之间就转起来了。</p>\n  <p><strong>「暗涌」：你会用“激进”去形容自己的投资风格吗？</strong></p>\n  <p><strong>张鸣晨：还挺保守。我们不赌hypothesis，不会为假说买单。</strong>一个复杂任务，如果有8个问题需要解决，我不会在解决了2个、还剩6个的时间点进去；而是在学术界已经解决了6个、还剩下2个最难的timing进去，给钱，让他把最难啃的骨头解决掉。</p>\n  <p><strong>「暗涌」：你们会讨论科技哲学吗？比如AI将怎样改变组织和社会吗？</strong></p>\n  <p><strong>张鸣晨：</strong>不用哲学，我们就做定量讨论，哲学没用。</p>\n  <p>直接问研究员：这事已经跑了多少步，有没有收益，能不能跑通。之前大家疯狂讨论一种新型芯片，很多人做定性讨论：它能不能用来跑模型。我直接问几家模型公司：你们用完怎么样？他们说掉点很严重。OK，这事就结束了。</p>\n  <p>真正开会的时候，我们都很严谨，聊技术、聊实际问题。哲学是课余愿意聊就聊。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>在清华挖宝</strong></h2>\n  <p><strong>「暗涌」：在外界看来，星连资本有一些标签，比如智谱CVC、清华系、AI native，你自己怎么定义这支基金？</strong></p>\n  <p><strong>张鸣晨： </strong>我们自己定义是Researcher Fund。美国AI产业里，最好的研究者都在大公司，投AI的基金围着几家大公司找人；中国顶级研究人员在几所顶尖大学里，逻辑不一样。</p>\n  <p><strong>「暗涌」：所以你们投的项目70%来自清华。“智谱CVC”是当下你最想澄清的一个标签？</strong></p>\n  <p><strong>张鸣晨：</strong>也还好。智谱确实是我们最重要的合作伙伴之一。但市场上有种误读，觉得我们是智谱下面的投资部门，这不对。有些项目会觉得中间有冲突，不愿意聊。我们会解释：星连是market-based的基金，大部分钱是市场化渠道募集而来，智谱不是我们的大LP。</p>\n  <p><strong>「暗涌」：之前投智谱、面壁、基流等都是清华系创业者。密集投清华的项目，你有什么体感？</strong></p>\n  <p><strong>张鸣晨：</strong>投清华的项目比较简单。</p>\n  <p>清华教授做的项目，在技术上不需要做特别的判断。能考到清华读书本就经过了严格筛选；清华计算机系一个年级150个人，能留校的只有一两个人。留校后，还有非升即走考核。在清华里能当tenure，都是各自领域里的“世界级人才”。所以主要判断，在商业上，他是不是一个足够有潜力的人。</p>\n  <p><strong>「暗涌」：商业潜力的判断有什么方法论么？比如怎么判断一个年轻PI融资，是为了成就一家商业公司，还是想买卡做科研？</strong></p>\n  <p><strong>张鸣晨：</strong>我们说要“看三气”，<strong>虎气、猴气、熊气。</strong></p>\n  <p>虎气，是说你要有领导力，不光自己学术做得好，还能把更厉害的研究员团结起来创业。猴气是足够聪明，有很强的vision、insight、taste。熊气，要有执行力、落地能力。我们也看到过行业里很多人光说不练，偏参谋型，这种就不适合做1号位。</p>\n  <p>最理想的肯定是三种气质都有。看得多了，会形成一种肌肉记忆。几次接触下来，我们就能感知到创始人哪方面气质格外突出，长板在哪里。</p>\n  <p><strong>「暗涌」：现在是技术投资的时代，如果全世界同行都评议筛选过了，为什么许多投资机构在早期没投中清华系模厂？</strong></p>\n  <p><strong>张鸣晨：</strong>第一，AI技术确实新。很多老牌TMT投资机构的技术栈储备不够用了。第二，机构认知是否足够深。历史上有投了多个清华项目的投资人，错过了清华几个模型、重要Infra公司，还是因为没有看明白“模型”。早期非常恐惧，担心做大模型有诸多风险、没有商业模式。</p>\n  <p>聊早期项目先问\"商业模式是什么\"，这是典型的人民币基金风格；但模型和infra早期其实很难谈出来，所以就没投。</p>\n  <p><strong>「暗涌」：从TMT到AI，投资逻辑发生了哪些变化？</strong></p>\n  <p><strong>张鸣晨：</strong>对于投不投教授，TMT投资人会有惯性、有摇摆。因为互联网公司需要强运营，要求创始人必须接地气、能打仗，把经济账算到极致。这些确实教授不擅长。</p>\n  <p>但AI更加技术驱动，它第一性原理是最高水平的研发，技术是决定性要素。有点像数学界——最顶尖的1000个人，干了全行业95%的事。</p>\n  <p>而且现在从技术到商业的转化非常直接，不经过销售和运营，只要做出一个好模型、好产品，通过GitHub、Twitter可以迅速传播，用户可以马上接API，公司就能产生收入。所以这个时代，顶级researcher大放异彩。</p>\n  <p><strong>「暗涌」：清华系师生准备创业了，你们通常怎样第一个知道？那个“雷达”长什么样？</strong></p>\n  <p><strong>张鸣晨：</strong>我们有很多官方渠道，通过孵化器，我们跟清华技术转化部门等建立了合作框架，对口单位和院系都会给我们推项目。清华研究AI的有9个院系，我们都有合作。</p>\n  <p>因为之前投资过很多清华教授，老师们有时也会主动推荐项目。包括清华姚班也很鼓励创业，有的研究员刚入组成为PI，大家就把他的创业项目推荐过来了。深入合作，关键是意愿、能力、信任，这三点我们都具备。</p>\n  <p><strong>「暗涌」：作为智谱、基流的天使投资人，在清华创业生态里，你认为自己属于什么角色？</strong></p>\n  <p><strong>张鸣晨：</strong>我们自己定义是，做被投公司的副驾驶。</p>\n  <p>创业三个要素：人、钱、事。除了给钱，人和事我们也一块来帮公司规划。清华老师介绍项目过来，也会说我们“是清华圈最知道怎么做AI项目、配置资源的，你们一定要过来聊聊。”</p>\n  <p>我们相当于建了一个<strong>“AI投资Infra”，一个AI创业供应链。</strong>把高校和产业、资源打通，批量产生高质量的AI创业项目。清华的人才其实是全国的人才，让全国受过最好教育的人，把最好的能力转化成AI生产力，最后释放到全社会。</p>\n  <p><strong>「暗涌」：只在圈子内流动的信息多吗？</strong></p>\n  <p><strong>张鸣晨：</strong>很多。researcher 是个小圈子，靠不靠谱，吃个饭、喝个酒，一聊就聊出来了。</p>\n  <p><strong>「暗涌」：有些熟人推荐来的项目，会碍于人情投一点钱吗？</strong></p>\n  <p><strong>张鸣晨：</strong>我们投资决策是市场化的，大家标准统一：首先，只投全市场最好的1%项目。第二，这个项目后边能有10倍投资回报。</p>\n  <p>用这两个标准筛选，明显的资源类项目，我会拒绝掉，不是清华项目照单全收。因为正是严格筛选，好项目才愿意拿我的钱，创始人看重的是“我跟谁是Peer”。</p>\n  <p><strong>「暗涌」：看好这类项目，你们会是领投、给出最高价格的那一家吗？</strong></p>\n  <p><strong>张鸣晨：</strong>基本都是领投，但不见得出价最高。最近我们孵化了清华一位教授的项目，市场上追的人很多。最后我们给的价格并不最高，他还是选了我们。因为两年前，我们就开始帮他探索这个生意，一起设计商业模式、补团队。他觉得和我们一起做靠谱，估值比别人低一些，也可以接受。</p>\n  <p><strong>「暗涌」：只投体系筛选出来的第一名，会错过王兴兴那样的outlier吗？</strong></p>\n  <p><strong>张鸣晨：</strong>我们也愿意投outlier，比如我们在深圳投的Zettlab，是大疆和云鲸出来的人，做个人龙虾机（agent computer），做得非常好。不管哪个大学毕业，本质上还是挖掘“人”。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>募到双币，去出海</strong></h2>\n  <p><strong>「暗涌」：为什么在今年决定募美元基金？</strong></p>\n  <p><strong>张鸣晨：</strong>今年市场上越来越多项目倾向于拿美元：原来10个项目只有一两个，今年增加到四五个。特别是一些从美国回来的华人创业者，公司注册在香港、新加坡，没有美金不好投进去。</p>\n  <p><strong>「暗涌」：星连资本成为一家双币基金，对你个人来说有什么意味么？</strong></p>\n  <p><strong>张鸣晨：</strong>比较顺理成章，我老说星连是<strong>“披着人民币外衣的美元基金”。</strong></p>\n  <p>我们核心投资人基本都是美元基金背景，看人、看事、公司管理更偏美元风格，现在只不过真的手里有了美金。币种其实无所谓，我们一直关注的是怎么投资到伟大公司。</p>\n  <p><strong>「暗涌」：感兴趣投资中国AI的美元LP，有哪些新特点？</strong></p>\n  <p><strong>张鸣晨：</strong>有一点挺重要，最近聊的美元LP很多都有产业属性，愿意跟中国AI技术公司做战略合作、出海。</p>\n  <p><strong>「暗涌」：是传统的产业集团么，具体怎么合作？</strong></p>\n  <p><strong>张鸣晨：</strong>一些海外产业集团，主业是运营商、大连锁、头部金融公司等等，他们非常愿意搭着AI技术公司一起去做商业拓展。</p>\n  <p>就在前些天，欧洲一家管理约2000亿美元资产的机构，CEO特意跑到我们办公室。他发现他们每月花大量的钱买token去做行业研究、build内部系统。之前，多一半预算是花给美国模型做复杂任务规划，少一半花给中国模型做执行，中国模型性价比最高。</p>\n  <p>之后他觉得可能会反过来。他就想来看看，中国到底是一帮怎样的人在做模型，后面会怎么发展？既然中国模型这么强，那我们能不能战略合作，我帮你去打开欧洲客户的市场。</p>\n  <p><strong>「暗涌」：看了五道口这边的模厂、Infra公司之后，有什么他预期之外的东西吗？</strong></p>\n  <p><strong>张鸣晨：</strong>看完就觉得欧洲人自己别做了，投资中国AI公司，建合资公司、一起做生意就行。他们有市场，我们有技术。</p>\n  <p><strong>「暗涌」：技术上，这些潜在美元LP会问得特别细？</strong></p>\n  <p><strong>张鸣晨：</strong>他们看得非常深。有些美元LP跟VC一样，投资人每天看行业，看项目，一起交流前沿问题。比如最近recursive（递归式自进化）很热，OpenAI、Anthropic、国内几个大模型公司都在做，新成立的startup空间在哪？再比如World Model哪条路线能收敛？中国的算力怎么能追上？都是行业一线问题。</p>\n  <p><strong>美元募资对我们来说，反而简单一些，他们就看业绩、看行业认知。</strong>要体系化地讲清楚：昨天在哪，今天在哪，明天在哪。</p>\n  <p><strong>「暗涌」：业绩如何？</strong></p>\n  <p><strong>张鸣晨：</strong>星连一期基金有几十个项目，接近三分之一都在IPO轨道上。TMT时代，一期基金的常规IPO Rate 2% - 5%，我们现在是30%。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>AI投资：七分技术，三分直觉</strong></h2>\n  <p><strong>「暗涌」：你多次提到AI时代投资要懂技术、要有顶级认知。你是一个绝对理性的人么？你所说的“顶级认知”从哪里获得？</strong></p>\n  <p><strong>张鸣晨：</strong>AI时代投资更强调理性，但也不能100%是机器人式逻辑思维，也有感性的东西。很多事情有不确定性，等完全想明白再投，也晚了。</p>\n  <p>非要划分的话，可能三七开。70%靠技术，是对行业、对企业的认知；30%靠直觉。好多时候直觉没有依据，但确实也很重要。</p>\n  <p>我跟同事讲，投资无非“两个多”：看的项目多不多，投的项目多不多？多了，自然产生手感。人也像一个神经网络，有很多说不清道不明的东西，但喂的数据足够多，就很容易形成机制。投资，是在不确定性里追求确定。靠运气可能找到一两个好项目，但不可能保障整个基金实现系统性的高收益。</p>\n  <p><strong>「暗涌」：听起来跟训AI模型一样。早年你在聊趣头条的投资判断时说过，投资人获得一手信息是晚于市场信号的。现在投AI呢？</strong></p>\n  <p><strong>张鸣晨：</strong>好的GP必须提高信息收集频率，加快认知迭代。传统TMT投资，一个月更新一次信息可能够了，但AI每周、每天都有新东西，必须每天都接触最前沿的信息。</p>\n  <p>我们孵化器一年有100多场活动，顶级学者、工程师每天在想什么，技术推进到哪，市场需求在哪，都要跟他们一起交流。光触达信息还不够，你得“学而思”。拿到信息之后，不断理解、思考，把它变成自己的东西。</p>\n  <p><strong>「暗涌」：把这些认知落到投资上，下一步你会把钱投向哪里？星连投在芯、算、模、用的比例如何？</strong></p>\n  <p><strong>张鸣晨：</strong>多一半在模和算，这是最基础、价值最大的，少一半在芯片和应用。但接下来，好应用会越来越多，有了好的模型和算力，拿它“炒菜”，就能炒出好菜。</p>\n  <p>今年vibe coding起来后，模型已经足够聪明。金融资产管理、医疗（诊疗、制药）、教育等都在出AI新应用，他们利用大模型的底层能力，显著提高了产品体验，正在给用户带来效率价值。</p>\n  <p>这有点像移动互联网的2011、2012年，移动网络铺好了，字节、快手、小红书就该出来了。</p>\n  <p><strong>「暗涌」：去年投应用特别热，今年上半年很多人说不投应用。下半年风向又变了？</strong></p>\n  <p><strong>张鸣晨：</strong>跟着模型能力走。模型变强了，大家就担心“应用”会被整个吃掉。但其实不是的，很多场景能产生独立的应用层，有自己的价值。所以哪个市场大，就先做哪个，里面可能会出现一个或几个超级应用。</p>\n  <p>我们跟模型公司离得很近，认知可能比市场领先半年到一年，所以看起来我们老跟市场反着来。</p>\n  <p><strong>「暗涌」：你怎么判断，哪类应用不会被通用模型吞掉？</strong></p>\n  <p><strong>张鸣晨：</strong>看整个工作流里，有没有human in the loop。只要最后需要人来决策，或者必须有人提供反馈，这类场景就有独立存在的空间。像吃药、开刀，最后还得由医生拍板；而且没办法给出非常清晰的奖励函数。</p>\n  <p>如果全过程AI都可以主动运行，结果又能明确判断0或1（对与错），比如coding、数学，通用模型就可以不断获得反馈、自主迭代进化，做得非常好。这些场景很可能被模型吃掉。</p>\n  <p><strong>「暗涌」：模型能力仍在往上走。现在这些创业团队想解决什么问题、大机会在哪里？</strong></p>\n  <p><strong>张鸣晨：</strong>现在有一波Neo labs，想用新架构，把Transformer的效率提升很多倍，让模型更聪明，同时更省算力。</p>\n  <p>比如人脑是分区的，做不同任务会调动不同区域。神经网络里的参数，作用也不均匀。有一派研究员就在研究，哪些节点在什么任务里起作用，能不能把它识别出来，只激活1%的参数，就把任务解决了？还有一种思路，找到网络里的几个“超级节点”，通过改善这些节点，迅速提升整个网络的表现。</p>\n  <p>这些都很有价值。假如现在ChatGPT是120分，换一种架构，有没有可能迅速提高到150分。</p>\n  <p><strong>「暗涌」：回看移动互联网时代，你会反思那些错过吗？比如投了趣头条，没投今日头条；投了秒拍，没投快手。</strong></p>\n  <p><strong>张鸣晨：</strong>肯定会。既要选对赛道，也要选对赛手，核心还是把握产业的底层逻辑和规则。AI这一波，我们还是吃到了很大的红利。</p>\n  <p><strong>「暗涌」：你说终极目标是投到伟大的公司，对你自己而言，更底层的驱动力是什么？</strong></p>\n  <p><strong>张鸣晨：</strong>挣钱有很多条路。VC特别幸福的地方，是你可以通过好奇心获得顶级认知，用认知去做未来的事，去改变世界。这是一级市场最有意思的地方。</p>\n  <p><strong>「暗涌」：最有成就感的时刻，是自己的判断一步步得到验证？</strong></p>\n  <p><strong>张鸣晨：</strong>对。真的从零开始，像养孩子一样，一点点帮他长大。看到他做得很好，考上清华、北大，真正成才了，是这种感觉。我们真正创造了价值。</p>", "category": "tech", "published_at": "2026-10-28T02:25:15+00:00", "fetched_at": "2026-10-28T03:43:55.048356+00:00", "fingerprint": "6361e0773efe5d0d"}, {"source": "36氪 - 最新文章", "title": "接入AI半年后，一家自闭症康复机构辞了兼职督导", "url": "https://36kr.com/p/4044028040844417?f=rss", "summary": "<p>文 | 刘凌果</p>\n  <p>编辑 | 海若镜</p>\n  <p>教一个四岁半的孩子认识什么是苹果，要花多长时间？对自闭症儿童而言，这是个未知数。</p>\n  <p>欢欢坐在小板凳上，康复师将印有苹果图样的小卡，一张一张举到她的眼前：红苹果、蛇果、切开的苹果、咬了一口的苹果、苹果简笔画，她要辨认并回答，以上都是苹果吗？答对了会被康复师记作“+（加）”，反之记为“-（减）”。对普通孩子而言，这种相对简单的认知泛化能力可自然习得，但一些自闭症儿童可能需要上百次练习。</p>\n  <p>一堂30分钟的课程下来，康复师至少会进行30个问答回合，每回合可以视作一条行为数据。欢欢母亲告诉36氪，孩子一天需要上七节课，一周五天，全年基本无长间断。这意味着，大量带有明确“教学-行为-反馈”对应关系的数据，在这个过程中形成。</p>\n  <p>过去，这些数据主要用于让老师判断一堂课的完成情况。当前，它们被用于训练AI，成为一门新生意。</p>\n  <p>“把稀缺的督导经验，产品化、规模化输出。”特需儿童康复企业大米和小米研发副总裁王占伟表示，2023年下半年，随着各家基座模型陆续推出，利用公司积累的儿童康复过程数据训练模型，并将其嵌入机构中评估、排课、教案生成等工作，开始具备可行性。随后，大米和小米联合亚马逊云科技，定制了AI系统。目前，该系统已在近100家直营门店及300余家合作机构中使用。</p>\n  <p>在河南平顶山，一家特需儿童康复机构于今年1月接入AI，半年后，负责人宋文涛表示，已辞退此前外聘的兼职督导，因为AI已可以承担督导的部分工作，成本也更低。</p>\n  <p>在自闭症康复机构中，康复师更多是督导方案的执行者，负责直接给孩子上课；督导则需有多年一线康复师工作经验，具备评估孩子情况，确定干预课程等“高阶”能力。</p>\n  <p>一名康复师成长为合格督导，需要至少三到五年的时间。但缺少专业支持的康复机构却难等很久。当前，AI正以“督导”的角色，进入长期缺人的特殊康复赛道。</p>\n  <h2><strong>三四线城市开始买单</strong></h2>\n  <p>家住河南平顶山的欢欢，三岁时经医院确诊自闭症后，家人也曾考虑送她去省会郑州接受康复训练，但“一个月（医保报销完后），得花一万多。”欢欢母亲提到，除却课时费，加之租房、交通、全职陪护等成本，家里难以负担。</p>\n  <p>同时，她表示，郑州头部自闭症康复机构康复师和督导人手紧张，孩子一天只能排上三到四堂课，“还得额外找小机构加课，一节课都三四百。我琢磨着，一个月没3万下不来。”权衡之下，欢欢最终留在平顶山接受康复训练。</p>\n  <p>留下来是迫于现实，但家庭对专业康复训练的需求仍旧强烈。事实上，这种需求近年来还在持续上升。随着筛查评估的覆盖面拓宽，过去未被识别的自闭症儿童，正更多地走进康复体系。</p>\n  <p>“从2019年开诊至今（2025年），我们的孤独症专病门诊的门诊量逐年增加，现在年门诊量已经从300人次左右增至约3000余人次。”北京安定医院儿童精神科副主任医师戚艳杰在接受媒体采访时曾提到。</p>\n  <p>中国疾控中心2026年4月援引国家卫生健康委筛查数据称，我国儿童自闭症患病率约为7‰，自闭症总患病人群超过1400万。</p>\n  <p>这种需求传导至供给端，促使康复机构迫切希望填补人力空缺、提升服务质量。但专业能力建立在经验之上，而经验“急不来”，行业的人才缺口也因此长期难以填平。“1个康复师平均每天给4到6个孩子上课，1个督导可能要督五六十个个案。”大米和小米资深督导郑恬提到。</p>\n  <p>引入AI前，宋文涛曾外聘持有BCBA（国际认证行为分析师）证书的兼职督导。据他回忆，外聘督导每月提供1-2次线上教学，年聘用费用达十几万元。但由于其授课时间有限，覆盖个案量不足，更无法持续跟踪单个孩子的变化，效果不尽人意。</p>\n  <p>AI的“补位”恰逢其时。</p>\n  <p>填缺口是一方面，另一重意义，是让机构的服务更具差异化。宋文涛介绍，在平顶山等三四线城市，受限于专业人才供给，各家儿童康复机构服务质量相近，过去主要依靠降价竞争。引入AI后，宋文涛在原有每节40元、60元的课程之外，增加每节80元的AI课程，目前约有30%的家长报名。</p>\n  <p>近两年，宋文涛旗下的机构扩展至十家。他表示，后续会让所有机构用上“AI督导”，帮助新人康复师快速上手、标准化教学，让各店服务质量更一致和稳定。</p>\n  <p>降成本、提客单价、拉开服务差距、有利于标准化扩张，共同构成AI进入康复机构的入场券。</p>\n  <p>沿着付费链条继续向下，家长是最终的买单方。而家长的付费意愿主要取决于AI能否给孩子带来实质性康复进展。当前，据大米和小米提供的一项对照研究，三家第三方机构的65名儿童接受三个月干预后，AI介入组儿童在社交互动、语言沟通、认知和模仿等五个领域的进步均优于普通干预组。</p>\n  <p>这些变化是如何发生的？</p>\n  <h2><strong>AI更早“懂”孩子</strong></h2>\n  <p>AI与孩子的第一次见面，是在评估中。</p>\n  <p>评估类似于针对儿童能力发育的“体检”，与医院诊断的区别在于，不是下诊断结论即可，而是摸清楚孩子具体会什么、不会什么、为什么不会？目的是指导下一步干预。</p>\n  <p>郑恬解释，一个孩子“不会说话”，可能出于沟通意愿不足、无法模仿口部动作、听不懂指令，也可能是能听懂却不知如何表达，只有进行细致评估后，才能“对症下药”。</p>\n  <p>此前，康复师通常要耗费数周时间，对孩子的各项能力逐一测试。再由督导分析行为数据，手动“敲”完长达十来页的报告。当下，在AI的参与下，单论报告撰写时间，由至少三个小时缩短至数秒：康复师在测评过程中，同步将孩子的反馈录入平板，测评结束时报告随之出炉，督导只需在此基础上审核、完善。</p>\n  <p>欢欢母亲提到，通过AI评估发现，实际年龄四岁半的欢欢，发育水平只达到三岁半的标准。这“一年”的差值，就是欢欢需要通过康复训练赶上的。</p>\n  <p>王占伟解释，AI会先从孩子的实际年龄出发，测试其能否完成对应阶段的项目；如果无法完成，便逐级向下寻找，直至确定能力基线，再据此确定孩子的IEP（特殊儿童个别化教育计划）。</p>\n  <p>海外也有类似探索。2024年，美国康复技术公司TheraDriver团队利用617名2—14岁自闭症儿童的评估表、诊断报告、家长访谈等资料，训练AI识别需干预的行为和待学习的技能，并生成个性化治疗方案。随后，经随机抽取6名儿童案例进行检验，发现AI生成的方案与督导的高度接近。</p>\n  <p>但IEP更接近一份待完成的“技能点”清单，具体先学什么、后学什么，同样关键。一份“完美”的课表，得在遵循儿童发展规律的基础上，兼顾孩子的长短期目标、短板、优势等多重要素，难度不言而喻。“即便孩子每天来三个小时，一周来5天，不可能要求孩子IEP中要掌握的数十甚至百来项技能一下子同时推进。AI则可以告诉你，这些技能中，哪些应该先教，每天建议练习多少回合才能让孩子尽快掌握。”</p>\n  <p>操作中，康复师可直接在对话框中输入孩子的上课频率、训练时长等基础信息，以及喜欢小车、吹泡泡、挠痒痒、举高高等个性偏好，甚至包括家长重点关注的特质等“场外因素”，由AI综合分析后，出具康复方案。</p>\n  <p>正式开始训练课程后，个性化的教案和教具生成，更是AI的“绝对领域”。仍以“认识苹果”为例，自闭症儿童可能刚学会认识树上的苹果，转头就认不出被摘下的苹果。为了确认孩子真正掌握一个概念，从前老师需要用搜索引擎获取各异图片后，打印、裁剪、塑封、整理。现在，AI让范例的获取变得极其便捷，各式各样的苹果“一键获取”。</p>\n  <p>不过，这也是通用大模型完全可以实现的功能。对此，王占伟解释区别在于：通用大模型给出的是一般性通用范例，而大米和小米AI始终基于这个孩子过去所有的干预情况以及专业数据库信息，给出独属于这个孩子的“定制范例”。例如AI会判断，到底是哪种变化，让这个孩子突然又无法认识苹果了，并针对性训练。</p>\n  <p>类似的，AI还可以根据孩子的照片和康复目标定制绘本；对于害怕陌生环境的孩子，老师可以将机构大门、教室和厕所融入故事，帮助其提前熟悉环境；在集体课上，AI能根据人数、能力基础和训练目标层出不穷地设计新游戏。</p>\n  <p>自闭症儿童的康复周期往往以年为单位，每上完一堂课，孩子可能都会有细微的变化。这些不易被察觉的微小改变，被AI捕捉后，会不断强化其对孩子的“理解”；再类似“实时定位”的导航，告诉康复师下一步该做什么。此外，就算康复师离职，对孩子的跟踪记录也已被AI完整留存。</p>\n  <p>另一个很需要“导航”的是家长。由于接受干预的自闭症儿童年龄普遍较小，且不善交流，家长对孩子的具体情况过去往往了解不足。去年底，在给欢欢报了AI介入的课程后，欢欢母亲提到，最直观的感受就是“目标更清晰了”。例如，家长能在平板上看到，孩子在声母“k”的发音上掌握度达80%等信息。</p>\n  <h2><strong>回到人的世界</strong></h2>\n  <p>对这个长期依赖人力和经验的行业而言，AI已证明自己能辅助承担多项任务。但这是在专业人才供给不足的前提下，从无到有的填补，并不意味着其必然全方位优于与孩子有丰富接触、相处经验的专业督导。</p>\n  <p>“AI可以提供丰富的互动游戏、活动思路，让老师在此基础上进一步优化上课方式。”郑恬提到，但一套由督导精心打磨的课程，在创新性、临场适配上，不一定输给AI。毕竟，AI与孩子总有“时差”，康复师是与孩子真实互动、建立情感联结的那个人。这与康复的目标本身也契合：让孩子能更自在、舒适地回到“人的世界”。</p>\n  <p>当前，AI更直接的价值，仍是提升康复师、督导的工作效率，充当“超级辅助”的角色。更少的案头工作，“身兼数孩”的督导就能挤出更多时间陪伴难以适应课堂的孩子、当面指导康复师的教学方式、安抚因孩子近日未有明显进步而焦虑的家长，让人的专业能力回到最不可被替代的环节。</p>\n  <p>这个“超级辅助”的能力上限，依赖于康复师持续的“新数据投喂”。郑恬在给中小机构培训时发现，由于许多康复师此前没有逐回合记录的习惯，即使机构引入AI，也难以做到完整数据的录入。长此以往，AI可能“跟丢”目标。</p>\n  <p>那么，在数据充足的情况下，AI能否真正代替康复师下判断呢？</p>\n  <p>目前答案也仍是不能。王占伟表示，AI生成的内容都会由人工进行审核把关，才会进入实际流程。一次，AI判断欢欢已掌握某个训练项目，可以进入下一目标，康复师却认为她还需要继续巩固。</p>\n  <p>欢欢母亲表示，她觉得AI并没有真正坐在孩子对面，与孩子有眼神、语言、情感交流，所以自己更信任老师的判断，“AI给一点，督导老师再给一点，我感觉那就更好了。”</p>\n  <p>吃饭、睡觉、做游戏、出行等日常生活同样是孩子天然的“训练场”。当前许多公司都在针对性开发居家干预类产品。例如让孩子通过平板，与AI一问一答，反复练习看图识物，在打招呼、借东西、轮流游戏等模拟场景中学习社交技能；将AI装进毛绒萌物具身智能机器人，当孩子哭闹、烦躁、低落时，机器人主动发起交流，给予及时的情感支持；让家长通过APP，直接就棘手问题线上求教AI，并根据指导自行开展家庭训练。</p>\n  <p>欢欢母亲表示，自己很乐意尝试此类产品，但主要顾虑在于，自己在家给欢欢上课时，“她根本都不理我，都不觉得我是老师，就觉得我还是妈妈。”AI进入自闭症康复，可以当“老师的老师”、“家长的老师”，却仍难以代替人，与孩子建立真实的关系。</p>\n  <p>未来，机器人或许也能坐在孩子面前，举起一张小卡，问一句“这是苹果吗？”但孩子会愿意抬起头、面对注视，并给出回答吗？这仍未可知。</p>\n  <p>（应受访者要求，文中欢欢为化名）</p>", "category": "tech", "published_at": "2026-10-28T02:33:44+00:00", "fetched_at": "2026-10-28T03:43:55.048349+00:00", "fingerprint": "926e1a35380cb2c6"}, {"source": "36氪 - 最新文章", "title": "从濒临破产到成为独角兽，xTool还在等待「大结果」", "url": "https://36kr.com/p/4044945806726023?f=rss", "summary": "<p><strong>文丨</strong>张子怡</p>\n  <p><strong>编辑丨</strong>袁斯来</p>\n  <p>作为一家在硬件圈名声仅次于拓竹的公司，xTool有些过于低调。</p>\n  <p>普通人或许并不熟悉它的产品，也很难想象，它靠激光雕刻机这类细分产品，一年做到20亿营收。</p>\n  <p>今年年初或许是xTool最辉煌的时刻。它在港交所递表，成为少数走到上市阶段的硬件创业公司。当拓竹暂时没有上市进展时，投资人期待着xTool成为“下一个Insta360”。</p>\n  <p>故事接下来的转折让人意外。硬氪多方验证了解到，由于架构的原因，xTool赴港上市进度受到过一定影响，但已再次秘密递表。</p>\n  <p>xTool创始人王建军对这种起落并不陌生。</p>\n  <p>xTool的前身Makeblock曾是steam教育类公司中的明星企业，2021年却濒临破产，账面不过千万元。最困难时，王建军带着团队到处路演，还想竞标一家投影公司的海外电商代理。</p>\n  <p>王建军顶着内部从上到下的压力，推出桌面级激光雕刻切割一体机D1，该款机器让公司营收跨越至数亿元，又用不到四年时间，靠着几款细分赛道的产品，长成营收20亿的独角兽。</p>\n  <p>但对中国硬件创业公司而言，蓝海只会存在很短暂的时间。xTool也无法逃开凶狠的围猎。</p>\n  <p><strong>根据xTool招股书，其2025年前三季度的同比增速出现明显下滑。不过硬氪了解到，xTool营收第四季度有所回升，2025年全年收入同比增长超过30%。今年上半年，xTool收入增幅约80%-90%。</strong></p>\n  <p>这并不意味着xTool可以安枕。</p>\n  <p>“赛道涌现出相当多竞争对手，一下绷紧了神经。”一位投资人告诉硬氪。</p>\n  <p>反常识的是，xTool的竞争对手根本不是同类友商。在数位投资人看来，3D打印、CNC都有部分替代甚至取代激光雕刻产品的可能。2025年初，拓竹就发布了一款集3D打印、激光雕刻切割、数控刀切和绘图于一体的设备。</p>\n  <p>拓竹显然尝到了甜头。其于今年9月正式发布消费级CO₂激光切割机R1，最低价格为2499美元，xTool类似产品价格为3000美元左右。显然，拓竹将直接狙击xTool，成为它最强大的竞争对手。</p>\n  <p>xTool的崛起和当下遭遇的围攻，如同硬件行业一个寓言。它代表一个优秀创始人带领公司在小众赛道能做到的极致。残酷之处也在于此：在全球硬件制造中心，爆款只是个开始，接下来是一场永无止境的逆水行舟。</p>\n  <h3><strong>01 绝境的背水一战</strong></h3>\n  <p>灵感不一定是成功的源起，但绝望常常是。xTool成功其实是一场险胜，而王建军展示出出色的判断力。</p>\n  <p>他是一个头脑很灵活的人。硕士毕业，王建军到深圳上班，不到一年就辞职，“带着个背包就钻到硬件孵化器里去了。”一位行业人士回忆。</p>\n  <p>王建军出于兴趣创立了一家硬件公司Makeblock。那是2012年，离“万众创业”还有三年，王建军已经跟着孵化器去硅谷参加demo day。他上过Fast Company杂志，拿过红杉、TMC的投资，2020年时公司估值已经到了30亿。</p>\n  <p>没人想到，一年后，Makeblock会因为疫情叠加双减濒临破产。</p>\n  <p><strong>“账上真的只有几千万，公司基本上没有正向收入，一直在烧以前投资人的存款，真的是背水一战。”一位前员工回忆。</strong></p>\n  <p>员工很难体会王建军承受多大的压力。“因为在他身上很难看到真正的疲惫或情绪不稳定。”他们只是发现，老板变了，“他说他再也不从他自己的梦想里去想出路了，得从商业机会里去找。”</p>\n  <p>王建军做了各种尝试。至今你都能在xTool的Kickstarter上看到低谷期做过的产品，包括儿童机器人、无人机配件。这些产品的表现并不尽如人意。</p>\n  <p>更多时候，王建军在花时间研究海外的数据营销工具。他用插件在亚马逊站内找不同品类的搜索量，最后发现激光产品销量不错，而且基本都是质量不高的白牌。这意味着，整个激光赛道还没有出现品牌卖家。</p>\n  <p>然而，当王建军提出要做激光产品时，所有人都反对。因为创客工场在2019年推出过激光盒子（Laser box），“一个月卖不了几台，还会经常坏。”上述前员工回忆到。</p>\n  <p>王建军眼中看到的是和员工不一样的图景。</p>\n  <p>相比Laser Box的时代，激光器那些年提升最大的是功率。类似计算机行业的摩尔定律，激光器每隔一两年功率会翻两倍，到2021年时，已经达到5瓦——这意味着激光器可以切割更硬的材料。</p>\n  <p>“xTool抓住了供应链（激光器合光技术发展）升级的机会，而且他们不是临时起意，而是有激光产品的研发基础。”Maker赛道的一位创始人告诉硬氪。</p>\n  <p>还有一点是对用户群体的把握。</p>\n  <p>王建军发现，消费级激光雕刻机的用户在当年是极客、创客，他们渴望动手的��趣。Laser Box失败，是因为它是个封闭盒子，看不到创作过程，但开放式的激光级雕刻机会有不同结果。</p>\n  <p>没人理解王建军的一意孤行，但因为他在公司的绝对话语权，产品还是以很快的速度推进。</p>\n  <p>2021年，xTool第一代产品D1上市。这是一款开放式、主打5w和10w的蓝光激光雕刻切割一体机，虽然从现在的标准看功率不大，但当时的D1凭借坚固的铝合金结构和高精度的钢轮导轨，在海外DIY圈子里积攒了极高的口碑。直到去年年初D1停产，还有Youtube博主感慨，他21年购买的D1，五年中都没有出现过致命硬件故障。</p>\n  <p>靠着这一款产品，Makeblock账上多了3个亿。而王建军对团队要求很简单：要快，更快。</p>\n  <p>2022年，xTool发布三款产品，包括D1升级版，还有盒子式的激光刀切一体机M1和采用双光源技术的F1，整个公司营收以600%的速度增长。“感觉就是小小的几千万，忽然就变成了几个亿。”一位xTool前员工回忆。到2023年，xTool推了四条产品线，销售额跨过10亿。</p>\n  <p>xTool在当年不是没有对手，昂图、原子制造、嗨兴科技做消费级激光工具的时间比它早，却都没有xTool增长迅速。</p>\n  <p>xTool的早期员工、Maker赛道的创业者Tommy认为，让xTool远超同时期其他消费级激光雕刻公司的是王建军的“品味”。“他懂什么是好产品。”</p>\n  <p>大洋彼岸，美国顶级创业孵化器Y Combinator联合创始人保罗·格雷厄姆将品味视为一种务实的金融资产——一种不可复制的人类能力，即弄清楚什么能赚钱或吸引公众的注意。</p>\n  <p>行业里早期销量靠前的企业中，贸易出身的老板商业嗅觉很敏锐，很会卖货；工厂出身的老板，供应链整合能力很强，产品性价比很高，但这两者对产品的把控力都相对较弱。而当时很多用户是小B端用户，他们用激光雕刻机做商品售卖，对价格不一定敏感，但要求可靠性。</p>\n  <p>“可靠性不是能具体量化的概念，但它会体现在产品质量、产品体验和服务等因素里，它构成了用户对品牌的信任度，产品背景出身的公司强在这一点，它知道要花时间、花资源做好品牌，获得更高的溢价，再通过溢价继续巩固品牌的能力。”Tommy告诉硬氪。</p>\n  <p>显然，除了不去挣卖货的快钱，王建军还知道怎么去建立品牌。比如他以极快的速度搭建出xTool产品矩阵，形成M、P、S、F四条产品线，分别覆盖多功能入门、高功率加工、桌面通用和便携精雕等场景，产品形态也由开放式逐步走向全封闭、家电化和多光源融合。</p>\n  <p>这种打法极其聪明，“他们不用完全从零开始搞研发，而是建立在相对���整的技术和产品平台上，通过重新组合已有功能，快速推出面向不同细分人群的产品。”一家消费级激光雕刻公司的员工告诉硬氪。</p>\n  <p>有可靠的产品，又有完整的矩阵，这两者叠加，让xTool几乎重新定义了消费级激光雕刻机这个品类。</p>\n  <p>“如果你去Google上搜3D打印，3D打印本身是数据最高的，其次是拓竹，但你搜激光雕刻，xTool的热度甚至超过品类热度了。用户心智到这种水平的品牌，我觉得还是没有其他家的。”一位投资人分析。</p>\n  <h3><strong>02 失去的一年</strong></h3>\n  <p>王建军以革命者的姿态，彻底改造了消费级激光雕刻赛道。</p>\n  <p>但很快，xTool陷入经典的创新者窘境中。</p>\n  <p>扶持xTool的崛起的主要功臣，是大量小B用户。在没有阿里巴巴和中国工厂的海外，个人手工工作室、Esty卖家生产产品，主要在自家车库。3D打印机和激光雕刻机是这群人必要的生产工具，这帮核心用户是xTool营收从数亿涨至数十亿元的关键。</p>\n  <p>而硬件公司要从独角兽长成巨无霸，必须从B端破圈到C端。最典型的是拓竹，它的客户早已不局限于打印农场和工作室，无论是一级市场还是拓竹自身，对未来的描摹，都是成为家庭创意娱乐设备。</p>\n  <p>“就和小霸王游戏机一样。以前每家有一个游戏机，未来可能家长会说别玩游戏了，来用3D打印机打打东西。”一位投资人分析。拓竹百亿美金估值，正是建立在如此广阔的想象之上。</p>\n  <p>然而，xTool尚未能找到破局点。</p>\n  <p>“2024年我们已经得到了一个结论——激光工具的增长开始乏力，市场已经在饱和。除非能带来像3D打印行业基点式技术突破和爆发。”xTool的前员工回忆称。</p>\n  <p>很难说xTool没有做过尝试。整个2025年，xTool推出了六款产品，横跨三个品类，产品包括激光雕刻切割机、DTF服装打印机，还有激光焊接机，售价从2000美元跨到1万美元，</p>\n  <p>那段时间，xTool有些乱了阵脚，在摸索着激光雕刻以外的产品线。</p>\n  <p>“市场教育有些做不过来，价格又太高。”上述前员工回忆。</p>\n  <p>与此同时，2025年也是xTool尝试加速资本化进程的一年。</p>\n  <p>xTool的投资人已经等它等了太久，转型成功是意外之喜，IPO摘果势在必得。更何况，那段时间，资本追捧的对象变成硬件。Maker赛道被热捧，竞争更激烈。</p>\n  <p>去年上半年，涂鸦智能前CFO刘尧加入xTool，负责财务等相关工作。其内部彼时也经历着业务组织调整。王建军在当时开始闭关、集中全部精力搞新品。</p>\n  <p>回过头看，2025年王建军也有过决策失误，比如放过了UV Printer——这是一种利用UV光固化特殊油墨，在物品上印刷图案的机器。很多海外用户喜欢用它来做文化衫。</p>\n  <p>2024年，xTool内部曾经讨论过UV Printer，王建军并不重视。他没有解释太多原因，整件事不了了之。</p>\n  <p>直到2025年盛夏，安克eufymake的UV Printer在Kickstarter上拿下了4676万美元众筹，创下历史记录。</p>\n  <p>外界难以知晓，面对eufymake的成功，王建军是否有过后悔，他也没有对旁人表露过太多心绪。</p>\n  <p>唯一能够看到的是，xTool成为了追随者，在2026年也推出了一款UV打印机。而且在xTool的招股书里，打印线成为了公司的第二业务增长曲线。</p>\n  <p>在2025年一次采访中，王建军曾说：“我们清楚意识到，众多竞争者正在涌入这个领域。要保持领先地位，首要策略是速度制胜......其次就是创新，这需要巨大的资源投入和风险承受能力。某些尝试可能会失败，但只要引领趋势的突破能成功就够了。”</p>\n  <p>只是，xTool似乎没能找到第二个足以“引领趋势的突破”。</p>\n  <h3><strong>03 另一种解法</strong></h3>\n  <p>当C端迟迟看不到爆发，xTool将部分力量转移到了大B端市场。</p>\n  <p>KA用户是xTool过去一直想拓展的用户群体，但零售商对设备的易用性，稳定性有很高的要求，xTool此前没有找到合适的切入口。</p>\n  <p>直到今年xTool推出紫外激光雕刻机F2 Ultra，才算真正刺入该市场。</p>\n  <p>相比传统蓝光激光，355nm紫外激光的波长更短、热影响更小，可以精细加工塑料、玻璃等过去较难处理的材料。过去，因为这种机器的激光器和光学系统成本更高，整机稳定性和材料工艺调校难度大，以至于少有企业能做消费级紫外激光雕刻机。</p>\n  <p>以冷加工为主的F2 Ultra很适合消费电子、零售定制等对材料种类和加工精度要求更高的商业场景。</p>\n  <p>硬氪了解到，F2 Ultra让xTool打开了国内的大客户渠道，合作的客户包括华为、史丹利、星巴克等</p>\n  <p>xTool一家友商的员工告诉硬氪，在KA渠道拓展上，xTool卖的不只是设备，而是一整套适配客户场景的解决方案。“比如进入华为门店后，xTool会针对华为在售产品提前测试雕刻参数，并把相应方案预置到软件中，门店用户可以直接选择对应产品完成雕刻。”<strong>据他了解，这套紫外激光雕刻解决方案的整体售价约为3.7万元。</strong></p>\n  <p>这降低了门店员工使用设备的门槛，也让激光雕刻从一台需要专业调参的机器，变成可以直接嵌入零售场景的标准化服务。</p>\n  <p>硬氪了解到，在拓展KA客户的方式上，xTool常采取先试点、再复制的方式：先在少数直营门店验证设备和方案，再借助品牌方的渠道体系向加盟店推广，由后者自行采购。</p>\n  <p>KA客户的拓展也会形成示范效应。<strong>上述友商的员工测算认为，KA渠道拓展在今年至少为xTool贡献了4亿元营收。</strong></p>\n  <p>但xTool还没有摆脱增长的困扰。对消费硬件公司而言，它们必须出击主流市场。而这也是很多公司最难跨越的生死鸿沟。</p>\n  <p>过去，xTool的消费级激光雕刻机普遍定价在7000元+，比同类产品普遍要高出10%-30%。中高端是xTool一直以来的产品定位。但今年，xTool推出了3000元起的激光雕刻机M2。</p>\n  <p>其实，根据硬氪了解，中低端产品已经在xTool内部酝酿数年，只是此前受限于供应链成本和内部对产品的硬件要求，无法把价格做更低。</p>\n  <p>xTool M2的产品经理则表示，M2所瞄准的DIY用户群体，是公司始终想拓展的用户群，只是此前能力不具备。“这类用户基数很大，他能给我们品牌带来更多的影响力，你不可能对这么广泛的用户群体熟视无睹，这是很大的傲慢。”</p>\n  <p>xTool的一位投资人也认为，价格是关键。激光雕刻机通往普及的路上，单品必须做到500美金以下，做不到这个价格没法推广。</p>\n  <p>xTool显然下了决心。过去，xTool没有太刻意控制成本，而M2是第一款先定价格底线，再倒推设计的产品。</p>\n  <p>对供应链成本的了解也是xTool能顺利研发出平价产品的基础。“我们比过去更清楚自己自己设计出来的一颗零件到底多少钱。”M2产品经理告诉硬氪。</p>\n  <p>例如，为了压低价格，xTool用模块化架构的设计，3000元的起步价下，用户自由选择彩印、加工的功能模组。为了让用户拆装模组方便，xTool将螺丝改为磁吸固定，同传统的螺丝拆装相比，磁吸的方式更便于拆卸。</p>\n  <p>当然，xTool能实现平价产品的研发，不只是系统地运用过去做中高端产品的技术，也提升了内部组织管理。</p>\n  <p>硬氪了解到，过去两年，xTool内部专门做过一轮成本管理培训。消费硬件公司里，研发和采购价格往往存在信息隔离。在那轮成本管理中，xTool曾短暂向研发开放物料成本信息，再将成本意识落实到各个职能部门。</p>\n  <p>降价作为最简单有效的手段，很快拿到了好结果。目前，xTool M2已是天猫店铺雕刻机交易榜中的Top1。</p>\n  <p>故事走到这里，仿佛迎来圆满结局。</p>\n  <p>然而，xTool未能回答的问题是：为什么消费级激光雕刻机市场中，头部的只有它一家？为什么投资人都不再看这个赛道。这究竟是投资的偏见，还是激光雕刻行业不良信号的号角。</p>\n  <p>XTool当然是细分赛道的绝对头部，有品牌、有品味，现阶段无论是xTool还是虎视眈眈的对手，都无法突破技术本身的瓶颈。</p>\n  <p>激光工具与3D打印机不同——雕刻和切割过程中必然产生烟尘与异味，用户必须额外配置排烟净化设备，这不仅推高入门成本（一套合规的排烟系统往往占整机价格的20%-40%），也限制了使用场景（无法在无通风条件的公寓、办公室或家庭卧室使用）。</p>\n  <p>xTool显然意识到，现有激光工具类产品卡在激光雕刻行业走向大众化的拐点上。</p>\n  <p><strong>“你以为王建军不在意吗？但是这个大题解不出来。”上述前员工表示。</strong></p>\n  <p>CNC和3D打印都有可能渗透激光雕刻的市场。不少投资人都认为，前两者的市场空间比激光雕刻更大。</p>\n  <p>某种程度上而言，xTool已经在现有能力范围内，做了所有能够持续增长的事。</p>\n  <p>毫无疑问，xTool是一家优秀的公司，在硬件赛道是无可争议的成功范例。但它不能止步于此，它需要更破圈、需要更多爆品，让自己不会被拓竹这样的对手跨维攻击。</p>\n  <p>xTool过往成功，有创始人的决断、也有时代的红利。</p>\n  <p>王建军是典型的80后创业者，在最有激情的大学期间被乔布斯、马斯克的故事吸引，只身南下，又刚好赶上中国产业链产能溢出的开端。</p>\n  <p>他热爱和相信自己在做的事业，“我觉得王建军把创业当作游乐场在玩，他很享受做事。创业对他来说跟创造一样，是如此纯粹。”xTool的前员工告诉硬氪。</p>\n  <p>这种热爱伴随王建军14年的创业历程，让他在企业濒临破产之际仍不放弃，孤注一掷，最终起死回生。</p>\n  <p>而现在，在冲刺上市之时，王建军要尽快找到新的爆款市场，更广阔，更有想象力。这将是更艰难的破局。</p>", "category": "tech", "published_at": "2026-10-28T02:52:07+00:00", "fetched_at": "2026-10-28T03:43:55.048341+00:00", "fingerprint": "79d6e332fdda99d0"}, {"source": "36氪 - 最新文章", "title": "「微至航空」完成近亿元A轮融资，“云熊”累计飞行超12000公里，已获特许飞行证｜36氪首发", "url": "https://36kr.com/p/4044989810692999?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>“ 空中五菱 ” 正加速其在低空经济场景的落地。</p>\n  <p><strong>36氪获悉，经济型通用无人运输机研发制造商「微至航空」已完成近亿元A轮融资，由自贡市通航产业发展股权投资基金领投，航发基金持续跟投。</strong>本轮资金将主要用于新技术、新机型的研发试制，以及加速成熟机型适航取证进程和场景落地相关的市场拓展。</p>\n  <p>微至航空成立于2020年10月，专注研发和制造兼具“可靠性、实用性和经济性”的大型通用无人运输机，是36氪长期关注的企业。创始人兼总经理徐淳曾在独角兽企业担任运营副总，拥有10余年上市公司运管经验，也曾经历过两段不太成功的科技创业，是一位连续创业者。</p>\n  <p>其拳头产品云熊系列WZ500定位为“低空领域的五菱宏光”，简单来说就是要“皮实、耐用，还不贵”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_0a299e64b5984cb197ade648300f3d20@577536001_oswg833384oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云熊WZ500</p>\n  <p>第一代云熊系列WZ500由微至航空全自主正向设计与研制，<strong>在标准载重500公斤的情况下，满载航程超500公里，机舱容积超5m³，可容纳至少两个GJB1918A-2015标准货盘。</strong>这个“双500”的量级选择，是理解微至航空产品定义和“特立独行”路线判断的一个切入点。</p>\n  <p>在全球航空货运市场分层中，大于1000公里的干线主要由波音、空客、商飞的全货机、客改货以及客机腹舱解决；小于300公里的末端市场，更多、更有效的解决方案还是公路运输；而位于这两个区间段内的县域到枢纽，或县域、地级市之间的支线时效性运力，长期缺乏合适的生产工具，导致高端时效性快递解决方案空白，很多场景应用尚未开发。</p>\n  <p>这一被长期忽视的支线区间，并非没有需求支撑。</p>\n  <p>国家邮政局数据显示，全国快递业务量已从2021年的1083亿件增至2025年的1989.5亿件，五年间年均增长约15.4%。这其中，县域是核心增长引擎。</p>\n  <p>城乡对比上，2021年上半年农村快递业务量增速比城市高出10个百分点以上。国家邮政局发展研究中心战略规划研究部主任刘江2023年亦指出，“快递进村”成效显现、农特产品加快上行，农村业务量增速明显高于城市。区域结构上，2024年前三季度中西部快递业务量377亿件、同比增长34%，内蒙古、陕西、甘肃增速均超40%，远高于东部地区的14.9%。</p>\n  <p>县域业务量逐年上升，但供给端的产品和服务能力尚未跟上。</p>\n  <p>在徐淳看来，过往通用航空的成本结构并不适配物流企业：有人机改造的技术受限且空间利用率极低，大吨位无人货机极易陷入“大而重”的误区，导致适航难度大、安全可靠性验证周期长，单机经济性脱离实际。真实的商业运营落地遥遥无期，反而把近年来快递增速最快的县域支线需求留在了原地。</p>\n  <p>微至航空瞄准的就是这一仍处于探索阶段的低空支线时效件货运市场。</p>\n  <p>落到产品层面，<strong>云熊系列WZ500的思路不是争单项的参数第一，而是用产品定义、工程化能力尽量压低综合持有与使用成本，从而加速落地。</strong></p>\n  <p>一是在产品定义端不做“无用功”。徐淳提到，“我们不盲目追求纸上谈兵的‘单项指标主义’，而是反向兼顾客户需求、承受能力和产业链成熟度，先从运力痛点集中的‘双500’档位切入，一代产品验证成熟后再伴随市场发展逐步迭代。”</p>\n  <p>二是坚持100%正向研制与飞控等核心自主可控。“微至坚持独立思考、实事求是，拒绝抄袭与逆向仿制，从源头降低安全漏洞和知识产权风险，并大幅压缩中长期迭代成本。”</p>\n  <p>三是跨界打通产业链，整合无人机、通用航空与汽车工业三条供应链。这一模式不仅能够削减冗余零部件，共享设备、空间与人才，获取产能协同，还可进一步降低BOM成本。</p>\n  <p>换言之，云熊系列WZ500更像是用“汽车工业”的成本逻辑和供应链重新做了一遍，目标是把大型通用无人运输机做成客户“买得起、飞得起、养得起”的产品。“要做到行业性价比的最上限，成本的合理下限。”微至航空创始人徐淳此前提到。</p>\n  <p>反映到成本和定价层面，<strong>云熊系列WZ500整机成本可以做到同类竞品的1/5，单套飞行平台（基础版）控制在500万元以内，综合费效比控制在2.5-4.5元/吨公里区间。</strong></p>\n  <p>运营侧设计同样降低服务门槛，特殊情况下400米滑跑距离即可起降，极端条件下支持二级公路、草地等简易条件，全系统能在3小时内完成标准集装箱式收纳与展开撤收，方便偏远、有季节性需求或基础设施较差的地区实现“调机快运、拆装即走、展开即飞”的灵活部署需求。</p>\n  <p>据团队介绍，云熊系列WZ500今年已陆续完成高原零下30摄氏度、海上湿度95%、戈壁沙漠、战备公路起降，民航运输机场隔离飞行等风险科目测试。</p>\n  <p>截至今年5月，<strong>云熊系列WZ500累计飞行里程已突破12000公里。</strong></p>\n  <p>一个最新进展是，近期民航主管部门已正式向云熊系列WZ500颁发民用无人驾驶航空器特许飞行证，批准其在4个机场开展演示及试验飞行。这意味着该款机型在设计、制造、系统可靠性与运行安全性得到了阶段性认可，能够进一步加速产品验证及适航取证进程。</p>\n  <p>商业化层面，据悉微至航空目前已签署的采购意向升至158架，公司正与头部央企在海南自贸区开展大型无人运输机跨海运输试点筹备，另有三条试点航线也已获批。</p>\n  <p>低空经济已明确“先载货、后载人”的发展节奏，行业竞逐的路径愈发清晰。但从行业整体发展阶段来看，当下低空三段式物流的末端已经进入成本与盈利模式的验证期；支线端正处于技术成熟与产品验证加速、适航取证冲刺的投入期，而非规模化交付的产出期；干线端更是仍处在无人化的合理性与技术安全性、综合成本可行性的理论期。</p>\n  <p>微至航空如今身处的是一条正在加速、同时也变得拥挤的赛道，新一轮融资入账，对应的是加速迭代和取证的时间窗口。接下来，谁先把单机采购成本和日常运营成本尽可能压低，让服务价格既能落到最终消费者愿意为跨城时效件付费的水平，又能给快递公司留出利润，谁就更可能拿到真实的订单和复购。</p>\n  <p>据悉，随着第一代云熊系列WZ500的成熟，微至航空也将持续推进更大载重、更长航程产品的研发，以满足未来多元场景的应用需求。</p>\n  <h3><strong>投资人评价</strong></h3>\n  <p>自贡市通航产业发展股权投资基金：自贡市通航产业发展股权投资基金是四川省首支由市级设立的通航产业股权投资基金，总规模10.1亿元。本轮领投微至航空，是基金布局支线无人货运赛道的重要举措。自贡作为全省低空经济产业链主要承载地，将依托优越的空域资源与完备的产业链配套，助力微至航空在适航取证、商业航线拓展等领域协同攻坚，助推企业加快成长为国内无人货运行业头部企业。</p>", "category": "tech", "published_at": "2026-10-28T03:39:55+00:00", "fetched_at": "2026-10-28T03:43:55.048325+00:00", "fingerprint": "3b826479006adb6c"}, {"source": "少数派", "title": "一日一技｜NAS 作为 UPS 总控，实现局域网多设备断电自动关机", "url": "https://sspai.com/post/115855", "summary": "借助 NUT 网络 UPS 协议，我们只需要一台 UPS，就可以驱动局域网中多台设备协同断电保护。<a href=\"https://sspai.com/post/115855\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T03:02:18+00:00", "fetched_at": "2026-10-28T03:43:53.267401+00:00", "fingerprint": "322297666db89b9c"}, {"source": "少数派", "title": "Apple Sports：不看新闻、不聊球，只看我关心的比赛", "url": "https://sspai.com/post/117557", "summary": "作为一个从小看CCTV-5体育频道下饭的「体育迷」，在互联网时代我一般都看新浪门户网站的体育板块来获取最新的体育资讯，在智能手机逐渐普及后，百度贴吧、虎扑、懂球帝等平台又是我获取体育资讯以及和网友们吹 ...<a href=\"https://sspai.com/post/117557\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T07:27:57+00:00", "fetched_at": "2026-10-28T03:43:53.267394+00:00", "fingerprint": "dbfba1a7997a894d"}, {"source": "少数派", "title": "社区速递 163 | 金豪 59 调整版钢笔与九月派友剁手清单", "url": "https://sspai.com/post/117633", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/117633\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T09:02:00+00:00", "fetched_at": "2026-10-28T03:43:53.267388+00:00", "fingerprint": "5640c7f2d0283e44"}, {"source": "少数派", "title": "派早报：Apple 发布 M6 版 iMac 和 MacBook Pro 等", "url": "https://sspai.com/post/117684", "summary"
