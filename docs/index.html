85"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨八家上市公司集中公告“补税”；ChatGPT将迎来史上最大幅度升级；高考新增AI监考员，自动截取异常录像", "url": "https://36kr.com/p/3843764238174729?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>AI等机器网络请求量首超人类</p>\n  <p>瑞幸咖啡回应拿铁去冰仅半杯</p>\n  <p>宗馥莉自有品牌KELLYONE回归</p>\n  <p>多家低成本航空公司对登机箱登机收费</p>\n  <p>黄仁勋会见韩国两大游戏商代表共商游戏AI合作方案</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>八家上市公司集中公告“补税”&nbsp;</strong></p>\n  <p>6月1日至6日，不到一周内，八家A股上市公司先后披露补缴税款公告。这八家公司合计补缴税款及滞纳金约4亿元。其中，苹果中国最大授权经销商爱施德（002416.SZ）一家补缴3.08亿元，占八家总额的近八成，该公司披露，仅滞纳金就达1.23亿元。对部分公司而言，这笔补缴金额已接近甚至超过去年一整年的利润。如电子材料企业宏昌电子（603002.SH）需补缴4041.91万元，而公司2025年全年归母净利润为3537.17万元。</p>\n  <p>八家公司公告的核心表述一致——均已全部缴纳完毕，均不涉及行政处罚，均引用《企业会计准则第28号》认定不属于前期会计差错、不追溯调整前期财务数据，补缴金额均计入2026年度当期损益。但逐份比对可以发现，八家公司的补缴金额差距悬殊，启动自查的原因也不尽相同。（财经社）</p>\n  <p><strong>OpenAI正准备对ChatGPT进行上线以来最大幅度升级</strong></p>\n  <p>OpenAI正准备对ChatGPT进行上线以来最大幅度升级，此次升级也引爆了人工智能热潮。这家估值8500亿美元的集团计划在今年上市前寻找新的增长引擎。该公司打算将这款聊天机器人转型为“超级应用”，整合编程工具与人工智能智能体，新增多款高管认为能带来更高收入的产品。据十多位现任及前任员工透露，这些调整是OpenAI整体重组计划的一部分。这家总部位于旧金山的公司正调配资源，全力争取高利润企业客户，并与竞争对手Anthropic展开更激烈的竞争。此次调整将提升OpenAI编程产品Codex的地位并增加资源投入，反映出公司内部日益坚定的共识：人工智能的未来并非回答问题的聊天机器人，而是能为用户执行任务的智能体。（新浪财经）</p>\n  <p><strong>高考新增AI监考员：考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认&nbsp;</strong></p>\n  <p>6月7日，2026高考第1天。高考期间，各地运用智能巡查系统和智能安检门等科技手段，严防作弊。在北京市第二中学考点，考场贴出纪律提示，明确禁止携带智能眼镜进入考点；在广东广州，各考点重点增强了安检门对智能眼镜等隐蔽式穿戴设备的识别能力。AI智能巡查系统也在多地考场投入使用。考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认。（央视新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>京东与腾讯就AI Agent将达成重要合作</strong></p>\n  <p>6月7日晚间消息，京东与腾讯将围绕AI Agent展开深度合作。依托京东的商品供应链、履约服务能力及腾讯的生态入口优势，双方将共同打造跨场景的智能化服务新范式，推动AI Agent从单点应用走向生态协同。（新浪科技）</p>\n  <p><strong>多家供给方下调算力价格，算力普惠再提速</strong></p>\n  <p>随着全国算力基建规模化、标准化不断提速，多家算力价格也迎来持续普惠。让曾经昂贵的“高端稀缺资源”变身为各行各业可普惠使用的“数字水电”。前不久，多家模型厂商宣布永久下调算力价格，其中DeepSeek与小米MiMo降价尤为显著，最高降幅接近99%。极大降低了用户日常高频问答、网页设计、代码编程等多场景AI使用成本，让各类轻量化、常态化AI应用告别高门槛、高成本的制约。（央视新闻）</p>\n  <p><strong>OpenAI芯片元老“002号员工”转投Anthropic</strong></p>\n  <p>OpenAI自研芯片项目的“002号员工”Clive Chan在X平台发文宣布，自己已离开OpenAI，并于本周正式加入Anthropic。这一消息迅速引发业界广泛关注，被视为AI领域大模型竞争从模型、产品层面向芯片和算力基础设施层延伸的又一信号。Chan的履历令人瞩目，曾在OpenAI、特斯拉、谷歌、SpaceX等多家明星公司工作或实习，长期深耕AI基础设施。他于2021年毕业于加拿大滑铁卢大学，毕业后加入特斯拉Autopilot深度学习基础设施团队，在近三年时间里负责GPU优化、集群调度、数据中心软件及训练基础设施等工作。2024年1月，Chan正式加入OpenAI，担任技术团队成员，参与自研AI芯片项目建设。（新浪财经）</p>\n  <p><strong>AI等机器网络请求量首超人类</strong></p>\n  <p>全球最大的互联网托管服务商之一——云网络安全服务公司发布的最新数据显示，在其托管网站收到的网络访问请求中，约57.4%来自人工智能和自动化程序，42.6%来自人类用户。该公司称，这是互联网历史上来自人类的网络访问请求数量首次被机器超越。(央视新闻)</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小米机器人或将亮相小米17T发布会</strong></p>\n  <p>卢伟冰发布视频，探班小米17T发布会主讲人TJ的彩排，还送上保温杯和润喉糖。视频中出现了小米机器人的手臂，他们还一起碰拳加油，疑似小米机器人也将在发布会中亮相。（新浪财经）</p>\n  <p><strong>国际金价跌破4400美元/盎司关口，金饰克价一夜大降近40元</strong></p>\n  <p>当地时间6月5日，国际金价明显回调，跌破4400美元/盎司关口。受国际金价下行影响，国内品牌金饰价格同步回落。6月6日，周大福足金饰品价格报1323元/克，相较于5日1360元/克下跌37元；周生生报1315元/克，相较于5日1354元/克下跌39元；老凤祥报1316元/克，相较于5日1352元/克下跌36元，整体回落至2025年底水平附近。（央视财经）</p>\n  <p><strong>SpaceX IPO已获得2倍认购资金</strong></p>\n  <p>据两名知情人士6月5日透露，SpaceX本次IPO获约1500亿美元投资者认购资金，认购额度达募资计划的两倍。作为史上规模最大IPO，该认购热度已十分亮眼。知情人士提示，项目目前仍处于前期推介阶段，大型机构资金往往在IPO申购末期才递交订单，当前统计数据仅为意向申购，并非最终配售额度，实际获配数量将在定价环节敲定。（第一财经）</p>\n  <p><strong>年内32款燃油车降价</strong></p>\n  <p>乘联分会秘书长崔东树提供的最新数据显示，2026年1~5月，共有32款常规燃油车出现降价，较去年同期增加13款。纵观整个市场，今年1~5月降价规模为77款，较同期少4款。这意味着，常规燃油车降价车型数量整体占比超过40%且增速加快，带动大盘整体向下。从月度走势看，燃油车的降价节奏也有所加快。2026年5月全市场共有20款车型降价，较去年同期增加7款。其中纯燃油车型7款，较同期多5款；插混车型7款，较同期多4款。从降价力度看，常规燃油车的价格下调幅度同样处于高位。今年5月，常规燃油车新车降价车型均价为16.6万元，平均降价金额为2.5万元，降价幅度达到14.9%。今年前5月，总体乘用车市场新车降价车型均价24.1万元，降价力度算术平均达到3.2万元，降价力度13.1%。（第一财经）</p>\n  <p><strong>瑞幸咖啡回应拿铁去冰仅半杯</strong></p>\n  <p>6月6日，“瑞幸去冰不补液”一事引发消费者热议。有消费者反映，在瑞幸咖啡下单超大杯拿铁并选择“去冰”后，到手饮品仅勉强过半杯，店员解释称“公司标准配方固定，去冰不补液”。针对这一情况瑞幸咖啡方面回应称，已关注到近期关于产品“去冰”的相关讨论，公司对此高度重视。（新京报）</p>\n  <p><strong>宗馥莉自有品牌KELLYONE回归</strong></p>\n  <p>宗馥莉自有品牌KELLYONE悄然回归。KELLYONE近日推出新品果汁汽水—果然啵啵，售价每瓶为3元起，分为柠檬味、西柚味两种口味，销售区域暂限定于江浙沪。目前该产品已经上架叮咚买菜等平台，不过娃哈哈相关旗舰店并未上线该产品。KELLYONE是宗馥莉主导下宏胜饮料集团的自有品牌，“Kelly”为宗馥莉英文名，该品牌于2025年“娃哈哈风波”前后已停摆。近日，KELLYONE推出新品“果然啵啵”果汁汽水，也宣告着品牌重启。（财联社）</p>\n  <p><strong>多家低成本航空公司对登机箱登机收费</strong></p>\n  <p>近期，不少民航旅客反映自己携带20英寸“登机箱”乘坐飞机，却在登机口被拦，航空公司要求支付相应的行李费用才能把行李箱带上飞机，而且不同的航空公司执行的标准还不一样。记者搜索发现，旅客反映的情况主要集中在春秋、祥鹏、首都航空等低成本航空公司。业内人士介绍，目前中国航空公司大致分为全服务航空公司和低成本航空公司。所谓全服务航空公司，就是在票价里含有很多的服务项目。比如比较大的免费行李额、飞机上的免费餐食，以及航班延误后安排免费住宿等。而低成本航空公司则票价相对更低，但是行李、餐食等服务需要单独付费。行李差异化服务并非国内首创，在欧美市场不少航司也在推行，为不需要这些服务的旅客提供更加低廉的票价。同时专家也提醒，航空公司方面有义务做好相关的信息告知，而旅客在购票时也应该多注意航空公司的相关提示。此外，记者还尝试在多家主流在线旅游预订平台上搜索机票信息，搜索到的信息基本都有显示该价格所对应舱位的行李标准。部分平台显示有超限行李的收费标准，为旅客提供行李额的购买链接。（央视财经）</p>\n  <p><strong>富途老虎长桥之后，未被“点名”的华盛证券也将清理内地业务</strong></p>\n  <p>继富途、老虎、长桥之后，又一家跨境券商宣布清理内地存量业务。华盛证券于6月6日上午向客户发布的通知称，自北京时间6月15日起，华盛证券将对存量投资者账户在中国内地的服务进行相应调整：一是在中国内地交易服务：暂停股票等所有品种的新开仓、加仓交易，仅支持卖出、平仓操作；二是在中国内地资金划转服务：暂停资金及证券转入，转出功能保持正常。通知显示，此次调整是为落实2年集中整治期的行业监管要求，推动跨境证券业务规范发展，并强调本次调整不影响为存量投资者在境外提供服务，也不影响全体客户现有资产安全，客户可正常查询账户、持有及卖出已有持仓。这也意味着，除5月22日被中国证监会直接“点名”的3家券商外，部分中小券商也将开启存量非法业务整治。6月2日以来，老虎、长桥、富途已陆续发出相关通知，宣布自6月12日起对存量投资者在中国内地的服务进行调整。（第一财经）</p>\n  <p><strong>字节跳动：没有造车或推出汽车品牌的计划</strong></p>\n  <p>6月6日，字节跳动官微发布声明，我们注意到，近期有部分报道将“赛豆”解读为“豆包汽车品牌”或“字节跳动造车”：1.相关说法不准确，字节跳动没有造车或推出汽车品牌的计划。2.赛豆不是字节跳动或豆包推出的汽车品牌，字节和赛豆没有股权合作。3.豆包、火山引擎与汽车行业伙伴的合作，主要是给行业伙伴提供豆包大模型、智能座舱等技术服务，帮助合作伙伴提升车载智能交互体验。（每日经济新闻）</p>\n  <p><strong>网传比亚迪自研人形机器人代号“尧舜禹”、年内自用2万台，比亚迪否认</strong></p>\n  <p>日前，比亚迪自研人形机器人的消息引发广泛关注。网传其自研人形机器人代号“尧舜禹”，计划于2026年在内部部署2万台。对此，记者向比亚迪方面求证，对方表示：“‘比亚迪人形机器人代号尧舜禹’‘第七代原型机在深圳和长沙工厂实地测试’‘约150台上岗，目标年内自用2万台’等消息均不属实。”(每日经济新闻)</p>\n  <p><strong>百度成立数字人创新业务部</strong></p>\n  <p>36氪获悉，日前，百度MEG进行了新的一轮组织调整：合并商业部与电商事业部，成立大商业事业部，数字人创新业务部也升级为独立部门。此前5月13日Create 2026百度AI开发者大会上，百度正式宣布旗下数字人品牌慧播星升级为百度一镜，推出全球首个全场景多智能体数字人平台——集数字人直播、数字人视频、实时互动数字人于一体，并发布百度一镜海外版。截至2025年底，百度一镜数字人主播数已突破10万，服务30+行业。</p>\n  <p><strong>2026年度电影总票房已突破160亿元</strong></p>\n  <p>据网络平台数据，截至目前，2026年度电影总票房已突破160亿元。《飞驰人生3》《给阿嬷的情书》《镖人》暂列前三位。其中，影片《给阿嬷的情书》票房已超15.87亿元（含预售），并将于6月18日在中国香港、中国澳门、新加坡、马来西亚、文莱上映。同时，2026年暑期档已全面开启，目前已有超60部影片锁定暑期档，涵盖历史、科幻、青春、动画等多元类型，共同点燃夏日的光影热情。(央视财经)</p>\n  <p><strong>派瑞股份：公司股票被实施其他风险警示，6月9日起简称变更为“ST派瑞”</strong></p>\n  <p>派瑞股份公告称，公司收到证监会陕西监管局下发的《行政处罚事先告知书》，因公司2024年年度报告和2025年半年度报告存在虚假记载，根据相关规定，公司股票交易将被实施其他风险警示。公司股票自2026年6月8日开市起停牌一天，将于6月9日开市起复牌，股票简称由“派瑞股份”变更为“ST派瑞”，日涨跌幅限制仍为20%。公司已对相关财务报表进行会计差错更正，并启动财务内控专项提升行动。（财联社）</p>\n  <p><strong>优必选：优世界超仿生人形机器人首发预订单量累计超2110台</strong></p>\n  <p>6月7日，优必选科技宣布，旗下消费级人形机器人品牌优世界超仿生人形机器人首发预订单量6天累计达2110+台。（界面新闻）</p>\n  <p><strong>英伟达与SK海力士宣布多年期技术合作，共同开发下一代AI内存</strong></p>\n  <p>英伟达与SK海力士6月8日宣布建立多年期技术合作伙伴关系，围绕全球AI工厂建设所需的下一代内存展开联合研发，并将AI技术应用于半导体芯片设计与制造。根据协议，SK海力士将为英伟达Vera Rubin AI超级计算机、Vera CPU、RTX Spark PC及Jetson Thor机器人计算平台协同开发专用内存，由此进入英伟达正在开拓的AI基础设施、个人AI及物理AI等新市场。在半导体制造领域，SK海力士将采用英伟达CUDA-X库及PhysicsNeMo框架加速芯片仿真和光刻计算工作流；同时借助英伟达Omniverse和cuOpt构建晶圆厂数字孪生，推动工厂自主化运营。（界面新闻）</p>\n  <p><strong>科技“老登”重上AI牌桌，AI产业演进趋势重新定价</strong></p>\n  <p>近期，以戴尔、联想集团为代表的公司“老树发新芽”，不少传统公司正重回行情与投资的“C位”，并频频现身权益类基金的核心重仓名单。有分析指出，科技“老登”重上AI牌桌，这绝非一次简单的高低切炒作，而是机构投资者在深思熟虑后，对AI产业演进趋势的重新定价。多位公募基金人士表示，随着AI建设需求向更多细分领域深度转移，科技投资正逐步从主题驱动转向业绩驱动。在这个去伪存真的过程中，拥有坚实基本面兑现能力、能切实受益于产业生态重塑的“老面孔”，正迎来中长期估值体系的系统性抬升。（证券时报）</p>\n  <p><strong>京东方A回应存储涨价对显示行业的影响</strong></p>\n  <p>关于“存储涨价对显示行业的影响”的问题，京东方A在机构调研时表示，受存储涨价对消费电子冲击的影响，根据咨询机构预计，终端厂商与面板厂商在部分产品类别将承受一定压力。分产品类别来看，对笔记本电脑和智能手机终端需求有可能产生一定程度的影响；综合考虑TV面积需求增长等因素，对电视终端需求影响有限。（华尔街见闻）</p>\n  <p><strong>韩国投资者持续买入中国硬科技</strong></p>\n  <p>近期，韩国投资者正持续加码布局中国硬科技资产。数据显示，过去1个月，寒武纪、麦格米特、机器人ETF华夏、宁德时代等成为最受韩国投资者青睐的A股投资标的，AI芯片龙头寒武纪更是获得近2000万美元净买入。此外，多只在美上市的海外中国科技ETF也迎来资金显著净流入。多家外资机构认为，中国科技领域兼具高增长空间与估值优势，在全球资产配置中具备稀缺投资价值，海外资金正加速捕捉中国科技产业发展红利。 (上海证券报)</p>\n  <p><strong>黄仁勋会见韩国两大游戏商代表共商游戏AI合作方案</strong></p>\n  <p>据报道，英伟达首席执行官（CEO）黄仁勋7日在首尔江南区的网吧先后会见韩国游戏公司KRAFTON创始人兼董事长蔣柄圭和游戏开发商NCSOFT代表金泽辰。据悉，当天黄仁勋和蔣柄圭可能就物理AI等人形机器人，以及基于英伟达近期发布的首款AI笔记本电脑系列“RTX Spark”的游戏领域合作等进行讨论。KRAFTON长期与英伟达合作研发AI功能，并将其融入游戏之中。通过游戏结成的合作关系还推动了双方有关物理AI合作的讨论。KRAFTON主要高管去年4月访问英伟达位于美国加州的总部，同黄仁勋就包括机器人在内的新一代技术合作方向进行了探讨。在结束与KRAFTON高管的会面后，黄仁勋移步附近的另一家网吧，同金泽辰以及NCSOFT高层会面。黄仁勋还同金泽辰“闪现”网络直播，就游戏产业和AI技术的发展方向等交换意见。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>华恒生物：香港联交所审议公司发行H股并在主板挂牌上市申请</strong></p>\n  <p>6月7日，华恒生物发布公告，公司正在进行申请发行境外上市股份（H股）并在香港联合交易所有限公司主板挂牌上市的相关工作。香港联交所上市委员会于2026年6月4日举行上市聆讯，审议公司本次发行上市的申请。公司本次发行上市的保荐人已于2026年6月5日收到香港联交所向其发出的信函，其中指出香港联交所上市委员会已审阅公司的上市申请，但该信函不构成正式的上市批准，香港联交所仍有对公司的上市申请提出进一步意见的权力。（界面新闻）</p>\n  <p><strong>沪士电子、曦华科技递表港交所</strong></p>\n  <p>据港交所文件，6月5日，沪士电子股份有限公司向港交所提交上市申请书，联席保荐人为中金公司、汇丰；深圳曦华科技股份有限公司向港交所提交上市申请书，独家保荐人为农银国际。（界面新闻）</p>\n  <p><strong>AI时代年轻人生存小调查</strong></p>\n  <p>过去两年，AI真正进入我们的工作体系，有人因此效率提升，有人重学技能，也有人第一次感受到个人能力可能随时被重新定价。越来越多人开始认真学习AI、订阅会员、囤大量Prompt……但这些投入真的让人更有安全感吗？扫码参与我们的“AI时代年轻人生存小调查”，分享你在AI浪潮下的真实处境与选择。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260608/v2_907f94c79e2447fbb6b0a0cdce1aeb9d@5667365_oswg20685oswg421oswg389_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI时代年轻人生存小调查</p>\n  <p><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-06-08T00:01:39+00:00", "fetched_at": "2026-06-08T03:34:07.059844+00:00", "fingerprint": "c3e0fc63840344eb"}, {"source": "36氪 - 最新文章", "title": "「华超神控」获亿元天使系列融资，加速打造新一代AI超声脑机接口平台 | 36氪首发", "url": "https://36kr.com/p/3841459663030532?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，近日，新一代AI超声脑机公司华超神控（BCI-Sonics）已完成亿元人民币级天使轮系列融资。天使轮融资由经纬创投领投，天使+轮由德联资本、道远资本联合领投，循光资本持续担任独家财务顾问。募集资金将用于推动公司的技术验证与产业化落地。</p>\n  <p>华超神控于2025年创立，创始人李昕是中国科学院与德国弗劳恩霍夫IGD研究所联合培养生物医学工程博士，曾任GE医疗全球科研中心中国区负责人，并连续创立创新科技及医疗公司，在医疗影像、AI、脑机接口与产业转化方面拥有深厚积累。</p>\n  <p>公司核心团队汇聚了来自清华大学、上海交通大学、帝国理工等海内外高校的人才，覆盖神经科学、声学、医学影像、人工智能等多个方向，兼具研发与产业经验，熟悉医疗器械从原理样机、工程样机、临床验证到注册转化的完整路径。</p>\n  <p>据了解，<strong>华超神控团队在创业前已就超声脑机接口技术方向的产业确定性达成共识</strong>，属于“先有团队、目标、技术积累和临床判断，再走向创业和融资”。</p>\n  <p>被这批资深“老炮儿”集体看好的超声脑机接口技术，是当前脑机接口赛道中的热门细分方向，已经吸引了OpenAI创始人Sam Altman、Coinbase联合创始人Fred Ehrsam等硅谷科技派亲自下场创业；在国内，相关企业和科研团队也在密集布局，有说法认为，国内超声脑机几乎与海外站在同一起跑线，技术差距“不到1.5年”。</p>\n  <p>超声脑机接口之所以“火爆”，要回到脑机接口技术本身：大脑被称为人类认知的\"最后疆域\",也是未来科技领域最难攻克的堡垒之一。传统脑机接口解决方案以侵入式/半侵入式或非侵入式为主，前者要开颅，后者使用的经颅磁电刺激等方法虽更安全，但空间分辨率有限，难以作用于深脑区。</p>\n  <p><strong>那么，人类能否在不打开颅骨的前提下，无创而精准地修复大脑?</strong></p>\n  <p>这正是华超神控想要达成的目标：将原本“只能依靠外科手术才能触及的深部脑区,变成一次无创、可逆、可在门诊完成的精准调控”。</p>\n  <p>因此，与传统方案不同，华超神控选择了低强度聚焦超声（tFUS/LIFU）这一技术路径，因为超声是目前少数兼具“无创、深部可达和高时空分辨率潜力的物理通路”。经颅磁刺激仅能作用于约2cm的浅层皮层，而低强度聚焦超声可以无创穿透颅骨，深入脑内数厘米，精准触及那些决定运动、情绪、疼痛与成瘾的关键深部核团。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260606/v2_461d2f7a83764e1490959fe24e2a75f8@5930287_oswg256291oswg1344oswg768_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：华超神控</p>\n  <p>这个过程中，最重要的是精度。人的颅骨厚度、密度、曲率存在显著个体差异，超声穿过颅骨时会发生相位畸变、能量衰减与焦点偏移。因此，如果缺乏有效的相位校正，理论靶点与实际声场焦点就可能出现偏差，影响刺激有效率与临床可重复性。</p>\n  <p>华超神控通过自研的经颅相位校正算法，对颅骨造成的声场畸变进行快速补偿，将经颅聚焦精度收敛至最低1.5mm，这相当于在数厘米深处实现毫米级精准调控。</p>\n  <p>“这种经颅相位校正能力，是tFUS技术从实验室研究走向可验证疗效、可复制操作和准商业化设备的核心门槛之一。”李昕认为。据介绍，目前，华超神控这套自研经颅相位校正算法可在极短时间内完成个体化校准，也是国内少数具备该能力、且即将迈向商业化的超声脑机设备。</p>\n  <p>此外，华超神控的另一大技术壁垒，在于其AI闭环神经调控平台。公司并非要做一台单一的刺激设备，而是打造“读取—理解—调控—反馈—再优化”的闭环系统。一方面，通过多模态神经信号采集，并配合高精度声学反馈AI算法进行实时剂量反馈；另一方面，以AI算法识别脑状态、生成个体化刺激方案，动态调整调控策略。这相当于打通了“解码”与“调控”能力：用AI实时读取、解析神经活动，以低强度聚焦超声精准干预，再依托双模态监测构成完整闭环，在毫秒级尺度上动态校准靶点与剂量。</p>\n  <p>对于患者来说，这种看起来精深、复杂的技术带给自己的直接获益是什么？打个比方，以往，一位帕金森PD患者如果想缓解症状，特定情况的患者往往需要接受有创植入式的脑深部电刺激(DBS)；现在，依托无创的超声脑机接口调控技术刺激特定的核团区域，或许也能达到相近的效果，重获体面的生活。</p>\n  <p>现阶段，华超神控已与多所高校、三甲医院及临床专家团队建立深度合作，推进底层声学技术、神经调控机制、多模态数据采集、临床方案设计与真实世界验证等方面的实践，<strong>围绕疼痛、成瘾、神经重塑等方向共同设计研究路径、验证临床价值，推动超声脑机接口技术从科研样机开发走向准临床应用</strong>。</p>\n  <p>李昕相信：\"脑机接口真正实现产业化，需同时满足三个条件，即底层技术具备可验证的物理与生理机制；设备具备工程化，标准化和可复制能力，以及足够清晰的产品路径，使其能在真实应用场景中持续得到验证。\"</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>经纬创投表示，相较于传统植入式方案，低强度聚焦超声（LIFU）技术在刺激深度及空间分辨率上兼具优势，并实现了无创刺激，极大地拓宽了从临床治疗到消费健康的边界。公司核心团队在底层算法与换能器工艺上具备极强的技术壁垒，其产品不仅在学术端具备先发优势，更在泛医疗AI及神经康复领域展现出极强的工程化落地能力。我们期待与公司并肩，共同定义脑科学领域的“下一个十年”。</p>\n  <p>德联资本表示，经颅聚焦超声作为近年来新兴的无创神经调控手段，具备深度大、精度高、靶点可靠等特点，最大程度弥补现有传统经颅电、经颅磁的不足，可扩展性强，应用潜力巨大。华超神控是国内罕有的可实现全产业链自研的平台型企业，具备声学相关硬件、算法研发，高集成度医疗器械开发、注册等多种核心能力，以及全周期实战经验。我们看好并相信公司，未来凭借AI+超声一体化解决方案，实现从科研到临床、从院内到消费的全流程产品落地，推动行业发展的同时，造福患者及广大人群。</p>\n  <p>道远资本表示，大脑是人体最重要的器官，人类对于大脑的探索尚处于早期，脑科学是道远资本看好并持续布局的核心领域之一。超声脑机接口和神经调控是国际国内研究热点，拥有深部可及、安全精准等优势，已经从实验室开始走进临床并持续探索不同适应症和应用场景，华超神控团队在超声脑机接口和神经调控方向深耕多年，积累深厚，执行力强，我们对公司未来的发展充满信心，期待能为更多患者和广大人群带来更好的超声解决方案。</p>\n  <p>循光资本表示，超声脑机接口是当前非侵入式神经调控领域最具临床可及性与平台化潜力的技术路径之一，而真正能将这条路走通的团队，在全球范围内屈指可数。华超神控的核心优势，不仅在于这支团队对\"超声+闭环+AI\"这一神经科学前景方向的准确判断和技术积累，更在于其极为罕见的产业化凝聚力——先有共识，再有创业。循光资本将持续与华超神控并肩前行，期待公司在神经科学这片广袤蓝海中迸发出真正的爆发力。</p>", "category": "tech", "published_at": "2026-06-08T00:30:00+00:00", "fetched_at": "2026-06-08T03:34:07.059829+00:00", "fingerprint": "31122b0a2693e03f"}, {"source": "少数派", "title": "接住来自空间站的信号：如何用手台接收 SSTV？", "url": "https://sspai.com/post/110108", "summary": "它不是玄学，也不是单纯的浪漫。它是频率、传播、天线、轨道、多普勒效应，以及我们手中那一点点设备共同完成的一次小小实验。<a href=\"https://sspai.com/post/110108\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T08:34:12+00:00", "fetched_at": "2026-06-08T03:34:05.337486+00:00", "fingerprint": "70de63b8130138f0"}, {"source": "少数派", "title": "派早报：乘用车越造越重，12 年增重近 400 公斤", "url": "https://sspai.com/post/110847", "summary": "<p>乘用车越造越重，12 年增重近 400 公斤</p><p>iFixit 拆解华强北山寨苹果产品</p><p>Cloudflare 收购 Vite 背后公司</p><p>rsync 疑因 AI 参与维护出现 bug，引发争议</p><p>OpenAI 与美国政府商讨捐赠股权</p><p>美国平均上路车龄达到 13 年</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/110847\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T22:52:23+00:00", "fetched_at": "2026-06-08T03:34:05.337475+00:00", "fingerprint": "c59cd404bf4a0b91"}, {"source": "The Guardian - World", "title": "Ebola spread in central Africa could match 2014 record outbreak, US health officials say", "url": "https://www.theguardian.com/world/2026/jun/06/ebola-spread-in-central-africa-could-match-2014-record-outbreak-us-health-officials-say", "summary": "<p>Modelling from US CDC shows Ebola spread could be on ‘dangerous trajectory’, but experts warn outbreaks can be very hard to predict</p><p><a href=\"https://www.theguardian.com/world/2026/may/29/who-chief-tedros-adhanom-ghebreyesus-drc-ebola-outbreak-epidemic\">Central Africa’s Ebola outbreak</a> could spread to be similar in scale to the worst outbreak in history, <a hr do Switch 2 - in spring 2027. In footage shown onstage at Summer Game Fest Live, there was [&#8230;]", "category": "tech", "published_at": "2026-06-05T22:52:06+00:00", "fetched_at": "2026-06-06T02:45:12.923633+00:00", "fingerprint": "f60fa7e15b8f28dd"}, {"source": "The Verge", "title": "Grand Theft Auto VI is warping the video game release calendar", "url": "https://www.theverge.com/entertainment/944229/grand-theft-auto-6-release-calendar-summer-game-fest", "summary": "Who's afraid of the next GTA? Based on the last few days of Summer Game Fest, just about everyone. Grand Theft Auto VI hasn't been present at any of the keynote events, but its presence was felt every time a release date was announced. The month of November, when GTA VI launches, is virtually empty. [&#8230;]", "category": "tech", "published_at": "2026-06-05T23:05:27+00:00", "fetched_at": "2026-06-06T02:45:12.923627+00:00", "fingerprint": "aa212b2a6a295be6"}, {"source": "The Verge", "title": "More than a decade later, the team behind N++ is back with a multiplayer sequel", "url": "https://www.theverge.com/entertainment/943194/metanet-n-plus-plus-multiplayer-sequel", "summary": "Back in 2015, the two-person studio Metanet released N++, a brutally hard 2D platformer that was a decade in the making, building off of previous releases dating back to the freeware Flash title N. At the time, cofounder Raigan Burns issued some famous last words: \"We hope it's not another 10 years before we come [&#8230;]", "category": "tech", "published_at": "2026-06-05T23:25:34+00:00", "fetched_at": "2026-06-06T02:45:12.923616+00:00", "fingerprint": "49a188037d49b7fc"}, {"source": "36氪 - 最新文章", "title": "探店13家，理想/蔚来/问界如何征服50万客群？", "url": "https://36kr.com/p/3839803361741313?f=rss", "summary": "<p>一周之内，三款“9系”旗舰SUV密集上市，高端新能源市场竞争战况升级。</p>\n  <p>5月15日，理想发布新一代L9，其中Livis版本搭载800V主动悬架、线控制动、线控转向的全线控底盘，售价50.98万元起。</p>\n  <p>5月27日，蔚来ES9与问界新M9同天发布。姚明也称“空间大”的蔚来ES9，起售价49.8万元；在高端市场已经破局的问界M9，起售价49.98万元。</p>\n  <p>冲击50万元级的高端市场，似乎已成为头部新能源车品牌的共识。这背后是战略需要，也是直接的财务驱动。</p>\n  <p>2026年一季度，理想汽车销量同比增长，但由于70%订单为L6、i6等入门车型。销量结构的下沉，让理想这家最早盈利的新造车公司再度陷入季度亏损。</p>\n  <p>蔚来则通过定价40万元级的ES8，将主力销售区间从30万元抬升至40万元级别，配合销量增长带来的规模效应，一季度亏损大幅收窄。</p>\n  <p>在新能源市场多年的配置与价格内卷下，平价入门车型的利润空间已日益稀薄。</p>\n  <p>新势力品牌纷纷向50万元级突围，不仅是品牌定位的向上攀登，更是关乎企业生存与可持续盈利的必然选择。</p>\n  <p>然而，50万元级市场的竞争环境正变得严峻。乘联会数据显示，40万元以上汽车市场的整体规模已连续多季度萎缩。尽管新能源渗透率持续提升，但燃油高端车仍占据销量主体。</p>\n  <p>在此背景下，这场旗舰之争的真实战况究竟如何？36氪走访了北京、广州、深圳等地的13家门店，试图厘清战局，找到这场“9系”争霸的真正赢家。</p>\n  <h3>蔚来、理想强攻，问界M9守擂</h3>\n  <p>“很多客户感叹理想的驾驶感受突飞猛进”，多位理想销售人士告诉36氪，许多用户试驾L9 Livis后都当场下单，“很多汽车从业者来试驾后都表示，理想这一代底盘在9系车里算是第一档”。</p>\n  <p>此外，理想新L9的另一升级点是自研马赫芯片上车，但两个配置间如今在功能上并无差别。底盘能力成为新一代L9的实质核心卖点。</p>\n  <p>自2022年上市以来，理想L9的市场定位始终为六座“奶爸车”。其初代车型悬架调校和行驶表现虽一度被调侃像“开船”，但在2023年，L9年度销量依然突破11万辆，成为中国增长最快的新能源高端车之一。</p>\n  <p>家庭市场的真实诉求在于空间与舒适，对底盘性能并不苛求。而上升到50万价位，用户期待的又是超越家庭场景的综合豪华体验。从这个角度来看，设计含蓄的理想新一代L9注定了在高端市场“慢热”。</p>\n  <p>蔚来ES9同样以底盘作为亮点，配备了带主动悬架和线控转向的“天行底盘”。且36氪了解到，新车上市后72小时，搭载该底盘系统的行政签名版订单占比几乎超过80%。</p>\n  <p>多位蔚来销售人士告诉36氪，ES9上市后，ES8车型的订单也迎来小幅增长，“有部分ES8潜在用户下了ES9的预售，他们挺想要天行底盘，但正式上市后觉得价格偏高”，“如果不买天行底盘，ES8已经足够满足家庭需求了”。</p>\n  <p>真正下单ES9的客户，则大多都曾对比理想L9与问界M9，“理想L9定位和我们就不同，没有可比性。而同样是豪华商务定位里，车主们认为蔚来比其他品牌审美更在线，豪华感更精致”，有销售人士表示。</p>\n  <p>36氪在与多位已下订蔚来ES9的用户交流后发现，他们普遍有一个共识：在同级车型中，ES9的驾驶质感并不出彩。然而，在他们选购新车的天平上，极致的驾驶感并非必需项。</p>\n  <p>“50万的国产车里，只有蔚来的内饰是原创的，并且原创得还很好看、很豪华，这还不够吗？”，一位购买过两款蔚来汽车的用户直言。</p>\n  <p>在豪华车市场，设计与用料历来是基本的入场券。BBA时代竞争围绕“堆料”展开，实木、镀铬是彰显豪华的标配。然而，以特斯拉为代表的极简主义新范式席卷而至，即便是百万级的Model S，其“毛坯”内饰也曾引发市场质疑：高端新能源车，是否已不再需要设计豪华？</p>\n  <p>蔚来以行动完成了回答：高端客群的诉求从未改变。ES9凭借其独特的设计与扎实的用料向上突围，便是对这一诉求的精准回应。</p>\n  <p>问界新M9则呈现了第三种竞争态势。尽管与理想新L9一样选择了低调的内在升级路径，但问界用户对此的接受度明显更高。</p>\n  <p>多位销售人士告诉36氪：“新款确实有很多升级，比如传感器更多了之类的。但说实话，客户不怎么在乎配置，很多客户也不对比其他品牌，他们就是要买一辆问界M9，他们知道这是智能化最好的车”，高端客群对华为的技术品牌，已然建立起独特信任。</p>\n  <p>理想锚定家庭场景与细节体验，通过扎实的底盘调校提升舒适；蔚来聚焦设计与豪华感知，在审美与材质上建立壁垒；问界则在进一步夯实高端客群对品牌的信任。</p>\n  <p>新能源浪潮改写了旗舰SUV的竞争叙事，主战场从BBA时代的60-80万元，下探至50万元级。在有限的成本约束下，“全能”已不现实。因此，市场呈现出一种有趣局面：9系旗舰新车们有着相似的价格与配置，却分别在将某单一维度的体验上限推向极致。</p>\n  <h3>问界、蔚来破圈高端，理想陷于家庭定位</h3>\n  <p>目前理想新L9则在上市两周内收获1万辆锁单订单，问界新M9则在上市24小时后突破2万辆锁单订单。蔚来ES9如今的交付周期则显示为16–18周。</p>\n  <p>高端汽车市场的竞争是长期进程。新车上市初期的销量数字固然值得关注，但背后所反映的用户结构与品牌发展轨迹，才是决胜的关键。</p>\n  <p>36氪曾在理想新L9上市72小时的探店报道中提到，理想L9 Livis的老车主复购比例高达70%。蔚来的销售向36氪透露，ES9的老用户复购率同样惊人，“接近一半订单都是老车主复购”。</p>\n  <p>然而，两家品牌所依赖的“老本”并不相同。</p>\n  <p>有理想销售人士向36氪回忆，L9 Livis亮相后，销售团队便开始逐一邀约老车主前来体验，但多数客户都因超55万元的预售价偏高而婉拒，团队一度感到气馁。直到正式售价公布，初代理想ONE车主可用约48万元的落地价购入L9 Livis，局面才有所改变。</p>\n  <p>有销售人士向36氪坦言，理想汽车的用户群体既追求舒适体验，也看重性价比，“并非所有老车主都有50万的消费力，很多人都在等更便宜的L7、L8 Livis”。</p>\n  <p>蔚来的客户群体则截然不同。</p>\n  <p>理想2020年发布的首款车理想ONE定价30-35万元，而早在2018年，售价超过50万元的蔚来ES8便已实现年销过万辆的成绩。</p>\n  <p>多位蔚来销售人士告诉36氪，其销售团队同样采取了一对一邀约老车主的策略，“初代蔚来车主对ES9很有兴趣，甚至很多人都在持续关注蔚来的新品动态”。</p>\n  <p>36氪从门店侧了解到，蔚来ES9的新增订单中，有20-30%订单为公司购车。尽管蔚来提供了“0首付、5年分期免2年息”的优惠方案，全款购车的比例也仍居高不下。</p>\n  <p>相比之下，理想L9 Livis并未提供有优惠的分期政策，但其分期购车的比例却更高，“卖一周了，我手里没有一个全款订单”，北京市中心某门店的销售人士向36氪表示。</p>\n  <p>问界呈现出的态势与蔚来类似，但其高端认同的覆盖范围显然更广。其影响力不仅限于一二线城市，更广泛渗透至众多三四线城市。有问界销售人士告诉36氪，“很多县城企业主都在买问界，他们说生意场上大家只认这个，不认理想蔚来”。</p>\n  <p>整体来看，无论在购买力、品牌忠诚度还是用户圈层属性上，蔚来和问界都呈现出更符合高端市场的特征。</p>\n  <h3>9系车的集体焦虑：寻找高端符号</h3>\n  <p>36氪曾在一篇报道中指出，蔚来旗下全系车型的城市销量都与换电站布局呈现高度相关性：换电站建在哪里，销量就集中在哪里。用户画像固然高端，但其市场分布存在显著区域集中性，客户大多分布于换电站密集的一、二线城市。</p>\n  <p>相比之下，传统旗舰SUV车型宝马X5，其市场影响力则更为广泛和稳固。从月销1.1万辆波动至4000辆，但影响力仍持续覆盖超过100座城市。想在高端市场扎根，新能源品牌必须具备超越核心城市、辐射更广区域的能力。</p>\n  <p>36氪走访了山西、河北等地非省会城市的问界门店，多位销售人士告诉36氪，门店每月订单已稳定在十位数级别，“现在我们的主要工作是解答配置、权益与交付周期的问题，这个车好不好、比谁好都已经不需要多说了”。上牌城市数据也同步显示，问界的影响力已渗透至全国近200座城市。</p>\n  <p>过去三年，问界的独立用户中心与鸿蒙智行门店从约800家迅速扩张至超过2400家，大幅拓宽了品牌的线下触达网络。</p>\n  <p>与此同时，其母公司赛力斯在2025年财报中披露的销售费用超过240亿元，而理想、蔚来相关费用仅在百亿级别。值得注意的是，问界旗下仅5款车型，销售费用规模却与拥有约40款车的比亚迪接近。</p>\n  <p>一位资深奢侈品行业人士向36氪表示，高端市场的核心标志是溢价，而是否拥有溢价能力则很大程度取决于如何营销，“那些具备强溢价能力的奢侈品，制造成本都没那么夸张，最主要的成本还是花在了营销和服务上”。</p>\n  <p>持续的高强度投入，配合春晚等顶级曝光资源，已带来直观的成效：一线销售不再需要向客户解释“问界是谁”，品牌认知已深入人心。</p>\n  <p>“华为最懂高端客群要什么。配置、设计都在其次，他们最在意的其实就是「有没有人知道你开的是一台50万的车」”，一位问界门店销售负责人向36氪表示。</p>\n  <p>理想L9 Livis的车主心态则形成一组有趣对照。</p>\n  <p>广州地区一位理想店长告诉36氪，理想为L9的Livis版本推出了限定的拼色车身，但2万元的选配价让许多消费者望而却步，“有一个小兄弟定了Livis的裸配，跟我说已经订好了双拼的改色膜。他不舍得花2万选车身，但如果没有双拼色，这车跟40万买的老款没有一点区别，别人根本不知道他花了50多万”。</p>\n  <p>一位从宝马跳槽至问界的销售负责人向36氪直言，“以前买宝马的客户哪里看配置，买BBA其实就是买名片。很明显，M9现在就在做同样的事。买车要拼配置，但买名片只需要看抬头”。</p>\n  <p>问界M9如今解决的正是这种“辨识度”焦虑。它不再仅依靠设计与配置彰显高端，而是借助华为与问界日益提升的品牌认知，直接成为一张“移动名片”。</p>\n  <p>在旗舰SUV市场，极氪9X同样以一张“高辨识度名片”的身份初露头角。这款被称为“杭州库里南”的车型，已连续多月实现月销近万辆。</p>\n  <p>多位极氪销售人士向36氪表示，9X的前脸设计便是最大卖点，吸引了不少企业主用户换购，“很多客户的原话，说这张前脸值100万”。</p>\n  <p>一位曾在奔驰就职的销售告诉36氪，“极氪9X现在影响力拓展得很快，但9X并没有给我们其他车型带来引流。9X靠前脸成为爆品，但极氪还没成为能在50万元站稳脚跟的品牌”。</p>\n  <p>2026年，40万元以上新能源市场销量同比暴涨超70%，无论理想、蔚来还是问界，都擅长打造“爆品”，但至今也尚未出现能够穿越周期、持续畅销的经典车系，竞争仍深陷于配置与价格的肉搏之中。</p>\n  <p>问界M9背靠华为，似乎拼出了一条将智能化转化为“社交名片”的新路，但让更广泛的人群认知并认同其品牌价值，本身就是一项成本巨大的工程。</p>\n  <p>在传统燃油时代，高端车市场从未出现“赢家通吃”的局面，新能源时代也同样不会。仅靠价格战抢夺销量并非长久之计。</p>\n  <p>新能源品牌的真正竞争，应是如何让品牌摆脱对配置与价格的依赖、建立起真正的护城河，这才是汽车品牌们前仆后继投入高端市场的核心原因。</p>", "category": "tech", "published_at": "2026-06-05T06:52:26+00:00", "fetched_at": "2026-06-06T02:45:12.548699+00:00", "fingerprint": "684ba2095cf49c84"}, {"source": "36氪 - 最新文章", "title": "中国入境游距离「世界第一」还有多远？", "url": "https://36kr.com/p/3840001908361472?f=rss", "summary": "<p>“曾有外国友人让我推荐中国的最佳旅行目的地，我的回答是：你应该看看中国的山。”</p>\n  <p>最近的一场入境游研讨会，携程集团联合创始人兼董事局主席梁建章这样回答。在他的表述中，中国有世界最高的山——喜马拉雅；全世界最美的山，则在中国南方最独特的喀斯特地貌——桂林。</p>\n  <p>与此同时，他正将这份“私藏推荐”转化为全球旅行者的实际行动。</p>\n  <p>近期<strong>，携程集团宣布了一项新的战略计划：未来五年，公司将引入2亿人次的入境游客。</strong></p>\n  <p>在同期进行的桂林之夜入境游推广活动上，国际影星成龙也以“携程入境游大使”的身份亮相活动现场。当成龙遇上桂林山水，携程决心赋能入境游整体链条的变革正拉开序幕。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_109338fd67604ac8a99e743ad140d5bb@11416942_oswg873759oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国际影星成龙成为“携程入境游大使”</p>\n  <h2><strong>01. “中国入境游应做到世界第一”</strong></h2>\n  <p>近年来，国家密集出台的便利外籍人员来华政策，也让“China Travel”在全球社交媒体上蔚然成风。</p>\n  <p>据国家统计局公布的数据，2025年我国入境外国游客（不含港澳台）已超过3500万人次，同比增长30%，其中免签入境外国人达3008万人次，同比增长近50%。免签政策对客源拉升效应显著。另据联合国世界旅游组织数据，2025年1至11月，中国国际旅游收入增幅近40%，位列全球第六。</p>\n  <p>然而，仔细拆分数据，中国的入境游人数仍不如欧美。2025年，外国人入境中国的人次超过3500万——从人数上看，我们距离泰国、日本、西班牙等入境游强国仍有显著差距。</p>\n  <p>梁建章还从国际贸易视角提出了观察：中国的出境游与美国处于同一量级，但入境游却比美国少了2000多亿美元，导致我国在旅游服务贸易上存在较大逆差。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_78474ccefda24f4981becd5c51a3cf75@11416942_oswg92470oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">携程集团联合创始人兼董事局主席梁建章</p>\n  <p>在他看来，中国的入境游有充分的理由做到世界第一：</p>\n  <p>第一，自然与人文的复合资源全球罕见。“桂林山水甲天下”中的“天下”指的是全世界，如果将中国深厚的历史底蕴与顶级的自然风光叠加，全世界能与之匹敌的其他国家或地区寥寥。</p>\n  <p>第二，中国拥有几乎全球第一的基础设施。游客在几小时内便能从绝美的自然风光切换到繁华的都市生活，这种时空压缩的效率能带给人们极致的旅行体验。</p>\n  <p>第三，中国旅游产品的高性价比，对发达国家是降维打击。梁建章举例道：中国五星级酒店的均价在1000-2000元人民币，巴黎或纽约则是1000-2000美元，价差高达数倍。</p>\n  <p>第四，中国的硬核科技具有极强的展示性，中国拥有无人机表演等科技景观，形成了一定的吸引力。而这些“绝对的竞争力”也构成了中国入境游能够与欧美成熟大国比拼的底气。</p>\n  <p><strong>此外，梁建章还指出，入境游不仅能直接创造大量外汇收入，缩小旅游逆差，对汇率有支撑作用，还具备强大的产业乘数效应。</strong></p>\n  <p>旅游消费会带动就业、相关产业投资，同时还能拉动海外投资、留学、置业、医美等延伸消费，综合下来对GDP的拉动作用远高于入境游本身的产值，整体贡献有望达到5%至8%。</p>\n  <p>这也意味着，入境游不只是赚钱的生意，更是推动中国宏观经济结构转型的关键杠杆。</p>\n  <h2><strong>02. 布局十年，改善“五大痛点”</strong></h2>\n  <p>“10年前，我和团队说中国的入境旅游未来是巨大的机会，但当时存在很多瓶颈。”<strong>梁建章将其总结为五大痛点：签证不便、支付困难、网络访问受限、交通衔接不畅以及国家层面的宣传薄弱。</strong></p>\n  <p><strong>十年过去，这五大痛点在政策与产业的合力下得到了极大的改善。</strong></p>\n  <p>截至目前，中国已对80多个国家实行免签，外卡绑定移动支付已极为便利，高铁网络织得更密。国家的形象宣传也随着免签政策的开放，潜移默化地转变为足以改变海外认知的“软实力”。</p>\n  <p>携程最新发布的《中国入境游发展年度报告》，也清晰地向外界展示了为应对全球涌现的入境游需求，可复用的解决方案。</p>\n  <p>报告将中国入境游客细分为六大客群：</p>\n  <p>追求高性价比和时髦打卡地的“周末型”韩国游客；依赖社交媒体推荐的“社交型”东南亚游客；飞行时间长、偏好“深度型”的澳大利亚游客；注重“高端服务”的中东游客；环保意识强、偏爱高铁游的“成熟型”欧洲游客；以及需要清真友好产品的“高潜型”印尼和越南游客。</p>\n  <p>但这些人群也都有“预订周期极长，最长可提前一年”的共性，且中国的入境游客在目的地停留的时间普遍高于平均水平。梳理出确切的用户画像后，携程也能精准触达这些入境游客的痛点。</p>\n  <p><strong>针对“行前”，携程采取了高饱和式的海外营销。</strong></p>\n  <p>自2025年9月起，携程在全球联动头部艺人与KOL，共创特色路线。截至目前，已组织17批达人团、近千名KOL来华，精准覆盖高净值客群。</p>\n  <p>此外，对于即将来到中国、正规划行程的游客，携程也通过AI辅助，帮助他们选择心仪的出行路线。</p>\n  <p><strong>真正的攻坚战场，在于“行中”环节。</strong></p>\n  <p>携程首席执行官孙洁介绍道，在支付与预订上，携程海外版支持近65种支付方式、44种结算币种，23种语言的智能票机覆盖了280余家景区。</p>\n  <p>此外，携程还推出了“机场中转半日游”，针对“欧洲高铁游”等特定需求做“主题游”，同时提供英、韩、泰等语言的深度服务，个性化的定制游增长达到40%。</p>\n  <h2><strong>03. 产业赋能：让每一个从业者都赚到钱</strong></h2>\n  <p>努力优化入境游体验最终还需要所有的从业主体来实现，在此背景下，<strong>携程专门投入了10亿元专项资金，帮助商家和服务人员获得“外国人生意”订单。</strong></p>\n  <p>这种赋能，首先体现在对目的地和景区底层数字能力的建设上。</p>\n  <p>过去，世界级景观常常缺少一条便于外国游客入园的通道。</p>\n  <p>在桂林龙脊梯田，这一痛点曾极为典型。层层叠叠的梯田让无数国际旅行者神往，游客们却常常卡在景区入口：人工窗口大排长龙，语言不通，支付受限，买一张票折腾十几分钟。一位泰国游客曾在社交媒体写道：“龙脊梯田的美景值满分，但买票只能给及格。”</p>\n  <p>携程介入后，落地了一套“三把钥匙”的解决方案：部署了支持中、英、日、韩、泰等6种语言的自助售票机，海外游客护照一扫、移动支付，30秒出票；在景区入口，携程还设置了多语言地推二维码，扫码即可入园；另在各大景区的官方公众号，嵌入了Trip.com的购票链接，实现微信生态与全球预订平台的无缝衔接。</p>\n  <p><strong>结果是，游客购票的效率提升了80%，用时从3分钟缩短至30秒，景区通过携程平台预订的入境游客量同比猛增464%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_fde893b579294e8fa679a92e1c439c3f@11416942_oswg860997oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>同样的变化发生在桂林芦笛岩，这座“大自然的艺术之宫”。</p>\n  <p>过去，高峰期入境游客排队超过10分钟，语言不通，Apple Pay等国际支付方式无法使用，景区对客源构成缺乏感知。</p>\n  <p>在携程部署的多台入境游专用自助售票机后，不仅平均购票时间从15分钟压缩至30秒以内，还解放了约50%的人工售票人力，使其转向更有温度的导览服务。</p>\n  <p>关键是，景区的每一笔交易都能沉淀为直观数据，景区第一次看清楚了“究竟是谁在买票”“旅客们都来自哪里、又偏向怎样的产品”。<strong>精准营销变得有的放矢，入境游客量同比增长73%。</strong></p>\n  <p>对于已具规模的酒店集团，携程也提升了他们的经营效率与跨文化的服务能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_2e032f4279944677a8e072e8a8742a80@11416942_oswg1362955oswg1080oswg757_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>以桂林的诗与远方酒店集团为例，通过参加携程海外平台的“订房送eSIM”和“GO CHINA”大促活动，其在阳朔的门店，两个月内的入境订单量同比增长超过150%。酒店总经理陈丽透露，酒店目前的线上入境订单占比，已从不足10%跃升至30%，客源从香港、东南亚拓展到美国、澳大利亚、法国等全球市场。</p>\n  <p>这家酒店真正的护城河，来自服务颗粒度的细化。在更多外国客人的反馈中，门店内的鸬鹚捕鱼表演、时令非遗手作等活动，让人印象深刻。与此同时，酒店还提供来自本地的24小时中英双语管家，从客人下单起就提供陪玩攻略，解决了自由行游客最大的信息不对称问题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_fdd63b8891ee4b829f76869fcd55fa18@11416942_oswg189247oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片由采访对象提供</p>\n  <p>桂林泊隐酒店集团则从另一个维度诠释了服务升级。</p>\n  <p>运营负责人何静分享了一个细节：一位意大利客人因周边餐厅晚上七八点打烊而差点饿肚子，这件事直接催生了酒店将餐厅延至晚9点半的“深夜食堂”制度。</p>\n  <p>随后，集团所有门店设立18小时在线外宾沟通人员，自动为外宾选无烟房，提供免费洗衣烘干送回服务，并在店内设置非遗体验区，让客人制作漓江拼画、艾草香包，将桂林记忆带回家。截至目前，桂林泊隐酒店的<strong>入境订单已同比增长60%，欧美及俄罗斯远途客源明显上升。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_1319697b0d5f41dcb52982c2967329c8@11416942_oswg158394oswg1080oswg813_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片由采访对象提供</p>\n  <p>更为重要的是，对于广泛的产业链个体，携程也带来了结构性的机遇。</p>\n  <p>此前有媒体报道称，曾经的远洋海员，利用自身的英语优势和对张家界的了解，转型为旅行定制师。还有“下岗再就业”的教培教师，精准抓住了西语导游的机会，月收入翻番。这些案例的背后，是“免签+平台”的双重红利下，市场对小语种人才的渴求。</p>\n  <p><strong>在消除海外游客信任壁垒的同时，携程正在为全行业商家赋能，让整个产业链上的玩家都能敢接，也能接住高要求的入境游需求。</strong></p>\n  <h2><strong>04. 写在尾声：国际旅游是不同文明的交往</strong></h2>\n  <p>中国旅游协会秘书长葛磊有一个精辟的论述：</p>\n  <p>“无论在哪个国家，旅游业应当鼓励人和人的相遇。国际旅游永远不是简单的旅游消费，它是不同的国家、不同的民族、不同的文明之间的相互交往。”</p>\n  <p>当下的世界充满不确定性，但中国的旅游业正变得更加积极和开放。</p>\n  <p>据全国移民管理机构统计，今年一季度，免签入境外国人达831.5万人次，占入境外国人总数的77.9%，同比增长29.3%。2026年作为“十五五”开局之年，“‌旅游强国建设”首次写入国家五年规划‌，‌“中国服务”‌亦首次与“中国制造”并列纳入国家战略框架。</p>\n  <p>而携程的“五年计划”，正将桂林这样拥有顶级旅游资源的城市，打造为世界级的旅居目的地——这也是对国家叙事的产业回应。</p>\n  <p>当龙脊梯田的自助售票机以全新姿态迎接来自世界各地的面孔，当酒店的非遗手作从静态展示变为可带走的记忆，当一笔笔透明订单通过平台建立起的规则跨越时空界限，中国入境游的商业飞轮已经转了起来。</p>\n  <p>梁建章所描绘的那个“入境游世界第一”的愿景，或许会比人们预想中的更早到来。</p>\n  <p><strong>*免责声明：</strong></p>\n  <p><strong>本文内容仅代表作者看法。</strong></p>\n  <p><strong>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</strong></p>", "category": "tech", "published_at": "2026-06-05T08:25:49+00:00", "fetched_at": "2026-06-06T02:45:12.548693+00:00", "fingerprint": "2ac0561e081cdb4e"}, {"source": "36氪 - 最新文章", "title": "Token大战中，华为云选择了第三条路｜最前线", "url": "https://36kr.com/p/3840016255126016?f=rss", "summary": "<p>作者 | 邓咏仪</p>\n  <p>编辑 | 张雨忻</p>\n  <p>“在国产化算力供应受限的情况下，华为云现在不太在乎Token总量是多少，也不太在乎收入的总量是多少，在乎的是国产化的算力系统所生产出来的Tokens的健康度，并且要代表着生产力提升，而不仅仅是情绪价值。”</p>\n  <p>6月5日，2026华为云 INSPIRE 创想者大会在上海开幕，华为云CEO周跃峰表示。</p>\n  <p>他举了个例子：一个人闲来无事在手机上问 AI 一个问题，也会产生 Token，但这种 Token 的价值有多大很难说明。在他看来，衡量一朵云做得好不好，不该强调它跑出了多少万亿 Token，而该看这些 Token 替企业提了多少效率。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_30bec1e3982a4d37b1494a36457e4993@2057308263_oswg1491382oswg1100oswg734_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">华为云CEO周跃峰</p>\n  <p>过去两年，中国云厂商围绕 Token 打了一场旷日持久的价格战：2024年5月，在DeepSeek V2打响降价的第一枪后，火山引擎豆包以0.0008元/千 Token 的定价点燃战火，而后阿里，百度、腾讯、讯飞相继入场，自此开始了模型厂商的第一场战事。</p>\n  <p>这套打法的内核，是用低价模型引流、带动背后的公有云销售，代价则是推理算力的毛利率一度被压到为负。一直到DeepSeek R1打开推理时代范式之后，Coding和视频模型再度激起了真正的Token大战。</p>\n  <p>而在这次发布会上，华为云这次并没有出降价牌，而是提出一个名为“Agentic Infra”的新范式，瞄准国产算力。所有人都比谁的Token更便宜、谁的调用量更大时，华为云在 Token 经济中选的第三条路——不拼单价和调用量，赌的是国产算力的自主可控，以及是否能够帮助企业提升真实的生产力。</p>\n  <h3>不打价格战，把 Token 工厂建在国产硬件上</h3>\n  <p>要达到 Agentic Infra的建设目标，华为云端出了一整套底层设施。</p>\n  <p>而要具体拆解华为云所定义的Agentic Infra，则包括四个方面：高效的Token 工厂、可持续学习、通智一体化调度、安全自治，华为云也对应发布了四款新品。</p>\n  <p>最核心的是 AICS 灵衢智算集群。它基于灵衢网络，支持10万卡级集群规模，总算力200EFLOPS，把 Token 生成时延压到10毫秒以内，千卡每秒吞吐达到500万 Token，在线服务可用性99.95%——华为云称之为“Token 工厂”。</p>\n  <p>而配套的 CCE Volcano Next 调度引擎，则通过“训推共池+碎片整合”的形式，把通用算力和智能算力混合调度，使得资源利用率能提升30%以上；AMS 记忆存储方案用 NPU 直通硬件做出 PB 级记忆空间，AgentSphere 则提供100毫秒级启动的智能体安全运行环境。</p>\n  <p>而在模型层面，华为云同步发布了新一代训推平台 ModelArts Next。其中，MaaS 模型路由能够按请求特征，自动调度最合适的模型，目前接入15余款 SOTA 模型，官方称调度精准率超过95%、调用成本平均降低20%。</p>\n  <p>华为云也在在自己优势的企业场景，推出了一系列客户刚需的功能。比如，ModelArts Next还将强化学习封装成企业级 RLaaS 服务，并提供机密推理能力，让金融、编码等高敏感场景的数据“只进不出”。</p>\n  <p>之所以能够通过这套基础设施走出第三条路，前提在昇腾生态。今年初 DeepSeek 爆火时，华为云与硅基流动曾在昇腾 CloudMatrix 384超节点上部署 DeepSeek-R1/V3，当时的推理效率可追平英伟达 H800。这意味着，国产算力已经能在主流大模型的推理上拿出可用的性能。</p>\n  <h3>从算力底座到行业落地，押注“最开放的云”</h3>\n  <p>如果说，底座解决的是“算力从哪来”这个问题，华为云这次更想讲的是 Token 往哪去——落到具体行业的生产力上。</p>\n  <p>往上一层，华为云公测了智果 AgentArts 企业级智能体平台，同时上线开源版 openJiuwen，内核与企业版同源度超过90%。</p>\n  <p>对华为云在AI时代的差异点，周跃峰反复强调，华为云有着昇腾、鲲鹏算力开放，欧拉操作系统、ModelArts 工具链开源等生态，是“智能体时代最开放的云”。</p>\n  <p>而这种开放也延伸到模型生态——大会上，华为云联合智谱、DeepSeek、Kimi、阶跃星辰、百度等20余家模型厂商，共同发布了“百模千态”合作计划。</p>\n  <p>真正被周跃峰视为“生产力落点”的，则是行业场景。</p>\n  <p>当前，华为云已经在不少行业和场景中，帮助企业把AI用起来。比如，华为云针对具身智能行业上线的 CloudRobo 开发平台，就能够让中小企业能低成本接入、共享数据和模型。</p>\n  <p>“中国有300多家具身智能创业公司，规模都不大，让它们各自自建算力和数据链压力太大。”周跃峰解释道。</p>\n  <p>医疗则是华为云投入的重点行业之一。此前，华为已在2025年3月组建医疗卫生军团，把 AI 辅助诊断列为军团级的战略方向。</p>\n  <p>在大模型时代到来后，华为云如今也有了一个典型案例：当前，全国能看病理切片的医生只有约2万名，缺口巨大，偏远医院的病理误诊率偏高。</p>\n  <p>针对这个问题，华为云与瑞金医院联合开发的病理大模型已经上线——这一模型已经能让县域、地市级医院通过云端就能调用三甲水平的诊断能力，患者不必长途奔波。</p>\n  <p>此外，考虑到政府、金融、央国企对数据安全和本地化的顾虑，华为云这次还同步发布了面向智能体的混合云白皮书和机密计算方案，走公有云与私有云“两条腿”。</p>\n  <p><strong>“华为云要做硅基黑土地。”</strong>周跃峰反复提到，华为云要打造“第二个算力平面”。这意味着，不拿国产算力的规模去和英伟达这类“万国牌”算力比大小，而是给全球开发者多提供一条技术路线和一套生态选择。</p>", "category": "tech", "published_at": "2026-06-05T08:28:25+00:00", "fetched_at": "2026-06-06T02:45:12.548687+00:00", "fingerprint": "7982de11c491ca96"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜日本或通过抛售美债，为创纪录规模的日元汇市干预筹资；俞浩内部发文：未来将继续心无旁骛做实业", "url": "https://36kr.com/p/3840267945969929?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>首关15亿元，英诺科创三期基金持续聚焦早期科技投资</strong></p>\n  <p>36氪获悉，6月5日，英诺基金宣布旗下英诺科创三期基金完成首轮关账，规模15亿元。该基金聚焦早期科技投资，重点布局前沿科技及人工智能领域。</p>\n  <p><strong>比特币“金库”公司市值蒸发620亿美元</strong></p>\n  <p>比特币本周下跌约14%，至四个月低点附近。随着加密货6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。（界面）币整体滑坡，数字资产“金库型”公司的股票也持续下挫，其中许多的跌幅远远超过它们所持有的加密货币本身。Artemis的数据显示，这些比特币金库公司的完全稀释股票总市值，已从去年10月初的近期顶点近1340亿美元，降至约720亿美元，也就是减少了620亿美元。Tokenize Capital管理合伙人Tokenize Capital表示：“随着价格回落，数字资产金库公司正面临一个严峻选择：是债务违约，还是出售资产。被迫抛售已经粉碎了对它们会持续扮演‘买入并持有’投资者角色的预期。”（财联社）</p>\n  <p><strong>俞浩内部发文：未来将继续心无旁骛做实业</strong></p>\n  <p>6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。（界面）</p>\n  <p><strong>高德地图在杭州成立新公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，杭州高行蓝隼智能科技有限公司成立，法定代表人为刘书鹏，注册资本800万人民币，经营范围包括软件开发、软件销售、人工智能基础软件开发、汽车销售等。股东信息显示，该公司由高德软件有限公司旗下北京利通出行科技有限公司全资持股。</p>\n  <h2>投融资：</h2>\n  <p><strong>上海机电灵巧智能成立灵机壹动公司# 注册资本1亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，灵机壹动（上海）科技有限公司成立，法定代表人为周骏麟，注册资本1亿人民币，经营范围包括电子元器件与机电组件设备制造、人工智能硬件销售、人工智能应用软件开发、软件开发等。股东信息显示，该公司由上海机电、浙江灵巧智能科技有限公司共同持股。</p>\n  <h2>新产品：</h2>\n  <p><strong>腾讯云发布WorkBuddy企业版</strong></p>\n  <p>36氪获悉，6月5日，腾讯云在京召开AI产业应用大会，腾讯正式发布WorkBuddy企业版（WorkBuddy Enterprise）及办公智能体套件Agent Suite。WorkBuddy企业版及办公智能体套件，是行业内首套“AI原生组织进化解决方案”。作为企业AI智能工作台，WorkBuddy企业版提供7×24专家数字员工、支持人与AI协作的“团队”模式、企业级管理后台三大核心能力。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><br /><strong>日本或通过抛售美债，为创纪录规模的日元汇市干预筹资</strong></p>\n  <p>日本可能动用了其持有的外国证券，其中包括美国国债，为过去一个月创纪录的汇市干预提供资金，这一举动可能引起美国方面的关注。根据日本财务省周五公布的储备数据，截至5月底，日本持有的外国证券较4月减少756亿美元。这一下降规模与日本近期为支撑日元而入市干预的金额大致相当。日本财务省上周确认，截至5月28日，当月用于汇市干预的资金达到创纪录的11.73万亿日元（734亿美元）。（新浪财经）</p>", "category": "tech", "published_at": "2026-06-05T12:50:46+00:00", "fetched_at": "2026-06-06T02:45:12.548678+00:00", "fingerprint": "7971729b314c86be"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜豆包推出付费后月活减少610万；Anthropic呼吁全球放缓AI开发，警告AI“自我改进”风险；罗永浩卸任锤子软件公司执行董事", "url": "https://36kr.com/p/3840996342073604?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>SpaceX据悉将其IPO的日本融资目标提高至25亿美元</p>\n  <p>二手房挂牌量回落新房库存下降，楼市供需关系向好</p>\n  <p>B站宣布启动AI创造公开赛</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>数据显示，豆包推出付费后月活减少610万&nbsp;</strong></p>\n  <p>据全球人工智能市场追踪机构Aicpb.com周三发布的数据显示，在豆包推出订阅选项后，该应用5月份的月活跃用户（MAU）减少了610万，这是自2023年推出以来该应用罕见的下滑。Aicpb.com创始人李邦竹表示：“中国的免费人工智能服务时代还远未结束，所以豆包的商业化可能确实为时过早。”&nbsp;</p>\n  <p>有分析人士认为，字节跳动过早地将盈利模式商业化，可能会使其在中国竞争激烈的消费人工智能市场中失去领先地位。此前，其旗舰聊天机器人豆包在试水付费订阅模式后流失了数百万用户。（南华早报）</p>\n  <p><strong>Anthropic呼吁全球放缓AI开发，警告AI“自我改进”风险 &nbsp;</strong></p>\n  <p>据《华尔街日报》，AI创业公司Anthropic呼吁全球顶尖AI实验室考虑放缓研发步伐，理由是当前AI系统进步太快，可能很快就能在无需人类干预的情况下自我改进，从而带来重大的社会风险。</p>\n  <p>Anthropic周四在一篇博客文章中表示，如果能够放缓全球AI发展的速度，这“很可能是一件好事”。文章同时披露了Anthropic内部数据，展示其最先进AI模型能力提升的速度之快。（凤凰网科技）</p>\n  <p><strong>罗永浩卸任锤子软件公司执行董事，已累计偿还近10亿元债务</strong></p>\n  <p>国家企业信用信息公示系统显示，锤子科技创始人罗永浩工商职务发生变动，在锤子软件（北京）有限公司的职务由“执行董事”变更为“董事”，这是罗永浩近年来又一次退出锤子系企业核心管理岗位。 对此，锤子科技内部知情人士向媒体透露，此次职务调整为企业常规工商变更，属于公司既定人事安排，无特殊变动原因。</p>\n  <p>针对最新还债进度，上述知情人士向记者透露， 目前罗永浩已累计偿还近10亿元债务，剩余债务的清偿工作正在稳步推进中，其本人亦在全力投入工作以加快完成后续还款计划。（大河报）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>黄仁勋：SK海力士、三星、美光已通过认证，将量产最新AI内存</strong></p>\n  <p>英伟达CEO黄仁勋表示，三大内存芯片制造商已获准为英伟达AI加速器供应最先进的高带宽产品。这一决定意味着SK海力士、三星电子和美光科技可开始量产并供应HBM4，即用于英伟达AI加速器的最新一代芯片。这三家企业主导着全球计算用存储半导体市场，此前一直在激烈争夺该业务份额。黄仁勋在抵达首尔进行为期数日的访问时告诉记者：“三家供应商均已通过认证。”他补充道：“三家企业都已投产，都在竞相支持Vera Rubin。”Vera Rubin是英伟达最新AI芯片。（新浪财经）</p>\n  <p><strong>腾讯高管：今年腾讯大部分代码都由AI生成</strong></p>\n  <p>36氪获悉，在腾讯云AI产业应用大会上，腾讯高级执行副总裁汤道生在与腾讯首席AI科学家姚顺雨的对话中表示，今年腾讯大部分代码都是由AI生成，腾讯的工程师可能会花更多的时间去做架构设计等，他们把写代码的工作都交给AI了，定期指导、修正AI写的东西。</p>\n  <p><strong>腾讯云TokenHub：连续多月翻倍，日Token消耗量跃升至5万亿</strong></p>\n  <p>36氪获悉，在5日举行的腾讯云AI产业应用大会上，腾讯云总经理、TokenHub负责人高航透露，腾讯云大模型服务平台TokenHub上线3个月，保持每月翻倍的增长态势，目前日Token消耗量已突破5万亿。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>SpaceX据悉将其IPO的日本融资目标提高至25亿美元</strong></p>\n  <p>SpaceX已将其在日本发行股票的计划筹集金额增加了四分之一，这表明日本散户投资者的需求强劲。据监管文件披露，SpaceX目前正寻求从日本投资者那里筹集至多25亿美元的资金，高于上周披露的20亿美元。文件显示，日本投资者获配1480万至1850万股A类股，初步定价为每股135美元。日本部分的认购登记将于本周五开始，持续至下周晚些时候。（新浪财经）</p>\n  <p><strong>国办：对私募证券基金加大监测力度，强化交易行为监管</strong></p>\n  <p>36氪获悉，国务院办公厅发布《关于加强监管防范风险促进私募投资基金高质量发展的指导意见》，其中提出，细化私募基金风险评价标准，提升监管强度与风险水平适配性，按照评价结果对不同私募基金管理人实施差异化监管。对重点私募基金管理人依法加大现场检查力度，加强央地和跨辖区联合检查。对异地经营的私募基金管理人加大监管力度，引导注册地与经营地相统一。对存在违规代持、通道化等情形的私募基金管理人加大规范引导力度，推动主动整改。对私募证券基金加大监测力度，强化交易行为监管。</p>\n  <p><strong>二手房挂牌量回落，新房库存下降，楼市供需关系向好</strong></p>\n  <p>在住房需求集中释放的背景下，房地产市场持续企稳，市场成交保持高活跃度。受此影响，市场供给端出现积极信号，供需关系向好发展。在二手房市场，中指研究院数据显示，5月份重点25城二手房新增挂牌房源达12万套，同比下降约41%。（证券日报）</p>\n  <p><strong>现货黄金回吐年内涨幅&nbsp;</strong></p>\n  <p>现货黄金回吐今年以来的全部涨幅，此前美国公布的就业数据强化了市场对美联储加息的预期。(金十数据APP)</p>\n  <p><strong>湘雅二医院逾8亿元工程招标收到投诉：首次公示前六家单位落选，第八名“逆袭”中标 &nbsp;</strong></p>\n  <p>2026年3月17日，中南大学湘雅二医院国家紧急医学救援基地建设施工总承包进行了合同公示，对于招投标的结果，多家投标单位向记者反映称，项目（总投资估算8.27亿元）的招标结果存在重大异常。合同公示显示，最终中标单位为首次候选人公示中排名第八的湖南省第四工程有限公司联合体。</p>\n  <p>记者了解到，在2025年12月11日的二次公示中，2025年10月30日第一次公示的6家中标候选人被全部更换。“第八名逆袭”让众多参与投标企业表示不解。</p>\n  <p>2026年1月14日，招标方发布公告称，“因本项目收到相关投诉，暂停本项目的招投标活动”，并表示投标有限期相应延长90天。然而，两个月后，项目招标进行的最终合同公示中，中标方仍为二次公示的中标者湖南省第四工程有限公司联合体。</p>\n  <p>近日，记者分别向湘雅附二院和长沙市招投标中心、长沙市住建局、招标代理机构中技建设咨询有限公司等发去采访要求，均未得到明确回复。（澎湃新闻）</p>\n  <p><strong>美股收盘：纳指跌超4% 半导体股多数下跌&nbsp;</strong></p>\n  <p>美股周五收盘，道指初步收跌1.35%，标普500指数跌2.65%，纳指跌4.18%，其中，标普500指数创下自2025年10月以来最大单日跌幅；纳指创下自2025年4月以来最大单日跌幅。半导体板块多数下跌，费城半导体指数尾盘跌幅扩大至10%，创2025年4月以来最大单日跌幅。英伟达(NVDA.O)跌超6%，台积电(TSM.N)跌6.68%，博通(AVGO.O)跌近8%，英特尔(INTC.O)跌超11%。纳斯达克中国金龙指数收跌3.56%，小马智行(PONY.O)跌9.83%，百度(BIDU.O)跌9.75%，金山云(KC.O)跌6.70%。(金十数据APP)</p>\n  <p><strong>追觅产业基金人士：目前基金运营一切正常</strong></p>\n  <p>据蓝鲸新闻，有地方对辖区内企业与追觅的合作情况开展摸排的消息，再次引发关注。摸排内容涵盖合作项目、总体规模、资金投入、财政及国资参与情况、当前经营状况等。对此，追觅一位负责产业基金运作的人士向记者表示：“或是相关事宜有人员行事过于高调，但现阶段基金运营一切正常。”(财联社)</p>\n  <p><strong>俞浩内部发文：未来将继续心无旁骛做实业</strong></p>\n  <p>6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。(界面新闻)</p>\n  <p><strong>国办：严控新设政府投资基金，县区原则上不得新设</strong></p>\n  <p>36氪获悉，国务院办公厅发布《关于加强监管防范风险促进私募投资基金高质量发展的指导意见》，其中提出，优化私募基金登记备案规则，坚决防止不符合私募基金特征和运作规律的机构和产品作为私募基金登记备案。严控新设政府投资基金，县区原则上不得新设，确有必要新设的应当报上级人民政府批准。加强综合研判会商、经营主体登记、私募基金登记备案等的信息共享和工作衔接。</p>\n  <p><strong>乌拉圭宣布对中国公民免签</strong></p>\n  <p>乌拉圭外交部长卢贝特金宣布，这一南美国家将对中国公民免签。（新华社）</p>\n  <p><strong>丰田叫停雷克萨斯LF-ZC量产，回应：不是放弃纯电车</strong></p>\n  <p>近日，有消息称，丰田叫停了雷克萨斯纯电动轿车LF-ZC量产车型的开发。该车型流线型、车高较低的“轿跑（Coupe）”款，原计划以铝铸造实现零部件一体成型的“一体化压铸”。按照原计划，LF-ZC量产车型将于2026年底在丰田日本国内的田原工厂投产，之后这一计划被推迟至2027年中期，直至如今被叫停。</p>\n  <p>“本次车型开发中止，主要是考虑到了市场需求的变化，这也是公司对整体车辆开发项目进行调整的一部分，但并不代表公司放弃了BEV（纯电动汽车）。”针对上述车型研发暂停的原因，丰田中国相关工作人员回应称。（每经网）</p>\n  <p><strong>全国首张“无目的地海上游”出入境通行证在上海签发</strong></p>\n  <p>4日，全国首张“无目的地海上游”出入境通行证在上海签发。该证件落地后，游客可依托相关政策实现免办签证、短途出海度假，进一步丰富国内邮轮出游选择。（央视新闻）</p>\n  <p><strong>韩国股市因科技股抛售大幅下挫，创下3月以来最差单周表现</strong></p>\n  <p>韩国股市周五大幅下挫，创下自3月底以来最大单周跌幅，因全球科技股回调及美伊和谈陷入僵局，严重打击了投资者的风险偏好。韩元兑美元汇率跌至2009年以来最低水平，同时债券收益率飙升，促使包括财政部长具允哲在内的政府官员发出口头警告，反对投机性的单边押注。（新浪财经）</p>\n  <p><strong>苹果：全球App Store生态系统规模达1.4万亿美元</strong></p>\n  <p>苹果公司宣布，根据分析集团（Analysis Group）经济学家的一项最新研究，2025年全球App Store生态系统促成的开发者计费与销售额超过1.4万亿美元，创下历史新高。（界面新闻）</p>\n  <p><strong>证监会：下一步将制定落实《指导意见》的三年行动方案</strong></p>\n  <p>36氪获悉，中国证监会新闻发言人就《国务院办公厅关于加强监管防范风险促进私募投资基金高质量发展的指导意见》答记者问。《指导意见》是私募基金领域“1+N+X”制度体系中的方向性、基础性文件。下一步，中国证监会将坚决贯彻党:中央、国务院决策部署，制定落实《指导意见》的三年行动方案，并积极会同宏观政策部门、国:资及行业主管部门、金融管理部门、公安机关、地方政府等，进一步增强责任意识，密切协作形成合力，推动各项任务、工作落地见效。</p>\n  <p><strong>谷歌将在美国得州新建数据中心和能源设施</strong></p>\n  <p>谷歌和Intersect宣布将在美国得州建设Meitner能源中心，该中心将包括一座新的数据中心以及配套的能源发电设施。（界面新闻）</p>\n  <p><strong>中信证券：建议以“AI+能化”的新杠铃结构作为兼顾降波与收益的战略解</strong></p>\n  <p>36氪获悉，中信证券研报表示，当前A股资金缩圈与虹吸、个股收益率分化均已触及历史极值，头部资产与长尾资产的收益率相关系数正逼近0.5的背离临界点。复盘历史，极致缩圈见顶并不决定大盘方向，但相关性背离往往预示着前期抱团的主线步入休整，资金行为与市场情绪面临结构性切换。展望后市，市场能否从极致分化走向系统性收敛，取决于宏观基本面增长与全球流动性能否实现顺畅接力。在宏观外部靴子落地前的模糊期，单纯依赖产业微观叙事已很难打破“缩圈”僵局，建议以“AI+能化”的新杠铃结构作为兼顾降波与收益的战略解。</p>\n  <p><strong>小鹏机器人核心产品一号位施晓鑫6月初主动离职</strong></p>\n  <p>36氪独家获悉，小鹏机器人产品规划高级总监施晓鑫已于6月初正式离职。关于施晓鑫的下一步去向，目前尚不明确。多位信源透露，施晓鑫现阶段无求职意向。知情人士称，施晓鑫已婉拒多家头部机器人企业和造车新势力的邀约，短期暂停职场择业，优先休整。</p>\n  <p><strong>B站宣布启动AI创造公开赛</strong></p>\n  <p>36氪获悉，哔哩哔哩（以下简称\"B站\"）正式启动“build in bilibili · AI创造公开赛”（以下简称B站AI创造公开赛），并公布参赛规则。比赛不设年龄、学历、职业与经验等参赛门槛，并首次将评选权交给用户——所有B站用户均可通过投币、弹幕等方式参与创作并选出认可的产品。</p>\n  <p><strong>英特尔与日立公司合作，推动芯片等制造设施的自动化</strong></p>\n  <p>英特尔将与日本日立公司合作，提高制造设施的机器人良率和能源效率，其中包括这家美国芯片制造商自身的工厂。两家公司周五在声明中表示，英特尔的晶圆厂将使用日立的人工智能服务HMAX Energy。（新浪财经）</p>\n  <p><strong>夸克升级高考志愿填报产品</strong></p>\n  <p>36氪获悉，夸克推出全新升级的高考频道，为千万考生免费提供“高考搜索”“智能选志愿”“志愿表”“志愿报告”等功能。夸克高考志愿工具也将接入千问App。</p>\n  <p><strong>爱彼迎CEO计划创办一家新的人工智能公司</strong></p>\n  <p>据多位知情人士称，爱彼迎首席执行官Brian Chesky正在筹建一家新的人工智能（AI）实验室，这标志着他首次涉足全球AI竞赛。Chesky计划创办一家AI公司以开发人工智能模型，并正在考虑将重点放在用户交互和设计上。（财联社）</p>\n  <p><strong>谷歌计划投放3200万只蚊子，通过不育雄蚊减少繁殖周期内的蚊子总数量&nbsp;</strong></p>\n  <p>近日，谷歌正通过其母公司Alphabet旗下的生物技术公司Verily，寻求美国监管部门的批准，计划在未来两年内在加利福尼亚州和佛罗里达州投放多达3200万只蚊子。</p>\n  <p>这项计划是谷歌长期开展的“调试项目”（Debug Project）的一部分，旨在减少蚊子数量，限制蚊媒疾病的传播。 该项目依赖于释放经过特殊培育、无法产生可育后代的雄蚊。</p>\n  <p>当这些雄蚊与野生雌蚊交配时，蚊卵无法孵化，从而在多个繁殖周期内逐渐减少蚊子的总数量。研究人员希望减少蚊子的数量，从而能够降低蚊子传播疾病的风险。该项目的技术基本原理被称为不育昆虫技术，可以追溯到20世纪50年代，并已成功用于防治果蝇、螺旋蝇和苹果蠹蛾等农业害虫。（现代快报）</p>\n  <p><strong>Anthropic联合创始人称高昂的AI模型开发成本推动公司寻求上市</strong></p>\n  <p>Anthropic PBC联合创始人兼总裁Daniela Amodei表示，开发人工智能模型的高昂成本正迫使像Anthropic这样的公司寻求上市融资。几天前，这家人工智能工具Claude的制造商保密提交了IPO注册文件草案。“训练人工智能模型是一项高度资本密集型的业务，”Amodei周四在彭博科技大会上被问及像Anthropic这样的公司上市的利弊时说道。她补充说，公开市场“非常适合这种情况”。（新浪财经）</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>鸿海5月营收8594亿新台币，为历年同期最高</strong></p>\n  <p>6月5日，鸿海公布，2026年5月营收为新台币8594亿，月增3.28%，年增39.57%，为历年同期最高。2026年累计前5月营收为3.8211万亿，年增31.79%，为历年同期最高。（界面新闻）</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>Quobly完成1.15亿欧元A轮融资</strong></p>\n  <p>法国量子计算公司Quobly宣布完成1.15亿欧元A轮融资，旨在加速其硅基量子计算机的产业化进程，并计划于2026年底前将首款商用产品推向市场。本轮融资由Bpifrance、SEALSQ和意法半导体领投，欧洲创新理事会、Blast、ALIAD以及现有投资者Innovacom参与投资。（界面新闻）</p>\n  <p><strong>开源后端平台Supabase融资5亿美元，投后估值105亿美元</strong></p>\n  <p>开源后端平台（BaaS）Supabase宣布完成5亿美元F轮融资，投后估值达105亿美元。本轮融资由GIC领投，其他投资者包括Accel、Y Combinator、Craft、Felicis、Coatue和金融科技创企Stripe。（新浪财经）</p>\n  <p><strong>“毫秒智控”完成数千万元天使+轮融资</strong></p>\n  <p>36氪获悉，线控底盘核心零部件供应商“毫秒智控”已于近期完成数千万元天使+轮融资，本轮投资方为松禾资本和苏高新融晟。这也是公司成立仅一年以来，继获得厚雪资本天使轮独家投资后，接连完成的第二轮融资。</p>\n  <p><strong>“原力灵机”完成新一轮融资</strong></p>\n  <p>36氪获悉，具身智能企业“原力灵机”近期完成新一轮融资，资方主要为数家大模型公司，包括智谱、阶跃星辰、商汤科技、阿里。此外，华勤、上汽恒旭等产业投资方持续加注。</p>\n  <p><strong>“智美科技”完成近2亿元战略轮融资</strong></p>\n  <p>36氪获悉，“智美科技”宣布完成近2亿元战略轮融资，本轮融资由麦澜德、国石智达资本、老股东共同投资。本轮资金将主要用于深化“皮肤全球大模型”的研发及3D皮肤智能设备的迭代升级，加速与全球产业链伙伴的商业化落地合作，构建皮肤AI智能设备生态体系。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>小米机器人团队在CVPR与ICRA两大国际顶会赛事获双料冠军</strong></p>\n  <p>36氪获悉，6月5日，小米技术宣布，小米机器人团队在CVPR 2026 Workshops和ICRA 2026 WBC斩获双料冠军。据介绍，在CVPR 2026 Workshops中，小米匿名参赛模型“my16”以40.89%的成功率位居榜首，是该赛道中唯一突破40%门槛的模型；在ICRA 2026 WBC中，小米机器人在超市场景下完成16类饮料的货架抓取与购物车放置任务，综合得分99.2分，整体成功率94%，是榜单中唯一超过90%的方案，较第二名高出10个百分点。</p>\n  <p><strong>纳米递送载体将肺癌药利用度提高30倍</strong></p>\n  <p>澳大利亚阿德莱德大学科学家研制出一种新型纳米颗粒递送载体，能将肺癌药物精准靶向肺部，让药物的生物利用度（即所服用药物的剂量能到达体循环的比例）提高30倍，同时大幅减少对健康器官的干扰与损伤。这项突破有望重塑肺癌乃至多种癌症的治疗面貌。（科技日报）</p>\n  <p><strong>曝iPhone 18 Pro首发第二代灵动岛，整体宽度直接缩减了35%&nbsp;</strong></p>\n  <p>据博主爆料，今年下半年登场的iPhone 18 Pro系列将首发苹果第二代灵动岛，正面挖孔的宽度由上代的20.76mm调整到13.49mm，整体宽度直接缩减了35%，这也让iPhone 18 Pro成为苹果有史以来屏占比最高的智能手机。</p>\n  <p>这次能把开孔做小，核心原因是苹果把部分Face ID的核心组件直接隐藏到了屏幕下方，最终成功压缩了正面的开孔面积。这样的改动不仅显著提升了整机的屏占比，也让手机正面的整体视觉感官变得更加精致完整。（快科技）</p>\n  <p><strong>整理</strong>｜开心&nbsp;</p>", "category": "tech", "published_at": "202 斯批准。</p>\n  <p>郭明錤表示，他大约一年前整理的苹果眼镜路线图“已不再是有效的参考”，目前路线图上仅剩两款智能眼镜产品处于活跃开发状态。其中，配备光学波导显示屏的AR/XR智能眼镜已推迟至2029年发布；而不含显示屏、类似Ray-Ban Meta的无显示屏AI眼镜仍按计划于2027年出货。</p>\n  <p>值得注意的是，彭博社记者马克·古尔曼的爆料与郭明錤存在出入。古尔曼此前透露，苹果仍在研发一款更轻薄的头显产品（或命名为“Vision Air”），预计2028年末或2029年亮相，但该品类在那之前将处于“冻结状态”。两人对苹果头显路线的不同判断，或将在下周WWDC开发者大会上得到验证。（IT之家）</p>\n  <p><strong>黄仁勋将首次亮相综艺，由人气喜剧演员刘在石主持</strong></p>\n  <p>6月5日晚，黄仁勋预计将在首尔圣水洞的一家烤肉店，与SK集团会长崔泰源、LG集团会长具光谟（Koo Kwang-mo）以及Naver董事长李海珍（Lee Hae-jin）聚餐会谈。</p>\n  <p>有预测认为，在此次会面中，包括AI半导体议题在内的扩大在机器人技术和物理智能领域合作方案，有可能成为核心议题。</p>\n  <p>在此次访韩期间，黄仁勋还将做客韩国知名脱口秀节目《You Quiz on the Block》。这是韩国收视率最高的脱口秀节目之一，由人气喜剧演员刘在石主持。微软联合创始人比尔·盖茨去年8月访韩时就曾做客这档节目。（第一财经）</p>\n  <p><strong>粉笔CEO张小龙就骂人大学生“活该找不到工作”道歉</strong></p>\n  <p>6月4日，粉笔科技发文：“致中国人民大学师生的道歉信。我是张小龙。在昨日于中国人民大学哲学院的演讲活动中，我因个人言行失当，中途离场并发表不当言论，给在场师生造成了困扰，也破坏了正常的交流氛围。对此，我向所有老师和同学郑重道歉。”</p>\n  <p>此前，粉笔CEO张小龙在中国人民大学哲学院的演讲活动中辱骂学生引发热议。一份网传的现场录音显示，张小龙表示自己没有很多钱，但肯定比现场大部分同学是多一点的，上个月刚把8000万的现金都用来买股票了，挣了5300万。</p>\n  <p>不过，该内容没能引发在场学生共鸣，台下反馈平淡。随着现场互动冷清，张小龙发言风格逐步转变，先后出现“来炫富”等挑衅表述，后续更是高频使用不雅用语，当众辱骂在场学生，包含多类侮辱性词汇，还出现“活该找不到工作”“未来只能进去混日子”等争议言论，发言结束后愤然离场。（新浪科技、鞭牛士）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>英伟达据悉收购初创公司Kumo AI</strong></p>\n  <p>据报道，英伟达已收购成立四年的小型初创公司Kumo AI，后者致力于开发基础模型，旨在做出精准的商业预测。知情人士称，Kumo的三位联合创始人Vanja Josifovski、Hema Raghavan和Jure Leskovec已于上月加入英伟达。（界面新闻）</p>\n  <p><strong>2026年字节AI的四个关键命题：世界模型、Seedance、Coding，以及豆包商业化</strong></p>\n  <p>36氪从多个信源处独家获悉，2026年，字节AI有四个重要的命题：加大对世界模型训练的投入，年底前，模型性能达到现阶段世界模型全球SOTA（最佳）Google Genie 3的水平；视频模型继续保持领先地位，探索“动态生成”等新方向；进一步打好Coding的地基，做好Coding的Dogfooding（数据回流、评测，形成飞轮），提升Agent能力；豆包强化商业化能力，重点场景是“办公”。</p>\n  <p><strong>英国监管机构给谷歌AI搜索“立新规”</strong></p>\n  <p>英国竞争与市场管理局6月3日说，已勒令美国谷歌公司整改其人工智能（AI）搜索服务，允许英国网站运营商和出版商退出谷歌“AI概览”模式，以免其内容和链接被谷歌搜索自动抓取。（新华社）</p>\n  <p><strong>微信正与手机厂商合作推出Agent-to-Agent助手能力</strong></p>\n  <p>微信正在与华为、荣耀、小米、OPPO、vivo等手机厂商合作推出A2A（Agent-to-Agent）助手能力，可通过手机语音助理发起微信的音视频通话，或向好友发送消息。目前，荣耀部分机型已经支持该功能，把YOYO智能体和微信更新到最新版本，即可唤醒YOYO直接语音下达指令，比如语音发微信消息、拨打微信语音、视频通话。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>报告指出：2030年AI耗水量够13亿人用一年</strong></p>\n  <p>联合国大学水、环境与健康研究所周三发布题为《人工智能能耗的环境成本：碳、水和土地足迹》的报告，对人工智能基础设施产生的碳足迹、水足迹和土地足迹进行了量化分析。报告指出，到2030年，全球数据中心用电需求预计将达到945太瓦时，其相关用水量将相当于13亿人一年的基本生活用水需求，而土地占用面积将超过14500平方公里。（网易新闻）</p>\n  <p><strong>中文在线：AI短剧成为第一大Token消耗场景</strong></p>\n  <p>6月3日，中文在线披露的数据显示，AI短剧已成为第一大Token消耗场景。中文在线在机构交流中称：“在国内所有Token消耗份额中，AI短剧与视频生成高居首位，占比达55%；其次是电商与营销(如直播带货、广告营销等)，占比24%；而此前因Vibe Coding(氛围编程)流行而被寄予厚望的软件开发领域，在Claude等编程能力的推进下也仅占15%。AI短剧与视频生��的Token消耗量已达到软件开发的两倍以上，成为整个Token经济学中绝对的第一大核心消耗场景。”（21财经）</p>\n  <p><strong>高盛预计SpaceX到2030年将“烧掉”3500亿美元现金</strong></p>\n  <p>高盛预计SpaceX到2030年将“烧掉”3500亿美元现金，资本支出的80%将用于人工智能。（财联社）</p>\n  <p><strong>苹果：全球App Store生态系统规模达1.4万亿美元</strong></p>\n  <p>苹果公司宣布，根据分析集团（Analysis Group）经济学家的一项最新研究，2025年全球App Store生态系统促成的开发者计费与销售额超过1.4万亿美元，创下历史新高。（界面新闻）</p>\n  <p><strong>门店教唆车主无牌夜骑，张雪直播间回应：立即关店</strong></p>\n  <p>6月3日，在张雪机车直播间连线中，有用户向张雪本人反应，其在河北承德张雪门店购买的820RR车型因合格证丢失，导致无法上牌上保险，门店却教唆他“晚上偷着骑，交警追不上”。对此张雪在直播中表示，“这种店留着祸害用户，直接关店。”</p>\n  <p>4日，记者联系到当事摩友王先生，3月12日，820RR未正式售卖前，他就在张雪机车承德门店交了3000元定金。3月21日车辆正式对外发售，他抢到1869号，等到6月1日晚上才提车。但没想到门店将车辆合格证丢失，导致无法给车上牌上保险，也无法上路。提车次日，他在与门店沟通车辆合格证情况时，发生上述情形。王先生向记者表示，“张雪的办事速度确实快，现在车辆合格证已经发出来了，想要的补偿是希望张总在车上签个名。”（界面新闻、极目新闻）</p>\n  <p><strong>SpaceX已启动IPO路演，预计每股价格为135美元</strong></p>\n  <p>SpaceX已启动首次公开募股（IPO）路演，拟向公众发行555555555股A类普通股。散户投资者将能够以与大型机构相同的价格参与，预计SpaceX每股价格为135美元。拟授予承销商30天期权，可额外购买最多83333333股A类普通股。已申请将其A类普通股在纳斯达克全球精选市场和纳斯达克德克萨斯上市，股票代码为“SPCX”。高盛、摩根士丹利、美银证券、花旗、摩根大通、巴克莱及其他公司将担任本次发行的账簿管理人。（财联社）</p>\n  <p><strong>擅用“LABUBU”相近标识商业推广，泡泡玛特告奈雪的茶获赔32万</strong></p>\n  <p>记者获悉，近日，北京市朝阳区人民法院就泡泡玛特诉奈雪的茶不正当竞争纠纷案作出一审判决，认定深圳市品道餐饮管理有限公司（奈雪的茶所属公司）构成不正当竞争，判令其赔偿北京泡泡玛特文化创意有限公司经济损失30万元及维权合理开支2万元。双方均未上诉，判决现已生效。</p>\n  <p>记者了解到，本案起因于2025年9月。2025年9月，奈雪的茶在旗下门店、微信公众号及小程序推出一波主题营销活动，将多款茶饮命名为“米布布”，宣传图文使用了“LABUBU（拉布布）”美术形象，并打出“喝米布布抽LABUBU”“布布们集合！免费喝布布，抽LABUBU！”“MIBUBU带上布布免费喝布布”等宣传用语。随后，泡泡玛特诉称，奈雪的茶未经许可，擅自使用与“LABUBU”相同或近似的标识进行商业推广，容易使相关公众误认为双方存在商业合作关系，构成不正当竞争。（北京日报）</p>\n  <p><strong>孙正义失去亚洲首富头衔，2日刚重登亚洲首富</strong></p>\n  <p>福布斯实时富豪榜4日数据显示，软银集团创始人兼CEO孙正义单日个人财富缩水13%，个人净资产一日蒸发132亿美元，最新身价回落至871亿美元，排名滑落至印度富豪安巴尼、阿达尼之后。与此同时，软银集团（SBG）股价于近三日内累计跌超17%，截至发稿报7414日元，总市值约42.35万亿日元，为存储巨头铠侠所超越，失去“日本市值第一”的席位。6月2日，孙正义时隔十余年再度登顶亚洲首富宝座。（新浪科技）</p>\n  <p><strong>小红书启动金融专业号治理专项行动，处置非法诱导跨境投资等违规内容</strong></p>\n  <p>小红书从6月3日起，对金融领域认证专业号开展专项治理行动。依据相关法律法规及平台规则，金融类认证仅向持有合规牌照的机构发放，平台认证专业号的昵称命名须与认证主体实际业务范围严格匹配，不得以虚假、误导性信息获取认证标识。近一周，小红书已经处置1500余个违规金融专业号，并将持续、全面加固对公验证校验机制，展开专项针对存量账号的常态化巡查及处置。</p>\n  <p>工作人员介绍，5月以来，小红书平台共处置涉金融领域违规及无金融相关资质营销账号3.1万个，包括针对非法诱导跨境投资问题，共处置非法诱导跨境投资等违规笔记539条、评论146条；针对外资投行研报低价倒卖行为，共处置相关违规笔记141篇，冻结相关商品132件。此外，平台还处理涉嫌黄金金融营销宣传信息、境外平台境内展业宣传等涉嫌违规信息130余条。（证券时报）</p>\n  <p><strong>腾讯客服回应与华为、小米等合作</strong></p>\n  <p>有报道称，微信正在与华为、荣耀、小米等多家手机厂商合作推出A2A（Agent-to-Agent）助手能力，可通过手机语音助理发起微信的音视频通话，或向好友发送消息。</p>\n  <p>对此，腾讯客服表示，微信正在与华为、小米、荣耀、OPPO等手机厂商合作推出A2A助手能力。目前已有多家厂商完成接入，“您可以通过对应手机系统的AI助手发起微信音视频通话或向指定好友发送消息。该功能基于A2A（Agent-to-Agent）协作机制，数据安全与隐私通过双重授权机制保障。合作旨在将微信高频沟通功能融入手机系统助手，为您提供更便捷的使用体验。”（北京日报）</p>\n  <p><strong>特斯拉修改FSD购买协议：新增“需人��监督”条款，并限制车主查阅原始合同</strong></p>\n  <p>据Electrek报道，特斯拉修改了FSD购买协议，在协议中新增了车主当初购买产品时原本不存在的“需人工监督”相关条款；此外，部分车主的原始协议文档已彻底无法查看。</p>\n  <p>Electrek已向多名车主核实了该问题。涉事合同签署时间集中在2016年至2024年初，彼时特斯拉售卖的套件标注为“全自动驾驶功能”，协议中没有任何“需人工监督”的表述，暗含车辆可实现无监督自动驾驶的承诺。（IT之家）</p>\n  <p><strong>黄仁勋一句话让Marvell市值暴涨620亿</strong></p>\n  <p>6月2日，在COMPUTEX 2026（台北国际电脑展）上，英伟达CEO黄仁勋和Marvell的CEO马特·墨菲同台对谈。在对话中，黄仁勋盛赞Marvell在AI基建供应链中的价值，称Marvell注定将成为“下一家万亿美元公司”。</p>\n  <p>黄仁勋解释道，Marvell的高速光电连接技术和网络芯片对数据中心至关重要，因为在数据中心里，计算任务会分散到成千上万颗相互连接的芯片上，而这些芯片需要快速共享数据。他还表示，未来5到10年，行业仍将使用大量的铜缆，同时使用海量的光器件。</p>\n  <p>2日当天，Marvell股价大涨32.52%收于每股290.79美元，创下公司自2000年以来最大单日涨幅，总市值2543.8亿美元，一日增长超过620亿美元。今年以来，公司股价涨幅已达到惊人的225.30%。（澎湃新闻）</p>\n  <p><strong>神农旅游集团就国道收费进行道歉</strong></p>\n  <p>据中国交通广播此前报道，多位听众播反映，湖北神农架林区存在涉及违规封堵省道收费、限制社会车辆通行等情况。</p>\n  <p>6月3日，湖北神农旅游投资集团有限公司发布关于神农顶景区过境车辆通行的说明：近期，我们关注到网络上关于G347国道（神农顶段）车辆通行受限的相关报道，对此我们诚恳表示歉意，对过境车辆实行全天候无条件自由通行。同时，我们将积极接受社会各界监督，全力配合相关部门开展调查核实。（新华网财经）</p>\n  <p><strong>OpenAI首席财务官谈公司AI设备：今年年底前将正式发布</strong></p>\n  <p>OpenAI首席财务官Sarah Friar日前在受访时透露，已经亲自体验过OpenAI的AI设备。她表示到“今年年底之前”OpenAI将正式发布这款产品。此前，OpenAI曾在一份文件中表示，预计最早也要到2027年2月才会开始发货。（财联社）</p>\n  <p><strong>国家发改委：自4日24时起，国内汽、柴油（标准品）价格每吨分别下调525元、505元</strong></p>\n  <p>36氪获悉，据国家发改委消息，根据国际市场油价变化情况，自4日24时起，国内汽、柴油（标准品）价格每吨分别下调525元、505元。</p>\n  <p><strong>美国火星大气探测器MAVEN任务终结</strong></p>\n  <p>美国航空航天局3日宣布，在火星轨道已运行超过11年的探测器“火星大气与挥发物演化任务”（MAVEN）正式结束。MAVEN探测器于2013年11月发射升空，2014年9月进入火星轨道，原计划任务期一年，此后持续运行并多次延长任务。该探测器2025年12月6日最后一次与地面通信后失联，已无法继续正常运行。美国航空航天局当时表示，MAVEN在绕过火星背面后未能恢复信号。（新华社）</p>\n  <p><strong>美国原油库存连续六周下降</strong></p>\n  <p>据美国方面消息，美国能源信息局3日公布的数据显示，由于原油出口量增加并且炼油厂接近满负荷运转、持续消耗原油库存，美国原油库存已连续六周下降。数据显示，截至5月29日，美国的商业石油库存规模和战略石油储备规模较一周前相比，分别减少了约800万桶。报道指出，这一数字远高于分析家此前预测的降幅。（央视新闻）</p>\n  <p><strong>分析师：韩本土企业债发行有望下半年回暖，韩国央行年内将两次加息</strong></p>\n  <p>韩亚证券信用分析师Sang-man Kim表示，受韩国央行加息预期影响，短期融资渠道性价比下降，韩国上半年低迷的本土企业债发行规模或将在下半年回暖。 Sang-man Kim于周四发布研报称，上半年地缘风险叠加收益率上行，投融资双方均规避长期限企业债券。韩亚证券预判韩国央行年内将两次加息，2027年初再加一次息。不过本轮发债回暖或难以持久，发债主体将集中于高信用评级企业。（新浪财经）</p>\n  <p><strong>优步人力部门裁员近四分之一，CEO称“此番调整势在必行”</strong></p>\n  <p>在新任总裁吉尔・黑泽尔贝克主导的组织精简改革下，优步人力部门裁员23%，涉及招聘、人事全条线员工。CEO达拉・科斯罗萨西在内网备忘录中写道：“为最大化人力团队效能、释放公司未来发展潜力，本次组织调整必不可少。”本次被裁岗位集中在招聘与人力资源板块。优步未披露具体裁员人数，但企业发言人表示，本次裁减人员占公司3.4万名总员工的比例远低于1%。（新浪财经）</p>\n  <p><strong>现代汽车与英伟达商讨在韩设立人工智能研发中心</strong></p>\n  <p>韩国经济日报援引匿名政府及业内人士消息：现代汽车联合韩国政府正与英伟达就落地韩国人工智能技术中心进入最终磋商阶段，新万金成为选址首选。该研发中心将是英伟达级别顶尖的研发基地，这类高规格基地目前仅布局在新加坡、中国台湾等少数地区；英伟达去年10月已与现代汽车签署谅解备忘录，约定供应GPU芯片并共建AI研发中心。（新浪财经）</p>\n  <p><strong>SpaceX获德州税收优惠，Terafab芯片项目获推进</strong></p>\n  <p>SpaceX为其提议的Terafab半导体制造项目获得了得克萨斯州格里姆斯县的税收减免，该设施在完全建成后的预计成本至少为550亿美元，甚至可能高达1190亿美元。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>思特威：向特定对象发行股票的注册申请获中国证监会同意批复</strong></p>\n  <p>36氪获悉，思特威公告，公司于近日收到中国证券监督管理委员会出具的《关于同意思特威（上海）电子科技股份有限公司向特定对象发行股票注册的批复》，同意公司向特定对象发行股票的注册申请。</p>\n  <p><strong>Anthropic选定摩根士丹利和高盛牵头IPO，最快10月上市</strong></p>\n  <p>人工智能公司Anthropic已选定摩根士丹利和高盛集团担任其首次公开募股的主承销商，摩根大通也将参与此次交易。据知情人士透露，这家旗下拥有Claude聊天机器人的AI巨头正考虑最快于今年10月上市，并已秘密向美国证券交易委员会提交了IPO注册声明。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>Quobly完成1.15亿欧元A轮融资</strong></p>\n  <p>法国量子计算公司Quobly宣布完成1.15亿欧元A轮融资，旨在加速其硅基量子计算机的产业化进程，并计划于2026年底前将首款商用产品推向市场。本轮融资由Bpifrance、SEALSQ和意法半导体领投，欧洲创新理事会、Blast、ALIAD以及现有投资者Innovacom参与投资。（界面新闻）</p>\n  <p><strong>“星灿智能”获力合科创千万级天使+轮投资</strong></p>\n  <p>近日，家庭具身智能企业“星灿智能”（XCANBOT）完成千万级天使+轮战略融资，由A股科创平台力合科创投资。至此，公司已获山东亚华电子、浙江亚特、力合科创三大上市产业资本投资。团队核心成员来自头部自动驾驶企业，核心产品为自研XcanBrain具身大模型与5D全域空间感知系统。区别于传统机器人远程遥控、单视角采集存在盲区、数据固化滞后的短板，星灿依托实景无盲区数据闭环实现模型持续自进化。其双赛道产品已完成市场验证，在手订单破亿元，即将规模化量产。</p>\n  <h2>酷产品</h2>\n  <p><strong>苹果智能眼镜推迟至2029年，无显示屏AI眼镜仍将于2027年推出</strong></p>\n  <p>知名苹果分析师郭明錤近日发布最新供应链调查，大幅调整了苹果头戴式产品的路线图。据悉，即将接任苹果CEO的约翰·特努斯已批准了一项重大战略调整，取消Vision Pro后续产品的开发，将资源集中于更具大众市场潜力的智能眼镜品类。根据郭明錤公布的最新路线图，苹果目前仅有两款智能眼镜产品处于活跃开发状态。其中，配备光学波导显示屏的AR/XR智能眼镜已推迟至2029年发布；而不含显示屏、类似Ray-Ban Meta的AI眼镜仍按计划于2027年出货。（新浪财经）</p>\n  <p><strong>iPhone 18 Pro系列将首发苹果第二代灵动岛</strong></p>\n  <p>据博主爆料，今年下半年登场的iPhone 18 Pro系列将首发苹果第二代灵动岛，正面挖孔的宽度由上代的20.76mm调整到13.49mm，整体宽度直接缩减了35%，这也让iPhone 18 Pro成为苹果有史以来屏占比最高的智能手机。（快科技）</p>\n  <p><strong>整理</strong>｜徐嘉彤</p>", "category": "tech", "published_at": "2026-06-04T23:46:55+00:00", "fetched_at": "2026-06-05T02:58:18.994177+00:00", "fingerprint": "c02c3363d15fcd3a"}, {"source": "36氪 - 最新文章", "title": "国家队下场做AI虚拟细胞，「百曜科技」完成数千万元新一轮融资｜36氪首发", "url": "https://36kr.com/p/3835460873385348?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，AI虚拟细胞（AIVC）平台公司「百曜科技」近期已完成数千万元新一轮融资。本轮融资由国家级国有资本运营平台中国国新旗下的国新创投基金领投，道彤资本和云启资本跟投，老股东峰瑞资本和百度风投追加投资。募集资金将主要用于全新一代虚拟细胞算法模型迭代、独家数据收集平台建设以及加速产业化落地。</p>\n  <p>百曜科技是36氪持续追踪报道的企业（<a href=\"https://36kr.com/p/3519810822249601\" rel=\"noopener noreferrer\" target=\"_blank\">附链接</a>），公司创始团队依托中国科学院动物研究所、北京干细胞与再生医学研究院的科研资源，自2023年起开始构建AI虚拟细胞基础大模型，以实现细胞行为和状态变化的精准分析及预测，并持续推进AIVC模型升级和产业化落地实践。</p>\n  <p>2026年来，AI制药赛道的融资热情持续高涨，且行业关注点正逐步从早期的分子筛选单点突破，逐步转向更深层的细胞级生命系统建模和动态模拟。与聚焦于分子构型优化的AI药物发现不同，AIVC的价值可覆盖药物开发全生命周期：从疾病机制解析、靶点发现、候选药物虚拟筛选、临床前药效与毒性预测，到临床患者分层，其核心突破在于将AI建模层级从“分子”提升至“细胞”，直接模拟生命系统对外界干预的动态响应。</p>\n  <p>AIVC基于海量单细胞多组学数据进行训练，通过学习细胞状态转换规律、基因调控网络以及跨尺度因果关系，构建能够表征细胞行为和命运演化的基础模型（Foundation Model）。研究人员只需输入细胞初始状态（如诱导多能干细胞、免疫细胞或肿瘤细胞）以及特定扰动条件（如药物作用、基因编辑或环境变化），模型即可预测细胞未来的状态转变，包括增殖、分化、衰老、凋亡及疾病进展等关键生物学过程。</p>\n  <p>这种能力使科研人员能够在数字环境中预先开展大规模虚拟实验，优先筛选出最具成功概率的研究假设，再通过湿实验进行精准验证。由此，研发流程从传统的“实验驱动”逐步转变为“模型驱动”，有望显著降低研发成本、缩短开发周期，并提升药物研发的整体成功率。</p>\n  <p>从产业发展趋势看，AIVC正在从单纯的研发工具演变为生命科学领域的新型基础设施。正如大语言模型重塑了信息处理方式，AIVC有望成为理解、预测和设计生命系统的核心平台，为下一代药物研发、细胞治疗和合成生物学提供底层能力支撑。得益于此，ARK Invest曾在《Big Ideas》报告中发表观点称，虚拟细胞将是“未来AI+生命科学最具有颠覆性的领域之一”。</p>\n  <p>当前，一级市场的资金流向在慢慢验证这个判断。百曜科技创始团队表示，本轮融资获得国家级国有资本运营平台、市场化科技与医疗资本的认可，将帮助公司快速完成全新一代基础模型和扰动模型，落地自产数据集平台建设与独家数据集合作。在确保AIVC核心能力的基础上，率先探索产业应用场景，布局先进细胞治疗和“AIDD plus AIVC”,加速“模型-数据-场景”的产业链闭环。</p>\n  <p>据悉，早在2023年9月，创始团队就已发布知识增强多物种细胞大模型GeneCompass，并作为封面文章发表于《Cell Research》。该模型是拥有过亿单细胞数据量、知识嵌入的通用虚拟细胞基座模型；2025年，团队进一步升级发布CellGraphCompass模型，将图结构算法和先验知识系统化应用于虚拟细胞建模。同年，基于基础模型构建的扰动模型帮助创始团队在全球虚拟细胞挑战赛中获得预赛全球第一，决赛全能榜单全球第二的成绩。</p>\n  <p>此外，百曜科技在数据方面也有大量沉淀。除依托创始团队经4年积累的全球大规模AI-ready公共数据集用以训练基础模型之外，团队还将在近期落地自产数据集技术，收集适配AIVC模型训练的高质量时间连续性扰动数据集，并开展大规模临床数据合作自产数据集项目。</p>\n  <p>应用层面，百曜科技已与海内外合作伙伴在模型部署、细胞治疗管线联合研发、早期靶点发现及临床样本精准分层等场景推进落地。</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>中国国新相关负责人表示，国新基金长期关注兼具硬核技术壁垒与国家战略价值的创新赛道。AI虚拟细胞技术作为生物医药产业的底层基础设施，深度契合国家'十五五'规划中人工智能+行动的战略部署。我们看好百曜团队在该领域的深厚技术积淀与持续创新能力，期待公司持续以AI驱动生命科学研究范式变革，释放长期价值。作为国新基金的首个天使轮投资项目，我们将倾力支持百曜科技打通“模型研发-场景验证-产业落地”全链条通道，为我国构建自主可控的AI制药技术体系提供关键支撑。</p>\n  <p>财务顾问明德资本合伙人胡茗译表示，AI虚拟细胞是新一代生成式人工智能模型在生命科学领域中的重大突破，将让学届与产业界拥有更全局、更精准、更高效的手段，来模拟药物分子与人体复杂生命系统在虚拟世界的交互，这会在当下全球医药行业对AI普遍广泛接受的基础上，迸发出更底层也更强大的商业机会。很高兴看到百曜获得国家队基金与专业医疗与科技基金的鼎力支持，持续构建数据基础设施并引领模型的不断突破。</p>\n  <p>财务顾问点石资本合伙人黄峻表示，虚拟细胞代表着AI for Life Science领域最富想象空间的前沿方向。百曜是国内极少数从native底层架构出发、自主构建细胞基础模型的团队，进度超前。依托中科院深厚的科研积淀，以国际顶级期刊成果和全球赛事验证实力，百曜兼具深厚的数据资产壁垒与领先的原创算法能力。我们坚信，它将成长为这一赛道的领跑者。</p>", "category": "tech", "published_at": "2026-06-05T00:30:00+00:00", "fetched_at": "2026-06-05T02:58:18.994171+00:00", "fingerprint": "727902c8d245c56e"}, {"source": "36氪 - 最新文章", "title": "为什么库里没有选择安踏？", "url": "https://36kr.com/p/3836116289877385?f=rss", "summary": "<p>文｜贺哲馨</p>\n  <p>编辑｜乔芊</p>\n  <p>2026年6月2日，NBA现役金州勇士队球星斯蒂芬·库里（Stephen Curry）在其个人社交媒体上宣布，个人品牌“库里品牌”（Curry Brand）将与李宁正式签约。</p>\n  <p>ESPN援引知情人士称，这份合同有效期长达十年，内容涵盖篮球产品、运动休闲服饰、库里以个人品牌签约运动员的权利，以及完整的高尔夫球杆产品线，合同具体金额未披露。</p>\n  <p>李宁由此成为库里自2025年11月结束与安德玛（Under Armour）十二年合作之后的新东家。值得注意的是，在李宁之前，安踏也曾与库里方面有过接触，也有一度达成合作的传言，但最终未能成型。有媒体推测，除了报价之外，真正让天平倾向李宁的是后者愿意给出的自主权，这是一个比金额更难复制的筹码。</p>\n  <p><strong>这其实非常符合库里“不选主流品牌”的一贯逻辑。</strong>十三年前，库里没有与耐克续约，转投了当时还是运动品牌“新秀”的安德玛（Under Armour）。一个被反复讲述的版本是：耐克旗下明星众多，在那场著名的提案会上，对方读错了库里的名字，PPT里还留着别家球员的痕迹，让他觉得自己未被足够重视。安德玛“捡了漏”，并把这段往事当作品牌叙事，讲了许多年。</p>\n  <p>起初，库里也只是安德玛的签约球员。2020年11月，他在安德玛体系内获得了自己的同名子品牌“Curry Brand”，此后推出了从Curry 8到Curry 13的多代签名鞋，在成都开出首家品牌单店，并签下了以德阿隆·福克斯（De'Aaron Fox）为代表的代言球员。</p>\n  <p>更关键之处在于，当库里在2025年与安德玛分手时，他把这个独立品牌一并带走了。根据双方协议，库里保留了Curry Brand的全部商标与知识产权，并可自由寻找新的零售伙伴；安德玛则将这次分离纳入一项总额最高约2.55亿美元的重组计划之中。</p>\n  <p><strong>传统运动品牌签约明星，本质上是购买流量和影响力。而李宁签下库里，本质上是要拿出公司的供应链与研发资源，去为一个并不属于自己的独立品牌“做嫁衣”。</strong>而且在未来某一天，这份资产同样可能被再次打包带走。这样一份看上去并不对等的条约，显然不是人人都愿意接受的。</p>\n  <p>库里对签名产品的深度参与，进一步放大了这种“为他人作嫁”的属性。两年前的专访中，库里时曾对36氪谈及Curry 12的研发过程。从最初的二维草图，到三维建模，再到最终样品，库里都会深度介入。</p>\n  <p><strong>“如果我说我不喜欢某个设计，他们就需要重新调整。”</strong>库里当时表示。这意味着，任何与Curry Brand合作的企业，不仅要投入资源，更需要让渡相当程度的话语权。</p>\n  <p>过去几年，为应对增长压力，安德玛持续推进组织精简和成本控制。虽然品牌曾为Curry Brand在成都落地独立门店，但后续投入力度明显趋于谨慎。对于希望进一步扩张个人品牌版图的库里而言，这显然难以满足需求。</p>\n  <p>回到交易本身。按照库里不走寻常路的签约方式，决赛圈里的李宁显然是愿意给出更多筹码的那一个。</p>\n  <p>安踏早已不缺NBA球星。它在2014年从耐克手中签下克莱·汤普森，KT系列已出到第十代，是现役NBA球员与中国品牌合作时间最长的签名鞋系列；2023年又签下凯里·欧文（Kyrie Irving），为其打造KAI系列，并任命他为首席创意官。算上戈登·海沃德等人，安踏签约的NBA球员已逾十名，是签约NBA球员最多的中国品牌。</p>\n  <p>对于安踏而言，库里无疑是极具价值的资产，但并非不可替代。对库里来说，加入安踏，意味着他不会是这里唯一的当家球星，资源必然被摊薄；而安踏的KAI、KT系列也已积累起自己的销量与受众，在海外市场亦有渠道基础——库里的到来，更像是锦上添花，而非雪中送炭。</p>\n  <p>自2019年德维恩·韦德（Dwyane Wade）退役后，李宁在NBA赛场长期缺少具有全球影响力的头部代言人。其篮球资源更多集中于CBA体系和国内市场。将库里纳入版图之后，Curry Brand可以享受李宁篮球资源几乎全部的投入；更重要的是，库里保留了为Curry Brand签约球员的权利——这是一项分量极重的条件，而它显然更可能在一个“别无选择”的伙伴那里得到满足。</p>\n  <p>可能的资源冲突还不止于篮球。Curry Brand的版图除篮球外还覆盖高尔夫——接近职业生涯尾声的库里，最大的爱好之一正是高尔夫。而安踏此前已通过FILA、迪桑特在高尔夫品类上深度布局，一旦签约，库里品牌的高尔夫产品线几乎注定与集团内部品牌正面相撞。而在李宁这边，这片市场几乎是空白。</p>\n  <p>对于长期希望提升海外影响力的李宁而言，这几乎是一条此前并不存在的路径。李宁与库里在签约美国顶尖大学及高中体育明星方面，拥有一个近乎空白的广阔市场——甚至可能达成一些覆盖整个学校的赞助协议，这对李宁来说意义重大。</p>\n  <p>财务数字也印证了双方对这一纸合同需求的不对称。</p>\n  <p>2025年，安踏体育营收达802.2亿元，同比增长13.3%；若计入控股的亚玛芬体育，集团总收入早在2024年便已突破千亿。它旗下握有始祖鸟、萨洛蒙、威尔胜等一众品牌，迪桑特、可隆等“其他品牌”全年保持高速扩张。安踏在中国运动鞋服市场的份额约为23%，稳居第一，全球跻身前三。对这样一家“手握多牌、业绩向上”的公司而言，库里不过是众多选项中的一个。</p>\n  <p>李宁则是另一番光景。2025年，李宁营收295.98亿元，同比增长3.2%，创历史新高，净利润29.36亿元，净利率9.9%——稳健，但增速温和，体量不及安踏体育的四成。在它的牌面里，库里几乎是唯一一张能即刻撬动全球篮球叙事的王牌。</p>\n  <p>换句话说，李宁对库里的需求，远远大过库里对李宁的需求——而这恰恰是库里理想中的签约对象。实际上，此次合作消息由库里本人发布，而非行业惯例中的品牌方口径，也非双方共同宣布，这已充分证明此次合作的天平倾向了库里。</p>\n  <p>不难发现，库里本人对Curry Brand的野心，一如当年乔丹对Jordan Brand。问题是，李宁能否把库里塑造成下一个乔丹，仍有待时间检验。目前看来，至少存在两重障碍。</p>\n  <p>其一，是其商业模式的不可复制。耐克与乔丹在1984年开创了史无前例的球星提成模式：每卖出一双乔丹鞋，乔丹本人都能从中抽成。各方估算这一比例约为5%（也有更保守的4%一说），仅2024年就为乔丹带来约3亿美元收入。Jordan Brand的营收已从2018年的约28亿美元，增长到2024年的约70亿美元，占耐克总营收的13.6%——它实际上已是一个寄生于耐克体内的独立品牌（这一说法也经过了耐克内部人士的确认）。这套模式至今没有被任何运动品牌复制，连耐克自己也没有再签下“第二个乔丹”。或许，耐克也正是为了不再让渡更多的品牌主导权。</p>\n  <p>其二，是篮球生意本身的回报率今非昔比。即便横空出世一位类似乔丹的明星，也几乎不可能复刻当年Jordan Brand的辉煌。李宁要面对的，是一个正步入缓慢增长期的运动品类。如何把库里，连同他那个会“做嫁衣”、且随时可能被带走的独立品牌真正转化为品牌的增长引擎，而非一笔昂贵的营销开支，或许才是这桩十年合约最终的考验。</p>\n  <p>如果成功，这将成为中国运动品牌全球化进程中的标志性案例；如果失败，它也会成为行业重新审视“超级球星+独立品牌”模式的一次昂贵试验。</p>", "category": "tech", "published_at": "2026-06-05T00:49:39+00:00", "fetched_at": "2026-06-05T02:58:18.994164+00:00", "fingerprint": "c087f36a2ce16829"}, {"source": "36氪 - 最新文章", "title": "硬氪独家 | 唐文斌「原力灵机」并购物流机器人公司，并获智谱、商汤、阶跃等投资", "url": "https://36kr.com/p/3838835333253385?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪独家获悉，具身智能企业「原力灵机」近期完成新一轮融资，资方主要为数家大模型公司，包括<strong>智谱、阶跃星辰、商汤科技。</strong>此外，<strong>华勤、上汽恒旭</strong>等产业投资方持续加注<strong>。</strong></p>\n  <p><strong>「原力灵机」</strong>是一家通用具身大模型公司，2025年3月由旷视科技联合创始人兼CTO<strong>唐文斌</strong>创立，团队核心创始成员为旷视科技原班人马。</p>\n  <p>有意思的是，此次融资也是商汤、旷视这两家曾经的对手，在具身智能的热潮中罕见“会师”；</p>\n  <p>另外，算上A+轮独家领投的<strong>阿里</strong>，这也是具身智能赛道罕见同时聚齐国内四家大模型厂商——此前，智谱仅通过Z基金小范围投资具身智能领域，阶跃星辰则几乎未出手具身智能。</p>\n  <p>而这一集体动作也释放出一个信号，当<strong>大模型竞争的主战从Token向Action转移</strong>，拥有物理世界交互能力的具身模型，已成为模型公司们锚定的下一片高地。</p>\n  <p>伴随着此次融资，唐文斌也在兵合一处，着手整合机器人资产。</p>\n  <p><strong>硬氪独家获悉，「原力灵机」近期通过股权并购方式，完成了与「Atomix」（原力聚合）物流机器人的合并，</strong>剑指具身智能的大规模落地与全球化扩张。</p>\n  <p>「<strong>Atomix</strong>」的业务基因最早可以追溯到2016年——彼时，唐文斌在旷视科技内部主导智慧物流与机器人调度业务（河图系统），主推多形态物流机器人解决方案。</p>\n  <p>直到2024年7月，随着旷视业务变化，唐文斌将物流机器人业务从旷视体系剥离独立，并成立「<strong>Atomix</strong>」。</p>\n  <p>经过几年的探索，「<strong>Atomix</strong>」的托盘四向车销量已达全球第二，累计服务项目超过500个，客户包括优衣库、蜜雪冰城、宁德时代等，<strong>公司年营收近十亿</strong>。</p>\n  <p>随着具身智能硬件供应链趋近成熟，行业已经逼近那堵必须逾越高墙：具身大脑。相比语言模型进化路径的清晰，具身智能模型当下甚至找不到低成本、海量且高质量的数据，遑论找到收敛的训练范式。可以说，整个行业都在混沌之中摸索。</p>\n  <p>这种情况下，<strong>本体、大脑、数据的整合，或许成为具身赛道的新常态&nbsp;</strong>。</p>\n  <p>一直以来，具身智能行业的理想状态是打造真正的数据飞轮。而实际情况是，行业正处于“数据死结”状态——模型需要真实场景里的错误数据来推进进化，而若没有好模型的武装，机器人无法进场景，也就无法采集真实的数据。</p>\n  <p>因此，有消息人士称，两家公司的合并，本质上是闭环模型与场景，打开数据死结。</p>\n  <p>正如唐文斌此前在采访中提到，Picking（抓取）正是具身智能时代的“原子任务”——Picking之于具身智能，正如Coding之于大模型，而「<strong>Atomix</strong>」正像是一台连续运转的Picking数据发动机。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_ca53593da2bd49cfa7683019c3e61d37@1199336245_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">「原力灵机」机器人 做早餐 （图源/企业）&nbsp;</p>\n  <p>据了解，在未来，<strong>「Atomix」在超20个国家、500多个项目里跑出来的真实数据，将直接成为「原力灵机」模型训练的燃料；而「原力灵机」所训练的具身智能模型，也将快速实现跟「Atomix」现有机器人进行协同作业。</strong></p>\n  <p>这一构想或许并非空中楼阁，而是建立在一定的技术底座之上。在此之前，「原力灵机」已经推出了通用具身大模型“DM0”。</p>\n  <p>唐文斌此前接受采访时提到，在数据层面，「原力灵机」已完成了业内首次“三类数据大融合”——将互联网语义、智能驾驶物理规则、机器人实操数据进行混合训练，提升数据的规模与质量。</p>\n  <p>而这种跨域混合训练的方式，使得“DM0”跳出了对特定硬件参数的依赖，像一位经验丰富的“老司机”，在海量异构数据中抽象出了通用的物理规律，并且能够无视硬件差异，在多种不同构型的机器人本体间迁移，实现通用的操作逻辑。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_2973303acc0647c283f75291a74610fe@1199336245_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">「原力灵机」机器人 在调酒 （图源/企业）&nbsp;</p>\n  <p>更关键的是，「原力灵机」���试图将大模型的“思维链推理”延伸至物理空间——这也使得，“DM0”仅用2.4B的小参数规模，就实现了突破亚毫米级的精细操作，在长程连续任务中的成功率大幅提升。</p>\n  <p>通过一系列组合拳，“DM0”正试图打破传统具身模型数据单一、换机即瘫、参数臃肿的痛点。</p>\n  <p>此次合并、融资后，中国的具身智能行业正迎来一位强劲玩家。更重要的是，这也提示行业正进入下一个阶段——寻找到具身模型的scaling law。</p>\n  <p>这绝非仅靠堆砌机器人本体就能逾越的险隘。</p>\n  <p>就在本周，媒体披露字节跳动正重金招募具身智能技术负责人，目标直指头部创业公司的核心技术骨干；与此同时，海外具身智能明星企业Skild AI也刚完成了对Zebra（斑马技术）机器人自动化业务的并购。</p>\n  <p>海内外巨头的动向如出一辙——随着本体制造商、数据资产方、模型研发者、场景运营方开始加速聚拢，行业正式进入深水区。</p>\n  <p><strong>首页图源｜网络</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260604/v2_34c2c70747ed4937b47ab288bf42e177@1199336245_oswg53536oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>", "category": "tech", "published_at": "2026-06-05T01:00:00+00:00", "fetched_at": "2026-06-05T02:58:18.994156+00:00", "fingerprint": "f6dcd6fa0f414f58"}, {"source": "36氪 - 最新文章", "title": "前华为员工创业线控底盘，曾参编国标，获松禾、苏高新投资丨36氪首发", "url": "https://36kr.com/p/3839600052898054?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，线控底盘核心零部件供应商毫秒智控已于近期完成数千万元天使+轮融资，本轮投资方为松禾资本和苏高新融晟。这也是公司成立仅一年以来，继获得厚雪资本天使轮独家投资后，接连完成的第二轮融资。</p>\n  <p>毫秒智控2025年4月成立于上海，专注于线控转向（SBW）系统及核心电控部件的研发与生产。</p>\n  <p>毫秒智控的核心竞争力，源于其极度稀缺的团队基因。创始人兼 CEO李杰是线控转向新国标修订的联合牵头人，在集度汽车任职期间作为企业方核心代表，全程深度参与了标准的制定工作，履历完整覆盖上汽、蔚来、华为、集度所代表的传统转型、新势力崛起、科技赋能及前沿探索等产业关键发展阶段。其核心团队在集度时期开发的线控转向系统已完成超5万公里自动驾驶实测，是国内唯一具备该实测里程的团队。</p>\n  <p>硬氪了解到，线控转向（Steering-By-Wire, SBW）彻底取消了方向盘与转向机构之间的机械连接，完全依赖电信号控制。作为L3级以上高阶自动驾驶的“神经中枢”，其响应速度、操控精度和布局灵活性远超传统电动助力转向系统（EPS）。</p>\n  <p>随着2025年工信部L3级自动驾驶认证正式落地，以及新版《汽车转向系基本要求》国标于2025年12月发布、2026年7月正式实施（不再强制要求机械连接），线控转向的法规与市场窗口期已全面打开。</p>\n  <p>多家市场研究机构与行业专家向硬氪表示，2026年将是线控转向的爆发元年。据业内分析预测，2026年线控转向在新车中的渗透率有望达到5%，而到2030年这一数字将攀升至30%以上。目前，蔚来ET9、理想L9、小鹏GX等旗舰车型已明确搭载线控转向系统，行业正处于大规模量产前夕。</p>\n  <p>与大多数创业公司直接挑战总成不同，毫秒智控采取了更为务实的商业化路径。秉持着“由点及面”的渐进式策略，公司当前正重点推进“智控模组（PPK）”——即线控转向和R-EPS（齿条式电动助力转向）系统中技术壁垒最高的电机电控单元的量产进程。</p>\n  <p>未来，公司将依托成熟的技术优势，加速布局和释放从关键部件到转向系统总成的全栈产品势能，稳步构建规模化量产与交付的能力，持续深化与核心产业伙伴的供应链协同。</p>\n  <p>商业化层面，公司已切入北美新能源头部车企的供应链体系，并高质量完成了首个项目的开发与交付。今年以来，公司已建立起与主流车企的合作通道，核心业务进展顺利，正全力保障各项交付任务的执行。</p>\n  <p><strong>以下为硬氪与李杰的对话节选：</strong></p>\n  <p><strong>硬氪：线控转向的技术难点究竟在哪里？国内大部分厂商与国际巨头的差距主要体现在哪些环节？</strong></p>\n  <p><strong>李杰：</strong>线控转向最难的不是单个部件，而是“冗余”和“功能安全”的系统级设计。它要求双电机、双电源、双通信、双软件架构，任何一个环节出问题都要有备份。国内很多厂商能做小负载的C-EPS和DP-EPS，但一上到R-EPS和线控转向这种高负载、高安全等级的产品，就卡住了。</p>\n  <p>目前，差距主要体现在两个层面：一是对功能安全（ASIL-D）的理解和工程落地能力；二是缺乏足够的自动驾驶实测数据来迭代算法。</p>\n  <p><strong>硬氪：成本是线控转向大规模普及的障碍之一。目前系统成本相比传统转向高出约30%，这个差距如何缩小？</strong></p>\n  <p><strong>李杰：</strong>目前一套线控转向系统的成本相较于传统EPS确实仍保持着约30%左右的溢价水平。不过，其降本路径已非常明确：一是规模化，当渗透率从5%提升到30%，上游芯片、电机等核心部件的采购成本会大幅下降；二是国产替代，目前冗余主控芯片、角度传感器等仍依赖进口，国产化后成本有望得到显著优化；三是技术迭代，我们下一代PPK模组会集成更多功能，减少外围器件。</p>\n  <p>我们判断，随着上述降本路径的逐步实现，线控转向的成本溢价将在2028年左右收窄至行业可大规模普及的区间，届时大规模普及将真正到来。</p>\n  <p><strong>硬氪：主机厂自研转向系统正在成为一种趋势，你们如何看待来自客户自研的竞争？</strong></p>\n  <p><strong>李杰：</strong>自研和非自研的争论在汽车行业一直存在。我的判断是：只有年销量达到300万辆以上的巨头，自研的经济账才能算得过来。因为转向系统是典型的规模效应行业，研发投入巨大，但单品利润很薄。对于绝大多数主机厂而言，外采仍然是最优解。而且，即便是自研的主机厂，它们在电控单元（PPK）这种高门槛的核心部件上，依然需要外部供应商的支持。这就是我们的机会——我们不做整车，只做最难的模块，服务于所有玩家。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>松禾创智基金执行事务合伙人、松禾资本管理合伙人汪洋：</strong>我们持续看好线控转向在智能汽车与自动驾驶阶段中的关键地位。随着相关法规落地与整车电子电气架构升级，转向系统作为底盘域实现“上下解耦”的核心环节，毫秒智控围绕线控转向系统构建全栈自研能力，在产品定义、整车协同开发与测试验证方面形成体系化能力，尤其在冗余架构设计与量产落地层面具备实践基础，体现出对技术路径与产业节奏的深刻理解。我们选择在其产品验证与导入推进阶段进行支持，是基于技术路线可行性、国产化配套能力与整车需求匹配度的综合判断。期待公司在与主机厂、自动驾驶企业协同深化中，逐步实现规模化应用，成为线控转向国产化进程中的重要参与者。</p>\n  <p><strong>苏高新融晟表示：</strong>苏高新融晟长期布局智能制造等硬科技产业链，线控转向是自动驾驶的核心技术基石，是L3及以上自动驾驶不可或缺的基础能力之一。毫秒智控创始团队成建制来自于知名汽车OEM和头部Tier1底盘零部件企业，在线控转向领域不断深根厚植，覆盖系统开发、硬件和软件开发，具备冗余R-EPS和SBW的全栈自研经验，也是国内稀缺的线控转向研发时间久、产品成熟度高、做到量产车型测试且通过数万公里实车验证的完整团队。我们坚定的看好毫秒智控团队在线控转向领域的技术实力和量产经验，本次合作将助力毫秒智控加速技术迭代和产能扩张，助力智能汽车产业的发展。</p>\n  <p><strong>厚雪资本表示：</strong>作为毫秒智控核心投资人，我们十分看好企业长期发展价值。线控转向SBW是高阶智能驾驶落地的核心关键，更是制约L4级自动驾驶规模化普及的重要瓶颈，产业刚需与战略价值凸显。公司聚焦SBW、REPS及核心电控Power Pack研发制造，核心团队汇聚博世、华域、上汽、华为、蔚来、极越等行业资深人才，还深度参与行业国标制定，技术底蕴深厚。创业一年来，以李杰为首的创始团队顺利完成身份蜕变，从资深技术产品负责人快速成长为兼具经营思维与商业视野的优秀创业者，综合能力迭代迅速。企业近期接连完成两轮融资，获得市场广泛认可，后续也将借助资本力量加快产品验证与市场拓展，依托扎实技术实力与成熟团队优势，有望在智能底盘国产化浪潮中稳步突围，成为国内线控转向赛道极具潜力的中坚力量。</p>", "category": "tech", "published_at": "2026-06-05T01:23:23+00:00", "fetched_at": "2026-06-05T02:58:18.994141+00:00", "fingerprint": "4954e5a7a502f61e"}, {"source": "少数派", "title": "比 ZeroTier 更好的选择：EasyTier 去中心化异地组网全平台部署", "url": "https://sspai.com/post/110126", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/110126\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-04T03:02:55+00:00", "fetched_at": "2026-06-05T02:58:17.267729+00:00", "fingerprint": "40afe0360d606557"}, {"source": "少数派", "title": "它不会是下一场新冠：简单了解汉坦病毒", "url": "https://sspai.com/post/110717", "summary": "人类研究了这么久流行病，虽说事故总难免，但还是有点本事在的，至少这回肯定控制得住。<a href=\"https://sspai.com/post/110717\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-04T07:00:00+00:00", "fetched_at": "2026-06-05T02:58:17.267722+00:00", "fingerprint": "1c78d5f5c11452a4"}, {"source": "少数派", "title": "新玩意 243｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/110736", "summary": "编注：很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑部的新玩意」介绍编辑部成员们最近在用的新奇产品，让他们自己来谈谈这些新玩意的使用体验究竟如何。内容声明：《新玩意》栏目如含有 ...<a href=\"https://sspai.com/post/110736\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-04T11:15:27+00:00", "fetched_at": "2026-06-05T02:58:17.267715+00:00", "fingerprint": "7c0e0d02d95b5958"}, {"source": "少数派", "title": "派早报：Google 相关资讯三则、华为发布智慧屏 S7 X Pro等", "url": "https://sspai.com/post/110754", "summary": "Apple、Google 联合推出 Eclipsa Video HDR 开源标准等。<a href=\"https://sspai.com/post/110754\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-05T00:52:50+00:00", "fetched_at": "2026-06-05T02:58:17.267703+00:00", "fingerprint": "38aa0b09ad0d32c6"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.8382 CNY ↓-0.20%", "url": "https://www.frankfurter.app/2026-06-04?from=AUD&to=CNY", "summary": "<di
