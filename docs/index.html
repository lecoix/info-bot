<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

 New York Times reports, making him both the party's top known donor and the biggest established midterm donor. $158 million of that money - one of the largest political donations in American history - has been funneled into the Senate [&#8230;]", "category": "tech", "published_at": "2026-10-12T16:52:54+00:00", "fetched_at": "2026-10-13T05:11:10.568593+00:00", "fingerprint": "2c4bce67f69f3293"}, {"source": "The Verge", "title": "Meta has some Wonder Full new AI models", "url": "https://www.theverge.com/ai-artificial-intelligence/1009479/meta-muse-wonder-full-ai-model", "summary": "Meta is making up for lost time in the AI race. After launching Muse Spark, the first model from its revamped Superintelligence Labs division, and buzzy AI agent Muse, it's now launching two new models it claims can go toe-to-toe with the industry's best. The new models, Muse Wonder and Muse Wonder Full, are available [&#8230;]", "category": "tech", "published_at": "2026-10-12T17:00:00+00:00", "fetched_at": "2026-10-13T05:11:10.568587+00:00", "fingerprint": "846af7f67ce8bfa6"}, {"source": "The Verge", "title": "The Social Reckoning is flopping at the box office", "url": "https://www.theverge.com/entertainment/1009630/social-reckoning-box-office-other-mommy", "summary": "As important as some of the messages in The Social Reckoning are, the movie has been drastically underperforming at the box office. Per Variety, Aaron's Sorkin's follow up to The Social Network only grossed a measly $5.5 million this past weekend against a budget that's somewhere within the $30-42 million range. That would make it [&#8230;]", "category": "tech", "published_at": "2026-10-12T21:20:57+00:00", "fetched_at": "2026-10-13T05:11:10.568577+00:00", "fingerprint": "e50abc02ffccc0a1"}, {"source": "36氪 - 最新文章", "title": "复旦师生Pre-A轮融资超10亿，想让AI懂人的情绪与处境", "url": "https://36kr.com/p/4017114276368260?f=rss", "summary": "<p>文 | 孙小雯 海若镜<br />编辑 | 海若镜</p>\n  <p><strong>人的喜怒哀乐忧惧，对AI来说，重要吗？</strong></p>\n  <p>与人交谈时，我们会留意他的语气、停顿、表情，边听边想对方的真实所思。但当交流被整理成提示词文本，很多情绪信息会被过滤掉。</p>\n  <p>模思智能，这家由邱锡鹏教授（复旦大学特聘教授、上海创智学院副院长）创办的模型公司，一直在意AI的情绪感知能力。</p>\n  <p>在模思智能CEO李世民看来：AI要理解用户的意图，需要把用户说了什么、周围发生了什么，以及此前的交互联系起来。情绪也是其中的一种情境信号。比如用户突然结束了与AI的对话，可能因为任务已经完成，也可能因为AI答错了、让人不耐烦。这种反馈，藏在语音里、语气中，及更广泛的情境中。</p>\n  <p>他们想实现的“情境智能”，是让AI能够持续理解现场：谁在场，之前发生了什么，现在是什么环境，人正在做什么，接下来可能要做什么。但完整实现这种智能感知和预测，仍有很多难题待解。所以，模思智能选择先把交互模型作为工程化入口——让模型能理解、生成语音和视频等多模态，并可实时交互。他们把这套系统命名为MOSS Live。</p>\n  <p><strong>「暗涌Waves」独家获悉，模思智能近日完成超10亿元Pre-A轮融资，由华控基金联合领投，</strong>主要投资方包括国开科创、上海科创基金、新微资本、徐汇资本、追光硬科技创投、临港策源基金等，元禾控股、上海国投旗下上海科创集团、星连资本等老股东持续投资。本轮资金将用于全模态实时交互系统研发与全球商业化落地。</p>\n  <p>早在2023年初，邱锡鹏带领团队推出了类ChatGPT的语言模型MOSS，迅速登上热搜被广泛关注。当时就有投资机构邀请他们创业，但团队没有立即出来。</p>\n  <p>同年，这支团队研发了端到端语音大模型SpeechGPT，尝试让模型理解和生成语音，并保留声音中的情绪、语速、音色等信息。2024年，其开发的AnyGPT，探索让模型能处理更多不同类型的模态信息。</p>\n  <p>沿着这条研究路径，情境智能的目标渐渐清晰。要实现这一目标，<strong>模型就必须进入到现实情境中去，在现场获得客户的真实反馈，</strong>反哺模型。2024年底，这支团队终于孵化创业，成立模思智能，<strong>由SpeechGPT核心作者、年轻的复旦博士李世民担任CEO。</strong></p>\n  <p>李世民告诉我们，过去半年多，模思智能团队发布迭代了20多个模型版本，包括语音生成、音频理解、视觉理解等。他讲了与B端客户一起打磨交互模型的经历，<strong>真实情境的需求不同于学术指标，客户要准、快，还要便宜。</strong>这些约束，也改变着模型架构和推理框架。</p>\n  <p>至于当下热门的AI for AI，他认为这不是新事物、也不是壁垒，过去许多团队都用AI加速模型研发。如今，单点模型的领先可能很快被追上，但如果模型能快速进入产品，真实场景反馈又能变成下一轮训练材料，系统迭代速度可能拉开差距。</p>\n  <p>他们在做的实时交互模型，与日常已用的语音助手有哪些不同？如今距离情境智能，还缺着哪些能力？智能座舱等终端客户到底想要怎样的AI模型？这家成立两年的公司为什么能融到10亿元？</p>\n  <p>以下是「暗涌Waves」与模思智能CEO李世民的对话，经编辑整理：</p>\n  <p>&nbsp;</p>\n  <h2><strong>让AI理解“现场”</strong></h2>\n  <p><strong>「暗涌」：模思一直强调“情境智能”，这里的“情境”到底怎么理解？</strong></p>\n  <p><strong>李世民：</strong>我们理解的情境，英文也是context，但它比大模型里常说的“上下文”更泛化。</p>\n  <p>真实物理环境里的信息，其实是持续不断流入的。这里有什么人、有什么东西、刚才发生过什么、人与物时空关系如何，这些我们都认为属于情境。</p>\n  <p>有个很简单的例子，大家都有过找钥匙的经历。如果你突然问AI：“我的钥匙放哪儿了？”假如AI只能看到你当下的这一帧，它自然不知道答案；但如果它一直在持续接受环境的视频流，就可能看到你进门后把钥匙放到了哪里，后面人离开了、东西有没有移动。</p>\n  <p>拥有情境智能的AI回答问题，依赖的是此前持续积累下来的情境感知能力，而不是提问那一刻获取到的信息。</p>\n  <p><strong>「暗涌」：听起来，像一个随行的AI助理。现在大家期待的不止是拟人对话，还希望AI像人一样，能在物理世界更自主。</strong></p>\n  <p><strong>李世民：</strong>我们选择面向智能终端提供交互能力，底层逻辑就是要AI像人一样和物理世界交互。在真实环境中，人会停顿、改口；周围的声音、画面和环境状态也会一直变化。</p>\n  <p>最终AI一定会进入眼镜、车、玩具、机器人等终端，在这些地方，人不会每次都先整理好一个Prompt，完整告诉AI自己要什么。</p>\n  <p><strong>真正的情境智能，需要双工交互，输入和输出是并行的</strong>，模型能够边看、边听，接收信息的同时也能给出反馈。所以，下一代AI会从“回答问题”走向“持续在场”，能持续理解人和环境，并在合适的时候回应、行动。我们现在做全模态实时交互，就是在解决这件事。</p>\n  <p><strong>「暗涌」：可以举例讲讲，全模态实时交互，跟大家熟悉的AI语音助手有哪些不同吗？</strong></p>\n  <p><strong>李世民：</strong>真正的交互系统，要解决的是信息怎么同时进来、怎么互相影响、怎么在场景变化时持续更新。</p>\n  <p>比如一个人在车里说了句“有点冷”，只做语音识别，识别出这三个字就结束了。但真正的交互智能，要知道现在车里多少度、谁在说话、车辆是什么状态、说话人过去的偏好是什么，最后判断这句话只是描述感受，还是希望AI调一下空调。</p>\n  <p>我们真正关心的是 <strong>AI 能不能理解现场。</strong></p>\n  <p><strong>「暗涌」：邱锡鹏教授团队最早走红网络是2023年的语言模型MOSS，后面转向“语音理解和生成模型”，再后来又加入视频。这些都是为了接近“情境智能”的目标吗？</strong></p>\n  <p><strong>李世民：</strong>在创立模思之初，我们对情境智能有这样的描述：AI能够充分感知、理解复杂的物理情境，并在交互过程中持续提升模型能力。</p>\n  <p>最初我们更强调前半句。AI与物理世界最自然的交互方式是语音，所以我们先从语音入手，先让模型听懂用户的语气和情绪。用户打字、用文本表达的话，语气情绪等信息都会丢失。</p>\n  <p>2025年，我们的语音模型能力已经做到相对领先，就开始把“视觉理解”集成进来，让模型既能听懂，也能看清物理世界。</p>\n  <p>现在，<strong>我们会更多地强调后半句，“在交互中持续提升模型能力”。</strong>随着基础大语言模型、多模态模型逐渐成熟，我们也正往更加全面的多模态交互推进。</p>\n  <p>交互智能，是重要的工程入口。如果AI没有理解情境，会在交互里暴露错误。做交互模型，是在把情境智能做进系统里。</p>\n  <p><strong>「暗涌」：那么目前的多模态交互模型，做到哪一步了？你们最近提出了MOSS Live，具体怎么理解？</strong></p>\n  <p><strong>李世民：</strong>过去半年左右，我们陆续发布、迭代了20多个模型版本，覆盖语音生成、音频理解、语音识别、视觉理解和内容生成等环节，也在持续开源。</p>\n  <p>一些模型在特定任务上已经取得了比较好的效果。比如MOSS-Audio除了理解用户说了什么，也能分析他说话时的情绪、语速和状态，甚至声音里细微的抖动；</p>\n  <p>多说话人语音识别模型MOSS-Transcribe-Diarize-0.9B，在一些特定任务上的效果可以超过参数量更大的模型。</p>\n  <p>现在正处在把过去诸多单点能力接成系统的阶段。我们更愿意把MOSS Live理解成一套实时交互系统。这套系统里，有交互模型，也有能动性模型。交互模型持续看、听、说，理解当前的人和环境；能动性模型负责更复杂的推理、工具调用和任务执行。</p>\n  <p><strong>「暗涌」：模思为什么还要做视频生成模型？这个赛道也很卷。</strong></p>\n  <p><strong>李世民：</strong>这要和视频理解放在一起看。在我们的技术体系里，理解和生成是相互促进的。</p>\n  <p>比如训练视频生成模型，需要先把视频里的内容准确地描述、标注出来，这就依赖理解模型的能力。理解模型还可以帮助评判生成内容的质量；反过来，生成模型的效果，又能帮助我们验证理解模型的能力。这两件事在底层有很多共通的积累，包括音视频数据、数据处理管线，以及训练和推理的基础设施。我们做视频生成，也复用了此前在语音和音视频理解上积累的能力。</p>\n  <p>所以我们会把理解和生成放在一起迭代，最终服务于全模态交互这个目标。</p>\n  <p><strong>「暗涌」：要实现理想中的AI情境智能，难点主要是哪些？</strong></p>\n  <p><strong>李世民：</strong>核心主要有几点。第一，<strong>对音视频流的持续理解能力和双工交互</strong>。让模型在信息输入侧跟输出侧并行，能边看、边听、边说。</p>\n  <p>第二，<strong>记忆能力</strong>，不仅包括历史画面，还要能够在交互过程中对长时间信息进行编码，并在交互中更新。</p>\n  <p>获得这些信息之后，还要理解用户的意图，在输出动作之前做规划和目标拆解。这部分目前的语言模型和agent已经做得不错。</p>\n  <p>最后，还要考虑<strong>怎么从真实交互的反馈中改进</strong>。这跟coding任务不同。coding任务可以直接从代码是否运行正确来判断结果，但在现实生活中，反馈其实没有那么明确。用户不一定会直接说“你错了”，而是生气，或是直接沉默了。这个时候模型就需要结合更多的情境信息分辨。</p>\n  <p>这些问题在当前的交互模型里，都还没有被很好地解决。</p>\n  <p>&nbsp;</p>\n  <h2><strong>用户需求，改变AI模型</strong></h2>\n  <p><strong>「暗涌」：早在2023年你们就做了端到端语音模型SpeechGPT，当时外界的反馈主要是怎样的？</strong></p>\n  <p><strong>李世民：</strong>大家觉得范式很新，但也有质疑。</p>\n  <p>当时，端到端语音最明显的优势是降低时延，能保留更多语音里的非文本信息。但真正到用户场景里，它的代价也很明显：模型参数量大，部署成本高；为了降低时延，在一些特定任务上的效果反而不理想。所以有些客��反而希望我们做一套更智能的三段式方案，先把他们的实际问题解决好。</p>\n  <p>直到2024年GPT-4o出来，大家才理解端到端语音的价值，是让交互更自然。这件事对我启发比较大，我们可以靠技术和认知去做出新的模型范式，<strong>但最后还是要和真实的用户场景结合</strong>，才能产生更大的用户价值。所以我们决定在2024年底出来创业。</p>\n  <p>2025年我们做了很多单点模型，包括多说话人的语音识别、音频生成、单独的音频理解，很多技术选型，都会根据实际市场反馈去调整。</p>\n  <p><strong>「暗涌」：现阶段，你们也在和一些B端用户做联合开发。主要有哪些用户需要全模态的能力？</strong></p>\n  <p><strong>李世民：</strong>我们目前主要接触的<strong>是智能终端客户，包括智能座舱、AI智能硬件等</strong>。它们的使用场景不同，但对模型有一些共通的要求：</p>\n  <p>理解用户说话的内容，也要结合语气、周围环境和之前的交流，判断用户的意图；在拟人度、流畅度上表现更好；以及具备Always-on的体验，用户可以随时唤醒AI、跟它交互。</p>\n  <p>这些需求在不同终端上表现不同，但底层需要解决的理解和交互问题有相通之处，所以模型能力可以在不同场景复用。</p>\n  <p><strong>「暗涌」：目前的智能座舱大多都有语音交互，已经能即时响应一些需求。但座舱内的多模态交互，会是刚需么？</strong></p>\n  <p><strong>李世民：</strong>要看客户希望座舱里的AI做到什么程度。像开空调、调音量这样的明确指令，现有语音交互已经能解决不少问题。<strong>但我们看到的一些客户需求，已经涉及更连续、更复杂的交流。</strong>比如车里多人交谈时，用户跟其他人说话，不希望触发语音助手；跟语音助手实时交互时，用户话说到一半，可能正在思考，不希望被AI打断；打开车窗后，风声、鸣笛声等，如何避免背景音误触发。这些都是我们当前正在做、一些现有座舱语音助手还没有解决的问题。</p>\n  <p>打磨这些具体的细节，<strong>让模型知道什么时候应回复用户、什么时候该沉默</strong>，做到这些，用户能感觉到AI突然聪明了很多。</p>\n  <p>在此基础上，一些客户也希望模型能够同步理解视觉和音频信号。因为单靠声音，AI获得的现场信息仍然有限；加入视觉，可以补充对周围环境的理解，帮助模型判断用户的意图。对于想提供持续交互体验的座舱，多模态就有了具体的用途。</p>\n  <p><strong>「暗涌」：终端的算力能支撑得住么？</strong></p>\n  <p><strong>李世民：</strong>我们会根据不同场景设计不同大小的模型。</p>\n  <p>比如端到端的语音转录模型，如果是用于具身机器人、小型AI硬件、手机等，对时延要求高，且端侧芯片的算力有限，可以用0.9B的轻量级模型，提供本地服务。</p>\n  <p>同系列我们也有旗舰版模型，可以完成长音频多人转写、说话人分离和时间戳标注，主要通过云端提供服务。这个版本更适合对时延要求没那么高、但希望获得更强模型能力的场景。比如内容生产、线上模态交互，或是客服、医患交流的内容和质量分析。</p>\n  <p><strong>「暗涌」：来自用户侧的需求那么多，你会怎样判断哪些值得投入研发？</strong></p>\n  <p><strong>李世民：</strong>现在判断一个技术是否要深度投入，首先还是<strong>需求导向</strong>；第二个标准是<strong>有没有可复用性</strong>，是只有一个客户有需求，还是很多场景底层解决的是同一个问题；第三，<strong>它是不是还在情境交互智能的目标主线上。</strong></p>\n  <p>我们会看这个项目除了收入以外，对模型能力有没有帮助，做完以后这个方案能不能迁移到其他客户。比如一个AI硬件或者终端场景，如果它能帮助我们迭代交互模型、双工模型，这种项目我们会优先做。</p>\n  <p><strong>「暗涌」：做语音模型的老牌厂商，已经积累了不少客户。这个赛道会不会太拥挤？</strong></p>\n  <p><strong>李世民：</strong>我们认为，语音赛道还有很大的机会。大家对市场规模的判断，往往基于当前已经看到的模型能力，但<strong>新技术能力提升，会解锁新的需求和使用场景。</strong></p>\n  <p>比如我们的多说话人语音识别模型MOSS-Transcribe-Diarize，可以分析谁在什么时间说了什么。发布之后，就有一些AI语音硬件公司主动联系我们，希望能够接入API，增强产品多说话人分离、内容识别的能力。</p>\n  <p>语音生成，也还有很大提升空间。比如让模型在一次生成中，统一控制情绪、语速和说话人身份；生成玻璃破碎、踩雪等背景音。这套统一的声音生成范式成熟之后，也能够用在AI短剧等内容生产中。</p>\n  <p><strong>「暗涌」：会担心从研发走到商业化，难度反而更大吗？</strong></p>\n  <p><strong>李世民：</strong>我自己还是比较有信心。AI时代，模型能力是最大的竞争力，模型效果足够好，再加上我们的infra能力能够把成本压下来，客户会选择一个效果更好、成本更低的方案。</p>\n  <p>目前B端业务逐渐成熟，我们已经做了一些交付。这轮融资完成后，C端业务预计也会有比较大的起色。</p>\n  <p>&nbsp;</p>\n  <h2><strong>AI for AI，能否放大迭代速度</strong></h2>\n  <p><strong>「暗涌」：你们很早就用到AI for AI技术么，具体发生在模型训练的哪一步？</strong></p>\n  <p><strong>李世民：AI for AI是一个很常见的概念，很多顶尖团队都会用到。像数据处理、标注、质量评估这些环节，现在都需要大量借助模型来完成。</strong></p>\n  <p>比如我们训练多说话人对话语音生成模型MOSS-TTSD的时候，需要一个能够标注多说话人语音内容的模型。但市面上的模型在这个场景里做得不太好，所以我们自己训练了轻量级端到端语音转录模型MOSS-Transcribe-Diarize-0.9B，再用它标注MOSS-TTSD的训练数据。</p>\n  <p>理解模型不仅可以为生成模型标注数据，也可以评判生成内容的质量，作为奖励模型帮助生成模型训练。生成模型的结果，又可以反过来验证理解模型的能力。</p>\n  <p><strong>「暗涌」：具体标注时，人和模型分别做什么？</strong></p>\n  <p><strong>李世民：</strong>我们会先找很多相似场景的源数据，用初步的AI模型把数据整体标注一遍，再在模型标注的基础上做人工质量核对，得到质量更高的训练数据。</p>\n  <p>这套数据管线，我们从2023年开始迭代和积累。除了上述模型，整套数据标注管线里还会用到许多音频理解和多模态理解模型，分别处理不同的数据任务。模型之间怎么编排，数据管线先处理哪些任务、后处理哪些任务，都需要经过精细的实验。</p>\n  <p><strong>「暗涌」：让 AI 进入数据生产、标注、和模型训练，对效率的提升是怎样的？</strong></p>\n  <p><strong>李世民：</strong>效率方面，我们比市面上常见的多模态或音频数据处理管线提高了两到三倍，这里面也包括对数据处理算子的工程优化。靠这套共通的数据处理管线和研发infra，我们的模型迭代速度也很快。近半年，我们陆续发布了二十多版模型。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_2dd0e26321f245b0b712ab203f78b1b2@5452796_oswg1299501oswg1920oswg1080_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：模思智能</p>\n  <p><strong>「暗涌」：现在很多团队都在用AI辅助研发。你们希望建立哪些壁垒？</strong></p>\n  <p><strong>李世民：</strong>AI for AI，机器学习里其实研究了很多年。我觉得，这个词本身不是壁垒。</p>\n  <p>我们更关心的是，能不能把AI真正放进多模态数据、模型迭代的生产流程里。<strong>比如音频、视频、图像和交互数据进来以后，过去很多事情要靠人做，现在这些环节都可以逐步训练模型来处理。</strong></p>\n  <p>单点模型今天领先，过一段时间很可能就会被追上。实时多模态交互不一样，它需要语音、视觉、视频、理解、生成、推理系统、真实场景和数据管线一起往前走。</p>\n  <p>模型能不能快速接进系统、真实场景里的数据能不能回来，数据回来以后能不能很快变成下一轮训练材料，这几个环节如果能持续转起来，最后能放大整个系统迭代的速度。</p>\n  <p>下一步真正要证明的，是产品和客户场景产生的数据，能不能持续回到模型训练。</p>\n  <p><strong>「暗涌」：从团队角度来看，模思智能现在200多人，大概3/4是研发人员，你会觉得整个组织更像Lab么？</strong></p>\n  <p><strong>李世民：</strong>从人才密度上看，我们确实有一些实验室的特征，差不多一半是纯算法研究；剩下的人里又有一半是开发侧研发。但模思不是一个Lab，我们是一家要走通商业闭环的公司。</p>\n  <p>研发占比高，是因为我们要把研究、模型、产品一路打通，每一环都离不开研发。模思的模型能力，要变成用户真正用得上的产品和服务；用户和市场会反过来影响我们的模型。</p>\n  <p>以前做语音模型，可能更关注词错率、语音相似度这些学术指标；但客户会提需求：<strong>不光要准、低时延，价格也不能太贵。这些约束最后会反过来改变模型架构、推理框架，甚至我们的基础设施，</strong>逼着我们去做更加细致化的优化，提供更低成本、高利用率的模型。</p>\n  <p><strong>「暗涌」：你们希望，模思最终会成为一家怎样的公司？</strong></p>\n  <p><strong>李世民：</strong>我们想做的，还是AI和真实物理世界交互的基础设施。</p>\n  <p>往理想的方向讲，就像电影《Her》里的AI助手。AI能够充分获得用户所处的情境，理解人，能跟人进行智能、实时、连贯的交互。</p>", "category": "tech", "published_at": "2026-10-13T01:15:49+00:00", "fetched_at": "2026-10-13T05:11:10.396391+00:00", "fingerprint": "5ecc1cd5caaa9a91"}, {"source": "36氪 - 最新文章", "title": "华为投后，一盛新材再获元禾璞华等近亿融资，热控材料站上AI风口丨36氪首发", "url": "https://36kr.com/p/4023646561668995?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261013/v2_82c64f1959c04c09ac769bf2121c31d2@6221844_oswg1393656oswg1268oswg796_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3200</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，哈尔滨一盛新材料科技有限公司（下称“一盛新材”）宣布完成近亿元A3轮融资，本轮由元禾璞华、长江创新联合领投，中信建投、江苏高投旗下邦盛、丰源资本、银柏投资跟投，老股东中关村启航旗下芯创基金追投。本轮融资将重点用于硬件设备投入与高端人才引进。</p>\n  <p>一盛新材成立于2024年9月18日，是一家专注于高端金属基复合材料研发与生产的高科技企业，核心技术依托哈尔滨工业大学金属基复合材料国家地方联合工程实验室。</p>\n  <p>创始人武高辉为亚太材料科学院院士、享受国务院特殊津贴。四十余年来专注金属基复合材料高品质制备技术，1982年亲手研制出中国第一块金属基复合材料。创建了哈尔滨工业大学金属基复合材料国家地方联合工程实验室，已经建成涵盖结构类、功能类金属基复合材料20余种的货架产品。2012年，他率团队国内首次研制成功金刚石铝复合材料并批量应用于卫星航天器，是国内最早实现金刚石复合材料工程化的团队。</p>\n  <p>目前，AI正在重塑热控材料这一赛道。武高辉向硬氪直言：“AI技术的发展强烈依赖于算力，而算力发展的最大的障碍就是热控材料。”</p>\n  <p>比如，英伟达GPU芯片单颗功耗已达3000W，将来要达到7000W，而芯片温度每升高2℃，可靠性将下降10%，长期运行温度高于80℃时寿命将呈指数下降。以往的钨铜、钼铜材料热导率仅200W/(m·K)出头，面对千瓦级功率器件已无能为力。</p>\n  <p>自第四代热控材料（金刚石/铝、金刚石/铜复合材料）首次实现了“超高导热+热膨胀匹配+可轻量化”的突破，这些材料就逐渐成为AI算力散热的必选项。</p>\n  <p>一盛新材的产品主要围绕高功率芯片散热展开，从芯片热沉到封装壳体再到集成液冷系统的冷却模块，形成了大功率电子器件全链条的热控解决方案。</p>\n  <p>其中，核心产品包括金刚石/铝和金刚石/铜复合材料，热导率分别达550-750W/(m·K)和750-980W/(m·K)，综合性能已领先日本住友电工等国际竞品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261013/v2_5f80a0596cb54b308df9589378567894@6221844_oswg352413oswg1080oswg672_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">核心产品矩阵（图源/企业）</p>\n  <p>但一盛新材最核心的壁垒不在实验室，而在工程端。行业公认，金刚石铜复合材料的工程化难点在于“成型”。因为很硬的金刚石镶嵌在很软的铜基体中，机械切削时会把金刚石颗粒从基体里“挖”出来，达不到成型精度，刀具也严重损伤。</p>\n  <p>一盛新材发明了独有的近净成型技术，可实现复杂构件一次精密成型，无需二次加工。武高辉表示，公司几年前就把光模块的复杂零件一次做出来了。“这是我们独有的技术，也是我们最深的护城河”。</p>\n  <p>在制造端，一盛新材采用的自研的液态法压力浸渗技术和装备，区别于行业主流的粉末冶金路线，是将液态金属在压力作用下渗入到金刚石预制体间隙中的方法，解决了致密度、界面反应等难题。公司当前年产能已达千万片以上。</p>\n  <p>而应用方面，一盛新材顺应材料工程化的客观发展规律，走出了“军工先行、民用跟进”的双轮驱动路线。航天国防目前仍是公司的核心基本盘，产品已用于超过20颗卫星，是当前国内唯一可提供航天级金刚石/铝复合材料系列产品的单位，并覆盖雷达T/R模块、大功率器件、弹载计算机等核心场景。</p>\n  <p>武高辉在十年前主持编写的中国“金属基复合材料发展路线图”中对民用市场的应用有个判断，现在看来民用市场的爆发比预期的要早好几年。公司目前已在新能源汽车、AI算力中心、大功率芯片、5G/6G通讯、光模块等领域开始了布局。</p>\n  <p><strong>以下为硬氪与一盛新材料创始人武高辉的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：热控材料赛道过去很少被关注，为什么近几年突然火了？</strong></p>\n  <p><strong>武高辉：</strong>以前的砷化镓芯片功耗低，用传统材料就能应付，现在大功率器件开始选用氮化镓芯片，发热量增加3~5倍，而且集成度越高发热量越大，英伟达单颗芯片手指甲那么大一个面积就能达到3000瓦，热量非常大。芯片温度每升高一度，可靠性就下降5%，热量控不住，算力就上不去，这是物理规律决定的。</p>\n  <p>大家都知道，我国是国际上AI技术发展最为迅猛的国家，AI的基础依赖于算力，算力装备对热控材料的需求突然出现井喷式发展。而且这个趋势是刚性的，所以说不是我们赶上了风口，而是我们时刻跟随着时代的步伐。</p>\n  <p><strong>硬氪：目前行业内做金刚石复合材料的玩家不少，你们核心壁垒到底是什么？</strong></p>\n  <p><strong>武高辉：</strong>壁垒不在材料配方，而在工程化能力和产品可靠性。我们依托哈工大平台，已经形成了二十多种可产业化的复合材料品种，文献可查到的国外企业的产品加到一起也不过10来种，这是我们的材料体系优势。</p>\n  <p>但更核心的是工程端的积累。从界面调控到近净成型，从设备自动化到批量一致性，每一个环节都有十几年的know-how。我们已经实现了复杂构件一次精密成型，而且设备工艺都固化在系统里了。不过我们也很清楚，在市场的巨大诱惑下，国内金刚石铜的企业一年间兴起十几个，技术发展也很快，我们的领先只是暂时的，需要不断地迭代升级，才能保持领域的引领。</p>\n  <p><strong>硬氪：从航天到AI算力中心，这两个市场的逻辑有什么不同？</strong></p>\n  <p><strong>武高辉：</strong>航天是“可靠性第一”，产品要经过最严苛的考核，量不大但门槛极高。我们经过十几年的锤炼才成为国内唯一能提供航天级金刚石/铝复合材料系列产品的单位。</p>\n  <p>AI算力中心是“性能与成本并重”，量非常大，要求快速交付和成本可控，这对我们高校科研出身的人是短板。我们要做的的事就是把航天级的技术能力平移到民用市场，学会在产业海洋中游泳，通过产能扩建和工艺优化把成本降下来。新能源汽车、液冷产品已经在小批量送样测试了，结果很好。军、民这两个市场一个立标杆，一个放规模，是互补的双轮驱动。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>中信建投资本表示：</strong>随着AI算力需求持续爆发，高效散热已成为制约算力基础设施升级的关键瓶颈。金刚石凭借远超传统金属材料的导热性能与优异的物理特性，正成为下一代散热技术的核心方向。</p>\n  <p>中信建投资本长期关注半导体行业关键材料的产业投资机会，我们看好金刚石复合材料从技术验证走向规模化商用的加速趋势，也高度认可一盛团队在金刚石材料研发与产业化落地方面的技术积累。期待公司抓住AI散热升级的时代机遇，为算力基础设施建设提供核心材料支撑。</p>\n  <p><strong>元禾璞华表示：</strong>AI算力功耗指数级攀升，传统铜基散热材料已逼近物理极限，一盛新材料依托武高辉教授团队四十年金属基复合材料积累，在金属基复合材料领域实现了从界面调控到复杂构件净成型的全链条突破，已在客户端验证了技术成熟度与工程化能力。元禾璞华将持续布局半导体热管理赛道，支持一盛新材料扩产提效与客户拓展，推动国产高端热管理材料在AI芯片封装、数据中心等场景的规模化应用。</p>\n  <p><strong>丰源投资认为：</strong>面对AI芯片1400W+热管理挑战，传统散热触及物理极限，金刚石铜复材迎来了产业化拐点，其应用场景正加速从军工航天向千亿级AI算力基建跃迁。一盛新材料依托顶尖专家武高辉教授的核心工艺优势，已形成稀缺的技术与商业双壁垒。丰源长期看好一盛以技术硬实力撬动商业高价值的巨大潜能。</p>\n  <p><strong>邦盛资本表示：</strong>当芯片功耗飙升、风冷液冷散热皆触及物理边界时，真正的卡点落在芯片表面的\"近端热传导\"上，金刚石/铜、金刚石/铝正是补强这一环的稀缺材料。一盛依托哈工大武高辉教授团队四十余载积淀，手握气压浸渗、界面调控等国际首创技术，填补了高端热控材料国产化空白，使其在AI算力与商业航天的高景气赛道上牢牢占据材料端的战略咽喉。我们坚定看好一盛，在芯片与散热器的微米级界面上，筑起了一道难以逾越的国产高墙。</p>\n  <p><strong>老股东中关村启航投资旗下芯创基金表示：</strong>中关村启航作为一盛新材料的早期投资方，本轮坚定追加投资，正是基于对行业趋势与公司发展的持续跟踪，首次投资时的核心判断已得到充分验证。</p>\n  <p>今年以来，金刚石/铜这类第四代热管理材料，从航天军工的“高塔”走向AI算力、光模块等多个千亿级民用市场的产业趋势已被强势确认，正加速从“可选项”变为“必选项”。我们最初的投资逻辑不仅成立，且比预期中更加刚性。</p>\n  <p>让我们决定追投的，更是一盛团队展现出的惊人执行力与工程化落地速度：从航天级可靠性到民用级优化、千万级量产，高景气赛道大客户验证进展超出预期。一盛团队用扎实的产业化进度证明，这不仅是一支顶尖的科研队伍，更是一家具备稀缺工程化壁垒的平台型材料企业。芯创基金将持续深度陪伴一盛，做好全生命周期赋能服务，打造金属基复合材料全球领军企业。</p>", "category": "tech", "published_at": "2026-10-13T01:48:40+00:00", "fetched_at": "2026-10-13T05:11:10.396385+00:00", "fingerprint": "bf633428726d7e66"}, {"source": "36氪 - 最新文章", "title": "AI气象大模型公司获厚雪数千万投资，已建成自有卫星星座丨36氪首发", "url": "https://36kr.com/p/4023671039070081?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261013/v2_8d60e0b5e79746d08cbd2dc9ae37729a@6221844_oswg1758626oswg1268oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3300</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，气象AI公司天序智能科技（嘉兴）有限公司（下称“天序智能”）近期已完成数千万元Pre-A+轮融资，由厚雪资本独家投资，翊荣资本担任长期独家财务顾问。本轮融资资金将主要用于“凝空星座”建设、CMAWSPAI及垂类世界模型迭代、团队扩张、重点客户拓展与海外业务预研。</p>\n  <p>天序智能在2024年10月创立，是未来全球范围内少数同时掌握垂类气象大模型、自主可控卫星观测网络、行业底座化交付能力的硬科技AI for Science公司。</p>\n  <p>创始人刘栗是中国科学院大学气象学博士，本硕博深耕气象专业，长期研究气象、人工智能与能源交叉方向。</p>\n  <p>“我们在这个行业深耕近10年，尝试过气象跟能源、交通、农业等多个领域的结合，最终发现能源是政策驱动、市场空间最大、付费意愿最强，同时也是全球范围内最稀缺高精度气象底座的黄金赛道。</p>\n  <p>天序智能是国内极少数完成“大模型上星”的创业公司，致力于建成自主可控的能源气象新型基础设施，并布局能源垂类世界模型与产业级物理仿真。</p>\n  <p>公司认为，新能源“靠天吃饭”，风速、辐照度直接决定发电量。当前国内新能源装机占比已超50%，电力市场化改革加速，功率预测��生百亿级刚需，电力现货交易打开千亿级增量，赛���正处爆发前夜。</p>\n  <p>能源只是天气经济第一站。气象是电力供需最大变量，也是经济社会底层定价变量之一。天序智能的目标是立足中国能源场景，从电力交易出发，成为全球天气风险的底层定价者，建成能源垂类“最强大脑”。</p>\n  <p>从行业发展来看，传统气象预报依赖物理模型，本质上是解数学物理方程组的过程，需要消耗大量算力。</p>\n  <p>刘栗给硬氪举了一个直观的例子：以前预报未来10天天气，用超级计算机可能要算十几个小时；现在用AI大模型，一分钟就能算出未来20多天的天气，很多气象要素的预报准确率甚至更高。</p>\n  <p>天序智能的气象大模型并非大语言模型，而是一个参数规模在10B以内的垂直领域模型。公司从第一行代码开始自研，在主流架构基础上进行了能源领域的垂直化改造，创新性地提出了“洛伦兹框架”——这一命名致敬了混沌理论的提出者、气象学家洛伦兹。</p>\n  <p>“我们的核心是以Transformer为底层框架，针对能源气象预报里的上下游空间关联、时间飘移等现象，改造了传统的注意力机制。我们的目标从一开始就聚焦在风速和辐照度的预报上，这一点区别于一般的气象大模型”刘栗介绍。</p>\n  <p>从2025年起，天序智能与中国气象局公共气象服务中心一道，共同搭建起一套从大模型数据处理到垂类模型训练的特色工作流，并在2025年10月于广东中山联合发布了国内首个能源气象大模型CMA-WSP-AI。</p>\n  <p>区别于传统气象大模型“只输温度、湿度、降水等气象结果”，天序智能面向能源的垂类世界模型，可以进一步推演：气象变化如何传导至新能源出力波动、如何影响全网负荷、如何驱动现货电价涨跌，实现从“算天气”到“算能源系统演化”的跨越，为电力交易决策、大基地规划、电网风险预演提供仿真推演能力。</p>\n  <p>在模型效果上，天序智能1km高精度风速预测，在RMSE、相关系数等指标上优于EC-HRES、AIFS；在极端天气AI竞赛中（包含冰雹、雷暴大风、雷暴、短时强降水四项）排名第一，TS评分较传统基线方法提升39.6%至351%不等。</p>\n  <p>商业化上，天序智能已跑通“数据—平台—能力建设”三层商业模式。最底层是数据售卖，客户包括头部发电集团、气象部门以及参与电力交易的多类主体；第二层是SaaS化的电力交易辅助决策平台和功率预测平台，按账号订阅，贡献持续性收入；第三层是能力建设，将数据、模型、平台整体部署到客户内网，满足头部客户对能源数据安全、数字化改造和私有化部署的需求。三层业务层层递进：数据是入口，平台带来复购，私有化部署锁定头部客户；接入的场站和场景越多，模型越准，形成正向的数据飞轮。</p>\n  <p>“传统模式是发电侧把数据传到第三方，第三方加工成产品再传回去。但随着能源安全的要求提高，这种模式走不通了，数据不能出内网。”刘栗解释道，“我们把模型和平台搭建在客户内网里，让数据和模型在内网闭环运行，同时帮助客户掌握这套自主能力。”</p>\n  <p>当前，天序智能的客户已覆盖发电侧、用电侧和电网侧：在发电侧，与多家头部发电央企达成合作；在电网侧，国家电网和南方电网均是其客户。这意味着，天序已拿到中国能源体系最核心客户的“入场券”。刘栗认为，从“结果采购”到“能力建设”的转型，正是天序区别于传统气象服务商的核心差异。</p>\n  <p>大模型是“大脑”，卫星则是“眼睛”。刘栗认为，算法优势终会被追平，数据源头才是长期壁垒。天序智能启动“凝空星座”计划，2026年7月24日气象大模型已搭载卫星入轨并完成每日验证，是国内较早让气象大模型“上天”的创业公司之一。星座远期规划18颗卫星，建成全球1km/1h风、光、温压湿观测网络，走出“AI大模型+自有卫星+星上计算”的稀缺路线，以全球视野服务国内、“一带一路”国家及全球市场。</p>\n  <p>能源之外，公司还布局低空气象与金融气象：前者已与头部客户开展无人机配送气象服务，分辨率达10米级；后者面向天气衍生品、保险及海外预测市场，提供可信高频的定价与结算数据底座。</p>\n  <p><strong>以下为硬氪与天序智能创始人刘栗的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：从“数据消费”到“数据生产”，这个说法怎么理解？天序为什么要自己做卫星？</strong></p>\n  <p><strong>刘栗：</strong>所谓数据生产者，就是依靠气象大模型生成气象数据，掌握数据源头。因此我们要逐步把竞争力从算法优势，过渡到数据优势。</p>\n  <p>整体分三步走：2026年7月，大模型已搭载卫星上天，在轨运行验证。2027年计划发射两颗先导试验星，验证星间传输和星上计算能力，服务新能源场站，补齐“沙戈荒”地区风光观测数据短板，为资源评估、能源预测筑牢基础。远期规划部署18颗卫星，实现全球范围1小时重访、1公里分辨率的风、光、温压湿要素探测。</p>\n  <p>这类观测数据是新能源场景的稀缺资源，除服务国内市场外，还能支撑出海，尤其是服务“一带一路”沿线国家。卫星数据能力是未来气象服务公司最核心的壁垒之一。</p>\n  <p><strong>硬氪：和业内传统企业相比，天序的差异体现在哪里？</strong></p>\n  <p><strong>刘栗：</strong>主要有两点。第一，跟传统功率预测厂商不同，我们本身就是底层气象数据生产者，从核心气象数据向上做业务应用，技术起点不一样。依托气象大模型，我们在部分区域的预测准确率具备明显优势。</p>\n  <p>第二，和科研团队不同，我们是从行业场景中成长起来的团队。公司硕士及以上人员占比超80%，同时大量核心人员在能源领域又深耕了10来年，我们擅长做交叉领域的技术创新和商业化落地。</p>\n  <p><strong>硬氪：行业目前面临哪些挑战？技术路线的演进会不会影响你们后续的研发方向？</strong></p>\n  <p><strong>刘栗：</strong>第一，技术层面紧跟前沿趋势。大模型从纯数据驱动过渡到物理约束加数据驱动的双轮驱动路线，我们会结合能源场景深挖底层逻辑，针对前沿技术持续评估、试验，寻找差异化落地路径。</p>\n  <p>第二，商业推广上我们不畏惧行业竞争。我们团队的基因是开放、合作的基因。真正需要考量的是新能源产业长期发展的基本面，而国内大力发展新能源的大方向不会改变。此前区域冲突推高国际油价，国内受冲击相对有限，根源就在于能源结构转型，新能源装机占比已突破50%。回看，顶层能源战略具备长远视野。</p>\n  <p>第三，天气经济的市场空间还远未被打开。国民经济中约80%的行业与气象相关，新零售、金融、农业、航运等行业都能借助气象实现精细化运营和风险管理。海外的天气衍生品和预测市场已经证明，天气可以被定价、被交易；国内这个市场才刚刚起步，对我们来说既是挑战，更是最大的机会。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>厚雪资本表示：</strong>随着我国加速建设新型电力系统，同时全球碳中和进程持续推进，能源气象已经从辅助性工具升级为关乎能源安全与全球绿色转型的关键数字新型基础设施。天序智能自研垂类气象大模型，开创性布局“凝空星座”自主卫星观测网络，打通“太空观测气象大模型能源垂直世界模型仿真行业底座交付”全链条，技术体系横跨气象科学、人工智能、世界模型前沿、航天工程、电力产业，不仅深度赋能国内能源体系建设，也具备向全球输出中国原创气象技术底座的巨大潜力，在能源、低空、农业、金融等国计民生赛道拥有广阔想象空间。创始团队兼具扎实的气象科研功底、全栈工程落地能力、产业商业化运营经验与国际化视野。我们看好团队抓住“十五五”科技创新与全球能源产业升级的重大时代机遇，建成全球领先的自主可控能源气象技术体系，以软硬一体化智能基础设施解决方案，助力国家能源安全，赋能全球实体经济高质量发展。</p>", "category": "tech", "published_at": "2026-10-13T02:12:10+00:00", "fetched_at": "2026-10-13T05:11:10.396378+00:00", "fingerprint": "c90ee9e3761b4587"}, {"source": "36氪 - 最新文章", "title": "深度云海完成千万级天使轮融资，前百度搜索团队创办｜36氪首发", "url": "https://36kr.com/p/4023041152585603?f=rss", "summary": "<p><strong>文｜王欣逸</strong></p>\n  <p>36氪获悉，近日，专注做GEO的AI营销公司深度云海智能科技（上海）有限公司（以下简称“深度云海”）已完成千万级天使轮融资，华工科技（000988.SZ）领投，本轮资金主要用于自研技术底座迭代、海外市场拓展、产品升级以及AI人才的扩充。</p>\n  <p>深度云海创立于2025年6月，团队规模为70余人，核心团队来自前百度搜索部门，CEO钱程曾任百度上海总经理，他也是一位连续创业者，离开百度后，他相继创办唯智互动传媒、爱玩高尔夫、嗨修汽车等公司，其中，爱玩高尔夫和嗨修汽车先后被携程、滴滴收购。COO杨海玲历任3721、百度、慧聪网、敦煌网、世优等知名企业COO等高管职务，具有头部互联网企业全链路商业化操盘经验；CTO龙杰曾参与百度无人驾驶系统高精度地图落地等工作。</p>\n  <p>据介绍，成立一年以来，深度云海已累计服务了3000多家企业客户，年收入达到数千万元。</p>\n  <h3><strong>一个能帮企业做生意的AI营销工具</strong></h3>\n  <p>深度云海的产品包括两个部分：GEO RaaS系统（包括国内版和海外版）、DeepWork桌面端产品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_0174fe2bcd4545bf98a26be26f4f796e@6162492_oswg1374994oswg1920oswg2148_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI企业智能营销平台，图源：企业</p>\n  <p>用简单的话来介绍GEO系统，就是通过生成引擎优化，让ChatGPT、DeepSeek、豆包等海内外AI工具在输出结果时优先推荐客户企业。</p>\n  <p>具体来看，这套系统主要包括以下内容：</p>\n  <ul>\n   <li>诊断：用深度云海自研“云宝AI品牌可见度监测系统”（AI可见性、品牌声量情感、信源漏洞、竞品对比）评测出品牌在大模型里的可见度，并用AI监测系统实时追踪品牌在豆包、DeepSeek、元宝等模型中的收录情况、被提及的次数和排名；</li>\n   <li>优化：按各家平台的偏好定向优化提示语，如扩展意图词等；</li>\n   <li>生产：把权威信息源分层次，并找出哪些还有信息缺口，用AI灵雀建站把企业官网改造成大模型更容易识别和抓取的形态；</li>\n   <li>分发：内容最终经人机双重合规审核后，分发至各平台渠道。</li>\n  </ul>\n  <p>另一款产品DeepWork是智能营销工作台，它的定位是“客户的AI营销部”。与WorkBuddy这类大而全的桌面Agent不同，DeepWork则是专门为GEO准备的Agent智能营销工作台，围绕营销工作，这一应用里设置了诊断台、创作台、监测台、Skill中心以及转化台，覆盖从品牌可见度诊断与追踪、宣传稿件成稿与分发、销售自动化等全过程。</p>\n  <p>钱程认为，对于企业而言，数据安全是常有的顾虑。因此，这一应用支持本地部署、离线可用、数据自主可控，不仅如此，平台还会持续积累个性化数据，让系统越用越懂企业。</p>\n  <p>从商业模式来看，深度云海走RaaS（结果及交付）路线，他们既做国内市场、也做海外市场。从行业上来看，客户主要分布在机械设备、化工能源、电子电工与教育等。</p>\n  <h3><strong>GEO的下半场，聚光灯打在了技术上</strong></h3>\n  <p>“大模型变聪明了，对于搜索溯源结果也在扩充，从10条扩展至最高60条，与此同时，溯源结果的生态也在变，除了网页，一些AI应用如豆包，还能查找到抖音视频等内容作为参考资料。”钱程说，他给GEO划了一条时间上的分界线——今年下半年，行业也进入了技术分水岭，从流量红利期进入技术驱动期。</p>\n  <p>从产品底座来看，深度云海自研了GEO营销算法引擎，并搭建了关于实体、关系、属性、事件、规则、FAQ、标签、训练约束的八层企业知识图谱。钱程把技术路线概括为“逆向工程”：观测大模型给出结果前做了哪些溯源检查，反向做算法匹配，判断投放到哪些站点更容易被引用。围绕这套底座，深度云海已申请多份软著与专利。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_658abc46d87e4faa9c589bee732528ab@6162492_oswg782788oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GEO全链路运营体系，图源：企业</p>\n  <p>不过，GEO不会完全替代SEO（搜索引擎优化），钱程认为，GEO会成为企业做AI营销的标配，而行业也正处于洗牌当中。</p>\n  <p>钱程判断，创业公司的窗口期还有两到三年，洗牌的规则也清晰：在行业发展早期，光靠多发一些能被AI抓取的文章就能实现AI可见性；而如今效果量化的门槛提高，必须靠技术、算法和监测投入才能保障可量化交付。</p>\n  <p>钱程告诉我们，现有的大模型在抓取信源的倾向也在发生改变，自媒体内容被引用的权重已降至一成，权威信源的权重持续上升，因此，技术不达标、投入不足、不具备运营能力的小GEO公司可能会逐渐掉队。</p>\n  <p>这也让深度云海不断自我校正自己的路线。推出DeepWork智能营销工作台后，他们还要积极开拓海外市场。只做一家GEO服务商是不够的，钱程希望深度云海在未来可以逐渐成为一个AI 全域企业智能营销平台，让企业在AI中提高自己可见性的同时，还能让智能“助理”补齐其他营销链条，让AI把生意做下去。</p>", "category": "tech", "published_at": "2026-10-13T03:10:57+00:00", "fetched_at": "2026-10-13T05:11:10.396369+00:00", "fingerprint": "9e45e924f4d81d01"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨达晨投过的老牌减速器厂商完成数亿元B轮融资，已供货多家头部机器人企业", "url": "https://36kr.com/p/4023807119789956?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约1500字，建议阅读3分钟</p>\n  </blockquote>\n  <p>硬氪获悉，近日，浙江三凯机电有限公司（以下简称“三凯机电”）宣布完成数亿元B轮股权融资。本轮融资由工业母机产业投资基金与物产中大投资联合领投，财通资本、温岭海和融智跟投。募集资金将主要用于深化人形机器人关节减速器及驱动一体化技术的研发迭代，扩大精密减速器产能建设，加速高端传动部件的国产化替代进程。去年年底，三凯机电曾获达晨财智领投过亿元A轮融资。</p>\n  <p>三凯机电成立于2007年，是国内较早开展精密行星减速机自主研发并量产的企业，于2012年量产。三凯机电创始人兼CEO江建斌向硬氪介绍，目前国内自动化领域已广泛应用三凯机电的行星减速机。</p>\n  <p>据介绍，三凯机电的精密行星齿轮减速器凭借独特的齿形修形技术，回差可稳定控制在1弧分以内，扭转刚性高，能保证工业母机在重载、高速下的加工稳定性与超高精度。同时，减速器采用优质合金钢与核心热处理工艺，依托精度管控和装配工艺提升，在加工一致性上处于国内第一梯队。</p>\n  <p>目前公司精密减速器已广泛应用于机床与CNC、AGV/AMR、光伏锂电、医疗影像、灌装设备、3C电子、无人机舵机、钢铁冶金等行业领域，可实现进口替代与成本下降。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261013/v2_5641e31571e94afb9ecd671af21cd451@5920579_oswg943014oswg1080oswg487_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>2022年，随着人形机器人的兴起，三凯机电也组建机器人服务团队，研发适用于机器人的行星减速器与谐波减速器。</p>\n  <p>同年，公司推出机器人领域用谐波减速器，自主开发高精度共轭齿形，实现多齿啮合；通过优化齿形设计与抗疲劳特种材料，承载能力较国内标准品有较大提升；同时体积小、重量轻，适配多关节机器人对空间和重量的严苛限制，可用于六轴、四轴工业机器人。</p>\n  <p>2024年，公司又专门推出更适配人形机器人关节的行星关节减速器。通过拓扑优化与异形集成设计，实现较高的扭矩/重量比与扭矩/体积比，为人形机器人提供动力基础。</p>\n  <p>目前，三凯机电已与国内多家头部机器人整机厂商深度合作，并进入北京人形机器人创新中心等多家机器人头部企业的核心供应链体系，实现稳定批量供货。</p>\n  <p><strong>值得注意的是，在今年8月的第二届世界人形机器人运动会上，天工系列机器人共斩获15金12银18铜，合计45枚奖牌，并在竞速、跳高、跳远、举重等多个赛项刷新行业纪录，其核心关节部件来自三凯机电。</strong></p>\n  <p>为适配人形机器人复杂多变、高冲击、高负荷的运动工况，三凯机电近两年在设备方面投入过亿元，正在全面升级生产加工、精密检测、研发试验等硬件设备。</p>\n  <p>基于未来人形机器人产业增长预期，今年年初，公司二期厂房暨“年产100万套精密齿轮减速器”项目开工，总建筑面积约6万多平方米。项目达产后将新增百万套级精密齿轮减速器年产能，并配套伺服电机、驱动一体化智能生产线，升级柔性生产与批量交付能力，预计新增年产值约10亿元。</p>\n  <p><strong>创始人问答：</strong></p>\n  <p><strong>硬氪：工业母机和人形机器人对行星减速器的要求有什么不同？人形机器人方向未来会做哪些拓展？</strong></p>\n  <p><strong>江建斌：</strong>人形机器人对减速器的核心诉求是更轻、更薄、更小，不过基本结构与工业母机所用产品相近，技术复用度较高，只在尺寸和工艺存在差异，公司已为此单独开设专用产线。</p>\n  <p>目前机器人方向的研发正在向“电机+减速器”的模组化形态突破。随着客户陆续提出配套电机的需求，公司的目标是提供即插即用、高度集成的关节模组。但各家机器人厂商的算法和应用场景不同，驱动器往往需要针对不同客户定制多个版本，而主流厂商又大多自研驱动，因此公司未来几年不会涉足驱动器设计，只聚焦机械部分，也就是“电机+减速器”的一体化集成设计。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>B轮领投基金：</strong>精密传动部件是人形机器人与高端装备的“卡脖子”核心零部件之一。三凯机电在精密传动领域积淀深厚，已在国内自动化市场得到广泛验证，看好其在人形机器人核心部件国产替代进程中的领先地位与规模化发展潜力。</p>", "categor 5元一只；世卫组织：俄不明原因肺炎事件，无持续传播证据", "url": "https://36kr.com/p/4022129475948680?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>月之暗面增资至约1437万</li>\n   <li>MLCC全球龙头子公司计划扩产</li>\n   <li>经销商联谊会“批量”解散？茅台方面回应</li>\n   <li>欧亚经济联盟继续对华油井管征收反倾销税</li>\n   <li>苹果正研发不“录像”的摄像头</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>尊界公布踏板升级时间</strong></p>\n  <p>10月11日下午，尊界客服向记者确认，尊界V800制动踏板支架底座升级方案预计于10月底确认，11月起陆续启动升级。10月8日晚，尊界汽车发布关于尊界汽车制动踏板支架底座相关问题的情况说明，称将进一步优化该部件设计，并为已交付用户提供免费升级选择。</p>\n  <p>11日下午，尊界客服告诉记者，目前，已提车的用户可通过全国任一服务中心预约登记，也可直接联系购车门店登记，届时用户中心将会第一时间联系用户；而未发运车辆会被直接升级后再交付，用户无需额外操作。不过，当前升级方案未确定，暂无法提供具体升级细节。（北京日报、财联社）</p>\n  <p><strong>大闸蟹全线崩盘？中小规格跌至5元一只</strong></p>\n  <p>近日，“大闸蟹全线崩盘”相关话题引发大量关注，冲上微博热搜。据看看新闻10月9日报道，在上海普陀区新沪路，有些中小规格的母蟹价格跌至5元/只，太湖蟹2-3两/只售价仅10元。不过，超大规格精品蟹价格保持坚挺。蟹农表示，一只半斤以上的本地产大闸蟹，出水价在150元左右；公母一对售价在300元。</p>\n  <p>另据荆州新闻网，目前荆州市场大号4两规格母蟹价格在50-55元/斤，4两规格公蟹价格在28-30元/斤，2两规格母蟹价格在35元/斤左右，2两规格公蟹价格在20-25元/斤，整体价格较去年同期每斤低5-10元。</p>\n  <p>界面新闻查询盒马APP获悉，目前2.3-2.7两/只的鲜活大闸蟹（母蟹）售价是25.9元；3.3-3.7两/只的母蟹售价为55.9元。在京东平台，全母蟹3.0-3.8两8只礼盒装的价格为218元，平均一只大约27元；全母蟹6.0-6.3两8只礼盒装价格为1985元，平均一只248元。（看看新闻、荆州新闻网、界面新闻）</p>\n  <p><strong>世卫组织：俄不明原因肺炎事件，无持续传播证据</strong></p>\n  <p>据央视新闻，世界卫生组织10日在其官网发布公报说，关于俄罗斯伊尔库茨克西伯利亚与远东防鼠疫研究所一名工作人员患病死亡事件，根据俄方通报，世卫组织尚未发现与这一事件相关的持续传播证据，但目前尚未确认导致致命疾病的病原体。据俄方通报，伊尔库茨克西伯利亚与远东防鼠疫研究所一名28岁女性工作人员2日因“不明原因肺炎”死亡。</p>\n  <p>世卫组织表示，据俄方卫生部门通报，伊尔库茨克州近期没有报告鼠疫病例，已依据相关卫生法律全面采取综合防疫措施，对这名实验室工作人员及其接触者的检测也未发现高威胁病原体。这名工作人员所在的实验室未发生生物安全事故，且未发现与该病例有关的新发严重肺炎病例。</p>\n  <p>公报强调，根据俄方已提供的信息，世卫组织尚未发现与这一事件相关的持续传播证据。但目前仍存在一个关键的不确定因素，即导致这名实验室工作人员死亡的病原体尚未确认，因此世卫组织无法评估接触者监测持续时长是否足以排除所有可能的致命病因。世卫组织将继续监测这一情况，并在获得更多信息时，评估任何潜在的公共卫生影响。</p>\n  <p>俄联邦消费者权益保护和公益监督局先后发布多份通告，指出患病工作人员曾针对其工作相关的危险传染病接受过疫苗接种并具有免疫力。该机构否认存在第二例病例，称所有与死亡患者有接触的人员都已结束医学观察，未发现与传染病有关的健康问题。（央视新闻、财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>SpaceXAI官方账号更名</strong></p>\n  <p>马斯克当地时间10月10日在社交平台发布一张截图，显示SpaceXAI的官方账号已更名为“SpaceX Super Intelligence”（@SpaceXSI）。此前10月4日，马斯克表示，SpaceX是一家超级智能（SI）公司，我们将把SpaceXAI改名为SpaceXSI。（财联社）</p>\n  <p><strong>微软CEO称AI是潜在内部威胁</strong></p>\n  <p>微软公司CEO萨提亚·纳德拉(Satya Nadella)表示，企业应将强大的AI模型视为潜在的内部威胁，假定它们可能已被攻破，并建立一套“紧急刹车”系统，以防止智能体模型失控。纳德拉10月10日在X平台上发帖称，部署先进AI的企业不应仅仅依赖AI模型开发商的安全保证。“我们必须假定模型已被攻破，并从一开始就对其加以限制。可以把它想象成紧急刹车。获得授权的人员应当始终能够在模型执行任务的过程中暂停或关闭它。”纳德拉表示。就在纳德拉发表上述言论之际，Anthropic和OpenAI近几个月披露了一系列AI模型出现非预期行为的事件，包括Anthropic的一款模型在一起警方调查的谋杀案中提交虚假线索，以及AI模型多次入侵第三方网站。这些披露加剧了外界对前沿AI安全风险的担忧，也让所谓的AI“紧急关闭开关”再次成为讨论焦点。（新浪财经）</p>\n  <p><strong>蚂蚁“灵光”开启小范围内测，新版对标“Meta Muse”</strong></p>\n  <p>据悉，蚂蚁集团旗下AI产品“灵光”已于近日开启新版本的小范围内测，新版对标“Meta Muse”。公开信息显示，今年9月，Meta推出个人智能体Muse。该智能体可介入用户日常生活，并持续跟进用户交待的事宜。接近项目人士透露，灵光相关方向约半年前已开始筹备，期间迭代多个版本，计划本月全面开放。该人士还透露，此次升级的核心，是灵光从能聊天、能生成应用的AI助手，转向拥有长期记忆、可主动推进任务的AI原生个人智能体。灵光新版本还能通过调用Skill和MCP，实现钉钉发信息、调用智能家居设备等功能。据悉，灵光2.0的内测用例集中在长程、变量多、普通人难盯住的场景，例如帮上班族跟踪市场异动、帮家长管理钉钉打卡、旅行中遇航班延误或景区限流重排路线等。（新浪科技）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>“航天线缆第一股”10月12日申购</strong></p>\n  <p>根据目前的发行安排，10月12日有1只北交所新股文峰光电可申购，发行价为11.45元/股，发行市盈率为14.01倍。根据招股说明书，文峰光电主要从事高性能、高可靠性特种线缆及光电组件等产品的研发、生产和销售，产品广泛应用于航空、航天等领域，具备特种线缆定制化生产、柔性制造、精密检测和供应保障及时的科研生产能力。</p>\n  <p>公司长期配套服务于航空航天、兵器舰船、军工电子等领域，为国家级高新技术企业、国家级专精特新重点“小巨人”企业，安徽省技术创新示范企业，制造业单项冠军培育企业。经过多年研发和积累，公司已形成近50个系列、400多个品类、上千种规格的产品。（财联社）</p>\n  <p><strong>月之暗面增资至约1437万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，北京月之暗面科技股份有限公司发生工商变更，注册资本由约1157.53万人民币增至约1437.23万人民币，增幅约24%。值得一提的是，今年以来，该公司已发生多次增资，注册资本从100万人民币增至约1437.23万人民币。该公司成立于2023年4月，法定代表人为杨植麟，经营范围含软件开发、人工智能基础软件开发、人工智能应用软件开发等。股东信息显示，该公司由杨植麟、深圳和谐成长三期科技发展股权投资基金合伙企业（有限合伙）、周昕宇等共同持股。</p>\n  <p><strong>四部门联手，对“速成车”说不</strong></p>\n  <p>工信部等四部门10日公开发布关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）。汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新型人机交互系统、大角度座椅等方面提出具体测试验证要求。业内普遍认为，四部门发布的新规是对“速成车”说不！这几天，舆论广泛关注尊界V800刹车踏板支架断裂事件，讨论的焦点就是汽车尤其是“速成”新能源车的安全问题。尽管事件有待权威的调查结论，但有一点毋庸置疑：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”！“稳”是一种更持久的“快”。近年来，我国汽车产业尤其是新能源汽车产业实现了跨越式发展，来之不易的产业生态、社会信任、消费者口碑，需要产业各方共同维护。创新的脚步不会因为精益求精而变慢，安全才是中国汽车越跑越稳的底气所在。(人民日报)</p>\n  <p><strong>多部门：汽车生产企业不得作虚假、夸大或引人误解的宣传</strong></p>\n  <p>36氪获悉，工业和信息化部等四部门联合发布了关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿），拟规范营销宣传活动。汽车生产企业应当真实客观开展营销宣传活动，如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任，确保消费者正确理解和使用汽车产品创新设计相关功能。</p>\n  <p><strong>中央汇金“打假”：公司不开展代客投资理财活动</strong></p>\n  <p>36氪获悉，10月9日，中央汇金投资有限责任公司发布声明称，公司不开展代客投资理财活动。对于假冒公司或公司工作人员名义进行诈骗的单位或个人，将依法追究其法律责任。中央汇金更新仿冒公司名单，并在声明中表示相关公司及其所出资公司与公司无任何隶属或股权关系，也不存在任何投资、合作、业务等关系，其一切活动均与公司无关。</p>\n  <p><strong>“A+H”上市公司数量持续增加</strong></p>\n  <p>近日，港股上市公司力勤资源在深圳证券交易所主板正式挂牌上市，成为全面注册制实施以来深市主板首家“H回A”上市企业。除力勤资源外，近期，包括映恩生物在内的多家港股公司更新A股上市“进度条”。此外，Wind数据显示，今年以来已经有38家A股上市公司成功实现H股上市，“A+H”上市公司数量持续增加。（中证报）</p>\n  <p><strong>10月沪主板已披露120余份回购公告，累计实施回购超170亿元</strong></p>\n  <p>10月以来（披露日为10月1日及之后），沪市主板公司已发布超120份回购类公告（包括回购计划、回购进展和完成类），上述公告对应回购金额合计约247亿元至464亿元，累计已实施金额超176亿元，其中，进展类公告对应的最新回购金额为166亿元，已锁定整体回购金额（下限）的七成。（第一财经）</p>\n  <p><strong>工业富联回应美337调查</strong></p>\n  <p>工业富联10月11日公告，公司获悉美国国际贸易委员会于当地时间10月9日宣布，就美国Vicor Corporation提出的相关专利侵权主张，正式启动337调查。Vicor指控公司及控股子公司侵犯其一项“垂直供电系统”专利权。经内部核查，本次调查涉及产品处于内部验证评估阶段，对公司目前生产、经营及业绩不造成实质性影响。本次337调查尚处于立案阶段，尚未进入裁决环节，案件最终裁决结果存在不确定性，提醒投资者注意投资风险。（界面新闻）</p>\n  <p><strong>MLCC全球龙头子公司计划扩产</strong></p>\n  <p>据《科创板日报》援引媒体报道，全球MLCC龙头村田制作所旗下子公司冈山村田制作所计划投资约90亿日元，新增产线扩产MLCC等电子零件用陶瓷原料。新产线预计2026年10月动工，2028年4月投产，本次扩产新增产能规模暂未披露。冈山村田所产超微粒、高纯度陶瓷原料，用于村田全球市占第一的MLCC产品。（财联社）</p>\n  <p><strong>江淮汽车增资至约22.54亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，安徽江淮汽车集团股份有限公司发生工商变更，注册资本由约21.84亿人民币增至约22.54亿人民币。该公司成立于1999年9月，法定代表人为项兴初，经营范围含道路机动车辆生产、货物进出口、技术进出口等，由安徽江淮汽车集团控股有限公司、香港中央结算有限公司、安徽省国有资本运营控股集团有限公司等共同持股。</p>\n  <p><strong>多地出台公积金提取新政，提取范围进一步放宽</strong></p>\n  <p>近期，多地正式开始落地住房公积金惠民新政，提取范围进一步放宽。江苏南京、苏州等地已开始受理装修、物业费提取业务，辽宁沈阳也发布九项优化政策，采暖费等支出纳入提取范围。（央视新闻）</p>\n  <p><strong>受内存、存储芯片短缺推高价格，游戏硬件销量跌至13年新低</strong></p>\n  <p>全球内存与存储芯片短缺，正给游戏行业带来沉重打击。微软、任天堂与索尼均上调了自家游戏主机售价，以此抵消元器件成本上涨，以及此前关税带来的冲击。而涨价直接造成销量大幅下滑。市场调研机构Circana的数据显示，8月游戏硬件销售额同比下滑15%，创下13年来8月的最低销售规模。（新浪财经）</p>\n  <p><strong>腾讯入股墨奇智能</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，上海墨奇万象智能技术有限公司发生工商变更，新增腾讯旗下上海启善投资有限公司为股东，同时，注册资本由约154.2万元人民币增至约162.2万元人民币。该公司成立于2025年8月，法定代表人为高文礼，经营范围含技术服务、技术开发、技术咨询、技术交流、技术转让、技术推广等，现由高文礼、深圳市墨菲投资合伙企业（有限合伙）及上述新增股东等共同持股。</p>\n  <p><strong>经销商联谊会“批量”解散？茅台方面回应</strong></p>\n  <p>近日，酒圈盛传各地茅台经销商联谊会“批量”解散的传闻，经过一段时间的发酵后，相关方终于对外进行了回应。多家媒体10月10日报道称，从贵州茅台��销售公司市场工作人员获悉，按照社会组织规范化建设、运行相关要求，目前各省区经销商联谊会、传承人工作部已停止日常工作。但相关人士表示，上述机构停止日常运营，不会影响区域市场业务。各省区茅台酒销售、品牌落地等常规市场工作依旧正常有序推进。此次调整，是茅台响应国家关于社会组织规范管理的相关要求，对相关配套运营机制作出的一次系统性梳理与优化。此外，针对市场流传“茅台停止经销商品鉴会经费支持”的说法，贵州茅台酒销售公司相关人士表示，茅台并未停止对渠道市场活动的支持。但需要提醒的是，截至记者发稿时，贵州茅台官方平台尚未正式对外发表相关情况说明。(证券时报)</p>\n  <p><strong>纽约联储银行：特朗普关税导致67类商品价格上扬</strong></p>\n  <p>美国纽约联邦储备银行的研究显示，如果总统特朗普没有对进口商品征收关税，许多日常用品的价格原本会有所降低，却因为关税而上扬了。报告显示，截至今年2月，特朗普的关税使67类商品的价格水平提高了2.9个百分点。如果没有关税，这些商品的价格原本会下跌近1%。报告指出，平均关税率每增加一个百分点，消费物价会在一年后上扬约0.25个百分点，且关税带来的价格上涨压力将持续到2027年。这些商品价格的上涨，约三分之二是进口关税的直接冲击，其余是美国公司在产品中使用了进口的部件和材料，间接受关税影响。（财联社）</p>\n  <p><strong>广东省省长孟凡利会见美国苹果公司蒂姆·库克一行</strong></p>\n  <p>广东省省长孟凡利10月11日在广州会见美国苹果公司执行董事长蒂姆·库克一行。蒂姆·库克感谢广东省对苹果公司发展的长期支持。他表示，广东是全球重要的制造业中心，拥有完备的产业链供应链、强劲的创新创造活力，更有极富潜力的消费市场与合作空间，聚集了大量苹果供应链伙伴和生态开发者。广东对苹果公司在华发展至关重要，公司很愿意进一步扩大在粤业务布局，围绕供应链协同、创新生态赋能、智能制造和绿色制造、销售渠道拓展等方面，与广东有关城市和企业探讨更多合作，更好实现互利共赢。</p>\n  <p>孟凡利对蒂姆·库克一行表示欢迎。他说，苹果公司是全球知名的科技领军企业，不论是生产端、销售端还是研发端都与广东有着长期广泛深入的合作。当前广东正锚定智能化、绿色化、融合化发展方向，加快构建以先进制造业为骨干的现代化产业体系，我们十分欢迎并支持苹果公司与广东各方面紧密对接，把更多创新产品、新兴业务及研发平台放在广东，不断拓展合作新领域新空间。广东将持续扩大高水平对外开放，打造市场化法治化国际化一流营商环境，为包括苹果公司在内的各类企业在粤发展提供优质服务。（财联社）</p>\n  <p><strong>2026广交会设计创新奖公布，张雪机车获至尊金奖</strong></p>\n  <p>据中国对外贸易中心，2026年广交会设计创新奖（简称“CF奖”）名单已公布，共有174家企业的222件产品获奖，其中，张雪机车820RR获广交会CF奖至尊金奖，另一款获至尊金奖的产品是智巡胶囊机器人胃内窥镜系统。据了解，获奖产品将在第140届广交会期间集中展示。此次获奖产品呈现以下三大特点：一是向“新”集聚，新质生产力特征突出。获奖产品集中于技术创新型企业。从至尊金奖的张雪机车820RR、智巡胶囊机器人胃内窥镜系统，到脑机接口康复系统、外骨骼机器人等前沿精品集中涌现，彰显高端制造创新引领趋势。二是向“智”升级，AI智能产品发展强劲。获奖产品中，智能产品占比32%。AI眼镜、智能会议终端、智能康养设备等产品覆盖家居、办公、医疗、户外等场景。三是向“绿”渗透，绿色低碳贯穿全链路。绿色理念贯穿产品研发、设计、生产全流程。</p>\n  <p>获奖产品中，绿色产品占比44%。光伏幕墙、发电节能一体板等新能源应用，以及甘蔗纸、生物基面料等材料工艺，表明“向绿”发展深化。同时，第140届广交会产品设计贸易促进中心（PDC）也将汇聚海内外优质设计机构，共有来自英国、意大利、荷兰、希腊、土耳其、韩国等6个国家以及中国台湾地区和大陆的101家设计机构参展，同时首次引入声学新材料、电池新能源技术、科技中介等研发设计机构，以设计创新赋能中国制造提质升级。（央视新闻）</p>\n  <p><strong>哈药股份：公司董事兼总裁被立案、实施留置</strong></p>\n  <p>36氪获悉，哈药股份公告称，公司于近日收到相关监察委员会关于公司董事、总裁芦传有的《立案通知书》和《留置通知书》。目前，公司已对相关工作进行了妥善安排，董事长、其他董事和其他高级管理人员均正常履职，董事会运作正常。</p>\n  <p><strong>欧亚经济联盟继续对华油井管征收反倾销税</strong></p>\n  <p>36氪获悉，据中国贸易救济信息网，10月9日，欧亚经济委员会内部市场保护司发布第2026/520/AD16R2号公告，依据委员会2026年10月6日第127号决议，决定维持委员会2015年第101号决议确定的反倾销税不变，继续对原产于中国的油井管（俄语：нефтегазопромысловыетрубы）征收12.23%～31.00%的反倾销税，与此同时，决定将汉廷能源科技（无锡）有限公司[Hunting Energy Services (Wuxi) Co. Ltd.]从价格承诺企业名单中取消，措施自公告发布30日后生效，有效期至2031年10月5日（含）。</p>\n  <p><strong>苹果iPhone Duo加单30%，iPhone 18 Pro系列总订单量未变</strong></p>\n  <p>从苹果供应链方面获悉，苹果公司结构性调整2026年秋季手机新品订单量：对iPhone Duo加单30%，但总量仍未超过1000万台，并对iPhone 18 Pro砍单10%—15%，同时对iPhone 18 Pro Max加单10%—15%，iPhone 18 Pro系列总订单量未变。“这意味着销量在往更高价值产品倾斜，所以整体利好苹果供应链公司业绩。”苹果供应链人士表示。（证券时报）</p>\n  <p><strong>苹果正研发不“录像”的摄像头</strong></p>\n  <p>据媒体近日报道，科技记者马克·古尔曼（Mark Gurman）透露，苹果正在研发一款代号为J450的家用安防摄像头。与市面上的同类产品不同，它不会录制任何视频。这款摄像头将利用AI分析家中及周边环境，再以文字描述的形式把动态推送给用户。（科创板日报）</p>\n  <p><strong>苹果通过反向人才收购拿下Huxe</strong></p>\n  <p>苹果在欧盟《数字市场法案》案件数据库网站披露，其已达成协议，将吸纳个性化音频初创公司Huxe的团队成员与相关技术，这笔交易属于业内常说的反向人才收购（reverse acqui‑hire）。据报道，苹果向欧盟委员会报备称，同意向“Huxe AI的部分员工”发出录用邀约，同时“获得Huxe知识产权的非独占许可授权”。 Huxe的创始团队此前供职于谷歌NotebookLM项目（该产品近期已更名为Gemini Notebook）。Huxe在5月21日宣布关停业务；团队在官网huxe.com发文表示，会将应用从苹果、谷歌应用商店下架，停止服务并删除全部用户数据。（新浪科技）</p>\n  <p><strong>工业富联：美国国际贸易委员会对公司及控股子公司启动337调查，涉及一项“垂直供电系统”专利权</strong></p>\n  <p>36氪获悉，工业富联公告称，公司获悉美国国际贸易委员会于当地时间10月9日宣布，就美国VicorCorporation提出的相关专利侵权主张，正式启动337调查。Vicor指控公司及控股子公司侵犯其一项“垂直供电系统”专利权。经内部核查，本次调查涉及产品处于内部验证评估阶段，对公司目前生产、经营及业绩不造成实质性影响。</p>\n  <p><strong>英伟达据悉正就收购Reflection AI或增加投资进行磋商</strong></p>\n  <p>据报道，英伟达正与美国开放权重模型开发商Reflection AI进行初步谈判，讨论收购这家初创公司或进一步增加投资。报道称，目前仍有许多投资方式正在考虑之中。潜在的交易结构包括“收购式招聘”，即英伟达聘用Reflection AI员工并获得其技术许可，还有与该公司达成协议向其提供更多芯片，或者增加英伟达对Reflection AI的股权投资。（财联社）</p>\n  <p><strong>马斯克：Terrafab工厂将重塑芯片制造</strong></p>\n  <p>马斯克表示，鉴于其旗下公司在制造定制设备方面的专长，他认为它们很可能会“找到比任何人都更好地制造芯片的方法”。马斯克在得州奥斯汀特斯拉超级工厂外对一群客户和投资者表示，尽管他目前“不知道如何制造微芯片，但我们会弄明白”。他10月10日通过直播出席X Takeover活动时指出，在参观竞争对手设施时，他没有看到多少定制设备，而他说自己的公司在制造这类设备方面拥有丰富经验，这使它们能够改进制造工艺。马斯克说：“我认为可以说，这是世界上最难做的事情之一。”“我不想表现得自满或理所当然，但我认为我们很可能会找到比任何人都更好地制造芯片的方法。说实话。我不知道这需要多长时间。可能需要好几年。”（格隆汇）</p>\n  <p><strong>摩根大通计划未来五年欧洲管理资产规模翻倍至2万亿美元</strong></p>\n  <p>摩根大通资产管理公司公布了雄心勃勃的发展目标，计划在未来五年内将其欧洲地区管理资产规模扩大一倍，达到2万亿美元。该机构押注欧洲富裕人群能够推动这家华尔街银行旗下资管部门的业务增长。摩根大通资管欧洲、中东及非洲地区首席执行官帕特里克·汤姆森在采访中表示：“欧洲是我们持续拓展业务的优质市场。我们的三大战略重点——主动型交易所交易基金（主动ETF）、另类资产，以及与头部财富管理机构搭建合作关系，将成为拉动增长的核心动力。”得益于市场上涨以及新老客户持续流入资金，摩根大通资管欧洲业务的管理资产规模在过去9年间已经实现翻倍，从5000亿美元增长至1万亿美元。（新浪财经）</p>\n  <p><strong>前三季度韩国投资者净买入金额前15名的港股合计净买入约2.28亿美元</strong></p>\n  <p>韩国证券存托结算院信息门户（SEIBro）数据显示，2026年前三季度（结算日1月1日至9月30日），韩国投资者净买入金额前15名的港股合计净买入约2.28亿美元，同期净买入前15名A股合计约7987万美元。其中，Global X中国半导体ETF净买入金额高居榜首，前三季度净买入金额为5257万美元。A股方面，前三季度，存储芯片龙头长鑫科技深受韩国投资者青睐，其净买入额占A股前15名合计的一半以上。半导体、5G通信、动力电池等A股成长板块亦获青睐。进入10月，继前三季度中际旭创H股位列港股净买入第二后，其A股又在10月以来登上A股净买入榜首。(中国基金报)</p>\n  <h2>上市进行时</h2>\n  <p><strong>厦门轨道集团100亿元小公募债申报获上交所受理</strong></p>\n  <p>上交所公司债券项目信息平台显示，厦门轨道建设发展集团有限公司100亿元小公募债项目状态更新为“已受理”，受理日期为2026年10月9日。募集说明书申报稿显示，本次债券募集资金在扣除发行费用后，拟将不超过57亿元用于偿还到期/回售的公司债券本金，不超过10亿元用于固定资产投资项目，不超过21亿元用于偿还有息债务，不超过12亿元用于补充流动资金。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>利太智药完成近5000万元种子轮融资</strong></p>\n  <p>36氪获悉，10月10日，利太智药宣布已完成近5000万元种子轮融资。本轮融资由讯飞创投、L2F光源创业者基金及知名产业方联合投资，光源资本担任独家财务顾问。本轮资金将主要用于核心管线研发、算力投入、专利布局、人才招募及日常运营。</p>\n  <p><strong>睿质科技完成首轮数千万元融资</strong></p>\n  <p>36氪获悉，据中关村资本消息，睿质科技完成首轮数千万元融资。本轮融资由中关村资本领投，中关村科学城公司跟投。本轮融资将主要用于核心团队建设、科研智能体工作平台与工业级跨尺度智能计算引擎的持续迭代、自动化实验验证体系建设，以及产业应用场景的进一步拓展与落地。</p>\n  <p><strong>庞伯特完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，AI体育硬件公司“庞伯特”近日完成数亿元B轮融资，本轮由上海国投先导基金领投，元禾璞华、浦东创投等跟投，老股东蓝驰创投持续加注，高鹄资本担任独家财务顾问。</p>\n  <p><strong>太一量生完成超10亿元融资</strong></p>\n  <p>36氪获悉，10月10日，太一量生（上海）量子科技有限公司宣布完成新一轮融资。成立8个月余，公司累计融资超10亿元人民币。本轮融资中，锦秋基金、沄柏资本、鸿瑞达投资、成都高新愿景基金、临港前沿投资等新投资方进入，华控基金、恒旭资本、博远资本、高脉投资、雅瑞资本等老股东持续加注。</p>\n  <p><strong>整理丨</strong>娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-10-12T00:04:23+00:00", "fetched_at": "2026-10-12T04:01:49.350019+00:00", "fingerprint": "6a60e37ea9901b15"}, {"source": "36氪 - 最新文章", "title": "36氪新风向丨在太空中建AI算力中心，马斯克又带火一个万亿美元赛道", "url": "https://36kr.com/p/4022305269600128?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约4800字，建议阅读13分钟</p>\n  </blockquote>\n  <p>一年前，做太空算力的公司如果想拿投资，会遭遇投资人很多冷眼。</p>\n  <p>很难责怪他们的冷淡。太空算力中心听上去有些科幻。简单解释，它希望借助太空永不落山的太阳能与真空辐射散热，实现无限的算力扩张。核心设想是解开地面数据中心的电力与能效的死结。</p>\n  <p>“当时我们内部也认为，这玩意儿不是骗人嘛，市场一度非常冷。”一位投资人回忆。</p>\n  <p>又是马斯克，在大洋彼岸，以一己之力带火了中国硬科技赛道。</p>\n  <p>2025年11月，马斯克在社交媒体宣布，依托星舰（Starship）的发射能力与Starlink V3卫星的升级，SpaceX将构建全球首个太空AI数据中心集群，目标实现每年1太瓦（1TW）的AI算力部署。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_9cb3b56b951e42d19d20bd6b96675681@5920579_oswg218113oswg1080oswg710_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（SpaceX AI Statellite概念图）</p>\n  <p>投资人们很快转变了态度，他们觉得“不靠谱也开始靠谱了”，很多人的想法变化并非更深入的研究或赛道更落地的发展，只是看到“马斯克的pr变猛了”。</p>\n  <p>“一家垂直整合程度如此高的公司如果能把太空算力这件事做正，那其他公司努努力也可以。”一位投资人告诉硬氪。</p>\n  <p>和商业航天、量子计算、核聚变类似，这一赛道也因为国家之间的技术竞赛，在短期内迅速升温。一位投资人对硬氪戏称，又是“摸着马斯克过河。”</p>\n  <p>一群后知后觉的投资人发现，这个半年前没人愿意参与的赛道，额度突然变得供不应求。</p>\n  <p>太空算力赛道代表性的几家公司，「中科天算」和「中科密位」今年相继披露超亿元融资；「一苇宇航」和「轨道辰光」则均在一年内斩获四轮融资，最新一轮融资估值已达40亿元。</p>\n  <p>新玩家也纷纷入局，仅2026年上半年，就有数家太空算力相关公司成立，包括「星纪原点」、「寰宇泛智」、「深空矩阵」、「瑞启深空」等，其背景各不相同，有航天老兵，也有来自投资圈的入局者。此外，AI上市公司佳都科技还孵化了一家专门做太空算力大模型的企业，pre-A轮融资后估值超10亿。</p>\n  <p>甚至，“太空算力”本身成了一个可以抬估值的热词。一位关注商业航天领域的投资人告诉硬氪，不少项目根本和太空算力无关，只是业务能和太空挂钩，就打着太空算力旗号融资。比如一些去年还在做通信卫星的企业，现在都号称要切入算力卫星。“基本上都在说算力的故事。”</p>\n  <p>一级市场也在短时间建造出足以支撑估值的逻辑。不少投资人相信，太空环境可能复制地面互联网络的发展轨迹。首先是单颗卫星的智能化，接着算力卫星之间可协同计算，终局是大规模空间算力中心。“大家觉得会有一个非常大的市场在等着我们。”上述投资人表示。</p>\n  <p>当卫星数量足够多、通信网络足够密集、算力真正进入轨道之后，新的场景和商业模式也会随之出现。而现在，正好是入场下注的起点。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_371bcf67243b4fbda1895ad39362743c@5920579_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>商业航天爆火的衍生品</strong></h2>\n  <p>太空算力的升温，几乎与商业航天的热度同步。</p>\n  <p>全球来看，2025年，全球太空初创企业投资达到553亿美元，创下新的年度纪录，2026年仅第一季度单季，投资已达创纪录的360亿美元。</p>\n  <p>商业航天的商业闭环中，最末端是卫星延伸的业务，目前已经跑出现金流的是星链，而资本看到更大的可能性，则是太空中的AI算力中心。</p>\n  <p>2025年11月，美国初创公司Starcloud发射其首颗技术验证卫星“Starcloud-1”，搭载英伟达H100芯片。12月，Starcloud宣布使用这颗H100完成了在轨大语言模型训练，并运行了谷歌Gemma模型。其远期目标，是在近地轨道上，构建百兆瓦乃至吉瓦（GW）级的集中式空间算力基础设施。</p>\n  <p>同一时期，马斯克也开始高调讨论将计算能力叠加到SpaceX庞大的卫星网络之上，进一步构建太空AI数据中心。谷歌则公布了其“太阳捕手”（Project Suncatcher）计划，探索将TPU等AI芯片部署在由太阳能供电的卫星星座中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_82f88068936d4d78a87cd32817b7229c@5920579_oswg677437oswg1080oswg655_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（英伟达太空算力计划概念图）</p>\n  <p>而在中国，国家队和商业公司都陆续有一些可回收的里程碑出现，单纯依靠“造火箭、造卫星”获得超额机会的窗口正在逐渐收窄，早期投入的机会也越来越少，行业开始寻找新的增量。“太空”与AI结合，加上马斯克的高调入局，点燃了资本对下一代太空产业的想象。</p>\n  <p><strong>如果只把太空算力理解成“把数据中心搬上太空”，可能会低估这件事真正的价值。</strong></p>\n  <p>智能化的低轨卫星能够提供的，不只是一个“更高的位置”，而是一个感知和理解地球的新维度。</p>\n  <p>以海洋场景为例，海洋基建、海上风电、远洋运输等场景都需要持续获取海况、洋流等信息。过去，传感器可以部署在海面或海底，但覆盖范围有限，遥感卫星则能够从更大的空间尺度持续获取海洋信息。</p>\n  <p>如果卫星具备更强的在轨计算能力，就可以直接筛选、识别和分析遥感图像和传感数据，甚至进一步通过卫星通信网络将结果反馈给船舶等终端。类似的逻辑也可以延伸到碳排放监测、农业监测、灾害预警等场景。这意味着，一批过去难以实现、或者成本过高的应用场景，可能因此被重新打开。</p>\n  <p>更进一步，当太空场景内有了在轨算力，未来近地轨道的空间站、空间探索器以及各类商业航天器所需的复杂运算，都无需再折返回传地面，在太空场景部署更多智能化设备将成为可能。</p>\n  <p><strong>不少关注太空算力领域的投资人会用“智能手机”来比喻“太空算力”。“地面没有算力的时候，大家不知道手机可以是智能机。同理，当太空有了算力，也会有更多应用场景出现。”</strong></p>\n  <p>这或许才是“太空算力”对于商业航天行业真正具有吸引力的地方。它带来的不只是卫星计算能力本身，而是有可能成为下一代太空基础设施，进而催生新的应用和商业模式。</p>\n  <p>过去十年，中国商业航天经历了从无到有的快速发展，火箭回收、卫星批量制造、星座组网等领域陆续取得进展。但行业始终有一个绕不开的问题：商业模式。</p>\n  <p>在地面网络和地面站覆盖较为完善的情况下，中国通信卫星很难像Starlink一样，通过卫星直连终端用户形成规模化收入，卫星被送上天之后，如何形成稳定、规模化的收入来源，始终没有特别清晰的答案。</p>\n  <p>太空算力则提供了新的想象空间。<strong>“算力相当于给大家打开了一个新的视野。除了通信之外的一个新的市场，而且是民营企业可以参与的市场，而这个市场里是有可能实现商业闭环的。”上述投���人表示。</strong></p>\n  <p>当然，算力本身并不是终点，它只是应用闭环的第一步。</p>\n  <p>“未来要发几万颗卫星在天上，肯定要产生更多的价值。要把更多的数据利用起来，就要围绕着天地这些数据去找应用。具体有什么应用还有很大的想象空间。但是找应用的前提一定是要有算力。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_743dc44edba24fb9a954069e28e3b947@5920579_oswg4716oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>上天还是在地？</strong></h2>\n  <p>现阶段行业讨论的“太空算力”，实际对应着两条不同的技术路线，“天数天算”与“地数天算”。</p>\n  <p>“天数天算”出现得更早。</p>\n  <p><strong>所谓“天数天算”简单来说，就是让卫星在轨处理所采集到的数据。</strong></p>\n  <p>早期的卫星，尤其是遥感卫星，会持续产生大量图像和传感数据。如果所有原始数据都下传到地面，再进行识别、分析和处理，不仅会占用大量通信资源，也会增加数据处理的时延。</p>\n  <p>因此，“天数天算”要解决的，是让卫星自身具备一定的计算能力，在数据产生的地方直接完成部分处理，例如图像识别、目标检测、图像分割等，再将经过筛选和处理后的结果传回地面，服务于地面产业。</p>\n  <p><strong>但真正将“太空算力”推上风口浪尖的，是踩中AI叙事浪潮的“地数天算”。</strong></p>\n  <p>地面之上，算力基础设施的扩张正面临日益严峻的电力、散热和建设周期等约束。据行业数据，2026年北美AI数据中心（AIDC）的新增电力需求将突破20GW，2027年更将逼近30GW，相当于30座大型核电机组的总装机容量。然而，电网老旧与并网滞后等现实难题，让无数新建数据中心陷入长达1至3年的“排队等电”困境。</p>\n  <p>于是，科技巨头们将目光投向了距太阳最近的太空。谷歌和马斯克的终极想望，都是要利用充沛的太空能源，直接在太空建数据中心，分担地面的算力负担。</p>\n  <p>当然，因为国情不同，中国“太空算力”被推上浪尖，遵循的是“人有我有”的占位逻辑。</p>\n  <p><strong>一位长期关注商业航天赛道的投资人告诉硬氪，目前，中美在“太空算力”领域的想象并不完全相同。</strong>一方面，国内电网韧性更强，地面电力供应相对充足，数据中心建设所依赖的基础设施和产业链也相对完善，成本总体可控。另一方面，SpaceX已经拥有大规模在轨卫星网络，以及较强的火箭发射和补网能力，这些条件都为美国科技公司低成本进入太空提供了基础。</p>\n  <p>相比之下，国内商业航天仍处于产业链快速建设阶段。如果在基础设施、发射成本和卫星规模尚未达到相应水平时，直接复制“地数天算”的路径，意味着需要承担极高的前期投入和工程化成本。</p>\n  <p><strong>“如果直接跳到他们那条路上，算出来的成本账可能完全不划算，反而陷入一场不符合国情和产业化阶段的太空竞赛。”上述投资人表示。</strong></p>\n  <p>对于国内而言，“太空算力”更现实的路径，可能并不是简单复制一个“太空版数据中心”，而是根据产业成熟度逐步推进，先解决单颗卫星的智能化问题，再推进星座协同计算，最终在技术成熟、成本可控前提下，考虑更大规模的算力部署。</p>\n  <p>现阶段，国内“太空算力”所走的路，更像是早期“天数天算”的增强版。</p>\n  <p>早期的在轨计算，更多是运行YOLO、Stable Diffusion等视觉模型，完成图像识别、目标检测、图像分割等任务。</p>\n  <p>随着大模型逐渐成熟，太空端对于计算能力的需求也在提高。比如，实时计算、星座管理等场景，大模型可以承担更复杂的感知、计算和任务规划，这也意味着需要将性能更强的计算芯片送入太空，进一步验证复杂计算系统在轨运行的可行性。</p>\n  <p><strong>“长期来看，我们仍然需要‘地数天算’解决国内地面算力分布不均的问题，但现阶段，仅以‘天数天算’这一高确定性的新兴增量来做行业市场规模测算，已经可以支撑一家上市公司。”有投资人向硬氪透露。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261012/v2_1af846d9830247dfae8c5f03d65e685f@5920579_oswg4962oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <h2><strong>风口之外</strong></h2>\n  <p>反差的是，尽管技术方向明确，资金涌入，一位卫星行业从业者却告诉硬氪，<strong>“存量市场的需求还是相对传统。”</strong></p>\n  <p>大多数卫星在设计时已经会考虑一定的在轨计算能力，但客户真正提出的需求，仍然是“把原始数据下传下来”，而不是在卫星端完成高度充分的边缘计算。</p>\n  <p><strong>上述从业者表示，过去，卫星本身没有太多计算能力，产业也没有围绕“在轨处理”建立起完整的产品和服务体系，因此需求并没有真正被激发出来。</strong></p>\n  <p>与此同时，目前在轨星座的规模也还没有大到足以支撑大量新的应用。</p>\n  <p>马斯克提出太空AI数据中心的设想，也是在Starlink卫星数量达到数千颗规模之后。对于太空算力而言，只有当太空中拥有足够多的节点，星间通信、分布式计算以及专用算力卫星等基础设施才有可能真正发挥价值。</p>\n  <p><strong>眼下，“太空算力”更多处在一个技术和方案验证期。</strong></p>\n  <p>一位行业人士告诉硬氪，目前能够看到的案例，仍以单星的轻量化模型、垂直模型在轨验证为主，小型的卫星网络验证也已经可以跑通。但如果进一步把算力规模做大，工程问题会越来越突出，最直观的就是能源、散热和空间辐射。</p>\n  <p>“遥感卫星每天可能只用几分钟，发生问题是个概率事件，放到天上可能确实没什么问题，但是不代表能够一直长时间运行。真正能够经过长时间稳定在轨运行、可靠运行，是一件非常难的事。”上述行业人士表示。</p>\n  <p>太空并不意味着能源可以无限获取。虽然卫星可以通过太阳能电池持续获取能源，但如果算力功耗不断提升，太阳翼的面积、发电效率以及整星供电系统都需要同步提升，大功率能源供给仍然是需要解决的问题。</p>\n  <p>散热则是另一道难题。太空是真空环境，空气对流基本无法发挥作用，卫星产生的热量主要依靠热传导和向外辐射排出。这意味着，算力芯片功耗越高，卫星需要配置的散热器面积和结构设计压力就越大。</p>\n  <p>此外，空间辐射也会影响计算芯片的长期稳定运行。高能粒子可能造成单粒子翻转、单粒子闩锁等效应，长期辐射还可能带来总剂量效应和器件性能退化。能够在地面跑起来的芯片，并不意味着可以直接放进卫星长期稳定运行。</p>\n  <p>上述行业人士表示，单纯做一个算力载荷并不难，从市场上采购计算芯片，再进行封装和环境适应性设计，就可以形成一个能够上天的算力载荷。“但如果只是把一张卡放到卫星上，没有太大意义。”</p>\n  <p><strong>真正的问题在于，算力功率不断提升后，如何稳定解决太空苛刻环境的伤害。目前国内外都还缺少经过大规模、长期在轨运行验证的成熟方案。</strong></p>\n  <p>不过，技术总是在脉冲式发展。“十年前大家也说不清楚民营公司做火箭能有什么用。而未来的技术迭代、大国在太空数字主权上的博弈，一定都会有太空算力的一席之地。”一位长期关注航天赛道的投资人表示。</p>\n  <p><strong>在他看来，没有风口的时候，资金会更多地流向轻资产、回报快、流动性好的产品。今年资本市场回暖，给了航天这样的重资产、长周期赛道更多资金和关注。</strong></p>\n  <p>而航天赛道“需要这样的风，把大家往前吹一吹。”</p>", "category": "tech", "published_at": "2026-10-12T03:03:27+00:00", "fetched_at": "2026-10-12T04:01:49.350015+00:00", "fingerprint": "f17d8da561f18814"}, {"source": "36氪 - 最新文章", "title": "白犀牛完成1亿美元C轮融资，L4无人配送生态布局提速｜36氪首发", "url": "https://36kr.com/p/4005486834880384?f=rss", "summary": "<p>无人物流赛道持续火热。</p>\n  <p>36氪独家获悉，L4级自动驾驶企业白犀牛近日已完成C轮融资，金额1亿美元，由隐山资本领投，湘潭国资、深重投、湖南财信、韩国友利金融集团、博正资本等跟投。资金将重点投向L4端到端技术与物理AI能力迭代、城市运营网络持续拓展。</p>\n  <p>白犀牛成立于2019年4月，由前百度自动驾驶团队成员朱磊和夏添共同创立，是一家提供全栈式无人配送解决方案、并实现无人车常态化运营的自动驾驶技术公司。公司自成立以来已获超8轮融资，本轮为公司历史上最大单笔融资。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261007/v2_c42d9c8458144ec08f9497b64351be67@5809365_oswg5993990oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">白犀牛无人车</p>\n  <p>“每一轮融资，我们都坚持引入与公司发展阶段契合的股东”，白犀牛CFO于洋向36氪表示。本轮融资的一大特点，是构建了“产业+政府+金融”的复合型资本结构——多元背景的资本带来的不只是资金本身，更是一张生态化的资源网络：资本不仅为公司输血，更带来场景、路权、金融服务与全球化拓展的多重杠杆。</p>\n  <p>领投股东普洛斯隐山资本，是中国物流供应链股权投资中最懂资产与场景的产业派之一，今年已连续两次向白犀牛注资。</p>\n  <p>普洛斯遍布全球的产业资源，不仅为白犀牛提供了稳定的业务订单，也为其全球化拓展打开了通道；韩国友利金融集团的同步注资，则从侧面印证了白犀牛海外业务的进展。</p>\n  <p>此外，本轮融资还有湘潭国资、深重投及湖南财信等地方资本的入局。于洋指出，地方国资不仅关乎路权与政策，更能在产业基金联动、国有资源导入及多元金融服务上，为无人车的规模化落地提供系统性支持。不同的资方，正在把白犀牛的生态一步步搭起来。</p>\n  <p>在于洋看来，融资只是手段：白犀牛的目标是以自动驾驶技术方的身份，把L4能力注入物流产业链的各个环节，联合场景方、制造伙伴与运营服务方，共建无人配送生态。“可以说，我们正在打造生态的路上加速前进”。</p>\n  <p>生态布局的成效也已开始显现。2026年4月，白犀牛推出行业首款车规级无人车RX——由白犀牛提出并正向开发定义，与场景方、制造伙伴协同落地。</p>\n  <p>该车型历时18个月开发，经过高温高寒等严苛环境测试、超20万公里可靠性验证，设计寿命达到8年30万公里，已达到传统轻卡城配车的标准。这款产品让行业第一次有了按车规标准正向开发、可规模化交付的无人配送车型。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261007/v2_6a1bf8fa59f94d90bcfe20e5b86fd782@5809365_oswg122215oswg2074oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">白犀牛 双笼自卸车</p>\n  <p>此外，白犀牛2026年新增了一款货箱达24m³的大容积轻卡无人车R24，目前R24已开启交付，并同步在部分城市开展公开道路测试。于洋告诉36氪，R24补齐了园区大件转运、仓到店调拨、短途大容量城配的市场缺口，和 RX 车型搭配，形成覆盖城配货运各类需求的产品组合。</p>\n  <p>商业模式层面，白犀牛今年还推出了FaaS车队即服务模式，从L4技术输出延伸至运力服务，并联合顺丰、货拉拉等头部合作伙伴构建云端调度系统，实现车辆在不同场景、不同客户间的动态调度。</p>\n  <p>于洋表示，物流行业本身就存在运力忙闲不均的特点，白犀牛的运力服务可以实现车辆在不同场景、不同客户间动态调度，“比如快递业务低谷期，车辆就可以切换到同城货运场景用，可以提高单车资产利用率”。</p>\n  <p>2026年，无人配送行业已从“试点演示”进入“车规化、规模化商用”的爬坡期：产品开始按汽车标准正向开发，场景从快递末端扩展到仓到店、同城货运，商业模式也从卖车走向卖运力。</p>\n  <p>但行业还没到轻松赚钱的阶段，路权和车辆身份仍有一城一策、跨区难复制的问题；雨雪夜间、人车混行等公开道路的长尾场景安全依然有待优化。</p>\n  <p>对白犀牛而言，接下来的竞争不止于车辆落地数量，更在于谁能率先打通技术、产品、路权与运营服务的完整生态闭环。完成本轮最大单笔融资后，白犀牛的生态布局与全球化叙事，正在进入新阶段。</p>", "category": "tech", "published_at": "2026-10-12T03:13:19+00:00", "fetched_at": "2026-10-12T04:01:49.350003+00:00", "fingerprint": "aad5545d8c7260f5"}, {"source": "少 stroKid has confirmed to The Verge that the takedowns are a direct response to claims made by UMG. The label filed a lawsuit in September claiming that DistroKid has created an \"AI-slop pipeline.\" Artists are saying that [&#8230;]", "category": "tech", "published_at": "2026-10-10T18:52:07+00:00", "fetched_at": "2026-10-11T03:37:56.544124+00:00", "fingerprint": "6d57a260d9ad3ce2"}, {"source": "The Verge", "title": "Satya Nadella says we should assume all AI models are ‘compromised’", "url": "https://www.theverge.com/ai-artificial-intelligence/1009337/satya-nadella-says-we-should-assume-all-ai-models-are-compromised", "summary": "In a lengthy post on X, Microsoft's CEO laid out his views on the dangers posed by highly advanced AI models and how to confront those risks. Nadella says we can no longer accept a world where AI is treated as a \"set of nested black boxes\" whose advice and actions we simply accept or [&#8230;]", "category": "tech", "published_at": "2026-10-10T22:10:17+00:00", "fetched_at": "2026-10-11T03:37:56.544118+00:00", "fingerprint": "47aa66d1b4eb0050"}, {"source": "36氪 - 最新文章", "title": "成年人要的「安心」，有时是一支笔给的", "url": "https://36kr.com/p/4019731047731078?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_09d7ab3d805643389841a6ba16868ab9@5679941_oswg119044oswg1080oswg1526_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在快节奏、高强度的现代都市里，我们每天都在被推着向前，生活似乎随时处于一种微小的失控与无序之中。</p>\n  <p>当一切都可以被屏幕与算法快速替代，我们反而开始怀念那些看得见、摸得着的实感。<strong>重新拿起一支笔，在纸页间划掉一项任务、记下一个灵感，这种极为具体的书写，正在成为成年人的“精神兜底”</strong>：不管今天多乱，至少这一笔，是自己说了算。</p>\n  <p>很多时候，这种让人安心的感觉，就来自于桌边那支握感舒适、落笔顺畅的好笔。</p>\n  <h2><strong>地铁站偶遇：成年人重新为笔停留的瞬间</strong></h2>\n  <p>在上海陆家嘴地铁站的地下换乘通道里，人流仿佛被按下了快进键。</p>\n  <p>人群总是踩着几乎一致的急促节奏向前走着，通道两旁的巨幅大屏上，轮番交替着华丽的广告。这些光鲜亮丽的视觉符号早已构成了顶级金融区某种固定的都市背景板。</p>\n  <p><strong>但在刚刚过去的十一假期，人们却在这里遇到了一个有点特别的广告。</strong></p>\n  <p>大屏上整齐铺开的是一片清爽、干净的蓝白背景。画面里没有夸张的特效，也没有奢华的产品展示，主角是身着浅绿色西装与干练衬衫的知名歌手周笔畅。她或微笑着手握一支造型利落的淡蓝色中性笔指向镜头，或侧身与巨型中性笔轻快互动；一旁配着极为醒目的黑体大字——“KAYOU卡游文具，笔笔皆好笔”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_2d4e9279a2e94993a90c0ac02e1c839a@5679941_oswg91768oswg1080oswg360_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_16405413ff5d4ce3b5623d7789bc80ad@5679941_oswg129557oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>在熙熙攘攘的地下长廊里，这种带有几分书卷气的画面，像是在都市噪音里突然插入了一段留白，反而让不少步履匆匆的都市人忍不住放慢脚步，多看一眼。</p>\n  <p>这无疑是一个具有反差感的场景。</p>\n  <p>在很多人的固有认知里，陆家嘴核心地段的大屏广告，往往充斥着各种宏大、炫酷的都市符号与商业宣发。而文具，尤其是日常不可或缺的中性笔，似乎向来被归类为默默无闻的实用消耗品，或是极度依赖学校周边渠道的“学生用品”。</p>\n  <p>这里的核心人群——穿梭于写字楼之间的白领、新中产以及Z世代职场人，在日常生活中早已习惯了全数字化办公。键盘敲击声和触摸屏的冰冷触感占据了绝大多数时间，他们似乎早已远离了那个需要疯狂啃书、大量刷题的文具使用高峰期。</p>\n  <p>但如果站在商业与大众情绪的交叉点去看，这次投放又很恰当。</p>\n  <p>因为当下年轻人对文具的消费逻辑，正在发生转变。过去，我们买一支笔，往往出于纯粹的功能需求，考量的是“耐不耐用”、“什么价格”；<strong>而今天的成年人重新走入文具店，或者在社交平台上被一支笔种草，消费的动因却早已超出了单纯的写字本身。</strong></p>\n  <p>一支设计考究、握感舒适、出墨顺畅的笔，正在演变为一种低成本、高回报的情绪解压好物，一种可以随身携带的“生活兜底感”。当工作日程被无数个待办事项和无休止的开会填满时，在纸上亲手划掉一项任务，这种极具触觉反馈的瞬间，能帮人在纷乱的日常中迅速带来一种被兜底的安心感。</p>\n  <p>从这个角度来看，卡游选择周笔畅作为文具全球代言人，并在陆家嘴进行这样一场生活化、场景化的视觉呈现，本身就有一种非常精准且自然的契合度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_3d7cc3370e1a43b99cd4052f0bf92a61@5679941_oswg121976oswg1055oswg1729_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>首先，周笔畅的名字与产品卖点之间天然存在着一种谐音巧思。</strong>周笔畅名字自带的“笔”字，配合“笔笔顺畅”、“笔笔皆好笔”的记忆点，让消费者在看到画面的第一秒就能产生极高的关联想象，成为粉丝与路人之间传播的契机。</p>\n  <p><strong>更为深层的是周笔畅个人特质与卡游文具品质理念的碰撞。</strong>自出道以来，她就是陪伴年轻人成长的实力派歌手。从早期的“学霸歌手”形象，到如今在音乐赛道上的专注与克制，周笔畅身上那种不浮夸、重品质、务实且有耐心的特质，与一支“好笔”所追求的顺滑、稳定、靠谱不谋而合。</p>\n  <h2><strong>当“好文具”走出小众圈层，成为大众可感知的品质共识</strong></h2>\n  <p>早在去年12月，卡游官宣周笔畅为文具代言人并同步上新零系列中性笔时，<strong>这种天然的信任感就已经在电商平台与社交网络上完成了第一波口碑沉淀。</strong>许多消费者在小红书或电商评论区晒出体验：“本来是因为笔笔代言买来试试，结果发现握感和出墨真的很惊艳”“做工很扎实，放在办公桌上心情都变好了”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_32c1dd079cf741489141a8a2caeb52f0@5679941_oswg1093404oswg623oswg1075_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">用户们的自发分享，图源@小红书截图</p>\n  <p>这种超预期的体验，离不开卡游零系列功能性文具对产品设计和写感的高要求。</p>\n  <p>以零系列中的Z10与Z13为例，设计团队巧妙地将现代极简美学与人体工程学融为一体。</p>\n  <p>Z10打破了传统文具的形态定式，采用“方圆结合”的线条语言——握笔区有着贴合手型的圆润弧线，从笔身中部向顶部延伸为利落的几何方形，考虑到长时间握笔的舒适度，又赋予了产品极具辨识度的视觉焦点。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_ec384c629e8145bdbdeb88381c28b39c@5679941_oswg134487oswg1080oswg1432_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>而Z13则在极简的实色肌理中加入了独特的旋转出芯结构与醒目的红开关视觉元素。旋转90度的清脆“咔哒”声与红色的视觉提示，将每一次开启书写的过程，都转化为了充满感官体验的小仪式。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_f2e975f3496f4309b36a80e2654d1ff6@5679941_oswg58634oswg1080oswg1434_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>卡游文具的产品逻辑，其实是在用做精密仪器的思路做一支日常消耗品。</strong></p>\n  <p>生产一支笔需要5到6套模具，单套模具包含200到300个零件，总计超过1000个高精度零件，仅笔头一个环节就要经过24道工序。笔尖用的是碳化钨圆珠，耐磨且出墨稳定。组装过程中有一道离心保压工序，目的是把安装时可能进入笔芯的空气排出去——因为书写中最让人烦躁的瞬间，就是写到一半突然断墨。</p>\n  <p>这种对高品质的追求，也让卡游在国际高规格舞台上崭露头角。</p>\n  <p>卡游还有一条更高端的文具线KAYOU+，瞄准的是制图、设计等对书写精度要求更高的专业场景。</p>\n  <p><strong>在被称为“文具界奥斯卡”的第14届日本文具店大奖中，KAYOU+拿下了自动铅笔品类第一名和第四名、圆珠笔品类第二名和第四名。</strong>这个奖项的评委不是普通消费者，而是茑屋书店、丸善&amp;淳久堂、LOFT等13家日本知名文具门店的专业买手，他们从约1200件提名商品中逐一筛选。</p>\n  <p>拿下自动铅笔品类第一名的，是一支叫AIMVISION Pro的高精度制图自动铅笔，评委和专业媒体给出的评价是：高刚性笔轴与适度配重、滚花防滑笔握，以及“画出不偏移的专业线条”的书写精度。同期，这款自动铅笔还获得了德国iF设计奖，随后又拿下红点设计奖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_e7c205ee71294d94939f6ba4ab9647d1@5679941_oswg217233oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这些奖项的意义，不只是证明一支笔做得好，更在于，它让原本属于专业文具领域的评价标准，开始被更多普通消费者看见。</p>\n  <p>以前，专业的工业设计、极致的书写体验，往往藏在少数高端文具品牌和发烧友圈层；而现在，当一支笔的握感、配重、笔尖精度甚至模具工艺，都开始成为消费者可以感知、讨论和选择的东西，“好文具”也就不再只是少数人的专业判断。</p>\n  <p><strong>从这个角度来看，卡游正在做的，其实是把这些原本有些小众的品质标准，进一步带进大众日常。</strong>通过工业制造能力和相对亲民的产品价格，那些过去需要花更高成本才能获得的设计感外形和书写体验，开始变成更多人触手可及的日常消费。</p>\n  <p>当“好文具”不再高高在上，品质也就变成了每一个人拿起笔时都能感受到的东西。</p>\n  <h2><strong>成年人的“精神兜底”从一支笔开始</strong></h2>\n  <p>如果把视线从一支笔再往外挪一点，会发现，今天的人们愿意为文具多花一点钱，真正买下的并不只是“好用”。</p>\n  <p>毕竟在这个什么都可以被数字化的时代，笔本身已经不再是不可替代的工具。手机里有备忘录，电脑可以随时记录，日历、待办事项、会议纪要都有对应的软件。理论上，我们已经不需要随身带一支笔了。</p>\n  <p>但有意思的是，纸笔并没有因此消失，反而开始以另一种方式回到年轻人的生活里。</p>\n  <p>一个很直观的变化发生在手账上。<strong>天猫数据显示，2025年平台手账本成交额同比增长超过30%，相关商家数增长超过70%；仅手账本类目下，买家数同比增长近50%。</strong></p>\n  <p>这意味着，人们重新拿起纸笔，并不一定是因为数字工具“不够方便”，恰恰相反，可能正是因为数字工具已经足够方便了。</p>\n  <p>当一天里有大量的信息从手机上涌来，消息、会议、待办、日程不断切换，写字反而成为少数需要人亲手完成、并且不会自动弹出下一条通知的动作。</p>\n  <p>临时冒出一个想法，随手记在纸上；周末做一次计划，在本子上写下接下来想去的地方；甚至只是下意识地在纸张边缘随便画几笔......这些动作没有比敲几下键盘更高效，却拥有一种数字工具很难提供的“完成感”。</p>\n  <p><strong>所以，一支顺手的笔更像是一个随身携带的支点，给纷乱的日常一次最小单位的“兜底”。</strong></p>\n  <p>它不需要专门腾出时间，也不需要学习什么复杂的使用方法，只要放在桌边、包里，就能在那些被工作和生活切得很碎的时刻，帮人重新把注意力拉回到自己身上。</p>\n  <p>这也是为什么，如今购买文具越来越像一种生活方式消费。</p>\n  <p>2025年发布的《淘天文具电教行业趋势白皮书》显示，文具的购买决策者早已成年化，30至39岁人群是主要购买者之一；而办公文具的消费人群中，1至3线城市白领的偏好也较为突出。与此同时，兴趣文具的购买人群则呈现年轻化趋势，18到24岁人群偏好明显。</p>\n  <p>换句话说，<strong>文具早就不只是“学生开学要买什么”的问题了。它开始进入成年人的办公桌、卧室、旅行箱和日常计划里。</strong></p>\n  <p>而成年人挑选文具的方式，也和小时候不太一样。</p>\n  <p>小时候买一支笔，可能先看颜色、图案，或者哪个卡通人物印在上面；现在越来越多人会先拿起来写两笔，看出墨是否顺畅，落笔会不会断断续续，写久了手感舒不舒适，以及它是否符合自己的审美，放在桌面上顺不顺眼。</p>\n  <p>这背后其实是一种很微妙的消费变化：消费者越来越愿意为那些能够真正融入生活的东西买单。</p>\n  <p>一只每天都要用的杯子，一盏放在桌边的灯，一瓶让房间闻起来舒服的香氛，一支握起来顺手的笔——它们都不是什么宏大的消费决策，却都在回答一个很具体的问题：</p>\n  <p>我希望自己的日常是什么样的？</p>\n  <p>从这个角度看，周笔畅与卡游这次合作有趣的地方，也不只是“笔笔代言笔”这个巧合。</p>\n  <p>这些年，周笔畅给人的印象一直不是刻意制造距离感的明星形象。她有稳定的作品、明确的审美和持续的表达，却很少需要靠夸张的人设来证明自己是谁。<strong>这种不太用力的状态，恰好和今天年轻人对生活方式产品的期待有一点相似</strong>——不需要把“品味”写在脸上，也不一定要用一个醒目的logo告诉别人自己买了什么。</p>\n  <p>好看、好用、顺手，然后自然地成为自己生活的一部分。</p>\n  <p>也正因如此，“笔笔顺畅”、“等了20年的代言”这些带有情感温度的梗能够在社交网络上发酵。<strong>它说明一场代言真正有意思的地方，不只是明星替品牌说了一句话，还有两者之间原本就存在的共同认知，</strong>消费者愿意主动接过这个话题，继续往下玩。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_0332e5f46f924052832f8c8a0353e6b2@5679941_oswg537896oswg902oswg715_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网友们对于“笔笔代言笔”的讨论，图源@小红书截图</p>\n  <p>这也解释了，为什么“好文具”正在慢慢摆脱过去的圈层感。</p>\n  <p>它当然可以是手账爱好者精心挑选的一套工具，也可以是设计师手里用于制图的专业设备；但与此同时，它也可以只是一支放在普通办公桌上的笔。你不需要懂什么笔尖参数，也不需要属于某个文具圈层，才有资格判断一支笔好不好。</p>\n  <p>握起来舒服，写起来流畅，看起来顺眼，用久了依然愿意拿起来——这些感受，本身就是最朴素的品质标准。</p>\n  <p>说回最开始的陆家嘴地铁站，那一连串大屏背后，更值得注意的是：在一个已经习惯用屏幕解决一切问题的时代，人们依然会因为一件很小的东西停下脚步。大家依然愿意写字，愿意记录，愿意在每天重复的生活里，为自己挑一支更顺手的笔。</p>\n  <p>效率可以交给机器，但生活的掌控感需要自己完成。<strong>一支顺手的笔，就是日常里最轻盈也最踏实的“兜底”</strong>——原来认真写字，依然是这个时代里很放松、很年轻的生活方式。</p>\n  <h4>撰文、版式｜zhèi</h4>\n  <h4>图片｜除特殊标注外，均来自卡游</h4>\n  <h4>设计｜曲枚</h4>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_3c46f0c86a294708b1d5f6d5da172232@5679941_oswg10193oswg1080oswg90_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>你也会随身携带纸笔吗？会写些什么？</p>", "category": "tech", "published_at": "2026-10-10T07:30:18+00:00", "fetched_at": "2026-10-11T03:37:56.420482+00:00", "fingerprint": "a1f805a9f9b9b540"}, {"source": "36氪 - 最新文章", "title": "AI运动硬件公司获数亿B轮融资，用体育大模型重构网球自主训练体验｜硬氪首发", "url": "https://36kr.com/p/3990015565708035?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，AI体育硬件公司「庞伯特」近日完成数亿元B轮融资，由上海国投先导基金领投，元禾璞华、浦东创投等跟投，老股东蓝驰创投持续加注。高鹄资本担任独家财务顾问。</p>\n  <p>此前公司已连续完成三轮A轮系列融资，神骐资本、明势创投、蓝驰创投、锦秋基金、华创资本及成为资本等头部机构集体参与。</p>\n  <p>融资资金将重点投向AI体育大模型、运动视觉与训练决策技术研发，拓展全球市场，完善海外渠道与本地化品牌运营；落地更多运动品类新品，扩大技术平台复用边界。公司长期目标是普及专业运动训练服务，让普通用户也能获得专业级训练体验。</p>\n  <p>庞伯特最早从乒乓球场景切入，逐步建立起覆盖发球执行、视觉感知、运动分析和训练决策的“手、眼、脑”一体化能力，在行业内率先把自研体育大模型落地至智能发球机硬件产品，并将这套技术能力复用到网球等其他运动品类。</p>\n  <p>公司首款智能网球发球机器人PACE系列于2024年10月上线Kickstarter，众筹金额超270万美元；2026年5月，又推出Aura多合一AI教练机器人，发布当天5小时众筹金额即超100万美元，累计金额超400万美元。</p>\n  <p>目前，庞伯特全球用户已超30万，设备累计发球总量超20亿次，积累了超100万组球路数据。澳网9月28日正式宣布，庞伯特成为澳大利亚网球公开赛官方合作伙伴、官方发球机器人合作伙伴，并同时担任澳大利亚国家网球学院官方发球机器人供应商。</p>\n  <p>随着核心产品和商业化路径逐步跑通，庞伯特由早期的产品与品类拓展、进入到长期平台能力建设阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261010/v2_7c5ece83ab0e418ebd1bedfe5f501f43@6022551_oswg1497999oswg1500oswg1049_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">庞伯特成为澳大利亚网球公开赛官方合作伙伴（图源/企业）</p>\n  <p>运动训练领域，长期存在一个被技术忽视的结构性矛盾。</p>\n  <p>国际网球联合会2024年数据显示，全球网球参与人数达1.06亿。其中，美国网球活跃用户与教练配比高达800：1，专业教练供给严重不足。在中国，网球运动消费市场持续升温，普及度与大众需求同步上涨，但动辄数百元一小时的私教课，把绝大多数初学者挡在门外。</p>\n  <p>与此同时，好教练往往预约困难、时间难以匹配，教学风格也未必契合自身；即便每周安排一节私教课，在自主练习时段，无论是颠球、空挥、发球机训练或对墙练习，用户依然缺少实时的观察与技术指导。大众真正需要的，并不是一个机器陪练对手，而是缺教练、缺陪练、缺高效的自主训练方式。</p>\n  <p>然而，市场上大部分发球设备仍停留在机械吐球阶段：无节奏、无旋转、无指导；也有一些产品拥有视觉感知的能力，但只是后置给到用户一些速度、落点等的数据分析报告，几乎谈不上训练价值。</p>\n  <p>“训练场景里，练习带来的能力提升才是用户的核心需求。”庞伯特创始人兼CEO张海波告诉硬氪，“大家都希望身边能有一个随叫随到的‘AI教练’。TA可以不用一直喂球，但能持续观察、给出实时指导。”</p>\n  <p>这正是庞伯特所锚定的环节，把专业级运动训练能力，从少数人的特权变成大众可及的日常工具。</p>\n  <p>理解庞伯特的产品逻辑，要回到运动训练的本质。过去，传统发球机只完成了“发球”动作，却没有实现“教学”闭环。一个好的教练需要同时具备三种能力，用手喂出精准的球路，用眼观察学员的跑位和动作，用脑判断问题并给出实时反馈。</p>\n  <p>庞伯特将这套能力拆解为“手-眼-脑”一体化架构。</p>\n  <p>“手”对应发球与供球系统，稳定可控的发球能力是实现智能指导的物理基础。依托这套执行单元，庞伯特可以持续沉淀海量球路样本与用户训练行为数据，再逐步加入“眼”和“脑”的能力并持续迭代。</p>\n  <p>“眼”是高速视觉感知模块，实时捕捉挥拍姿态、击球回球速度落点等练习场景数据。</p>\n  <p>“脑” 则是庞伯特提出的体育大模型，对采集到的多维度信息做解析判断，输出动作纠错、训练方案优化等专业指导。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260919/v2_46792cebef054289a9f9e82042cb2862@6022551_oswg2696677oswg2570oswg1432_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">庞伯特“手-眼-脑”一体化架构（图源/企业）</p>\n  <p>“用户不需要感知背后有多大的模型，只需要感到：它看得懂我，也知道下一步怎么帮我练。”张海波对硬氪表示，“我们所说的‘体育大模型’，不是简单把通用模型接到发球机上，而是具备‘感知-决策-执行’一体化能力的模型，而是在通用多模态能力之上，结合机器人将大模型从虚拟世界拉入物理世界，真正参与到物理训练中。”</p>\n  <p>这个系统的核心能力，是将用户的自然语言表达转化为可执行的训练方案。当用户提出“我想改善反手稳定性”的诉求时，系统需要结合实际表现给出建议，再逐步转化为具体的训练安排，比如发什么球、什么节奏、关注用户的什么动作问题、什么训练强度。</p>\n  <p>技术路线上，庞伯特选择端云协同架构。端侧承担低延迟感知和轻量判断，保证实时反馈的响应速度；云端结合多模态信息、球路数据和教练知识，完成更复杂的分析；经过验证的能力，再通过训练、蒸馏等方式下沉到终端。</p>\n  <p>“长期方向是从‘理解运动’走向‘参与训练’。”张海波表示。这意味着模型不仅要能分析动作对错，还要能理解训练逻辑，什么时候该加难度、什么时候该巩固基础、什么样的球路组合能针对性解决某个技术短板。还需要结合连续训练表现，规划连续训练计划，并联动发球设备安排针对性练习。</p>\n  <p>从“手”的稳定输出，到“眼”的实时捕捉，再到“脑”的即时决策，三个模块的协同，让庞伯特的产品不再只是一台单纯的发球机器，而是具备完整感知-决策-执行闭环的AI Coach（训练教练）。</p>\n  <p>“我们不是要替代专业教练，而是让专业指导延伸到更多日常训练中，让用户独自练球时也有方向、有反馈。”张海波说道。</p>\n  <p>目前，庞伯特平台已积累100万组乒乓球球路和超过20万组网球球路。Aura搭载可拆卸的120fps双摄视觉模块Spotter，拥有10Tops端侧算力。Aura上市后，每年可采集超过500万小时有效的高质量运动交互数据。</p>\n  <p>“我们有运动领域最有价值的精标数据，是带有因果链条的闭环数据——发现问题、给出指导、执行纠错、效果验证。这些数据在互联网公开数据集中绝不可能获取。”张海波指出，“数据量的积累只是第一步，真正有价值的是把‘看见的问题、给出的指导、后续的变化’关联起来。”</p>\n  <p>张海波告诉硬氪，这类数据既能帮助AI更准确地理解人，也能为未来的运动机器人提供学习基础。它构成了竞争对手难以短期复制的壁垒：从“采集-标注-训练-验证-迭代”的完整循环，叠加运动场景、设备执行、专业判断和效果反馈之间的链路，形成多维度数据间的因果关联。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260919/v2_9092707a75f0406a84c276f8751968b4@6022551_oswg3895577oswg2156oswg1424_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Aura多合一AI教练机器人（图源/企业）</p>\n  <p>AI体育硬件的核心价值，不在于把发球机做得更复杂，而在于让运动训练从依赖稀缺的专业教练资源，走向可标准化、可规模化复制的智能服务。</p>\n  <p>当前，AI运动训练领域已步入商业化落地的关键窗口期。Research and Markets最新数据显示，全球AI私人教练市场规模从2025年的15.72亿美元，到2026年将增长至20.25亿美元，复合年增长率达28.9%。针对性化解专业教练供给不足、训练场景受限、自主训练效率偏低等固有痛点，当前依托AI实现个性化训练反馈的硬件装备仍处在快速成长期，有望在2028年迎来规模化落地的爆发拐点。</p>\n  <p>“过去，各种发球机在专业用户与运动爱好者中的渗透率不足10%。但到了现在，数字化、AI技术的融入，加上中国成熟的供应链能力，增量空间被彻底打开。”张海波说。</p>\n  <p>庞伯特以“手-眼-脑”一体化架构为底座，让体育大模型从“理解运动”走向“参与训练”，由AI Coach完成从动作识别到训练方案生成的闭环，再以持续积累的多模态数据构建算法壁垒。从专业竞技到大众运动，从单一品类到多运动平台，庞伯特正试图验证从技术到产品到商业化的完整闭环。</p>\n  <p>按照规划，庞伯特将以自研体育大模型为核心底座，持续升级AI Coach的运动解析与交互体验，横向拓展匹克球、板式网球、羽毛球、棒球等项目，推动产品从单一智能训练设备向更完整的智能运动系统演进，逐步构建覆盖多运动品类、软硬件协同的全球AI体育科技平台；同时，进一步加快全球化市场渠道的建设与落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260919/v2_c85d1f5c15cd43c2a7866e8144b5307f@6022551_oswg2673036oswg2164oswg1432_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">覆盖多运动品类、软硬件协同的AI体育科技平台（图源/企业）</p>\n  <p><strong>以下为硬氪与庞伯特创始人兼CEO张海波的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：庞伯特Aura在海外众筹和销售表现亮眼，此次重点推出的AI Coach功能，目前在实际训练中能给用户带来什么样的智能化体验？它的能力边界在哪里？</strong></p>\n  <p><strong>张海波：</strong>我们希望把“有人陪你打球”，进一步变成“有人帮你练好球”。</p>\n  <p>Aura的AI Coach突破最大的是实时性，一个教练最基本的能力是实时，用户打了一拍球，我们希望给到最及时的反馈，在体育场景下打球的节奏很快，所以这是一个极大的技术考验；</p>\n  <p>庞伯特当前聚焦在击球动作和完成度两个维度。系统会识别出用户动作中的问题，给出简短、可操作的提示，帮助用户发现自己不容易察觉的偏差。比如引拍时机、击球点位置、重心转移是否到位。相比堆叠专业指标，我们更关注用户能否理解：这一球哪里值得调整，下一球应该注意什么。</p>\n  <p>另外，我们的教练能力还正在进化，我们会把理解个人水平和训练目标，再结合连续训练表现，识别长期技术短板，不是单次失误，而是跨越多次训练、多个场景的共性短板，再生成适合用户的球路，联动发球设备，安排针对性练习。比如机器人会发出像教练现场的适合这个用户水平的球路，再结合智能化教练能力，最大化提高用户的训练效率。</p>\n  <p>我们不是要替代专业教练，而是让专业指导延伸到更多日常训练中，让用户独自练球时也有方向、有反馈。</p>\n  <p><strong>硬氪：体育大模型的持续进化离不开数据。庞伯特目前在数据飞轮上的实际进展是什么？从“数据积累”到“可验证的闭环”，中间还需要解决哪些问题？</strong></p>\n  <p><strong>张海波：</strong>过去几年的积累，让我们握住了极其罕见的底层资产：平台已沉淀100万组乒乓球球路和超过20万组网球球路；随着搭载120fps双摄与10Tops端侧算力的Aura上市，预计每年将产生超500万小时高质量运动交互数据。</p>\n  <p>但数据量本身并不等于数据可用性。在工程层面，我们搭建起了“视频预标注+专业教练人工复核”的基础链路，解决从“有数据”到“数据能用”的问题。</p>\n  <p>首先要做的，是把教练的隐性经验转化为精标数据。运动姿态的判定不像图文识别，不同教练对“引拍太晚”的理解可能截然不同，我们通过顶级教练团队的复核机制，把模糊的经验转化为高精度标准。</p>\n  <p>更关键的是构建带“因果链条”的闭环数据。庞伯特的优势在��拥有硬件终端——我们不仅记录用户哪里打得不好，更记录AI给了什么建议、设备调整了什么发球策略、以及用户后续击球姿态的改善幅度。只有带因果标注的数据，模型才能学会“什么样的指导真正管用”。</p>\n  <p>这件事的门槛从来不是“数据量”本身，而是能否长期、稳定地获取“带因果链条的真实训练数据”。庞伯特同时拥有硬件终端、物理训练场景和体育大模型基座，这会促进我们形成高效驱动模型迭代。</p>", "category": "tech", "published_at": "2026-10-11T02:00:00+00:00", "fetched_at": "2026-10-11T03:37:56.420470+00:00", "fingerprint": "351e0aa49843ec2c"}, {"source": "The Guardian - World", "title": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "url": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "summary": "<p>Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding</p><p>Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).</p><p>As a result of <a href=\"https://www.theguardian.com/environment/2026/sep/26/what-is-el-nino-causes-can-we-reduce-risks\">the
