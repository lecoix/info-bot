to put me on a paid [&#8230;]", "category": "tech", "published_at": "2026-09-09T22:15:52+00:00", "fetched_at": "2026-09-10T02:48:51.782595+00:00", "fingerprint": "bd5466faf7db5a2b"}, {"source": "The Verge", "title": "The incomplete history of Duo devices", "url": "https://www.theverge.com/tech/992755/apple-iphone-duo-history-of-devices", "summary": "Apple announced the company's first device with a folding screen today, the iPhone Duo, but that's where the firsts end. The Duo is not only far from the first foldable on the market thanks to the efforts of Samsung and Google, but it's also not the first product to be called the Duo. Former Apple [&#8230;]", "category": "tech", "published_at": "2026-09-09T22:23:35+00:00", "fetched_at": "2026-09-10T02:48:51.782589+00:00", "fingerprint": "e9bb0a282969f61e"}, {"source": "The Verge", "title": "The black iPhone Pro returns", "url": "https://www.theverge.com/tech/993048/iphone-18-pro-black-color", "summary": "Apple has seen reason: It has a black model in the iPhone Pro lineup again. Last year, Apple went bold with its colors for the iPhone 17 Pro, offering a flashy orange, a shiny silver, and a dark blue. Don't get me wrong, they looked nice. But there was no black (or dark gray) for [&#8230;]", "category": "tech", "published_at": "2026-09-09T22:37:51+00:00", "fetched_at": "2026-09-10T02:48:51.782583+00:00", "fingerprint": "2f5e5871d2f1e13d"}, {"source": "The Verge", "title": "There aren’t AirPods with cameras yet and I hope it stays that way", "url": "https://www.theverge.com/tech/993064/no-airpods-with-cameras-apple-event", "summary": "September Apple events are always a swirl of information and new, exciting products, and today's was no different. Apple announced its first foldable, the iPhone Duo, alongside the iPhone 18 Pro and Pro Max; active noise cancellation (ANC) is now on the cheapest AirPods model, the AirPods 5; and a Siri Recap feature comes to [&#8230;]", "category": "tech", "published_at": "2026-09-09T23:00:04+00:00", "fetched_at": "2026-09-10T02:48:51.782573+00:00", "fingerprint": "a77658ea9247b643"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨镭萌科技获千万融资，AI陪伴或许还有另一种可能？", "url": "https://36kr.com/p/3975777320284422?f=rss", "summary": "<p>文丨果脯</p>\n  <p>36氪获悉，2026年9月9日，AI机器人研发公司杭州镭萌科技在Inclusion外滩大会现场，宣布完成千万级天使轮融资。本轮融资由时尚传媒集团与弘颐资管集团联合领投。</p>\n  <p>其中，领投方时尚传媒集团成立于1993年，旗下品牌覆盖服装、珠宝等多个领域。本轮投资是他们首次在AI机器人方向布局。9月25日，镭萌旗下AI潮玩bibo将作为“快乐星球专属领航员”参加2026时尚芭莎之夜。届时，双方还将围绕后续设计师合作、限定产品及内容体验展开共创。</p>\n  <p>另一家领投方弘颐资管集团主要关注科技领域投资，方向覆盖了具身智能、灵巧手、多模态大模型、量子计算等领域，其代表投资项目包括阶跃星辰、北京人形机器人创新中心、灵心巧手、图灵量子。与时尚传媒不同，他们更看重镭萌科技的科研能力与技术潜力。</p>\n  <p>随着本轮融资完成，镭萌科技在AI机器人市场的布局路径也基本明确。一方面，时尚传媒不仅能为镭萌科技提供资金，还拥有时尚IP、明星等资源，有相当丰富的产业资源和跨界路径。另一方面，弘颐资管在具身智能产业链方面的布局，也可以与镭萌科技的研发形成协同，推出许多更前沿的技术设计。换而言之，他们希望把bibo打造成兼具科技与时尚的前沿产品。</p>\n  <p>镭萌科技成立于2025年1月，核心团队成员共30人，主要来自阿里巴巴、腾讯、字节跳动等头部互联网公司。</p>\n  <p>其中，创始人马丁（王寿畅）曾在阿里任职15年，曾参与阿里旺旺、支付宝、斑马智行等产品的定义与设计。在创办镭萌前，他曾推出的科技潮玩等智能产品累计销量迄今已超150万件。基于这份经历，他在品牌合作、电商商家和达人方面有都有所积累。</p>\n  <p>目前，公司核心产品bibo已于2026年6月正式上市，定价1499元。bibo是一款潮玩形态的非语言情感机器人，产品高度15.5厘米，重量330克，基本上是成年人一手能握住的大小。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_a268f7c1921143c0a5add06e22fcee9d@6202862_oswg643903oswg1080oswg507_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">bibo宣传PV</p>\n  <p>与市面上多数AI玩具不同，bibo更接近于“有潮玩外观的AI情感机器人”。它采用了具身智能架构，兼具观赏与机器功能属性。产品搭载5大类传感器，并配备了高移动自由度的摄像头，采用多模态传感器阵列。</p>\n  <p>在此基础上，公司还自主研发了情感大脑与多模态反馈机制，让bibo能根据用户的所见所闻不断学习，并根据用户的实际情绪变化作即时行为反馈。</p>\n  <p>镭萌科技表示，去年市面上涌现的AI类产品，大多是毛绒外观加上大语言模型对话功能，并未脱离玩具或纯语言聊天的框架。而采用具身智能架构后，bibo能够给用户带来跨时代式的交互体验。</p>\n  <p>比如在网球场景中，bibo可以作为网球爱好者的陪伴工具，挂在网球包上作为装饰品，在场边记录用户的精彩瞬间。甚至bibo会根据用户当下情绪变化，调整照片的输出色调——当用户开心时，照片整体颜色就会更偏热烈，而伤心时，bibo则会将色调调整得更安静、清冷。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_3e58f453d9c846328f330819465cdbc6@6202862_oswg935472oswg1076oswg717_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">bibo与网球比赛合作</p>\n  <p>“消费者并不关注产品背后的技术细节，而是关注科技对生活带来的改变。而情绪恰恰是所有需求的起点。”</p>\n  <p>事实上，在最早的设想中，镭萌科技一度将产品的重心放在机器人的“功能性”层面。</p>\n  <p>他们曾制作过一款可以在家庭环境中移动并完成多种任务的机器人，可随着原型机开发完成，他们发现这类机器人现在并不能真正实现市场层面的落地，比如行为逻辑往往涉及多个技术环节，如身体结构、电池、芯片、算法等等，实现起来成本过高。这类机器人的价格普遍在数万元区间，在大众消费群体中难以广泛推广。</p>\n  <p>因此，镭萌科技最终放弃了成本最高的行动关节部分，连已经完成涉及的柔性臂技术也直接放弃，将所有研发资源集中于情感大脑。</p>\n  <p>镭萌科技方面表示，将技术集中于情感路线主要基于两大判断。第一，从2024年年底开始，多家科技公司都已陆续向多模态模型延伸，该��术在市场的整体成熟度在提升。第二，情感领域的应用场景对机器人的模型精度不会提出太高的要求，在实际设计层会允许更高的容错。</p>\n  <p>更进一步，市面上潮玩形态的产品也基本符合这类机器人的外观。</p>\n  <p>一方面，泡泡玛特等品牌已经验证了潮玩外观在大众市场的普适性与潜力。同时，潮玩形态如今也成为多家公司的形象设计核心参考思路，能更高效实现IP与消费者之间的互动。另一方面，这类产品在功能性层面还未出现一套广覆盖的方案，而bibo恰恰能补足该方面的需求。</p>\n  <p>今年1月，bibo于美国CES 2026完成了全球首秀，随后接连参加了日本东京玩具展、德国IFA展。截至目前，它已进入全球16个国家和地区。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_423e57c42ad34140b5574dd73b477960@6202862_oswg44800oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">bibo</p>\n  <p>据官方数据，开售后，首批bibo很快就售罄，用户日均互动次数超过60次，活跃用户日均陪伴时长超过120分钟。</p>\n  <p>此外，现场镭萌科技还发布了公司未来的3大布局方向：全球渠道拓展、bibo周边产品开发与供应链备货、IP合作与衍生品开发。</p>\n  <p>公司已在天猫、京东、小红书等平台完成布局，并以华东为核心拓展线下渠道，首家线下体验店已落户杭州文三数字街区。后续，他们也准备将bibo推进到日本、东南亚及美国市场。公司方面表示，未来还将开放bibo的硬件接口和软件平台，允许开发者和用户为bibo创造新的功能和互动方式。</p>\n  <p>时至今日，AI陪伴机器人赛道已进入快速扩张阶段。据《2026年AI陪伴机器人行业观察报告》显示，中国陪伴机器人行业市场规模2024年约为796亿元，预计2026年底有望向1100亿至1400亿元区间迈进。在2026年CES上，参展的AI陪伴类企业超过30家，其中中国厂商至少占20家。</p>\n  <p>而在这般如火如荼的热度下，明年AI陪伴机器人或将迎来一次前所未有的市场爆发期。</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s/fWN8XWbEPPVhNrV4dXD_kw\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-09-09T06:30:00+00:00", "fetched_at": "2026-09-10T02:48:51.571455+00:00", "fingerprint": "3e188ff38b813d69"}, {"source": "36氪 - 最新文章", "title": "服饰门店打破传统，线上引流到店成新的增长点", "url": "https://36kr.com/p/3975856234082563?f=rss", "summary": "<p>服饰门店的新生意，正在从门店之外开始。</p>\n  <p>屏幕上的一次心动，可以让一家门店多年积累的商品、搭配与服务，成为消费者专程到访的理由，也让品牌重新看见线下门店的增长潜力。</p>\n  <p>今年4月，思加图入驻抖音生活服务，通过短视频、直播和达人内容展示当季鞋款、穿搭及联名系列，并以到店代金券连接线下消费。三个月后，其全国65个城市的209家门店接入这一业务。</p>\n  <p>不只是女鞋品牌。UR、361度、卓诗尼等也在尝试类似路径：以内容触达消费者，由门店承接体验和履约，再将一次到店沉淀为可持续经营的会员关系。</p>\n  <p>服饰品牌正在重新理解内容与门店的关系。内容平台不再只承担品牌曝光或线上卖货的功能，也开始参与线下门店的获客与交易。</p>\n  <p>对于手握数百乃至上千家门店的品牌而言，一道新的经营命题已经出现：如何把内容流量转化为可核销、可成交、可持续运营的到店生意？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1c5a11e5da7642a8b5bb11716819993f@5679941_oswg818172oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">思加图线下门店</p>\n  <h2><strong>消费决策前移，门店需要新的获客入口</strong></h2>\n  <p>服饰是一门需要被看见的生意。</p>\n  <p>过去，这份注意力很大程度上由位置分配。商场把人带到店前，橱窗让人停下脚步，导购再向顾客介绍商品。选址、陈列与服务，共同构成了门店争取生意的基本功。</p>\n  <p>内容平台的崛起，改变了这套注意力分配方式。</p>\n  <p>什么颜色开始流行，一件外套可以怎样搭配，某双鞋更适合通勤还是度假——消费者在出门之前，就可以通过视频和直播获得答案。内容把衣架上的商品放进具体生活场景，也让购物决策更早发生。</p>\n  <p>埃森哲消费者调研显示，2025年，在有明确购物需求时，60%的受访者通过电商网站查找商品与服务信息；通过直播间或抖音、快手、B站等视频网站获取信息的受访者占比为50%，而2021年这一比例仅为22%；与此同时，选择前往商场、门店体验的比例从48%降至38%。</p>\n  <p>尽管这是一份跨品类调研，但它指向了一个共同趋势：消费者的信息入口已经改变。过去，了解时尚资讯与完成购买往往同时发生在线下；如今，了解商品的环节更多发生在互联网上，购买则分散到不同渠道。</p>\n  <p>对服饰门店而言，获客方式也必须随之改变。过去，开在顾客经常经过的地方，就意味着占据先机；如今，品牌还需要在消费者决定“去哪里”之前，先进入他的考虑范围。好位置依然重要，但门店不能只依赖自然客流，还需要主动介绍自己、创造到店理由。</p>\n  <p>而整个服饰市场，并没有给门店留下太多等待的空间。</p>\n  <p>国家统计局数据显示，2025年，限额以上单位服装、鞋帽、针纺织品类零售额增长3.2%，实物商品网上零售额中的穿类商品增长1.9%，两项数据均处于低个位数增长区间。对于服饰品牌来说，提高现有门店的经营效率，已经变得更加紧迫。</p>\n  <p>这并不意味着消费者不愿意逛街了。商场依然热闹，但客流不会平均分配给每一家门店。消费者可能因为一顿饭、一场电影或一次朋友聚会走进商场，服饰店却仍需单独争取一次被选择的机会。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_ab7de8f08d1c46a8ae4a18003afaf6ef@5679941_oswg159886oswg1564oswg1079_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">361度超品店</p>\n  <p>361度新零售负责人钱华认为，门口路过的人、导购手中的老顾客，以及商场联营带来的客流，曾经是门店的主要客源，“而这几年都在变薄”。</p>\n  <p>与此同时，线下门店的价值并未消失。尺码、版型和穿着感受因人而异，试穿与搭配仍能帮助消费者完成最后的判断。问题在于，这些价值需要在消费者抵达之前，就被提前看见。</p>\n  <p>门店依然拥有难以替代的体验优势，只是它需要一个新的获客入口，把这种优势转化为消费者愿意专程到店的理由。</p>\n  <h2><strong>从内容到核销，一次到店如何成为生意</strong></h2>\n  <p>把商品介绍给消费者，只是这条通路的起点。</p>\n  <p>在9月2日举办的抖音生活服务品牌零售行业峰会上，抖音生活服务KA品牌零售行业负责人吕涛谈到，线下门店真实的商品与服务价值，往往难以被消费者提前感知。内容的作用，就是把这些优势呈现在消费者面前，让他们在到店之前便成为进店理由。</p>\n  <p>百丽旗下中高端主力女鞋品牌思加图展示的是当季商品。女鞋穿搭、达人探店与联名款展示，让消费者先看到一双鞋可以怎样穿、适合什么场景，再决定是否到店试穿。据百丽集团首席用户运营官罗征介绍，思加图经内容种草后到店下单的GMV占比达到69%。</p>\n  <p>在罗征看来，这些短视频和直播内容相当于为门店开了一扇“线上橱窗”。</p>\n  <p>到店理由也可以更加具体。卓诗尼推出“山野系列”新品时，将线上首发与武汉门店的“一日店长”活动结合起来。新品内容先吸引关注，线下活动再提供明确的出行动机。对于消费者而言，去店里既可以看新款，也可以参与活动，原本“有空再说”的兴趣，更容易变成一次确定的行程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_67aa7b45240a4b5187067be7d846eae0@5679941_oswg1126240oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">卓诗尼“一日店长”活动</p>\n  <p>门店自己也开始站到镜头前。361度的部分区域直播会使用方言，并结合当地消费者的习惯介绍商品。相比统一的品牌表达，熟悉门店和本地顾客的员工，更容易讲清楚这家店有什么、适合谁来买。</p>\n  <p>互联网可以把一件商品介绍给很远的人，但门店交易最终发生在一个人愿意前往的距离之内。因此，内容不仅要让消费者产生兴趣，还要回答两个更具体的问题：喜欢的商品在哪里，到店之后能获得什么。</p>\n  <p>而连接线上兴趣与线下消费的载体，往往是一张代金券。</p>\n  <p>UR最初在上海、广州等区域测试到店代金券，随后逐步扩大覆盖范围。以其推出过的“500元抵600元”代金券为例，消费者先在线上锁定一笔门店消费权益，到店后再根据适用规则选款、试穿和搭配。</p>\n  <p>这种模式为服饰消费保留了“逛”的空间。试穿留在线下，意味着品牌仍有机会借助更丰富的货品和现场服务，帮助消费者找到真正适合自己的选择。</p>\n  <p>但对于服饰到店业务而言，售券并不等于最终成交。购券率、核销率、到店后的实际商品成交额以及会员转化率，分别对应消费者从产生兴趣到完成购买的不同环节，也共同决定这门生意是否真正成立。</p>\n  <p>一张代金券在手机上完成交易只需要几秒，但消费者最终会买什么，仍要到门店里见分晓。</p>\n  <p>正如抖音生活服务KA品牌零售行业运营负责人陈沛洵在峰会中指出的那样，消费者是否愿意走进门店、实际购买了什么、最终是否完成核销，更能反映真实的消费需求。内容能否带来生意，还要到门店里寻找答案。</p>\n  <p>有人因为视频里的一双鞋进店，却发现另一款更适合自己；有人原本只关注一件单品，也可能在导购建议下找到一套完整搭配。罗征基于自身业务观察提到，领券到店的消费者，连带购买率和复购率更高、退货率更低。</p>\n  <p>线下体验的价值，正体现在这种更充分的选择过程与更完整的购买结果中。</p>\n  <p>而到店、成交之后，生意仍未结束。</p>\n  <p>据介绍，思加图入驻抖音生活服务三个月内，新增品牌会员超过3万。罗征还注意到，线上存在一批尚未购买、但已经关注品牌的年轻消费者。如果只依靠成交记录，品牌很难识别这些潜在顾客；通过内容与到店链路，品牌则有机会在购买发生之前就建立连接。</p>\n  <p>361度早在2024年下半年，就开始推进平台业务与自有会员系统的衔接，将购券、核销与后续购买行为放在一起观察，再根据消费者的购买周期提供服务与权益。</p>\n  <p>由此，一条更完整的经营链路逐渐形成：内容创造兴趣，代金券推动行动，门店完成体验与成交，会员运营延续消费关系。服饰品牌得到的不只是一次交易，还有一位可以持续经营的顾客。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_524e2d7d6aeb42589886a700a0bb4646@5679941_oswg1620669oswg1080oswg1122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">思加图抖音直播现场</p>\n  <h2><strong>从流量尝试到长期经营，服饰到店生意走向成熟</strong></h2>\n  <p>随着越来越多品牌入场，“内容—到店”正在从一次流量尝试，走向更系统的长期经营。</p>\n  <p>相比餐饮，服饰消费频次较低，兴趣未必会立即转化为成交；试穿和搭配需要时间，门店服务也很难被大幅压缩。门店分散在不同地区，总部的一套安排未必能覆盖所有需求；在加盟体系中，品牌还要协调不同经营者之间的利益。</p>\n  <p>这些行业特征，决定了服饰到店生意不能只靠一次活动或一场直播，而要建立持续的内容供给、顺畅的门店履约和稳定的经营机制。</p>\n  <p>首先，低频消费要求品牌把内容经营变成日常。</p>\n  <p>思加图的数据显示，其播放量排名前十的视频，只贡献了不足一成的相关成交，大量交易反而来自那些数据表现并不突出的日常内容。</p>\n  <p>爆款可以帮助品牌获得关注，但成交未必发生在爆款展示的商品上。消费者可能因为一条内容认识品牌，最终却在其他内容或门店场景中完成购买。这意味着，服饰品牌需要跳出对单一爆款的追求，在两次购买之间保持稳定触达。</p>\n  <p>其次，内容带来的兴趣，需要由门店顺畅承接。</p>\n  <p>361度接入相关业务初期，开放核销的门店数量不足，消费者购券后可能找不到适用门店；即使到店，店员也需要打开专门的软件完成核销，增加了收银时间。此后，品牌逐步扩大门店覆盖范围、重新培训员工，并将核销功能接入日常收银系统，整个流程才逐渐顺畅。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_3e5fa82a678c41d280dab076cda50cd7@5679941_oswg959527oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">361度门店抖音专区</p>\n  <p>思加图则通过限时核销、到店权益和后续提醒等一系列动作，将达人直播的核销率从约3%提升至20%以上。这表明，核销率的提升并非依靠单一优惠，而是券的设计、用户提醒与门店承接共同作用的结果。</p>\n  <p>再次，分散的门店网络要求品牌同时兼顾全国统一与地方差异。</p>\n  <p>罗征认为，全国传播需要保持品牌一致性，各地服务则可以拥有自己的表达。这意味着，总部需要守住商品品质与服务标准，同时为本地经营者留出内容表达和货品组织的空间。</p>\n  <p>抖音生活服务正在推进的品牌联营模式，也提供了一种分工思路：品牌统一组织商品与内容，渠道负责门店服务和履约。据平台披露，过去一年已有超过250个品牌参与，覆盖3万多家渠道门店，相关交易额月同比增长超过500%。</p>\n  <p>随着系统、门店与渠道逐步打通，线上内容不再只是总部层面的营销动作，而开始进入每家门店的日常经营。</p>\n  <p>与此同时，服饰到店生意也正在从单纯依靠低价促销，转向商品、内容、服务与权益的共同经营。</p>\n  <p>从单个品牌看，思加图坚持正价经营，保持线上线下同质、同价、同权益，消费者依然愿意买单；抖音生活服务数据显示，同时经营商品与券的商家仅占7%，却贡献了64%的交易额，其增量达到单一经营方式的3倍。</p>\n  <p>这意味着，券更适合扩大覆盖、提升动销，商品、内容和服务才是吸引新客、创造利润并建立品牌价值的核心。当品牌不再只关注售出多少张券，而是同时观察核销、连带购买、会员转化与复购，服饰到店生意也就从流量尝试进入了更成熟的经营阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_7921ac289acf4ab3919ed87374778645@5679941_oswg1751539oswg1080oswg751_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">卓诗尼团购官号抖音大场直播</p>\n  <h2><strong>结语</strong></h2>\n  <p>一家门店，不必等消费者走到面前，才开始证明自己值得一逛。</p>\n  <p>通过短视频、直播和达人内容，门店的商品、搭配与服务得以突破地理位置的限制，提前被更多消费者看见。品牌多年积累的货品、导购能力和门店网络，也由此有机会服务那些原本不会从店前经过的人。</p>\n  <p>抖音生活服务正在为服饰品牌建立一条连接线上兴趣与线下消费的新通路：内容让商品与服务被提前看见，券推动消费者采取行动，门店完成体验与成交，会员运营再将一次到店延伸为长期关系。</p>\n  <p>服饰品牌重新经营到店生意，本质上是在回应消费者购物路径的变化。对于行业而言，更长远的意义在于：门店不再只是被动承接客流，也开始拥有主动创造客流、持续经营顾客的能力。</p>", "category": "tech", "published_at": "2026-09-09T07:31:58+00:00", "fetched_at": "2026-09-10T02:48:51.571449+00:00", "fingerprint": "6da27342f8141a1b"}, {"source": "36氪 - 最新文章", "title": "一档卖文具的综艺，为什么让年轻人停不下来？", "url": "https://36kr.com/p/3975874591748357?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_a345b603144d4fbf947dbea874f07833@5043425_oswg158300oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_70fb48bbd6354990944f0261ead6c921@5043425_oswg631oswg900oswg46_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>谁的青春记忆里，没有晨光呢？</strong></p>\n  <p>撰文｜J</p>\n  <p>封面来源｜晨光</p>\n  <p>谁能想到，2026年的“电子榨菜”里，竟然藏着一档卖文具的综艺。&nbsp;</p>\n  <p>让明星开餐厅、开民宿、带娃旅行的综艺，大家都见过；但一群艺人开着文具车满街跑，一边研究怎么把笔卖出去，一边和路人唠嗑、写信、做游戏，甚至干脆把文具摊支进了校园……这种不按常理出牌的“独一份”，反而成了它在一众综艺里的记忆点。&nbsp;</p>\n  <p><strong>但偏偏，就是这档不拼大场面和强冲突的慢综艺，让不少年轻人看上了瘾。</strong>有人守着更新看艺人们手忙脚乱地营业，有人被各种突如其来的名场面笑到停不下来，还有人干脆把它列入了自己的固定“下饭节目”。&nbsp;</p>\n  <p>一档“卖文具”的综艺，到底有什么魔力，能让年轻人越看越上头？&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_fa4e111c4eb442f4a01fbb8034718765@5043425_oswg4801oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>一辆文具车，接住了年轻人的心事</strong></p>\n  <p>这档由晨光文具冠名、深圳卫视首创的国内首档文具经营实景综艺《宇宙帮帮忙》，确实把慢综艺玩出了新花样。&nbsp;</p>\n  <p><strong>一辆可移动、可改造的文具小车，6位艺人嘉宾丁真、井胧、李艺彤、孙熹之、余宇涵、张颜齐（按姓氏首字母排序）组成的“宇宙帮帮团”。</strong>他们真真切切地当起了“文具店主理人”，在汕头小公园的骑楼街区、深圳小梅沙的海滨社区，珠海希望之星实验学校的操场边，支起一个个流动的晨光文具摊，一边经营生意，一边在这个由文具车延伸出来的空间里，接住来往学生和路人的心事。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_5205a3c6ef944ae5af11c7e05062d055@5043425_oswg131648oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>节目一开播，各种名场面就接连不断地冲上了热搜。&nbsp;</p>\n  <p>汕头这一站，刚好踩在了两个点上。一个是近两年被英歌舞、侨批文化带火的文旅热；另一个，是晨光三十多年前创业出发的地方，带着溯源情怀，开学小美好从这里启程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_2207ca1f112a47ceb48a57a16a839eb9@5043425_oswg129295oswg1080oswg613_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1f9be1c54ba94843938f4c40b8edeb35@5043425_oswg95544oswg1080oswg609_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>深圳站，帮帮团开启沉浸式卖货模式，开业考试、突降暴雨、语言不通，面对重重挑战，金牌销售员们使尽浑身解数，嘉宾段奥娟也惊喜空降助阵。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_e83a0cc255054dd9b539d59df8e0761f@5043425_oswg115318oswg1080oswg616_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>珠海站更是把文具店和屋托帮搬进校园，用一场喊话仪式和超宇宙开学派对，把青春感拉满。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_86d739020a8341f8932b8517ab3e9ead@5043425_oswg79940oswg1080oswg584_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_d734c7c221dd476cb9a19871ea3e27fa@5043425_oswg100050oswg1080oswg616_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>这些片段之所以能迅速出圈，靠的是节目本身自带一种“不装”的真实感。</strong>六个年轻人在街头巷尾认真摆摊、卖文具、和路人唠嗑时，自然碰撞出的人间烟火气。&nbsp;</p>\n  <p>而真正让节目和年轻人产生深度连接的，是节目撑起了一个动人的“屋托帮”——一个愿意认真听年轻人说话的空间。面对即将开学的焦虑、升学做题的疲惫，或是对未来的迷茫，路过的同学们在这里坐下，向主理人们吐露心声、分享生活里的小确幸。这辆穿梭在城市巷陌的文具车，就这么自然而然地成了倾听年轻人心事的“青春树洞”。&nbsp;</p>\n  <p>从数据层面来看，《宇宙帮帮忙》交出的成绩单也相当亮眼。<strong>开播一个月，节目全网总曝光破12亿，总互动量破1000万，全网UGC 35万多条。微博主话题阅读量冲破4.5亿，暑期档大屏收视率多次达到Top3，多平台持续霸榜，热度一路飙升。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_cfd7c8eaed844e079ae86473cf7012be@5043425_oswg197568oswg1080oswg2040_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_56aec187c8d84089b9a59d154e907d66@5043425_oswg948687oswg1080oswg2039_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_829d1f5adde34840b50eed529496d7ed@5043425_oswg1294932oswg1080oswg2039_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>向左滑动查看更多</p>\n  <p>但数据只能证明它火，真正值得聊的，是它为什么能火进年轻人的心里。&nbsp;</p>\n  <p>这档综艺最特别的地方，在于它没有把品牌“贴”在节目表面，而是让品牌“长”进了节目肌理里。&nbsp;</p>\n  <p>明星不是来给文具念广告词的，他们是真的在经营一家文具店。从流动文具车的改造，到“故事换文具”的设定，再到史努比、米菲这些IP自然地出现在经营场景里，晨光的品牌基因被织进了综艺叙事里。这种“综艺×IP”的玩法，行业里还是第一次。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_082e7e0e40f948df89a2d1f123a6c3c6@5043425_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>而它和年轻人的关系，也不只是“看”和“被看”。<strong>这群会追爱豆、刷短视频、把综艺当“电子榨菜”的年轻人，和会冲进文具店买笔的人，本就是同一批人。</strong>明星在节目中拿起的一支笔、一本本册，第二天就能在校门口买到同款。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_d852a9047b77481fb3387ab0ea3a61d1@5043425_oswg195543oswg1080oswg995_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_5e72b0919cb9426f9e39b57dd735f71a@5043425_oswg159083oswg1078oswg1034_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>达人自发种草&nbsp;</p>\n  <p>品牌没有把年轻人拉进自己的场域，而是直接走进了他们本来就在的地方。&nbsp;</p>\n  <p>这档节目真正让人“看进去”的，是<strong>共鸣感</strong>——这决定了它扎进年轻人心里的深度。&nbsp;</p>\n  <p><strong>晨光在全国拥有近七万家门店，谁的童年记忆里，校门口没有一家晨光文具店呢？</strong>上学忘了带笔，去那里补一支；放学路过，都忍不住进去逛一圈，让人记住的，不只是那个摆满笔和本册的货架，还有店里那个老板——他记得你爱用哪款笔，会跟你说“新货到了”。所以当明星变成“文具主理人”，认真理货、卖货时，那种熟悉感很容易被瞬间激活。这种集体记忆的唤醒，也让话题的活跃度居高不下。&nbsp;</p>\n  <p>综艺独创的形式不断吸引人点进来，人群的高度契合把人留了下来，而最终被唤醒的那些藏在文具店里的共同记忆，才让人真正记住了它。这档综艺之所以让人上头，是因为年轻人发现，原来真的“有人愿意认真听你说话”。&nbsp;</p>\n  <p>作为陪伴大家长大的“文具一哥”，晨光的功力显然不止于做一档好看的综艺。在这辆移动文具车背后，更庞大的开学季布局才刚刚拉开序幕。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_ea3afe1ca9a44057a3dc5eae949e58ce@5043425_oswg5663oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>开学这件事，晨光比你还上心</strong></p>\n  <p>综艺里那些被“屋托帮”温柔接住的小情绪，恰恰照见了当代年轻人最真实的内心状态。&nbsp;</p>\n  <p>他们嘴上调侃着“不想开学”，身体却很诚实地提前收拾书包、精挑细选新文具，试图用仪式感为自己叠满开启新学期的buff。&nbsp;</p>\n  <p><strong>这正是晨光今年开学季营销的破题点——用一个个具体的“小美好”，接住开学季这些说不出口的小情绪，把产品铺进年轻人真实的生活褶皱里。</strong>学习的路上，不只有分数和作业，还有那些藏在细节里的、属于你自己的小确幸。&nbsp;</p>\n  <p>对于学生党来说，一支“好写”“好用”的笔比什么都重要，而晨光把“好用”这件事，做得比想象中更细。十项全能选手“修正行家”，防滑、耐摔、静音、省力，性能与科技感夯爆；数显圆规Pro，不用尺子就能精准画圆；隐形修正带，一拉，错字原地消失，作业本干干净净。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_639d0be4e313494a9dc0417e89f5ea24@5043425_oswg44110oswg534oswg747_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_9ab3a5ca91364a50b37f71c791919274@5043425_oswg44354oswg534oswg747_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_8ed63ff127f149bbb90a5160d07f660b@5043425_oswg99753oswg1030oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从左至右依次为“修正行家”、数显圆规Pro、隐形修正带</p>\n  <p>这些产品功能上的极致打磨，解决的恰恰是学生每天都会碰到的真实痛点。&nbsp;</p>\n  <p>晨光还让文具承担起了“情绪出口”的功能。今年爆火的“开芯乐家族”系列，把“解压”两个字刻进了DNA，几乎人手一支。万物皆可挂的开挂王“痛笔”；摇摇乐笔摇一摇就能出芯；动物剥剥乐笔不仅解压，还自带香气，捏一捏、搓一搓，就会飘出淡淡的香味，还有 一闪一闪灵光笔 、盘盘乐、捏捏乐、解压开关笔、魔法花。多巴胺配色加上趣味解压体验，让这些文具不再只是书写工具，还成为能“玩”的、能“晒”的、能“表达”的情感载体。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_ffcbfcc75c674e39bac4dc8f6c9537f4@5043425_oswg64583oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_8880edbb48b247e1b4e55515ba51db79@5043425_oswg82809oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_c069a73d112b41e7861d1253421bb1f7@5043425_oswg139183oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_5490bcbf508a406c82a7c442751e1ecf@5043425_oswg88202oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>向左滑动查看更多，从左至右依次为“痛笔”、一闪一闪灵光笔、开心摇摇乐、动物剥剥乐</p>\n  <p>在颜值和情感陪伴的基础上，晨光更是把IP联名玩出了新花样。史努比、米菲这些陪了几代人的老朋友不断推陈出新，像史努比系列里的“飞耳笔”，轻轻一按，小狗耳朵就会跟着晃动，扇一扇快乐小狗的耳朵，仿佛也能把开学焦虑扇走了。濒危动物猫猫系列新品，软萌的猫科动物形象搭配再生材料，让“买一支笔”变成“顺手做一件环保小事”，成为了年轻人表达态度的一种方式。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_67e2f376b77647a3a9a9a130d92bf098@5043425_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_2e2fbef6ceef45398ee6ce531061f4c1@5043425_oswg47531oswg800oswg609_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>史努比联名“飞耳笔”和濒危动物猫猫系列</p>\n  <p><strong>在产品力拉满的同时，晨光在今年开学还官宣了一件大事：与国风文化推广者刘宇达成全域深度品牌合作。</strong></p>\n  <p>刘宇作为00后国风文化推广者，坐拥全网2600万粉丝，还是备受年轻人认可的正能量学长。他把古典舞和戏曲融进流行音乐，用年轻人喜爱的方式讲传统文化。喜爱他的粉丝和晨光的消费者，本来也是同一批人。&nbsp;</p>\n  <p>晨光选择他，不是简单的流量思维，而是品牌内核的共振：一个扎根国货实业三十多年，用纸笔陪伴几代人长大；一个深耕国风舞台，用舞蹈和音乐把传统文化讲给年轻人听。&nbsp;</p>\n  <p>双方联手打造的国风联名文创矩阵，覆盖书写工具、手账本册、典藏礼盒等全品类，将山水、诗书、传统纹样融入日常文具设计。这场“国货之光”与“国风少年”的双向奔赴，也让传统文化以极具质感的方式走进了年轻人的日常。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_d8597caa53884f88a4dd207d48dd7d64@5043425_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>线下，这份默契同样有迹可循。刘宇演唱会谢幕时以传统叉手礼带领全场观众完成东方美学的集体仪式；晨光一闪一闪灵光笔作为伴手礼出现在现场，蓝色小月亮在黑暗中亮起时，来自晨光与刘宇的“小美好”也走进了观众心里。与此同时，23城1100+京东MALL大屏同步上线TVC，排面拉满。社交平台上，官宣消息下“双向奔赴”“国风yyds”的评论刷了屏，有粉丝说：“一个懂陪伴，一个懂传承，这才是国货该有的样子。”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1287f0e2c3b3430cbbdf35379908ffa9@5043425_oswg77288oswg519oswg938_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_d6b45c764aa045f49bf2122f6cce29d5@5043425_oswg32521oswg519oswg938_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>向左滑动查看更多，网友们的自发分享</p>\n  <p>从线上到线下，晨光在这个开学季拉开了一场极大规模的立体化营销大幕。&nbsp;</p>\n  <p>从《宇宙帮帮忙》综艺的热播破圈，到上海书展上年轻人人手一支“痛笔”、为了限定印章排起长队，再到线下史努比“开学缓冲站”里引发的达人打卡和潮玩巡游热潮，伴随着全国万店的联动，这场融合了黑科技、高颜值、IP潮玩与文化共鸣的最强开学季主题活动，不仅把“心价比”拉满，更一举打破了传统文具营销的边界，把开学这件事变成了一场全民狂欢的潮流盛宴。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_dd6f5c357c204d85a156062505fe638c@5043425_oswg231355oswg1080oswg1616_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_bd851abace6c46f78d369b297763bb52@5043425_oswg188947oswg1080oswg1616_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_7404534221fc4682b5509abc2bfc471e@5043425_oswg167373oswg1080oswg1616_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1943fc2299cd4dc3b34a8463afcd158b@5043425_oswg56564oswg435oswg651_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_ffcc50279b014887b936532a5b5feed8@5043425_oswg73339oswg435oswg652_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_54eb2c16deb74172b261741df8389c6e@5043425_oswg5645oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>晨光在进化：不止做好一支笔</strong></p>\n  <p>如果把晨光近年来的动作放在一起看，会发现一个很明显的变化——这个陪伴了几代人成长的文具品牌，正在重新回答一个问题：今天的年轻人，到底需要怎样的文具品牌？&nbsp;</p>\n  <p>答案或许没那么复杂：年轻人想要的，是一种“被在乎”的感觉。在书写之外，给日常多留一点情绪出口。&nbsp;</p>\n  <p><strong>晨光今年的品牌升级，本质上正是完成了从“功能满足”到“情绪陪伴”的价值跃迁——它想成为那个陪年轻人走过开学、考试、压力和迷茫的伙伴。</strong></p>\n  <p>最直观的变化，首先发生在产品上。&nbsp;</p>\n  <p>晨光今年的产品策略，从传统的“质价比”，进一步走向“心价比”。&nbsp;</p>\n  <p>前者依然是底盘。<strong>晨光围绕消费场景持续进行细节创新，研发投入每年超过1亿元、累计专利超1600项，也支撑着晨光不断把一支笔做得更顺手、更专业。</strong></p>\n  <p>从中国第一支按动式中性笔，畅销20余年的晨光K-35，到获得德国iF奖的磁悬浮中性笔，用同极磁铁相斥的设计，缓解书写压力。作为 文具界的“黑科技”代表，晨光知道学生长时间刷题，手指会累，于是在笔握处加上如云朵般舒适握感的云握手；还有增加了双倍速滑纸的meeboki本册，更适合中国汉字书写。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_51cf40d5449442b892d5a1b0e4dc004d@5043425_oswg228118oswg1080oswg1430_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_445873d7d26744b88559235973c6f773@5043425_oswg100775oswg537oswg709_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_f56ff35513a14d288e9dd5a677ceb8f3@5043425_oswg82026oswg1080oswg1429_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>依次为晨光K-35、meeboki本册、磁悬浮中性笔</p>\n  <p>但晨光显然不满足于“好用”“能写”。&nbsp;</p>\n  <p>于是我们看到了能晒、能玩、能DIY的开芯乐家族系列，也看到了自带转轴、转动即祈福的“解压霸福”系列，好用之余，给考生信心加持。文具开始拥有更多身份：它可以是解压玩具，是潮流配饰，是陪伴符号，甚至是年轻人表达环保态度的一个出口。&nbsp;</p>\n  <p>就连文具的审美，也在被重新定义。<strong>今年晨光把新品发布搬上了时尚秀场，并与国际高奢艺术家Florence Bamberger合作联名产品，让原本属于书包、笔袋和本册的产品，拥有了更鲜明的时尚表达。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_e459af85a14a4492bc5263a079c79234@5043425_oswg315933oswg554oswg370_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_90a48430d3504be38ce99d593d740c8a@5043425_oswg100553oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从“把一支笔做好”，到“在好用的基础上，再给它加上一点让人开心的理由”，这背后其实是一个很明显的产品逻辑转变：工具之外，年轻人更需要一个符合自己生活方式、能给自己带来情绪价值的好物。&nbsp;</p>\n  <p>在产品之上，更大的变化，发生在品牌与年轻人的沟通方式上。&nbsp;</p>\n  <p>晨光开始越来越多地把文具搬进年轻人愿意停留的场景。考试季，它持续围绕学生最在意的焦虑与期待，它把“孔庙祈福”从一场仪式，变成了一种长期沉淀在考生心里的情感陪伴，还联合京东骑手在考前送祝福。开学季，一档文具经营综艺被年轻人按头安利，新品登陆上海书展人气火爆，史努比主题门店又打出“松弛感”赢得年轻人心头好，再通过与刘宇的深度合作，把国风、青年文化和文具连接起来。<strong>这些出圈营销的背后，本质是晨光始终和年轻人玩在一起。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_a59dd938fae84289b7366124ea0d7d07@5043425_oswg1152121oswg1080oswg678_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_5e8bc2d786874c1c8de731cef803bd9b@5043425_oswg90881oswg967oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1bce39cb1abc49ab955799b7445133de@5043425_oswg122817oswg1080oswg679_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_43d59016578642f9a95f6b34a85773e9@5043425_oswg1113866oswg1040oswg653_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>向左滑动查看更多</p>\n  <p>在不同场域里持续和年轻人玩在一起，背后更是中国文具第一品牌的硬实力在支撑——在今年最新发布的2026年《中国500最具价值品牌》榜单里，晨光品牌价值跃升至309.68亿元，连续九年稳居行业第一。晨光在全国有近7万家零售终端，博鳌亚洲论坛、进博会、APEC也都有它的身影。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_44ae070a8b694cbdb5d355019597bc22@5043425_oswg137803oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从书桌一角的小小方寸，到融入当代年轻人生活的无处不在，晨光深耕行业三十余载的底层逻辑，是一场坚持“与年轻人同行”的长期主义。&nbsp;</p>\n  <p>它不仅仅是在生产一个个好用的书写工具，更是在用一次次跨界破圈与情绪共振，回应着一代又一代年轻人对生活的期许与热爱。时代在变，年轻人的表达方式在变，但那个始终愿意用温度与真诚接住所有情绪的国民品牌，依然在与青春同频奔跑。&nbsp;</p>\n  <p>当一个品牌愿意陪你走过所有重要时刻，它就成了一代人共同的记忆。而这，正是晨光用三十多年做的事。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_dc24f7a29ad142d5b9f373b7b16395da@5043425_oswg3027oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_85a194b7d34f44b698a1e51c34d14f9d@5043425_oswg12888oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>你关于晨光文具的回忆是？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_02b87e17c3734965b6d690568f3321dd@5043425_oswg4594oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_72498c1484e54ac18018a4b6d97f1546@5043425_oswg36767oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/8ihUk4KmZNo5NQE8Ia4_gg\" rel=\"noopener noreferrer\" target=\"_blank\">“后浪研究所”</a>，作者：J，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-09-09T07:50:42+00:00", "fetched_at": "2026-09-10T02:48:51.571442+00:00", "fingerprint": "ec2e65916cc60225"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨苹果发布首款折叠屏iPhone Duo：售价15999元起；支付宝账户被哈啰打车盗刷6551元，哈啰客服称最多赔200；DeepSeek备战科创板IPO", "url": "https://36kr.com/p/3976825296597507?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>阿里称无招回归阿里千问办公消息不实</p>\n  <p>沐曦股份：9月17日起1397万股限售股上市流通</p>\n  <p>娃哈哈集团成被执行人</p>\n  <p>理想汽车引入第三家电池供应商，中创新航上车理想i6</p>\n  <p>OpenAI称破解千禧年大奖难题&nbsp;</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>苹果发布首款折叠屏iPhone Duo：15999元起，最高售价26499元</strong></p>\n  <p>9月10日凌晨，苹果2026秋季发布会举行，这是苹果正式更换CEO之后的首场重大活动。苹果发布首款折叠屏iPhone Duo，展开状态下的iPhone Duo为史上最薄iPhone，将配备双摄像头。iPhone Duo展开后配备7.6英寸超视网膜XDR显示屏，比iPhone18 Pro Max大50%。iPhone Duo支持Apple Pencil，内外两块屏幕上均可使用Apple Pencil。支持双屏多任务处理，有星白和夜空两种配色。</p>\n  <p>苹果中国官网显示，iPhone Duo起售价为15999元，提供四个存储版本：256GB售价15999元、512GB售价17999元、1TB售价21499元、2TB售价26499元。新品将于10月16日开启预订，10月23日正式发售。（红星新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_e53036bbdc77468087a8d1c6439ae2d3@5667365_oswg40250oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">苹果发布首款折叠屏iPhone Duo</p>\n  <p><strong>支付宝账户被哈啰打车盗刷6551元，哈啰客服回应最多补偿200</strong></p>\n  <p>9月9日消息，“女子支付宝账户被哈啰盗刷6551元”的话题引发外界关注。据钱江视频报道，广州的齐女士反映，其支付宝账户自7月25日起被哈啰打车持续盗刷，共计109笔订单，累计损失6551.34元。</p>\n  <p>调查发现，盗刷根源在于“旧手机号二次放号”与“免密支付漏洞”叠加：齐女士两年前注销的一个旧手机号被运营商重新投放，新号主用该号码登录了仍绑定该手机号的哈啰旧账号，并通过已签约的支付宝免密支付功能直接扣款。更关键的是，哈啰账号的实名信息与支付宝的实名信息并不一致，但平台在交易时并未进行二次校验。</p>\n  <p>齐女士要求全额退赔，哈啰客服仅愿补偿200元，表示金额过大无法全额赔付，需等实际乘车人还款后才能处理。支付宝方面则表示，一旦签约免密支付，除非手动关闭，授权将持续有效，且平台与签约方之间并无定期比对实名信息的机制。（钱江新闻、界面新闻）</p>\n  <p><strong>知情人士证实：DeepSeek备战科创板IPO，中信已入场尽调&nbsp;</strong></p>\n  <p>有市场消息称，DeepSeek已委托中信证券筹备科创板IPO。记者从知情人士处获悉，该消息属实。目前，中信证券已与DeepSeek方面接洽并进入尽职调查阶段，但双方尚未签订正式的上市辅导协议。记者梳理发现，中信证券在AI与智能硬科技IPO中已形成A股算力芯片、机器人，以及港股18C自动驾驶、具身智能等多条项目管线。（财联社）</p>\n  <h2>苹果发布会</h2>\n  <p><strong>苹果发布iPhone 18 Pro系列，外观与iPhone 17 Pro接近</strong></p>\n  <p>9月10日凌晨，苹果正式发布iPhone 18 Pro，搭载A20 Pro芯片，主打AI、续航与专业影像能力。该机提供深黑、银色、冰川色和酒红色4种配色，外观与iPhone 17 Pro接近。苹果称，iPhone 18 Pro在智能能力、性能、电池和摄像头方面迎来升级，并将其定位为围绕用户个人需求提供帮助的AI手机。特努斯表示，iPhone将把AI能力与设备内的个人情境结合，支持用户随身调用相关功能。</p>\n  <p>据苹果介绍，新机配备48Mp可变光圈主摄，采用六片叶片设计，支持调整四档光圈，光圈会根据场景智能调节，夜间模式出片更快。同时，新机还引入了Pro级控制选项，提供了直方图，支持自动调整白平衡。还引入了智能追踪对焦功能，利用设备端AI模型进行高精度对焦。</p>\n  <p>此外，苹果为搭载A20 Pro的iPhone 18 Pro系列引入新一代均热板散热设计。苹果称，该方案采用源自M系列芯片的定制封装，并结合80%回收不锈钢和石墨，以及业内首次使用的纳米孪晶铜材料，以提升持续性能表现。（IT之家）</p>\n  <p><strong>苹果发布A20Pro芯片</strong></p>\n  <p>36氪获悉，苹果公司发布基于2纳米制程技术的A20 Pro芯片，标配6核CPU（性能核心提升20%）和7核GPU（图形处理性能提升40%）。同时配备两个神经引擎，总计32个核心，可提升端侧人工智能性能。</p>\n  <p><strong>苹果AirPods5发布：全新自适应均衡功能、支持主动降噪</strong></p>\n  <p>36氪获悉，2026苹果秋季新品发布会中，苹果正式发布AirPods 5耳机，定价129美元。随附无线充电盒的版本定价为149美元。系列耳机提供IP57认证，采用无耳塞设计，支持主动降噪，官方称AirPods 5的降噪效果相比AirPods 4（支持主动降噪）提升最高达50%。同时耳机支持自适应音频功能，能够在主动降噪和通透模式之间切换。</p>\n  <p>对于有更高需求的用户，配备无线充电盒的AirPods 5进一步大幅提升了AirPods体验。AirPods 5首次为无耳塞式耳机配备了支持音量轻扫功能的力度感应器，用户可上下轻扫耳机柄来快速调节音量。</p>\n  <p><strong>苹果Apple Watch Series 12和Ultra 4发布</strong></p>\n  <p>36氪获悉，9月10日凌晨，苹果发布会上，苹果正式发布Apple Watch Series 12和Apple Watch Ultra 4智能手表。两款手表搭载苹果最先进的健康传感器和全新Apple芯片。心率App和表盘复杂功能迎来重点升级，能让用户更全面地了解自己的健康状况。</p>\n  <p>Apple Watch Ultra 4可选黑色、原色钛金属表壳，表带迎来新配色。Apple Watch Series 12带来全新深古铜色外壳，以及两款钛金属抛光外壳，以及两款陶瓷外壳。Apple Watch Series 12起价399美元保持不变，Apple Watch Ultra 4起价799美元，两款手表9月18���正式发售。</p>\n  <p><strong>iPhone17涨价800元，现起售价6799元</strong></p>\n  <p>在发布iPhone 18 Pro系列和iPhone Duo后，苹果官网显示iPhone17手机起售价上调至6799元起。 苹果Phone17的发售价为5999元起，存储256GB起步，如今起价上调了800元。256GB：原价5999元，现价6799元；512GB：原价7999元，现价8799元。</p>\n  <p>苹果中国官网还上调了iPhone Air国行版3个存储版本售价，涨幅从800元到2300元不等。其中，256GB与512GB均上涨800元，1TB版本则上涨2300元，涨幅接近两成，成为此次调价中价格变化最明显的版本。（新浪科技）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>GPT-6 Astra正式登陆亚马逊云科技Amazon Bedrock</strong></p>\n  <p>OpenAI最新旗舰模型GPT-6 Astra现已在Amazon Bedrock正式可用——这意味着全球企业可以在亚马逊云科技的管控体系下，直接调用该模型。据了解，Astra覆盖财务分析、合同审查、代码治理及浏览器操作等场景。在安全层面，Amazon Bedrock为每次模型调用提供芯片级零运维人员访问、全流程加密、PrivateLink网络隔离CloudTrail合规审计，推理数据不用于模型训练，无需与OpenAI共享数据。</p>\n  <p><strong>智元发布原生世界—动作模型GE-Act 2.0</strong></p>\n  <p>36氪获悉，智元发布GE-Act 2.0原生世界—动作模型（World Action Model，WAM），首次验证原生世界—动作模型预训练与Scaling路径。</p>\n  <p><strong>OpenAI推出图像生成模型ChatGPT Images 2.5</strong></p>\n  <p>OpenAI推出图像生成模型ChatGPT Images 2.5，现已面向所有ChatGPT、ChatGPT Work和Codex用户开放，支持桌面端、移动端和网页端。此外，GPT-Image-2.5 Sunburst和GPT-Image-2.5 Flare模型已通过API提供。（界面新闻）</p>\n  <p><strong>OpenAI称破解千禧年大奖难题</strong></p>\n  <p>当地时间9月8日，美国开放人工智能研究中心（OpenAI）宣布解决纳维-斯托克斯存在性与光滑性问题，这是千禧年大奖难题之一。光滑的三维流体运动是否会“破裂”，这个问题已悬而未决约90年。OpenAI表示，这一证明由其内部模型产生，模型能力显著强于GPT‑6 Astra，并生成解析证明和Lean形式化验证，表明描述流体运动的纳维-斯托克斯方程动力学演化可���有限时间内形成奇点。该解是一个涡旋，即旋转的流体漩涡，它向内盘旋并逐渐被拉长，像意大利面一样。OpenAI称，不打算为这一结果申领千禧年大奖。（界面新闻）</p>\n  <p><strong>DeepSeek计划9月10日前后正式发布V4.1 Flash模型</strong></p>\n  <p>36氪获悉，据DeepSeek消息，DeepSeek计划于北京时间2026年9月10日前后正式发布V4.1 Flash模型。经内部、外部多方测试，V4.1 Flash在性能、费用、速度、总用时等各项指标上已全面超越V4 Pro。在V4.1 Flash正式上线之后、V4.1 Pro上线之前，DeepSeek会将对V4 Pro的请求全部路由到V4.1 Flash，并按V4.1 Flash单价计费。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>阿里称无招回归阿里千问办公消息不实</strong></p>\n  <p>36氪获悉，有媒体报道称，钉钉创始人无招（陈航）已重新回归阿里，组织关系纳入千问办公事业部，职级、待遇不变。对此，36氪向阿里巴巴集团求证，阿里方面独家回应称，该消息不实，无招并未回归千问办公事业部。今年6月，阿里宣布钉钉管理层调整，陈航卸任钉钉CEO，由陈宇森接任。目前钉钉与千问办公同属千问办公事业部。</p>\n  <p><strong>燧原科技明日科创板上市</strong></p>\n  <p>燧原科技公告，经上海证券交易所审核同意，公司发行的人民币普通股股票将于2026年9月11日在上海证券交易所科创板上市。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，9月9日收盘，美股三大指数集体下跌，道指跌0.77%，纳指跌0.64%，标普500指数跌0.48%。大型科技股多数下跌，谷歌跌超2%，亚马逊跌超1%，奈飞、英伟达、微软、苹果、特斯拉小幅下跌；Meta涨超6%，英特尔、闪迪涨超1%。热门中概股普跌，爱奇艺跌超5%，理想汽车跌超4%，小鹏集团跌超3%，网易、阿里巴巴、京东、蔚来跌超2%，拼多多、名创优品跌超1%。</p>\n  <p><strong>腾讯混元团队更迭：前OpenAI研究员田永龙成为混元多模态负责人，向姚顺雨汇报</strong></p>\n  <p>OpenAI前研究员田永龙已进入腾讯CEO/总裁办公室，其职务为“混元多模态负责人”，直接向腾讯大模型负责人姚顺雨汇报。（澎湃新闻）</p>\n  <p><strong>DeepSeek官宣调整flash系列模型定价</strong></p>\n  <p>36氪获悉，DeepSeek开放平台公告，将于北京时间2026年9月10日12:00起，调整flash系列定价：空闲时段输入缓存命中单价0.02元、输入缓存未命中单价1元，输出单价4元；高峰时段价格为空闲时段价格的2倍。高峰时段是指北京时间周一至周五9:00-12:00、14:00-18:00（其余为空闲时段）。</p>\n  <p><strong>沐曦股份：9月17日起1397万股限售股上市流通</strong></p>\n  <p>36氪获悉，沐曦股份公告，本次上市流通的限售股为公司首次公开发行网下配售部分限售股，股份数量为1397万股，占公司股本总数的3.4906%。前述股份限售期为自公司首次公开发行股票并上市之日起9个月，该部分限售股锁定期即将届满，将于2026年9月17日起上市流通。</p>\n  <p><strong>铜价再创新高</strong></p>\n  <p>由于市场看好电网建设、人工智能以及数据中心建设对金属铜的需求前景，今年以来，LME（伦敦金属交易所）铜价格持续走高。9月8日，LME铜价盘中触及14624美元/吨，再创历史新高。东方证券研报认为，铜板块有望迎来盈利上修和估值修复的双重共振。A股市场上，共有25家上市公司涉及铜产业链，主业与铜矿、铜合金、铜加工等相关。2026年上半年，共有19只铜产业股净利润同比增长超过15%（含扭亏为盈）。证券时报·数据宝统计，上述19只业绩高增长的铜产业股票中，13只股票滚动市盈率（PE）低于30倍。上述13只低市盈率的铜产业股票中，今年以来有5只股票获得5次以上机构调研，分别为西部矿业、云南铜业、金田股份、藏格矿业、金诚信。（人民财讯）</p>\n  <p><strong>消协通报猛犸象防晒服性能不达标，官方回应</strong></p>\n  <p>针对中国消费者协会8月28日通报其一款女士防晒夹克防紫外线性能未达标一事，猛犸象品牌方回应界面新闻称，“公司高度重视，已启动进一步的深度调查和处理”。据中消协报告，前述女士防晒夹克样衣洗前及多次洗涤后，长波紫外线透射率均高于5%的国标限值，不符合防紫外线产品要求。同时，该品牌还存在产品标识不规范的问题，耐久性标签中维护方法图形符号存在新旧标准混用的情况。（界面新闻）</p>\n  <p><strong>人民币跨境支付系统与11家外资银行签约</strong></p>\n  <p>9月8日，人民币跨境支付系统与11家外资银行直接参与者签约，首次覆盖卢旺达、土耳其、乌兹别克斯坦等国家，人民币跨境支付系统全球服务能力进一步提升。此次签约后，人民币跨境支付系统进一步扩容，截至目前，人民币跨境支付系统参与者分布全球133个国家和地区，业务覆盖192个国家和地区。（央视新闻）</p>\n  <p><strong>理想汽车引入第三家电池供应商，中创新航上车理想i6</strong></p>\n  <p>36氪获悉，理想汽车，将引入第三家动力电池供应商——中创新航。按理想汽车的初步构想，中创新航将率先上车理想的纯电车。另有知情人士表示，理想i6或将是首款搭载中创新航产品的车型。2026款理想i6也出现在最新的工信部公告中，两种电池总成的生产企业都是山东理想汽车电池有限公司，电芯制造商分别是欣旺达和中创新航。而2025款理想i6的电池供应商是宁德时代和欣旺达。</p>\n  <p><strong>娃哈哈集团成被执行人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，杭州娃哈哈集团有限公司新增一则被执行人信息，执行标的1.8万余元，执行法院为杭州市上城区人民法院。该公司成立于1993年2月，法定代表人为许思敏，注册资本5.3亿人民币，经营范围包括娃哈哈系列产品的生产、销售等，由杭州上城区文商旅投资控股集团有限公司、宗馥莉、杭州娃哈哈集团有限公司基层工会联合委员会（职工持股会）共同持股。</p>\n  <p><strong>海底捞跌超8%，创四年半来盘中新低</strong></p>\n  <p>36氪获悉，港股餐饮消费股持续走低，海底捞跌超8%创自2022年3月中以来的盘中新低，截至收盘，海底捞报10.34港元，跌幅9.14%，日内区间10.00港元‑10.88 港元，成交额37.81亿港元，总市值576.35亿港元。遇见小面跌超5%，九毛九、绿茶集团、海伦司、古茗跌超4%。</p>\n  <p><strong>理光映像：将停止现售K系列数码单反相机生产</strong></p>\n  <p>36氪获悉，理光映像宣布，将停止现售K系列数码单反相机的生产。“公司正重新审视‘摄影本身的价值’，并推进产品开发，希望让更多人能够享受‘拍摄’这一行为本身的乐趣。”该公司表示，PENTAX数码单反相机将迈向新阶段，关于新产品的开发进展，将在信息完备后，择合适时机陆续公布。</p>\n  <p><strong>小米汽车：澎程N90 Max探索版属小型专用客车，私家车用户新车上牌前需上线检测</strong></p>\n  <p>36氪获悉，9月8日，针对工信部公告中显示小米澎程N90 Max探索版属于“插电式增程混合动力文化生活服务车”，小米汽车发文称，这是依据国标要求在工信部公告中的标准名称，车辆类型属于小型专用客车。对于私家车用户而言，实际使用中的差异只有新车注册登记前需到机动车安全技术检验机构进行上线检测，检测内容涵盖外观、灯光、尾气、刹车、座椅结构、轮胎尺寸、车辆长宽参数、称重及环保等项目。上牌所需时间视现场情况而定，费用较小型普通客车增加了上线检测费。至于其他方面与日常使用相关的政策要求，也均与小型普通客车一致。</p>\n  <p><strong>三星入股帕西尼？CEO许晋诚回应万亿巨头股东传闻</strong></p>\n  <p>9月7日，在帕西尼媒体开放日上，CEO许晋诚回应称，今年8月公司确实新增一家全球消费电子半导体万亿巨头股东，但未透露具体名单，仅表示国际上此类公司并不多。谈及与手机产业链的合作空间，许晋诚透露，帕西尼已与富士康开展产线数据采集相关合作，手机产线需求体量更大。他指出，手机制造自动化率已偏高，但末端检验、封装包装等环节仍偏人工，随着人形机器人与智能技术的完善，手机及消费电子产线90%以上环节均可实现自动化。（21财经）</p>\n  <p><strong>京东云与摩尔线程达成深度合作，拟建十万卡国产智算集群</strong></p>\n  <p>36氪获悉，2026京东全球科技探索者大会上，京东云宣布拟建设十万卡全功能GPU集群，打造超大规模国产智算基础设施。该集群以摩尔线程全功能GPU为算力底座，聚焦大模型训练、推理及具身智能等关键领域，向全行业开放算力，这标志着国产GPU首次进入AI云企业十万卡级核心智算集群。</p>\n  <p><strong>8月汽车销量前十又无燃油车</strong></p>\n  <p>今年8月，全国乘用车零售销量排行榜前十车型全部为新能源车，传统燃油车再次无一上榜。据懂车帝统计，8月，吉利星愿以39651辆的零售销量居首，零跑A10（30652辆）、特斯拉Model Y（29260辆）、比亚迪元UP（22958辆）、特斯拉Model 3（20787辆）分列二三四五位。长安启源Q05（17349辆）位居第六位，理想i6（16979辆）、比亚迪海豚（16829辆）、小米SU7（16518辆）、五菱缤果Pro（14695辆）分列其后。（界面新闻）</p>\n  <p><strong>伊拉克在OPEC+核查期间寻求大幅上调石油产量配额</strong></p>\n  <p>据知情人士透露，在石油输出国组织及其盟友评估各成员国产能、确定各国明年石油开采上限之际，伊拉克正寻求大幅提高本国石油产量配额。消息人士称，作为该组织第二大产油国，伊拉克希望未来产量目标以每日600万桶作为基准，较当前基准水平大幅提升。相关流程尚处于保密阶段，伊拉克石油部暂未回应置评请求。（新浪财经）</p>\n  <p><strong>OpenAI切断Adobe等企业在ChatGPT投放部分竞品AI产品广告</strong></p>\n  <p>OpenAI通知部分商业合作伙伴，不再允许在ChatGPT内投放图像、音频生成类产品广告，这类产品与OpenAI自身功能构成直接竞争。这项新规此前并未对外披露，也尚未更新至OpenAI官方广告政策页面，令包括Adobe在内的现有广告主猝不及防，Adobe就销售上述生成式AI产品。倘若该禁令进一步扩大到其他竞品品类，这项新政策或将压缩OpenAI潜在广告收入。OpenAI此前向投资者给出十分激进的广告业务增长预期，广告被视作挖掘海量非付费用户商业价值的核心手段。（第一财经）</p>\n  <p><strong>SK海力士工会员工将于下周就临时薪资协议重新投票</strong></p>\n  <p>据业内消息人士9月9日透露，SK海力士的工会工人将于下周就三周前遭到否决的一项临时薪资协议进行重新投票。消息称，本次投票从下周二开始，为期两天。SK海力士工会定于10日召开代表大会，预计届时会披露新版临时协议相较旧版本有哪些调整。（新浪财经）</p>\n  <p><strong>OpenAI称正与三星合作开发下一代芯片，并深化合作</strong></p>\n  <p>OpenAI韩国区总经理Harrison Kim9月9日在新闻发布会上表示：“在与三星电子的合作中，我们进展最显著且获得认可最多的领域之一，就是针对我们正在研发的下一代芯片所开展的联合生产与研究。”Kim还表示，三星电子是“全球范围内应用ChatGPT规模最大的企业之一”，并指出该公司在韩国及海外的员工都在研发、市场营销和销售等工作中使用了ChatGPT。Kim表示，随着实现更快速、更复杂计算所需的芯片技术不断升级，存储芯片的需求也将持续增长，这使得与韩国半导体供应商的合作成为OpenAI当地办事处的优先事项。（财联社）</p>\n  <p><strong>OpenAI：客户对Astra的需求史无前例</strong></p>\n  <p>OpenAI产品负责人Tibo表示：“客户对新一代旗舰模型GPT-6 Astra的需求真的是史无前例的。我们正在动用一切可能的杠杆来维持这种需求，但到目前为止，我还从未见过这样的情况，而我们此前已经经历过非常迅猛的增长。优先事项始终是为现有用户保持优质服务，但如果这种情况持续下去，我们可能不得不暂时暂停新的Pro订阅。”（财联社）</p>\n  <p><strong>美联储9月加息概率为60.2%</strong></p>\n  <p>据CME“美联储观察”：美联储到9月维持利率不变的概率为39.8%，累计加息25个基点的概率为60.2%。美联储到10月维持利率不变的概率为28.3%，累计加息25个基点的概率为54.3%，累计加息50个基点的概率为17.3%。（财联社）</p>\n  <p><strong>Anthropic研究员因担忧AI“失控”离职</strong></p>\n  <p>一名 Anthropic 公司研究员出于担忧，选择离开人工智能行业。他认为该实验室及其竞争对手正竞相研发人类无法掌控的AI系统，这也表明头部AI企业内部的安全顾虑正不断加剧。专门通过海量数据训练新型AI模型的研究员雅各布・考克森于9月8日表示，他将离开这家公司，原因是不想参与全行业争相研发可自我迭代AI系统的竞赛。他担心这类系统可能彻底失控并毁灭人类。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>汉得信息：终止发行H股股票并在香港联交所上市</strong></p>\n  <p>36氪获悉，汉得信息公告，基于宏观经济环境、资本市场环境与公司自身发展规划的综合考量，公司决定终止发行H股股票并在香港联交所上市。目前公司经营状况正常，此次终止H股发行上市事项，不会对公司经营活动和持续发展造成重大影响。</p>\n  <h2>大公司财报</h2>\n  <p><strong>台达电8月营收同比增长34.95%</strong></p>\n  <p>9月9日，台达电公告称，公司8月营收为645.86亿新台币，同比增长34.95%；今年前8个月累计营收达4742.68亿新台币，同比增长41.06%。（界面新闻）</p>\n  <p><strong>华硕8月营收同比增长51.17%</strong></p>\n  <p>华硕9月9日公告称，公司8月营收为949.56亿新台币，同比增长51.17%；今年前8个月累计营收达6451.89亿新台币，同比增长42.30%。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“无问智科”完成数亿元A轮融资</strong></p>\n  <p>36氪获悉，近日，“无问智科”宣布完成数亿元A轮融资。本轮融资由洪泰基金领投，洪山资本、中电数融、狮城资本跟投，架桥资本、力合金融、力合中科、澄凯灵澄未来基金等老股东超额追投。本轮融资完成后，无问智科将继续围绕Physical AI基础设施加大研发和规模化投入。</p>\n  <p><strong>“风峦科技”完成数千万元天使+轮融资</strong></p>\n  <p>36氪获悉，“风峦科技”近期已完成数千万元天使+轮融资，由鸿瑞达投资领投，苏州怡达基金及Hexa Capital跟投。资金将主要用于首代教育机器人的样机研发、技术团队扩建及销售体系建设。</p>\n  <p>&nbsp;</p>\n  <p><strong>“被裁掉”的方桃子，勇闯时尚圈</strong></p>\n  <p>对话爆款AIGC作品《被裁掉的女孩》编剧、导演菲菲飞，揭秘在AI世界“被裁掉”的女孩方桃子，如何闯入现实中的时尚圈，并且首次在36氪《AI局内人》栏目公开背后的内容创作“焚决”！</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-09-09T23:58:59+00:00", "fetched_at": "2026-09-10T02:48:51.571434+00:00", "fingerprint": "98b92f52591e6f39"}, {"source": "36氪 - 最新文章", "title": "一年卖出数十万台E-bike后，这家公司要做AI移动出行｜36氪首发", "url": "https://36kr.com/p/3976975660511751?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能轻出行企业大鱼智行近期完成近亿元Pre-B轮融资，本轮由同鑫资本领投，多家机构跟投。融资资金将主要用于新品研发、智能化技术升级、全球品牌建设及供应链能力提升。</p>\n  <p>成立十年来，大鱼智行的主要产品为E-bike。过去两年，大鱼智行开始朝智能轻出行、户外智能移动及AI Mobility的全球智能移动平台发展。</p>\n  <p>疫情期间，欧洲E-bike经历了一轮需求快速增长，也带来了库存累积。欧洲自行车工业联合会CONEBI数据显示，2023年欧盟27国及英国共销售约510万辆E-bike，低于2022年的550万辆；行业随后进入库存消化周期。到2024年，欧洲市场需求已经逐步回到疫情前的正常水平，但制造商仍在主动压缩产量，以消化此前库存。</p>\n  <p>E-bike市场在过去两年都在降库存，并有不少玩家出清。</p>\n  <p>不过，大鱼智行创始人兼CEO李威告诉硬氪：“目前欧洲2000—5000欧元的中高端车型销售压力较大，不少本土品牌持续降价；大鱼主打的则是500—2000欧元大众市场，其中小轮径车型约500—1000欧元，大车型约1000—2000欧元。这也是中国品牌供应链和成本优势最集中的价格带。”</p>\n  <p>大鱼过去的主力产品是中小轮径折叠E-bike。在原有细分市场地位巩固后，大鱼智行的产品从通勤类E-bike向娱乐类的Dirt Bike（轻越野电摩）、胖胎车等品类延伸。从2023、2024年开始，公司明显加快SKU扩张。</p>\n  <p>在李威看来，E-bike不像手机一样高度标准化，不同身高、国家和使用场景，都需要不同车型覆盖。</p>\n  <p>区域需求也存在明显差异。欧洲法规更严格，通勤仍是主要场景；美国道路和户外环境更宽松，玩乐需求更强。大鱼因此单独用另一个品牌布局美国户外玩乐车型，公司称，该业务目前贡献约20%的营收，过去两年所在细分市场增速超过25%。</p>\n  <p>现阶段，大鱼智行则准备从传统E-bike品类升级到智能轻出行。</p>\n  <p>今年，公司推出一款电动Wagon，其在欧美主要用于露营、沙滩、庭院等场景，传统产品依靠人力拖拽。大鱼在手推车基础上加入电驱和骑乘功能，目前售价约1200美元。</p>\n  <p>相比重新进入一个完全陌生的硬件行业，电动Wagon可以直接复用大鱼在E-bike上积累的电机、电池、驱动控制、整车量产和渠道能力。对Costco、户外商超等现有渠道而言，Wagon与E-bike面向的也都是家庭户外和休闲消费人群。</p>\n  <p>下一代Wagon还会继续增加智能化能力。</p>\n  <p>目前大鱼智行在售第一代产品还不具备智能跟随能力。公司计划在后续产品中加入目标识别、自动跟随和避障：例如用户在沙滩步行时，Wagon可以自行跟随并搬运行李，需要时又能直接骑乘。未来，大鱼智行希望将Wagon进一步发展成通用移动底盘产品。</p>\n  <p>除产品扩张外，大鱼另一项长期积累是海外KA渠道。</p>\n  <p>2018年，大鱼进入美国Costco，彼时一款售价600多美元的小轮径折叠E-bike与Costco大众消费客群较为匹配。2020年，仅Costco单一渠道年销量便超过10万台。此后，公司又陆续进入Best Buy及欧美多个大型零售体系。</p>\n  <p>目前，公司称KA商超贡献超过一半销售额，美国和欧洲另有超过1000家合作线下网点。美国头部KA布局较早，目前继续向户外、庭院等垂类零售商扩张；欧洲则从2023年开始加快KA布局。</p>\n  <p>李威告诉硬氪：“大型商超并不是简单多一个销售渠道，产品设计满足商超渠道要求也是重点。”</p>\n  <p>E-bike在线上购买后，部分大轮径车型仍需要用户或自行车店完成组装；进入大型商超，则需要产品能够尽可能做到简易安装、开箱即用。不同渠道对包装尺寸、产品结构、认证和售后也有不同要求，因此需要从产品定义阶段就进行适配。与此同时，从认证、系统对接到履约和持续供货，新供应商进入大型零售体系往往需要较长时间。</p>\n  <p>“我根据市场需求和渠道来反向定义产品，缺什么能力，再找供应商补。”李威认为，比起所有底层技术都自己研发，大鱼更重要的能力是将技术做成成熟消费产品，并最终完成规模化交付。</p>\n  <p>Wagon产品是其明显的扩展尝试。大鱼智行下一步要验证的，是“把工具电动化，再智能化”能不能真正成为E-bike之外的新增长曲线。</p>\n  <h3><strong>CEO对谈</strong></h3>\n  <p><strong>硬氪：现在做智能移动、自动跟随产品的公司越来越多面对这些友商，大鱼靠什么竞争？</strong></p>\n  <p><strong>E-bike李威：</strong>我觉得今天做消费硬件，没有必要什么技术都自己重新发明一遍。比如激光雷达、跟随芯片，国内已经有很成熟的供应链；一些电机驱动算法我们会自己做，但没必要连芯片、激光雷达都自己做。</p>\n  <p>E-bike我们更重要的是产品定义和落地能力。E-bike我知道市场需要什么、渠道需要什么，再反向定义产品；缺哪一块能力，就去供应链里联合开发找到最合适的方案。最后还要把它做成一个成熟的消费产品，控制成本，完成认证、量产和交付，再真正放到全球主流零售货架上。</p>\n  <p><strong>硬氪：过去十年大鱼主要做E-bike，再往后十年，你希望它变成一家什么公司？</strong></p>\n  <p><strong>E-bike李威：</strong>E-bike过去我们确实比较专注，2016年以后基本就是做E-bike，连滑板车都没有做。现在我们希望往更大的智能移动出行平台走，但边界还是很清楚，就是围绕轮子、出行、载人和载物。</p>\n  <p>E-bike还是我们的基本盘，但以后不会只有E-bike。像现在的Wagon，本质上就是把以前靠人拉的东西先电动化，再智能化。后面还有Dirt Bike、高尔夫球包车这一类产品，都是沿着这个方向走。</p>\n  <p>再长期一点，我们希望把这些能力沉淀成一个通用的AI移动底盘。装上货框可以拉东西，装上座椅可以骑，未来再加入识别、跟随、路况判断，让它能主动辅助人完成移动。</p>\n  <p>AI现在在产品端还处于研发阶段，但我觉得未来十年AI一定会越来越进入物理世界。对我们来说，下一步就是从电动化继续往智能化走。</p>", "category": "tech", "published_at": "2026-09-10T02:29:19+00:00", "fetched_at": "2026-09-10T02:48:51.571419+00:00", "fingerprint": "71d1c25e26ac9231"}, {"source": "少数派", "title": "华人世界被忽视的游戏主机：扩写中国家用游戏主机的时间线", "url": "https://sspai.com/post/113842", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/113842\" target=\"_blank\">查看全文</a>", "catego tery, removable seat post, and software-controlled pedal-by-wire system, the TM-B set itself apart with a totally unique approach to electric [&#8230;]", "category": "tech", "published_at": "2026-09-08T20:46:56+00:00", "fetched_at": "2026-09-09T02:47:25.419903+00:00", "fingerprint": "7107fe893f7b47de"}, {"source": "The Verge", "title": "Drama swirls around OpenAI’s legendary mathematical milestone", "url": "https://www.theverge.com/ai-artificial-intelligence/991710/openai-navier-stokes-solution", "summary": "OpenAI says it found a solution to a major math problem that has remained unsolved for around 90 years, as reported earlier by The New York Times and Wired. In a blog post on Tuesday, OpenAI announced that it discovered a solution to the Navier-Stokes problem - which relates to the flow of liquid and [&#8230;]", "category": "tech", "published_at": "2026-09-08T20:53:52+00:00", "fetched_at": "2026-09-09T02:47:25.419892+00:00", "fingerprint": "93ac80c32b7b178a"}, {"source": "The Verge", "title": "Sony isn’t phasing out discs quite as quickly as we thought", "url": "https://www.theverge.com/games/991806/sony-disc-plant-90-percent-10-percent", "summary": "Sony isn't backing away from its decision to kill the video game disc in January 2028. But Sony isn't shutting down production as quickly as we thought, either. Two months after reports that Sony's last discmaking plant was already being repurposed, the company's discmaking division now says that one widely reported detail was wrong. Originally, [&#8230;]", "category": "tech", "published_at": "2026-09-08T21:52:13+00:00", "fetched_at": "2026-09-09T02:47:25.419877+00:00", "fingerprint": "899b6bb340e12a2d"}, {"source": "36氪 - 最新文章", "title": "理想汽车引入第三家电池供应商，中创新航上车理想i6｜36氪独家", "url": "https://36kr.com/p/3974819731026177?f=rss", "summary": "<p>36氪从多位产业人士处了解到，头部新势力品牌理想汽车，将引入第三家动力电池供应商——中创新航。按理想汽车的初步构想，中创新航将率先上车理想的纯电车。</p>\n  <p>另有知情人士表示，理想i6或将是首款搭载中创新航产品的车型。</p>\n  <p>2026款理想i6也出现在最新的工信部公告中，两种电池总成的生产企业都是山东理想汽车电池有限公司，电芯制造商分别是欣旺达和中创新航。而2025款理想i6的电池供应商是宁德时代��欣旺达。</p>\n  <p>理想i6是理想的主销车型，今年上半年交付超过12万辆，为理想贡献了超50%销量。</p>\n  <p>中创新航是国内出货量仅次于宁德时代、比亚迪的动力电池供应商，也是国内除宁德时代外，为数不多擅长三元锂电池技术的厂商。</p>\n  <p>在进入理想供应链之前，中创新航已长期向小鹏汽车、零跑汽车等头部新势力品牌供货。2025年，零跑汽车又与中创新航按49：51的股比，成立了合资公司。近来，中创新航又进入了鸿蒙智行和小米汽车的供应链。</p>\n  <p>在引入中创新航之前，理想已布局了宁德时代和欣旺达两家动力电池供应商。其中，理想与宁德时代共创的电池项目，在理想内部被称为联合开发；而理想与欣旺达的合作，理想内部称之为自研电池。</p>\n  <p>理想与宁德时代的合作开始得较早，早在理想第一款车理想ONE发布时，宁德时代便是其核心电池供应商。</p>\n  <p>2023年4月，理想与宁德时代达成全面战略合作协议，理想的第一款纯电车MEGA成为全球首款搭载宁德时代的4C麒麟电池的量产车型。去年9月，双方又签署了五年全面战略合作协议。</p>\n  <p>同样是在去年9月，理想与欣旺达的合资公司注册成立，双方的出资比例是50：50。合资公司用于生产理想牌电池，理想对电池产品、工艺和材料等进行主导设计，欣旺达更多的是扮演ODM的角色。</p>\n  <p>近日，理想汽车又以26.5亿元增资欣旺达动力，交易完成后，理想汽车相关主体将成为欣旺达动力第二大股东。</p>\n  <p>今年，理想与欣旺达合作的“理想牌”电池批量上车。</p>\n  <p>9月7日，理想汽车官宣，理想自研电池将全面覆盖旗下车型。按理想汽车官方披露的：</p>\n  <p>目前，理想牌电池已在理想L8、理想L6、理想i8上搭载；</p>\n  <p>今年第四季度，新一代理想MEGA、全新理想i9及2026款理想i6，也将按产品和交付节奏陆续搭载“理想牌”电池。</p>\n  <p>其中，新一代理想MEGA首批采用宁德时代5C三元锂电池，9月7日15:00及之后锁单的用户，将进入搭载“理想牌”电池的交付批次；全新理想i9首批也将提供宁德时代5C三元锂电池，在“理想牌”电池完成生产爬坡后，切换为理想自研的5C三元锂电池。</p>\n  <p>车企在体量进入一定规模后，供应链安全，便成为其重要课题。动力电池作为整车的核心零部件，它的交付和成本向来是汽车供应链的焦点。</p>\n  <p>而多点布局正是车企保障供应链安全，以及降本的常规方式，理想与欣旺达合作“理想牌”电池是出于这一考虑，如今理想引入中创新航做为第三家动力电池，同样是为了保证成本掌控权和供应安全性。</p>\n  <p>有接近中创新航的行业人士告诉36氪，早在2022年，理想便和中创新航有过交流。</p>\n  <p>但最终欣旺达先中创新航一步，进入了理想供应链。有接近理想的行业人士表示，一个原因在于欣旺达技术配合度高，同时愿意对理想开放部分股权。</p>\n  <p>2026年，理想进入了产品大年。理想L9 Livis、新一代MEGA、理想i9等理想寄予厚望的翻身之作，都在今年问世。</p>\n  <p>与此同时，理想所处的行业环境是，车市竞争越发激烈，碳酸锂、内存等涨价，又推动汽车供应链成本攀升。</p>\n  <p>因而，保交付、降本势必成为理想汽车的更核心议题，引入中创新航也就成了应有之义。</p>\n  <p>事实上，不仅理想，鸿蒙智行、小米汽车等头部新势力品牌，也都在多点布局动力电池供应商。</p>\n  <p>鸿蒙智行体系中的智界、尚界早已是中创新航的客户，今年来，长期由宁德时代独供的问界品牌，也引入了中创新航、国轩高科两家二线电池供应商，中创新航将为问界供应81度电的电池包，上车问界M6。</p>\n  <p>小米汽车此前已布局了宁德时代、弗迪电池两家动力电池供应商。9月4日，小米汽车又与中创新航、欣旺达动力官宣了龙甲电池战略合作，小米增程系列车型——澎程会全系搭载这一电池系统。</p>\n  <p>和��前理想与欣旺达的“理想牌”电池合作类似，在龙甲电池合作中，小米主导电池包产品定义，深入参与电芯材料选型、配方设计等，中创新航、欣旺达的角色则是深度配合的电池合作方。</p>\n  <p>在极致的成本压力与竞争压力下，理想、鸿蒙智行、小米等头部汽车品牌，先后走上了推出自有电池品牌、采购二三线电池厂电芯、进行“穿透式管理”之路，而这或将使车企在动力电池这一核心零部件上，掌握更多话语权。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_a37149f12a4a471fa0f542c5893c8526@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-09-08T13:55:54+00:00", "fetched_at": "2026-09-09T02:47:25.322070+00:00", "fingerprint": "f94fbf44f67977ea"}, {"source": "36氪 - 最新文章", "title": "科氪 | 首发搭载麒麟9050 Pro芯片，HUAWEI Mate XT 2 非凡大师正式亮相", "url": "https://36kr.com/p/3974948035342594?f=rss", "summary": "<p>【2026年9月7日 中国，广州】9 月 7日，华为三折叠家族新成员HUAWEI Mate XT 2 非凡大师正式亮相。</p>\n  <p>HUAWEI Mate XT 2 非凡大师以展翼三折叠形态焕新登场，持续突破极致美学、极致工艺与极致创新的边界。首发搭载麒麟9050 Pro芯片，并带来超可靠折叠玄武架构、灵盾防窥屏、第三代红枫影像以及HarmonyOS 7大屏体验等多项业界首创功能和体验。三折叠开创者，崭新一代，再展非凡。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_27531c735ed84a2297faa87bb652b0c4@517825446_oswg1060351oswg1919oswg1280_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>非凡设计：展翼形态，从容左右</strong></p>\n  <p>全新展翼三折叠HUAWEI Mate XT 2 非凡大师，左右开合，展开方式更符合使用直觉。设计理念蕴含东方美学意韵，背板以织金云锦工艺织就青云纹，共推出锦紫、皓白和玄黑三款配色。镜头饰圈传承标志性星钻设计，采用钇晶宝石材质，经过1800℃高温煅烧成型；融合宝石设计及切割工艺，经8道工序精细打磨抛光，形成33个星钻切面，宝石质感璀璨夺目。</p>\n  <p>整机采用超可靠玄武架构，重构铰链与屏幕工艺，由内而外层层防护，并首次在三折叠手机上支持IP58/59级防尘抗水。玄武昆仑玻璃外屏无惧日常刮擦，从容抵御磕碰；还能实现抗反光，阳光下显示依然清晰。内屏采用超韧多重复合叠层，包含超大UTG玻璃、航天级超薄高强钢和碳纤维内屏支撑层等，多重抗冲击。第二代天工铰链系统采用五弧臂主轴和连杆同步机构，均匀受力，可靠抗压。</p>\n  <p><strong>非凡性能：麒麟芯片，性能跃升</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_8cddef4ff2a94b6083e25152537695c8@517825446_oswg444451oswg1269oswg423_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>HUAWEI Mate XT 2非凡大师首发搭载麒麟9050 Pro芯片，性能与能效双重跃升。软、硬、芯、云深度协同，整机性能较上代提升42%。超快灵犀CPU配合超丝滑方舟引擎，大文件加载快人一步；运行多个App或多任务并行时，能更胜一筹。马良GPU计算单元与缓存翻倍，渲染性能大幅提升；游戏场景下支持5000万线硬件级实时光线追踪，更沉浸、更真实。达芬奇架构NPU带来端侧AI算力跃升；多尺寸大模型入端，并且行业首次支持原生盘古30B-A2B MoE全模态大模型，支持离线完成小艺整理本地相册等智慧体验。</p>\n  <p>创新散热架构，热源三框分布，配合超大均热板与高导热石墨烯材料，实现热量跨轴高效传导。多通信系统智能协同，32根分布式天线，5A 通信快人一步；支持天通卫星通信和北斗卫星消息，四海皆通。移动安全处理器加上独立安全芯片，实现后量子密码算法检测并通过EAL5+安全认证，为个人数据与资产安全提供双重保障。</p>\n  <p><strong>非凡科技：集大成者，安心从容</strong></p>\n  <p>业界首发可折叠灵盾防窥屏，折叠机第一次实现硬件级防窥。采用独立双像素设计，防窥模式开启前后屏幕分辨率保持一致，正面观感始终清晰如一。具备智能感知能力，进入机场、火车站还会智能提醒；更支持双触外屏和双触智控键等方式优雅开启防窥。</p>\n  <p>HUAWEI Mate XT 2 非凡大师搭载心电分析提示软件，获得药品监督管理局二类医疗器械注册证，展开大屏双手握持手机即可发起心电测量。小艺智慧解读分析报告，贴心守护。</p>\n  <p><strong>非凡影像：红枫原色，大片入镜</strong></p>\n  <p>HUAWEI Mate XT 2 非凡大师从光学硬件到算力底座全方位升级。首发第三代红枫原色摄像头，可有效过滤红外杂光干扰，色彩还原能力相较前代提升95%。同时搭载超高动态主摄、超大光圈潜望式长焦和超广角摄像头，带来真实色彩、真实人像和通透夜景实力，而且远近皆出色。视频拍摄支持18EV超高动态范围能力，帧帧质感出众。</p>\n  <p>XMAGE智拍全新升级，智能识别人、景、美食场景，支持AIGC合成的预览效果，构图与光影推荐一目了然。独特三折形态支持“台历模式”拍摄，无论自拍还是多人合影，轻松定格温馨瞬间。</p>\n  <p><strong>非凡体验：大屏体验，更胜一筹</strong></p>\n  <p>HUAWEI Mate XT 2 非凡大师搭载全新HarmonyOS 7，重构大屏交互体验。全景多窗能力支持三窗并行铺满显示、窗口大小多档位调节和独立音量调节等特色体验。大屏体验覆盖金融理财、社交娱乐、智慧办公、购物比价、出行攻略等核心场景，并与行业头部应用完成深度适配，持续引领三折叠大屏生态创新。</p>\n  <p>HUAWEI Mate XT 2 非凡大师售价19999元起，将于9月12日10：08正式开售。购买HUAWEI Mate XT 2非凡大师，价值至高5390元的非凡尊享服务即刻拥有，包含一年一次优惠换内屏，从容应对屏幕意外损坏，碎屏维修立省数千元，还有两年内享内、外屏各四次免费贴膜、一年内两次免上门服务费、到店VIP专属服务，&nbsp;日常用机场景全覆盖，使用安心，体验更尊贵。同时，随新机加购HUAWEI Care+ 意外无忧服务，更能为您的新机提供周全的意外损坏保障以及店电池焕新服务，尽享安心无忧的用机体验。</p>", "category": "tech", "published_at": "2026-09-08T16:06:29+00:00", "fetched_at": "2026-09-09T02:47:25.322064+00:00", "fingerprint": "a13572462b9c69de"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨寿司郎一员工称被要求“用手捂化冻虾”，涉事门店回应；DeepSeek扩招150人，0个AI研究岗；摩尔线程股价连续两日大跌", "url": "https://36kr.com/p/3975414566826245?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>江波龙：首次回购公司A股股份124.95万股</li>\n   <li>小米王乃岩已离职创业，方向为物理AI</li>\n   <li>燧原科技上市在即，多家券商已提前布局</li>\n   <li>茅台年内第六次调价</li>\n   <li>苹果被曝签下不设价格上限的NAND长协</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>寿司郎回应员工用手捂化冻虾</strong></p>\n  <p>近日，有自称寿司郎石家庄万象城店员工的网友在社交平台发帖称，门店一名“带教教员”要求员工用手捂化冻虾，引发关注。寿司郎回应界面新闻称，公司注意到相关信息后第一时间进行内部核查。网帖中提到的方式并非寿司郎规定的解冻方法，属于部分员工的错误操作。涉事员工已被依规记过，并接受强化培训。寿司郎表示，公司根据不同食材的特性制定了相应的解冻方法和内部操作指南，一般食材应在解冻冰箱中进行冷藏解冻。目前，公司正在对所有门店展开全面排查，纠正错误操作，并同步强化全门店员工培训。（界面新闻）</p>\n  <p><strong>DeepSeek扩招150人，0个AI研究岗</strong></p>\n  <p>9月8日，国产大模型厂商DeepSeek发布最新一轮招聘计划，开放约150个招聘名额，重点面向拥有2至10年工作经验的资深工程师。与6月份全部门扩招的综合招聘不同，此次招聘画风突变，岗位全部集中在工程落地方向，没有一个AI研究类岗位。</p>\n  <p>对于一家长期以“小而精”著称的AI公司而言，150人的扩招规模并不算小。根据DeepSeek发布的招聘信息，本次招聘分为两大序列：服务端开发工程师覆盖大模型研究平台、Agent框架组件、研发效率基建、DeepSeek API、线上服务、数据工程六大方向；Agent弹性计算研发工程师则分为平台开发和底层系统两个方向。（界面新闻）</p>\n  <p><strong>摩尔线程股价连续两日大跌</strong></p>\n  <p>9月8日，国产GPU龙头摩尔线程低开，盘初快速下挫，一度跌超10%，股价再创新低至371.17元。截至当日收盘，摩尔线程报400.11元，下跌15.38元，跌幅 3.70%，全天成交额56.15亿元，总市值1880.63亿元。根据公告，9月7日，摩尔线程2577.45万股首次公开发行网下配售限售股迎来解禁。就当日跌停原因，第一财经记者以投资者身份致电摩尔线程证券事务代表电话，工作人员表示，当天是网下配售限售股大额解禁日，请投资者理性看待，公司基本面正常。（第一财经、新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek V4.1 Flash开启中间版本内测</strong></p>\n  <p>DeepSeek V4.1 Flash 开启中间版本内测。据介绍，其采用了新的模型结构，原生多模态支持、能力更强、速度更快、且成本更低。（财联社）</p>\n  <p><strong>腾讯文档推出“AI工作台”</strong></p>\n  <p>36氪获悉，腾讯文档宣布AI服务全端升级，正式推出“AI工作台”。此次升级基于WorkBuddy提供的Agent内核框架，结合腾讯文档自研的编辑引擎和专业Skill，让AI从单纯生成内容，进一步进入真实文件和办公任务的完整流程。此前上线的“人机双写”功能也融入AI工作台，AI不仅能生成内容，还能直接修改原文件。</p>\n  <p><strong>阿里发布QoderWake 1.0</strong></p>\n  <p>36氪获悉，阿里发布数字员工产品QoderWake 1.0。据介绍，用户一句话描述岗位需求，QoderWake可生成一份角色文档，用户修改、配置和确认后，即可生成一个理解工作职责、协作关系、工作权限等信息的数字员工。目前，QoderWake已内置前端、后端、产品经理、内容运营、数据分析师、项目管理员、UI设计师等10个岗位。</p>\n  <p><strong>字节跳动将推出实时空间视频生成AI模型</strong></p>\n  <p>字节跳动正准备推出一款实时空间视频生成AI模型。据悉该模型基于字节跳动现有的电影级视频生成AI模型Seedance构建，将允许用户面向直播、短剧和游戏创建交互式虚拟世界，将用户置于高度沉浸的三维虚拟环境中，功能与谷歌的Genie类似。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>Anthropic放弃收购以色列AI初创公司Decart</strong></p>\n  <p>据知情人士称，Anthropic已经决定不收购人工智能初创公司Decart，该初创公司提供的服务之一是优化堆栈，旨在帮助人工智能开发者榨干芯片的每一分性能。8月初，Anthropic第一次传出计划收购Decart的消息，预计交易规模为60亿美元，这被认为将是Anthropic迄今规模最大的一次收购，也被视为Anthropic在IPO前的一次重大交易。（科创板日报）</p>\n  <p><strong>江波龙：首次回购公司A股股份124.95万股，成交总金额4.48亿元</strong></p>\n  <p>36氪获悉，江波龙公告，公司于2026年9月8日首次通过回购专用证券账户以集中竞价方式回购A股股份124.95万股，占总股本的0.29%，成交总金额为4.48亿元。根据此前方案，公司拟使用自有或自筹资金以集中竞价方式回购股份，用于股权激励或员工持股计划，回购资金总额不低于4亿元且不超过8亿元，回购价格不超过735元/股。</p>\n  <p><strong>美股三大指数集体下跌，百度跌近7%</strong></p>\n  <p>36氪获悉，9月8日收盘，美股三大指数集体下跌，道指跌1.18%，纳指跌0.32%，标普500%跌0.58%；大型科技股多数下跌，英伟达跌超2%，苹果、微软跌超1%，亚马逊、Meta、谷歌小幅下跌，特斯拉涨超3%；热门中概股跌多涨少，百度跌近7%，拼多多、京东跌超2%，阿里巴巴、微博、蔚来、小鹏集团小幅下跌，爱奇艺涨超11%，哔哩哔哩涨超6%，理想汽车、网易小幅上涨。</p>\n  <p><strong>太子奶创始人李途纯去世</strong></p>\n  <p>9月8日，有消息称原湖南太子奶集团总裁、董事局主席李途纯去世。其子李帅向封面新闻证实了这一消息。李途纯，这个名字，对熟悉中国民营经济的人来说，并不陌生。从白手起家到问鼎央视“标王”，从引进外资对赌到资金链断裂，从身陷囹圄15个月到无罪释放，再到晚年屡败屡战——李途纯的一生，与其创立的太子奶一样，经历了太多的跌宕起伏。（界面新闻）</p>\n  <p><strong>美国调整对加拿大部分产品从价关税适用范围</strong></p>\n  <p>美国总统特朗普当地时间9月8日签署公告，宣布调整对加拿大部分产品征收50%额外从价关税的适用范围，相关调整将于9月15日起生效。公告称，美国政府此前认定，加拿大在机动车领域采取的相关措施对美国商业构成歧视，并对美国商业造成负担。为抵消相关影响，美国此前决定对加拿大部分产品加征50%的额外从价关税。（央视新闻）</p>\n  <p><strong>国际铜价创新高，绩优低PE铜产业股揭晓</strong></p>\n  <p>由于市场看好电网建设、人工智能以及数据中心建设对金属铜的需求前景，今年以来，LME（伦敦金属交易所）铜价格持续走高。9月8日，LME铜价盘中触及14624美元/吨，再创历史新高。东方证券研报认为，铜板块有望迎来盈利上修和估值修复的双重共振。A股市场上，共有25家上市公司涉及铜产业链，主业与铜矿、铜合金、铜加工等相关。2026年上半年，共有19只铜产业股净利润同比增长超过15%（含扭亏为盈）。</p>\n  <p><strong>霸王茶姬跨界开卖茶叶蛋，单点一个5元</strong></p>\n  <p>霸王茶姬（上海）官方账号9月7日在社交平台发布消息称，上海7家门店正式上线茶叶蛋，分别为上海金茂大厦店、上海长宁凯德来福士店、上海市同济大学附属肺科医院店等。该产品名为“白雾红尘茶叶蛋”，单点价格为5元。若搭配正价饮品，加购价为2.5元；每天10:30前，购买指定早餐饮品，搭配茶叶蛋套餐可享8折优惠。</p>\n  <p>9月8日，界面新闻致电霸王茶姬上海金茂大厦门店，工作人员表示，门店推出的茶叶蛋业务目前处于测试阶段，只能堂食，不能点外卖。此外，2.5元的加购价为限时活动，活动日期为9月7日到9月21日，过后将恢复原价。霸王茶姬官方客服对界面新闻表示，目前只有上海地区推出了茶叶蛋业务，未来是否会在更多城市推广还不确定，需要关注品牌后续消息。（界面新闻）</p>\n  <p><strong>小米王乃岩已离职创业，方向为物理AI</strong></p>\n  <p>36氪获悉，小米汽车自动驾驶技术负责人王乃岩已于近日离职，正在频繁接触投资人开启创业，探索物理AI方向。截至发稿，小米对这一消息未有回应。</p>\n  <p><strong>旅行青蛙将于12月8日停止运营</strong></p>\n  <p>9月8日，@旅行青蛙-中国之旅发布停运公告，表示由于IP授权合作到期，《旅行青蛙·中国之旅》将于2026年12月8日正式停止运营。2026年9月8日14时：关闭全平台下载入口，玩家将无法下载本游戏，同时停止游戏充值、新用户注册；2026年12月8日18时：正式停止游戏运营，关闭游戏服务器；游戏官网下架。届时玩家将无法通过游戏服务器登录游戏。在游戏服务器关闭后，各服务器内有关游戏的所有帐号数据及角色资料等信息将被全部清空。（界面新闻）</p>\n  <p><strong>多部门印发通知，扩大灵活就业人员等群体基本医保参保规模</strong></p>\n  <p>国家医保局、财政部、交通运输部等6部门近日联合印发通知，启动灵活就业人员、农民工、新就业形态人员参加基本医疗保险提质专项行动。计划用3年左右时间，持续扩大灵活就业人员等群体基本医保参保规模，重点提升职工医保参保人数。（央视新闻）</p>\n  <p><strong>燧原科技上市在即，多家券商已提前布局</strong></p>\n  <p>9月7日晚燧原科技发布发行结果公告，本次网上投资者放弃认购近1.69万股，上述股份全部由保荐人（联席主承销商）包销，包销金额239.91万元。根据券商中国记者对燧原科技招股书股东名单穿透至第三层发现，券商、保险、信托等金融机构已通过前期投资早早入局。其中，广发证券另类子公司直接投资逾280万股，成为持股数量最多的券商。国泰海通另类子公司亦直接投资逾96万股，该券商还通过旗下股权投资平台广泛借道参与，累计持股数量至少百万股。中金公司旗下两大私募子公司则布局较早，始于五年前。此外国信资本、华安嘉业等十余家券商也通过间接投资方式参与其中。随着燧原科技上市临近，这些早期布局能带来多少回报，值得持续关注。（证券时报）</p>\n  <p><strong>宁德时代港股一度下跌超4.5%</strong></p>\n  <p>36氪获悉，9月8日，宁德时代港股一度下跌超4.5%，至3月10日以来盘中新低，盘中最低546.50港元。截至收盘，港股报562.00港元，跌幅1.83%。</p>\n  <p><strong>高德回应“开发扫雷榜”：确有相关产品在推进</strong></p>\n  <p>36氪获悉，9月8日，针对网传“高德正在开发‘扫雷榜’产品，将根据真实用户评价展示店铺雷点”的消息，高德方面回应称，确有相关产品正在推进中，具体功能和呈现形式以最终上线版本为准。</p>\n  <p><strong>苹果被曝签下不设价格上限的NAND长协</strong></p>\n  <p>存储芯片价格持续上行，议价权正在易手。据媒体报道，苹果近日一改与芯片供应商短期议价的惯例，转向多年期长协，让渡部分议价空间以换取供应确定性。据媒体当地时间9月7日报道，苹果近期或已就NAND闪存供应签订长期供货协议（LTA）。报道称，目前交易对手方、供货量与定价条款均未披露，但据相关市场人士判断，最有可能的供应方是日本闪存芯片制造商铠侠——它本就是苹果NAND的核心���应商之一。报道称，该协议期限可能为三至五年，且不设价格上限。此前，行业内的多年期长协主要集中在高带宽内存（HBM）领域，此次延伸至NAND，因而格外引人关注。（财联社）</p>\n  <p><strong>小鹏机器人生产线正式启用</strong></p>\n  <p>36氪获悉，据小鹏汽车消息，小鹏机器人生产线正式启用，高阶通用人形机器人完成自动化总装并自主走下产线。据了解，小鹏机器人生产线是全球首条高阶通用人形机器人自动化生产线，由小鹏自主设计、正向开发，将汽车工业成熟的质量体系与人形机器人精密制造深度融合，构建高精度、高柔性、高自动化的智能制造体系，核心制程自动化率超80%，为规模化量产和快速扩产打下基础。据悉，小鹏机器人将于今年底正式进入规模量产阶段，并于2027年上市交付。</p>\n  <p><strong>茅台年内第六次调价</strong></p>\n  <p>从多地的茅台自营店获悉，飞天53%vol 500ml贵州茅台酒的零售价已由1753元/瓶上调至1766元/瓶，距离上一次调价，仅过去一个月时间。这也是贵州茅台年内第六次调价。除了飞天茅台外，飞天53%vol 1L贵州茅台酒已由3269元/瓶调整为3291元/瓶。此外，此轮涨价还涉及五星53%vol 500ml贵州茅台酒、53%vol 200ml贵州茅台酒、53%vol 500ml×2贵州茅台酒（丙午马年）。此次还有两款产品价格略微下调，分别为53%vol 50ml×5贵州茅台酒（金色）、飞天43%vol 500ml贵州茅台酒。（澎湃新闻）</p>\n  <p><strong>恒大汽车董事会会议推迟至9月16日</strong></p>\n  <p>36氪获悉，9月8日。恒大汽车在港交所公告，批准本集团截至2024年及2025年12月31日止年度的年度业绩以及本集团截至2025年6月30日止六个月的中期业绩的董事会会议已改期至2026年9月16日。公司股票并将继续暂停买卖，直至进一步通知。</p>\n  <p><strong>比亚迪回应“网传闪充车型订单积压25万辆”：消息不实</strong></p>\n  <p>日前有消息称，比亚迪举行电话会议，会议中管理层透露支持闪充技术的车辆订单积压量约为25万辆，到2027年一季度将实现产能充足。9月8日，比亚迪方面表示，上述消息不实。（红星新闻）</p>\n  <p><strong>“山寨车鼻祖”回应股价涨停</strong></p>\n  <p>9月8日，众泰汽车（000980.SZ）开盘后涨停，报1.84元/股，总市值92.78亿元。当日该股收盘报1.84元，涨幅10.18%，成交额6.42亿元，总市值92.78亿元。消息面上，众泰汽车7日召开2026年第四次临时股东会，审议通过选举出3位非独立董事。同时，众泰汽车在投资者平台表示，公司全新自研车型研发工作稳步推进。</p>\n  <p>第一财经记者以投资者身份致电众泰汽车证券事务代表电话，工作人员表示，7日股东会选举非独立董事事宜与8日公司股价上涨应该没有必然联系。股价上涨属于市场自发行为，存在很多可能性。此外，公司计划今年内上新车，“但这只是计划”。 （第一财经、新浪财经）</p>\n  <p><strong>李强：加强信贷支持，完善城市更新基金等金融工具，构建多元化可持续投融资体系</strong></p>\n  <p>9月8日，国务院以“高质量推进城市更新、促进城市内涵式发展”为主题，进行第二十一次专题学习。国务院总理李强强调，城市更新是个系统工程，必须加强统筹协调，凝聚强大合力。要加大政府投入力度，加强要素资源保障，统筹用好各类政策性资金，强化财政金融协同，推动重大工程项目建设。要更好发挥市场力量作用，加强信贷支持，完善城市更新基金等金融工具，构建多元化可持续投融资体系。要加快完善政策制度体系，强化法治保障，根据城市更新的实践需要，适时调整优化规划、用地、财税、金融等方面的相关政策、法律法规和标准规范。（新华社）</p>\n  <p><strong>中际旭创：控股股东解除200万股股票质押</strong></p>\n  <p>6氪获悉，中际旭创公告，公司控股股东中际控股将其持有的200万股股份办理了解除质押业务，占其所持股份比例1.65%，占总股本比例0.17%。截至公告日，中际控股及其一致行动人累计质押332.8万股，占其合计持股比例1.72%。</p>\n  <p><strong>*ST萃华：收到终止上市事先告知书</strong></p>\n  <p>36氪获悉，*ST萃华公告，公司收到深交所下发的《终止上市事先告知书》。因公司未在法定期限内披露2025年年度报告，股票于2026年5月6日起停牌，停牌两个月内仍未披露，股票于7月7日起复牌并被实施退市风险警示。在实施退市风险警示之日起两个月内仍未披露过半董事保证真实、准确、完整的2025年年度报告，触及终止上市情形，深交所拟决定终止公司股票上市交易。若最终决定终止上市，公司股票将转入退市板块挂牌转让。</p>\n  <p><strong>多家头部厂商密集上调产品价格，电池涨价潮加速蔓延</strong></p>\n  <p>锂电产业涨价风吹到了电池环节。近期，多家头部厂商密集上调产品价格，中小电池企业相继跟进涨价，新一轮电池涨价潮正在业内加速蔓延。据了解，本轮电芯提价，表面上是电池消费税调整带来的成本抬升，而更深层次的驱动力，来自行业供需格局的变化。不过，虽然电池厂涨价意愿强烈，实际落地情况却呈现分化态势。业内人士表示，此次价格调整更像一场压力测试，或引发新一轮行业洗牌，更将倒逼企业极致降本增效，推动竞争焦点向一体化、高端化、全球化方向跃迁。（证券时报）</p>\n  <p><strong>苹果折叠屏iPhone初期产量据悉每日仅数百部，正加快产量爬坡</strong></p>\n  <p>根据多位知情人士指出，市场期待已久的首部苹果折叠iPhone，由于苹果极为严格的质量管控标准，初期生产量每天仅有“数百部”，而苹果及其供货商正全力加快产量爬坡。据此前报道，苹果计划今年内生产800万—1000万部折叠屏iPhone，并希望凭借这款全新外型设计的机型激发市场需求，进而推升营收。报道称，有业界高层表示，按照原先规划的生产目标，正常情况下每天需要生产数万部折叠iPhone。（界面新闻）</p>\n  <p><strong>英特尔与阿斯麦推进高NA EUV量产，已处理超100万片晶圆</strong></p>\n  <p>英特尔晶圆代工（Intel Foundry）与阿斯麦（ASML）宣布，双方正持续推进高数值孔径（High NA）极紫外光刻（EUV）技术的量产应用。英特尔目前已通过早期设备认证、研发及部分量产环节处理超过100万片晶圆，高NA EUV已用于英特尔酷睿Ultra 3系列处理器“Panther Lake”部分层的量产。英特尔表示，采用高NA EUV的英特尔18A制程产品性能达到或超过使用传统0.33数值孔径EUV光刻平台的同类层。双方还将继续推动光罩从目前的6英寸向6×12英寸大尺寸光罩过渡，同时通过光罩拼接技术，让客户在现有6英寸光罩条件下获得高NA EUV的部分优势。（界面新闻）</p>\n  <p><strong>浦发银行：将自9月25日后择时停办代理上海黄金交易所个人贵金属业务</strong></p>\n  <p>36氪获悉，浦发银行发布公告称，该行将自2026年9月25日后择时停办代理上海黄金交易所个人贵金属业务，并关闭手机银行、网上银行、网点柜面等渠道的代理上海黄金交易所个人贵金属业务交易权限。关闭后，持仓客户的平仓、卖出和提货等操作权限将受到限制。为保障客户权益，建议存量持仓客户于2026年9月25日前，通过手机银行、网上银行、网点柜面等渠道，对所持有的各类合约进行卖出、平仓或提货操作。</p>\n  <p><strong>调查：美联储9月加息概率为60.4%</strong></p>\n  <p>据CME“美联储观察”：美联储到9月维持利率不变的概率为39.6%，累计加息25个基点的概率为60.4%。美联储到10月维持利率不变的概率为29.1%，累计加息25个基点的概率为54.9%，累计加息50个基点的概率为16.1%。（界面新闻）</p>\n  <p><strong>Anthropic与OpenAI的投行团队推动两家公司IPO后争取获得顶级信用评级</strong></p>\n  <p>Anthropic与OpenAI的投行顾问正游说相关机构，希望两家企业在即将到来的首次公开募股（IPO）之后获得投资级信用评级。该评级将降低两家公司宏大AI基础设施建设计划的借贷成本。知情人士透露，近几周，摩根士丹利与高盛代表这两家头部AI实验室，已与信用评级机构展开沟通，目标是上市后能够接入规模达11.7万亿美元的公司债券市场。评级机构分析师表示，代表Anthropic和OpenAI的投行提出，两家公司完成上市后将释放巨量流动性，并改善资产负债表状况。（新浪财经）</p>\n  <p><strong>巨力索具被执行1860万余元</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，巨力索具股份有限公司新增一则被执行人信息，执行标的1860万余元，执行法院为上海铁路运输法院。该公司成立于2004年12月，法定代表人杨建国，注册资本9.6亿元，经营范围包含钢丝绳、钢丝绳索具、钢丝、钢绞线、化纤类索具的研发、生产、销售等，由巨力集团有限公司、杨建忠等共同持股，杨子为该公司间接持股股东。</p>\n  <p><strong>消息人士：三星超一半4nm产能被分配给HBM4芯片</strong></p>\n  <p>据报道，三星电子计划从今年第三季度开始大幅提升HBM4的供应量。为此，该公司自今年年中以来已大幅增加HBM4芯片的晶圆投入，以进行大规模量产。该芯片采用三星晶圆代工的4nm（SF4）工艺制造。据公司内部和外部消息人士透露，截至上个月，三星电子4nm总产能的50%以上都分配给了HBM4芯片。（财联社）</p>\n  <p><strong>SpaceX总市值重回2万亿美元，股价创7月7日以来新高</strong></p>\n  <p>SpaceX股价上涨3.65%，报153.350美元/股，创7月7日以来新高，总市值报2.02万亿美元。（财联社）</p>\n  <p><strong>沃尔沃汽车大中华区销售公司总裁调整</strong></p>\n  <p>何阔即日起出任沃尔沃汽车大中华区销售公司总裁，全面负责沃尔沃在华销售业务；原总裁于柯鑫离任。这是继今年5月沃尔沃大中华区总裁兼CEO调整后，沃尔沃在华核心管理层的又一次人事变动。沃尔沃方面表示，此次调整不影响中国区业务战略，公司将继续与经销商伙伴紧密合作，推动业务稳健发展。（第一财经）</p>\n  <p><strong>Arm公司CEO：AI有望帮助人类攻克癌症，“芯荒”成头号瓶颈</strong></p>\n  <p>英国芯片设计公司Arm的CEO Rene Haas表示，AI或许能在我们有生之年帮助人类攻克癌症。但在此之前，整个行业首先需要解决一个问题：如何生产足够多的芯片来为AI提供算力。Haas认为，AI对芯片和内存的需求规模是半导体行业前所未有的。一座晶圆厂的造价高达数百亿美元，且建设周期通常需要两到三年。他指出，整个行业正处于“绝对供应受限”的状态，并预计这种供应紧张的局面还将持续一段时间。（财联社）</p>\n  <p><strong>OpenAI首席科学家称AI或很快迈入自我进化阶段，期望业界自愿放缓开发</strong></p>\n  <p>OpenAI首席科学家Jakub Pachocki警告，人工智能正在以极快速度演进，以至于越来越难以为人类所理解和控制，并称他期望AI实验室将出于安全考虑自愿放慢开发速度。Pachocki9月6日在一篇文章中写道，开发者可以尝试更严格地引导AI，使其与人类利益保持一致，也可以“在必要时放慢未来的开发速度”。他说：“我预计并希望，在建立共同安全门槛之前，自愿放缓开发将成为普遍现象。”（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>市场消息：摩尔线程秘密递交港股上市申请</strong></p>\n  <p>有市场消息称，摩尔线程秘密递交港股上市申请。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>Mistral完成30亿欧元D轮融资，投后估值超210亿欧元</strong></p>\n  <p>9月8日，法国人工智能公司Mistral宣布完成30亿欧元D轮融资，投后估值超过210亿欧元。这是欧洲科技企业迄今规模最大的股权融资。三星电子领投本轮融资，EQT旗下Scaleup Europe Fund和现有投资者PSG Equity联合领投。Mistral表示，新资金将用于扩大算力和基础设施投入，加强前沿AI模型研发，并推动商业化和国际扩张。（界面新闻）</p>\n  <p><strong>“小雨智造”完成数亿元新一轮融资</strong></p>\n  <p>36氪获悉，9月8日，“小雨智造”宣布已完成数亿元B3轮融资，投资方包括Blooming Star，新加坡Kamet Capital和国科盈峰基金。这是小雨智造在2026年内完成的第三轮融资。今年2月，公司完成由华业天成领投的数亿元B轮融资；5月，再度完成由北汽产投、复星锐正、建发新兴联合投资的数亿元B+轮融资。</p>\n  <p><strong>世界模型企业“WorldMind”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，世界模型企业“WorldMind”（寰宇心生）近日完成数千万元天使轮融资。资方为元生资本，此次融资将主要用于团队建设和扩张，以及基础设施和基础模型训练。点石资本担任公司独家财务顾问。</p>\n  <h2>酷产品</h2>\n  <p><strong>小米MiMo推出首款AI桌面应用</strong></p>\n  <p>36氪获悉，Xiaomi MiMo桌面客户端预览版启动开放邀测，这是Xiaomi MiMo首个面向个人用户的AI桌面应用。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-09-09T00:00:57+00:00", "fetched_at": "2026-09-09T02:47:25.322057+00:00", "fingerprint": "f061235b028cc3e4"}, {"source": "36氪 - 最新文章", "title": "头部智能眼镜品牌完成近10亿C轮融资，已正式启动上市筹备工作｜硬氪首发", "url": "https://36kr.com/p/3974730056757511?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，全球智能眼镜品牌「影目科技」近日完成C3轮融资，由四川振兴科创基金领投，静安资本、市北高新、广州产投、四川中试、眉山中试及东坡国投跟投。继年初完成C1、C2轮融资后，公司C轮融资累计金额近10亿元。</p>\n  <p>本轮资金将主要用于新一代空间智能硬件产品线的研发落地，及INMO AIOS 系统的持续迭代升级，加强硬件与软件底层核心能力构建；同时，加大品牌建设与全渠道布局，完善商业化能力，推动产品破圈，实现业务加速增长。</p>\n  <p>目前，影目科技已正式启动上市筹备工作，近年来公司营收增速连续保持200%以上。</p>\n  <p>智能眼镜正在被推向消费电子领域最受关注的位置。IDC数据显示，2025年全球AI智能眼镜出货量同比增幅超过200%；中国市场增速更为显著，洛图科技统计显示，2026上半年国内智能眼镜全渠道销量已达90.9万台，同比增长85.5%，对应销售额18.8亿元，同比增长98.7%。</p>\n  <p>市场规模快速抬升，但能够真正撬动大众用户心智的标杆级产品仍未出现。过去几年，行业主流产品形态始终停留在“让眼镜能显示”的初级阶段，普遍采用Birdbath方案加外接计算单元的组合，本质上是把“显示”做到了眼镜上，但“算力”仍依赖外部设备。</p>\n  <p>影目科技创始人兼CEO杨龙昇指出，“显示本身并不构成独立的终端价值。用户真正需要的不是一个戴在脸上的屏幕，而是一个能脱离手机独立运作的智能体。市场需求正在经历从‘手机配件’向‘独立终端’的关键转折。”</p>\n  <p>这一判断的背后，是产品结构的切实变化。2026年一季度，带屏AI智能眼镜销量占比已升至60%；一体式AR眼镜与分体式产品的销量占比，更从2025年一季度的9:91快速转变为2026年二季度的47:53。可以看到，用户对“独立终端”的接受度正处于迅猛提升态势。</p>\n  <p>在杨龙昇看来，智能眼镜是否成为“下一代终端”，必须回答三个问题——它能不能脱离手机独立运行？它能不能提供手机给不了的价值？它能不能在日常佩戴中做到无感？</p>\n  <p>它们的答案都指向同一个方向：一体化。</p>\n  <p>影目科技成立于2020年底，作为国内最早入局消费级智能眼镜的品牌之一，团队一开始便坚定轻量一体化的技术路线，把光学显示、本地计算、AI感知算力收拢集成在眼镜机身之内，以摆脱对手机、外接主机等外部设备的依赖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_f44d8653a6fb459692f9a50068208e0a@6022551_oswg4566290oswg6000oswg4000_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">影目智能眼镜在办公场景中应用（图源/企业）</p>\n  <p>一体化的代价，是硬件难度指数级上升。</p>\n  <p>眼镜的物理空间极其有限，镜腿里要塞进电池、芯片、天线、扬声器，镜片上要叠加显示和光学，整机重量还必须控制在普通墨镜的范围内，不能头重脚轻、不能压鼻梁、不能夹太阳穴。这意味着，光学、算力、功耗、散热、重量、佩戴舒适度必须在几毫米的空间里同时解决。</p>\n  <p>早在2021年，影目就率先推出了全彩光波导智能眼镜，将光波导技术推向消费级市场。2024年发布的AIR3，联合索尼全球首发0.44英寸Micro-OLED屏幕，实现了1920×1080分辨率，亮度是上一代的三倍。</p>\n  <p>与此同时，2023年发布的GO系列则聚焦AI能力，在翻译、提词等商务场景中得到市场验证，翻译眼镜市场占有率一度达到80%。</p>\n  <p>如果说硬件一体化是影目的第一道护城河，那么历经多代硬件同步打磨、持续迭代的INMO AIOS操作系统，则是企业更深的竞争壁垒。这套系统最早伴随着影目初代AIR产品启动开发，在空间交互底座之上不断叠加Agent、多模态感知能力，逐步演变为完整的AI原生空间操作系统。</p>\n  <p>“我们的判断很简单，眼镜不是戴在脸上的手机，操作系统要管的东西完全不一样。手机OS管的是应用、窗口和触控；眼镜OS要管的是空间、情境、意图和注意力——你在哪、看着什么、正在做什么、此刻该不该打扰你。”杨龙昇说。</p>\n  <p>影目自研的INMO AIOS，其技术架构包含三个关键层。第一，空间层全栈自研并已量产落地。 单目VIO、6DoF空间定位、空间锚点、虚实融合渲染、手势交互，全部跑在眼镜级的功耗和重量里。因此，影目的思路是端云一体，端侧只做必须低延迟的定位和渲染，大场景重建交给云端，用算法和云端算力换眼镜端的轻薄，而不是往镜腿里塞更多芯片。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_480109b8ec8348509d9aa0b14427c90b@6022551_oswg1306051oswg4096oswg3072_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">轻量化设计（图源/企业）</p>\n  <p>第二是AI原生。 影目不做底层大模型底座，支持多厂商底座灵活切换；同时，聚焦于贴近人眼的上层能力，包括多模态情境理解、Agent任务编排及工具调用等。今年，企业所发布的GO系列定位Agent实体硬件，用户对眼镜发出语音指令，云端Agent即可完成订机票、查邮件、撰写会议纪要等一整套工作。</p>\n  <p>第三是统一底层系统，覆盖全产品线。AIR系列承载空间计算全栈能力，GO系列聚焦语音交互与Agent能力。不同产品线共用同一套技术底座，再按产品定位做能力分层，以保证每一次研发投入都能在多个产品线上复用。这种架构使影目能够在保持产品差异化的同时，最大化技术投入的效率。</p>\n  <p>“今年以来，行业都在堆参数，但眼镜的算力和功耗只有手机的零头，最后拉开差距的不是参数，而是系统怎么调度这点算力，把空间和AI真正跑起来。”杨龙昇告诉硬氪，这正是影目重投自研空间AIOS的根本逻辑。</p>\n  <p>用户层面，影目科技正加速从“技术驱动”转向“技术+人群”双轮驱动。X系列的推出就是这个逻辑的落地。它不再是“一款眼镜打所有用户”，而是围绕潮流、运动、家庭等不同细分需求，做差异化的产品定义。</p>\n  <p>其中，影目与WHL达成战略合作，推出由王嘉尔参与设计并长期佩戴的INMO x Magic AI系列，首批预售就达到5万台，7月在北美独家首发。这是影目首次突破科技极客圈层，真正触达大众消费市场。影目还推出了面向女性用户的联名拍照眼镜，聚焦外观设计与日常记录需求，覆盖新锐白领、精致妈妈等更广泛人群。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_fd5fc5121c254321808c7f96f9778118@6022551_oswg80091oswg1080oswg608_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">影目INMO联合WHL推出的Magic AI Glasses（图源/企业）</p>\n  <p>通过这种先定义清楚用户、使用场景，再倒推硬件形态和交互方式的策略，让智能眼镜从“极客玩具”真正向“大众日常消费品”迁移，它不再只是少数人尝鲜的科技产品，而是普通人愿意日常佩戴、真正用得上的智能终端。</p>\n  <p>智能眼镜的核心价值，不在于复刻手机的显示能力，而在于以“独立终端”为锚点，重构人机交互的场景与方式。以一体化、轻量化、AI原生为核心目标，围绕用户的日常生活场景，将空间计算与AI能力嵌入到眼镜这一天然高频的穿戴设备中，实现真正的独立智能。</p>\n  <p>这也是AI时代终端竞争的底层逻辑迁移。当大模型逐渐消解应用之间的功能边界，竞争的壁垒不再停留于算法参数，而是向两端迁移：一端是硬件形态的独立性，另一端是场景嵌入的深度与AI的原生能力。</p>\n  <p>影目以一体式光波导技术打破“手机配件”的品类局限，结合自研AIOS构建独立终端生态，正试图实现从“功能机式眼镜”到“下一代空间计算终端”的路径升级。</p>\n  <p><strong>以下为硬氪与影目创始人杨龙昇的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：相比于短期起量速度更快的Birdbath和外接方案，影目长期坚持一体式光波导路线，从竞争态势来看，如何看待不同技术路线在未来市场格局中各自所处的位置？</strong></p>\n  <p><strong>杨龙昇：</strong>Birdbath和外接方案短期内确实能更快出货，但它有一个根本性问题，它做的是“手机配件”生意。影目成立第一天就坚持一体式路线，因为我们定义自己要做的，是“下一代终端”。</p>\n  <p>智能眼镜如果真的想取代手机，它最终就必须是个独立终端，而不是依附于手机的配件。随着这几年行业不断演进，这个判断也在被持续验证。</p>\n  <p>一体式智能眼镜有几个价值，是妥协方案给不了的。第一是AI的主动性。AI要真正理解你，它需要持续看到你所看、听到你所听——它得“在场”。而分体式眼镜一旦离开手机就断了连接，AI成了需要用户主动唤醒的工具，而不是一个随时在线的伙伴。只有不被拴住的AI，才有机会真正释放它的潜力。</p>\n  <p>第二是空间计算的完整性。眼镜和手机最大的区别，是它能让数字内容和真实世界在同个空间里共存，虚实共生。但任何有线的设计，本质上都会限制活动自由度，而自由移动恰恰是空间计算体验的前提。用户要戴着它去户外、去运动、去任何一个现场，就必须是无线、轻量、一体化的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_d658aa9297844b3fa12f6cade01b1909@6022551_oswg1571759oswg1318oswg970_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">影目智能眼镜在户外场景中应用（图源/企业）</p>\n  <p>第三是持续学习和进化的能力。随身佩戴的设备能持续采集环境数据，让AI不断学习和适应用户的习惯。</p>\n  <p>因此，虽然一体式路线确实需要更长的研发周期和更高的成本，但我们相信，它才是那个能让智能眼镜跨越“极客玩具”、真正进入大众日常的答案。我们选这条路，不是为了做更难的事，是因为我们相信这是唯一正确的事。</p>\n  <p><strong>硬氪：翻译商务属于高壁垒、强刚需场景，是影目重点布局的主要赛道。相比之下，消费级泛场景普遍存在用户觉得产品好看不好用、低频鸡肋等痛点，面对两个不同逻辑市场之间如何平衡？具体到场景端的差异化如何体现？</strong></p>\n  <p><strong>杨龙昇：</strong>关于“好看不好用”这个痛点，影目一直在解决这个问题。</p>\n  <p>从开创品类到聚焦翻译场景完成刚需验证，再到AI智能眼镜，我们在产品定义上做了几件实在的事。翻译和提词功能是行业首创，可换电方案五秒换电池彻底解决续航焦虑；前后平衡的一体化设计把整机做到50克左右，镜腿最细处8毫米，戴上不压鼻梁；同时还建立了21套行业词库，将智能翻译推入超专业时代。换句话说，我们把智能眼镜从“能用”做到了“体面自然”。</p>\n  <p>关于同质化内卷，我们认为大众市场缺的不是产品，而是有创新能力的品牌。影目一直所做的，是定义品类，而不是跟随。</p>\n  <p>具体到场景端，我们做差异化的方式，就是先找到具体的细分场景和人群，再反过来定义产品。包括运动系列，解决户外运动时的导航、通话需求；家庭系列靠的是轻量化和佩戴舒适度这些做眼镜的基本功；拍照系列跟明星品牌合作，就是想把智能眼镜带进时尚消费的圈子。每个产品都是为了特定场景里的人做的，而不是先做出来再想卖给谁。</p>\n  <p><strong>硬氪：产品的生态壁垒如何构建？</strong></p>\n  <p><strong>杨龙昇：</strong>生态层面，我们不打算复刻手机的应用商店模式。从三个维度入手，首先是搭建开发者平台，提供可视化编排工具及SDK，开发者几天之内就可以完成应用开发并部署到眼镜设备，实现一次开发，多端适配运行；第二是打造差异化内容，聚焦移动商务、导航出行、线下游戏等与物理世界交互相结合的场景；第三是推进生态共建，联合蚂蚁、腾讯、智谱等合作方打通世界坐标系，共同构建现实世界模型，这也是空间AI智能的未来底座。</p>\n  <p>我们相信软件生态真正的壁垒不是应用数量，而是情境数据和用户信任构成的飞轮——戴得越久，系统越懂你，世界越懂你。</p>", "category": "tech", "published_at": "2026-09-09T01:00:00+00:00", "fetched_at": "2026-09-09T02:47:25.322048+00:00", "fingerprint": "c694be0e91c3214c"}, {"source": "36氪 - 最新文章", "title": "半年融资三轮，这家公司以AI和数据切入儿童成长交互赛道丨36氪首发", "url": "https://36kr.com/p/3975552848589056?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_b07b4d6f8f554d81b9e756cb3af36bdf@6221844_oswg646046oswg832oswg800_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3000</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，风峦数字科技（下称“风峦科技”）近期已完成数千万元天使+轮融资，由鸿瑞达投资领投，苏州怡达基金及Hexa Capital跟投。资金将主要用于首代教育机器人的样机研发、技术团队扩建及销售体系建设。</p>\n  <p>风峦成立于2025年10月，是一家聚焦儿童成长数据资产的数字科技公司。创始人蒋肖迪毕业于美国康奈尔大学，曾创办头部知识付费与MCN公司“星峦天下”，在教育流量运营和教育产品研发领域有多年积累。团队联创及合伙人背景包含具身智能行业、AI芯片研发、教育行业头部IP以及高端制造龙头上市公司。</p>\n  <p>目前风峦科技的产品体系分为软件和硬件两条线。</p>\n  <p>软件端，聚焦家庭学习场景的AI学习工具幻课APP已上线已上线数理思维、英语学习的内容订阅与服务，2026年后续将推出语文素养、AI通识与机器人编程科目。与市面上多数AI课程产品不同，幻课APP并不只是将课程内容数字化，而是在强调AI趣味化交互的同时，在底层搭建了AI数据中台，通过颗粒化的数据抓取，包括每一帧动画的停留时长、每道题的重复错误率、使用过程中的跳出节点、用户在交互中的个性化反馈等使用动作，为每个孩子生成多维度的学习报告。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_4dae8f86351646f3b4690f323a1b8ee5@6221844_oswg488102oswg1080oswg528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">幻课app英语课程介绍（图源/企业）</p>\n  <p>“我们基于开源模型研发了自己的小模型，针对儿童的语言习惯、学习内容做了调整。”蒋肖迪表示。APP目前集成了AI口语外教、错题集、阶段学习建议等功能，同时为家长端和教师端开发了小程序，用于实时同步学习进度与报告。</p>\n  <p>硬件端则是风峦科技下一阶段的核心发力点。公司正在研发的桌面伴学机器人采用轮足方案而非双足方案，预计今年11月前完成首代样机。</p>\n  <p>选择轮足而非双足，蒋肖迪给出的理由颇为务实：“双足刨去成本和技术之外，最大的问题是经常会有摔倒的可能性。轮足更稳定，对小朋友在居家环境里的安全属性更高。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260909/v2_1960fa32c0a0425990e07adeafcea83d@6221844_oswg830679oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">桌面伴学机器人示意图（图源/企业）</p>\n  <p>值得注意的是，这台机器人的功能定位，是对标中高端学习机市场，而非市面常见的两类教育机器人——玩具属性和编程教育属性。</p>\n  <p>硬氪进一步了解到，该产品定价在6000元左右，功能上以语音交互为主，同时通过摄像头内置模型监测孩子的坐姿、微表情、注意力集中度和情绪反馈。此外，机器人本身不带屏幕，需要展示文字内容时，通过投屏或联动幻课APP完成。</p>\n  <p>“很多孩子用平板存在一个问题，会通过非教育功能去干跟学习无关的事情，”蒋肖迪说，“我们提供的其实是一个定制化家教，用机器人替代平板学习机，还增加了行为检测、情感陪伴与健康检测的功能。”</p>\n  <p>对于竞争格局，蒋肖迪的判断是：目前市面上没有直接对标的竞品。在他看来，现有教育机器人要么是玩具属性、技术门槛低但单价上不去，要么是编程教育机器人、非刚需市场且瞄准的是单一编程素养科目。风峦科技的伴学机器人切入的是每个儿童与家长都需要的家庭场景与学习赛道。</p>\n  <p>“我们瞄准的是最刚需、市场规模最大的市场。每个中产及以上家庭都要面对的课外全学科教育和家庭陪伴需求。”蒋肖迪称。</p>\n  <p>他进一步解释了硬件盈利的逻辑：“国内硬件制造业已经很成熟，我们因为有上市公司产业链背景，单台BOM成本可以控制在远低于市场平均成本的水平，而且区别于其他的单纯硬件产品，我们的机器人内置了很多长期服务与陪伴的功能，通过后端的订阅服务和功能续费，商业模式会更加长远和健康。”</p>\n  <p>如果只做到这一步，风峦还只是一家“硬件加内容”的公司。真正的差异在于其数据资产的布局逻辑。</p>\n  <p>按照风峦的规划，产品线将不只停留于机器人和APP。后续还将布局儿童健康手环、运动硬件等智能硬件，覆盖学习、行为、健康、社交等多个维度的数据采集。</p>\n  <p>这些数据汇入后台后，将为每个孩子生成纵向的成长数据库，时间跨度可达6至12年。</p>\n  <p>目前，幻课APP整体使用用户规模逼近30万，具有广泛的用户基础。待伴学机器人量产后，首个季度C端出货量预计就会超过1万台。</p>\n  <p>蒋肖迪从两个维度解释了这一目标的合理性：“对标学习机市场的出货量，1万台在刚需教育场景里根本不算多。如果放到整个具身市场，可能没几家能做到，但切到教育场景，这反而是一个保守数字。”</p>\n  <p>此外，公司明年的商业化路径分为C端直营和to B to G进校两条渠道。软件端已向部分学校免费开放试用以获取精准流量，硬件端则通过与学校合作定制功能，争取班级采购订单。</p>\n  <p><strong>以下为硬氪与创始人蒋肖迪的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：你们的伴学机器人和市面上的学习机、教育机器人本质区别是什么？</strong></p>\n  <p><strong>蒋肖迪：</strong>家长为什么愿意花大几千买学习机？是因为提高学习赛道的能力是刚需。我们的机器人首先具备学习机的所有教育功能，但在这个基础上增加了行为教育和心理教育的能力，包括行为监测、情绪支持、情感陪伴。同时它还可以解放家长，让家长不再投入大量的时间和精力来陪孩子听写、检查作业、回答问题，关注孩子有没有眼睛离课本太近等等。这不是冷冰冰的平板，而是每一个家庭都负担得起且迫切需要的定制化家教和儿童陪伴。</p>\n  <p>而且家长最头疼的一个问题就是孩子用平板偷偷玩游戏，我们的机器人就不存在这个问题，并且孩子在学习过程中的坐姿、专注度、情绪变化都能有实时反馈，而这些信息对家长和老师了解孩子同样重要。</p>\n  <p><strong>硬氪：做儿童场景的数据业务，合规上如何保障？</strong></p>\n  <p><strong>蒋肖迪：</strong>我们的数据采集必须经过监护人授权，而且授权是分项、可撤回的。数据脱敏是基础，孩子进入云端模型时不会关联具体身份信息。机器人虽然有摄像头，但行为感知在本地计算，上云的只是结构化事件和脱敏特征，原始影像不出家门。我们还设计了可删除和可迁移机制，用户终止服务后可以一键抹除全部纵向档案。合规不仅仅是规避风险，透明的数据管理本身就是产品的信任卖点。</p>\n  <p><strong>硬氪：对比教育机构的硬件产品，你们的竞争壁垒在哪？</strong></p>\n  <p><strong>蒋肖迪：</strong>传统教育公司的核心能力是流水线生产教育内容、复制教学方法。但我们做的事情本质上是AI技术结合具身机器人和已经成熟的教育内容和方法，来满足儿童学习和家庭场景的多纬度应用需求。同时，硬件端在供应链成本和技术研发与迭代速度上，我们具有以教育内容和教育方法为核心的教育机构不具备的优势。再叠加销售端积累的MCN和达人资源，我们的市场拓展速度也能跑得更快。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>鸿瑞达投资总经理何俊理：</strong>人工智能与具身智能的产业发展正步入深水区。能否依托通用大模型底座，在具体的垂直赛道、商业化场景中服务C端用户是创业公司完成从技术原型走向商业化场景的核心一跃，也是真正验证技术能力能否服务市场的重要节点。风峦切入校园、家庭场景，聚焦家长和孩子这条刚需高频的垂直场景与人群，快速完成产品打磨与场景闭环验证，有望在行业爆发的早期窗口抢占先发地位。</p>\n  <p><strong>苏州怡达基金管理合伙人章晨健：</strong>低龄人群行为数据长期存在价值密度高、结构化难度大的行业痛点。风峦搭建起「场景落地 数据沉淀 模型迭代」的正向飞轮，通过真实的人机交互在学术、行为、健康、社交等多个维度持续沉淀AI Generation时代人群的专属垂类数据集，反哺垂类模型迭代，逐步构建起难以快速复制的长期护城河。更是在AI时代最具价值的“数据”赛道里抢占了下一个时代人群的最早期核心数据资产。</p>\n  <p><strong>Hexa Capital管理合伙人荣博：</strong>风峦核心团队兼具扎实的产业积淀与专业的技术背景：一方面在具身智能领域、Agent模型研发领域具有资深专业的研发背景，同时在教育行业、家庭、校园渠道商业化与家长服务层面拥有成熟实战经验，另一方面又深度覆盖算法研发、数据收集分析与硬件工程等核心技术环节。团队同时具备底层技术攻坚能力、产业落地执行力与可持续商业化变现能力，是当前具身智能与AI赛道中十分稀缺的复合型创业团队。</p>", "category": "tech", "published_at": "2026-09-09T02:21:46+00:00", "fetched_at": "2026-09-09T02:47:25.322031+00:00", "fingerprint": "65547a1ad8f83809"}, {"source": "少数派", "title": "日本浮生录 11｜越过九州，走进奄美大岛的山海夏日", "url": "https://sspai.com/post/113299", "summary": "浪还在继续往岸边来，天色也一点一点暗下去。就让奄美大岛和我的这个夏天，停留在这里吧。<a href=\"https://sspai.com/post/113299\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-08T03:06:21+00:00", "fetched_at": "2026-09-09T02:47:
