<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

PT跟不上了——他们当时使用的GPT5.6，一次只能同时处理两三个任务。“GPT能处理的并发任务有限，会耽误我们的工作进度。”林舟说，团队开始寻找能让更多任务同时运行、调用价格也更低的模型。</p>\n  <p>DeepSeek V4.1 Flash成了新选择。9月以来，团队试用了Claude和几款国产模型，最后选中V4.1 Flash：它能完成手头的开发任务，反馈更快，调用费用也更低。林舟说，这是他们眼下“性价比最高”的选择。</p>\n  <p>今年更早的时候，Google CEO Sundar Pichai在 Google I/O大会上说，据他了解，有些公司到了5月，全年Token预算就已经快用完了。就以Google自己为例，其内部AI编程工具每天消耗的Token也从3月的5000亿涨到5 月的超过3万亿。</p>\n  <p>而就是在这次大会上，Google推出了速度更快、成本也更低的Gemini 3.5 Flash，瞄准更日常的开发和工作场景——今年以来，OpenClaw掀起的“龙虾”热潮，让普通用户也开始用Agent处理各种工作事务，这是比编程更日常、更低门槛、更高频的需求。</p>\n  <p>与此同时，越来越多的小参数模型开始出现。因为任务越来越多，模型的调用也会更频繁，若使用几千亿甚至两三万亿参数的旗舰模型，用户要承担的费用会非常高；并且大参数模型的速度也快不起来，会大大增加用户的等待时间。</p>\n  <p><strong>模型厂商，尤其是中国模型厂商，接连推出Flash版本的小参数模型，争的正是这批过去也在由旗舰模型完成日常需求。</strong>Flash，意为“闪电”。模型厂商通常用这样的命名来表示更快、价格更低的模型版本：它每次运行调用的参数较少，适合用来反复处理日常任务；而复杂问题仍可交给Pro等旗舰模型。</p>\n  <p>7月31日，DeepSeek发布V4 Flash正式版；8月26日，阿里Qwen团队的Qwen3.8-Flash-Next与智谱的GLM-5.3-Flash同日亮相；9月，DeepSeek又推出V4.1 Flash。这几款模型参数大小不一，均在千亿级别（从100B-500B的参数区间），远小于当前的旗舰模型万亿级别的参数。</p>\n  <p>两个月前，<strong>当DeepSeek V4 Flash正式发布后，有开发者把它的评测成绩和完成任务的成本画在一张图上，提出所谓“斩杀线”：那些性能不如V4 Flash，做同样的任务却更贵的模型，就这样被“斩杀”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_cfa4fd2c7f0d49c2bb34f7d14fb29b30@6252890_oswg113305oswg1280oswg976_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">灰色区域内的模型被 DeepSeek V4 Flash “斩杀”，来源：Artificial Analysis</p>\n  <p>8月下旬，美国编程Agent平台Cline开始免费提供一款未公布身份的模型。Cline称，不到一周，这款模型承担了平台超过11%的推理量。随后，智谱认领了这款模型，正是后来推出的 GLM-5.3-Flash。此前，智谱创始人唐杰在业绩会上谈到下一代模型，他说，公司“不会做一个大而无用的模型”。</p>\n  <p>事实上，“小模型”阵营还在不断扩大。<strong>智能涌现了解到，月之暗面和腾讯混元，都在推动Flash模型版本的开发。</strong></p>\n  <p>另一方面，今年以来，资本市场已经给中国模型公司押下高额赌注，这一背景下，商业化就成了更现实的问题。</p>\n  <p>公开数据显示，到今年8月，智谱的ARR（年化收入）约为16亿美元，其市销率高达46倍；尚未上市的DeepSeek，估值更是高达其预估年化收入的163倍。而大洋彼岸的 Anthropic，市销率约为 20 倍。中国模型公司在商业化上还有很长一段路要走。</p>\n  <p><strong>所以，中美模型竞争也出现了另一条主线：在继续追求 AGI，争夺模型能力上限的同时，谁能让性价比更高的模型完成更多真实任务、服务更多用户？谁能用高性价比的模型打开更大市场，创造更多营收？</strong></p>\n  <p>&nbsp;</p>\n  <h3>01 一场模型效率革命</h3>\n  <p><strong>切换模型后，林舟的一大体验改善是模型的响应快多了</strong>。</p>\n  <p>团队经常会需要几十个Agent同时写代码，他会边看进展边调整指令；发现方向不对，马上让模型修改。此前用Codex，他常要等模型输出一长段内容，才能插手纠正。“无论你是用CLI格式，还是用它原生的App，响应都要很长时间。”而一旦遇到长项目，模型需要整理此前的对话内容，使用GPT-5.6时，又要再多等上一阵。“但切换到V4.1 Flash后，你跟他说什么，他能立马反馈你。”</p>\n  <p>今年以来，Scaling Law 仍是大模型研发的主线。今年发布的Qwen3.8-Max总参数达2.4T（T表示万亿个参数），Kimi K3达2.8T。按Elon Musk今年4月披露的对比推算，当时的Claude Opus约有5T，尽管Anthropic并未确认这一数字。</p>\n  <p>这些超级模型固然触碰到了更高的智能，但更大的底座需要更多训练和部署资源；Agent场景下反复调用模型时，使用模型的成本也会指数级增加。</p>\n  <p>换用V4.1 Flash后，<strong>林舟另一个明显的感受是调用成本大大下降。</strong>他举了团队做小应用的例子：一名同事独自完成开发，“差不多三四美金，就成了一个小App出来”。</p>\n  <p>模型服务平台Requesty 8月的周榜单显示，<strong>DeepSeek V4 Flash占平台上实际Token用量约三分之一，排在所有模型首位</strong>。而在此前的第三方评测中，<strong>它与美国GPT-5.6 Luna高推理版本的综合得分接近，完成同组任务的成本低约六成。</strong></p>\n  <p>“模型公司也开始更多关注真实的市场需求，会更多去听开发者的声音。”一位基模研究员对智能涌现说。小模型一轮训练所需的时间和资源更少，能更快让用户看到他们用模型跑出来的东西是否可行，是否需要调整。<strong>“用小模型搞开发，可以更快地做版本迭代，更快拿认知。”</strong></p>\n  <p>而在日常工作中，这位研究员自己也会按任务需求来选模型。他举例说，修改实验脚本这类简单但工作量大的任务，交给GPT处理可能要20分钟，使用DeepSeek V4 Flash就只需要2分钟。“既然任务没有那么难，我就只希望模型赶紧把这件事情做完。”</p>\n  <p>正是在这样的用户场景驱动下，<strong>近期各家发布的Flash模型大都在400B以下</strong>（B表示十亿个参数）：DeepSeek V4 Flash总参数284B；GLM-5.3-Flash总参数320B；Qwen3.8-Flash-Next的主模型为125B。</p>\n  <p>“从训练的角度上来，300B和更大一些的模型，在能力上可能差不太多。”这位研究员说，自己做过不同尺寸的训练实验。在他使用的那批数据和训练方案下，<strong>约300B的模型已经能学进更大模型输出的长推理链。</strong></p>\n  <p>2025年发表于《Nature Machine Intelligence》的一项研究分析了51个开源模型，发现要在知识、推理、数学和代码等五项测试中取得相近成绩，所需的参数越来越少。研究者称之为“能力密度”提高：同样大小的模型，能做更多事。</p>\n  <p>Qwen3.8-27B是一个近期例子。在Qwen公布的同组测试中，它在编程测试SWE-bench Pro中得61.7分，上一代同尺寸模型为53.5分；在长程办公测试CoWorkBench中得70.7分，上一代为61.0分。</p>\n  <p>模型要解决的问题也随用户变化。这位研究员举例说，编程产品常回答程序员怎样写代码、管理项目；到了办公场景，问题变成了“我Excel的公式记不住怎么办”“怎么把这个论文写了”。</p>\n  <p>底层工作仍可能是写代码，但实际要完成的工作复杂度可能是降低的。从Code到Work，一场模型的效率和成本革命正在发生。</p>\n  <p>&nbsp;</p>\n  <h3>02 从“编程”到“日常办公”</h3>\n  <p>“我觉得会是两条路。”对当下Agent分化出的“编程”和“办公”两种产品，一位Code Agent创业者这样评价道。编程和办公产品都需要模型理解指令、写代码、调用工具，但面向的用户群体不同。他认为，<strong>面向普通人的办公产品，“一定需要的极致地省钱，极致的性价比。”</strong></p>\n  <p>今年1月，腾讯混元负责人姚顺雨在AGI-Next峰会上谈到用户需求的差别：企业做生产力任务时仍愿意使用能力最强的模型，但普通用户多数时候不需要。</p>\n  <p>两类用户选模型的方式也不同。“程序员会自己分辨哪些任务用更贵的模型，哪些用更便宜的。”普通用户未必知道处理表格、撰写报告需要多强的模型。上述创业者说：“这是办公 Agent的产品经理要想办法去解决的问题。”</p>\n  <p>今年1月，Anthropic推出Claude Cowork，让原本主要辅助写代码的Agent也能处理桌面办公任务。OpenAI随后推出ChatGPT Work，也是让用户直接交代一项工作，而不必在对话框里逐步提问。</p>\n  <p>与此同时，国内产品也从编程走向办公。3月，腾讯云CodeBuddy团队推出WorkBuddy；8月，阿里整合QoderWork、悟空和MuleRun，推出千问办公；而在差不多时间，字节将飞书、TRAE Work等产品的办公能力整合到豆包，推出“豆包工作”。</p>\n  <p>QuestMobile报告显示，2026年7月，腾讯WorkBuddy有658.2万月活跃用户；PC客户端用户当月人均使用19次。</p>\n  <p>面对数百万用户反复交办的日常任务，办公Agent不能只按复杂编程的标准选模型。在一些WorkBuddy用户社区中，有用户这样评价DeepSeek V4 Flash和GLM-5.3-Flash：“有这两个Flash干活基本够用。”而在企业端，一位接近智谱的人士表示，GLM-5.3-Flash发布后，不少企业客户对这款总参数320B的模型表示出浓厚兴趣。</p>\n  <p><strong>而在真实的办公Agent使用场景里，执行任务的模型甚至可以更小，小到百亿级别。</strong></p>\n  <p>聚焦办公Agent的创业公司元空智能，已经在元空AI Work中用上几十B的模型。团队基于开源模型做后训练，让它处理更垂直的任务；通用任务则调用云端的混合模型。</p>\n  <p>用户交办任务，产品替他选模型，这样的模式下，元空团队观察到用户其实对交互的速度十分敏感。一位团队成员说：“<strong>我们现在系统稍微慢一点点，一分钟之内一堆用户马上就找过来了</strong>。”</p>\n  <p>事实上，一些办公任务甚至都不需要用到DeepSeek Flash的最高思考强度。一位元空团队成员说，这样做对他们的部分任务“其实是过剩的，会输出非常非常多Token，产生大量成本浪费”。</p>\n  <p>元空智能在权衡任务效果和Token消耗，千问办公也把任务分成两档：标准模式处理日常办公，高级模式应对更难的问题。8月底，千问办公将Qwen3.8-Flash应用于标准模式。</p>\n  <p>按千问办公公布的测试结果，标准模式完成单项任务的速度提高约一倍，平均Token消耗减少75%；这一模式可以完成其定义的约95%的日常任务，更难的任务则交给高级模式。</p>\n  <p>&nbsp;</p>\n  <h3>03 更大，但也更卷的市场</h3>\n  <p>几个月前，美国创业公司Lindy宣布开始使用一款中国模型——把由平台管理的大部分日产工作Agent调用，从Claude Sonnet、Gemini切换到了DeepSeek V4 Flash。公司披露，切换后这部分调用的模型费用下降约九成。</p>\n  <p>“这是公司成立以来，对成本结构影响最大的一次调整，产品质量没有受到影响。”Lindy的创始人Flo Crivello这样说道。</p>\n  <p>8月下旬，一款名为Ox-Alpha的匿名模型进入海外编程Agent平台OpenCode和模型平台OpenRouter，立刻引起大范围讨论。</p>\n  <p>美国编程Agent公司Cline拿自家代码库中的真实故障进行了测试：Ox-Alpha和另一款模型都修好了问题，但前者消耗的输出Token只有后者约三分之一。</p>\n  <p>这款被中国用户戏称为“牛来”的模型，上线不到一周，仅在OpenCode就有约50万人使用；8月26日，智谱认领了这款模型——GLM-5.3-Flash。“牛来”模型与智谱的旗舰GLM-5.3形成了高低搭配——难题靠旗舰，日常任务则给 Flash 版本。</p>\n  <p>开发者的免费试用只是第一步。显然，<strong>中国模型公司希望借Flash的能力和价格，进入全球Agent产品，</strong>让用户的更多日常任务转向自己的模型。</p>\n  <p>这几乎是一个被 DeepSeek 带起来的市场。全球范围内，DeepSeek在V4 Flash发布后调用量一直居高不下。OpenRouter6月数据显示，DeepSeek占该平台Token用量的份额，从年初的9%升至6月初的18%；增长主要来自Agent任务。到5月底，V4 Flash已占DeepSeek系列Agent任务Token用量的70%。</p>\n  <p>DeepSeek 让其他模型厂商看到，在300B-500B区间的Flash模型，有着巨大市场潜力——这是一个被拓宽出来的新市场。</p>\n  <p>不同类型的模型去打不同定位的市场，模型厂商赚钱的概率也会提升。</p>\n  <p>从市场角度看，旗舰模型和Flash模型正在形成不同的战场。但是在大模型研发团队看来，这似乎又并非是两个对立的策略。</p>\n  <p>一位业内人士表示，旗舰模型仍有继续训练的价值。他把它比作车企的赛车：“它不一定能量产，但会有一些技术下放。”在他看来，旗舰探索出来的能力和训练经验，最终可以进入服务更广泛用户的小模型。</p>\n  <p>比如，智谱上周披露，一个由GLM-5.3驱动的Infra Agent，参与了GLM-5.3-Flash推理服务的搭建与优化，并成功将GLM-5.3-Flash部署到了国产芯片上。从初步适配到投入生产，不到两周；经过优化，同一套服务处理请求的能力提高到最初的约三倍。</p>\n  <p>另一方面，Flash模型也成了下一代模型的试验场。Qwen先在Qwen3.8-Flash-Next上使用计划用于Qwen4的新架构；据团队介绍，这款模型的训练算力消耗约为Qwen3.7-Plus的九分之一。</p>\n  <p>这场竞争不只发生在中国厂商之间，美国模型公司也参与了进来。</p>\n  <p>价格战已经打响。</p>\n  <p>7月，OpenAI将较轻量的GPT-5.6 Luna价格下调80%。在OpenAI公布的客户反馈里，美国办公Agent公司Dust称，换用Luna处理同类任务后，速度提高了40%，费用降低了40%。显然，在全球范围内，模型厂商们都在试图用更小的模型，凭借速度和价格优势争取到的Agent客户。</p>\n  <p>OpenAI 首席财务官Sarah Friar写道：“只要质量够用，低价模型就会被用于更多任务。” 而“模型处理更多任务”给模型公司带来的收入反馈，我们或将在下一个季度见到。</p>\n  <p>*文中林舟为化名</p>", "category": "tech", "published_at": "2026-09-20T08:00:00+00:00", "fetched_at": "2026-09-21T03:01:35.755183+00:00", "fingerprint": "c23d09ddd3f56675"}, {"source": "36氪 - 最新文章", "title": "主题演讲：从3000万到世界一流：长安汽车如何把速度转化为全球信任｜36氪2026 East Forward 出海大会", "url": "https://36kr.com/p/3991497021537285?f=rss", "summary": "<p>2026年，中国企业出海正在从“寻找增量”，走向更长期的全球经营。9月17日，以“潮起之时，靠岸相见”为主题的2026 East Forward第二届·36氪出海大会在上海举行。来自消费、科技、制造等领域的出海企业、投资机构，以及全球化服务商汇聚现场，围绕本地化经营、用户洞察、供应链、合规、渠道与全球组织等现实问题展开讨论。当“走出去”已不再是少数选择，企业需要面对真正的问题：如何在海外市场活下来、扎下去，把一次市场突破变成持续经营，并逐步建立属于自己的全球竞争力。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_1a9eb3cec62d4502bdc019560cea4bbc@6301044_oswg79253oswg720oswg1080_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>Peter Larko | 长安汽车海外品牌公关总监</strong></p>\n  <p><strong>Peter Larko：</strong>下午好。这是午餐后的第一场会议，我很荣幸在这里。我的名字是——Peter Larko，在过去的几年里，我荣幸地担任了长安海外品牌公关总监，与来自100多个市场的同事紧密合作，这些年来，我也见证了这家拥有164年历史的企业不断实现自我革新。</p>\n  <p>我见证了长安在中国汽车品牌中以最快的速度实现累计销量突破3000万辆。我想问你们一个问题：一个品牌需要什么才能从被看见转变为真正被信任？从中国品牌转变为真正的全球品牌？答案，我认为，就在于一个中文的词，“安心”。</p>\n  <p>今天，我想和大家分享长安如何踏上这段旅程：从3000万辆汽车销量走向世界级品牌，从中国速度走向全球信任。同时，我也想分享这一过程中遇到的一些挑战。</p>\n  <p>2025年12月，长安成为了最快达到3000万辆的中国汽车品牌，实现了累计产量里程碑。更值得一提的是，其背后的速度和加速度。第一个千万，花费了三十年，第二个千万，花费了七年，第三个千万，仅用了四年半的时间。</p>\n  <p>这不仅仅是增长，更是能力、信任和志向的体现。截至2025年年底，我们建立了22个海外制造基地，包括我们在泰国的首个海外新能源汽车制造基地，海外总产能达到35万辆。我们进入了21个新市场，把我们的产品带到了118个国家和地区。</p>\n  <p>速度让长安迅速被看见。但坦诚地讲，在多个市场，我们赢得了关注，但可能还没有真正走进用户的心里。所以，仅靠知名度，无法成就世界级品牌，什么才能做到？答案在于承诺：向每一位客户承诺安全、可持续发展，以及持久的信赖。那么，我们如何兑现这一承诺？这始于北斗天枢计划。我们坚信，安全是最大的豪华。相信我，这不只是一个营销口号，它是一种理念，贯穿于我们所做的每一件事。我们已经投资超过600亿人民币，并汇聚了7500多名全球顶尖人才和智能系统。，来打造我们的SDA，即天枢智能，其设计具备网络安全防护功能，能够持续演进，最重要的是，它是安全的，不仅体现在传统碰撞防护的意义上，而且在更广泛的层面上，在过去，汽车安全是指物理保护，比如安全带和安全气囊，还有缓冲区的设置。后来，主动安全技术逐步加入，比如自动刹车、车道保持等功能。当然，这些仍然很重要，但如今，安全涵盖了用户体验的各个维度：驾驶安全、生理安全、心理安全和情感安全。但要实现这种多维安全智能，智能助手必须建立在坚如磐石的基础之上，而这正是我们的SDA发挥作用的地方。中央环网架构，一站式端到端大模型，七重双备份冗余，这三项技术让我们有信心向用户承诺一件事：安心无忧，每一公里都是如此。我们还拥有长安汽车天枢智能实验室，这是全国首个智能汽车安全技术全国重点实验室，专门致力于智能汽车智能安全技术研究。</p>\n  <p>正是在这里，我们把承诺落实为真正的工程能力：共有200个实验室，全天候不间断测试，超过40万次虚拟模拟场景，以及330万公里的测试里程。</p>\n  <p>一个世界级的品牌，也必须对地球负责。这便是香格里拉计划的由来。我首先要提一下我们的“金钟罩电池”，这是一款完全自主研发的电池系统，实现了长寿命、真安全、高效率和快速充电。</p>\n  <p>在动力总成方面，我们开发了蓝鲸超擎动力系统，我们相信这是中国为全球混合动力市场提供的解决方案。这花费了六年时间，汇聚了1000多名工程师，凝聚了1500多项授权专利。它开创了一种混合模式，智能且无缝地平衡燃料与电力。</p>\n  <p>为了进一步建立全球信任，长安汽车董事长朱华荣先生，于2023年4月在上海宣布了“海纳百川”计划。这是我们面向国际化扩张的战略蓝图。初步成果积极向好，2025年，长安海外销量达到63.7万辆，同比增长18.9%，并在15个重点市场中位列中国品牌前两名。</p>\n  <p>因此，今年4月，我们在“海纳百川”计划下公布了更具雄心的目标。这将推动我们从以产品贸易驱动的模式，转向覆盖制造、贸易、投资、服务和ESG的一体化全业务模式，并实现协同发力。为实现这一雄心，我们正在七个核心维度上推进转型：首先，技术。在长安，技术存在的意义在于为人类服务，而非追逐规格参数。蓝鲸超擎动力系统超越了以发动机为先的传统设计理念，转而平衡燃料与电力。SDA试点项目是长安自主研发的端到端智能驾驶系统，旨在提供安全、丝滑、好用的体验，适用于所有驾驶场景。</p>\n  <p>其次，我们的产品正逐渐从全球同步的开发模式，转向全球原生、区域定制模式。这意味着我们的平台实现了全球标准化，产品则实现区域差异化，以确保每个市场都能精准满足客户需求。</p>\n  <p>第三，品牌。我们将以蓝鲸超擎和天枢智能为技术支撑，通过深蓝S05、启源Q05和引力CS55等全球车型进行落地，并以用户能够真正感受到的方式表达品牌价值——让有温度的技术，使每一段旅程更安全、更智能、更绿色。</p>\n  <p>第四，合作关系。在接下来的三年里，我们将深化与全球合作伙伴的关系，超越传统的供应或分销模式。我们正转向共同创造，以及技术、产品、品牌方面的共同发展和相互支持，还有制造方面的产能共享，构建一个开放、稳定、长期的全球生态系统。</p>\n  <p>第五，投资。在未来三年内，我们的投资将重点聚焦于四个领域：产品研发、品牌升级、服务升级以及生态系统建设，将资源投入到对用户最关键的领域。</p>\n  <p>第六，服务方面，我们正在加速构建全球服务网络，并完善备件系统和区域备件中心、服务中心及呼叫中心在每个核心市场，实现全天候响应，快速支持，让支持真正近在咫尺。</p>\n  <p>第七，同样重要的是团队。未来三年，我们的海外员工队伍将大幅扩大，超过70%的人将是本地雇佣的。同时，我们将推动全球供应链总就业人数超过15,000人。我们将在这七个战略维度上持续推进，追求一个非常明确的目标，即将海外销售额提高到150万到180万，到2030年实现这一目标。</p>\n  <p>在座的几乎所有人，都走在同一条路上：把一家为单一市场打造的企业，带到全球多个市场去赢得一席之地。所以，与其继续讲我们取得了哪些成绩，不如说说几件真正困难的事。我这么说是什么意思呢？作为一家中国企业，我们有时会发现，人们往往已经对我们的汽车形成了固有看法，甚至还没亲眼见过我们的汽车，更别说开过我们的车了。老实说，你很难仅靠说服改变别人已有的认知，营销活动的效果也是有限的。</p>\n  <p>真正能打破这些障碍的，是可靠的质量，经过独立第三方验证的测试、强有力的质保支持，以及经久耐用的车辆表现。这就是你赢得信任的方式，在任何市场中，而不是靠头条新闻，也不是靠发布会，而是靠耐心，并且始终践行承诺。</p>\n  <p>第二，将欧洲设计与中国制造相结合，我们创造了全球协同效应，这使我们能够突破障碍。我们在都灵和慕尼黑的设计中心，让我们得以接触那些毕生深耕欧洲汽车和欧洲客户的人才。我们的制造基础，则赋予我们难以匹敌的速度和规模。问题在于，人们很容易把欧洲的贡献当作最后一道工序——在已经定型的决策上做造型修饰。但只有当它介入到概念阶段，早到足以改变一项工程决策，而不是去装饰一项工程决策时，它的价值才会真正显现。</p>\n  <p>第三，不存在所谓的全球客户。北欧的冬季、海湾地区的高温和沙尘、南美洲的路况，以及不同地区的充电基础设施，都不一样。右舵驾驶、车联网能力也必须与本地应用适配，还要符合当地的数据规则，因此我们建立了全球产品验证系统。它覆盖224个国家和地区，进行24小时不间断测试，覆盖各种气候和道路条件。我们进行了3万次测试，涵盖了16个车辆属性，从零部件到系统，再到整车。正如我之前提到的，我们每天都会进行3.3公里的模拟训练。所有这些训练，都是为了让我们能够真正为新市场打造汽车，而不是简单把一辆中国车改装后出口。这辆车是专为那个市场打造的，从零开始打造的。</p>\n  <p>速度可以复制，信任不能。这正是“卖到一个市场”与“真正属于一个市场”之间的区别。</p>\n  <p>这让我回到最开始的地方：安心。安心不是一项可以安装的功能，也不是一句可以自我标榜的承诺。它是客户最终认定你已赢得的东西——而往往，远在你自以为已经赢得它之后。中国汽车行业正处于一个历史转折点。此时此刻，我们正在从规模领先转向质量领先，从国内竞争转向全球竞争，从追随者转变为如今定义未来出行的引领者。但我认为，这个时代的主导叙事不在于速度，而在于信任。</p>\n  <p>而让世界信任我们、让我们真正跻身世界一流的，是我们兑现承诺的能力。它是“北斗天枢”计划带来的安全，“香格里拉”计划带来的可持续，以及 “海纳百川”计划带来的深度本地化。它更是扎根重庆所赋予的诚信底色——这座城市把挑战化为优势，也一直是我们把长安带向世界的家园。</p>\n  <p>我们带着长安走向世界，从重庆走向世界，从3000万迈向世界一流，这就是我们正在进行的征程。非常感谢。</p>", "category": "tech", "published_at": "2026-09-20T08:45:02+00:00", "fetched_at": "2026-09-21T03:01:35.755177+00:00", "fingerprint": "cd455f13197c77f8"}, {"source": "36氪 - 最新文章", "title": "世界杯进入早场谁接住了清晨的餐饮订单？百威早点铺为百威无醇和店家找到了新的生意机会", "url": "https://36kr.com/p/3991595471895300?f=rss", "summary": "<p>2026年美加墨世界杯共有104场赛事，换算成北京时间，半数以上比赛集中在清晨5点‑12点。对于国内上班族来说，观赛时间撞上睡眠、早餐与通勤，过去围绕深夜看球形成的消费模式，也随之发生改变。</p>\n  <p>&nbsp;</p>\n  <p>消费数据已经体现出消费时段的转移。来自京东外卖的监测显示，世界杯期间凌晨4‑5点早餐订单较赛前上涨约60%，5‑6点订单增幅接近50%。虽然只是单一平台数据，不能代表整个行业，但足以说明清晨时段催生出新的消费需求。汉堡、汤粥、水饺这类方便配送、适合边看边吃的品类，增长速度超过传统早点。</p>\n  <p>&nbsp;</p>\n  <p>当下观赛消费分化为三类场景：凌晨场次更适合居家，夜宵与外卖继续受益；清晨赛事和通勤时间重叠，早餐、咖啡、便利店商品更容易被消费者选购；只有少数焦点赛事，才会带动用户线下聚集。能否抓住这波新增订单，关键看门店能否匹配赛事时段营业，而非单纯依靠营销宣传。</p>\n  <p>&nbsp;</p>\n  <p>咖啡与快餐品牌天然具备时间优势。不少咖啡品牌借世界杯，通过球队、球星相关合作吸引球迷，带动饮品销售、门店到店以及会员增长。快餐连锁则侧重门店端运营，上线赛事相关主题产品，部分门店打造观赛主题空间。不同于酒吧需要临时调整早间营业，快餐本身就拥有早餐班次、外带流程与早班人力，赛事更多是给门店带来新的消费理由，不用重构整套经营模式。</p>\n  <p>&nbsp;</p>\n  <p>咖啡、快餐以及便利店的共同优势，是已经具备成熟的晨间运营能力，产品标准化，消费者可以快速完成选购。世界杯只是放大部分产品热度，不需要门店为赛事彻底改动原有营收结构。部分烘焙店、商场也将开门时间提前至6点半，在原有早餐业务基础上叠加赛事氛围，也是同样逻辑。</p>\n  <p>&nbsp;</p>\n  <p>相比之下，酒吧与酒类品牌要适应早场赛事则难度更高。酒吧拥有大屏、适合多人观赛的环境，但清晨营业会带来人力、能耗、备餐成本的上升；工作日早晨，含酒精饮品也很难成为主流选择。不少门店和品牌转向无醇饮品、早餐套餐，或是联动其他餐饮业态探索新方案，把赛事时差带来的挑战转化为新的经营思路。</p>\n  <p>&nbsp;</p>\n  <p>但夜间经营门店的难题，并不只是简单举办晨间观赛活动。不同轮次赛事、不同球队热度带来客流差距悬殊，社区、商圈、写字楼周边门店的晨间需求也各不相同。即便统一物料可以快速落地，门店依旧要逐场权衡人力、食材投入，控制经营成本。</p>\n  <p>&nbsp;</p>\n  <p>体育赛事营销可以拉动短期订单，但餐饮行业本身正处于营销高投入的竞争环境。营销投入走高，不一定直接转化为门店经营效率提升。因此不同业态，需要用务实指标衡量早场赛事带来的收益：咖啡快餐重点关注活动过后会员留存、门店日常销售表现；酒吧需要核算晨间营收能否覆盖新增成本；外卖平台则观察早间订单高峰是否具备可复制性。品牌曝光不等于门店实际盈利。</p>\n  <p>&nbsp;</p>\n  <p>大型赛事能够短暂改写大众消费时间，但“早上看球吃早餐”未必会演化成长期消费习惯。赛事落幕之后，真正留存下来的，依旧是品牌沉淀的供应链、门店网络和用户基础。对商家而言，更大的考验在于，面对消费者时间的临时变动，能不能以较低成本，灵活适配市场变化。</p>", "category": "tech", "published_at": "2026-09-20T10:21:38+00:00", "fetched_at": "2026-09-21T03:01:35.755168+00:00", "fingerprint": "21faac69b2b9f4df"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“电子工业大米”价格飙涨；报告显示农村彩礼均值降至3.86万元；特朗普要给“人工智能”改名", "url": "https://36kr.com/p/3992398887926784?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>谷歌承认其AI模型在安全测试中侵入三家公司系统</li>\n   <li>博主曝西贝已起诉罗永浩，“就要开庭了”</li>\n   <li>公积金新规正式施行</li>\n   <li>许嵩背后公司太合音乐冲刺IPO</li>\n   <li>千叶珠宝多店清仓甩货，金饰低至990元/克</li>\n   <li>“啄木鸟维修换开关收2800元”后续：全额退费，并赔偿2000元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>“电子工业大米”价格最高涨十倍，高容量MLCC现货被炒至原价2至10倍</strong></p>\n  <p>MLCC（多层陶瓷电容器），被业内称为“电子工业大米”。小到手机家电，大到AI服务器、新能源汽车，几乎所有电子设备都离不开。近期元器件市场走出极端分化行情：AI拉动高容量型号缺货疯涨，部分现货暴涨数倍；普通消费级产品冲高回落，一冷一热的背后，是AI算力浪潮的搅动。行情从5月底开始发酵。AI算力需求爆发的消息传导至元器件市场，海外大厂将消费级产能大量转向AI高端产品，市场担忧常规物料供给收紧，渠道商纷纷囤货扫货。进入6月，现货市场进入“一天一价、甚至一小时一价”的火热状态，部分热门型号短短一个月涨幅达7—8倍，现货最高被炒至原价的2—10倍。（财联社）</p>\n  <p><strong>农科院报告：农村农户彩礼均值降至3.86万元</strong></p>\n  <p>9月19日，中国农业科学院农业经济与发展研究所在浙江杭州发布《中国农业农村微观数据观测报告2026》。这一报告依托中国农业科学院农业农村微观数据观测系统，深度挖掘了2012~2023年的连续追踪观测数据。调研横跨全国20个省份、新疆生产建设兵团和1个计划单列市，精准锁定578个行政村与12480户固定观察农户，系统呈现了新时代中国农业农村发展的微观图景。</p>\n  <p>该报告显示，调查中样本农户的彩礼均值从2019年的4.67万降到2023年的3.86万，人情支出占比从17.1%降到11.5%，村均文化组织从2012年的0.97个增长到2023年的1.18个，合唱团、书画协会、志愿服务队等新型组织不断兴起，乡村精神文明建设进入提质增效新阶段。（光明日报）</p>\n  <p><strong>特朗普要给“人工智能”改名</strong></p>\n  <p>据国是直通车，美国总统特朗普在社交媒体上发起了一项改名投票。他指出，很多人认为“人工智能”这一说法并不准确，表述也十分生硬。对于这一新现象，更为雅致且准确的叫法可以是卓越智能（Superior Intelligence）、极致智能（Extreme Intelligence），或是至高智能（Supreme Intelligence）。特朗普呼吁所有人都参与投票，选出最贴合“这场不断发展的‘革命’”的新名称。截至目前，已有超17万人进行了投票，目前得票领先的“新名字”是“卓越智能”（Superior Intelligence，简称“SI”），得票率为40.6%。数小时后，埃隆·马斯克在这个帖下回了一句话。他没有简单的做选择题，而是说：“它将聪明到让我们无法理解。”（财联社）</p>\n  <h2>AI 最前沿</h2>\n  <p><strong>DeepSeek公布节假日计费规则</strong></p>\n  <p>DeepSeek公布最新API峰谷计费规则，调休上班的周末、中国法定节假日全天均按空闲时段计费，此前已将周末全天统一按低谷收费。（IT之家）</p>\n  <p><strong>Anthropic据悉考虑在IPO前发布新AI模型</strong></p>\n  <p>Anthropic正考虑推出一款新的人工智能（AI）模型，以应对OpenAI自发布GPT-6 Astra以来所形成的势头。根据企业支出管理平台Ramp的最新数据，GPT-6 Astra约占该平台追踪的企业AI支出的13%，Anthropic旗下Claude Fable则约占8%。这引起了一些原本有意投资Anthropic的投资者的担忧。他们表示，正重新评估Anthropic作为企业级AI工具领先提供商的地位。在上市时间表方面，据最新报道，Anthropic可能将IPO推迟至美国11月中期选举结束之后。（财联社）</p>\n  <p><strong>谷歌承认其AI模型在安全测试中侵入三家公司系统</strong></p>\n  <p>美国谷歌公司18日承认，其人工智能（AI）模型“双子座”今年5月在网络安全能力测试中，侵入了三家真实公司的系统。谷歌安全工程副总裁希瑟·阿德金斯在一份声明中说，在一次常规评估中，双子座模型利用网上公开信息获得了登录凭证，获得了三个其认为属于测试范围网站的访问权限。谷歌已确保三个相关实体获知此事，并与测试合作方调整测试流程。（新华社）</p>\n  <p><strong>智谱MaaS平台上线数据内容不留存机制</strong></p>\n  <p>36氪获悉，9月20日晚间，智谱MaaS平台官方宣布，近期将上线数据内容不留存功能，为企业和开发者用户提供更严格的数据隐私保护。智谱表示，这个功能并不意味着任何情形下都不留存数据。Batch API、File API等需要在平台侧持久化保存任务或文件的功能不在上述覆盖范围内，以及法律法规要求留存、为核查涉嫌违规或滥用行为的情况，平台可能按有关要求留存相关数据30天及以上。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>9月LPR报价出炉：1年期和5年期以上利率均保持不变</strong></p>\n  <p>36氪获悉，央行公告，9月1年期贷款市场报价利率（LPR）为3.0%，5年期以上LPR为3.5%，1年期和5年期以上LPR保持不变。</p>\n  <p><strong>长鑫科技宣布第五代技术平台正式量产</strong></p>\n  <p>36氪获悉，9月20日，长鑫存储在世界制造业大会上正式宣布第五代DRAM技术平台实现量产。本次大会同步展出两款基于G5平台打造的LPDDR5X量产产品，单颗容量均为24Gb，较上一代同类型产品提升50%，分别采用496Ball、245Ball封装规格，可适配中高端智能手机、便携式消费电子等不同场景需求，目前均已进入规模量产阶段。</p>\n  <p><strong>机票价格创三年来同期最低</strong></p>\n  <p>今年中秋和国庆假期之间仅隔三个工作日，部分游客通过“请3休13”拼出超长假期，带动8天以上深度环线游报名持续走高。假期预计呈现“前短后长”的双波峰出游格局：中秋3天以省内周边短途家庭游为主，国庆7天集中释放国内长线游需求，赏秋、海滨度假、亲子游热度居前。随着假期战线拉长，国庆机票价格迎来近三年同期低点。去哪儿旅行数据显示，9月27日至10月1日期间，机票均价创近三年同期最低。（21世纪经济报道）</p>\n  <p><strong>博主曝西贝已起诉罗永浩，“就要开庭了”</strong></p>\n  <p>在爆料西贝将在两三个月内彻底倒闭后，博主“理记”再发文称西贝已起诉罗永浩。9月20日，微博大V“理记”发文表示：“知道为啥他上个月突然跳出来吗？因为西贝起诉了罗永浩，就要开庭了，他跑出来操控舆论给法院施压。这次突然碰瓷野人先生也是一石二鸟，一方面跟钟薛高复出有关，另一方面是想篡改历史制造出‘我只是消费者吐槽’的舆论风向。”此前一日，“西贝被曝将彻底倒闭”的话题登上微博热搜。西贝回应界面新闻称，“目前全国门店均正常运营，我们也会继续用心做好产品与服务，继续坚守品质，用心接待每一位顾客。也恳请大家理性看待网络信息。”（界面新闻）</p>\n  <p><strong>公积金新规正式施行</strong></p>\n  <p>2026年9月20日起，新修订的《住房公积金管理条例》正式施行。这是该条例继2002年、2019年之后的又一次系统性重大调整。新条例将原来6种提取情形修改为9种，装修自住住房、支付物业费都能用公积金，灵活就业人员也可自愿缴存住房公积金。今后，职工支付房租提取公积金，不再设置房租超过家庭工资收入规定比例的门槛。同时新增住房消费提取场景：装修自住住房、支付自住住房物业费可提取住房公积金；另外，国务院批准的其他住房消费情形也纳入提取范围。（21世纪经济报道）</p>\n  <p><strong>黄仁勋夫妇捐赠43.8万股英伟达股票</strong></p>\n  <p>当地时间9月18日，美国证券交易委员会（SEC）披露的文件显示，9月17日，英伟达CEO黄仁勋与妻子的信托无偿赠出合计43.8万股公司股票，其中29.2万股赠予黄仁勋夫妇基金会，14.6万股赠予一家捐赠人建议基金。9月18日，英伟达股价收涨1.34%，报222.27美元，市值为5.4万亿美元。按此计算，捐赠股票价值约9735万美元（约合人民币6.52亿元）。（第一财经）</p>\n  <p><strong>中泰证券一名员工私下代客操盘，7年亏掉9200万元</strong></p>\n  <p>9月18日，湖南证监局披露行政处罚决定书，中泰证券从业人员杨文明因私下接受客户委托买卖证券，被给予警告并罚款50万元。2017年至2024年间，杨文明接受谭某委托，通过下达交易指令操作张某的普通及信用证券账户，两账户合计交易25.3亿元，合计账面亏损9206.22万元。不过，杨文明接受委托期间未产生违法所得。最终，湖南证监局决定对杨文明给予警告，并处以50万元罚款。（澎湃新闻）</p>\n  <p><strong>罗永浩称点6份外卖3份是臭的，拒绝透露踩坑餐厅店名</strong></p>\n  <p>9月20日晚，罗永浩发微博称：“出差和团队一起在深圳赶一个项目，夜里加班点外卖，点到一家在福田区就有两家分店的港式茶餐厅（大众点评两千多条评论分别打了4.6和4.3；2026年必点榜上榜餐厅），结果送过来六份外卖，竟然三份都有异味臭味。这家茶餐厅的名字是……嗯，好吧，都不容易。”评论区有网友询问店名，罗永浩回复：想都不要想！（每日经济新闻）</p>\n  <p><strong>千叶珠宝多店清仓甩货，金饰低至990元/克</strong></p>\n  <p>北京商报报道，千叶珠宝多家线下门店开始清仓甩货，其中距离千叶珠宝总部最近的芳圆里店金饰克价低至990元。店员表示，将千叶珠宝的存货清空后，门店将换牌经营，售卖其他品牌黄金珠宝。但也有其他千叶珠宝门店并未受到影响，继续正常开店运营，有消费者到店一次选购30多件。实地走访过程中，记者发现，多家千叶珠宝线下门店仍在正常经营。据多家媒体报道，千叶珠宝实际控制人林明杰（董事长、总裁、董事会秘书）及其妻子高晓松（董事、副总裁）自2026年9月起失联，原因不明。（财联社）</p>\n  <p><strong>司美格鲁肽成“变质回流药”重灾区</strong></p>\n  <p>近期，广州医保部门依托药品追溯码大数据预警，联合公安打掉一个非法收售“回流药”的犯罪团伙。“回流药”指通过医保报销开出、被药贩子低价回收后非法转售的药品。执法人员发现，本应冷链保存的药品被存放在30多摄氏度、闷热潮湿的仓库内，嫌疑人发货时用泡沫箱、铝箔纸等伪装冷链保存，掩盖药品脱离冷链甚至可能变质的事实。该系列案件中，涉案金额最大的药品为司美格鲁肽。目前，警方已查获多处仓储窝点，扣押8000余盒涉案药品。（财联社）</p>\n  <p><strong>西贝成立新公司</strong></p>\n  <p>天眼查App显示，近日，武汉西贝明友餐饮管理有限公司成立，法定代表人为李明友，注册资本40万人民币，经营范围含餐饮管理、组织文化艺术交流活动、新鲜水果零售、日用百货销售、会议及展览服务等。股东信息显示，该公司由西贝餐饮集团有限公司全资持股。9月20日，据九派新闻报道，武汉西贝明友餐饮管理有限公司注册地为光谷世界城广场一家经营多年的西贝门店，门前正在装修升级，将于近期重新对外营业。（21世纪经济报道）</p>\n  <p><strong>国家能源局：8月份全社会用电量再破万亿，负荷创历史新高</strong></p>\n  <p>36氪获悉，据国家能源局消息，2026年8月，全社会用电量再破万亿，达到10332亿千瓦时，同比增长1.7%；用电负荷创历史新高达到15.6亿千瓦，较上年最大负荷高4969万千瓦，共有7天超过上年最大负荷。</p>\n  <p><strong>上海市卫健委回应“延长育儿假”建议</strong></p>\n  <p>针对人大代表提出的完善育儿假、强化月经假落实的建议，上海市卫健委作出答复。上海现行规定为符合条件夫妻，子女满三周岁前，双方每年各享有5天育儿假，休假期间工资照发。卫健委表示，将联合多部门研究延长育儿假、优化成本分担的可行性，适时提出修法建议。</p>\n  <p>关于月经假，上海现有法规仅对部分重体力、特殊岗位女职工经期给予调岗或1天公假。卫健委将配合人社部门调研，简化月经假申请流程。（澎湃新闻）</p>\n  <p><strong>永辉步步高回应减少胖东来商品</strong></p>\n  <p>近日，有消费者告诉蓝鲸记者，永辉、步步高等“胖改”超市中，胖东来品牌的商品变少了。有浙江的消费者表示：“附近一家永辉超市内胖东来啤酒没有了”，一名四川的消费者则提到：“之前一直购买的胖东来洗面巾没有了”。来自湖南的消费者同样讲到：“附近步步高超市内胖东来商品好像变少了。”</p>\n  <p>永辉超市客服对此回应称，不同门店内，胖东来的个别商品可能出现暂时缺货的情况，到货后会第一时间补货上架。蓝鲸记者分别询问了永辉、步步高超市。永辉表示，此前引进的胖东来商品一般不会受影响，所有商品的常规货架一直都有的，但是专区、流水台这些额外位置，会视情况进行调整。步步高方面则表示，商品种类会根据当地消费者需求进行定期调节，胖东来商品并未出现大规模变动。（蓝鲸新闻）</p>\n  <p><strong>“啄木鸟维修换开关收2800元”后续：全额退费，并赔偿2000元</strong></p>\n  <p>近日，“啄木鸟维修换1个开关收费2800元”事件引发关注。9月18日，据荔枝新闻报道，杨女士称，媒体报道次日，平台的处理态度发生明显转变，不仅全额退还2800元维修费，还额外赔偿2000元。维修报价单显示，电路漏电检测费为每小时168元、10小时计费共1680元，另收间歇性跳闸修复费439元、设备使用费585元、63安漏电保护器配件费96元。</p>\n  <p>近年来，啄木鸟维修曾连续两年被央视“3·15”晚会点名，2024年因维修收费过高被曝光，2025年又因无病乱修、小病大修、乱收费等问题再次被点名。（界面新闻）</p>\n  <p><strong>瑞银：全球AI领域资本支出2027年升至1.4万亿美元，九成增量来自内存涨价</strong></p>\n  <p>瑞银目前预计，2026年人工智能资本开支将接近1万亿美元，2027年进一步攀升至约1.4万亿美元，而这一增长背后的最主要原因是内存成本大幅上涨。瑞银估算，内存相关开支将从2025年的710亿美元飙升至今年的3670亿美元，2027年达到9230亿美元。其余AI相关成本预计在2026年为6310亿美元，2027年回落至5250亿美元。这意味着，今年内存成本上涨贡献了约60%的AI资本开支增量；而到2027年，随着其他零部件支出下滑，内存成本增幅甚至将超过AI资本开支的全部净增量。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>许嵩背后公司太合音乐冲刺IPO</strong></p>\n  <p>许嵩背后公司太合音乐正冲刺港股IPO，2026年6月已提交招股书。招股书显示，太合音乐于2014年正式成立，由海蝶音乐、麦田音乐、大石版权三大华语老牌厂牌整合而成，业务源头可追溯至1987年创立的海蝶音乐。2023年至2025年，公司收入分别为8.6亿元、14.19亿元以及13亿元；毛利分别为3.27亿元、3.88亿元以及3.96亿元；年内利润分别为3385.2万元、5567.2万元以及1.2亿元。从毛利率来看，公司的整体毛利率分别为38%、27.4%以及30.5%。太合音乐连续两年向单一艺人的采购金额超过3亿元，且占比均超三成。多家媒体推测此艺人即为许嵩。（21世纪经济报道）</p>\n  <p><strong>9月21日可申购宇特光电</strong></p>\n  <p>宇特光电此次发行股份总数为1767万股，网上发行股份数量为1237万股。网上申购股份数量上限为61.83万股。宇特光电的申购代码是920157，发行价为13.75元/股，发行市盈率为14.99倍，参考行业市盈率为73.59倍。</p>\n  <p>宇特光电公司是一家专注于光连接产品研发设计、精密制造与销售业务的国家级专精特新“小巨人”企业，致力于为光通信领域设备商、系统集成商、国内外电信运营商、光电子器件企业提供高性能的光连接整体解决方案。2023年至2025年，宇特光电的营业收入分别为2.12亿元、2.53亿元、3.33亿元；归母净利润分别为4186.71万元、4644.71万元、6916.95万元。（财联社）</p>\n  <p><strong>9月24日可申购粤芯半导体</strong></p>\n  <p>粤芯半导体此次发行股份总数为5.13亿股，网上发行股份数量为5126万股。网上申购股份数量上限为12.80万股，顶格申购需配深市市值128万元。粤芯半导体的申购代码是301660，发行价与发行市盈率均尚未披露，参考行业市盈率为73.18倍。</p>\n  <p>粤芯半导体是广东省首家实现量产的12英寸晶圆制造企业，是全球少数专注于模拟芯片领域的特色工艺晶圆代工企业之一。公司总部位于广州，被称为“广州第一芯”。2026年上半年，公司营业收入为17.77亿元，同比增长68.76%，归母净利润为-10.52亿元，同比增长12.41%。公司尚未盈利且存在累计未弥补亏损，预计最早将于2029年合并口径实现扭亏为盈。（财联社）</p>\n  <p><strong>德明利：向特定对象发行股票申请获深交所审核通过</strong></p>\n  <p>36氪获悉，德明利公告，9月18日收到深交所告知函，公司申请向特定对象发行股票获得深交所上市审核中心审核通过。</p>\n  <p>偷偷融资</p>\n  <p><strong>“硅基流动”完成B+轮二期和C轮融资</strong></p>\n  <p>36氪获悉，硅基流动宣布，近日，硅基流动完成B+轮二期和C轮融资。至此，公司2026年度累计股权融资额近29亿元。参与B+轮二期及C轮融资的投资方包括中国互联网投资基金、国新基金、中国移动链长基金、中国东方资产国际、京能基金、上海仪电智算基金、建投华科、北创投、翠微基金、成都科创投、江西金控、成都高新倍特基金、中泰资本、华安嘉业、华胜天成、紫光资本、智路资本、拓尔思、鹏鹞环保、兆讯科技、睿智基金、执君资本和瞰道悟新基金，以及天创资本携山东铁投产投、山东铁路基金战略参与。老股东耀途资本、盛奕资本和国泰创投集团追加投资。</p>\n  <p><strong>“御水飞行”完成千万级天使轮增资</strong></p>\n  <p>36氪获悉，智能水翼艇公司“御水飞行”完成千万级天使轮增资，本轮由一点科创投资控股（香港）有限公司与COCOON INVESTMENTS TWO LIMITED投资，松禾资本继续加注。公司成立于2025年，曾获得李泽湘旗下XBOTPARK基金千万元级投资。其核心产品为电动水翼艇，通过水翼将船体抬离水面，首款产品已获订单并开始交付。</p>\n  <p><strong>“Moonback”完成数千万元首轮融资</strong></p>\n  <p>36氪获悉，宠物智能科技品牌“Moonback”近日完成数千万元首轮融资，投资机构为AI上市公司。本轮融资将主要用于AI算法、研发和市场团队建设。</p>\n  <h2>酷产品</h2>\n  <p><strong>19999元起，上纬新材旗下启元机器人开售</strong></p>\n  <p>2026年9月20日举行的启元机器人新品发布会上获悉，启元机器人现已开售，10月1日起按订单顺序陆续发货。上纬新材CEO田华在会上透露，启元Q1与启元T1售价均为19999元，启元Q1探索版为26999元，启元T1 Pro售价为29999元。此外，启元机器人即将推出基于Harness架构的机器人Agent以及家务基座大模型PrimeMind。</p>\n  <p><strong>最复杂、速度最快的分子计算机诞生，可实现100比特、连续25次不同运算</strong></p>\n  <p>据最新一期《自然》杂志报道，爱尔兰梅努斯大学的研究人员研制出一种新型DNA分子计算机，可利用DNA分子相互作用完成加法、乘法和除法等数学运算。这是目前已报道的最复杂、速度最快的分子计算机，已实现100比特计算，并可连续完成多达25次不同运算。这项研究有望为低能耗计算和长期数据存储提供新的技术路径。（科技日报）</p>\n  <p><strong>整理丨</strong>李琪</p>", "category": "tech", "published_at": "2026-09-20T23:58:19+00:00", "fetched_at": "2026-09-21T03:01:35.755152+00:00", "fingerprint": "ce1a0db30250f5a5"}, {"source": "少数派", "title": "给电话加上「辅助驾驶」？我们想听听你的意见", "url": "https://sspai.com/post/114717", "summary": "会议开到一半，手机亮了：一个陌生号码。你盯着屏幕犹豫了几秒，不知道这会是推销、客户，还是外卖员。直接挂掉，又得惦记着会不会耽误正事；接起来，不方便说，聊完还得整理待办。轮到你主动打电话，也不轻松。邀约 ...<a href=\"https://sspai.com/post/114717\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-20T03:01:47+00:00", "fetched_at": "2026-09-21T03:01:34.523737+00:00", "fingerprint": "c2a5dfbc653474bd"}, {"source": "少数派", "title": "觉来知打明钟未，忽听邻家叫佛声：佛国老挝行记", "url": "https://sspai.com/post/114495", "summary": "这是一趟水陆空三栖的旅行——在万象的街头巷尾无意间推门而入点了一份炸五花肉套饭，味道香上了头发根；在万荣连跳两天水，最高的 8 米跳台跳下来砸得屁股很疼，各种户外活动性价比拉满；琅勃拉邦的慢生活，从清晨薄雾中的布施开始到日落时分反射着金光的湄公河结束。<a href=\"https://sspai.com/post/114495\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-20T07:00:00+00:00", "fetched_at": "2026-09-21T03:01:34.523729+00:00", "fingerprint": "894ecfaff441dab1"}, {"source": "少数派", "title": "派早报：微软高管称 AI 爬取是人类历史上最大的劳动成果盗窃", "url": "https://sspai.com/post/114788", "summary": "<p>微软高管称 AI 爬取是人类历史上最大的劳动成果盗窃</p><p>12306 称第三方购票可能更慢或失败</p><p>特朗普提议为人工智能改名</p><p>谷歌在 Android 17 中加入 Pixel 独占的 API</p><p>iPhone 18 Pro Max 支持固件限制电量以便发运</p><p>苹果硬件工程副总裁表示不建议贴膜</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/114788\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-20T2  Magazine, posted on Threads [&#8230;]", "category": "tech", "published_at": "2026-09-19T20:44:40+00:00", "fetched_at": "2026-09-20T03:04:42.395978+00:00", "fingerprint": "b4233d80af418d7d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“西贝将彻底倒闭”冲上热搜，最新回应；原钉钉CEO无招履新，年薪10万；黄仁勋出售约4.6万股英伟达股票", "url": "https://36kr.com/p/3990979197303555?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>冯仑回应被限高</li>\n   <li>下周43股面临解禁，4只解禁股上半年业绩扭亏</li>\n   <li>沙特国家石油公司下月将不向欧洲买家交付原油</li>\n   <li>新能源车险定价区间对标燃油车，车主续保保费要变</li>\n   <li>Anthropic今年年化收入预计将超过1000亿美元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>“西贝将彻底倒闭”冲上热搜，最新回应</strong></p>\n  <p>9月19日，“西贝被曝将彻底倒闭”的话题登上微博热搜。据蓝鲸新闻报道，据博主“理记”发文，持续十一年中式正餐第一的西贝将在两三个月内彻底倒闭，创始人贾国龙将个人揽下绝大部分债务，放弃股份，仅保留约100家盈利门店给员工自营。努力维持3000—4000人的生计。不得不下岗失业的西贝员工截至目前已经超过万人，关店已有两百多家。</p>\n  <p>对此，蓝鲸记者尝试联系到西贝客服，对方回应称，目前全国门店均正常运营，我们也会继续用心做好产品与服务，继续坚守品质，用心接待每一位顾客。也恳请大家理性看待网络信息。（21世纪财经报道、蓝鲸新闻）</p>\n  <p><strong>原钉钉CEO无招履新，年薪10万</strong></p>\n  <p>9月17日，港股上市公司百望股份（06657.HK）发布公告称，公司近期举行了临时股东大会，以100%赞成票审议及批准建议委任陈航为公司非执行董事，自2026年9月17日起，陈航已获委任。</p>\n  <p>根据此前公告中的简历，陈航，49岁，在企业级互联网产品、人工智能级数字经济领域拥有逾20年产品及管理经验。陈航于2025年3月至2026年6月担任钉钉（中国）信息技术有限公司首席执行官。于2021年至2025年创办两氢一氧（杭州数字科技有限公司），担任创始人。于2020年至2021年担任阿里巴巴集团控股有限公司董事会主席兼首席执行官张勇的助理。于2014年至2020年作为钉钉创始人带领团队打造企业级智能协同办公产品，并担任首席执行官。于2012年至2023年作为阿里巴巴集团“来往”产品负责人；于2010年至2012年作为产品经理负责阿里巴巴集团旗下一淘网站；于2000年至2010年负责惠普日本企业级搜索引擎产品设计研发。陈航于2024年获得清华大学工商管理硕士学位。</p>\n  <p>上述公告还显示，陈航作为非执行董事的薪酬将为每年人民币10万元，他将不会就担任非执行董事出席会议而收取额外董事津贴或补助。（澎湃新闻）</p>\n  <p><strong>黄仁勋出售约4.6万股英伟达股票</strong></p>\n  <p>英伟达多名高管向美国SEC披露股票交易情况，包括CEO黄仁勋在内的5名高管合计出售近15万股公司股票。其中，黄仁勋出售约4.6万股，成交价约每股212美元。CFO科莱特·克雷斯（Colette Kress）除因缴税出售股票外，还通过此前设定的交易计划出售约3.5万股。（财联社）</p>\n  <h2>AI 最前沿</h2>\n  <p><strong>同声传译大模型Qwen3.8-LiveTranslate正式发布</strong></p>\n  <p>36氪获悉，据千问大模型消息，9月19日正式发布全新的同声传译大模型Qwen3.8-LiveTranslate，模型以Interleave架构重构实时同传，准确度、流畅度、简洁度全面提升，字均延迟（LAAL）从2.8秒降至2.3秒。</p>\n  <p><strong>华为：昇腾已跨过生态拐点，有能力有机会构建AI新生态</strong></p>\n  <p>9月19日，华为计算战略与业务发展部部长朱照生表示，昇腾已经跨越了生态的拐点，完全有能力、有机会在Agentic时代构建AI新生态。从社区来看，昇腾CANN开源社区月均活跃用户数超过5200人，自今年6月起成为国内活跃度最高的开源社区，社区非华为开发者数量超过华为开发者数量，目前日均新增合入代码超过3万行。模型层面，基于昇腾完成预训练的大语言模型和多模态模型已超过40个，昇腾成为国内唯一支持预训练的AI算力平台。生态层面，昇腾除自身开源CANN外，已接入PyTorch等主流开源框架。（21世纪经济报道）</p>\n  <p><strong>欧洲人士质疑美企提议放缓AI研发是“出于私利”</strong></p>\n  <p>欧洲科技企业和政府人士近期纷纷表态，质疑一些美国人工智能（AI）企业以安全为由提出放缓AI研发是“出于私利”，认为其真正目的是巩固自身优势并打压竞争者。近日，美国多名科技企业家呼吁放缓发展AI前沿技术。其中，Anthropic公司首席执行官达里奥·阿莫代伊在一篇文章中说，考虑到安全风险，AI企业需要放缓开发最先进模型的节奏。对于美国AI企业的提议，法国米斯特拉尔人工智能公司等欧洲AI企业表示反对。米斯特拉尔公司在一份声明中说：“部分行业头部企业正利用当下形势巩固市场地位，推动制定偏向自身、打压竞争者的监管规则。”瑞士质子公司首席运营官拉斐尔·奥方在巴黎的一场科技活动上评价美企提议时说：“这完全是出于私利，他们只想维持市场对自家服务的依赖。”德国AI初创企业黑森林实验室公司公共政策负责人本·布鲁克斯表示，用人为划定的门槛强行拉开大型AI企业和新入局者之间的差距，将抑制前沿领域的创新活力。德国达姆施塔特工业大学人工智能教授克里斯蒂安·克斯廷认为，由少数几家企业自行界定何为“危险AI”并自行挑选核查人员，“不是真正意义上的监管”。一些欧洲国家政府官员也表达了反对放缓AI研发的态度。法国经济与财政部长罗兰·莱斯屈尔对媒体说：“让身后所有竞争者放慢脚步，好保住自己第一名的位置，这里面的利己意图一目了然。”（新华社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>冯仑回应被限高</strong></p>\n  <p>9月18日晚间，针对被限制高消费的消息，昔日地产大佬冯仑在其微博回应称，此事因三亚万通与小股东之间的借款纠纷而起。他表示，该借款未经三亚万通任何权力机构决议，是小股东利用其控制的两家公司公章擅自操作所致。该案面临的被执行事项并不涉及冯仑的支付义务，冯仑已通过正常法律程序维护自身权益。</p>\n  <p>天眼查显示，近日，三亚万通健康开发管理有限公司新增一条限制消费令，案号为（2026）琼0108执2332号，申请人为润汉辉（海口）投资有限公司，执行法院为海南省海口市美兰区人民法院，限制消费对象为冯仑。被执行人信息显示，该案被执行人为三亚万通健康开发管理有限公司，执行标的42.58万元。（澎湃新闻）</p>\n  <p><strong>张雪机车发布五款车型，最贵卖13.8万元，张雪：国际品牌这个配置要卖150万，我们售价不到1/10</strong></p>\n  <p>2026中国摩博会期间，张雪机车亮相N7展馆。张雪机车同时举行新品发布会，五款车型同台首发，发布会由张雪机车创始人张雪主讲。此次发布的车型售价方面，600V售价27980元，27款500F售价30580元，820RR-RS售价138000元，820RR-RC售价128000元，820X售价46800-57800元。对于五款车型中售价最高的820RR-RS，张雪表示，13.8万元这个价格当然不便宜，但可能有些车友都知道，一些国际品牌给到这个配置的，要卖到150万元，“我们不到别人的1/10。”（新浪科技）</p>\n  <p><strong>贾国龙妻子张丽平将西贝直接持股全额质押</strong></p>\n  <p>9月19日晚间消息，据天眼查资料显示，9月2日，内蒙古西贝餐饮集团有限公司（以下简称“西贝餐饮集团”）新增1条股权出质信息，出质人为贾国龙妻子张丽平，质权人为中国工商银行股份有限公司呼和浩特如意开发区支行，出质股权数额为540.0005万元，状态为有效。工商信息显示，张丽平直接持有西贝餐饮集团5.1959%股权，认缴出资540.0005万元，并任该公司董事。这意味着，张丽平已将其直接持有的西贝餐饮集团股权全部质押。</p>\n  <p>天眼查股权穿透资料显示，张丽平在西贝餐饮集团最终收益股份为13.3687%，除前述直接持有的股份外，张丽平还通过北京西贝企业管理有限公司及多家有限合伙企业间接持有西贝餐饮集团股份。截至发稿，西贝方面暂无回应。（新浪科技）</p>\n  <p><strong>下周43股面临解禁，4只解禁股上半年业绩扭亏</strong></p>\n  <p>下周将有43只股票解禁，按照最新收盘价计算，合计解禁市值151.28亿元。从解禁比例来看，下周面临解禁的个股中首药控股-U的解禁比例达56.96%，居首；友升股份、聚仁新材、星徽股份解禁比例均超20%。（人民财讯）</p>\n  <p><strong>第二十届亚洲运动会开幕</strong></p>\n  <p>第二十届亚洲运动会9月19日晚在日本名古屋开幕。（央视新闻）</p>\n  <p><strong>铁路12306持续识别遏制恶意抢票行为，维护公平售票环境</strong></p>\n  <p>自今年中秋国庆火车票开售以来，铁路12306已累计将711.7万笔交易放入慢速队列，对102.3万笔交易拒绝出票，共拒绝出票133.1万张票，有力遏制了恶意抢票行为。（界面新闻）</p>\n  <p><strong>沙特国家石油公司下月将不向欧洲买家交付原油</strong></p>\n  <p>当地时间9月18日，知情人士称，沙特国家石油公司——沙特阿美公司已告知至少两家欧洲炼油客户，在沙特通往红海的关键输油管道遭袭后，下个月沙特阿美公司将不会按照合同继续向它们交付原油。（央视新闻）</p>\n  <p><strong>曝小米18Fold开售7天销量近8万台</strong></p>\n  <p>据长期关注国内手机市场份额的数码博主@RD观测爆料，小米18 Fold开售7天的销量接近8万台，是小米历史首销7天销量最高的折叠屏手机。小米18 Fold 中折叠手机发布于9月7日，9月10日正式开售，售价10999元起。小米集团副总裁、小米集团CMO许斐9月8日发文透露，小米18 Fold中折叠手机卖爆了。小米集团高级副总裁、中国区总裁王晓雁分享的数据显示，小米18 Fold万元档旗舰首销大爆发，较上代大折叠同比增长310%。（IT之家）</p>\n  <p><strong>中信证券：极致散热登场，金刚石迎来产业化元年</strong></p>\n  <p>中信证券研报称，在AI芯片功耗陡峭攀升、传统金属散热逼近物理极限及金刚石制备技术工艺持续优化三重因素驱动下，金刚石散热行业有望迎来产业化元年的投资机遇。中信证券建议围绕率先商用交付和产能量产卡位显著两条主线布局：一、聚焦行业头部，率先实现散热片小批量供货、装备自研与产能规模领跑的企业有望充分受益于需求放量；二、关注工艺领先，具备大尺寸制造与全产业链能力，且加速扩产布局的相关企业。（财联社）</p>\n  <p><strong>新能源车险定价区间对标燃油车，车主续保保费要变</strong></p>\n  <p>新能源车险有望迎来新一轮定价规则调整。近日，从业内了解到，新能源商业车险自主定价系数区间预计调整为0.5―1.5，与燃油车保持一致。从多家产险公司了解到，2025年9月，新能源车险自主定价系数由0.65―1.35调整为0.6―1.4；2026年3月再次调整至0.55―1.45。此次市场预期调整至0.5―1.5，和燃油车一致。燃油车现行商业车险自主定价系数区间为0.5―1.5。这意味着险企在基准保费基础上，自主定价系数最低可至0.5、最高可至1.5，但最终保费还要叠加NCD等系数，并非最终保费相对基准保费只有5折到1.5倍这一个浮动空间。（中新经纬）</p>\n  <p><strong>首家新设外资公募获QDII资格，QDII额度年内两次扩容</strong></p>\n  <p>近日，贝莱德基金获批合格境内机构投资者（QDII）资格，成为首家获批该资格的新设外资公募机构。在今年QDII额度两度扩容、证券基金类机构获批额度首次突破千亿美元的背景下，外资公募参与跨境投资市场的步伐进一步加快。今年以来，QDII通道扩容节奏明显加快。国家外汇管理局3月末公布的数据显示，全市场QDII累计批准额度较2025年末增加53亿美元，达到1761.69亿美元。8月底，外汇局再度发放68.4亿美元QDII额度，涉及89家机构。截至8月末，全市场196家机构累计获批QDII额度升至1830.09亿美元。（券商中国）</p>\n  <p><strong>知情人士：Anthropic今年年化收入预计将超过1000亿美元，最快可能在未来几周公布IPO相关财务文件</strong></p>\n  <p>据知情人士透露，Anthropic今年年化收入预计将超过1000亿美元，较7月时的650亿美元大幅增长。寻求参与IPO的投资者正以这一快速增长的数据，支撑公司潜在2万亿美元估值。知情人士称，Anthropic最快可能在未来几周公布IPO相关财务文件，并有望最早于11月开始股票交易。不过，相关计划仍可能因投资者情绪和市场波动发生变化。（财联社）</p>\n  <p><strong>欧洲机构调整美债配置释放信号</strong></p>\n  <p>美国10年期国债收益率日前突破5%，为2007年以来最高水平。随着美国联邦政府债务总额8月突破40万亿美元，部分欧洲机构开始调整美债等资产配置，美债市场面临的压力进一步受到关注。挪威央行投资管理公司建议，将政府债券在其债券投资基准中的比重从70%降至50%。路透社测算，如果相关调整最终实施，该基金当前约2150亿美元的美国国债持仓可能减少近800亿美元，美国国债将成为此次调整中削减规模最大的单一政府债券品种。瑞士资产管理机构斯维斯坎托公司日前发布报告说，30年期美债收益率近期突破此前波动区间，该机构因此降低美国长期国债配置。英国布朗-希普利公司认为，美国财政部扩大长期国债回购虽能短暂支撑债券价格，但长期来看难以解决美国财政面临的根本性问题，因此短期内维持对美债的低配建议。（央视财经）</p>\n  <p><strong>SpaceX在纳斯达克100指数中的权重将达2.82%</strong></p>\n  <p>据报道，数据显示，随着纳斯达克100指数的季度调整于周一生效，SpaceX在该指数中的权重将达到2.82%，较目前约1.28%的权重显著提升。这一基于周五收盘价计算得出的最终数值，与该指数编制机构此前公布的暂定权重一致。（界面新闻）</p>\n  <p><strong>伊朗消息人士：美方称已准备好与伊朗进行谈判</strong></p>\n  <p>当地时间9月19日，从伊朗一位不愿透露姓名的高级别消息人士处获悉，卡塔尔和巴基斯坦作为调解方已告知伊朗，美国已准备好进行谈判并达成协议，且在推进这一进程方面态度认真。消息人士指出，就伊朗而言，只要美国重返伊斯兰堡谅解备忘录并履行其中条款，伊朗也准备在数日内恢复执行该备忘录。不过，伊朗要求获得切实且可信的保证，确保其不会再次遭受攻击。（央视新闻）</p>\n  <p><strong>OpenAI等四家企业遭起诉，被指控合谋呼吁管控AI发展节奏</strong></p>\n  <p>当地时间9月18日提交至联邦法院的一份民事诉讼显示，人工智能巨头Anthropic、OpenAI、SpaceXAI以及谷歌因近期呼吁协同放缓人工智能研发速度，被指控存在串通行为。诉状指出，Anthropic首席执行官达里奥·阿莫代伊本月早些时候公开呼吁“全行业协同”，以“管控人工智能前沿的发展节奏”，SpaceXAI负责人埃隆·马斯克、OpenAI首席执行官萨姆·奥尔特曼以及谷歌深度思维联合创始人德米斯·哈萨比斯均对此表示认同。依据美国反垄断法，上述行为属于竞争者之间达成的非法商业协议。代理四名原告、在加州北区法院提起本次诉讼的律师之一Nick Rowley表示，提起本案，是为了防止全球最具实力的营利性科技企业达成“利己的私下协议”，进而导致人工智能“迅速脱离人类掌控”。Rowley在一份声明中表示：“面对核战争这类足以造成物种灭绝的威胁，以及如今这项人类历史上面临的最大风险，人类理应拥有牢不可破的防护机制。法律规则应当由政府以透明、合法的方式制定，并对公众负责。”（新浪财经）</p>\n  <p><strong>据悉OpenAI到2030年这段时间料将烧钱2800亿美元</strong></p>\n  <p>据报道，OpenAI到2030年这段时间料将烧钱2800亿美元。预计2026-30年自由现金流（FCF）将为-2780亿美元，预定收入料将为8400亿美元；预计2030年营收为3500亿美元，而2026年料将为360亿美元。（财联社）</p>\n  <h2>酷产品</h2>\n  <p><strong>零跑A10 OTA于9月19日开始陆续推送</strong></p>\n  <p>据零跑汽车消息，零跑A10 OTA已于9月19日开始陆续推送。本次OTA新增功能包括360新增后视镜调节入口、记忆泊车车速设定及车位收藏功能、声纹守护、腾讯云游戏应用、芒果TV应用、车辆离线提醒。（界面新闻）</p>\n  <p><strong>整理丨</strong>娃娃菜</p>", "category": "tech", "published_at": "2026-09-19T23:54:09+00:00", "fetched_at": "2026-09-20T03:04:42.254121+00:00", "fingerprint": "c7850b25466a8724"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨拿下国内航空航天装配机器人近70%份额，国产大飞机制造设备供应商获数千万元融资", "url": "https://36kr.com/p/3991119011052291?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2800字，建议阅读8分钟</p>\n  </blockquote>\n  <p>硬氪获悉，航空航天装配机器人公司飞钛智造科技（绍兴）有限公司（下称“飞钛”）近日完成数千万元融资，由海愿资本、浙大控股领投，中富创业、金柯桐创、南通江海英才天使投资基金和天使投资人等跟投。</p>\n  <p>飞钛专注于航空航天智能制造领域，公司通过自研高精度具身智能机器人与智能装配产线整体交付方案，解决航空制造中大型结构件装配精度低、人工依赖度高及数据保密等核心痛点，目前已占据国内航空航天装配机器人近70%份额。</p>\n  <p>飞钛创始人章易镰博士，毕业于上海交通大学，曾任上海拓璞数控科技股份有限公司技术总监，拥有超15年航空航天机器人研发制造经验。公司核心创始团队均来自于上海交通大学、浙江大学、上海大学等知名院校，技术团队占比超60%。</p>\n  <p><strong>核心产品层面，飞钛是目前全球唯一具备航空航天装配全流程工艺能力的机器人公司。</strong>其机器人产品线覆盖制孔、铆接、涂胶、打磨及检测等所有关键工序。与传统昂贵的大型专用装备不同，飞钛采用小型化协作臂方案，占地面积小、移动灵活，产品性能对标欧美同类产品，价格约为其1/8-1/10，目前已成为C919批产一期制造设备的核心供应商。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_2f6af4c2fc1f416eb1cda29a5d53cf4c@5920579_oswg211823oswg927oswg522_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>配合这种硬件能力的，是公司提供的智能装配产线“交钥匙”工程，即根据客户零件及工艺要求，统筹规划从单机设备、信息化系统到物流系统的整线实施。目前，公司已交付多个国家级重点项目，客户覆盖中国商飞、航空工业、中国航发、航天科工等头部企业。</p>\n  <p>支撑上述产品落地的，是飞钛在精度控制、机器视觉、工艺仿真、生产管理以及轻量化具身智能模型等方面形成的技术能力。</p>\n  <p>精度控制是航空航天装配机器人的核心门槛之一。章易镰介绍，库卡、ABB等传统工业机器人精度一般在0.8-1毫米，而航空装配部分工艺的精度要求在0.5毫米以内。对此，飞钛自研底层控制算法，对机器人旋转关节进行高精度改造，并结合机器人形变补偿算法，将本体控制精度提升至±0.25毫米，处于全球第一梯队。</p>\n  <p>针对航空薄壁件在加工过程中容易发生形变的问题，飞钛开发了面向航空制造的机器视觉技术。系统能够通过视觉识别临时基准钉，并动态调整加工轨迹，使孔位保持在骨架中心线；同时，通过识别产品基准点，计算机器人与产品之间的相对坐标关系，对AGV移动产生的定位误差进行补偿，从而保证加工精度。 &nbsp; &nbsp; &nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_f9316e3780154c35880b17d11446e328@5920579_oswg87045oswg962oswg464_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>软件侧，公司拥有多年积累的自研工艺仿真与人机交互软件及工艺数据库，支持AR/VR引导及数字孪生系统。此外，公司全自研的四维生产管理与质量管控系统在三维空间基础上增加时间轴，可实现生产过程的可追溯与“倒放”检索，并结合机器学习技术对海量质量数据进行风险预判。据介绍，这套系统能够大幅缩短航空航天领域质量检验流程，而质量检验目前约占整个生产过程时间的40%。</p>\n  <p><strong>与此同时，为进一步降低具身智能机器人在航空航天装配场景中的应用成本，飞钛开发了LHVA（Lightweight Hierarchical Vision-Action Model）轻量化模型。</strong></p>\n  <p>章易镰认为，现有具身机器人VLA模型通常需要大量样本和较高算力，对航空航天这类高价值、低容错场景并不完全适用。一方面，现有模型往往需要同时使用视觉图像、语言指令和机器人关节数据进行训练，数据规模较大；另一方面，航空航天客户存在较高的数据保密要求，需要使用国产化算力硬件和操作系统，对模型的算力效率提出了更高要求。</p>\n  <p>因此，飞钛基于航空航天产线特点开发了分层轻量化模型LHVA。模型通过线激光采集少量点云数据作为特征样本，将产品轮廓特征与工具位姿信息进行编码，大幅降低训练数据量；同时不直接训练机器人关节运动，而是针对具体工艺学习加工轨迹，再结合经典运动学算法执行，从而兼顾模型效率与动作精度。</p>\n  <p>该模型支持客户现场采集数据自行训练，“通用机器人+轻量化模型”的方式，有望进一步降低航空装配设备的成本。据介绍，公司已经成交了一套搭载该模型的“机器狗+机械臂”订单，这是航空装配领域的首个具身智能订单。</p>\n  <p>从市场空间来看，2024年全球航空航天装配机器人市场规模超过240亿元，国内市场规模约62亿元，中国市场CAGR达到17.9%，高于全球14.2%的平均增速。随着航空工业对自动化率要求不断提升，飞钛有望通过标准化机器人产品和产线能力，实现制造方案的大规模复制。公司预计，其2026年订单额将超过1.5亿元，营收超过1亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_97802520e5af4cf6a4918f035e02099d@5920579_oswg938285oswg922oswg669_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>航空之外，飞钛也开始布局商业航天制造。面对火箭、卫星等产品制造需求增长，公司正在探索火箭及卫星部件的标准化生产，并将航空航天装配机器人和数智化产线规划建设能力向商业航天延伸。</p>\n  <p><strong>以下为硬氪与飞钛创始人章易镰交流节选：</strong></p>\n  <p><strong>硬氪：航空领域结构件普遍较大，公司机器人产品主打“小型化”有何考量？</strong></p>\n  <p><strong>章易镰：</strong>过去做飞机、火箭零部件加工，用的都是大型专用机床，设备需要跟着产品尺寸走，一台设备就要几千万元。后来开始用机器人替代，但为了覆盖大型部件，仍然需要增加立柱、升降平台和AGV移动底盘，整套设备下来可能有十几吨重，进口设备要三四千万元，国产化后也要一千多万元。</p>\n  <p>我们现在走的是另一条路线，做小型化的移动机器人。我们的机器人本体重量只有40公斤，末端工具约10公斤，占地面积1米×1米，价格大约是原来大型设备的十分之一。它的臂展比人长、负载也比人大，可以替代人工完成装配，还可以通过多台机器人协同作业。</p>\n  <p>过去大型设备移动不方便、价格又高，所以自动化通常只能覆盖约10%的工序，我们瞄准的其实是过去90%依靠人工完成的市场，这部分需求量非常大。小型化机器人一台可以顶两三个人，按照现在的设备价格计算，两年左右就能收回投资成本，大幅提高了制造商的投资回报率。</p>\n  <p><strong>硬氪：为什么要进一步做具身智能模型？</strong></p>\n  <p><strong>章易镰：</strong>做具身模型和我们的发展路径有关。我们现在做的通用设备，可能一百多万元一台。未来，我们希望用通用机器人搭载自己的轻量化模型，让客户能够自己采集数据、自己训练。在通用机器人本体上搭载模型之后，设备成本还可以进一步下降。目前这个模型平台已经开发出来，并且已经成交了一套“机器狗+机械臂”的具身智能设备，这是整个航空领域的第一个具身智能订单。</p>\n  <p><strong>硬氪：LHVA模型针对航空航天装配做了哪些适应性设计？</strong></p>\n  <p><strong>章易镰：</strong>现在的VLA类模型一般会把视觉图像、语言指令和机器人关节数据放在一起训练，样本量非常大，而且机器人本体和视觉系统产生的误差也会不断迭代进去，最终动作准确率可能只有30%-40%，这种方式没办法直接用于我们的行业。另外，航空航天客户有数据保密要求，只能使用国产化计算机和操作系统，不能使用英伟达GPU，算力相对有限。</p>\n  <p>所以我们做了分层轻量化模型LHVA，把语言部分去掉，采用分层训练。训练样本也非常小，我们用线激光采集少量点云数据，只提取几个产品轮廓特征，再加上工具位姿的6个坐标值，一个样本只有几KB。比如人工进行涂胶时，可以在现场采集数据、现场训练，国产硬件就可以运行。</p>\n  <p>同时，我们不训练机器人的关节数据，而是训练工艺轨迹。也就是说，针对不同的产品特征，学习应该采用什么样的涂胶方式，最终得到工艺路径，再通过经典运动学算法执行。这样既可以降低模型训练的数据量和算力要求，也能保证轨迹执行的精度和可靠性。</p>", "category": "tech", "published_at": "2026-09-20T02:18:08+00:00", "fetched_at": "2026-09-20T03:04:42.254117+00:00", "fingerprint": "77ec1114daed120b"}, {"source": "36氪 - 最新文章", "title": "从智能硬件到宠物数字生命体，这家公司正在构建AI驱动的宠物智能生态｜36氪首发", "url": "https://36kr.com/p/3991141712903171?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，宠物智能科技品牌Moonback近日完成数千万元首轮融资，投资机构为AI上市公司。本轮融资将主要用于AI算法、研发和市场团队建设。</p>\n  <p>宠物经济在全球范围内持续增长。</p>\n  <p>美国宠物用品协会（APPA）数据显示，2025年美国宠物行业消费额达到1580亿美元，同比增长3.7%，预计2026年进一步增至1650亿美元；2025年，美国约有9500万户家庭至少饲养一只宠物。</p>\n  <p>过去，宠物智能硬件的主要功能仍集中在自动喂食、自动清洁、定位和远程看护。而随着AI与多模态感知技术的发展，宠物智能硬件有望从“满足日常需求”进一步走向“理解宠物状态”，健康管理也成为新的产品探索方向。</p>\n  <p>过去一年，Moonback海外业务营收已达近亿元人民币，且不断加大AI方向投入，将产品重心转向宠物智能生态构建。</p>\n  <p>转向背后，是Moonback创始人兼CEO Kevin对养宠场景痛点的发现。</p>\n  <p>\"宠物是唯一一个当事人永远无法自述的健康场景，\"Moonback创始人Kevin表示，\"结合我自己多年的养宠经验，家长不是不关心，是没有办法知道。一次活动量下降本身可能没有意义，但如果能和这只宠物过去数周、数月的睡眠、活动与行为放在一起看，就可能提前发现值得关注的信号。问题在于，现在没有一个地方能把这些放在一起。\"</p>\n  <p>相比过去用单一设备记录某个动作，Moonback希望同时获得宠物的运动、心率、体温、睡眠、呼吸、排泄和行为数据，再由AI结合长期数据进行分析，监测健康情况。</p>\n  <p>由于宠物犬和宠物猫的生活习惯各有不同，Moonback也设计了不同的产品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_2407edae690a41beb80732cc078f3a1a@5836910_oswg895197oswg900oswg506_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智能胸背</p>\n  <p>对于宠物犬，Moonback将推出一款智能胸背，在GPS定位、虚拟电子围栏之外，加入运动、体温、心率等身体参数监测，并通过Agent为用户提供健康趋势解读和风险提示。</p>\n  <p>相比智能项圈，胸背也是一个更贴近狗既有习惯的载体。</p>\n  <p>Kevin告诉36氪，团队此前也考虑过项圈，但整机重量会集中在颈部，长期佩戴舒适度较低。而目前这款智能胸背更适合宠物犬佩戴且续航可做到10—15天。</p>\n  <p>智能胸背主要覆盖户外场景，对于室内场景，Moonback则设计了一款AI睡眠窝垫。</p>\n  <p>睡眠窝垫搭载毫米波雷达等传感方式，在宠物犬睡眠时记录静息心率、呼吸频率、抓挠行为和睡眠时长等指标。Moonback也关注中老年犬和短鼻犬等群体，这类型宠物犬心脏和呼吸问题早期症状并不明显，而夜间长时间睡眠提供了一个相对稳定的数据采集场景。</p>\n  <p>在Moonback的规划里，智能胸背和睡眠窝垫分别覆盖户外与室内，两类数据需要再进行交叉分析。</p>\n  <p>“宠物的健康状态并不能通过单一指标或一次数据变化进行判断”Kevin表示，还需要结合心率、睡眠以及徘徊、焦躁等行为表现，并参考长期数据趋势，综合分析其状态变化。。</p>\n  <p>对于宠物猫的智能健康检测产品，数据入口则更多依赖视觉。</p>\n  <p>宠物猫长期生活在室内，活动位置也更加分散。Moonback通过开发AI摄像头，覆盖进食、饮水、睡眠和排泄等高频场景。</p>\n  <p>例如在猫砂盆附近，摄像头可以记录猫排便时排泄物的颜色、形态和干硬程度，再和长期历史数据进行比较；放在进食区和睡眠区域，则可以记录饮食和行为变化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_fea15285ee334f2092a78ca7aeb8084b@5836910_oswg75130oswg900oswg506_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI睡眠窝垫</p>\n  <p>从智能胸背、AI窝垫到摄像头，Moonback想做的并不是单纯增加硬件SKU，而是增加观察宠物的“维度”。</p>\n  <p>自2024年底起，Moonback已经积累数十万份涉及宠物行为、生理数据和声音的样本，并开始与宠物医院、高校合作补充临床数据。</p>\n  <p>同时，Moonback正在通过AI Agent输出健康报告、异常提醒和养宠建议，并逐步形成单只宠物的长期数字档案。相比继续扩充硬件品类，Moonback更希望验证的是：多种硬件持续获取的数据，最终转化为对宠物身体和情绪更有效的判断。</p>\n  <h3><strong>CEO对谈</strong></h3>\n  <p><strong>硬氪：现在很多硬件公司都在讲AI，你觉得宠物真正需要AI解决什么问题？</strong></p>\n  <p><strong>Kevin：</strong>Moonback要做的是通过硬件+AI，帮助每一只毛孩子表达自己的健康和情绪，帮助宠物家长更好理解自己的毛孩子，为宠物家长和毛孩子提供一个真正能解决养宠问题的社区和平台</p>\n  <p>小孩会通过哭喊、语言等方式表达个人状况和诉求，但是宠物并不会告诉你健康和情绪问题。特别是进入中老年后，很多疾病和情绪问题都会逐渐显现。</p>\n  <p>所以我们需要通过不同设备采集它的身体和行为数据。不能只看单一数据，包括它在家里是否徘徊、焦躁，都要结合起来。</p>\n  <p><strong>硬氪：宠物医疗的数据基础远没有人类医疗成熟，你觉得这个赛道真正的门槛在哪里？</strong></p>\n  <p><strong>Kevin：</strong>技术能力是进入这个领域的基础，但真正形成长期差异的，可能还是数据和场景积累。</p>\n  <p>Moonback过去一年多一直在做这件事，目前已经沉淀了数十万份宠物相关数据。以宠物语言理解为例，AI不能只知道“它叫了一声”，还需要知道它为什么在这个时间、这个环境下叫，以及叫之前和之后发生了什么。这意味着，宠物AI需要的不只是更大的模型，还需要大量来自真实生活场景的多模态数据，以及长期的数据积累。</p>", "category": "tech", "published_at": "2026-09-20T02:39:43+00:00", "fetched_at": "2026-09-20T03:04:42.254112+00:00", "fingerprint": "9b3b9c8aff003137"}, {"source": "36氪 - 最新文章", "title": "主题演讲：掌阅 · AI短剧出海｜36氪2026 East Forward 出海大会", "url": "https://36kr.com/p/3991133875616771?f=rss", "summary": "<p>2026年，中国企业出海正在从“寻找增量”，走向更长期的全球经营。9月17日，以“潮起之时，靠岸相见”为主题的2026 East Forward第二届·36氪出海大会在上海举行。来自消费、科技、制造等领域的出海企业、投资机构，以及全球化服务商汇聚现场，围绕本地化经营、用户洞察、供应链、合规、渠道与全球组织等现实问题展开讨论。当“走出去”已不再是少数选择，企业需要面对真正的问题：如何在海外市场活下来、扎下去，把一次市场突破变成持续经营，并逐步建立属于自己的全球竞争力。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_67fdd12b240e48b3bb625a4cdf377d0b@6301044_oswg72588oswg1265oswg841_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>演讲人：掌阅科技CEO 孙凯</strong></p>\n  <p><strong>孙凯：</strong>大家好！先做一下自我介绍，我叫孙凯，来自掌阅，今天想跟大家聊的话题是AI在C端落地、AI内容领域落地这些比较热的话题。过去一年，尤其是过去半年，短剧、漫剧已经成为内容创作领域发展最迅猛的赛道之一。</p>\n  <p>AI大模型在不同行业的落地都在尝试，但真正找到了商业闭环、PMF的也不多，Coding、搜索算一个，短剧也算一个。我的分享更多的还是站在掌阅这家公司的角度，去谈我们怎么看待这个业务，我们怎么做这个业务，以及我们在做业务的��程中自我认知的修正。</p>\n  <p>首先介绍一下掌阅的短剧业务。今年来看，这项业务依然保持着比较快的增长。掌阅过去是一家以阅读和IP经营为主业的公司，大约在2017年登陆主板，上市之后一直深耕电子阅读和IP领域。短剧业务大约从2023年开始起步，每年的增长率都比较高。到2026年，也就是今年年初，我们开始围绕这项业务加入AI赋能，主要方式是将视频大模型接入短剧的生产过程。在这一趋势下，AI赋能已经成为业务保持高速增长的重要因素。</p>\n  <p>在做这项业务之前，掌阅其实有过一些基础判断。我们当时认为，既然手里有这么多IP，只要通过大模型、AI把它们转化成短剧、漫剧，应该就能获得不错的收益。事实证明，事情并没有那么容易，甚至这个判断本身就是错的。</p>\n  <p>第二，我们认为中国网民数量已经很大，但全球还有60亿用户，只要把这些内容翻译出去，可能同样能够获得不错的收益。事实证明，这件事也没有那么容易，这个判断同样是错的。</p>\n  <p>第三，我们曾经认为，短剧、漫剧市场可能会经历一段比较长的红利期，让每一个参与其中的创作者都能从中受益。事实证明，这个判断可能也是错的。</p>\n  <p>接下来，我想和大家分享为什么这些认知发生了变化，以及为什么我们在推进AI短剧出海、形成自己的业务线之后，仍然推出了泡漫（PopoMint）这款产品，也借此把刚才提到的几个认知做一个简单梳理。</p>\n  <p>接下来的分享我可能分三个维度去看，我认为我们做业务、做经营，这个市场上的竞争者如果都是在共识状态下竞合，可能是零和博弈，无非就是大家拼效率和精细化运营。但如果说我们在这里能够让大家看到一些非共识的话，可能它意味着一些机会。</p>\n  <p>第一个维度是内容创作。第一个问题是，AI短剧是不是传统短剧的一个分支？我们过去认为，可能只是生产成本更低。但现在我们发现，它不是。我的第一个观点是：AI短剧不是传统短剧的分支，甚至也不是传统短剧的简单衍生。它的名字里虽然有“短剧”两个字，但我认为不应该继续沿用传统短剧业务的方式去理解它。</p>\n  <p>第二个问题是，内容创作完成以后，流量端和商业化端的利润应该如何分配？成本下降之后，是不是大多数，甚至所有创作者都能够从降本中获益？后来我们发现也不是。随着供给越来越丰富，利润反而会进一步集中，并向流量端倾斜。在这个过程中，我们也交了不少学费。</p>\n  <p>第三个问题是，在国内生产了大量内容以后，是不是只要把它翻译好、推向海外、交付给全球用户，就可以完整复刻国内的成功路径？事实证明也不是。所以最后的结论是：生产方式变了，利润分配机制和内容创作逻辑都需要重新审视。</p>\n  <p>然而，AI短剧不是传统短剧的分支，我们应该怎样看待它？首先看成本变化。基本上在过去三个月里，AI短剧的平均生产成本下降了75%，从2000元左右的水平下降到几百元。当然，我这里说的是平均值，不同市场、不同题材之间可能会略有差异。</p>\n  <p>伴随着成本大幅下降，供给也出现了非常明显的增长。过去半年，供给量大约增长了300%。目前在中国大陆地区，每月大约能上新七万多部短剧，折合每天两千多部。为什么我说它可能已经不是传统短剧的同一种业务？因为这个数字大致相当于过去真人实拍短剧一个月的上新数量。也就是说，过去一个月产生的供给，现在一天就能够完成。</p>\n  <p>在内容创作过程中，还有一个无法忽视的趋势，就是视频大模型正在对内容创作带来非常大的变化。</p>\n  <p>如果回看过去半年，视频大模型大致可以分成两类。一类是SOTA模型，主要负责提高能力上限。它带给创作者的可能性已经不再局限于做好一部短剧，我们现在看到，它正在进一步渗透到广告、影视，未来甚至可能进入游戏、VR等不同内容创作领域，这个上限正在逐步被打开。这是SOTA模型或者旗舰模型带来的新可能。与此同时，一些优秀的开源模型也能够以更低的成本，实现比较好的质量交付和画质重绘。低价格进一步降低了创作门槛，也吸引了更多创作者进入。</p>\n  <p>所以，我们会从两个方向来看这件事：一方面，SOTA模型正在打开新的行业边界；另一方面，更低的成本正在吸引更多创作者进入。</p>\n  <p>当这两个因素同时发生时，我们大致可以得出一个判断：在视频重塑内容创作这件事上，短剧绝不是最后一站；今天涌入的这些创作者，也绝不是最终形态，可能仅仅只是开始。</p>\n  <p>有了这么多创作者进入，也有了越来越多跨行业的内容作品，利润到底会如何分配？成本下降之后，是不是创作者就能够普遍获得更多利润？答案同样是否定的。</p>\n  <p>相比原来的真人短剧和其他混合形态短剧，AI短剧的“跑出率”在半年时间内已经下降到原来的十分之一，甚至更低。为什么会出现这样的现象？后面我会进一步解释。</p>\n  <p>这里可以先抛出一个判断：AI确实降低了创作门槛，也让大量创作者进入，但爆款反而会更加集中。最终能够获得创作者端利润分配的，依然是那些真正能够用好IP、讲好故事的创作者。</p>\n  <p>但这也并不完全是坏消息。虽然单部内容赚钱的难度变大了，但整个行业仍然在持续增长。去年overall加起来的市场规模应该已经破千，今年大概率还会进一步增长。海外市场也是类似的趋势，month over month（月环比）的整体增长一直保持在双位数。今年以来的六个月，无论是海外短剧市场的下载量还是商业化收入，我们都观察到一个现象：供给增加之后，市场并没有只是在重新分配原有的收入和利润，而是整个市场本身仍然在快速扩张。因此，我们形成了一个大致判断：短剧可能是AI验证内容创作的第一站，而且这个需求已经成立，商业化闭环也已经形成。</p>\n  <p>但我们认为，AI短剧的创作者生态其实才刚刚开始。这个时候，我们可以通过“后视镜”看一看2016年发生了什么。2016年有一个APP大家一定都知道，就是抖音。那个时候，大家刚刚开始习惯用手机，而不是专业摄像机完成内容创作，去记录日常生活、分享个人体验。内容创作对专业能力的要求出现了几何级下降，这和今天用AI创作一个故事，而不再一定要组建一个线下剧组、把所有人聚在一起拍摄，其实非常相似。</p>\n  <p>从2016年到2025年，短视频行业发生了什么？用户覆盖已经接近整个网民规模的上限，大约11亿人；创作者和MCN数量大约增长了60倍。大量创作者涌入之后，又衍生出非常繁荣的商业生态，包括电商、直播电商、兴趣电商等。2016年时，直播电商几乎还不是一个独立赛道，而今天整个市场加起来大约已经达到6万亿元。这就是大的趋势。如果看今天AI对短剧的改变，我会认为此时此刻恰如彼时彼刻。2016年，大量创作者因为一部手机进入内容行业，可以分享自己的生活经验、好玩的梗、有意思的片段；而今天，AI带来的成本下降和SOTA模型能力提升，同样正在吸引大量新创作者进入，两者有异曲同工之处。</p>\n  <p>再来看出海。这一轮的出海速度比2016年那一轮快得多。今年上半年，几大海外流量平台都陆续向短剧打开了流量入口。YouTube Shorts的日均观看量已经超过2000亿；Meta目前的相关数据可能已经不只是翻倍，而是在持续快速增长；TikTok更不用说，它的短视频产品形态与抖音非常接近，在承接短剧内容和商业化方面也具备天然优势。</p>\n  <p>因为国内供给量已经非常大，TikTok上的短剧上新数据也非常惊人，每周上新数量都在不断刷新纪录。</p>\n  <p>在这样的背景下，创作端虽然越来越“卷”，但平台依然需要好内容。掌阅在这个过程中已经逐步跑通了从IP到短剧、从短剧到AI短剧，再从AI短剧到海外AI短剧的经营链路。我们也在思考，能不能把这一套经营方法和能力进一步开放给更多创作者。</p>\n  <p>我前面提到，AI短剧和真人短剧并不是完全相同的业务。比如中国短剧、译制剧和本土剧所适配的区域可能并不一样，大致可以形成四个象限。这个判断在我们真正做业务之前和之后发生了很大的变化，当然也意味着我们为此交了不少学费。</p>\n  <p>在内容适配过程中，还有两个因素需要放在一起看：一个内容进入海外市场以后，到底应该让用户付费观看，还是像中国网民已经习惯的模式一样，通过免费观看、广告变现来完成商业化？</p>\n  <p>从整体下载数据来看，每100个下载中，大约只有8%来自美国，但32%的收入来自美国。而目前投放的产品中，大多数仍然以付费模式为主。这些判断都是我们希望拿出来和更多创作者分享的真实业务经验。</p>\n  <p>正是因为这些领域的迁移，以及一个个“非共识”不断被验证或者证伪，我们才决定开放泡漫创作者赋能平台。</p>\n  <p>我们的初衷，是希望把掌阅长期做内容的经验、利用AI赋能内容创作的经验，以及内容出海的经验，通过泡漫这款产品开放给更多创作者。这些创作者未必只是in-house团队，也包括外部优秀创作者、优秀MCN机构等。我们希望大家真正能够用好这个产品，不只是做出一个作品、完成一部短剧，而是真正通过它赚到钱。</p>\n  <p>这个领域正在形成一个已经初具规模的交易网络，它不仅能够帮助创作者完成自己的好作品，更重要的是，好的生意应该能够惠及全球创作者。</p>\n  <p>最后，我想用一个古籍里的比喻来分享我们现在看待这件事的视角。大家可能更熟悉“龙门”，但我今天想讲的是“孟门”。孟门位于黄河之上，在龙门尚未疏通之前，它是第一道关口。龙门还没有被大禹治水疏通时，孟门是洪水四溢、非常混乱的角斗场；而一旦孟门打开，后面还有更长的道路要走，也意味着这股趋势真正形成了。</p>\n  <p>我认为，在AI赋能创作者和内容创作的过程中，短剧就是第一道关口。而掌阅给这个市场的答卷是泡漫。短剧是AI赋能内容创作的第一站，泡漫也是我们服务创作者的第一站。中国的市场才刚刚开始，海外的机会也在同步打开。2026年的短剧恰如2016年的短视频，市场空间才刚刚打开。未来还会有更多内容形态被AI重新塑造，包括更精品的内容、更宏大的叙事、更强交互性的内容形态，以及更加沉浸的用户体验。AI都会为这些内容带来新的可能。站在掌阅的角度，我们特别希望能够把自己已经走通的生意，转化成全球创作者的机会。</p>\n  <p>也欢迎在场的广告主、工具方、创作者，以及全球本地化经营伙伴，与泡漫一起参与这个赋能过程。</p>\n  <p>我认为，在今天看待AI这件事情时，可以用一句话来概括：孟门既开，万流向海。</p>\n  <p>感谢大家！</p>", "category": "tech", "published_at": "2026-09-20T02:39:46+00:00", "fetched_at": "2026-09-20T03:04:42.254106+00:00", "fingerprint": "d50695e401b5fd97"}, {"source": "36氪 - 最新文章", "title": "主题演讲：从“走出去”到“活下来”｜36氪2026 East Forward 出海大会", "url": "https://36kr.com/p/3991158757440258?f=rss", "summary": "<p>2026年，中国企业出海正在从“寻找增量”，走向更长期的全球经营。9月17日，以“潮起之时，靠岸相见”为主题的2026 East Forward第二届·36氪出海大会在上海举行。来自消费、科技、制造等领域的出海企业、投资机构，以及全球化服务商汇聚现场，围绕本地化经营、用户洞察、供应链、合规、渠道与全球组织等现实问题展开讨论。当“走出去”已不再是少数选择，企业需要面对真正的问题：如何在海外市场活下来、扎下去，把一次市场突破变成持续经营，并逐步建立属于自己的全球竞争力。</p>\n  <p>以下对话，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260920/v2_a980a06eb7d84e26b4e61e5e5d49c4ae@6301044_oswg181834oswg1621oswg1080_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>滕斌圣 | 长江商学院战略学教授、战略研究副院长</strong></p>\n  <p><strong>滕斌圣：</strong>大家早上好！非常荣幸来到36氪2026出海大会，这个会恰逢其时，前几年企业家们都相信“不出海就出局”，很多人确实出去了，发现一出海就出事儿，成功率并没有大家所想得那么高，在风浪中，小船倾覆的概率是非常高的。</p>\n  <p>这当然也正常，在今天这样变化的世界里，几千公里之外蝴蝶扇动翅膀，我们这里可能就有一场风暴。今天早上大的新闻大家都看到了，三年来美国第一次加息了，也就是说大家翘首以盼很久的“靴子”终于落了下来，而且年底可能还会有加息的举动。但会不会引起资金外流、美元变强等宏观命题？眼下可能也没有那么清晰的答案，但每个人的算法因此都在做一些小小的调整，我们面对这个世界，在AI时代，需要不断判断变量之间如何排序、每一个变量的权重是多少，进而得出相应的结论。</p>\n  <p>出海在企业家的算法当中在过去几年显然是最优解之一，虽然它的风险也是相当之大。今天我想用20分钟的时间和大家简单分享一下我对于出海与对应的风险应对策略的简单思考，当然也是因为我最近刚好出了一本书《出海模式》，今天顺便和大家讲讲书里的一些内容。</p>\n  <p>总体来讲，“全球化已死”是过去几年的基本共识，但在学术界一般认为它并没有真正消亡，只是以另一种面貌出现，所以倾向于把它叫“全球化2.0”，但它并不只是换了一副面具，而是整体逻辑都发生了变化，从四方面来看：主导模式、中心—边缘关系、驱动因素、价值诉求，2.0和1.0已经很不一样，就好像特朗普2.0和特朗普1.0区别也很大，是一个道理。</p>\n  <p>我就挑一点来讲，原来所谓的“雁型理论”，头雁不断转移，因为大家要转换、引领，这样的模式可能已经被打破了，头雁也需要制造业回流。当水流变乱的情况下，怎么样在乱中取胜？我经常说一个观点，特朗普打桌球时，是一杆把中间的球全部打散，原来可能比较精细的一颗一颗地打，现在是一场乱局，我们的位置到底在哪里？跟着浪潮走的话，风险也不断在叠加。</p>\n  <p>比方说我有一位做光伏的学生，他们能够常年向美国供货，是因为他们相对比较早在疫情期间就在越南设厂，而中国的同行们被疫情所阻，没有办法跟进，因此他们几乎有三年的时间可以在美国市场占据相当大的市场份额。但他比较早就预见到，只要哪里崛起哪里就会受打压，所以越南市场随着越来越多中国光伏企业的进入，一定会成为“双反”的对象，所以他提早在印尼拿了1000亩的地，果然到了2022、2023年，越南就没有办法做了，他用了7个月时间把越南的产能快速转移到印尼，开始从印尼向美国供货，然后印尼也不能做了，现在把产能又转到埃及，埃及作为地缘政治相对中立的地区，应该能够持续更长时间。但是谁又知道呢？所以这位同学目前正在紧锣密鼓地布局直接在美国生产，既然哪里冒起来你就打压哪里，最终只能在你老家进行真正的生产活动了。这样的例子让我们看到，整个打法其实变化非常大。</p>\n  <p>贸易战又在这里扮演了重要的角色，起起落落、是否为限，这都让很多企业过了一把“过山车”，现在基本稳定下来，我们被加征了12.5%的关税，其他国家有的被补足到10%，有的被补足到12.5%，我们当然是相对待遇最差的，但也不比很多国家更差，还不错。因此，今年上半年的出口非常强劲，是整个经济最亮的亮点。</p>\n  <p>因此，这就说明如果一般的风浪，中国作为世界制造中心的持续力和韧性还是非常非常强的，按目前的贸易战，应该说还是完全可以承受得了的。</p>\n  <p>但是，我刚才举例也说明了，如果东南亚也同样受到更高关税的影响，各种各样“301调查”“双反”等等，那它作为“跳板”的作用就会下降。整体我们感到现在愿意把目光只聚焦在东南亚的企业在变少，包括印尼原来是中国企业在东南亚绕不过去的点，现在似乎情况也有一些变化，大家的功课还得再做，要进一步多元化。叠加风险还未尽，贸易的结构分化还会继续。</p>\n  <p>当然，现在像“打牌”一样，我相信大家都是掼蛋高手，有的时候对子也要拆开打，你必须打你的牌型来应对对方的牌型。在美国大打芯片这张牌的时候，我们当然是稀土这张牌，而贸易、关税是浮出水面的，整个结构短时期不会有任何变化。所以，中国企业在海外能够扮演的角色越来越丰富。</p>\n  <p>我们经常讲一个观点，穿一件马甲往往是不够了，因为你一眼会被认出来。为什么有那么多“生而全球化”，从第一天开始就注册在海外，既不用中国的数据，也不用其他的资源，这样“血统”如果就在海外的话，那它接下来很多资本运作、上市可能就有一些便利的条件，从Manus、SHEIN的上市、出售的案例里都看到了这样的趋势，企业现在要在初始时间点就要开始布局，所以大家要看得更长远一些，这和地缘政治的因素密不可分。</p>\n  <p>整体来讲，我们是重回枢纽，但整个结构已经发生了巨大的变化，原来我们是全球贸易天然的“腰”，打很多球都是在用腰发力，你的核心到底强不强是决定性的。我们作为世界没有第二选择的制造中心，我们的“腰”是非常强劲的。</p>\n  <p>现在链式、垂直的结构很大程度上被打破了，取而代之的是一个网状的结构，要在网状结构里占据中心位置，显然难度要大很多，所以在友岸贸易、近岸贸易、小院高墙等一系列的安排下，我们要用出海在这样一张全球化2.0的大网当中占据更加有利的位置，背后是用新质生产力来赋能，但前面需要中国公司冲在第一线来选这些“结构洞”，网状结构里的洞到底在哪里，哪些位置是最值得我们去占据的？因为每个洞的价值是完全不同的，这考验每个中国企业的判断力。</p>\n  <p>但是，从好的方面来讲，我们的机会比原来的链式结构要更大，原来你如果是果链（苹果）中的一环，你没有什么可选的，很大的利润已经被苹果拿走了，你只是跟它配套而已。但现在是中国企业为主能否打造出一些全球产业链，这是努力的方向。虽然也许拿不到像苹果这样比例的利润，但一旦主导权在我们手上，那我想这样的链条是可持续性非常强的。网状结构意味着没有一根链条可以排它，是多链平行往前，未来是这样的结构。</p>\n  <p>包括很多国家明知道自己不可能做出大模型来，也要做主权大模型，道理其实是一样的，自己总得有一块自留地在大波动的情况下能够有某种掌控，这是很多国家都想做的。</p>\n  <p>我几个月前带队在英国，英国在讨论怎么样让北英格兰&nbsp;、苏格兰，原来他们的工业重镇能够重振雄风，虽然这事会非常非常难，但现在是来自北方的人做首相，这意味着英国制造业在北方必须重新崛起，或者有更大的话语权，这和很多国家整体的规划都是一致的。</p>\n  <p>原来我们是“老三样”，后来变成“新三样”，现在是“新新三样”工业机器人、AI、创新医药，前沿也是不断在演变当中，而且好处在于老三样和新三样也没有丢，现在是几个球同时在空中运转、并驾齐驱，这就是全球化被打乱以后我们能够觅得一些新商机。</p>\n  <p>在我的这本书里提出了一个框架——“价值罗盘”，我们经常说用旧地图找不到新航道，要把握知道自己在往哪儿开，有的时候冰山在侧面，像泰坦尼克号那样不能让侧舷撞到冰山，哪怕正面撞都没问题，你的设计是承受得了的，不能让你的薄弱环节遭受这样的冲击。</p>\n  <p>因此要考虑五方面的问题：</p>\n  <p>1.进入路径。</p>\n  <p>2.靠什么样的核心竞争力（本色）立足？</p>\n  <p>3.怎么样用生态圈和当地形成更强的链接？</p>\n  <p>4.创新点到底在什么地方，有没有某种护城河？</p>\n  <p>5.合规，包括ESG，但最底层的合规能否做到？不然像SHEIN在法国被罚2亿欧元，已经相当于一季度全部的利润了，如果真的罚的话。这就说明对于出海企业来说，一旦合规方面出问题，那底线就被打破了。</p>\n  <p>从进入方式来讲，有贸易、合资、并购、绿地投资，这是一些主要的方式，绿地投资的比例是比较高的，但是在一些关键节点还是要用并购的方式才能进入，就像我刚才讲的那家光伏企业，之所以能够在美国成功立足，是因为早年花了42.5万美元超低价买了一个早就进入美国的中国品牌，是中国公司在运作的美国光伏品牌，有这样的切入点就让它能够持续去做美国市场，所以并购方法依然是很重要。</p>\n  <p>最后再讲一点，越来越多中国企业现在是Born Global（生而全球化），并不是简单的在中国做得很好，把中国好的生意移植到海外，越来越多企业的海外生意和中国生意有巨大区别，比方说在书里有一个案例叫“悸动烧仙草”，是上海本地长出来的公司，在中国做的是烧仙草，而在美国和英国主要做的是奶茶，因为海外消费者对于烧仙草产品相对来说接受有过程，必须用更适合本地市场，但又能发挥某些能力，因为毕竟做零售、做甜品还是有相通之处，虽然具体产品变了，但依然能发挥核心竞争力，这样的企业某种意义上就是天生全球化。</p>\n  <p>还有很多做机器人做AI的企业一开始瞄准的就是海外市场，这样他们的灵活性就更高，因为发挥的并不仅仅是国内的竞争力。</p>", "category": "tech", "published_at": "2026-09-20T03:01:54+00:00", "fetched_at": "2026-09-20T03:04:42.254092+00:00", "fingerprint": "be194d1bdd205bb8"}, {"source": "少数派", "title": "你的脸红是什么红：了解玫瑰痤疮", "url": "https://sspai.com/post/114641", "summary": "脸红发烫却没有小鹿乱撞：警惕玫瑰痤疮。<a href=\"https://sspai.com/post/114641\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-19T07:00:00+00:00", "fetched_at": "2026-09-20T03:04:40.787991+00:00", "fingerprint": "a997e8e9 ‘doom loop’ for the web", "url": "https://www.theverge.com/ai-artificial-intelligence/997633/openai-microsoft-chatgpt-ai-new-york-times-doom-loop-theft-google-zero", "summary": "Recently unsealed court documents in the New York Times' case against OpenAI and Microsoft are pretty damning. The companies' own documentation warned that it was starting a \"doom loop\" that would damage the web, characterized its scraping of data to train its models as the \"largest theft of labor in human history,\" and that it [&#8230;]", "category": "tech", "published_at": "2026-09-18T21:07:24+00:00", "fetched_at": "2026-09-19T02:52:22.736761+00:00", "fingerprint": "1bc0911d200ab4e3"}, {"source": "36氪 - 最新文章", "title": "理想开始卖技术：马赫芯片、碳化硅、增程器要外供｜36氪独家", "url": "https://36kr.com/p/3988488062630661?f=rss", "summary": "<p><strong>文&nbsp;|&nbsp;徐蔡钰&nbsp;</strong></p>\n  <p><strong>编辑&nbsp;|&nbsp;李勤 杨轩</strong></p>\n  <p>理想汽车，开始开放多项自研技术的对外合作，寻求更多收入来源。</p>\n  <p>36氪从多位产业人士处获悉后梳理，今年以来，理想汽车已经开启了多项核心技术的对外供应计划，而伴随业务拆分，部分业务也有引入外部资金的计划。</p>\n  <p>典型启动外供的业务有自研马赫芯片、碳化硅模组公司斯科半导体及增程器等。目前，马赫芯片、碳化硅模组等都已经成立独立的公司实体，寻求更多外部客户，斯科半导体也准备引入更多外部资金。</p>\n  <p>而其他的动力技术，如增程系统也向外释放出接纳外部客户的信息。但自研电池尚无计划，行业人士表示，“电池的定制化程度很高，外供难度太大。”</p>\n  <p>自研马赫芯片的业务独立和外供，已经有诸多信号。今年7月，理想为芯片业务注册了一家全资控股的新公司：芯创智核（上海）科技有限公司。</p>\n  <p>据36氪了解，理想高层也已经决议批准芯片业务分拆，与此同时，业务拓展等动作也在同步进行。消息人士透露，已经有具身智能公司与理想高层洽谈过，“后者明确推销了马赫芯片”，最终这些具身公司是否使用马赫芯片，可能取决于算法迁移难度。</p>\n  <p>马赫M100是理想第一颗量产的辅助驾驶芯片，单颗算力为1280TOPS，内存带宽达到273GB/s。理想曾公开表示，马赫M100的实际可用算力是英伟达Thor-U的3倍。</p>\n  <p>今年二季度以来，马赫M100芯片已跟随新款L9、L8、MEGA及新车型i9搭载上车。有理想人士透露，作为第一颗自研芯片，马赫的量产相当顺利，公司在芯片厂包了很多产线。</p>\n  <p>而相比马赫芯片外供更早的是，理想的碳化硅公司斯科半导体于年初开始独立运营，自负盈亏，公司也在多方寻求外部客源。</p>\n  <p>将自研技术拆分外供，在汽车行业里并不罕见。这是常用的降低资金投入压力，同时寻求更多市场空间和发展机会的做法。</p>\n  <p>只是这一次发生在了财务策略更加谨慎的理想汽车身上。</p>\n  <h3><strong>毛利率承压，理想也需要找活钱</strong></h3>\n  <p>理想并不缺账面现金，截至2026年二季度末，现金储备依然有875亿元，稳居新势力第一。但钱多，不等于没压力。理想同时扛着三件吞金的事：销量在等待回暖、毛利率正在修复，研发还在大幅增长下注。</p>\n  <p>2026年，理想汽车1–8月累计交付26.16万辆，同比微降0.6%。直到8月后，L6、新款MEGA和i8、i9的接连上市，销量才开始逐步回温。</p>\n  <p>2023年起，理想一直是最能赚钱的新势力品牌。但2026上半年，产品进入换代期，公司净亏损39.94亿元，而去年同期还盈利17.43亿元。毛利率也从19.4%跌到9.4%，离李想说过“15%–20%才健康”的线，还有一定差距。</p>\n  <p>在销量和利润双双承压的现在，理想为了确保长远竞争力，投入端还在加大。2026年二季度，理想已连续6个季度投入30亿量级的研发费用，而理想的季度经营现金流刚刚恢复单季转正。这大概就是理想开始转向对外找钱的直接动力。</p>\n  <p>蔚来其实走过相同的路。</p>\n  <p>2024年蔚来净亏损224亿元，创下历史峰值。同年，蔚来换电网络开始向第三方车企和能源公司开放。2025年，蔚来又把自研芯片业务拆成独立子公司安徽神玑技术，李斌公开表态“愿意向行业开放”。随后神玑频繁接触车企与机器人公司，并和爱芯元智成立合资公司。到2026年2月完成首轮22.57亿元融资，投后估值冲到百亿元上下。</p>\n  <p>不仅蔚来芯片分拆进展顺利，据36氪了解，曾经走到经营低谷的芯片公司辉羲智能也在具身智能热潮中接连斩获融资，估值快速拉升。</p>\n  <p>而理想的马赫芯片采用更贴合AI需求的数据流架构，自然也想在火热的具身智能大潮中，寻求新机会。</p>\n  <h3><strong>理想卖技术，有市场吗？</strong></h3>\n  <p>增程器，是理想较早投入自研的核心零部件。到2026年，理想已经推出第三代增程器，且实现了自研和自制。</p>\n  <p>从公开信息看，理想最新一代增程器系统（自研第三代增程器/平台）实现了百公里6.3升的低油耗，而且采用新一代自研自制电机，发电效率达到94.8%，并做到了3年保养周期。</p>\n  <p>行业人士向36氪分析，增程器的外供可能是早期规划了大量产能，外供有利于摊薄制造压力。今天，在中国市场正寻求转型的传统豪华品牌，可能是理想的目标客户群体。</p>\n  <p>碳化硅半导体，同样是理想早就进行自研的核心技术。2022年，理想汽车与湖南三安半导体共同成立合资公司斯科半导体。分工上，理想主导模块设计与整车适配，三安提供SiC芯片及衬底，而位于苏州的斯科半导体工厂则负责封装与测试。</p>\n  <p>有产业人士向36氪透露，理想碳化硅模组的核心优势在于其整车厂视角的整合能力。“理想的逻辑不是单纯堆砌半导体参数，而是让模组体积更小以为车内腾出空间，让效率直接服务于实际续航，就是理想比供应商更懂车企真正需要什么样的零件。”</p>\n  <p>然而，技术上的领先一般并不能顺畅转化为外供，其中一个掣肘，就是主机厂的身份。</p>\n  <p>为打破主机厂身份带来的信任壁垒，理想正在推动斯科\"去理想化\"，向真正的第三方供应商转型。</p>\n  <p>理想在斯科半导体的占股达到70%，接近斯科半导体的人士告诉36氪，斯科成立后，一直向理想汽车制造部汇报，但今年2月，斯科半导体已经成为一家独立公司，管理团队也转向斯科董事会汇报。</p>\n  <p>“以前斯科和理想是一个系统，现在斯科已经完成剥离”，知情人士告诉36氪。此外，斯科半导体正在资本市场积极寻求融资，并已启动IPO计划。斯科的节奏非常明确，快速引入外部资本，让股权结构趋向中立，从而降低其他车企采购时的信任门槛。</p>\n  <p>理理想自研马赫芯片业务的独立化路径，与斯科半导体类似。</p>\n  <p>2026年7月，理想注册了一家全资控股的新公司：芯创智核（上海）科技有限公司，经营范围包括集成电路芯片设计及服务、芯片及产品销售等，法定代表人为王扬。据36氪了解，王扬于2020年加入理想，现任理想汽车联席公司秘书，长期负责资本市场相关事务。</p>\n  <p>多位产业人士向36氪透露，理想芯片业务的外供并不算难，因为从理想出走的多家具身智能公司，都可以顺利接洽。</p>\n  <p>目前，从理想出走，创立的具身智能公司已有5家：前理想AI首席科学家陈伟创立斜跃智能，前理想CTO王凯创立至简动力，前理想智驾一号位朗咸朋参与创立昆仑行，前联席CTO夏中谱加入无界动力成为联合创始人，以及前智驾产品总监赵哲伦参与创立了维他动力。</p>\n  <p>对具身智能公司而言，理想自研的马赫M100的确有吸引力。这是一块专门为VLA和端侧大模型设计，和机器人目前的技术逻辑相似，适配难度较英伟达等芯片厂商小，对创业公司而言的确很有吸引力。</p>\n  <p>芯片、碳化硅业务的拆分节奏才刚起步，技术能力只是前提，能不能让买方信任其独立供应商的身份，会是当下急需解决的问题。</p>", "category": "tech", "published_at": "2026-09-18T06:31:55+00:00", "fetched_at": "2026-09-19T02:52:22.651305+00:00", "fingerprint": "f675df20c6934705"}, {"source": "36氪 - 最新文章", "title": "最前线｜日冕开物超级工站落地远图产线，POC验证成功率超99%", "url": "https://36kr.com/p/3988651090459399?f=rss", "summary": "<p>作者丨乔钰杰</p>\n  <p>编辑丨袁斯来</p>\n  <p>9月16日，专注物理世界基础模型和解决方案的公司日冕开物，与全球服务器制造龙头及AI基础设施全栈解决方案提供商广东远图未来科技有限公司（以下简称“远图”）在远图东莞智能制造基地举行合作超级工站POC暨联合实验室揭牌仪式。</p>\n  <p>双方宣布成立“远图×日冕工业具身智能联合实验室”，并现场展示日冕超级工站在远图ICT产线上的真机作业。据介绍，超级工站已于半个月前完成POC验证，成功率超过99%；现场演示中，仅用15分钟便完成了新物料的学习与作业切换。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260918/v2_3cd633ed2469425b9a7b709b9e8f682b@5920579_oswg4956547oswg2196oswg1440_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">超级工站执行ICT测试工作</p>\n  <p>此次合作，双方试图回答一个具体问题，即具身智能如何真正进入工业生产，而不仅停留在单点任务的技术验证阶段。</p>\n  <p>远图副总裁周才庆表示，随着AI服务器向多芯片集成、高功率供电和高密度散热方向演进，服务器制造呈现出订单品类多、单批次量小、迭代速度快等特点，对制造工艺和柔性生产能力提出了更高要求。</p>\n  <p>目前，服务器制造行业整体自动化率约30%，生产与测试环节占全流程约三分之二的工时，而每次产品换型往往意味着专属设备投入或产线改造。远图过去通过轻量化柔性智造，将整机交付周期压缩至48小时，但仅靠传统自动化和产线优化，仍难以应对快速变化的制造需求，制造模式本身需要一次代际升级。</p>\n  <p>日冕开物成立于今年3月，专注物理世界基础模型和解决方案，核心团队由四位清华博士组成，曾主导蔚来NWM1.0、华为ADS5.0世界模型，并交付行业首批具身机器人真机作业集群。公司提出具身原生LaMPA基础模型架构及递归加速进化体系（Physical RSI）。</p>\n  <p>超级工站是日冕开物推出的首款标准化产品，定位为面向柔性制造的新一代Physical AI生产工作站。其核心能力包括“一学就会”“触类旁通”和“超越人工”：新工序部署可从传统自动化的周、月级压缩至小时级现场真机强化学习；同时将生产过程中的失败案例转化为学习信号，持续更新模型，并在稳定性、一致性和效率上进一步优化。</p>\n  <p>支撑上述能力的底层技术，是日冕的Physical RSI（递归式加速进化）体系。其核心逻辑是让机器人在真实作业中持续获得反馈：当遇到未知场景时，系统自主发现认知缺口，更新世界模型、训练新策略并完成真机验证，经过验证的经验再沉淀回基座模型，并同步至机器人集群。</p>\n  <p>“联合实验室要解答的核心问题，是让机器人在不打搅生产的前提下，把设备接口、工艺衔接、异常处理这些复杂又现实的工业问题一个一个趟过去，沉淀成可复制的方法。所有题目从产线上来，所有成果回产线去验证。”日冕开物创始人兼CEO肖中阳在揭牌仪式上表示。</p>\n  <p>活动现场，双方联合展示了超级工站在ICT产线上的真机作业。ICT（在线测试）对位精度需控制在±0.05mm以内，同时对柔顺力控要求较高。除完成标准化作业外，超级工站还可识别位置偏移及混入物料。&nbsp;</p>\n  <p>换型环节，超级工站仅用15分钟便完成了新物料的学习与作业切换。作为对比，传统SMT产线一次换线通常需要2—4小时。这也是超级工站试图解决的核心问题之一——面对多品类、小批量、频繁迭代的制造需求，降低新物料、新工序的部署成本。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260918/v2_372390dafa4e4ba392c5543b50226ab0@5920579_oswg5935097oswg2190oswg1442_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">超级工站于远图ICT产线真机作业</p>\n  <p>双方计划以ICT工序为起点，逐步覆盖远图厂内更多工序，2027年实现百台级超级工站部署，2030年进一步迈向万台级集群应用。</p>", "category": "tech", "published_at": "2026-09-18T08:48:06+00:00", "fetched_at": "2026-09-19T02:52:22.651299+00:00", "fingerprint": "34d5904a21744c6c"}, {"source": "36氪 - 最新文章", "title": "关于产业未来，听听躬身入局的人怎么说｜2026产业未来大会精彩观点回顾", "url": "https://36kr.com/p/3988678225214466?f=rss", "summary": "<p>产业的未来，往往在成为共识之前，就已开始生长。每年，36氪都试着把目光再往前放一些：在技术突破的早期辨认产业机会，在资本流向的变化中观察增长逻辑，也持续追问，那些被寄予厚望的创新，究竟走到了哪一步？</p>\n  <p>2026年9月9日至10日，以“深水之上·共振新生”为主题的2026产业未来大会在北京亦庄·通明湖会展中心举行。两天的演讲与对谈，将这些追问带向更具体的现场：量子科技走出实验室，还要跨过哪些门槛？AI进入真实世界，如何兑现产业价值？国资与产业资本，又该如何陪伴一项技术穿越从突破到落地的漫长周期？从先进制造、新能源、半导体，到脑机接口、具身智能，我们关心技术能打开多大的想象空间，也关心谁在为这些想象铺路、验证、买单。</p>\n  <p>大会落幕，判断仍待时间检验。以下是我们从现场精选的嘉宾观点——其中有对趋势的预判，也有来自实践的答案。一起从这些思想切片中，辨认产业未来正在成形的轮廓。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260918/v2_bf1e6475154e4417b29c684363546e3d@6301044_oswg15776592oswg1460oswg22706_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-09-18T08:53:36+00:00", "fetched_at": "2026-09-19T02:52:22.651292+00:00", "fingerprint": "217bf290e4c515b6"}, {"source": "36氪 - 最新文章", "title": "HYROX道歉，「中产最爱赛事」何以走到今天？", "url": "https://36kr.com/p/3984230181010434?f=rss", "summary": "<p>文｜贺哲馨</p>\n  <p>编辑｜乔芊</p>\n  <p>想象一下，你每天雷打不动去健身房训练了四五个月，买下近千元门票，加上课时费、装备、交通和住宿，这笔账已经逼近五位数。今天你站在HYROX北京站的现场，只想要一件事：刷新个人最好成绩。</p>\n  <p>第一公里按配速完成，滑雪机没有掉链子，推完雪橇进入第三公里的直道时，你甚至超过了两名选手。也就是在这时候，你注意到前方那位选手的小腿上有污物正在往下淌，她失禁了，但她也没有要停下来的意思。</p>\n  <p>现场没有人喊停，理论上你有得选，因为规则手册里确实写着：当选手认为自己无法继续时，可以自行退出，但代价是将近半年的努力全泡汤。</p>\n  <p>你突然发现，这场被称为“中产新宠”的运动，既非单纯奖励强者，也并不像想象中那样热血澎湃。滤镜之下，它更像是一场连核心规则都尚未缝补完整，便急于在全球跑马圈地、快速变现的商业赛事。</p>\n  <h3>资本故事</h3>\n  <p>事件发生两天后，9月14日，HYROX联合创始人Moritz Fürste发文致歉：“我需要就近期在中国发生的事件，直接向大家做出回应。我向所有直接或间接受到影响的人道歉，也向所有认为我们没有妥善处理该事件的人道歉。”</p>\n  <p>短短一天之内，HYROX的态度发生了180度转变。此前，HYROX曾在海外社交平台发布官方声明，力挺涉事选手。至于事件主角，赛后曾删除“赢了就是赢了（A win is a win）”的争议贴文，但截至目前，仍未就污染赛道一事向其他选手公开道歉。</p>\n  <p>HYROX官方态度的转变，更像是迫于舆论压力的应对。</p>\n  <p>事件发生后，现场视频与照片迅速在中文及国际社交平台传播，赛事主办方也被拖入信任危机。有北京站选手指出，HYROX新发布的赛事规则中，“选手吐痰”会被严格处以2分钟罚时，但涉事选手造成大规模、重度公共卫生污染，裁判却没有要求其退赛。</p>\n  <p>这场公关危机之所以在短短几天内演变成一场舆论风暴，归根结底，是因为如今的HYROX实在太红了。</p>\n  <p>HYROX有多火？一组数据足够直观。全球每年完成马拉松的人数大约在110万至130万之间。2024年至2025年赛季，HYROX完赛人数约55万人；2025年至2026年赛季，这一数字进一步增长至150万人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_59c256acf4d94717aaa3285d8d2d7a6a@5922386_oswg197166oswg2400oswg1520_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：公开资料</p>\n  <p>这意味着，仅从参与人数来看，HYROX的全民化程度已经接近马拉松。而后者所覆盖的核心人群和外围消费群体，足以支撑一个百亿规模市场。HYROX的主办方自然不可能不心动。</p>\n  <p>简单回顾HYROX的发展史，你会发现，这是一场从诞生第一天起，就被精心设计、精准瞄准中产人群的商业赛事。</p>\n  <p>三位创始人中，一位是运动员，两位来自营销领域。他们试图解决的并不是“创造一项新运动”，而是一个消费现象：“52%的人说健身是他们的运动，可这项运动到底是什么？”</p>\n  <p>于是，三人设计出了“8趟1公里路跑，交替搭配8个功能性关卡”的赛制。整个比赛在室内完成，只计算总用时，成绩统一纳入全球排名体系。</p>\n  <p>2017年，第一场HYROX赛事在德国汉堡展览馆举办，当时仅有650人参赛。创始人曾透露，他们当时的目标是：“用20万欧元的预算，打造出看起来像200万欧元的高规格大场面”，以此吸引习惯高品质生活的城市中产。</p>\n  <p>进入亚洲市场后，HYROX最初的发展并不顺利，原因在于其品牌形象过于精英化。于是，主办方开始弱化个人组别的竞技属性，放大混双、四人接力以及企业组，将赛事包装成一种新的团建方式和中产社交工具。</p>\n  <p>这一策略收效明显。2024年，HYROX北京首场比赛仅有1700人参加；次年5月上海站，两场赛事参与人数突破万人，并成为社交平台热门话题，抖音相关内容播放量超过100亿次。</p>\n  <p>精准吸引高收入、高消费且高度重视健康生活方式的中产群体之后，随之而来的便是品牌赞助。</p>\n  <p>除了从诞生第一天起便冠名合作的PUMA，在国内HYROX赛事中，各类运动品牌、化妆品、营养品、可穿戴设备，甚至汽车品牌的Logo遍布赛场和参赛者胸前。一些外形亮眼的参赛者，赤裸的上半身被贴满品牌标识，甚至被戏称为“行走的广告牌”。</p>\n  <p>2025财年，HYROX营收约为1.35亿至1.4亿欧元。而随着全球市场，尤其是亚洲市场的快速扩张，CNBC预测，其2026年预期营收将翻倍至2.7亿美元。</p>\n  <p>就在此次事件发生前不久，HYROX创始人重新购回51%的股份，并与新加入的资方L Catterton共同推动赛事进一步扩大规模，提升全民化程度和商业化水平。</p>\n  <p>然而，这场资本狂欢的脚步，终究走得太快。</p>\n  <h3>谁来喊停？</h3>\n  <p>事件爆发初期，HYROX全球官方试图用“不可预见的突发状况”解释现场失误。他们在声明中辩称，针对精英选手的竞赛方案与大众赛事方案“产生了混淆”，导致规则适用和理解出现歧义，因此现场裁判未能及时干预。</p>\n  <p>倘若拆解HYROX的收入结构，便能看穿其“不敢喊停”的原因：这项赛事高度依赖选手报名费和门票收入，任何影响赛事正常进行、降低参赛体验甚至引发退赛的决定，都可能直接影响其商业模型的稳定运转。</p>\n  <p>我们可以将HYROX与城市马拉松进行比较。</p>\n  <p>以纽约马拉松为例，其最大的收入来源是商业赞助和社会捐赠，约5052万美元；大众报名费紧随其后，约4916万美元。两者几乎平分秋色。这意味着，纽约马拉松的办赛成本，有接近一半由第三方——企业赞助商、慈善机构以及捐赠者共同承担。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_56ab3689fef34ec4ac1f6673c503975e@5922386_oswg311448oswg2400oswg1520_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纽约马拉松与HYROX收入来源对比</p>\n  <p>而根据体育商业媒体SportsPro的拆解，HYROX的大众选手报名费和门票收入直接占据总营收的55%至65%，赞助收入约占15%，其余则来自周边授权和商品销售。《泰晤士报》给出的数据甚至更为极端：报名费收入占比高达九成。</p>\n  <p>澳大利亚财务机构SBO Financial测算，HYROX全球赛事毛利率高达80%，主办方甚至无需支付太多营销成本——因为渴望塑造自律人设的中产选手，会主动在社交媒体上成为赛事的“自来水”。</p>\n  <p><strong>HYROX创始人也曾透露，单场赛事只要约1500名选手报名，便可以实现盈亏平衡。&nbsp;</strong></p>\n  <p>此外，纽约马拉松主办方NYRR是非营利机构（全球多数顶级马拉松赛事组织方亦如此），其结余资金的大部分需要依法投入社区公益项目。 而HYROX在2025财年创造约1.33亿欧元收入，对应约3000万欧元EBITDA（税息折旧及摊销前利润），利润率达到23%。</p>\n  <p>毫无疑问，在一场非营利性的城市马拉松中喊停比赛，与在一个以盈利为目标的私营赛事中叫停比赛，背后的经济代价完全不同。</p>\n  <p>此次事件发生后，中文社交平台上还流传着另一种猜测：涉事选手身上的PUMA全球代言人身份，让赛事方投鼠忌器，不敢要求其退赛。</p>\n  <p>虽然这一猜测没有任何直接证据支撑，HYROX与PUMA也均未对此回应，但这条流言之所以能够在数小时内传播全网，并且几乎没有人认为荒谬——恰恰说明，大众对于“普通参与者为商业特权让步”的想象，已经成为HYROX最大的信任危机之一。</p>\n  <h3>余波未平</h3>\n  <p>36氪采访的多位运动行业人士曾指出，HYROX在装备功能要求上的“模糊性”，可能成为其进一步商业化的限制因素，“HYROX参赛者除了对鞋类有一定要求，在服装方面，任何具备快干功能的运动服饰都可以应对赛程。”</p>\n  <p>与HYROX绑定最深的PUMA，其财务表现也从侧面印证了这一点。</p>\n  <p>PUMA 的CEO Arthur Hoeld曾在财报电话会上将HYROX称为“灯塔级”合作，但他同时坦言，综合训练（Training）业务目前仍只占集团总营收的个位数比例。截至目前，PUMA尚未披露任何由HYROX直接带来的具体销售数据。这意味着，对于双方而言，这场合作目前更多体现为品牌战略价值，而非直接财务贡献。</p>\n  <p>这种硬件装备上的高可替代性，也让其他运动巨头在进入这一领域时保持谨慎。</p>\n  <p>阿迪达斯、耐克甚至昂跑虽然都推出了适用于混合体能训练的鞋款，强调更强抓地力和前掌灵活性，但不论是否受到排他性冠名条款影响，它们都没有在产品命名中与HYROX进行深度绑定，而是将之描述为“综合训练”或“混合训练”。</p>\n  <p>对于在事件发生前三天，刚宣布以6亿欧元（约合人民币47亿元）收购HYROX多数股权的顶级基金L Catterton来说，挑战或许才刚刚开始。</p>\n  <p>作为LVMH旗下消费投资基金，L Catterton最核心的投资逻辑，是寻找能够定义中产生活方式的消费资产。它重金押注HYROX，看中的不仅是赛事本身的商业潜力，更是其打造出的“高端、自律、新中产社交方式”的品牌标签。而当这项运动的符号从\"中产、健康、时尚\"滑向\"肮脏、失控、缺乏基本尊重\"，它对高净值人群和高端跨界赞助商的吸引力自然会消失。</p>\n  <p><strong>HYROX全球扩张和商业变现的速度，已经明显超过其赛事安全、裁判培训以及危机处理体系的建设速度。</strong>类似的“高速增长后遗症”，在混合体能领域并非首次出现。几乎与HYROX共享同一套成长逻辑的CrossFit，就曾为治理能力滞后付出过生命代价。</p>\n  <p>2024年8月8日，选手Lazar Đukić在CrossFit Games开幕日的公开水域游泳项目中不幸溺亡。事件发生后，CrossFit聘请第三方独立调查团队，对观众、选手和工作人员展开访谈，调取完整影像资料，并对比其他职业赛事的水上安全标准。三个月后，官方公布包括设立专职安全管理岗位、成立独立安全委员会等6项制度调整。</p>\n  <p>CrossFit同样是一家追求利润的商业公司，同样通过赛事内容、门店授权和参与费用盈利。但它证明了一点：商业属性并不意味着企业可以豁免基本治理责任。</p>\n  <p>相比之下，HYROX这次的运气显然更好。没有人受伤或死亡，代价似乎只是一次舆论风暴，以及大量带有嘲讽意味的网络表情包。</p>\n  <p>商业化本身不是原罪。一项运动能够让几十万人主动“花钱干农活”，本身就是一种商业能力。只是，当一场比赛无法被喊停时，它迟早会遇到一个必须停下来的瞬间。</p>", "category": "tech", "published_at": "2026-09-18T14:01:54+00:00", "fetched_at": "2026-09-19T02:52:22.651283+00:00", "fingerprint": "10959307f6ef97fb"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨住建部：4楼及以上住宅都要加装电梯；黄牛称iPhone 18 Pro没人要；今年最便宜的新股“沈鼓集团”，上市次日盘中涨幅近300%", "url": "https://36kr.com/p/3989629580114695?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI据报接近解决又一“千禧年大奖难题”，或将攻克霍奇猜想</li>\n   <li>黑客利用Anthropic的Claude入侵OpenAI</li>\n   <li>巴菲特宣布卸任伯克希尔哈撒韦董事长一职</li>\n   <li>苹果回应iPhone Duo维修贵</li>\n   <li>12306回应国庆假期高铁涨价&nbsp;</li>\n   <li>市场监管总局：拦截线上销售违规充电宝商品3.7万件，督促下架或拦截上架的店铺3831家&nbsp;</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>住建部：4楼及以上住宅都要加装电梯&nbsp;</strong></p>\n  <p>住房和城乡建设部新闻发言人、副部长陈绍旺在国新办新闻发布会上表示，“十五五”时期提升人民群众居住水平关键是建设好房子。从好标准、好设计、好材料、好建造、好运维全链条、全生命周期去推进。</p>\n  <p>针对群众反映楼层低的问题，我们将层高标准从原来的2.8米提高到3米；为解决老年群体上下楼的问题，新标准提出4楼及以上住宅都要加装电梯；针对儿童安全防护的问题，把阳台、外廊等所有凌空处护栏高度，统一提高到不低于1.2米。（财联社）</p>\n  <p><strong>黄牛称iPhone 18 Pro没人要，红色iPhone 18 Pro Max较受欢迎&nbsp;</strong></p>\n  <p>据财联社、每日经济新闻报道，从沪、广、深三地现场回收的“黄牛”了解到，iPhone 18 Pro Max普遍可以加价300元以上回收。其中，多名“黄牛”表示红色iPhone 18 Pro Max较受欢迎，开售时最高加价900元，目前已回落至加价500元左右。iPhone 18 Pro机型方面，多名“黄牛”表示暂时拒收，亦有人士表示可以与官网同价回收。现场“黄牛”表示，与iPhone 18 Pro Max相比，iPhone 18 Pro版本的关注度不佳。上述“黄牛”称，“iPhone 18 Pro版本没人要。”</p>\n  <p>iPhone 18 Pro系列目前官方的预定等待时长较往年明显缩短。据苹果官方网站，如在官网预定红色256G的iPhone 18 Pro型号手机，11个工作日即可发货；红色256G的iPhone 18 Pro Max型号手机则需要15个工作日发货。这较iPhone 17系列动辄3—4周的等待时间明显缩短。（桂林晚报）</p>\n  <p><strong>今年最便宜的新股“沈鼓集团”，上市次日盘中涨幅近300%&nbsp;</strong></p>\n  <p>9月18日，沈鼓集团开盘即下跌，但是不到一个小时就迎来反转，午后更是走出极致反转行情，盘中涨幅逼近300%。截至收盘，沈鼓集团当前股价为57.77元/股，单日涨幅为177.74%，公司总市值约1796.6亿元，当日两度触发临停。</p>\n  <p>沈鼓集团于2026年9月17日上市，股票发行价为4.39元/股，是今年年内发行价最低的新股。从打新收益来看，单签500股中签缴款需2195元，以当日盘中最高价82.59元测算，单签最高浮盈3.91万元。（新京报）</p>\n  <h2>AI 最前沿</h2>\n  <p><strong>智谱推出GLM-5.3-FlashX</strong></p>\n  <p>36氪获悉，智谱正式推出GLM-5.3-FlashX（最高200 tokens/s）。</p>\n  <p><strong>黑客利用Anthropic的Claude入侵OpenAI</strong></p>\n  <p>据报道，在一群AI代理从OpenAI系统中突破封锁并攻击Hugging Face公司两周后，这家ChatGPT开发商又发现了一起由人工智能驱动的入侵事件。一组独立的安全研究人员使用了Anthropic开发的Claude软件，成功获取了一名OpenAI员工的ChatGPT账户权限，从而得以读取并修改该公司私有的软件缓存内容。该团队参与了OpenAI的一项漏洞挖掘计划，该项目为研究人员提供安全环境，允许其尝试攻破企业系统。他们在发现漏洞后迅速向公司报告。OpenAI为此支付了6500美元的悬赏金，该团队也首次向媒体披露了此次行动细节。（新浪财经）</p>\n  <p><strong>MiniMax Code CLI正式开源</strong></p>\n  <p>36氪获悉，据MiniMax消息，MiniMax Code CLI的v0.4.12版本面向全球开发者正式开放，并且以MIT协议正式开放源代码。</p>\n  <p><strong>OpenAI据报接近解决又一“千禧年大奖难题”，或将攻克霍奇猜想</strong></p>\n  <p>9月17日，据报道，OpenAI已接近解决“千禧年大奖难题”中的另一道数学难题——霍奇猜想（Hodge Conjecture）。OpenAI员工预计这一问题可能在不久后得到解决。霍奇猜想是美国克雷数学研究所提出的7个“千禧年大奖难题”之一，解决其中任何一道均可获得100万美元奖金。（界面新闻）</p>\n  <p><strong>四大AI编程代理曝相同安全漏洞，“技能”更新机制遭劫持风险</strong></p>\n  <p>网络安全初创公司Air独家披露，Anthropic Claude Code、OpenAI Codex、Google Gemini CLI及GitHub Copilot四款主流AI编程代理存在相同逻辑缺陷：其“技能”（Skills）自动更新机制未校验内容变更，攻击者可伪装同名恶意更新绕过扫描，静默窃取企业代码或知识产权。该漏洞源于各厂商验证机制设计雷同，凸显行业共性盲区。目前除GitHub外其余三家已修复；GitHub称平台机制可阻断此类攻击，但未确认补丁状态。（新浪财经）</p>\n  <p><strong>摩根大通CEO戴蒙：建议对AI实施“轻度”的联邦级监管</strong></p>\n  <p>在美国硅谷针对美国人工智能发展前路争论不休之际，美东时间周三，摩根大通首席执行官杰米·戴蒙发表观点：支持美国对人工智能行业实施“轻度（light-touch）”的联邦级别监管，避免地方监管，理由是各州法规不一，会增加AI商业落地的复杂性。他表示：“如果一定要监管，就应当由联邦层面出台，并且采用轻度监管模式。联邦政府会有自己的考量，各州同样如此……我确实认为这会成为一个难题，倘若各类事项都适用不同州的法律，商业活动几乎难以开展。”（财联社）</p>\n  <p><strong>Anthropic公司计划年底前建成5吉瓦算力</strong></p>\n  <p>据报道，Anthropic公司计划年底前建成5吉瓦算力。(财联社)</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>人民币升破6.7，在岸离岸双双创2023年1月以来新高&nbsp;</strong></p>\n  <p>9月18日，离岸人民币兑美元汇率升破6.70关口。同日，人民币兑美元中间价报6.7521，上调59点。截至9时50分，在岸、离岸人民币对美元分别报6.6990、6.6971。</p>\n  <p>北京时间9月17日凌晨，美联储宣布将联邦基金利率目标区间上调25个基点，到3.75%至4%。在此背景下，美元指数升至近1个月高点，重新站上100关口，非美货币普遍承压。相比之下，人民币汇率延续稳中有强态势。业内人士表示，受经常账户顺差以及企业结汇韧性等因素支撑，人民币走势稳健。（财联社）</p>\n  <p><strong>日本央行时隔3个月再加息，符合市场预期&nbsp;</strong></p>\n  <p>9月18日日本央行加息25个基点，将目标利率由1.00%上调至1.25%，为31年来最高水平，符合市场预期。日本央行以7比2的投票结果通过了加息决定。（财联社）</p>\n  <p><strong>巴菲特宣布卸任伯克希尔哈撒韦董事长一职</strong></p>\n  <p>96岁的沃伦·巴菲特在周五的一份致股东信中宣布，即将卸任伯克希尔哈撒韦公司董事长一职。伯克希尔在另一份公告中表示，巴菲特将即刻出任名誉董事长，并继续担任公司董事会成员。根据一项既定的长期接班计划，他的儿子霍华德·巴菲特将接替他出任董事长。苏珊·德克尔（Susan Decker）将继续担任首席独立董事。（第一财经）</p>\n  <p><strong>特朗普再称对伊朗战事将很快结束&nbsp;</strong></p>\n  <p>当地时间9月18日，美国总统特朗普谈及伊朗时，称“战事很快就会结束”。特朗普重申，伊朗不会拥有核武器。他同时表示，一旦与伊朗的战争结束，汽油价格将回落至此前水平，甚至更低。同时，特朗普表示，美国正在与也门胡塞武装接触。（央视新闻）</p>\n  <p><strong>澳大利亚拟在政府工作场所禁用智能眼镜</strong></p>\n  <p>据路透社等多家媒体17日报道，考虑到隐私和安全等因素，澳大利亚拟禁止在联邦政府工作场所使用配备摄像头的智能眼镜。此外，澳政府还将召集包括微软、澳大利亚联邦银行、澳大利亚电信等多家在澳大型企业举行圆桌会议，围绕工作场所人工智能的使用规范进行磋商。（新华社）</p>\n  <p><strong>SK海力士：尚未决定是否在日本建芯片工厂</strong></p>\n  <p>据报道，SK海力士9月18日表示，尚未决定是否在日本建设芯片工厂。（界面新闻）</p>\n  <p><strong>比特币涨破8.1万美元&nbsp;</strong></p>\n  <p>9月19日6:20，加密货币市场全线狂飙，比特币涨破8.1万美元，目前涨超6%，以太坊涨近8%，SOL、HYPE等涨超11%，过去24小时，全球共有超11万人被爆仓。（21世纪经济报道）</p>\n  <p><strong>美国证券交易委员会推进全天候交易，批准代币化证券交易豁免</strong></p>\n  <p>美国证券交易委员会（SEC）周四在华盛顿总部举行圆桌会议，讨论将传统交易系统扩展至加密货币领域惯常的24小时全天候交易模式。会议举行前一个小时，该机构刚发布命令，批准代币化证券交易。（新浪财经）</p>\n  <p><strong>SpaceX：计划最早于9月28日进行星舰第14次试飞</strong></p>\n  <p>当地时间9月17日，SpaceX在社交平台发帖称：“目前计划最早于9月28日（周一）执行‘星舰’第14次飞行任务，具体时间尚待监管部门批准。”（界面新闻）</p>\n  <p><strong>苹果回应iPhone Duo维修贵</strong></p>\n  <p>针对iPhone Duo官方维修价格，客服表示，目前iPhone Duo尚未开启预购，具体维修价格待预购后公布。客服称，iPhone Duo采用内外双屏设计，维修费用可能“确实比较昂贵”。以iPhone 18 Pro Max为例，屏幕损坏正常维修费用为3198元。（中新经纬）</p>\n  <p><strong>12306回应国庆假期高铁涨价&nbsp;</strong></p>\n  <p>据中新经纬，9月16日，国庆假期前一天高铁票开售。有网友称“准备抢国庆期间的车票，发现车票居然涨价了。”</p>\n  <p>据网友晒出的截图显示，9月25日，重庆北至南京南D988次列车票价为446元起，9月30日则为520元起。另有网友分享了广州至潮汕G6592次列车票价变化，该网友称，“同个班次，平时价格是279元，中秋涨到298元，国庆涨到302元。”</p>\n  <p>9月18日早间，客服表示，高铁票价可能因节假日客流等因素浮动，不同日期优惠折扣不同，并非涨价。具体票价以12306官方显示为准。对于何时购票更优惠，客服则表示，无法确保某一时段的优惠力度大小。一般情况下，开票期间不会出现较大变化，但也不排除特殊情况。（中新经纬）</p>\n  <p><strong>文化产业发展“十五五”规划:支持符合条件的文化企业通过上市、股权、债券等方式融资</strong></p>\n  <p>36氪获悉，文化和旅游部印发《文化产业发展“十五五”规划》。其中提到，推动文化金融服务创新和产品创新，引导金融服务与文化产业需求精准对接。鼓励银行业金融机构加大对文化企业信贷支持力度。支持金融机构创新符合文化产业特点的金融产品和服务。支持符合条件的文化企业通过上市、股权、债券等方式融资。引导创业投资机构加大对初创期、成长期文化企业的投资力度。鼓励保险机构开展面向文化企业的保险业务。推动符合条件的文化产业项目发行基础设施领域不动产投资信托基金(REITs)。更好发挥文化和旅游金融服务中心功能，完善文化产业投融资服务。</p>\n  <p><strong>财政部：1一8月证券交易印花税2160亿元，同比增长82%</strong></p>\n  <p>36氪获悉，据财政部消息，1一8月，印花税3858亿元，同比增长35.6%。其中，证券交易印花税2160亿元，同比增长82%。</p>\n  <p><strong>全国首个海洋Token工厂落地青岛</strong></p>\n  <p>36氪获悉，全国首个面向海洋产业的专属智能要素供给平台——海洋Token（词元）工厂正式发布并落地青岛。据介绍，海洋Token工厂整体架构包含数据、算力、算法三个部分。数据方面，平台可提供海上作业规范、海洋环境要素等130多类涉海数据，建成面向海洋一线需求的专属数据库；算力方面，已形成总算力规模超过800P的海洋算力资源池，且仍在持续扩容；算法方面，汇聚观海、海星等20多个海洋领域专有大模型，以及“九天”大模型等30多款通用模型。按照规划，海洋Token工厂将深度贯穿深海油气勘探等实战场景，服务行业领军企业需求。</p>\n  <p><strong>宁德时代回购151.26万股A股股份</strong></p>\n  <p>36氪获悉，宁德时代公告，公司9月18日回购151.26万股A股股份，回购价格区间为每股300.89元—302.63元，回购总金额约4.56亿元。</p>\n  <p><strong>英国国王召集AI峰会，黄仁勋：监管产品而非技术</strong></p>\n  <p>当地时间9月17日，英国国王查尔斯三世在苏格兰邓弗里斯庄园（Dumfries House）主持召开人工智能峰会。英伟达CEO黄仁勋（Jensen Huang）、谷歌DeepMind创始人哈萨比斯（Demis Hassabis），以及OpenAI、Anthropic等全球人工智能（AI）巨头高层及英国政府代表参会，共同讨论AI发展的机遇、风险与治理原则。（第一财经）</p>\n  <p><strong>迪士尼任命Adam Smith为直接面向消费者业务主席</strong></p>\n  <p>当地时间9月17日，迪士尼宣布任命Adam Smith为公司DTC（Direct-to-Consumer）业务主席。Smith将负责公司的全球娱乐SVOD业务，并将监管Disney+和Hulu的产品、工程、广告技术、合作伙伴关系以及数据与分析等。此外，迪士尼还宣布任命Joe Earley为电视品牌与内容战略总裁。其将负责主导迪士尼娱乐电视品牌的战略开发，并监管国际原创内容及制作的全部内容与制作事务、劳务关系以及创意人才培养。（界面新闻）</p>\n  <p><strong>市场监管总局：拦截线上销售违规充电宝商品3.7万件，督促下架或拦截上架的店铺3831家&nbsp;</strong></p>\n  <p>据央视新闻，市场监管总局近日部署开展了为期三个月的无CCC认证充电宝集中整治，目前已取得了阶段性进展。截至目前，各地市场监管部门共监督检查充电宝生产企业425家、销售市场1496个、店铺5.56万家，共享充电宝及网售充电宝81.2万个，发现问题线索395件。同时督促电商平台将“三无”充电宝、无CCC标识产品、CCC证书撤销或暂停产品及“CCC贴纸”等纳入禁售目录，并采取下架、关闭店铺等措施；对接CCC证书联网核查接口，实现证书状态自动比对、实时拦截，及时清理存量问题商品。集中整治行动开展以来，督促7家主要电商平台开展联网核查376.3万次，拦截违规充电宝商品3.7万件，督促下架或拦截上架的店铺3831家。（央视新闻、九派新闻）</p>\n  <p><strong>消息称特斯拉AI5芯片已在三星泰勒工厂试产</strong></p>\n  <p>业内消息称，三星电子已在美国得克萨斯州泰勒的代工厂开始原型生产，向特斯拉提供AI5芯片。三星泰勒工厂原定于11月左右全面投产，但由于大型科技公司对AI芯片的需求激增，三星提前了原型产量以开始良率验证，计划在今年年底完成大规模生产验证，并于明年全面供应。（新浪财经）</p>\n  <p><strong>委内瑞拉即将达成协议，将黄金储备从英国转移至美国</strong></p>\n  <p>据知情人士透露，委内瑞拉政府与反对派即将达成一项协议，把价值约40亿美元的黄金储备从英格兰银行转移至纽约联邦储备银行。根据正在磋商的条款，这批黄金有可能被用作政府借贷的抵押品，为财政开支提供资金。政府不得立即出售所持黄金，但将拥有对其的法定控制权。英格兰银行表示，除非英国法院出具裁定，明确账户的法定归属方，否则该行无法执行相关操作。（新浪财经）</p>\n  <p><strong>费城半导体指数尾盘快速拉升收涨2.78%，加密货币概念大涨&nbsp;</strong></p>\n  <p>美股三大指数收盘涨跌不一，纳指涨0.39%，本周累涨0.72%；标普500指数涨0.17%，本周累跌0.08%；道指跌0.18%，本周累跌1.69%，周线三连跌。费城半导体指数尾盘快速拉升，收涨2.78%。存储概念股普涨，闪迪大涨约11%，Coherent涨超7%，希捷科技涨超6%，西部数据涨超4%，美光科技涨超3%，AMD、SK海力士涨逾2%。加密货币概念大涨，Strategy涨超16%，MARA Holdings涨超13%，Coinbase涨超11%，Robinhood涨超9%，Bitmine、Cipher涨超8%，Circle涨超7%。奈飞跌超4%，富国银行将该股评级从中性下调至减持，目标价从80美元下调至57美元。（界面新闻）</p>\n  <p><strong>韩国将在价格压力下延长燃油税减免至11月</strong></p>\n  <p>韩国财政部周五表示，将燃油税减免计划延长两个月至11月，以缓解中东局势长期紧张的公众物价负担。根据该措施，目前汽油15%、柴油和丁烷25%的税收减免，原定于本月底到期，将持续到十一月底。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>四方精创：决定延迟H股全球发售及上市</strong></p>\n  <p>36氪获悉，四方精创公告，公司正在进行申请发行H股并在香港联交所主板挂牌上市的相关工作。鉴于目前的市场情况，公司决定延迟此次H股的全球发售及上市。</p>\n  <p><strong>证监会同意傲拓科技科创板IPO注册</strong></p>\n  <p>36氪获悉，证监会同意傲拓科技股份有限公司（简称“傲拓科技”）首次公开发行股票并在科创板上市的注册申请。</p>\n  <h2>投融资</h2>\n  <p><strong>“宇算星河”完成亿元级天使轮及pre-A轮融资</strong></p>\n  <p>36氪获悉，“宇算星河”完成亿元级天使轮及pre-A轮融资，由麟阁创投领投、海珠城发、清新资本、高捷资本、知识城集团、吉富资本跟投。“宇算星河”核心业务是可在轨运行的“天基大模型”，希望实现遥感数据在太空端的实时训练、推理与闭环处理，为在轨计算提供原生的智能模型能力。</p>\n  <h2>酷产品</h2>\n  <p><strong>菜鸟向客户交付广州首个攀爬机器人仓</strong></p>\n  <p>36氪获悉，近日，菜鸟在广州向客户交付当地首个新一代自研攀爬机器人仓库，仓库面积利用率提升了2倍，同时拣选效率也得到大幅度提升。据了解，菜鸟自研的攀爬机器人发布仅5个月，已完成东莞、香港和广州等多个项目的交付投产，此外西班牙和荷兰项目也已进入交付阶段，项目覆盖了中国国内物流、欧洲物流，涉及国内电商、跨境电商、电子制造和服饰生产等多个行业。</p>\n  <p class=\"editor-note\"><strong>整理丨李琪</strong></p>", "category": "tech", "published_at": "2026-09-19T01:02:56+00:00", "fetched_at": "2026-09-19T02:52:22.651268+00:00", "fingerprint": "1aeabbf10ded286b"}, {"source": "少数派", "title": "让 Agent 读懂你的身体：数据获取篇", "url": "https://sspai.com/prime/story/how-to-obtain-data-for-agent-analysis", "summary": "某一天，我站在健身房里，发现自己似乎已经有一阵子没什么进步了，隐约生出一种「怎么练来练去还是这样」的顿感。我知道，这多半是平台期。理论上，我要做的无非是调整训练量、换动作、看恢复、查饮食，必要时调整周 ...<a href=\"https://sspai.com/prime/story/how-to-obtain-data-for-agent-analysis\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"http
