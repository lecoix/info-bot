rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>《给阿嬷的情书》总票房已突破19亿元</li>\n   <li>梁文锋署名，DeepSeek发布最新论文</li>\n   <li>WPS回应C盘占用问题，即将更新七月版本上线磁盘存储管理功能</li>\n   <li>触屏MacBook将搭载M5芯片发布，苹果计划跳过M6 Pro及M6 Max</li>\n   <li>美国监管部门关闭针对特斯拉Model 3及Model Y转向失控调查</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>韩国将于6月29日宣布三星、SK集团的多个大型项目</strong></p>\n  <p>韩国将于6月29日宣布“三大工程”计划，韩国总统李在明将与政府各部门、三星电子和SK的官员会面，并发布政策和投资公告。李在明将于下午2点在总统府青瓦台发表讲话，届时韩国产业通商部、科学技术信息通信部、气候能源环境部和国土交通部将公布三大工程的政策。三星电子和SK将发布企业投资计划，据报道，两家企业未来十年的总投资规模最高或达2000万亿韩元（折合1.3万亿美元）。将重点布局半导体、AI算力数据中心与物理AI领域。（华尔街见闻、财联社）</p>\n  <p><strong>“超级牛散”章建平新动向，大举减仓江淮汽车</strong></p>\n  <p>短短4个多月，江淮汽车股价腰斩，知名游资章建平也扛不住了。今年2月12日，葛卫东和章建平的妻子方文艳参与江淮汽车定增，均获配10亿元，定增价49.88元，当天收盘价57.96元。过去几个月来，江淮汽车股价遭遇重挫，6月26日跌至26.87元。由于葛卫东和方文艳参与定增的股份尚处于锁定期，这些参与定增股份已经浮亏近半。</p>\n  <p>据报道，超级牛散，有着“章盟主”之称的章建平在近期对江淮汽车进行了大幅度的减仓。数据显示，截至6月23日，方文艳持有江淮汽车股票2665.02万股，持股比例为1.18%。而据公司此前披露，截至6月9日，方文艳持有江淮汽车股票3588.52万股，持股比例为1.59%。也就是说，自6月10日至23日，方文艳在9个交易日内减持了923.5万股。其间，江淮汽车股票最高价33.51元/股，最低价28.82元/股，区间加权均价为31.386元/股。以均价估算，方文艳此次减持套现约2.9亿元。公开资料显示，方文艳正是章建平的妻子。（证券时报、红星资本局）</p>\n  <p><strong>美国即将允许Anthropic恢复其最新大模型Fable 5访问权限</strong></p>\n  <p>据最新消息，美国政府即将允许Anthropic恢复其最新大模型Fable 5的访问权限。此前6月12日，美国政府以国家安全为由，向AI公司Anthropic发出紧急出口管制指令，要求其立即禁止外国主体访问最新大模型Fable 5和Mythos 5。该消息一度引发市场对AI和算力概念股的广泛担忧。今年5月底，AI巨头Anthropic宣布完成H轮650亿美元融资，投后估值达9650亿美元（约合人民币6.56万亿元），成为全球估值最高的AI初创企业。（人民财讯）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌对Meta Gemini模型的使用设限，因人工智能需求紧张导致算力吃紧</strong></p>\n  <p>谷歌对Meta Gemini模型的使用设限，因人工智能需求紧张导致算力吃紧。（新浪财经）</p>\n  <p><strong>OpenAI：开启下一代模型GPT-5.6系列的限量预览</strong></p>\n  <p>6月27日，OpenAI宣布已开启GPT-5.6系列的限量预览。该系列包括旗舰模型Sol、适用于日常工作的均衡模型Terra、以及快速且经济实惠的模型Luna。据介绍，Terra性能与GPT-5.5相当但价格便宜一半，Luna则以最低成本提供较强能力。OpenAI表示，计划在未来几周内全面开放GPT-5.6 Sol、Terra和Luna。在27日发布前OpenAI与美国政府沟通了模型能力及发布计划。应美方要求，此次将先向少量经审核的可信合作方进行预览。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>多款热门电脑机型大幅涨价</strong></p>\n  <p>苹果公司最近宣布，上调全球多个市场部分笔记本电脑和平板电脑售价，涨幅在16%至25%不等。国内市场多款热门电脑机型售价也出现大幅上调。在深圳华强北的一家电脑销售门店，店长向记者介绍了一款热卖游戏笔记本电脑。这款电脑去年七八月份上市时零售价在7000元左右，如今终端售价已突破1万元。记者走访发现，除了热门游戏笔记本，普通商务笔记本的价格也普遍上调。去年市场上价格在4000元以下的机型，今年已基本难觅踪影，而中高端笔记本的涨幅普遍在500至1500元之间。（央视财经）</p>\n  <p><strong>汽车安全迎来新标准，汽车侧面碰撞迎20年最严标准升级</strong></p>\n  <p>6月28日消息，7月1日起，中国将实施一批汽车安全碰撞新国标。其中《汽车侧面碰撞的乘员保护》是近二十年来最严苛的一次碰撞安全标准升级。在中国汽车技术研究中心汽车安全试验室，专家介绍，在新国标中，采用的侧面碰撞台车质量从950公斤大幅提升至1400公斤。除了碰撞上的高标准新国标即将实施，7月1日起，《电动汽车安全要求》及《电动汽车用动力蓄电池安全要求》两项强制性国家标准也将正式实施。其中，动力电池热失控的判定要求，提升为“不起火、不爆炸”。新国标还首次将“一键断电”定义为物理断电装置，彻底取代以往依赖软件控制的断电方式。 （央视财经）</p>\n  <p><strong>大疆：针对异常抢购已报案</strong></p>\n  <p>6月23日，大疆Osmo Pocket 4P定价3799元开售，网友掐点下单却发现多个渠道“秒空”。随后几天，“大疆Pocket 4P开售秒没”“大疆Pocket 4P”等词条相继冲上微博热搜，不少用户猜测其“饥饿营销”。据多家媒体报道，针对Osmo Pocket 4系列“秒空”“抢不到”“饥饿营销”等相关讨论，大疆方面回应称，Osmo Pocket 4系列的首批备货对比前代产品Osmo Pocket 3首批备货提升近10倍，但市场需求依然超出预期，导致部分渠道出现供不应求的情况。</p>\n  <p>此外，针对此次发售遭遇的异常抢购，大疆表示，经溯源，已成功锁定部分黄牛团伙。公司在向公安机关正式报案后，经警方初步侦查，近日已对多人团伙采取刑事强制措施。经查，黄牛团伙涉嫌利用虚拟号码、虚拟IP等违法手段，实施涉及计算机信息系统的犯罪行为，恶意攻击并破坏大疆商城的正常购买秩序。（财联社、北京日报）</p>\n  <p><strong>《给阿嬷的情书》总票房已突破19亿元</strong></p>\n  <p>据网络平台数据，截至6月27日16时17分，上映59天的电影《给阿嬷的情书》总票房已突破19亿元。此前，该片官宣密钥延期，延长放映至7月31日。（上海证券报）</p>\n  <p><strong>梁文锋署名，DeepSeek发布最新论文</strong></p>\n  <p>在6月中旬获得500亿融资后仅十几天，6月27日，DeepSeek团队联合北京大学发布论文《DSpark: Confidence-Scheduled Speculative Decoding with Semi-Autoregressive Generation》。这不是一次模型版本的迭代，而是在原有DeepSeek-V4-Pro和DeepSeek-V4-Flash基础上增加了一个推测解码模块，重点在于工程落地层面的优化。</p>\n  <p>随DSpark一同开源的DeepSpec，是一个用于训练和评估推测解码草稿模型的全栈代码库，包含数据准备工具、草稿模型实现、训练代码和评估脚本，支持MIT许可。目前DeepSpec已内置DSpark、DFlash和Eagle3三种实现。值得注意的是，DeepSeek创始人梁文锋位列论文作者名单。在完成首轮融资的当下，创始人依然亲自参与技术论文撰写，这在AI行业并不多见。（财联社）</p>\n  <p><strong>腾讯小范围内测TenPay Go，面向境外人士来华支付</strong></p>\n  <p>腾讯正在内测一款面向境外人士的“来华生活便利助手”，旨在提供包括移动支付服务的一站式数字生活服务。该App将支持在全国数千万家微信支付合作商户中直接消费，目前仍在小范围测试中，暂未全量开放体验。记者留意到，该款APP已在App Store上架，名为TenPayGo。（界面新闻）</p>\n  <p><strong>暑期机票预订量环比增长65%，航司优化航线提前布局</strong></p>\n  <p>全国暑运即将开始，民航方面，从目前的旅客预订情况来看，长线深度游和清凉避暑游成为今年暑期出行的两大主线，西北、东北等目的地热度持续攀升，机票预订量迎来大幅增长。去哪儿大数据研究院研究员石珂表示，截至目前，近一周预订7月至8月暑期出行的机票明显增长，环比上周增长65%。山西大同、贵州铜仁、西藏拉萨、内蒙古乌海、新疆和田的暑期机票预订增幅都达到50%以上。面对今年暑期长线游与避暑游交织的旺盛市场需求，各大航空公司正积极优化航线网络，通过加密热门目的地航班、投入宽体机型等方式精准增加运力供给，全力保障旅客暑期出行需求。（央视财经）</p>\n  <p><strong>乘联分会崔东树：5月中国汽车进口3.8万辆，同比降19%</strong></p>\n  <p>6月28日，乘联分会秘书长崔东树发文表示，2026年5月进口车进口3.8万辆，下滑19%，但由于2025年1月基数低，虽然美国与伊朗战争导致运输受阻，进口车总体下降较小，2026年1-5月进口汽车16万辆，同比下降11%。随着国产车的崛起和国际品牌本土化加速，近几年汽车进口持续低迷，进口车持续3年负增长，如果熨平波动，则是连续8年的负增长。（新浪财经）</p>\n  <p><strong>智元第15000台通用具身机器人正式量产下线</strong></p>\n  <p>6月28日，智元宣布第15000台通用具身机器人精灵G2正式量产下线。智元机器人合伙人、高级副总裁、具身业务部总裁姚卯青表示，15000台量产下线印证了智元规模化量产到达新高度，也标志着中国人形机器人产业迈上了大规模真实场景应用。量产不是目的，只是一个过程，通过规模化量产让机器人在各行各业快速部署，在真实物理世界交互过程中去获取数据，通过数据飞轮让产品变得越来越智能、越来越稳定。（证券时报）</p>\n  <p><strong>楼市复苏信号？多城核心地块高溢价成交：房企扎堆抢夺，持续刷新当地纪录</strong></p>\n  <p>近日，深圳、杭州、长沙等多个城市上演高热土拍，核心片区宅地轮番拍出高溢价，板块地价接连创下新高。（澎湃新闻）</p>\n  <p><strong>6月份沪牌拍卖结果公布，平均成交价为94368元</strong></p>\n  <p>6月27日，据“上海发布”官微消息，6月份沪牌拍卖结果公布。个人额度合计拍卖总数3809个，参加拍卖人数33834人，中标率11.3%。最低成交价94300元，平均成交价为94368元，与上个月保持一致。（每日经济新闻）</p>\n  <p><strong>网传纯净水涨价，娃哈哈回应</strong></p>\n  <p>娃哈哈集团官方微博发布针对近日网传娃哈哈纯净水涨价相关消息的统一说明：受包材成本波动，我司调整不同包装规格水产品的渠道批发价，有升有降以保障经销商伙伴稳定经营。全线纯净水终端零售价不变，消费者购买价格无变化。请广大消费者放心购买，相关信息以官方发布为准。（第一财经）</p>\n  <p><strong>WPS回应C盘占用问题：即将更新七月版本上线磁盘存储管理功能</strong></p>\n  <p>36氪获悉，6月27日，针对近期用户集中反馈的C盘占用问题，WPS方面表示已完成排查并启动优化，将于7月上线的新版本在安装界面增加了路径选择功能；在使用环节，WPS在设置页新增了\"存储管理\"模块，缓存、文件备份、云文档缓存等各类文件的占用与可释放空间集中展示。WPS表示，缓存与备份默认存放在C盘、占用情况不够直观，确实给部分高频用户造成了困扰，此次优化的核心逻辑是\"安装有选择、使用可管理\"，让用户从安装到使用的每个环节中，都能清楚了解本地占用了多少、哪些可以清理，并随时自主管理。</p>\n  <p><strong>央视曝手机测评作弊乱象</strong></p>\n  <p>记者调查发现，数码产品测评这个领域的高度技术化，长期以来处于“无人能实锤作弊乱象”的灰色地带。网络安全专家介绍，整套作弊体系分为三层，层层美化测评数据：第一层厂商专供测评博主的特供媒体机，硬件经过筛选优化；第二层固件内置识别程序，检测到博主身份并自动开启高性能模式；第三层云端远程控制，可实时下发测评作弊配置。当这套系统识别到某博主启动测评时，就会进入“作弊模式”，自动拉高CPU性能、调高屏幕亮度、优化后台加载逻辑，切换软件时仅加载界面而非完整应用，营造全程流畅的假象。边亮介绍，为了规避被发现的风险，这套测评作弊机制也经历了多轮迭代，隐蔽性越来越强。记者调查发现，由于特供样机、固件作弊、云端调控三重手段叠加，普通消费者很难分辨测评真假，这也导致数码测评公信力持续受损，而且技术造假取证难度极大，给监管带来很大难度。（界面新闻）</p>\n  <p><strong>功率半导体再启阶梯式调价，有厂商表示“AI相关的电源功率订单爆满，根本做不过来”</strong></p>\n  <p>据《科创板日报》27日消息，由于AI算力集群功耗激增，功率半导体正成为存储之后的产业新增长引擎，行业再掀起一轮涨价潮。“我们AI相关的电源功率订单‘爆满’，现在订单根本做不过来”。一家功率半导体厂商人士向《科创板日报》记者表示，“因为公司算是少数具备量产能力的国产厂商，无论是面向数据中心800V HVDC等一次电源、服务器二次电源等产品，都已进入多家头部客户供应链并实现规模量产，所以订单需求十分旺盛。”多位业内人士判断，本轮成本驱动的涨价周期仍将持续一段时间，并且行业将加速功率器件低端产能的出清，市场份额将向具备IDM全链条能力或与上游深度绑定，且涉足高景气赛道的头部芯片企业集中。（财联社）</p>\n  <p><strong>因利润腰斩，梅赛德斯-奔驰推迟9万名德国员工奖金并谋求无薪延长工时</strong></p>\n  <p>6月27日，据报道，由于利润大幅下滑，梅赛德斯-奔驰正被迫采取严厉的紧缩措施。公司已决定将约9万名加入工会的德国员工原定于2026年7月发放的“转型奖金”（相当于月薪的18.4%）推迟9个月至2027年4月发放，并保留在业务未见好转时完全取消该奖金的权利。此外，管理层还在公开探讨将每周工作时间从35小时延长至40小时且不支付额外加班费。梅赛德斯-奔驰今年2月公布的财报显示，2025年净利润从2024年的104亿欧元骤降至53亿欧元，降幅近50%。（界面新闻）</p>\n  <p><strong>郭明錤：iOS 27将进一步深化与Apple Intelligence的系统级整合</strong></p>\n  <p>跟踪苹果产业链多年的分析师郭明錤发布报告指出，iOS 27将进一步深化与Apple Intelligence的系统级整合。其最新产业调查显示，为确保在AI负载下系统仍能顺畅运作，1H27新款配备A20处理器的较低阶iPhone之DRAM规格将升级至9GB（1.5GB×6-die），高于目前A19机型的8GB（2GB×4-die）。2H26配备A20Pro处理器的三款高阶机型（折叠机与两款18Pro机型）则维持12GB（1.5GBx8-die）。（财联社）</p>\n  <p><strong>马克·古尔曼：触屏MacBook将搭载M5��片发布，苹果计划跳过M6 Pro及M6 Max</strong></p>\n  <p>当地时间6月26日，科技记者马克·古尔曼发文称，苹果传闻中的触屏MacBook Pro将在今年晚些时候或2027年初发布，首发搭载现役M5 Pro及M5 Max芯片。苹果此后计划推出配备M7芯片的升级版本，这与此前报道苹果将跳过M6 Pro及M6 Max直接推出M7系列的计划相吻合。苹果跳过高端M6芯片的决策被认为与内存短缺导致的成本压力密切相关，苹果本周已因此宣布上调Mac及iPad产品售价。（界面新闻）</p>\n  <p><strong>特斯拉Model S签名典藏版限量投放欧洲市场</strong></p>\n  <p>据报道，特斯拉Model S Signature Edition（签名典藏版）于近日正式登陆欧洲市场，该车型仅限量20台投放欧洲地区，采用定向受邀客户专属购买模式，不面向公众开放选购。据了解，特斯拉数月前已关停Model S、Model X全球线上订单通道。美国市场共推出250台Model S、100台Model X签名典藏版，目前本土库存已全部售罄。（界面新闻）</p>\n  <p><strong>美国监管部门关闭针对特斯拉Model 3及Model Y转向失控调查</strong></p>\n  <p>据美国国家公路交通安全管理局（NHTSA）6月27日披露，关闭针对2023款特斯拉Model 3及Model Y电子助力转向系统失效问题的工程分析调查。调查显示，上述车型转向电子控制单元（ECU）印刷电路板上的电���驱动组件存在过压击穿风险，可能导致电子助力转向失效，驾驶员仅能依靠手动转向操控车辆。特斯拉已于2025年2月就此发起召回，并通过OTA空中升级方式推送软件版本2023.38.4加以修复，该更新最早于2023年10月起陆续推送至受影响车辆。NHTSA分析显示，软件更新推送后相关投诉数量明显下降，据此决定关闭调查，但将持续监测召回修复效果。（界面新闻）</p>\n  <p><strong>马斯克获FTC批准收购前SpaceX工程师创立的光模块初创公司Mesh</strong></p>\n  <p>美国联邦贸易委员会（FTC）当地时间6月25日批准马斯克收购Mesh Optical Technologies Corporation。Mesh Optical Technologies由三位前SpaceX工程师特拉维斯·布拉谢尔斯（Travis Brashears）、卡梅隆·拉莫斯（Cameron Ramos）及赛琳娜·格罗文-哈伯利（Serena Grown-Haeberli）创立，三人此前曾在SpaceX主导设计星链卫星激光星间链路系统。公司于今年2月从隐身模式浮出水面，完成由Thrive Capital领投的逾5000万美元A轮融资。Mesh的核心产品为Alpha C1光学收发器，传输速率达1.6Tbps，采用倒装芯片键合工艺制造，以光信号替代传统铜缆在服务器与GPU之间传输数据，可大幅降低延迟与能耗。（界面新闻）</p>\n  <p><strong>博世集团：董事会人事调整不会对博世中国各项业务运营产生任何影响</strong></p>\n  <p>6月27日晚，博世集团官微发文表示，此次集团董事会人事调整不会对博世中国各项业务运营产生任何影响。中国始终是博世全球最重要的战略市场之一，也是集团重要的创新基地。未来，博世将一如既往携手广大客户和合作伙伴，持续深耕中国市场。公告显示，经与股东充分沟通并达成一致，史蒂凡·哈通（Dr. Stefan Hartung）主动申请于2026年6月30日卸任博世集团董事会主席职务。他也将同时退出博世集团董事会及罗伯特·博世工业信托公司管理层。2026年7月1日起，董事会副主席克里斯蒂安·菲舍尔（Dr. Christian Fischer）将接任该职务。同时，董事会成员马库斯·福施纳（Dr. Markus Forschner）与马库斯·海恩（Dr. Markus Heyn）将出任博世集团董事会副主席。（新浪财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>蔚来ES8大五座版将于7月9日上市</strong></p>\n  <p>6月27日，蔚来宣布ES8大五座版开启预订，将于7月9日正式上市。</p>\n  <p><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-06-28T23:44:39+00:00", "fetched_at": "2026-06-29T03:28:21.496080+00:00", "fingerprint": "4d92303abd21f6b9"}, {"source": "36氪 - 最新文章", "title": "中国卖家涌向拉美：高增长与合规门槛齐升丨最前线", "url": "https://36kr.com/p/3873539789034501?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>6月26日，亚马逊全球开店在杭州宣布推出“拉美速通计划”，计划在2026年内面向3000个具备长期投入意愿的中国品牌，提供巴西本土公司注册协助、墨西哥RFC税号解决方案、最高12000美元补贴及物流费用减免等支持，帮助卖家全面扎根拉美市场。</p>\n  <p>拉美正在成为跨境电商的新热土。据eMarketer数据，2025年拉美零售电商市场规模接近1900亿美元，增速是全球平均水平的1.5倍，其中巴西和墨西哥贡献了绝大部分销售额。</p>\n  <p>亚马逊数据也印证了这一增长趋势：2026年第一季度，新上线巴西和墨西哥站点的中国卖家销售额是去年同期的2倍以上；墨西哥Hot Sale大促期间，这一数字达到4倍以上。2025年，在这两个站点销售额超百万美元的中国卖家数量接近2023年的2倍。</p>\n  <p>盖世小鸡（GameSir）COO赵伟林在采访中表示，公司2022年从欧美转向拉美后，巴西和墨西哥市场增速远超预期，“在巴西完成本地化布局后，销量直接翻了几倍”。IMOU乐橙自2025年入驻亚马逊墨西哥站，其海外电商总监袁维桂透露，今年Prime Day首日销量实现了6倍增长。</p>\n  <p>对于已进入拉美的卖家而言，本地化已不是可选项，而是必答题。赵伟林提到，巴西与墨西哥市场存在显著差异——巴西游戏用户超1亿，以PC和手游为主，对价格敏感；墨西哥Xbox用户渗透率高，消费习惯接近美国。盖世小鸡据此制定了差异化策略：墨西哥主推Xbox授权手柄，巴西主推兼容性更好的PC和手游手柄。</p>\n  <p>物流方面同样需要因地制宜。巴西海运周期长，需提前三个月做备货规划。赵伟林坦言，“现在就要开始规划黑五怎么备货”。目前盖世小鸡已在美国、巴西、新加坡设立分公司，逐步推进本土化布局。</p>\n  <p>IMOU乐橙的本地化更侧重于产品端。袁维桂观察到，拉美安防需求偏向室外场景，用户对长时间不间断录像、多角度监控有强需求。公司据此开发了太阳能供电、AOV（Always On Video）长时间录像、多摄像头等差异化产品，并针对拉美年轻消费者偏爱短视频的特点，在营销端重点发力竖屏短视频。“拉美用户更偏爱视频类媒体，我们紧扣这一特点做营销本土化。”袁维桂说。</p>\n  <p>与此同时，拉美电商的合规门槛正在快速抬升。巴西税改持续推进，合规要求日趋严格。亚马逊中国副总裁、亚马逊全球开店新兴市场负责人张琪认为，这是市场走向规范化的必然过程。“过去这些市场相对粗放，但未来监管只会越来越严，目的是让大家在同一条起跑线上公平竞争。而合规则是长期发展的基础。”</p>\n  <p>卖家对此也有清醒认知。赵伟林认为，清关与税务要求严格的区域反而更具长期潜力。袁维桂则表示，合规是必须迈过的门槛，虽然需要时间与耐心，但并非不可逾越。</p>\n  <p>对于有意进入拉美的卖家，张琪建议从已在欧美市场验证的产品入手，“大多数在欧美市场已被验证的产品，引入新兴市场是相对稳健的策略”。</p>\n  <p>值得注意的是，支付与物流基础设施的完善也在降低拉美市场的进入门槛。张琪提到，早些年本地物流和配送是痛点，但这个情况现已大大改观。例如，亚马逊在墨西哥主要城市已实现当日达；在巴西，亚马逊仅在过去一年就新增了100个物流设施。此外，拉美年轻消费者偏爱分期付款的习惯也有效释放了购买力。</p>\n  <p>这些基建补强，加上庞大的人口基数，让张琪对市场长期增长保持乐观：“正因为是增量市场，进场的人多了，大家反而都能分享到市场扩张带来的红利。”</p>", "category": "tech", "published_at": "2026-06-29T00:49:00+00:00", "fetched_at": "2026-06-29T03:28:21.496073+00:00", "fingerprint": "c50bb4837e2314ad"}, {"source": "36氪 - 最新文章", "title": "港大教授李弘扬创业做通用全身具身大脑，获真格高榕IDG五源等数亿种子轮融资｜硬氪独家", "url": "https://36kr.com/p/3868055841641476?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪独家获悉，通用全身具身大脑公司「源策未来Archon Robotics」近日完成数亿元种子轮融资，本轮投资方包括真格基金、高榕创投、IDG资本、五源资本等头部美元基金，以及戈壁创投与香港大学联名基金、奇绩创投、上海创智学院等。光源资本担任独家财务顾问。</p>\n  <p>本轮资金将主要用于全身人形基础模型研发、多模态全身动作数据采集、人才团队扩充，以及多地研发中心与产业合作生态搭建，加速在今年内实现开源人形基座模型落地。</p>\n  <p>源策未来成立于2026年4月，研发总部位于上海市徐汇区漕河泾开发区。公司专注研发通用全身人形基座模型，构建全身智能（Whole-body Intelligence），为人形机器人提供类人全身移动操作的能力，以加快实现具身智能走入千家万户。</p>\n  <p>创始人李弘扬博士现任香港大学助理教授、计算与数据科学学院助理院长、上海创智学院导师。他主导的端到端自动驾驶项目UniAD获CVPR 2023最佳论文，是近十年来大陆学术机构唯一获此奖项的工作；2026年获机器人领域国际顶会RSS Early Career Award，成为这一奖项设立20年来的首位华人学者。</p>\n  <p>联合创始人兼CEO李天羽博士，为上海创智学院首批毕业生、复旦大学博士，作为核心开发者深度参与华为量产自动驾驶ADS 4.0世界引擎方案研发。联合创始人兼Head of AI陈立博士是UniAD最佳论文的第一作者，本科毕业于上海交通大学致远荣誉工程，曾获香港大学校长博士奖学金。</p>\n  <p>源策核心团队均来自香港大学、清华大学、上海交通大学、复旦大学、浙江大学等头部自动驾驶、机器人与大模型研究团队，兼具原创算法突破与超大规模工业系统落地经验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_5b3df078c3fc4fd4be3c155145ca0d29@6022551_oswg7700027oswg5712oswg4284_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">源策团队在珠峰大本营举杯。摄于2024年2月于珠穆朗玛峰（图源/企业）</p>\n  <p>具身智能行业正步入一个关键的分化时刻。Omdia等公开数据显示，2026年上半年，国内具身智能及机器人领域共发生288起融资事件，披露融资总额超过460亿元，加快逼近2025年全年554亿元的规模。但巨额融资并未同步带来技术共识的收敛。</p>\n  <p>当下多数具身方案存在先天局限：现有训练数据以桌面第一视角视频、单臂或夹爪动作为主，缺失全身重心调整、躯干借力、多肢体协同等人类原生交互逻辑。这意味着，大部分机器人仅能完成固定点位抓取，面对推门、整理床铺、双手持物开关门这类需要全身配合的日常任务，则难以自主适配变量。</p>\n  <p>这一局限的根源在于数据基础设施的结构性缺口。源策未来CEO李天羽告诉硬氪，“市面上可获取的具身数据集看似庞大，实际真正对人形全身训练有效的信息却极为有限。”</p>\n  <p>第一视角视频数据集仅支持记录人眼所看到的画面，蹲下、俯身、侧身等手部表象之外的关键动作位姿信息缺失。机械臂及夹爪等标注数据，则多集中在平面范畴，只记录末端轨迹，模型可以学习操作器如何移动，却难以理解如何与环境互动。而人形真机数据总量本就极低，采集成本更以数百至近千元每小时计，有关全身多关节耦合的复合任务样本在过去的数据池中近乎空白。</p>\n  <p>三类数据各有缺失，指向了同一个问题，人类完成日常动作最核心的信息，即全身如何协调、重心如何转移、力量如何从下肢传导到上肢等，在现有数据中几乎没有被记录过。</p>\n  <p>以一个简单的日常场景为例。当人在拉开一扇轻门和重门时，其手部轨迹几乎看不出差别；都是先抓住把手往后拉，无论使用多大力气，其位姿与门的运动始终同步。真正的差异体现在全身维度，面对轻门，人保持直立即可拉开；遇到重门，身体需要倾斜将重心前移，用体重对抗阻力。</p>\n  <p>这些重心移动的信息，只有在全身数据中才会被记录下来，并蕴藏着物体物理属性的本质差异。简单来说，如果模型长期仅学习单一维度信息，它或许能完成“拉门”这个动作，却无法理解“门有多重”在人体层面意味着什么。</p>\n  <p>“信息的长期缺位，将当前机器人的能力锁定在固定桌面抓取的层面，与真实家庭环境中多样化任务之间，横亘着一道数据断层。”李天羽说，“要突破这层天花板，必须回到源头重新定义数据采集的逻辑。”</p>\n  <p>源策团队认为，从轮式底盘搭配双臂的方案向人形机器人迁移，在结构、运动控制、感知维度上均存在本质差异，并非简单的形态升级。当海外企业刚意识到人形任务的复杂性时，他们已率先将目标锁定于此。</p>\n  <p>源策未来瞄准了一个几乎无人涉足的领域，做通用全身人形基座模型，其核心理念Human Body Learning，即学习人类全身位姿与协调方式，而非仅仅跟踪末端执行器的轨迹。通过在人类的全身动作中，让机器人习得“四肢协调的智慧”，具备完整的全身交互能力。</p>\n  <p>通过将人形机器人的行动“智能”尽可能沉淀在与本体无关的中脑层级，这期间，中脑所学习的能力不绑定某款具体的机器人；它输出的是全身运动轨迹，而非针对某个特定型号的关节角度指令，使模型具备跨不同本体迁移的潜力。随着数据采集越充分、覆盖场景越多样，中脑的表征能力就越强，源策未来具身全身大脑可以迁移到的本体类型也就越广。</p>\n  <p>基于这一判断，源策未来将构建一套全新数据采集体系。创始人李弘扬认为，具身数据的演进路径正从真机遥操作向手持设备与第一人称视角迭代，最终目的地是具备人类完整感知要素、并带有全身动作标签的以人为中心（Human-Centric）全人形数据。</p>\n  <p>同时，源策未来还将引入触觉等多维感知模态，搭配更高精度的全身与手部捕捉设备。李天羽告诉硬氪，数据多样性与数据质量，比单纯的数据规模更为关键。“一条覆盖了重心移动、躯干角度变化的全身数据，其信息密度远高于一百条只有手部轨迹的桌面数据。”</p>\n  <p>数据的采集方式决定了模型能学到什么，模型的能力短板反过来定义了下一次采集的目标。这套“采集-训练-反馈”的闭环一旦运转起来，就会形成一道持续自我强化的数据壁垒：每完成一轮采集和训练，模型能力提升一截，系统对“哪些数据真正有用”的认知也更精准一分，下一轮采集的效率和质量便再上一个台阶。</p>\n  <p>它考验的不仅是算法层面的工程能力，更是对“模型究竟需要从物理世界中学习什么”这一根本问题的系统性理解。而这项理解，正是源策未来最核心的判断力所在。</p>\n  <p>硬氪了解到，源策未来计划于2026年下旬发布其首个人形原生基座模型。</p>\n  <p>在源策未来团队看来，人形机器人要真正从实验室走入家庭，需要的不仅是一次完美的单点演示，而是让机器人具备在复杂、动态、非结构化的家庭环境中持续可靠工作的能力。这种能力的上限，从根本上取决于模型对物理世界的理解深度。</p>\n  <p>源策未来选择回到具身智能的起点重新回答这个问题：用一个什么样的身体、从什么样的数据中学习，决定了机器人最终能走多远。</p>\n  <p><strong>以下为硬氪与源策未来创始人李弘扬博士、CEO李天羽博士的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：当前具身行业尚未进入收敛阶段，源策未来提出做通用全身人形基座模型，这个选择的底层判断是什么？</strong></p>\n  <p><strong>李天羽：</strong>我们的路线和市场上主流方案有两层本质区别。</p>\n  <p>第一是硬件形态。源策未来从立项起就锚定完整的人形机器人，核心要解决的是全身多关节联动和重心动态调节问题。大多数团队选择轮式底盘加双臂，从工程角度可以理解，稳定性好、技术门槛相对低、短期内容易出demo。但回到家庭场景，轮式底盘连门槛都过不去，更不用说蹲下、爬高、侧身钻缝隙这些日常操作。人形不是一个选项，是终局的必然形态。</p>\n  <p>第二是底层模型架构。我们做的是专属的人形原生具身大模型，不是拿已有的VLA或世界模型来做微调。这两者的区别在于，前者是从全身数据中学习人类与物理世界交互的底层逻辑，后者是教模型如何在固定桌面上移动一个物体。源策未来的模型架构从第一天起就为全身运动设计，大脑负责任务理解和长程规划，中脑学习跨本体的全身运动表征，小脑负责实时位姿跟踪与平衡维持。三层协同，输出的是全身运动轨迹，而非单纯的末端指令。</p>\n  <p>基于这一路线，我们搭建了独立的数据采集链路。一边大规模采集普通人在真实场景下的全身动作数据，一边搭配人形真机实操数据联合训练，让模型复刻人类与生俱来的全身协调交互能力。</p>\n  <p>源策要构建人能真正面向无预设家庭环境的人形大脑。机器人需要自主感知周边变化，随机处理各类差异化任务：物品轻重、摆放位置、房间布局随时在变，没有固定脚本。它的核心诉求是极强的泛化与迁移能力，学会一套逻辑，就能应对千百种不同场景。</p>\n  <p><strong>硬氪：你曾在公开采访中将当前具身智能行业的发展水平，类比为自动驾驶的L1.5阶段，其依据有哪些？具体对应哪些维度？</strong></p>\n  <p><strong>李弘扬：</strong>我们可以借用自动驾驶L1到L5的分级逻辑来理解具身智能的演进。L1是基础的遥操作，有限泛化；真正达到L2，系统才能脱离人工干预，在特定场景下自主完成完整的操作闭环。</p>\n  <p>对照当下的具身行业，绝大多数公开演示本质上仍是远程遥操或高度预设的脚本执行，绝大部分动作、物体位置、环境布局都提前固定，更换任意变量系统就失效。没有任何一款产品能够脱离人工干预，自主处理多步骤、多变化的连续居家任务。</p>\n  <p>所以这个L1.5阶段的判断意味着，行业能做出单点任务的demo，但离“特定场景下的完全自主”还有距离。跨过这道门槛的关键在于数据，然而，现有数据集里没有包含人形机器人在真实家庭环境中自主决策和全身协调所需的信号。只靠现在这些数据继续堆模型规模，是到不了L2的。</p>\n  <p>要跨越这道鸿沟，必须重新定义数据采集的逻辑，从“采集单一视角下的机器人运动”转向“采集全身如何与环境互动”，从“预设场景下的固定任务”转向“开放世界中的多样化探索”。这也是源策Day One就要做的事。</p>\n  <h4>投资方评论：</h4>\n  <p><strong>真格基金董事总经理秦天一</strong>表示，和李弘扬相识多年，我见证了他带团队攻克最难且重要的课题，从UniAD到BEVFormer，再到源策的愿景“通用全身人形基座模型”。他们从不chase benchmarks，而是坚定地push boundaries。更难能可贵的是，李弘扬创立的OpenDriveLab俨然成为自动驾驶与具身智能领域的人才山谷，成长出了一批斗志昂扬的顶尖青年学者，源策联合创始人李天羽和陈立正是其中的杰出代表。</p>\n  <p><strong>高榕创投合伙人辛旺</strong>表示，我们非常喜欢李弘扬老师带领的源策智能团队，有纯粹的技术理想，有深刻的insights，有创新引领的勇气，绝不做follower。智驾方向的UniAD、BEVFormer、WorldEngine，具身方向的Agibot、WholeBodyVLA、Ego-humanoid等，都不断证明源策团队有持续创新、做出世界影响力成果的能力。今天，源策又选择了一条难而正确的路，挑战人形机器人全身灵巧操作大脑的难题。我们很高兴能参与到源策的事业中来，期待源策成为世界级的具身大脑公司。&nbsp;</p>\n  <p><strong>五源资本合伙人孟醒</strong>表示，2023年我在做自动驾驶时认识弘扬，那时UniAD刚拿下CVPR最佳论文，是行业里最轰动的事件。让我服气的不是奖杯，而是他提问的方式：当所有人都在各自的模块里卷，他从planning这个终极目标出发，反推系统该长什么样，拉通一切模块的backbone，让一切服务于最后的planning。三年后的源策，还是那个弘扬。别人问\"现有数据能训出什么\"，他在问\"机器人该向人类学什么\"。Human Body Learning之于具身，正如当年planning-oriented之于自动驾驶——都是用终局定义起点。今天的具身智能不缺钱、不缺工程师、不缺算力，唯独缺这种taste：在喧嚣里分辨什么值得做。我认为最珍贵的，是一个人穿越两次技术浪潮、始终把问题问对的判断力。</p>\n  <p><strong>戈壁创投董事总经理及大学创���总经理李冠乐</strong>表示，源策未来并非传统机器人企业，而是一家依托算法与数据引擎驱动的硅基具身智能公司。团队拥有稀缺的行业技术范式定义能力，依托自研原创算法与成熟的工程落地实力，在赛道标准尚未统一的当下，有望成长为物理通用人工智能领域的底层技术基座。戈壁创投也将持续加码支持香港大学科学家的创业项目。</p>", "category": "tech", "published_at": "2026-06-29T01:27:07+00:00", "fetched_at": "2026-06-29T03:28:21.496066+00:00", "fingerprint": "286cdcbd09646c99"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 「CAYE咖爷科技」完成近4亿元B轮融资，系商用全自动咖啡机赛道单笔最大规模融资", "url": "https://36kr.com/p/3872276297618436?f=rss", "summary": "<p>作者 | 钟艺璇</p>\n  <p>36氪获悉，商用全自动咖啡机品牌「CAYE咖爷科技」已完成近4亿元B轮融资，本轮融资由老股东美团龙珠领投，柏睿资本、高瓴创投、苏创投等机构联合跟投。这也是目前商用全自动咖啡机赛道规模最大的单笔融资。&nbsp;</p>\n  <p>CAYE咖爷是36氪持续关注的公司，该公司成立于2022年12月，围绕自研&nbsp;Bionic Barista&nbsp;仿生咖啡师系统，CAYE咖爷对咖啡研磨、粉重控制、布粉填压、加压萃取等核心工艺进行重新设计，重新定义商用全自动咖啡机。&nbsp;</p>\n  <p>目前，CAYE咖爷的咖啡机产品已经进入精品连锁咖啡、商业连锁咖啡门店，其中不乏国内知名咖啡连锁品牌。CAYE咖爷还在同步拓展海外市场，产品已经覆盖全球80多个国家和地区。</p>\n  <h3><strong>回到一杯咖啡最基础的问题：食品安全</strong></h3>\n  <p>过去几年，中国咖啡行业高速增长，但对于上游设备而言，行业讨论更多围绕成本、效率与自动化，很少有人重新追问一个更基础的问题：一杯咖啡，到底够不够安全？</p>\n  <p>事实上，目前多数定位中低端的商用咖啡机为压缩生产成本，核心冲泡模组选用低成本的POM塑料，在商用场景高温、高压、高频次出杯的强度下，塑料部件极易老化水解，不仅增加售后更换成本，同时可能会持续析出有害物质。</p>\n  <p>而这类商用咖啡机，正是国内多数主流咖啡品牌所使用的品牌机型。一面是行业广泛的应用，一面是隐蔽性极强的食安问题，这些都将成为潜藏的健康风险。</p>\n  <p>此外，传统设备萃取稳定性差，存在计时落粉误差大、布粉不均匀的问题。一旦更换咖啡豆、环境温湿度波动，乃至设备老化都会大幅改变咖啡口感，这种前提下，传统设备极为依赖专业人员调试，很难实现长期高品质标准出品。</p>\n  <p>咖爷创始人吴鹏向36氪提到，过去全球商用咖啡机市场长期由海外品牌垄断，但国产化设备的崛起，正在重构行业安全和制造标准。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_fca114d013a547e390be33877f045aef@5971123_oswg2950444oswg1982oswg1320_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">咖爷产品图</p>\n  <p>与行业普遍采用大量塑料件不同，咖爷几乎重构了整机设计，全系设备核心冲泡模组均采用食品级金属材质，整机90%以上采用金属部件，从硬件源头规避塑料老化可能带来的食品安全风险。</p>\n  <p>“食品安全是最基础的问题。” 吴鹏告诉 36 氪，“今天整个咖啡行业发展得轰轰烈烈，但如果我们连最基础的食品安全都不能保证，再先进的萃取技术都失去了落地的意义。”</p>\n  <p>另外，在粉重控制上，相较于以往固定研磨时间、粉饼压体积称重的方法，咖爷自研&nbsp;APW&nbsp;高精度粉重称重系统，单杯粉重误差控制在 ±0.2g，解决传统计时落粉偏差造成的口感波动。以咖爷Smart Y产品为例，其达标率能达到95%以上，而行业合格达标率是70%。</p>\n  <p>这些技术最终落到门店运营层面，则意味着更低的成本。以一家日均出杯约500杯的门店为例，采用AccuPowderWeigh粉重控制系统后，每年可节省约300公斤咖啡豆，运营成本降低近3万元。</p>\n  <p>相比之下，传统全自动咖啡机单次研磨偏差往往超过1克，每制作50至100杯咖啡便需要重新调磨三四次，大量测试咖啡粉最终只能被浪费。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260628/v2_07f4df507acd4d16a13a338f889ffe2a@5971123_oswg904278oswg1912oswg1068_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">咖爷自研&nbsp;APW&nbsp;高精度粉重称重系统</p>\n  <h3>唯一敢于整机拆解的商用咖啡机</h3>\n  <p>不同于海外整机厂商分工割裂、核心零部件外部采购的行业惯例，CAYE&nbsp;咖爷是赛道内唯一实现核心零部件全流程自主研发的国产品牌。</p>\n  <p>欧洲老牌咖啡机企业产业分工边界清晰，研磨模组、刀盘、称重传感器、主控电路板均由不同供应商单独供应，整机厂商仅做组装整合；而咖爷从原材料、核心零件、传感控制系统到整机完成全链条自研，实现技术自主可控。</p>\n  <p>在核心部件研发上，咖爷实现跨行业技术跨界落地——陶瓷刀盘联合苏州纺织机轴承配套厂商联合开发，而机身壳体、称重传感模块等核心组件，则融合纺织设备、医疗器械、新能源汽车等高精密制造供应链能力。新能源、汽车行业的产业链研发投入规模，是商用咖啡机赛道的上万倍，咖爷将成熟高精制造体系下沉至咖啡设备细分赛道，形成降维创新优势。</p>\n  <p>“新能源汽车产业链的研发投入，可能是整个咖啡机行业的一万倍。我们希望利用更成熟、更先进的供应链能力，重新做一台商用咖啡机。”吴鹏告诉36氪。</p>\n  <p>截至目前，咖爷累计申请专利超&nbsp;300&nbsp;项，发明专利占比超&nbsp;40%，技术成果转化率突破&nbsp;70%。咖爷的多项自研核心系统也构成了完整技术矩阵——自研&nbsp;APW&nbsp;高精度粉重称重系统，将单杯粉重误差控制在±0.2克；自研VVD&nbsp;垂直震动布粉系统，让粉床更加均匀，减少萃取通道效应；CLS&nbsp;全自动萃取闭环校准系统实时采集萃取数据，自动适配不同咖啡豆、门店温湿度环境，无需人工反复调试；配合&nbsp;SuperMix&nbsp;智能奶沫系统，进一步提升冷热奶泡稳定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260628/v2_1347d5ad056a40ff8de14ccd4bfef3b4@5971123_oswg438049oswg1280oswg686_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">咖爷完整技术矩阵</p>\n  <p>近年来，咖爷科技的身影频繁出现在全球顶级行业展会上，包括上海 HotelEX 酒店用品展、意大利米兰 HostMilano 国际酒店展、美国芝加哥 NRA Show 等海内外权威行业展会。</p>\n  <p>“行业展会期间，我们是全场唯一敢把整机全部拆解，将核心零部件、内部模组完整展示给客户与同行的品牌。” 吴鹏介绍，完整自研的底层技术底气，让咖爷敢于公开全部硬件构造，接受全行业专业检验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260628/v2_0c563b4197a34231b2e4534060746566@5971123_oswg803863oswg1280oswg720_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">咖爷参与行业展会</p>\n  <p>在产品层面，咖爷参照特斯拉&nbsp;SEXY&nbsp;系列搭建分层完整产品矩阵，该命名理念源自“Smart is the new SEXY”，以安全化、智能化、标准化硬件覆盖便利店、精品咖啡馆、企业茶水间等全商用场景，形成覆盖高中低端、适配多元渠道的完整产品线布局。</p>\n  <p>市场端，咖爷科技&nbsp;X&nbsp;系列主力机型现已销往全球&nbsp;80&nbsp;多个国家和地区。在国内市场，今年&nbsp;X&nbsp;系列整机全年销量，已超越同级进口品牌过去十余年在国内市场的销量总和。</p>\n  <p>产能上，咖爷科技苏州现有生产基地规划年产能目前已超&nbsp;4&nbsp;万台，同时还在建&nbsp;38000&nbsp;平方米全新智能化生产基地，计划&nbsp;2028&nbsp;年建成投产后，达成年交付&nbsp;10&nbsp;万台的产能目标。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260628/v2_6541a8e860744197be54864312023544@5971123_oswg79124oswg1280oswg775_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">咖爷 SEXY全产品系列</p>\n  <p>36氪还了解到，本轮融资金额将主要用于核心技术研发、生产基地扩建、海内外市场拓展以及全球售后服务体系建设。</p>\n  <p>吴鹏表示，未来，公司将继续推动行业淘汰存在安全隐患的塑料冲泡方案，普及食品级金属安全标准，希望借助自研硬科技，让商用咖啡机重新回归它最初的使命——让更多人喝上一杯健康、安全的好咖啡。 &nbsp;</p>", "category": "tech", "published_at": "2026-06-29T02:18:44+00:00", "fetched_at": "2026-06-29T03:28:21.496057+00:00", "fingerprint": "33d7995333c518d2"}, {"source": "36氪 - 最新文章", "title": "秋声 | 海光芯正IPO背后，卖铲生意为何越做越亏？", "url": "https://36kr.com/p/3873681978840071?f=rss", "summary": "<p>本文约2500字，建议阅读5分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>AI大爆发之际，越来越多公司走向资本市场。每一份招股书翻动的声音里，都藏着一家公司想说与未曾明说的全部。</p>\n   <p>鉴于此，硬氪特推出「秋声」专栏。秋声取自欧阳修《秋声赋》，借“听秋声”之意，产业冷暖，辨公司成色，记录企业冲刺IPO途中那些被写下与被隐藏的真实。这是我们第四期，海光芯正。</p>\n  </blockquote>\n  <p>6月29日，北京海光芯正（01191.HK）正式在港交所敲钟上市，此次IPO招股价114港元，每手50股、入场费5757.48港元。按发售价计，公司市值约102.08亿港元，募资净额约14.15亿港元。</p>\n  <p>开盘涨74.56%，报199港元，市值178亿港元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_8381fe81ccee4383a7e24e00ee8bec58@430412560_oswg648319oswg1080oswg2341_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>海光芯正是一家光电互连产品提供商，主要提供光模块、AOC（有源光缆）、AEC（有源电缆），产品广泛应用于AI数据中心，以支持高速、高密度和高能效的数据传输。在这轮AI算力军备竞赛里，光模块是卖铲子的好生意：A股的“易中天”（中际旭创、新易盛、天孚通信）两年涨出近2万亿市值，是这波行情的领头羊。</p>\n  <p>海光芯正的“硅光子”——把光器件和电子集成在一块硅芯片上，被业界视为下一代光互连方向。其招股书也称具备“从芯片设计到光模块制造”的端到端能力。听上去，海光芯正是个含着金钥匙的硬科技标的。</p>\n  <p>但硬氪翻完421页招股书后发现，海光芯正故事远比\"硅光第一股\"复杂得多：收入两年翻了近7倍、毛利率却只有9%、经营现金两年烧掉7个亿。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_b20d5386ff5d4dc08ab4fcfb962c7419@430412560_oswg49592oswg1080oswg461_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_744bddcc66074256911d08a021c77bce@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>一门毛利只有9%的苦生意，增收不增利</strong></h2>\n  <p>海光芯正2023年到2025年收入分别为<strong>1.75亿、8.62亿、12.21亿元</strong>，三年复合增速163.9%，两年增长约597%。如果只看营收，海光芯正业绩完全属于爆发状态。但增长的另一面，是利润始终没跟上：</p>\n  <p><strong>毛利率</strong>：2023年为-<strong>17.9%</strong>，2024年转正到11.8%，2025年<strong>回落到9%</strong>。收入翻倍，毛利率不升反降。</p>\n  <p><strong>净亏损</strong>：2023年亏1.09亿、2024年亏损收窄至1789.5万、2025年亏损又扩大到<strong>1亿元</strong>。</p>\n  <p>也就是说，2024年的接近盈亏平衡只是假象。毕竟一年后，收入虽然涨了42%，但净亏损从1789.5万扩大到1亿。为什么一家收入冲到12亿的公司，做得越大越亏？原因就在于它卖的是一门毛利率只有个位数的辛苦生意。</p>\n  <p>从收入构成来看，海光芯正主要有三种：<strong>JDM模式（联合设计制造），</strong>客户授权用它的设计和专利，海光负责定制开发+量产。2025年收入5.52亿、占45.3%，但<strong>毛利率只有3.1%，</strong>2024年还有有11.9%；<strong>ODM（贴牌代工），</strong>按客户规格做、贴客户的牌卖到海外。2025年收入0.49亿、占4%，<strong>毛利率高达48.7%；自有品牌（PL）</strong>：贴自己的牌卖。2025年收入6.19亿、占50.7%，毛利率11.1%。</p>\n  <p>到这里就能发现，<strong>撑起海光芯正收入大盘的，</strong>是毛利率3.1%的JDM和11.1%的自有品牌。而唯一有近50%毛利的好生意ODM，收入却几乎腰斩，从2024年的0.94亿萎缩到2025年的0.49亿。</p>\n  <p>为什么JDM毛利率这么薄？招股书表示：JDM主要服务国内大型下游客户，该模式一般涉及较低定价。翻译过来就是给国内互联网大厂做定制光模块，量大、压低价、毛利薄。海光芯正用一门3%毛利的代工，换来了规模和大客户名单，但也把整体毛利率限制在了个位数。</p>\n  <p>回到产品线也能看到一样逻辑：2025年<strong>光模块收入9.24亿、占75.7%，毛利率却只有6.7%</strong>（2024年还有12.4%）。收入贡献最多，毛利却最薄；AOC收入2.48亿、占20.3%，毛利率17.4%。</p>\n  <p>薄毛利之外，还有集中度风险。2025年前五大客户贡献78.7%收入，最大单一客户占21.0%。虽然第一大客户占比从2023年的48.3%降了下来，但前五大客户常年七成以上。此外，2025年前五大供应商占采购56.6%，单一最大供应商占28.4%。海光芯正的制造高度依赖外部光芯片、电芯片等核心物料，而这些目前仍以海外供应为主、行业性紧缺。这也是其存货高企、预付增多的一个原因。同时，招股书称自2022年起，有一家全球领先的互连解决方案提供商<strong>同时是前五大客户和前五大供应商之一</strong>。</p>\n  <p>还有一个被忽略的细节是：海光芯正收入正在从海外撤回国内。美国收入占比从2023年的48.4%一路降到2025年的<strong>7.7%</strong>，而中国内地从43.4%升到<strong>90%</strong>。问题在于，海外生意的毛利率远高于内地。2025年海外毛利率是28%，内地只有6.9%。高毛利的海外在退出，低毛利的内地在增加，毛利率怎能不持续承压。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_9df6aad730c248c49b42d278926db501@430412560_oswg24177oswg1080oswg251_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>如果说利润表只是一个切口，那现金流量表就是海光芯正最真实的业绩体现。2023-2025年，海光芯正<strong>经营活动现金流净额分别为−0.91亿、−2.55亿、−3.59亿元</strong>，连续三年不但为负，而且流出越来越多，三年累计净流出约<strong>7.05亿元</strong>。有意思的是，一边收入暴涨，一边经营性现金哗哗外流，那钱去哪儿了？硬氪发现就藏在存货和应收账款里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_34913ab88b7d4aee84ac958701c22f7d@430412560_oswg49129oswg1080oswg621_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>其2025年<strong>存货周转天数180.8天、</strong>2024年141.3天；2025年<strong>应收账款周转82.6天、</strong>2024年51天；去年应付账款也被拉长到82天。现金转换周期接近半年，且2025年集体走差。负债权益比率2024年一度冲到247%，相当于现金被营运资金和扩产死死拖住。</p>\n  <p>那海光芯正靠什么活下来？靠融资。2023-2025年<strong>融资活动现金流入分别为0.72亿、4.11亿、7.33亿元</strong>，年末现金及现金等价物从0.33亿到3.34亿。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_703012f05e404aeeb3046de6800a9bf7@430412560_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>成立15年融资9轮，苏州国资成最大赢家</strong></h2>\n  <p>海光芯正第一笔天使轮融资是在成立第二年完成，上市前最后一轮F+轮融资于2025年完成。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_3ca15e293bf7496a9e47c499ff1029ea@430412560_oswg248136oswg1080oswg619_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>注：苏州融联创投、聚昇创投、金谷源鑫、苏州汇琪同属<strong>苏州金合盛</strong>（苏州虎丘区政府国资）旗下；苏州协立创投、苏州君实协立、君鼎协立同属<strong>云杉资本</strong>（江苏交通控股全资国资）旗下；江苏高投邦盛、邦盛聚源、苏州邦盛赢新同属<strong>邦盛投资管理</strong>系。</p>\n  <p>这张融资表里藏着两个反差。<strong>第一个反差是，D轮估值被A股上市故事撑起，之后的5年几乎原地踏步。</strong>具体来看，海光芯正在2020年9月完成D轮后，估值从C轮的5.9亿暴涨到18亿（每股30元）。这次估值大幅上升，部分是因为海光芯正筹备A股上市。可A股这条路走了近五年都没结果，2025年8月才终止辅导，进而改道香港。比较遗憾的是，其从2020年D轮到2025年F+轮，估值仅微涨至26.6亿，对应每股34.95元。相当于<strong>整整五年，每股成本只涨了约16.5%</strong>，而同期收入暴涨了近7倍。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_beb4e6ce15344119bfcf8d808a18bf33@430412560_oswg36037oswg1080oswg481_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p><strong>第二个反差是，最大赢家不是阿里小米而是更早进场的国资。</strong>从入股成本看，账面浮盈最厚的是2012–2015年就押注的早期投资者。比如天使轮每股2.79元、A轮3.38元，相对114港元发售价折让97%、96%，浮盈以三十倍计。这些机构属于<strong>苏州、江苏国资：</strong>苏州金合盛，背后是苏州虎丘区政府的国有体系；云杉资本，江苏交通控股全资；天津泰达、苏州工业园区的元禾和启纳等。</p>\n  <p><strong>元禾系作为海光芯正的早期股东</strong>，当年曾孵化出中际旭创。同一拨苏州国资，十几年前押中了今天的万亿龙头，如今又出现在海光的股东名册上，很有意思。</p>\n  <p>反而阿里2022年才进入，每股成本33.33元；小米2024年进入，每股成本34.31元。即来得晚、买得贵，到IPO的账面回报仅2.8倍。</p>\n  <p>值得留意的是，F+轮之后的2025年9月。A股上市公司中天科技，还从老股东手里受让了股份，每股成本39.42元，产业资本在临门一脚进场。</p>\n  <p>海光芯正创始人、董事长兼CEO<strong>胡朝阳博士</strong>，今年56岁，典型的技术派、硅光技术里成长：北航电子工程学士、清华精密仪器与机械博士；2000–2006年先后在美国马里兰大学做博士后、在加州大学圣芭芭拉分校（UCSB）做研究科学家；之后在美国光通信公司Oplink、Source Photonics担任工程总监和主管，光电互连行业超过20年经验，个人持有多项美国发明专利。</p>\n  <p>CTO<strong>孙旭博士</strong>，瑞典皇家理工（KTH）光电学博士，<strong>加入前是华为的硅光高级工程师</strong>；供应链副总经理<strong>郭青松</strong>此前在<strong>淘宝（中国）和阿里云飞天</strong>任职。而阿里，又投资了海光芯正。</p>\n  <p>有意思的是<strong>海光没有控股股东。</strong>胡朝阳连同两个员工持股平台（苏州海怡、苏州海旭）发行后合计只持有<strong>17.95%</strong>，构成单一最大股东。其余股权高度分散在苏州系、江苏系、北京国资以及阿里、小米等机构手里。上市后控制权相对松散。</p>\n  <p>此次IPO全球发售1343.15万股H股，仅占发行后股本约15%。其中香港公开发售只占发售的10%、约<strong>总股本的1.5%</strong>（招股书P256）。6家基石合计认购7.63亿港元，占发售49.85%、占总股本7.48%，全部锁6个月。拆开看，最大的两家是<strong>JSC/Jingxin SP，认购2.5亿。</strong>实际为北京能源集团旗下，且是现有股东京信发展基金、经开区基金的紧密联系人；<strong>双赢科技，认购2亿。</strong>属于佰维存储全资，也是海光的CPO/NPO战略合作伙伴；金山云认购0.39亿，带战略色彩。剩下的<strong>UBS资管认购1.57亿、Perseverance认购0.78亿、易方达认购0.39亿</strong>，合计约2.74亿、占基石三成多。</p>\n  <p>按发行市值102.08亿港元计算，比最后一轮增长三倍。2025年收入12.21亿，<strong>静态市销率约7.2倍</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_1be00c23b8ac479bae31530434e7b888@430412560_oswg78668oswg1080oswg254_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>光看市销率，海光芯正7倍远低于A股龙头的二三十倍，像个估值洼地。但<strong>中际旭创、新易盛是毛利率超40%、年净利上百亿、全球市占数一数二的盈利巨头；</strong>海光毛利率仅9%、净亏1亿、全球份额仅0.8%（排第十七）。盈利质量差距大不说，A股估值溢价也远高于港股。</p>\n  <p>站在AI光互连风口上，海光芯正故事足��有吸引力。赛道也确实够大，全球硅光光模块市场2025年约631亿元，预计2030年达2633亿元。但风口不等于已经起飞，毕竟和A股那些百亿净利的龙头盈利能力还差几个量级。资本市场如何定价，只有上市后才能见分晓。</p>", "category": "tech", "published_at": "2026-06-29T03:13:49+00:00", "fetched_at": "2026-06-29T03:28:21.496040+00:00", "fingerprint": "3f476a8b56954024"}, {"source": "少数派", "title": "兜兜转转四款笔记软件，我终于为思考找到了安身之所", "url": "https://sspai.com/post/110935", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/110935\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-28T07:00:12+00:00", "fetched_at": "2026-06-29T03:28:19.520050+00:00", "fingerprint": "c64a56bb82b637ad"}, {"source": "少数派", "title": "派早报：微软改口称 8GB 足够运行 Windows 11", "url": "https://sspai.com/post/111639", "summary": "<p>微软改口称 8GB 足够运行 Windows 11</p><p>OpenAI 发布 GPT 5.6，称需美国政府批准提供对象</p><p>Notion Mail 宣布关闭</p><p>央视报道网络测评乱象</p><p>苹果、奥迪前员工推出豪华电瓶车</p><p>俄罗斯主流应用被苹果下架，克宫呼吁改用 Android</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/111639\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-28T23:13:43+00:00", "fetched_at": "2026-06-29T03:28:19.520038+00:00", "fingerprint": "01aab68ac7a05e90"}, {"source": "BBC World News", "title": "Israel strikes southern Lebanon as Hezbollah condemns new deal", "url": "https://www.bbc.co.uk/news/articles/cx2kpn0eeweo?at_medium=RSS&at_campaign=rss", "summary": "Strikes have killed at least one person, state media say a day after Lebanon and Israel signed a framework agreement.", "category": "politics", "published_at": "2026-06-27T21:35:40+00:00", "fetched_at": "2026-06-28T  "summary": "Kai Wright is the co-host of Stateside with Kai and Carter over at the Guardian. But Wright has been bringing his unique insights to listeners for years. He's also hosted Notes From America, The United States of Anxiety, and Indivisible. He's a Peabody Award-winning journalist who has profiled powerful men, explored what it means to [&#8230;]", "category": "tech", "published_at": "2026-06-27T15:15:00+00:00", "fetched_at": "2026-06-28T03:23:46.516386+00:00", "fingerprint": "368ad2a05d1a72d2"}, {"source": "The Verge", "title": "Apple wants permission to buy memory from a blacklisted Chinese supplier", "url": "https://www.theverge.com/tech/958707/apple-ram-buy-memory-blacklisted-china-cxmt", "summary": "Apple is looking to alleviate some of the pressure on its supply chain by seeking an exception from the Trump administration to buy RAM chips from CXMT, a company blacklisted by the Pentagon over ties to the People's Liberation Army, according to the Financial Times. The skyrocketing prices of RAM and storage have driven Apple [&#8230;]", "category": "tech", "published_at": "2026-06-27T17:28:18+00:00", "fetched_at": "2026-06-28T03:23:46.516380+00:00", "fingerprint": "dfcf3c7896d1cdb3"}, {"source": "The Verge", "title": "Margaret Atwood says the problem with AI is &#8216;garbage in, garbage out&#8217;", "url": "https://www.theverge.com/ai-artificial-intelligence/958715/margaret-atwood-ai-problem-garbage-in-garbage-out", "summary": "Maraget Atwood, the storied author of The Handmaid's Tale and The Blind Assassin, was interviewed as part of the Babell Literary and Cultural Festival in Porto, Portugal. As it usually does at these things, the issue of AI came up, and Atwood didn't mince words. According to Deadline's recap, Atwood said she'd used an AI [&#8230;]", "category": "tech", "published_at": "2026-06-27T18:39:32+00:00", "fetched_at": "2026-06-28T03:23:46.516373+00:00", "fingerprint": "bd4103dcd79b7df2"}, {"source": "The Verge", "title": "Teenage Engineering adds lo-fi mode, USB audio, and more to its KO II sampler", "url": "https://www.theverge.com/entertainment/958723/teenage-engineering-os-25-ep-133-ko-ii-sampler", "summary": "Teenage Engineering has already issued multiple substantial updates for its surprisingly capable $329 EP-133 KO II sampler. Its latest is one of the biggest yet. OS 2.5 adds audio over USB, selectable sample rates for lo-fi fun, sample reverse, an arpeggiator, equal-length autochopping, and it extends the maximum length of a sample from 20 seconds [&#8230;]", "category": "tech", "published_at": "2026-06-27T21:20:32+00:00", "fetched_at": "2026-06-28T03:23:46.516362+00:00", "fingerprint": "4a2024986595fb2c"}, {"source": "36氪 - 最新文章", "title": "秋声 | 大秦储能冲港股IPO：锂价50万山顶囤货血泪史，亏本三年才清完", "url": "https://36kr.com/p/3871109381035011?f=rss", "summary": "<p>本文约2500字，建议阅读5分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>AI 大爆发之际，越来越多公司走向资本市场。每一份招股书翻动的声音里，都藏着一家公司想说与未曾明说的全部。</p>\n   <p>鉴于此，硬氪特推出「秋声」专栏。秋声取自欧阳修《秋声赋》，借“听秋声”之意，观产业冷暖，辨公司成色，记录企业冲刺 IPO 途中那些被写下与被隐藏的真实。这是我们第三期，大秦数字能源。</p>\n  </blockquote>\n  <p>6月26日，储能公司大秦数字能源向港交所递交了上市申请。</p>\n  <p>2025年，大秦数字能源收入<strong>25.25亿元，同比增长244.3%</strong>；毛利率从2024年的-19.9%反弹到23.2%；净利润由2024年的亏3.78亿元转为盈利<strong>1.25亿</strong>。一家刚从“亏损”爬出来的公司，转头就来敲港交所的门了。</p>\n  <p>大秦数字能源的毛利率，怎么会在2024年做到-19.9%？硬氪从368页招股书里进行了一一拆解。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_6cb8d0257b294b54b2b54c8e20e07fe9@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>锂价豪赌失败，最高位疯狂囤货导致爆亏</strong></h2>\n  <p>故事的起点要回到2022年。当时碳酸锂价格在历史高位——按公开数据，2023年初电池级碳酸锂还在每吨50万元上。大秦在这个价位上大量采购电芯，并用这批高价电芯，于2022到2025年间生产了<strong>28.4万台户用ESS电池</strong>，招股书称之为“旧有存货”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_778a224de4a74a68ac144a749fa66f51@430412560_oswg414644oswg850oswg478_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>赌注下完，市场却变了。一方面，欧洲分销商当初基于过度乐观预测给出的订单，实际兑现时远低于预期，导致整个欧洲户用储能供过于求；另一方面，2023年碳酸锂价格一路从50万元每吨暴跌至年末的10万元每吨，全年跌幅超过80%。2024年碳酸锂全年均价9.1万元每吨，较2023年再跌约65%。招股书也披露道：LFP电芯市场价2023、2024连续两年同比降幅约40%至50%。</p>\n  <p>结果就是，大秦那批用山顶价造出来的电池，只能在欧洲市场进行低价大甩卖。<strong>2023年，</strong>低价甩卖11.37万台旧存货，对未售出的15.3万台计提存货撇减4700万元；<strong>2024年，</strong>再甩卖10.82万台，仅这部分就录得毛损<strong>1.3亿元。</strong>剩余6万台再撇减8140万元。叠加给分销商的价格优惠，最后造成全年毛利率-19.9%，其中高压电池毛利率甚至高达-80.6%；</p>\n  <p><strong>2025年</strong>，大秦清掉最后6万台旧存货，毛损3160万元；至2025年末，<strong>所有旧有存货已清零</strong>，自此这批存货不再计提减值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_0a938457a16c40048f6bd959bf735e66@430412560_oswg43091oswg1080oswg382_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>到这里就能看出，大秦2023-2024年的“亏损黑洞”，本质上不是经营能力问题，而是一次<strong>对锂价周期的误判。</strong>原材料最高位时，疯狂囤货且极度乐观。大秦自己也承认“我们自身在预测、存货规划及定价方面应对不足”。</p>\n  <p>那2025年的暴涨扭亏，又是咋回事呢？主要源于旧货清完、锂价企稳、欧洲需求回暖，三件事同时发生。毛利率最后才能反弹回23.2%。换句话说，<strong>2025年的亮眼，一半是经营恢复，一半是甩掉了拖后腿的历史包袱。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_3ce7e1dd19d6405c822b032794322bbe@430412560_oswg17530oswg812oswg306_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>整体业绩之外，硬氪从大秦的收入结构里，还看到了两次剧烈漂移。<strong>第一次是产品线。</strong>户用ESS始终是基本盘，但工商业ESS有快速崛起。户用ESS在2023年占收入99.3%，2025年降至75.7%。绝对额从7.18亿涨到19.11亿；工商业ESS在2023年占比仅仅0.2%，2025年暴涨至<strong>23.9%，即6.03亿元</strong>，毛利率33.2%，<strong>比户用ESS的20.1%还高</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_c18e5d75458d45ea863d012123e7e7b8@430412560_oswg583161oswg854oswg470_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>第二次是国内外占比。</strong>2023年，大秦还是一家中国内地占六成的公司。到2025年，<strong>95.1%的收入来自境外，光欧洲一个市场就占了61%</strong>。大秦自我定位是“首批专注海外ESS市场的中国企业之一”，按2025年出货量算，是全球第五大户用ESS提供商。这也意味着：大秦<strong>的命脉，牢牢和欧洲家庭的储能需求、欧洲电价、电网政策挂钩</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_e1f7852dfde445b6adb7284c67a4d037@430412560_oswg15463oswg676oswg354_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>除了地区依赖，大秦的<strong>渠道依赖也很强</strong>。其几乎完全靠分销商卖货，2023、2024、2025年分销商销售占比分别为86.4%、92.5%、<strong>98.2%</strong>。截至2025年末，大秦分销商总数503家，但流失高。2024、2025年分别解约了141家、278家。在前五大客户中收入占比中，已经从2023年的71.3%（最大单一客户曾占46.4%）回落到2025年的24.1%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_a442ea8035834123af1678514739167e@430412560_oswg35586oswg1080oswg318_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>这个商业模式导致经营活动净现金流波动剧烈，2023年净流出2.13亿元、2024年加大流出3.77亿元、2025年净流入8130.5万元。</p>\n  <p>融资活动所得现金净额中，最近三年分别为10.7亿元、1.65亿元、3167.5万元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_b86d1c35d94e42aab45cedb3fcaaa440@430412560_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>四轮融资11亿元，有股东IPO前原价离场</strong></p>\n  <p>招股书称，2023年主要融资活动为附有优先股的投资者出资10.05亿、借款5.5亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260627/v2_9302b9b98b53419fb9e78a5c361c6845@430412560_oswg84875oswg1080oswg244_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从融资表看，大秦有过四次融资，具体来看：</p>\n  <p>2022年仅半年时间，其A轮到A+轮估值就翻了近4倍；2023年B轮和C轮，估值再抬升到<strong>47.05亿</strong>。四轮外部股权融资合计约<strong>11.3亿元</strong>。</p>\n  <p>2022年12月，大秦计划<strong>在A股上市</strong>，申报的是深交所创业板，还聘了海通做辅导。2023年7月开始上市辅导后，就再无消息，直到此次港股IPO。</p>\n  <p>值得一提的是，C轮出现了中金系（中金上汽、中金智科）、路威凯腾（L Catterton），都是明星机构。但C轮发生在2023年6月，每股42元、对应47亿估值。而这年恰恰是大秦即将录得<strong>3.78亿年度亏损</strong>的2024年前夜。</p>\n  <p>2025-2026年，也有一些C轮机构原价离场，只拿回了本金和利息。2025年7月，<strong>陕西财金</strong>把全部71.43万股转给江苏海四达，作价3493.8万元；2026年3月，<strong>路威凯腾</strong>把所持股份分三笔近7000万转给苏创智荟、苏创中荷、湖北优山，定价同样是注资+应计利息；递表前的2026年6月，<strong>天津华秦</strong>把全部71.43万股转给浏阳高创基金，作价3720.7万元，依据仍是注资+利息。</p>\n  <p>IPO前，创始人柳扬直接持有41.1%，连同其控制的苏州溱湖畔、河漢江澤、楠樟梓椆三个平台，合计控制约59.04%。柳扬42岁，吉林大学机械工程及自动化学士。曾在<strong>比亚迪干了18年，</strong>2007-2019，最后职位是<strong>光伏事业部销售总监</strong>。董事会秘书<strong>柳金山，</strong>是柳扬堂兄弟。</p>\n  <p>除了他来自比亚迪之外，高管几乎也全是比亚迪系。负责海外销售的总监<strong>童建成</strong>，曾在比亚迪汽车2006-2023年做了近20年销售；品牌及营销总监<strong>朱晓辉</strong>，曾任比亚迪汽车高级技术支持工程师；副总经理、工商业ESS总监<strong>李程</strong>，比亚迪汽车解决方案部副经理出身；财务总监<strong>赵然志</strong>，2006年起在比亚迪集团任职，直到2021年。</p>\n  <p>除了比亚迪系，大秦团队里还有<strong>派能科技系</strong>，全球服务中心柳华勤曾在中兴派能做PACK工程师。和<strong>固德威系</strong>，户用ESS超级产品团队总经理刘滔，2026年4月刚从固德威ESS产品总监任上加盟。</p>\n  <p>368页招股书揭示出的大秦故事是：按2025年出货量，全球第五大户用ESS提供商，仅次于特斯拉、华为、德业。另一家产品已铺到100多个国家，累计出货超100万台电池。但大秦<strong>98%的收入也压在分销商身上</strong>、95%押在海外，仅欧洲就61%。</p>\n  <p>一支比亚迪系老兵班底，用一次代价惨重的库存豪赌，换来了对周期的敬畏。又靠2025年的爆发，把自己重新推到了港交所门口。上市之后表现如何，我们持续关注。</p>", "category": "tech", "published_at": "2026-06-27T07:37:59+00:00", "fetched_at": "2026-06-28T03:23:46.278140+00:00", "fingerprint": "ff719688cfbf6c14"}, {"source": "36氪 - 最新文章", "title": "一折买 Miu Miu，谁在做奢侈品牌的\"拼多多\"？｜商业Friday", "url": "https://36kr.com/p/3867976058803459?f=rss", "summary": "<p>文｜贺哲馨</p>\n  <p>编辑｜乔芊</p>\n  <p>Judy第一次意识到，原来打折的奢侈品也有准入门槛，是在申请加入On The List的一次特卖活动时。<span style=\"letter-spacing: 0px;\">提交申请后的第三天，她依旧没有收到邀请消息。</span><span style=\"letter-spacing: 0px;\">“我还以为填完资料就能进去。”她说。</span></p>\n  <p>按照平台规则，特卖活动需要邀请码才能进入。如果迟迟没有通过，则需要邀请两位好友注册，才能获得进入候补名单的机会。至于最终能否收到邀请码，没人说得清楚。</p>\n  <p>“有点像抽签，也有点像开盲盒。<span style=\"letter-spacing: 0px;\">”Judy笑着说，“明明我是才是买家，结果搞得像在申请什么私人会员俱乐部。越进不去，越想进去看看。”</span></p>\n  <p>Judy试图进入的，是近年来正在中国一线城市兴起的一类新渠道——会员制奢侈品特卖平台。On The List是其中最具代表性的玩家之一。这家公司2016年成立于香港，以限时快闪的形式销售奢侈品、设计师品牌和生活方式产品。与传统奥莱不同，它既不拥有品牌，也不经营长期折扣门店，而是直接与品牌合作，在限定时间内销售库存商品。其官网上的一句标语颇具代表性：“The smartest shopping isn't public（最聪明的购物不公开）”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_37deedd3f093467facd0d39ca060a59a@5922386_oswg418866oswg640oswg360_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：On The List</p>\n  <p>最近几年，类似这样的平台正在上海、北京、香港、新加坡等城市不断出现。它们的线下店大多开在核心商圈附近，采用会员邀请制、预约制或者限时快闪模式，与人们熟悉的郊区奥莱形成鲜明区别。</p>\n  <p>这些平台更愿意把自己称作“特卖平台”而非“奥莱”，因为从商业逻辑上看，它们本质上确已属于另一种业态——传统奥莱更接近地产生意：依靠品牌入驻、租金和联营扣点获利。而城市特卖平台则更接近零售生意：面积更小、资产更轻，依赖买手能力、供应链管理和库存周转效率。</p>\n  <p>它们出现的背景，与奢侈品行业近年来越来越沉重的库存压力有关。开云（Kering）在2025年把库存削减了8%，并计划2026年继续压降；在4月的资本市场日上，公司提出的\"ReconKering\"计划明确要在2026年底前净削减约10亿欧元库存，并把库存水平控制在销售额的20%以内。Gucci的业绩依然低迷，本季度销售额下降了8%。</p>\n  <p>对于奢侈品牌而言，库存积压的成本远高于普通消费品行业。仓储、物流和资金占用只是表面问题，更重要的是，大量库存会拖累现金流，并对未来价格体系形成压力。</p>\n  <p>一位长期服务奢侈品牌的供应链人士告诉36氪，过去品牌更愿意把货品留在仓库里等待下一轮销售机会，但如今多数企业对于库存周转天数的考核越来越严格，<strong>“与其放着贬值，不如尽快变现。只要渠道足够隐蔽，不影响正价体系，品牌愿意给出比过去更大的折扣。”</strong></p>\n  <p>奢侈品行业的高毛利率，也给这种模式提供了空间。业内普遍认为，奢侈品牌的定倍率通常在十倍以上，部分顶级品牌甚至可能达到数十倍。即便商品以原价的两到三折出售，品牌依然有机会覆盖成本并回收现金流。</p>\n  <p>因此，对品牌而言，参与特卖的核心目标往往不是赚取更多利润，而是提高库存周转效率。</p>\n  <p>一位开云集团内部人士告诉36氪，目前类似On The List的平台与品牌合作主要存在两种模式。一种是买断批发，由平台直接采购库存；另一种则是代理销售，由品牌掌握定价权，平台收取佣金，后者利润“更为可观”。相比批发模式，奢侈品牌通常更偏爱代理模式。这样既能控制价格体系，也能掌握库存流向。</p>\n  <p>“渠道管理越严格的品牌，快闪活动表现通常越好。”一位长期参与特卖项目的人士告诉我们，一些热门品牌的快闪活动虽然持续时间只有四五天，但单日销售额就可能达到数百万元甚至更高。这一数字在整个行业进入放缓的背景之下，绝非小打小闹。</p>\n  <p>当然，特卖也不是什么新鲜事。二十多年前，欧美时尚行业便存在被称作 Sample Sale（样品特卖）的销售形式。参与者通常是品牌员工、媒体编辑、买手和熟客群体。它更像一种行业内部福利，而非面向公众的零售活动。在那个时代，信息差本身就是门槛，知道活动在哪里举办、何时开始、如何获得资格，往往比购买能力更重要。</p>\n  <p>随着奢侈品行业规模扩大、产量增长以及库存持续累积，这种原本封闭的小圈子活动逐渐演变成标准化的库存处理机制。疫情之后，这一趋势进一步加速。麦肯锡预测，奢侈品牌的折扣市场在2025至2030年间的增长速度预计将是正价市场的五倍。</p>\n  <p>但更值得关注的是，进入这些平台的品牌构成正在发生变化。</p>\n  <p>如果说十年前的特卖渠道主要承接的是上一季甚至数年前的库存，那么今天出现在快闪名单里的品牌，已经越来越接近消费者正在讨论的那批热门名字。从Miu Miu、The Row到Lemaire、Jil Sander，不少品牌的的产品仍处于市场热度高位。<strong>这意味着特卖渠道不再只是处理“卖不掉的商品”，而正在成为品牌库存管理体系中的常规环节。</strong>即便是仍然具备市场需求的产品，只要错过销售周期，也会被纳入更高效的周转体系。</p>\n  <p>小红书网友@小象分享On The List香港太古里的线下门店购买的miu miu，从原价三万打完折8000的皮衣，到现价1000不到的格纹短裤，这些货品并非外界想象的那样过时，或者设计难看得惊人，相反，从实穿角度来看性价比颇高。</p>\n  <p>但对于平台而言，快闪终究是一门高度依赖项目制的生意。每一次活动都意味着重新寻找货源、重新获客、重新搭建销售场景。当市场规模扩大后，仅依靠几天一次的特卖显然无法支撑持续增长。对于平台而言，最大的挑战并不是卖货，而是如何获得稳定、持续的库存来源。</p>\n  <p>于是越来越多特卖平台开始从单纯的活动运营商转向零售商：开设常驻门店、引入更多品类、增加自营采购比例，以提高周转效率和经营确定性。</p>\n  <p>Openmaxx开时仓的创始人Dylan Wang曾就职于字节，在纽约读研期间为当地特卖零售商Prive代理过跨境电商业务。2022年回国之后，Dylan复制了Prive的模式，在上海成立了Openrack Flash Sales，一开始只做奢侈和轻奢品牌的快闪特卖，两年时间内扩张到了六座城市。</p>\n  <p>2025年，Openrack Flash Sales改名为Openmaxx，开始将业务扩展至家居、宠物、美妆、运动休闲、香氛等品类，模式也从限时快闪转向常驻门店与快闪结合，同时主动缩减门店规模。如今，小红书上还能找到的常驻门店，仅剩重庆和上海。</p>\n  <p>这种变化反映的并不仅仅是一家企业的发展路径，更折射出会员制特卖行业始终存在的一种张力：奢侈品牌需要这样的平台，但平台却很难仅靠奢侈品生存。</p>\n  <p>从这一角度，奢侈品牌与特卖平台之间就像是城市与地下错综复杂的排水系统的关系。正价门店负责展示品牌价值，奥莱负责承接规模化折扣，<strong>而这些会员制特卖平台则负责消化那些既不能留在橱窗里、又不适合公开降价的库存。</strong>它们并不创造需求，却维持着整个系统的运转效率。</p>\n  <p>对于消费者而言，这是一场寻找低价好货的游戏；对于品牌而言，这是库存管理与渠道控制的一环；而对于平台而言，则是一场关于品类扩张、会员留存和商业模型能否成立的长期考验。</p>", "category": "tech", "published_at": "2026-06-28T00:37:08+00:00", "fetched_at": "2026-06-28T03:23:46.278125+00:00", "fingerprint": "f58d75b18893e0ba"}, {"source": "少数派", "title": "俄西双城游记：莫斯科时代折叠，圣彼得堡文化巡礼", "url": "https://sspai.com/post/111347", "summary": "在莫斯科的时代折叠与彼得堡的文化巡礼之间，发现俄罗斯的不同面貌。<a href=\"https://sspai.com/post/111347\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-27T11:36:51+00:00", "fetched_at": "2026-06-28T03:23:44.503023+00:00", "fingerprint": "7fd9c5c2724f8b8b"}, {"source": "The Guardian - World", "title": "Outrage as woman jailed for three years after criticising Somali government online", "url": "https://www.theguardian.com/global-development/2026/jun/26/woman-sadia-moalim-ali-three-year-jail-sentence-somalia-online-comments-governement", "summary": "<p>Sentencing of 27-year-old Sadia Moalim Ali condemned by former president and prime ministers as well as rights groups</p><p>A rickshaw driver in Somalia has been sentenced to three years in prison for comments she made on social media, in a case that has caught the public’s attention and provoked outrage in the country.</p><p>Sadia Moalim Ali, a 27-year-old nursing graduate, was originally charged with insulting government institutions and incitement to commit a crime, but convicted only of the former. Her sentence, immediately condemned as “fundamentally unjust”, was handed down on 25 June.</p> <a href=\"https://www.theguardian.com/global-development/2026/jun/26/woman-sadia-moalim-ali-three-year-jail-sentence-somalia-on : "<h2>大公司：</h2>\n  <p><strong>五粮液：曾从钦无法正常履职离任，选举邓敏为公司董事长</strong></p>\n  <p>36氪获悉，五粮液公告，因曾从钦无法正常履职，公司于2026年6月26日召开2025年度股东会，审议通过《关于免去董事及补选第七届董事会非独立董事的议案》，自本次股东会审议通过之日起，曾从钦不再担任公司董事职务，其担任的董事长、董事会专门委员会主任委员及委员职务一并自动解除（原定任期至公司第七届董事会日期届满之日即2028年6月19日止），离任后不在公司及控股子公司任职，其离任不会对公司正常经营产生影响。截至本公告披露日，曾从钦未持有公司股份，不存在应当履行而未履行的承诺事项。</p>\n  <p><strong>京东大药房在烟台成立新公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，京东大药房（烟台）有限公司成立，法定代表人为张媛媛，注册资本10万人民币，经营范围包括药品零售、药品互联网信息服务、第三类医疗器械经营、医疗器械互联网信息服务等。股东信息显示，该公司由京东大药房（青岛）连锁有限公司全资持股。</p>\n  <p><strong>SpaceX公司计划在美国市场推出“星链”零售产品，并建设自己的地面移动网络</strong></p>\n  <p>据报道，埃隆·马斯克拥有的SpaceX公司计划为美国消费者推出一项全新的星链移动服务。SpaceX公司总裁兼首席运营官格温·肖特韦尔表示，公司正在考虑“推出星链零售产品”，并可能在美国建设自己的地面移动网络。实施这些计划需要全球卫星通信系统的管理层向个人客户出售移动合约以开发新的零售产品，这将使其与美国主要运营商Verizon Wireless、AT&amp;T和T-Mobile展开竞争。（财联社）</p>\n  <p><strong>何小鹏表示小鹏智驾即将出海</strong></p>\n  <p>36氪获悉，何小鹏6月25日朋友圈发文透露，第二代VLA走向全球进入确定模式。他提及WP.29批准的DCAS UNR 171 series 02在六个月后将生效成为欧盟强制法规，“也就是从2026年底自动驾驶可以合法进入全球”。他同时预告，“敬请期待2027年在海外的小鹏汽车的VLA和VLM的入场和体验（例如海外可以用中文和当地语言混合和爱车对话和控车）”。</p>\n  <p><strong>智元旗下灵巧手估值10亿美元，成立仅5个月首季实现盈利</strong></p>\n  <p>从智元系灵巧手企业临界点处了解获悉，该公司近期完成近10亿融资，跻身估值10亿美元独角兽行列。从智元机器人拆分而出的灵巧手研发商临界点，是具身智能赛道成长速度最快的企业之一，它独立发展至估值10亿美元，仅耗时五个月。这短短五个月内，该公司已密集完成四轮融资，百度、蓝驰创投、高瓴创投等多家头部资本也都纷纷投资入局。（南都）</p>\n  <p><strong>同仁堂医养香港上市拟筹资不超过6.716亿港元</strong></p>\n  <p>36氪获悉，根据呈交香港交易所的公告，北京同仁堂医养投资股份有限公司在香港发售1.08亿股股份，发售价区间为每股5.48港元至6.21港元。该公司预计将筹资不超过6.716亿港元，预计7月7日上市交易。</p>\n  <p><strong>DeepSeek计划将所有部门规模扩大至少一倍</strong></p>\n  <p>6月25日，DeepSeek发布多个岗位招聘信息。公司表示，正努力将所有部门的规模扩大至少一倍。（证券时报）</p>\n  <p><strong>苹果公司：人工智能数据中心的快速扩张导致内存需求激增</strong></p>\n  <p>苹果公司称，人工智能数据中心的快速扩张导致内存需求激增，从未见过某个零部件价格如此大幅快速上涨；电子产品行业面临前所未有的挑战。（财联社）</p>\n  <h2>投融资：</h2>\n  <p><strong>“无界动力”完成超2亿美元天使轮融资</strong></p>\n  <p>36氪获悉，6月26日，通用具身智能机器人公司“无界动力”宣布完成超2亿美元天使轮融资。最新天使轮融资由京东关联基金、C 资本、弘毅投资、盛宇投资、丰源投资等多家机构联合投资，老股东线性资本、红杉中国、华业天成、雅瑞资本等跟投，所获资金将持续用于具身通用大脑研发、技术基础设施建设以及全球规模化交付。</p>\n  <p><strong>“深度机智”再获数亿元融资</strong></p>\n  <p>36氪获悉，近日，“深度机智”宣布完成新一轮数亿元融资。本轮由国寿长三角科创基金领投，老股东普华资本、诚通科创基金持续加注，蓝湖资本、博彦科技、磐谷创投、朝晖资本、财鑫资本、道禾长期投资、易高资本、明德资本等多家市场化与产业资本共同参与。目前下一轮融资已进入收尾阶段。此前深度机智全产品线均已实现商业订单，累计签约金额达数千万元。</p>\n  <h2>新产品：</h2>\n  <p><strong>4K花园宣布旗下AI工具“蝶变3.0”将于7月1日上线公测</strong></p>\n  <p>36氪获悉，日前，国内超高清技术应用企业4K花园正式宣布，旗下AI短剧画质提升工具“蝶变3.0”将于7月1日正式上线开放公测。与此同时，由其发起的“AI短剧超高清专项扶持计划”同步启动。</p>\n  <h2>今日观点：</h2>\n  <p><strong>商络电子：部分AI服务器电源客户涉及液冷技术，公司与客户合作研发液冷项目</strong><br />36氪获悉，商络电子在互动平台表示，公司部分AI服务器电源客户涉及液冷技术，公司与客户合作研发液冷项目，为其供应元器件产品并提供配套技术方案。目前该类业务未来订单放量与业绩贡献存在不确定性，请投资者注意投资风险。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>工信部就《开源鸿蒙设备统一互联接入与控制接口》等公开征求意见</strong></p>\n  <p>36氪获悉，工信部将申请立项的《开源鸿蒙设备统一互联接入与控制接口》等3项行业标准和《Ku频段船载卫星通信地球站通用测试方法》等9项推荐性国家标准计划项目予以公示。公示时间：2026年6月27日—2026年7月26日。</p>\n  <p><strong>我国具身智能市场规模将突破万亿元</strong></p>\n  <p>在今年的链博会上，具身智能产业链上下游企业组团亮相，完整呈现了从核心零部件到整机系统再到场景应用的产业闭环。而展馆之外，这条上下游协同、闭环创新的完整产业链路也正在加速成型。数据显示，2025年中国具身智能市场规模约9150亿元，预计2026年将达10904亿元。目前，全国具身智能相关企业数量已突破万家。产业链的成熟，带来的是创新效率的根本性变化。（央视财经）</p>", "category": "tech", "published_at": "2026-06-26T12:12:40+00:00", "fetched_at": "2026-06-27T02:44:44.610189+00:00", "fingerprint": "2f62c26fcb0868ab"}, {"source": "36氪 - 最新文章", "title": "追赶FSD V14，理想在补哪些课？｜最前线", "url": "https://36kr.com/p/3870292939658242?f=rss", "summary": "<p>过去几年，智能驾驶行业的竞争重心经历了几次明显变化。</p>\n  <p>最早比的是硬件：激光雷达要不要上、摄像头装几个、算力做到多少 TOPS；随后进入大模型时代，竞争开始转向端到端、VLA（Vision-Language-Action）、World Model（世界模型）等路线。</p>\n  <p>到了今天，越来越多公司发现，仅仅拥有更大的模型已经不足以形成代际优势，真正决定上限的，开始变成模型、数据、算力和芯片之间能否形成一个持续迭代的闭环。</p>\n  <p>这也是为什么越来越多车企开始走向自研。</p>\n  <p>特斯拉几乎覆盖了从数据采集、训练基础设施、FSD模型到Dojo、自研芯片的全部环节。国内，无论小鹏、蔚来，还是理想，也都在不断向更底层延伸。</p>\n  <p>今年发布的 L8、L9 车型上，理想已经用上了自研的马赫M100芯片，这个采用数据流架构的芯片被理想认为是for AI的一个大的技术方向。在马赫M100上，理想也跑了自研的马赫 VLA 模型。</p>\n  <p>但对于行业而言，更值得关注的问题并不是\"有没有自研\"，而是这些投入究竟能够解决什么问题。</p>\n  <p><strong>带着这一疑问，我们与理想汽车自动驾驶负责人詹锟、芯片负责人谢炎进行了交流。他们谈到了理想对于下一代自动驾驶技术路线的判断，也解释了自研芯片、数据体系以及AI基础设施背后的设计逻辑，以下为部分访谈纪要，经编辑：</strong></p>\n  <p><strong>问：四季度要达到特斯拉FSD V14的效果，理想还需要做哪些工作？</strong></p>\n  <p><strong>詹锟：</strong>我认为追上FSD有两个层面。</p>\n  <p>第一是基础体验，具体是三方面：安全感、效率、舒适度是否能达到FSD的同等水平。FSD的安全感非常足，效率很好，舒适度很好，这是它的基本功。我不一定跑很难的路，但这些基本功可以达到这个水平。</p>\n  <p>第二是能力，这一点也很难追。比如特斯拉会礼让特殊车辆，有极窄通行时的感知精准度，它会识别交警指挥，这些能力非常强。</p>\n  <p>能力有架构升级的机会。为什么别人没有、只有特斯拉有？可能是以前的范式限制了这些能力，有架构的原因，有数据的原因。我们在这个层面做了很多尝试。</p>\n  <p><strong>问：我理解马赫VLA是一套技术体系而不是一个单独的模型，比如Mind-Edge是端侧的、服务于智能座舱的模型，那现在的智能驾驶模型中还有“L”（Language语言）的部分吗？</strong></p>\n  <p><strong>詹锟：</strong>现在自动驾驶的架构都会有一个共同的趋势，就是把VLA（视觉-语言-行为模型）和World Model（世界模型）整合在一起。</p>\n  <p>从长远来看，没有谁不往这个方向走。无论做VLA还是World Model，里面的Prompt（提示）都要用Language。所以一定有Language，只是Language怎么用的问题。</p>\n  <p>机器智能来说，我觉得Vision Based（基于视觉）是更合理的，它是对空间理解、对3D空间的感知、对环境服务是更合理的。Language肯定有用，对理解环境、理解交通、理解指导、理解复杂的思考决策都是有价值的。</p>\n  <p>从长远来看，基于Vision和Language原生的基础模型，可能是长远的未来趋势。</p>\n  <p><strong>谢炎：</strong>如果你要走向L3、L4，要解决更泛化的问题时，你的模型需要具备像人类一样的思考能力。语言的重要性会越突出，这也是未来需要很大算力的原因。</p>\n  <p>如果它只有Vision和Action（视觉和动作），它有很多数据，碰到分布以外的情况就会不知道怎么办。一个动物哪怕学会了所有常见情况，碰到这种从未见过的情况完全不会处理，它不知道做什么选择是对的。</p>\n  <p>我们认为越往L3、L4走，解决的问题越来越接近90%、95%、98%之后的问题——那些你从来没见过的问题，需要模型具备像人类一样思考的能力。而得到像人一样推理和思考能力的来源是语言模型。比如有个警察在做手势，你要理解他是让你走还是不让你走，这不是靠收集数据或生成数据就能解决的问题。</p>\n  <p><strong>问：随着理想车队规模的跃升，从理想内部来看，数据的边际效应是不是出现了衰减？我们是怎么定义价值数据的？</strong></p>\n  <p><strong>詹锟：</strong>第一，数据的量要足够大，本质是希望收集到更多的Corner Case（长尾场景）。现在大家有很多方法在车端做出很好的neural trigger（神经网络触发器），来判断这个场景是难场景还是简单场景，然后把这些关键数据传回来。这也是现在特斯拉很强的重要原因之一。</p>\n  <p>第二，质量要高，主要指行为质量高。现在大家逐渐收敛到端到端的范式，无论做VLA（视觉-语言-行为模型）、World Model（世界模型）还是Vision-Action（视觉-动作模型）都可以，但是你一定得知道Action的行为，这时候行为质量就非常重要，行为的干净程度、一致性很重要。</p>\n  <p>至于数据规模上去以后的边际效应有没有衰减，首先，只要模型上去了，只要我们能力往100分去够，一定是个“对数曲线”，一定是慢慢衰减，不可能线性增长，哪个公司做AI都不是这样的。虽然确实越往后面，数据收敛的作用就没那么快了，但我们也希望通过规模，把它的速度加起来。</p>\n  <p><strong>问：马赫M100可以跑在不同的AI场景下，五年后或者再往后看两代产品，理想汽车车内的算力中心有没有可能全部使用自研的马赫芯片？</strong></p>\n  <p><strong>谢炎：</strong>虽然业内有一个说法叫“舱驾一体”，我们认为舱驾一体最核心的是AI算力部分，其他部分是不是一体没那么关键。因为座舱系统跟AI智驾系统可以完全独立，但AI算力可以集中在一起，这样分配效率会高很多。</p>\n  <p>我们路线图的最终形态是车内一个AI计算中心，所有AI任务都可以到这个计算中心去计算。就像笔记本上跑OpenClaw一样，AI的计算不在笔记本上，而是在Token Provider Server（Token供应服务器）上，车里也类似，有一个Token Server（Token服务器）。</p>\n  <p>这个Token Server的优势：第一，效率非常高。第二，能做到不同任务互相隔离、互不影响。比如智驾任务的确定性——无论是内存还是带宽，能够保证不被其他任务干扰，这是软件和硬件一起设计才能实现的。</p>\n  <p><strong>问：是否因为M100是数据流架构的AI推理芯片，所以相较其他友商的自动驾驶芯片，对带宽需求没那么高，对片上存储需求更高？</strong></p>\n  <p><strong>谢炎：</strong>我们对带宽的要求会低，但这也并不是设计SRAM容量（不是显存）的直接原因。现在HBM（高带宽内存）很火，很多人觉得带宽越高越好。计算，带宽，SRAM等等都是需要晶体管代价来实现，最终的设计都是成本/综合性能等多方面的综合设计考量后的一种选择。</p>\n  <p>不同的架构设计，仅仅靠一两个指标来做简单对比，既不合理也不专业。这就像打拳击比赛，高有高的优势，体重大有体重大的优势，但不是由单一指标决定了胜负，最终比的是拳击这个运动的结果。</p>\n  <p><strong>问：为什么现在的大算力芯片方案，比如英伟达、小鹏、理想自研的这些，都没有做芯片级的舱驾融合，反倒是高通在低算力的芯片上做了这件事？这是为什么？</strong></p>\n  <p><strong>谢炎：</strong>从本质上讲，舱和驾是两个独立系统。特别是对高端的L3往L4走，智驾需要一个更高确定性的系统，内存是专属、计算资源是专属，这时融合的意义就小了很多。因为资源不能实时切换，实时切换会降低确定性。如果变成越来越独占的方向，融合的价值就不大了——你只是把芯片拼在一起，但资源还是两份，并不会带来成本的降低，甚至会影响效率。</p>\n  <p>你看现在那些舱驾融合系统，它肯定还是分开的，今天做不到一会儿跑这个一会儿跑那个，做不到的话，把两个芯片放成一个芯片，晶体管数目也许不变，只是省了一次封装的成本。对中低端芯片来说这部分钱可以省，但也省不了太多。</p>\n  <p>我的观点是，越往后走智驾越来越高端，舱驾融合这件事可能意义并不大。如果把这些芯片做得更近一点，在一块板上做成很小体积的集成化方案，这是可以的，并不一定要做成一块芯片，也可以多块芯片放在一起。</p>\n  <p><strong>问：自研芯片背后需要什么条件，比如销量、营收、研发投入。目前自动驾驶迭代速度很快，芯片要持续迭代的话，需要什么样的条件？</strong></p>\n  <p><strong>谢炎：</strong>芯片先期投入的确不小，可能一年要好几亿。</p>\n  <p>第一个条件是达到一定的营收规模。对车企来说，营收规模一年1000亿以上，研发投入至少10%，就有大几十亿到上百亿，每年投钱研发芯片是可以的。第二个条件是，你研发芯片解决的问题，要能让你的产品能力更强。</p>\n  <p>很多人说芯片要有很大的出货规模才行。其实芯片的成本和面积相关。一辆车上的智驾芯片，比如Livis是2颗马赫M100，加起来800平方毫米。而一部高端手机芯片大概100平方毫米，所以一辆车的智驾芯片相当于8台手机的芯片面积。</p>\n  <p>这样算下来，大几十万辆车需要的晶圆面积非常大，完全可以摊薄成本。所以成本不能仅用颗数来衡量。</p>\n  <p><strong>问：动态数据流编译器到底难在哪，花了多长时间攻克？</strong></p>\n  <p><strong>谢炎：</strong>在流片前，甚至设计时，就开始做编译器工作了，在流片前，已经把很多模型给跑通了。</p>\n  <p>数据流是完全不同的架构，它要解决的问题非常类似于超级计算机或大规模计算机集群要解决的问题——当规模扩大到几十万台计算机、上百万颗核，它们之间互相通信、互相协作时，你无法有一个中央管理员去管几十万颗核。传统冯·诺依曼架构的调度方式在这个规模上就不可行了，这是一个超大规模的并行调度问题。</p>", "category": "tech", "published_at": "2026-06-26T23:30:20+00:00", "fetched_at": "2026-06-27T02:44:44.610183+00:00", "fingerprint": "634cdde65a4f94fb"}, {"source": "36氪 - 最新文章", "title": "理想首谈电池品牌争议：不管谁家电池，都是理想汽车兜底", "url": "https://36kr.com/p/3866946087867394?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260624/v2_245e2d5a160e4ed9af72f125da58d25e@6310690_oswg338035oswg1024oswg683_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源视觉中国</p>\n  <p><br />动力电池一直是新能源汽车里高频博弈的战场。</p>\n  <p>它通常占据一辆新能源车30%-40%的BOM（物料）成本；与此同时，作为电车心脏，又直接决定续航、补能效率、安全性和寿命等核心体验，是少数能够同时影响产品力与成本结构的零部件。</p>\n  <p>这意味着，围绕动力电池的博弈在车企与供应商之间，甚至电池产业内部从未间断。过去几年，无论是特斯拉、比亚迪、吉利，还是国内头部新势力，都相继走向电池的自研或自制。</p>\n  <p>理想汽车同样如此。伴随理想新款L8上市，“理想牌电池”也正式搭载上车。理想汽车首次对外回应了布局“理想牌电池”的思考。</p>\n  <p>随着新能源车一路普及，突破60%渗透率，电池厂商成为消费者买车的决策硬指标。宁德时代效仿英特尔，开始斥巨资塑造消费端的品牌影响力，意图换取更高的溢价能力。</p>\n  <p>而对车企来说，则需要拥有自身的电池品牌，以在成本上获取更多成本控制力。因此，各类车企的电池品牌应运而生。华为鸿蒙智行对外推出了“巨鲸电池”，理想汽车也在2025年和欣旺达成立合资公司，打造自研的“理想牌电池”。</p>\n  <p>理想电池高级总监柳志民表示，对用户而言，关注电池的核心无非是三点：第一是技术实力带来的产品性能，第二是生产管控决定的产品品质，第三是品牌背书带来的信任感。</p>\n  <p>供应链和车企之间围绕核心零部件的品牌认知，不可避免地展开新一轮角逐。理想整车电动高级副总裁刘立国坦言，宁德时代作为To B企业在To C品牌建设上取得了很大成功，推动了大众对新能源电池的认知。</p>\n  <p>但他同时表示，车企是整车工况的最大责任方，无论电池是谁生产，最终为用户体验和安全兜底的，一定是理想汽车，“我们敢于承诺8年16万公里电池健康度不低于75%，这就是我们对自研技术和品质管控的最大底气。”</p>\n  <p>刘立国介绍，在实际的整车开发中，比如电池与底盘的深度集成、整车-电池热管理策略的标定、以及全生命周期的云端安全预警，这些决定最终体验的核心工作，都是由理想汽车主导完成的。</p>\n  <p>理想在电池上的研发最早可以追溯到2015年自研SEV电池PACK。过去五年，理想汽车在5C超充电池研发上累计投入也已经超过5亿元，组建了一支接近300人的核心电池研发团队。</p>\n  <p>而理想和欣旺达联合推出的“理想牌”电池，则是理想电池自研能力的更完整落地。</p>\n  <p>柳志民表示，从研发层面来讲，理想的自研电池完全是由理想汽车来做产品定义。从电芯层级（包括材料配方、结构体系）、到整个电池Pack和BMS（电池管理系统）的所有底层开发，全部由理想汽车主导。电池工业化则是双方联合完成。</p>\n  <p>“理想团队在合资公司里担任董事长，整体的研发设计、制造工艺和质量标准，都由理想来统一进行规范和要求。”</p>\n  <p>谈及自研电池是否为了降本，刘立国表示：“理想汽车做自研电池，从来不是为了降本”。</p>\n  <p>“我们的电池绝对不是一个‘标品’，它跟整车的底盘架构、热管理系统耦合度极高。当行业里没有现成的、能满足我们极致要求的产品时，我们就必须自己下场，从底层材料、电芯设计到系统架构进行全栈自研。”刘立国说道。</p>\n  <p>但争取产品、技术和品牌的话语权，一向是车企寻求成本控制的共识策略。36氪汽车了解到，同样电量的磷酸铁锂电池包，第二梯队电池厂如中创新航、国轩高科和欣旺达对车企的报价会比宁德时代低3%-10%左右。</p>\n  <p>虽然自研的“理想牌”电池正式上车，但理想不会中断与其他电池供应商的合作。刘立国表示，电池自研团队必须与宁德时代等电池供应商竞争，接受关于产品力、安全、质量、成本、交付（P-S-Q-C-D）的筛选。</p>\n  <p>“谁综合表现好，谁才能拿到车型的份额。”</p>\n  <p><strong>在理想L8上市当天，36氪与理想汽车整车电动高级副总裁刘立国、理想汽车动力电池高级总监柳志民进行了交流，以下为对话内容，经编辑：</strong></p>\n  <p><strong>问：现在消费者对于电池品牌，普遍比较认宁德时代的电池，请问如果理想汽车搭载自研的电池，会怎样打消消费者的顾虑？</strong></p>\n  <p><strong>柳志民：</strong>对我们来说，宁德时代是优秀和值得信赖的合作伙伴，具体到我们每一个产品的开发，前期都是由理想汽车来定义需求和产品解决方案的。我们的模式有两种：一种是与供应商联合共创，另一种是我们自己做自研开发。</p>\n  <p>对于用户而言，关注电池的核心无非是三点：第一是技术实力带来的产品性能，第二是生产管控决定的产品品质，第三是品牌背书带来的信任感。</p>\n  <p>从技术维度来讲：理想汽车的每一代产品，其电池性能都是由理想汽车来定义的。无论我们选择哪家供应商，无论是应用平台技术还是自研自建的方式，其实都是以理想汽车为主导去做相关的研发。</p>\n  <p>从品质维度来讲：无论是谁生产，出厂都必须符合理想汽车极其严苛的统一标准。确保在用户端呈现的性能、安全和寿命表现完全一致。最终的品质体验都由理想汽车来保障。</p>\n  <p><strong>刘立国：</strong>补充一点，消费者买的是整车，如果车子的电池出了问题，用户第一反应是找谁？</p>\n  <p>肯定找车企。所以，无论电池是谁代工生产的，最终为用户体验和安全兜底的，一定是理想汽车。我们敢于承诺8年16万公里电池健康度不低于75%，这就是我们对自研技术和品质管控的最大底气。</p>\n  <p><strong>问：宁德时代做To C品牌对理想是否有冲击？</strong></p>\n  <p><strong>刘立国：</strong>对于汽车产品来说，电池虽然是核心零部件，最终交付给用户的是一辆完整的车。用户购买的是整车的综合体验，而不是单独买一块电池。</p>\n  <p>在实际的整车开发中，比如电池与底盘的深度集成、整车-电池热管理策略的标定、以及全生命周期的云端安全预警，这些决定最终体验的核心工作，都是由理想汽车主导完成的。</p>\n  <p>所以，我们并不认为这是一种冲击。优秀的供应商提供好的基础，而理想汽车把精力聚焦在整车层面的技术创新上。无论采用哪家优秀的供应商，最终为整车安全、性能和售后服务兜底的第一责任人，永远是理想汽车。</p>\n  <p><strong>问：理想现在推出了“理想牌电池”，外界很好奇为什么要选择自研电池？是为了降本吗？</strong></p>\n  <p><strong>刘立国：</strong>理想汽车做自研电池，从来不是为了降本。如果只是为了便宜，直接买市面上的“标品”是最省事的。</p>\n  <p>我们选择自研的核心原因在于：我们要解决用户的真实痛点，而市面上买不到现成的完美方案。</p>\n  <p>这就注定了我们的电池绝对不是一个“标品”，它跟整车的底盘架构、热管理系统耦合度极高。</p>\n  <p>当行业里没有现成的、能满足我们极致要求的产品时，我们就必须自己下场，从底层材料、电芯设计到系统架构进行全栈自研。我们做自研，是为了把超越用户期待的价值（性能、安全、寿命）交到用户手里。</p>\n  <p><strong>问：理想在自研电池上投入了多少？</strong></p>\n  <p><strong>柳志民：</strong>我们的自研是高度聚焦到5C超充电池的开发。过去的五年，我们做了大量的投资，电池研发平台固投已经超过5个亿。</p>\n  <p>理想汽车专有的电池研发团队大概有270到280人。同时我们与国内清华、上交、北理、中科院等国内顶尖的科研院所一起联合研发，也成立了博士后工作站，针对电池最前沿技术进行深度布局。</p>\n  <p><strong>问：自研和外采的比例会是多少？</strong></p>\n  <p><strong>刘立国：</strong>至于自研与外采的比例，理想汽车不会设定固定的比例数字。</p>\n  <p>我们内部会通过竞争机制来决定。我们会基于P-S-Q-C-D机制（即产品力Performance、安全Safety、质量Quality、成本Cost、交付Delivery）建立一个健康的双线竞争关系。</p>\n  <p>我们也不希望我们内部的自研团队失去外部竞争的压力。因此，谁的产品综合维度上表现更好，谁就能拿到更多的车型份额。</p>\n  <p><strong>问：理想和欣旺达的合资公司如何分工？</strong></p>\n  <p><strong>柳志民：</strong>我们和合资公司的合作分为两层：第一层是研发，第二层是制造。</p>\n  <p>从研发层面来讲，理想的自研电池完全是由理想汽车来做产品定义。从电芯层级（包括材料配方、结构体系）、到整个电池Pack和BMS（电池管理系统）的所有底层开发，全部由理想汽车主导。在某些环节上我们会联合合作伙伴的团队一起研发，这需要产业协同。</p>\n  <p>从制造层面来讲，在合资公司中，我们有一套完善的运营机制。理想团队在合资公司里担任董事长，整体的研发设计、制造工艺和质量标准，都由理想来统一进行规范和要求。在具体的制造执行环节，我们会共用合资方成熟的制造平台，并根据双方各自擅长的领域来分工执行。</p>\n  <p><strong>问：为什么选择跟欣旺达合作？</strong></p>\n  <p><strong>刘立国：</strong>我们核心看重的是它的创始人、整个价值观，以及在技术投入方面的情况。包括它原来在电芯化学体系、供应能力上的积累，供应明星产品的经验，以及未来对动力电池的投入，这些都是我们看重欣旺达的原因。</p>\n  <p><strong>柳志民：</strong>我补充一下选择欣旺达背后的逻辑——第一，当时跟欣旺达启动项目开发的时候，我们最重要的目标是做5C超充。欣旺达是全球HEV（混合动力汽车）锂电池最大的供应商。HEV电池的充放电性能，特别是充电性能可以达到80C，所以我们看重的是欣旺达底层的技术底蕴。</p>\n  <p>第二，欣旺达是苹果核心的电池供应商，与苹果的合作积累带来了很多与客户协作的经验基础。</p>\n  <p><strong>问：随着电池实现自研，会不会有更多关键零部件自研自产？</strong></p>\n  <p><strong>刘立国：</strong>在选择深度自研还是深度合作时，理想有一个内部的“技术生命周期曲线”判断标准。在进入一个产业时，如果我们认为某项技术是未来的趋势，但在当前阶段市场上的成熟技术并不强，我们就会去引导和驱动这个产业。如果当前市场上没有好的现成产品，我们就会选择自研。</p>\n  <p><strong>问：理想也在涉及具身智能、人形机器人等领域，这方面的动力电池是否有布局？</strong></p>\n  <p><strong>刘立国：</strong>具身智能涉及到的核心自研模块非常多，包括视觉、算法、电机、三电版块等。机器人的电池体系有其特殊性，它对快充没有太强烈的需求，它的核心诉求是高能量密度、轻量化和低成本，目前是由一个小团队在支持前期的需求探索。</p>\n  <p>不过，我们在汽车动力电池开发过程中积累的很多技术和早期储备，未来是可以无缝迁移到机器人电池上的。</p>\n  <p><strong>问：理想在固态电池上有预研吗？</strong></p>\n  <p><strong>刘立国：</strong>理想汽车其实从2019年开始就布局了固态电池相关的技术点。在2020年前后，针对前端的预研就向高校和合作伙伴投入了几千万元。</p>\n  <p>固态电池从科学问题到工程问题，再到产业化落地，需要经历漫长的周期，中间还有很多技术瓶颈。</p>\n  <p>固态电池涉及的细节非常多，包括生产工艺、体系结构、能量密度以及快充性能等。从我们的行业认知来看，即使到了2030年，全固态电池在整个汽车行业的市场占有率能做到5%，就已经是非常大的跨越了。</p>", "category": "tech", "published_at": "2026-06-26T23:31:16+00:00", "fetched_at": "2026-06-27T02:44:44.610175+00:00", "fingerprint": "28a4712e9d048e72"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜苹果涨价引山姆代购潮；DeepSeek大规模招聘；黄金再度跌破4000美元", "url": "https://36kr.com/p/3870720040588295?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>OpenAI官宣推出GPT-5.6</p>\n  <p>亚洲“果链”股价几乎全线大幅下跌</p>\n  <p><strong>SpaceX计划为美国消费者推出新的星链移动服务</strong></p>\n  <p><strong>美团股价低迷，王兴回应</strong></p>\n  <p><strong>小鹏机器人调整：新设九部门，何小鹏兼任产品部负责人</strong></p>\n  <p><strong>微信回应朋友圈互动规则：单删原封不动，互删清空对方全部痕迹</strong></p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>苹果涨价引山姆代购潮，部分门店已卖断货</strong></p>\n  <p>近日，社交媒体上多名网友反馈，多地山姆会员超市的iPad及Mac系列产品出现抢购、代购的情况。原因在于，苹果宣布上调iPad及Mac系列产品价格后，山姆超市并未进行价格调整。6月26日，有多名代购称可加价45元至300元不等前往山姆代购，并表示代购需求超级多，店内已基本无货。多家山姆超市门店也确认，苹果系列产品尚未调价，且因大量抢购，部分门店已卖断货。（新浪财经）&nbsp;</p>\n  <p><strong>DeepSeek大规模招聘，所有部门至少扩大一倍</strong></p>\n  <p>6月25日晚，杭州深度求索人工智能基础技术研究有限公司（下称DeepSeek）发布招聘信息，表示正努力将所有部门的规模扩大至少一倍。DeepSeek此次招聘涵盖7个大类的33个（类）岗位，工作地点为北京和杭州。&nbsp;</p>\n  <p>DeepSeek成立于2023年7月17日，总部位于浙江省杭州市拱墅区，是从事大语言模型及多模态AI技术研发的有限责任公司，其推出的DeepSeek系列开源模型，是国内领先的开源大模型系列。近日，DeepSeek获得A轮融资，融资金额约510亿元，企业估值约为4000亿元。（红星新闻）&nbsp;</p>\n  <p><strong>黄金再度跌破4000美元</strong></p>\n  <p>6月26日，现货黄金再度跌破4000美元，日内下跌0.8%。此前，包括高盛等多家投行下调黄金目标价。国内多家品牌金店足金饰品挂牌价同步下调，部分品牌足金饰品价格降至1220元/克附近，较年内高点回落480元至500元。（财联社、央视财经）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>OpenAI官宣推出GPT-5.6</strong></p>\n  <p>北京时间6月27日凌晨，OpenAI官宣推出新一代旗舰大模型GPT‑5.6系列。但由于美国政府的阻挠，目前只有获得美国政府批准的一小撮“受信任合作伙伴”能够用上这款代表人类AI能力新巅峰的大模型。&nbsp;</p>\n  <p>据OpenAI介绍，GPT‑5.6系列一共有3款模型：旗舰模型Sol、适合日常工作的均衡型模型Terra，以及快速且经济的Luna模型。用更容易理解的角度来解释，这三个单词也有太阳、地球和月亮的含义。其中，GPT‑5.6 Sol能够引入更高等级的推理强度，让AI有更多时间进行深入推理；同时，OpenAI还推出利用子智能体加速复杂任务的GPT‑5.6 Sol Ultra模式。（财联社）&nbsp;</p>\n  <p><strong>Anthropic：Mythos 5获准向美国机构重新部署，公众版FABLE 5恢复在即</strong></p>\n  <p>Anthropic称：自6月12日起，我们一直与美国政府紧密合作，以恢复对Claude Mythos 5和FABLE 5的访问。今日政府已通知我们，公司旗下最强的网络安全模型Mythos 5可重新部署至一批美国机构。我们正在继续与政府合作，扩大对Mythos 5的访问，并使FABLE 5再次可供公众使用。(金十数据APP)&nbsp;</p>\n  <p><strong>Anthropic进一步抢占OpenAI市场份额：付费收入和用户持续增长</strong></p>\n  <p>美国顶尖人工智能企业OpenAI与Anthropic之间的竞争日益激烈。据一份报告称，Anthropic正在快速抢占OpenAI的付费用户市场份额。信用卡交易分析公司Indagari数据显示，Anthropic旗舰模型Claude付费用户和收入逐月增长，自2026年1月以来，该细分市场的收入增长了约75%。Indagari的数据来自2800万美国消费者的数千亿笔匿名信用卡交易记录，覆盖了2025年至2026年5月10日之间的每周交易。另一个AI在线教育平台DataCamp也给出了类似的结论。其指出，平台上的用户今年对Claude的兴趣呈爆炸式增长，Claude已经成为该网站上搜索量最高的词条，甚至超过了AI。（新浪财经）</p>\n  <p><strong>《人工智能 智能体互联》系列7项国家标准发布</strong></p>\n  <p>《人工智能 智能体互联》系列国家标准正式发布。此次发布的《人工智能 智能体互联》系列7项国家标准，全面覆盖总体架构、身份码、身份管理、智能体描述、智能体发现、智能体交互、智能体工具调用等核心环节，系统性搭建起“身份标识—能力描述—供需发现—协同交互—工具调用”全覆盖、闭环式标准规范体系，有效补齐该领域标准空白。通过该系列标准统一架构与交互规则后，企业可复用标准组件，减少定制开发，压缩产品上市周期；同步建立统一身份认证、全程追溯机制，夯实跨域可信、安全交互的制度基础。（央视新闻）</p>\n  <p><strong>腾讯云助力印尼XLSMART实现AI全链路云转型</strong></p>\n  <p>36氪获悉，6月26日，印尼运营商XLSMART宣布完成大规模公有云转型。基于XLSMART的长期数字化战略，腾讯云作为其核心云战略合作伙伴，将AI融入迁移全链路，助力项目4.5个月完成平稳迁移。迁移过程中，腾讯云团队也基于代码助手CodeBuddy和效率智能体WorkBuddy，开发了20多个云迁移Skills，覆盖从资源发现到割接验证的完整迁移生命周期。本次迁移涉及1200个微服务、1100个API及900个业务接口，平稳处理超15TB核心数据资产。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>亚洲“果链”股价几乎全线大幅下跌</strong></p>\n  <p>本周五，在苹果公司宣布对对MacBook和iPad实施全面涨价后，亚洲“果链”股价几乎全线大幅下跌。在苹果公司宣布涨价后，市场愈发担忧半导体成本飙升将开始影响消费者需求及整体科技支出。苹果股价在美股交易时段下跌超过6%，一夜之间市值损失约2500亿美元。</p>\n  <p>周五亚洲交易时段，尽管美国存储芯片巨头美光科技昨晚在强劲财报的支撑下，股价一夜飙涨，但韩国内存芯片巨头却惨遭下跌：SK海力士早间暴跌9.56%，三星电子大跌8.65%。这两家公司均为苹果产品线中DRAM和NAND存储芯片的关键供应商。此外，相机组件制造商也面临压力。韩国LG电子作为苹果高端iPhone摄像头模组的主要供应商，周五上午股价下跌3.8%。在中国A股市场，立讯精密上午股价下跌9.16%。相比之下蓝思科技股价表现相对平稳，上午股价总体变动不大。（财联社）</p>\n  <p><strong>美团股价低迷，王兴回应</strong></p>\n  <p>6月26日，在美团股东周年大会上，美团CEO王兴回应股东关于股价方面的担忧。王兴表示，美团一方面会积极应对，经营好公司，另一方面呼吁整个行业更理性发展。此外，美团也会通过其他措施尽量给市场更多信心，例如美团在外部有一些不错的投资，可能上市就会获得好的回报，美团会考虑在合适的情况下积极退出。美团CFO陈少晖表示，当前公司价值被严重低估，美团计划进行股票回购。截至发稿，美团报65港元，跌2%左右，总市值3973亿港元，Wind数据显示年初至今股价下滑已经超37%。（澎湃新闻）</p>\n  <p><strong>特斯拉FSD全面转向订阅制</strong></p>\n  <p>近日，特斯拉在全球范围大面积调整FSD（Full Self-Driving，完全自动驾驶）的售卖模式，将全面改为订阅制。其中，港澳台地区官网已同步显示FSD买断制将于6月30日后下架取消，正式转为订阅模式。其中，中国香港地区当前买断价为5.4万港元（约合人民币4.68万元），中国澳门地区与中国台湾地区售价分别为5.57万澳门币（约合人民币4.69万元）和22.2万新台币（约合人民币4.7万元）。针对中国内地市场的FSD订阅模式是否会落地，经向特斯拉中国方面求证，一位内部人士仅表示：“没有更多消息分享。”（界面新闻）</p>\n  <p><strong>大众汽车计划未来几年裁员达10万人</strong></p>\n  <p>据报道，大众汽车正寻求加强重组力度，计划在未来几年内在全球裁员多达10万人，并关闭四家德国工厂。目前不清楚各部门的具体裁员人数。该公司目标是到2030年将集团的间接成本减少110亿欧元。（界面新闻）&nbsp;</p>\n  <p><strong>SpaceX计划为美国消费者推出新的星链移动服务</strong></p>\n  <p>据报道，埃隆·马斯克拥有的SpaceX公司计划为美国：消费者推出一项全新的星链移动服务。SpaceX公司总裁兼首席运营官格温·肖特韦尔表示，公司正在考虑“推出星链零售产品”，并可能在美国建设自己的地面移动网络。实施这些计划需要全球卫星通信系统的管理层向个人客户出售移动合约以开发新的零售产品，这将使其与美国主要运营商Verizon Wireless、AT&amp;T和T-Mobile展开竞争。（财联社）</p>\n  <p><strong>恒大物业股权出售谈判终止</strong></p>\n  <p>恒大物业集团有限公司股权交易事宜再度告吹。6月25日中午，恒大物业发布公告称，中国恒大清盘人与意向接盘方之间的谈判已经终止，且双方未签订正式交易协议。同日午后，恒大物业股价大幅跳水，盘中一度跌至0.74港元/股，创下自2025年6月中旬之后新低。6月25日当天，恒大物业收报0.78港元/股，跌23.53%。（财新）&nbsp;</p>\n  <p><strong>中国牵头制定，首个自动驾驶系统全球技术法规获批发布</strong></p>\n  <p>6月22日至26日，联合国世界车辆法规协调组织（UN/WP.29）第199次全体会议在瑞士日内瓦召开。由中国、欧盟、英国、美国、加拿大和日本共同牵头制定的联合国自动驾驶系统全球技术法规（ADS GTR）经全体缔约方投票表决，正式获批发布。此次发布的ADS GTR明确了自动驾驶系统产品核心技术指标，同步提出了制造商层面的要求及配套的审核和评估方法。作为全球首个自动驾驶全球技术法规，该法规提供了自动驾驶技术有序安全落地的统一遵循，对加速自动驾驶车辆产业化发展、推动全球汽车产业智能化转型具有里程碑意义。（第一财经）</p>\n  <p><strong>小鹏机器人调整：新设九部门，何小鹏兼任产品部负责人</strong></p>\n  <p>小鹏机器人中心新设立九个二级部门。其中，何小鹏在宣布亲自兼任机器人中心负责人后，目前还兼任机器人中心产品部负责人，直接听取产品部内各组织负责人汇报。另外，何小鹏还直接听取顾捷、刘先明、于涛等部门负责人汇报，后者分别任具身系统工程部、通用基座部（虚拟）与品牌营销部（代）的负责人。此前何小鹏在内部信中表示，他基本每周有完整的一天“围绕着机器人业务和机器人团队做深入的思考、讨论”。目前，小鹏机器人中心已形成九个二级部门:产品部、具身系统工程部、操控及安全开发部、具身智能部、数据闭环部、通用基座部（虚拟）、产品矩阵部（虚拟）、品牌营销部和项目管理部。（21财经）</p>\n  <p><strong>半导体硅片，再现涨价信号</strong></p>\n  <p>据6月26日消息，环球晶、合晶、台胜科近期相继释放出涨价信号，这些供应商的6英寸硅片已率先完成涨价，8英寸需求快速升温，12英寸产品上则已陆续与客户展开新一轮价格协商。其中，环球晶表示，2026年全球硅片市场呈现不均衡但向上的复苏态势，近期市场回暖力道较先前更加明确。高阶AI、先进制程需求持续强劲，车用、工控等非AI市场也逐步复苏，公司正积极与客户协商价格，以反映能源、运费及原材料成本增加。（台湾工商时报）</p>\n  <p><strong>SpaceX将于7月7日起纳入纳斯达克100指数</strong></p>\n  <p>纳斯达克宣布，SpaceX(SPCX.O)将被纳入纳斯达克100指数，但需满足最终资格要求。跟踪该指数的基金预计将在7月6日收盘后、正式纳入前开始买入其股票。SpaceX预计将以不到1%的权重进入这一以科技股为主的指数。(金十数据APP)&nbsp;</p>\n  <p><strong>意大利反垄断机构对微软展开调查</strong></p>\n  <p>意大利反垄断机构周五表示，已对微软展开调查，因其在“Microsoft 365”订阅服务提价过程中涉嫌存在不正当商业行为。该监管机构称，微软并未充分告知消费者其“Microsoft 365”服务已接入人工智能工具Copilot和Designer。除非消费者主动选择不升级，否则系统会自动将其切换至收费更高的订阅套餐;同时平台提供的相关信息有限，消费者难以判断是否要续约。（新浪财经）</p>\n  <p><strong>微信回应朋友圈互动规则：单删原封不动，互删清空对方全部痕迹</strong></p>\n  <p>6月26日，微信官方公众号“微信派”发布题为《几个关于朋友圈的冷知识》的文章，集中解答了用户长期讨论的删好友后互动留存、新好友分组可见等讨论较多的问题。微信派表示，如果只是用户单方面删除对方，那么过去在朋友圈中的所有点赞、评论互动都会在双方视角中原封不动地保留，被删除一方可能毫无察觉，直到主动发消息时才会收到红色感叹号提示。而如果双方互相删除好友，对方的点赞和评论会从用户的朋友圈中彻底消失，仅用户自己发布的回复内容仍然留存，对方的所有互动痕迹全部撤走。</p>\n  <p>微信同时补充了两种特殊情形：互删后重新加回好友，曾经的所有互动会全部原样归位，一条不少；单删状态下用户依然可以在对方当年的评论下回复，但这只是单向的“树洞”，对方无法收到消息，只有重新加回好友后对方才能看到历史回复。（界面新闻）</p>\n  <p><strong>LABUBU新品“复古理发店”遇冷</strong></p>\n  <p>6月25日晚间，泡泡玛特旗下头部IP LABUBU推出的“复古理发店”系列正式线上发售。虽然仍然显示“秒空”，但是多个常规款遇冷，在潮流网购平台的成交价远低于发售价。得物APP价格曲线图显示，本次新系列中的“雨过天晴”“浅蓝序曲”等款在当晚发售半小时内成交价降为100元，较发售价159元便宜59元，降幅超30%。截至6月26日界面新闻发稿前，“雨过天晴”的成交价为110元左右，“浅蓝序曲”的成交价在113元左右，仍然低于官方发售价。（界面新闻）</p>\n  <p><strong>特斯拉中国给员工子女设奖学金，单项最高5000元</strong></p>\n  <p>近日特斯拉宣布为员工子女设立奖学金，包括高等教育入学奖学金和科学素养类竞赛/论文发布奖学金。被国际(QS100)或国内(985/211)优秀院校的大学本科学段录取，奖金最高5000元。（红星新闻）&nbsp;</p>\n  <p><strong>微软Xbox宣布涨价</strong></p>\n  <p>当地时间6月25日，微软宣布自8月1日起调整Xbox主机全球价格，其中存储空间为512GB的Xbox主机价格将上涨100美元，而存储空间为1TB的机型价格将上涨150美元。同时，微软将停产2TB版本。以Xbox Series X（1TB）为例，目前官网售价为599.9美元，涨价后价格将达到750美元。至6月25日美股收盘，微软股价当天下跌3.46%至352.83美元。（第一财经）</p>\n  <p><strong>亚股遭遇“黑色星期五”，科技股全面转冷</strong></p>\n  <p>6月26日，亚洲股市遭遇“黑色星期五”，日韩股市领跌，亚洲市场科技股情绪全面转冷。盘中，韩国KOSPI指数再度向下触发熔断机制，跌幅一度达近9%。而日经225指数一度跌超5%，跌破69000点。截至收盘，韩国KOSPI指数收跌5.81%，报8411.20点；日经225指数收跌4.15%，报69360.88点。（财联社）</p>\n  <p><strong>何小鹏表示小鹏智驾即将出海</strong></p>\n  <p>36氪获悉，何小鹏6月25日朋友圈发文透露，第二代VLA走向全球进入确定模式。他提及WP.29批准的DCAS UNR 171 series 02在六个月后将生效成为欧盟强制法规，“也就是从2026年底自动驾驶可以合法进入全球”。他同时预告，“敬请期待2027年在海外的小鹏汽车的VLA和VLM的入场和体验（例如海外可以用中文和当地语言混合和爱车对话和控车）”。</p>\n  <p><strong>蔚来李斌：2030年新能源汽车渗透率将超90%</strong></p>\n  <p>6月26日，蔚来创始人、董事长、CEO李斌在2026蔚来合作伙伴日上表示，2030年，新能源汽车在中国新车市场渗透率将超过90%，而纯电在新能源汽车市场占比将超过90%。乘联会数据显示，2026年5月中国新能源汽车在新车市场渗透率达62.9%，其中纯电占比达67.1%。</p>\n  <p><strong>SpaceX据悉下月开始建造通往星舰发射基地的天然气管道</strong></p>\n  <p>据当地政府的文件显示，SpaceX计划下个月开始建造一条名为“星管”（Starpipe）的8英里（13公里）长的天然气管道，通往其位于德克萨斯州的发射设施，以帮助加快其下一代星舰火箭的发射频率。根据SpaceX附孤星材料开发公司（Lone Star MineralDevelopment）上个月向德克萨斯州铁路委员会提交的文件，Starpipe管道的终点在SpaceX位于德克萨斯州的“星际基地”(Starbase)小镇，该管道预计将于明年1月26日投入使用。（新浪财经）</p>\n  <p><strong>三星集团据悉将在未来10年内在韩国投资1000万亿韩元</strong></p>\n  <p>据报道，三星集团将于6月29日公布一项为期十年、总规模达1000万亿韩元(折合6475.3亿美元)的韩国本土投资计划，其中或包含300万亿韩元资金用于在韩国西南部建设芯片工厂。（财联社）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>证监会同意格林生物创业板IPO注册</strong></p>\n  <p>36氪获悉，证监会日前下发关于同意格林生物科技股份有限公司首次公开发行股票注册的批复，同意该公司首次公开发行股票并在创业板上市的注册申请。&nbsp;</p>\n  <p><strong>本末科技港股IPO获中国证监会备案</strong></p>\n  <p>36氪获悉，中国证监会国际合作司发布关于本末动力(北京)科技股份有限公司境外发行上市及境内未上市股份“全流通”备案通知书，公司拟发行不超过122,475,000股境外上市普通股并在香港联合交易所上市。公司34名股东拟将所持合计319,588,080股境内未上市股份转为境外上市股份，并在香港联合交易所上市流通。&nbsp;</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“无界动力”完成超2亿美元天使轮融资</strong></p>\n  <p>36氪获悉，6月26日，通用具身智能机器人公司“无界动力”宣布完成超2亿美元天使轮融资。最新天使轮融资由京东关联基金、C资本、弘毅投资、盛宇投资、丰源投资等多家机构联合投资，老股东线性资本、红杉中国、华业天成、雅瑞资本等跟投，所获资金将持续用于具身通用大脑研发、技术基础设施建设以及全球规模化交付。&nbsp;</p>\n  <p><strong>智元旗下灵巧手估值10亿美元，成立仅5个月首季实现盈利</strong></p>\n  <p>从智元系灵巧手企业临界点处了解获悉，该公司近期完成近10亿融资，跻身估值10亿美元独角兽行列。从智元机器人拆分而出的灵巧手研发商临界点，是具身智能赛道成长速度最快的企业之一，它独立发展至估值10亿美元，仅耗时五个月。这短短五个月内，该公司已密集完成四轮融资，百度、蓝驰创投、高瓴创投等多家头部资本也都纷纷投资入局。（南方都市报）&nbsp;</p>\n  <p><strong>“深度机智\"再获数亿元融资</strong></p>\n  <p>36氪获悉，近日，“深度机智”宣布完成新一轮数亿元融资。本轮由国寿长三角科创基金领投，老股东普华。资本、诚通科创基金持续加注，蓝湖资本、博彦科技、磐谷创投、朝晖资本、财鑫资本、道禾长期投资、易高资本、明德资本等多家市场化与产业资本共同参与。目前下一轮融资已进入收尾阶段。此前深度机智全产品线均已实现商业订单，累计签约金额达数千万元。&nbsp;</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-06-27T01:02:37+00:00", "fetched_at": "2026-06-27T02:44:44.610141+00:00", "fingerprint": "a2f4237420fed6e8"}, {"source": "36氪 - 最新文章", "title": "G7易流发布货运行业首款穿戴式AI硬件「拍拍豆」，填平物流交付的“最后两米”｜最前线", "url": "https://36kr.com/p/3869740772316162?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>6月25日，G7易流发布货运行业首款穿戴式AI硬件“拍拍豆”。这款产品克重仅30克，采用磁吸设计，当车辆熄火停稳后，司机可直接将设备从挡风玻璃底座取下，佩戴于胸前即可自动启动录制；放回底座瞬间，录制文件将自动同步上传云端存储。</p>\n  <p>从“看见车上”到“看见车下”，物流AI的应用场景正在完成一次关键跨越。</p>\n  <p>物流行业的AI化进程加速。据中国物流与采购联合会等机构统计，2025年全球物流与供应链管理AI市场规模已超过340亿美元，预计2026年将增长至479.2亿美元，年复合增长率高达40.8%。其中在中国，AI于物流供应链领域的渗透率已超过37%</p>\n  <p>过去几年，行业花了大量精力把车上的事“看见”。位置、温度、驾驶行为、货物状态等环节的数字化程度相对成熟。其中，G7易流于2025年发布的AI主机“紫宝盒”便是这一阶段的产品之一，目前累计服务超150家客户，装车超万台。</p>\n  <p>但G7易流创始人兼CEO翟学魂在穿戴式AI硬件拍拍豆的发布会上直言：“如果货还在车上，这件事还没有结束。真正最有价值的事情，是要把货交给客户——交给客户必须得下车。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_ac2724e0c8b9469a949d67e3829ad251@6022551_oswg1767331oswg1804oswg1006_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">G7易流创始人兼CEO翟学魂（图源/企业）</p>\n  <p>车下场景的数字化难度，在于它天然具备“非结构化”的特征。车上场景相对可控，驾驶舱空间固定、行为模式可预测、传感器部署有明确位置。相较之下，车下作业属于开放式动态场景，全程存在许多不可控变量，包括出车前底盘检查是否落实、货物交接细节、装卸环节货损成因等关键环节均依赖人工执行，一旦产生客诉，常会缺少完整客观的追溯凭证。</p>\n  <p>这些问题长期存在，却始终没有好的解决方案。拍拍豆正是针对这些痛点而推出的。</p>\n  <p>具体到产品功能端。首先是异常预警与前置干预。传统模式下，货损往往在纠纷发生后才被发现，赔付已成定局；而拍拍豆可以让管理者在异常发生的第一时间就能介入，通过AI实时识别破损、数量异常等风险，止损于发生前。</p>\n  <p>第二是全程留证与责任厘清。在城配场景中，司机日均交接数十个点位，拍拍豆让每个交接点全程录像、自动存档，遇纠纷30秒即可调取视频。相比过去的记录设备需人工开关机、手动导出上传，会额外加重司机操作负担，拍拍豆采用全自动交互逻辑，司机下车时随手取下佩戴胸前即自动开始录制，上车放回底座则自动上传云端，全程不需要任何手动操作。若出现需要留存关键节点，司机口述 “卸货”“签收”“货损” 等关键词，AI 将自动为视频打上分类标签，上手几乎无学习成本。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_a62e9f1c0d29456f84594b8da917a553@6022551_oswg1302431oswg1818oswg844_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">G7易流穿戴式AI硬件「拍拍豆」（图源/企业）</p>\n  <p>第三是全链路可视与透明化管理。货物在流转过程中皆可追溯，这套体系打通了从“看见数据”到“自动决策”的闭环。当系统检测到温度偏离阈值，不仅会报警，还能自动触发AI表单下发至相关责任人手机，全程无需人工介入。</p>\n  <p>这三个维度叠在一起，拍拍豆不再只是一个记录设备，它正在把“品质交付”这件事从“事后追溯”推向“实时可控”，把物流管理从“人管人”推向“数据管人”。</p>\n  <p>在系统集成层面，G7易流宣布将开放API接口和Skill能力，让企业的技术团队可以将拍拍豆的能力嵌入自有系统、飞书、钉钉等工作流。这意味着拍拍豆不只是G7易流平台上的一个功能，而是可以被任意企业集成的基础能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_1eb80898ddc5451c9239d47601a55892@6022551_oswg1081168oswg1816oswg976_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">G7易流穿戴式AI硬件「拍拍豆」（图源/企业）</p>\n  <p>从紫宝盒到拍拍豆，G7易流用两年时间完成了从“看见车上”到“看见车下”的延伸。两者的组合补齐了货运链条中长期缺失的那块拼图，行车过程有AI管，装卸交接也有AI管。这种“行车+驻场”的闭环一旦形成，整个运输链条的透明度和可追溯性就提升了一个层级。</p>\n  <p>对物流行业而言，AI的价值正在从“辅助人”向“替代人做记录、做判断”演进。当每一次停车、每一次交接、每一次点检都被自动记录和结构化归档，管理就不再依赖人工抽查和事后追溯。当车上、车下全流程数据实现自动采集与智能分析，物流行业数字化管理的边界，也将由此得以拓宽。</p>", "category": "tech", "published_at": "2026-06-27T01:40:53+00:00", "fetched_at": "2026-06-27T02:44:44.610126+00:00", "fingerprint": "768029b1a3f24109"}, {"source": "少数派", "title": "林檎越东瀛：苹果的日本之旅", "url": "https://sspai.com/post/111297", "summary": "当年「林檎渡东瀛」的试探，终演变成一场与亚洲产业命运相依的交响。<a href=\"https://sspai.com/post/111297\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-26T03:29:29+00:00", "fetched_at": "2026-06-27T02:44:41.890520+00:00", "fingerprint": "4b18b1b8cc207b0e"}, {"source":
