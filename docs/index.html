s", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_2288ba5e08b54ad4ad822aebc5cb41dd@6413691_oswg1716597oswg4540oswg2688_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>8月26日，国务院新闻办公室举行新闻发布会，工业和信息化部介绍“十五五”时期加快推进新型工业化有关情况。会上明确，<strong>未来五年将加快打造航空航天、低空经济等新兴支柱产业，加快新一代通信网、算力网规划建设，</strong>加强6G技术研发。商业航天与算力基础设施的政策信号再一次密集释放。</p>\n  <p>就在当天下午，36氪举办了以<strong>「太空算力的中国长跑：趋势、路线和解法」</strong>为主题的OpenTalk直播活动，邀请<strong>中科天算董事长兼CEO刘垚圻、数字太空创始人兼董事长王世金、元航资本创始合伙人陈东</strong>作为分享嘉宾，就太空算力的需求场景、技术路径、中国路线的差异化逻辑、产业机遇与投资方向等话题展开了深入分享，并与观众进行了在线互动。</p>\n  <p>以下是本场直播的干货总结，欢迎阅读、分享与收藏。</p>\n  <h2><strong>太空算力的“4G时代”还有多远</strong></h2>\n  <blockquote>\n   <p><strong>分享嘉宾：</strong>刘垚圻，中科天算董事长兼CEO，“天算计划”总指挥，CCF容错计算专委副秘书长。研究方向为天基计算、空天算力网。深度参与我国多套卫星互联网系统设计论证、标准设计与试验验证系统建设等，完成极光系列星载计算机研制与部署。相关成果发表论文/���利百余篇。获得“6G星辰青年科学家”称号，入选新百星计划、“高创计划·青年人才托举工程”等。</p>\n   <p><strong>分享关键词：</strong>天基计算基础设施、天基大模型、天基信息生态、太空原生技术</p>\n  </blockquote>\n  <p>关于太空算力是真需求还是伪命题，行业目前仍没有定论。从需求端看，地面数据中心面临电力、土地、散热的多重约束；从能力端看，SpaceX将发射成本压低百倍，下注太空算力芯片和算力星座。但反对者认为，太空数据中心成本短期内难与地面拉平，原生技术也尚未突破。对此刘垚圻的判断是：<strong>能源、生存环境、信息基础设施的边界都在拓展，太空算力是这一逻辑的自然延伸。</strong></p>\n  <p>落到短期路径上，遥感智能化和通信智能化是两条清晰的落地主线。</p>\n  <p><strong>遥感智能化：</strong>把遥感图像处理中的辐射定标、反射率计算、坐标系转换等环节，以及目标识别、变化检测等智能模型，都转化为算法任务，其核心资源需求是并行算力，也就是单位时间内可执行的运算次数。</p>\n  <p><strong>通信智能化：</strong>一座地面基站覆盖约一平方公里、服务数百个用户，而一颗卫星的波束覆盖上千平方公里，由此带来的网络规划与网络优化问题，同样要用算力解决。</p>\n  <p><strong>当卫星的角色从数据采集者转变为实时服务提供者，更值得关注的是消费级应用的颠覆性机会。</strong>他举了一个例子：未来卫星可以通过调动高光谱相机和各类传感器为渔民定位鱼群位置，同时提供渔具使用、收网时间、售卖价格等智能建议。类似这样的应用，可能会像当年的滴滴、饿了么一样从卫星互联网中生长出来，重新定义人与物理世界的交互方式。</p>\n  <p>他把今天的卫星互联网比作“1G时代”：跨入2G，稳定网络与低价资费将催生海量用户和数据；而随着未来遥感能力和通信带宽能力的跃升，那些看似非刚需的碎片化应用也许将复刻移动互联网4G时代的爆发路径，掀起卫星互联网的新浪潮。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_c06de440aaf04e1ba7f9bc62e596ae6c@6413691_oswg310361oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">卫星互联网的发展轨迹推演</p>\n  <p>在技术层面，刘垚圻认为太空环境的物理边界清晰，辐射、温差、真空、失重都有规律可循，不是混沌系统，因此算力上天是可以逐步突破的工程问题，本质上都是在“攒一台适用于太空的稳定可靠、输出正确结果的电脑”。</p>\n  <p>中科天算曾在2024年做过一次验证：通过远程上注将大模型部署到一颗在轨卫星上，成功实现了在轨的图像识别与问答。这个实验的意义在于跑通了“智能更新”的完整链路——就像手机更新APP一样，卫星智能也可以在轨更新。</p>\n  <p>在生态层面，他的主张是开源开放：<strong>用开放的技术体系降低太空应用开发的门槛，最终指向AI时代的算力平权。</strong>地面的算力输出受基建和地缘影响，而太空则具备让不同国家、地区、行业的人民形成本地特色应用生态的能力。这是太空算力带给全球的价值所在。</p>\n  <h2><strong>中国路线：不拼算力，只拼价值</strong></h2>\n  <blockquote>\n   <p><strong>分享嘉宾：</strong>王世金，数字太空创始人兼董事长、总裁，二级研究员，空天数智技术联合实验室主任。中国电子学会、中国管理科学学会等多个行业协会、学术杂志、领域专家组专家。曾于中国科学院空间中心工作25年，是我国卫星环境及效应探测领军人。获新世纪百千万人才工程国家级人选，载人航天、探月工程等突出贡献奖。获国家科学技术进步二等奖1项、部委级科技进步一等奖5项、二等奖1项、三等奖1项。授权发明专利50项。</p>\n   <p><strong>分享关键词：</strong>太空价值内生化、战略可计算化、卫星智驾、太空大脑、算力迁移</p>\n  </blockquote>\n  <p>中美太空算力的底层逻辑截然不同。美国的太空算力叙事有其特定前置条件：电网受限、土地私有化，叠加星舰可能带来的成本曲线，因此有强烈动力把数据中心搬上天。中国的约束条件集中在算力芯片和发射成本，不能照搬同一条路线图。基于这一判断，王世金提出了中国太空算力长跑的五个逻辑——</p>\n  <p><strong>1. 太空价值内生：</strong>传统的太空价值依托地面实现，运行管控、数据处理、应用服务都依赖地面测控站。未来，目标识别、数据融合、自主规划等将逐步在太空形成闭环，这一转变在军事领域已经率先发生。</p>\n  <p><strong>2. 太空体系价值：</strong>通信和遥感星座达到一定规模后，太空的体系价值才得以显现。未来太空体系能力将取决于环境、对象、资源、网络、行为、价值和决策之间的动态耦合和系统配置。</p>\n  <p><strong>3. 算力迁移：</strong>算力向太空迁移的根本原因是时间约束，感知决策链必须要小于风险处置窗口。碎片碰撞预警、太阳风暴响应、动目标监视、星地协同等场景需要快速决策，太空算力是这种低时延决策的基础设施。</p>\n  <p><strong>4. 星地协同：</strong>太空侧处理时间敏感、高频发生、规则明确的任务，地面负责体系推演、规则制定和重大决策。判断标准可以总结为三个方面：价值是目标、时延是标尺��风险是底线。</p>\n  <p><strong>5. 太空大脑：</strong>卫星大脑让单星具备自主的“感知-计算-决策-行动”能力，太空大脑则是连接多星、多网、多任务和地面系统的体系智能，包含世界模型、星地算力、泛在网络、群体智能和决策闭环五个要素。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_dc29791388e4444ca4783f9a5bdd529c@6413691_oswg267108oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">我国太空算力的未来发展逻辑</p>\n  <p>太空环境风险应对是当下最迫切的需求。近年来，太阳风暴已造成各国卫星批量损失。星链在2025年实现了没有地面干预的情况下，卫星端自主应对太阳风暴和碰撞碎片，这说明“太空问题太空解决”是可行的路径。对中国而言，算力星座尚未大规模部署，<strong>先把环境风险的星上感知与自主应对能力建起来，是太空算力落地前最务实的第一步。</strong></p>\n  <p>太空是纯粹的物理世界，因果规律是基本约束。王世金认为，<strong>太空的大脑智能必须建立在感知、认知、行为的因果闭环之上，这是太空智能与地面AI最本质的区别。</strong></p>\n  <p>基于此，数字太空在过去10年时间里持续打磨星地数智平台，依托数字太空本体大模型，实现对全球在轨卫星状态、空间环境和碎片态势的实时感知，聚焦星座运行管控与碰撞风险预警，提供太空环境效应评估和防护方案。同时面向遥感和通信星座，提供星地协同与决策服务，形成了知天、管天、卫天、用天的产品矩阵。</p>\n  <h2><strong>太空算力的产业机遇与投资价值</strong></h2>\n  <blockquote>\n   <p><strong>分享嘉宾：</strong>陈东，元航资本创始合伙人。拥有30年研发、管理、创业和投资经验，横跨航天电子、无线通信与硬科技产业。先后任职于大型国有军工集团、世界500强跨国通讯技术企业、信息技术创业公司等。2015年加入元航资本成为创始合伙人，专注于航空航天、新一代信息技术、具身智能、新能源等赛道，先后主导投资星河动力、航天驭星、云遥宇航、空间致航、巨擎科技等代表性项目。</p>\n   <p><strong>分享关键词：</strong>商业航天、太空算力、股权投资</p>\n  </blockquote>\n  <p><strong>太空算力是AI与商业航天两大硬科技赛道的交汇点，具有巨大的商业和投资价值。大国竞争正在从“制天权”转向“制算权”。</strong></p>\n  <p>需求端看，AI训练导致全球算力需求激增，地面数据中心面临能源供给瓶颈。卫星技术自身也在倒逼算力上星——传统遥感卫星90%以上的数据因带宽限制无法及时回传，星上AI实时处理能将遥感时效压缩至秒级，推动服务模式从“影像交付”转向“结果交付”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_438022550c3a48cbb381aaae971ca8de@6413691_oswg262454oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">太空算力产业驱动力分析</p>\n  <p>在阶段划分上，“天数天算”在2030年之前将是主旋律，数据在太空采集后直接处理，仅回传高价值结论。“地数天算”会在2030至2035年间逐步展开，将利用太空太阳能供电与低温真空优势，承接地面训练或推理任务。2035年之后可能进入天地融合算力阶段。</p>\n  <p><strong>陈东判断，在短时间内，天基算力无法替代地面算力。</strong>太空分布式算力集群之间的激光链路速率和稳定性远不如地面光纤，算力衰减较大。天地算力实现池化，按需调用、互为备份才是现实路径。此外，地面算力中心可能因自然灾害受损，而太空算力将形成天然的抗毁备份。</p>\n  <p>火箭是整个产业链的核心变量，占太空算力总成本的30%-40%。目前中美发射成本差距依然明显，但中国可复用火箭的进展是乐观的：长征十号乙实现海上网系回收，朱雀三号完成陆地回收，2026年多款可复用火箭密集首飞。而火箭发动机的下一步发展方向是大推力高比冲闭式循环发动机，液氧煤油和液氧甲烷两条路线将长期并存。</p>\n  <p>除了火箭，星载AI芯片、太空能源和散热系统也是必须啃下的硬骨头。星载AI芯片面临抗辐照、低功耗、高算力密度三重技术挑战，国内抗辐照重离子实验装置稀缺，这些基础设施本身也是一个投资机会；能源方面，晶硅、钙钛矿路线具有明显的成本优势；散热方面，两相流散热、机热一体化设计、可展开辐射器是关键技术方向。</p>\n  <p>观察2026年商业航天资本市场，一级市场一季度超10家企业完成近百亿融资，二级市场概念指数累计涨幅超35%。多家企业的科创板和港股IPO已获实质进展，预计2026—2027年将出现IPO小高峰，A+H双轨退出通道逐步打通。</p>\n  <h2><strong>关于太空算力，大家都在讨论什么？</strong></h2>\n  <p>我们挑选了直播互动环节部分代表性问题和嘉宾解答，经编辑整理呈现。</p>\n  <p><strong>Q1：太空算力到底解决了哪些地面算力解决不了的问题？</strong></p>\n  <p><strong>刘垚圻：</strong>从三个层面看。宏观上，计算机体系结构的原则是“需求离计算越近越好”，太空算力能让计算靠近数据产生的地方，降低时延和带宽代价。中观上，南极科考、第三世界国家不具备建设地面基建的条件，卫星网络能辐射全球，让每个人都可以使用。微观上，像应急救灾和国防监测这些场景需要秒级决策，数据传回地面再算来不及，必须在天上算完，只回传判断结果。</p>\n  <p><strong>Q2：未来3—5年是否还是高投入周期？经济账怎么算？</strong></p>\n  <p><strong>刘垚圻：</strong>可以把天上和地面的算力中心成本拆开对比。建设成本上，地面买地建楼的成本逐年提升，而太空火箭发射成本逐年下降。采购成本上，芯片、机柜、散热等硬件成本未来可能趋于一致。维护成本上，地面需要维修、安保、保洁，人力成本持续上升；太空需要机器人，初期价格高，但规模化部署后成本会越来越低。真正决定节奏的关键变量其实是卫星网络什么时候建成，没有网络的算力，其实和孤岛无异。</p>\n  <p><strong>Q3：太空原生技术和地面技术上星的本质区别是什么？</strong></p>\n  <p><strong>刘垚圻：</strong>目前上天的工业级器件本质还是电子器件，面对高能粒子的轰击，天然存在着材料缺陷和工艺缺陷。长期看，太空原生材料和物理机制可能更重要。比如光子器件不惧辐照、不聚热量，钙钛矿在真空环境中天然适用。未来如果能在物理、数学机理上取得突破，可能会重新指导计算机和芯片的设计。</p>\n  <p><strong>Q4：哪些任务可以由卫星自主决策，哪些必须地面授权？判断标准是什么？</strong></p>\n  <p><strong>王世金：</strong>标准就是时间约束。碎片碰撞规避、太空环境应对等需要快速决策的场景，数据在哪里产生、风险在哪里出现，处置就该放在哪里。地面负责制定规则和方法，而规则约束下的快速响应要交给星上。</p>\n  <p><strong>Q5：卫星快速变轨会不会影响其服务能力？</strong></p>\n  <p><strong>王世金：</strong>会，而且影响很大。举个例子：洛杉矶大火时，一颗卫星为躲避碎片临时变轨，星下点发生漂移，等它回到原定位置拍照时，着火点已经不在视场内了。从通信角度看，星链波束与地面终端的对准角度只有一两度，一次强太阳风暴导致的轨道突变都可能使捕获时间变长，甚至一次过境都无法完成捕获。太空是一个强耦合体系，任何轨道变动都可能波及多项任务执行，所以变轨决策必须要放在体系层面来完成。</p>\n  <p><strong>Q6：现在做太空算力，初创公司还有机会吗？</strong></p>\n  <p><strong>陈东：</strong>这是一个长达10—20年的长周期赛道，可以容纳很多创业公司。只要能做出产品特色，在这个大盘子里就有一席之地。长坡厚雪，值得新晋创业者在这个赛道上努力。</p>\n  <p><strong>Q7：太空算力的第一批付费客户可能是谁？</strong></p>\n  <p><strong>陈东：</strong>我认为会在“天数天算”的客户里产生。新发射的不少遥感卫星和SAR卫星都装备了大算力的在轨算力模块，能直接把结果跑出来传回地面。未来的第一批付费用户一定会是有真实场景、真实落地需求的客户。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_1fd3c2ffb2034b1aa9e9334b1cfde545@6413691_oswg920oswg400oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">更多直播精彩，欢迎扫描上方二维码观看回放</p>", "category": "tech", "published_at": "2026-08-28T10:26:32+00:00", "fetched_at": "2026-08-29T05:22:01.652622+00:00", "fingerprint": "184fe6bba46a1218"}, {"source": "36氪 - 最新文章", "title": "碧桂园2026上半年营收441亿元", "url": "https://36kr.com/p/3959209330621577?f=rss", "summary": "<p>8月28日，碧桂园（02007.HK）发布2026年中报，实现营业收入约441亿元，尽管仍处于阶段性亏损，但较去年同期减亏约16.3%；总资产约7455亿元，净资产约310亿元，持续保持为正。</p>\n  <p>根据中报，其影响利润的主要原因主要有：一是伴随集团进入保交房收尾阶段，当期交付量大幅缩减导致营业收入下降；二是房企收入结转存在滞后性，前期高地价成本项目在降价去化环境中集中结转，对利润造成负面影响；三是受宏观经济环境、行业环境及对手方负面财务状况等多重不利因素影响，计提了约62亿元存货减值以及约38亿金融资产和财务担保减值损失；四是录得其他收入及收益约41亿元，主要来自以公允价值计量且其变动计入损益的金融负债公允价值变动和债务重组收益。同时严格控制支出，其中上半年销管费用持续降至约32亿元，同比下降19.7%。</p>\n  <p>2026年1-6月，碧桂园累计权益合同销售金额约142.5亿元，权益销售面积约182.5万平方米，其销售趋势与国家统计局口径下全国新建商品房销售基本同步。碧桂园方面表示，其销售整体比较平稳，正按经营节奏有序推进。</p>\n  <p>值得关注的是，根据克而瑞数据，2026年1-7月中国房企操盘面积排行榜中，碧桂园重返行业前十。</p>\n  <p>碧桂园“一体两翼”战略亦在顺利落地。作为“两翼”之一，凤凰智拓建管依托全产业链优势，上半年新拓湖北巴东海拓滨江府住宅开发、安徽宿州萧县商业地块、广州AI云谷产业园等全过程委托管理服务项目，同时将触角延伸至城市配套服务更新领域，承接华南知名国际学校及高中校区改造项目，利用暑假40天的窗口期高效完成校园设施全方位功能提升。截至目前累计承接代管代建项目超200个。</p>\n  <p>“另一翼”的腾越建科则持续深耕构建建筑机器人、新型装配式建筑、BIM数字化深度融合的智能建造体系。截至目前已有28款建筑机器人投入商业化应用，累计交付超5200台次，应用面积超4000万平方米。</p>", "category": "tech", "published_at": "2026-08-28T13:16:31+00:00", "fetched_at": "2026-08-29T05:22:01.652617+00:00", "fingerprint": "dfe4467bb631e161"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨苹果折叠屏平均售价或达1.7万元；4年亏200亿，康佳拟主动退市；全球亿万富豪达3795人，创历史新高", "url": "https://36kr.com/p/3959891464748418?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>国家发改委：自8月28日24时起，国内汽、柴油（标准品）价格每吨分别上调375元、360元</p>\n  <p>阿里吴泳铭入选《时代》AI百大人物，与李飞飞同为封面唯二华人面孔</p>\n  <p>Anthropic首款在物理世界运行的AI工具问世</p>\n  <p>比尔·盖茨：中美需要合作应对AI风险</p>\n  <p>米哈游法务部：编造米哈游“外包歧视”虚假信息，侵权人被依法采取强制措施&nbsp;</p>\n  <p>孙宇晨回应景甜微博</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>苹果折叠屏平均售价或达1.7万元，备货量在千万级别</strong></p>\n  <p>苹果秋季新品发布会已定档9月9日（北京时间9月10日凌晨），新任CEO约翰•特努斯有望携苹果首款折叠屏iPhone完成首秀。这款可能被命名为iPhone Ultra的设备或具备类似iPad mini的实用性，展开后可变形成平板电脑形态，折起来又能装进口袋。</p>\n  <p>综合MacRumors、9to5Mac、AppleInsider等多方爆料、预测，iPhone Ultra将成为苹果史上最贵的iPhone，备货量在千万级别。256GB版本的iPhone Ultra起售价可能在1999美元左右。而IDC分析师预计，该手机的平均售价可能达到2500美元（约合人民币1.7万元），更高存储版本售价甚至高至3000美元（约合人民币2万元）。（256GB版本的iPhone Ultra起售价可能在1999美元左右。而IDC分析师预计，该手机的平均售价可能达到2500美元（约合人民币1.7万元），更高存储版本售价甚至高至3000美元（约合人民币2万元）。（财联社）</p>\n  <p><strong>四年累计亏损约200亿，康佳拟主动退市</strong></p>\n  <p>8月27日晚间，上市34年、曾被誉为“国内彩电第一股”的*ST康佳A发布重磅公告，公司董事会审议通过主动退市方案，拟撤回A、B股在深交所上市交易，退市后转入全国股转系统退市板块挂牌转让。消息一出，迅速引发资本市场、家电行业与广大股民热议，不少网友感慨童年国民品牌落幕，大量持仓投资者直面资产缩水难题。（封面新闻）</p>\n  <p><strong>最新财富报告：全球亿万富豪达3795人创历史新高</strong></p>\n  <p>全球亿万富豪的财富达到前所未有的高度，他们正把资金投入各项用途：收购体育球队、资助慈善事业，并打造影响力更大的平台。财富情报机构Altrata的最新数据显示，2025年全球亿万富豪人数创下历史新高，达到3795人。他们的总财富暴涨12.8%，达到创纪录的15.1万亿美元，接近标普500指数成分股总市值的四分之一。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic首款在物理世界运行的AI工具问世</strong></p>\n  <p>Anthropic发布公告称即将推出专为物理世界设计的AI工具“模型硬件标准”（MHS），可让AI自主操作各类可编程科研、制造设备。该工具可将硬件集成时间从数周甚至数月缩短至数小时甚至几分钟，支持24小时自主实验运行。（新浪财经）</p>\n  <p><strong>Hark与英伟达达成多年战略合作，将采用Vera Rubin平台推进个性化AI</strong></p>\n  <p>8月27日，美国人工智能初创公司Hark宣布与英伟达达成多年战略合作，双方将围绕个性化智能体AI展开技术合作，并基于英伟达下一代Vera Rubin平台部署吉瓦级计算能力。（界面新闻）</p>\n  <p><strong>OpenAI发布公开信，呼吁采取网络防御行动</strong></p>\n  <p>当地时间8月27日，OpenAI发布一封呼吁全球加强网络防御的公开信，由包括Anthropic、AWS、谷歌、微软、OpenAI和甲骨文在内的100多家组织联名签署。该公司表示：“随着全球各地模型能力不断提升，“借助人工智能发起的网络攻击将变得愈发广泛和复杂。”（界面新闻）</p>\n  <p><strong>Meta预估每年在Anthropic AI支出最高可达100亿美元</strong></p>\n  <p>据报道，Meta公司内部今年一度预测，每年可能在Anthropic公司的AI模型上投入高达100亿美元。（财联社）</p>\n  <p><strong>比尔·盖茨：中美需要合作应对AI风险</strong></p>\n  <p>微软创始人比尔·盖茨26日撰文称，人工智能（AI）飞速发展带来公平性问题，其要么成为有史以来最强大的“均衡器”，要么成为最严重的不公之源。要解决AI带来的社会问题，美国和中国需要进行合作。在这篇长达6000字的文章里，盖茨结合他在微软和盖茨基金会的经历，分享了AI的两面性——既带来巨大机遇，又潜藏多重风险。他称，AI已经具备惊人的能力并正以令人难以置信的速度不断进化，首次能够替代甚至超越人类的认知能力，“向AI新时代的过渡也将成为人类历史上最动荡的时期之一”。（环球网）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>文件显示SHEIN通过港股IPO筹资17亿美元</strong></p>\n  <p>据文件显示，SHEIN通过港股IPO筹资17亿美元，以每股48.56港元的价格发行约2.8亿股股票。（财联社）</p>\n  <p><strong>孙宇晨回应景甜微���</strong></p>\n  <p>8月27日晚，孙宇晨在社交平台发布长文《我的女友景甜》，8月28日上午8时，景甜通过个人微博回应：“我过去，现在，未来，都不会为钱出卖我的爱情，更不会出卖我的灵魂。我依然相信爱情，我依然眼光不行，我依然智慧欠奉。但我相信法律，相信善良，相信终究会有的正义和公平。时间会证明一切。”</p>\n  <p>孙宇晨通过时代周报回应：“我还没看到这个，因为这几天在香港有个很重要的行业活动，我的日程都很满。希望借这个机会，与同行进行交流，来推动整个行业的发展。我想剩下的事情都交给法律和律师去处理，这中间可能需要一些时间。我已经表达了自己内心很多的感受，已经不会再对这件事情想太多了。”（时代周报）</p>\n  <p><strong>米哈游法务部：编造米哈游“外包歧视”虚假信息，侵权人被依法采取强制措施</strong></p>\n  <p>2026年7月26日，一张来源不明、沉寂数月的聊天截图，突然在某社交平台上迅速传播，内容聚焦在“甲醛安全”与“外包歧视”上。数小时后，一个名为“王大雄”的账号出现在评论区，并留下一句话——“米哈游，新园区都知道了”，意指其本人也在同一个园区是知情者，截图中在甲醛测试过程中对外包人员进行职场歧视的公司是米哈游，并强行将“某公司上海新办公室”与米哈游北杨新园区关联。</p>\n  <p>8月28日，米哈游法务部发文表示，经核实，上述截图无论内容还是形式，与米哈游均无任何关联。疑似同园区某游戏企业的员工王某雄，其在无任何事实依据的情况下，编造并传播上述不实信息，对公司名誉造成严重损害。公司法务部于第一时间完成固证，并立即向公安机关报案，公安机关以寻衅滋事案立案侦查，侵权人王某雄已被依法采取强制措施。（界面新闻）</p>\n  <p><strong>阿里吴泳铭入选《时代》AI百大人物，与李飞飞同为封面唯二华人面孔</strong></p>\n  <p>8月27日晚，《时代》杂志揭晓2026年全球AI领域最具影响力的百大人物（TIME100 AI 2026），阿里巴巴集团CEO吴泳铭因带领阿里巴巴成为全球AI开源的领军者，入选“AI领导者”类别，并与SpaceX CEO埃隆·马斯克、亚马逊创始人杰夫·贝索斯、OpenAI联合创始人山姆·奥特曼等一起位列杂志封面中央，成为“焦点人物”。</p>\n  <p>《时代》杂志在评语中写道：“自1999年马云创立公司以来，阿里巴巴不断刷新自己的角色，从在线交易平台、电子支付平台，乃至物流创新者。现在，在CEO吴泳铭的带领下，这家公司正完成最重要的一次转型——成为全球开源AI的领军者。”（封面新闻）</p>\n  <p><strong>消息称美团LongCat通用Agent团队负责人顾奇将离职创业</strong></p>\n  <p>消息称美团LongCat Team主任研究员、通用Agent团队负责人顾奇即将离职。顾奇将在多模态模型领域创业，正在跟VC接触。公开资料，顾奇是LongCat系列模型核心贡献者，LongCat-Flash-Thinking-2601模型负责人。他毕业于清华大学数学科学系，加入美团之前，他曾在字节跳动Seed-LLM-Code团队以及蚂蚁集团担任研究员。（新浪财经）</p>\n  <p><strong>华为轮值董事长徐直军：预计鸿蒙生态今年年底突破1亿用户</strong></p>\n  <p>在鸿蒙生态大会2026上，华为轮值董事长徐直军表示，当前鸿蒙原生应用突破10万个，在HarmonyOS手机上可获取的应用超过40万个。截至8月20日，装载HarmonyOS 6终端设备数已突破8000万台，预计今年第四季度突破1亿用户。这意味着，鸿蒙生态今年年底突破1亿用户的规模临界点，进入增长新阶段。（财联社）</p>\n  <p><strong>三部门：推行“交房即交证”</strong></p>\n  <p>36氪获悉，住房城乡建设部、自然资源部、金融监管总局发布关于完善商品住房销售制度的通知。通知要求，推行“交房即交证”。现房销售前，一般应办理房屋首次登记。优化商品住房销售中涉及的买卖合同网签、不动产登记、抵押贷款办理等环节流程，强化工作协同，推动商品住房交付时购房人同步取得不动产权证书。</p>\n  <p><strong>苹果公司：iCloud贵州项目健康发展，将持续投资贵州深耕数字经济</strong></p>\n  <p>贵州省委副书记、省长李炳军会见出席2026中国国际大数据产业博览会的美国苹果公司副总裁、大中华区董事总经理葛越一行。李炳军表示，希望苹果公司进一步加大在黔投资布局，不断巩固良好合作基础，推动取得更多务实成果。贵州将为包括苹果公司在内的广大外资企业在黔发展提供优质服务。葛越表示，苹果公司iCloud项目落地贵州以来实现持续健康发展，苹果公司愿持续投资贵州、深耕数字经济发展，为中国用户提供世界一流的服务。（证券时报）</p>\n  <p><strong>德国疾控机构数据显示，德国今年已有大约1.58万人死于高温，为10年来最高</strong></p>\n  <p>德新社援引罗伯特·科赫研究所27日发布的数据报道，截至8月中旬，德国大约1.58万人死于高温，其中9600人因6月底的极端高温死亡，另有4000人在8月头两周的热浪中死亡。报道说，过去10年间，德国另外两个高温致死人数较多的年份为2018年和2019年，分别有9500人和7600人死亡。</p>\n  <p>今年的死者绝大多数是老年人，其中85岁及以上人群超过半数。女性死者多于男性死者，该机构说这是因为德国老年人中女性占比更大。罗伯特·科赫研究所说，今年死亡人数为保守估算，实际人数可能更高。一些人的死因与高温直接关联，例如中暑；多数人的死亡则由高温叠加基础疾病共同引发。（新华网）</p>\n  <p><strong>谷歌将支付2.6亿英镑，就应用开发者集体诉讼达成和解</strong></p>\n  <p>当地时间8月27日，据报道，谷歌已同意支付2.6亿英镑（约合3.54亿美元），就一起英国集体诉讼达成和解。该诉讼指控这家美国公司滥用市场支配地位，向应用开发者收取过高佣金。根据原告及其律师发表的声明，竞争上诉法庭将于9月举行听证会，审议是否批准该和解协议。报道称，自2018年8月起通过Play Store分发应用销售数字内容的英国注册应用开发者，若未选择退出，则有资格获得潜在赔偿。（界面新闻）</p>\n  <p><strong>Alphabet市值蒸发逾7000亿美元，投资者对其人工智能业务优势打下问号</strong></p>\n  <p>过去一年大部分时间里，Alphabet Inc．一直是大型科技股中表现最强劲的公司之一，投资者押注其将成为人工智能热潮的最大赢家之一。该公司股价在截至5月13日的12个月累计上涨逾150%，并于当天创下历史新高，在同期标普500指数成分股中跻身表现最好的25家公司之列，远远跑赢其他“科技七巨头”。但此后势头发生逆转。市场开始担心这家谷歌母公司出现人才流失，同时质疑其在AI领域是否正在失去领先优势。Alphabet股价目前较峰值下跌约15%，市值蒸发逾7000亿美元，并成为这段时间拖累标普500指数点位最多的个股。（新浪财经）</p>\n  <p><strong>美国联邦贸易委员会据悉就YouTube封禁用户账号展开调查</strong></p>\n  <p>当地时间8月27日，据报道，知情人士透露，美国联邦贸易委员会（FTC）自去年以来一直在调查Alphabet旗下YouTube是否因封禁用户账号而违反了消费者保护法。目前已处于准备潜在诉讼的最后阶段。知情人士称，此次调查着重于审查该平台在封禁账号或降低内容曝光度时，是否违反其用户政策。调查正在审查，用户是否可能因公司内容政策的误导而注册该服务，认为自己被允许发布某些内容，结果这些内容后来被删除或账号被封禁。报道称，目前尚不清楚该机构的调查涵盖哪些账号。YouTube尚未被指控存在不当行为，调查也可能在不采取任何执法行动的情况下结束。（界面新闻）</p>\n  <p><strong>欧盟实施包装新规，小微企业叫苦</strong></p>\n  <p>“一股不满浪潮正席卷欧盟的小微企业群体。”欧盟的《包装和包装废弃物法规》（PPWR）自8月12日开始部分生效以来，遭到欧洲小微企业主们越来越激烈的批评，称这一新包装规定给他们带来了不成比例的重负。据“欧洲动态网”26日报道，欧洲议会议长萝伯塔·梅措拉当天承认，这项包装新规对中小型企业造成了“僵化且适得其反”的负担。（环球网）</p>\n  <p><strong>美联邦政府被裁禁止拉黑AI公司Anthropic</strong></p>\n  <p>美国加州北区联邦地区法院法官当地时间8月27日裁定，美国国防部将美国人工智能（AI）企业安特罗匹克（Anthropic）公司列入黑名单属于非法行为。法官丽塔·林在裁决书中写道：“无可争议的事实记录表明，美国国防部的行为构成了对宪法第一、第五修正案的违反。事实记录进一步表明，美国国防部长赫格塞思将Anthropic指定为‘供应链风险’的决定违反了相关法定框架……且属于武断和反复无常的行为，这一点不存在实质性争议。”（央视新闻）</p>\n  <p><strong>神舟二十三号航天员乘组圆满完成出舱活动</strong></p>\n  <p>据中国载人航天工程办公室消息，北京时间2026年8月28日13时59分，经过约5.5小时的出舱活动，神舟二十三号乘组航天员朱杨柱、张志远、黎家盈密切协同，在空间站机械臂和地面科研人员配合支持下，完成太阳翼舱外维修、空间碎片防护装置安装等任务，出舱航天员朱杨柱、张志远已安全返回天和核心舱，出舱活动取得圆满成功。航天员朱杨柱时隔3年再度漫步太空，航天员张志远首次执行出舱任务。（央视新闻）</p>\n  <p><strong>国家发改委：自8月28日24时起，国内汽、柴油（标准品）价格每吨分别上调375元、360元</strong></p>\n  <p>36氪获悉，据国家发改委，8月14日国内成品油价格调整以来，国际市场原油价格震荡运行，本次调价的前10个工作日平均价格高于上次调价前10个工作日平均价格。根据国际市场油价变化情况，自8月28日24时起，国内汽、柴油（标准品）价格每吨分别上调375元、360元。</p>\n  <p><strong>纳指收跌0.5%，芯片股走弱，英伟达跌超4%</strong></p>\n  <p>美股三大指数收盘集体下跌，道指跌0.02%，纳指跌0.52%，标普500指数跌0.25%。本周，道指累涨0.53%，纳指累涨0.85%，标普500指数累涨0.49%。“科技七巨头”多数上涨，亚马逊涨3.97%，微软涨1.68%，苹果涨1.63%，谷歌涨1.53%，Meta涨1.21%，特斯拉跌1.71%，英伟达跌4.57%。芯片股走弱，费城半导体指数跌3.47%，ARM跌超6%，应用材料、Cerebras Systems跌超4%，英特尔、台积电、AMD、阿斯麦、希捷科技跌超2%。（界面新闻）</p>\n  <p><strong>丰田要求供应商降价</strong></p>\n  <p>有消息称，丰田公司于27日表示，要求零部件供应商削减原材料成本并降低价格。不过丰田公司称该行为并非一刀切，而是根据具体情况单独协商。丰田中国方面28日回应称，上述事项是针对日本的情况，和中国没有关系。（第一财经）</p>\n  <h2>投融资</h2>\n  <p><strong>“Popi AI”完成种子轮融资</strong></p>\n  <p>36氪获悉，近日，AI内容创业公司“Popi AI”完成种子轮融资，本轮投资方为浦东AI种子基金。公司此前已获得百度风投数千万元融资。本轮融资后，Popi AI将继续推进Creator Agent、Popi.MCN以及自有IP矩阵建设，并进一步完善AI内容生产、运营和商业化体系。</p>\n  <p><strong>“瞬原科技”完成两轮数千万元融资</strong></p>\n  <p>36氪获悉，“瞬原科技”宣布完成第二轮数千万元人民币融资，领投方为社保基金中关村自主创新专项基金（君联资本担任管理人），厚雪资本，云启资本跟投。本轮融资完成后，瞬原科技将在全球范围内招募优秀人才，扩大技术优势，同时启动海外市场布局。据了解，6月初瞬原科技完成了首轮数千万元融资，由龙芯创投领投，藕舫天使、社保基金中关村自主创新专项基金跟投。</p>\n  <h2>上市进行时</h2>\n  <p><strong>Anthropic据悉最早10天后将公布招股书，IPO已至最后冲刺阶段</strong></p>\n  <p>据知情人士称，Anthropic计划在美国劳动节（9月7日）后公布其IPO招股说明书，并可能在9月下旬或10月初在美上市。该公司拟允许现有股东在IPO中出售股份，部分股东的禁售期可能超过180天，这将降低IPO后的抛售压力。目前尚不清楚在Anthropic此次IPO中，新发行的股票和现有股东出售的股票各占多少比例。但报道称，Anthropic希望在IPO中筹集至少1300亿美元以扩张算力，这将超过6月上市的SpaceX，当时其筹集了860亿美元。（财联社）</p>\n  <p><strong>上海剧星传媒股份有限公司递表港交所</strong></p>\n  <p>36氪获悉，港交所文件显示，上海剧星传媒股份有限公司向港交所提交上市申请书，独家保荐人为浦银国际。</p>\n  <h2>大公司财报</h2>\n  <p><strong>长鑫科技：上半年营业收入1503.1亿元，同比增长873.64%</strong></p>\n  <p>36氪获悉，长鑫科技披露半年报，2026年上半年，公司实现营业收入1503.1亿元，同比增长873.64%；净利润776.05亿元，上年同期亏损23.32亿元，同比扭亏为盈。</p>\n  <p><strong>美团：第二季度实现收入1046亿元，同比增长14.4%</strong></p>\n  <p>36氪获悉，美团披露2026年第二季度及半年业绩报告，二季度，美团实现收入1046亿元，同比增长14.4%。随着行业竞争趋于理性，叠加二季度旺季效应，公司各项业务恢复稳健增长，经营利润环比由负转正。二季度，美团继续加强AI能力建设，公司季度研发投入同比增长22.5%至77亿元，占总收入的7.3%。</p>\n  <p><strong>农业银行：上半年营业收入4111.22亿元，同比增加11.18%</strong></p>\n  <p>36氪获悉，农业银行披露半年报，2026年上半年，公司实现营业收入4111.22亿元，同比增加11.18%；净利息收入3122.44亿元，同比增加10.54%；归属于母公司股东的净利润1463.81亿元，同比增加4.93%；基本每股收益0.4元。</p>\n  <p><strong>TCL科技：上半年净利润38.08亿元，同比增长102.19%</strong></p>\n  <p>36氪获悉，TCL科技披露半年报，2026年上半年，公司实现营业收入886.48亿元，同比增长3.61%；归属于上市公司股东的净利润38.08亿元，同比增长102.19%；基本每股收益0.1861元。</p>\n  <p><strong>蓝色光标：上半年净利润2.11亿元，同比增长119.28%</strong></p>\n  <p>36氪获悉，蓝色光标披露半年报，2026年上半年，公司实现营业收入345.62亿元，同比增长6.80%；归属于上市公司股东的净利润2.11亿元，同比增长119.28%；基本每股收益0.059元。</p>\n  <p><strong>云南白药：上半年净利润37.01亿元，同比增长1.88%</strong></p>\n  <p>36氪获悉，云南白药披露半年报，2026年上半年，公司实现营业收入218.84亿元，同比增长2.95%；归属于上市公司股东的净利润37.01亿元，同比增长1.88%；基本每股收益2.07元。</p>\n  <p><strong>中金公司：上半年净利润81.99亿元，同比增长89.35%</strong></p>\n  <p>36氪获悉，中金公司披露半年报，2026年上半年，公司实现营收193.02亿元，同比增长50.47%；归属于母公司股东的净利润81.99亿元，同比增长89.35%。</p>\n  <p><strong>苏宁易购：上半年归母净利润1.27亿元，同比增长161.41%</strong></p>\n  <p>36氪获悉，苏宁易购发布2026年半年度报告。上半年，公司实现归属于上市公司股东净利润1.27亿元，同比增长161.41%；经营活动产生的现金流量净额16.21亿元，同比增长8.75%。</p>\n  <p><strong>五粮液：上半年净利润87.53亿元，同比增长89.3%</strong></p>\n  <p>36氪获悉，五粮液披露半年报，2026年上半年，公司实现营业收入284.17亿元，同比增长20.87%；归属于上市公司股东的净利润87.53亿元，同比增长89.3%。</p>\n  <p><strong>京东方A：上半年净利润52.48亿元，同比增长61.62%</strong></p>\n  <p>36氪获悉，京东方A披露半年报，2026年上半年，公司实现营业收入1031.32亿元，同比增长1.83%；归属于上市公司股东的净利润52.48亿元，同比增长61.62%；基本每股收益0.14元。</p>\n  <p><strong>名创优品：上半年总营收115.0亿元，同比增长22.4%</strong></p>\n  <p>36氪获悉，名创优品披露半年报，2026年上半年，集团总营收115.0亿元，同比增长22.4%；毛利率44.3%，净利润9.6亿元，同比增长5.6%，经调整净利润（Non-IFRS）为12.2亿元。名创优品品牌营收105.1亿元，同比增长21.6%；其中中国内地营收64.5亿元，同比增长26.2%，创近三年同期最快增速。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-08-29T00:52:26+00:00", "fetched_at": "2026-08-29T05:22:01.652610+00:00", "fingerprint": "ba8a949a47685037"}, {"source": "36氪 - 最新文章", "title": "拿下中石油体系超百台订单，这家公司为特危化场景提供“巡操一体”机器人丨36氪首发", "url": "https://36kr.com/p/3959929849642113?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260829/v2_186cc37c6fdd45599827dbd7ef18c004@6221844_oswg74422oswg1707oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2600</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，特危化工业具身机器人公司——玄创机器人已完成数千万元A1轮融资，投资方包括前海方舟、光洋股份和西湖科创投。资金将主要用于数据管线搭建、VLA模型与JEPA世界模型的训练部署，以及标准化产品的备货与生产。</p>\n  <p>玄创机器人成立于2022年12月，长期深耕油气、化工等特危化工业场景，专注于特种具身智能机器人的发展与应用。</p>\n  <p>公司核心团队主要来自哈尔滨工业大学，技术成果源于哈工大机器人研究所及福建（泉州）先进制造技术研究院的研发转化。创始人及CEO傅喆拥有哈尔滨工业大学、伯明翰大学、谢菲尔德大学、帝国理工的教育背景，曾就职舍弗勒等大型外企负责能源板块业务。</p>\n  <p>整体来看，传统人工方式在极端环境中效率低、风险高，且行业面临严重的人员老化与劳动力缺口。并且，在“十五五”规划推动下，高危作业场景无人化已成为明确趋势。</p>\n  <p>“行业的紧迫性正在加速需求释放。”傅喆透露，“今年中石油从去年的POC项目采购转向了批量采购，这说明POC结果得到了相关运营单位的认可。”</p>\n  <p>经济性是另一重驱动力。傅喆表示，在某化学企业的落地案例中，客户能在一年半内就回收成本。经济性的优势带动了不少化工企业都开始正式部署特种机器人。</p>\n  <p>特危化工业的设备资产规模大、装置密集、运行连续性强，对机器人的实时性与确定性有极高要求。传统巡检机器人主要依托预设程序和固定轨道作业，能够替代人工完成高强度、高频次的标准化任务，但无法应对复杂的非结构化环境。</p>\n  <p>玄创机器人的技术核心是自研的AEGIS系统架构。研发负责人陶金博士认为，大模型虽然聪明，但无法直接满足高危工业场景对可靠性的要求。</p>\n  <p>AEGIS的逻辑为三层分工：上层负责理解任务并做决策，中间层对动作进行推演，底层则是一道安全屏障（一旦大模型发出不合理指令，系统能在毫秒内拦截）。三层解耦让决策的“慢”和控制的“快”互不干扰，保证了实时性。</p>\n  <p>在模型训练上，玄创机器人目前也主要在做三件事：一是用已部署的机器人采集真实场景数据，结合业主分享的操作数据进行积累；二是搭建自有仿真平台，用仿真数据弥补真实数据不足的问题；三是部署VLA执行模型，同时基于开源JEPA世界模型做测试，为后续自研基座模型做准备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260829/v2_a9304c0df3f74e53a6d8becc5baaf197@6221844_oswg262586oswg793oswg793_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">防爆空地一体巡检机器人（图源/企业）</p>\n  <p>产品层面，公司的产品体系已从单一巡检扩展为巡检与巡操一体双线并行。巡检线涵盖轮式、挂轨、履带式三种构型，均已通过防爆加本质安全双认证，并新增了空地协同和双轮足两款构型，前者用无人机搭配基站巡检高塔等高点位，后者专攻窄通道和低矮空间。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260829/v2_dd14390f70654543a58a921cae380e7c@6221844_oswg263102oswg744oswg929_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">防爆双轮足巡检机器人（图源/企业）</p>\n  <p>傅喆强调，巡操一体是接下来的主打方向，区别于传统巡检机器人“只发现不处理”，它可以通过双臂执行机构直接完成操作任务，实现巡检与操作双线并行。目前该产品以遥操形式执行任务并同步采集数据，目标是2030年前实现常规作业自主化，2035年前实现复杂场景自主化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260829/v2_5b414402204c4fda87ceaf3509cb57db@6221844_oswg176077oswg656oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">防爆巡检一体化机器人（图源/企业）</p>\n  <p>目前，玄创机器人在手订单已过亿元。其中，公司与中石油新疆油田体系签订的超百台已完成首批次交付，并以每月20台的速度持续推进，同时公司也已中标了首个海外油田智能化项目。</p>\n  <p>产能上，公司标准化总装线首台套设备已于7月30日下线，产线由上市公司光洋股份合作共建。客户拓展正从油气化工有色金属等其他危化工业场景延伸，海外市场则采用央企出海、经销商与直营三线并进的策略，重点布局中东、东南亚及俄罗斯。</p>\n  <p>除了设备销售，玄创还在探索工业服务作为第二增长曲线。针对石化化工行业中小企业有刚需但无力大额采购的现状，公司在衢州、宁波等地已启动试点，以部署机器人并提供厂区生产安全监测运营服务的方式按服务收费，有望覆盖大量中小客户并带来持续性收入。</p>\n  <p><strong>以下为硬氪与公司创始人及CEO傅喆的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：在特危化工业场景做具身智能，跨界的难度体现在哪里？</strong></p>\n  <p><strong>傅喆：</strong>这个行业真正的门槛不在实验室，在现场。防爆认证只是入场券，真正难的是理解作业流程和安全规范。一个拧阀门的动作，不同场站、不同工况下的力矩要求、操作顺序都不一样，这些经验没有写在任何一篇论文里，算法再强，也绕不开对行业know-how的积累。</p>\n  <p>我们在这个行业里泡了很多年，光现场采集的真实场景数据就覆盖了油气田、炼化、储运等多个环节，这是花时间堆出来的，短时间内没法复制。</p>\n  <p><strong>硬氪：遥操模式在客户那里接受度高吗？</strong></p>\n  <p><strong>傅喆：</strong>一开始客户也有疑虑，觉得遥操还是人在操作，不算真正的无人化。但我们跟他们算了一笔账：以前工人要穿戴全套防护装备、冒着泄漏风险去拧阀门按开关，现在坐在中控室里通过屏幕操作机器人就能完成，本质上是把人的核心价值从“危险劳动”转移到了“决策与监控”上。工人的安全风险大幅降低了，工作效率反而更高了。客户算清楚这笔账之后，接受度比我们预想的要高。而且遥操本身就是数据采集的过程，每干一次活，模型就进步一点，这是走向完全自主的必经之路。</p>\n  <p><strong>硬氪：你们现在的产品形态为什么以轮式、挂轨、履带为主，而不是人形？</strong></p>\n  <p><strong>傅喆：</strong>人形机器人确实很热，但我们在选择产品形态时只有一个标准：场景需要什么我们就做什么。</p>\n  <p>化工厂是高危场景，客户对可靠性的要求远高于对形态的追求。轮式底盘在平地效率更高，挂轨更适合固定路线巡检，履带应对复杂地形，双轮足解决窄通道，每种构型都是针对具体问题设计的。</p>\n  <p>我们目前的判断是，在特危化工业场景里，轮式、履带、轨道等传统构型加双臂的执行方案，比双足人形更可靠、更经济、更容易落地。等到技术更成熟、客户对形态有明确需求的时候，我们再做也不迟。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>前海方舟投资负责人：</strong>特危化工业具身是少数需求刚性、合规驱动、可批量交付的落地赛道。玄创没有简单堆砌大模型与硬件，而是独创驾驭工程架构补齐工业安全短板，形成差异化技术壁垒，同时已沉淀大量头部工业客户与真实工况数据，商业化闭环清晰，看好公司长期赛道龙头潜力。</p>\n  <p><strong>西湖科创投投资负责人：</strong>西湖科创投持续布局硬科技与工业AI赛道，玄创团队具备系统算法、防爆硬件、项目交付全链条能力。本轮加码将助力公司加速产品研发，并拓展长三角标杆客户，带动区域特种机器人产业集群发展。</p>\n  <p><strong>光洋股份产业负责人：</strong>光洋深耕精密伺服、传动零部件制造多年，与玄创防爆执行硬件、运动控制需求高度协同。本次战略投资将实现上下游深度绑定，依托上市公司供应链、量产制造能力，帮助玄创快速降低整机成本、提升交付产能，共同打造国产特种具身机器人完整产业链。</p>", "category": "tech", "published_at": "2026-08-29T01:29:14+00:00", "fetched_at": "2026-08-29T05:22:01.652597+00:00", "fingerprint": "9ab3416b6eb36d9d"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/113944", "summary": "📅本周新预告《社交清算》新预告8月27日，电影《社交清算》发布了新预告，将于10月9日在北美上映。凭借《社交网络》斩获奥斯卡金像奖的艾伦・索金带来全新姐妹篇，当科技巨头以「言论自由」为名逃避责任，当算 ...<a href=\"https://sspai.com/post/113944\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-28T09:44:32+00:00", "fetched_at": ler that [&#8230;]", "category": "tech", "published_at": "2026-08-27T23:20:00+00:00", "fetched_at": "2026-08-28T08:44:49.365140+00:00", "fingerprint": "ae11bb52292b79b6"}, {"source": "The Verge", "title": "The GTA VI ‘extended look’ is now streaming on YouTube", "url": "https://www.theverge.com/games/985910/grand-theft-auto-gta-vi-extended-look-youtube-netflix-stream", "summary": "Rockstar has officially published its \"extended look\" at Grand Theft Auto VI on YouTube and on its website, as promised. The in-depth preview, which \"entirely\" features footage captured from the PS5 version of the game, initially premiered on Netflix at 3PM ET. But because Rockstar allowed creators to post reaction videos, you've technically been able [&#8230;]", "category": "tech", "published_at": "2026-08-28T01:05:18+00:00", "fetched_at": "2026-08-28T08:44:49.365133+00:00", "fingerprint": "74136ff10317f64d"}, {"source": "The Verge", "title": "Anthropic was illegally blacklisted by the Trump administration, court rules", "url": "https://www.theverge.com/ai-artificial-intelligence/985947/anthropic-supply-chain-risk-lawsuit-judge-ruling", "summary": "On Thursday, a judge ruled that the Pentagon's blacklisting of Anthropic earlier this year was unconstitutional, delivering the AI lab a win in a monthslong rollercoaster of a battle with the Trump administration. The lawsuit, filed in March in a California district court, accused the Trump administration of unlawfully retaliating against Anthropic for setting \"red [&#8230;]", "category": "tech", "published_at": "2026-08-28T03:14:06+00:00", "fetched_at": "2026-08-28T08:44:49.365123+00:00", "fingerprint": "06a4d38d1bd65b9b"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜上科大团队做具身世界模型基础设施，完成千万美元种子轮融资", "url": "https://36kr.com/p/3957651741949056?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约3200字，建议阅读7分钟</p>\n  </blockquote>\n  <p>硬氪获悉，具身智能基础设施公司「瞬适科技」（InstAdapt）近日完成千万美元种子轮融资，由协创智慧、云晖资本、浦东创投和吴越天使等机构联合投资，芯湃资本担任融资顾问。本轮资金将主要用于物理AI数据基础设施建设、具身世界模型研发以及核心团队扩充。</p>\n  <p>&nbsp;瞬适科技由上海科技大学团队孵化，定位于物理AI（Physical AI）时代的具身世界模型基础设施（Embodied World Model Infrastructure）。公司希望解决具身智能产业长期存在的一个核心瓶颈：当机器人面对新的环境、新的任务甚至新的本体时，如何不再从头采数据、从头训练，而是快速获得所需经验，并在部署过程中持续学习。</p>\n  <p>公司创始人石野博士现任上海科技大学信息科学与技术学院助理教授、博士生导师，也是YesAI Lab可信与通用智能实验室负责人，长期研究扩散模型、生成式强化学习和具身智能。</p>\n  <p>本体快速增长后，机器人缺的，不只是又一个VLA或者WAM，而是一套能够持续生产经验、支持快速适配与持续改进的系统。进一步走向：谁能够更快地把一个新的真实任务，转化为机器人可以学习的世界和经验。单模型只决定即时动作，经验体系能将有限真实数据转化为可用训练经验，支撑机器人跨任务、场景、本体迁移与部署后持续学习。</p>\n  <p>近期World Labs收购机器人仿真公司SceniX，也体现了未来世界模型和机器人仿真融合的趋势。“SceniX更像是从simulation向world model扩展，而World Labs则是从world model向robotic simulation延伸。瞬适科技从成立之初，就是希望站在这两条路线的交叉点上，构建世界模型底层基础设施。”石野表示。</p>\n  <p><strong>瞬适科技围绕物理AI落地和机器人世界模型研发，搭建了一套四层物理AI基础设施。</strong></p>\n  <p><strong>第一层是机器人数据获取和治理。</strong>相比普通第一视角数据采集，瞬适更关注机器人与环境之间真实发生的三维交互关系，尤其是手部操作过程中的空间关系、物体状态和接触变化。公司通过第一视角人类视频、机器人交互数据、三维重建与手—物关系建模，将真实环境中的物体、空间、动作和接触关系快速转化为Robot-ready（机器人可用）数据。</p>\n  <p>石野向硬氪介绍，当前很多机器人数据虽然包含人体或者机器人的三维信息，但物体本身仍停留在二维层面。这类数据用于训练时，模型可能认为机器人完成了抓取，但在真实三维空间中，物体实际上并没有被正确抓住。瞬适建立了一套从第一视角视频切分、三维空间重建，到手和物体交互关系建模的数据生产流程，目标是把新的真实问题快速转化为机器人可学习、可复用的经验。</p>\n  <p><strong>第二层是3D物理资产生成与场景重建。</strong>通过照片、视频等输入，瞬适将新的真实环境快速重建为可训练、可交互、可编辑的三维任务环境，并进一步引入物理属性和接触关系，形成能够直接服务机器人训练的3D物理资产。一段真实经验可以通过改变物体位置、场景条件和任务参数，扩展为大量可控制的训练场景。由此形成“真实数据 → Robot-ready数据 → 3D物理资产 → 仿真训练 → 后训练 → 真机部署”的Real-to-Sim-to-Real管线。这些可重放、可编辑的3D物理环境不仅用于训练机器人，也为失败复现、反事实实验和后续递归自我改进提供经验生成基础。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260827/v2_a7eb61dd56234887b3f2b5ef16b04ae4@5920579_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>第三层是统一世界动作模型与机器人策略训练。</strong>瞬适探索统一的多模态世界动作模型：同一个模型既生成机器人动作，也预测动作执行后的视觉、状态与接触变化，不仅回答“现在应该做什么”，还需要推演“做了之后会发生什么”，并用对未来结果的预测反过来约束动作生成。&nbsp;</p>\n  <p>在动作生成方面，团队围绕扩散世界动作模型开展研究，强调轨迹连续性、状态转移可靠性和生成过程的可控性；在接触理解方面，瞬适进一步引入视觉与触觉信息，使模型能够理解抓取稳定性、滑移、卡滞、插接不到位等视觉难以单独判断的状态。对未来后果的预测不仅帮助生成动作，也能够用于诊断失败原因、评估不同动作的反事实结果，并决定下一轮应该生成和学习哪些经验。</p>\n  <p><strong>第四层是生成式强化学习与世界模型驱动的具身递归自我改进（RSI）。</strong>通过“仿真推演→缺口识别→经验生成→策略训练→真机验证→机制更新”闭环，将经验转化为能力，实现低成本适配，并利用各类案例持续发现缺口、更新策略，每轮学习同步优化模型与评价机制，提升新场景下的自适应效率。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260827/v2_29599973abeb47b1b3a87afe26fe7cbe@5920579_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>目前，瞬适科技已经搭建起覆盖数据生产、物理资产生成、模型训练到机器人部署的一整套技术管线，并完成灵巧手操作、精细化任务等场景验证。<strong>公司相关技术方案受邀在NVIDIA GTC 2026上进行分享，是现场唯一一家与英伟达联合展示物理AI基础设施方向技术进展的企业。</strong></p>\n  <p>本轮融资完成后，瞬适科技将继续推进物理AI基础设施建设，重点投入机器人高质量数据体系、世界模型研发以及面向实际场景的商业化落地。</p>\n  <p><strong>创始人交流节选</strong>：</p>\n  <p><strong>硬氪：公司做视触觉融合的差异化体现在哪里？</strong></p>\n  <p>石野：触觉真正有价值的时刻，是机器人已经与物体发生接触之后。我们不是用触觉替代视觉，而是把触觉作为关键的补充模态，用来增强对接触状态和交互过程的理解。传统触觉数据多在特定物体上布置传感器，记录预设状态下的信号；而机器人真正需要的是连续操作过程中的三维交互信息。</p>\n  <p>我们构建了一套三维手—物交互数据体系，记录手部、物体及接触过程中的完整状态，既包含三维空间信息，也包含触觉交互信息，目标是让触觉从孤立传感信号转化为与视觉、动作和三维几何对齐的训练数据，并映射到不同形态的机器人系统。初步验证中，在部分接触丰富的操作任务中引入触觉—视觉世界模型后，成功率提升30%以上。</p>\n  <p>更重要的是，触觉反馈不仅提高当前任务成功率，也能帮助系统判断机器人为什么失败——是否发生滑移、卡滞或接触不到位。对于新物体、新装配任务或新操作环境，这些信息显著提高了失败诊断和下一轮训练的针对性，加快任务适配。</p>\n  <p><strong>硬氪：为什么瞬适把“统一世界动作模型＋生成式强化学习”看作具身递归自我改进的基础？</strong></p>\n  <p>石野：统一世界动作模型既生成机器人动作，也推演动作执行后的未来状态。生成式强化学习则把任务奖励、失败案例、仿真经验和真机反馈转化为策略更新信号，使机器人不只是复现已有数据，还能够在交互中继续学习。</p>\n  <p>但真正的递归自我改进，不只是把同一个策略反复训练，系统还需根据每轮执行结果持续改善世界模型、奖励评价和任务生成机制。例如，世界模型在某类接触状态上预测误差较大，系统就生成更多相关仿真场景；机器人在真机中反复出现某类失败，系统就围绕该能力缺口生成反事实任务；新策略经仿真评估和真机验证后，又产生更高质量经验用于下一轮训练。这套机制先解决机器人如何更快适应新任务，进一步才是长期部署中如何持续进化。我们希望建立受任务目标、安全约束和真实反馈控制的RSI机制，让机器人每完成一轮学习，不仅任务能力更强，下次面对新任务时，发现问题、生成经验和完成适配的效率也随之提高。</p>\n  <p><strong>硬氪：相比其他做世界模型、机器人数据或仿真后训练基础设施的公司，瞬适最大的差异是什么？</strong></p>\n  <p>石野：我们不把数据、仿真、模型训练和部署拆成独立产品。瞬适构建的不是单点模型，而是一条从真实数据、3D物理资产、仿真经验、统一世界动作模型、生成式强化学习，到真机部署与反馈回流的持续学习闭环。</p>\n  <p>我们的出发点一直很明确：世界模型不会只是外挂在策略之外的“仿真器”，更可能的形态是世界模型与动作策略逐渐统一，同一个模型既回答“现在应该怎么做”，也推演“做了之后会发生什么”，再用对未来后果的预测反过来约束动作生成。在此基础上，新环境和新任务被快速转化为Robot-ready数据与3D物理资产，在仿真中扩展为大规模可控交互经验，再通过云端微调和生成式强化学习持续后训练，最终融合世界模型、仿真经验与少量真机数据，适配到具体本体和场景。闭环持续运行，每一轮真机反馈让下一轮仿真更有针对性，每一轮模型更新缩短下次适配所需时间和真实数据量。最终目标是：让机器人面对新环境新任务时快速学会，进入真实部署后持续进化，且下一次适应更快。</p>", "category": "tech", "published_at": "2026-08-28T02:07:05+00:00", "fetched_at": "2026-08-28T08:44:49.161698+00:00", "fingerprint": "9ed65100634cabdc"}, {"source": "36氪 - 最新文章", "title": "1699元跌到500元，跑鞋黄金五年结束丨深氪", "url": "https://36kr.com/p/3958572354715014?f=rss", "summary": "<p><strong>文｜</strong>贺哲馨&nbsp;</p>\n  <p><strong>编辑｜</strong>乔芊 杨轩&nbsp;</p>\n  <p>2026年7月1日中午，59岁的陕西商人严鹏从西安赛格国际购物中心七层坠亡。</p>\n  <p>严鹏是利和商贸负责人。利和商贸是耐克、阿迪达斯、彪马、New Balance等运动品牌在陕西的省级代理商。巅峰时期，他拥有四五百家门店，年销售额达到8.5亿元。</p>\n  <p>导火索之一是一笔发生在四年前的合同纠纷：店员将一张订单拆成两单，多使用了一张商场购物券，商场据此核定1145.6万元违约金。持续多年经营下滑之后，今年六月，商场方按照所谓的末位淘汰制度，对严鹏的门店发出了清退通知。</p>\n  <p>这一悲剧是过去几年运动零售渠道变化的缩影。中国运动鞋服市场在过去五年经历了一段两位数的高速增长期。商场、代理商和品牌共同分享扩张红利。而其中，跑鞋成为最具想象力的品类——碳板技术推高价格，马拉松热潮制造需求，千元跑鞋成为品牌增长的新引擎。那时，还没有一个品牌愿意主动谈折扣。</p>\n  <p>过去5年，跑鞋市场处于毫无疑问的“超级周期”，是运动市场最大的增长亮点。但今年7月，国际百货商场协会（IADS）发布的行业观察称，这个“超级周期”正出现明显放缓迹象。</p>\n  <p>经销商的寒意来得更早：耐克、阿迪达斯在中国最大的零售代理商滔搏，2025财年营收下滑4.7%至257亿元，净利润下滑1.5%。2025年，运动鞋服市场增速仅剩7%，各家运动品牌的最新季报（2026Q2）开始释放出新信号：特步、李宁流水同比低单位数下降，索康尼增速放缓明显，安踏品牌增速降至个位数。</p>\n  <p>所有人仍然在谈技术，谈材料，谈专业性能。但在渠道端，越来越多的人正在做同一件事——降价。</p>\n  <p>一场没人愿意承认的价格战，已经打响。</p>\n  <h3><strong>加速的周期</strong></h3>\n  <p>中国的跑步潮流已经有十多年——王石引领企业家精英跑步文化，咕咚、悦跑圈等跑步APP和城市跑团出现，中国的马拉松赛事数量节节攀升——但跑鞋真正变为赚钱力爆棚的生意，已经是2021年后的事。</p>\n  <p>2021年，国内鞋服市场发生了几件大事：新疆棉事件让国潮消费抬头，欧美快时尚撤退；国际运动品牌纷纷推行直营渠道改革；以及疫情的反复，让户外运动意外成了服饰市场少数增长的板块。</p>\n  <p>一位消费投资人的判断是，跑鞋市场的快速增长首先是传统运动巨头业务变动的结果，所谓“一鲸落万物生”——耐克撤出北美主要零售商之后，昂跑获得了更多货架位置，同时也获得了来自耐克的营销人才。几乎同时期，HOKA在耐克收缩国内经销渠道之后，取得了与滔搏的合作机会。国际品牌因为新疆棉事件失去了不少份额，这也给了国产品牌弯道超车的窗口。</p>\n  <p><strong>跑鞋业务的爆发有目共睹——以跑鞋为核心品类的昂跑、HOKA，连年画出漂亮增长曲线，国产品牌都希望尽快抓住这一轮消费红利。</strong>2023年11月，时任安踏品牌CEO徐阳接受采访时说：“现在市场上最好的牌子是谁？昂跑、Hoka、始祖鸟、Salomon对吧。他们有个共同的特点，就是小，只做垂类。小而灵活。”</p>\n  <p>这一年也是安踏跑步的转折之年。年初，徐阳从悦跑圈挖来程旸，出任跑步品类负责人。安踏中底科技“氮科技”也在这一年完成迭代，据品牌称能量反馈89%——踩下去100分力，中底还你89分。新材料装进了当年上市的顶配竞速鞋C10Pro，标价2599元，比首发那代贵了一倍半。一年后，贝克勒穿着它跑完了巴黎奥运会的马拉松。</p>\n  <p>但奥运会上的那双鞋不负责卖货。真正要追上昂跑和HOKA的曲线，靠的是它下面那几百个鞋款，而那些鞋的开发方式，比橱窗里的故事要简单直接得多。</p>\n  <p>“你说不出设计判断，只能拿数据。数据总是对的嘛。”一位国产运动品牌前设计师向36氪回忆起当初大多数跑鞋的开发逻辑。</p>\n  <p>“老板一问——今年谁卖得好？好，那你拆解一下：鞋面是什么材料？鞋底是什么材料？供应链的人过来，你报价一下，他的成本是多少，我们有没有类似的？成本算完以后，企划部门再谈价格。人家卖1100元，好，那我们就卖700元。”</p>\n  <p>“整个行业几乎都是这么干的。”他补充。这种做法，是国内制造业长期流行的“对标”和逆向开发逻辑。</p>\n  <p>卷，也是中国品牌的常规操作。不同于国际运动品牌一年两次订货会，国产运动品牌一年通常有四个季度订货会，而每次订货会前，还有两轮选品会。以安踏为例，一年要经历12次选品。“而且安踏在业内出了名，每次选会都会尽力呈现亮点。”</p>\n  <p>如此高频、高要求的开发节奏，让产品团队长期处于赶工状态。加班加点，干到夜里是常态。这几年下来，这位设计师身体健康指标大面积异常。</p>\n  <p>但过去几十年，以安踏为代表的中国品牌，积淀了卖货能力和规模优势，让这种高节奏成为可能。“但凡换个品牌这么做，工厂根本不会理。”</p>\n  <p><strong>成熟的上游供应链，则进一步让国产品牌的快速模仿和快速降价成为可能。</strong></p>\n  <p>中底部分曾是跑鞋的主要溢价来源。传统跑鞋设计需要在缓震、重量和能量反馈之间寻找平衡，而以超临界发泡材料为代表的新技术，使中底性能获得提升，同时降低了鞋身重量。过去几年，跑鞋中底技术进步的重要推动者，正是中国供应链。</p>\n  <p>知名跑鞋评测人WangHui曾向《大西洋月刊》透露，国产聚醚嵌段酰胺（即中底泡绵的化学构成）的成本，只有进口版本的约35%至50%。他还解释，跑鞋的其他部件，如大底和鞋面，都在福建和广东两省紧邻中底泡沫工厂的厂区生产。“基本上制造跑鞋所需的一切——甚至鞋盒和吊牌——都集中在这个产业集群里。”</p>\n  <p>产业的高集中度，让技术的迭代变得更加轻而易举。在国内，从原型到量产订单可能只需三个月，而国际品牌的开发周期通常为两年或更长。</p>\n  <p>于是，大家快速吃上了这轮红利。<strong>到了2024年，跑步品类已成为中国运动品牌的核心增长极。</strong></p>\n  <p>当年安踏品牌跑鞋流水达76.57亿元，占其品牌营收的22%，正式确立跑步为第一增长引擎；李宁跑鞋占比则从2021年的16%跃升至2025年的31%，超越篮球鞋跃居品牌第一大品类；特步对跑鞋的依赖更为极致，该品类贡献其总营收的80%以上。</p>\n  <p>至于中乔、匹克、鸿星尔克等处于三四梯队的品牌，更是凭借跑鞋这一个品类就实现了逆境突围，避免了破产倒闭的命运。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_95b43421aa4043f78ecbf7c207600e5e@5922386_oswg98697oswg1080oswg599_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：作者访谈、券商研报、官方财报等来源综合得出</p>\n  <p><strong>但这样的增长是通过快速铺开“中低端”产品提前完成的，市场因此出现大量定位相似、价格接近的跑鞋。</strong></p>\n  <p>每一季度，安踏“主推主销”的跑鞋数量有200万双，李宁200万双，特步、中乔、鸿星尔克等其他品牌加起来，林林总总有约100-200万。这意味着仅一年时间，仅国产品牌的新增跑鞋供应量至少能有2000万双。作为对比，过去一年耐克和阿迪达斯各自卖得最好的跑鞋，全球的总销量也只是刚刚突破1000万双。</p>\n  <p>“在前代基础上做点微调，就能当一双新鞋推出去。但耐克和阿迪通常不会这么干。”一位国际运动品牌员工告诉36氪。</p>\n  <p>上游产业链的体感更为强烈。“鞋都”晋江的一位鞋厂老板曾向《三联生活周刊》透露，疫情期间“200万双鞋只有150个款式”，现在“150万双鞋就有180-200个款式”。订单减少的同时，也更加零碎了。</p>\n  <p><strong>于是，红利也被压缩到短短三五年。</strong></p>\n  <p>“现在除了那种两三千元的高档跑鞋，中低档价格区间，各个品牌之间的技术差距已经被抹平了，跑者拿到跑鞋，在赛前磨合一下，成绩基本就能大差不差。”一位马拉松赛事相关人士说。</p>\n  <p>同质化的产品、被快速满足的需求，这两件事叠加在一起，会导致什么？</p>\n  <p>“促销竞争加剧”，这简单一句话，被作为李宁、特步等品牌2025年毛利率轻微下滑的归因。但在销售终端，这句话对应的现实是血淋淋的。</p>\n  <p>在与上述设计师的交谈过程中，他打开了一款实时查询跑鞋成交价格的APP。上面显示安踏一双原价1699元的旗舰竞速跑鞋，成交价已经跌至500元左右。而在更低价格带，361度、中乔体育同等级别的旗舰跑鞋，只要一两百元就可以成交。</p>\n  <p>“现在有多少人消费得起千元以上的鞋？没有多少人。”</p>\n  <p>过去几年积累的价格预期已经摇摇欲坠，整个市场就像一片堰塞湖，“表面上看上去风平浪静，实际距离溃堤已经不远了。”</p>\n  <h3><strong>一把做到底的需求</strong></h3>\n  <p>长期以来，成功的运动品牌有一条驾轻就熟的路线图——先在竞技端建立技术优势，再将高端技术逐步下放到更大众的价格区间，实现规模化回报。</p>\n  <p>这是一个能一口一口吃下最多利润，并且生命周期很长、可以长达五年、十年甚至更久的过程。</p>\n  <p><strong>但中国从来不是一个能让人慢慢来的市场。这几年的跑鞋市场，直接压扁了中间阶段，玩家们快速把需求一把做到了底。</strong></p>\n  <p>“跑鞋周期的开始具有非常大的偶然性，这个市场并没有非常稳固的新需求。”一位消费投资机构负责人告诉36氪。</p>\n  <p>有行业人士向36氪做过测算，国内真正参与马拉松并完成比赛的人群规模不足七十万人次。而能够支撑千元以上竞速跑鞋消费的核心用户只有十万人左右——而这部分人群的增长已经见顶。</p>\n  <p>外资大品牌们此前牢牢握着这部分压舱石用户。据36氪了解，去年阿迪达斯中国的跑鞋业务流水在50亿元规模左右，其中大约20-30亿的份额由竞速/训练类跑鞋系列构成——约一半是专业的跑步人群。阿迪达斯的竞速跑鞋还吃掉了耐克主动撤出或被动后退的份额，“尤其是1000元以上的盘子。”</p>\n  <p>那么，国产品牌该怎么做?</p>\n  <p>国产品牌的增量则大多来自反方向。份额涨得越快，买鞋的人里真正跑步的比例越低。李宁、安踏这几年新增的跑鞋买家，相当一部分从没在跑道上出现过——有的还没到能跑的年纪。</p>\n  <p>李宁的赤兔系列是品牌最具代表性，它也是品牌销量最高的跑鞋系列。这一系列的主要消费人群是2015年、2016年出生的小孩——刚好是80、90后生育顶峰的子女。赤兔有“体考专用鞋”的绰号，其在“小孩哥”群体中的流行程度，不亚于当年的Air Jordan。</p>\n  <p>2024年，安踏跑鞋“旅步”一代上市，这名字里藏着商战最朴实的打压逻辑：旅步谐音吕布，对标的正是同等价位的赤兔——吕布的坐骑。</p>\n  <p>旅步的成功也不是因为跑者，而是一群“大哥”——那些刚摆脱正装焦虑，脱下皮鞋的中年男士。他们在某个周末被老婆拽去景区暴走，一天下来脚被皮鞋挤到发疼，回来只想要一双透气舒服点的鞋。参与项目的团队人员向36氪回忆，产品就是从这群人身上倒推出来的：宽鞋楦和上脚一瞬间差异化的中底脚感，加上千元鞋同款的贾卡网面、乌黑得像皮鞋的配色，搭正装不突兀，外加一个没有任何心理负担的价签。“1699的太贵，299的太次，399刚刚好。”</p>\n  <p>市场的积极反应验证了团队的猜想。叠加上安踏的门店多、下沉到各级城市乃至县城，旅步一代上市三个月卖了100万双，是安踏整个集团历史上卖得最快的产品，“（在跑鞋市场）切了一大块蛋糕下来，对手那边吓坏了。”</p>\n  <p>据36氪了解，2024年安踏品牌跑鞋流水是76.57亿元，到2025年，旅步的溢出效应仍然正拉着流水以12%到13%的速度往上走，该系列累计已卖出超1000万双，是安踏毋庸置疑的营收支柱。</p>\n  <p>就这样，两个品牌各自靠着“大哥”和“小孩哥”坐上了跑鞋市场份额第三和第四的位置——这两块蛋糕来自外资巨头没有照顾到的差异化人群。</p>\n  <p><strong>当跑鞋快速从专业装备变成大众日用品，过去那些依靠圈层认同、而非专业人群建立起来的高端跑鞋品牌，业绩也难免开始松动。</strong></p>\n  <p>截至今年6月底的最新一个财季，HOKA收入同比增长7.7%，这是近年来该品牌首次出现个位数增长——去年同期HOKA收入增速还高达19.8%。</p>\n  <p>至于昂跑，今年，曾推动其上市的前CEO Martin Hoffmann上任不到一年便离开。一位昂跑前员工告诉36氪，在联席CEO时期，管理层曾围绕一个问题发生分歧：昂跑究竟应该“更运动”，还是“更时尚”？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_32021d01c2e348c9b6505b307c9c8ef8@5922386_oswg458087oswg3576oswg1987_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来雨：公司财报</p>\n  <p>昂跑联席CEO的管理架构看起来足够平等，但真正的决策权并不均等。在三位创始人中，最擅长市场营销的David Alleman被认为“话语权最大”。这也影响了昂跑的选择：它更早把自己做成了一门时尚和生活方式生意，而不是一家真正意义上的专业运动品牌。</p>\n  <p>一个直接的结果是，昂跑在专业运动赛事上的投入相对有限。这位前员工尤其提到，这一点“在中国更明显”。</p>\n  <p>另一位接近昂跑的人士认为，随着公司重新回到三位创始人手中，昂跑正在进入一个“下一篇章”。“昂跑正在搭建更多产品线，也在探索更广泛的人群。”该人士说。这种变化不只体现在服饰业务的扩张，也体现在对跑步场景的重新定义。过去长期维持1500元以上价格带的昂跑，最近开始向下探，推出售价1000元出头的“一脚蹬”休闲鞋。</p>\n  <p>昂跑们在寻找新的消费者，国产品牌在面对另一种问题：原来的消费者不再买单。</p>\n  <p>对于李宁来说，最早穿赤兔的那批少年也已上了高中、大学，不再愿意穿“以前那种糖果鞋”。这部分销量自然消失了，而下一代“小孩哥”在数量上已经无法复制上一代人的规模。</p>\n  <p>2025年，找不到新人群的旅步二代、三代，开始对着销售报表“打补丁”：山东卖得好，就加一个配色；东北反馈天气冷，就加一层绒毛内里。</p>\n  <p>旧人群的人口红利正在消退，新人群没有及时补上。增长从哪里来——这个问题，每个人都在问。</p>\n  <h3><strong>晚来的人</strong></h3>\n  <p>对于一个有潜力的运动品类，国际品牌往往会提前五年、十年、甚至二十年来布局。</p>\n  <p>Vaporfly 4% 2017年上市，耐克由此重新定义了跑鞋市场，目标是马拉松破二（全马跑进2小时）。但真正的商业变现要等到2020年，碳板技术下放到走量鞋款上——从技术立项到销量回馈，耐克花了至少七年。</p>\n  <p>但国产品牌等不起，它们入局跑鞋时就晚了。</p>\n  <p>这里有一些历史遗留原因。很早以前，为了在激烈的市场环境中生存，晋江运动品牌的老板们有一套“君子协定”，简单来说，就是各自做各自的运动项目，彼此井水不犯河水。安踏和特步，一个做篮球，一个做跑步。签约奥运国家队之后，安踏还一度潜心研发雪车用鞋这样大众化基本无望的运动项目，李宁还曾很长时间将羽毛球作为重点。</p>\n  <p>跑步趋势抬头之后，这份默契岌岌可危。</p>\n  <p>安踏有一度差点把厦门马拉松的赞助拿下——而那是特步最金贵的资产。最后两位老板喝了顿茶这件事就不了了之——特步创始人丁水波和安踏创始人丁世忠同姓、同乡，这张桌子的规矩是大家都有饭吃。</p>\n  <p>况且，彼时安踏刚掏空钱包。2019年3月，安踏集团牵头方源资本、腾讯和lululemon创始人Chip Wilson的家族基金，掏出46亿欧元（约合360亿元）买下亚玛芬体育，创下中国鞋服史上最大的一笔跨国并购。“这是我从创业到今天，所做的份量最重的一次决定。”丁世忠在内部信里写。</p>\n  <p>后来的很长时间，始祖鸟代表的户外市场成了安踏集团的资源重点，特步在此时趁虚而入买下了索康尼在大中华区的业务，在专业跑步领域卡住下一个重要的身位。直到2021年，安踏才有了第一双碳板竞速跑鞋，出自从阿迪达斯挖来的设计师Robbie Fuller之手。</p>\n  <p>李宁从2018年开始重视跑步，2019年推出对标耐克Vaporfly 4%的飞电一代，定价2099元。这个价格当时被广泛质疑，李宁鞋产品负责人徐剑光后来回忆：“人家说你凭什么？”重新梳理这套体系，已经是2020年的事。</p>\n  <p>国产品牌在跑鞋战略上慢了几拍，营销上也落后许多。</p>\n  <p>早在二十多年前，耐克和阿迪达斯就进入非洲，分别在肯尼亚和埃塞俄比亚建立起与顶尖长跑运动员的长期合作，各自垄断了这个星球上跑得最快的人的脚。</p>\n  <p>“他们（指非洲运动员）经常拿着耐克鞋告诉我们：我要一模一样的。开出来的合同金额，也是耐克的七倍。”曾在李宁负责体育营销的袁少卿在一档播客节目中说。他的工作是维护和挖掘运动员和赛事资源，为品牌做曝光，俗称“买脚”。</p>\n  <p><strong>对于后来者，能做的似乎只有用钱换时间。</strong></p>\n  <p>近几年，李宁加快了在非洲“买脚”的速度，但这些专业成绩在国内始终没有完全转化为大众认知。其中也有不走运的成分：李宁签约的运动员曾在一些关键比赛中出现退赛、身体不适等突发情况，几次与领奖台擦肩而过。</p>\n  <p>去年，因为国内市场“卷不动了”，李宁开始尝试出海。袁少卿为此曾花了不少精力说服了管理层，以“不小的金额”签下了日本国家马拉松纪录保持者大迫杰，“相比黑人，一个黄种人的面孔在亚洲市场当然更有亲和力。”</p>\n  <p>特步是最早将跑步作为支柱业务的国产品牌之一，也拥有马拉松国家纪录——2024年，何杰穿着特步160X跑出2:06:57的成绩，至今仍是国内马拉松跑得最快的人。</p>\n  <p>何杰脚上那双鞋，是特步十几年的技术迭代攒出来的。但特步仅仅靠这条精英技术叙事，此时也无力再支撑实实在在的定价和销量。</p>\n  <p>2026年第二季度，特步公告显示，品牌零售折扣将维持在七折至七五折区间。管理层将其称为“有纪律的折扣策略”，但在渠道端，这意味着价格竞争已经成为常态。特步旗舰碳板跑鞋360X系列初上市售价已被压在600元以内，2025年折后一度卖到399元，这是一个放到五年前想都不敢想的价格。</p>\n  <p>今年年初，上海经销商Mason发现同一款鞋，索康尼的官方线上旗舰店打完折之后比他的拿货价还低。“这不是砸我们的饭碗吗？”</p>\n  <p>经销这门生意的全部前提是渠道价差，品牌管生产和营销，经销商扛库存、扛风险，赚的就是中间那一段。直营价一旦打到经销价之下，这段利润在算术上就不存在了。为了品牌形象等等因素，品牌通常会跟经销商约定一个“终端零售价”，“下次我也不管了，进价加10块直接卖了算了。”说到最后，Mason有些不忿。</p>\n  <p>这一轮价格战力度之大，甚至已经影响到了仿制鞋产业链。一位不愿具名的莆田仿鞋从业者说：“一些国产品牌正品入门款一上市就是两折，旗舰款长期三四折，清货甚至能到一折。我们的生意还怎么做？”</p>\n  <h3><strong>大赢家</strong></h3>\n  <p>7月22日，耐克宣布进一步调整中国市场渠道策略，收回线上经销业务。对于跑鞋市场而言，这意味着未来数个月，价格体系可能经历更激烈的回调。</p>\n  <p>“我们怕耐克打折，也怕耐克不打折。”阿迪达斯大中华区总经理萧家乐内部开会时说。耐克是这个市场的价格锚，它无论选择扩大促销，还是维持价格体系，都会影响整个市场对于同一品类价格的判断——耐克Dunk Low从加价数千到7折甩卖之后，整个市场1500元以上的产品消失了很长一段时间。</p>\n  <p>因此，即使在风调雨顺的时节，这位擅长与经销商打交道的香港老板也在时刻关注库存变化。2023年，阿迪达斯和海澜之家签署合作，海澜之家将改造部分门店作为阿迪达斯在三四线和更下沉市场的销货渠道。截至发稿，这类门店已铺到700多家。</p>\n  <p>这帮助阿迪达斯中国的库存价值从当初的70亿下降到了50亿，且品牌正价渠道和形象没有受到明显影响。过去三年，阿迪达斯在中国一边推行本地化，一边完成了对跑鞋日常化的改造。上半年，阿迪达斯大中华区的利润率高达27.6%——很可能是这场山雨欲来的价格战里最大的赢家。</p>\n  <p>36氪了解到，阿迪达斯的跑步业务已经被三叶草的负责人所接管。这意味着在大型体育公司的判断里，跑鞋已经正式进入了时尚周期，折扣和换季将更为频繁。这家公司以直言不讳著称的CEO曾坦白：平均每个美国人的鞋柜里有4.3双跑鞋，“但是多少人是坚持在跑步的呢？”</p>\n  <p>价格战的苗头出现之后，故事也就不再值钱。前几年，一块中底、几位跑者、几场PB（Personal Best，个人最好成绩）挑战赛，一个初出茅庐的跑鞋垂类品牌就能融到一大笔的钱，现在这些远远不够了。</p>\n  <p>在国内消费投资机构看来，市场前景还是有的，但投资人看的重点已经变了，对营收门槛的要求也更高。上述消费投资人告诉36氪，除了标的的规模要“3-5亿元往上”的数据指标，从发展方向判断上，<strong>偏向生活方式最好，出海能力是重点。</strong></p>\n  <p><strong>好在，还可以指望下一个风潮和周期。</strong>下一个周期已经有人押上了：越野跑。这一次，一些国产品牌变得更耐心了一些——不从大众市场直接开打，而是先去专业赛事里把上脚率做出来。</p>\n  <p>凯乐石2011年开始碰越野跑鞋，五年后才推出第一款FUGA，此后十几年一直在赞助跑山赛、养“跑山帮”社群，研发投入据其自述早已过千万。2025年国内近二十场头部跑山赛事，FUGA系列穿着率40.64%，超过榜单后四名之和，紧随其后的三家全是海外品牌。有媒体测算凯乐石2024年营收约40亿元，如今正朝百亿走。</p>\n  <p>每个消费品周期的开头，都要靠运气、时机和努力，没人算得准，赌对了才有资格上桌。但真正赚钱的永远是后半段：路被别人趟平，风险被别人交过学费。于是所有人都想跳过前半段，直接进入繁荣阶段。</p>\n  <p>当牌桌挤满了只想赢钱、没人愿意发牌的人，这一局也就散得格外快。</p>", "category": "tech", "published_at": "2026-08-28T02:30:42+00:00", "fetched_at": "2026-08-28T08:44:49.161692+00:00", "fingerprint": "3d60e5d5b6b88f50"}, {"source": "36氪 - 最新文章", "title": "硬氪专访丨几百个投资人不想投的光芯片公司，现在估值快200亿了", "url": "https://36kr.com/p/3958587575975049?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>2023年，「光本位」的创始人熊胤江跑遍了四五百家投资机构，几乎把中国能见的VC都聊了一遍，嗓子都聊哑了。</p>\n  <p>有一次，他拖着病体，还飞去北京见了两家机构，“身体非常难受”。即便如此，他得到的仍然是敷衍的套话： “我们很感兴趣”、“会继续跟进“。</p>\n  <p>见完几百个人，他拿到的TS还是个位数。那时熊胤江27岁，刚刚回国，第一次体会到资本市场的现实和冷酷。</p>\n  <p>熊胤江其实知道，自己不是投资人钟爱的那种创业者。没有大厂履历、没有学界大佬背书、还选了光芯片这样的冷赛道。“现在可能有些投资经理会被问’当时为什么没投’，但那时这类机构老板很难拍板投资这种’非共识’的项目。”</p>\n  <p>直到2024年，光本位也只是艰难地拿到了2-3亿，估值不过几十亿。尽管如此，他没有停下。</p>\n  <p>2024年，「光本位」128×128光计算芯片流片点亮；2025年初，完成板卡封装；同年三季度，他们通过客户POC验证并拿下行业垂直模型订单，这也是<strong>全球首个光计算产品进入商业化。</strong></p>\n  <p>时代终于跟上了他们。转机猝不及防。</p>\n  <p>2025年3月，英伟达发布采用硅光和共封装光学技术的交换机。过去只在学界被人关注的光计算，第一次走到了产业台前。今年年初，英伟达又分别向光模块公司Lumentum和Coherent投资20亿美元，真金白银投到了“光”产业中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_9742119be1764120a8ada5bfbca72265@1199336245_oswg1359286oswg1080oswg716_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">256x256光子存内计算芯片（图源/企业）</p>\n  <p>英伟达的动作向来是风向标，2025年下半年开始，一二级市场投资人，忽然开始喊起那句耳熟能详的口号——“相信光”。</p>\n  <p>很快，A股AI与光模块板块“易中天”（新易盛、中际旭创、天孚通信）在二级市场走红，三家公司市值一度超过2.4万亿。紧接着光计算芯片公司「曦智科技」上市，上市当天最高100亿美金的市值也给此前缺乏参照物的光计算公司提供了新的估值锚点。</p>\n  <p>客观来说，光计算芯片走红也是产业发展的结果，英伟达只是给行业提供了信心。大模型进入万卡集群，GPU之间的数据交换越来越频繁，传统电连接在带宽、功耗、延迟上的局限逐渐暴露，“跑”得更快的光，理所应当被用于芯片之间的高速互联。</p>\n  <p>“这不是赶热点式的市场炒作，而是光芯片迎来了一次科技资产估值回归”，熊胤江表示。</p>\n  <p>提前三年做好准备的「光本位」，自然从幕后走向了台前。</p>\n  <p>硬氪获悉，近一年内「光本位」已完成数轮融资，累计融资金额达到数十亿元。投后估值飙升至近200亿，成为这个赛道估值最高的公司之一。</p>\n  <p>资方是一串明星投资人：国投先导、上海科投、Monolith砺思资本、华控基金、吉利资本、商汤国香、海通开元、中信建投、中贝通信、朗玛峰创投、鋆昊资本、申能诚毅、浦耀信晔、华睿投资、海汇投资、道禾长期、明泓量化等。</p>\n  <p>此外，锦秋基金、敦鸿资产、小苗朗程、接力资本、慕石资本等多家老股东连续多轮追投。</p>\n  <p>相比多数公司率先从商业化更成熟的光互连切入，「光本位」同时布局光互连和光计算。二者的区别是，光互连解决的是“怎么传”，让GPU和交换芯片更高速、低功耗地交换数据；光计算解决的是“怎么算”，目标是替代传统GPU，让光直接参与AI推理的运算。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_fec9b1a8e7624b3a82b24e844035c76e@1199336245_oswg46140oswg959oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基光计算芯片（图源/企业）</p>\n  <p>在产品方面，「光本位」今年进一步发布了256×256光子存内计算芯片和玻璃基光计算芯片，并将光芯片与承担信号转换、非线性运算的电芯片集成到同一张计算板卡中——这意味着，服务器不再额外搭载其他公司的GPU，核心计算由这套光电融合板卡完成。</p>\n  <p>在大部分玩家还在突破产品、流片攻坚时，「光本位」已经在商业化上越跑越远。今年，他们不仅与百度智能云推进联合产品开发，还与东方天算探索卫星载荷和在轨AI推理。根据该公司提供的数据，他们目前已获得数亿元订单及意向协议，完成10余个光计算系统的规模化交付。</p>\n  <p>资本和「光本位」的位置似乎发生了倒转。过去，光芯片的估值逻辑是，由看懂技术逻辑并敢于下注的投资人参照国外同类光计算公司估值，再打个折扣，公司选择接不接受。而这一轮，变成了公司出价，投资人仅回答yes or no。</p>\n  <p>不过，熊胤江经历过低谷，早已对估值祛魅。“我们一开始就经历高难度，反而心态更扎实，考虑问题更现实，不会有太多不切实际的预期。”</p>\n  <p>他清楚，光计算如今依旧如“被捆住手脚跳舞”——未来仍需适配一套围绕电计算建立起来的芯片、软件和数据中心标准，这导致了很多属于光的速度和能效优势还没有被完全释放。</p>\n  <p>但他依旧乐观。熊胤江告诉硬氪，未来5至10年，产业可能逐步出现围绕光重新设计的硬件、算法、通信和能源体系，形成真正的“光原生”架构。</p>\n  <p>“参照半导体产业的演进周期，光计算未来是一条持续50年的赛道，它更不是量子计算和电计算的过渡方案”。</p>\n  <p><strong>以下是硬氪与熊胤江的交流（略经摘编）</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_512f79752bce414ba1f75538dabf6933@1199336245_oswg62546oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">光本位创始人熊胤江（图源/企业）</p>\n  <h3><strong>估值近200亿，光计算公司走到台前</strong></h3>\n  <p><strong>硬氪：过去两年你们的估值和融资发生了很大变化，这个转折是怎么发生的？</strong></p>\n  <p><strong>熊胤江：</strong>大背景是市场大势发生了变化。一方面是AI的CAPEX（资本开支）快速增长，大厂开始堆卡，建设基础设施，训练和推理更大的模型，带动了整个计算产业。</p>\n  <p>另一方面，年初英伟达先与台积电发布了硅光交换机方案，又投资了 Lumentum、Coherent两家光源芯片公司，用真金白银为“光”投票，迅速点燃了市场对光计算、光互连的热情。</p>\n  <p>当然，我们也正好走到商业化节点。经过大约三年发展，光计算的供应链逐步跑通，产品进入商业化拐点。</p>\n  <p><strong>硬氪：2023年当时融资最困难的时候，具体经历了什么？</strong></p>\n  <p><strong>熊胤江：</strong>刚创业的前两轮融资我们累计见了四五百家投资机构，几乎把中国能见的VC都见过一遍，我一家一家去聊，最后嗓子都讲哑了，当时很多人会说“我们很感兴趣”、“我们会继续推进”，但最后都没有成功，最后只有六七家机构进入，成功率是个位数。</p>\n  <p>当时不少头部美元基金资金紧张，出手非常谨慎，而且大部分资方更偏好学术领军人团队，也偏好已经形成行业共识、退出路径清晰的项目。<strong>我们当时在他们眼里属于是高风险、回报不明确、退出路径不清晰的项目。</strong></p>\n  <p>后来有些机构在我们估值5亿到35亿元时都看过，但没有投资。等公司估值到了几百亿元，再让它们进入，它们在心理上也很难接受，推翻过去的投资决策需要投委会的极大魄力。</p>\n  <p>我们的团队是顶着疫情回国创业的，前半年很多地方都去不了。我记得有一次去北京见两家机构，当时大家都感染了，我带病去见了机构，身体非常难受。我们一开始就经历高难度，反而让心态更扎实，考虑问题更现实，不会有太多不切实际的预期。</p>\n  <p><strong>硬氪：估值飙升，是不是这个赛道的定价体系也发生了变化？</strong></p>\n  <p><strong>熊胤江：</strong>早期融资是由领投方定价——投资人认为公司值多少钱，公司选择接受报价，或者继续寻找其他投资人。</p>\n  <p>但我们今年的策略变成由公司定价，这个定价背后，是我们对这份事业的长期信心，以及结合未来几年收入、订单和技术路线的完整测算。</p>\n  <p>我认为公司必须主动建立自己的价格，因为我们认为，公司的市场位置和容量值得这个价格，也相信会落在部分投资人的舒适估值区间内。</p>\n  <p>这件事情的底层是更深层的变化，是估值范式发生了改变。<strong>中国过去经常把芯片当作 commodity（大宗商品），用成本和较低的&nbsp;PE&nbsp;定价</strong>。例如，一颗光芯片的成本可能只有几十元，于是投资人就按单颗芯片的逻辑给公司定价。</p>\n  <p>我们认为，我们做的不是一颗普通光芯片，而是GPU式的计算系统，它的定价应当参考英伟达式的系统价值和产出能力，而不是只看单颗芯片的制造成本。</p>\n  <p>因此，<strong>这一轮上升更像是中国科技资产的“估值回归”，而不只是市场炒作。</strong></p>\n  <p><strong>硬氪：高估值是市场的认可，会不会同时代表着风险和枷锁？</strong></p>\n  <p><strong>熊胤江：</strong>我们团队非常清楚高估值的风险。我认为，创业者不能只跟随投资人的情绪，而要关注业务本身的底层发展逻辑。机会来了，必须抓住，要借助这个机会让公司的现金流足够安全，招到更优秀的人，并把资金转化成研发和商业化能力。公司的逻辑不是随意喊高估值，也希望每个阶段的投资人都能够赚到钱。</p>\n  <h3><strong>光芯片商业化起飞</strong></h3>\n  <p><strong>硬氪：能否介绍一下你们主要的业务是什么？</strong></p>\n  <p><strong>熊胤江：</strong>第一类是光计算，第二类是光互连。</p>\n  <p>“光计算”产品直接对标 GPU，包括英伟达等国际主流 GPU，以及国内 GPU 产品。我们的服务器插入的是自己的光计算卡，不需要再搭载其他公司的GPU。</p>\n  <p>但这张卡并不是只由光芯片完成所有运算。光芯片主要负责大规模线性运算，也就是AI模型中的张量计算。电芯片负责光电信号转换，并完成取绝对值、指数等非线性运算。两者共同组成一套光电融合的计算架构。</p>\n  <p>“光互连”则主要服务GPU在内的计算芯片厂商。我们会提供design-in方案，把光互连设计融合到对方GPU架构里，帮助GPU“出光”。</p>\n  <p>英伟达的重要护城河之一是 NVLink，用高带宽把大量GPU组成大型计算集群，而国内如果主要依靠 PCIe，带宽可能相差一个数量级。</p>\n  <p>当集群从千卡迈向万卡时，能否把多张GPU高效地看成一张GPU、组成一个大的计算池，会越来越重要。这就是scale-up和光互连的价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_cfe63a1bd35c4fa1a15b333a27f255f6@1199336245_oswg896096oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基光计算芯片（图源/企业）</p>\n  <p><strong>硬氪：公司的商业化从什么时候开始明显加速？</strong></p>\n  <p><strong>熊胤江：</strong>明显的转折发生在今年4月至6月，而且一直延续至今。我们组建了一支更成熟的商业化团队，把市场、产品和技术打通。我本人也在一线盯商业化。</p>\n  <p>最近2年对于互联网大厂项目的贴身式服务给我们提供了很大启发，也沉淀了一套进入大厂、推动联合研发和完成交付的方法论。因此，我们在手项目的客户数量和质量都出现提升，合作对象多是有较强现金流和持续 CAPEX 能力的科技大厂、模型公司。</p>\n  <p><strong>硬氪：与某互联网大厂云厂商的合作，最初是怎样开始的？</strong></p>\n  <p><strong>熊胤江：</strong>最开始他们是想向我们销售一些半导体产业相关的SaaS工具。聊的过程中我意识到，与其做单点采购，不如把双方技术团队拉到一起，看看能不能做出共建方案。</p>\n  <p>我随后提出，不如把双方技术团队约到一起，讨论能否做共建方案。对方技术团队听完之后，认为这是一个比较有价值的方案，因为我们的技术可以提升他们的产品能力和产品溢价。后面一步步推进到他们总裁层面。</p>\n  <p>最终，我们的关系从“对方向我们卖工具”，反转为“双方联合研发，再把产品卖给下游客户”。这是我们商业化闭环跑通的一个重要转折点。</p>\n  <p><strong>硬氪：这个合作听起来比较顺利，真正困难的地方是什么？</strong></p>\n  <p><strong>熊胤江：</strong>真正困难的是大厂内部协作，而不只是技术。销售和采购属于不同的体系，团队需要摸清多层关系，找到关键卡点，推动不同部门之间协同。整个合作大约持续了半年，到真正的产品适配、测试和交付，大约用了一个月。</p>\n  <p>单点技术突破，甚至让大厂下游客户愿意为产品买单，都未必是最难的事情。最大的壁垒往往是如何进入大厂体系。大厂订单量动辄非常大，因此进入门槛也格外高，很多公司能够把产品卖给中小企业，却始终卖不进大厂，原因就在这里。</p>\n  <p><strong>硬氪：明年收入高速增长的预期，主要靠哪些客户支撑？</strong></p>\n  <p><strong>熊胤江：</strong>我们的芯片主要是在垂直应用的推理场景中，把应用部署在公司的光计算服务器上，让推理跑得更快，然后交付服务器。方向主要包括AI Coding、AI 工业、AI 制药、AI 金融、视频生成、AI 短剧等。</p>\n  <p>明年起量主要来���三类客户。第一类是互联网大厂。第二类是基模公司。它们开始大量自建算力，CAPEX 投入非常高。</p>\n  <p>第三类是垂直 AI 公司，随着基模能力越来越强，这些公司也必须不断迭代自己的模型能力，否则可能很快被基模公司取代，因此也需要持续投入算力。</p>\n  <p><strong>硬氪：目前国内训练和推理在算力侧出现了哪些变化？</strong></p>\n  <p><strong>熊胤江：</strong>目前训练算力依然紧张，行业也在探索更多元的算力部署方式。</p>\n  <p>在推理侧，行业正呈现百花齐放的态势。只要一个AI产业真正成熟，推理和训练的需求长期可能呈现“七三开”的态势，模型训练完成以后，真正长期、大规模发生的是用户使用模型所产生的推理需求。</p>\n  <p><strong>硬氪：推理芯片竞争激烈，有很多国产GPU和AI芯片公司在抢夺市场，你们如何切入这一市场？</strong></p>\n  <p><strong>熊胤江：</strong>推理产品的竞争可以归结为一句话：在能够运行较大、较高质量模型的前提下，速度越快、成本越低，产品越有竞争力。</p>\n  <p>光计算最核心的两个指标是：</p>\n  <p>tokens per second：每秒可以生成多少 token，代表速度；</p>\n  <p>tokens per watt：每瓦电可以生成多少 token，代表能效。</p>\n  <p>光天然具有速度快、能耗低的特点，因此这两个指标应当成为产品的核心优势。但接下来更重要的问题，是让光计算适配更多、更优秀、更大的模型。如果运行的模型本身没有人用，计算再快也没有价值。</p>\n  <p>因此，我们会主动选择未来可能快速爆发的应用，把硬件架构与 AI Coding、太空计算、金融、视频生成等领域结合，让算力真正变成有人使用的“有效算力”。</p>\n  <p><strong>硬氪：商业化上为何还选择了太空算力这个一方向？</strong></p>\n  <p><strong>熊胤江：</strong>去年下半年，我花了大约半年时间，把市场上主要的太空计算公司摸了一遍，包括东方天算、轨道辰光等，并与创始人进行交流。</p>\n  <p>当时行业还没有现在这么热，不少方案只是把英伟达的卡送到太空。我的判断是，如果只是换一个环境使用N卡，长期意义有限。未来仍需要国产化、更高效的方案。</p>\n  <p>我认为，太空计算需要把几个问题结合起来：如何在有限能源条件下降低功耗？如何同时解决数据传输和计算？如何与太阳能等能源方案协同？</p>\n  <p>光计算非常适合太空环境。一是，光天然抗辐照，不容易受到太空射线影响；二是，卫星之间本身就在大量使用激光通信。光计算可以更自然地融入太空通信和信息链路。</p>\n  <p>并且，太空算力背后是国家级商业航天和天地一体化信息网络的战略大方向，未来行业需要国产化、更高效的方案。</p>\n  <p>团队最终选择东方天算，是因为其拥有多次发射经验和卫星能力，也有产业经验。这可能是人类历史上第一次将光计算与太空计算结合。</p>\n  <h3><strong>光计算能持续50年</strong></h3>\n  <p><strong>硬氪：似乎你们创业以来一直在做非共识的判断，比如很早提出用相变材料做光芯片，两年前就开始研发玻璃基等等，为什么？</strong></p>\n  <p><strong>熊胤江：</strong>我们不敢说每一次判断都正确，但我们愿意下注，去选择当下看起来并非主流、甚至会被行业资深人士质疑的路径。</p>\n  <p>我们相信第一性原理。对于“做了30年、50年”的专家，我们会尊重，但也会保持审慎，不会单纯论资排辈。行业正在快速变化，需要有一批新生代团队敢于下注新的技术方向。这可能也是年轻创业者的优势。</p>\n  <p><strong>硬氪：为什么选择布局玻璃基光计算的方向？</strong></p>\n  <p><strong>熊胤江：</strong>玻璃和光天然适配。第一，玻璃可以摆脱传统光刻对单颗芯片面积的部分限制，让单颗芯片容纳更大的计算矩阵，一次完成更多计算。</p>\n  <p>第二，光在玻璃中的传输损耗低。光纤本质上也是用玻璃传输信息，因此整体传输效率更高。</p>\n  <p>第三，我们判断玻璃封装会进入快速发展期。随着工艺成熟，把玻璃芯片封进数据中心并不是异想天开，也不需要像量子计算那样建立单独的运行环境。</p>\n  <p>我们两年前就开始布局玻璃光计算，后来康宁获得英伟达投资，TGV等玻璃相关技术升温，也验证了团队早期的判断。</p>\n  <p><strong>硬氪：今年又冒出了很多新公司，你认为光计算的技术路线已经收敛了吗？</strong></p>\n  <p><strong>熊胤江：</strong>还没有完全收敛，但也不再继续扩散，现在处于逐渐收敛的过程中。目前行业存在两个重要共识：</p>\n  <p>第一，要让一次光电转换承载尽可能多的信息和计算。光计算的一部分开销来自光电转换，因此一次转换能够完成的矩阵越大，整体性价比越高。这也是各家都强调矩阵规模的原因。</p>\n  <p>第二，要继续降低光电转换本身的能耗。一次计算承载更多信息是“开源”，降低转换能耗是“节流”，两者都会提高整体能效比。</p>\n  <p><strong>硬氪：行业目前处于什么阶段？</strong></p>\n  <p><strong>熊胤江：</strong>现在只是“星辰大海的第一步”。当前的光计算有一种“被捆住手脚跳舞”的感觉——它必须在电计算的范式中，适配所有与电相关的标准，因此不得不做出很多取舍，导致光的能效优势无法被完全释放。</p>\n  <p>我认为未来会逐步出现光原生系统架构，比如会出现以光为核心的硬件架构、以光为核心的算法、出现光计算与通信、能源的协同、甚至是围绕光重新设计的软硬件结合体系。太空光计算可能就是一个先行场景。</p>\n  <p>英伟达今天的壁垒，从来不只来自某一代GPU，而是从AlexNet 时代开始，围绕GPU、算法、软件和开发生态长期积累形成的。光计算未来也需要建立类似的系统级能力。</p>\n  <p><strong>硬氪：你预计什么时候“光原生”的时代会彻底到来？</strong></p>\n  <p><strong>熊胤江：</strong>参考半导体产业的演进，光计算可能是一个持续约50年的长期赛道。在未来5至10年内，行业可能发生一次本质性的变化，更多光原生架构开始出现，光计算不再只是被嵌入电计算体系，而是逐渐形成自己的系统结构。</p>\n  <p><strong>硬氪：有很多人觉得，光计算只是电计算和量子计算的过渡，你怎么看？</strong></p>\n  <p><strong>熊胤江：</strong>我完全不认同。即使量子计算再发展50年，也未必适合通用 AI 计算，但它可能先在加密、解密等特定任务上打开窗口，这与今天的 AI 计算是完全不同的任务。</p>\n  <p>今天的AI计算，更像让一万个小学生并行做题，而量子计算则更像让一个能力极强的教授解决极复杂的问题。两者的任务结构不同，不是简单的前后替代关系。</p>\n  <p>我认为光计算不是短暂的过渡技术，而是可能长期独立存在并持续演进的计算范式。</p>\n  <p>我们这代创业者很幸运，赶上了AI大浪潮与国家今天在科技创新领域的整体生态实力，有机会参与改变算力与能源基础设施的宏伟事业。我们能做的，就是把这件难而正确的事坚持做下去。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_f5e40f7e859145e4a04adabc013e714c@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>", "category": "tech", "published_at": "2026-08-28T02:47:42+00:00", "fetched_at": "2026-08-28T08:44:49.161685+00:00", "fingerprint": "b59f40919a0c12bd"}, {"source": "36氪 - 最新文章", "title": "赵长鹏在香港，回答了15个问题｜现场直击", "url": "https://36kr.com/p/3958638529117569?f=rss", "summary": "<p>8月27日清晨5时05分，香港发出红色暴雨警告，所有上午校和全日制学校停课。</p>\n  <p>赵长鹏的航班也被暴风雨耽搁，凌晨3点才抵达香港。大约六个半小时后，他出现在《币安人生》书友会现场。原本只准备开放一半的会场坐满了人，活动方临时打开了全部区域。</p>\n  <p>赵长鹏，大家更熟悉的名字是CZ。他坐在港交所40楼的一间会议室里，面对一群从港大、科大、中大，以及帝国理工、伦敦政经、UC Irvine、约翰霍普金斯赶回来的年轻人，聊了一个多小时。</p>\n  <p>本次活动由资深媒体人、亚芳创变派创始人谢亚芳主持，她开场时表示：今天不聊产业，不聊某一次创业的成败，只想回到一个人的底层逻辑。一个曾经影响过全球财富流动、又跌进人生低谷、坐过四个月牢的人，出来之后怎么看这个世界。</p>\n  <p>新书叫《币安人生》（英文名 Freedom of Money）。而这本书的第一行字，是在监狱里写下的。</p>\n  <h2>一、这本书，是在监狱里“找点事做”写出来的</h2>\n  <p>问他为什么写书，他的回答朴素到有点好笑：“当时在监狱里面比较无聊，就说那正好整点事情，让自己忙一点。”</p>\n  <p>于是有了一个作息：每天睡觉、吃东西、健身，再写十五分钟。写着写着攒了一堆，他想“还是不要浪费这个时间了”，就决定整理出版。结果整理花的时间，比写的时间还长。</p>\n  <p>真正折磨他的并不是狱中四个月，而是进去之前。他被困在美国五个多月，不能离开，一边准备开庭，一边不知道判决会是什么。他说那段时间最难熬的是不确定性：<strong>“会不会一直把我留在那里？会不会过一段又有一个新的罪名出现？”</strong></p>\n  <p>进去之后反而清净了。没有互联网，查不了时间轴，只能靠回忆写。出狱后他把自己在X上发过的所有内容翻了一遍做校对，发现了几件漏掉的事——</p>\n  <p>“但是漏掉的东西好像没有自己回忆的那么精彩。”</p>\n  <p><strong>记得住的，本来就是重要的。</strong>他自嘲记忆力“大概比金鱼稍微好一点点”，别人跟他说个事五分钟就忘，但重大时刻的细节忘不掉：就像911发生的时候你在做什么，你可能记得。</p>\n  <p>书是他自己用英文写的。中间找过专业的人帮忙改写，改完他一看——“就不是我的话了”，于是几乎全退回。中文版里，何一帮他写了序、翻译了几段，他读的时候发现：“里面她用的词，我都不会读。”</p>\n  <p>他的处理方式很CZ：<strong>“我书里面的中文，不能有我不会读的字。”</strong>所有难字，最后都被删掉。</p>\n  <h2>二、卖房买BTC的那一刻，他到底在算什么</h2>\n  <p>这是全场学生最想问的：你凭什么在那个时候，敢把房子卖了？</p>\n  <p>他把答案拆成了两半。<strong>第一半是认知——赛道。</strong></p>\n  <p>“社会永远是进步的，人类永远是进步的。只要新的东西有价值，都会被用。”他说大赛道其实非常容易看清，容易到“所有人都会告诉你”：早年是电脑硬件，然后是互联网，现在是web3、AI、生物科技。在这个赛道里面成功的公司都会成功，都会几千倍几万倍地增长。</p>\n  <p>他补了一句大实话：web3看着是大赛道，但发展到今天其实还很窄，“基本上就只跟钱有关”，像土地确权这些都还没真正跑起来。</p>\n  <p>所以真正的问题不是赛道对不对，而是——“这个赛道里面你能够做出什么东西来，是你自己能力决定的。”</p>\n  <p>还有一句他重复强调的话：<strong>人生的成功，80%在于到场。</strong>“你一定要参与，不参与的话就没有机会。”</p>\n  <p><strong>第二半是风险——底线。</strong>他说风险因人而异，判断标准只有一条：</p>\n  <blockquote>\n   <p>如果这件事情归零了，投资人的钱全赔光了，你也撑不下去了——这个时候你的生活能不能继续？你的生活质量受多大影响？你能接受影响到什么程度？</p>\n  </blockquote>\n  <p>他自己的答案很清楚：<strong>“即使BTC归零，我再去华尔街拿一份六位数美金的工作，应该问题不大。”</strong></p>\n  <p>“那个是我的底线，也是我的底气。没有这个底气的话，你可能要冒的险要稍微少一点。”</p>\n  <p>顺着这条线，他给了年轻人和中年人两份不同的处方：年轻人风险回报率不一样，家庭负担小，可以冒得高一点；年纪大的社会负担重、冒险能力弱，但积蓄和人脉多，也有平衡——“所以很多创业者其实都是四十多岁才开始创业的。”</p>\n  <p>然后他说了一句让全场安静的话：“<strong>币安，我开始创业的时候，已经39、40了。”</strong></p>\n  <h2>三、压力最大的一次，是BNB破发的那几周</h2>\n  <p>被问到人生压力峰值，他没提监狱，也没提43亿美元。</p>\n  <p>他说是ICO之后那两三周——BNB跌破发行价，而两三万人买了。</p>\n  <p>“当时压力很大。”</p>\n  <p>他对“成功要素”的判断也没什么玄学：“我相信在座的人智商都已经很高了。一旦过了那个门槛之后，你再高也差不了太多。”情商也重要，但到最后——“<strong>还是要坚持。抗压能力还是蛮重要的。”</strong></p>\n  <h2>四、全场最刺的一个问题：能回到人生哪一刻？</h2>\n  <p>主持人问：如果能回到人生中的某个时间节点，你想回到哪里？想改变什么？</p>\n  <p>他想了几秒。“大概回到18岁最好吧。”</p>\n  <p>为什么？</p>\n  <p><strong>“青春是最有价值的。如果现在说，把所有的财富全部去掉，能够回到18岁——那根本不用想，我100%想立马回去。”</strong></p>\n  <h2>五、什么不做，比做什么重要</h2>\n  <p>这是他反复讲的一条原则，而且他强调这句话不是他的原创，是从别处看来的，但他自己执行得极彻底。</p>\n  <p>“现在多数人不考虑什么不做。别人发个消息，一定要回一下；别人约他出去玩，就一定要去；一定要有社交；朋友喜欢什么，他就一定要喜欢什么。”</p>\n  <p><strong>“这些事情很多人完全可以砍掉，但是没有砍。”</strong></p>\n  <p>主持人接了一句：所以你今天选择来这里，是真心选择要做的？</p>\n  <p>“是呀。这个也完全可以不做，但是我还是选择做。”</p>\n  <h2>六、创业的顺序：先有产品和用户，其他都往后排</h2>\n  <p>给在场已经在创业的学生，他给了一个创业清单。</p>\n  <p><strong>最开始，只有两件事：产品和用户。</strong>“你要能拉来用户，你要能给用户提供价值。这两个没有的话，你就不会有公司。”</p>\n  <p>作为一号位，之后才轮到组建团队、法务合规、市场营销。他特别做了区分：市场营销刚开始没那么重要；法务要看行业——技术创业早期法务风险很低，但金融业务不一样。</p>\n  <p>回头看币安，他给出了两条极其具体的“如果重来”：</p>\n  <p><strong>合规先做。</strong>现在各国基本都把交易所定义为金融公司，就得拿特定牌照，“回头看很简单”。</p>\n  <p><strong>美国用户先全部屏蔽。</strong></p>\n  <p>关于放权，他说没有“到某个阶段就能撒手”这回事：“你找到信任的人的时候，就可以放手给他做；找不到的时候，就还得自己做。”</p>\n  <p>但即使放了手，也必须定期“蹲下去”——去跟用户聊天，去看某个功能设计得好不好，去看系统性能。“没有任何时候说你只跟公司里10个高管说话就行。”</p>\n  <p>他还给了一个可执行的数字：<strong>保持深度联系的高质量反馈用户，3到5个就够了。</strong>“不用每个月聊几百个用户，每个月聊5个就可以了。”</p>\n  <h2>七、看人：他面试时会直接问“你的缺陷是什么”</h2>\n  <p>被问到那些年选错人、看错人的经历，他先给了一个很哲学的开场：</p>\n  <p><strong>“我觉得我们活在一个模拟世界里，这个游戏是不完美的。你看人也不会完美，没有人是完美的。”</strong></p>\n  <p>他把看错人分成两类：一类是纯粹判断错误；另一类更常见——<strong>“你看这个人的时候，他有些缺陷你不了解。”</strong></p>\n  <p>所以他面试会直接问：“你的缺陷是什么？”</p>\n  <p>“很多人不太喜欢这个问题。但多数人应该了解自己的缺陷，也要能够面对。就算你不问你的合伙人，你也需要非常了解他们的缺陷是什么。”</p>\n  <p>有缺陷不等于不能合作，关键看是哪种缺陷。这里他划了一条不容商量的线：“<strong>若是道德上的缺陷，就没法合作。任何能够破坏信任的，这种人越快踢掉越好。”</strong></p>\n  <p>他还顺带批评了一种很常见的社交算计：“很多人觉得，这个人有点道德缺陷，但可以接受，说不定哪天对我有用，就一直保持联系——这个没有意义。”</p>\n  <p><strong>“我的朋友其实很少。但是我的朋友都非常可靠。”</strong></p>\n  <p>至于自己踩过的那个“世界级大坑”，他的复盘冷静得近乎轻描淡写。他说据他所知，全世界没有第二个人因为单次违反美国银行保密法而坐牢——多数人连被告都不是，更别说罚款或软禁。</p>\n  <p>“我是唯一一个坐牢的。但总的来说，运气好的是只有4个月。当时觉得很长，回头来看，扛过去也就算了。”</p>\n  <p><strong>“人总是有踩坑的时候，踩完坑之后爬起来继续走嘛。”</strong></p>\n  <h2>八、币安招人只看一件事：主动性</h2>\n  <p>现场很多学生想进币安，主持人替他们问了选人逻辑。</p>\n  <p>他的答案只有三个字：<strong>要主动。</strong></p>\n  <p>“币安是远程工作，你可以偷懒，一天偷懒几个小时很容易。但如果你不够主动，两个月下来，你可能就没有结果。”</p>\n  <p>然后他讲了一个足以让同事背后一凉的工作方式：</p>\n  <blockquote>\n   <p>“我接触的东西很多，一会这个一会那个，有些事情我说过之后就忘了。我一般不会去跟踪他。如果这个人不主动来告诉我更新，我就会忘记。但我可能两个月之后想起来，再去问他，他说‘我们做了一个礼拜之后就没有进展了’——<strong>那我会把这人开掉。”</strong></p>\n  </blockquote>\n  <p><strong>“我从来不去follow up，我是需要他们push给我。”</strong></p>\n  <p>他把这条延伸成了对整个时代的判断：“你只要主动积极去做一件事情，你就会成功。你若等着老板过来查业绩时才做，你是不会成功的。”</p>\n  <p>（主持人当场“补刀”：今天在场的所有人，都是自己写email、不断push主办方、还提交了问题，才被选进来的。）</p>\n  <h2>九、关于第一份工作：他劝年轻人先去大厂待两到五年</h2>\n  <p>一位在腾讯实习的大三学生问：什么能力该在成熟组织里学，什么只能创业才学得到？</p>\n  <p>他的建议出乎不少人意料——<strong>先去大厂，至少两年，建议两到四五年。</strong></p>\n  <p>“在大公司里面，你会学到别人整套管理体系。”他说自己在彭博工作的四年，是职业生涯里除创业外待过的最大的公司，“还是学到很多东西”。</p>\n  <p>大公司的坏处他也说得很清楚：“你是个螺丝钉，只看到自己那一小部分。做技术就只做技术，做市场就只做市场。大公司的市场做起来很容易，它有成型的体系，你不需要那么创意。”</p>\n  <p>而创业公司是在泥里打滚——什么都要做，什么都要创意，没有一个模型让你按部就班。</p>\n  <p>“很多人很急，看到别人大学创业成功，我就要创业。那没必要。创业是一个很长的过程，很多人一创业就是十年或者更久，所以不用那么急。”</p>\n  <p>他还半开玩笑地对那位学生说：你可以在腾讯工作一段时间之后再来币安。</p>\n  <h2>十、一技之长，要卷到全球前1%</h2>\n  <p>给年轻人的通用建议，他给了一个很残酷但很清醒的模型。</p>\n  <p>“这个世界是全球竞争的世界。你在强项一定要比别人强很多——但说实话，你可能没法比别人强特别多。”</p>\n  <p>以编程为例：全世界成百上千万程序员，你不可能比所有人好两倍，“你最多就比另外一个人稍微好那么一点点”。</p>\n  <p><strong>但如果这一点点让你进了全球前1%、甚至0.1%，回报可能是别人的几倍、几十倍、几百倍。</strong></p>\n  <p>“差距可能非常小，但是第一名跟第二名的待遇会非常不一样。”</p>\n  <p>有了一技之长之后，如果想创业，再去补人脉、补表达、补那些你不熟的技能。</p>\n  <p>关于怎么招到比自己厉害的合伙人，他也没有装：<strong>“刚开始可能需要画点饼，这个大概避免不了。”</strong>但画饼之外必须有个人魅力，“别人要相信，为了这个愿景，我愿意放弃其他机会跟你一起合作”。</p>\n  <p>他还提醒了一个年轻人最容易忽略的结构问题：<strong>股权别平分。</strong></p>\n  <p>“当时的币安，我年纪最大，所以找了一帮比我年轻的。但我股份稍微多一点，话语权稍微重一点，这样就有一个leader的角色。很多年轻人会选择三个人平分、四个人平分，这个时候公司里很多决策会卡住。”</p>\n  <p>不一定是坏事，但进步会慢，“这里面会有些取舍”。</p>\n  <h2>十一、关于红杉那段“恩怨”：再来一次，还是会去聊</h2>\n  <p>有学生直接问了2017年底与红杉那段公开纠纷：如果回到当时，会不会一开始就绕开红杉？</p>\n  <p>“应该不会。我现在跟沈南鹏的关系也挺好的。不打不相识。”</p>\n  <p>他的理由不是情面，而是纯粹的价值计算：</p>\n  <blockquote>\n   <p>“任何这个知名级别的投资人愿意跟你聊，都应该去聊。投不投你是一回事，光是沟通这个阶段，你也会学到很多——一个顶级的投资基金，他们在乎什么？他们怎么判断你的公司？”</p>\n  </blockquote>\n  <p>而且人脉是复利的。“他有可能不投，但过两天你想发展印度市场或者其他市场，他会有认识的人帮你介绍。”</p>\n  <p>他坦承自己“一般不太会维护人脉”，但补了一句：<strong>“这种顶级的人，如果是十年前的我，能让我接触的话，这是我的荣幸。”</strong></p>\n  <h2>十二、行业判断：RWA、稳定币，和“下一个热点我们可能还不知道”</h2>\n  <p>聊到行业，他给出了几个信息量很大的判断。</p>\n  <p><strong>关于RWA（真实世界资产上链），他承认自己看漏了。</strong></p>\n  <p>“证券上链这个事情，发展得比我预期的快很多。后来想了一下也合理。”</p>\n  <p>他的推演很直接：很多人想买美股、A股，但在另一个国家开券商账户“非常非常非常难”；就算开了，美股交易时段对亚洲用户是“晚上8点到凌晨4点”，周末还不开。上链之后，“ease of access 就会高了很多”。</p>\n  <p>反过来站在发行方角度：“你发行了一个股票，为什么只想让你国家的人买？全世界80亿人去买，跟你一个国家几亿人买，那肯定是80亿更好呀。”</p>\n  <p>他举了一个极具冲击力的数字：<strong>整个菲律宾证券交易所一天的交易量大约是5000万美元——“大概纽约的一个交易员每天就这个交易量。”</strong>这类市场的公司，本来就在寻找去哪里二次上市，而tokenize意味着可以直接面向全球交易。</p>\n  <p><strong>关于稳定币，他的框架是“稳定币也是一种RWA”</strong>——只是把货币上链。“现在多数的稳定币都是美元，大概有两三千亿美元。哪个国家不想让自己的货币在全球流通更广？”</p>\n  <p><strong>关于什么难上链：地产。</strong>“地产的价格波动不像传统金融资产那种波动模式，没有波动的话，流动性可能没有那么强。”相比之下，IP、社交媒体虚拟资产这类可能更容易，但“这些市场目前来说还是比较小”。</p>\n  <p><strong>关于DEX与监管，他说门正在打开。</strong>据他了解，目前美国那边的压力小了很多，国际化平台与服务美国用户的平台分开之后，国际平台在某些结构下可以不做KYC。他特意加了一句带着个人况味的对比：</p>\n  <blockquote>\n   <p>“之前发生在我身上的经历，就是因为他们说币安的KYC做得不够好——我们还是全部都有KYC的。现在是一个DEX可以不用KYC。”</p>\n  </blockquote>\n  <p>“如果能做到这样子，这个行业就会发展得更快。”</p>\n  <p><strong>关于周期，他认为四年周期至今依然很准，而原因是心理学。</strong></p>\n  <p>“人的心理学里面，痛苦记忆大概两年。两年之后痛就忘记了。”</p>\n  <p>他给了一个相对乐观的判断：过去一两周行业已经有比较正面的转变，现在还在这个行业创业的人，“应该是刚刚好熬过这寒冬最冷的时候”。</p>\n  <p>但他没有把话说满：<strong>“下一个热点我觉得都不一定是RWA。有可能我们都还不知道。”</strong></p>\n  <h2>十三、关于AI：不要把AI写的代码直接推上生产</h2>\n  <p>现场一位已经拿到融资的大学生说，自己公司80%的人力已经用AI代劳了。这个问题被他放到了最后的总结里回答，而他的态度相当严肃：</p>\n  <p>“AI是帮助我们把效率变高，但不代表你自己就不做事情了。”</p>\n  <p><strong>“现在AI写的代码，如果直接上生产，特别在我们这个行业，是非常非常非常危险的。”</strong></p>\n  <p>理由很具体：代码没有经过审计，“出现一个bug就是几百万、几千万资金没了。对很多创业公司来说，基本上就致命。成熟一点的平台可能还扛得住一点。”</p>\n  <p>结论是一句大白话：<strong>“AI是个工具，我们应该去用它。”</strong>AI创业有机会，web3创业也有机会。</p>\n  <h2>十四、关于香港：Web3有强优势，AI优势不明显</h2>\n  <p>作为一年来香港五六次的人，他对香港的判断相当具体，也没有一味恭维。</p>\n  <p><strong>优势明确的是Web3：</strong>香港是金融中心，金融技术发达，人才储备强，从内地过来也方便（港澳通行证、工作签证）。“在整个亚洲，香港是有非常强的优势。”</p>\n  <p><strong>优势不明显的是AI：</strong>“香港的电费、机房等等，这块优势不明显。”</p>\n  <p>他也劝了一句现在一窝蜂涌向AI的年轻人：任何行业刚开始都会很热，AI会持续发展，这没关系——但选择的标准应该是<strong>自己有兴趣、自己有能力、并且有价值，三者结合。</strong></p>\n  <p>被追问“除香港外，全球最适合Web3发展的城市”，他给了两个答案：<strong>阿联酋（迪拜、阿布扎比），以及现在的美国。</strong></p>\n  <h2>十五、最后，他主动泼了一盆冷水</h2>\n  <p>活动尾声有一个环节：主办方想请他给大学生写一句寄语。</p>\n  <p>他推掉了。理由不是谦虚，而是防人：<strong>“我怕别人拿去发币。”</strong></p>\n  <p>他随后专门用了一整段话做澄清，语气比全场任何时候都认真：英文版是他自己在亚马逊上出的，没有出版社；书友会是出版方的安排，他很感激，但不是他自己策划的。而且——</p>\n  <blockquote>\n   <p>“我知道这个活动有很多项目方想付钱进来宣传他们的项目，我说不行。所以任何项目、任何币的宣传，跟我都没有关系。分享书、分享内容、社区讨论，这些我非常支持。但是如果有任何项目、发币等等，大家要自己判断。”</p>\n  </blockquote>\n  <p>一个把签名都当成风险敞口来管理的人，大概比任何一段成功学都更能说明“信任”两个字值多少钱。</p>\n  <h2>尾声：他给创业者的两个词</h2>\n  <p>最后的总结，他站着说完，只给了两个词。</p>\n  <p><strong>第一个是学习。</strong>“世界的变化特别快，技术不断地进化。”</p>\n  <p><strong>第二个是韧性。</strong>而他对韧性的定义，可能是全场最反鸡汤的一句话：</p>\n  <blockquote>\n   <p><strong>“在任何领域创业，你越成功，问题就越多；平台越大，压力也就越大。所以这件事你一定要很喜欢，你一定要能够坚持得住。如果你自己都坚持不住，就不用创业了。”</strong></p>\n  </blockquote>\n  <p>从彭博的高薪工程师，到卖房买BTC，到39岁创办币安，到四个月的联邦监禁，再到今天坐在香港的会场里被一群大学生追问——赵长鹏给自己的定义始终没变过：</p>\n  <p><strong>“我还是一个很平凡的人，只是运气比较好，经历的事情比较多。”</strong></p>", "category": "tech", "published_at": "2026-08-28T04:07:21+00:00", "fetched_at": "2026-08-28T08:44:49.161676+00:00", "fingerprint": "365b856dde46cdef"}, {"source": "36氪 - 最新文章", "title": "寻找空天经济产业化先行者｜WISE2026「空天产业创新企业」征集中", "url": "https://36kr.com/p/3958836066532742?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_339398a3021d4c5fbb1b6c07e0496860@6413691_oswg217225oswg3008oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>过去一年，空天赛道用一连串里程碑式的突破，把曾经遥远的规划加速变成现实。</p>\n  <p>长征十号乙完成一子级海上网系回收，实现我国运载火箭回收“零的突破”；低轨星座累计发射超400颗，卫星互联网进入批量组网阶段；eVTOL在有人驾驶飞行、转换飞行等关键节点密集突破；工业无人机在物流、应急、农业等场景常态化运营......</p>\n  <p>一系列信号已经足够清晰——中国空天产业正从“技术验证”加速驶入“规模商用”的拐点。</p>\n  <p>政策端，“十五五”规划将空天产业纳入战略性新兴产业发展重点，2026年政府工作报告将低空经济与航空航天并列为“新兴支柱产业”，空域管理改革试点也在稳步推进。市场端，产业热度正在转化为实在的规模，A股空天赛道相关上市公司已达160余家，产业链体系初步成型。</p>\n  <p>但越是这样的时刻，越需要追问一个问题——当行业从能不能“造出来”进入能不能“卖出去、用起来、铺开来”的阶段，什么样的企业才能持续走在前面？</p>\n  <p>答案或许是：那些不止于单点技术突破，而是深度掌控产业链关键节点，有能力将技术快速转化为可落地的场景，带动上下游协同发展的市场主体。</p>\n  <p>我们希望总结它们的共性方法论，同时也期待在非共识的案例中发现新的路径。</p>\n  <p>为此，36氪发起<strong>「WISE2026商业之王 年度空天产业创新企业」</strong>评选。</p>\n  <p>不只关注宏大叙事，更希望以产业观察的视角，从技术、商业与生态的交叉地带，发掘出能代表中国空天经济当下与未来的价值样本。</p>\n  <p>评选维度、提名通道与时间节点见长图，欢迎企业自荐与机构推荐。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_3bc4e252913548898d64a256e892b823@6413691_oswg23875970oswg4500oswg33822_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-08-28T06:59:57+00:00", "fetched_at": "2026-08-28T08:44:49.161661+00:00", "fingerprint": "29b3e34755453c59"}, {"source": "少数派", "title": "新玩意 250｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/113905", "summary": "关于栏目很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑 %", "url": "https://www.frankfurter.app/2026-08-27?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-08-27</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.8319 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0033 (+0.07%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-08-28T08:44:46.277609+00:00", "fingerprint": "5c49b5458ef82fca"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
