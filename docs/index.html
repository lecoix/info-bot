R following the company pissing off [&#8230;]", "category": "tech", "published_at": "2026-08-02T19:36:08+00:00", "fetched_at": "2026-08-03T02:24:24.334721+00:00", "fingerprint": "93247f3782b40ca5"}, {"source": "The Verge", "title": "Rachika Nayar’s Heaven Come Crashing is an instrumental epic of desperate longing", "url": "https://www.theverge.com/entertainment/974271/rachika-nayars-heaven-come-crashing-music-review", "summary": "Two minutes and thirty seconds into the title track of Rachika Nayar's Heaven Come Crashing, an absolutely massive drum and bass beat drops. As a fan of Nayar's debut record Our Hands Against The Dusk, it caught me off guard. That album has no percussion on it at all. Heaven Comes Crashing is almost entirely [&#8230;]", "category": "tech", "published_at": "2026-08-02T21:53:15+00:00", "fetched_at": "2026-08-03T02:24:24.334711+00:00", "fingerprint": "31e3a531e176a019"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨蔡崇信宣布离婚，不涉及出售阿里股份；瑞幸回应员工对嘴喷奶油；IF椰子水市值从126亿暴跌到16亿", "url": "https://36kr.com/p/3923043072634498?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>马斯克关注了DeepSeek的X账号</p>\n  <p>祥鹏航空回应航班误发过期方便面</p>\n  <p>OpenAI或将IPO推迟到明年</p>\n  <p>SpaceX首份财报即将发布</p>\n  <p>小米多款手机正式涨价</p>\n  <p>每月10万美元，特朗普“真实社交”售卖“优先访问权”</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>蔡崇信宣布离婚，不涉及出售阿里股份</strong></p>\n  <p>8月1日，阿里巴巴集团董事会主席、美国职业篮球队布鲁克林篮网主要所有者蔡崇信与妻子吴明华决定结束持续近30年的婚姻。声明称，这一决定由双方共同作出，彼此仍保持尊重，离婚过程将以友好方式进行。声明表示，蔡崇信与吴明华近年来的关系逐渐转变为共同经营事业、共同抚养子女的合作伙伴关系。虽然双方在个人生活上逐渐疏远，但商业合作关系仍将保持牢固和专业。</p>\n  <p>此外，声明明确表示，蔡崇信目前没有出售任何阿里巴巴股票的计划，其担任阿里巴巴集团董事会主席的职务也不会因离婚受到影响。此次离婚也不会改变双方在布鲁克林体育娱乐公司、布鲁克林篮网队和纽约自由人队中的现有管理职务。（观察者网）</p>\n  <p><strong>瑞幸回应员工对嘴喷奶油：涉及物料已废弃</strong></p>\n  <p>8月1日晚，山东济南瑞幸店员用奶油发泡器给同事喂食嬉戏的视频引发热议，2日清晨，该视频发布账号就已注销。8月2日，瑞幸就此向界面新闻回应称，“公司对此事高度重视并第一时间进行内部调查。经核查，视频中两位伙伴使用当日门店打烊后废弃的奶油物料进行拍摄。该行为严重违反相关管理规范，公司将严肃处理。拍摄中涉及的奶油物料和奶油枪已废弃。”瑞幸表��，瑞幸咖啡始终将食品安全及用户体验放在首位，也将持续在全国门店加强人员培训，为消费者提供更安心、更高品质的产品。（界面新闻）</p>\n  <p><strong>IF椰子水市值从126亿暴跌到16亿</strong></p>\n  <p>7月31日晚，“椰子水第一股”IFBH（06603.HK）发布最新盈利警告：预计2026年上半年，净利润同比暴跌65%至75%，收入同比下滑40%至50%。值得注意的是，这家公司才上市一年出头。2025年6月30日，IFBH顶着“椰子水第一股”的称号登陆港交所，发行价27.8港元，开盘即高开57.9%，市值一度冲到126.8亿港元。它当时最出圈的标签不是产品本身，而是“46个人撑起百亿市值”，轻资产模式被讲成了一个近乎完美的资本故事。（红星资本局）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>每月10万美元，特朗普“真实社交”售卖“优先访问权”</strong></p>\n  <p>当地时间8月1日，美国总统特朗普旗下社交平台Truth Social宣布推出“Truth API”服务，向华尔街交易机构收费提供特朗普帖文的高速访问渠道，引发有关内幕交易、利益冲突及利用公职谋利的质疑。该服务收费最高达每月10万美元，主要面向高频交易公司。由于特朗普经常通过Truth Social发布涉及关税、战争、央行等重大政策的信息，相关内容往往会引发市场波动。批评人士认为，付费用户虽然不是提前获知信息，但凭借更快的数据接口和自动交易系统，可能比普通投资者更早做出反应。此外，特朗普近期频繁在社交媒体上提及上市公司，相关言论也曾推动Palantir、英特尔等公司股价上涨。（央视财经）</p>\n  <p><strong>DeepSeek-V4-Flash正式版API上线公测后，马斯克关注DeepSeek官方账号</strong></p>\n  <p>7月31日，DeepSeek通过API文档发布日志，宣布DeepSeek-V4-Flash正式版API上线公测，凭借超高性价比再次引爆AI圈。8月1日，关注科技公司CEO和高管动态的账号BigTechAlert发布提醒消息，埃隆·马斯克关注了DeepSeek的X账号。值得一提的是，马斯克当地时间7月23日在接受英国《经济学人》专访时表示，中国在机器人和AI领域实力雄厚，未来“很有可能在某个时候成为领导者”。（IT之家）</p>\n  <p><strong>谷歌地球紧急叫停AI生图：虚构场景可叠加卫星图散播假信息</strong></p>\n  <p>谷歌推出谷歌地球（Google Earth）人工智能（AI）图像生成功能不到48小时后，宣布暂停服务，以加强安全防护。专家此前警告，这项工具可把虚构场景叠加在真实卫星图像上，容易被用于散播假信息。 (澎湃新闻)</p>\n  <p><strong>OpenAI或将IPO推迟到明年</strong></p>\n  <p>由于面临投资者担忧与竞争压力，OpenAI可能会将其IPO推迟到明年。参与相关讨论的人士透露，近几个月来，OpenAI的一些大投资者已私下对这家初创公司相对于其增长的现金消耗速度过快表示担忧，而其他投资者则通过向Anthropic投入资金来对冲他们对OpenAI的押注。与此同时，Anthropic的营收增长近期已超过OpenAI，其估值也是如此。据知情人士透露，Anthropic正在加速秋季IPO的计划，并已开始与潜在投资者会面，强调其相对于ChatGPT制造商所保持的领先优势。而最初希望抢在Anthropic之前上市，OpenAI现在可能会等到明年再IPO。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>SpaceX首份财报即将发布</strong></p>\n  <p>SpaceX将近日发布季报，这是该公司上市后的首份财报，同时8月6日还有最多9.115亿股解禁，比当前的流通股还要多。据财联社，S3 Partners的数据显示，截至7月29日，SpaceX空头持仓量已达到2.193亿股，约占该公司可供公众交易股票总量的34%。这显示出空头正在押注SpaceX财报给不出能抵消股票解禁压力的利好。自6月12日以135美元的IPO定价上市以来，SpaceX最高曾冲到过200美元上方，但本周五收盘时已经跌破110美元。</p>\n  <p>值得注意的是，SpaceX上市后首次财报电话会议前夕，散户投资者最关心的问题并非利润，而是星舰着陆系统画面、吉祥物Asteroid、甚至能不能把火箭涂成粉色。相比之下，AI 盈利等核心问题关注度极低。（中新经纬、IT之家）</p>\n  <p><strong>小米多款手机正式涨价</strong></p>\n  <p>8月1日晚间，有消息称小米部分型号手机或将迎来集体调价。8月2日上午，小米商城价格显示，小米多款手机正式涨价。记者就此询问小米方面，截至发稿未获有效回应。根据小米官方商城，小米17系列价格已经上调了300元/台到500元/台；REDMI K90、Turbo 5系列上调300元/台。（界面新闻）</p>\n  <p><strong>2026年度电影总票房超231亿元，市场热度持续走高</strong></p>\n  <p>截至8月2日22时，2026年度电影总票房已超231亿元，其中，暑期档已连续23天单日票房破亿，市场热度正持续走高。（央视新闻）</p>\n  <p><strong>欧足联或将投票罢免因凡蒂诺</strong></p>\n  <p>据英国方面当地时间8月1日消息，欧足联已要求国际足联主席因凡蒂诺辞职。若因凡蒂诺拒绝，欧足联准备对他发起不信任投票。据了解，国际足联211个成员协会中有43家协会投票支持该不信任投票即可启动罢免程序，欧足联拥有55个成员协会。</p>\n  <p>欧足联的这一举动，是由于因凡蒂诺提出希望成立一家价值200亿美元（约合150亿英镑）的子公司，并通过融资42亿美元（约合31.6亿英镑），出售新成立的“国际足联前进计划（FFE）”超过20%的股份。（央视新闻）</p>\n  <p><strong>显卡价格跳涨，热门产品“一日一价”</strong></p>\n  <p>继内存、硬盘价格上涨后，电脑硬件市场又迎来新一轮价格波动。8月1日，记者走访深圳华强北市场发现，7月底以来，消费级显卡价格快速上涨，部分热门型号数日内上涨数百元，高端型号涨幅甚至达到千元级别。以热门型号RTX 5060为例，目前市场报价已升至2700元至3100元，而本轮涨价前报价约为2300元至2500元。短短4天，5060价格最高上涨约800元，涨幅超过三成。高端型号涨幅更加明显，RTX 5080市场报价已超过1.1万元，较7月初上涨约1700元。“早两天买还能省1000元左右。”一名华强北电脑装机商户告诉记者，近期显卡“一日一价”，不少消费者此前咨询配置时还在观望，但等到决定购买时，价格已经出现变化。（财联社）</p>\n  <p><strong>东方甄选前CEO孙东旭新号首播，热度超过与辉同行</strong></p>\n  <p>8月2日早8点，由前东方甄选CEO孙东旭与前主播石明（网名明明）、郭天权（网名天权）联合打造的直播带货账号 “美丽明天” 正式开启首场直播。</p>\n  <p>开播后直播间热度快速攀升，在线人数半小时内突破10万，截至发稿已攀升至抖音带货总榜首位，热度大幅领先同期开播的同业账号。榜单实时数据显示，“与辉同行”位列第6位，东方甄选相关账号排名第22位。蓝鲸记者查询考古加数据，截至发稿，本场直播累计观看人次达689万，预估销售额约500万至1000万元区间。（蓝鲸新闻）</p>\n  <p><strong>航班延误4小时，发给旅客过期泡面，祥鹏航空回应</strong></p>\n  <p>8月1日，有乘客发视频说祥鹏航空一航班延误近4小时地勤发过期方便面。该航班原计划1日20时45分从乌鲁木齐天山机场飞往成都天府机场，航班延误后地勤人员向乘客发的方便面包装显示需在7月5日前食用。记者从祥鹏航空客服人员处获悉，该航班延误系天气原因，航班延误3小时55分落地成都，乌鲁木齐地面代理公司提供的餐食不符合标准，工作人员对所有餐食进行了回收，过期的餐食没有旅客食用。 目前，祥鹏航空回应表示：对该航班乘客所发所有餐食进行回收，会补偿200元并致歉。（新京报）</p>\n  <p><strong>张继科参赛HYROX遭解说员“嘲讽”，官方致歉</strong></p>\n  <p>8月1日，HYROX全球健身跑系列赛事成都站开赛。赛事直播过程中，两名解说员调侃张继科“上综艺不用出这么多汗” “不如回家上综艺”，评论其表情“痛苦面具来了，大家可以截图，回家做表情包”等言论引发热议。</p>\n  <p>8月2日，HYROX健身跑发布致歉声明，声明中，HYROX健身跑向张继科和广大网友表示诚挚的歉意，并进行了深刻地反思。并表示对两位当事的解说嘉宾，组委会已于8月1日解除了合作关系。（新京报）</p>\n  <p><strong>长鑫存储LPDDR6已接近研发验证尾声</strong></p>\n  <p>8月1日消息，行业人士透露，长鑫存储LPDDR6已接近研发验证尾声，距离小批量导入及正式量产更进一步。此前消息称，其LPDDR6已向核心客户送样，有望于2026年下半年发布并导入量产。据悉，长鑫首款LPDDR6设计速率为12800Mbps，颗粒容量16GB，在低功耗及可靠性等方面较LPDDR5X有明显提升。LPDDR主要应用于手机、平板电脑等移动设备，研发验证需要完成兼容性、稳定性、性能功耗及可靠性等测试。</p>\n  <p>目前三星、美光、SK海力士等厂商均在推进LPDDR6，其中SK海力士已完成产品开发验证并计划下半年供货。若长鑫顺利推进量产，有望成为全球较早量产LPDDR6的存储厂商之一。（第一财经）</p>\n  <p><strong>福特CEO：正为中国汽车进入美国市场做准备</strong></p>\n  <p>三位知情人士向路透社透露，福特CEO吉姆·法利7月30日在内部员工大会上表示，尽管美国设置了诸多贸易壁垒，但福特正在为未来5到10年内中国车企可能进入美国市场做准备。（界面新闻）</p>\n  <p><strong>充电桩CCC认证自8月1日起开始强制实施</strong></p>\n  <p>8月1日起，市场监管总局（国家认监委）对电动汽车供电设备强制性产品认证（CCC认证）管理开始强制实施，通过开展防触电、短路保护、耐火耐燃等关键安全指标测试和企业现场质量保证能力、产品一致性检查，切实筑牢产品质量安全底线。随着我国新能源汽车的不断普及和发展，电动汽车供电设备（俗称充电桩）已经成为服务百姓出行需求的重要基础设施。8月1日起，未获得CCC认证的电动汽车供电设备，不得出厂、销售、进口或者在其他经营活动中使用。对于8月1日前已经投入运营的设备，经营者应当严格遵守《中华人民共和国产品质量法》《中华人民共和国消费者权益保护法》有关规定，保证其提供的商品或者服务符合保障人身、财产安全的要求。（新华网）</p>\n  <p><strong>近120万辆特斯拉汽车遭调查</strong></p>\n  <p>近日，美国国家公路交通安全管理局已宣布，在收到多起悬架故障投诉后，正式对近120万辆特斯拉汽车展开初步调查。美国国家公路交通安全管理局表示，该机构累计已收到156起特斯拉悬架故障相关投诉，主要涉及2018至2020款Model 3和2021至2023款Model Y车型。故障表现为车辆前下横向连杆脱落，极端情况下可能造成车辆失控，截至目前尚未收到因这一故障引发人员伤亡的报告。 （央视财经）</p>\n  <p><strong>住房公积金缴存覆盖面扩大，灵活就业人员可自愿缴纳</strong></p>\n  <p>为了深化住房公积金制度改革，更好满足缴存人多元化住房需求，住房城乡建设部前不久启动了《住房公积金管理条例》修订工作，并就《住房公积金管理条例（修订征求意见稿）》向社会公开征求意见。记者梳理发现，征求意见稿主要体现出三大亮点。首先，缴存覆盖面扩大了，明确个体工商户、非全日制从业人员以及其他灵活就业人员，可自愿参加住房公积金制度，也就是说包括外卖员、快递员、网约车司机等，以后也能缴纳了。其次，拓宽了使用范围，明确将自住住房装修、支付物业费纳入可提取住房公积金的情形。也就是说，从“购房”“租房”拓展到“修房”“养房”，让资金用途更丰富。此外，明确要强化公积金数字化能力建设，强化跨地区、跨部门、跨层级的业务协同，推动住房公积金互认互贷。 (央视新闻)</p>\n  <p><strong>深圳宝安将电动自行车违法纳入征信</strong></p>\n  <p>深圳宝安区已将电动自行车交通违法行为纳入个人征信系统。依据《深圳经济特区道路交通安全违法行为处罚条例》，非机动车驾驶人一年内被罚款五次以上，或一年内三次以上交通违法未处理，违法信息将被推送至征信机构。目前宝安区已依法将50名骑行市民的违法信息录入信用信息系统。宝安区相关部门负责人表示，交通违法联动信用约束是深圳特区法定治理手段，通过信用约束引导市民守法出行，提醒辖区群众及时处理车辆违法记录，自觉遵守道路交通安全法律法规，守护信用记录。（IT之家）</p>\n  <p><strong>上半年全国二手房交易占比超新房</strong></p>\n  <p>今年上半年，全国二手房交易占比超过新房，达到50.4%，传统以新房销售为主的增量交易格局正加快向新房和二手房并举转变，房地产市场进入存量时代。在中央经济工作会议“控增量、去库存、优供给”的要求下，多个城市也在通过多种方式盘活存量房源，推动既有住房资源的优化配置，激活存量住房价值。（央视财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>微信地震预警功能上新，支持“震感汇聚”与“位置更新”</strong></p>\n  <p>8月2日消息，中国地震台网近日宣布，微信地震预警上线新功能：“震感汇聚”与“位置更新”。据介绍，新上线的“震感汇聚”功能可用于地震发生后的公众震感信息快速收集与综合展示。在收到预警快速避险后，用户可通过微信地震预警小程序的预警详情页便捷反馈所在地震感情况，地图精准定位、快捷选择对应震感，相关信息经专业算法规则处理后形成震感分布地图，为公众快速了解不同地区的实际震感提供参考。而“位置更新”功能则进一步提升了地震预警服务与用户实际所在地的即时匹配能力。用户可根据自身出行和位置变化收到提示，及时更新小程序预警订阅位置，使地震预警信息推送匹配当前活动区域，进一步增强预警服务的针对性和实用性。（IT之家）</p>\n  <p><strong>整理</strong>｜昌怡&nbsp;</p>", "category": "tech", "published_at": "2026-08-03T00:07:39+00:00", "fetched_at": "2026-08-03T02:24:24.154470+00:00", "fingerprint": "6d81e08abb349d11"}, {"source": "36氪 - 最新文章", "title": "让Agent在协作中自进化，清华00后博士获千万元融资 | 36氪首发", "url": "https://36kr.com/p/3919025939246727?f=rss", "summary": "<p>文 | 赵京娜</p>\n  <p>访谈 编辑 | 海若镜</p>\n  <p>36氪获悉，近日奇点逃逸完成千万级种子轮融资，由星连资本与水木创投联合领投，奇绩创坛跟投。其正在研发AI原生团队协作操作系统Nexus，让人、Agent、任务、知识和工具基于同一份组织状态持续协作，并让系统从每一次协作中有证据地变强。</p>\n  <p>奇点逃逸创始人兼CEO薛传奕，本科、博士阶段均在清华大学就读，研究方向覆盖强化学习与多智能体，曾以第一作者身份在NeurIPS、CJA等学术会议和期刊发表论文；在商汤、鉴智机器人实习期间，参与自动驾驶算法研发与实车部署。</p>\n  <p>“<strong>今天，Agent已经像能力出众的个体，但它们还没有真正进入组织</strong>，”薛传奕介绍道。</p>\n  <p>一个越来越常见的工作日可能是这样开始的：产品经理把需求交给一个Agent梳理，研发同时让另一个Agent修改代码，运营则在第三个对话窗口里研究发布方案。几个小时后，每个Agent都完成了自己的部分，也各自拥有一段完整的上下文。但当三项工作需要合并时，团队才发现，没人清楚另一个Agent做过什么、为什么这样做，哪些结论已经被确认，哪些变化又会影响后续任务。</p>\n  <p>于是，人重新回到信息中转站的位置：复制对话、补充背景、核对版本、拼接结果，再把同一件事向不同Agent解释一遍。</p>\n  <p>这是Agent能力快速提升之后，一种颇具反差的场景。当Agent开始写代码、处理文档、调用工具，甚至连续执行长程任务，新的瓶颈也随之出现：一个能力很强的Agent，仍然只是一个能力很强的单人助手。它掌握的上下文属于某个用户和某次会话，执行过程分散在不同工具里，任务结束后，经验也很难自然成为团队下一次工作的起点。</p>\n  <p>那么，当越来越多智能进入生产环境，它们如何理解彼此的角色和关系？组织怎样保留Agent的工作过程？一次任务中的反馈，又如何转化为下一次协作可以复用的能力？<strong>这些问题最终汇聚为奇点逃逸的两条主线：协作与自进化</strong>。</p>\n  <h2><strong>若Agent成为组织成员</strong></h2>\n  <p>在传统团队里，一个新成员加入项目，需要理解目标、分工、历史决策和协作规则。Agent同样如此。它不仅要知道做什么，还要知道任务从哪里来、与谁有关、依赖哪些信息、什么结果才算完成。</p>\n  <p>现有AI产品大多围绕会话组织信息，一段对话结束，Agent对任务的理解、执行依据和失败经验往往也停留在那段会话中。当任务跨越不同模型、不同成员和不同时间周期，团队不得不反复重建上下文。</p>\n  <p>薛传奕<strong>将其称为AI的“协作断层”</strong>。他认为，解决这个问题的关键不是让所有Agent同时开始工作，而是先让它们面对同一份事实。</p>\n  <p>协作首先是对事实的协作。如果每个Agent理解的目标、任务状态和验收标准都不一样，能力越强，可能只是更快地朝不同方向执行。</p>\n  <p>因此，Nexus从组织状态而非单次对话出发。人、Agent、任务、知识和工具被表示为相互关联的对象；一项工作不再只是一段自然语言指令，还包含目标、负责人、依赖关系、权限、当前状态、执行证据和验收结果。</p>\n  <p>在这样的系统中，产品、研发和运营不是分别与三个互不相识的Agent对话，而是围绕同一项工作持续推进。新加入的Agent可以理解前序任务发生了什么，找到相关决策和上下游依赖；新的过程和结果，也会重新成为组织状态的一部分。</p>\n  <p><strong>Agent由此从个人拥有的工具，变成组织可以分工、授权、审阅和接续的协作对象</strong>。</p>\n  <p>这也是薛传奕所理解的“AI进入组织”：不是企业采购了多少AI账号，也不是员工调用了多少次模型，而是AI的工作能否进入组织的任务、知识和责任体系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260802/v2_5d08f250865b441eb8ff5e0bf529bcf7@5452796_oswg3981725oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：薛传奕</p>\n  <h2><strong>静态Agent遇上动态世界</strong></h2>\n  <p>协作与自进化其实是同一个问题的两面。多个主体要在组织中持续协作，Agent就必须能够适应不断变化的目标、成员、工具和约束；Agent要持续积累智能，又必须进入真实生产环境，在具体任务中获得反馈、接受检验。</p>\n  <p>今天的大模型，通常通过大规模预训练和后训练获得能力。部署之后，再通过提示词、工作流、工具和记忆系统进入具体应用。这个过程的核心逻辑仍然是：人预先设计系统，Agent在给定边界内执行。</p>\n  <p>它在稳定任务中有效，却很难覆盖真实组织的全部变化。一个项目的目标可能被修改，工具会更新，成员会变化，新的约束随时出现。昨天有效的任务拆解方式，今天未必仍是最优选择；一个Agent在某次任务中犯过的错误，也可能在另一段会话里再次发生。</p>\n  <p>当系统无法消化这些反馈，“长期运行”就只是不断累积规则。Prompt越来越长，Workflow越来越复杂，人工维护成本随之上升。Agent做了很多工作，却没有真正从工作中学会什么。</p>\n  <p>奇点逃逸认为，真实协作提供了自进化所需的高质量反馈，而自进化又让Agent能够适应组织持续变化的环境。</p>\n  <p>与静态数据不同，组织任务中天然存在目标、约束和结果。人的修正说明哪里出现了偏差，验收判断给出结果是否可用，失败记录揭示任务拆解、上下文或工具调用中存在的问题。这些信号不是抽象的偏好，而是与具体工作过程绑定的因果证据。</p>\n  <p>“脱离真实任务，自进化缺少高质量反馈；没有持续改进，协作系统也只会变成静态流程工具，”薛传奕认为。</p>\n  <p>在Nexus的设计中，协作与自进化的循环可以拆解为：<strong>组织协作产生真实任务与反馈，&nbsp;独立评测筛选有效改进 ，经过验证的能力进入下一轮协作，&nbsp;更强的Agent扩大组织的协作边界。</strong></p>\n  <p>系统可以根据反馈提出候选改进，例如调整上下文组织方式、模型路由、任务拆解或工作流配置。但这些变化不会直接进入真实生产环境，而要先通过独立评测，比较效果、稳定性、成本和风险，再由治理机制决定采用、限制、拒绝或回滚。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260802/v2_ba324ccc5ea840a283f69fed32cb0461@5452796_oswg461405oswg2216oswg1122_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：奇点逃逸</p>\n  <p>这与系统自由改写自己有本质区别。在薛传奕看来，<strong>自进化的前提不是赋予Agent无限自主权，恰恰是建立更严格的证据和治理边界。系统必须能够回答：为什么要改、改了什么、是否真的更好、有没有损害原有能力，以及出现问题时能否撤回</strong>。</p>\n  <p>因此，奇点逃逸所说的自进化，可以被概括为三个环节：真实反馈驱动、独立评测、治理采用。</p>\n  <h2><strong>协作，是自进化发生的环境</strong></h2>\n  <p>在AI行业，协作和学习长期属于两套不同的语言。</p>\n  <p>协作软件谈任务、权限、流程和知识管理；机器学习研究则谈数据、训练、评测和泛化。一边负责组织如何运转，另一边负责模型如何变强。两者很少在同一套产品架构里相遇。</p>\n  <p>Agent改变了这条边界。当AI只能生成一段文字，它与组织的关系更接近工具；当它开始拆解目标、调用资源、执行任务并与其他主体接续时，它的每一次行动都会进入组织流程。执行结果不仅是业务产出，也成为判断Agent能力的反馈。</p>\n  <p>这意味着，未来的协作系统不只是承载工作，也可能成为智能持续学习的环境。</p>\n  <p>一个能够从反馈中改进的Agent，也会改变组织可以承担的任务。它不再只是在固定流程中替代某个步骤，而是可以随着目标、成员和工具的变化调整协作方式。人的注意力则从重复执行转向判断、创造和协调。</p>\n  <p>“我们关心的不只是Agent单方面变强，而是团队整体能不能处理过去难以承载的复杂目标。”这也是<strong>Nexus选择“图结构”作为底层组织方式的原因</strong>。</p>\n  <p>在Agent系统内部，目标、规划、专业能力、执行、记忆、工具和验证可以成为不同节点。改进发生在哪里、影响哪些能力，能够被定位和追踪。新Agent和新工具也可以作为节点接入，而不必重写整个系统。</p>\n  <p>在组织层面，人员、Agent、任务和知识又形成另一张相互连接的工作图。Agent的观察边界不再局限于一段对话，而是可以在授权范围内理解相关人员、历史决策、上下游任务和可调用资源。</p>\n  <p>两层图结构连接起来，协作反馈才可能指向具体的能力节点，经过验证的改进也才能重新进入具体工作。</p>\n  <p>单个Agent功能很容易随着模型升级被追平，更值得看重的是组织在持续使用中积累的状态、对象关系、评测基线和协作策略。它们来自真实任务中的判断和反馈，又不断被下一轮工作重新调用。</p>\n  <p>这是一种不同于模型参数的数据资产：它不只记录答案是什么，还记录一项工作为什么这样完成。</p>\n  <p>奇点逃逸团队的研究背景覆盖智能体、强化学习、LLM Post-training和认知科学。看起来分散的方向，实际都在追问相似的问题：智能如何在环境中形成，多个智能主体如何彼此协作，以及一次经验如何改变之后的行为。</p>\n  <p><strong>这种研究取向也让奇点逃逸没有从某一个垂直Agent切入，而是把目标放在更底层的组织方式上</strong>。</p>\n  <p>薛传奕把Nexus的长期方向概括为“AI时代的组织基础设施”。这并不是一个关于AI取代多少人的故事。它更接近另一种变化：当组织中出现越来越多非人类智能，原有的软件和协作方式需要被重新设计。</p>\n  <p>“协作和自进化不是两条平行路线，也不是先后发生的两个阶段。”薛传奕说，“<strong>Agent只有具备自进化机制，才能适应组织的动态环境；只有进入真实生产环境，它的能力才能被释放，并在持续反馈中积累新的智能。两者相互依赖，也相互强化</strong>。”</p>", "category": "tech", "published_at": "2026-08-03T00:10:16+00:00", "fetched_at": "2026-08-03T02:24:24.154454+00:00", "fingerprint": "8f70de35939e4c3c"}, {"source": "少数派", "title": "从拉萨到雅鲁藏布江大峡谷，我的春日西藏游记", "url": "https://sspai.com/post/112843", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/112843\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-02T06:38:25+00:00", "fetched_at": "2026-08-03T02:24:22.839350+00:00", "fingerprint": "d3d0310a69e0c704"}, {"source": "少数派", "title": "派早报：DeepSeek V4 Flash 正式版发布", "url": "https://sspai.com/post/113014", "summary": "<p>DeepSeek V4 Flash 正式版发布</p><p>特朗普向科技公司频繁索要捐款</p><p>马斯克称从未讨论过出售特斯拉中国业务</p><p>国补调整后终端销售承压</p><p>风投机构重新涌入中国科技领域</p><p>统计显示实体光盘并不能保证游戏长期可玩</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/113014\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-02T22:49:31+00:00", "fetched_at": "2026-08-03T02:24:22.839340+00:00", "fingerprint": "7d504dd4629ac9ae"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
