<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

nt-pro-blackmagic-camera-ii-ios-app-iphone-18-pro-max-aperature-camera", "summary": "One of the questionable limitations of the iPhone 18 Pro's new main camera with a variable aperture is that you're limited to just four settings in the native iOS' camera app in manual mode: f/1.48, f/1.8, f/2.8, and f/4. Those same limitations are also in place when the app is adjusting the iris itself in [&#8230;]", "category": "tech", "published_at": "2026-09-25T17:23:30+00:00", "fetched_at": "2026-09-26T03:12:56.023692+00:00", "fingerprint": "2f1cb0ea1ba12a23"}, {"source": "The Verge", "title": "Phones don’t have lights", "url": "https://www.theverge.com/podcast/1000751/vergecast-meta-connect-muse-googlebooks", "summary": "Mark Zuckerberg has a new defense of the Ray-Ban Meta glasses: They're actually doing more to signal they're taking a photo than phones do. He's brought this up in at least two recent interviews, noting that the glasses have a light that comes on to signal when a photo is being taken, while phones do [&#8230;]", "category": "tech", "published_at": "2026-09-25T17:42:59+00:00", "fetched_at": "2026-09-26T03:12:56.023685+00:00", "fingerprint": "f43edf4211ac9ef1"}, {"source": "The Verge", "title": "Roku&#8217;s first OLED TVs are up to $400 off, starting at $699", "url": "https://www.theverge.com/gadgets/1000859/roku-pro-series-oled-nothing-phone-4a-pro-deal-sale", "summary": "Roku recently launched its first-ever OLED TVs. The $999 starting price was already impressive for the 55-inch Pro Series model that has a 120Hz refresh rate OLED panel (with four HDMI 2.1 ports and support for Dolby Vision and HDR 10 Plus). The price is even lower right now at Amazon when you enter the [&#8230;]", "category": "tech", "published_at": "2026-09-25T18:18:57+00:00", "fetched_at": "2026-09-26T03:12:56.023672+00:00", "fingerprint": "1cd84880b7200e24"}, {"source": "36氪 - 最新文章", "title": "从模型上手机到让智能体落地，高通的AI时代新故事｜焦点分析", "url": "https://36kr.com/p/3998754973749376?f=rss", "summary": "<p>过去一年，AI 编程和办公工具在 PC 端快速普及，但手机上的AI体验仍以单次问答和图片处理为主。高通今年想证明的是——端侧AI也能进入到更多生活和工作场景了。</p>\n  <p>2026年，骁龙峰会上，高通与阶跃星辰、无量火科技、江波就演示了一个典型案例——端侧30B-MoE模型完成的工作链条：仅仅用本地的模型，AI读懂一封邮件，提取行程信息，同步日历，推荐航班和酒店，再草拟一封回复。</p>\n  <p>特别之处在于，这是一段需要理解、规划和连续执行的任务，并且完全在端侧完成。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260925/v2_61e9c5c7422d4f79b6ab49a69667791f@2057308263_oswg2724727oswg1402oswg1048_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高通公司总裁兼首席执行官安蒙（Cristiano Amon）</p>\n  <p>如果说两年前高通主要在证明大模型能装进手机，今年它更想证明，装进去的模型能够承担更完整的工作。</p>\n  <p>2024年，高通自研Oryon CPU开始搭载在手机上，展示了端侧大模型的可能性；而在2025年，第五代骁龙8至尊版引Personal Scribe和个人知识图谱，将直接智能体写进产品方向。</p>\n  <p>到了今年，AI界的新故事进入到以Claude Code为主的代码和办公大战。现在，高通开始让旗舰芯片进入2nm双旗舰、30B-MoE部署和更完整的任务流程，这都意味着能够共同和模型、infra厂商拓展新的应用场景。</p>\n  <p>“智能体 AI 并不仅仅是为终端新增一个功能。它实际上创造了一种全新的终端工作流程。”高通公司总裁兼首席执行官安蒙（Cristiano Amon）在主题演讲中表示。</p>\n  <p>但当AI从一个功能变成一段工作流程，高通要解决的也不仅仅是是让下一代芯片更快。智能体需要更强的本地能力，也依赖快速更新的模型、应用接口与终端协作。</p>\n  <p>进入2026年，芯片厂商们的一个共同趋势是：能力边界在扩大，竞争边界同样在扩大。对高通而言，这种扩展不只是从手机走向 PC、眼镜、汽车和数据中心，还包括围绕模型适配、软件工具和跨终端协作补齐能力。</p>\n  <h2>从让手机部署模型，到让智能体持续工作</h2>\n  <p>如果为今年的骁龙峰会总结唯一的关键词，“智能体”绝对排在第一位。高通的一切更新——都是在为更复杂的AI任务，重新分配手机里的计算资源。</p>\n  <p>比如，第六代骁龙8至尊版与超级至尊版双旗舰，均采用2nm工艺。搭载了超级至尊版的设备，高通不只是把频率拉到5GHz，其中CPU负责工具调用和任务调度，NPU承担模型推理，低功耗感知单元处理后台信息，为不同类型的AI工作分配专属计算通道。</p>\n  <p><strong>这背后的变化是，AI不再只在用户提问时工作，还要在后台保留信息、等待时机并接续任务。</strong>在以往，一次问答或修图是单次调用；智能体则要反复读取上下文、调用工具、在任务间切换。</p>\n  <p>缓存、内存带宽和低功耗感知，因此变得重要了——最起码，手机不能因多了一个常驻智能体就持续发烫、迅速耗电。</p>\n  <p>这并不是今年才出现的方向。2025年发布的第五代骁龙8至尊版，就已经已强调Personal Scribe、个人知识图谱和低功耗感知中枢。</p>\n  <p>而在今年，高通在缓存、NPU共享内存和感知能力上的升级，更像是对既有方向的持续补强——让更多信息得以保留，让任务切换与持续运行更可靠。</p>\n  <p>不过，这并不是把所有AI计算留在本地，而是让终端承担更有价值的一部分。手机掌握日历、邮件等个人信息，高通的新双Micro NPU架构性能提升85%，同时功耗降低20%，直观提升了个人记录（Personal Scribe）能力——提升本地处理低时延、离线可用和减少数据上传的潜力；复杂任务仍可调用云端。</p>\n  <p><strong>如今，更大体量的模型开始与完整的本地办公流程结合。</strong>对比2024年，最多7B的模型能够部署在端侧，在这次峰会上，高通就已经和阶跃达成合作。如今，30B的MoE模型在参考设计上完成的邮件理解、行程规划和日历同步，是一次可感知的跨越。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260925/v2_f7fe73e029624c22bfd75cf3b49357f9@2057308263_oswg2529733oswg1412oswg1056_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高通技术公司高级副总裁兼手机业务总经理Chris Patrick</p>\n  <p><strong>而更复杂的 AI 应用，如今也可以由多个模型的分工完成，而不只是一个模型变得更大。这为应用生态创业者提供了空间。</strong></p>\n  <p>比如，在AI公司Deepgram展示的AI播客应用中，NPU上的语音模型负责转写并区分发言者，GPU上的Gemma模型理解话题、生成追问建议——一边听清谁说了什么，一边判断接下来该问什么。这让“异构计算”变成了读者可理解的场景。不过工作人员也提到需联网检索核查，整个应用并非完全离线。</p>\n  <p><strong>AI智能眼镜也是一个典型品类。过去一年的变化，也能说明高通这样的芯片厂商，如何让新AI硬件逐步突破能力上限</strong>。2025年6月 AWE 上，高通AR1芯片的升级款骁龙AR1+ Gen 1已用原型眼镜演示Llama 3.2-1B本地运行，高通强调芯片更小、功耗更低以适应镜腿和电池约束；今年，高通则进一步为AR1、AR1+对提供多模态1比特模型的支持。</p>\n  <p>高通也在逐步拓展对开发者生态的支持。今年推出的高通START计划中，就提供AR1+模组、软件平台和参考设计——非科技厂商的集成门槛也在降低，判断是研发支持越来越贴近品类需求，而非只把手机芯片缩小。</p>\n  <p>除此之外，高通也推出了全新的Adreno Neural Fusion，带来增强的移动游戏，借助AI实现智能的图形渲染，从而带来更沉浸的游戏体验、更丰富的视觉效果，和更持续的游戏时长。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260925/v2_9db45d69389b441f975a77a330112320@2057308263_oswg1998894oswg1398oswg1058_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高通新一代Adreno</p>\n  <p><strong>但芯片能支持什么，与智能体最终能替用户完成什么，仍然不是一回事。</strong>高通公司中国区董事长孟樸对36氪表示，跨终端持续服务的个人智能体，可能到2027-2028年，才会比较稳定地开始逐步落地。</p>\n  <h2>AI 时代的芯片厂商：迭代更快，挑战更多元</h2>\n  <p>高通在 AI 时代，如今的状态可以说是四面开战，压力并不小。这一部分来自新市场的吸引力，另一部分来自也要守住旧市场的压力。</p>\n  <p>移动时代，成就高通的基础是通信专利与芯片平台两条业务。而进入大模型时代，以数据中心为主的庞大需求，已让英伟达获得庞大收入——2027财年，英伟达第二季度数据中心收入达890亿美元。</p>\n  <p>高通也没有放过这个市场。此前，高通提出2029财年非手机收入400亿美元的目标，并推进数据中心业务。动机不难理解：守住手机之外，还得找到新的增长引擎。</p>\n  <p><strong>但在争取新增长之前，高通可能首先得适应一个比手机换代更快的模型市场。</strong>“过去，智能手机完成适配后，可能9个月甚至12个月都无需再调整；而现在，大模型每3个月，甚至更短时间内就会迭代一次。”高通公司中国区董事长孟樸对36氪在内的媒体表示。</p>\n  <p>模型版本和能力更新快，不代表底层计算结构以同样速度完全变化。更准确的挑战在于：在相对稳定的计算基础上，用软件调度、可配置能力和持续验证承接快速迭代。</p>\n  <p>更深的一层变化是，合作正从模型发布后的适配，前移到模型设计环节。2026年展示的四方合作的分工说明了这一点——高通提供计算平台，阶跃提供模型，无量火优化推理与调度，江波龙处理存储协同；AI Hub则试图复用优化成果、降低部署门槛。</p>\n  <p><strong>竞争新的竞争指标是：新模型出来后，谁能更快、以更可控的成本交付可用体验。</strong></p>\n  <p>端侧智能体是整个市场都在追逐的机会，9月，几乎所有主流厂商的新品都覆盖了端侧和智能体。比如，9月15日，联发科发布天玑9600系列，9600 Pro同样采用2nm，强调低功耗常驻感知，宣称支持30B-MoE端侧运行。</p>\n  <p>更复杂的竞争也会来自客户一侧：一边采购高通芯片，一边也在把关键能力试图掌握在自己手中。比如小米玄戒 O1进入量产，苹果在iPhone 16e上推出自研C1基带等等。而进入数据中心，也绕不开客户与竞争对手身份重叠的局面。英伟达之外，谷歌自研TPU也在争取训练和推理负载——而谷歌在终端上又是高通的重要合作伙伴。</p>\n  <p><strong>当竞争同时发生在多个市场，高通还必须回答一个实际问题：这些新能力，客户负担得起是前提，但如何真正高效地应用起来？</strong></p>\n  <p>孟樸提到：“随着技术的进步，芯片中需要叠加的技术越来越多，成本也会因此越来越高。”在他看来，一款产品展示当前技术能够达到的上限，另一款则更注重效率，以应对高成本、支持终端厂商。技术能力向前推进，能否被客户采用仍要过成本这一关。</p>\n  <p>至少，让智能体稳定地在移动设备上运行，还有多重挑战。“不能做错任务，不能过度占用内存，还不能增加续航负担，起码不能比手动操作还慢。”一位半导体行业人士总结。</p>\n  <p><strong>现在，芯片行业正在进入多线混战。高通需要守土开疆，还必须成为耦合大模型厂商、AI应用之间的长期协作者。</strong>对高通来说，下一轮胜负不只取决于它能把多大的模型装进终端，更取决于能否让不断变化的模型，及时变成用户愿意反复使用的产品。</p>", "category": "tech", "published_at": "2026-09-26T00:30:24+00:00", "fetched_at": "2026-09-26T03:12:55.960849+00:00", "fingerprint": "27d66159bce30292"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 6 部作品", "url": "https://sspai.com/post/114957", "summary": "📅本周新预告《侦战》定档预告9月21日，电影《侦战》发布定档预告，宣布10月1日上映。影片由孔令政编剧、导演，古天乐、此沙、任达华、谢君豪领衔主演，袁富华、卢慧敏、杨伟伦主演，讲述一名嫌疑人从警署羁押 ...<a href=\"https://sspai.com/post/114957\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-25T09:30:00+00:00", "fetched_at": "2026-09-26T03:12:54.174083+00:00", "fingerprint": "0c62272276b0d5ee"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7195 CNY ↑+0.06%", "url": "https://www.frankfurter.app/2026-09-25?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-09-25</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7195 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0028 (+0.06%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-09-26T03:12:52.712558+00:00", "fingerprint": "0fd6ae940dbcae55"}, {"source": "The Guardian - World", "title": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "url": "h ntly unsealed document [&#8230;]", "category": "tech", "published_at": "2026-09-24T23:50:55+00:00", "fetched_at": "2026-09-25T03:08:52.791531+00:00", "fingerprint": "aa95f7861ac6e2e3"}, {"source": "The Verge", "title": "Microsoft is killing off the ‘Copilot Plus PC’ brand", "url": "https://www.theverge.com/tech/1000495/microsoft-is-killing-off-the-copilot-plus-pc-brand", "summary": "Remember when Microsoft wanted everyone to know that \"Copilot Plus PCs\" were the ones to get, because those were the PCs that that'd have enough built-in AI muscle to get things done? Two and a half years later, Microsoft and Qualcomm seem to be admitting the brand is already dead. Windows Central's Zac Bowden reports [&#8230;]", "category": "tech", "published_at": "2026-09-25T01:25:53+00:00", "fetched_at": "2026-09-25T03:08:52.791524+00:00", "fingerprint": "2bee89eb63bc3507"}, {"source": "The Verge", "title": "Here’s the Tesla Semi… again", "url": "https://www.theverge.com/transportation/1000317/tesla-semi-launch-customer-delivery-freight-battery-engineer", "summary": "Remember the Tesla Semi? The long-gestating, heavy-duty truck first introduced in concept form in 2017 is finally in volume production as of April 2026 - nearly a decade after its initial introduction. On Thursday evening, the company held yet another event for the Semi to demonstrate to customers and investors that the long wait was [&#8230;]", "category": "tech", "published_at": "2026-09-25T02:12:57+00:00", "fetched_at": "2026-09-25T03:08:52.791515+00:00", "fingerprint": "e1598ad102f02fa4"}, {"source": "36氪 - 最新文章", "title": "AI公司杀进硬件，联想AI平板如何找到存在感？｜最前线", "url": "https://36kr.com/p/3995480853204870?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_7f2b944398234cc9b34bde6b29017b17@6310690_oswg145593oswg1600oswg1066_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：联想官方</p>\n  <p>文｜肖漫</p>\n  <p>编辑｜袁斯来</p>\n  <p>AI正在重塑每一个硬件产品，包括平板。</p>\n  <p>过去一年，越来越多厂商在给平板增加 AI 能力，会议记录、总结、语言翻译、图片生成、文档处理等功能不断进入产品，但大多数所谓 AI 平板，仍然是传统平板加上一层 AI 应用：用户打开一个入口，输入问题，再获得答案。</p>\n  <p>AI 被放在了平板里，却还没有真正进入平板的系统和交互。</p>\n  <p>在联想看来，这不是真正的 AI 平板。联想集团高级副总裁、全球创新中心负责人贾朝晖认为，AI 平板真正的变化不是增加几个 AI 功能，而是重新设计设备本身。他把行业里常见的“在设备上装 AI App”称作“+AI”，而联想希望做的是“AI+”：从系统设计开始，就让 AI 成为设备的一部分。</p>\n  <p>这个区别听起来像绕口令，但落到产品上，差别很大。</p>\n  <p>比如大学生上课。联想集团副总裁、平板电脑事业部总经理陈可预告了未来AI平板与天禧AI结合的一些关键应用场景——学生进入教室后，平板可以根据课程表提前准备相关知识；上课时，用户可以用笔记录、录音，也可以用手机拍照；下课后，AI 再把录音、课件、截图和用户圈选的内容整合起来，形成一份结合了你个人对知识点的理解做的优化，有声音、有照片、有录像，定制的完整课堂笔记。</p>\n  <p>在这个过程中，AI 不再只是一个被打开的功能，而是贯穿了一个完整任务。联想把这种产品定义为“AI+产品”，而不是“+AI产品”。</p>\n  <p>这也是目前 AI 平板真正需要解决的问题：模型已经进入设备，但 AI 到底能不能进入设备的系统、应用和交互链路。</p>\n  <h2><strong>AI公司和硬件公司双向而行</strong></h2>\n  <p>过去两年，大模型更多的是存在于手机和电脑里的一个 App，用户打开它，输入问题，了解答案，但当 Agent 开始替用户执行任务，模型能力不仅仅在问答，还能够知道用户正在看什么、设备里有哪些信息，以及哪些应用和服务可以调用。</p>\n  <p>这也是为什么 AI 公司开始向硬件端寻找落地场景。9月16日，搭载豆包手机助手的努比亚 NaviX Ultra 正式开售。9 月22日，阿里云旗下无影团队研发 QwenBook 的消息也被曝光，产品形态接近平板。</p>\n  <p>当豆包、千问这样的 AI 公司开始进入硬件，一个问题摆在传统硬件厂商面前：如果未来最重要的能力是 Agent，那么拥有模型的公司为什么不能直接找一家 ODM 把硬件做出来？</p>\n  <p>联想集团高级副总裁、中国消费业务群总经理张华认为，大模型能力会越来越趋同，真正重要的反而是大模型如何和端侧异构算力、全局硬件以及应用调度结合。硬件公司的优势，是能够让 AI 对硬件和软件进行全局调度，并根据真实用户场景持续调整体验。</p>\n  <p>联想给出的答案是\"端-边-云\"的混合式 AI 技术架构&nbsp;。</p>\n  <p>9 月初，天禧 AI 4.3 开始真正部署这一架构。联想认为，一部分数据和任务适合在端侧、边侧完成，既可以保护隐私，也可以降低对云端 Token 的依赖；更加复杂、泛化的任务再交给云端。</p>\n  <p>这背后的判断是，未来的个人 AI 不会完全运行在云端，而会分布在用户自己的 PC、平板、手机以及其他设备上。</p>\n  <p>在联想的设想中，PC、手机、平板并不是三个孤立的 AI 设备。它们共享知识库、上下文和记忆，也可以互相调用算力和能力。用户在平板上发起一个任务，可以调用 PC 的算力和资料，再把结果返回平板。</p>\n  <p>从这个角度看，平板并不是联想 AI 战略里一个孤立的产品。</p>\n  <h2><strong>平板重新寻找自己的位置，联想也是</strong></h2>\n  <p>平板过去一直没有完全找到自己的独立定位。它比手机大，却又没有手机那么随身；它比 PC 轻，却没有 PC 那么强的生产力。它最成熟的场景长期集中在视频、阅读和教育。</p>\n  <p>张华认为，过去平板更多承担内容消费，生产力属性偏轻；到了 AI 时代，生产力和内容消费两个属性会变得同等重要。</p>\n  <p>张华把 AI 平板称作“AI 天生的容器”，原因不是平板有某个独特的 AI 技术，而是它同时拥有大屏、长续航、便携性以及语音、笔、键盘等多种交互方式。AI 出现之后，这些过去看似分散的能力开始被重新组合起来，平板的形态则是容纳这场交互升级的最佳载体。</p>\n  <p>过去大家认为拿平板看视频，就可以了。现在有了AI之后，用平板进行创作时，一边用AI生成内容，一边用笔记录下你的思维导图。如果这时是小屏幕，不好操作。对于大屏幕，我们需要无界画布，去操作和互动，让AI进行更好的全局协同与整体协调，让任务完成得更好。</p>\n  <p>IDC 数据显示，2026 年中国 GenAI 平板出货量达到 112 万台，占平板市场 35.6%，同比增长 68.4%。AI已成为平板摆脱低价同质化竞争的核心抓手之一。</p>\n  <p>但跨应用权限、智能体长期记忆和数据隐私，仍然是平板等 AI 硬件落地的主要瓶颈，这也是 AI 公司开始进入硬件之后必须面对的问题。</p>\n  <p>AI 进入硬件之后，真正的竞争不会简单变成“AI 公司做硬件”或者“硬件公司做 AI”。更深一层的变化是，终端硬件正在从承载 AI 的工具，变成 AI 本身执行任务的环境。</p>\n  <p>过去的硬件竞争，核心是屏幕、芯片、摄像头、续航和工业设计；下一阶段，竞争还会延伸到系统、算力调度、应用生态、用户数据、Agent 权限以及跨设备协同。</p>\n  <p>这也是传统硬件公司和 AI 公司真正开始交叉的地方：前者需要补上模型和软件能力，后者则需要进入硬件、系统和应用生态，而AI 平板只是这场变化的其中一个切口。</p>", "category": "tech", "published_at": "2026-09-24T10:22:23+00:00", "fetched_at": "2026-09-25T03:08:52.657730+00:00", "fingerprint": "e3447d50b0d27852"}, {"source": "36氪 - 最新文章", "title": "模型之外，游戏+AI的下一道门槛在哪里？", "url": "https://36kr.com/p/3997468580958089?f=rss", "summary": "<p>在一局《永劫无间》的游戏对局里，你的队友可能不是“人”。&nbsp;</p>\n  <p>Qwen大模型是这些AI队友的底座。会协作的队友，是游戏行业变革中最容易被看见的一角，冰山以下是“游戏正在被AI重做一遍”已经成为一个共识判断。&nbsp;</p>\n  <p>2026云栖大会现场，专门为游戏行业安排了一个上午的AI专场。网易、TapTap等标杆企业的技术负责人和创作者先后上台，从智能NPC讲到AI原生玩法，再讲到AI游戏创作。&nbsp;</p>\n  <p>但重做的程度并不相同。把AI当提效工具，和按AI的方式重做游戏，正在变成两门不同的生意。&nbsp;</p>\n  <p>前者优化单位成本，后者彻底改写生产与体验。而游戏的玩法形态、生产组织与运行方式，都不仅仅是效率问题。那么，当厂商决定把游戏“用AI重做一遍”，究竟从哪里开始？拼的又是什么？&nbsp;</p>\n  <h2><strong>当AI坐上牌桌</strong></h2>\n  <p>把游戏“用AI重做一遍”，首先仍要托住游戏本身。全球开服、弹性扩容与稳定运行，是新体验能够落地的前提。&nbsp;</p>\n  <p>本届云栖游戏展区展示的《明日方舟：终末地》，就是一个例子。这款面向全球的多端大型3D游戏，上线次日全球累计下载量突破3000万。面对流量洪峰，阿里云的全栈技术方案成功保障了游戏的稳定运行，为全球玩家提供高流畅的游戏体验。承接全球玩家涌入的背后，是百万级并发请求的处理能力，也是阿里云覆盖全球31个公共云地域、107个可用区的基础设施。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_4f6bc90da4c44600aa7400297b928646@5679941_oswg1388478oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云栖大会上的游戏展区&nbsp;</p>\n  <p>当AI开始参与游戏中的协作与决策，这套底座又有了新的任务：既要承接玩家和流量，也要支撑智能体实时参与对局，让模型能力成为可持续运行的游戏体验。&nbsp;</p>\n  <p>在《永劫无间》中，网易雷火伏羲把AI队友直接放进了对局，玩家可以用语音和游戏信号与AI队友协作，让对局里的配合多了一种可能。&nbsp;</p>\n  <p>云栖大会游戏展区展示的《历史模拟器：崇祯》，则把大模型放进了世界推演。这款AI原生的历史策略游戏以千问大模型参与明末政局推演，玩家用自然语言拟写诏书、颁布政令，每一项决策都会触发AI模拟的连锁反应，推出新的历史走向。&nbsp;</p>\n  <p>作为一款策略游戏，内容边界被进一步拓展：玩家不再只依靠预设选项推进，游戏反馈也开始取决于模型对局势的动态推演。&nbsp;</p>\n  <p>从陪练、对手再到规则，AI正在逐步进入游戏体验更核心的位置。&nbsp;</p>\n  <p>类似的做法在多家头部厂商几乎同时出现。&nbsp;</p>\n  <p>巨人网络旗下的《太空杀》则从另一种体验变化入手，依托阿里云千问大模型的底层能力，探索游戏角色对玩家行为模式的长期记忆、动态学习，让AI玩家可以跨会话记住玩家的历史互动选择，实时调整反应逻辑，实现“千人千面”的游戏体验。&nbsp;</p>\n  <p>迄今为止，牌桌上的玩法形态，可以归为三类：智能NPC、AI队友与虚拟玩家、生成与演化本身就是玩法的AI原生游戏。&nbsp;</p>\n  <p>三类玩法共享同一个实时闭环，感知状态、理解决策、调用工具、反馈行为。要让闭环稳定地进入真实游戏，还需要运行环境、模型调用治理、安全护栏和上线后的观测评估。大众熟知的模型只是其中一环，负责“想”的部分，背后的基础设施负责让智能体跑得稳、管得住。&nbsp;</p>\n  <p>这也代表着，台前体验创新上的变化与壁垒，正在从模型能力延伸到模型与工程的协同能力。&nbsp;</p>\n  <h2><strong>被拉直的生产线</strong></h2>\n  <p>游戏内容生产，有一部分长期停留在“手抄本时代”。&nbsp;</p>\n  <p>概念、原画、建模、贴图、动画、引擎，管线像一条瀑布，每个环节交给专门的团队，衔接靠人力。&nbsp;</p>\n  <p>管线像瀑布，层层下泄，每一层都要等待上游就位，这也是为什么很多成熟游戏团队在开发一款游戏时，要保证它能够长期稳定运营不出bug，依然需要很长的开发、测试和调优周期。&nbsp;</p>\n  <p>如今，这条瀑布正在被AI拉直。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_c6f2d689cda74067b88934c0891e4945@5679941_oswg79727oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网易雷火伏羲AI实验室产品负责人王宏显&nbsp;</p>\n  <p>网易伏羲在今年云栖大会上也展示了从角色、场景到界面动效和视频制作等工作流，AI辅助创作被接入制作团队日常使用的工具链。多个环节各自提效，连起来之后，整条管线的工作方式相当于被重写了一遍。&nbsp;</p>\n  <p>类似的改造并非孤例。过去一段时间里，很多游戏厂商都在探索AI在不同场景下的应用，覆盖的范围也从生产延伸到了投放运营等环节。&nbsp;</p>\n  <p>AI在游戏领域的业务版图被迅速扩张之前，一个容易被外界忽视的要素是，基础设施和工具层已经成型。&nbsp;</p>\n  <p>从阿里云在论坛展示的解决方案看，阿里云为游戏公司提供的产品矩阵，对应着一条完整的游戏制作链路。研发有Qoder，投放与素材有万镜一刻，组织协同有千问办公。以研发测试为例，AI协作已经从最初的代码补全走到了理解项目、规划编码、验证修复，交付由人审核的全链路，在此过程中，企业原有的工具链也能得到保留。&nbsp;</p>\n  <p>运营的深处还有数据，它是游戏行业始终绕不开的成本与增长谜题。&nbsp;</p>\n  <p>在论坛圆桌上，诗悦网络谈到AI已经进入发行素材创意、制作、投放与数据分析：它希望把分散的环节串联起来，让团队从只对交付负责，进一步对经营结果负责。&nbsp;</p>\n  <p>这家研运一体的公司，在把数据平台整体迁到阿里云DLF与Serverless StarRocks上之后，总成本降低了38%，集群扩容从一周缩短到了5分钟，为开放世界游戏作准备的数据规模也将进入PB级。&nbsp;</p>\n  <p>这一类AI化改造，未必直接改变玩法，位于玩家体验的水位线以下，但让数据和反馈更快进入下一轮决策，对于一款游戏的长期运营来说意义更加深远。&nbsp;</p>\n  <p>AI时代，游戏厂商对于基础设施的要求多了一层，智能体要持续执行任务、调用工具、管理记忆，过程可追踪、权限可管控、效果可评估。&nbsp;</p>\n  <p>阿里云的Agent Native Cloud对应着不同环节：AgentCore负责智能体构建和治理，Agent Sandbox提供隔离运行环境，AI网关管理模型调用，AI安全护栏守住输入输出边界，AgentLoop用于上线后的观测、评估与优化。&nbsp;</p>\n  <p>这也意味着，游戏云的竞争维度正在扩宽，从靠云服务撑住流量，扩展到了靠云服务管好智能体。&nbsp;</p>\n  <p>一百年前，美国工厂的电气化其实走过同样的路。&nbsp;</p>\n  <p>1899年到1929年，多数工厂只是把蒸汽机换成电机，沿用旧的厂房布局与轴带传动，效率红利迟迟没有兑现；1913年福特在海兰帕克工厂引入移动装配线，整车装配从12.5小时压缩到约90分钟，电气化才真正完成。&nbsp;</p>\n  <p>换工具的人多，重造流程的人少。&nbsp;</p>\n  <p>今天的游戏行业站在同样的位置。把美术和代码交给AI生成，是换工具；按AI的协作方式选择对应的基础设施，把管线、发行、运营重排一遍，是重造流程。&nbsp;</p>\n  <p>有趣的是，国内这些走了“重造路线”的游戏公司，从页游时代的云服务器到今天的 Agent Infra，每一次游戏主流形态的跃迁都需要云的陪伴。而他们的基础设施几乎集中在同一家云厂商。&nbsp;</p>\n  <p>阿里云也在本届论坛展示Agent Native Cloud的持续投入。&nbsp;</p>\n  <p>从弹性计算到智能体底座，游戏公司为什么愿意在一家云厂商持续投入？&nbsp;</p>\n  <p>其中的一个原因是：重构越剧烈，游戏公司越不敢在底座上冒险。版本和玩法可以试错，运营可以迭代，基础设施试不起。&nbsp;</p>\n  <p>每一次技术跃迁都是一轮新的投票，技术与生态领先者的能力会被再次确认一遍。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_45b564e234f645f49a1b1f05c4212bcf@5679941_oswg247358oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>IDC数据显示，阿里云连续5年位居中国游戏云市场第一，基础设施份额39%；AI游戏云模型服务与AI应用市场，份额37%，同样位居中国市场第一。&nbsp;</p>\n  <p>支撑阿里云在AI时代被头部游戏厂商连续选择的，主要是三层能力：全栈能力、场景打磨、长期投入。&nbsp;</p>\n  <p>从芯片、云基础设施到模型与Agent，阿里云提供从底层算力到上层智能体的完整能力，游戏公司每次技术跃迁，都有机会减少跨供应商拼接底座的复杂度。&nbsp;</p>\n  <p>同时，游戏可以说是云上最苛刻的场景之一，开服洪峰、全球同服、实时对战，大版本上线就是一次公开大考与验收，头部游戏公司的需求反过来把阿里云的能力一层层磨了出来。&nbsp;</p>\n  <p>代际上的先发优势同样关键，页游时代备好了弹性云服务器，手游出海时代铺好了全球节点，AI时代继续完善AgentCore、Agent Sandbox、AI网关、AgentLoop等智能体基础设施。&nbsp;</p>\n  <p>下一代需要的东西，上一代已经准备好，能力被验证，信任也在复利。&nbsp;</p>\n  <h2><strong>门票降价之后</strong></h2>\n  <p>生产线的另一端，入场门票在降价，幅度大到了一个此前没有出现过的程度。个人创作者开始拥有从想法到可玩作品的完整工具链。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_dacba768331a4572ba0bb4dfbad41868@5679941_oswg76144oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">妹居主策划 钱看山&nbsp;</p>\n  <p>《妹居物语》主策钱看山在论坛上提出的，是另一个值得关注的问题：&nbsp;</p>\n  <p>如果拿掉AI，游戏的核心体验是否还成立？在《妹居物语》中，Qwen3.8-flash理解玩家上传的照片和当前屏幕内容，CosyVoice-v3.5-flash生成角色语音；角色的状 态、记忆和行动编排则由团队自己的系统维护。团队还在验证体验能否持续、成本能否回收。&nbsp;</p>\n  <p>《妹居物语》的探索说明小团队有机会尝试新的AI原生玩法，同时也照亮了问题的另一面， 即在头部游戏厂商以外，新型开发模式所代表的长尾市场产生了结构性的变化。&nbsp;</p>\n  <p>换句话说，AI能不能成为游戏行业的基础设施，标准很简单：中小团队用起来有多容易。&nbsp;</p>\n  <p>游戏AI论坛上，阿里云与TapTap联合发起AI游戏创作大赛，面向希望把创意变成作品的开发者。&nbsp;</p>\n  <p>创作侧的支撑是TapTap制造，底层接入Qwen-Image-3.0、Wan3.0与Qwen3.8-Max等阿里模型，能更好地将图片、视频、序列帧生成整合进一条管线。&nbsp;</p>\n  <p>TapTap制造让创作者从自然语言提出想法，在云端生成代码与素材、构建并预览游戏，完成后发布到TapTap，再根据玩家反馈迭代。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_e4f77271b1164ca5a60a4d02ca146b4f@5679941_oswg109546oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这场大赛在论坛发布环节由TapTap制造负责人姜黎和阿里云智能公共云事业部副总裁解航共同宣布。&nbsp;</p>\n  <p>大赛值得关注的有三件事：第一，创意到可玩作品的成本被压低，小众想法有机会变成可验证的游戏；其次，TapTap的社区把试玩与反馈接进创作，有潜力的作品多一条被发现的路；第三，AI进入真实交付环境，作品将经历真实玩家的检验。&nbsp;</p>\n  <p>门票降价的另一侧，是更加直接的作品发布与玩家反馈渠道。&nbsp;</p>\n  <p>生产工具与发行渠道同时向个人开放，游戏行业的供给侧也会迎来新一轮的扩容。&nbsp;</p>\n  <p>对局里的AI越来越多，管线按人机协作的方式重排，创作门槛正在降低，我们可以清晰地预见，下一批足以定义“游戏行业”的作品，可能不再出自一个经验和预算充足的百人团队。&nbsp;</p>\n  <p>一切关于体验与生��的美好想象，在今天的游戏行业才刚刚开始。&nbsp;</p>\n  <p>做游戏的人在换，但在全球上线的稳定性与智能体的运行底座这一侧，过去五年，中国游戏行业几乎是共同“用脚”投票，把信任都交给了同一家厂商——阿里云这些能力仍需长期验证，阿里云也在持续承接行业的新需求。&nbsp;</p>\n  <p>在生产能力被不断解构的时代，信任与底座的分量只会更重。&nbsp;</p>", "category": "tech", "published_at": "2026-09-24T13:56:48+00:00", "fetched_at": "2026-09-25T03:08:52.657714+00:00", "fingerprint": "55e52fd0a2e1ced5"}, {"source": "少数派", "title": "古董电脑室十周年记：为什么我不再是收藏家（上）", "url": "https://sspai.com/post/114395", "summary": "站在十年的时间节点回望，2016 年知乎专栏「古董电脑室」的起点，其实并非一个怀旧的「博物馆」，而是一个试图在商业上寻找切口的「最小可行产品」（MVP）。然而，这场始于「市场验证」的创业实验，在随后的十年里，撞上了中国独特的社群生态与商业现实，最终将我推向了一个完全意想不到的方向，并彻底改变了我对「技术」和「收藏」的理解。<a href=\"https://sspai.com/post/114395\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-24T04:15:24+00:00", "fetched_at": "2026-09-25T03:08:50.955420+00:00", "fingerprint": "addfb54fe5632815"}, {"source": "少数派", "title": "微软在游戏行业的早期试水：一段与梦工厂的「梦幻联动」", "url": "https://sspai.com/post/113823", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用 glasses by saying its name and ask it to handle tasks like guiding a workout, logging [&#8230;]", "category": "tech", "published_at": "2026-09-23T23:40:56+00:00", "fetched_at": "2026-09-24T02:52:44.778993+00:00", "fingerprint": "e68a9b7de2f889c8"}, {"source": "The Verge", "title": "Meta’s next VR device isn’t a headset — it’s glasses", "url": "https://www.theverge.com/tech/999517/meta-vr-glasses-connect-2026-hands-on", "summary": "Meta is launching new VR hardware: a pair of glasses. The new Meta VR Glasses sit on your ears like a typical pair of glasses instead of being strapped over your head, but they still have immersive displays for watching movies, playing games, and getting work done. Imagine a pair of hefty black sunglasses with [&#8230;]", "category": "tech", "published_at": "2026-09-23T23:42:10+00:00", "fetched_at": "2026-09-24T02:52:44.778987+00:00", "fingerprint": "eba11267532e030c"}, {"source": "The Verge", "title": "Meta Connect 2026: The 7 biggest announcements", "url": "https://www.theverge.com/tech/999593/meta-connect-2026-everything-announced", "summary": "Meta announced a slate of new wearables during its annual Meta Connect showcase on Wednesday. The star of the event was the new Meta VR Glasses, which pack virtual reality tech into a lightweight smart glasses-style frame with a tethered puck. Meta also announced new pairs of screen-free smart glasses, along with some new AI [&#8230;]", "category": "tech", "published_at": "2026-09-24T00:00:33+00:00", "fetched_at": "2026-09-24T02:52:44.778980+00:00", "fingerprint": "93c0ec3605654b4d"}, {"source": "The Verge", "title": "Meta is making a standalone Muse AI gadget", "url": "https://www.theverge.com/tech/999750/muse-charm-meta-ai-hardware", "summary": "Meta is building a dedicated hardware device for its new Muse AI agent. The product, called Muse Charm, was briefly shown off by Meta CEO Mark Zuckerberg at the end of tonight's Meta Connect presentation. It looks almost like a chunky smartwatch without the strap - just a big screen, plus a little lanyard for [&#8230;]", "category": "tech", "published_at": "2026-09-24T00:15:20+00:00", "fetched_at": "2026-09-24T02:52:44.778967+00:00", "fingerprint": "d2f07c69bc979a28"}, {"source": "36氪 - 最新文章", "title": "科氪 | 荣耀方飞：与阿里共建五大垂域模型与解决方案，Magic9落地行业领先AI能力", "url": "https://36kr.com/p/3996102074290305?f=rss", "summary": "<p><strong>&nbsp;</strong>9月22日上午，荣耀产品线总裁方飞在阿里云栖主论坛上发表演讲，阐述了荣耀对AI终端发展下一阶段的前沿判断。即将发布的年度旗舰荣耀Magic9，不仅将搭载行业首个系统级Agent Harness操作系统，并深度融合荣耀和阿里共同打造的超级智能体模型和解决方案，让Agent从“能理解”进一步走向“能稳定执行”。未来，荣耀将持续深化与更多生态伙伴的合作，共同探索下一代AI智能体终端和下一个超级Agent场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_c9dafe105980453abcbcd2b76dcf8ed5@517825446_oswg6364638oswg3994oswg2662_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>重构操作系统，打造领先行业的Agent能力</strong></p>\n  <p>在荣耀看来，下一个十年的终端设备，将不再只是应用的容器，而是智能体的舞台，而推动这场终端变革的核心驱动力，来自操作系统。行业报告也印证了这一判断。IDC报告指出，未来AI能力建设的重点，将从模型能力竞争，转向感知、记忆、推理、规划和执行等系统能力的协同演进。</p>\n  <p>基于这一洞察，荣耀率先提出将MagicOS升维成伙伴型多模态智能体操作系统——Agentic OS，把硬件层、系统层、生态层等六层技术栈进行全面重构，真正实现意图驱动、主动智能、自然交互、天生跨端的范式跃迁。</p>\n  <p>在系统级重构过程中，荣耀携手阿里，共同打造面向下一代AI手机的五大垂域模型和解决方案，打造行业领先的手机Agent能力，让AI手机从被动响应走向主动服务。以荣耀MagicOS和Qwen Intelligence为基础进行深度共创，阿里提供行业领先的基础模型能力，荣耀则提供系统能力和亿万终端用户的真实使用场景，树立了端云协同创新的新范式。</p>\n  <p>但Agent要完成多步骤的复杂操作，仅靠大模型还不够，还需要一个系统级的协同调度框架。为此，荣耀打造了行业首个系统级Agent Harness架构，并在MagicOS 11上落地。该架构把模型与感知、规划、工具调用和执行组织起来，让Agent从“能理解”进一步走向“能稳定执行”，加速操作系统的AI进化。</p>\n  <p>在新模型和解决方案支持下，新一代YOYO在意图理解、任务规划、自动执行和服务闭环等方面取得显著的成果，综合任务准确率91.8%；自动执行平均操作耗时3.6秒；最大可操作步数超过100步；而端到端任务闭环率达到90%。相比一个月前，能力又有了显著提升。荣耀与阿里一起构建与定义行业的新范式，给终端带来全新体验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_87a8a80e44a14107999b256e840e97cd@517825446_oswg491877oswg826oswg550_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p><strong>重构操作系统，打造领先行业的Agent能力</strong></p>\n  <p>在荣耀看来，下一个十年的终端设备，将不再只是应用的容器，而是智能体的舞台，而推动这场终端变革的核心驱动力，来自操作系统。行业报告也印证了这一判断。IDC报告指出，未来AI能力建设的重点，将从模型能力竞争，转向感知、记忆、推理、规划和执行等系统能力的协同演进。</p>\n  <p>基于这一洞察，荣耀率先提出将MagicOS升维成伙伴型多模态智能体操作系统——Agentic OS，把硬件层、系统层、生态层等六层技术栈进行全面重构，真正实现意图驱动、主动智能、自然交互、天生跨端的范式跃迁。</p>\n  <p>在系统级重构过程中，荣耀携手阿里，共同打造面向下一代AI手机的五大垂域模型和解决方案，打造行业领先的手机Agent能力，让AI手机从被动响应走向主动服务。以荣耀MagicOS和Qwen Intelligence为基础进行深度共创，阿里提供行业领先的基础模型能力，荣耀则提供系统能力和亿万终端用户的真实使用场景，树立了端云协同创新的新范式。</p>\n  <p>但Agent要完成多步骤的复杂操作，仅靠大模型还不够，还需要一个系统级的协同调度框架。为此，荣耀打造了行业首个系统级Agent Harness架构，并在MagicOS 11上落地。该架构把模型与感知、规划、工具调用和执行组织起来，让Agent从“能理解”进一步走向“能稳定执行”，加速操作系统的AI进化。</p>\n  <p>在新模型和解决方案支持下，新一代YOYO在意图理解、任务规划、自动执行和服务闭环等方面取得显著的成果，综合任务准确率91.8%；自动执行平均操作耗时3.6秒；最大可操作步数超过100步；而端到端任务闭环率达到90%。相比一个月前，能力又有了显著提升。荣耀与阿里一起构建与定义行业的新范式，给终端带来全新体验。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_aa0a9201a8764aa384e89c97b11eca8f@517825446_oswg5458648oswg3072oswg2304_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-23T14:45:27+00:00", "fetched_at": "2026-09-24T02:52:44.680775+00:00", "fingerprint": "d5c50909dea6a217"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨苹果出手限制“摇一摇”广告；王慧文称想组局买下西贝：喜欢这个品牌；Meta测试真人代Muse拨打电话，引发内部隐私争议", "url": "https://36kr.com/p/3996646362747015?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>微软、亚马逊、Adobe等集体降价挽留企业客户</p>\n  <p>消息称豆包开始收缩对话团队</p>\n  <p>闲鱼：“涉未成年人淫秽”系不实消息</p>\n  <p>未来四年“双一流”高校本科招生数还将扩容7.6万人</p>\n  <p>王兴兴再登《财富》40岁以下商界精英榜，张雪、姚顺雨等首次入选</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>苹果出手限制“摇一摇”广告</strong></p>\n  <p>据界面新闻，大量iPhone用户反馈，苹果在最新发布的iOS 27.2 Beta 2测试版系统中，针对中国区用户悄然新增了一项名为“Restrict Motion Data”（限制运动数据）的设置选项。该功能位于“设置—隐私与安全—运动与健身”目录下，开启后用户可手动选择需要限制的应用，被加入名单的App将无法获取加速度计、陀螺仪等运动传感器数据的权限，从而从系统底层切断“摇一摇”开屏广告的触发源头。记者实测发现，iPhone在升级到iOS 27.2 Beta 2版本后，AppStore必须登录国内ID才能在设置里看到“Restrict Motion Data”选项，并启用该功能。也就是说，这是苹果针对中国市场“特供”的一项用户体验保护措施，功能跟着账号走，而非跟着设备走。（财联社）</p>\n  <p><strong>王慧文发声：有没有人要组局把西贝买下来？我还是挺喜欢西贝的</strong></p>\n  <p>9月23日，记者注意到，王慧文在社交平台“即刻”发声：听说西贝要倒闭了，有没有人要组局把西贝买下来？我还是挺喜欢西贝的，我才不管是不是预制菜呢，反正卫生过硬，口味我也觉得不错。公开资料显示，王慧文为美团联合创始人，2020年从美团退休，2023年创办光年之外进军AI（人工智能）大模型领域。2024年，美团创始人、CEO（首席执行官）王兴在内部信中宣布，王慧文将用部分时间担任美团顾问。（第一财经）</p>\n  <p><strong>Meta测试真人代Muse拨打电话，引发内部隐私争议</strong></p>\n  <p>IT之家9月23日消息，据路透社看到的Meta公司内部帖子显示，Meta一直在为其新推出的个人AI助手Muse测试一项“人工礼宾”服务，即由人类承包商在后台悄悄处理部分通过该数字助手拨出的电话。借助电话呼叫功能，用户可以指示Muse拨打美国商家的电话，并与接听者交谈，办理预约理发、询问门店是否有现货，或向不同承包商询价等事务。这些内部帖子显示，一些员工对由人工处理这些电话提出了隐私担忧，警告称这种做法可能导致敏感信息被无意中分享给呼叫中心的承包商。（IT之家）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI将让第三方机构更早介入AI模型安全评估</strong></p>\n  <p>OpenAI计划让第三方机构在人工智能（AI）模型开发周期的更早阶段评估安全风险，此举旨在继续努力应对围绕AI潜在危害的担忧。这家ChatGPT开发商周二将在博客文章中宣布，计划在新AI模型的训练、评估和推出过程中，让外部机构开展技术安全评估。OpenAI还列出了其认为此类评估要有效开展所需优先关注的事项，包括“强有力的独立机制、科学严谨性、稳健的安全实践和明确的责任”。（新浪财经）</p>\n  <p><strong>谷歌推出Gemini 3.8系列文本转语音模型</strong></p>\n  <p>9月23日消息，谷歌宣布，Gemini家族新增两款全新文本转语音模型，分别为Gemini 3.8 Flash TTS和Gemini 3.8 Flash-Lite TTS。用户可以从原有30种原始语音扩展到无限语音库。该模型的具体功能包括：选好声音后，两款TTS模型都能让用户精确控制每一行台词的演绎方式。（IT之家）</p>\n  <p><strong>千问发布Qwen-Audio-3.1，下调Qwen-Audio全线语音模型价格</strong></p>\n  <p>36氪获悉，千问正式发布Qwen-Audio-3.1系列语音大模型。本次升级不仅对语音识别（ASR）、语音合成（TTS）和实时语音交互（Realtime）三大核心模型进行了全面进化，更重磅推出了全新的音频创作模型Qwen-Audio-3.1-TTS-Next和音频理解模型Qwen-Audio-3.1-ASR-Next。五款全新的语音模型同时推出，形成了一套覆盖“理解-生成-交互-创作”的完整音频能力栈。为进一步降低用户使用成本，Qwen-Audio全线语音模型价格均下调，其中TTS降价约70%，Realtime降幅约85%，ASR降幅达95%。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>闲鱼：“涉未成年人淫秽”系不实消息</strong></p>\n  <p>9月23日，闲鱼调查结果公布：经全面清查，在平台公开展示信息中未发现淫秽信息，更不存在涉未成年人淫秽信息；近期媒体报道中涉及的违规聊天截图，经核实来自其他平台，并非发生在闲鱼，闲鱼已就相关事件向公安机关报案。平台对利用闲鱼进行违法违规引流的行为零容忍，更不允许侵害未成年人的信息和事件发生。调查结果称，闲鱼依法依规对公开展示信息进行严格管控。针对媒体报道的内容，闲鱼对整个平台进行了多轮自查，在平台内公开展示的信息中未查到淫秽信息，更不存在涉未成年人淫秽内容。（界面新闻）</p>\n  <p><strong>消息称豆包开始收缩对话团队</strong></p>\n  <p>9月22日，据媒体报道，豆包通用Session团队正在减员，规模预计将缩减约一半。人员调整由豆包负责人赵祺推动。报道称，该团队此前约有50人，一度是豆包内规模最大的团队，主要负责豆包的对话（Chat）产品能力，包括策略、评测等工作。此次调整后，部分人员将转岗至豆包商业化、飞书等团队，其余人员将被裁撤。报道内容还提到，负责对话方向的产品后训练团队（Product Posttrain-Chat）也在缩减。（新浪科技）</p>\n  <p><strong>微软、亚马逊、Adobe等集体降价挽留企业客户</strong></p>\n  <p>亚马逊、微软、Figma、Workday等软件企业与云服务商，正面向客户及咨询合作伙伴推出AI产品新折扣方案。客户此前受定价模式变动困扰，对此已疲惫不堪。客户此前上调预算采购Anthropic的Claude Code、OpenAI的Codex等产品，同时削减其他开支，来为这笔新增支出买单。如今企业在选购AI工具时变得更加谨慎。软件厂商改为按照使用量或完成任务数量收取AI服务费，可能推高成本，不少企业对此颇有怨言。（新浪财经）</p>\n  <p><strong>王兴兴再登《财富》40岁以下商界精英榜，张雪、姚顺雨等首次入选</strong></p>\n  <p>9月22日，《财富》中文版发布2026年“中国40位40岁以下的商界精英”榜单，共40位青年商业领袖入选。36岁的宇树科技创始人王兴兴继2023年首次上榜后，今年再度入选；28岁的腾讯首席AI科学家姚顺雨、33岁的语用科技创始人林俊旸，凭借在AI研发领域的突出成就上榜；39岁的张雪，也以张雪机车创始人兼CEO的身份位列其中。（凤凰网科技）</p>\n  <p><strong>严文韬正式入职DeepSeek任CFO</strong></p>\n  <p>据21财经，高瓴创投原合伙人严文韬已正式加入DeepSeek，出任CFO。公开资料显示，这位被梁文锋选中的大将出生于1991年，毕业于复旦大学。2013年至2020年间，他先后任职于腾讯投资、H Capital，2020年加入高瓴创投，后晋升为合伙人。严文韬过往参与投资的代表项目包括字节跳动、智谱、MiniMax、小红书、微牛、极兔等。（21财经）</p>\n  <p><strong>马斯克预测未来世界：20年后可能有1000亿台人形机器人</strong></p>\n  <p>特斯拉CEO埃隆・马斯克接受央视财经专访。谈及机器人，他展望未来美好图景：每个人都能拥有专属机器人，它们可以照料年迈的父母，看护孩童，还能担任孩子的一对一私教，承担各类工作。未来世界，一个人可以操控成百上千台，甚至上万台实体机器人和数字智能体。“我的预测是十年内至少有10亿台人形机器人；未来15年或许达到100亿台；未来20年可能达到1000亿台。”（央视财经）</p>\n  <p><strong>苹果回应iPhone 18 Pro拍照有“绿影”</strong></p>\n  <p>9月23日消息，刚上市不久的iPhone 18 Pro系列近日被多名首发用户曝出存在“绿影”问题。主要表现是拍摄的照片或视频中会出现诡异的绿色斑块或光晕，而相机预览画面和实况视频本身看起来正常。综合多位用户反馈，“绿影”或“绿斑”的出现通常和特定条件有关：多在室内、光线较暗或暖光环境下出现；使用2倍或更高焦段拍摄时更容易出现，用1倍焦段则基本正常；与新iPhone的可变光圈有关，在使用f/1.48大光圈拍摄时问题更明显。就iPhone 18 Pro拍摄出现“绿影”问题，记者以消费者身份咨询苹果官方客服，工作人员对界面新闻表示：“目前还没接到用户反馈相关问题，官网上没有这方面的公告信息，请以官网信息为准。”（界面新闻）</p>\n  <p><strong>宁德时代市值蒸发7000亿，股价较年内高点回撤超35%</strong></p>\n  <p>9月23日，宁德时代（300750.SZ）收报301.00元，跌1.19%，成交额74.44亿元，成交量24.74万手，动态市盈率16.09倍。港股方面，宁德时代H股（03750.HK）收报511.50港元，涨0.89%，总市值2.37万亿港元。自2026年5月7日盘中触及467.34元的年内高点以来，宁德时代A股最大回撤超过35%，A+H股总市值较最高点蒸发超过7000亿元，一度跌破300元创近一年新低。同期上证指数跌5.97%、创业板指跌10.73%，宁德时代跑输大盘。为提振信心，公司9月11日、16日、18日分别耗资2亿元、9.47亿元、4.56亿元用于回购，但收效甚微，截至9月18日累计回购约16亿元，仅为最低回购金额200亿元的约8%。（证券时报）</p>\n  <p><strong>英伟达支持的Starcloud欲成为首个在太空挖币的团队</strong></p>\n  <p>一家获得英伟达投资支持的初创企业计划在2026年年底前在太空搭建比特币挖矿设施。Starcloud公司的第二颗航天器于今年晚些时候入轨后，就会启动加密货币挖矿专用ASIC矿机。Starcloud首席执行官菲利普·约翰斯顿近期在采访中宣称：“我们将成为首个在太空挖掘比特币的团队。”（新浪财经）</p>\n  <p><strong>中国成德国最大汽车进口来源国</strong></p>\n  <p>德国联邦统计局9月21日公布的数据显示，2026年前7个月，德国汽车出口量降至约200万辆，同比减少4.0%；出口额下降8.9%至735亿欧元（现汇率约合5,647.05亿元人民币）。同期，德国进口新车约130万辆，同比增长16.0%，进口额增长12.6%至349亿欧元（现汇率约合2,681.39亿元人民币）。</p>\n  <p>其中，中国首次成为德国最大的汽车进口来源国。今年前7个月，德国从中国进口约17.5万辆乘用车，同比猛增120.9%，占德国进口新车总量的13.8%。这是中国首次在该统计中登顶，此前一年中国仅列第四位。（IT之家）</p>\n  <p><strong>中国央行在香港发行600亿元6个月期人民币央行票据，中标利率1.37%</strong></p>\n  <p>36氪获悉，中国央行在香港发行600亿元6个月期人民币央行票据，中标利率1.37%。</p>\n  <p><strong>韩国计划到2035年将对中东原油依赖度降至50%</strong></p>\n  <p>韩国产业通商资源部周三表示，韩国计划到2035年将对中东原油的依赖度降至50%，以实现能源供应多元化。韩国产业通商资源部称，韩国高度依赖石油进口，2025年其70%的石油供应来自中东，且大部分经由霍尔木兹海峡运输。根据更新后的战略，韩国调整了原油储备计划，目标是到2030年将储备量增加约2000万桶。（新浪财经）</p>\n  <p><strong>英特尔、京东方，接连加码玻璃基板</strong></p>\n  <p>9月22日，京东方董事长陈炎顺在2026年京东方全球创新伙伴大会上宣布，未来五年公司研发投入将超800亿元，采购支出超8000亿元，明确未来一年内将敲定玻璃基钙钛矿器件与玻璃基封装载板两条量产线的投资计划。不止京东方，业界各玩家均采取行动积极布局玻璃基板。据《台湾经济日报》本周报道，英特尔正评估携手光电显示面板大厂友达，推动以Micro LED与玻璃基板为核心的先进封装技术合作。（科创板日报）</p>\n  <p><strong>未来四年“双一流”高校本科招生数还将扩容7.6万人</strong></p>\n  <p>教育部发展规划司司长郭鹏9月23日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，2027年至2030年，“双一流”高校本科招生数还要扩容7.6万人。（21世纪经济报道）</p>\n  <p><strong>中际旭创：9月23日回购85.698万股股份耗资7.95亿元</strong></p>\n  <p>36氪获悉，中际旭创公告，公司于2026年9月23日通过深圳证券交易所回购A股股份856980股，占事件前已发行股份（不含库存股）的0.077%，回购价格区间为每股921.85元-935元，成交总金额7.95亿元，本次回购股份拟持作库存股份。截至2026年9月23日，公司已发行股份（不含库存股）为1109581578股，库存股份为5653063股，已发行股份总数为1115234641股。</p>\n  <p><strong>特朗普名下账户大调仓</strong></p>\n  <p>当地时间9月22日，披露文件显示，特朗普名下账户7月迎来大规模调仓，买入至少4360万美元，卖出至少3560万美元。7月20日，账户分别卖出500万至2500万美元微软（MSFT.US）、亚马逊（AMZN.US）股票，为当月最大单笔交易。同日卖出100万至500万美元甲骨文（ORCL.US）股票，并买入50.001万至100万美元英伟达（NVDA.US）股票。三天后账户小幅回补微软、亚马逊仓位。此外，特朗普当月还交易了马斯克旗下SpaceX（SPCX.US）、特斯拉（TSLA.US）相关标的。</p>\n  <p><strong>软银正接受总额100亿美元债券的认购，以筹集对OpenAI的投资资金</strong></p>\n  <p>一份条款清单显示，软银集团正在就一笔100亿美元的债券发行项目接受投资者认购，以帮助为其对OpenAI的投资提供资金。该条款清单显示，软银计划通过发行3年半期债券筹集10亿美元，5年半期债券筹集45亿美元，以及7年半期债券筹集45亿美元。条款清单显示，潜在投资者已被告知，3年半期债券的发行利率指导区间为8.75%至8.875%，5年半期债券为9.375%至9.5%，10年半期债券为9.75%至9.875%。（新浪财经）</p>\n  <p><strong>美股三大指数集体收跌，热门中概股普跌</strong></p>\n  <p>36氪获悉，9月23日收盘，美股三大指数集体下跌，道指跌0.68%，纳指跌1.13%，标普500指数跌0.75%。大型科技股跌多涨少，谷歌、闪迪、SK海力士跌超3%，亚马逊跌超2%，英伟达、奈飞、英特尔跌超1%，苹果小幅下跌；Meta涨超1%，微软、特斯拉小幅上涨。热门中概股普跌，阿里巴巴跌超4%，富途控股、老虎证券跌超3%，百度跌超2%，爱奇艺、微博、哔哩哔哩、网易、拼多多跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>科建股份北交所IPO顺利过会</strong></p>\n  <p>36氪获悉，北交所上市委员会召开2026年第86次审核会议。审议结果显示，科建高分子材料（上海）股份有限公司符合发行条件、上市条件和信息披露要求。</p>\n  <p><strong>中稀有色：参股公司大宝山公司向香港联交所递交上市申请</strong></p>\n  <p>36氪获悉，中稀有色公告，公司参股子公司广东省广晟大宝山铜业股份有限公司（简称“大宝山公司”）已于9月22日向香港联交所递交了首次公开发行境外上市股份（H股）并在香港联交所主板上市的申请。大宝山公司主要从事铜、硫和其他多金属矿产资源的勘查、采矿、矿石加工、综合利用和销售，拥有华南地区最大的露天采矿场及铜硫专业化选矿配套设施，核心产品涵盖铜精矿、硫精矿及磁硫精矿。截至本公告披露日，公司持有大宝山公司40%股份。</p>\n  <h2>投融资</h2>\n  <p><strong>“谱析光晶”完成数亿元人民币C轮融资</strong></p>\n  <p>36氪获悉，极限环境特种功率芯片及系统企业“谱析光晶”近期完成数亿元人民币C轮融资，新进机构包括浙江嘉合长越、成都创新风险投资有限公司（成都科创投）、上海半导体装备材料产业投资基金、山东财金系基金、贵州国创等10家国资与产业资本。</p>\n  <p><strong>“欧卡智舶”完成数亿C轮融资，半年累计规模达3亿元</strong></p>\n  <p>36氪获悉，海面具身智能公司“欧卡智舶”近日完成数亿C轮融资，半年累计规模达3亿元，本轮由西高投领投，元禾璞华、三元资本跟投。资金将主要用于海面物理AI的技术迭代、船舶通用大脑APAS系统的场景拓展，以及C端水上休闲业务的产品推进。</p>\n  <p><strong>AI通信基础设施公司Bird.com完成4.5亿美元融资</strong></p>\n  <p>9月23日，AI通信基础设施公司Bird.com宣布完成4.5亿美元债务融资，由摩根大通牵头，并推出改造后的Agentic Harness平台，该平台现在让AI代理无需自定义集成即可在Bird网络上发送消息、拨打电话、管理电子邮件，甚至获得自己的eSIM电话套餐。（界面新闻）</p>\n  <p><strong>“息壤开物”完成种子轮及天使轮融资</strong></p>\n  <p>36氪获悉，Physical AI初创公司“息壤开物”连续完成种子轮及天使轮融资，由敦鸿资产领投，华控基金、三花控股、银杏谷资本、泽然资本、本坚基金、上海天使会、标朴投资等知名机构跟投，目前估值达5亿美元。募集资金将主要用于原生物理AI模型的规模预训练、真实物理交互数据建设、核心研发人才引入与场景验证。</p>\n  <h2>酷产品</h2>\n  <p><strong>阿里云首款智能体电脑Qwen Book亮相：搭载Skill键盘阵列、全局AI按键</strong></p>\n  <p>云栖大会上，阿里云旗下AI智能体电脑Qwen Book正式发布。这是一款能自主理解用户意图并不断进化的AI智能体电脑，搭载了Skill键盘阵列、全局AI按键、语音手写笔等多种交互入口和7x24小时执行重度任务的操作空间，解决了AI办公和生活中需要跨应用、跨Agent使用的痛点。（新浪财经）</p>\n  <p><strong>宇树科技完成全球首次全尺寸通用人形机器人全AI驱动自主集群表演</strong></p>\n  <p>9月22日，在第48届世界技能大赛开幕式上，宇树科技19台H2人形机器人与120名舞者同台共舞，上演全球首次全尺寸通用人形机器人全AI驱动自主集群表演。（新浪科技）</p>\n  <p><strong>苹果开发无屏版健康追踪器，瞄准Whoop等竞争对手</strong></p>\n  <p>苹果正在开发一款类似Whoop腕戴设备的无屏健康和健身追踪器。知情人士称，苹果已经探索这一产品类别数月，目前正在开发原型。该项目得到公司高层支持，但苹果尚未决定是否正式推出。该项目目前仍处于早期阶段，公司内部称之为“技术调查”。即使苹果最终决定推出，这款设备也可能要到2028年才会面世。苹果发言人拒绝置评。（新浪财经）</p>\n  <p><strong>Meta推出无摄像头版智能眼镜，引入Muse助手功能</strong></p>\n  <p>9月24日讯，Meta Platforms(META.O)正在扩展其智能眼镜产品线，推出无摄像头版本，并将Muse助手功能引入旗下智能眼镜产品。在周三举行的Connect年度大会上，该公司发布了首款不搭载摄像头的Ray-Ban Meta Audio智能眼镜。同时，Meta还推出了第三代搭载摄像头的Ray-Ban Meta眼镜，以及新款价格更低的Meta品牌智能眼镜。这款主打音频功能的眼镜，为Meta重新探索这一曾因隐私问题引发争议的产品类别提供了机会。Meta无摄像头眼镜起售价为349美元，计划于10月3日开始发货。第三代机型还配备了一个新的“操作按钮”，用户可以对其进行自定义设置，用于执行特定任务，例如启动Muse语音助手。（界面新闻）</p>\n  <p><strong>小米18 Pro系列发布，5999元起售</strong></p>\n  <p>36氪获悉，在小米举行秋季新品发布会上，小米合伙人、集团总裁卢伟冰公布小米18 Pro系列手机售价，5999元起售，发布即开售。小米18 Pro系列全球首发高通新一代骁龙2nm旗舰移动平台，18 Pro、18 Pro Max分别搭载第六代骁龙8至尊版和第六代骁龙8超级至尊版，均采用2nm制程。小米18 Pro系列搭载融入小米MiMo大模型的超级小爱2.0，能自主使用超过260个系统工具。此外，小米18 Pro系列还推出了一款透明特别版，9999元起售。</p>\n  <p><strong>整理丨李琪</strong></p>", "category": "tech", "published_at": "2026-09-24T00:01:26+00:00", "fetched_at": "2026-09-24T02:52:44.680768+00:00", "fingerprint": "b1618718c347f3fe"}, {"source": "36氪 - 最新文章", "title": "商业航天企业拿下近20亿融资，大型可回收火箭计划2027年首飞｜硬氪独家", "url": "https://36kr.com/p/3995830324875401?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪独家获悉，商业航天公司「深蓝航天」完成两轮融资，总规模近20亿元。投资方包括无锡高新区投控集团、锡创投等地方国资，毅达资本、海松资本、上海自贸区基金、卓源资本、万石资本、华福资本等投资机构，宝通科技、宏润建设、尤洛卡等产业资本，及苏州施必牢等产业链企业。</p>\n  <p>本轮资金将重点投向公司目前两大可回收复用运载火箭谱系的研发与商业化、产业化推进；同时，也将大幅推进发动机批产能力建设及发射试验设施等地面设施建设，以及核心人才引进。</p>\n  <p>自成立以来，深蓝航天专注液氧煤油可回收火箭路线。其中，中型运载火箭“星云一号”近地轨道运载能力为4-6吨，完全快速响应整箭包箭发射业务与拼车发射需求；核心产品“星云二号”定位25吨级近地轨道运力，面向大型低轨星座发射需求。其雷霆-RS发动机日前已完成多次100秒、200秒长程试车，单机200秒试车已覆盖飞行全时长。</p>\n  <p>按照规划，星云二号计划于2027年完成首飞试验，未来采用“筷子夹”塔架捕获方案实现一子级回收复用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_a03ece6c27634825993a83ffdf09c3f0@6022551_oswg1097991oswg1515oswg814_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">深蓝航天大型可回收火箭（图源/企业）</p>\n  <p>中国商业航天正在经历一个关键转折，企业从完成技术验证，转向构建工程化交付能力。随着各家陆续完成发动机试车、火箭入轨等关键节点，不仅拓宽了资本对这条赛道的想象空间，行业的评估维度也在发生演进。发动机批产进展与真实订单需求，成为当前业界重点考察的维度。</p>\n  <p>这一转变的底层逻辑，根植于商业航天产业的经济结构。发射成本若无法有效下降，星座建设的商业模型便难以成立。目前，国内民营火箭仍处于成本下探的关键阶段，而低轨星座的组网需求通常需要数百次发射支撑，若成本维持高位，卫星公司的规模化组网将受到实质性制约。</p>\n  <p>可回收技术是打开这个空间的关键。在技术路线层面，深蓝航天的火箭设计从架构之初便以回收能力为关键约束条件。星云一号和星云二号两型可回收火箭的迭代，既提升了运力，也针对不同市场、客户和场景给出了不同的载荷运输方案。可回收技术突破后，发射频率和可靠性有望提高，成本也能降低。</p>\n  <p>星云二号一子级采用11台雷霆-RS发动机并联方案。这一方案的核心逻辑是以发动机数量换取回收段的推力调节精度。起飞段需要大推力，回收段则需要小推力，这是可回收火箭设计中的一对根本矛盾。</p>\n  <p>单台推力更大的发动机方案在起飞段没有障碍，但在回收段，即使将推力节流至最低档位，总推力仍可能大于箭体重量，导致火箭无法稳定减速，甚至出现“推着走”而非“落下来”的情况。</p>\n  <p>而星云二��一子级采用11台130吨级发动机并联后，回收时只需点燃其中1到3台，总推力可以精细匹配着陆工况需求，推力调节的粒度足够细，才能实现稳定的软着陆。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_a2e150100cfd4ac8a20c93b5f6989606@6022551_oswg747908oswg1172oswg653_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">雷霆-RS发动机试车（图源/企业）</p>\n  <p>多机并联是大液体火箭公认的工程难点。从单机试车到11机协同工作，中间需要跨越的远不仅仅是发动机技术本身，更是系统集成能力，如何让11台发动机在同一个箭体上、同一个时序里实现协同工作。</p>\n  <p>同步起动是第一个门槛。工程上采用分组、分时序起动策略，每台发动机的起动时序与阀门响应时间需要精确匹配，任何一台的延迟都会导致推力不对称。</p>\n  <p>故障隔离的难度在于判断窗口极短，系统需要在毫秒级内完成识别、隔离、推力重构三个动作，箭上控制系统同步完成剩余发动机的推力补偿与姿态配平。</p>\n  <p>推力均衡则涉及贮箱与输送系统的共用问题，各条管路流阻不同，需要发动机具备宽入口压力工作能力；同时，多台同型号发动机同时工作带来的共振风险与热耦合效应，需要在结构设计与控制策略上主动规避。</p>\n  <p>这意味着，11台发动机需要在起飞、减速、着陆全过程中保持推力输出的协调一致，任何单台偏差都要求系统在毫秒级内完成判断与补偿。这是星云二号首飞前必须通过的系统级验证节点。</p>\n  <p>动力系统的协同验证是起飞段的核心命题，而回收段则面对另一套完全不同的工程约束。</p>\n  <p>星云二号当前聚焦陆地塔架捕获方案，计划启动“筷子夹”试验，用塔架机械臂捕获返回箭体，箭上只留捕获接口。</p>\n  <p>深蓝航天创始人霍亮告诉硬氪，国内商业航天现阶段最突出的现实卡点，主要集中在人才和资金两大维度。这是行业性难题，并非某一家公司的个体困境。</p>\n  <p>人才层面，商业航天对工程经验的要求极高，但真正经历过完整型号研制、试车与飞行迭代的人才极为稀缺。这与行业所处的阶段直接相关，由于国内商业航天起步时间不长，人才供给难以跟上行业扩张速度。当前，深蓝正加快从成熟型号团队中引进核心工程人才，并以团队集聚的方式缩短经验积累周期，提升有限人才团队的整体研发效率。</p>\n  <p>资金层面，商业航天本质上是一场长周期、重投入的工程竞赛，从发动机试车到火箭飞行验证，每个环节都需要持续的资金支撑，且回报周期远长于一般制造业。这意味着，企业如果没有清晰的产品路径和节奏，资金很容易被拖散。深蓝以星云一号与星云二号两款互补产品，覆盖从小型到大型组网的发射需求，同时推进发动机批量试车交付，让每一笔投入都能对应到具体的工程节点上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_a23288c0e9d84fb0907100eb0dcaf758@6022551_oswg1726280oswg1920oswg1080_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">深蓝航天“星云-1”火箭一子级200秒长程动力系统试车（图源/企业）</p>\n  <p>但工程节点能否按期推进，还取决于这些环节是否受外部条件制约。试车排期、零部件供应、制造周期，任何一环依赖外部，都会直接影响资金和人才的转化效率。</p>\n  <p>对此，深蓝航天选择自建关键环节，以降低外部依赖对研制节奏的影响：依托3D打印等先进制造工艺缩短火箭研制周期、加快迭代速度；同时前置布局试车设施与相关配套资源，让资金投入集中沉淀为可复用的工程资产，而不是消耗在外部依赖上。这样一来，人才与资金的投入才能沿着一条自主可控的路径，稳步转化为型号研制与批产能力。</p>\n  <p>基于上述工程与产业能力建设，沿着这条能力主线，深蓝航天的中长期节奏大致分为三步。</p>\n  <p>第一步，把可回收火箭从验证推向落地。从低空垂直起降试验起步，逐步走向更高高度、更接近入轨级的回收验证，同时突破发动机批产与供应链稳定两个卡点。目标是让火箭从“能打”走向“能稳定打、能回收、能复用”。</p>\n  <p>第二步，形成稳定的发射服务能力。可回收技术跑通之后，逐步提升发射频次与履约能力，在承接国家任务和星座组网需求的同时，拓展商业发射服务市场。</p>\n  <p>第三步，向更上游的太空基础设施能力延伸。当发射成本因为复用而出现结构性下降，深蓝航天才有能力参与更广泛的太空产业分工，把可回收火箭从一项技术能力，变成一套可复制的工程体系和商业闭环。</p>\n  <p>当前，行业分水岭不在于单次试车或首飞成功，而在于能否把可回收、批产和供应链变成稳定的工业能力。可回收是降本的关键路径，但多机并联、海上溅落、塔架捕获，都还需要系统级验证和持续迭代。</p>\n  <p>接下来各家比拼的，将是谁能把发射成本、交付节奏和履约能力一寸寸压下来、稳下来。这条路上，所有玩家正在加速爬坡。</p>\n  <p><strong>以下为硬氪与深蓝航天创始人霍亮的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：星云二号定位25吨级近地轨道运力，面向大型低轨星座发射需求。为什么一子级选择11台雷霆-RS并联，而不是少台数、单台推力更大的发动机方案？在重量、可靠性、研制周期之间如何权衡？</strong></p>\n  <p><strong>霍亮：</strong>选择11机并联，本质上不是单纯为了起飞推力，而是围绕回收工况做的一次架构选择。更准确地说，是用发动机数量换取回收段的推力调节精度和故障冗余。</p>\n  <p>单台推力更大的方案，在起飞段没有障碍，甚至架构更简洁。但可回收火箭真正的约束在回收段：一子级返回时，箭体重量远小于起飞重量，发动机需要在很低的推力水平下稳定工作。如果采用少台数、大推力方案，即使把发动机节流到最低档位，总推力仍可能大于箭体重量，导致火箭无法稳定减速，甚至出现“推着走”而不是“落下来”的情况。这个矛盾，很难靠控制策略绕过去。</p>\n  <p>11台130吨级发动机并联后，回收时只需点燃其中1到3台，总推力就能精细匹配着陆工况。推力调节的粒度足够细，才能实现稳定的软着陆。这是星云二号选择11机并联的核心逻辑。</p>\n  <p>我们注意到，国外SpaceX公司的星舰火箭一级使用了多达33台发动机，目前还在计划增加发动机数量；相对空间（ Relativity Space ）公司的Terran R火箭一级，使用了13台 Aeon R发动机。这标志着，回收火箭一级采用多台发动机是国际上新型的大型火箭普遍采用的方案。</p>\n  <p>至于重量、可靠性和研制周期之间的权衡，重点在于用系统复杂度换取回收能力和冗余可靠性，再用制造工艺的突破去消化研制周期压力。</p>\n  <p>11台并联确实增加了系统集成难度，但它同时带来两个关键收益：一是回收时只点1到3台就能获得合适的着陆推力；二是单台发动机出现故障时，剩余发动机仍有推力补偿空间。多发动机组成的系统，能够提供更多样的动力组合，为发射和回收过程提供更加优秀的冗余。</p>\n  <p>理论计算表明，如果能够在发射上升和回收飞行段，实现大于2台发动机的冗余，动力系统的可靠性有望达到100%。</p>\n  <p>为了避免并联带来的复杂度拖长研制周期，雷霆-RS大量采用3D打印一体成型工艺，把发动机制造从“精密装配”转向“批量生产”，用制造效率对冲系统复杂度的代价。</p>\n  <p>所以，这不是简单的“多台更保险”，而是在起飞推力、回收节流、故障冗余和研制节奏之间，选择了一条更符合可回收火箭工程逻辑的路线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260923/v2_52b965b56c4e4510bacd0012002737ac@6022551_oswg2812531oswg1920oswg1080_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">山东济南液体火箭发动机、动力系统测试平台基地（图源/企业）</p>\n  <p><strong>硬氪：当前业界对商业航天的分析逻辑发生明显切换，资本不再单纯为技术里程碑买单，更看重订单和批产交付能力。深蓝行业作为一线参与者，观察到市场对液体可回收火箭的估值判断标准，发生了哪些实质性变化？</strong></p>\n  <p><strong>霍亮：</strong>这个变化确实很明显。近两年一级市场对液体可回收火箭的估值判断，正在从“看技术节点”转向“看交付确定性”。但这不是一刀切，而是一个渐进过程——资本的估值锚点，正从技术里程碑逐步向交付能力迁移。</p>\n  <p>不过客观看，国内液体可回收火箭整体仍处于验证期，行业还没有进入规模化批产交付阶段。所以资本并不是要求企业现在就拿出大批量交付记录，而是要求企业证明自己具备走向交付的能力和路径：发动机批产有没有实质推进，订单是不是真实需求。</p>\n  <p>有清晰交付路径的企业，资本愿意给耐心；只有技术叙事、看不到交付路径的，资本会越来越谨慎。</p>\n  <p>从深蓝航天的角度理解，技术里程碑是入场券，交付能力才是估值的底座。公司目前按计划推进可回收技术验证和发动机批产准备，同时持续积累订单储备和履约能力。行业阶段决定了现在不可能人人都有批产交付记录，但资本需要看到你离交付有多近、路径有多清晰。</p>\n  <p>我们要做的就是把这条路径一步步走实，用试验结果和发射记录说话，而不是提前承诺交付数字。</p>\n  <p><strong>硬氪：SpaceX上市的底层逻辑不只是火箭，而是“发射+星座运营”的闭环。国内民营火箭企业大多只聚焦运载环节，这种业务结构差异，会给资本化路径带来哪些约束？</strong></p>\n  <p><strong>霍亮：</strong>这个差异带来的约束是当前国内的产业发展状态带来的。SpaceX的商业估值不仅仅在发射本身，星链贡献了主要收入，火箭更像整个闭环的入口。而国内民营火箭企业大多还处在如何可靠交付高可靠、低成本的规模性运力方面，这只有液体运载火箭能够做到，深蓝航天也专注发射服务这一环节，这是行业现阶段比较普遍的状态。</p>\n  <p>从资本化角度看，发射服务模型清晰，并且市场需求非常明确。我们注意到两个事情：一是特朗普签署文件，要把美国的发射次数提升到每年1000次；第二是SpaceX公司正式向国际电联提交了约20万颗卫星的发射计划。这都说明了围绕太空资源的开发正在加速，太空运输行业未来的前景是快速增长并且明确的 。</p>\n  <p>深蓝航天现在的思路，是先把可回收火箭的交付能力跑出来。<strong>我们不会盲目对标SpaceX的“发射+星座服务”，当前需要聚焦在火箭发射环节，实现高可靠、低成本、高频次交付运力和发射服务，</strong>发射之外的成长路径和未来应用场景，是深蓝航天实现这一目标之后的问题</p>", "category": "tech", "published_at": "2026-09-24T01:00:00+00:00", "fetched_at": "2026-09-24T02:52:44.680761+00:00", "fingerprint": "ccb5881216cf80ae"}, {"source": "36氪 - 最新文章", "title": "AI新材料公司获数千万天使轮融资，已合作固态电池与化工龙头丨36氪首发", "url": "https://36kr.com/p/3996737880559493?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_ef73e43e714f4365831825638ad8f4d2@6221844_oswg1656133oswg1923oswg817_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3700</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，AI for Materials公司——索格智算（上海）科技有限公司【以下简称“索格智算”】近期已完成数千万元天使轮融资。本轮由复星创富领投，南通产控思源人工智能先导基金、云启资本、中赢创投跟投，紫竹科投等老股东追加投资。资金将主要用于新材料自动化研发管线持续研发与迭代、实验室建设、研发团队扩充及产业人才引进，推动国产高端材料自主可控。</p>\n  <p>索格智算成立于2025年，是一家专注于利用原创AI计算引擎等融合技术，驱动新材料研发的硬科技公司。公司聚焦国家战略需求下的新材料设计关键难题，通过材料原子大模型+高性能仿真+干湿实验闭环，打通跨尺度研发链路，推动核心技术国产化突破与关键材料自主可控。</p>\n  <p>创始人、首席科学家徐振礼是上海交通大学特聘教授、人工智能新材料研究中心主任，国家杰出青年科学基金获得者。核心团队拥有数学、人工智能、材料交叉背景。公司已组建30余人的研发团队，下设AI算法、应用技术、智能体、量子计算四个研发中心。顾问团覆盖AI算法、材料研发、产业资源，形成了「基础研究＋产业落地」的双引擎架构。</p>\n  <p>新材料研发，为什么需要AI？</p>\n  <p>硬氪了解到，传统材料研发依赖试错法，一个新材料从实验室发现到产品化落地往往需要数十年时间，研发成本高昂且机理不透明。在新能源、精细化工等产业加速向更高代际演进的背景下，现有材料供给已难以匹配其对下一代高性能材料不断升级的要求，关键材料自主保障能力存在明显缺口。</p>\n  <p>但用AI加速材料研发，也有难题。原子之间的相互作用，近处好算，远处难算。传统AI模型靠“消息传递”一层层传，算得慢、成本高，而且换个材料就不太管用。索格智算的突破，就是从底层算法解决这个问题。</p>\n  <p>索格智算的技术体系围绕三个原创算法展开：</p>\n  <p>SOGNet，解决“算得准”的问题。传统模型只能看近处，SOGNet能在傅里叶空间直接学习远距离原子关联，自适应学习不同距离的衰减特征。相关研究发表于Phys. Rev. Lett.（2025），并获编辑推荐。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_811f720918314784a96eb9f58482cde5@6221844_oswg728829oswg1043oswg586_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">基于SOGNet构建的材料原子大模型（图源/企业）</p>\n  <p>随机分批算法，解决“算得快”的问题。传统算法万核并行效率只有20%-30%，随机分批算法能做到95%以上，计算速度提升数十至百倍，让大规模材料模拟成为可能。该工作获上海市自然科学一等奖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_bc753fb669d04a1f86e31a7e18b74036@6221844_oswg779074oswg1068oswg601_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">新材料专用模拟器 NanoTitan Ultra（图源/企业）</p>\n  <p>R2D多场耦合模型，解决“算得真”的问题。传统电化学建模依赖均质假设，R2D模型突破了这一框架，能够精准捕捉电池材料在充放电循环中的多物理场耦合演化过程——包括离子传输、界面反应、应力演化与失效机制等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_84489d2f8ae84ff783d27af48b56732d@6221844_oswg571483oswg1080oswg437_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">下一代电池自动化仿真软件R2DPack和AI代理模型R2DPack-ONet（图源/企业）</p>\n  <p>基于这些算法，索格智算形成了自研产品矩阵，打通材料设计、计算验证、工业仿真和自主研发全链路：面向锂电、高分子等垂直领域的SOGNet原子大模型、高性能模拟器NanoTitan、材料器件仿真平台R2DPack，以及自主研发智能体SOG Omni。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260924/v2_759404ea84024b3badde8a40abcdb41e@6221844_oswg587955oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">SOG Omni 材料研发自主智能体（图源/企业）</p>\n  <p>其中锂电材料垂域模型SOGNET-Battery是面向锂电领域的核心产品。锂电材料涉及离子迁移、界面演化、涂层稳定性等复杂过程，传统模型很难同时兼顾精度和效率。SOGNET-Battery的思路是：用专业筛选和自主生成的锂电数据训练模型，让模型“近处看得准、远处看得到、体系放大仍算得快”。</p>\n  <p>实测表现来看，在六类锂电材料上，SOGNET-Battery用更小的参数规模，精度超过了参数更大的通用势函数模型。更关键的是迁移能力：在新体系上只需少量数据微调，就能快速适配。以Li-Li₆PS₅Cl体系为例，只用359个构型微调，原子力误差降低约68%，能量误差降低约83%。推理速度上，SOGNET-Battery比通用模型提升超过80%，同样的算力能处理更多原子构型。</p>\n  <p>目前，公司已将上述核心技术和产品沉淀为可复用的材料设计自动化管线，形成了持续迭代能力。在某固态电池企业电芯设计过程中，团队利用R2DPack开展电芯级多物理场仿真，将材料参数、界面特性与电芯结构进行耦合，实现对电芯性能的快速预测与设计优化，显著减少传统电芯设计对反复实验验证的依赖，加速固态电池电芯研发迭代，面向车载实时计算需求，在主流车载芯片同等算力条件下实现毫秒级响应，为在十万级新能源汽车主流车载芯片上的轻量化部署与实时预测奠定基础。</p>\n  <p>对于某化工上市企业高分子材料的智能发现与快速筛选，团队利用SOG Omni推荐满足企业需求的候选配方，再由多尺度计算引擎进行精准预测和筛选，相关结果已经进入湿实验验证。</p>\n  <p>此外，索格智算在国家重大战略需求的新材料设计领域也开始布局，包括稀土永磁、辐射屏蔽材料；与头部企业、研究院所共建人工智能研发与应用系统，助力关键战略材料自主可控。</p>\n  <p>未来规划方面，索格智算的目标是通过自主可控的产品技术，实现高价值新材料设计能力突破。产品上，公司计划在锂电、化工高分子领域搭建全流程模拟自动化平台，从智能体出发，通过AI推荐材料，再进行大规模计算、仿真和筛选，最后在器件层面仿真，打通整套流程；同时在高分子、化工等领域推出自动化计算筛选平台。</p>\n  <p><strong>以下为硬氪与公司创始人、首席科学家徐振礼的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：索格智算的核心技术壁垒是什么？</strong></p>\n  <p><strong>徐振礼：</strong>我们的核心壁垒是原创算法。SOGNet解决长程相互作用势函数瓶颈，随机分批算法突破微尺度计算扩展性瓶颈，R2D多场耦合模型实现高保真计算。</p>\n  <p>这三个算法不是简单的工程优化，而是从底层数学出发的原创突破。基于这些原创算法，索格智算打通了数据—模型—仿真—实验完整闭环。</p>\n  <p><strong>硬氪：AI for Materials赛道竞争越来越激烈，索格智算如何应对？</strong></p>\n  <p><strong>徐振礼：</strong>材料领域细分方向非常多，也存在不同技术路线，商业机会很多。我们的优势在于算法效率与精度。未来大家都在竞争算力利用率，投入同样的算力，算法效率更高、精确度更高，预测能力就更强。</p>\n  <p>另外，我们提供软硬件一体化产品，进一步发挥算法和硬件协同加速的效果，并且充分适配材料企业对于本地部署的需求。我们也在做管线，从智能体出发，通过生成式人工智能推荐材料，再进行大规模计算、模拟、仿真和筛选，最后在器件层面仿真，打通整套自动化流程。</p>\n  <p><strong>硬氪：公司未来的商业化路径怎么走？</strong></p>\n  <p><strong>徐振礼：</strong>我们分两个层面。一是以概念验证阶段的联合研发作为合作起点，在高价值材料方向率先跑���技术可行性，再向纵深布局；二是深化战略合作，锚定高价值关键材料赛道，重点布局光刻胶、半导体封装胶粘材料等细分领域，纵深推进新材料分子设计、配方开发与产线落地。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>复星创富：</strong>AI for Materials作为人工智能与先进材料深度融合的重要方向，具备颠覆性变革材料研发范式的战略价值。</p>\n  <p>我们非常看好索格智算，核心在于其在“底层算法—算力平台—产业应用”上的完整技术实力。依托创始人徐振礼带领的计算数学、人工智能与材料工程交叉学科顶尖团队，公司围绕材料长程界面精准模拟等核心难题形成了SOG-Net高斯和神经网络、RBMD随机分批分子模拟等原创技术，并探索出软硬件协同的产品化路线。我们认为，这种从底层核心技术出发，进一步向产业场景延伸的能力，是AI for Materials 企业形成长期竞争壁垒的重要基础。公司已经在锂电、稀土永磁、半导体等关键产业领域展现出明确的应用价值，正处于从技术突破向产业规模化落地的关键跨越期。</p>\n  <p>未来，我们期待与索格智算共同推动AI与材料科学的深度融合，支持公司持续强化核心技术、拓展产业应用、推动国产材料开发基础设施进一步实现自主可控，并成长为AI for Materials领域具有长期影响力的标杆硬科技企业。</p>\n  <p><strong>云启资本：</strong>AI for Materials 是我们持续关注的 AI for Science 关键方向。索格智算以原创算法重构材料研发范式，徐振礼教授领衔的交叉学科团队已与上海交通大学共建人工智能新材料研究中心，并在头部电池企业研发体系中落地应用。我们期待公司持续把原创算法转化为产业可复用的研发工具，让 AI for Materials 真正进入从实验室突破到产线落地的关键跨越期。</p>\n  <p><strong>南通投管：</strong>我们看好AI与物理计算深度融合对材料研发范式的重塑，也看好索格智算从底层算法创新走向产业应用的潜力。材料智能设计的关键，在于兼顾复杂体系的预测精度与大规模模拟的计算效率。索格智算围绕这两项核心能力形成了具有辨识度的技术布局：SOG-Net通过可学习的高斯和表示刻画长程相互作用，补充短程机器学习势对远距离作用描述的不足，为复杂材料体系提供更完整的物理建模能力；随机分批算法则通过随机采样降低相互作用计算开销，并在RBMD分子动力学平台中实现工程化，提升大规模模拟的效率与可扩展性。两者分别从建模精度与计算效率出发形成协同，为材料筛选、性能预测及机理研究提供支撑。依托团队在应用数学、机器学习与高性能计算领域的积累，以及在电池、先进合金和半导体等场景的持续探索，我们期待索格智算将原创算法优势转化为可复用的研发工具和行业解决方案，帮助产业客户缩短研发周期、降低试错成本，推动AI驱动的材料创新落地。</p>\n  <p><strong>中赢创投：</strong>徐振礼教授为国家杰青，深耕交叉领域20余年，学术影响力深远。已组建一支兼具应用数学、AI、化学、材料背景的交叉团队，在算子学习、机器学习势与大规模分子模拟领域积累深厚。尤其团队以SOG-Net长程势函数实现底层突破，打通了从微观到宏观的闭环路径，这种“算法+工程”能力是AI for Science赛道最为稀缺的壁垒。我们期待索格能持续将技术突破转化为可规模化产品，成为新材料研发范式变革的重要推动者。</p>\n  <p><strong>紫竹科投：</strong>索格智算是我们在AI+材料赛道重点布局的硬科技项目。AI赋能新材料研发已经成为国家战略方向，高性能材料仿真平台是国内新材料产业突破的重要底座。索格智算来自上海交大和紫竹共同成果转化代表项目，团队已逐步实现前沿计算科学算法向AI赋能行业的落地转化。公司直击国内材料研发仿真精度不足、大规模计算效率低下的行业痛点，覆盖算法软件、垂域大模型、纳泰软硬件一体机完整产品矩阵。期待公司持续打磨全栈AI材料研发解决方案，成为驱动新材料前沿探索与全链路交付的核心引领者。</p>", "category": "tech", "published_at": "2026-09-24T01:32:18+00:00", "fetched_at": "2026-09-24T02:52:44.680751+00:00", "fingerprint": "058ce2a7a5e08408"}, {"source": "36氪 - 最新文章", "title": "从地下8000米到机器人高温关节，清华系特种功率芯片公司完成数亿元C轮融资｜36氪首发", "url": "https://36kr.com/p/3996805864312961?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>36氪获悉，极限环境特种功率芯片及系统企业--杭州谱析光晶半导体科技有限公司（以下简称“谱析光晶”）近期完成数亿元人民币 C 轮融资，新进机构包括浙江嘉合长越、成都创新风险投资有限公司（成都科创投）、上海半导体装备材料产业投资基金、山东财金系基金、贵州国创等10 家国资与产业资本。</p>\n  <p>本轮融资将主要用于第四代半导体氧化镓芯片迭代、230℃ 级高温芯片模组产能扩建、机器人高温关节研发、太空算力与可控核聚变电源预研等。</p>\n  <p>36氪了解到，谱析光晶公司成立于2020年。2025年，公司营收已实现2.3亿元，是赛道中少有的实现盈利的企业。</p>\n  <p>2020年前后，功率半导体开始兴起，大量企业进入新能源汽车、光伏和储能等功率半导体市场。谱析光晶没有跟进通用市场的价格竞争。</p>\n  <p>谱析光晶选择的是其中更特别的一类市场——应用于极限环境的特种功率芯片及系统。</p>\n  <p>与CPU、GPU负责运算不同，功率芯片会承受较大的电压和电流。而功率越大，对效率、散热和可靠性的要求也越高。</p>\n  <p>除了承受大功率，特种功率芯片还要应对高温、辐射、狭小空间等极端条件。</p>\n  <p>谱析光晶创始人兼CEO许一力称，目前产品最高可耐受约250℃以上的环境高温，同时强调同功率下更小的体积和重量、更低的自身发热，以及恶劣环境下的可靠性。</p>\n  <p>谱析光晶最先切入的市场是深地能源勘测。</p>\n  <p>石油勘探设备深入地下8000米甚至更深后，地球内部越来越热，环境温度可以超过200℃。与此同时，井下钻具内部空间有限，功率芯片系统既要耐高温，又要尽量压缩体积和自身发热。</p>\n  <p>“环境已经两三百度了，你自己如果还发热，里面可能就是三四百度。”许一力说。</p>\n  <p>36氪了解到，让功率系统在200℃以上工作，仅切换耐高温的芯片并不够。电阻、电容、变压器、基板和封装材料都可能率先失效，只要有一处失效，整个系统就崩溃。</p>\n  <p>谱析光晶因此开发了HS-MCM平台技术，将特种功率芯片以及驱动、反馈等外围电路进行全密闭混合封装。其中，不少元器件甚至没有成熟供应链。</p>\n  <p>2023年开始，谱析光晶开始将眼光瞄准万米太空外的商业航天，并开始切入机器人特种关节等市场。</p>\n  <p>以机器人为例，要跑得更快、跳得更高，关节需要更大的瞬时功率，但体积和重量不能随之增加。功率提升后，发热也是另一个问题。</p>\n  <p>在炼化、钢铁、电解铝等工业场景中，环境温度本身可能已经达到六七十摄氏度，关节工作后内部发热，温度还可能进一步超过100℃。普通电子系统长期工作在这种环境中，可靠性会明显受到影响。</p>\n  <p>因此，谱析光晶从高温工业机器人关节切入，利用自身在高温、低发热和小型化上的积累开发关节系统模组；随着机器人对高功率密度的要求提高，公司也开始向更多常规机器人场景延伸。</p>\n  <p>下一步，谱析光晶还准备把这套特种技术继续向外延伸。今年下半年，公司开始拓展AI算力中心的电源转换系统。也在研发可控核聚变电源、大功率无人机等新兴应用方向。</p>\n  <p>C 轮之后，谱析光晶业务将继续延展，进行第四代半导体芯片的研究，实现“SiC+氧化镓”混合功率模块产品大批量出货，成为业内首家横跨第三代和第四代半导体的公司；同时开展AI 算力中心算电协同业务、太空算力能源OS和聚变电源固态化等前沿研究。</p>\n  <p>团队方面，谱析光晶由四位清华大学电子系1998级本科同班同学联合创立。创始人兼CEO许一力为清华电子系本硕、中组部“万人计划”科技创业领军人才，负责公司整体战略与技术方向。CTO杨琦曾在斯伦贝谢工作15年，长期从事井下极高温系统设计，具备极端环境电子系统研发经验。CMO李鑫曾任职于中国电子体系，长期负责高端电子装备销售与市场，积累了能源、航天等领域的客户资源。</p>\n  <h3>CEO对谈</h3>\n  <p>36氪：公司早期做的是小批量、高单价的特种产品，现在开始扩大产线。这个阶段最大的变化是什么？</p>\n  <p>许一力：业务做到一定规模确实会不一样。客户订单大了，会来验厂，看你的产线、设备、生产制度和品控。这时候已经不是“这个东西能不能做出来”的问题，而是产品的良率、一致性问题。</p>\n  <p>研发可以让工程师想办法解决问题，但生产不能太灵活。每一个工序怎么流转，东西放在哪里，材料怎么管理，都要规定得非常细。</p>\n  <p>规模化以后，最大的挑战其实是生产一致性，我们会把很大一部分资金放到产线的规范化和扩建上。</p>\n  <p>36氪：从石油勘探、机器人，到现在开始做算力中心，这些行业看起来差异很大。你们怎么判断一项技术能不能复制到新的市场？</p>\n  <p>许一力：首先底层是可以复用的，因为我们做的都是功率芯片和功率系统。不同领域会有不同的功率、电压、电流要求，但大的技术原理不会发生特别大的变化。</p>\n  <p>我们看一个新行业，首先看它有没有我们擅长解决的问题。比如能源勘探是高温、小空间；机器人既要大功率，又不能把关节做得很大、很重，还要控制发热；算力中心也是一样，功率越来越大以后，电源和散热都会变得越来越重要。</p>\n  <p>我们不是看到一个市场大就进去，而是先看我们的“特种性”能不能发挥出来，然后再看这个市场够不够大。</p>\n  <p>我觉得“功率越来越大，体积不能大，自身发热量不能大”，这是长期不会变的需求。只要这个矛盾存在，我们积累的技术就有机会往新的场景延伸。</p>", "category": "tech", "published_at": "2026-09-24T02:41:55+00:00", "fetched_at": "2026-09-24T02:52:44.680736+00:00", "fingerprint": "0618231e0b406af1"}, {"source": "少数派", "title": "Here Wallpaper：把喜欢的地图做成壁纸", "url": "https://sspai.com/post/114211", "summary": "家附近的街道、旅行时喜欢上的一座城市、或者喜欢的海岸线和岛屿，都可以拿来做壁纸。<a href=\"https://sspai.com/post/114211\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-23T02:19:17+00:00", "fetched_at": "2026-09-24T02:52:43.221735+00:00", "fingerprint": "0e2a1fb9e2381518"}, {"source": "少数派", "title": "具透 | 新「环境」、新变化，visionOS 27 值得关注的新特性", "url": "https://sspai.com/post/114901", "summary": "Apple于9月15日凌晨正式发布了iOS27、iPadOS27、macOS27GoldenGate和watchOS27、visionOS27等系统的正式版本。其中，visionOS27加入了Siri ...<a href=\"https://sspai.com/post/114901\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-23T07:30:57+00:00", "fetched_at": "2026-09-24T02:52:43.221728+00:00", "fingerprint": "0f77f832218cf1cc"}, {"source": "少数派", "title": "社区速递 159 | 便携卡片充电器与库克十五年改变生活的产品", "url": "https://sspai.com/post/114904", "summary": "除了首页时间流和侧栏的精选展位，少数派 Matrix 社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启 Matrix 周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。<a href=\"https://sspai.com/post/114904\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-23T09:02:00+00:00", "fetched_at": "2026-09-24T02:52:43.221721+00:00", "fingerprint": "192ebad4f31043b2"}, {"source": "少数派", "title": "派早报：小米召开秋季新品发布会、千问发布 Qwen-Audio-3.1系列模型等", "url": "https://sspai.com/post/114913", "summary": "Amazfit 推出智能手表 T-Rex Dual Solar、雷蛇推出灰鲭鲨 X 游戏音箱等。<a href t a less disastrous path forward. On Monday, the company announced a new independent panel of mathematicians tasked with advising it and other AI companies on their interactions with mathematical research and the wider [&#8230;]", "category": "tech", "published_at": "2026-09-23T00:17:17+00:00", "fetched_at": "2026-09-23T03:01:20.769084+00:00", "fingerprint": "a86391fe9862bd89"}, {"source": "36氪 - 最新文章", "title": "2026 East Forward出海大会：全球化到达下一站，中国企业如何走得更远", "url": "https://36kr.com/p/3994316084214534?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_095a79a0b8f84838987f5d6050deaf66@6301044_oswg370065oswg1125oswg633_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>2026年，出海的关键词正在从“增量”转向“经营”，企业关注的重点也从抢占机会，转向本地团队、供应链、渠道、品牌与合规等一整套长期能力的建设。36氪以“潮起之时，靠岸相见”为主题举办2026 East Forward出海大会，邀请来自消费、科技、制造等不同领域的出海企业，以及投资机构与全球化服务商，共同讨论企业走出去之后，如何在复杂多变的全球市场中建立更稳固的经营能力，找到长期经营与增长的路径。</p>\n  <p>2026年，中国企业出海正在从“寻找增量”，走向更长期的全球经营。</p>\n  <p>过去几年，汽车、新能源、跨境电商、AI应用……越来越多中国企业进入全球市场。然而，一次市场突破、一轮业绩增长，并不意味着全球化已经完成。当出海从试水走向常态，真正的挑战也开始从“怎么出去”，转向“怎么留下来”。规则与市场环境持续变化，供应链、渠道和本地团队需要重新搭建，品牌也要面对不同文化和消费习惯的考验。过去行业反复讨论“要不要出海”，今天更需要回答的是：走出去之后，企业能不能活下来、扎下去、稳定经营，并最终形成自己的全球竞争力。</p>\n  <p>9月17日，以“潮起之时，靠岸相见”为主题的2026 East Forward出海大会在上海举行。来自新能源汽车、跨境电商、AI与智能硬件、内容出海、消费电子及新消费品牌等领域的企业，与投资机构及物流、金融、营销、人力、并购等全球化服务商汇聚现场，从共同面对的经营难题，到不同产业各自的出海路径，一起讨论中国企业全球化的下一程，如何走得更稳、更深，也更远。大会开场，36氪副总裁谢作强开幕致辞中提到，出海对于中国企业并不陌生，传统意义上的“出海卖货”，中国企业早在过去几十年就已经能够成熟应对，当下真正的难题是——品牌能否在海外立得住，账在当下能否算得清、经营能否应对各种治理、合规挑战。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_56e8bb093cda440daeba2e877b655020@6301044_oswg488179oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪副总裁谢作强开幕致辞</p>\n  <h2><strong>从“走出去”到“活下来”，出海进入长期经营</strong></h2>\n  <p>企业真正进入海外市场之后，最先遇到的一道必答难题往往不是增长，而是经营。</p>\n  <p>长江商学院战略学教授、副院长滕斌圣“从走出去到活下来”为题的演讲，将中国企业出海放在“全球化2.0”的变化中重新审视。过去相对稳定的全球产业链正在转向更加复杂的网状结构，企业不能仅是产品出海，还需找准定位，在贸易壁垒与地缘政治之下分散风险，并围绕自身特点，在进入路径、核心竞争力、本地生态、创新能力和合规方面建立长期经营能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_8c3bf806b0354b11a31888459659fb22@6301044_oswg547519oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">长江商学院战略学教授、副院长滕斌圣 “走出去到活下来”主题演讲</p>\n  <p>这一问题也延伸到“从出口到扎根”的圆桌讨论中。产品能卖出去，不代表真正进入市场一一如何理解当地用户、建立本地供应链、形成品牌认知、管理跨区域团队，才是企业进入海外之后绕不开的课题。邓白氏中国区产品和解决方案总监、出海业务负责人谢惠淇提到，企业出海时容易低估当地市场的变化速度，团队初具规模时可以跟踪客户信息，但随着规模扩大，分散在各部门的销售、财务、售后信息缺少整合，就开始造成经营错判与资源错配。从目标市场选择、合作伙伴识别，到客户信用、账期和回款风险管理，企业需要建立持续更新、可信的商业数据而非仰仗个人判断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_a73ada05aba54c46afad92fbb9dc6ae5@6301044_oswg74278oswg1080oswg498_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">邓白氏出海业务负责人谢惠淇在“从出口到扎根：中国企业如何完成海外本地化？”圆桌会议上发言</p>\n  <p>随着企业经营逐渐成熟，市场和渠道不断增加，AI正在成为商业体系中的新入口。Shopify亚洲商务负责人Vivey Wan围绕AI如何改变消费者发现商品和完成购买的方式展开分享。她提到，从电子商务走向移动商务用了约15年，从移动商务到社交电商用了9年，而从“社交电商走向今天的智能体代理商务，可能只用了7年”。渠道迭代正在明显加速，出海企业需要更快适应新的消费入口。对商家而言，AI并不是对传统搜索的简单替代，而是在广告、搜索、邮件之外增加新的触达和交易渠道，Shopify现在所做的一切，实际上都是，如何让你的品牌在AI渠道里更容易被发现、被理解、被信任、被购买。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_ed19dfffdc7a489b89fdeea302b3e5d9@6301044_oswg530438oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Shopify亚洲商务负责人Vivey Wan “AI成为商业新入口，构建面向未来的全球增长底座”主题演讲</p>\n  <p>然而，同样是AI赋能，时下流行的内容出海面临另一套问题。掌阅科技CEO孙凯围绕“AI短剧出海”分享内容产品进入全球市场的新变化。过去三个月，AI短剧平均制作成本下降75%，供给量在半年内增长约300%。但生产门槛与效率降低并不意味着创作者普遍受益，爆款和利润反而进一步向优质内容集中。孙凯认为，AI短剧不是传统短剧的简单分支，国内内容也不能依靠翻译直接复制出海，决定内容能否能跑通的，依然是IP、故事能力以及对不同市场付费习惯和内容需求的把握：“2026年的短剧，恰如2016年的短视频：市场空间才刚刚打开。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_cde8aa4f3a4a49b58051b8df9504359a@6301044_oswg635889oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">掌阅科技CEO孙凯 “掌阅·AI短剧出海”主题演讲</p>\n  <p>从市场认知到数字入口，从经营底座到内容本地化，出海真正进入深处之后，需要补上的能力远比“把东西卖出去”更多。在关于“品牌全球化”的圆桌上，来自阿里云、Ocean Stone以及小满科技的嘉宾也将问题进一步落到长期增长：一次爆款、一个渠道甚至一个市场的成功，都不能直接等同于全球化。企业还需要把品牌、客户、数据与经营系统真正连接起来，将核心判断掌握在自己手中，同时借助外部生态补齐能力。进入AI时代，重复性工作可以更多交给工具，但人的认知、判断与审美反而变得更加重要。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_f5c514fba4fe4802ad896d14f07ad933@6301044_oswg946875oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“品牌全球化：如何构建长期增长能力？”圆桌</p>\n  <h2><strong>不同赛道，不同打法：全球化开始比经营能力</strong></h2>\n  <p>共性问题之外，不同行业也正在形成各自的全球化路径。</p>\n  <p>对于已经建立制造和规模优势的企业，下一步不再只是增加出口量，而是如何真正融入本地经营。在“从3000万到世界一流：长安汽车如何把速度转化为全球信任”主题演讲中，长安汽车分享自身如何从产品贸易走向制造、投资、服务与品牌协同的全球经营模式，产品也从“全球同步”进一步转向“全球原生、区域定制”，通过本地团队、服务网络和合作生态真正进入不同市场。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_6312c5efc7e7490b894fc8121667ecdb@6301044_oswg579862oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">长安汽车海外品牌公关总监Peter Larko “从3000万到世界一流：长安汽车如何把速度转化为全球信任”主题演讲</p>\n  <p>许多成熟的出海企业，面对增长问题也开始从单点突破转向系统构建。在关于“AI如何重塑商业”的圆桌中，与会嘉宾围绕全球市场复杂度、企业内部数据协同，以及AI能力如何真正进入经营体系展开讨论。Shopify资深解决方案工程师梁妍将重点落在全球经营的统一底座上。她提到，企业进入更多市场后，首先要找到统一的数据源，把商品、库存、渠道和区域运营真正连接起来；进入AI时代后，还需要进一步打通不同AI渠道，让商品能够被AI理解、发现和转化。AI规模化也不是简单增加工具，而是先把“发现问题—判断—行动—复盘”的完整链路跑通，再复制到更多市场和团队中。通过Shopify，商家可以在同一平台上管理一套产品、运营一个覆盖不同国家和市场的独立站，同时借助平台已打通的AI渠道，免去逐一对接、部署和维护的繁琐工作，从而更高效地拓展全球市场、抢占出海先机。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_52942a3557324df29804f0509488f7f6@6301044_oswg706750oswg1080oswg718_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“AI重塑全球商业，品牌如何建立面向未来的增长优势”圆桌</p>\n  <p>AI正在快速改变内容出海的生产和分发方式。在关于“速度与人心”的圆桌中，来自昆仑万维、柠萌国际、41财经的企业嘉宾将讨论进一步落到内容效率之外：当AI让生产、测试和本地化的成本不断下降，内容供给越来越充足，真正稀缺的反而是对“什么是好内容”的判断，以及对不同市场文化、情绪和用户需求的理解。AI可以放大效率，但从选题、故事到本土化表达，最终决定内容能否打动用户的，仍然是人的判断与市场洞察。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_de12caadb79c4b40a395bd50871ce7a5@6301044_oswg862842oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“速度与人心：AI让内容无限生成，‘打动人心’归谁管”圆桌</p>\n  <p>当企业越走越远，资本和服务体系的作用也在发生变化。在“产业资本的新航线”圆桌上，来自赛文思、九阳产业基金、PMI（项目管理协会）中国及连连支付的嘉宾，围绕“钱应该花在哪里”展开讨论。相比过去更看重流量和短期转化，企业开始把更多预算投入本地化、品牌建设、组织能力、合规与风险管理。资本的价值也不再只是提供资金，而是帮助企业降低判断和试错成本，并连接渠道、供应链与专业服务等长期资源。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_593764a67ff34c168eef2f762234ec19@6301044_oswg945867oswg1080oswg721_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“产业资本的新航线：出海下半场，钱该投向哪里”圆桌</p>\n  <p>不同赛道有不同打法，但背后的判断正在趋于一致：全球化已经越来越难依靠一个单点优势取胜。产品可以帮助企业打开市场，而真正决定企业能否长期留下来的，是能不能持续把产品、组织、供应链和市场连接起来。</p>\n  <h2><strong>从“走出去”到“走下去”，出海需要更多后方能力</strong></h2>\n  <p>当全球化从一次增长机会变成长期经营，出海也不再只是品牌自己的事情。</p>\n  <p>大会同期发布了East Forward·出海全球化领航企业、East Forward·出海全球化拓新企业及East Forward·出海全球化筑路企业三份名册，从已经形成全球化能力的企业、持续开拓新市场的企业，到支撑全球经营的服务生态，记录中国企业全球化进程中的不同参与者。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_cb53b4b5925a46ca84be9962200ff33b@6301044_oswg1045579oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_24988d214ac5434b8a72a83915debae4@6301044_oswg1014888oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_f9ad444fadcb49d9b6f45a143d91e35e@6301044_oswg974687oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">大会同期发布East Forward名册</p>\n  <p>这背后也是一项明显的变化：今天谈论出海，已经很难只关注站在最前面的品牌。支付、物流、合规、技术、营销、金融、人力和专业服务，共同决定一家企业进入新市场之后能不能顺利运行。</p>\n  <p>主论坛之外，East Forward出海资源对接会进一步把讨论从“怎么看”推进到“怎么办”。本次对接会共28家企业参与洽谈，品牌方、服务机构和产业资源围绕真实业务需求与经营心得展开交流与直接匹配。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_d7057018aaf4439a86b9d8ff7aed63dc@6301044_oswg1037442oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">潮起之时，靠岸相见——East Forward出海资源对接会</p>\n  <p>相比继续寻找下一个所谓的出海风口，对接会更关注企业已经发生的具体问题：进入市场后哪里卡住了、缺少什么资源、谁能够真正帮助解决。品牌方、服务机构和产业资源在更直接的场景中完成匹配，让大会上的讨论进一步回到真实业务。</p>\n  <p>从分享经验，到解决问题，“靠岸”的价值也正在这里变得具体。</p>\n  <h2><strong>潮起之后，全球化进入长期经营</strong></h2>\n  <p>一天的讨论下来，一个变化越来越清晰：中国企业全球化面对的问题，已经不再只是“怎样走出去”，而是“怎样一直走下去”。</p>\n  <p>当企业真正进入不同市场，很多过去可以分开解决的问题开始交织在一起。产品、品牌、供应链、技术、合规与组织能力互相影响，一个环节的短板，都可能改变整个海外业务的结果。全球化因此也越来越难用一个数字衡量。</p>\n  <p>出口量、GMV和海外收入仍然重要，但真正决定一家企业全球化成色的，是它能不能理解不同市场、建立本地组织、应对规则变化，并把一次成功转化为可以持续复制的能力。这或许也是中国企业出海进入下一阶段之后最重要的变化：全球化正在从一次向外扩张，变成企业自身能力的一次重新建设。</p>\n  <p>“潮起之时，靠岸相见”。36氪也将继续走进中国企业全球化发生的现场，记录企业如何在不同市场建立新的能力，连接品牌、产业、资本与全球化服务生态，让已经走出去的人分享经验，也让正在寻找方向的人，更快找到下一程的答案。</p>", "category": "tech", "published_at": "2026-09-22T08:33:06+00:00", "fetched_at": "2026-09-23T03:01:20.689244+00:00", "fingerprint": "8e5c2dc2d810c44e"}, {"source": "36氪 - 最新文章", "title": "36氪研究院 | 2026年中国AI Agent行业发展研究报告", "url": "https://36kr.com/p/3993945763314432?f=rss", "summary": "<p>当前，中国人工智能产业正站在从大模型能力跃迁到智能体规模落地的关键节点上。随着基础模型在多模态理解、长上下文推理与工具调用等能力上持续成熟，AI的价值重心正在从“理解与对话”转向“决策与执行”。对企业而言，数字化转型走向纵深，不再满足于单点工具提效，而是要求AI打通跨系统业务链路、替代人工完成标准化多步骤工作，真正嵌入生产流程；对个人而言，数字生活场景日益丰富，用户也不再满足于信息检索式的问答，而是期待AI能够代办日程、整合信息、处理事务，成为随叫随到的智能助手。两股需求共同指向同一种新的智能形态——AI&nbsp;Agent：它以大模型为决策大脑，集成环境感知、长期记忆、规划推理与工具调用能力，能够在少人工干预下自主理解目标、拆解任务、调用工具并交付结果，标志着AI从响应信息向自主执行的关键跃迁。</p>\n  <h2><strong>01.AI Agent 进入生产力验证与商业化放量的早期阶段</strong></h2>\n  <p>中国AI Agent市场已从概念验证迈向生产力验证，企业通用Agent率先进入商业化落地阶段，行业垂直Agent加速从试点走向规模化，个人消费Agent快速探索，端侧与具身Agent则处于生态布局和早期验证阶段。据CIDC数据，2025年中国企业级AI Agent市场规模已达212亿元，预计2029年将达到3,320亿元，产业整体仍处于早期，但商业化扩张速度明显加快。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_3a729dc39e96445f8086e9f981b2d5e7@12547972_oswg30740oswg1095oswg496_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>02.Agent产业价值由模型能力向任务执行与结果交付迁移</strong></h2>\n  <p>基础模型能力持续提升、推理成本下降，大模型正从相对稀缺的智能资源逐步转变为可调用、可组合的通用能力，产业竞争重点也由参数规模和模型性能逐步转向任务完成能力、业务适配能力和单位任务成本。Agent真正创造的价值，不再是提供更好的回答，而是持续调用工具、连接系统并最终完成任务、交付结果。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_fc6774689bfd4cf1b0a6baf626bb7927@12547972_oswg67399oswg1103oswg542_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h2><strong>03.企业级Agent正在从应用构建工具升级为智能基础设施</strong></h2>\n  <p>随着Agent进入真实业务环境，企业需求已由快速搭建一个Agent转向对开发、评测、部署、运行、监控和持续优化的全生命周期管理，Agent平台正在由单纯的应用开发工具升级为企业级智能基础设施。同时，Agent与Workflow开始形成协同架构，连接、可观测、权限和安全治理逐渐成为规模化落地的关键能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_4cd8807fafeb42e9bfdfab40db130466@12547972_oswg44700oswg1083oswg445_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_4b251e362a5c4331bb8973e8a4d37dbf@12547972_oswg39142oswg1113oswg334_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>本报告重点研究问题如下：</strong></p>\n  <ul>\n   <li>推动AI Agent行业发展的核心驱动力主要包括哪些？</li>\n   <li>AI Agent行业发展现状是怎样的？当前处于哪一发展阶段？</li>\n   <li>AI Agent产业链上、中、下游分别由哪些环节构成？各环节有哪些最新发展动态？</li>\n   <li>AI Agent市场有哪些主要参与主体？各类主体分别具备哪些竞争优势？</li>\n   <li>AI Agent行业有哪些代表性企业？其发展路径对行业同类企业有何借鉴意义？</li>\n   <li>未来三到五年，AI Agent行业将呈现哪些技术、产品、生态、治理等哪些发展趋势？</li>\n  </ul>\n  <p>更多精彩内容，详见《2026年中国AI Agent行业发展研究报告》，点击<a href=\"https://pan.baidu.com/s/1axYViiioKzaz2Xm0utXEqw?pwd=wj7f\" rel=\"noopener noreferrer\" target=\"_blank\">下载链接</a>，提取码：wj7f</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_57281b0c1c9d44708c453128f4cfdfe8@12547972_oswg1179620oswg794oswg1123_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_094c286270fb4fd393821235a768b1e4@12547972_oswg110651oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_efa7fac54ec6436fb9fec0e17b868ac3@12547972_oswg48042oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_1e789163dcf24470868e8fb90c108d03@12547972_oswg47300oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_b346ccd7ea93437e93d6a71becd8b3e8@12547972_oswg110444oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_828ce03e5c8f42718cd63d118a3170f1@12547972_oswg93573oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_dffc702ac1d647a69def24d385dbb697@12547972_oswg119378oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_8cabd05a62d143cf9b12f7c7455f7cfe@12547972_oswg120980oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_90aba8a908194b9abae6da465610bbe5@12547972_oswg123219oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_91a50bd10b56463c885dcf63e11bc79e@12547972_oswg92706oswg794oswg1123_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260922/v2_bc22eb0fb6c3493aac0a1ce5d676fa4f@1254797
