/entertainment/1034013/armand-hammers-snakes-ladders-review", "summary": "I open with this caveat: I haven't had a ton of time to digest the surprise Armand Hammer record that dropped this week. Billy Woods and Elucid rarely miss, though, and my initial reaction is that Snakes &#38; Ladders ranks among their best. It doesn't have the seamless throughline production-wise that their collabs with Alchemist [&#8230;]", "category": "tech", "published_at": "2026-11-15T21:49:22+00:00", "fetched_at": "2026-11-16T04:29:16.677639+00:00", "fingerprint": "dc785de9ef44a414"}, {"source": "The Verge", "title": "Apple’s new study looks to improve the effectiveness of AI health tools", "url": "https://www.theverge.com/tech/1033355/apples-new-study-looks-to-improve-the-effectiveness-of-ai-health-tools", "summary": "Apple announced a new study today with the goal of better understanding how people interact with conversational AI health tools and how useful their responses actually are. The company is conducting the Apple Health AI Usage Study in collaboration with OpenEvidence, a clinical AI platform used by healthcare professionals that generates answers based on medical [&#8230;]", "category": "tech", "published_at": "2026-11-16T01:26:56+00:00", "fetched_at": "2026-11-16T04:29:16.677629+00:00", "fingerprint": "c57d5fdb338c13eb"}, {"source": "36氪 - 最新文章", "title": "黄仁勋吃了上市太早的亏", "url": "https://36kr.com/p/4067755181003654?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄绎达</p>\n  <p>编辑&nbsp;|&nbsp;张帆</p>\n  <p>11月12日，英伟达突然宣布，公司联合创始人黄仁勋辞去总裁、首席执行官及董事职务，即时生效。现任首席财务官Colette Kress将出任临时CEO，董事会同时任命Harvey Jones为公司历史上首位董事长，并启动新任CEO的遴选程序。</p>\n  <p>自1993年创立英伟达以来，黄仁勋长达33年的掌舵生涯正式落下帷幕。从GPU到人工智能，黄仁勋带领英伟达完成了数次重大战略转型，将一家初创芯片企业发展为全球最具影响力的科技巨头之一。</p>\n  <p>然而，就在不到五个月前，黄仁勋还在英伟达年度股东大会的董事选举中获得了约99%的赞成票。如此鲜明的前后反差，也让市场重新审视一个长期被英伟达耀眼业绩所掩盖的公司治理问题：</p>\n  <p>作为公司的创始人和长期领导者，黄仁勋为何没有像谷歌的佩奇与布林、Meta的扎克伯格那样，通过AB股制度巩固自身的控制权？</p>\n  <h2><strong>01 1999年还不是AB股时代</strong></h2>\n  <p>关于这一问题的答案，或许要从英伟达1999年上市时的股权安排说起。彼时，硅谷科技公司上市以“同股同权”为常见安排，对于创始人而言，可以凭借持股、高管职位、个人声望等方面影响公司决策，<strong>但没有天然高于普通股东的投票权</strong>。英伟达也沿用了这一传统，只发行了普通股。</p>\n  <p>再说双层股权结构，其实也不是互联网时代的发明。早在上世纪，已有不少知名美股上市公司就利用双层股权结构，以不同投票权的股票来维持控制权，典型如福特汽车、纽约时报等。然而，<strong>将这套制度明确用于保护科技企业的长期战略，并逐渐成为大型科技互联网企业IPO经常采用股权结构，是此后互联网时代才形成的趋势。</strong></p>\n  <p>2004年，谷歌上市时就采用了AB股结构。在投票权层面，佩奇和布林将公众持有的A股设为每股一票，创始人等持有的B股设为每股十票。在谷歌的招股书中明确表示，传统上市公司结构可能削弱企业的独立性，因此希望通过AB股维持管理层对公司的长期控制权，保障长期战略的实施。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_296b5936e27d4955aea60ebdc54493f8@5426566_oswg263141oswg1080oswg584_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：科技股同股不同权历史演变；资料来源：36氪制图</p>\n  <p>相比之下，英伟达的上市时间只早了五年，沿用一股一票的股权安排，很大程度上反映的是当时科技企业的股权治理惯例。而且，纳斯达克的5640规则限制上市公司事后通过发行超级投票权股票等方式，不公平地削弱现有普通股东的投票权。<strong>因此，作为已经上市的英伟达，想要引入超级投票权以保护创始人，制度层面的难度已经远远高于IPO之前。</strong></p>\n  <h2><strong>02 黄仁勋持股在持续稀释</strong></h2>\n  <p>英伟达股权的分散程度颇高，从上市之初就已显现。其1999年招股书披露，黄仁勋在IPO前持有约13.1%的股份，IPO后降至10.8%；2026年的持股比例进一步降至3.58%。融资、增发、股权激励与个人持股变动，使得黄仁勋的持股比例在持续下降，他的投票权也相应的在持续减弱，为此次“下课事件”埋下了伏笔。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_9fe8fd58146c449ea3c33aa54a4639c4@5426566_oswg989776oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：黄仁勋股权稀释时间线；资料来源：36氪制图</p>\n  <p>早年间，硅谷科技公司创始人因股权稀释失去控制权的情况已有先例。1985年，乔布斯与苹果CEO斯卡利围绕公司经营发生激烈冲突。虽然，乔布斯彼时仍是苹果最大的个人股东，但持股比例已降至约11%，已经不足以左右董事会的决定。而董事会则选择支持斯卡利，并通过业务架构调整，乔布斯被解除了经营管理职权，他于同年9月离开了自己创办的苹果。</p>\n  <p>再看微软，1986年上市后，盖茨仍持有约45%的股份，尽管他个人的持股比例逐步下降，截至2000年卸任CEO前仍保有约14%的股份。得益于上市初期盖茨较高的持股比例，且此后的股权稀释的过程相对渐进，以及长期积累的领导权威，盖茨在CEO任期内始终保持着较强的公司控制力。</p>\n  <p>相比之下，黄仁勋在英伟达上市时仅持有约11%的股份，与盖茨相比，“皮衣战神”持股比例对应的投票权明显偏弱。而且，<strong>随着此后持股比例的进一步下降，黄仁勋本就偏弱的投票权又在持续减弱，可以说是早早失去了依靠控股来主导公司决策的基础。</strong></p>\n  <h2><strong>03 黄仁勋领导公司33年靠的是业绩权威</strong></h2>\n  <p>所以，黄仁勋对英伟达的影响力很难用股权比例对应的投票权来解释。企业运行中的管理权从来不只来自投票箱，还来自业绩权威、战略判断以及董事会对高管的长期信任。</p>\n  <p>从图形芯片走向可编程GPU，再到CUDA生态的持续投入，<strong>英伟达多次在市场形成共识之前押注长期技术路线</strong>。尤其是CUDA，在早期难以立即贡献可观回报，却逐渐构筑起软硬件协同的竞争壁垒；此后，生成式AI推动算力需求爆发，英伟达从芯片供应商进一步成为全球AI基础设施的核心参与者。</p>\n  <p>这些关键的战略决策及其带来的巨大商业成功，逐步奠定了黄仁勋在英伟达的核心领导地位。在公司的日常运营中，黄仁勋长期主导产品研发方向、研发资源分配、供应链协同以及客户关系管理，公司扁平化的管理方式强化了他对基层业务和经验决策的影响力。对董事会和机构投资者而言，支持他既是认可过去的成绩，也包含对其未来判断能力的信任。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261113/v2_3b547c74e99d4bb99adc71c9e19e3c9f@5426566_oswg85385oswg1000oswg522_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图：英伟达长期营业收入表现；资料来源：wind，36氪</p>\n  <p>因此，黄仁勋即便不具有法律意义上的绝对控制权，却长期拥有事实上的战略主导权，凭借持续兑现的业绩，在缺少股权保护的情况下维持了33年的领导地位。2026年6月的董事选举中，他获得约99%的赞成票，便是这种信任的直观体现。</p>\n  <p><strong>但上述“黄仁勋模式”存在一个内在条件：业绩权威必须不断得到认可</strong>。它可以随着公司成功而增强，一旦经营业绩或个人声誉受到冲击，长期积累的领导权威便可能迅速削弱，特别是缺乏绝对控制权的黄仁勋，以可能因此失去董事会的支持，甚至失去对公司的经营主导权，此次“下课事件”则是上述观点的明证。</p>\n  <h2><strong>04 AB股究竟保护了谁？</strong></h2>\n  <p>基于英伟达以董事会为中心的治理模式，根据公司细则，董事会只需获得过半数董事支持，有权随时任免CEO等高级管理人员，无论是否存在正当理由。黄仁勋即使是创始人，也不能单凭不到4%的持股否决董事会的人事决定。</p>\n  <p>对于持股比例较低且缺乏绝对控制权的黄仁勋而言，即使长期担任CEO，也必须依靠业绩增长和股东信任维持其领导地位。由于无法凭借自身投票权控制董事会，董事会便能够对其形成实质性的权力制衡，并在必要时推动管理层的人员调整。由此可见，黄仁勋此次辞任并不意外，正是英伟达长期以来股权结构与公司治理机制共同作用的结果。</p>\n  <p>耶鲁大学教授Jeffrey Sonnenfeld在近期的采访中指出，黄仁勋在缺乏双层股权保护的情况下，依然成功领导英伟达逾30年，成为反对AB股制度的有力例证；然而，颇具讽刺意味的是，如果英伟达当年赋予他超级投票权，如今撤换他的难度将大幅增加。</p>\n  <p>谷歌和Meta是典型的AB股结构，超级投票权赋予创始人更强的公司控制力，使其能够减少市场短期波动与股东压力的干扰，并推动长期战略布局。但当创始人的判断或行为出现问题，普通股东可能则难以通过投票改变公司治理格局。<strong>所以，AB股放大了创始人的战略自主权，也相应降低了外部纠错的便利性。</strong></p>\n  <p>而英伟达没有采用AB股结构，既有1999年上市时的历史因素，也形成了不同于谷歌、Meta等科技巨头的治理逻辑，即选择用业绩说话，而非用制度锁死控制权，由此保留董事会的监督与纠错能力。黄仁勋的此次辞任则再次证明，<strong>无论业绩权威曾经有多大，缺乏制度性控制权的创始人，始终都要受到公司治理规则的约束。</strong></p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者��法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-11-15T12:41:58+00:00", "fetched_at": "2026-11-16T04:29:16.538409+00:00", "fingerprint": "3f3bf5544c17f1bc"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨黄仁勋考虑回归担任英伟达CEO；129万/支的“天价抗癌药”进医保了；美国罕见全国停飞超4小时", "url": "https://36kr.com/p/4071682515817605?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>OpenAI解散机器人团队</p>\n  <p>SpaceX首次实现“筷子夹飞船”</p>\n  <p>2026年版国家基本医保药品目录发布，新增107种药品</p>\n  <p>微软就全球服务中断道歉</p>\n  <p>加密货币全线大跳水，超31万人爆仓</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>黄仁勋讨论重掌英伟达，硅谷盟友游说支持回归</strong></p>\n  <p>据报道，在被董事会驱逐数天之后，英伟达公司前首席执行官黄仁勋正在讨论重返公司的可能性。随着几位硅谷盟友开始游说支持他回归，黄仁勋已经在讨论重返公司的想法。一名黄仁勋的盟友透露，他们正在组建一个由硅谷企业高管组成的“作战室”，游说推动黄仁勋复职，并计划争取白宫方面的支持。这名人士表示：“在科技行业，除了那些前沿研究实验室之外，所有有影响力的人都喜欢黄仁勋。”他还补充说，黄仁勋本人支持这项行动。</p>\n  <p>Altimeter Capital Management和Atreides Management上周晚些时候在社交媒体发文称，鉴于“黄仁勋长期领导下取得的非凡成功”，以及他的离职所带来的不确定性，英伟达董事会在决定未来领导层时应采取“缓慢、审慎且深思熟虑的”方式。（新浪财经、鞭牛士）</p>\n  <p><strong>原价129万一针的CAR-T抗癌药首次纳入基本医保</strong></p>\n  <p>11月14日，国家医保局宣布，药明巨诺（02126.HK）的CAR-T药物瑞基奥仑赛已被纳入医保目录。进入医保前，瑞基奥仑赛的定价为129万元/支。哈尔滨血液病肿瘤研究所马军所长告诉记者，纳入医保后，瑞基奥仑赛的定价已降到30万元/支以下。据悉，CAR-T是一种免疫细胞疗法，凭借在血液肿瘤领域取得的惊艳“战绩”，成为近年抗癌治疗的“新秀”。CAR-T药物以“天价”闻名，每针的价格在100万元左右，即便叠加各种优惠，每针价格也在50万元左右。过去几年，CAR-T药物曾多次尝试进入基本医保目录，均因定价过高，止步于形式审查阶段。（经济观察报）</p>\n  <p><strong>因技术故障，美国停飞全国航班&nbsp;</strong><br />&nbsp;</p>\n  <p>美国当地时间11月13日，美国联邦航空管理局（FAA）因航空交通管制系统出现通信故障，发布全国性航班地面停飞令，要求全美各机场暂停出港航班起飞。这项指令于当地时间下午3时54分左右发布，持续超过4小时。</p>\n  <p>对于事故原因，官方初步表示，FAA航空交通管制中心发生通信故障，老旧系统中的路由器和交换设备因数据负载问题出现异常，影响了通信及雷达信息的稳定传输。为确保飞行安全，当局因此决定暂停全国航班起飞。当地时间15日，美国交通部长达菲表示，美国航空运输预计当天逐步恢复正常，受飞机和机组人员不在预定执勤位置影响，可能到16日才能全面恢复。（新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI推出ChatGPT钱包</strong></p>\n  <p>北京时间周五晚间，OpenAI宣布推出ChatGPT钱包。该产品的主要卖点是AI巨头与美国运通、万事达和Visa三大支付网络合作，通过替代支付凭证，让AI代理无需接触用户的真实信用卡信息即可完成付款，同时保留原有信用卡奖励和交易争议保障。OpenAI表示，这项功能上线初期先面向美国成年Pro订阅用户开放，且必须持有符合条件的美国信用卡，ChatGPT钱包上线初期不会从交易中抽成。（财联社）</p>\n  <p><strong>Google为Gemini推出个人财务分析功能，接入银行账户和信用卡，帮用户分析收支</strong></p>\n  <p>当地时间11月13日，Google宣布为Gemini推出全新的个人财务分析功能，通过整合Google Wallet（Google钱包）以及第三方金融数据服务Plaid，允许用户将银行账户、信用卡等金融账户连接到Gemini，让AI直接读取个人交易记录，分析消费习惯、追踪资金流向，并根据实际财务状况制定预算和储蓄计划。用户启用该功能后，可以在Gemini对话中使用@Google Wallet调用个人财务数据。Google特别强调，这项功能采用只读访问机制。即使用户授权Gemini读取银行账户和信用卡信息，AI也不能直接转移资金、管理账户或者进行投资操作。（IT之家）</p>\n  <p><strong>OpenAI解散机器人团队</strong></p>\n  <p>据媒体报道称，OpenAI已解散其独��机器人团队，将团队研究人员重新分配至其他部门。一位OpenAI发言人表示，此举并不意味着公司退出机器人领域，机器人技术仍然是OpenAI长期愿景的核心组成部分。OpenAI原机器人研究团队已被并入公司的核心研究团队，向首席研究官Mark Chen汇报；而应用机器人团队和硬件团队则被重新划归公司规模更大的应用部门，该部门由OpenAI总裁Greg Brockman领导。这是OpenAI第二次解散机器人团队。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>英伟达回应黄仁勋继任者传闻&nbsp;</strong></p>\n  <p>据报道，英伟达董事会在寻找黄仁勋潜在继任者的过程中，已接触Arm首席执行官雷内·哈斯（Rene Haas）。2013年加入Arm前，哈斯曾任英伟达计算产品业务高管。 报道称，哈斯只是英伟达董事会目前考虑的几位候选人之一，尚不确定他是否会收到正式邀请，也不确定他是否会接受该职位。 针对上述传闻，英伟达董事会在一份声明中表示，公司正遴选负责CEO人选物色工作的猎头机构，尚未与任何潜在候选人正式接触，“针对任何具体候选人——无论是来自公司内部还是外部——的猜测，目前都为时过早”。（界面新闻）</p>\n  <p><strong>51个一类新药进入新版国家医保药品目录</strong></p>\n  <p>从国家医保局获悉，2026年国家医保药品目录和商业健康保险创新药品目录在苏州发布。新版国家医保药品目录新增107种药品，其中51个一类新药，再创历史新高。新增品种覆盖肿瘤、罕见病、慢性病、精神疾病等多个临床急需治疗领域。商业健康保险创新药品目录调整同步开展，新增12种药品，其中包括全球首个实体瘤CAR-T、中国首个血友病基因治疗药物等重大创新药品。调整后，2026年商业健康保险创新药品目录共有28种。此次调整后，2026年版国家医保药品目录药品总数达到3331个，其中西药1935个、中成药1396个。新版目录于2027年1月1日正式落地执行。（新华社）</p>\n  <p><strong>2026年版国家基本医保药品目录发布，新增107种药品</strong></p>\n  <p>国家医疗保障局、人力资源社会保障部今天（14日）发布《国家基本医疗保险、生育保险和工伤保险药品目录》以及《商业健康保险创新药品目录》（2026年），这是国家医保局成立以来开展的第9次国家基本医保药品目录调整，本次调整共新增107种药品，其中51个为1类创新药，再创历史新高。本次国家基本医保药品目录调整，新增品种覆盖肿瘤、罕见病、慢性病、精神疾病等多个临床急需治疗领域。同时，将34种临床价值有限、有更好替代方案或说明书信息项缺失且无法供应的药品调出目录。综合调入、调出及剂型合并，2026年版国家基本医保药品目录药品总数达到3331个。（央视新闻）</p>\n  <p><strong>微软就全球服务中断道歉&nbsp;</strong><br />&nbsp;</p>\n  <p>当地时间11月13日，微软公司就导致数百万用户受影响的全球性服务中断事件深表歉意。微软表示，此次故障“与网络攻击或人工智能/智能体（AI agents）无关”，而是由早先一次“网络容量升级”引发，目前尚无法预计何时能完全恢复服务。微软此前称，恢复工作进展“令人鼓舞”，目前正致力于消除此次故障留下的“后续影响”。该故障曾导致Teams、Outlook以及人工智能软件Copilot在至少70个国家无法使用。（第一财经）</p>\n  <p><strong>2026年度电影总票房破320亿</strong></p>\n  <p>截至11月15日，2026年度电影总票房（含预售）突破320亿元。暂列年度票房榜前五位的均为国产片：《飞驰人生3》《欢迎来龙餐馆》《功夫女足》《八仙！》《给阿嬷的情书》。据测算，今年以来电影全产业链产值近5000亿元。（央视新闻）</p>\n  <p><strong>游族网络：控股子公司收到14.28亿元闪存颗粒采购订单</strong></p>\n  <p>11月15日，游族网络公告称，控股子公司智存合盈于2026年11月2日与B公司签订了《采购合同》，约定B公司以订单的形式，向智存合盈采购闪存颗粒产品，合同自双方盖章之日起生效，有效期2年。《采购合同》未约定合同金额，具体价格以采购订单为准。2026年11月12日，B公司向智存合盈出具采购订单采购闪存颗粒产品，订单金额为14.28亿元人民币（含税）。（财联社）</p>\n  <p><strong>比特币跌破63000美元，日内跌超7%，加密货币全线大跳水，超31万人爆仓</strong></p>\n  <p>11月15日，加密货币市场全线大跳水。21财经雷达数据显示，截止10:30左右，比特币跌破63000美元，日内跌超7%；XRP、BNB跌超9%；以太坊日内大跌10%。根据CoinGlass数据统计，最近24小时，加密货币全网超31万人爆仓，爆仓总金额超过19亿美元。其中，超九成为多单爆仓。（21世纪经济报道）</p>\n  <p><strong>香港迪士尼报警，约1.7万个门票二维码被盗</strong></p>\n  <p>近日，香港迪士尼乐园约有1.7万个电子门票二维码在网上票务系统中被盗，引发关注。11月15日，香港警务处方面回应记者称，案件暂列“有犯罪或不诚实意图而使用电脑”，交由大屿山警区重案组跟进，暂未有人被拘捕。记者注意到，香港迪士尼乐园度假区官方网站正进行系统维护，购买乐园门票及预订酒店服务现已暂停。据了解，11月12日晚，迪士尼乐园一名负责内部网络系统及日常运作的人员发现公司电脑系统出现异常，约有1.7万个电子门票二维码在网上票务系统中被盗，并立即停止网上票务运作，向香港警方报案。（南方都市报）</p>\n  <p><strong>意大利因照片隐私问题对Meta罚款超8亿欧元</strong></p>\n  <p>意大利数据保护局14日发布公告说，已对元宇宙平台公司（Meta）旗下爱尔兰公司处以8.05亿欧元（约合8.87亿美元）罚款，原因是该公司在未经安卓用户同意情况下获取手机相册信息。公告说，Meta爱尔兰公司通过安卓设备上的脸书应用程序，访问了存储在意大利用户智能手机中的照片、视频及相关元数据，事先未获得用户专项同意，也未向用户作出充分告知。（新华社）</p>\n  <p><strong>SpaceX首次实现“筷子夹飞船”</strong></p>\n  <p>SpaceX星舰第十五次试飞的上面级飞船返回得克萨斯州星港，在完成着陆点火和姿态翻转后，成功被发射塔“筷子”机械臂捕获。这是SpaceX首次成功捕获从地球轨道返回的星舰上面级飞船，为实现星舰完全、快速重复使用迈出关键一步。此次飞船此前已完成26颗第三代星链卫星部署，但超重型助推器回收未能成功，因此本次任务未实现两级全部回收。（财联社）</p>\n  <p><strong>北交所开市五周年，总市值约8000亿元</strong></p>\n  <p>11月15日，北京证券交易所迎来开市五周年。截至目前，北交所有上市公司355家，总市值约8000亿元。（央视新闻）</p>\n  <p><strong>币安称计划下周全面恢复提现服务</strong></p>\n  <p>币安周六表示，计划在下周末前恢复所有剩余网络和资产的提现功能。此前，这家全球最大的加密货币交易所遭遇了一起网络入侵事件，导致平台上价值63亿美元的资产在上个月被盗；目前，该交易所的运营正逐步恢复正常。币安在社交平台X上发文称：“本周，我们已恢复了87个网络的提现功能。我们的目标是在下周末前，恢复所有剩余网络和资产的提现。”（新浪财经）</p>\n  <p><strong>深圳已成为中国内地首个外贸进出口超5万亿元的城市</strong></p>\n  <p>2026年APEC领导人会议周新闻中心举行广东省、深圳市专场中外媒体吹风会。会上，深圳市商务局局长张非梦表示，根据最新数据，深圳外贸再创新高，已成为中国内地首个外贸进出口超5万亿元的城市。（证券时报）</p>\n  <p><strong>特斯拉：开始面向个人销售Cybercab</strong></p>\n  <p>特斯拉表示，已向一小部分客户开放Cybercab预订，意味着该公司准备向普通消费者推出这款无人驾驶汽车。这款两座车型没有方向盘和脚踏板，此前已作为特斯拉自动驾驶出租车服务的一部分在奥斯汀上线。特斯拉自动驾驶出租车官方账号周五在X平台发文称，如今Cybercab将对服务覆盖区域内的“选定客户”开放购买。目前尚不清楚特斯拉对个人使用的定义，也不清楚个人版Cybercab是否只能在奥斯汀现有的地理围栏区域内行驶——奥斯汀也是目前该自动驾驶车辆作为无人出租运营的唯一地点。特斯拉此前仅面向车队运营方投放过意向登记表，并未开放个人版Cybercab预订。（新浪财经）</p>\n  <p><strong>英雄联盟全球总决赛中国战队夺冠</strong></p>\n  <p>11月15日，英雄联盟全球总决赛决赛中，中国BLG战队战胜韩国Gen战队，加冕S16总冠军，这是中国战队时隔五年再度捧起S赛冠军奖杯。（第一财经）</p>\n  <p><strong>知名婚纱品牌Vera Wang致歉</strong></p>\n  <p>11月14日，婚纱品牌Vera Wang相关方就近期被曝拖欠押金等问题发布致歉声明。声明方是Vera Wang HAUTE婚纱在中国大陆的独立授权合作方TopshelfFashion Group，其表示对此高度重视，已直接对接受影响顾客。目前，所有超出商定退款时限的押金均已退还；其余相关未到商定退款时限的押金，将与顾客协商按计划完成退款。据悉，近日有多位网友在社交平台上反馈Vera Wang拖欠数万元押金。按约定押金应在7-15个工作日内退还，部分顾客却被拖延长达近2月。据蓝鲸新闻了解，有消费者已收到押金退款。（财联社）</p>\n  <h2>酷产品</h2>\n  <p><strong>“苹果最暗产品“发布：苹果首款智能家居中枢HomeView屏幕最低仅0.3尼特&nbsp;</strong></p>\n  <p>苹果硬件工程副总裁Matthew Costello在11月13日在接受TechRadar采访时，表示，苹果首款智能家居中枢HomeView屏幕最低仅0.3尼特，高管笑称是“最暗的苹果产品”。他还表示“我非常喜欢HomeView，这是我们迄今为止设计的产品中最暗的产品，最低亮度降至0.3尼特。所以官方来说，我打造的是苹果公司有史以来最暗的产品。我不知道这是好事还是坏事，但我对此非常自豪。”对于调暗屏幕亮度，Costello表示由于HomeView需要摆在床边，在夜间点亮后如果太亮，可能会影响用户的睡眠，因此需要降低暗光环境中的存在感。（来源：IT之家）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261116/v2_1d98bf2c991e4b209b29d3a34ed10cad@5667365_oswg29820oswg650oswg366_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>整理丨</strong>昌怡</p>", "category": "tech", "published_at": "2026-11-16T00:09:56+00:00", "fetched_at": "2026-11-16T04:29:16.538403+00:00", "fingerprint": "9aa52b23eda832cd"}, {"source": "36氪 - 最新文章", "title": "3.5万亿医保基金，明年为这些新药“买单”", "url": "https://36kr.com/p/4070947046675589?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>定价百万、一针治愈的“抗癌针”，全病程只吃一片的“流感神药”，爆火全网的GLP-1降糖药……又一批新药能用医保报销了。</p>\n  <p>11月14日，2026年国家基本医保目录公布，新增药品107个，其中1类新药51个，调整后目录内药品总数增至3331个。</p>\n  <p>国家医保目录动态调整走到第9个年头，“腾笼换鸟、有进有出”的基础规则早已定型。但每年，决定着3.5万亿医保基金如何使用的目录调整背后，博弈依然复杂：有些新药呼声很高，但卡在“50万不谈、30万不进”的隐性门槛外；有的临床价值突出，又因入院难或基金压力等因素影响迟迟无法落地。</p>\n  <p>尽管如此，今年的新版目录，还是给出了几个超出预期的答案。</p>\n  <p>最具代表性的产品就是“抗癌针”CAR-T。从2021年国内有首款CAR-T上市至今，历经5年追逐“陪跑”，来自药明巨诺、曾标价129万元一针的瑞基奥仑赛首次进医保，成为目前唯一可用医保报销的CAR-T产品。</p>\n  <p><strong>瑞基奥仑赛的医保定价为28.86万元。如按居民医保住院费用平均70%的报销比例来算，明年起，患者自费价将降至10万元以下。</strong>另据医保部门方面强调，该品种“在一定时间内继续享受‘三除外’政策优惠”，这意味着其入院难度有所降低。</p>\n  <p>此外，肿瘤、代谢、呼吸系统等大病种集中的疾病领域，也都有不少“明星产品”被纳入。其中抗肿瘤药方面，百利天恒的双抗ADC伦康依隆妥单抗、艾伯维的淋巴瘤双抗药艾可瑞妥单抗，均首次进医保；GLP-1降糖药迎来“大爆发”，信达生物的玛仕度肽、诺和诺德的依柯胰岛素司美格鲁肽等4款产品集体入围。</p>\n  <h2><strong>129万CAR-T降价至29万</strong></h2>\n  <p>“CAR-T自己‘集采’了自己。”看到新版医保目录后，一位细胞与基因治疗（CGT）领域从业者开玩笑称。但他认为，瑞基奥仑赛进医保，无论从患者获益，还是CGT赛道的资本认可度等角度，“都是好事”。</p>\n  <p>哈尔滨血液病肿瘤研究所马军对《经济观察报》表示，截至目前，国内接受了CAR-T治疗的患者仅有9200人左右。与之相对的是，大量符合CAR-T标准的患者因价格无缘治疗。药明巨诺董事会主席兼行政总裁田丰称，每年，仅有不足4%符合适应症的患者接受治疗。</p>\n  <p>2021年，瑞基奥仑赛成为第二款在中国上市的CAR-T产品，其129万元的初始定价国内在10款已获批产品中是最高的。上市5年来，瑞基奥仑赛累计治疗患者仅1200余例。</p>\n  <p>“<strong>我认为，CGT产品整体定价降到50万、30万以内，这种治疗选择才有现实意义。</strong>这会改变患者的决策思路，因为绝大多数中国患者听到100万就放弃了，但价格在可承受区间，他们便不会拖到毫无选择时再考虑，这就避免错失治疗窗口，或因反复化疗导致制备细胞质量变差、疗效打折；另一方面，患者使用CAR-T意愿增强，也能抬高CGT市场增长空间。”CGT创业者刘良判断。创业前，他曾是一名医生。</p>\n  <p>给CAR-T降价，因此成为过去几年CGT企业的共同努力方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_7779609d2baf4cfb9ae5c55770fa18d1@5930287_oswg466835oswg1800oswg2380_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪制图</p>\n  <p>支付端，各类商保/惠民保、按疗效付费探索是基础操作。去年，国家医保局首次设立商保创新药目录，缓解高价创新药无法进入普通基本医保的问题，并提供“三除外”政策优惠，药明巨诺、复星凯瑞等5家企业的CAR-T集体入选。</p>\n  <p><strong>36氪从国家医保局方面获取的信息称，该目录今年开始执行后，瑞基奥仑赛是5款CAR-T中采购金额增幅和医疗机构用量增幅最高的。这或许也是药明巨诺率先“激进”降价进医保的原因之一。</strong></p>\n  <p>但仅凭支付端优惠，治标不治本。行诚生物商务副总裁刘肖认为，CAR-T产品想普惠，“最笨但也最扎实”的路径还是降低制造成本。他介绍，受限于“一对一”高度定制化的制备过程，早期CAR-T单次生产成本就达40-60万元。</p>\n  <p>尤其是复星凯瑞、药明巨诺的CAR-T上市时，本就带有海外技术引进的成分，加之彼时国内CGT产业链尚未成熟，原料、设备高度依赖进口，生产成本基本都在50万元以上。叠加前期研发投入和后期市场费用，在业内看来，百万元一针并没有很夸张的溢价。</p>\n  <p>但随着CGT产业不断成熟，CAR-T降价已具备现实基础。因为，CAR-T的“个性化”主要体现在患者T细胞采集、体外转染扩增和回输环节；而慢病毒载体、质粒、检测试剂等上游原料、设备可以做标准化预制，且已形成国产化供应链。</p>\n  <p>业内有观点认为，考虑到研发和市场端的费用，定价30万左右的CAR-T想盈利，生产成本需低于10万元。</p>\n  <p>据36氪了解，对近两年上市，或处在申报阶段的CAR-T企业来说，如果一开始就依托国产化供应链来做，会相对容易，目前已有企业能实现。甚至，有些处在审批阶段的企业，如华道生物，已对外宣称自家CAR-T定价23-25万。</p>\n  <p>不过，对复星凯瑞、药明巨诺、传奇生物（并未实际销售）这类企业来说，转向国产化意味着要做重大工艺变更，这同样是一笔高昂费用。“没有新药上市申报那么复杂，但也是非常正式的审批流程。”</p>\n  <p>医保目录公布后，田丰也表示，能降价进医保，主要得益于慢病毒载体等核心原材料国产化。</p>\n  <p>多位受访者一致认为，本次降价，将直接带动瑞基奥仑赛的市场竞争力，也为同靶点其他CAR-T定下新的定价参照，后续产品降价是大势所趋。不过，对通用型CAR-T、体内CAR-T等走“自体CAR-T平替路线”的企业来说，这或许会形成一定压力。“自体CAR-T疗效成熟、安全性更优，以前唯一的短板就是价格，现在短板没了，优势是压倒性的。”</p>\n  <h2><strong>流感、偏头痛、干眼症……</strong></h2>\n  <h2><strong>这些常见病新药也有医保买单了</strong></h2>\n  <p>如果说CAR-T等高价值肿瘤创新药解决的是“救命”问题，体现的是国家医保保障患者有机会使用临床价值明确、减轻灾难性医疗支出的初衷；另一条更贴近普通人“健康主线”的慢病与常见病新药供给，也在持续丰富。</p>\n  <p>36氪注意到，糖尿病、痛风等基础慢病，以及流感、偏头痛、干眼症等近年高发的常见病，今年也都迎来临床价值更优的新药。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_1477c69f14e845e2b3f7edd9722d1f1e@5930287_oswg609574oswg1800oswg2046_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪制图</p>\n  <p>“老药”更新迭代，凭借新作用机制为患者提供疗效更优、安全性更好的治疗方案，是这些疾病的共性看点。</p>\n  <p>以糖尿病为例，今年，共有信达生物、诺和诺德、辉瑞/先为达、派格生物的4款GLP-1产品被纳入。传统二甲双胍、胰岛素等药物虽能有效降糖，但难以同时改善体重、心血管等伴随问题。GLP-1类药物改变了这一局面，也因此成为近几年医药市场的“重磅单品”。</p>\n  <p>此前，礼来的替尔泊肽与诺和诺德的司美格鲁肽已是医保降糖方案中的两大主力，今年医保新增的几款产品，又提供了双靶点、复方等选择，临床定位也从通用方案转向更细分的场景。例如，诺和诺德的依柯胰岛素司美格鲁肽，面向需要使用胰岛素但顾虑体重增加的后线强化治疗患者，提供“基础胰岛素周制剂+GLP-1”的组合方案。</p>\n  <p>痛风是另一个典型案例。过去，痛风急性发作主要依靠秋水仙碱等药物加以控制，其作用机制是在炎症反应的下游环节进行较为宽泛的抑制，且需每日服药，存在肝肾负担。今年被纳入医保的金赛药业伏欣奇拜单抗，则在炎症源头阻断IL-1β，实现“半年注射一次”的长效作用。</p>\n  <p>与此同时，一些近年来患者基数持续增长的常见病，同样迎来治疗方案更新。此类疾病虽未必严重，但发作时对患者生活质量的影响较为显著。</p>\n  <p>偏头痛就是典型案例之一。职场压力之下，偏头痛在年轻上班族群体中愈发高发。过去，患者多依靠布洛芬、曲坦类应急止痛，副作用多、难以长期坚持。神基制药的夫瑞奈珠单抗是一款靶向CGRP通路的偏头痛预防单抗，治疗方式为每月或每季度注射一次，降低了长期管理的负担。</p>\n  <p>再比例流感。在“老药”奥司他韦之后，本轮PA靶点流感新药的竞争焦点是“单次服药覆盖全程治疗”。最早上市的是罗氏的玛巴洛沙韦（“速福达”）；去年起，同机制国产新药集中获批，但因上市首年未赶上医保准入，主要拓展院外药店市场。彼时亦有从业者向36氪表示，进入医保、取得院内“入场券”，将成为2026年流感新药的核心议题。</p>\n  <p>今年，济川药业的玛硒洛沙韦率先被纳入医保，成为国产PA靶点流感新药中首个享受医保报销的产品。后续其他国产企业是否跟进、以何种节奏跟进，或将在一定程度上决定谁能成为“国产版速福达”。</p>\n  <p>同样值得关注的是，部分临床呼声较高的药物并未能进入医保目录。例如抗失眠的“雷生”系列：今年，卫材的莱博雷生、先声药业的达利雷生、扬子江的法赞雷生均申报了医保谈判，最终无一入围。</p>\n  <p>“雷生”系列失眠药物2025年才开始陆续上市，“非精神管制”的定位使其在自费市场已具备一定销量基础，并享有较高定价。例如，先声药业对达利雷生今年的销售预期已达7亿元。因此，企业短期内以大幅降价换取医保放量的意愿可能相对有限。</p>\n  <p>（刘良为化名）</p>", "category": "tech", "published_at": "2026-11-16T00:30:00+00:00", "fetched_at": "2026-11-16T04:29:16.538396+00:00", "fingerprint": "8434a4f7df3c2d2a"}, {"source": "36氪 - 最新文章", "title": "晶泰孵化的虚拟细胞公司完成Pre-A轮融资，华盖、红杉、星连等投资超亿元｜36氪首发", "url": "https://36kr.com/p/4071054629737606?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，虚拟细胞公司「无界进化」已完成超亿元Pre-A轮融资。本轮融资由星连资本、Prosperity7、华盖资本、华控基金及德同资本等机构联合投资，老股东顺为资本、红杉中国和松禾资本追加。这也是公司在半年内完成的第二笔融资。</p>\n  <p>无界进化方面称，本轮资金将用于推动细胞响应预测、科学假说检验与高通量自动化实验反馈的深度协同，打造覆盖“靶点发现-虚拟筛选-临床方案优化”的AI生物学平台。</p>\n  <p>2026年来，虚拟细胞概念从论文走向资本市场。动脉智库统计称，全球虚拟细胞领域的融资总额已突破30亿美元。资本快速向该赛道集中的原���并不复杂。过去几年，AI制药的进展主要集中在分子层面，生成能结合靶点的化合物的算法已相对成熟，但分子进入细胞之后会发生什么，仍需要实验验证。而虚拟细胞希望补齐的正是这一环节，它希望帮助研究者在做实验之前，判断哪些方向更值得投入。</p>\n  <p>但预测要可信，前提是模型见过足够多、足够好的细胞扰动数据。这恰恰是行业公认的瓶颈。有研报测算，当前可用的高质量、带标记扰动数据，距离模型训练需求还差约1000倍，阴性结果尤其稀缺，因为失败实验很少被发表，药企内部数据也不会对外共享。但持续、标准化地生产有因果意义的实验数据需要时间，于是，企业间的竞争重心也开始从“谁的模型更聪明”，转向“谁能把预测更快送回湿实验验证”。</p>\n  <p>无界进化由晶泰科技（02228.HK）孵化成立，核心资产便是覆盖细胞多组学的虚拟细胞基础模型系列OCOO，已发布基于转录组数据训练的虚拟细胞基础模型OCOO-T，可直接对细胞在扰动下的基因表达变化建模。通俗地说，就是输入“用什么药、敲掉哪个基因、作用多久”，模型便会尝试输出“这批细胞的转录组会怎么变”。</p>\n  <p>在Tahoe100M、Replogle、PBMC三个单细胞扰动权威基准的同条件评测中，OCOO-T已取得领先表现。这类预测虽还不能替代动物实验或临床，但可以在立项、靶点比较和实验排序阶段，帮研究者少走一些弯路。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_bfdf5e4e8507452fb3df86e3c8e3f6d9@5930287_oswg1378990oswg1430oswg798_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：无界进化</p>\n  <p>但只做模型，在今天的AI4S赛道已经不是新鲜故事。无界进化提出一套名为“递归科学发现（Recursive Scientific Discovery，RSD）”的机制。它借用了AI领域“递归自进化（RSI）”的思路，但把改进对象从模型本身扩展到了科研过程。例如，科研问题如何提出、假说怎么推演、分析怎么做、实验成功和失败分别留下什么……这些都将被不断记录、关联和复用。</p>\n  <p>目前，无界进化已基于这套机制推出两个产品。首先是假说挖掘引擎The Popper Projec（TPP），通过接入科研智能体和多源数据库，它会生成、质疑并完善可检验的假说，用可追溯的推理链标出证据和空白；另一个是Karl Workbench科研工作台，试图把记录、积累、产物、监督、进化变成日常研究流程的一部分，现已开启内测。</p>\n  <p>无界进化方面提供的信息称，今年10 月，在耶鲁大学、Broad研究所等机构联合发布的科研Agent基准SciAgentArena复测中，搭载DeepSeek基础模型的Karl Workbench“在单细胞组学与空间组学两个场景均获第一”。</p>\n  <p>与此同时，模型预测得再准、假说推演得再完整，最终都要回到证据。因此，无界进化的另一半“答案”在实验台上。公司搭建了一套覆盖细胞培养、扰动和多组学检测的自动化实验体系。在模型挑出更值得验证的方向，完成实验检验预测并产生新数据后，新数据会再用于改进模型。</p>\n  <p>这其实就是AI4S企业反复提及的“干湿闭环”。其难点在于稳定转动，因为实验通量、数据标准化或任何一个环节出问题，模型都有可能无法达成预期成果。对此，无界进化的应对方式是，是把实验体系和数据管理一起做，前端用自动化设备提高通量，后端用统一的数据与研究产物管理机制，再把每次实验的结果接回模型。</p>\n  <p>除此之外，临床场景是更“硬核”的检验方法。据无界进化方面表示，公司已参与由北京大学第一医院牵头的“肝胆胰肿瘤类器官培养与智慧诊疗北京市重点实验室”共建，希望将虚拟细胞能力接入患者来源的类器官样本，让AI预测与真实样本上的实验结果相互校正。“这或许比在公开数据集上刷分要慢，却是虚拟细胞进入药物研发一线的必经之路。”无界进化方面表示。</p>\n  <p>另据介绍，晶泰科技的产业背景将为无界进化提供另一层支撑。前者在分子设计、自动化合成及药物管线上的积累，使“分子生成—细胞响应预测—湿实验验证”有可能在同一体系内衔接，也使得模型能从研发早期就面对真实管线，而非只是公开基准。</p>\n  <p>“药物研发的尺度，既在于分子工程的精度，也在于人类对复杂生命与疾病机制理解的深度。我们希望把海量生物学数据、大模型与自进化方法耦合起来，提升创新药研发的确定性。联合创始人赵亚龙则提到，本轮融资将主要用于基础大模型研发、高通量自动化干湿闭环体系扩容和产业生态建设。”无界进化联合创始人赖力鹏表示。</p>", "category": "tech", "published_at": "2026-11-16T00:30:00+00:00", "fetched_at": "2026-11-16T04:29:16.538387+00:00", "fingerprint": "4855f0bf3062fb51"}, {"source": "36氪 - 最新文章", "title": "哈工大团队创立、李泽湘出手，AR潜水面镜公司融资数千万｜硬氪首发", "url": "https://36kr.com/p/4070604926850185?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，星域蔚蓝（深圳）科技有限公司（以下简称「星域蔚蓝」）近日完成数千万元天使+轮融资，本轮投资方为湖南财信。此前种子轮及天使轮投资方为初心资本、华山资本、香港X科技基金。资金将重点投向核心光学模组与水下可靠性体系的技术迭代，完善AR潜水互联系统的配套硬件生态，并加速全球渠道布局与规模化量产交付。</p>\n  <p>星域蔚蓝成立于2025年，聚焦水下智能AR装备赛道，专注极端水环境下光波导光学系统、潜水计算算法与高可靠性水下硬件的研发与制造。公司推出全球首款AR潜水电脑面镜AREX ONE，目前主要面向水肺潜水场景，覆盖休闲潜水与技术潜水等不同需求。该产品自上线Kickstarter众筹以来，累计筹得资金超700万港币，计划于2027年正式开启全球交付。</p>\n  <p>核心团队具备机器人、AI+AR技术与深度潜水的交叉复合背景。创始人兼CEO王静攀毕业于哈尔滨工业大学，曾参加RoboMaster机甲大师赛事，具备机器人硬件开发背景，主导的多款硬件方案曾实现产业化应用；联合创始人兼产品负责人陈睿拥有东南大学、蒙纳士大学双硕士学位，研究聚焦AR人机交互，AI应用落地。两人在高中时期便是队友，曾共同参加世界级机器人赛事。CMO Max为法国籍资深潜水从业者，拥有8000余次潜水实践经历，具备专业水下影像制作相关从业经历。公司多名核心成员持有CCR闭路循环呼吸器潜水资质，可完成百米级深度实机下潜验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_1ed29de7252048d6897d21752924103b@6022551_oswg428036oswg596oswg900_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">法籍同事Max在仙本那测试产品（图注/企业）</p>\n  <p>Max加入团队的过程，也是这款产品获得专业潜水用户认可的缩影。王静攀向硬氪介绍，Max最早以测试用户的身份接触 AREX，曾三次专程来华参与产品实测，在第三次测试结束后选择正式加入团队。他既能够输出一线水下实操经验，也依托自身在海外潜水社群的资源，协助团队在真实场景里持续验证产品方案、校准设计取舍。</p>\n  <p>潜水硬件长期属于一个技术演进相对缓慢的品类。以代表性的潜水电脑为例，作为潜水员获取深度、时间、减压信息的主要工具，数十年来始终以腕表形态为主。</p>\n  <p>这种形态带来了天然的交互短板：潜水过程中，用户需要频繁抬腕低头查看数据。尤其在技术潜水这类对信息密度要求极高的场景，反复查看腕表会持续分散潜水员的注意力。而潜水又是一项对安全冗余要求极高的运动，深度、免减压时间、气体余量、上升速率等指标直接关乎生命安全，数据能否及时、直观地被潜水员获取，是水下安全体验的底层基础。</p>\n  <p>尽管存在明确的体验与安全升级需求，但想要实现突破性创新，却绕不开水下场景带来的双重工程挑战。</p>\n  <p>一方面，传统光学方案无法在水下极端环境中保持可靠显示，普通AR光波导模组在水下十余米即可能因压力而失效；另一方面，潜水场景的考验远高于普通消费电子，海水盐雾腐蚀、剧烈的冷热温差、持续高压环境，多重极端条件叠加，对硬件整体工程设计提出极高的挑战。</p>\n  <p>“当时，市场部分声音一度认为，光波导的基础技术走向成熟，AR眼镜行业或将迎来类似iPhone时刻的产业拐点。但经过严谨调研后我们发现事实并非如此。” 星域蔚蓝创始人王静攀告诉硬氪，消费级AR眼镜普遍面临重量、功耗、算力难以同时兼顾的“不可能三角”，佩戴体验不佳，因此退货率居高不下。</p>\n  <p>并且，“即便基础光波导方案在陆上得到验证，也不代表能直接复用至水下环境，会对光学结构提出完全不同的要求，这恰恰是我们看到的机会。”王静攀说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_bc6842a3765748709bcdbb0fe76e785e@6022551_oswg68068oswg510oswg348_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">水下光波导展示（图注/企业）</p>\n  <p>亲身潜水经历、用户调研与技术条件的变化，让团队逐步明确了产品切入点。在王静攀看来，这一场景恰好绕开了陆上AR眼镜最难解决的几组矛盾。第一，潜水员对深度、时间、气体余量等关键数据的需求几乎是全时段的，不同于普通智能眼镜“偶尔调用”的使用频率，数据一旦出现延迟或缺失，直接关系到用户的生命安全。在这一场景中，能否及时、清晰地读取关键信息，为近眼显示提供了明确的应用需求。</p>\n  <p>其次，水下浮力天然抵消了设备的重量负担。对比普通AR眼镜每增加一点算力，就要以克为单位反复取舍；在水下，浮力让设备可以承载更强的算力与更丰富的显示能力，恰好为AR体验的发挥释放了空间。</p>\n  <p>第三，潜水人群具备高净值、高客单价的消费特征。目前全球持证潜水员超过3000万人，这一群体对专业装备的付费意愿与付费能力远高于普通消费电子用户，足以支撑一个创新品类在供应链尚未成熟、成本偏高的早期阶段完成商业化闭环。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_da1acdce921143d58c1861c7d80203d6@6022551_oswg139732oswg768oswg1024_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">团队使用AR潜水眼镜探索沉船（图注/企业）</p>\n  <p>具体到产品端，AREX ONE的核心突破，在于将一套完整的潜水电脑系统与AR显示模组集成于面镜形态之中。</p>\n  <p>这一形态变化的意义不仅是“把数据搬到眼前”，而在于改变了用户在水下读取信息的方式，将关键数据持续呈现在视野中，让潜水员在不中断对外界观察的前提下完成信息获取，减少因转移视线而产生的注意力分散。</p>\n  <p>但王静攀也指出，水下信息交互的核心矛盾，从来不是简单堆砌数据，而是如何在恰当时机输出匹配当下场景的有效信息。水下环境中，信息过载和信息缺失同样会带来安全隐患。</p>\n  <p>基于这一判断，AREX ONE在显示逻辑上做了场景化分层适配。面向休闲潜水，界面优先收敛至深度、免减压时间、上升速率这类最关键的安全指标，尽可能减少视觉干扰；当用户切换至技术潜水模式时，设备便会调出基于 ZHL\u001e16C 算法的全套专业参数，包括组织氮气负荷、氧分压（PPO₂）、预计到达水面时间等，支撑潜水员完成深度停留、气源切换等关键决策。不止预设模式，产品还允许用户通过配套App调整各类数据字段的展示位置与优先级。</p>\n  <p>这套分层设计并没有止步于软件界面。AREX ONE的核心产品思路，是将潜水面镜本身作为基础的计算与显示终端，再依靠模块化互联系统，让用户按照自身的潜水场景按需拓展能力。</p>\n  <p>面镜本体之外，整套互联系统包含多款选配配件，可以叠加气体监测、生物识别、照明等模块。比如空气集成发射器，能够同时采集多个气瓶的余量数据，适配侧挂潜水、频繁切换气源的技术潜水场景；Sync自适应潜水灯实现免手持照明，光束跟随使用者视野；AI海洋生物识别模块同时支持水下录像，潜完水之后可自动生成海洋生物图鉴与潜点地图。</p>\n  <p>除了记录潜水日志，App还能留住潜水中的发现。海洋生物图鉴可以帮助用户认识这些生物，并逐渐积累自己的探索记录。</p>\n  <p>为扛住水下高压、盐雾腐蚀等极端工况，硬件层面也做了针对性工程设计，主要围绕水下极端环境的可靠性展开，满足多日连续潜水与出海场景的使用需求。按照团队的设计思路，光学、结构和软件需要协同考虑：既要在水压、温差和海水环境下保护精密光学元件，也要结合环境光线、水体条件和潜水员的观察习惯，判断信息是否清晰、是否适合在当时出现。</p>\n  <p>目前，AREX ONE正加快推进量产工艺优化与可靠性验证工作。据团队介绍，产品已完成120米深度的水压测试，团队成员和内测KOL还携带设备奔赴斯洛文尼亚洞穴、佛罗里达地下洞穴系统、马耳他潜艇残骸等复杂水下环境，完成了多次百米级真实场景下潜实测。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_216e0c25fc054da389403a11dafdca93@6022551_oswg438753oswg717oswg400_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">横跨亚欧美的潜水KOL对AREX ONE进行了测评（图注/Youtube&amp;Ins）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261115/v2_9abc3c393b3b49de8257fbd9ee0dca85@6022551_oswg19255083oswg5184oswg3888_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">已完成120米深度的水压测试（图注/企业）</p>\n  <p>按照规划，AREX ONE将于2027年开启全球交付，并逐步展开更大规模的市场动作。当前，团队将优先完成潜水产品的验证、量产与交付，并把首批用户的持续使用反馈带回研发。更长期看，近眼显示与端侧AI也可能拓展至其他户外运动场景，但仍需围绕不同运动的实际需求逐一验证。</p>\n  <p>星域蔚蓝正以水下光波导技术为底座、搭配可拓展的模块化硬件生态，推动潜水电脑从传统腕表形态向AI驱动的水下智能交互终端升级。</p>\n  <p><strong>以下为硬氪与星域蔚蓝创始人王静攀的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：AR/VR眼镜在消费市场已经发展多年，也曾经历“百镜大战”，为何面向潜水场景的AR产品直到近几年才迎来创业团队入局，背后原因是什么？</strong></p>\n  <p><strong>王静攀：</strong>潜水场景对于水下实时数据的强需求早已客观存在，甚至相比绝大多数陆地AR使用场景，它的需求刚性要高得多。</p>\n  <p>传统装备体系下，潜水员获取深度、免减压时间、气体余量等关键安全数据，只能依靠抬腕查看腕表式潜水电脑。而在技术潜水、沉船渗透、洞穴潜水这类环境复杂、风险等级更高的作业场景，潜水员需要持续观察周遭水下环境，哪怕只是短暂将视线从环境移向手腕，都有可能忽略周边风险，埋下安全隐患。</p>\n  <p>也正因如此，把潜水关键数据直接投射在潜水面镜视野内，摆脱反复抬腕看表的交互局限，这一构想在全球潜水行业已经被探讨、尝试了十余年。但受限于光学硬件方案的短板，早期的技术路径很难解决视野遮挡问题。过去原型产品大多采用不透光屏幕、普通棱镜方案，数字显示会侵占实景视野，在水下会带来显著安全风险，难以投入实际使用。</p>\n  <p>直到近两三年，消费级光波导技术逐步走向成熟，它最核心的特质就是透光显示，能够做到实景环境与数字信息在同一视场共存，用户一边观察真实水下世界，一边读取叠加的潜水数据，不会割裂视野。</p>\n  <p>不过也要区分，消费端成熟不等于水下可用。市面通用光波导模组是按照陆地常压环境设计，面对水下高压、盐雾腐蚀、冷热剧烈冲击会出现结构损坏、光学偏移等问题。我们正是踩在光波导技术从实验室走向产业化的窗口入局，在此基础之上重新完成光学、结构、材料层面的改造适配。如果没有光波导技术的成熟作为基础，这套面向真实潜水使用的 AR 面镜，放在两年前根本不具备落地的可能性。</p>\n  <p><strong>硬氪：潜水是对安全与品牌信任门槛极高的领域，装备可靠性直接关系水下生命安全。作为行业新入局的创业品牌，如何在专业潜水群体当中建立信任？</strong></p>\n  <p><strong>王静攀：</strong>潜水是典型的高信任成本赛道。和普通消费电子不同，潜水装备属于安全关键设备，专业潜水用户评判一个新兴硬件品牌，并不会只看产品概念有多创新。相比功能参数，他们更关心三件事：产品能否按规划稳定交付、创业团队能否长期持续运营、对外公布的性能数据与水下实测结果是否真实可信。一旦以上任何一环存疑，即便产品方案听起来十分亮眼，也很难获得专业群体的接纳。</p>\n  <p>所以我们在对外内容输出上设置了非常严格的标准。市面上有些产品会使用AI生成的画面来展示产品效果，但潜水装备不能这么做。我们对外放出的所有水下实拍影像、深海测试画面，全部留存完整的原始拍摄档案与测试记录，每一段演示素材都来源于真实下潜测试，避免给潜水员传递错误的产品预期。</p>\n  <p>信任的另一层来源，来自团队自身对潜水场景的深度理解与实操验证。星域蔚蓝团队中，很多核心成员本身就是持证高阶潜水员，其中多人持有CCR闭路循环呼吸器潜水资质，可完成百米级深度实机下潜验证，能够站在使用者视角去理解装备在真实水下会遇到的各类风险。产品从实验室压力测试，到洞穴、沉船等复杂高危环境的实地下潜验证，不少测试都是团队成员亲自携带样机完成。</p>\n  <p>在潜水这个圈层属性极强的垂直行业，光靠营销宣传很难建立公信力。真正能够打动用户的，是真实可追溯的测试记录、团队亲身下场的大量实机验证，以及垂直社群当中专业潜水爱好者、KOL自发的实测反馈，这也是新品牌建立信任最扎实的路径。</p>", "category": "tech", "published_at": "2026-11-16T03:00:00+00:00", "fetched_at": "2026-11-16T04:29:16.538372+00:00", "fingerprint": "8381f3c05996bacf"}, {"source": "少数派", "title": "Aerial Switcher：给 Mac 的航拍壁纸排个时间表", "url": "https://sspai.com/post/118392", "summary": "既然 Apple 已经把同一个地方的美景从早到晚拍了一遍并做成了壁纸，为什么不能让它们跟着时间自动切换？<a href=\"https://sspai.com/post/118392\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-15T07:55:16+00:00", "fetched_at": "2026-11-16T04:29:14.905383+00:00", "fingerprint": "8027af1ee822c084"}, {"source": "少数派", "title": "派早报：逾十万人次联署要求黄仁勋复职", "url": "https://sspai.com/post/119119", "summary": "<p>逾十万人次联署要求黄仁勋复职</p><p>Microsoft 365 服务在 19 小时全球宕机后恢复</p><p>国产前沿模型携带 Blackwell GPU 特征</p><p>线缆更换导致全美飞机停飞</p><p>流媒体用户抱怨更难找到想看作品</p><p>特斯拉 Cybercab 订阅协议包含苛刻条款</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/119119\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-15T23:24:34+00:00", "fetched_at": "2026-11-16T04:29:14.905377+00:00", "fingerprint": "94cb53c5b6f8be64"}, {"source": <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
