<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>
</head>

光的衰减，影响视觉成像；激光在水中的传播距离也受到限制。NOAA对于海水光衰减的监测同样显示，水体浑浊度越高，可见光的有效传播深度越低。</p>\n  <p>超声波因此成为水下探测的重要技术路线。</p>\n  <p>传统水下超声主要使用压电陶瓷（PZT）换能器，通过压电材料振动产生和接收超声波。这类器件能够提供较高的声功率，因此仍适合长距离声呐等应用，但在机器人需要的小型化、高密度阵列和成像场景中存在局限。</p>\n  <p>芯旸微的技术栈是CMUT（电容式微机械超声换能器）路线。它通过MEMS半导体工艺在晶圆上制造微型振膜，可以布置成高密度二维相控阵列，同时具有较宽频带。</p>\n  <p>已有研究显示，CMUT阵列能够实现水下超声成像，并具备宽带和阵列化特征。这使得其更适合安装在机器人本体上完成近场环境感知和3D声学成像。</p>\n  <p>芯旸微创始人曹金龙告诉36氪，“传统声呐更适合千米级远距离探测，公司目前瞄准的是机器人周边约0-20米范围内的近场感知。”</p>\n  <p>芯旸微目前提供的并非单独一颗CMUT芯片，而是一套由CMUT阵列、ASIC集成芯片及相关软硬件组成的声学感知模组。公司选择的首个商业化落地场景是泳池清洁机器人。</p>\n  <p>灼识咨询数据显示，2025年全球约有3410万个泳池，泳池清洁机器人年出货量约490万台，预计2030年增至700万台；2025年全球泳池机器人零售额约28亿美元。</p>\n  <p>泳池机器人市场在快速发展，参与其中的不少为中国企业。</p>\n  <p>曹金龙介绍称，目前不少泳池机器人仍主要依靠陀螺仪、单点超声或视觉辅助定位。机器能够运动，却很难准确知道哪些地方已经清洁、哪些没有。</p>\n  <p>芯旸微希望用阵列式声学成像改变这一状态。按照公司测试数据，搭载其模组后，泳池机器人的清洁覆盖率可以达到95%以上，并能够进一步实现区域识别和路径规划，使得泳池清洁机器人更智能化和可控制性。</p>\n  <p>目前，芯旸微已经完成多轮流片并进入小批量阶段，并与多家泳池清洁机器人企业开展产品需求、测试和供应链合作。</p>\n  <p>曹金龙表示，泳池是公司主动选择的第一站。相比医疗超声，它对成像精度、认证和产品导入的要求更低，可以更快验证芯片和模组，并形成早期收入。</p>\n  <p>完成泳池场景后，芯旸微计划继续沿水下场景扩展，下一步包括消费级水下领航测绘扫描机器人，通过移动测绘扫描鱼群、水下装备、水下救援等场景，再进入水产养殖，通过声学感知获取鱼群数量、活动深度等数据，为投喂和养殖管理提供信息。未来芯旸微的CMUT技术还将应用于机器人与人脑之间的交互，形成人脑直接控制机器人大脑的可穿戴智能设备。</p>\n  <p>团队方面，创始人兼CEO曹金龙此前先后任职科沃斯和霍尼韦尔，工作经历横跨消费级机器人和上游传感器；研发团队拥有十年以上CMUT研发经验，已完成了多种芯片设计和工艺制程技术积累。</p>\n  <p>长期来看，芯旸微希望将CMUT的能力从“感知”进一步延伸到“通信”。由于超声器件既可以发射也可以接收声波，公司最终将其做成水下机器人的信息端口——既负责“看见”周围环境，也负责与外部交换信息。</p>\n  <p><strong>CEO对谈</strong></p>\n  <p>36氪：采用CMUT技术路线的芯片此前更多用于医疗，你们为什么首先选择泳池机器人，而不是从技术门槛更高的医疗产品开始？</p>\n  <p>曹金龙：我们早期其实看过血管超声、心腔超声、颅脑超声，也看过无创脑机接口。但这些产品投入很大，研发和商业回报周期都很长。对于一家早期创业公司来说，如果一开始就进入高投入、短期又没有收入的市场，风险非常高。</p>\n  <p>泳池机器人对成像精度的要求没有医疗那么高，产品导入和试错成本也低得多。对我们来说，它可以同时形成技术闭环和商业闭环。先通过一个真实市场验证产品，让公司活下来、积累客户和资金，再向更高端的场景拓展，这是我们选择的路径。</p>\n  <p>36氪：CMUT技术在海外已经发展很多年，中国公司现在切入水下机器人，机会在哪里？</p>\n  <p>曹金龙：中国最大的优势还是下游机器人产业的发展速度。很多泳池机器人、水下智能硬件本身就是中国团队研发、面向全球销售，我们离客户非常近，可以更快拿到真实需求，再针对需求去定义芯片。</p>\n  <p>国外CMUT公司过去主要面向医疗市场，已经形成比较成熟的产品和商业模式，但医疗芯片不能直接拿到水下使用，需要重新设计器件和ASIC。我们反而可以从一开始就围绕水下场景定义产品。</p>\n  <p>当然，中国目前也有短板，主要是在芯片制程环节。我们现在的量还不够大，可选择的代工资源有限，所以也在通过中试平台和新的制造合作伙伴解决量产问题。</p>", "category": "tech", "published_at": "2026-08-18T01:00:34+00:00", "fetched_at": "2026-08-19T00:58:09.479967+00:00", "fingerprint": "9a36a874014d868b"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜小米集团二季度智能电动汽车及AI等创新业务收入249亿元；百度二季度总营收313亿元，AI业务收入占比连续过半；我国在量子技术国际标准领域取得新进展", "url": "https://36kr.com/p/3944909708393602?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>小米集体：二季度智能手机全球平均售价同比提升25.9%，创历史新高</strong><br />小米集团发布2026年第二季度财报。报告期内，小米智能手机业务营收421亿元。第二季度，得益于在全球范围内主动调整产品结构，小米手机全球平均售价同比提升25.9%至1351元，创历史新高。</p>\n  <p><strong>小米集团：二季度智能电动汽车及AI等创新业务收入249亿元</strong><br />36氪获悉，小米集团发布2026年第二季度财报。财报显示，智能电动汽车及AI等创新业务收入增至249亿元，同、环比均实现两位数增长。小米新车当季交付超10.4万辆，同比增长28.2%。</p>\n  <p><strong>平安好医生：2026年上半年净利润2.19亿元，同比增长63.5%</strong></p>\n  <p>36氪获悉，平安好医生公布2026年半年度业绩报告。报告期内，录得归母净利润2.19亿元，同比增长63.5%；调整后净利润2.27亿元，同比增长37.7%。报告期内AI业务贡献毛利占比约4.6%。公司\"AI+真人医生\"服务体系，已全面接入平安集团全系生态App，覆盖集团100%个人客户。</p>\n  <p><strong>百度：主板转换预计年内生效，8月26日召开股东大会寻求批准</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报披露，主板转换预计将于今年内生效。7月，百度发布公告，拟在香港联合交易所主板进行自愿转换上市，港交所已确认该申请。百度将于8月26日召开股东特别大会，就相关事项寻求股东批准。</p>\n  <p><strong>爱奇艺：二季度总收入62.9亿元，环比增长1%</strong></p>\n  <p>36氪获悉，8月18日，爱奇艺发布截至2026年6月30日未经审计的第二季度财报。二季度爱奇艺总收入62.9亿元人民币，环比增长1%。其中，会员服务收入40.1亿元，在线广告服务收入12.5亿元，内容发行收入6.8亿元，其他收入3.4亿元。</p>\n  <p><strong>百度：二季度总营收313亿元，AI业务收入占比连续过半</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报显示，二季度总营收313亿元；一般性业务收入252亿元，其中AI业务收入占比50%，已连续两季占比过半。二季度百度AI云基础设施收入73亿元，同比增长50%，其中GPU云同比增长283%，已连续四个季度实现三位数增长；AI应用收入25亿元，同比增长3%；AI原生营销服务收入26亿元。</p>\n  <p><strong>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</strong></p>\n  <p>8月18日，苹果公司首次承认，监管的变化迫使其对App Store的控制被放宽，也因此拖累了其超过1000亿美元的服务业务。这一罕见声明表明，反垄断行动正开始侵蚀该公司最盈利的业务部门之一。苹果在最新的监管文件中警告称，通过替代支付系统进行的购买交易“可能完全无法获得佣金”。并且本月其报告的服务收入和利润率低于华尔街预期。（财联社）</p>\n  <p><strong>宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%</strong></p>\n  <p>8月18日，宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%。（财联社）</p>\n  <p><strong>万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个</strong></p>\n  <p>新任董事长徐恩利履职后的“第一把火”，烧向了万科的组织架构。万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个，原办公事业部负责人卢冰同步转任中航万科负责人。该事业部设立于2024年10月，至本次调整撤销，存续仅22个月。不过，万科集团网站已悄然完成组织架构信息更新：目前仅保留物业、商业与酒店、长租公寓、海外、食品、物流及财顾7个事业部，办公事业部已从列表中剔除。这是继2025年9月万科大规模调整组织架构、确立“集团总部+地区公司+事业部”新格局后，又一次关键精简。此次调整，亦被业内普遍视作徐恩利上任后的首个重大动作。（中国房地产报）</p>\n  <p><strong>蚂蚁健康收购医疗服务商风石健康</strong></p>\n  <p>36氪获悉，8月18日，蚂蚁健康正式宣布，收购国内医疗健康服务商风石健康，以完善“医保+商保”的一站式直付体验。蚂蚁健康除了可为患者在公立医院就医提供“医保+商保”同步结算服务，还可链接风石健康覆盖的超1500家私立医院与公立医院国际部，为中高端医疗险患者提供刷脸和刷码“商保直付”服务。</p>\n  <p><strong>今日起，阿里“千问办公”接入企业微信</strong></p>\n  <p>36氪获悉，8月18日，阿里旗下Agent产品“千问办公”正式接入企业微信。此前，该产品已接入钉钉和飞书。至此，“千问办公”实现国内三大主流协同办公平台的全面支持。</p>\n  <p><strong>豆包工作任务上新，可以在虚拟桌面操作Windows</strong></p>\n  <p>36氪获悉，据豆包消息，豆包工作任务模式继续上新，全新的豆包虚拟桌面已在Windows版本上线，豆包操作电脑的能力再次升级。在豆包电脑端选择工作任务模式和本地电脑，在技能栏选择“操作电脑”，完成授权后，在虚拟桌面里，豆包就可以像人一样查看电脑屏幕、移动鼠标、点击按钮、敲键盘，帮用户在电脑端继续推进复杂任务。</p>\n  <p><strong>阿里云启用韩国第三��数据中心，Agentic AI服务同步上线</strong></p>\n  <p>36氪获悉，8月18日消息，阿里云在韩国的第三座数据中心正式上线，并同步推出Agentic AI相关服务，进一步满足当地市场持续增长的AI及云计算需求。近期，阿里云已先后在法国、日本、马来西亚、墨西哥等市场持续完善AI与云基础设施布局。本轮扩建完成后，阿里云全球基础设施将覆盖30个地域、104个可用区，并计划进一步拓展至巴西等国家和地区。目前，阿里云在亚太云计算市场排名第一。</p>\n  <h2>投融资：</h2>\n  <p><strong>“恒湾科技”完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，恒湾科技（ZILLNK）近日宣布完成数亿元人民币B轮融资，本轮由深创投领投，国开科创、沃赋创投、东山精密等跟投。资金将主要用于核心芯片自研、AI-RAN与6G技术研发，以及海外市场的深化布局。</p>\n  <p><strong>“安澜德健”完成近亿元A轮融资</strong></p>\n  <p>36氪获悉，据启明创投消息，日前，“安澜德健”宣布完成近亿元A轮融资，由启明创投独家投资。本轮募集资金将主要用于加速推进公司核心产品OpusOne™的国内注册临床试验进程，并全面支持其海外早期临床试验的申报与开展。</p>\n  <p><strong>“思昇科技”完成数千万元种子+轮融资</strong></p>\n  <p>36氪获悉，近日，AI驱动的超声脑机接口公司“思昇科技”宣布完成数千万元种子+轮融资。本轮融资由国汽投资领投，元禾璞华、全球健康产业创新中心（GHIC）跟投，老股东英诺科创基金、水木清华校友种子基金继续加注，由光源资本担任独家财务顾问。本轮资金将主要用于超声脑机接口核心技术研发、医疗器械产品推进、多模态脑数据与AI脑科学平台建设，以及跨学科人才团队扩充。新产品：</p>\n  <p><strong>共生知行发布人形机器人赛车Demo</strong></p>\n  <p>36氪获悉，8月17日，具身智能初创公司共生知行（Symbiosis Robotics）发布双足人形机器人驾驶卡丁车Demo，这是公司成立后首次系统展示“全身智能”阶段性进展。据了解，共生知行聚焦面向双足人形机器人的全身智能基座模型，尝试打通感知、决策、全身运动控制与数据训练链路。公司表示，未来将快速迭代发布共生知行的技术进展、Demo、开源项目等。</p>\n  <h2>今日观点：</h2>\n  <p><strong>中信建投：矿区自动驾驶行业有望进入S型加速阶段</strong></p>\n  <p>36氪获悉，中信建投证券研报认为，矿区自动驾驶区别于Robotaxi，封闭场景、刚性用工需求与明确的降本增效价值使其商业化路径更清晰，行业在渗透率突破10%后有望进入S型加速阶段。国内近10万台矿卡存量提供持续改造空间，大型煤矿车队扩容、金属矿项目复制及中小矿山下沉将支撑国内市场增长；海外澳大利亚等高人工成本市场单车服务价值显著高于国内，有望打开第二增长曲线。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>词元消耗成授信依据，银行积极试水“词元贷</strong><br />作为AI（人工智能）领域的专业术语，词元（Token）正在变成金融机构使用的“信用词汇”。近日，广东省首个词元经济专项金融产品“词元贷”在广州市海珠区发布，中国银行、中信银行、广州银行3家银行率先参与布局。其中中国银行已落地授信额度。受访专家认为，依托词元消耗数据形成的“技术账本”，正在成为银行构建信贷评估体系的新依据，其实质是企业信用评估在算力场景下的数字化延伸。“词元贷”回应的融资痛点真实存在，构建的数据信用逻辑亦有价值，但支撑该逻辑的数据基础设施、风控方法论及监管框架，目前仍在建设中。（证券日报）</p>\n  <p><strong>我国在量子技术国际标准领域取得新进展</strong><br />由我国牵头的《量子熵源随机性质量和测试方法学的概述和分析》国际标准提案近日正式获批立项。该标准将建立统一规则检验量子随机数真伪，填补通用检测方法空白，标志着我国在量子核心器件国际标准制定中迈出重要一步。（央视新闻）</p>", "category": "tech", "published_at": "2026-08-18T11:14:56+00:00", "fetched_at": "2026-08-19T00:58:09.479960+00:00", "fingerprint": "6395afd9ff2b4c72"}, {"source": "36氪 - 最新文章", "title": "平安好医生：企业健管稳健增长，AI业务兑现业绩", "url": "https://36kr.com/p/3945024705657988?f=rss", "summary": "<p>8月18日，平安好医生（1833.HK）公布了2026年中期业绩。</p>\n  <p>财报显示，平安好医生在2026年上半年实现收入24.84亿元，同比微降0.7%。作为公司发展的核心着力点，企业健管业务表现亮眼：同期收入同比增速高达65%，强劲增长助推该业务收入占比提升至28.7%，同比上升11.5个百分点，公司业务结构得到进一步优化。</p>\n  <p>利润方面，公司2026年上半年归母净利润录得2.19亿元，同比增长63.5%；调整后净利润为2.27亿元，同比增长37.7%。公司净利润在报告期内实现强劲增长的核心驱动因素，主要是业务结构的优化与业务质量的持续改善。</p>\n  <h2><strong>01 “四到”服务建设强化企业健管业务逻辑</strong></h2>\n  <p>“四到” （到线、到院、到家、到企）服务网络建设是实现线上线下全场景联动的关键，不仅显著提升了用户体验与黏性，而且是切入企业健管业务、深度挖掘B端资源的核心抓手。其业务端的核心亮点如下：</p>\n  <ul>\n   <li><strong>到线</strong>：“AI+真人医生”服务已覆盖平安集团100%的个人客户。</li>\n   <li><strong>到院</strong>：持续扩张线下优质资源，合作医院达3216家，其中三甲医院1732家；内外部医师团队规模已达5万人，签约专家超3700位，包括9名院士/国医大师及820余位正副院长、科室主任与学科带头人；在支付端，\"平安医健付\"已覆盖近24.5万家合作药店中的14.9万家。</li>\n   <li><strong>到家</strong>：联合平安人寿升级推出“平安居家”服务品牌，已将居家养老服务拓展至全国140城。</li>\n   <li><strong>到企</strong>：在全国多地深度推广“1124”企业健管体系，即以1个医务室为核心，依托1支专属到企的专员队伍，通过精准施策与精细运营双重赋能，以满足企业差异化需求，围绕员工提供筛查评估、医疗咨询、促进干预、应急福利等4大类一体化服务。</li>\n  </ul>\n  <p>在“四到”服务打通线上线下服务闭环的业务逻辑下，随着服务流程的延伸，企业健管业务作为公司业绩增长的核心动能，在今年上半年实现收入高增的同时，过去12个月内，公司服务的付费企业客户超7700家，同比增长超73%，该业务同期GMV突破17.9亿元。从公司整体来看，受益于“四到”服务建设，公司的收入结构得到了进一步优化。</p>\n  <h2><strong>02 AI赋能应用助力毛利提升</strong></h2>\n  <p>报告期内，公司在AI领域的主要进展包括：迭代升级\"平安医博通\"医疗大模型，完善5大医疗细分垂域专用模型；\"AI+真人医生\"的健管体系全面接入平安集团全系生态App；公司的相关医疗AI大模型可精准诊断超1.13万种疾病，辅助诊疗准确率接近96%，复杂疾病多学科会诊方案准确率近90%，达到行业领先水准。</p>\n  <p>与消费级通用大模型相比，公司AI业务的核心价值与护城河，主要在于闭源的医疗垂直数据库，以及专业能力更突出的医疗大模型；而精准诊疗疾病覆盖范围的持续扩大与诊疗方案的高准确率，均验证了这一体系的业务能力。</p>\n  <p>从业务开展的逻辑来看，依托公司自有数据库与医疗大模型能力，AI深度赋能“四到”服务建设，不仅显著优化了用户使用体验与提高留存率，而且大幅提升了公司服务的覆盖广度；尤其在严肃医疗领域，亦展现出了可观的业务价值。在财务层面，AI通过提升业务质量直接助力公司整体毛利的提升，报告期内，AI毛利贡献占比约4.6%。</p>\n  <p>&nbsp;</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-08-18T12:54:35+00:00", "fetched_at": "2026-08-19T00:58:09.479952+00:00", "fingerprint": "32209e1ce72bbdbe"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨董明珠出任格力技校校长，学费最高1.5万元；人均557万元，寒武纪部分员工“大红包”即将到账；宇树科技今日上市", "url": "https://36kr.com/p/3945701165202817?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>8月18日起，阿里“千问办公”接入企业微信</p>\n  <p>安踏前CEO徐阳首次回应离职</p>\n  <p>特斯拉据悉准备8月面向公众推出CyberCab</p>\n  <p>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</p>\n  <p>法拉利首款电动车Luce拍出4000万美元，成史上最贵新车拍品</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>入校即入企，董明珠任校长的格力技校招初中毕业生，学费最高1.5万元</strong></p>\n  <p>8月17日晚，格力电器通过官方公众号“格力文化”发布消息称，由格力电器创办的珠海市格力技工学校近日正式开启首届招生，招生将持续至9月中旬，格力电器董事长董明珠亲自担任学校校长。招生简章显示，首届招收300名学生，学费9000元至15000元/学年不等，开设9个招生专业，招生对象为全国应往届初中毕业生，年龄15-18周岁。格力称，学校施行“入校即入企，毕业即适岗”的办学模式。学生入学即可对接企业资源，毕业后优先进入格力电器及产业链企业实习就业。（界面新闻）</p>\n  <p><strong>人均557万元，寒武纪部分员工“大红包”即将到账</strong></p>\n  <p>8月17日晚间，寒武纪发布公告，56.1万股股权激励股份即将解禁，上市流通日期为8月20日。公告称，本次拟归属股票的激励对象共124名，合计分享59.76万股股票（其中：3.66万股来源于公司从二级市场回购的股票，56.1万股为即将解禁的公司向激励对象定向发行的股票）。以寒武纪昨日收盘价1156元/股估算，59.76万股股票价值合计6.9亿元，对应每人平均股票价值557.15万元。</p>\n  <p>公告显示，本次股票激励归属的依据，系寒武纪在2023年11月推出的《2023年限制性股票激励计划》中预留授予部分第一个归属期的归属结果。据Wind统计，在股票激励计划推出当月，寒武纪的股票均价为139元/股。上个月，寒武纪推出了《2026年限制性股票激励计划》，限制性股票授予规模达500万股，对应首次授予的激励对象总人数为945人，约占公司全部职工人数1107人的85.37%，股票授予价格（含预留授予）为750元/股。（21世纪经济报道）</p>\n  <p><strong>宇树科技今日上市，产业链核心标的曝光</strong></p>\n  <p>8月17日晚间，宇树科技（688836.SH）公告称，公司股票将于2026年8月19日在上海证券交易所科创板上市。本次发行价格为150.80元/股，发行后总股本为4.04亿股，其中上市初期无限售流通股3008.77万股，占总股本7.44%。公司发行价对应2025年摊薄后静态市销率为35.89倍，高于可比公司平均水平。</p>\n  <p>策略方面，东吴证券建议关注宇树链、T链、银河通用链以及零部件相关个股。其中，宇树链核心标的包括首程控股、美湖股份、中大力德、长盛轴承；T链相关个股包括恒立液压、三花智控、拓普集团、浙江荣泰、五洲新春；银河通用链核心标的是天奇股份；谐波用量预期上修，相关个股包括绿的谐波、斯菱股份；灵巧手板块相关个股包括兆威机电、汉威科技、新坐标。（21世纪经济报道）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>豆包工作任务上新，可以在虚拟桌面操作Windows</strong></p>\n  <p>36氪获悉，据豆包消息，豆包工作任务模式继续上新，全新的豆包虚拟桌面已在Windows版本上线，豆包操作电脑的能力再次升级。在豆包电脑端选择工作任务模式和本地电脑，在技能栏选择“操作电脑”，完成授权后，在虚拟桌面里，豆包就可以像人一样查看电脑屏幕、移动鼠标、点击按钮、敲键盘，帮用户在电脑端继续推进复杂任务。</p>\n  <p><strong>阿里云启用韩国第三座数据中心，Agentic AI服务同步上线</strong></p>\n  <p>36氪获悉，8月18日消息，阿里云在韩国的第三座数据中心正式上线，并同步推出Agentic AI相关服务，进一步满足当地市场持续增长的AI及云计算需求。近期，阿里云已先后在法国、日本、马来西亚、墨西哥等市场持续完善AI与云基础设施布局。本轮扩建完成后，阿里云全球基础设施将覆盖30个地域、104个可用区，并计划进一步拓展至巴西等国家和地区。目前，阿里云在亚太云计算市场排名第一。</p>\n  <p><strong>企业微信CLI、MCP不限企业全面开放，WorkBuddy、DeepSeek等Agent均可接入</strong></p>\n  <p>36氪获悉，企业微信全面升级CLI与MCP能力，WorkBuddy、Deepseek Harness、Minimax Code等AI Agent均可直接接入企业微信调用企微能力完成任务，企业也可基于开放接口接入自建Agent。此次开放升级，面向所有规模的企业全面开放，不再受企业人数、资质等门槛限制，覆盖文档、表格、邮件、会议、日程、通讯录等十个能力模块。本次CLI的全面开放也意味着企业微信进一步向AI生态敞开底层办公能力。</p>\n  <p><strong>OpenAI宣布推出ChatGPT青少年版</strong></p>\n  <p>OpenAI宣布推出ChatGPT青少年版。若系统判断用户未满18岁，或用户自行声明年龄在13至17岁之间，将自动将其切换至ChatGPT青少年版。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%</strong></p>\n  <p>8月18日，宇树科技上市前获加密市场热捧，永续合约暗示股价涨幅或超300%。（财联社）</p>\n  <p><strong>王兴兴称上市是高考，拒绝股价炒作</strong></p>\n  <p>据报道，王兴兴曾表示把上市视为“高考”，公司上市之后，他也将面临更多的考试。王兴兴近期在网上投资者交流活动中回应了市场对于股价、估值以及上市后压力的关注。面对投资者关于股价炒作的提问，他表示，公司希望投资者是“认同公司的价值才买我们公司的股票”，而不是一味炒作；对于上市后的压力，他则回应称“有压力更有动力”，公司将用好募集资金，加快募投项目实施，并以良好的业绩回报股东。</p>\n  <p>王兴兴提到，公司一直怀揣“用科技推动人类社会进步”的初心，并认为当前正处于全球AI与具身智能技术突破的前夜。过去十年的积累，让公司已经拥有“奔赴梦想、实现梦想的底气与能力”。对于一家刚刚迈入资本市场的机器人企业来说，609亿元是新的起点，但这个起点究竟通向1000亿元，还是2000亿元，最终仍然要由机器人自己给出答案。（澎湃新闻）</p>\n  <p><strong>美股三大指数集体收跌，存储板块大幅回落</strong></p>\n  <p>36氪获悉，8月18日收盘，美股三大指数集体下跌，纳指跌1.33%，道指跌0.22%，标普500指数跌0.69%。存储板块大幅回落，Lumentum、闪迪、SK海力士跌超9%，西部数据、美光科技、康宁跌超7%；大型科技股涨跌不一，Meta跌超4%，英伟达跌超2%，特斯拉、亚马逊小幅下跌，苹果涨超1%，微软、谷歌小幅上涨。热门中概股多数下跌，百度跌超12%，爱奇艺跌超8%，小鹏集团跌超3%，理想汽车跌超2%，蔚来、哔哩哔哩跌超1%，阿里巴巴涨超2%，京东涨超1%，拼多多、网易小幅上涨。</p>\n  <p><strong>胖东来澄清，招聘不包含性侵犯罪人员</strong></p>\n  <p>近日，胖东来针对“无门槛招聘刑满释放人员”作出澄清。胖东来表示，并非无门槛接纳，明确排除性侵、严重暴力等恶性犯罪前科人员，且刑释人员需与其他应聘者走完全相同的报名面试流程，并设置6个月的双向选择试用期。首批入职人员也被优先安排在仓储、物流等后台岗位，以兼顾就业帮扶与安全管理。</p>\n  <p>据悉，这已经是胖东来第二年为刑释人员提供岗位。去年入职的30名刑释人员，入职一年实现零离职。创始人于东来表示，希望建立更好制度，帮助更多人有尊严、友善地生活，鼓励刑释人员自尊自重、向善而行。（荔枝新闻）</p>\n  <p><strong>李强签署国务院令，公布《国务院关于修改〈住房公积金管理条例〉的决定》</strong></p>\n  <p>国务院总理李强日前签署国务院令，公布《国务院关于修改〈住房公积金管理条例〉的决定》，自2026年9月20日起施行。《决定》共20条，主要规定了以下内容。一是拓宽提取和使用范围。对提取住房公积金支付房租，不再设置房租超过家庭工资收入规定比例的门槛限制；新增装修自住住房、支付自住住房物业费、国务院批准的其他住房消费情形等可以提取住房公积金的情形。适当拓宽住房公积金投资运用渠道，明确住房公积金管理中心可以将住房公积金用于购买政策性金融债。二是提升管理服务效能。简化职工申请提取住房公积金的手续，缩短住房公积金贷款申请的审查时限，实现住房公积金缴存记录等全国范围内互信互认，推动住房公积金转移接续、异地贷款等业务便捷高效办理。三是强化风险防控。国务院住房城乡建设主管部门确定住房公积金领域公共信用信息，住房公积金管理中心建立全面完整准确的信用记录并纳入全国信用信息共享平台；对以欺诈、伪造证明材料等手段违法提取住房公积金、获得住房公积金贷款的行为，规定了明确的法律责任。四是扩大制度覆盖面。明确个体工商户、非全日制从业人员以及其他灵活就业人员可以自愿缴存住房公积金，按照规定享受相应的政策支持。</p>\n  <p><strong>安踏前CEO徐阳首次回应离职</strong></p>\n  <p>8月18日，安踏前CEO徐阳发朋友圈首次回应离职原因，称因家人留学原因离职安踏，即将陪伴家人迁居美国洛杉矶。“没有安排任何一场道别，是因为辜负信任的愧疚和不愿示人的软弱，希望大家都好好的！”徐阳于7月15日因“家庭原因”辞任安踏品牌CEO一职，由集团联席CEO赖世贤代理。任职期间，他曾为安踏品牌立下流水年复合增长10%至15%的目标，但2025年主品牌增速为3.7%，与预期存在差距。而在更早的四年里，作为始祖鸟大中华区操盘手，他将该品牌中国业务从约8亿元推至近30亿元，店均年收入从200万元做到1亿元，被视为将始祖鸟从专业户外带向现象级品牌的关键功臣。（每日经济新闻）</p>\n  <p><strong>红杉中国据悉寻求为其单飞以来的首支美元基金募资12亿美元</strong></p>\n  <p>据知情人士透露，红杉中国已与投资者就多支基金展开初步洽谈，其中包括其“单飞”以来的首支美元基金。知情人士称，该投资公司在商议为一支早期阶段投资基金募集至少12亿美元资金，以支持AI、医疗和消费领域的公司。红杉中国自2005年以来一直由沈南鹏掌舵。他们还说，红杉中国也考虑设立一只成长基金，但具体时间和规模尚未确定。其中一人补充说，该公司另外也在考虑一支人民币计价基金。此次募资将考验这家专注中国的老牌投资机构的号召力。原本红杉品牌伞下的三个实体就已然基本独立，一家专注美欧、一家专注中国，第三家聚焦印度和东南亚。拆分后，中国这一分支最终以HSG为英文名，投资了宇树科技、Minimax和月之暗面等AI新兴企业。（新浪财经）</p>\n  <p><strong>特斯拉据悉准备8月面向公众推出CyberCab</strong></p>\n  <p>媒体援引知情人士报道称，特斯拉已告知员工正为Cybercab面向公众推出做准备。这是特斯拉首款没有方向盘和刹车踏板的车型。报道称，特斯拉计划首先在德克萨斯州奥斯汀向公众推出Cybercab，最快可能本月启动。（新浪财经）</p>\n  <p><strong>超级富豪家族办公室扎堆SpaceX，持股规模超过38亿美元</strong></p>\n  <p>为美洲、欧洲和中东的超级富豪进行投资的机构已建立了数十亿美元的SpaceX投资敞口，凸显出这些机构抢占炙手可热投资机会的能力。申报文件显示，2026年上半年，十多家家族办公室持有这家正式名称为Space Exploration Technologies Corp.的公司合计至少38亿美元的股份。其中一些机构，包括Pritzker旗下的Tao Capital，以及Moreira Salles家族，也是马斯克商业帝国中另一家上市公司特斯拉的投资者。（财联社）</p>\n  <p><strong>Anthropic在IPO之前的年化营收突破650亿美元</strong></p>\n  <p>有市场消息称：Anthropic预计将在数周内启动IPO流程。Anthropic在IPO之前的年化营收突破650亿美元。（新浪财经）</p>\n  <p><strong>英伟达到处给人“兜底融资”？“新债王”冈拉克：预示市场或见顶</strong></p>\n  <p>随着英伟达与华尔街联手到处给人“兜底”融资，被业内誉为“新债王”的双线资本（DoubleLine Capital）首席执行官冈拉克最新警告称，华尔街试图将人工智能芯片变成可投资资产类别，这可能预示着市场即将见顶。冈拉克抨击了英伟达新近宣布的与六家金融巨头的合作关系，这些合作旨在为人工智能基础设施筹集超过5000亿美元的资金。英伟达将在其中扮演合作牵头方，而非出资方的角色。实际上就是利用其自身较高的信用评级，帮助控制客户的融资成本。（财联社）</p>\n  <p><strong>马斯克旗下特斯拉与SpaceX合并预期升温，预测市场押注2027年前合并概率达55%</strong></p>\n  <p>近期关于马斯克旗下两大核心企业——特斯拉与SpaceX合并的猜测持续升温，预测市场正涌现大量押注资金。预测平台Polymarket数据显示，市场目前认为两家公司于2027年12月31日前正式合并的概率为55%。另一家预测市场平台Kalshi则在X平台发文称，2028年之前合并落地的概率由65%进一步升至71%。（财联社）</p>\n  <p><strong>苹果罕见松口：坦言监管重压下，千亿服务业务正受到侵蚀</strong></p>\n  <p>8月18日，苹果公司首次承认，监管的变化迫使其对App Store的控制被放宽，也因此拖累了其超过1000亿美元的服务业务。这一罕见声明表明，反垄断行动正开始侵蚀该公司最盈利的业务部门之一。苹果在最新的监管文件中警告称，通过替代支付系统进行的购买交易“可能完全无法获得佣金”。并且本月其报告的服务收入和利润率低于华尔街预期。（财联社）</p>\n  <p><strong>希音被曝估值缩水，正寻求以300亿美元以内估值进行IPO</strong></p>\n  <p>8月18日消息，据报道，希音正寻求以260亿至270亿美元的估值在香港进行首次公开募股（IPO）。这一目标估值较该公司历史峰值大幅缩水。Shein计划通过此次上市筹集约20亿美元资金，现有股东或将认购本次发行规模的约一半。（澎湃新闻）</p>\n  <p><strong>谷歌据悉拟2027年停止在中国生产Pixel系列产品</strong></p>\n  <p>据报道，谷歌已告知供应商，计划从明年起将所有Pixel智能手机、智能手表和无线耳机的生产转移至中国以外。（新浪财经）</p>\n  <p><strong>法拉利首款电动车Luce拍出4000万美元，成史上最贵新车拍品</strong></p>\n  <p>尽管上市以来备受批评，法拉利首款纯电动车Luce仍以4000万美元成交，成为史上最昂贵的新车拍品。8月17日，法拉利在声明中表示，这辆“Tailor Made”高级定制版Luce在美国加州蒙特雷汽车周期间举行的苏富比慈善拍卖会上打破了此前纪录。去年的纪录由一辆定制版法拉利Daytona SP3创下，成交价为2600万美元。法拉利于5月发布Luce，售价55万欧元。这款车型推出后遭遇一波批评声浪，并导致公司股价下跌。（界面新闻）</p>\n  <p><strong>特斯拉据悉准备8月面向公众推出CyberCab</strong></p>\n  <p>媒体援引知情人士报道称，特斯拉已告知员工正为Cybercab面向公众推出做准备。这是特斯拉首款没有方向盘和刹车踏板的车型。报道称，特斯拉计划首先在德克萨斯州奥斯汀向公众推出Cybercab，最快可能本月启动。（新浪财经）</p>\n  <p><strong>英伟达CEO黄仁勋之女访问LG电子，讨论加强AI基础设施和机器人领域合作</strong></p>\n  <p>8月18日，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）8月17日访问了位于韩国的LG电子机器人中心。黄敏珊与LG电子高管会面，探讨了双方在人工智能（AI）基础设施和机器人领域深化合作的方式。此次访问前，LG电子上周宣布，计划依托英伟达机器人平台，在2027年第一季度推出一款可双足行走的新一代人形机器人。（新浪财经）</p>\n  <p><strong>卢伟冰：新一代小米玄戒芯片即将发布，一系列旗舰产品会密集上市</strong></p>\n  <p>36氪获悉，小米集团合伙人、集团总裁卢伟冰在财报电话会上透露，去年小米成功推出的玄戒O1芯片，在三款终端上的累计出货量已超过百万，实现了旗舰芯片规模化验证，全新一代小米玄戒芯片也即将发布。卢伟冰同时表示，9月份小米会进入密集的新品发布期，会有一系列重磅旗舰产品陆续上市。</p>\n  <p><strong>韩国现代汽车工会将时隔10年举行全面罢工</strong></p>\n  <p>8月18日，现代汽车劳资双方在韩国蔚山工厂举行第16轮谈判，时隔41天重启磋商，最终仍未能达成共识。劳资分歧主要集中在上调奖金、恢复在工会活动过程中因违法行为被解雇员工的职位，以及延长退休年龄等三项议题。工会随后敲定新一轮罢工日程，19日至20日、24日至25日每天举行4小时部分罢工，21日举行8小时全面罢工。这将是该工会自2016年劳资谈判后，时隔10年再度举行全面罢工。（财联社）</p>\n  <p><strong>Anthropic筹备超级投票权，为IPO铺路</strong></p>\n  <p>据两名知情人士透露，Anthropic计划授予首席执行官达里奥·阿莫迪及其他联合创始人一类具备超额投票权的股份，帮助他们抵御外部股东施加的压力。这将是Anthropic管理层首次获得超级投票权；该机制在科技企业创始人中已十分普遍。另有消息人士表示，对Anthropic而言此举意义特殊：相比其他科技企业创始人，该公司创始人所持股权占比相对较低。公司还计划依托特殊类别的股票，保留现有的非股东受托人团体，由其选举董事会多数席位，以此构建一道非传统屏障，抵御外部股东干预。（新浪财经）</p>\n  <p><strong>美加关税谈判进入最后关头，特朗普政府淡化达成协议预期</strong></p>\n  <p>据知情人士透露，特朗普政府正淡化外界对美加两国在最后一刻达成协议以避免将于周三生效的新关税的预期。美方私下表示，双方周二达成协议的可能性只有五五开甚至更低。两国需要在午夜截止期限前达成协议，否则美国将对价值数十亿美元的加拿大商品征收50%的关税。（新浪财经）</p>\n  <p><strong>德国去年企业关闭数量创近20年新高</strong></p>\n  <p>德国信用报告机构“信贷改革”公司和欧洲经济研究中心最新联合分析显示，2025年德国共有超过18万家企业停止经营，同比增加近10%，数量为近20年来最多。（新华社）</p>\n  <h2>大公司财报</h2>\n  <p><strong>必和必拓全年基本利润132亿美元，同比增长30%</strong></p>\n  <p>必和必拓全年基本利润132亿美元，同比增长30%，预估为126.9亿美元；净利润98.3亿美元，同比增长9%，预估109.5亿美元；每股末期股息0.99美元，上年同期0.60美元。（财联社）</p>\n  <p><strong>小米集团：二季度营收1089亿元</strong></p>\n  <p>36氪获悉，小米集团发布2026年第二季度财报。财报显示，二季度营收1089亿元，上年同期营收1160亿元；净利润94.6亿元，同比下降20.3%。</p>\n  <p><strong>爱奇艺：二季度总收入62.9亿元，环比增长1%</strong></p>\n  <p>36氪获悉，8月18日，爱奇艺发布截至2026年6月30日未经审计的第二季度财报。二季度爱奇艺总收入62.9亿元人民币，环比增长1%。其中，会员服务收入40.1亿元，在线广告服务收入12.5亿元，内容发行收入6.8亿元，其他收入3.4亿元。</p>\n  <p><strong>百度：二季度总营收313亿元，AI业务收入占比连续过半</strong></p>\n  <p>36氪获悉，百度发布2026年第二季度财报。财报显示，二季度总营收313亿元；一般性业务收入252亿元，其中AI业务收入占比50%，已连续两季占比过半。二季度百度AI云基础设施收入73亿元，同比增长50%，其中GPU云同比增长283%，已连续四个季度实现三位数增长；AI应用收入25亿元，同比增长3%；AI原生营销服务收入26亿元。</p>\n  <p><strong>中国联通：2026上半年营收2014亿元，同比提升0.6%</strong></p>\n  <p>36氪获悉，中国联通公告，2026上半年营业收入人民币2014亿元，同比提升0.6%；服务收入人民币1780亿元，同比下降0.2%。净利润人民币95亿元，同比下降34.6%。</p>\n  <p><strong>舍得酒业：2026年上半净利润1.45亿元，同比降67.26%</strong></p>\n  <p>36氪获悉，舍得酒业公告，2026年上半年营业收入22.87亿元，同比下降15.34%。归属于上市公司股东的净利润1.45亿元，同比下降67.26%。扣非净利润1.32亿元，同比下降69.84%。上年同期净利润4.43亿元。本报告期无利润分配预案。</p>\n  <p><strong>小马智行：二季度总营收2.46亿元，Robotaxi收入同比增长691.2%</strong></p>\n  <p>36氪获悉，8月18日，小马智行发布2026年第二季度财报。二季度总营收2.46亿元，同比增长68.8%。Robotaxi业务收入8192万元，同比大幅增长691.2%，环比增长40.9%，贡献总营收的三分之一，成为拉动业绩增长的重要力量。其中，乘客车费收入同比激增849.3%，创下历史最高单季涨幅。截至2026年6月30日，Robotaxi车队规模已达1975辆。目前，基于北汽、广汽、丰田三款车型打造的第七代Robotaxi均已投入日常服务。公司依托共建车队模式加速海外布局，海外部署计划合计超4000辆Robotaxi，其中与Uber合作计划在欧洲五城部署超2000辆。</p>\n  <p><strong>华能国际：2026年上半年净利润65.86亿元，同比下降28.89%</strong></p>\n  <p>36氪获悉，华能国际公告，2026年上半年实现营业收入1069.09亿元，同比下降4.57%；归属于上市公司股东的净利润65.86亿元，同比下降28.89%。</p>\n  <p><strong>中信建投：2026年上半年净利润76.39亿元，同比增长69.44%</strong></p>\n  <p>36氪获悉，中信建投公告，2026年上半年公司实现营业收入162.29亿元，同比增长51.11%；净利润76.39亿元，同比增长69.44%。公司拟2026年中期现金分红22.49亿元，该方案尚待提交股东会批准。</p>\n  <p><strong>国泰海通：2026年上半年净利润202.6亿元，同比增长28.74%</strong></p>\n  <p>36氪获悉，国泰海通公告，2026年上半年实现营业收入471.63亿元，同比增长97.56%；归属于母公司所有者的净利润202.6亿元，同比增长28.74%。公司拟向A股股东和H股股东每10股分配现金红利3.0元（含税），拟分配现金红利总额为52.54亿元（含税），占2026年上半年归母净利润的25.93%。</p>\n  <p><strong>OpenAI第二季度营收67亿美元，同比增长18%</strong></p>\n  <p>OpenAI第二季度营收增长18%至67亿美元，但亏损进一步扩大，业务增速落后于Anthropic。（新浪财经）</p>\n  <p><strong>株冶集团：2026年上半年净利润19.48亿元，同比增长232.75%</strong></p>\n  <p>36氪获悉，株冶集团公告，2026年上半年实现营业收入141.5亿元，同比增长35.91%；归属于上市公司股东的净利润19.48亿元，同比增长232.75%。营收增长主要系本期贵金属价格较上年同期上涨。</p>\n  <h2>投融资</h2>\n  <p><strong>“恒湾科技”完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，恒湾科技（ZILLNK）近日宣布完成数亿元人民币B轮融资，本轮由深创投领投，国开科创、沃赋创投、东山精密等跟投。资金将主要用于核心芯片自研、AI-RAN与6G技术研发，以及海外市场的深化布局。</p>\n  <p><strong>“安澜德健”完成近亿元A轮融资</strong></p>\n  <p>36氪获悉，据启明创投消息，日前，“安澜德健”宣布完成近亿元A轮融资，由启明创投独家投资。本轮募集资金将主要用于加速推进公司核心产品OpusOne™的国内注册临床试验进程，并全面支持其海外早期临床试验的申报与开展。</p>\n  <p><strong>“思昇科技”完成数千万元种子+轮融资</strong></p>\n  <p>36氪获悉，近日，AI驱动的超声脑机接口公司“思昇科技”宣布完成数千万元种子+轮融资。本轮融资由国汽投资领投，元禾璞华、全球健康产业创新中心（GHIC）跟投，老股东英诺科创基金、水木清华校友种子基金继续加注，由光源资本担任独家财务顾问。本轮资金将主要用于超声脑机接口核心技术研发、医疗器械产品推进、多模态脑数据与AI脑科学平台建设，以及跨学科人才团队扩充。</p>\n  <p><strong>“嘉腾机器人”完成数千万战略融资</strong></p>\n  <p>36氪获悉，近日，“嘉腾机器人”宣布完成数千万战略融资，由上市公司和而泰领投、道禾基金（LP是东方精工、乐聚机器人和道禾自有资金）、金木资本跟投，云岫资本担任后续融资独家财务顾问。</p>\n  <p><strong>“芯旸微”完成千万元天使轮融资</strong></p>\n  <p>36氪获悉，水下感知芯片企业“芯旸微”近日完成千万元天使轮融资，本轮投资方为险峰长青和隐峰资本，资金将主要用于团队建设和人才体系搭建。</p>\n  <p><strong>“中科驭数”完成C+轮融资，投后估值近70亿元</strong></p>\n  <p>36氪获悉，近日，国内DPU芯片企业“中科驭数”正式完成C+轮融资，本轮融资由长江资本、太平科创、尚颀资本、云锋投资、浙江产投、智微资本、建投华科等多家产业资本与政策性基金联合参与，完成后中科驭数投后估值近70亿元。</p>\n  <h2>酷产品</h2>\n  <p><strong>共生知行发布人形机器人赛车Demo</strong></p>\n  <p>36氪获悉，8月17日，具身智能初创公司共生知行（Symbiosis Robotics）发布双足人形机器人驾驶卡丁车Demo，这是公司成立后首次系统展示“全身智能”阶段性进展。据了解，共生知行聚焦面向双足人形机器人的全身智能基座模型，尝试打通感知、决策、全身运动控制与数据训练链路。公司表示，未来将快速迭代发布共生知行的技术进展、Demo、开源项目等。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。AI“母体”重现？每人1290个属性，全部来自真实数据。</strong></p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-08-19T00:17:16+00:00", "fetched_at": "2026-08-19T00:58:09.479937+00:00", "fingerprint": "2ff54cfd73dc1871"}, {"source": "少数派", "title": "派早报：阿里巴巴出售灵犀互娱，Linux 7.2 内核稳定版发布等", "url": "https://sspai.com/post/113566", "summary": "少数派的近期动态新一季少数派会员启航，更新权益，更多惊喜，还有实体纪念卡。点击了解能让AI助手通过自然语言指令直接与您的Quote/0摘录墨水屏交互的DotSkill已上线。点击了解你可能错过的文章成 ...<a href=\"https://sspai.com/post/113566\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-18T00:04:07+00:00", "fetched_at": "2026-08-19T00:58:07.971998+00:00", "fingerprint": "3802abd7aeeea505"}, {"source": "少数派", "title": "7月音乐精选：夏天赠予我们的 9 张专辑", "url": "https://sspai.com/post/113454", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/113454\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-18T02:52:11+00:00", "fetched_at": "2026-08-19T00:58:07.971991+00:00", "fingerprint": "2182be1a33b64978"}, {"source": "少数派", "title": "App+1 | 让任务栏更有用：WindowSill", "url": "https://sspai.com/post/113438", "summary": "屏幕不是注意力中心的地方可以塞下多少有用的东西呢？<a href joy the hobby? You can grab the 65-percent Glorious GMMK 3 mechanical keyboard at Woot for $34.99 (usually $139.99) by entering the coupon code WOOTGAMING at checkout, and first-time Woot customers will get an [&#8230;]", "category": "tech", "published_at": "2026-08-17T19:27:49+00:00", "fetched_at": "2026-08-18T00:57:30.315979+00:00", "fingerprint": "9f987d2f143e7317"}, {"source": "The Verge", "title": "ABC&#8217;s livestreamed news show is powered by trending topics", "url": "https://www.theverge.com/streaming/981209/abc-news-searched-livestreamed-show", "summary": "ABC News has officially introduced Searched, a livestreamed show that highlights stories people are discussing on social media and searching on the web, as reported earlier by Variety. Though the network just announced the show now, Searched began airing on the ABC News Live streaming channel in April, which appears on both Disney Plus and [&#8230;]", "category": "tech", "published_at": "2026-08-17T20:59:23+00:00", "fetched_at": "2026-08-18T00:57:30.315972+00:00", "fingerprint": "ba189ead1bfde445"}, {"source": "The Verge", "title": "Reddit’s AI is turning posts into podcasts and short videos", "url": "https://www.theverge.com/tech/981289/reddit-ai-text-video-posts", "summary": "Reddit is trying out a new way for people to take in content on Reddit: by turning text posts into audio / video content. As part of an experiment, some posts are being adapted into videos that use AI voices to read the text of the main post and some comments. The video highlights the [&#8230;]", "category": "tech", "published_at": "2026-08-17T23:46:01+00:00", "fetched_at": "2026-08-18T00:57:30.315961+00:00", "fingerprint": "8e40c23e1948d578"}, {"source": "36氪 - 最新文章", "title": "毕业多年，全网却抢着重做一道语文题", "url": "https://36kr.com/p/3943421440212104?f=rss", "summary": "<p>毕业这么多年，全网突然争着做一道小学语文填空题。</p>\n  <p><strong>题目长这样：（xxx）稳定存钱，（xxx）环游世界。补关联词。</strong></p>\n  <p>小学二年级水平。但就是这么一道题，能让全网吵成一锅粥。</p>\n  <p>第一反应，大多数人填的是“只要稳定存钱，就能环游世界”。逻辑很硬，没钱还想出门？但很快有人掀桌子：“我填‘一边稳定存钱，一边环游世界’怎么就不行了？凭什么非得先吃够苦才配享福？”接着又有人冷笑：“与其稳定存钱，不如环游世界。存钱的尽头不就是过得爽点吗？本末倒置个什么劲。”</p>\n  <p>这些答案，官方都判对。</p>\n  <p><strong>这道题是8月17日汉堡王在支付宝“疯狂碰友日”活动里出现的。</strong>用户在汉堡王门店用支付宝“碰一下”就能答题抽权益。官方也准备得够周全，备了一堆正确答案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_395b0d1129864df88134f6818e74a260@19153231_oswg124776oswg1080oswg2103_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但网友们照样捧着被判“错误”的答案，冲上社交媒体“赛博升堂”，把自己的思路掰开揉碎讲得头头是道。一道填空题，活生生被答成了人生态度辩论赛，还站队。</p>\n  <h2><strong>你是哪一派？</strong></h2>\n  <p>评论区早就盖成高楼了。翻了一遍，大概三派。</p>\n  <p><strong>人数最多的，还是“延迟满足派”。</strong></p>\n  <p>“只有稳定存钱，才能环游世界。”“必须稳定存钱，为了环游世界。”“先能稳定存钱，再去环游世界。”</p>\n  <p>主打一个卧薪尝胆，先苦后甜。钱是硬门槛，没钱寸步难行。刚毕业不久的年轻人深有体会，存钱就像硬指标，账上数字不涨就心慌。还在实习的大学生@G&nbsp;说职场就是打怪升级，爆金币是唯一动力，但赚了钱也不敢乱花。“我就想攒个大的，再奖励自己一次旅游。”学生党没钱没假期，刚入职更不敢请长假，忍，攒，等，一条路走到黑。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_e6ab9d74e41645e0a5327f44bbc6d30a@19153231_oswg61685oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>另一派完全不吃这套。</p>\n  <p>“一边稳定存钱，一边环游世界。”“不仅稳定存钱，还要环游世界。”</p>\n  <p><strong>苦和甜必须同步到账，谁跟你玩延迟满足那套。</strong>青春有保质期，玩心说退就退。工作五年的小学老师@X&nbsp;在答题区甩了一句：“等我存够钱，可能已经没有想去玩的冲动了。”人家有寒暑假，完全能做到两手抓。敢这么填的，要么是职场运气不错，要么就是自己把日子盘明白了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_4da9ab198b5c40dc8caad70a2e9076f6@19153231_oswg20018oswg1080oswg201_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>水哥填的是“（一边）稳定存钱，（一边）环游世界”。他说这就是他一直在做的事。他打赌女儿会写“（爸爸）稳定存钱，（我）环游世界”，结果女儿填的是“（先）稳定存钱，（再）环游世界”。小姑娘认真解释：环游世界是稳定存钱的结果。</p>\n  <p>爸输得挺彻底。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_fcbd0f9e0d8845a8af01910729e51e64@19153231_oswg123581oswg1080oswg2084_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>还有一派，直接掀桌。</p>\n  <p>“与其稳定存钱，不如环游世界。”“宁愿稳定存钱，也不环游世界。”</p>\n  <p><strong>二选一，爱谁谁。</strong>有人压根没有攒钱规划，赚多少花多少，及时行乐拉满；也有人对诗和远方没兴趣，就想窝着，手上有粮心里不慌，楼下晒晒太阳就挺好。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_20249b27244145dba15e6203d26b1d62@19153231_oswg88092oswg1080oswg392_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>说到底，这题的答案根本不是关联词。你填的是自己的人生态度。<strong>题眼把“存钱”和“环游世界”怼在一起，逼你回答一个老掉牙的问题：先吃苦，还是先享受？</strong></p>\n  <h2><strong>别拿代际说事</strong></h2>\n  <p>乍一看，这题是按年龄站队的。</p>\n  <p>老一辈眼里苦永远排在甜前面，他们字典里甚至没有“旅游”这词，出门就是铺张浪费；90后开始背包客穷游，00后更狠，低成本环游世界挑战，存钱和看世界两不耽误。</p>\n  <p><strong>姜思达填的是：“（以后再）稳定存钱，（现在先）环游世界。”</strong>手动加顺序。理由很直接：钱肯定要，环游世界也不便宜，但比存钱更重要的，是敢把钱花在路上。缺了再挣。</p>\n  <p>这几乎是年轻人的活法宣言。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_f117a789ba7747a0a6f2549371358cd1@19153231_oswg158096oswg1080oswg1844_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但翻完评论区你会发现，代际差异根本兜不住这事。</p>\n  <p>填“只有稳定存钱，才能环游世界”的，不少是走入职场的95后。手里有点存款，但还是怕——怕不确定性，怕哪天断粮。年纪不大，胆子不大。</p>\n  <p>填“一边一边”的，反而有不少是已经存够底气的80后。尤其是觉醒的中女，年轻时拼过了，如今家庭稳定、积蓄在手，开始补偿自己。周末飞别的城市度个假，甚至冲去新加坡看演唱会，比谁都勤。</p>\n  <p><strong>更绝的是，同一个人，不同心境下，答案也不相同。</strong></p>\n  <p>15号发工资那天：</p>\n  <p>只要稳定存钱，就能环游世界。月底余额见底：</p>\n  <p>只有稳定存钱，才能环游世界。刚休完假回来：</p>\n  <p>与其稳定存钱，不如环游世界。996干了一年哪儿也没去：</p>\n  <p>必须稳定存钱，为了环游世界。</p>\n  <p>所以别扯什么代际。<strong>这道题测的是你当下的状态——你和自己的生活处得怎么样？手里的余额够不够让你松弛？钱还是不是你的头号焦虑？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_ccbabc161b264d879c35cfde86824cc6@19153231_oswg80062oswg1080oswg725_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>《格外的活法》里有句话挺戳人。吉井忍花了七年采访那些活在主流赛道之外的人，她在前言里写：“我也暂时不那么急着寻找答案。看目前的样子，路变窄了，但还可以走。”</p>\n  <p>书里的人面对日常的琐碎和烦躁，不着急找答案，接受状态模糊的自己，用现有的能力应对不确定性。</p>\n  <p><strong>人生可不是等存够钱才开始的游戏。</strong></p>\n  <h2><strong>标答？不存在的。</strong></h2>\n  <p>官方准备的正确答案已经够多了，但还是框不住所有人。</p>\n  <p>答题页面里，一堆人收到“回答错误”后扭头就发社交媒体：“凭什么我填的不算对？”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_9438f1b295944fb1abfd9b838dc37721@19153231_oswg17461oswg1080oswg239_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>有人填：<strong>“又能稳定存钱，还能环游世界。”</strong>——为什么不能找一份环游世界的工作？数字游民已经把工位搬去了大理、清迈、巴厘岛，工作游玩两不误。</p>\n  <p>有人填：<strong>“不管稳定存钱，必须环游世界。”</strong>——破罐破摔怎么了？反正也存不下，不如先快活。钱能再挣，时光溜走了就是溜走了。</p>\n  <p>还有人填：<strong>“只想稳定存钱，不想环游世界。”</strong>——凭什么非得开眼看世界？我就想存够钱提前退休，做个FIRE族，窝在自己的世界里追剧打游戏，楼下吸口新鲜空气，不行吗？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_3a43b6b52fb94f5eb669d8cf184d8202@19153231_oswg270583oswg1080oswg733_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>这些超纲的答案，往往牵引出更具体的人生。而具体的人生，往往更动人。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_306e0e8eaa2c47b48c35bd022169be84@19153231_oswg73970oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>语文题可以有标准答案，但人生没有。在真实的困境面前，从来没有什么二选一。年轻人都是在存钱和享受的博弈里，把日子经营得越来越像自己的。</p>\n  <p><strong>支付宝和汉堡王出的这道题，最聪明的地方在于——它没打算教你怎么活。它只出了半句话，括号留给你。</strong></p>\n  <p>而这届年轻人接过笔，填上了自己的“非标准人生”。</p>\n  <p>所以，你填什么？</p>", "category": "tech", "published_at": "2026-08-17T09:40:02+00:00", "fetched_at": "2026-08-18T00:57:30.174198+00:00", "fingerprint": "673653a47399053d"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机；高盛称市场对美联储加息的预测仍过于激进", "url": "https://36kr.com/p/3943607663443073?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>超讯科技：上半年净利润5172.53万元，同比下降28.25%</strong><br />36氪获悉，超讯科技披露半年报，2026年上半年实现营业收入5.65亿元，同比下降64.92%；归属于上市公司股东的净利润5172.53万元，同比下降28.25%；基本每股收益0.33元。</p>\n  <p><strong>锅圈：上半年实现营收39.47亿元，同比增长21.8%</strong><br />36氪获悉，锅圈发布半年报，2026年上半年实现营收39.47亿元，同比增长21.8%；净利润2.13亿元，同比增长12.1%；核心经营利润2.25亿元，同比增长18.3%。</p>\n  <p><strong>吉利汽车桂生悦‌回应管理层调整：从创始人驱动迈向由制度和团队驱动的成熟期</strong></p>\n  <p>36氪获悉，8月17日，吉利汽车控股有限公司宣布管理层调整规划。吉利汽车董事会副主席桂生悦称：“这标志着吉利汽车已从‘创始人驱动’的创业期和发展期，迈向了由‘制度与团队驱动’的成熟期，企业从依赖个人魅力与权威，转向依赖组织系统和人才梯队，意味着企业治理更透明、决策更专业、管理更科学。对内部人才而言，也是天花板打破的信号”。</p>\n  <p><strong>森马服饰：上半年净利润同比增长47.45%，拟10派1.5元</strong><br />36氪获悉，森马服饰披露半年报，2026年上半年，公司实现营业收入67.22亿元，同比增长9.32%；归属于上市公司股东的净利润4.79亿元，同比增长47.45%；基本每股收益0.18元。公司拟每10股派发现金红利1.5元（含税）。</p>\n  <p><strong>钶锐锶科创板IPO过会</strong><br />36氪获悉，8月17日，上交所上市审核委员会召开2026年第47次上市审核委员会审议会议，审议结果显示，广东钶锐锶数控技术股份有限公司首发符合发行条件、上市条件和信息披露要求。</p>\n  <p><strong>新联电子：上半年净利润4.53亿元，同比增长140.95%</strong></p>\n  <p>36氪获悉，新联电子披露半年报，2026年上半年，公司实现营业收入4.08亿元，同比增长8.25%；归属于上市公司股东的净利润4.53亿元，同比增长140.95%；基本每股收益0.54元。</p>\n  <p><strong>大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机</strong><br />从大疆创新（DJI）获悉，美国当地时间8月14日，大疆创新诉美国国防部案迎来重大实质性进展。美国哥伦比亚特区联邦巡回上诉法院裁定，下级法院需重新审理大疆被列入五角大楼“中国军事企业”（CMC）黑名单一案。这一裁决标志着大疆在美长达数年的相关法律维权取得了重要的程序性胜利。针对上诉法院的这一最新裁决，大疆向记者提供的声明称：“我们欢迎美国上诉法院作出的这一积极裁决，这是最终纠正不当列名的重要一步。该裁定也进一步印证了大疆一贯坚决反对将产品与技术用于任何军事或战争用途的立场。未来，我们将继续通过法律途径，坚决捍卫公司及全球用户的合法权益。”（环球时报）</p>\n  <p><strong>千问办公开源MyContext，为Agent打造全新的上下文基础设施</strong><br />36氪获悉，千问办公于近日开源了全新的上下文基础设施“MyContext”。它可以把海量异构的个人工作数据加工成Agent易理解的专属工作档案，让Agent读懂用户和真实业务工作流，并最终在决策和执行等环节实现人机协同，提升Agent在工作场景下的表现。</p>\n  <p><strong>小米SU7系列累计交付突破50万台</strong><br />36氪获悉，据小米汽车消息，小米SU7系列累计交付突破50万台。</p>\n  <h2>投融资：</h2>\n  <p><strong>AI视频生成平台Higgsfield完成4亿美元新一轮融资</strong><br />据报道，AI视频生成平台Higgsfield成功完成4亿美元的新一轮融资，投资者包括DST Global、高盛、Liberty Global以及英特尔旗下投资部门等。本次融资将Higgsfield的估值推升至54亿美元。数据显示，公司今年8月的年化收入已高达7亿美元，与一年前仅约2000万美元的规模相比，增长34倍。（界面）</p>\n  <h2>新产品：</h2>\n  <p><strong>支付宝发布国内首个智能体商业底座</strong><br />36氪获悉，支付宝今日发布首个全栈智能体商业底座及多智能体跨端互联AHA协议体系，联合千问、华为、OPPO、比亚迪、吉利等20余家企业共建智能体互联生态。据了解，支付宝旗下超级服务智能体“阿宝”目前完成了超过一万项服务的AI化接入，服务跨端支持5大手机品牌、16家主流车企。</p>\n  <p><strong>宇树科技发布“超人”</strong><br />36氪获悉，宇树科技发布新机“超人”。宇树科技称，该人形机器人突破全人类极限。0.85米腿长，可原地跳高2米，极限速度12.66m/s，超越全世界全人类原地跳高和奔跑速度记录。全新整机刚用3个多月研发出来，未来几个月还有很大的完善空间。</p>\n  <h2>今日观点：</h2>\n  <p><strong>国家统计局：下沉市场消费活力在增强</strong><br />8月17日，国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，随着县域商业体系的加快建设，物流配送体系、信息网络向乡村延伸，下沉市场的消费活力在增强。1—7月份，乡村消费品零售额占社会消费品总额比重为13.4%，比上年同期提高了0.2个百分点。（证券时报）</p>\n  <p><strong>高盛称市场对美联储加息的预测仍过于激进</strong><br />8月17日，据报道，高盛集团表示，鉴于全球最大经济体的通胀正在降温，市场对美联储加息的押注仍然过于激进。该投资银行的首席经济学家Jan Hatzius在给客户的一份报告中写道，由于零售销售数据下滑，就业数据不及预期以及通胀增速放缓，美联储在9月会议上加息已变得“极不可能”。Hatzius在周日发布的报告中写道：“根据我们的基线经济预测，通胀形势接下来更有可能进一步改善而非再次恶化。我们仍然认为市场对联邦基金利率的定价过于鹰派。”（界面）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>国家统计局：1—7月份全国网上商品和服务零售额117214亿元，同比增长4.8%</strong><br />&nbsp;</p>\n  <p>国家统计局新闻发言人付凌晖在17日举行的国新办新闻发布会上说，今年1至7月份，我国装备制造业和高技术制造业增势良好，工业机器人产量同比增长28.5%，3D打印设备、锂离子电池产量同比分别增长52.3%、40.2%。（央视新闻）<br />&nbsp;</p>", "category": "tech", "published_at": "2026-08-17T12:54:00+00:00", "fetched_at": "2026-08-18T00:57:30.174188+00:00", "fingerprint": "78be6bf14bd69cad"}, {"source": "36氪 - 最新文章", "title": "全球供应链重构关键期，出海企业的本地化实战与挑战｜超级会氪厅", "url": "https://36kr.com/p/3938833643961733?f=rss", "summary": "<p>对于不少中国出海企业来说，2026年称得上是全球化布局从横向铺开转向纵向深入的一年。</p>\n  <p>过去几年，中国企业出海的逻辑已经发生深刻变化。在早期的“产品出海”阶段，企业关心的是如何把产品通过各种渠道卖出去，解决线下流量获取、线下物流履约和支付结算等问题。</p>\n  <p>但到了2026年，关税持续加码迫使“产能出海”成为新的趋势。从越南的电子制造集群、泰国的家电生产基地、墨西哥的汽车零部件产业带到中东的新兴工业区，中国企业在新兴市场的身影越来越密集。</p>\n  <p>出海企业产能迁移的步伐加快，挑战也随之升级。企业在海外完成落脚的第一步后，开始面对真正扎根本地市场的新命题——关税波动、区域市场差异、跨区域协同等挑战，迫使出海企业进一步审视原有的全球运营模式。</p>\n  <p><strong>能否下好供应链全球化布局的“一盘棋”，建立一套多个市场有效协同的全球运营体系，是决定出海企业能否真正在海外市场站稳脚跟的必备能力。</strong></p>\n  <h2><strong>工厂容易搬出国，但管理很难跟上</strong></h2>\n  <p>很多企业出海后发现，把产线搬到海外并不难，难的是如何重构海外工厂的运营和管理制度。</p>\n  <p>一些成熟大公司虽然已在国内搭建起完善的管理系统，但试图将这套系统搬到海外时，往往会遇到大量现实阻碍。比如因为当地网络基础设施跟不上，制造执行系统运行卡顿；当地技术人员不习惯国内自动化设备的操作逻辑、报表格式，企业培训成本高、周期长；甚至有企业将国内系统的界面语言翻译为本地语言时，因为表达不够准确地道，当地员工难以理解，导致工作效率反而降低。</p>\n  <p>在管理层面，由于信息沟通与决策链路被拉长，总部对海外工厂的掌控力也难以达到国内水平。库存水位是否合理、生产进度是否正常、品质数据是否达标……这些问题在国内随时可以通过系统实时查看。但到了海外，由于沟通被迫退回到Excel报表、电子邮件等方式，不仅这些问题难以及时得到解决，还会产生数据滞后、口径不统一等新麻烦。</p>\n  <p>当然，也有先行者已经摸索出一些解法，比如某家电企业的泰国工厂通过AI应用覆盖多个核心业务场景，大幅提升成品合格率和订单处理效率。也有企业在海外工厂构建“云-边-端”协同的数字化架构，通过智能排产系统实现设备效率的提升。</p>\n  <p>但是这些成功实践的背后，是大量的试错、投入和时间成本。对于大多数中小型出海企业来说，仍然难以在资源有限的情况下，找到适合自身阶段的海外工厂管理模式。</p>\n  <p>另一个实操层面的难题是产业链协同。虽然产业链集群“抱团出海”已经成为行业共识，但“走出去”以后利益机制如何设计，协作效率如何保障等问题，至今没有标准答案。而如果核心供应商不跟着一起走，企业只得从零开始在本地重构海外供应链，难度系数再上一个台阶。</p>\n  <h2><strong>本地化运营：不只是物理空间迁移</strong></h2>\n  <p>虽然出海企业普遍深知本地化运营的重要性，但往往首先想到的是建厂、招人、铺渠道，忽略了数字化层面的本地化。</p>\n  <p>随着业务规模变大，数字化资产的管理难度也会同步增加。不同于工厂、产品这些有形资产，企业在多个国家开展业务时，对品牌名称、后台数据、供货系统等数字化资产的使用、存储和流动等不可避免存在差异，稍有不慎就可能付出巨大代价。</p>\n  <p>越来越多出海企业意识到，数字品牌资产管理和落地在本地化运营体系中的重要性，如何建立一套清晰的框架统筹品牌数字资产的全球化运营，确保品牌标识在任何一个关键市场都能被有效保护和管理，已成为出海企业不可忽视的基础工作。</p>\n  <p><strong>2026年8月19日，36氪将联合威瑞信在深圳共同举办「深水规则」· 出海系列超级会氪厅线下活动，我们特别邀请到威瑞信客户管理部高级总监张志等深耕新兴市场的基础设施服务商与出海实战操盘手。</strong></p>\n  <p>嘉宾们将围绕<strong>“本地化运营”</strong>与<strong>“供应链重构”</strong>两大核心议题，就产能转移决策、海外工厂数字化、数字品牌资产保护等关键议题，分享各自的实战经验与趋势洞察，并与参会企业从多维度展开探讨。</p>\n  <p><strong>欢迎出海企业的创始人、CEO及供应链、运营、海外业务负责人报名活动，共探中国企业全球化突围的务实路径。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260817/v2_dee1fabeb65b4d45a225cf613fa1822f@6385117_oswg2479000oswg1080oswg5873_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-08-17T13:33:42+00:00", "fetched_at": "2026-08-18T00:57:30.174177+00:00", "fingerprint": "6cf079e5564e4a40"}, {"source": "36氪 - 最新文章", "title": "硬氪专访 | 荣耀李健：在行业下行期，做一款9999元的云台手机", "url": "https://36kr.com/p/3943831281663362?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>Robot Phone或许是荣耀CEO李健上任来压力最大的一款产品 。</p>\n  <p>8月12日的发布会现场，荣耀Robot Phone背部的摄像头缓缓升起，跟着音乐摆动。它还瞄准了眼前的拍摄对象，随着人物不断转来转去，像一颗长在手机上的“机器人脑袋”。 以前固定在手机背板里的摄像头，第一次“动”了起来。</p>\n  <p>Robot Phone售价9999元起，作为荣耀“阿尔法战略”后的首款新形态产品，这不仅是一款把价格攻到万元级的高端旗舰手机，也集中投射了荣耀对AI手机的想象。</p>\n  <p>在早已沉寂的手机赛道，这款产品带来了少有的亮色。</p>\n  <p>但它的诞生伴随着波折和动荡。在与硬氪等媒体交流的一个半小时里，李健提到了18次“压力”、12次“难”。</p>\n  <p>过去一年，内存成本上涨、全球手机市场空间缩减超过10%——约等于掉走了一家大型手机公司完整的份额。在这种严酷的环境中，荣耀依旧需要探索第二曲线，拿出一款重磅产品，拿回牌桌上的位置。</p>\n  <p>“如果用一幅画描述荣耀当前的状态，我认为它就像一只准备起飞的雄鹰，遭遇了狂风暴雨，正处于关键阶段。”李健告诉硬氪。</p>\n  <p>哪怕他们高管自己“都心里打鼓”， 荣耀也只能走完最难的那条路。</p>\n  <p>Robot Phone工程难度极高。手机原本已被芯片、电池、镜头和散热系统占满，而Robot Phone还要放入一套由100多个精密零件组成的机械系统，同时还要保证机身厚度控制在9毫米厚、248克重的极限里。</p>\n  <p>为此，荣耀对工业设计和内部架构调整了十多个版本，前后花了大半年，引进了钛合金、盾构钢等全新的材料方案，最终才把电机整体做到2.6克——约等于半张A4纸的重量。</p>\n  <p>把云台做小做轻之外，还要耐用。</p>\n  <p>在Robot Phone上，云台与主板之间共有68根线，其中19根是同轴线。这些线既要塞进有限的机身空间，还要经得起云台反复升降和旋转——尤其是，作为一款日常使用的手机，它还要满足手机行业出厂前极其残酷的跌落、滚筒测试，与其他手持云台独立产品完全不是一个难度量级。</p>\n  <p>更大的问题出现在发布前一两个月。</p>\n  <p>荣耀产品线总裁方飞告诉硬氪，当时，团队发现翻转机构的寿命只能达到约一年，距离手机的正常使用周期还有明显差距。</p>\n  <p>但Robot Phone 是一款不能失败的产品。“我们的压力很大，直到前面一个月我们的高管还在问到底做的怎么样。AI能力、影像能力、设计的水平最后汇总到Robot Phone这里。”李健说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_0284c97563e343d88628476af28437e9@1199336245_oswg472445oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>随后在短短一周内，荣耀测试了18种材料方案，并同时协调材料、加工、模组、整机、研发等团队集体攻坚，最终才将设计寿命提升至五年。</p>\n  <p>经过这样的捶打后，Robot Phone卖点突出，和云台相机、手机，都做到了区隔。</p>\n  <p>影像方面，荣耀与德国摄影设备厂商阿莱（ARRI）合作，引入多种专业影像功能（ARRI LogC3曲线、伪色监看、峰值对焦等），兼顾专业创作者的需求。</p>\n  <p>在AI方面，荣耀与阿里千问大模型深度合作，Robot Phone也搭载了系统级智能体架构，能够结合图像、声音和手势，理解用户及周围环境，完成规划和执行。李健对下一代手机的判断是，手机将从“应用的容器”变成“智能体的载体”，而AI不再只是聊天框，而是跳出屏幕，对现实世界作出反馈。</p>\n  <p>其实，选择在此时推出一款结构复杂、投入不低、市场尚未得到验证的产品，对荣耀而言完全不是一个轻松的决定。不过荣耀交出了漂亮的结果——预定超过 40 万台；开售一分钟电商全平台售罄。</p>\n  <p>此外，李健在采访中透露，即将于9月28日发布的旗舰新机Magic9 将全面承接 Robot Phone 沉淀的 AI、影像、底层算力技术，实现旗舰产品力跨越式升级，是历代Magic系列中升级最多，变化最大的一代。</p>\n  <p>“人最怕成见，希望大家可以掀掉过去对荣耀的印象，重来新的一页。”李健这样期待着。</p>\n  <p><strong>以下是硬氪与李健、荣耀产品线总裁方飞的部分交流实录（略经摘编）</strong></p>\n  <p><strong>硬氪：如何理解荣耀当下的发展状态？</strong></p>\n  <p><strong>李健：</strong>如果用一幅画描述荣耀当前的状态，我认为它就像一只准备起飞的雄鹰，遭遇了狂风暴雨，正处于“逆势破局、风雨新生”的关键阶段。</p>\n  <p>当前，两股力量正在交汇。一股是向下的压力，全球内存供应紧张，消费电子行业承压，全球手机的市场空间往下跌了百分之十几；同时，受特殊历史背景影响，荣耀面临的竞争压力也更为突出。</p>\n  <p>另一股是向上的力量。在荣耀进行战略调整以来，技术、产业、生态三方面都处于快速向上拉的过程。</p>\n  <p>就像一艘船，被一正一反两股力量打了之后容易晃，晃了之后就会晕，晕了之后就搞不清楚状态，但我觉得没关系。一个企业不经历磨难是不可能伟大的，我们感谢这个时代内存的压力、感谢竞争的压力，反倒会锻炼荣耀坚强的队伍。</p>\n  <p><strong>硬氪：既然手机厂商现在处于一个比较艰难的阶段，为什么荣耀会选择Robot Phone这样比较超前的项目？</strong></p>\n  <p><strong>方飞：</strong>Robot Phone最初源于我们对于移动影像形态的思考。随着视频记录越来越普遍，我们希望把云台与手机结合起来，但真正的难点是：如何在保证握持感和便携性的同时，把云台装进一部小尺寸手机。</p>\n  <p>为此，我们的团队对工业设计和内部架构进行了十几轮调整，光ID设计和架构设计配合的雕琢就有十几个版本，大半年时间都在折腾这件事。后来，钛合金、盾构钢、定制电机等方案，都是为解决空间、强度和可靠性问题引入的。</p>\n  <p>云台内部有数十根线缆，还需要实现三轴运动和TOF感知，结构非常复杂。但到发布前一两个月，我们发现翻转机构的寿命只能达到约一年。</p>\n  <p>所以我们的团队在一周内测试了18种材料方案，并协调材料、加工、模组、整机、研发、采购、供应和交付团队共同解决，最终将设计寿命提升到五年。</p>\n  <p>其实，在阿尔法战略提出后，我们需要重新定义荣耀手机的产品方向，去年4月至6月，我们明确将AI多模态、具身智能与影像结合，把Robot Phone定位为具身智能AI影像手机。</p>\n  <p>但是当时我们几个高管都心里打鼓，但我们认为，不确定性也代表机会，我们肯定要蹦起来够得着的东西，而不是躺着就能做出来的东西。</p>\n  <p><strong>硬氪：在全球消费电子市场承压的情况下，您如何看待荣耀上半年在全球市场的表现，海外市场和中国市场分别是什么情况？</strong></p>\n  <p><strong>李健：</strong>今年上半年，荣耀全球销量增长9%、收入增长11%，是安卓厂商中增长最快的品牌之一。</p>\n  <p>再看中国市场，我们一季度表现较好，但二季度受到涨价的影响，目前市场份额超过10%。数据听起来可能没有那么好，但中国区市场正在企稳回升。根据BCI数据，7月荣耀是中国市场唯一环比正增长的厂商，是份额提升最大的厂商，排名回到国内第四。</p>\n  <p>再看海外市场，今年上半年，荣耀海外销量增长20%、收入增长26%，在荣耀已经进入的海外重点市场中，份额超过10%的国家有十多个。</p>\n  <p>分享一组数据：</p>\n  <p>拉美市场收入增长约15%，其中墨西哥增长67%，墨西哥是很难做的市场；</p>\n  <p>中东市场份额我们排名第二，仅次于三星；在沙特，我们的手机排名第二、平板排名第一；</p>\n  <p>东南亚市场，马来西亚市场份额排名第一，超过苹果三星；</p>\n  <p>欧洲市场上半年增长超过60%，包括AIoT在内的全场景业务增长98%。</p>\n  <p>总体来说，我们在海外一枝独秀，国内是承压的，但也在回升。</p>\n  <p>此外，荣耀的海外业务增长也呈现出结构性变化：全场景及AIoT产品增长98%。过去海外的线上不行，现在线上增长接近100%。</p>\n  <p>从价格段来看，因为内存上涨的原因，我们400美金到800美金手机档位增长了425%——上半年这么难增长4.2倍。</p>\n  <p><strong>硬氪：能否分享一下，未来AI手机发展的方向是什么样的？</strong></p>\n  <p><strong>方飞：</strong>Robot Phone代表了我们对AI手机的一种探索。我们判断，以前手机是装应用的容器，未来会变成“智能体的舞台”，能理解人的意图，帮助用户规划，并完成任务。</p>\n  <p>AI手机还会根据用户的习惯和所处场景，主动提供服务。这背后会带来OS的变革、服务模式、应用模式的变革。</p>\n  <p>另外，AI不能只停留在软件层面，还要和具体产品结合。比如，办公类AI可以更多地用在大屏设备上，影像类AI可以帮助用户拍摄和创作，游戏类AI则可以结合高性能手机来提升体验。</p>\n  <p>但要实现这一点，关键是让设备拥有对用户的长期记忆，并持续了解用户的行为变化。同时，AI既要在手机本地运行，也要使用云端能力——本地处理速度快、成本低，云端则可以完成更复杂的任务。</p>\n  <p>我觉得，这种变化不只会发生在手机上，PC、平板、眼镜和其他穿戴设备都会改变，也可能出现新的产品形态。过去主要依靠触屏操作，未来语音、手势等交互方式会越来越多。</p>\n  <p>同时，家庭场景也可能出现一个统一的中心，用来管理手机和其他设备中的数据、内容与计算能力，让用户在不同设备之间切换时，服务仍然能够延续。现在还没有完全解决的问题是，不同品牌的设备和AI如何相互协作。</p>\n  <p><strong>硬氪：Robot Phone和人形机器人、荣耀其他的手机产品之间，有哪些技术是共用的？</strong></p>\n  <p><strong>李健：</strong>人形机器人和Robot Phone以及很多技术确实共栈的。因为手机本身具备高可靠、强通信的特性，包括续航，业界很少知道机器人电池荣耀可以自己制造的，我们有真正的电池产线的。</p>\n  <p>在人形机器人用到的一些无人控制，包括电机、高强度的轻薄材料、仿真技术，以及人形机器人发展中的多媒体交互、影像交互、人机交互、语音交互，都可以利用共栈到手机的平台上，这个技术底座和人形机器人非常契合的。</p>\n  <p><strong>硬氪：现在有一些友商正在做云台相机的单独产品，Robot Phone立项的时候，有没有想过单独做一个独立的形态？为什么一定要融合进手机？</strong></p>\n  <p><strong>李健：</strong>我们在做Robot Phone的时候确实没有考虑过做单独的云台产品，因为我们期望找到一个形态既能够体现荣耀的影像，又能够体现荣耀AI的能力。</p>\n  <p>我从来不认为Robot Phone只是一个纯影像的手机，我们费了这么大劲做AI方面和人的互动，这只是开始。我们要让AI走出屏幕，后面一堆的事可以去想象。</p>\n  <p>这个形态出来，我们一定要把标杆立上去，我们的压力很大，直到前面一个月我们的高管还在问到底做的怎么样。AI能力、影像能力、设计的水平最后汇总到Robot Phone这里。</p>\n  <p><strong>硬氪：Robot Phone是集大成的产品，集合了荣耀在AI、影像、硬件上的种种创新，在Magic9上会如何承接Robot Phone的技术探索？</strong></p>\n  <p><strong>李健：</strong>Magic9里面AI的能力将会远超其他所有终端厂商的能力，同时，我们也在努力提升AI能力、影像能力，Agentic OS也会在Magic9上做一个全新的尝试。</p>\n  <p>新的形态虽然会有一些不足，但我相信在一个成熟形态下，会让大家感觉Magic9值得等待。人最怕成见，希望大家可以掀掉过去对荣耀的印象，重来新的一页。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_b8de74b6dbc64fa98e663a848c5122c7@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-08-18T00:00:00+00:00", "fetched_at": "2026-08-18T00:57:30.174165+00:00", "fingerprint": "284aaa537db88a77"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨李书福辞任董事会主席，吉利汽车管理层大调整；iPhone17或全球涨价，最高涨价近千元；宇树科技发布“超人”", "url": "https://36kr.com/p/3944273186241673?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>DeepSeek API 8月17日正式调价，最高涨幅达1100%&nbsp;</p>\n  <p>大涨12%，长鑫市值约为2.5个茅台</p>\n  <p>豆包支持手机远程操控电脑</p>\n  <p>旺旺食品旗下多家公司已注销</p>\n  <p>人民币对美元汇率升破6.74，创三年半新高</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>吉利汽车宣布管理层调整：李书福辞任董事会主席，安聪慧接任</strong></p>\n  <p>36氪获悉，吉利汽车控股有限公司宣布对管理层进行调整，自2026年8月18日起，李书福辞任吉利汽车控股有限公司董事会主席及执行董事职务。为表彰李书福多年来对公司发展做出的卓越贡献，他获任为公司终身荣誉主席。李书福继续担任浙江吉利控股集团董事长。安聪慧获任吉利汽车控股有限公司董事会主席。此外，李东辉辞任吉利汽车控股有限公司董事会副主席职务，继续担任公司执行董事。桂生悦辞任吉利汽车控股有限公司行政总裁职务，获任公司董事会副主席，继续担任公司执行董事。淦家阅获任吉利汽车控股有限公司行政总裁。</p>\n  <p>针对李书福卸任吉利汽车董事会主席一事，吉利汽车董事会副主席桂生悦在2026年中期业绩发布会上回应称，这是吉利汽车去家族化的宣言，标志着公司将不再依赖个人魅力和权威，未来治理将更加透明，决策将更加专业和科学。（36氪、第一财经）</p>\n  <p><strong>iPhone 17系列或月底前全球涨价，单台最高涨近千元</strong></p>\n  <p>iPhone 17系列或即将迎来一轮全球性调价。8月17日，供应链内部消息称，苹果计划在2026年8月底前完成全球各区域iPhone 17系列调价，全机型涨价上限不超千元人民币，调价标准可参照此前日本落地的涨价方案。</p>\n  <p>就在7月18日，日本市场上调了iPhone、Apple Watch及AirPods系列产品售价，为苹果近年来在该地区首次大范围价格调整。具体来看，iPhone 17 Pro Max最高存储版本售价由32.98万日元升至35.48万日元，上涨2.5万日元（约合人民币1060元）；iPhone 17起售价由12.98万日元升至14.28万日元，涨1.3万日元（约合人民币551元）。Apple Watch Series 11、Ultra 3及AirPods系列产品也同步提价。市场认为，成本上升、汇率变化及供应链因素推动价格调整。在中国市场，苹果尚未宣布调整iPhone 17系列的价格，但在6月上调了Mac、iPad全系硬件定价，覆盖MacBook全系列、iPad全系、Mac桌面设备、Vision Pro与HomePod。（界面新闻）</p>\n  <p><strong>宇树科技发布“超人”</strong></p>\n  <p>36氪获悉，宇树科技发布新机“超人”。宇树科技称，该人形机器人突破全人类极限。0.85米腿长，可原地跳高2米，极限速度12.66m/s，超越全世界全人类原地跳高和奔跑速度记录。全新整机刚用3个多月研发出来，未来几个月还有很大的完善空间。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek API 8月17日正式调价，最高涨幅达1100%&nbsp;</strong></p>\n  <p>8月17日，DeepSeek API正式涨价。DeepSeek官方公众号8月13日曾发布消息称，对DeepSeek API价格进行更新调整，采用峰谷定价，空闲时段价格为高峰时段价格的一半。高峰时段为北京时间9:00-12:00、14:00-18:00(其余为空闲时段)。新价格于北京时间8月17日00:00开始生效。</p>\n  <p>以旗舰模型DeepSeek-v4-pro为例，高峰时间段，V4 Pro每百万tokens输入（缓存未命中）9元，涨幅200%；输出27元，涨幅350%；缓存命中输入0.3元，涨幅1100%。空闲时间段，V4 Pro每百万tokens输入（缓存未命中）4.5元，输出13.5元，缓存命中输入低至0.15元。DeepSeek-V4-Pro正式版于8月13日发布，该版本增强了智能体（Agent）能力。当时，DeepSeek-V -Pro价格是轻量级模型V4 Flash的大约三倍。以每百万tokens计算，V4 Pro输入是0.025元（缓存命中）和3元（缓存未命中），输出则是6元。相比之下，V4 Flash对应的价格分别为0.02元、1元和2元。</p>\n  <p>据了解，DeepSeek此次推出峰谷定价的核心初衷，是平衡日间算力拥堵问题。借助市场化价格杠杆，引导企业开发者错峰调度大模型任务，分流高峰算力压力，从而提升整体平台运行稳定性。（界面新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260818/v2_29942a6c91004efda3c83ec062c0de4d@5667365_oswg45786oswg1080oswg595_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DeepSeek API 新定价</p>\n  <p><strong>千问办公开源MyContext，为Agent打造全新的上下文基础设施</strong></p>\n  <p>36氪获悉，千问办公于近日开源了全新的上下文基础设施“MyContext”。它可以把海量异构的个人工作数据加工成Agent易理解的专属工作档案，让Agent读懂用户和真实业务工作流，并最终在决策和执行等环节实现人机协同，提升Agent在工作场景下的表现。</p>\n  <p><strong>英伟达为OpenAI俄亥俄州AI数据中心提供最高1050亿美元担保</strong></p>\n  <p>8月17日，英伟达宣布与SB Energy达成多年期合作，推进美国俄亥俄州PORTS Technology Campus大型AI数据中心建设。OpenAI将作为该项目租户，使用约4.25吉瓦IT负载容量部署英伟达全栈DSX AI工厂平台。英伟达已就相关租赁安排提供最高1050亿美元的剩余价值担保，并可自行决定为额外约3.8吉瓦容量提供信用支持。（界面新闻）</p>\n  <p><strong>OpenAI与英伟达扩大计算机会，到2030年计算规模或达6000亿美元</strong></p>\n  <p>根据英伟达发布的新闻稿，OpenAI将在PORTS-Pike建设并运营一座世界级的人工智能工厂。AI工厂将采用英伟达的全栈DSX AI工厂平台，包括GPU、CPU、网络和基础设施软件。 初步部署预计将提供4.25吉瓦的AI工厂产能。PORTS-Pike部署的每代NVIDIA AI工厂系统约可代表150万块NVIDIA GPU，约占1500亿美元至2000亿美元的NVIDIA收入。经过20年的发展，该站点支持多次升级周期。 NVIDIA也可能选择将PORTS-Pike的安排延长至初始4.25吉瓦以上，以确保剩余的3.75吉瓦容量。OpenAI承诺将在2030年前大规模部署NVIDIA AI基础设施。OpenAI现有和计划中的承诺约占NVIDIA计算12吉瓦，如果NVIDIA将PORTS-Pike协议扩展至约16吉瓦，将有机会扩展至约16吉瓦。 英伟达表示，在这些层面上，这一机会代表到2030年NVIDIA计算量约为6000亿美元。（财联社）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>宇树科技：股票将于8月19日在上海证券交易所科创板上市</strong></p>\n  <p>36氪获悉，宇树科技公告，公司股票将于8月19日在上海证券交易所科创板上市。</p>\n  <p><strong>美股三大指数集体收跌，热门中概股涨跌不一</strong></p>\n  <p>36氪获悉，8月17日收盘，美股三大指数集体下跌，道指跌0.51%，纳指跌0.32%，标普500指数跌0.52%。大型科技股多数下跌，Meta、微软跌超3%，奈飞跌超2%，特斯拉、谷歌、亚马逊、苹果、英伟达小幅下跌；闪迪涨超8%，SpaceX涨超4%。热门中概股涨跌不一，老虎证券涨超5%，小鹏集团、富途控股涨超4%，拼多多涨超2%，蔚来、理想汽车涨超1%；名创优品跌超8%，京东、爱奇艺、微博、哔哩哔哩跌超1%。</p>\n  <p><strong>特朗普：美国不寻求延长与伊朗的谅解备忘录</strong></p>\n  <p>8月18日讯，美国总统特朗普表示，美国目前不寻求延长与伊朗的谅解备忘录。特朗普称，伊朗希望达成协议，但不会接受他认为“必要的”协议内容。特朗普再次提出将霍尔木兹海峡宣布为美国领土的想法，并重申美国控制该海峡。他同时声称，目前霍尔木兹海峡保持开放，油价正在下行。(金十数据APP)</p>\n  <p><strong>大涨12%，长鑫市值约为2.5个茅台</strong></p>\n  <p>8月17日，长鑫科技（688825.SH）股价大涨，并创下上市以来新高。截至当天收盘，报61.8元/股，涨12%，最新总市值4.13万亿元，是A股目前市值最高的个股，其市值约为贵州茅台的2.5倍（最新总市值1.62万亿元）。（界面新闻）</p>\n  <p><strong>支付宝发布国内首个智能体商业底座</strong></p>\n  <p>36氪获悉，支付宝今日发布首个全栈智能体商业底座及多智能体跨端互联AHA协议体系，联合千问、华为、OPPO、比亚迪、吉利等20余家企业共建智能体互联生态。据了解，支付宝旗下超级服务智能体“阿宝”目前完成了超过一万项服务的AI化接入，服务跨端支持5大手机品牌、16家主流车企。</p>\n  <p><strong>中国在稀土检测关键技术领域取得重要进展</strong></p>\n  <p>8月17日了解到，近日，中国在稀土检测关键技术领域取得重要进展。长期以来，高纯稀土中稀土杂质含量准确测定面临基体干扰的难题，并严重制约稀土产品质量的精准把控。为突破这一技术瓶颈，依托江西理工大学建立的国家市场监督管理总局重点实验室（稀土产品检测与溯源）开展专项技术攻关，经过研究团队的不懈努力，检测技术取得突破，整体技术能力迈上新台阶。研究团队成功研发出多项稀土检测关键技术，其中电感耦合等离子体串联质谱法直接测定高纯稀土中的稀土杂质含量技术尤为突出。该技术成功突破了传统检测方法需要提前对基体进行分离、存在检出限高等瓶颈，具备高灵敏度、高准确性和快速检测等显著优势，能够直接精准测定高纯稀土中的痕量稀土杂质，为稀土产品质量控制提供了坚实有力的技术支撑。（央视新闻）</p>\n  <p><strong>两部门：研究完善成品油消费税制度，完善成品油定价机制</strong></p>\n  <p>36氪获悉，国家发展改革委、国家能源局印发《石油天然气发展“十五五”规划》。其中提到，推动上游供气主体多元化。促进城镇燃气企业整合重组，规范化经营，落实好天然气上下游价格联动机制。规范供气企业行为，更好发挥天然气合同基础性作用，完善储气调峰市场机制。加强民生用气保障。研究完善成品油消费税制度。完善成品油定价机制。定期校核跨省天然气管道运输价格。</p>\n  <p><strong>豆包支持手机远程操控电脑</strong></p>\n  <p>8月17日，豆包发布产品更新，“工作任务”模式新增手机远程控制电脑功能。同一账号授权后，用户在手机端下达任务指令，可以由已连接的电脑端读取本地文件、操作软件完成执行，进度和结果实时回传手机，帮助用户在通勤、离开工位等各类场景中自动执行任务，提升效率。（第一财经）</p>\n  <p><strong>贵州茅台低开3.5%，失守1300元关口</strong></p>\n  <p>8月17日，A股主要指数集体高开，上证指数低高开0.07%，深证成指高开0.31%，创业板指高开0.18%，科创综指高开0.27%。有色金属、农业、算力硬件等板块涨幅居前，大消费低迷，白酒股领跌，贵州茅台低开CRO概念回调。贵州茅台低开3.5%，失守1300元关口。消息面上，贵州茅台发布2026年半年度报告，上半年归属于上市公司股东的净利润445.17亿元，同比下降1.95%。其中公司Q2净利润172.74亿，Q1净利润272.43亿，据此计算，Q2净利润环比下降36%。（每日经济新闻）</p>\n  <p><strong>胖东来今年已成立2家新公司</strong></p>\n  <p>36氪获悉，据媒体报道，近日，于东来在直播中宣布许昌胖东来生活广场店将于2026年12月关闭。该广场内厂商代表称，他们的合作方就是胖东来，胖东来从来没有涨过他们的房租。天眼查App显示，许昌市胖东来商贸集团有限公司成立于1997年9月，法定代表人为于东来，注册资本5660万人民币，控制企业信息显示，今年以来，该公司已成立胖东来餐饮（郑州）有限公司、许昌市胖东来乐予文化娱乐有限公司。</p>\n  <p><strong>旺旺食品旗下多家公司已注销</strong></p>\n  <p>36氪获悉，日前，旺旺集团的一封内部公开信流传网络，董事长蔡衍明将集团2026财年第一季度的业绩失速直接定性为“重大经营危机”。天眼查App显示，旺旺集团关联公司旺旺（中国）投资有限公司成立于2004年9月，法定代表人为李玉生，注册资本5000万美元，经营范围包括在中国的食品、饮料以及相关产品及房地产、医疗机构等国家允许外商投资的领域依法进行投资等。对外投资信息显示，该公司旗下多家企业已注销。此外，该公司存在历史被执行人信息。</p>\n  <p><strong>人民币对美元汇率升破6.74，创三年半新高</strong></p>\n  <p>36氪获悉，人民币对美元汇率在在岸和离岸市场双双升破6.74关口。8月17日，人民币对美元即期汇率盘中升破6.74关口，创下2023年2月上旬以来新高。离岸市场上，人民币对美元汇率同样升破6.74关口，至6.7388，同样刷新3年半新高。</p>\n  <p><strong>钉钉全球商业总裁杨猛将离任，下一站蚂蚁集团</strong></p>\n  <p>钉钉新管理层完成组织调整不到两个月，负责商业化多年的核心高管杨猛即将离任。记者从接近钉钉的知情人士处获悉，钉钉全球商业总裁、客户发展部负责人杨猛已完成离职相关内部流程，计划加入蚂蚁集团。阿里钉钉悟空副总裁任卿（花名“易统”）将接手杨猛负责的商业化工作。（21世纪经济报道）</p>\n  <p><strong>大疆诉美国防部案赢得关键程序性胜利，美市场仍高度依赖大疆无人机</strong></p>\n  <p>从大疆创新（DJI）获悉，美国当地时间8月14日，大疆创新诉美国国防部案迎来重大实质性进展。美国哥伦比亚特区联邦巡回上诉法院裁定，下级法院需重新审理大疆被列入五角大楼“中国军事企业”（CMC）黑名单一案。这一裁决标志着大疆在美长达数年的相关法律维权取得了重要的程序性胜利。针对上诉法院的这一最新裁决，大疆向记者提供的声明称：“我们欢迎美国上诉法院作出的这一积极裁决，这是最终纠正不当列名的重要一步。该裁定也进一步印证了大疆一贯坚决反对将产品与技术用于任何军事或战争用途的立场。未来，我们将继续通过法律途径，坚决捍卫公司及全球用户的合法权益。”（环球时报）</p>\n  <p><strong>中信资本收购阿里旗下灵犀互娱已正式生效</strong></p>\n  <p>从接近交易的人士处获悉，灵犀互娱CEO周炳枢于8月17日发布内部信，确认阿里巴巴集团与中信资本旗下信宸资本已正式达成交易协议。根据协议安排，阿里巴巴将出让所持有的灵犀互娱股份，信宸资本将成为灵犀互娱的新任股东。此前，有报道称，中信资本旗下信宸资本以超15亿美元（折合人民币超101亿元）收购阿里巴巴灵犀互娱。（上证报）</p>\n  <p><strong>英伟达高管、黄仁勋之女将于8月18日到访LG电子机器人中心</strong></p>\n  <p>行业消息人士8月17日透露，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）计划于本周晚些时候到访LG电子公司在韩国的机器人中心。黄敏珊定于8月18日访问，计划与LG电子高层官员就双方在人工智能（AI）基础设施和机器人领域深化合作的事宜举行闭门会谈。预计此次会谈将主要聚焦机器人业务，地点设在LG电子位于首尔南部正在建设的数据工厂。（新浪财经）</p>\n  <p><strong>亚马逊修改使用条款，再度禁止用户发起集体诉讼</strong></p>\n  <p>根据亚马逊当地时间本月14日更新的使用条款，这家全球电商与科技巨头带回了曾在2021年被移除的一系列争议处理条款，再度禁止用户发起集体诉讼。此次更新的争议条款还表示，用户与亚马逊的争议或索赔应通过具有约束力的仲裁而非法律诉讼解决（例外包括符合小额索赔法庭管辖范围、涉及知识产权、涉及全体公众利益），双方放弃在法院提起诉讼并由法官或陪审团审判的权利。（新浪财经）</p>\n  <p><strong>高盛助攻英伟达：5000亿美元计划，破解AI基建最大资金瓶颈</strong></p>\n  <p>英伟达正着手解决AI热潮中日益凸显的核心制约——融资难题。高盛已开始与保险公司、银行及资产管理公司接洽，推动英伟达动员超过5000亿美元资金，用于AI基础设施建设。此举有望让客户在无需将全部成本压在自身资产负债表上的情况下，持续采购日益昂贵的英伟达系统。这项于8月10日宣布的计划，将英伟达与高盛、阿波罗、贝莱德、黑石、布鲁克菲尔德和KKR等机构联合起来，打造独立的融资平台，专门服务于英伟达驱动的AI基础设施。英伟达可能为相关交易提供最高1250亿美元（约占总规模25%）的支持。（新浪财经）</p>\n  <p><strong>韩国散户扎堆个股杠杆ETF，券商与交易所两月大赚超千亿韩元手续费</strong></p>\n  <p>自跟踪三星电子与SK海力士的单一股票杠杆、反向ETF上市以来，韩国交易所与各家券商两个多月累计赚取手续费收入超1170亿韩元。有观点指出，个人投资者蜂拥入局这类高风险产品，负责市场运营的交易所与提供交易中介服务的券商赚取了巨额手续费。17日从金融监督院、韩国交易所获取并提交的数据显示：三星电子、SK海力士相关单一股票杠杆及反向ETF自5月27日上市至上月末，交易所与券商合计收取相关手续费达1172.6亿韩元，相关产品共计16只。交易活跃的交易日，交易所单日手续费收入便可突破10亿韩元。6月24日手续费收入10.51亿韩元，上月14日达10.11亿韩元。（财联社）</p>\n  <p><strong>美国要求韩国将存储芯片作为首个对美投资重点</strong></p>\n  <p>韩国政府原计划于本月晚些时候公布的首个对美投资项目，因美国突然要求韩国投资存储芯片生产设施而面临不确定性。多名未具名执政党人士称，美国要求韩国投资存储芯片项目，是8月13日韩国总统府闭门贸易会议讨论的核心议题。韩国政府最初将能源领域作为首个重大对美投资项目的优先方向。一位未具名官员称，美国正在调整优先事项，并提出额外要求。与会人士普遍认为，鉴于三星电子和SK海力士已承诺在韩国Honam地区进行大规模投资，在美国投资存储芯片项目实际上会很困难。（新浪财经）</p>\n  <p><strong>OpenAI总裁回应高管流失潮：并非十分反常</strong></p>\n  <p>OpenAI总裁格雷格・布罗克曼于周一回应，淡化市场对这家人工智能公司高管流失的担忧，他认为这一轮离职潮“实际上并非十分反常”。布罗克曼表示：“我其实觉得，OpenAI和其他机构的区别在于我们处在极高的聚光灯下，每一次人员离职都会受到格外审视，而普通企业的人员变动不会遭遇这样的待遇。”“公司发展历经不同阶段，各个时期都有不同的管理团队。”布罗克曼周一称，“我和萨姆・奥尔特曼始终留在公司，我认为，正是这种韧性以及团队多元性，让我们变得更强大。”（新浪财经）</p>\n  <p><strong>机构警告全球食品价格通胀或迎来新一轮危机</strong></p>\n  <p>美国金融机构摩根大通日前发布最新报告预计，全球食品价格通胀率将从今年上半年的2.8%提升至明年上半年的5%。这家机构表示，下一次全球通胀冲击可能不会出现在加油站，而是在超市的食品货架。摩根大通在报告中警告，中东战事导致霍尔木兹海峡通行受阻，加之强厄尔尼诺可能造成农作物减产，多重因素叠加将冲击农业生产，导致食品价格在2027年上半年居高不下。（新华社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>湖南裕能新能源电池材料股份有限公司递表港交所</strong></p>\n  <p>36氪获悉，港交所文件显示，8月17日，湖南裕能新能源电池材料股份有限公司向港交所提交上市申请书，中信建投国际和汇丰为联席保荐人。</p>\n  <p><strong>软银向建筑机器人公司Gravis Robotics投资2亿美元</strong></p>\n  <p>8月17日，Gravis Robotics宣布完成2亿美元A轮融资，由软银投资。公司称，这是建筑机器人领域规模最大的A轮融资，将用于推进重型工程机械自动化，并在全球建筑工地扩大部署。Gravis Robotics成立于2022年，由苏黎世联邦理工学院孵化，主要开发用于挖掘机等重型工程机械的人工智能系统。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>传音控股：上半年净利润同比增长46.22%，拟10派8元</strong></p>\n  <p>36氪获悉，传音控股披露半年报，2026年上半年实现营业收入354.31亿元，同比增长21.85%；归属于上市公司股东的净利润为17.73亿元，同比增长46.22%；基本每股收益1.54元。公司拟每10股派发现金红利8元（含税）。</p>\n  <p><strong>吉利汽车：2026年上半年收入超1700亿元，核心归母净利润同比增长46%</strong></p>\n  <p>36氪获悉，吉利汽车控股有限公司发布2026年中期业绩，上半年公司总营收达1736亿元，同比增长15%，创历史新高。核心归母净利润达96.8亿元，同比增长46%；核心归母净利率5.6%，同比增长27%。毛利率提升至17.9%，单车收入同比提升16%至11.2万元。</p>\n  <p><strong>新联电子：上半年净利润4.53亿元，同比增长140.95%</strong></p>\n  <p>36氪获悉，新联电子披露半年报，2026年上半年，公司实现营业收入4.08亿元，同比增长8.25%；归属于上市公司股东的净利润4.53亿元，同比增长140.95%；基本每股收益0.54元。</p>\n  <p><strong>中材科技：上半年净利润12.08亿元，同比增长20.93%</strong></p>\n  <p>36氪获悉，中材科技披露半年报，2026年上半年，公司实现营业收入162.57亿元，同比增长21.95%；归属于上市公司股东的净利润12.08亿元，同比增长20.93%；基本每股收益0.7197元。</p>\n  <p><strong>多氟多：上半年净利润5.12亿元，同比增长897.19%</strong></p>\n  <p>36氪获悉，多氟多披露半年报，公司上半年实现营业收入70.36亿元，同比增长62.55%；归属于上市公司股东的净利润5.12亿元，同比增长897.19%；基本每股收益0.43元/股。</p>\n  <p><strong>宁波韵升：上半年净利润2.74亿元，同比增长154.18%</strong></p>\n  <p>36氪获悉，宁波韵升披露半年报，2026年上半年，公司实现营业收入33.37亿元，同比增长42.02%；归属于上市公司股东的净利润2.74亿元，同比增长154.18%；基本每股收益0.2547元。</p>\n  <h2>投融资</h2>\n  <p><strong>AI视频生成平台Higgsfield完成4亿美元新一轮融资</strong></p>\n  <p>据报道，AI视频生成平台Higgsfield成功完成4亿美元的新一轮融资，投资者包括DST Global、高盛、Liberty Global以及英特尔旗下投资部门等。本次融资将Higgsfield的估值推升至54亿美元。数据显示，公司今年8月的年化收入已高达7亿美元，与一年前仅约2000万美元的规模相比，增长34倍。（界面新闻）</p>\n  <p><strong>“猿声科技”连续完成三轮融资，金额超亿元</strong></p>\n  <p>36氪获悉，具身触觉企业“猿声科技”宣布连续完成三轮融资，分别由恒信华业、上富电技和拓普集团领投，曦晨资本等财务机构跟投，融资额超亿元人民币。据公司披露，猿声科技首款多维触觉标准产品推出后，已进入多家国内外头部灵巧手、机器人及数据采集客户的量产项目，年内传感器订单总规模达到数十万颗。</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-08-18T00:05:17+00:00", "fetched_at": "2026-08-18T00:57:30.174144+00:00", "finge "title": "Open Mike Eagle and Kenny Segal crafted a hip hop breakup masterpiece", "url": "https://www.theverge.com/entertainment/980799/open-mike-eagle-and-kenny-segal-doomed-review", "summary": "\"Breakups are… tough.\" It's the opening lines of an interlude towards the end of DOOMED! Called \"It Happens in Every Universe.\" It's also basically the thesis of the entire record. It's no grand revelation, but it's a well-trodden subject that Open Mike Eagle manages to mine for artistic gold. Eagle's subject matter is usually personal, [&#8230;]", "category": "tech", "published_at": "2026-08-16T20:31:37+00:00", "fetched_at": "2026-08-17T00:58:34.023063+00:00", "fingerprint": "e85ee583580cef8b"}, {"source": "The Verge", "title": "OpenAI reportedly disbanded its preparedness team", "url": "https://www.theverge.com/ai-artificial-intelligence/980817/openai-disbands-preparedness-team", "summary": "According to the Financial Times, OpenAI disbanded its preparedness team at the end of last month. The job of the preparedness team was to assess if models posed serious risks and develop ways to mitigate those risks. (You know, like the possibility that it could go rogue and hack another company.) According to FT, responsibility [&#8230;]", "category": "tech", "published_at": "2026-08-16T21:32:56+00:00", "fetched_at": "2026-08-17T00:58:34.023054+00:00", "fingerprint": "d1b7ed52e00e3aef"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨Anthropic有望2万亿美元估值上市；旺旺集团面临重大经营危机；Sorry勒索病毒正在国内传播", "url": "https://36kr.com/p/3942852697652356?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>宇树科技未上市先疯抢，部分中介出价520元/股</p>\n  <p>SK海力士董事长道歉，价格涨太快我很抱歉</p>\n  <p>段永平1300亿持仓曝光，大幅减持英伟达、谷歌</p>\n  <p>美图RoboNeo正式上线短剧专业版</p>\n  <p>小熊电器上半年净利下降4成，海外增长未能对冲国内压力</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>Anthropic有望2万亿美元估值上市，成为史上规模最大的IPO</strong></p>\n  <p>《财富》（fortune）8月13日发布博文，报道称Anthropic计划2026年10月以2万亿美元（现汇率约合13.51万亿元人民币）估值IPO上市，其规模将超过SpaceX，成为史上规模最大的IPO。业内指出，Anthropic已于6月向美国证券交易委员会秘密提交IPO相关文件，进入静默期，受此约束，企业不得对外发布涉及自身财务表现的公开信息。</p>\n  <p>今年Anthropic推出多款性能优于竞品的模型，同时聚焦面向企业客户的销售业务。公司于5月公布其年化营收已经突破470亿美元（现汇率约合3,175.75亿元人民币）。（IT之家）</p>\n  <p><strong>旺旺创始人发布公开信：旺旺集团面临重大经营危机</strong></p>\n  <p>近日，旺旺集团创始人蔡衍明一封内部公开信在网络上传播。信中直言公司第一季度业绩及利润表现未达预期，将其定性为“重大经营危机”，要求内部反思产品创新不足、渠道老化等深层问题。不少网友对旺旺情怀仍在，纷纷为其支招，其中最高频的建议为减糖，15日，“旺旺最大的对手竟是糖”登上微博热搜。</p>\n  <p>记者注意到，随后，“旺仔俱乐部”发布了一篇图文回应网友们的减糖呼声，晒出一系列无糖及低糖的旺旺新品，其中包括饮料、零食等。这篇图文提到，“未来将继续勇于尝试，努力成为更好的旺旺。”（北京日报）</p>\n  <p><strong>网络安全预警：Sorry勒索病毒正在国内传播</strong></p>\n  <p>近日，国家计算机病毒应急处理中心、计算机病毒防治技术国家工程实验室联合发布安全预警，中国境内已出现多起“Sorry”勒索病毒攻击案例。该病毒入侵后会加密用户设备内全部重要文件，统一追加“Sorry”后缀，同时留存勒索信。</p>\n  <p>不同于普通恶意程序需要用户手动点击、授权安装，“Sorry”勒索病毒可借助系统漏洞实现无感入侵，隐蔽性、攻击性更强。记者走访网络安全专家，通过实景测试完整还原病毒加密、勒索的全流程。专家表示，这次的勒索病毒，与以往大多数需要欺骗网民主动安装的程序不同，而是通过系统漏洞，直接登录服务器，入侵过程用户毫无感知。（央视网）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>“千问办公”首发上线GLM-5.3、DeepSeek V4 Pro两款模型</strong></p>\n  <p>阿里巴巴旗下Agent产品“千问办公”首发上线GLM-5.3和DeepSeek V4 Pro两款前沿模型。即日起，用户可在产品首页的“前沿模型”档位直接选用。加上此前首发上线的Qwen3.8-Max，千问办公目前已支持三款国产旗舰模型。</p>\n  <p><strong>英伟达据悉拟向软银旗下SB Energy投资30亿美元</strong></p>\n  <p>8月16日，据报道，英伟达正就向软银旗下SB Energy投资最多30亿美元进行谈判。SB Energy正在美国俄亥俄州开发一个大型数据中心项目，为OpenAI提供算力基础设施。据悉，该投资是英伟达、OpenAI与SB Energy围绕俄亥俄州数据中心项目提供约1000亿美元信贷支持的谈判组成部分。英伟达拟在项目签署时投资约15亿美元，其余资金可能通过SB Energy计划中的首次公开募股（IPO）投入。SB Energy最快拟于9月上市，预计募资至少50亿美元。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>知情人士回应追觅大家电解散：业务正常做</strong></p>\n  <p>近日，“网传追觅大家电解散”相关话题登上微博热搜，引发广泛关注。据流出内容，疑似追觅AWE期间冰箱相关业务供应商存在未结款情况，打算组团维权，引发大量供应商评论并唱衰追觅。部分人员甚至牵扯提及追觅裁员缩减、创始人俞浩卖掉私人飞机等事。</p>\n  <p>对于前述消息，截至发稿公司暂无回应。记者注意，目前发布该帖子的供应商已经删除相关内容。有接近追觅的知情人士透露，目前相关业务仍在“正常做”。（新浪科技）</p>\n  <p><strong>宇树科技未上市先疯抢，部分中介出价520元/股</strong></p>\n  <p>宇树科技场外“暗盘交易”悄然兴起。目前多家中介通过各类渠道收购该股新股，报价分歧较大，部分中介出价520元/股（发行价150.8元/股），亦有中介报价410元/股；不少中签者也主动上网寻觅买家。值得注意的是，这类“暗盘交易”以往常见于北交所新股，近期正向科创板明星股扩散。记者此前注意到，在长鑫科技上市前，也有中介高价回收该股新股，当时中介的报价是36元/股（发行价8.66元/股）。（券商中国）</p>\n  <p><strong>SK海力士董事长道歉，价格涨太快我很抱歉</strong></p>\n  <p>日前，SK集团会长崔泰源在SK海力士韩国总部接受媒体采访时，用这样的措辞形容当前的存储芯片市场。“价格涨得太快了，对此我真的很抱歉。”崔泰源表示。这并非崔泰源首次发出警告。今年7月，SK海力士在纳斯达克上市之际，他就曾指出AI时代内存需求呈指数级增长，未来五年产能翻倍仍难满足。而在此次专访中，他的预判更加具体、也更加紧迫。（上海证券报）</p>\n  <p><strong>黄仁勋投了马斯克210亿美元，为SpaceX第六大投资者</strong></p>\n  <p>英伟达当地时间14日向美国证券交易委员会提交的监管文件显示，截至今年二季度末，公司持有马斯克旗下SpaceX约1.228亿股A类股票，价值约210亿美元，为SpaceX第六大投资者。</p>\n  <p>根据金融数据机构FactSet的数据，SpaceX第一大股东为马斯克本人，按二季度末股价测算，其持股账面价值约8500亿美元。而英伟达的210亿美元持仓是该公司第二大股权持仓，仅次于英特尔。受近期SpaceX股价回调影响，该持仓当前市值已缩水。SpaceX股价14日收于140美元，较6月底的170.86美元下跌约18%，英伟达持股对应市值降至约172亿美元。报道称，英伟达对SpaceX的持股并非直接买入，而是源于今年1月对马斯克人工智能公司xAI的100亿美元投资。2月，SpaceX 以换股形式收购xAI，合并后实体估值1.25万亿美元，英伟达持有的xAI股权由此转换为SpaceX股权。（21世纪经济报道）</p>\n  <p><strong>段永平1300亿持仓曝光，大幅减持英伟达、谷歌&nbsp;</strong></p>\n  <p>截至二季度末，由段永平管理的H&amp;H International Investment基金总持仓市值约191亿美元，约合人民币1370亿元，较去年四季度末的200亿美元有所下降。二季度，段永平继续增持拼多多，重新买入阿里巴巴，同时减持苹果、英伟达、谷歌、微软等，清仓台积电、CrowdStrike等个股。（证券时报）</p>\n  <p><strong>今年以来港股IPO基石投资额同比增长158.3%&nbsp;</strong></p>\n  <p>今年以来，越来越多的机构投资者参与港股IPO基石投资。数据显示，截至8月14日，年内共有102家公司在港交所上市，募资总额达3287.58亿港元，同比增长154.17%。其中，84家公司IPO引入了基石投资者，涉及951笔投资，同比增长291%；基石投资额1392.1亿港元，同比增长158.3%。（证券日报）</p>\n  <p><strong>SK海力士上半年人均薪酬68.7万，较去年同期增长约23%</strong></p>\n  <p>SK海力士今年上半年营业总收入131.90万亿韩元（现汇率约合6,292.95亿元人民币），同比增长230.8%; 归母净利润134.15万亿韩元（现汇率约合6,400.3亿元人民币），同比增长788.16%；毛利率81.63%，同比增长26.24个百分点。财报显示，SK 海力士今年上半年公司员工人均薪酬为1.44亿韩元（现汇率约合68.7万元人民币），较去年同期的1.17亿韩元（现汇率约合55.8万元人民币）增长约23%。（IT之家）</p>\n  <p><strong>摩根大通：明年或爆发全球粮食危机，全球食品通胀率将从2.8%升至5%</strong></p>\n  <p>摩根大通日前警告称，下一轮全球粮食危机可能正在酝酿之中，或于明年爆发。该行分析师将驱动因素归结为“五个W”：战争（War）、天气（Weather）、仓储（Warehousing）、水（Water）和浪费（Waste）。</p>\n  <p>在一份题为《粮食安全即国家安全：一场不断叠加的风暴》（Food Security Is National Security: A Compounding Storm）的新报告中，由驻伦敦资深全球经济学家Nora Szentivanyi领衔的团队警告称，霍尔木兹海峡航运中断，以及潜在的历史级超强厄尔尼诺现象的出现，可能会削弱农作物产量、制约农业生产，并使食品通胀在2027年上半年持续居高不下。她预计，全球食品通胀率将从2026年上半年的2.8%加速升至明年上半年的5%。（新浪财经）</p>\n  <p><strong>上海迪士尼正扩建“飞越地平线”，第九大主题园区建设迎新进展</strong></p>\n  <p>第九大主题园区——蜘蛛侠主题园区建设迎来又一重要里程碑。继今年6月主题园区游乐设备轨道安装完成后，首批乘骑设备已于数日前就位，乘骑设备调试工作即将启动。上述消息于正在美国加利福尼亚州召开的迪士尼终极粉丝大会D23（以下简称“D23粉丝大会”）公布。此外，上海迪士尼乐园内标志性主题景点“翱翔·飞越地平线”的扩建工作正在同步推进；毗邻乐园的两座全新主题酒店的扩建工作也在进行中。（红星新闻）</p>\n  <p><strong>哈佛持有价值22亿美元SpaceX股份</strong></p>\n  <p>哈佛大学投资管理机构披露持有价值22亿美元SpaceX股份。这家机构早年投资埃隆・马斯克旗下火箭企业，在SpaceX重磅上市后收获巨额回报。哈佛管理公司于周五在监管申报文件中披露该持仓。在其规模43亿美元的美股投资组合里，SpaceX成为持仓市值最高的单一标的。这笔持仓充分体现：SpaceX在6月创下纪录的IPO，为一众大学捐赠基金带来丰厚收益。不少高校捐赠基金早在十余年前就通过风投渠道布局这家公司。根据最新公开数据，截至2025年6月，哈佛管理公司管理资产规模约570亿美元。并非只有哈佛受益于SpaceX登陆公开市场。加州大学旗下投资机构申报文件显示，持有价值约10亿美元SpaceX股票；北卡罗来纳大学、圣路易斯华盛顿大学同样持有该公司投资。</p>\n  <p><strong>李录大举加仓拼多多，持仓仅剩8只&nbsp;</strong></p>\n  <p>李录掌管的喜马拉雅基金，则大手笔清仓美国银行、西方石油、穆迪、标普全球、MSCI、H&amp;R Block等6只个股，同时大举加仓拼多多和伯克希尔B股。其中，拼多多更是被翻倍增持。截至二季度末，喜马拉雅基金总持仓市值由上季末的32亿美元升至37亿美元，持仓数量则进一步压缩至8只。（证券时报）</p>\n  <p><strong>美图RoboNeo正式上线短剧专业版</strong></p>\n  <p>36氪获悉，美图RoboNeo正式上线短剧专业版。美图RoboNeo短剧专业版围绕短剧洞察、3D场景搭建、团队协作及创作资产管理四大方向进行能力升级。官方资产库提供服装、发型、配饰、场景等素材，并支持快速生成角色三视图。</p>\n  <p><strong>澳研究人员利用干细胞培育出人类心脏瓣膜组织</strong></p>\n  <p>澳大利亚研究人员日前利用干细胞在实验室培育出人类心脏瓣膜组织，可用于研究心脏瓣膜的发育和病变过程，并可用于测试相关疾病的治疗方法。研究成果已发表在美国《细胞－干细胞》杂志上。澳大利亚默多克儿童研究所发布消息说，由该机构牵头的研究团队培育出的组织能够再现人类心脏瓣膜的分子特征和复杂结构。</p>\n  <p>研究团队成员霍莉·福格斯说，这项成果解决了心脏瓣膜生物学研究中的一项重要难题。此次培育出的组织有助于研究心脏瓣膜如何发育、成熟并发生病变，也可用于在实验室中测试潜在治疗方法。研究人员还用培育出的组织开展了炎症性瓣膜疾病相关测试。实验显示，当培育出的组织接触与风湿性心脏病相关的炎症蛋白后，组织变得僵硬，并出现与患病人类心脏瓣膜相符的生物标志物。（央视新闻）</p>\n  <p><strong>伯克希尔·哈撒韦第二季度增持谷歌</strong></p>\n  <p>当地时间8月14日，据报道，伯克希尔·哈撒韦在第二季度清仓了星座品牌（STZ）；减持了克罗格（KR）、第一资本金融（COF）、纽柯钢铁（NUE）、Ally金融（ALLY）、达维塔（DVA）。增持了谷歌A（GOOGL）、谷歌（GOOG）、达美航空（DAL）、莱纳房屋（LEN）、梅西百货（M）。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>迈时光电IPO辅导备案获受理</strong></p>\n  <p>中国证监会公示信息显示，苏州迈时光电股份有限公司的上市辅导备案申请于8月14日获受理，辅导机构为国泰海通证券。此次辅导备案获受理，标志着迈时光电进入上市辅导阶段。迈时光电成立于2015年，是一家在全球光互联领域具备垂直整合能力的平台型光学技术企业，长期专注于无源光器件的研发、生产与销售。（投中网）</p>\n  <h2>大公司财报</h2>\n  <p><strong>Anthropic第二财季营收超过115亿美元，较上年同期飙升至少13倍</strong></p>\n  <p>Anthropic PBC向潜在投资者表示，其第二季度营收较上年同期增长至少13倍。文件显示，Anthropic最近一个完整季度的初步营收超过115亿美元，2025年同期为7.87亿美元，今年第一季度为47.3亿美元。文件还显示，Anthropic在2026年第二季度调整后营业利润转为正值。相关讨论仍在进行中，这些数据仍可能调整。（财联社）</p>\n  <p><strong>小熊电器上半年净利下降4成，海外增长未能对冲国内压力</strong></p>\n  <p>8月13日，小熊电器披露2026年半年度报告。上半年，公司实现营业收入23.49亿元，同比下降7.34%；归属于上市公司股东的净利润1.20亿元，同比下降41.30%；扣非净利润1.09亿元，同比下降41.59%。利润降幅明显高于收入，反映出需求走弱之外，公司还面临成本、费用及业务结构变化带来的压力。（华尔街见闻）</p>\n  <p>整理｜何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-08-17T00:01:57+00:00", "fetched_at": "2026-08-17T00:58:33.929022+00:00", "fingerprint": "eff329a952264452"}, {"source": "36氪 - 最新文章", "title": "科创板上市公司投资脑机接口，微灵医疗获超亿元融资  ｜36氪独家", "url": "https://36kr.com/p/3941648190242185?f=rss", "summary": "<p>文｜刘凌果 胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪独家获悉，医学脑机接口企业微灵医疗，近日完成超亿元人民币融资。本轮融资由君重资本领投,英诺特（688253.SH）作为该基金的核心产业出资人，募集资金将重点用于推进植入式脑机接口核心产品的临床验证，加快医疗器械注册申报进程，完善生产制造体系建设，并持续拓展面向神经功能修复领域的临床应用布局。此前，微灵医疗已获得高榕资本、生命园创投、鼎晖投资、力合科创等多家一线投资机构加持。</p>\n  <p>微灵医疗成立于2019年，是36氪持续跟踪的脑机接口企业。“让天下没有难治的脑病。”是微灵贴在总部墙壁上的一句话。这个聚焦于严肃医疗的愿景，在当下水温沸腾的脑机接口赛道，似乎不如“人机交互”显得性感。</p>\n  <p>执着于治疗脑疾病，与创始人李骁健的学术履历、所接受的科学训练强相关。过去二十余年，李骁健的研究一直围绕大脑功能解析和脑疾病干预治疗展开。</p>\n  <p>从中科院生物物理研究所博士毕业后，李骁健在美国佐治亚医学院、西北大学芬博格医学院工作近10年。回国后，他加入中国科学院深圳先进技术研究院开展脑机接口技术研发，现为南方医科大学粤港澳大湾区脑科学与类脑研究中心和珠江医院双聘教授。</p>\n  <p>最近，李骁健因关于投资人的大胆“开麦”在圈内引发热议。在他看来，大家对脑机接口市场前景各有理解，无可厚非。“有人看好人机交互的想象空间，有人聚焦消费级应用的潜力。”但需要警惕的是“只关注太远的未来，忽略眼前的风险和困境”。</p>\n  <p>脑机接口问世50年，真正推进临床研究也不过是这几年的事。“踏踏实实先做好严肃医疗场景”，把技术积累扎实，是李骁健心中更好的选择。</p>\n  <p>在这个维度上，他找到的可行路径是：既然损伤就在大脑，就先修复大脑。“脑损伤患者往往因神经受损、神经信号无法有效传导，从而丧失或部分丧失对肢体的控制能力。但如果患者的大脑能正常产生运动意图，我们其实可以通过脑机接口技术修复受损的神经通路，实现脑网络的重塑。”</p>\n  <p>在李骁健看来，“脑”是脑机接口技术无可动摇的核心，而“机”是服务于脑的，通过引导脑网络的重塑过程，不但可以修复脑损伤，更可以发掘和推高大脑潜能。</p>\n  <p>比如，对于因脑卒中、脑外伤等脑损伤而导致运动功能受损的患者来说，“重获对原生肢体的控制能力能为患者带来更为直接的获益”；对于神经损伤过重，修复空间较小的患者来说，可以考虑部分功能修复、部分功能替代的协同方案。</p>\n  <p>微灵医疗这一覆盖神经功能恢复全过程的技术体系，被李骁健概括为“先诊后治，修替一体”。“国际上有好几个团队都造了脑机接口这把‘枪’，现在的关键问题是，靶在哪里？”</p>\n  <p>精准诊治脑疾病、保护修复脑神经，是他认为当下最迫切的临床需求，也是脑机接口证明自身确切临床价值的起点。</p>\n  <h2><strong>修复神经，</strong></h2>\n  <h2><strong>一场关于“重塑”的系统性工程</strong></h2>\n  <p>“修复神经”乍一听有些玄妙，其底层科学依据是大脑的神经可塑性。需要澄清的是，这里的“修复”，并非让已坏死的神经组织“复活”，而是借助植入式脑机接口通过脑机训练，让患者残存的神经环路重新组织，形成功能代偿。</p>\n  <p>李骁健将这一过程概括为神经系统的“网络重组、环路重塑和功能重建”：脑损伤后，原有神经网络会发生重组，脑机训练可以引导受损环路代偿性重塑，最终，新的环路实现原生功能的重建。这个过程中，脑机接口扮演的是“教练”角色，环路中的神经元是“运动员”。脑机接口训练残存的神经元学会代偿那些受损的神经元，重新联通中断的神经环路。</p>\n  <p>微灵医疗在全植入式脑机接口方面的系统性能力，并非只体现在某款面向具体适应症的医疗器械上，而是进一步延伸为一套植入式脑机接口临床平台。</p>\n  <p>它的硬件部分由电子植入体、体外控制器与神经刺激器、外骨骼等效应辅具组成，通过无线方式供电和传输皮层脑电信号。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260816/v2_05da48ccf9cf4130a8b153e903ac5c8e@5930287_oswg455361oswg1080oswg500_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">微灵医疗产品矩阵示意</p>\n  <p>其中，柔性薄膜皮层电极是这套系统贴近大脑的“触角”。据介绍，微灵的柔性电极厚约10微米，单片覆盖数厘米长宽。电极铺于脑皮层表面，不刺入脑组织，可以在较大范围内采集不同脑区的神经活动。李骁健表示，电极片的形貌、触点间距和大小以及植入位置和周期等技术参数，都由要解决的具体临床问题决定。</p>\n  <p>由此，脑机接口定制平台为探索不同适应症的脑机疗法提供了灵活调整的空间，让治疗方案可以“因病而异”。“设备的外观看起来可能差不多，但放置的脑内环路靶区不一样，电极形貌也会不同；包括芯片的功能，采集和刺激的通道配置，也不一样。”李骁健说。</p>\n  <p>据了解，该植入式脑机接口系统用于严重脑损伤患者神经修复的定制款已启动IIT（研究者发起临床）研究。今年6月中旬，广东某医院完成了该款脑机接口植入体的植入手术。</p>\n  <p>李骁健介绍，受试患者一年半前脑干出血致昏迷，经抢救后意识逐渐清醒，但因脑干损伤导致“闭锁综合征”，已退化到微意识状态。闭锁综合征患者也被形容为“清醒的囚徒”，患者虽意识完全清醒，但全身瘫软，无法说话、活动，只有眼球微动。“或许只有脑机接口能帮帮他了。”</p>\n  <p>接受脑机接口植入手术后，该患者进行了约一周的艰难脑机训练，恢复到了清醒的“闭锁态”；再经过四周的植入式脑机治疗，患者的左上肢已经由完全瘫软状态提升到可完成独立抬起小臂、轻松抬腕等多个手势，并能捏住轻小物体。下一阶段，患者有望使用遥控手柄与外界进行轻度交互。</p>\n  <p>“从患者受益角度，要先把闭锁态打开个突破口，让他能够跟家属进行简单交流。先恢复一只手的活动力对患者的受益很关键，且关掉脑机系统不影响继续使用，因为手是他自己控制的。”李骁健表示。</p>\n  <p>之所以一上来就做高难度的“脑机原位功能重建”，主要考量在于：“我们有深厚的理论功底和技术支撑，先在需求最迫切、治疗条件最困难的重症病例中验证安全有效，后面做损伤程度较轻的适应症，应该更加从容了。”特别是危重症患者对新疗法的需求更为迫切，从伦理角度，也更容易获得开展临床试验的支持。</p>\n  <p>基于此，微灵现阶段仍将资源聚焦在更明确的中枢神经系统疾病和患者群体上。据了解，公司计划继续扩展临床研究试验，以进一步覆盖更广泛的脑疾病类型。</p>\n  <h2><strong>读出脑功能边界，</strong></h2>\n  <h2><strong>辅助医生精准决策</strong></h2>\n  <p>如果说，修复是神经发生损伤之后重建信号通路。有没有可能，赶在神经功能被疾病带走前，先找到它，保住它？</p>\n  <p>当前，微灵医疗另一个重要研究课题就是“如何在神经功能尚未受损前，识别并保护关键脑功能区域”。针对这一临床需求，公司推出面向脑功能保护的辅助诊断系列产品，由柔性薄膜皮层电极、高通量颅内脑电图机和智能解码软件共同构成。</p>\n  <p>其中，柔性薄膜皮层电极阵列，可贴附于患者脑皮层表面采集高通量神经电生理信号，空间分辨率达亚毫米级别，并已经过数百例临床实验验证，进入三类医疗器械注册阶段。</p>\n  <p>与之配套的高通量颅内脑电图机，专为神经外科设计，可与分析软件配合，用于辅助诊断场景。</p>\n  <p>针对癫痫、帕金森、抑郁症、意识障碍等神经功能性疾病，该系统可有效弥补 CT、核磁等传统影像学检查的局限。“影像观察的是脑部结构，脑机接口技术定位的是脑功能区。” 李骁健表示。</p>\n  <p>以癫痫为例，致痫灶的异常放电具有动态特征，传统影像往往难以完整呈现异常放电起源与信号传播路径，脑机接口技术则可以持续采集并解析不同脑区的神经电信号，为致痫灶的精准定位提供依据。</p>\n  <p>对于脑肿瘤、脑出血等器质性病变，微灵医疗的产品可协助医生区分病灶与重要脑功能区的位置关系，缓解临床上“最大化切除病灶”与“最大程度保留脑功能”之间的现实矛盾。</p>\n  <p>李骁健介绍，肿瘤侵入可能形成对原有功能区的挤占，而语言、运动等脑功能出于代偿，可能迁移至邻近区域，导致病灶与重要功能区相互交错，使得医生在切除病灶时容易误伤关键功能区，增加引发失语、瘫痪等术后功能缺损的风险。</p>\n  <p>对此，微灵的解决思路是，通过在脑皮层表面贴附柔性薄膜电极，实时采集并解码脑电信号，实现毫米级空间分辨率的脑功能区测绘，为外科手术提供功能层面的导航参考，辅助医生精准操作。</p>\n  <p>简单理解，就是直接读取患者脑内的神经活动，把功能区“画”出来。在“术中唤醒”状态下，患者按照指令完成肢体运动、语言等任务，系统实时分析并呈现功能区，辅助医生精准操作。</p>\n  <p>之所以选择将电极贴在脑皮层表面，也是为了把这张功能图尽可能“画全”。在辅助诊断场景下，首要任务是看清语言、运动等多功能区的分布范围，毫米级空间分辨率便可满足临床需求。贴附脑皮层表面的路径不仅可以减少损伤，也能实现较大面积的信号覆盖。</p>\n  <p>商业化方面，在面向脑保护的辅助诊断方向上，微灵医疗的颅内高通量脑电图机和配套的多款脑皮层薄膜电极阵列正在注册阶段，预计将在未来1-2年内陆续获批上市；在脑损伤修复和脑疾病治疗方向上，微灵医疗全植入式脑机接口系统将持续推进多中心临床试验，并启动面向广泛适应症的临床探索。</p>", "category": "tech", "published_at": "2026-08-17T00:30:00+00:00", "fetched_at": "2026-08-17T00:58:33.929007+00:00", "fingerprint": "4831809392252f5b"}, {"source": "少数派", "title": "浏览器扩展合集： 我们为你找到了这 6 款实用、 有趣的「新玩意」", "url": "https://sspai.com/post/113495", "summary": "在浏览器扩展这边，近期又有哪些好用、有趣的「新玩意」呢？<a href=\"https://sspai.com/post/113495\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-16T04:48:21+00:00", "fetched_at": "2026-08-17T00:58:32.544696+00:00", "fingerprint": "160e7a4da950c999"}, {"source": "少数派", "title": "派早报：😭（放声大哭）成为最流行 emoji", "url": "https://sspai.com/post/113524", "summary": "<p>😭（放声大哭）成为最流行 emoji</p><p>美国要求合作方在中美 AI 竞赛中「选边站」</p><p>ChatGPT 上线使用历史记录功能</p><p>美国政府敦促苹果不要购买中国内存芯片</p><p>uBlock Origin 放弃维护 Facebook 广告规则</p><p>索尼加速向娱乐业务转型</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/113524\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-16T22:54:56+00:00", "fetched_at": "2026-08-17T00:58:32.544684+00:00", "fingerprint": "62f4a4fd0a9a158b"}, {"source": "The Guardian - World", "title": "Moroccan police arrest more than 100 people as they attempt to enter Ceuta", "url": "https://www.theguardian.com/world/2026/aug/15/moroccan-police-arrest-more-than-100-people-as-they-attempt-to-enter-ceuta", "summary": "<p>Border security tightened after social media posts call for another mass crossing into Spain’s north African ter
