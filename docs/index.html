<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

场：欧莱雅把校园公益做成了一场“运动实验”｜最前线", "url": "https://36kr.com/p/3831348302358408?f=rss", "summary": "<p>5月29日，欧莱雅中国在复旦大学启动2026年度“有意思青年”高校公益计划，并首次以校园运动会形式开启新一年的项目活动。活动现场，乒乓球运动员马龙、篮球运动员杨力维、足球运动员赵丽娜等体育界人士与高校学生展开互动，欧莱雅同时宣布向中国青少年发展基金会捐赠总价值约468万元的产品，并启动新一年度校园义卖活动。</p>\n  <p>从表面来看，这是一场校园公益活动；但放在全球美妆行业的发展背景下，它更像是美妆品牌持续拥抱运动文化和健康生活方式的一次缩影。</p>\n  <p>过去很长一段时间，美妆与运动被视为两个相对独立的消费领域。前者围绕审美表达展开，后者则强调竞技和功能价值。<strong>然而近年来，随着健康消费崛起、女性运动参与率提升以及生活方式经济快速发展，两者之间的边界正在被重新定义。</strong></p>\n  <p>国际市场已经率先显现出这一变化。</p>\n  <p>根据尼尔森IQ（NIQ）发布的《State of Beauty 2025》报告，全球美妆市场过去一年实现约10%的增长，其中“Beauty+Wellness（美容与健康融合）”被认为是推动行业扩容的重要力量。报告指出，消费者越来越倾向于将护肤、美容、营养、运动和健康管理视为一个整体体系，相关消费机会较传统美容市场扩大超过60%。</p>\n  <p>与此同时，运动经济本身也在快速增长。市场研究机构Grand View Research数据显示，全球运动服饰市场规模已达到约4400亿美元，预计2033年将超过9000亿美元。跑步、骑行、瑜伽、力量训练等运动项目正逐渐成为年轻消费者日常生活的重要组成部分，而不再只是专业竞技活动。</p>\n  <p>消费行为的变化，正在反向影响美妆行业。过去几年，围绕运动场景的产品需求明显增长。从高倍防晒、运动后修护，到头皮护理、身体护理，再到防汗型彩妆，“运动中的皮肤管理”正成为新的产品开发方向。国际市场甚至开始出现“Active Beauty（活力美容）”概念，用以描述专门服务运动生活方式人群的美妆产品与服务体系。</p>\n  <p>这种趋势也体现在品牌营销层面。</p>\n  <p>2024年巴黎奥运会期间，欧莱雅集团成为奥运会官方合作伙伴之一，将品牌叙事与运动员故事深度结合；美国彩妆品牌e.l.f. Beauty近年来持续投资女子足球和女性职业体育赛事；全球美妆零售商Sephora则不断通过女性跑团、健身活动以及健康生活方式社群与消费者建立联系。</p>\n  <p>另一方面，运动品牌也正在向美妆行业靠近。从Nike围绕女性运动员打造的内容生态，到Lululemon持续扩展的瑜伽、冥想与身心健康社区，越来越多运动品牌开始强调情绪价值和生活方式属性，而不仅仅是产品功能。美妆与运动看似属于不同产业，却正在服务同一批消费者——那些关注健康、自我管理和个人表达的新一代年轻人。</p>\n  <p>在这样的背景下，欧莱雅此次将“有意思青年”与运动场景结合，也体现出企业对年轻群体沟通方式的调整。</p>\n  <p>活动现场设置了篮球、跑步、网球、拳击、高尔夫和乒乓球等多个运动体验区域，旗下修丽可、理肤泉、适乐肤、碧欧泉、巴黎欧莱雅等品牌参与其中。相比传统校园宣讲或品牌路演，运动场景天然具备更强的参与感和社交属性，也更符合当下大学生群体对于线下活动的期待。</p>\n  <p>值得注意的是，活动的重点并不完全在产品展示。</p>\n  <p>作为持续23年的校园公益项目，“有意思青年”长期围绕公益义卖、青年发展和职业赋能展开。今年除了校园义卖活动外，现场还设置了职业咨询、简历指导以及可持续发展互动区域，希望将就业、公益和社会议题融入活动之中。</p>\n  <p>事实上，随着线上流量红利逐渐见顶，越来越多消费品牌开始重新评估与年轻消费者建立关系的方式。</p>\n  <p>过去十年，美妆行业高度依赖明星代言、广告投放和电商流量获取用户，但随着获客成本不断上升，单纯依靠营销曝光已经难以形成长期品牌认同。相比之下，校园项目、兴趣社群以及运动活动等具有持续互动属性的场景，正在成为品牌新的投入方向。</p>\n  <p>对于美妆企业而言，运动或许正是最具潜力的场景之一。</p>\n  <p>一方面，运动天然对应防晒、头皮护理、身体护理等核心品类需求；另一方面，其所代表的积极、健康、自律等价值观，也与当代消费者的身份认同高度契合。相比单纯跨界联名，这种基于真实消费场景建立起来的联系更容易获得市场认可。</p>\n  <p>不过，从全球市场经验 at": "2026-05-30T02:42:31.789932+00:00", "fingerprint": "e4cca38d8005e773"}, {"source": "36氪 - 最新文章", "title": "连续15年披露ESG报告，自然堂开始把“可持续”做成一门生意｜最前线", "url": "https://36kr.com/p/3830545234552452?f=rss", "summary": "<p>在中国美妆行业增长放缓、价格竞争加剧的背景下，越来越多品牌开始重新审视“可持续发展”这件事的商业意义。</p>\n  <p>5月26日，自然堂集团发布《2025年度可持续发展报告》，这是其连续第15年披露ESG相关内容。相比早期以公益、环保为主的企业社会责任叙事，今年的报告更强调“可量化”与“产业化”：包括首次按照科学碳目标倡议（SBTi）标准制定减碳路径、扩大范围三碳排放披露边界，以及将生物多样性、绿色原料、智能制造与供应链效率直接绑定。</p>\n  <p>对于当前的中国美妆行业而言，这种变化并不只是“做ESG”，更像是在寻找下一阶段竞争力。</p>\n  <p>过去几年，ESG更多是国际消费品公司的标准动作。包括L'Oréal、Estée Lauder Companies、Shiseido等国际美妆集团，均已将减碳、绿色包装、生物多样性纳入长期战略，并逐步向供应链、原料采购与工厂体系延伸。</p>\n  <p><strong>而随着国内美妆行业进入存量竞争阶段，ESG也开始从“附加项”变成影响品牌长期经营的重要变量。</strong>尤其是在高端化、研发能力、供应链透明度越来越被市场关注的情况下，企业需要证明的不只是销量增长，还包括其长期运营能力。</p>\n  <p>自然堂集团公共事务总经理陈娟玲向36氪表示，虽然现阶段ESG仍需要巨大的投入，难以从ROI的角度来计算这一投入的价值。但从长远发展眼光看，ESG的理念将会渗透进自然堂集团的产品和服务当中，最终成为集团竞争力的一部分。</p>\n  <p>自然堂此次披露的一项重点，是其2030减碳目标。</p>\n  <p>根据报告，以2023年为基准年，集团计划到2030年将范围一和范围二温室气体绝对排放量减少42%，并首次将范围三六大重点类别纳入披露边界。对于消费品行业而言，范围三通常涉及原料采购、物流运输、包装与消费者使用等更复杂的供应链环节，也是减碳难度最高的部分。</p>\n  <p>在业内看来，中国消费企业过去较少系统披露范围三数据，原因在于供应链数字化基础不足、统计成本较高。而随着国际市场、资本市场以及大型渠道方对ESG要求提高，供应链透明化正在成为趋势。</p>\n  <p>与减碳目标同步推进的，还有自然堂近年来持续加码的智能制造项目。</p>\n  <p>位于上海东方美谷的“自然堂未来美妆城”于2025年正式启用。该项目集成了分布式光伏、智能物流、数字孪生系统与工业旅游功能。根据披露，其屋顶3.1兆瓦光伏项目预计年发电量约380万度，自用消纳率超过95%。</p>\n  <p>近年来，“绿色工厂”已经成为不少消费品企业的新投入方向。尤其在美妆行业，由于生产环节涉及大量包装、物流与能源消耗，绿色制造不仅影响ESG指标，也直接关系成本控制与运营效率。</p>\n  <p>例如，自动化仓储与“黑灯物流”系统，本质上既是节能项目，也是提升供应链效率的基础设施。而数字化能源管理，则有助于企业建立更细颗粒度的碳排放数据体系。</p>\n  <p>相比单纯强调环保理念，当前行业更关注的是：ESG是否能转化为研发能力、供应链能力和品牌资产。</p>\n  <p>这一逻辑同样体现在自然堂对“喜马拉雅”概念的重新包装上。</p>\n  <p>过去十余年，喜马拉雅一直是自然堂品牌叙事的重要来源。而近几年，其开始将这一概念进一步延伸至生物多样性保护与原料研发。</p>\n  <p>报告显示，“种草喜马拉雅”项目已累计修复666万平方米土地，并升级为“2025-2030喜马拉雅生物多样性保护项目”。与此同时，自然堂与西藏农牧大学合作研发的蓝玉簪龙胆提取物，于2025年完成国家化妆品新原料备案，成为西藏首个备案化妆品新原料。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_caf93e953cbd43ef9c7ad38574e74fa6@5922386_oswg592802oswg587oswg391_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">自然堂集团生物多样性保护项目色季拉山考察</p>\n  <p>在全球美妆行业，“原料自主化”正成为新的竞争焦点。</p>\n  <p>一方面，国际大集团正在加大对专利成分、生物发酵与植物细胞培养技术的投入；另一方面，中国品牌也开始尝试从“成分应用”转向“成分研发”。</p>\n  <p>自然堂披露，其上海微生物实验室已全面应用第五代智能生物发酵技术，酵母类、乳酸菌类核心原料实现自主生产，部分专利成分有��提取率提升300%，同时降低生产能耗。</p>\n  <p>对于本土美妆企业而言，这意味着竞争逻辑正在发生变化。过去行业依赖营销投放和流量红利，而未来，原料能力、专利储备和供应链效率的重要性正在上升。</p>\n  <p>与此同时，绿色包装与循环经济也成为行业的新方向。</p>\n  <p>根据报告，自然堂2025年推进了覆盖90个SKU的减塑项目，包括替换装、补充装与一次性成型渐变吹瓶技术等。其中，小紫瓶精华替换装全年减少约0.54吨原生塑料使用，袋装补充装则累计减少约14吨原生塑料。</p>\n  <p>这类“替换装”模式，目前已被越来越多国际品牌采用。原因并不只是环保，更因为其能够提高消费者复购率，并降低包装与物流成本。</p>\n  <p>此外，自然堂还提到，其空瓶回收计划已吸引超过万名消费者参与，并入选上海市“无废城市细胞”案例。</p>\n  <p>相比此前偏概念化的ESG表达，如今中国消费企业开始越来越强调“可验证的数据”和“可追踪的指标”。背后原因在于，ESG已经不再只是品牌形象工程，而正在逐渐影响企业融资、渠道合作、国际化以及供应链管理。</p>\n  <p>对于中国美妆行业而言，这也意味着竞争维度的进一步升级。</p>\n  <p>当流量增长趋缓、行业进入更深度整合阶段后，企业之间比拼的，可能不再只是新品速度和营销声量，而是研发体系、供应链韧性，以及长期经营能力。</p>\n  <p>而ESG，正在成为这些能力的一部分。</p>", "category": "tech", "published_at": "2026-05-29T16:02:16+00:00", "fetched_at": "2026-05-30T02:42:31.610943+00:00", "fingerprint": "8e59d5db54dc5ac7"}, {"source": "36氪 - 最新文章", "title": "千里科技再添筹码，或将整合吉利辅助驾驶团队｜36氪独家", "url": "https://36kr.com/p/3830580716365449?f=rss", "summary": "<p>为助力千里科技成为“第二个华为”，吉利决定为它增添新的技术筹码。</p>\n  <p>36氪从多位产业人士处了解到，吉利中央研究院数百人的辅助驾驶团队，将在近期被整合入千里科技。目前，吉利研究院辅助驾驶团队，已有人收到了转移合同的通知。</p>\n  <p>有接近吉利的知情人士告诉36氪：“这轮整合后，吉利研究院辅助驾驶团队，被平移至千里智驾与极氪的合资公司千里浩瀚，千里浩瀚今后主要负责为吉利的车型提供定制化开发和量产交付。千里智驾可以将更多精力转移至主线研发，提供平台级能力。吉利暂定了这样一个整合方案。”针对以上信息，36氪向吉利求证，截止发稿，没有回应。</p>\n  <p>据公开信息显示，千里智驾是千里科技负责辅助驾驶研发的子公司，千里科技通过重庆江河间接持有千里智驾30%的股份。</p>\n  <p>千里浩瀚是千里智驾和极氪的合资公司，千里智驾和极氪分别持有千里浩瀚48%、47%的股份。</p>\n  <p>2025年8月，极氪辅助驾驶团队、旷世科技旗下辅助驾驶子公司迈驰智行，以及吉利研究院少数人，被整合入千里智驾，组成了一个约2000人规模的辅助驾驶研发团队。</p>\n  <p>有吉利人士对36氪表示，前一轮整合中，被保留在吉利研究院的辅助驾驶团队，主要负责对供应商提定制化需求、测试等。这些人对千里智驾CEO陈奇汇报。</p>\n  <p>千里科技的前身为力帆科技，2020年被吉利投资并控股。2024年，印奇成为千里科技的董事长后，主导企业向“AI+车”战略转型。当前，千里科技的业务范围涵盖辅助驾驶、智能座舱、具身智能等领域。</p>\n  <p>吉利集团对它寄予厚望。去年，吉利执行董事桂生悦曾不止一次公开表示，吉利要与千里科技一起打造“第二个华为” 。今年��京车展上，千里科技又将其商业目标进一步量化——2026 年底ASD搭载量100–130万辆；2027年270–330万辆；2028年挑战800万辆，成为全球最大智驾方案供应商之一。</p>\n  <p>为实现这一宏伟目标，千里科技正积极开拓吉利以外的客户，北汽是目前与之合作意向最明确的车企。双方将在今年成立合资公司，现已规划了5款合作车型，其中包含一款轿车，一款越野车型，还有一款轿跑猎装版。其中部分车型计划于今年发布。</p>\n  <p>但千里科技与北汽合作的车型，其市场表现终究尚存在不确定性，千里科技能否兑现“2026年底ASD搭载量100–130万辆”的承诺，吉利是更关键的客户。</p>\n  <p>2025年，吉利累计销量超过300万辆，但这300多万台车，并不全是千里科技的项目。有吉利人士告诉36氪，此前，千里科技辅助驾驶团队，主要负责极氪的全系车型、领克900等项目，吉利品牌旗下车型，以及领克900之外的领克品牌车型，由吉利研究院辅助驾驶团队负责。</p>\n  <p>如今吉利研究院这数百人规模的辅助驾驶团队加入千里科技，这不仅能够夯实千里科技的技术实力，也使千里科技拥有了更多来自吉利的车型项目，从而提升千里科技ASD搭载量。</p>\n  <p>于吉利而言，这轮辅助驾驶业务的整合，将使吉利今后更聚焦整车业务。</p>\n  <p>吉利集团的智能化业务曾经历过数次整合。</p>\n  <p>吉利集团本有5股不同的辅助驾驶力量——研究院辅助驾驶中心、极氪辅助驾驶团队、路特斯辅助驾驶团队、子公司亿咖通、脱胎于吉利的福瑞泰克。</p>\n  <p>去年3月，吉利集团在吉利AI智能科技发布会上，发布千里浩瀚智驾解决方案，吉利集团CEO淦家阅公开表示：“‘千里浩瀚’是吉利统一的智能出行解决方案，整个吉利的高阶智驾‘一盘棋’。”这在一定意义上可以视作，吉利集团辅助驾驶团队初步整合的标志。</p>\n  <p>去年8月，吉利系辅助驾驶团队迎来了更深彻的整合。</p>\n  <p>极氪辅助驾驶团队、旷视旗下的辅助驾驶品牌“迈驰智行”，以及吉利研究院辅助驾驶团队少部分人，一同被整合至新的主体——千里智驾。千里科技联席总裁王军担任千里智驾CEO，前极氪智驾副总裁陈奇任联席 CEO，旷视觉科技联合创始人杨沐任 CTO。</p>\n  <p>如今，吉利研究院与千里科技辅助驾驶业务的更全面整合，在财务上，能为吉利集团节省大量研发投入，同时可使吉利更聚焦整车的研发，进而拓展更多市场份额。</p>\n  <p>千里科技自成立以来，从未掩饰对标华为的壮志。今年4月，千里科技向港交所第二次递交了上市申请书，如今吉利又将研究院辅助驾驶团队，整合入千里科技，这些努力，都在推动千里科技朝“第二个华为”迈进。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_e0efe5c8943c4edd85c525ac1b39ca46@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-05-29T16:28:31+00:00", "fetched_at": "2026-05-30T02:42:31.610938+00:00", "fingerprint": "462997b2e88380e9"}, {"source": "36氪 - 最新文章", "title": "最前线｜中科创星第十二期“好望角科学沙龙”聚焦“太空智驾”，卫星将从被动响应走向自主决策", "url": "https://36kr.com/p/3831071878358659?f=rss", "summary": "<p>“太空智驾时代将到来，卫星和星座会如同L4级自动驾驶汽车一样，在太空具备自主环境感知、任务规划和机动决策能力。”</p>\n  <p>5月28日，在上海举行的“好望角科学沙龙”上，中国科学院西安光学精密机械研究所（简称“西安光机所”）副所长邵晓鹏在演讲中提出了这一判断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_896e0741b5d441d48842a792a569594f@5920579_oswg994152oswg1268oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">西安光机所副所长邵晓鹏在沙龙上演讲</p>\n  <p>“好望角科学沙龙”是由中科创星发起，中科创星、东壁科技数据、上海市研发公共服务平台管理中心、曲率引擎共同主办的科创融合与跨界交流平台。本期沙龙以“星际智控——太空智驾与遥感技术的产业共振”为主题，汇聚了航天领域专家，以及来自科创企业、投资机构与地方政府的近百位代表，共同探讨卫星和星座从被动响应向自主决策升级的技术路径与落地模式。</p>\n  <p>过去几年，全球商业航天进入加速阶段，卫星在轨数量持续攀升，空间碎片、轨道碰撞等风险也在增加。传统依赖地面站逐一管控的卫星在轨管理模式已难以为继，强调卫星自主感知、自主响应与自主决策能力的“太空智驾”概念应运而生。</p>\n  <p>在以《计算成像：重塑“太空智驾”》为题的演讲中，邵晓鹏表示，“AI+光学”的新范式，将推动航天光学载荷从传统的“精密机械”向“智能信息终端”转变，并进一步提升卫星系统的自主化能力。</p>\n  <p>这一思路的核心理论支撑是“计算成像”技术。</p>\n  <p>邵晓鹏打了个比方说：“不必把透镜磨到绝对完美，只需磨到‘差不多’，用算法来补足剩余误差。”对应到工程上，就是在物理域简化硬件（放宽精度要求、减少镜片数量），信息域用AI补偿（像差复原、智能识别）。</p>\n  <p>2025年9月5日，西安光机所等单位共同研制的计算成像遥感相机（可见光波段全金属相机），搭载于开运一号（天雁28星）卫星，由谷神星一号遥十五运载火箭送入太空，标志着计算成像光学系统理论与计算域补偿协同创新技术模式，首次接受真实太空环境验证。</p>\n  <p>相比传统遥感相机，这套系统结构更简单，重量大幅减轻，面形精度大幅放宽，制造成本降至原来的1/5至1/10。根据初步在轨数据，在低信噪比条件下，计算复原后的影像细节与传统遥感成像模式基本一致，验证了技术路径的可行性。</p>\n  <p>而对于卫星自主化而言，不仅要“看得清”，还要“看得懂”。</p>\n  <p>据介绍，针对星上算力受限的问题，西安光机所团队对地面大模型进行了“剪枝”“量化”和“知识蒸馏”等处理，形成适用于星载环境的轻量化模型，以降低部署门槛，提升星上自主处理能力。</p>\n  <p>西安中科天塔科技股份有限公司（简称“中科天塔”）是西安光机所商业航天领域的产业化平台。中科天塔总经理曾伟刚在沙龙上表示，公司正联合西安光机所及产业链伙伴，同步布局“太空智驾”相关能力。</p>\n  <p>按照其规划，未来地面端将围绕卫星在轨管理，提供测运控、健康管理、仿真训练和自动化遥控等服务；星上端则以新一代星载激光通信终端为核心，提升卫星之间的数据传输与协同能力。</p>", "category": "tech", "published_at": "2026-05-30T00:48:34+00:00", "fetched_at": "2026-05-30T02:42:31.610933+00:00", "fingerprint": "234d3cf13b26d5d3"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜泡泡玛特大涨，段永平日赚10亿；诺基亚发布首款微聊手机，售价199元；滴滴回应“乘客车内排泄”", "url": "https://36kr.com/p/3831073348855433?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>黄仁勋披露“赶飞机”细节，特朗普要出发时来电话</li>\n   <li>国内航线燃油附加费6月5日起首次下调</li>\n   <li>铁路将实施新规：违规乘车拒不补票将被限制购票</li>\n   <li>iPhone 17系列中国销量破3000万台，Pro Max版占近一半</li>\n   <li>SpaceX据悉将IPO估值目标下调至至少1.8万亿美元</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>泡泡玛特上涨，段永平单日盈利近10亿港币</strong></p>\n  <p>泡泡玛特迎来强势上涨，5月29日盘中最大涨幅超12%，截至29日记者发稿报收176港元，涨幅达8.98%。此番行情走高，与知名投资人段永平大举布局相关。据港交所5月27日披露的信息显示，知名投资人段永平举牌泡泡玛特，当时的持仓市值超117亿港元。伴随29日股价上扬，其单日账面盈利接近10亿港元。泡泡玛特29日大涨之后，段永平在雪球平台上接连两次发布同款表情包，引发市场热议。（中国新闻周刊）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_651c648ba21349adae3e7bdb806fafd2@6100851_oswg52960oswg928oswg385_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>诺基亚发布首款微聊手机，售价199元</strong></p>\n  <p>5月29日，诺基亚发布了200 4G手机，售价199元，是首款微聊手机，可通过微信小程序与其他手机视频通话，主打学生、长辈及备用机市场。据官方旗舰店销售页面介绍，该手机搭载2.4英寸屏幕、1450mAh电池，支持双卡双待与全网通4G。通过HMD微聊实现功能机与功能机之间、功能机与智能机之间互通，支持语音通话、视频通话、图文聊天、群组聊天、电子围栏及定位等功能。该手机还有群组聊天、电子围栏等功能，配有喜马拉雅、咪咕音乐等应用。&nbsp;值得注意的是，诺基亚官方在公众号评论区回应，由于芯片问题所以这款新机支持不了WiFi功能。针对网友称其将功能机性能压榨至极致的评论，官方直言 “也是尽力了”。（界面新闻）</p>\n  <p><strong>滴滴回应“乘客车内排泄”，平台将帮司机承担清洁费</strong></p>\n  <p>此前，据多家媒体报道，近日在四川南充，一名网约车司机遇到乘客在车内排泄。司机陈师傅表示，乘客全程清醒。乘客下车后，他只能花1000多元更换座椅。</p>\n  <p>5月29日，“滴滴出行”发文称，留意到“乘客车内排泄司机花1000元换座椅”相关事件，对于陈师傅的遭遇非常关心，及时核查了该笔订单的情况。该订单发生在5月27日凌晨，为代叫订单。乘客下车后，司机陈师傅发现车辆后排座椅、脚垫被排泄物污染，车辆受损无法正常运营。陈师傅随即选择报警，并向平台提交了问题反馈。</p>\n  <p>接到反馈后，我们立刻先后联系陈师傅与实际下单的用户，希望敦促他们向司机师傅道歉并承担司机损失。叫车人表示不认识实际乘车人，也无法取得联系。目前陈师傅的车辆仍在维修中，平台也积极配合警方相关工作，协助跟进处理。考虑到陈师傅车辆受损的情况，以及此次遭遇带来影响，平台将帮助陈师傅承担座椅更换、车辆清洁的相关费用，并提供顺心补贴，助力师傅早日恢复正常接单。滴滴表示，会努力保障好司机师傅们的权益，同时也呼吁广大乘客文明乘车，若途中遇到特殊状况，请及时和司机沟通，感谢大家的理解与配合。（第一财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>飞船返回舱成功着陆，神二十一乘组凯旋</strong></p>\n  <p>据中国载人航天工程办公室消息，北京时间2026年5月29日20时11分，神舟二十一号航天员乘组搭乘神舟二十二号载人飞船在东风着陆场成功着陆，现场医监医保人员确认航天员张陆、武飞、张洪章身体状态良好，任务取得圆满成功。（央视新闻）</p>\n  <p><strong>比亚迪发布中国首款4nm制程智驾芯片</strong></p>\n  <p>36氪获悉，5月28日，比亚迪召开“敢为”智能化战略发布会，发布中国首款4nm制程智驾芯片——璇玑A3，已开启规模化量产，支持L3、L4自动驾驶，通过三颗芯片的高效协同，实现超2100TOPS的总算力，同时兼顾功耗控制与算力利用率。</p>\n  <p><strong>黄仁勋披露“赶飞机”细节，特朗普要出发时来电话</strong></p>\n  <p>据中央电视台中文国际频道，英伟达创始人、CEO黄仁勋在接受采访时，披露了此次随特朗普访华的幕后细节。黄仁勋称，特朗普总统在准备出发时给他打的电话，“他当时并不知道我原本不去”，然后坚持要求他一起去，“所以我就匆忙收拾了一下”。黄仁勋还称，他当时在美国西海岸，而“空军一号”在华盛顿特区，随后他飞到阿拉斯加和特朗普会合，登上了“空军一号”飞往中国。（界面新闻）</p>\n  <p><strong>雷军称YU7车主超三分之一是女性，超过一半是苹果用户</strong></p>\n  <p>据报道，小米汽车5月29日上午在小米汽车工厂交付中心举办YU7 GT首批车主交付仪式，小米创办人、董事长兼CEO雷军和小米汽车品牌代言人舒淇小姐，一起为小米YU7 GT首批车主交车。雷军表示，小米YU7受到很多科技行业、金融行业车主的喜爱，YU7的车主，超过1/3是女性车主，超过一半是苹果用户。舒淇自己也是小米SU7 Max流金粉的车主，目前还在等待交付，应该很快就可以提车。虽然暂时还没有驾照，但看到YU7 GT之后，她表示也心动想要去考驾照了。（IT之家）</p>\n  <p><strong>国内航线燃油附加费6月5日起首次下调</strong></p>\n  <p>5月29日，去哪儿接到多个航空公司通知，自2026年6月5日（出票日期）起，成人旅客：800公里以上航线每位旅客收取150元燃油附加费，800公里(含)以下航线每位旅客收取80元燃油附加费。相较于调整前分别降低了20元/10元。今年四月和五月，国内燃油附加费连续大幅上调，此次为今年以来首次下调。（第一财经）</p>\n  <p><strong>段永平捐赠1万股贵州茅台股票</strong></p>\n  <p>5月29日消息，据江西省安福县委县政府官方公众号“美好安福”消息，段永平向安福县捐赠1万股贵州茅台股票。5月26日，“安福县段永平教育专项基金”捐赠仪式在南昌顺利举行。知名企业家、投资家段永平向安福县慈善会无偿捐赠所持贵州茅台酒股份有限公司股票1万股，专项支持安福教育事业发展。据报道，此次捐赠的1万股贵州茅台股票，将作为“安福县段永平教育专项基金”长期保留基金，以股票年度分红、股息等派生权益作为专项基金可使��资金，持续、稳定、长期助力安福教育提质、励教奖学、助学育才。（界面新闻）</p>\n  <p><strong>何小鹏回应为何机器人没有脸：必须要跟人有一定的差距</strong></p>\n  <p>小鹏集团董事长何小鹏在访谈中表示，机器人可以穿衣服、甚至有头发，但是它不能有自己的脸，必须要跟人有一定的差距。何小鹏称，机器人不能有自己的脸，有一些是因为恐怖谷效应，也有些是其它的法律和社会的学的效应。面对主持人提问“怎么面对跟友商的竞争”时，他表示：我觉得我们跟每一家都是友商，也都是同盟者，也可能是竞争者。我相信蔚小理在大九系这一次都会给出各自不同的看法跟理解。（新浪科技）</p>\n  <p><strong>欣旺达：公司已量产达到10000毫安的手机电池</strong></p>\n  <p>36氪获悉，欣旺达在互动平台表示，公司已量产达到10000毫安的手机电池。</p>\n  <p><strong>铁路将实施新规：违规乘车拒不补票将被限制购票</strong></p>\n  <p>记者从中国国家铁路集团有限公司获悉，新版《中国国家铁路集团有限公司铁路旅客运输规程》将于6月1日起正式实施。新版客规首次对违规乘车并拒绝补票的旅客做出限制购票规定。</p>\n  <p>新版客规首次对违规乘车并拒绝补票的旅客做出了限制购票规定，并纳入铁路旅客运输合同约定事项。旅客如发生“无票乘车”“持用变造、伪造或涂改的乘车凭证乘车”“票、证、人不一致”“持用低票价席别车票乘坐高票价席别”“持优惠票、优待票，没有规定的减价凭证或不符合减价条件”等违规乘车行为并拒不补票，铁路站车工作人员将现场告知违规乘车行为及后续限制购票措施；当上述几类拒不补票旅客再次购票时，铁路运输企业将通过铁路12306自动提示或售票窗口人工提示，告知限制其购票。（新华社）</p>\n  <p><strong>三星电子、SK海力士屡创新高触发意外抛售，今年合计净流出资金达586亿美元</strong></p>\n  <p>全球投资者今年疯狂涌入三星电子和SK海力士股票交易，推动这两只内存股分别上涨了147%和245%，但飙升的股价给一些基金带来了意想不到的麻烦。由于这两家公司股价屡创新高，已经触及了一些基金单只股票持仓比例上限10%的限制，迫使这些基金抛售这两只股票。这一被迫抛售无疑凸显了当前内存市场的拥挤程度，也可能��一步加大波动性。截至5月28日，全球投资者净抛售了价值636亿美元的韩国股票，这是自1999年有数据以来最大的单月抛售量。其中，三星和SK海力士今年合计净流出资金达586亿美元。（财联社）</p>\n  <p><strong>iPhone 17系列中国销量破3000万台，Pro Max版占近一半</strong></p>\n  <p>据第三方市场统计数据显示，iPhone 17系列在中国市场的受欢迎程度远超行业预期，上市至今的累计销量已经突破3000万台。相关统计数据显示，截至2026年第20周也就是5月11日至17日的时间节点，iPhone 17系列在国内的总销量已经达到约3040.55万台，整体市场表现十分亮眼。国内用户对顶配版iPhone 17 Pro Max的青睐程度远超其余机型，这一消费偏好也直观展现出国内消费者的高端购机能力。有数码博主放出的后台激活数据显示，在上述累计总销量中，iPhone 17 Pro Max的累计激活量已经突破1320万台，iPhone 17 Pro的累计激活量超过780万台，基础款iPhone 17的累计激活量也突破了916万台。（快科技）</p>\n  <p><strong>赛力斯回应特斯拉FSD入华，FSD模拟的是人类视觉驾驶逻辑</strong></p>\n  <p>5月29日，在第四届未来汽车先行者大会上，赛力斯汽车董事长张正萍就华为乾崑智驾与特斯拉FSD的对比发表了看法。他表示，两款智驾系统孰优孰劣，最终应交由市场来客观评判。在谈及具体技术路线时，张正萍指出：“哪个智驾系统好用还是要交给市场来回答。全新一代问界M9搭载了6颗激光雷达，这方面不输给FSD。另外，FSD模拟的是人类视觉驾驶逻辑，而华为乾崑智驾能够达到‘不只是人眼可以看到’的状态。”（IT之家）</p>\n  <p><strong>苹果Siri迎来近十五年最大改版，更多人工智能功能将推出</strong></p>\n  <p>苹果公司备受期待的Siri重大升级将成为下一代iPhone、iPad和Mac软件更新的核心亮点。彭博制作的示意图展示了重新设计后的Siri界面、一款全新的聊天机器人应用，以及苹果计划在6月8日全球开发者大会（WWDC）上公布的其他iOS 27重大更新。这些图片基于彭博看到的信息，以及知情人士提供的消息。苹果发言人拒绝置评。该公司通常会在内部测试多种功能设计，6月发布的最终版本可能与当前设计有所不同。（新浪财经）</p>\n  <p><strong>SpaceX据悉将IPO估值目标下调至至少1.8万亿美元</strong></p>\n  <p>据知情人士透露，SpaceX当前对首次公开募股（IPO）的目标估值至少为1.8万亿美元。上个月有报道称，其目标估值逾2万亿美元。但知情人士透露，这家火箭、数据和人工智能公司在与顾问和投资者磋商后，将目标估值下调。知情人士表示，IPO的发行规模和估值等细节通常会在定价前根据各方反馈调整。据此前报道，SpaceX预计最早将于6月4日正式启动IPO推介，并最早于6月11日定价。（新浪财经）</p>\n  <p><strong>美国迎来“娃娃炒股”金融实验，千万新生儿一出生就开始买ETF</strong></p>\n  <p>随着一款名为“特朗普账户”的App上线，一场规模空前、横跨数十年的金融实验正式进入上线前的最后阶段。作为背景，“特朗普账户”是美国政府去年设立的延税投资项目，目标是让儿童自出生开始自动成为股民，亲身体验储蓄随着复利增长，然后到18岁生日那天接管账户并决定如何使用这笔钱（或继续投资）。入户资金将自动投入默认的合格低成本指数基金。按照美国去年出生人口约360万推算，参与这场投资实验的人数预估至少在1000万人以上。（财联社）</p>\n  <p><strong>OpenAI：正在调查影响用户登录和使用ChatGPT的故障</strong></p>\n  <p>OpenAI在网站上表示，公司正在调查可能导致用户无法与ChatGPT对话、登录或创建帐户的问题。 根据网络状况监控网站Downdetector的数据，截至美东时间晚上11:04，已有约5000起相关故障的报告。（财联社）</p>\n  <p><strong>三星电子：开始向主要全球客户发运12层HBM4E芯片样品</strong></p>\n  <p>据报道，三星电子5月29日表示，已开始向主要全球客户发运12层HBM4E芯片样品。（界面新闻）</p>\n  <p><strong>特斯拉Optimus专属机器人工厂动工，规划年产能最高可达1000万台</strong></p>\n  <p>据报道，特斯拉位于得克萨斯州的超级工厂内，专属Optimus人形机器人工厂正式动工建设，规划年产能最高可达1000万台。该工厂将搭建第二代生产线，计划2027年夏季实现大规模量产，全面投产后日均产量约2.7万台。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阶跃发布Step 3.7 Flash</strong></p>\n  <p>36氪获悉，据阶跃星辰消息，阶跃正式发布并开源Step 3.7 Flash。据介绍，Step 3.7 Flash是面向Agent生产化阶段推出的新一代Flash模型，围绕Agent、Coding、Search与多模态工作流进行系统优化。</p>\n  <p><strong>AI算力驱动需求爆发，国产光通信产品出海热销</strong></p>\n  <p>眼下，国产光通信产品订单火爆，走俏国际市场，呈现量价齐升的景气态势，多家企业出口订单已排到2028年。A股市场上，今年以来光纤和光模块概念持续升温，截至5月28日收盘，万得光模块（CPO）概念指数、万得光纤概念指数年内涨幅均超过了100%，分别为104.76%、108.48%。（经济参考报）</p>\n  <p><strong>亚马逊员工刷AI数据致算力成本激增，公司关闭使用量排行榜</strong></p>\n  <p>亚马逊近日关闭了一项内部AI使用量排行榜。此前员工为冲排名、刻意刷高AI调用量，导致公司算力成本激增。据两位知情人士透露，这家市值2.9万亿美元的科技巨头本周通知员工，其内部服务“Kirorank”已下线。该工具原本用于给开发者平台Kiro的用户打分，分数完全基于其AI活动量。下线原因是：部分员工为冲榜，滥用AI智能体（可代用户执行任务的自动程序），让其执行大量无意义操作。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>汇成股份：已向香港联交所递交H股发行并上市申请</strong></p>\n  <p>36氪获悉，汇成股份公告，公司已于5月29日向香港联交所递交发行H股并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登此次H股发行并上市的申请资料。</p>\n  <p><strong>江波龙向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳市江波龙电子股份有限公司向港交所提交上市申请书，联合保荐人为中信证券、花旗。</p>\n  <h2>大公司财报</h2>\n  <p><strong>开市客三季度总营收705.3亿美元，高于市场预期</strong></p>\n  <p>开市客（Costco）5月28日公布三季度总营收705.3亿美元，同比增长12%，预估696.2亿美元；每股收益4.93美元，同比增长15.2%，预估4.91美元。（界面新闻）</p>\n  <p><strong>霸王茶姬：第一季度总GMV达79.18亿元，拟未来12个月回购最高1.5亿美元ADS</strong></p>\n  <p>36氪获悉，5月29日，霸王茶姬公布2026年第一季度（截至2026年3月31日）财务及经营业绩。财报期内，霸王茶姬实现总营收35.46亿元，同比增长4.5%；总GMV达79.18亿元，环比增长8.1%；经调整净利润5.07亿元。截至2026年3月31日，霸王茶姬全球门店数达7531家，会员数突破2.48亿，季度净增超千万。此外，霸王茶姬董事会已批准股份回购计划，公司拟根据市场情况、监管要求及其他因素，在未来12个月内回购不超过1.5亿美元的美国存托股份（ADS）。</p>\n  <h2>投融资</h2>\n  <p><strong>AI保险平台Corgi融资1.06亿美元，估值26亿美元</strong></p>\n  <p>人工智能保险平台Corgi当地时间5月28日宣布，已完成由投资公司TCV领投的1.06亿美元融资，公司估值达26亿美元。该公司首席执行官Nico Laqua表示，Corgi上月已实现盈利，新一轮融资将帮助公司拓展至更多领域，包括货运、小型企业和体育行业。（界面新闻）</p>\n  <p><strong>“易启未来”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，“易启未来”宣布完成数千万元A轮融资，由同创伟业、优山资本、杭州资本润苗基金等股东联合投资，天使股东网易继续加持。该公司由网易伏羲孵化，聚焦按摩机器人，自研3秒穴位识别算法与六轴机械臂运控算法。本轮资金将用于技术迭代、产品研发与规模化量产，加速海内外市场拓展。</p>\n  <h2>酷产品</h2>\n  <p><strong>全新猛士M817预售开启</strong></p>\n  <p>36氪获悉，猛士汽车与华为乾崑联手打造的全新猛士M817，完成全球首秀并正式开启预售，官方预售价37万元起。</p>\n  <p><strong>整理</strong>｜徐嘉彤</p>", "category": "tech", "published_at": "2026-05-30T00:52:20+00:00", "fetched_at": "2026-05-30T02:42:31.610925+00:00", "fingerprint": "e9939830330d8bab"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 服务富士康，半年营收超两千万的机器人解决方案商完成天使轮融资", "url": "https://36kr.com/p/3831135917107075?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，乘物机器人（深圳）有限公司（以下简称“乘物机器人”）近日完成天使轮融资，由中国台湾工业自动化与智能机器人解决方案领域龙头企业和椿科技战略投资，华君资本担任独家财务顾问。</p>\n  <p>乘物机器人成立于2025年，总部位于深圳，专注工业具身智能技术研发与产品解决方案，具备从软硬件研发、数据采集、模型训练、场景部署与维护的一体化技术能力。</p>\n  <p>创始人黄金龙技术出身，拥有十余年机器人全栈研发与产业化经验，主导过多类工业机器人产品研发与落地；联合创始人单玉虎博士，曾先后在腾讯、小鹏、美团等企业负责机器人核心技术研发，深耕多模态大模型、3D感知、多传感器融合等领域，拥有丰富量产实战经验。</p>\n  <p>工业场景中，非标场景普遍存在，机器人落地应用往往需要定制化的解决方案。乘物机器人由此切入，成立之初便聚焦工业场景，通过本体整合成熟供应链方案，自研末端执行结构、电子硬件、软件算法、云端能力及核心大模型，快速沉淀出标准化的技术产品包，具备了覆盖工业场景全流程的交付能力。</p>\n  <p><strong>目前，公司已完成十余个工业场景落地项目，2025年累计营收超两千万元，服务包括富士康在内的一系列代表性头部制造企业。</strong></p>\n  <p><strong>在此期间，团队与数十家头部主流机器人本体厂商建立深度合作关系，并获得8家头部品牌的最高权限授权，为其落地具体场景做定制化服务。</strong></p>\n  <p><strong>同时，乘物机器人也在布局模型端。公司正以工业垂类VLA（Vision-Language-Action）大模型为核心研发方向，希望打造具备“一脑多形”跨本体泛化能力的具身智能模型。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_ab23dbd36ba34964bedeb8f969450d14@5920579_oswg270130oswg1080oswg505_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>该模型融合空间感知、强化学习及世界模型的能力，能够提高对复杂异形物体的三维感知、精准操作与跨场景泛化能力，解决传统方案泛化性不足的问题。</p>\n  <p>具身模型的核心瓶颈之一在于数据。乘物机器人自研了Egocentric-UMI数据采集装置与Bybot-TeleOp远程操作系统，通过遥操模拟真实产线环境，高效采集视觉、力矩等多模态数据，大幅降低模型训练与部署周期，解决传统数据采集成本高、效率低的问题。</p>\n  <p><strong>目前，公司自研VLA模型Bybot Foundation Model-1（BFM-1）的训练及部署流程已全面跑通，技术验证顺利推进。</strong></p>\n  <p>硬件层面，乘物机器人同步研发工业精准操作的上半身机器人原型产品，搭载仿生力控双机械臂、灵巧手、腕部相机及RGBD相机等核心部件，为工业垂类基础模型训练与场景适配提供硬件支撑，推动大模型与工业机器人本体深度融合。</p>\n  <p><strong>以下为访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：为什么从场景落地转向模型研发？</strong></p>\n  <p><strong>黄金龙：</strong>我们非常看好VLA和具身智能的发展方向。在我们看来，机器人本体本身并不是最难的部分，尤其是在深圳这样的硬件产业链环境里，把机器人“做出来”并不算特别高的门槛。真正困难的是：模型如何和本体融合，并最终在真实客户场景中落地，让客户愿意持续付费。</p>\n  <p>目前行业里真正实现规模化落地的案例并不多。我们认为，具身智能的发展路径会遵循“工业—商业—服务—家庭”这样逐步演进的过程。其中工业场景最容易率先落地，因为很多工业任务并不需要特别复杂的灵巧操作，很多场景通过二指夹爪就能完成。相比之下，家庭场景对安全性、泛化性和稳定性的要求更高。</p>\n  <p>另外，和椿除了战略投资外，也为我们带来了大量产业客户资源。我们目前已经进入富士康等客户体系，并有项目进入实际交付阶段。由于能够直接接触一线客户，我们可以更清楚地理解客户真正需要什么：如果传统自动化技术能够解决问题，我们就优先采用传统方案；如果具身模型能够创造更高价值，我们就用具身技术去完成交付。</p>\n  <p><strong>硬氪：乘物机器人做具身模型的核心优势是什么？</strong></p>\n  <p><strong>黄金龙：</strong>首先是全栈能力与真实交付经验。团队具备从机械、电子到软件、算法、云端服务的完整研发能力，过去也长期为头部机器人厂商提供定制化解决方案，因此对工业场景中的非标需求、交付流程以及客户痛点有非常深入的理解。相比只做模型的团队，我们更清楚模型如何真正转化为可商用的解决方案。</p>\n  <p>其次，我们希望打造的是“平台化”的具身模型能力。目前VLA模型普遍存在泛化能力不足的问题：一个场景中训练出来的数据和模型，往往无法迁移到另一台机器人或另一个环境中。乘物机器人的模型设计并不绑定单一本体，而是能够适配不同厂商、不同类型机器人平台，从而解决行业中模型难以跨平台部署的问题。</p>", "category": "tech", "published_at": "2026-05-30T01:53:46+00:00", "fetched_at": "2026-05-30T02:42:31.610912+00:00", "fingerprint": "b4c240e515efba0d"}, {"source": "少数派", "title": "什么才是「好」的 Android 音频输出？从一台旧日 Xperia 说起", "url": "https://sspai.com/post/110120", "summary": "Android 早已具备高质量音频输出的能力，但一段声音从在抵达耳机之前，往往还要经过系统层层处理。下面我们一起探究 Android 高保真输出背后的秘密。<a href=\"https://sspai.com/post/110120\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-29T02:57:32+00:00", "fetched_at": "2026-05-30T02:42:30.204951+00:00", "fingerprint": "1327b8bf9324d93e"}, {"source": "少数派", "title": "Await：五分钟，把点子变成 iPhone 小组件", "url": "https://sspai.com/post/110106", "summary": "我希望 Await 最后留下的，是一种更轻的创作入口：不必很大，但足够好看和好玩，也足够贴近自己每天使用手机的方式。<a href=\"https://sspai.com/post/110106\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-29T07:00:28+00:00", "fetched_at": "2026-05-30T02:42:30.204945+00:00", "fingerprint": "5b1afc41fa718f5d"}, {"source": "少数派", "title": "住久了没意思（三）：打造能好好放松的卧室", "url": "https://sspai.com/prime/story/how-to-renovate-a-rental-bedroom", "summary": "前文回顾：租房常见问题与我的改造原则从有光的地方开始动手对大部分人来说，卧室可能是在家里待得最长时间的区域。除了每天睡觉，周末可能也会花很多时间赖在卧室；如果家里比较小，卧室还可能承担休闲和娱乐的功能 ...<a href=\"https://sspai.com/prime/story/how-to-renovate-a-rental-bedroom\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-05-29T09:20:56+00:00", "fetched_at": "2026-05-30T02:42:30.204939+00:00", "fingerprint": "ee58caca4baf8e8b"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 8 部作品", "url": "https://sspai.com/post/110446", "summary": "📅本周新预告《玩具总动员5》终极预告5月26日，皮克斯动画电影《玩具总动员5》发布了终极预告，将于6月19日内地上映。安德鲁·斯坦顿、麦肯纳·哈里斯执导，胡迪、巴斯光年、翠丝等老朋友们回  of this update, Copilot will provide more reliable and structured responses that are easier to scan, according to Microsoft. The redesign, which is rolling out across desktop and mobile devices, comes [&#8230;]", "category": "tech", "published_at": "2026-05-28T20:14:07+00:00", "fetched_at": "2026-05-29T02:48:42.544830+00:00", "fingerprint": "1dd18e5ec70038e3"}, {"source": "The Verge", "title": "Nintendo&#8217;s newest WarioWare is a weirdo smartphone app", "url": "https://www.theverge.com/games/939283/pictonico-nintendo-mobile-game", "summary": "A decade ago, Nintendo made a big splash into the world of mobile gaming with a new Super Mario platformer directed by none other than Shigeru Miyamoto. But even though the game proved popular, it wasn't the success the company had hoped for. Over the ensuing years Nintendo has slowly retreated from smartphone gaming, with [&#8230;]", "category": "tech", "published_at": "2026-05-28T20:16:16+00:00", "fetched_at": "2026-05-29T02:48:42.544821+00:00", "fingerprint": "f3fbea45fe25af7d"}, {"source": "36氪 - 最新文章", "title": "半年访谈600+用户、获千万元融资，这名清华毕业生想把脑机“戴”进运动场｜早期项目", "url": "https://36kr.com/p/3827323136004992?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>“运动场景中的脑状态监测，正在成为高水平训练和运动健康管理中的新需求。”创业两年，张昊天这样判断。</p>\n  <p>张昊天毕业于清华大学，研究生期间开始探索如何将脑机接口技术应用在C端场景。他坦言，自己最初也没想好具体的落地方向，研究过程中，团队陆续接触过一些运动类企业，发现“重视运动表现结果的场景，对大脑状态监测都存在一定需求”。</p>\n  <p>运动健康类可穿戴设备的需求其实早已得到验证，估值百亿美元、从极客圈火到大众市场的Whoop、Oura就是最好的说明。它们用心率、血氧等多项生理数据指标证明，监测身体状态能提升运动表现和恢复效率，也让大众逐步形成为科学运动数据付费的习惯。</p>\n  <p>但张昊天认为，目前，市面上的可穿戴设备主要通过四肢末梢数据反映身体侧状态，很难直接观察运动过程中的专注、压力、神经疲劳等脑状态变化，而脑状态是运动训练和比赛中“高度影响发挥、却长期看不见”的关键状态变量。</p>\n  <p>“运动不只是身体能力的竞争，也是一场关于大脑状态的竞争。对于水平接近的运动员来说，成绩差距不只来自体能、技巧本身，大脑状态也很关键。比如射击运动，最终胜负往往取决于扣动扳机时的瞬时专注力、抗压能力与情绪状态。”</p>\n  <p>即便是在非竞技类的普通运动人群中，这种影响同样存在。张昊天介绍，团队曾在半年时间里访谈了超过600位运动类用户，“我们发现，几乎所有受访者都出现过‘无实际肌肉损伤、但训练状态明显不对’的情况，进一步追问，‘脑子累’‘不想练’‘越练越差’是高频反馈。用户普遍希望有工具帮助他们理解训练中的主观状态变化”。</p>\n  <p>当前，职业体育圈一般会通过配备运动心理师的方式应对这类问题，但依赖人工评估的模式成本高、时效差、主观性强，更无法覆盖大众运动人群。</p>\n  <p>那么，如果能在运动中稳定采集脑电信号，并结合补偿算法进行质量判断，就有机会更直接地观察影响运动表现的脑状态变化。</p>\n  <p>因此，2024年毕业后，张昊天团队正式创办了“脑回录（Nanoloop）”，希望将非侵入式脑机接口技术融入进一款“智能运动头带”Nuromova N1，通过采集运动中的前额脑状态数据，结合多模态传感和AI算法，将脑状态趋势转化为直观且可理解的训练反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_ee326ab61e7b4f10b024de9265a49777@5930287_oswg4369581oswg3200oswg2400_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：脑回录（Nanoloop）</p>\n  <p>据介绍，这其中的难点不在于采集脑电本身，而是在运动场景下识别并剔除伪影，判断哪些数据真正可用。面对脑电伪影和噪声，Nuromova试图通过电极结构、噪声识别与信号补偿、SQI质量评估、算法剔除和个体基线来提升可用性。</p>\n  <p>Nuromova N1通过监测与注意调节、认知负荷和情绪相关过程有关的前额区域，结合脑电特征和个体基线，对状态趋势进行计算，识别疲劳、专注力、压力、情绪波动等状态趋势，在基础指标之上，系统会形成训练有效性、压力承受状态、恢复趋势等复合指标。</p>\n  <p>通过这些数据，Nuromova N1能够帮助运动者纵向观察自身状态变化，为训练复盘和计划调整提供参考。目前，Nuromova N1分为教练端和C端两个应用版本。</p>\n  <p>以教练端产品为例，从长周期看，教练训练学员需覆盖体能、技术、心态等多个维度。有了脑状态数据辅助后，能更有针对性地精细化管理训练计划，合理安排训练内容与节奏，不再依赖“高强度硬练”的传统方式。</p>\n  <p>从单次训练前、中、后的短周期看，训练前，中枢神经状态直接影响肌肉协调性、爆发力等。“我们的设备通过采集脑电，观察中枢神经相关状态与认知表现趋势，AI教练会帮助提供相关的数据解释，提供反馈建议，帮助用户通过冥想、拉伸、认知训练等方式，在热身前更好地进入训练状态。”</p>\n  <p>训练中，设备会以不打扰用户的方式观察、记录数据，不影响用户专注于运动表现。</p>\n  <p>训练后，数据则可用于复盘与恢复。比如，复盘时，可通过周期数据对比分析训练问题；而恢复是运动训练的核心课题，通常情况下，恢复不仅依赖睡眠、饮食，也与压力管理、放松训练和训练节奏有关。依托脑状态数据，用户可以结合呼吸、冥想、拉伸、放松训练、睡眠调整等方式进行恢复管理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_f2b2bac4df8641e8af55141dad7abca2@5930287_oswg259965oswg1600oswg900_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：脑回录（Nanoloop）</p>\n  <p>张昊天认为，这些运动场景的数据和经验积累，如脑电数据、脑电-运动表现模型、硬件研发经验等，会成为脑回录未来的核心资产。“非侵入式脑机接口普遍存在运动伪影、噪声干扰，运动场景尤其如此。我们通过算法补偿、噪声剔除技术，能获取满足运动场景需求的有效信号。理论上，运动场景对信号稳定性要求更高，相关工程能力未来有机会迁移到更多日常状态管理场景。”</p>\n  <p>目前，脑回录团队累计已积累约500小时多模态数据，包含脑电、IMU、训练事件和主观反馈等维度，覆盖射击、高尔夫、自行车、摔跤、篮球等运动场景。此外，公司已与清华大学、北京体育大学、首都体育学院等高校院所，以及部分运动数据服务商开展合作，并开始获得来自运动爱好者和早期用户的C端订单；同时，海外市场推广也在规划中。</p>\n  <p>另据了解，近期，脑回录已完成由南山战新投投资的千万元级种子+轮融资。募集资金主要用于核心技术迭代、产品工程化落地及市场拓展等，以加速非侵入式脑机接口穿戴设备在运动场景中的规模化商用。</p>", "category": "tech", "published_at": "2026-05-29T00:30:00+00:00", "fetched_at": "2026-05-29T02:48:42.413595+00:00", "fingerprint": "101a6019dc985d82"}, {"source": "36氪 - 最新文章", "title": "「卡玺CardChic」  获天使轮融资，以中国文化IP＋精品化打造收藏卡品牌 | 36氪首发", "url": "https://36kr.com/p/3829202710045827?f=rss", "summary": "<p>文 | 小葵</p>\n  <p>编辑 | 刘士武</p>\n  <p>36氪获悉，<strong>专注于中国文化IP的精品卡牌发行品牌「卡玺CardChic」近日已完成近千万级人民币天使轮融资。本轮资金将用于重磅IP的签约储备、产品工艺升级以及新一代TCG对战卡牌的研发与推广。&nbsp;</strong></p>\n  <p>卡玺CardChic创办于2025年，总部位于杭州。核心团队中，创始人李昌林毕业于新加坡南洋理工大学，高中起连续创业，研究生期间创办广告公司并实现年营收近千万元，成功退出后曾加入腾讯；供应链合伙人拥有20年印刷行业经验；运营合伙人在国内卡牌圈深耕四年，个人收藏卡价值达数千万元；团队具备球星卡、PTCG、国产卡等多种卡牌品类的丰富经验。公司主要业务为影视、动漫等中国文化IP的精品收藏卡牌发行。&nbsp;</p>\n  <p>当前国内卡牌行业呈现分层竞争格局：卡游凭借小马宝莉、奥特曼等IP在线下零售渠道做到单品10亿级以上销售规模；HitCard专注影视收藏卡，以线上销售为主；Kakawo深耕迪士尼系列卡牌，其母公司Suplay正运作上市；闪魂于2025年获得亿元级天使轮融资，推出符文战场TCG卡牌；集卡社则聚焦二次元动漫IP，近期完成了接近20亿估值的融资。&nbsp;</p>\n  <p>面对这样一个巨头和垂类玩家林立的市场，卡玺CardChic选择了差异化路线，以具有强中国文化代表性的影视、动漫IP为内容核心，走高端工艺和差异化市场，定制精品收藏卡牌。&nbsp;</p>\n  <p>具体到业务端，团队选择以卡牌发行为核心切入收藏卡市场，其中周星驰《大话西游》纪念收藏卡作为首款产品，在上线7天实现了数千万GMV并售罄，获得国际知名评级机构PSA认可，成功在收藏卡领域建立起了品牌认知。目前，卡玺CardChic正在持续加码头部IP储备，已签约《凡人修仙传》等头部国漫IP，为进一步夯实内容矩阵奠定了基础。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_c0ee8964300943b5a4c16d14e79e9b63@242988687_oswg153162oswg1080oswg659_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《大话西游》纪念收藏卡</p>\n  <p>李昌林表示，国内收藏卡行业长期面临IP授权分散、产品生命周期短等挑战，多数项目在发行一弹后便难以为继。“中国需要像宝可梦一样具备长期生命力的卡牌IP，而这背后依赖的是对IP的深度运营，不仅仅是快速发行，而是给用户提供真正有价值的收藏级产品，并持续构建用户线下互动生态。”</p>\n  <p>李昌林告诉36氪，卡玺CardChic的解法是坚持精品化路线，只选择团队基因里真正喜欢的且具有强故事性的IP，同时和IP方价值观高度一致，将电影、动漫的经典叙事与情感融入产品设计，为用户提供兼具情绪价值和长期收藏属性的卡牌作品，并以此反哺IP方，延长IP的生命周期。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_58cb4b16059146609931f5adae6d8f77@242988687_oswg52166oswg707oswg489_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《大话西游》</p>\n  <p>为从根本上解决收藏卡项目持续性不足的问题，卡玺CardChic于今年正式启动TCG对战卡牌、AI陪伴潮玩、联合IP孵化、自有工厂投资、核心线下体验场景店等布局，计划通过玩法驱动形成长期活跃的玩家生态。李昌林认为，只有当卡牌成为承载社交和经济的载体，IP的生命周期才能被真正激活，才有机会沉淀出属于自己的文化符号。&nbsp;</p>\n  <p>渠道层面，卡玺CardChic目前采用“线上为主，线下为辅”的销售策略。线上拆卡直播间是主要的出货阵地，能够高效消耗大量货品；线下则覆盖KA门店与潮玩零售渠道，同时针对不同产品属性匹配不同的发售方式——周星驰《大话西游》纪念收藏卡主要在线上直播间触达核心收藏用户，而定价相对亲民的“草莓音乐节”则选择在音乐节现场发售。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_f74ab8e712b14bd5913c6e925f813965@242988687_oswg2022745oswg1080oswg1437_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">草莓音乐节限定收藏卡</p>\n  <p>融资完成后，卡玺CardChic将在四个方面重点投入：持续锁定具有中国文化代表性和强故事性的头部IP，扩大核心IP储备；升级产品工艺与设计能力，建设工厂产线，在收藏价值与视觉体验上建立更高的壁垒；加速对TCG对战卡牌的研发，争取在国产卡牌赛道中走出一条从“短期爆发”到“长线运营”的差异化道路；联合知名IP厂商孵化自有优质IP，内部孵化AI潮玩等更多情绪价值产品。</p>\n  <p>李昌林表示，团队不希望卡玺CardChic是一个追逐IP风口的发行品牌，而是一个能真正陪伴IP长期生长、与玩家共同构建收藏文化的卡牌品牌。</p>\n  <p class=\"editor-note\">本文首发自微信公众号“36氪游戏”。</p>", "category": "tech", "published_at": "2026-05-29T01:01:06+00:00", "fetched_at": "2026-05-29T02:48:42.413590+00:00", "fingerprint": "7d19164e7502cec4"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 李泽湘系投过的星空摄影设备品牌再获数百万美金融资，产品即将登陆众筹", "url": "https://36kr.com/p/3829705374098823?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，星空原野（重庆）科技有限公司（以下简称“星空原野”）近日完成新一轮融资，由线性资本独家投资数百万美金，安可资本担任公司独家财务顾问。此前公司曾获明月湖国际智能产业科创基地（XbotPark 重庆）孵化基金，及重庆市种子投资基金投资。</p>\n  <p>星空原野成立于2024年，是一家聚焦星空摄影设备和智能影像解决方案的创新型科技企业。公司以星野摄影为切入点，正在探索新一代星野 Robot Camera：通过软硬件一体化，把过去依赖专业设备、复杂参数和电脑后期的星空创作流程，转化为普通用户也能完成的移动影像体验。</p>\n  <p>星空原野创始人周少阳是智能硬件领域连续创业者，长期从事机器人系统与智能硬件产品的研发与落地，拥有完整的产品化经验。与此同时，周少阳拥有十余年星空与风光摄影经历，是视觉中国签约摄影师。登山、摩托骑行与户外旅行的爱好让他对星野摄影场景、户外拍摄流程以及用户需求能够形成更深入的理解。</p>\n  <p>星空摄影主要分为深空与星野两类。深空摄影偏向专业化创作，依赖长焦镜头、赤道仪、天文望远镜及高精度长时间曝光，评价体系涉及导星精度、信噪比、后期处理等较高门槛，理解和传播范围相对有限。</p>\n  <p>相比之下，星野摄影以广角视角为核心，将星空与地景、人物、建筑、旅行和生活方式相结合，强调“人在天地之间”的真实体验。它既可呈现露营、公路旅行等场景，也适合社交媒体上的风光作品。由于画面直观、情绪感染力强、审美门槛低，具备更广泛的大众传播能力，是星空摄影中覆盖人群最广、最易向泛摄影与大众创作扩展的方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_5300472413dc4567b280bb19b963bdb8@5920579_oswg778107oswg866oswg576_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>周少阳介绍称，尽管星野摄影的作品呈现接近最终成果，但其创作过程极为复杂，90%的难度集中在技术执行而非美学表达，形成了“低审美门槛、高创作门槛”的矛盾。这正是星空原野希望解决的痛点——通过便携化智能设备，降低星野摄影的门槛。</strong></p>\n  <p>团队首款产品ASTERRA-Z为轻量化赤道仪，在星空摄影中，赤道仪用于抵消地球自转以实现长曝光拍摄。然而，传统赤道仪源自天文观测需求，体积大、重量重，不适用于移动拍摄。</p>\n  <p><strong>公司的赤道仪产品于2024年底推出，2025年升级为Z Plus版本，在摄影社区尤其是星野KOL中获得广泛认可，主要用户为准专业摄影师。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_a60dfe64b5514463bba74c2d3705c1ee@5920579_oswg200648oswg875oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>在完成首款产品私域用户积累的同时，星空原野也在进行首款星野robot camera的研发。</strong>周少阳表示，普通用户即使手机已具备拍星能力，仍因需额外购买并掌握赤道仪而望而却步，因此未来方向是“跨越赤道仪”，将其功能内嵌至更易用的设备中。</p>\n  <p><strong>新产品采用全新的多轴云台架构，机身尺寸仅略大于 DJI Pocket 3 系列，在保持便携性的同时，可实现远超传统云台的运动能力。</strong>除常规稳定功能外，其复合运动系统可模拟赤道仪跟踪逻辑，用户无需复杂设备、专业调校或天文摄影经验，即可一键完成星空跟踪拍摄。</p>\n  <p>它首次将过去属于少数专业玩家的星野摄影能力，降低到普通摄影用户甚至完全零基础小白都能够轻松进入的门槛，让星野创作从“小众技术”变成一种大众化的影像体验。</p>\n  <p>围绕星野摄影这一特殊赛道，产品也进行了更贴近需求的设计，例如，传统云台不利于长曝光，因浮动结构易产生抖动。新设备通过独特机构设计提升静态稳定性，确保长时间曝光清晰。在城市里的星空拍摄场景，由于星空跟城市的光污染波段接近，星空光线被遮盖，新设备通过特殊的光路设计，拓展用户可以实践的拍摄场景，在城市中捕捉银河和星空。</p>\n  <p>公司还同步进行了软件开发，AI智能体ASTRA Bot分为两部分：一是创作建议系统，基于位置、时间、天气、月相等数据，主动提示用户“何时、何地、能拍什么”，例如“今晚海边可能出现银河与灯塔同框”“凌晨的雾气适合低角度人物剪影”等，让用户在真实世界中不断发现值得创作的瞬间，在此基础上进一步提供自动化拍摄规划与参数建议，帮助用户完成作品。</p>\n  <p>二是图像处理引擎，将过去复杂且专业化的星空摄影后期流程全面自动化。系统可在手机端一键完成堆栈降噪、天地拼接、色彩还原、星空增强、全景拼接等复杂处理，甚至支持流星雨合成、多张素材自动融合等传统上需要电脑与专业软件才能完成的工作。</p>\n  <p><strong>新产品预计2026年第四季度上市，优先通过 Kickstarter 发起海外众筹，同步推进国内销售渠道建设。</strong>目前仅在国内私域销售的 ASTERRA-Z 赤道仪产品口碑良好，头部星野摄影师多采用其作为主力设备；公司也已开始接触海外星野摄影 KOL 与垂直社群，为新品在国际市场的传播与测试积累基础。</p>\n  <p><strong>以下为访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：为什么这次创业选择切入星空摄影的赛道？</strong></p>\n  <p><strong>周少阳：</strong>之所以选择星空摄影，是因为它同时具备“大众审美门槛低、创作技术门槛高”这两个特点。大部分日常的摄影题材，都需要很强的美学能力才能把普通“素材”变成“作品”。少部分专垂直领域的摄影，比如鸟类、深空摄影，只有圈内人能理解，普通人其实很难判断作品好坏。但星野摄影不一样——有天空、有地景、有人物，普通人天然就会觉得“很美”。人类对星空本身就有一种近乎本能的向往，因此星野摄影是一种非常普适的视觉体验，也是“素材”和“作品”最接近的一种摄影。</p>\n  <p>星空摄影的大部分难度并不在创作本身，而在复杂的工程化流程里。用户需要研究天气、月相、地理位置、设备参数，还要做堆栈、拼接、降噪、调色等后期处理。很多人看到作品会觉得“我也想拍”，但真正上手后发现门槛极高。</p>\n  <p>这也是我们想解决的问题。今天很多所谓“星空摄影师”，某种程度上更像是熟练的工具使用者。我们希望通过工程化和智能化能力，像大疆当年降低航拍门槛一样，把复杂流程尽量自动化，让更多普通人也能轻松进入星野摄影这个创作领域。</p>\n  <p><strong>硬氪：ASTERRA-C 与传统赤道仪或运动相机最大的区别是什么？</strong></p>\n  <p><strong>周少阳：</strong>传统赤道仪本质上是为天文观测发展出来的设备，它很精密，但也很重、很复杂。运动相机和手机则足够轻便，但在长曝光、星空跟踪和复杂后期上又不够完整。我们希望 ASTERRA-C 处在两者之间：它不是把一个专业赤道仪缩小，而是重新思考星野摄影这件事需要什么样的硬件形态。用户看到的可能只是一个便携设备，但背后其实包含跟踪、稳定、构图、拍摄规划和后期处理的完整链条。</p>\n  <p><strong>硬氪：为什么要同步做软件的开发？</strong></p>\n  <p><strong>周少阳：</strong>AI时代，生成一张“漂亮图片”越来越容易，未来普通用户可能很难分辨星空照片是AI生成还是真实拍摄。但我们认为，用户真正需要的不是结果，而是“可信的创作感”——从到达现场、等待天气、到按下快门、获得传播的完整体验。那张照片承载的是独家记忆，而非一段提示词。</p>\n  <p>例如，一个新手不知道今晚能拍什么，系统会告诉他哪里适合拍、几点银河最好、用什么参数，拍完后后期也能自动完成，让他不用学太多就能迈出第一步。我们觉得未来最核心的问题，不是 AI 能不能生成内容，而是如何在 AI 深度参与之后，用户依然保有真实的创作体验。这也是我们同步做软件和 AI 系统的核心原因。</p>\n  <p><strong>硬氪：为什么现在要把产品推向海外市场？</strong></p>\n  <p><strong>周少阳：</strong>星野摄影本身就是全球化的兴趣场景。无论是在中国西部、澳洲、新西兰、美国西部，还是欧洲高山地区，用户面对的痛点都很相似：想拍到星空，但不知道去哪、什么时候拍、怎么设置参数、拍完之后怎么处理。我们第一代产品已经在国内核心用户里完成了比较充分的验证，下一阶段希望通过 Kickstarter 和海外 KOL、社群，把产品带到更广泛的星野摄影和户外创作者面前。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>线性资本表示：</strong>大疆重做了航拍，少阳有机会重做星野。十余年摄影实战叠加连续创业的硬件工程能力，让他对这个品类的痛点与解法都有第一手的理解。期待星空原野把一种小众体验，变成大众语言。</p>", "category": "tech", "published_at": "2026-05-29T01:39:23+00:00", "fetched_at": "2026-05-29T02:48:42.413583+00:00", "fingerprint": "065176ba29fddd41"}, {"source": "36氪 - 最新文章", "title": "再花22亿乘胜追击，北京城建“龍樾”要抢跑了", "url": "https://36kr.com/p/3829749268981123?f=rss", "summary": "<p>5月28日，北京石景山区黄庄村43号棚户区改造项目SS00-1622-002、SS00-2501-002地块进入现场竞拍，最终该地块由北京城建兴通置业有限公司以底价22亿元摘得，成交楼面价约3.31万元/㎡。</p>\n  <p>北京城建兴通置业有限公司是北京城建的全资子公司。<strong>这是去年第四季度以来，北京城建第三次独立拿地补仓。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_5e6360830cc44c4080a147fff788a9bf@6208419_oswg156697oswg1080oswg972_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：天眼查</p>\n  <p><strong>在拿下石景山黄庄村地块的同一时间，北京城建公布了这个新项目的案名：龍樾璟序。</strong></p>\n  <p>从官方案名来看，石景山黄庄村项目与最近开盘的昌平新盘龍樾海序属于同一条产品线。而昌平龍樾海序5月16日开盘即获得了网签493套的亮眼成绩，首开去化率约六成，网签金额超26亿元，强势登顶北京新盘成交榜。</p>\n  <p>龙樾产品系是北京城建的高端产品线，首个落地项目是位于‌丰台区卢沟桥的龙樾天元（2022年入市），但到了昌平龍樾海序项目，<strong>项目名称中代表产品线的“龍樾”变成了繁体字，且操盘思路也发生了改变。</strong></p>\n  <p>相隔四年的两个项目，代表了北京城建对市场理解的不同，<strong>更折射出北京城建在新领导班子带领下的产品逻辑转变。</strong></p>\n  <p>新拿地的龍樾璟序与刚刚近期开盘热销的龍樾海序有一些相似之处，它们不仅同属一条产品线，相隔时间不长（2025年10月拿地），且都位于临近海淀的板块。龍樾海序热销之后，北京城建又快速拿下石景山黄庄村龍樾璟序项目，是在借势乘胜追击。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_e8b8737cf9fe4c858b23074fedf31a08@6208419_oswg388880oswg545oswg503_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">地块位置，来源：北京市规自委</p>\n  <p>实际上，在石景山地块拿地之前，北京城建已经悄悄发了招标预告。5月7日到8日，北京城建密集发布数则招标计划，总投资额为7.6亿元，全面铺开前期工程，为项目在今年下半年尽早开盘入市做准备。</p>\n  <p>从最近的一系列动作来看，<strong>北京城建在悄悄“抢跑”。</strong></p>\n  <p>近一年来，北京城建（含城建发展及城建六建）在北京土地市场共斩获7宗地块，总成交金额171.83 亿元，总规划建筑面积46.87万㎡，布局覆盖东城、石景山、丰台、昌平、房山、密云等多个区域。</p>\n  <p>北京城建为何敢于“多点开花”大手笔拿地？主要是因为北京城建有两个优势。</p>\n  <p><strong>首先，北京城建的土地一级开发能力很强。</strong>最新竞得的石景山黄庄村地块的一级土地整理者就是城建发展的兄弟公司——北京城建房地产。</p>\n  <p>仅从环线位置来看，石景山黄庄村地块坐落于西三环与西四环之间，位置优越，其行政上虽规划石景山，但地理位置上更贴近海淀，与海淀玉泉路板块的直线距离不足2公里。但这块地之所以争夺者不多，核心在于地块素质一般，存在地块形状不规则、地块北侧京九铁路线可能会有较大噪音等明显不足。</p>\n  <p>实际上，早在2024年8月，这宗地就曾在供地清单中亮相，并进到了预申请流程。不过，最终因无人报名而未能正式挂牌出让。</p>\n  <p><strong>这次北京城建敢于拿地，是因为它“捡漏”了。</strong>早在2024年首次上市时，起始总价达42.43亿元，总建筑面积约8.49万㎡，容积率2.55，楼面价约5万元/㎡。此番重返市场，该地块出让条件已显著优化：起始总价降至22亿元，总建面调至7.23万㎡，分别下降48%和15%，容积率亦降至2.15。大幅度“降价、瘦身”不仅降低了企业拿地成本，也为未来操盘提供了更灵活的空间。</p>\n  <p>中指研究院土地市场研究负责人张凯分析，近年来玉泉路及五棵松板块新增供应稀缺，市场以存量部队大院、机关单位住房为主，仅北侧有半壁店保利熙瑞、海宸元境等少数项目在售。因此，该地块有望承接海淀南部外溢客群、五棵松区域改善需求，以及石景山本地升级客户。</p>\n  <p>价格方面，项目西侧首钢园板块内近些年存量竞争较为激烈，如璟悦长安近半年销售均价6万元/㎡，长安源境5.8万元/㎡；四环外建工熙华台销售均价约7.8万元/㎡且接近清盘。二手房方面，北侧大型社区远洋山水可作为地块价值的直接参考锚，作为西四环沿线标志性大盘，该项目建成于2000年，目前挂牌均价约4.2-4.8万元/㎡，实际成交价约4.0-4.5万元/㎡。综合周边新房与二手房价差，预计该地块入市后，价格可能接近6.5万元/㎡。</p>\n  <p><strong>较低的地价，为北京城建留足了产品升级和盈利空间。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_a8973a8d148e40129ab556814c075dc2@6208419_oswg550220oswg865oswg676_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：克而瑞</p>\n  <p>其次，<strong>北京城建近年来产品力也在持续提升。</strong>这也是其项目热销的核心原因。最新热销的龍樾海序，全产品户型使用率达到90%—97%，部分边户高达99%，同等面积比普通项目多出15-20㎡使用面积。另外在室内空间方面也有一系列创新。</p>\n  <p>根据石景山黄庄村地块出让文件，项目总用地面积3.66公顷，规划地上建面7.23万㎡。其中，1622-002住宅地块占地3.15公顷，地上建筑规模6.769万㎡。未来，作为北京城建又一“龍樾”产品，项目大概率以小高层、三居户型为主，户均面积约在105㎡-110㎡，预计总价500万即可上车，与附近的海淀五棵松板块相比，价格优势明显，再加上石景山在规划审批方面比海淀放得更松，预计北京城建新项目将会虹吸一部分海淀南部改善群体。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/snJ7N-EEeOpERUM9tS4sPQ\" rel=\"noopener noreferrer\" target=\"_blank\">“未来可栖”</a>，作者：小屋见大屋，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-29T02:26:05+00:00", "fetched_at": "2026-05-29T02:48:42.413575+00:00", "fingerprint": "110c2218ed67a0d0"}, {"source": "36氪 - 最新文章", "title": "谁是世界上第二爱泡泡玛特的人？", "url": "https://36kr.com/p/3829746420835715?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑 | </strong>张帆&nbsp;</p>\n  <p>一纸权益披露文件，让市场看到段永平对泡泡玛特的热爱绝不止是“口嗨”。</p>\n  <p>5月27日晚间，段永平与其全资控股的H&amp;H International，同步增持了泡泡玛特的股份，一致行动人持股比例达5.69%，对应约7637.16万股，一跃成为仅次于创始人王宁的第二大股东。</p>\n  <p>知名投资人的每一次站台，总是能或多或少地提升市场信心。</p>\n  <p>截至发稿前，泡泡玛特收盘价161.5港元，涨幅4.74%。若以最新股价计算，段永平的这笔持仓对应的市值达到123亿港元。而他对泡泡玛特的态度，也堪称180度的“史诗级逆转”。</p>\n  <p>就在去年8月，当泡泡玛特的股价逼近历史高点、被称作“新消费茅台”时，段永平唱了反调，表示“看不懂10年后的泡泡玛特。”今年1月，他在雪球回应网友提问时还说，“依然无法理解人们为什么需要这个东西，万一过两年大家都不要了呢？”</p>\n  <p>两个月后，泡泡玛特发布2025年财报，全年营收371.2亿元，同比增长184.7%；经调整净利润130.8亿元，同比增长284.5%；毛利率达到72.1%。</p>\n  <p>仅从财报表现看，泡泡玛特的任何一个数据放在消费行业都是炸裂的，但资本市场明显对管理层给出的2026年业绩指引感到担忧，同时因LABUBU的热度下跌产生恐慌。</p>\n  <p><strong>这也导致，3月25日财报发布当日，泡泡玛特的股价连续5个交易日暴跌，累计跌幅达到34.7%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_cdecbf2fd5a14288a6a468e73bd02860@394564713_oswg54522oswg1056oswg573_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自Wind</p>\n  <p>未曾想，恰恰是在市场最悲观的时刻，段永平发帖称，“连续好几天去理解这家公司”。在专门跑到伦敦的泡泡玛特门店探访，以及读完了王宁的个人传记《因为独特》后，段永平宣布收回此前“不投资”的说法，并表示已“很久没有过这种兴奋感”。</p>\n  <p><strong>更关键的动作在4月9日，段永平发起的Put试水。</strong></p>\n  <p>看跌期权的本质是一种谨慎、更有安全边际的投资方式。</p>\n  <p>当你卖出一份看跌期权（也称卖出Put），可以向买方收取一笔“权利金”，同时承诺对方一个约定的价格（行权价）。如果股价没有跌破这个价格，权利金就由卖方白赚；如果股价跌破，买方行权，卖方就需要在赚取权利金的同时，按约定价格从买方手中买入正股。</p>\n  <p>所以，段永平说“我的泡泡玛特保险公司开张了”。简单翻译就是：“我觉得直接买有点贵，不如先卖点‘下跌保险’赚取权利金。如果股价不跌，我白赚；如果跌了，正好用更低的成本接盘。”</p>\n  <p>此前他也在雪球上透露，短短20天，已合计卖出22500张看跌期权。而在4月29日的行权期，泡泡玛特的收盘价为154.07港元，市场推测的行权价大多在150港元。这也意味着，段永平一股没买到，却白赚了丰厚的权利金。</p>\n  <p><strong>直至5月7日，段永平对泡泡玛特已没有任何保留，甚至算得上是公共语境下“第二”爱这家公司的人。</strong></p>\n  <p>他公开表示“把神华都换成了泡泡玛特”，甚至在回应网友时直言：“我理解王宁不是因为我的投资，而是因为我也曾是个‘企业家’，能看懂他有多厉害。他还那么年轻。”</p>\n  <p>几乎在同时，段永平再度加仓了贵州茅台。左手茅台，右手泡泡玛特——在这位“中国巴菲特”的投资棋盘上，新旧标同场竞技。</p>\n  <p><strong>实际上，段永平的投资逻辑非常简洁。</strong></p>\n  <p><strong>他一直反复强调，“我理解的买股票就是买公司，买公司就是买公司的未来现金流折现。”而段永平筛选好股票、好公司的方法与巴菲特一致，非常看重ROE（即净资产收益率，核心算法为净利润/净资产），这一数值能更直观地反映一家公司的赚钱效率。</strong></p>\n  <p>在多次访谈中，段永平也表示，一只股票的年化回报率会趋近于ROE。如果一个企业的ROE长期维持在20%以上，说明它拥有强大的护城河。</p>\n  <p>两个投资案例能更好地展现他的理念。</p>\n  <p>2011年，乔布斯去世，苹果股价暴跌。段永平逆势重仓，也曾用卖Put的方式对苹果建仓，持有其股票14年不动。在这一期间，苹果公司的市值从3000亿涨到3万亿，段永平的收益超过10倍。他投资苹果的逻辑，更多在于IOS生态系统对用户的深度锁定。</p>\n  <p>2013年，塑化剂风波叠加反腐风暴，白酒行业陷入低谷。彼时的段永平更看中茅台未来十年的发展。他认为，茅台的行业地位和人们对顶级白酒的产品需求，不会发生根本性变化。</p>\n  <p>再从ROE这一数据来看，贵州茅台常年保持30%的水平。2025年，贵州茅台的ROE平均值达到34.36%。</p>\n  <p>苹果则呈现另一种结构。由于苹果近年来的持续股权回购，其净资产被压缩，ROE甚至达到170%（回购股权需要花费现金流，也影响股票数量）。但若撇开财务杠杆，苹果近年来的ROIC（投入资本回报率）也稳定在50%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_c9a500971e3d46f4874b3af7b3c59af8@394564713_oswg26950oswg762oswg423_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">苹果、贵州茅台、泡泡玛特ROE（平均）值；36氪根据Wind数据制图</p>\n  <p><strong>反观泡泡玛特的ROE数据，却不像苹果与茅台那样稳定。</strong></p>\n  <p>随着盲盒的商业模式受到质疑，泡泡玛特的净资产收益率一度跌至2022年的6.9%，随着公司对产品线的调整、多IP的布局，逐渐恢复至2024年的33.87%，2025年又飙升至77.52%。而泡泡玛特2025年的ROE表现，无疑受到LABUBU爆火的影响。</p>\n  <p><strong>曾有券商人士对36氪透露，部分投资者仍将泡泡玛特视作“周期股”。</strong></p>\n  <p>“2025年泡泡玛特、老铺黄金被炒得那么高，是因为港股市场、A股市场的科技股还没有明确的主线。美国市场的科技股，譬如存储，也是在去年年中后才开始大热。”</p>\n  <p>再从最能反映“当期利润”的市盈率来看，进入2026年以来，苹果稳定在30以上，贵州茅台始终在20上下起伏，泡泡玛特则从2月最高的48一路下跌至现如今的15.15。这也让部分投资者怀疑，泡泡玛特是否已经度过了高速增长的时期。</p>\n  <p>这又回到了“谁能承接LABUBU的泼天流量”，以及IP生命周期的老问题。</p>\n  <p>更早前，市场也曾担心泡泡玛特过于依赖Molly；到了2025年，以LABUBU为代表的“THE MONSTERS家族”为公司贡献的营收达到141.6亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_97d9edd0351a411185056f9af876ac06@394564713_oswg130601oswg690oswg920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自麦当劳官方微博</p>\n  <p>尽管在去年下半年，泡泡玛特主动放量，进而影响了LABUBU四代及后期产品在二手市场的价格表现。但对于消费品，从渠道手中夺回产品定价权，无疑是对公司未来净利润与品牌调性的最好保护。与泡泡玛特如出一辙，2026年1月以来，飞天茅台在“i茅台”的销售已成常态。</p>\n  <p>与此同时，泡泡玛特2025年财报也显示，公司共有17个艺术家IP收入过亿。除THE MONSTERS之外，SKULLPANDA、CRYBABY、MOLLY、DIMOO、星星人、HIRONO六大IP营收均突破20亿元。</p>\n  <p>近期，星星人还与麦当劳联名，双方合作推出的“星星人合唱团”系列盲盒大卖，首批40万个产品在15分钟内售罄。能够与国际大牌联合，也是星星人IP价值的一次成功商业兑现。</p>\n  <p><strong>一个明确的事实是，泡泡玛特早已是一个IP平台。</strong></p>\n  <p>当然，泡泡玛特未来的ROE水平能否稳定在某一区间内，还需时间沉淀。这个投资标的对于段永平的价值，也要在十年后才能兑现。资本市场或许要给予泡泡玛特更多耐心。</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_79544f5c84f64f278a47f5a0b86b3165@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/etREmLu4wi1kzuT9mdRORQ\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;张帆，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-29T02:40:19+00:00", "fetched_at": "2026-05-29T02:48:42.413561+00:00", "fingerprint": "d0758757699b9642"}, {"source": "少数派", "title": "免费试读 | 零基础  reported earlier by ABC News. In their now-unsealed complaint, prosecutors allege that Michele Spagnuolo \"knew the outcome of these wagers before the trading public did because he had accessed Google's confidential, [&#8230;]", "category": "tech", "published_at": "2026-05-27T22:30:02+00:00", "fetched_at": "2026-05-28T02:45:15.766459+00:00", "fingerprint": "935098baf3844f47"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜高盛策略师将标普500指数目标点位上调至8000点，受AI和盈利所推动；阿里员工十三薪并入年终奖", "url": "https://36kr.com/p/3827497128465287?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>程一笑：可灵AI 3月ARR近5亿美元，较去年同期增长4倍</strong></p>\n  <p>36氪获悉，在2026年第一季度业绩电话会上，快手科技创始人兼首席执行官程一笑表示，2026年3月，可灵AI年化收入运行率（ARR）近5亿美元，较去年3月的1亿美元增长4倍。程一笑表示，可灵AI一季度收入高速增长，主要来自B端企业客户API调用收入和P端付费会员订阅收入的双轮驱动。无论是用户数还是月均付费金额，可灵AI均实现了高速增长。从留存看，B端企业客户和P端付费会员均保持较好留存趋势，体现出可灵AI在专业创作场景中的技术和产品实力。</p>\n  <p><strong>台积电CEO：今年全员平均分红奖金涨幅将超30%</strong></p>\n  <p>针对员工近期在网络上对激励政策提出的疑虑，台积电总裁魏哲家向内部员工表示，今年全员平均分红奖金涨幅将超30%。作为全球人工智能产业链的核心企业，台积电在业绩大增的同时，进一步扩大员工激励力度。魏哲家此番表态也反映出，在人工智能产业迎来空前繁荣、企业营收大幅增长的大背景下，行业龙头企业面临着越来越大的压力，需要将不断增长的收益更多地回馈给员工。（新浪财经）</p>\n  <p><strong>九号公司：董事长高禄峰提议回购1.5亿元-3亿元股份</strong></p>\n  <p>36氪获悉，九号公司公告，公司董事长、实际控制人高禄峰提议公司以自有资金通过集中竞价方式回购部分中国存托凭证（CDR），回购资金总额不低于1.5亿元（含）且不超过3亿元（含），回购价格不超过60元/份。本次回购的股份将全部用于注销并减少注册资本。</p>\n  <p><strong>阿里员工十三薪并入年终奖</strong></p>\n  <p>5月27日，据阿里发布的全员信内容，自2027财年起，员工十三薪并入年终奖，改名为“并肩前行奖”，发放时间变更为和年终奖一起发放，即年终奖将由“并肩前行年奖”和“绩效年奖”两部分组成，单独列示。这意味着阿里十三薪与年终奖合并后，十三薪发放时间会从之前每年随春节当月顺延至4—5月。（北京商报）</p>\n  <p><strong>拼多多：一季度营收1062亿元，同比增长11%</strong></p>\n  <p>36氪获悉，拼多多发布2026年第一季度财报。财报显示，拼多多一季度营收1062亿元，同比增长11%；净利润125亿元，同比下降15%。主要源于“千亿扶持”以及重仓供应链的持续投入，一定程度上影响了短期的业绩表现。</p>\n  <p><strong>抖音生活服务出台AIGC创作管理规范，一季度处置超80万条违规带货内容</strong></p>\n  <p>36氪获悉，5月27日，抖音生活服务举办“2026年服务体验与治理开放日”活动，分享平台在消费者权益保护与体验提升方面最新进展。过去一年，平台低质内容违规率同比降低82%，虚假门店举报量下降90%。在主动权益保障方面，平台完成390万笔先行赔付订单，涉及金额2.4亿元；“安心”服务覆盖1.8亿消费者，服务订单达6.5亿单。</p>\n  <h2>新产品：</h2>\n  <p><strong>全新问界M9系列1小时订单突破11000台</strong></p>\n  <p>36氪获悉，余承东发文称，全新问界M9系列1小时订单突破11000台。</p>\n  <p><strong>腾讯电脑管家入局Mac生态，首推AI Agent安全防护</strong></p>\n  <p>36氪获悉，5月27日，腾讯面向Mac生态推出“AI Agent 安全管家”——腾讯电脑管家Mac版，以清理加速、AI应用安全、隐私防护、AI应用聚合四大核心能力，填补了Mac生态长期缺失“管家型”工具的空白。其中，电脑管家内置的“龙虾管家”是业内首个AI应用防护工具，为当下日益普及的AI Agent提供全方位安全防护。<strong>全新问界M9系列1小时订单突破11000台</strong></p>\n  <h2>今日观点：</h2>\n  <p><strong>高盛策略师将标普500指数目标点位上调至8000点，受AI和盈利所推动</strong></p>\n  <p>高盛集团策略师预计今年标普500指数回报将达17%，加入摩根士丹利和德意志银行同行之列。由Ben Snider领导的高盛团队表示，人工智能（AI）热潮推动的盈利增长将进一步提振股市，因此他们将该美国基准指数的年底目标点位上调至8000点，放弃了此前7600点的预测。（新浪财经）</p>\n  <p><strong>人形机器人指数大跌，奕帆传动、上纬新材回应股价波动</strong></p>\n  <p>今日人形机器人指数跌幅达3.53%，奕帆传动跌14.18%，上纬新材跌10.86%。奕帆传动回应称股价下跌或因板块轮动，公司运营平稳，日常订单正常。其近期终止重大资产重组，改为一般股权投资。上纬新材则表示市场波动不可控，并提示消费级智能机器人业务仍处研发阶段，存在不确定性。（中证报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>香港金管局：就内地投资者投资账户新增三项监管措施，开户核查倒查至2023年1月</strong></p>\n  <p>针对“香港地区部分银行开立投资账户需签署声明”一事，香港金管局今日回应，相关监管要求系5月22日向所有认可机构发出。 香港金管局提供的材料显示，要求注册机构在开设及管理内地投资者的投资账户时须采取三项额外措施，其中包括：一、关闭使用可疑或伪造文件开立的投资账户，识别自2023年1月起或金管局指明的任何其他时段内曾使用可疑或伪造文件开立的客户投资帐户，有关文件包括身份证明文件；二、关闭零结余不动投资账户，具体指由内地投资者持有的投资帐户，而该帐户截至2026年5月22日（参考日期）均无任何资产结余，且在参考日期起计前12个月内并无由客户展开的活动；三，新开立投资帐户时，须向该内地投资者取得书面声明确认所有用以支持投资活动及相关结算的资金均来自中国内地以外的合法来源等。 相关文件显示，新增的额外监管措施只适用投资账户，包括综合银行账户内的投资账户，非投资功能（例如普通储蓄、来往定期存款、支付、贷款及信用卡等）则不在相关措施适用范围内；同时，有关额外措施的适用对象是个人客户，并不适用于公司客户与机构客户。（财联社）</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-05-27T12:17:05+00:00", "fetched_at": "2026-05-28T02:45:15.604014+00:00", "fingerprint": "eba9ca5ae1bdd0a4"}, {"source": "36氪 - 最新文章", "title": "腾讯游戏的One More Thing，是AI", "url": "https://36kr.com/p/3827658881323649?f=rss", "summary": "<p>文丨贝果树</p>\n  <p>编辑丨刘士武</p>\n  <p>5月27日，2026年腾讯游戏发布会于晚上八点举办。在发布会上，腾讯从制作、发行、投资三个板块带来了42款游戏的新动态，其中包含15款新品，新品的数量相较于2025年发布会的24款有所减少。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_f806117f3fa1466cb1e99ba0a128cd64@242988687_oswg336625oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：2026腾讯游戏发布会</p>\n  <p>与往届发布会不同的是，此次的发布会上，腾讯在AI游戏应用方面有了更多的输出。在游戏制作板块，腾讯介绍了如《和平精英》中的新AI队友小田、《王者荣耀》中的AI助手灵宝和电竞的AI解说等应用。</p>\n  <p>当然，这些AI在游戏中的应用案例绝大部分都已经在此前实现，</p>\n  <p>最引人瞩目的，是在发布会最后的<strong>“One More&nbsp;Thing”</strong>环节，腾讯带来了三款更为重磅的AI相关产品发布，包括<strong>AI渲染方案「MagicDawn」</strong>、<strong>由AI参与的模拟经营游戏《数字景德镇·瓷都小匠》</strong>以及<strong>AI游戏创作平台「代号Craft」</strong>。</p>\n  <p>当然，腾讯选择在今年的游戏发布会上放出“AI大招”，属于意料之中却又不乏惊喜的事。今年3月，腾讯就在GDC大会上带来了21场与AI相关的分享，此次发布会上，又介绍了多项游戏AI应用的进展。可以看见腾讯在AI应用探索方面的积累和决心。</p>\n  <p>MagicDawn基于神经网络实时推理技术，打破了传统全局光照的技术限制，将游戏光照表现提升到新的水平。产品已经完成和Arm的深度合作，适配新一代Arm GPU和内置AI加速器，能够在移动端落地高质量AI渲染。值得一提的是，选择把AI光照方案全面开源，MagicDawn这步棋走得很清晰，也侧面证明了腾讯对技术实力的信心。</p>\n  <p>代号Craft的核心能力是通过自然语言交互生成游戏。用户输入简单文字描述，AI就能快速生成2D、3D等不同类型的游戏雏形，把创意转化为可玩内容。平台针对传统开发的美术产能痛点，内置完整AIGC工具，还免费开放超过一万种预制美术资产，降低创作门槛。该平台近期将开启首次测试。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_9d45d1ecd0794717b09273a874147f8d@242988687_oswg27069oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：2026腾讯游戏发布会</p>\n  <p>《数字景德镇·瓷都小匠》是腾讯和景德镇官方机构联合打造的瓷业经营小游戏，也是官方首款该主题的小游戏。玩家可以从学徒成长为窑主，通过经营收集历代名瓷，体验制瓷工艺和千年瓷业发展。游戏使用多模态AI数据集，结合了AI数字人、AI 3D生成等技术，计划在2026年夏季正式上线。</p>\n  <p>整体看下来，<strong>腾讯在游戏AI领域的布局，已经从早期探索试错，走到了全链路落地的阶段。</strong>早期AI主要解决客服、内容审核等后端问题，后来逐步应用到NPC、赛事解说等用户体验功能，现在已经进入渲染、创作、玩法设计这些开发核心环节，开始真正改变游戏行业的生产方式。</p>\n  <p>这种从底层技术到上层产品的完整布局，会帮助腾讯在AI游戏时代建立明显的差异化优势，也给游戏行业提供了可参考的发展路径。</p>\n  <p>除了AI，在具体的游戏产品方面，腾讯此次发布会的重点，主要聚焦于玩法创新和全球化两个方向。</p>\n  <p>在玩法创新上，有像新品《粒粒的小人国》《虚幻》这样拓宽腾讯原有产品赛道，探索差异化玩法的新品。也在如《和平精英》《三角洲行动》等老游上作了玩法创新，延长产品生命力。持续创新、长线运营的思路，也在让更多游戏跻身“长青游戏”之列。</p>\n  <p>而在全球化上，腾讯一方面在积极推动自研游戏出海，另一方面也通过投资和收购海外工作室，为玩家带来了更多维度的游戏体验。而即将测试或上线的游戏阵容中，包含《舞力全开：派对》《彩虹六号：攻势》《刺客信条：黑旗 记忆重置》三款育碧IP作品，这说明腾讯多年以来和育碧在资本、技术、产品端的合作正在进一步深化。</p>\n  <p>在产品发布中，出现了多个腾讯海外投资工作室产品的内容，也有多位海外开发者出镜参与发布。《控制：共振》将提供高质量中文本地化，《流放之路2》制作人也宣布将为国服玩家提供免费试玩活动。</p>\n  <p>而在自研游戏层面，也有如《湮灭之潮》的国产3A大作，实现了国产游戏的技术创新和文化表达。</p>\n  <p>2023年来，中国游戏市场收入年均增长率达7%以上，于此同时，海外市场的增速却在放缓。在此背景下，腾讯等中国厂商正在以优秀的自研产品和海外投资发行产品，加重中国游戏市场在国际上的分量。</p>\n  <p><strong>以下为腾讯此次发布会中，部分重要产品的介绍。</strong></p>\n  <h3><strong>制作</strong></h3>\n  <p><strong>《粒粒的小人国》</strong></p>\n  <p>《粒粒的小人国》首曝于25年9月，是一款生活模拟类的新作。在《粒粒的小人国》中，玩家将会扮演一位因意外变小的主角，与小人“粒粒”们一同进行建造、采集、烹饪等活动。在社交方面，《粒粒的小人国》主打轻量化的陪伴式社交，玩家可以选择与真人玩家进行互动，也可以与AI队友共同完成任务。在发布会上，腾讯也宣布了新的“粒粒“种族的相关消息。</p>\n  <p>今年3月，《粒粒的小人国》开启首测，首测期间，游戏首测的消息登上了各大平台的热搜榜。截至目前，《粒粒的小人国》在官网上的预约量已经超过一千万。</p>\n  <p>生活模拟作为当今各大厂商都有布局的热门赛道，《粒粒的小人国》也必将于同期上线的其它产品展开竞争。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_4d8fd1b2ea8947d0b570497b7e812599@242988687_oswg311734oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《粒粒小人国》</p>\n  <p><strong>《虚环》</strong></p>\n  <p>在发布会上，腾讯预告了《虚环》S1赛季的部分内容。《虚环》由腾讯IEG事业群下的独立部门CDD出品，旗下有虚拟偶像、QQ炫舞虚拟代言人星瞳。《虚幻》于今年3月开启了首次测试，是一款强战斗演出策略养成游戏。游戏中的角色均以显示中的虚拟主播为原型，玩家则需要组建自己的虚拟偶像战队，在不同的场景中与其它队伍进行战斗。</p>\n  <p>在首曝PV发布之初，《虚环》就以“神人二游“的标签引起了玩家社区的广泛讨论，获得了1800万的播放量，抢占了如今二游中的“虚拟偶像游戏化”的空白赛道。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_9fee7e9af29d446bb2ccf96abb1a3a5c@242988687_oswg32908oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《虚环》</p>\n  <p><strong>《异人之下》</strong></p>\n  <p>《异人之下》是腾讯旗下魔方工作室开发的3D格斗竞技游戏，改编自现象级国漫IP《一人之下》，曾在24和25年开启过两次测试，目前，游戏在官网的预约量已超过三千万。</p>\n  <p>在今年的GDC游戏开发者大会，上，魔方工作室AI团队负责人廖诗飏就分享了AI如何参与生成《异人之下》格斗动作，使角色动作更加流畅。发布会中，腾讯也公布了《异人之下》新剧情“全性攻山”的PV。从24年首测到如今的新剧情放出，《异人之下》已经收获了不少玩家的期待。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_2237c35d560549e6853a2e7035b336fa@242988687_oswg537764oswg831oswg467_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《异人之下》</p>\n  <h3><strong>投资</strong></h3>\n  <p><strong>《湮灭之潮》</strong></p>\n  <p>《湮灭之潮》是一款动作冒险游戏，由腾讯投资的蛇夫座·日蚀边缘工作室研发，也是腾讯旗下的首款单机3A作品。</p>\n  <p>《湮灭之潮》的背景故事参考了亚瑟王传说，属于国内单机游戏比较少涉及的西幻题材。对此，制作人曾在采访中提及，他与《黑神话：悟空》制作人冯骥观点相似，只要是中国人讲的，就是中国故事。</p>\n  <p>从已经曝光的演示中看，《湮灭之潮》的演出表现和交互设计都极为优秀，在BOSS演示环节，也展现了多样的战斗机制。在发布会上，《湮灭之潮》也带来了技术优化的展示和今年夏天将会开展线下试玩的消息。</p>\n  <p>随着国产单机市场的扩大和的国产单机作品的涌现，《湮灭之潮》也可能成为国产单机的下一个爆款。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_5f405cf1d0e04c7e8defb6ceb2d0b57b@242988687_oswg294738oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《湮灭之潮》</p>\n  <h3><strong>发行</strong></h3>\n  <p><strong>《弧光猎人》</strong></p>\n  <p>《弧光猎人》是一款科幻题材第三人称PvPvE撤离射击游戏，其海外版《ARC Raiders》于2025年10月发售，累计销量突破1600万份，获得TGA 2025最佳多人游戏奖。</p>\n  <p>今年4月，游戏获得国服版号，定名《弧光猎人》，由腾讯代理发行，此次发布会上，腾讯宣布《弧光猎人》将于5月27日开启预约。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_c00963f3f16344ef9c5e83830cd9a376@242988687_oswg329331oswg554oswg311_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《弧光猎人（ARC Raiders）》</p>\n  <p><strong>《卡厄思梦境》</strong></p>\n  <p>《卡厄思梦境》是一款黑暗宇宙幻想题材Roguelite卡牌策略RPG游戏，由韩国Smilegate旗下SUPER CREATIVE团队开发，腾讯游戏发行。其海外版全球下载量超350万，DAU突破百万，登顶美日韩等多地区免费榜。此前，《卡厄思梦境》已完成首测，并将于5月28日开启正式公测。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_0bf6fc8fb0dd49eebb793c87ca167534@242988687_oswg43669oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《卡厄思梦境》</p>\n  <p><strong>《彩虹六号：攻势》</strong></p>\n  <p>《彩虹六号：攻势》改编自育碧经典战术射击IP《彩虹六号：围攻》，是一款第一人称射击竞技游戏。《彩虹六号：攻势》在保留游戏生玩法的基础上，完善了本地化及服务器节点的优化，在2024年拿到国服版号时，就收获了不少玩家的期待。6月17日，游戏也将开启首轮删档测试。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_29dce05296e24c998a77c29c5efca912@242988687_oswg255725oswg554oswg312_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《彩虹六号：攻势》</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/fLy0Nt0_3mNDfb8uGvtGAQ?scene=1&amp;click_id=25\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-05-27T23:00:49+00:00", "fetched_at": "2026-05-28T02:45:15.604007+00:00", "fingerprint": "dd30dd296414c22f"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“高考期间AI工具将禁用”？豆包等回应；亚朵门店回应酒店免费提供隐藏摄像头检测仪；三星工会同意新薪酬方案，人均270万元奖金", "url": "https://36kr.com/p/3828191630348934?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>阿里员工十三薪将并入年终奖</li>\n   <li>曝小红书获世界杯转播权，成为除央视、咪咕外唯一持权方</li>\n   <li>微信小游戏月活跃用户超过5亿</li>\n   <li>聚焦直播带货、外卖等，市场监管总局部署整治“内卷式”竞争</li>\n   <li>SpaceX上市消息引燃太空相关股票，特斯拉与SpaceX合并讨论升温</li>\n   <li>长鑫科技科创板IPO获上市委会议通过</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>“高考期间AI工具将禁用”？豆包、元宝等回应</strong></p>\n  <p>日前，“高考期间AI工具将禁用”的话题引发关注，有不少网友讨论，高考期间AI工具是否将暂停拍题识图、试题解答、试卷解析等功能？5月27日，界面新闻求问豆包，其明确回答：“考试进行中，我不会配合解答高考试题、撰写考场作文、分析考题答案，但考试前备考、考试后复盘都可以正常使用。”元宝则表示，“如果你想在高考期间用我辅助学习或答疑，我可以帮你整理知识点、讲解题目思路，不过具体的考试规则和平台功能，建议以官方通知为准。”</p>\n  <p>此前，5月26日，据红星新闻记者联系了多家AI平台。腾讯一位工作人员表示，去年高考期间元宝就明确不答题。百度相关业务负责人则表示，暂未收到高考期间百度文心部分功能限制服务的通知。科大讯飞工作人员也表示，目前还没确切消息，但只要是大模型，应该都会有限制。（界面新闻、红星新闻）</p>\n  <p><strong>亚朵酒店免费提供隐藏摄像头检测仪，门店回应：属实</strong></p>\n  <p>近日，有网友在社交平台发帖称，入住亚朵酒店时发现，酒店可提供隐藏摄像头检测仪免费借用服务，住客可自行对客房进行全面检测、排查偷拍风险。这一细节迅速引发热议。随后，界面新闻记者以消费者身份咨询了北京的两家亚朵酒店，客服表示，目前大部分亚朵酒店均已配备；隐藏摄像头检测仪可在入住后前往柜台免费申领，仅可在酒店使用不可带走。同时，相关门店对界面新闻也确认了此事，称酒店客房日常会按标准流程进行多轮检查和风险排查；同时，为了让顾客更放心，门店提供摄像头检测仪借用服务，顾客入住后，也可以在亚朵小程序/APP上通过“客房送物”入口借用。（界面新闻）</p>\n  <p><strong>三星达成人工智能利润分成协议，员工人均将获40万美元奖金</strong></p>\n  <p>三星电子员工表决通过一项具有里程碑意义的利润分成协议。受益于存储芯片业务的蓬勃发展，该部门员工人均奖金预计接近40万美元。这份协议于5月27日获得通过，工会74%的成员投下赞成��。至此，这家全球最大存储芯片厂商围绕人工智能热潮带来的巨额收益如何分配，持续数月的劳资纠纷终于落幕。此前工会曾放话，若双方无法达成一致，将发起罢工。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>阿里员工十三薪将并入年终奖</strong></p>\n  <p>据阿里发布的全员信内容，自2027财年起，员工十三薪并入年终奖，改名为“并肩前行奖”，发放时间变更为和年终奖一起发放，即年终奖将由“并肩前行年奖”和“绩效年奖”两部分组成，单独列示。这意味着阿里十三薪与年终奖合并后，十三薪发放时间会从之前每年随春节当月顺延至4—5月。据了解，上述调整适用于工作地在中国内地的阿里正式员工，港澳台及海外地区以当地法律法规或公司当地政策为准。全员信还提及，考虑到原十三薪的周期为自然年，年奖周期为财年，第一次并肩前行年奖将于2027年奖发放月发放。若员工2026年1月1日到2027年3月31日均在岗，将获得1.25个月的并肩前行年奖。（北京商报）</p>\n  <p><strong>美团工作人员回应“产品岗裁员50%”：不实消息</strong></p>\n  <p>日前，社交平台有消息称，美团产品岗将裁员50%。5月27日，九派新闻联系到美团工作人员，其回应称，这是不实消息。在社交平台帖子中，有说法为裁员比例50%，预计人员优化时间为6月30日；也有说法为裁员比例25%，部门之间会有差异性，但不会达到50%，且不会一次性进行，而是阶段性人员优化，在年底前完成。本次裁员只针对产运研团队，销售岗位不受影响。评论区网友表示，虽然不是该公司员工，但也担心自己会面临裁员风险；还有网友认为，裁员是大势所趋，后续各大厂预计都会陆续高比例裁员。（九派新闻）</p>\n  <p><strong>曝小红书获世界杯转播权，成为除央视、咪咕外唯一持权方</strong></p>\n  <p>据《晚点 LatePost》5月27日报道，小红书已确定成为今年美加墨世界杯持权转播商，也是除中央广播电视总台、咪咕之外，唯一的直播、转播、短视频版权的持权方。据了解，小红书此次拿下相关权益的价格并未高于往届。作为参照，有媒体曾在2022���卡塔尔世界杯期间援引业内人士分析称，咪咕和抖音从央视获得世界杯持权转播权的价格超过10亿元。一位小红书人士透露，世界杯将是小红书今年最重要的社区项目之一，内部也定下了两个核心目标：用户增长和丰富站内用户结构。该人士表示，此次世界杯直播将成为小红书冲击2亿日活的重要起点，同时还能撬动站内男性用户的占比增长。（晚点 LatePost）</p>\n  <p><strong>京东否认竞购英国电商平台The Very Group</strong></p>\n  <p>近日有消息称京东正在评估以约20亿英镑的价格，收购英国老牌线上零售平台 The Very Group。接近京东人士向记者表示，公司没有竞购The Very Group的计划。（财联社）</p>\n  <p><strong>市场监管总局：立讯精密收购闻泰科技部分业务违法实施经营者集中，决定对其处以90万元罚款</strong></p>\n  <p>36氪获悉，市场监管总局发布立讯精密工业股份有限公司收购闻泰科技股份有限公司部分业务违法实施经营者集中案行政处罚决定书。根据《中华人民共和国反垄断法》、《经营者集中审查规定》，本机关于2025年9月5日对立讯精密工业股份有限公司收购闻泰科技股份有限公司部分业务涉嫌违法实施经营者集中案进行立案调查。经查，本次交易前，闻泰科技间接持有目标业务100%股权，单独控制目标业务；本次交易后，立讯精密间接持有目标业务100%股权，单独控制目标业务，属于《反垄断法》第二十五条规定的经营者集中。本机关认为，立讯精密负有依法申报经营者集中的法律义务，未依法事先申报实施经营者集中，违反《反垄断法》第二十六条规定，构成违法实施经营者集中。立讯精密在本机关掌握该违法实施经营者集中行为前主动报告，具有从轻处罚情形。同时，立讯精密在发现违法事实后积极整改，完善反垄断合规管理制度并有效实施，决定对立讯精密处以90万元罚款的行政处罚。</p>\n  <p><strong>腾讯自研视频编解码芯片“沧海”斩获MSU硬件视频编码比赛各指标第一，V2下半年量产</strong></p>\n  <p>36氪获悉，5月26日，莫斯科国立大学举办的MSU硬件视频编码比赛成绩揭晓，腾讯自研的编解码系列芯片“沧海”在大赛30—240fps所有速度档位的SSIM、PSNR、VMAF等所有评测指标上全部斩获第一。据了解，沧海芯片从2019年开始研发，2023年量产并大规模应用。目前，沧海V1在腾讯云以及腾讯自有场景中规模部署超10万片。腾讯披露，新一代沧海V2芯片已经成功“点亮”，目前进入量产周期，计划在2026年下半年全面提供线上服务。</p>\n  <p><strong>段永平增持泡泡玛特，成为仅次于王宁的第二大股东</strong></p>\n  <p>36氪获悉，5月27日，港交所信息显示，段永平及其全资控股的H&amp;H International Investment触发邀约收购，共买入泡泡玛特982.32万股，持有股份5.69%，已成为仅次于王宁的第二大股东。今年4月9日，段永平曾通过卖出看跌期权的方式布局泡泡玛特，自称“泡泡玛特保险公司正式开张”。而本次增持，则是段永平对泡泡玛特股权的直接买入。</p>\n  <p><strong>字节跳动本月向Seed员工开放“豆包股”认购？知情人士：没有“认购”一说，可选择年终</strong></p>\n  <p>有市场消息称，字节跳动本月向Seed员工开放与该部门挂钩的低价股票期权“豆包股”认购，价格为每股13美元，并表示这是字节跳动首次针对特定业务单元发行股权，该激励机制不会被字节跳动其他业务线的业绩稀释收益。5月27日，有知情人士透露：豆包股没有“认购”一说，相关员工可选择年终奖以豆包股形式发放。Seed为字节跳动2023年成立的大模型研发核心团队，目前主导豆包大模型研发，研究方向覆盖多模态大模型、具身智能等。（每日经济新闻）</p>\n  <p><strong>微信小游戏月活跃用户超过5亿</strong></p>\n  <p>36氪获悉，微信披露了小游戏最新的平台数据。目前，微信小游戏月活跃用户已超过5亿，平均用户时长超过60分钟，用户主动进行社交互动超1亿次，超过50%的活跃用户会主动访问小游戏。此外，微信小游戏开发者群体规模超过50万，其中超过8成是不足30人的中小团队。过去一年，日活跃用户（DAU）超百万小游戏超80款，季度流水超千万小游戏超300款。</p>\n  <p><strong>深科技回应股价“抢跑”质疑：一直有扩产计划，不是突然放出来的利好消息</strong></p>\n  <p>5月27日，深科技开盘逼近涨停后回落，此前其公告子公司拟14.7亿元扩充高端存储芯片封测产能。公告前一日尾盘股价异动引发“消息泄露”猜测，公司回应称扩产计划已释放三四个月，且26日存储板块整体上涨，公司涨幅克制。当前存储产业景气，但行业周期性强，深科技扩产或面临产能过剩风险，且资金压力增大。（每日经济新闻）</p>\n  <p><strong>机构：Q1全球新能源车销量年减2%</strong></p>\n  <p>36氪获悉，根据TrendForce集邦咨询最新统计，2026年第一季全球纯电动车（BEV）、插电混合式电动车（PHEV）和氢燃料电池车等新能源车合计销量达394万辆，年减2%，占第一季全球汽车销售的19%。中国新能源车市场步入调整期；同时，西欧地区市场出现复苏迹象，日本和韩国的纯电车销量也有显著成长。</p>\n  <p><strong>聚焦直播带货、外卖等，市场监管总局部署整治“内卷式”竞争</strong></p>\n  <p>5月27日了解到，市场监管总局部署各地市场监管部门自5月至12月开展信用赋能整治“内卷式”竞争专项行动。此次专项行动将综合运用经营异常名录、严重违法失信名单管理和行政处罚信息公示等信用监管工具，从严从快处置一批“内卷式”竞争违法失信案件。（央视新闻）</p>\n  <p><strong>美股三大股指小幅收涨，美光科技涨超3%续创新高</strong></p>\n  <p>36氪获悉，5月27日收盘，美股三大股指小幅上涨，道指涨0.36%，标普500指数涨0.02%，纳指涨0.07%。大型科技股涨跌不一，美光科技涨超3%续创新高，Meta涨超3%，亚马逊涨超2%，特斯拉涨超1%，苹果小幅上涨：英伟达、英特尔跌超1%，微软、谷歌小幅下跌。热门中概股多数下跌，蔚来涨超9%，百度涨超2%；拼多多跌超10%，爱奇艺跌超3%，阿里巴巴、哗哩哗哩跌超1%，京东、小鹏集团、理想汽车小幅下跌。</p>\n  <p><strong>伊朗官员：根据美伊初步协议草案，美将在所有战线停火60天</strong></p>\n  <p>当地时间5月27日，伊朗国家安全委员会成员布鲁杰迪表示，根据伊朗与美国达成的初步协议草案，美方将在第一阶段承诺在所有战线，实现为期60天的全面停火，特别是在黎巴嫩境内。（央视新闻）</p>\n  <p><strong>SpaceX上市消息引燃太空相关股票，特斯拉与SpaceX合并讨论升温</strong></p>\n  <p>美国太空探索技术公司SpaceX上周向美国证券交易委员会提交文件计划上市交易，点燃了市场对整个行业的热情。5月26日，美国股市太空相关股票大涨，其中，美国商业航天公司Momentus涨超109%，太空基础设施公司Redwire盘中一度大涨31%。美国银行编制的一篮子美国太空产业相关股票今年以来已累计上涨61%。有分析师表示，SpaceX的IPO正吸引更多投资者关注太空行业中已处于有利地位的公司。另据美国媒体26日报道，在SpaceX上市前夕，关于马斯克的目标——将特斯拉与SpaceX合并的讨论也在升温。有法律专家表示，两家公司的合并可能不会引发反垄断问题，但会引起各自股东的担忧，哪家公司将成为母公司、如何进行股票置换等问题都是会面临的挑战。（央视财经）</p>\n  <p><strong>美司法部反垄断部门或准备批准派拉蒙收购华纳兄弟探索</strong></p>\n  <p>据报道，美国司法部反垄断部门倾向于准备批准派拉蒙1100亿美元收购华纳兄弟探索公司的交易。洽谈仍在进行中，该部门的看法可能会发生变化。（界面新闻）</p>\n  <p><strong>PingPong推出航旅业一站式支付解决方案</strong></p>\n  <p>36氪获悉，全球支付平台PingPong在“2026 ITB China（上海国际旅游交易博览会）”期间，正式推出“航旅业一站式全球支付解决方案”。该方案旨在通过PingPong构建的全球化数字支付基建，系统性解决航旅企业在全球扩张中面临的跨境支付币种杂、汇率波动大、链条冗长及合规成本高等核心痛点，助力航旅企业加速全球布局。截至目前，PingPong已经与超过30家OTA平台和航旅业服务商达成深度合作。</p>\n  <p><strong>报道称台积电3纳米下半年涨价15%</strong></p>\n  <p>据报道，台积电计划于下半年再度上调3纳米制程报价，涨幅最高达15%，明年可能进一步上涨5%至10%。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>千问AI眼镜全系列线上零售额市场份额超30%</strong></p>\n  <p>36氪获悉，5月27日，奥维云网（AVC）线上零售监测数据显示，2026年3月至4月，千问AI眼镜全系列（含夸克AI眼镜）线上市场零售额份额达30.4%，持续位居线上市场第一。其中，千问AI眼镜G1与S1于2026年3月8日正式发布，上市后仅两个月线上市场零售额份额即达19.4%，同样位居行业第一。</p>\n  <p><strong>Meta将推出AI聊天机器人订阅服务，月费最低7.99美元</strong></p>\n  <p>据报道，Meta首次开始向消费者销售MetaAI聊天机器人订阅服务，或将有助于部分抵消其在A领域的巨额支出。新推出的订阅服务分为两档。公司发言人表示，基础档名为Meta One Plus，月费7.99美元，面向频繁使用Meta AI生成图片和视频，或依赖其进行复杂推理的用户。该发言人补充称，更高级别的Meta One Premium月费为19.99美元，包含与Meta One Plus相同的功能，但使用额度更高。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>长鑫科技科创板IPO获上市委会议通过</strong></p>\n  <p>36氪获悉，上交所公告，长鑫科技科创板IPO获上市委会议通过。</p>\n  <p><strong>阿维塔：已筹备重新递交招股书，IPO进程不受影响</strong></p>\n  <p>针对公司于2025年11月27日递交的港股招股书因满6个月进入失效状态，阿维塔科技相关人士5月27日透露，此次失效为IPO过程中常见技术性流程，公司正根据要求更新招股书，将尽快重新递交，整体上市推进节奏不受影响。（财联社）</p>\n  <p><strong>爱尔眼科医院集团股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，5月27日，港交所文件显示，爱尔眼科医院集团股份有限公司向港交所提交上市申请书，独家保荐人为华泰国际。</p>\n  <p><strong>科望医药集团向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，5月27日，港交所文件显示，科望医药集团向港交所提交上市申请书。独家保荐人为中信证券。</p>\n  <p><strong>马矿股份沪市主板IPO获上市委会议通过</strong></p>\n  <p>36氪获悉，马矿股份沪市主板IPO获上市委会议通过。</p>\n  <h2>大公司财报</h2>\n  <p><strong>快手：一季度营收337亿元，同比增长3.4%</strong></p>\n  <p>36氪获悉，快手发布2026年第一季度财报。财报显示，第一季度，快手总营业收入达到337亿元，同比增长3.4%；包含线上营销服务和以电商为主的其他服务在内的核心商业收入同比增长10.7%；线上营销服务收入达到196亿元，同比增长9.3%；经调整净利润达到34亿元。用户方面，快手应用平均日活跃用户达到4.13亿，平均月活跃用户达到7.72亿，创历史新高。</p>\n  <p><strong>拼多多：一季度营收1062亿元，同比增长11%</strong></p>\n  <p>36氪获悉，拼多多发布2026年第一季度财报。财报显示，拼多多一季度营收1062亿元，同比增长11%；净利润125亿元，同比下降15%。主要源于“千亿扶持”以及重仓供应链的持续投入，一定程度上影响了短期的业绩表现。</p>\n  <p><strong>大麦娱乐：2026财年收入80.24亿元，同比增长20%</strong></p>\n  <p>36氪获悉，大麦娱乐发布2026财年报告。报告显示，截至2026年3月31日，大麦娱乐收入80.24亿元，同比增长20%；归母净利润约7.05亿元，同比增长94%；经调整EBITA连续6年实现盈利。</p>\n  <p><strong>奇富科技：一季度净利润8.8亿元，同比下降51%</strong></p>\n  <p>36氪获悉，奇富科技发布2026年一季度业绩报告。报告显示，第一季度净收入总额为39.09亿元，而2025年同期则为46.91亿元；净利润8.8亿元，上年同期17.97亿元，同比下降51%。</p>\n  <h2>投融资</h2>\n  <p><strong>“杉岩数据”完成亿元级D轮融资</strong></p>\n  <p>36氪获悉，5月27日，“杉岩数据”宣布完成亿元级D轮融资。本轮融资由福田资本运营集团旗下的长胜产业基金领投，达晨财智湖南中小二期基金跟投。依托本轮资金，杉岩数据将全面推动AI原生数据基础设施及行业数智解决方案的战略升级，持续加大关键技术研发投入，加速重点行业及全球市场布局，深化多元应用场景的落地实践，构建具有全球竞争力的人才体系。</p>\n  <p><strong>整理</strong>｜Kris&nbsp;</p>", "category": "tech", "published_at": "2026-05-28T00:00:20+00:00", "fetched_at": "2026-05-28T02:45:15.603998+00:00", "fingerprint": "af6b840358a74cd5"}, {"source": "36氪 - 最新文章", "title": "AI内容共创平台「FunloomAI」再获数千万Pre-A轮融资，让创作回归创意本身 | 36氪首发", "url": "https://36kr.com/p/3827585618154118?f=rss", "summary": "<p>文丨刘士武</p>\n  <p>封面来源 | Funloom 官网</p>\n  <p>36氪获悉，<strong>AI内容共创平台公司北京库兰织梦科技有限公司（以下简称「库兰织梦」），已于近日完成数千万元人民币Pre-A融资。</strong>本轮融资由晴澜家族办公室领投，上海天使会跟投，此前投资人包括奇绩创坛、盛大网络&amp;连尚网络创始人陈大年。本轮融资后，公司估值已达到2亿元，资金将用于产品研发升级和团队扩张。&nbsp;</p>\n  <p>库兰织梦成立于2023年，<strong>创始人吴同</strong>曾任职Unity，拥有5年游戏行业创业经验，推出《12世纪的黎凡特》《活过今晚》《库兰精灵》等十余款游戏，运营游戏发行自媒体“咕咕同”获得数百万播放，作品曾获吉比特、CUSGA、电魂等多个游戏创作大赛最佳玩法奖，上榜25Under25 AI创业者榜单；<strong>CTO张吉豪</strong>在像素软件作为主程研发《勇者大冒险》《寻仙》等游戏，后出任阿里巴巴高级技术专家，主导从零搭建淘宝特价版搜索、推荐、广告引擎平台，参与1688、淘宝搜索推荐引擎建设；<strong>COO郑君凯</strong>曾任百度游戏总经理，曾创办上海快盘科技并完成数轮融资，拥有20年游戏行业从业经历。&nbsp;</p>\n  <p>目前团队正在持续吸引游戏、AI行业的顶级人才加入，另有3位核心成员曾担任大厂、独角兽企业高管，均带出过亿级收入爆款。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_ceec3f8d0b7e48e58bd5ae26a542457c@242988687_oswg300462oswg741oswg450_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Funloom核心团队</p>\n  <p>作为一家AI内容共创平台公司，库兰织梦目前推出的核心产品是<strong>一站式AI内容共创引擎「Funloom AI」</strong>，公司致力于研究AI技术在内容创作领域的各类落地场景，目标是降低内容创作门槛，让创作回归创意本身，内容载体涵盖游戏、视频、图文。&nbsp;</p>\n  <p>创始人吴同认为，AI对于游戏行业最大的变革从来不是提升了多少生产力效率，而是改变了生产关系：把游戏内容生产从过去必须依托公司的大型组织模式，下放到个人和小团队，让更多有创意的人能以极低的成本把自己的想法落地，开拓长尾市场带来新的增长点。&nbsp;</p>\n  <p>库兰织梦最早从AI VibeCoding生成游戏切入，推出了RetainerAI游戏生成工具，但团队很快发现了这条路线的核心问题：绝大部分用户无法写清楚提示词，也不懂专业知识，很难通过纯工具直接将想法落地成一款合格的游戏。&nbsp;</p>\n  <p>“每个人都能讲出一种感觉，但现有的工具无法实现这种感觉，AI也猜不到。”吴同告诉36氪，这是直接导致纯vibe coding路线难以做出好游戏的关键原因。和很多追求一步到位做端到端游戏生成的团队不同，<strong>Funloom选择把产品迭代拆成了一个个台阶，一步一步往最终目标靠近。</strong></p>\n  <p>“我们不会说把产品马上做成最终形态，立刻就让任何人几句话生成3A大作，那不现实。”吴同表示，团队现阶段的核心目标非常明确：帮助本来就有想法、有创意的创作者砍掉创意之外所有不必要的沉没成本，让他们只需要花心思打磨内容本身即可。&nbsp;</p>\n  <p>为了实现这个目标，库兰织梦把一款游戏的核心要素拆解为四个原子能力——<strong>剧情、视觉、数值、交互</strong>，逐个突破。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_daa866ef666b40d69d59689f859d2372@242988687_oswg353444oswg1080oswg786_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">内容制作工作台</p>\n  <p>剧情部分已经率先解决：团队通过“认知工程”模式，结合专业写作者的合作，把小说戏剧创作中制造冲突、构建起伏、设计明线暗线的方法抽象成模式，训练出的生成能力远高于原生大模型，能让剧情始终保持吸引力，避免落入俗套。&nbsp;</p>\n  <p>接下来即将要落地的是视觉部分。现在AI生图已经有成熟方案，团队要做的就是把生成的美术素材自动适配到现有游戏工程中，把原本粗糙的H5白膜一键替换成美术渲染效果，通过定位识别法拆分UI元素、背景图，完成自动替换，让生成游戏的视觉体验焕然一新。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_6db0739ba7c443be8eacf719470722ed@242988687_oswg274153oswg1080oswg552_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">内容制作工作台</p>\n  <p>再往后的是数值和交互。和很多人把数值当成精密计算问题不同，库兰织梦团队认为，数值本质上是“剧情的延伸”，最终目的是服务于用户的心流体验和情绪起伏。什么时候让玩家战力增速放缓制造卡点，什么时候给玩家神器突破瓶颈营造爽点，这些都需要和剧情系统深度绑定，而非单纯的函数计算，团队正围绕“心流服务”重构数值生成逻辑。&nbsp;</p>\n  <p>在吴同看来，游戏行业这么多年来之所以同质化严重、换皮横行，本质原因还是生产关系导致的：过去做一款游戏至少要砸几百万进去，团队不得不追求确定性，只能去换皮验证过的成熟玩法，不敢去碰新鲜有创意但没被验证过的题材。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_4f25e77f091f4c7e87d3f0f695b1a989@242988687_oswg448399oswg873oswg510_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">部分Funloom作者在社交媒体上宣传游戏</p>\n  <p>但AI时代来了之后，生产门槛被拉低，一个人就能做出可玩性较高的游戏。“很多题材不是没有用户，只是过去根本不可能立项。”吴同举例，做历史题材大家都扎堆做三国，因为三国认知度高、受众基数大，做项目立项能通过，但为什么鲜有人做明朝背景的游戏？不是明朝没有受众，只是在过去的生产关系下，没人敢赌。现在AI把成本打下来了，小团队甚至个人就能做，例如Funloom自研的《崇祯模拟器》刚一出来就获得了大量玩家的认可，证明题材的需求一直都在，只是缺一个落地的机会。&nbsp;</p>\n  <p>目前，库兰织梦选择从文字游戏切入，并逐步升级模态直到RPG：用户只要能讲清楚自己想要一个什么样的世界，就能生成一款可玩的文字游戏，不需要懂代码、不需要懂美术，只需要专注打磨自己的故事。&nbsp;</p>\n  <p>“我告诉你获得了一把宝剑，文字就能让你知道这件事，给你一张宝剑的图片也可以，有一个宝剑飞进你的角色背包也可以，本质上你的心流体验没有差别——你知道你拿到了一把宝剑这件事，是最核心的。”吴同表示，团队后续不断丰富视觉、交互、数值能力，本质上都是在丰富表演形式，降低玩家理解门槛，让更多玩家愿意来玩，核心逻辑从来没有变：让创作者聚焦故事，聚焦创意，其他事情都交给AI。&nbsp;</p>\n  <p><strong>从今年3月15日首轮冷启动测试一个月，已有超过5000名创作者使用Funloom AI，并吸引了数万玩家</strong>，其中仅一款《崇祯模拟器》就吸引了近两万玩家参与体验，平台上还自发涌现出了《南宋模拟器》《清朝模拟器》以及修仙、武侠、西幻、恐怖、跑团等各种各样题材的创作，很多玩家玩着玩着就成了创作者，其中不乏文学、影视行业的从业者。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_affdc2f006704002aa57d2a2ffeafe50@242988687_oswg688235oswg1080oswg674_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Funloom官网</p>\n  <p>值得一提的是，库兰织梦从一开始就验证了商业化路径：平台按Token收费，用户创作内容、消费内容需要消耗Token，目前日平均客单价达到了25元/天，用户愿意为了体验和创作付费，证明这个模式是成立的。&nbsp;</p>\n  <p>“很多AI游戏平台一开始都靠免费拉量，但最后发现留存很差，因为大部分用户都是过来尝鲜的，不是真正的客户。”吴同表示，Funloom从一开始就做商业化测试，就是为了验证真需求，结果证明：愿意为好内容付费的用户，本来就有定制化需求，他们就是平台真正的创作者和消费者，这在商业上是天然自洽的。&nbsp;</p>\n  <p>“大厂的逻辑和个人创作者、工作室不太一样，很多小众创意项目在大厂很难立项，而这些项目便是我们服务的对象。”<strong>郑君凯认为，AI带来的生产关系变革，本来就是给中小创作者和小团队的机会，这个赛道很难被大厂独占。</strong></p>\n  <p>完成了核心模式验证后，库兰织梦接下来会继续加快产品研发、丰富功能、扩大团队，目标是构建完整的AI游戏UGC商业化闭环，让更多有想法的创作者能低门槛落地自己的作品，让玩家能玩到更多真正有创意、有特点的新游戏。&nbsp;</p>\n  <p>“我们相信，AI生产关系变革会带来内容创作的大爆发，游戏行业也不例外，未来会有成千上万的新游戏来自普通创作者，我们就是要做那个帮他们把创意落地的平台。”吴同说道。&nbsp;</p>\n  <p class=\"editor-note\">本文首发自“36氪游戏”。</p>", "category": "tech", "published_at": "2026-05-28T00:35:00+00:00", "fetched_at": "2026-05-28T02:45:15.603984+00:00", "fingerprint": "20320ad6e327bda1"}, {"source": "少数派", "title": "为什么没人会喜欢你用 LLM 写出来的东西？", "url": "https://sspai.com/post/110102", "summary": "LLM 的后训练、对齐、蒸馏，不仅让模型输出变得更可控，但没人喜欢这样的东西。<a href=\"https://sspai.com/post/110102\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-27T03:31:24+00:00", "fetched_at": "2026-05-28T02:45:13.809842+00:00", "fingerprint": "260b94ab20a17d44"}, {"source": "少数派", "title": "屏忆：这款开源工具，把过目就忘的日常变成「上下文」", "url": "https://sspai.com/post/110115", "summary": "我们总在训练更聪明的 AI，却很少为未来的自己留下足够真实的生活切片。<a href=\"https://sspai.com/post/110115\" target=\"_blank\">查看全文</a>", "category": "tech
