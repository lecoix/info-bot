rt Pattinson's casting as James Bond made enough sense given his recent work with director Denis Villeneuve, who's making the franchise's next film over at Amazon. But it turns out that Amazon founder Jeff Bezos played a significant role in making the final decision, too. During Semafor's Silicon Valley and the World conference today, Bezos [&#8230;]", "category": "tech", "published_at": "2026-11-17T22:38:41+00:00", "fetched_at": "2026-11-18T05:41:59.801336+00:00", "fingerprint": "3f70c47179d4906e"}, {"source": "The Verge", "title": "Satya Nadella says he’s AGI-pilled now", "url": "https://www.theverge.com/tech/1036111/satya-nadella-says-hes-agi-pilled-now", "summary": "Microsoft CEO Satya Nadella says he's AGI-pilled, at least when it comes to how AI might make startling changes to the structure of the economy and how politics might change because of it. \"I am AGI-pilled in the sense that at an economy level, what is the political economy's organization around AGI?\" he asked at [&#8230;]", "category": "tech", "published_at": "2026-11-17T23:41:18+00:00", "fetched_at": "2026-11-18T05:41:59.801325+00:00", "fingerprint": "d34ce25785fdf87b"}, {"source": "36氪 - 最新文章", "title": "好未来的「生死反转」：优化员工，买入智谱", "url": "https://36kr.com/p/4073822871147394?f=rss", "summary": "<p><strong>作者 |&nbsp;谢芸子</strong></p>\n  <p><strong>编辑 | 张帆</strong></p>\n  <p>想靠AI赚钱的教育公司，先被AI上了一课。</p>\n  <p>今年6月，粉笔创始人张小龙在人民大学的一场讲座上，大秀“炒科技股”的回报，并批评在场学生“除了混进体制内，没什么本事”。</p>\n  <p>风波以道歉和辞职收场。但他的确言行一致。上半年，粉笔的权益类投资从“几乎为零”飙到4.79亿元，包括2倍杠杆的美股半导体ETF。</p>\n  <p>反转来得很快。7月初，美股半导体板块暴跌，粉笔虽快速清仓，仍带来了830万美元的投资亏损。<strong>而张小龙更像是“跳了一次预言家”，预言的主角却是另一家教育公司——好未来。</strong></p>\n  <p>在10月29日发布的二季度财报中，好未来收入9.95亿美元，同比增长15.5%；经营利润2.36亿美元，同比大增145.4%；毛利率提升至59.8%。</p>\n  <p>进入2027财年后，好未来业绩不断走高。暖意之下，是两条容易被忽略的暗线。</p>\n  <p>一条在企业内部。多位好未来员工向36氪透露，今年4、5月份，公司迎来一轮“人员优化”，涉及前端开发、培优等多个部门，部分裁员比例在30%—50%。</p>\n  <p>另一条在账面上。<strong>好未来归母净利润为-4744万美元——拖累它的不是主业，而是一笔投资损益。这笔投资，正指向AI。</strong></p>\n  <p>“双减”五年来，整个教育行业都希望通过AI“逆天改命”。技术迭代究竟是通往未来的出路，还是从业者的绝路？好未来这份财报，把问题推到了眼前。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_0f980a9ed17e4e10b84e244f56343fd9@394564713_oswg201165oswg1268oswg787_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind制图</p>\n  <h3><strong>报表里的“生死反转”</strong></h3>\n  <p>如今很少有人记得，这家公司五年前离悬崖有多近。</p>\n  <p>2021年，“双减”政策刚刚落地，好未来随即关闭K9业务，并为自己找了三条退路：<strong>素养课、职业教育和学习硬件。</strong></p>\n  <p>未曾想，公司活了下来，而且比以前更赚钱。</p>\n  <p>2026财年，好未来营收30.09亿美元，净利润同比增长五倍多。2027财年，业绩增长还在继续。整个上半财年，好未来营收17.53亿美元，同比增长22%；经营利润3.73亿美元，同比增长237.8%；归母净利润3.61亿美元，同比增长132.1%。</p>\n  <p>把这份半年成绩单拆成两个季度，画风截然不同。</p>\n  <p>第一财季，好未来归母净利润4.08亿美元，同比暴增1204.3%。其中，经营利润为1.372亿美元，计入投资收益的“其他收入”约4.052亿美元。投资收益几乎是经营利润的三倍。</p>\n  <p><strong>到了第二财季，这笔钱调转了方向——“其他收入”变成1.897亿美元的“其他费用”。一进一出，公司单季度也由盈转亏。</strong></p>\n  <p>管理层在电话会上解释：“本季度，某些投资的公允价值下降”“投资价值可能随市场状况变化”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_a4668c57da1b45428d49d6b37b5e0207@394564713_oswg123840oswg855oswg429_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自好未来财报</p>\n  <p>“某些投资”当然有具体的模样。<strong>2023年10月，好未来参与智谱融资；次年又通过“欣欣相融”追加一轮投资。</strong></p>\n  <p>2026年1月8日，智谱在港交所挂牌，首日上涨13.17%，IPO市值约511亿港元。涨幅远没有到达顶峰。6月22日，智谱盘中触及2980港元，市值一度突破一万亿港元。</p>\n  <p>反观好未来，通过欣欣相融持有的智谱股份仅占总股本的0.79%，但纸面回报惊人。且好未来对智谱的投资不是孤例。</p>\n  <p>天眼查显示，“好未来战略投资”的名单上还有强脑科技、百川智能、阶跃星辰、深言科技等科技公司。“双减”五年，这家教育巨头悄悄把自己变成了一支AI基金的影子股东。</p>\n  <p><strong>难得的是，若把投资的起落剔掉，好未来的经营利润不差，素养课是发展主力。</strong></p>\n  <p>“数学是‘科学思维’，语文是‘人文创作’。”在绝大部分家长的感知中，这些素养课绕开了“学科培训”的敏感身份，仍是辅导孩子们课业的最佳解决方案。</p>\n  <p>截至第一财季末，好未来在全国44个城市及海外市场共有超过600个线下学习中心。到了第二财季，线下学习服务的收入继续保持双位数同比增长，<strong>培优素养课程续班率稳定在80%以上。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_c24163eac48a487a8953c3fd76c4f856@394564713_oswg993404oswg2110oswg1280_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自学而思、小红书APP</p>\n  <h3><strong>学习机也卖不动了</strong></h3>\n  <p>只不过，好未来仍在重押学习机业务。</p>\n  <p>这也不难理解。素质教育始终是“人”的生意，多收一个学生，就要多配一份师资，始终做不到“边际成本趋近于零”。职业教育的赛道已有粉笔、华图等老玩家，新入局者的空间有限。</p>\n  <p>那就只剩硬件。从行业维度看，在淘汰了早期“智能课桌、智能台灯”这些低复购率的产品后，能把教研能力一次性固化，重新进入家庭的学习机脱颖而出。</p>\n  <p>而好未来也确实把它做成了第二曲线，其周活跃学习设备超过200万台，周活跃率约80%，活跃设备日均使用近1小时。<strong>但这条曲线的增长，正在逼近天花板。</strong></p>\n  <p>今年三季度，中国学习平板全渠道销量同比暴跌30.8%，销售额也跌了17.1%。洛图科技预测，2026年，学习机全渠道的销量降幅可能达到‌21.3%‌。</p>\n  <p>2027财年第二季度的财报会上，好未来总裁兼CFO彭壮壮直言，叠加竞争加剧、消费者偏好变化和芯片等组件成本上涨，学习设备业务“已经成为我们整体收入增长的拖累”，公司预计未来收入增长将变得温和。</p>\n  <p>市场收缩之下，厂商只能依靠提价保住业绩，好未来也不例外。</p>\n  <p>今年上半年，学而思、科大讯飞等主流品牌的旗舰机型集中上市，价格均突破8000元，甚至上万元。问题在于，家长们的价格阈值在哪里？</p>\n  <p>新华网去年的一篇报道最常被引用：一台14寸的主流学习机产品，硬件成本约在1000至1200元，每台分摊的“课本、题库、课程”等内容成本，约在200至400元。</p>\n  <p>换句话说，学习机的门槛并��高，<strong>这也是所有品牌都在卷AI的原因：硬件拉不开差距，价格只能从“脑子”里溢出来。</strong></p>\n  <p>2023年5月，科大讯飞率先发布“星火大模型”，开启了教育大模型的元年。随即，网易有道推出“子曰”、学而思推出“九章”、猿辅导推出“看云”。</p>\n  <p>品牌们想让家长相信，机器里装着的是一位不会疲倦、始终革新的老师。<strong>麻烦的是，通用大模型正在拉平技术基线。</strong></p>\n  <p>今年2月，网易有道旗下的Lobster AI干脆以开源的方式铺量；数月后，腾讯正式发布教育智能体Learn Buddy；百度也发布了“文心老师”。</p>\n  <p>可以想象，当家长们被一道数学题卡住，打开一个免费的AI对话框，几分钟后就能获得答案及推导步骤。当学习机提供的服务能够低成本获得，产品也就只剩硬件价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_dbdf67d2b2764e22ab5f0f36bd2b5311@394564713_oswg2491347oswg2252oswg1654_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据公开资料制表</p>\n  <h3><strong>看不见的“代价”</strong></h3>\n  <p>在各项业务带来的进项之外，更值得细读的是费用端的节流。</p>\n  <p>今年更早的第一财季会上，好未来管理层把“纪律性执行”写进了经营优先级。到了第二财季，“纪律”仍是管理层口中的高频词——从学习中心的扩张，到学习机的成本控制，再到全公司的资源配置。</p>\n  <p>这不是一句空话。第一财季，公司的销售和营销费用同比下降4.8%；第二财季，降幅扩大到15.3%。收入上涨的同时，费用支出不增反降。</p>\n  <p><strong>而“纪律”的另一面落在人身上，报表可能看不见。</strong></p>\n  <p>今年8月，好未来旗下的“学而思学习机”出现用户中心登录异常故障，官方回应是后台程序维护升级。有员工对36氪透露，深层原因可能是维护人员被裁。“很多问题看起来是偶然，实际上是必然。”</p>\n  <p>36氪从多位员工处获悉，好未来的绩效考核从2022年开始收紧；2024年又推出了“991政策”：新员工九成走校招、一成走社招，并保留一成的末位淘汰。</p>\n  <p>“补偿是N+1，不接受的人，一两个月后会收到《单方解除通知书》。”</p>\n  <p>在一位员工的介绍中，今年4、5月的裁员比例比往年高，正式员工也会被强制调岗。有线下培优部门的老师被要求转岗至在线“乐读课程”。“这相当于全职变兼职，变相降薪。”</p>\n  <p>谈判桌上还有另一个选项：拿了赔偿，再以外包身份回来，当然接受的人很少。</p>\n  <p><strong>公司披露的口径，提供了事实的另一面。</strong></p>\n  <p>财报显示，好未来全职员工数近三年连续增长：2024财年约1.5万人，2025财年约2.3万人，2026财年2.61万人。总人数不断上涨的同时，也可能是换掉了“旧人”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_7811326f8f75492c9bf6d7c848518e4f@394564713_oswg3111344oswg1200oswg647_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind制图</p>\n  <p><strong>“2022年双减后，张邦鑫（创始人兼CEO）还主动找过很多基层员工面对面开会，询问员工对于公司改革的看法。没想到最艰难的时候熬过去了，我反而遭遇裁员。”</strong></p>\n  <p>在上述员工的回忆中，好未来的企业文化经历过几次变更。从最初的“开放坦诚做自己”“教不好学生等于偷钱和抢钱”，变成了“做强比做大更重要”“爱与科技助力终身成长”。对他来说，“双减”前后的好未来已完全不是同一家公司。</p>\n  <p>同样是从“双减”里爬出来的公司，新东方是另一种做法。有新东方留学业务的员工称，近两年，因部门合并、业务体量整体下降，员工人数有所减少，却未出现大批裁员的情况。</p>\n  <p>与“离开好未来才有好未来”的吐槽相比，从新东方离开的员工，还会回味俞敏洪的那句“聚是一团火，散是满天星”。</p>\n  <h3><strong>一场没有戳破的魔术</strong></h3>\n  <p>最后把视野放回资本市场。</p>\n  <p>进入2026年，几乎每一家教育公司都在回答同一个问题：“双减”之后，靠什么留住投资者的信心。</p>\n  <p>教培三巨头中，新东方更愿意将赚到的钱分给股东。2025年7月，董事会批准了三年股东回报计划，自2026财年起，每年至少拿出前一财年归母净利润的50%用于派息或回购。</p>\n  <p>好未来则更愿意将现金筹码押注在AI、押注未来。公司在发布二季度报的同时，也宣布了上市以来的首次现金派息。</p>\n  <p><strong>在这两家巨头公司之外，高途则像是在打一场消耗战。</strong></p>\n  <p>2022年底，高途曾效仿东方甄选推出“高途佳品”，流量却没能变成生意；2025年初，CEO陈向东喊出“All with AI，Always AI”，但公司至今没有自研大模型，硬件也不见水花。</p>\n  <p>2026年第一季度，高途收入16.9亿元，同比增长13.2%，净利润只有3451万元，同比下降72.2%；第二季度，公司收入增长20.2%至16.70亿元，却重回亏损，净亏1.36亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_3b3a8cac4bfe4959ac5e8a2433612585@394564713_oswg222152oswg1268oswg787_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind制表</p>\n  <p><strong>此外，诸多腰部公司还没能把AI的故事写进报表。</strong></p>\n  <p>有业内人士告诉36氪，2024年，他所在的教培公司推出过一款AI换装产品。</p>\n  <p>“老板几乎是卡着员工的试用期试水新业务。市面上哪个火就对标哪个，前期投入能达到大几千万元。”</p>\n  <p>实际上，部分教育公司的创新布局确实让人迷茫。</p>\n  <p>猿辅导母公司跨界消费，做了羽绒服、小有名气的Grid Coffee以及月子机构“茉莉智慧”。</p>\n  <p><strong>作业帮主打一个陪伴，推出了乙女游戏。在部分员工的表述中，这家有百度背景的教育企业，还尝试过“AI宠物、外卖、医美”等与主业毫不相关的项目。</strong></p>\n  <p>当教育的主业撑不起增长的故事，这些公司开始往任何有可能的赛道撒钱。换来的处境，却不一定相同。</p>\n  <p>今年7月起，传智教育发布了具身智能课程及6款分层教学机器人，由此换来资本市场的连续八个涨停。</p>\n  <p>传智教育CEO黎活明曾在朋友圈表示：“过去两年，整个IT培训行业几乎消失，这是我们创业以来最黑暗的日子。很庆幸，2024年我们孤注一掷转型向AI产业生态培养人才，换回了重生。未来二十年是AI的时代，人才需求是互联网时代的几十倍。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_d592f498bac24e6e865c90703bb29412@394564713_oswg1617158oswg2104oswg1134_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind制表</p>\n  <p><strong>与此同时，“AI+教育”这道题究竟该怎么解，世界仍在朝着两个方向走。</strong></p>\n  <p>近日，美国纽约宣布，2026-2027学年起，公立学校学前班至八年级禁止在课堂上使用生成式AI，覆盖约60万名学生，教师也不得用AI批改作业。</p>\n  <p>在中国，则明确要求中小学建立生成式AI“白名单”制度；目标到2030年，基本形成AI与教育深度融合的格局。</p>\n  <p>政策或许能带来机遇。<strong>真正值得追问���是——怎么应用AI，才能让教育依然是教育？至少对于真实用户，教育要交付的从来不是分数本身，而是学习能力的提升。</strong></p>\n  <p>这个问题一天得不到回答，短期回报再漂亮，也只是一场没有被戳破的数字魔术。</p>\n  <p>（分析师黄绎达对文章有贡献）</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_86e8f5a11b944fdc828d031f596a395a@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获得更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/S00ukoG05t2lZLbV_hxT_A\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;张帆，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-11-17T12:49:16+00:00", "fetched_at": "2026-11-18T05:41:59.738221+00:00", "fingerprint": "d1e7415200b36399"}, {"source": "36氪 - 最新文章", "title": "抖音生活服务负责人调整：浦燕子转任公司顾问，莫少君接任｜独家", "url": "https://36kr.com/p/4073876110677121?f=rss", "summary": "<p>文｜肖思佳</p>\n  <p>编辑｜乔芊 杨轩</p>\n  <p>11月17日，36氪获悉，因个人及家庭生活安排，浦燕子将不再担任抖音生活服务总裁，转任公司顾问，后续将参与公司公益等相关工作。该职务由红果短剧负责人莫少君接任。</p>\n  <p>据介绍，浦燕子是抖音集团的早期员工之一，2023年11月，作为抖音集团商业化负责人，浦燕子开始兼任抖音生活服务总裁。莫少君1991年出生，2017年加入抖音集团，先后负责番茄小说、番茄畅听和红果短剧的孵化和成长，后专注于红果短剧业务。加入抖音之前，莫少君曾在百度、美团和滴滴负责生活服务相关产品工作。</p>\n  <p>抖音集团方面回复36氪，此次调整属于正常的管理岗位轮换与交接，生活服务是公司长期发展方向之一，对该板块会持续投入、长期经营。</p>\n  <p><br /></p>\n  <p><br /></p>", "category": "tech", "published_at": "2026-11-17T13:32:07+00:00", "fetched_at": "2026-11-18T05:41:59.738215+00:00", "fingerprint": "4ed80ac6329b6143"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨李飞飞率World Labs正式加入AMD，苏姿丰主导庆祝仪式；360集团副总裁涉及大额贪腐被警方带走调查；高盛预测金价2年后才能重回高位", "url": "https://36kr.com/p/4074508571104132?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>李飞飞率World Labs正式加入AMD，苏姿丰主导庆祝仪式</li>\n   <li>京东集团：第三季度营收3096亿元，同比增长3.5%</li>\n   <li>OPPO Reno17系列正式发布</li>\n   <li>Siri AI每日限额，订阅后可获得最高20倍的额外使用额度</li>\n   <li>红果短剧有望推电视端App</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>黄仁勋公开表态：愿意重新执掌英伟达</strong></p>\n  <p>英伟达前首席执行官黄仁勋发表了辞职后的首份公开声明。他表示，如果董事会允许，他愿意再次执掌该公司。“自我离职以来，我听到了大量来自英伟达员工、投资者、商业伙伴和客户的呼声，希望我重返首席执行官的职位。”他在一份声明中表示。“如果董事会认为我的回归符合我们股东、员工、公司以及美国的最佳利益，我将非常荣幸地响应这些呼声，重新担任首席执行官。”</p>\n  <p>美东时间周二盘后，英伟达披露2027财年第三季度财报，公司营收、盈利双双超出市场预期，同时给出强劲业绩指引。这也是英伟达联合创始人黄仁勋上周突然卸任CEO之后，这家芯片巨头发布的首份财报。在英伟达财报会一开场，英伟达董事会主席哈维·琼斯已经明确表示，董事会无意让黄仁勋回归CEO岗位。（新浪科技、财联社）</p>\n  <p><strong>360集团副总裁卜思南涉嫌经济问题，涉及大额贪腐被警方带走调查</strong></p>\n  <p>近日，市场传闻称360集团副总裁、360市场部负责人卜思南近期被警方带走调查，背后涉及贪腐问题，且金额较大。随后，相关话题冲上多个平台热搜。11月17日，360方面回应记者，公司内审发现该员工涉嫌经济问题，已向公关机关报案。360方面表示，经初步了解，公司内审发现该员工涉嫌经济问题，立即向公安机关报案，目前该员工正在接受有关部门调查。公司一贯要求全体员工严格遵守法律法规和公司制度，对贪腐及其他违法违规行为持零容忍态度，一经查实，绝不姑息。</p>\n  <p>公开资料显示，卜思南2014年加入360集团，拥有十余年网络安全行业经验。2026年8月，360为推进“安全+AI”战略拆分公关与市场职能，卜思南出任市场部负责人，直接向CEO周鸿祎汇报。被带走前，他仍以360集团副总裁身份出席公开活动。(封面新闻、第一财经)</p>\n  <p><strong>高盛预测：金价2年后才能重回高位</strong></p>\n  <p>随着美联储鹰派立场不断强化，高盛一个月内第二次下调了黄金价格预测，将2027年底金价目标从4800美元下调至4650美元。该行目前预计，美联储将在2027年3月第三次加息。本月早些时候，高盛大砍了黄金目标价，将2027年底的预测从5400美元/盎司下调至4800美元/盎司。</p>\n  <p>高盛最新预计，随着美联储持续收紧政策对无息资产黄金构成压力，近期金价将进一步走弱，波动性也会加剧。2026年初，黄金价格在短短一个月的时间就飙升了逾30%，并创下历史高位。高盛预测，可能要再等两年，这种贵金属才能重返高位并刷新历史记录。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>李飞飞率World Labs正式加入AMD，苏姿丰主导庆祝仪式</strong></p>\n  <p>当地时间11月16日，AMD正式宣布，完成对李飞飞旗下空间智能公司World Labs的收购。AMD CEO苏姿丰到访World Labs位于美国加州旧金山的总部，和World Labs员工在办公室庆祝收购成功，苏姿丰手握蛋糕刀，切向裱花环绕的蛋糕，金色插牌印着AMD的口号“together we advance”。World Labs则发布了AI制作的视频，视频中，苏姿丰穿着印有World Labs标志的外套，李飞飞穿着印着AMD标志的外套。(科创板日报、财联社)</p>\n  <p><strong>Siri AI每日限额，订阅后可获得最高20倍的额外使用额度</strong></p>\n  <p>近日，苹果正在iOS 27.3、iPadOS 27.3和macOS 27.3测试版中测试Siri AI及部分Apple Intelligence功能的每日使用限额。用户订阅部分iCloud+套餐后，可获得最高20倍的额外使用额度，现有套餐价格保持不变。</p>\n  <p>苹果还将针对不同功能类别分别设置使用上限，具体额度会根据功能类型、请求复杂程度以及系统负载进行调整。用户接近使用上限时会收到提醒，额度耗尽后可以选择等待重置或通过iCloud+获得更多使用次数。(凤凰网科技、IT之家)</p>\n  <p><strong>英伟达推出高性能计算新平台，能效比x86 CPU提升一倍</strong></p>\n  <p>英伟达宣布推出面向高性能计算的Vera CPU机架级平台。Vera为智能体科学带来更高性能，能效比x86 CPU提升一倍。完整的Vera CPU平台将由戴尔科技、HPE、联想和Supermicro提供。同时，英伟达宣布与IBM及费米国家加速器实验室合作推出量子-经典协同设计平台，并实现纠错突破以推动实用化量子计算发展。(科创板日报、快科技)</p>\n  <p><strong>谷歌DeepMind战略主管Jasjeet Sekhon跳槽加入Anthropic</strong></p>\n  <p>谷歌DeepMind首席战略官Jasjeet Sekhon于周一官宣离职，将加盟Anthropic。他在X平台发文称：“我的工作目标是推动 Claude 模型践行并恪守认知严谨性。”Anthropic发言人证实了此次聘用。领英资料显示，在加入谷歌之前，塞洪曾任桥水基金首席科学家与AI负责人，更早之前是耶鲁大学教授。（财联社）</p>\n  <p><strong>可灵AI全新一代图像创作模型Kling Image 4.0正式上线</strong></p>\n  <p>36氪获悉，11月17日晚，可灵AI全新一代图像创作模型Kling Image 4.0正式上线。本次升级在画面真实感、文字表现力、指令理解与一致性上实现显著提升。面向影视创作、广告营销等专业场景，Kling Image 4.0将为图像画面的细腻表达与高效创作提供更完整支持。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>英伟达：2027财年第三季度营收1158亿美元，同比增长103%</strong></p>\n  <p>36氪获悉，英伟达公布2027财年第三季度业绩。第三季度营收为1158亿美元，同比增长103%；净利润653亿美元，同比增长105%；GAAP和非GAAP毛利率分别为74.8%和74.9%。GAAP和非GAAP摊薄每股收益分别为2.70美元和2.68美元。2026年9月，英伟达董事会批准了公司股份回购授权增加1500亿美元的计划，且无到期。在2027财年第三季度，英伟达以回购股份和现金股息的形式向股东返还了281亿美元。截至第三季度末，公司在股份回购授权下剩余约2273亿美元。</p>\n  <p>英伟达临时CEO兼首席财务官科莱特·克雷斯在财报会议中表示，云计算行业订单积压规模已从三个月前的2万亿美元增至2.5万亿美元。她还表示，英伟达超大规模云客户的营收增速已连续六个季度加快，OpenAI和Anthropic推出的新一代前沿模型正推动AI应用及相关收入增长。（36氪、界面新闻）</p>\n  <p><strong>马斯克称真身来中国参加APEC，数字分身赴纽约DealBook峰会</strong></p>\n  <p>11月17日，美国著名企业家马斯克在一条关于纽约DealBook峰会的帖文下留言称：“我会在中国，所以届时将由数字版的我出席（这个峰会）。”据悉，2026年DealBook峰会将于当地时间11月18日在纽约举行，马斯克此前被列入参会嘉宾名单。此次回应意味着他届时不会亲自到场，而将以数字形式参与。</p>\n  <p>与此同时，深圳正迎来APEC系列重要活动。2026年APEC工商领导人峰会将于11月17日至18日在深圳前海国际会议中心举行，主题为“共促繁荣、共赢未来”；APEC第三十三次领导人非正式会议也将于11月18日至19日举行。</p>\n  <p><strong>红果短剧有望推电视端App</strong></p>\n  <p>字节跳动正在招聘红果短剧OTT端产品经理，负责红果短剧OTT端（大屏/电视端）产品从0到1建设；设计OTT端变现路径，探索投屏会员、会员订阅、衍生权益等变现模式；此外要深度参与OTT牌照申请全流程，设计OTT端内容分发体系，包括首页推荐、分类导航、搜索、追剧等功能，推动红果短剧主端与OTT端多端协同。（新浪财经）</p>\n  <p><strong>宇树科技董事长兼首席执行官王兴兴：机器人行业当前的机遇与现实挑战</strong></p>\n  <p>2026年APEC工商领导人峰会17日在深圳举办。在“共建开放普惠的人工智能创新生态”研讨环节，宇树科技董事长兼首席执行官王兴兴表示，大众所见到的AI、机器人成果仅是冰山一角，水下底层技术迭代速度迅猛，行业发展前景值得期待，各界应当主动拥抱AI技术变革。王兴兴还表示，行业仍面临多重现实难题，首要痛点是模型泛化能力不足，机器人更换应用场景往往需要重新训练，难以实现一台设备适配各类家庭与工作环境，不过全球技术演进已接近突破临界点。他同时提醒，即便机器人AI模型实现技术突破，产业链仍要面对诸多考验。（证券时报）</p>\n  <p><strong>Anthropic最快将于12月11日纳入罗素1000指数</strong></p>\n  <p>Anthropic计划中的IPO可能带来数十亿美元的指数跟踪基金买盘，不过，这家人工智能（AI）初创企业在被纳入两大主要股指之前，等待时间可能比SpaceX更长。根据富时罗素的一份通知，如果Anthropic按计划于周四开始交易，并符合提前纳入条件，可能会在12月11日收盘后加入罗素1000指数。根据纳斯达克100指数的编制规则，Anthropic可能在12月21日开盘前被纳入该指数。相比之下，SpaceX于6月上市约一周后便加入罗素1000指数，并在开始交易后不到一个月被纳入纳斯达克100指数。（新浪财经）</p>\n  <p><strong>谢霆锋、容祖儿获委任为英皇娱乐董事</strong></p>\n  <p>11月17日，英皇娱乐宣布，旗下艺人谢霆锋、容祖儿获委任为董事，并于17日正式履职。主席杨受成表示，容祖儿与谢霆锋将肩负更重要使命，协助公司引入新思维及视野，推动业务发展。（界面新闻）</p>\n  <p><strong>小米辟谣汽车召回短信</strong></p>\n  <p>36氪获悉，小米辟谣发文称，近日，公司发现有不法分子冒充“小米汽车”发送诈骗短信，声称“小米汽车11月15日起开始召回”，要求车主尽快登录所附网址并提供相关个人信息。小米汽车不存在短信中的“11月15日起开始召回”事项，相关内容纯属虚构。此类短信也并非小米汽车官方通知</p>\n  <p><strong>巴菲特捐55亿美元股票，持续捐赠伯克希尔股票已超过20年</strong></p>\n  <p>11月16日晚间，伯克希尔·哈撒韦发布公告称，公司名誉董事长沃伦·巴菲特（Warren Buffett）将6150股伯克希尔A类股票转换为922.5万股B类股票（约55亿美元），并全部捐赠给四家家族基金会。完成此次捐赠后，巴菲特仍持有18.214万股伯克希尔A类股票，价值约1620亿美元（约合1.08万亿元人民币）。</p>\n  <p>公开资料显示，巴菲特自2006年以来便持续向家族基金会捐赠伯克希尔股票，至今已坚持超过20年。四家基金会的主要公益方向各有侧重，涵盖幼儿教育、社会公平、粮食安全、冲突解决以及妇女和儿童健康等领域。(21世纪经济报、快科技)</p>\n  <p><strong>伯克希尔三季度持仓曝光：新建仓软件公司Bending Spoons</strong></p>\n  <p>伯克希尔·哈撒韦当地时间11月16日向美国证监会（SEC）提交了2026年第三季度的13F文件。文件显示，伯克希尔在今年三季度新建仓了软件公司Bending Spoons。Bending Spoons是一家总部位于意大利米兰的软件公司，2026 年7月1日在纳斯达克上市，商业模式是收购数字企业，旗下软件产品包括美国在线AOL、印象笔记（Evernote）、WeTransfer等，被称为“App翻新工厂”。（财联社）</p>\n  <p><strong>马斯克称特斯拉最早12月启动车主Robotaxi试运营</strong></p>\n  <p>马斯克近日在社交平台上表示，特斯拉最早可能于12月启动车主Robotaxi试运营，允许个人车主将自己的车辆投入特斯拉无人驾驶出租车网络接单赚钱。事情的起因是一位奥斯汀的Uber司机在社交平台上向马斯克提问，表示自己宁愿把Model Y放出去自动接送乘客，也不想亲自花时间开车跑单。马斯克回复称“快了，如果一切顺利，可能下个月开始试点”，并补充说管理一支车队比自己开一辆车更有价值。不过马斯克并未透露试点的具体城市、参与条件以及车费分成方案等关键细节。（新浪财经）</p>\n  <p><strong>英特尔中国发生董事长变更</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，英特尔（中国）有限公司发生工商变更，CANDICE CHRISTINE MOORE卸任法定代表人、董事长，由DAVID MICHAEL MISCIA接任。值得一提的是，今年5月，HARRY HAROLD DEMAS卸任法定代表人、董事长，由CANDICE CHRISTINE MOORE接任。该公司成立于1994年1月，注册资本约2.6亿美元，经营范围包括承接境外公司的服务外包业务、从事物流配送服务、计算机系统集成及技术服务等，由英特尔亚洲控股有限公司全资持股。</p>\n  <p><strong>三星电子和SK海力士现金持有量过去一年增加一倍多</strong></p>\n  <p>周二公布的公司文件显示，在全球人工智能（AI）繁荣期间芯片需求强劲的推动下，韩国芯片公司三星电子和SK海力士的现金持有量在过去一年中增加了一倍多。根据季度报告，截至9月底，这两家芯片制造商的现金、现金等价物和短期金融工具合计达到329.23万亿韩元（2463.3 亿美元），远高于去年同期的136.3万亿韩元。该数字也较6月底的277.91万亿韩元大幅增长，仅在三个月内就增加了51.32万亿韩元。现金持有量的大幅增加，得益于这两家芯片制造商在人工智能（AI）数据中心所用高带宽内存（HBM）及其他先进存储芯片方面的强劲需求。（新浪财经）</p>\n  <p><strong>英伟达高位减持近25%英特尔，小幅加仓SpaceX</strong></p>\n  <p>美东时间周一，最新披露的13F报告显示，今年第三季度，英伟达大幅减持英特尔，小幅加仓SpaceX。13F报告显示，截至第三季度末，英伟达的美股持仓总市值为483.3亿美元，较二季度末的634亿美元环比下降约23.8%，主要受大幅减持英特尔及多只重仓股估值回落拖累。具体来看，英伟达第三季度持仓8只标的，全部为美股科技板块股。</p>\n  <p>其中，英特尔和SpaceX是英伟达美股持仓中的绝对核心。两大标的合计市值约为390.5亿美元，在英伟达总持仓中占比高达80.8%。而英伟达第三季度最主要的调仓变动也发生在前两大重仓股之间。SEC文件显示，英伟达将其在英特尔的持股削减了25%，至1.611亿股，使得英特尔在其持仓中的占比从之前的47.27%降至40.07%；将其在SpaceX的持股增加了6.3%，至1.305亿股A类股，持仓占比从之前的33.06%大幅升至40.73%。(财联社)</p>\n  <p><strong>2026年APEC工商领导人峰会欢迎酒会在深圳举行</strong></p>\n  <p>11月16日晚，2026年APEC工商领导人峰会欢迎酒会在深圳举行。本次活动是APEC工商领导人峰会高端交流活动，由中国国际贸易促进委员会、广东省人民政府、中央广播电视总台共同主办，深圳市人民政府承办。来自21个APEC经济体的工商界代表、APEC经济体高官及多国代表共约1500人出席。现场嘉宾在交流中盛赞新时代中国不断以自身发展实践为亚太和世界提供新机遇，对亚太合作和区域经济一体化发挥了重要引领作用。多国嘉宾表示，中国始终维护多边贸易体制，践行真正的多边主义，APEC“中国年”启动以来，围绕“开放、创新、合作”三大优先领域不断取得新成果，期待在深圳传递出的亚太声音，助力区域共同繁荣，共赢未来。（央视新闻）</p>\n  <p><strong>加州起诉OpenAI，控其模型测试疏于管控、危害公共安全</strong></p>\n  <p>当地时间11月16日，加州总检察长罗布·邦塔（Rob Bonta）起诉OpenAI，指控其在开发先进的人工智能模型时缺乏足够的保障和监控措施，从而危害公众安全。这起诉讼源于OpenAI智能体今年7月对开源软件平台Hugging Face发动的攻击，并涉及一系列其他相关事件。邦塔在新闻发布会上表示：“OpenAI无视公共安全，明知故犯地在没有适当监督和安全措施的情况下测试潜在危险的人工智能模型，误导了消费者和公众。”</p>\n  <p>邦塔提起的诉讼在旧金山州高等法院立案，主张OpenAI违反加州《不公平竞争法》，并认为该公司构成州法律所定义的“公共妨害”行为。在诉状中，加州指控OpenAI就其产品的不安全程度误导公众。加州方面表示，OpenAI在回应调查时承认，其自主AI智能体在测试过程中发生超过80次失控事件。这一数字高于OpenAI迄今公开披露的数字，也高于外部研究人员独立发现的数字，但OpenAI除此之外提供的信息很少。(界面新闻)</p>\n  <p><strong>韩媒：三星电子与苹果接近签署DRAM长期供应协议</strong></p>\n  <p>三星电子与苹果即将签署DRAM（动态随机存取存储器）长期供应协议（LTA）。作为全球最大的消费电子产品企业，苹果是大型科技公司中唯一一家尚未与三星电子签署LTA的企业。据业界17日消息，三星电子与苹果正在进行最后阶段的协议磋商。该协议拟从明年上半年开始生效，期限为4至5年。据悉，协议还将设定DRAM供应量下限，同时根据未来市场情况最终确定价格。此次协议背后，被认为是日益严峻的存储芯片供应紧张局面。分析认为，为确保iPhone、MacBook等核心产品所需DRAM的稳定供应，苹果最终选择签署长期供应协议。三星电子、SK海力士和美光等三大存储芯片制造商相继与主要客户签署LTA，也对苹果产生了影响。据悉，苹果近期也已与SK海力士签署存储芯片供应长期协议，且协议条件更有利于供应商。(金十数据APP)</p>\n  <p><strong>美股三大股指集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，11月17日收盘，美股三大股指集体下跌，道琼斯指数跌1.64%，标普500指数跌1.02%，纳斯达克综合指数跌0.74%。大型科技股多数下跌，微软跌超2%，谷歌、Meta跌超1%，英伟达、苹果小幅下跌，特斯拉、亚马逊小幅上涨。热门中概股涨跌不一，京东跌超7%，哔哩哔哩跌超5%，阿里巴巴跌超4%，百度跌超3%，腾讯音乐涨超6%，小鹏集团、蔚来、爱奇艺涨超3%，理想汽车小幅上涨。</p>\n  <p><strong>纳斯达克23小时制交易渐近，跨市场联动有望进一步升温</strong></p>\n  <p>纳斯达克（NDAQ）交易所此前宣布，自美东时间12月6日(周日)晚上9点起，交易所将把股票及相关交易产品的交易时长从每天16小时延长至23小时，每周仍保持5个交易日。</p>\n  <p>在业内人士看来，在新的交易时间安排下，跨市场联动有望进一步升温。尤其是半导体、AI、创新药等深度嵌入全球产业链，估值锚定海外市场的全球化赛道，美股信息传导可能由“隔夜反应”转向“盘中实时映射”，A股和港股相关板块对海外信息的反应将更及时。此外，跨境ETF的定价效率也有望得到改善。(央视财经、上海证券报)</p>\n  <p><strong>工信部办公厅关于同意北京市等8个省（市）开展6G创新发展部省协同试点工作的复函</strong></p>\n  <p>工信部公告，经组织专家研究论证，工信部同意北京市、河北省、上海市、江苏省、浙江省、安徽省、湖北省、广东省作为6G创新发展部省协同试点省（市）。试点省（市）按照评审专家和司局有关意见对本地区《6G创新发展部省协同试点工作方案》进一步修改完善，并紧盯目标任务，切实抓好落实，确保取得实效。在组织实施中，应结合6G国际标准和产业研发实际，突出地方产业优势，探索特色化发展路径，重点在培育6G应用产业、夯实基础产业、探索新型产品路线等方面加强攻关，更好服务6G发展大局，形成全国6G创新“一盘棋”格局。(金十数据APP)</p>\n  <p><strong>长鑫科技：将依法依规适时启动分红方案的论证</strong></p>\n  <p>11月17日，长鑫科技高管在2026年第三季度业绩说明会上就分红计划回应，DRAM行业是兼具重资产投入和高研发投入的行业，充沛的资金有助于企业实现长期可持续发展；公司持续优化资金投入和使用，为股东创造更大价值。另外，公司将依法依规适时启动分红方案的论证，具体的分红安排以公司公告为准。（证券时报）</p>\n  <p><strong>中关村：36个在产产品纳入国家医保目录（2026年）</strong></p>\n  <p>11月17日，中关村(000931.SZ)公告称，公司全资子公司四环医药之控股子公司北京华素、山东华素及多多药业所属部分药品纳入《国家基本医疗保险、生育保险和工伤保险药品目录(2026年)》，公司共计36个在产产品纳入该目录。其中，富马酸比索洛尔片、盐酸贝尼地平片等原纳入2025年目录的产品均继续纳入。新增纳入产品包括北京华素“盐酸羟考酮缓释片”、山东华素“比索洛尔氨氯地平片”、多多药业“盐酸溴己新注射液”和“非布司他片”。公司提示，纳入目录产品未来销售情况可能受市场环境变化等多重因素影响，不会对当期经营业绩产生重大影响。该目录将于2027年1月1日起正式实施。(财联社)</p>\n  <p><strong>英国烟草巨头帝国品牌公司计划到2030年底裁员至多2500人</strong></p>\n  <p>英国烟草巨头帝国品牌公司（原名帝国烟草公司）周二表示，计划到2030年底再裁减2100至2500个工作岗位。这意味着自2026财年以来，该公司累计裁员人数将超过4000人；此举旨在控制成本。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>“穗升科技”完成数千万元Pre-A轮融资</strong></p>\n  <p>36氪获悉，AI Memory智能硬件公司“穗升科技”近日完成数千万元Pre-A轮融资，本轮由NexTide Capital、阿尔法公社投资。资金将重点投入长期记忆引擎、主动式Agent的体验优化，拓展家庭、团队场景，推进硬件量产交付，并搭建海外渠道、完善本地化交付能力。</p>\n  <p><strong>“蓝点触控”完成数亿元D3轮融资</strong></p>\n  <p>36氪获悉，机器人力传感器企业“蓝点触控”近日完成数亿元D3轮融资，由厦门海投集团、厦门海沧产投、洪泰基金、中关村科学城、浙创投、奥普特、新未来、弘毅投资、秦创投、陕西国晟、江门金控、山证投资、曦晨资本、君安控股等14家机构联合投资。近半年来，蓝点触控融资额已超10亿元。本轮融资将主要用于四个方面：一是随核心大客户扩充研发投入，推进新一代机器人力传感器产品研发；二是拓展海外市场；三是扩充产能；四是向算法和数据端延伸。</p>\n  <p><strong>“酉术量子”完成天使轮融资</strong></p>\n  <p>36氪获悉，近日，“酉术量子”宣布完成天使轮融资。本轮新增投资方为云启资本、嘉铭浩春，老股东菡源资产、小苗朗程、启高资本持续加码。多维资本长期担任独家财务顾问。融资资金将主要用于原创量子算法研发、UnitaryLab量子科学计算平台及UnitarySpark异构计算产品迭代、AI与Agent驱动能力优化、量子硬件适配，以及科研和产业市场拓展。</p>\n  <h2>大公司财报</h2>\n  <p><strong>京东集团：第三季度营收3096亿元，同比增长3.5%</strong></p>\n  <p>36氪获悉，京东发布2026年第三季度财报，财报显示，第三季度实现营收3096亿元，同比增长3.5%；归属于公司普通股股东的净利润65亿元，同比增长22.6%。报告期内，服务收入764亿元，占收入比例提升至24.7%，创历史新高，其中，家装、家政保洁、线下医疗等生活服务收入实现同比三位数的增长；季度活跃用户数和京东PLUS会员数继续保持同比双位数增长。</p>\n  <p><strong>名创优品：前三季度总营收181.2亿元，同比增长19.3%</strong></p>\n  <p>36氪获悉，名创优品集团公布2026年第三季度财务报告。前三季度，集团总营收181.2亿元，同比增长19.3%；名创优品品牌营收166.3亿元，同比增长19.9%，其中中国内地营收102.2亿元，同比增长27.4%。截至2026年9月30日，集团全球门店达8665家；名创优品品牌全球门店8303家，其中国内4726家、同比净增319家，海外3577家、同比净增153家。</p>\n  <p><strong>腾讯音乐：第三季度总收入89.4亿元，同比增长5.6%</strong></p>\n  <p>36氪获悉，腾讯音乐娱乐集团发布其截至2026年9月30日止第三季度未经审计财务业绩。第三季度总收入为89.4亿元，同比增长5.6%；调整后净利润为25.3亿元，同比增长2.1%；经调整的EBITDA为30.2亿元，同比增长2.7%。音乐相关服务收入本季度同比增长10.2%至76.8亿元。其中，音乐相关会员服务收入达49.9亿元，同比增长9.2%；营销及消费类服务收入同比增长12.1%至27.0亿元。</p>\n  <p><strong>微博：三季度总营收4.102亿美元</strong></p>\n  <p>36氪获悉，微博发布2026年第三季度财报。三季度微博总营收4.102亿美元（约合人民币27.58亿元），其中广告营收3.441亿美元（约合人民币23.13亿元），三季度调整后运营利润0.709亿美元（约合人民币4.73亿元）。用户方面，截至三季度末，微博的月活跃用户达到5.51亿，日活跃用户达到2.54亿。</p>\n  <p><strong>京东物流：第三季度营收639.5亿元，同比增长16.1%</strong></p>\n  <p>36氪获悉，京东物流公告，第三季度营收639.5亿元，同比增长16.1%；经调整经营利润21亿元，同比增长37.9%。第三季度，京东物流一体化供应链客户收入达301.9亿元，来自外部的一体化供应链客户的收入同比增长17.3%；京东物流包含快递、快运、即时配送等在内来自其他客户的收入达337.6亿元，同比增长35.3%。</p>\n  <h2>酷产品</h2>\n  <p><strong>OPPO Reno17系列正式发布</strong></p>\n  <p>36氪获悉，11月16日，OPPO举办“OPPO Reno17系列暨移动智能生态新品发布会”，正式推出新一代手机OPPO Reno17系列，并同步发布轻薄小方表OPPO Watch 5、学习平板OPPO Pad Air6以及OPPO Enco Clip2新配色粉黛海。</p>\n  <p><strong>整理丨</strong>宋清瑜</p>", "category": "tech", "published_at": "2026-11-18T00:04:54+00:00", "fetched_at": "2026-11-18T05:41:59.738209+00:00", "fingerprint": "16f3d070e430d708"}, {"source": "36氪 - 最新文章", "title": "英伟达季度营收破千亿美金，但昨日的世界已经远去", "url": "https://36kr.com/p/4074562529645445?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>在黄仁勋离职卷起的风暴眼中，英伟达交出了近年来可能最受瞩目的财报。</p>\n  <p>北京时间11月18日凌晨，英伟达发布2027财年第三季度财报。这是原CFO Colette Kress接任临时CEO以来，英伟达的首份成绩单。</p>\n  <p>财报数据显示，英伟达第三季度营收达到<strong>1158亿美元</strong>，<strong>同比增长103%；</strong>净利润达到<strong>653亿美元</strong>，<strong>同比增长105%</strong>，双双创下历史新高。其中，数据中心业务营收达到<strong>1076亿美元，同比增长110%</strong>，占总营收的93%。</p>\n  <p>其中，按照客户总部所在地统计，英伟达来自中国大陆及香港的季度收入为<strong>110.5亿</strong>美元，同比增长约272%。这并不意味着中国AI芯片业务已经恢复。英伟达在下一季度财务指引中，仍未计入来自中国的数据中心计算业务收入。</p>\n  <p>风波以来短短五日，英伟达市值蒸发约8000亿美元，相当于跌去了3.5个阿里。亮眼的财报又为市场注入了一针强心剂。财报公布后，英伟达股价在盘后交易中反弹，一度上涨约4%。</p>\n  <p>不过，即便交出一份营收和利润双双翻倍的财报，资本市场的疑虑仍未完全消散，市场随后回吐部分涨幅，而后重新反弹至上涨约3.4%，市场情绪仍显反复。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_e47630f4e96341bb8d7e33f92216de1c@1199336245_oswg830411oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">英伟达今年前三季度财务数据 硬氪制图</p>\n  <p>至少从财务数据来看，黄仁勋的离开尚未立即动摇英伟达的增长基本面。但资本市场的担忧，已经远超对一家公司本身业绩的关注。黄仁勋个人和英伟达公司的命运，已经和未来中美两国AI进程强绑定。</p>\n  <p>过去几年，英伟达凭借高端GPU的技术优势，逐渐建立起一张横跨芯片制造、云计算、AI模型公司的庞大产业网络。而黄仁勋本人，正是站在最中心的编织者。他是技术领军人，更是某种意义上的关键桥梁。他的突然离任，以及持续变化的地缘政治环境，正在给这张网络带来新的不确定性。</p>\n  <p>在中国，部分云厂商和AI企业开始加紧储备海外算力资源，也有企业加快国产GPU适配。高端算力供应的不确定性，正在重新分配国内算力市场的利益。</p>\n  <p>面对不断增加的地缘政治风险，英伟达也开始调整内部治理架构。在财报发布前夜，英伟达董事会宣布新设常设机构“<strong>国家安全与出口管制监督委员会”</strong>，在董事会层面统筹国家安全政策、出口管制合规与全球贸易风险管理。</p>\n  <p>这也释放出一个明确信号，<strong>过去高度依赖黄仁勋个人斡旋华盛顿与全球客户的关系模式，正被拆解为更制度化的董事会级监督架构。</strong></p>\n  <p>而在美国资本市场，英伟达过去几年深度绑定的一批云服务商、光通信和芯片制造企业，也接连遭遇股价重挫。市场开始重新审视英伟达过去搭建的产业关系。</p>\n  <p>一边是依然强劲的业绩，另一边是不断增加的产业不确定性。失去黄仁勋后，英伟达正在迎来一场比财报更复杂的考验。而全球AI产业，也随之步入剧烈的动荡。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_51ad1af3644b44c49cb5e9c4378c07ab@1199336245_oswg231535oswg861oswg1628_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">黄仁勋17日最新发言</p>\n  <h3><strong>风波里的中国算力</strong></h3>\n  <p>近期，硬氪与多位国内算力行业人士交流发现，面对英伟达扑朔迷离的未来，行业已经形成一个相对一致的预期：<strong>未来中国企业获取英伟达高端算力，可能会更加困难。“如果英伟达后续由其他管理层接手，拿卡的难度很可能会加大，而海外对供应链的追查态势也会持续。”一名云厂商人士向硬氪表示。</strong></p>\n  <p>据媒体11月12日报道，<strong>部分中国云厂商和AI企业已开始提前锁定海外英伟达GPU资源</strong>，<strong>一些中小模型公司也在接触东南亚算力租赁商——</strong>试图在供应政策进一步收紧前，尽可能锁定未来的算力资源。</p>\n  <p>但形势急转直下的速度比它们预期的更快。</p>\n  <p>仅仅四天后，海外算力渠道也迎来了新的监管压力。</p>\n  <p>11月16日，美国商务部出台新规，进一步加强对第三国数据中心及先进AI芯片远程访问的监管。<strong>这意味着，美国对华算力限制正在从芯片实物出口延伸至海外算力服务</strong>——即便提前锁定GPU资源，未来可能也无法持续使用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_870e4f1cd4ee4c879fec144968e81cf3@1199336245_oswg75560oswg960oswg540_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">英伟达</p>\n  <p>不过，算力供应趋紧，并非对所有厂商都是坏消息。<strong>对于过去储备了大量GPU资源的云厂商而言，供需的变化反而可能带来新的商业机会。</strong></p>\n  <p>“算力紧缺，对我们个人而言，反而是好事。明年的生意肯定会更好做，<strong>最近手头的客户都在抓紧询价、抢算力。</strong>”一名云厂商销售人士告诉硬氪。</p>\n  <p>当新增高端GPU供给受限，而模型训练、推理需求仍在增长，已经持有存量算力的厂商便拥有了更大的议价空间。相反，缺少算力储备、仍依赖新增采购或海外租赁的企业，则可能面临更高的成本与供应风险。</p>\n  <p><strong>一边是存量算力的稀缺性被进一步放大，另一边是新增算力和海外租赁渠道的不确定性持续增加——英伟达风波正在加剧中国算力市场的分化。</strong></p>\n  <p>事实上，大量国内厂商早已察觉到行业风向变化，并提前调整业务方向。</p>\n  <p>“<strong>我们目前已经在做第二备选，加大国产适配的力度</strong>，以应对明年潜在的行情变化。”另一名云厂商人士表示。</p>\n  <p>前述云厂商人士观察到：在风波之前，尝试国产算力的玩家基本上是央企、国企，而初创公司的顾虑的是时间成本——初创公司拿到融资，需要快速出产品，不出产品就无法继续融资，很难有充足的耐心做国产适配。因此，<strong>国产算力过去更多被视为补充选择。但如今，随着海外供应不确定性增加，国产芯片也开始承担保障更重要的角色。</strong></p>\n  <p>一个明显的变化是，今年以来，国产算力的适配范围正在扩大，从单一模型逐步延伸至多个主流模型和芯片平台。</p>\n  <p>过去，国产芯片往往需要针对不同模型单独优化，如今，今年2月份，智谱GLM-5已适配华为昇腾、寒武纪、摩尔线程等多家国产芯片；同期，太初元碁也已兼容30多个主流大模型；9月份，华为昇腾进入PyTorch官方支持体系，意味着国产算力正尝试从单一模型适配，进一步向底层软件生态延伸。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_ce41a859cee9433681d95a7231372d0b@1199336245_oswg584625oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">黄仁勋</p>\n  <p>政策端也已经隐秘释放信号。</p>\n  <p>一名行业人士告诉硬氪，近两个月以来，部分地方的算力补贴项目对国产GPU的使用比例，提出了更严格的要求——其中，<strong>部分项目甚至要求国产加速卡占比达到必须达到80%以上。</strong></p>\n  <p>一位行业人士向硬氪判断，产业发展过程中难免遭遇阶段性的黑天鹅事件，但这些冲击未必会改变长期趋势。“反过来看，<strong>一些阶段性的调整，可能会让产业发展的确定性变得更强。</strong>短期有阵痛，中长期可能是好事，能够让这个行业发展得更扎实。”</p>\n  <h3><strong>后黄仁勋时代的英伟达</strong></h3>\n  <p>而在大洋彼岸英伟达位于美国圣克拉拉的总部外，黄仁勋离职后，人们为此摆放的白色鲜花仍未凋谢。</p>\n  <p>与其说他们为黄仁勋伤感，不如说他们在悼念一个美好世界的逝去。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_28d540502f1b4c3a9534b33c5ded2f6e@1199336245_oswg137437oswg1080oswg1289_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">英伟达公司门口有人放鲜花“祭奠”</p>\n  <p>围绕黄仁勋的“回归拯救”行动已经展开。</p>\n  <p>据外媒报道，黄仁勋的支持者正在筹建由硅谷科技高管参与的“战情室”，试图争取白宫支持，推动其回归。一场要求其复职的网络请愿，目前已吸引超过18万人签名。</p>\n  <p>对于这家由黄仁勋创立、并由其掌舵三十余年的芯片巨头而言，创始人的意外离任，显然不是一次普通的管理层更替。它背后有更复杂和庞大的矛盾和利益。即便黄仁勋最后得以回归，他的行事作风，也必然会发生转向。</p>\n  <p>在今天的财报电话会议之前，黄仁勋公开表示，“如果董事会邀请，他愿意回来领导英伟达之后”。对此，英伟达董事长Harvey Jones则在电话会开场态度坚决地说<strong>“董事会不打算恢复黄仁勋的CEO职务</strong>，并且不接受分析师就这一问题提问”。</p>\n  <p><strong>而在一切尘埃落定前，风波的影响已经扩大，蔓延到整个AI产业链上下游。</strong></p>\n  <p>过去一年，英伟达完成了一系列股权投资、采购承诺和技术合作。</p>\n  <p>从入股英特尔、新思科技、迈威尔，到向Lumentum、Coherent等光通信企业投入数十亿美元，再到与康宁、诺基亚达成资本及技术合作，英伟达的投资版图已经覆盖芯片设计、制造、光通信和网络基础设施。而在下游，英伟达又向CoreWeave、Nebius等云服务商注资，扶持算力基础设施建设。</p>\n  <p>也就是说，<strong>英伟达已经不只是GPU供应商，还同时扮演着产业投资者、重要采购方和客户资本提供者等多重角色。</strong>通过锁定上游产能、扶持下游算力需求，英伟达试图将更多企业纳入自己的算力生态，建立起一个庞大的半导体帝国。</p>\n  <p>然而，<strong>过去被视为竞争壁垒的深度绑定，现在反而成了危机来源。</strong></p>\n  <p>据硬氪根据公开市场数据统计，11月11日至16日，英伟达投资的AI云服务商CoreWeave、Nebius股价分别累计下跌约17.9%、30.7%；光通信企业Lumentum、Coherent分别下跌约15.7%、12.3%，康宁下跌约11.9%；此外，英特尔、迈威尔分别下跌约11.2%、13.9%；诺基亚、新思科技也分别下跌约8.9%、4.5%。</p>\n  <p><strong>在英伟达财报电话会议之前，九家公司累计蒸发市值约1118亿美元，约等于一个拼多多、或两个美团。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_3718ddae84c044de9cc2fcf7bb3691d4@1199336245_oswg646427oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">英伟达产业链公司财报发布前跌幅 硬氪制图</p>\n  <p>不过，随着英伟达交出超预期财报，市场情绪开始出现逆转。财报公布后的盘后交易中，CoreWeave、Nebius分别反弹约5%、6%，英特尔等半导体公司股价也出现回升。</p>\n  <p>这轮先跌后涨的市场波动，揭示了英伟达产业布局的另一面：<strong>英伟达过去通过资本和技术合作构建的产业生态，正在成为一张风险与收益相互传导的网络。</strong></p>\n  <p>对于英伟达而言，眼下的考验或许不是GPU还能卖出多少，而是失去黄仁勋后，<strong>这家公司能否继续在新晋职业经理人的带领下，维持过去的技术迭代、资本投入与产业合作的节奏。</strong></p>\n  <p>黄仁勋的离任，或许是英伟达近年来最大的一次变局。而它将在未来很多年中牵动东西半球AI产业的走向。那时我们回望，或许会发现自己此刻正处在时代的转折点上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_55155435bf8f4ec89ea8f601b04c57b4@1199336245_oswg79490oswg1280oswg399_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>", "category": "tech", "published_at": "2026-11-18T01:01:16+00:00", "fetched_at": "2026-11-18T05:41:59.738200+00:00", "fingerprint": "aedd0de097d84f89"}, {"source": "36氪 - 最新文章", "title": "硬氪首发丨玻璃基板装备企业获近亿元融资，英诺基金连续三轮加注", "url": "https://36kr.com/p/4074564838659207?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，玻璃基板装备企业「深微芯创」连续完成三轮融资，累计近亿元。投资方包括深产投及老股东英诺基金等。其中，英诺基金连投三轮。本轮融资将主要用于核心装备研发、市场拓展及团队建设。</p>\n  <p>「深微芯创」成立于2026年，主要面向先进封装和光电融合领域，提供玻璃基板加工关键装备、核心工艺及成套技术方案。</p>\n  <p>公司创始人肖文博士拥有新加坡国立大学材料科学与工程博士学位，此前曾任全球半导体设备龙头企业产品技术负责人，并深度参与全球首条玻璃基板生产线建设，深度领导相关装备与工艺技术解决方案开发。</p>\n  <p>2024年，肖文入选国家级人才计划并回国创业。「深微芯创」的其他核心团队成员来自国内外头部半导体公司。</p>\n  <p>「深微芯创」选择的玻璃基板方向，是近年来先进封装领域备受关注的新技术路线。</p>\n  <p>随着AI芯片算力持续提升，芯片之间的数据传输正在成为新的性能瓶颈。尤其是在GPU与HBM等芯片高度集成的先进封装中，互联密度和传输频率不断提高，传统有机基板逐渐面临信号损耗、布线密度和翘曲等限制。</p>\n  <p>玻璃基板被视为潜在的替代方案之一。相比传统有机基板，玻璃材料最大的优势是高频信号损耗更低。「深微芯创」创始人肖文向硬氪介绍，在50GHz工作频率下，玻璃材料的信号损耗可降至传统有机材料的十分之一或更低。</p>\n  <p>同时，玻璃材料具有较高的表面平整度，有利于实现更精细的电路布线，其热膨胀系数等优异的机械性能可降低大尺寸封装中的翘曲风险。</p>\n  <p>目前，各大半导体巨头纷纷布局这一方向。英特尔是较早推动玻璃基板技术的芯片厂商之一，近年来，台积电、三星、大量日韩基板企业也相继展开研究。</p>\n  <p>不过，产业热度并不意味着玻璃基板已经具备成熟的规模化制造能力。肖文向硬氪介绍，当前玻璃基板面临的难点是，如何实现大尺寸、高良率、可重复的稳定生产。</p>\n  <p>其中，玻璃通孔（Through Glass Via，下称TGV）金属化是玻璃基板量产的一大难点。</p>\n  <p>由于玻璃本身不导电，需要在基板上蚀刻出大量密集的微通孔，再通过金属沉积、电镀等工艺形成垂直导电通路。再加上，这些孔又深又窄，深宽比可达10:1至20:1，传统工艺容易出现金属沉积效率低、孔壁深处镀不上金属等问题。此外，玻璃与金属不容易牢固结合，当加工面积扩大到面板级时，还要保证整块基板上的通孔加工质量一致，进一步增加了量产难度。</p>\n  <p>针对这些难题，「深微芯创」从装备、材料和工艺三个层面进行开发。</p>\n  <p>在装备端，「深微芯创」将技术重点放在面板级高深宽比TGV金属化装备上，采用高方向性物理气相沉积（PVD）、关键薄膜材料和工艺仿真相结合的方案。</p>\n  <p>在装备层面，公司自主开发大型特殊面形金属靶、匹配大面积均匀磁铁组、创新腔体构型及射频辅助等关键技术，通过控制金属粒子的运动方向、沉积效率和分布均匀性，改善深孔侧壁覆盖及大尺寸加工一致性。</p>\n  <p>在材料和工艺层面，公司同步开发缓冲层、粘附层及金属种子层相关工艺，解决玻璃与金属之间的结合及长期可靠性问题。</p>\n  <p>在商业模式方面，与只提供单台设备的厂商不同，「深微芯创」希望向下游交付包含专用装备、工艺配方、软件仿真及知识产权授权的成套制造方案。</p>\n  <p>目前，该公司仍处于核心装备研发和样机阶段，计划于2027年上半年将相关装备及工艺方案推进至客户产线验证。</p>\n  <p>除玻璃基板外，公司还在向光电融合领域延伸。随着芯片间通信带宽继续提高，传统电互联在功耗和传输距离方面面临更多限制，光互联正成为另一条重要技术路线。</p>\n  <p>目前，「深微芯创」正在研发面向玻璃基光波导制造的专用装备，以及铌酸锂、钽酸锂等光电材料的薄膜沉积装备。</p>\n  <p>其中，光电薄膜装备主要面向高速光通信、光调制器等应用，通过直接在晶圆上异质生长相关功能薄膜，探索降低传统薄膜制备工艺复杂度和制造成本的可能性。</p>\n  <p>据介绍，「深微芯创」已获得海外合作开发订单，涉及兼容8英寸和12英寸晶圆的光电薄膜沉积装备。</p>\n  <p>在肖文看来，玻璃基板与光互联并不是相互排斥的技术路线。前者主要解决高密度电互联问题，后者则面向更高性能的光通信需求，未来可能在不同封装架构中协同发展。</p>\n  <p><strong>以下是硬氪与肖文的访谈（略经摘编）</strong></p>\n  <p><strong>硬氪：相比传统有机基板，玻璃基板的优势有多大？</strong></p>\n  <p><strong>肖文：</strong>玻璃基板最重要的优势是信号损耗低。比如在50GHz的工作频率下，玻璃材料的信号损耗大约只有传统有机材料的十分之一，而且频率越高，这种优势越明显。</p>\n  <p>玻璃还有几个优点。首先，它的机械强度和尺寸稳定性较好，表面更加平滑，适合制造更精细、更高密度的电路。其次，玻璃的热膨胀系数可以做到接近硅，有助于减少封装过程中的翘曲问题。</p>\n  <p>对于AI算例、GPU这样的高端芯片，未来需要连接的芯片数量越来越多，数据传输频率也越来越高，传统有机材料逐渐难以满足要求。玻璃基板的意义并不是简单降低成本，而是让更高带宽、更高密度的芯片互联成为可能。</p>\n  <p><strong>硬氪：目前玻璃基板的行业进展如何？</strong></p>\n  <p><strong>肖文：</strong>从产业发展看，英特尔很早就开始布局，2024年底台积电也明确跟进，2025年美国、日本、韩国相关企业都开始实质性投入。英伟达也在推动下游供应商加快进度。</p>\n  <p>所以现在的问题已经不是行业要不要采用玻璃基板，而是谁能率先实现大规模、高良率生产。目前整个产业链还缺乏这样的成熟制造能力。</p>\n  <p><strong>硬氪：玻璃基板的主要技术难点是什么？</strong></p>\n  <p><strong>肖文：</strong>玻璃的优势和缺点都很明显。它表面平滑、信号损耗低，但材料本身比较脆，而且玻璃与金属之间的附着力不好，这些问题都需要通过制造工艺解决。</p>\n  <p>我们主要攻克两个技术难点。第一个是表面处理，既要保持玻璃原有的低损耗和高平滑度，又要让金属牢固地附着在玻璃表面，保证长期使用的可靠性。</p>\n  <p>第二个是大尺寸深孔填充。半导体行业已经有比较成熟的深孔金属填充技术，但把它应用到大尺寸面板级玻璃基板上，难度会明显增加。既要保证高密度垂直互联，又要在大面积范围内实现均匀加工。</p>\n  <p>这不是把现有半导体工艺简单放大就能解决的问题，需要在装备、材料和工艺上重新开发。</p>\n  <p><strong>硬氪：除了玻璃基板，你们为什么还布局光调制材料装备，这两条路线是什么关系？</strong></p>\n  <p><strong>肖文：</strong>玻璃基板主要解决现阶段电互联在高频、高带宽条件下的传输问题，但从更长期来看，随着通信性能要求继续提升，部分高端应用最终可能需要转向光传输。</p>\n  <p>我们布局的另一条方向，就是面向光调制材料的薄膜加工装备，为未来光互联相关器件提供制造能力。</p>\n  <p>这两条路线并不完全冲突。玻璃基板解决的是先进封装载板的问题，光调制材料则服务于另一类通信技术。未来不同应用场景可能采用不同方案，甚至同时使用两类技术。</p>\n  <p><strong>硬氪：你们目前研发进展如何？什么时候能够进入客户产线？</strong></p>\n  <p><strong>肖文：</strong>目前仍处于研发阶段，已经开始组装自主研发的核心装备样机，尚未正式进入客户产线。</p>\n  <p>我们的计划是在2027年上半年将装备和相关解决方案推送到客户产线开展验证。在此之前，需要先通过自己的装备和工艺制备出符合要求的玻璃基板样件，再逐步向客户交付完整方案。</p>\n  <p>我们的商业模式重点是装备研发、工艺开发和知识产权，不会自己投资建设大规模玻璃基板生产工厂。未来主要通过向客户销售整套装备和工艺解决方案实现商业化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_74a367c6eca340eb9e42969a62da02b8@1199336245_oswg79490oswg1280oswg399_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>", "category": "tech", "published_at": "2026-11-18T01:02:41+00:00", "fetched_at": "2026-11-18T05:41:59.738185+00:00", "fingerprint": "9a29f581ff9c15c2"}, {"source": "少数派", "title": "TDS REVIEW｜Bose 有线消噪耳塞体验", "url": "https://sspai.com/post/118976", "summary": "这篇文章是TDSStudio在少数派上的第35篇文章，依然是全平台首发。早先我们评价过绯乐的虹，当时在评论区曾经有一些读者好奇它和BoseQC20的区别。有线降噪入耳耳机，在TWS时代到来之前曾经是一 ...<a href=\"https://sspai.com/post/118976\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-17T07:00:00+00:00", "fetched_at": "2026-11-18T05:41:58.090786+00:00", "fingerprint": "8ba8a4ac627696b9"}, {"source": "少数派", "title": "社区速递 166｜柯尼卡胶片机、iPhone Duo 体验与假期省钱实操大赏", "url": "https://sspai.com/post/119184", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈 }, {"source": "The Guardian - World", "title": "Relocation of Cape Town baboons to sanctuary ignites heated protests", "url": "https://www.theguardian.com/world/2026/nov/16/cape-town-baboons-relocation-protests", "summary": "<p>Demonstrators tried to block vehicle carrying the baboons, whose capture authorities say is needed to protect both primate and human</p><p>The relocation of a troop of baboons in Cape Town to a wildlife sanctuary has triggered furious protests by local people opposed to their capture, which officials argue is necessary to stop human-wildlife conflict in the city.</p><p>The 44-member Waterfall troop (named after the area they mainly inhabit) was captured in the southern seaside suburb of Simon’s Town on Friday and Saturday. A second, smaller Seaforth troop is also due to be moved.</p> <a href=\"https://www.theguardian.com/world/2026/nov/16/cape-town-baboons-relocation-protests\">Continue reading...</a>", "category": "politics", "published_at": "2026-11-16T10:19:08+00:00", "fetched_at": "2026-11-17T06:14:45.335155+00:00", "fingerprint": "b07bfa65b9f5c89d"}, {"source": "The Guardian - World", "title": "US basketball player arrested with 75lb of marijuana at Nigerian airport, say authorities", "url": "https://www.theguardian.com/sport/2026/nov/16/us-basketball-player-arrested-with-75lb-of-marijuana-at-nigerian-airport-say-authorities", "summary": "<ul><li><p>Suspect named as Greene Da’monte Khiree</p></li><li><p>Drug smuggling carries life sentence in Nigeria</p></li></ul><p>An American basketball player has been arrested in Nigeria for allegedly attempting to smuggle 33.95kg (75lb) of marijuana into the country.</p><p>Nigeria’s National Drug Law Enforcement Agency (NDLEA) said a 28-year-old player named as Greene Da’monte Khiree from the state of Georgia was arrested at Lagos’s main airport last Wednesday after he arrived on a flight from Thailand via the United Arab Emirates.</p> <a href=\"https://www.theguardian.com/sport/2026/nov/16/us-basket s-outage-down-departures", "summary": "Less than a week after an issue with air traffic control communications and radar caused the FAA to halt takeoffs nationwide, United Airlines departing flights are being disrupted by an outage. At 6:13PM ET, United said the problem has been fixed: Earlier today we experienced a technology-related issue that impacted some departing flights. The issue [&#8230;]", "category": "tech", "published_at": "2026-11-16T22:54:59+00:00", "fetched_at": "2026-11-17T06:14:44.282349+00:00", "fingerprint": "4af98b7e3bf90778"}, {"source": "The Verge", "title": "Tech leaders are convinced that Jensen Huang’s exit was a plot against him", "url": "https://www.theverge.com/tech/1035027/tech-leaders-nvidia-jensen-huang-theories", "summary": "Jensen Huang's stunning resignation from Nvidia after more than 33 years has sent shockwaves throughout the tech industry. Now prominent figures are calling for Huang's reinstatement, and many are also hopping on board with a theory spreading throughout Silicon Valley: that the scandal is the result of a plot against the former CEO. At the [&#8230;]", "category": "tech", "published_at": "2026-11-16T23:17:34+00:00", "fetched_at": "2026-11-17T06:14:44.282343+00:00", "fingerprint": "ae3d9685f670ac12"}, {"source": "The Verge", "title": "Hacker behind 2022 GTA VI leaks pleads guilty", "url": "https://www.theverge.com/games/1035087/gta-vi-leaks-2022-hacker-pleads-guilty-arion-kurtaj", "summary": "Arion Kurtaj, a member of the Lapsus$ cybercrime group who leaked 90 videos of Grand Theft Auto VI in 2022 and hacked other big companies, pleaded guilty on Monday, according to the UK's Crown Prosecution Service (CPS). Kurtaj, who is now 21, hacked BT/EE sometime between August and November 2021, and starting in early November [&#8230;]", "category": "tech", "published_at": "2026-11-16T23:35:58+00:00", "fetched_at": "2026-11-17T06:14:44.282333+00:00", "fingerprint": "e242ad74e03e30b6"}, {"source": "36氪 - 最新文章", "title": "AI时代，TCL华星开始重新理解一块好屏", "url": "https://36kr.com/p/4071761698263939?f=rss", "summary": "<p>当AI进入电脑，连屏幕的长宽比都可能发生变化。</p>\n  <p>在TCL科技集团高级副总裁、TCL华星首席执行官赵军看来，当用户需要与智能体对话，额外的显示面积就可能成为新需求。这也是TCL华星布局超宽屏的一个出发点。</p>\n  <p>这个细节揭示了显示产业正在面对的变化：AI终端的交互方式，会影响屏幕的尺寸、形态与技术选择，显示企业需要更早理解终端如何使用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261116/v2_6485738fca564e3c9007b108b33e7123@430412560_oswg16896534oswg8256oswg5504_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>11月13日，TCL华星全球显示生态大会在武汉举行。从大会和群访，可以看到TCL华星的两条探索路径：通过显示技术适配AI终端，以及把AI引入屏幕的研发制造。其实两者最终指向同一个问题——AI时代，显示企业应该承担怎样的新角色？</p>\n  <h3>从交付规格到理解体验</h3>\n  <p>过去，面板企业通常根据客户提出的规格开发产品。赵军认为，随着AI终端发生变化，显示企业需要更前瞻地判断终端形态、应用场景和需求，提前做好技术与产品准备。</p>\n  <p>“去开发一块好屏在AI系统中的体验和扮演的角色”，是他对这一变化的概括。</p>\n  <p>这意味着，面板企业参与产品创新的位置有望前移。屏幕多宽、如何交互、功耗多高，需要放进终端的使用场景中一起考虑。</p>\n  <p>不同终端也会带来不同的技术需求。按照赵军的判断，传统PC增加AI能力，会提高对交互和低功耗的要求；带屏AI眼镜则可能需要硅基MicroLED等新的显示技术。超宽屏布局更多是基于成熟的LCD、OLED技术，对产品形态进行调整。</p>\n  <p>印刷OLED则是TCL华星面向中尺寸市场的重要技术准备。公司此次展示的14英寸印刷OLED超轻薄低反笔电显示，据披露厚度小于0.66毫米、重量不足66克，为轻薄终端提供了新的屏幕选择。联想、微星等品牌的印刷OLED终端产品，也出现在大会披露的合作成果中。</p>\n  <p>技术储备正在向产业化推进。按照公司计划，8.6代印刷OLED产线t8已于10月31日搬入设备，预计2027年第四季度量产出货。</p>\n  <p>从这一布局看，面板厂需要把对终端的理解，落实为不同的技术和产品组合。AI带来的机会，也藏在这些具体选择中。</p>\n  <h3>让AI走进屏幕研发</h3>\n  <p>终端需求发生变化，研发方式也要跟上。TCL华星正在尝试让AI参与从理解客户需求到形成设计方案的工程过程。</p>\n  <p>这项工作首先面对的是一个具体问题：客户提出的要求，并不总能直接变成工程师可用的设计指引。部分需求可能不完整，也可能存在模糊表述，需要进一步识别、整理和转化。</p>\n  <p>据赵军介绍，TCL华星开发的智能体已能识别这些规格和要求，将其转化为内部标准化设计指引，这一环节的准确率已超过90%。公司还在将AI、智能体与数十种专业软件结合，推进自动化设计。</p>\n  <p>本次大会发布的“显示研发设计全流程硅基员工”，则融合大模型、多智能体与工程工具，覆盖方案策划、设计、仿真、验证及品质管理等环节。此前发布的星智垂域大模型，为公司在显示领域应用AI提供支撑。</p>\n  <p>这条路径的价值，在于把客户的语言、显示行业的知识和工程工具连接起来。模型对需求的理解，需要通过设计、仿真与验证，逐步转化为可以执行的工程方案。</p>\n  <p>赵军表示，公司下一阶段希望进一步打通产品设计开发与生产制造，目前这一衔接仍处于探索阶段。其目标，是让AI参与更完整的产品实现过程。</p>\n  <p>TCL科技集团首席执行官王成在大会上说：“把产业经验与AI能力融合，让技术进步转化为研发、制造和经营效率。”对于工业AI，这也给出了一个具体方向：让模型进入企业已有的工程流程，在真实任务中发挥作用。</p>\n  <h3>显示制造能力的新去向</h3>\n  <p>AI也让TCL华星开始重新审视，显示制造积累的能力还能用在哪里。</p>\n  <p>玻璃基封装是公司正在探索的方向。按照赵军的介绍，这项布局面向AI基础设施，依托的能力包括在大尺寸玻璃上进行微米级加工、布线，以及控制平整度。这些都来自过去的半导体显示制造经验，同时也涉及玻璃打孔等新能力。</p>\n  <p>这为理解显示企业参与AI产业提供了另一个视角：新业务的起点，可能就藏在既有产线积累的工艺和工程经验里。如何把这些经验带入新的应用，会影响企业在AI产业链中的位置。</p>\n  <p>从理解AI终端，到用AI组织研发，再到探索基础设施，TCL华星正在把显示技术与AI产业连接得更深。对于显示企业，新的机会来自更早参与需求定义，也来自把长期积累的产业经验，转化为开发下一代产品的能力。</p>", "category": "tech", "published_at": "2026-11-16T12:19:55+00:00", "fetched_at": "2026-11-17T06:14:44.164569+00:00", "fingerprint": "b0978f9ba2a409e9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨DeepSeek因算力不足限额；英伟达董事会没考虑让黄仁勋回公司担任CEO；AI演员代言美瞳广告被罚6.82万", "url": "https://36kr.com/p/4073099271230601?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>阿里正式发布Qwen4，智能体及编程能力进阶</p>\n  <p>金饰价格连跌5个交易日，盘中跌破3900美元/盎司</p>\n  <p>三星将为SpaceX生产卫星芯片，目标2030年投入运行</p>\n  <p>大麦娱乐：因专注发展个人事业，樊路远辞任董事会主席及首席执行官</p>\n  <p>英伟达AI算力合约份额下跌，英伟达GPU占比仅39%</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>因算力不足，DeepSeek对App/网页版限额使用</strong></p>\n  <p>DeepSeek对App/网页版的长对话进行了限额使用。多名用户反馈，DeepSeek提示因“算力不足，不再支持超过7天不活跃的长对话”，并对单次输入文字的上限进行了调整，缩短至4万字左右。此外，还会限制每日的对话额度，当用户日使用量达到上限时，会提示“因服务器繁忙，使用额度已达上限。”</p>\n  <p>此次限额是DeepSeek近期算力紧张状态的延续。据DeepSeek官方状态页记录，2026年10月以来平台已发生8起服务中断，涉及对话服务及V4 Pro、V4.1 Flash的API。8月至10月，V4.1Flash API的可用性为99.46%，折算下来全年约有47.3小时不可用。(科创板日报、IT之家)</p>\n  <p><strong>英伟达董事会，不考虑让黄仁勋重任CEO</strong></p>\n  <p>据报道，知情人士称，英伟达董事会没有在考虑让黄仁勋回公司担任CEO。董事会目前专注于调查，并未讨论让黄仁勋回归。(财联社)</p>\n  <p><strong>AI演员方桃子代言美瞳广告，被罚6.82万</strong></p>\n  <p>11月16日，记者从“信用广东”获悉，因在未取得医疗审查证明的情况下发布美瞳广告，且虚构产品使用效果，虚拟人物“方桃子”的运营方广州我的影视文化传媒有限公司被广州市番禺区市场监管局罚款68288元。</p>\n  <p>视频发布时间为8月3日至8月5日，视频中虚拟人物“方桃子”宣称”我的美瞳戴了一天，都很舒服”“因为这个美瞳做了高光定轴，可以放心眨眼”等主观体验感受。市场监管部门认定，当事人虚构使用产品效果，发布虚假广告。</p>\n  <p>据悉，AI短剧《被裁掉的女孩》虚拟女主“方桃子”出道仅30天，吸粉超40万。其账号1-20秒视频的报价为16.8万元，21-60秒视频的报价为20.8万元，60S以上视频的报价为25.8万元，超过大批百万乃至千万粉丝真人博主。（北京日报、澎湃新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阿里正式发布Qwen4，智能体及编程能力进阶</strong></p>\n  <p>36氪获悉，阿里巴巴发布全新一代基座大模型Qwen4-Max，总参数2.4T，具备原生视觉能力，支持百万上下文。基于创新的模型架构和训练优化，Qwen4-Max以更少的Token消耗实现了更高的性能，在智能体和编程等关键能力项上持续进化。Qwen4面向全领域的真实任务深度优化，可更好地调用专业工具处理长周期任务。Qwen4-Max现已上线千问AI平台对外提供API服务，缓存命中每百万Tokens低至0.5元，完成单任务的平均费用较上代模型大降6成；用户也可通过阿里Token Plan调用新模型，或在千问办公、Qoder、千问App等应用中直接体验。</p>\n  <p><strong>腾讯混元Hy4 flash发布，任务速度大幅提升</strong></p>\n  <p>36氪获悉，11月16日，腾讯混元最新语言模型Hy4 flash发布，模型总参数量为224B（其中64B Engram参数），激活参数仅为12B，支持多模态和1M上下文长度。Hy4 flash每百万Token输入0.5元、输出2元，命中缓存时仅需0.02元，价格相比Hy4大幅降低。</p>\n  <p><strong>华为云发布并开源昇腾原生具身世界模型</strong></p>\n  <p>36氪获悉，华为云“行业AI梦工厂”11月16日发布昇腾原生具身世界模型CloudRobo-WM1.2，并宣布开源。该模型采用共享世界模型骨干网络实现预测增强的世界表征，基于世界模型原生DualAct架构，实现了世界模型原生动作生成，在RoboTwin 2.0、LiberoPro 2.0两个评测基准中均排名第一。</p>\n  <p><strong>豆包工作独家上线“工作台”功能，首批覆盖金融、医疗、教育等21个专业场景</strong></p>\n  <p>36氪获悉，近日，豆包工作独家上线“工作台”功能，首批覆盖金融、医疗、教育、创意设计等21个专业场景，让AI办公进一步走向职业化。据悉，这也是业内首个面向多个专业场景、不同职业人群定制的AI工作台功能。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>英伟达推出面向高性能计算的Vera CPU机架级平台</strong></p>\n  <p>英伟达宣布推出面向高性能计算的Vera CPU机架级平台。Vera为智能体科学带来更高性能，能效比x86 CPU提升一倍。完整的Vera CPU平台将由戴尔科技、HPE、联想和Supermicro提供。（财联社）</p>\n  <p><strong>英特尔单日暴跌近30%遭股东起诉，被指控隐瞒PC销售长期放缓所带来的影响</strong></p>\n  <p>美国芯片巨头英特尔遭股东提起诉讼。这些股东指控其隐瞒了个人电脑（PC）销售长期放缓所带来的影响，从而对他们构成欺诈。PC销售放缓近期曾导致该公司股价单日暴跌约29%。这起诉讼发生在英特尔股价大幅下跌之后。10月30日，英特尔股价单日下跌28.6%，市值蒸发约1400亿美元。而在10月29日，英特尔公布了第三季度财报，并给出低于市场预期的第四季度业绩指引，同时警告PC市场疲软至少将持续至2027年上半年。 原告将诉讼矛头指向英特尔7月23日至10月29日期间的信息披露，认为公司管理层没有充分披露PC需求放缓和库存积压对经营业绩的影响，也没有充分说明公司在数据中心芯片需求增长背景下面临的供应限制。(财联社、第一财经)</p>\n  <p><strong>美国航班取消量超1.7万架次，美交通部长拒绝道歉</strong></p>\n  <p>据旅行应用程序Flighty称，周末美国发生的航空交通瘫痪事件，是35年来因技术问题导致航班取消数量最多的一次，超过了西南航空2022年的系统崩溃事件。据Flighty和Cirium等航空数据提供商称，周五长达四小时的全国性停飞令波及了美国所有航空公司，截至周日，航班取消数量已超过1.7万架次。这一数字超过了2022年冬季假期期间因西南航空技术故障导致的16900架次航班取消纪录。</p>\n  <p>当地时间11月15日，美国交通部长达菲在接受美国全国广播公司采访时表示，他不会为11月13日发生的全美航班地面停飞事件道歉。达菲称，虽然事情发生在他的任期内，但其根源是历史遗留问题。达菲称，无论是民主党还是共和党都对此事件负有责任，因为美国航空业的基础设施投资不足可追溯至二三十年前。（新浪财经、CCTV国际时讯）</p>\n  <p><strong>金饰价格连跌5个交易日，盘中跌破3900美元/盎司</strong></p>\n  <p>11月16日，国际金价盘中持续震荡，现货黄金由涨转跌，盘中跌破3900美元/盎司，截至发稿，跌超0.4%。</p>\n  <p>国内多家品牌金饰价格亦随之继续下调，已连跌5个交易日。其中，老凤祥报1163元/克，周生生、老庙黄金足金饰品均报1165元/克。若以周生生1月29日年内高点1708元/克计算，金饰克价回撤已超540元。记者按此估算，消费者若在年内高点入手50克金镯，截至目前已暴跌超27000元。(中新经纬、央视财经)</p>\n  <p><strong>三星将为SpaceX生产卫星芯片，目标2030年投入运行</strong></p>\n  <p>三星电子将扩建位于得克萨斯州奥斯汀的芯片工厂，为马斯克旗下太空企业SpaceX生产星链卫星搭载的STM32V8微控制器（MCU）。三星已经在得州布局晶圆代工基地，如今在原有客户（特斯拉、英伟达、AMD的AI芯片订单）之外新增SpaceX卫星芯片业务，其美国业务版图正快速拓展至航天与国防领域。</p>\n  <p>引援韩国《首尔经济日报》11月15日报道，三星计划为此将投资19亿美元扩产，目标在2030年投入运行。该芯片目前已用于星链低地球轨道卫星之间的微型激光链路系统。SpaceX星链工程副总裁迈克尔 · 尼科尔斯曾表示，STM32V8的高性能算力与大容量嵌入式存储器“对于满足严苛的实时处理需求至关重要”。现阶段STM32V8主要在意法半导体法国Crolles工厂以300毫米晶圆生产，三星晶圆代工亦有参与；奥斯汀扩产旨在将部分产能转移至美国本土。(环球市场播报、IT之家)</p>\n  <p><strong>苹果计划在2027年发布6款iPhone</strong></p>\n  <p>根据目前供应链消息及多方爆料，苹果计划从2027年开始进一步扩大iPhone的产品阵容，全年预计推出6款机型，并首次采用春季、秋季两波更新的策略。从中端到轻薄旗舰，再到高端折叠屏，苹果似乎准备彻底改变过去一年集中发布新品的节奏。</p>\n  <p>春季将率先推出三款新品，分别是iPhone 18e、iPhone 18和第二代iPhone Air。其中iPhone 18e定位是中端市场，iPhone 18负责覆盖主流消费者，iPhone Air 2则继续主打轻薄设计。秋季才是真正的重头戏。2027年恰逢iPhone诞生20周年，苹果据称准备跳过iPhone 19命名，直接推出iPhone 20系列，以周年旗舰的身份带来更大的设计变化，目前流传的升级方向包括四曲面屏幕、玻璃机身等。（快科技）</p>\n  <p><strong>韩国今年前10个月新能源汽车出口量超去年全年</strong></p>\n  <p>韩国产业通商部11月16日发布资料显示，韩国今年1至10月新能源汽车累计出口量达88.4407万辆，已超过去年全年水平（87.4万余辆）。具体来看，10月新能源汽车出口额同比增长49%，为31亿美元。其中，混动汽车同比增长53.1%，为20.6亿美元；电动汽车同比增长41.6%，为10.4亿美元。在新能源汽车的助推下，10月整体汽车出口额同比增长18.1%，为65.5亿美元，创下历年同期最高纪录。面向北美（33.8亿美元，同比增33.2%）和欧盟（11.8亿美元，同比增58.2%）市场的出口增势明显。（界面新闻）</p>\n  <p><strong>美的集团总市值逼近7000亿，时隔5年9个月再创新高</strong></p>\n  <p>11月16日，早盘美的集团涨超1%，股价刷新此前在2021年2月10日创出的历史高点，A+H股总市值逼近7000亿元。消息面上，从2026年3月起，截至10月31日，公司已回购1.45亿股（占总股本1.89%），且全部用于注销、减少注册资本。行情背后，刚刚披露完毕的2026年三季报展现出较强经营韧性，在国内消费需求承压背景下，公司利润实现稳健增长；海外OBM自有品牌、楼宇科技、机器人自动化以及算力液冷温控等新业务，成为资本市场重点关注的成长变量。</p>\n  <p>财报数据显示，2026年前三季度美的集团实现营业总收入3691亿元，归属于上市公司股东的净利润414亿元，同比增长9.3%，营收、净利润双双实现同比正增长。拆分季度数据看，第三季度单季归母净利润达149亿元，同比增幅超过25%。(财联社、金融界)</p>\n  <p><strong>巴菲特将6150股伯克希尔A类股转换为922.5万股B类股并捐赠给四家基金会</strong></p>\n  <p>11月16日消息，沃伦·巴菲特将把6150股伯克希尔哈撒韦A类股转换为922.5万股B类股，并捐赠给四家家族基金会。其中，苏珊·汤普森·巴菲特基金会将获369万股，谢伍德基金会、霍华德·G·巴菲特基金会和NoVo基金会各获184.5万股。捐赠完成后，巴菲特将持有18.214万股A类股和1162股B类股。巴菲特表示，计划将其持有的全部伯克希尔股票捐赠给这四家基金会，以逐年增加慈善拨款。（界面新闻）</p>\n  <p><strong>诺基亚等五家公司组建AI超级工厂联盟，拟在北欧和波罗的海地区建设跨国AI基础设施</strong></p>\n  <p>诺基亚、Nscale、Skeleton、Telia和Verda于11月16日宣布组建AI Gigafactory Northern（AIGF Northern）联盟，计划在北欧和波罗的海地区建设分布式AI超级工厂，为欧洲企业、研究机构及公共部门提供大规模AI计算、主权云、高速网络连接和低碳能源服务。（财联社）</p>\n  <p><strong>调查显示欧元区第四季度通胀率预计将升至4%</strong></p>\n  <p>一项调查显示，在10月价格涨幅是欧洲央行目标的两倍后，经济学家们纷纷上调预测，料今年最后一个季度欧元区通胀率将达到4%。根据11月6日至11日对19位经济学家进行的调查，他们对欧元区第四季度通胀率的预估中值从上月调查时的3.8%上调至4%。西班牙、意大利和法国的通胀预期也被上调，德国的预期则被下调。（新浪财经）</p>\n  <p><strong>工信部：对应付账款规模大、故意拉长账期或投诉较多的汽车企业，工业和信息化部将联合相关部门开展约谈并督促整改</strong></p>\n  <p>36氪获悉，工业和信息化部相关负责人就《关于开展汽车企业供应商账款支付调研评估工作的通知》作出回应。这位负责人说，按照要求，工业和信息化部将每年开展一次系统调研评估并公布评估结果，晒晒“成绩单”，鼓励先进典型，督促后进整改，推动塑造良好产业生态。对应付账款规模大、故意拉长账期或投诉较多的汽车企业，工业和信息化部将联合相关部门开展约谈并督促整改。希望通过上述举措，充分激发各方的积极性，共促产业高质量发展，不断提升产业链供应链韧性和安全水平，加快构建公平公正、诚实守信、互利共赢产业生态。</p>\n  <p><strong>大麦娱乐：因专注发展个人事业，樊路远辞任董事会主席及首席执行官</strong></p>\n  <p>36氪获悉，大麦娱乐发布公告，樊路远因专注发展个人事业，已辞任公司执行董事、董事会主席及首席执行官；委任徐宏为公司非执行董事及董事会主席，沈严为执行董事及联席总裁。徐宏自2022年4月起担任阿里巴巴集团首席财务官。他于2020年1月至2021年10月担任大麦娱乐（前称：阿里影业）非执行董事。沈严2016年加入阿里巴巴集团，于2021年出任优酷副总裁，2026年3月出任大麦演出总裁，负责大麦娱乐演出内容与科技业务板块。在此之前，沈严担任支付宝旗下O2O事业部的快速消费品板块总经理。</p>\n  <p><strong>英伟达机器人学习工程师辞职：黄仁勋离职让我格外失望</strong></p>\n  <p>英伟达机器人学习工程师戴士钦（Darrell Dai）近日发文，宣布将离开公司，称“黄仁勋离职让我格外失望”。</p>\n  <p>戴士钦认为，他在一切事情都没有得到充足解释的情况下，就不得不面对黄仁勋离职的现实。虽然他对黄仁勋的钦佩，并不意味着他可以不受审视。但英伟达的未来方向、企业文化以及那些真正承担具体工作的人将受到怎样的影响，目前对他来说仍不清楚。（IT之家）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股集体走弱</strong></p>\n  <p>36氪获悉，11月16日收盘，美股三大指数集体下跌，纳指跌2.49%，标普500跌1.92%，道指跌1.41%；大型科技股集体走弱，Lumentum跌超8%，美光科技、英特尔跌超7%，英伟达、谷歌跌超4%，亚马逊跌超3%，Meta、特斯拉跌超2%，微软跌超1%，苹果小幅下跌；热门中概股多数下跌，蔚来跌超6%，百度跌超5%，哔哩哔哩跌超4%，阿里巴巴跌超3%，拼多多、京东跌超1%，理想汽车、网易小幅下跌，小鹏集团涨超3%。</p>\n  <p><strong>AMD完成对World Labs的收购，李飞飞出任执行副总裁兼首席科学家</strong></p>\n  <p>11月16日，AMD宣布完成对AI研究公司World Labs的收购，以增强其在AI模型领域的研发能力。World Labs专注于开发可创建和模拟交互式3D环境的AI模型，以及机器人学习与仿真技术。World Labs创始人李飞飞加入AMD，担任执行副总裁兼首席科学家，直接向AMD董事长兼首席执行官苏姿丰汇报。（界面新闻）</p>\n  <p><strong>白云山：子公司拟3.5亿港元认缴亚洲大健康基金有限合伙份额</strong></p>\n  <p>36氪获悉，白云山公告，公司全资子公司广药白云山香港有限公司拟出资3.50亿港元认缴沃博资本大健康有限合伙基金（简称“亚洲大健康基金”）有限合伙份额，占其募集完成后的比例为35%。亚洲大健康基金拟注册于中国香港，目标规模为10亿港元，重点投向医疗健康行业（包括但不限于医疗保健、生命科学及消费品行业）。</p>\n  <p><strong>涉17家重点车企：供应商账款支付情况调研评估将进行</strong></p>\n  <p>11月16日，从中国汽车工业协会获悉，协会将对17家重点汽车企业的供应商账款支付情况开展调研评估，推动汽车企业规范供应商账款支付。记者了解到，此次调研评估工作每年开展一次，采取“车企定期报送+样本供应商抽查”相结合的方式进行。汽车企业需于每年1月31日前报送上一年度账款支付情况报告，并于7月31日前报送当年上半年账款支付情况报告。同时，将从每家企业的供应商中随机抽取样本供应商，数量不少于15家，通过资料核查、现场调研等方式确认报送信息的真实性。评估内容包括企业账款支付管理制度和数字化系统建设情况；中小企业账款支付账期是否不超过60天、是否全部采用现金支付；非中小企业账款支付账期是否符合60天要求，以及现金和银行承兑汇票支付比例是否不低于80%等。(财联社)</p>\n  <p><strong>英伟达AI算力合约份额下跌，英伟达GPU占比仅39%</strong></p>\n  <p>11月16日，摩根大通资产管理市场与投资策略主席迈克尔・切巴莱斯特在前一日发布的报告中称，OpenAI、Anthropic这类前沿AI实验室已经敲定、未来将采购的算力基础设施里，英伟达GPU占比仅39%。而2023至2025年，英伟达在AI芯片整体收入中的份额曾达到83%，这预示着它在下一代算力基础设施中的占比可能大幅萎缩。</p>\n  <p>越来越多评估观点认为，在创始人黄仁勋深陷婚外情风波、辞去首席执行官一职之后，一直主导AI生态的英伟达正迎来第一次真正考验。依托高利润率与强劲现金流，英伟达短期内大概率仍能维持领先地位；但随着主要客户分散芯片供应商，叠加美国政府正考虑收紧出口管制，其垄断地位或将受到冲击。(财联社)</p>\n  <h2>上市进行时</h2>\n  <p><strong>炎症疾病生物技术公司Rezera推迟在美2亿美元IPO</strong></p>\n  <p>开发口服NLRP3炎症抑制剂、管线已推进至III期临床的生物科技企业Rezera于近日表示将暂缓上市。该公司此前申报IPO，计划发行1670万股，发行区间11–13美元，募资2亿美元。药企葛兰素史克作为新投资方及其关联方，承诺最高认购2500万美元份额，占本次发行规模的13%。（财联社）</p>\n  <h2>大公司财报</h2>\n  <p><strong>爱奇艺：第三季度总收入60.1亿元，Non-GAAP运营利润2500万元</strong></p>\n  <p>36氪获悉，爱奇艺发布截至2026年9月30日未经审计的第三季度财报。三季度爱奇艺总收入60.1亿元。其中，会员服务收入39.7亿元，在线广告服务收入12.8亿元，内容发行收入4.0亿元，其他收入3.6亿元。Non-GAAP（非美国通用会计准则）下的运营利润为2500万元。</p>\n  <p><strong>百度：第三季度营收308亿元，AI云基础设施收入同比增长94%</strong></p>\n  <p>36氪获悉，百度发布2026年第三季度财报，财报显示，三季度百度实现营收308亿元；一般性业务收入250亿元，同比增长1%；AI业务收入132亿元，占百度一般性业务收入53%，已连续三季占比过半。报告期内，百度AI云基础设施收入82亿元，同比增长94%；AI应用收入26亿元；AI原生营销服务收入24亿元。</p>\n  <p><strong>小鹏集团：第三季度营收242.8亿元，同比增长19.1%</strong></p>\n  <p>36氪获悉，小鹏集团发布2026年第三季度财报，财报显示，小鹏集团三季度实现营收242.8亿元，同比增长19.1%；净亏损8.7亿元，上年同期净亏损3.8亿元。三季度汽车总交付量为118390辆，同比增加2.1%。对于2026年第四季度，公司预期汽车交付量将介乎169000至174000辆，按年增加约45.38%至49.68%，按季增加约42.75%至46.97%；总收入将介乎304亿元至318亿元，按年增加约36.61%至42.90%，按季增加约25.23%至30.99%。</p>\n  <p><strong>亚瑟士集团：前三季度净销售额达到8051亿日元，同比增长28.8%</strong></p>\n  <p>36氪获悉，亚瑟士集团公布2026年前三季度财务业绩。截至2026年9月30日的2026年前三季度财务数据，净销售额达到8051亿日元，同比增长28.8%（按汇率中性计算，同比增长19.2%）；营业利润达到1755亿日元，同比增长37.5%（按汇率中性计算，同比增长28.2%）；归母净利润达到1147亿日元，同比增长32.9%。</p>\n  <h2>酷产品</h2>\n  <p><strong>小马智行与丰田合作的第七代铂智4X Robotaxi启动示范运营</strong></p>\n  <p>36氪获悉，11月16日，小马智行与丰田合作研发并量产的第七代铂智4X Robotaxi在广州正式投入示范运营，面向公众开放L4级自动驾驶服务，成为双方七年自动驾驶合作的重要里程碑。该车搭载小马智行第七代车规级自动驾驶系统，采用丰田面向L4级自动驾驶设计的车辆平台与冗余化控制系统，可应对暴雨、夜间、拥堵等复杂场景。</p>\n  <p><strong>iPhone Duo 2原型机或有Face ID</strong></p>\n  <p>11月16日，据科技博主马克·古尔曼最新消息，苹果正在规划未来几代iPhone Duo折叠屏手机的升级方向，其中Face ID面容识别和操作按钮将成为优先推进的两项功能。不过，受研发进度影响，第二代机型能否搭载Face ID仍存在变数。</p>\n  <p>据悉，苹果工程师已经开发出搭载Face ID的iPhone Duo 2原型机，目前正在尝试将面容识别系统集成到手机外屏中。如果最终实现，用户无需展开手机，就能直接通过外屏完成面容解锁，体验看齐iPhone 18 Pro。（快科技）</p>\n  <h2>投融资</h2>\n  <p><strong>“英伟芯”完成累计数亿元多轮融资</strong></p>\n  <p>36氪获悉，近日，下一代高速光互连解决方案提供商“英伟芯”宣布，已分阶段完成Pre-A、Pre-A+系列融资，累计金额数亿元。其中，Pre-A轮融资由上海科创集团和上海未来产业基金领投，浦东创投旗下浦东天使基金参与跟投；Pre-A+轮由经纬创投和中金资本旗下基金领投，老股东持续加注。所募资金将重点用于硅光芯片、NPO/CPO/OIO光引擎的研发迭代、量产产品的批量交付、高端人才扩充以及头部客户导入，持续推进国产AI高速光互连产业链自主可控。</p>\n  <p><strong>“途深智合”完成Pre-A及Pre-A+轮数亿元融资，凯乘资本担任长期独家财务顾问</strong></p>\n  <p>近日，“途深智合”连续完成两轮合计数亿元 Pre-A 轮及 Pre-A+ 轮融资。Pre-A轮融资由上海科创集团领投、中生引领、舟山途毅等机构共同投资；Pre-A+轮融资由金鼎资本、镁伽科技、清科控股等机构联合投资。凯乘资本担任长期独家财务顾问。本轮融资所募资金将主要用于：加速自研管线推进，持续升级ToursynClaw一站式AI药物设计平台，加强团队运营与市场拓展。</p>\n  <p><strong>整理丨</strong>宋清瑜</p>", "category": "tech", "published_at": "2026-11-17T00:11:01+00:00", "fetched_at": "2026-11-17T06:14:44.164564+00:00", "fingerprint": "7c65d3ddcc5797d2"}, {"source": "36氪 - 最新文章", "title": "36氪创意项目征集赛 · 第二期正式开启！", "url": "https://36kr.com/p/4073250329318534?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_a70284852a064a008e72a18aebb0789b@5284654_oswg1656416oswg1828oswg860_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">创意项目征集赛第二期正式开启！</p>\n  <p>36氪创意项目征集赛第二期正式启动！</p>\n  <p>本期继续面向不同领域、不同发展阶段的创业项目及创新创意开放征集，通过项目报道、公开展示和大众投票，让更多有价值的想法走到台前。</p>\n  <p>无论你正在打磨一款产品、探索一种新的商业模式，还是已经组建团队并开始落地实践，都可以来参与。</p>\n  <p>入选项目将有机会角逐「创意项目TOP10」，获得36氪专访、榜单推荐及多渠道曝光，让项目获得更多展示机会。</p>\n  <p>&nbsp;</p>\n  <h2><strong>一、什么样的项目值得报名？</strong></h2>\n  <p><strong>不设赛道限制，期待更多有意思的创意。</strong></p>\n  <p>无论是AI、机器人、硬科技、消费、企业服务、医疗健康，还是先进制造、出海等领域，只要有创新想法和实际探索，都欢迎报名。</p>\n  <p>本次活动不设融资阶段、企业规模及发展成果门槛。</p>\n  <p>已经成立公司的创业团队；</p>\n  <p>正在产品研发或市场验证的早期项目；</p>\n  <p>有明确创意、正在寻找落地机会的个人或团队。</p>\n  <p>我们希望看到不同阶段、不同方向的项目，也希望让更多尚未被广泛关注的创新想法获得展示机会。</p>\n  <p>&nbsp;</p>\n  <h2><strong>二、活动日程</strong></h2>\n  <p><strong>项目报名期：2026.11.17—2026.12.06</strong></p>\n  <p>开放项目报名，提交项目资料及报道申请，36氪将对报名项目进行审核。</p>\n  <p><strong>公开评选期：2026.12.07—2026.12.13</strong></p>\n  <p>通过审核并完成报道发布的项目进入公开展示及大众投票环节，参与本期「创意项目TOP10」评选。</p>\n  <p>&nbsp;</p>\n  <h2><strong>三、如何参与评选？</strong></h2>\n  <p>项目提交报道并通过审核后，将由36氪发布项目报道文章。</p>\n  <p>本期继续采用<strong>公开展示、大众投票</strong>的评选方式，最终根据各项目报道文章页底部的点赞量进行排名，确定本期获奖名单。</p>\n  <p><strong>项目审核与展示：</strong></p>\n  <p>工作人员将通过微信通知入选项目。所有通过审核并进入公开展示环节的项目，均可参与本期大众投票。</p>\n  <p><strong>大众投票：</strong></p>\n  <p>项目报道发布后，项目方可以邀请投资人、客户、朋友、创业者及其他关注项目的人参与点赞，让更多人了解项目，为认可的创意助力。</p>\n  <p><strong>排名与结果公布：</strong></p>\n  <p>投票截止后，根据各项目报道文章页底部的最终有效点赞量进行排名，并据此确定获奖名单。</p>\n  <p>最终产生本期「创意项目TOP10」。</p>\n  <p><strong>TOP1—TOP10项目均可获得对应的36氪项目推荐权益。</strong></p>\n  <p>&nbsp;</p>\n  <h2><strong>四、入选TOP10，能获得哪些资源？</strong></h2>\n  <p>本期奖项分为第1名、第2—3名、第4—10名三个梯队，根据最终排名匹配不同的项目推荐资源。</p>\n  <h3><strong>第1名</strong></h3>\n  <p>36氪项目推荐视频专访：围绕项目产品、团队及业务进展进行视频专访，并分发至36氪官网、抖音、小红书、B站、视频号等新媒体渠道。</p>\n  <p><strong>36氪项目推荐周榜单：</strong>「36氪项目新势榜」TOP1重点推荐，并在36氪官网、36氪项目推荐公众号等渠道获得榜单曝光。</p>\n  <p>项目宣发：36氪项目推荐公众号、36氪官网发文宣发大赛获奖项目，进行专题介绍及推广。</p>\n  <p>运营位曝光：36氪官网首页Banner曝光1天、PC首页信息流No.15位置曝光1天、APP项目推荐资讯页Banner曝光1天。</p>\n  <p><strong>36氪定制实物礼包：</strong>《新经济看36氪》书籍×1、《信号》书籍×1、36氪太空人勋章×1、36氪定制帆布袋×1。</p>\n  <h3><strong>第2—3名</strong></h3>\n  <p>36氪项目推荐视频专访：围绕项目产品、团队及业务进展进行视频专访，并分发至36氪官网、抖音、小红书、B站、视频号等新媒体渠道。</p>\n  <p><strong>36氪项目推荐周榜单：</strong>「36氪项目新势榜」重点推荐，并在36氪官网、36氪项目推荐公众号等渠道获得榜单曝光。</p>\n  <p>项目宣发：36氪项目推荐公众号、36氪官网发文宣发大赛获奖项目，进行专题介绍及推广。</p>\n  <p>运营位曝光：APP项目推荐资讯页Banner曝光1天。</p>\n  <p><strong>36氪定制实物礼包：</strong>《信号》书籍×1、36氪太空人勋章×1。</p>\n  <h3><strong>第4—10名</strong></h3>\n  <p><strong>36氪项目推荐周榜单：</strong>「36氪项目新势榜」重点推荐，并在36氪官网、36氪项目推荐公众号等渠道获得榜单曝光。</p>\n  <p>项目宣发：36氪项目推荐公众号、36氪官网发文宣发大赛获奖项目，进行专题介绍及推广。</p>\n  <p>实物奖励：36氪太空人勋章×1。</p>\n  <p>&nbsp;</p>\n  <h2><strong>五、如何报名参与？</strong></h2>\n  <p><strong>扫描下方二维码，提交项目报道申请。</strong></p>\n  <p>在活动报名期内，通过「36氪项目推荐」提交项目资料及报道申请即可参与。</p>\n  <p>提交项目报道后，36氪将对项目进行基础审核。工作人员会在3个工作日内添加报名时填写的微信（请确保提交的手机号可以顺利搜索到微信），并跟进后续报道事宜。</p>\n  <p><strong>项目报道正式发布后，即视为成功参与本期活动。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_88be712f091843c9aa6e766a88ed5fda@5284654_oswg85954oswg570oswg219_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码联系</p>\n  <p>&nbsp;</p>\n  <p><strong>第二期征集现已开启，期待看到更多有想法、有创意的项目。</strong></p>\n  <p>让好的创意不止停留在想法里，也让更多值得关注的项目，被更多人看见。</p>", "category": "tech", "published_at": "2026-11-17T02:55:16+00:00", "fetched_at": "2026-11-17T06:14:44.164557+00:00", "fingerprint": "90e39b171fc135d2"}, {"source": "36氪 - 最新文章", "title": "前安克CMO创办的AI可穿戴硬件再获新融资，产品已量产｜硬氪首发", "url": "https://36kr.com/p/4072342767047814?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，AI Memory智能硬件公司「穗升科技」近日完成数千万元Pre-A轮融资，本轮由NexTide Capital、阿尔法公社投资。资金将重点投入长期记忆引擎、主动式Agent的体验优化，拓展家庭、团队场景，推进硬件量产交付，并搭建海外渠道、完善本地化交付能力。</p>\n  <p>穗升科技成立于2025年，旗下品牌Memoket以可穿戴硬件为入口，结合自研底层长记忆引擎，提供能够理解用户前情、主动与用户交互的Personal Agent。首款硬件Gem贴合用户现有佩戴习惯，可单独佩戴，也可以配件形式与智能手表搭配使用，无感收录现实对话，并支持在App、桌面端跨会话回溯、检索和调用信息。</p>\n  <p>该款产品在2026年9月开启量产，同步登陆美国亚马逊与品牌官网；10月进入日本市场，硬件销量及软件订阅收入均实现翻倍增长。</p>\n  <p>创始团队具备深厚的消费电子与AI产品操盘经验。创始人王时远为前安克创新全球CMO、中国区总裁，核心成员中包含3名连续创业者，曾任职于安克、字节、华为、腾讯及头部AI应用企业，能力覆盖大规模模型训练、AI应用产品定义、可穿戴硬件设计、供应链与全球商业化。部分成员已合作超过10年，在长期共事中形成了从底层技术到全球渠道的完整闭环能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_3cd8257ac8da4c6ebe702ec250e8635b@6022551_oswg530099oswg1080oswg568_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Memoket可穿戴硬件Gem（图源/企业）</p>\n  <p>AI硬件正处在从“记录”到“理解”的关键拐点。</p>\n  <p>过去，大量产品聚焦问答场景，硬件负责收音、软件生成总结，用户提问、Agent给出答案。这套模式在信息检索场景中成立，但在现实物理世界中，对话和决策是连续发生的。信息的价值往往并不在单次对话本身，而关乎它能否和数月前的口头约定、上周调整的预算、明天即将推进的会面形成关联。</p>\n  <p>在咖啡厅见客户、在办公室推进项目、到现场确认进度，中小企业主每天都在大量对话中做决定。预算变了、交期调整了、答应客户的事还没跟进。这些信息散落在不同时间和地点，一旦遗漏一个细节，就可能带来返工、损失或信任的消耗。</p>\n  <p>当AI记忆被框定在单次交互之内，它就无法感知上下文的变化，更难以在关键时刻主动提供支持。伴随拾音与转写逐渐成为智能设备的基础能力，真正的分水岭开始转向跨时序上下文的串联能力。</p>\n  <p>“传统AI产品记录的是切片，而人的工作和生活是连续的。”穗升科技创始人兼CEO王时远告诉硬氪，“如果AI不能理解你之前发生了什么，它就永远只是一个被动响应的工具，而不是一个能帮上忙的伙伴。”</p>\n  <p>这正是穗升科技所切入的空白地带。从被动记录走向主动理解，从单次问答走向长期记忆，让轻量化硬件成为物理世界与数字世界之间的连续记忆载体。</p>\n  <p>在AI硬件层出不穷的今天，形态的选择本身就是一种战略判断。眼镜能捕捉视线，戒指能监测体征，而在王时远看来，选择手环配件作为Personal AI入口，有其独特的合理性。</p>\n  <p>第一层考量是佩戴的持续性。Personal AI的前提是持续在场，如果设备需要用户额外花精力去佩戴、摘取或频繁操作，使用频次就会不可避免地衰减。手环是已经被市场长期验证过的形态，用户天然具备佩戴习惯。</p>\n  <p>Gem在设计上提供了两种选择，既可以作为独立手环佩戴，也可以直接挂在用户已有的手表表带上。无论哪种方式，它都是在用户原本就习惯佩戴的腕部位置增加仅11克重量，不需要改变日常行为，就能实现全天候的无感记录。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261116/v2_adc315ed069446948efdf370730f8208@6022551_oswg1604738oswg2208oswg1384_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Memoket可穿戴硬件Gem（图源/企业）</p>\n  <p>第二层考量是数据获取的密度与质量。中小企业主的核心信息场景，在于面对面的物理世界对话。Gem的拾音能力能够覆盖日常交流，将物理世界中稍纵即逝的语言，转化为可被理解、可被调用的数字资产。相比之下，其他穿戴形态在兼顾持续拾音与全天候佩戴时，往往面临更复杂的物理限制，很难两全。</p>\n  <p>“AI硬件本质上是让AI拥有‘触角’。”王时远表示，“手环是目前我们团队认为最贴近这个触角角色、且用户最愿意长期佩戴的形态。它不打扰你，但它一直在场。”</p>\n  <p>硬件完成感知采集，软件负责信息结构化梳理，而自研长记忆引擎KITE，决定了这套Personal AI体验的上限。</p>\n  <p>传统的交互范式里，记忆的责任主体始终是用户。用户需要会后回看录音、见客户前翻找历史对话、在项目推进中手动整理待办；即便AI可以加速摘要和检索，本质上依然是等待用户调取的被动工具。</p>\n  <p>Memoket的KITE引擎，正是为打破这种局限设计。多数AI系统的记忆局限在单次对话，信息彼此割裂；而KITE可以跨会话串联时序线索，它在LoCoMo与LongMemEval-S两项长对话记忆基准上，目前准确率分别可达到93.51%和85.60%，考核重点就是AI能否从大量分散对话里定位信息、跨越会话边界建立连续上下文。</p>\n  <p>“记忆是主动式AI的基础设施。如果记忆不准确、不连续，所有主动推荐、提前提醒都无从谈起。用户不会信任一个记错事情的助手。”王时远说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261116/v2_c0f3b277de8541b0ad09597e0a8945f7@6022551_oswg1820727oswg1572oswg940_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">自研长记忆引擎KITE（图源/企业）</p>\n  <p>依托这套长记忆底座，Memoket已接入Google Calendar、ChatGPT、Claude、Slack、Notion等工具，用户可在App、桌面端回看对话、跨会话检索，把信息直接融入工作流。</p>\n  <p>同时，基于这套记忆能力，产品功能下一步的突破方向，是探索主动交互的能力边界。硬氪了解到，本月Gem App端将上线Personal Agent Beta测试版本，核心功能是增加实时上下文弹窗提醒，让AI能够自主识别用户沟通中的待确认事项、未履约约定，在合适时机给到用户提示。</p>\n  <p>以客户洽谈场景为例，当用户和客户沟通时，设备持续采集对话，KITE会同步比对历史交流记录，识别尚未确认的约定与待跟进事项，并在App出现弹窗提示。</p>\n  <p>“我们不是在做一个去噪更好的录音器，也不是在做一个更精准的会议纪要工具。我们关注的是，每一次调用能否真正解决用户工作中的具体问题。少遗漏一次承诺，少做一次返工，在关键时刻接上之前的线索。”王时远说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261116/v2_685c378e2d73405f91c0893006fcb4b5@6022551_oswg1465620oswg1588oswg1064_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2026年10月进入日本市场（图源/企业）</p>\n  <p>在AI大模型能力逐步平权、硬件方案加速成熟的背景下，单纯比拼参数或功能的边际效应正在递减。真正构成壁垒的，是能否持续获取高质量的、真实场景下的个人数据，能否建立长期记忆，并在理解用户的基础上主动提供价值。</p>\n  <p>穗升科技以手环为入口，以长记忆引擎为底座，将产品从“被动响应”推向“主动服务”。随着用户与AI的长期相处，记忆持续更新、理解不断加深，Personal AI的价值将不再是单点功能的堆叠，而是一个随时间增长的、不可替代的个人数字资产。</p>\n  <p><strong>以下为硬氪与穗升科技创始人王时远的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：当手机和智能手表在“一站式满足”上越来越强，未来用户是否还需要额外佩戴一个AI录音器或Memory配件？</strong></p>\n  <p><strong>王时远：</strong>从客观的商业规律来看，对于需求频率极低的轻度用户，手机和智能手表的一站式功能确实足够了。但移动互联网过去十年的发展经验表明，当通用设备走向功能大而全时，垂直领域必然会分化出一批不被“一站式”满足的专业用户，这就是独立AI硬件的结构性机会。</p>\n  <p>我们目前的早期用户画像非常聚焦，以高频决策、高对话密度的中小企业主为主，目前积累了数千多名早期用户，基本符合我们的初始设计。对这类人群而言，通用设备在专业场景下存在明显的物理与体验摩擦。</p>\n  <p>比如在Apple Watch上录音，极易被来电或通知打断；即便录完了，通用系统通常只给出一段摘要，缺少原始文件，想要接入大模型深度处理还需要手动导出。对于需要高频回溯、建立长期记忆的用户来说，这种数据链路是断裂的。他们需要的是一个更专业、无感且链路完整的独立工具。</p>\n  <p>未来的Personal AI大概率会需要一个综合性入口，但很难一个通用Agent在所有细分场景里都做到最好，大家都在找通用设备覆盖不到的垂直缝隙。我们相信穗升在这一波需求中切入得足够早，且抓住了最核心的一批刚需人群。</p>\n  <p><strong>硬氪：即将上线基于上下文的主动式Personal Agent Beta功能，它在交互上会带来哪些实质改变？</strong></p>\n  <p><strong>王时远：</strong>我们计划将上线基于上下文的主动式Personal Agent功能。这是我们从“被动记录”向“主动服务”跨越的关键一步。</p>\n  <p>过去的AI硬件大多是“事后总结”，但真实决策往往发生在对话进行之中，一旦某个承诺、待确认事项或关键问题被错过，事后再补就已经产生了沟通成本。Memoket 要做的，是把AI辅助的节点从“会后”提前到“事中”。</p>\n  <p>用一个具体场景来理解。用户此前已经和同事约定，本次会议要确认一项交付节点。会议开始后，Gem会持续采集现场对话，音频实时上传云端；KITE长记忆引擎同步检索用户历史会话、日程与待办线索，识别出“约定确认但尚未提及的事项”。当对话节奏进入合适窗口，系统会通过App主动弹出提醒，告诉用户“本次应确认交付节点”。这个提醒发生在沟通过程中，而不是等会议结束后再生成一份静态纪要。</p>\n  <p>当然，这类 “事中提醒” 对工程链路要求很高。它不是简单的语音转写，而是一条包含实时音频流传输、云端上下文比对、历史记忆检索、端侧提醒触达的完整链路。其中最核心的指标是延迟：如果提醒能在几秒内出现，它会像一个贴身助理；但如果延迟过长，用户已经进入下一个话题，提醒就会显得突兀甚至无效。因此，我们在Beta阶段重点优化端到端延迟，目标是让提醒更贴近对话现场的自然节奏。</p>\n  <p>我们的核心定位是做一个基于Context的主动式Agent，而非单纯的会议纪要工具，其壁垒在于信息串联能力，能把用户跨时间、跨设备的分散信息建立关联，最终转化为精准的主动提醒。</p>\n  <p><strong>硬氪：行业都在寻找大模型在物理世界的落点，大家也把这类随身硬件视为重要的Personal AI入口。在未来的竞争中，你认为决定这个入口成败的关键壁垒是什么？</strong></p>\n  <p><strong>王时远：</strong>相比纯软件Agent，穿戴形态的录音硬件给用户的感知更具象、更实在，是可触摸的交互载体。</p>\n  <p>Memoket并不追求做一个全能助手，核心是帮用户捕捉那些有业务价值、但很容易被忽略的对话细节，并且在恰当的时机给到提醒。</p>\n  <p>过去大家用手机录音，本质逻辑没有变，人先记住这件事，再主动打开设备、事后检索调取，记忆的主体还是用户。而穗升想翻转这个关系，由硬件持续感知、长记忆引擎完成信息沉淀，记忆的主体交给系统，用户不必再耗费精力去留存、回溯零散细节。这也是我们团队长期技术积累最终落地的方向，是切入这个赛道的底层逻辑。</p>\n  <p>长远看，录音穿戴不会是唯一的Personal AI入口，但它在“捕获物理世界对话”这件事上，有独特的优势。不同形态会各自承接不同诉求，通用终端满足轻量化需求，垂直穿戴硬件服务高频、高价值的线下沟通场景，两条路线会长期并存。</p>", "category": "tech", "published_at": "2026-11-17T03:00:00+00:00", "fetched_at": "2026-11-17T06:14:44.164549+00:00", "fingerprint": "31b1d1447f6e523a"}, {"source": "36氪 - 最新文章", "title": "业绩快报 | 爱奇艺Q3Non-GAAP运营盈利，内容生态转型与AI战略初显成效", "url": "https://36kr.com/p/4073327210304649?f=rss", "summary": "<p>11月16日，爱奇艺（NASDAQ:IQ）发布2026年第三季度财报。报告期内，公司保持核心业务领先的同时，继续推进“转型长视频社交媒体”与“All in AI”两大战略。三季度，平台内容供给进一步扩大，内容成本结构持续优化，Non-GAAP运营利润重回盈利。</p>\n  <p>数据显示，三季度，公司实现总收入60.1亿元（人民币，下同），Non-GAAP运营利润2500万元。分业务看，会员服务收入39.7亿元，在线广告服务收入12.8亿元，内容发行收入4亿元，其他收入3.6亿元。</p>\n  <p><strong>内容领先是爱奇艺发展的基石。</strong>三季度，爱奇艺长剧集、电影和少儿内容季度云合总市占率保持行业第一，中剧云合总市占率首次登顶。其中，长剧《重器》热度值突破9000，刑侦中剧《重案六组：消失的警号》分账票房超过5700万元，刷新中剧行业分账记录。与此同时，海外业务同样保持高速扩张，海外会员收入同比增长近30%，拉丁美洲地区的会员收入同比增长强劲。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261117/v2_f124f500a0a34eceaba67df875ca7d31@1267484143_oswg1728021oswg1268oswg714_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>在保持核心优势基础上，爱奇艺通过分账模式加速重构内容投资逻辑。</strong>三季度，公司进一步完善去中心化创作者生态，通过爱奇艺号与纳逗Pro的协同打通，为创作者提供数据分析与创作支持。当季，爱奇艺号内容上传量同比增长超360%，平台新上线分账长篇内容总量环比增长超200%，带动分账收入环比两位数增长。</p>\n  <p>在当天财报电话会上，爱奇艺CEO 龚宇表示&nbsp;，分账模式在丰富内容供给的同时，也带来了内容成本结构的改善。通过将部分内容成本从固定投入转为按效果分成，平台能降低制作投入，改善现金流表现。同时，收益和播放效果绑定，有助于激励制作方优化预算分配，提升内容投资效率。</p>\n  <p><strong>内容供给扩充的另一个重要路径是以AI赋能内容制作，实现提质增效。三季度财报显示，</strong>短剧与漫剧数量呈指数级增长，动漫、少儿、中剧和电影等长视频内容数量均实现环比两位数增长。短剧、漫剧正是以AIGC为主力供给的品类，动漫与儿童品类由于CG技术成熟度高，AI渗透最快。三季度AI制作的《天子传奇：姬发篇》《天子传奇：洪武大帝》两部作品，相比传统制作方式，制作成本缩减50%–80%，制作周期缩减80%&nbsp;。<strong>爱奇艺首席内容官王晓晖介绍，平台采取AI生成、实拍与AI混制“双轨并行”策略，逐步从短剧、漫剧向中剧、长剧延伸。&nbsp;</strong>已经上线的《灵魂摆渡》浮生梦系列三部AI网络故事片，累计分账票房突破1400万元，每部均在首周收回制作成本。“目前约有20个长剧项目，使用实拍和AI结合的混制模式进行制作，这也是未来爱奇艺的重点探索方向。”他表示，AI与真人实拍的深度混制作品《天行九歌之举世无双》预计2027年上线。</p>\n  <p>龚宇表示，AI不只是降低制作成本，而是让优秀的创作团队、有影响力的IP与AI工具结合，用更短的周期、更可控的投入，把创意变成作品，推动内容成本实现结构性、可持续的优化。</p>", "category": "tech", "published_at": "2026-11-17T04:31:40+00:00", "fetched_at": "2026-11-17T06:14:44.164533+00:00", "fingerprint": "05b947e36880a5da"}, {"source": "少数派", "title": "Rosetta 2 即将退役，Mac 老应用何去何从？", "url": "https://sspai.com/post/118100", "summary": "Apple在Mac电脑的发展历程中经历过数次架构转换。其中最广为人知的，当属2005年从PowerPC转向Intelx86架构，以及从2020年启动、由Intelx86转向ARM64架构的AppleS ...<a href=\"https://sspai.com/post/118100\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-16T07:37:51+00:00", "fetched_at": "2026-11-17T06:14:41.641526+00:00", "fingerprint": "92035a1643bf75e5"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/119148", "summary": ">下载少数派客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/119148\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-16T10:09:47+00:00", "fetched_at": "2026-11-17T06:14:41.641520+00:00", "fingerprint": "26d74ecd0cc1520f"}, {"source": "少数派", "title": "派早报：OPPO 发布 Reno17 系列、影石发布 Insta360 Toast 墨水屏相纸等", "url": "https://sspai.com/post/119160", "summary": "少数派的近期动态我们已开设专页，汇总展示「优秀作者评选」奖项及结果。「优秀作者评选」是编辑部自2023年起实行的机制，于每季度结束后，评选该季度贡献突出的现有作者，以及涌现出的有潜力新作者。获奖者会获 ...<a href=\"https://sspai.com/post/119160\" target=\"_blank\">查看全文</a>", "categ
