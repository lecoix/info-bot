h, which should give you [&#8230;]", "category": "tech", "published_at": "2026-07-05T16:00:00+00:00", "fetched_at": "2026-07-06T02:45:16.807341+00:00", "fingerprint": "2478e3dd36472f08"}, {"source": "The Verge", "title": "Mr. Lif’s Emergency Rations EP is post-9/11 hip hop at its most daring", "url": "https://www.theverge.com/entertainment/961484/mr-lif-emergency-rations-ep-post-9-11-review", "summary": "There was a period in the early aughts when Definitive Jux (nee: Def Jux) seemed like it was going to be the future of hip hop. While the label featured plenty of experimental, boundary-pushing, and politically minded acts, Lif stood out as the most \"conscious rapper\" in the traditional sense. It was clear though, that [&#8230;]", "category": "tech", "published_at": "2026-07-05T18:30:00+00:00", "fetched_at": "2026-07-06T02:45:16.807334+00:00", "fingerprint": "6e9b865319ebd169"}, {"source": "The Verge", "title": "Some of the nation’s rich are letting AI teach their kids", "url": "https://www.theverge.com/ai-artificial-intelligence/961505/wealthy-ai-schools-alpha-forge-prep", "summary": "Most Americans don't trust AI. It's proven that it doesn't know what safe toppings for pizza are. People don't even want to listen to AI music. But none of that matters for some of America's wealthy, who are turning to AI to teach their kids instead of traditional schools. Companies like Forge Prep and Alpha [&#8230;]", "category": "tech", "published_at": "2026-07-05T22:30:54+00:00", "fetched_at": "2026-07-06T02:45:16.807324+00:00", "fingerprint": "62797d7741b41a29"}, {"source": "36氪 - 最新文章", "title": "鄂尔多斯、和达金服共同领投，「贻如科技」完成超亿元A轮融资｜36氪首发", "url": "https://36kr.com/p/3880060701388809?f=rss", "summary": "<p>36氪获悉，生物基皮革公司「贻如科技」完成超亿元A轮融资，本轮融资由鄂尔多斯集团与和达金服共同领投，巢生资本跟投，易凯资本担任独家财务顾问。本轮资金将主要用于推动公司商业化开拓与产能建设，并依托AI技术加速生物基皮革的技术革新与产品迭代。</p>\n  <p><strong>贻如科技成立于2021年，以合成生物学为底层技术，创造以生物基皮革为代表的新一代创新生物基材料</strong>——通过微生物发酵直接生产生物基树脂原料，经加工后制成皮革成品，实现碳排放降低80%以上、部分产品生产成本甚至低于传统油性PU产品、物理性能（耐磨、透气、柔韧）对标真皮水准，由此让大众消费品所需的高性能材料从石油基走向生物基。</p>\n  <p>2024年，贻如科技曾完成由星空资本领投的数千万元Pre-A轮，彼时创始人苏睿对36氪判断，商业化拐点“或许明年到来”。如今，这家长期待在“水面下”、鲜少露面的公司，在全球范围内的商业落地已经突进——<strong>截至2026年第一季度，其皮革产线年产能突破1600万平方米，今年以来的海外订单近亿元，全球化布局序幕也就此正式拉开。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_5c40b3ca463644dbb30fbbc59a10cacb@5748245_oswg304314oswg1271oswg1680_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如 × ANTA ZERO × Kris Van Assche 设计师系列 · 纯素皮革系列</p>\n  <h3>01&nbsp; 走出“实验室叙事”</h3>\n  <p>生物基皮革，尤其是以菌丝体为原料的“蘑菇皮”，曾是过去十年时尚可持续领域最受关注的方向之一。MycoWorks、Modern Meadow、Ecovative等海外公司都曾获得一线机构或奢侈品集团的投资。</p>\n  <p>热闹散场后，这批明星项目大多没跑下去——材料能做出来，但太贵、难以真正量产的瓶颈，使得它只能停在概念秀和小批量联名里。“生物基皮革更贵”，也成了消费者和品牌心照不宣的常识。&nbsp;</p>\n  <p>走到今天，传统皮革仍然普遍面临着碳排放高、供给波动大、品牌ESG压力上升等问题，市场对生物基皮革的兴趣并未消失。但行业的评价标准，已经从“能否做出来”转向“能否便宜且规模化地生产”。</p>\n  <p><strong>成本恰恰是贻如当下的壁垒所在。苏睿向36氪算了一笔账：在欧洲市场，品牌使用真皮的成本折合约300-400元/米，而贻如售价最高的皮革产品约200元/米，多数产品落在80-150元/米的区间，相当于将成本压至真皮的一半以下，“且透水、透气，比真皮更耐用。”</strong></p>\n  <p>背后原因在于，目前在全球范围内，能将生物基皮革做到规模化量产的公司都少之又少。苏睿称，行业内能稳定交付百万米以上的公司屈指可数，贻如也是极少数最早出发、且长期坚持“液体发酵做树脂、再涂覆成革”这条路径的企业。</p>\n  <p>让成本曲线持续下探的另一只手是AI。从菌株筛选、基因编辑设计，到液体发酵工艺的参数寻优与量产良率控制，贻如构建了全链路数据驱动的研发引擎，把生物材料的开发效率与放大成功率推向行业前沿。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_bb9cd692121c4f598a46f13680fdea4a@5748245_oswg1500194oswg1112oswg685_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如科技工厂发酵罐实拍图</p>\n  <p>在产品上，贻如以Mulkol系列做差异化布局：Mulkol-3定位评价人造革替代，采用偏硬质树脂，质感接近高强度工业用料，主打家具、装饰等平价人造革替代场景；Mulkol-5定位高级真皮替代，采用更软的弹性体材料，触感更接近羊皮与真皮，面向手袋、服装等中高端市场。苏睿还透露，针对海外奢侈品牌客户，公司另外推出了更高端的品牌HORA。贻如持续深耕奢侈品及品牌消费市场，通过稳定的产品供给与市场拓展，逐步构建起成熟的业务基础与品牌能力。</p>\n  <p>在此之上，贻如正面向更广阔的高分子生物基材料领域加速延展，逐步向上游材料端布局，着力构建覆盖全球的弹性体原料体系，并同步拓展膜材料与橡胶材料等多元应用方向，相关材料也将进一步走向消费品包装、工业薄膜及各类终端应用场景，持续拓宽产业边界与应用空间。</p>\n  <p>贻如自有研发团队围绕不同应用场景与性能需求持续推进材料开发与技术迭代，不断完善弹性体原料的自主研发能力与产品体系，推动公司从皮革业务出发，逐步迈向以原料开发为核心的材料与生物基创新平台型企业。在该方向上，鄂尔多斯集团旗下的电力冶金集团在可持续能源与低碳冶金及绿色化工材料领域具备深厚积累，并设有合成生物产业专业化平台，将与贻如形成从上游原料、中游生产到下游产品转化的全链条互补。</p>\n  <h3>02&nbsp; 迎来“商业化拐点”</h3>\n  <p>截至2026年第一季度，贻如已与服装、鞋履、箱包、家居、3C等多个应用领域的全球标杆客户达成商业合作：</p>\n  <ul>\n   <li>在运动领域，以安踏为例，贻如已与安踏建立持续深化的合作关系——2025年4月联名骜杰系列鞋款首发落地，同年11月ANTA ZERO × KRIS VAN ASSCHE一期产品开售，2026年3月Kris Van Assche合作系列二期产品开售，9个月内完成三轮迭代与商业合作，验证了生物基材料在头部运动品牌供应链中的可复制性与规模化潜力。</li>\n   <li>在渠道层面，贻如与国际知名面料经销渠道商益彩合作，作为核心经销渠道合作伙伴，借助其全球渠道资源加速产品在各行业的导入。</li>\n   <li>在多元场景层面，贻如已与亚朵、凯宾斯基等品牌围绕酒店与家居场景展开合作；在市政与公共空间领域，其产品已应用于上海南站、上海大宁公园等标杆性项目。</li>\n  </ul>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_097cbc45f86a459c8f66545b1c14ba53@5748245_oswg2873371oswg1112oswg1757_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如 × ANTA ZERO × Kris Van Assche 设计师系列 · 纯素皮革系列</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_97d0d72558564d4cb2cf75963999ff94@5748245_oswg781322oswg1295oswg867_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">贻如科技其他合作案例：酒店场景</p>\n  <p>此外，最值得一提的市场在欧洲——欧洲拥有众多高端时尚消费品牌，且对低碳、可持续材料有强烈而迫切的需求，是生物基皮革最具价值的战场之一。</p>\n  <p>据悉，贻如已在法国落地全资子公司SYNMETABIO，以此作为欧洲区域总部支点，联动英国、德国、意大利、土耳其及北欧各地合作渠道，全域辐射欧洲主要消费市场。在欧盟碳关税（CBAM）的政策背景下，贻如凭借材料的降碳与可持续优势，能为欧洲客户带来切实的成本优势与品牌宣传效应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_56992708b03d4c94bb6427af0902f252@5748245_oswg219967oswg1274oswg852_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">SYNMETABIO海外展会实拍</p>\n  <p><strong>苏睿透露，国际地缘冲突推高了传统供应链的成本，贻如的欧洲订单随之明显跃升，法国全资子公司SYNMETABIO累计接到的订单已接近一亿元，且“几乎全部来自奢侈品牌”。</strong></p>\n  <p>眼下，境外订单已占贻如总业务量的约三分之二，公司也为此搭起了海外质检、海关与运输团队。近半年内，贻如的团队也从约20人扩到了接近70人。</p>\n  <p>业务的快速扩张体现在方方面面，而撑起这些订单的是产能。<strong>贻如与上市公司聚杰微纤以轻资产模式合资成立安徽聚贻科技，目前皮革产线年产能已突破1600万平方米，二期工厂在建。据苏睿介绍，公司下半年还要陆续投产新的制成品工厂。</strong></p>\n  <p>苏睿坦言，贻如会将2026年当作“筹备上市的第一年”来对待，这对一家2021年成立、刚跑通工厂级规模的公司而言显得激进。在行业从“环保叙事”回归“成本与量产”的当下，一家能将皮革成本做到真皮一半以下、并已在欧洲收获过近亿元订单的中国公司，确实提供了一个值得关注的新样本。</p>", "category": "tech", "published_at": "2026-07-05T23:50:00+00:00", "fetched_at": "2026-07-06T02:45:16.698853+00:00", "fingerprint": "4be1d6ea09831d41"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨7-11指控耐克新鞋配色抄袭；A股新版交易规则今起施行；华尔街称苹果采购长鑫内存是为了压价", "url": "https://36kr.com/p/3883400536453381?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>苹果Siri AI秋季上线，仅限iPhone 15 Pro及以上机型</p>\n  <p>蒋方舟再回应被清华教授指控论文造假</p>\n  <p>张雪称负债接近1亿元，本月将还清全部债务</p>\n  <p>黑石集团放弃全球最大数据中心项目，意味着该建设计划已宣告破产</p>\n  <p>印度政府：正调查苹果手机信息泄露事件</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>7-11起诉耐克，指控其新鞋配色抄袭7-11标志性颜色</strong></p>\n  <p>据报道，跨国连锁零售公司7-Eleven（7-11）已在美国得克萨斯州联邦法院起诉运动品牌耐克，指控该公司计划于7月11日推出的运动鞋抄袭了7-11便利店标志性的橙、绿、红三色条纹设计。</p>\n  <p>7-11在2日向法院提交的诉状中称，耐克即将推出的Air Max 95运动鞋采用的颜色与7-11品牌商标极易混淆，消费者会将该设计与7-11品牌联系起来。此外，耐克将该运动鞋的发售日期定为7月11日，这一天恰逢该零售商一年一度的促销活动。（财联社）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_f43e9f51123a49c0b182203f92a08216@5667365_oswg919166oswg1012oswg1272_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">7-11与耐克对比图</p>\n  <p><strong>A股新版交易规则今起施行，主要有5大变化</strong></p>\n  <p>2026年4月24日晚，沪深北交易所修订发布交易规则，新版交易规则将于7月6日起施行。新版交易规则主要有五大核心变化：</p>\n  <p>1、盘后固定价格交易全面扩容。由创业板、科创板股票扩展至全部A股和交易型开放式基金。</p>\n  <p>2、上交所基金收盘阶段交易方式由连续竞价调整为收盘集合竞价，并通过集合竞价产生收盘价。</p>\n  <p>3、板风险警示股票价格涨跌幅限制比例由5%调整为10%。</p>\n  <p>4、深交所创业板引入做市商制度。</p>\n  <p>5、大宗交易机制优化。创业板股票协议大宗交易成交确认时间由15:00至15:30，调整为9:30至11:30、13:00至15:30。北交所无价格涨跌幅限制的股票大宗交易参考价调整为当日竞价交易实时成交均价。（中国证券报）</p>\n  <p><strong>华尔街投行分析称：苹果采购长鑫内存是为了压价</strong></p>\n  <p>近期，由于内存缺货涨价，苹果要采购中国公司的内存的传言已经成为业界的一大焦点，来自华尔街的投行机构给出的意见是苹果采购长鑫内存更多地是作为谈判策略压价。</p>\n  <p>他们认为苹果不太可能有实质意义采购长鑫的内存，原因有三点，第一是美国的政策限制，第二是技术指标达不到苹果的要求，第三是专利风险，三星海力士美光等公司掌握着关键的IP专利，用了之后有可能有法律风险。</p>\n  <p>报告认为苹果醉翁之意不在酒，实际上是想用这个消息来获得谈判优势，把它当作一个谈判筹码。在苹果与美、韩三大内存巨头（三星、海力士、美光）谈判2026年下半年至2027年的合约价格时，长鑫的存在会被苹果拿来施压，以此获得更低的采购价。（快科技）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>苹果Siri AI秋季上线，仅限iPhone 15 Pro及以上机型</strong></p>\n  <p>在今年6月的WWDC 26全球开发者大会上，苹果公司正式发布了基于Apple Intelligence架构的新一代Siri AI系统，标志着这款虚拟助手在语义理解和多任务执行方面迎来重大升级。随着今年秋季iOS 27稳定版的发布，Siri AI将正式向符合条件的用户推送。</p>\n  <p>根据苹果公布的兼容性策略，Siri AI的完整功能将严格限定在支持Apple Intelligence的设备上。在智能手机产品线中，只有iPhone 15 Pro、iPhone 15 Pro Max以及iPhone 16及后续机型能够支持该功能。在平板和电脑端，搭载A17 Pro芯片的iPad mini以及配备M1及以上芯片的iPad和Mac机型均在支持范围内。用户可通过查看设备“设置”中是否出现“Apple Intelligence与Siri”选项，来确认自己的设备是否具备升级资格。（环球网科技）</p>\n  <p><strong>三星存储芯片拟涨价20%，连续第三个季度大幅上调DRAM价格</strong></p>\n  <p>近日，有消息称三星电子正与客户谈判，计划将2026年第三季度通用DRAM平均售价比上一季度提高20%，其中LPDDR价格涨幅或超20%。若最终落地，这将是三星连续第三个季度大幅上调DRAM价格——此前一季度涨幅约90%，二季度涨幅50%至60%，上半年累计涨幅已超过2倍。高盛研报指出，全球存储市场供需不平衡已达到近15年高峰，AI服务器及推理卡需求激增是核心驱动因素。（第一财经）</p>\n  <p><strong>Anthropic拟在澳大利亚布局1.4GW数据中心算力</strong></p>\n  <p>7月5日，据报道，人工智能公司Anthropic计划在澳大利亚采购至少1.4GW数据中心算力，对应建设成本约150亿美元（约216亿澳元），远高于市场此前预期。该公司目标是在2027年底前启用至少1GW算力，并已在澳大利亚设立办公室推进本地化基础设施布局。（界面新闻）</p>\n  <p><strong>特斯拉限制员工AI使用开销，美国多家科技企业收紧AI支出</strong></p>\n  <p>据多家美国媒体3日报道，特斯拉公司将从本月6日开始，限制员工在人工智能工具上的开销。类似措施也被其他多家美国科技企业采用。据报道，特斯拉已向员工发出内部备忘录，宣布自7月6日起，每名员工每周在AI工具上的花费上限为200美元，超出部分须经主管批准。不过，特斯拉员工使用马斯克旗下xAI的Grok模型不计入200美元额度。据悉，Grok在特斯拉员工群体中接受度偏低，多数员工依旧选择使用Anthropic旗下的克劳德。（央视财经）</p>\n  <p><strong>千问智能体功能与服务将于7月15日正式下线</strong></p>\n  <p>据千问平台消息，千问智能体功能与服务将于2026年7月15日正式下线，下线后，用户将无法继续访问相关智能体配置及历史对话记录。（21经济网）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>蒋方舟再回应被清华教授指控论文造假</strong></p>\n  <p>青年作家蒋方舟7月5日在其个人社交平台再发文，题目为《关于肖鹰教授指控我论文“全面造假”的逐项说明》。文中称，肖鹰教授的指控存在系统性的夸大与失实（比如说作者论文“全面造假”），对于这些严重失实、足以损害作者名誉的指控，作者予以明确、坚决的否认。蒋方舟表示，已经于昨日（7月4日）报警，并且将会将相关材料递交给清华大学相关部门，以及用法律手段维护自己的利益。（界面新闻）</p>\n  <p><strong>张雪称负债接近1亿元，本月将还清全部债务</strong></p>\n  <p>7月4日，张雪发布视频称，这个月就不是亿万“负”翁了。张雪透露自己目前负债接近1亿元，这次卖了一点股份，卖完后就会把债务全部还清，“再也不欠钱了”。（界面新闻）</p>\n  <p><strong>高薪专业榜出炉，计算机跌出本科专业月收入前十</strong></p>\n  <p>近期，第三方社会调查机构麦可思研究院发布的《2026年中国本科生就业报告》显示，2025届本科生毕业半年后平均月收入为6435元，微电子科学与工程、电子科学与技术专业分别以7814元和7752元位列前两名，此前常居月收入排行前列的计算机科学与技术、软件工程则跌出前十。</p>\n  <p>前述麦可思报告统计的本科专业月收入前十位中，包括微电子科学与工程、电子科学与技术、光电信息科学与工程以及通信工程4个电子信息类专业，其毕业生主要进入半导体和其他电子元件制造业、通信设备制造业等领域。这意味着，从就业来看，集成电路、智能制造、新材料等与战略性新兴产业和先进制造业相关的专业表现突出。（中国新闻周刊）</p>\n  <p><strong>现货黄金站上4200美元</strong></p>\n  <p>36氪获悉，现货黄金早盘站上4200美元/盎司，创两周新高，日内上涨0.6%。</p>\n  <p><strong>山姆多款澳牛产品涨价，客服回应：牛肉供应链成本上升</strong></p>\n  <p>近日，山姆被曝多款澳牛产品调价，有消费者贴图山姆的澳牛价格大部分上涨30%以上，1200克的澳洲谷饲牛霖售价119.7元左右，目前价格161.7元，900克的澳洲谷饲肥牛薄片此前105.1元，当天价格123.1元。还有消费者表示，碎牛肉涨了10块一斤，牛腱子也涨了不少。</p>\n  <p>对此，山姆客服表示，受澳洲牛肉进口配额以及贸易政策影响，牛肉供应链成本上升，因此上调售价，为保障会员利益，山姆将尽可能承担成本压力，维持价格的合理性区间。（每日经济新闻）</p>\n  <p><strong>世界杯带火佛得角：旅行社火速上新万元定制游，机票酒店搜索量翻倍</strong></p>\n  <p>7月4日，美加墨世界杯1/16决赛，世界杯最大“黑马”佛得角与卫冕冠军阿根廷鏖战120分钟，最终以2:3憾负。虽然输了比赛，但这个此前在国内长期冷门的目的地，一夜之间进入了大量球迷和旅行者的视野。</p>\n  <p>记者注意到，近日多家旅行社火速上架了佛得角相关旅游产品，部分线路为新近定制，而机票和酒店的搜索热度也在急剧攀升。（蓝鲸新闻）</p>\n  <p><strong>黑石集团放弃全球最大数据中心项目，意味着该建设计划已宣告破产</strong></p>\n  <p>美国黑石集团旗下数据中心运营商QTS于2日宣布，已终止在美国弗吉尼亚州的数据中心项目，并撤回所有相关申报文件。这意味着，这座全球最大数据中心园区的建设计划已经宣告“破产”。</p>\n  <p>有分析认为，QTS放弃全球最大数据中心园区项目，反映出美国数据中心的建设热潮已遭遇阻力。民调机构盖洛普5月发布的一项调查显示，71%的美国民众反对在居民区附近建设数据中心，担忧主要集中在能源和水资源消耗、环境污染和噪音等问题。（观察者网）</p>\n  <p><strong>2026暑期档电影票房破20亿</strong></p>\n  <p>据网络平台数据，截至目前，2026年暑期档电影总票房（含预售）突破20亿元。2026年度电影总票房（含预售）突破177亿元。（央视新闻）</p>\n  <p><strong>韩国央行警示三星、SK海力士杠杆ETF或加剧市场波动</strong></p>\n  <p>7月5日，据报道，韩国央行警告称，与三星电子和SK海力士挂钩的单一股票杠杆交易型ETF，可能进一步加剧市场集中度、放大市场波动，并强化单边交易资金流。韩国方面称，韩国央行计划加强监测单一股票杠杆ETF对股市和金融体系的影响。（界面新闻）</p>\n  <p><strong>一部iPhone 17 Pro Max被封入美国250周年时间胶囊，计划于2276年开启</strong></p>\n  <p>为庆祝美国建国250周年，一座名为“AMERICA250”的大型时间胶囊于近日正式封存，计划于2276年美国建国500周年时开启。相应时间胶囊收录了来自美国各州具有代表性的物品，用于记录当代社会的面貌，参考FoxNews视频，一部星宇橙（Cosmic Orange）配色的iPhone 17 Pro Max也被置入胶囊中。（FoxNews）</p>\n  <p><strong>美光科技投资93亿美元扩建先进存储芯片项目，预计2028下半年出货HBM</strong></p>\n  <p>美光科技当地时间周六（7月4日）正式启动其位于日本西部广岛工厂的扩建工程。这项总投资达1.5万亿日元（约合93亿美元）的项目，旨在生产包括高带宽存储器（HBM）在内的先进存储芯片，以满足人工智能（AI）浪潮带来的旺盛需求。HBM是英伟达AI处理器的关键组件，工厂预计将于2028年夏季左右开始出货。</p>\n  <p>近期，美光、三星电子和SK海力士各自都宣布了扩充制造能力的计划。上周SK海力士宣布，计划投资80万亿韩元（约合514.6亿美元），在韩国忠清北道首府清州市新建一座NAND存储芯片工厂。（财联社）</p>\n  <p><strong>贝斯特：人形机器人业务仍处样品阶段</strong></p>\n  <p>贝斯特公告，公司股票连续3个交易日收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。公司关注到市场对人形机器人等热点概念关注度较高，但公司人形机器人零部件业务仍在样品阶段，2026年上半年相关样品实现营收22.30万元，占公司营收比重约0.03%，业务规模较小，对公司业绩不产生重大影响，未来收益存在重大不确定性。（第一财经）</p>\n  <p><strong>业内首个AI-eSIM产业协同平台成立</strong></p>\n  <p>36氪获悉，据人民邮电报，7月3日，在中国信息通信业发展高层论坛上，由中国移动发起的业内首个AI-eSIM产业协同平台——“中国通信企业协会AI-eSIM专业委员会”（以下简称：专委会）正式成立，中国移动物联网公司担任主任单位，天翼物联、联通华盛、火山引擎、腾讯云、观安信息等担任副主任单位。据介绍，专委会汇聚了运营商、芯片设计、算法研究、安全服务及模型应用等领域的头部企业40余家。</p>\n  <p><strong>印度政府：正调查苹果手机信息泄露事件</strong></p>\n  <p>印度电子和信息技术部秘书克里希南2日表示，政府正就塔塔电子大规模数据泄露事件展开调查。这也是印度政府首次就这起事件发声。克里希南说：“我们正在调查。”按他的说法，相关事件已上报负责印度网络安全的下属机构计算机应急响应小组。塔塔电子是苹果公司的零部件供应商，也是苹果手机在印度的主要代工厂之一。据路透社报道，一个团伙日前从塔塔电子窃取大量未公开机密数据并上传至暗网，包括未发布的iPhone 18 Pro零部件供应链信息和机型测试素材等。（新华社）</p>\n  <p><strong>美国启动3亿美元锂采购计划，拟用于补充国家国防储备</strong></p>\n  <p>美国国防部后勤局（DLA）于7月2日发布招标公告，计划通过一项为期5年的不定数量不定期合同，采购电池级碳酸锂，用于补充国家国防储备。本次采购总量上限约为1.6167万吨，合同总金额最高达3亿美元，最低保障采购金额约100万美元，投标截止日期为7月17日。该合同要求供应电池级碳酸锂纯度不低于99.5%，以粉末形态交付，并分阶段执行：首年采购约3657吨，随后逐年递减至第五年约2839吨。交付地点包括纽约州、内华达州、印第安纳州及俄亥俄州等DLA指定仓库。（界面新闻）</p>\n  <p><strong>4nm近售罄、部分8nm接近满载，三星晶圆代工开始选择性接单</strong></p>\n  <p>据报道，业内人士称，随着AI半导体需求升温、全球大型科技公司订单增加，三星电子晶圆代工部门已针对部分制程启动配额机制（allocation），将有限产能集中分配给较重要的客户和制程，将产能优先分配给现有客户，新客户订单则选择性承接。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>天山铝业：上半年净利润同比预增101.52%</strong></p>\n  <p>天山铝业7月5日发布业绩预告，预计2026年上半年实现归母净利润42亿元，同比增长101.52%。报告期内，受益于全球铝行业供需影响，公司电解铝产品销售价格显著上行；与此同时，公司140万吨电解铝绿色低碳能效提升项目按计划顺利推进，量价协同效应叠加公司一体化成本管控成效，电解铝板块盈利实现大幅增长。同时二季度公司下属全资子公司新疆生产建设兵团第八师天山铝业有限公司上调所得税率，影响当期所得税费用。</p>\n  <p>报告期内，公司下游铝深加工板块中，高纯铝受电解电容器行业需求增加等积极因素影响实现量价齐升，增厚公司盈利。同时铝深加工板块中各类铝箔产品市场需求旺盛，订单饱满，公司铝箔产量及良品率大幅提升，对整体利润形成正向贡献。（证券时报）</p>\n  <p><strong>奥来德：预计2026年半年度净利润同比增长492.49%-603.58%</strong></p>\n  <p>奥来德公告，预计2026年半年度归属于上市公司股东的净利润为1.60亿元-1.90亿元，同比增长492.49%-603.58%。业绩变动主要系设备业务核心竞争壁垒持续夯实，产品技术与市场卡位优势充分落地，相关业务收入大幅增长，盈利能力显著提升。（第一财经）</p>\n  <p><strong>浙富控股：预计2026年半年度净利润同比增长121%-156%</strong></p>\n  <p>浙富控股公告，预计2026年半年度归属于上市公司股东的净利润为12.50亿元-14.50亿元，比上年同期增长120.78%-156.11%。业绩变动主要系公司危废处置及再生资源综合利用业务保持稳健运营，产品销量稳步攀升，营业收入及盈利水平较上年同期实现较大幅度增长。（第一财经）原文链接</p>\n  <p><strong>招商轮船：上半年净利润同比预增214%—248%</strong></p>\n  <p>招商轮船7月5日发布业绩预告，预计2026年上半年实现归母净利润66亿元—73亿元，同比增加214%—248%。受供需结构变��及地缘局势等多种因素影响，国际油轮运输市场进入超级景气周期，报告期部分航线现货运费率创出历史新高；国际干散货市场受益于供需持续改善，BDI指数稳步回升。公司核心业务板块中，油轮船队承接一季度的优秀表现，二季度克服海峡封锁后油轮供过于求的阶段性困难，抓住市场机会再次取得良好业绩，环比一季度预计实现利润贡献增长50%左右；公司干散货板块表现同样出色，二季度业绩增速加快，环比一季度预计实现利润贡献增长170%左右。集装箱船队、滚装船队等也呈现稳步复苏趋势。（证券时报）</p>\n  <h2>投融资</h2>\n  <p><strong>具身智能公司光象科技累计完成数亿元天使轮融资</strong></p>\n  <p>近日，光象科技宣布完成累计数亿元天使轮融资，最新一轮融资由珠海科技产业集团、兴证资本、松禾资本、顺禧基金、慕华科创、See Fund、亿宸资本、上市公司行云科技等头部财投与头部产投深度参与，老股东零一创投、L2F光源创业者基金等持续加注。据悉，本轮资金将重点投入物理原生基座模型的研发迭代，并推进具身智能机器人产品的商业化交付。（每日经济新闻）</p>\n  <p>&nbsp;</p>\n  <p><strong>“零食消费”小调查</strong></p>\n  <p>明明没吃多少，零食账单却越来越长。这届年轻人，怎么越来越嘴馋了？&nbsp;</p>\n  <p>零食在年轻人生活中的地位似乎日渐重要。加班到九点，要靠一包“高蛋白肉干”撑到回家；下午路过便利店，顺手就拿一盒冷藏甜品、几颗现制卤味犒劳自己；周末，逛量贩零食店大采购成了日常解压方式——零食，悄悄占据了打工人的生活，成了忙碌日常中的“隐藏刚需”。&nbsp;</p>\n  <p>你买零食时，会因为“高蛋白、0糖、低卡”这些标签多拿一包吗？你多久会试一次没吃过的网红新品？你曾用零食代替过一顿正餐吗？在你心里，零食算一时嘴馋，还是一日续命？欢迎填写“零食消费小调查”，聊聊你心里最想推荐给大家的那款零食~&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_110000032f87442484f657adcfea5329@5667365_oswg6882oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“零食消费”小调查</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-07-06T00:02:20+00:00", "fetched_at": "2026-07-06T02:45:16.698847+00:00", "fingerprint": "278d8e4bc63e2849"}, {"source": "36氪 - 最新文章", "title": "2026，量子计算迟到的狂欢：能拿订单、奔赴IPO、市值破百亿", "url": "https://36kr.com/p/3883513899380744?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_cc7b1492ca7445ce866e3d611c6aae50@6221844_oswg609236oswg642oswg422_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/视觉中国</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>如果在七年前，有人告诉一个投资人，量子计算公司会有订单，还能在纳斯达克上市，市值破150亿美元，对方大概率会把这人当个骗子。</p>\n  <p>他们很多人都记得前几年那场“量子寒冬”。那一年，谷歌用量子处理器完成了一项计算， 200秒算出了超级计算机1万年才能得出的结果。人们以为， 量子霸权实现了，量子计算机真的能解决经典计算机无法解决的问题。</p>\n  <p>狂欢转瞬即逝。那终究只是一次炫目的实验，“大家很快意识到，现阶段的量子计算机不能做任何实用有意义的工作。”一位投资人回忆。</p>\n  <p><strong>谁也没有想到，2026年开始，整个行业忽然开始加速。根据投中嘉川CVSource数据显示，仅今年一季度，国内量子赛道融资总额已达32.04亿元，超过2025年全年。有头部公司不到半年就拿下超过10亿元融资。“融资变得比以往任何时期都容易。” 一位做量子计算的创业者告诉硬氪。</strong></p>\n  <p>二级市场也出现了标志性的事件。6月4日，全球最大量子独角兽Quantinuum登陆纳斯达克。这家营收仅3090万美元、净亏损1.93亿美元的公司，市值已经超150亿美元（约合人民币1000亿元）。&nbsp;</p>\n  <p>国内公司也看到了IPO曙光。本源量子完成近30亿元Pre-IPO轮融资，投前估值达210亿元，创下国内量子计算领域最大单笔融资。这笔投资背后，是中国兵器集团和多个省级政府平台。</p>\n  <p><strong>一位长期关注硬科技的投资人告诉硬氪：“现在的问题不是‘要不要投’，而是‘能不能投进去’。好项目太少，钱太多，大家都在抢。”</strong></p>\n  <p>量子计算不是新故事。过去十年，这个赛道每隔几年就会掀起一轮讨论，但每次都以“技术还早”“商业化太远”收场。投资人们听过太多“量子霸权”的概念，见过太多停留在PPT上的Demo，最后选择观望。</p>\n  <p>但2026年的这一轮热潮不一样。不少公司开始秘密递表，资本回报路径变得清晰，投资人愿意下注。更重要的是，一些公司告诉硬氪，他们已经拿到了金融、安防等领域真实的订单。</p>\n  <p><strong>“这个拐点或许只会出现一次。一旦错过了，可能就没有这样的机会了。”太一量生创始人刘弘斌告诉硬氪，他去年末从工作6年的微软离职，回国创业，最近已经完成3亿元Pre-A轮融资。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_96099a8e18f14f6aae215c857a37da98@6221844_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>为何忽然升温？</strong></p>\n  <p>这一切并非凭空发生。</p>\n  <p>将时间拨回2024年9月，微软与Quantinuum合作，成功纠缠了12个逻辑量子比特，创下量子纠错领域的新纪录。</p>\n  <p>所谓的逻辑量子比特，是由多个物理量子比特通过纠错码编码而成的“虚拟比特”——单个物理比特极易出错，但一群物理比特可以相互纠偏，让整个逻辑比特保持稳定。</p>\n  <p>在此之前，行业一直没能走出实验室。谷歌2019年那台轰动世界的“悬铃木”53比特量子计算机，同样无法跨越这道鸿沟，它的计算结果很快被经典计算机用新的算法反超。</p>\n  <p>直到逻辑量子比特落地，量子纠错才从理论变成实践。此前，量子计算机噪声太大，算完结果经常出错，更像实验室里的科学仪器，没法稳定干活——这就是所谓的NISQ时代（含噪声的中等规模量子阶段）。</p>\n  <p>而这次突破意味着量子计算终于有了自我纠错和反复使用的能力，正式从\"仪器\"迈向了\"计算机\"的雏形。正因如此，这在行业里被视为一道分水岭。</p>\n  <p>技术的发展步伐很快。谷歌用Willow芯片运行“量子回声”算法，速度比经典超级计算机快1.3万倍。</p>\n  <p>而在刘弘斌亲身参与的那台机器中，50个逻辑量子比特的商用机器已被丹麦诺和诺德基金会采购。</p>\n  <p><strong>“从1到50，我们花了不到一年，”他说，“这条指数曲线不会出现第二次。”</strong></p>\n  <p>与此同时，产业界的风向也在转弯。2025年初，英伟达CEO黄仁勋还在断言量子计算需要10到20年，“未来十年几乎不可能迎来使用”。</p>\n  <p>到了同年3月的GTC“量子日”，他公开修正了自己的判断，随后短时间内投资了三家量子公司，覆盖离子阱、中性原子和光子三条技术路线。</p>\n  <p><strong>“之前产业界没有共识，更多是在学术界和资本圈自嗨，”一位量子计算投资人告诉硬氪，“但2025年，产业界的转向非常明显。”</strong></p>\n  <p>有企业透露，他们两年前牵头了工信部的量超融合项目，如今英伟达、沐曦、摩尔线程都在主动寻求合作。“以前是我们找他们，现在是他们找我们。”某企业负责人表示。</p>\n  <p>政策的发令枪在同一时间扣响。2025年末，“十五五”规划把量子科技列为六大未来产业之首。“美国、欧盟早就有量子宣言，我们国家去年终于给了定位。”一位量子计算企业创始人感慨。</p>\n  <p>自那之后，行业真正沸腾。多位企业负责人告诉硬氪，规划出台前，融资要靠自己一场场地跑路演、一家家地谈条款；规划出台后，带着政策导向的大笔资本开始主动上门。</p>\n  <p>国家下场背后，当然还有更严肃和宏大的命题。“2021年，国际局势从混乱走向秩序。但到了2025年，秩序在崩塌。”一位业内人士表示，量子计算在密码破解上的潜力，使其成为国防和金融安全的核心关切。而且，量子行业与AI紧密相关，量子计算可能会彻底解绑算力限制，释放AI的能量。&nbsp;</p>\n  <p><strong>对很多创业公司来说，这可能是“once in a lifetime”的机会。他们要站在潮水刚开始翻涌的地方。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_fbdc08bfadca482ca1e92a8b473fa9c3@6221844_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>拨开泡沫</strong></p>\n  <p><strong>量子计算又走到了周期的波峰。经历过行业起伏的投资人仍心存疑虑。“这次火起来，主要还是十五五政策驱动，基本面没什么本质变化。”一位投资人告诉硬氪。</strong></p>\n  <p>拨开热钱去打捞真实需求，会发现这个行业的买单者仍以科研机构为主。金融、医药更多停留在算法层面的合作，设备还没成熟到可以落地。某量子计算公司向中国移动研究院交付了整机——但运营商仍然买它做科学研究，不是做生产。&nbsp;</p>\n  <p>这揭示了这个行业当下的真实处境：量子计算机更像是一台实验设备，而不是一个可以规模化铺开的生产工具。</p>\n  <p><strong>一位业内资深人士的评价很直接：“很多量子计算的Demo仍是应用示范，没有经济性。”</strong></p>\n  <p><strong>谁都无法回避，行业中大多数企业仍依赖政策支持和资本输血，而非自我造血。短期来看，政府补贴和培育项目仍是它们活下去的主要资金来源。</strong></p>\n  <p>不过，相比之前，量子计算的商业化应用场景有了拓展，更让人振奋的是，订单实实在在地来了。</p>\n  <p><strong>硬氪了解到，有公司在二线城市拿到千万级项目，与消费金融公司合作，用量子算法做小额贷款和风险评估；一家光量子公司在服务多家大型金融机构；还有企业与石油研究院合作，探索运筹优化、油气藏模拟。</strong></p>\n  <p><strong>一位量子计算企业高管判断，未来三年，药物筛选、新材料、催化剂研发等场景有望率先产业化。他们公司已经在金融风控、生物医药等领域与客户展开了实质性合作，部分项目已进入验证阶段。“量子计算不需要等到通用计算机出现才有价值，只要在特定问题上比经典计算机快，就有人买单。”</strong></p>\n  <p>当然，从订单结构看，这些尝试远撑不起真正的商业化付费。</p>\n  <p><strong>“这个行业还需要3-5年才能有突破性产品，整体对标欧美，行业发展还是会延期几年。”一位投资人告诉硬氪。中国科学院院士郭光灿的时间线更为保守，他认为通用量子计算机出现，大概还需要10年。</strong></p>\n  <p><strong>资本不是不知道前路漫长。只是在优质资产稀缺的年代，量子计算成了少数还能押注的选项。几乎所有人都有一个共识：量子计算是下一个AI级别的技术革命。</strong></p>\n  <p>Quantinuum上市，也可以看出这种憧憬还没有破灭。这家由霍尼韦尔量子解决方案部门与剑桥量子合并而成的公司，过去十年研发投入超过20亿美元，从未盈利。资本市场依然给出了超20倍的超额认购，发行价一再上调。&nbsp;</p>\n  <p>这是未来、是比AI还让人惊叹的革命。这个故事最大的瑕疵只有一个：太远了。</p>\n  <p>“这就像是在挖一口井，你知道下面有水，但不知道还要挖多深。有人挖到一半放弃了，有人还在坚持。问题是，谁也不知道还要挖多久。”一位投资人总结。</p>\n  <p><strong>留下来的人，在砸钱占位。“量子计算不是那种三五年就能见分晓的行业，它需要十年以上的耐心。但窗口期很短，错过就再也没有了。”一位从业近二十年的创业者总结。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260706/v2_cba4787f838d42f7a4b520a7f34a53eb@6221844_oswg4962oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>量子计算的GPT时刻还有多远？</strong></p>\n  <p>和AI过去几十年发展类似，量子计算的技术路线远未收敛，更谈不上爆发。</p>\n  <p>目前，行业里有几条主流路线：超导可以复用半导体产业链，技术成熟度最高；光量子可向下兼容现有技术，能自建产线；中性原子扩展成本低、误差可擦除；离子阱精度最高、错误率最低。</p>\n  <p>选择不同路线的创业者，各有各的逻辑。有人押精度、有人攻克关键技术难点，有人想更快造出机器。</p>\n  <p><strong>“到底最后会是谁胜出，目前来说还是不一定的。但可以肯定的是，未来3-5年，一定会有至少一条路线跑出来。”一位从业者告诉硬氪。</strong></p>\n  <p>但无论选择哪条路，所有创业者都面临同一个问题：在商业化真正到来之前，谁能活下来？</p>\n  <p>没有人能给出确切答案。但所有人的行动，都在指向同一个方向：先囤够资金，再找出路。</p>\n  <p>他们赶上了好时候。</p>\n  <p>国内头部量子计算企业已经进入了上市前的最后冲刺。量旋科技启动Pre-IPO轮融资；图灵量子将2027年定为冲击IPO的目标年份；本源量子则在2025年9月就完成IPO辅导备案，今年6月初完成了近30亿元Pre-IPO轮融资。</p>\n  <p><strong>正因为上市有了清晰路径，一级市场才愿意冒险。有投资人观察，过去半年，量子计算赛道的投资逻辑已经发生了明显变化——从早期的广撒网式布局，转向对头部企业集中押注。“大家发现，真正有技术壁垒、有工程化能力的公司就那么几家，钱再多也投不进去几家。”</strong></p>\n  <p>如果将视野拉到更广阔的维度，量子计算也是大国必备的技术储备。AI时代，算力就是权力。</p>\n  <p>一台拥有300个逻辑比特、保真度达到5个9的量子计算机，运行几十分钟，对应的算力相当于一个吉瓦数据中心连续运行10年。而这样的吉瓦级超算设施，在全世界屈指可数，单个项目的投资规模动辄数百亿美元。</p>\n  <p>美国已经划出了时间线。IBM计划在2028年前后建成集成约200个逻辑量子比特的量子计算原型机。与此同时，有国内企业希望在2030年达到同等量级。这两组数字之间的竞赛，某种程度上也是中美量子计算实力对比的缩影。</p>\n  <p><strong>2026年的量子计算，已经站上了大国科技竞争的前线。从业者们或许会有些不真实感：几年前，量子计算还只是高校实验室里的小众研究方向，创业者是一场场路演中的边缘人物。</strong></p>\n  <p>两三年间，政策加码，资本涌入，人才回流，技术突破，这场持续了数十年的长跑，进入加速阶段。谁能在接下来的三到五年内率先跑通商业化路径，谁就有可能成为量子计算时代的英特尔或英伟达。</p>\n  <p><strong>胜出者或许并非今天的头部公司。“钱并不稀缺，稀缺的是懂产业的钱。这个赛道最终能跑出来的，不会是钱最多的那家，而是最懂怎么把技术变成产品的那家。”一位投资人告诉硬氪。</strong></p>", "category": "tech", "published_at": "2026-07-06T02:15:39+00:00", "fetched_at": "2026-07-06T02:45:16.698840+00:00", "fingerprint": "c632c67e9b71455a"}, {"source": "36氪 - 最新文章", "title": "AI 砍掉的第一批大厂人：高薪，高绩效，高P｜深氪", "url": "https://36kr.com/p/3883456791163138?f=rss", "summary": "<p>访谈｜任彩茹 兰杰 彭倩</p>\n  <p>文｜任彩茹</p>\n  <p>编辑｜乔芊 杨轩</p>\n  <h3><strong>“630”减员，AI是祸首还是替罪羊?</strong></h3>\n  <p>“现在公司有（减员）名单，你在这里面。”5月中的一天，林越被组长叫进会议室，对方开门见山。</p>\n  <p>林越的第一反应是平静，他早有预料。早在今年三四月，一些互联网公司内部便传出要裁员的风声。开年以来，中国互联网大公司围绕AI提效激进开展的token竞赛、培训会、隐形考核等，无处不在。当所有人都被卷入一场“all in AI”的运动时，“裁员一定会发生”就是大家心照不宣的共识。</p>\n  <p>但站在HR门口时，他还是迎来了情绪崩溃的瞬间：手开始发抖，犹豫了很长时间，想着怎么开头，怎么调整自己的举止表情。“我再也不想经历这样的事。”</p>\n  <p>林越月薪2万5，一年前本科毕业，入职携程当后端工程师——当时看，他是极其幸运的一个。互联网招聘红利不再，携程几千份简历只录取不到500人，但他进入的是公司最赚钱的酒店部门，负责为商业化产品写代码。</p>\n  <p>但现在看，月薪2万5、只有一年经验的初级程序员，不裁他裁谁呢？一是赔偿成本低，二是比起对业务通盘更熟的老员工，新人使用AI的效率往往更低。“有业务经验打底，想用AI做什么，有什么影响，老员工更清楚。”林越说。</p>\n  <p>斯坦福大学在一篇名为《Canaries in the Coal Mine?》（《煤矿里的金丝雀？》）的论文中，用“金丝雀”比喻刚踏入职场的年轻人。其研究显示，2022年ChatGPT普及以来，最年轻劳动者的就业大幅下降，到2025年9月，22-25岁软件开发者的就业相比其2022年底的峰值下降了近20%。</p>\n  <p>最近一年，AI让一切更卷了。携程曾是著名的“互联网养老厂”：程序员岗早上10点半上班，午休两小时，下午7点就能准时下班，主APP两周一个迭代。但林越入职没多久，赶上AI&nbsp;Coding能力大爆发，已经卷成一周一个APP迭代，“每天干到10点半”。</p>\n  <p>但这种节奏加快，并不是因为业务有爆发式增长，“而是因为不找事做，就会变成边缘部门，边缘部门就会被砍。”林越告诉36氪。但最终，他还是没有避免“被砍”的命运。</p>\n  <p>不过，“斩杀”也可能是无差别的。</p>\n  <p>苍述完全没想到，自己会是第一批出现在裁员名单上的人。</p>\n  <p>5月的一个周五，上班前半小时，“部门突然拉了一个all hands（全员会），HR直接宣布了结果，告诉大家有这个事儿。”</p>\n  <p>来美团之前，苍述是字节的SSP校招生（Super&nbsp;Special Offer），高薪入职，到最后也是组内同级员工中工资最高的一个。跳槽到美团后，组内的核心项目几乎都被放在他手中，今年本该是苍述的晋升节点。</p>\n  <p>这场裁员潮中，“绩优”、“高P”的保护屏障都失效了。苍述的隔壁组，裁掉的两名员工都在去年取得了“超预期”的绩效评级。裁到最后，苍述所在的小组几乎被全员“端掉”，“这个组名义上还存在，实际已经没人了。”</p>\n  <p>林越得知自己被裁时，才发现平时常常对接的两位前端工程师，“头像不知道什么时候已经灰了”；美团的一个用户增长大群，原本的数百位成员如今只剩一半左右；阿里巴巴的高德、飞猪等业务，也处在剧烈震荡中。</p>\n  <p>“630”成了社交媒体上的热词。它是国内AI真正大规模走进互联网职场的第一个季度末。六月底到七旬中旬，既是许多公司人员汰换的惯例时点，也是这场裁员潮中普遍设定的“last day”。</p>\n  <p>风向标硅谷已经率先在裁员，特征是成批量、规模大。5月，Meta宣布裁员8000人，7000人转岗AI部门，成为硅谷科技公司里最动荡的一家，高管承认“公司士气近20年来最低”；更早时候，亚马逊宣布裁员1.6万白领岗位，把省下的资金投向AI。</p>\n  <p>2021年上一轮裁员潮发生前，国内互联网大公司疯狂扩张边界，高密度地成立一个又一个新业务，一批人被快速招募起来，又快速抹去。</p>\n  <p>但今年裁员潮的内在主线并非这样单一。<strong>AI提效、大而重的老业务增长乏力或深陷竞争泥潭、投资AI新业务带来的现金压力，在这个时段交织并行。</strong>许多被通知离开的人，也很难说得清这些因素孰轻孰重。</p>\n  <p>《哈萨比斯：谷歌AI之脑》的作者称，如同奥本海默创造了原子弹，却无法控制它的使用，追求真理的科学家们也是“万物的破坏者”：我们的工作、思维方式，甚至生存，都可能被“破坏”。十年前的韩国首尔，AlphaGo带给人类棋手李世石最初的破坏。十年后，从硅谷到北京，这种破坏再次蔓延。</p>\n  <p>对大公司而言，AI是船票，它指向大模型或AI应用这类新业务。但新业务能不能干成、何时干成，没人说得准。面对不再增长的老业务，大公司不得不在每一个确定的和不确定的方向上，更加坚决地提效、进而裁员。</p>\n  <p>林越向朋友倾诉裁员遭遇时，被安慰道，“没关系，我们大家都会有这一天，只是你的这天来得更早一些。”但比自我开解更重要的可能是，被AI替代、被大厂裁员后，人们该如何选择、如何行动。</p>\n  <h3><strong>焦虑的高层、加码的中层、发疯的基层</strong></h3>\n  <p>“以前在字节两个月才能做出来的产品demo，我们现在两个星期就能做出来。”一名前字节产品经理、现AI创业公司高管对36氪说，有了Claud Code、Codex这样的工具后，自己团队现在可以3小时做出demo，一周内完成想法验证。</p>\n  <p>“一个产品（经理）就像一个CEO。”他说，组织结构可以随之大幅压缩，信息传递的损耗比大厂少太多，完美“熵减”。</p>\n  <p>当创业公司借助AI快速行动之时，互联网大厂回望自身，是否会觉得自己像迟缓的巨兽？</p>\n  <p>来自大厂最高层的表态，往往是一个信号。</p>\n  <p>今年3月，美团CEO王兴在高管沟通会上谈到自己对AI的看法，“AI Agent对我的冲击比ChatGPT更大，AI注定会创造巨大生产力，也一定会对组织、对工作模式带来很大的变化。”</p>\n  <p>那场沟通会结束不久，美团在全公司范围拉了一场线上大会，核心是宣贯“龙虾”的安装与使用，提倡每位同事安装“龙虾”，以及将日常工作尽可能写成可复用的Skill。</p>\n  <p>会后，在美团核心本地商业从事商家运营的陈宇佳收到通知，需要在每周的周报里加上一个板块，写明自己利用AI做了哪些提效、有什么Skill可以推广到全组和全部门使用。“然后就感受到大家好像拼命在把AI融入自己的工作中。”</p>\n  <p>4月的一天，一位阿里算法工程师毫无征兆地收到部门上一个月的token消耗排行榜，他以170亿token消耗量赫然位列第一名，被公开表扬。部门老板表示，以后年度KPI、晋升考核都将参考这一排行。但一个月后，新的token消耗排行榜没能如期而至，“可能老板也发现了这种排名方式不靠谱。”</p>\n  <p>新的规则接踵而至。部门领导很快又提出，员工需要在工作日的早上11点到下午6点上传每小时的“时报”，由Agent上的插件自动记录代码及对话内容，生成工作总结——这意味着员工无法修改自己的时报内容。就在第二天，hr以近乎争吵的姿态，劝阻了该领导的荒谬制度。</p>\n  <p>类似这样的事情，已经不再让人意外。来自高层的AI焦虑不断下放，中层们层层加码，努力暗示下属，这是一场隐形的汇报竞赛、军备竞赛、淘汰竞赛。</p>\n  <p>尽管没有强制每个人一定要写Skill，陈宇佳的部门领导还是会密切关注每个下属的token用量，不时询问具体情况，“他也不清楚AI具体能做什么，但他说他不允许我们团队的每个人在这次AI浪潮中落后”。有时在工作结束后的私下聚餐中，大家也会接收到老板暗暗传达的一种危机感，“一定要把AI用起来，否���到时候我想拉你们一把都拉不了。”</p>\n  <p>阿里某AI Coding产品的一位工程师告诉36氪，集团一些业务的老板会向他们的产品团队提出请求，希望通过增加数据埋点的方式，“让他清楚地看到团队成员每天使用AI的具体轨迹。”</p>\n  <p>美团的一些中层在接到裁员指标后，甚至会向上递出一份更激进、比例更高的裁员名单——更少的人、更高的AI参与度，某种程度上直接等同于新时代的“管理成绩”。</p>\n  <p>AI提效成了一个任何业务、任何职能都能去“搞一搞”的事情。但关于AI到底能做什么，要怎么落地实现，一条长长的裂缝始终横亘在基层与管理层之间——各级老板对AI赋予无限美好的期待，基层拼命去实现、却总也触及不到那个设想，最终只能疲惫地“表演”。</p>\n  <p>江灵在阿里淘天集团做客户运营，她的工作是尽可能拉齐消费者需求和商家供给。在她看来，老板们总是“把AI想得很智能、很简单”。</p>\n  <p>就拿电商中常见的异常场景“爆单”来说，高层期待通过全量巡检，提前找出所有“爆款”。然而，平台一天的商品量是千万级别，远远超出了现有人力和Token可以负荷的数量，于是只能小范围测试，挑选几十万个商品，由于样本范围太小，命中率往往很低。</p>\n  <p>“作为一个员工，你没法反驳老板的那种期待，你懂吗？”江灵激愤又无奈。</p>\n  <p>很多时刻，江灵觉得自己就像一头驴，有鞭子在后面抽。“累不可怕，没有方向和正反馈，才是最可怕的。你就是不停地拉磨，也不知道最后要去哪里。”</p>\n  <p>“你不能把AI当成一个许愿池用。”一家AI公司的CTO对36氪总结，AI提效有很多前提，基础是数据，但很多公司的数字化本身就没做好；此外，许多流程上的卡点在“人”，是单靠AI无法解决的。</p>\n  <h3><strong>“一代人有一代人的土木”</strong></h3>\n  <p>产品、运营等大厂岗位感受到的还是不确定的焦虑，而程序员只能率先接受被宣判的命运。</p>\n  <p>百度前端工程师李川第一次被AI能力震惊，是在今年初用到Claude Code。“同样的复杂需求，用国内一些大模型可能需要五到六轮对话，用Claude两三轮就搞定了，且完成得更好。”</p>\n  <p>他第二次被AI惊艳，是今年4月。中国大模型公司智谱发布GLM-5.1模型，“一是便宜，二是它的能力完全可以作为Claude Code的平替。”</p>\n  <p>李川当时就意识到自己的饭碗不保。到了5月，他果然出现在“名单”上。</p>\n  <p>如同一枚硬币的两面，一面是2026年5月，Claude Code母公司Anthropic已经实现470亿美元左右的年化收入（ARR），半年时间涨了四五倍；智谱也在近期冲上万亿市值。</p>\n  <p>另一面是AI Coding能力的极速成熟，让程序员成为了这轮裁员潮中的重灾区。“各家首当其冲的几乎都是产研团队，尤其是前端开发、测试开发这样的岗位，通常很容易被老板认为含金量不再。”一位互联网公司HR告诉36氪。</p>\n  <p>2025年，李川以校招生身份进入百度，成为一名前端工程师。一年前参与校招面试时，AI还仅仅扮演着搜索引擎的角色，只能通过简单问答来辅助编程，面试官全程都没有谈及AI。</p>\n  <p>“前端”是李川理想的职业，因为这是一个所见即所得的工作，代码质量直接体现为产品界面上的每个细节。每到过年，告诉家人“打开百度app，上面那个东西是我做的”，会让他尝到成就感和“工作的意义”。</p>\n  <p>多年以来，大公司的程序员被泾渭分明地划分为算法、前端、后端、测试等职能，前端对审美、交互等软性能力要求更高，后端则更需要严谨的技术能力。这一行的薪资水平和“鄙视链”，也直接跟“技术含量”挂钩——前端比测试高，但不如算法工程师和后端工程师。</p>\n  <p>仅仅一年，李川熟悉的一切已经地覆天翻。写代码和改代码的工作被AI大面积接管，程序员的几种职能也模糊了界限。甚至产品经理也能一脚跨进编程的门。</p>\n  <p>阿里的一个开发部门，今年五月接到部门老板的通知，要求大家暂停所有的非紧急需求，每个团队开发一个Agent，以后针对任何业务需求，都只能由产品同事直接与Agent对接。程序员只能修改Agent，不能碰代码。老板还暗示，到今年十月份，做得好的团队将接替不好的团队来维护Agent。</p>\n  <p>腾讯CSIG的技术团队研发了一条为公司App修复bug的流水线——由AI修复bug，程序员只需要在bug解决完成后进行检查，点击“确认”按钮，代码就会合入，它的修复准确率目前可以达到50%。</p>\n  <p>阿里巴巴5月在内部成立了一批全栈小组，让前端、后端和测试工程师都转成“全栈工程师”，成为“超级个体”。6月开始，美团内部也在全面推行前后端开发的合并。</p>\n  <p>转“全栈”理论上是可行的，但实践起来，却是扒掉一层皮的痛苦过程。</p>\n  <p>突然被转为全栈工程师的韩之，根本没有太多时间学习，很快就要开始自己的第一个“全栈”项目，前后端开发、测试由她一人包揽。“现在我所有需求都是‘倒排’的，规定几号几号前上线，”她最近工作强度打满，晚上9点手头的活儿还没干完，“我实在太累了”。</p>\n  <p>但大势不可违。从去年底到今年初，中国几家头部公司都在尽可能地撒钱，推动程序员消耗token，逐渐淘汰“古法编程”。</p>\n  <p>最高峰时，腾讯CSIG团队成员享受的是2000美金/月的token额度，只要诉求合理、有相应的代码产出，用完还可以申请翻倍提额。token使用量也同步被纳入考核，“当你的用量很低时，你的leader会问你为什么。”因此，一些人会把用不完的token额度借给别人。</p>\n  <p>多年以来，大厂程序员意味着高薪与光环。他们是互联网公司的基石，“程序员精神”的内涵是开源与分享，是代码的简洁与优雅，是没有杂音的唯成果论，是看到字符在屏幕上跳动时的兴奋感。</p>\n  <p>但时代变了。几乎每一位受访的程序员都对36氪谈到同样一种感受，“离开AI将无法工作，假如AI‘挂掉’了，我宁愿花大量时间去找新的Codingplan，也不愿意自己去看代码改一改”——再去谈论所谓的“程序员精神”，也显得不合时宜。</p>\n  <p>李川说，昔日一个优秀程序员的修养是学习和迭代，因为过去几十年编程语言一直在变，不学就跟不上技术前沿。他和朋友们周末去咖啡馆研究新技术也是常有的事，“这个群体本身就挺卷的”。但AI恐怖的迭代速度让人彻底失语。</p>\n  <p>“如果AI Coding锁死在25年的水平就好了，能抹平我这种一两年资历和七八年资历人的技术水平，同时又不能真正代替人，还有很多‘对话框’之外的事可做。”林越感叹。但技术不会为谁停车，现在他毫不怀疑，程序员的消亡已经是进行时了，“就像珍妮机发明后的纺织工人一样”。</p>\n  <h3><strong>旧增长没了，新赛马启动</strong></h3>\n  <p>当技术给一家公司的效率注入倍数级杠杆，随后发生的事情无外乎两种——同样的人做更多的事，又或者，一家公司不再需要这么多人。</p>\n  <p>“我们不裁员。”一家软件公司CEO对36氪说，好不容易“调教”出了这些对行业、开发方法富有认知的程序员，每一个都是公司的财富，当AI Coding把编程效率提升了5倍，他要做的不是裁掉4/5的人，而是把业务扩大5倍。</p>\n  <p>这愿望固然美好，但问题在于，市场还有这么多增量吗？</p>\n  <p>被裁之前，林越短暂体会到AI写代码的“解放感”，但很快，他反倒变得更忙了。以往，业务对App细节有迭代需求时，总要等排期慢慢来。现在业务的需求越堆越快，无论可不可行、重不重要，都让研发团队“先做出来试试”。</p>\n  <p>但这些需求在林越看来多少有点“鸡肋”——最小的“banner位”修改一下文案细节，又或是将浮窗广告由“免费取消”改为“积分抵扣”。“产品经理变变这个，变变那个，我们会做AB测试，改后效果能变好的情况真的不多。”</p>\n  <p>“越没有增长的部门越是all in AI，总要找点新故事讲嘛。”苍述说。他既待过外卖业务，也待过无人机业务，以他的亲身感受，前者卷AI的氛围比后者浓得多。</p>\n  <p>一位刚在Meta经历了大裁员的Infra工程师告诉36氪，学会压榨AI后，他和同事们以前没时间做的事情，“现在都想做一做”。但如今一大批人离开，留下的同事又开始把那些必要性不高的工作砍掉。</p>\n  <p>摆在所有人面前的现实是，移动互联网时代跑出的明星产品们，如今都很难再通过“做更多工作”而实质性地推高增长。其中一些公司不仅没有增长，还因激烈的外部竞争而失血严重。</p>\n  <p>2025年外卖大战几家公司烧了2000亿，将美团的利润与现金流拖入泥潭，这让人均贡献利润原本就低的美团率先进入裁员周期。但换个角度看，美团的业务高度依赖线下履约，AI提效空间跟线上化程度更高的公司比是偏小的，“如果连美团都能通过AI提效减员，那其他公司一定会跟进。它是一个风向标。”一位美团员工说。</p>\n  <p>传统现金牛业务广告持续萎缩的百度，在阿里内部长期边缘、贡献微薄的飞猪和高德，也都是类似情况。</p>\n  <p>旧业务的裁员难以避免，那么活水的机会存在吗？</p>\n  <p>一些管理层在谈起裁员话题时，会告诉员工“公司现在也搞AI，可以试着去找找自己能做的项目。”一位美团员工告诉36氪。近日，美团核心本地商业新成立了AI Transformation部门，主要职能是探索用AI梳理业务的内部流程；此外，不少核心中高层也在亲自带队做AI相关项目。</p>\n  <p>字节的一位产品经理王岳告诉36氪，他正在内部创业，做一款面向B端客户的AI提效类产品，“公司鼓励大家去做这样的探索”。在立项之初，他们不仅主动抹掉了“设计”和“测试”两个职能，还要向评审会强调，这款产品未来将节省多少人力成本。王岳的另一位同事在开发AI客服的Agent产品，其2026年的OKR就是“帮助公司裁掉xx%的客服”。</p>\n  <p>如今，这样的项目，在每家大厂都有十余个或数十个小团队在做。“有时候会几个团队做同一个方向，谁跑出来了，公司就集中资源推谁。”——一场新的赛马开始了。</p>\n  <p>变动的除了业务重心，还有组织形态，比如抹去更多中层管理者。</p>\n  <p>腾讯从今年起开始推行项目制，弱化管理职级，给负责人恢复专业职级；美团在今年年中盘点时裁掉了一些L9（事业部总监级），还在近期全面取消X1节点（此前最低的一层管理节点），减少管理层级。</p>\n  <h3><strong>就让我们挥别过去</strong></h3>\n  <p>AI的巨浪究竟会把人带往何处，多数人都还没有一个“顿悟时刻”。</p>\n  <p>离职缓冲期结束前的六月中旬，林越已经在密集推进淘宝、快手和字节的面试。继续“大厂程序员”的职业生涯，仍然是他内心期盼的最优路线。但这些公司的橄榄枝至今没能如愿抛来，“太难了。”林越说。</p>\n  <p>“找到一份工作是容易的，但一旦从大厂去了中厂、小厂，你就不可能再回到大厂了。”在林越心里，放弃大厂某种程度意味着永久性跌落，他不愿“退而求其次”。</p>\n  <p>也有人放下“大厂执念”。李川从百度离职后的第三天，便无缝入职了一家初创公司。顺其自然地，他的岗位从过去的“前端工程师”变成了“全栈工程师”。这家公司的主力产品是办公类的AI Agent，还给他涨了薪。</p>\n  <p>尽管大家都说时代变了、程序员的技能不再可靠，李川仍然有一些“技术憧憬”，希望以技术人员的角色参与到一款被用户喜爱的产品中，而这未必只能在大厂实现。</p>\n  <p>从阿里离开后，江灵入职了一家老牌汽车公司。她如今的工作内容不必强行与AI关联，不用再每天焦虑“老板的AI任务能不能完成”，当然也不用再“拼命表演”。江灵最近负责的一个项目9月30日才上线，“这些任务落在我的舒适区，时间又宽裕，人真的会身心愉悦许多。”</p>\n  <p>最近，她所在的部门每每放出招聘岗位，“都有一堆什么阿里的人过来面试，疯了一样地往制造业跑。”</p>\n  <p>也许程序员群体最终还会留下10%，但苍述不想再找大厂的工作，“去卷成这绝望的10%”。</p>\n  <p>5月被美团裁员后，他果断踏上了创业道路。AI浪潮前，他就以副业形式尝试自己做点什么。彼时，只是建社群、兜售一些技能，就让他体会过月入十万的滋味。</p>\n  <p>今年三四月时，苍述社群里的一些“学员”，已经踩着浪潮投身AI创业，“开了自己的公司，招了很多人，我还苦哈哈在这上班，这对吗？”他问自己。</p>\n  <p>如今，苍述的创业项目是面向海外，围绕罕见病用户的需求开发系统、做独立产品，他也在小红书账号“苍述（戒掉月薪版”与海外社媒上向网友分享进展。主产品之外，他还在多线并行一些小产品，以此保持手感，“一个小工具最多三四天完成，复杂系统可能需要半个月。”——这都远远快于大厂的常规排期节奏。</p>\n  <p>AI或许是人类有史以来最强的智力杠杆，它可以把个人能力放大N倍，可以支撑大部分初创产品的落地，也可以让每一个好的idea被快速看见并定价。</p>\n  <p>生于2000年的苍述说，自己是一个注定创业的人，但假如没有这次裁员，他可能不会在此刻行动。“公司帮我做了决定。”</p>\n  <p>“既往不恋，纵情向前”，这是美团给每位离职员工告别短信中的最后一句话，也是最近许多大厂人离开时会提起的一句话。在AI带来的这场复杂变革里，离开大厂、留在大厂，都无法再延续过去的路径。</p>\n  <p>短暂的“碎”过之后不是躺倒。转行也好，创业也好，先接受变化的人或许能先看到不一样的世界。</p>\n  <p>（周鑫雨对本文亦有贡献；应采访对象要求，文中林越、江灵、李川、王岳为化名）</p>", "category": "tech", "published_at": "2026-07-06T02:26:34+00:00", "fetched_at": "2026-07-06T02:45:16.698831+00:00", "fingerprint": "6a968463b58df8b6"}, {"source": "36氪 - 最新文章", "title": "跨境电商风向转变：新生代不再只拼价格，开始争“定价权”丨最前线", "url": "https://36kr.com/p/3883561480876297?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨最前线</p>\n  <p>6月30日，亚马逊全球开店与福布斯中国联合发布“2026福布斯中国新生代跨境电商30人评选”，30位入选者平均年龄仅35岁，95后已开始崭露头角。</p>\n  <p>入选者既有3D打印、庭院机器人、AI助听器等硬核科技赛道的开拓者，也有家具、家居、服装等传统产业的变革者。他们来自广东、浙江、江苏三省，占比超过75%。更重要的是，这些年轻创业者共同票选出了三个年度关键词：“星辰大海”、“快与慢”和“定价权”。</p>\n  <p>这三个词背后的指向也很有意思：全球化视野、长期主义决心，以及跳出价格战的野心。</p>\n  <p>过去一年，昂听ELEHEAR在美国亚马逊助听器类目做到品牌第一。创始人苗健彰长期深耕AI声学算法，2021年切入助听器赛道，走了一条“很慢”的路——全栈自研。</p>\n  <p>硬氪了解到，助听器行业有一个长期矛盾：传统医疗级产品性能好但价格高昂，线上廉价产品体验糟糕，啸叫、降噪差等问题普遍存在。</p>\n  <p>昂听ELEHEAR的做法是打造全新的AI助听器+远程实时验配模式，自研VOCCLEAR® AI算法，在低功耗、低延迟的苛刻约束下解决声音处理问题，同时通过自建产线和D2C，重构助听器销售链条。2024年10月，昂听ELEHEAR推出旗舰产品BEYOND，定价399美元，以一个全新、普惠的价格带撬动市场。早期种子用户反馈，399产品性能接近高端3000-4000美元助听器，又比以往100美元以下低质产品具有更完整、专业的助听服务体系。</p>\n  <p>同样从技术切入的还有深圳汉阳科技的黄阳，历时8年打造出Yarbo智能庭院机器人，填补消费级扫雪机器人的产业化空白。BOCOMAL波科马的谢秀臻则通过自主研发新型轻量化阻燃材料，将防护服装重量降低35%、透气性提升50%，上线首年单品销量突破15万件。</p>\n  <p>这些案例的共同特征是：不再靠“中国制造”的成本优势打价格战，而是用技术建立自己的定价权。</p>\n  <p>在运营端，AI的应用正在从单点提效升级为系统级的基础设施。亚马逊调研显示，超过98%的受访中国卖家已在运营中使用AI工具，其中16%已进阶到部署AI工作流或智能体。</p>\n  <p>哈库拉玛塔达是这一趋势的典型。创始人孙翔以4人团队起步，两年半做到2500万美元营收，在母婴睡眠细分品类做到亚马逊美国第一。背后是一套由20多个定时启动的AI智能体、6个常驻机器人构成的运营系统，7×24小时自动运转。</p>\n  <p>这套系统的核心不是“写文案”，而是“听用户”。孙翔团队用AI扫描4000多条评论后发现，美国市场消费者选购婴儿睡袋时最看重的卖点是“双向拉链”，而非团队自以为重要的“静音魔术贴”——背后是美国家长对换尿布便利性的真实需求。过去这种洞察需要大量试错，现在AI直接给出了答案。</p>\n  <p>更值得关注的是AI正在参与组织决策。哈库拉玛塔达内部搭建了一个“业务大脑”Agent，掌握公司战略、供应链、各成员能力等全部信息，对下属AI生成的建议进行筛选和判断。</p>\n  <p>本质上，AI已经从执行工具变成了管理系统的一部分。</p>\n  <p>在浙江温州，95后黄强帅接手的家族锅具工厂走了一条不同于纯品牌或纯代工的路线——“OEM+ODM+自有品牌”三轮驱动。</p>\n  <p>他留学期间就开始做跨境电商，2020年回到温州。起初自有品牌和工厂代工是两条并行线，直到他把两者“并轨”。电商团队先把自己当成工厂的“客户”，从市场需求出发反向给工厂下订单。积累的消费者数据被用来在OEM客户提出需求之前预判产品方向，甚至在提案时直接告诉客户“你有潜在问题，我能解决”。</p>\n  <p>这套模式带来的变化是：部分线下商超客户不再要求贴牌，而是主动提出“能不能用你的品牌卖”。工厂从被动接单者变成了有品牌资产的一方。</p>\n  <p>黄强帅还在发起一个跨境OPC创业社区（One Person Company，一人公司），通过共享仓储、物流、合规资源和五年积累的知识库，降低年轻人创业门槛。“我们不求前三年盈利，”他说，“先一起把项目跑起来。”</p>", "category": "tech", "published_at": "2026-07-06T02:43:23+00:00", "fetched_at": "2026-07-06T02:45:16.698813+00:00", "fingerprint": "5c15a55bfdf607a4"}, {"source": "少数派", "title": "背单词更要背释义，FenyiDic 让你记住「熟悉的陌生人」", "url": "https://sspai.com/post/111632", "summary": "每个单词都认识，为什么还是读不懂英文？<a href=\"https://sspai.com/post/111632\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-05T09:08:05+00:00", "fetched_at": "2026-07-06T02:45:14.792552+00:00", "fingerprint": "a7078a3241d4f023"}, {"source": "少数派", "title": "派早报：阿里禁用 Claude 模型", "url": "https://sspai.com/post/111973", "summary": "<p>阿里禁用 Claude 模型</p><p>索尼调整计划，2028 年前发售游 "The US Department of Energy reportedly deleted about 6,000 pages related to energy conservation as a historic heatwave tears across the country. The deletion was suspiciously timed, following Republican outrage over Mayor Zohran Mamdani asking New Yorkers to help reduce strain on the grid by setting their AC to 78 degrees. Republicans like Ted Cruz [&#8230;]", "category": "tech", "published_at": "2026-07-04T16:19:06+00:00", "fetched_at": "2026-07-05T02:40:17.913899+00:00", "fingerprint": "9480aa2c77d3d161"}, {"source": "The Verge", "title": "NASA launched an emergency mission to stop the Swift Observatory from crashing to Earth", "url": "https://www.theverge.com/science/961459/nasa-emergency-save-swift-observatory-katalyst-space-technologies", "summary": "The Swift Observatory was launched in 2004, but recent solar storms have pushed its orbit lower, and it's in danger of burning up in Earth's atmosphere as soon as this year. To try and stave off its demise, NASA has enlisted Katalyst Space Technologies. The company's Link spacecraft launched Friday with the goal of intercepting [&#8230;]", "category": "tech", "published_at": "2026-07-04T19:06:27+00:00", "fetched_at": "2026-07-05T02:40:17.913888+00:00", "fingerprint": "6871972627480601"}, {"source": "36氪 - 最新文章", "title": "对话傲鲨创始人徐振华：当科幻机甲成为户外装备，外骨骼如何重新定义人机关系？", "url": "https://36kr.com/p/3880770270425089?f=rss", "summary": "<p>《流浪地球2》与游戏《死亡搁浅》中，主角身穿外骨骼行走的人类未来图景，正在成为户外爱好者的真实装备。</p>\n  <p>7月4日，阳澄湖半岛度假区，十几个人身穿“机甲”在湖畔徒步。他们穿的是傲鲨VIATRIX增程动力外骨骼机器人，走几步后很快步伐变得轻盈，这是外骨骼通过学习他们的行走姿态，在抬腿瞬间加上一定推力，使6公里的徒步体验更像一次悠闲的City walk。</p>\n  <p>当天的机甲徒步活动由傲鲨联合户外平台一帐之地共同策划，路线串联沿湖步道、度假空间与生态公园，沿途设置多个观景和换装点位，将前沿科技、户外美学与湖岸风光融为一体，让参与者沉浸式解锁人机协同的徒步方式，感受徒步的松弛感与探索感。</p>\n  <p>作为人类身体力量的延伸，以傲鲨为代表的外骨骼机器人正逐渐从工厂流水线和医院康复科走向户外山野，将突破人体移动和体能限制的能力，进化为一种人机协作的全新出行和运动方式。</p>\n  <p>傲鲨2018年成立于上海，团队前身从医疗康复外骨骼研发起家，很快进入工业应用领域，在应急消防、电力巡检等大量工业物流场景落地应用，海外业务覆盖美国、日本等25个国家和地区。随着轻量化等技术逐渐成熟，2025年傲鲨开始切入消费级外骨骼市场，旗下的消费级品牌VIATRIX凭借独创的Float360浮动式髋关节架构与AI运动部署，先后斩获CES 2026创新奖与第十届中国设计智造大奖银奖。</p>\n  <p>“做消费级外骨骼是我们的核心目标，工业场景的研发也会持续进行，形成‘工业打基础+消费带增长’的双轮驱动。”傲鲨创始人徐振华告诉我们。</p>\n  <h2><strong>1.做更轻、更智能的消费级外骨骼</strong></h2>\n  <p>最早对傲鲨消费级产品产生兴趣的并不是极限运动员和专业越野跑者，而是“办公室坐久了，体能一般、但想走出去看看”的普通人，徐振华发现，其中30-50岁男性尤其居多。</p>\n  <p>女性用户偏少则是因为当前外骨骼产品整体上仍显粗壮，穿戴协调性和拍照效果相对受限。“所以我们也正在材料和系统设计上做持续研发，让外骨骼变得更轻盈、更好看。”徐振华表示，<strong>轻量化和智能化是消费级外骨骼产品的必然趋势</strong>，变轻不仅提高使用舒服度，也能降低动能损耗，使设备更省电，反过来又能让电池尺寸做得更小更轻。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260704/v2_d0f4055d61b44e658712a0f770edb4af@5688585_oswg182314oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">傲鲨外骨骼机器人</p>\n  <p>而智能化则是外骨骼可以真正在户外场景落地的技术基础。几年前一些外骨骼品牌曾发起一轮市场推广，但最终并未获得市场成功。徐振华分析，这背后的关键在于，当时的外骨骼缺少AI能力，只能做运动规划。而每个人的运动习惯、走路步态不同，在爬楼、山路等不确定性环境中很难做到与用户真实运动的高度融合。</p>\n  <p>而如今叠加AI能力后的外骨骼，真正实现了从预设程序到实时学习的跨越。“设备开机后，用户只要走几步，AI就可以自动根据步态进行助力，运动过程中还会不停采集数据进行修正，让设备与用户越来越融合。”徐振华介绍，VIATRIX的自研车规级响应电机能够毫秒级精准输出动力，双腿总计46Nm的动力配合AI步态算法带来腿部力量提升。</p>\n  <h2><strong>2.从一场徒步到一个生态</strong></h2>\n  <p>傲鲨把外骨骼带进山野，并不是从阳澄湖才开始。此前傲鲨在千岛湖策划的机甲徒步活动结束后，这条路线也成为一条常态化线路，傲鲨还联合一帐Camplus在景区布设户外场景租售体验点，为后续游客提供外骨骼租赁的徒步体验服务，打造集户外场景、主题活动、深度体验为一体的特色空间。</p>\n  <p>从千岛湖到阳澄湖，到目前为止，傲鲨已在全国布局20个文旅生态合作网点，先通过活动验证路线、积累内容、渗透核心人群，再将体验产品化为可反复运营的租售点，让用户能在真实的户外场景穿戴体验，再决定是否入手。</p>\n  <p>徐振华表示，这种“科技+文旅”生态的运营模式，不仅有助于打消潜在用户的决策顾虑，还可以通过用户实测数据反哺产品迭代，形成“体验-验证-转化-迭代”的正向循环。</p>\n  <p>除了走进山野，傲鲨也在城市内进驻Haglöfs（火柴棍）线下门店。“国内的外骨骼公司大多缺乏10年以上的户外经验。”徐振华表示，傲鲨选择找最懂户外的品牌“补课”，“向资深的百年户外品牌企业学习，可以更精准地理解客户和场景，迭代调整产品。” 同时，作为一家以产品研发为核心能力的外骨骼科技公司，傲鲨VIATRIX的愿景是联合户外行业的生态伙伴们，以技术赋能，共同打造下一代户外科技装备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260704/v2_92b52c7170c149e6aaaea29d7d6406c6@5688585_oswg121086oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">傲鲨线下门店</p>\n  <p>从单次尝鲜到可持续的户外生活方式，从传统零售终端到深度体验网络节点，傲鲨以这种可复制、可扩展的模式，构建从品类心智占领到商业闭环构建的系统布局。</p>\n  <h2><strong>3.不取代人，是人体力量的延伸</strong></h2>\n  <p>“穿外骨骼爬山，是作弊吗？”</p>\n  <p>徐振华对这个质疑并不陌生：“外骨骼是根据人体动作和指令，做毫秒级响应并进行力学放大，保证用户在体能到达极限时，依然保持理想的技术动作。”</p>\n  <p>换句话说，外骨骼不会替人做决定，而是通过“增程动力”从整体上节约人的体力，让正确动作更省力地完成，从而扩展极限耐力的持续时间。也就是说，在同样的体力极限下，人可以走更远的路，身体机能同样得到充分锻炼。</p>\n  <p>此外，傲鲨外骨骼目前使用的浮动式360关节，可以更好地匹配人体的整体运动灵活度，避免徒步过程中的摔倒和不必要的运动限制。</p>\n  <p>徐振华明确区分了消费级和医疗级外骨骼的边界。在他看来，两者之间的界限不是技术能力的递减，而是产品逻辑的根本不同，后者需要与医生的临床诊断深度结合，涉及复杂的康复评估和风险把控。</p>\n  <p>但在消费端，这两类产品的边界对普通用户来说往往是模糊的。“很多人分不太清楚外骨骼的实际功能，到底什么是医疗的、什么是日常穿戴的。”徐振华说，傲鲨重视售前主动说明，在用户咨询环节向用户做明确的指导和说明。“如果用户有偏瘫、脑卒等问题，我们会明确不推荐他们使用消费级外骨骼。对于年纪较大的用户，也会要求对方拍摄一段行走视频，根据行走情况做一些售前预判”。</p>\n  <p>这种“有所不为”的克制，背后是对外骨骼技术边界的清醒认知。Fortune Business Insights预测，2025年全球可穿戴机器人外骨骼市场规模为24.9亿美元，赛道热度进一步升级，傲鲨等多个品牌已完成多轮融资。但徐振华对行业当下的“爆发”保持理性：“外骨骼不会出现‘iPhone 4时刻’这样的突变，而是在更长时间内持续爬坡，最后靠好的产品能力培养起用户习惯。”</p>\n  <p>外骨骼的快速进化还向人们抛出另一个问题：当技术可以帮助人走得更远时，人的物理“边界”由什么来定义？徐振华看来，不同于人形机器人以替代人为目标，外骨骼追求的是与人的合作，追求保持人的主体性的同时，赋予人更强的力量和更大的自由。</p>", "category": "tech", "published_at": "2026-07-04T03:25:22+00:00", "fetched_at": "2026-07-05T02:40:17.850713+00:00", "fingerprint": "f18d78d32f22084a"}, {"source": "少数派", "title": "[送码] 聆听用户建议，1Capture 新增多项实用截图功能", "url": "https://sspai.com/post/111645", "summary": "各位少数派的朋友好，距离上一次在少数派介绍1Capture已经过去一年。过去这段时间里，我们开发的这款Mac截图与录屏工具继续做了多轮更新，也根据用户反馈补齐了一些更适合团队协作和产品展示的功能。市场 ...<a href=\"https://sspai.com/post/111645\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-04T07:55:48+00:00", "fetched_at": "2026-07-05T02:40:15.464903+00:00", "fingerprint": "3e5547337062546f"}, {"source": "BBC World News", "title": "Anguished families left to identify Venezuela quake victims at makeshift morgue", "url": "https://www.bbc.co.uk/news/articles/c20y2p9qqqko?at_medium=RSS&at_campaign=rss", "summary": "The disaster has overwhelmed local services, with bodies put outside or in tents for identification.", "category": "politics", "published_at": "2026-07-03T21:00:53+00:00", "fetched_at": "2026-07-04T02:30:44.067124+00:00", "fingerprint": "7b29539a1cae4a95"}, {"source": "BBC World News", "title": "France records 2,025 excess deaths at peak of heatwav a“高资本开支、收入回报有限”的担忧，转向对其新增高利润收入选择权的重估。按德银测算，Meta到2027年底AI相关算力可能达到8至11.5GW，其中可对外出售容量约1.2至2.7GW；假设75%实现销售、每GW年化收入100亿至150亿美元，Meta 2027年可新增收入90亿至300亿美元，较市场预期收入高3%至10%，基准情景约175亿美元。（财联社）</p>\n  <p><strong>东岳硅材：上半年净利润同比预增904.88%—952.28%</strong></p>\n  <p>36氪获悉，东岳硅材发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股 东的净利润为4.24亿元—4.44亿元，比上年同期增长904.88%—952.28%。</p>\n  <p><strong>圣诺生物：控股股东拟4000万—5000万元增持公司股份</strong></p>\n  <p>36氪获悉，圣诺生物公告，控股股东四川赛诺投资有限公司计划4000万元—5000万元增持公司股份，中国银行股份有限公司四川省分行已向赛诺投资出具《贷款承诺函》，同意为赛诺投资增持公司股票提供专项贷款，贷款金额最高不超过4500万元，期限3年。</p>\n  <p><strong>中金岭南：上半年净利润同比预增87.89%—114.73%</strong></p>\n  <p>36氪获悉，中金岭南发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股东的净利润为10.5亿元—12亿元，同比增长87.89%—114.73%。</p>\n  <p><strong>金龙鱼旗下富裕生物科技公司增资至25.6亿，增幅约33%</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，益海嘉里（富裕）生物科技有限公司发生工商变更，注册资本由19.25亿人民币增至25.6亿人民币，增幅约33%。该公司成立于2018年4月，法定代表人为陈学松，经营范围包括粮食收购、粮油仓储服务、谷物销售、饲料原料销售等，由益海嘉里金龙鱼食品集团股份有限公司全资持股。</p>\n  <p><strong>韩华集团计划到2040年在航空航天和AI领域投资55万亿韩元</strong></p>\n  <p>韩国最大的国防和航空航天企业韩华集团周五表示，计划到2040年在航空航天和人工智能 （AI） 领域投资55万亿韩元（约合356 亿美元），用于开发运载火箭、卫星和AI数据中心。（新浪财经）</p>\n  <p><strong>FF洛杉矶总部人去楼空？公司回应：不实</strong></p>\n  <p>7月3日，法拉第未来发布声明称， 公司日前关注到近部分网络平台流传所谓“FF洛杉矶总部人去楼空”等不实信息。FF位于汉福德的工厂并未关闭，此次系全球总部正常搬迁至洛杉矶硅滩（El Segundo）。网传视频所拍摄地点为FF曾经位于Gardena市的旧总部，今年3月底开始不再由FF使用。所谓“FF洛杉矶总部人去楼空”的说法具有严重误导性，属于对公司正常办公地点搬迁事实的恶意歪曲。（界面）</p>\n  <p><strong>苹果iOS 27 Beta版操作系统最新SDK包括Apple智能功能</strong></p>\n  <p>36氪获悉，苹果开发者微信公众号发文宣布，iOS 27 Beta版操作系统现可下载。最新SDK带来新功能，包括平台设计优化、Apple智能功能，以及新的AI开发框架。</p>\n  <p><strong>西贝餐饮集团退出小女当家</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，深圳小女当家企业管理有限公司发生工商变更，原股东内蒙古西贝餐饮集团有限公司退出，新增广州品芯悦谷企业管理有限公司为股东。该公司成立于2020年4月，法定代表人为罗红勇，注册资本771.6万人民币，经营范围包括餐饮管理、餐饮咨询服务等，现由深圳市大罗企业管理有限公司、宁波普师企业管理咨询有限公司及上述新增股东共同持股。</p>\n  <p><strong>阿里云宣布AI原生数据库服务产品Databridge Agent功能收费</strong></p>\n  <p>36氪获悉，阿里云官网显示，AI原生数据库服务产品Databridge Agent将于2026年8月1日正式转商业化计费。</p>\n  <h2>投融资：</h2>\n  <p><strong>星河动力增资至5.2亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，北京星河动力航天科技股份有限公司发生工商变更，注册资本由约4.3亿人民币增至约5.2亿人民币，增幅约21%。该公司成立于2018年2月，法定代表人为刘百奇，经营范围包括航空航天的技术开发、技术转让、技术咨询、技术服务等，由北京至远探索管理咨询中心（有限合伙）、刘百奇、刘建设等共同持股。</p>\n  <p><strong>“格式塔科技”完成4.2亿元天使+轮融资</strong></p>\n  <p>36氪获悉，“格式塔科技（Gestala）”宣布完成4.2亿元人民币天使+轮融资。本轮融资由华映资本领投，C资本、红杉中国、蓝思科技、中电健康基金、创新工场、临港科创投资、复旦复容资本、国泰创投等多家国内外头部投资机构跟投。道彤投资、云时资本、清松资本、戈壁创投等老股东持续超额加码认购。华兴资本担任独家财务顾问。</p>\n  <h2>新产品：</h2>\n  <p><strong>xTool O1 UV打印机正式发布</strong></p>\n  <p>36氪获悉，近日，xTool在德国柏林举办欧洲品牌发布会，正式向全球推出xTool O1 UV打印机。O1将UV、DTF、DTG、UV DTF四种打印能力整合进一台设备，覆盖木材、金属、亚克力、玻璃、石材、织物、皮革等多种材料。此外，xTool还推出了Atomm创作者平台，并通过AImake等AI工具，帮助用户完成从想法到设计、从设计到制作的转化。</p>\n  <p><strong>Github Copilot接入开源模型Kimi K2.7</strong></p>\n  <p>36氪获悉，月之暗面宣布，Github Copilot接入第一个开源模型Kimi K2.7。 ​​​</p>\n  <p><strong>小鹏MONA L03预售开启</strong></p>\n  <p>36氪获悉，7月2日晚，小鹏MONA L03预售开启，并将于7月16日德国慕尼黑全球上市。</p>\n  <h2>今日观点：</h2>\n  <p><strong>腾讯龙虾QClaw产品经理张舒昱离职，称内部并无“赛马”</strong></p>\n  <p>7月2日，有消息称腾讯QClaw负责人张舒昱已离职。记者关注到，张舒昱本人在社交平台上发帖称，自己已于6月29日从腾讯离职。她还回顾了自己第一次做C端产品QClaw的历程，并提到“QC和WB是同一个老板，部分时间增长团队都是同一批人组成”，以此澄清腾讯内部QClaw和workbuddy从来没有“赛马”。记者就此向腾讯方面求证，截至发稿尚无回应。另有知情人士向南都记者表示，张舒昱为QClaw产品经理。（南方都市报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>央行等部门就《金融业网络安全管理办法（征求意见稿）》公开征求意见</strong></p>\n  <p>36氪获悉，据央行网站，为进一步规范金融业网络安全管理，中国人民银行、国家金融监督管理总局、中国证券监督管理委员会、国家外汇管理局联合起草了《金融业网络安全管理办法（征求意见稿）》，现面向社会公开征求意见。</p>\n  <p><strong>国务院：加强海上风电、油气等开发建设活动监管</strong></p>\n  <p>36氪获悉，国务院印发《美丽中国建设“十五五”规划》，其中提到，深化海洋生态环境保护。健全陆海统筹、近远海协调联动的海洋生态环境保护格局。划定国家生态环境治理重点海域及其控制区域、省级重点海域范围，实施综合治理攻坚。深化陆源污染治理与管控，加强海洋垃圾清理和资源化利用，基本完成重点海域入海排污口排查整治。强化海水养殖环境整治与监管，提升海水浴场等亲海区域环境品质。加强海上风电、油气等开发建设活动监管。有序推进海洋生态环境综合调查，开展典型海洋生态系统保护修复及成效评估，加强重要海洋物种及其栖息地保护与监管。推进潮白河—渤海湾、九龙江—厦门湾等从山顶到海洋保护治理机制创新。</p>", "category": "tech", "published_at": "2026-07-03T10:55:45+00:00", "fetched_at": "2026-07-04T02:30:43.353957+00:00", "fingerprint": "65b10e1e648b9da2"}, {"source": "36氪 - 最新文章", "title": "秋声 | 袁进辉新公司冲港股IPO，成立不到三年", "url": "https://36kr.com/p/3879814941437956?f=rss", "summary": "<p>本文约2700字，建议阅读6分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>AI大爆发之际，越来越多公司走向资本市场。每一份招股书翻动的声音里，都藏着一家公司想说与未曾明说的全部。</p>\n   <p>鉴于此，硬氪特推出「秋声」专栏。秋声取自欧阳修《秋声赋》，借“听秋声”之意，产业冷暖，辨公司成色，记录企业冲刺IPO途中那些被写下与被隐藏的真实。这是我们第七期，硅基流动。</p>\n  </blockquote>\n  <p>Q2的最后一天，硅基流动向港交所递交了上市申请，此次IPO是以18C未商业化公司身份申报。<strong>联席保荐人为华泰与海通国际</strong>。</p>\n  <p>如果你在AI开发者圈子，硅基流动（SiliconFlow）这个名字不会陌生。它就是那个在DeepSeek爆火时，第一个把R1/V3部署到国产芯片上跑token服务的平台。它的招股书数据也确实炸裂：注册用户两年多冲破1000万、2024年12月至2026年4月的日均token吞吐量增长12倍、付费客户一年涨292倍，估值两年半更是飙到77亿。</p>\n  <p>但硬氪翻遍347页招股书后，会发现一个华丽增长曲线背后的冷峻事实：<strong>硅基流动在亏本卖token，2025年毛利率是−24%。</strong></p>\n  <p>硅基流动于2023年8月成立，至今未满三年，招股书称是中国领先的开放、独立<strong>词元（token）供应平台。</strong>本质是AI推理基础设施公司。它把英伟达、AMD，以及昇腾、沐曦、摩尔线程等异构算力聚合起来，用自研推理引擎和算力编排系统，把底层算力翻译成标准化的token供应，通过公有云服务（无服务器token服务+专属实例）和本地部署解决方案两条线交付。</p>\n  <p>按第三方口径，按2025年token年吞吐量计，它是<strong>中国最大的独立生态token供应商、所有token供应商中位列前五</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_3e9ef59cd2444250a67b7714f51d40b7@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>一门卖1元钱token、成本1.24元的生意</strong></h2>\n  <p>硅基流动的收入曲线极其陡峭：2023年成立前4个月，收入仅6000元，2024年734.6万元，2025年<strong>5533.0万元</strong>。一年增长逾七倍，但收入之下的成本结构，才是这门生意真相。</p>\n  <p>看毛利率的三年轨迹：2023年<strong>83.3%</strong>，2024年<strong>39.4%，</strong>2025年<strong>−24.0%</strong>。2025年，硅基流动的销售成本高达6863.2万元，是当年收入5533万元的<strong>124.0%</strong>。换句话说，<strong>它每卖出一块钱的token，背后的算力等成本要花1.24元，毛利直接为负，当年毛亏1330.2万元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_7cef20b6deb947eea142ccedb15a3ce4@430412560_oswg178013oswg1080oswg561_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_86d838a9bc904c3eb5bf72f5b194a948@430412560_oswg126593oswg1080oswg460_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>这是当前AI推理token价格战的直接投影。大模型API价格一路血洗、大厂把token单价打到地板。硅基流动作为中间层，其成本压力主要来自算力租赁。2025年，算力资源成本5962.7万元，占销售成本86.9%。招股书也提到，2025年销售成本大增正是快速扩大算力资源消耗以支持不断增长的服务需求所致。</p>\n  <p>另外两条费用线中：</p>\n  <p><strong>研发开支2025年2.09亿元，是当年收入的378.1%</strong>；三年研发累计2.84亿（2023年1084万→2024年6448万→2025年2.09亿）。</p>\n  <p><strong>销售及营销开支2025年8374.3万元，是收入的151.4%</strong>。</p>\n  <p>收入5533万，光研发加销售两项就烧掉近3亿。于是2023-2025年净亏损为 1222.3 万、8191.5 万、<strong>3.45 亿元</strong>，2025 年净亏损率 −624.4%，每股亏损 33.33 元。即便按经调整口径，加回股份支付 1.35亿 + 赎回负债利息 2307.6 万，2025 年经调整净亏损仍达<strong>1.871亿元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_4bc28488e0de461ebb5c07111835a9a8@430412560_oswg166586oswg1080oswg569_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>经营活动现金流连续三年更是净流出，2025 年经营性现金净流出 1.72亿元。好消息是它有七轮融资，2025 年末现金及等价物 1.71 亿、另有 1 亿定期存款。</p>\n  <p>在2025 年收入结构中，公有云服务 2926.1 万元，占比52.9%。其中无服务器词元服务 1430 万 、专属实例 1500 万；本地部署解决方案 2606.9 万元，占比47.1%。即一边走开发者和中小企业的规模化流量，另一边走大企业和机构的高客单项目。</p>\n  <p>其中<strong>无服务器付费客户</strong>，从2455 到71.6万，<strong>增约 292 倍</strong>。已服务 1.3万企业客户、平台累计支持 170+ 模型。无服务器活跃用户2025年为545.3万，2026年前4个月为145.4万。2024年至2025年，专属实例客户由7家增至49家，2026年前4个月为20家；本地部署客户由28家降至20家，2026年前4个月分别为5家，但单客户收入大幅提升。</p>\n  <p>但硅基流动并非直接购买芯片，而主要通过合作方租赁算力资源。招股书募资用途里，多个大项都写明资金将用于<strong>租赁算力资源。</strong>其五大供应商（算力及云服务商）采购集中度高，2025 年五大供应商占采购额 70.8%、最大单一供应商 20.4%。此外，<strong>有两名主要业务伙伴同时是客户又是供应商</strong>。</p>\n  <p>在风险提示里，硅基流动表示<strong>在很大程度上依赖高质量开源 AI 模型的可得性</strong>。一旦模型停止开源、或授权条件生变，它的核心供给就会受冲击。</p>\n  <p>如果只看运营数据，硅基流动增长很快。2024年末、2025年末及2026年4月底，其注册用户数分别为12.7万、919.7万、1028.2万；从2024年12月至2026年4月，其日均词元吞吐量约增长12倍；其中2024年至2025年增长241.1%，2025年12月至2026年4月进一步增长254.7%。</p>\n  <p>但这些流量，最终在2025年只兑换出5533万元收入，而且是负毛利兑换。2025年，硅基流动销售成本达6863.2万元，占收入124.0%，整体毛损率为24.0%。用户、吞吐与付费客户的爆炸增长，和微薄且负毛利的变现之间，横着一道巨大的鸿沟。</p>\n  <p>招股书亦坦承，无服务器token服务面向开发者与中小企业、多为预付低价消耗，这类流量规模大、单价低、还要贴着成本甚至低于成本供给。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_3e5126a4ddd346529781e68f66e1ffd9@430412560_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>七轮融资，估值从2.8亿飙到77亿</strong></h2>\n  <p>硅基流动从2023年12月至2026年6月，<strong>两年半融资七轮</strong>（天使、天使+、Pre-A、A、A+、B、B+）。事实上，其融资款净额<strong>仅动用约32%</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_f02b7f919de24fc08bdd644d1026d7a3@430412560_oswg23095oswg790oswg428_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>投后估值从天使轮的 2.8 亿元，飙到 B+ 轮的 77.40 亿元。两年半涨 27.6 倍，每股成本涨 13.4 倍。</strong></p>\n  <p><strong>仅在2026年，硅基流动就完成了三轮，从A+轮的31亿元、涨到B轮的50亿，再到B+轮。值得一提的是，B+ 轮就在递表前一个月刚完成。按 B+ 投后 77.4 亿元人民币测算约合 84 亿港元，刚好踩在 18C未商业化公司上市门槛上。</strong></p>\n  <p>股东结构中，<strong>控股股东为袁进辉，直接持 14.35%。再通过员工激励平台</strong>（硅基创新/未来/探索各 7.85% + 硅基卓越 6.59%），合计控制约<strong>44.48%</strong>投票权；<strong>阿里巴巴持股 7.42%</strong>，派驻董事陈英杰；华为持股<strong>4.07%</strong>；<strong>创新工场持股4.01%</strong>；苏州耀途（耀途资本，半导体 VC）持股3.01%；南京绿涌持股3.01%<strong>；王慧文持股2.06%；</strong>普华基金持股1.81%；国泰君安持股 1.56%；<strong>商汤0.64%、壁仞0.39%</strong>、金蝶、美团。</p>\n  <p>创始人<strong>袁进辉，今年45岁</strong>，清华大学计算机博士、西安电子科技大学本科。从OneFlow到SiliconFlow，一人身兼多职：<strong>董事会主席、CEO、总经理兼财务负责人</strong>。袁进辉是 AI 老兵。2013–2016 年任微软（中国）主管研究员，主导开发过当时全球最快的大规模主题模型训练系统 LightLDA；2017–2023 年创立并主导<strong>深度学习框架公司OneFlow（一流科技），</strong>后被王慧文创立的光年之外收购，最终并入美团。2023 年 8 月，他带着 OneFlow 的核心班底转身做了硅基流动——CTO 柳俊丞、COO 赵震均为 OneFlow 旧部，副总经理曾华则来自京东集团副总裁。</p>\n  <p>非执行董事<strong>陈英杰，49岁，为阿里战略投资部董事总经理</strong>，同时兼任 MiniMax 非执行董事。</p>\n  <p>硅基流动的故事，是一支 OneFlow 老兵带队、踩中 AI 推理与 token 革命大浪潮的超级增长团队。但<strong>2025年在亏本卖token、毛利率−24%（销售成本达收入124%）</strong>；研发烧掉收入的378%、销售烧掉151%；收入5533万却亏3.46亿。IPO后究竟值多少钱，只有招股阶段才知道了。</p>\n  <p><strong>首页图源｜企业官网</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>", "category": "tech", "published_at": "2026-07-03T11:12:32+00:00", "fetched_at": "2026-07-04T02:30:43.353951+00:00", "fingerprint": "e726efa738e4a1a1"}, {"source": "36氪 - 最新文章", "title": "400家starup聚集、阿斯利康重押13亿欧元，创新药出海欧洲绕不开这座城｜最前线", "url": "https://36kr.com/p/3879807100023040?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>2026年6月底，西班牙瓦尔德希伯伦大学医院（Vall d’Hebron University Hospital）宣布完成欧洲首例单孔机器人儿科肾输尿管切除术。</p>\n  <p>瓦尔德希伯伦大学医院是西班牙规模最大的综合医院之一，年接诊量过百万人次，在整个欧洲医疗系统内，这家医院对前沿医疗技术、产品的探索都称得上“先锋”。此前，世界首例供体来自安乐死患者的面部移植手术就在这里完成。</p>\n  <p>本次，医院方面对36氪表示，支持完成这场“有里程碑意义的儿科手术”的核心设备，来自中国手术机器人公司术锐机器人。这是瓦尔德希伯伦大学医院首次以直销形式采购中国医疗器械，落地后，预计每年可为医院新增200-300台微创机器人手术，成为打通中国高端医疗器械进入欧洲临床场景的关键通道。</p>\n  <p>一台手术机器人的落地，其实只是中、西生命健康产业深度交融的缩影。</p>\n  <p>在地中海沿岸的巴塞罗那，这座曾以高迪建筑、港口航运和汽车产业闻名的城市，早已成长为欧洲第四大生命科学创新高地。</p>\n  <p>近期，受西班牙加泰罗尼亚贸易投资局（Catalonia Trade &amp; Investment）邀请，36氪实地走访加泰罗尼亚首府巴塞罗那地区的生物医药产业园区、头部药企研发中心，试图还原这片地中海沿岸土地上正在发生的产业变革。</p>\n  <h2><strong>产业生态成型：</strong></h2>\n  <h2><strong>加泰罗尼亚打造欧洲生命科学创新沃土</strong></h2>\n  <p>Jaume Baró是加泰罗尼亚政府企业与竞争力秘书长兼贸易投资局局长（Secretary of Business and Labor），他提供的一组数据显示：当前，区域内共有1523家生命科学相关企业，吸纳就业人口占当地总人口的7.3%、GDP贡献值为4.1%；对外出口则稳居西班牙首位，全国46%的医药产品出口由加泰罗尼亚完成。2024年，医药品类贡献了近九成本地出口总额。</p>\n  <p>从外商投资角度，2020-2024年五年间，当地生命健康产业的外商直接投资总额达22.8亿欧元，落地46个外资项目、创造6050个优质岗位，全西班牙“一半以上的生命科学外资全部流向加泰罗尼亚”。</p>\n  <p>深究起来，加泰罗尼亚生命科学产业之所以能在南欧脱颖而出，持续吸引全球制药企业“重仓”，核心在于以巴塞罗那生命科学园（Parc Científic de Barcelona，PCB）为核心枢纽，搭建起的产、学、研、医、资一体化的闭环生态。这套成熟的资源串联机制，既源源不断孵化本土创新企业，也为外来投资者提供了难以快速复制的发展土壤。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_dfe62d284e544984aa88a9c33c6a9cc0@5930287_oswg6647055oswg5712oswg4284_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">巴塞罗那生命科学园（PCB）园区规划示意</p>\n  <p>PCB成立于1997年，是西班牙首个专业生命科学科技园。当前，园区已打通医疗实验室与临床端资源通道，实现基础科研、临床验证和产业转化无缝衔接，形成一套可持续的创新循环：科研人员依托高校实验室产出前沿技术，依托园区共享平台完成早期验证，再借助本地海量多中心临床资源完成人体试验，最终孵化商业化企业。</p>\n  <p>可作为佐证的一组数字是：由加泰罗尼亚政府与巴塞罗那市政府联合创建的本土公私合营基金会Biocat统计显示，2015-2025年十年间，加泰罗尼亚生命健康领域已诞生超过400家初创公司。另据了解，全西班牙九成以上的临床试验，都是在加泰罗尼亚完成的。</p>\n  <p>PCB市场营销与传播总监Grisha Domakowski介绍，当前，这套生态已跑出成熟范本。比如，从事基因疗法开发的SpliceBio就曾入驻PCB园区，其核心管线SB-007是一款针对遗传性视网膜退行性疾病的基因疗法，已进入临床研究阶段。2025年6月，SpliceBio曾完成一笔1.35亿美元的B轮融资，创下加泰罗尼亚生命科学领域单轮融资纪录。</p>\n  <p>与此同时，PCB完善的资源串联能力，也是海外制药企业在此布局的核心原因。Jaume Baró提到，海外生命科学企业选择在此落地的核心动因里，产业集群、科创资源各占40%。而 PCB正是集群与科创资源的核心载体，跨国企业无需从零搭建完整研发配套，入驻即可对接高校博士人才库、第三方CRO，甚至是产业资本、知识产权服务机构等，大幅缩短研发落地周期。</p>\n  <p>以英国制药巨头阿斯利康在当地的布局为例。2020年，阿斯利康选址巴塞罗那打造全球生物医药创新中心，计划到2027年时总计再次投资13亿欧元。自2023年投入运营以来，该中心已开展接近400个研发项目和190项临床试验，覆盖肿瘤、心血管、罕见病等疾病领域。</p>\n  <p>除此之外，日本AGC Pharma Cheminaik、东和制药、美国远程医疗企业Teladoc Health等也已相继在加泰罗尼亚落地，累计投资数亿欧元、创造数千高端产业岗位。</p>\n  <p>Jaume Baró认为，这种“临床、科研、产业、资本”打通的竞争力，使得头部医疗机构、科研中心、活跃的初创生态和成熟制药企业之间相互赋能，天然成为全球创新企业进入欧洲的门户。</p>\n  <h2><strong>引进到共创，</strong></h2>\n  <h2><strong>中西生命科学合作步入深水区</strong></h2>\n  <p>当一个区域的产业生态走向成熟，其目光必然向外延伸，即寻找新的技术源头、拓展更大的市场腹地。加泰罗尼亚生命科学产业的演进轨迹也遵循了这一逻辑。过去十年间，这个地中海产业集群完成了从内部积累到外部链接的跃迁。</p>\n  <p>而中国创新力量的崛起，恰好与这一需求形成了互补。</p>\n  <p>这种互补，根植于两个医疗体系各自禀赋的深层差异。瓦尔德希伯伦大学医院院长lbert Salazar认为，中欧医疗体系架构存在差异，但“双方均拥有值得互相借鉴的成熟经验”。</p>\n  <p>“中国在AI技术落地、数字健康平台、远程医疗、超大人口体量医疗服务管理等领域展现出极强的落地能力，欧洲医疗机构可以向其学习数字化转型推进速度、医疗技术规模化普及等方面的落地经验。而欧洲医疗体系的优势则在于一体化公立医疗体系、循证医学体系、临床治理规范等方面。因此，双方合作最大机遇在于优势互补：欧洲对外输出临床验证、医疗质控相关经验，中国则具备技术规模化落地、创新产业生态、工业化发展的突出能力。”lbert Salazar表示。</p>\n  <p>如今，这一判断正在被越来越多的实际合作印证。</p>\n  <p>伴随着中国本土创新药产业逐渐完成从\"跟随式仿制\"到\"源头式创新\"的跨越，为自研新药寻找能够合作开发全球市场的欧美制药公司，成为中国创新药企近两年的核心任务。2025年，中国创新药BD出海总金额基数已达到1300亿美元。某种程度上，这一角色转换从根本上重塑了中国与欧美企业的合作内涵。</p>\n  <p>有关注中国创新药企出海的FA人士观察到，此前，欧洲很多药企对中国市场的布局虽很早，但风格偏保守，实际合作不如中、美药企业频繁。但自2025年开始，欧洲部分制药公司从C level层面开始，对“了解中国市场的诉求变得格外强烈，哪怕仅是出于个人职业发展的角度”。</p>\n  <p>在加泰罗尼亚，本土企业同样在调整姿态。今年3月，老牌皮肤病龙头制药公司阿尔米拉（Almirall,ALM）正式在上海设立办公室，负责在中国挖掘合适创新药项目、搭建合作关系。阿尔米拉首席科学官Karl Ziegelbauer向36氪表示，中国市场是公司的“补充性布局”，旨在依托各类合作拓宽创新研发边界。</p>\n  <p>早在2022年，阿尔米拉就曾与先声药业（02096.HK）达成过合作，共同开发一款治疗斑秃和特应性皮炎的新药，里程碑付款最高达4.92亿美元。今年3月，公司又与华海药业（600521）子公司华奥泰达成全球研究合作及许可协议，共同开发一款早期单抗候选药物，累计付款最高可达3.4亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_1a7bba88d54e4edf89f035fe6100d845@5930287_oswg209005oswg1706oswg1279_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">阿尔米拉（Almirall）研发管线示意</p>\n  <p>Ziegelbauer认为，中国创新企业普遍具备“执行效率高、运营灵活敏捷、创新产业生态高速迭代”的优势。“在上海设立办公室后，我们并不会设定年度交易规模指标，优先考核标准为科研质量与战略匹配度，确保筛选得到的研发资产能够为皮肤病患者带来真正、颠覆性的治疗价值。”</p>\n  <p>“双方的合作早已不局限于商品贸易，开展联合创新项目、产业合作、技术转让、研发协同、双向投资的案例持续增多。”Jaume Baró如此评价当前合作态势。</p>\n  <h2><strong>中、西生命科学合作的下一程</strong></h2>\n  <p>然而，机遇与挑战并存。</p>\n  <p>“当前，双方在生命科学领域合作上的仍存在挑战，比如各国监管规则繁杂、地缘政治不确定性、文化差异，这要求所有合作方建立互信，保持稳定、树立长期发展视野。”Jaume Baró坦言。</p>\n  <p>整体而言，过去五年间，中国企业在欧洲的国际化布局更多集中在制造业领域，生命科学产业仍处于相对早期阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_a1b65c1b1a9c44ee8cb0e52efe3a6b99@5930287_oswg419041oswg1200oswg800_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">加泰罗尼亚本地工业园区DFactory，已有多家中国医疗器械企业入驻</p>\n  <p>这不仅是因为欧洲市场与中国药品器械监管体系差异显著，跨国临床试验、产品注册流程复杂，拉长项目落地周期，由此抬高了合作成本；同时，生命科学行业准入门槛远高于制造业，难以照搬整车、化工行业独立建厂的模式，企业合资，或开展科研合作因此成为主流，但也容易因为合作权责、知识产权分配易产生分歧。</p>\n  <p>PCB市场、传播与竞争情报部门主管Silvia Labé也提到，园区曾接待过大量来自中国的医药代表团，覆盖政府单位、企业、医疗机构及科研机构等，他们来访的核心诉求大多是学习本地生物医药产业模式、探索合作机会。但有些时候，“代表团参访结束后，难以持续对接、跟进”。“由于资源有限，我们会比较谨慎地选择合作对象。对我们来说，远在欧洲，想全面了解中国当前的生物医药产业变化并不容易。”</p>\n  <p>针对如何深化合作，加泰罗尼亚政府已制定明确策略。Jaume Baró介绍，加泰罗尼亚贸易投资局在上海、北京、香港设立办事处，为有意赴加投资的中国企业提供全流程服务：从协助准备投资申报材料、选址、签证办理、人才招聘到投资落地后的持续跟进。赴加投资的中国企业还可申请专项基金资金扶持。</p>\n  <p>“我们的最终目标，是让加泰罗尼亚成为中国创新技术进入欧洲的核心门户之一，并成为双方企业在技术、产业协同上的可靠合作方。”Jaume Baró表示。</p>", "category": "tech", "published_at": "2026-07-03T12:28:30+00:00", "fetched_at": "2026-07-04T02:30:43.353944+00:00", "fingerprint": "8089d75c214aa477"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 剑桥副教授创业硅光芯片，已合作欧莱雅、华为，获一亿投资", "url": "https://36kr.com/p/3879991356157952?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_7bba92fd871f49ea8ca5e3fcabde20c7@6221844_oswg1504240oswg956oswg895_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，硅基光电子集成芯片研发商光引科技近期已完成1亿元Pre-A轮融资，投资方包括光子强链基金、善达投资、长飞基金、洛阳英才、中科创星、西安财金。资金将主要用于上海新实验室建设、人才招募及量产推进。</p>\n  <p>光引科技2021年成立于徐州，核心团队孵化自英国剑桥大学研发团队。创始人程祺翔为剑桥大学博士、剑桥大学副教授，在光子集成领域深耕超16年，曾就职于华为海思光电团队。公司核心技术团队多名成员来自剑桥大学，硕士/博士占比达66%。</p>\n  <p>据QYResearch数据，2024年全球微型和mini光谱仪市场规模约为4.6亿美元，预计2031年将达8.22亿美元，年复合增长率8.8%，其中芯片型光谱仪占据最大市场份额，主要用于可穿戴设备、相机、智能手机等领域。</p>\n  <p>另据The Business Research Company报告，微型光谱仪市场预计将从2025年的11.8亿美元增长至2030年的21.5亿美元，复合年增长率达12.8%，可穿戴光谱仪应用是主要增长驱动因素之一。</p>\n  <p>光引科技专注于硅基光电子芯片设计及光谱传感解决方案，产品形态为微型化光谱传感模组，可应用于可穿戴设备人体健康检测、医美皮肤检测、工业与食品物质检测等场景。</p>\n  <p>与传统台式光谱仪相比，光引科技将精密光学系统集成至米粒大小的芯片上，采用“计算式光谱仪”技术路线。</p>\n  <p>传统光谱仪依赖棱镜或光栅等物理分光元件，需要精密的光学结构和机械部件，对环境要求苛刻、成本高昂。而计算式光谱仪通过芯片上的采样单元对入射光进行编码，再利用算法从少量测量数据中重建完整光谱信息，从而大幅压缩体积并降低成本。</p>\n  <p>据公司介绍，其光谱芯片波长覆盖范围达600-2500nm，分辨率最高可达0.01nm，尺寸为米粒大小，预估量产后成本可控制在20美元以内。作为对比，目前市面主流光谱模组产品价格多在100-2000美元区间，尺寸从指甲盖到充电器大小不等。</p>\n  <p>光引科技副总裁徐康宁向硬氪表示，公司目前主要客户包括欧莱雅、华为、小米等头部企业，包括与欧莱雅联合开发检测皮肤胶原蛋白含量的设备，与华为、小米等展开电驱动芯片及算法适配合作。此外，在工业领域，公司也与多家酒企合作，利用光谱传感器监控发酵过程中酒精度、淀粉、还原糖等物质变化。</p>\n  <p>近几年，公司预计加速推进产品量产，持续向头部客户送样验证并逐步获得市场认可。</p>\n  <p><strong>以下是硬氪与徐康宁的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：目前产品还没有量产，主要难点是什么？</strong></p>\n  <p><strong>徐康宁：</strong>我们做的光谱传感赛道很特殊，业内没有完全符合我们技术的产业链，包括光源、封装技术、测试设备都没有完全匹配的。我们需要自己去搭建独特的工艺和产线。目前约80%的能力可以在市面上找到供应商覆盖，剩下20%需要我们自己采购设备、培训人员、开发工艺。</p>\n  <p><strong>硬氪：对比现有的PPG（光电脉搏波）方案，公司技术在价格和性能上存在哪些差异？</strong></p>\n  <p><strong>徐康宁：</strong>我们的技术方案对比现有智能手表里的PPG模组，价格大概贵2到5倍，具体取决于测量的指标和应用领域。但我们能测的参数更多，精度更高，是PPG的上位替代。</p>\n  <p>传统的PPG技术主要依赖光电脉搏波信号，能测量的参数局限于心率、血氧等少数指标。而光谱传感可以检测胶原蛋白、血糖、乳酸、酒精等多种生物标志物。我们的目标是把光谱传感器搭载进所有智能手表中，实现“腕上诊所”的愿景。</p>\n  <p><strong>硬氪：公司今年有一个大的战略调整，是计划切入光交换领域吗？</strong></p>\n  <p><strong>徐康宁：</strong>是的。我们的技术基础是硅基光电子，剑桥团队的三大方向分别是光交换、光传感、光计算。公司此前重点在传感领域，从今年开始会着重在上海建立一个团队，去做硅基光电子光交换方向的产品。</p>\n  <p>硅光技术在光通信领域正迎来快速增长，据行业机构预测，硅光技术在光模块市场的份额将从2025年的30%翻倍至2030年的60%。我们的创始人早期多年也在做光交换，这是他非常熟悉的领域，也是公司未来重要的第二增长曲线。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>中科创星观点：</strong>&nbsp;作为光引科技早期的投资方之一，我们从天使轮+起就坚定看好这支团队。一路携手走来，企业成长远超预期，我们对光引的未来充满信心。</p>\n  <p><strong>长飞基金观点：&nbsp;</strong>光引科技在光芯片领域的技术积累与长飞的产业资源高度互补。双方在产业链协同上合作紧密，期待共同推动光通信产业升级。</p>\n  <p><strong>善达投资观点：</strong>很高兴看到徐州本地培育出光引科技这样优秀的硬科技企业。从落地到成长，我们见证了团队扎实的研发能力和执行力，是徐州科创力量的代表。</p>\n  <p><strong>西安财金观点：</strong>光引科技的核心技术壁垒扎实，在光芯片国产化进程中具备关键价值。我们持续看好企业的技术路线，期待其成为行业标杆。</p>\n  <p><strong>光子强链基金观点：</strong>光引科技是光子产业链上的关键一环，其光芯片技术对补链强链具有重要战略价值。我们坚定支持企业突破核心技术，助力国产光子产业自主可控。</p>", "category": "tech", "published_at": "2026-07-04T01:00:00+00:00", "fetched_at": "2026-07-04T02:30:43.353935+00:00", "fingerprint": "ae9874917ff150f8"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜阿里内部全面禁用Claude Code；FF洛杉矶总部人去楼空？公司回应：不实；微软砸25亿美元组建6000人AI新公司", "url": "https://36kr.com/p/3880629882679301?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>三部门：调整节能汽车、新能源汽车车船税优惠政策</li>\n   <li>三星传获Meta超10万亿韩元AI芯片代工订单</li>\n   <li>茉莉奶白小程序更换彩色Logo</li>\n   <li>Meta打算出售富余算力引发科技股回落</li>\n   <li>英伟达前光互连技术高管Ashkan Seyedi加入艾迈斯欧司朗</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>因存在植入后门风险，阿里内部全面禁用Claude Code</strong></p>\n  <p>36氪从阿里内部人士处获悉，因近期Claude Code被曝存在植入后门的安全风险，阿里经综合评估后已将其列入高风险软件名单。自7月10日起，阿里将全面禁止内部员工在办公环境下使用Claude Code，并推荐使用Qoder作为替代方案。</p>\n  <p><strong>FF洛杉矶总部人去楼空？公司回应：不实</strong></p>\n  <p>7月3日，法拉第未来发布声明称，公司日前关注到近部分网络平台流传所谓“FF洛杉矶总部人去楼空”等不实信息。FF位于汉福德的工厂并未关闭，此次系全球总部正常搬迁至洛杉矶硅滩（El Segundo）。网传视频所拍摄地点为FF曾经位于Gardena市的旧总部，今年3月底开始不再由FF使用。所谓“FF洛杉矶总部人去楼空”的说法具有严重误导性，属于对公司正常办公地点搬迁事实的恶意歪曲。（界面新闻）</p>\n  <p><strong>微软砸25亿美元组建6000人AI新公司</strong></p>\n  <p>当地时间7月2日，微软宣布成立全新运营实体——微软前沿公司（Microsoft Frontier Company）。该业务依托微软现有人工智能工具，主要为企业客户落地有成效的人工智能部署项目。微软将为该项目投入25亿美元资金，并配备6000名行业专家与工程技术人员。据微软商业业务总裁贾德森·阿尔托夫（Judson Althoff）介绍，这项业务远超所谓前沿部署工程（FDE）的范畴，将打造业内规模最大、综合实力最强、以业务成果为核心导向的工程团队。</p>\n  <p>该部门将整合微软现有的FDE工程师、技术顾问、支持人员以及具备行业经验的销售团队。新公司将为客户提供AI技术选型与系统集成服务，涵盖微软自有模型及外部模型，并与企业自身的专有数据进行深度结合。客户将保留所有成果与开发成果的所有权，无需将结果回传给微软。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Github Copilot接入开源模型Kimi K2.7</strong></p>\n  <p>36氪获悉，月之暗面宣布，Github Copilot接入第一个开源模型Kimi K2.7。</p>\n  <p><strong>阿里云宣布AI原生数据库服务产品Databridge Agent功能收费</strong></p>\n  <p>36氪获悉，阿里云官网显示，AI原生数据库服务产品Databridge Agent将于2026年8月1日正式转商业化计费。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>国家发改委：自7月3日24时起，国内汽、柴油（标准品）价格每吨分别下调950元、915元</strong></p>\n  <p>36氪获悉，据国家发改委，6月18日国内成品油价格调整以来，国际市场原油价格快速回落后小幅波动运行，本次调价的前10个工作日平均价格低于上次调价前10个工作日平均价格。根据国际市场油价变化情况，自7月3日24时起，国内汽、柴油（标准品）价格每吨分别下调950元、915元。</p>\n  <p><strong>多家品牌金饰价格大涨，周生生克价1266元</strong></p>\n  <p>7月3日，国内黄金饰品价格对比显示，多家黄金珠宝品牌公布的境内足金首饰价格较2日有所上调，老凤祥报价1260元/克，较前一日1230元/克涨30元；周生生报价1266元/克，较前一日1236元/克涨30元；周大福报价1262元/克，较前一日1233元涨29元；老庙黄金报价1261元/克，较前一日1235元/克涨26元。（界面新闻）</p>\n  <p><strong>三星传获Meta超10万亿韩元AI芯片代工订单，2纳米中长期积压订单看涨</strong></p>\n  <p>7月3日，据报道，三星电子正成为全球大科技公司自研AI芯片（ASIC）的核心生产基地，其中长期积压订单有望逼近50万亿韩元。Meta正推进与三星晶圆代工合作设计并生产价值超10万亿韩元的下一代ASIC。其自研AI加速器“MTIA”已锁定三星为合作伙伴，计划采用2纳米尖端工艺量产数十万组。同时，美国AI巨头Anthropic也在评估使用其2纳米工艺开发芯片。（界面新闻）</p>\n  <p><strong>国家金融监督管理总局决定对众邦银行实施接管</strong></p>\n  <p>国家金融监督管理总局、湖北省人民政府关于对武汉众邦银行股份有限公司实施接管的公告。鉴于武汉众邦银行股份有限公司（以下简称众邦银行）出现严重信用风险，为保护存款人和其他客户的合法权益，依照《中华人民共和国银行业监督管理法》和《中华人民共和国商业银行法》有关规定，国家金融监督管理总局决定对众邦银行实施接管。（央视新闻）</p>\n  <p><strong>三部门：调整节能汽车、新能源汽车车船税优惠政策</strong></p>\n  <p>36氪获悉，财政部、税务总局、工业和信息化部发布关于调整节能汽车、新能源汽车车船税优惠政策的公告。自2027年1月1日起，取消对节能汽车减半征收车船税政策，取消对纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车免征车船税政策；纳税人新取得及本公告实施前已取得的上述类型车辆，应按照《中华人民共和国车船税法》及其实施条例和其他相关规定征收车船税。</p>\n  <p><strong>科技板块遭遇深度调整，机构建议聚焦细分龙头</strong></p>\n  <p>7月2日，A股市场迎来大幅调整。分析人士认为，本轮调整并非基本面逻辑的逆转，而是上半年科技板块极致分化行情下交易拥挤、筹码结构脆弱等风险因素的集中释放。经历半年大幅上涨后，部分高位品种估值与预期透支较为严重，短期回调具有一定的合理性。但从中长期维度来看，AI产业趋势并未改变，机构普遍建议投资者在调整过程中保持定力，关注具备核心竞争力的细分龙头，同时适度配置高股息资产以平滑组合波动。（中证网）</p>\n  <p><strong>茉莉奶白小程序更换彩色Logo，此前被判赔LV超千万元</strong></p>\n  <p>因商标侵权纠纷一审被判向LV赔偿1000万元后，茉莉奶白更换头像的消息引发关注。7月2日晚上，茉莉奶白小程序会员中心原本黑色的Logo换成了彩色Logo，相关话题也冲上社交平台热搜。7月3日，记者就“换Logo是否与LV诉讼一事有关”的问题咨询茉莉奶白客服，工作人员对界面新闻表示：“抱歉给您添麻烦了，我司将依法提起上诉，未来我们将持续专注品质与服务，不负信任。”（界面新闻）</p>\n  <p><strong>腾讯游戏暑期未保行动：每周限玩3小时</strong></p>\n  <p>36氪获悉，7月3日，腾讯游戏发布“2026年暑期未成年人保护专项行动”，每周限玩3小时，升级“AI双引擎防沉迷”模式：游戏外，成长守护焕新AI版本，接入腾讯混元与DeepSeek双模型，家长可通过对话式交互完成信息查询与账号管控，提升管理便捷度；游戏内，健康系统推出AI巡航功能，内置“AI守卫”，基于玩家行为进行动态风险分级，并在人脸识别基础上，新增声纹检测、年龄识别等多模态验证，实现全链路干预，提高冒用、代过门槛。</p>\n  <p><strong>关停“杠杆炒金”通道，银行拧紧个人贵金属业务风险阀门</strong></p>\n  <p>6月以来，包括交通银行、招商银行、工商银行在内的多家国有大行、股份制银行密集“踩刹车”——宣布将于7月停办代理上海黄金交易所个人贵金属交易业务。在业内人士看来，这是银行主动进行风险管理的举措，通过提前压缩高风险投机业务，防范极端行情下的客户违约风险、声誉风险，同时帮助投资者规避贵金属价格波动带来的资金损失。（中证网）</p>\n  <p><strong>Meta打算出售富余算力引发科技股回落，业内人士：算力租赁市场并未降温</strong></p>\n  <p>科技巨头Meta（脸书）打算出售富余算力的消息，引发AI算力过剩恐慌，全球科技股普遍回落，A股存储、光模块、PCB（印制电路板）、MLCC（多层片式陶瓷电容器）等热门科技股纷纷下跌。与此同时，作为算力产业链上游链主，英伟达推出新型AI基础设施合作模式，计划通过收入分成和信用支持的合作模式，向快速增长的AI生态系统开放计算资源。有从业者表示，当前算力租赁市场并未降温，在手订单充沛。（证券时报）</p>\n  <p><strong>阿里云发布Qoder企业版</strong></p>\n  <p>36氪获悉，阿里云发布Qoder企业版，为企业提供个人云端知识库QMind，支持跨产品、跨设备、跨人员的知识共享。同时推出资源池化的Credits付费模式，企业管理员可按需为成员动态分配额度。</p>\n  <p><strong>华谊兄弟电影公司被执行1406万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，华谊兄弟电影有限公司新增三则被执行人信息，执行标的合计1406万余元，执行法院均为北京市朝阳区人民法院。该公司成立于2015年12月，法定代表人为王忠磊，注册资本1亿人民币，经营范围包括电影、网络剧制作、发行等，由华谊兄弟传媒股份有限公司全资持股。</p>\n  <p><strong>曝特斯拉限流AI开支</strong></p>\n  <p>北京时间7月3日凌晨，The Information援引特斯拉内部备忘录消息称，特斯拉将从7月6日起，把每名员工使用AI的费用限制在每周200美元（现汇率约合1359元人民币）以内。</p>\n  <p>就在几个月前，特斯拉还要求员工更积极地使用AI。政策如此迅速地转向，说明即便企业把未来押注在AI上，也很难控制不断增加的使用成本。多名参与特斯拉AI部署工作的人员称，过去半年，管理层一直在整合员工各自使用的AI工具，要求全公司采用经过批准的模型，并建立统一的安全规范。但统一方案刚刚成形，特斯拉很快又开始限制支出。（新浪科技）</p>\n  <p><strong>Meta低调推出AI社交应用Pocket，主打互动小游戏</strong></p>\n  <p>Meta近期在部分地区悄然上线了一款名为Pocket的人工智能社交应用。该平台允许用户通过输入简单的文字提示词，生成并分享名为“gizmo”的互动式小型游戏。Pocket被定义为一个“与朋友共同创作、分享及探索gizmos”的平台，每个gizmo都是由AI生成、可交互且能直接游玩的趣味内容。（新浪财经）</p>\n  <p><strong>英伟达前光互连技术高管Ashkan Seyedi加入艾迈斯欧司朗，出任光互连业务负责人</strong></p>\n  <p>艾迈斯欧司朗（ams OSRAM）当地时间7月2日宣布，曾任英伟达光互连技术高管的Ashkan Seyedi已正式加入公司，担任光互连业务线副总裁兼总经理，负责推动面向下一代AI数据中心的光互连技术发展。Seyedi此前在英伟达负责光互连技术研发，参与推动面向AI集群和数据中心的高速光通信技术发展。（界面新闻）</p>\n  <p><strong>美国三大蛋企涉价格操纵，同意支付330万美元并捐赠5300万枚鸡蛋以达成和解</strong></p>\n  <p>美国司法部与17个州的总检察长本周与三家全美最大的鸡蛋生产商达成和解协议，以解决它们涉嫌在2022年6月至2025年3月期间串通操纵鸡蛋价格的指控。涉案企业包括卡尔-梅因食品公司、弗索瓦公司和希克曼蛋业。调查发现，三家企业通过私下协调竞标活动，向市场分析机构厄纳-巴里提交数据时谎称存在更大需求，从而人为抬高Urner Barry每日发布的鸡蛋价格基准。Urner Barry的定价指数被广泛应用于全美鸡蛋供应合同，直接影响零售商和消费者支付的鸡蛋价格。（新浪财经）</p>\n  <p><strong>苹果iOS 27 Beta版操作系统最新SDK包括Apple智能功能</strong></p>\n  <p>36氪获悉，苹果开发者微信公众号发文宣布，iOS 27 Beta版操作系统现可下载。最新SDK带来新功能，包括平台设计优化、Apple智能功能，以及新的AI开发框架。</p>\n  <p><strong>黄仁勋穿过的皮夹克将被拍卖</strong></p>\n  <p>7月3日消息，《商业内幕》报道，苏富比拍卖行将于7月7日起，拍卖一件英伟达CEO黄仁勋穿过的黑色皮夹克，最终成交价预计在4万-6万美元（现汇率约合27.2万- 40.8万元人民币）之间。根据鉴定机构给出的信息，这件皮夹克由奢侈品牌Tom Ford打造，黄仁勋本人曾于2023年穿过它。并且，夹克上还带有黄仁勋的亲笔签名。（第一财经）</p>\n  <p><strong>韩国联合三星、SK等企业推出312万亿韩元投资计划，重点布局半导体与航天产业</strong></p>\n  <p>7月3日，韩国副总理兼企划财政部长官具润哲宣布，将推动各大企业在东南部（岭南���区）投资超312万亿韩元（约2040亿美元），以发展先进制造和AI产业。具体规划中，SK集团、三星、韩华及现代汽车将分别注入约140万亿、60万亿、55万亿和42万亿韩元，重点布局半导体、AI和航天等领域；LG与斗山也将跟进投资。此外，韩国还公布了以泗川为核心的国家航天战略，旨在打造南部沿海航天产业带。（界面新闻）</p>\n  <p><strong>欧盟拟出台未成年人社媒禁令</strong></p>\n  <p>“欧洲动态”网站7月2日援引多名欧盟官员的表态披露称，欧盟委员会主席冯德莱恩计划于9月16日在欧洲议会发表年度“盟情咨文”时公布在欧盟范围内禁止未成年人使用社交媒体的计划。一个未成年人上网安全研究咨询小组预计本月13日提交相关报告，为欧委会提供建议。报道说，尚不清楚欧委会将把使用社交媒体的年龄门槛定在多少岁，以及这项计划具体如何落实。（央视新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>应能微电子启动北交所IPO辅导</strong></p>\n  <p>36氪获悉，证监会官网显示，江苏应能微电子股份有限公司已启动上市辅导，拟在北交所上市，辅导机构为申万宏源证券承销保荐有限责任公司。</p>\n  <p><strong>EG集团旗下坎伯兰农场申请美国IPO</strong></p>\n  <p>据报道，EG集团旗下坎伯兰农场申请美国IPO。</p>\n  <h2>投融资</h2>\n  <p><strong>“格式塔科技”完成4.2亿元天使+轮融资</strong></p>\n  <p>36氪获悉，“格式塔科技（Gestala）”宣布完成4.2亿元人民币天使+轮融资。本轮融资由华映资本领投，C资本、红杉中国、蓝思科技、中电健康基金、创新工场、临港科创投资、复旦复容资本、国泰创投等多家国内外头部投资机构跟投。道彤投资、云时资本、清松资本、戈壁创投等老股东持续超额加码认购。华兴资本担任独家财务顾问。</p>\n  <h2>酷产品</h2>\n  <p><strong>小鹏MONA L03预售开启</strong></p>\n  <p>36氪获悉，7月2日晚，小鹏MONA L03预售开启，并将于7月16日德国慕尼黑全球上市。</p>\n  <p><strong>xTool O1 UV打印机正式发布</strong></p>\n  <p>36氪获悉，近日，xTool在德国柏林举办欧洲品牌发布会，正式向全球推出xTool O1 UV打印机。O1将UV、DTF、DTG、UV DTF四种打印能力整合进一台设备，覆盖木材、金属、亚克力、玻璃、石材、织物、皮革等多种材料。此外，xTool还推出了Atomm创作者平台，并通过AImake等AI工具，帮助用户完成从想法到设计、从设计到制作的转化。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-07-04T01:03:44+00:00", "fetched_at": "2026-07-04T02:30:43.353919+00:00", "fingerprint": "98caa9d9cbcf858f"}, {"source": "少数派", "title": "这四个工作习惯，或许也能帮你找到掌控感", "url": "https://sspai.com/post/111708", "summary": "无论你追求的是更高的职位、更自由的时间、还是某种更纯粹的成就感，有一件事大概是共通的：那就是尽量让自己的人生，少一点完全依赖运气的成分，多一点可被掌控、可被验证的路径。<a href=\"https://sspai.com/post/111708\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-03T03:00:00+00:00", "fetched_at": "2026-07-04T02:30:41.348477+00:00", "fingerprint": "e95fe221e4847d76"}, {"source":   if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
