<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;

    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

</p>\n  <p>截至发稿，这款AI 潮玩硬件<strong>「GENiEX」</strong>，已经在全球知名众筹平台Kickstarter上筹到13.45万美元（约105万港币）。相比上架时的目标1.27万美元（约10万港币），达成率已超1000%。429名支持者愿意为它买单，目前众筹剩余约1个月收官。</p>\n  <p>值得注意的是，GENiEX上线后仅约一小时即完成了10万港币的初始众筹目标。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_569aa8de843547b58ecbb2f8bef137fa@16519798_oswg373968oswg1080oswg526_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：Kickstarter页面截图</p>\n  <p>做出这台赛博对讲机的，是来自杭州的一家工作室「METAPEX」（元巅科技）。<strong>GENiEX是其原创科幻 IP「SEIVOID」（寂核）旗下的首款实体产品。</strong></p>\n  <p>这会是又一个爆款AI硬件吗？</p>\n  <h3>01</h3>\n  <p>过去三年，AI 陪伴赛道的大部分玩家都在堆算力、堆参数。投资人比的是上下文窗口长度，消费者被训练成“哪家 AI 更聪明就买哪家”。结果是显而易见的：硬件不断更新，但体验没有壁垒，新鲜感消失得非常快。任何一个聊天AI——豆包、ChatGPT、Claude——都能随时取代它们，或基于这些大模型做出新的陪伴型产品。</p>\n  <p>“AI 对话本身再强，未来也不过是几家大厂来提供。”METAPEX创始人周百祥在采访中说。“我们想要的，不是更聪明的 AI，而是用户明天还有回来找它的理由。这件事过去游戏行业已经解决了，方法是持续的内容供给。”</p>\n  <p>在他看来，真正的壁垒不在对话能力本身，而在内容能不能持续带来探索的新鲜感。</p>\n  <p>但 SEIVOID 的路径几乎反了过来：<strong>不是先有&nbsp;AI，再为 AI 创造一个角色，而是先有一个已经被构建多年的科幻世界，再让 AI 成为这个世界与现实建立联系的方式。</strong></p>\n  <p>创始人周百祥本人既是科幻小说作者，也是长期深耕动画与游戏产业，拥有超过15年的行业经验。同时还是高端金属潮玩品牌「EDC」的创始人。在GENiEX这个项目立项之前，周百祥花费了近十年时间，构建了一个完整的原创科幻宇宙，包括三部核心小说、400多万字的科幻设定，在这背后是一套完整的世界观、宇宙观和运行规则。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_4642e483a1f0446cbe7c5e9a409521e6@16519798_oswg891085oswg1080oswg777_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">周百祥构建了一个完整的原创科幻宇宙</p>\n  <p>按他的说法，这个宇宙里，人类已经离开地球，硅基生命建立了自己的新文明。GENiEX里的AI角色，不是prompt出来的新人物，而是从这套世界观里长出来的虚拟角色。她不知道今天的天气是晴是雨，不记得你手机里装了哪些App，因为“她本来就不属于这里”。</p>\n  <p>“两个本不该相逢的世界，意外建立起联系。”这是周百祥反复强调的一个设定。</p>\n  <p><strong>在这个IP之上，寂核创作了同名AI动画剧《寂核：未分类的我们》，第一季11集、单集23分钟，定位末世科幻+公路冒险+角色群像+悬疑探索。</strong>目前剧本已完成，正片正在制作中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_95131e54fc6548f5847586c083bc3c93@16519798_oswg513843oswg1080oswg351_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《寂核：未分类的我们》</p>\n  <p>在周百祥看来，这套IP内容的核心受众，可能不是当下AI陪伴赛道瞄准的儿童或女性用户。“大部分是男性为主，”他表示，“更偏向热爱科幻、动画、游戏以及怀旧收藏的成年用户群体。”</p>\n  <p>这类用户消费能力也已经被市场验证。无论是二次元游戏公司的长期运营，还是高端手办、收藏市场的发展，都证明了用户愿意为喜欢的角色、世界观以及持续内容投入。</p>\n  <p>GENiEX选择的也正是这类已经被游戏和收藏文化培养多年的用户群体。它并没有试图成为一个普通&nbsp;AI助手，而是希望成为一个承载世界观、角色与互动体验的新型收藏载体。</p>\n  <p>这也直接影响了GENiEX的设计语言。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_119af1f435ea4035b6707c257eee1b91@16519798_oswg599173oswg1080oswg626_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p>GENiEX不是圆润的家电风，也不是如今很多智能设备的极简风，而是一台对讲机造型的合金机身设备，机械按键外露，扬声器置于机身侧面，整体外观复古且科幻。当然，周百祥本人是重度科幻迷，我们在他的产品上能看到90年代掌机、暴龙机以及卡西欧复古手表的影子。</p>\n  <p>GENiEX的核心玩法有三种：<strong>单人模式</strong>下，玩家通过对话培养与角色的好感度，解锁升级、皮肤、抽卡。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_e9b8d5d38dda4a3f95240fec8a8c9aeb@16519798_oswg500717oswg1080oswg735_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p><strong>双人模式</strong>下，两台 GENiEX 面对面接触，会解锁双方各自看不到的专属内容（类似暴龙机的“双机物理触点”设计）；<strong>多人模式</strong>下，三台以上GENiEX可以接入房间，进行一场线下剧本杀或TRPG风格的冒险游戏。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_fcf012baf37a4255a68c743805ed4de7@16519798_oswg550620oswg1080oswg750_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p>“就像儿时玩��机游戏一样，我们想给朋友一个见面的理由。”周百祥说道。</p>\n  <p>而关于GENiEX里的AI角色定义，周百祥表示，“她不是来陪你的，她是来自另一个世界的存在。”<strong>设计上，GENiEX的角色从不主动问用户的现实生活，也不回答诸如“今天北京天气如何”的问题。</strong>“我们很刻意地摒除了这一切关于现实的东西”，周百祥在采访中说，“就像是玩一款内容很吸引人的游戏，内容本身就很有沉浸感，里面的角色也不会突然跳出来告诉你现在几点了、该吃饭了”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_1c61e39f9c954af392840ed29b11cde6@16519798_oswg743960oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p>对周百祥来说，这背后其实是一个更大的尝试：<strong>能否用游戏行业已经验证数十年的内容消费逻辑，替代&nbsp;AI产品普遍采用的算力订阅逻辑。</strong></p>\n  <p>用户不是因为“继续使用 AI”而付费，而是因为这个世界仍在向前：新的故事、新的角色、新的皮肤、新的声音、新的区域和新的事件持续出现。换句话说，GENiEX 想解决的不是“AI 服务如何续费”，而是<strong>一个虚构世界如何持续生长。</strong></p>\n  <p>周百祥在采访中表示：“我们愿景是不希望用户每个月是在给算力付钱。我们更希望像一款真正喜欢的游戏一样，愿意继续投入，是因为想知道这个世界下一步会发生什么。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_ff732efd4ee8409ca3c660950defc4c8@16519798_oswg699220oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <h3>02</h3>\n  <p>当然，GENiEX的商业逻辑也不仅仅来源游戏。</p>\n  <p>Kickstarter上，GENiEX的价格体系覆盖了普通体验版到收藏级版本：最低档早鸟价1471港币（约187美元），最高阶Founder’s Set售价5191港币（约661美元），目前已有支持者选择最高档方案。<strong>这样的定价并非传统消费电子逻辑，而更接近高端潮玩、模型收藏以及游戏周边市场的消费区间。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_75a3f89841d7462c8f4d4451ba057501@16519798_oswg354248oswg1080oswg853_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Kickstarter平台截图</p>\n  <p>“它有类似泡泡玛特的这种潮玩属性，同时又有二次元手游这种持续的内容供给和更新；然后它同时又有一个像卡西欧手表的潮流配饰属性，例如可以作为包挂佩戴；最后我们也希望能基于此建立一个具备收藏价值的生态。”周百祥表示。</p>\n  <p>周百祥承认这些愿景全部实现还需要很长的路要走，但他希望能像任天堂那样的厂商一样，服务好精准人群，所以产品一定要有自己的个性。</p>\n  <p>此外，GENiEX并不是角色最终唯一的载体。从项目后续更新可以看到，团队此前已经投资并孵化游戏及相关技术团队，基于UE5打造的游戏<strong>《泠泠路101：与你相伴的时光》</strong>计划于2026年Q4上线。在开发游戏的同时，团队也在探索PC端角色体验及跨设备互动等技术方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_b31af377e2374818895534b672bfc05b@16519798_oswg705400oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《泠泠路101：与你相伴的时光》</p>\n  <p>这意味着用户在外出时，可以通过GENiEX与角色互动；回到家后，同一个角色可能以更高规格的形象出现在PC游戏或其他载体中。</p>\n  <p>周百祥称其为“角色跨媒介延续”，如果这一设想成立，变化的不只是“同一个角色出现在更多设备上，就像银翼杀手一样,那真的很酷”。</p>\n  <p>传统IP的动画、游戏、手办，本质上是围绕同一世界观生产的不同商品；而AI与长期记忆第一次提供了一种新可能：<strong>故事可以跨越媒介继续发生，</strong>与用户之间的关系也可以继续存在。</p>\n  <p>白天发生在GENiEX中的经历，晚上可以延续到PC上；动画中的世界，不再在片尾字幕出现时停止；实体收藏品，也可能成为进入下一段内容的入口。“媒介发生变化，但世界继续向前。”</p>\n  <p>GENiEX全球发货时间已锁定明年3月，想体验成熟的产品还需一段时间。“我们国内各地以及海外的团队都在紧锣密鼓完善软硬件产品，内容生产也没有中断。”</p>\n  <p>目前，GENiEX证明的还只是第一件事：数百名用户愿意为这种尚未被明确定义的体验支付真实价格。但它真正试图回答的问题显然更大。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_74f7096abdf4488aa3c6de0b83bf6130@16519798_oswg656962oswg1080oswg733_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p>如果动画负责认识世界，游戏让人进入世界，AI又让这个世界开始记住并回应其中的人，那么这些过去彼此分离的娱乐媒介，是否会因此被重新连接？</p>\n  <p><strong>GENiEX可能只是一台硬件，也可能是这种新娱乐形态的一次早期实验。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_7f87a2e74f9445eb9ff8f6973fac4653@16519798_oswg904349oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GENiEX</p>\n  <p>答案还很早。但至少现在，这个来自未来的“信号”，已经有人收到了。</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/Fc_nzGOE1O2kQose8-2G8g\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-09-03T09:01:35+00:00", "fetched_at": "2026-09-04T02:38:14.405814+00:00", "fingerprint": "a950947f6bf7a9a6"}, {"source": "36氪 - 最新文章", "title": "科氪｜2026 年上半年雷鸟创新包揽第一，雷鸟 iO 首销即爆款开启新增长曲线", "url": "https://36kr.com/p/3967816023929097?f=rss", "summary": "<p>近日，IDC、Counterpoint、CINNO、洛图科技、奥维云网等多家权威市场研究机构相继发布了 2026 年上半年 AR 眼镜与智能眼镜市场报告，雷鸟创新（RayNeo）以横扫之势，包揽全球 AR 眼镜与中国智能眼镜市场出货量和销量第一。</p>\n  <p>其中，IDC、Counterpoint&nbsp;数据共同显示，上半年雷鸟创新以领先优势稳居全球 AR 眼镜出货量榜首，市场份额更高达 24.8% 。换言之，在全球范围内，每售出四台 AR 眼镜，就有一台来自雷鸟创新。至此，雷鸟创新已经连续 5 个季度斩获全球 AR 眼镜出货量第一。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_d6065c1c5b67420f8ef4c67d2deaf382@517825446_oswg130644oswg1080oswg1440_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>值得注意的是，伴随着华为、阿里等大厂集体下场和密集的新品发布，中国市场已经成为全球 AR 与 AI 眼镜竞争最为激烈的关键市场。在这样的背景下，雷鸟创新不仅连续 5 年稳居中国 AR 眼镜销量第一，更在 2026 上半年进一步扩大优势，以绝对优势拿下中国 AR 眼镜销量第一的同时，首次实现中国智能眼镜品类销量第一，覆盖无屏 AI 眼镜与有屏 AR 眼镜的全部阵营。CINNO 数据显示，上半年雷鸟创新 AI/AR 眼镜市场占有率为 25%。在最卷的市场拿下全品类第一，这份成绩的含金量不言而喻。</p>\n  <p>反复“霸榜”的背后，是雷鸟创新对于智能眼镜市场的深度洞察与深厚的技术积累。在过去 5 年时间里，雷鸟创新用一款又一款爆款证明了自己的产品力，成为全球智能眼镜市场增长的关键推动者。</p>\n  <p>当显示型 AI 眼镜成为行业公认的下一个增长点，雷鸟创新再一次站上了浪潮的最前端：雷鸟 iO 将全天候主动式 AI 体验融入日常生活，上市即打破 2026 年智能眼镜新品首销纪录，包揽京东、天猫、抖音三大平台智能眼镜品类销量冠军，成为今年行业的现象级爆款。上半年，专业影视级 AR 眼镜雷鸟 GT 系列也稳居 618 各大主流平台销量冠军，雷鸟 Air 4 系列的全球爆火也拿下亚马逊 Prime Day 2026 Best Seller，而 AI 拍摄眼镜雷鸟 V4 更是成为更多创作者的“生产力工具”。从全天候 AI 体验、专业观影，到内容创作，雷鸟创新的爆款矩阵，已经覆盖智能眼镜的每一条主赛道。每一款产品也都指向同一个目标：让智能眼镜加速走向大众普及。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_6cd6e2ddb2db48c0b40f849a4475c8c7@517825446_oswg627524oswg1016oswg1344_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>在即将开幕的 IFA 展会上，雷鸟创新还将正式发布海外版 iO 与 GT 系列——这不只是把国内爆款带到海外，更是一次面向海外用户的服务本地化。雷鸟 iO 在保持顶尖硬件水准的同时，正式接入 Gemini、ChatGPT、Claude 等海外主流大模型，让 AI 体验真正贴���本地用户的习惯；雷鸟 GT 系列则配备了全新的 Pocket TV，不仅支持杜比画质体验，还内置 Google TV、YouTube、Prime Video 等应用，把“随身巨幕”的体验直接拉满。两款产品在国内均已验证了现象级的销售表现，面向海外又将本地化做在前面。可以预见，下半年海外市场将迎来新一波抢购热潮，雷鸟创新在全球市场的领先优势有望进一步拉开。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_7b05c272e8d742faaf8a853c10cf38d4@517825446_oswg841289oswg2160oswg2880_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>从中国到全球，从 AR 眼镜到智能眼镜，雷鸟创新一步一个脚印，把“第一”走成了常态。智能眼镜从科技概念走向大众日常的进程，正以肉眼可见地加速——而这一次，走在最前面的，是一个中国品牌。属于雷鸟创新的 2026，上半场只是热身，即将开幕的 IFA，是下半场的开场哨。</p>", "category": "tech", "published_at": "2026-09-03T15:11:19+00:00", "fetched_at": "2026-09-04T02:38:14.405809+00:00", "fingerprint": "0ceb4c6d5a47882c"}, {"source": "36氪 - 最新文章", "title": "万千气象北京行：感受经开区高端智造成果", "url": "https://36kr.com/p/3968317634900485?f=rss", "summary": "<p>9月3日上午，由中央网信办网络社会工作局、北京市委网信办主办，新京报贝壳财经承办的“中国式现代化的万千气象”网络名人北京行活动来到经开区。网络名人一行先后来到高级别自动驾驶示范区创新运营中心、小米汽车工厂、Robot Mall具神智能机器人4S店、北京人形机器人创新中心、火箭大街展厅。在这里，高端智造成果百花齐放，科技创新氛围浓厚。</p>\n  <p><strong>智驾未来一路畅行</strong></p>\n  <p>科技感十足的小型巴士在路间穿梭，定睛一看，车辆前方没有手握方向盘的司机</p>\n  <p>——这是北京市经开区道路上的一幕，正在行驶着的是来自百度、小马智行、文远知行等品牌的无人驾驶汽车。上午，在高级别自动驾驶示范区创新运营中心，网络名人成为乘客，亲身体验了智能出行新方式。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_3d40630ac9414c07969aac3b9601ed22@1200352198_oswg2967034oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为百度自动驾驶小巴）</p>\n  <p>高级别自动驾驶示范区创新运营中心位于北京市经开区，这里开放大规模常态化道路测试场景，并持续推进自动驾驶载人示范、车路协同基础设施建设，是全国首个国家级智能网联汽车政策先行区。在创新运营中心的展厅内，讲解员介绍说，示范区自2020年建立以来，已经经过了四个阶段的发展，致力于推进车路云一体化。除了网络名人们体验到的小巴车，夜晚，无人环卫车还会对道路进行清扫，减轻环卫工人的负担。</p>\n  <p>走出高级别自动驾驶示范区创新运营中心，网络名人们来到小米汽车工厂。在小米汽车工厂的展厅内，一辆悬挂在空中的汽车引起了大家的注意，它是小米YU7海湾蓝色，与天花板上它的镜像共同组成莫比乌斯环造型。小米汽车集合多项科技创新成果，小米超级电机、小米昆仑平台、铠甲笼式钢铝混合车身等零部件置身展台，吸引网络名人驻足。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_014c865620d941b7a16b90d0f1ad9125@1200352198_oswg2070013oswg3555oswg2393_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人们参观小米汽车展厅）</p>\n  <p>小米汽车诞生于工厂车间。这里设有冲压、压铸、车身、涂装、总装、电池六大车间，物流机器人、组装机械臂、车间工程师井然有序。工厂车间满产每小时40辆，76秒下线一台，消费者们订购的汽车就从这里诞生。在逐一通过道路测试后，小米汽车将走进千家万户，来到用户身边。</p>\n  <p><strong>智能生活触手可及</strong></p>\n  <p>下午，网络名人们来到Robot Mall具身智能机器人4S店与北京人形机器人创新中心，感受科技走进生活的另一种可能。在这里，机器人企业与市场引用端相连接，机器人走入生活场景，家庭、康养、文娱等领域都有它们的身影。</p>\n  <p>在Robot Mall具身智能机器人4S店搭建的家庭场景中，仿生机器人女主人端坐于沙发上，在她背后的鱼缸里，是一条与真实鱼类共游的仿生金龙鱼机器人。不远处的“机器人大世界”娱乐舞台上，两名穿着长马褂的机器人操着一口纯正的天津话讲相声，康养区里，中医机器人“王叔和”则忙着替网络名人把脉。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_40dba69341144c9c9647fd2a5ac516b5@1200352198_oswg2233163oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为仿生机器人的客厅）</p>\n  <p>这些机器人怎么动起来？在北京人形机器人创新中心里，机器人的手、关节、电路等以零部件的形式展出。灵巧手展台上，网络名人与机械手互动，体验到了让机器“活”起来的技术，视觉随动。不远处，机器人的关节部件安静陈列，讲解员介绍说，没有关节，机器人寸步难行。</p>\n  <p>上千个部件在体内的精密运转，能帮助具身智能机器人实现人们所期望的复杂功能。它们的规模化应用将让机器人变得更稳定、更好用。</p>\n  <p><strong>商业航天逐梦苍穹</strong></p>\n  <p>在当日的最后一站，火箭大街展厅里，“朱雀二号”模型引起了大家的关注与讨论。它是全球首枚成功入轨的液氧甲烷火箭，也是现役民营最大的液体火箭。火箭形态如何设计？发射后需不需要回收，如何回收？网络名人们向讲解员提问，热情讨论着商业航天的创新成果。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_0ce60aad813d4354b8a2daa9361ab621@1200352198_oswg2765378oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人在火箭大街展厅）</p>\n  <p>在展厅的三层，网络名人们身临其境体验了模拟火箭发射。随着讲解员“3、2、1”的倒数，眼前电子投影中的“朱雀”徐徐升空。火箭飞向浩瀚宇宙，那片星空也是由一块块电子屏模拟出的，它们构成了火箭大街展厅的星际探索中心。中心高达三层，可以由负一层进入，这里放置着按1:3.5比例制作的火箭模型。</p>\n  <p>智能助力太空探索，科技创造生活未来。在经开区，前沿技术正加速走出实验室、融入生产生活，让科技创新的繁荣景象变得可知、可感、可触。未来，更多新技术、新产品、新场景将从这里出发，走向更加广阔的舞台。</p>", "category": "tech", "published_at": "2026-09-03T23:41:58+00:00", "fetched_at": "2026-09-04T02:38:14.405802+00:00", "fingerprint": "b746a505b3b98619"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨字节跳动被曝获近300亿美元贷款；OpenAI正式发布GPT-6 Astra；英伟达129.3亿美元收购Hugging Face", "url": "https://36kr.com/p/3968346621751812?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Meta取消员工AI使用量与绩效挂钩机制</li>\n   <li>ChatGPT、Codex、Grok突发故障，多家AI公司遭遇服务中断</li>\n   <li>微信公关总监回应“好友超1万可查看单删好友”</li>\n   <li>燧原科技中签号出炉，共有20657个</li>\n   <li>世界气象组织确认厄尔尼诺已形成，或将发展为超强级别</li>\n   <li>长存控股科创板IPO审核状态变更为“已问询”</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>消息称字节跳动获近300亿美元贷款，为今年亚洲第二大美元贷款</strong></p>\n  <p>9月3日，据知情人士透露，TikTok开发商字节跳动已获得296亿美元（约合376亿新元）贷款，成为2026年亚洲规模第二大的美元计价贷款。知情人士表示，字节跳动最初计划融资200亿美元，但由于多家银行提供强力承诺，最终将融资规模扩大至296亿美元。融资所得资金主要用于一般公司用途。据了解，字节跳动正加速AI投入，考虑将2026年资本支出提升至最高700亿美元，约为去年两倍以上，主要用于扩建数据中心及其他AI基础设施。字节跳动上一次大规模境外贷款发生在2024年，筹集约108亿美元。截至发稿，字节跳动方面暂未回应。（第一财经）</p>\n  <p><strong>OpenAI正式发布GPT-6 Astra，人类进入AGI大分工时代&nbsp;</strong></p>\n  <p>当地时间9月3日，OpenAI官方定调称，这是“全球最智能、最符合人类意图的模型”。Astra集合了多年在预训练、强化学习和模型对齐领域的研究成果，在计算机操作、网页浏览、软件工程、网络安全、科学研究以及专业工作等多个方向达到新的能力水平。相比以聊天、写作和问答为主的前代模型，Astra更像一个能直接干活的AI Agent：它可以调用工具、操作软件、浏览网页，独立完成复杂任务。OpenAI总裁Greg Brockman表示：几年后回头看，今天就是AGI时代的起点。（APPSO）</p>\n  <p><strong>英伟达129.3亿美元收购Hugging Face</strong></p>\n  <p>9月3日，英伟达宣布，已同意以129.3亿美元收购Hugging Face。英伟达承诺将维持Hugging Face作为开放平台运营。双方将共同扩展Hugging Face的平台规模，强化其基础设施，并为全球开发者和机构提供更广泛的人工智能应用机会。开发者可以自由选择所需的模型、框架、云服务及推理服务提供商，以及计算平台。在Hugging Face上构建或部署应用时，无需使用英伟达的计算资源。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Meta取消员工AI使用量与绩效挂钩机制，Hatch测试推动Token消耗上升</strong></p>\n  <p>9月3日，据报道，Meta本周在内部通知中表示，员工绩效评估将不再依据AI工具使用量，包括Token消耗等指标。此前，Meta曾推动员工提升“AI驱动影响力”，AI使用程度在实际工作中成为关注指标。与此同时，Meta员工开始测试新型智能体AI工具Hatch。员工称，尽管绩效考核不再强调AI使用量，Hatch等智能体工具的使用仍在推高Token消耗。（界面新闻）</p>\n  <p><strong>奥特曼首次明确表态，OpenAI将自研人形机器人</strong></p>\n  <p>当地时间9月2日，OpenAI CEO奥特曼在播客节目中确认，公司将自研人形机器人本体，同时并行开发数据中心特种机器人。原世界模拟项目升级为OpenAI Robotics，短期研发辅助基建工人的机器人，长期目标实现人手一台个人机器人。OpenAI首款无屏便携AI终端预计2027年推出，外形类似甜甜圈，售价或超300美元。（界面新闻）</p>\n  <p><strong>腾讯推出WorkBuddy金融版</strong></p>\n  <p>36氪获悉，据腾讯安全消息，腾讯正式推出WorkBuddy金融版，为保险、资管、银行等机构提供覆盖投研、合规、客户经营、信贷尽调、财富资配等核心业务的技能矩阵与金融数据源及全链路安全可信底座。</p>\n  <p><strong>Meta：“西瓜”模型研发进展顺利</strong></p>\n  <p>Meta首席人工智能官Alexandr Wang表示，新发布的Muse Spark 1.3的价格将与Muse Spark 1.2相同，但其效率更高，运行所需的Token减少了25%。Meta尚未决定是否公开Muse Spark 1.3的权重，但公司仍计划公开Muse Spark 1.2的权重。公司仍在按计划开发规模更大的“西瓜”（Watermelon）模型，“我们相信‘西瓜’将极具竞争力。”（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>上市34年后，康佳集团主动申请退市</strong></p>\n  <p>9月3日，*ST康佳公告称，拟以股东会决议方式主动撤回A股和B股股票在深交所的上市交易，并在终止上市后转入全国中小企业股份转让系统退市板块转让。公告指出，公司股票自9月4日开市起停牌，直至深交所公告终止上市决定后5个交易日内摘牌。如终止上市事项未获股东会审议通过，公司将申请股票自股东会决议公告之日起复牌。公开信息显示，*ST康佳A所对应的上市公司全称为康佳集团股份有限公司，为昔日国内彩电巨头之一，于1992年上市，迄今已上市34年。（第一财经）</p>\n  <p><strong>天猫上线Token充值中心，首批接入阿里云、智谱、Kimi、MiniMax</strong></p>\n  <p>36氪获悉，9月3日，天猫正式上线AI空间站（Token充值中心）。页面显示，该充值中心集合了阿里云、智谱、Kimi、MiniMax等国内大模型厂商的订阅服务，在售商品包括按周期订阅的Token Plan、Coding Plan以及按用量付费的充值方案，支持卡密或直充两种交付方式。</p>\n  <p><strong>上海多家银行明确：1991年前生人不能新办理40年期房贷&nbsp;</strong></p>\n  <p>据上观新闻，日前，房贷可以贷40年的新政策引发各方关注。目前，上海部分银行已经开放了存量房贷的延期申请。记者从交通银行上海市分行了解到，目前存量房贷可以办理延期，延期期限不能超过原贷款期限的一半，且原贷款期限与延长期限合计不能超过40年。此外，多家银行表达了“贷款人年龄+贷款期限”不超过75年这一门槛。这也意味着，如果按照这个标准，1991年以前出生的贷款人新办理房贷时，已经不能办理40年期的个人房贷。（财联社）</p>\n  <p><strong>ChatGPT、Codex、Grok突发故障，多家AI公司遭遇服务中断</strong></p>\n  <p>9月3日晚，据Downdetector上的用户报告以及各公司状态页面显示，多家AI公司正遭遇服务中断。</p>\n  <p>OpenAI表示，其ChatGPT和Codex目前正出现问题。Anthropic表示正在调查Claude出现的错误，并致力于修复。SpaceXAI表示Grok目前出现故障，正在调查服务中断。据Downdetector显示，已有超过12,000份用户报告指出OpenAI存在问题，关于Claude的问题报告约有1,200份，关于Grok的问题报告约有1,000份。（财联社）</p>\n  <p><strong>韩国电力公司拟向三星、SK海力士预收数百亿美元级电费</strong></p>\n  <p>9月3日，据报道，韩国电力公司（KEPCO）正与三星电子、SK海力士洽谈预收大额电费，以筹集资金建设新半导体产业集群的电网。KEPCO称，具体预付款金额和覆盖期限尚未确定，该机制可帮助大型用电企业及时获得电力供应，同时为公司提供替代融资渠道，降低对债券市场的依赖。据悉，KEPCO曾提议三星预付20万亿韩元（约147亿美元）、SK海力士预付5万亿韩元，依据2025年电费及预计2027年至2031年用电成本计算。（界面新闻）</p>\n  <p><strong>阿里发起多起.ai域名投诉&nbsp;</strong></p>\n  <p>记者关注到，过去几个月，阿里正围绕旗下多个业务相关的“.ai”域名密集发起投诉。记者梳理捷克仲裁法院（CAC）的公开信息发现，goofish.ai、taobao.ai、qwenchat.ai、alibaba.ai等域名都曾进入争议程序，最终被裁定转移给阿里相关主体，此外，也有阿里对1688.ai提出的域名转移申请目前遭到驳回。阿里并非第一家争夺“.ai”的互联网公司，过去几年，腾讯、谷歌等都有类似动作，如何从原持有者手中通过域名争议解决程序拿回相关域名，也成为大厂不得不面对的问题。一些域名投资者也将部分AI域名的抢注视作可能的商机。（第一财经）</p>\n  <p><strong>微信公关总监回应“好友超1万可查看单删好友”</strong></p>\n  <p>9月3日下午，微信公关总监发文称，“好友超1万可查看单删好友”，看到很多朋友在关心。这个功能并不是为“查谁删了我”而设计的，而只是给那些真的忙到加不进好友的人，一个整理关系的出口。文中称，很多用户说为什么不给所有人直接推一个一键查看单删好友功能？我理解这是有点刻意“反社交焦虑”，不想把那种“是否被删了”的窥探焦虑，变成人人随时能查看的潘多拉宝盒。不是不让知道，是不想让知道，变成新的负担。（第一财经）</p>\n  <p><strong>伊朗打击科威特美军基地，国际油价跳水，美油失守90美元</strong></p>\n  <p>北京时间9月3日午后，国际油价快速下挫，截至15:39，布油跌幅近1.5%，失守95美元/桶，WTI原油失守90美元/桶，跌幅1.32%。据新华社援引伊朗媒体3日报道，伊朗使用导弹和无人机打击了科威特美军基地。消息人士说，现场冒出滚滚浓烟。稍早前，科威特军方说，防空力量正应对导弹和无人机攻击。（21世纪经济报道）</p>\n  <p><strong>人人影视APP上线，月度会员25元起</strong></p>\n  <p>近日，有网友晒出“人人影视”向老用户发出的“欢迎老用户回归”邮件。蓝鲸新闻记者查询发现，目前“人人影视”更名为“人人影视分享精彩”，已经可以在iOS应用商店、安卓商店等渠道下载。下载界面显示，“正版译制”。人人影视APP也推出了会员付费服务，月会员25元，季度会员60元，年会员175元。人人影视的前身，是2003年成立的字幕组“YYeTs”。成立后，人人影视字幕组曾翻译过《生活大爆炸》《权力的游戏》等多部大爆作品，但由于字幕组的版权问题一直处于灰色地带，它的命运也处于风雨飘摇之中。（蓝鲸新闻）</p>\n  <p><strong>燧原科技中签号出炉，共有20657个</strong></p>\n  <p>燧原科技（688801）9月3日披露首次公开发行股票网上中签结果，中签号码共有20657个，每个中签号码只能认购500股燧原科技股票。（界面新闻）</p>\n  <p><strong>世界气象组织确认厄尔尼诺已形成，或将发展为超强级别</strong></p>\n  <p>9月3日，世界气象组织发布通报，确认厄尔尼诺现象已经形成并将持续增强，预计发展为超强级别，极端天气风险或将延续至2027年，事件持续到2027年2月概率接近百分之百。太平洋海域热量积蓄充足，为厄尔尼诺增强提供动力，将改变全球降雨、气温格局，推高洪涝、干旱、高温发生风险。该组织宣布启动五十年来最大规模动员，强化全球气象预警。厄尔尼诺属于自然气候现象，并非气候变化引发。（央视新闻）</p>\n  <p><strong>大众汽车计划再裁员5万人并大幅精简产品线</strong></p>\n  <p>大众汽车9月3日发布声明称，公司监事会一致批准全面重组计划，以提高运营效率和增强竞争力。该计划要求再裁减5万个岗位，使公司计划裁员总数达到10万。大众汽车将精简旗下业务和资产组合，同时到2035年将车型阵容削减约50%。（界面新闻）</p>\n  <p><strong>市面出现2980元胖东来求职研修班，官方辟谣无合作</strong></p>\n  <p>9月2日，据封面新闻调查，市面上出现收费2980元两天一夜的“胖东来求职面试研修班”，课程包含企业文化宣讲、门店观摩、简历修改及模拟面试等内容，机构称与胖东来并无合作，该项目为新上线业务，暂无历史通过率数据。胖东来客服回应，从未开设、授权任何求职培训班，正式招聘以官方公众号为准，企业并非执法部门，无法直接制止第三方培训行为。胖东来提醒，所有招聘不收取费用，以培训、内推名义收费均为诈骗。（封面新闻）</p>\n  <p><strong>9月多重天象轮番上演，今年中秋月为罕见“十七圆”&nbsp;</strong></p>\n  <p>新华社消息，9月昴星团伴月、月掩金星、中秋月、海王星冲日等天象相继出现。9月7日‑17日月亮将依次靠近火星、木星、金星、心宿二，9月14日金星伴月观赏价值较高，南方观测条件更佳，云南、贵州、广西部分地区有望观测月掩金星。9月19日将迎来本年度最小上弦月。今年中秋9月25日，中秋月为罕见“十七圆”，最圆时刻出现在9月27日0时49分，25‑27日夜晚均适合赏月。（新华社）</p>\n  <p><strong>特朗普政府：为训练模型复制作品不违反版权法</strong></p>\n  <p>特朗普政府在一场大规模版权侵权诉讼中表态支持OpenAI及其他人工智能公司，此案牵扯美国多家大型出版机构，包括主流报纸、图书出版社、唱片公司以及数万名独立作者。美国司法部于当地时间周二发表声明，支持OpenAI在多家出版机构和多位作家提起的版权诉讼中所提出的“合理使用”抗辩。美国司法部指出，政府鼓励发展并维持美国在人工智能技术领域领导地位的政策，并敦促纽约联邦法官裁定，为训练大型语言模型而复制作品并不违反版权法。（新浪财经）</p>\n  <p><strong>江苏：招聘时不得使用“高薪”“面议”等模糊表述&nbsp;</strong></p>\n  <p>9月2日，据江苏省人力资源社会保障厅消息，江苏发布《招聘信息发布参考文本》，从源头规范人力资源市场秩序。参考文本明确，招聘时不得使用“高薪”“面议”等模糊表述，代扣代缴项目须逐项列明，例如“月薪制，6000～9000元/月，由基本工资、绩效工资、加班工资构成，每月20日银行转账发放，依法代扣个税、社保、公积金”；“计件制，基础工资2000～3000元，计件单价10～20元”。福利待遇应列明各项补贴、食宿等福利，不得虚假承诺，例如“享有交通、夜班补贴，节日福利，年度体检，提供宿舍或住房补贴，工作日免费工作餐”。（每日经济新闻）</p>\n  <p><strong>美股三大指数收盘集体上涨，特斯拉涨超5%</strong></p>\n  <p>36氪获悉，9月3日收盘，美股三大指数集体上涨，纳指涨1.4%，标普500涨1.06%，道指涨1.18%；大型科技股普涨，特斯拉涨超5%，Meta涨超3%，微软涨超2%，英伟达、谷歌、亚马逊涨超1%，苹果涨1%；热门中概股涨跌不一，百度涨超1%，哔哩哔哩、理想汽车、小鹏集团小幅上涨，阿里巴巴、蔚来平收，网易跌超1%，拼多多、京东小幅下跌。</p>\n  <h2>上市进行时</h2>\n  <p><strong>长存控股科创板IPO审核状态变更为“已问询”&nbsp;</strong></p>\n  <p>9月3日，上交所官网信息显示，长江存储控股股份有限公司（简称“长存控股”）科创板IPO审核状态变更为“已问询”。长存控股成立于2016年，总部位于武汉，是国内知名存储器IDM企业。长存控股此次IPO拟募资330亿元，是目前科创板IPO拟募资规模最大的项目。募集资金中208亿元用于长江存储量产线技术升级项目，122亿元用于研发相关募投项目。（证券时报）</p>\n  <p><strong>深圳欧税通控股股份有限公司递表港交所</strong></p>\n  <p>36氪获悉，据港交所文件，深圳欧税通控股股份有限公司向港交所提交上市申请书，联席保荐人为中金公司、申万宏源香港。</p>\n  <p><strong>百事宝启动北交所IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，浙江百事宝电器股份有限公司（简称“百事宝”）于2026年9月2日在浙江证监局办理辅导备案登记，拟向不特定合格投资者公开发行股票并在北交所上市，辅导券商为浙商证券。</p>\n  <p><strong>AI算力公司Nscale签约收入增至约1030亿美元，或最快本月启动IPO</strong></p>\n  <p>9月3日，据报道，英国AI“新云”服务商Nscale已向潜在投资者披露，其合同签约收入增至约1030亿美元，其中包括与Anthropic达成的450亿美元算力协议。该公司由英伟达支持，最早可能于本月启动IPO。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“汉鼎智能”完成数千万元战略轮融资</strong></p>\n  <p>36氪获悉，“汉鼎智能”已于近期完成数千万元战略轮融资，由红榕资本领投，上市公司德赛西威、物产中大、长江产投、海川资本、天泓投资、江远投资等跟投。资金将主要用于线控转向（SBW）技术的量产落地及高端EPS产能升级。</p>\n  <h2>大公司财报</h2>\n  <p><strong>三只松鼠半年报营收微降净利大增，线上渠道结构调整，终止H股上市筹划</strong></p>\n  <p>8月28日，三只松鼠发布2026半年报，上半年营收52.80亿元，同比下降3.61%；归母净利润2.49亿元，同比增长79.94%。第三方电商营收占比持续下滑，抖音系平台营收占比回落，资源向天猫、京东倾斜。线下分销业务大幅增长，门店端收缩国民零食店，扩张生活馆新业态。公司同日公告，终止筹划17个月的H股境外发行上市。财报将营收下滑归因于线上流量规则变化、线下品类调整、门店业态优化，净利提升得益于旺季销售、制造升级以及投流效率改善。（经济观察报）</p>\n  <h2>酷产品</h2>\n  <p><strong>印有特朗普头像的1美元硬币正式推出&nbsp;</strong></p>\n  <p>据央视财经，当地时间9月2日，美国铸币局正式推出印有特朗普头像的1美元硬币。（财联社）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260904/v2_ce75b6e9a1af46f69d78b8c751411021@1200352198_oswg85147oswg960oswg540_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：网络</p>\n  <p><strong>阿里云：Qoder上线“眼镜版”，将接入千问AI眼镜、乐奇AI眼镜</strong></p>\n  <p>36氪获悉，据阿里云消息，阿里智能体编程平台Qoder上线“Qoder眼镜版”，将首批接入千问AI眼镜和乐奇AI眼镜。未来，用户无需打开手机、触碰屏幕，戴上眼镜就能随时随地通过语音交互让Agent执行任务。Qoder千问AI眼镜版已开启定向邀测，完整功能将于2026云栖大会正式发布。</p>\n  <p><strong>整理</strong>｜李琪</p>", "category": "tech", "published_at": "2026-09-04T00:11:07+00:00", "fetched_at": "2026-09-04T02:38:14.405794+00:00", "fingerprint": "96e56a6064d718fb"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 解决钙钛矿材料涂布难题，中科院系企业完成数千万元Pre-A轮融资", "url": "https://36kr.com/p/3963287086496899?f=rss", "summary": "<p>作者｜乔钰杰</p>\n  <p>编辑｜袁斯来</p>\n  <blockquote>\n   <p>本文1500字，预计阅读4分钟</p>\n  </blockquote>\n  <p>硬氪获悉，钙钛矿太阳能电池企业长春日耀光电科技有限公司（以下简称“日耀光电”）完成数千万元Pre-A轮融资，由天津创业投资管理有限公司（天创资本）与吉林省科技投资基金有限公司（吉林省科投）联合出资。此前，公司曾获长兴基金数千万元天使轮独家投资。</p>\n  <p>日耀光电成立于2023年，依托中国科学院长春应用化学研究所秦川江研究员团队的研究成果创立，团队在Science、Nature等期刊累计发表论文110余篇。<strong>公司目前布局新型自组装分子（SAM分子）材料、薄膜在线检测装备、钙钛矿太阳能电池组件三大产品线。</strong></p>\n  <p>SAM材料是日耀光电的核心突破口。该材料主要用作钙钛矿电池的空穴传输层。<strong>团队开发的新型自由基SAM分子，通过独特的分子设计在结构中引入官能团或扭转构型，显著提升其在溶液中的分散性，在国际上首次解决了SAM薄膜的大面积涂布难题。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_1537961831c845ae958b55d9a3b65461@5920579_oswg244962oswg1706oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>目前，钙钛矿电池产线普遍采用氧化镍（NiOx）作为空穴传输层，再叠加钝化层材料，工序复杂、成本较高。日耀光电开发的SAM材料可实现无NiOx的大面积制备新工艺，改进产线结构，使产线投资成本减少20%、电池制造成本降低10%。</p>\n  <p>基于这一自主SAM材料，公司与隆基合作、经NREL认证的钙钛矿/晶硅叠层电池效率达34.2%，处于世界前三水平。目前，核心SAM材料已与国内外100余家企业及科研机构开展合作。</p>\n  <p>检测装备方面，秦川江告诉硬氪：“只有2–3纳米厚的SAM薄膜，要表征它的物理化学性能非常难，目前市面上没有商业化装备能全方面评价这一层性能的好坏。”</p>\n  <p>基于这一痛点，日耀光电首创SAM原位表征技术，合作开发出一体化检测装备，可实现原位、高精度、多模态、高通量的材料筛选与产线在线检测。该装备基于电化学原理，能够有效表征薄膜的物理化学特性，填补了钙钛矿电池生产过程中的工艺监测缺口。目前设备正在进行商品化迭代。</p>\n  <p>电池组件方面，团队可自主完成从材料到组件的全流程开发，目前最大可制备300×300毫米尺寸器件。未来，公司产品将主要面向车载光伏与空天光伏两大方向。</p>\n  <p>本轮融资资金将重点用于建设国内首条年产百公斤级新型自组装空穴传输材料中试线，扩充核心研发团队；同时建设大尺寸钙钛矿电池组件试验线，锁定车载光伏与空天光伏两大应用赛道。</p>\n  <p><strong>以下为硬氪与日耀光电创始团队交流节选：</strong></p>\n  <p><strong>硬氪：钙钛矿量产化的最大瓶颈是大面积制备，大面积涂布的难点具体在哪一层？日耀光电的SAM材料解决了什么问题？</strong></p>\n  <p>秦川江：我们的材料相当于钙钛矿电池底部的第一层功能层，涂在导电基底上。现在主流的产线工艺，是在ITO导电玻璃上先镀一层氧化镍，再在氧化镍上涂布钝化材料或直接做钙钛矿，我们的材料是在钙钛矿之前直接涂布。</p>\n  <p>大面积组件的难点在于，每一层都必须足够好，最终才能得到高效率的器件。这也是为什么小面积器件效率可以很高，而大面积组件效率还达不到晶硅的水平。我们这层SAM材料首先解决的是空穴传输层本身的质量，同时它也会直接影响上面钙钛矿层的成膜质量。更重要的是，它让空穴传输层实现了无氧化镍制备，省掉了一层工艺。</p>\n  <p><strong>硬氪：现阶段收入来自SAM材料和检测装备，未来再切组件，这个节奏是如何考量的？</strong></p>\n  <p>秦川江：我们目前的定位是上游材料与工艺供应商，和下游主机厂之间不存在直接竞争，这让我们更容易获得业内认可。先做材料和检测装备，本质上是在钙钛矿产业化的最上游先卡住位置，这个阶段比拼的是技术和材料性能，而不是组件产能。</p>\n  <p>当然，我们也要考虑客户未来自行开发同类材料的风险，所以会通过持续的技术迭代保持领先。</p>\n  <p>组件方面，我们现在已经能够小批量制作。至于大规模组件产线要不要建、什么时候建，会根据市场的发展情况来决定。如果钙钛矿市场很快起来，且市场空间足够大，我们也有可能搭建组件产线，这属于公司的长期战略选项。</p>", "category": "tech", "published_at": "2026-09-04T02:22:52+00:00", "fetched_at": "2026-09-04T02:38:14.405778+00:00", "fingerprint": "e93957c1c9d27c33"}, {"source": "少数派", "title": "当 a UK launch with Wayve for several years. [&#8230;]", "category": "tech", "published_at": "2026-09-02T23:00:00+00:00", "fetched_at": "2026-09-03T02:41:31.135568+00:00", "fingerprint": "a54a8dca955e6cef"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨星宇董事长就解约应届生致歉；中一签或赚28万，燧原科技中签率公布；苹果新任CEO薪酬公布，略高于前任库克", "url": "https://36kr.com/p/3966924648029701?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>智谱入驻天猫开旗舰店，大模型Token订阅零售正式落地</li>\n   <li>微信灰度测试防错过新功能</li>\n   <li>OpenAI官宣下一代模型：能自己找漏洞并发起攻击</li>\n   <li>追觅回应放弃整车量产</li>\n   <li>Minimax成为内地投资者新宠，港股通买入规模超越阿里巴巴和腾讯</li>\n   <li>外交部回应G20财长会议未发表公报</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>星宇股份董事长回应“解约应届生”：正在政府部门指导下妥善落实相关措施</strong></p>\n  <p>9月2日，星宇股份召开网络业绩说明会，在回应近期用工事件相关舆情时，星宇股份董事长兼总经理周晓萍表示，公司高度关注近期舆情，已就事件的真实情况公开发布致歉信并正在政府部门的指导下妥善落实相关措施。“公司对披露真实情况的媒体监督表示衷心感谢，公司深刻反省并真诚道歉。同时，公司对部分媒体的不实报道也已通过网信和网安部门进行投诉和举报，维护公司的合法权益。”她提到。（财联社）</p>\n  <p><strong>中一签或赚28万，燧原科技中签率公布</strong></p>\n  <p>9月2日，燧原科技披露公司首次公开发行股票并在科创板上市网上发行申购情况及中签率，本次发行股份数量为4303.5173万股，发行价142.18元/股；网上发行有效申购户数703.2045万户，有效申购股数420.66亿股。因网上发行初步有效申购倍数超100倍，启动回拨机制，将344.3万股从网下回拨至网上。回拨后，网上最终发行1032.85万股，最终中签率0.02455315%。</p>\n  <p>据了解，燧原科技与摩尔线、沐曦股份、壁仞科技并称为“国产GPU四小龙”，主营业务及经营模式相近。摩尔线程、沐曦股份已先后登陆科创板，上市首日的收盘涨幅分别为超过425%和692%。若燧原科技上市首日的涨幅超过400%，中一签的浮盈将超过28万元。（新浪财经、界面新闻）</p>\n  <p><strong>苹果新任CEO薪酬公布，略高于前任库克</strong></p>\n  <p>苹果公司计划向其新任首席执行官约翰·特努斯支付300万美元的年薪，外加2027财年（起始于2026年9月底）目标年度股票奖励5500万美元。与库克的薪酬相比，特努斯的薪酬略有上涨。2025财年，库克基本年薪为300万美元以及5000万美元股票奖励，但最终库克拿到了大约7430万美元的实际薪酬，除了基本年薪和股票奖励外，还有1200万美元的非股权激励，以及176万美元的其他薪酬。苹果Apple官方X账号已取关了蒂姆·库克，并仅关注这位新任CEO约翰·特努斯。（澎湃新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI官宣下一代模型：能自己找漏洞并发起攻击</strong></p>\n  <p>当地时间9月1日，OpenAI发文宣布，“计划尽快”发布下一代人工智能（AI）模型Astra，但由于该款模型是首个达到“关键”（Critical）网络安全能力门槛的AI模型，公司将限制其使用范围。OpenAI表示，新一代AI模型Astra能够发现此前未知的安全漏洞，并在无需人类逐步指导的情况下利用漏洞并发起攻击。从目前公布的测试结果来看，Astra的网络攻击能力已经相当突出。OpenAI称，Astra在ExploitBench测试中取得满分，该测试主要用于评估大语言模型利用已知系统漏洞实施攻击的能力。（观察者网）</p>\n  <p><strong>谷歌发布Gemini 3.8 Flash系列</strong></p>\n  <p>谷歌正式推出Gemini 3.8 Flash，以及面向网络安全场景的Gemini 3.8 Flash Cyber，这是六周内谷歌第三款Flash版本模型。</p>\n  <p>该模型输入成本0.75美元/百万Tokens，输出3.75美元/百万Tokens，单任务成本0.58美元，生成速度达305 tokens/s。基准测试智力指数59分，代码能力突出，软件工程测试DeepSWE v1.1取得73.7%成绩，综合表现逼近GPT‑5.6 Sol、Opus 5等旗舰模型。模型依靠低成本优势，通过多次内部迭代反思完成复杂任务。安全专项版本Gemini 3.8 Flash Cyber漏洞挖掘能力大幅领先，实测两小时即可发现高危漏洞，该版本不对公众完全开源，仅对可信机构开放。（新智元）</p>\n  <p><strong>英伟达拟140亿美元收购Hugging Face</strong></p>\n  <p>9月2日消息，英伟达正深入谈判拟以近140亿美元收购AI开源平台Hugging Face，若交易达成为2025年全球AI领域最高金额收购案。交易包含129亿美元现金对价与10亿美元核心员工留任激励，条款仍有调整空间，或于本周敲定，目前双方均未官宣置评。</p>\n  <p>Hugging Face被誉为“AI界GitHub”，坐拥超1300万全球开发者、300万个开源AI模型，是海内外主流模型分发核心平台，年化营收约1.5亿美元。英伟达2023年已参投其D轮融资，本次收购报价较彼时估值涨幅近三倍。（界面新闻）</p>\n  <p><strong>腾讯WorkBuddy宣布开放平台上线，全面开放Agent基座能力</strong></p>\n  <p>36氪获悉，腾讯WorkBuddy宣布开放平台正式上线，首批引入超百家生态伙伴，面向智能硬件、行业应用与开发者等开放底层Agent能力。发布会现场，9款联名智能硬件首发亮相，合作方包括Plaud、Rokid、影石、科大讯飞、安克、猛玛、京东京造等品牌；30余个行业应用同步接入，覆盖金融、法律、医疗、教育、公益等20多个领域。</p>\n  <p><strong>Kimi API已初步支持Codex和Claude Code</strong></p>\n  <p>9月2日，月之暗面宣布，为满足大家在Codex和Claude Code中接入Kimi API的需求，Kimi API现已支持OpenAI的Responses API格式；同时支持Anthropic的Messages API格式。使用Codex或Claude Code的用户，消耗转换格式或本地代理，即可通过自定义模型提供商直连kimi-k3、kimi-k2.7-code-highspeed、kimi-k2.7-code、kimi-k2.6等模型。（界面新闻）</p>\n  <p><strong>马斯克预告10天后发布Grok 4.7模型</strong></p>\n  <p>马斯克在X平台发布推文，预告将会在10天后发布Grok 4.7模型。Grok 4.7模型参数规模达到2.1万亿，相比较Grok 4.6（1.5万亿）增长40%。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>智谱入驻天猫开旗舰店，大模型Token订阅零售正式落地</strong></p>\n  <p>9月2日，智谱开设天猫官方旗舰店，正式上线GLM Coding Plan系列订阅套餐，面向个人及中小团队零售AI编程服务，支持月、季、年订阅。本次套餐价格大幅上调，Pro版月费从149元涨至538元，涨幅达3.6倍。新版升级为GLM-5.3模型，采用积分制计费，适配二十余款编程工具，提供API调用服务。此次入驻标志国内大模型厂商正式开启Token大众化零售模式。智谱正加速商业化转型，从项目定制转向标准化订阅服务，其API业务已成为核心营收支柱。（界面新闻）</p>\n  <p><strong>追觅回应放弃整车量产</strong></p>\n  <p>9月1日，追觅科技正式回应造车业务变动，确认终止“星空计划”整车量产项目，汽车业务整体并入产业研究院，仅保留电机、底盘控制等底层技术储备，不再推进商业化量产，相关技术将复用至智能出行、具身智能等核心赛道。此次属公司主动战略纠偏，追觅将此前200余个业务单元整合为智能家庭、户外庭院、智能出行、具身智能四大主业，同步收缩关停MOVA品牌重叠业务、手机等多项跨界孵化项目，集中资源夯实核心主业。追觅表示将妥善承接供应商合同与账款事宜，建立专项处理机制。本次调整旨在优化资源配置、降低多元扩张消耗，不过后续供应链修复、内部组织磨合等问题仍待解决，转型成效有待市场检验。（每日经济新闻）</p>\n  <p><strong>被曝要求供应商大幅降价，本田中国回应</strong></p>\n  <p>9月2日，有消息称，本田已向供应商下达指令，要求其大幅降价。本田计划将部分关键零部件的成本削减30%，其中就包括软件定义汽车相关的零部件。对此，本田中国表示：“这不是Honda官方发布的内容。关于成本优化活动，Honda为提升全球研发、生产和采购等领域的竞争力，一直致力于与供应商的共同创新合作，持续开展相关工作。”（第一财经）</p>\n  <p><strong>字节上调期权价格，涨幅约5%</strong></p>\n  <p>字节发布通知调整期权价格，在职员工从229.5美元/股调整至241.35美元/股，涨幅比例约5.1%。这是2026年以来字节第二次调整期权价格。字节上一次期权价格调整是在今年4月，在职员工从200.41美元/股调整为229.5美元/股。（新浪科技）</p>\n  <p><strong>Minimax成为内地投资者新宠，港股通买入规模超越阿里巴巴和腾讯</strong></p>\n  <p>Minimax Group Inc．成为上月内地投资者最青睐的港股，这是内地投资者对中国新一代人工智能（AI）模型开发商表现出强烈投资热情的最新迹象。8月，内地投资者通过港股通买入了价值106亿港元的Minimax股票，超过了阿里巴巴和腾讯控股。自8月6日被纳入港股通以来，南向投资者已累计持有该AI初创企业9.7%的股份。（新浪财经）</p>\n  <p><strong>微信灰度测试防错过新功能</strong></p>\n  <p>9月2日，据微信派消息，新版微信新增2个功能。1、如果微信里有未读消息，长按左下角“微信”可查看当前全部的未读聊天。据悉，目前该功能正在灰度中。2、如果聊天中有未领取的红包及转账，聊天框右上角会出现“红包”“转账”提醒。（封面新闻、大河报）</p>\n  <p><strong>普华永道：2026-2050年全球数据中心资本支出或将达到31.6万亿美元</strong></p>\n  <p>普华永道预计，2026年至2050年间，全球数据中心资本支出或将达到31.6万亿美元。如果人工智能普及速度加快，潜在增幅甚至可达50万亿美元。该数据基于咨询公司牛津经济研究院的信息，后者对36个国家和地区以及五个地区的数据中心资本支出进行了建模。普华永道的报告称，与铁路或互联网的发展不同，人工智能基础设施的建设周期每四到六年就会重置一次。分析认为，即便考虑通货膨胀因素，人工智能的预期支出也将超过美国和英国铁路扩建以及互联网建设成本的总和。（第一财经）</p>\n  <p><strong>欧盟首次向30余家AI相关企业发送信息调查请求</strong></p>\n  <p>欧盟委员会9月2日宣布，已依据《人工智能法案》向30余家在人工智能行业运营的企业发送了信息调查请求，这是该法案执法权力自2026年8月2日生效以来的首次正式执法行动。</p>\n  <p>此次信息请求主要涉及人工智能系统的安全性和版权合规两大核心问题，属于正式启动调查之前的初步步骤。欧盟委员会发言人托马斯·雷尼耶确认，调查问卷主要围绕安全与版权展开，涉及的企业分布在全球多个国家和地区。收到请求的企业如提交不正确、不完整或具误导性的回复，可能面临最高1500万欧元或全球年营业额3%的罚款。（CGTN报道）</p>\n  <p><strong>韩国据悉买入约200亿美元SK海力士美国上市后汇回的资金</strong></p>\n  <p>据报道，SK海力士7月发行265亿美元的美国存托凭证（ADR）后，韩国外汇当局购买了约200亿美元SK海力士汇回的资金。知情人士称，SK海力士将美元汇回韩国的过程中，韩国外汇稳定基金通过场外交易购汇。（界面新闻）</p>\n  <p><strong>特朗普家族瞄准新风口：小唐纳德旗下风投成为Polymarket主要股东</strong></p>\n  <p>美国总统特朗普之子小唐纳德·特朗普旗下风险投资公司1789 Capital正在领投预测市场Polymarket新一轮融资，预计投资约3亿美元，即将成为其最大投资方之一，该轮估值达210亿美元。（财联社）</p>\n  <p><strong>外交部回应G20财长会议未发表公报</strong></p>\n  <p>9月2日，外交部发言人郭嘉昆就近期G20财长和央行行长会议未能发表公报作出回应。8月31日至9月1日举办的本次会议，因各方在相关问题上存在分歧，最终未发布会议公报。</p>\n  <p>中方表示，自美国接任2026年G20主席国以来，中方始终积极、建设性参与各项议题讨论，助力G20产出务实成果，对此次会议未能发表公报深表遗憾。</p>\n  <p>中方强调，G20应恪守协商一致、平等参与原则，客观平衡协调全球经济议题。中方期待美方及各成员尊重各方合理关切，共同推动2026年G20迈阿密峰会取得积极成果，持续助力全球经济治理与增长。（央视新闻、财联社）</p>\n  <p><strong>AI调用价格大跳水，行业迎来“降价内卷”</strong></p>\n  <p>9月2日消息，AI使用价格迎来大幅跳水。最新行业数据显示，AI调用单价指数创下历史新低，较今年夏季高点近乎腰斩，目前用户、企业使用大模型的成本大幅下降。</p>\n  <p>本轮AI降价源于行业激烈内卷。国内Kimi等高性价比AI模型快速突围，低价优势倒逼OpenAI等海外巨头跟进降价，叠加AI生产成本走低、平台灵活调价，进一步拉低了全行业使用价格。</p>\n  <p>此次价格下跌利好普通用户，但大幅压缩AI企业利润。行业出现明显“增收不增利”困境，也让筹备上市的OpenAI、Anthropic盈利压力陡增。业内指出，AI行业单纯比拼模型性能的时代结束，未来将转向差异化赛道竞争。（财联社）</p>\n  <p><strong>雀巢10亿美元卖掉7个保健品品牌</strong></p>\n  <p>9月2日，雀巢集团宣布以10亿美元的代价，出售旗下的主流维生素、矿物质和补充剂（VMS）业务，涉及7个品牌。公告显示，本次交易涉及七大成熟品牌：Nature's Bounty、Osteo Bi-Flex、Ester-C、Gard、Nuun、Puritan's Pride和Sisu，以及相关的美国自有品牌补充剂业务，还包括专属的制造、包装、仓储和配送运营设施。该业务主要位于美国，同时在加拿大和中国等多个国家也有布局。交易需获得相关监管机构批准，预计将于2027年上半年完成。接手方为Yellow Wood Partners，其是一家总部位于美国波士顿、专注于消费行业的私募股权公司。（界面新闻）</p>\n  <p><strong>《富爸爸穷爸爸》作者，自曝负债12亿美元</strong></p>\n  <p>畅销书《富爸爸穷爸爸》作者罗伯特·清崎近日因宣称自己“负债12亿美元”引发关注。不过，其前妻兼长期商业伙伴金·清崎表示，这一数字并不是清崎个人承担的债务，而是他与合作伙伴共同持有的房地产项目所背负的债务总额。金·清崎表示，12亿美元是一个房地产投资者群体承担的债务总额，而不是清崎个人欠下的贷款。她说，清崎与合作伙伴持有约1500套公寓，因此，“严格来说，我们确实有这么多债务”，但这些贷款与相应的房地产资产相联系，清崎本人承担的份额要小得多。（财联社）</p>\n  <p><strong>“易中天”集体下挫，中际旭创市值跌破1万亿元</strong></p>\n  <p>9月2日早盘，“易中天”集体下挫，新易盛、中际旭创、天孚通信盘中均跌超5%，中际旭创总市值跌破1万亿元。截至下午收盘，“易中天”跌幅有所收窄，新易盛跌4.00%；天孚通信一度翻红，收跌0.70%；中际旭创跌4.29%，最新市值9709亿元。（21世纪经济报道）</p>\n  <p><strong>阿贝尔证实巴菲特主导了伯克希尔对Alphabet的投资</strong></p>\n  <p>伯克希尔哈撒韦首席执行官阿贝尔证实巴菲特主导了伯克希尔对Alphabet的投资，伯克希尔押注Alphabet，动因在于该公司的人工智能优势；阿贝尔认为人工智能数据中心对伯克希尔哈撒韦能源公司而言是一项重大机遇。（财联社）</p>\n  <p><strong>美股三大指数集体收涨，英伟达涨超3%</strong></p>\n  <p>36氪获悉，9月2日收盘，美股三大指数集体上涨，纳指涨0.45%，标普500涨0.46%，道指涨0.56%；大型科技股多数上涨，英伟达涨超3%，Meta涨超2%，谷歌、特斯拉、亚马逊小幅上涨，微软、苹果小幅下跌；热门中概股普跌，蔚来跌近5%，哔哩哔哩跌超2%，拼多多跌超1%，小鹏集团、百度、网易、京东小幅下跌，理想汽车涨0.92%。</p>\n  <p><strong>黑石投资网络安全初创企业Huskeys，抵御恶意AI流量</strong></p>\n  <p>黑石集团对初创网络安全公司Huskeys进行早期押注。该公司打造AI网关防护系统，帮助企业应对日益泛滥的自动化网络流量带来的各类风险。黑石旗下早期风险投资部门黑石创新投资领投2700万美元A轮融资。这家成立仅一年的公司投后估值超1亿美元。据Huskeys方面代表介绍，这笔交易完成后，黑石成为该公司第二大外部投资方，仅次于以色列风投机构10D。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>天目先导启动IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，溧阳天目先导电池材料科技股份有限公司（简称“天目先导”）于2026年9月1日在江苏证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为中信证券。辅导备案报告显示，该公司单一股东持股比例均在10%以下，公司无控股股东。罗飞直接持股2.34%，通过持股平台合计控制天目先导19.08%股份，罗飞直接、间接控制天目先导21.42%股份，为公司实际控制人。</p>\n  <h2>投融资</h2>\n  <p><strong>“鼎犀智创”完成数亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，AI新材料研发公司“鼎犀智创”（Rhinovate™）完成数亿元Pre-A轮融资，本轮融资由鼎晖百孚领投，九合创投、彬复资本、龙芯创投、顺禧基金、中关村资本跟投。本轮资金将重点用于RhinoMat材料科学基础大模型及底层技术研发、多场景可编排AI智能体与自主进化实验室体系建设、碳基高性能材料放大验证，持续沉淀核心技术与实验数据。</p>\n  <p><strong>“天工机器人”完成数亿元融资</strong></p>\n  <p>36氪获悉，近日，北京天下先智创机器人技术有限责任公司（天工机器人）完成数亿元融资。本轮融资由初芯基金领投，经纬创投、合肥国资等机构跟投。本次募集资金将重点用于分拣类机器人扩大量产规模、基于人形的分拣机器人研发与商用化迭代及海外市场业务拓展。</p>\n  <p><strong>AI初创公司Cognition据悉拟融资约10亿美元，估值达470亿美元</strong></p>\n  <p>据报道，人工智能初创公司Cognition据悉拟融资约10亿美元，估值达470亿美元。（界面新闻）</p>\n  <p><strong>“Heygo”完成第一轮数百万美金天使融资</strong></p>\n  <p>36氪获悉，由前字节、大疆、腾讯的青年创业团队“Heygo”完成第一轮数百万美金天使融资，由厚雪机构独家投资。Heygo在2025年正式成立，曾推出一款针对单板滑雪的AI硬件。</p>\n  <h2>大公司财报</h2>\n  <p><strong>京沪高铁上半年归母净利润67.71亿元</strong></p>\n  <p>9月2日消息，京沪高铁披露2026年半年报，业绩实现稳步增长，盈利表现强势跑赢国内各大航司。上半年实现营业收入218.42亿元，同比增长3.94%，归母净利润和扣非净利润均为67.71亿元，均同比增长7.21%，高于同期国泰航空62.43亿港元的最高盈利水平。其中在航空业最受油价冲击的第二季度，录得净利润36.28亿元，环比一季度增长了14.7%。</p>\n  <p>业绩增长主要得益于客流攀升、票价上浮及财务费用优化。数据显示，京沪高铁盈利贡献远超国铁集团整体上半年净利润，是国铁集团核心盈利支柱，集团其余铁路业务整体处于亏损状态。（南方都市报）</p>\n  <h2>酷产品</h2>\n  <p><strong>戴森新AI牙刷价格3899元，可拍牙菌斑</strong></p>\n  <p>戴森推出首款在刷头中内置摄像头的智能电动牙刷CameraJet，售价499美元，国行价3899元，提供陶瓷蓝和陶瓷粉两种配色。CameraJet的刷头有一颗高清微型摄像头，拍摄图像由AI分析后，能识别出牙菌斑分布和牙龈状态，为用户提供实时的清洁指导。CameraJet通过与配套手机应用连接，可生成用户口腔健康地图，标注需要重点清洁的区域。（IT之家）</p>\n  <p><strong>整理</strong>｜李琪</p>", "category": "tech", "published_at": "2026-09-03T00:04:49+00:00", "fetched_at": "2026-09-03T02:41:31.009003+00:00", "fingerprint": "74a08184f3611ab4"}, {"source": "36氪 - 最新文章", "title": "把氢气装进面膜，「奇麟正维」获数千万元A轮融资｜36氪首发", "url": "https://36kr.com/p/3965960331205888?f=rss", "summary": "<p>文 | 刘凌果&nbsp;</p>\n  <p>编辑 | 海若镜</p>\n  <p><br /><strong>36氪获悉，氢分子新材料企业「奇麟正维」近期完成数千万元A轮融资。本轮融资由天图投资旗下美丽领航基金领投，募集资金将用于核心技术迭代、湖州生产基地建设、研发团队扩充、市场及客户体系拓展。</strong></p>\n  <p>2007年，日本医科大学团队发表于《Nature Medicine》的一篇论文，让曾长期被视作生理惰性气体的氢首次进入医学视野。研究发现，氢分子具有选择性抗氧化作用。抗氧化，有个更被熟知的大众理解，抗衰。</p>\n  <p>基于此，近些年，不少商家借机虚假宣传，将喝氢水、吸氢气、洗氢浴包装成防癌抗癌的“万能解法”，让氢分子屡屡在互联网被动“黑红”，陷入争议。</p>\n  <p>事实上，虽不能包治百病，氢分子的广谱抗衰老效应，已得到多项科学研究验证。例如，中国科学院深圳先进技术研究院联合上海交通大学、华东理工大学团队发表于《Nature Communications》的研究表明，局部释氢可抑制衰老相关分泌表型，延缓干细胞、巨噬细胞与骨细胞衰老，并改善局部炎症环境。</p>\n  <p>不法商家之所以有机可乘，主要因为氢分子的底层机制虽已有研究支持，但从科学机制到产品功效，中间隔着递送难题。要让氢发挥作用，前提是足够剂量的氢进入身体组织；但氢难溶于水、极易逸散，这一前置条件长期难以在消费级产品中稳定实现。</p>\n  <p>而这，正是氢分子新材料开创者\"奇麟正维\"创立的初衷——把氢分子真正送进细胞。</p>\n  <p>浙江奇麟正维医学科技有限公司成立于2022年，是杭州市实业投资集团孵化、与江南大学化学与材料工程学院联合开展成果转化的企业。创始人李奇斌拥有材料研发及产业化创业经历，江南大学教授王靖担任公司首席科学家。公司主要面向美妆品牌、生产企业，提供氢分子原料、材料产品等。</p>\n  <p>“我们希望解决稳定储氢、释氢的问题，把氢分子做成能落地、可复用的产业级材料。”奇麟正维联合创始人、CMO郭理伟介绍。</p>\n  <p>奇麟正维首先把氢气装进面膜里。首款氢分子产品（又称富氢干膜布），定位是“面膜伴侣”，搭配普通湿面膜使用。据诺斯贝尔联合用户说发布的行业报告，2026年中国面膜市场规模预计达到837.8亿元。但行业红海一片，长期困于低价竞争。“我们没有做终端品牌、参与内卷，而是做底层材料供应商，做好‘配角’。”郭理伟表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260902/v2_0e15e2ea25ff4f769b52fb198c17dd10@6419480_oswg5101970oswg2848oswg1599_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">氢分子面膜伴侣结构示意图</p>\n  <p>奇麟正维的氢分子面膜伴侣共有三层，靠近皮肤侧是透气、透水的特种无纺布材料，中间是固态储氢缓释材料，外侧是相对不透气的特种无纺布材料，共同构成一个面向面部的相对封闭产氢空间。</p>\n  <p>使用时，消费者先敷上湿面膜，再将干膜布敷在湿面膜上，随着湿面膜中的精华液渗透穿过干膜布的内层无纺布，导入中间的释氢层，水解反应随之启动。缓慢释放的氢气，在最外层不透气无纺布的微压热导作用下，穿透湿面膜，向皮肤方向扩散。</p>\n  <p>这种“现用现产”的机制，可以使得氢气不提前流失。但如何确保产生的氢气能进入皮肤深处呢？</p>\n  <p>事实上，氢分子是已知的宇宙中最小分子，分子量仅2道尔顿，理论上，穿过皮肤屏障并非难事。主要卡点仍是氢气的逃逸性。</p>\n  <p>对此，奇麟正维的解法是，提供足够剂量，并利用反应产生的热量，让氢气更多朝皮肤方向扩散。郭理伟介绍，早期产品单片只能产生数十毫升氢气，经过反复测试，目前量产版本单片总产氢量已提升至800毫升左右，持续时间在15分钟左右。“从江南大学开展的体外皮肤模型测试看，800毫升氢气释放后，进入皮肤的量大约在几毫升。可能听起来觉得很少，但全球范围内，目前还没有其他企业能够达到这一水准。”</p>\n  <p>在此基础上，奇麟正维还开发了氢气与二氧化碳协同释放的双气体技术。郭理伟介绍，二氧化碳能够借助波尔效应发挥作用：当二氧化碳作用于皮肤，会促使毛细血管内血红蛋白释放氧气，扩张局部微循环，打开皮肤渗透通道，为氢气的穿透创造有利条件。公司实测数据表明，加入二氧化碳协同之后，氢气透皮率提升50%以上，这项技术将优先应用在更高端的产品线当中。</p>\n  <p>伴随高剂量、温热环境，随之而来的问题是，如何精准控温，确保产品的安全性？</p>\n  <p>“我们与全球头部化妆品品牌方磨合时，对方对安全要求很高，不允许上市产品存在低温烫伤隐患。这是我们最早必须解决的问题，因此采用了一系列缓释控温技术。”郭理伟表示，一方面，公司将产氢材料高度分散，避免热量局部聚集；另一方面，优化内外层无纺布结构、材质，控制水分进入及氢气、热量释放的速度，实现温度的缓慢上升、缓慢回落。</p>\n  <p>功效上，郭理伟表示，搭配氢分子面膜伴侣后，湿面膜中部分活性成分的透皮吸收率，最高提升至约2.8倍；据企业提供的第三方权威检测机构测试数据显示，连续使用 28 天后，受试者皱纹、色斑相关指标出现改善。</p>\n  <p>郭理伟介绍，“目前，公司已与科丝美诗、资生堂、林清轩、植物医生、上海家化等企业开展合作，部分客户订单从早期小批量测试，增长至单次50万至100万片。截至目前，氢分子面膜伴侣累计出货接近5000万片，是公司现阶段主要营收来源。”</p>\n  <p>本次融资完成后，奇麟正维计划在湖州建设新的生产基地，按照年产10亿片氢分子面膜伴侣规划产能。</p>\n  <p>对于一家上游原料企业而言，面膜场景显然不够。</p>\n  <p>为了让氢进入精华、乳液、面霜等更多护肤品品类，奇麟正维开发了第二条技术路线，将产氢装置继续缩小，装进微米级反应器中。这套HybridH2Gen™脂质体微囊产氢反应器，被命名为“海珀氢”。</p>\n  <p>具体而言，微囊中包裹着产氢物质。消费者将添有“海珀氢”原料的水、乳、霜等各种液态剂型的护肤品涂抹到皮肤后，在自然光、室内光线等光照条件下，催化反应随之启动，持续产生氢气。</p>\n  <p>同样是“现用现产”，氢分子面膜伴侣和海珀氢的区别，主要在于前者依靠水解反应，在十余分钟内集中缓释氢气和热量；后者依靠光催化反应，缓慢产氢，没有明显温热感，也不需要额外敷面膜，可以进入使用频率更高的护肤场景。</p>\n  <p>目前，海珀氢已完成实验室研发和中试验证，正在与多家品牌开展配方适配、稳定性及功效测试，预计今年底开始形成商业化收入。</p>\n  <p>护肤美妆场景外，奇麟正维还计划将产氢、释氢材料拓展至卫生护理、头皮养护、医用敷料和医疗器械等领域。“卫生巾、护垫中原本就有吸水材料，与我们的材料复合后，在潮湿环境中可以释放氢气和温和热量。”郭理伟表示。</p>\n  <p>更远期，公司还计划研发液态储氢材料、释氢益生菌等产品。</p>", "category": "tech", "published_at": "2026-09-03T00:06:05+00:00", "fetched_at": "2026-09-03T02:41:31.008997+00:00", "fingerprint": "557a02179c5ddcdb"}, {"source": "36氪 - 最新文章", "title": "万千气象北京行：在房山区触摸文脉与新知", "url": "https://36kr.com/p/3966933746261254?f=rss", "summary": "<p>9月2日，由中央网信办网络社会工作局、北京市委网信办主办，新京报贝壳财经承办的“中国式现代化的万千气象”网络名人北京行活动走进房山区。网络名人先后考察云居寺、周口店北京人遗址和全国高校绿色能源区域技术转移转化中心（北京），感受房山绵延不绝的文化底蕴和不断涌现的技术活力。</p>\n  <p><strong>云居寺刻石，听千年文脉</strong></p>\n  <p>清晨的云居寺古木掩映，网络名人一行驻足于辽代北塔前。顺着讲解员手指的方向，他们正举起相机，在层层砖雕间，寻找一只形似“小飞象”的图案——这只小飞象迈开双腿，飞奔向前，形象憨态可掬，如今已成为云居寺的吉祥物。</p>\n  <p>云居寺始建于隋末唐初，自隋唐至明清，留下了近千年镌刻的14278块石刻佛经，被誉为“石经长城”，石经、纸经、木经并称为云居寺“三绝”。</p>\n  <p>一块石经的诞生并不容易。讲解员介绍，刻经所用的石料大多取自房山大石</p>\n  <p>窝一带。石料开采后，先要经过运输、打磨，再由工匠一字一字镌刻。纸张、竹简与绢帛易毁于水火与战乱，石头却更加坚固耐久，能够更好保存、记录文字，云居寺石经因此被称为一座“石刻图书馆”。如今，随着文物保护的手段不断更新，千年的文化记忆也得到了更完善、长久的保存。</p>\n  <p>走进拓印体验区，网络名人亲手尝试雕版印刷。覆纸、按压，涂上金粉，再小心揭起，一个个带着祝福的图案便跃然纸上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_695be5243eed4e05bbc23c1e9901a6ec@1200352198_oswg7475241oswg5024oswg3768_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人体验拓印）</p>\n  <p><strong>龙骨山寻踪，探人类来路</strong></p>\n  <p>在周口店北京人遗址拾级而上，走进“猿人洞”，眼前是一处由考古人员逐层清理出来的巨大洞穴。这里原本是一座天然石灰岩洞穴，坍塌后被碎石、泥土和古人类生活留下的遗存逐渐填满。此后，考古人员从山顶向下发掘，从堆积中辨认出14个层位，一件件化石与石器也随之重见天日。1929年，第一颗完整的“北京人”头盖骨化石，就出土于猿人洞的其中一处地层。</p>\n  <p>在周口店遗址博物馆，化石标本将数十万年前的生存图景徐徐铺展开来。体形庞大的中国鬣狗骨架，以及野猪、狼、豹子和大熊猫等动物化石依次排开，吸引网络名人在展柜前仔细观察。得知眼前不少动物化石是原件，大家一边追问动物的体形与生活环境，一边举起相机记录。</p>\n  <p>在有关山顶洞人的展陈中，一枚小小的骨针和由兽牙、骨管、贝壳等制成的装饰品，格外吸引众人的目光。骨针说明当时的人类已经能够缝制衣物，项链、手串等装饰品，则透露出审美意识的萌芽。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_76c3fa308bb74138a6945363846d89a8@1200352198_oswg7660832oswg5712oswg4284_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人参观中国鬣狗骨架）</p>\n  <p><strong>大学城探新，盼绿色未来</strong></p>\n  <p>先民把痕迹留在骨头上，工匠把文字刻进石头里。今天，我们又将把什么交给未来？下午的这一站，给出了一种答案。</p>\n  <p>车行至良乡大学城，网络名人一行来到全国高校绿色能源区域技术转移转化中心（北京）。展厅内，固态电池、模块化储能柜、凝胶蓄冷材料等成果集中亮相。讲解员介绍，中心于2025年获批，是全国唯一聚焦绿色能源领域的高校区域技术转移转化中心。</p>\n  <p>一项科研成果从实验室走向市场，往往要跨过技术验证、产品试制、资金投入和市场对接等多道关口。而中心在做的，正是把这几道关口一一打通：一方面收集企业在生产中遇到的瓶颈和需求，另一方面对接高校科研团队，为双方寻找合作的机会。建设运营一年来，已有80余项成果开展孵化和落地转化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_f5d1581763f946169555111ce6de4b4e@1200352198_oswg6970758oswg5712oswg4284_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图为网络名人参观全国高校绿色能源区域技术转移转化中心）</p>\n  <p>走进北京凝基新材科技有限公司，一块形似北极熊的凝胶蓄冷材料立在展厅，网络名人伸手触摸，感受冰块般的凉意。但这块材料偏偏不是冰，即使将它放置于常温室内，也不会融化成水、改变原有形状。企业工作人员介绍，这种材料含水量超过90%，利用纳米级高分子网络将水锁在其中，使其在发生温度变化时仍能保持固体形态。从高校实验室里的一份配方，到如今规模化生产的产品，凝基新材的发展路径，恰好为绿色能源转化中心提供了一个可触可感的样本。</p>\n  <p>凝基新材室内，还辟出了一片小型冰壶体验区，底部使用的正是他们研发的蓄冷材料。网络名人轮番上场，俯身、推壶，在轻松的互动中直观感受这项技术的应用。</p>\n  <p>历史文脉在保护中延续，创新成果在转化中落地，房山区正在古老与现代的交汇中焕发新的活力，展开中国式现代化的鲜活一页。</p>", "category": "tech", "published_at": "2026-09-03T00:14:00+00:00", "fetched_at": "2026-09-03T02:41:31.008991+00:00", "fingerprint": "13761889926a96ec"}, {"source": "36氪 - 最新文章", "title": "国内无人物流车转向市占率超50%，对标博世采埃孚，获数千万元战略轮融资丨36氪首发", "url": "https://36kr.com/p/3966455782088200?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_39275ddeed5047b5aea2fe45393a8e2c@6221844_oswg427492oswg1268oswg806_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3300</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，湖北汉鼎智能科技有限公司（以下简称“汉鼎智能”）已于近期完成数千万元战略轮融资，由红榕资本领投，上市公司德赛西威、物产中大、长江产投、海川资本、天泓投资、江远投资等跟投。资金将主要用于线控转向（SBW）技术的量产落地及高端EPS产能升级。</p>\n  <p>汉鼎智能成立于2020年，总部位于武汉，是一家专注于汽车电动助力转向系统（EPS）与线控转向系统（SBW）研发与生产的高科技企业。汉鼎智能创始人刘泽金2010年毕业后即从事汽车转向软件开发，先后在东风汽车、湖北恒隆、耐世特等企业担任EPS部门负责人和转向产品经理，拥有近20年行业经验，创立汉鼎前已有两次创业经历。</p>\n  <p>转向系统是汽车底盘的核心执行部件。传统乘用车转向市场长期由博世、采埃孚、耐世特等外资巨头主导，外资及合资企业占据大部分市场。尤其在R-EPS等高端产品领域，海外厂商几乎形成垄断。</p>\n  <p>目前，汽车电动化与智能化正在重塑这一格局：C-EPS正向更高性能的DP-EPS和R-EPS升级；而线控转向（SBW）作为L3及以上高阶自动驾驶不可替代的执行部件，彻底取消了方向盘与车轮之间的机械连接，完全通过电信号传递转向指令。</p>\n  <p>这一结构性变化为本土供应商提供了窗口期。</p>\n  <p>汉鼎智能借此抓住机会。目前，公司是国内少数同时布局齿轮齿条动力转向器（DP-EPS）、循环球动力转向器（X-EPS）、滚珠丝杠转向器（R-EPS）、行星齿轮转向器（G-EPS）及转向管柱（C-EPS）等全系列转向产品，且均有在手项目定点的转向供应商。</p>\n  <p>在技术路线上，汉鼎智能采取“三块业务并行”的策略：</p>\n  <p>现有业务以电动助力转向（EPS）为主，涵盖C-EPS、P-EPS、DP-EPS、R-EPS等各类型号。其中R-EPS是EPS中技术水平最高、齿条力最大的产品，工艺难度大、价格昂贵。公司已实现R-EPS总成量产，突破了外资长期垄断的技术壁垒。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_76dcc0425aa14fa69ab7642795b1be8e@6221844_oswg94193oswg1080oswg193_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">R-EPS转向总成（图源/企业）</p>\n  <p>第二块业务是无人物流车的转向系统。这是公司目前市场份额最高的领域，已累计配套无人物流车型40余款，2025年出货量超2万台，国内市占率超过50%。</p>\n  <p>第三块是面向乘用车的线控转向（SBW），这也是公司未来最大的增长极。线控转向取消了方向盘与转向器之间的机械连接，转向指令完全通过电信号传递。</p>\n  <p>汉鼎智能自2021年起即开展SBW技术验证，已完成双电源、双通信、双控制器及双电机绕组的冗余安全架构验证，并在黑河完成-40℃极寒测试，无故障运行超200小时。公司目前定点国内头部新能源车企开展sbw研发并已进入调教标定阶段，是国内少数拥有完整SBW实车验证能力的本土Tier1企业</p>\n  <p>而汉鼎智能的商业化路径呈现“无人物流车先行、乘用车接力”的特征。</p>\n  <p>在无人物流车赛道，公司已构建起显著的先发优势。在无人车头部车企累计部署超过1.6万台车，覆盖全国300多个城市。作为其独家转向供应商，汉鼎智能2026年在手订单已达4万台。此外，公司也是德赛西威等多家无人车企业的独供供应商。</p>\n  <p>在乘用车领域，公司已获得多家国内DP-EPS项目定点及某东南亚本土品牌三款车型的R-EPS定点。其中，R-EPS项目将出口东南亚市场，预计2026年9月开始量产。在商用车领域，公司的大功率行星齿轮解决方案为国内首发，已获陕汽、比亚迪、东风等多家主机厂验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_9179f92ab8a74bac93f8617de8c36a19@6221844_oswg214555oswg1080oswg721_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DP-EPS转向总成（图源/企业）</p>\n  <p>业绩方面，公司2025年营收已达近亿元。公司目标是2027年实现营收2至3亿元。</p>\n  <p>产能方面，公司目前已建成C-EPS、P-EPS、DP-EPS、R-EPS、X-EPS五条总成产线，年产能超100万台；PPK自动化产线2条，年产能100万台；SMT产线2条，年产能200万台。本轮融资后，公司将重点扩充无人车冗余EPS产能，目标将月产能从目前的不足1万台提升至10万台。</p>\n  <p>长期来看，公司将依托国内供应链成本优势拓展海外市场，先从东南亚市场切入，逐步向欧美延伸。此外，公司已在布局“角模块”技术，即每个车轮独立控制转向，这是未来5至10年转向系统的演进方向之一。</p>\n  <p><strong>以下是硬氪与汉鼎智能创始人刘泽金的对话（经编辑）：</strong></p>\n  <p><strong>硬氪：线控转向的技术壁垒具体体现在哪里？为什么行业里真正能做好的公司不多？</strong></p>\n  <p><strong>刘泽金：</strong>线控转向最核心的难点有两个。第一个是安全。方向盘和转向器之间没有任何机械连接，任何一个环节失效都会影响整车安全。所以系统必须满足功能安全ASIL-D等级，失效率要控制在10个FIT以内——也就是每10亿小时失效不超过10次。这要求系统必须是全冗余架构，从传感器、控制器到电机驱动全部双备份。光是跟安全相关的测试用例就有一千多条。</p>\n  <p>第二个难点是路感模���。传统转向有机械连接，路面的反馈是物理传递的。线控转向取消了机械连接，驾驶者感受到的“路感”完全靠算法生成。怎么通过软件模拟出真实、细腻的路面反馈，同时还要适配不同车型的调校需求，这是一个非常吃经验和技术积累的领域。</p>\n  <p><strong>硬氪：乘用车转向市场长期被外资垄断，国产替代的突破口在哪里？</strong></p>\n  <p><strong>刘泽金：</strong>第一是电动化带来的成本压力。国内主机厂对成本非常敏感，我们有三套不同规格的核心控制方案——全国产化方案、英飞凌方案和降本方案，可以根据客户需求灵活配置。第二是智能化带来的技术迭代。线控转向是全新的技术路线，外资和国内团队站在同一起跑线上。加上2025年底新国标正式给线控转向“松绑”，技术窗口已经打开了。</p>\n  <p>我们的策略是先把无人物流车这个细分赛道的市占率做到第一，积累量产经验和安全验证数据，再向乘用车市场延伸。乘用车对安全的要求更高、验证周期更长，但有了无人物流车的量产履历，主机厂的信任度会高很多。</p>\n  <p><strong>硬氪：为什么选择从无人物流车这个细分赛道先切入？</strong></p>\n  <p><strong>刘泽金：</strong>无人物流车有几个特点对我们很有利。第一，这个市场中国在全球是领先的，路上跑的无人车95%以上在中国。第二，无人物流车没有方向盘，完全靠自动驾驶控制转向。它对转向器的可靠性、精度、响应速度要求比传统乘用车更高，但应用场景相对封闭，验证周期比乘用车短。我们可以在这个赛道上把技术打磨成熟，把全冗余方案跑通，再把这些能力迁移到乘用车的线控转向上去。</p>\n  <p>目前我们在无人物流车市场的市占率超过50%。这个细分市场虽然规模不大，但它是我们技术验证和量产经验的“练兵场”。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>海川资本创始合伙人施呈豪表示：</strong>大家最近都在谈物理AI，但AI进入物理世界最难的一步是“精确控制”。传统的机械转向架构限制了自动驾驶算法的发挥。线控转向取消了转向柱等机械硬连接，真正实现了“电信号控制物理运动”。汉鼎智能做的事情，就是给物理AI装上一套最精准、最可靠的“执行神经系统”。</p>\n  <p>在投资角度，既要看技术的长远天花板，也要看眼下的落地节奏。汉鼎的客户结构非常健康：无人物流车助力快速实现技术验证与批量跑通；国内外乘用车主机厂带给他们规模化量产的能力，并随着当下乘用车主机厂出海的热潮进入到全球市场，而新能源重卡则是在高附加值、高门槛场景上的降维打击。这种“多轮驱动”的商业落地能力，在当下的资本市场极为稀缺。海川资本作为一家深耕于智慧交通领域的产业资本，未来将在供应链协同以及主机厂定点突破上与汉鼎携手共进。</p>\n  <p><strong>长江产业投资集团投资人尹鹏飞表示：</strong>我们持续看好中国汽车智能转向赛道的国产化替代机遇。汉鼎科技是国内最早从事EPS转向底层控制程序开发的团队，在商用车和无人驾驶物流车领域，汉鼎已稳居国内领先地位，获得新石器、九识、京东、德赛西威等多家客户的独供或A供定点，在300亿级EPS市场和百亿级SBW市场的双重驱动下，汉鼎同时具备高端突破与成本领先的双重优势，我们相信，这支深耕转向领域十余年的团队，正在将中国智能转向产业推向一个新的高度。汉鼎科技既有扎实的基本盘支撑，又有明确的第二增长曲线，是我们眼中兼具确定性与成长性的优质标的。</p>\n  <p><strong>红榕资本投资人王培成：</strong>汉鼎智能科技是国内线控转向领域的龙头标的，核心亮点在于实现SBW从研发到生产的全链条自主可控，不依赖海外技术方案。DP-EPS、R-EPS产品已经在无人车、商用车领域形成领先的市场地位，同时顺利切入乘用车赛道，打开更大的成长天花板。区别于多数还停留在样机阶段的同行，公司实现多场景的产品落地，持续构建技术与客户壁垒。项目的发展，有望解决国内汽车线控底盘“卡脖子”问题，同时充分受益自动驾驶产业爆发，具备突出的产业价值与投资价值。</p>", "category": "tech", "published_at": "2026-09-03T01:00:00+00:00", "fetched_at": "2026-09-03T02:41:31.008982+00:00", "fingerprint": "a73cdead97c8db97"}, {"source": "36氪 - 最新文章", "title": "腾讯WorkBuddy开放平台上线 Agent向更多工作场景延伸", "url": "https://36kr.com/p/3966701687905536?f=rss", "summary": "<p>文｜李炤锋</p>\n  <p>昨日，腾讯WorkBuddy开放平台正式上线。这是WorkBuddy今年3月发布以来，首次完整披露开放生态战略。</p>\n  <p>据了解·，首批已有超过100家合作伙伴进入平台，覆盖智能硬件、行业应用和开发者三个方向。腾讯将其定位为国内首个同时连接这三层生态的Agent平台。</p>\n  <p>发布会现场，智能眼镜、录音卡片、麦克风和耳机等产品集中亮相。WorkBuddy目前已连接30多个硬件品牌、十余种设备品类，此次首发的9款联名产品，也大多与语音、图像等信息采集有关。</p>\n  <p>首批合作为何集中在输入端？36氪就此向腾讯WorkBuddy开放生态负责人林佐露提问。</p>\n  <p>“大家可以在WorkBuddy的工作台发起任务，也可以通过随身设备发起任务，它只是一个发起的途径。”林佐露说。硬件让人与Agent的交互变得更随身、更高频，但在他看来，办公Agent的变化并不只发生在入口。</p>\n  <p>“我们相信Agent继续发展，对组织和企业而言，它会是一种数字生产力、一个数字员工。”</p>\n  <p>今天的办公Agent大多仍由人主动调用：用户提出需求，Agent给出回答或完成一项任务。但如果Agent长期参与一个项目，它面对的就不再是一次性的问答，而是持续变化的进度、共同使用的知识空间和多个协作者。</p>\n  <p>林佐露把这种变化放在组织协作中理解。过去，企业内部的很多协同基于即时通信工具完成；接下来，IM和AI工作台可能逐步融合，“在同一个知识空间、同一个上下文里面，产生多人和Agent的交互”。</p>\n  <p>Agent在其中扮演的角色也会发生变化。“我们相信WorkBuddy的专家未来会有更多种方式被唤醒，或者是人被Agent调用，不一定是人在调用Agent。”</p>\n  <p>至于任务从哪里发起、工作流下一步触达到哪里，不同规模的组织、不同行业的企业会形成各自的方式。WorkBuddy不会预先定义哪一种形态最好。林佐露说，团队目前要做的，是在模型、Harness和行业能力逐步连接后，把“当下最好的生产力效果”交付给用户和企业伙伴。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260903/v2_914c97894252485ca38887a62acc60f9@6252890_oswg1038764oswg908oswg2944_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">WorkBuddy开放平台</p>\n  <p>这也是为什么，WorkBuddy要在上线不到半年就开始加速搭建生态的背景。</p>\n  <p>“最后一个任务好不好，是从基模到Harness，到上下文、工具调用，再到场景联通性，每个环节乘起来的结果。”林佐露说。</p>\n  <p>为了承接这些能力，WorkBuddy推出了“Buddy应用”。合作伙伴可以把自己的业务场景、工具和品牌接入平台，形成面向特定行业的AI工作台。目前已有30余个行业应用加入，覆盖金融、法律、医疗、教育、公益和企业服务等20多个领域。</p>\n  <p>开发者还可以通过Skill、Expert和Connector接入专业能力。Skill为Agent提供完成特定任务的方法，Expert对应专业智能体或智能体团队，Connector用于连接外部系统，目前支持MCP和CLI两种方式。</p>\n  <p>林佐露提到，最早参与平台建设的，通常是已经在特定行业积累了专业数据、知识或流程经验的伙伴。他们过去可能通过SaaS软件服务客户，现在则尝试在Agent底座上重新组织这些能力。</p>\n  <p>一些SaaS企业此前也尝试自行开发Agent应用，但在运行环境、上下文管理等工程环节投入较大。“他们对自己领域的知识很熟悉，但对工程的部分投入非常巨大，对他来说也不是最具性价比的方式。”林佐露说。与WorkBuddy合作后，SaaS厂商可以继续专注于自己熟悉的行业场景，通用的Agent能力则由平台提供。</p>\n  <p>不过，接入WorkBuddy并不意味着合作伙伴要把原有产品完整迁移过来。</p>\n  <p>目前，部分软件在WorkBuddy中开放的功能和权限，仍少于其独立客户端。对此，林佐露认为，不是所有能力都适合放进Agent。以阅读为例，用户如果需要沉浸式阅读，一篇文章仍然更适合呈现在浏览器等专门的容器中，而不是由Agent压缩成几十字的摘要。</p>\n  <p>合作伙伴需要自行判断，哪些任务适合用自然语言发起并自动完成，哪些仍应留在原有客户端和网站中。至少在现阶段，WorkBuddy更像是原有软件和业务系统之上的任务入口与执行层，而非对独立应用的整体替代。</p>\n  <p>对于生态本身，林佐露也保持了相对克制的判断。</p>\n  <p>“生态是不太能被计划的，不是说你希望怎么样，这个生态就会长成什么样。”在他看来，有没有生态是一个结果，源头仍然是产品是否足够好、是否拥有足够多的用户，以及开放的设计是否合理。只有用户确实需要这些能力，行业伙伴和开发者才会持续投入。</p>\n  <p>因此，首批超过100家伙伴更多反映了平台开放初期的参与意愿，还不能说明生态已经形成。WorkBuddy也没有为合作伙伴数量设定明确目标。与此同时，商业机制也还在建设中。WorkBuddy正在开发面向伙伴的经营、运营和营销工具，支付能力与分发通路尚未正式推出。</p>\n  <p>在采访中，林佐露认为，用户最终会为真正解决问题、具有生产力价值的任务付费。随着更多行业技能、数据和经验进入平台，用户能够完成更复杂的任务，也可能产生更高的支付意愿。WorkBuddy希望将其中一部分价值导向提供Buddy应用、Connector和Skill的合作伙伴，但具体的定价和分配方式目前尚未公布。</p>\n  <p>今年3月上线以来，WorkBuddy已经更新50多个版本，并开始在政务、教育、金融、传媒等50多个行业落地。在广东，部分政务单位已开展场景对接和试点；山东莱州为6000多名中小学教师配备了相关AI助教；在传媒领域，WorkBuddy也参与了央视对达沃斯论坛和世界人工智能大会的报道工作。</p>\n  <p>智能硬件让Agent拥有了更多入口，行业伙伴则补充了任务继续执行所需的数据、工具和经验。这些能力能否连成稳定的工作链条，决定了WorkBuddy能否从响应指令的办公工具，进一步进入企业的日常协作。</p>\n  <p>“开放是我们要做的工作，生态是一个结果。”林佐露这样总结道。</p>", "category": "tech", "published_at": "2026-09-03T02:00:00+00:00", "fetched_at": "2026-09-03T02:41:31.008967+00:00", "fingerprint": "b1d350e12c07a956"}, {"source": "少数派", "title": "众测招募 | 玩转音乐生态，体验 Sonos Play 便携智能音响", "url": "https://sspai.com/post/113581", "summary": "近年来，智能音响正在从「放在客厅的固定设备」变为「跟随你移动的声音系统」。用户不再满足于单一房间的聆听，而是希望音乐能随着自己的脚步，从客厅到厨房、从书房到户外，无缝流转、不断联。这正是Sonos一直 ...<a href=\"https://sspai.com/post/113581\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-02T03:00:00+00:00", "fetched_at": "2026-09-03T02:41:29.093137+00:00", "fingerprint": "531560281f5e479b"}, {"source": "少数派", "title": "一日一技 | 借助 PowerShell 自定义 Windows 更新暂停时间", "url": "https://sspai.com/post/80562", "summary": "Windows 下的累计更新会修复大量的安全漏洞，虽然可以暂停更新但是最长只能暂停 35 天，35 天后 Windows 电脑就要强行帮你更新了，而本文介绍了一种突破暂停最大时间的方法。<a href=\"https://sspai.com/post/80562\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-02T07:22:27+00:00", "fetched_at": "2026-09-03T02:41:29.093130+00:00", "fingerprint": "a874a737fb3e8687"}, {"source": "少数派", "title": "除了折叠屏 iPhone，Apple 发布会还有哪些看点？", "url": "https://sspai.com/post/114084", "summary": "上周，Apple公布了今年秋季发布会的时间和主题，这场名为「Surpriseandshine」的发布会将于北京时间9月10日凌晨一点在ApplePark举行。与过去两年的秋季发布会不同，今年的「科技春 ...<a href=\"https://sspai.com/post/114084\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-02T09:40:56+00:00", "fetched_at": "2026-09-03T02:41:29.093123+00:00", "fingerprint": "68913b5ebed499aa"}, {"source": "少数派", "title": "派早报：Google 发布 Gemini 3.8 Flash、理想推出新一代 MEGA 等", "url": "https://sspai.com/post/114113", "summary": "World Labs 发布多模态世界模型 Atlas、阿里千问推出 Qwen3.8-Max-0902 等。<a href=\"https://sspai.com/post/114113\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-03T00:31:14+00:00", "fetched_at": "2026-09-03T02:41:29.093111+00:00", "fingerprint": "29a34c1c1b8dd002"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD =
