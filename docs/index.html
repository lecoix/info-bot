13:18.947442+00:00", "fingerprint": "0ccf3abe5992f79c"}, {"source": "The Verge", "title": "The Echo Show 21 is a great smart home hub that’s $80 off", "url": "https://www.theverge.com/gadgets/970254/amazon-echo-show-21-deal-sale", "summary": "Split between buying a smart calendar, a kitchen TV, a smart home hub, and a smart display? Amazon’s Echo Show 21 is all of those things in one, with a huge 21-inch screen. You can use it to control your smart lights, glance at recipes, watch TV shows, and more. Currently, Best Buy and Home [&#8230;]", "category": "tech", "published_at": "2026-07-23T20:36:40+00:00", "fetched_at": "2026-07-24T02:13:18.947437+00:00", "fingerprint": "01f1c8d67b76bd2c"}, {"source": "The Verge", "title": "Alexa Plus is getting an AI update to handle more complicated instructions", "url": "https://www.theverge.com/tech/970399/amazon-alexa-plus-ai-update-smart-home-devices", "summary": "Amazon is launching an update to its Alexa Plus assistant that will allow it to connect to smart home devices in new ways. With the update, which is currently in preview, Alexa Plus can link up with tech from Bosch, Delta, Ecovacs, iRobot, Yale Home, Whirlpool, Tapo, Eufy, and others, while automatically routing requests to [&#8230;]", "category": "tech", "published_at": "2026-07-23T21:15:06+00:00", "fetched_at": "2026-07-24T02:13:18.947426+00:00", "fingerprint": "a6e6ed7cc55ba5af"}, {"source": "36氪 - 最新文章", "title": "独家｜混元多模态理解负责人胡瀚离职创业，原团队或将聚焦世界模型", "url": "https://36kr.com/p/3907934819521670?f=rss", "summary": "<p>文 | 周鑫雨</p>\n  <p>编辑 | 张雨忻</p>\n  <p>《智能涌现》独家获悉，近期，腾讯混元多模态理解负责人胡瀚提出了离职。</p>\n  <p>此前，他曾担任微软亚洲研究院视觉计算组首席研究员。2025 年初加入腾讯后，负责视觉大模型的研究。在后续的调整中，他加入大语言模型部旗下的“Frontier”前沿技术研究组，负责多模态理解的相关研究，汇报给姚顺雨。</p>\n  <p>据了解，胡瀚还曾承担世界模型的研发工作。</p>\n  <p>与此同时，腾讯大语言模型部负责人姚顺雨近期正在密集梳理旗下团队，<strong>胡瀚此前所在的研究组或将聚焦世界模型的前沿研究</strong>。</p>\n  <p>截至发稿，腾讯未对上述信息做回复。</p>\n  <h2>大语言模型仍是混元最重要的事</h2>\n  <p>自 2026 年年中以来，围绕混元体系的人员变动一直在进行。7 月初，前 OpenAI 研究员、麻省理工学院博士田永龙加入大语言模型部——我们得知，他将代替胡瀚负责视觉语言模型方向（VLM）的研发，并汇报给姚顺雨。</p>\n  <p>自姚顺雨加入，补全短板、将混元基模的能力快速提升至第一梯队，就成了腾讯 AI 的主线。</p>\n  <p>重新梳理资源分配，将人才、算力聚焦至大语言模型部负责的基础模型研发，是姚顺雨上任后的核心举措之一。</p>\n  <p>比如，腾讯撤销 AI Lab 后，核心研发人员全部并入了大语言模型部。大语言模型人才的招聘力度也随着姚顺雨的加入而变大，比如来自字节 Seed Infra 团队和后训练团队的数人。</p>\n  <p>后来，在 6 月 5 日的腾讯云AI产业应用大会上，腾讯集团高级执行副总裁、云与智慧产业事业群 CEO 汤道生，某种程度上替外界向姚顺雨问出了一个尖锐的问题：很多人说腾讯在AI上慢了，你觉得我们真的慢了吗？</p>\n  <p>但其实，“顺雨比腾讯的高层更急。”一名混元的研究员告诉《智能涌现》。他提到，姚顺雨多次向腾讯高管为混元争取更多的算力资源。</p>\n  <p>另一个细节是，“晚点 LatePost”曾提到，在 Hy3 发布前的一个月，一批数据出现了问题。姚顺雨用少见地严厉措辞告诫了团队：“数据非常重要。如果下次再出现这样的情况，直接走人。”</p>\n  <h2>重新衡量多模态理解的收益</h2>\n  <p>当各条 AI 战线均未跑出领先身位时，腾讯想要突围，势必要重新衡量各个 AI 技术方向的收益。</p>\n  <p>一方面，胡瀚所从事的多模态理解研究已经趋于成熟，继续投入资源所带来的收益已经十分有限。</p>\n  <p>“在多模态理解研究中，文字、图像、视频识别准确率基本上能达到85%以上，”一名多模态研究员告诉我们，“难的其实是视觉推理，就是让模型理解图像和视频意味着什么，这一步靠多模态研究是不够的，而是要提升语言模型的推理能力。”</p>\n  <p>技术红利渐退，多模态理解所能带来的商业收益，也并不明晰。</p>\n  <p>此前，多模态研究一度在腾讯 AI 体系中占据核心地位。核心原因是，计算机视觉技术，可以直接与广告、游戏、影音这些“现金牛”业务强结合，为腾讯创收。</p>\n  <p>但相较于生成技术，多模态理解所对应的“识图”“看图写话”等场景，其实无法直接商业化。</p>\n  <p>“没有用户愿意为识图付费，市面上有大把免费可替代的产品。”一位元宝产品经理提到，用户真正愿意付费的，是文档处理、PPT制作、研报制作这些办公场景——背后对应的，是模型的推理、Coding、Agentic能力。</p>\n  <p>另一方面，腾讯的算力资源有限，与字节、阿里相比并不占据优势。</p>\n  <p>2025 年腾讯财报显示，腾讯全年资本开支为 792 亿元；相对的，截至 2026 年 3 月，阿里的财年资本开支达到了 1260 亿元；而据彭博社报道，2026年字节计划将 AI 基础设施投入最高推至 700 亿美元。</p>\n  <p>资源有限，混元内部难免陷入僧多粥少的局面。此时，暂缓技术红利有限的多模态理解研究，聚焦在更代表未来的前沿方向研究上，是腾讯权衡收益后的抉择。</p>\n  <p>7 月 6 日，姚顺雨交出了加入腾讯后的第一份正式答卷，大模型 Hy3。在同等参数量的中等尺寸模型中，Hy3已经能和GLM-5.2、DeepSeek V4 Pro掰手腕。</p>\n  <p>在腾讯 AI 自身的坐标系上，姚顺雨加入以来的组织重组、基建体系（数据、Infra、评测）重构，以及回归基模的战略，让混元在短短半年内，有了上 AI Tier 1 牌桌的资格。</p>\n  <p>（《智能涌现》作者李炤锋亦有贡献。）</p>", "category": "tech", "published_at": "2026-07-23T08:07:02+00:00", "fetched_at": "2026-07-24T02:13:18.851827+00:00", "fingerprint": "b6302af5c30000c4"}, {"source": "36氪 - 最新文章", "title": "专访郭列：做出脸萌、FaceU、剪映等爆款后，他第一次阐释如何在AI时代做产品", "url": "https://36kr.com/p/3907953777120385?f=rss", "summary": "<p><strong>文｜周鑫雨</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>什么样画像的AI创业者会饱受瞩目？不同投资人心里或许有不同的答案，但其中一个答案一定是：剪映系。</p>\n  <p>陈冕，Lovart、LibTV等热门创作工具的缔造者；明超平，AI Coding社区YouWare的创始人，2025年一级市场最火的95后；闹闹，其打造的AI视频创作工具OiiOii，被高瓴、锦秋投资......</p>\n  <p>他们履历的共同点是：曾在剪映、CapCut团队——参与过这两款过亿日活产品的打磨，这让投资人有理由相信，这群“剪映系”创业者了解用户、有产品审美，更可能在这波AI浪潮中押中消费级的机会。</p>\n  <p>但很长一段时间内，“剪映系”真正的起点，郭列，隐身在2022年起的AI浪潮中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_f0bf09344d6a4b1e8dcd046e000b07e9@5783683_oswg995274oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△Flova、脸萌、FaceU创始人郭列。图源：受访者供图</p>\n  <p>&nbsp;</p>\n  <p>作为脸萌、FaceU的创始人，他曾做出中国移动互联网时代最成功的一批C端工具产品。2018年，脸萌团队以约3亿美元的价格被字节收购。</p>\n  <p>此后，郭列开始负责字节影像业务，参与孵化了剪映、CapCut、醒图、轻颜等一系列产品。2022年，他又成立了自己的游戏公司“船岛游戏”。</p>\n  <p>但两年后，结束游戏创业的郭列消失在了大众视野中。<strong>直到2025年10月，一个名为Flova.ai的视频创作Agent在全球上线。</strong></p>\n  <p>这款视频创作Agent，整体使用逻辑与市面上大多工具类似：通过对话，让封装了不同能力的Agents完成脚本创作、角色设计、分镜设计、成片生成和编辑的工作。</p>\n  <p>但Flova又有些不同。比如，它没有采用最主流的画布形态，让用户自由创建节点；再比如，多名Flova的早期用户对我们反馈，Flova的“记性”和语义理解在同类产品中非常突出，“创作十几集后，还能记住第一集的某个分镜”。</p>\n  <p>在“闭关”近一年的时间里，郭列和团队思考的最多的一件事是：<strong>怎么同时为人和Agent设计产品？</strong></p>\n  <p>“做脸萌、剪映，我只需要思考怎么让人觉得好用。但AI时代，你必须要给Agent提供足够灵活的容器。”他告诉我们。</p>\n  <p>这个命题天生带有矛盾感：<strong>人类用户需要一个能支持创意无限发散的空间，但想要最大程度发挥Agent的智能，Context又要足够有序、结构化。</strong></p>\n  <p>最终，团队的答案是，将产品容器设置成一个可以自由切换视图的工作面板。</p>\n  <p>在“对话”区，用户通过自然语言对Agent发出指令，也就是让Agent接收Context；而Agent执行操作的过程，会直接呈现在“故事板”区上。一旦有新想法，用户可以随时打断、调整Agent的工作流，每一步的视觉效果，会出现在“预览”区。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_ca232cd866d7457f85111e5bb36a6375@5783683_oswg414189oswg1080oswg539_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△Flova。</p>\n  <p>创业后的很长一段时间内，郭列拒绝了很多投资人抛来的TS（投资条款）。《智能涌现》得知，<strong>成立至今，Flova完成了由红杉中国、IDG、云九资本的两轮融资，总金额为8000万美金</strong>——其中，IDG和云九还是脸萌的老股东。</p>\n  <p>在如今普遍追求“大额融资”、“滚动融资”的氛围里，这个数字称得上克制。郭列给出的理由是：<strong>对于一个Agent产品而言，8000万美元已经足够。真正重要的是产品、增长和商业循环，而不是��户上的现金数字。</strong></p>\n  <p>郭列一直是个感性的人。他是《海贼王》的20年老粉、影视发烧友，创业和组建团队“凭兴趣”、“看缘分”。10多年来，这份感性也一直驱使他不断做出有趣的图像、视频创作工具。</p>\n  <p>但和10年前不同的是，如今的郭列变得更加理性。脸萌并入字节后，他形容自己在“补课”——体系化地学习如何做A/B Test，做团队管理，做增长和商业化。</p>\n  <p>互联网时代的辉煌已经过去。站在AI的新战场上，郭列需要像新手一样重新理解人、理解Agent。他并不在意自己做的是共识还是非共识——最终，所有决策都会用科学的观测结果来说话。</p>\n  <p>“现在创业会有延续成功的压力吗？”我们问他。</p>\n  <p>“享受远大于压力。”这是郭列的答案。</p>\n  <p>近期，有关如何同时为人和Agent做产品、如何与“字节们”竞争，我们与Flova团队聊了聊。<strong>以下是《智能涌现》与Flova创始人兼CEO郭列、增长和商业化负责人瑞瑞尔、Agent产品负责人唐果的对话：</strong></p>\n  <h2><strong>从脸萌、剪映，到Flova</strong></h2>\n  <p><strong>智能涌现：</strong>你之前做过很多成功产品。现在创业会有延续成功的压力吗？</p>\n  <p><strong>郭列：</strong>其实没啥压力。这种感受有点像参加世界杯，不管你这届有没有夺冠，下届照样得参加。你参加的原因，还是对踢球感兴趣。</p>\n  <p>Flova是我喜欢的方向，我享受创业远大于感受到的压力。</p>\n  <p><strong>智能涌现：</strong>驱动你一直做产品的动力是什么？</p>\n  <p><strong>郭列：</strong>兴趣和正反馈都是很重要的。当你做了一件感兴趣的事，得到了正面的结果和反馈，这就会成为源源不断的动力。我平时看很多电影、动漫，对内容创作本身就很喜欢。</p>\n  <p>其次在做产品的过程中会遇到不同的伙伴，一起成长也是很有意义的。</p>\n  <p><strong>智能涌现：</strong>你和Flova的初创团队是怎么遇到的？</p>\n  <p><strong>郭列：</strong>创业本身会有一些随机性，真的全靠缘分。大家恰好对内容创作感兴趣，方法论和价值观也很一致。这些缘分和做产品有点像，会偏感性。</p>\n  <p><strong>智能涌现：</strong>你看起来是个享受创业状态的人，那中间为什么会选择进入字节？</p>\n  <p><strong>郭列：</strong>我刚创业的时候才工作一年，更像毕业生创业。当时我有个比较大的困惑：当一群好朋友一起创业，公司做大了以后管理怎么做？</p>\n  <p>所以选择进入字节，想补一补管理的功课。当时我的心态像实习生，字节给我提供了很多管理的方法论。字节的产品方法论也让我受益匪浅，包括一个产品怎么做增长、怎么实现正循环。</p>\n  <p><strong>智能涌现：</strong>哪些方法论放到现在也不过时？</p>\n  <p><strong>郭列：</strong>我之前做产品比较感性，策划一些产品功能都凭感觉。但字节有一套科学的A/B Test体系，当然首先你要提出质量都足够高的A和B方案，不然Test也没用。</p>\n  <p>我学会了用感性和理性结合的方式做产品。当我用感性提出了一些假设，理性的验证能够及时做支撑。</p>\n  <p>还有一点是产研之间的协作。在字节，技术的话语权很强，所以技术的同学很主动。还有字节的增长团队和市场团队，自由度非常高。</p>\n  <p>综合而言，原来我有些“偏科”，到了字节之后，我把技术、增长、商业化的课都补全了。<strong>除了做好一个产品，我还学会了怎么活下来。</strong></p>\n  <p><strong>智能涌现：</strong>那哪些字节方法论是现在创业不适用的？</p>\n  <p><strong>郭列：</strong>字节比较看重OKR。但我在创业做游戏的时候试了一下，发现没用。原因在于，对大公司而言，管理是很重要的。但创业团队的早期管理，越轻越好。团队建立不是通过管理工具，而是靠内在驱动。等团队大了之后，你需要卡员工的能力下限，所以才要通过一些管理工具设定及格线。</p>\n  <p><strong>智能涌现：</strong>你创业了这么多年，觉得AI时代创业和互联网时代创业最大的不同是什么？</p>\n  <p><strong>郭列：</strong>移动互联网更多的是从PC到手机的“端”的变化，或者从3G到5G、从文字到视频的流量入口变化。</p>\n  <p>但现在能明显感受到技术每隔一段时间就有一个大的更新，这就需要你能够预测技术的发展，<strong>要有面向未来做产品设计的能力。</strong>你需要知道哪些问题是通过模型迭代可以解决的，哪些是需要产品本身、或者Agent解决的。</p>\n  <p>所以现在我们团队里所有人都在关注技术。<strong>如今AI能够做的事更多了，大家需要共享的Context也会更多，必须要减少信息壁垒。</strong></p>\n  <p><strong>智能涌现：</strong>做同样的事，AI时代需要的团队规模是不是比互联网时代小？</p>\n  <p><strong>郭列：</strong>是的，人数远小于互联网时代。</p>\n  <p>但仍然有一些岗位是AI无法提效的。比如偏市场的工作，AI无法完全解决人与人之间的沟通问题。</p>\n  <p><strong>瑞瑞尔：</strong>关于AI提效，我觉得<strong>AI Coding并不是单纯地让一个程序员有5个人的生产力，而是重构了产品研发、运营、设计之间的协作关系。</strong></p>\n  <p>比如我们公司基于产品的Context、用户的Context，做了非常多内部观测的工具。基于这些Context，我们就能很高效地完成很多在互联网时代低效、但不可避免的工作。</p>\n  <p>以产品能力的更新举例，在上一个时代，产品更新的需求要同步研发，大家花很长时间去对齐。但现在基于共享的Context，任何岗位、视角的人都可以参与决策和协作。</p>\n  <p>再比如对用户行为的监测，互联网时代需要你针对性地做一些产品漏斗的埋点，或者临时发起问卷。如今的Agent系统，本身对用户就有大量的Context积累和语义理解。用户的信息流动会更完整、通畅，也更高效。</p>\n  <h2><strong>视频Agent的每一次创作，都是之前创作的延续</strong></h2>\n  <p><strong>智能涌现：</strong>成立Flova之前，你还做过游戏公司“船岛”，为什么没考虑过创业做AI游戏方向？</p>\n  <p><strong>郭列：</strong>游戏本身的竞争力是足够好玩，相比视频内容创作，游戏是一个更复杂的载体。</p>\n  <p>但游戏需要Coding，需要3D建模，成熟期会更晚。比如，3D游戏需要解决建模面数的合理性、骨骼的绑定，这些都是AI目前很难解决的问题。</p>\n  <p><strong>智能涌现：</strong>当时为什么游戏公司没有做下去？</p>\n  <p><strong>郭列：</strong>游戏创业让我意识到，还是<strong>要做时代需要的东西</strong>。当时游戏版号的管控很严格，用户对游戏精品的要求也会更高。做游戏以后我意识到，之前做互联网创业是非常顺利的。</p>\n  <p>从我个人的能力模型来说，虽然我对内容创作行业很感兴趣，但我不是一个天才制作人。我和团队更擅长的还是做产品，如果我们的产品能让更多人做更好的影片，也是很有意义的。</p>\n  <p><strong>智能涌现：</strong>成立Flova的契机是什么？</p>\n  <p><strong>郭列：</strong>2024年底DeepSeek V3开源了，当时我就觉得做AI应用有机会。</p>\n  <p>最初也是受到兴趣的驱使，我喜欢电影，有时候也会手搓一些AI短片。一开始我花了两周时间，先用Midjourney生成参考图，再用可灵生成的视频，加上剪映的后期，搓了一个3分多钟的AI短片。</p>\n  <p>当时我就觉得工作流比较复杂，角色的一致性也不高。正好Agent的技术也在发��，这种形态也许能够补足视频生成技术的不足，辅助用户制作AI视频。</p>\n  <p><strong>智能涌现：</strong>回过头看，这是一个入局Agent的好时机吗？</p>\n  <p><strong>郭列：</strong>现在入局Agent也还在很早期的阶段，因为AI才发展三年。</p>\n  <p>参考移动互联网时代，07年iPhone发布，08年安卓发布，但应用真正爆发是在14年到16年。</p>\n  <p><strong>智能涌现：</strong>应用有各种方向，最后你是怎么收敛到视频创作Agent上的？</p>\n  <p><strong>郭列：</strong>一开始我想做偏C端的应用，但Token价格偏贵，所以To B或者To专业创作者的产品，会更合适一些。之前我也有做剪映的经历，所以对创作者的需求会更了解。</p>\n  <p>当时我刷抖音、B站、小红书，还有海外的TikTok和YouTube，很明显，社媒上的AI内容越来越多了。所以AI内容创作一定是个大趋势。</p>\n  <p>唐果：刚才说到，我们一起手搓视频的时候，觉得对大多数人而言门槛太高了。</p>\n  <p>刚好Manus发布了（2025年3月），给了我们一些刺激。我们意识到可以通过让Agent执行的方式，将用户的创作精力放在审美决策上。</p>\n  <p><strong>智能涌现：</strong>市场上和你们同一赛道的公司有很多，LibTV、OiiOii等，你们怎么找到自己的位置？</p>\n  <p><strong>瑞瑞尔：</strong>根据业态演化的不同，我会把AI视频创作工具分为三类：</p>\n  <p>第一类是<strong>模型的C端应用</strong>。它们核心是为了展示模型的showcase，因为卖模型API本身就有足够大的利润。它们通常不会集成第三方模型，这就导致用户的创作体验有所缺失。</p>\n  <p>第二类是<strong>多模型的一站式集成平台</strong>。它们的核心体验与第一类产品没有本质的差别，因为用户仍然需要自己去了解不同模型的能力，以及不同内容的Workflow，最后用手动的方式串联。也就是说，<strong>虽然有Agent的参与，但发挥作用的依然是人的“大脑”。</strong></p>\n  <p>第三类是<strong>Agent</strong>。Flova就属于这一类。它的好处在于极大降低创作门槛，用户不需要分散精力到如何搭工作流、如何优化提示词上，而是专注于表达。</p>\n  <p>唐果：前两类产品和Agent最大的不同在于，<strong>前者的每一次视频生成都是一次重新开始，但视频Agent的每一次创作，都是之前创作的延续。</strong>因为之前用户创作的所有判断、审美，都能作为Context，被Agent继承。</p>\n  <p>很多创作者都反馈说Flova好用，原因也是在于Agent与用户在协同创作。</p>\n  <p><strong>郭列：</strong>我们的目标就是做一个更通用的视频Agent。Agent的智能可以满足各种用户的需求，包括短剧、漫剧、广告等等。Flova是在一个比较通用的架构下，通过Skill来满足细分场景的需求。</p>\n  <p><strong>智能涌现：</strong>Agent继承的是记忆，还是Context？</p>\n  <p><strong>唐果：</strong>记忆管理和Context管理有一些重叠的地方，但本质上是两件事：记忆管理更多的是记住用户的行为偏好，Context管理则是让Agent从上百、上千轮对话中，知道创作需要哪一种风格。</p>\n  <p>对我们而言，<strong>目前Context管理的优先级是更高的，因为这对单一项目创作是更刚需的事。</strong>因为我们发现，不少用户会在一个项目中持续进行几百轮对话，甚至基于一集的内容持续做十几集。当每一集的Context都有很好的关联性时，用户就会不自觉地在一个项目内做长对话积累的复杂创作。</p>\n  <h2><strong>同时面向人和Agent做产品</strong></h2>\n  <p><strong>智能涌现：</strong>之前的脸萌、剪映都是给人使用的应用，而Flova是同时给人和Agent使用的，设计产品的考量有哪些不同？</p>\n  <p><strong>唐果：</strong>更准确地说，不是把Agent当成和创作者并列的另一类用户，而是产品里第一次出现了两种需要同时被设计的参与者。</p>\n  <p>面向人，我们要提供足够直觉的创作界面，让用户方便地比较版本、调整细节、表达自己的审美判断；</p>\n  <p>面向Agent，我们要为它设计项目环境、工具、权限和有序的状态，让它能够理解当前项目并自由推进任务。</p>\n  <p>除此之外，还有第三部分，就是人和Agent之间的信息同步：用户做出的选择要及时被Agent理解，Agent做出的修改也要让用户看得见、能接管、能纠偏。</p>\n  <p><strong>真正好的视频Agent产品，不只是让两边各自好用，而是让双方能够在同一个创作过程中顺畅协作。</strong></p>\n  <p><strong>智能涌现：</strong>Flova现在最需要服务好的用户或者场景是什么？</p>\n  <p><strong>郭列：</strong>不同用户对产品的感知是不一样的。比如短漫剧用户使用画布产品，更像是用低价去买模型。虽然画布也提供了创作能力，但这些用户自己天生有能力将提示词写好，没那么依赖工具。</p>\n  <p>但对于不少非专业用户而言，Agent对创作效果的提升已经足够让他们产生粘性。就像现在的AI Coding一样，开发者已经离不开了。</p>\n  <p><strong>瑞瑞尔：</strong>我们对于用户和市场有比较多的切片视角，一类是按照内容品类划分，一类是按照创作者对AI的熟悉程度划分，一类是按照创作动机划分。</p>\n  <p>但这些都是制定不同策略时的切片视角，我们最终的出发点仍然是让用户低门槛创作出高质量的片子。</p>\n  <p><strong>在某个特定时间周期下，某些内容品类会相对强势。</strong>当下在中国，短漫剧就是现阶段的强势品类。但市场其实远不止于此。</p>\n  <p><strong>智能涌现：</strong>超创（超级创作者）是你们的典型用户吗？我们观察到不少创作工具都在减少与超创的合作，因为他们的使用行为不典型。</p>\n  <p><strong>郭列：我们的产品第一天就是同时面向人和AI设计的，超创刚好就是AI最资深的一批用户。</strong>在产品早期，超创对AI产品架构的设计，包括如何把产品做得更专业、品质更高，其实有很大的帮助。</p>\n  <p>剪映在初期也访谈了抖音上的很多剪辑达人。基于此，在底层架构设计阶段，我们才能对“多轨道”等更满足专业创作者的功能做一些原子化的拆解。</p>\n  <p>当然我们在设计Flova时，也会思考怎样让专业能力被更多的普通用户用到，这时Agent就能将专业创作能力做一些简化。</p>\n  <p>Flova的Agent平台上有各种Skill，大部分都是专业创作者编写的。普通小白只需要选择使用Skill，就能达到专业创作者80分/100分左右的能力。</p>\n  <p><strong>瑞瑞尔：不要单纯看超创产出的结果，而是要关注他们创作的过程。</strong></p>\n  <p>我们内部搭建了一套非常完善的观测系统，来追踪用户与Agent交互的全过程。比如，用户有哪些卡点？用户的一个镜头语言表达，是ta自身通过持续的RO（Round Optimization，迭代优化）做到的，还是Agent激发了ta？</p>\n  <p>对用户创作过程的观测，让我们可以发掘一些需求点和优化点。</p>\n  <p><strong>智能涌现：</strong>这套观测系统是怎么搭建的？</p>\n  <p><strong>唐果：</strong>在互联网时代，一些传统的监测方式，比如针对用户侧的一些埋点设计，核心目的都是监测整体用户的行为转化漏斗。</p>\n  <p>AI时代创业，要同时面向人和Agent做产品设计。那会不会存在面向Agent的一些行为转化漏斗？在你为Agent设计的环境或Harness（约束系统）中，能不能监测Agent是怎么做Reasoning（推理）的？</p>\n  <p>以及，Agent怎么判断自己要做什么？如何去使用工具？这个工具能否达成Agent想要达成的结果？Agent基于工具的结果又怎么再做推理？</p>\n  <p>我们搭建的观测系统，本质上就是存储这些过程的脱敏Context。<strong>未来这些Context可以被Agent消费，也可以以看板的形式被团队监测。</strong></p>\n  <p><strong>智能涌现：</strong>你们会怎么用这些观测结果？</p>\n  <p><strong>唐果：</strong>一方面，我们会用来不断迭代产品，让用户和Agent的行为能更好地有机结合，比如，<strong>对齐人和Agent对同一任务的理解。</strong></p>\n  <p>另一方面，监测系统会开放给我们所有的团队。<strong>研发同学和产品同学可以在同一个观测视角下，关注用户和Agent协作的不同切面，</strong>这有助于我们明确迭代方向。</p>\n  <p><strong>智能涌现：</strong>通过什么样的方式，能让Agent和用户充分共享Context，并且让Agent尽可能自由地调用工具？</p>\n  <p><strong>唐果：核心不是一次性给Agent更多信息或更多权限，而是让人和Agent共同维护一套项目状态。</strong></p>\n  <p>用户选择了哪个版本、修改了什么素材、放弃了哪条方向，都要及时写回项目；Agent做了哪些操作、生成了什么结果、任务进行到哪里，也要让用户看得见。</p>\n  <p>在Agent一侧，我们会通过渐进式披露，在合适的阶段提供合适的信息、工具和约束，工具会尽量设计得更底层、更通用，让不同Agent可以复用。</p>\n  <p>与此同时，权限和工程边界要足够明确，但在边界内部，Agent可以根据任务状态自由规划和调整路径。<strong>自由不是没有约束，而是在清晰边界内拥有足够的行动空间。</strong></p>\n  <p>我们对Agent系统的设计，会参考Claude Code和CodeX。</p>\n  <p><strong>智能涌现：Claude Code和CodeX给了你们什么启发？</strong></p>\n  <p><strong>唐果：</strong>我们研究Claude Code和Codex，是因为它们比较早地把Agent放进了真实的项目环境里。Agent不只是回答问题，而是持续读取项目状态、调用工具、推进任务，遇到问题后调整路径，最后把结果交给人检查和接管。</p>\n  <p>比如Flova比较喜欢调用Sub-Agent（子Agent），让多个Agent进行协作。到底采取怎样的Sub-Agent设计方案？</p>\n  <p>不少竞品设置Sub-Agent，是为了向传统影视行业的角色靠近，让Agent按照导演、编剧、剪辑等影视行业分工。</p>\n  <p>但Claude Code给我们的启示是：<strong>Sub-Agent本质上是一种任务和Context的压缩方式。</strong></p>\n  <p>每个Agent都有Context Window的限制，我们希望Agent能在有限的Context下，更好地发挥智能。但当Context足够多时，Agent设计就会遇到Context Rot（上下文腐烂）的问题，简单而言，就是Agent的注意力会被庞大的信息量所分散。</p>\n  <p>此时，<strong>主Agent可以专注在接收、理解用户指令上，将任务执行等细节交给Sub-Agent。</strong></p>\n  <p><strong>智能涌现：</strong>不少视觉创作类的Agent产品都采用了画布的形态，Flova为什么没有用画布？</p>\n  <p><strong>唐果：</strong>我们并不排斥画布，也不认为画布和Agent冲突。对创作者来说，拖拽、摆放、缩放和自由组合都很自然，画布确实是很好的非线性创意发散空间。</p>\n  <p><strong>真正需要警惕的，是未经思考就把画布沿用为AI创作唯一的标准答案。</strong></p>\n  <p><strong>智能涌现：</strong>你对产品容器的思考是什么？</p>\n  <p><strong>唐果：</strong>一方面，<strong>Agent需要在一个有序的Context中工作，它需要一个更结构化、被索引的创作空间。</strong></p>\n  <p>它需要知道哪些是角色，哪些是镜头，哪些是参考图；在视频生成的过程中，它也需要知道众多的版本中，哪些是被用户认可的，哪些只是创意发散的过程——一旦工作台非常杂乱，Agent的智能水平会直线下降。</p>\n  <p>另一方面，你又要<strong>面向用户，提供一个支持他们无限发散创意的空间</strong>。画布对于创作者而言就是一个自然的创意发散容器。</p>\n  <p>但我们不能被canvas-first（画布优先）的思维局限，而是要思考怎样的容器对Agent同样友好，并且让Agent和用户双方共享同一套Context。</p>\n  <p><strong>智能涌现：</strong>这些思考最后是怎么具象成产品设计的？</p>\n  <p><strong>唐果：</strong>产品需要在无序的创意发散空间，和有序的Context之间达成平衡。这意味着Flova要支持用户和Agent在不同视图之间灵活切换。</p>\n  <p>本质上Agent和用户对世界的理解是不一样的。Agent底层是语言模型，它会通过语言编码的方式去理解世界。但人是多模态的动物，对图和视频的感知会更强。</p>\n  <p>在Flova中，Agent会通过对话框接收人的指令，它干活的过程会呈现在左侧的“故事板”上，而用户可以通过中间的“预览”直接观测到Agent执行的结果。一旦效果不理想，用户可以直接双击“故事板”中的相关执行过程进行干预，比如修改Agent写的镜头描述。</p>\n  <p>“故事板”就是目前我们探索出的人和Agent能够高效协作的容器。</p>\n  <h2><strong>在发展期，我们会尽量做到0毛利</strong></h2>\n  <p><strong>智能涌现：</strong>今年视频创作工具赛道竞争的激烈程度有超过你们的预期吗？</p>\n  <p><strong>瑞瑞尔：</strong>预期之内。但我们不会用竞争的视角去看待选手越来越多的现象。选手多，反而意味着越来越多的人认可这个赛道的巨大价值，我们更加兴奋。</p>\n  <p>以及，我们更关心的是，在Agent的生态位中，Flova怎么跑得更快。</p>\n  <p><strong>智能涌现：</strong>你心目中Flova的竞品都有谁？</p>\n  <p><strong>郭列：</strong>我没有太关注其他产品，更多时间都在关注用户。我希望我们还是有自己的节奏，通过Agent的方式帮助创作者更好地做创意表达。</p>\n  <p><strong>智能涌现：</strong>那Flova有壁垒吗？</p>\n  <p><strong>郭列：</strong>我们不会把某一种技术架构直接当成壁垒。Context管理、Skill、多Agent、Harness，都是现阶段帮助视频Agent更好工作的方式，未来都可能变化。</p>\n  <p>更长期的积累，是持续观测用户和Agent怎么共同完成创作，并评估Agent的每一步有没有真正帮用户往前走。只有看清哪些能力创造了价值、哪些只是增加了复杂度，产品才能随着模型一起进化。</p>\n  <p><strong>智能涌现：</strong>不少玩家都在通过做补贴的方式获客。你们怎么看？</p>\n  <p><strong>瑞瑞尔：</strong>郭列经历过互联网时代的激荡风云，所以<strong>我们会更冷静且长期地看待做补贴这件事。</strong></p>\n  <p><strong>找到健康的经营逻辑，比激进地追求某一个指标更重要。</strong>具体而言，我们要考虑的是当下的业务阶段，应该匹配怎样的用户体量，配合怎样的现金循环以及ROI（投入产出比）。</p>\n  <p>举个例子，相比只看Token支出的总量，我们更关注的是<strong>有效消耗的比例</strong>，比如Token消耗中，有多少是用户觉得有价值的，哪些是因为产品还不够好导致的无效消耗。</p>\n  <p><strong>智能涌现：</strong>现阶段你们看重毛利吗？</p>\n  <p><strong>郭列：在发展期，我们会尽量做到0毛利。</strong></p>\n  <p>Agent还在早期，我们更多希望用户觉得Flova好用。0毛利是相对合理的，我们给用户提供一个优惠的价格，让他们没有负担地使用产品。</p>\n  <p>加之我们团队之前帮投资人赚过钱，所以一级市场对Flova也比较有信心。我们有足够的融资做底气，在早期给用户比较实惠的价格。</p>\n  <p>现在市场上确实存在不少烧钱做补贴的现象，其中一些产品是没有做到商业正循环的。这会给公司的经营、用户的信任带来隐患。如果把AI行业拉到3年、5年、10年的长度，最终竞争还是会回归到产品力。</p>\n  <p><strong>智能涌现：</strong>听说你拒绝了很多投资人的TS。为什么没融更多钱？</p>\n  <p><strong>郭列：</strong>8000万美金对一个Agent产品来说已经非常够了，<strong>Manus在很成功的时候也只融了5000万美金。</strong></p>\n  <p>只要产品好用、增长和Token消耗都日趋健康，8000万美金对我们现在的阶段是合适的。后续如果我们有更健康的增长，融资金额也会随之增加。</p>\n  <p><strong>智能涌现：</strong>但现在市场上有一种“滚动融资”“用钱堆壁垒”的情绪。</p>\n  <p><strong>郭列：从整个移动互联网周期来看，所有的头部大厂都真正做到了商业的正循环。</strong>如果做不到这一点，融资融着融着，就会出现问题，比如互联网教育、团购、共享单车。</p>\n  <p><strong>智能涌现：</strong>0毛利、低价补贴做到什么样的阶段才能停止？</p>\n  <p><strong>瑞瑞尔：我们不会从Token成本降低的角度思考这件事，而是会围绕不同层级用户的付费意愿想办法。</strong></p>\n  <p>比如短漫剧公司往往对成本很敏感，那我们给的补贴就多一点。但更大众化的创作者，本身创作体量就不大，他们更在意Agent对内容质量、创作效率的提升，他们更愿意为Agent的溢价付费。</p>\n  <p>目前我们是通过补贴降低用户的创作门槛。未来我们会针对不同的用户、不同的创作环节，更细化补贴的政策。</p>\n  <p><strong>智能涌现：</strong>通过创作者发布在社媒上的内容来导流，也是一种普遍的增长方式。在大家都在争夺社媒这个流量入口，这套增长方法论的效果还显著吗？</p>\n  <p><strong>瑞瑞尔：创作工具和消费平台共生的循环体系，我们觉得它会一直work，并且还在加速work。</strong>Flova的用户主要就是通过口碑传播，以及社媒内容带量转化而来的。</p>\n  <p><strong>智能涌现：</strong>这套玩法在字节很成熟了，他们还有自己的模型Seedance，你觉得随着模型越来越好，创作Agent的空间会缩小吗？</p>\n  <p><strong>郭列：</strong>这涉及到一个问题：随着模型的进化，视频创作的内容生态是更繁荣了，还是更水了？我们认为答案是越来越繁荣，<strong>模型的发展提高了创作的下限，而创作工具的发展是提高了上限，所以模型不会把视频工具吃掉。</strong></p>\n  <p>这一过程中，AI视频的消费价值会被放大，消费者会变多，同时对上游创作者的需求空间也会变大，促使更多的创作者进来——这个市场还很早期，远远没到存量博弈的阶段。</p>\n  <p><strong>智能涌现：</strong>但越来越强大的模型会卷走一些创作工具的用户，比如希望用模型直出成片的。</p>\n  <p><strong>郭列：</strong>这个需求更多来自C端普通用户，比如发朋友圈或者其他社媒。他们就用豆包做一些小视频，甚至即梦都用不到。</p>\n  <p>Flova的定位更多还是面向prosumer，他们会将视频创作作为职业或者副业。但如果要创作成片，最强的视频模型Seedance 2.5依然需要50个参考。<strong>当模型能力越强、画面效果越好，其实需要的Context会更多，用户依然需要专业工具。</strong></p>\n  <p><strong>智能涌现：</strong>什么样的用户能被转化为付费用户？</p>\n  <p><strong>瑞瑞尔：</strong>他们和非付费用户比较明显的区别有两个。</p>\n  <p>第一是创作动机。持续付费的用户，创作动机比较明确，他们可能已经拿到了社媒的正循环，或者看到了AI视频稳定的商业价值。</p>\n  <p>第二是创作内容的长度。未付费的用户往往等多地做长线探索，以及他们不一定完整地做一个片子，而是先生成关键分镜再判断要不要持续创作。</p>\n  <p><strong>智能涌现：</strong>做Flova，你们有bet一些非共识吗？</p>\n  <p><strong>唐果：</strong>有。我们的非共识是，<strong>应用层不应该把任何一种Agent架构当成终局。</strong>Skill、多Agent、Harness都是帮助Agent进化的阶段性手段。</p>\n  <p>我们真正关心的是，在当前模型能力下，哪种方案最能为用户创造价值，再通过观测和评估持续调整。</p>\n  <p><strong>智能涌现：</strong>设想一下，如果剪映或者字节其他团队，也做视频创作Agent，对你而言会是威胁吗？</p>\n  <p><strong>郭列：</strong>我们刚开始做FaceU的时候，当时市场上也有美图的“美颜相机”、腾讯的“天天P图”，字节内部还有一个“狸猫相机”，但我们还是跑出来了。</p>\n  <p>大厂的优势确实是资源，以及自有模型可以控制成本。但产品团队的目标是将产品做得足够好，最终用户会用脚投票。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_c31453b14987488caf44c96c151eac36@5783683_oswg649725oswg1389oswg517_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>", "category": "tech", "published_at": "2026-07-23T08:16:42+00:00", "fetched_at": "2026-07-24T02:13:18.851821+00:00", "fingerprint": "3ee0e4f335c27e8a"}, {"source": "36氪 - 最新文章", "title": "网格智算：“不堆算力”的AI大脑如何填补林下场景空白 | 水下项目", "url": "https://36kr.com/p/3908027308823684?f=rss", "summary": "<p>从消费市场到工业赛道，一片“红海”的无人机市场早已挤满各路玩家，但仍有一块细分领域，即便行业头部厂商也鲜有布局——林下场景。</p>\n  <p>林下场景蕴藏的产业需求体量惊人：根据国家林草局数据，2025年我国森林蓄积量达209.88亿立方米，全国木材产量达1.4亿立方米；联合国粮农组织数据显示，全球圆木年采伐量约40亿立方米，这背后是伐区蓄积量核算、树木胸径测量等大量工作。</p>\n  <p>林下环境复杂，传统人工作业模式成本大、效率低且危险重重。虽然行业对自动化替代方案的呼声已久，但林下环境作为经典的拒止环境，使传统自动化方案始终难以落地。</p>\n  <p>林下被树木遮蔽，使导航设备很容易因GNSS信号丢失无法定位，通讯信号强衰减会导致远程图传和人工操控无法实时、连贯进行。传统SLAM技术也无法处理树枝随风轻微摆动这样时刻微变化的环境复杂纹理。</p>\n  <p>“只有构建一种可端侧离线运行的实时高精度空间感知和随动控制的具身智能方案，才能有效解决林下‘全拒止’环境的作业需求。”网格智算市场负责人钱敏表示。</p>\n  <p><strong>网格智算成立于2025年，致力于利用其自研的“网格域学习技术”形成高精度的空间理解，并由模型自生成最优控制函数，从而实现复杂避障等有效控制能力。基于此推出的适配多种硬件设备的智能化底座“GridAI大脑”，首次实现无人机在林下无GNSS自主飞行、毫米级测径、自动避障等能力，目前产品已实现小批量商业化交付。</strong></p>\n  <p>网格智算首席科学家代豪拥有三十多年技术积累，于1996年首创异构架构结合高性能计算的算法体系，被特聘为国家高性能计算工程技术研究中心研究员。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_219e0aa234d44779b677454a68e02e85@5688585_oswg1125227oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网格智算无人机</p>\n  <h2><strong>1.以网格域学习机制，实现微数据、小算力的空间理解能力</strong></h2>\n  <p>当下主流的无人机智能方案大多基于深度学习框架，通过采集海量图片等数据并进行人工标注训练模型，依靠二维静态像素特征识别物体。但林下环境动态多变，光照明暗不定、树枝交错遮挡，同一物体变换角度、光线后像素特征完全改变，导致基于深度学习训练模型的无人机难以在其中有效识别环境并执行任务。</p>\n  <p>要解决这一问题，核心是实现载体在运动过程中若干中间状态的持续可控，也就是当物理空间发生环境变化时，载体能够快速随动并修正，这就要求载体在算法层面具备两方面能力：一是对空间变化的快速感知和与运动关键相关项的准确抓取；二是对机器载体本身的物理感知。</p>\n  <p>网格智算的解法是构建一种通过动力类型、物理尺寸达成空间位移的动态控制函数，以适应不同载体或动力方式的变化。具体来说，网格智算自研的GridAI大脑基于网格域学习机制，解析连续视频流的过程中同步保留时间、空间双重维度信息，使设备具备识别、理解真实空间的能力。例如烟火没有固定纹理和清晰形状，传统AI模型难以将其与云等物体区分开，而GridAI则可以通过判断烟雾异常于云雾的空间运动轨迹做出识别。</p>\n  <p>具体而言，网格域学习对物理世界做了三个层面的“网格化”处理：一是场景中离散的、可追踪的实体网格；二是为每个实体赋予随时间变化的属性网格，比如位置、速度、运动方向；三是定义实体之间关系的关系网格，比如确认“鸟窝在两根树杈中间”。</p>\n  <p>这种做法本质上是模仿人类认知世界的方式，不仅看像素，而且识别物体、捕捉动态、理清空间关系，通过实时捕捉空间中物体在不同时间状态下的变化，推演其运动规律并预判轨迹。搭载GridAI的无人机在划定林下作业范围后，无需提前扫描建模，即可实时构建动态空间场，自主规划路径、避开障碍，并完成测径作业，全程无需飞手介入。</p>\n  <p>由于GridAI解析的是场景底层空间结构和物体关系，这些信息并不受光线、天气干扰，因此环境鲁棒性也更强。此外，不同于深度学习训练动辄需要数万、数十万张标注图，GridAI仅需几十至数百张样本即可完成训练，整体算力需求、硬件功耗大幅降低。例如GridAI仅需学习客户提供的30张树杈上鸟窝的照片，就可以实现58张测试图误报0、漏报1、准确率达到98.3%。</p>\n  <h2><strong>2.从林下到更多场景，打造通用的智能大脑</strong></h2>\n  <p>钱敏介绍，网格智算选择先切入林业赛道是源于偶然。2025年，他们与一家‌国有林场沟通时了解到，全球林业林下测绘仍几乎依靠人工作业，有巨大的自动化替代需求，并能满足精准高效安全作业效果。“这让我们重新审视整个工业无人机行业的竞争格局。头部厂商在净空、高空飞行已经非常成熟，但林下却是尚未被填补的空白。”</p>\n  <p>目前网格智算搭载GridAI大脑的无人机已完成中国林科院技术验证，公司与中林重庆、浙江飞流等头部林业企业达成深度合作。</p>\n  <p>但是网格智算自身的定位并不只是林下作业无人机提供商。</p>\n  <p>钱敏表示，“我们的产品本质上是一个通用的智能大脑，可以通过集成在芯片智能模组上，应用于具身机器人的机械��、无人车或水下机器人，赋予这些硬件设备自主感知、理解物理空间，并进行决策和执行的能力。例如当岸基雷达在有杂波干扰定位不准时，GridAI能够将目标在视觉坐标系与雷达坐标系下进行转换并高精融合，提供抗噪声的雷视一体解决方案。”</p>\n  <p>GridAI大脑的通用性正在向更多行业拓展，例如在与北京广嘉、固高股份等合作的仓储物流领域，GridAI大脑凭借其小数据、低算力、高精度、高泛化的能力，可配合多SKU多工序的机械臂工作，覆盖场景包括但不限于货品单件拣选、打包及包裹分拣等需求。此外，公司还与深圳联通建立了战略合作伙伴关系。</p>\n  <p>未来网格智算将以GridAI大脑为纽带，联合产业链上下游，为农林业、物流仓储业等重点行业提供更为完整的智能解决方案。从视觉感知、装备自动化控制再到更多应用场景，网格智算希望打造一个跨场景通用的“智能大脑”，让机器设备真正“理解”复杂的物理世界，具有自主行动能力。</p>", "category": "tech", "published_at": "2026-07-23T10:01:57+00:00", "fetched_at": "2026-07-24T02:13:18.851816+00:00", "fingerprint": "f790c488cb71daa3"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜DeepSeek今年已增资65%；马斯克：FSD是拉动特斯拉汽车需求的核心驱动力", "url": "https://36kr.com/p/3908051015488640?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>DeepSeek今年已增资65%</strong><br />36氪获悉，据媒体报道，近日，DeepSeek创始人梁文锋一场4小时的投资人闭门会议实录在科技与创投圈刷屏，他明确表示“DeepSeek只有一条主线，即通往通用人工智能（AGI）”，相关话题引发关注。天眼查App显示，DeepSeek关联公司杭州深度求索成立于2023年7月，法定代表人为裴湉，经营范围含工程和技术研究和试验发展、软件开发、人工智能应用软件开发等，由梁文锋、宁波程恩企业管理咨询合伙企业等共同持股。变更记录显示，该公司今年发生两次增资，注册资本由1000万人民币增至约1645万人民币。</p>\n  <p><strong>淡马锡旗下凯德投资与丰树合并谈判据悉陷入停滞</strong></p>\n  <p>7月23日，据报道，由淡马锡控股支持的两大房地产资产管理公司——凯德投资与丰树投资的合并谈判已陷入停滞，双方在估值等问题上存在分歧。双方经过数月讨论后已放缓推进潜在合并交易，其他分歧还包括合并后公司管理层安排、人员调整方案以及部分业务表现疲弱等问题。不过，双方未来仍可能恢复谈判。（界面）</p>\n  <p><strong>阿里云：真武芯片超节点已成功适配Qwen3.8，上线百炼提供推理服务</strong></p>\n  <p>36氪获悉，7月23日，阿里真武M890超节点已成功适配Qwen3.8，并上线阿里云百炼平台提供模型推理服务，这是国内首个成功运行超2万亿参数大模型的超节点。</p>\n  <p><strong>雀巢上半年销售额431亿瑞士法郎</strong></p>\n  <p>36氪获悉，雀巢集团正式发布2026年上半年业绩财报。上半年，雀巢集团实现销售额431亿瑞士法郎，实际内部增长率达到1.5%，净利润为35亿瑞士法郎，基本每股收益（EPS）为1.35瑞士法郎。自由现金流为34亿瑞士法郎。</p>\n  <p><strong>美的等入股钧舵机器人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，苏州钧舵机器人有限公司发生工商变更，新增美的投资有限公司、美科智臻（苏州）创业投资合伙企业（有限合伙）等为股东，同时，注册资本由约1075.2万人民币增至约1235.4万人民币。该公司成立于2018年1月，法定代表人为介党阳，经营范围包括机器人及自动化设备的研发、制造、销售、安装、租赁、维修等，现由介党阳、董艳及上述新增股东等共同持股。</p>\n  <p><strong>字节跳动在中卫成立新科技公司，注册资本22亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，中卫塞上鸣沙科技有限公司成立，法定代表人为田凯，注册资本22亿人民币，经营范围包括信息技术咨询服务、软件开发、信息系统集成服务、计算机软硬件及辅助设备零售等。股东信息显示，该公司由北京字跳网络技术有限公司全资持股。</p>\n  <p><strong>阅文推出文创AI智能体“Buddy系列”</strong></p>\n  <p>36氪获悉，近日，阅文集团发布文创垂直AI智能体Buddy系列，升级作家助手NovelBuddy、漫剧助手DramaBuddy、版权助手IPBuddy三款产品，形成覆盖内容创作、IP改编、版权开发的一体化AI工具矩阵。</p>\n  <p><strong>蚂蚁集团旗下公司等入股乐享智能</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，苏州乐享智能科技有限公司近日发生工商变更，新增蚂蚁集团旗下上海云玚企业管理咨询有限公司、安徽泰运投资管理有限公司等为股东，同时，注册资本由约196.5万人民币增至约217.3万人民币。该公司成立于2024年12月，法定代表人为郭人杰，经营范围包括智能机器人的研发、人工智能应用软件开发等，现由郭人杰、苏州凌码科技合伙企业及上述新增股东等共同持股。</p>\n  <h2>投融资：</h2>\n  <p><strong>“领铄智能”获千万级A轮追加投资</strong></p>\n  <p>36氪获悉，“领铄智能”宣布完成A轮追加融资，追加投资金额达千万级，由陆石投资、动平衡资本共同参与。此前，领铄智能已完成A轮融资，由中信建投资本与西安财金共同参与。</p>\n  <p><strong>“Deeplore”近日完成数千万元种子轮融资</strong></p>\n  <p>36氪获悉，水下AI自然探索科技公司“Deeplore”近日完成数千万元种子轮融资，由五源资本、顺为资本联合投资。资金将核心用于研发团队扩建与水下AI技术深耕，加速首款AI潜水面镜落地迭代，搭建水下自然探索智能平台的技术底座。</p>\n  <h2>新产品：</h2>\n  <p><strong>飞书Agent产品飞书aily升级，支持自主工作、团队共享智能体</strong></p>\n  <p>36氪获悉，7月23日，飞书内的Agent产品飞书aily全新升级。新版飞书 aily 能够在用户授权范围内，基于飞书消息、文档、日历、会议、任务和多维表格等信息开展工作，主动跟进任务，并与团队成员或其他智能体分工协作。</p>\n  <p><strong>微盟内测“微盟星元”AI原生产品</strong></p>\n  <p>36氪获悉，微盟WAI近期将改版为“微盟星元”，这将是一款面向电商零售赛道的AI原生智能经营系统。“AI原生”在微盟星元中体现为两个层面：交互层面，从传统GUI图形界面转型为LUI语言交互，商家通过自然语言对话即可开启经营；能力层面，微盟将服务数千零售品牌积累的行业Know-how拆解为标准化、可独立调用和自由组合的Skill模块，让Agent具备任务拆解和Skill调度能力，实现“对话即经营”。</p>\n  <h2>今日观点：</h2>\n  <p><strong>马斯克：FSD是拉动特斯拉汽车需求的核心驱动力</strong></p>\n  <p>美东时间周三盘后，特斯拉CEO马斯克在财报会上表示，特斯拉需求基本面依旧强劲，FSD是拉动需求的核心驱动力。“在FSD全自动驾驶获批落地的地区，选装率极高。很多客户本质是冲着FSD来买车，相当于买一套FSD附赠一台车。随着FSD在全球各国陆续获批，我们预计各地需求都会迎来类似爆发式增长，这一块前景十分乐观。”（新浪财经）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>美国证券交易委员会批准新规，纳斯达克将加速清退微型上市公司</strong></p>\n  <p>纳斯达克集团将修订上市规则，加快清退经营状况持续恶化的企业。此前监管机构持续聚焦微型市值股票交易中频发的剧烈行情波动与市场操纵指控。美国证券交易委员会（SEC）于周三批准一项新规：若纳斯达克上市公司的挂牌证券市值连续30日低于500万美元，公司股票将被立刻暂停交易并启动摘牌流程，且申诉渠道大幅收窄。这套更严苛的上市标准预计将全面冲击微型股与低价便士股市场。（新浪财经）</p>", "category": "tech", "published_at": "2026-07-23T10:09:52+00:00", "fetched_at": "2026-07-24T02:13:18.851807+00:00", "fingerprint": "852ba376231178cb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨段永平称10年内大概率不会卖泡泡玛特；中国数学家王虹、邓煜获得菲尔兹奖；宜家回应甩卖8处物业：不代表退出中国市场", "url": "https://36kr.com/p/3908881985901959?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>混元多模态理解负责人胡瀚离职创业，原团队或将聚焦世界模型</li>\n   <li>极氪回应“海外锁车”事件</li>\n   <li>客服回应滔搏暴力打折甩卖耐克库存：没有收到降价通知</li>\n   <li>哈兰德和亚马尔2.2亿欧元身价破纪录</li>\n   <li>张雪峰女儿再接手三家公司股份</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>段永平：10年内大概率不会卖泡泡玛特</strong></p>\n  <p>7月23日，段永平在社交媒体平台雪球上发表了他对近期投资操作的最新想法。雪球上有用户向知名投资人段永平提问：“阿段不会要减点泡泡玛特仓位去买马斯克的SpaceX吧？”对此，段永平回应称：</p>\n  <p>泡泡玛特我才刚开始买啊！我猜10年内大概率是不会卖的。不过，我的水果（苹果）已经比较成熟了，刚刚被call（看涨期权）走了一些，买了t-bill（美国短期国债）了。虽然现在价格比call走的价格还要低一点点，但这个价位我并不是很想买入。前几天我已经卖了一些MU（美光科技）的put（看跌期权），这几天我会卖点SpaceX、特斯拉的put，还有PLTR（帕兰提尔公司）也会卖点put。AI是不容被忽视的，努力理解中……（第一财经）</p>\n  <p><strong>王虹、邓煜两位中国数学家首获菲尔兹奖，该奖项被誉为数学领域“诺贝尔奖”</strong></p>\n  <p>当地时间7月23日早晨，2026年国际数学家大会在美国费城开幕。国际数学联盟在开幕式上正式公布第二十一届菲尔兹奖（Fields Medal）得主名单。北京大学2007级本科校友王虹、邓煜双双获奖，这是中国数学家首次在同一届菲尔兹奖中获得两枚奖章。菲尔兹奖每四年颁发一次，每次获奖者不超过四位，以奖励当年未满40岁、在数学领域做出杰出贡献的学者。这是国际数学界最高荣誉之一，被称为“数学界的诺贝尔奖”。（人民日报）</p>\n  <p><strong>宜家回应甩卖8处物业：不代表退出中国市场</strong></p>\n  <p>日前，仲量联行官微透露，宜家母公司英格卡集团委托其独家代理销售8处国内自持商业资产，涉产权面积49.8万平方米。这也是宜家进入中国市场近30年来最大规模的自持资产集中处置。宜家对此回应称，近期已委托专业机构，对中国市场部分已停运商场的自持物业开展后续处置工作。记者从宜家相关人士处了解到，宜家正从四大方向推进资本腾挪：优化大店布局、扩张小型门店、发展局部家装业务、推动荟聚商场引入本土资本。这一系列调整是适配中国存量房时代与商业地产下行周期的选择，并不代表退出中国市场。（21世纪经济报道）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>混元多模态理解负责人胡瀚离职创业，原团队或将聚焦世界模型</strong></p>\n  <p>36氪独家获悉，近期，腾讯混元多模态理解负责人胡瀚提出了离职。2025年初加入腾讯后，负责视觉大模型的研究。在后续的调整中，他加入大语言模型部旗下的“Frontier”前沿技术研究组，负责多模态理解的相关研究，汇报给姚顺雨。据了解，胡瀚还曾承担世界模型的研发工作。腾讯大语言模型部负责人姚顺雨近期正在密集梳理旗下团队，胡瀚此前所在的研究组或将聚焦世界模型的前沿研究。</p>\n  <p><strong>黄仁勋：市场低估了中国模型Kimi的影响力，就像此前低估了DeepSeek</strong></p>\n  <p>近日，英伟达创始人、CEO黄仁勋在接受节目采访时，被问及美国该如何应对来自中国AI产业的竞争，黄仁勋表示，“中国模型非常出色”，市场低估了开源模型Kimi带来的影响力，就像此前低估了DeepSeek一样。（界面新闻）</p>\n  <p><strong>SpaceXAI筹划在得克萨斯州大规模扩建数据中心</strong></p>\n  <p>三名知情人士透露，埃隆・马斯克旗下人工智能业务主体SpaceXAI正在筹备，计划在得克萨斯州至少新建一座大型数据中心。本次扩建将大幅扩充SpaceX在田纳西州孟菲斯现有算力枢纽之外的AI计算资源。两名知情人士表示，近几个月SpaceXAI已经在得州考察多处潜在地块，并探讨了多种建设方案：既可以全新征地建设，也可改造现有仓库兴建数据中心，模式与SpaceXAI改造旧厂房打造孟菲斯首座数据中心如出一辙。（新浪财经）</p>\n  <p><strong>飞书Agent产品飞书aily升级，支持自主工作、团队共享智能体</strong></p>\n  <p>36氪获悉，7月23日，飞书内的Agent产品飞书aily全新升级。新版飞书 aily 能够在用户授权范围内，基于飞书消息、文档、日历、会议、任务和多维表格等信息开展工作，主动跟进任务，并与团队成员或其他智能体分工协作。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>曝保时捷拟再裁员5000人，并有可能开启降薪</strong></p>\n  <p>据悉在新一轮产品攻势到来之前，保时捷正试图通过削减成本改善财务状况。除了前任CEO奥博穆（Oliver Blume）任内已宣布裁减 3900 个岗位外，未来几年公司还可能进一步裁员。德国商业媒体《Automobilwoche》援引接近保时捷总部祖文豪森（Zuffenhausen）的消息人士称，现任CEO迈克尔 · 莱特斯（Michael Leiters）本周早些时候向监事会提交了未来发展战略，提议额外裁员约5000人。如果这一计划实施，保时捷累计裁员人数将达到约9000人。作为参考，该公司员工总数已从 2024年的42615人减少至去年的41780人。除了进一步裁员外，保时捷还有可能下调员工薪资。作为交换，公司计划向留任员工提供至 2035 年的就业保障，这意味着在 2035 年之前，公司不会再因经营原因进行裁员。（IT之家）</p>\n  <p><strong>证监会：更大力度推动上市公司规范治理持续释放并购重组活力</strong></p>\n  <p>金十数据7月23日讯，中国证监会召开党的建设暨监管工作座谈会，会议强调，扶优限劣促进上市公司做优做强。进一步夯实财务造假综合惩防体系，更大力度推动上市公司规范治理，持续释放并购重组活力，推出更多典型案例。分层分类推动行业机构高质量发展。健全证券公司“1+N+X”监管制度体系，加快落实推动基金公司规范发展的一揽子措施，尽快出台期货公司监管办法，大力促进私募基金规范健康发展。防微杜渐守牢重点领域风险底线。坚决维护资本市场金融基础设施安全稳定，着力防范化解融资平台、房地产相关债券违约风险。七是稳妥有序深化资本市场双向开放，进一步加强跨境监管合作。（金十数据APP）</p>\n  <p><strong>极氪回应“海外锁车”事件</strong></p>\n  <p>近日，河南一位极氪车主在跨境自驾时，车辆因长期处于海外定位状态，车机弹出强制提示界面、智能功能暂时受限，相关话题引发市场对新能源汽车远程风控机制的广泛关注。针对“海外锁车”风波，7月23日，极氪方面向记者回应称：“经核实，该车辆因定位显示在海外区域，触发了车机内置的安全保护机制。系统将先行弹窗提醒；若定位状态持续无变化，车机界面会进一步出现强提示画面。”极氪方面表示：该机制为行业内普遍采用的防盗防损措施，旨在保障车主财产安全，同时符合各国法规要求及车辆进出口管理秩序，可有效防范因走私、盗抢等导致的车辆安全风险。（第一财经）</p>\n  <p><strong>腾讯317万年终奖员工因泄密被辞退：打入黑名单，永不录用</strong></p>\n  <p>日前，腾讯发布内部通报，WXG（微信事业群）某项目组负责人叶某因泄露公司敏感信息，被公司辞退并列入黑名单，永不录用。据了解，此次事件起源于此前一张刷屏全网的年终收入截图。截图显示，叶某年末激励由现金与股票两部分组成，总额接近320万元，其中现金奖金82万余元，股票激励235万余元。随后，有网友发现截图自带腾讯内部水印，随即引发薪资泄密争议。风波发酵后，叶某的内部会议日程被迅速清空，业内当时便猜测，薪资泄密已触发腾讯违规预警。（鞭牛士）</p>\n  <p><strong>马斯克官宣将用AI制作电影《奥德赛》</strong></p>\n  <p>近日，埃隆·马斯克在X上回复网友时表示，他准备用自家AI视频生成工具GrokImagine在2026年底前制作一部完整的古希腊史诗《奥德赛》题材长篇电影。马斯克表示，这部电影将“符合史实，并忠于荷马的艺术作品”。他同时还转发了一段由AI生成的视频，展示了多个受《奥德赛》启发的场景。不过，马斯克并未公布该项目的具体制作方式、影片时长等信息，也没有说明GrokImagine将如何在长篇电影中维持人物形象、剧情发展以及视觉风格的一致性。（IT之家）</p>\n  <p><strong>梁文锋在投资人闭门会内容曝光</strong></p>\n  <p>近日，DeepSeek创始人梁文锋在一场长达四小时的投资人闭门会议上的言论经多方渠道流出。</p>\n  <p>记者从多方信息源了解到，梁文锋在会上系统阐述了DeepSeek的战略取舍：不做3D、视频生成与世界模型，不追求用户量，也无意成为下一个超级App，全部资源集中于通往AGI的技术主线。此外，梁文锋还首次披露了公司下一阶段的技术路线图——继思维链（CoT）、Agent之后，DeepSeek将重点攻坚模型的“持续学习”能力。（21世纪经济报道）</p>\n  <p><strong>客服回应滔搏暴力打折甩卖耐克库存：没有收到降价通知</strong></p>\n  <p>7月23日，“滔搏暴力打折甩卖耐克库存”话题登上热搜。据橙柿财经，深耕球鞋行业20年的资深买手店主吴征认为，这应该是滔搏开始着手清库存了。业内人士预计，滔搏手上有大量耐克的线上库存，在接下来的五个多月里，市场预期滔搏后续或逐步加大库存促销力度，未来几个月内过季库存可能出现更低折扣。但有不少网友在社媒评论称，滔搏大多数耐克鞋并没有打折优惠，价格还是和以前一样。据中新经纬，滔搏店铺耐克男子跑步鞋ZOOM FLY 6打6折卖599.4元，但在耐克官方旗舰店叠加各类券后也仅售579.65元。23日，滔搏多个线上官方旗舰店客服均回应称，没有接到相关降价通知。“有时候直播间可能有券，会便宜一点。”（界面新闻）</p>\n  <p><strong>谷歌：持有SpaceX股份价值为940亿美元，其中约800亿美元受短期禁售协议约束</strong></p>\n  <p>谷歌表示，在SpaceX完成首次公开募股（IPO）后，其持有的SpaceX股份价值为940亿美元，其中约800亿美元部分受短期禁售协议约束。（财联社）</p>\n  <p><strong>哈兰德和亚马尔2.2亿欧元身价破纪录</strong></p>\n  <p>7月23日消息，德国转会市场网站（简称“德转”）更新的最新部分球员身价显示，亚马尔和哈兰德的身价均涨至2.2亿欧元，打破球员身价历史纪录。在本次更新之前，哈兰德和亚马尔的德转身价均为2亿欧元，这也是此前的德转历史球员身价纪录，在本次更新后，两人双双刷新了这一纪录。此外，姆巴佩身价也上涨2000万欧元，达到了2亿欧元；贝林厄姆身价涨幅最为显著，本轮涨幅达到3000万欧元，目前最新身价为1.6亿欧元。（界面新闻）</p>\n  <p><strong>苹果准备全面升级Mac产品线</strong></p>\n  <p>当地时间7月22日，科技记者马克·古尔曼发文称，苹果公司正准备对Mac产品线进行全面升级，希望借助人工智能热潮所推动的对高性能笔记本电脑和台式机的需求。据悉，苹果计划从今年秋季至明年陆续推出旗下所有Mac产品的新版本，包括备受期待的台式电脑更新、多款笔记本电脑，以及新款MacBook Pro。苹果将率先推出更新后的入门级14英寸MacBook Pro，该机型将成为首批搭载全新M6芯片的Mac产品之一，苹果还将发布两年来首款新版iMac。（界面新闻）</p>\n  <p><strong>多款高端手机涨价超1000元</strong></p>\n  <p>存储芯片缺货导致的手机涨价潮已蔓延至高端产品市场。7月23日，据央视财经报道，在暑期消费旺季，主流厂商旗下多款新机及在售机型价格上调，涨幅普遍在300元至1000元不等，部分高端机型涨幅甚至突破千元。品牌门店正依托“以旧换新”国家补贴等政策，降低购机门槛。安卓国产高端阵营是本轮涨价幅度最突出的板块，vivo、OPPO、荣耀等多款大存储旗舰、折叠屏调价幅度全部跨过千元门槛。其中，vivo旗下iQOO 15、iQOO 15 Ultra全系涨价，标准版单轮涨价400-1000元，iQOO 15标准版的顶配16GB+1TB版本对比首发价累计上涨1500元。（央视财经��</p>\n  <p><strong>张雪峰女儿再接手三家公司股份</strong></p>\n  <p>天眼查App显示，近日，张雪峰（张子彪）名下苏州峰学蔚来教育科技有限公司、苏州峰阅万卷文化图书有限公司、苏州峰峰火火闯九州旅行社有限责任公司发生工商变更，张雪峰均退出上述公司股东，卸任法定代表人及执行董事职务，同时新增刘巧丽、张雪峰女儿张姩菡为股东。此外，苏州峰学蔚来教育科技有限公司、苏州峰阅万卷文化图书有限公司新增张雪峰妻子李丽婧任董事职务。（界面新闻）</p>\n  <p><strong>优步科技裁减10%的客服岗位，理由是“拥抱”人工智能</strong></p>\n  <p>优步科技公司表示，作为精简人员架构、全面拥抱人工智能整体战略的一环，公司已裁撤客服业务10%的岗位。优步一名发言人通过邮件透露，公司于周三公布了社区运营团队的裁员计划，称此次调整旨在“简化运营流程、强化线下协作，并持续推进人工智能落地应用”。该发言人补充，按照公司全员返岗办公要求，该团队原远程办公员工也需前往线下中心办公室履职。（新浪财经）</p>\n  <p><strong>中国脑机接口迎重要突破：全球范围内首次实现跨地域上千人同步脑电信号采集</strong></p>\n  <p>7月22日下午，中国科研团队发布一款新型脑电信号采集装置，在全球范围内首次实现跨地域上千人同步脑电信号采集，使得神经大模型训练与脑机接口通用技术研发迈出关键一步。研发团队介绍，实现千人级跨地域同步采集，核心攻克了两大技术难关：一是在设备小型化的同时保障信号采集精度，二是克服网络延迟影响，实现多设备、多地域间的毫秒级时间精准对齐，确保不同脑电信号可以统一分析。未来，规模化脑电采集技术将持续沉淀数据，用于训练神经基础模型。这也意味着，AI的学习素材将不再局限于文字、图片、视频等间接信息，而是可以直接通过神经信号理解人类的认知状态。（央视财经）</p>\n  <p><strong>BBA多款车型集体大降价</strong></p>\n  <p>今年以来，奔驰、宝马、奥迪在中国市场集中下调官方指导价，或加大终端优惠力度。第一财经记者近日实地走访深圳多家豪华品牌4S店，主力车型终端优惠普遍在9万至13万元，部分车型的实际成交价较早年落地价低了近20万元。但多位经销商和一线销售表示，卖车环节已经没有利润，门店经营目前依靠售后业务支撑。价格上，奥迪让利最为激进，Q6综合优惠高达13万元，早年落地价在50万元上下的车型，目前裸车33万多就能拿下；奔驰GLB优惠10万元左右，C级优惠9万元。宝马的一家门店正在清仓iX1的最后一批库存车，全款18万元出头，走按揭方案可以低至17万多。（第一财经）</p>\n  <p><strong>特朗普：通胀降归功自己，物价高归咎前任</strong></p>\n  <p>美国总统特朗普7月22日在佐治亚州出席一场活动时表示，最新数据显示美国通胀降幅创6年多来最大纪录，证明其政府“把国家治理好了”。特朗普同时强调，此前的高通胀与他“毫无关系”，并将责任归咎于前任政府，称自己2025年就职时面对的是多年来最高的通胀水平。（界面新闻）</p>\n  <p><strong>亚马逊裁撤通用人工智能部门岗位</strong></p>\n  <p>亚马逊对旗下通用人工智能（AGI）相关部门实施裁员。公司并未披露本次裁员具体人数。亚马逊在声明中表示，公司将进一步聚焦核心方向，这意味着 “需要做出一些艰难抉择，裁撤通用人工智能部门部分岗位”；同时企业仍持续布局对用户长远发展至关重要的业务领域。（新浪财经）</p>\n  <p><strong>Anthropic酝酿特殊方案，拟在上市后安排员工出售所持股票</strong></p>\n  <p>两名知情人士透露，随着 Anthropic 筹备上市，公司正考虑一项十分罕见的举措：要求普通员工按照固定交易时间表出售股票，以此规避内幕交易相关法律风险。一名知情人士表示，Anthropic考量该方案，目的是企业上市后，继续维持内部信息自由流通的企业文化。Anthropic 管理层与外部顾问针对强制推行该交易计划的磋商仍存在变数，目前尚无法确认公司是否已经作出最终决定。（新浪财经）</p>\n  <p><strong>美股三大指数集体收跌，特斯拉大跌超14%</strong></p>\n  <p>36氪获悉，7月23日收盘，美股三大指数集体下跌，纳指跌2.15%，标普500指数跌1.21%，道指跌0.97%。大型科技股普跌，特斯拉大跌超14%，创2025年3月11日以来最大单日跌幅；谷歌跌超7%，亚马逊跌超4%，Meta跌超3%，英特尔、微软跌超2%，苹果、英伟达跌超1%。热门中概股集体走弱，阿里巴巴、爱奇艺跌超2%，哔哩哔哩跌超1%，京东、拼多多、百度、网易、小鹏集团、蔚来小幅下跌，理想汽车涨超2%。</p>\n  <p><strong>鸡蛋价格继续上涨</strong></p>\n  <p>7月22日，界面新闻记者了解到，北京新发地批发市场的鸡蛋平均价格已超过5元/斤。在电商平台，精品鸡蛋的终端零售价则来到了6-7元/斤。7月22日北京鸡蛋平均批发价每斤超5元/图片来源：北京新发地批发市场不仅是北京，全国多地已出现鸡蛋价格上涨情况。《德州晚报》报道称，该地区菜市场“五一”期间3.6元/斤的鸡蛋，在7月21日已经涨到了4.9元/斤。数据显示，山东省鸡蛋本周销售均价为9.49元/公斤，同比上涨60.85%。农业农村部最新监测数据也显示出鸡蛋价格明显上涨，2026年第29周（7月13日至19日），鸡蛋批发市场周均价每公斤9.93元，环比涨4.1%，同比高42.3%。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>长鑫科技：公司股票将于2026年7月27日在科创板上市</strong></p>\n  <p>7月23日，长鑫科技发布首次公开发行股票科创板上市公告书提示性公告，经上海证券交易所审核同意，<strong>长鑫科技集团股份有限公司发行的人民币普通股股票将于2026年7月27日在上海证券交易所科创板上市，</strong>股票代码为688825。</p>\n  <p><strong>公司提醒</strong>广大投资者注意首次公开发行股票上市初期的投资风险，理性参与新股交易。（央视财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>Alphabet第二季度营收1198亿美元，同比增长24%</strong></p>\n  <p>Alphabet第二季度营收1198亿美元，同比增长24%；预估1,170.2亿美元。第二季度经营利润407.7亿美元，预估405.5亿美元；第二季度资本支出449.2亿美元，预估441.5亿美元；第二季度谷歌云收入247.7亿美元，预估224.6亿美元；第二季度谷歌服务收入945.4亿美元，预估943.2亿美元。（财联社）</p>\n  <p><strong>雀巢上半年销售额431亿瑞士法郎</strong></p>\n  <p>36氪获悉，雀巢集团正式发布2026年上半年业绩财报。上半年，雀巢集团实现销售额431亿瑞士法郎，实际内部增长率达到1.5%，净利润为35亿瑞士法郎，基本每股收益（EPS）为1.35瑞士法郎。自由现金流为34亿瑞士法郎。</p>\n  <p><strong>诺基亚二季度净销售额增长9%</strong></p>\n  <p>诺基亚7月23日公布二季度财报显示，当季实现销售净额48.2亿欧元，按固定汇率计算同比增长9%（按报告汇率增长8%），基本符合市场预期的48.3亿欧元。第二季度调整后营业利润达4.34亿欧元，高于预估的3.723亿欧元；调整后运营利润率为9%。经调整毛利率扩张至46%；调整后每股收益（EPS）为0.070欧元。公司将全年调整后营业利润指引由之前的20亿至25亿欧元上调/微调至21亿至26亿欧元。（界面新闻）</p>\n  <p><strong>道达尔能源二季度调整后净利润60.3亿美元</strong></p>\n  <p>道达尔能源7月23日公布2026财年第二季度财报显示，当季实现营收571.0亿美元，调整后净利润达60.3亿美元，同比大幅增长68%。受油价上涨及新项目推动，当季平均油气产量达240万桶油当量/日；调整后每股收益为2.68美元；调整后息税折旧及摊销前利润（EBITDA）为131.8亿美元；营业现金流达108.6亿美元。展望未来，道达尔能源预计2026年第三季度液化天然气平均售价将超过11.5美元/百万英热单位，并确认2026全年净投资计划维持在150亿美元不变。（界面新闻）</p>\n  <h2>投融资</h2>\n  <p><strong>“智象未来”完成C轮融资</strong></p>\n  <p>36氪获悉，近日，“智象未来”（HiDream.ai）宣布完成15亿元人民币的C轮融资。本轮融资由社保基金四川振兴科创基金、工银资本、弘颐资管、敦鸿资本联合领投，厦门国贸资本、上影新视野基金、湖北长江产业投资集团、华策影视、航源资本、创云海资本、华福投资、余杭金控股份、交银资本、若松基金等多家机构跟投。老股东合肥产投、东方富海、金浦投资、金华金投、中哲创、财鑫资本持续加注。至此，智象近三个月内已完成三轮融资，累计融资超过21亿元人民币。</p>\n  <p><strong>市场消息：灵初智能正以14.8亿美元的估值融资近1亿美元</strong></p>\n  <p>市场消息：灵初智能正以14.8亿美元的估值融资近1亿美元，该公司接近完成由奇瑞领投的一轮融资，其他投资者还包括蓝思科技。（新浪财经）</p>\n  <p><strong>“设序科技”正式完成B轮超亿元融资</strong></p>\n  <p>36氪获悉，工业AI设计研发解决方案供应商“设序科技”于近日正式完成B轮超亿元融资，累计获超3亿元融资，投资方包括深产投、合鼎共及老股东涌铧投资等。融资将用于市场开拓（含出海）及核心模型技术研发。</p>\n  <p><strong>“Deeplore”近日完成数千万元种子轮融资</strong></p>\n  <p>36氪获悉，水下AI自然探索科技公司“Deeplore”近日完成数千万元种子轮融资，由五源资本、顺为资本联合投资。资金将核心用于研发团队扩建与水下AI技术深耕，加速首款AI潜水面镜落地迭代，搭建水下自然探索智能平台的技术底座。</p>\n  <p><stron ps://github.com/marcelroed/gigatoken/", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-07-23T02:22:04.668934+00:00", "fingerprint": "520cf72deab7b47a"}, {"source": "Hacker News Front Page", "title": "Run large language models at home, BitTorrent‑style", "url": "https://petals.dev/", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-07-23T02:22:04.668802+00:00", "fingerprint": "b0322daadf3166cf"}, {"source": "Hacker News Front Page", "title": "Quality non-fiction books are the antithesis of AI slop", "url": "https://resobscura.substack.com/p/quality-non-fiction-books-are-the", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-07-23T02:22:04.668639+00:00", "fingerprint": "112f311453d967c9"}, {"source": "Hacker News Front Page", "title": "Terrence Tao's ChatGPT Conversation about the Jacobian Conjecture Counterexample", "url": "https://chatgpt.com/share/6a5fdc7a-d6f8-83e8-bbea-8deb42cfed56", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-07-23T02:22:04.668494+00:00", "fingerprint": "3c187b67b93c0758"}, {"source": "Hacker News Front Page", "title": "Codeberg Bans Cryptocurrency Projects", "url": "https://codeberg.org/Codeberg/org/pulls/1254", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-07-23T02:22:04.668340+00:00", "fingerprint": "42e2fd765cf29f54"}, {"source": "The Verge", "title": "Price-hiked iPads are a little cheaper right now", "url": "https://www.theverge.com/gadgets/969003/apple-ipad-air-pro-airtag-deal-sale", "summary": "A number of Apple products got more expensive last month, so we’re happy to find deals wherever and whenever we can. If you’re searching for a high-end iPad, one of the more notable deals currently happening is on the 13-inch iPad Pro M5 with 512GB of storage. Normally $1,699, it’s $150 off at Amazon, costing [&#8230;]", "category": "tech", "published_at": "2026-07-22T19:14:31+00:00", "fetched_at": "2026-07-23T02:22:04.477360+00:00", "fingerprint": "a0fbc83d6a5e1e24"}, {"source": "The Verge", "title": "Tesla’s revenues are bouncing back, but profits are still weak", "url": "https://www.theverge.com/transportation/969311/tesla-q2-2026-earnings-revenue-profit-sales", "summary": "After a dismal two years of weakening demand, falling sales, and damage to its brand by Elon Musk's political activities, Tesla's road to recovery continues apace. On the heels of an impressive delivery report, the company released its earnings for the second quarter of 2026 - giving us the latest glimpse at the EV company [&#8230;]", "category": "tech", "published_at": "2026-07-22T20:17:46+00:00", "fetched_at": "2026-07-23T02:22:04.477354+00:00", "fingerprint": "4e23eb42d0d6ce29"}, {"source": "The Verge", "title": "Meta won’t have to face the next planned social media addiction trial", "url": "https://www.theverge.com/policy/969644/meta-social-media-addiction-trial-dropped", "summary": "Less than a week before Meta's lawyers were set to return to a Los Angeles courtroom, the plaintiff accusing the platform of inflicting harm dropped the case. Brought by 15-year-old Florida plaintiff going by initials R.K.C., the case was set to be the second in a set of bellwether trials meant to test legal arguments [&#8230;]", "category": "tech", "published_at": "2026-07-22T22:03:53+00:00", "fetched_at": "2026-07-23T02:22:04.477348+00:00", "fingerprint": "9581e976ba1fd2b3"}, {"source": "The Verge", "title": "Lego’s Donkey Kong arcade machine lets Mario jump endless barrels — Miyamoto is reportedly happy", "url": "https://www.theverge.com/gadgets/969668/lego-donkey-kong-arcade-machine", "summary": "Carl Merriam has designed some of my favorite nostalgia-inducing Lego sets, including the Lego Nintendo Game Boy and Piranha Plant. He's assisted on the incredible Lion Knights' Castle, Galaxy Explorer, and Pirates of Barracuda Bay. Now, he's helped the company create a $200 Donkey Kong arcade machine set that managed to win even Mario creator [&#8230;]", "category": "tech", "published_at": "2026-07-23T00:30:00+00:00", "fetched_at": "2026-07-23T02:22:04.477337+00:00", "fingerprint": "3ef16eb2142ead59"}, {"source": "36氪 - 最新文章", "title": "这届世界杯花钱最狠的人，不懂球丨2026世界杯消费报告", "url": "https://36kr.com/p/3906526848144515?f=rss", "summary": "<p><strong>随着加时赛那粒制胜进球的落下，西班牙时隔16年再次举起大力神杯</strong>，这场横跨美加墨三国、48支球队的世界杯终于尘埃落定。</p>\n  <p>这届世界杯从来不缺爆冷、争议和绝少，但比球场更热闹的，是年轻人的钱包。</p>\n  <p>深夜外卖订单暴涨？联名盲盒开售秒空？球迷酒吧一座难求？<strong>在这一个来月的世界杯比赛期间，年轻人们究竟为了「这场球」豪掷出多少钱？</strong></p>\n  <p>如今赛场的喧嚣散去，翻看这段时间的消费记录，才发现今年看球的画风有些变了。针对这届世界杯年轻人的观赛与消费选择，「后浪研究所」发起了一项世界杯消费小调查，共回收510份有效问卷。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_3a28d7b858854517b7772884ca2aa38e@6385117_oswg17358oswg945oswg771_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_91358dc85e2045ebb0f47c8289314845@6385117_oswg7340oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>你对世界杯的印象，是不是还停留在定好闹钟熬大夜、在屏幕前从头蹲到尾，但放到今年的美加墨，年轻人的观赛姿势已经有了一些改变。</p>\n  <p>调查结果显示，依然有接近3成年轻人「定时看直播」，还有21.6%的人「找时间看回放」，<strong>但「刷短视频看赛事集锦」已经以36.7%的优势占据了榜首，成为最主流的参与方式。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_89aa34baf7fb41f389047ddf1f024ac8@6385117_oswg59509oswg801oswg779_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>即使是像世界杯这样的赛事，<strong>年轻人的注意力也难免开始从「长直播」转向了「短内容」。</strong>与其熬到半夜看完整场，不如第二天花3分钟刷完所有进球，高效、省时、以及对于咱们年轻牛马最重要的：不耽误上班。</p>\n  <p>「看世界杯」的定义正在被重新书写，看完全场才算看球？不存在的，3分钟刷完集锦就算深度参与了。</p>\n  <p>另外值得一提的是，<strong>在参与方式中选择「其他」这一栏的受访者，绝大多数写的都是「买彩票」。</strong>没什么比「花两块钱支持自己喜欢的球队」更能体现参与感的了——输了就当买个乐子，赢了就是双倍的乐子。</p>\n  <p>参与方式的变化反映了年轻人的注意力习惯，那「在哪看」这件事，则暴露了如今年轻人的观赛场景偏好——在哪都没有在家好。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_146bccf0556442de8d4940176b64770f@6385117_oswg80591oswg801oswg1027_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>独自在家/宿舍看比赛（67%）以断崖式优势排第一，其次是和朋友在家/宿舍聚会看比赛（41.5%），<strong>而在今年世界杯期间，前往过酒吧、洗浴、大屏观赛区等线下场所的，只有2成人出头。</strong></p>\n  <p>如果多数人眼中的世界杯「第一观赛现场」是家里，<strong>那么第二第三，就分别是工位和上班路上</strong>：「办公室摸鱼刷短视频/资讯」和「通勤路上刷短视频/资讯」以37.2%和30.9%的被选择率榜上有名。这届年轻人最真实的观赛日常，就藏在这些碎片时间里。</p>\n  <p>数据背后其实还有一项客观因素，今年的美加墨世界杯大量比赛在上午开球，谁不想名正言顺地「带薪看球」呢？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_b7886e5086054a779d7a9540972d201b@6385117_oswg8453oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>聊「世界杯消费」，先来看一个最简单的问题：花了多少？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_bbd44747fd6a4327a001ade3e8757aa6@6385117_oswg60268oswg802oswg745_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>在这次的调查中，<strong>总消费金额最集中的区间是200-300元，占比高达36.2%。</strong>再往上，开销在1000元、3000元档位的人不算少，分别占到14.9%和17%，可能是升级了音响、投影仪这类观赛装备，属于进阶版消费者。</p>\n  <p>还有7.5%的「为爱发电、不设上限」的重度消费者，总花费在3000元以上。</p>\n  <p><strong>可以看出，300元算是一个分水岭，接近半数年轻人的开销都控制在这以内</strong>：大概是七八顿观赛夜宵、两三箱啤酒，或一两个喜欢的联名周边。花300元买一个夏天的参与感，既能凑齐满满的仪式感，又不会带来经济负担。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_43a46d5ff3154201ad0eb6da8f662fb4@6385117_oswg91982oswg801oswg800_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>再进一步，看看大家口袋里的钱都花在哪儿了？调查数据显示，<strong>「吃」才是年轻人的第一生产力，夜宵、啤酒、小龙虾这类「观赛场景消费」以绝对优势排第一。</strong>看球时可以看不懂越位，但嘴上一定不能闲着。</p>\n  <p>其次则分别是「IP类消费」和「竞猜类消费」，占比都在3成以上。而传统认知中世界杯消费的「主力军」：服饰穿搭（23.2%）、线下场景消费（19.2%），反而排在了后面。</p>\n  <p>尽管「宠物相关消费」在调查中排名垫底，但据琥珀消研社报道，今年FIFA首次开放了宠物IP授权后，官方宠物国家队球衣在TikTok美区的销量同比暴涨1772%。义乌商家们也嗅到了商机，<strong>批发价十几元的宠物球衣，有安徽宿州的宠物服装厂卖出近30万件，阿根廷蓝白条纹款占了3成销量。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_678e93a91d4a481aad54ca0d9aef3f22@6385117_oswg52919oswg801oswg559_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>区分开男女来看「消费最高」的品类，<strong>男人们和女人们的钱流向了完全不同的方向。</strong></p>\n  <p>「吃」和「彩票」是男人最快乐、简单、无需解释的选择，女人们花钱最多的领域则偏向情绪与审美：LABUBU联名盲盒、大力神杯冰箱贴……才是她们更愿意掏钱的东西。</p>\n  <p>而「服饰穿搭」同时进入了男性和女性的Top3，不过区别可能在于：<strong>男人买来穿着观赛，女人买来时尚搭配，不同的球衣打开方式，背后相同的都是「悦己消费」。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_71b0d84fe23f4af1a88c52a800198bfd@6385117_oswg9059oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>从前面的调查数据可以看出，「线下观赛降温」是这届世界杯的明显趋势。相比过去酒吧、球迷餐吧一座难求的热闹，<strong>年轻人不为线下观赛场所买单了吗？</strong></p>\n  <p>「后浪研究所」根据受访者给自己选择的「身份标签」，筛选出了不同球迷最倾向的观赛场景Top3。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_3812eef267884220bbe1cf7d95a894d8@6385117_oswg114557oswg802oswg935_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>「独自在家看比赛」是绝大多数人的第一选择</strong>，不用被打断、不用迁就别人，或许才是对球赛最基本的尊重。就算要社交，也更偏爱熟人小圈子的自在感：「和朋友在家聚会看球」在铁杆和氛围球迷中的被选择率都在40%上下。</p>\n  <p>三类球迷中，也只有氛围球迷还愿意把Top3的席位留给「线下观赛场所」，而且占比也只有29.4%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_d96123f83dbe4361812e630cd6c80628@6385117_oswg59296oswg801oswg675_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>我们继续追问了对观赛场景的「看重因素」，<strong>75.6%的人选择了「环境足够舒适自在」，断层领先成为所有人的核心诉求。</strong>这也意味着，沙发比酒吧更有吸引力，睡衣比出门更有竞争力，想躺就躺的自由比任何都重要。</p>\n  <p>其次则是「消费合理，价格划算」，去一次酒吧少说一两百起步，在家点外卖50块轻松搞定——当年轻人开始精打细算，「划算」就成了压过「人多热闹」的硬道理。</p>\n  <p>再加上美加墨世界杯有大量比赛在上午和清晨开球，早场赛事砍掉了酒吧最擅长的消费时段。时差、性价比、舒适感的三重夹击之下，<strong>线下观赛场景就这样从「大众狂欢」退化为「偶尔的氛围仪式」。</strong></p>\n  <p>「后浪研究所」筛选总结出了两大传统观赛场景的关键词，年轻消费者们选择场景的原因和偏好一目了然：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_182585a0384b4d2c9c6511b89342c0cc@6385117_oswg82421oswg802oswg857_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_a80441cbbc7b4b6781fbc1e4c5145d81@6385117_oswg10453oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>和4年前的卡塔尔世界杯相比，如今年轻人的钱包是更鼓了还是更瘪了？</p>\n  <p>41.5%的人「花得更多了」，36.2%人的花销「基本持平」，只有22.3%的人表示「今年花得更少了」。有接近半数年轻人都在为世界杯消费加码，但更有意思的是，<strong>把「不同球迷」拉进来一起看后能发现：「伪球迷」撑起了消费大盘。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_63d9175035454088a75c86d23739f2ff@6385117_oswg56442oswg802oswg792_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>铁杆球迷的消费变化相对稳定：有41.3%受访者的消费水平都和上一届持平，对于懂球、追求战术的年轻人来说，世界杯本就是四年一次的固定节目了。<strong>真正的变量出现在氛围+跟风球迷这样的「伪球迷」身上：51.6%的人「花得更多了」，比铁杆球迷高出整整16个百分点。</strong></p>\n  <p>看不懂战术、认不全球员，也完全不妨碍咱们为世界杯的情绪价值买单！凭氛围和兴致带动起来的「伪球迷们」，反而成了消费意愿最强的群体。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_9a8487f74b9d49108669b8a30460a7c0@6385117_oswg51329oswg802oswg610_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>除此之外，前面提到过的早场球赛，也在改变年轻人的消费时钟。上午和清晨时段的球赛带火了早餐经济。</p>\n  <p>据媒体报道，世界杯期间不少早餐店加装大屏电视，供顾客边吃早餐边看球，不少商家还推出世界杯限定早餐套餐。从这次的调查数据中也可见一斑：尽管有41.5%的人依然选择熬夜/早起看直播，<strong>但有32.4%的人已经转为了购买早餐/咖啡套餐。</strong></p>\n  <p>把所有这些碎片拼在一起，年轻人在这届世界杯的消费逻辑也逐渐清晰起来，「后浪研究所」拉出了4条核心观察：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_f82a85af5ea24a36a75c0e9377aff215@6385117_oswg93523oswg803oswg838_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>观赛场景从酒吧回归到���厅；「伪球迷」成了消费意愿更强的主力；美加墨独特时差更是打破了传统的消费时段；以及最重要的，大家不是单纯为观看赛事买单，更多是为氛围感而主动消费。</p>\n  <p>说到底，世界杯本就不是球迷群体的「圈层独嗨」，<strong>在这场全民的情绪狂欢中，能让年轻人掏出腰包的始终是「情绪溢价」。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_2c9949bfa99d48a1a55751b3a8f248e1@6385117_oswg7798oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>接下来，再用最直接、不绕弯子的方式，带你看年轻人对世界杯的消费态度：<strong>快乐、氛围感、悦己消费就是能带动消费的扛把子！</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_c0a755084ec04507b08da087fa818360@6385117_oswg62818oswg802oswg857_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>而在「后浪研究所」的调查中，还能发现一条明显的趋势，刚需和实用性同样是年轻人的重点关注对象。有26.6%的受访者在世界杯的消费浪潮中「保持清醒」，<strong>他们会为快乐买单，但前提是这笔钱本身就值得。</strong></p>\n  <p>花钱可以，但要花得值；为情绪买单可以，但为冲动买单不行！</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_f5bd14af9aad4c35aded8ac52aef7519@6385117_oswg86700oswg802oswg1441_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>「从夯到拉」锐评消费决策因素，「实用性」也是被年轻人直接给到了一个「夯爆了」。将近四成的人的第一考量都是：这玩意儿，世界杯结束了还能用吗？消费逻辑也很简单：<strong>快乐可以是一瞬间的，但花出去的钱，最好能换回一个长期陪伴的东西。</strong></p>\n  <p><strong>「氛围感」</strong>和<strong>「纪念性」</strong>则可以给到一个顶级，被选择率都在30%以上。</p>\n  <p>还有一个有趣的点是，在上一道关于消费态度的单选题中，选择「主打纪念收藏，考虑其是否有升值潜力」的人直接是0、一个人都没有。而到了决策因素的多选题时，选择「纪念性，有一定收藏价值」的人数陡升至了30.9%。</p>\n  <p>可见「纪念性」不是不重要，<strong>但如果这笔消费能带来的「只有纪念」，则会被所有人抛弃。</strong></p>\n  <p>到了鄙视链的最底端，「周围人都在买，随大流」就是「拉完了」的存在，仅有4.3%的人选择。果然，在中国追求小众是一件很大众的事，年轻人的消费字典里没有「别人买那我也买」这件事。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_7561430cbf6a491fbcc6ddc08710187e@6385117_oswg7654oswg1000oswg166_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>看完了消费者这边，最后再来看一个同样热闹非凡的赛场「品牌营销」。商家们不会放过这届史上规模最大的世界杯，国足虽然没站上赛场，但中国品牌的身影已经遍布每个角落。</p>\n  <p>处在第一梯队的，是本届世界杯的官方全球赞助商。据媒体报道，今年3月，国际足联（FIFA）宣布了世界杯所有的16个全球赞助名额。<strong>其中中国企业占据了3席：联想、蒙牛、海信，合计投入超5亿美元，约占FIFA全球赞助总收入的16%，赞助规模位列全球第二。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_a8fbd044b71646758eea7e5c6cdce437@6385117_oswg93897oswg802oswg1233_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>官方赞助之外，门槛更低、更好入局的国家队赞助赛道，也成了不少品牌的首选。</strong>据统计，4年前的卡塔尔世界杯，签约阿根廷队的中国品牌仅8家；到了2026年，阿根廷队合作品牌增至15家：库迪咖啡、慕思、泸州老窖等品牌扎堆押宝阿根廷。西班牙队合作数量也实现了翻倍，被TCL、瑞幸咖啡、华帝、伊利绑定。</p>\n  <p><strong>第三类则是偏轻量化的球星代言，成为了品牌单点破圈的武器。</strong>蒙牛签下了梅西、姆巴佩、亚马尔，王老吉旗下国际品牌签下哈兰德，追觅科技官宣C罗出任全球代言人……靠顶级球星的个人影响力，快速撬动话题热度与粉丝消费。</p>\n  <p>而像出现在开幕式上的LABUBU、和哈兰德合作推出魔性广告曲的王老吉、甚至是拿下世界杯转播权益的小红书……也都在这场全球瞩目的超级赛事中，收获了超额关注。</p>\n  <p>品牌在赞助赛场上打得火热，但更现实的问题是，这些营销动作最终能转化成多少购买力？在「后浪研究所」的调查中，年轻人给出了他们的答案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_6678e8e5d2924a5cb3fb5e0d1dc3d2f5@6385117_oswg51579oswg802oswg554_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>年轻消费者们有着相当清醒的认知，占比最多的人（35.2%）会将联名/赞助视为加分项</strong>，还有32.9%的受访者表示：比起这些标签，更看重产品本身的价格或设计。甚至有28.7%的年轻人，把自己的一票投给了「只考虑产品本身值不值」，完全不考虑联名/赞助。</p>\n  <p>而在「你觉得品牌做世界杯营销，最重要的是什么？」这个问题下，有近半数的受访者选择了「产品本身要实用/好吃/好用」。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_876ec72472ce494096a21eb2b4f27b5b@6385117_oswg59195oswg802oswg681_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>这更加印证了当下年轻人的赛事消费逻辑：再热闹的营销噱头、在吸睛的IP联名，都只是加分项；真正能让人买单的还是产品本身。<strong>LOGO露出一千次，也不如球迷们在台下咬一口</strong>，年轻一代的消费者们更愿意为「融入观赛生活」的好产品付费。</p>\n  <p>蒙牛在今年世界杯上的操作，就踩在了这个趋势上。</p>\n  <p>作为2026 FIFA世界杯官方冰淇淋，<strong>蒙牛没有止步于赛场边的品牌露出，而是把冰淇淋产品嵌入到真实消费场景中</strong>——将4款赛事专属冰淇淋，铺进比赛场馆与中国、美国商超，从看台助威到好友派对、家庭观赛，完整覆盖世界杯观赛的全时段、全场景消费需求。</p>\n  <p>在冰淇淋产品的背后，更是蒙牛「4Q」质量管理体系下，「从牧草到餐桌」的全产业链品质管控。配合「世界杯，这一口赢了」的主题，<strong>蒙牛把中国乳业的「世界品质」从场馆传递到了消费者的日常里，让这支来自中国的冰淇淋，能接住每一位球迷的情绪与味蕾。</strong></p>\n  <p>对年轻人来说，这样的品牌亮相才更有分量：不用情怀做溢价，也不拿话题搞噱头，而是用产品力，成为今夏世界杯体验里自然而然的一部分。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_3cf2a6d75223476191cf55699dd26f30@6385117_oswg283oswg459oswg45_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>这一场横跨3个国家、集结48支球队的世界杯，<strong>早已跳出体育赛事的范畴，变成一面映照当代年轻人消费与生活选择的镜子。</strong></p>\n  <p>我们看见年轻人观赛习惯的改变：不再死守完整直播，碎片化观赛、工位通勤摸鱼看集锦成更多人的选择；线下酒吧热度降温，舒适自在的客厅场景牢牢锁死C位；传统消费时段被打破，看球开始和早餐咖啡更搭配……</p>\n  <p>还有更打破固有认知的消费主力的更迭，追求氛围感的「伪球迷」，反倒比铁杆球迷更愿意为赛事加码；年轻人一边心甘情愿为短暂情绪、氛围感买单，一边又保持着足够清醒的认知，把实用性排在第一位，不盲目跟风，拒绝为华而不实的赛事溢价买单。</p>\n  <p>归根结底，世界杯从来不是资深球迷的专属狂欢。</p>\n  <p>世界杯比赛已然落幕，<strong>对年轻人而言，它是平淡生活中的情绪出口，是这个夏天里不可错过的仪式感。</strong>我们在用轻量化的观赛方式、克制理性的消费方式，享受这一代人四年一度的浪漫。</p>", "category": "tech", "published_at": "2026-07-22T09:35:15+00:00", "fetched_at": "2026-07-23T02:22:04.377660+00:00", "fingerprint": "eacb43157949c3d0"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨小红书回应IPO因前员工举报而受阻传闻：均不属实；谷歌Gemini跌出全球排名前十；耐克宣布终止滔搏线上经销权", "url": "https://36kr.com/p/3907461333144711?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>香港高院驳回宗馥莉上诉申请，维持冻结18亿美元资产</p>\n  <p>苹果拟推出月租iPhone，支持大多数机型</p>\n  <p>SpaceX做空比例飙至32%，马斯克警告空头：几无存活可能</p>\n  <p>康美药业原实控人马兴田夫妇赔付13.96亿元</p>\n  <p>宇树科技王兴兴：具身智能的“ChatGPT时刻\"有望最快在两三年内到来</p>\n  <p>越疆科技回应招股书举报风波</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>小红书回应IPO传闻</strong></p>\n  <p>近日，有较多传言称“小红书已于6月底前秘密提交IPO申请”，但因前员工举报其“上市合规”问题而受阻。7月22日，小红书方面回应界面新闻称，目前流传的IPO相关信息均不属实。（界面新闻）</p>\n  <p><strong>Gemini掉出全球前十</strong></p>\n  <p>当地时间7月21日，谷歌DeepMind发布三款轻量的新模型，主打“更快、更智能、更具成本效益”，但因智能程度没有满足外界的期待，评价两极分化。与此同时，旗舰模型Gemini 3.5 Pro依然没有露面成为此次焦点，从排行榜来看，谷歌的模型已经排在十名开外。根据评测来看，此次谷歌的新模型在智能上并不出色。AI模型评测平台Arena.ai的研究显示，Gemini 3.6 Flash 在前端代码竞技场中以1537分排名第12位。（第一财经）</p>\n  <p><strong>耐克收回线上运营权，滔搏股价大跌25%</strong></p>\n  <p>滔搏国际控股有限公司（06110.HK，下称“滔搏”）7月22日上午开盘后，股价暴跌25%，截至上午收盘，公司股价报收1.45港元，下跌24.08%。滔搏7月22日发公告称，公司于2026年7月21日交易时段后，接获耐克正式通知，目前于中国内地的耐克产品在线平台销售将于2027年1月1日起全面终止。根据公告，截至2026年2月28日止财政年度，来自耐克产品在线平台销售的收入约占滔搏总收入的22%。公司方面承认，此项终止安排将在短期内对公司业务造成重大不利影响。虽然线上合作终止，但滔搏方面表示，未来将继续秉持互利双赢的原则，就线下销售安排继续与耐克保持紧密合作。（第一财经）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>Kimi据悉最快6个月内赴港上市</strong></p>\n  <p>7月22日，据媒体报道，Kimi计划于8月启动上市前最后一轮融资，目标投前估值高达500亿美元（约合人民币3386亿元），最快6个月内登陆港股。知情人士透露，在此之前，公司预计将在未来几天完成Kimi K3发布前启动的一轮融资，该轮融资投前估值约315亿美元待交割完毕，月之暗面将立即启动新一轮融资洽谈，这将成为公司赴港上市前的最后一次私募股权融资。（21世纪经济报道）&nbsp;</p>\n  <p><strong>OpenAI模型罕见“失控”，自主入侵全球最大AI开源社区</strong></p>\n  <p>北京时间7月22日，OpenAI CEO山姆·奥尔特曼发文称：“我们在模型评估过程中遭遇了一起重大安全事件。”一场原本被关在隔离沙箱里的模型安全测试，最终演变成针对全球最大AI开源平台Hugging &nbsp;Face的真实网络攻击。模型在评估中为了“作弊”拿到高分，自主发现并串联多个零日漏洞（0 day，软件厂商尚未知晓、没有发布补丁修复的安全缺陷），逃逸出隔离环境，攻入Hugging Face生产数据库窃取答案。但在被攻击平台发文数日后，OpenAI才承认责任。从事件的影响来看，这是行业首次公开披露，模型评测失控直接升级为跨企业真实生产环境网络攻击的AI安全事件。（第一财经）&nbsp;</p>\n  <p><strong>英伟达发布Vera CPU新细节，芯片已交付OpenAI等企业</strong></p>\n  <p>7月21日，英伟达公布了其数据中心CPU“Vera”的更多细节，包括技术规格、性能测试结果以及芯片架构等信息，帮助潜在客户全面评估产品。英伟达表示，Vera芯片已于今年6月交付给包括OpenAI、Anthropic、SpaceX在内的客户。英伟达一直被视为信息技术行业的风向标，但在CPU领域仍处于挑战者的位置，需要与两大成熟的竞争对手——英特尔和AMD展开竞争。这两家公司长期深耕服务器CPU市场，并与超大规模云计算厂商建立了深厚合作关系。不过，未来一些云服务提供商可能会选择部署英伟达CPU，将成为新的战场。（财联社）&nbsp;</p>\n  <p><strong>OpenAI：ChatGPT Work和GPT-5.6 7月22日起面向小型企业开放</strong></p>\n  <p>OpenAI宣布推出面向小型企业的ChatGPT服务计划，ChatGPT Work和GPT-5.6 7月22日起面向小型企业开放。（财联社）&nbsp;</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>香港高院驳回宗馥莉上诉申请，维持冻结18亿美元资产</strong></p>\n  <p>时隔近一年，香港高等法院再就娃哈哈争产案作出新裁决，驳回已故娃哈哈创办人宗庆后长女宗馥莉的上诉申请。这意味着2025年8月由原审法官颁发的汇丰银行账户保全令及配套披露令继续有效。该账户在2024年5月31日拥有17.99亿美元。</p>\n  <p>2025年8月1日，香港高等法院颁布判案书，支持作为原告的宗庆后三名境外子女宗继昌（Jacky Zong）、宗婕莉（Jessie Jieli Zong）、宗继盛（Jerry Jisheng Zong）的诉求，确认上述存在信托争议的账户的资产保全令。宗馥莉作为被告之一，需应法庭要求，披露账户最新余额、资产变动记录等信息。（财新）</p>\n  <p><strong>苹果拟推出月租iPhone，支持大多数机型</strong></p>\n  <p>当地时间7月21日，据报道，苹果公司正准备推出名为“Apple Upgrade”的租赁计划，这将成为该公司设备销售方式史上最大的变革之一。知情人士称，这项新服务计划于7月28日上线，将支持大多数iPhone、Mac、iPad 和Apple Watch机型。该计划初期至少将在美国市场推出，同时覆盖苹果线下零售店和线上商店。“Apple Upgrade”将采用类似订阅服务的模式，用户在租赁期间可提前还清设备款项、提前升级至新机型，或在租赁期结束后保留设备。此外，部分操作将收取额外费用。其中，iPhone和Apple Watch的租赁期限为24个月，Mac和iPad的租赁期限为36个月。用户需通过软性信用审核才能获得资格。（界面新闻）</p>\n  <p><strong>SpaceX做空比例飙至32%，马斯克警告空头：几无存活可能</strong></p>\n  <p>据金融分析机构S3 Partners估算，目前约有2.06亿股SpaceX股份被做空，约占该公司可公开交易流通股的32%，名义空仓规模约250亿美元。马斯克对此警告称，做空SpaceX的投资者几无存活可能。SpaceX周二确认，将于8月4日美股盘后发布上市以来的首份季度财报。（财联社）</p>\n  <p><strong>AMD与Anthropic签署重大芯片及投资协议</strong></p>\n  <p>AMD与Anthropic签署重大芯片及投资协议，AMD将向Anthropic投资50亿美元。Anthropic将自2027年上半年起采购最多2吉瓦的AMD最新一代芯片Instinct MI450。（财联社）</p>\n  <p><strong>宇树科技王兴兴：具身智能的“ChatGPT时刻\"有望最快在两三年内到来</strong></p>\n  <p>据世界互联网大会消息，以“智汇丝路 数启新程——携手构建网络空间命运共同体”为主题的2026年世界互联网大会数字丝路发展论坛，7月22日在陕西西安举行开幕式，宇树科技创始人兼首席执行官王兴兴出席开幕式并发言。过去几年，人形机器人从行走到舞蹈、功夫格斗到简单服务进步飞速。王兴兴认为，具身智能的“ChatGPT时刻”有望最快在两三年内到来：届时机器人在大部分陌生场景，也能直接工作实现很多基本功能。因此大家要根据自己的实际情况提前做好各种计划和安排，从而把握智能时代的新机遇。(证券时报)</p>\n  <p><strong>东山精密回应光模块被盗传闻</strong></p>\n  <p>财联社7月22日电，针对东山精密海外仓库光模块近日被盗传闻，财联社记者今日以投资者身份致电东山精密证券部人士进行核实，其表示，确有此事，但金额并没有网传所称数千万美元那么多，网传金额是以销售价格进行计算，但实际上对公司利润影响没有那么大，也未达到披露标准。 (财联社）</p>\n  <p><strong>苹果iPhone18系列已量产</strong></p>\n  <p>7月22日，记者从产业链人士处获悉，进入7月，苹果iPhone 18系列手机已在量产，正处于产能爬坡阶段。记者了解到，目前，苹果iPhone代工组装厂商富士康已进入招工高峰期。（中国证券报）</p>\n  <p><strong>极佳视界回应IPO传闻：相关报道系误读</strong></p>\n  <p>近日，部分媒体援引报道称“极佳视界正考虑最快于2026年在香港启动首次公开募股（IPO）”。对此，极佳视界回应称，该表述系对公司创始人此前接受采访内容的误读，并非公司官方发布的信息，目前没有任何应披露而未披露的事项。（财联社）</p>\n  <p><strong>光大银行回应“隐藏近200亿坏账”传闻</strong></p>\n  <p>光大银行（601818.SH，06818.HK）近日在上证e互动平台上回应“被指隐藏近200亿坏账”时表示，该行经营的基本面稳定，没有应该披露而没有披露的重大风险事件。</p>\n  <p>光大银行今年一季度实现归属于该行股东的净利润114.59亿元，比上年同期下降8.06%。实现营业收入318.11亿元，比上年同期下降3.85%。资产质量方面，一季度光大银行不良贷款“双升”。3月末，光大银行不良贷款余额534.49亿元，比上年末增加27.07亿元；不良贷款率1.32%，比上年末上升0.05个百分点；拨备覆盖率162.22%，比上年末下降11.92个百分点。光大银行在一季报中表示，将采取积极的拨备政策，稳妥有序处置风险资产，夯实资产质量基础。7月22日，光大银行A股收于3.15元/股，上涨0.96%，H股收于3.07港元/股，下跌0.32%。（澎湃新闻）</p>\n  <p><strong>越疆科技回应招股书举报风波</strong></p>\n  <p>7月22日早间，越疆科技发布公告回应“近期举报风波”。该公司表示，宋某于2017年10月入职公司，并非公司创始股东及联合创始人。其通过受让越疆合伙财产份额，间接持有的公司股权来自员工股权激励计划。公司称，相关股权转让及财产份额调整合法合规，保荐机构及律师核查后认为，招股书不存在隐瞒、虚假记载、误导性陈述或重大遗漏。此前，自称为越疆科技联合创始人、原常务副总裁兼COO的宋涛发布微信文章，已对越疆及刘培超提起仲裁并再次向深交所举报，称其本应持有的越疆合伙69.7373%财产份额在招股书中登记为22.455%，涉嫌隐瞒上亿级股权权属争议。（第一财经）</p>\n  <p><strong>开市客降低线上门槛找增量</strong></p>\n  <p>7月22日，界面新闻从开市客中国独家获悉，近期，开市客京东旗舰店的商品起送门槛降低，从原本的199元下降至99元，配送费20元起，同时推出满499元减20元的折扣活动，商品配送范围覆盖中国内地全境。开市客京东店开设地较为低调，在5月时正式上线。店内商品设有会员价与非会员价两套价格体系，即，没有会员卡的消费者也可以在该线上门店购买或直接办卡。界面新闻同时从开市客中国方面独家获悉，目前线上旗舰店SKU有约700个，主要涉及常温食品、生活用品和小型家电等。（界面新闻）</p>\n  <p><strong>微软斥资数十亿美元扶持Mistral扩建数据中心</strong></p>\n  <p>当地时间7月21日，微软同意投入数十亿美元，用于支持法国人工智能初创公司Mistral在欧洲建设算力基础设施，同时把Mistral的AI技术纳入微软自己的云和软件生态，扩大其商业应用范围。根据协议，微软Azure客户未来将能够利用Mistral位于法国的数据中心开发软件。这不仅将增强微软在欧洲地区的算力资源，也为受到监管要求约束的行业提供了一种不同于美国主导基础设施的替代方案。市场研究和IT咨询机构Gartner负责AI领域的分析师Arun Chandrasekaran评论称，这项合作帮助微软更好地服务欧洲客户，并迎合近年来备受关注的“主权AI”趋势。（科创板日报）</p>\n  <p><strong>OpenAI将云支出预期上调至7500亿美元</strong></p>\n  <p>多家海外科技巨头加码数据中心业务，OpenAI计划斥资超过300亿美元建设新的数据中心，并将云支出预期上调至7500亿美元。SpaceX正考虑在德克萨斯州拓展数据中心业务。微软再度加码欧洲AI布局，与Mistral签署“数十亿美元”数据中心合作协议。Anthropic将于2027年上半年开始购买多达2吉瓦的AMD最新一代芯片。（财联社）</p>\n  <p><strong>Apple Watch专利侵权被判赔43亿，法院驳回苹果公司要求</strong></p>\n  <p>据报道，美国加州中区联邦地区法院法官詹姆斯 · 塞尔纳（James V. Selna）于当地时间7月20日作出裁决，驳回苹果公司要求推翻陪审团此前裁定的6.34亿美元专利侵权赔偿的请求，同时拒绝了苹果提出的重审动议。</p>\n  <p>该案的根源可追溯至2020年初，Masimo公司起诉苹果，指控其窃取与脉搏血氧测定法及其他光学健康监测技术相关的商业机密，并侵犯了相关专利。此后，双方的诉讼战不断升级。2023年，Masimo在美国国际贸易委员会（ITC）赢得一项裁决，导致含有血氧监测功能的Apple Watch型号在美国被禁止进口。苹果曾因此短暂停售相关产品，后续恢复销售时则移除了该功能。（IT之家）</p>\n  <p><strong>OpenAI任命两位银行巨头CEO加入公司董事会</strong></p>\n  <p>OpenAI于本周二官宣，增补两名新任董事会成员：巴西数字银行Nubank首席执行官戴维・贝莱斯、纽约梅隆银行首席执行官罗宾・文斯。Nubank是拉丁美洲规模最大的纯数字银行，纽约梅隆银行则是美国头部金融服务机构。（新浪财经）</p>\n  <p><strong>李飞飞旗下World Labs收购机器人仿真公司</strong></p>\n  <p>近日，AI教母李飞飞创办的World Labs宣布收购SceniX。SceniX是一家专注于机器人仿真的美国初创公司。该公司通过创建高保真的虚拟环境，让机器人可以在其中完成操作、移动和交互训练。该公司的核心产品是一套高保真混合仿真平台，专注于多模态传感融合、高精度接触建模以及全身控制场景适配。（新浪财经）</p>\n  <p><strong>康美药业原实控人马兴田夫妇赔付13.96亿元</strong></p>\n  <p>2021年，康美药业因A股最大财务造假案被判赔偿5.2万名投资者24.59亿元。五年后，这场追偿诉讼迎来关键进展。7月20日盘后，康美药业（600518.SH）发布公告称，公司近日收到广州市中级人民法院出具的两份《民事判决书》，就公司诉马兴田、许冬瑾、邱锡伟追偿权纠纷一案以及诉广东正中珠江会计师事务所（特殊普通合伙）（简称“正中珠江”）追偿权纠纷一案作出一审判决。法院部分支持了康美药业的诉讼请求。根据判决结果，广州中院判令马兴田、许冬瑾向康美药业赔偿约13.96亿元；邱锡伟在约1.42亿元范围内对上述债务承担补充清偿责任。康美药业的其他诉讼请求被驳回。（第一财经）</p>\n  <p><strong>三星拟在韩国投资2000亿韩元建设HVAC工厂</strong></p>\n  <p>7月22日，据报道，业内人士透露，三星电子计划在其位于韩国光州的园区内新建一座HVAC（暖通空调）制造工厂，旨在加速拓展企业对企业中央空调业务。报道称，三星近期已向当地政府提交了光州园区新设施的建设许可申请。该项目预计投资约2000亿韩元，旨在加强HVAC系统产能，包括面向AI数据中心的冷却设备。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，7月22日收盘，美股三大指数集体下跌，道指跌0.01%，纳指跌0.57%，标普500指数跌0.14%。大型科技股多数下跌，英特尔、Meta跌超2%，微软、谷歌、特斯拉、亚马逊跌超1%，苹果、奈飞小幅下跌；英伟达涨超2%。热门中概股跌多涨少，网易跌超6%，小鹏集团、哔哩哔哩跌超3%，蔚来跌超2%，拼多多、阿里巴巴跌超1%；老虎证券涨超4%，富途控股涨超2%。</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>越疆科技创业板IPO过会</strong></p>\n  <p>36氪获悉，7月22日，深交所上市审核委员会召开2026年第45次上市审核委员会审议会议，审议结果显示，深圳市越疆科技股份有限公司首发符合发行条件、上市条件和信息披露要求。</p>\n  <p><strong>百度主要上市申请已获联交所确认收悉</strong></p>\n  <p>36氪获悉，7月22日，百度集团发布公告，香港联交所已确认收到其自愿转换为香港主要上市的申请。此前，百度已于16日公告称，公司董事会授权管理层推进在香港联交所主板自愿转换为主要上市，预计于今年内生效。</p>\n  <p><strong>奥比中光：筹划发行H股股票并在香港联交所上市</strong></p>\n  <p>36氪获悉，奥比中光公告，为深化全球化战略布局，打造国际化资本运作平台，拓宽多元化融资渠道，提升公司综合竞争力与国际影响力，公司正在筹划发行境外上市股份（H股）并在香港联合交易所有限公司挂牌上市。截至目前，公司正在与相关中介机构就本次H股发行上市的具体推进工作进行商讨，相关细节尚未确定。本次H股发行上市不会导致公司实际控制人发生变化。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“逸文科技”完成1.5亿美元Pre-B轮融资</strong></p>\n  <p>深圳逸文科技（Even Realities）近日宣布完成1.5亿美元Pre-B轮融资，由美团龙珠及美团战投领投，老股东源一资本和腾讯超额跟投。公司本轮投后估值超过10亿美元，正式跻身独角兽行列。</p>\n  <p>逸文科技的融资可以说是近期AI眼镜热潮的一个缩影。随着以Meta为代表的头部品牌完成销量验证，大厂、创业公司和产业链企业争相入场，AI眼镜开始从小众硬件走向新一轮消费电子入口之争。资金也在沿着赛道热潮向产业链两端加速扩散，一边密集下注终端品牌，同步大举加码Micro LED、光波导等上游环节。（科创板日报）</p>\n  <p><strong>“同舟智航\"完成数千万种子轮融资</strong></p>\n  <p>36氪获悉，智能船艇公司“同舟智航”近日完成数千万种子轮融资，由英诺天使和吴中金控联合领投，江苏金桥基金跟投。融资将用于补充核心研发与量产团队人才，同步启动海外品牌建设与渠道开拓。</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-22T23:58:11+00:00", "fetched_at": "2026-07-23T02:22:04.377654+00:00", "fingerprint": "8e444c698b45b66a"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 同济博士做几何、物理AI重构设计制造，累计获超3亿元融资", "url": "https://36kr.com/p/3907532622648453?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_0aa1a0e60ecc42a0b83a02f813246f66@6221844_oswg2924142oswg2160oswg2293_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>1400</strong>字，建议阅读<strong>3</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，工业AI设计研发解决方案供应商「设序科技」于近日正式完成B轮超亿元融资，累计获超3亿元融资，投资方包括深产投、合鼎共及老股东涌铧投资等。融资将用于市场开拓（含出海）及核心模型技术研发。</p>\n  <p>设序科技成立于2020年，旗下产品“则形AI”是基于自研工业世界模型与自然语言大模型封装的面向硬件工程的设计研发智能体平台，提供云架构下的3D设计方案与2D工程图纸智能生成功能。创始人兼CEO吴泳荣为同济大学先进制造方向博士，曾任通用先进制造实验室研究员、蔚来汽车智能制造专家。</p>\n  <p>相比去年，设序原有的3D生成与2D生成两大产品线经历了深度的Agent化升级。目前，基于几何AI的3D Agent和基于制造AI的2D Agent已完成技术改造并迅速帮助工程师用户们创造了更厚价值。连接几何AI与制造AI的物理AI也已经投入技术研发与POC验证阶段。实际上，物理AI并不是具身智能领域的独有概念，结合工业机理对特定物理场进行工业级精确求解的物理AI同样重要。</p>\n  <p>吴泳荣向硬氪解释了这一演变的内在逻辑：“我们想打造一个面向硬件工程的通用AI入口。用户告诉AI需求，AI分三步执行——几何AI先根据需求设计出精确的几何形状，然后物理AI求解这个几何形状的强度、刚度或流场、磁场等物理性能，最后制造AI判断其可制造性。”</p>\n  <p>业绩方面，设序科技今年上半年合同额同比增长约70%，全年预计接近2亿元，较去年接近翻倍。RAAS（Result as a Service）交付模式已成为重要增长引擎，占全年营收约1/3。</p>\n  <p>目前则形AI产品已应用于汽车、3C、能源等核心行业，并拓展至商业航天、具身智能等新兴领域，主要客户包括本田、东风、中汽工程、宇通、中车等头部企业。</p>\n  <p>出海方面，设序科技将2026年定为出海元年，重点为欧洲，已在首站德国签下种子客户，上半年主要完成了欧盟数据合规等前期工作，下半年将争取首批10个左右客户落地，明年计划在欧洲放量，同时准备日韩和东南亚市场。</p>\n  <p><strong>以下为硬氪与公司创始人吴泳荣的部分访谈实录（经编辑）：</strong></p>\n  <p><strong>硬氪：客户对工业AI的态度这两年有什么变化？</strong></p>\n  <p><strong>吴泳荣：</strong>原来非常保守的客户，现在被教育得甚至有些“激进”。这体现在预算投入上，更体现在心态上。原来很多客户觉得“这场景用AI几乎不可能”，现在不等场景成熟就主动来做POC，甚至给预算做POC都是很常见的。驱动因素主要有三个：一是每天被基础大模型的进步教育，二是实际工作中确实存在诸多痛点，三是实实在在看到我们在已落地场景用AI创造的价值厚度。</p>\n  <p><strong>硬氪：工业AI最终会取代工程师吗？</strong></p>\n  <p><strong>吴泳荣：</strong>我们内部反复强调一个观点：在AGI（Artificial General Intelligence）到来之前，人不会被取代，但不会用AI的工程师会被会用AI的工程师取代。工程师的核心价值从来不是“操作软件”，而是“做专业判断”，包括选什么基准、定什么公差、怎么平衡成本和性能。</p>\n  <p>这些决策需要基于经验、场景和硬件产品从设计研发到生产加工到维护保养的完整上下文，AI短期内做不到。短期内理想的状态是：AI完成80%的重复劳动，工程师把精力放到20%的创造性判断和异常处理上。</p>\n  <p><strong>硬氪：您判断工业世界模型的“GPT时刻”什么时候会到？判断标准是什么？</strong></p>\n  <p><strong>吴泳荣：</strong>最多3到5年。判断标准是在智能水平上能做到无人驾驶所谓的L4或L5。L2或L3能大规模量产，通过量产拿到数据反哺更高级别的模型，速度就非常快了。工业场景和自然语言、图片视频在AI第一性原理维度是一致的，数据量积累到一定程度，加上合适的模型技术，就会出现模态下的高水平智能。难点还是数据、模型技术以及量产业务的推进（因为它不仅能打磨模型技术也能产生数据飞轮），我们已经走得很靠前了。</p>", "category": "tech", "published_at": "2026-07-23T01:08:03+00:00", "fetched_at": "2026-07-23T02:22:04.377648+00:00", "fingerprint": "68a1cd119d0129dd"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前华尔街投资人下场造“手”，以“自研视触觉+软硬闭环”破解行业数据难题", "url": "https://36kr.com/p/3907536767833473?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_8ed55b5301654f11a4dd8f72795107ff@6221844_oswg5566625oswg2583oswg1722_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2100</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，机器人灵巧操作方案提供商拾玥科技（LumiBot）近日完成数千万元天使轮融资。本轮由常州智融长优股权投资合伙企业（有限合伙）领投，另外两家国有投资平台旗下基金跟投。资金将主要用于团队扩张、产品迭代与小批量产线建设，以及灵巧操作数据采集与模型研发。</p>\n  <p>拾玥科技成立于2025年初，专注于为工业制造、精密装配等高精度场景提供灵巧操作解决方案。目前，公司已推出Lumi-Dex系列高自由度灵巧手、Lumi-Tac指型视触觉传感器、Lumi-Mind灵巧操作模型及Lumi-Mod电机模组四大产品线。</p>\n  <p>团队方面，创始人吴聿文曾以投资人身份主导投资过AI智能视觉、咖啡机器人等多个项目。技术负责人宋开友师承熊有伦院士、尹周平院士，曾任蚂蚁集团高级算法专家，主导了百灵多模态大模型的多版模型训练；算法负责人陈逸凡来自百度自动驾驶团队主导并落地国内首个纯视觉高阶智驾方案；产品负责人钟乔恒曾创办灵巧手公司并实现量产。</p>\n  <p>在具身智能浪潮中，灵巧手被视为机器人完成精细化操作的“最后一厘米”。创始人吴聿文判断，灵巧手是机器人绕不开的瓶颈，也是价值链路极大的赛道。</p>\n  <p>拾玥科技的核心差异化之一，在于自研的Lumi-Tac指型视触觉传感器。与传统阵列式触觉传感器不同，该方案通过微型相机捕捉凝胶表面形变，建模解耦出力、纹理、滑移等多模态信息，具备10μm级空间分辨率与0.02N力控精度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_86a032e9b3a84b3fa73b33c3e989101b@6221844_oswg379620oswg772oswg515_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Lumi-Tac视触觉传感器（图源/企业）</p>\n  <p>吴聿文向硬氪表示：“视触觉被学术界认为是灵巧手感知的未来方向，其对操作成功率的提升显著优于其他类型的触觉传感器，在物理智能领域上限极高，是未来高端灵巧手的标配。我们是一家率先自己做灵巧手公司并拥有自有视触觉方案的团队。”</p>\n  <p>在硬件端，公司自研的Lumi-Mod微型电机模组在紧凑体积内实现高扭矩输出。针对灵巧手长时间工作发热严重的行业通病，拾玥科技推出了全球首款带主动散热的微型关节模组，可使温度降低超50℃，空载连续使用寿命提升至 5000 小时以上，率先打通了灵巧手支持工业 24 小时连续稳定作业的工程壁垒。</p>\n  <p>吴聿文透露，主动散热的难点在于灵巧手内部空间极其有限，公司通过改变电机构型，把原来放线束和电机的空间腾出来做风道，才实现了这一突破。</p>\n  <p>在自由度布局上，公司采用差异化策略。11自由度灵巧手主攻批量市场，已小批量量产，上个月启动销售，预计全年营收2000万至3000万元，出货100至200套。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_4e5f288056f2423490e34b85cc78caa5@6221844_oswg499762oswg942oswg628_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Lumi-Dex-11S灵巧手（图源/企业）</p>\n  <p>23主动自由度旗舰产品则面向高端场景，细分为两条技术路线：一款搭载空心杯电机模组，近期推出；另一款搭载全球首创的主动散热方案，预计今年10月发布。</p>\n  <p>目前，拾玥科技选择工业场景与人形机器人主机厂双线并行。公司已与头部工业客户启动百万级别订单，探索灵巧手与工业机械臂在喷涂等场景的协同应用，此外与中国联通、思源电气等客户的合作也在推进中。</p>\n  <p><strong>以下为硬氪与拾玥科技创始人吴聿文的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：从投资人转型创业，认知有哪些变化？怎么看灵巧手赛道？</strong></p>\n  <p><strong>吴聿文：</strong>最大的转变是对“时间”和“细节”的理解。投资看趋势，创业要精细到现金流和良率。</p>\n  <p>灵巧手做出样机不代表能卖，我们11自由度样机出来后花了近半年迭代，才把低自由度推向量产。赛道判断上，以前觉得自由度最关键，现在看工业场景下“耐用”比“灵巧”更优先，工厂最关心“能连续跑几个小时不坏”。</p>\n  <p>另外以前觉得是人形机器人带动灵巧手，实际跑下来，工业机械臂装灵巧手的需求更确定、付费意愿更强，工业场景才是当前最扎实的基本盘。</p>\n  <p><strong>硬氪：公司主推23个主动自由度同时小批量出货11个自由度产品，出于什么考虑？</strong></p>\n  <p><strong>吴聿文：</strong>核心是技术壁垒与市场需求分层匹配。11自由度成本可控，适合搬运、分拣等场景，快速跑量、验证供应链。23主动自由度接近人手物理上限，每增加一个自由度，集成控制、散热难度指数级上升。</p>\n  <p>我们通过自研电机模组把手指间隙压到1.5mm以内，在不改变外形尺寸的前提下做主动散热，全球首创。两条线搭配：11自由度量产出货，23主动自由度做技术壁垒。</p>\n  <p><strong>硬氪：数据被认为是灵巧手落地的关键瓶颈，你们具体怎么解决？</strong></p>\n  <p><strong>吴聿文：</strong>高自由度灵巧手搭配触觉感知的公开数据几乎空白。我们三条路并行：采购开源仿真数据做预训练；自研视触觉数据手套做遥操作采集；Ego视频直采让工人在工厂直接操作，通过运动重定向映射到灵巧手，低成本大面积铺开。模型侧自研VTLA架构，“大小脑”分层，原子技能库覆盖抓握、旋转、对位等基础技能，可直接调用。</p>\n  <p>“采集→训练→部署→回流”闭环是我们跟纯硬件公司的最大差异。卖硬件只是入口，持续提供操作智能才是长期价值。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>常州智融长优股权投资合伙企业（有限合伙）：</strong>投资具身智能，我们看重的是团队解决行业底层痛点的能力。现在行业不缺硬件，也不缺算法，缺的是高质量的数据资产。而缺乏好用的遥操设备，又是导致数据难采集、质量低的症结所在。拾玥科技最吸引我们的是其‘软硬一体’的全局观。他们从源头的遥操设备切入，不仅补齐了行业数据采集的短板，更实现了‘极致硬件+高质量数据+前沿模型’的全栈自研闭环。这种闭环能力让拾玥具备了极高的稀缺性，也让我们看到了具身智能真正走向场景落地的可行路径。</p>", "category": "tech", "published_at": "2026-07-23T01:12:15+00:00", "fetched_at": "2026-07-23T02:22:04.377639+00:00", "fingerprint": "10d1dcb7c051975b"}, {"source": "36氪 - 最新文章", "title": "对话蚂蚁数科：打造商业智能体超级工厂，生态共建中国行业版Harness标准", "url": "https://36kr.com/p/3907590205085056?f=rss", "summary": "<p>7月17日，2026世界人工智能大会（WAIC）在上海开幕。作为36氪连续第三年深入WAIC现场的重要内容窗口，「氪话未来」直播间也在大会首日同步开启现场对话。蚂蚁数科副总裁、中国区业务发展部总经理孙磊在WAIC现场接受36氪「氪话未来」特邀专访，围绕商业智能体超级工厂、行业垂直大模型、AI工程化能力以及企业智能体落地等话题，分享了蚂蚁数科面向企业智能化升级的最新实践与思考。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260723/v2_0902d80826964ee2bda8c2cf18bacf3c@6381723_oswg1617997oswg1422oswg788_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>本届WAIC以“智能伙伴，共创未来”为主题。随着人工智能产业进入应用深化阶段，行业关注点正在从模型能力竞争逐步转向应用价值创造。相比过去几年围绕参数规模、模型性能和技术突破的讨论，2026年的AI产业正在更加关注一个核心问题：AI如何真正进入企业业务流程，如何降低应用门槛，如何通过实际业务结果创造价值。</p>\n  <p>在这一趋势下，商业智能体正成为连接模型能力与企业应用的重要载体。对于企业而言，仅拥有通用大模型已经无法满足复杂业务需求，更需要具备行业知识、业务理解和工程化能力的智能体系统，帮助AI真正落地到业务场景，实现从个人效率提升到组织协同升级。</p>\n  <p>蚂蚁数科此次发布的\"商业智能体超级工厂\"，正是围绕这一方向展开探索。作为承载“商业智能体超级工厂”的应用平台，Agentar2.0首批预置近200个岗位级数字专家模板，并提供数百个可订阅的Skills级开箱可用的智能体工具。企业可以根据具体岗位和经营需求，快速启用具备专业知识、业务流程及工具调用能力的数字专家，无需从零起步。</p>\n  <p>对于企业级AI而言，真正决定落地效果的，不只是模型能力本身，更是行业理解、工程化能力与价值交付体系的持续建设。</p>\n  <p>以下为对谈实录，经36氪编辑：</p>\n  <p><strong>36kr：</strong>孙总您好，能不能先介绍一下今年展位的主题？我看到一个关键词叫“商业智能体超级工厂”，这个定位应该如何理解？</p>\n  <p><strong>孙磊：</strong>今年我们发布的“商业智能体超级工厂”，核心定位是解决行业问题和场景问题。从去年到今年，整个AI的发展过程出现了非常大的变化。第一个变化，是AI已经从过去通用的问答模式，逐渐发展到今天真正能够帮助用户完成任务、解决问题的智能体阶段。从这个角度来看，AI正在从通用场景进入垂直行业。第二个变化，是行业真正需要解决的是业务场景中的核心问题。只有智能体真正落到应用侧，才能解决实际业务需求。第三个变化，是AI的发展目标已经从过去解决单个人效率提升的问题，进一步走向组织层面的进化。未来不仅是个人能力提升，更重要的是团队与团队之间、业务与业务之间如何通过智能体实现协同，让整个组织实现智能化升级。</p>\n  <p>围绕这些变化，我们结合蚂蚁集团自身垂直大模型能力、行业场景经验，以及20多年技术积累，将这些能力沉淀为标准化产品，对外提供服务。无论是大型企业还是中小企业，都能够获得与蚂蚁集团类似的技术能力和产品能力，真正帮助产业实现智能化转型。</p>\n  <p><strong>36kr：</strong>我们知道蚂蚁数科最早是在金融科技领域积累了大量经验。金融行业对于安全、合规、稳定性的要求非常高。能不能总结一下，金融机构在拥抱Agent和AI转型过程中有哪些核心顾虑？为什么你们的方案能够解决这些问题？</p>\n  <p><strong>孙磊：</strong>其实回到为什么推出“商业智能体超级工厂”，核心是希望解决几个关键问题。第一个，是行业化的问题。我们认为未来AI一定会从通用场景走向垂直场景，而垂直场景需要结合行业数据，形成行业垂直大模型。如果只有通用大模型，没有行业数据和专业能力支撑，就无法真正解决专业度和业务适配的问题。因此，我们商业智能体超级工厂和其他方案最大的区别之一，就是希望通过垂直大模型解决行业化问题。</p>\n  <p>第二个，是场景化的问题。今天如何把业务语言转化为技术能力，让AI真正服务业务，这是非常关键的一点。</p>\n  <p>蚂蚁数科基于多年在金融、医疗、能源等领域的实践经验，将这些能力进一步工程化，形成可复制的解决方案，让AI能够真正落地到业务场景。</p>\n  <p>第三个，是生态化的问题。AI能力的开放一定需要结合行业生态。我们会将相关组件进行API化、简单化，让更多合作伙伴能够快速接入，并围绕自身行业优势进行创新。所以，行业化、场景化、生态化，是我们商业智能体超级工厂区别于其他方案的三个核心方向。</p>\n  <p>回到金融行业，金融场景有几个非常关键的问题。第一个是安全和合规问题。金融行业涉及监管要求，必须确保AI应用符合相关规范。蚂蚁本身在金融、支付、财富管理和保险等金融场景中，也可以确保AI的合规问题。因此，没有安全能力和风险控制体系，AI很难真正落地金融场景。宁愿不做，也不能犯错。</p>\n  <p>第二个是专业度和幻觉问题。金融业务高度专业，AI必须能够准确理解和回答专业问题。我们的智能体超级工厂有两个重要工具，一个是行业的垂直大模型，一个是围绕着业务场景的工程化能力，把这两个能力相结合才能更加贴合实际场景。因此，我们通过行业垂直大模型结合业务工程化能力，提高模型专业水平。</p>\n  <p>第三个，是效果验证问题。金融机构过去在信息化、数字化方面投入巨大，因此在AI转型过程中会关注投入之后如何体现价值，如何验证ROI。</p>\n  <p>针对这一点，蚂蚁数科提出“价值交付、效果付费”的理念。所谓价值交付，就是验证智能体是否真正具备专业能力。我们主要通过两个维度衡量：第一，是回答的准确率。例如用户咨询保险问题，智能体是否能够准确回答保险相关内容，而不是泛泛回答其他金融问题。围绕刚才讲的垂直大模型，目前我们在专业场景中的回答准确率基本可以达到90%-95%以上。第二，是胜合率。也就是让专业人员和智能体回答同一个问题，比较两者结果的一致程度。目前在相关场景中，我们可以达到85%以上。这也是蚂蚁集团在财富、保险、基金相关的场景中对自己的要求。</p>\n  <p>除此之外，效果付费则是在实际业务中验证AI创造的价值。例如在营销场景中是否提升转化效率，在风控场景中是否降低风险。因此，在金融领域，安全、专业度以及效果验证是三个最重要的问题：必须要符合监管和国家的要求；一定要有行业的垂直大模型；有可见的效果交付。蚂蚁希望围绕这些问题，结合自身最佳实践逐一解决。</p>\n  <p><strong>36kr：</strong>最近我们看到蚂蚁数科正在拓展金融之外的行业。除了金融之外，目前重点布局哪些行业？这些行业有什么共同特点？另外，在技术泛化过程中遇到了哪些挑战，又是如何解决的？</p>\n  <p><strong>孙磊：</strong>其实还是围绕刚才提到的几个核心方向：行业、业务场景以及安全。除互联网行业之外，很多传统行业在从数字化走向AI化、智能化过程中，面临着一些共同问题。我们希望将过去在金融领域沉淀的能力复用到更多行业。</p>\n  <p>第一个关键点，是数据底层治理。行业垂直大模型最重要的基础就是底层数据，包括外部数据和企业内部数据。我们的方式是结合自身具备的外部数据能力，再融合企业业务数据，形成适用于具体行业的垂直模型。因此，在服务其他行业时，数据治理能力非常重要。如果底层数据没有经过整理和治理，就无法支撑垂直场景模型。金融行业过去数字化程度较高，而制造、医疗、工业等行业的数据基础相对复杂。因此，我们的智能体超级工厂也包含数据治理工具和相关能力，帮助企业完成基础建设。</p>\n  <p>第二个关键点，是业务场景结合能力，也就是工程化能力。目前海外提出了Harness概念，本质上是如何将模型能力工程化落地。我们希望打造符合中国行业特点的行业版Harness，这也是商业智能体超级工厂的重要壁垒。关于Harness的能力该如何在各行各业里运用，我举个例子，在金融场景中，原本有一个‘三车间’的逻辑。但在Harness中，我们形成了“四车间”逻辑，包括意图识别、策划、执行和表达。其中意图识别非常重要。用户提出保险相关问题，但真正需求可能是资产配置、财富管理或者产品组合推荐。因此，需要先理解用户真实意图，再完成后续服务。不同领域对于工程化能力的要求不同。例如能源、医疗等行业，可能需要不同颗粒度的流程设计。未来，我们希望沉淀符合中国市场特点的行业Harness，这是我们智能体超级工厂的目标。目前，我们也已经在金融、医疗、能源、出行、交通，航空等领域积累了一些能力。</p>\n  <p>第三个关键点，是安全能力。不同产业对于安全的关注点不同。金融行业更多关注监管合规，而制造业可能关注生产安全，能源行业则可能关注预测准确性。例如光伏领域，我们通过时序大模型结合天气、现场情况等因素，实现发电量预测。因此，安全能力需要结合不同产业特点进行适配。</p>\n  <p>第四个关键点，是效果验证。我们在金融和医疗领域已经有较成熟的价值验证体系，但在其他行业仍处于探索阶段。未来，我们会持续与合作伙伴共同完善效果评估标准，让行业能够真正看到AI投入后的价值。</p>\n  <p><strong>36kr：</strong>最后一个问题，能不能提前预告一下，未来6到12个月蚂蚁数科重点发展的方向？WAIC之后，大家可以期待看到哪些动作？</p>\n  <p><strong>孙磊：</strong>未来6到12个月，大家可以重点关注几个方向。第一，是行业垂直大模型以及智能体矩阵的持续丰富。目前我们已经在金融、医疗、能源、出行等领域形成了一些能力。未来，对于我们擅长、有数据积累的领域，会进一步标准化产品输出；对于其他行业，也会与合作伙伴共同打造行业垂直大模型和智能体。</p>\n  <p>第二，是中国行业版Harness能力的开放。未来，我们会进一步梳理各行业工程化能力，并形成标准化方法论。例如金融领域已经形成“四车间”模式，包括意图识别、策划、执行和表达。未来，在能源、医疗等行业，我们也会与生态伙伴一起探索对应的行业版Harness，并逐步开放相关能力。</p>\n  <p>第三，是评测体系的持续完善。我们有非常完整的评测体系，目前，在部分银行客户项目中，我们已经进行了多轮评测验证。例如某头部城商行项目，我们进行了28轮评测。未来，我们会持续更新和丰富评测体系，通过更加科学的方式验证AI是否真正实现价值交付、效果付费。此外，平台能力和工具能力也会持续发布。最终，我们希望通过行业大模型、工程化能力以及评测体系建设，让智能体真正服务产业，实现价值落地。</p>", "category": "tech", "published_at": "2026-07-23T02:09:19+00:00", "fetched_at": "2026-07-23T02:22:04.377624+00:00", "fingerprint": "2e2b8c7f23f642d2"}, {"source": "少数派", "title": "角落新声｜我的上帝模式，一名设计师创作环境的演变", "url": "https://sspai.com/post/112109", "summary": "声音只是其中一个切片。客观来看，它记录的是我的创作环境如何不断迭代；但从个人经历来看，它真正映照的是我对创作这件事的理解如何变化。<a href=\"https://sspai.com/post/112109\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-22T02:04:29+00:00", "fetched_at": "2026-07-23T02:22:01.641327+00:00", "fingerprint": "54b25fa77316598e"}, {"source": "少数派", "title": "滤镜背后的色彩科学：LUT 是什么？", "url": "https://sspai.com/post/111550", "summary": "从风格滤镜，到电影中的专业调色，聊聊 LUT 所代表的色彩规则。<a href=\"https://sspai.com/post/111550\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-22T07:00:00+00:00", "fetched_at": "2026-07-23T02:22:01.641321+00:00", "fingerprint": "41d3385454854615"}, {"source": "少数派", "title": "Parti：一个零门槛联机游戏平台，凭什么不需要服务器？", "url": "https://sspai.com/post/112545", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/112545\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-22T09:43:06+00:00", "fetched_at": "2026-07-23T02:22:01.641313+00:00", "fingerprint": "82ab189668512c75"}, {"source": "少数派", "title": "派早报：三星发布多款折叠屏新品、索尼发布 FX5 电影摄影机等", "url": "https://sspai.com/post/112647", "summary": "OpenAI 发布面向企业用户的 OpenAI Presence，耐克宣布重构大中华区市场生态等。<a href=\"https://sspai.com/post/112647\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-23T00:50:21+00:00", "fetched_at": "2026-07-23T02:22:01.641301+00:00", "fingerprint": "198bcacf52fd92fc"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7368 CNY ↓-0.21%", "url": "https://www.frankfurter.app/2026-07-22?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-07-22</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.736
