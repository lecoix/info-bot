<style>
  :root {

  @media (prefers-color-scheme: dark) {

      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;

  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

ng></p>\n  <p>AI 重塑电商流量入口。Adobe Analytics数据显示，2026年一季度，生成式AI驱动的美国线上购物流量同比增长393%，其引荐转化率比传统渠道高出42%。消费者购物入口正从“主动搜索”向“表达需求”延伸，推动品牌流量运营从传统SEO进一步向GEO（生成式引擎优化）拓展。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_9cad79f05686419eb67dc88134feab1e@6301044_oswg132370oswg1680oswg573_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>与此同时，全球税务、环保和数据合规要求持续趋严。品牌需要将合规审查前置至选品、上架、营销和物流等环节，并建立覆盖不同市场的动态监测体系。</p>\n  <p>AI抬高效率上限，合规要求明确经营底线，两者共同推动全球电商更加重视长期经营质量。</p>\n  <p><strong>02 品牌全球化机会扩大，经营复杂度同步上升</strong></p>\n  <p><strong>三大机会 × 三大卡点，倒逼全球经营能力升级</strong></p>\n  <p><strong>机会一：行业红利向品牌企业集中</strong></p>\n  <p>随着流量红利释放趋缓、合规成本和营销成本提高，主要依赖低价供应链和铺货模式获得增长的商家面临更高的经营压力，而具备技术研发、产品溢价与敏捷供应链能力的品牌企业迎来新的发展机会。Marketplace Pulse数据显示，2025年亚马逊全球站点销售额超过百万美元的卖家数量由2021年的6万家增至超过10万家，年销售额超过亿美元的大卖家数量也由50家增至235家。</p>\n  <p><strong>机会二：全渠道覆盖盘活用户长效价值</strong></p>\n  <p>数据显示，全球73%的消费者会选择跨渠道购物。随着消费者购物路径更加非线性，品牌经营不再局限于单一电商平台，而是逐步形成由第三方平台、独立站、社交电商与实体零售共同组成的渠道矩阵。品牌通过用户行为和销售数据识别个性化需求，并结合本地化服务持续深化消费者连接，有机会进一步释放用户长期价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_32720388c1f24ed1aaba6c471473d0a6@6301044_oswg354275oswg1686oswg579_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>机会三：消费体验升级打开供应链价值空间</strong></p>\n  <p>高效履约、产品质量与个性化服务正在更加显著地影响消费者购买决策。品牌不仅需要在制造端持续提升产品创新和质量能力，也需要在交付端以更加高效、安全和便捷的物流、支付与相关服务，回应消费者对速度和体验的更高要求。</p>\n  <p>三大机会加速释放的同时，全球化运营也面临三大卡点。</p>\n  <p><strong>卡点一：传统直营模式面临资金成本压力</strong></p>\n  <p>品牌自建运营、营销和客服等团队，不仅需要承担持续的人力与市场投入，还需自行完成全球备货，并承担库存、物流与仓储成本。数据显示，跨境电商供应链业务成本中，产品成本约占20%—30%，广告营销成本约占10%—15%，物流仓储成本约占15%—20%，重投入运营模式进一步加大资金周转压力。</p>\n  <p><strong>卡点二：服务商多头管理稀释本土化成效</strong></p>\n  <p>亿邦智库调研显示，62.5%的品牌认为本土化能力是全球化过程中最需要具备的能力。但在实际经营中，品牌往往需要跨区域对接营销、支付、仓储和合规等多家服务商。各环节缺少统一的经营目标与数据协同，不仅增加管理成本，也会延长决策链路，降低品牌响应市场变化的效率。</p>\n  <p><strong>卡点三：市场波动加剧库存积压风险</strong></p>\n  <p>跨境供应链周期较长，当销售预测与实际需求产生偏差，在途库存和海外仓库存容易出现积压；多渠道库存割裂及逆向物流能力不足，又进一步增加库存消化难度。亿邦智库调研显示，61.2%的商家对滞销积压风险表示担忧。<strong>&nbsp;</strong></p>\n  <p><strong>全链路增长伙伴赋能成为破局关键</strong></p>\n  <p>三大机会与三大卡点共同说明，品牌需要的不只是更多服务商，而是能够统一经营目标、整合全球资源并共同承担结果的增长伙伴。《报告》认为，这类伙伴需要具备四项核心能力：风险共担、全链路整合、数据驱动与本地化运营。判断其价值，也不能只看单项服务能力，而要看其能否将利益机制、经营目标、数据系统和市场执行真正连接起来。</p>\n  <p>基于此，《报告》以Pattern栢藤全球电商平台加速器为研究样本，观察这套模式如何转化为具体经营结果。</p>\n  <p><strong>03&nbsp; Pattern栢藤如何构建品牌全球化增长系统？</strong></p>\n  <p><strong>一套体系化方法论，贯穿增长全链路</strong></p>\n  <p>品牌全球化需要的不只是分散的能力模块，而是一套能够持续运转的经营系统。</p>\n  <p>围绕这一判断，《报告》将Pattern栢藤（以下简称“栢藤”）全球电商平台加速器的增长方法论概括为四个层次：</p>\n  <p>第一层，以品牌全球化总经销模型明确责任与利益机制；<br />第二层，以电商业务增长方程式拆解核心经营杠杆；<br />第三层，以两大AI引擎驱动运营决策智能化与自动化；<br />第四层，以双向增长通道连接中国与全球市场。</p>\n  <p>四个层次分别回答“谁来负责”“经营什么”“如何执行”和“如何进入不同市场”，共同构成一套可以复制和持续进化的品牌全球化增长系统。</p>\n  <p><strong>第一层：以总经销模型明确责任与利益机制</strong></p>\n  <p>在传统服务采购关系中，服务商通常按照项目或服务内容收费，品牌则承担主要的库存、市场和经营风险。双方虽然存在合作关系，但经营目标未必完全一致。</p>\n  <p>栢藤在品牌授权范围内承接经销与运营职责，通过采销一体、风险共担、全链路整合和本地化执行，将传统服务关系升级为围绕经营结果展开的深度协同。</p>\n  <p>这一模式主要包含三项机制。</p>\n  <p><strong>机制一：角色协同，聚焦优势</strong></p>\n  <p>品牌聚焦产品创新、供应链建设和品牌资产沉淀；栢藤负责授权范围内的市场执行、合规、客服和履约，并将当地市场洞察持续反馈给品牌。双方由简单的服务采购关系，转向围绕同一经营目标展开专业分工。</p>\n  <p><strong>机制二：采销一体，风险共担</strong></p>\n  <p>传统代运营模式下，库存、退货和市场波动风险主要由品牌承担；栢藤则通过买断式采销，在约定范围内承担采购、持货与库存周转责任，缓解品牌全球扩张过程中的资金占用和试错压力。双方围绕销售、库存周转与利润表现等指标形成更一致的利益机制。</p>\n  <p><strong>机制三：共同治理，权责清晰</strong></p>\n  <p>品牌保留核心战略决策权，栢藤在授权范围内负责具体运营执行；双方围绕价格、渠道、广告和库存等关键事项建立共同治理机制，明确决策边界、信息共享与效果归因，在保持品牌长期价值的同时提升市场响应效率。</p>\n  <p>总经销模型首先解决“谁来负责”的问题。只有责任、利益和决策边界得到明确，品牌才能从分散的日常运营中抽身，把核心精力放回产品创新与品牌建设。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_c676ee5cc9b14d56a52da413a228058e@6301044_oswg245836oswg1668oswg813_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>第二层：以电商业务增长方程式拆解核心经营杠杆</strong></p>\n  <p>合作机制明确了谁来负责，电商业务增长方程式则进一步回答双方应该管理什么。</p>\n  <p>基于全景式运营思维，栢藤将影响营收增长的核心变量概括为：</p>\n  <p>营收 = 流量 × 转化 × 价格 × 供应</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_d613e69f61b84975849f5005fd5b5b0d@6301044_oswg57975oswg1664oswg282_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>流量决定有多少消费者看到商品，转化决定其中有多少需求形成订单，价格决定每笔订单能够实现的价值，供应则决定商品能否保持可售并按时交付。这里的供应不仅指库存数量，也包括备货、库存周转和履约保障能力。</p>\n  <p>四个杠杆共同构成一条完整的增长链路。任何一个环节出现短板，都会影响最终营收。流量不足，品牌难以获得有效���求；转化不足，流量无法形成订单；价格与市场不匹配，会影响转化和价值获取；供应不足，则可能造成缺货、交付延迟和销售损失。</p>\n  <p>通过电商业务增长方程式，品牌可以在营收发生变化时判断问题来自哪个环节，并据此确定资源投入和优化重点。增长管理由此从笼统的业绩目标，转化为可以衡量、执行和持续改进的经营任务。</p>\n  <p><strong>第三层：以两大AI引擎驱动运营决策智能化与自动化</strong></p>\n  <p>在明确合作机制与增长路径后，品牌还需要将其落实到日常运营中，通过数据与AI持续识别增长机会、优化运营决策，并自动执行具体任务。</p>\n  <p>截至2026年9月，栢藤已沉淀逾91万亿个数据点，并拥有44项专利（含已授权及申请中)。依托这一数据与技术底座，公司将人工智能深度应用于品牌增长的每个环节，并借助自研模型与全栈技术体系，打造 AI 自主电商执行引擎 Pattern Intelligence（Pi）和智能广告引擎 Destiny，助力品牌以更高效率及更强可预测性实现全球化增长。</p>\n  <p>Pi AI 自主电商执行引擎构建“感知—决策—执行—反馈”的智能运营闭环。Pi 通过持续监测产品报价、广告、内容、定价和库存，在识别机会或风险后自动执行优化或修复操作；当需要品牌判断时，则将决策项推送至人工审批。自部署以来，Pi 已在其品牌组合中执行数百万次自动操作，包括恢复产品推荐位、调整价格和修复内容，并实现 24/7 全天候运行。</p>\n  <p>Destiny智能广告引擎则专注于广告的真实增量价值。它融合广告、消费者行为和产品表现数据，通过自动竞价与预算调整优化资源配置，帮助品牌从关注曝光和广告销售，进一步转向衡量广告对实际增长的贡献。</p>\n  <p><strong>第四层：以双向增长通道连接中国与全球市场</strong></p>\n  <p>AI引擎为品牌提供决策与执行能力，栢藤的渠道网络和本地化运营体系，则负责将这些能力转化为具体市场中的经营成果。</p>\n  <p>在进口端，栢藤覆盖天猫、京东、抖音和小红书等主要渠道，并结合中国消费者的购买路径，为海外品牌提供渠道布局、内容运营、进口合规、仓储履约和售后服务，帮助品牌进入并持续经营中国市场。</p>\n  <p>在全球市场拓展端，栢藤依托全球主流电商平台合作网络和本地化运营能力，帮助品牌进入北美、东南亚、日韩、拉美和中东等市场，并将渠道运营、营销增长、库存履约和合规管理纳入统一经营体系，降低品牌进入新市场的前期投入和经营风险。</p>\n  <p>两条增长通道共享同一套总经销模型、数据能力和技术体系。通过不同市场的本地化执行，栢藤将全球资源转化为具体的经营成果。</p>\n  <p><strong>04 六大品牌实践验证全球化增长成效</strong></p>\n  <p>《报告》从海外品牌进入中国与品牌拓展全球市场两个方向，选取六个代表性案例，呈现不同品牌如何借助栢藤的全链路能力突破具体经营难题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_c74c23eee29c446e965cb7ef3cfcb8e8@6301044_oswg322721oswg1665oswg849_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>海外品牌进口案例：</strong></p>\n  <p>案例一｜KELO-COTE芭克：围绕平台运营、价格治理、内容增量与本地化直播构建增长体系，一年内跃居天猫国际品类领导者</p>\n  <p>案例二｜THORNE悦恩：合作仅6个月，核心单品挺进天猫品类销量TOP10</p>\n  <p>案例三｜Swanson斯旺森：在强化传统货架电商基本盘的同时，通过KOL、KOC种草矩阵与差异化平台运营拓展社交电商</p>\n  <p><strong>全球化品牌增长案例：</strong></p>\n  <p>案例四｜Balance of Nature：通过广告与内容优化、品牌保护、物流体系和系统化运营支持，合作两年内收入实现翻倍</p>\n  <p>案例五｜Bosch舒适科技：18个月内进入13个新市场并推出28款新品，相关产品不到6个月登上亚马逊热水器品类第一</p>\n  <p>案例六｜SPANX：通过Destiny智能广告引擎识别广告带来的真实增量价值，合作一年内推动SPANX广告销售额同比增长120%</p>\n  <p><strong>05 品牌全球化进入“共生时代”</strong></p>\n  <p><strong>从交易信任走向生态协同</strong></p>\n  <p>全球化经营复杂度持续提升，品牌与合作伙伴之间的关系正在被重新定义。《报告》将这种变化概括为三个方向：合作基础从“交易信任”走向“系统信任”，合作目标从“服务交付”走向“价值共创”，竞争单元从“单点能力”升级为“经营生态”。</p>\n  <p>系统信任来自持续的信息共享和清晰的责任边界。品牌保留产品、品牌与长期战略的主导权，合作伙伴基于市场、价格、库存和增长数据参与渠道规划与日常经营，双方共同面对市场变化并承担经营结果。</p>\n  <p>无论是海外品牌进入中国，还是中国品牌拓展全球市场，全球化下一程所比拼的，不只是进入市场的速度，而是能否将目标、数据、资源和执行连接成一个整体，并将这套协作能力复制到更多市场。当经营目标、全球资源和增长责任真正贯通，品牌才能以更轻的投入和更低的系统性风险，获得更加稳定、可持续的全球增长。</p>\n  <p><strong>这正是“智赢·共生”的真正内涵。</strong></p>\n  <p>欲了解更多《报告》内容，洞察品牌全球化发展趋势，深入了解Pattern栢藤如何以全球电商平台加速器助力品牌长效增长，欢迎微信搜索【Pattern栢藤】关注官方公众号。</p>\n  <p><strong>&nbsp;</strong></p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-30T03:42:44+00:00", "fetched_at": "2026-10-01T03:49:13.750906+00:00", "fingerprint": "807bab1f428defae"}, {"source": "36氪 - 最新文章", "title": "理想再谈自研电池：电芯谁来造都行，前提是打通数据", "url": "https://36kr.com/p/3994346489084932?f=rss", "summary": "<p>自研电池上车，是理想汽车今年的核心战略之一。</p>\n  <p>今年6月，理想第一次公开回应业界对理想自研电池的种种质疑时，舆论焦点还集中在为何自研、是否可靠。近日，理想再次就自研电池召开沟通会。但这一次，质疑声渐弱，取而代之的是对车企自研对电池供应链重构的讨论。</p>\n  <p>在长达2小时的沟通会里，理想汽车联合创始人马东辉、理想汽车整车电动研发高级副总裁刘立国、电池研发负责人柳志民三位高管至少三次明确表态：欢迎任何电池厂商合作，但前提是必须纳入理想的自研电池体系下，也就是跨越理想的技术标准门槛，并实现数据与定义的深度互通。</p>\n  <p>今年以来，理想从新一代L8开始，全面搭载自研电池，此后，自研电池相继在旗舰电动产品MEGA、i9等车型上装载。这一动作直接导致理想在8月份，退出宁德时代前五大客户名单。</p>\n  <p>在此之前，理想的动力电池供应绝大部分来自宁德时代，常年成为宁德时代核心客户，同时引入欣旺达作为第二电池供应商。36氪曾报道，欣旺达在理想汽车的供货份额高点时也仅3成左右。</p>\n  <p>正是凭借在头部客户中牢牢锁住大体量的供货份额，宁德时代才长期坐拥超40%的市场体量。而理想自研电池的全面上车，意味着宁德时代在这家车企的供货地位即将动摇。</p>\n  <p>按照理想自研电池的定义，理想主导设计和研发电芯，欣旺达、中创新航等电池厂家负责代工生产电芯，电池包层面，BMS、热管理甚至绝缘材料，也都由理想自主研发、设计和生产。而从当下理想的自研电池合作名单来看，不再包括宁德时代。</p>\n  <p>马东辉告诉36氪等媒体，自研电池战略已经是理想汽车的核心战略，不会再有备份的合作模式。</p>\n  <p>理想整车研发负责人刘立国也补充说，未来不管是哪家供应商，都要按照理想汽车自研电池体系来做定制化开发，“不管价格高与低，必须满足我们的要求。”</p>\n  <p>这对于宁德时代再次进入理想的电池供应无疑是一个体系性的挑战。长期以来，宁德时代在高端市场的产品都是麒麟电池，这是一个系统性的整包电池方案，从电芯到整包，以及核心的热防护等各个子零件，都由宁德时代负责集成和供应。而基于保护技术专利等考虑，宁德时代从未有将麒麟电池拆开供应的先例，也并不向车企过多开放电池生产数据。</p>\n  <p>显而易见，这与理想自研体系下，主导电芯研发、自制电池包，并共享电池生产全流程数据的策略无疑产生了龃龉。</p>\n  <p>如果宁德时代要想再次进入理想汽车的电池合作体系，不光需要共享底层数据，也要开放电池系统，接受仅出售电芯的合作模式。这对于市值一度接近2万亿的电池龙头而言，显然是一次巨大的商业模式重塑。</p>\n  <p>而从战略上看，理想汽车推行自研电池的意志足够坚决。</p>\n  <p>马东辉谈到自研电池战略的价值时，明确表示，理想汽车是整车安全第一责任方，如果难以获取电池生产过程相关数据，就无法完全掌控电池这一核心零部件的全链条信息。</p>\n  <p>而自研电池模式下，可以让理想汽车实现三个层面的数据和能力打通。</p>\n  <p>首先，车企与电池厂商实现数据互通，电池安全能够更早预警；其次，自制电池包，可以让电芯、热管理、电驱、补能之间配合更默契，整车体验更细致；最后，打通售后标准，用户不再需要分别找电池厂和车企扯皮，理想全权为电池负责。</p>\n  <p>理想汽车CEO李想曾透露，自研电池战略起步于2020年。目前，理想自研电池团队规模达300余人。过去六年，理想汽车每年的电池研发费用都超过2亿元，目前累计已经投入十几亿元，这还不包括实验室等固定资产投入。</p>\n  <p>此外，理想还通过资本入股方式深度绑定了电池合作方欣旺达。早在2022年，理想就投资了欣旺达，“只不过当时大家没这么关注”，今年再次注资后，理想已成为欣旺达第二大股东。</p>\n  <p>刘立国表示，自2022年起，理想与欣旺达深度合作研发的电池便已上车交付，目前保有量已经达到42万辆，“整个售后质量表现完全不弱于任何一家电池供应商的产品，就当下产品而言，我认为没有任何差距”。这也为理想汽车全面将自研电池推上车提供了底气。</p>\n  <p>电池研发负责人柳志民进一步透露，通过研发、控制标准和AI算法检测体系，目前理想电芯制造的缺陷流出率，已达到PPB量级（十亿分之一）的水平。</p>\n  <p>如今，不仅理想汽车，小米、华为的鸿蒙智行，都在分别推动龙甲电池、巨鲸电池等车企主导研发的电池品牌，零跑汽车更是通过合资方式实现了自主电池制造。</p>\n  <p>一方面是车企的深度参与并掌控电池全栈技术的诉求，一方面是宁德时代推行品牌策略，获取高溢价的战略动作。两个战略主张的碰撞和协同，显然将是行业需要长期面对的议题。</p>\n  <p><strong>以下是36氪等媒体与理想三位高管的对话，不改变原意的基础上，经过编辑：</strong></p>\n  <h3>战略：未来只用自研电池，持开放合作态度</h3>\n  <p><strong>问：理想汽车为什么要自研电池？它的核心价值是什么？</strong></p>\n  <p><strong>马东辉：</strong>理想在2020年便确立了要自研纯电平台，我们认为新能源汽车用户关注的不是电池品牌，而是品牌背后的实际能力，比如电池的安全性、续航、补能等。自研，为的就是系统性解决这些问题。</p>\n  <p>第一，自研可以打通零部件、整车和用户间全链路的数据。我们可以提前掌握电池的使用状况和寿命趋势；如果生产过程中参数出现异常，我们可以提前发出预警。最理想的状态是，在电池装车交付之前就完成问题排查，而非等到用户手中才发现隐患。</p>\n  <p>第二，车上的电池并非独立存在，它与热管理系统、电驱系统、充电补能系统都息息相关，只有将其作为一个整体进行设计，才能真正把整车体验做到最优。我们认为，未来智能电动车的设计不应将电池、电驱、热管理视为孤立模块，各功能的分配和协同方式将发生深刻变化。</p>\n  <p>第三，打通产品定义、服务标准与售后服务体系。当前行业中仍然存在一些售后维修方面的痛点，车厂、用户、电池企业三方对于里程衰减等问题的判断标准可能各不相同。出了质量问题，究竟是集成层面的问题、电芯的问题、PACK的问题还是软件的问题？自研便意味着，如果质量标准未达成时，用户不需要关心问题出在哪个环节，理想来全面负责。</p>\n  <p><strong>问：理想在电池自研上的战略目标是什么？目前与宁德时代的差距有多大？</strong></p>\n  <p><strong>刘立国：</strong>理想在电池上的投入是高度聚焦的。&nbsp;</p>\n  <p>对比来看，其他电池企业需要同时布局储能、钠电池等多种体系，还要满足不同客户在2C、4C、5C及更高倍率上的产品需求，产品线非常多，投入也非常大。而我们只聚焦在5C超充这一个品类上，这是我们能把技术做深的前提。</p>\n  <p>同时在整个研发过程中，不仅仅是电池一个团队在投入：材料方面聚焦正负极研发，PACK层面包括散热等问题，还有整车材料部门和热管理部门协同支持。</p>\n  <p>在单品上的投入上，我们不弱于任何一家公司。</p>\n  <p>落到实际产品上，此前，我们自研定义的产品通过欣旺达代工的模式，从第一代的理想L8和L7开始就已经上市了，市场保有量已达42万台，整个售后质量表现完全不弱于任何一家电池供应商的产品。就当下产品而言，我认为没有任何差距。</p>\n  <p>但在面向未来的前沿技术上，比如固态电池的研发能力，我们与宁德时代确实还存在比较大的差距，这一点我们坦然承认。</p>\n  <p>宁德时代的定位是引领整个赛道，而我们当前采取的依然是依托于产品体验的策略，两者的战略不同，投入量级不同，技术积累自然也不同。不过对于当下的产品，凭借过往的研发积累和42万台车的交付验证，我们的表现是完全不弱于它的。</p>\n  <p><strong>问：现在很多车企都在做电池自研上车，但大家普遍没有回答一个问题：自研电池战略定位到底是什么？是备份方案，还是未来唯一的路线？这套自研代工的模式将来如果进一步推广，会把包括宁德时代在内的所有电池厂商都纳入进来？还是说即便宁德时代降价了，会作为一条独立的、平行的路线？</strong></p>\n  <p><strong>马东辉：</strong>我并不太清楚其他车企的思考，但理想汽车的方向是非常坚定的。从全新一代理想L8开始都会搭载理想自研的电池，这个战略��向是非常确定的，不是备份方案，并且我们有信心自研电池的综合性能表现一定会比以前更好。</p>\n  <p>现在我们具备了技术条件和PACK自制产线，另外公司发展到今天，整个投资体量也能够支撑这个战略的达成。所以对我们来说，这就是一个明确的战略选择，不存在备份的问题。</p>\n  <p><strong>刘立国：</strong>从PACK的角度来讲，本身和整车有非常强的集成关系，自研可以让整个PACK设计在整车平台上实现很好的平台化。在PACK统一的前提下，我们会对电芯提出定制化的要求。</p>\n  <p>未来不管是哪家供应商，都要按照我们的体系、我们的尺寸标准来做定制化开发。不管价格高与低，必须满足我们的要求，如果能满足我们三个打通的需求，我们当然非常开放地欢迎行业里每个优秀的伙伴一起合作。</p>\n  <p><strong>问：理想的规模相比宁德时代、比亚迪仍有差距。没有同等规模，自研电池在成本和品质上如何形成优势？</strong></p>\n  <p><strong>马东辉：</strong>关于规模和成本，我想先讲讲我们对成本的理解。电池的成本主要包括五部分：产线摊销、制造费用、原材料、物流仓储和研发投入。理想做自研，不是为了压低某一个环节的价格，更不是替换便宜的材料，这不符合理想的价值观。我们认为的降本机会点，是在保证性能和质量的前提下，提升全链路效率。</p>\n  <p>第一是产线投资和分摊： 比如花了10个亿建一条产线，分几年进行折旧分摊。我们通过电芯平台化尽可能复用产线。产线利用率提高，单件产品的摊销就会降低。</p>\n  <p>第二是制造费用：理想有智能工业团队和理想连山系统，能够监控生产过程、分析数据。一方面做质量预警，另一方面识别制造过程中的浪费、提升合格率。</p>\n  <p>第三是原材料： 过去原材料价格波动时，我们更多是被动接受。自研自制和自研代工之后，我们可以在上游材料和相关风险管理上更主动，提升对成本波动和供应稳定性的管理能力。</p>\n  <p>第四是物流、仓储和运输： 统一的电池体系可以让仓储、包装、工装和运输更高效，减少重复存储和运输带来的浪费。</p>\n  <p>第五是研发投入：研发投入最终一定会体现在成本中。过去由供应商承担研发，成本会反映在采购价格里；现在理想承担研发投入，合作伙伴聚焦制造和工艺，整个链路的分工会更清晰。</p>\n  <p>自研的目标是在性能、质量和安全不打折的前提下，在每个环节减少浪费、提升效率。</p>\n  <p><strong>问：电芯平台化方面，理想是如何规划的？</strong></p>\n  <p><strong>柳志民：</strong>在电芯层面，我们目前有5C三元锂和5C磷酸铁锂两类解决方案，每个品类最多两款电芯。</p>\n  <p><strong>问：外界有报道称，理想过去五年在电池研发方面仅投入约5亿元。实际累计投入是多少？</strong></p>\n  <p><strong>柳志民：</strong>关于研发费用，我也做一个澄清。外界提到的5亿元，更多是实验室投料、测试验证等研发费用的一部分。理想汽车每年的电池研发费用都在2亿元以上，过去六年累计投入十几亿元。此外，还有固定资产等相关投入，整体研发投入规模比较大。</p>\n  <p><strong>问：有资料称，截至2026年初，欣旺达电化学研发团队约有1万人，宁德时代相关工程师超过3万人，理想汽车电池研发团队约有300人，如何看待整车企业与动力电池企业研发人员规模上的差异？</strong></p>\n  <p><strong>刘立国：</strong>人员规模与企业的业务量和研发范围高度相关。一家动力电池企业可能同时服务多家整车企业，还要覆盖储能、不同材料体系和平台技术，投入的人力自然更多。</p>\n  <p>对于一家整车企业而言，更重要的并不是研发人员的绝对数量，而是研发深度、聚焦方向以及是否具备清晰的用户和产品目标。</p>\n  <p><strong>问：宝马同样采用电池自研代工模式，但消费者接受度较高。中国企业在推进核心零部件自研的过程中，���何应对“去品牌化”的认知挑战？</strong></p>\n  <p><strong>刘立国：</strong>背后的原因是多方面的，包括品牌历史积淀、市场认知基础等因素。对于新势力企业而言，成立时间较短，客观上确实存在一定影响。</p>\n  <p>但我举一个具体的例子：理想在2018年、2019年就开始定义纯电平台的充电倍率需求了，当时跟电池厂沟通，行业普遍认为2C已经够用，当时头部供应商都告诉我们4C不可能实现，但我们已经提出超过4C的目标了。</p>\n  <p>在这一背景下，理想亲自主导开发了早期的demo产品，验证了整条技术路线的可行性，才推动了5C路线的持续推进。从2020年启动自研，到2023年发布“双能战略”，再到2024年5C电池和超充网络的全面推广，我们在电池与整车两端均投入了大量研发资源。</p>\n  <p>在品牌对外传播的过程中，我们确实面临过不少质疑，用户对新势力企业自研电池的认知还需要时间建立。</p>\n  <p>马东辉： 我反而一点都不担忧。回想2017年、2018年，大家可能都没有听说过理想汽车，也不太会将理想纳入20万以上、30万以上车型的考虑范围。但十年过去了，随着理想和国内其他新势力的产品持续提升，国内20万以上市场，理想的市占率在部分地区已经超过BBA。我始终强调，品牌不是一成不变的，用户价值才是能经历时间考验的。</p>\n  <h3>技术：锚定5C、15C，固态电池暂时不做重投入</h3>\n  <p><strong>问：在制造端，理想目前在单体电芯缺陷流出率（PPB）这一指标上做到了什么水平？</strong></p>\n  <p><strong>柳志民：</strong>关于制造端的PPB（十亿分之一）指标，我先简要说明一下我们对制造一致性的理解。</p>\n  <p>一个完整的产品方案通常分为三个阶段：第一阶段，围绕产品需求形成完整的技术方案，技术方案会关联所有产品的技术特性；第二阶段，在工程方案中将技术特性转化为工程特性；</p>\n  <p>第三阶段，让工程特性在制造端跟具体的控制计划严丝合缝地对应上。在电芯层级，我们设有严格的控制标准和控制项，电芯层有8000余项控制标准，PACK级别1000余项，合计9400余项控制标准，以此保障电池制造的一致性。</p>\n  <p>除了控制计划体系之外，我们在产线中部署了全流程在线CT AI检测系统和液态镜头CCD相机 AI检测等，能够有效监测制造过程中的异常。</p>\n  <p>同时，我们将AI算法与理想连山系统打通，通过AI方法识别异常趋势，实现持续优化和迭代。目前来看，我们的一致性表现能够满足产品需求，电芯制造的缺陷流出率已达到PPB量级的水平。</p>\n  <p><strong>问：理想自研电池在整车电控层面具体有哪些技术协同？</strong></p>\n  <p><strong>刘立国：</strong>目前，电芯、PACK、BMS与整车之间的技术协同已经非常深入，我举几个典型场景。</p>\n  <p>第一个场景是低温工况下的放电功率表现。过去按照传统的与电池厂合作模式，电池厂会提供一张功率MAP，标定不同温度下的放电功率上限，整车只能按照这张MAP进行标定。这种方式会带来一些问题，尤其是磷酸铁锂电池在低温工况下容易出现动力不足甚至趴窝的情况。</p>\n  <p>通过自研，我们拥有自主开发的APC算法和ATR算法，能够将SOC和功率MAP计算得更加精准。从驾驶者踩下加速踏板到需求信号发出，存在几十毫秒级别的延迟，我们利用这段时间窗口为电池提供前馈控制信号，通过整车控制算法与电池系统的深度协同，能够显著缓解低温工况下动力性不足的问题。这是自研在实际落地中带来的直接价值。</p>\n  <p>第二个场景，除了功率层面的协同之外，在热管理等方面也实现了更深层次的融合控制。通过自研，我们能够掌握电池系统中每颗电芯在生产阶段的容量等基础数据，尤其是经过长期使用后，随着电池健康度的变化，实现更加精细化的协同管理。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-30T05:41:47+00:00", "fetched_at": "2026-10-01T03:49:13.750900+00:00", "fingerprint": "07a1e00013876966"}, {"source": "36氪 - 最新文章", "title": "三天四千万，一周破亿：琳朝现象的背后，是一场文化品牌的静默崛起", "url": "https://36kr.com/p/4005786829312136?f=rss", "summary": "<p>未来真正的奢侈，是文化、价值观的输出，是中国特有的文化叙事。&nbsp;</p>\n  <p><strong>9月25日，琳朝南京德基店正式开业。但真正的震动，发生在更早之前。</strong></p>\n  <p><strong>试营业三天，仅对德基广场少量VIP会员开放，单日营业额连续突破千万，三天累计四千万多万。正式开业后，热度不减反增。每天店外都在排队，平均等待进店时间超过3小时。在德基广场，这条队伍成了一道独特的景观——有人早上商场刚开门就在排队，有人下午排到晚上才进得去，还有人自带凳子在队伍里。</strong></p>\n  <p><strong>在德基和行业内部，这个消息引发了极大的轰动。有消费者从上海、杭州赶来，只为看一眼这家从兰州深巷走出的品牌。</strong></p>\n  <p><strong>此时，黄金珠宝行业其实正在经历一场集体焦虑。金价从高点回落，首饰消费量同比暴跌，头部品牌累计关店近千家。行业过去二十年赖以生存的增长模式——渠道扩张、金价红利——正在同时失效。</strong></p>\n  <p><strong>但琳朝的热度不减。它跳脱在金价波动之外，不只是靠渠道创新驱动，不靠商业模式的微创新。它靠的是什么？这样“反常”的现象是非常值得拆解的商业案例。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_6bc0081fc7dc439cbc51f270e92efeb4@6056299_oswg121302oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(琳朝南京德基店开业当天)</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_1a0206aee1e34495ac75e317c70ecfff@6056299_oswg4247oswg1080oswg127_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>行业在“靠”，琳朝在“脱”</strong></p>\n  <p><strong>黄金珠宝行业的2026年，大多数品牌在做同一件事：靠。</strong></p>\n  <p><strong>靠渠道优化，靠产品微创新，靠涨价保利润，靠关店控成本。这些都是合理的商业选择，但本质上都是在既有框架内“靠”得更近。</strong></p>\n  <p><strong>而琳朝在做的，是脱。</strong></p>\n  <p><strong>脱离渠道驱动的惯性，脱离黄金行业的传统叙事，脱离西方奢侈品的价值体系，脱离“金价+工费”的定价逻辑。</strong></p>\n  <p><strong>这种“脱”，在南京德基店的开业过程中表现得淋漓尽致。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_af5a4aa917d04990a4529e1b4a74351b@6056299_oswg69046oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>外界看琳朝，首先看到的是极致手工和原创精神造就的产品唯一性。99%的产品为原创设计，手工占比接近100%，涉及花丝、錾刻、精雕、锻打、水磨、炸珠、微镶、榫卯镶嵌等几十种手工艺。一件繁复的花丝作品，打磨周期可能长达数月甚至一年。2024年，因订单爆满，琳朝两次暂停接单。2025年，琳朝逆势涨价10%至20%，工期拉长到一年，依然供不应求。</strong></p>\n  <p><strong>这种“唯一性”在行业里有多稀缺，需要放在同类品牌的对比中才能看清。</strong></p>\n  <p><strong>老铺黄金走的是“用中国符号进入西方定义的奢侈品体系”，45家自营门店、273亿营收，消费者与国际五大奢侈品牌重合率超80%。</strong></p>\n  <p><strong>君佩走的是“珠宝级黄金”的年轻化路线，两年时间进入大部分一线商圈，靠风格和用户细分快速复制。它们在商业上都成立，但对比之下，在产品的手工程度和原创力度上，与琳朝不在同一个坐标。</strong></p>\n  <p><strong>琳朝的“唯一性”不来自渠道覆盖，不来自定价策略，而来自一个更底层的事实：产品无法被复制。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_8e0f3393ddc54f298c4404cff3cfb884@6056299_oswg1207651oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(琳朝三换围挡的排队现象，图片来源于网络)</strong></p>\n  <p><strong>但产品只是表象。南京德基店的开业过程，本身就是一场关于“极致”的偏执表演。围挡换了三次，每一次都比上一次更用心。手绘稿可以免费撕走，配着手写短句，或言志，或寄情。原定七月开业，最终延至九月，两次推迟，只为把最好的呈现带给南京。每月高昂的租金在燃烧，但琳朝选择慢。</strong></p>\n  <p><strong>南京城市专属款，是琳朝为这座城市准备的礼物。从秦淮灯彩到雨花石，从谢道韫到桃花扇，从辟邪到“没有一只鸭子能游出南京”的烟火气。六件作品，六个维度，每一件都从南京文化的内部生长出来。这不是“兰州设计+南京元素”的简单拼贴，是从理解到创造的系统性转译。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_313b4b7935664a3f852ea1743ea4aaf0@6056299_oswg36339oswg1080oswg360_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>小到包装体系，琳朝也吹毛求疵。每一个细节，都在说同一句话：极致、不敷衍。</strong></p>\n  <p><strong>而这一切背后，是琳朝对传统文化的“重新翻译”。它注入了个体价值的导向——让龙不再高高在上，成为每个勇敢的人。为角落发声，对镯口的设计，中国当代留白。为自己所爱的事业不问西东。</strong></p>\n  <p><strong>“靠”是在既有规则里做得更好，“脱”是重新定义规则本身。这种差异，不是商业策略的差异，是企业文化根性的差异。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_cfe291cb12a04161bcde251e7403b956@6056299_oswg4659oswg1080oswg126_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>产品是果，文化是因：</strong></p>\n  <p><strong>琳朝的护城河不在柜台里</strong></p>\n  <p><strong>琳朝今天的所有现象，都是果。产品也是果。文化才是因。</strong></p>\n  <p><strong>这个因，是琳朝的品牌文化和企业文化。它不是一个抽象的概念，而是长在企业组织里的土壤，具体、可感、有温度。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_98b5573676f84e91be91daa0f972582a@6056299_oswg28690oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(图片来源于网络)</strong></p>\n  <p><strong>有幸去拜访过一次琳朝的公司。一个老旧的居民楼里，却安放着无数眼里有光的人。从上到下，每个人都在享受极致热爱带来的快乐，享受创造的过程。创始人马朝贤化名“角落先生”，基本不出兰州，在角落里痴迷、癫狂。他的状态感染了整个团队——在那里，痛苦变成了快乐，工作变成了创造。这是琳朝最底层的文化：极致热爱。</strong></p>\n  <p><strong>这种热爱投射到产品上，就变成了“个体价值导向”的设计哲学。琳朝让龙不再高高在上，而是成为每一个勇敢的人；为角落发声，在手镯的对口处精心錾刻；牡丹亭没有亭子，悟空里隐藏着自我——那是中国当代的留白，是给拥有者自己填写的空间。琳朝倡导每个人都勇敢做自己，做极致的自我。有了这样的文化，他们才可以追求每件事、每件产品的极致。好的产品，好的商业，自然而然会自己生长。这是以人为本。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_b1a1e28c780f4969b5a342624e7af7c3@6056299_oswg43137oswg1080oswg479_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(图片来源于网络)</strong></p>\n  <p><strong>而这种以人为本，往前再走一步，就是琳朝相信的另一件事：你只要善良，就会有智慧。你一定要在别人不知道的地方去做对他好的事情，才能感动他。所以在产品的背面、接口处、内壁——那些千百年来被默认“不必在意”的角落——琳朝花最多的时间去錾刻。创始人说：“每一件首饰，看不见的地方做好了，才能让你觉得干净。”这不是为了被人看见才做得好，是即便没人看见也要做好。这是善良先行。</strong></p>\n  <p><strong>有了热爱，有了对人的尊重，有了善意，还需要一样东西来守住它们。琳朝的答案是：本分长期。它不追求规模快速扩张，“即便未来在中国市场做到极致，店铺数量也可能控制在个位数”。在古法黄金品牌纷纷加速开店的当下，琳朝用二十一年时间只开一家店。它的答案是“一城一店一设计”——每进入一座城市，只开一家店，每一家店都为所在的城市单独设计。这是一种长期主义的心态：享受创造的过程，而不是追逐短期的结果。</strong></p>\n  <p><strong>企业文化不是挂在墙上的口号，是长在组织里的土壤。产品从这片土壤里长出来，商业从这片土壤里长出来，德基店排队六小时的现象，也从这片土壤里长出来。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_30059b3b7cb9492c8c2645e577f68b47@6056299_oswg105845oswg1080oswg592_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>（琳朝总部·兰州金城关）</strong></p>\n  <p><strong>琳朝没有在一线城市，没有在商业中心。它在西北兰州，在金城关一条老街道的居民楼里，隔壁是汽修厂和药店。</strong></p>\n  <p><strong>这种选址，反而成就了文化的土壤。兰州不急躁。一个品牌想要诞生，一个伟大的品牌，一定是磨出来的。慢，反而养成了品牌的核心竞争力。</strong></p>\n  <p><strong>这让我想起那些同样“偏僻出身”的国际奢侈品牌。</strong></p>\n  <p><strong>国际顶级珠宝品牌宝格丽（BVLGARI）的故事起源于希腊伊庇鲁斯山区的 Paramythia 小镇，Loro Piana 的总部则在意大利皮埃蒙特大区的夸罗纳（Quarona），一个位于阿尔卑斯山脚下的小镇。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_17e335d341334fbda98d5409df0b4e70@6056299_oswg857461oswg1080oswg629_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>Loro piana总部Quarona小镇</strong></p>\n  <p><strong>这些品牌的“神殿”在巴黎、在米兰、在纽约，但它们的“根”始终扎在那些不被游客注意的小地方。</strong></p>\n  <p><strong>琳朝的创始团队也同样散发出一种对品牌原生力的执着，创始人马朝贤，行业内极少数手艺人出身的创始人，叛逆、感性、痴迷、癫狂，几乎很少离开兰州这个城市，在金城关的角落里专注做自己的东西。品牌CEO、日初资本创始人陈峰，内向、沉稳、理性，提出“慢是琳朝的竞争力”。琳朝的未来在世界，但根永远在兰州在金城关，守住来处，望向远方。有根在，琳朝不会飘；有根在，琳朝才能走远。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_ded2806f0f694a7086860df1cb0b62b0@6056299_oswg4685oswg1080oswg126_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>中国品牌的世界之路：</strong></p>\n  <p><strong>有人在奔赴未来，有人在回到源头</strong></p>\n  <p><strong>未来中国的商业，可能会走向两个完全相反的方向。</strong></p>\n  <p><strong>一个奔赴未来，投身AI、机器人与新的生产力革命，在未知中创造新的文明秩序。一个回归文明的源头，回归文化、自然、信仰与真实关系，探索中国文化的现代化。一个探索文明的下一站，一个寻找文明的源头。</strong></p>\n  <p><strong>琳朝的现象，并不是孤例。</strong></p>\n  <p><strong>近几年，越来越多的中国品牌正在这条“回归”的路上崛起。它们各自扎根于不同的土壤，却共享同一种气质——不追风口，不抄模板，不急于证明自己。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_84fab787ac704a1197c4368d2496a13e@6056299_oswg1082620oswg1080oswg799_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(图片来源于网络)</strong></p>\n  <p><strong>松赞酒店扎根滇藏线二十余年，将喜马拉雅地区的习俗、信仰、手工艺用故事的形式传播出去。它不建在景区里，而是建在村庄中，让旅行者住进���族人的家里，吃他们吃的食物，走他们走的路。它不是酒店，是一扇通往另一种生活方式的窗。&nbsp;</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_c96826eb961648bfbc1313ab4a5550d5@6056299_oswg780359oswg1080oswg528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(观夏北京店铺)</strong></p>\n  <p><strong>观夏从中国人的共同生活经验中提取气味意象——桂花、白茶、昆明的雨后泥土，在云南景迈开启“东方香料归源计划”。它不模仿法国格拉斯，不复制意大利香氛的叙事，而是回到中国人自己的嗅觉记忆里，寻找那些被遗忘的气味。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_a88048a0d73d4ec0ab950e964a743ef2@6056299_oswg904047oswg1080oswg577_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(图片来源于网络)</strong></p>\n  <p><strong>山下有松从中原文化出发，连续两年以展览对话巴黎时装周。它不把“中国元素”当作装饰贴在西方版型上，而是从嵩山、黄河、中原文明的土壤里长出自己的设计语言。它去巴黎，不是去“被认可”，是去“对话”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_512f32b755bc4c508e3ccc2c5707565c@6056299_oswg1125285oswg1080oswg706_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(泡泡玛特巴黎店)</strong></p>\n  <p><strong>泡泡玛特用潮玩语言重新定义中国IP的全球表达。它的LABUBU在东南亚、在欧美引发排队狂潮，靠的不是“中国风”，而是一种跨越文化的情感共鸣——一个丑萌的小怪物，让全世界年轻人觉得“它懂我”。</strong></p>\n  <p><strong>张雪机车用极致性能证明中国制造的高度。在重庆的山路上，在达喀尔的赛场上，它不靠“性价比”取胜，而是用一台又一台自主研发的发动机，告诉世界：中国摩托可以站在技术的最前沿。</strong></p>\n  <p><strong>这些品牌，摆脱了中国过去单一靠产品微创新、渠道驱动的传统模式，也摆脱了西方奢侈品产业身份、财富、地位叙事的定位体系。它们不为身份背书，不为财富代言，为热爱奔赴，为创造而生。</strong></p>\n  <p><strong>它们的共同点是：都不在“中心”，都选择“慢”，都把根扎在某个具体的地方。 松赞在滇藏线，观夏在云南景迈，山下有松在中原，琳朝在兰州金城关。它们不急着被世界看见，它们先在自己的角落里，把一件事做对了。</strong></p>\n  <p><strong>中国除了需要快的——走在时代前沿、探索文明未来的科技品牌、智慧AI产业，也需要慢的——探索文化文明源头的文化品牌。前者让我们走得更快，后者让我们走得更远。</strong></p>\n  <p><strong>一个奔赴未来，一个回归源头。 两者并不矛盾，它们共同构成了中国商业的完整图景。快的探索文明的下一站，慢的寻找文明的根。没有后者，前者会失去方向；没有前者，后者会被时代遗忘。</strong></p>\n  <p><strong>琳朝的意义，不在于它现在有多大，而在于它证明了：在中国，一个品牌可以不靠渠道扩张、不靠西方叙事模板、不靠金价红利，只靠文化和价值观，就能被看见。</strong></p>\n  <p><strong>未来真正的奢侈，是文化、价值观的输出，是中国特有的文化叙事。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_3dfafdb7ae3243aea8ab3fde565382fa@6056299_oswg4513oswg1080oswg127_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>未来真正的奢侈，是文化</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_5ff0b068f36e4ee583d3bea6a66748f8@6056299_oswg32982oswg1080oswg477_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>未来真正的奢侈，不是材料的重量，不是Logo的大小，不是身份与财富的炫耀。</strong></p>\n  <p><strong>未来真正的奢侈，是文化，是价值观的输出，是一种中国特有的文化叙事。</strong></p>\n  <p><strong>过去一百年，全球奢侈品的定义权掌握在西方手中。卡地亚定义“权力与荣耀”，爱马仕定义“传承与等待”，梵克雅宝定义“浪漫与永恒”。这套叙事的内核是外放的、对外的、向社会证明的——你拥有什么，你就属于哪个阶层。Logo是旗帜，材质是武器，价格是门槛。它的底层逻辑是“让别人看见我是谁”。</strong></p>\n  <p><strong>但中国人对奢侈的理解，从来不在这个坐标里。</strong></p>\n  <p><strong>中国人的精神底色里，有老庄的“道法自然”“无用之用”，有孔子的“君子不器”，有王阳明的“心外无物”。这种哲学滋养出来的奢侈，不是向外征服，是向内安顿。中国文人玩玉、赏瓷、品茶，从来不是为了向别人证明什么，而是为了与自己对话。一块玉的价值不在它值多少钱，而在“君子比德于玉”——温润、自持、不张扬。一件器的意义不在它有多贵，而在“器以载道”——它承载的是天道人心，是使用者对自我的期许。</strong></p>\n  <p><strong>这是两种完全不同的奢侈品叙事。</strong></p>\n  <p><strong>西方奢侈品的奢侈是“拥有”——拥有稀缺、拥有身份、拥有被仰望的位置。中国式的奢侈是“成为”——成为更好的自己，成为更完整的人，成为不被外界定义的存在。西方奢侈品让你“被看见”，中国奢侈品让你“看见自己”。</strong></p>\n  <p><strong>琳朝恰好长在这条脉络上。</strong></p>\n  <p><strong>它不模仿卡地亚的叙事，不复制爱马仕的视觉，也没有依附西方奢侈品牌对身份地位的定位体系。它只是用三代人的手，在兰州的金城关，做自己会做的事情。它不试图成为“中国的卡地亚”，它只是成为“兰州的琳朝”。</strong></p>\n  <p><strong>而支撑这个选择的，是一套完整的文化属性。如同琳朝的设计哲学里，有一个核心理念叫“个体价值导向”。让龙不再高高在上，而是成为每一个勇敢的人；为角落发声，在手镯的对口处精心錾刻；牡丹亭没有亭子，悟空里隐藏着自我——那是中国当代的留白，是给拥有者自己填写的空间。琳朝在用中国传统文化做一件事：重新翻译。它不把龙做成权力的象征，而是做成“勇敢做自己”的隐喻；它不把花丝做成炫技的展示，而是做成“看不见的地方也要做好”的修行。它倡导每个人都勇敢做自己，做极致的自我。</strong></p>\n  <p><strong>这背后是价值观的支撑。琳朝相信：你只要善良，就会有智慧；你一定要在别人不知道的地方去做对他好的事情，才能感动他。在产品背面、接口处、内壁——那些千百年来被默认“不必在意”的角落——琳朝花最多的时间去錾刻。创始人说：“每一件首饰，看不见的地方做好了，才能让你觉得干净。”这不是为了被人看见才做得好，是即便没人看见也要做好。 这和王阳明的“致良知”如出一辙——不是做给别人看，是做给自己的心看。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_bcac4807c63a4db6be4f1a70f8d614f0@6056299_oswg801835oswg1080oswg496_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>琳朝的企业文化，就是中国独有的价值体系。这才是琳朝的核心价值驱动。</strong></p>\n  <p><strong>如果琳朝是一棵树，那么——中国文化是土壤。 老庄的“无用之用”、王阳明的“致良知”、中国文人的“器以载道”、传统手工艺的“慢工出细活”——这些不是琳朝从书本里学来的概念，是它扎根的那片土地天然供给的养分。兰州金城关的居民楼、隔壁的汽修厂和药店、黄河边不急不躁的日常，都是这片土壤的一部分。</strong></p>\n  <p><strong>企业文化与价值观是树干。 极致热爱、以人为本、善良先行、本分长期——当这四个词不是挂在墙上的口号，是长在组织里的年轮。它们决定了这棵树能长多高、能扛多大的风、能活多久。树干不显眼，但它是所有枝叶的起点。</strong></p>\n  <p><strong>产品是自然生长的树枝。 龙回首、牡丹亭、角落镯、悟空——每一件作品都是从树干上长出来的枝丫。它们形态各异，但根脉相连。没有树干，就没有树枝；没有文化，就没有产品。产品是果，不是因。</strong></p>\n  <p><strong>琳朝今天“反常”的商业现象是自然生长的叶脉。 三天四千万、一周破亿、排队六小时、消费者从上海杭州赶来——这些是叶脉，是光合作用的结果，是外界能看到的部分。但叶脉再繁茂，也只是树冠的表象。真正决定这棵树能不能持续生长的，是埋在土里的根和看不见的年轮。当一个品牌的价值不再依赖金价波动、不再依赖渠道扩张、不再依赖西方叙事模板，而是扎根于本土文化、极致手工和原创精神时，它便获得了一种超越周期的能力。</strong></p>\n  <p><strong>现象，是果。产品，也是果。文化，才是因。中国需要更多这样的品牌。不是卡地亚的中国版，而是从兰州、从大理、从中国每一个具体的角落长出来的、带着手温的、敢于慢下来的品牌。它们不急着被世界看见，它们先在自己的角落里，把一件事做对了。</strong></p>\n  <p><strong>未来真正的奢侈，是文化，是价值观的输出，是一种中国特有的文化叙事。 它不喧哗，不张扬，不急于证明。它相信，一个品牌如果真正扎根于自己的文化土壤，用极致的手工和原创精神做每一件事，那么好的产品、好的商业、好的口碑，自然而然会自己生长。然后，世界会自己走过来。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_51de6127961e406a94f330ba2112b2a2@6056299_oswg124854oswg1080oswg710_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>(图片来源于网络)</strong></p>\n  <p><strong>一个从兰州金城关居民楼里走出来的品牌。</strong></p>\n  <p><strong>没有在一线城市开过店。没有明星代言。没有铺天盖地的广告。今天走进了南京德基，和卡地亚、宝格丽、梵克雅宝做了邻居。</strong></p>\n  <p><strong>消费者从上海、杭州赶来，拖着行李箱排六个小时的队，预定模式依然一件难求。这件事放在十年前，没有人会相信。放在五年前，也没有人会相信。但它发生了。</strong></p>\n  <p><strong>这不是一个品牌的胜利。这是一种文化自信的落地。当中国消费者不再仰视西方，开始回望自己的文化根脉，开始被那些真正扎根于本土、拥有极致手工与原创精神的品牌打动——这才是琳朝现象真正的土壤。</strong></p>\n  <p><strong>而这土壤下面，还有更深的东西。</strong></p>\n  <p><strong>琳朝的故事，说到底是一个关于“热爱”的故事。而这，不只是琳朝的故事。</strong></p>\n  <p><strong>它属于每一个在自己角落里默默做事的人。可能现在还不为人知，可能还需要很长时间的沉寂，可能在外人看来“走得不够快”。但他们知道自己在做什么，他们享受的是创造的过程，而不是被看见的结果。</strong></p>\n  <p><strong>中国需要更多这样的品牌。中国也需要更多这样的人。真正扎根于自己的土壤，用极致的热爱本分长期的做好每一件事。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_9dcf4cb2f37f464cbccafa80236e42a5@6056299_oswg1443oswg659oswg54_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_2a2811e50246422f8a0f16069a5c4b2b@6056299_oswg8804oswg1080oswg199_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_d99b7de7a6 ": "Dutch police say they arrested a 24-year-old Amsterdam man in connection with ShinyHunters, the hacking group that claimed responsibility for high-profile attacks on Ticketmaster, Rockstar Games, and more recently, the FBI. In a press release, Dutch authorities state that they arrested the suspect on September 15th - just days before the hacking group claimed to [&#8230;]", "category": "tech", "published_at": "2026-09-29T21:50:31+00:00", "fetched_at": "2026-09-30T03:42:39.646676+00:00", "fingerprint": "9b5562e510053561"}, {"source": "The Verge", "title": "BMW’s revamped i3 boasts up to 468 miles of range", "url": "https://www.theverge.com/transportation/1002173/bmws-revamped-i3-boasts-up-to-468-miles-of-range", "summary": "When BMW first announced it was reimagining the i3 as an all-electric four-door sedan built on its Neue Klasse platform, it left out a lot of important details, like battery capacity, range, and price. Today, the German automaker is finally starting to fill in the blanks on the i3. Let's start with price. BMW says [&#8230;]", "category": "tech", "published_at": "2026-09-29T22:01:00+00:00", "fetched_at": "2026-09-30T03:42:39.646671+00:00", "fingerprint": "f7df048676ed882b"}, {"source": "The Verge", "title": "Trump orders US government to call AI ‘Super Intelligence’", "url": "https://www.theverge.com/policy/1002468/trump-ai-superintelligence-executive-order-ai", "summary": "The US executive branch is no longer acknowledging the existence of \"artificial intelligence.\" Going forward, official policy websites, policy documents, and press releases will refer only to \"Super Intelligence,\" thanks to a new executive order signed by President Donald Trump. \"The word super is the best word of all, and it's the simplest,\" Trump said [&#8230;]", "category": "tech", "published_at": "2026-09-29T22:25:45+00:00", "fetched_at": "2026-09-30T03:42:39.646666+00:00", "fingerprint": "1f2684ece82a4b59"}, {"source": "The Verge", "title": "Sam Altman says OpenAI won’t go public until its models are safe", "url": "https://www.theverge.com/ai-artificial-intelligence/1002505/sam-altman-openai-ipo-devday-ai-safety", "summary": "For months, people have wondered when OpenAI will go public. CEO Sam Altman says it won't happen until the company can make better promises about model safety, with no firm timeline in sight. \"We intend to continue with AI progress … but as the models have had this surge forward in capability, and we see [&#8230;]", "category": "tech", "published_at": "2026-09-30T00:19:13+00:00", "fetched_at": "2026-09-30T03:42:39.646655+00:00", "fingerprint": "d6b003b6ebfae6b2"}, {"source": "36氪 - 最新文章", "title": "腾讯 Marvis做 Agent 的不同选择：把用户的电脑“管理起来”", "url": "https://36kr.com/p/4004514681016456?f=rss", "summary": "<p>&nbsp;</p>\n  <p>文｜李炤锋 &nbsp;&nbsp;</p>\n  <p>编辑 | 张雨忻</p>\n  <p>近日，腾讯推出新版 Marvis，将这款以“小黑马”为形象的个人 Agent 定位升级为“AI 管家”。智能涌现了解到，截至本月，Marvis 的日活跃用户数比 5 月上线时增长近四倍。</p>\n  <p>Marvis 源自做应用分发的腾讯应用宝团队。今年 5 月上线时，它被称作“操作系统层级的个人 AI 助手”，重点是按用户指令完成安装软件、查找文件等任务。</p>\n  <p>这次改版，除了电脑文件管理，腾讯把电脑系统和硬件管理放到更显眼的位置：Marvis 能检查电池健康、找出高耗电应用，也能调整开机启动项。Marvis 业务负责人蔡建涛近日在一场活动上说，5月上线以来，用户的真实用法与团队最初设想的不太一样，“很多用户真的把我们当成一个 AI 管家在使用”。</p>\n  <p>此前，蔡建涛曾在公开采访中披露，本地文件是使用最多的一类场景，涉及 44% 的用户；另有 28% 用它管理电脑和硬件。一些Marvis早期用户的反馈显示：下载 Marvis 后，不知道该让它做什么。蔡建涛对此回应称：“这次的改版有一半就是为了解决这个问题。”<strong>新版主打电脑、文件、软件和浏览器四类任务。</strong></p>\n  <p>当下，市面上数量繁多的 Agent 所切入的场景已经完成分路。</p>\n  <p>较早的一路瞄准办公场景。3 月，Anthropic 为 Claude Cowork 开放操作电脑的研究预览：得到许可后，它可以使用桌面应用完成简报、报告。国内，WorkBuddy、千问办公、豆包工作等办公类 Agent 同样是让用户交办工作，拿回文档、网页、PPT 等成果。</p>\n  <p>另一路瞄准线上生活。Meta 本月推出 Muse，让它在云端虚拟电脑里处理邮件和旅行预订；阿里的千问 App 也宣布自己进入个人 Agent 赛道，接入点餐、购物、机票酒店预订等多个生活场景。全球厂商接连推出个人 Agent 产品——美国创投机构 Menlo Ventures 与市场研究公司 Morning Consult 今年 7 月调查了 5067 名美国成年人：在使用 AI 的受访者中，41% 试过 AI Agent，24% 定期使用。至少在美国的 AI 用户中，Agent 已走出少数人尝鲜的阶段。</p>\n  <p>办公 Agent 和线上生活 Agent，需要借助PC端平台来完成任务，而Marvis想做的，是管理用户的终端本身，同时成为PC端各种零散任务的“管家”。</p>\n  <p>并且，Marvis有着比较独特的Agent调用路径：先用端侧模型为获授权的资料建立索引，用户搜索时再利用索引查找，按需调用云端模型——这与 WorkBuddy 等办公 Agent 基本依靠云端模型的思路不太一样。</p>\n  <h2>01 Marvis 的“管家”，做到了哪一步</h2>\n  <p>想要实现“管电脑”，先得深入到系统层。</p>\n  <p>在新版本演示中，Marvis 调整了一台 Mac 的开机启动项，还找出了影响续航的高耗电应用。不过，碰到需要系统权限的操作，它会停在确认窗口，等用户输入密码。<strong>能帮用户做多少，仍取决于操作系统开放哪些功能。</strong></p>\n  <p>在同类产品上，可以看到类似的操作。微软去年在部分 Windows 电脑的设置中加入自家 Agent，后来也试着向第三方 Agent 开放文件和设置功能，但前提是用户须主动开启相关功能，并同意它访问敏感信息。</p>\n  <p>新版文件管家功能增加了资料库更新提醒。在公开演示中，Marvis团队以一个校园招聘场景举例：HR 建好简历资料库后，又收到 50 份简历，新文件存进电脑，Marvis 会提示将它们加入原有资料库，但这一过程最终需要由用户确认。</p>\n  <p>蔡建涛说，“Marvis 搜索本地文件时，会在用户授权的范围内，用端侧模型处理文件内容、建立索引，这样能大大加快搜索文件的速度。一些 Agent 没有‘用端侧模型建立文件索引’这一步，如果让它找一个五年前的文件，花一小时也是有可能的。”</p>\n  <p>本地处理需要算力，也曾是 Marvis 的一道设备门槛。蔡建涛说，5 月版要求六核处理器和 16GB 内存，主要因为知识库耗费算力；新版简化了本地知识库的搭建流程，这使得电脑配置可以降至四核、8GB，让用户“先能用起来”。</p>\n  <p>Marvis 还计划把文件搜索扩到 NAS （私有云/网络存储设备）这类私人存储设备，目前与英特尔、飞牛合作打造了定制版 NAS ，计划 10 月推出。在此前的演示中，已经可以初步看到Marvis结合NAS的能力：用户搜索“大海”，Marvis 可以定位到视频里海面出现的片段；搜索“声音中带有掌声的视频”，则能快速定位到对应的声音片段。</p>\n  <p>一位腾讯人士解释了这项视频搜索背后的流程：在用户授权的范围内，Marvis 先解码视频、处理画面和声音，再建立索引。面对十几 TB 的 NAS，它会先处理用户近期关注的资料，再根据搜索需求扩大范围。</p>\n  <p>针对用户安装软件的需求，蔡建涛说，改版前每天约有四五万人用它做这件事。新版将安装、更新和操作软件等需求集中到“软件管家”这个独立的功能上，让用户更容易找到。</p>\n  <p>与此同时，Marvis团队还展示了在游戏场景的应用，后续计划成为独立的“游戏管家”。在 Steam 游戏技能演示中，Marvis 会在观战一局后分析战斗；在教学模式下，则会在游戏过程中提示玩家下一步该按哪个键。</p>\n  <p>在操作入口方面，用户能通过手机远程向电脑下指令。蔡建涛表示，Marvis 上线以来，远程控制累计使用超过 1800 万次。</p>\n  <p>智能涌现了解到，腾讯还在争取电脑厂商的合作，让 Marvis 进入更多设备。目前，面向整机厂商的 OEM 版本已经推出。</p>\n  <p>目前，PC端的 AI 助手市场已经来到了较为激烈的竞争阶段。一些厂商在走自研路线，比如联想的 Qira 已开放给符合条件的电脑用户下载；惠普的 AI Companion 已预装在部分 Copilot+ PC 上。</p>\n  <p>“有的PC厂商有自己的 AI 助手，有的厂商不想要这样的产品形态。”谈到面向PC厂商的合作，蔡建涛说，腾讯也可以只提供底层 AI 引擎，由厂商决定面向用户的产品形态是是什么。</p>\n  <p>谈到电脑诊断，腾讯副总裁林松涛此前接受媒体采访时说：“缺的从来不是知识，而是对这台设备的理解。”蔡建涛设想，如果电脑厂商开放更多设备状态，C 盘快满时，Marvis 可以主动提醒清理，而不必等用户先发出指令。</p>\n  <h2>02 绕不开的办公？</h2>\n  <p>Marvis 不主打办公，但只要开始管理用户的文件，就绕不开办公。</p>\n  <p>“我们从立项的第一个月，就决定不把自己定位为一个办公 AI。”蔡建涛此前谈及产品方向时说。文档和 PPT 是许多 Agent 最先选择的任务：成果容易看见，做起来也“比做一个游戏助手难度小多了”。Marvis 也会补办公需求，但“我们很少说自己是做 PPT 最好的 Agent，因为它跟我们的主线相对比较远”。</p>\n  <p>在腾讯内部，主打办公的是 WorkBuddy。易观分析统计，今年 6 月，纳入监测的 17 款中国桌面端 AI 原生办公智能体合计访问量超过 6000 万次；其中 WorkBuddy 达 2097 万次，占三分之一。</p>\n  <p>不久前，腾讯已经开始整合众多 Agent 产品。就在昨日，腾讯宣布才被并入 WorkBuddy 团队不久 QClaw 将于 12 月 24 日停止运营，用户可将数据迁至 WorkBuddy。</p>\n  <p>尽管有定位上的差异，但 Marvis 和 WorkBuddy 很难在产品功能上完全做到差异化——WorkBuddy 能读写用户授权的本地文件；Marvis 也能写报告。</p>\n  <p>不过，相比还在找定位的 Marvis，WorkBuddy 已经有了明确清晰的目标市场，并在商业化上有了进展。腾讯首席战略官詹姆斯·米歇尔在 8 月业绩电话会上说，WorkBuddy 收到的用户付款正在明显增长，付费用户的毛利率已与腾讯云整体水平相当。</p>\n  <p>谈到 Marvis 的商业化，蔡建涛拿市面上C 盘清理工具举例：开发者花多年梳理文件类型、目录和安装缓存，才能比别的工具清得更干净、更快。“为这种特殊的能力付费是应该的。”</p>\n  <p>他表示，Marvis 会在产品具备充分竞争力时推出商业化方案；收费点“可能不来自纯粹的 Agent 基础能力”，而是让用户为能提供专业工具的生态伙伴付费。</p>", "category": "tech", "published_at": "2026-09-29T13:30:00+00:00", "fetched_at": "2026-09-30T03:42:39.565048+00:00", "fingerprint": "58d16969e0b1137c"}, {"source": "36氪 - 最新文章", "title": "Manus 回来了，可Agent 的战场已经挤满对手", "url": "https://36kr.com/p/4004527155171460?f=rss", "summary": "<p>&nbsp;</p>\n  <p>文｜李炤锋</p>\n  <p>编辑 ｜ 张雨忻</p>\n  <p>2025 年3月6日，Manus 上线那天，办公室里一群工程师看着一张 Manus生成的NBA 球员象限图，觉得十分亮眼——图上排着球员头像，基于得分和投篮次数分布。创始人肖弘后来回忆，让他们意外的不是象限图有多难画，而是过去得由人一步步完成的活，现在只需交代要求，Agent 就能一路做到交付。</p>\n  <p>一年后，Manus 团队把这段回忆写进公开信，肖弘在这封信的开头，用一句话概括最初的念头：“AI 不仅应该思考，还应该行动。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_e731f55edf53409fa2f2cb2f0fc43d9f@6252890_oswg349386oswg1280oswg1024_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Manus生成的分析图</p>\n  <p>&nbsp;</p>\n  <p>昨天，恢复独立运营的 Manus 发布了 2.0 版本，同时推出面向个人事务的独立应用 Cue。官方介绍显示，2.0 升级了自研 Agent 框架 Cascade；自动化任务可以由新邮件、日历事件等触发。原有桌面应用升级为 Manus Studio，加入可修改初剪时间线的视频编辑器和游戏开发环境。更聚焦个人生活的 Cue，则宣称可以替用户发消息、接听来电，处理日常生活里的琐事。</p>\n  <p>把时间拨回 2025 年刚上线时，Manus 还要邀请码才能使用。闲鱼上有人声称出售 Manus 邀请码，标价 4 万余元。Manus 团队随后回应，官方从未开设付费获取邀请码的渠道。</p>\n  <p>在当时的首发视频里，Manus 首席科学家季逸超演示了这款 Agent 如何筛选简历、分析股票、查找纽约房产，也引来中美科技媒体争相报道。Manus 让更多人第一次看见：原来 Agent 可以接下一件事，自己分步骤去做，再交出结果。</p>\n  <p>接下来的一年，Manus 的命运几经变化。2025 年底，它宣布加入 Meta。今年 9 月 1 日，Manus 又宣布恢复独立，仍由创始团队领导。官宣回归不到一个月，Manus 团队就拿出了 2.0 版本。只是这一次，Agent 赛道上已经挤满了竞争对手。</p>\n  <p>一年前，自动生成一张图、一份报告或一个网站，对许多刚接触 AI 的用户来说都很新鲜。一年后的今天，“AI 自己办事”已经不再稀奇。编程 Agent 有 OpenAI 的 Codex 和 Anthropic 的 Claude Code；微软 Copilot Cowork、腾讯 WorkBuddy 等产品也在接手普通人的办公任务。</p>\n  <p>个人事务也开始有人接手。Meta 的 Muse 已在美国逐步开放，可以从 WhatsApp 接任务。据 Sensor Tower 估算，截至 9 月 24 日，Muse 独立 App 累计下载超过 340 万次。而在国内，阿里的千问 App 已展示通过淘宝闪购下单、在对话里付款；字节的豆包手机助手也在尝试从手机端切入普通人的生活场景。</p>\n  <p>这一回，Manus 2.0 和 Cue 面对的是一场挤满对手的竞争，想要重现 2025 年的惊艳，并非易事。</p>\n  <h3>01 升级工作台之余，还想“Cue”一下个人事务</h3>\n  <p>Manus 2.0 除了升级现有 Agent 框架，还带来了一个新名字：Manus Studio。早在今年 3 月，Manus 就推出桌面应用，允许用户授权它操作本地文件和工具；Studio 是这款桌面应用的升级版。</p>\n  <p>Cue 则是另一款独立应用，和 Manus 共用底层设施，瞄准个人生活任务。Manus 官方称，Cue 支持网页、桌面和移动端，目前凭邀请码抢先体验；截至昨晚产品公告发布时，iOS 版还在等待 App Store 审核。</p>\n  <p>这轮发布主要面向海外用户。同时，Manus 也在另行筹备国内市场的产品。</p>\n  <p>效率是 Manus 这一轮优化的重点。</p>\n  <p>Cascade，正是 Manus 自研 Agent 框架的最新迭代。Manus 称，在一项测试配置中，它比旧系统少用了 23.2% 的 Token，任务耗时缩短 28.2%，运行成本降低 32%。</p>\n  <p>在长时间运行的任务上，Manus 2.0 新增了事件触发功能：新邮件、日历事件，或 Slack、Notion 中的信息更新，都能启动预设工作流。云电脑则继续承担长时间运行的任务，也可托管多人游戏服务器。这似乎契合肖弘和团队今年 3 月在年度信里写下的愿景：让 Manus 全天候工作，同时找到用户愿意长期交给它、运行成本也撑得住的任务。</p>\n  <p>在应用层，从桌面版升级而来的 Manus Studio 把文档、表格、PDF、幻灯片放在同一个工作空间，还覆盖网站、代码、游戏和视频。这次新增的视频编辑器和游戏开发环境，让用户拿到初稿后还能继续动手修改。</p>\n  <p>除了工作场景，聚焦个人事务的 Cue 也走进了日常生活赛道。按 Manus 的介绍，Cue 中每个 Agent 可以有自己的邮箱、电话号码、钱包和电脑；它可以发消息、接听来电并留下摘要，也能在用户设定的预算内付款。</p>\n  <p>不过，Cue 的产品理念并非 Manus 团队临时起意。Manus 此前就试过让 Agent 进入聊天场景：今年 2 月，它把 Agent 接进 Telegram，让用户在现成的聊天软件里交代任务。到 9 月推出 Cue，Manus 又让 Agent 带着自己的身份去办事。官方描绘的一个场景是：用户到餐厅扫个码，让 Agent 替自己点餐或排队取号。</p>\n  <p>Cue 当前展示的交互方式仍更偏向海外用户的习惯。初次使用 Cue 时，App 弹出几条标着“来自 X 的使用案例”的提示，包括给餐厅发邮件问地址、查看 Gmail 中的账单。不难发现，这些用法与在国内处理生活琐事的方式相差很远。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_82cc28f6ad9d4ad2910aaf261f73693f@6252890_oswg113182oswg1280oswg851_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Manus2.0的官方案例</p>\n  <p>尽管 Manus 团队表示会推出针对国内市场的产品，但在国内，这些生活需求早已和一众超级 App 绑在一起。找餐厅、点餐、打车、付款，许多人会直接打开微信小程序、支付宝、抖音、美团或滴滴。商家、订单和支付，也都留在这些平台里。</p>\n  <p>说得再直白一点，在国内，个人生活留给独立 Agent 的空间，仍是一个问号。</p>\n  <h3>02 Agent 战争，从 Coding、办公到日常生活，都挤满了竞争对手</h3>\n  <p>“大厂能理解你创新的时候就是很危险的时候。”去年 Manus 上线前，肖弘在采访中这样说。当时他谈的是 Monica 浏览器插件被大厂跟进，以及随之而来的创业焦虑：一款 AI 应用刚做出新东西，大厂就可能把相似的能力放进自己的产品。</p>\n  <p>Manus 初代发布时，在大众眼中仍是一款前卫的产品。如今 Manus 2.0 归来，Agent 已不是新鲜概念。</p>\n  <p>在编程和深度工作场景里，Coding Agent 开始接手越来越多的长链任务。今年 6 月，OpenAI 披露，Codex 周活跃用户超过 500 万，其中按公司口径，约两成是知识工作者，有人用它做报告、表格等非代码任务。</p>\n  <p>微软此前展示过一个销售案例：负责人让 Copilot Cowork 查哪些潜在客户迟迟没有进展，Cowork 找出了跟进中断的地方。微软称，原本需要人工排查一周的记录，它一个上午就完成了。</p>\n  <p>Cowork 经公司许可后，可以调用 Outlook、Teams 等工具里的资料。微软今年 7 月披露，Microsoft 365 Copilot 已有超过 3000 万个付费席位，这意味着，微软已有一批可以推广新功能的付费客户。</p>\n  <p>Manus 经历沉浮的这一年，办公 Agent 已经批量进入市场。3 月，腾讯推出 WorkBuddy；8 月，阿里整合 QoderWork、悟空和 MuleRun 的能力，推出千问办公；字节则一边把 TRAE SOLO 升级为 TRAE Work，一边在飞书中推出“豆包工作”，让 Agent 进入办公流程。</p>\n  <p>易观今年 6 月的统计显示，纳入监测的 17 款国内桌面办公 Agent 合计获得超过 6000 万次访问，其中腾讯 WorkBuddy 为 2097 万次、字节 TRAE IDE 国内版为 1279 万次、阿里 QoderWork 为 788 万次。</p>\n  <p>在个人 Agent 这边，Muse 同样有 Meta 现成的资源可用。Meta 举的例子里，Muse 可以把用户收藏的 Instagram 食谱整理成购物清单，记住客人的忌口；涉及购买时，还能先征得用户同意，再用 Stripe Link 的一次性卡付款。要替人处理这些日常事务，就得接上用户原来使用的服务，而这对独立 Agent 公司并不容易。</p>\n  <p>国内也有 AI 应用开始接手具体的生活任务。今年 1 月，在千问 App 发布会上，阿里巴巴集团副总裁吴嘉用它订了 40 杯饮料：千问通过淘宝闪购下单，吴嘉确认后在对话里用支付宝付款，饮料随后送到。9 月，曹操出行宣布与豆包合作的 AI 打车首批在北京、杭州、苏州上线。用户在豆包里查路线、找餐厅时，可以接着选择出行方案，由曹操出行提供用车服务。</p>\n  <p>Cue 也提出过在餐厅扫码、让 Agent 代为点餐的场景。但如果要在国内市场分到一杯羹，怎样接入各个平台上的商家和服务，是未来国内版产品要解决的问题。</p>\n  <p>更大的未知来自商业化。Manus 去年 12 月自报 ARR 超过 1 亿美元。可今天，它面对的是一群先送免费额度争用户的对手：WorkBuddy 体验版每月送 500 积分，TRAE 免费新用户可领 4000 积分。</p>\n  <p>Manus Studio 的升级页面显示，Manus Pro 套餐每月 20 美元。不过， Manus 2.0 升级后，免费用户收到了 1500 credits。各家都在送额度、抢入口，Manus 能否靠 2.0 撬动新一轮商业化，仍是未知数。</p>\n  <p>在更日常的使用场景里，豆包、千问的基础功能也能免费用；微信的 AI 助手“小微”则已进入灰测。</p>\n  <p>事实上，距离 2025 年那场令人惊艳的演示，才过去一年多。但对今天的普通用户来说，那个靠一句“AI 会自己做事”就能让人记住一款产品的时刻，似乎已经过去很久。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260929/v2_d6426bc86a9e4c6a80c41c88b0e1b6a0@6252890_oswg270084oswg1280oswg409_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">市面上已有丰富的Agent产品</p>\n  <p>体验 Manus 2.0 后，它仍是一款高效的 Agent 工具。虽然目前还不知道它背后调用了哪些模型，但实际用起来，Manus Studio 能在多个场景里接住需求，包括一些涉及多模能力的场景：做一份 PPT，或生成一张效果图。打开还在测试阶段的 Cue，也能很快发现一些小巧思：可以定制 Agent 的工作方式，交互里也有更鲜明的性格，这些都是 Manus 2.0 的加分项。</p>\n  <p>只是，在 2026 年的当下，再看电脑上这一屏Agent/AI 应用图标，Manus似乎不再是那个惊艳的唯一选项。</p>", "category": "tech", "published_at": "2026-09-29T14:01:34+00:00", "fetched_at": "2026-09-30T03:42:39.565043+00:00", "fingerprint": "ace51c350fe605cd"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨10月1日起将对居民购房实施贷款贴息；AMD回应收购李飞飞公司；网红超长蛋挞全是皮没蛋液？鲍师傅回应", "url": "https://36kr.com/p/4005136008761217?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>OpenAI推出全天候自主智能体Dots、GPT-6.1 Sol模型</p>\n  <p>长鑫科技宣布349亿元投资，官宣投建两大新项目</p>\n  <p>央行：下调抵押补充贷款（PSL）利率0.25个百分点</p>\n  <p>美光财报前夕，超级多头重申2000美元目标价</p>\n  <p>英伟达追加创纪录1500亿美元股票回购</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>10月1日起将对居民购房实施贷款贴息</strong></p>\n  <p>记者9月29日从财政部了解到，我国将从10月1日起对居民使用新发放商业性个人住房贷款购房实施贴息，以降低居民购房成本，更好支持和释放城乡居民刚性住房需求。</p>\n  <p>本次贴息政策聚焦首套刚需，重点支持普通家庭新购中小套型、较低价位的住房，单户所购住房建筑面积不超过120平方米、购房价格不超过150万元。</p>\n  <p>可享受贴息的贷款规模最高可达100万元，财政部门给予年化1个百分点的贴息，按照目前首套住房的商业性个人住房贷款利率水平，相当于优惠了利率的三分之一，贴息期限最长5年。据测算，对于一笔长期限的100万元商业性个人住房贷款，政策最多可帮助借款人累计减少付息近5万元。</p>\n  <p>政策实施期暂定一年。（界面新闻）</p>\n  <p><strong>AMD回应收购李飞飞公司，希望李飞飞汇聚世界级人才</strong></p>\n  <p>近日，美国超威半导体公司（AMD）在官网宣布，已与World Labs达成最终协议，将收购这家由人工智能先驱李飞飞创立的AI实验室。</p>\n  <p>AMD在9月28日发布的新闻稿中写道，这笔全股票交易价值约82亿美元，预计将在2026年年底前完成，但需获得监管部门批准并满足其他惯例成交条件。AMD表示，此次收购将为公司带来一支世界一流的研究人员和模型专家团队，增强公司围绕新兴模型和应用需求开发人工智能硬件、软件和系统的能力。</p>\n  <p>AMD首席执行官苏姿丰在接受采访时表示：“你对整个端到端流程了解得越深入，就越能构建出更好的系统。”“这就是我们收购World Labs的原因。我们希望获得李飞飞汇聚起来的世界级人才，并将这些人才与AMD在硬件、软件和系统方面的能力结合起来。”根据AMD的说法，李飞飞将加入公司担任执行副总裁兼首席科学家，直接向苏姿丰汇报工作。（红星资本局）</p>\n  <p><strong>网红超长蛋挞全是皮没蛋液？鲍师傅回应</strong></p>\n  <p>近日，多名消费者吐槽鲍师傅超长蛋挞咬开后内部大面积是酥皮结构，馅料仅薄薄一层，“又干又难吃，是智商税”。公开信息显示，鲍师傅超长蛋挞于9月20日上线，长度约60厘米。抖音商家数据显示，其零售价为18.9元一个，截至9月28日，该产品已售超70万份。</p>\n  <p>9月28日，鲍师傅官方客服回应称，超长蛋挞并非所有门店售卖，要看具体门店的情况。制作工艺全国各门店标准一致。对于消费者反馈的问题，已上报给各门店及公司负责人。关于后续是否会对超长蛋挞进行改进，该客服表示：“我们会以顾客的消费体验持续优化产品，具体要看后期制作师傅对这款产品的调整情况。”</p>\n  <p>超长蛋挞是2026年9月烘焙赛道的爆火单品。抖音生活服务平台数据显示，截至9月19日，“超长蛋挞”相关热点累计在榜曝光量突破10亿，抖音相关团购累计支付GMV突破亿元，近7天内消费者想要购买的搜索频次高达1880万。（界面新闻）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>OpenAI推出全天候自主智能体Dots、GPT-6.1 Sol模型</strong></p>\n  <p>OpenAI推出GPT-6.1 Sol模型，其性能接近Astra，但标准词元价格仅为Astra的五分之一。同时推出全天候自主智能体Dots。并表示，将于未来数日推出GPT‑6.1 Sol超快版。（财联社）</p>\n  <p><strong>豆包将推个人助理产品：4月已内测，曾用代号“Spell”</strong></p>\n  <p>豆包在个人助理方向正在推进相关产品规划。一位知情人士表示，延续去年豆包手机助手在personal agent方向的策略，今年4月，豆包内部就已开始内测个人助理方向的探索产品。该人士透露，该探索项目当时代号为“Spell”，主要由豆包手机助手团队主导，但由于豆包手机发布等原因，一直没有正式对外。（新浪科技）</p>\n  <p><strong>Anthropic豪掷百亿采购Akamai云基础设施，延续算力采购趋势</strong></p>\n  <p>Akamai近日表示，Anthropic将在7年内向Akamai云基础设施投入116亿美元。这一金额是5月报道的双方18亿美元合作协议规模的6倍以上。该采购承诺并非绝对刚性；根据Akamai提交的证券文件，合作能否落地取决于Akamai满足特定交付与服务可用性指标，且任意一方均可在特定条件下终止协议。（新浪财经）</p>\n  <p><strong>DeepSeek Harness v0.2预览版正式发布</strong></p>\n  <p>36氪获悉，9月29日，DeepSeek Harness v0.2预览版正式发布，并提供开箱即用的macOS和Windows桌面端安装包。据介绍，新版本预置了面向日常办公和开发的常用功能，让常用能力开箱即用。同时，新增插件安装与管理页面，并提供更多灵活配置选项，方便按需扩展功能，打造更适合自己的智能产品。</p>\n  <p><strong>可灵AI Kling4.0开启内测，4.0Flash已开放体验</strong></p>\n  <p>36氪获悉，可灵AI全新模型Kling4.0已开启内测，将于10月正式上线。Kling 4.0单次原生生成最长达30秒、长镜头与连续叙事能力进一步提升；最多支持10张关键帧输入；支持4K、1080p的10-bit HDR格式高规格输出。同时，可灵AI还推出了Kling4.0Flash，现已率先开放体验。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>新股N安达涨超261%，触发临停</strong></p>\n  <p>36氪获悉，9月29日上市新股N安达扩大涨幅至超261%，触发临停，成交超1.1亿元，收盘26.16元；全天成交金额6.44亿元，换手率高达96.70%。资料显示，公司主营汽车铝合金精密压铸件的研发、生产和销售。</p>\n  <p><strong>长鑫科技宣布349亿元投资，官宣投建两大新项目</strong></p>\n  <p>A股“市值一哥”长鑫科技抛出349亿元投资计划。9月28日晚间，长鑫科技公告称，公司拟使用超募资金130亿元投资新建技术研发项目，同时拟通过增资和借款方式向全资子公司长鑫存储产品（合肥）有限公司提供超募资金50亿元，由其投资新建存储器晶圆后道测试基地二期项目，计划建设一座测试工厂，为DRAM存储芯片提供测试以及模组组装。上述项目投资总额分别为241亿元和108亿元，合计349亿元。9月28日，长鑫科技收跌4.27%，总市值3.65万亿元，位列A股第一。（红星新闻）</p>\n  <p><strong>Anthropic招股书曝光，2025财年营收达45.9亿美元</strong></p>\n  <p>据报道，一份招股说明书显示，Anthropic在面向IPO投资者的推介中提出了变革性人工智能技术的发展计划。说明书还显示，Anthropic 2025财年营收为45.9亿美元，同比增长1088%，但在扣除主要与此前融资相关的负债减值影响后，公司营业层面仍亏损超过80亿美元。</p>\n  <p>Anthropic表示，去年近四分之一营收来自两家客户，并在风险因素中警告称，其许多最大客户并未签署长期合同，未来可能削减或停止支出。这可能促使投资者在评估高增长企业高估值时更加谨慎。近期AI和芯片类股票出现抛售，而Anthropic此次上市也将进一步检验市场对AI投资的热情是否能够经受更严格审视。截至2025年12月31日，Anthropic持有现金、现金等价物及短期投资总额为202.8亿美元。招股书显示，Anthropic计划未来一年在云计算、计算资源和基础设施承诺方面投入5180亿美元。（财联社）</p>\n  <p><strong>Anthropic新规：客户用量触及额度上限后将不再享受折扣</strong></p>\n  <p>Anthropic正在向企业客户展现强势议价姿态：一旦客户用完合同内购买的全部Token额度，折扣待遇将直接取消。这一做法，给了OpenAI机会，采取更为灵活的定价策略。三家同时采购两家厂商AI服务的软件企业管理人员表示，尽管Anthropic与其主要竞争对手OpenAI都会对承诺每年数百万美元采购额的客户提供折扣，但Anthropic采取了一项比较特殊的规则：一旦客户触及合同约定用量上限，折扣即终止。这些人士称，达到额度上限的客户必须重新谈判签订新协议，否则就要按更高原价付费。（新浪财经）</p>\n  <p><strong>美股三大指数收盘集体走弱，蔚小理跌超4%</strong></p>\n  <p>36氪获悉，9月29日收盘，美股三大指数集体走弱，纳指跌0.09%，标普500跌0.17%，道指跌0.26%；大型科技股跌多涨少，苹果跌超2%，特斯拉跌超1%，英伟达、谷歌、微软小幅下跌，Meta涨超3%，亚马逊小幅上涨；热门中概股普跌，蔚来、小鹏集团、理想汽车跌超4%，爱奇艺跌超3%，哔哩哔哩、拼多多、京东跌超1%，阿里巴巴、百度小幅下跌，网易涨0.64%。</p>\n  <p><strong>OpenAI拟融资300亿美元，估值目标达1.4万亿美元</strong></p>\n  <p>据报道，OpenAI正计划筹集至少300亿美元资金，并寻求约1.4万亿美元估值。报道称，此轮融资可能作为IPO前的过渡性融资，为公司提供进一步扩张所需资本。OpenAI此前已于今年3月完成一轮融资，获得1220亿美元承诺资本，公司估值达到8520亿美元。OpenAI首席执行官山姆·奥特曼此前表示，公司不会在2026年上市，并称这一决定与人工智能安全方面的考虑有关。（界面新闻）</p>\n  <p><strong>特朗普：将通过行政令把“人工智能”更名为“超级智能”</strong></p>\n  <p>9月29日，特朗普表示，将签署强有力的人工智能命令，通过行政令把“人工智能”更名为“超级智能（Super Intelligence）”；绝不会扼杀AI的发展。（财联社）</p>\n  <p><strong>澜起科技成功量产DDR5-9200 CKD芯片</strong></p>\n  <p>36氪获悉，澜起科技宣布，其升级版DDR5时钟驱动器芯片（CK01P）已成功实现量产，旨在为下一代客户端内存模组提供稳定可靠的时钟驱动支持。</p>\n  <p><strong>深蓝和阿维塔将整合？长安汽车：成立协同发展部，聚焦中后台资源共享</strong></p>\n  <p>针对深蓝和阿维塔将整合运营的消息，长安汽车方面表示，“目前确实新成立了AD协同发展部，以推进阿维塔和深蓝两大品牌的战略性协同发展，主要聚焦在中后台的资源共享方面。”长安汽车强调，两个品牌的定位和规划不会改变，用户权益也不会受影响。通过对双方共享资源及产业链支持进行协调统筹，避免重复投入和资源浪费，从而进一步提升服务能力。针对两大品牌详细分工、推进计划等，对方表示具体信息尚未公布。（澎湃新闻）</p>\n  <p><strong>央行9月29日开展905亿元7天逆回购操作，操作利率为1.40%</strong></p>\n  <p>36氪获悉，央行9月29日开展905亿元7天逆回购操作，操作利率为1.40%。同时，开展了6985亿元隔夜逆回购操作。</p>\n  <p><strong>央行：下调抵押补充贷款（PSL）利率0.25个百分点</strong></p>\n  <p>36氪获悉，央行调整完善若干货币政策工具。下调抵押补充贷款（PSL）利率0.25个百分点。一年期抵押补充贷款利率从1.75%降至1.5%，更好激励政策性银行支持实体经济、服务国家战略。</p>\n  <p><strong>澳洲联储加息25个基点至4.6%</strong></p>\n  <p>澳洲联储加息25个基点至4.6%，符合市场预期，利率升至2011年11月以来最高。（财联社）</p>\n  <p><strong>机构：CPU交货周期延长至25-30周，AI代理推高需求</strong></p>\n  <p>36氪获悉，TrendForce指出，CPU交货周期已从通常的16-20周延长至25-30周，原因是Meta Muse等个人人工智能代理推高了市场对CPU的需求量。分析师们正在争论人工智能代理激发的CPU需求究竟有多大，但毫无疑问的是，CPU的需求增长前景已经确立，即使人工智能代理领域还在起步阶段。</p>\n  <p><strong>美光财报前夕，超级多头重申2000美元目标价</strong></p>\n  <p>在美光科技9月30日发布财报前夕，该存储芯片巨头的一位超级多头重申了对该股接近华尔街最高水平的2000美元目标价。D.A.戴维森分析师吉尔·卢里亚（Gil Luria）给出的这一目标价较美光科技最新收盘价高出约100%。Luria指出，内存是AI大模型运行关键，内存容量愈大、模型就越好，推理就越快、上下文窗口就越长。市场各方参与者都在反复表示，需求仍在暴涨，而新增供给至少还要等一年才会跟上。当前市场给出的估值倍数，已经在定价存储周期结束，但AI算力的需求仍在持续增长。（财联社）</p>\n  <p><strong>美债破5%掀起跨大西洋共振，欧洲也拉起“债务警报”？</strong></p>\n  <p>受访专家认为，主导长端利率质变的核心变量落在了“期限溢价”的重估上。美债风险溢价的持续上行正在大西洋彼岸引发共振。截至发稿，美国10年期国债收益率升至5.247%，在过去一个月上升了约49个基点。与此同时，欧洲主要国债市场各期限收益率也被动大幅走高，德国10年期国债收益率升至3.63%，刷新2009年以来高位；法国10年期公债收益率在9月28日触及4.77%，逼近2008年以来的历史峰值。（第一财经）</p>\n  <p><strong>OpenAI、Anthropic等AI科研负责人联名呼吁加强监管，警惕AI智能体失控</strong></p>\n  <p>OpenAI、Anthropic、Meta以及微软的研究负责人呼吁政策制定者，调查各家企业在AI研究自动化方面已经达到的程度，行业普遍呼吁加强对这项快速迭代技术的监管，上述研究者也加入这一行列。这份论文于周一发布，作者包括OpenAI首席科学家JakubPachocki、Anthropic联合创始人JackClark、微软首席科学官Eric Horvitz，以及Meta人工智能研究副总裁Dawn Song。文中提出，AI研究自动化可能触发一场“智能爆炸”。作者称，该现象会将数年的技术进展压缩至数月甚至更短时间内完成，其迭代速度将超出人类的理解能力。（新浪财经）</p>\n  <p><strong>英伟达追加创纪录1500亿美元股票回购</strong></p>\n  <p>受益于人工智能热潮带来的充沛现金，英伟达推出美国史上规模最大的股票回购方案。英伟达9月28日对外表示，董事会批准追加1500亿美元股份回购额度，公司全部回购授权总规模由此达到2350亿美元。英伟达在9月28日的演示材料中披露，投资组合涵盖13家上市公司以及229家非上市初创企业；已退出项目的投资回报超过投入本金的三倍。公司计划，将投资带来的超额自由现金流，通过股票回购以及“稳步提升的股息”回馈股东。（新浪财经）</p>\n  <p><strong>英伟达欲拉保险公司入场，为AI芯片融资风险兜底</strong></p>\n  <p>英伟达正在与保险公司展开洽谈，探讨如何分担其人工智能（AI）芯片贷款业务所伴随的风险。英伟达CEO黄仁勋认为，芯片应被视为一种“可投资资产类别”，用作在用户与投资者之间转移风险和成本。（财联社）</p>\n  <p><strong>OpenAI计划提供资金并成立工作组，以解决模型入侵澳大利亚网站事件</strong></p>\n  <p>OpenAI发表声明称，在智能体未经授权访问澳大利亚政府网站后，公司决定将成立一个澳大利亚特别工作组，为管理能力日益强大的AI智能体所带来的风险制定切实可行的政策建议。该工作组将重点改进通报流程，加强AI开发者与政府之间的协调，并确定更好地保护政府系统的措施。该工作组预计将于今年年底前完成工作。OpenAI还表示，将通过其10亿澳元的“Daybreak for Frontline Defenders”基金向澳大利亚政府和行业提供信贷，并为网络防御提供技术援助。此外，OpenAI称，公司首席战略官Jason Kwon将于10月6日在悉尼出席人工智能联合特别委员会的听证会。（界面新闻）</p>\n  <p><strong>三星电子高管称HBM明年将占行业DRAM产能近30%</strong></p>\n  <p>据报道，三星电子一位高管表示，高带宽内存（HBM）预计明年将占动态随机存取存储器（DRAM）芯片制造商总晶圆产能的近30%，高于目前约20%的水平。（界面新闻）</p>\n  <p><strong>OpenAI在英伟达130亿美元交易前以早期投资提议引发对Hugging Face的竞购</strong></p>\n  <p>据知情人士透露，在英伟达本月同意支付约130亿美元收购开源平台Hugging Face之前，OpenAI曾试图向这家初创公司投资1亿美元。作为两家公司潜在交易的一部分，Hugging Face原本会成为OpenAI定制芯片的分销渠道，该芯片代号为Jalapeño，由该公司与博通合作制造。一位消息人士称，谈判在早期阶段破裂。英伟达介入收购了Hugging Face，这是英伟达有史以来第二大收购，仅次于12月以200亿美元收购AI芯片初创公司Groq的资产。（新浪财经）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>罗博特科等四家公司9月29日登陆港交所</strong></p>\n  <p>罗博特科等四家公司9月29日将登陆港交所，合计募资144亿港元（18亿美元），今年火热的香港新股市场将迎来最繁忙的上市日之一。罗博特科香港上市募资6.6亿美元，在这四家公司中募资额最大。该公司在深圳上市的A股今年以来已上涨逾一倍。这家光伏及硅光领域自动化设备生产商此次香港上市引入淡马锡、晟天实业和易方达等基石投资者。数据显示，第三季度香港IPO、配股和大宗交易合计募资455亿美元，创同期纪录，仅略低于2021年创下的476亿美元历史单季最高水平。（新浪财经）</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“诺因智能”宣布完成单笔数亿元人民币天使+++轮融资</strong></p>\n  <p>36氪获悉，“诺因智能”近日宣布完成单笔数亿元人民币天使+++轮融资。本轮融资由京东相关基金领投，正心谷资本、南山战新投和华登投资跟投。距离上一轮5亿元融资，仅过去一个多月。</p>\n  <p><strong>“途见科技”完成亿元级Pre-A++轮融资</strong></p>\n  <p>36氪获悉，“途见科技”近日完成亿元级Pre-A++轮融资，由北京市人工智能产业投资基金和北京市新材料产业投资基金联合领投。资金将重点用于底层核心技术研发、自动化产线建设和工艺迭代，并完善具身智能数据采集工具与消费级终端的供应链配套，加快技术成果向终端产品转化。</p>\n  <p class=\"editor-note\"><strong>整理丨</strong>葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-09-30T00:01:53+00:00", "fetched_at": "2026-09-30T03:42:39.565038+00:00", "fingerprint": "d4e5e0866a955315"}, {"source": "36氪 - 最新文章", "title": "地卫二启动“太空之弦”千星蓝图，2028年对标SpaceX Starmind计划", "url": "https://36kr.com/p/4005156110389120?f=rss", "summary": "<p>2026年9月，中国商业航天进入一个密集爆发期，多家公司完成数亿元融资，还在一个月内完成至少10次航天发射，将44颗卫星送入轨道。</p>\n  <p>资本热度和密集发射共同指向一个趋势：商业航天正在从技术验证期转向规模化部署。但卫星发得越多，也越逼近“天感地算”路径的极限，进一步推动行业对太空计算的关注和布局。</p>\n  <p>9月25日，“太空之弦”计算星座计划启动仪式在杭州举行。按照现场公布的千星路线图，这个中国首个面向全球市场的太空计算星座，远期规划部署超过1000颗太空智能体，2027年计划发射G1星，计算负载11.5KW、算力40-60P（按现有算力推算）。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_cd3cf019bda34ddabd45c55dc0ffc7d2@5688585_oswg312970oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">G3概念示意图</p>\n  <p>“太空之弦”计算星座由三体计算星座共建方地卫二与东方星链共同推进建设。东方星链负责总体设计与运营，地卫二提供AI能力支持并拓展国际市场，推动“AI+航天”技术与全球数字服务需求衔接。</p>\n  <p>地卫二成立于2021年，致力于构建太空计算网络，提供太空计算系统、智能卫星、在轨星座运营、人工智能+大数据应用等服务。</p>\n  <p>东方星链联合创始人宋冰晨告诉36氪，地卫二给自己定下的目标是打造芯片、算法、模型一体化的太空智能体，“成为能思考、能决策、能进化的太空计算节点。”</p>\n  <p>目前，地卫二的业务已拓展至全球40余个国家，是中国首家实现卫星及地面系统海外交付的民营商业航天企业。2025年公司营收达1.3亿元，其中海外市场营收占比过半并实现盈利。</p>\n  <p><strong>1.打造芯片、算法、模型一体化的太空智能体</strong></p>\n  <p>今年8月5日，“太空之弦“计算星座的首发推理验证星——“东方星链05/06星”（东方慧眼高光谱AI双星）搭载地卫二自主研发的“弦”AI星载计算平台，由捷龙三号遥十二运载火箭成功发射。</p>\n  <p>2023年8月，搭载第一代“弦”平台的“地卫智能应急一号”发射入轨，当时算力为60TOPS，通过超百种算法实现星上即时观测、实时处理和太空智能，清除无效数据，再将计算结果回传地面。以一万平方公里卫星图像为例，传统卫星方式需要180天，智能卫星只需数小时在轨处理即可完成动态目标提取。</p>\n  <p>2024年“弦”平台算力进一步提升至400TOPS，但是将单星算力提升到400TOPS以上水平，需要在工程上系统性解决同步带来的能耗增加和散热难题。</p>\n  <p>在太空的真空环境下，芯片只能靠辐射实现散热，因此<strong>地卫二自研高导热复合材料，使导热能力提升至铝合金数倍，并配合使用展开式辐射器。宋冰晨透露，未来地卫二还将引入自研的热泵技术，进一步提高太空服务器的散热能力。</strong></p>\n  <p>地卫二创始人曾坦言，“现在我们和SpaceX相比，无论是火箭技术、卫星批量生产能力，还是资本规模，还不在一个量级。”</p>\n  <p>为实现千星蓝图，地卫二计划在三条技术路线上持续突破：一是与国内厂商研发抗辐照芯片，预计今年底将与清微智能部署全球首颗可重构芯片；二是探索钙钛矿等新材料，提升太阳能板转化效率；三是明年部署国内首个太空液冷智能体，优化卫星散热表现。</p>\n  <p><strong>2.先遥感后计算，从区域商用到全球商用</strong></p>\n  <p>截至2026年6月，两家公司的6颗卫星最长累计在轨时间超过2600天，积累了大量关于芯片在太空辐射环境下的实际表现数据。</p>\n  <p>过去几年，国内太空算力市场整体尚未实现商业化闭环，因此地卫二选择先用成熟的遥感数据服务赚钱、积累客户和信任，再逐步培养和叠加太空计算能力。而由于国内遥感卫星市场需求有限，加上团队中有一批中兴通讯出身，具有十几年海外市场经验的人才，海外市场成为地卫二实现市场化首先考虑的重点。</p>\n  <p>“中东、中亚和东南亚很多国家也渴望建立自己的航天能力和太空主权。”宋冰晨表示，<strong>地卫二通过采用“整星出口+数据服务+人才培训”的组合，切入第三世界国家这个被传统欧美航天体系忽略，但支付意愿强、竞争相对不激烈的缝隙市场。</strong></p>\n  <p>2024年11月11日，地卫二向阿曼交付了首颗“阿曼星”。这颗智能遥感卫星主载荷为一台全色分辨率1米、多光谱分辨率4米的光学相机，具备最长45分钟连续推扫成像能力，可应用于国土详查、城市规划、森林调查、灾害监测等领域。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_92f9ffef86ef4e558ce0b01ce24cf170@5688585_oswg71752oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">阿曼星太空自拍照</p>\n  <p>在轨运行两个月后，“阿曼星”已绕地球飞行1200多圈，完成300多次测控任务和100多次数传任务，接收数据量约3000GB，并成功实现在轨AI识别船只和飞机、天基分布式操作系统和天基遥感大模型的首次太空实践验证以及星地网络化联通。</p>\n  <p>中国没有民营公司做过卫星出口，我们不是摸着石头过河，是摸不着石头。”从接触客户、需求对接、方案设计、卫星研制、发射协调、在轨测试，到最终“阿曼星”成功发射，地卫二用了接近两年，跑通了从卫星出口审批、在轨交付到外汇结汇的全流程。“相当于自己开辟了一条原本不存在的商业道路。”</p>\n  <p>“阿曼星”的成功被写进了阿曼的中学课本，也成为地卫二打开更多海外市场的敲门砖。此后业务陆续拓展到印尼、乌兹别克斯坦、土耳其，以及南部非洲和中亚40多个国家。</p>\n  <p>在服务更多主权国家的过程中，地卫二针对不同大洲和地区的差异化需求，提供适应当地需要的产品组合。比如中东国家资金相对充足，更看重主权能力，需要整星出口和人才培养；东南亚国家关注农业、渔业等民生应用，主要购买数据和服务；非洲重视灾害预警和资源管理。</p>\n  <p>宋冰晨总结，“卫星出海”差异化服务背后共同的核心竞争力在于三点：<strong>技术实力是入场券，交付能力是信任基础，长期经营建立信任关系。</strong></p>\n  <p>而合规则是以上一切的大前提和生命线。“这个行业的特殊性决定了，我们宁可失去客户，也不能踩红线。”宋冰晨表示，地卫二在内部会进行从岗位培训、交付内控到审计规范的一整套培训，所有服务经过国家正规审批，不涉足军事等敏感领域。</p>\n  <p><strong>3.构建“遥感+计算+通信”战略框架，打造未来“太空商店”</strong></p>\n  <p>遥感数据服务作为公司现金流业务，支撑公司运营和客户积累，也是地卫二实现最终的“遥感+计算+通信”战略框架的第一步。</p>\n  <p>宋冰晨介绍，地卫二计划下一步将遥感卫星和计算卫星合二为一，形成感算一体卫星，用天基数据测试和验证计算平台的价值，逐步形成太空计算平台的核心产品。</p>\n  <p>太空计算星座要运转起来，通信能力是至关重要的前提。为了做到全链路能力自主，地卫二已在海外市场获得通信牌照，开始构建自己的通信网络。“弦”平台本身也已具备窄带通信、网络化分布式计算等功能。</p>\n  <p>“我们最终的目标是形成‘遥感+计算+通信’全链路自主可控、三大星座互为补充的太空能力，这是我们能够按自己的节奏推进千星蓝图的底层保障。“宋冰晨表示。</p>\n  <p>太空计算平台要实现商业闭环，前提是太空的综合成本比地面低，客户才会愿意买天上的算力。这也是地卫二选择先海外、再国内的原因之一。</p>\n  <p>“海外这些国家的地面算力成本比国内高很多，所以成本差的反转会来得更快。”宋冰晨表示，地卫二团队判断，太空计算实现全球商业闭环至少还需要7-10年，“我们可能在中东和一带一路国家先实现，大概在2031年前后。”</p>\n  <p>这个时间判断与多家国际投行对SpaceX轨道数据中心的成本建模测算相差不大。德意志银行2026年7月的测算显示，当前太空数据中心部署成本是地面的约6倍，到2032年SpaceX AI 2卫星阶段，发射成本降至每公斤170美元，成本倍数有望变为0.6倍。摩根士丹利也预测，SpaceX轨道计算成本到2031年可以降至���年每瓦6.5美元，低于地面数据中心的6.8美元。</p>\n  <p>宋冰晨认为，最终决定太空计算商业闭环时间的变量主要有两个。一是火箭发射成本。目前太空算力综合成本约为地面的8倍，其中很大一部分来自发射费用。二是技术迭代。包括芯片抗辐照能力、能源效率、散热效率、组网规模。</p>\n  <p>而在商业闭环实现之前，首先要完成技术闭环，也就是10P以上算力的卫星能在天上全时工作，随时接收数据，保持稳定推理并随时返回结果，“像地面数据中心一样稳定，从目前的技术来看还不实现，完全替代地面的数据中心在商业上也是伪命题。”宋冰晨说。</p>\n  <p>他将实现太空算力商业闭环的具体产品形态，描述为一个“太空商店”：卫星在轨运行后，可以像手机一样不断加载、删除、上传新算法，不同客户可以按需调用同一颗卫星的算力。</p>\n  <p>这一能力已经在地卫二过往产品中得到一定程度验证。2025年，地卫二与土耳其合作，通过星上算法动态部署，在同一颗卫星上先后完成了农业检测、城市规划和灾害评估三种不同任务。</p>\n  <p>“技术都已经实现了，真正的挑战在于生态。”宋冰晨表示，生态搭建需要更多开发者愿意为太空写算法，建立标准化的接口和付费体系，前提是星座规模足够大、能实现全时通信。而这正是“太空之弦”千星蓝图接下来要解决的问题。</p>", "category": "tech", "published_at": "2026-09-30T00:17:57+00:00", "fetched_at": "2026-09-30T03:42:39.565031+00:00", "fingerprint": "810cc4d9e93c5344"}, {"source": "36氪 - 最新文章", "title": "最前线丨打造“太空4S店”，未来宇航雄安智造基地启用，「锋行一号」首飞出征", "url": "https://36kr.com/p/4005279658708868?f=rss", "summary": "<p>9月29日，未来宇航雄安智能制造基地在雄安新区科创中心中试基地正式启用。仪式现场，未来宇航首款空间飞行器锋行一号（FX-1）从总装车间驶出，进入首飞前工程节点，后续将按计划开展在轨技术验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_268fa54145924ccba27d2a694643ee26@6413691_oswg259130oswg1916oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智能制造基地揭牌</p>\n  <p>未来宇航创始人兼CEO牛旼在现场表示，<strong>空间飞行器产业化不仅需要完成产品研发，更要建立与产品规模化交付相匹配的制造和测试能力。</strong>未来宇航将以雄安基地为重要支点，将工程能力落实到工程制造环节，在实际任务中沉淀经验，进一步提升产品成熟度，推动研发、制造与任务执行之间形成更为完整的工程链条。</p>\n  <p>近年来，雄安持续布局空天信息、卫星互联网等未来产业，截至目前已集聚69家空天信息企业、9个创新平台，依托应用场景与配套保障，推动产业链向研发、制造、测试、应用环节延伸。</p>\n  <p>据悉，本次落地雄安的智能制造基地，针对空间飞行器的工程制造需求搭建起覆盖总装集成、精密测量、性能测试、环境试验、数字化生产管理的制造测试体系，配置了自动化总装、智能转运等设备，按规划将形成约60台的年产能力。</p>\n  <p><strong>依托该制造基地以及雄安公共测试平台配套产业服务，未来宇航将进一步打通从产品总装、系统集成到测试验证的工程流程，推动研发成果向稳定制造和量产交付转化。</strong></p>\n  <p>过去十年，中国商业航天的叙事围绕着“造星”和“送星”展开。但当星座组网进入规模化阶段，成千上万颗卫星散布在不同的轨道面和轨道高度，“最后一公里”的精准投送正在成为产业链新的细分环节。</p>\n  <p>承接这一环节任务的装备叫轨道转移飞行器（Orbital Transfer Vehicle，OTV），也就是“太空摆渡车”——火箭像班车，把卫星统一送到初始站，而飞行器承接后续的轨道运输，让卫星从初始轨道抵达目标位置。</p>\n  <p>过去，这类轨道爬升任务大多依靠卫星自身推进系统完成，会消耗卫星推进剂，压缩在轨寿命。但当星座规模达到数万颗级别，这种方式在组网效率和成本结构上的矛盾越来越突出，对于可执行爬升与变轨任务的空间飞行器的需求随之显现。锋行一号正是基于此进行研发打造的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260930/v2_418e2fad148147fbaac20e5fc1ef085b@6413691_oswg271448oswg1922oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">锋行一号（FX-1）从总装车间驶出</p>\n  <p>按照既定计划，锋行一号将于年内首飞并开展在轨技术验证。据项目负责人介绍，锋行一号入轨后将进行多轨道变轨任务，验证飞行器在不同轨道高度的工作稳定性，以及变轨期间避让空间碎片与其他航天器的可靠性；飞行器搭载的星敏感器还将采集空间碎片观测数据，为后续任务奠定基础。</p>\n  <p>在应用场景方面，空间飞行器目前仍以卫星部署任务为主，后续将逐步拓展至在轨维护、碎片清理等复杂场景。面向未来，未来宇航基于峰行系列提出了“太空4S店”概念，构建一站式在轨交付工程能力，面向卫星公司、科研机构及商业用户，提供从平台研制、载荷集成、轨道部署到在轨操控及数据应用的全链条服务。</p>", "category": "tech", "published_at": "2026-09-30T02:26:30+00:00", "fetched_at": "2026-09-30T03:42:39.565016+00:00", "fingerprint": "21b347e57f20467b"}, {"source": "少数派", "title": "可塑的白昼：ColorOS17 深度评测", "url": "https://sspai.com/post/114728", "summary": "时间倾斜，触碰我，发出清澈的金属般的声响。我的感官在战栗，我觉我能——我能抓住这可塑的白昼。——里尔克《时辰祈祷》AppleEvent'26上，主动智能赋能的SiriAI终于正式发布。Craig一句「 ...<a href=\"https://sspai.com/post/114728\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-29T03:28:25+00:00", "fetched_at": "2026-09-30T03:42:38.041539+00:00", "fingerprint": "398837a0f85388a5"}, {"source": "少数派", "title": "更懂你的心，也更懂你：Apple Watch Series 12 体验", "url": "https://sspai.com/post/115061", "summary": "全新 Apple Watch Series 12，有哪些可感知的升级？<a href=\"https://sspai.com/post/115061\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-29T07:44:46+00:00", "fetched_at": "2026-09-30T03:42:38.041534+00:00", "fingerprint": "0659343e5cb3078e"}, {"source": "少数派", "title": "社区速递 160 | 水月雨首款游戏耳机与八月派友剁手清单", "url": "https://sspai.com/post/115153", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。临近国庆长假 ...<a href=\"https://sspai.com/post/115153\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-29T09:03:00+00:00", "fetched_at": "2026-09-30T03:42:38.041529+00:00", "fingerprint": "2adfa47994580c9c"}, {"source": "少数派", "title": "派早报：OpenAI 发布 Dot 智能体、Apple 移动睡眠呼吸暂停迹象提示软件国内获批等", "url": "https://sspai.com/post/115197", "summary": "Nothing 发布旗舰耳机 Headphone 1 Pro，AMD 斥资 82 亿美元收购 World Labs 等。<a href=\"https://sspai.com/post/115197\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-29T23:39:21+00:00", "fetched_at": "2026-09-30T03:42:38.041519+00:00", "fingerprint": "6059f6dd99286450"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.6954 CNY ↓-0.38%", "url": "https://www.frankfurter.app/2026-09-29?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-09-29</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.6954 CNY</b> <span style=\
