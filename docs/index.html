nging a translucent design to Xbox Series X, drawing inspiration from [&#8230;]", "category": "tech", "published_at": "2026-06-07T17:45:48+00:00", "fetched_at": "2026-06-08T03:34:07.273530+00:00", "fingerprint": "647c1cc77588c7ea"}, {"source": "The Verge", "title": "Persona 6 exists, and that’s all we know", "url": "https://www.theverge.com/entertainment/945256/persona-6-teaser", "summary": "This year's Summer Game Fest turned out to be a good one for fans of Japanese RPGs. First, the conclusion of the Final Fantasy VII remake trilogy was announced at SGF Live, and now we have the long-awaited return of the Persona series. Atlus confirmed Persona 6 exists with a brief teaser, but aside from [&#8230;]", "category": "tech", "published_at": "2026-06-07T18:00:41+00:00", "fetched_at": "2026-06-08T03:34:07.273507+00:00", "fingerprint": "b890714d054cea96"}, {"source": "The Verge", "title": "The 7 biggest storylines from Summer Game Fest 2026", "url": "https://www.theverge.com/entertainment/945445/summer-game-fest-2026-biggest-stories", "summary": "The 2026 edition of Summer Game Fest just wrapped up, and it was surprisingly hectic. The nearly week-long event came at a challenging time for the games industry, and for the most part the big keynotes were used as a chance to show some strength through major announcements, while largely ignoring pesky details like hardware [&#8230;]", "category": "tech", "published_at": "2026-06-07T18:45:33+00:00", "fetched_at": "2026-06-08T03:34:07.273501+00:00", "fingerprint": "ba26df4293c3295d"}, {"source": "The Verge", "title": "NASA will wear high-tech Prada long johns to the Moon", "url": "https://www.theverge.com/design/945540/nasa-axiom-space-prada-lcvg-spacesuit-moon-artemis", "summary": "We've seen Axiom Space and Prada's collaboration on the Axiom Extravehicular Mobility Unit (AxEMU) spacesuit. Now the company has revealed the Liquid Cooling and Ventilation Garment (LCVG) that astronauts will wear underneath it when Artemis IV returns humans to the Moon in 2028. The LCVG is the all-important base layer that will keep the crew [&#8230;]", "category": "tech", "published_at": "2026-06-07T22:16:41+00:00", "fetched_at": "2026-06-08T03:34:07.273491+00:00", "fingerprint": "f57744106ad23b85"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨八家上市公司集中公告“补税”；ChatGPT将迎来史上最大幅度升级；高考新增AI监考员，自动截取异常录像", "url": "https://36kr.com/p/3843764238174729?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>AI等机器网络请求量首超人类</p>\n  <p>瑞幸咖啡回应拿铁去冰仅半杯</p>\n  <p>宗馥莉自有品牌KELLYONE回归</p>\n  <p>多家低成本航空公司对登机箱登机收费</p>\n  <p>黄仁勋会见韩国两大游戏商代表共商游戏AI合作方案</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>八家上市公司集中公告“补税”&nbsp;</strong></p>\n  <p>6月1日至6日，不到一周内，八家A股上市公司先后披露补缴税款公告。这八家公司合计补缴税款及滞纳金约4亿元。其中，苹果中国最大授权经销商爱施德（002416.SZ）一家补缴3.08亿元，占八家总额的近八成，该公司披露，仅滞纳金就达1.23亿元。对部分公司而言，这笔补缴金额已接近甚至超过去年一整年的利润。如电子材料企业宏昌电子（603002.SH）需补缴4041.91万元，而公司2025年全年归母净利润为3537.17万元。</p>\n  <p>八家公司公告的核心表述一致——均已全部缴纳完毕，均不涉及行政处罚，均引用《企业会计准则第28号》认定不属于前期会计差错、不追溯调整前期财务数据，补缴金额均计入2026年度当期损益。但逐份比对可以发现，八家公司的补缴金额差距悬殊，启动自查的原因也不尽相同。（财经社）</p>\n  <p><strong>OpenAI正准备对ChatGPT进行上线以来最大幅度升级</strong></p>\n  <p>OpenAI正准备对ChatGPT进行上线以来最大幅度升级，此次升级也引爆了人工智能热潮。这家估值8500亿美元的集团计划在今年上市前寻找新的增长引擎。该公司打算将这款聊天机器人转型为“超级应用”，整合编程工具与人工智能智能体，新增多款高管认为能带来更高收入的产品。据十多位现任及前任员工透露，这些调整是OpenAI整体重组计划的一部分。这家总部位于旧金山的公司正调配资源，全力争取高利润企业客户，并与竞争对手Anthropic展开更激烈的竞争。此次调整将提升OpenAI编程产品Codex的地位并增加资源投入，反映出公司内部日益坚定的共识：人工智能的未来并非回答问题的聊天机器人，而是能为用户执行任务的智能体。（新浪财经）</p>\n  <p><strong>高考新增AI监考员：考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认&nbsp;</strong></p>\n  <p>6月7日，2026高考第1天。高考期间，各地运用智能巡查系统和智能安检门等科技手段，严防作弊。在北京市第二中学考点，考场贴出纪律提示，明确禁止携带智能眼镜进入考点；在广东广州，各考点重点增强了安检门对智能眼镜等隐蔽式穿戴设备的识别能力。AI智能巡查系统也在多地考场投入使用。考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认。（央视新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>京东与腾讯就AI Agent将达成重要合作</strong></p>\n  <p>6月7日晚间消息，京东与腾讯将围绕AI Agent展开深度合作。依托京东的商品供应链、履约服务能力及腾讯的生态入口优势，双方将共同打造跨场景的智能化服务新范式，推动AI Agent从单点应用走向生态协同。（新浪科技）</p>\n  <p><strong>多家供给方下调算力价格，算力普惠再提速</strong></p>\n  <p>随着全国算力基建规模化、标准化不断提速，多家算力价格也迎来持续普惠。让曾经昂贵的“高端稀缺资源”变身为各行各业可普惠使用的“数字水电”。前不久，多家模型厂商宣布永久下调算力价格，其中DeepSeek与小米MiMo降价尤为显著，最高降幅接近99%。极大降低了用户日常高频问答、网页设计、代码编程等多场景AI使用成本，让各类轻量化、常态化AI应用告别高门槛、高成本的制约。（央视新闻）</p>\n  <p><strong>OpenAI芯片元老“002号员工”转投Anthropic</strong></p>\n  <p>OpenAI自研芯片项目的“002号员工”Clive Chan在X平台发文宣布，自己已离开OpenAI，并于本周正式加入Anthropic。这一消息迅速引发业界广泛关注，被视为AI领域大模型竞争从模型、产品层面向芯片和算力基础设施层延伸的又一信号。Chan的履历令人瞩目，曾在OpenAI、特斯拉、谷歌、SpaceX等多家明星公司工作或实习，长期深耕AI基础设施。他于2021年毕业于加拿大滑铁卢大学，毕业后加入特斯拉Autopilot深度学习基础设施团队，在近三年时间里负责GPU优化、集群调度、数据中心软件及训练基础设施等工作。2024年1月，Chan正式加入OpenAI，担任技术团队成员，参与自研AI芯片项目建设。（新浪财经）</p>\n  <p><strong>AI等机器网络请求量首超人类</strong></p>\n  <p>全球最大的互联网托管服务商之一——云网络安全服务公司发布的最新数据显示，在其托管网站收到的网络访问请求中，约57.4%来自人工智能和自动化程序，42.6%来自人类用户。该公司称，这是互联网历史上来自人类的网络访问请求数量首次被机器超越。(央视新闻)</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小米机器人或将亮相小米17T发布会</strong></p>\n  <p>卢伟冰发布视频，探班小米17T发布会主讲人TJ的彩排，还送上保温杯和润喉糖。视频中出现了小米机器人的手臂，他们还一起碰拳加油，疑似小米机器人也将在发布会中亮相。（新浪财经）</p>\n  <p><strong>国际金价跌破4400美元/盎司关口，金饰克价一夜大降近40元</strong></p>\n  <p>当地时间6月5日，国际金价明显回调，跌破4400美元/盎司关口。受国际金价下行影响，国内品牌金饰价格同步回落。6月6日，周大福足金饰品价格报1323元/克，相较于5日1360元/克下跌37元；周生生报1315元/克，相较于5日1354元/克下跌39元；老凤祥报1316元/克，相较于5日1352元/克下跌36元，整体回落至2025年底水平附近。（央视财经）</p>\n  <p><strong>SpaceX IPO已获得2倍认购资金</strong></p>\n  <p>据两名知情人士6月5日透露，SpaceX本次IPO获约1500亿美元投资者认购资金，认购额度达募资计划的两倍。作为史上规模最大IPO，该认购热度已十分亮眼。知情人士提示，项目目前仍处于前期推介阶段，大型机构资金往往在IPO申购末期才递交订单，当前统计数据仅为意向申购，并非最终配售额度，实际获配数量将在定价环节敲定。（第一财经）</p>\n  <p><strong>年内32款燃油车降价</strong></p>\n  <p>乘联分会秘书长崔东树提供的最新数据显示，2026年1~5月，共有32款常规燃油车出现降价，较去年同期增加13款。纵观整个市场，今年1~5月降价规模为77款，较同期少4款。这意味着，常规燃油车降价车型数量整体占比超过40%且增速加快，带动大盘整体向下。从月度走势看，燃油车的降价节奏也有所加快。2026年5月全市场共有20款车型降价，较去年同期增加7款。其中纯燃油车型7款，较同期多5款；插混车型7款，较同期多4款。从降价力度看，常规燃油车的价格下调幅度同样处于高位。今年5月，常规燃油车新车降价车型均价为16.6万元，平均降价金额为2.5万元，降价幅度达到14.9%。今年前5月，总体乘用车市场新车降价车型均价24.1万元，降价力度算术平均达到3.2万元，降价力度13.1%。（第一财经）</p>\n  <p><strong>瑞幸咖啡回应拿铁去冰仅半杯</strong></p>\n  <p>6月6日，“瑞幸去冰不补液”一事引发消费者热议。有消费者反映，在瑞幸咖啡下单超大杯拿铁并选择“去冰”后，到手饮品仅勉强过半杯，店员解释称“公司标准配方固定，去冰不补液”。针对这一情况瑞幸咖啡方面回应称，已关注到近期关于产品“去冰”的相关讨论，公司对此高度重视。（新京报）</p>\n  <p><strong>宗馥莉自有品牌KELLYONE回归</strong></p>\n  <p>宗馥莉自有品牌KELLYONE悄然回归。KELLYONE近日推出新品果汁汽水—果然啵啵，售价每瓶为3元起，分为柠檬味、西柚味两种口味，销售区域暂限定于江浙沪。目前该产品已经上架叮咚买菜等平台，不过娃哈哈相关旗舰店并未上线该产品。KELLYONE是宗馥莉主导下宏胜饮料集团的自有品牌，“Kelly”为宗馥莉英文名，该品牌于2025年“娃哈哈风波”前后已停摆。近日，KELLYONE推出新品“果然啵啵”果汁汽水，也宣告着品牌重启。（财联社）</p>\n  <p><strong>多家低成本航空公司对登机箱登机收费</strong></p>\n  <p>近期，不少民航旅客反映自己携带20英寸“登机箱”乘坐飞机，却在登机口被拦，航空公司要求支付相应的行李费用才能把行李箱带上飞机，而且不同的航空公司执行的标准还不一样。记者搜索发现，旅客反映的情况主要集中在春秋、祥鹏、首都航空等低成本航空公司。业内人士介绍，目前中国航空公司大致分为全服务航空公司和低成本航空公司。所谓全服务航空公司，就是在票价里含有很多的服务项目。比如比较大的免费行李额、飞机上的免费餐食，以及航班延误后安排免费住宿等。而低成本航空公司则票价相对更低，但是行李、餐食等服务需要单独付费。行李差异化服务并非国内首创，在欧美市场不少航司也在推行，为不需要这些服务的旅客提供更加低廉的票价。同时专家也提醒，航空公司方面有义务做好相关的信息告知，而旅客在购票时也应该多注意航空公司的相关提示。此外，记者还尝试在多家主流在线旅游预订平台上搜索机票信息，搜索到的信息基本都有显示该价格所对应舱位的行李标准。部分平台显示有超限行李的收费标准，为旅客提供行李额的购买链接。（央视财经）</p>\n  <p><strong>富途老虎长桥之后，未被“点名”的华盛证券也将清理内地业务</strong></p>\n  <p>继富途、老虎、长桥之后，又一家跨境券商宣布清理内地存量业务。华盛证券于6月6日上午向客户发布的通知称，自北京时间6月15日起，华盛证券将对存量投资者账户在中国内地的服务进行相应调整：一是在中国内地交易服务：暂停股票等所有品种的新开仓、加仓交易，仅支持卖出、平仓操作；二是在中国内地资金划转服务：暂停资金及证券转入，转出功能保持正常。通知显示，此次调整是为落实2年集中整治期的行业监管要求，推动跨境证券业务规范发展，并强调本次调整不影响为存量投资者在境外提供服务，也不影响全体客户现有资产安全，客户可正常查询账户、持有及卖出已有持仓。这也意味着，除5月22日被中国证监会直接“点名”的3家券商外，部分中小券商也将开启存量非法业务整治。6月2日以来，老虎、长桥、富途已陆续发出相关通知，宣布自6月12日起对存量投资者在中国内地的服务进行调整。（第一财经）</p>\n  <p><strong>字节跳动：没有造车或推出汽车品牌的计划</strong></p>\n  <p>6月6日，字节跳动官微发布声明，我们注意到，近期有部分报道将“赛豆”解读为“豆包汽车品牌”或“字节跳动造车”：1.相关说法不准确，字节跳动没有造车或推出汽车品牌的计划。2.赛豆不是字节跳动或豆包推出的汽车品牌，字节和赛豆没有股权合作。3.豆包、火山引擎与汽车行业伙伴的合作，主要是给行业伙伴提供豆包大模型、智能座舱等技术服务，帮助合作伙伴提升车载智能交互体验。（每日经济新闻）</p>\n  <p><strong>网传比亚迪自研人形机器人代号“尧舜禹”、年内自用2万台，比亚迪否认</strong></p>\n  <p>日前，比亚迪自研人形机器人的消息引发广泛关注。网传其自研人形机器人代号“尧舜禹”，计划于2026年在内部部署2万台。对此，记者向比亚迪方面求证，对方表示：“‘比亚迪人形机器人代号尧舜禹’‘第七代原型机在深圳和长沙工厂实地测试’‘约150台上岗，目标年内自用2万台’等消息均不属实。”(每日经济新闻)</p>\n  <p><strong>百度成立数字人创新业务部</strong></p>\n  <p>36氪获悉，日前，百度MEG进行了新的一轮组织调整：合并商业部与电商事业部，成立大商业事业部，数字人创新业务部也升级为独立部门。此前5月13日Create 2026百度AI开发者大会上，百度正式宣布旗下数字人品牌慧播星升级为百度一镜，推出全球首个全场景多智能体数字人平台——集数字人直播、数字人视频、实时互动数字人于一体，并发布百度一镜海外版。截至2025年底，百度一镜数字人主播数已突破10万，服务30+行业。</p>\n  <p><strong>2026年度电影总票房已突破160亿元</strong></p>\n  <p>据网络平台数据，截至目前，2026年度电影总票房已突破160亿元。《飞驰人生3》《给阿嬷的情书》《镖人》暂列前三位。其中，影片《给阿嬷的情书》票房已超15.87亿元（含预售），并将于6月18日在中国香港、中国澳门、新加坡、马来西亚、文莱上映。同时，2026年暑期档已全面开启，目前已有超60部影片锁定暑期档，涵盖历史、科幻、青春、动画等多元类型，共同点燃夏日的光影热情。(央视财经)</p>\n  <p><strong>派瑞股份：公司股票被实施其他风险警示，6月9日起简称变更为“ST派瑞”</strong></p>\n  <p>派瑞股份公告称，公司收到证监会陕西监管局下发的《行政处罚事先告知书》，因公司2024年年度报告和2025年半年度报告存在虚假记载，根据相关规定，公司股票交易将被实施其他风险警示。公司股票自2026年6月8日开市起停牌一天，将于6月9日开市起复牌，股票简称由“派瑞股份”变更为“ST派瑞”，日涨跌幅限制仍为20%。公司已对相关财务报表进行会计差错更正，并启动财务内控专项提升行动。（财联社）</p>\n  <p><strong>优必选：优世界超仿生人形机器人首发预订单量累计超2110台</strong></p>\n  <p>6月7日，优必选科技宣布，旗下消费级人形机器人品牌优世界超仿生人形机器人首发预订单量6天累计达2110+台。（界面新闻）</p>\n  <p><strong>英伟达与SK海力士宣布多年期技术合作，共同开发下一代AI内存</strong></p>\n  <p>英伟达与SK海力士6月8日宣布建立多年期技术合作伙伴关系，围绕全球AI工厂建设所需的下一代内存展开联合研发，并将AI技术应用于半导体芯片设计与制造。根据协议，SK海力士将为英伟达Vera Rubin AI超级计算机、Vera CPU、RTX Spark PC及Jetson Thor机器人计算平台协同开发专用内存，由此进入英伟达正在开拓的AI基础设施、个人AI及物理AI等新市场。在半导体制造领域，SK海力士将采用英伟达CUDA-X库及PhysicsNeMo框架加速芯片仿真和光刻计算工作流；同时借助英伟达Omniverse和cuOpt构建晶圆厂数字孪生，推动工厂自主化运营。（界面新闻）</p>\n  <p><strong>科技“老登”重上AI牌桌，AI产业演进趋势重新定价</strong></p>\n  <p>近期，以戴尔、联想集团为代表的公司“老树发新芽”，不少传统公司正重回行情与投资的“C位”，并频频现身权益类基金的核心重仓名单。有分析指出，科技“老登”重上AI牌桌，这绝非一次简单的高低切炒作，而是机构投资者在深思熟虑后，对AI产业演进趋势的重新定价。多位公募基金人士表示，随着AI建设需求向更多细分领域深度转移，科技投资正逐步从主题驱动转向业绩驱动。在这个去伪存真的过程中，拥有坚实基本面兑现能力、能切实受益于产业生态重塑的“老面孔”，正迎来中长期估值体系的系统性抬升。（证券时报）</p>\n  <p><strong>京东方A回应存储涨价对显示行业的影响</strong></p>\n  <p>关于“存储涨价对显示行业的影响”的问题，京东方A在机构调研时表示，受存储涨价对消费电子冲击的影响，根据咨询机构预计，终端厂商与面板厂商在部分产品类别将承受一定压力。分产品类别来看，对笔记本电脑和智能手机终端需求有可能产生一定程度的影响；综合考虑TV面积需求增长等因素，对电视终端需求影响有限。（华尔街见闻）</p>\n  <p><strong>韩国投资者持续买入中国硬科技</strong></p>\n  <p>近期，韩国投资者正持续加码布局中国硬科技资产。数据显示，过去1个月，寒武纪、麦格米特、机器人ETF华夏、宁德时代等成为最受韩国投资者青睐的A股投资标的，AI芯片龙头寒武纪更是获得近2000万美元净买入。此外，多只在美上市的海外中国科技ETF也迎来资金显著净流入。多家外资机构认为，中国科技领域兼具高增长空间与估值优势，在全球资产配置中具备稀缺投资价值，海外资金正加速捕捉中国科技产业发展红利。 (上海证券报)</p>\n  <p><strong>黄仁勋会见韩国两大游戏商代表共商游戏AI合作方案</strong></p>\n  <p>据报道，英伟达首席执行官（CEO）黄仁勋7日在首尔江南区的网吧先后会见韩国游戏公司KRAFTON创始人兼董事长蔣柄圭和游戏开发商NCSOFT代表金泽辰。据悉，当天黄仁勋和蔣柄圭可能就物理AI等人形机器人，以及基于英伟达近期发布的首款AI笔记本电脑系列“RTX Spark”的游戏领域合作等进行讨论。KRAFTON长期与英伟达合作研发AI功能，并将其融入游戏之中。通过游戏结成的合作关系还推动了双方有关物理AI合作的讨论。KRAFTON主要高管去年4月访问英伟达位于美国加州的总部，同黄仁勋就包括机器人在内的新一代技术合作方向进行了探讨。在结束与KRAFTON高管的会面后，黄仁勋移步附近的另一家网吧，同金泽辰以及NCSOFT高层会面。黄仁勋还同金泽辰“闪现”网络直播，就游戏产业和AI技术的发展方向等交换意见。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>华恒生物：香港联交所审议公司发行H股并在主板挂牌上市申请</strong></p>\n  <p>6月7日，华恒生物发布公告，公司正在进行申请发行境外上市股份（H股）并在香港联合交易所有限公司主板挂牌上市的相关工作。香港联交所上市委员会于2026年6月4日举行上市聆讯，审议公司本次发行上市的申请。公司本次发行上市的保荐人已于2026年6月5日收到香港联交所向其发出的信函，其中指出香港联交所上市委员会已审阅公司的上市申请，但该信函不构成正式的上市批准，香港联交所仍有对公司的上市申请提出进一步意见的权力。（界面新闻）</p>\n  <p><strong>沪士电子、曦华科技递表港交所</strong></p>\n  <p>据港交所文件，6月5日，沪士电子股份有限公司向港交所提交上市申请书，联席保荐人为中金公司、汇丰；深圳曦华科技股份有限公司向港交所提交上市申请书，独家保荐人为农银国际。（界面新闻）</p>\n  <p><strong>AI时代年轻人生存小调查</strong></p>\n  <p>过去两年，AI真正进入我们的工作体系，有人因此效率提升，有人重学技能，也有人第一次感受到个人能力可能随时被重新定价。越来越多人开始认真学习AI、订阅会员、囤大量Prompt……但这些投入真的让人更有安全感吗？扫码参与我们的“AI时代年轻人生存小调查”，分享你在AI浪潮下的真实处境与选择。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260608/v2_907f94c79e2447fbb6b0a0cdce1aeb9d@5667365_oswg20685oswg421oswg389_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI时代年轻人生存小调查</p>\n  <p><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-06-08T00:01:39+00:00", "fetched_at": "2026-06-08T03:34:07.059844+00:00", "fingerprint": "c3e0fc63840344eb"}, {"source": "36氪 - 最新文章", "title": "「华超神控」获亿元天使系列融资，加速打造新一代AI超声脑机接口平台 | 36氪首发", "url": "https://36kr.com/p/3841459663030532?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，近日，新一代AI超声脑机公司华超神控（BCI-Sonics）已完成亿元人民币级天使轮系列融资。天使轮融资由经纬创投领投，天使+轮由德联资本、道远资本联合领投，循光资本持续担任独家财务顾问。募集资金将用于推动公司的技术验证与产业化落地。</p>\n  <p>华超神控于2025年创立，创始人李昕是中国科学院与德国弗劳恩霍夫IGD研究所联合培养生物医学工程博士，曾任GE医疗全球科研中心中国区负责人，并连续创立创新科技及医疗公司，在医疗影像、AI、脑机接口与产业转化方面拥有深厚积累。</p>\n  <p>公司核心团队汇聚了来自清华大学、上海交通大学、帝国理工等海内外高校的人才，覆盖神经科学、声学、医学影像、人工智能等多个方向，兼具研发与产业经验，熟悉医疗器械从原理样机、工程样机、临床验证到注册转化的完整路径。</p>\n  <p>据了解，<strong>华超神控团队在创业前已就超声脑机接口技术方向的产业确定性达成共识</strong>，属于“先有团队、目标、技术积累和临床判断，再走向创业和融资”。</p>\n  <p>被这批资深“老炮儿”集体看好的超声脑机接口技术，是当前脑机接口赛道中的热门细分方向，已经吸引了OpenAI创始人Sam Altman、Coinbase联合创始人Fred Ehrsam等硅谷科技派亲自下场创业；在国内，相关企业和科研团队也在密集布局，有说法认为，国内超声脑机几乎与海外站在同一起跑线，技术差距“不到1.5年”。</p>\n  <p>超声脑机接口之所以“火爆”，要回到脑机接口技术本身：大脑被称为人类认知的\"最后疆域\",也是未来科技领域最难攻克的堡垒之一。传统脑机接口解决方案以侵入式/半侵入式或非侵入式为主，前者要开颅，后者使用的经颅磁电刺激等方法虽更安全，但空间分辨率有限，难以作用于深脑区。</p>\n  <p><strong>那么，人类能否在不打开颅骨的前提下，无创而精准地修复大脑?</strong></p>\n  <p>这正是华超神控想要达成的目标：将原本“只能依靠外科手术才能触及的深部脑区,变成一次无创、可逆、可在门诊完成的精准调控”。</p>\n  <p>因此，与传统方案不同，华超神控选择了低强度聚焦超声（tFUS/LIFU）这一技术路径，因为超声是目前少数兼具“无创、深部可达和高时空分辨率潜力的物理通路”。经颅磁刺激仅能作用于约2cm的浅层皮层，而低强度聚焦超声可以无创穿透颅骨，深入脑内数厘米，精准触及那些决定运动、情绪、疼痛与成瘾的关键深部核团。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260606/v2_461d2f7a83764e1490959fe24e2a75f8@5930287_oswg256291oswg1344oswg768_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：华超神控</p>\n  <p>这个过程中，最重要的是精度。人的颅骨厚度、密度、曲率存在显著个体差异，超声穿过颅骨时会发生相位畸变、能量衰减与焦点偏移。因此，如果缺乏有效的相位校正，理论靶点与实际声场焦点就可能出现偏差，影响刺激有效率与临床可重复性。</p>\n  <p>华超神控通过自研的经颅相位校正算法，对颅骨造成的声场畸变进行快速补偿，将经颅聚焦精度收敛至最低1.5mm，这相当于在数厘米深处实现毫米级精准调控。</p>\n  <p>“这种经颅相位校正能力，是tFUS技术从实验室研究走向可验证疗效、可复制操作和准商业化设备的核心门槛之一。”李昕认为。据介绍，目前，华超神控这套自研经颅相位校正算法可在极短时间内完成个体化校准，也是国内少数具备该能力、且即将迈向商业化的超声脑机设备。</p>\n  <p>此外，华超神控的另一大技术壁垒，在于其AI闭环神经调控平台。公司并非要做一台单一的刺激设备，而是打造“读取—理解—调控—反馈—再优化”的闭环系统。一方面，通过多模态神经信号采集，并配合高精度声学反馈AI算法进行实时剂量反馈；另一方面，以AI算法识别脑状态、生成个体化刺激方案，动态调整调控策略。这相当于打通了“解码”与“调控”能力：用AI实时读取、解析神经活动，以低强度聚焦超声精准干预，再依托双模态监测构成完整闭环，在毫秒级尺度上动态校准靶点与剂量。</p>\n  <p>对于患者来说，这种看起来精深、复杂的技术带给自己的直接获益是什么？打个比方，以往，一位帕金森PD患者如果想缓解症状，特定情况的患者往往需要接受有创植入式的脑深部电刺激(DBS)；现在，依托无创的超声脑机接口调控技术刺激特定的核团区域，或许也能达到相近的效果，重获体面的生活。</p>\n  <p>现阶段，华超神控已与多所高校、三甲医院及临床专家团队建立深度合作，推进底层声学技术、神经调控机制、多模态数据采集、临床方案设计与真实世界验证等方面的实践，<strong>围绕疼痛、成瘾、神经重塑等方向共同设计研究路径、验证临床价值，推动超声脑机接口技术从科研样机开发走向准临床应用</strong>。</p>\n  <p>李昕相信：\"脑机接口真正实现产业化，需同时满足三个条件，即底层技术具备可验证的物理与生理机制；设备具备工程化，标准化和可复制能力，以及足够清晰的产品路径，使其能在真实应用场景中持续得到验证。\"</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>经纬创投表示，相较于传统植入式方案，低强度聚焦超声（LIFU）技术在刺激深度及空间分辨率上兼具优势，并实现了无创刺激，极大地拓宽了从临床治疗到消费健康的边界。公司核心团队在底层算法与换能器工艺上具备极强的技术壁垒，其产品不仅在学术端具备先发优势，更在泛医疗AI及神经康复领域展现出极强的工程化落地能力。我们期待与公司并肩，共同定义脑科学领域的“下一个十年”。</p>\n  <p>德联资本表示，经颅聚焦超声作为近年来新兴的无创神经调控手段，具备深度大、精度高、靶点可靠等特点，最大程度弥补现有传统经颅电、经颅磁的不足，可扩展性强，应用潜力巨大。华超神控是国内罕有的可实现全产业链自研的平台型企业，具备声学相关硬件、算法研发，高集成度医疗器械开发、注册等多种核心能力，以及全周期实战经验。我们看好并相信公司，未来凭借AI+超声一体化解决方案，实现从科研到临床、从院内到消费的全流程产品落地，推动行业发展的同时，造福患者及广大人群。</p>\n  <p>道远资本表示，大脑是人体最重要的器官，人类对于大脑的探索尚处于早期，脑科学是道远资本看好并持续布局的核心领域之一。超声脑机接口和神经调控是国际国内研究热点，拥有深部可及、安全精准等优势，已经从实验室开始走进临床并持续探索不同适应症和应用场景，华超神控团队在超声脑机接口和神经调控方向深耕多年，积累深厚，执行力强，我们对公司未来的发展充满信心，期待能为更多患者和广大人群带来更好的超声解决方案。</p>\n  <p>循光资本表示，超声脑机接口是当前非侵入式神经调控领域最具临床可及性与平台化潜力的技术路径之一，而真正能将这条路走通的团队，在全球范围内屈指可数。华超神控的核心优势，不仅在于这支团队对\"超声+闭环+AI\"这一神经科学前景方向的准确判断和技术积累，更在于其极为罕见的产业化凝聚力——先有共识，再有创业。循光资本将持续与华超神控并肩前行，期待公司在神经科学这片广袤蓝海中迸发出真正的爆发力。</p>", "category": "tech", "published_at": "2026-06-08T00:30:00+00:00", "fetched_at": "2026-06-08T03:34:07.059829+00:00", "fingerprint": "31122b0a2693e03f"}, {"source": "少数派", "title": "接住来自空间站的信号：如何用手台接收 SSTV？", "url": "https://sspai.com/post/110108", "summary": "它不是玄学，也不是单纯的浪漫。它是频率、传播、天线、轨道、多普勒效应，以及我们手中那一点点设备共同完成的一次小小实验。<a href=\"https://sspai.com/post/110108\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T08:34:12+00:00", "fetched_at": "2026-06-08T03:34:05.337486+00:00", "fingerprint": "70de63b8130138f0"}, {"source": "少数派", "title": "派早报：乘用车越造越重，12 年增重近 400 公斤", "url": "https://sspai.com/post/110847", "summary": "<p>乘用车越造越重，12 年增重近 400 公斤</p><p>iFixit 拆解华强北山寨苹果产品</p><p>Cloudflare 收购 Vite 背后公司</p><p>rsync 疑因 AI 参与维护出现 bug，引发争议</p><p>OpenAI 与美国政府商讨捐赠股权</p><p>美国平均上路车龄达到 13 年</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/110847\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T22:52:23+00:00", "fetched_at": "2026-06-08T03:34:05.337475+00:00", "fingerprint": "c59cd404bf4a0b91"}, {"source": "The Guardian - World", "title": "Ebola spread in central Africa could match 2014 record outbreak, US health officials say", "url": "https://www.theguardian.com/world/2026/jun/06/ebola-spread-in-central-africa-could-match-2014-record-outbreak-us-health-officials-say", "summary": "<p>Modelling from US CDC shows Ebola spread could be on ‘dangerous trajectory’, but experts warn outbreaks can be very hard rss", "summary": "<p>一周之内，三款“9系”旗舰SUV密集上市，高端新能源市场竞争战况升级。</p>\n  <p>5月15日，理想发布新一代L9，其中Livis版本搭载800V主动悬架、线控制动、线控转向的全线控底盘，售价50.98万元起。</p>\n  <p>5月27日，蔚来ES9与问界新M9同天发布。姚明也称“空间大”的蔚来ES9，起售价49.8万元；在高端市场已经破局的问界M9，起售价49.98万元。</p>\n  <p>冲击50万元级的高端市场，似乎已成为头部新能源车品牌的共识。这背后是战略需要，也是直接的财务驱动。</p>\n  <p>2026年一季度，理想汽车销量同比增长，但由于70%订单为L6、i6等入门车型。销量结构的下沉，让理想这家最早盈利的新造车公司再度陷入季度亏损。</p>\n  <p>蔚来则通过定价40万元级的ES8，将主力销售区间从30万元抬升至40万元级别，配合销量增长带来的规模效应，一季度亏损大幅收窄。</p>\n  <p>在新能源市场多年的配置与价格内卷下，平价入门车型的利润空间已日益稀薄。</p>\n  <p>新势力品牌纷纷向50万元级突围，不仅是品牌定位的向上攀登，更是关乎企业生存与可持续盈利的必然选择。</p>\n  <p>然而，50万元级市场的竞争环境正变得严峻。乘联会数据显示，40万元以上汽车市场的整体规模已连续多季度萎缩。尽管新能源渗透率持续提升，但燃油高端车仍占据销量主体。</p>\n  <p>在此背景下，这场旗舰之争的真实战况究竟如何？36氪走访了北京、广州、深圳等地的13家门店，试图厘清战局，找到这场“9系”争霸的真正赢家。</p>\n  <h3>蔚来、理想强攻，问界M9守擂</h3>\n  <p>“很多客户感叹理想的驾驶感受突飞猛进”，多位理想销售人士告诉36氪，许多用户试驾L9 Livis后都当场下单，“很多汽车从业者来试驾后都表示，理想这一代底盘在9系车里算是第一档”。</p>\n  <p>此外，理想新L9的另一升级点是自研马赫芯片上车，但两个配置间如今在功能上并无差别。底盘能力成为新一代L9的实质核心卖点。</p>\n  <p>自2022年上市以来，理想L9的市场定位始终为六座“奶爸车”。其初代车型悬架调校和行驶表现虽一度被调侃像“开船”，但在2023年，L9年度销量依然突破11万辆，成为中国增长最快的新能源高端车之一。</p>\n  <p>家庭市场的真实诉求在于空间与舒适，对底盘性能并不苛求。而上升到50万价位，用户期待的又是超越家庭场景的综合豪华体验。从这个角度来看，设计含蓄的理想新一代L9注定了在高端市场“慢热”。</p>\n  <p>蔚来ES9同样以底盘作为亮点，配备了带主动悬架和线控转向的“天行底盘”。且36氪了解到，新车上市后72小时，搭载该底盘系统的行政签名版订单占比几乎超过80%。</p>\n  <p>多位蔚来销售人士告诉36氪，ES9上市后，ES8车型的订单也迎来小幅增长，“有部分ES8潜在用户下了ES9的预售，他们挺想要天行底盘，但正式上市后觉得价格偏高”，“如果不买天行底盘，ES8已经足够满足家庭需求了”。</p>\n  <p>真正下单ES9的客户，则大多都曾对比理想L9与问界M9，“理想L9定位和我们就不同，没有可比性。而同样是豪华商务定位里，车主们认为蔚来比其他品牌审美更在线，豪华感更精致”，有销售人士表示。</p>\n  <p>36氪在与多位已下订蔚来ES9的用户交流后发现，他们普遍有一个共识：在同级车型中，ES9的驾驶质感并不出彩。然而，在他们选购新车的天平上，极致的驾驶感并非必需项。</p>\n  <p>“50万的国产车里，只有蔚来的内饰是原创的，并且原创得还很好看、很豪华，这还不够吗？”，一位购买过两款蔚来汽车的用户直言。</p>\n  <p>在豪华车市场，设计与用料历来是基本的入场券。BBA时代竞争围绕“堆料”展开，实木、镀铬是彰显豪华的标配。然而，以特斯拉为代表的极简主义新范式席卷而至，即便是百万级的Model S，其“毛坯”内饰也曾引发市场质疑：高端新能源车，是否已不再需要设计豪华？</p>\n  <p>蔚来以行动完成了回答：高端客群的诉求从未改变。ES9凭借其独特的设计与扎实的用料向上突围，便是对这一诉求的精准回应。</p>\n  <p>问界新M9则呈现了第三种竞争态势。尽管与理想新L9一样选择了低调的内在升级路径，但问界用户对此的接受度明显更高。</p>\n  <p>多位销售人士告诉36氪：“新款确实有很多升级，比如传感器更多了之类的。但说实话，客户不怎么在乎配置，很多客户也不对比其他品牌，他们就是要买一辆问界M9，他们知道这是智能化最好的车”，高端客群对华为的技术品牌，已然建立起独特信任。</p>\n  <p>理想锚定家庭场景与细节体验，通过扎实的底盘调校提升舒适；蔚来聚焦设计与豪华感知，在审美与材质上建立壁垒；问界则在进一步夯实高端客群对品牌的信任。</p>\n  <p>新能源浪潮改写了旗舰SUV的竞争叙事，主战场从BBA时代的60-80万元，下探至50万元级。在有限的成本约束下，“全能”已不现实。因此，市场呈现出一种有趣局面：9系旗舰新车们有着相似的价格与配置，却分别在将某单一维度的体验上限推向极致。</p>\n  <h3>问界、蔚来破圈高端，理想陷于家庭定位</h3>\n  <p>目前理想新L9则在上市两周内收获1万辆锁单订单，问界新M9则在上市24小时后突破2万辆锁单订单。蔚来ES9如今的交付周期则显示为16–18周。</p>\n  <p>高端汽车市场的竞争是长期进程。新车上市初期的销量数字固然值得关注，但背后所反映的用户结构与品牌发展轨迹，才是决胜的关键。</p>\n  <p>36氪曾在理想新L9上市72小时的探店报道中提到，理想L9 Livis的老车主复购比例高达70%。蔚来的销售向36氪透露，ES9的老用户复购率同样惊人，“接近一半订单都是老车主复购”。</p>\n  <p>然而，两家品牌所依赖的“老本”并不相同。</p>\n  <p>有理想销售人士向36氪回忆，L9 Livis亮相后，销售团队便开始逐一邀约老车主前来体验，但多数客户都因超55万元的预售价偏高而婉拒，团队一度感到气馁。直到正式售价公布，初代理想ONE车主可用约48万元的落地价购入L9 Livis，局面才有所改变。</p>\n  <p>有销售人士向36氪坦言，理想汽车的用户群体既追求舒适体验，也看重性价比，“并非所有老车主都有50万的消费力，很多人都在等更便宜的L7、L8 Livis”。</p>\n  <p>蔚来的客户群体则截然不同。</p>\n  <p>理想2020年发布的首款车理想ONE定价30-35万元，而早在2018年，售价超过50万元的蔚来ES8便已实现年销过万辆的成绩。</p>\n  <p>多位蔚来销售人士告诉36氪，其销售团队同样采取了一对一邀约老车主的策略，“初代蔚来车主对ES9很有兴趣，甚至很多人都在持续关注蔚来的新品动态”。</p>\n  <p>36氪从门店侧了解到，蔚来ES9的新增订单中，有20-30%订单为公司购车。尽管蔚来提供了“0首付、5年分期免2年息”的优惠方案，全款购车的比例也仍居高不下。</p>\n  <p>相比之下，理想L9 Livis并未提供有优惠的分期政策，但其分期购车的比例却更高，“卖一周了，我手里没有一个全款订单”，北京市中心某门店的销售人士向36氪表示。</p>\n  <p>问界呈现出的态势与蔚来类似，但其高端认同的覆盖范围显然更广。其影响力不仅限于一二线城市，更广泛渗透至众多三四线城市。有问界销售人士告诉36氪，“很多县城企业主都在买问界，他们说生意场上大家只认这个，不认理想蔚来”。</p>\n  <p>整体来看，无论在购买力、品牌忠诚度还是用户圈层属性上，蔚来和问界都呈现出更符合高端市场的特征。</p>\n  <h3>9系车的集体焦虑：寻找高端符号</h3>\n  <p>36氪曾在一篇报道中指出，蔚来旗下全系车型的城市销量都与换电站布局呈现高度相关性：换电站建在哪里，销量就集中在哪里。用户画像固然高端，但其市场分布存在显著区域集中性，客户大多分布于换电站密集的一、二线城市。</p>\n  <p>相比之下，传统旗舰SUV车型宝马X5，其市场影响力则更为广泛和稳固。从月销1.1万辆波动至4000辆，但影响力仍持续覆盖超过100座城市。想在高端市场扎根，新能源品牌必须具备超越核心城市、辐射更广区域的能力。</p>\n  <p>36氪走访了山西、河北等地非省会城市的问界门店，多位销售人士告诉36氪，门店每月订单已稳定在十位数级别，“现在我们的主要工作是解答配置、权益与交付周期的问题，这个车好不好、比谁好都已经不需要多说了”。上牌城市数据也同步显示，问界的影响力已渗透至全国近200座城市。</p>\n  <p>过去三年，问界的独立用户中心与鸿蒙智行门店从约800家迅速扩张至超过2400家，大幅拓宽了品牌的线下触达网络。</p>\n  <p>与此同时，其母公司赛力斯在2025年财报中披露的销售费用超过240亿元，而理想、蔚来相关费用仅在百亿级别。值得注意的是，问界旗下仅5款车型，销售费用规模却与拥有约40款车的比亚迪接近。</p>\n  <p>一位资深奢侈品行业人士向36氪表示，高端市场的核心标志是溢价，而是否拥有溢价能力则很大程度取决于如何营销，“那些具备强溢价能力的奢侈品，制造成本都没那么夸张，最主要的成本还是花在了营销和服务上”。</p>\n  <p>持续的高强度投入，配合春晚等顶级曝光资源，已带来直观的成效：一线销售不再需要向客户解释“问界是谁”，品牌认知已深入人心。</p>\n  <p>“华为最懂高端客群要什么。配置、设计都在其次，他们最在意的其实就是「有没有人知道你开的是一台50万的车」”，一位问界门店销售负责人向36氪表示。</p>\n  <p>理想L9 Livis的车主心态则形成一组有趣对照。</p>\n  <p>广州地区一位理想店长告诉36氪，理想为L9的Livis版本推出了限定的拼色车身，但2万元的选配价让许多消费者望而却步，“有一个小兄弟定了Livis的裸配，跟我说已经订好了双拼的改色膜。他不舍得花2万选车身，但如果没有双拼色，这车跟40万买的老款没有一点区别，别人根本不知道他花了50多万”。</p>\n  <p>一位从宝马跳槽至问界的销售负责人向36氪直言，“以前买宝马的客户哪里看配置，买BBA其实就是买名片。很明显，M9现在就在做同样的事。买车要拼配置，但买名片只需要看抬头”。</p>\n  <p>问界M9如今解决的正是这种“辨识度”焦虑。它不再仅依靠设计与配置彰显高端，而是借助华为与问界日益提升的品牌认知，直接成为一张“移动名片”。</p>\n  <p>在旗舰SUV市场，极氪9X同样以一张“高辨识度名片”的身份初露头角。这款被称为“杭州库里南”的车型，已连续多月实现月销近万辆。</p>\n  <p>多位极氪销售人士向36氪表示，9X的前脸设计便是最大卖点，吸引了不少企业主用户换购，“很多客户的原话，说这张前脸值100万”。</p>\n  <p>一位曾在奔驰就职的销售告诉36氪，“极氪9X现在影响力拓展得很快，但9X并没有给我们其他车型带来引流。9X靠前脸成为爆品，但极氪还没成为能在50万元站稳脚跟的品牌”。</p>\n  <p>2026年，40万元以上新能源市场销量同比暴涨超70%，无论理想、蔚来还是问界，都擅长打造“爆品”，但至今也尚未出现能够穿越周期、持续畅销的经典车系，竞争仍深陷于配置与价格的肉搏之中。</p>\n  <p>问界M9背靠华为，似乎拼出了一条将智能化转化为“社交名片”的新路，但让更广泛的人群认知并认同其品牌价值，本身就是一项成本巨大的工程。</p>\n  <p>在传统燃油时代，高端车市场从未出现“赢家通吃”的局面，新能源时代也同样不会。仅靠价格战抢夺销量并非长久之计。</p>\n  <p>新能源品牌的真正竞争，应是如何让品牌摆脱对配置与价格的依赖、建立起真正的护城河，这才是汽车品牌们前仆后继投入高端市场的核心原因。</p>", "category": "tech", "published_at": "2026-06-05T06:52:26+00:00", "fetched_at": "2026-06-06T02:45:12.548699+00:00", "fingerprint": "684ba2095cf49c84"}, {"source": "36氪 - 最新文章", "title": "中国入境游距离「世界第一」还有多远？", "url": "https://36kr.com/p/3840001908361472?f=rss", "summary": "<p>“曾有外国友人让我推荐中国的最佳旅行目的地，我的回答是：你应该看看中国的山。”</p>\n  <p>最近的一场入境游研讨会，携程集团联合创始人兼董事局主席梁建章这样回答。在他的表述中，中国有世界最高的山——喜马拉雅；全世界最美的山，则在中国南方最独特的喀斯特地貌——桂林。</p>\n  <p>与此同时，他正将这份“私藏推荐”转化为全球旅行者的实际行动。</p>\n  <p>近期<strong>，携程集团宣布了一项新的战略计划：未来五年，公司将引入2亿人次的入境游客。</strong></p>\n  <p>在同期进行的桂林之夜入境游推广活动上，国际影星成龙也以“携程入境游大使”的身份亮相活动现场。当成龙遇上桂林山水，携程决心赋能入境游整体链条的变革正拉开序幕。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_109338fd67604ac8a99e743ad140d5bb@11416942_oswg873759oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国际影星成龙成为“携程入境游大使”</p>\n  <h2><strong>01. “中国入境游应做到世界第一”</strong></h2>\n  <p>近年来，国家密集出台的便利外籍人员来华政策，也让“China Travel”在全球社交媒体上蔚然成风。</p>\n  <p>据国家统计局公布的数据，2025年我国入境外国游客（不含港澳台）已超过3500万人次，同比增长30%，其中免签入境外国人达3008万人次，同比增长近50%。免签政策对客源拉升效应显著。另据联合国世界旅游组织数据，2025年1至11月，中国国际旅游收入增幅近40%，位列全球第六。</p>\n  <p>然而，仔细拆分数据，中国的入境游人数仍不如欧美。2025年，外国人入境中国的人次超过3500万——从人数上看，我们距离泰国、日本、西班牙等入境游强国仍有显著差距。</p>\n  <p>梁建章还从国际贸易视角提出了观察：中国的出境游与美国处于同一量级，但入境游却比美国少了2000多亿美元，导致我国在旅游服务贸易上存在较大逆差。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_78474ccefda24f4981becd5c51a3cf75@11416942_oswg92470oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">携程集团联合创始人兼董事局主席梁建章</p>\n  <p>在他看来，中国的入境游有充分的理由做到世界第一：</p>\n  <p>第一，自然与人文的复合资源全球罕见。“桂林山水甲天下”中的“天下”指的是全世界，如果将中国深厚的历史底蕴与顶级的自然风光叠加，全世界能与之匹敌的其他国家或地区寥寥。</p>\n  <p>第二，中国拥有几乎全球第一的基础设施。游客在几小时内便能从绝美的自然风光切换到繁华的都市生活，这种时空压缩的效率能带给人们极致的旅行体验。</p>\n  <p>第三，中国旅游产品的高性价比，对发达国家是降维打击。梁建章举例道：中国五星级酒店的均价在1000-2000元人民币，巴黎或纽约则是1000-2000美元，价差高达数倍。</p>\n  <p>第四，中国的硬核科技具有极强的展示性，中国拥有无人机表演等科技景观，形成了一定的吸引力。而这些“绝对的竞争力”也构成了中国入境游能够与欧美成熟大国比拼的底气。</p>\n  <p><strong>此外，梁建章还指出，入境游不仅能直接创造大量外汇收入，缩小旅游逆差，对汇率有支撑作用，还具备强大的产业乘数效应。</strong></p>\n  <p>旅游消费会带动就业、相关产业投资，同时还能拉动海外投资、留学、置业、医美等延伸消费，综合下来对GDP的拉动作用远高于入境游本身的产值，整体贡献有望达到5%至8%。</p>\n  <p>这也意味着，入境游不只是赚钱的生意，更是推动中国宏观经济结构转型的关键杠杆。</p>\n  <h2><strong>02. 布局十年，改善“五大痛点”</strong></h2>\n  <p>“10年前，我和团队说中国的入境旅游未来是巨大的机会，但当时存在很多瓶颈。”<strong>梁建章将其总结为五大痛点：签证不便、支付困难、网络访问受限、交通衔接不畅以及国家层面的宣传薄弱。</strong></p>\n  <p><strong>十年过去，这五大痛点在政策与产业的合力下得到了极大的改善。</strong></p>\n  <p>截至目前，中国已对80多个国家实行免签，外卡绑定移动支付已极为便利，高铁网络织得更密。国家的形象宣传也随着免签政策的开放，潜移默化地转变为足以改变海外认知的“软实力”。</p>\n  <p>携程最新发布的《中国入境游发展年度报告》，也清晰地向外界展示了为应对全球涌现的入境游需求，可复用的解决方案。</p>\n  <p>报告将中国入境游客细分为六大客群：</p>\n  <p>追求高性价比和时髦打卡地的“周末型”韩国游客；依赖社交媒体推荐的“社交型”东南亚游客；飞行时间长、偏好“深度型”的澳大利亚游客；注重“高端服务”的中东游客；环保意识强、偏爱高铁游的“成熟型”欧洲游客；以及需要清真友好产品的“高潜型”印尼和越南游客。</p>\n  <p>但这些人群也都有“预订周期极长，最长可提前一年”的共性，且中国的入境游客在目的地停留的时间普遍高于平均水平。梳理出确切的用户画像后，携程也能精准触达这些入境游客的痛点。</p>\n  <p><strong>针对“行前”，携程采取了高饱和式的海外营销。</strong></p>\n  <p>自2025年9月起，携程在全球联动头部艺人与KOL，共创特色路线。截至目前，已组织17批达人团、近千名KOL来华，精准覆盖高净值客群。</p>\n  <p>此外，对于即将来到中国、正规划行程的游客，携程也通过AI辅助，帮助他们选择心仪的出行路线。</p>\n  <p><strong>真正的攻坚战场，在于“行中”环节。</strong></p>\n  <p>携程首席执行官孙洁介绍道，在支付与预订上，携程海外版支持近65种支付方式、44种结算币种，23种语言的智能票机覆盖了280余家景区。</p>\n  <p>此外，携程还推出了“机场中转半日游”，针对“欧洲高铁游”等特定需求做“主题游”，同时提供英、韩、泰等语言的深度服务，个性化的定制游增长达到40%。</p>\n  <h2><strong>03. 产业赋能：让每一个从业者都赚到钱</strong></h2>\n  <p>努力优化入境游体验最终还需要所有的从业主体来实现，在此背景下，<strong>携程专门投入了10亿元专项资金，帮助商家和服务人员获得“外国人生意”订单。</strong></p>\n  <p>这种赋能，首先体现在对目的地和景区底层数字能力的建设上。</p>\n  <p>过去，世界级景观常常缺少一条便于外国游客入园的通道。</p>\n  <p>在桂林龙脊梯田，这一痛点曾极为典型。层层叠叠的梯田让无数国际旅行者神往，游客们却常常卡在景区入口：人工窗口大排长龙，语言不通，支付受限，买一张票折腾十几分钟。一位泰国游客曾在社交媒体写道：“龙脊梯田的美景值满分，但买票只能给及格。”</p>\n  <p>携程介入后，落地了一套“三把钥匙”的解决方案：部署了支持中、英、日、韩、泰等6种语言的自助售票机，海外游客护照一扫、移动支付，30秒出票；在景区入口，携程还设置了多语言地推二维码，扫码即可入园；另在各大景区的官方公众号，嵌入了Trip.com的购票链接，实现微信生态与全球预订平台的无缝衔接。</p>\n  <p><strong>结果是，游客购票的效率提升了80%，用时从3分钟缩短至30秒，景区通过携程平台预订的入境游客量同比猛增464%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_fde893b579294e8fa679a92e1c439c3f@11416942_oswg860997oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>同样的变化发生在桂林芦笛岩，这座“大自然的艺术之宫”。</p>\n  <p>过去，高峰期入境游客排队超过10分钟，语言不通，Apple Pay等国际支付方式无法使用，景区对客源构成缺乏感知。</p>\n  <p>在携程部署的多台入境游专用自助售票机后，不仅平均购票时间从15分钟压缩至30秒以内，还解放了约50%的人工售票人力，使其转向更有温度的导览服务。</p>\n  <p>关键是，景区的每一笔交易都能沉淀为直观数据，景区第一次看清楚了“究竟是谁在买票”“旅客们都来自哪里、又偏向怎样的产品”。<strong>精准营销变得有的放矢，入境游客量同比增长73%。</strong></p>\n  <p>对于已具规模的酒店集团，携程也提升了他们的经营效率与跨文化的服务能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_2e032f4279944677a8e072e8a8742a80@11416942_oswg1362955oswg1080oswg757_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>以桂林的诗与远方酒店集团为例，通过参加携程海外平台的“订房送eSIM”和“GO CHINA”大促活动，其在阳朔的门店，两个月内的入境订单量同比增长超过150%。酒店总经理陈丽透露，酒店目前的线上入境订单占比，已从不足10%跃升至30%，客源从香港、东南亚拓展到美国、澳大利亚、法国等全球市场。</p>\n  <p>这家酒店真正的护城河，来自服务颗粒度的细化。在更多外国客人的反馈中，门店内的鸬鹚捕鱼表演、时令非遗手作等活动，让人印象深刻。与此同时，酒店还提供来自本地的24小时中英双语管家，从客人下单起就提供陪玩攻略，解决了自由行游客最大的信息不对称问题。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_fdd63b8891ee4b829f76869fcd55fa18@11416942_oswg189247oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片由采访对象提供</p>\n  <p>桂林泊隐酒店集团则从另一个维度诠释了服务升级。</p>\n  <p>运营负责人何静分享了一个细节：一位意大利客人因周边餐厅晚上七八点打烊而差点饿肚子，这件事直接催生了酒店将餐厅延至晚9点半的“深夜食堂”制度。</p>\n  <p>随后，集团所有门店设立18小时在线外宾沟通人员，自动为外宾选无烟房，提供免费洗衣烘干送回服务，并在店内设置非遗体验区，让客人制作漓江拼画、艾草香包，将桂林记忆带回家。截至目前，桂林泊隐酒店的<strong>入境订单已同比增长60%，欧美及俄罗斯远途客源明显上升。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_1319697b0d5f41dcb52982c2967329c8@11416942_oswg158394oswg1080oswg813_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片由采访对象提供</p>\n  <p>更为重要的是，对于广泛的产业链个体，携程也带来了结构性的机遇。</p>\n  <p>此前有媒体报道称，曾经的远洋海员，利用自身的英语优势和对张家界的了解，转型为旅行定制师。还有“下岗再就业”的教培教师，精准抓住了西语导游的机会，月收入翻番。这些案例的背后，是“免签+平台”的双重红利下，市场对小语种人才的渴求。</p>\n  <p><strong>在消除海外游客信任壁垒的同时，携程正在为全行业商家赋能，让整个产业链上的玩家都能敢接，也能接住高要求的入境游需求。</strong></p>\n  <h2><strong>04. 写在尾声：国际旅游是不同文明的交往</strong></h2>\n  <p>中国旅游协会秘书长葛磊有一个精辟的论述：</p>\n  <p>“无论在哪个国家，旅游业应当鼓励人和人的相遇。国际旅游永远不是简单的旅游消费，它是不同的国家、不同的民族、不同的文明之间的相互交往。”</p>\n  <p>当下的世界充满不确定性，但中国的旅游业正变得更加积极和开放。</p>\n  <p>据全国移民管理机构统计，今年一季度，免签入境外国人达831.5万人次，占入境外国人总数的77.9%，同比增长29.3%。2026年作为“十五五”开局之年，“‌旅游强国建设”首次写入国家五年规划‌，‌“中国服务”‌亦首次与“中国制造”并列纳入国家战略框架。</p>\n  <p>而携程的“五年计划”，正将桂林这样拥有顶级旅游资源的城市，打造为世界级的旅居目的地——这也是对国家叙事的产业回应。</p>\n  <p>当龙脊梯田的自助售票机以全新姿态迎接来自世界各地的面孔，当酒店的非遗手作从静态展示变为可带走的记忆，当一笔笔透明订单通过平台建立起的规则跨越时空界限，中国入境游的商业飞轮已经转了起来。</p>\n  <p>梁建章所描绘的那个“入境游世界第一”的愿景，或许会比人们预想中的更早到来。</p>\n  <p><strong>*免责声明：</strong></p>\n  <p><strong>本文内容仅代表作者看法。</strong></p>\n  <p><strong>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</strong></p>", "category": "tech", "published_at": "2026-06-05T08:25:49+00:00", "fetched_at": "2026-06-06T02:45:12.548693+00:00", "fingerprint": "2ac0561e081cdb4e"}, {"source": "36氪 - 最新文章", "title": "Token大战中，华为云选择了第三条路｜最前线", "url": "https://36kr.com/p/3840016255126016?f=rss", "summary": "<p>作者 | 邓咏仪</p>\n  <p>编辑 | 张雨忻</p>\n  <p>“在国产化算力供应受限的情况下，华为云现在不太在乎Token总量是多少，也不太在乎收入的总量是多少，在乎的是国产化的算力系统所生产出来的Tokens的健康度，并且要代表着生产力提升，而不仅仅是情绪价值。”</p>\n  <p>6月5日，2026华为云 INSPIRE 创想者大会在上海开幕，华为云CEO周跃峰表示。</p>\n  <p>他举了个例子：一个人闲来无事在手机上问 AI 一个问题，也会产生 Token，但这种 Token 的价值有多大很难说明。在他看来，衡量一朵云做得好不好，不该强调它跑出了多少万亿 Token，而该看这些 Token 替企业提了多少效率。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260605/v2_30bec1e3982a4d37b1494a36457e4993@2057308263_oswg1491382oswg1100oswg734_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">华为云CEO周跃峰</p>\n  <p>过去两年，中国云厂商围绕 Token 打了一场旷日持久的价格战：2024年5月，在DeepSeek V2打响降价的第一枪后，火山引擎豆包以0.0008元/千 Token 的定价点燃战火，而后阿里，百度、腾讯、讯飞相继入场，自此开始了模型厂商的第一场战事。</p>\n  <p>这套打法的内核，是用低价模型引流、带动背后的公有云销售，代价则是推理算力的毛利率一度被压到为负。一直到DeepSeek R1打开推理时代范式之后，Coding和视频模型再度激起了真正的Token大战。</p>\n  <p>而在这次发布会上，华为云这次并没有出降价牌，而是提出一个名为“Agentic Infra”的新范式，瞄准国产算力。所有人都比谁的Token更便宜、谁的调用量更大时，华为云在 Token 经济中选的第三条路——不拼单价和调用量，赌的是国产算力的自主可控，以及是否能够帮助企业提升真实的生产力。</p>\n  <h3>不打价格战，把 Token 工厂建在国产硬件上</h3>\n  <p>要达到 Agentic Infra的建设目标，华为云端出了一整套底层设施。</p>\n  <p>而要具体拆解华为云所定义的Agentic Infra，则包括四个方面：高效的Token 工厂、可持续学习、通智一体化调度、安全自治，华为云也对应发布了四款新品。</p>\n  <p>最核心的是 AICS 灵衢智算集群。它基于灵衢网络，支持10万卡级集群规模，总算力200EFLOPS，把 Token 生成时延压到10毫秒以内，千卡每秒吞吐达到500万 Token，在线服务可用性99.95%——华为云称之为“Token 工厂”。</p>\n  <p>而配套的 CCE Volcano Next 调度引擎，则通过“训推共池+碎片整合”的形式，把通用算力和智能算力混合调度，使得资源利用率能提升30%以上；AMS 记忆存储方案用 NPU 直通硬件做出 PB 级记忆空间，AgentSphere 则提供100毫秒级启动的智能体安全运行环境。</p>\n  <p>而在模型层面，华为云同步发布了新一代训推平台 ModelArts Next。其中，MaaS 模型路由能够按请求特征，自动调度最合适的模型，目前接入15余款 SOTA 模型，官方称调度精准率超过95%、调用成本平均降低20%。</p>\n  <p>华为云也在在自己优势的企业场景，推出了一系列客户刚需的功能。比如，ModelArts Next还将强化学习封装成企业级 RLaaS 服务，并提供机密推理能力，让金融、编码等高敏感场景的数据“只进不出”。</p>\n  <p>之所以能够通过这套基础设施走出第三条路，前提在昇腾生态。今年初 DeepSeek 爆火时，华为云与硅基流动曾在昇腾 CloudMatrix 384超节点上部署 DeepSeek-R1/V3，当时的推理效率可追平英伟达 H800。这意味着，国产算力已经能在主流大模型的推理上拿出可用的性能。</p>\n  <h3>从算力底座到行业落地，押注“最开放的云”</h3>\n  <p>如果说，底座解决的是“算力从哪来”这个问题，华为云这次更想讲的是 Token 往哪去——落到具体行业的生产力上。</p>\n  <p>往上一层，华为云公测了智果 AgentArts 企业级智能体平台，同时上线开源版 openJiuwen，内核与企业版同源度超过90%。</p>\n  <p>对华为云在AI时代的差异点，周跃峰反复强调，华为云有着昇腾、鲲鹏算力开放，欧拉操作系统、ModelArts 工具链开源等生态，是“智能体时代最开放的云”。</p>\n  <p>而这种开放也延伸到模型生态——大会上，华为云联合智谱、DeepSeek、Kimi、阶跃星辰、百度等20余家模型厂商，共同发布了“百模千态”合作计划。</p>\n  <p>真正被周跃峰视为“生产力落点”的，则是行业场景。</p>\n  <p>当前，华为云已经在不少行业和场景中，帮助企业把AI用起来。比如，华为云针对具身智能行业上线的 CloudRobo 开发平台，就能够让中小企业能低成本接入、共享数据和模型。</p>\n  <p>“中国有300多家具身智能创业公司，规模都不大，让它们各自自建算力和数据链压力太大。”周跃峰解释道。</p>\n  <p>医疗则是华为云投入的重点行业之一。此前，华为已在2025年3月组建医疗卫生军团，把 AI 辅助诊断列为军团级的战略方向。</p>\n  <p>在大模型时代到来后，华为云如今也有了一个典型案例：当前，全国能看病理切片的医生只有约2万名，缺口巨大，偏远医院的病理误诊率偏高。</p>\n  <p>针对这个问题，华为云与瑞金医院联合开发的病理大模型已经上线——这一模型已经能让县域、地市级医院通过云端就能调用三甲水平的诊断能力，患者不必长途奔波。</p>\n  <p>此外，考虑到政府、金融、央国企对数据安全和本地化的顾虑，华为云这次还同步发布了面向智能体的混合云白皮书和机密计算方案，走公有云与私有云“两条腿”。</p>\n  <p><strong>“华为云要做硅基黑土地。”</strong>周跃峰反复提到，华为云要打造“第二个算力平面”。这意味着，不拿国产算力的规模去和英伟达这类“万国牌”算力比大小，而是给全球开发者多提供一条技术路线和一套生态选择。</p>", "category": "tech", "published_at": "2026-06-05T08:28:25+00:00", "fetched_at": "2026-06-06T02:45:12.548687+00:00", "fingerprint": "7982de11c491ca96"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜日本或通过抛售美债，为创纪录规模的日元汇市干预筹资；俞浩内部发文：未来将继续心无旁骛做实业", "url": "https://36kr.com/p/3840267945969929?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>首关15亿元，英诺科创三期基金持续聚焦早期科技投资</strong></p>\n  <p>36氪获悉，6月5日，英诺基金宣布旗下英诺科创三期基金完成首轮关账，规模15亿元。该基金聚焦早期科技投资，重点布局前沿科技及人工智能领域。</p>\n  <p><strong>比特币“金库”公司市值蒸发620亿美元</strong></p>\n  <p>比特币本周下跌约14%，至四个月低点附近。随着加密货6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。（界面）币整体滑坡，数字资产“金库型”公司的股票也持续下挫，其中许多的跌幅远远超过它们所持有的加密货币本身。Artemis的数据显示，这些比特币金库公司的完全稀释股票总市值，已从去年10月初的近期顶点近1340亿美元，降至约720亿美元，也就是减少了620亿美元。Tokenize Capital管理合伙人Tokenize Capital表示：“随着价格回落，数字资产金库公司正面临一个严峻选择：是债务违约，还是出售资产。被迫抛售已经粉碎了对它们会持续扮演‘买入并持有’投资者角色的预期。”（财联社）</p>\n  <p><strong>俞浩内部发文：未来将继续心无旁骛做实业</strong></p>\n  <p>6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。（界面）</p>\n  <p><strong>高德地图在杭州成立新公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，杭州高行蓝隼智能科技有限公司成立，法定代表人为刘书鹏，注册资本800万人民币，经营范围包括软件开发、软件销售、人工智能基础软件开发、汽车销售等。股东信息显示，该公司由高德软件有限公司旗下北京利通出行科技有限公司全资持股。</p>\n  <h2>投融资：</h2>\n  <p><strong>上海机电灵巧智能成立灵机壹动公司# 注册资本1亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，灵机壹动（上海）科技有限公司成立，法定代表人为周骏麟，注册资本1亿人民币，经营范围包括电子元器件与机电组件设备制造、人工智能硬件销售、人工智能应用软件开发、软件开发等。股东信息显示，该公司由上海机电、浙江灵巧智能科技有限公司共同持股。</p>\n  <h2>新产品：</h2>\n  <p><strong>腾讯云发布WorkBuddy企业版</strong></p>\n  <p>36氪获悉，6月5日，腾讯云在京召开AI产业应用大会，腾讯正式发布WorkBuddy企业版（WorkBuddy Enterprise）及办公智能体套件Agent Suite。WorkBuddy企业版及办公智能体套件，是行业内首套“AI原生组织进化解决方案”。作为企业AI智能工作台，WorkBuddy企业版提供7×24专家数字员工、支持人与AI协作的“团队”模式、企业级管理后台三大核心能力。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><br /><strong>日本或通过抛售美债，为创纪录规模的日元汇市干预筹资</strong></p>\n  <p>日本可能动用了其持有的外国证券，其中包括美国国债，为过去一个月创纪录的汇市干预提供资金，这一举动可能引起美国方面的关注。根据日本财务省周五公布的储备数据，截至5月底，日本持有的外国证券较4月减少756亿美元。这一下降规模与日本近期为支撑日元而入市干预的金额大致相当。日本财务省上周确认，截至5月28日，当月用于汇市干预的资金达到创纪录的11.73万亿日元（734亿美元）。（新浪财经）</p>", "category": "tech", "published_at": "2026-06-05T12:50:46+00:00", "fetched_at": "2026-06-06T02:45:12.548678+00:00", "fingerprint": "7971729b314c86be"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜豆包推出付费后月活减少610万；Anthropic呼吁全球放缓AI开发，警告AI“自我改进”风险；罗永浩卸任锤子软件公司执行董事", "url": "https://36kr.com/p/3840996342073604?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>SpaceX据悉将其IPO的日本融资目标提高至25亿美元</p>\n  <p>二手房挂牌量回落新房库存下降，楼市供需关系向好</p>\n  <p>B站宣布启动AI创造公开赛</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>数据显示，豆包推出付费后月活减少610万&nbsp;</strong></p>\n  <p>据全球人工智能市场追踪机构Aicpb.com周三发布的数据显示，在豆包推出订阅选项后，该应用5月份的月活跃用户（MAU）减少了610万，这是自2023年推出以来该应用罕见的下滑。Aicpb.com创始人李邦竹表示：“中国的免费人工智能服务时代还远未结束，所以豆包的商业化可能确实为时过早。”&nbsp;</p>\n  <p>有分析人士认为，字节跳动过早地将盈利模式商业化，可能会使其在中国竞争激烈的消费人工智能市场中失去领先地位。此前，其旗舰聊天机器人豆包在试水付费订阅模式后流失了数百万用户。（南华早报）</p>\n  <p><strong>Anthropic呼吁全球放缓AI开发，警告AI“自我改进”风险 &nbsp;</strong></p>\n  <p>据《华尔街日报》，AI创业公司Anthropic呼吁全球顶尖AI实验室考虑放缓研发步伐，理由是当前AI系统进步太快，可能很快就能在无需人类干预的情况下自我改进，从而带来重大的社会风险。</p>\n  <p>Anthropic周四在一篇博客文章中表示，如果能够放缓全球AI发展的速度，这“很可能是一件好事”。文章同时披露了Anthropic内部数据，展示其最先进AI模型能力提升的速度之快。（凤凰网科技）</p>\n  <p><strong>罗永浩卸任锤子软件公司执行董事，已累计偿还近10亿元债务</strong></p>\n  <p>国家企业信用信息公示系统显示，锤子科技创始人罗永浩工商职务发生变动，在锤子软件（北京）有限公司的职务由“执行董事”变更为“董事”，这是罗永浩近年来又一次退出锤子系企业核心管理岗位。 对此，锤子科技内部知情人士向媒体透露，此次职务调整为企业常规工商变更，属于公司既定人事安排，无特殊变动原因。</p>\n  <p>针对最新还债进度，上述知情人士向记者透露， 目前罗永浩已累计偿还近10亿元债务，剩余债务的清偿工作正在稳步推进中，其本人亦在全力投入工作以加快完成后续还款计划。（大河报）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>黄仁勋：SK海力士、三星、美光已通过认证，将量产最新AI内存</strong></p>\n  <p>英伟达CEO黄仁勋表示，三大内存芯片制造商已获准为英伟达AI加速器供应最先进的高带宽产品。这一决定意味着SK海力士、三星电子和美光科技可开始量产并供应HBM4，即用于英伟达AI加速器的最新一代芯片。这三家企业主导着全球计算用存储半导体市场，此前一直在激烈争夺该业务份额。黄仁勋在抵达首尔进行为期数日的访问时告诉记者：“三家供应商均已通过认证。”他补充道：“三家企业都已投产，都在竞相支持Vera Rubin。”Vera Rubin是英伟达最新AI芯片。（新浪财经）</p>\n  <p><strong>腾讯高管：今年腾讯大部分代码都由AI生成</strong></p>\n  <p>36氪获悉，在腾讯云AI产业应用大会上，腾讯高级执行副总裁汤道生在与腾讯首席AI科学家姚顺雨的对话中表示，今年腾讯大部分代码都是由AI生成，腾讯的工程师可能会花更多的时间去做架构设计等，他们把写代码的工作都交给AI了，定期指导、修正AI写的东西。</p>\n  <p><strong>腾讯云TokenHub：连续多月翻倍，日Token消耗量跃升至5万亿</strong></p>\n  <p>36氪获悉，在5日举行的腾讯云AI产业应用大会上，腾讯云总经理、TokenHub负责人高航透露，腾讯云大模型服务平台TokenHub上线3个月，保持每月翻倍的增长态势，目前日Token消耗量已突破5万亿。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>SpaceX据悉将其IPO的日本融资目标提高至25亿美元</strong></p>\n  <p>SpaceX已将其在日本发行股票的计划筹集金额增加了四分之一，这表明日本散户投资者的需求强劲。据监管文件披露，SpaceX目前正寻求从日本投资者那里筹集至多25亿美元的资金，高于上周披露的20亿美元。文件显示，日本投资者获配1480万至1850万股A类股，初步定价为每股135美元。日本部分的认购登记将于本周五开始，持续至下周晚些时候。（新浪财经）</p>\n  <p><strong>国办：对私募证券基金加大监测力度，强化交易行为监管</strong></p>\n  <p>36氪获悉，国务院办公厅发布《关于加强监管防范风险促进私募投资基金高质量发展的指导意见》，其中提出，细化私募基金风险评价标准，提升监管强度与风险水平适配性，按照评价结果对不同私募基金管理人实施差异化监管。对重点私募基金管理人依法加大现场检查力度，加强央地和跨辖区联合检查。对异地经营的私募基金管理人加大监管力度，引导注册地与经营地相统一。对存在违规代持、通道化等情形的私募基金管理人加大规范引导力度，推动主动整改。对私募证券基金加大监测力度，强化交易行为监管。</p>\n  <p><strong>二手房挂牌量回落，新房库存下降，楼市供需关系向好</strong></p>\n  <p>在住房需求集中释放的背景下，房地产市场持续企稳，市场成交保持高活跃度。受此影响，市场供给端出现积极信号，供需关系向好发展。在二手房市场，中指研究院数据显示，5月份重点25城二手房新增挂牌房源达12万套，同比下降约41%。（证券日报）</p>\n  <p><strong>现货黄金回吐年内涨幅&nbsp;</strong></p>\n  <p>现货黄金回吐今年以来的全部涨幅，此前美国公布的就业数据强化了市场对美联储加息的预期。(金十数据APP)</p>\n  <p><strong>湘雅二医院逾8亿元工程招标收到投诉：首次公示前六家单位落选，第八名“逆袭”中标 &nbsp;</strong></p>\n  <p>2026年3月17日，中南大学湘雅二医院国家紧急医学救援基地建设施工总承包进行了合同公示，对于招投标的结果，多家投标单位向记者反映称，项目（总投资估算8.27亿元）的招标结果存在重大异常。合同公示显示，最终中标单位为首次候选人公示中排名第八的湖南省第四工程有限公司联合体。</p>\n  <p>记者了解到，在2025年12月11日的二次公示中，2025年10月30日第一次公示的6家中标候选人被全部更换。“第八名逆袭”让众多参与投标企业表示不解。</p>\n  <p>2026年1月14日，招标方发布公告称，“因本项目收到相关投诉，暂停本项目的招投标活动”，并表示投标有限期相应延长90天。然而，两个月后，项目招标进行的最终合同公示中，中标方仍为二次公示的中标者湖南省第四工程有限公司联合体。</p>\n  <p>近日，记者分别向湘雅附二院和长沙市招投标中心、长沙市住建局、招标代理机构中技建设咨询有限公司等发去采访要求，均未得到明确回复。（澎湃新闻）</p>\n  <p><strong>美股收盘：纳指跌超4% 半导体股多数下跌&nbsp;</strong></p>\n  <p>美股周五收盘，道指初步收跌1.35%，标普500指数跌2.65%，纳指跌4.18%，其中，标普500指数创下自2025年10月以来最大单日跌幅；纳指创下自2025年4月以来最大单日跌幅。半导体板块多数下跌，费城半导体指数尾盘跌幅扩大至10%，创2025年4月以来最大单日跌幅。英伟达(NVDA.O)跌超6%，台积电(TSM.N)跌6.68%，博通(AVGO.O)跌近8%，英特尔(INTC.O)跌超11%。纳斯达克中国金龙指数收跌3.56%，小马智行(PONY.O)跌9.83%，百度(BIDU.O)跌9.75%，金山云(KC.O)跌6.70%。(金十数据APP)</p>\n  <p><strong>追觅产业基金人士：目前基金运营一切正常</strong></p>\n  <p>据蓝鲸新闻，有地方对辖区内企业与追觅的合作情况开展摸排的消息，再次引发关注。摸排内容涵盖合作项目、总体规模、资金投入、财政及国资参与情况、当前经营状况等。对此，追觅一位负责产业基金运作的人士向记者表示：“或是相关事宜有人员行事过于高调，但现阶段基金运营一切正常。”(财联社)</p>\n  <p><strong>俞浩内部发文：未来将继续心无旁骛做实业</strong></p>\n  <p>6月5日下午，追觅科技创始人俞浩在公司内部大群发文，表示未来将继续心无旁骛做实业，坚持技术创新，去啃全球最难的市场。(界面新闻)</p>\n  <p><strong>国办：严控新设政府投资基金，县区原则上不得新设</strong></p>\n  <p>36氪获悉，国务院办公厅发布《关于加强监管防范风险促进私募投资基金高质量发展的指导意见》，其中提出，优化私募基金登记备案规则，坚决防止不符合私募基金特征和运作规律的机构和产品作为私募基金登记备案。严控新设政府投资基金，县区原则上不得新设，确有必要新设的应当报上级人民政府批准。加强综合研判会商、经营主体登记、私募基金登记备案等的信息共享和工作衔接。</p>\n  <p><strong>乌拉圭宣布对中国公民免签</strong></p>\n  <p>乌拉圭外交部长卢贝特金宣布，这一南美国家将对中国公民免签。（新华社）</p>\n  <p><strong>丰田叫停雷克萨斯LF-ZC量产，回应：不是放弃纯电车</strong></p>\n  <p>近日，有消息称，丰田叫停了雷克萨斯纯电动轿车LF-ZC量产车型的开发。该车型流线型、车高较低的“轿跑（Coupe）”款，原计划以铝铸造实现零部件一体成型的“一体化压铸”。按照原计划，LF-ZC量产车型将于2026年底在丰田日本国内的田原工厂投产，之后这一计划被推迟至2027年中期，直至如今被叫停。</p>\n  <p>“本次车型开发中止，主要是考虑到了市场需求的变化，这也是公司对整体车辆开发项目进行调整的一部分，但并不代表公司放弃了BEV（纯电动汽车）。”针对上述车型研发暂停的原因，丰田中国相关工作人员回应称。（每经网）</p>\n  <p><strong>全国首张“无目的地海上游”出入境通行证在上海签发</strong></p>\n  <p>4日，全国首张“无目的地海上游”出入境通行证在上海签发。该证件落地后，游客可依托相关政策实现免办签证、短途出海度假，进一步丰富国内邮轮出游选择。（央视新闻）</p>\n  <p><strong>韩国股市因科技股抛售大幅下挫，创下3月以来最差单周表现</strong></p>\n  <p>韩国股市周五大幅下挫，创下自3月底以来最大单周跌幅，因全球科技股回调及美伊和谈陷入僵局，严重打击了投资者的风险偏好。韩元兑美元汇率跌至2009年以来最低水平，同时债券收益率飙升，促使包括财政部长具允哲在内的政府官员发出口头警告，反对投机性的单边押注。（新浪财经）</p>\n  <p><strong>苹果：全球App Store生态系统规模达1.4万亿美元</strong></p>\n  <p>苹果公司宣布，根据分析集团（Analysis Group）经济学家的一项最新研究，2025年全球App Store生态系统促成的开发者计费与销售额超过1.4万亿美元，创下历史新高。（界面新闻）</p>\n  <p><strong>证监会：下一步将制定落实《指导意见》的三年行动方案</strong></p>\n  <p>36氪获悉，中国证监会新闻发言人就《国务院办公厅关于加强监管防范风险促进私募投资基金高质量发展的指导意见》答记者问。《指导意见》是私募基金领域“1+N+X”制度体系中的方向性、基础性文件。下一步，中国证监会将坚决贯彻党:中央、国务院决策部署，制定落实《指导意见》的三年行动方案，并积极会同宏观政策部门、国:资及行业主管部门、金融管理部门、公安机关、地方政府等，进一步增强责任意识，密切协作形成合力，推动各项任务、工作落地见效。</p>\n  <p><strong>谷歌将在美国得州新建数据中心和能源设施</strong></p>\n  <p>谷歌和Intersect宣布将在美国得州建设Meitner能源中心，该中心将包括一座新的数据中心以及配套的能源发电设施。（界面新闻）</p>\n  <p><strong>中信证券：建议以“AI+能化”的新杠铃结构作为兼顾降波与收益的战略解</strong></p>\n  <p>36氪获悉，中信证券研报表示，当前A股资金缩圈与虹吸、个股收益率分化均已触及历史极值，头部资产与长尾资产的收益率相关系数正逼近0.5的背离临界点。复盘历史，极致缩圈见顶并不决定大盘方向，但相关性背离往往预示着前期抱团的主线步入休整，资金行为与市场情绪面临结构性切换。展望后市，市场能否从极致分化走向系统性收敛，取决于宏观基本面增长与全球流动性能否实现顺畅接力。在宏观外部靴子落地前的模糊期，单纯依赖产业微观叙事已很难打破“缩圈”僵局，建议以“AI+能化”的新杠铃结构作为兼顾降波与收益的战略解。</p>\n  <p><strong>小鹏机器人核心产品一号位施晓鑫6月初主动离职</strong></p>\n  <p>36氪独家获悉，小鹏机器人产品规划高级总监施晓鑫已于6月初正式离职。关于施晓鑫的下一步去向，目前尚不明确。多位信源透露，施晓鑫现阶段无求职意向。知情人士称，施晓鑫已婉拒多家头部机器人企业和造车新势力的邀约，短期暂停职场择业，优先休整。</p>\n  <p><strong>B站宣布启动AI创造公开赛</strong></p>\n  <p>36氪获悉，哔哩哔哩（以下简称\"B站\"）正式启动“build in bilibili · AI创造公开赛”（以下简称B站AI创造公开赛），并公布参赛规则。比赛不设年龄、学历、职业与经验等参赛门槛，并首次将评选权交给用户——所有B站用户均可通过投币、弹幕等方式参与创作并选出认可的产品。</p>\n  <p><strong>英特尔与日立公司合作，推动芯片等制造设施的自动化</strong></p>\n  <p>英特尔将与日本日立公司合作，提高制造设施的机器人良率和能源效率，其中包括这家美国芯片制造商自身的工厂。两家公司周五在声明中表示，英特尔的晶圆厂将使用日立的人工智能服务HMAX Energy。（新浪财经）</p>\n  <p><strong>夸克升级高考志愿填报产品</strong></p>\n  <p>36氪获悉，夸克推出全新升级的高考频道，为千万考生免费提供“高考搜索”“智能选志愿”“志愿表”“志愿报告”等功能。夸克高考志愿工具也将接入千问App。</p>\n  <p><strong>爱彼迎CEO计划创办一家新的人工智能公司</strong></p>\n  <p>据多位知情人士称，爱彼迎首席执行官Brian Chesky正在筹建一家新的人工智能（AI）实验室，这标志着他首次涉足全球AI竞赛。Chesky计划创办一家AI公司以开发人工智能模型，并正在考虑将重点放在用户交互和设计上。（财联社）</p>\n  <p><strong>谷歌计划投放3200万只蚊子，通过不育雄蚊减少繁殖周期内的蚊子总数量&nbsp;</strong></p>\n  <p>近日，谷歌正通过其母公司Alphabet旗下的生物技术公司Verily，寻求美国监管部门的批准，计划在未来两年内在加利福尼亚州和佛罗里达州投放多达3200万只蚊子。</p>\n  <p>这项计划是谷歌长期开展的“调试项目”（Debug Project）的一部分，旨在减少蚊子数量，限制蚊媒疾病的传播。 该项目依赖于释放经过特殊培育、无法产生可育后代的雄蚊。</p>\n  <p>当这些雄蚊与野生雌蚊交配时，蚊卵无法孵化，从而在多个繁殖周期内逐渐减少蚊子的总数量。研究人员希望减少蚊子的数量，从而能够降低蚊子传播疾病的风险。该项目的技术基本原理被称为不育昆虫技术，可以追溯到20世纪50年代，并已成功用于防治果蝇、螺旋蝇和苹果蠹蛾等农业害虫。（现代快报）</p>\n  <p><strong>Anthropic联合创始人称高昂的AI模型开发成本推动公司寻求上市</strong></p>\n  <p>Anthropic PBC联合创始人兼总裁Daniela Amodei表示，开发人工智能模型的高昂成本正迫使像Anthropic这样的公司寻求上市融资。几天前，这家人工智能工具Claude的制造商保密提交了IPO注册文件草案。“训练人工智能模型是一项高度资本密集型的业务，”Amodei周四在彭博科技大会上被问及像Anthropic这样的公司上市的利弊时说道。她补充说，公开市场“非常适合这种情况”。（新浪财经）</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>鸿海5月营收8594亿新台币，为历年同期最高</strong></p>\n  <p>6月5日，鸿海公布，2026年5月营收为新台币8594亿，月增3.28%，年增39.57%，为历年同期最高。2026年累计前5月营收为3.8211万亿，年增31.79%，为历年同期最高。（界面新闻）</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>Quobly完成1.15亿欧元A轮融资</strong></p>\n  <p>法国量子计算公司Quobly宣布完成1.15亿欧元A轮融资，旨在加速其硅基量子计算机的产业化进程，并计划于2026年底前将首款商用产品推向市场。本轮融资由Bpifrance、SEALSQ和意法半导体领投，欧洲创新理事会、Blast、ALIAD以及现有投资者Innovacom参与投资。（界面新闻）</p>\n  <p><strong>开源后端平台Supabase融资5亿美元，投后估值105亿美元</strong></p>\n  <p>开源后端平台（BaaS）Supabase宣布完成5亿美元F轮融资，投后估值达105亿美元。本轮融资由GIC领投，其他投资者包括Accel、Y Combinator、Craft、Felicis、Coatue和金融科技创企Stripe。（新浪财经）</p>\n  <p><strong>“毫秒智控”完成数千万元天使+轮融资</strong></p>\n  <p>36氪获悉，线控底盘核心零部件供应商“毫秒智控”已于近期完成数千万元天使+轮融资，本轮投资方为松禾资本和苏高新融晟。这也是公司成立仅一年以来，继获得厚雪资本天使轮独家投资后，接连完成的第二轮融资。</p>\n  <p><strong>“原力灵机”完成新一轮融资</strong></p>\n  <p>36氪获悉，具身智能企业“原力灵机”近期完成新一轮融资，资方主要为数家大模型公司，包括智谱、阶跃星辰、商汤科技、阿里。此外，华勤、上汽恒旭等产业投资方持续加注。</p>\n  <p><strong>“智美科技”完成近2亿元战略轮融资</strong></p>\n  <p>36氪获悉，“智美科技”宣布完成近2亿元战略轮融资，本轮融资由麦澜德、国石智达资本、老股东共同投资。本轮资金将主要用于深化“皮肤全球大模型”的研发及3D皮肤智能设备的迭代升级，加速与全球产业链伙伴的商业化落地合作，构建皮肤AI智能设备生态体系。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>小米机器人团队在CVPR与ICRA两大国际顶会赛事获双料冠军</strong></p>\n  <p>36氪获悉，6月5日，小米技术宣布，小米机器人团队在CVPR 2026 Workshops和ICRA 2026 WBC斩获双料冠军。据介绍，在CVPR 2026 Workshops中，小米匿名参赛模型“my16”以40.89%的成功率位居榜首，是该赛道中唯一突破40%门槛的模型；在ICRA 2026 WBC中，小米机器人在超市场景下完成16类饮料的货架抓取与购物车放置任务，综合得分99.2分，整体成功率94%，是榜单中唯一超过90%的方案，较第二名高出10个百分点。</p>\n  <p><strong>纳米递送载体将肺癌药利用度提高30倍</strong></p>\n  <p>澳大利亚阿德莱德大学科学家研制出一种新型纳米颗粒递送载体，能将肺癌药物精准靶向肺部，让药物的生物利用度（即所服用药物的剂量能到达体循环的比例）提高30倍，同时大幅减少对健康器官的干扰与损伤。这项突破有望重塑肺癌乃至多种癌症的治疗面貌。（科技日报）</p>\n  <p><strong>曝iPhone 18 Pro首发第二代灵动岛，整体宽度直接缩减了35%&nbsp;</strong></p>\n  <p>据博主爆料，今年下半年登场的iPhone 18 Pro系列将首发苹果第二代灵动岛，正面挖孔的宽度由上代的20.76mm调整到13.49mm，整体宽度直接缩减了35%，这也让iPhone 18 Pro成为苹果有史以来屏占比最高的智能手机。</p>\n  <p>这次能把开孔做小，核心原因是苹果把部分Face ID的核心组件直接隐藏到了屏幕下方，最终成功压缩了正面的开孔面积。这样的改动不仅显著提升了整机的屏占比，也让手机正面的整体视觉感官变得更加精致完整。（快科技）</p>\n  <p><strong>整理</strong>｜开心&nbsp;</p>", "category": "tech", "published_at": "2026-06-06T01:07:19+00:00", "fetched_at": "2026-06-06T02:45:12.548662+00:00", "fingerprint": "6b0f289bb9840648"}, {"source": "少数派", "title": "WWDC26 开幕在即，今年有哪些看点值得关注？", "url": "https://sspai.com/post/110669", "summary": "今年WWDC全球开发者大会即将在北京时间6月9日凌晨拉开帷幕，对Apple来说今年这一次活动是一个非常关键的节点：首先，2024年WWDC上画的饼至今没有兑现，而AI竞赛在2026年已经进入了白热化， ...<a href=\"https://sspai.com/post/110669\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-05T03:45:01+00:00", "fetched_at": "2026-06-06T02:45:10.703868+00:00", "fingerprint": "28d4cb0503dacc88"}, {"source": "少数派", "title": "再谈响度战争：为什么你看的视频越来越「吵」了？", "url": "https://sspai.com/post/109483", "summary": "「看视频」这件事，本不应该是一场「战争」。<a href=\"https://sspai.com/post/109483\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-05T07:21:14+00:00", "fetched_at": "2026-06-06T02:45:10.703862+00:00", "fingerprint": "9d5981840f2b1dbf"}, {"source": "少数派", "title": "31 位普通人，给一只背包开出了成绩单", "url": "https://sspai.com/post/110666", "summary": "写在前面一只背包，能不能让你体面地背去客户的会议室，也能陪你参加朋友聚会？装下两三天的差旅行李之后，它还能让你背得轻松吗？当包里同时塞着笔记本、平板和各种重设备，容量、舒适与防护，究竟能不能兼得？带着 ...<a href=\"https://sspai.com/post/110666\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-05T08:55:39+00:00", "fetched_at": "2026-06-06T02:45:10.703855+00:00", "fingerprint": "4c4dcfb741e7bb14"}, {"source": "少数派", "title": "macOS 存储管理漫谈：去重是节约空间的最好方法", "url": "https://sspai.com/prime/story/macos-storage-management-deduplication", "summary": "虽然最近各种用LLM帮忙整理电脑里的文件、删除垃圾数据的帖子很火，但我天然对这种LLM用法抱有一丝警惕，我始终相信电脑里存在的文件都有自己的意义。所以我就想在这篇文章里和大家聊聊macOS里的存储管理 ...<a href=\"https://sspai.com/prime/story/macos-storage-management-deduplication\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target <script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
