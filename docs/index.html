, "url": "https://esengine.github.io/DeepSeek-Reasonix/", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-05-25T02:59:05.881252+00:00", "fingerprint": "24f32fffefc36930"}, {"source": "Hacker News Front Page", "title": "Show HN: Audiomass – a free, open-source multitrack audio editor for the web", "url": "https://audiomass.co/?multitrack=1", "summary": "", "category": "tech", "published_at": null, "fetched_at": "2026-05-25T02:59:05.881114+00:00", "fingerprint": "0a7eec4207495ded"}, {"source": "The Verge", "title": "Hackers are learning to exploit chatbot &#8216;personalities&#8217;", "url": "https://www.theverge.com/column/935545/hackers-ai-chatbots", "summary": "This is The Stepback, a weekly newsletter breaking down one essential story from the tech world. For more on AI mischief, follow Robert Hart. The Stepback arrives in our subscribers' inboxes at 8AM ET. Opt in for The Stepback here. How it started Hacking the first generation of AI chatbots was a laughably simple affair. [&#8230;]", "category": "tech", "published_at": "2026-05-24T12:00:00+00:00", "fetched_at": "2026-05-25T02:59:05.532108+00:00", "fingerprint": "b72ccf8d142c818e"}, {"source": "The Verge", "title": "Apple’s latest MacBook Air is $200 off in both sizes for Memorial Day", "url": "https://www.theverge.com/gadgets/936610/apple-macbook-air-m5-memorial-day-2026-deal-sale", "summary": "If you’re looking for a laptop that’ll still perform well several years from now, Apple’s latest MacBook Air is hard to beat. Now, in particular, is a good time to pick one up, as you can currently buy the 13-inch MacBook Air at Amazon in the run-up to Memorial Day with an M5 chip, 16GB [&#8230;]", "category": "tech", "published_at": "2026-05-24T15:00:00+00:00", "fetched_at": "2026-05-25T02:59:05.532103+00:00", "fingerprint": "372a4ba28a826429"}, {"source": "The Verge", "title": "On Trails is a wandering tale that blends hiking, science, and history", "url": "https://www.theverge.com/entertainment/936860/robert-moor-on-trails-book-review", "summary": "Hiking is one of life's great joys. Turning off the screens and stepping out into nature for an extended period of time, perhaps even several days, is rejuvenating. Unfortunately, as someone with two young kids and a bad back, I'm not really able to go backpacking anymore. So I often find myself trying to live [&#8230;]", "category": "tech", "published_at": "2026-05-24T15:15:00+00:00", "fetched_at": "2026-05-25T02:59:05.532096+00:00", "fingerprint": "cfe0966425b25c44"}, {"source": "The Verge", "title": "The best Memorial Day sales you can shop this weekend", "url": "https://www.theverge.com/gadgets/936196/best-memorial-day-sales-tech-deals-2026", "summary": "Memorial Day is nearly here, meaning the seasonal sales are in full swing. If your weekend plans involve pool parties or barbecues, now is a great time to pick up a portable speaker or set of solar lights, as many of our favorite models are currently on sale. You can also find deals on everything [&#8230;]", "category": "tech", "published_at": "2026-05-24T15:28:08+00:00", "fetched_at": "2026-05-25T02:59:05.532085+00:00", "fingerprint": "039a8670c7a705a8"}, {"source": "36氪 - 最新文章", "title": "从服务沉默玩家，到技术外溢至千行百业：游戏+AI的下一站是什么？", "url": "https://36kr.com/p/3822747968196993?f=rss", "summary": "<p>文丨小葵</p>\n  <p>编辑丨果脯、刘士武</p>\n  <p>2026年GDC大会上，《和平精英》策划副总监薛冰披露了一组数据。</p>\n  <p>AI队友周末活跃玩家突破1770万，累计1.1亿人体验过AI功能，单局消息互动70条，麦克风开启率高达75%，超过了真人双排的历史峰值。</p>\n  <p>这意味着，大量玩家不仅选择了AI队友，还愿意对着屏幕那头的“数字人”开口说话。它像是一个切口，让我们得以窥见某种长期被行业忽视的集体情绪。从业者们不再追问“AI能否融入游戏”，一个更尖锐的问题浮出水面：当技术已经赢得了漂亮的胜利，接下来它该往哪里走？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_75d8204a35b540288b4ee4e36c667ab8@6371858_oswg118042oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《和平精英》AI战犬</p>\n  <h2>01</h2>\n  <p>“交流”往往是多人游戏中最基础也最脆弱的一环。</p>\n  <p>大多场景中，玩家可能会将其粗暴地理解成“对话”，不管是打字还是语音，只需要和网线另一头的真人队友能达成有效沟通就算成功。但实际站在开发者的角度，游戏内嵌交流模块一直算不上什么难事，真正的难点往往在于如何处理不同实际交流场景下的应用困境。</p>\n  <p>毕竟，让不同的玩家都尽量能获得相对一致的游戏体验，是多人游戏开发者始终需要坚守的“公平”。</p>\n  <p>比如在早期FPS里，队友不开麦报点，往往就跟队里少个人没太大区别，那些不愿开麦或者没能力开麦的玩家，在竞技体验上天然就处于劣势位。</p>\n  <p>为此，如今大多FPS都会直接内置战术标记功能。它的意义不在于替代语音，而是适配那些语音覆盖不了的场景，如玩家没法开麦或不想开麦，打字又可能影响操作节奏；想分享某个物资却难以快速描述位置等等。在这些情况下，标记系统都可以瞬间完成信息传递。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_0b109048b3394bb8a1ba08098a895137@6371858_oswg94662oswg1080oswg497_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《和平精英》游戏截图</p>\n  <p>“合作体验”也同理。</p>\n  <p>每个玩家的性格、状态、游戏理解乃至技术水平都不尽相同。很多时候，同为“被服务者”的玩家在合作共赢的过程中，往往都会面临着或多或少的让步，以少部分的牺牲为代价换取更好的游戏体验。</p>\n  <p><strong>但终究有人的地方就有江湖，这份让步，以及让步后的游戏体验未必符合所有玩家的目标。</strong>这也很容易导致，玩家如果没有稳定的固排，很难能保证每一把都有相对优质的游戏体验，甚至偶尔可能还会引发矛盾冲突，直到对游戏的热情被消磨殆尽。</p>\n  <p>AI队友，正是在这个裂缝中生长出来的功能。它能以一个绝对的“服务者”身份，为不同玩家提供最符合他们需求的游戏体验。</p>\n  <p>AI队友实际能做的事情，也远比外界想象的更具体。</p>\n  <p>以《和平精英》为例，在对局中，它能够理解并执行“封烟”“架枪”“拉人”等一系列战术指令，执行速度不输大多数路人玩家；在资源分配上，它不抢装备、不抢人头，玩家标记的物资它会主动放弃；在战术配合上，它能根据战局实时判断该支援还是掩护，该推进还是撤退；当玩家被击倒时，它会优先封烟再救人，随时把真人玩家放在最优先级。</p>\n  <p>更深一层的是它提供的情绪陪伴和正向反馈。AI队友不会中途挂机，不会一言不合就单飞，不会在你最需要支援的时候人间蒸发，不会因为你一把没发挥好就开麦嘲讽。这种确定性和零社交压力，本身就是一种极强的体验保障。</p>\n  <p>当然，AI队友也会有自己的弊端，比如它的实力可能相对固定，未必能发挥出真人的战斗水平，而面临着多变的战斗场景，玩家也需要频繁地给它下达不同的指令，缺乏真人的灵活应变。</p>\n  <p>说白了，AI队友更像是给玩家们提供了一个额外的选择，和标记系统一样用于优化玩家在不同场景下的游戏体验。选择AI队友还是真人，都完全取决于玩家当下的状态和需求。</p>\n  <h2>02</h2>\n  <p>时至今日，AI队友已经基于技术突破，经历过三次较大的功能迭代。</p>\n  <p>最初，AI在游戏里的角色不过是工具。它能执行指令，也能按套路行动，但很难迅速理解玩家的话。</p>\n  <p>2025年2月，《和平精英》接入DeepSeek大模型，为AI队友搭建了一整套契合游戏整体内容的知识库，将玩家的一些“黑话”、游戏内的武器、地图、战术用语都注入其中。在此之后，AI队友才成为了一个真正有互动性的“队友”。</p>\n  <p>它完全理解规则，也能实时感知玩家的状态。当你血量低了，它会主动提醒。当玩家问战术、求支援、让AI进攻，它都能响应。并且，每个AI都有自己的性格和背景故事，语音风格各不相同，综合表现跟真人队友几乎没有区别。</p>\n  <p>下一阶段的变化，则是AI队友开始拥有记忆与情感，变成更加“真实”的存在。</p>\n  <p>一方面，当AI队友能够构建记忆网络和用户画像，那么它就已经不再是每局都会重置的脚本，也与所谓的“人机”有了根本区别。</p>\n  <p>有了长期记忆的AI，能记住近期对局的玩家行为和开黑经历，偶尔来上一句“上次我们在这赢得真漂亮”，或者“你昨天的那个操作太秀了”。玩家与它交流越多，针对该玩家的长期记忆构成就越丰富，AI队友也像是一个与玩家越来越熟悉的朋友。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_46fd3d61773b4d92854c918c77344c5a@6371858_oswg69979oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数字好友提醒</p>\n  <p>另一方面，更有活人感的AI队友。如果能套上合适的包装，对开发者和玩家都能带来更多惊喜。比如《和平精英》曾推出“明星同款AI队友”。他们联合市场、美术、品控团队，还原了明星的声音、打法和故事背景。</p>\n  <p>在此情况下，玩家可以把所谓的AI队友当成明星的一个分身，与它互加好友、一起游戏，甚至是在公屏聊天，表达自己对明星的喜爱。这种绝对服务单一玩家的“开黑”体验，在真人社交中几乎不可实现。</p>\n  <p>而后续再更进一步的变化，是动态特质系统和亲密度体系上线。</p>\n  <p>虽然每个AI的性格底色固定，但和玩家一起玩得久了，它会慢慢养成专属的喜好，亲密度从陌生人到普通朋友，再到亲密同伴，话题和语气都会逐渐变化。这意味着，玩家在游戏核心玩法之外，还有了一大养成体验：培养一个完全懂自己，能和自己默契配合的AI队友。</p>\n  <p>自此，AI队友也不再是千人一面，而是千人千面，基本把“服务单一用户”这个核心目标做到了极致。</p>\n  <p>而值得一提的是，基于这一连串的发展，AI队友也衍生出了三个额外的创新功能。</p>\n  <p>其一是智能游戏助手。</p>\n  <p>原本它只能通过基础指令操作，繁琐又别扭。融入AI交互后，你直接用语音说“帮我找把狙击枪”“这装备怎么用”，它就能听懂并执行，迅速完成装备获取。</p>\n  <p>然后是为单人模式打造的AI数字助手。</p>\n  <p>新单人模式玩法复杂，传统教程成本高且枯燥。用大模型和专属知识库做出智能助手后，玩家随时可以提问，新机制出现的瞬间它会自动给出讲解。</p>\n  <p>最后是实时感知与反馈系统。</p>\n  <p>它会全程追踪你的操作：击杀、被击败、捡到顶级装备都会被记录，并由大模型生成针对性的分析和建议。状态不好时它会加油鼓劲，提供真切的情绪支持。最后一个是AI托管功能。玩家中途离场时，传统机制只会让角色原地罚站、拖累队友。AI托管则能把角色交给队友指挥，当队友用语音发指令时角色可以继续作战，保证团队始终处于协作状态。</p>\n  <p>不难看到，尽管技术的迭代丰满了AI队友，但实际上这一系列的变化后，AI能提供的服务能力半径早就不只有“陪玩”这一点了。</p>\n  <h2>03</h2>\n  <p>说白了，AI队友不只是一个“陪玩工具”，而是一整套从感知、决策到记忆、表达的技术栈，在游戏场景中率先跑通的产品形态。</p>\n  <p>AI的进步需要场景、需要技术，对于非游戏大厂来说，技术向的投入是必然的，场景却是稀缺的，但对于游戏大厂来说，场景的问题便能迎刃而解。</p>\n  <p>如果我们把视线投向腾讯、网易、米哈游这三家大厂的整体布局上，便会发现一个清晰的图景：在游戏中验证的AI能力，正沿着三条截然不同的路径，向更广阔的产业渗透。</p>\n  <p>换句话说，这是一笔关于“边际效应”的账。同一套AI技术，在游戏里跑通之后，应用到矿山、银行、影视行业的追加成本要低很多，而价值却可能更大。</p>\n  <p>腾讯把游戏里磨出来的AI决策能力和内容生产能力，封装成标准化的工具箱，卖给需要它们的行业。游戏AI的智能体框架，已经成为腾讯云智能平台的核心组件，被金融机构拿去构建能处理复杂业务流的智能客服，这本质上就是游戏里多轮对话与决策能力的迁移。而原本为游戏生成美术资源打磨的工具链，则通过腾讯云输送给影视和广告行业，让高质量数字生产内容从“手工作坊”走向“流水线”。这条路务实、可复制，是典型的腾讯打法。</p>\n  <p>网易的逻辑与之不同。它不是把游戏技术变成软件工具，而是让它直接驱动实体机械。依托游戏里的实时渲染、毫秒级控制及环境模拟等底层技术，工程机器人操作员可以通过类游戏的界面和AR眼镜，远程精准控制矿山的挖掘机。而原本用于训练多个游戏AI协同作战的算法，被用来优化智慧矿山中数十台运输车的实时调度。这条路把“游戏对物理世界的仿真”的能力，落地为一个相当硬核的应用场景。</p>\n  <p>米哈游的AI则离商业化场景最远，但离“下一代体验”最近。它在《星布谷地》里接入了能开放对话、记忆玩家关系的NPC“娜洛”，这直接为未来的虚拟社交和陪伴服务提供了一个可参考的产品原型。而蔡浩宇二次创业的《Whispers from the Star》，试图探索由AI实时生成、动态推进的剧情，这种内容生产方式一旦成熟，将对整个交互领域产生冲击。米哈游不急着将技术外溢，但它创造的模式本身就是一种外溢。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_ab4da8e08dbd473086025a1e1e152831@6371858_oswg75157oswg1080oswg496_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《星布谷地》中AI NPC娜洛</p>\n  <p>三条路径指向同一个逻辑：<strong>游戏因其对实时交互、复杂系统仿真和极致体验的追求，天然是锤炼AI技术的绝佳环境。</strong>海量用户、高频交互、极低容错率，这些条件在其他行业几乎无法同时复制。在这里被验证过的解决方案，本身就具备了解决其他行业数字化难题的“抗压能力”。</p>\n  <p>AI的进步需要技术，也需要场景。技术可以持续投入，场景却是稀缺的。游戏恰好提供了那个最苛刻也最完整的试验场。1770万玩家的每一次指令、每一次配合、每一次战术博弈，都在为这项技术的进化提供数据与反馈。</p>\n  <p>前不久，米哈游创始人刘伟在一场招聘会上表示，公司计划投入“3年最多1000亿”在AI上；腾讯、网易等厂商也早已成立了AI部门。这些都从侧面证明了游戏大厂对于AI的积极态度，而游戏也是目前能找到的最佳AI试验场之一。</p>\n  <p>如今，游戏早已不只是流量生意。在这个试验场上跑出来的每一条结果，影响的，都远不止一款产品的营收那么简单了。</p>\n  <p class=\"editor-note\">本文首发自<a href=\"https://mp.weixin.qq.com/s/J7ZeSlXOnXRXYXk0h4BdpA\" rel=\"noopener noreferrer\" target=\"_blank\">36氪游戏</a>。</p>", "category": "tech", "published_at": "2026-05-25T01:16:04+00:00", "fetched_at": "2026-05-25T02:59:05.307526+00:00", "fingerprint": "1418124d0be82320"}, {"source": "36氪 - 最新文章", "title": "华为具身大脑一号位做类脑智能世界模型，对标JEPA，获亿元级融资｜硬氪首发", "url": "https://36kr.com/p/3819931562414467?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，具身智能大脑公司「具脑磐石」完成新一轮亿元级融资，本轮融资由具备深厚类脑与具身产业背景的顶尖产业资本领投，老股东及多家顶尖基金复投和跟投，多维资本担任独家财务顾问。同时，更新一轮融资也在同步交割中。</p>\n  <p>资金将重点投入核心技术研发、人才团队扩容及全球化市场拓展，以加速认知世界模型（Cognitive World Model）的研发、工程化落地与真实场景验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260522/v2_c9e63416f89647e6bbe7def9da2c8fb9@6022551_oswg193361oswg832oswg566_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">类脑智能世界模型（图源/企业）</p>\n  <p>具脑磐石成立于2025年，以类脑智能为底层范式，构建面向真实物理世界的认知世界模型（Cognitive World Model）。公司由“华为具身大脑一号位”朱森华创立并担任CEO，他长期专注AI与脑认知交叉研究，曾在中山大学从事计算机与AI研究，博士毕业于宾夕法尼亚大学认知神经科学专业，并于中科院脑与认知科学国家重点实验室完成博士后研究。</p>\n  <p>进入华为后，朱森华担任过华为云AI算法创新Lab主任，主导并负责AI脑科学云平台、盘古具身大模型、全球具身智能产业创新中心等项目；他推动了世界模型与类脑智能融合路线的系统性验证，是华为具身智能大脑的开创者，兼具脑认知科学研究、类脑AI路线创新验证与具身智能产业落地的复合能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260522/v2_bc2c22306c054aeba925c579170f00b0@6022551_oswg410028oswg832oswg632_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">朱森华出席中国人形机器人技术应用峰会（图源/企业）</p>\n  <p>联合创始人刘晋宇长期聚焦AI机器人技术产品化与产品商业化，曾从0到1孵化多个产品事业部并实现全球规模商业落地；多位技术、供应链、运营合伙人来自清华、北大、复旦、中科院等科研院所，并曾在华为、联想、旷视、极智嘉等公司参与AI算法、机器人系统、供应链及全球商业化落地。原生团队已覆盖前沿研究、模型研发到系统工程落地的完整闭环。</p>\n  <p>过去一年，具身智能赛道的风口迅速迭代，行业热词从“VLA”悄然换成了“世界模型”。</p>\n  <p>李飞飞押注空间智能，Yann LeCun创立AMI Labs探索因果推理，英伟达、Google DeepMind等科技巨头加速布局物理仿真与真实交互技术。但热度背后，一个基础问题并未被厘清：世界模型究竟是什么？它是全新的学术理念、下一代AI的核心技术路线，还是仍在被市场反复验证的阶段性概念？不同团队给出的定义和路径各不相同。</p>\n  <p>具脑磐石创始人朱森华认为，要得到答案，需先回到问题的本源。“想真正读懂世界模型，要厘清它的技术本源与核心诉求，清楚它从何而来、要解决产业的什么根本问题。”朱森华向硬氪指出，“世界模型的底层逻辑根植于脑与认知科学的‘心智模型（Mental Model）’，是当前脑科学与与AI的前沿交叉体系，缺乏这套认知体系，大多讨论就容易停留在技术名词的排列组合。今天是VLA叠加世界模型，明天是世界模型拼接VLA，看似迭代飞快，实则没有触达技术本质。”</p>\n  <p>这一判断，直接影响了具脑磐石对技术路径的选择。在具脑磐石团队看来，具身智能正在从“动作智能”走向“认知智能”。下一阶段的核心，不只是让机器人看懂任务、完成动作，而是让机器人具备类人的小样本抽象概念学习、多维环境感知、长期记忆和主动推理能力，并在真实世界中跨场景稳定行动。</p>\n  <p>然而，当前具身智能落地仍面临多重瓶颈：高质量真实数据难以规模化获取，模型跨场景泛化能力不足，每进入新环境往往需要重新训练，机器人也缺少长期记忆与持续学习能力。数据不能无限采集，算力也不是无限资源。</p>\n  <p>反观人类大脑，它无需海量示教数据，也无需高能耗高算力，却能在复杂多变的环境中持续完成学习、感知、记忆、预测、规划与行动。这正是具脑磐石选择类脑智能作为底层路径的原因，即不是从结构上简单模拟大脑，而是提取大脑智能化的功能神经机制等核心能力，将其转化为可计算的算法与架构，最终构建下一代具身智能大脑。</p>\n  <p>具脑磐石从创立之初便提出了类脑智能驱动的认知世界模型，与Yann LeCun所提出的JEPA（Joint Embedding Predictive Architecture，联合嵌入预测架构）路线同向，基于共同的主动推理认知科学理论底座，聚焦推理、规划与真实世界建模。JEPA的价值在于令AI不再只生成“看起来像”的结果，而是在抽象表征空间中学习状态如何演化、推理未来趋势，继而更接近人类大脑认知真实世界的底层规律。</p>\n  <p>但对于需要进入真实环境中执行任务的机器人而言，仅具备“表征—预测”能力并不足以构成完整的智能闭环。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260522/v2_b35db7ca7aeb45c696d76fc152ddec23@6022551_oswg149468oswg1562oswg842_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智能闭环（图源/企业）</p>\n  <p>一个直观案例是，人过马路时，无需精准测量前后左右车辆的速度、距离、红绿灯时间，只是简单扫一眼周边现状，就能以合适的速度和节奏安全通过。这就是心智模型中的主动推理。朱森华表示，具脑磐石要做的认知世界模型，正是要把这套能力工程化，让机器人不仅预测世界如何变化，还能凭借对环境的认知自主设定目标、规划行动、执行操作，并从环境反馈中持续学习以修正自身行为。</p>\n  <p>这意味着，一个可用于具身系统的世界模型，必须涵盖从状态预测到决策执行的全链路能力。</p>\n  <p>具体到实现路径上，公司正在将脑科学中对多舱室神经元、非线性注意力、多阶段记忆、稀疏计算与主动推理等机制，转化为可落地应用的算法模型与工程化系统架构。这一路径最终指向四个核心技术目标：低数据、高泛化、终身学习、低功耗，共同突破具身智能在数据成本、跨场景适应、持续运行与算力限制等方面的现实约束。</p>\n  <p>目前，具脑磐石已在具身感知交互、规划、移动导航、操作及群体具身等方向完成多项系统级技术验证，并在国内及海外市场同步推进多个行业客户真实场景PoC，将认知世界模型从算法框架推进到真实机器人系统。</p>\n  <p>这一从算法到系统的推进方式，也构成了具脑磐石对具身智能2.0的理解：不是让机器人在演示中完成更多动作，而是让机器人真正具备接近人类大脑的认知能力——从少量经验中学习抽象规律，在复杂环境中持续感知和记忆，并在跨任务与泛场景中实现主动推理、稳定决策、持续行动。</p>\n  <p><strong>以下为硬氪与具脑磐石创始人朱森华的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：目前市场上关于世界模型的讨论很多，我们如何理解这个概念？</strong></p>\n  <p><strong>朱森华：</strong>在我们看来，世界模型其实有五个层级，从下往上依次是，第一层的视觉真实；以李飞飞老师主导的空间智能为代表，解决从2D到3D的环境真实问题。第二层是物理真实；类似Sora通过堆数据理解物理规律，但这种方式是否真正可靠，还有争议。第三层属于交互真实；是以Google DeepMind、英伟达为代表，解决智能体在环境中的触碰、反馈等交互过程如何学习。</p>\n  <p>第四层是抽象学习；以Yann LeCun团队提出的JEPA为代表，不再逐像素学习，而是在表征层面进行抽象学习，解决泛化性问题。</p>\n  <p>第五层才进入到主动推理，即源于认知神经科学的主动推断理论，追求低数据、高泛化、可终身学习、低功耗；其中，人类大脑已经证明了这套路径可行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260523/v2_b3fe400fbb3e4fa194fdd5918fd20f10@6022551_oswg197932oswg2358oswg1390_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">具脑磐石技术视野里的“World Model”技术层级体系（图源/企业）</p>\n  <p>这五个层级不是并行或相互独立的流派，而是一个从基础设施到智能能力演化的体系。前三层解决的是“如何更便宜、更可靠地获得数据和训练环境”的问题，后两层解决的是“如何高效学习和推理”的算法架构问题。它们可以分头探索，也可以相互支撑——基础设施完善了，上层工作会更高效；但即便基础设施不成熟，也不影响上层算法的验证。</p>\n  <p><strong>硬氪：类脑智能路线的核心瓶颈是什么？是算力还是理论未破译？</strong></p>\n  <p><strong>朱森华：</strong>&nbsp;都不是。实际上，今天AI领域里习以为常的很多核心概念，包括神经元、神经网络、注意力机制和世界模型等，都源自脑科学。脑科学每成熟一步，AI就能往前推一步。但我们也看到，在脑科学远未完全破译人类大脑之前，AI已经走到了今天的高度。所以瓶颈不在于“理论还没成熟，所以做不了”，也不在于算力不够。</p>\n  <p>真正的瓶颈在于人才和体系，缺少同时具备脑科学与AI交叉背景的复合人才，也缺少一套系统性的理论体系来指导大家朝着确定性的方向用力。现在的状态是“有多少人工才有多少智能”，大家在一个默认的框架里，依赖海量数据、海量算力，不停地试错，从一个实验室到另一个实验室，哪条路跑通了就叠加上去继续跑，但成本太高、效率太低。</p>\n  <p>所以我们真正需要的，是在一套相对清晰的理论体系指引下，朝着战略方向大致正确的路径，集中资源、分头探索、相互借鉴。这也是具脑磐石选择类脑智能的底层逻辑，不是等理论完全成熟再动手，而是用已有的认知神经科学成果，去指导算法架构和工程实现，让技术走得更稳、更快。</p>\n  <p><strong>硬氪：具脑磐石提出了“一脑多机、一脑多形”的应用路线，如何理解和落地？</strong></p>\n  <p><strong>朱森华：</strong>首先要承认，今天没有哪家公司能用同一个模型适配所有形态的本体。跨构型本体的模型无法直接通用，这是阶段性的现实。</p>\n  <p>我们的策略分三层：当前用类脑智能的Agent框架驱动多机协作；技术层面持续探索单一认知世界模型适配多种本体；硬件生态上与乐聚、星尘智能、智动力等多家本体厂商深度合作。长期目标是向具身行业生态伙伴开放我们的通用具身大脑模型和面向场景应用的生产力工具。</p>\n  <p>之所以这样设计，是因为当前世界模型的泛化能力还远没到“一个模型驱动所有”的水平。多机协作本质是工程问题，产线上多个机器人同时工作，形态、技能各不相同。用一个中央Agent大脑去调度、分解任务、协调动作，是当下最高效、最可行的方案。值得强调的是，具脑磐石也在用类脑智能的机制在改进Agent的感知、记忆、规划、反馈纠错等能力模块，它是一套可扩展的工程系统，是世界模型成熟前的工程化桥梁，也是未来能力完备后的自然延伸。</p>", "category": "tech", "published_at": "2026-05-25T01:30:00+00:00", "fetched_at": "2026-05-25T02:59:05.307521+00:00", "fingerprint": "947e130e4bb4dcea"}, {"source": "36氪 - 最新文章", "title": "机器人力传感器龙头再获数亿融资，上汽、中芯等抢先入局", "url": "https://36kr.com/p/3824053061652616?f=rss", "summary": "<p>硬氪获悉，近日，<strong>六维力传感器企业</strong>蓝点触控宣布完成C++轮数亿元人民币融资，��轮由<strong>上汽金控、尚颀资本领投，由中芯聚源、正大机器人以及厚为资本</strong>跟投。本轮融资将主要用于新产品研发、生产数智化建设以及全球市场拓展。</p>\n  <p>蓝点触控半年完成了三轮亿元级融资，此次融资距上一轮C+轮融资仅一个月。股东阵容目前已囊括红杉中国、宁德时代旗下溥泉资本、智元机器人、银河通用、上汽系资本、中芯产业资本等多路力量。</p>\n  <p>本轮融资投资方在产业链方向的纵深值得关注。<strong>上汽系资本（上汽金控、尚颀资本）代表汽车制造场景，中芯聚源代表半导体高端制造，厚为资本则带来广泛的消费和媒体生态资源</strong>——三者与上一轮入股的宁德时代（动力电池）及智元机器人、银河通用（整机龙头）形成了从核心零部件到终端应用的全链条覆盖。</p>\n  <p>这意味着，蓝点触控的力控传感器将率先批量部署于汽车、新能源电池等工业生产场景。<strong>产业资本不仅带来资金，更带来确定性的量产订单与应用场景。</strong></p>\n  <p>蓝点触控创始人刘吴月曾就职于航天科技集团，核心团队来自中科大、航天科技集团、中科院等科研院所，并由北航机器人所名誉所长王田苗教授担任董事。其核心产品为<strong>六维力传感器</strong>和<strong>关节力矩传感器</strong>，<strong>有着0.1%FS精度、10kHz以上响应频率、500%抗过载能力</strong>，达到国际顶尖水平，打破了海外厂商长达数十年的技术垄断。</p>\n  <p>当机器人厂商还在追逐越来越大的AI大模型参数时，给机器人装上更精细的“神经系统”已经成为新一轮融资的主旋律。2026年以来，具身智能领域融资总额已超过345亿元，<strong>资本正从整机向核心零部件领域深度渗透。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_05f0b8cf746549c09e4bba87396d500d@6310669_oswg90612oswg1268oswg685_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝点触控六维传感器已应用到核心产品</p>\n  <p>蓝点触控的航天级技术路径目前也已被成功迁移至人形机器人。以当前加速量产的人形机器人为例，单台需搭载4颗六维力传感器和28颗关节扭矩传感器——六维力传感器分布于手腕与脚踝，分别负责精密力控与动态平衡；关节扭矩传感器则遍布全身，实现柔顺力控并补偿关节间隙误差。不久前，半马赛场上刷新人类记录的机器人即安装了蓝点触控力控传感器，其感知网络的毫秒级姿态反馈实现超长距离奔跑不摔倒。</p>\n  <p>其在人形机器人中的市场优势也在不断扩大，睿工业MIR《2025年中国人形机器人六维力传感器市场调研报告书》显示，蓝点触控2024年市占率约为62%；而到了2025年，据高工机器人<strong>《GGII：2025中国人形机器人六维力传感器市场分析报告》</strong>，蓝点触控<strong>2025年市场份额已达72.6%，稳居行业第一。</strong>目前，<strong>蓝点触控关节力传感器</strong>出货量占国内95%以上，公司连续三年收入翻倍并实现盈利，已成为国内机器人力传感器领域绝对龙头。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_0b99ece89c8a46f9829075c0c7ce76c1@6310669_oswg132911oswg1265oswg774_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">核心产品体系</p>\n  <p>在产能端，蓝点触控已在广东建成超万平方米自有生产基地，当前<strong>具备关节力传感器年产100万套、末端六维力传感器年产20万套的交付能力。</strong>这一产能布局精准卡位2026年之后机器人批量订单的释放节奏，为下游整机厂的大规模量产提供了关键零部件的供应链保障。</p>\n  <p>下一步，蓝点触控将把更多精力投入到下一代高精度、高集成度力控传感器的研发，以及海外市场开拓，实现全球机器人力传感器蓝点造、让力控机器人赋能千行百业的目标。</p>\n  <p><strong>投资人观点：</strong></p>\n  <p><strong>上汽金控、尚颀资本投资团队表示：</strong>蓝点触控的六维力传感器在精度、响应速度和可靠性上已达到领先水平，我们看好其赋能汽车工厂智能制造升级的广阔前景。</p>\n  <p><strong>中芯聚源投资负责人表示：</strong>力传感器是机器人与物理世界交互的核心节点。蓝点触控具备从弹性体设计、硬件电路到结构解耦算法的全栈自研能力，与中芯聚源在半导体高端制造领域的布局高度协同。我们期待双方在机器人时代强强联手，实现共赢。</p>\n  <p><strong>正大机器人项目负责人表示：</strong>具身智能的进化离不开精准的力觉反馈。蓝点触控的力控技术填补了机器人从“看见”到“触到”的关键空白。正大机器人深度布局具身智能在内的前沿科技领域，我们相信，六维力传感器将成为下一代智能机器人的标配，我们期待与蓝点触控携手，用精准的力觉反馈打通机器人柔性作业的“最后一厘米”。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-05-25T01:50:58+00:00", "fetched_at": "2026-05-25T02:59:05.307514+00:00", "fingerprint": "688ee71fc0c61a48"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 3D打印齿科龙头要切入桌面全彩造物，获君联、达晨等3亿+融资", "url": "https://36kr.com/p/3824073646624899?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，3D打印高端光固化全栈技术企业、齿科细分龙头——黑格科技（HeyGears）于近期完成超3亿元人民币C轮融资。本轮融资由君联资本、达晨联合领投，歌斐资产、国科投资跟投。</p>\n  <p>本轮资金用途将用于光固化技术研发迭代、全球产业链深化、顶尖人才引进及新一代数字化齿科解决方案、桌面级光固化全彩造物产品的发布。</p>\n  <p>黑格科技的齿科业务始于2018年，依托耗材体系和DLP技术的全产业链国产攻坚，后推出光固化产品线UltraCraft及齿科数字化解决方案，已成为全球细分龙头。</p>\n  <p>目前，黑格科技齿科业务全球化布局成效显著，海外营收占比已突破总营收60%，是中国齿科3D打印北美出海市占率榜首企业，欧洲市场业务增速超过100%；国内齿科技工端市占率超60%，位居首位。</p>\n  <p>“很多创新都是被现实倒逼出来的。黑格创立的时候，光固化高端技术/特种材料基本都被国外垄断，设备组装、技术拼接很难达到齿科精度，更无法盈利，唯有走深度整合之路才能破局。我们从一开始就走了最难的一条路，通过全技术栈自研、打破行业黑盒，把材料体系吃透，在此之上搭建更多元灵活的解决方案，这也构成了黑格在光固化领域的核心竞争力。”黑格科技创始人兼CEO桂培炎告诉硬氪。</p>\n  <p>创立11年来，作为<strong>国内少数具备全栈自研能力和全产业链解决方案能力的3D打印技术龙头，黑格科技业务</strong>范围已跨越基本盘齿科，延伸至先进制造、具身智能、消费电子等新质生产力领域。</p>\n  <p>在多年技术和产业链能力搭建完备后，黑格科技开始着手推动高端光固化技术的场景及人群下放普惠。</p>\n  <p>硬氪了解到，黑格科技于2025年推出了搭载自研第二代LCD技术的Reflex 2及Reflex 2Pro产品线，配合自研材料体系，为鞋履工作室、小型农场主、专业级创客提供桌面级生产力工具，交付效果基本可对标DLP设备。</p>\n  <p>黑格科技表示，其真全彩、真3D消费级产品线计划于2026年第三季度面世，定位<strong>新一代桌面级全彩造物工具，希望可以</strong>通过自主技术研发，解决光固化消费级下放“易用性”、“高成本”等痛点。</p>\n  <p>截至目前，黑格科技累计研发投入已超10亿元，其自研材料业务营收占比已达总营收<strong>70%左右，</strong>在规模效应的加持下，每一台设备的出售，都是一条材料长期现金流的开端<strong>。</strong></p>\n  <p>公司希望持续在光固化技术领域深耕，让高端3D打印技术覆盖从齿科医疗走向小型工厂、造物工坊、个人创客，满足更多场景和人群的“一站式造物”需求。</p>\n  <h3><strong>CEO对谈</strong></h3>\n  <p><strong>硬氪：目前市场上消费级3D打印多以FDM技术为主，光固化技术做消费级产品时的技术难点和卡点在哪里？</strong></p>\n  <p><strong>桂培炎：</strong>从国内主流的DLP和LCD技术来说，想把它在消费级的门槛降低，短期内很难。因为光固化涉及液态树脂的处理和管理，耗材处理的难度远远大于FDM对于线材这种固体的处理。其次，光固化打印是化学变化，在家庭等消费级场景中，把化学变化变得可控本身就很难。</p>\n  <p>所以，我们需要通过颠覆式创新去自研新的光固化技术，让它既具备FDM级别的易用性、安全性，又具备光固化特有的表面质量、超高精度，再配合大家渴求的真全彩、真3D能力，这样才有可能真正撬动大众maker、小创业者和一部分家庭的消费级场景。</p>\n  <p><strong>硬氪：在齿科B端和未来的消费级/小B端市场，黑格科技的核心竞争优势是什么？</strong></p>\n  <p><strong>桂培炎：</strong>齿科的话，核心优势在于绝对的精度、稳定性和设备+材料+服务解决方案带来的高黏性。我们不是一锤子卖设备的模式，而是以交付结果倒推全周期解决方案。齿科对精度要求非常苛刻，都是微米级别的讨论。如果做得不好，客户的返工率到达百分之十几（这是真实的数据），而黑格的数据能控制在3%到5%。这近10%的返工率差异相当于是生产客户的生死线。</p>\n  <p>而在消费级或小B端，我们坚信高端光固化技术下放是满足用户实现“10到100”小规模批量成品制造的解决方案。像我们的Reflex系列推向消费级用户时，不只是卖设备，而是给出一整套包含材料、设计指引甚至自研图层（coating）的端到端解决方案，让哪怕是个人创客，也能做出商品级成品，再去变现做小生意。另外三季度的新品大家可以期待一下，也是另一个竞争优势，它解决了光固化下放的很多技术卡点。</p>\n  <h3><strong>投资人观点：</strong></h3>\n  <p><strong>君联资本：</strong>黑格迎难而上，专注高端光固化3D打印领域，利用数字光刀提升光固化3D打印向更高精度、更多材料创新、更低成本突破边界，以推动整个光固化技术在精密制造场景的渗透，这才是新质生产力要做的事。我们也相信在这个时代黑格的聚焦与坚持，会铸造更长期的壁垒。</p>\n  <p><strong>达晨：</strong>3D打印正加速从“原型工具”跨越为“生产力工具”。黑格在齿科领域推动了“从单材料到多材料、从中间品到成品”的价值跃升，并在消费端受益于降本与AI赋能加速渗透。公司长期坚持全栈自研，核心壁垒深厚，多材料与全彩3D打印等革命性技术爆发在即。</p>\n  <p><strong>歌斐资产：</strong>黑格在齿科赛道彰显出了卓越的全球化出海能力，其光固化产品也在消费市场获得了高度认可。未来，伴随公司在AI和控制算法领域的持续投入，全彩打印技术有望迎来爆发，实现B端与C端的双向驱动。</p>\n  <p><strong>国科投资：</strong>黑格的领先优势源于将设备、材料、算法与应用深度耦合的开发思路。公司打通了齿科从设计到生产的全链条服务，已全面覆盖国内外头部技工厂；在消费端，黑格通过将工业级技术降维应用，逐步拓宽了消费级3D打印的上限。随着齿科数字化及全彩3D打印需求的释放，公司前景广阔。</p>", "category": "tech", "published_at": "2026-05-25T02:09:23+00:00", "fetched_at": "2026-05-25T02:59:05.307506+00:00", "fingerprint": "f226e079b370680b"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 商汤国香投了一家消费级空间相机公司，为具身智能采集真实世界数据", "url": "https://36kr.com/p/3824089662853513?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，消费级空间相机公司竹马创新近日完成了数千万天使+轮融资，本轮由商汤国香资本领投，鼎晖VGC、峰瑞资本跟投，深渡资本担任后续独家财务顾问。资金将主要用于产品研发、量产准备及海外市场拓展。</p>\n  <p>竹马创新成立于2025年11月，是一家以Camera + AI为核心的空间智能公司。公司希望定义一种新的AI硬件品类——空间相机：既是消费级3D内容创作工具，更是面向具身智能与世界模型的真实世界三维数据入口。</p>\n  <p>团队方面，创始人张吉曾任群核科技副总裁，深度参与大规模空间数据处理与商业化；首席科学家过洁为南京大学长聘副教授、3DGS和空间仿真领域顶尖科学家；团队具备从三维数据采集到云端计算、从算法到硬件的全栈能力。</p>\n  <p>据张吉介绍，公司首款产品Pebble，将3D Gaussian Splatting、多传感器融合、端云协同与AI原生交互封装进一台消费级设备，让用户像拍视频一样捕获真实三维世界，实现“所见即所扫、所扫即所得”。目前，产品仍在研发阶段，尚未量产。</p>\n  <p>随着具身智能与VLA大模型的兴起，行业对真实世界三维数据的需求正在发生结构性变化。过去，机器人训练严重依赖遥操作数据，成本高、难以规模化。越来越多观点认为，第一视角人类视频、空间传感器数据、真实环境中的连续行为数据，将成为模型训练的新“主食”。</p>\n  <p>这正是竹马创新的核心定位：通过空间相机采集带有第一视角、三维结构、语义信息和真实尺度的数据，成为机器人时代的数据采集基础设施。</p>\n  <p>这类数据可用于构建更真实的空间世界模型，帮助机器人理解环境布局、物体关系与任务上下文，也可反哺具身智能仿真与实时空间感知训练。</p>\n  <p><strong>以下为硬氪与张吉的对话节选：</strong></p>\n  <p><strong>硬氪：本轮引入商汤和鼎晖，对公司的产业布局有何助力？</strong></p>\n  <p><strong>张吉：</strong>我们目前看到了两个明确的机会窗口：一是3DGS技术正在从实验室走向消费级应用，二是具身智能行业对真实空间数据的需求爆发在即。</p>\n  <p>商汤和鼎晖的进入不是单纯的财务投资。商汤在AI领域有很强的人才和算法积累，我们在空间智能重建方面的能力可以形成强强联合。鼎晖在机器人领域布局很深，他们希望我们作为空间智能基础设施，与更多机器人公司产生连接。这两个投资人都能与公司形成非常强的互补关系，这是我们最看重的。</p>\n  <p><strong>硬氪：消费级三维重建市场过去一直没有真正跑通，你们判断拐点到了吗？</strong></p>\n  <p><strong>张吉：</strong>我们的判断比之前更乐观。上一轮融资发布后，大量不同行业的人来找我们交流，提出了很多真实需求。之前大家没有意识到三维重建可以这样做，现在认知明显在变化。</p>\n  <p>另外，工业级三维设备企业意识到了市场的存在，但还没有选择直接下场竞争，很多在和我们探讨深入合作的可能性。还有一些初创团队目前刚刚开始进入。虽然有竞争压力，但我认为更多人进来必然有利于消费级市场的快速发展。</p>\n  <p>当前行业真正的比拼是速度和技术扎实程度——谁能先把产品定义清晰、把用户体验跑通，谁就能占据先发优势。我们每个月都有明显的产品进展，这个节奏很重要。</p>\n  <p><strong>硬氪：公司未来在具身智能生态中扮演什么角色？</strong></p>\n  <p><strong>张吉：</strong>我们的核心战略没有变化，仍然是面向空间设计师等专业人群和消费级用户，基于空间智能与空间计算的能力，提供消费级的空间相机，。但在这个过程中，我们自然沉淀出了具身智能行业非常稀缺的东西——真实物理世界的三维数据。</p>\n  <p>目前具身智能公司大多在用仿真环境训练，数据合成后真实性大打折扣。我们采集的是photoreal的真实空间数据，带有三维结构、语义信息和物理正确性，对他们来说是很好的基础设施。这不是我们刻意规划的第二曲线，而是在完成主业过程中自然形成的技术栈外溢。所以我们不会在产品层面去做具身智能，但会在技术研究层面做一些布局和开放。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>商汤国香合伙人余俊表示：</strong>物理世界的可计算、可理解、可编辑是未来应用发展的基础和底座，每一个个体也都将成为这个基座的贡献者和使用者。张总的团队特别适合为用户提供扎实的可入手和可上手的极致产品方案，团队对早期用户群也有特别深刻理解和熟知。期待竹马成为感知和计算“4D世界”的Insta360。</p>\n  <p><strong>鼎晖VGC副总裁牟刘杉表示：</strong>物理与数字世界的融合是不可逆的趋势，3DGS相机正是连接两者的桥梁。当前，3DGS技术突破与激光雷达成本断崖式下降带来了3DGS相机高速发展的市场拐点，竹马团队凭借敏锐的眼光和深厚的积累在正确的时间以精准的产品定义切入市场，未来还可向上可生长为具身智能的数据基础设施并有着更多可能性。我们期待与竹马团队一起，见证真实世界被重新捕获和理解的未来。</p>\n  <p><strong>峰瑞资本合伙人马睿表示：</strong>祝贺公司在短短一个月时间里完成新融资，峰瑞持续追加是因为非常看好创始人张吉和团队执行力，期待竹马拿出消费级空间相机，并成为世界模型的新数据入口。</p>", "category": "tech", "published_at": "2026-05-25T02:25:26+00:00", "fetched_at": "2026-05-25T02:59:05.307490+00:00", "fingerprint": "28a8c8a8f175ddd9"}, {"source": "少数派", "title": "capcap：一键搞定截图、标注与图床，免费、开源的 macOS 截图工具", "url": "https://sspai.com/post/109741", "summary": "一个常驻菜单栏的小工具，双击 ⌘ 就能截图、标注、长截、美化、上传图床——纯 AppKit、零依赖、零订阅、零遥测。<a href=\"https://sspai.com/post/109741\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-24T06:21:48+00:00", "fetched_at": "2026-05-25T02:59:03.310201+00:00", "fingerprint": "3c9417276b713d95"}, {"source": "少数派", "title": "派早报：GitHub 在微软治下面临技术和人员流失困境", "url": "https://sspai.com/post/110130", "summary": "<p>GitHub 在微软治下面临技术和人员流失困境</p><p>老虎、富途、长桥将被全面取缔境内业务</p><p>谷歌搜索 AI 模式误将 disregard 等关键词当作指令</p><p>「死了么」更名为「在么在么」用于老人居家安全</p><p>公安部拟明确取证中获取密码等特殊程序</p><p> 伦敦 iPhone 盗窃集团采用威胁手法解绑 Apple ID</p><p>看看就行的小道消息</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/110130\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-24T22:36:51+00:00", "fetched_at": "2026-05-25T02:59:03.310189+00:00", "fingerprint": "7c8ca38ab2ac99bc"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
