<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

l": "https://www.theverge.com/transportation/993341/evtol-air-taxi-aviation-eipp-texas", "summary": "A new federal program to test the feasibility of electric, hybrid-electric, and autonomous aircraft kicks off today in Texas - before the rules governing this new technology have even been finalized. Earlier this year, the Federal Aviation Administration's Advanced Air Mobility and Electric Vertical Takeoff and Landing (eVTOL) Integration Pilot Program (eIPP) selected eight state-led [&#8230;]", "category": "tech", "published_at": "2026-09-10T16:00:00+00:00", "fetched_at": "2026-09-11T02:42:08.501521+00:00", "fingerprint": "e138becbb0b23072"}, {"source": "The Verge", "title": "Amazon’s Fire TV Stick 4K is over half off at under $20", "url": "https://www.theverge.com/gadgets/993455/fire-tv-stick-4k-resident-evil-requiem-deal-sale", "summary": "Looking to take full advantage of your 4K television, but your current streaming stick doesn’t have the right features? Through September 13th, you can grab an Amazon Fire TV Stick 4K from Woot for just $16.09 when you use the coupon code FIRE30 at checkout. With support for Wi-Fi 6 and 2GB of memory, it’s [&#8230;]", "category": "tech", "published_at": "2026-09-10T16:58:44+00:00", "fetched_at": "2026-09-11T02:42:08.501515+00:00", "fingerprint": "3f9716601bcac0c3"}, {"source": "The Verge", "title": "Schools are catching on to Big Tech’s playbook", "url": "https://www.theverge.com/policy/993308/computer-science-ai-education-coding-kids", "summary": "It's the hot new thing in tech, and it's where all the jobs are. Students who don't learn to use it fall behind. And to help them catch up in time, its creators are graciously providing the resources and curriculum for learning it, often pro bono. That's the narrative AI companies are pitching schools on [&#8230;]", "category": "tech", "published_at": "2026-09-10T19:44:20+00:00", "fetched_at": "2026-09-11T02:42:08.501509+00:00", "fingerprint": "36170847786106c4"}, {"source": "The Verge", "title": "Slack can now vibe-code interactive charts and reports inside chats", "url": "https://www.theverge.com/tech/989853/slackforce-surfaces-launch", "summary": "A new feature coming to Slack will allow you to build interactive reports, polls, dashboards, presentations, microsites, and other tools directly inside a chat. With Slackforce Surfaces, you can describe to Slackbot what you need, and it will use AI to gather information from relevant conversations and connected apps, like Google Drive or Salesforce, to [&#8230;]", "category": "tech", "published_at": "2026-09-10T21:25:21+00:00", "fetched_at": "2026-09-11T02:42:08.501498+00:00", "fingerprint": "baa39032259715dd"}, {"source": "36氪 - 最新文章", "title": "一年融3轮，哈工程海洋工程团队「工至海洋」打造深海机器人，已获亿元意向订单 | 水下项目", "url": "https://36kr.com/p/3977372742250756?f=rss", "summary": "<p>1854年，一个叫菲尔德的年轻人决定用海底电缆横贯大西洋。经过数次失败，几乎所有股东要求终止计划后，1858年8月，电缆终于铺通，英国女王的声音通过电缆传到美国，人类第一次以分钟为单位，跨越大洋传递信息。</p>\n  <p>169年后的今天，全球海底光缆的总长度已经超过140万公里，承载95%以上的跨洲数据传输，但人类对海缆的日常维护能力还停留在“石器时代”。</p>\n  <p>“全球所有海缆的日常运维几乎是零。”深海具身智能机器人公司「工至海洋」创始人郭春雨说。“一旦海缆断裂，检修周期以月计，成本更是高达千万元。”</p>\n  <p>这不是海缆独有的困境。复杂洋流、强腐蚀性海水、生物附着群落等极端环境让传统水下作业装备几乎束手无策。</p>\n  <p>郭春雨的团队正在为深海作业困境提供解法。“我们做了20多年科研，已经解决了深海作业70%-80%的问题，到了将技术能力尽快转化成生产力的时期。”</p>\n  <p>2025年，郭春雨创办工至海洋，凭借自研的柔性波动鳍+矢量泵喷耦合技术，在成立不到一年、团队人数不足20人的阶段，就已拿到亿元意向订单，客户涵盖深海采矿、可燃冰开采、海底光缆运维、极地科考等多个高壁垒场景。</p>\n  <h2><strong>依托40年技术传承，首创低扰动、低噪声的深海推进方案</strong></h2>\n  <p>工至海洋的起点，比大多数同领域创业公司要早得多。</p>\n  <p>郭春雨所在的哈尔滨工程大学，前身是中国人民解放军军事工程学院海军工程系，船舶工程学科排名全国前列。郭春雨的老师黄胜教授是新中国第一批留学学习造船技术的水下推进专家。</p>\n  <p>郭春雨不仅是哈工程教授、博士生导师，还是国家级领军人才、水下推进技术工信部重点实验室主任、2024及2025年度全球前2%顶尖科学家，任工信部船舶能效提升专项论证组专家及中国造船工程学会船舶力学学术委员会委员等学术职务，是国际上较早及系统开展船舶水下绕流场理论与实验方法研究的学者。</p>\n  <p>基于四十余年的学术传承与科研积累，郭春雨提出，<strong>本体噪声和视觉受限是几乎所有深海作业始终无法解决的核心技术难题。</strong></p>\n  <p>以往行业惯用的螺旋桨推进方案动力强。但噪声高，使声呐无法有效工作，还会扰动海底沉积物，影响设备能见度。而环境友好的方案牺牲动力和航速后，又会限制设备抗流能力弱，难以胜任高强度作业。</p>\n  <p>工至海洋的解法是全球首创的柔性波动鳍+矢量泵喷耦合技术。柔性波动鳍模仿模仿深海波斯地毯海扁虫的游动方式，采用柔性材质波动推进，降低对周围水体的扰动；泵喷推进采用军用潜艇的泵喷推进技术，极大降低本体噪声。</p>\n  <p>两者耦合后，机器人既能在需要时高速抵近（最高15节、续航72小时以上），又能在作业时切换到低噪模式（辐射噪声低至86dB，传统方案100-170dB）。沉积物羽流仅为传统设备的1/500，近乎零扰动，可以在生态敏感海域合法作业。</p>\n  <p>除了在动力系统的技术创新，工至海洋还自研了传感、控制、通导、防水和智能系统，共同形成水下作业技术平台体系。其中传感系统基于团队过往积累的多模态、多场景数据集与200TFLOPS总算力, 构建起融合物理规律与AI算法的图像增强模型，搭载5MP高清摄像机，将感知距离提升25%，目标识别准确率超过95%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_1f0c196688da40b499d1c1f4d91fae86@5688585_oswg720408oswg1080oswg489_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">深海机器人应用场景示意图</p>\n  <h2><strong>理解市场，从科研院所走向商业世界</strong></h2>\n  <p>技术领先是一回事，能否商业化是另一回事。创业以来，郭春雨花了很长时间，适应从学者向创业者的转型：“学者是安静的、甚至顽固的，要不被外界干扰才能做研究。但企业家要有足够的心胸让更多人帮你，要听得进不同意见。这两种思维模式是两个极端，我自己也在进化。”</p>\n  <p>郭春雨记得，种子轮融资时，一家上市公司给出了比另一个早期机构高两三倍的估值。他思考一整晚后，选择了后者。“工至海洋不需要在估值上证明自己，而是能从机构身上学到更多金钱之外的东西。”</p>\n  <p>“深海科技”2025年被写进政府工作报告，与商业航天、低空经济并列，一级市场热度也迅速提高，但几乎都集中在船体清洗、消费级水下无人机等浅滩场景，深海仍然显得小众和神秘。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_1560df161d274588b7cc4308a7bc96e7@5688585_oswg758300oswg1080oswg515_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">深海机器人应用场景示意图</p>\n  <p>在这种背景下，那位早期投资人在北京创投圈为工至海洋积极奔走，加上工至海洋本身在深海技术领域的稀缺性，让更多投资人看到了一个真正能啃硬骨头的标的，短短一年间，找到几乎没有对外发声过的工至海洋，被十几家投资机构主动找上门。</p>\n  <p>郭春雨透露，目前工至海洋已完成3轮融资。今年8月刚刚完成的A轮融资，投资方包括中新具身智能基金、小即是大创投和隐峰资本。</p>\n  <p>他也坦承自己的短板：“我们其实不是低调，是商业化做得不好，团队20个人几乎都是科研人员，腾不出手去做宣传，大型会展都还没参加过。”</p>\n  <p>为了更加直观地向市场证明技术可行性，工至海洋曾选择水库作为“考场”。</p>\n  <p>乍看之下，从深海转战水库是在做降维打击，但郭春雨表示，水库空间极度狭窄、贴壁精度要求高、水流扰动复杂，水中还有渔网、树枝等障碍物，这种非结构化环境比开阔的深海更难完成作业。</p>\n  <p>“水库和深海的区别，就像人形机器人在空旷操场上跑步，和在堆满杂物的房间里干活，你说哪个更难？”郭春雨说。</p>\n  <p>水库验证的结果是，工至海洋机器人单次作业成本从500万元降至70万元，全流程巡检周期从6个月缩短至20天，效率提升90%。郭春雨说，“这是我们快速打开政府采购与大型国企基础设施运维市场的一张门票。”</p>\n  <h2><strong>成本远低于传统方案，已获得近亿元意向订单</strong></h2>\n  <p>郭春雨在一次客户沟通时发现，“客户以前购买过两台海外公司的水下机器人，价格高达数千万元，领导希望用机器降低成本，但一线工程师的实际反馈是，为了维护这两台机器，反而要多雇几个人，操作也不友好，坏了没法修，最后实际上闲置了。”</p>\n  <p>因此工至海洋对产品的追求是：“让水下机器人像手机一样，开机就能用。”例如正在为中远海运研发的“手提包式”水下机器人，重量仅几公斤，预售价不到10万元。</p>\n  <p>目前，工至海洋的机器人产品包括25kg级小型仿生ROV、1000kg级大型仿生AUV以及多款自主研发的高性能水下推进系统，并且价格只有传统水下机器人的不到1/10。</p>\n  <p><strong>郭春雨解释，价格更低的核心原因在于从图纸到组装全部自研，核心部件自主生产。</strong>但他对于这种优势也很清醒，“我们能做到这个价格，很大程度上是因为没有把20多年的科研成本算进去，但技术的封闭性永远不可能做到。我们必须不断推陈出新，保持技术先进性。”</p>\n  <p>工至海洋正在布局水下机械臂等核心部件技术研发，同时与某院士团队合作研发水下惯导与DVL结合的前沿技术，以解决水下荷载难题。</p>\n  <p>“学术红利”转化为真正的商业价值，还需要建立起真正的工程化和量产能力。</p>\n  <p>目前工至海洋在深海采矿的核心场景已获得近亿元意向订单，在设备远程运维、军事海洋侦查等高壁垒应用场景，与客户完成技术参数确认与商务谈判，并与中国船舶重工集团第七〇四研究所达成战略合作，为国家极地科考工程提供关键技术支持。</p>\n  <p>此外在海外市场也有所突破，已与新加坡当地海洋工程服务商签订，水下清洗ROV框架协议，首批交付规模为数千万元；与加拿大APG-Neuro签订3000万元的核心组件独家供应协议。</p>\n  <p>为尽快承接更大规��订单，2026年7月，工至海洋在江苏南通启东的智能化工厂开工建设，预计每年可生产近百台水下机器人本体。</p>\n  <p>郭春雨预计，公司2026年预计实现营收3000万元，2027年有望营收过亿元并实现盈利。</p>\n  <p>谈及长远愿景，郭春雨表示：“华为的发展历程跟我们这个团队的历史很像。我特别希望工至海洋能够成为深海华为。”</p>\n  <p>这个愿景有充足的技术底气，也已经获得市场的初步验证和资本的阶段性信任，接下来的产能爬坡和订单交付表现，将是最直观的检验。</p>", "category": "tech", "published_at": "2026-09-10T09:47:32+00:00", "fetched_at": "2026-09-11T02:42:08.423686+00:00", "fingerprint": "6c1d591aae4b6e8f"}, {"source": "36氪 - 最新文章", "title": "36氪正在寻找值得报道的创业项目，有项目的朋友可以来试试", "url": "https://36kr.com/p/3977421065466121?f=rss", "summary": "<p><strong>如果你正在创业，或者手上正在做一个项目，可能会遇到一个挺现实的问题：</strong></p>\n  <p><strong>项目做了很久，但���正知道的人并不多？</strong></p>\n  <p>产品上线了，有了第一批用户；<br />业务开始跑起来了，也有了客户和营收；<br />团队每天都在忙着做产品、拓市场、找合作……</p>\n  <p>但出了自己的圈子之后，可能还是没人知道你在做什么。</p>\n  <p>其实对于创业项目来说，除了融资和业务增长，<strong>媒体曝光也是一个很重要的事情。</strong></p>\n  <p>最近，36氪也在持续寻找值得关注和报道的创业项目。</p>\n  <p>如果你的项目有一定创新性，已经开始落地，或者在某个细分领域有一些不错的进展，都可以尝试提交。</p>\n  <p>不一定非要是已经完成多轮融资的大公司。</p>\n  <p><strong>早期创业项目也可以。</strong></p>\n  <p>比如：</p>\n  <p>AI、科技、消费、产业互联网、企业服务、出海、新消费、硬件、医疗、教育等方向，只要项目本身有一定亮点，都可以尝试。</p>\n  <p>当然，媒体报道也不是简单地“介绍一下公司”。</p>\n  <p>&nbsp;</p>\n  <h2><strong>真正有价值的报道，通常会关注几个问题：</strong></h2>\n  <p><strong>你为什么要做这个项目？</strong></p>\n  <p><strong>你到底解决了什么问题？</strong></p>\n  <p><strong>用户为什么愿意使用你的产品？</strong></p>\n  <p><strong>目前项目已经做到什么程度？</strong></p>\n  <p><strong>相比同类项目，你有什么不一样？</strong></p>\n  <p>如果这些问题能够讲清楚，其实一个项目就已经具备了比较好的报道基础。</p>\n  <p>而对于创业团队来说，一次媒体报道带来的也不只是曝光。</p>\n  <p>可能是投资人第一次看到你，<br />可能是一个潜在客户第一次认识你，<br />也可能是一个行业合作伙伴主动找过来。</p>\n  <p>尤其对于还处在早期阶段的创业者来说，<strong>让更多人知道你正在做什么，本身就是一件有价值的事情。</strong></p>\n  <p>所以，如果你现在正在创业，手上刚好有一个已经在落地的项目，可以整理一下项目资料，尝试提交给36氪进行报道推荐。</p>\n  <p>&nbsp;</p>\n  <h2><strong>目前项目征集/报道机会可以免费尝试。</strong></h2>\n  <p>不需要先把项目包装得多么“高大上”，也不用非得有几十万用户。</p>\n  <p>把项目是什么、解决什么问题、现在做到哪一步，以及为什么值得关注讲清楚，就可以了。</p>\n  <p>有时候，真正值得报道的项目，可能并不是那些已经被所有人知道的公司。</p>\n  <p>而是那些<strong>正在认真做事、已经跑出一点成绩，但还没有被更多人看到的创业团队。</strong></p>\n  <p>如果你身边也有正在创业的朋友，可以把这条信息转给他。</p>\n  <p><strong>也许下一篇被36氪报道的项目，就是你正在做的这个。</strong></p>\n  <p><strong>免费提交项目：</strong><br /><a href=\"https://36kr.com/seek-report-new\" rel=\"noopener noreferrer\" target=\"_blank\">https://36kr.com/seek-report-new</a></p>\n  <p><strong>36氪项目推荐联系邮箱：</strong><br /><a href=\"mailto:aireport@36kr.com\">aireport@36kr.com</a></p>\n  <p>客服可以扫描下方二维码联系～</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260910/v2_61e9fced05214f5881a6e6e2ad218743@5284654_oswg50025oswg216oswg210_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加</p>", "category": "tech", "published_at": "2026-09-10T10:17:32+00:00", "fetched_at": "2026-09-11T02:42:08.423680+00:00", "fingerprint": "fbfc83d6f810153c"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨英伟达被调查；罗永浩连用7个“抄的”吐槽苹果折叠屏；欧洲央行将三大关键利率上调25个基点", "url": "https://36kr.com/p/3978247601601280?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>DeepSeek V4.1 Flash模型正式发布</p>\n  <p>298项重要国家标准发布，涉及AI、半导体等</p>\n  <p>苹果回应下架iPhone 17 Pro</p>\n  <p>功率半导体大厂，宣布涨价</p>\n  <p>OpenAI限制Adobe及其他竞争对手在ChatGPT投放广告&nbsp;</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>美司法部调查英伟达，涉及英伟达去年与人工智能芯片初创公司Groq达成的交易</strong></p>\n  <p>据报道，美国司法部正在调查英伟达公司是否试图规避反垄断审查，这一调查涉及英伟达去年与人工智能芯片初创公司Groq达成的交易。去年12月，英伟达宣布与Groq达成一项价值170亿美元的交易。根据协议，英伟达获得Groq芯片技术的非排他性授权，同时吸纳了包括Groq创始人乔纳森·罗斯在内的部分高管。</p>\n  <p>美监管机构指出，这类“变相收购”行为会扼杀AI芯片行业的市场竞争，进一步强化英伟达在该领域的主导地位。路透社的报道指出，如果调查认定英伟达在交易操作方面存在问题，司法部可能对其处以罚款，但大概率不会要求撤销这笔交易。截至发稿，美国司法部、英伟达及Groq均未就这一报道置评。（央视财经）</p>\n  <p><strong>罗永浩连用7个“抄的”吐槽苹果折叠屏iPhone Duo：我们究竟错过了多少科技创新带给我们的真正喜悦和幸福感&nbsp;</strong></p>\n  <p>9月10日，罗永浩发文吐槽苹果折叠屏iPhone Duo：</p>\n  <p>还能说点实话吗？折叠机形态？抄的；屏下摄像头？抄的；矮胖的阔屏比例？抄的；侧面Dock？抄的；外屏/内屏无缝接力？抄的；多角度悬停？抄的；钛合金3D打印铰链盖？抄的；</p>\n  <p>折痕搞不定，所以不惜降低屏幕体验用雾面屏掩饰？这确实是原创的，但这又导致前摄在雾面屏下会糊，只好在雾面屏上单独磨亮前摄那一小块，导致本来要掩饰的前摄又被突出了？这确实是原创的，但这肯定是百分之百的屎上雕屎，相比之下，灵动岛也是自己拉，自己雕，但最后灵动岛毕竟还是雕出了一点花；好吧，折叠时的动画效果确实是原创的，而且效果很好看，所以拿了软文费的写手，和脑残果粉，只能拿着它反复高潮了。</p>\n  <p>最后……还有25天，就是老人家十五周年的忌日了，无限怀念和伤感。没法想象失去了他的这十多年，在一群笨蛋和笨蛋的抄袭者们的交替狂欢中，我们究竟错过了多少科技创新带给我们的真正喜悦和幸福感……（第一财经）</p>\n  <p><strong>欧洲央行将三大关键利率上调25个基点</strong></p>\n  <p>欧洲央行将存款机制利率上调25个基点至2.50%，将主要再融资利率上调25个基点至2.65%，将边际贷款利率上调25个基点至2.90%。（央视财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek V4.1 Flash模型正式发布</strong></p>\n  <p>36氪获悉，DeepSeek V4.1 Flash模型正式发布。据介绍，该模型具备原生多模态视觉理解能力，新模型结构的设计初衷是：能力上限更高、推理速度更快、吞吐更大、可扩展到更大参数模型。得益于模型架构的创新，DeepSeek下调了V4.1 Flash的定价。同时，为了更合理地调配资源，仍然采用峰谷定价，闲时价格为高峰时段价格的一半，鼓励用户根据实际使用情况调整任务时间。新价格于2026年9月10日12:00开始生效。</p>\n  <p><strong>DeepSeek Harness更新：适配DeepSeek V4.1 Flash模型</strong></p>\n  <p>36氪获悉，DeepSeek Harness v0.1.5版本现已发布。新版本与DeepSeek V4.1 Flash模型训练深度结合，模型在DeepSeek Harness的不同配置中都进行了专项训练和优化。同时，新版DeepSeek Harness为插件作者提供了更多标准化的UI扩展入口，新增了文件上传、侧边栏文件预览等功能，优化了UI的性能与交互，并持续增加与模型研究前沿深度结合的实验性功能。</p>\n  <p><strong>宇树科技：完全开源UnifoLM-WLA-1.0具身基座模型</strong></p>\n  <p>36氪获悉，宇树完全开源UnifoLM-WLA-1.0具身基座模型，单模型统筹桌面与全身移动操作，支持跨任务、跨末端执行器泛化。</p>\n  <p><strong>Anthropic向欧盟开放Mythos模型访问权限</strong></p>\n  <p>据报道，Anthropic已向欧盟网络安全机构开放其Mythos人工智能模型的访问权限。欧盟委员会发言人Thomas Regnier表示：“在与Anthropic进行建设性沟通后，我们可以确认，欧盟网络安全局（ENISA）已获准访问Mythos 5，目前正在测试。”Regnier称，ENISA将无法访问该模型的最新版本Mythos 5.1。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>《金融强国建设“十五五”规划》正式出台</strong></p>\n  <p>中国人民银行副行长陆磊9月10日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上表示，近日，《金融强国建设“十五五”规划》正式出台。为实施好相关部署，中国人民银行制定印发了《中国人民银行“十五五”改革发展规划》，配套出台了9份相关领域的行动方案。（新华社）</p>\n  <p><strong>298项重要国家标准发布，涉及AI、半导体等</strong></p>\n  <p>9月10日了解到，国家标准委批准发布298项重要国家标准。其中，强制性国家标准27项，推荐性国家标准271项，涉及高新技术、传统产业、安全生产、农业等领域。该批标准发布后将在推动产业高质量发展、提升人民群众生活品质、保障生命财产安全等方面发挥重要作用。在高新技术方面，发布人工智能、智能语音交互、智慧服务等47项国家标准，将在电力、港口、石油、家居等领域规范AI发展，赋能行业提质增效。发布半导体器件、集成电路等26项国家标准，规范半导体产业发展，强化产业链韧性，助力科技自立自强。（央视新闻）</p>\n  <p><strong>证监会李超：努力将A股打造为境内优质企业上市首选地</strong></p>\n  <p>在国新办新闻发布会上，证监会副主席李超表示，下一步，证监会将实施更具包容性的发行上市、并购重组等制度，努力将A股打造为境内优质企业上市首选地。动态完善上市标准体系，有序扩大向新向优的覆盖面。加快修订再融资注册办法等制度规则。促进北交所、新三板一体化高质量发展。进一步畅通私募创投基金“募投管退”循环，引导投早、投小、投长期、投硬科技。（证券时报）</p>\n  <p><strong>印度政府机构建议对小米公司展开调查，外交部回应</strong></p>\n  <p>外交部发言人郭嘉昆主持例行记者会。路透社提问，印度公司事务部下属的严重欺诈调查局（SFIO）建议对小米公司展开调查，理由是小米公司在商业模式及遵守外商投资法规方面涉嫌违规。请问外交部对此有何评论？郭嘉昆表示，“我不了解你提到的具体情况。中印经贸合作本质上是互利共赢的，希望印方为各国企业在印投资经营提供公平、公正、透明、非歧视的营商环境。”（澎湃新闻）</p>\n  <p><strong>美股三大指数集体收跌，苹果涨超3%</strong></p>\n  <p>36氪获悉，9月10日收盘，美股三大指数集体下跌，道指跌0.6%，纳指跌0.65%，标普500指数跌0.58%。大型科技股多数下跌，英特尔、甲骨文跌超5%，英伟达跌超2%，Meta、特斯拉跌超1%，亚马逊、奈飞小幅下跌；苹果涨超3%，谷歌、微软小幅上涨。热门中概股跌多涨少，蔚来跌超3%，哔哩哔哩、富途控股、老虎证券、理想汽车、小鹏集团跌超2%，百度跌超1%；爱奇艺、腾讯音乐、京东小幅上涨。</p>\n  <p><strong>传月之暗面拟赴香港、上海双重上市，知情人士：消息不实</strong></p>\n  <p>有报道称，国内头部大模型企业月之暗面正考虑在香港和上海两地上市，以借此获得更多资金。对此，知情人士称，该消息不实。（财联社）</p>\n  <p><strong>燧原科技：股票今日在科创板上市</strong></p>\n  <p>9月9日燧原科技发布公告，公司股票于2026年9月11日在上海证券交易所科创板上市；截至公告披露日（9月9日），公司尚未盈利，自上市之日起纳入科创成长层。本次发行后总股本为4.3亿股，上市初期无限售流通股数量为1790.03万股，占本次发行后总股本的比例为4.1595%。(金十数据)</p>\n  <p><strong>2026年A股上市公司现金分红榜单揭晓，2.4万亿元“真金白银”落地</strong></p>\n  <p>中国上市公司协会9月10日发布2026年上市公司现金分红榜单。数据显示，2025财务年度A股上市公司分红总额高达2.4万亿元，同比增长3.3%，创下历史新高。近七成上市公司派发“真金白银”，现金分红已从阶段性热潮全面迈入“常态化”新阶段。（上证报）</p>\n  <p><strong>寒武纪回应AI处理器大幅调价传闻</strong></p>\n  <p>有消息称，包括寒武纪在内的中国AI芯片厂商大幅上调现有及新一代AI处理器的售价。其中，寒武纪对其下一代暂定命名为690的芯片重新定价，较两个月前的参考报价上涨20%至30%。对此，记者以投资者身份致电寒武纪，公司接线工作人员表示，公司并未发布涨价相关消息，请投资者以公司在官方指定信息披露媒体披露的相关公告为准，切勿轻信市场上的相关传闻。公司无法对产品后续价格走势作出判断。（21财经）</p>\n  <p><strong>月之暗面官宣企业合作伙伴“登月计划”，首批签约多家上市公司</strong></p>\n  <p>36氪获悉，9月10日，月之暗面正式启动Kimi企业合作伙伴“登月计划”，将以FDE模型与各行业系统集成商共建前置部署工程师队伍，深入客户现场，推动大模型进入企业核心业务流程。这也是国内首家采用FDE模型进行AI末端部署的大模型公司。首批签约伙伴包括中软国际、金山云、华胜天成、亚康股份、亚信科技等，覆盖软件信息服务、通信、基础设施、云计算等领域。该计划将持续面向IT服务商、软件服务商及咨询机构开放。</p>\n  <p><strong>央行：将在9月14日至9月17日开展隔夜逆回购操作，每日操作量不超过6000亿元</strong></p>\n  <p>36氪获悉，央行发布公告，为更好匹配银行体系短期流动性需求，中国人民银行将在9月14日至9月17日开展隔夜逆回购操作，采用固定利率、数量招标，每日操作量不超过6000亿元。</p>\n  <p><strong>机构：预估2026年苹果iPhone Duo出货量约500万支，市占近25%</strong></p>\n  <p>36氪获悉，TrendForce集邦咨询估计，2026年苹果首款折叠手机iPhone Duo出货量约500万支，将可助力苹果在折叠手机市场取得约24.8%市占率。该机构预估，2026年全球折叠手机出货量约2020万支，较2025年微幅成长0.5%。若排除苹果的贡献，2026年安卓品牌合计出货量仅约1520万支，年减逾20%，主因是零部件成本大幅度上涨，各品牌出货多持平前一年或出现下降。在此情况下，预估三星出货量约710万支，市占率35.1%；华为出货量约500万支，市占率24.8%。</p>\n  <p><strong>苹果iPhone Duo遭黄牛爆炒，首发代抢标价9.9万元</strong></p>\n  <p>9月10日，苹果首款折叠屏手机iPhone Duo发布后，经查询闲鱼等二手交易平台发现，已有多名商家上线iPhone Duo首发代抢服务，有黄牛标价高达9.9万元。经询问多位商家发现，iPhone Duo加价普遍已炒至5000元左右，最低加价也在1000元以上，目前黄牛端1TB、2TB版的行情价仍在上调，不少黄牛以“第一天拿到现货”招揽买家，部分消费者预约抢购的定金已炒至800元左右，“跑单不退”。（第一财经）</p>\n  <p><strong>字节跳动聘请前Coatue高管，加码AI领域投资交易</strong></p>\n  <p>据报道，字节跳动有限公司聘请了Coatue Management的前高管掌管企业投资团队。据知情人士透露，Jiang Kai担任位于香港的财务投资部门负责人，向首席财务官高准（Julie Gao）汇报。知情人士表示，此次任命将帮助字节跳动建立一套更为系统化的机制，投资新兴科技初创企业。（新浪财经）</p>\n  <p><strong>国办：推动龙头企业率先践行“60日付现承诺”</strong></p>\n  <p>36氪获悉，国务院办公厅印发《关于加强中小企业回款难问题治理有关工作的通知》。其中提出，推动龙头企业率先践行“60日付现承诺”。发布行业领域大型企业及时支付倡议，引导大型企业特别是龙头企业带头发布并践行自货物、工程、服务交付之日起60日内以现金方式向中小企业支付账款的承诺。督促大型企业严格按照企业会计准则记账，纠正不签合同、不开发票、不确认债权债务关系等行为。指导相关协会开展及时支付自律管理，制定及时支付自律规范。</p>\n  <p><strong>香港证监会因涉嫌操纵首次公开招股行为而暂停拨康视云股份交易</strong></p>\n  <p>36氪获悉，香港证监会发布公告，指示港交所自2026年9月10日上午9时正起，暂停拨康视云-B的股份交易。证监会对拨康视云的首次公开招股可能曾被人为操纵，以营造对拨康视云股份需求的假象表示严重关注。由于调查仍在进行中，证监会不会作进一步评论。</p>\n  <p><strong>苹果回应下架iPhone 17 Pro</strong></p>\n  <p>9月10日苹果秋季发布会后，在苹果官网检索发现，iPhone品类目前仅有iPhone Air、iPhone 17、iPhone 17e、iPhone 16在售，iPhone 17 Pro系列已下架。对此，苹果官方客服表示，发布新产品时，iPhone 17 Pro系列会下架，只留基础款在售。上述客服明确表示，“不会重新上架”。（中新经纬）</p>\n  <p><strong>白宫高官称美伊战事或持续至特朗普任期结束</strong></p>\n  <p>据美国《华尔街日报》9日报道，白宫高级官员私下向美国总统特朗普指出，美伊战事可能会持续至其总统任期结束。报道援引多名美官员的话说，在白宫椭圆形办公室和战情室举行的会议中，美国副总统万斯、国务卿鲁比奥等人与特朗普讨论了伊朗可能在美国的封锁和其他军事压力下继续抵抗的情况，这或许会造成冲突持续至2029年1月的总统就职日之后。报道还说，白宫高级官员私下承认这场军事冲突可能会拖上数年，这与特朗普声称美国已击败伊朗军队、伊朗政权即将投降的说法相矛盾。（新华社）</p>\n  <p><strong>存储巨头铠侠CEO：价格已涨得够高</strong></p>\n  <p>9月9日，今年4月份刚接任铠侠（Kioxia）CEO的太田裕雄（Hiroo Ota）直言，“（存储）价格已经涨得够高了！”他表示，已指示业务团队不要向数据中心客户大幅提高报价，以免打击AI产业的投资意愿。太田强调，即便是超大规模数据中心运营商，其预算也是有限的，若价格继续失控上涨，最终将反噬AI投资意愿，进而冲击整体内存市场的长期成长。</p>\n  <p>铠侠的核心产品是NAND闪存及固态硬盘（SSD），与前三个月相比，铠侠6月份的NAND闪存平均价格上涨了70%，而前一个季度的价格涨幅超过一倍。分析师预计，该公司截至3月份的财年营业利润将增长九倍以上。（财联社）</p>\n  <p><strong>功率半导体大厂瑞萨电子宣布涨价</strong></p>\n  <p>功率大厂瑞萨电子宣布对产品价格体系进行调整，新价格将于2027年1月1日起正式生效。今年3月，该厂也曾发布涨价通知，并于今年7月1日生效。瑞萨在此次通知中提到，目前行业仍面临原材料、能源、先进封装、制造产能以及全球物流等方面的结构性成本上涨。</p>\n  <p>功率半导体是电能转换与电路控制的核心器件，广泛应用于电力电子领域，近年来AI数据中心建设带来电源控制和机柜供电相关功率芯片需求激增。据《科创板日报》不完全统计，除瑞萨电子外，2026年以来已有多家功率半导体厂商宣布涨价，涨价经历好几轮，涵盖海外龙头与国内主要厂商。（财联社）</p>\n  <p><strong>台积电1.4纳米建厂加速，明年下半年有望量产</strong></p>\n  <p>据报道，台积电中科扩建二期1.4纳米建厂全面加速，第一座（P1）厂目前已完成钢构结构体，预计明年4月即可试机，明年下半年有望量产。报道称，台积电已提出申请，在基地建置两座临���办公室，预计明年4月同步完工，首批将有超5400名营运及外包人员进驻。这也代表P1厂将在明年4月启动试机，下半年就有机会量产，较原订2028年量产进度提前许多。（界面新闻）</p>\n  <p><strong>OpenAI呼吁美国制定强制性全国AI安全规则，并支持四项加州法案</strong></p>\n  <p>OpenAI当地时间9月9日表示，将推动美国建立具有强制约束力、按照模型能力和风险分级的全国人工智能安全制度。公司提出，针对开发最先进模型的少数大型实验室，应设置统一的测试、独立评估、网络安全和重大事故报告要求。与此同时，OpenAI正式支持四项已经通过加州议会的人工智能法案。公司称，其中部分法案此前未获其支持，此次调整立场源于近期模型能力快速提升。（新浪财经）</p>\n  <p><strong>英伟达CEO黄仁勋称网络安全将成AI下一个重大市场</strong></p>\n  <p>英伟达联合创始人兼首席执行官黄仁勋表示，网络安全将成为人工智能（AI）的下一个重大市场，AI技术的发展势将颠覆这个以保护计算机系统为主要任务的行业。“网络安全很可能会成为AI下一个主要应用场景，”黄仁勋周四在旧金山举行的高盛科技会议上对与会者表示。黄仁勋表示，AI模型实现计算机编程自动化，正给网络安全行业带来冲击，因为代码遭利用的速度越来越快，修复也须随之加快。（新浪财经）</p>\n  <p><strong>OpenAI限制Adobe及其他竞争对手在ChatGPT投放广告</strong></p>\n  <p>OpenAI已告知部分商业合作伙伴，将不再接受图像及音频生成类产品在ChatGPT内投放广告，这类产品与OpenAI自身功能构成竞争关系。这项调整此前未有相关报道，也尚未更新至其官方广告政策页面，此举令Adobe等销售同类产品的现有广告商猝不及防。倘若该政策进一步扩大适用到其他竞品，新规则或将压缩OpenAI潜在的广告收入空间。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>汉盛海装北交所IPO过会</strong></p>\n  <p>36氪获悉，北交所上市委员会召开2026年第84次审议会议。审议结果显示，汉盛（上海）海洋装备技术股份有限公司符合发行条件、上市条件和信息披露要求。</p>\n  <h2>大公司财报</h2>\n  <p><strong>合富中国：2026年1-8月合并营收4.38亿元，同比下降9.84%</strong></p>\n  <p>36氪获悉，合富中国公告，2026年1-8月累计合并营业收入为人民币4.38亿元，较2025年同期的4.86亿元下降9.84%；相较2024年同期降幅21.93%，年降幅收窄12.09%。上述数据未经会计师事务所审计或审阅。</p>\n  <p><strong>台积电8月销售额5148亿元台币，同比增长53.3％</strong></p>\n  <p>台积电8月销售额5148亿元台币，同比增长53.3％；1-8月累计销售额3.39万亿元台币，同比增长39.3％。（界面新闻）</p>\n  <p><strong>甲骨文第一财季调整后营收为193.5亿美元，超市场预期</strong></p>\n  <p>甲骨文第一财季调整后营收为193.5亿美元，市场预估为191.3亿美元；第一财季软件营收55.5亿美元，市场预期56.7亿美元；第一财季云基础设施（IAAS）营收73.9亿美元，市场预估71.9亿；预计财年调整后每股收益8.10美元；预计第二财季总营收增长30%至34%；第一财季云应用(SAAS)营收42.2亿美元，市场预估为42.6亿美元。（财联社）</p>\n  <p><strong>江南布衣：2026财年收入同比增9%至60.46亿元</strong></p>\n  <p>36氪获悉，江南布衣公布截至2026年6月30日止年度业绩，江南布衣全年收入60.46亿元，同比增长9.0%；净利润9.97亿元，同比增长11.1%；毛利率同比提高1个百分点至66.6%。其中，线上收入增长20.5%至14.48亿元，线下收入增长5.8%至45.98亿元。</p>\n  <h2>投融资</h2>\n  <p><strong>“云通数达”完成4000万元B轮融资，深耕AI交通信号控制新赛道</strong></p>\n  <p>近日，AI智慧交通企业云通数达完成4000万元B轮融资。本轮由温州湾投资、金昌投资、海纳汇聚作为新股东参投，每日互动、华旦资本等老股东继续加码。资金将用于数智绿波、车路云一体化产品迭代，推进AI信控智能体场景落地，加速技术迭代与海外市场拓展。目前数智绿波已落地国内近40个城区，落地绿波道路近900条，同时业务积极布局一带一路国家市场。</p>\n  <p><strong>“镭昱半导体”完成近亿元Pre-A4轮融资</strong></p>\n  <p>36氪获悉，近日，“镭昱半导体”（Raysolve）宣布完成近亿元Pre-A4轮融资，本轮融资由招银国际资本领投，沣途资本、某产业方跟投，木雁资本担任独家财务顾问。所融资金将主要用于技术与产品迭代、应用验证及产业合作，进一步推动镭昱在近眼显示与光互联领域的产业化进程。</p>\n  <p><strong>马斯克旗下Boring Company完成30亿美元D轮融资，估值达230亿美元</strong></p>\n  <p>据公司声明显示，马斯克旗下The Boring Company完成30亿美元D轮融资，估值达230亿美元。本轮融资由阿联酋及关联投资实体领投。本次投资将用于在阿联酋境内大规模落地地下基建项目，其中包含总长超150公里的隧道网络。本轮其他核心投资方还包括Human Capital、Vy Capital、Valor Equity Partners、红杉资本、a16z、淡马锡、Shamal Holding以及Baron Capital，同时也有大量新老投资者参与跟投。本次达成的合作协议，是在此前已中标迪拜Loop项目基础上的进一步拓展。（财联社）</p>\n  <p><strong>“星语智能”完成千万级天使轮融资</strong></p>\n  <p>近日，聚焦AI 400热线的星语智能完成千万级天使轮融资。星语通过自研端到端语音模型和跨Agent群组模型工程能力，在极短的实时交互中，同时完成语音处理与深度业务推理，让AI在保持自然响应速度的同时完成业务判断、流程服务和工单闭环。目前已在众多龙头企业规模化运行后完成率可达90%，显著降低人工坐席压力与运营成本，单日AI服务时长超过10万分钟。</p>\n  <p><strong>“大鱼智行”完成近亿元Pre-B轮融资</strong></p>\n  <p>36氪获悉，智能轻出行企业“大鱼智行”近期完成近亿元Pre-B轮融资，本轮由同鑫资本领投，多家机构跟投。融资资金将主要用于新品研发、智能化技术升级、全球品牌建设及供应链能力提升。</p>\n  <h2>酷产品</h2>\n  <p><strong>小米18 Fold 9月10日开售</strong></p>\n  <p>36氪获悉，小米18 Fold 9月10日率先开售，作为小米首款起售价过万旗舰，小米18 Fold搭载小米玄戒O3旗舰处理器、小米澎湃OS4人车家全生态操作系统、全球首发国产长鑫LPDDR6内存等亮点技术功能，较自家上代折叠屏产品销量提升300%。</p>\n  <p><strong>千问新款AI眼镜首次曝光，或加入虹膜支付能力</strong></p>\n  <p>36氪获悉，9月10日，千问新款AI眼镜疑似现身2026年外滩大会AI支付展区，该款眼镜被黑色遮蔽材料大面积包裹，暂时无法判断更多功能及硬件细节；但从展区内容来看，新品或将首次引入虹膜识别能力，通过更精准的身份匹配，进一步提升AI眼镜支付的安全性与交互便捷度。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong>折叠屏砍配置、Pro全系涨价，我发现苹果发布会上没说的才是重点。&nbsp;</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-09-11T00:05:26+00:00", "fetched_at": "2026-09-11T02:42:08.423674+00:00", "fingerprint": "fadf38a67dab79ed"}, {"source": "36氪 - 最新文章", "title": "清华博士团队切入离子阱量子计算，押注玻璃基QCCD路线，获超亿融资丨36氪首发", "url": "https://36kr.com/p/3978313800285187?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260911/v2_49472fa4d81249329024afce08dbcfc2@6221844_oswg3596132oswg1678oswg1124_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2900</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，离子阱量子计算公司维刻量光近期已完成超亿元Pre-A轮融资，由九智资本领投，正轩资本、瀚晖资本跟投。此前公司曾完成一轮天使轮融资，半年内连续完成两轮。本轮资金将主要用于产线扩大及整机建设。目前正启动新一轮融资，多维资本担任长期独家财务顾问。</p>\n  <p>维刻量光成立于今年2月，定位为离子阱路线的量子计算整机公司，核心业务包括芯片与整机、面向科研的真机算力服务，以及面向AI等场景的应用解决方案。</p>\n  <p>公司创始人欧凌峰为清华大学物理系博士在读，师从国际顶尖离子阱专家 Kihwan Kim，长期从事离子阱量子计算相关研究。公司核心团队来自清华大学、中国科学院及国内外顶尖高校，同时具备产业界经验，是国内国内最早做玻璃基QCCD技术路线团队，具备从量子芯片设计、制造到测试的全链条能力，并覆盖整机硬件控制、系统集成及应用落地。</p>\n  <p>欧凌峰向硬氪表示，目前公司芯片与整机业务相对成熟，已在实验室通过验证并开始小批量交付，应用能力仍在搭建中，公司也在考虑与软件公司展开合作。</p>\n  <p>与国内其他离子阱团队相比，维刻量光的差异化在于选择了玻璃基QCCD技术路线。欧凌峰提到，相较于硅基QCCD，玻璃基QCCD具有更强的通用性，同时芯片迭代周期更短，两周左右即可完成一轮迭代；而硅基流片周期相对更长，芯片制造耗时也更长。芯片性能决定了整机计算性能的上限，而芯片的迭代效率又直接影响整机性能演进和产品迭代的速度。</p>\n  <p>在核心技术指标方面，核心团队此前在清华大学实验室已实现由531个离子组成的稳定离子晶格，以及超过10小时的相干时间。这些长期科研积累正进一步转化为维刻量光在大规模离子囚禁、精细量子操控和QCCD整机工程化方面的技术能力。</p>\n  <p>欧凌峰解释，传统芯片此前需在低温下才能有较好性能，维刻量光通过工艺改良与芯片设计，使芯片在常温下也有非常好的性能表现，从而拓宽了离子阱量子计算机的适用范围，并降低成本。</p>\n  <p>欧凌峰认为，离子阱芯片现在已经到了工程化阶段。此前离子阱芯片依靠手工组装，无论是四级杆还是刀片阱，都是较大装置，依赖人工组装手感。现在维刻量光能做到同一设计、同一程序、同样工艺跑出来的芯片非常接近，具备“设计即所得”的能力。</p>\n  <p>具体来看，维刻量光的技术路线图是：现在做电集成的芯片，之后做光电集成的芯片，更后面做芯片之间的量子互联，往超大规模量子计算集群拓展。</p>\n  <p>欧凌峰用经典算力类比：经典计算机曾经很大，IBM、英特尔把它做小，英伟达再用板卡间互联把显卡算力扩展，相当于先变小��变大。量子芯片同样先变小再变大，光电集成是把很大体积的算力缩小，小了之后可复制，再通过量子互联扩展。公司提出从电互联到光互联到量子互联的路径。</p>\n  <p>值得注意的是，AI在维刻量光技术体系中承担全链条赋能角色。欧凌峰表示，从芯片到系统驱动再到上层编码，AI全链条赋能量子计算机。</p>\n  <p>在应用场景方面，维刻量光重点面向量子化学与材料计算、生物医药、复杂优化以及量子与人工智能融合等方向，具体覆盖新材料与高温超导材料预测、分子结构与反应过程模拟、蛋白质及小分子计算、组合优化等场景。</p>\n  <p>商业化方面，维刻量光已获得来自国内顶尖高校的订单，并正在与多家算力中心推进量子算力接入及联合算力服务框架的构建，探索将QPU作为新型异构算力单元接入现有算力基础设施。</p>\n  <p>欧凌峰判断，大模型的崛起正在重塑市场对算力价值的认知。未来，量子计算机有望成为算力基础设施的重要组成部分，与CPU、GPU协同工作，量子计算、人工智能与现有计算工作流的融合，也将进一步拓展新的算力需求和应用场景。</p>\n  <p>时间表上，他认为未来3至5年内，材料预测、量子化学和蛋白质模拟等领域有望迎来类似“AlphaGo时刻”的标志性突破；而更大规模的通用量子计算应用，例如密码分析等，可能需要7至10年。相比等待技术完全成熟，他更主张先让量子算力进入真实工作流，在应用中持续迭代硬件、软件和算法能力。</p>\n  <p><strong>以下为硬氪与公司创始人欧凌峰的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：AI在量子计算机中具体起什么作用？</strong></p>\n  <p><strong>欧凌峰：</strong>AI正在贯穿量子计算机从底层硬件到上层应用的完整链路。在芯片设计环节，公司引入AI辅助设计与参数优化；在量子态读出、系统校准和运行控制环节，通过自适应算法提升系统稳定性和自动化水平，将过去大量依赖人工经验的调试过程逐步转化为智能化闭环；在更上层，用户可以通过自然语言描述计算需求，由AI进一步完成任务解析、量子线路生成、编译并下发至量子计算系统执行。总体而言，AI正从芯片设计、量子操控、系统运行到应用交互，对量子计算全栈进行赋能。</p>\n  <p><strong>硬氪：投资人目前比较关心哪些维度？对商业化进度有硬性要求吗？</strong></p>\n  <p><strong>欧凌峰：</strong>投资人主要看两方面：一是团队技术是否与要做的事情匹配，即人和事是否匹配；二是团队是否具备商业化意识，能否为客户考虑，这跟科研会稍微有些不一样。要求目前没有，因为这个领域还比较初期，技术路线时常会有改变，有时会与原先设想有偏差，投资人目前也比较理解。</p>\n  <p><strong>硬氪：接下来的挑战主要在哪里？</strong></p>\n  <p><strong>欧凌峰：</strong>挑战主要还是来自技术和商业化两方面。技术上，量子计算还处在比较早期的阶段，怎么和AI结合，真正找到有经济价值、能落地的场景，还需要持续验证。</p>\n  <p>商业化上，这件事也不是产品方单方面把东西做好就够了，也希望需求方愿意开放一些真实场景，大家一起往前走。现在很多应用在原型机上跑起来没有太大问题，但真正有价值的是把需求、算法、真机算力到最终应用这一整套链路跑通。我们也在和一些场景方一起尝试，希望他们愿意更早一点参与进来，把整套工作流真正用起来，而不是等所有东西都完全成熟了以后再接入。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>九智资本：</strong>量子计算正处于从基础研究走向工程化突破的关键阶段，离子阱路线凭借高保真度、长相干时间和全连接操控等优势，展现出通往容错量子计算的重要潜力。维刻量光源自国际顶尖的金奇奂教授团队，兼具深厚的科研积累与突出的工程化能力，是国内稀缺的在QCCD架构具备系统布局的团队，已取得具有国际竞争力的成果。我们看好团队持续攻克底层核心技术、推动离子阱量子计算规模化发展的能力，也期待陪伴维刻量光成长为具有全球竞争力的量子计算平台企业。</p>\n  <p><strong>正轩投资：</strong>量子计算是有别于经典计算的全新计算范式，有望成为AI时代全新的算力底座。以QCCD路线为代表的离子阱量子计算是目前公认量子比特质量最高、最具通用容错计算潜力的路线之一。维刻量光团队脱胎自全球知名的离子阱量子计算实验室，年轻且富有创新力，公司独特的石英基QCCD方案开辟了离子阱量子计算中一条全新的道路，极具应用前景。正轩投资持续看好量子产业，未来会长期携手维刻量光，将量子计算推向全面产业化、通用化。</p>\n  <p><strong>瀚晖资本：</strong>量子计算正逐步从物理原理验证走向系统工程与容错能力竞争，未来真正决定产业格局的，将不再只是物理比特数量，而是高保真操控、逻辑比特效率以及规模化系统能力的综合表现。离子阱路线凭借高门保真度、长相干时间和灵活的全连接能力，在实现高质量逻辑比特和容错量子计算方面具备突出潜力。维刻量光脱胎于国际顶尖的金奇奂教授团队，在离子阱量子控制、芯片架构及系统工程方面具备长期技术积累，并围绕QCCD架构形成了较为完整的技术布局。我们看好团队将领先科研能力持续转化为工程化和规模化能力，在离子阱量子计算由“高质量物理比特”迈向“高价值逻辑比特”的关键阶段建立核心壁垒，并成长为具备全球竞争力的量子计算平台企业。</p>", "category": "tech", "published_at": "2026-09-11T01:10:19+00:00", "fetched_at": "2026-09-11T02:42:08.423665+00:00", "fingerprint": "0554602a83d4f2fc"}, {"source": "36氪 - 最新文章", "title": "上光所孵化太空光伏企业完成近亿元融资，钧达股份、上海未来产业基金等押注｜36氪首发", "url": "https://36kr.com/p/3974257096159747?f=rss", "summary": "<p>作者｜乔钰杰</p>\n  <p>编辑｜袁斯来</p>\n  <blockquote>\n   <p>本文2600字，预计阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，太空光伏电池与核定材料企业「上海星翼芯能科技有限公司」（以下简称“上翼”）近日完成Pre-A轮战略融资。本轮由钧达股份、上海未来产业基金、临港蓝湾资本、南浔陆遥、新阳半导体联合创始人相关产业投资人共同参投，老股东中科神光持续加码。资金将主要用于技术迭代、空间环境试验及卫星在轨验证，加速太空钙钛矿光伏电池与太空级CPI柔性封装衬底材料的商业化落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_c3bd166e934c4ecfa5a4f0b5db1fd438@5920579_oswg2241430oswg2142oswg914_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>上海星翼芯能科技有限公司成立于2026年1月，核心研发与创始团队源自中科院上海光机所科研体系，团队成员覆盖航天光电材料、钙钛矿光电器件、CPI功能薄膜、宇航级可靠性验证等多个方向，具备从底层材料与器件工艺研发、空间环境适配，到在轨实测验证及商业航天工程落地的完整能力。</p>\n  <p>行业预测，到2031年，全球低轨在轨卫星规模有望突破30万颗。随着低轨宽带通信、高分辨率遥感、空间计算平台等航天器持续批量发射，传统刚性太阳翼面密度普遍达到20至30千克/千瓦，重量占整星重量的比例可达35%至40%，正越来越难以适配新一代卫星轻量化、小型化和高载荷比的需求。</p>\n  <p>在这一背景下，柔性可卷收太阳翼正在快速发展。同等发电面积下，柔性太阳翼的收纳体积相比刚性方案可缩减60%以上，能质比也能够实现大幅提升。</p>\n  <p><strong>当前，空间光伏技术主要沿两条路线演进。一条是封装材料升级路线，即以CPI柔性聚酰亚胺封装薄膜替代传统铈玻璃盖板。</strong>相比玻璃封装，CPI可进一步减重40%以上，弯曲半径可做到≤5毫米，能够显著降低太阳翼面密度、缩减收纳体积，更适合卷收式柔性结构，同时可以兼容钙钛矿、晶硅等多种电池技术路线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_f1ff91a1570a44808dcbb73b7be9b563@5920579_oswg914027oswg1154oswg695_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">上翼SCPI封装材料（图源/企业）</p>\n  <p><strong>另一条则是电池材料迭代路线。</strong>钙钛矿电池单结理论效率可达33.7%，有望突破传统硅基电池的效率上限，同时具备较好的弱光响应特性，模组能质比可达到传统硅基方案的数倍，在轻量化、轻薄化方面具备天然优势。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_dc91aefb39374955b14edf3c9fe48059@5920579_oswg960681oswg1266oswg844_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">上翼轻柔单结钙钛矿电池模组（图源/企业）</p>\n  <p><strong>上翼则两条技术路线进一步融合，采用太空级CPI（SCPI）柔性衬底、面向太空进行钙钛矿电池研发，构建下一代柔性太阳翼解决方案。</strong></p>\n  <p>在钙钛矿电池端，太空环境面临热冲击、质子辐射、原子氧、真空紫外等极端条件，需要针对材料配方、电池结构和制备工艺进行专门适配。上翼围绕太空应用进行了钙钛矿吸收层组分优化、界面缺陷钝化、离子迁移抑制等本征稳定性改造，并将宇航级环境模拟考核前置到研发阶段。模拟数据显示，产品在-120℃至120℃范围内完成4000次热冲击循环后，电池效率保持率可维持在90%以上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_877f7b0637c140079fa28e890d3479ff@5920579_oswg967774oswg1134oswg673_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">上翼激光划线操作台（图源/企业）</p>\n  <p><strong>CPI材料端，上翼是国内为数不多掌握太空级CPI材料技术的企业之一。据公司介绍，其相关技术水平可对标美国同类产品，并已掌握从材料配方到制备的完整工艺流程。</strong>相比传统铈玻璃封装体系，上翼的CPI方案可将太阳翼面密度降低40%至55%；在低轨轨道工况下，可帮助单星综合发射成本下降约15%至20%。&nbsp;</p>\n  <p>目前，上翼已完成多轮样品研制及地面空间环境模拟测试，并与钧达股份的合资公司捷泰航天完成CPI薄膜在轨验证，相关在轨数据验证项目已经立项。</p>\n  <p>今年10月，上翼计划搭载紫微飞船完成钙钛矿柔性光伏太空在轨验证，进一步核验产品在复杂空间环境下的适配性与稳定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260908/v2_ff484ded1c7f48a6b1e3b2648e5ba25d@5920579_oswg250050oswg605oswg310_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">上翼与钧达股份的合资公司捷泰航天航天级CPI产线规划（图源/企业）</p>\n  <p><strong>商业化方面，上翼作为上海“星枢计划”算力星座重要的太空光伏成员单位，目前正持续提升样品交付能力，面向商业卫星制造商、卫星平台企业提供标准化柔性光伏组件及一体化太阳翼解决方案，并同步推进全球化布局。</strong></p>\n  <p>以下为硬氪与上翼CEO吴正宇交流节选：</p>\n  <p><strong>硬氪：钙钛矿进入太空面临哪些技术难点？地面阶段常见的大面积良率问题，是否也会影响其在太空中的应用？</strong></p>\n  <p>吴正宇：太空环境和地面环境完全不同。钙钛矿在轨运行需要面对热冲击、质子辐照、真空紫外、原子氧等多种极端条件，因此真正应用于太空之前，必须先在地面完成空间环境模拟和适配，包括配方优化、电池结构重新设计以及生产工艺调整。</p>\n  <p>在此基础上，还需要进一步开展真实的在轨搭载验证。验证主要分两个层面：一是看材料自身能否承受空间环境，二是从工程角度验证其能否真正进入卫星供电系统，评估实际发电收益和寿命表现。</p>\n  <p>在太空高温和高电压条件下，系统更倾向于采用高电压、低电流的设计思路。为降低串联电流，我们会主动控制钙钛矿电池的面积，避免过大尺寸带来的电流上升。例如，将电池规格定为5厘米×5厘米，而不是平米级别。<strong>这一尺寸选择使我们能够采用一些在地面大规模生产中因成本过高而难以承担的设备与工艺，用以显著提升良率。</strong>此前在商业上不具备性价比的高端制备手段，在太空高价值应用场景下可能反而具备可行性和明显优势。</p>\n  <p><strong>硬氪：将CPI用于钙钛矿电池防护时，面临哪些技术问题？上翼如何解决？</strong></p>\n  <p>吴正宇：我们是全球范围内较早探索在CPI柔性衬底上进行钙钛矿电池制备与防护开发的企业。之所以选择这条路线，是因为我们判断，轻、薄、柔性化、大面积的太阳翼将成为未来太空光伏的重要形态。相较于传统铝蜂窝板结构的刚性小型太阳翼，如果未来要进一步扩大太阳翼面积，就必须依赖更加轻量化、可卷曲的电池材料。</p>\n  <p>CPI本身是一个非常庞大的材料体系，配方组合达到上千种。团队需要对这些候选材料进行系统筛选和深入研究，甚至进行自主创新，最终找到或者开发出真正适用于空间环境的CPI产品。它需要重点满足抗紫外辐射、抗原子氧侵蚀、抗质子辐照以及耐热冲击等要求。</p>\n  <p>与此同时，CPI配套的镀层、胶粘剂、拉伸成膜工艺，以及CPI与钙钛矿层之间的界面适配，同样是关键环节。这些问题都需要在工艺开发和实际在轨验证过程中不断优化。目前，行业内还没有形成成熟的CPI基钙钛矿电池在轨应用方案，因此我们也需要通过持续的在轨验证来推动技术迭代。</p>\n  <p><strong>硬氪：CPI结合钙钛矿的在轨验证节奏是如何规划的？</strong></p>\n  <p>吴正宇：我们的策略是“小步快走”，分阶段推进。第一期验证已经于今年5月通过“天眼27号”任务完成，重点考察CPI薄膜单独处于太空环境中的耐受能力和保护特性。目前，我们已经获得了长达三个月的稳定数据，并通过公开渠道发布。这也是我们针对CPI材料空间独立服役性能开展的一次系统验证。</p>\n  <p>第二阶段，我们将进一步验证CPI薄膜对钙钛矿吸光层的实际保护效果，相关搭载计划安排在紫微B300飞船上，目前正在等待发射窗口。</p>\n  <p>第三阶段计划在年底前开展CPI钙钛矿电池与柔性太阳翼整体结构的综合在轨验证，逐步实现从材料、器件到系统的全链条空间验证。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-11T02:32:05+00:00", "fetched_at": "2026-09-11T02:42:08.423651+00:00", "fingerprint": "d043f1c7c381c986"}, {"source": "少数派", "title": "App+1｜下一节：教学工作紧张忙碌，下一节课从从容容", "url": "https://sspai.com/post/114384", "summary": "祝每一位老师教师节快乐！<a href=\"https://sspai.com/post/114384\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-10T06:51:52+00:00", "fetched_at": "2026-09-11T02:42:06.928449+00:00", "fingerprint": "68782a667834e577"}, {"source": "少数派", "title": "派早报：商务部回应美国 AI 蒸馏指控", "url": "https://sspai.com/post/114439", "summary": "<p>商务部回应美国 AI 蒸馏指控</p><p>谷歌声称为了合规将「降级」欧盟搜索服务</p><p>Apple 智能将有用量限制</p><p>OpenAI 将与三星合作开发芯片</p><p>小岛秀夫新游戏被索尼取消，转由微软发行</p><p>DeepSeek V4.1 发布</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/114439\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-10T22:58:54+00:00", "fetched_at": "2026-09-11T02:42:06.928437+00:00", "fingerprint": "0ce6325ff041a2bd"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.8185 CNY ↓-0.57%", "url": "https://www.frankfurter.app/2026-09-10?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-09-10</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.8185 CNY</b> <span style=\"color:#5cb85c;font-size:14px;\">↓ -0.0277 (-0.57%) 贬值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-09-11T02:42:05.874517+00:00", "fingerprint": "fe9b42759631fb0e"}, {"source": "The Guardian - World", "title": "Babies born to anaemic mothers have smaller brains, study finds", "url": "https://www.theguardian.com/global-development/2026/sep/09/babies-born-to-anaemic-mothers-have-smaller-brains-study-finds", "summary": "<p>Key regions of the brain linked to movement, learning and emotions were affected and may lead to cognitive problems </p><p>Babies born to mothers with anaemia have smaller brains, particularly in key regions linked to movement, learning and the regulation of emotion, according to a study.</p><p>Researchers said the differences, first detected at the age of one, could lead to cognitive problems when children started school.</p> <a href=\"https://www.theguardian.com/global-development/2026/sep/09/babies-born-to-anaemic-mothers-have-smaller-brains-study-finds\">Continue reading...</a>", "category": "politics", "published_at": "2026-09-09T04:00:58+00:00", "fetched_at": "2026-09-10T02:48:52.745378+00:00", "fingerprint": "c583a4df43bf04a3"}, {"source": "The Guardian - World", "title": "Uganda to withdraw from Invictus Games ‘out of respect for King Charles’, says military chief", "url": "https://www.theguardian.com/world/2026/sep/09/uganda-withdraws-invictus-games-out-of-respect-king-charles", "summary": "<p>Gen Muhoozi Kainerugaba announces decision to pull out in post on X, citing tensions over ‘Harry-Meghan nons
