the construction of data centers to power AI tech, 61 percent of the 1,503 likely voters surveyed [&#8230;]", "category": "tech", "published_at": "2026-09-15T23:34:25+00:00", "fetched_at": "2026-09-16T03:02:56.313682+00:00", "fingerprint": "30fb04a6f530a157"}, {"source": "The Verge", "title": "The EOS R8 Mark II is Canon’s lightest full-frame camera with stabilization", "url": "https://www.theverge.com/tech/995430/canon-eos-r8-mark-11-full-frame-digital-camera-pricing-availability", "summary": "Canon announced the second-generation of its EOS R8 with a new retro-inspired redesign and the addition of in-body stabilization. That feature was one of the most notable omissions from the original R8 that launched in 2023 as a smaller, cheaper, and more accessible alternative to the Canon R6 Mark II for photographers wanting a larger [&#8230;]", "category": "tech", "published_at": "2026-09-16T01:00:00+00:00", "fetched_at": "2026-09-16T03:02:56.313678+00:00", "fingerprint": "ad14c70e6cfe15ef"}, {"source": "The Verge", "title": "The Boox Palma 3 gets stylus support and a sleek redesign", "url": "https://www.theverge.com/tech/995826/boox-palma-3-e-ink-reader-pocket-smartphone-android-16", "summary": "Nearly two years after the last update to Boox's smartphone-sized black-and-white e-reader, the company announced the Palma 3 with a sleek redesign, new functionality, and a handful of other small updates that may justify its significant price bump depending on how you plan to use it. While the Palma 2 launched in 2024 for $279.99, [&#8230;]", "category": "tech", "published_at": "2026-09-16T02:00:00+00:00", "fetched_at": "2026-09-16T03:02:56.313670+00:00", "fingerprint": "9eb0d471849191eb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨8月一线城市房价上涨；携程上架510万一张的太空旅行船票；字节跳动上半年净利润出现下滑，但海外收入占比再创新高", "url": "https://36kr.com/p/3985321952115717?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>交易员：美联储在本周会议上加息的可能性高达92%</p>\n  <p>比尔·盖茨呼吁推动人工智能公平，盖茨基金会承诺投入10亿美元</p>\n  <p>微信辟谣AI助手小微“直接读取聊天记录”“偷看隐私”</p>\n  <p>野人先生创始人曾称“是我们把行业价格打下来了”</p>\n  <p>银河证券：厄尔尼诺对有色金属多为局部短期扰动</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>国家统计局数据显示，8月一线城市房价上涨</strong></p>\n  <p>9月15日，国家统计局发布数据，2026年8月份，70个大中城市中，一线城市商品住宅销售价格环比上涨，二三线城市环比降幅总体收窄，一二三线城市同比降幅继续收窄。</p>\n  <p>具体来看，8月份，一线城市新建商品住宅销售价格环比由上月持平转为上涨0.1%。其中，上海、广州和深圳分别上涨0.4%、0.1%和0.2%，北京下降0.2%。二线城市新建商品住宅销售价格环比下降0.1%，降幅与上月相同。三线城市新建商品住宅销售价格环比下降0.2%，降幅比上月收窄0.1个百分点。（中新经纬）</p>\n  <p><strong>携程上架510万一张的太空旅行船票，已售681份</strong></p>\n  <p>近日，携程上架了2027年维珍银河太空旅行船票，510万一张。这也是目前国内公开渠道售价最贵的太空游产品，已售出681份。整个行程一共6天，出发地在美国新墨西哥州的拉斯克鲁塞斯。第一步不是上天，而是先自己坐飞机到美国，签证费用、机票费用自己出，不包含在510万内。510万不是买张票就完事，前4天都在学习怎么离开地球，第5天才正式发射。</p>\n  <p>维珍银河上一代VSSUnity飞船在2024年6月完成最后一次商业飞行后退役。目前公司正在推进新一代Delta级飞船，原计划在2026年底恢复商业飞行，最新时间已经推迟到2027年2月，第二艘Delta飞船预计在2027年3月抵达美国太空港。（都市快报）</p>\n  <p><strong>字节跳动上半年净利润出现下滑，但海外收入占比再创新高</strong></p>\n  <p>9月15日消息，据知情人士，由于加大了在人工智能领域的投资，字节跳动2026年上半年净利润同比出现下降。同时，受TikTok等海外业务推动，字节跳动上半年营收同比增长30%，海外收入占比再创新高。字节跳动未对以上数据置评。知情人士称，尽管抖音仍贡献了字节跳动的大部分收入，但主要来自TikTok的海外收入已占总营收的30%以上。TikTok为主的海外业务在字节跳动整体营收中的占比正稳步提升，2024年为25%，2025年海外收入占比为30%，2026年上半年继续上升。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>比尔·盖茨呼吁推动人工智能公平，盖茨基金会承诺投入10亿美元</strong></p>\n  <p>盖茨基金会计划在未来两年内投入至少10亿美元以提高人工智能的可及性。基金会联合创始人比尔·盖茨警告称，人工智能的普及方式可能会进一步扩大全球贫富鸿沟。盖茨表示，这笔资金将用于为教育、医疗和农业领域从业者开发工具，同时支持将非英语语言资料纳入大型数据集，以满足使用其他语言的开发者需求。盖茨基金会计划在2045年彻底关闭前累计捐出2000亿美元。（财联社）</p>\n  <p><strong>OpenAI支持美国国会两党AI安全法案，首次赞成强制引入第三方安全评估</strong></p>\n  <p>9月15日，据报道，OpenAI支持美国众议院的安全评估方案，该条款要求领先AI公司允许独立第三方评估机构进入企业，对先进模型的开发和安全措施进行审查。（财联社）</p>\n  <p><strong>微软首席执行官纳德拉向员工发布有关人工智能安全的内部警示</strong></p>\n  <p>微软首席执行官萨蒂亚·纳德拉（Satya Nadella）在微软内部留言板上发表了一份备忘录，强调人工智能（AI）必须保持在人类控制之下，并对更广泛的第三方安全测试表示支持。这份在周一晚些时候发布的内部备忘录中，纳德拉警告业界，随着AI技术的风险日益增加，企业必须花费足够的时间来确保技术安全。他写道：“当赌注越来越高时，人们应该花费所有需要的时间。否则，你无论如何都会失去运营许可。”此番言论正值科技界对超级智能与AI安全展开激烈辩论之际。（新浪财经）</p>\n  <p><strong>智象发布首款物理规律导向视频模型</strong></p>\n  <p>36氪获悉，智象未来（HiDream.ai）正式发布首个原生全模态视频生成模型HiDream-O1-Video-1.0（模型简称HD-V1）。HD-V1采用智象自研原生全模态架构，支持文本、图片、视频等多种模态输入，可一键直出5–20秒1080p高保真视频，同时在意图理解、物理规律理解、自主规划叙事、以及音画一体化生成等维度均全面升级。</p>\n  <p><strong>阶跃发布语音大模型StepAudio 3系列</strong></p>\n  <p>36氪获悉，9月15日，阶跃发布新一代语音大模型StepAudio 3系列，一次性推出StepAudio 3 Realtime、StepAudio 3 ASR、StepAudio 3 TTS、StepAudio 3 Gen 和 StepAudio 3 Music五款模型，覆盖实时语音交互、语音识别、真人级语音生成和音乐创作等场景。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>交易员：美联储在本周会议上加息的可能性高达92%</strong></p>\n  <p>市场普遍预计，美联储将在本周议息会议上进行三年多来的首次加息。但仍有一些经济学家呼吁央行暂缓加息，因为他们担心经济表面强劲之下可能存在脆弱性，加息可能是个错误决定。穆迪首席经济学家马克·赞迪在社交媒体平台上发表的一篇文章中警告说：“美联储犯下严重政策错误的概率高得令人不安，而且还在上升。”</p>\n  <p>交易员认为，由凯文·沃什领导的美联储在本周会议上加息的可能性高达92%。8月下旬，美联储主席凯文·沃什在杰克逊霍尔经济研讨会上发表讲话，暗示他对通胀趋势感到担忧。他表示，如果通胀形势恶化，他将毫不犹豫地采取行动。十天前，投资者还认为加息的可能性只有50%。但柴油价格上涨、中东局势再度紧张以及上周五公布的消费者通胀报告高于预期，都让交易员和经济学家相信，沃什会兑现他的强硬承诺，提高利率。（财联社）</p>\n  <p><strong>宁德时代股价大跌，单日市值蒸发914亿元</strong></p>\n  <p>9月15日午后，宁德时代股价突然大幅跳水，大跌超过6%，股价最低报316元/股，创1年以来新低，截至收盘宁德时代报316.36元/股，下跌6.16%，单日市值蒸发914亿元。从2026年5月7日创出的历史高点累计下跌超32%，A+H股总市值跌破1.5万亿元。（金融界）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下挫</strong></p>\n  <p>36氪获悉，9月15日收盘，美股三大指数集体下跌，道指跌0.63%，纳指跌0.78%，标普500跌0.45%；大型科技股多数下挫，SpaceX跌超3%，亚马逊跌超2%，微软、谷歌跌超1%，特斯拉跌0.67%，苹果跌0.52%，Meta涨0.7%，英伟达涨0.57%；热门中概股跌多涨少，小鹏集团跌超4%，理想汽车跌超3%，蔚来、哔哩哔哩、百度、拼多多跌超1%，京东跌0.62%，网易涨超1%，阿里巴巴涨0.1%。</p>\n  <p><strong>美光演示全球首个在多服务器平台上的512GB DDR5模块</strong></p>\n  <p>9月15日，美光演示全球首款512GB DDR5 RDIMM内存模块，预计2027年下半年实现量产。Micron 512GB RDIMM的性能可比256GB DDR5配置高达1.4倍。AMD和英特尔都在积极验证该模块，预计其速度将达到9200 MT/s。（财联社）</p>\n  <p><strong>微信辟谣AI助手小微“直接读取聊天记录”“偷看隐私”</strong></p>\n  <p>36氪获悉，9月15日，微信员工客村小蒋就“微信小微”涉及的隐私相关问题发文回应：1、小微能接触的信息，不会超过你本人可以查看的信息范围的权限，比如有朋友担心已删除的朋友圈会不会被看到，放心，不会的；2、小微会基于公众号、视频号等的关注、浏览、互动数据，做一些问题的推荐，放心，这里同样遵循原则1；3、关于聊天记录，只有在聊天场景，你主动发起“问小微”的时候，小微才会被临时调起，从微信客户端本地读取最近的聊天信息，分析总结之后，原始聊天记录不会被保存，通用的“用完即弃”的逻辑；4、一些说小微“直接读取聊天记录”、“偷看所有隐私”的帖子，都是失实的。据介绍，微信小微是微信团队开发的原生AI助手，目前正在小范围内测。用户可以通过文字或语音对话，让小微查天气、查快递、点外卖；另外，在朋友圈、公众号、聊天、视频号等场景，小微也可以在需要的时候被随时唤起，来总结内容、提供更多信息等。</p>\n  <p><strong>凯撒旅业：全资孙公司遭合同诈骗2695万元，已向公安机关报案并获立案侦查</strong></p>\n  <p>36氪获悉，凯撒旅业公告，公司全资孙公司凯撒文产与合同相对方签署演艺服务合同，按约支付2695万元款项后无法与对方取得有效联系，怀疑对方涉嫌合同诈骗，已向公安机关报案并获立案侦查。该事项尚处侦查阶段，或对本期及期后利润造成不利影响，公司已开展内部专项核查并配合调查，全力挽回损失。</p>\n  <p><strong>鸿蒙智行：问界将由赛力斯主导，华为终端参与赋能，用户既有权益及后续服务不受影响</strong></p>\n  <p>36氪获悉，鸿蒙智行发布《鸿蒙智行关于问界合作模式的说明》，回应华为与赛力斯合作模式变化一事。声明称，问界仍然是鸿蒙智行大家庭的成员之一。即日起，问界将在鸿蒙智行合作框架下探索新合作模式：产品定义、产品设计、品牌营销、渠道零售、服务体系由赛力斯主导，华为终端参与赋能。所有问界用户的既有权益及后续服务不受影响。另外，此次调整不涉及鸿蒙智行其他品牌，尊界、享界、智界、尚界仍然采用华为全流程主导的合作模式。</p>\n  <p><strong>苹果接受三星明年一季度存储报价</strong></p>\n  <p>从产业链获悉，苹果已接受三星电子2027年一季度存储芯片报价：DRAM（动态随机存取存储器）接近2.0美元/Gb，NAND闪存接近0.33美元/Gb，较今年三季度报价上涨30%-40%。就此消息向苹果求证，截至发稿暂无回应。（界面新闻）</p>\n  <p><strong>电子信息制造业发展“十五五”规划发布</strong></p>\n  <p>工业和信息化部、国家发展改革委近日联合印发《电子信息制造业发展“十五五”规划》。规划提出，到2030年，我国电子信息制造业高质量发展取得显著成效，在全球产业格局中发挥举足轻重作用。电子信息制造业在工业中的重要地位进一步凸显，规模以上企业营业收入突破30万亿元。在集成电路、先进计算、消费电子、基础电子、能源电子等领域涌现一批长板技术和产品。产业创新效能明显提升，研发投入强度达到3.5%，算力供给能力大幅增长，新一代智能终端应用普及率显著提升。（新华社）</p>\n  <p><strong>平台月付将退出支付选项</strong></p>\n  <p>9月30日起，花呗、白条等各平台月付，将退出支付选项，不再和银行账户、余额等自有支付方式并列展示在付款页面。非银行支付机构，不得将贷款、资产管理产品等金融产品，列入支付工具选项。（央视网）</p>\n  <p><strong>广汽拟购买一汽合资公司股权</strong></p>\n  <p>有关一汽与广汽的传闻终于靴子落地。9月14日晚间，广汽集团发布公告称，其与中国第一汽车股份有限公司（以下简称一汽股份）签署《意向协议》，筹划以发行股份方式购买一汽股份持有的某整车合资公司部分股权，并募集配套资金。</p>\n  <p>此外，广汽方面还表示，因筹划发行股份购买资产并募集配套资金事项，广汽集团A股自2026年9月15日起停牌，预计停牌不超过10个交易日，后续将披露经董事会审议的重组预案后申请复牌。当前，一汽已通过资本合作将零跑汽车销量纳入自身的销量统计。（每日经济新闻）</p>\n  <p><strong>野人先生创始人曾称“是我们把行业价格打下来了”</strong></p>\n  <p>9月12日，罗永浩在社交媒体上发文称，在机场试了“暴得大名”的野人先生，感觉“很一般”，并直言“考虑到价格，甚至可以说难吃”。随后，他又补了一句：“感觉比钟薛高难吃多了，怀念钟薛高。”截至发稿前，野人先生官方尚未公开回应。</p>\n  <p>而此前，面对“价格贵”的质疑时，野人先生创始人崔渐则称：“是我们把行业价格打下来了。”他的计算方式是：传统Gelato行业里，一个球通常约80克，售价30元—40元；野人先生一份约130克，售价28元。也就是说，不能只看一份冰淇淋卖多少钱，还应该看每克多少钱。（消费者报道）</p>\n  <p><strong>美国30年期国债收益率突破5.40%，创2007年以来新高</strong></p>\n  <p>美国30年期国债收益率持续上行，盘中最高升至5.40%关口，创2007年6月以来新高。随着长期美债收益率持续走高，市场对美国通胀、财政赤字及长期融资成本上升的担忧有所升温。（财联社）</p>\n  <p><strong>消息称三星电子调整定制HBM基础芯片供应链，或推行“双轨”战略</strong></p>\n  <p>据业内人士消息称，在定制化高带宽内存时代，三星电子为其高带宽内存（HBM）提供基础芯片的战略预计将发生重大变化。该司将不再依赖其现有的内部代工厂进行自主生产，而是采取“双轨制程”战略，即同时采用基于台积电工艺的基础芯片。从今年开始量产HBM4开始，三星电子和SK海力士已开始采用代工工艺而非传统的DRAM工艺来制造基片。与DRAM工艺相比，代工工艺的优势在于能够将更多功能集成到基片中，从而提升性能和能效。（新浪财经）</p>\n  <p><strong>Blykalla与微软达成人工智能合作协议</strong></p>\n  <p>9月15日，一份声明显示，瑞典核技术公司Blykalla与微软签署协议，将运用人工智能技术解决许可和授权等行业瓶颈问题。（新浪财经）</p>\n  <p><strong>美国联邦航空局敷衍应对建议，未解决安全隐患</strong></p>\n  <p>美国国家运输安全委员会14日表示，2025年1月华盛顿附近发生重大空难后，该委员会提出了33项建议，而联邦航空局对其中11项建议的回应“不可接受”。其中之一包括，美国联邦航空局尚未同意强制安装一项关键安全系统。国家运输安全委员会主席霍门迪及部分遇难者家属15日将再次敦促国会立法，从根源上解决这起空难暴露出的问题。（央视新闻）</p>\n  <p><strong>英国央行据悉将改革国债出售计划</strong></p>\n  <p>据报道，英国央行将改革国债出售计划，以应对债券市场动荡，根据计划，英国央行将停止出售20年和30年期国债。（财联社）</p>\n  <p><strong>字节跳动CEO梁汝波：豆包、飞书与火山引擎整合后，将加大企业市场投入</strong></p>\n  <p>36氪获悉，9月15日，2026飞书未来无限大会在京举办，字节跳动CEO梁汝波在会上进行了分享。他表示，在Agent进入可用阶段后，Agent、模型、协作环境三者必须紧密融合，才能真正发挥价值。正是基于这一判断，字节跳动将豆包、飞书、火山引擎的力量整合到一起，聚焦打造优质的工作与生产力产品；公司会投入更多的资源和力量，让智能更快地在企业组织里产生价值。</p>\n  <p><strong>刘强东名下游艇公司入股天行者游艇</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，福建天行者游艇有限公司发生工商变更，新增刘强东创立的游艇独立品牌Sea Expandary关联公司深圳市探海游艇产业发展有限公司为股东。福建天行者游艇有限公司成立于2022年12月，法定代表人为江祖光，注册资本1000万人民币，经营范围包括船舶制造、船舶设计、船用配套设备制造等，现由江祖光、浙江富启享煜科技有限公司及上述新增股东共同持股。据媒体报道，此前，刘强东个人投资的游艇品牌Sea Expandary已完成对天行者游艇（OceanWalker）80%股权收购交割。</p>\n  <p><strong>共享单车服务规范新国标发布</strong></p>\n  <p>市场监管总局近日批准发布《租赁自行车交通服务规范 第2部分：互联网租赁自行车》国家标准，对互联网租赁自行车运营服务全流程进行规范，引领运营企业不断优化服务，提升用户体验。新标准将于今年11月实施。（央视新闻）</p>\n  <p><strong>银河证券：厄尔尼诺对有色金属多为局部短期扰动</strong></p>\n  <p>36氪获悉，银河证券研报称，2026年5月赤道中东太平洋进入厄尔尼诺状态，预计11—12月达到峰值并于2027年春夏逐步衰减。气候呈现南美西海岸多雨、东南亚偏旱、南部非洲干旱的特征。目前尚未出现天气引发的大规模矿山停产。厄尔尼诺对有色金属来说，多为局部短期扰动，更像是供需矛盾放大器，并非行情决定性因素。</p>\n  <p><strong>Waymo计划于2027年在东京推出自动驾驶网约车服务</strong></p>\n  <p>当地时间9月14日，Waymo在官网博客发文称，公司已与日本交通（Nihon Kotsu）和GO已达成协议，共同筹备于2027年在东京推出无人驾驶网约车服务。Waymo表示，时间表取决于能否获得国家和地方当局的监管批准，以及完成对Waymo技术和联合运营的持续验证。该服务将可通过GO和Waymo两款应用使用，初期先以一定规模的车队启动，随后逐步扩展至约100辆车，覆盖东京主要街区。（界面新闻）</p>\n  <p><strong>超大型飞机黄金时代进入倒计时，澳洲航空将提前退役全部空客A380</strong></p>\n  <p>澳洲航空集团近日官宣，将自2028年起逐步退役全部10架空客A380客机，较原计划提前约四年。多家媒体分析评论称，这不是简单的机队调整，而是整个航空业对“大飞机时代”的一次集体告别。预计2028至2031财年可节省约3亿澳元（约合14.3亿元人民币）的净现金流。A380于2007年首航，因高油耗、高维护成本、客源不足，2021年停产。未来几年也许仍能看到A380的身影，但属于超大型飞机的黄金时代已经进入倒计时。（央视财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>Authentic Brands计划最早于2026年上半年进行首次公开募股</strong></p>\n  <p>拥有猫王肖像权、锐步运动品牌等多项授权业务的Authentic Brands集团，最早或于明年上半年推进首次公开募股。公司首席执行官马修・马多克斯周一在采访中表示：“公司已经做好准备。我们的体系、团���均已就位，故事逻辑清晰，蓄势待发。”马多克斯介绍，Authentic营收22亿美元，息税折旧摊销前利润达18亿美元，利润率高达81%。国际市场贡献约35%的营收。（新浪财经）</p>\n  <p><strong>软银旗下SB Energy计划在日本IPO中筹集最多5亿美元</strong></p>\n  <p>据报道，一份向日本财务省提交的文件显示，软银旗下数据中心及能源基础设施公司SB Energy将通过在日本的股票发售筹集最多5亿美元，作为其计划在美国进行IPO的一部分。瑞穗证券、大和证券、PayPay证券、乐天证券和SBI证券将负责相关交易。（财联社）</p>\n  <p><strong>先正达据悉以保密方式提交香港IPO申请，拟融资50亿美元</strong></p>\n  <p>先正达据悉以保密方式提交香港IPO申请，拟融资50亿美元。（财联社）</p>\n  <p><strong>天承科技：筹划发行H股并在香港联交所上市</strong></p>\n  <p>36氪获悉，天承科技公告，公司为实施全球化战略，正在筹划发行境外上市股份（H股）并在香港联交所挂牌上市。目前相关细节尚未确定，本次发行不会导致实际控制人变化，尚需提交董事会和股东会审议，并需经证监会、香港联交所等监管机构备案或审核批准，最终能否实施存在不确定性。</p>\n  <h2>投融资</h2>\n  <p><strong>“康微视觉”完成近亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“康微视觉”近日已完成近亿元Pre-A轮融资。本轮由南京精智达清源投资基金领投，川商基金及老股东清源资本跟投，投中资本担任独家财务顾问。资金将主要用于扩充研发与运营团队、扩大产能以应对爆发式订单增长，以及下一代产品与技术平台的研发。</p>\n  <p><strong>美国军用无人机与AI软件初创公司Shield AI洽谈新一轮融资，估值或达200亿美元</strong></p>\n  <p>据知情人士透露，军用无人机与AI软件初创公司Shield AI正在洽谈新一轮融资，估值至少达到200亿美元。如果本轮融资顺利完成，该公司的估值将较五个月前上涨约60%。（新浪财经）</p>\n  <p><strong>具身智能公司“因克斯”完成超3亿元B轮融资</strong></p>\n  <p>近日，具身智能公司“因克斯”宣布已完成超3亿元B轮融资。本轮投资方包括中信金石、纳爱斯、苏创投、华睿投资、南京交控、华瑞创投，同时，复星创富、深创投、华控基金、锦秋基金、普华资本作为老股东持续追投。明论资本担任长期独家财务顾问。本轮融资将进一步支持公司在产品研发、制造能力及业务拓展方面的持续投入。</p>\n  <p>&nbsp;</p>\n  <p><strong>“存钱心态”小调查</strong></p>\n  <p>现在的年轻人，似乎总在为存钱感到焦虑。每个打工人可能都会立下一个每月存钱的FLAG，但，���现了多少呢？</p>\n  <p>工资到账，还完花呗交完房租，余额就没剩多少；刷会社交媒体，直播间出来钱包就又瘪了一圈；省吃俭用一个月，出门滑个雪就努力清零……“我也没买啥啊，我钱呢？”这成了当代年轻人的未解之谜。</p>\n  <p>你现在有存钱的习惯吗？存钱的最大阻碍来自哪里？欢迎填写“年轻人存钱行为小调查”，聊聊你的存钱态度和成果~</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_6aec9d456a48425b94107d6ff19f5701@5667365_oswg22913oswg389oswg395_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小调查</p>\n  <p><strong>整理丨王浩阳</strong></p>", "category": "tech", "published_at": "2026-09-16T00:01:22+00:00", "fetched_at": "2026-09-16T03:02:56.204053+00:00", "fingerprint": "0a7b9294c6e8ebf6"}, {"source": "36氪 - 最新文章", "title": "高性能电动船艇动力系统公司获近亿A轮融资，海外收入增长450%丨36氪首发", "url": "https://36kr.com/p/3985354977721094?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_ca6ad7f1467a4bce9a3e623170ed7a39@6221844_oswg6679608oswg8000oswg4500_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3000</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，高性能电动船艇动力系统企业擎波探索（ExploMar） 近日已完成近亿元A轮融资。本轮融资由德联资本、常熟国发、苏创投联合领投，三七互娱跟投，老股东DCM Ventures跟投并且已连续三轮加注。势能资本担任独家财务顾问。本轮融资将主要用于加固全球化渠道网络、布局海外电动艇体验中心，以及完善海外服务与配件中心建设。</p>\n  <p>擎波探索（ExploMar）成立于2021年，专注于高性能电动船艇动力系统，产品已交付全球超20个国家。创始人董江曾在宇通客车、申龙客车及重塑科技主导多款新能源车型从0到1的商业化落地，拥有14年新能源汽车产业化经验。核心团队兼具底层三电自研、船机桨匹配与全球化渠道搭建的完整能力。</p>\n  <p>与新能源汽车“从0到1”的爆发路径不同，船艇动力的电动化进程明显滞后。全球燃油舷外机市场历经数十年发展，已形成由水星（Mercury）、雅马哈（Yamaha）等日美品牌主导的稳定格局。然而，在高性能（50匹马力以上）领域，电动化渗透率至今仍很低。</p>\n  <p>为什么技术平移看起来顺理成章，落地却如此艰难？董江向硬氪分析，高性能电动舷外机的真正难点，不在于能不能把电机做到300匹，而在于如何在有限重量与极端工况下实现持续大功率输出，同时保持整船的性能与可靠性。</p>\n  <p>“船体对重量高度敏感，动力系统需要长时间高负荷运行，还要面对海水腐蚀、防水密封及复杂海况的挑战。”董江解释，更重要的是，最终动力表现并非仅由电机决定，电机、减速器、螺旋桨、船体线型与水动力阻力之间存在高度耦合。这就像把重卡的发动机塞进跑车车身，还要保证它跑得稳、跑得久。</p>\n  <p>擎波探索并未选择简单的“油改电”路径，而是从零开始进行软硬件正向开发。&nbsp;</p>\n  <p>团队重构了适用于水上工况的三电与控制系统，突破了高性能减速器技术瓶颈，并打通了全球数百种船型流体阻力数据与桨端性能匹配。</p>\n  <p>目前，公司已积累超过100项自主专利，产品覆盖70匹至1200匹马力，可适配4米至24米船艇，形成了从单机到多机组合的标准化滑板底盘式交付方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_633abd36fb344289af2dafb1f569d728@6221844_oswg389178oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">擎波探索高性能电动舷外机系统（图源/企业）</p>\n  <p>对于船艇智能化，擎波探索有着冷静的判断。董江认为，面向休闲用户的娱乐场景，目前“无人化”并非刚需，但“辅助驾驶”与“运营联网”具有明确的商业价值。</p>\n  <p>擎波探索推出的Smart Captain系统，针对新手用户提供了狭窄水域原地掉头、抑制“海豚跳”等安全辅助功能。特别是“海豚跳”——当船体推重比达到临界点时，船身会像野马一样不受控制地跳跃，0.7秒内即可发生，且振幅会快速发散。擎波探索通过扭矩管理与自适应配平系统，实现了毫秒级识别与主动抑制。</p>\n  <p>此外，针对B端商业运营的Smart Fleet系统，则通过远程追踪、OTA升级与船队管理，解决了以往燃油机时代“坏在海里只能等拖”的服务痛点，大幅提升了运营效率。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_3b82a946d25f4ce9aef3d6091cd08d50@6221844_oswg939113oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">公司相关智能化功能（图源/企业）</p>\n  <p>2026年上半年，擎波探索海外收入同比增长450%，在手正式订单金额已超过1亿元人民币。</p>\n  <p>此外，在董江看来，船艇电动化的经济账已经算得通：一台300匹燃油舷外机售价约30万元，600匹高达80万元，但高负荷寿命仅500-1000小时，每小时油耗高达100升汽油。而依托中国成熟的新能源汽车供应链打造的电动系统，在寿命与能耗成本上具备碾压性优势。</p>\n  <p>“在高性能船艇品类，油电同价预计3到5年就能实现。”董江判断，这背后是政策法规推动、用户接受度跃升与运营成本优势显性化三重力量叠加的结果，船艇电动化的产业拐点很快会到来。</p>\n  <p><strong>以下为硬氪与擎波探索创始人董江的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：新能源汽车的经验，在船艇电动化中究竟能复用多少？</strong></p>\n  <p><strong>董江：</strong>很多人以为船艇电动化是新能源汽车技术的简单平移，但实际差异远大于相似。</p>\n  <p>相同点在于开发思路、工具链和部分供应链资源，比如高电压平台架构、车规级E/E电气架构的逻辑。但不同点是决定性的。首先，船艇动力系统长期处于高负荷工况，而汽车并非如此，这对热管理和系统耐久性提出了极高要求。其次，海水腐蚀、防水密封是汽车不需要面对的极端环境。</p>\n  <p>更关键的是，汽车动力系统相对独立，而船艇的电机、减速器、螺旋桨与船体线型是高度耦合的。我们的动力系统相当于“滑板底盘”，要适配全球成千上万种船型，这背后需要海量的流体数据匹配与算法迭代，无法简单照搬汽车经验。我们花了将近三年时间做正向开发，就是在攻克这些无法取巧的工程壁垒。</p>\n  <p><strong>硬氪：在海外市场，擎波探索面对的是百年历史的燃油巨头和本土电动新势力，你们的差异化策略是什么？</strong></p>\n  <p><strong>董江：</strong>竞争对手主要有两类。一类是传统的燃油巨头，他们在做“油改电”，受限于原有架构，产品的功率密度和能量密度很难有质的突破。另一类是海外的电动初创企业，大多聚焦本土市场，在供应链成本控制和多区域服务网络建设上存在短板。</p>\n  <p>我们的核心差异在于三点：第一，全栈自研的正向开发，从底层软件到电机、减速器、热管理都是自主定义，不受上游供应商限制，性能和迭代速度领先。第二，我们拥有中国新能源产业链带来的工程师红利与成本优势，这在全球范围内极具竞争力。第三，也是最重要的，我们正在建立的全球化渠道与服务网络。船艇行业具有“不可时间压缩性”，需要扎扎实实去布局本地化团队、配件仓和体验中心。这种体系能力，构成了我们面向未来的长期护城河。</p>\n  <p><strong>硬氪：市场占有率如何？主要客户有哪些？</strong></p>\n  <p><strong>董江：</strong>从2025年正式商业化以来，目前我们的全球出货量在高性能电动舷外机领域已位列前二。主要客户包括以国家为单位的区域代理商渠道，以及船艇制造企业OEM类的KA客��。终端场景方面，我们已交付不仅包括德国基姆湖、匈牙利巴拉顿湖、挪威峡湾等众多禁油区域，更多的来自于海岛交通、内河渡轮、养殖、文旅、工作艇等经济性驱动的迫切需求。在已经落地的尼日利亚渡轮场景中，运营商首年内即可实现经济性更优；若以10年生命周期计算，单台300匹电动引擎可创造超100万美金的经济性价值。这个逻辑同样适用于我们在马尔代夫的酒店接驳项目、智利三文鱼养殖项目、泰国政府采购项目等等 ——短期回收与长期复利的叠加，使跨地域和场景的快速渗透具备坚实的商业底层逻辑。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>德联资本表示：</strong>船艇动力的电动化与智能化，正在复刻新能源汽车已被验证的产业路径，是确定性极强的代际更替。擎波探索精准卡位其中价值量最高、壁垒最深的中大马力舷外机环节：对B端运营场景，油改电的全生命周期经济性已经跑通，去化石能源意味着直接的成本重构；对C端用户，静谧、零排放、智能驾控构成燃油方案无法提供的体验代差。依托中国新能源汽车产业链与正向自研的三电架构，三电与EE架构正向自研，公司对欧美竞品具备系统性领先优势。创始团队拥有十余年年新能源产品定义与量产落地经验，研发、供应链与全球商业化能力兼备，我们看好擎波探索成长为全球船艇电动化的动力系统定义者。</p>\n  <p><strong>常熟国发表示：</strong>擎波探索在船艇电动动力领域构建了基于水面场景正向开发、软硬件全栈自研的系统级技术壁垒。产品已率先交付百种船型及场景，实际运行数据持续反哺产品优化，形成“交付—数据—迭代”的闭环，进一步加固市场端的先发优势。作为常熟水上电动化标杆企业，本轮投资将助力其持续产品升级与全球化拓展，让“常熟智造”的零碳动力驶向更广阔水域。</p>\n  <p><strong>DCM Ventures董事合伙人林欣禾表示：</strong>通过不断的创新和政策支持，新能源船艇当前正处于“示范应用”到“规模化复制”的关键节点，依托动力电池运行的技术突破和低碳发展的双轮驱动，新能源船艇市场的拓展不仅是绿色转型的必然选择，更是具备高成长性的蓝海。</p>", "category": "tech", "published_at": "2026-09-16T01:30:00+00:00", "fetched_at": "2026-09-16T03:02:56.204049+00:00", "fingerprint": "33786a71ae46c3ff"}, {"source": "36氪 - 最新文章", "title": "商用割草机器人完成数千万融资，用L4级无人驾驶重构高尔夫草坪运维｜硬氪首发", "url": "https://36kr.com/p/3984593870420997?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，商用割草机器人公司「莱锋机器人」近日完成数千万元天使轮融资，投资方为禹达资本。融资资金将主要用于海外市场销售与服务团队搭建，以及后续果岭机、长草机等高难度产品的研发推进。</p>\n  <p>莱锋机器人团队成立于2022年，公司瞄准高尔夫球场草坪运维场景，推出L4级商用割草机器人，覆盖高尔夫球道区修剪、长草区处理的精细养护全业务环节。其首款产品高尔夫球道割草机器人Boulder F1已于2025年9月正式发布，已在中国、韩国、日本等市场销售，并加快欧美市场的认证与渠道布局。</p>\n  <p><strong>目前，莱锋机器人也是少数在FCC禁令前拿到美国FCC认证的B端割草机器人公司</strong>。</p>\n  <p>近年来，随着消费级庭院机器人快速进入家庭，满足轻量化、单人作业需求。相较之下，但商用大面积草坪领域却形成明显断层，面向高尔夫球场、市政绿地等大面积商用场景，完整闭环的自动化作业方案依旧缺位。传统割草设备仅能完成基础割草，在复杂地势、高频作业条件下，高度依赖人工，人力成本高企、作业效率短板突出。</p>\n  <p>而在各类商用割草场景中，高尔夫球场是一个特殊的存在。根据PW\u001eConsulting 2025年全球草坪设备行业报告，高尔夫赛道占到全球商用草坪设备市场规模约三分之一，是体量最大的单点商用市场，同时它对草坪管护标准也最为严苛。海外锦标级球场工程测算，一个标准18洞球场整体占地约64.8万平方米，其中近24万平方米的球道区域，行业常规作业要求至少每两天完成一次割草维护。</p>\n  <p>这种大面积、高频次、重复性强的户外作业特性，使得高尔夫场景与机器人作业高度适配。但长期以来，其自动化改造面临一道隐性门槛。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_4e1e5c6e309a435593d359f2a7646794@6022551_oswg2401160oswg1440oswg1080_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">聚焦高尔夫场景的商用割草机器人（图源/企业）</p>\n  <p>“单个草坪维护涉及多个区域，球道约占40%、长草约为40%-50%、果岭约占10%；同时，不同区域割草频率也有差异，球道两天一次、长草一周一次，果岭需要每天割，因此，球道和果岭目前是运营成本较高的区域。”莱锋机器人创始人兼CEO刘宇轩介绍称，“不同企业对剪草精度、机身自重、行进逻辑的要求更是天差地别，很难用一套标准化设备满足全部需求。因此，通用割草机器人很难进入高尔夫场景的核心作业环节。”</p>\n  <p>传统作业模式下，球道割草依赖有人驾驶的大型设备，由于白天球场需要营业，有人驾驶设备只能在营业前完成作业，作业窗口被严格限制在清晨5点至9点之间。这意味着，一台大型设备必须在三四个小时内完成全部球道的割草工作。为了在有限时间内覆盖足够面积，设备不得不做得更大、更宽、更贵。</p>\n  <p>莱锋团队的思路转变在于，通过L4级端到端无人驾驶技术，将作业时间从“人的窗口”解放为“全天候窗口”。</p>\n  <p>其发布的首款商用机器人产品Boulder F1，其割幅为1.55米、整机约1吨，可以在夜间自动离开充电桩，穿越球场道路进入球道区域，按照排班依次作业，七八个小时后自动返回充电。整个流程无需任何人工干预，并覆盖传统大型设备4至5小时的割草量。</p>\n  <p>“我们的逻辑和新能源车对燃油车的替代相似——同时做到电动化和智能化，成本还更低，并选择更复杂但割草质量要求更高的滚刀作为突破口，因为高尔夫球场只喜欢滚刀。”刘宇轩告诉硬氪，在北美市场，一台Boulder F1的定价约为12-14万美元，而传统有人驾驶割草设备售价约14万美元。除设备采购成本外，一台机器人可替代一名割草工，按工资加保险计算，每年节省近4万美元人力成本，5年总使用成本下降超过50%。</p>\n  <p>然而，要将L4级无人驾驶落地到高尔夫球场，远非简单的技术迁移。</p>\n  <p>高尔夫球场的作业环境对自动驾驶系统提出了三重挑战。首先是全工况下的割草稳定性。随着季节、降雨量、夜间露水湿度的变化，割草工况差异显著。在干燥白天表现正常的设备，到了夜间露水环境下可能问题频发。莱锋机器人团队在割草效果的稳定性上投入了大量工程验证，确保全气候条件下的切割质量一致。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_a67aa037ac9f4e81ab1e91ad79996e37@6022551_oswg6356992oswg3840oswg2160_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">首款商用机器人产品Boulder F1（图源/企业）</p>\n  <p>其次是场景的跨场能力。高尔夫球场面积大、障碍物多，树木、隧道等遮挡物会导致RTK信号和激光定位系统失效。Boulder F1采用RTK、视觉与激光雷达三融合方案，在卫星信号和激光定位均不可用时，仍能通过视觉与激光的AI系统引导车辆完成全场覆盖。</p>\n  <p>第三是高速作业下的避障能力。Boulder F1最高行进速度达2.8米/秒，针对球场内沙坑边缘、树桩、石块、小型场地设施等细碎、低矮小目标，莱锋对AI感知识别模型完成场景化专项训练，保障设备在高速作业过程中，仍可稳定捕获并识别各类小型障碍物。</p>\n  <p>具体到产品层面，莱锋机器人现有算法平台可同时支持球道、长草等不同场景，整机本体无需改动，仅更换刀组就能完成场景切换。针对各地不同草种的作业需求，例如美国南部暖季型草适配重型滚刀、北部冷季型草适配轻型滚刀，莱锋配套了五寸、七寸，轻重型等多款滚刀刀组，可以实现硬件快速适配。</p>\n  <p>在海外市场拓展节奏上，莱锋机器人实施分区域分步拓展，现阶段将欧洲作为核心市场。</p>\n  <p>刘宇轩向硬氪指出，欧洲高尔夫产业发展成熟，经过传统草坪设备厂商多年的市场培育，球场运营方对于自动化割草作业模式接受度更高；同时当地持续面临草坪运维用工短缺、人力成本逐年上涨的压力，本地代理商也有着非常明确的降本增效诉求，无论是终端客户还是渠道伙伴，都对智能化机器人方案拥有较强的合作意愿。</p>\n  <p>北美市场计划于明年正式开启规模化布局。亚洲区域，公司现已经完成多家高尔夫球场全周期实地试点验证，经过完整作业季的实测打磨，基本实现机器人常态化自主运维。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_4872f19b52ab4e7387556eedc1cf0432@6022551_oswg4142261oswg1996oswg1468_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">整个流程无需任何人工干预（图源/企业）</p>\n  <p>尽管高尔夫割草机器人展现出明确的降本价值，但赛道还处于大规模爆发时刻前夕，欧美市场部分无人割草机公司在要求不高的长草区已经有一定的商业落地，整个市场在技术落地、渠道建设、新品迭代都需要长期投入。</p>\n  <p>对莱锋机器人来说，Boulder F1只是起点，能否顺利完成果岭等核心机型的研发、跑通多区域海外商业化，将成为公司后续发展的关键考验。</p>\n  <p><strong>以下为硬氪与莱锋机器人创始人兼CEO刘宇轩的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：高尔夫球场由多个作业区域组成，莱锋的产品矩阵规划是怎样的？从单款产品到完整解决方案，公司的长期目标是什么？</strong></p>\n  <p><strong>刘宇轩：</strong>高尔夫球场的草坪维护涉及球道、长草、果岭三类核心区域，不同区域的割草频率和精度要求差异显著。</p>\n  <p>目前莱锋已发布并量产球道割草机器人Boulder F1，后续将陆续推出长草区和果岭区的无人割草机器人，形成一套覆盖高尔夫球场全场景的草坪无人化解决方案。</p>\n  <p>我们的目标是成为全球少数能够提供高尔夫球场全场景无人化割草解决方案的公司。</p>\n  <p>当前市场上的传统设备供应商，通常提供的是燃油动力、有人驾驶的割草机产品组合，而莱锋提供的是从球道到果岭、从硬件到云端调度的完整无人化方案。这也是为什么欧美地区许多高尔夫专业设备代理商愿意与莱锋合作，他们服务的客户正在从传统燃油设备向自动化方案迁移，而莱锋的产品矩阵恰好匹配了这一需求。</p>\n  <p><strong>硬氪：球场部署多台机器人组成机队时，平台如何实现统一管理？多机之间如何协同分配任务、处理设备异常？</strong></p>\n  <p><strong>刘宇轩：</strong>多机协同的核心挑战不在单台机器的能力，而在于如何让整个机队作为一个系统高效运转。我们是从三个层面来解决的。</p>\n  <p>第一是统一的空间数据底座。球场的高精地图对所有机器人是共享的，每台机器在同一个坐标系下作业，位置、状态、任务进度实时同步到云平台，用户可以在后台看到每台机器的实时位置、当前任务、电池状态和作业覆盖情况。如果一台机器在路径上遇到障碍物，它会即时上报到云端，系统自动同步给所有在线机器，其他机器在规划路径时直接绕开该区域，不需要每台机器各自去发现和应对。这本质上是一个动态更新的语义地图，机器人在作业过程中不断往地图上叠加新的环境信息。</p>\n  <p>第二是多机调度与路权管理。球场里有道路、球道、果岭之间的连接通道，多台机器同时作业时，路上会存在交汇。我们的调度系统会给每台机器分配作业区域和时间窗口，在路径规划层面做时间窗避让，避免多台机器在同一路段形成死锁。即便两台机器在窄路上相遇，系统会根据任务优先级和当前位置决定谁先通行、谁靠边等待。这套逻辑跟无人配送车队的调度思路类似，只是场景从城市道路换成了球场内部的非结构化路网。</p>\n  <p>第三是作业补位机制。这是多机协同里比较关键的一环。如果一台机器因为刀片卡住、传感器异常或其他原因无法继续作业，系统会检测到作业中断，自动评估剩余任务量，并从机队中调度一台备用机或已完成当前任务的机器来接管未完成区域的割草作业。补位不是简单的“换一台机器重新割”，而是精确到作业网格的，即平台知道哪些区域已经割完、哪些还没割、哪些割到一半，补位机器只需要接续未完成的部分，不会重复作业。</p>\n  <p>这套云端运维系统的价值在于，它变成“管理一个机队”。机器人的日常运行、路径规划、异常上报、补位调度都由系统自动完成，人只需要在收到异常通知时做决策，比如确认是否绕行、是否暂停某区域作业、是否派人现场处理。整个机队的产能利用率因此大幅提升，同时产出的稳定性也有保障。</p>", "category": "tech", "published_at": "2026-09-16T02:00:00+00:00", "fetched_at": "2026-09-16T03:02:56.204045+00:00", "fingerprint": "2e8e80b63260b137"}, {"source": "36氪 - 最新文章", "title": "产品已批量进入全球头部Tier 1产线，「知来具身」要为工业场景打造“开箱即用”的泛化机器人", "url": "https://36kr.com/p/3985410714581760?f=rss", "summary": "<p>工厂劳动力缺口早已是行业常态，尤其在制造流程多达数百个环节的汽车生产领域。打磨、飞拍检测、装配等工序至今仍未实现大规模自动化，而专业的技术工人却越来越少。</p>\n  <p>在上个月的WRC现场，不少客户围着「知来具身」的机器人测算节拍、评估效率，讨论机器人的精度、速度、寿命以及投资回报比。相比抓人眼球的机器人“表演”，他们更关心一个现实问题：机器能不能像人一样干得又快又好？</p>\n  <p>如何让机器人真正进入工厂工作流，是当下具身智能行业最棘手的问题。对此，成立于2021年的知来具身正在向行业给出自己的解法。</p>\n  <p>据介绍，凭借其全栈自研的“世界模型+物理AI”技术体系，知来具身的飞拍检测、力控打磨、熨烫等机器人产品目前已批量进入多个全球头部汽车零部件产线。</p>\n  <p>“机器人要解决的，不仅是工厂已经能够自动化的部分，更是传统自动化之后仍然难以覆盖的复杂任务，要能做剩下的脏活、苦活和累活。”知来具身董事长兼CEO俞琼说。</p>\n  <h2><strong>从产业现场出发</strong></h2>\n  <h2><strong>让机器人真正下工厂干活</strong></h2>\n  <p>“我们是一支有汽车行业know-how和懂AI算法的复合型团队。”俞琼说。</p>\n  <p>俞琼 2024 年初加入知来具身的选择。此前他已深耕汽车行业近三十年，曾任福特汽车STA、采购高管；知来的技术研发团队则主要来自阿里AI 团队、南京大学强化学习团队等，具备人工智能算法、机器人学习与工程化落地经验。</p>\n  <p><strong>知来具身的技术路线可以用“世界大模型+物理AI”来概括。团队将机器人的能力拆解为四个模块：提供感知能力的视觉、负责决策的大脑、控制本体运动的小脑以及完成执行的末端执行器，从而形成完整的技术闭环。</strong></p>\n  <p>以打磨场景为例，你可以想象传统的打磨就像“盲削”土豆皮，不管这个土豆长什么样，都挖成一个固定的形状，很容易出现过打或欠打的问题。</p>\n  <p>而知来具身基于多模态感知模型构建了一套“先感知、后执行”的作业体系，打磨机器人先由视觉系统精准识别每一个“土豆”的表面结构，再实时动态规划轨迹以做到仿形贴合，仅处理毛刺部位。相比于传统方式的“盲打”，实现“看见再打”的作业逻辑重构。</p>\n  <p>在执行层面，知来机器人在重复定位精度、末端最大线速度、连续工作续航等方面，已满足工业级的高精度、高节拍和高寿命要求。</p>\n  <p>而在连接感知与执行的大脑算法层面，知来具身构建了“通用大模型+专家模型”的双层架构，使模型准确率达到99%。</p>\n  <p>但俞琼坦言，99%远不是终点。“工业场景要求的准确率是99.99%，否则产线就连不起来。而从99%到99.9%，研发投入要翻一倍；再到99.99%，还要再翻一倍。”</p>\n  <p>遵循“从场景中来到场景中去”的原则，知来具身围绕汽车生产链形成多条产品线，其中飞拍、熨烫、打磨机器人已实现量产出货，取挂、装配、搬运机器人完成了现场验证，其他灵巧手机器人正处于研发小试阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_32985db38f5749a1a1b7513854f29a53@5688585_oswg4738684oswg3058oswg1718_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">知来具身机器人产品工业场景作业示意图</p>\n  <h2><strong>营收来自汽车工业产线</strong></h2>\n  <h2><strong>未来向AI硬件制造拓展</strong></h2>\n  <p>在完成从0到1的产品验证后，知来具身正处在从1到N的规模化增长阶段。俞琼透露，随着机器人产品在真实工业场景中的持续落地和不断复购，公司销售情况持续保持高速增长。</p>\n  <p>目前飞拍检测机器人已在金属件、内饰件等多类产品中批量应用，获得安道拓、李尔集团等全球汽车座椅头部客户订单。全球汽车行业前20强零部件供应商中，已有4家成为知来具身的长期合作伙伴。</p>\n  <p>为快速提高产能，降低生产成本，知来具身去年已与某上市公司达成上千套产能的产线合作，目前，双方共建的首条生产线已正式投入使用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260916/v2_8b0804d3abdb4bd28f40ce7e4333d221@5688585_oswg2507507oswg1672oswg941_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">知来具身正在推进落地的工业场景示意图</p>\n  <p>“我们的营收全部来自工业产线，没有表演娱乐和科教场景。”俞琼表示，知来具身以汽车行业为基本盘，未来将逐渐向AI硬件制造等行业拓展。</p>\n  <p>产品层面，知来具身正从“单机单能”向“一机多能”演进，计划在2027年中旬推出同时具备3-5种技能的机器人产品。</p>\n  <p>“我们最终的目标是让客户可以开箱即用。”俞琼表示。</p>", "category": "tech", "published_at": "2026-09-16T02:12:01+00:00", "fetched_at": "2026-09-16T03:02:56.204039+00:00", "fingerprint": "7c98cff1bb93734a"}, {"source": "36氪 - 最新文章", "title": "产品观察丨xTool做了一台3000元起步的激光雕刻机，难的不只是价格", "url": "https://36kr.com/p/3985480196881413?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>在中高端市场坚挺多年后，消费级激光雕刻机龙头xTool“砍”了自己一刀。</p>\n  <p>2026年上半年，xTool推出了一款3000元起步的彩色激光雕刻机。</p>\n  <p>市场上并不缺便宜的消费级激光雕刻机，单龙头xTool此前从未涉足其中。其招股书显示，公司产品定价通常比相近配置的同类产品高10%—30%。</p>\n  <p>这并不意味着xTool不想以平价产品打入更大众的市场。</p>\n  <p>在投资过xTool的一位投资人看来，价格是关键。激光雕刻机要做主流市场，单品价格必须在500美金以下，在国内价格则不能超过三千元。</p>\n  <p>在今天，3D打印机的价格早已下探到千元级，并进入了大型商超，消费者购买决策链路已经拉到最短。而万元级的激光雕刻机能吸引的只有有专业加工需求的用户。</p>\n  <p>电商平台上，两三千元的激光雕刻机不在少数。但精度和使用体验都很难满足专业需求。</p>\n  <p>教培机构创业者崔润泽先后购买过两款3000元左右的机器，第一款软件适配度差，文件尺寸拖入软件后常发生尺寸错误；另一款也是软硬件适配度问题，视觉定位也不准确，切割物品容易切歪，浪费不少时间和耗材。两款机器用了寥寥数次后都已闲置。</p>\n  <p>事实上，硬软件的适配，以及雕刻、切割的成功率，是低价激光雕刻机更难解决的问题。文件识别、材料参数匹配、视觉定位等环节，则需要企业长期测试和调试；其中既有软件和工程经验的积累，也涉及摄像头、结构精度等硬件成本。</p>\n  <p>于xTool而言，在搭建成熟的中高端产品线后，M2要做的不只是降价，而是要尝试用更低的成本，复现过去在中高端产品上积累的工程能力。</p>\n  <h3><strong>01 减价不减配</strong></h3>\n  <p>在xTool内部，500美金也被视为进入大众市场的门槛。它们从2023年开始，内部规划就在平价产品线，但始终停留在测试阶段。</p>\n  <p>“我们内部不愿意放弃智能化体验和安全要求。2023年公司还没有能力做到这些，所以我们先去做高端产品，用更充足的成本预算，把一些关键技术和工程方案跑通。到2026年，我们可以重新来看这件事。”xTool M2产品经理Alex告诉硬氪。</p>\n  <p>到M2正式立项时，公司内部已经预研了两轮平价产品。过去，xTool的产品通常先定义产品能力，再确定最终价格不同，但M2第一次从价格倒推产品定义。</p>\n  <p>在价格的基准线下，功能删减的同时还要保持xTool对智能化体验的要求成为新的挑战。</p>\n  <p>首先，摄像头不能减。此前困扰过崔润泽的视觉定位不准确的问题，跟摄像头有关。</p>\n  <p>“单摄像头做不好定位，如果我们想加工一个厚的物体，我们需要定位的是物体的底部，因为底部是坐标系的加工轮廓，但单摄像头看到的永远是顶部，这会造成误差。”Alex告诉硬氪。</p>\n  <p>M2的主机内部有三颗摄像头，其中有一颗专门用于火焰检测。其余两颗是xTool从数万元高端机型下放而来的双摄ACS™智能加工系统：远景摄像头覆盖全幅面、近景摄像头锁定细节。双摄系统才能让使用者不用再考虑坐标系概念或者手动调试，而只需要在软件画面中拖动图案，实现视觉定位并一键加工。</p>\n  <p>激光雕刻属于减材制造，加工过程中涉及对耗材的使用和消耗。</p>\n  <p>在xTool M2产品经理Alex看来，对于不熟悉激光雕刻产品的用户而言，加工位置错误带来的挫败感远高于专业用户，因此精准定位属于不能被牺牲的体验。</p>\n  <p>M2解决成本问题的另一个办法，是用模块化架构的设计，3000元的起步价下，用户不需要为所有功能买单。彩印、不同激光加工能力被做成独立模组，需要时再添加。</p>\n  <p>过去xTool的部分产品更换模组需要拆装螺丝，到M2模组更换改为磁吸固定。同传统的螺丝拆装相比，磁吸的方式更快也更稳定。</p>\n  <p>“主要是一代一代积累的技术经验。”Alex表示。</p>\n  <p>这也是M2上不少改变的共同特点。例如，M2在机身大小接近上一代方案的情况下，加工幅面扩大了约50%。这其中主要是在内部结构、走线和空间利用率的持续优化，而不是某一项单独的新技术。</p>\n  <p>彩色打印功能的实现，则依赖另一条供应链的成熟。</p>\n  <p>激光只能雕刻或切割材料，无法加工颜色。xTool发现，不少用户在加工完耗材后，会再自行喷涂、上色，于是开始尝试把打印能力整合进激光设备。</p>\n  <p>Alex告诉硬氪，xTool几年前开始研究激光设备的彩色打印时，国内相关喷头供应链还不成熟，早期方案甚至无法使用。随着国内供应链逐渐成熟，xTool与供应商长期合作开发后，才能将彩色打印的方案实现到M2上。</p>\n  <p>xTool能实现平价产品的研发，不只是系统地运用过去做中高端产品的技术，也有内部组织管理上的提升。</p>\n  <p>硬氪了解到，过去两年，xTool内部专门做过一轮成本管理培训。消费硬件公司里，研发和采购价格往往存在信息隔离。在那轮成本管理中，xTool工程师曾一起一个物料一个物料地对账。</p>\n  <p>Alex在其中感受到的变化是，他们比过去更清楚自己自己设计出来的一颗零件到底多少钱。</p>\n  <p>事实上，做平价的硬件产品在中国并不难，难的是保证产品的品质的同时保留利润，这考验的不是单项技术问题，而是一项系统工程。</p>\n  <h3><strong>02 从极客到小白</strong></h3>\n  <p>对于xTool而言，做一款定价3000元起步的激光雕刻机又意味着什么？</p>\n  <p>在xTool此前递交的招股书里显示，按GMV计算，2025年前九个月，xTool在全球激光类个人创意工具市场的份额为37%；在激光雕刻机及激光切割机细分市场的份额达到47%。截至2025年9月底，xTool全球联网设备超过40.5万台。</p>\n  <p>这是个庞大的数字，但这些用户主要是小B用户。xTool其实一直没能破圈。</p>\n  <p>YouGov调查估算称，仅美国、加拿大、英国、法国、德国和澳大利亚六个市场，拥有超过1.29亿名活跃的DIY创意人群。如果加上只是感兴趣、曾经制作或购买个性化手工产品的人，六个市场的潜在人群约为4.02亿。</p>\n  <p>在Alex看来，DIY用户基数群很大，公司要获得更大品牌、商业的影响力，不能对如此广泛的用户人群熟视无睹，那是很大的傲慢。</p>\n  <p>但更重要的是，如果无法跨越鸿沟进入主流市场，xTool很快就会失去增长的势头。</p>\n  <p>这意味着xTool必须推翻自己的经验。对于小B用户而言，数万元的机器是一笔生产资料投资。只要它能帮助接更多订单、提高效率，他们不会在意成本。</p>\n  <p>但DIY用户不是这样。他们可能只是想做一个印章、一件模型、一套周边，设备使用频率不稳定，也没有明确的回本周期。因此他们的预算更低，却未必更容易服务。</p>\n  <p>“DIY用户能妥协的东西其实不多。”Alex说。他们不够专业，所以反而要求机器可靠、体验简单；同时又希望一台机器能处理更多不同的创意。</p>\n  <p>价格是触达DIY用户的第一步，第二步是产品的易用性。</p>\n  <p>激光雕刻机不是一件天然容易使用的工具。传统操作中，用户需要确定加工坐标、调整焦距、判断材料，再根据不同材料设置激光功率和加工速度。</p>\n  <p>对于专业用户，这是一套操作流程；对于初次接触激光雕刻的人，每增加一个步骤，都增加一次失败的可能。</p>\n  <p>xTool试图把这一过程压缩成几步。</p>\n  <p>“你把一个想加工的物品放进去，关上盖子，在软件里面把图片拖过去，然后点击打印，这个事情就完了。”Alex硬氪。</p>\n  <p>能实现上述这点是基于xTool多年在软件上的积累。</p>\n  <p>以雕刻不同的材料为例，xTool软件中的材料库里收集大量不同材料的加工参数，能让软件有效识别材料，实现一键加工。其背后是xTool组建的材料团队，他们要一个个测试不同材料适合什么功率、速度和加工方式，再将这些参数维护进材料库。用户最后看到的是一个自动填好的参数，繁琐工作则被转移到幕后。</p>\n  <p>对用户来说，这种差异非常实际。使用M2的过程中，他们能感受到明显变化，比如文件尺寸不会无故改变，视觉定位能够直接在边角料上找到加工位置；软件里的去背景、巡边等功能也减少了额外处理文件的步骤。</p>\n  <p>当然，M2距离真正的“傻瓜式工具”还有距离。用户要花时间测试不同批次第三方耗材，而且机器在加工较厚、较宽作品时仍有限制。</p>\n  <p>但这些并非难以逾越的技术难题。对xTool而言，更艰难的是，当价格从万元级走到3000元，软件提升易用性后，如果激光雕刻机还是无法越过沟壑，它们又该如何向前？不过，随着拓竹也跨界进入消费级激光雕刻机赛道，或许能激发出这个赛道的更多潜力。</p>", "category": "tech", "published_at": "2026-09-16T02:40:37+00:00", "fetched_at": "2026-09-16T03:02:56.204026+00:00", "fingerprint": "9dfd810253119d5d"}, {"source": "少数派", "title": "开学季 | 学生理财的三条建议，学生党也可以一样理财", "url": "https://sspai.com/post/47126", "summary": "学生理财应是「理」字当头，培养收支的计划性是第一位，也恰恰是理财投资的基础。<a href=\"https://sspai.com/post/47126\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-15T03:10:08+00:00", "fetched_at": "2026-09-16T03:02:54.528875+00:00", "fingerprint": "6cb92495bdecbd25"}, {"source": "少数派", "title": "具透 | 精心优化， 体验感愉悦升华：iOS 27 中值得关注的新特性", "url": "https://sspai.com/post/114565", "summary": "少数派在体验了新版系统之后，帮你整理了 iOS 27 中值得关注的新功能和新特性，希望帮你能了解新版系统的方方面面。<a href=\"https://sspai.com/post/114565\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-15T07:00:00+00:00", "fetched_at": "2026-09-16T03:02:54.528871+00:00", "fingerprint": "cbd6bc55ba3513ad"}, {"source": "少数派", "title": "社区速递 158 | 便宜耐造的副厂手柄与大学宿舍里那些相见恨晚的装备", "url": "https://sspai.com/post/114613", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/114613\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-15T09:00:00+00:00", "fetched_at": "2026-09-16T03:02:54.528867+00:00", "fingerprint": "0a6ed7eb4cd75cec"}, {"source": "少数派", "title": "派早报：Steam Frame 开启预购、WPS 多端支持 Markdown -2-how-and-when", "summary": "Now that Valve has finally launched its entire 2026 hardware lineup - the Steam Controller, the Steam Machine, and today's Steam Frame - are we any closer to a next-gen Steam Deck handheld? Valve isn't saying so yet. The company is figuring out \"how and when we can deliver something like that,\" Valve designer Pierre-Loup [&#8230;]", "category": "tech", "published_at": "2026-09-15T00:13:47+00:00", "fetched_at": "2026-09-15T03:06:25.984414+00:00", "fingerprint": "d7d4f6eed21789a8"}, {"source": "36氪 - 最新文章", "title": "最前线丨从消费电子到AIoT生态，绿联的产品边界突围", "url": "https://36kr.com/p/3983259337800710?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_0badae05ce5f4f88a5ee2b8c4d4db54f@6221844_oswg694706oswg2150oswg1428_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>在消费电子行业，风口轮转的速度往往以季度计。一家公司如果长期固守原有品类赛道，很难持续跟上技术迭代与需求变迁。</p>\n  <p>面对行业现状，绿联做出新的战略调整。9月12日，绿联科技在厦门举办品牌全球发布会，正式发布了充电安全生态与AIoT生态产品。</p>\n  <p>从消费电子起家，到如今切入AI NAS、家庭智能体与本地算力设备，绿联正在探索更具行业普遍性的核心课题：在竞争激烈且快速变化的消费科技领域，一家公司如何构建穿越周期的长期竞争力？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_3c78c6ff6d904a58a5540022ad8f0faf@6221844_oswg13294861oswg5377oswg3586_img_jpeg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">发布会活动现场（图源/企业）</p>\n  <p>绿联的起点，是较为大众熟知的充电类和办公拓展类产品。硬氪在现场获悉，绿联目前在全球拥有超过3亿用户。2025年，绿联在泛拓展类消费电子产品实现全球出货量第一；2026上半年，全球充电创意产品业务同比增长超50%。</p>\n  <p>近年来整个行业对“充电”这件事的定义正在发生变化。用户的需求不再停留在“充得快”，而是向“充得安全、用得省心”迁移。随后，工信部组织制定了强制性国家标准《移动电源安全技术规范》，于2026年4月发布，设置12个月过渡期，被业内称为“史上最严”移动电源安全标准。</p>\n  <p>绿联也是新国标起草单位之一，其创始人张清森在采访中表示，新国标不是简单迭代，而是“指数级的改变”，在安全与成本层面都大幅提高了行业门槛，因此“未来不是所有企业都能做充电宝”。</p>\n  <p>从纵向来看，绿联发布了其“充电安全生态”，从源头安全、过程智能防护、全流程品质保障到数字化安全可视，将安全能力从单一产品延展至多品类、多场景。而横向来看，AI NAS与AIoT则是绿联的横向突围。</p>\n  <p>从官方数据得知，2026上半年，绿联智能存储业务同比增长超85%；AINAS iDX系列在Kickstarter众筹平台募资超880万美元，拿下NAS品类全球众筹第一名。这些数据表明，绿联在存储赛道已经建立起一定的全球认知。</p>\n  <p>张清森在采访中将HomeAgent描述为“AIoT的中枢”：提供中央存储与算力，并通过协议将算力分享给灯、扫地机、3D打印机等设备。这意味着，绿联并不满足于做一台存储硬件，而是试图成为家庭本地算力的调度中心。</p>\n  <p>这一思路的合理性在于，当前多数AIoT设备若单独加入AI能力，成本高且算力闲置率高，而集中式算力复用可以显著降低整体成本。</p>\n  <p>而发布会上亮相的MasterAgent，则进一步强化了这一逻辑。作为全球首款搭载NVIDIA Jetson Thor T5000的本地AI智能体存储设备，其算力高达2070 TFLOPs，可在本地运行122B大模型。结合Arm架构CPU与NVIDIA GPU，绿联可以根据不同细分市场的性能要求灵活配置主控方案。</p>\n  <p>这背后是绿联对AI从云端走向边缘和本地的趋势判断：让AI从云端工具进入家庭、学习、办公等真实场景。</p>\n  <p>目前，绿联的AIoT生态产品线已涵盖HomeAgent、MasterAgent、智能摄像头、智能音箱、智能相框等。张清森在采访中解释了这一布局的逻辑：以家庭场景为中心，空间检测需要“眼睛、嘴巴、耳朵”，因此自然衍生出家庭摄像头、智能音箱与智能相框。这套系统协同起来，形成一套家庭智能管家式的系统，让用户在任何时间、任何地方都能接触到系统的存在。</p>\n  <p>但绿联也清楚，自建生态无法覆盖所有场景。张清森明确表示，未来会开放第三方生态，“烟感等各种智能AIoT数据都加进来”，并引入更强的算力与AI技能，如翻译、文生视频、文生图等。</p>\n  <p>这种开放姿态，与绿联对NAS系统的判断有关：张清森认为，现有操作系统大多不是为AIoT设计的，而NAS系统“最匹配AIoT”，具备先发条件去切入AIoT生态。</p>", "category": "tech", "published_at": "2026-09-14T13:06:44+00:00", "fetched_at": "2026-09-15T03:06:25.828594+00:00", "fingerprint": "d1d24f433f10e905"}, {"source": "36氪 - 最新文章", "title": "从「流量依赖」到「信任复利」，跨境电商的下一个增长公式是什么？｜超级会氪厅", "url": "https://36kr.com/p/3982902160063239?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_2b3662e6b33346c48d47acf91de42ff9@6385117_oswg3426588oswg2985oswg1403_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>过去几年，跨境电商的核心增长逻辑高度依赖广告投放。铺货、测款、投流、起量，一套标准动作下来，只要流量成本低于利润空间，生意就能滚动起来。</p>\n  <p>但到了2026年，这套公式正在失效，跨境电商经历着一场从流量到信任的深刻转向。一方面是流量成本持续走高，另一方面平台规则加速演变，Shopee、TikTok Shop、Lazada等电商平台的佣金水平也有所上调，叠加广告与物流成本，综合运营压力倍增，多数卖家利润停滞或下滑。&nbsp;</p>\n  <p>流量驱动的粗放增长走到尽头，行业开始重新思考，什么才是可持续的增长引擎？</p>\n  <p>在成本高压与平台规则趋紧的双重挤压下，卖家的增长路径正面临前所未有的挑战——而解方，恰恰指向一个曾被忽视的变量：消费者信任。</p>\n  <h2><strong>流量越来越贵，信任成为新的“硬通货”</strong></h2>\n  <p>流量成本的持续攀升，倒逼出海企业重新审视增长逻辑。过去“投流即增长”的模式面临严峻挑战，广告投放ROI持续走低，单纯依赖平台流量的卖家正在被不断上涨的成本挤压利润空间。</p>\n  <p>与成本结构变化同步发生的，是消费者决策逻辑的演变。信任正从“加分项”变为影响转化率的关键因素。</p>\n  <p>独立站的崛起也在进一步印证这一趋势，加速分食市场份额，成为越来越多出海品牌沉淀用户关系、积累品牌资产的主阵地。</p>\n  <p>虽然DTC模式的用户粘性与长期价值显著优于传统平台模式，但也伴随着新的挑战。一方面，获客成本持续走高，优秀品牌的首单净利润不断走低，复购率成为拉高整体客户终身价值的关键。另一方面，品牌在从“平台铺货”走向“自主品牌”的过程中，面临着品牌价值稀释的核心困扰。</p>\n  <p>依赖广告投放拉动的粗放增长，正逐步被精细化运营与品牌信任建设所取代。<strong>信任，正在成为跨境电商最稀缺的资产。</strong>如何让域名、官网、品牌内容等“信任基建”真正支撑起长期的品牌价值，如何在电商平台与独立站之间建立统一的品牌信任体系，成为出海企业必须回答的问题。</p>\n  <h2><strong>AI重塑跨境电商，流量分配逻辑被改写</strong></h2>\n  <p>另一个容易被忽视的维度是：AI正在同时从两个方向重塑电商流量的分配逻辑。</p>\n  <p>一方面，亚马逊、TikTok Shop等主流电商平台正加速将AI能力嵌入站内推荐与搜索系统，用AI导购、智能问答等功能替代传统的关键词与广告排序逻辑；另一方面，AI购物代理、生成式搜索等平台外的AI渠道，也在绕过传统电商入口直接连接消费者与品牌。</p>\n  <p><strong>品牌因此面临双重挑战：既要被平台内的AI系统识别和推荐，也要被平台之外的AI代理“看懂”并推荐。</strong>这意味着当AI代理开始替消费者做购物决策时，品牌能否被AI系统准确理解、索引和推荐，直接影响流量的获取能力。</p>\n  <p>在传统的搜索和广告逻辑下，品牌可以通过竞价排名和关键词优化获得曝光；但在AI推荐逻辑下，产品的结构化数据、用户评价、品牌内容的丰富度，以及域名的可信度，都将成为AI系统判断推荐与否的重要依据。</p>\n  <p>当流量越来越贵、消费者越来越谨慎、AI正在重塑整个流量分配逻辑时，信任不再是一个抽象的品牌概念，而是可以被量化、被运营、被积累的核心资产。</p>\n  <p><strong>2026年9月16日，36氪携手威瑞信「深水规则」出海系列沙龙，走进中国企业出海的战略枢纽城市——上海，特别邀请到威瑞信大中华区高级总监张志、乐歌股份跨境业务品牌经理张翼飞、Ocean Stone管理合伙人杨飞、阿里云中小企业应用高级产品专家王霄等嘉宾，分别带来超级观点与实战分享。</strong></p>\n  <p>嘉宾们将围绕“从‘流量依赖’到‘信任复利’——品牌信任如何成为跨境电商的终极壁垒？”主题，聚焦“品牌信任如何成为终极壁垒”这一核心命题，探讨跨境电商从“流量依赖”到“信任复利”的增长新公式。分享前沿洞察与一线实战经验，并与参会企业展开深度探讨。欢迎出海企业的创始人、CEO及品牌、运营、海外业务负责人报名参与，共同探索AI时代下的跨境电商增长新路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_51ab1f664e1643dd84178880f9e4525a@6385117_oswg2843386oswg1080oswg7304_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-09-14T13:38:35+00:00", "fetched_at": "2026-09-15T03:06:25.828588+00:00", "fingerprint": "8449e408aab1de89"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨选手赛中失禁污染赛道，HYROX中国宣布整改；机构预计美股明年将暴跌21%；苹果推出Siri人工智能", "url": "https://36kr.com/p/3983906594257667?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>铠侠据悉考虑赴美上市融资100亿美元</p>\n  <p>被罗永浩吐槽后，野人先生当天涨粉超3万</p>\n  <p>胖东来新员工实行四年合同制，到期后不续签</p>\n  <p>特朗普访爱期间取消爱尔兰威士忌关税</p>\n  <p>现代汽车集团据报暂不考虑明年推动波士顿动力IPO</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>选手赛中失禁污染赛道，HYROX中国宣布整改</strong></p>\n  <p>9月12日HYROX北京站，澳大利亚女选手Joanna比赛中突发腹泻失禁，污染赛道与公用器械，仍坚持完赛夺冠，引发关于赛场卫生、裁判处置、判罚尺度的网络热议。9月14日赛事方发布整改公告，坦言全球竞赛规则缺少该类突发状况处置条款，现场未能第一时间干预。赛事方称事发后已封闭消杀污染区域、赛后更换全部地毯；同时将向全球总部提案完善竞赛细则，升级赛前、赛中场地器械消杀流程，并宣布将对网暴选手者予以禁赛处理。（界面新闻）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_9fd631c3c2af4a90ba483c6159fd3d1e@5667365_oswg202532oswg1080oswg1528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>机构预计美股明年将暴跌21%，“AI主导股市繁荣或将破灭”</strong></p>\n  <p>据媒体当地时间13日报道，分析师称，美国股市正处于泡沫后期，明年势将暴跌21%，而美国国债收益率突破5%将标志着货币紧缩新时代。投资者应趁还能享受的时候享受2026年最后几个月，因为由AI主导的股市繁荣即将破灭。据上述报道，英国知名经济研究机构凯投宏观（Capital Economics）高级市场经济学家詹姆斯·赖利（James Reilly）重申了此前的预测：标普500指数今年底将收于8250点，较9月11日收盘上涨7.7%，随后到2027年底将暴跌21%至6500点。（中新经纬）</p>\n  <p><strong>苹果推出Siri人工智能</strong></p>\n  <p>苹果推出Siri人工智能。Siri人工智能今日开始以英语进行测试，未来将扩展至5种语言。Siri人工智能在iOS、iPadOS和watchOS上初期将无法在欧盟使用。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>DeepSeek-V4.1-Flash上线千问AI平台</strong></p>\n  <p>36氪获悉，9月14日，阿里云宣布，DeepSeek-V4.1-Flash正式上线千问AI平台，相关API服务与Token Plan同步开放。</p>\n  <p><strong>全球首个人工智能+脑机接口标准在中国发布</strong></p>\n  <p>国家药监局9月14日批准发布中国第三个脑机接口医疗器械标准，也是全球第一个采用人工智能技术处理脑电数据的脑机接口医疗器械产品标准，新标准将于明年9月1日起正式实施。据了解，新标准系统规范了脑机接口医疗器械的数据采集、处理、标注、存储和访问等全流程的技术要求和测试方法，帮助企业破解脑机接口医疗器械在数据集质量控制尺度不统一、建设过程不规范等共性问题。（央视新闻）</p>\n  <p><strong>马斯克称极有信心在明年将英伟达AI计算机送入太空</strong></p>\n  <p>当地时间9月13日，马斯克在社交平台上回复用户时表示：“我极有信心，SpaceX明年将把英伟达VR NLV72 AI计算机送入太空。”（界面新闻）</p>\n  <p><strong>宇树科技升级G1机器人</strong></p>\n  <p>36氪获悉，宇树科技14日宣布，人形机器人G1全面升级，正式推出G1+。G1+围绕运动性能、感知交互、智能体验三大维度一次性带来6项升级，在保留G1高性价比定位的同时，重点补强颈部灵活性、关节电机输出与热管理、视觉与触觉感知、供电续航以及远场语音交互能力。标准版G1+含税售价为9.5万元，面向科研与深度开发场景的G1+EDU售价暂未公布。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>央行：9月15日将开展5000亿元买断式逆回购操作，期限为6个月</strong></p>\n  <p>36氪获悉，央行称，为保持银行体系流动性充裕，2026年9月15日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为6个月（181天），到期日为2027年3月15日（遇节假日顺延）。</p>\n  <p><strong>高瓴90后合伙人严文韬或将出任DeepSeek CFO</strong></p>\n  <p>9月14日，记者从多个独立信源处获悉，DeepSeek的CFO即将到岗，最接近最终人选的是高瓴创投合伙人严文韬，后者目前已经在走离职程序中。另有信源表示，五源资本、红杉资本、龙珠资本等国内多家头部投资机构的负责人都就该岗位与梁文锋进行过交流。但这场围绕核心高管席位的争夺，始终都保持着神秘。多位业内人士认为，应聘是假，借机会交流与沟通，甚至是了解潜在投资机会是真。另据接近DeepSeek的人士透露，梁文锋希望该名CFO是位90后。（凤凰网科技）</p>\n  <p><strong>卫龙进口魔芋粉涉二氧化硫超标被拦截退回，客服：该批原料没有用于任何产品</strong></p>\n  <p>近年来魔芋爽为卫龙核心业务增长点的关键品类，日前一批进口原料“翻车”的话题让卫龙冲上热搜。海关总署披露的信息显示，卫龙从印尼进口的162吨魔芋粉因二氧化硫超标而被拦截。9月14日，卫龙电商平台客服回应北京青年报记者称，该批原料已按法规退回，没有用于任何卫龙产品，与卫龙在售产品无关。</p>\n  <p>针对本次海关拦截原料一事，食品行业专家建议卫龙需正视舆情与品控问题，主动发布官方公告，完整披露问题原料处置流程、排查结果，公开全套检测数据，并引入第三方权威机构复核校验。同时需全面升级供应商准入、抽检与溯源体系，从源头筑牢原料安全防线，挽回公众信任。（新浪新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，9月14日收盘，美股三大指数集体下跌，道指跌0.29%，纳指跌0.56%，标普500指数跌0.48%。大型科技股涨跌不一，英特尔跌超5%，英伟达跌超3%，特斯拉、亚马逊跌超1%；奈飞、谷歌涨超3%，Meta涨超2%，微软涨超1%，苹果小幅上涨。热门中概股涨多跌少，爱奇艺涨超4%，理想汽车涨超3%，网易、拼多多涨超2%，小鹏集团涨超1%；富途控股跌超1%，蔚来，阿里巴巴小幅下跌。</p>\n  <p><strong>债券和股票融资在社融资增量占比已超过贷款</strong></p>\n  <p>根据测算，今年前8个月，债券和股票融资在社会融资规模增量中的占比升至50.31%，已超过贷款占比，较五年前同期高出近20个百分点。其中，企业债券在社会融资规模增量中的占比升至11.67%，较上年同期提升约5.8个百分点。（证券时报）</p>\n  <p><strong>被罗永浩吐槽后，野人先生当天涨粉超3万</strong></p>\n  <p>9月12日下午，罗永浩发博说在机场尝了最近爆火的冰淇淋品牌野人先生，\"很一般，考虑到价格甚至可以说难吃，它是怎么火起来的\"，还补刀\"比钟薛高难吃多了，怀念钟薛高\"。他特意在文末标注：这只是消费者的正常评价，\"请千万不要惹我\"。</p>\n  <p>罗永浩吐槽野人先生事件后，野人先生账号当天涨粉3万、近30天涨粉40万，目前品牌官方尚未回应。工作人员表示会将问题反馈领导。评论区网友：不要回复。（中国蓝新闻）</p>\n  <p><strong>英伟达、Palantir等据报限制使用OpenAI和Anthropic最先进AI模型</strong></p>\n  <p>9月14日，据报道，英伟达、Palantir和Booz Allen Hamilton正要求OpenAI、Anthropic提供新的安全保障，并减少或停止使用两家公司最先进的AI模型。据报道，Palantir已说服Anthropic承诺对所有模型提供“不可撤销”的零数据保留（ZDR）保障。部分企业正转向使用自研AI模型处理更敏感的业务任务。</p>\n  <p><strong>胖东来新员工实行四年合同制，到期后不续签</strong></p>\n  <p>9月13日，胖东来创始人于东来发文称，“今后！胖东来再招员工都会是学员性质。公司尽力培养员工学习懂得科学文明的生活理念和生活方式、学习独立人格和相关技术！合同四年、不续签、走向社会、努力为社会培养更多优秀人才，特别专业留企做像老师一样的培训师傅！希望这个群体做事品质生活轻松阳光、更多人像光一样能为社会带来更多美好的力量！”于东来还在评论区表示，未达到目标的员工没有合格证书，未来可以在胖东来网上公开查询到此类信息。（北京日报、澎湃新闻）</p>\n  <p><strong>广汽集团回应紧急停牌，因重要事项未公告A+H股双双临停</strong></p>\n  <p>9月14日上交所停复牌信息显示，广汽集团（601238）因重要事项未公告，9月14日全天停牌。同日，广汽集团港股盘前亦临停，截至早盘竞价结束，大幅高开8.64%，报2.325港元/股。广汽集团工作人员回应称：“停牌是今天上午紧急发生的，因为今天收市后将发布一个重要公告，但具体时间待定，公告内容暂时无法透露。”对于周末发酵的“一汽与广汽将进行持股联营或战略重组”传闻，广汽集团未予回应。（财联社、第一财经）</p>\n  <p><strong>iPhone 18 pro“跌”至9099元，不支持无理由退货</strong></p>\n  <p>9月10日，Apple正式发布iPhone 18 Pro系列及首款折叠屏iPhone Duo。14日上午，有电商平台上的iPhone 18 Pro价格直降900元，256G的iPhone 18 Pro售价9099元。记者注意到，该平台要求现场签收，配合快递人员拆封、激活，激活后不支持7天无理由退换货。对此，钱江视频记者咨询了客服人员，其表示该产品因有现场签收要求，拆封激活后不支持7天无理由退货，但如果拆封后有质量问题，可凭官方检测单7天退15天换。（钱江视频）</p>\n  <p><strong>程序员运行代码删掉公司89TB数据，获刑五年十个月</strong></p>\n  <p>算法工程师王某用公司算力干私活，代码运行超17小时后才被运维发现中止，导致AI游戏部门自研文生3D、渲染模型及全部训练数据共89TB被删，模型训练系统瘫痪，研发项目全部停摆。后公司报警，王某获刑五年十个月，赔偿20.4万元。系北京市首例破坏人工智能模型刑事案件。（央视网）</p>\n  <p><strong>苹果客服回应iPhone 17大降价：目前苹果官方网站并未发布任何降价通知</strong></p>\n  <p>9月14日，iPhone17大降价登上热搜，iPhone 17标准版在部分苹果授权店叠加优惠和国补后可低至5499元，相当于便宜1300元；iPhone 17 Pro标准版则能便宜500元。对此，苹果客服回应称：“目前苹果官方网站并未发布任何降价通知。”对于第三方渠道的降价行为，客服提醒消费者需警惕风险。</p>\n  <p>此外，客服确认iPhone 17 Pro和iPhone 17 Pro Max已在官方渠道下架，但线下苹果直营零售店可能仍有部分库存，具体价格需到店咨询，因官方目前未提供指导价。苹果方面建议消费者优先选择官方渠道，以确保产品质量与售后权益。（中新经纬）</p>\n  <p><strong>三星、海力士拒绝韩国电力25万亿韩元预付款计划</strong></p>\n  <p>9月14日，据报道，三星电子和SK海力士已拒绝韩国电力公司提出的两家公司合计预付25万亿韩元电费、分5年支付的提议。报道称，两家公司认为，在行业未来环境存在不确定性的情况下，提前支付巨额款项可能会对其中长期业务战略造成负担。韩国电力曾提议三星和SK海力士分别预付20万亿韩元和5万亿韩元电费，并表示这些预付款资金将主要投资于核心电网基础设施。（财联社）</p>\n  <p><strong>特朗普访爱期间取消爱尔兰威士忌关税</strong></p>\n  <p>美国总统唐纳德・特朗普周日宣布，取消对爱尔兰威士忌征收的关税，以此恢复爱尔兰威士忌与苏格兰、北爱尔兰威士忌之间的公平竞争环境。这项出人意料的声明，是在他为期两天的爱尔兰访问行程尾声发布。（新浪财经）</p>\n  <p><strong>迈克尔·戴尔家族办公室据报牵头77亿美元收购Baldwin</strong></p>\n  <p>迈克尔·戴尔旗下家族办公室DFO Management与Sequence Holdings组成的财团，接近达成将美国保险经纪商The Baldwin Group私有化的协议。据知情人士，拟议报价为每股32.50美元，对应企业价值约77亿美元；若最后阶段未出现障碍，交易可能很快公布。（新浪财经）</p>\n  <p><strong>现代汽车集团据报暂不考虑明年推动波士顿动力IPO</strong></p>\n  <p>据报道，现代汽车集团旗下人形机器人公司波士顿动力明年不太可能进行首次公开募股（IPO）。现代汽车集团高管表示，波士顿动力尚未实现旗舰产品Atlas的大规模部署，目前仍处于亏损状态。现代汽车集团尚未公开披露波士顿动力潜在上市的时间表或估值目标。（界面新闻）</p>\n  <p><strong>法国就15岁以下未成年人社媒禁令向欧盟提交新版法案</strong></p>\n  <p>当地时间9月14日，法国总统马克龙在社交媒体发文宣布，法国政府当天已向欧盟委员会通报禁止15岁以下未成年人使用社交媒体的新版本法案。此前，法国宪法委员会以相关规定对青少年言论和通信自由构成“过度侵犯”为由，于8月否决了原法案。新方案不再直接列出禁止使用的社交媒体平台，而是拟对约10项具有危害性或成瘾性的功能进行限制，包括视频自动播放、夜间推送通知、与陌生账号交流等。同时，该方案允许13岁至15岁未成年人在法定监护人同意的情况下获得豁免。（央视新闻）</p>\n  <p><strong>加拿大总理将访欧，寻求欧盟“准成员国”特殊地位</strong></p>\n  <p>加拿大总理卡尼将于9月15日至17日访问法国斯特拉斯堡和英国利物浦，寻求进一步加强与欧洲的关系。据美国方面13日消息，卡尼此行寻求加拿大获得欧盟“准成员国”的特殊地位。（央视新闻）</p>\n  <p><strong>亚马逊计划在迈阿密空难后暂停与21 Air合作</strong></p>\n  <p>当地时间9月13日，亚马逊公司在其新闻博客上表示，在上周末发生那起悲剧性事件后，公司决定暂停与21 Air的运营合作，该公司是7598号航班的运营商。亚马逊发言人Kelly Nantel表示，公司将继续支持相关调查。据央视新闻报道，当地时间9月6日下午2时左右，美国亚马逊公司一架从波多黎各起飞的波音767-300型货运飞机在迈阿密国际机场着陆时冲出跑道，引发大规模紧急响应，机场暂停运营。迈阿密-戴德县警察与消防部门联合举行发布会表示，事故目前已造成至少5人死亡、5人受伤。（新浪财经）</p>\n  <p><strong>美光、闪迪赴韩争抢半导体核心人才，三星加码薪酬与股权激励应对挖角</strong></p>\n  <p>据媒体报道，半导体竞争的主战场，已经转向人才争夺战。三星电子为守住市场龙头地位，不得不着手保护核心人才；与此同时，美光、闪迪等全球竞争对手也涌入韩国，争抢高带宽内存（HBM）与NAND闪存设计人才。能否抢到足够多、能左右技术差距的核心人才，已经成为下一代存储器市场的胜负关键。三星电子正通过提高绩效奖金、扩大股权奖励予以应对。今年上半年，员工数量较去年小幅减少，但薪酬总额、账面薪酬成本等指标均出现上涨。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>铠侠据悉考虑赴美上市融资100亿美元</strong></p>\n  <p>据报道，铠侠考虑在美国上市，拟融资100亿美元。知情人士称，铠侠一直在与美国银行、高盛和摩根大通洽谈。（财联社）</p>\n  <p><strong>Anthropic据报仍计划2026年上市，AI安全争议未改变IPO计划</strong></p>\n  <p>9月14日，据报道，人工智能公司Anthropic仍可能于2026年进行首次公开募股（IPO），并已决定选择纳斯达克上市。尽管近期AI安全、产品责任和监管问题受到关注，这些因素目前并未改变公司的上市计划。据报道，Anthropic认为，成为上市公司后接受更高程度的信息披露和外部监督，反而有助于提升AI安全透明度。公司仍需要通过资本市场筹集资金，短期内推迟IPO并依靠私募融资虽可行，但长期退出资本市场并不现实。（界面新闻）</p>\n  <p><strong>印度汽车零部件厂商Victura选定罗斯柴尔德担任3亿至4亿美元印度IPO顾问</strong></p>\n  <p>据印度媒体《Mint》援引两位不愿具名知情人士消息报道，汽车零部件厂商Victura集团选定罗斯柴尔德作为顾问，统筹其印度上市事宜。消息人士透露，Victura已与投行开展初步磋商。公司预计在未来数月敲定相关中介机构，有望于明年晚些时候上市。募资所得资金或将用于业务扩张。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>智谱完成约50亿美元融资</strong></p>\n  <p>9月13日，智谱（02513.HK）宣布完成约50亿美元融资，包括约20亿美元股份配售及约30亿美元可转债发行，此次融资主要用于下一代GLM模型、完全自训练体系及相关算力基础设施。根据公告，智谱股份配售价为每股714港元，较公告前收盘价折让约9.96%，配售股份占扩大后已发行股本约4.50%。可转债采用零息结构，发行价为本金的100.5%，到期按本金赎回；初始转股价为每股892.50港元，较配售价溢价25%，较公告前收盘价溢价约12.55%。</p>\n  <p>零息与溢价发行的组合，是本轮融资的重要信号。随着研发预算与资金安排进一步明确，智谱持续开展训练实验、推进模型迭代和完善算力体系的资本基础得到增强，为参与下一阶段全球前沿模型竞争增加了筹码。（每日经济新闻）</p>\n  <p><strong>“量域芯创”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，“量域芯创”近日已完成数千万元天使轮融资，本轮由金雨茂物领投，杭州高新投、藕舫天使、国信通联、海南高第等机构跟投。资金将主要用于大冷量低振动湿法稀释制冷机、低温测控芯片及低温柔性带状线缆三大核心产品的研发与迭代。</p>\n  <p><strong>“兆默真空”完成亿元A轮融资</strong></p>\n  <p>36氪获悉，近日，“兆默真空”宣布完成亿元A轮融资，由中科创星领投，哇牛资本、凯风创投、正景资本跟投，老股东上海半导体产投持续加注。融资资金将主要用于产能扩充、核心技术研发迭代、市场开拓及团队建���。</p>\n  <h2>酷产品</h2>\n  <p><strong>豆包手机助手发布消费者版本，首款新机将于9月16日正式开售</strong></p>\n  <p>36氪获悉，9月14日，豆包手机助手消费者版本正式发布。豆包手机助手以豆包App为基础，与手机厂商在系统层面展开合作，围绕交互、任务执行、本地记忆及检索等核心体验，进一步探索AI在手机中的应用。</p>\n  <p><strong>特斯拉Cybercab将在国内亮相，仅为静态展示</strong></p>\n  <p>9月14日，特斯拉宣布，赛博无人驾驶电动车Cybercab将于9月17日-27日在北京、上海公开亮相，地点分别为北京华贸特斯拉体验店和上海兴业太古汇LG1层北厅。特斯拉提醒，此次仅为静态展示。产品及服务在不同区域的上市情况受推出计划、法规要求、监管机构批准等因素影响，请以当地市场实际法规要求和最终发布为准。（新浪科技）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_2d3f56c8cd834e2a88ee505d4c409dfb@5667365_oswg685421oswg1080oswg633_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>古尔曼称苹果将推出iPhone Duo Max，未来还有SE和Mini</strong></p>\n  <p>近日彭博社记者马克·古尔曼在最新一期《Power On》专栏中透露，苹果将在未来几年推出iPhone Duo Max机型，并解读了苹果最终选用“Duo”作为后缀、放弃其他名称的原因。</p>\n  <p>据TechWeb报道，古尔曼明确提到，iPhone Duo Max是最有可能率先到来的衍生机型，将配备更大的屏幕尺寸，面向追求平板级视觉体验的用户群体，更适合视频观看、游戏和多任务处理。此外，古尔曼还预测苹果可能推出配置精简的iPhone Duo SE，以更低售价吸引预算敏感型消费者；以及采用翻盖式设计的iPhone Duo Mini，主打便携性。（IT之家）</p>\n  <p>&nbsp;</p>\n  <p><strong>“存钱心态”小调查</strong></p>\n  <p>现在的年轻人，似乎总在为存钱感到焦虑。每个打工人可能都会立下一个每月存钱的FLAG，但，实现了多少呢？</p>\n  <p>工资到账，还完花呗交完房租，余额就没剩多少；刷会社交媒体，直播间出来钱包就又瘪了一圈；省吃俭用一个月，出门滑个雪就努力清零……“我也没买啥啊，我钱呢？”这成了当代年轻人的未解之谜。</p>\n  <p>你现在有存钱的习惯吗？存钱的最大阻碍来自哪里？欢迎填写“年轻人存钱行为小调查”，聊聊你的存钱态度和成果~</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_7fce615d04494c06aad28898cce4e142@5667365_oswg22913oswg389oswg395_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">小调查</p>\n  <p><strong>整理丨王浩阳</strong></p>", "category": "tech", "published_at": "2026-09-15T00:03:39+00:00", "fetched_at": "2026-09-15T03:06:25.828581+00:00", "fingerprint": "3b4511f41fc90b1b"}, {"source": "36氪 - 最新文章", "title": "前高通算法研发经理跨界AI算力板检测，获近亿元战略投资丨36氪首发", "url": "https://36kr.com/p/3983995421440769?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_2172732829d244f3b1e044ce36b54a27@6221844_oswg560754oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2500</strong>字，建议阅读<strong>5</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，深圳康微视觉技术有限公司（以下简称“康微视觉”）近日已完成近亿元Pre-A轮融资。本轮由南京精智达清源投资基金领投，川商基金及老股东清源资本跟投，投中资本担任独家财务顾问。资金将主要用于扩充研发与运营团队、扩大产能以应对爆发式订单增长，以及下一代产品与技术平台的研发。</p>\n  <p>康微视觉2019年成立于深圳，是一家专注于高端泛半导体光学检测设备的高新技术企业。核心团队多毕业于西安交通大学与华中科技大学，创始人兼CEO张晖拥有近20年算法芯片化与产品化经验，曾任职高通负责芯片算法研发，后以CTO身份联合创立智能驾驶公司前向启创，该公司于2019年被上市公司收购。团队兼具芯片端算法、智能驾驶视觉感知与精密设备落地三重基因。</p>\n  <p>2019年，张晖与团队从被收购的智能驾驶公司退出后，开始寻找新的方向。当时市场上一个被忽视的结构性机会引起了他的注意：全球高端PCB检测设备市场长期由美国康代、奥宝（现KLA）以及台湾牧德科技、由田新技��家上市公司垄断，四家合计年营收超过30亿元。</p>\n  <p>与此同时，AI算力爆发正推动PCB产业向高阶HDI、IC载板方向升级，线路越来越细、层数越来越多、微孔密度越来越大，传统的2D检测手段已无法满足三维缺陷检测需求。</p>\n  <p>需求的爆发源于AI算力基建带来的检测标准升级。张晖观察到：“以前高端PCB的3D检测主要在实验室做抽检，一个料号可能只抽一张板。现在英伟达要求每一张板都需要用3D来检，检测量从抽检变成了全检。”</p>\n  <p>而康微视觉团队此前的技术积累恰好与之重叠。张晖告诉硬氪：“智能驾驶的核心是基于视觉感知做车辆、行人、车道线的识别，同时也涉及视觉与激光雷达深度图的融合。高端半导体的AOI检测正在从2D走向3D，我们在智能驾驶中积累的AI算法、多传感器融合经验，可以迁移过来。”</p>\n  <p>团队花了前三年时间与设备公司合作提供核心算法方案，以此补齐设备工程化经验，2022年正式推出自主品牌设备，2024年实现规模化订单签约及量产交付。</p>\n  <p>目前康微视觉的核心产品线涵盖四大方向：纯3D AOI、2D+3D Hybrid混合AOI、微孔检测设备以及成品外观检查设备。其中最具差异化竞争力的是2D+3D混合成像技术。</p>\n  <p>此前业界通常将2D AOI与实验室级3D设备分开使用，但康微视觉创新性地将原本应用于半导体领域的线扫式光谱共焦传感器引入高端PCB检测，在一台设备上同时完成表观缺陷（如油墨异色、色差）与三维形貌（如断差、凹陷）的检测，且效率基本匹配。</p>\n  <p>张晖解释：“近两三年新型3D传感器出现，速度和精度能够与2D做到匹配，这让我们能够把实验室设备变成产线设备。”</p>\n  <p>在AI应用层面，康微视觉与市面上常见的“外挂式”AI方案有本质区别。多数第三方AI公司仅将深度学习作为插件放置在AOI设备后端做缺陷复判，而康微视觉从资料解析、特征提取到缺陷分类的整个检测链条中均内嵌自研AI框架，包括基于模板差分融合的TempDCF网络、主动负样本挖掘的DHNM框架等。在具体性能指标上，3D检测精度可达±1微米，检出率超99.9%，误检率控制在5%以内。</p>\n  <p>据张晖透露，公司2026年营收较前一年度预计实现数倍增长。目前公司已进入国内多家千亿级PCB上市公司的供应链，终端客户覆盖英伟达、谷歌、华为等全球头部科技公司。</p>\n  <p>对于市场竞争格局，张晖认为康微视觉已跨越单纯的国产替代阶段。“我们在AI算力板这个细分领域，跟海外厂商相比不是追赶，而是拉出了一个代差。我们在头部客户那里迭代了几年，设备速度比过去的产品快几倍，精度提升几倍，价格还更有优势。”在他看来，AI算力基建不仅拉动了设备数量需求，更重塑了检测设备的技术门槛，这恰恰是具备AI原生能力的新玩家的机会窗口。</p>\n  <p>谈及AI算力升级对行业的进一步影响，张晖表示康微视觉在高端PCB检测的基础上，正将创新技术拓展至其他AI算力核心器件的检测，以弥合客户全面升级的检测需求与传统设备能力之间的断层。目前在光模块检测等领域，已经完成了相应产品的开发。</p>\n  <p><strong>以下为硬氪与康微视觉创始人张晖的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：康微视觉的核心壁垒是什么？</strong></p>\n  <p><strong>张晖：</strong>首先是先发优势带来的数据与场景积累。我们在AI算力板检测上与头部客户深度绑定、快速迭代，设备速度与精度已经与竞品拉开一个代差。其次是全栈自研能力，从光学模组、运动控制到AI算法，我们都自己掌握。第三是量产交付能力，高端PCB产线对设备稳定性要求极高，我们通过了头部客户严苛验证并持续复购，这不是短期能复制的。</p>\n  <p><strong>硬氪：AI技术对半导体检测行业的改变究竟有多大？</strong></p>\n  <p><strong>张晖：</strong>改变是结构性的。传统AOI基于专家系统和逻辑规则，面对越来越复杂的板子，误报率、漏检率急剧上升。我们从底层就用AI做特征提取和目标检测，框架完全是深度学习原生的。另外，AI算力需求本身也在倒逼检测设备升级，英伟达这类客户把全检变成标准，传统设备根本接不住这种量级和精度的要求，这就是我们的窗口期。</p>\n  <p><strong>硬氪：下一阶段的主要挑战是什么？</strong></p>\n  <p><strong>张晖：</strong>我们目前面临的最大挑战集中在两个层面。首先是交付能力的考验。面对爆发式的订单增长，保证稳定供货是首要任务。我们现有产能约为年产200台，目前产线已接近满负荷运转，为此我们正计划将产能扩充至年产500台，这一目标预计在三年内完成，产线将继续保留在深圳。其次是产品和市场的纵深拓展。在研发端，我们将持续提升AI算力板检测设备的性能，巩固技术代差优势，并以此为基础，向日本揖斐电、台湾三大载板巨头等世界级客户渗透。</p>\n  <p>同时，我们会依托本轮领投方精智达清源基金在半导体产业内的资源，向技术壁垒更高的先进封装检测领域延伸，目前我们正与韩国技术团队合作，共同开发针对HBM等先进封装场景的检测方案。在市场端，我们计划将海外营收占比从目前的10%（主要覆盖台湾、韩国、东南亚）逐步提升至30%左右，真正实现从“国产替代”到“全球领跑”的跨越。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>本轮领投方精智达清源基金表示：</strong>我们坚定看好AI算力硬件迭代背景下的检测设备新机遇。高阶HDI与IC载板作为AI服务器良率命门，其微孔与线路检测与量测精度直接决定整板可靠性上限。康微视觉是国内稀缺的高阶HDI/IC载板3D-AOI全栈方案提供商，在全球率先突破难度最大的3D图形填孔检测，亦是极少数满足头部AI硬件厂商整板全检要求的设备商，已全面实现对海外巨头的弯道超车，获得多家PCB巨头认可。我们将持续在技术迭代、生态协同及规模化发展等方面为公司赋能，并助力公司进一步切入光模块检测与Wafer 3D检测等前沿赛道，打开更广阔的成长天花板。</p>", "category": "tech", "published_at": "2026-09-15T01:30:16+00:00", "fetched_at": "2026-09-15T03:06:25.828572+00:00", "fingerprint": "f24f3232184a6fe7"}, {"source": "36氪 - 最新文章", "title": "58秒出杯，能拉花的咖啡机器人，在全球70国卖出600万杯", "url": "https://36kr.com/p/3984040347139078?f=rss", "summary": "<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;文&nbsp;|&nbsp;冯亚玲、杨越欣</p>\n  <p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;编辑&nbsp;|&nbsp;阿至</p>\n  <p>点单、萃取、拉花、出杯，机械臂一气呵成，不到1分钟，一杯定制拉花图案的咖啡从玻璃窗中递出。2026年8月北京世界机器人大会现场，这台高约两米，宽约一米五的氦豚机器人“咖啡馆”COFE+吸引到不少参展观众的注意。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_4825e1dc0ab2485198346e95abda8f91@6244039_oswg96656oswg1080oswg1071_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">COFE+北美（得克萨斯州）客户在儿童医院点位制作的3D打印咖啡</p>\n  <p>氦豚机器人成立于2018年，是国内较早进入咖啡机器人赛道的企业之一。与行业内多数企业“拿着技术找场景”的路径不同，2017年开始，氦豚机器人从场景需求倒推技术研发，8年间产品迭代8次。</p>\n  <p>传统咖啡店中，房租、人工、装修摊销合计占总成本的60%至70%，并且面临上涨压力。<strong>相比之下，氦豚机器人的“移动咖啡馆”在保证咖啡口感和拉花效果的前提下，投资成本仅为其70%左右。</strong></p>\n  <p>目前产品已落地全球近4000个点位，包括美国哈佛大学、麻省总医院、新加坡国立大学、丹佛机场、吉隆坡机场、谷歌总部，以及达沃斯论坛、全国两会等会议现场，累计完成600万杯饮品产出。</p>\n  <p><strong>1.自研机器人零部件，可定制拉花图案</strong></p>\n  <p>2018年决定做咖啡机器人时，氦豚机器人依据的不是技术判断，而是产业经济学判断：“不是我们给机器人找咖啡场景，是咖啡这个行业本身就需要更自动化的方式。”氦豚机器人联合创始人韩非子表示，“我们不单纯追逐技术热点，而是以打造长久稳定干活的新生产力为目标。”</p>\n  <p>他算了一笔账：星巴克、瑞幸等咖啡馆的成本结构中，房租、人工和装修摊销折旧占到总成本的60%-70%，并且还在持续上涨。与此同时，能稳定拉花的咖啡师普遍培训成本高但流动率高。</p>\n  <p>而咖啡作为全世界工业化程度最高、标准化程度最高的饮品之一，消费频次高、工艺工序成熟，口感可量化，磨豆、萃取、打奶泡等流程的工具已经实现一定程度工业化，本身就具备被机器人替代的产业基础。</p>\n  <p>2019年上半年，氦豚机器人第一台样机在上海长宁区一栋写字楼落地，但投入使用后出现很多问题：消费者不知道怎么使用，无法分辨哪杯是自己的，不知道下单后要等多久。</p>\n  <p>除了市场端使用体验的不足，生产端也没有现成的供应链可用。以往外带咖啡均由咖啡师手动完成扣盖动作，市面上没有自动压盖机的需求；机器人的糖浆机和制冰机如何精准控制比例也需要解决。</p>\n  <p>于是氦豚机器人只好自己设计模组，找工厂生产。“自研零部件非常痛苦，但做成了就是护城河。”韩非子说，“我们申请了120多项发明等专利，形成了1200多项技术诀窍和2800多组工艺参数。”</p>\n  <p>供应链问题解决后，氦豚机器人开始在产品迭代上下功夫，不断提高用户体验，到第六代产品时，已经可以支持拉花和定制任意打印图案。</p>\n  <p>韩非子介绍：“拉花能否成功不是动作控制精准与否，而是流体力学的问题。”具体来说，机器人拉花是通过流体力学建模，计算奶泡在浓缩咖啡表面的流动、扩散和堆叠规律，将拉花转化为一组可测量、可计算的物理变量。消费者上传任意图片或文字后，算法实时反推出对应的奶流控制参数，机械臂即可在咖啡表面生成定制化图案。</p>\n  <p>最新推出的第七代咖啡机器人又进一步优化了磨豆萃取参数，在追求出品稳定性之外升级口感。2026年5月虹桥机器人咖啡大赛的人机对决中，第七代产品经专业裁判品鉴，口感维度评分已不低于人类咖啡大师。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260915/v2_8d14bdb87c3b4f86b655842b04f0f029@6244039_oswg111040oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">氦豚机器人“咖啡馆”上海外滩南京路步行街点位</p>\n  <p><strong>2.提供多种售卖模式，投资成本为连锁咖啡店70%</strong></p>\n  <p>目前氦豚机器人在全球已布局4000多个点位，其中仅有40个为直营店，用于产品测试和收集用户反馈，其他点位由B端合作伙伴负责本地化运营。<strong>“我们不是卖咖啡机器人设备，而是输出可稳定盈利的机器人轻店整体解决方案。”韩非子表示。</strong></p>\n  <p>氦豚机器人与B端客户的合作有5种模式，根据客户的需求灵活匹配：</p>\n  <p>代理模式下，客户使用氦豚机器人的品牌，主要投放到机场、旅游景点等场景。</p>\n  <p>采购模式下，客户购买设备并投放到自有物业。</p>\n  <p>定制模式面向大品牌和500强企业，客户可以使用自有品牌，也可以调整机器人产品外观。</p>\n  <p>租赁模式面向金融机构、政府机构、事业单位等不能跨业经营的主体。</p>\n  <p>联营模式面向地标建筑等重要场景，氦豚机器人负责投入设备。</p>\n  <p>氦豚机器人还整合了上游咖啡豆、奶品、糖浆等原物料供应链，基于不同市场对口味进行调整并持续开发新品，在出品口感和种类丰富度上，氦豚机器人对标瑞幸等连锁咖啡品牌。“机器人咖啡馆的本质仍然是咖啡服务，味道才是王道。”韩非子表示。</p>\n  <p>在终端定价上，氦豚机器人根据点位所在地单杯咖啡的价格动态调整，同时保持开店成本控制在连锁品牌门店的70%。</p>\n  <p><strong>3.新兴市场补基建，欧美市场重合规</strong></p>\n  <p>早在2021年，氦豚机器人就已开启出海步伐，第一笔意向订单来自迪拜世博会主办方的50台咖啡机器人采购计划。</p>\n  <p>当时正值疫情期间，中外人员往来需要隔离28天，设备出关流程繁琐，海外现场调试难度大。虽然亮相迪拜世博会可能会赔钱，但韩非子决定克服一切困难：“这是验证产品在其他国家真实场景中的难得机会，比如不同气候、电压、支付体系和消费习惯下的适配性。”</p>\n  <p>借此契机，氦豚机器人成立专门的海外团队，此后三年间，在不同国家小批量投放产品，检测产品稳定性并收集一线运营数据。</p>\n  <p>韩非子列出的待验证问题包括：<strong>在巴西这样的潮湿国家，电路和物料受潮怎么办？在中东干燥多静电的环境下，精密传感器会不会受干扰？日本的小店、小门、窄通道环境下，设备带轮子能不能自由进出？当地水质软硬、矿物质含量不同，会不会影响咖啡最终的口感？</strong></p>\n  <p>产品在不同环境下实现稳定运转、各国认证陆续拿全、远程售后体系建立起来后，韩非子判断，公司已经具备了大规模拓展海外市场的条件。</p>\n  <p>东南亚、中东等新兴市场是氦豚机器人率先切入的区域。</p>\n  <p>这些地区咖啡消费处于增长期，机会多，但是基础设施条件相对“落后”。比如部分中东国家仍以现金为主要支付方式，东南亚各国的移动支付平台则各自为政，导致设备进入不同国家时，需要对接多个不同的支付系统。</p>\n  <p>其次，不少地区的通信网络仍停留在2G-4G阶段，网络不稳定、网速慢，部分网络不支持IoT设备连接，直接限制了依赖远程运维和数据传输的机器人设备的正常运行。为此氦豚机器人专门引入相应人才，研发出AI智能调配的微通讯系统，实现“一机行全球”。</p>\n  <p>在欧美、日韩等成熟市场，氦豚机器人又面临另一种困难。这些市场的消费者虽然对无人设备的接受度较好，但也对咖啡品质有更高要求，合规标准也更严格。</p>\n  <p>以食品接触材料为例，与咖啡、牛奶、水直接接触的萃取头、奶管、水箱、杯架等部件，必须分别符合美国FDA、欧盟EC1935/2004、日本食品卫生法标准，并通过迁移测试，确保有害物质不会进入饮品。</p>\n  <p>设备清洁方面，奶路系统需要有标准化的高温消毒流程和可追溯的清洁记录，无人设备还须具备自动清洁和到期提醒机制；在国际机场、医院等国家部委对食品卫生、消防顶格管控的地方，也需要具备防毒、防疫、防火等更高功能。</p>\n  <p>为达到这些苛刻要求，氦豚机器人将合规能力前置到产品设计阶段，而非进入市场后再补证。咖啡产品对标专业级咖啡馆的监管要求，操作、耗材、清洗全链路可溯源，保证每一杯咖啡的制作数据都可以追溯到具体的物料批次和设备运行参数。</p>\n  <p><strong>截至2026年8月，氦豚机器人的COFE+已覆盖全球70个国家和地区，落地超200座国际城市。</strong></p>\n  <p>韩非子总结，海外市场的本地化适配分为两个层面：语言界面、菜单配方、支付方式、品牌色彩、拉花图案和饮品种类等软件与内容层，不影响设备结构，较易实现。</p>\n  <p>电压、插头、当地认证、水路、水质、耗材等接口与合规层则需要转换为适配本地标准，这背后的运动控制、流体算法、机体机构本体等核心部件保持全球统一。“在结构底层做定制，企业后期一定会混乱，售后体系会埋下巨大隐患。”韩非子解释。</p>\n  <p>在他的定义里，氦豚机器人不是一家机器人公司，而是一家新消费公司。“氦豚机器人瞄准的是新经济、新业态、新模式，用机器人技术重构咖啡这门传统生意的成本结构和消费体验。”</p>\n  <p>未来氦豚机器人将向零部件更少、覆盖品类更多、消费体验更强、更智能的方向迭代，海外业务则进一步深耕本地化和精细化运营。“我们希望重新发明咖啡馆，推动咖啡消费步入轻店时代。”他说道。</p>", "category": "tech", "published_at": "2026-09-15T02:21:01+00:00", "fetched_at": "2026-09-15T03:06:25.828556+00:00", "fingerprint": "4835c0e90b02dd84"}, {"source": "少数派", "title": "众测招募｜泡泡骚 Low Pro：给新 iPhone 添一件极简「背心」", "url": "https://sspai.com/post/114410", "summary": "每年九月都是苹果用户最期待的时节——苹果发布新一代iPhone。当新机到手，你可能也要随之给手上的配件更新换代。巧了，这一次，少数派给大家带来了一款颠覆以往所有磁吸支架形态的产品，它够薄、够轻、够好用 ...<a href=\"https://sspai.com/post/114410\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-14T03:00:00+00:00", "fetched_at": "2026-09-15T03:06:24.038997+00:00", "fingerprint": "9bb42e21501f4e47"}, {"source": "少数派", "title": "新 iPhone 相机如何记录照片真实性？开发者视角的猜想和尝试", "url": "https://sspai.com/post/114453", "summary": "照片能证明它被拍过，但不能证明镜头前是真的。<a href=\"https://sspai.com/post/114453\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-14T07:16:23+00:00", "fetched_at": "2026-09-15T03:06:24.038990+00:00", "fingerprint": "b6f6b585a305eb36"}, {"source": "少数派", "title": "Excel AI 辅助工作流横评：数据分析高手还是照葫芦画瓢？", "url": "https://sspai.com/prime/story/ai-assisted-spreadsheeting-a-survey", "summary": "用具体的测试数据和盲评结果，聊聊当下 AI 辅助制作 Excel 的真实水平，以及我使用 AI 辅助制作 Excel 的心得。<a hr e Units are a band I discovered in part thanks to No Dogs in Space. During their miniseries on The Screamers (another incredible band worth checking out), they mention synthpunk.org as one of their sources. And there's no better way to get my attention than to combine two of my favorite things - punk rock [&#8230;]", "category": "tech", "published_at": "2026-09-13T17:36:10+00:00", "fetched_at": "2026-09-14T03:04:24.468825+00:00", "fingerprint": "c7a491448b2a22c5"}, {"source": "The Verge", "title": "Apple is reportedly working on iPhone game controllers", "url": "https://www.theverge.com/tech/994426/apple-iphone-game-controllers", "summary": "Bloomberg's Mark Gurman says Apple is developing two game controllers for the iPhone and will likely sell them under the Beats brand. Rumors that Apple might enter the game controller business have circulated for some time. But last week, MacRumors reported finding two references in macOS 26.7's code to two game controllers identified as first-party [&#8230;]", "category": "tech", "published_at": "2026-09-13T18:30:16+00:00", "fetched_at": "2026-09-14T03:04:24.468820+00:00", "fingerprint": "499803bcd27c8772"}, {"source": "The Verge", "title": "Trump and Mike Johnson think the AI industry is overreacting", "url": "https://www.theverge.com/ai-artificial-intelligence/994441/trump-mike-johnson-ai-industry-overreacting", "summary": "Yesterday, Anthropic CEO Dario Amodei published a lengthy open letter saying it was time to \"pace the frontier\" and slow down AI development. OpenAI's Sam Altman and Elon Musk both agreed, publicly voicing their support on X. Even Alphabet's Demis Hassabis offered tentative support for Amodei's proposal. Donald Trump and House Speaker Mike Johnson, however, [&#8230;]", "category": "tech", "published_at": "2026-09-13T19:41:48+00:00", "fetched_at": "2026-09-14T03:04:24.468811+00:00", "fingerprint": "395acc6e88d3562e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨创始人及员工被恶意造谣，月之暗面：已报案；25位菲尔兹奖得主就AI侵入数学联合发出警告；智谱宣布融资50亿美元", "url": "https://36kr.com/p/3982504266349314?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>奥尔特曼：OpenAI年内不会IPO</p>\n  <p>韩国股市正式开启夜盘，交易延长至晚上8点</p>\n  <p>沐曦股份本周解禁超68亿元</p>\n  <p>DeepSeek灰度测试AI语音对话</p>\n  <p>胖东来新员工实行四年合同制、不续签</p>\n  <p>罗永浩炮轰野人先生冰淇淋</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>创始人及员工被恶意造谣，月之暗面：已报案</strong></p>\n  <p>9月12日，国内AI大模型独角兽月之暗面官微发文称：网传关于创始人及员工的信息纯属虚构，系恶意造谣，公司已第一时间向公安机关报案，将依法追究相关造谣者的法律责任。此前有网传消息提及月之暗面创始人杨植麟和员工涉及相关风波。近期，月之暗面的资本动作频频引发关注。据公开信息显示，月之暗面已经完成工商变更登记，市场主体类型由“有限责任公司”变更为“股份有限公司”，这一股改动作通常被视为企业筹备上市的前置信号。（澎湃新闻）</p>\n  <p><strong>25位菲尔兹奖得主就AI侵入数学联合发出警告</strong></p>\n  <p>当地时间9月11日，陶哲轩、邓煜、彼得·舒尔茨（Peter Scholze）等25位菲尔兹奖得主作为最初签署人，联合发表声明《人工智能在数学中的严重错位》（A Severe Misalignment of AI in Mathematics），警告AI公司与数学共同体之间正在出现“严重错位”。这份声明没有否认AI在数学上的进步，首先承认了一个正在发生的变化：过去几个月，大语言模型的数学能力出现显著提升，已经能够解决多个数学领域的重要未决问题。但问题也由此出现。25位数学家认为，AI公司正在把解决数学问题作为衡量模型能力的基准，而数学共同体真正追求的，并不是尽可能快地得到一道题的答案。（第一财经）</p>\n  <p><strong>智谱宣布融资50亿美元</strong></p>\n  <p>9月13日，智谱（02513.HK）宣布完成约50亿美元融资，包括约20亿美元股份配售及约30亿美元可转债发行，此次所得款项净额主要用于下一代GLM模型、完全自训练体系及相关算力基础设施。根据公告，智谱股份配售价为每股714港元，较公告前收盘价折让约9.96%，配售股份占扩大后已发行股本约4.50%。可转债采用零息结构，发行价为本金的100.5%，到期按本金赎回；初始转股价为每股892.50港元，较配售价溢价25%，较公告前收盘价溢价约12.55%。（第一财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>英伟达拟投Anthropic百亿美元</strong></p>\n  <p>9月12日，据报道，人工智能公司Anthropic正与英伟达洽谈，拟邀请后者成为其首次公开募股（IPO）的基石投资者。Anthropic此次IPO计划募资最高1000亿美元，估值或达约2万亿美元；英伟达考虑投资最多100亿美元。据报道，Anthropic计划在今年11月美国中期选举前完成上市。若成行，英伟达将进一步加深与这一主要客户的合作关系。Anthropic目前高度依赖英伟达GPU，同时也在扩大对亚马逊、谷歌等芯片及算力供应商的合作。（界面新闻）</p>\n  <p><strong>马斯克、奥尔特曼、阿莫代伊：应放缓模型迭代</strong></p>\n  <p>Anthropic公司首席执行官达里奥·阿莫代伊（Dario Amodei）最新表示，人工智能行业需要放缓新模型的开发速度。阿莫代伊9月12日在其博客文章中写道，“我们必须放缓提升AI模型能力的步伐。进展依然会显得非常迅速，而我们必须明智地利用因此获得的时间。”他列举了两个主要因素：AI自我改进的能力，以及本周OpenAI与Hugging Face发生的一起事件——一群AI智能体协同攻击并突破了一个第三方网站。阿莫代伊发表文章后不久，埃隆·马斯克发文称：“达里奥说得对。”OpenAI首席执行官萨姆·奥尔特曼也很快作出回应，表示他同意阿莫代伊关于“我们需要放缓前沿AI发展的步伐”这一观点。（财联社）</p>\n  <p><strong>奥尔特曼：OpenAI年内不会IPO</strong></p>\n  <p>当地时间9月12日，OpenAI CEO山姆·奥尔特曼在一则公开采访中表示：鉴于目前围绕安全问题发生的一切，现在上市并不是一个明智的时机，公司也没有这方面的压力。因此，上市不会发生在2026年，OpenAI还有很多事情要做，比如应对当前形势所要求的安全与对齐工作，以及推动行业和政府开展合作。（第一财经）</p>\n  <p><strong>DeepSeek灰度测试AI语音对话，支持四种音色</strong></p>\n  <p>9月12日消息，DeepSeek灰度测试语音对话，测试到的用户在App右上角会有一个小喇叭按钮。此外，DeepSeek的设置页面会出现一个“朗读音色”选项，用户可以选择四种音色。（IT之家）</p>\n  <p><strong>Anthropic目标估值约2万亿美元</strong></p>\n  <p>路透社12日援引消息人士的话报道称，英伟达公司目前正考虑最高出资100亿美元、参与美国人工智能公司Anthropic首次公开募股。这引发了业内对AI产业循环投资的担忧。据悉，Anthropic 本次IPO最高拟募资1000亿美元，有望超过SpaceX今年6月上市时750亿美元的募资规模。公司目标估值约2万亿美元。如果这一估值得以兑现，Anthropic的估值将超过SpaceX上市时1.77万亿美元的水平，创下全球拟上市企业估值新高。（央视财经）</p>\n  <p><strong>OpenAI“去英伟达化”首个试验品退役</strong></p>\n  <p>OpenAI正在加速淘汰早期模型。近日，OpenAI Codex负责人Tibo （蒂博・索蒂奥，Thibault Sottiaux）宣布，GPT-5.3-Codex-Spark将在下周退役。这款今年2月发布的实验性编程模型，生命周期不足八个月，也成为OpenAI探索Cerebras晶圆级芯片推理路线后首个被淘汰的模型。据悉，GPT-5.3-Codex-Spark于2月12日以研究预览形式推出，定位明确：它是一款更小、更快、专门服务于实时交互式编程的模型，适用于代码编辑、局部修改和定向测试等场景。Spark最特殊之处并非速度，而是运行它的硬件。它采用Cerebras WSE-3晶圆级处理器，是OpenAI首次将生产环境中的模型推理部署到英伟达GPU之外的芯片平台。（第一财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>中国将于明年接任金砖主席国</strong></p>\n  <p>据央视新闻，当地时间9月12日下午，在金砖国家领导人第十八次会晤第一阶段会议上，国家主席习近平宣布，中国将于2027年接任金砖主席国，主办金砖国家领导人第十九次会晤。（第一财经）</p>\n  <p><strong>韩国股市正式开启夜盘，交易延长至晚上8点</strong></p>\n  <p>为应对与美国主要交易所的流动性竞争，并扩大投资者交易机会，韩国股市宣布于9月14日正式开启盘后交易。韩国交易所（简称KRX）日前发布公告称，从9月14日起，上午9时至下午3时30分的常规交易结束后，下午4时至晚上8时将在盘后市场实时成交订单。除部分市场监管品种外，KOSPI和KOSDAQ市场中的大多数股票均可在盘后交易。不过考虑到市场波动性问题，目前交易所交易基金（ETF）、交易所交易票据（ETN）不在可交易范围内。尽管仍存在不少问题，但市场人士总体上支持延长交易时间。因为这样一来，投资者可以更快地对收盘后发布的突发新闻或公司财报作出反应。（第一财经、新浪新闻）</p>\n  <p><strong>沐曦股份本周解禁超68亿元</strong></p>\n  <p>国产GPU企业沐曦股份（688802.SH）即将迎来上市后的首次较大比例限售股解禁。公司9月9日公告称，1396.60万股首发机构配售股份将于9月17日上市流通，按9月11日收盘价489元计算，解禁市值约68.3亿元。就在几天前，同样被称为“国产GPU四小龙”之一的摩尔线程（688795.SH）于9月7日解禁当日股价以20%幅度跌停，解禁以来累计跌幅超过30%，这让市场对沐曦股份此次解禁倍加关注。（第一财经）</p>\n  <p><strong>太乙圣莲拟出资30亿“复活”哪吒汽车</strong></p>\n  <p>破产重整的哪吒汽车迎来新进展。9月11日，合众新能源（哪吒汽车母公司）破产重整案第四次债权人会议以线上形式召开，《重整计划（草案）》显示，浙江太乙圣莲企业管理合伙企业（有限合伙）拟出资30亿元入主，换取合众新能源约70.62%的股权。工商登记信息显示，“太乙圣莲”注册成立于2026年4月，由浙江山子控股有限公司和浙江山子玉虚科技有限公司两家公司合伙组建，前者实控人为深交所上市公司山子高科董事长叶骥，后者实控人为山子高科董办负责人虞舒心。对此，有网友评论“救哪吒还得靠太乙真人”“这公司名‘神’了”。（第一财经）</p>\n  <p><strong>三家具身智能头部企业被同行举报？涉及企业回应</strong></p>\n  <p>有网传消息称，具身智能头部企业千寻智能、星海图、星动纪元或在本月迎来关键大考，近期还遭遇某同行向“主考官”举报，具体举报内容尚未公开。9月13日，千寻智能方面回复称，网传信息不实；星海图媒体对接人表示，暂不清楚相关情况；星动纪元方面表示，暂不作官方回应。（第一财经）</p>\n  <p><strong>胖东来新员工实行四年合同制、不续签</strong></p>\n  <p>9月13日，胖东来创始人于东来发文称，胖东来再招员工都会是学员性质，合同四年、不续签。 “努力为社会培养更多优秀人才、特别��业留企做像老师一样的培训师傅。”此前，胖东来在官网公布了2026年1至6月集团人员流失数据。上半年集团共流失员工52名，人员流失率为0.50%，管理层无一人流失。对比往年数据，2025年，胖东来集团全年共流失人员109人，人员流失率为1.05%；2024年全年流失171人，流失率为2.01%。此外，胖东来官方账号今年5月披露的数据显示，2025年胖东来全年全业态员工平均到手工资为8974元；2026年1至3月，员工平均工资已达到9598元。（每日经济新闻）</p>\n  <p><strong>罗永浩炮轰野人先生冰淇淋：比钟薛高难吃多了，怀念钟薛高</strong></p>\n  <p>9月12日，罗永浩在微博发文称：在机场试了一下，暴得大名的野人先生很一般啊，考虑到价格，甚至可以说难吃。它是怎么火起来的？感觉比钟薛高难吃多了，怀念钟薛高。 罗永浩还表示，这是一个消费者的正常评价和疑问，请千万不要惹我，然后说我下黑手之类的。值得注意的是，此前在钟薛高雪糕刺客争议期间，罗永浩还曾为钟薛高辩护，表示钟薛高按质量算价格没有哈根达斯贵；在价格比哈根达斯便宜的情况下，钟薛高的品质一定是碾压式的好过哈根达斯。（鞭牛士）</p>\n  <p><strong>iPhone 18 Pro系列预售，多平台闪电售罄</strong></p>\n  <p>9月12日晚8点，苹果新品正式开启预售。不到1分钟时间，iPhone 18 Pro系列在多平台便闪电售罄。截至发稿，苹果官网还能正常下单，不过部分热门型号发货时间已大幅延后至9月30日。得物平台显示，iPhone 18 Pro系列部分型号溢价明显，iPhone 18 Pro Max 256GB勃艮第酒红色成交均价12799元，上涨1800元，涨幅16.4%；同为256GB的银色版本成交均价13999元，上涨3000元，涨幅27.3%。（界面新闻）</p>\n  <p><strong>1.8元即可伪造上亿转账截图，支付宝回应</strong></p>\n  <p>9月12日，支付宝安全中心发文：近日，网友爆料一些以假乱真的支付宝App截图，并引发关注。对此，支付宝安全中心提醒，网上流传的所谓App截图不一定可信，请注意甄别。面对潜在风险可做到以下几点：一、认准官方渠道下载支付宝App；二、提醒家人特别是长辈，切勿轻信网上流传的金额截图；三、商家交易时以支付宝实际到账金额为准；也可在支付宝App开通语音提醒，避免被骗。我们也将持续配合相关部门打击网络诈骗行为。此前，多位网友发布“假支付宝APP”转账视频，这类软件仅需1.8元，即可伪造上亿转账截图，甚至暗藏木马病毒盗刷资金。（界面新闻）</p>\n  <p><strong>银河通用严正声明：已报案</strong></p>\n  <p>9月12日，银河通用发布严正声明，全文如下：近期，我公司关注到网络上流传关于银河通用及管理团队的恶意谣言，相关内容均属不实信息。对此，公司已第一时间向公安机关报案，并将依法追究造谣者的法律责任。我们呼吁大家理性辨别信息，不信谣、不传谣。（第一财经）</p>\n  <p><strong>日本半导体公司：要在月球建厂</strong></p>\n  <p>据日本共同社报道，日本半导体公司Rapidus社长小池淳义在美国发表演讲时称，计划2040年前后在月球表面建设半导体工厂。Rapidus成立于2022年8月，由日本政府联合8家日本产业巨头共同出资组建，总部设在东京，核心目标是实现2纳米先进制程芯片的自主量产 。报道称，小池淳义表示，“这不是玩笑，而是认真的计划”，月球表面有半导体制造所需的水资源等。在现场小池淳义还播放了利用人工智能制作的月面工厂构想视频，并称“马斯克应该会喜欢”。（中新经纬）</p>\n  <p><strong>美银警告：真正威胁美国经济的是柴油价格</strong></p>\n  <p>受美伊战争扰乱全球油气供应影响，美国柴油价格上周五突破6美元/加仑大关，再创历史新高。作为支撑货运、农业和供暖等需求的“经济血液”，柴油深度绑定美国经济，会直接影响各类商品物价。美银认为，柴油才是实体经济承受压力的核心节点。自美伊战事爆发以来，柴油价格涨幅超55%，高于汽油40%的涨幅。根据美国汽车协会的数据，本年度涨幅很可能创下有记录以来新高。（第一财经）</p>\n  <p><strong>特朗普敦促美联储降息，表示美国利率应该全球最低</strong></p>\n  <p>美国总统特朗普再次表示，美国应该拥有全球最低的利率。但与此同时，他亲自挑选的美联储主席凯文·沃什正面临越来越大的加息压力。特朗普周日在爱尔兰出席爱尔兰高尔夫球公开赛期间对记者表示：“美国如此强大，我们应该支付全球最低的利率，不管他们那些公式怎么算。”当被问及是否预计美联储将加息时，特朗普说：“我不知道。”（新浪财经）</p>\n  <p><strong>国际油价拉升，黄金白银齐跌</strong></p>\n  <p>9月14日，国际油价集体拉升，国际金银齐跌。截至06:30，布伦特原油期货涨超3%，重回107美元/桶；纽约原油期货涨近3%。现货黄金小幅下跌，回落至4336.17美元/盎司，现货白银跌0.71%。美股股指期货全线飘绿，纳指期货跌超1%，标普500指数期货跌0.51%，道指期货跌0.27%。（第一财经）</p>\n  <p><strong>德国汽车零部件制造商经营130年后申请破产</strong></p>\n  <p>据报道，德国汽车零部件制造商Prinz&amp;Co. Stahlrohre在经营130年后宣布破产，数百名员工面临失业风险。据悉，这家家族企业成立于1896年，目前主要生产高精度钢管，并向全球供应汽车座椅、安全气囊和液压系统相关零部件。临时破产管理人克里斯蒂安·霍尔茨曼表示，欧洲汽车行业长期低迷、原材料和能源价格大幅上涨，以及夏季销售额断崖式下滑，共同导致公司陷入破产。（财联社）</p>\n  <p><strong>Anthropic据称选择在纳斯达克上市</strong></p>\n  <p>当地时间9月13日，据报道，知情人士透露，Anthropic PBC已选择纳斯达克作为其上市场所。据了解筹备工作的人士称，Anthropic正寻求通过IPO筹集与SpaceX相当或更多的资金，此次IPO最早可能于10月进行。（界面新闻）</p>\n  <p><strong>莱茵河低水位或致德国巨额经济损失</strong></p>\n  <p>9月13日，德国莱茵兰-普法尔茨州工商会发言人妮科尔·拉博尔德表示，受持续低水位影响，莱茵河货运能力大幅下降，预计今年将给德国经济造成巨额损失。但损失是否会超过2018年仍有待观察。2018年莱茵河低水位至少造成24亿欧元经济损失。莱茵河承担德国约80%的内河货物运输，是德国工业运输“大动脉”。今年以来，德国多次遭遇高温天气，河流水位持续偏低，严重影响莱茵河货运，一些货船已无法通航，另一些只能空载航行。（央视新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>中远海运重工启动A股IPO辅导</strong></p>\n  <p>证监会网站披露，中远海运重工股份有限公司近日在上海证监局办理上市辅导备案登记，拟在A股IPO，辅导券商为中金公司、招商证券。文件显示，中国远洋海运集团有限公司为公司的控股股东，直接持有公司100.00%的股份。</p>\n  <p><strong>深圳市欢创科技股份有限公司通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，港交所文件显示，深圳市欢创科技股份有限公司通过港交所上市聆讯。</p>\n  <p><strong>罗博特科智能科技股份有限公司通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，港交所文件显示，罗博特科智能科技股份有限公司通过港交所上市聆讯。</p>\n  <p>&nbsp;</p>\n  <p><strong>“存钱心态”小调查</strong></p>\n  <p>现在的年轻人，似乎总在为存钱感到焦虑。每个打工人可能都会立下一个每月存钱的FLAG，但，实现了多少呢？</p>\n  <p>工资到账，还完花呗交完房租，余额就没剩多少；刷会社交媒体，直播间出来钱包就又瘪了一圈；省吃俭用一个月，出门滑个雪就努力清零……“我也没买啥啊，我钱呢？”这成了当代年轻人的未解之谜。</p>\n  <p>你现在有存钱的习惯吗？存钱的最大阻碍来自哪里？欢迎填写“年轻人存钱行为小调查”，聊聊你的存钱态度和成果~</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_6bfe32085f8641c78c752b792005a197@5667365_oswg22913oswg389oswg395_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“存钱心态”小调查</p>\n  <p><strong>整理丨</strong>昌怡&nbsp;</p>", "category": "tech", "published_at": "2026-09-14T00:15:06+00:00", "fetched_at": "2026-09-14T03:04:24.389064+00:00", "fingerprint": "8e2c7d2d9494d2c3"}, {"source": "36氪 - 最新文章", "title": "自研全球首个全栈式低温测控平台，这家量子上游企业获数千万天使轮融资丨36氪首发", "url": "https://36kr.com/p/3982562541894656?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260914/v2_e481964567674fc2b9529b3608e22bba@6221844_oswg82449oswg1536oswg870_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2900</strong>字，建议阅读<strong>7</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，杭州量域芯创科技有限公司（下称“量域芯创”）近日已完成数千万元天使轮融资，本轮由金雨茂物领投，杭州高新投、藕舫天使、国信通联、海南高第等机构跟投。资金将主要用于大冷量低振动湿法稀释制冷机、低温测控芯片及低温柔性带状线缆三大核心产品的研发与迭代。</p>\n  <p>量域芯创成立于2026年6月，定位为新一代千级、万级量子比特全栈式低温测控平台提供商。</p>\n  <p>公司创始团队来自浙江大学、中船鹏力超低温、中科富海、清华大学、北京量子院、中国科学技术大学、复旦大学、上海科技大学等顶尖科研单位和产业龙头。创始人兼CEO尹成厚为华中科技大学、浙江大学低温专业背景，曾在中船鹏力超低温深度参与稀释制冷机、氦液化系统的研发与销售；联合创始人兼CTO冯洋为清华大学本硕博、复旦大学博士后，师从王亚愚教授，作为核心成员参与了薛其坤院士、王亚愚教授、何珂教授领衔的国家级重大科研项目；发起股东中科富海的总裁高金林博士兼任公司董事长，为公司的发展方向与治理体系提供顶层设计和战略指导。</p>\n  <p>当前，超导量子计算被公认为是技术最成熟、产业化最快的技术路线之一，海内外超导量子计算机整机厂商均在布局或预研千比特级的整机系统。</p>\n  <p>然而，从百比特向千比特跨越，面临三重硬件瓶颈：一是干法稀释制冷机的冷量已接近极限，单台仅能支撑100多比特降温，若多台并联会导致振动变大，测量保真度下降；二是量子比特数量增加导致低温同轴线缆数量近线性增长，出现布线瓶颈；三是当前的室温测控系统仪器多、集成度低、微波信号链路长、成本高昂，调试复杂。</p>\n  <p>量域芯创的核心思路是开发一套全栈式的低温测控平台，取代目前主流的室温测控架构。该全栈式的低温测控平台由三大产品构成：大冷量低振动湿法稀释制冷机、低温测控芯片以及低温柔性带状线缆。</p>\n  <p>硬氪了解到，在产品进度上，目前低温柔性带状线缆进展最快，demo已完成，正在测试验证中，预计2027年3-4月推向市场，其核心价值在于将布线密度提升8-10倍，热损降低一半以上，直接替代4K以下温区的进口半刚性低温同轴线缆，同时也可兼容现有的室温测控架构和干法稀释制冷机。</p>\n  <p>湿法稀释制冷机则已完成总体设计方案，目标制冷量为5mW@100mK或120μW@20mK，若在明年三季度完成测试验证，将成为全球冷量最大的稀释制冷机，并将机械振动从干法稀释制冷机的100nm级降低至10nm级，可支撑数1000到10000个量子比特的降温需求。公司放弃了当下主流的脉管制冷机并联预冷的思路，转而引入4K液氦腔，可提供100-500W@4.2K的冷量，是现有干法稀释制冷机方案的数十倍。</p>\n  <p>4K低温测控芯片的目的在于将室温测控仪器的大部分功能集成到芯片里，置于4.2K（-269℃）低温环境直接操控量子比特，预计在2027年四季度完成首次流片并进行测试验证，三个产品最终会融合成一套全栈式低温测控系统，并计划2028年一季度正式定型推向市场。届时，公司为下游的量子计算机整机厂提供全栈式的服务，整机厂只需要专注于其最擅长的领域——超导量子芯片的研发与迭代。</p>\n  <p>目前，公司已与数家头部超导量子计算整机厂商签署合作协议，产品推出后将进入测试及采购流程。</p>\n  <p>长期规划来看，量域芯创以超导量子计算的上游测控硬件作为切入点，并逐步拓展至离子阱、中性原子、硅基等多量子计算的测控平台，并最终由量子计算的设备供应商升级为算力中心的基础设施服务商。尹成厚判断，量子计算机最终将与GPU算力中心融合，形成量超融合计算中心，而无论是量子测控系统还是GPU的液冷散热，底层技术都指向低温传热与极低温工程。</p>\n  <p><strong>以下为硬氪与公司创始人兼CEO尹成厚的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：你们产品和目前行业主流产品的本质的区别是什么？</strong></p>\n  <p><strong>尹成厚：</strong>当前行业主流是室温测控架构，测控仪器在室温，信号通过多段同轴线缆传到芯片。这套方案能支撑100+比特，但到1000+比特时，线缆数量、冷量、空间、保真度全部面临瓶颈。我们开发的低温测控平台，是把测控功能下移到4K温区，用芯片替代大部分室温仪器。</p>\n  <p>同行大多是单点突破，有的做同轴线缆，有的做干法稀释制冷机，有的做室温测控系统；我们是把三个产品打通，融合成全栈式平台。客户拿到的是一台仪器，不是一堆零散的部件，这对下游整机厂商的工程效率是质的提升。</p>\n  <p>更重要的是，我们的低温测控平台可以把量子比特测量保真度从目前的99.9%提升到99.99%，同时支撑从100+比特到数千甚至上万个比特的扩展。部分公司把多台干法稀释制冷机并联，片面追求把冷量做大但忽视振动、噪声也会随之增加、导致测量保真度大幅下降，冷量的增加与测量保真度的下降相互抵消，本质上没有意义。我们是从测控架构层面从底层同时解决这两个问题。</p>\n  <p><strong>硬氪：你们给自己的定位是上游设备商，但未来会不会延伸到整机？</strong></p>\n  <p><strong>尹成厚：</strong>不会。我们从去年9月筹备到现在正式运营，团队内部反复讨论和评估过公司的初心、愿景与定位。结论很清晰：我们只做上游，不碰整机；只卖铲子，不去挖矿。</p>\n  <p>超导量子芯片本身不是我们团队擅长的领域，我们擅长的是低温、真空、测控、系统集成。专注做自己想做、能做且擅长做的事，比什么都想做要为重要。况且，有些头部超导计算整机企业，早期因为量子计算产业链空白、极其不完善而被迫去全栈自研，只能什么都自己干。但到今天，大部分超导计算整机企业也开始跟第三方专业公司合作了，他们更愿意专注于把自己最擅长的超导量子芯片做好做精，并集成为完整的超导量子计算机使其真正可计算、可商用。产业链分工是必然趋势，专业人做专业事。</p>\n  <p><strong>硬氪：你们怎么看待当前的市场规模？</strong></p>\n  <p><strong>尹成厚：</strong>量子计算虽然处于产业萌芽期，但当前市场规模其实已经不小了。全球超导量子计算相关的稀释制冷机、测控系统、同轴线缆加起来，也有超百亿元的市场，而且未来十年复合增长率在30%-40%之间。我们研发的全栈式低温测控系统占整机成本的60-70%，市场空间是实打实的，潜力巨大。</p>\n  <p>更重要的是，我们以超导为切入点，底层的低温、真空、测控技术可以横向拓展到硅基、拓扑、离子阱、光量子等其他路线。不管最终哪条路线胜出，我们都能提供上游测控硬件，这个市场天花板足够高，支撑几十亿收入规模是完全没问题的。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>金雨茂物：</strong>全球超导量子计算正处于从“含噪声中等规模量子”（NISQ）向“早期容错量子计算”（FTQC）跨越的关键临界点，工程化大规模拓展是行业亟待攻克的核心壁垒。传统干法稀释制冷机搭配室温测控系统，在制冷量、布线空间、噪声控制方面存在显著局限，制约量子比特规模向上迭代。</p>\n  <p>量域芯创精准直击行业痛点，首创“湿法稀释制冷机+4K低温测控芯片+柔性同轴线缆”三位一体硬件架构，是兼具前瞻性与工程落地能力的破局方案。依托大冷量湿法制冷技术，结合4K温区Cryo‑CMOS芯片就地测控，从根源化解千至万级量子比特扩展的“布线墙”与热负载难题。</p>\n  <p>我们认为，作为超导量子赛道关键“卖铲人”，量域芯创的全栈硬件基座，能够显著缩短整机厂商研发周期、降低开发成本，有望推动全球超导量子计算加速迈向大规模商用。</p>", "category": "tech", "published_at": "2026-09-14T01:12:19+00:00", "fetched_at": "2026-09-14T03:04:24.389050+00:00", "fingerprint": "08359db4e07b5879"}, {"source": "少数派", "title": "搭建自己的 HomeLab（一）：聊聊我的硬件清单", "url": "https://sspai.com/post/113880", "summary": "作为系列的第一篇，这里想把三件事讲清楚：什么是 HomeLab、我为什么愿意折腾它、以及这套东西需要哪些硬件、它们大概又要花多少钱。系列其他文章的目录放在文末。<a href=\"https://sspai.com/post/113880\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-13T07:51:55+00:00", "fetched_at": "2026-09-14T03:04:22.911935+00:00", "fingerprint": "d9259b2a1e9a2fbe"}, {"source": "少数派", "title": "派早报：美国 AI 高管呼吁放缓研发，特朗普反对", "url": "https://sspai.com/post/114539", "summary": "<p>美国 AI 高管呼吁放缓研发，特朗普反对</p><p>苹果解释 Apple Watch 不会持续录音</p><p>LG 否认智能电视监控用户</p><p>暴雪公布《魔兽世界》怀旧服</p><p>儿童贴身使用笔记本电脑导致皮肤灼伤</p><p>Android 开始支持密码管理器迁移</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/114539\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-13T22:55:34+00:00", "fetched_at": "2026-09-14T03:04:22.911925+00:00", "fingerprint": "e35e3acfa5bd7955"}, {"source": "The Guardian - World", "title": "Six Nigerians extradited to US over $6m online romance scam", "url": "https://www.theguardian.com/us-news/2026/sep/12/nigerians-extradited-online-romance-scams", "summary": "<p>Alleged members of Black Axe criminal network that swindled US women out of $6m flown from South Africa</p><p>Six Nigerian nationals linked to an organized criminal network that allegedly swindled American women out of more than $6m through <a href=\"https://apnews.com/article/scams-online-scams-ai-internet-safety-phishing-fraud-takeaways-b1350fd421cce73ac585a649b07332d5\">online romance scams</a> were extradited to the United States on Friday.</p><p><a href=\"https://www.theguardian.com/world/southafrica\">South African</a> police confirmed they were to be extra
