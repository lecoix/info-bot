rusher headphones now come with Bose’s ANC", "url": "https://www.theverge.com/tech/966022/skullcandy-cruser-1080-anc-bose-tuning-noise-cancelling-wireless-headphones", "summary": "Skullcandy announced a new version of its Crusher wireless headphones today featuring a few of Bose's audio technologies including its QuietControl ANC and head-tracking spatial audio. The Crusher headphone line differentiates itself from the competition through the use of both full-range and dedicated bass drivers in each ear cup to boost deeper frequencies. Skullcandy admits [&#8230;]", "category": "tech", "published_at": "2026-07-16T00:00:00+00:00", "fetched_at": "2026-07-16T02:09:43.826127+00:00", "fingerprint": "bdf27360478b2ac5"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜LG新能源将为谷歌规模最大的“光储一体”项目供应电池；元宝与京东AI Agent正式打通小程序生态；日本散户持有美元净空头飙至2.79万亿日元，创2008年以来历史之最", "url": "https://36kr.com/p/3896563671222147?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896551911556744\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美团、青桔、哈啰共享单车调价</strong></a></p>\n  <p>近期，美团单车、滴滴青桔、哈啰单车相继在北京等多个城市上调计费规则，三大平台不约而同地采取了“提高起步定价、拉长基础骑行时长”的组合策略：起步价从此前的1.5元/30分钟左右，普遍调整为1.88元至1.99元/60分钟。这成为共享单车行业近年来较大范围的一次集体调价。（金融时报）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896547919644294\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>瓜子二手车线下直卖场首店今日正式开业</strong></a></p>\n  <p>36氪获悉，瓜子二手车线下直卖场首店苏州直卖场今日正式开业。据介绍，瓜子此次重回线下，主打100%个人直卖车源。目前瓜子在沈阳、济南等同类型门店已同步启动，并推动全国落地中。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896537307760261\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>LG新能源将为谷歌规模最大的“光储一体”项目供应电池</strong></a></p>\n  <p>据业内人士周三透露，韩国LG新能源将为谷歌规模最大的太阳能与储能项目供应电池，此举标志着该公司进一步拓展了与AI数据中心激增的电力需求相关的能源基础设施业务。谷歌与可再生能源开发商Cypress Creek Energy在阿肯色州联合公布了“钢铁河能源中心”项目。该项目初期将配置1.6吉瓦（GW）的太阳能发电能力与约2吉瓦时（GWh）的电池储能系统；到2029年，规模将扩大至2.5吉瓦太阳能发电和2.9吉瓦时储能容量。预计LG新能源将供应其在北美生产的JF2 DC Link系统，该系统采用磷酸铁锂电池技术。据消息人士估算，该订单价值达数千亿韩元。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896392008714117\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>微盟旗下AI销售数字员工微盟星拓启动内测</strong></a></p>\n  <p>36氪获悉，7月15日，微盟集团宣布旗下面向B2B场景的AI销售数字员工微盟星拓正式启动内测。该产品覆盖“用户指令→意图解析→策略生成→自动寻客→智能外呼→意向加微”全链路。销售人员只需以自然语言下达一次指令，AI 数字员工即自主完成后续作业，将意向客户直接交付至销售团队。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896380062647944\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>元宝与京东AI Agent正式打通小程序生态</strong></a></p>\n  <p>36氪获悉，7月15日，腾讯宣布元宝与京东AI Agent完成小程序生态打通。京东AI Agent是首个接入元宝的电商垂域合作伙伴，基于双方生态打通，元宝能够为用户提供更加及时、准确的信息反馈，而京东依托其供应链与电商服务体系，为用户提供商品推荐、履约及售后等服务。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896383346820996\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蔚来战略投资长鑫科技：双方将构建稳定、互信的战略供应关系</strong></a></p>\n  <p>蔚来成为长鑫科技战略投资方，承诺认购金额为1.58亿元，锁定期限为18个月。双方将就现有车规级LPDDR4X、LPDDR5X产品开展战略合作，致力于构建稳定、互信的战略供应关系。（证券时报）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896607042766465\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>拜耳与RAGT签署杂交小麦许可协议</strong></a></p>\n  <p>7月15日，拜耳发表声明称，已与欧洲小麦种子公司RAGT签署了一项独家许可协议，目标是到2030年代初期在欧洲和北美同步扩大杂交小麦种子的销售规模。该协议涵盖针对欧洲环境定制的小麦种质资源的许可授权。拜耳称，其公司的目标是到2040年代中期实现杂交小麦年收入高达10亿欧元。（界面）</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896356363814530\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“灵巧智能”完成数亿元A轮融资，上海电气战略入股</strong></a></p>\n  <p>近日，具身智能企业“灵巧智能”（DexRobot）宣布完成数亿元A轮融资，本轮由上海电气战略投资，产业资本与财务资本持续加码。2026年内，公司已先后完成天使轮及A轮两轮融资，融资资金将重点用于灵巧操作全栈技术研发、核心产品迭代、教育/电力/工业三大场景落地及产业生态建设。此外，上海电气旗下上海机电与灵巧智能同步成立两家合资公司——灵机壹动与灵机智联，总注册资本超亿元，分别聚焦核心零部件量产与工业场景解决方案，标志着公司从技术研发迈入产业规模化交付阶段。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896612236265095\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“面壁智能”完成新一轮融资，估值超200亿元</strong></a></p>\n  <p>36氪获悉，面壁智能已完成新一轮融资，投资方包括国家级基金、央企、汽车制造商等各类产业方、财务投资人等。至此，面壁智能2026上半年累计融资金额超50亿元，估值超200亿元，一跃成为端侧智能领域公开估值最大的独角兽企业。面壁智能专注于将原生端侧大模型技术转化为标准化产品，在具身、汽车、手机、低空、民航等核心赛道落地，未来还将拓展至工业、家居、特种领域等。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896573504603784\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星电子推出新款990固态硬盘</strong></a></p>\n  <p>7月15日，三星电子宣布，新款990固态硬盘现已全球陆续上市，提供1TB、2TB两种容量版本。厂商建议零售价分别为269.99美元、529.99美元。（界面）</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3896440133355394\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英国将对十六七岁青少年实施社媒“宵禁”</strong></a></p>\n  <p>英国政府7月14日宣布，将对16岁至17岁青少年使用社交媒体实施“宵禁”。这是英国政府继上月宣布将禁止16岁以下人群使用一系列社交媒体应用程序后新的社媒限制举措。英国政府表示，在默认设置状态下，16岁至17岁青少年在0时至6时不能使用社交媒体；旨在诱使用户更长时间浏览的功能，包括视频自动连续播放，也将默认关闭。英国政府6月表示，将效仿澳大利亚，禁止16岁以下人群使用一系列社交媒体应用程序。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896568678614917\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>日本散户持有美元净空头飙至2.79万亿日元，创2008年以来历史之最</strong></a></p>\n  <p>据日本金融期货协会数据显示，散户交易者的美元净空头头寸较上月激增逾三倍，达到2.79万亿日元（约合172亿美元），创下自2008年底有记录以来的历史最大规模。尽管这些看空押注也可能涉及其他货币对，但日元相关未平仓头寸规模庞大，表明其主要集中于美元兑日元持仓。市场普遍猜测日本官方可能再度出手干预以提振日元汇率。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3896571579549319\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>央行：上半年人民币存款增加17.76万亿元</strong></a></p>\n  <p>36氪获悉，央行发布2026年上半年金融统计数据报告，6月末，本外币存款余额354.33万亿元，同比增长8.2%。月末人民币存款余额346.44万亿元，同比增长8.2%。上半年人民币存款增加17.76万亿元。其中，住户存款增加7.58万亿元，非金融企业存款增加3.2万亿元，财政性存款增加9715亿元，非银行业金融机构存款增加4.65万亿元。6月末，外币存款余额1.16万亿美元，同比增长13.7%。上半年外币存款增加980亿美元。</p>", "category": "tech", "published_at": "2026-07-15T11:37:31+00:00", "fetched_at": "2026-07-16T02:09:43.715772+00:00", "fingerprint": "ebea35ffa7b6df35"}, {"source": "36氪 - 最新文章", "title": "独家｜面壁智能端侧大模型将搭载三星手机上市", "url": "https://36kr.com/p/3896830362601351?f=rss", "summary": "<p><strong>文｜邓咏仪</strong></p>\n  <p><strong>编辑｜张雨忻 杨轩</strong></p>\n  <p>《智能涌现》独家获悉，端侧大模型公司面壁智能已与三星手机达成合作，其自主研发的MiniCPM系列端侧模型将搭载于三星手机上市，覆盖数款旗舰机型。</p>\n  <p>就在同一日，网信部门发布公告，包括“Apple智能”等7款提供手机端侧生成式人工智能服务完成备案。</p>\n  <p>公告显示，Apple智能、华为小艺AI大模型、OPPO Andes GPT、vivo蓝心端侧大模型、小米澎湃AI、三星盖乐世AI以及努比亚豆包手机大模型共7款服务完成备案。</p>\n  <p>大模型浪潮来临后，端侧AI一直处于技术探索和萌芽期。此次七款手机端侧AI同日获批，是业界的重要里程碑——端侧AI不再是概念演示，进入了规模化落地阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_c47f286e2748467fbc532dd4448e4721@2057308263_oswg372385oswg1080oswg1007_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△来源：网信中国</p>\n  <p>同日，阿里巴巴向媒体确认，阿里千问将作为AI能力集成至Apple智能，覆盖iOS、iPadOS、macOS和visionOS的国行设备，用户无需切换App即可在苹果设备上体验千问的文本与图像理解、内容生成等能力。此后，阿里股价应声上涨超过5%。</p>\n  <p>此前，国内手机厂商的端侧AI能力大多由自研模型支撑——华为有小艺、OPPO有AndesGPT、vivo有蓝心、小米有澎湃AI。而如今，阿里千问落地Apple智能、面壁智能搭载三星手机，这说明了AI模型公司正在成为手机AI能力的重要供给方——手机厂商不必事事自研，端侧模型的市场化分工正在形成。</p>\n  <h2><strong>最早押注端侧AI的初创公司</strong></h2>\n  <p>面壁智能2022年8月在北京成立，孵化自清华大学自然语言处理实验室。联合创始人、CEO李大海曾任知乎合伙人、CTO；联合创始人、首席科学家刘知远现任清华大学计算机系教授；联合创始人、CTO曾国洋在22岁时作为核心工程负责人，训练了中国第一个大语言模型CPM-1。</p>\n  <p><strong>据投资界报道，2026年上半年，面壁智能累计融资超50亿元，估值突破200亿元，成为国内端侧AI领域估值最高的独角兽。</strong></p>\n  <p>面壁智能也是国内最早押注端侧AI的初创公司。2023年下半年，当行业还在追赶云端大模型参数规模时，面壁智能决定全力押注端侧。这个选择在当时并不主流——做大模型的公司都在卷参数、卷算力，端侧模型被视为“做小”的边缘路线。</p>\n  <p>面壁智能的判断基于一个核心方法论：知识密度。2024年，面壁智能与清华大学团队提出“大模型密度定律”（Densing Law），认为开源大模型的最高能力密度约每3.5个月翻一番，同等智能所需的参数规模呈指数级下降。</p>\n  <p>这个判断在后续的模型发布中被逐步验证。2026年5月，面壁联合清华大学、OpenBMB开源的新一代端侧文本基座模型MiniCPM5-1B，参数量仅10亿，在Artificial Analysis Intelligence Index中获得17.9分，超过多款参数规模更大的开源基座模型；另一款MiniCPM-V 4.6仅1.3B参数、6GB内存即可在手机上流畅运行，支持iOS、Android、HarmonyOS等主流操作系统。</p>\n  <p>目前，MiniCPM系列开源模型在GitHub、Hugging Face等平台的累计下载量已突破3800万次。</p>\n  <p>在近期36氪对曾国洋的专访中，他解释了端侧模型的底层逻辑：“端侧是硬限制——如果模型太大，跑不动就是跑不动，补贴钱没用；功耗太高会发热，你不可能补贴一个冰块。”在他看来，做端侧模型的难度并不亚于做大：“做高效是非常难的，不是越大越简单。”</p>\n  <p>端侧模型的落地不只是把模型做高效，还要打通算法、芯片适配、功耗优化、终端部署的全链路。</p>\n  <p>面壁智能已完成对高通、联发科、英特尔、瑞芯微、英伟达、AMD等主流芯片平台的全面适配。在国产芯片方面，面壁智能参与了华为昇腾、寒武纪等国产芯片的软件栈构建，发布了全国首个三值量化大模型BitCPM-CANN，推理阶段可节省约6倍显存。</p>\n  <p>面壁智能也已建立多样化的端侧模型矩阵。比如，最新发布的MiniCPM-o4.5是一个全双工全模态大模型，以9B参数量，就是实现语音、视频、文本的全模态同步交互。</p>\n  <p>端侧模型要在手机上跑起来，得要解决功耗、散热、内存占用、响应延迟，每一个环节都不可缺少。“端侧模型不单看评测效果，还有响应时间、硬件成本，它很难从单一维度胜出。”曾国洋在专访中表示。</p>\n  <p>在汽车端，面壁智能已初步验证了规模化落地能力。其自研端侧智能体SuperMate到2026年底预计将交付超30万台量产车，覆盖吉利、上汽大众、广汽、马自达等品牌，跑通了模型适配、硬件兼容、供应链、终端交付的全链路。</p>\n  <p>三星是全球出货量最大的安卓手机厂商之一，其端侧AI能力此前主要依赖自研的Galaxy AI和与谷歌的合作。据韩媒报道，三星正与谷歌深度合作，将Gemini整合进其设备生态，包括即将于7月22日在伦敦发布的Galaxy Unpacked 2026系列产品。面壁智能的端侧模型在三星体系中具体承担怎样的角色，仍有待进一步确认。</p>\n  <p><strong>封面来源｜AI生成</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_6c2c24f65f7247228a1cf662b54d7799@2057308263_oswg66520oswg900oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">👇🏻&nbsp; 扫码加入「智涌AI交流群」👇🏻</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_a87ba363e0ae48e8b74b4237d5a60ffb@2057308263_oswg53751oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzkwMDQ2NDU2Nw==&amp;tempkey=MTM4M19NajZ4NE1neEpiSUhkeU5nMHNmaTk0OERudm5mTHVwNkhjWVI4VnU4Q3BPbzRuS1Myb3RVaXhTU1hVVjZLbkdWNlBRa1E2NUJHcURMY2lHakZ4cW5hQWJOb09wWFNJNzNMblZNOFpKai1lZEYwU1VOeXNlT01jU3NXRjF4REI5SlJCLVFVSVM4d19DVEFXUkl2UnFVTVcyVjZ2akw1U0JhTnBFZk9Rfn4%3D&amp;chksm=418c08c8dab2d6d4008851f34c8852d39ffeb8e16fcac54d22dabe3f4f134b793a56e9d15447&amp;mpshare=1&amp;scene=1&amp;srcid=0715K3lJ8yumyj4T8mEqfzeR&amp;sharer_shareinfo=0fadfb1222bcf2b203f4d9eda85bcb48&amp;sharer_shareinfo_first=0fadfb1222bcf2b203f4d9eda85bcb48#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“智能涌现”</a>，作者：邓咏仪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-15T11:47:14+00:00", "fetched_at": "2026-07-16T02:09:43.715766+00:00", "fingerprint": "c5fdd49e63ee1933"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨国行苹果AI功能完成备案；三家共享单车上调起步价；知情人曝DeepSeek开始筹备IPO", "url": "https://36kr.com/p/3897553391978371?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>澳洲将设AI办公室，限制数据中心能源消耗</p>\n  <p>巴菲特宣布8年内清仓伯克希尔股票</p>\n  <p>前高通自动驾驶工程副总裁将加入英伟达自动驾驶团队</p>\n  <p>长鑫科技：上市后仍将保持无实际控制人的控制权架构</p>\n  <p>谷歌参与建设美国最大太阳能项目，总规模达2.5GW</p>\n  <h2><strong>TOP 3大新闻</strong></h2>\n  <p><strong>阿里、百度分别为苹果智能提供AI相关能力支撑</strong></p>\n  <p>36氪获悉，网信办公布7款端侧生成式AI服务备案，苹果“Apple智能”大模型7月8日完成备案。阿里千问将为苹果全系列国行设备提供文本、图像生成AI能力，百度则负责配套AI搜索功能，二者共同完善国内版苹果智能套件与Siri功能。</p>\n  <p><strong>三家共享单车上调起步价，拉长基础骑行时长</strong></p>\n  <p>近期，美团单车、滴滴青桔、哈啰单车相继在北京等多个城市上调计费规则，三大平台不约而同地采取了“提高起步定价、拉长基础骑行时长”的组合策略：起步价从此前的1.5元/30分钟左右，普遍调整为1.88元至1.99元/60分钟。这成为共享单车行业近年来较大范围的一次集体调价。（金融时报）</p>\n  <p><strong>知情人曝DeepSeek已开始筹备IPO，最快可能今年提交申请</strong></p>\n  <p>据彭博社报道，知情人士透露，DeepSeek已开始筹备首次公开募股（IPO），规划在内地上市，最快可能于今年提交申请，并在2027年完成上市。据悉，DeepSeek正与会计师事务所合作，力争在今年12月底前完成财务报告，这是IPO申报的必要步骤。相关讨论仍在进行中，IPO时间安排和融资计划可能有所调整，执行将取决于市场状况及公司业绩。（新浪科技）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>澳洲将设AI办公室，限制数据中心能源消耗</strong></p>\n  <p>澳大利亚总理阿尔巴尼斯星期三（7月15日）说，澳洲政府将设立一个“人工智能办公室”，负责管理人工智能（AI）标准的制定，并会强制规定数据中心须成为能源净生产者，以及限制用水量。这个办公室将在总理公署下设立，以确保各内阁部门采取协同一致的全政府应对模式。相关立法将于明年初提交国会。（财联社）</p>\n  <p><strong>Anthropic、黑石集团等联合推出企业AI服务公司Ode</strong></p>\n  <p>7月15日，Anthropic、黑石集团与Hellman&amp;Friedman联合推出今年早些时候公布的企业AI服务公司Ode with Anthropic（简称“Ode”），现以正式名称和品牌亮相。Ode公司由Chris Taylor担任首席执行官，Eddie Siegel担任首席技术官。除创始合伙人外，投资者联盟还包括高盛、General Atlantic、Leonard Green&amp;Partners、阿波罗全球管理公司、新加坡政府投资公司（GIC）和红杉资本。（界面新闻）</p>\n  <p><strong>机构：预估陪伴型人形机器人2030年产值达11亿美元</strong></p>\n  <p>36氪获悉，根据TrendForce集邦咨询最新机器人产业研究，陪伴型机器人已从早期的养老照护陪伴、疗愈设计，拓展至近年来的真人化互动和情感陪伴，日前中国厂商优必选发布超仿生人形机器人U1，象征此类陪伴型产品正式跨入真人化时代。随着全球人口结构走向老龄化、少子化，且独居人口持续增加，陪伴型人形机器人需求获得快速崛起的“陪伴经济”支撑，预估其产值将于2030年达到11亿美元。</p>\n  <p><strong>Xmax AI发布通用实时交互AI视频模型X2.0</strong></p>\n  <p>36氪获悉，15日，Xmax AI正式发布新一代通用实时交互AI视频模型Xmax X2.0，并同步开放API及产业合作接入。Xmax X2.0实时重渲能力升级，实现了CharX实时换人、ClothX实时换装、VibeX实时换风格等多项功能。交互层面，Xmax X2.0统一交互架构把只懂Prompt的模型升级为能理解摄像头、视频流与手势行为的全能模型。</p>\n  <p><strong>Anthropic计划几周内召开IPO投资者会议</strong></p>\n  <p>据知情人士透露，Anthropic正安排与投资者举行会面，为潜在的大规模IPO做准备。消息人士称，负责此次IPO的承销银行将在未来几周安排投资者与这家Claude聊天机器人开发商会面。此前有报道称，Anthropic最早可能于10月启动IPO。（新浪财经）</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>巴菲特称将捐出1400亿美元股票</strong></p>\n  <p>美国知名投资人沃伦·巴菲特7月14日表示，到2034年底将其剩余的伯克希尔-哈撒韦公司股票，价值超1400亿美元，全部捐赠给慈善机构，而这份捐赠名单中并没有包括盖茨基金会。现年95岁的巴菲特自2006年开始捐赠名下资产，自2006年宣布捐出全部财富的计划以来，已累计捐赠了超过610亿美元（约合人民币4128亿元）。（央视财经）</p>\n  <p><strong>毒理的上游药效行业需求高速增长，实验猴市价涨到20万</strong></p>\n  <p>近期“猴子”刷屏投资圈。据报道，实验猴市价已涨到20万，堪比一台中档车。有业内专业人士表示，猴价是供需决定的，毒理的上游药效行业需求高速增长，可以预计2026—2027年对猴子的需求也是快速增长的。供给端前几年主要靠自产，2026年上半年放开了进口，根据行业专家反馈，应该进口了5000只左右，国内自产应该有3万—3.5万只的能力，2025年用猴子的数量约为3.5万只，按照2025年药效20%—30%的增长简单计算，今年毒理猴子的需求可能也是20%的增长，大概需要4.2万只猴。而最新调研反馈，毒理实验还是处于缺猴子的状态，头部公司项目排期已到明年初。（券商中国）</p>\n  <p><strong>罗技广告称消费者像狗被罚20万，品牌方已经介入处理并发布致歉声明</strong></p>\n  <p>因称消费者会因产品降价像狗一样跑过来，知名鼠标品牌罗技分销商上海百事得电子有限公司被认定广告违法，并于近日被上海市静安区市场监管局罚款20万元。</p>\n  <p>据行政处罚决定书，上海百事得电子有限公司为罗技（中国）科技有限公司的分销商，负责罗技在抖音平台的多个账号运营。经查明，2026年3月25日-3月26日，上海百事得电子有限公司在“罗技”账号发布含有“当我一降价，你还不是像狗一样跑过来”侮辱性内容的降价促销视频广告。</p>\n  <p>7月15日，罗技官方客服向记者表示，品牌方为带给用户不好的体验而致歉，此次为个别店铺账号的违规行为，品牌方已经介入处理并发布致歉声明，客服称将把采访予以转达。（南方都市报）</p>\n  <p><strong>长鑫科技：上市后仍将保持无实际控制人的控制权架构</strong></p>\n  <p>7月15日，长鑫科技科创板上市网上投资者交流会举行。长鑫科技副总裁、董事会秘书袁园在回复投资者提问时表示，公司上市后股权结构将进一步分散，前五大股东持股比例均不超过30%，不存在单一持股比例超过50%的股东；此外，公司已建立由股东会、董事会、各专门委员会和经营管理层组成的现代企业治理结构，董事会由11名成员构成，除4名独立董事外，7名非独立董事实际提名方为：清辉长鑫1席，长鑫集成1席，大基金二期2席，合肥集鑫1席，安徽省投1席，职工董事1席，无任何一名股东通过实际支配表决权能够决定长鑫科技董事会半数以上成员的选任，上市后公司预计仍将保持较为分散的董事会提名结构。因此，长鑫科技上市后仍将保持无实际控制人的控制权架构。（上证报）</p>\n  <p><strong>安踏品牌CEO徐阳将离职</strong></p>\n  <p>7月15日，界面新闻自安踏集团获悉，原安踏品牌CEO徐阳因家庭原因辞任该职，集团已批准并将另有任用。安踏集团执行董事、集团联席CEO赖世贤即日起将代理安踏品牌CEO一职，全面负责品牌日常经营与管理工作。（界面新闻）</p>\n  <p><strong>前高通自动驾驶工程副总裁将加入英伟达自动驾驶团队</strong></p>\n  <p>36氪独家获悉，英伟达自动驾驶团队近期发布内部信称，前高通自动驾驶工程副总裁Dheeraj Ahuja将加入吴新宙团队，而原英伟达自动驾驶软件副总裁，负责量产项目的Sarah Tariq则进入职务过渡期。近日，Sarah Tariq也发出了告别信。Dheeraj Ahuja和吴新宙都曾在高通任职，在过去七年多里，Dheeraj一直负责高通的自动驾驶项目，2021年底至2022年，高通成功击退英伟达和Mobileye，拿下了宝马下一代ADAS和自动驾驶平台的订单，Dheeraj正是该项目的直接工程负责人。</p>\n  <p><strong>香港证券市场下调最低上落价位第二阶段将于8月3日生效</strong></p>\n  <p>香港证券市场在第一阶段最低上落价位下调措施实施后取得积极成效。与实施前相比，适用股票的买卖价差收窄35%，订单成交时间缩短30%。在此基础上，香港交易所将于2026年8月3日推出第二阶段措施，进一步优化交易体验，支持香港证券市场持续发展。（证券时报）</p>\n  <p><strong>英国将对十六七岁青少年实施社媒“宵禁”</strong></p>\n  <p>英国政府7月14日宣布，将对16岁至17岁青少年使用社交媒体实施“宵禁”。这是英国政府继上月宣布将禁止16岁以下人群使用一系列社交媒体应用程序后新的社媒限制举措。英国政府表示，在默认设置状态下，16岁至17岁青少年在0时至6时不能使用社交媒体；旨在诱使用户更长时间浏览的功能，包括视频自动连续播放，也将默认关闭。英国政府6月表示，将效仿澳大利亚，禁止16岁以下人群使用一系列社交媒体应用程序。（新华社）</p>\n  <p><strong>美国FCC批准发射阳光反射卫星计划，为地球夜间区域提供应急照明</strong></p>\n  <p>美国联邦通信委员会（FCC）近日批准了一家初创企业的申请，允许其建造并发射一枚反光卫星，该卫星携带巨型聚酯薄膜（Mylar）反射镜，可将阳光反射回地球，为地球的夜间区域提供短暂应急照明。总部位于加利福尼亚州霍桑市的轨道反射公司（Reflect Orbital）于7月9日获得联邦通信委员会的许可。该企业计划发射一枚名为埃雅仁迪尔一号（Earendil-1）的试验卫星，并将其部署在近地轨道运行。（新浪财经）</p>\n  <p><strong>A股成交2.57万亿缩量1328亿</strong></p>\n  <p>7月15日，市场震荡调整，创业板指冲高回落跌超1%，科创50指数高开低走跌超4%。沪深两市成交额2.57万亿，较上一个交易日缩量1328亿。盘面上，市场热点较为杂乱，全市场超3300只个股上涨。</p>\n  <p>从板块来看，医药板块逆势活跃，博瑞医药、迪哲医药、睿智医药20CM涨停，哈药股份4连板，海南海药、昂利康涨停。白酒概念震荡走高，古井贡酒、金种子酒涨停。零售概念异动拉升，新华百货、宁波中百涨停。游戏概念表现活跃，巨人网络、恺英网络涨停。下跌方面，半导体产业链集体调整，存储芯片、算力芯片、半导体设备方向跌幅居前，德明利一字跌停，强一股份、华峰测控、佰维存储、沐曦股份均跌超11%。截至收盘，沪指跌0.29%，深成指跌0.97%，创业板指跌1.21%。（财联社）</p>\n  <p><strong>谷歌参与建设美国最大太阳能项目，总规模达2.5GW</strong></p>\n  <p>谷歌当地时间7月14日宣布，与Cypress Creek Energy在美国阿肯色州启动Steel River Energy Center项目建设。该项目建成后将成为美国最大的太阳能发电设施，也是谷歌全球规模最大的太阳能及储能项目。谷歌将作为锚定投资者和购电方支持项目一期和二期建设，新增1.6GW直流太阳能发电和1.9GWh储能；整个三期项目预计于2029年全部投运，总规模将达到2.5GW直流太阳能发电和2.9GWh储能。（界面新闻）</p>\n  <p><strong>中国日均生产芯片超15亿块</strong></p>\n  <p>今年上半年，规模以上高技术制造业增加值、数字产品制造业增加值分别增长13.3%和12.3%，比一季度都有所加快。特别是全球人工智能技术变革带来的高端算力芯片和存储芯片需求爆发。上半年中国规模以上工业企业的集成电路产量增长23.1%，产量规模达到2798亿块。国家统计局新闻发言人王冠华表示：“这个数字非常庞大，换算下来平均每天生产集成电路超过15亿块。集成电路就是我们平时说的芯片，它广泛应用于智能装备、电子产品当中。”除了集成电路，5G智能手机、3D打印设备、服务机器人等智能产品产量也保持了快速增长；日均词元调用量已达数百万亿，实现了量级式跨越。初步测算，上半年以高技术制造业、数字产品制造业为代表的新动能，以两成多的增加值占比贡献了近五成的工业增长，是拉动工业增长的重要引擎（央视财经）</p>\n  <p><strong>Meta遭员工起诉，被指利用AI系统筛选裁员对象，不公平针对休假员工</strong></p>\n  <p>26名Meta员工本周提起诉讼，指控该公司利用人工智能系统筛选裁员对象，尤其对正在休病假、育儿假或家庭照料假的员工产生了不公平的影响。诉状称，这套评分体系从设计层面就存在缺陷：处于受法律保护的病假、家庭照料假期，或是因身体残障导致工作产出下降的员工，根本无法积累充足评分。诉状还表示，Meta在核算员工评分时并未考虑员工享有的法定休假，也未按照法律要求暂停自动化系统，开展兼顾休假、特殊便利需求的人工单独复核。（新浪财经）</p>\n  <p><strong>印度宣布再投1.28万亿卢比，提升本土芯片制造能力</strong></p>\n  <p>7月15日，据报道，印度承诺再投入1.28万亿卢比（约合133亿美元）以促进国内芯片制造发展。报道称，此项举措将建立在印度2021年推出的100亿美元激励计划基础之上，该计划曾承诺承担半导体项目建设成本的一半。（界面新闻）</p>\n  <p><strong>Stripe与Advent据悉联合提出530亿美元收购PayPal</strong></p>\n  <p>7月15日，据报道，支付公司Stripe与私募股权公司Advent International本月早些时候联合提出以每股60.50美元收购PayPal，交易对PayPal估值超过530亿美元，较PayPal周二收盘价溢价约28%。据悉，该收购提议已获得银行约500亿美元融资承诺。（界面新闻）</p>\n  <p><strong>面壁智能端侧大模型将搭载三星手机上市</strong></p>\n  <p>36氪独家获悉，端侧大模型公司面壁智能已与三星手机达成合作，其自主研发的MiniCPM系列端侧模型将搭载于三星手机上市，覆盖数款旗舰机型。</p>\n  <p><strong>诺基亚与英伟达推出行业首个商用AI-RAN平台</strong></p>\n  <p>7月15日，诺基亚公司发表声明称，公司已与英伟达共同开发出业界首个商用人工智能驱动的无线接入网络（AI-RAN）平台。诺基亚表示，新的网络设备将使电信网络运营商到2028年能够在相同无线频段上传输的数据量翻倍，其预计将于明年上市。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，7月15日收盘，美股三大指数集体上涨，道指涨0.29%，纳指涨0.62%，标普500指数涨0.38%。大型科技股多数上涨，苹果涨超4%，谷歌、Meta、亚马逊涨超3%，微软涨超2%，英伟达小幅上涨；英特尔跌超4%，特斯拉小幅下跌。热门中概股普涨，腾讯控股涨超5%，阿里巴巴、哔哩哔哩涨超4%，小鹏集团涨超3%，唯品会、爱奇艺、理想汽车、拼多多涨超2%，百度、网易涨超1%。</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>越疆科技创业板IPO将于7月22日上会</strong></p>\n  <p>36氪获悉，据深交所网站披露，深交所上市审核委员会定于7月22日召开2026年第45次上市审核委员会审议会议，届时将审议深圳市越疆科技股份有限公司的首发事项。</p>\n  <p><strong>环能涡轮北交所IPO将于7月22日上会</strong></p>\n  <p>36氪获悉，据北交所网站披露，北交所上市审核委员会定于2026年7月22日上午9时召开2026年第69次上市审核委员会审议会议，届时将审议常州环能涡轮动力股份有限公司的首发事项。</p>\n  <h2><strong>大公司财报</strong></h2>\n  <p><strong>凯尔达：预计2026年半年度净利润同比增长1006%-1191%</strong></p>\n  <p>36氪获悉，凯尔达公告，预计2026年半年度归属于上市公司股东的净利润为2615.11万元-3053.38万元，同比增长1006%-1191%。业绩变动主要系公司产品竞争力提升、下游市场需求回暖，营业收入持续增长，同时股份支付费用同比下降。</p>\n  <p><strong>华联控股：预计2026年半年度净利润同比增长1030%-1423%</strong></p>\n  <p>36氪获悉，华联控股公告，预计2026年半年度归属于上市公司股东的净利润为2300万元-3100万元，同比增长1030%-1423%。业绩变动主要系杭州“钱塘公馆”项目房产销售收入增加及上年同期基数较低。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>“问天量子”完成B轮融资</strong></p>\n  <p>36氪获悉，近日，“问天量子”完成B轮融资，获得6亿元资金注入，新进投资方包括海南晴澜、海南量启、淄博汇富齐嘉等多家机构。此次融资资金将主要用于核心技术的规模化商用、量子随机数芯片的量产扩能，以及面向人工智能时代的量子AI融合产品研发。</p>\n  <p><strong>“灵巧智能”完成数亿元A轮融资，上海电气战略入股</strong></p>\n  <p>近日，具身智能企业“灵巧智能”（DexRobot）宣布完成数亿元A轮融资，本轮由上海电气战略投资，产业资本与财务资本持续加码。2026年内，公司已先后完成天使轮及A轮两轮融资，融资资金将重点用于灵巧操作全栈技术研发、核心产品迭代、教育/电力/工业三大场景落地及产业生态建设。此外，上海电气旗下上海机电与灵巧智能同步成立两家合资公司——灵机壹动与灵机智联，总注册资本超亿元，分别聚焦核心零部件量产与工业场景解决方案，标志着公司从技术研发迈入产业规模化交付阶段。</p>\n  <p><strong>“面壁智能”完成新一轮融资，估值超200亿元</strong></p>\n  <p>36氪获悉，面壁智能已完成新一轮融资，投资方包括国家级基金、央企、汽车制造商等各类产业方、财务投资人等。至此，面壁智能2026上半年累计融资金额超50亿元，估值超200亿元，一跃成为端侧智能领域公开估值最大的独角兽企业。面壁智能专注于将原生端侧大模型技术转化为标准化产品，在具身、汽车、手机、低空、民航等核心赛道落地，未来还将拓展至工业、家居、特种领域等。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>三星电子推出新款990固态硬盘</strong></p>\n  <p>7月15日，三星电子宣布，新款990固态硬盘现已全球陆续上市，提供1TB、2TB两种容量版本。厂商建议零售价分别为269.99美元、529.99美元。（界面新闻）</p>\n  <p><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-07-15T23:59:41+00:00", "fetched_at": "2026-07-16T02:09:43.715760+00:00", "fingerprint": "a455fb354591e3b6"}, {"source": "36氪 - 最新文章", "title": "斯年智驾获3亿元C轮融资，自动驾驶重卡赛道再升温｜36氪独家", "url": "https://36kr.com/p/3895721094842249?f=rss", "summary": "<p>自动驾驶重卡赛道，今年显著升温。</p>\n  <p>36氪独家获悉，斯年智驾近日已完成 3 亿元 C 轮融资，由兴证资本、颐道资本联合投资，资金将主要用于新一代车规级自动驾驶方案研发。</p>\n  <p>2026年1-6月，该赛道公开披露的融资已达5起，累计金额近70亿人民币，IPO动作也非常密集。资本热的背后，自动驾驶重卡在商业化层面逐渐拥有清晰的落地答案。港口、矿山、钢铁等封闭场景逐渐对无人重卡形成稳定需求，干线物流等开放场景也伴随政策开始逐渐落地，进入规模化前夜。</p>\n  <p>斯年智驾成立于2020年4月，是一家专注于重载物流领域无人驾驶技术研发与落地的公司，提供港口、园区、干线等多场景的自动驾驶解决方案。</p>\n  <p>目前，斯年智驾的商业模式呈现多车型、多场景、多作业链路的特点。</p>\n  <p>在产品端，无人集卡、无人自卸车和无人平板车构成了斯年的主力阵容。支撑这些产品的，是其自研的一段式世界模型自动驾驶方案，以及域控制器、定位板卡在内的核心硬件。</p>\n  <p>落地模式上，斯年智驾提供两种方案：既可以直接卖整车，也可以提供运力服务。在封闭场景，公司已实现从传统集装箱港口、散杂货堆场，到钢厂、纸厂、铝厂、铁路站场和物流枢纽等场景的落地；在开放场景中，公司也已与部分物流公司和央国企达成合作。</p>\n  <p>封闭场景凭借其确定性优势，依然是自动驾驶重卡落地的核心阵地。</p>\n  <p>虽然车辆已实现全无人化运营，但在实际的物流作业中，装卸与甩挂等周边环节仍需人工介入，这给传统的物流运输模式带来了新的考验。</p>\n  <p>何贝对36氪表示，如何将局部的“无人运输”扩展为全局的“无人作业”，是公司接下来的重点之一。“横向运输的自动化已经实现，能不能引入世界模型和具身智能，对垂直运输及端侧协作进行一体化升级，最终达成封闭场景的完全无人化作业呢？未来3-5年应该会有一个答案”。</p>\n  <p>但何贝预测，开放场景未来将拥有更高的增速。所以本轮融资后，斯年智驾将推动自动驾驶重卡域控制器从非车规级到车规级的升级。</p>\n  <p>CEO何贝向36氪坦言，“域控制器才是无人驾驶的大脑”。在无人驾驶的产品链条中，处在执行端的车辆，无论是油门、刹车还是线控技术都已非常成熟，雷达、相机等传感器则更多只是采集端的工具，“到底能不能把车从有人变无人，其实所有软件都烧在了控制器上”。</p>\n  <p>“我们已经推出了车规级方案”，何贝告诉36氪，车规级标准非常具有挑战，“硬件、操作系统、中间件甚至是上层的软件模型板块都要重新调整和优化”。</p>\n  <p>相较于封闭场景，开放的干线物流场景，常面临长距离颠簸、宽温差波动及强电磁干扰等多重挑战，非车规器件故障风险骤增。从小规模测试迈向大规模商用，从封闭场景驶入开放道路，车规级是自动驾驶企业必须闯过的‘生死关隘’。</p>\n  <p>开放场景面临的挑战不仅有车规级。何贝告诉36氪，“开放场景的数据量比封闭场景要高1-2个量级，过去行业大多都在封闭场景落地，所以我们还有一个重点，就是积累更多数据、优化整个模型”。</p>\n  <p>在国内市场规模化的同时，斯年智驾海外业务也获得新进展。何贝告诉36氪，公司目前已获得某海外头部企业相关域控制器定点项目。</p>\n  <p>斯年智驾的C轮3亿，既是场景物流玩家的一次加注，也折射出这条赛道的共识：封闭场景做透基本盘，开放场景闯过车规关，才有资格谈下一个量级。</p>\n  <h3><strong>以下是斯年智驾CEO何贝与36氪的对话，在不改变原意的基础上，略经编辑：</strong></h3>\n  <p><strong>36氪：封闭场景接下来的重点会是什么？</strong></p>\n  <p><strong>何贝：</strong>怎么让无人运输变成无人作业。重卡只是一个运输工具，它不是装卸工具。从全流程而言，只有自动驾驶重卡，其实是缺了一环的。重卡承担的水平运输加上装卸服务一类的垂直运输，才能构成完整的作业流程。</p>\n  <p>我们现在很多场景，比如要甩挂，现在都是人摇的。那我们考虑的就是，之后是不是可以换成机器人来摇？再比如说，一些叉车吊车设备，是不是完全可以通过具身智能去实现无人化？我们想做的，是转运与装卸全流程的无人化。</p>\n  <p><strong>36氪：这套工作流，目前已经投入测试了吗？</strong></p>\n  <p><strong>何贝：</strong>正在测试研发阶段，还没有那么快，这件事难度很大，我觉得可能需要3-5年才会落地。相较无人驾驶用了10年才落地，无人化物流作业的时间已经很短了。</p>\n  <p>一方面，现在AI的发展，正在加速我们研发和落地的全流程。另一方面，人工确实越来越贵，现在国内很多环卫场景，其实无人化已经跑得比较靠前了，有些功能基本已经不用人了。，全无人化迟早有一天会发生。所以我们认为，晚干不如早干。</p>\n  <p><strong>36氪：所以现在人形机器人非常火热，斯年有相关规划吗？</strong></p>\n  <p>何贝：第一，我们不会去造机器人本体。第二，但我们的域控制器已经有具身智能公司的订单了。斯年的角色，更多是合作与链接。</p>\n  <p><strong>36氪：自动驾驶重卡公司现在的赛点是什么？</strong></p>\n  <p><strong>何贝：</strong>我觉得第一是品牌，现在不太可能会有新公司或者测试类场景出现，公司当前的名声，基本已经决定了客户是否会跟你合作。第二是数据，现在各家公司都在各个场景有自己的建树，那背后就是数据的优势。第三是算力和算力平台，包括上面的数据闭环和飞轮系统。这三点，我觉得是目前各家公司PK的关键。</p>\n  <p><strong>36氪：自动驾驶重卡公司想要盈利，难点在哪？</strong></p>\n  <p><strong>何贝：</strong>如果不算研发里面的毛利，我觉得各家公司都差不多，没有本质上的区别，核心在于你对三费的控制。</p>\n  <p>说白了，销售费用取决于你的业务做的怎么样，以及公司有多大的外围支持。研发费用则取决于你能不能很好地使用AI，以及公司内部产品化做得怎么样。我觉得这两点是限制公司盈利的关键。</p>\n  <p>自动驾驶重卡，其实也是属于汽车制造业圈子的。在中国制造业，利润空间很低，所以只能想办法去降低硬件成本、公司经营的成本。</p>\n  <p>我觉得这是在中国做制造业的Key Point。&nbsp;</p>\n  <p><strong>36氪：现在大家都在出海，对自动驾驶重卡公司而言，出海的意义是什么？</strong></p>\n  <p><strong>何贝：</strong>海外的首要意义，肯定是能挣到钱，但是海外的风险也是跟利润是成正比的。第一，如果价格卖不到国内的3-4倍，那你在海外也挣不到钱。第二，海外的限制非常多。什么地方需要无人？其实一定是发达国家，像欧美、澳洲、日韩，但他们受限于工会，推进速度没那么快。</p>\n  <p>中东、南亚、南美这些地区大部分都是发展中国家，这些地区的人工很便宜，所以他们用无人的唯一理由是提升效率。所以我们目前的订单，也主要集中在这些地区。</p>\n  <p><strong>36氪：无论乘用车还是商用车，自动驾驶公司正在密集IPO，今年是自动驾驶上市的最后一个窗口期吗？</strong></p>\n  <p><strong>何贝：是</strong>不是最后一个不好说，但我们预测到2027年下半年可能会收紧。整个行业肯定是起起伏伏的，就算明年收紧了，说不定后年也会打开。比起上市，我觉得做好业务更重要一点。&nbsp;</p>", "category": "tech", "published_at": "2026-07-16T00:00:00+00:00", "fetched_at": "2026-07-16T02:09:43.715752+00:00", "fingerprint": "2c964e34e439db28"}, {"source": "36氪 - 最新文章", "title": "众筹近400万美金，这家明星AI体育硬件公司做了款多合一教练机器人 ｜产品观察", "url": "https://36kr.com/p/3896586337978244?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>在首款网球发球机卖爆后，庞伯特做了一款多合一AI教练机器人 。</p>\n  <p>这家公司是在一级市场很受关注的标的，2025年半年内完成三轮融资累计数亿元；旗下产品也在全球拥有了30余万用户，设备累计发球总量超20亿次。</p>\n  <p>但当下硬件赛道已经不容小而美的公司慢慢成长，网球赛道涌入了越来越多的对手，国内硬件创业团队快速入局，海外老牌专业设备厂商也在加速占据全球专业市场。</p>\n  <p>庞伯特很早就有拓宽赛道的想法，直到今年5月，其首款多运动合一智能体育AI教练机器人Aura发布，完成了从网球场景的训练工具、到多运动AI教练机器人的落地。这款产品在Kickstarter上线当天，仅5小时众筹金额便超过100万美金，累计金额近400万美元。</p>\n  <p>它的核心思路很直接：与其让用户为每一项运动分别买单，不如用一台设备覆盖尽可能多的场景，包括时下热门的板式网球、匹克球等等。基于所搭载的AI Coach智能教练体系，拓宽产品适用场景与用户覆盖范围。</p>\n  <p>从单一专项的训练工具，到兼容多类隔网运动的AI私教，庞伯特Aura所代表的，是智能硬件从专业竞技赛道向大众运动场景的一次纵深延伸。当设备不再只为少数人的性能指标服务，才能真正还给用户自由开启一项新运动的选择权。</p>\n  <h2><strong>当AI Coach长出「手眼脑」</strong></h2>\n  <p>在庞伯特的产品矩阵中，Aura的定位有些特殊。</p>\n  <p>此前，其PACE系列面向深度爱好者，球速高达130km/h，追求极致的球速、旋转、落点精度等发球性能。而Aura整机仅7公斤，可放入背包随身携带，它所搭载的首创AI Coach智能教练体系，将目标用户锁定在更广谱的大众球类爱好者群体。</p>\n  <p>一位教练的日常教学是怎样的？用手喂球给学员，用眼观察学员的动作，实时指正学员的动作。每一次喂球，都伴随一次即时的反馈与调整。</p>\n  <p>不同于传统视觉分析方案中，设备只能在训练结束后生成报告，用户无法在过程中主动调整，Aura要做的，是完整复刻教练的现场教学——其AI Coach会实时指出问题，通过与用户的动态交互中持续观察、判断和调整发球，在每一次击球中完成指导闭环，而非停留于事后的动作分析。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_c4bb82b0c6c243999c5b719dd7da6478@6022551_oswg6668333oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>但跨球类适配的难度，并非仅算法层面就能解决，还需要平台级的硬件能力。&nbsp;</p>\n  <p>不同球类的物理参数差异极大。单是网球运动，就涵盖了有压比赛用球、无压训练球、适合青少年用户的75%气压软球、以及低龄训练使用的50%气压轻球等多种规格。匹克球亦存在16洞、24洞两种结构，洞数不同，球体重量、风阻系数和飞行轨迹便截然不同。</p>\n  <p>常规单一发球机的夹持与推送结构仅适配一类标准球体，一旦更换球型，就容易出现球体挤压变形、卡球、出球偏移等故障。要让一套送球、落球、击球模块在同时兼容这些物理差异，必须对发球机器人的硬件架构进行系统性重构。</p>\n  <p>在出球前，轮组系统会根据球种差异，调整夹持间距与加速方式。比如网球，需要更大的夹持力和更高的轮速才能产生足够的出球速度和旋转；而匹克球更轻、风阻更大，则自动调整为对应标定参数。</p>\n  <p>“多合一设备的技术门槛并不仅在于‘能否把球发出去’，真正决定产品可用价值的核心难点，是针对不同球体，机器人对出球轨迹与旋转力度的可控性。”庞伯特创始人兼CEO张海波告诉硬氪。</p>\n  <p>由于各类球体的空气动力学特性完全独立，一套通用机械结构无法共用同一套运动参数，因此，团队还必须针对各细分球型搭建独立控制模型，以保证用户在切换运动后依旧拥有稳定、可控的训练手感。</p>\n  <p>如果说多合一发球和供球系统是Aura的“手”，作为执行终端负责精准可控地完成多品类发球，那其AI Coach的能力则建立在视觉感知与算法决策两个层面。“眼”负责捕捉每一次挥拍与球的轨迹，“脑”负责分析数据并给出训练建议。</p>\n  <p>Aura搭载了一个可拆卸的120fps双摄视觉模块Spotter，拥有10Tops端侧算力，配合语言、语音大模型，通过Spotter视觉感知与庞伯特体育大脑深度融合，实现“会看、会想、会指导”。</p>\n  <p>不同于以视觉分析为核心的方案，通过摄像头捕捉用户挥拍动作，生成训练报告与改进建议，它的优势是部署灵活、不依赖特定硬件，但其能力边界也很清晰，无法主动介入训练进程。Aura教练机器人的分野在于，前者从“分析动作”切入，后者从“发起练习”开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_e799c56e33004725a0672047c2f48f68@6022551_oswg7043130oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>基于庞伯特后端的“体育大模型”，背后是其“手-眼-脑”一体化技术架构的完整落地。系统不仅会记录下“球打到了哪里”，还能解析“为什么打到那里”，比如引拍慢了半拍？击球点偏外了？重心转移没跟上？</p>\n  <p>这些判断以语音即时提醒的交互形式，可在击球后实时反馈给用户并给出调整反馈，并驱动发球机器人调整下一组发球策略。在张海波看来，真正的教学必须从“喂球”起步，在动态交互中观察、判断、调整，而非停留在事后的动作分析层面。</p>\n  <p>同时，AI教练的进化同样依赖于高质量数据，这套完整训练闭环将进一步构成独特数据壁垒。庞伯特方面预计，Aura上市后每年可采集超过500万小时有效的高质量运动交互数据飞轮。</p>\n  <h2><strong>从专业化到多合一</strong></h2>\n  <p>作为全球首款提出多运动合一的AI教练机器人，面向大众球类运动爱好者，Aura在产品定义阶段就曾面临不小的争议。张海波向硬氪回忆，彼时团队内部的分歧很直接：“多合一会让用户觉得你什么都做，什么都不专业。”外部合作伙伴和投资机构也表达了类似的疑虑。</p>\n  <p>但他始终没有动摇，这个决策背后源于两重考量。</p>\n  <p>传统体育产品逻辑是“先选定运动、再购买设备”，这恰恰是初学者长期被忽略的核心痛点。在他们还没确定自己的运动偏好时，就得为单一运动支付整套设备成本。</p>\n  <p>根据PPA、Monitor Deloitte等行业调查显示，<strong>匹克球在北美以每年超过30%的增速，成为增长最快的运动之一；板式网球在欧洲的球场数量过去五年翻了近三倍；而网球本身仍是全球参与人数最高的球拍类运动。</strong></p>\n  <p>这三项运动在规则与场地上的相似性，决定了它们的初学人群存在大量重叠。</p>\n  <p>Aura的解决方案是，设备本身兼容三种球，用户按需解锁。“你不必在购买设备之前就做出决定。先用网球入门，哪天想试试匹克球了，在App里支付对应的订阅费用就能解锁。对用户而言，用一次日常体验课相当的花销，就能去尝试自己对另一项运动的兴趣。”张海波说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260715/v2_1e6063ee328a415fa404dd9a197446f6@6022551_oswg6817991oswg4000oswg2667_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">多运动合一智能体育AI教练机器人Aura（图源/企业）</p>\n  <p>上线结果也印证了他的判断。张海波告诉硬氪，下单用户中，基本全部用户选择了带AI教练功能的版本，选择多运动合一的用户占比也超过一半。</p>\n  <p>这其实是消费心理里一种典型的“价值感知”逻辑：多合一功能未必被高频使用，但它的存在本身放大了用户对产品性价比的判断，降低了首次购买的决策门槛。</p>\n  <p>“它是一个信号，多合一功能意味着用一台设备的成本，享有多种运动的服务，性价比优势不言而喻。”张海波补充道。“用户希望拥有这个可能性，哪怕当下用不上。”</p>\n  <p>而从商业化角度看，对于创业公司来说，多合一功能也是个更具性价比的选择。</p>\n  <p>Aura的策略是把核心机械平台做通用，只在轮组调节和算法参数层面做差异化适配。用单个SKU覆盖网球、匹克球、板式网球等多个品类，供应链物料复用程度更高、生产效率和成本管控更优；而它触达的用户群体，从单一运动人群扩展到了三个重叠度极高的运动人群。</p>\n  <p>标准化设备是硬件入口，真正的价值锚点也进一步向软件定义的运动体验渗透。庞伯特用户可以选择购买单运动版本，后续想解锁匹克球或板式网球，通过App内按月或按年付费即可。</p>\n  <p>这种“硬件平价、软件增值”的模式过去在消费电子领域已被验证，但在智能化AI运动硬件行业仍属少数。它更深层意图的意图在于，先用一套硬件和一套数据系统把用户留在自己的生态里。</p>\n  <p>“用户今天用Aura学网球，数据积累在庞伯特的系统里；三个月后想试试匹克球，不需要再买一台机器，只需在软件端完成一次付费解锁。设备没换，用户没流失，数据还在持续生长。”张海波说。</p>\n  <p>用户想要的不是功能堆叠，而是一个能在动态训练中持续陪伴、实时反馈的“真实存在”。它是一种更具体的需求。庞伯特试图在构建一个越用越聪明的AI教练网络，真正将“数据×算法×硬件×场景”融合并落地为消费级产品。</p>\n  <p>硬件是入口，用户是资产，数据是壁垒，三者闭环一旦形成，对庞伯特而言，真正的护城河就不再是那一台设备，而是一套持续进化的训练系统。Aura要做的，是实时指导的教练，多合一的运动，它从硬件层面重新思考了“一台设备到底能覆盖多少场景”，又用软件和数据把不同场景串联起来，形成一个可扩展的体系。当用户用得越久，系统就越懂TA。</p>\n  <p>这个思路未必是唯一的答案，但它提供了一个被讨论样本：在运动器材这个行业里，让初学者能实现低成本的跨运动切换——并在尝试的过程中，让系统记下每一次挥拍。</p>", "category": "tech", "published_at": "2026-07-16T01:30:00+00:00", "fetched_at": "2026-07-16T02:09:43.715738+00:00", "fingerprint": "8ab0f8b2eba79b0e"}, {"source": "少数派", "title": "角落新声｜从桌面「长」出来的创业空间，我靠这些好物「偷」一点清闲", "url": "https://sspai.com/post/112243", "summary": "编者按：本文是「角落新声」征文活动的入围文章。本次主题征文由声擎冠名，邀你前来分享那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅。8月7日前投稿参与，即有机会获得声擎Cyber5 ...<a href=\"https://sspai.com/post/112243\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T03:00:00+00:00", "fetched_at": "2026-07-16T02:09:42.301241+00:00", "fingerprint": "3a8f8c0212e0c9b2"}, {"source": "少数派", "title": "具透 | iPadOS 27 首个公开测试版中你不容错过的 12 个新特性", "url": "https://sspai.com/post/112338", "summary": "升级到 iPadOS 27 以后，不妨试试这些新功能……<a href=\"https://sspai.com/post/112338\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T07:00:00+00:00", "fetched_at": "2026-07-16T02:09:42.301235+00:00", "fingerprint": "0e03b63137335fd6"}, {"source": "少数派", "title": "Leitra 诞生记：一次未完成的实践", "u his year, allowing you to hold off on updates for up to 35 days [&#8230;]", "category": "tech", "published_at": "2026-07-14T21:32:04+00:00", "fetched_at": "2026-07-15T01:59:55.944935+00:00", "fingerprint": "704285222bff80ed"}, {"source": "The Verge", "title": "Nothing’s good-looking Watch 3 Pro smartwatch is just $69", "url": "https://www.theverge.com/gadgets/965565/cmf-nothing-watch-3-pro-smartwatch-ios-android-deal-sale", "summary": "While most fitness trackers are losing the screens to keep the price low, the CMF by Nothing Watch 3 Pro is a bit different. The budget-friendly smartwatch with a 1.43-inch OLED display is even cheaper than usual at Amazon, where it costs $69 in every color (the price fluctuates between $79 and $99). Some notable [&#8230;]", "category": "tech", "published_at": "2026-07-14T22:24:26+00:00", "fetched_at": "2026-07-15T01:59:55.944926+00:00", "fingerprint": "ea2daf8aa7f20f3d"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 浙大系桌面CNC团队获商汤国香、首形科技等近亿元天使轮，要用AI技术降低制造门槛", "url": "https://36kr.com/p/3894935854677249?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，桌面级CNC（数控机床）企业「奇塑科技」于近期完成近亿元人民币天使轮融资。本轮融资由商汤国香、首形科技、全新世、奇绩创坛共同投资。本轮资金将主要用于桌面级CNC软硬件产品的研发、量产以及后续的市场营销。</p>\n  <p>在消费级3D打印机和激光雕刻机已完成大众市场教育，并诞生了诸如拓竹、xTool等多个头部企业后，能够实现“从软材到硬材强三维加工”的CNC产品，被视为消费级制造领域的下一片万亿蓝海。</p>\n  <p>早在2018年行业普遍聚焦3D打印赛道时，奇塑科技团队就已将目光投向CNC领域。在创始人夏楠看来，CNC是制造业最基础、通用性最强的加工方式，覆盖的场景比3D打印更广，拥有万亿级的产业底盘；如果能用AI重构CNC的制造范式、降低门槛，将进一步拓宽CNC的使用场景，甚至下沉到普通用户的桌面端。这会改变全社会的生产模式，释放极大的增量价值。</p>\n  <p>当前，市面上已涌现出数家消费级CNC初创公司，资本也争相涌入。企业共同面临的问题是：如何降低CNC使用门槛。这是工业界花费几十年也未解决的难题。</p>\n  <p>具体来看，第一个难题，使用CAM软件极其复杂。CAM即计算机辅助制造（Computer Aided Manufacturing），是将三维模型转化为数控机床可识别加工指令的核心环节，直接决定加工的精度、效率与可行性，是CNC操作链路中技术门槛最高的部分。用户完成一个零件的工艺设计需要配置几十甚至几百个工艺参数。</p>\n  <p>第二个难题，CNC工艺考验经验。师傅需要在大脑中排布众多复杂的变量：如何装夹、用什么刀具、加工参数如何配置等等，这高度依赖个人实操经验。</p>\n  <p>夏楠告诉硬氪：“工厂里培养一个能熟练使用CNC的师傅需要3到5年。即使是985毕业的工程师，想要精通CNC也得全身心投入至少半年时间。”</p>\n  <p>在夏楠看来，解决CNC门槛的最佳方案就是AI CAM——把复杂的工艺知识内化到系统中去，给每一台机床配一个AI老师傅。</p>\n  <p>自2018年起，奇塑科技开始AI CAM的研发工作。起初他们遇到最大的问题就是缺少数据。在传统CNC行业，加工工艺知识多以口传心授的方式传承，未能形成可沉淀的数字资产，也难以快速迁移。此外，真实加工场景的复杂度远超预期，即便拥有多年经验的师傅，也会时常遇到未曾接触过的全新案例。这也就构成了AI CAM软件的核心研发难点——如何将分散、依赖个人经验的工艺知识数字化，并转化为可沉淀、可复用的推理决策模型。即使是海外头部工业软件厂商，至今也未形成完全成熟的全自动化方案。</p>\n  <p>为了掌握工艺知识，奇塑团队深入一线积累了数千小时实操经验。为了积累工艺数据、并在真实场景中验证，奇塑科技自建基于AI CAM的柔性工厂，通过真实接单生产的方式构建数据闭环，持续迭代算法模型。</p>\n  <p>硬氪了解到，奇塑科技的AI CAM系统，核心能力主要体现在两方面：</p>\n  <p>第一，简化了操作流程，消除专业学习门槛。传统的CAM是“人去适应软件”，需要用户具备系统的加工工艺知识，手动配置上百项参数。奇塑科技将交互逻辑反转为“软件适配人”——用户只需导入模型，软件会将复杂的数控编程收敛为极简的三步：工艺生成、预览、加工，无需使用者掌握专业加工知识与编程能力，软件会告诉用户需要做什么。</p>\n  <p>第二，高场景覆盖率，配套完整数据支撑。依托团队积累的数十万份真实加工模型数据，该系统算法持续学习升级。借助底层创新的AI CAM架构和决策模型，整个生成过程无需人工干预。系统数据覆盖大量“Corner Case（边缘案例）”可支撑工艺方案的快速生成，提升用户使用体验。</p>\n  <p>奇塑科技基于多年自研的AI CAM系统，计划在今年Q4正式上线其首款桌面级五轴CNC。产品会有标配的自动换刀（刀库）、自动对刀、全封闭防尘静音舱体以及1500w大功率主轴，并在AI CAM系统的支持下，实现“端到端”的易用性。</p>\n  <p>团队背景方面，奇塑科技核心团队来自浙大计算机和机械系。成员均为十年以上硬核Maker，涉猎过外骨骼、3D打印机等多个硬件领域，且拥有数十万台量产经验。</p>\n  <p>随着个性化制造与快速迭代需求的增长，桌面级制造设备的应用边界正在持续拓展，桌面级CNC赛道也将迎来更多市场参与者与技术迭代</p>\n  <p><strong>CEO对谈：</strong></p>\n  <p><strong>硬氪：2018的时候，为什么会选择进入CNC这个赛道？</strong></p>\n  <p><strong>夏楠：</strong>我们当时的判断是，制造业的数智化、普惠化是长期确定的方向。而CNC是制造业最基础、通用性最强的加工方式，对应着万亿级的产业底盘。几乎所有产品的制造过程都直接或间接涉及数控加工。如果能重构CNC的制造范式，把工业级的加工能力下沉到更广泛的场景甚至桌面端，能释放巨大的增量价值。</p>\n  <p><strong>硬氪：团队一直在从事AI+CNC相关工作，在自研AI CAM相关技术上，最大的难点在哪里？</strong></p>\n  <p><strong>夏楠：</strong>核心难点在真实制造场景的复杂性。传统制造业里，加工工艺知识多以口传心授的方式传承，未能形成可沉淀的数字资产，也难以快速迁移。再加上真实加工的变量太多了，哪怕是老师傅，也会碰到从没见过的全新案例。想要把这些分散的、依赖个人经验的工艺知识，转化成可沉淀、可复用的决策模型，难度极高。海外头部工业软件厂商深耕该领域数十年，也仍未形成完全成熟的全自动化方案。</p>\n  <p>这个领域需要真正的长期主义。AICAM要在真实场景中大量验证迭代才能成熟，这个过程是急不来的。比如，我们有一个算法是在2021年写的，直至2024年底，其稳定性才满足规模化落地的要求。整个研发过程依赖长期的技术沉淀与场景验证。</p>", "category": "tech", "published_at": "2026-07-14T03:34:12+00:00", "fetched_at": "2026-07-15T01:59:55.830821+00:00", "fingerprint": "e0eaf1979cc59427"}, {"source": "36氪 - 最新文章", "title": "🎁36氪放福利啦！体验10秒，即可免费抽AirPods 4、Redmi手环、超人帆布包！", "url": "https://36kr.com/p/3894914381970438?f=rss", "summary": "<h3><strong>无门槛参与，所有微信用户都可以免费抽奖！</strong></h3>\n  <p> ges%2Fhome%2Findex&amp;scene=im&amp;aid=497858&amp;lang=zh</strong></a></p>\n  <p>&nbsp;</p>\n  <h3><strong>另外，36氪官方股票舆情情报社群正式对外开放</strong>！&nbsp;</h3>\n  <p>无论你是短线交易者、波段玩家、赛道研究者，还是专注基本面分析的投资者，这里都能适配你的投资风格。</p>\n  <p>依托专业大数据舆情系统，我们为你实时拆解全网股市动态：深挖个股一手情报、复盘大盘涨跌逻辑、分享赛道实战干货。帮你先人一步捕捉行情机会，提前规避潜在风险，彻底摆脱盲目跟风的困境。</p>\n  <p>👉 扫码添入群：<strong>36氪企业全情报 官方股票舆情交流社群：</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_d051ffac830f419d8b62e7a42c2a9547@5284654_oswg10034oswg267oswg267_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码入群！</p>\n  <p>&nbsp;</p>\n  <p><strong>早点看到，早点理解，早点布局。</strong></p>\n  <p>现在就来体验<strong>36氪企业全情报</strong>，不仅能提升投资信息获取效率，还有机会把大奖带回家！🎁</p>", "category": "tech", "published_at": "2026-07-14T04:21:11+00:00", "fetched_at": "2026-07-15T01:59:55.830815+00:00", "fingerprint": "1b60e42cf317a1ef"}, {"source": "36氪 - 最新文章", "title": "估值110亿美元，这家超级独角兽要帮初创公司从Day0走向全球", "url": "https://36kr.com/p/3895355856403456?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_e96c813c6e344327be8c7f02ba97a9ee@5722974_oswg297210oswg2378oswg1010_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>凌晨三点，一家刚成立不久的AI创业公司，可能已经在同时服务旧金山的客户、采购首尔的技术服务，并与拉各斯的合作伙伴签下合同。这家公司甚至还没有招到第一名全职财务人员，业务却已经跨越多个市场、币种和监管辖区。&nbsp;</p>\n  <p>AI正在让这样的创业路径成为可能。过去需要市场、运营、客服等一整套全球化团队才能完成的工作，现在借助智能体就能承担相当一部分。新一代初创企业不必再按照“先站稳本土、再逐步出海”的传统顺序扩张，而可能从成立第一天起，就直接面对全球客户和供应商。</p>\n  <p>但当AI以足够快的速度跑在前面时，大多数企业的金融管道仍未为此做好准备。这也是为什么，全球顶级资本开始押注金融基础设施的AI化重构。</p>\n  <p>2025年6月，全球金融基础设施平台Airwallex空中云汇宣布完成3.2亿美元H轮融资，估值达110亿美元，较半年前的80亿美元大幅跃升，本轮融资由老股东Addition领投，Baillie Gifford、T. Rowe Price、Amex Ventures等现有及新晋投资者跟投。</p>\n  <p>这笔融资也传递出一个明确的信号：AI经济需要一套与之匹配的金融操作系统，而空中云汇正是少数既有全球合规底座、又在主动重构这套系统的玩家之一。</p>\n  <h2><strong>聪明的大脑，瘫痪的钱包</strong></h2>\n  <p>AI能力的爆发与金融基础设施的滞后之间，正在形成一道肉眼可见的鸿沟。</p>\n  <p>过去，AI的角色更像是一名建议者。它告诉人类该买什么、该付给谁、该走哪条汇路；而现在，AI智能体正在成为执行者，无论是采购算力、订阅SaaS服务，还是向海外供应商完成付款，越来越多的商业动作都开始由AI自主发起。</p>\n  <p>全球市场研究机构Forrester发布的报告指出，2024年至2025年间，AI智能体辅助支付已从概念验证阶段快速走向实际部署。OpenAI于2025年9月正式在ChatGPT中支持AI智能体辅助支付，Stripe也推出了专为AI智能体设计的Agentic Commerce&nbsp;Protocol。但问题在于，AI的决策速度是毫秒级的，但它所依赖的金融系统，仍然运行在人工审批和T+2结算的节奏里。</p>\n  <p>对有海外采购需求的B端AI企业而言，这种矛盾更加突出。设想一家正在快速扩张的中国AI公司：它需要同时向美国、欧洲、东南亚的多家云服务商和数据供应商付款，涉及美元、欧元、新加坡元等多种货币；每一笔跨境转账都可能触碰不同国家的合规要求；汇率波动、中间行手续费、结算周期的不确定性，往往让财务团队疲于应付。</p>\n  <p>更棘手的是，当企业规模扩大，簿记、报销、税务、银行系统各自为政的局面会以指数级的方式放大管理成本。一位服务过多家出海AI企业的CFO就曾描述过这样的场景：公司在十几个国家有供应商，每个月光是对账就要耗费财务团队将近一周的时间，还要随时应对各地监管机构对资金流向的核查要求。</p>\n  <p>这意味着，财务团队最宝贵的时间和精力，正在被消耗在本可自动化的重复劳动上。更危险的是，滞后的对账周期会让管理层长期处于财务盲区。决策依赖的数据往往已经过时数天，一旦遭遇汇率剧烈波动或监管突击核查，企业几乎没有足够的反应窗口。</p>\n  <p>当然，仅凭一个聪明的AI模型，或许它可以读懂发票、发现异常并给出支付建议，但却无法凭空获得金融牌照，也无法代替银行合作关系和遍布全球的本地支付网络。只有当这些金融能力被统一打通整合，并以AI能够调用的方式开放，AI的分析和判断才有可能真正转化为财务运营效率。</p>\n  <p>这也让金融基础设施在AI时代被重新审视。过去，跨境金融平台主要解决的是企业如何更高效地收付款。如今，随着AI逐渐进入财务工作流，企业不仅需要支付通道，还需要让AI在明确的授权范围内调用金融工具，同时保证整个过程符合内部制度和监管要求，并留下可以追溯的记录。</p>\n  <p>对新一代AI公司而言，这套能力尤其重要。AI让企业可以用更小的团队服务全球客户，却没有消除跨境金融本身的复杂性。如果账户、支付和财务管理仍散落在不同系统里，所谓从Day 0走向全球，就很容易卡在最基础的资金运营环节。</p>\n  <p>Gartner预测，到2026年，33%的企业软件将集成Agentic AI能力，财务职能将是渗透极深的领域之一。更关键的是，当AI智能体经济真正成熟，谁的金融底座能支撑“代理自主交易”，谁就掌握了下一阶段的入场券。</p>\n  <p>这正是空中云汇此次融资所瞄准的方向。</p>\n  <h2><strong>空中云汇的两张牌</strong></h2>\n  <p>成立于2015年的空中云汇，用十年时间在全球铺设了85个以上的监管牌照、整合160个本地支付网络。据其披露，目前空中云汇年化交易量达到2870亿美元，93%的交易都可实现当日结算，业务覆盖全球200多个国家和地区。</p>\n  <p>而这套基础设施的价值，在AI时代正在被重新定价：十年铺设的合规网络与本地通道，恰好成为智能体经济所需要的底层管道。此次H轮融资，则是空中云汇在这套管道之上加盖“智能层”的战略动作，核心载体是两款新产品：T:0与Airi。</p>\n  <p>T:0瞄准的是企业财务运营的重构。</p>\n  <p>当前大多数企业的财务系统，是一个由分散工具拼凑而成的混合体：簿记、报销、税务、银行系统各自为政，数据在它们之间流转时不断产生摩擦，财务团队的大量精力消耗在重复性的核查与录入工作上。</p>\n  <p>T:0相当于一个自主运营的金融部门，思路是从第一性原理重新设计系统：将簿记、预测、税务、合规、报告与对账整合进一个持续运行的统一平台，让财务职能像一台永不停机的引擎持续运转，让财务团队从管理繁琐工作中解放出来，专注于战略决策。</p>\n  <p>对于从零起步的创始人而言，T:0意味着从第一天起就拥有内置合规逻辑的CFO级账簿，无需经历系统迁移的阵痛。这是因为，T:0可直接调用空中云汇已有的全球支付通道、多币种账户和合规框架，财务数据与资金流动在同一套基础设施内完成闭环。目前T:0处于私测阶段，预计数周内更广泛推出。</p>\n  <p>Airi应对的则是一个更现实的命题：当AI智能体开始代替人类完成购买行为，商业世界需要的远不止更聪明的结账页面。空中云汇将其定义为“智能体商业”。</p>\n  <p>行业早有智能体布局的先例。OpenAI与Stripe在2025年联合推出了Agentic Commerce Protocol（ACP），为AI智能体执行购买行为提供了标准化协议框架；Mastercard也在同年发布了面向智能体商业的支付解决方案。但这些方案存在一些共同局限，本质上是在传统卡支付通道上加了一层AI界面，并未解决AI智能体在全球范围内安全调用和转移资金的底层问题。</p>\n  <p>Airi正是为填补这一空白而生。它从底层重新构建了一套完整的代理钱包能力：AI智能体可以持有专属的代理卡，在设定的支出限额内自主发起交易，并按照权限层级调用不同币种的余额，整个过程在受监管的框架内运行，让AI智能体真正具备代表人类完成跨境交易的能力。</p>\n  <p>目前，Airi已实现“���键结账”功能。消费者在完成身份绑定后，AI智能体可以在授权范围内直接发起支付，无需每次手动填写信息，早期测试数据显示商家转化率因此提升了14%。接下来，它将进化为完整的智能体钱包基础设施，配合空中云汇更广泛的智能体商业套件，打通从发现到结算的完整资金链路。</p>\n  <p>如果说T:0解决的是“钱怎么管”，Airi解决的就是“钱怎么花”——前者面向企业财务团队，后者则面向商家与AI开发者，两者共同依托空中云汇已有的全球合规网络，构成一套协议无关、天然全球化的金融操作系统。</p>\n  <p>在一个AI智能体可能同时运行在OpenAI、Anthropic、Google等不同生态之上的世界里，不被任何单一协议绑定，本身就是一种战略优势。</p>\n  <h2><strong>为什么是空中云汇，为什么是现在</strong></h2>\n  <p>空中云汇此次融资，可以视为行业窗口期正在开启的信号。金融基础设施的AI化重构，正在成为下一个真正的竞争主战场。它比拼的已经不是模型能力，而是谁的管道能让AI真正动起来。</p>\n  <p>这个赛道有一道特殊的护城河：监管资质和本地支付网络。一张支付牌照的申请周期往往以年计，本地清算网络的接入需要逐一谈判，合规体系的建立更是需要在每个市场长期投入，而这几乎无法靠短时间内用钱堆积。</p>\n  <p>空中云汇用十年时间积累的85+全球牌照和160+本地网络，在AI时代成为了一种稀缺资产，时间壁垒成为了它的核心价值之一。这也是为什么本轮融资能够吸引Amex Ventures入局：作为传统金融巨头的战略投资部门，美国运通的押注也是对这套合规基础设施价值的背书。</p>\n  <p>更值得注意的是，这笔融资发生在空中云汇已经实现盈利的背景下。根据空中云汇官方公布的数据，其年化收入已达13亿美元，ARR于2025年第四季度转正，全球超过67.5万家企业直接或通过平台使用其服务管理跨境金融运营。这些数字证明，其商业模式已经成功跑通。此次H轮融资是在财务健康的前提下，主动加速进入一个新的战略阶段。</p>\n  <p>在Agentic AI重塑财务职能的过程中，真正能够胜出的，将是那些同时具备全球合规能力与AI原生架构的平台。巧的是，空中云同时拥有了这两种条件：一边是用十年时间沉淀下来的合规基础设施，另一边是从第一性原理出发、为智能体经济重新设计的产品架构。两者叠加，构成了它在这个窗口期中的独特优势。</p>\n  <p>AI时代已无本土市场。当AI智能体开始跨越国境自主交易，企业所需要的金融底座，必须在第一天就是全球化的。那些现在还在用传统银行账户、手动审批流程支撑海外业务的公司，正在用昨天的基础设施跑明天的速度。而当智能体经济的浪潮真正到来，留给迁移和重建的时间窗口，可能比大多数人预期的要短得多。</p>", "category": "tech", "published_at": "2026-07-14T10:48:32+00:00", "fetched_at": "2026-07-15T01:59:55.830808+00:00", "fingerprint": "0df1507f89b3768d"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜智谱：完成配售新H股募资约314亿港元；荣耀与阿里将开展AI智能体终端合作；小米机器人首次实现汽车工厂柔性工件的长时作业", "url": "https://36kr.com/p/3895322613185543?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>中国神华：预计上半年净利润同比增长6.9%-21.1%</strong></p>\n  <p>36氪获悉，中国神华公告，预计2026年上半年归属于上市公司股东的净利润为263亿元至298亿元，同比增长6.9%-21.1%。业绩变动主要系煤化工业务量及自有铁路、港口、航运业务量增加，带动相关业务利润同比增长。</p>\n  <p><strong>中国人寿：预计上半年净利润同比增长约215%-235%</strong></p>\n  <p>36氪获悉，中国人寿公告，预计2026年半年度归属于母公司股东的净利润约1289.33亿元到1371.19亿元，同比增长约215%到235%。业绩变动主要系公司持续深化资产负债联动，优化资产配置，提升投资专业能力，取得良好投资业绩。</p>\n  <p><strong>光迅科技：预计上半年净利润同比增长50%-65.15%</strong></p>\n  <p>36氪获悉，光迅科技公告，预计2026年半年度归属于上市公司股东的净利润为5.59亿元-6.15亿元，同比增长50%-65.15%。报告期内，得益于全球AI算力投资浪潮驱动数通光模块需求快速增长，叠加国内云服务商加大数据中心建设投入，公司凭借完备的产品体系覆盖数据中心及通信网络全场景，有效支撑了经营业绩的持续提升。预计净利润较上年同期大幅增长。</p>\n  <p><strong>脸书母公司计划在美建500亿美元超大型数据中心</strong></p>\n  <p>Meta于13日宣布，将大幅扩大其在美国路易斯安那州里奇兰县的“许珀里翁”（Hyperion）数据中心超级集群项目规模。该项目规划容量将提升至5吉瓦（GW），预计总投资额将超过500亿美元。分析人士指出，在人工智能（AI）投资热潮推动下，Meta及微软、谷歌、亚马逊等科技巨头正加速在全球范围内布局算力基础设施。（新浪财经）</p>\n  <p><strong>赣锋锂业：预计上半年净利润为36.5亿元–46亿元，同比扭亏为盈</strong></p>\n  <p>36氪获悉，赣锋锂业公告，预计2026年上半年净利润为36.5亿元–46亿元，上年同期亏损5.31亿元。报告期内，受益于全球新能源产业快速发展，下游客户对锂盐的需求增长，公司锂盐产品的销售价格较上年同期显著上涨；同时，随着锂资源项目的产能逐步释放，公司成本结构有效优化。叠加储能市场需求持续增长，锂电池板块产销量明显提升，共同推动公司经营业绩同比增长。</p>\n  <p><strong>腾讯云：数据万象MetaInsight智能检索产品计费项大幅降价</strong></p>\n  <p>36氪获悉，腾讯云公告，将于2026年7月27日对数据万象MetaInsight智能检索相关计费项进行命名规范调整与价格优化，标量检索由2元/千次降价至0.04元/千次，混合检索由5元/千次降价至0.08元/千次，标量存储由0.06元/千个/月降价至0.04元/千个/月等。</p>\n  <p><strong>戴比尔斯将暂停南非最大钻石矿生产</strong></p>\n  <p>国际钻石巨头戴比尔斯集团13日宣布，计划将位于南非林波波省的维尼蒂娅钻石矿暂停生产两年，以降低成本。戴比尔斯当天发表声明说，公司其他矿区将维持现有产量，总体产量指引不变。戴比尔斯集团首席执行官阿尔·库克在声明中表示，相关调整旨在增强公司经营韧性。此次停产是戴比尔斯削减成本、调整全球业务计划的一部分。自2024年以来，戴比尔斯已将年度管理费用削减逾1亿美元，并出售或关闭部分非核心资产。维尼蒂娅钻石矿是南非最大产值钻石矿，约占南非钻石年产量的40%。该矿靠近博茨瓦纳和津巴布韦边境，已运营30多年。（新华社）</p>\n  <p><strong>荣耀与阿里将开展AI智能体终端合作</strong></p>\n  <p>荣耀将于7月18日在2026世界人工智能大会举办“从数字屏幕到具身智能——物理世界新范式”分论坛。除之前已官宣的世界著名科技未来学家凯文·凯利外，阿里巴巴集团副总裁、ATH事业群Token Foundry多模态交互负责人许主洪的加入，也引发了业界对后续各方合作的猜想。记者从荣耀和阿里内部渠道获悉，双方将官宣重磅合作，联手方向极有可能是下一代终端操作系统 Agentic OS 的落地实践。据此前公开消息，本次论坛将聚焦AI的智能度和生命感，探讨从“工具”到“伙伴”的 Agentic OS 趋势演进。（财联社）</p>\n  <p><strong>智谱：完成配售新H股募资约314亿港元</strong></p>\n  <p>36氪获悉，智谱在港交所公告，公司此前披露拟配售最多1978万股新H股，现已于2026年7月13日完成配售。按配售价每股1588港元向不少于6名承配人配发及发行合共1978万股新H股，约占扩大后已发行H股总数的4.25%。配售事项所得款项总额约314.11亿港元，所得款项净额约313.75亿港元。</p>\n  <h2>投融资：</h2>\n  <p><strong>“奇塑科技”完成近亿元人民币天使轮融资</strong></p>\n  <p>36氪获悉，桌面级CNC（数控机床）企业“奇塑科技”于近期完成近亿元人民币天使轮融资。本轮融资由商汤国香、首形科技、全新世、奇绩创坛共同投资。本轮资金将主要用于桌面级CNC软硬件产品的研发、量产以及后续的市场营销。</p>\n  <p><strong>“新奇机器人”完成A+轮融资</strong></p>\n  <p>36氪获悉，近日，“新奇机器人”宣布完成A+轮融资。这是新奇机器人自2025年底启动首轮市场化融资以来，半年内完成的第三轮融资。本轮融资完成后，新奇机器人的投资人阵容涵盖经纬创投、沃赋创投、云晖资本、厚雪资本、Synstellation Capital等市场化投资机构，智元机器人、福然德等产业投资方，以及建发新兴投资、吴中金控、雉荟投资、宁波天使等国有背景资本。</p>\n  <p><strong>“大衍科技”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，空间智能公司“大衍科技”近期完成数千万元天使轮融资，由松禾资本领投，浙江省省金控与广州番禺创新基金等国资背景机构参与。资金将主要用于触觉大模型研发、机器人数据产线建设及团队扩张。</p>\n  <h2>新产品：</h2>\n  <p><strong>小米机器人首次实现汽车工厂柔性工件的长时作业</strong></p>\n  <p>36氪获悉，7月14日，小米披露旗下人形机器人在汽车工厂“实习”的最新进展。经过4个月的不断迭代，小米机器人在自攻螺母上件工站的双侧作业成功率从90.2%提升至98%，距离人工作业合格率仅差1个百分点。与此同时，还解锁了两项全新岗位——中控台侧盖板排序和料箱折叠回收，两项任务成功率均已达到90%。其中，小米此次展示的中控台侧盖板排序工站场景，首次在汽车工厂实现柔性工件的长时连续作业。</p>\n  <p><strong>B站AI创造公开赛投币榜上线</strong></p>\n  <p>36氪获悉，7月14日，哔哩哔哩（简称“B站”）正式上线“build in bilibili · AI创造公开赛”作品投币入围榜。数据显示，启动仅一个月，大赛投稿创作者已接近5000人，站内“vibe&nbsp;coding”相关关键词的日均搜索量飙升6倍。尤为值得关注的是，目前投币榜前十名中，约半数为粉丝量不过万、且无专业开发经验的UP主，另有两到三个席位由创业团队占据。</p>\n  <p><strong>微型脑部植入物利用温度双向调控神经活动</strong></p>\n  <p>韩国高丽大学医学院团队研制出一款新型脑部植入物，能利用温度双向调节神经活动，为下一代脑机接口和神经疾病治疗带来了全新可能。相关论文发表于新一期《科学进展》杂志。（科技日报）</p>\n  <h2>今日观点：</h2>\n  <p><strong>多家头部量化机构回应“韩国因子”传言：行业极少使用韩国数据</strong></p>\n  <p>13日盘后，一则关于“A股的量化策略早已将韩国科技股走势纳入因子模型，并在A股市场内部引发不同科技板块连锁反应”的市场传闻，在业内广泛传播。对此，某规模超200亿元的量化私募创始人表示：“从行业层面看，国内头部量化机构极少会使用韩国数据来挖掘因子，这种所谓传闻纯属外行‘小作文’。今天量化行业也是普遍大亏，我盘后了解到，大部分同行今天的超额收益都是负数。”对于今天市场的下跌原因，上述私募人士认为：“市场涨多了就会跌，跌多了就会涨，不应当有‘阴谋论’”。另一家百亿级量化私募总经理则回应称，上述传闻并不公允，“假如量化机构完全依据海外科技股的涨跌来进行交易，长期必然会是负超额，大部分量化机构不会这么做。量化行业总体还是通过寻找并持有优质公司来获取超额。”此外，一家以量化中性为特色的知名量化私募创始人也表示，“这种说法完全没道理”。近几天A股的调整更多是全球市场的相关性体现，以及前期科技资产拥挤度偏高所导致。该私募人士进一步强调，目前A股主要权重指数估值合理，后续市场进一步调整空间有限。（中证报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>美联邦取消新能源车税收优惠，加州出台地方补贴政策针锋相对</strong></p>\n  <p>美国加利福尼亚州州长加文·纽森（Gavin Newsom）13日签署了SB 168号法案，正式启动加州新一轮零排放汽车（ZEV）即时补贴计划。根据SB 168号法案，加州政府将拨付1.355亿美元的财政资金，并强制要求参与该计划的汽车制造商进行等额配资，共同构建总额约2.7亿美元的“首次购买电动汽车”补贴基金。该法案规定，首次购买电动汽车的加州家庭可在购车时直接享受“即时返现”优惠，无需等待后续退税。（新浪财经）</p>", "category": "tech", "published_at": "2026-07-14T11:21:42+00:00", "fetched_at": "2026-07-15T01:59:55.830800+00:00", "fingerprint": "62cdef1a1cf705b5"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨LV起诉国家知识产权局；DeepSeek梁文锋成全球AI公司领域新首富；戴比尔斯将暂停南非最大钻石矿生产", "url": "https://36kr.com/p/3896138695706497?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>小米机器人首次实现汽车工厂柔性工件的长时作业</li>\n   <li>SK海力士加速Y1工厂建设，现已开始订购DRAM制造设备</li>\n   <li>国际金价持续回调，后市关注美联储政策路径</li>\n   <li>海关总署：中国出口连续11季度保持增长，贸易增量集中于AI领域</li>\n   <li>韩国政府四部门将于周四召开会议，就单股杠杆ETF对股市冲击研究应对方案</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>LV起诉国家知识产权局，案件定于16日开庭审理</strong></p>\n  <p>人民法院公告网显示，北京知识产权法院将于2026年7月16日公开审理一起涉及路易威登的商标行政纠纷案。该案案号为（2026）京73行初4727号，原告为路易威登马利蒂，被告为国家知识产权局，黄民耀作为第三人参加诉讼。路易威登马利蒂也是此前起诉茉莉奶白商标侵权案的原告。公告暂未披露涉案商标及具体争议内容。案件定于16日9时30分在北京知识产权法院第15法庭开庭审理。（界面新闻）</p>\n  <p><strong>DeepSeek梁文锋身价飙升至360亿美元，成为AI公司新首富</strong></p>\n  <p>根据最新的彭博亿万富豪指数（截至2026年7月14日），DeepSeek创始人梁文锋的身价飙升193亿美元，达到360亿美元（注：现汇率约合2443.78亿元人民币），成为全球AI公司领域的新首富（不涉及包含AI业务的大型集团）。</p>\n  <p>梁文锋的总财富达360亿美元，比去年同期增长了199亿美元，全球富豪榜排名第63，超越Anthropic联合创始人达里奥·阿莫代伊和OpenAI联合创始人格雷格·布罗克曼。（IT之家）</p>\n  <p><strong>戴比尔斯将暂停南非最大钻石矿生产</strong></p>\n  <p>国际钻石巨头戴比尔斯集团13日宣布，计划将位于南非林波波省的维尼蒂娅钻石矿暂停生产两年，以降低成本。戴比尔斯当天发表声明说，公司其他矿区将维持现有产量，总体产量指引不变。戴比尔斯集团首席执行官阿尔·库克在声明中表示，相关调整旨在增强公司经营韧性。此次停产是戴比尔斯削减成本、调整全球业务计划的一部分。</p>\n  <p>自2024年以来，戴比尔斯已将年度管理费用削减逾1亿美元，并出售或关闭部分非核心资产。维尼蒂娅钻石矿是南非最大产值钻石矿，约占南非钻石年产量的40%。该矿靠近博茨瓦纳和津巴布韦边境，已运营30多年。（新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>SK海力士加速Y1工厂建设，现已开始订购DRAM制造设备</strong></p>\n  <p>据报道，SK海力士已开始向主要合作伙伴订购Y1工厂所需的先进DRAM制造设备，初期投资规模对应月产2万片晶圆的生产能力。Y1是SK海力士在京畿道龙仁市处仁区远三面一带建设的大规模半导体集群中的第一座工厂。一期工厂由2个厂房骨架和6个洁净室组成。首座洁净室（ph1）的投产时间已从原计划的2026年5月提前至2026年2月。（财联社）</p>\n  <p><strong>英特尔斥资50亿欧元扩建爱尔兰工厂，押注AI驱动芯片需求</strong></p>\n  <p>英特尔周一宣布，已启动一项规模达50亿欧元（约合57亿美元）的资本投资计划，用以扩建其位于爱尔兰都柏林郊外莱克斯利普园区的制造基地。这笔资金将用于升级Fab 34工厂的现有设施、安装尖端生产设备，并扩建自动化晶圆传送系统，以扩大采用Intel 3制程工艺的至强6及下一代至强服务器处理器的产能，满足全球对AI和高性能计算日益增长的需求。（新浪财经）</p>\n  <p><strong>软银公司推出采用OpenAI技术的网络安全服务</strong></p>\n  <p>7月14日，软银公司与SB OAI Japan宣布全面推出采用OpenAI技术的网络安全服务“补丁即服务”，将推广范围扩大到3000家符合条件的日本公司。（界面新闻）</p>\n  <p><strong>脸书母公司计划在美建500亿美元超大型数据中心</strong></p>\n  <p>Meta于13日宣布，将大幅扩大其在美国路易斯安那州里奇兰县的“许珀里翁”（Hyperion）数据中心超级集群项目规模。该项目规划容量将提升至5吉瓦（GW），预计总投资额将超过500亿美元。分析人士指出，在人工智能（AI）投资热潮推动下，Meta及微软、谷歌、亚马逊等科技巨头正加速在全球范围内布局算力基础设施。（新浪财经）</p>\n  <p><strong>谷歌DeepMind负责人呼吁美国牵头成立人工智能标准监管机构</strong></p>\n  <p>谷歌人工智能业务负责人德米斯・哈萨比斯于周二提议，由美国牵头设立标准机构，针对各类新型前沿 AI 模型开展国家安全风险检测。哈萨比斯与其他科技巨头高管曾在七国集团（G7）领导人峰会期间，向包括美国总统特朗普在内的各国首脑提议组建美国主导的人工智能联盟。（新浪财经）</p>\n  <p><strong>软银孙正义：AI热潮将需要每年5万亿美元的投资</strong></p>\n  <p>软银集团创始人孙正义表示，到2040年，全球人工智能基础设施将需要每年5万亿美元的投资，以支持数据中心、电力供应和人形机器人的扩张，从而推动“以人类为中心”的工作模式向新模式的转变。他指出，随着人工智能发展为“人工超级智能”（ASI），由此产生的收入将证明这些巨额支出的合理性。“人工智能将彻底改变我们的生活——而且这种改变将带来利润，”孙正义说道。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技：发行价格为8.66元/股</strong></p>\n  <p>36氪获悉，长鑫科技公告，公司首次公开发行股票并在科创板上市，发行价格为8.66元/股。投资者请按此价格在2026年7月16日（T日）进行网上和网下申购，申购时无需缴付申购资金。其中，网下申购时间为9:30-15:00，网上申购时间为9:30-11:30，13:00-15:00。本次初始发行股份数量为668,808.8608万股，占发行后总股本约10.00%，并授予中金公司不超过初始发行股份15.00%的超额配售选择权。</p>\n  <p><strong>头部公募掀起南下“举牌潮”，港股创新药开启估值修复行情</strong></p>\n  <p>近日，港股创新药板块掀起一轮公募基金“举牌潮”。易方达、富国、汇添富等头部公募基金在一个月内增持多只港股创新药标的，并触及举牌线。与此同时，南向资金对迈威生物、科济药业等个股的持股数6月以来也出现大幅提升。机构认为，在AI主线进入休整、资金寻求高低切换的背景下，估值处于历史低位、BD出海持续放量且政策红利加速释放的创新药板块，正迎来多重逻辑共振的估值修复窗口。 （上证报）</p>\n  <p><strong>美股三大指数集体收涨，SK海力士涨超27%</strong></p>\n  <p>36氪获悉，7月14日收盘，美股三大指数集体上涨，道指涨0.02%，纳指涨0.9%，标普500指数涨0.38%。存储概念大涨，SK海力士涨超27%，闪迪涨超5%，美光科技、英伟达、英特尔涨超4%。IBM跌超25%，市值蒸发近700亿美元。热门中概股多数下跌，百度跌超3%，网易跌超2%，阿里巴巴、京东、拼多多、哔哩哔哩小幅下跌，小鹏集团涨超3%，理想���车涨超2%，蔚来涨超1%。</p>\n  <p><strong>特朗普：将用与海湾各国贸易投资协议取代霍尔木兹海峡货运费</strong></p>\n  <p>美国总统特朗普14日在社交媒体发文说，基于与中东领导人富有成效的对话，他决定用海湾各国将与美国达成的贸易和投资协议来取代美国提出的对通过霍尔木兹海峡运输货物收取20%的费用。（央视新闻）</p>\n  <p><strong>乐事回应薯片中被曝出现蓝色异物：希望取回产品作内部核查</strong></p>\n  <p>7月12日，有网友在社交平台上发帖称，在乐事薯片中发现了一块疑似“蓝色薯片”的异物。此事引发关注。7月13日晚，乐事相关负责人回应记者采访称，乐事品牌已关注到此事，其对此高度重视。客服已与消费者取得联系，希望可以取回产品作内部核查。</p>\n  <p>而根据当事消费者7月13日晚8点在社交平台更新的信息，乐事官方客服已经与她取得联系，客服就此次情况表达了歉意。同时，经过双方协商，消费者将在保留一半正常的薯片和一半“蓝色薯片”的基础上，将疑似出现问题的薯片寄回给乐事。目前，因尚未收到涉事薯片，乐事方面尚未确认异物性质和来源。（中国新闻周刊）</p>\n  <p><strong>*ST高科：部分实际控制人暨董事因涉嫌挪用资金被刑事立案</strong></p>\n  <p>36氪获悉，*ST高科公告，公司于近日收到公安局签发的关于公司实际控制人之一暨董事长曹龙先生及实际控制人之一暨董事贺怡帆女士个人的《立案告知书》，因涉嫌挪用资金，根据相关法律法规，公安局认为符合刑事立案标准，现已对该案立案侦查。</p>\n  <p><strong>韩国政府四部门将于周四召开会议，就单股杠杆ETF对股市冲击研究应对方案</strong></p>\n  <p>追踪韩国核心芯片股的杠杆产品近期暴跌，对韩国股市及金融市场带来了巨大的影响。业内汇编的数据显示，5月下旬上市的十几只追踪三星电子和SK海力士的杠杆交易型开放式指数基金（ETF），目前的价格已近乎腰斩。据报道，韩国政府四大经济部门高层协调机制将于周四召开会议，就单股杠杆ETF对股市的冲击研究应对方案，这是该议题首次正式进入该机制进行讨论。该机制是由韩国财政经济部、金融委员会、韩国银行及金融监督院四方共同参与的最高级别经济协调平台。（财联社）</p>\n  <p><strong>“世界茉莉花都”广西横州遭遇严重洪涝，茉莉花价格翻倍</strong></p>\n  <p>受台风“美莎克”带来的持续强降雨影响，“世界茉莉花都”广西横州遭遇严重洪涝，大片正值采收的茉莉花田浸泡在水中，产地鲜花收购价应声跳涨。当前，原料端的涨价暂未影响到原料库存充足的头部品牌，但对库存规模较小的中小茶饮商家而言，茉莉茶饮的利润空间已被急速压缩。（蓝鲸新闻）</p>\n  <p><strong>海关总署：中国出口连续11季度保持增长，贸易增量集中于AI领域</strong></p>\n  <p>7月14日，海关总署副署长王军在国新办新闻发布会上表示，截至目前，中国出口已经连续11个季度保持增长，出口增长根本原因在于中国制造与全球各类需求的精准适配。联合国报告显示，今年以来，全球货物贸易增长主要集中于人工智能相关领域。王军指出，全球算力数据中心及终端设备需求持续扩张，促进了中国相关产品出口；上半年中国电子元件、电脑零部件等产品出口均呈两位数增长，合计拉动出口增长6.9个百分点。（证券时报）</p>\n  <p><strong>AI服务器概念大跌，中国长城封跌停</strong></p>\n  <p>7月14日，AI服务器概念震荡下挫，中国长城封跌停，华丰科技、卓易信息跌超14%，华勤技术逼近跌停，紫光股份、神州数码、中科曙光、共进股份等跌幅靠前。（财联社）</p>\n  <p><strong>四大行辟谣并发布风险提示，“存100万享5.25%利息”为虚假广告</strong></p>\n  <p>近期不法分子冒用国有大行名义，在第三方平台及社交渠道发布“存100万享5.25%利息”等虚假高息广告，诱导消费者添加微信后推介境外保险、投资项目，牟取佣金甚至实施诈骗。对此，工、农、中、建四大行近日均已正式辟谣：无此类存款产品。</p>\n  <p>四家银行还提示，消费者应警惕远高于市场水平的收益承诺；认准银行网点、官网、官方APP等正规渠道，勿点不明链接、泄露身份证号、验证码等信息。（21世纪经济报道、金融时报）</p>\n  <p><strong>国际油价创6年来最大单日涨幅</strong></p>\n  <p>由于美伊冲突升级及美国宣布将恢复对伊朗的海上封锁，国际原油期货价格13日早盘显著上涨，收盘时涨幅超9%，创下2020年5月以来最大单日涨幅。在13日晚开始的新一个交易日开盘后，国际油价继续上涨超1%。13日收盘时，纽约商品交易所8月交货的轻质原油期货价格上涨6.73美元，收于每桶78.14美元，涨幅为9.42%；9月交货的伦敦布伦特原油期货价格上涨7.29美元，收于每桶83.30美元，涨幅为9.59%。（央视新闻）</p>\n  <p><strong>名创优品回应推广视频含偷窥剧情：向消费者诚恳道歉</strong></p>\n  <p>近日，短视频博主“阿磊日记”发布了一条为名创优品家纺记忆棉薄垫拍摄的带货短视频，该视频为突出产品质地轻薄的特点，刻意设计极具争议的猎奇剧情，视频中出现掀开地板缝隙便能窥视楼下女性卧室的情节，视频上线后大量网友表示观看后产生不适。</p>\n  <p>7月13日，名创优选科技（广州）有限公司发布��方致歉信。信中简短致歉，承认因品牌审核疏漏产出不良推广内容，向消费者诚恳道歉。同时公布四项处置办法：终止涉事博主全部合作、全网下架相关视频；升级内容审核标准；完善达人合作监管机制；对内部涉事岗位追责整顿。品牌表示将严格把控宣传内容，杜绝同类问题重演，再次向公众致歉。（扬子晚报）</p>\n  <p><strong>美国数据中心开发商加速抛售巨额股权资产</strong></p>\n  <p>美国数据中心开发商正借着人工智能行业热潮变现离场。多位知情人士透露，今年夏季，全美多家数据中心建设及运营企业正联合投行，计划出售公司价值数百亿美元的多数股权。投行正在接洽多家企业的股权转让事宜，包括Netrality数据中心、DataBank、Edged、EdgeCore数字基础设施等企业，其产业布局覆盖凤凰城至亚特兰大多地。当前算力需求持续旺盛，数据中心成为热门资产，投行正向私募股权机构大力推介这类标的。（新浪财经）</p>\n  <p><strong>已有基金公司递交主动ETF发行申请材料</strong></p>\n  <p>近期已有基金公司递交主动ETF发行申请材料。据了解，主动ETF，即主动管理交易型开放式基金，是指基金管理人自主选择投资策略、不以跟踪特定指数为投资目标，并在交易所上市交易的ETF。此前，证监会主席吴清在2026陆家嘴论坛上宣布，支持在沪深交易所推出主动ETF。同日，上交所发布《上海证券交易所主动管理交易型开放式证券投资基金业务指引》，深交所发布《深圳证券交易所证券投资基金业务指引第5号——主动管理交易型开放式基金》，均自发布之日起施行。（中证报）</p>\n  <p><strong>美联邦航空局结束“星舰”事故调查，准许13次试飞</strong></p>\n  <p>美国联邦航空局13日宣布，已结束对美国太空探索技术公司重型运载火箭“星舰”第12次试飞异常事故的调查，接受该公司提出的整改措施，准许其开展第13次试飞。太空探索技术公司当天宣布，计划最早于16日实施“星舰”第13次试飞。（新华社）</p>\n  <p><strong>多家车企上半年大幅预亏</strong></p>\n  <p>2026年上半年，汽车行业呈现显著分化、整体承压态势。赛力斯、广汽集团及江淮汽车等上市公司相继发布的上半年业绩预告表明，三家车企均出现亏损情况。从行业整体来看，乘联分会披露的数据显示，今年1-5月，汽车行业利润1440亿元，同比下降20%。同时，行业利润率降至3.4%，为五年来同期最低。乘联分会预计，7月后的市场将逐步改善，随着安全新规和税改预期逐步消化，叠加芯片供应紧张边际缓解、PPI大降、消费信心缓慢修复，零售端降幅有望在三、四季度逐步收窄。（财联社）</p>\n  <p><strong>美国会众议院通过永久实行夏令时法案</strong></p>\n  <p>当地时间7月14日，美国国会众议院投票通过永久实行夏令时的法案，并将法案提交参议院审议。今年5月，美国国会众议院能源和商业委员会以48比1的结果通过了《阳光保护法案》，该法案旨在永久取消美国每年两次调整时间的做法，让夏令时全年永久化。（央视新闻）</p>\n  <p><strong>美国光伏巨头Sunrun进军“卖算力”赛道，CEO声称用户每月能挣数百美元</strong></p>\n  <p>美国最大住宅光伏和储能设备供应商Sunrun正在推进所谓的“分布式AI数据中心”试点，公司首席执行官玛丽·鲍威尔周一表示，对于参加这项计划的用户而言，每个月有可能靠卖算力获得数百美元。据悉，Sunrun在美国有超过100万名已经部署屋顶光伏系统的用户。面对AI产业挥舞支票疯狂追求算力，光伏公司看到了“卖铲子”的机会。（财联社）</p>\n  <p><strong>从“低估”到“重估”，创新药迎投资布局窗口</strong></p>\n  <p>7月13日，在大盘整体承压下行的背景下，创新药板块逆势走强。万邦医药、陇神戎发双双录得20%涨停，上海凯宝上涨15.81%，亚虹医药上涨14.77%，新天地上涨10.84%；此外，哈药股份、九芝堂、立方制药等8家药企相继封板，市场做多情绪持续升温。上半年，创新药板块经历了一场从“被低估”到“被抢筹”的戏剧性反转。业内人士认为，这轮行情的底层逻辑远不止是资金从科技股高切低的短期博弈。政策红利的持续释放与产业基本面的深度质变，正共同构筑起创新药板块中长期向好的基石。（经济参考报）</p>\n  <p><strong>“木头姐”斥资逾2100万美元加仓SpaceX</strong></p>\n  <p>凯茜·伍德旗下的Ark Invest周一进行了多笔交易，其中最受市场关注的操作是加仓SpaceX。这家航天企业近期完成上市，市场对其估值的争议再起，持续受到资本关注。与此同时，Ark投资持续减持AMD，并调整旗下多只重仓创新赛道基金的持仓结构。（新浪财经）</p>\n  <p><strong>国际金价持续回调，后市关注美联储政策路径</strong></p>\n  <p>7月13日，国际金价持续下挫。截至13日18时30分，纽约黄金期货报4075.3美元/盎司，较上一交易日下跌1.35%；伦敦现货黄金报4064.8美元/盎司，盘中跌幅一度达1.87%。针对本轮金价调整，东方金诚研究发展部高级副总监瞿瑞表示，国际金价盘中跌破4100美元/盎司整数关口，主要受到地缘局势升级推升通胀预期、美国重要经济数据公布前市场避险情绪降温等因素影响。</p>\n  <p>展望后市，业内普遍认为，短期国际金价走势仍将围绕美国6月CPI数据及美联储货币政策预期展开，通胀数据表现将成为影响黄金价格运行方向的关键变量。与此同时，中东局势等地缘因素仍将扰动市场情绪，但其对黄金价格的影响正在减弱，市场关注重心正逐步回归美国经济基本面。（经济参考报）</p>\n  <p><strong>全球AI龙头股共振下跌，机构称后续关注三个信号</strong></p>\n  <p>近期，全球AI链股票共振下跌。海外市场中，日经225指数、韩国综合指数等均有明显回调，韩美半导体、三星电机、三井金属、SK海力士、三星电子、康宁、ARM等均有明显回撤。</p>\n  <p>7月13日，A股市场在AI链的带动下也出现调整，深证成指、创业板指均跌逾3%。银行、煤炭等板块逆势上涨，多数科技股下跌，整个A股市场超4600只股票下跌。市场成交额为2.83万亿元，较前一交易日缩量。</p>\n  <p>分析人士认为，近期，全球AI板块共振调整是由于高拥挤度下产业叙事扰动。短期科技股超跌后或有修复，但在拥挤度压力充分消化前，板块可能仍处于高波动状态，中报业绩将逐步成为市场关注的投资主线。后续重点看三个信号：韩股和美股半导体板块能否企稳，A股科技龙头能否有效承接以及成交额能否维持当前水平。（中证报）</p>\n  <p><strong>荣耀与阿里将开展AI智能体终端合作</strong></p>\n  <p>荣耀将于7月18日在2026世界人工智能大会举办“从数字屏幕到具身智能——物理世界新范式”分论坛。除之前已官宣的世界著名科技未来学家凯文·凯利外，阿里巴巴集团副总裁、ATH事业群Token Foundry多模态交互负责人许主洪的加入，也引发了业界对后续各方合作的猜想。记者从荣耀和阿里内部渠道获悉，双方将官宣重磅合作，联手方向极有可能是下一代终端操作系统&nbsp;Agentic OS&nbsp;的落地实践。据此前公开消息，本次论坛将聚焦AI的智能度和生命感，探讨从“工具”到“伙伴”的&nbsp;Agentic OS&nbsp;趋势演进。（财联社）</p>\n  <p><strong>印度要求国有银行增加外币存款</strong></p>\n  <p>印度政府要求国有银行加大力度，从3500万海外印裔群体中吸纳外币存款，以此扩充国家对外储备、提振持续走弱的卢比。一份声明显示，印度财政部长尼尔玛拉・西塔拉曼于周一召开会议，督促国有银行通过线下推广活动、线上数字渠道，同时推出创新存款产品，进一步加强与海外印度侨民的对接。知情人士透露，印度央行行长桑杰・马尔霍特拉定于周二会见私营银行与国有银行首席执行官，制定方案吸引海外存款流入，并解决阻碍资金吸纳的各类运营难题。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>五粮液：预计2026年半年度净利润同比增长88.80%-98.97%</strong></p>\n  <p>36氪获悉，五粮液公告，预计2026年半年度归属于上市公司股东的净利润为87.30亿元-92.00亿元，同比增长88.80%-98.97%。业绩变动主要系上年同期基数较低及销售旺季核心产品动销回暖所致。</p>\n  <p><strong>天原股份：上半年净利润同比预增981.39%—1282.34%</strong></p>\n  <p>36氪获悉，天原股份披露业绩预告，预计2026年半年度归属于上市公司股东的净利润1.8亿元—2.3亿元，同比增长981.39%—1282.34%。</p>\n  <p><strong>电投水电：上半年净利同比预增7673%左右</strong></p>\n  <p>36氪获悉，电投水电披露业绩预告，预计2026年半年度归属于母公司所有者的净利润11.9亿元左右，与上年同期（追溯调整前）相比，增加11.75亿元左右，同比增长7673%左右。</p>\n  <p><strong>北斗星通：上半年净利润同比预增2368.27%—3426.09%</strong></p>\n  <p>36氪获悉，北斗星通披露业绩预告，预计2026年半年度归属于上市公司股东的净利润3500万元—5000万元，同比增长2368.27%—3426.09%。</p>\n  <h2>投融资</h2>\n  <p><strong>“爱诗科技”完成29.8亿元C轮融资</strong></p>\n  <p>36氪获悉，“爱诗科技”14日宣布完成整体C轮融资，本轮累计融资29.8亿元人民币。其中，C+轮由阿里巴巴领投，Lollapalooza Capital（王慧文家办）、常春藤资本、惠远资本、钟鼎资本、韩国未来资产、OCBC生态下Lion X基金、蓝色光标、CloudAlpha、iGlobe Partners等十余家国内外机构参与投资。本轮融资将主要用于视频生成基础模型、实时世界模型、全球化产品增长和产业场景落地。</p>\n  <p><strong>逐际动力完成Pre-IPO轮融资</strong></p>\n  <p>36氪获悉，近日，通用人形机器人公司逐际动力LimX Dynamics宣布完成Pre-IPO轮融资，融资金额近2亿美元。公司过去半年累计完成融资4亿美元。逐际动力在本轮Pre-IPO轮融资汇集了来自全球的投资机构，包括IDG资本、蓝思科技、GGG Group与Redstone VC、华山资本、合肥滨湖产发集团等战略投资。此外，阿联酋磊石资本（Stone Venture）连续多轮追投；绿洲资本、基石资本、南山战新投、尚颀资本、蔚来资本等多家老股东超额加注。</p>\n  <p><strong>“新奇机器人”完成A+轮融资</strong></p>\n  <p>36氪获悉，近日，“新奇机器人”宣布完成A+轮融资。这是新奇机器人自2025年底启动首轮市场化融资以来，半年内完成的第三轮融资。本轮融资完成后，新奇机器人的投资人阵容涵盖经纬创投、沃赋创投、云晖资本、厚雪资本、Synstellation Capital等市场化投资机构，智元机器人、福然德等产业投资方，以及建发新兴投资、吴中金控、雉荟投资、宁波天使等国有背景资本。</p>\n  <h2>酷产品</h2>\n  <p><strong>高德发布通用世界模型工坊ABot-World Studio</strong></p>\n  <p>36氪获悉，近日，阿里巴巴集团旗下高德正式发布通用世界模型工坊ABot-World Studio，并同步开放测试。该工坊将交互式视频生成与3DGS场景生成统一在同一产品中——用户只需输入一段文字或一张图片，即可生成一个可实时交互、任意分享的AI世界，输出结果可保存为视频与3DGS文件。</p>\n  <p><strong>小米机器人首次实现汽车工厂柔性工件的长时作业</strong></p>\n  <p>36氪获悉，7月14日，小米披露旗下人形机器人在汽车工厂“实习”的最新进展。经过4个月的不断迭代，小米机器人在自攻螺母上件工站的双侧作业成功率从90.2%提升至98%，距离人工作业合格率仅差1个百分点。与此同时，还解锁了两项全新岗位——中控台侧盖板排序和料箱折叠回收，两项任务成功率均已达到90%。其中，小米此次展示的中控台侧盖板排序工站场景，首次在汽车工厂实现柔性工件的长时连续作业。</p>\n  <p><strong>整理</strong>｜王浩阳</p>", "category": "tech", "published_at": "2026-07-14T23:57:20+00:00", "fetched_at": "2026-07-15T01:59:55.830785+00:00", "fingerprint": "7b57dea270a4d9bf"}, {"source": "少数派", "title": "iOS / iPadOS 27 Public Beta 公测版来了：升降级指南 & 注意事项", "url": "https://sspai.com/post/112288", "summary": "7月14日凌晨，Apple终于推送了今年iOS27、iPadOS27、watchOS27、macOSGoldenGate、HomePod软件27以及AirPods固件新版的首个PublicBeta公开 ...<a href=\"https://sspai.com/post/112288\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-14T04:07:18+00:00", "fetched_at": "2026-07-15T01:59:54.553521+00:00", "fingerprint": "a33c6645388ae6a9"}, {"source": "少数派", "title": "具透 | iOS 27 首个公开测试版来了，这些是值得你关注的新功能", "url": "https://sspai.com/pos d AI研发核心负责人之一。他于2024年加入字节，负责多模态大模型的研发等，此后他管理的业务范畴不断扩大。去年，视觉生成业务已划入其负责范围，今年Seed Robotics团队也转向周畅汇报。这意味着，目前周畅的管理边界，覆盖多模态大模型、世界模型、视觉生成、具身智能等多个领域。</p>\n  <p>火山引擎是字节的云服务品牌，早在2020年火山引擎旗下就建立了汽车行业线，火山引擎总裁谭待还曾公开表示：“我们是所有云厂商中第一个把汽车做成一级线。”</p>\n  <p>今年以来，物理AI浪潮兴起，自动驾驶和具身智能被视为物理AI最先落地的两大场景。其中，自动驾驶是公认最早一批落地的具身智能场景。</p>\n  <p>因而当大厂都在追逐物理AI风口之际，自动驾驶，或将成为字节通往具身智能的一栈。</p>\n  <p>于自动驾驶行业而言，在世界模型成为自动驾驶界技术共识的今天，字节带着资源、人才、技术优势跨界，很有可能撼动行业既有格局。</p>\n  <h3><strong>世界模型成技术共识，字节迎来跨界契机</strong></h3>\n  <p>事实上，字节早就流露出过对汽车业务的渴望。</p>\n  <p>在布局自动驾驶之前，字节先已通过豆包大模型，切入了汽车座舱领域，意在重新定义座舱的交互体验。如今字节进一步布局辅助驾驶，可以使整车的智能化体验闭环。</p>\n  <p>36氪曾报道过，字节旗下火山引擎是对汽车座舱智能体投入最大的团队之一，赛力斯是目前与之合作最为深入的车企。火山引擎还向英伟达定制了Thor z芯片，将座舱模型以Al Box的“外挂”形式部署在车端。</p>\n  <p>赛力斯将新座舱交互的开发主导权交给了火山，并为其提供整车平台与落地能力，与上亿元的资金支持。</p>\n  <p>今年6月，赛力斯与火山引擎合作的汽车品牌AIVA正式发布，预计今年内，搭载“豆包座舱”的AIVA ME7也会上市。</p>\n  <p>但值得注意的是，AIVA品牌的辅助驾驶合作方，是元戎启行。有自动驾驶行业人士评价：“智能座舱和辅助驾驶不整合到一起，整车的智能化体验很难闭环。”</p>\n  <p>自动驾驶行业对世界模型的技术共识，恰又给了字节跨界的契机。</p>\n  <p>去年，行业还曾掀起过一场关于VLA和世界模型的技术路线之争。而今年，吉利、Momenta、小米、轻舟智行等越来越多企业，聚拢到了世界模型的大旗下，其中也包括部分曾经的VLA派。</p>\n  <p>比如小鹏。今年不仅发布了自研的X-World世界模型，还拆掉了VLA中的“L模块“，也就是语言模块，推出了 VLA 2.0。这意味着，小鹏不再将视觉内容转化为语言，再去推理，而是将视觉作为“智能的基石”。这样的模型架构已相当接近世界模型。</p>\n  <p>理想在今年GTC大会上发布的MindVLA O1，其内置的 3D ViT空间编码器与预测式隐世界模型，不仅强调对语言指令的理解，也强调对三维空间的结构化理解，以及对未来路况演变的预判，而后两者正是世界模型的要义。</p>\n  <p>因此，字节在启动世界模型的研发后，跨界至自动驾驶领域，自是顺理成章。</p>\n  <h3><strong>携资源、人才优势跨界，字节将对自动驾驶行业发起冲击</strong></h3>\n  <p>对字节而言，对自动驾驶的布局，或将其更快引渡到具身智能的彼岸。</p>\n  <p>今年，英伟达创始人黄仁勋、特斯拉CEO马斯克等人都预判，物理AI的Chat GPT时刻已经到来。自动驾驶和具身智能正是物理AI落地率先落地的两大场景。</p>\n  <p>它们的的能力栈高度通用，其中，自动驾驶的路况标准、硬件等都已趋向统一，产业链经过多年发展已相对成熟，所以行业普遍认为，做不好自动驾驶，便很难实现更通用的具身智能。因而自动驾驶之于字节，不啻于具身智能的练兵场。</p>\n  <p>自动驾驶对于字节具身智能另一重要的意义，或许在于数据。</p>\n  <p>缺乏来自物理世界的真实数据，是困扰许多具身智能企业的因素。而自动驾驶在数据采集上享有天然优势。</p>\n  <p>因此字节布局自动驾驶后，将更容易获取大量物理世界的数据，以迭代其世界模型，进而将模型能力复用至具身智能。</p>\n  <p>曾有公开信息显示，特斯拉拥有FSD数十亿英里真实道路数据，感知、世界建模、运动规划全部能迁移给Optimus机器人。</p>\n  <p>行业所强调的FSD对Optimus机器人的助力，正体现在“车辆数据管线”，让机器人跳过许多试错周期。</p>\n  <p>因此，字节对自动驾驶的布局，某种程度上流露出的，是它对具身智能的野心。</p>\n  <p>对于自动驾驶行业而言，字节跨界至自动驾驶，或将对自动驾驶行业格局发起不小的冲击。</p>\n  <p>自动驾驶技术转向AI范式，在某种程度上，改写了行业竞争的底层逻辑。基于AI范式的自动驾驶技术，正让各家的产品体验快速追齐。何况字节还有着人才优势和资源优势。</p>\n  <p>有自动驾驶行业人士对36氪表示，字节的优势在于，“目前它有足够的钱去烧，而且有足够多的人才”，“而且字节有足够多的卡，完全能负担得起他们后发先至”。</p>\n  <p>他解释：“字节现在做的通用世界模型，跟自动驾驶世界模型其实不完全一样，其中很多技术细节差距挺大。而且智驾专用世界模型，对交通物理的理解更深刻。</p>\n  <p>但字节有足够的算力资源，只要有办法能够拿到足够多的交通数据，重新训练一个智驾世界模型不成问题。</p>\n  <p>只要云端模型够强，字节所缺少的自动驾驶工程化能力，可以通过招人尽快补齐。”</p>\n  <p>自动驾驶行业经历近10年混战后，字节的入局或将给行业带来不小的变数。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260713/v2_5186d1a5cd5848a1850569e3228cf74c@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-07-13T08:34:05+00:00", "fetched_at": "2026-07-14T02:02:50.995549+00:00", "fingerprint": "4757073b1b490699"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜Meta宣布将追加400亿美元投资路易斯安那州数据中心；字节探索自动驾驶，Seed世界模型团队负责；《扩大消费“十五五”规划》：优化入境消费环境，稳步扩大免签国家范围", "url": "https://36kr.com/p/3893943402707460?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>洽洽食品：上半年净利润同比预增170.75%—198.96%</strong></p>\n  <p>36氪获悉，洽洽食品披露业绩预告，预计2026年上半年归属于上市公司股东的净利润为2.4亿元—2.65亿元，同比增长170.75%—198.96%。</p>\n  <p><strong>好上好：上半年净利润同比预增301.65%—376.03%</strong></p>\n  <p>36氪获悉，好上好披露业绩预告，预计2026年半年度归属于上市公司股东的净利润1.35亿元—1.6亿元，同比增长301.65%—376.03%。</p>\n  <p><strong>Meta宣布将追加400亿美元投资路易斯安那州数据中心</strong></p>\n  <p>7月13日，Meta宣布将追加400亿美元投资路易斯安那州数据中心，路易斯安那州数据中心是Meta的最大项目。（界面）</p>\n  <p><strong>北斗星通：上半年净利润同比预增2368.27%—3426.09%</strong></p>\n  <p>36氪获悉，北斗星通披露业绩预告，预计2026年半年度归属于上市公司股东的净利润3500万元—5000万元，同比增长2368.27%—3426.09%。</p>\n  <p><strong>字节探索自动驾驶，Seed世界模型团队负责</strong></p>\n  <p>36氪从多位产业人士处获悉，字节跳动正探索进入自动驾驶领域。这一项目目前由Seed旗下周畅的世界模型团队负责。据了解，Seed旗下不仅有周畅的多模态模型、世界模型等团队，还有大语言模型方向。而自动驾驶与世界模型的技术路线有交叠之处。另有消息人士告诉36氪，业务方向上，字节有意布局的自动驾驶场景有无人物流，这一业务隶属于字节旗下的火山引擎汽车行业线。部分接近字节的知情人士表示，字节团队此前与一些头部自动驾驶团队进行过业务探讨交流，目前字节的自动驾驶项目已进入早期筹备状态。字节向不少头部辅助驾驶或自动驾驶人才发出了邀约，一些看好字节这一布局的技术人才也计划加入。针对以上消息，36氪向字节求证，字节回应：“字节大模型前沿探索领域，包括物理AI领域，有很多早期研究和探索，但并没有做智能驾驶业务的计划。”</p>\n  <p><strong>西部黄金：上半年净利润同比预增214.87%—258.95%</strong></p>\n  <p>36氪获悉，西部黄金披露业绩预告，预计2026年上半年实现归属于母公司所有者的净利润5亿元到5.7亿元，同比增加214.87%到258.95%。</p>\n  <h2>投融资：</h2>\n  <p><strong>“领铄智能”完成A轮融资</strong></p>\n  <p>36氪获悉，“领铄智能”宣布已完成A轮融资，由中信建投���本与西安财金共同参与。此前，公司已获讯飞创投与泰中合投资的Pre-A轮融资。据了解，领铄智能是一家聚焦智能化平台关键技术研发与产业化应用的AI公司，核心产品包括Blade Agentic OS智能体操作系统、Blade Agent Box智能体一体机和Blade Agentic OS Edge边缘智能体板卡。</p>\n  <p><strong>山金国际：上半年净利润同比预增47.27%—55.41%</strong></p>\n  <p>36氪获悉，山金国际披露业绩预告，预计2026年半年度归属于上市公司股东的净利润为23.5亿元—24.8亿元，同比增长47.27%—55.41%。</p>\n  <p><strong>“海艺AI”完成超亿元B轮融资</strong></p>\n  <p>36氪获悉，全球AI全模态内容互动娱乐平台海艺（SeaArt）近日宣布完成超亿元人民币B轮融资，由视觉中国、华盖创赢、祥峰投资（Vertex China）联合领投，广发信德、天投资本、川创投、广州合伟永晟共同投资。本轮资金将用于多模态底层研发、全球市场拓展及AI垂类应用孵化。</p>\n  <p><strong>“莫界科技”完成6亿元A轮及A+轮整合融资</strong></p>\n  <p>36氪获悉，“莫界科技”宣布完成A轮及A+轮整合融资，本轮融资规模达6亿元。投资方包括联想创投、毅达资本、德同资本、招银国际、长石资本等创投机构，以及芜湖、珠海等国资产业平台。作为AI+AR眼镜核心光学技术提供商，莫界已完成“9代单色+4代彩色”共13代轻量化AI+AR眼镜整机迭代。</p>\n  <p>新产品：</p>\n  <p><strong>首款智能体手机呼之欲出，大规模商用需迈几道坎</strong></p>\n  <p>全球首款AI智能体手机即将在2026世界人工智能大会上展出，该消息令智能体手机再度成为舆论关注焦点。接受采访的专家表示，智能体手机短期内仍将属于“高级辅助执行”阶段，无法完全跳过人机确认实现全流程自动执行，长期而言，智能体手机要实现大规模商用，仍需迈过技术验证、隐私安全、与互联网企业之间的利益分配等多道坎。（证券时报）</p>\n  <h2>今日观点：</h2>\n  <p><strong>半导体硅片赛道迎量价齐升红利窗口，公募前瞻布局分享产业红利</strong></p>\n  <p>随着全球硅片厂商接连开启涨价周期、AI算力拉动行业需求重构，半导体硅片赛道迎来量价齐升红利窗口。受涨价行情驱动，截至2026年7月12日，半导体硅片指数年内涨幅逼近翻倍，板块个股轮番走出翻倍行情。以国泰基金、华夏基金、易方达基金、富国基金为代表的一众头部公募早已提前押注布局。旗下产品今年一季度分别配置了立昂微、有研硅、神工股份等核心标的，凭借精准前瞻产业趋势锁定本轮行情红利，基金业绩表现亮眼。（证券时报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>《扩大消费“十五五”规划》：优化入境消费环境，稳步扩大免签国家范围</strong></p>\n  <p>36氪获悉，国务院批复同意《扩大消费“十五五”规划》。《规划》提出，扩大入境消费。优化入境消费环境，打造“购在中国”品牌。稳步扩大免签国家范围，持续优化过境免签政策。进一步增开国际航线，重点增加欧美、共建“一带一路”国家等国际直航航班数量。提升公共场所国际化服务水平，优化入境消费支付环境，推动入境游客办理快速通关、住宿登记、交通出行、电信业务、景点预约等事务便利化。优化离境退税便利化举措，增加离境退税商店，积极推广“即买即退”服务。鼓励更多国产品进入口岸出境免税店和市内免税店销售。打造具有高标识度和吸引力的消费品牌、文化地标、体验活动。培育面向国际的教育、医疗、会展等市场。</p>\n  <p><strong>民政部等14部门联合发文，推动我国康复辅具产业扩能提质</strong></p>\n  <p>今天，民政部等14部门联合公布《康复辅助器具产业扩能提质三年行动方案（2026—2028年）》。这是继2016年国务院印发《关于加快发展康复辅助器具产业的若干意见》（国发〔2016〕60号）后，国家层面再次系统推动康复辅具产业高质量发展的重要文件。《方案》提出“应用示范引领、产业优化升级、创新能力提升、政策效能提升、市场环境优化、人才队伍赋能”六大行动。在应用端，推进“康复辅具+”多场景融合，打造“中心+站点”城乡服务网络，推广共享租赁等；在产业端，聚焦京津冀、长三角、粤港澳等集聚区培育龙头企业与专精特新企业，推进智能制造与绿色工厂建设；在创新端，以医工结合为导向，攻坚脑机接口、康养机器人、仿生假肢等前沿技术，搭建国家级科研创新平台，打通成果转化通道。（央视新闻）</p>", "category": "tech", "published_at": "2026-07-13T11:59:05+00:00", "fetched_at": "2026-07-14T02:02:50.995542+00:00", "fingerprint": "872021e4fe0552f7"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨海南将成中国首个禁售燃油车省份；长鑫科技部分员工入股成本低至1毛；SK海力士暴跌15%", "url": "https://36kr.com/p/3894729787767810?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>韩国法院禁止两名前三星员工就职于SK海力士</li>\n   <li>字节探索自动驾驶，Seed世界模型团队负责</li>\n   <li>巨力索具深夜澄清商业航天业务不实传闻，提醒投资风险</li>\n   <li>科技记者古尔曼：苹果将跳过M6 Pro/Max芯片全力押注AI导向的M7系列</li>\n   <li>美众议院本周将表决永久实行夏令时法案</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>海南将成中国首个禁售燃油车省份，届时车桩比保持2.5:1以下</strong></p>\n  <p>近日，海南省人民政府对外发布《“十五五”海南国家生态文明试验区规划（美丽海南建设“十五五”规划）》提出，平稳推进2030年禁售燃油车，预计届时海南新能源汽车保有量占比从2025年的23.75%提升至45%。这意味着海南将成为中国第一个不再卖燃油车的省份。</p>\n  <p>“十四五”时期，海南清洁能源岛建设深化升级，新能源成为海南第一大电源，新能源汽车市场渗透率、保有量占比分别居全国省级地区第一、第二位。在交通运输领域，到2030年，海南全省公共服务和社会运营领域新增和更换车辆（特殊用途除外）清洁能源占比、私人用车领域新增和更换车辆新能源占比达到100%，车桩比保持2.5:1以下。（中国新闻网）</p>\n  <p><strong>长鑫科技披露员工持股方案：部分员工入股成本低至1毛</strong></p>\n  <p>国内存储芯片龙头长鑫科技冲刺科创板IPO，招股书披露公司分两批落地员工持股方案，累计授予股份覆盖6760人次，数千名技术、生产与管理核心员工共享企业成长红利。整套激励计划分两期稳步推进，首期自2021年9月启动，历经九轮授予，惠及3596名员工，对应每股注册资本作价1.05元；二期2023年6月落地，完成七轮股份授予，覆盖3164人次，入股成本低至0.108元。</p>\n  <p>激励范围不局限管理层，研发骨干、产线关键技术工人、业务核心人员均纳入其中，重点倾斜芯片研发团队。截至2025年末，公司员工近两万名，研发人员比超三成，硕士及以上高学历人才规模突出，股权激励成为留住高端芯片人才的重要抓手。</p>\n  <p>本次员工持股采用长期绑定机制，设置多层锁定期，引导员工与企业长期同步发展。除此之外，公司董事长朱一明作出重磅让利承诺，自愿拿出自身持有的7.68亿股用于全员激励，计划分十年向全体在职员工分批发放，对应股份市场价值有望突破200亿元，创下A股个人出让股权激励员工的规模纪录。（经济观察网）</p>\n  <p><strong>SK海力士暴跌15%，韩国券商称Q2盈利或“不及预期”&nbsp;</strong></p>\n  <p>7月13日，韩国存储芯片巨头SK海力士股价大跌逾15%，拖累韩国股市再次跌至熔断，并带崩了亚洲存储类股票。韩国本土券商韩国投资证券（KIS）近日发布的一份报告被视为SK海力士股价大跌的导火索。</p>\n  <p>KIS在最新报告中预测，SK海力士今年第二季度的营业利润将略低于市场预期。不过，该行表示，这仅仅是将高带宽内存（HBM）长期供应协议（LTAs）纳入考量后，对盈利预测进行的正常化调整，并不意味着行业增速放缓。</p>\n  <p>受SK海力士领跌的芯片股抛售潮影响，市场对人工智能（AI）驱动的涨势能否持续的担忧加剧。盘中韩国综合股价指数（KOSPI）下跌8%后，韩国交易所触发熔断机制，交易暂停20分钟，为今年第七次触发熔断机制。（财联社、新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Meta宣布将追加400亿美元投资路易斯安那州数据中心</strong></p>\n  <p>7月13日，Meta宣布将追加400亿美元投资路易斯安那州数据中心，路易斯安那州数据中心是Meta的最大项目。（界面新闻）</p>\n  <p><strong>字节探索自动驾驶，Seed世界模型团队负责</strong></p>\n  <p>36氪从多位产业人士处获悉，字节跳动正探索进入自动驾驶领域。这一项目目前由Seed旗下周畅的世界模型团队负责。据了解，Seed旗下不仅有周畅的多模态模型、世界模型等团队，还有大语言模型方向。而自动驾驶与世界模型的技术路线有交叠之处。另有消息人士告诉36氪，业务方向上，字节有意布局的自动驾驶场景有无人物流，这一业务隶属于字节旗下的火山引擎汽车行业线。</p>\n  <p>部分接近字节的知情人士表示，字节团队此前与一些头部自动驾驶团队进行过业务探讨交流，目前字节的自动驾驶项目已进入早期筹备状态。字节向不少头部辅助驾驶或自动驾驶人才发出了邀约，一些看好字节这一布局的技术人才也计划加入。针对以上消息，36氪向字节求证，字节回应：“字节大模型前沿探索领域，包括物理AI领域，有很多早期研究和探索，但并没有做智能驾驶业务的计划。”</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>巨力索具深夜澄清商业航天业务不实传闻，提醒投资风险</strong></p>\n  <p>7月12日，巨力索具公告称，近期互联网平台等出现关于公司商业航天业务的不实传闻，如“国内唯一网系回收索具供应商”“与航天科技集团签超20亿元订单”等。公司澄清从未就相关问题接受访问或发表观点，并非“网系回收”及“航天级特种索具”唯一供应商。公告称，2026年初至公告披露日，公司商业航天收入不足0.30%，对公司经营业绩影响微乎其微。公司提醒投资者注意投资风险，以指定媒体信息为准。（红星新闻）</p>\n  <p><strong>国际原油结算价大涨超9%，收于每桶83.30美元</strong></p>\n  <p>截至13日当天收盘，纽约商品交易所8月交货的轻质原油期货价格上涨6.73美元，收于每桶78.14美元，涨幅为9.42%；9月交货的伦敦布伦特原油期货价格上涨7.29美元，收于每桶83.30美元，涨幅为9.59%。(金十数据APP)</p>\n  <p><strong>美股三大指数集体收跌，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，7月13日收盘，美股三大指数集体下跌，道指跌0.26%，纳指跌1.55%，标普500指数跌0.79%。大型科技股多数下跌，Arm跌超7%，英特尔跌超6%，SpaceX跌超4%，英伟达、特斯拉跌超3%，Meta、谷歌跌超1%；微软涨超1%，亚马逊、苹果、奈飞小幅上涨。热门中概股涨跌不一，叮咚买菜、蔚来涨超3%，网易、京东涨超2%，理想汽车、阿里巴巴小幅上涨；百度、名创优品跌超3%，哔哩哔哩、小鹏集团、老虎证券小幅下跌。</p>\n  <p><strong>韩国法院禁止两名前三星员工就职于SK海力士</strong></p>\n  <p>据报道，韩国一家法院支持了三星电子提出的部分诉求，禁止两名前NAND闪存设计员工就职于SK海力士。水原地方法院裁定，这两名前三星员工在2027年4月30日之前不得为SK海力士及其关联公司工作。三星电子原本要求执行两年期的竞业禁止协议，但法院将限制期限缩短至18个月。法院表示，涉案NAND闪存设计技术属于国家核心技术，这两名员工先前在三星存储部门工作约10-11年，2月份跳槽到SK海力士。（界面新闻）</p>\n  <p><strong>胜宏科技：网络流传相关言论不属实，公司生产、出货一切正常</strong></p>\n  <p>36氪获悉，胜宏科技公告，近期，公司关注到网络平台上流传关于公司产品、市场份额、项目进展等负面传闻，内容严重失实，给公司带来较大的负面影响。</p>\n  <p>经核实，公司针对网络平台流传事项澄清及声明如下：1.网络流传相关言论不属实。公司是国内外AI头部大客户的长期战略合作伙伴，胜宏科技始终将“品质”和“安全”视为企业的生命线，公司严格按照客户标准管理。2.当前，AI相关PCB产品需求旺盛，公司在手订单持续增长。公司生产、出货一切正常，头部客户订单持续增加。3.公司与核心客户保持密切沟通，与客户合作开发的研发迭代产品正顺利推进当中。部分客户已释放2027年—2028年长期需求，公司对后续生产经营及效益实现充满信心。</p>\n  <p><strong>孙东旭、明明、天权在北京成立新科技公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，美丽明天（北京）科技有限公司成立，法定代表人为孙东旭，注册资本1000万人民币，经营范围包括技术服务、技术开发、技术咨询、技术交流、技术转让、技术推广，鲜肉批发，水产品批发等。股东信息显示，该公司由孙东旭、石明、郭天权共同持股，其中孙东旭持股34%，石明、郭天权各持股33%。</p>\n  <p><strong>SpaceX星舰周四进行第13次试飞，20颗V3卫星将首次部署</strong></p>\n  <p>SpaceX预告星舰将进行第13次试飞，最早于周四18:45发射，窗口90分钟。本次试飞主要目标为验证级间分离、发动机性能及可控再入能力，并首次部署20颗配备先进激光链路的新一代星链V3卫星。马斯克此前还称，本次试飞将为第14次试飞实现海上回收火箭积累关键数据。（财联社）</p>\n  <p><strong>商业航天迎规模商用拐点，基金经理看好赛道长期配置价值</strong></p>\n  <p>7月10日12时15分，长征十号乙运载火箭在海南商业航天发射场首飞升空，成功将卫星送入预定轨道；一、二级分离约6分钟后一子级垂直返回，并在海上“领航者”号回收平台通过网系捕获方式成功回收，实现了中国首次运载火箭一子级可控回收，同时也是全球首次运载火箭海上网系回收。受这一重大突破利好刺激，7月10日午后，A股商业航天板块集体拉升。多位基金经理表示，可回收技术落地有望推动单位发射成本下降40%以上，卫星互联网组网的发射瓶颈迎来实质性缓解，商业航天正迎来由“技术验证”迈向“规模商用”的关键拐点，赛道具备长期配置价值。（证券时报）</p>\n  <p><strong>三星电子拟出售3230亿韩元自有股份</strong></p>\n  <p>三星电子拟出售3230亿韩元自有股份。（财联社）</p>\n  <p><strong>三菱日联市值超越丰田，跃居日本第一</strong></p>\n  <p>三菱日联金融集团（MUFG）7月13日在东京证券市场交易中，市值一度达到42万亿日元，首次跃居日本上市企业市值榜首。当日，三菱日联金融集团的市值达到42.1万亿日元，超过了丰田汽车以及半导体存储器企业铠侠控股。（界面新闻）</p>\n  <p><strong>美众议院本周将表决永久实行夏令时法案</strong></p>\n  <p>根据美国方面消息，美国国会众议院将在本周就一项永久实行夏令时的法案进行表决。不过关于这一议题，美国国内仍然存在较大争议。今年5月，美国国会众议院能源和商业委员会以48比1的结果通过了《阳光保护法案》，该法案旨在永久取消美国每年两次调整时间的做法，让夏令时全年永久化。而美国国会参议院一些议员则威胁说，即使法案在众议院投票中通过，他们也将在参议院否决这一法案。（央视新闻）</p>\n  <p><strong>万事达卡考虑出售英国支付子公司Vocalink股权</strong></p>\n  <p>媒体援引两名知情匿名人士消息报道，万事达卡正考虑出售旗下支付机构Vocalink的多数股权。万事达卡内部相关洽谈尚处于初步阶段，目前尚未收到任何确定收购报价。若出售51%控股权，这笔交易估值约4亿英镑。万事达卡方面拒绝对此事置评。（新浪财经）</p>\n  <p><strong>澳大利亚将全面推广电子入境卡</strong></p>\n  <p>澳大利亚政府13日宣布，将全面推广电子入境卡，取代纸质入境旅客申报卡，以提升旅客通关效率。澳大利亚政府发表声明称，将在未来4年投入5610万澳元，用于推进全国机场旅客通关现代化建设。电子入境卡系统将在未来12至18个月内分阶段推广至所有国际机场和海港。全面推广电子入境卡将简化国际旅客通关流程，减少人工操作，实现旅客信息提前数字化采集，提高风险评估数据质量，从而更有效应对生物安全等潜在风险。（中新网）</p>\n  <p><strong>赛力斯回应由盈转亏，存储等材料价格上涨成主因&nbsp;</strong></p>\n  <p>赛力斯集团近日发布公告称，经财务部门初步测算，预计2026年半年度实现归属于上市公司股东的净利润为-18亿元到-15亿元，与上年同期相比，将出现亏损。赛力斯集团在公告中解释称，业绩变动主要受存储芯片、工业金属、碳酸锂等主要原材料价格上涨等因素的影响，公司生产成本随之增加；基于审慎性原则并进一步夯实整体资产质量，结合资产后续收益预期，对部分因技术迭代、车型换代导致适配性有限的存量资产调整账面价值。受上述因素影响，公司核心子公司问界汽车业绩出现波动，由盈转亏。</p>\n  <p>业绩暴雷之下，赛力斯集团13日A股股价开盘后迅速下挫，股价跌停至53.91元，目前市值919.37亿元，已经跌破千亿大关。（新浪科技）</p>\n  <p><strong>英伟达季度收入近1000亿美元，Rubin Ultra架构未延期</strong></p>\n  <p>英伟达首席执行官黄仁勋近期现身摩根士丹利在美国加州举办的一场非交易路演，与首席财务官科莱特 · 克雷斯等高管一起，向机构投资者释放了一个明确信号：尽管公司季度营收即将逼近1000亿美元，但增长速度不仅没有见顶，反而仍在持续加快。摩根士丹利认为，英伟达当前最大的挑战已经不是“AI是否还有需求”，而是在内存、网络、供电以及数据中心空间等多项物理资源受限的情况下，如何把庞大的订单积压尽快转化为实际交付和收入。（IT之家）</p>\n  <p><strong>市场担心1.6T需求延迟，中际旭创回应</strong></p>\n  <p>关于“市场担心1.6T的需求延迟，目前公司看到的需求情况如何”等问题，中际旭创7月12日称，2027年整体行业的1.6T需求依然保持强劲，与此前预期的数量区间相比没有变化，客户数量也有所增加。2027年800G行业需求增长较此前预期更为显著。从整体客户需求来看，没有看到需求下降的情况。1.6T明年的需求数量与此前预期基本一致，主要变化体现在结构上。部分客户需求确实有所下调，但同时也有新增云厂商及AI大模型客户上调了1.6T需求。整体来看，1.6T需求并未下滑，仅呈现结构性调整。（证券时报）</p>\n  <p><strong>中东战事推高能源成本，欧盟拟加速电气化转型减少油气依赖</strong></p>\n  <p>今年以来，美以对伊朗发动战争致使高度依赖能源进口的欧洲地区油气价格暴涨。一份欧盟委员会提案草案显示，欧盟正计划推出一系列政策和融资方案，以推动欧盟减少对石油和天然气的依赖，加速欧盟经济的电气化转型。据悉，这一草案将于7月17日由欧盟委员会正式公布。根据草案，欧盟计划设定一个目标，到2040年，欧盟整体经济的能源消耗中至少要有一定比例来自电力。该草案目前仍在制定中，并未说明具体比例。加快电气化转型意味着欧盟将推动从汽油和柴油汽车过渡到电动汽车，让家庭使用电力驱动的热泵取代燃气锅炉，以及实现工业流程的电气化——例如，用电力驱动的熔炉取代化石燃料熔炉。（央视新闻）</p>\n  <p><strong>印尼明年起强制推行汽油掺混乙醇政策</strong></p>\n  <p>印度尼西亚政府计划自明年起强制在汽油中掺混乙醇，并将逐步提高掺混比例。能源与矿产资源部长巴赫利尔·拉哈达利亚表示，该政策将参照生物柴油（B50）的分阶段实施路径推进。（财联社）</p>\n  <h2>大公司财报</h2>\n  <p><strong>台积电：6月营收同比增长67.9％环比增长6.2%</strong></p>\n  <p>36氪获悉，台积电6月营收为4,426.8亿新台币，同比增长67.9％，环比增长6.2%。2026年1至6月份的总收入为24044.8亿新台币，同比增长35.6%。</p>\n  <p><strong>中国船舶：上半年净利同比预增212.29%—273.39%</strong></p>\n  <p>36氪获悉，中国船舶披露业绩预告，预计2026年上半年归属于母公司所有者的净利润92亿元至110亿元，同比增加212.29%至273.39%。</p>\n  <p><strong>一汽解放：上半年净利润同比预增1273.64%—1528.02%</strong></p>\n  <p>36氪获悉，一汽解放披露业绩预告，预计2026年半年度归属于上市公司股东的净利润为2.7亿元—3.2亿元，同比增长1273.64%—1528.02%。</p>\n  <p><strong>西部黄金：上半年净利润同比预增214.87%—258.95%</strong></p>\n  <p>36氪获悉，西部黄金披露业绩预告，预计2026年上半年实现归属于母公司所有者的净利润5亿元到5.7亿元，同比增加214.87%到258.95%。</p>\n  <h2>投融资</h2>\n  <p><strong>“药物牧场”完成5500万美元D轮融资首轮融资</strong></p>\n  <p>36氪获悉，“药物牧场”（Drug Farm）13日宣布完成5500万美元D轮融资首轮融资。本轮融资由上海浦东引领区投资中心与上海浦兴协同私募基金合伙企业共同领投，致凯资本福州新合基金、深圳市罗湖东海睿智医药产业投资合伙企业、科源制药跟投，现有投资方百奥维达中国基金、YD Capital、嘉善国投、德同资本、苇渡资本及Biometas继续跟投。浩悦资本担任此次交易的独家财务顾问。融资所得款项将用于持续推进公司临床及临床前阶段的研发管线，加速全球临床开发项目，加强在主要市场的注册监管工作，并进一步扩展公司的研发能力。</p>\n  <p><strong>“海艺AI”完成超亿元B轮融资</strong></p>\n  <p>36氪获悉，全球AI全模态内容互动娱乐平台海艺（SeaArt）近日宣布完成超亿元人民币B轮融资，由视觉中国、华盖创赢、祥峰投资（Vertex China）联合领投，广发信德、天投资本、川创投、广州合伟永晟共同投资。本轮资金将用于多模态底层研发、全球市场拓展及AI垂类应用孵化。</p>\n  <p><strong>“莫界科技”完成6亿元A轮及A+轮整合融资</strong></p>\n  <p>36氪获悉，“莫界科技”宣布完成A轮及A+轮整合融资，本轮融资规模达6亿元。投资方包括联想创投、毅达资本、德同资本、招银国际、长石资本等创投机构，以及芜湖、珠海等国资产业平台。作为AI+AR眼镜核心光学技术提供商，莫界已完成“9代单色+4代彩色”共13代轻量化AI+AR眼镜整机迭代。</p>\n  <h2>酷产品</h2>\n  <p><strong>全球首款，南开团队成功研获人造听觉神经</strong></p>\n  <p>36氪获悉，据南开大学消息，近日，南开大学电子信息与光学工程学院徐文涛教授团队成功研制出全球首款仿生听觉神经接口，为传统人工耳蜗之外的听觉重建提供了全新的电子替代、修复技术新路径。</p>\n  <p><strong>科技记者古尔曼：苹果将跳过M6 Pro/Max芯片全力押注AI导向的M7系列</strong></p>\n  <p>科技记者马克・古尔曼透露，苹果将推出标准版M6芯片，但不会推出定位更高端的M6 Pro和M6 Max芯片。他表示，这一打破以往产品节奏的决定，原因在于AI。苹果原本计划为M7系列带来神经网络处理能力的大幅升级，最终认为这些改进足够重要，因此决定加快下一代产品的推出，而不是完成整个M6产品线。（财联社）</p>\n  <p><strong>整理</strong>｜王浩阳</p>", "category": "tech", "published_at": "2026-07-14T00:04:11+00:00", "fetched_at": "2026-07-14T02:02:50.995535+00:00", "fingerprint": "9d1fdb60e59b2a18"}, {"source": "36氪 - 最新文章", "title": "人形机器人公司逐际动力完成2亿美元Pre-IPO轮融资，投后估值达150亿元｜最前线", "url": "https://36kr.com/p/3893976502287618?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，通用人形机器人公司逐际动力LimX Dynamics宣布完成Pre-IPO轮融资，融资金额近2亿美元，投资方包括IDG资本、蓝思科技、GGG Group与Redstone VC、华山资本、合肥滨湖产发集团等。此外，阿联酋磊石资本（Stone Venture）连续多轮追投，绿洲资本、基石资本、南山战新投、尚颀资本、蔚来资本等多家老股东超额加注。</p>\n  <p>融资资金将重点用于大小脑融合技术的突破和产品化，推动数千台全自主人形机器人的规模化部署，加强全球市场拓展。公司将进一步完善全球制造与交付能力，加快中东、欧洲及亚洲其他国家地区等重点市场的布局，并持续建设面向全球开发者的开放生态。</p>\n  <p>本轮融资完成后，公司投后估值达150亿元，过去半年累计融资额已达4亿美元。此前逐际动力于2026年3月完成了股改。据知情人士处透露，公司已在2026年初稍早些时候开启IPO进程。</p>\n  <p>近年来，随着具身智能进入规模化发展的关键阶段，逐际动力基于<strong>全栈技术路线</strong>，围绕<strong>机器人本体、AI基础设施及具身智能体OS系统持续投入研发</strong>，构建了覆盖运动生成、模型训练、认知决策到真实世界部署的完整技术体系。</p>\n  <p>目前，公司已经形成覆盖System 0全身运动基础模型、System 1人形机器人VLA/WAM能力、System 2以大语言模型和世界模型为引擎的具身智能体操作系统（COSA）的三层技术架构。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260713/v2_2649644d8620477e80f7edd7b65ffb30@6022551_oswg128546oswg832oswg468_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">逐际动力三层技术架构（图源/企业）</p>\n  <p>作为逐际动力System 1的重要组成部分，FluxVLA Engine定位企业级开源平台，为全球开发者提供了一套完整覆盖具数据处理、仿真训练、真机迭代到硬件部署的全流程基建。</p>\n  <p>长期以来，行业内多数研发团队在训练具身模型时，往往需要耗费大量人力重复搭建底层工程管线。FluxVLA Engine通过标准化、模块化的工具链将这些环节一体化打通，让开发者得以将精力集中在VLA、世界动作模型等算法创新上，而非消耗在底层工程的重建中。</p>\n  <p>在逐际动力的构想中，具身智能的未来不是由一个统一的超级模型通吃所有场景，而是有大量垂直的、中小的模型应用服务于不同任务。而FluxVLA Engine要做的，是推动行业从“少数团队掌握模型训练能力”走向普惠化、低门槛的具身智能研发生态。</p>\n  <p>依托上述技术体系，逐际动力正加快产品研发和商业化落地。目前各机器人产品上线以来，共计获得数千台订单，其中过半来自海外。公司正与全球开发者及生态伙伴共同推动科研教育、商业服务、全地形巡检、工业应用、建筑及更多应用场景的商业落地。</p>\n  <p>今年5月，逐际动力正式发布全尺寸交互人形机器人LimX Luna。Luna采用160cm全尺寸拟人比例设计，机身配备27个自由度，搭载自研System 0全身运控基础模型，可精准调度全身自由度协同运作。</p>\n  <p>依托升级后的运控系统与电机性能，Luna不仅能够稳定完成多种高难度动作，也能演绎模特猫步，驾驭多种风格的舞蹈。产品发布后不到一个月，即完成国内及海外客户的批量交付，验证了从发布到量产交付的快速转化能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260713/v2_aa3272b49ecd45f7b63e5996a4e25ce7@6022551_oswg233415oswg830oswg468_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">逐际动力全尺寸交互人形机器人Luna在5月正式发布（图源/企业）</p>\n  <p>同期推出的新一代多形态具身机器人TRON 2，则面向科研、工业、巡检等开发者群体。其核心在于原创的“全身模块化架构”，即一个本体、多种形态自由组合；通过模块化拼接可在双臂、双足、双轮足等形态间灵活切换，适应从精细操作到复杂地形移动的不同需求。TRON 2依托完备的开发接口与配套训练工具，向开发者开放二次开发能力，自发布起也已收获海内外批量订单。</p>\n  <p>未来，逐际动力将继续加强大小脑融合技术的优势<strong>，</strong>推进机器人量产体系建设和全球化布局，持续完善全球供应链及交付能力，加快具身智能技术创新和产业化进程。</p>", "category": "tech", "published_at": "2026-07-14T00:46:41+00:00", "fetched_at": "2026-07-14T02:02:50.995526+00:00", "fingerprint": "5713485d64189ab7"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前博世自动驾驶算法工程师创业，用合成数据做触觉大模型", "url": "https://36kr.com/p/3894821059918855?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_0043edee5a544714b27ddfd07deb51b6@6221844_oswg188445oswg800oswg576_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">触觉手套（图源/企业）</p>\n  <blockquote>\n   <p>本文约<strong>2400</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，空间智能公司「大衍科技」近期完成数千万元天使轮融资，由松禾资本领投，浙江省省金控与广州番禺创新基金等国资背景机构参与。资金将主要用于触觉大模型研发、机器人数据产线建设及团队扩张。</p>\n  <p>「大衍科技」2025年5月成立于浙江桐乡，是一家专注于4D世界重建、世界模型及可控扩散模型技术的空间智能公司。</p>\n  <p>创始人兼CEO杨林是新加坡国立大学计算机博士，曾在速腾、酷睿程、比亚迪、苏州博世等企业深耕自动驾驶算法7-8年。此外，公司核心技术源自首席科学家、联合国科学院院士、加拿大工程院院士埃尔萨迪克团队二十余年的数字孪生与触觉交互积累。</p>\n  <p>杨林告诉硬氪，他观察到，此前数据市场需求以汽车合成数据为主，但2025年开始，机器人数据订单急剧增加。</p>\n  <p>“汽车数据没涨，甚至有点跌。随着机器人本体竞争越来越激烈，大家就开始卷机器人大脑，而大脑的瓶颈就是数据。”杨林称。</p>\n  <p>目前，「大衍科技」已形成三条产品线：</p>\n  <p>一是合成数据业务：以合成数据为主，同时结合第一人称视角的“异购”数据采集，服务于自动驾驶与机器人训练。成本优势较为突出——传统人工标注一帧可能花费十几元，而大衍的合成数据仅需几毛钱，毛利率超过60%。</p>\n  <p>二是触觉数采设备：公司自研了国内首个带力触交互的触觉手套“Shadow Gauntlet”及头戴式设备，具备29个阵列单元、1015个触觉触点，最高响应频率300Hz，可同时采集人手姿态与触觉反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_0256088e564844baba415a23da04dd51@6221844_oswg95636oswg859oswg470_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">头戴式设备（图源/企业）</p>\n  <p>三是触觉大模型：这是公司的终极目标，预计今年下半年发布。该模型以多模态输入，在隐空间中加入物理约束，输出物体抓握时的受力方向、大小及最优姿态，目前国内尚无公开的同类产品。</p>\n  <p>成立仅一年左右，「大衍科技」已实现商业化落地。今年一季度公司营收已超千万元，并与多家头部机器人公司开展了合作，预计年底实现首个具身智能定制大脑项目交付。</p>\n  <p>此外，出海是公司明年的重点规划。公司计划2025年底至2026年初在沙特设立子公司，推动硬件与数据出海。同时，公司不排除在触觉大模型成熟后向下游延伸，尝试打造差异化的“机器人大脑”。</p>\n  <p><strong>以下是硬氪与杨林的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：当前机器人数据行业最大的技术瓶颈是什么？你们如何应对？</strong></p>\n  <p><strong>杨林：</strong>现在主要有两个瓶颈。第一个是效率——数据飞轮的产能跟不上需求，国内自动驾驶模型的迭代效率明显落后于特斯拉。第二个是精度——客户从要求上半身姿态，到现在要求全身，甚至要解决遮挡情况下的腿部姿态提取。纯视觉无法解决手部遮挡问题，必须加入触觉数据。</p>\n  <p>单拎出来每个模块都有成熟技术，但全部嵌在一起还要高效运转，复杂度是几何倍数提升。我们的应对方式分两条腿走路：一是合成数据加异购采集，用极低成本快速产出大量有效数据；二是自研触觉数采设备，直接从硬件层面获取被遮挡部分的触觉信息，这在行业内是很少见的做法。</p>\n  <p><strong>硬氪：你们的异购采集成本比真机采集成本低很多，其中商业模式怎么跑通？</strong></p>\n  <p><strong>杨林：</strong>我们具体做法是和无人超市、前置仓这类场景合作，让工作人员正常上班时佩戴我们的头戴设备和手套，每天补贴100块钱，就能拿到8小时的连续数据。当然这8小时不是全都能直接用，经过我们的数据产线处理后，可能剩下一半或更少。但即便这样，成本也比真机采集低一个数量级。</p>\n  <p>真机采集为什么贵？他们要建专门的素材厂，把厂房隔成小格子，让机器人在里面反复做同样的任务，一天成本上千甚至上万，而且有效数据比例也不高。</p>\n  <p>我们的逻辑是：既然机器人最终要像人一样工作，那直接采集人的数据，再映射到机器人身上，虽然会有一些损耗，但大量的人的数据可以弥补这个误差。而且我们的数据产线本身也在不断优化，损耗率在持续降低。</p>\n  <p><strong>硬氪：你们的硬件触觉手套和头戴设备，技术壁垒有多高？别人容易抄袭吗？</strong></p>\n  <p><strong>杨林：</strong>我这么说吧，把触觉反馈和手部骨架姿态提取集成到一只手套里，目前市面上是没有的。这里面涉及传感器设计、线路布局、防串扰、防干扰等一系列工程问题，每一个都不简单。手套本身的硬件门槛就不低，我们在核心环节已经申请了多项专利。</p>\n  <p>但更关键的是软硬结合。我们的设备是为触觉大模型服务的，采集的数据格式、标定方式、预处理流程都是和模型训练深度耦合的。就算别人拆解我们的手套，抄出来一模一样的硬件，他没有后面的模型和算法，这个设备的价值也大打折扣。反过来，我们的模型训练又依赖于这套设备持续产出高质量数据。这是一个软硬件的闭环，不是单一维度能复制的。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>松禾资本表示：</strong>大衍科技是一家专注4D世界重建、世界模型、可控扩散模型技术和应用的空间智能公司，为自动驾驶、具身智能、数字孪生等领域提供高质量的合成数据、高保真的预训练场。</p>\n  <p>价值点1–团队稀缺：团队整体较为年轻，核心成员均有5-10年自动驾驶和AI领域研发经验，在算法、感知、决策系统等核心技术环节以及产品、市场能力形成专业互补，且有长期共事经历，团队凝聚力强。</p>\n  <p>价值点2–市场潜力大：数据合成市场处于快速增长阶段，中国2024年市场规模21亿元人民币，2030年预计可达230亿元人民币；具身智能机器人市场，被业界视为继自动驾驶后的下一个万亿级赛道。</p>\n  <p>价值点3–项目稀缺性高：公司基于世界模型的空间智能解决方案，实现对复杂环境的精确感知、建模与决策，在国内从事该领域的创业公司较为稀缺。</p>\n  <p>价值点4–产品已得到客户验证：产品已从实验室走向市场，通过客户验证和行业认可，商业模式得到初步验证，为规模化商业落地奠定坚实基础。</p>\n  <p>价值点5–触觉世界模型填补国内空白：依托Abdulmotaleb El Saddik院士在世界触觉技术领域的领先地位和影响力，不止做具身数据业务，具备模型层的开发落地能力。</p>\n  <p>价值点7–获得政府顶尖人才政策支持：公司首席科学家Abdulmotaleb El Saddik院士已通过浙江省鲲鹏计划人才评选，预计在未来5年内将获得近9000万各类政府资金支持。Abdulmotaleb El Saddik院士（火炬计划）和董教授（启明计划）预计今年5月份全职加入，团队技术实力雄厚。</p>", "category": "tech", "published_at": "2026-07-14T01:38:13+00:00", "fetched_at": "2026-07-14T02:02:50.995509+00:00", "fingerprint": "c7390d8ee712fd2d"}, {"source": "少数派", "title": "你这图「保真」吗？AI 生图时代的信息防伪", "url": "https://sspai.com/post/112185", "summary": "人类记录信息的方式一直在变化，但我们对「真实性」的需求从未改变。<a href=\"https://sspai.com/post/112185\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-13T02:52:47+00:00", "fetched_at": "2026-07-14T02:02:49.352228+00:00", "fingerprint": "73c01e5203b6d3e5"}, {"source": "少数派", "title": "依江伴湖，树影连绵：南昌公园散步指南", "url": "https://sspai.com/post/111776", "summary": "这几年，「公园20分钟效应」在社交媒体上热度很高——不用专门运动，只要在公园里待上20分钟，就能排解负面情绪。对于整天困在写字楼和地铁里的都市人来说，公
