e studios need AI", "url": "https://www.theverge.com/tech/987429/google-needs-hollywood-more-than-the-studios-need-ai", "summary": "Google has reportedly been reaching out to a number of Hollywood's biggest studios, hoping to strike licensing agreements that would allow it to train its AI models on copyrighted material in exchange for massive piles of cash. In theory, these deals would be a win-win: a huge financial boon to the studios that would also [&#8230;]", "category": "tech", "published_at": "2026-09-01T22:50:29+00:00", "fetched_at": "2026-09-02T02:34:28.720407+00:00", "fingerprint": "d90573234ae3a19e"}, {"source": "36氪 - 最新文章", "title": "改写千亿心衰治疗版图：一家中国器械公司如何令全球心血管领域瞩目？", "url": "https://36kr.com/p/3963093920201859?f=rss", "summary": "<p>在心衰治疗版图上，长期存在一片难以攻克的“无人区”。</p>\n  <p>这类患者的病变从左心延伸至肺循环，使肺循环压力和阻力持续升高，并进一步将压力传递至右心使整个心脏与肺循环两端同时承压。然而，现有治疗往往只能覆盖部分机制，随着疾病的持续进展，针对这一复合病理生理过程的成熟治疗方案却长期稀缺。</p>\n  <p><strong>如今，一项来自中国的原创介入技术，正试图从这片“无人区”打开缺口。</strong></p>\n  <p>当地时间8月30日上午，慕尼黑展览中心B3主舞台，南京市第一医院陈绍良教授将PADN-HF-PH研究带上ESC Congress 2026的Hot Line舞台。研究瞄准的正是这类由心力衰竭引起肺高压、长期缺少有效治疗选择的患者，并与全球顶刊《新英格兰医学杂志》（NEJM）论文同步发布。这也是亚洲首个全球创新器械技术登上NEJM。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_2ee5d20c120b4a4895c9fbd3d5be472b@5510391_oswg3919511oswg6000oswg4000_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p><strong>在全球心血管医学界，Hot Line是重要研究进入核心循证体系的关键入口。</strong></p>\n  <p>对这项技术背后的帕母医疗而言，此次亮相还指向一个更大的命题，即一项中国原创技术能否从解决临床难题，走向定义新的治疗路径。</p>\n  <p>围绕肺动脉去神经术PADN，该公司已经走了12年。从源头技术研发，到临床循证、注册准入、国际验证，再到商业化落地，它试图为长期缺少明确治疗路径的患者建立一种新的治疗方式。</p>\n  <p><strong>根据现场陈绍良教授公布的PADN-HF-PH研究，PADN改变心衰相关肺高压患者治疗选择的可能性正进一步提高。</strong></p>\n  <p>此次给出的随机对照证据显示，校正后2年随访PADN联合GDMT组的临床恶化发生率为<strong>25.7%</strong>，而GDMT组高达51.1%；PADN联合GDMT使临床恶化风险降低<strong>51%</strong>（HR 0.49，95% CI 0.30–0.82；P=0.006）。&nbsp;</p>\n  <p><strong>这意味着，一个过去缺少明确治疗路径的患者群体，开始出现被系统性干预的可能。若这一临床获益能够进入临床实践，得到持续监管和验证，并进一步纳入指南，一个此前边界模糊的潜在市场也将随之逐步成形。&nbsp;</strong></p>\n  <p>由此，一个备受行业关注的问题也浮出水面。当中国医疗器械企业进入全球尚无成熟答案的临床领域，能否依靠源头创新率先定义治疗方式，并让全球医学界接受这个来自中国的答案？</p>\n  <h2><strong>01 破局：迈入心衰治疗“无人区”</strong></h2>\n  <p>PADN的商业想象空间，首先建立在一项长期未被满足的临床需求之上。</p>\n  <p>这类患者的难点，在于心脏与肺血管两端的问题同时存在，现有治疗手段很难完整覆盖。</p>\n  <p>目前，心衰治疗以指南指导的药物治疗，也就是GDMT为基础；传统肺高压药物则主要针对肺血管相关机制。</p>\n  <p>对于部分心衰相关肺高压患者，尤其是同时存在肺血管阻力升高和左心充盈压升高的人群，单独处理其中一端，很难覆盖全部病理机制。&nbsp;</p>\n  <p><strong>两套机制叠加，使这一人群长期处于“治疗真空”：疾病负担明确，有针对性的成熟解决方案却十分有限。</strong></p>\n  <p>帕母医疗由此选择了一条器械介入路径。&nbsp;</p>\n  <p>PADN，即肺动脉去神经术。其核心思路是通过一次微创介入射频消融，抑制肺动脉交感神经的过度激活，从而干预肺血管重构及心肺疾病进展。&nbsp;</p>\n  <p><strong>更直观地说，PADN通过一次介入手术调节过去较少被器械直接干预的肺血管交感神经调控通路，为患者增加药物之外的治疗选择。&nbsp;</strong></p>\n  <p>PADN-HF-PH研究由此展开。这项前瞻性、多中心、随机对照注册临床试验，由北部战区总医院韩雅玲院士担任主要研究者，在全国25家临床中心入组264名患者。患者按照1:1随机分为“PADN手术+心衰GDMT”和“单独接受心衰GDMT”两组。&nbsp;</p>\n  <p>研究主要终点直接指向临床恶化事件，包括心衰加重需要静脉给药、再次住院、运动能力明显下降、需要心肺移植及全因死亡等。</p>\n  <p><strong>此次在Hot Line公布的结果中，除了主要临床终点，PADN-HF-PH研究还呈现了患者运动能力、功能状态及相关指标的变化。&nbsp;</strong></p>\n  <p><strong>数据显示，12个月时，PADN联合GDMT组患者六分钟步行距离较GDMT组获得24.8米的净改善；运动能力明显下降的风险降低了63%。与此同时，研究还观察到NT-proBNP及KCCQ等指标的改善，为PADN的临床获益提供了进一步的支持。&nbsp;</strong></p>\n  <p>由此，PADN的循证证据从此前的血流动力学和运动耐量，进一步延伸至临床恶化、复发事件和患者功能状态等多个维度。&nbsp;</p>\n  <p><strong>从产业视角看，这类研究回答了两个层面的问题。</strong></p>\n  <p>第一层，技术是否具备真实、可持续的临床价值。</p>\n  <p>创新器械能否进入治疗体系，最终取决于临床证据能否持续证明患者获益。&nbsp;</p>\n  <p>第二层，新市场能否随治疗路径的建立而形成。&nbsp;</p>\n  <p>在已有成熟解决方案的领域，新进入者面对的是边界相对清晰的存量市场。在长期缺少有效方案的领域，一种新治疗方式一旦得到持续验证，患者的治疗路径本身就可能被重新定义。</p>\n  <p><strong>原本散落在既有治疗边界之外的患者，由此被纳入一条更明确的治疗路径。</strong></p>\n  <p><strong>这正是First-in-Class医疗器械的重要产业特征——市场规模往往会伴随新治疗范式的建立逐步形成。&nbsp;</strong></p>\n  <p>因此，PADN接下来要验证的，是这条治疗路径能否进入全球临床体系，并最终把临床需求转化为可持续市场。</p>\n  <h2><strong>02 进阶：从中国循证走向全球验证</strong></h2>\n  <p>原创医疗器械从概念走向市场，需要跨过一条漫长的验证链。</p>\n  <p>进入临床只是起点，<strong>循证强度、不同人群的可复制性、监管认可和医生接受度，共同决定一项技术最终能够走多远。</strong></p>\n  <p>PADN已经沿着这条路径走了12年。</p>\n  <p><strong>早期的PADN-5研究为这项技术积累了基础循证证据。</strong>相关研究验证了PADN在改善患者血流动力学和运动耐量方面的临床价值，并发表于《JACC:HeartFailure》。</p>\n  <p>国内证据建立之后，下一关是可复制性。同一套治疗方法进入不同国家、不同患者和不同医疗环境后，能否获得一致结果，才是决定其能否真正推广的关键。&nbsp;</p>\n  <p>对医疗器械而言，这一点尤为重要，患者特征、医生操作习惯和医疗体系的差异，都可能影响一项技术的最终表现。</p>\n  <p><strong>因此，国际多中心临床验证成为原创器械走向全球市场必须跨过的一关。</strong></p>\n  <p>2026年EuroPCR上首发的PADN-Columbus国际多中心研究，是这一过程中的重要节点。&nbsp;</p>\n  <p>相较此前以中国患者为主的临床验证，PADN-Columbus首次将循证范围扩大到国际患者。</p>\n  <p>据了解，在CpcPH患者中，研究观察到肺血管阻力和肺毛细血管楔压两个血流动力学指标同步下降，并进一步显示出功能状态改善及临床预后获益趋势。</p>\n  <p><strong>国际临床验证向外扩展的同时，监管准入和学术认可也在同步推进。</strong></p>\n  <p>在中国实现产品获批后，PADN正进一步推进欧洲商业化，并通过美国PULSE-LHD IDE临床试验持续开展全球验证。这项技术也已被包括2022年ESC/ERS肺高压诊断与治疗指南在内的国内外七部临床指南引用。</p>\n  <p><strong>把这些节点串联起来，可以看到原创医疗器械全球化的一条清晰路径。&nbsp;</strong></p>\n  <p>第一步，证明技术成立。&nbsp;</p>\n  <p>第二步，验证临床获益是否稳定，并在不同患者和医疗环境中重复验证。&nbsp;</p>\n  <p>第三步，进入不同国家和地区的监管体系。</p>\n  <p>第四步，推动医生形成认知，让新的治疗方式逐渐进入临床实践。&nbsp;</p>\n  <p>四个环节互为前提，也都需要时间积累。当这条链条逐步打通，商业化才有稳定基础。</p>\n  <p><strong>这正是ESC Hot Line对帕母医疗的意义，它进一步把PADN推入全球核心循证与学术评价体系。</strong></p>\n  <p>与此同时，公司的全球验证仍在继续。美国PULSE-LHD IDE临床试验已经完成首批患者入组；帕母医疗也已在欧洲、中东、亚洲和南美推进商业化，并通过美国临床继续布局更大的市场。</p>\n  <p>从PADN-5、PADN-Columbus，到此次登上ESC Hot Line的PADN-HF-PH，再到中国获批、欧洲等市场商业化及美国IDE临床推进，帕母医疗逐渐<strong>搭起一条“原创技术—临床循证—监管准入—学术认可—商业化”的完整链条</strong>。&nbsp;</p>\n  <p>这条链条也揭示出，医疗器械全球化的核心远不止于产品进入海外市场。</p>\n  <p><strong>更深层的全球化，是一项技术逐步进入全球医学界定义疾病、评价技术和建立治疗路径的过程；产品出海则是这一过程最终呈现的商业结果。&nbsp;</strong></p>\n  <p>对于一家依靠源头创新起步的中国医疗器械公司而言，这是一条难度最高、周期最长，也最有可能形成长期壁垒的路径。</p>\n  <h2><strong>03 放大：从临床价值走向全球市场</strong></h2>\n  <p>当临床验证和全球准入逐步推进，PADN的商业化命题随之凸显。</p>\n  <p><strong>一家First-in-Class医疗器械公司，如何把临床价值转化为商业价值？</strong></p>\n  <p>首先，需要跨过漫长的投入期。</p>\n  <p>创新器械研发周期长、临床试验成本高，面向全球市场后，公司还需在多个国家持续推进监管、循证和商业化体系建设。&nbsp;</p>\n  <p><strong>在产生大规模收入之前，这类公司往往要承受长期投入。</strong></p>\n  <p>从2013年开始，帕母医疗便持续获得专业投资机构支持。最近一轮为2026年4月，完成D轮1亿美元融资，领投方为全球最大医疗器械巨头美敦力，现有投资方EQT（殷拓）、启明创投、高榕创投、奥博资本及礼来亚洲基金等持续跟投，以及红杉中国等多家知名全球机构投资方参与本轮。</p>\n  <p><strong>比融资金额和资方阵容更值得关注的，是资本持续投入背后的判断逻辑。</strong></p>\n  <p>第一层逻辑，来自未被满足的临床需求，前文已经详述。第二层逻辑，来自原创技术的稀缺性。&nbsp;</p>\n  <p>传统医疗器械创业往往可以参考海外已经验证的产品和商业模式，核心挑战更多集中在工程化、成本和渠道。而First-in-Class路径缺少可直接复制的成熟答案，企业需要自行完成技术验证、临床验证、监管推进和市场教育。</p>\n  <p><strong>风险更高、周期更长，也使时间积累本身成为竞争壁垒。</strong></p>\n  <p>对PADN而言，过去12年沉淀下来的资产已经超出单一产品。临床数据、注册经验、指南认知，以及国内外研究中心和医生网络，共同构成了后来者难以在短时间内复制的基础设施。&nbsp;</p>\n  <p>随着中国实现产品获批，欧洲、中东、亚洲和南美商业化持续推进，以及美国PULSE-LHD IDE临床试验不断向前，PADN商业命题的重心正在发生转移。</p>\n  <p>如果说早期需要回答的是技术能否成立，那么现阶段更关键的是这项技术能够覆盖多少患者、进入多少国家，并最终形成多大的市场。&nbsp;</p>\n  <p><strong>随着临床验证和全球准入逐步推进，PADN的下一个增长命题逐渐转向适应证扩展，第三层增长空间也随之浮现。&nbsp;</strong></p>\n  <p>PADN究竟只对应一个适应证，还是能够围绕肺高压、心衰以及更多相关心肺疾病持续扩展边界，将直接决定其长期发展潜力。&nbsp;</p>\n  <p>对于平台型器械技术，同一个底层技术能够覆盖多少患者、进入多少治疗场景，往往决定一家公司的长期价值上限。因此，持续拓展适应证，将成为帕母医疗下一阶段的重要增长逻辑。</p>\n  <p><strong>再把视野放大，PADN所代表的变化，可能并不只是一个产品的诞生。&nbsp;</strong></p>\n  <p>很长时间里，中国医疗器械企业面对的是一个已经被定义好的世界。疾病如何治疗、产品如何评价、市场如何划分，成熟路径大多来自海外。</p>\n  <p>中国企业更擅长做的，是沿着既有坐标完成追赶、替代和效率提升。</p>\n  <p><strong>First-in-Class创新真正改变的，恰恰是一套坐标关系。</strong></p>\n  <p>当一家中国公司进入全球都缺少成熟答案的临床“无人区”，它要回答的，已经不只是原创技术是否有效，而是能否凭借不断累积的随机对照临床证据，让一个过去缺少明确治疗路径的患者群体被重新看见，让一种新的治疗方式进入全球医学界的评价与治疗体系，并由此划出新的市场边界。</p>\n  <p>这也是PADN比商业化本身更值得观察的地方。过去12年，帕母医疗把一项源头技术，一步步送入临床研究、指南、监管体系和全球医学评价体系；接下来，它要走向的，是参与定义全球市场。</p>\n  <p><strong>所谓闯入“无人区”，真正的价值或许就在这里。</strong></p>\n  <p>那里没有现成的路。最先走通的人，不仅蹚出了一条道，也标定了行业前进的方向。</p>\n  <p>后续，以帕母医疗为代表的中国原创医疗器械企业将从全球市场的参与者，进一步成为新治疗路径的发起者与共建者。&nbsp;</p>\n  <p>而这，正是中国医疗器械迈入原创创新新阶段，最震撼的开篇。</p>", "category": "tech", "published_at": "2026-09-01T14:00:00+00:00", "fetched_at": "2026-09-02T02:34:28.631409+00:00", "fingerprint": "c76915a660238086"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宇树回应“报销超100元需王兴兴亲自审批”；Manus恢复独立运营；蔚来发布二季度财报，营收增长69.1%", "url": "https://36kr.com/p/3965525489491463?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>华为小米荣耀回应手机涨价</p>\n  <p>抖音客服回应突发大面积服务异常</p>\n  <p>苹果市值一夜飙升8000亿</p>\n  <p>“豆包手机”获入网许可，9月上市销售</p>\n  <p>Anthropic发布Claude Fable 5.1</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>宇树回应“报销超100元需王兴兴审批”：很多内容不实，切勿当真</strong></p>\n  <p>9月1日，宇树科技内部管理模式引发热议。网传称“单笔超100元报销需王兴兴亲自审批”，且其细节管理极为严苛。对此，宇树官方回应：“很多内容不实，切勿当真”。据报道，在产品层面，王兴兴要求极高，亲自把控细节，小到螺丝钉长度都要过问，并要求员工严守保密规则，将精力聚焦在产品打磨上。王兴兴本人工作节奏紧张，沟通风格直接，极其重视成本控制，全部精力都扑在一线产品研发上，很少谈论工作之外的话题。公开资料显示，宇树科技成立于2016年，截至9月1日收盘，股价571元/股，市值2310亿元。（财经网科技）</p>\n  <p><strong>Manus恢复独立运营</strong></p>\n  <p>Manus宣布已正式恢复独立运营。该公司表示，创始团队将继续领导公司，坚定不移地致力于产品创新，并为全球用户推进通用AI代理的发展。对于部分用户而言，此次过渡需要备份和恢复数据，并应对访问的临时中断。（财联社）</p>\n  <p><strong>蔚来：二季度营收321.4亿元，同比增长69.1%</strong></p>\n  <p>36氪获悉，蔚来发布2026年第二季度财报。财报显示，蔚来二季度实现营收321.4亿元，同比增长69.1%；其中车辆销量290.582亿元，同比增长80.1%。净亏损5.28亿元，上年同期净亏损49.948亿元；剔除基于股份的薪酬费用，第二季度调整后净利润（非GAAP）为2610万元。9月1日晚，蔚来创始人、董事长、CEO李斌在2026年二季度财报电话会上表示，第二季度，公司综合毛利率18.4%。得益于高毛利车型持续热销和成本结构进一步优化，尽管面临行业原材料成本大幅上涨的压力，整车毛利率仍保持在18.5%。其他销售毛利率达17.0%，服务与社区相关业务持续贡献利润。（证券时报）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic发布Claude Fable 5.1和Mythos 5.1：性能超越前代，缓存读取费用下调75%</strong></p>\n  <p>当地时间9月1日，Anthropic推出Claude Fable 5.1与Mythos 5.1，该公司称这两款模型为“全球最先进的编程与知识工作模型”。据悉，编程和科学能力显著提升，在多项基准测试中超越前代及GPT-5.6 Sol。同时，缓存读取费用下调75%，并推出企业级安全方案EFS。（IT之家）</p>\n  <p><strong>科大讯飞开源两款端侧通用大模型</strong></p>\n  <p>36氪获悉，科大讯飞全资子公司词元星火正式推出并开源星火X2.5-4B和星火X2.5-1.7B两款端侧通用大模型。作为端侧模型中首个原生支持最长100万Token上下文的模型，星火X2.5-4B和1.7B两款模型采用混合注意力架构，并围绕智能体、代码、数学和指令遵循等核心能力进行优化。</p>\n  <p><strong>Marvis上线自定义模型功能，支持接入Kimi、智谱GLM等主流模型</strong></p>\n  <p>36氪获悉，腾讯旗下操作系统层级的AI助手Marvis正式上线“自定义模型”功能。用户现可在Marvis中自由接入采用行业通用接口标准的第三方模型，包括腾讯云、阿里云、DeepSeek、Minimax、Kimi、智谱、小米等厂商提供和支持的主流模型，同时也支持接入本地部署的开源模型，并可在不同设备间同步使用。</p>\n  <p><strong>腾讯混元宣布推出Hy4 preview轻量版</strong></p>\n  <p>36氪获悉，腾讯混元宣布推出Hy4 preview轻量版，腾讯混元团队通过两项核心技术，把Hy4 preview的权重从接近1.5TB缩小到约214GB，降低运行模型硬件门槛。</p>\n  <p><strong>阿里云宣布Qwen3-VL-Rerank模型降价</strong></p>\n  <p>36氪获悉，阿里云公告，大模型服务平台百炼将于北京时间2026年8月31日10:13:53起，对北京地域Qwen3-VL-Rerank模型计费单价进行下调调整：将文本输入从0.7元/百万tokens下调至0.5元/百万tokens，多模态输入从1.8元/百万tokens下调至0.5元/百万tokens。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美国伊朗冲突升级，国际油价大涨</strong></p>\n  <p>美国中央司令部发消息称，美国东部时间9月1日中午12点，美军开始对伊朗境内的伊斯兰革命卫队目标实施打击，以回应革命卫队近期试图攻击霍尔木兹海峡商业航运以及该地区美军。伊朗伊斯兰革命卫队发布声明称，向约旦亚喀巴湾沿岸的美国海军陆战队营地发射了重型弹道导弹，“摧毁了数个重要设施和敌方攻击直升机，造成大量美军死伤”。</p>\n  <p>国际油价大涨，WTI原油期货收于每桶90.22美元，涨幅5.20%；布伦特原油期货收于每桶94.65美元，涨幅4.6%。（财联社）</p>\n  <p><strong>报道称三星存储器业务部门将2031年前约70%的产能分配给长约订单，HBM抢货情况相当激烈</strong></p>\n  <p>AI建设热潮引爆HBM需求，并排挤传统DRAM供给、抢货情况相当激烈，使现货价格进一步飙升。韩媒报道，三星的存储器业务部门已将2031年前约70%的产能分配给长约订单(long-term agreements，简称LTAs)，��要签约客户包括英伟达，微软及谷歌等大型科技公司，但连这些大型科技公司都无法取得合约约定的全部供货量。HBM三星电子DS部门存储器事业部产品企划团队负责人崔长锡1日公布了三星下一代存储器战略。</p>\n  <p>三星电子目前正在开发HBM5，目标是相比HBM4E将性能提升2倍、每瓦性能提升20%，同时将热阻降低20%，以满足AI芯片对高性能和低功耗的需求。面向HBM5之后的zHBM，三星计划进一步提升性能。三星提出的目标是，zHBM相比HBM4E性能提升8倍、每瓦性能提升3倍，同时将热阻降低75%至90%。（新浪财经、财联社）</p>\n  <p><strong>苹果市值一夜飙升8000亿</strong></p>\n  <p>苹果股价逆势大涨2.61%，市值站上4.75万亿美元，较上一交易日收盘4.63万亿美元大增1200亿美元（约合8065亿元人民币）。</p>\n  <p>9月1日，苹果公司官网更新，约翰·特努斯正式担任苹果首席执行官，并担任董事会成员。约翰于2001年加入苹果产品设计团队，2013年成为硬件工程副总裁。他于2021年加入高管团队，担任硬件工程高级副总裁。在苹果任职期间，约翰监督了多款开创性产品的硬件工程工作，并在推出多条新产品线（包括iPad和AirPods）以及iPhone、Mac和Apple Watch等多代产品中发挥了关键作用。（财联社）</p>\n  <p><strong>抖音客服回应突发大面积服务异常</strong></p>\n  <p>8月31日晚，抖音平台突发大面积服务异常导致推荐算法错乱，引发网友吐槽“抖音推荐难看”。具体表现为用户日常偏好标签失效，首页推送非日常关注内容；大量用户反馈点击“不感兴趣”或快速划过，依然无法阻止同类低质内容持续刷屏；基础功能局部瘫痪，除推荐流异常外，部分用户遭遇搜索页面空白、私信无法收发等情况。9月1日，抖音客服回应称，已收到用户反馈，平台十分重视。目前在加急排查，具体原因请耐心等待，用户可重启APP尝试恢复。（第一财经、搜狐科技）</p>\n  <p><strong>宜家中国回应降价</strong></p>\n  <p>9月1日消息，宜家将对1500多款商品进行15%至25%的降价，其中主要集中在欧洲市场。国内市场是否同步降价？对此，记者以消费者身份致电宜家中国官方客服，客服表示：“目前没有相关产品要降价的通知，具体价格以官网显示为准。如果购买一礼拜左右出现价格调整，可重新咨询官方电话。”此外，宜家官方小程序客服也表示，暂未接到降价通知。（中新经纬）</p>\n  <p><strong>胖东来，最新业绩公布</strong></p>\n  <p>胖东来创始人于东来在个人账号发布胖东来经营数据。数据显示，胖东来2026年前8个月销售额超过195亿，同比增长26.98%，其中超市业态销售额达107亿元。门店情况中，时代广场门店销售额超44亿元。（财联社）</p>\n  <p><strong>欧、美、日、英，多国债市遭抛售潮</strong></p>\n  <p>受能源价格上涨、通胀预期升温及主要央行政策预期变化影响，全球债市卖压加剧，多国长期国债遭抛售、收益率普遍走高。日本30年期国债收益率升至4.18%以上，创历史新高；英国30年期升至5.88%，续创1998年以来最高；德国10年期升至3.339%，为2011年以来最高；美国30年期升至5.28%。同期，现货白银跌2.33%，黄金跌1.66%，布伦特原油涨2%。美联储偏鹰表态叠加油价上涨，市场对9月降息预期明显降温，最新定价显示加息概率升至约66%。（财联社）</p>\n  <p><strong>长鑫存储开启全球校招，工作地点包括合肥、北京、上海、西安、日本，岗位覆盖电路设计、量产技术等</strong></p>\n  <p>9月1日，据长鑫存储招聘消息，长鑫存储2027全球校园招聘正式开启。此次招聘面向2027届海内外高校毕业生，专业涵盖微电子、通讯、电路设计、半导体设计、集成电路、数学、计算机、物理、化学、电路系统、电子工程、电子信息、材料、人工智能等。招聘岗位包括电路设计类、研发技术类、量产技术类、生产运营类、信息技术类、市场营销类、业务赋能类。工作地点位于合肥、北京、上海、西安、日本。（财联社）</p>\n  <p><strong>千亿市值芯片龙头：大基金不再是持股5%以上股东</strong></p>\n  <p>9月1日，千亿市值芯片龙头芯原股份(688521.SH)公告称，公司股东国家集成电路产业投资基金股份有限公司于2026年8月31日通过集中竞价方式减持49.47万股，持股比例由5.0941%降至5.0000%，不再是公司持股5%以上股东。公告指出，本次权益变动为履行此前披露的减持计划，不触及要约收购，不会导致公司控股股东及实际控制人变化。根据公司的半年报显示，截至6月30日，国家集成电路产业投资基金股份有限公司位列芯原股份第三大股东，持股比例为5.09%。（财联社）</p>\n  <p><strong>美国银行副总裁在时代广场被刺身亡</strong></p>\n  <p>9月1日，美国银行副总裁艾琳·皮亚琴蒂据称在时代广场被刺身亡。公开信息显示，美国银行（Bank of America）为美国第二大商业银行，业务包含个人零售银行、商业信贷、投资银行、全球市场交易以及美林品牌下的财富管理。（每日经济新闻）</p>\n  <p><strong>印度总理莫迪呼吁民众少买黄金，称自力更生有助应对外部冲击</strong></p>\n  <p>随着印度贸易逆差扩大和卢比走弱给经济带来压力，印度总理纳伦德拉·莫迪再次呼吁抑制黄金需求，表示若非必要印度民众应避免购买黄金。这是莫迪今年第二次发出类似呼吁。早在5月，莫迪曾要求印度民众至少一年内不要购买黄金，以节省外汇储备。黄金是印度仅次于石油的第二大进口商品，也是造成贸易逆差的主要因素之一。在始于4月的本财年前四个月，黄金进口量同比增长逾32%，进一步加大了卢比面临的压力。印度7月份贸易逆差扩大至近320亿美元，为今年1月以来最高水平。（界面新闻）</p>\n  <p><strong>“豆包手机”获入网许可，9月上市销售</strong></p>\n  <p>9月1日，努比亚NaviX Ultra已正式获得工信部入网许可，完成从大模型备案到终端入网的完整合规流程，将正式开启规模化商用。据悉，该机将搭载豆包手机助手，定位量产旗舰，计划于9月上市并开售。（界面新闻）</p>\n  <p><strong>华为小米荣耀回应手机涨价</strong></p>\n  <p>据媒体报道，华为、小米、荣耀等品牌手机近日迎来集体涨价，涨价产品覆盖多个机型。华为客服回应称，因关键物料市场价格调整，产品成本上涨，对应售价进行相应调整。小米客服则表示，受核心元器件采购成本持续上涨影响，对相关产品适当调整了零售价格。荣耀客服回复称，产品价格及活动会根据市场需求进行调整，所以在综合评估后对相关产品价格进行了适当调整。（中国新闻网）</p>\n  <p><strong>希音公布最终发售价及配发结果</strong></p>\n  <p>36氪获悉，希音公布最终发售价及配发结果，最终发售价为每股48.56港元；首日收盘46.62港元收盘较发行价-4.0%，全天成交约3,290万股、15.14亿港元。全球发售约2.8亿股B类股份，其中香港公开发售占10%、国际发售占90%；发行市值约2,052亿港元，约265亿美元。（网易新闻）</p>\n  <p><strong>苹果指控OpenAI“销毁证据”，称前工程师“带走机密并在OpenAI使用”</strong></p>\n  <p>据报道，苹果针对OpenAI的法律战升级，在新的法庭文件声称OpenAI“积极销毁关键证据”，且跳槽OpenAI的前iPhone工程师Chang Liu“不仅下载了苹果的机密电路原理图，还在OpenAI的工作中使用”。这份法庭书面文件于当地时间8月31日提交，旨在支持苹果提出的加速审前事实调查的动议，苹果指控OpenAI窃取商业机密，后者则要求法院驳回此案。（界面新闻）</p>\n  <p><strong>大众中国已启动对星宇股份投诉专项调查</strong></p>\n  <p>日前有消息称，大众汽车方面收到了关于“星宇股份批量劝退应届生”相关投诉。9月1日，大众中国新闻发言人表示，“对于关于该供应商的相关投诉，大众汽车集团高度重视并第一时间启动了专项调查，目前调查正在进行中。尊重劳动者合法权益，是大众汽车集团开展所有经营活动恪守的核心原则。这一点同样贯穿于我们供应链体系的管理之中，我们要求，各项基本价值与权利必须得到充分保障。”（澎湃新闻）</p>\n  <p><strong>《微短剧发展管理办法》9月1日起正式施行</strong></p>\n  <p>国家广播电视总局日前公布的《微短剧发展管理办法》9月1日正式施行。这是中国首部针对微短剧领域的专项部门规章，法律效力层级高于此前行业指引类规范性文件。《办法》核心确立分类分级管理机制，根据投资额度与题材属性，将微短剧划分为一类、二类、三类三个层级，对应不同的备案与审核要求。《办法》规定，使用人工智能技术生成、制作的微短剧，制作机构和播出单位应当遵守国家有关规定，并依据有关规定在每集明显位置添加提示标识。这既是对观众知情权的保障，也是对AI内容创作的规范引导。（央视新闻）</p>\n  <p><strong>吉林省举办戒烟大赛</strong></p>\n  <p>据吉林省疾控中心官方公众号9月1日消息，吉林省戒烟大赛正式开启。此次大赛是吉林省大型全民控烟公益活动，面向全省有戒烟意愿吸烟者开放报名。</p>\n  <p>据介绍，大赛整合全省疾控、医疗机构戒烟门诊专家资源，专业医师全程一对一帮扶，通过心理干预与医学支持科学方法助力摆脱烟瘾，提供全程专业戒烟指导，以90日坚守为竞赛周期，通过规范考核评定戒烟成功选手并颁发证书。参赛知情同意书显示，戒烟干预阶段为期3个月，包括首诊、随访、CO检测。第3个月进行随访时，通过进行呼出CO气检测以验证戒烟状态。持续无吸烟超过3个月，并经呼出CO气检测确认，可获得荣誉证书。（中国青年报）</p>\n  <p><strong>美国炸鸡巨头中国首店开业，代排费炒至百元</strong></p>\n  <p>美国炸鸡品牌Church’s Texas Chicken中国首店（下称“德克圣堂炸鸡”）近日在上海吴江路开业，引发排队热潮。二手平台上，其代排服务标价50-130元，如果不想自己到场取，还需要额外再支付一些闪送费用。工作人员在接受媒体采访时表示，为了防止黄牛只能现场排队点单，后续会开通小程序和外卖，但暂不清楚具体时间。公开资料显示，德克圣堂炸鸡于1952年在美国德克萨斯州创立，如今已在全球60多个国家和地区开出超过2100家门店。今年其首次进入中国市场，运营商为上海德克圣堂品牌管理有限公司。（界面新闻）</p>\n  <p><strong>瑞斯康达：因违规披露重要信息罪，两董事被判处有期徒刑一年六个月并处罚金100万元</strong></p>\n  <p>36氪获悉，瑞斯康达公告，公司收到董事李月杰与朱春城送达的北京市第三中级人民法院一审《刑事判决书》。两人因犯违规披露重要信息罪，均被判处有期徒刑一年六个月，各处罚金100万元。李月杰为实际控制人之一，判决不影响股东权利行使，亦不会对生产经营产生重大不利影响。本次判决为一审判决，尚未生效，最终结果存在不确定性。</p>\n  <p><strong>美股三大指数集体收跌，热门中概股普跌</strong></p>\n  <p>36氪获悉，9月1日收盘，美股三大指数集体下跌，道指跌0.79%，纳指跌1.03%，标普500指数跌0.71%。大型科技股多数下跌，特斯拉跌超3%，亚马逊、英伟达、谷歌、微软跌超1%，苹果涨超2%，Meta涨超1%。热门中概股普跌，蔚来跌超4%，爱奇艺跌超3%，哔哩哔哩涨超2%，阿里巴巴、京东、网易、小鹏集团、理想汽车跌超1%，拼多多、百度小幅下跌。</p>\n  <p><strong>专升本新生称买学生优惠票被“卡”，12306客服回应</strong></p>\n  <p>一名2026级专升本的新生向澎湃新闻反映，因12306APP无法识别其购票资质，只得先购成人票，后在人工窗口购学生票，但退成人票被扣66元手续费。该生认为系统障碍不应乘客自担费用。12306客服表示，平台已关注到该类用户诉求，后续或将结合他们购票遇到的问题，开展相关技术优化。（澎湃新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>快乐蜂表示将在香港上市其国际业务部门</strong></p>\n  <p>菲律宾快餐巨头Jollibee（快乐蜂）宣布，将其国际业务部门转向香港上市，放弃了此前在美国交易所发售股份的计划。Jollibee今年早些时候曾宣布分拆国际业务赴美上市以加速全球扩张。公司9月1日在菲律宾交易所的公告中表示，鉴于其在亚洲的业务布局与品牌知名度，香港是上市载体Jollibee Foods Corporation International（JFCI）的”天然市场”。（新浪财经、新纷网）</p>\n  <p><strong>Akulaku秘密递交香港IPO申请，募资最高5亿美元</strong></p>\n  <p>IFR援引交易知情人士消息报道，蚂蚁集团支持的印尼金融科技公司Akulaku已秘密提交香港上市申请，拟募资3亿5亿美元。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>“诺瓦聚变”完成总额12亿元Pre-A系列融资</strong></p>\n  <p>36氪获悉，核聚变企业“诺瓦聚变”完成总额12亿元Pre-A系列融资，美团龙珠、高瓴资本持续加码布局，联想创投、国中资本作为全新战略投资方入局。本轮融资将为下一步并行推进Q&gt;1净聚变能输出验证及商业电站配套提供充足的资金储备。</p>\n  <p><strong>“NestWorks”完成数亿元天使轮及天使+轮融资</strong></p>\n  <p>36氪获悉，桌面CNC品牌“NestWorks”日前已完成数亿元天使轮及天使+轮融资，投资方为红杉中国、蓝驰创投、钟鼎资本、祥峰投资与元璟资本，高鹄资本担任后续融资的独家财务顾问。</p>\n  <p><strong>小特朗普旗下风投领投Polymarket 10亿美元融资，估值升至210亿美元</strong></p>\n  <p>预测市场平台Polymarket近日完成新一轮10亿美元融资，由小唐纳德·特朗普旗下的1789 Capital领投，投后估值达210亿美元。该公司发言人证实，1789 Capital在本轮中出资约3亿美元，加上此前约2亿美元投资，累计注资达5亿美元。Polymarket上一轮估值约为150亿美元，此次融资使估值在数月内提升40%。（新浪财经）</p>\n  <p><strong>“Nirva”完成数千万元元种子轮融资</strong></p>\n  <p>36氪获悉，可穿戴AI硬件“Nirva”完成数千万元元种子轮融资，由美国VC光速（Lightspeed）领投，South Park Commons跟投，由深渡资本担任长期独家财务顾问。此次融资主要用来扩充团队、量产准备和新品研发。</p>\n  <h2>大公司财报</h2>\n  <p><strong>胖东来1-8月销售额超195亿，同比增长26.98%</strong></p>\n  <p>36氪获悉，胖东来创始人于东来在个人账号发布胖东来经营数据。数据显示，胖东来2026年前8个月销售额超过195亿，同比增长26.98%。</p>\n  <p><strong>圣贝拉：上半年实现营收6.11亿元，同比增长36.0%</strong></p>\n  <p>36氪获悉，母婴护理中心圣贝拉集团公告，2026上半年实现营收6.11亿元，同比增长36.0%，毛利2.21亿元，同比增长30.8%，经调整期内利润6058万元，同比增长56.2%。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong>年轻人不接盘，驾校躺赚的日子到头了。&nbsp;</p>\n  <p><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-09-02T00:24:54+00:00", "fetched_at": "2026-09-02T02:34:28.631403+00:00", "fingerprint": "be4a71d9f61b203b"}, {"source": "36氪 - 最新文章", "title": "外卖大战后，“不参战”的霸王茶姬手里握着什么牌？", "url": "https://36kr.com/p/3965565272579331?f=rss", "summary": "<p><strong>作者&nbsp;|&nbsp;杨烁</strong></p>\n  <p>2025年，互联网大厂掀起了一场前所未有的奶茶补贴大战。</p>\n  <p>去年4月，京东宣布进军外卖生意。随后，奶茶、咖啡等高频消费品类，被互联网大厂们当作争夺用户和订单的入口。疯狂补贴下，“免费喝”“0元购”“1分钱喝奶茶”一度成为社交平台上的热门话题。</p>\n  <p>流量是平台的，代价却由行业分摊。这导致，本就处于存量竞争、刺刀见红的新茶饮市场，被这场大战搅得更“卷”。</p>\n  <p>今年8月以来，茶饮上市公司陆续发布上半年财报。</p>\n  <p>有头部品牌连续两个季度同店为负。品牌将其归咎于“受外卖平台补贴带动，去年可比基数较高”。</p>\n  <p>几乎同时，没有深度参与外卖大战的霸王茶姬发布了最新财报。2026年二季度，公司总GMV为76.6亿元，净收入34.15亿元，同比增长2.5%；营业利润5.25亿元，经调整净利润4.89亿元，这也是该品牌连续14个季度保持盈利。</p>\n  <p>如果只看收入，这并不是整个行业里增速最快的成绩单。</p>\n  <p>但放在外卖大战后的行业环境来看，它提供了另一种值得观察的样本——当价格、订单和流量都可以被短期补贴放大，一家茶饮企业是否能同时守住品牌价格体系、加盟商利润与自身的经营效率？</p>\n  <p>霸王茶姬解答的，正是这样一道难题。</p>\n  <h2>01. 外卖大战后的“验真时刻”</h2>\n  <p>如今回看，外卖大战更像是一场改变餐饮行业节奏的“压力测试”。</p>\n  <p>随着消费大环境变化，人们对未来可支配的收入预期趋于谨慎，消费者对价格变得敏感。互联网平台的“补贴争夺”，无疑放大了这一趋势。</p>\n  <p>当一杯奶茶因补贴“打”到几元，甚至“0元”，低价产品迅速成为消费者的价格锚点。</p>\n  <p>对于茶饮品牌来说，订单或因此增长，却并不意味着生意变得更好。</p>\n  <p>外卖大战真正的考验在于，行业价格体系被打乱之后，谁还能守住单店经营。补贴退潮之后，企业真正需要思考的是——这些订单究竟带来了多少真实收入、留下了多少利润和现金流？</p>\n  <p>细看上半年各品牌的财报表现，整个行业呈现出极为鲜明的分化态势。</p>\n  <p>营业利润率方面，头部企业普遍保持稳定；腰部企业则相对承压，甚至出现整城撤退的案例。</p>\n  <p>现金流是另一块试金石。尽管在上半年，有上市公司的现金流大幅回落，头部企业却仍维持在几十亿元的水平。与之相比，腰部企业就没那么好过——现金流承压，对加盟商的结算也从“先款后货”变为“分期政策”。</p>\n  <p>正是在这样一种冷暖交织的行业表现中，霸王茶姬的成绩显得独特——并不是因为增速亮眼，而是稳健。</p>\n  <p>外卖大战期间，当行业价格战打得火热，对加盟商的补贴持续加码却不见盈利增长，霸王茶姬主动调整了发展节奏，与价格战划清界限，采取高质量的增长策略。</p>\n  <p>彼时霸王茶姬的判断是：价格战短期能吸引消费，长期来看，却不符合企业经营本质。</p>\n  <p>本季度，霸王茶姬的盈利表现，证明了当初决策的正确性。</p>\n  <p>报告期内，霸王茶姬全球门店总计7639家，同比增长8.5%，整体同店GMV增速较去年同期改善了6.9个百分点。</p>\n  <p>总经营费用方面，公司同比下降10.4%。其中销售及营销费用同比下降21.7%，一般及行政费用同比下降64.6%，其他费用同比下降33.3%。毛利率则为54%，与去年同期持平。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260902/v2_6c569f5a5e2148f8b716300e46c033fa@11416942_oswg459369oswg1080oswg473_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自二季度收益报告</p>\n  <p>门店在扩，单店在变好，费用还在降——霸王茶姬用实打实的财务表现证明了选择的正确性。</p>\n  <p>与此同时，在现金储备方面，公司始终保持稳定。</p>\n  <p>截至2026年6月30日，霸王茶姬的现金及现金等价物等合计67.95亿元；加之上半年新增的13亿元短期投资，公司现金类资产总额超过80亿元。</p>\n  <p>管理层用“真金白银”表达了对公司未来发展的态度。</p>\n  <p>2025年9月30日公司董事会决定派发特别现金股息回馈股东，总额约1.77亿美元。相当于11.8亿人民币现金，2025年内已完成全额派付。另据董事会批准的股份回购计划，自2026年6月1日起十二个月内，公司回购总额不超过1.5亿美元的美国存托股份（ADS），相当于10亿元人民币，目前已回购约257万份ADS，支出了近2亿元人民币。</p>\n  <p>资本市场也投出了信任票。</p>\n  <p>德意志银行重申“买入”评级，多家机构持续上调目标价。可见投资者普遍认可的，是经营数据的扎实度，非概念炒作。</p>\n  <h2>02. 从超级单品，到拼产品创新体系</h2>\n  <p>如果说外卖大战考验的是企业的经营底盘，那么回到消费者端，霸王茶姬手里的第一张牌，是产品。</p>\n  <p>新茶饮行业过去几年的竞争，很大程度上是围绕“爆品”展开的。</p>\n  <p>一款产品突然走红，品牌迅速放大；随后竞争者跟进，市场很快出现大量相似产品。葡萄、杨枝甘露、黄皮、羽衣甘蓝……几乎每隔一段时间，新茶饮行业都会迎来一轮新的原料和口味风潮。</p>\n  <p>但茶饮行业的技术门槛较低，品牌对爆品往往难以守住。如果一家品牌出现爆品，其他品牌就会马上跟进。一时间，市面上全都是“葡萄果茶”与“杨枝甘露”。</p>\n  <p>现如今，上新的军备竞赛并未降温。2026年上半年，有头部品牌在上半年推出142款新品，月均超过20款。</p>\n  <p>新品数量越来越多，能够让消费者真正记住一款产品，却是另一回事。反观霸王茶姬，则呈现出另一种路径。它拥有行业里极少见的经典爆品——伯牙绝弦。</p>\n  <p>据沙利文数据，自2022年1月1日至2025年6月30日，霸王茶姬的超级单品伯牙绝弦已累计销售超12.5亿杯。</p>\n  <p>但相比不断寻找“下一个伯牙绝弦”，霸王茶姬正在做的，是从一个超级单品，逐渐形成一套围绕“茶”的产品创新体系。</p>\n  <p>报告期内，霸王茶姬在大中华区推出了17款茶饮新品，创单季新高，形成了“原叶鲜奶茶、茶拿铁、茶特调、轻因产品”的产品矩阵。</p>\n  <p>品类拓展同样围绕茶展开。从原叶鲜奶茶延伸到茶特调、柠檬奶、geelato茶拉朵。</p>\n  <p>以geelato茶拉朵为例，这一新品类更多体现的是霸王茶姬从“喝茶”到“吃茶”的转变。其研发团队在牛奶与茶底配比、焖煮时间、温度控制等环节反复调试，以保留原叶茶的香气与回甘。</p>\n  <p>这意味着，霸王茶姬并不是简单进入一个新的冰激凌品类，而是在尝试回答一个问题：茶还能以什么形式被消费？</p>\n  <p>同样的产品逻辑，也出现在区域产品上。</p>\n  <p>在地化上，霸王茶姬做得更成体系。今年“五一”前后，霸王茶姬集中推出了多款区域限定产品。截至目前，已覆盖“浙江龙井、安徽六安瓜片、河南牡丹、陕西茯茶、江西庐山云雾、江苏碧螺春”等。</p>\n  <p>表面上看，这是区域限定产品；更深一层，则是霸王茶姬产品体系的一部分——通过不同地域的茶和风物，不断丰富消费者对于“茶”的认知。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260902/v2_b2554f1b6b164425ba891e86d933dccd@11416942_oswg594293oswg865oswg387_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">霸王茶姬geelato产品</p>\n  <p>对于场景维度的创新，是霸王茶姬对“茶”的另一种延展。</p>\n  <p>自去年3月霸王茶姬推出“轻因产品”以来，其品牌的消费时段就已从传统的“下午休闲”扩展到“早中晚”全时段。</p>\n  <p>今年霸王茶姬加码切入了“生日聚会、小型会议、婚宴、团建”等多场景。</p>\n  <p>此外，霸王茶姬与厦门航空的合作，把奶茶带上了万米高空；上半年开出的阿那亚「Chagee Imagine」慢闪店，更是探索了“极致非标”的社区空间。</p>\n  <p>如果把这些动作放在一起看，会发现霸王茶姬的产品创新并不是单纯增加SKU。它真正尝试建立的，是一套围绕“茶”的消费矩阵。</p>\n  <p>产品形态可以变，消费时间可以变，消费场景可以变，但核心始终没有离开“茶”本身。这也是一个超级单品能够持续演变成长期产品创新矩阵的关键。</p>\n  <p>从市场数据来看，这套产品体系开始带来新的增长，还间接带动了会员拉新和复购。</p>\n  <p>今年上半年，“醒时春山”回归，带动清明期间整体GMV环比增长近25%。截至二季度末，Gelato产品已落地超过190家门店，平均线下渠道GMV提升20%以上，并带来新的用户增长和沉睡会员唤醒。</p>\n  <p>对于已经拥有经典爆品的霸王茶姬来说，真正重要的或许不再是寻找下一个爆款，而是如何让消费者因为“伯牙绝弦”第一次认识霸王茶姬之后，还有更多理由继续留下来。</p>\n  <h2>03. 高价值品牌，霸王茶姬的隐形资产</h2>\n  <p>如果说产品创新解决的是“消费者为什么继续来”，那么霸王茶姬手里的另一张牌，是更慢、更难建立的品牌资产。</p>\n  <p>过去一年，外卖大战某种程度上改变了消费者对于茶饮价格的认知。对于品牌发展，却是较危险的信号。一旦消费者开始习惯“低价购买”，品牌忠诚度、用户粘性天然会被打破。</p>\n  <p>霸王茶姬没有深度参与外卖大战，本质上并不是“不愿意要订单”，其商业模式决定了，不能把长期经营建立在持续的低价补贴之上，也与品牌基因有关。</p>\n  <p>当前，霸王茶姬算得上是新茶饮品牌中一个相对特殊的存在，它更接近一家品牌消费公司。</p>\n  <p>从定价上来看，霸王茶姬实际上处于中端价格带，比几块钱一杯的茶饮品质高、更健康、产品更稳定，比30至50元一杯的茶饮定价更实惠，属于高质价比一类——在消费者愿意支付的价格范围内，提供更高的产品价值和品牌体验。</p>\n  <p>高价值品牌真正的挑战，从来不是把价格定高，而是消费者是否愿意持续认可这个价格。</p>\n  <p>会员数据为霸王茶姬的“高价值品牌”定位提供了另一个观察窗口。</p>\n  <p>截至二季度末，霸王茶姬会员总数达到2.57亿，活跃会员复购率保持在43%以上，购买两次以上的会员贡献超过78%的订单量。</p>\n  <p>超高的复购率足以证明，霸王茶姬并不完全依赖一次性的促销订单获得增长，其拥有一个稳定增长且黏度较高的用户客群。</p>\n  <p>从行业视角来看，以加盟商、下沉市场起家的诸多茶饮品牌，更容易忽略品牌资产的含金量。</p>\n  <p>霸王茶姬作为中高端品牌，对品牌的投入相对更早。</p>\n  <p>二季度的两个联名动作颇具代表性。</p>\n  <p>今年7月初，霸王茶姬与80岁的中国绘本画家蔡皋合作。</p>\n  <p>蔡皋是2026年“国际安徒生奖插画家奖”的首位中国获奖者。霸王茶姬与其共同推出了三款气泡茶产品，将她笔下的田园、山水与童趣转化为产品语言。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260902/v2_18923fd731e840298f2c351a095cba73@11416942_oswg256347oswg553oswg360_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">霸王茶姬与蔡皋联名</p>\n  <p>同月末，公司又与王者荣耀合作，推出了铁观音茶底特调。</p>\n  <p>两个合作对象跨度很大，却解决了消费品牌既需要在保持自身文化气质的同时，持续贴近大众生活的“双重需求”。</p>\n  <p>更进一步看，霸王茶姬的视觉与美学体系，同样是品牌资产的一部分。</p>\n  <p>长期以来，霸王茶姬都在“门店空间、包装设计、概念空间”等方面持续投入，不断强化了消费者对品牌的认知。这类投入短期未必能直接转化为GMV的增长，但当行业进入存量竞争，或要开辟完全陌生的海外市场，品牌资产的价值开始变得明显。</p>\n  <p>消费下行的周期中，市场总是会高估性价比品牌的市场增量，低估高价值品牌的抗压能力。实际上，消费者在选择减少时，反而会倾向为更有认同感的品牌付费。</p>\n  <p>这同样体现在霸王茶姬的全球化进程中。</p>\n  <p>今年5月，霸王茶姬在韩国连开三店，开业初期便引发排队热潮。正式进入韩国市场前，霸王茶姬App在韩国的下载量就已超过4.6万次。</p>\n  <p>这说明，霸王茶姬并不是等到门店开出来之后，才开始在当地建立消费者认知。对于一个并非最早进入韩国市场的中国茶饮品牌，品牌认知能够先于线下门店形成积累，本身就是一种更难被短期复制的能力。这种跨市场的品牌穿透力，也开始反映在海外业务数据上。</p>\n  <p>财报期内，霸王茶姬海外市场GMV达到5.04亿元，同比增长114.3%，海外GMV已连续四个季度环比提升。</p>\n  <h2>04. 尾声：什么决定长期增长？</h2>\n  <p>“越是在复杂的环境中，越要回归本质——做好产品、服务好用户、打磨好每一家门店。我们有信心在任何市场环境下实现高质量、可持续的增长。”</p>\n  <p>本季度的业绩会上，霸王茶姬创始人张俊杰如此表示。</p>\n  <p>伴随外卖大战的退潮，中国新茶饮的底色已经浮现——当整个行业陷入补贴依赖与规模焦虑，竞争终局将成为“健康增长”的质量比拼。在这样的背景下，霸王茶姬呈现出的克制与“确定性”，为整个行业展现出了另一种可能。</p>\n  <p>跻身茶饮六小龙，身处茶饮第一梯队只是入场券，之后的每一杯茶、每一款新品、每一家门店的真实表现，才是企业实现长期增长的真正价值。</p>", "category": "tech", "published_at": "2026-09-02T01:03:42+00:00", "fetched_at": "2026-09-02T02:34:28.631397+00:00", "fingerprint": "235a8f7414914a45"}, {"source": "36氪 - 最新文章", "title": "产品观察 | 前字节、大疆、腾讯团队创业，瞄准AI滑雪赛道，获厚雪投资", "url": "https://36kr.com/p/3965025284070664?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_0f58e6b203954161bebb9a9ca2e40ac9@6221844_oswg29041oswg1364oswg860_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3300</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>一群来自字节、腾讯、大疆的年轻人，决定用AI重新定义滑雪训练。</p>\n  <p>这支团队的核心成员，覆盖算法、软件、硬件和全球商业化，几乎都带过头部大厂大型项目。</p>\n  <p>创始人吴振华的经历很有代表性。他在字节待过三年，担任飞书区域业务负责人和用户增长负责人，此前还在Vika担任CMO，亲历那家公司从0到1的过程。另外三位联合创始人，软件负责人贝俊龙曾在腾讯和字节跳动担任高级产品经理；负责算法与数据的楚嘉此前是字节跳动算法工程师；负责硬件的黎元晟则曾18岁加入大疆，也曾担任Seeed Studio核心研发工程师。</p>\n  <p>但比履历更重要的，是另一个标签：他们都是滑雪爱好者。团队中六成持有国际滑雪教学认证，有人当过教练，有人甚至做过冬奥会裁判。</p>\n  <p>选择滑雪赛道创业，既源于吴振华他自己六七年滑雪经历中切身的痛点，也基于一个更底层的判断：过去的AI模型只学习互联网上的图文信息，而真实物理世界里那些摔跤、立刃、换刃的数据，从未被任何模型吸纳过。</p>\n  <p>“我不会做烧钱的事。必须要同时满足这四个象限才会去做——做热爱的事、做擅长的事，短期有清晰财务模型，长期天花板足够高。”吴振华说。</p>\n  <p>滑雪，至今仍是一项被“暗数据”支配的运动。数据藏在雪板之下，人眼看不见，自己感受不准，摄像头也难以捕捉细节。</p>\n  <p>吴振华想做的，正是把这些暗数据捕获下来，喂给AI，再反哺回训练过程。</p>\n  <p>跨南北半球的两个雪季里，Heygo团队带着数十个传感器，在零下三十度的雪场反复测试，采集了百万级真实滑行数据，试图打开这个“黑箱”。</p>\n  <p>Heygo在2025年才正式成立，先推出一款针对单板滑雪的AI硬件。团队将它定义为Motion Agent的感知入口。“这个Agent会观察你，理解你，记住你，给你反馈，并逐渐找到最适合你的进步路径。”</p>\n  <p><strong>此外，他们融资同样谨慎，目前Heygo仅完成一轮数百万美金的天使融资，由厚雪机构独家投资。</strong></p>\n  <p>从想法萌芽到产品即将预售，Heygo走过了近一年的时间。Heygo选择的路径，不是服务金字塔尖的少数运动员，而是将专业能力消费品化，让普通爱好者也能负担。</p>\n  <p>“我们的战略不是覆盖多少运动、有多少款硬件，真正的竞争力在于Heygo有多懂你，能不能给你个性化的反馈，让你更好地理解自己的边界。”吴振华称。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_81a71b376cba40d3998f9557484ac5f8@6221844_oswg4017oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>AI如何读懂滑雪？</strong></p>\n  <p>滑雪训练的反馈，既昂贵又稀缺。一节私教课动辄上千，课后却依然只能靠感觉摸索。“找10个教练，可能10个教练讲的都不一样。因为他们没有你完整的Context和Memory。”吴振华说。</p>\n  <p>滑雪是个体闭环运动——一个人完成、一个人感知、一个人纠偏，天然适合用传感器捕捉动作数据。更重要的是，滑雪极难仅靠视频实现科学量化分析，雪服臃肿、动作高速，关键变量全在视线之外。</p>\n  <p>因此Heygo团队认为，AI硬件在滑雪领域不是锦上添花，而是刚需。但把刚需转化为可靠产品，远比想象复杂。核心团队花了一年时间，集体降薪投入，只攻克一个核心难题：如何让AI真正读懂滑雪。</p>\n  <p>脚上的IMU传感器捕捉到的是脚踝动作，但经过雪靴形变、固定器传导后，最终到达雪板的状态已经偏移。几度误差都会在立刃、换刃判断中被不断放大。不同雪靴硬度、体重、雪况又让形变规律千变万化，没有固定补偿参数能通吃所有场景。</p>\n  <p>团队把这个难题概括为“鞋不等于板”，这是行业过去难以突破的核心障碍。他们的解法是拆到最底层：在模型训练阶段，于雪板上额外加装传感器，同时采集脚部和雪板的真实运动数据，让模型学习从双脚数据推算雪板运动。在量产产品上，传感器依然只有雪靴外侧那两个。</p>\n  <p>楚嘉表示：“没有一组固定的补偿参数能通吃所有雪靴、所有体重、所有雪况，只能让模型自己去学这个映射关系。\"</p>\n  <p>这个过程依赖海量真实滑行数据，不是实验室模拟，而是在零下三十度到零上几度的温差里，硬雪、粉雪、冰面等各种雪况下一次次采集。</p>\n  <p>从日本到新疆再到新西兰，团队在不同国家的雪场蹲守数月。“很多人以为难在模型训练，其实真正难的是在极端环境下拿到干净、可用、有标注的训练数据，这是笨功夫，没有任何捷径。”楚嘉说。</p>\n  <p>硬件打磨同样不易。两个夹在雪靴侧壁的传感器，需在极寒、高冲击、强静电下稳定工作，仅夹子选材和受力分析就调整了无数次。团队与高校力学实验室合作仿真，测试不同厚度雪靴壁的夹紧力平衡，最终做到IP68防水和单次充电支持一周以上滑行。在硬件支持下，目前Heygo数据精度做到3度以内，达到行业头部水平。</p>\n  <p>���雪靴壁的厚度、硬度每个品牌都不一样，夹紧力大了容易发生形变，小了会松动，这个平衡点只能靠一次次试。”黎元晟称。</p>\n  <p>有了精度，下一个问题是如何让用户感知价值。Heygo的答案是实时语音反馈，这成为他们与多数“滑后分析”工具的本质区别。</p>\n  <p>反馈分三个层次：滑行中通过蓝牙耳机给出简短提示，只在关键时刻开口，绝不打断节奏；缆车上给一段完整的复盘；一天结束后，Heygo结合全天数据生成个性化报告和下一步训练建议。</p>\n  <p>值得注意的是，频率和语气会根据用户水平动态调整。“核心原则是不要打断用户滑行，大脑能消化的信息非常有限。只在关键时候开口，讲用户能理解的东西，一句话告诉他下一步怎么做。”贝俊龙表示。</p>\n  <p>人格层面也会做区分：频繁摔跤的用户收到温柔鼓励，暴力滑行的进阶选手面对更直接的技术指正。团队把这个逻辑总结为“个体基线”，而非泛化标准。模型必须读懂新手和老手的差异。</p>\n  <p>这种深度个性化依赖庞大的后台系统。Heygo搭建了自己的数据标注平台，从采集、切分、打标到训练、验证形成闭环。每一趟滑行被切成以“弯”为单位的最小颗粒度，再拆出入弯、弯中、出弯三个阶段，对应几十项指标。</p>\n  <p>AI要像教练一样理解滑雪，前提是先把滑雪用机器能理解的方式重新定义。截至目前，Heygo已累积上百万条真实滑行数据，构建了含十五到二十项进阶指标的单板滑雪知识图谱，并与全球不同教学体系的教练持续共创校准。</p>\n  <p>“用户越多，模型越强。滑得越多，你的Heygo会越懂你。”吴振华说。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_792e1c3ea8964815964ef85dbd937027@6221844_oswg4689oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>从滑雪到个人运动智能</strong></p>\n  <p>但必须承认，从技术突破到商业验证之间，还有不小的距离。滑雪本身门槛不低，装备、雪票、时间都是成本。</p>\n  <p><strong>Heygo的千元硬件定价加上后续订阅费，相当于在已有消费之上再加一道门槛。</strong>但从内测反馈看，愿意买单的除了中高阶玩家，更多还是刚学会滑雪、想持续进步的业余爱好者。</p>\n  <p>不过，Heygo团队强调，产品定价锚点不是消费电子，而是滑雪装备消费逻辑。此外，产品软件采用订阅制，基础版随硬件附赠，深度分析和个性化计划需额外付费。</p>\n  <p>“刚入坑配齐一套最基础的装备，也要花一两万块钱。而一个能长期陪伴、持续进化的AI滑雪搭子，你觉得值多少钱？”吴振华表示。</p>\n  <p>市场策略上，团队放弃了众筹平台。吴振华是这样考虑的，“我们第一年其实没想过一上来就服务所有滑雪者。我们更希望先聚焦一群真正有进阶需求、愿意持续训练的核心用户，把产品和他们的真实滑行场景磨透。先把这群人服务好，比一开始追求更大的用户规模重要得多。”</p>\n  <p>取而代之的是独立站加国内电商，辅以全球二十余家线下雪具店的精准组合。硬氪了解到，Heygo产品预计今年九月预售、十月发货，首批覆盖38个国家和地区。</p>\n  <p>前期品牌建设走的是权威背书路线。团队与新西兰、加拿大等国滑雪协会和顶级教官建立了合作。</p>\n  <p>“滑雪这类垂直运动有个通用打法，自上而下，更高更快更强。顶级滑手用什么，大家就信什么。”团队让专业群体率先使用，再向大众圈层渗透。</p>\n  <p>这背后其实体现了一个反共识判断：滑雪市场看似小众，但用户价值极高。</p>\n  <p>目前，全球滑雪人次已接近四亿，中国市场每年超两千万人次参与，增速迅猛。这其中，有部分是每年固定上雪、愿意为进步付费的滑雪爱好者，“如果做到渗透率百分之一，就已经能撑起一家非常有质量的公司。”他们认为，滑雪用户高净值、高付费意愿、高粘性、高传播力，只是过去没有产品真正解决他们的核心需求。</p>\n  <p>从更长维度看，滑雪只是第一站。Heygo团队真正想做的，是“个人运动智能”。</p>\n  <p>滑雪、冲浪、滑板共享一部分底层逻辑：人通过板与环境作用，核心是重心、节奏、边缘控制、转向速度等。</p>\n  <p>传感器融合架构、姿态估计方法、个人模型训练与Agent交互是可迁移的，真正需重新积累的是各运动专项的知识图谱和数据资产。</p>\n  <p>但团队并不急于横向扩张。在Heygo看来，关键问题从来不是“支持多少运动”，而是能否真正理解一个人在真实世界中如何感知、行动、学习和进步。</p>\n  <p>而当这套能力真正溢出到更广泛运动场景的时候，Heygo或许会成为AI理解物理世界和人类运动逻辑的重要样本之一。</p>", "category": "tech", "published_at": "2026-09-02T01:15:30+00:00", "fetched_at": "2026-09-02T02:34:28.631388+00:00", "fingerprint": "cdb8deea5e2e187c"}, {"source": "36氪 - 最新文章", "title": "硬氪首发｜东莞人工智能研究院孵化，瞄准模具制造领域物理AI研发，这家企业获创新工场数千万种子轮融资", "url": "https://36kr.com/p/3963006194728324?f=rss", "summary": "<p>作者｜乔钰杰</p>\n  <p>编辑｜袁斯来</p>\n  <blockquote>\n   <p>本文2100字，预计阅读5分钟。</p>\n  </blockquote>\n  <p>硬氪获悉，制造物理AI公司合木人工智能科技（成都）有限公司（以下简称“合木智能”）日前完成种子轮千万级融资，投资方为创新工场。</p>\n  <p>合木智能成立于2026年5月，由东莞市新一代人工智能产业技术研究院联合模具制造企业端品精密孵化成立，是一家专注于模具物理AI、制造语义计算及落地的公司。</p>\n  <p>具体来看，合木智能希望在机械图纸深度学习的基础上，进一步学习和复刻老师傅积累的工艺经验，为模具制造企业构建AI工艺大脑，并将能力覆盖产品报价、模具设计、DFM、工艺排程、生产加工、品控检测等环节，以提升全制造流程的自动化与智能化水平。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_fbf2a9055bf64aca849e4b1adafae49f@5920579_oswg446974oswg1267oswg509_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>公司创始人徐晨是东莞市新一代人工智能产业技术研究院的创院院长，在智能制造与工业AI领域深耕15年以上。联合创始人邹䘵华则在高端精密模具领域从业近20年，是高端模具制造管理专家。&nbsp;</p>\n  <p>选择模具制造作为切入场景，与行业长期存在的“老师傅依赖”问题有关。当前，模具制造的人力成本约占整体可变成本的70%。一方面，制造业高级技术工紧缺，薪资不断上涨，进一步压缩了企业利润空间；另一方面，模具制造中的关键岗位普遍要求从业者具备3至5年以上实操经验，人才培养周期长、门槛较高，目前行业人才青黄不接。</p>\n  <p>合木智能团队从2024年开始对工业制造企业进行全方面调研摸排。徐晨告诉硬氪：“我们跑了两百多家企业，发现工厂基于核心机密的管理需求，基本不允许数据联网。很多企业根本没法直接上大模型，所以如果要做工业AI，首先必须解决计算本地化的问题，只有大小模型协同模式才是唯一落地路径。”</p>\n  <p>针对这一问题，团队历时两年整理了10万级高质量图纸数据，通过对百余位模具老师傅的经验进行挖掘，构建行业知识体系。据公司介绍，目前团队已完成基于大小模型协同的精密模具制造语义空间和计算基座的初步搭建，并已完成近10个智能体开发。其中，部分智能体已经具备相当于5年以上模具工程师的经验水平。</p>\n  <p>具体应用上，合木智能目前已将AI能力应用于工艺编程、智能报价和工艺路线规划等环节。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_0c425e6b0c6240008c69974d0bbdbe8f@5920579_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>例如，在工艺编程环节，AI可以识别零件特征，并自动选择CNC、放电、磨床等不同加工方式，在满足精度要求的同时优化加工成本。目前，该环节的处理效率已达到人工的6倍左右。在报价环节，系统可基于对制造工艺的理解反向计算成本实现精准报价，同时降低传统报价岗位的人力投入。在工艺路线规划方面，AI可以参与工序排程，根据加工条件推荐相应的加工路径，提升整体生产调度效率。</p>\n  <p>技术路径上，合木智能采用“大模型底座+小模型集群+工艺知识沉淀”的架构。其中，大模型主要负责理解场景语义和拆解任务，小模型则负责执行具体工艺。针对制造过程中出现频率较高的特征，例如孔、腔等几何特征，公司训练专用小模型以实现更高精度的工艺执行。</p>\n  <p>目前，团队已训练1600多套小模型，用于不同制造场景下的高精度任务执行；工艺知识体系则进一步对模型输出进行约束和校验，使结果能够符合实际制造条件。在这一技术架构基础上，合木智能目前已研发2D图纸纠错、PDF转CAD、2D转3D等智能体，并可在CNC、放电、线割等15类工艺中完成工艺预处理和自主编程。</p>\n  <p>商业化方面，合木智能目前主要提供FDE陪跑式AI赋能服务，以及智能体软硬件标品销售。其目标是帮助模具制造企业缩短打样流程、降低可制造性评估成本、减少换型时间，并提升规模化制造过程中的一次良率。</p>\n  <p><strong>未来，合木智能还计划围绕现有的AI大脑进一步开发硬件产品，将语义计算能力嵌入本地化设备、智能检测设备或机器人等工业载体中，逐步形成“大脑+载体”的产品销售模式。</strong></p>\n  <p>以下为硬氪与合木智能创始人徐晨交流节选：</p>\n  <p><strong>硬氪：合木智能的Uniwood大模型，与目前的工业软件有什么区别？</strong></p>\n  <p>徐晨：工业软件是辅助人类的流程操作工具，是嫁接人类与加工对象、制造设备的桥梁。但是工业软件无法理解制造原理，仍然需要老师傅学会操作，利用工具去完成工业任务。合木智能自研的Uniwood大模型，是基于物理约束驱动、机械与装配原理、拓扑与结构分析、材料性能与力学的精密模具制造语义计算系统，能够自行完成制造任务，自主进化能力。</p>\n  <p><strong>硬氪：Uniwood与当前工业Agent的构建路径有什么不同？</strong></p>\n  <p>徐晨：当前工业Agent的开发方向，更多聚焦在提升老师傅的工具操作效率，比如当前较多的用语言命令驱动零部件参数化设计，过程中加载部分固定的经验和约束，这是“辅助驾驶”的高级阶段，能够让制造大幅提效。但合木智能Uniwood致力于制造物理AI的理解，自主进化是其关键标签，基于其理解力去操控越来越强的工业软件，才能成为真正的“高效智能驾驶”。</p>\n  <p><strong>硬氪：老师傅的经验是如何提取的？大小模型之间又是如何协同的？</strong></p>\n  <p>徐晨：经过长期驻厂研究，我们在精密模具制造领域初步完成了token计算的闭环，老师傅是用思维链去驱动一项目标任务，只要能准确分解其思维链变成标准SOP，就能够分段用算法去表征经验。在实际运行中，Uniwood大模型理解场景语义后调度数千套专家小模型去反复适配场景，完成对确定性制造目标的逼近。目前在Uniwood基础上自研的小龙虾在5-8轮自进化后，在部分关键工艺识读提升准确率可达到95%以上，完全媲美老师傅的能力。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-09-02T02:13:20+00:00", "fetched_at": "2026-09-02T02:34:28.631372+00:00", "fingerprint": "6dc1e992e598950f"}, {"source": "少数派", "title": "线索若隐若现：深入 Tim Cook 和 Nike 的商业连接", "url": "https://sspai.com/post/111081", "summary": "一直以来，Apple 和 Nike 之间的商业关系在公众视野里简单明了。但在两者中间，Apple 的前任 CEO Tim Cook 一直扮演着连接者的角色，他和 Nike 之间的关系也因此而显得十分微妙。在本期节目中，我们就来一起深入 Apple、Nike 和 Tim Cook 之间的商业三角关系。<a href=\"https://sspai.com/post/111081\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-01T03:00:00+00:00", "fetched_at": "2026-09-02T02:34:27.243115+00:00", "fingerprint": "57d6e861d44a7e49"}, {"source": "少数派", "title": "开学季｜值得关注的官翻渠道汇总（2026）", "url": "https://sspai.com/post/114062", "summary": "不管你是大学新生想要购置数码产品，还是即将踏入职场的毕业生租房想要添置小家电，在处于身份和环境转换的新阶段里，都可以试着把钱用在刀刃上、选择性价比更高的产品和销售渠道。<a href=\"https://sspai.com/post/114062\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-01T07:00:00+00:00", "fetched_at": "2026-09-02T02:34:27.243109+00:00", "fingerprint": "03c712e596de14a9"}, {"source": "少数派", "title": "线下活动 | 全新 iPhone 发布在即，来与少数派一起看 Apple 发布会", "url": "https://sspai.com/post/114071", "summary": "北京时间9月10日凌晨，Apple一年一度的秋季特别活动即将拉开帷幕，我们会在Keynote讲演环节中见到新一年度的iPhone、AppleWatch等多个新品。除了备受期待的iPhone18Pro系 ...<a href=\"https://sspai.com/post/114071\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-01T07:18:43+00:00", "fetched_at": "2026-09-02T02:34:27.243102+00:00", "fingerprint": "5f4312fb18abccf0"}, {"source": "少数派", "title": "社区速递 156 | 满血全功能磁吸转换头与手机 AI 通话的真实体验", "url": "https://sspai.com/post/114078", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/114078\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-09-01T09:00:00+00:00", "fetched_at": "2026-09-02T02:34:27.243095+00:00", "fingerprint": "0a9f26f3931d5b07"}, {"source": "少数派", "title" mpressive 10,000:1 native contrast, according to JMGO. It boosts the contrast - always an issue with projectors - by placing two separate physical apertures (irises) along [&#8230;]", "category": "tech", "published_at": "2026-08-31T22:00:00+00:00", "fetched_at": "2026-09-01T03:16:16.437246+00:00", "fingerprint": "79bb64d61f007173"}, {"source": "The Verge", "title": "The Google TV Streamer now costs $50 more", "url": "https://www.theverge.com/tech/987032/google-tv-streamer-price-increase", "summary": "Google raised the price of its 4K streaming box to $149, up $50 from its original $99 price. The new price is currently live at the Google Store and Best Buy, but Amazon appears to still be offering the original price. The price hike comes just a couple of weeks after Google launched its new [&#8230;]", "category": "tech", "published_at": "2026-08-31T22:32:51+00:00", "fetched_at": "2026-09-01T03:16:16.437235+00:00", "fingerprint": "c61ab77f95204a2a"}, {"source": "36氪 - 最新文章", "title": "最前线｜本地大模型 StartLux-27B 通过 MCP-Universe 测评：综合第二，多项专项第一", "url": "https://36kr.com/p/3963345222147335?f=rss", "summary": "<p>近日，工信部中国信息通信研究院（以下简称“中国信通院”）人工智能研究所公布的一份检验报告显示，上海原点星辉科学技术有限公司（下简称StartLux）研发的本地大模型 StartLux-V1.0-27B-Preview，在可信AI大模型基准测试——MCP专项测试中，以 27B 参数量取得综合性能排名第二的成绩，高于第三名的DeepSeek-V4-Flash，能力范围已经进入DeepSeek-V4-Pro所代表的万亿参数模型能力区间。</p>\n  <p>可信AI大模型基准测试——MCP 专项测试涵盖位置导航、网页搜索、浏览器自动化、金融分析、代码仓库管理、3D 设计 6 类专项任务及综合评估，共 7 项检验项目，重点考察大模型在多工具协同、复杂任务执行及真实环境交互等方面的综合表现，该专项测试部分指标和数据参考了开源项目MCP-Universe。</p>\n  <p>参测模型包括 DeepSeek-V4-Pro（1.6T）、DeepSeek-V4-Flash-0731（284B）、Step-3.7-Flash（198B）、StartLux-27B-260715（27B）、Qwen-3.6-27B（27B）和 AgentCPM-Explore（4B）。</p>\n  <p>结果显示，StartLux-V1.0-27B-Preview综合得分为39.25，排名第二，超过 284B 的 DeepSeek-V4-Flash-0731 和 198B 的 Step-3.7-Flash。在同等参数规模下，StartLux-V1.0-27B-Preview较 Qwen-3.6-27B 高出 5.34 百分点。单项任务中更突出：位置导航排名第一，浏览器自动化、金融分析等任务也与1.6T参数的 DeepSeek-V4-Pro 并列第一或独占第一。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_19b7e101128d404fa374b8805ed64017@10269314_oswg292777oswg1646oswg1470_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">测试结果</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_e0d9aeb8b1b64586bb58f126f6110484@10269314_oswg612912oswg1646oswg1263_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">测试结果</p>\n  <p>StartLux 以 Qwen3.6-27B 为基座做后训练定向增强，把一个 27B 的本地模型，推到与 1.6T 旗舰同级的位置，靠的是StartLux 团队自主设计的一个全新、多维度、可验证、可规模化的模型优化升级技术。</p>\n  <p>模型训练的过程中，团队采用AI 训练 AI（Auto Research）的方法，自主开展训练实验，并通过反馈持续优化训练策略。该方法代表了当前全球模型研发的前沿方向。StartLux-V1.0-27B-Preview是国内首个采用该方法进行后训练的本地 Agent 模型。</p>\n  <p>在全球范围内，本地模型正在逐渐进入行业视野。</p>\n  <p>Google于4月推出了Gemma 4系列，其中31B Dense版本在开源模型排行榜排名第三，量化后可在消费级显卡上本地运行。8月初，Meta 发布 30B 本地模型 Muse Glimmer 并开源。NVIDIA也于8月推出了开源模型Nemotron 3.5 Lightning，这是一款30B参数的MoE模型，可直接在RTX PC等本地设备上运行。</p>\n  <p>盛大网络创始人、语生科学董事长陈大年近期预测，本地本地模型将在3年内占据80%的大模型市场。量子与AI软件公司Multiverse Computing联合创始人兼首席科学官Roman Orús也曾表示，行业正进入一个本地大语言模型将成为云端服务真正竞争对手的时期。</p>\n  <p>目前，StartLux-V1.0-27B-Preview可在消费级个人电脑上运行。据了解，StartLux 计划于年内推出第一代本地智能解决方案，与此同时，StartLux团队正在稳步推进模型训练的脚步，也正对扩散式语言模型等新架构进行深入研究和优化。</p>", "category": "tech", "published_at": "2026-08-31T11:23:32+00:00", "fetched_at": "2026-09-01T03:16:16.281273+00:00", "fingerprint": "73473bf4e1bdaeb3"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨片仔癀市值蒸发超2100亿；苹果换帅，特努斯接替库克任苹果CEO；Anthropic签署由英伟达支持的350亿美元云计算协议", "url": "https://36kr.com/p/3964101092236803?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>AI客服“转人工”难？“新国标”来了</p>\n  <p>消息称字节上调豆包股价格至17.02美元</p>\n  <p>AI公司每赚100美元近40美元流向云巨头亚马逊、微软、谷歌</p>\n  <p>小红书内测“发日常”新功能，可设“三天可见”</p>\n  <p>中国成功建立地月双向高速激光通信，月球传回照片仅用12秒</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>片仔癀市值蒸发超2100亿&nbsp;</strong></p>\n  <p>有“药茅”之称的老牌中药龙头片仔癀（600436.SH）业绩持续承压。8月31日开盘，片仔癀股价下跌，截至收盘，片仔癀报<strong>122.13元</strong>，下跌4.06%，总市值约737亿元。作为对比，其巅峰时期的市值超2900亿元。根据片仔癀8月28日披露的半年报，公司上半年实现营业收入45.73亿元，同比下降14.98%；归属于上市公司股东的净利润10.93亿元，同比下降24.22%。据了解，片仔癀公司的主要业务分为医药制造业、医药流通业及化妆品业等。在医药制造业板块，公司以“片仔癀”为主产品，拥有锭剂及胶囊剂两种剂型，具有相同的成分及功能主治。片仔癀源于明朝末年，拥有近500年传承历史，是国家级中药保护品种，处方和工艺受国家秘密保护。（界面新闻）</p>\n  <p><strong>苹果9月1日正式换帅，特努斯接任CEO</strong></p>\n  <p>苹果将于当地时间9月1日完成CEO交接：现任硬件工程高级副总裁约翰・特努斯（John Ternus）接替蒂姆・库克（Tim Cook），后者转任董事会执行主席，并继续负责与全球政策制定者沟通等事务。特努斯上任后的首要任务包括主持9月9日举行的苹果秋季新品发布会，今年新品包括首款折叠屏iPhone、可识别说话者并按用户调整内容的智能显示器。同时他还负责监督一些更远的产品线，包括带摄像头的AirPods、智能眼镜、家庭安防系统、机械臂显示器和可佩戴摄像头等。这些设备对于苹果在人工智能时代延续其数十年的成功至关重要。（财联社）</p>\n  <p><strong>英伟达现身各个环节，Anthropic与Lambda签350亿美元云协议</strong></p>\n  <p>金十数据9月1日讯，据华尔街日报援引知情人士透露，Anthropic已与英伟达支持的云计算提供商Lambda签署了一份价值350亿美元的云计算协议，而英伟达本身持有数据中心的租约。知情人士称，英伟达几周前与Hut 8签署了一项协议，以确保获得该数据中心的算力容量。这一复杂的安排再次凸显了英伟达在帮助Anthropic等非投资级企业获取其昂贵计算资源方面日益重要的作用。该交易还帮助新兴云提供商Lambda在不需自行采购数据中心空间的情况下，与Anthropic签订了一份利润丰厚的合同。Lambda将使用Hut 8正在开发的数据中心，接入从英伟达购买的芯片——英伟达同时也是Lambda的投资者。目前尚不清楚Lambda需向英伟达支付多少费用才能使用该数据中心空间。Anthropic在今年早些时候遭遇算力供应瓶颈，此后便一直在竞相签署云容量协议。(金十数据APP)</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI等实验室购买数万台Mac用于智能体训练</strong></p>\n  <p>据报道，OpenAI等一些人工智能实验室已经购买了数万台Mac mini和Mac Studio，用于人工智能强化学习。OpenAI正在使用这些Mac来训练AI智能体，并且急需更多此类设备。另据知情人士透露，Anthropic也从亚马逊AWS租用Mac mini，一些初创公司甚至正在构建仅限Mac的云服务，以应对未来苹果硬件需求激增的情况。（财联社）</p>\n  <p><strong>Claude遭大规模盗号，大批用户被强制注销&nbsp;</strong></p>\n  <p>8月31日消息，Anthropic突发大规模账号安全事件，大批Claude用户被强制注销。就在这两天，大批Claude用户发现：没有任何封号预警，自己的账号忽然就被强制下线了。甚至，连后台绑定的Visa、Mastercard等付款方式，都被官方紧急清空。官方建议：若额度无故恢复又迅速耗尽，即为中招迹象。受害用户多因下载破解软件感染木马。有用户用Claude Opus 5逆向查杀病毒成功，但专家仍建议重装系统。黑产已转向“偷算力”，务必警惕不明文件，及时撤销活跃会话。（新智元）</p>\n  <p><strong>千问创作上线Agent Teams，覆盖专业视频制作场景</strong></p>\n  <p>36氪获悉，8月31日，千问创作推出Agent Teams功能，接入Wan3.0，已面向全部用户开放。该功能将多Agent协同机制引入至专业视频创作的全流程，用户只需提出创作想法，即可召集不同分工的专家Agent协作完成视频创作。目前，Agent Teams已在千问创作PC端和千问App上线，用户可跨设备随时随地进行创作。</p>\n  <p><strong>腾讯混元：Hy4 preview调用激增，WorkBuddy已紧急扩容</strong></p>\n  <p>36氪获悉，腾讯混元称，自2026年8月28日混元Hy4 preview在WorkBuddy首发接入以来，凭借其Agent能力的显著提升，受到了广大用户与开发者的积极体验和热情反馈，上线首日即在WorkBuddy任务队列中出现排队情况，对此深表歉意。为保障大家的使用体验，公司已针对Hy4 preview推理集群进行紧急扩容，并将持续动态调配资源。但受限于高端算力总量与高峰并发集中，仍不排除个别时段会继续出现排队情况。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>AI客服“转人工”难？“新国标”来了&nbsp;</strong></p>\n  <p>9月1日起，中国首个聚焦人工客服与智能客服协同机制的国家标准《顾客联络服务人工与智能客户服务协同要求》将正式实施。针对“转人工”入口层层隐藏、体验不佳等情况，标准提出，智能客服与人工客服切换“需提供便捷入口并保障衔接顺畅”，切换后要“同步客户信息且不重复询问”。标准明确AI客服的“虚假承诺”问题，普通问答和产品介绍可由AI自动回复，但应保留显著AI生成标识和风险提示，一旦涉及价格、折扣、退款、赔偿、合同变更等事项，AI可以解释规则、收集材料、生成工单，最终确认应当由人工客服或规范化流程完成。（人民日报海外版）</p>\n  <p><strong>科大讯飞公关副总裁韩煜尘被解除职务，此前被内部举报&nbsp;</strong></p>\n  <p>一份由科大讯飞内部人士证实的人事调整通知显示，科大讯飞于2026年8月31日解除韩煜尘科大讯飞品牌市场中心副总经理职务；相关职责由品牌市场中心总经理吴骏华兼任。据悉，这份落款为科大讯飞“组织发展与人力资源部”通知文号为：讯组人〔2026〕173号，发布时间为：成文日期2026年8月31日。上述通知显示：经公司研究决定，对品牌市场中心进行人事调整，解除韩煜尘品牌市场中心副总经理职务；相关职责由品牌市场中心总经理吴骏华兼任。</p>\n  <p>据媒体报道指出，韩煜尘此前为科大讯飞集团公关副总裁，于2018年底加入该公司并负责组建集团公关部，在公众传播及危机公关领域拥有超过十年的从业经验。他曾在阿里巴巴、360等企业担任市场公关及公关总监职务。而此次韩煜尘解职或与此前科大讯飞内部举报有关，此前网上流出的举报文件显示，有名为“朱倩”的科大讯飞女性员工配偶进行实名举报。（网易财经）</p>\n  <p><strong>君乐宝回应纯牛奶样本在港检出菌落数超标&nbsp;</strong></p>\n  <p>8月26日，香港食安中心通报一批次君乐宝常温纯牛奶检测情况，检出样本菌落计数超出香港《奶业规例》标准。香港食安中心发言人同时指出，菌落计数超出法例标准显示产品卫生情况欠理想，但并不表示会引致食物中毒。目前，该批次产品已全部封存于香港进口商仓库，未流入市场，未对任何消费者造成影响。8月31日，君乐宝乳业集团股份有限公司就香港食物环境卫生署食物安全中心抽检一批次1升纸盒装UHT常温纯牛奶一事发布情况说明，说明显示，指标异常系在香港仓库装卸搬运过程中操作不当造成部分产品破损而导致。（界面新闻）</p>\n  <p><strong>宇树科技股价接近“腰斩”&nbsp;</strong></p>\n  <p>截至8月31日收盘，近期备受关注的宇树科技收报564.90元/股，跌幅3.44%，相比于上市首日开盘价1100元/股，股价接近“腰斩”。（第一财经）</p>\n  <p><strong>三文鱼切片大肠菌群超标4倍多，沃尔玛道歉&nbsp;</strong></p>\n  <p>日前，国家市场监管总局发布的食品抽检不合格情况通报显示，有1批次沃尔玛旗下自有品牌“沃集鲜”的三文鱼切片被检出大肠菌群数超标。沃尔玛回应表示：“对于5月抽检中广州地区单批次三文鱼产品出现结果异常，我们深表歉意。在收到抽检结果后，我们联动供应商，积极配合监管部门调查指导，开展全面核查。经核查，该产品的生产设备、加工环境、工艺环节未现异常，7月再次配合监管抽检结果合格。目前在售三文鱼产品均符合国家食品安全标准。”（东方网）</p>\n  <p><strong>星宇前员工曝海外工厂差异，中方日均工作10小时&nbsp;</strong></p>\n  <p>据凤凰网科技报道，近日在对星宇股份员工情况的调查中了解到，星宇股份塞尔维亚海外工厂在中外员工工作安排上存在明显差异。前员工林喆向凤凰网科技表示，当地塞尔维亚员工通常按照当地劳动法规执行朝九晚五、到点下班的工作制度，而从国内前往支援的中方工作人员日均工作时长约为10小时。这意味着，在同一海外工厂内，中方支援人员与当地员工在实际工作时长和加班安排上存在较大差异。（凤凰网科技）</p>\n  <p><strong>特斯拉推出平价版Model3，中国香港起售价20.5万港元&nbsp;</strong></p>\n  <p>近日，特斯拉已正式在中国香港、中国澳门市场推出配置简化、售价更低的Model 3车型版本。特斯拉官网显示，该款车型在中国香港的起售价为20.5万港元（约合人民币17.59万元），在中国澳门的起售价为25.2万澳门元（约合人民币20.98万元）。（界面新闻）</p>\n  <p><strong>AI公司每赚100美元近40美元流向云巨头亚马逊、微软、谷歌</strong></p>\n  <p>8月30日，据多家外媒报道，英国巴克莱银行日前在一份有关AI行业的研究报告中指出，AI模型公司每获得100美元收入，其中约有35至40美元会以推理算力费用的形式流向三大云巨头，即亚马逊云科技公司、微软旗下Azure云服务平台和谷歌云平台。云服务商从中能够获得约10至20美元的营业利润，对应高达35%至45%的营业利润率。与此同时，AI实验室付费推理业务的利润率已经大幅攀升，从2025年的低双位数水平升至2026年的50%至65%甚至更高，调整后毛利率同比提升30至50个百分点。巴克莱分析师认为，实际利润率或高于报告中的估算，但随着前沿模型竞争加剧以及算力供给持续增加，利润率预计将逐步回落。（央视财经）</p>\n  <p><strong>小米18Fold成小米首款破万起售手机</strong></p>\n  <p>36氪独家获悉，小米已向全渠道头部经销商明确：小米18Fold全版本售价均将超万元，起售版本定价在12000元左右。此次小米18Fold作为小米新折叠形态的首款产品，定位小米手机产品线最高端机型，将会汇集内部包括小米玄戒O3在内的小米集团全部硬核技术、外部包括LPDDR6在内的周边配置。得益于小米玄戒系列芯片的发布，当前小米18Fold定金预定量大幅超越预期，远超往年历代小米折叠屏前期预定量。</p>\n  <p><strong>知情人士回应追觅起诉小红书：案子早已撤诉</strong></p>\n  <p>8月31日，针对有媒体报道追觅科技起诉小红书一案即将开庭审理，知情人士表示，案子早就撤诉了，也不存在开庭。据法院开庭信息显示，因名誉权纠纷，追觅科技（苏州）有限公司起诉行吟信息科技（上海）有限公司（小红书国内核心运营主体公司），该案将于9月8日在上海市黄浦区人民法院开庭。据接近小红书的法律人士表示，该诉讼源自追觅要求平台配合披露一“自媒体”用户的真实身份信息。追觅认为该用户涉嫌侵权，起诉平台属于网络侵权纠纷里常见的“披露身份”法定程序。据了解��该账号于去年11月发布了一篇关于追觅组织架构调整的内容。（澎湃新闻）</p>\n  <p><strong>消息称字节上调豆包股价格至17.02美元</strong></p>\n  <p>有消息称，字节近期召开豆包股说明会，对豆包股相关员工出台新政，包括上调豆包股价格，从6月的14.85美元/股调整至17.02美元/股，涨幅约14.6%。消息还提到，字节增加豆包股的发放，每人情况不同，部分员工可达总包的5%左右。员工可选择调整豆包股比例，把总包中的现金换成豆包股，每人受职级等因素影响满配比例不同，比例包括20%、30%等档位。豆包股的兑换方面，每人额度不同，比如部分L2、L3员工可选的豆包股满配比例是20%；部分L3、L4员工满配比例则是25%、30%。（新浪科技）</p>\n  <p><strong>礼来将以最高28.75亿美元现金收购Merida Biosciences</strong></p>\n  <p>8月31日，礼来公司宣布达成一项最终协议，将收购美国生物技术公司Merida Biosciences，交易总价最高可达28.75亿美元现金，其中包括前期付款及潜在的里程碑付款。该笔交易预计将于2026年第四季度完成。（界面新闻）</p>\n  <p><strong>小红书内测“发日常”功能：可设“三天可见”</strong></p>\n  <p>小红书内测“发日常”功能，可同微信朋友圈一样实现“3天可见”，还能与小红书其他笔记分开，在用户主页独立展示，并能够随时转化为笔记。（新浪科技）</p>\n  <p><strong>中国成功建立地月双向高速激光通信，月球传回照片仅用12秒&nbsp;</strong></p>\n  <p>过去，从月球轨道上的卫星传输一幅8K月面高清图像回到地面，需要使用微波链路，用时大概4到5分钟，而利用激光通信，仅需约12秒。日前，中国在地月激光通信试验任务中取得重要突破，成功在超过40万公里的地月距离上建立起双向激光链路，首次实现地月双向高速激光通信。这标志着中国空间激光通信正式从近地轨道迈入地月空间。将为中国载人登月、月球科研站建设和深空探测提供重要技术支撑。（中国青年网）</p>\n  <p><strong>美股三大指数指集体收跌，热门中概股普跌</strong></p>\n  <p>36氪获悉，8月31日收盘，美股三大指数指集体下跌，纳指跌0.12%，标普500跌0.33%，道指跌0.7%。大型科技股多数下跌，亚马逊、谷歌跌超2%，微软跌超1%，Meta、苹果小幅下跌;特斯拉涨超5%，英伟达涨超1%;热门中概股普跌，阿里巴巴跌超4%，蔚来跌超3%，哔哩哔哩、微博跌超2%，拼多多、百度、京东、小鹏集团、理想汽车跌超1%。</p>\n  <p><strong>SK海力士考虑将部分HBM基础裸片交由英特尔生产</strong></p>\n  <p>SK海力士正考虑将部分HBM基础裸片（Base Die）交由英特尔生产，借此减少对台积电晶圆代工的依赖，该计划预计将从第七代HBM芯片HBM4E开始。分析指出，对于HBM4而言，台积电的基础裸片价格比SK海力士采用其10nm级第五代工艺生产的核心芯片高出3到4倍。预计成本负担在向HBM4E过渡时还会进一步增加。鉴于HBM的长期供货合同（LTA）比例很高，公司很难立即将代工成本的增加转嫁到产品价格上，故需建立多供应商体系从而提高价格谈判能力。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>燧原科技科创板IPO发行价格定为142.18元/股</strong></p>\n  <p>36氪获悉，燧原科技披露，公司首次公开发行股票并在科创板上市，发行价格为142.18元/股，发行数量4303.5173万股，预计募集资金总额61.19亿元。网上网下申购日为2026年9月2日。</p>\n  <p><strong>正泰电器递表港交所，开启国际化新征程</strong></p>\n  <p>8月28日，正泰电器正式递表港交所，拟“A+H”上市，搭建双资本平台，开启国际化新征程。据了解，正泰电器2026年上半年实现营业收入380.64亿元，同比增长28.46%。此次赴港上市旨在满足业务发展需要，深入推进国际化战略，积极借助国际资本市场拓宽多元融资渠道，进一步提升公司综合竞争力。此举将为公司在全球化市场拓展、国际品牌影响力提升等方面提供有力支撑。</p>\n  <h2>投融资</h2>\n  <p><strong>“恒星力量”完成Pre-A轮融资，国开科创独家领投</strong></p>\n  <p>36氪获悉，恒星力量宣布完成Pre-A轮融资，由国家开发银行旗下股权投资平台国开科创独家领投，上海未来产业基金、新鼎资本、长石资本、BV百度风投、沄柏资本、明裕创投、元石基金跟投，凯辉基金、厚雪资本等老股东持续追投。本轮融资将主要用于扩充航天工程团队、创新太空光伏工程、布局太空电力上下游。</p>\n  <p><strong>“先博生物”完成近4亿元B轮融资</strong></p>\n  <p>36氪获悉，“先博生物”宣布完成近4亿元人民币B轮融资。本轮融资由孚腾资本、千骥资本、浦东创投共同领投，张科禾润、元禾控股跟投，老股东优山资本追加投资。募集资金将主要用于加速通用型CAR-NK核心管线SNC103的确证性临床研究，并推动体内CAR-T（in vivo CAR-T）平台SNC116的注册临床开发。</p>\n  <p><strong>英伟达投资联发科</strong></p>\n  <p>根据本次交易协议，英伟达与联发科将展开合作，共同开发面向消费级个人电脑的下一代英伟达Spark系列芯片。英伟达表示，已斥资35亿美元认购中国台湾芯片厂商联发科发行的可转换债券，这是两家企业深化合作的最新信号。联发科将正式代工生产英伟达NVLinkFusion芯片小芯片、交换芯片以及定制内存，这套硬件可以把非英伟达的GPU、CPU以及其他专用芯片互相连接:起来。(新浪财经)</p>\n  <h2>大公司财报</h2>\n  <p><strong>华为投资控股有限公司上半年营收4678亿元，净利润234.27亿元</strong></p>\n  <p>36氪获悉，华为投资控股有限公司披露2026年半年度报告，报告显示，公司上半年营收4678亿元，上年同期为4270亿元；净利润234.27亿元，上年同期为370.5亿元。</p>\n  <p><strong>香港交易所：上半财年净利润105.68亿港元，同比增长24%</strong></p>\n  <p>36氪获悉，香港交易所公告，2026年上半年实现收益167.02亿港元，同比增长19%；归母净利润为105.68亿港元，同比增长24%。</p>\n  <p><strong>智谱：上半年营收9.54亿元，同比增长399.7%</strong></p>\n  <p>36氪获悉，智谱发布2026年半年报，2026年上半年，公司实现营收9.54亿元，同比增长399.7%；经调整期内净亏损19.64亿元。上半年，智谱开放平台及API业务收入约8.25亿元，同比增长2735.7%。</p>\n  <p><strong>Momenta：上半年营收16亿元，同比增长76%</strong></p>\n  <p>36氪获悉，Momenta发布2026年上半年财报，财报显示，公司上半年营收16.0亿元，同比增长76%；剔除以股份为基础的薪酬开支后，毛利润12.1亿元，同比增长75%，毛利率75%。目前，搭载Momenta系统的量产车辆规模已超110万台，已成功交付超110款量产车型，累计定点车型数超230款。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事件。</strong>3000块一针的尸皮抗衰针，韩国人是咋想的？</p>\n  <p><strong>整理</strong>｜李琪&nbsp;</p>", "category": "tech", "published_at": "2026-09-01T00:14:51+00:00", "fetched_at": "2026-09-01T03:16:16.281267+00:00", "fingerprint": "2b989ba2a3090907"}, {"source": "36氪 - 最新文章", "title": "金沙江领投数千万元，国内首个千比特量子算力平台已服务大湾区量子中心丨36氪首发", "url": "https://36kr.com/p/3963450689953285?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260831/v2_ebee8c99f7a54af1a12c2ab4e297ceb5@6221844_oswg1420002oswg2277oswg1388_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2700</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，熵函数（深圳）科技有限公司（下称“熵函数”）近日成功完成数千万元天使轮融资。本轮融资由金沙江创投领投，沃赋创投、水木、海纳无限、零以创投等机构跟投。融资资金将主要用于量子算力运营平台核心能力建设、人才引进，加速落地工业级量子算力，提升对科研机构与产业用户的服务能力。</p>\n  <p>熵函数公司创立于2023年，专注于向科研及产业客户提供大规模体系下的量子计算和量子模拟解决方案。公司由马国强和顾正澄联合创立。马国强为南京大学物理博士，曾三次创业，两家公司被A股收购，一家被纳斯达克收购，获国家科技进步二等奖。顾正澄为香港中文大学教授，研究方向为量子多体物理，发表论文70余篇。两人分工明确：马国强负责商业化，顾正澄主导技术研发。</p>\n  <p>目前，量子计算正从实验室走向产业化的前夜，但一个尴尬的现实是：产业端的需求已经开始释放，可商业化、大规模、稳定输出的量子算力却几乎处于空白状态。</p>\n  <p>量子硬件的瓶颈短期内难以突破，稳定可用的逻辑比特数量仍是个位数或小几十个。而产业端真正需要的，是千比特级别的算力，在高温超导、核聚变储能材料、高熵合金、固态电池界面等先进材料方向，许多关键机理的求解都依赖这一尺度。</p>\n  <p>熵函数的策略是“模拟先行、硬件并网、融合协同”。在量子硬件成熟前先用张量网络提供可用的商用量子算力，待硬件逐步迭代后再无缝接入，形成“经典算力+量子模拟+真实量子硬件”的融合算力体系。这一路线将量子计算产业化的时间点大幅提前。</p>\n  <p>与传统量子计算公司扎堆硬件研发不同，熵函数的思路是“不做硬件，做软件”——用张量网络算法在CPU/GPU集群上模拟出量子计算的能力。</p>\n  <p>张量网络是什么？通俗来说，它是量子态的“高效翻译官”——能从混乱复杂的量子系统中精准提取有效信息、过滤无效噪声，优化量子态的表征效率。</p>\n  <p>目前，熵函数是业内第一家推出二维量子体系张量网络求解器的团队。此前，张量网络求解器大多针对一维系统，而要模拟量子计算机（其内部本身就是一个二维量子体系），必须突破这一限制。在此基础上，熵函数今年进一步实现了张量网络驱动通用量子线路的能力，使其与量子计算机在功能上完全等价。</p>\n  <p>具体来看，公司研发的Entropec量子计算引擎，无需专用量子硬件，通过经典超算集群即可实现上千量子比特规模、中度纠缠体系下百层以内量子线路的量子模拟计算任务，相对误差优于1e-5，在计算规模、准确度以及量子线路深度上具备明显优势，可推动量子计算在量子计算机制造、药物分子、超导材料、电池界面、高熵合金等面向量子效应的前沿研发场景快速落地。</p>\n  <p>8月3日，在第五届CCF量子计算大会上，粤港澳大湾区（广东）量子科学中心、国家超级计算深圳中心与熵函数联合发布了Entropec量子计算算力平台。据透露，Entropec平台将于2026年10月全面开放商业运营。</p>\n  <p>该平台依托国家超级计算深圳中心“灵晟”超算系统，部署工业级张量网络引擎，在经典超算集群上稳定输出千比特规模的量子模拟与量子线路计算能力，无需依赖任何量子硬件。这是国内首次将量子算力推至这一量级。</p>\n  <p>据马国强介绍，熵函数的商业化路径分两步走：当前阶段以软件方式服务头部量子科研机构（如大湾区量子中心、清华大学、港大、港科大等），客户在其引擎上开发上层算法。今年预计落地约3000万元订单。</p>\n  <p>但软件销售并非终极模式。真正的闭环在于构建量子算法社区。科研机构在引擎上开发的算法回流至社区，待生态成熟后，再以云端算力形式向药物分子、先进材料等工业企业开放。平台提供标准化接口，开发者贡献算法并参与分成，用户按算力消耗付费，复合毛利预计达80%以上。</p>\n  <p><strong>以下是硬氪与熵函数创始人马国强的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：外界有一种看法，张量网络只是量子硬件成熟前的“临时方案”，你认同吗？</strong></p>\n  <p><strong>马国强：</strong>这是一个常见的误解。张量网络和量子计算机解决的是同一个问题。复杂量子体系的计算。两者的优缺点是天然互补的。张量网络可以做大规模（1000个逻辑比特甚至更多），但只能处理中等强度的量子纠缠；量子硬件可以做很强的纠缠，但规模上不去。</p>\n  <p>所以这不是谁替代谁的关系，而是融合计算的关系。在绝大多数计算任务里，长程强纠缠只发生在局部区域，不会遍布整个系统。大规模、低纠缠的部分交给张量网络，高纠缠的局部摘出来给量子硬件去算。反过来说，张量网络是量子硬件的“力量倍增器”。这个路线永远不会被淘汰。即使硬件能制备出1万个逻辑比特，张量网络就能去处理10万个逻辑比特的任务。</p>\n  <p><strong>硬氪：现阶段量子计算行业整体规模还不大，作为一家算力供应商，你们怎么看待市场需求？</strong></p>\n  <p><strong>马国强：</strong>到今天为止，量子计算的算力几乎是没有市场的。不是因为没需求，是因为一直没有供应。以前大家怎么解决？靠实验，药物筛选做好几年，材料也是一样。我们真正提供的价值，是让他们从实验驱动转为计算驱动，不光效率提升，还能到更本质的层面去发现规律。</p>\n  <p>所以我们相当于是第一波尝试把这件事做起来的人。当然这个行业现在都不完美，包括我们也有很多问题。但从部分场景、部分能力上，我们可以提供计算驱动的初级状态。整个行业要繁荣起来，一定是算力供应和下游算法相互促进。我先有初始算力，下游就有算法出来，算法反过来刺激算力优化，再催生更多更好的算法，两个飞轮慢慢往上走。但今天这个循环还没有形成，大家都还停留在实验驱动的阶段。</p>\n  <p><strong>硬氪：目前量子硬件还没成熟，你们怎么考虑后续“并网”的问题？</strong></p>\n  <p><strong>马国强：</strong>这确实是关键问题。市面上大多数量子计算机企业做的硬件，可能很难直接跟我们做融合计算。所以我们也在和一些硬件厂商谈，甚至考虑投资一部分。</p>\n  <p>但我们的思路是：不要求对方造一台通用量子计算机出来。跟我并网的时候，我只需要它的量子纠缠处理能力，不要求规模做得很大。规模大的问题通过张量网络解决，长程强纠缠的问题通过硬件解决。所以硬件的技术指标和技术路线，并不需要按照“通用计算”的标准来要求。</p>\n  <p>我们的目标是一年以内就有硬件可以并网，而不是等三五年。先造一台能跟我配合的“协处理器”出来，不要去一上来就追求通用计算。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>上海沃赋启能创业投资合伙企业（有限合伙）（沃赋启能）表示：</strong>量子领域的投资非常火热，但商业逻辑的闭环与变现难度让这个赛道的投资比以往其他领域更难。在可预见的未来，量子硬件领域大概率多路线并行，与之配套的软件算法会比硬件更早得到应用的闭环，也会更早实现商业化。熵函数用张量网络来实现量子的多体模拟是一个非常取巧的行为，并且科学家和连续成功创业者的结合让我们非常看好熵函数的后续发展路径。叠加与粤港澳大湾区（广东）量子科学中心、国家超级计算深圳中心联合推出的千比特规模Entropec量子计算算力平台，相信熵函数会后发先至，迅速成为量子领域一颗闪耀的新星。</p>", "category": "tech", "published_at": "2026-09-01T01:00:00+00:00", "fetched_at": "2026-09-01T03:16:16.281261+00:00", "fingerprint": "4e4dfa6a659db6e8"}, {"source": "36氪 - 最新文章", "title": "万千气象北京行启动：探访首都博物馆", "url": "https://36kr.com/p/3964199766253065?f=rss", "summary": "<p><strong>作者丨刘孜妍</strong></p>\n  <p>8月31日下午，来自财经、文旅、科普等领域的25位网络名人齐聚首都博物馆。由中央网信办网络社会工作局、北京市委网信办主办，新京报贝壳财经承办的“中国式现代化的万千气象”网络名人北京行活动在这里启动。活动首站，网络名人走进首都博物馆展厅，参观“玉米·黄金·美洲豹——玛雅与安第斯古代文明大展”。</p>\n  <p>本次展览汇聚来自墨西哥、秘鲁两国约800件馆藏精品，网络名人依次参观“玛雅的世界”“王的宝藏”和“大自然的精灵”三个展区。饰有祭司和鸟类的彩绘陶盘、太阳纹金圆盘、“豹人”面具等丰富藏品映入眼帘，诉说着玛雅与安第斯文明跨越千年的往事。展厅内，网络名人纷纷举起相机，快门声此起彼伏。</p>\n  <p>在玛雅人眼中，玉米不仅仅是一种作物。讲解员介绍，它既是玛雅人赖以生存的口粮，也被赋予生命循环的意义。玉米从播种、生长到成熟、收割的过程，与玉米神死亡、进入下界又获得重生的过程恰好一一对应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_2252a11956944f559909520030803d7f@1200352198_oswg1682302oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：作者拍摄</p>\n  <p>“在古代安第斯人的观念中，黄金是太阳的汗水，白银是月亮的眼泪。”讲解员解释称，在安第斯文明中，金银被赋予神性，并不作为货币流通。因而金银制成的面具、鼻饰、耳饰和权杖，更多承担着祭祀与彰显权力的功能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_56a9a49aba1f420aab22d53cde09b631@1200352198_oswg2023619oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：作者拍摄</p>\n  <p>走进“大自然的精灵”展区，象征着生育与爱情的蜂鸟、拖着长尾的蜘蛛猴，以及犰狳、负鼠等形态各异的动物轮番登场。这些展品体现了古代美洲居民对自然的细致观察，也折射出他们人与万物平等的自然观。</p>\n  <p>参观过程中，网络名人的镜头不断对准展品细节。文物是什么材质？鼻饰如何佩戴？古老的文字和历法怎样记录时间？问题一个接一个冒出来，大家不时驻足、拍摄、交流讨论，也为接下来的内容创作寻找角度。</p>\n  <p>此次活动为期五天，接下来，网络名人还将深入海淀区、房山区、北京经济技术开发区和朝阳区，从古都文脉走向科技前沿，从制造车间走进消费地标，用脚步和镜头，沉浸式感受中国式现代化的北京实践。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_995634a5d03f46cea432a0f863f2f7d9@1200352198_oswg10136793oswg4240oswg2832_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：作者拍摄</p>", "category": "tech", "published_at": "2026-09-01T01:53:33+00:00", "fetched_at": "2026-09-01T03:16:16.281252+00:00", "fingerprint": "c0779ec020230ee4"}, {"source": "36氪 - 最新文章", "title": "这款Agent，想做千万毕业生的“求职搭子” | 水下项目", "url": "https://36kr.com/p/3964198334438921?f=rss", "summary": "<p>“你投了100份简历，可能有90份石沉大海。你不知道为什么，也不知道怎么改。”王向导说道。</p>\n  <p>王向导是AI招聘数字化解决方案提供商「仟寻MoSeeker」的创始人兼CEO。他在招聘行业摸爬滚打十几年，对招聘场景长期存在的结构性矛盾深有体会：“HR看简历看到麻木，求职者海投到怀疑人生，两端都在被低效消耗，但中间的信息鸿沟难以填平。”</p>\n  <p>今年夏天，1270万高校毕业生走出校门，面临新的人生挑战。现实的另一面是，前程无忧今年7月发布的《2026校园招聘白皮书》显示，2025年已有65.3%的企业在校招中引入AI工具，较2024年提升12.7%。</p>\n  <p>供需两端同时被科技重塑，目前大多数AI招聘产品瞄准的是企业客户，求职者一侧的工具供给则明显滞后。<strong>“所以我们想做一个‘求职搭子’这样的Agent（智能体），帮大家解决找工作的难题。”</strong>王向导表示。</p>\n  <p>他透露，仟寻将在近期推出一款面向应届生等年轻求职者的招聘AI Agent产品「职芽」，帮用户优化简历、分析岗位匹配度、模拟面试、推荐职位，“让年轻人更容易找到心仪的工作。”目前该产品已在iOS平台公测，安卓版本计划在年内上线。</p>\n  <p>职芽背后的仟寻成立于2014年，总部位于上海，是国内头部的AI招聘系统供应商，并在亚太区多地布局，服务客户超过1000家，其中大型企业及世界500强客户百余家，不乏有迪士尼、玛氏、上海地铁等各个领域的头部企业，平台上可触达潜在候选人超过3000万，微信小程序会员超过500万，职位浏览数过亿。</p>\n  <p>一家做了10多年B端生意的公司，凭什么转头重新做C端产品？</p>\n  <p>王向导的逻辑是，仟寻在过去10多年服务企业的过程中，积累了两个核心能力：一是对招聘两端需求的深度理解，既懂企业想要什么样的人，也懂求职者面临的困境；二是基于平台上数百万真实招聘案例形成的过程数据。“这两样东西是我们做职芽的底气。”</p>\n  <h2>做真正与用户站在一起的“求职搭子”</h2>\n  <p>“就业难”本质上是一个宏观供需问题，超出了任何一家公司的能力边界。而在王向导看来，市面上现有的平台本质上是中介，靠流量以及利用信息差向企业收费，导致产品设计很难真正解决求职者的困境。“从某种程度上说，求职者的迷茫和找工作的低效，本身就是传统平台的利润来源。”</p>\n  <p><strong>所以职芽的定位是做一个真正站在应聘者这边的“求职搭子”，回归对人的需求的关注：</strong>包括求职者是谁、有什么技能、想做什么工作、困惑在哪里，从而帮他找到适合自己的方向和岗位，减少求职过程中的信息黑洞和无效劳动。</p>\n  <p>“我们希望职芽成为一站式的求职智能体Career Agent。”王向导说，“可以让大家在求职过程中少走很多弯路。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260901/v2_1ca2603af6cf4f189784132b99c3418f@5688585_oswg84551oswg376oswg843_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">招聘AI Agent产品「职芽」</p>\n  <p>具体到产品功能上，职芽Agent在用户上传简历后会自动提取用户的技能、经历和背景信息并反馈优化建议。用户用自然语言提出需求后，比如“推荐一些适合我的岗位”，Agent会根据简历画像从全网匹配岗位，分析匹配度。</p>\n  <p>一个典型的场景是AI模拟面试：用户选择意向岗位后，Agent会实时生成一套面试题目，由数字人担任模拟面试官，完成面试后生成评估报告和优化建议，详细到“哪个问题回答得好”、“哪里逻辑不清”、“下一次怎么改进”。</p>\n  <p>如何保证Agent的回复不会帮倒忙？</p>\n  <p>和所有垂直场景的Agent一样，职芽能够实现高质量的互动交付，也需要在算法层面具备足够深入的行业know-how。</p>\n  <p>在王向导看来，这正是仟寻的差异化优势。过去几年，仟寻团队通过服务1000多家覆盖快消、美妆、半导体、医药等众多行业的企业客户，运用AI工具面试海量候选人，对不同类型岗位需要的人才模型，以及最需要帮助求职者解决的难题积累了大量真实案例和经验。</p>\n  <p>一个候选人投递了什么岗位、简历通过率和评价如何、是否进入面试、最终是否被录用，这些案例背后覆盖招聘场景全流程的过程数据，构成职芽匹配算法的底层能力。</p>\n  <p>但是从B端的招聘系统，到C端的求职Agent，仟寻团队也切实经历新的挑战。</p>\n  <p>首先是产品设计思路的巨大差异。“B端产品的迭代是满足客户需求，C端产品则要我们通过分析用户的使用数据，主动理解用户行为背后的需求。”王向导举了一个典型的例子：职芽的早期版本里曾上线过“职位广场”功能，让用户从成千上万个岗位里搜索、翻页、筛选适合的岗位。</p>\n  <p>“但我们发现，这个功能使一些用户与Agent交互的频率下降，导致求职成功率、用户粘性都受到影响。”王向导分析，职位广场的使用逻辑仍然和传统招聘应用一样，从本质上背离了Agent通过交互高效获取信息的核心价值，“所以我们坚决砍掉了这一功能。”这个反市场共识的决策，可以看作是仟寻团队对“原生Agent”产品的一次探索。</p>\n  <p>另一个更微妙的挑战则是，从为雇主服务到站在求职者一边，仟寻如何平衡“左右互搏”的矛盾？</p>\n  <p>王向导没有回避这个问题，在他看来，面对应聘者与雇主之间的攻防博弈，平台需要通过产品迭代和算法优化持续做好动态平衡，既能提升前者的求职表现，也能让后者看到求职者的真实水平。这也是职芽独立于仟寻过往其他业务，仅面向C端的原因。</p>\n  <p><strong>而平台最根本的价值仍在于弥合双方的信息差和表达差。</strong></p>\n  <p>“AI不是为了帮求职者伪装，我们甚至要通过产品设计有效甄别作弊行为，AI是为了帮他们更好地认识自己，表达自己，让整个匹配过程更高效。”王向导表示，雇主也同样可以通过Agent更清晰自然地表达用人需求。</p>\n  <h2>让Agent做匹配，人做决策</h2>\n  <p>求职招聘类应用刚起步时，往往面临“鸡生蛋，蛋生鸡”的难题：有足够多的用户数据，算法匹配才能更精准；而算法匹配足够有效，才能留住更多用户。</p>\n  <p>过去一年，全球范围内各类垂直行业Agent快速涌现。招聘等HR管理工作由于存在大量标准化程度高、重复性强的工作，被普遍认为是适合Agent规模化落地的垂直领域之一。</p>\n  <p>前程无忧《2026校园招聘白皮书》显示，2025年已有65.3%的企业在校招中引入AI工具，较2024年提升12.7个百分点。LinkedIn、Workday、Boss直聘等行业头部企业陆续推出自己的AI招聘助手或Agent，并且这一趋势仍在加速。</p>\n  <p>面对未来更多同类型产品的出现，职芽的竞争壁垒是什么？</p>\n  <p>王向导认为，职芽获客的“先天优势”在于仟寻已有的B端资源，包括上千家企业客户的校招渠道，以及与全国100多个高校在AI面试系统等方面的合作，这让职芽可以低成本触达大量学生和应届生用户，先以免费模式做好口碑积累，不需要靠“烧钱”做市场推广。</p>\n  <p>“只要工具真的好用，学生之间传播很快。等用户规模达到一定程度，我们再针对不同群体的需求推出多种付费模式。”王向导表示。</p>\n  <p>对于招聘Agent的行业终局，王向导的设想是“Agent to Agent”——求职者Agent知道用户想找什么工作，企业端Agent理解公司需要什么人才，两个Agent自己完成匹配和初步沟通。</p>\n  <p>“但这不意味着人的角色消失”，王向导表示，Agent过滤掉前期流程化工作中大量无效的噪音后，真正适配的人才才能与企业进行更高效、更有价值的沟通。“而最后做决定的永远应该是人，human in the loop是AI伦理中很重要的一个标准。”</p>", "category": "tech", "published_at": "2026-09-01T02:23:55+00:00", "fetched_at": "2026-09-01T03:16:16.281238+00:00", "fingerprint": "71230bfee1d172ae"}, {"source": "少数派", "title" every indie band wanted you [&#8230;]", "category": "tech", "published_at": "2026-08-30T21:18:59+00:00", "fetched_at": "2026-08-31T03:12:23.916364+00:00", "fingerprint": "431ebf7a4d824629"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨官方回应“建议取消ETC设备使用”；追觅起诉小红书，要求平台配合披露用户身份信息；李国庆回应卖掉当当股份做公益", "url": "https://36kr.com/p/3962669143620737?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>国 内金饰克价一夜大跌近40元</p>\n  <p>官方通报“用敌敌畏给餐厅消杀”</p>\n  <p>长鑫存储回应起诉美国国防部</p>\n  <p>建设银行已开放存量客户个人房贷延期至40年申请</p>\n  <p>索尼、华纳起诉Anthropic，指控其公然窃取知识产权</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>官方回应“建议取消ETC设备使用”&nbsp;</strong></p>\n  <p>近期，交通运输部针对“高速公路无卡便捷通行模式推广”等问题进行回应。交通运输部公路局相关负责人表示，当前设置ETC车道的目的在于提升高速公路通行效率、优化公众高速出行体验，同时促进物流业降本增效。通行频次高的车主，可根据个人需求自主自愿选择办理ETC设备，通过合作银行线下网点、ETC官方服务小程序、支付宝相关服务入口等多种正规线上线下渠道便捷申领ETC设备。</p>\n  <p>同时，为进一步提升高速公路通行效率、便利群众出行，交通运输部当前已印发《高速公路“手机+”无卡便捷通行实施方案（2026-2028年）》，积极稳妥推广“手机+”无卡便捷通行模式。（财联社）</p>\n  <p><strong>追觅起诉小红书，要求平台配合披露用户身份信息</strong></p>\n  <p>第一财经记者查询法院开庭信息得知，追觅科技（苏州）有限公司因名誉权纠纷起诉行吟信息科技（上海）有限公司（小红书国内核心运营主体公司），该案将于9月8日在上海市黄浦区人民法院开庭。</p>\n  <p>针对追觅起诉小红书一事，据接近小红书的法律人士表示，该诉讼源自追觅要求平台配合披露某自媒体用户的真实身份信息。追觅认为该用户涉嫌侵权，起诉平台属于网络侵权纠纷里常见的\"披露身份\"法定程序。据了解，该自媒体账号于去年11月发布了一篇关于追觅组织架构调整的内容。（第一财经）</p>\n  <p><strong>李国庆回应卖掉当当股份做公益</strong></p>\n  <p>36氪获悉，8月29日，李国庆在社交平台发布视频称，“去年60岁时卖掉当当股份，拿出5000万做公益！比钱更重要的是，把爱传递出去，我相信人间值得！”李国庆透露，这笔5000万元捐赠一分为二，其中2500万元进入李享生活公益基金，由其创立的会员制电商平台“李享生活”旗下的公益部运作；另外2500万元进入李国庆张丹红公益基金，作为双方家族内部基金运作。两个基金虽然都关注儿童和教育领域，但“决策权、决策流程不一样”。李国庆称，基金项目的定位为“资助型”，不是自己下场去做。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌、OpenAI、Meta正与日本官方机构和本土企业联手，打击激增的网络诈骗案件</strong></p>\n  <p>市场消息：谷歌、OpenAI、Meta正与日本官方机构和本土企业联手，打击激增的网络诈骗案件。（新浪财经）</p>\n  <p><strong>OpenAI将终止向Cursor提供模型服务，马斯克回应</strong></p>\n  <p>据多家外媒报道，当地时间28日，美国开放人工智能研究中心（OpenAI）宣布，计划停止向美国太空探索技术公司（SpaceX）旗下AI编程平台——“光标”代码编辑器（Cursor）提供模型服务。OpenAI在社交媒体上发文称，已通知SpaceX，拟定终止日期为2026年11月12日。</p>\n  <p>OpenAI表示，作出该决定是基于“过往经验”。因为马斯克旗下多家公司曾出现违约行为，无法确信SpaceX会在服务条款框架内使用技术。对此，马斯克在X平台回应称“毫不在意”，并称OpenAI首席执行官阿尔特曼和总裁布罗克曼“两人完全不值得信任，偷走了一个开源非营利组织”。今年6月，SpaceX宣布以600亿美元全股票交易方式收购Cursor的母公司Anysphere，并于本月初完成这笔收购。据悉，马斯克此前曾向OpenAI发起1500亿美元索赔诉讼，指控OpenAI与阿尔特曼背弃最初的非营利使命。而OpenAI方面则表示，马斯克试图夺取公司控制权。（央视财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>国内金饰克价一夜大跌近40元</strong></p>\n  <p>36氪获悉，北京时间29日早间，现货黄金收跌2.95%，跌破4500美元/盎司，报4453.67美元/盎司。隔夜市场上，美联储主席沃什在杰克逊霍尔全球央行年会发表讲话。沃什表示，如果美国的基础通胀不能清晰且足够快速地向2%目标回落，美联储“还有工作要做”。29日，国内多家品牌金饰价格集体大幅下调，老庙黄金足金饰品报1345元/克，单日大跌39元；老凤祥足金饰品报1348元/克，单日大跌36元；周生生足金饰品报1344元/克，单日大涨37元。</p>\n  <p><strong>蜜雪冰城会员总量达5亿</strong></p>\n  <p>36氪获悉，8月30日，蜜雪冰城宣布，其会员总量达5亿。</p>\n  <p><strong>长鑫科技宣布LPDDR6量产，峰值速率达12800Mbps</strong></p>\n  <p>长鑫科技宣布自主研发的新一代低功耗内存LPDDR6实现量产，并将首批搭载于小米18 Fold折叠旗舰手机。据悉，这是全球LPDDR6产品首次落地商用，标志着国内存储企业首次在高端内存标准上实现全球首发量产跨越。据长鑫半年报披露，长鑫LPDDR6芯片通过架构创新及数据传输优化技术，充分释放数据传输潜力，峰值速率达12800Mbps，芯片最高容量 16GB。（财联社）</p>\n  <p><strong>机器人踢掉女孩牙齿，涉事方回应</strong></p>\n  <p>近日，“湖北襄阳一女孩在科技馆被机器人踢掉牙齿”一事引发热议。8月28日，南都N视频记者从当地相关部门获悉，事发时涉事机器人正在调试演练，目前涉事方已与家属达成和解。该馆运营服务方合肥安达创展科技股份有限公司方面表示，“赔偿细节暂不公开，机器人是宇树品牌。”据该科技馆介绍，目前宇树机器人表演仍在定期推出。</p>\n  <p>据了解，2025年11月12日，湖北襄阳一名女孩随幼儿园到襄阳市科技馆参观时，被机器人突然抬腿踢中面部，致使多颗乳牙被踢落。相关图片显示，该女孩多颗乳牙脱落，且面部留下疤痕。（南都N视频、第一财经）</p>\n  <p><strong>厦门通报“一消杀公司用敌敌畏给数十家餐厅消杀”：6人被刑拘&nbsp;</strong></p>\n  <p>近日，针对媒体报道的厦门绿林森环境科技有限公司使用敌敌畏为餐饮门店消杀问题，厦门市成立联合调查组。经调查，该公司相关行为涉嫌违法违规，性质十分恶劣。公安机关已对法定代表人庄某臣、股东曾某鸣、业务培训主管李某等6名犯罪嫌疑人依法刑事拘留，案件正在进一步侦办中。经全面排查该公司提供消杀服务的经营主体，并委托具有检验检测资质的机构对场所环境、餐厨用具等进行检测，结果显示相关指标符合安全标准。（央视新闻）</p>\n  <p><strong>长鑫存储回应起诉美国国防部&nbsp;</strong></p>\n  <p>有消息称，长鑫存储于美国东部时间8月28日向美国国防部提起诉讼。8月29日，长鑫存储向记者表示，公司向美国哥伦比亚特区地方法院提起诉讼，指控美国国防部错误地将其列入“中国军事企业”清单，该公司2025年1月被首次列名。长鑫存储不是军事企业，仅研发和生产用于商业及民用领域的DRAM（动态随机存取存储器）产品，未用于军事用途。（第一财经）</p>\n  <p><strong>章建平退出美年健康十大股东</strong></p>\n  <p>8月30日，根据美年健康2026年半年报，截至2026年6月30日，十大股东名单未见章建平的身影；而根据美年健康2026年一季报，截至2026年3月31日，章建平持有公司6625.74万股股份，为公司第十大股东。（界面新闻）</p>\n  <p><strong>建设银行已开放存量客户个人房贷延期至40年申请</strong></p>\n  <p>8月28日，人民银行、金融监管总局联合发布相关房地产信贷管理新规，将个人住房贷款期限由最长30年延长至最长不超过40年，具体期限由购房人与商业银行协商确定。8月30日，财联社记者采访获悉，建设银行已开始落实相关政策。建行客服人员表示，客户可以向银行申请延长贷款期限，银行将根据申请延长期限的具体原因、还款来源以及后续还款安排等因素综合评估，合理确定可延长的具体年限。按照建行目前执行口径，延长期限最长不超过原贷款期限的一半，且原贷款期限与延长期限合计不超过40年。例如，若客户原贷款期限为30年，最多可申请延长10年；若原贷款期限为10年，最多可延长5年。建行客服人员表示，该行自政策发布之日起（2026年8月28日）开始执行最新规定。（财联社）</p>\n  <p><strong>苹果Siri功能跳票赔17亿</strong></p>\n  <p>针对苹果Siri虚假宣传的集体诉讼，近日迎来新进展。苹果已同意支付2.5亿美元（约合人民币17亿元）达成和解，符合条件的美国iPhone用户，单台设备最高可获95美元赔偿。此次争议源于苹果此前将Apple Intelligence加持的个性化Siri，作为iPhone 15和iPhone 16系列的重要卖点，并在宣传中展示多项AI能力。然而2025年3月，苹果确认部分核心Siri功能将延期上线，随后有消费者提起集体诉讼，认为苹果的相关宣传影响了购买决策。（每日经济新闻）</p>\n  <p><strong>超123亿，2026电影暑期档已超去年同档期总票房</strong></p>\n  <p>网络平台数据显示，截至8月30日13时，2026年暑期档电影总票房（含预售）突破123.4亿元，超过2025年暑期档收官总票房，实现暑期档票房连续两年增长。（央视新闻）</p>\n  <p><strong>中国石油：聘任龚真直为副总裁</strong></p>\n  <p>36氪获悉，中国石油8月30日公告，公司于2026年8月28日召开第十届董事会第二次会议，审议并通过了《关于聘任公司副总裁的议案》，聘任龚真直担任公司副总裁，任期与第十届董事会任期一致。</p>\n  <p><strong>中信证券：AI在Q2集中体现，而能化接下来可能逐步升温</strong></p>\n  <p>中信证券研报指出，2022年后A股“结构性快速轮动”是常态，极高轮动速度持续时间一般在1~2个月，高速轮动背后的共性是盈利上修的广度不足，可持续的主线稀缺。当前，贸易摩擦步入高发期，汇兑损益的影响也在放大，出海作为A股最重要的业绩线索之一遭遇估值约束，制约了行情的宽度，容易形成行业快速轮动的市场状态。打破僵局需要新的变化，近期的AI进展强化了算力需求快速增长的既有趋势，但不足以改变远期商业化叙事，若后续看到类似RSI、防蒸馏等可能的新变化出现则有望打开远期估值空间。在行情快速轮动的阶段，主要的风格策略当中，赢家大部分是“低估值系”策略，不过其中只有PB-ROE策略在快速轮动环境下明显占优，且策略收益率随着轮动速度提升而进一步增强，动量策略则是快速轮动阶段最受损的策略，高轮动下市场机会或将更多体现为具备业绩支撑品种的估值修复。配置上，我们在中期策略中提出“AI+能化”的杠铃结构，AI在Q2集中体现，而能化接下来可能逐步升温。（财联社）</p>\n  <p><strong>订单排到年底，千亿液冷赛道加速升温</strong></p>\n  <p>全球AI硬件功耗持续攀升，传统风冷散热瓶颈凸显。随着新建智算中心加速落地、传统机房风冷改液冷需求集中释放，液冷产业迎来爆发增长期，多家液冷企业订单排至年底。据了解，当前传统的风冷技术不能很好解决高功率算力芯片散热问题，全浸没式液冷成为一种解决方案，就像给发烫的服务器“泡冷水澡”。近日，国内首个浸没式液冷算力方舱投入运行，对四种不同冷却液进行严苛的兼容性测试。这个项目聚焦算力方舱液冷冷却液的研究，研发出兼具经济性与散热性的低价冷却液，同时基于硅油、合成油、再生变压器油及氟化液四种冷却液进行兼容性研究，破解数据中心高耗能难题。业内人士表示，随着技术的迭代和成本下降，浸没式液冷有望逐步替代传统冷板式液冷装置。(央视财经)</p>\n  <p><strong>索尼、华纳起诉Anthropic，指控其公然窃取知识产权</strong></p>\n  <p>几家全球大型音乐出版商周五晚间提起重磅诉讼，称该案是“史上规模最大、性质最为恶劣的持续性知识产权盗窃行为之一”。本次诉讼拉开序幕，一场围绕音乐、人工智能以及新技术时代知识产权保护的较量或将持续数年。原告诉状（共48页）写道：“被告Anthropic及其创始人达里奥·阿莫代伊、本杰明·曼大规模非法通过种子下载、网页爬取、下载受版权保护作品，以此开发、运营Anthropic的Claude系列人工智能模型，并借此攫取巨额利润。”原告还指控Anthropic盗版数千首受版权保护音乐作品，要求就每一项侵权作品索赔数十万美元。这并非Anthropic首次被指控盗用内容训练模型。2025年9月，该公司达成美国历史上金额最高的版权和解，向作者与出版商支付15亿美元。（新浪财经）</p>\n  <p><strong>a16z旗下机器时代基金筹集11亿美元，将投向芯片、机器人等硬件领域</strong></p>\n  <p>当地时间8月28日，硅谷知名风险投资公司Andreessen Horowitz（a16z）宣布硬件正式确立为公司的核心方向，并为旗下机器时代基金（Machine Age Fund）筹集11亿美元。该基金将投资于AI运行所依赖的所有计算机基础设施，包括芯片、内存、网络和存储，还包括运行AI的完整系统：从数据中心到机器人，再到家用AI设备。该公司介绍，其最近投资了多家硬件公司，包括Unconventional AI、Nexthop、Volta、Atoms和Mind Robotics。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>优地机器人：拟全球发售4500万股H股</strong></p>\n  <p>36氪获悉，优地机器人公告，公司拟全球发售45,000,000股H股，香港发售股份2,250,000股H股，国际发售股份42,750,000股H股；发售价不超每股19.55港元；预期股份将于2026年9月9日开始在香港联交所买卖。</p>\n  <p><strong>燧原科技：首次公开发行股票并在科创板上市网上路演公告</strong></p>\n  <p>36氪获悉，燧原科技公告称，公司首次公开发行股票并在科创板上市的申请已获证监会同意注册。本次拟公开发行新股4303.5173万股，占发行后总股本的10%。发行人和联席主承销商将于2026年9月1日14:00-17:00举行网上路演，投资者可通过上证路演中心或上海证券报·中国证券网参与。</p>\n  <h2>大公司财报</h2>\n  <p><strong>中国国航：2026年半年度净亏损22.86亿元</strong></p>\n  <p>36氪获悉，中国国航发布2026年半年度报告，实现营业收入892.68亿元，同比增长10.54%；归属于上市公司股东的净利润为亏损22.86亿元。小财注：公司Q2净利润亏损40亿，之前预告区间为-43.14亿--38.14亿，Q1净利润17.14亿，据此计算，Q2净利润环比由盈转亏。</p>\n  <p><strong>三一重工：上半年净利润56.9亿元 同比增长9.13%</strong></p>\n  <p>36氪获悉，三一重工8月30日披露半年报，公司上半年实现营业收入533.06亿元，同比增长19.7%；归属于上市公司股东的净利润56.9亿元，同比增长9.13%；基本每股收益0.6217元/股。报告期内，公司业绩主要受到国内和国际销售均同比增长的影响。</p>\n  <p><strong>中国石油：上半年净利润同比增长22%</strong></p>\n  <p>36氪获悉，中国石油发布2026年半年度报告，实现营业收入15274.91亿元，同比增长5.3%；归属于母公司股东净利润1039.36亿元，同比增长22.0%。</p>\n  <p><strong>京沪高铁：上半年归母净利润67.71亿元，同比增长7.21%</strong></p>\n  <p>36氪获悉，京沪高铁8月30日披露半年报，公司上半年实现营业收入218.42亿元，同比增长3.94%；归属于上市公司股东的净利润67.71亿元，同比增长7.21%；基本每股收益0.1384元/股。</p>\n  <p><strong>中国黄金：上半年归母净利润2.79亿元，同比下降12.35%</strong></p>\n  <p>36氪获悉，中国黄金8月30日披露半年报，公司上半年实现营业收入249亿元，同比下降19.93%；归属于上市公司股东的净利润2.79亿元，同比下降12.35%；基本每股收益0.17元/股。公司拟向全体股东每10股派发现金股利0.92元（含税）。报告期内，公司业绩主要受到黄金产品销量同比下降、营业成本及各项费用变动，以及存货金额增加和经营性应付项目减少等因素的影响。</p>\n  <h2>酷产品</h2>\n  <p><strong>华为Mate XT 2非凡大师即将发布，余承东：展翼三折叠形态，业界最薄、尺寸最大</strong></p>\n  <p>8月30日，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文介绍三折叠手机新形态，即将于9月7日发布的华为Mate XT 2非凡大师为展翼三折叠形态，手机通过左右翻折双翼展开。“3.5mm超纤薄机身内首次容纳内外两块屏幕，展开之后，依旧是业界最薄、尺寸最大的折叠屏手机！”余承东写道。（界面新闻）</p>\n  <p><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-08-30T23:58:52+00:00", "fetched_at": "2026-08-31T03:12:23.753484+00:00", "fingerprint": "4b87b895feedb059"}, {"source": "36氪 - 最新文章", "title": "爱诗科技投资、主做精品内容，AI影视公司折叠完成数百万美元融资｜36氪融资首发", "url": "https://36kr.com/p/3954709821258889?f=rss", "summary": "<p>36氪获悉，8月，AI数字影视公司上海折叠视觉设计有限公司（简称“折叠”）完成了数百万美元的种子轮战略投资，由爱诗科技投资。</p>\n  <p>此次融资将主要用于扩充创意人才和技术团队、AI工作流的搭建，以及IP的采购与开发。</p>\n  <p>折叠的主营业务并不完全是正热的AI短剧，而是基于传统流程及AI混制的中长番、动画电影，以及广告等。如今，这部分业务在国内外市场的需求增速明显，而AI混制有较高的传统内容制作和大模型应用能力的结合要求，创始团队成员Sam提到“国内平台对于传统+AI的反应速度是特别快的，目前折叠也在配合一些混制方向的业务。”</p>\n  <p>去年公司还交付过红果短剧评级为S级的内容，如今在AI短剧侧，折叠暂时采用跑量的策略——因为门槛足够低，还能沉淀数据资产、挖掘人才。</p>\n  <p>伴随着国内各家大模型的升级迭代，视频生成领域已经成为AI赛道落地最快、商业化毛利较高的场景这一，并造就了AI短剧这一风口。36氪曾获悉，几乎占据AI短剧赛道主导地位的Seedance2.0，毛利达到70%以上，成为字节旗下火山引擎最赚钱的业务之一。</p>\n  <p>只是今年年初还能快速获���的赛道，如今因为国家管控政策的出台，以及供给端产能过剩，已经成为一片红海。挣快钱的时期过去后，行业开始考虑如何做IP，用AI触及更高的商业天花板。折叠是其中一员。</p>\n  <p>团队创始人Cage及Hisun是数字艺术家，具备优秀的审美能力及创作能力。创始团队均来自内容平台、版权及AI技术公司，让公司具备审美能力的同时，也可以更好地链接行业资源。</p>\n  <p>他们认为，越自动化的内容，距离精品越远，“AI可以让我们更轻松做出60分的内容，但100分的内容需要懂AI技术又有传统审美的人参与进来。”</p>\n  <p>折叠整体的人员构成就是这样一群既懂内容也懂技术的人，构成了其核心竞争力，Sam表示，公司有些导演、制片、美术每天都在研究如何把自己“蒸馏”成各类Skill，好把更多的时间留给思考。</p>\n  <p>目前市面上内置多个Agent的工具、模型，仍然难以满足一家产量较大的公司生产过程中足够细分的需求和团队配合，建设自己的生产流程依然是必要的。因此，折叠还搭建了自己的AI工作流程，包括剧本拆解、提示词生成、角色设定等Agent，用于降本增效。</p>\n  <p>以AI为原点，加上可观的人员规模——折叠在多个城市拥有百人级产能团队。公司高品质内容的月产能可以达到5000分钟，约等于40部电影。</p>\n  <p>折叠还组建了专门的技术团队，除了内部AI影视内容生产流程的搭建以外，还支持AI游戏的改编和产出。</p>\n  <p>游戏是IP开发中商业天花板更高的品类，打造轻量游戏的制作能力，有助于公司进一步完善自身的IP开发能力。</p>\n  <p>包括“爱优腾芒”以及B站在内的视频平台，都在探索用AI融入、改造已有的内容生产流程。“大家对究竟是用AI改造现有内容的生产流程，还是打造AI原生内容尚没有定论，因为还没有看到一个非常现象级的Case跑出来，但能确定AI是未来的方向。”Sam表示。</p>\n  <p>折叠则是爱诗科技押注的细分方向之一，后者如此表示自己的投资逻辑：AI内容进入审美淘汰赛后，经典CG反而变成稀缺生产力，AI视频正在从Prompt红利进入审美壁垒阶段，具备传统CG能力+模型边界能力感知的团队会成为下一代精品内容公司核心生产范式的定义者。</p>\n  <p>目前，折叠已与多个平台达成合作，用AI混制推进平台IP影视化，预计今年年底陆续有相关精品内容上线。同时也正在筹备登陆院线的AI混制动画电影。</p>\n  <p>Sam说，AI只是一种工具和手段，长短也不是关键，本质上还是好内容在哪里，观众的注意力就在哪里。</p>", "category": "tech", "published_at": "2026-08-31T00:15:00+00:00", "fetched_at": "2026-08-31T03:12:23.753476+00:00", "fingerprint": "7cac70da7ac23034"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜中科大团队做太空智能计算平台获超亿元融资，博华、经纬、高瓴等联合押注", "url": "https://36kr.com/p/3958987031133568?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约3500字，建议阅读7分钟</p>\n  </blockquote>\n  <p>硬氪获悉，专注太空智能计算与卫星智能化的「中科密位」近期完成A1轮及A2轮融资，两轮融资总额超亿元，投资方包括博华产投、经纬创投、高瓴创投、宇石空间、中新集团、BV百度风投、鑫睿资本、华控基金、科大硅谷创投等。IO资本担任独家财务顾问。本轮融资阵容覆盖航天产业资本、头部创投机构及产业方，为公司进一步拓展太空智能计算及智能卫星核心系统业务提供了产业资源支持。</p>\n  <p>对于商业航天而言，随着卫星数量持续增加，如何处理海量在轨数据、降低数据下传压力，以及让卫星更加智能、具备自主运行能力，正成为新的基础设施需求。</p>\n  <p>中科密位由中国科学技术大学和上海处理器中心孵化，团队在智能计算体系结构和太空工程领域持续攻关近10年。<strong>公司创始人王子彦曾任某人工智能芯片上市公司副总裁，联合创始团队成员均来自中科大软件学院。</strong></p>\n  <p>中科密位定位于“太空智能计算与卫星智能化解决方案构建者”，构建“星智能—岛计算、星岛协同智能”的新一代智能星座计算架构。目前，<strong>公司的核心产品包括高可靠太空计算机硬件、星上服务化操作系统，以及面向星座分布式协同的计算架构。</strong></p>\n  <p><strong>硬件层面，中科密位推出了全国产化异构智能计算系统“洪塃”，覆盖从模组到整机再到系统多种形态。</strong>该产品具备硬件、固件、软件、系统四级可靠性，支持全轨道面恶劣辐照环境，主要解决卫星在有限功耗、有限体积以及强辐射环境下的高密度智能计算问题，同时支持CPU、GPU、NPU、FPGA等不同类型芯片协同工作。其计算能力可按需模块化组合，计算热控一体交付，覆盖从几十Tops级别至数十Pops太空计算需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_193638d4d9fe42678c69b7a928e7dae1@5920579_oswg905175oswg1226oswg690_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>软件层面，中科密位推出了面向异构智能计算的服务化操作系统“玹黃OS”。</strong>其对底层不同类型的计算硬件进行统一抽象，让开发者无需针对不同芯片分别进行开发和适配，而是可以通过统一的软件环境调用底层算力，从而降低智能应用的开发与部署门槛，提高算法迭代效率。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_715b491a68c5469486de303080fa4977@5920579_oswg498810oswg1209oswg680_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在单星具备智能计算能力之外，公司同时自研了“星—岛”协同计算架构。其中，“星”指搭载智能计算能力的传感卫星，“岛”则为部署在太空中的算力节点卫星，为传感卫星提供在轨算力补给和算力接入。这一架构下，卫星可以与其他卫星以及太空算力节点星进一步形成协同，单个卫星可以在轨完成目标识别、任务规划、数据判读等工作，同时对于计算需求更高的任务，则可以进一步调用其他节点的算力。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260828/v2_e7002c4ec5e141b691c51278bf6ee249@5920579_oswg742773oswg1265oswg712_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>商业化路径来看，中科密位目前已经形成从标准产品到系统解决方案的多层次服务模式。一方面，公司可以提供“洪塃”模组、整机等标准化软硬件产品；另一方面，也可以根据不同卫星任务提供定制化的智能计算系统，并进一步延伸至帮助卫星制造和星座运营企业提供灵活敏捷和更低成本的研发、工业化制造能力等支撑服务。</p>\n  <p>目前，中科密位的产品已经应用于商业航天、国家重大专项、载人航天、深空探测等领域。公司披露，团队早期近十年积累，已支持四颗星携带算力产品在轨稳定运行，最长的在轨运行时间已经接近5年；公司目前在研产品25+颗，是国内唯一具备低、中、高全轨道面全国产化太空计算产品交付能力的公司。</p>\n  <p>以下为硬氪与创始人王子彦交流节选：</p>\n  <p><strong>硬氪：团队从18年开始做“算力上天”的研发，当时的研发和现在有什么不同吗？</strong></p>\n  <p>王子彦：整个计算上天的工作是随着国内半导体和基础工业产业链的演进不断迭代的。早期我们用的是算力和功耗都相对较小的芯片，解决的是小模型推理问题。而且这些支撑我们形成积累的任务，都有极高的航天工程要求，从0到1的挑战很大，但是对我们现在的能力锻炼是全方面综合性的，这是我们的幸运。</p>\n  <p>现在计算芯片的能力不断提升，制程不断突破，对于现在的研发，挑战是全方面的，我们始终关注工程可实现和商业可闭环两个出发点，既要考虑受限的卫星平台工作环境约束，还要考虑大功率器件的抗辐照和真空散热问题，同时还要考虑与星上应用的适配优化，以及高时变、非稳态通信环境下整体计算架构的优化，对于团队的技术栈要求非常的全面，对于工程化能力要求提出了更高要求。</p>\n  <p><strong>硬氪：从早期的小算力芯片到现在的大算力载荷，技术难度提升了哪些？硬件和软件分别面临什么挑战？</strong></p>\n  <p>王子彦：早期我们上天的芯片算力和功耗都小，卫星的任务也很聚焦，我们可以针对具体的应用来优化一个专用的系统。现在星上的应用需求更加泛化，对计算的需求也更大，面临很多家不同的AI芯片，架构的差异化和软件栈的碎片化都是对应用泛化的挑战；同时太空计算面临的能源供给、重量、功耗密度、散热全都被约束在一个受限的范围内，系统软件架构必须适配这些极端条件，操作系统、任务调度、分布式协同都需要重新设计。</p>\n  <p>再从具体的硬件层面看，大算力AI芯片本身就是一种典型的低压大电流的芯片，核压大概是0.75到0.85伏，但是核内电源可能会达到将近一两百安培，对于要在太空环境可靠工作的产品来看，整个系统的外部电源、Flash、Nor Flash这些存固件、保证系统启动和安全的外围部件等等，是更显著的系统级短板，怎么样去设计整个太空计算模组的最小单元的可靠性的架构，这个其实就是我们一直在做的工作。我们的工作从小芯片到大芯片，技术栈一直是围绕着轨道可靠性、抗辐照、散热一系列的工作，这些工作是有共性和连续性的。</p>\n  <p><strong>硬氪：如何理解“星-岛”协同的规划，未来为什么一定会出现“算力岛”？</strong></p>\n  <p>王子彦：举个简单例子，现在一颗卫星上如果同时装高功率的传感设备（比如X波段雷达）和高功率的计算设备，会出现“开机一分钟，充电一小时”的情况。因为卫星平台资源受限，很难同时承载两个高功率组件。</p>\n  <p>当前我们还不具备Starlink那样大规模通信组网的能力，我们的地面站也很难广域全球部署，这些约束，都会对未来更大规模的星座建设、运营带来制约。</p>\n  <p>当轨道上传感卫星越来越多，伴随轨道数据激增，计算任务需求大量增加时，就必须有专门的算力卫星来服务整个星座。这个“算力岛”可以同轨伴飞，为传感卫星提供计算能力；当星间激光通信等技术更大规模应用后，还能实现异轨协同、按需接入算力，甚至可以代替部分地面站对星座的运控、规划等能力。简单说，过去的卫星是“眼睛”，现在我们要给“眼睛”加上“脑子”，但单颗卫星装不下足够大的“脑子”，所以需要专门的、更大容量的星座级“大脑”。这是未来的发展方向，也是我们在持续规划的。</p>\n  <blockquote>\n   <p>投资方观点：</p>\n   <p>博华产投董事总经理周睿哲：在轨智能计算是空天信息产业走向深度应用的核心。密位科技拥有国内稀缺的太空智能计算全栈自研能力，完成多星在轨实践，打通技术研发到工程交付闭环，补齐商业航天星座智能化的底层能力。本次投资是博华产投在太空算力赛道的关键布局，助力其与博华已投星座产业链实现深度协同。我们将依托产业网络，助力密位科技拓展更多行业场景，推动国产天基智能计算技术规模化落地。</p>\n   <p>经纬创投：中科密位是航天智能化的核心标的，芯片定制合作、工程化能力、国家队生态三重壁垒，构成较好先发优势。卫星智能化是十五五规划重要方向，星链新一代卫星也从单纯通信卫星转为智能载荷卫星，密位的产品定位更适合中国国情。</p>\n   <p>宇石空间：中科密位在太空智能计算领域具备突出的技术领先优势，围绕星上计算机、异构算力架构、星载热控、轻量化模型部署等关键技术形成成熟积累，攻克太空环境下器件抗辐照、算力调度、星上操作系统等系列难点，技术路径高度匹配宇石空间智能星座与太空超算中心双线技术路线。中科密位创始团队源自中科大体系，兼具科研院所深厚技术积淀、头部产业大厂工程化落地经验，既懂航天环境约束，又精通AI算力软硬件开发，科研功底扎实、产业化执行力强。宇石空间本次投资通过产业链深度绑定，实现技术协同、能力互补，共同推进太空算力星座产品迭代与在轨验证。</p>\n   <p>BV百度风投执行董事崔轲迪：中科密位创始人王子彦及其团队长期专注于太空智能计算，在近十年的持续探索中，对航天工程约束与智能计算技术演进形成了深刻理解。子彦总既具备智能计算领域的技术积累，也拥有将技术真正带入复杂航天场景的工程实践能力，这种长期主义和工程思维是中科密位持续构筑产品能力的重要基础。我们尤其看重团队从早期小算力芯片到如今大算力载荷、从单星计算到“星—岛”协同架构的持续演进，其背后体现的是对太空计算长期发展方向的判断与坚持。期待中科密位可以持续推动国产太空智能计算能力从单点突破走向体系化发展</p>\n   <p>科大硅谷创投：中科密位深耕太空算力与智能计算国产化领域，以分布式太空智能计算架构为核心，填补国内异构智能计算操作系统空白，实现太空算力技术的重大突破。科大硅谷创投投资中科密位，以实际行动践行了“投早投小投硬科技”的投资战略，也与蜀山区重点布局的空天信息、人工智能等未来产业方向高度契合。</p>\n  </blockquote>", "category": "tech", "published_at": "2026-08-31T02:50:27+00:00", "fetched_at": "2026-08-31T03:12:23.753461+00:00", "fingerprint": "539480ba0afd2c98"}, {"source": "少数派", "title": "城市漫步指南 | 佛罗伦萨：来自六月的梦幻艺术夏令营", "url": "https://sspai.com/post/113974", "summary": "我种草佛罗伦萨的理由绝对是世所罕见：因为SEVENTEEN的NanaTour有很大一部分是在佛罗伦萨及其周边拍摄的。从去年夏天看了这个综艺开始，我就一直对这个地方念念不忘，心想夏日的意大利到底是有何种 ...<a href=\"https://sspai.com/post/113974\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-30T07:00:00+00:00", "fetched_at": "2026-08-31T03:12:22.247841+00:00", "fingerprint": "11360c8bba8fae0d"}, {"source": "少数派", "title": "派早报：GTA 6 引发请假玩游戏热潮", "url": "https://sspai.com/post/114022", "summary": "<p>GTA 6 引发请假玩游戏热潮</p><p>Sam Altman 为 OpenAI 高管定制豪华表</p><p>海信发布 A10 系列墨水屏手机</p><p>Pixel 11 削减内存安全特性，GrapheneOS 考虑放弃支持</p><p>「承重」等 Claude 滥用词在 GitHub 蔓延</p><p>工信部曝光车企监督检查典型案例</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/114022\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-3 +00:00", "fingerprint": "94db180b35f01cb4"}, {"source": "36氪 - 最新文章", "title": "业绩快报 | 荔枝冰奶五十天卖出1700万杯，茶百道上半年“质效双增”", "url": "https://36kr.com/p/3960415196052873?f=rss", "summary": "<p><strong>文 | 杨烁&nbsp;</strong></p>\n  <p>8月28日，茶百道披露中期业绩。上半年营收26.55亿元，同比增长6.2%；期内利润实现3.45亿元，同比增长3.5%。</p>\n  <p>业绩会上，公司管理层将增长归因于一个核心逻辑——不盲目追求门店数量的堆砌，而是以产品创新和供应链效率为双轮，驱动终端经营质量的实质性提升。</p>\n  <p>今年上半年，茶百道加大了产品研发力度，围绕“鲜果、鲜奶、咖啡”等核心原料建立品类矩阵。</p>\n  <p>其中，“荔枝冰奶”在五十余天的销售周期内，累计销量超过1700万杯。茶百道也围绕这一优势品类，陆续推出“芭乐、葡萄、柠檬”等多款风味冰奶产品，形成清晰的矩阵式布局。</p>\n  <p>茶百道对产品的理解，不仅是“好喝”一个维度。2026年以来，公司又推出了以“实在木薯甜品碗”为代表的替餐类产品、以“佛手柑柠檬水”为代表的替水类产品。</p>\n  <p>两大新品类的推出，悄然改变了门店的时间属性。现阶段的茶百道，已明显从传统下午茶的单一模式，延伸至“早餐、轻食、日常补水”等多元化的消费场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260829/v2_10d7c5c3b8894488bd11f2259014e3d6@11416942_oswg262954oswg1707oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p><strong>产品边界不断拓宽，对后端供应链的响应速度提出了更高要求。</strong></p>\n  <p>报告期内，茶百道全国仓配中心增至27个，水果统配率提升至91%，约95%的门店每周可获得两次及以上的配送。从产地到门店实现全程冷链的高效供应，既保证了门店端的产品与服务质量，也极大降低了供应商的试错成本。</p>\n  <p>与此同时，公司也在保证一、二线城市基本盘的同时，不断向低线城市下探。截至报告期末，<strong>茶百道门店总数增至8863家。其中，中国三线及以下城市的门店数同比增长7.2%。</strong></p>\n  <p>值得提及的是，基于全国化的门店网络布局，茶百道正积极推进“茶饮+咖啡”业务的协同发展，并成功推出了多款高质价比的咖啡产品。上半年，茶百道的现磨咖啡机已覆盖超过2700家门店，超出年初预期。</p>\n  <p>另在会员方面，茶百道的注册会员数突破2亿大关。这意味着，茶百道拥有了一个规模庞大的私域流量池。</p>\n  <p>相信在未来，伴随咖啡业务进入盈利周期、会员体系不断提升，茶百道的中长期成长有望进一步增强。</p>", "category": "tech", "published_at": "2026-08-29T09:47:11+00:00", "fetched_at": "2026-08-30T03:17:00.882768+00:00", "fingerprint": "5d19c54d230de0a6"}, {"source": "The Guardian - World", "title": "Egyptian queen’s 673-diamond necklace stolen in Vienna smash-and-grab raid", "url": "https://www.theguardian.com/artanddesign/2026/aug/28/egyptian-queen-diamond-necklace-stolen-vienna-raid", "summary": "<p>Police hunt two suspects after historic 200-carat piece is snatched from Austrian museum during opening hours</p><p>Austrian police are hunting two men alleged to have stolen a 200-carat
