<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

rmonyOS 7，围绕AI、3D空间化、用户体验等方向展开比拼。随着最终获奖名单揭晓，比赛的结果已经落定，但比奖项本身更值得被看见的，是<strong>这些作品背后一批年轻开发者正在关注什么，又试图用代码回答什么。</strong></p>\n  <p>翻开参赛作品的名单，我们意外地发现，这其中很多的开发者都还是在校学生，没有成熟公司的资源，没有完整的商业团队，甚至可能没有充足的开发经验。但在这场比赛里，<strong>他们把自己的生活观察、专业背景和兴趣经验变成了一个个可运行的产品。</strong></p>\n  <p><strong>这些作品构成了这场创新赛值得被观察的一面：年轻开发者不再只是追逐抽象的技术命题，而是在用代码回应自己的生活。</strong></p>\n  <p>这群年轻人是如何在生活中发现问题并用代码编写出解决方案的？一群还在校园里的年轻人，又是如何在36小时极限开发里，把脑海中的灵感变成真正可运行的作品？当鸿蒙生态把AI能力、多端协同和开发工具开放给更多中小开发者，创新的门槛会不会被重新改写？&nbsp;</p>\n  <p>带着这些问题，后浪研究所访谈了其中几位年轻开发者，和他们聊了聊这段与众不同的开发经历。&nbsp;</p>\n  <h3><strong>对话活态文明，把壁画搬进手机里</strong></h3>\n  <p>谢荷第一次觉得壁画离自己很近，是在河南的一次线下飞天表演。</p>\n  <p>在那之前，壁画对她来说更像是藏在遥远石窟的一场梦。即便是在短视频泛滥的当下，她随时可以看到那些壁画上衣裙缈缈的人物一闪而过的画面，但屏幕内外的距离，却也让谢荷在感受历史文化的同时有了强烈的距离感。</p>\n  <p>直到那次表演，敦煌壁画中的飞天人物被搬到现实场景中，原本静止在墙上的形象变成了跃动在她眼前的景象，她和壁画之间的距离好像消失了。</p>\n  <p>那么，<strong>如果不是每个人都有时间、预算和机会立刻去一趟敦煌，那能不能先用一部手机，打开一扇通往壁画世界的门呢？</strong></p>\n  <p>这个念头，最终落在了谢荷和她的两位队友身上。他们来自郑州轻工业大学——一个主打多学科交叉的团队，三个人分别来自计算机、物联网和生物工程专业。从大一起，他们就在工作室里接触鸿蒙，攒下了一年多的开发基础。“壁行·时空”就这样立项了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_8c51fbd51a9a48d98cc8ed892604559c@15222052_oswg679000oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">谢荷参赛，华为官方供图</p>\n  <p>他们想做的不是一个普通的“滑动图片+语音讲解”应用，而是能让用户像走进真实空间一样，移动、靠近、调整视角，在行走中看见壁画里的人物、场景和故事。<strong>在他们看来，传统文化不该只停留在\"被观看\"的位置，它也可以变成一种“可步入、可对话、可参与修复\"的活态文明。</strong></p>\n  <p>但要把这个设想做出来，远比想象中难。最大的拦路虎是3D建模：模型过大、加载卡顿、视角异常、场景错位……状况层出不穷。项目从去年10月立项，光是底层引擎他们就推翻重来了三次，反复摸索之后，他们最终选择结合鸿蒙的3D图形能力与Unity引擎“双驱动”，才让壁画稳稳地“立”了起来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_0c806ca8c2cc4a2995344e19c398e905@15222052_oswg612232oswg1080oswg528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">壁行·时空App界面，受访者供图</p>\n  <p><strong>而能让这群资源有限的学生走到这一步，谢荷说，他们是鸿蒙生态实实在在的受益者。</strong>最直接的帮助就是工具链。“有些软件你学的时候，第一步就卡死在环境安装上了。”而鸿蒙的工具链如今下载安装包，点一下就能完成，不需要反复配置路径，让初学者能顺利迈出第一步。</p>\n  <p>其次是AI的辅助，借助鸿蒙的AI辅助开发工具，无论是报错排查、接口查找还是实现思路的梳理，都能得到提示。在谢荷看来，这正是过去和现在最大的不同：早些年学开发，得先系统啃完一大堆理论，才敢动手写第一个页面；而AI能快速帮你理清学习路径、精炼需求，“它大大加速了我们的成长”。</p>\n  <p><strong>鸿蒙让这群年轻的开发者看见了另一种可能。</strong>去年，他们做过一款叫“视野通达”的手语翻译应用并成功上架。在运营过程中，他们还参与了鸿蒙应用开发者激励计划，收到了大学期间的第一笔收入。对学生开发者来说，这种反馈很直接：原来自己写出来的东西，不只是停留在作业和比赛文档里——它可以上架，可以被人使用，甚至能带来真实的回报，成为下一次继续开发的底气。</p>\n  <p><strong>就是在这样一次又一次的尝试中，谢荷和她的伙伴们通过鸿蒙生态收获的不仅仅是两款成功的作品，更是持续开发的激情和推进文化探索与年轻人深度链接的可能。</strong></p>\n  <h3><strong>看见每一次动作，让AI成为运动搭子</strong></h3>\n  <p>比起谢荷团队着眼于壁画的遥远视野，蓝峰对年轻人需求的洞察更加贴近日常。</p>\n  <p>当下，健身已经成了年轻人离不开的话题和习惯，越来越多人开始走进健身房。<strong>但并不是每个人都能顺利适应健身房里多样的设备，蓝峰就是无所适从的其中之一。</strong></p>\n  <p>正在太原工业学院读大二的蓝峰是个马拉松爱好者，后来为了增加力量训练，他第一次走进健身房，面对各式各样的器械，问题也随之而来：一台器械摆在面前，不同厂商使用方法不同，标签也写的不明确；想用AI拍照识别，但搜图工具又认不准。网上能搜到一堆训练计划，但除了教练和健身搭子，没人能随时指正你的动作是否规范。</p>\n  <p>这对健身小白太不友好了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_870a0d3824f44a6d9308a66db47280a0@15222052_oswg167406oswg949oswg1510_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝峰参加马拉松比赛，受访者供图</p>\n  <p>他把市面上的运动健康软件挨个试了一遍，它们能帮你排计划、记卡路里，或者推荐一些无器械健身的动作，但无一例外的是没办法指导用户在健身房沉浸式的训练。换句话说，<strong>在蓝峰眼中，“没有一款软件真正赋能运动这个过程本身。”而这句话，成了“Arua AI健身教练”的出发点。</strong></p>\n  <p>蓝峰想做的，是让AI融入到运动中来，帮助小白识别器械、观察并纠正动作。</p>\n  <p>作为独立开发者，蓝峰既没有团队也没有现成的大规模数据，每个动作对应的骨骼点状态、识别器械需要的样本、跑步姿态的反馈数据，都得他一个人完成。</p>\n  <p><strong>而支持他把项目推进下来的，是鸿蒙生态。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_bd90855536484b75a5952a8449bf811c@15222052_oswg408552oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝峰参赛，华为官方供图</p>\n  <p>鸿蒙的骨骼点检测功能，让AI第一次有机会“看见”用户的动作，而不只是生成一段冰冷的建议。这正是他最初决定动手的那块拼图。</p>\n  <p>给他更大助益的是鸿蒙在AI上的扩展能力。“和AI相关的扩展，鸿蒙确实比其他厂商做得好一些。”在他看来，华为的推送、小艺以及智能体扩展，让应用未来有可能更主动地参与训练：不需要等待App打开才响应，而是训练前提醒、训练中反馈、训练后复盘。AI不再被动等指令，而是能主动调用工具、解决问题。</p>\n  <p>这也是Arua和普通健身App最不一样的地方。蓝峰想解决的核心问题，其实是大部分普通年轻人的健身焦虑——空有一份计划，到了健身房却无从下手，请私教太贵，自己摸索又容易受伤。Arua填补的恰好是这部分需求。</p>\n  <p><strong>蓝峰单枪匹马，在鸿蒙生态的助力下一步步搭建起这个年轻人的AI运动搭子，在这个过程中，鸿蒙的价值并不仅仅是技术支持，而是把挡在个人开发者面前的门槛降低，让他们有更充分的空间创造属于他们一个人的可能性。</strong></p>\n  <h3><strong>唤醒传统纹样，让非遗走进日常设计</strong></h3>\n  <p>除了文化探索和健身管理，鸿蒙创新赛中还有年轻人关注着非遗传承。</p>\n  <p>前段时间，中国国际消费品博览会上，广西壮族自治区主席韦韬花580元购买了一款蓝色凤蝶纹样壮锦手提包，现场扫码付款的视频迅速传播。随后“壮锦包”的相关话题在抖音播放量超过8000万次，“壮锦”话题播放量超过5.5亿次。</p>\n  <p>传统纹样就这样通过短视频闯进了吴忧的视野里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_4afde96ababa4388a11e8c63f2400133@15222052_oswg104909oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">吴忧和队友参赛，华为官方供图</p>\n  <p>在无锡工艺职业技术学院读大二的吴忧学的是视觉传达，平时就会经常接触到各种各样的视觉元素。她发现年轻人日常能看到、能使用的视觉元素更多的都是外来IP，它们简单、直接、传播效率高，很容易变成手机壳、帆布包、贴纸和各种周边。</p>\n  <p><strong>但传统纹样不同。每一个款式背后都有来源，有工艺，也有历史，如果没有宣传，根本没人会注意到它们的美丽和精致。</strong></p>\n  <p>吴忧和队友王迹想做“纹渊”，起点就在这里。它不只是一个非遗科普App，而是能将传统纹样从“被介绍的对象”，变成普通人和设计者都可以拿来使用的素材。一个没有设计基础的大学生，可以用它做一个首饰、包装、文创产品的初稿；一个设计师，也可以借它快速获得灵感，把传统纹样放进更现代的使用场景里。</p>\n  <p>把这个想法做成产品，难点并不在于“展示纹样”，而在于怎么让它真正可用。用户选中一个纹样之后，如何把它放到具体产品上，如何生成相应的3D效果，如何让设计结果能够继续被编辑和使用，才是纹渊需要解决的问题。团队在开发中最难的地方，也正是这个从纹样到产品效果的转化过程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_69d89dfd91864e0ba0dbcd48b0074516@15222052_oswg1074199oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纹渊App设计方案，受访者供图</p>\n  <p><strong>鸿蒙提供的支持，逐渐在这个环节显现出来。</strong>团队查到开发文档中关于3D高斯建模的能力后，用了几天时间尝试把它接进项目，解决纹样和产品模型结合的问题。对纹渊来说，这不是一个用来“炫技”的功能，而是让传统纹样从二维图案走向实际产品预览的一个支点。</p>\n  <p><strong>另一个重要能力，是一次开发、多端部署。</strong>吴忧深知，大部分设计从业者会在电脑上处理设计素材，所以，只开发手机端应用是远远不够的。而鸿蒙的这项能力让这个学生团队不必为不同设备重新搭几套系统，而是能够专注精力优化产品本身，把多端部署的工作交给鸿蒙。</p>\n  <p>当然，AI对开发和创作门槛的降低也对吴忧帮助不小。吴忧说，如果没有AI参与，工作效率至少会减半。鸿蒙开发文档里的AI问答、开发工具中的AI助手，以及社区里已有的问题和答案，大大提���了他们在开发过程中的效率。</p>\n  <p>未来，她还希望可以接入小艺智能体，让用户根据自己的需求，对纹样做二次创作，再应用到具体产品上。</p>\n  <p><strong>依托鸿蒙生态的支持，吴忧把传统纹样带入了更多年轻人的视野里，让这些美丽精致的非遗文化不再仅仅停留在书本上，而是有了二创和落地成为产品的可能。</strong>这不仅是在实现年轻开发者的梦想，也是在为非遗传承打开一扇窗。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_93bd9a37d3f8409c9a542f31a0ad6d87@15222052_oswg351oswg1080oswg43_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从文化探索、到健康管理、再到非遗传承，它们指向的领域不同，但底层逻辑是相似的：这些年轻开发者并不是站在一个遥远的技术视角上发明需求，而是先作为用户，感受到生活里的某个缺口，再试图用代码将其补齐。</p>\n  <p>这也是HarmonyOS创新赛极客赛道真正值得被看见的地方。</p>\n  <p><strong>在这场比赛里，20支团队比拼的不只是代码速度，而是能不能把一个具体的生活观察，转化成真正可运行、可体验、可继续生长的作品。</strong>对年轻开发者和中小开发者来说，这样的赛场提供了一种少见的机会：他们不必先成为成熟公司的团队，也不必等到拥有足够完整的资源配置，才开始验证自己的想法。</p>\n  <p>鸿蒙生态在其中扮演的角色，并不仅仅是一个开发平台，更是让中小开发者创意落地的舞台。系统级AI能力、一次开发多端部署、AI Coding、开发文档、社区反馈和赛事活动，共同构成了一条从想法到Demo、从作品到展示的路径。<strong>复杂创新不再只属于大组织，小团队也有机会在同一个生态里完成表达。</strong></p>\n  <p>这也正是鸿蒙创新赛的价值所在。它不是把开发者关进一个封闭的技术命题里，而是让他们把自己的兴趣、专业、生活经验和系统能力连接起来。技术不再只是课本里的知识点，也不是企业发布会上的参数，而是可以被年轻人拿来解决真实问题的工具。</p>\n  <p>而在极客赛道之外，这种机会还在继续向更广泛的高校学生打开。</p>\n  <p>2026HDC，面向全国高校学生的鸿蒙高校创新赛正式开赛，并首次进入“全国普通高校大学生竞赛排行榜”。这意味着，它不只是一场面向少数技术高手的开发比赛，也成为高校学生可以认真投入的一段创新经历。对于学生来说，国赛背书、前沿技术、专家指导和项目经验，都会变成简历、作品集和面试中可以被讲述的内容。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_62283613c97541ba862b192d85fefe93@15222052_oswg640648oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">鸿蒙高校创新赛，华为官方供图</p>\n  <p>更重要的是，它降低了年轻人参与创新的心理门槛。专业不限、自由组队，AI Coding提供辅助，系统级创新能力也在被更简单地集成和调用。一个脑洞、一张设计稿、一个Demo，都有机会被带上鸿蒙赛场。参赛者可以在作品展播、校园传播、开发者社区展示中获得反馈，也有机会让创意从比赛走向更真实的应用场景。</p>\n  <p><strong>从极客赛道到高校创新赛，鸿蒙生态正在做的，是让创新不只发生在少数成熟开发者手中。</strong>它给年轻人提供了一个更开放的入口：零基础可以尝试，小团队可以组队，跨专业也能协作；有想法的人不必把创意停留在文件夹里，而是可以真正把它做出来，展示出来，再继续往前推一步。</p>\n  <p><strong>当创意被看见，它才有可能长成作品；当作品被放进真实生态里，它才有机会继续走向应用。这或许正是鸿蒙创新对于年轻开发者最直接的意义。</strong></p>\n  <p>查阅链接：<br />（https://developer.huawei.com/consumer/cn/activity/incentive/C4?ha_source=houlangyanjiusuo&amp;ha_sourceId=89000237）了解鸿蒙高校创新赛。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_73d3e4a729ce40558850dae121ae7af1@15222052_oswg3021oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_368a8710115b432191f87c2e47fbd8bd@15222052_oswg13015oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>你有想要尝试自己开发App的想法吗？</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/J8AUGWy7VO5yZWWTxu3-Iw\" rel=\"noopener noreferrer\" target=\"_blank\">“后浪研究所”</a>，作者：大倪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-15T09:46:34+00:00", "fetched_at": "2026-06-16T03:38:55.805184+00:00", "fingerprint": "be8d6466d031930f"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜我国成功发射吉星高分07C04星等8颗卫星；小红书或已准备好本月在香港提交IPO申请；智谱：公司已推出最新一代旗舰模型GLM-5.2", "url": "https://36kr.com/p/3854486447510535?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>支付宝：政务AI助手“晓政”服务突破1亿次</strong></p>\n  <p>36氪获悉，支付宝宣布，旗下政务AI助手“晓政”累计服务次数突破1亿次。截至目前，“晓政”服务已覆盖16000项服务事项，成功落地助力70余家部委及省级政务机构，业务场景全面覆盖公积金、人社、公安、不动产等民生领域。</p>\n  <p><strong>小雨智造与地瓜机器人正式宣布达成战略合作</strong></p>\n  <p>36氪获悉，6月12日，小雨智造与地瓜机器人正式宣布达成战略合作，双方将围绕“工业具身大脑+端侧大算力”展开深度协同，推动具身智能技术从实验室走向工业产线，共同打造面向工业制造的高性能软硬一体化解决方案，助力智能制造迈向新阶段。</p>\n  <p><strong>小红书或已准备好本月在香港提交IPO申请</strong><br />据透露，小红书科技有限公司正准备在本月底前秘密向香港提交首次公开募股（IPO）申请。（新浪财经）</p>\n  <p><strong>深圳盒马变更负责人</strong><br />36氪获悉，天眼查 App 显示，近日，深圳盒马网络科技有限公司发生工商变更，金瓯卸任法定代表人、董事，由廖榜鹏接任。深圳盒马网络科技有限公司成立于2017年6月，注册资本5000万美元，经营范围包括计算机网络专业领域内的技术开发、技术咨询及技术服务等。股东信息显示，该公司由盒马（香港）有限公司全资持股。</p>\n  <p><strong>阿里菜鸟要解散？最新官方回复“假的，纯属谣言”</strong><br /><br />36氪获悉，针对网传阿里菜鸟或将解散的消息，菜鸟方面回应：“假的，纯属谣言”。</p>\n  <p><strong>上汽集团等入股具身智能机器人公司璇玑动力</strong><br />36氪获悉，天眼查 App 显示，近日，深圳璇玑动力科技有限公司发生工商变更，新增东方精工、上汽集团旗下上海上汽创远创业投资合伙企业（有限合伙）等为股东，同时注册资本由约5777.8万人民币增至约6733.3万人民币。</p>\n  <p><strong>五粮液旗下宜宾环球集团增资至约8.8亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，四川省宜宾环球集团有限公司发生工商变更，注册资本由约8.4亿人民币增至约8.8亿人民币。该公司成立于2004年7月，法定代表人为刘兴，经营范围包括企业管理、货物进出口、玻璃制造、普通玻璃容器制造、日用玻璃制品制造等，由四川省宜宾五粮液集团有限公司全资持股。</p>\n  <h2>投融资：</h2>\n  <p><strong>“秩益科技”技连续完成亿元级A轮及A+轮融资</strong></p>\n  <p>36氪获悉，据秩益科技消息，近日，“秩益科技”连续完成亿元级的A轮及A+轮融资。其中，A轮由老股东沂景资本独家增资；A+轮由毅达资本领投、比丘资本战略加持。熙桥资本担任本轮财务顾问。</p>\n  <p><strong>“极佳视界”再获10亿元B2轮融资</strong></p>\n  <p>36氪获悉，据极佳视界消息，近日，物理AGI企业“极佳视界”再获10亿元B2轮融资，本轮融资由新加坡跨境投资机构狮城资本、中国-比利时基金（中比基金）、建投投<strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong>资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等全球国家队基金、产业资本、财务机构、国资平台共同投资，国中资本、达晨财智、图灵资管等多个老股东持续超额加注。本轮融资将主要用于“双金字塔”数据与算法体系的持续投入、物理AGI基础模型的研发迭代，以及C端家庭场景与B端工业场景的规模化落地。</p>\n  <h2>新产品：</h2>\n  <p><strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong></p>\n  <p>36氪获悉，智谱港交所公告，董事会欣然宣布，本公司已推出最新一代旗舰模型GLM-5.2，模型提供达到1M的长上下文，并在长程任务中继续保持领先，将遵循MIT协议开源。预计该模型将助益本公司后续开放平台及API业务的调用量提升。</p>\n  <h2>今日观点：</h2>\n  <p><strong>机构：2026年显示面板需求下调，预计出货量将下降6%</strong><br />36氪获悉，根据Omdia的显示面板长期需求预测追踪报告，全球显示面板市场前景显著恶化，2026年需求预测大幅下调。单位需求预计将同比下降6%，较此前预测的2%降幅大幅下调。显示面板面积需求增长率也从此前预期的6%下调至仅1%。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>我国成功发射吉星高分07C04星等8颗卫星</strong></p>\n  <p>我国成功发射吉星高分07C04星等8颗卫星。（央视新闻）</p>", "category": "tech", "published_at": "2026-06-15T13:48:20+00:00", "fetched_at": "2026-06-16T03:38:55.805178+00:00", "fingerprint": "f709ad439501bbf0"}, {"source": "36氪 - 最新文章", "title": "Pocket 4P双摄来了：手机影像之外，大疆正在重做一台“口袋电影机”", "url": "https://36kr.com/p/3854510160549124?f=rss", "summary": "<p>在手机影像能力不断逼近专业设备的今天，一个问题变得越来越尖锐：独立影像设备，还有存在的必要吗？</p>\n  <p>6月15日，大疆正式发布 Osmo Pocket 4P，将这台口袋云台相机推向更专业的创作场景。作为 Pocket 系列的新一代旗舰产品，Pocket 4P 定位为“装进口袋里的电影机”，搭载双摄系统、17级动态范围与 D-Log 2 专业色彩曲线，试图在口袋级设备中进一步容纳专业影像能力。</p>\n  <p>Pocket 4P 以&nbsp;3799元起售，多平台预订量持续走高。</p>\n  <p>对于一个原本被视为“手机影像补充”的品类来说，这种热度本身就提出了一个新的问题：当手机已经足够强，为什么仍然有越来越多人愿意为一台独立影像设备买单？</p>\n  <p>过去几年，旗舰手机几乎每一次更新都在吞噬传统相机的边界。从多摄系统、长焦镜头、计算摄影，到 Log 视频、AI 修图和一键出片，手机已经成为绝大多数普通用户最顺手的影像工具。</p>\n  <p>但另一边，一个看起来有些反常识的品类，却在井喷增长。</p>\n  <p>在丽江玉龙雪山的拍摄现场，拿着大疆 Pocket 的用户，已经不再只是数码爱好者。旅行博主、亲子用户、美食探店创作者、综艺节目组，甚至很多第一次尝试视频创作的人，都在用这台小机器完成日常表达。</p>\n  <p>“大疆首创了 Pocket 这一产品形态，也确实得到了市场和广大用户的认可。”在大疆「视界无边」影像探索之旅丽江站的Pocket 4P媒体先享会现场，Pocket 系列产品经理这样开场。</p>\n  <p>据他介绍，Pocket 3 发布之后，整个产品线出现了爆发增长，基本每年翻倍。到今年，Pocket 3 的国内市场规模已经大于微单市场。这意味着，对于大量普通用户来说，出门旅行、记录生活、拍摄短视频时，云台相机正在成为比传统相机更自然的选择。</p>\n  <p>这背后真正值得讨论的，并不是产品又多了哪些参数，而是一个更大的问题：当手机越来越强，大疆为什么仍然要做 Pocket？不断迭代的Pocket为什么还能持续且爆发式增长</p>\n  <p>。答案或许藏在这条产品线过去8年的演化里。</p>\n  <p>Pocket 的八年，不是一台设备不断堆参数的过程，而是一家公司不断重新理解“普通人到底需要什么影像工具”的过程。</p>\n  <h3><strong>Pocket 不是一开始就为 Vlog 而生</strong></h3>\n  <p>今天提到 Pocket，很多人会自然想到 Vlog、自拍、旅行记录和轻量创作。但在一开始，大疆并不是这样定义它的。</p>\n  <p>2015 年，大疆第一次把 Inspire（悟）无人机上的云台相机“小脑袋”拿到手持设备上，推出 Osmo 系列。这是手持云台相机形态的源头。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_86bb7cd0dfea466d987bac3ad553eefc@430412560_oswg164672oswg830oswg762_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>彼时的大疆，更多是站在专业影像的视角思考问题：更稳定的画面、更大的传感器、更强的后期空间。之后，大疆陆续推出 Osmo+、Osmo Pro 和 Osmo RAW，甚至加入 M4/3 卡口联盟，让设备可以更换镜头、录制无损 RAW，为专业创作留下更大空间。</p>\n  <p>但这些产品也有明显的问题：太专业、太重、门槛太高。“我们当时就在想，有没有可能把它进一步缩小，让每个人都能享受云台相机拍摄的体验。”产品经理回忆。</p>\n  <p>于是，2018 年，Osmo Pocket 发布。它极其小巧，可以轻松放进口袋，当时被称为“口红相机”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_7951fdbf463540c4b9b61543113b820c@430412560_oswg731597oswg822oswg548_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>但一个容易被忽略的事实是，初代 Pocket 并不是一台真正意义上的 Vlog 相机。</p>\n  <p>产品经理表示，Pocket 1 的焦段大概在 26mm 左右，自拍并不舒服。“以至于刚发布的时候，我们也没有打 Vlog 的概念。”一方面，当时国内还没有真正形成 Vlog 文化；另一方面，产品本身也还没有完全适配自拍表达。</p>\n  <p>真正的变化发生在后面。当 Pocket 1 配上延长杆之后，用户开始拿它自拍、讲话、记录日常，大疆才逐渐意识到：用户需要的并不是一台“小型稳定相机”，而是一种更轻、更低门槛的表达方式。</p>\n  <p>某种程度上，Pocket 的产品定义不是一开始就被设计出来的，而是在用户的使用中被不断刷新出来的。于是到了 Pocket 2，大疆开始真正主打 Vlog。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_2fd958122f8446a7a512ed9bc6076a9a@430412560_oswg427222oswg830oswg468_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>这一代最关键的变化，是把焦段调整到 20mm，自拍更友好。同时，Pocket 2 也首次尝试无线麦克风生态。虽然当时的无线麦克风只能连接 Pocket 2，但后来 DJI Mic 独立发展成多个系列，能直连相机、手机和 Osmo 系列设备。</p>\n  <p>从 Pocket 1 到 Pocket 2，本质上是一次产品定位的变化：从“带增稳的画质工具”，转向“口袋里的 Vlog 相机”。但这还不是 Pocket 真正爆发的时刻。</p>\n  <p>Pocket 2 发布后，大疆发现另一个问题：当用户把它和索尼、佳能等传统卡片机对比时，Pocket 的优势是小巧、稳定、方便，但在“拍人好看”这件事上，还不够突出。对于 Vlog 来说，这恰恰是最重要的能力之一。</p>\n  <p>于是，Pocket 3 的重点不再只是“能不能拍”，而是“拍出来好不好看”。一英寸 CMOS、两英寸旋转屏、色彩风格，开始共同推动这条产品线进入新阶段。</p>\n  <p>产品经理提到，Pocket 3 之后，很多美图、剪映等应用里甚至出现了 Pocket 3 风格的滤镜。也就是说，Pocket 开始拥有被大众认可的色彩风格和影像审美。这其实是一个很重要的转折。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_7484aa599213450abc92273f689ee7c0@430412560_oswg468980oswg828oswg622_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>从 Pocket 1 到 Pocket 4，这条产品线经历了几次认知跃迁：Pocket 1 解决的是“稳定+画质”；Pocket 2 解决的是“Vlog 自拍成立”；Pocket 3 解决的是“拍人好看”；Pocket 4 则试图解决“更多场景下的创作表达”。</p>\n  <p>它不再只是一个自拍设备，而是在向“口袋里的影像系统”演进。</p>\n  <h3><strong>为什么 Pocket 3 才真正爆发？</strong></h3>\n  <p>如果从结果看，Pocket 系列真正进入大众视野，是从 Pocket 3 开始。但这并不意味着前两代失败了。恰恰相反，在大疆内部看来，Pocket 1 和 Pocket 2 在产品表现上都已经取得了不错的成绩，但它们的影响力还主要在科技圈。</p>\n  <p>产品经理对36氪解释，一款产品要真正走向大众，需要同时满足两件事：首先产品力必须过硬；其次，还要看它能不能破圈。Pocket 3 的爆发，正是这两件事同时发生的结果。</p>\n  <p>从产品力来看，Pocket 3 已经站到了同类设备第一梯队。一英寸传感器带来的动态范围、位深和画质表现，让它不再只是一个“方便的小机器”，而是开始具备让用户认真创作的能力。但仅有产品力并不足以带来规模爆发。</p>\n  <p>真正重要的是，它被更多圈层看见了。真人秀、综艺节目和内容制作团队，是 Pocket 3 破圈的重要推手。很多导演发现，这种小型设备可以替代一部分传统拍摄设备，进入更贴近人物的场景。艺人可以自己拿着拍，画面更自然，也更有亲近感。</p>\n  <p>当大众在综艺、剧集、短视频里不断看到这样一种设备，又在数码博主那里看到它的评测，再叠加明星的自发使用，Pocket 3 的认知开始被不断叠加。</p>\n  <p>它不再只是数码圈里的一台新设备，而变成一种大众能够理解、模仿和购买的创作工具。这也是 Pocket 3 与前两代最大的差别。前两代证明了产品成立，第三代证明了它可以进入更大的社会场景。</p>\n  <p>在这个过程中，大疆也持续通过功能更新维持讨论度。例如视频转实况、色彩滤镜、直出效果等功能，未必是最硬核的参数升级，却都实实在在落在了用户最具体的痒点和痛点上：画面能不能更好看、拍完能不能更方便地发、内容能不能更省事地分享。对于大众用户来说，这些往往比抽象的参数提升更重要，也更容易转化为实际购买和自发传播。</p>\n  <p>这背后对应的是消费电子产品一个普遍规律：产品不会因为“更强”而自动爆发，真正带来增长的，往往是它恰好升级到了用户最在意的需求上。当功能足够有用，用户就会用购买和分享投票，产品也才有机会完成真正意义上的破圈。</p>\n  <p>Pocket 3 的成功，本质上不是一次单纯的硬件升级，而是一次产品升级与用户需求精准对位的结果。也正因为如此，它才能在同一个时间窗口里，同时完成口碑积累、场景扩展和大众传播，最终迎来真正的爆发。</p>\n  <p>到了 Pocket 4，大疆面对的课题随之变化。既然 Pocket 已经证明了自己不只是一个小众数码产品，那么下一步，它能不能从一个“爆款单品”，成长为一个更完整的影像系统？</p>\n  <p>这也是 Pocket 4 和 Pocket 4P 同时被摆到台前的原因。大疆这一次没有只推出一个型号，而是区分了 Pocket 4 和 Pocket 4P。按照产品经理的说法，Pocket 4 更适合普通用户vlog记录生活，Pocket 4P 则面向有更高影像追求的创作者，尤其是对人像、中焦、调色和电影感有更高要求的人群。</p>\n  <p>这背后意味着，Pocket 品类开始进入更细分的阶段。就像传统相机会分入门机、进阶机、专业机一样，当一个品类规模足够大之后，它不可能永远只靠一台机器覆盖所有用户。</p>\n  <p>Pocket 4 是大众化基础款，Pocket 4P 是进阶创作者版本。大疆选择提前官宣 4P，也是为了让用户在购买时，有更充分的选择权。这是一种很典型的成熟品类打法。它说明 Pocket 不再只是“出一代卖一代”的产品，而开始拥有清晰的产品分层和用户分层。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_d6edabe331394abbb955f4c5c901439b@430412560_oswg462405oswg1377oswg965_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h3><strong>Pocket 4P&nbsp;，如何将电影机装进口袋</strong></h3>\n  <p>从先享会来看，Pocket 4P 最容易被注意到的，是一系列影像参数。</p>\n  <p>例如，搭载全新 CMOS，支持 17 级超高动态范围；引入 D-Log2 色彩曲线，能够更好衔接电影机工作流；新增 3 倍中焦镜头，覆盖更丰富的焦段；支持 4K 高帧率视频；同时补齐补光灯、取景器、续航手柄等生态配件。</p>\n  <p>参数之外，Pocket 4 真正的变化在于，它开始正面回答一个问题：在手机影像已经足够强的时代，独立影像设备还能靠什么存在？</p>\n  <p>如果大疆Pocket 4 给出的答案是“比手机更全能”，那么Pocket 4P&nbsp;则是在特定场景下提供更为确定的影像能力，并在关键创作场景中呈现出接近单反，甚至“小型电影机 / 口袋电影机”级别的画面表现。</p>\n  <p>具体来说首先是更稳定。云台是大疆长期技术积累最深的能力之一。产品经理在采访中提到，云台技术并非简单的硬件堆叠，而是依赖大量算法经验、真实使用数据以及多代产品的持续迭代。其背后的前馈控制与运动补偿逻辑非常复杂，需要长期积累才能实现顺滑、可靠且自然的画面表现。这也是即便手机厂商进入云台相机赛道，也很难在短时间内复现同等体验的关键原因之一。</p>\n  <p>第二是更像创作工具。手机的优势是随手可得，但它也是一个高度综合的设备。它要兼顾通信、社交、娱乐、计算、拍照、视频等无数任务。Pocket4&nbsp;则更专注，它的握持、屏幕、云台、焦段和配件，都围绕拍摄展开。</p>\n  <p>比如 Pocket 4P 的 3 倍中焦，并不是为了简单放大画面，而是为了拍出更好的空间压缩感、虚化和人像氛围。产品经理解释，他们曾经考虑过双一英寸方案，但如果放两个一英寸传感器，上方镜头的光圈就会被迫缩小，最终反而损失虚化和质感。最后大疆选择的是 1 英寸主摄加 1/1.3 英寸中焦，并尽可能把光圈做大。这背后是一个重要取舍：在小体积设备里，并不是大底一定最优，而是要服务最终画面。</p>\n  <p>第三是更强的软硬件耦合。手机厂商多采用 MTK 或高通方案，而大疆的芯片和系统更多是围绕影像服务。再加上大疆在云台、色彩、镜头、传感器、算法和硬件结构上的长期积累，最终形成了比较独特的画面风格。</p>\n  <p>影像色彩尤其如此。它不像算力或分辨率那样容易量化，更多依赖审美、时间和用户认可。市场上真正被广泛接受的色彩风格并不多，而 Pocket 3 在色彩上的认可，是大疆继续往前走的重要基础。</p>\n  <p>第四是生态化。Pocket 4P&nbsp;的补光灯、遥控取景器、无线麦、内置存储、直出功能和手势识别，本质上都在解决一件事：提升单人创作效率。比如新增柔光补光灯，没有独立电池，而是通过机身取电，尽可能做到小而轻，功耗低，并且可以与机身联动：暗光时自动打开，自拍时补光，向前拍摄时关闭。</p>\n  <p>再比如手势识别。产品经理提到，此前有综艺嘉宾对着 Pocket 3 挥手，希望它能自动跟拍，于是大疆就在后续的Pocket产品中顺势加入了智能的手势控制功能，&nbsp;比“耶”手势开拍，比“手掌”手势开启智能跟随，让一个人也能轻松拍出“他拍感”。</p>\n  <p>这些小功能单独看都不算颠覆，但合在一起，会让 Pocket 更接近一个完整创作系统。它想解决的不是“能不能拍”，而是“一个人能不能更轻松地拍好”。</p>\n  <p>当然，Pocket面临的竞争也会越来越激烈。随着 Pocket 3 销量增长，这个赛道已经被更多玩家看见。手机厂商、运动相机厂商、影像设备厂商，都可能进入云台相机市场。但大疆的护城河并不只是一颗传感器或一个云台结构，而是长期形成的系统能力：芯片、影像调校、云台控制、供应链定制、软硬件耦合，以及对用户使用场景的理解。</p>\n  <p>Pocket 系列很多零部件并非公模设计。镜头、芯片、Sensor、屏幕、电池等，都需要围绕产品形态进行定制开发。也因此，即便其他厂商拆解 Pocket 3 后发现有降本空间，如果没有正向设计和供应链摸排，也很难快速复制同样体验。</p>\n  <p>从成本和价格上看，Pocket 4 的定价低于 Pocket 3，也与规模效应有关。Pocket 3 的销量爆发，加之&nbsp;Pocket 4 与 Pocket 3 配件通用性较高，模具与物料费用被摊薄，即便���增内置存储，也仍然有更低价格空间。</p>\n  <p>这说明，Pocket 这条产品线已经开始进入规模化正循环：销量提升带来成本下降，成本下降带来价格优化，价格优化又进一步扩大用户基础。</p>\n  <p>回到最初那个问题：手机影像越来越强，大疆为什么还要做 Pocket？因为手机解决的是“人人都能记录”，而 Pocket 想解决的是“普通人也能更容易拍出作品感”。</p>\n  <p>它不需要在所有场景下战胜手机。它只需要在旅行、Vlog、单人创作、人像、运动跟拍、综艺记录这些场景里，成为更确定、更顺手、更能出片的工具。</p>\n  <p>从这个意义上看，Pocket 4 并不是一次简单的新品迭代。它代表的是大疆对一个成熟品类的重新划线：不是所有独立影像设备都会留下来，但那些在具体场景中足够轻、足够稳定、足够有表达力的设备，仍然会有自己的位置。</p>\n  <p>在Pocket 4 基础上，大疆迭代出的Pocket 4P 差异化核心，同样在于它承接的是大疆独有的能力体系，而不只是一次单点硬件升级。大疆是 Pocket 品类的开创者和领导者，同时也是少数真正打通专业影像线与消费影像线的品牌。过去十年，大疆如影系列在专业影像和云台稳定技术上持续积累，相关能力获得过奥斯卡、艾美奖等国际知名奖项认可；大疆电影机如影 4D 在影像色彩调教、稳定系统、专业剧组使用和真实场景经验上的沉淀，也都给了 Pocket 4P 很强的底层支撑。</p>\n  <p>所以 Pocket 4P 的竞争力，不只是双摄带来的焦段扩展，更在于它把专业线验证过的稳定、色彩和创作经验，压缩进了一个口袋尺寸的机身里。双摄让 Pocket 第一次拥有更完整的镜头语言，再结合大疆成熟的云台能力和场景理解，它已经不只是便携记录设备，而是具备了媲美迷你电影机的创作能力。</p>\n  <p>回顾大疆在手持云台领域的12年深耕，其实是一部不断拓宽行业边界的演进史。从2018年初代Osmo Pocket 开创并定义“口袋云台相机”品类，攻克极限空间下的小型化与散热难题；再到Pocket 3通过巧妙的旋转屏结构，开启手持云台大底画质时代。如今全新Pocket 4P的问世，将17级动态范围、D-Log 2专业色彩以及智能跟随8.0技术，毫无妥协地塞入掌心大小的机身中。所以大疆真正做的，也许不是一台小相机。而是在回答一个更长线的问题：当人人都能拍视频之后，什么样的设备，才能让普通人更容易表达自己？</p>", "category": "tech", "published_at": "2026-06-15T14:13:11+00:00", "fetched_at": "2026-06-16T03:38:55.805170+00:00", "fingerprint": "c980b844e85368db"}, {"source": "36氪 - 最新文章", "title": "8点1氪｜山姆总部因食品安全问题被约谈；智谱股价暴涨，创上市以来单日成交新高；美伊确认达成协议，国际油价显著下跌", "url": "https://36kr.com/p/3855082873476102?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>国内品牌金饰价格普涨</li>\n   <li>小红书公布世界杯开赛数据</li>\n   <li>阿里巴巴达摩院退出旗下科技公司</li>\n   <li>罗马仕接连变更法定代表人</li>\n   <li>遇见小面创始人向“渝见小面”致歉</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>针对多发食品安全问题，市场监管总局约谈山姆总部</strong></p>\n  <p>记者15日了解到，针对一段时期以来监管发现和媒体曝光的山姆线下门店及线上网店多发的食品安全问题，近日，市场监管总局依法对沃尔玛（中国）投资有限公司（即山姆总部）负责人进行了责任约谈，要求其严格按照《中华人民共和国食品安全法》，以及《食品销售连锁企业落实食品安全主体责任监督管理规定》《网络食品销售经营者落实食品安全主体责任监督管理规定》等法律法规规定开展食品经营活动，始终树牢食品安全意识，严格落实食品安全主体责任，自觉践行企业社会责任，严防全链条食品安全风险，切实保障公众饮食安全。</p>\n  <p>针对被市场监管总局约谈，山姆方面回应记者称，公司已由管理层牵头成立专项整改工作组，第一时间启动全渠道、全链路专项自查整改。我们将严格遵照相关法规及监管要求，全面优化食安管控和商品品控，严守食品安全底线、提升会员体验。（央视新闻、中国新闻网）</p>\n  <p><strong>智谱股价暴涨，创上市以来单日成交新高</strong></p>\n  <p>6月15日，港股AI大模型板块全线走强，其中，国产大模型龙头智谱（02513.HK）早盘高开近15%后持续拉升，盘中最高涨幅一度达到47.6%，截至午市收盘，智谱涨幅收窄至28.35%，报1408港元，总市值突破6277亿港元，单日成交额超52.08亿港元，创下上市以来单日成交新高。</p>\n  <p>消息面上，6月12日，美国商务部依据出口管制相关授权，要求人工智能公司Anthropic暂停向所有外国国民（不论其身在美国境内或境外）提供其最新旗舰模型Claude Fable 5与Claude Mythos 5的访问权限。Anthropic收到美国出口管制禁令后，中国模型厂商迅速跟进、宣布全量开放。</p>\n  <p>6月13日，智谱宣布旗下开源旗舰GLM-5.2面向其Coding Plan全量用户开放（Lite/Pro/Max及团队版），并预告API上线，同时称模型权重按MIT协议开源。智谱表示，此次开放的新模型是公司迄今为止能力最强的开源模型，又指在前沿模型突然变得不可用的时刻，科技不应该只属于少数人，也不应该被随时收回。（界面新闻）</p>\n  <p><strong>美伊确认达成协议，国际油价显著下跌</strong></p>\n  <p>由于美国和伊朗确认达成协议及霍尔木兹海峡预计很快重新开放，国际原油期货14日在开始新一周交易后价格显著走低。截至美东时间14日下午6时15分，纽约商品交易所7月交货的轻质原油期货价格最低降至每桶80.25美元，跌幅达5.45%；8月交货的伦敦布伦特原油期货价格一度跌至每桶83.51美元，跌幅为4.37%。</p>\n  <p>另据国际航运信息平台“海上交通网站”显示的船舶追踪数据，液化天然气运输船“迪沙”号15日通过霍尔木兹海峡进入阿曼湾。这是美国和伊朗达成协议后首艘通过霍尔木兹海峡的大型能源运输船。（央视新闻、新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong></p>\n  <p>36氪获悉，智谱港交所公告，董事会欣然宣布，本公司已推出最新一代旗舰模型GLM-5.2，模型提供达到1M的长上下文，并在长程任务中继续保持领先，将遵循MIT协议开源。预计该模型将助益本公司后续开放平台及API业务的调用量提升。</p>\n  <p><strong>智元远征A3机器人实现自主乒乓球对打</strong></p>\n  <p>智元公司15日宣布，旗下全尺寸人形机器人远征A3已实现自主乒乓球对打。据悉，远征A3可在无遥控、无脚本、无人工干预的情况下，自主完成视觉感知、轨迹预测、运动规划和击球控制等环节。（新华财经）</p>\n  <p><strong>腾讯元宝接入ima知识库</strong></p>\n  <p>36氪获悉，腾讯宣布元宝接入ima知识库。用户在元宝内搜索时，可直接调用ima公开知识库中沉淀的海量专业知识库内容，获得更精准、可溯源的AI回答。同时，点击信源引用卡片，还可直接跳转至ima原文，并一键加入个人知识库。目前，ima知识号已覆盖金融、法律、医疗、教育等20余个行业，沉淀海量专业文件，知识内容被应用超过1.4亿次。</p>\n  <p><strong>百度搭子DuMate完成核心引擎升级</strong></p>\n  <p>36氪获悉，百度搭子DuMate完成核心引擎升级，通过Harness引擎及多项工程层面的持续调优，在保障Agent智能能力与任务执行效果不受影响的前提下，将任务执行过程中的Token消耗降低75%，对应用户积分消耗也相应减少75%。这也是国内通用智能体产品中，首次通过Harness引擎及工程优化实现任务消耗大幅下降。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>传阿里出价约118亿港元竞购朴朴超市？阿里暂无回应</strong></p>\n  <p>近日，有市场消息称，阿里巴巴计划出价15亿美元（约118亿港元）收购中国生鲜外卖平台福州朴朴电子商务有限公司。据知情人士透露，阿里的报价较高鑫零售早前出价高出逾一倍，或将引发一轮竞购战。对此，新浪科技向阿里官方进行求证，截至发稿对方暂无回应。（新浪科技）</p>\n  <p><strong>阿里菜鸟要解散？最新官方回复“假的，纯属谣言”</strong></p>\n  <p>36氪获悉，针对网传阿里菜鸟或将解散的消息，菜鸟方面回应：“假的，纯属谣言”。</p>\n  <p><strong>李书福、张雪据悉达成合作意向</strong></p>\n  <p>据央视财经6月15日报道，近日，在《对话》节目录制现场，吉利控股集团董事长李书福向张雪机车创始人张雪发起“摩托车慢骑”趣味挑战。据了解，李书福和张雪已经达成了一些合作意向。两人在现场表示，将联手推动世界超级摩托车锦标赛（WSBK）在中国落地举办。（央视财经）</p>\n  <p><strong>中国“纯硅”成功突破，我国攻克硅基量子芯片关键材料</strong></p>\n  <p>记者15日从中核集团了解到，我国科学家在稳定同位素富集领域取得关键性突破，首次成功实现丰度超过99.99%的硅-28同位素自主量产，产品关键指标达国际先进水平。标志着我国在构建自主可控、协同高效的稳定同位素产业格局方面迈出实质性步伐。（央视新闻）</p>\n  <p><strong>国内品牌金饰价格普涨，周生生金价重回1300元</strong></p>\n  <p>现货黄金震荡走高，国内金饰克价15日也随之上涨。周生生足金首饰克价1306元，较14日1274元涨了32元；老凤祥15日足金首饰克价1290元，较14日1271元涨了19元；老庙黄金足金首饰克价1299元，较14日1271元涨了28元。（财联社）</p>\n  <p><strong>原“死了么”App团队计划出让5%股份募资1000万，公司估值或达2亿元</strong></p>\n  <p>据报道，原“死了么”App团队计划募资1000万，出让公司5%股份，目前“死了么”App已改名为“在么在么”。“在么在么”披露了未来18个月的融资路线图。公司计划融资1000万元，从街道试点向区县复制样板迈进。创始人郭先生表示，资金将重点投向产品研发、市场拓展、交付运营及合规储备，其中产品研发占比最大为40%，市场拓展占比30%，交付运营占20%。（财联社）</p>\n  <p><strong>小红书公布世界杯开赛数据，平台直播在线人数创历史峰值</strong></p>\n  <p>36氪获悉，6月15日，小红书披露世界杯开赛前三日平台数据。观赛直播层面，开赛首日小红书世界杯直播在线观看人数，较赛事开赛前增长55倍，打破平台直播在线人数历史峰值，创下全新纪录。开赛前三日内，直播间球迷累计互动次数达到9000万次。</p>\n  <p><strong>“存款搬家”最新进展？业内人士：真实存在但并非大规模迁移</strong></p>\n  <p>6月15日讯，2026年，市场对“存款搬家”的讨论热度依旧不减，多家机构判断今年将迎来大量长期定期存款的集中“到期潮”，年内到期定存规模可达30万亿元至70余万亿元。业内人士表示，从二季度的数据来看，这个现象没有发生，或者说发生的规模比较小。当前A股呈现鲜明的结构性牛市特征，阶段性回调风险始终存在，这也会影响部分投资者的心态，“因此，‘存款搬家’的幅度没有大家想象中那么大，对市场的冲击也相对有限。”（21财经）</p>\n  <p><strong>立昂微：自6月15日起，对功率芯片业务全系产品价格调涨10%-15%</strong></p>\n  <p>36氪获悉，近日立昂微对客户发出产品价格调整通知函，对全系列产品进行涨价。公司表示，受上游原材料价格持续上涨影响，公司综合生产成本大幅增加，为保障产品品质、服务质量及供货稳定，自6月15日起，对功率芯片业务全系产品价格调涨10%—15%。</p>\n  <p><strong>安克创新据悉开始评估投资者对其香港上市的兴趣，筹资不超过7亿美元</strong></p>\n  <p>知情人士称，中国消费电子产品制造商安克创新已开始评估投资者对其香港上市的兴趣。知情人士称，该公司计划在未来数周通过香港上市筹资不超过7亿美元。文件显示，中金、高盛和摩根大通为联席保荐人。安克创新暂未回应置评请求。（新浪财经）</p>\n  <p><strong>阿里巴巴达摩院退出旗下科技公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，大蛮驴智能科技（浙江）有限公司发生工商变更，企业名称变更为杭州元识智瞳科技有限公司，原股东阿里巴巴达摩院（深圳）科技有限公司退出。该公司成立于2022年12月，注册资本5000万人民币，法定代表人为苏文博，经营范围包括电子元器件批发、电子元器件零售、电子元器件与机电组件设备销售等，现由上海模因智瞳科技有限公司全资持股。</p>\n  <p><strong>超大比例限售股解禁压顶，瑞玛精密跌停，公司回应</strong></p>\n  <p>6月15日早盘，瑞玛精密跌停，跌停价报29.59元/股。消息面上，6月15日，公司约2696.36万股定向增发限售股解禁，占总股本18.01%。发行价为23.44元/股，当前股价与发行价相比存在溢价，市场抛压较大。对此，瑞玛精密方面回应，股价受多重因素影响，此次下跌可能有一部分是定向增发限售股解禁的原因，盘面是市场买卖决定的。公司目前生产经营一切正常，公司业务没有明显的季节性周期特点，二季度业绩等情况以公司公告为准。（中证报）</p>\n  <p><strong>遇见小面创始人向“渝见小面”致歉</strong></p>\n  <p>“遇见小面”创始人宋奇6月15日发布致“渝见小面”的一封信，就“商标风波”致歉。信中称，“这两天，我闭门思过，想着除了道歉我到底还能做点什么。于是，我和团队决定将我们已注册的第35类‘渝见小面’商标无偿赠予你们，你们可以不用改换招牌而放心使用。如果你们还需要继续申请第43类商标（目前可以申请注册）或者还有其他方面的需要，我们也很愿意提供必要的帮助。”</p>\n  <p>据媒体报道，近日，河南南阳一家“渝见小面”餐饮店被连锁品牌“遇见小面”起诉商标侵权，对方律师称撤诉需赔偿七八千元，“渝见小面”负责人哭诉“我八块钱一碗的面，至少得卖1000碗，1000碗还有成本”。此事随之引发争议。6月13日，“遇见小面”发布关于商标事件的说明，称已第一时间沟通撤销对“渝见小面”的诉讼，并反思商标维权行动的流程。（界面新闻）</p>\n  <p><strong>罗马仕接连变更法定代表人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，深圳罗马仕科技有限公司发生工商变更，雷子权卸任法定代表人、董事，由雷秀容接任上述职务。该公司成立于2012年3月，注册资本600万人民币，经营范围包括电子产品的研发、设计、制造与销售等，由江门市聚安科技有限公司全资持股。变更记录显示，今年5月，雷社杏卸任法定代表人，由雷子权接任。</p>\n  <p><strong>美股三大指数集体收涨，SpaceX大涨超19%</strong></p>\n  <p>36氪获悉，6月15日收盘，美股三大指数集体上涨，纳指涨3.07%，道指涨0.92%，标普500指数涨1.66%。SpaceX大涨19.6%，总市值跃升至2.52万亿美元。芯片股走强，西部数据涨超16%，美光科技涨超10%，希捷科技涨超9%，英伟达涨超3%。热门中���股多数上涨，拼多多涨超2%，百度、京东、网易、理想汽车小幅上涨，阿里巴巴、蔚来、哔哩哔哩小幅下跌。</p>\n  <p><strong>古尔曼：折叠屏iPhone与触屏MacBook即将亮相</strong></p>\n  <p>当地时间6月14日，知名苹果产业链记者马克・古尔曼（Mark Gurman）在最新一期《Power On》通讯中指出，苹果下一代操作系统iOS 27与macOS 27的开发者测试版中，涌现大量底层代码、交互逻辑与适配接口线索，这意味着折叠屏iPhone和触屏MacBook即将到来。</p>\n  <p>古尔曼表示，苹果本次系统测试版内的多项底层调整并非面向现有iPhone、Mac设备的常规功能优化，而是苹果工程团队提前数年为全新硬件形态铺设的底层软件代码。这是苹果在为两款酝酿已久的新形态硬件做系统级铺路，分别是折叠屏iPhone和配备触控屏的MacBook。（界面新闻）</p>\n  <p><strong>消息称SK海力士准备向主要客户提供HBM4E样品，最早本月发货</strong></p>\n  <p>据Nate报道，业内人士透露，SK海力士目前正筹备向主要客户送样HBM4E，首批样品最快将于本月出货，最迟不超过下个月。业内分析指出，鉴于HBM4E计划于明年正式量产，今年下半年必须完成客户的测试验证与优化流程，因此目前的送样节点已十分紧迫。（财联社）</p>\n  <p><strong>Anthropic将就Mythos相关纠纷与特朗普政府展开会晤</strong></p>\n  <p>一名接近Anthropic公司的消息人士透露，公司多名高层管理人员将于6月22日在华盛顿特区同特朗普政府官员会面，力求化解这家人工智能企业近期与美国政府爆发的重大纠纷。一份声明显示，Anthropic6月12日收到一份出口管制指令，文件援引国家安全相关部门的要求，勒令该公司全面禁止所有外籍人士使用其最新两款人工智能模型Fable 5与Mythos 5，无论外籍人士身处美国境内还是海外。（财联社）</p>\n  <p><strong>马斯克：SpaceX到2030年可能实现1万亿美元的营收</strong></p>\n  <p>埃隆·马斯克14日表示，他的火箭公司SpaceX到2030年营收有望达到1万亿美元。此前两天，该公司刚刚上市，估值超过2万亿美元。（新浪财经）</p>\n  <p><strong>美国顶级基金经理：通胀和“巨无霸IPO”引发流动性紧缩，纳指年内恐跌35%</strong></p>\n  <p>美国一位顶级基金经理表示，由于通胀压力和“巨无霸IPO”引发的流动性紧缩共同作用，纳斯达克指数今年可能下跌35%，这将构成当前牛市行情的重大阻碍。过去两周，半导体和成长股普遍出现大幅波动，仅6月5日一天，纳斯达克指数就下跌了4.8%，也就是所谓的“黑色星期五”。晨星评级为五星的Leader Capital高质量收益基金（High Quality Income Fund，简称LCATX）的共同管理人Slavik Kolesnik表示，此类下跌是未来更大幅度下跌的早期迹象。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>小红书或已准备好本月在香港提交IPO申请</strong></p>\n  <p>据透露，小红书科技有限公司正准备在本月底前秘密向香港提交首次公开募股（IPO）申请。（新浪财经）</p>\n  <p><strong>立讯精密计划最快于7月在香港上市，拟融资不超过30亿美元</strong></p>\n  <p>IFR援引知情人士报道称，立讯精密计划最快7月份在香港上市，拟筹资20亿至30亿美元。（新浪财经）</p>\n  <p><strong>国仪量子技术（合肥）股份有限公司科创板IPO注册生效</strong></p>\n  <p>36氪获悉，国仪量子技术（合肥）股份有限公司科创板IPO注册生效。</p>\n  <p><strong>开封清明上河园股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件披露，开封清明上河园股份有限公司向港交所提交上市申请书。</p>\n  <p><strong>燧原科技科创板IPO获上市委会议通过</strong></p>\n  <p>36氪获悉，燧原科技科创板IPO获上市委会议通过，公司拟融资金额60亿元。</p>\n  <h2>投融资</h2>\n  <p><strong>“秩益科技”技连续完成亿元级A轮及A+轮融资</strong></p>\n  <p>36氪获悉，据秩益科技消息，近日，“秩益科技”连续完成亿元级的A轮及A+轮融资。其中，A轮由老股东沂景资本独家增资；A+轮由毅达资本领投、比丘资本战略加持。熙桥资本担任本轮财务顾问。</p>\n  <p><strong>“极佳视界”再获10亿元B2轮融资</strong></p>\n  <p>36氪获悉，据极佳视界消息，近日，物理AGI企业“极佳视界”再获10亿元B2轮融资，本轮融资由新加坡跨境投资机构狮城资本、中国-比利时基金（中比基金）、建投投资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等全球国家队基金、产业资本、财务机构、国资平台共同投资，国中资本、达晨财智、图灵资管等多个老股东持续超额加注。本轮融资将主要用于“双金字塔”数据与算法体系的持续投入、物理AGI基础模型的研发迭代，以及C端家庭场景与B端工业场景的规模化落地。</p>\n  <p><strong>“洛梵狄”完成新一轮数千万元B+融资</strong></p>\n  <p>36氪获悉，智能短出行核心零部件供应商“洛梵狄”已完成新一轮数千万元B+融资。本轮投资方包括国泰海通、达晨财智、以及广州黄埔科创母基金，老股东达晨财智在本轮中继续追加投资。本轮融资资金将主要用于持续的研发投入、产能扩张、全球销售网络建设及日常运营流动资金。其中，研发重点将聚焦于下一代智能内变速器的深耕。</p>\n  <p><strong>“世航智能”完成A轮融资，融资金额超过10亿元</strong></p>\n  <p>36氪获悉，海洋具身智能公司“世航智能”完成A轮融资，融资金额超过10亿元，这也是目前全球海洋机器人领域规模最大的单轮融资。本轮融资由两家芯片公司摩尔线程和昆仑芯的产业投资方上河动量基金、新加坡国有投资平台Vertex Growth、上市公司大洋电机等资方出资。另外，金沙江创投也在本轮追加投资，这已是其创始人朱啸虎第五轮投资世航智能，祥峰中国、华映资本、长石资本等老股东亦全部超额跟投。本轮融资将主要用于核心技术研发、全球化市场拓展及产业链生态建设，进一步推动海洋机器人在复杂水下场景中的规模化应用。</p>\n  <p><strong>“大晓机器人”完成天使+轮融资</strong></p>\n  <p>36氪获悉，据大晓机器人消息，近日，“大晓机器人”已完成天使+轮融资。天使+轮吸引吉利资本、达晨财智、深创投、上海科创基金、沐曦股份、盛宇投资、复星锐正、华控基金、临港新片区基金、豫资涨泉等众多投资方支持，老股东商汤国香资本持续增资，告捷资本担任长期财务顾问。至此，大晓机器人2026年上半年已累计融资数亿美元。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-06-15T23:56:18+00:00", "fetched_at": "2026-06-16T03:38:55.805155+00:00", "fingerprint": "7be5e6726a05dd7a"}, {"source": "少数派", "title": "Snapseed 4.0：Google 终于想起了这款「免费修图神器」", "url": "https://sspai.com/post/110525", "summary": "Snapseed可谓是手机摄影App届元老级的存在了，最早由软件公司NikSoftware于2011年开发推出，当年即被评为AppStore年度应用。次年NikSoftware即被Google收购，S ...<a href=\"https://sspai.com/post/110525\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-15T06:39:30+00:00", "fetched_at": "2026-06-16T03:38:53.480266+00:00", "fingerprint": "ec5963a3f5febc36"}, {"source": "少数派", "title": "从 BANG!CASE 到 AI Display：我为什么想给 AI 在桌面留一个位置", "url": "https://sspai.com/post/110984", "summary": "过去几年，我一直在深圳做硬件产品，也在少数派参与过几次消费电子产品的共创。如果你关注过少数派之前的一些硬件项目，可能见过BANG!CASE。它最早来自我的一个产品创意，后来在少数派团队的推进下变成了真 ...<a href=\"https://sspai.com/post/110984\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-15T08:00:00+00:00", "fetched_at": "2026-06-16T03:38:53.480260+00:00", "fingerprint": "ffb3374771973ee5"}, {"source": "少数派", "title": "具透 | 思考、打磨、加速：iPadOS 27 首个开发者测试版中值得关注的新内容", "url": "https://sspai.com/post/111003", "summary": "除了可以自定义的 Liquid Glass 透明度，iPadOS 27 还有这 12 项细节变化。<a href=\"https://sspai.com/post/111003\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-15T08:04:25+00:00", "fetched_at": "2026-06-16T03:38:53.480255+00:00", "fingerprint": "686e2e58ca8c720f"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/111068", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"http 00 square-foot replica of an entire town, complete with a convenience store, gas station, hospital, and even fully furnished houses. It's a [&#8230;]", "category": "tech", "published_at": "2026-06-14T20:35:41+00:00", "fetched_at": "2026-06-15T03:44:37.116095+00:00", "fingerprint": "85d95390afebab6e"}, {"source": "36氪 - 最新文章", "title": "增长停滞两年后，H&M重组全球架构，大中华区降级｜独家", "url": "https://36kr.com/p/3850942780838912?f=rss", "summary": "<p><span style=\"letter-spacing: 0px;\">文｜贺哲馨</span></p>\n  <p><span style=\"letter-spacing: 0px;\">编辑｜乔芊</span></p>\n  <p><span style=\"letter-spacing: 0px;\">36氪独家获悉，瑞典快时尚巨头H&amp;M正在推进一场波及全球的组织架构调整：原本按地理划分的9大区域业务板块被打散，重新拆分为26个销售市场，并以市场表现为依据归入四个新设立的“洲级”事业部管辖。</span><br /></p>\n  <p>大中华区在这轮调整中降级为26个销售市场之一，归属新成立的亚太洲级事业部（Continent Asia Pacific）管理。原大中华区总裁司懿德（Saed El-Achkar）将出任该事业部董事总经理（Managing Director），任命预计在6月25日集团半年报发布前后正式对外公布，新架构于7月1日落地运转。</p>\n  <p>除大中华区外，亚太事业部还管辖东南亚（总部吉隆坡）、东北亚（东京）、印度（班加罗尔）、澳大利亚和新西兰（悉尼）四个销售市场，事业部总部仍设于上海。</p>\n  <p>伴随降级而来的是编制收缩。36氪了解到，大中华区本地团队此轮裁员40余人，约为原有规模的四分之一。</p>\n  <p>这场调整大约始于半年前，东南亚和东亚市场变动幅度最大。5月中旬，马来西亚媒体Malay Mail率先曝光H&amp;M东南亚总部从新加坡迁往吉隆坡的消息：原东亚区域256人编制中78个岗位被裁撤，约占区域支持人员的30%，绝大部分裁员发生在新加坡办公室。</p>\n  <p>该报道还援引内部记录称，H&amp;M大约每年都会实施一次类似的区域化或结构性调整。<strong>多位员工亦向36氪表示，此次大中华区降级为销售市场，意味着其不再被视为独立的重点业务单元，“未来有可能按照业务表现被划入不同区域管辖”。</strong>另据36氪了解，北美区的架构调整因当地工会阻力已持续近三年，至今尚未完成。</p>\n  <p>调整背后，是现任CEO Daniel Ervér推行两年有余的转型尚未兑现增长。2024年1月，Ervér接替闪电去职的Helena Helmersson出任集团CEO，提出在维持价格水位的同时让H&amp;M品牌重新“时尚化”的愿景——H&amp;M品牌贡献了集团绝大部分收入，其疲软正是公司长期低迷的症结。他随后精简管理层级、压缩供应商数量、将更多产能从中国和孟加拉迁往摩洛哥与埃及，并加大面向年轻消费者的营销投入。</p>\n  <p>这些动作带来了利润率的修复：2025财年集团营业利润率升至8.1%，为2018年以来最高，但距离管理层多年悬置的10%目标仍有距离；同期本币口径销售仅增长2%，按瑞典克朗计反而下滑3%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_6f504d0d765a47529357e42e722392a4@5922386_oswg188658oswg2238oswg1456_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">H&amp;M集团2020-2025财年的销售和利润表现 来源：H&amp;M财报</p>\n  <p>“Ervér任内的利润率提升令人印象深刻，但我仍看不到增长，”芬兰奥兰兹银行（Alandsbanken）北欧股票主管Lars Soderfjell向彭博社表示，“真正的问题是，H&amp;M对其核心客群——15至30岁的女性——是否还具有吸引力？”</p>\n  <p>中国内地市场同样可以用疲软形容。</p>\n  <p>H&amp;M内地门店已从2019年巅峰期的500余家收缩至约300家。为寻求增量，品牌于2024年10月入驻拼多多、成为首个登陆该平台的国际时尚品牌，并于同年11月开出抖音旗舰店。但36氪了解到，抖音渠道表现始终平平，拼多多则因平台补贴力度较大表现“稍佳”。</p>\n  <p>副牌阵营中，COS与ARKET表现尚可，&amp; Other Stories持续承压：该品牌2019年进入内地市场并开设天猫旗舰店，2021年9月在上海环贸iapm开出中国首家线下门店，2025年4月关闭北京三里屯太古里门店后。36氪获悉，目前&amp; Other Stories的内地线下业务已全面关闭。</p>\n  <p>资本市场上还流传着另一种猜测：公司似乎并不急于推升股价，以便创始家族低价完成私有化。彭博社此前多次报道Persson家族持续增持，按彭博亿万富豪指数口径，这个净资产约234亿美元的家族目前已掌握公司超过86%的投票权，外界关于H&amp;M最终退市的猜测随之升温。自2015年市值峰值以来，H&amp;M市值已蒸发约一半；全球范围内，H&amp;M品牌门店较2019年峰值减少了832家。</p>\n  <p>对这家曾经的瑞典市值之王而言，洲级架构、市场降级与一轮接一轮的裁员，都是同一道命题的注脚：利润率可以靠收缩修复，增长却还没有找到可行的路。</p>", "category": "tech", "published_at": "2026-06-14T05:38:42+00:00", "fetched_at": "2026-06-15T03:44:36.972816+00:00", "fingerprint": "81a429cf39da88a3"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨诺奖得主称马斯克是庞氏骗局；SK海力士去年新增员工超2000人；人形机器人U1仅限成人购买", "url": "https://36kr.com/p/3853670570743040?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>加拿大母亲起诉奥特曼与OpenAI，指控ChatGPT诱导女儿自杀</li>\n   <li>A股10家退市公司波及超25万股民</li>\n   <li>SK海力士去年新增员工超2000人</li>\n   <li>H&amp;M重组全球架构，大中华区降级</li>\n   <li>世界杯期间英格兰队装备遭窃，大部分已被追回</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>诺奖得主称马斯克是庞氏骗局，SpaceX上市让普通投资者被迫买单</strong></p>\n  <p>据当地时间6月12日，诺贝尔经济学奖得主保罗·克鲁格曼发文“Elon Musk， Human Ponzi Scheme”，称世界首富埃隆·马斯克是庞氏骗局。</p>\n  <p>克鲁格曼认为，SpaceX的IPO完全建立在“庞氏骗局”之上，散户之所以会投资SpaceX，并不是因为他们认真评估了该公司的商业价值，而是一味地相信“马斯克是天才”。然而，这场资本游戏，可不是散户能玩到最后的。</p>\n  <p>克鲁格曼认为：“埃隆·马斯克这场庞大的真人版庞氏骗局，终将崩塌。传统庞氏骗局仅坑害自愿参与的投资者，但这一次，支撑马斯克骗局的资金，很大一部分将来自普通美国民众——他们实质上是被“强制入局”。</p>\n  <p>目前，约52%的共同基金资产投向指数基金或指数挂钩基金，超过50%的美国家庭持有共同基金。马斯克与华尔街的勾结，以及外界普遍认为特朗普政府为其撑腰的认知，将导致绝大多数普通投资者身不由己地卷入其中，沦为马斯克资本帝国的‘燃料’。”（环球市场播报）</p>\n  <p><strong>美国禁止全球外籍人士访问Anthropic最新模型</strong></p>\n  <p>特朗普政府禁止境外政府、企业及个人使用Anthropic旗下最先进的人工智能模型。此举意味着美国进一步将尖端人工智能系统视作国家安全核心资产，相关管控再度升级。（新浪财经）</p>\n  <p><strong>人形机器人U1收获超3800台预售订单，仅限成人购买</strong></p>\n  <p>上线10天，主打情感陪伴的人形机器人U1为优必选收获超3800台预售订单，对应的定金总额逾千万元。男款身着修身西装，女款可上妆，搭载“养成系”情感大模型，仅限成人购买。</p>\n  <p>结合电商平台的商品介绍，U1系列共有男女两款机型，其中男款身高183厘米、重42公斤；女款身高168厘米、重35.2公斤，两款机型均支持Wi-Fi连接、单次充电续航时长为2小时至4小时、无“3C”认证；搭载88个高自由度运动关节；配备“养成系”情感大模型、本地加密存储记忆、支持多维度外观定制、已开启IP合作。业内：需注意伦理隐患。（红星新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>蚂蚁集团被曝正秘密测试AI版支付宝</strong></p>\n  <p>6月14日下午，媒体曝蚂蚁集团正秘密测试AI版支付宝，新版本颠覆原有用户交互，可一键切入原生AI界面，实现从服务到资金管理的智能化。消息称，新版本上线时间未定。蚂蚁集团拒绝评论。（新浪财经）</p>\n  <p><strong>德国数字化部长疑用AI写公文遭质疑</strong></p>\n  <p>德国数字化和国家现代化部长卡斯滕·维尔德贝格尔因疑使用人工智能（AI）工具完成演讲稿等多份公文，眼下遭到德国媒体和公众质疑。</p>\n  <p>据德国《时代》周报13日报道，基于专门检测AI生成内容的软件进行的分析，多篇署名维尔德贝格尔的演讲稿和评论文章似乎主要由AI生成。报道说，以维尔德贝格尔的名义发表在德国主要报纸上的文章，以及多篇议会演讲，都显示出大量由AI辅助的迹象；其2024年在美国智库大西洋理事会发表的一篇演讲据信完全由AI生成。</p>\n  <p>不过，一些专家指出，此类检测软件并不完全可信。数字化和国家现代化部一名发言人向德新社证实，维尔德贝格尔将AI作为辅助工作工具使用，称这一做法缘于“他坚信德国必须迅速学会以既高效又审慎的方式使用人工智能。这适用于经济、公共部门和政治领域”。（环球时报）</p>\n  <p><strong>加拿大母亲起诉奥特曼与OpenAI，指控ChatGPT诱导女儿自杀</strong></p>\n  <p>一名加拿大母亲近日在美国法院起诉人工智能企业OpenAI及其首席执行官山姆・奥特曼，指控聊天机器人ChatGPT诱导其女儿走向自杀。近期已有多起诉讼指责该公司未能管控用户与聊天机器人之间的危险对话，本案是最新一例。</p>\n  <p>这起诉��提交至旧金山州法院。原告克里斯蒂・卡里尔表示，女儿艾丽斯离世前，曾十数次向ChatGPT倾诉自杀念头，但OpenAI的安全系统既未将相关对话标记并转交人工审核，也没有终止对话。OpenAI方面称，公司对模型进行过专项训练，当用户流露自残、自杀倾向时，模型会引导其寻求帮助，并对接现实中的救助资源。</p>\n  <p>OpenAI发言人德鲁・普萨泰里表示：“这起悲剧令人痛心，我们向所有受此事影响的人致以慰问。目前我们正在审阅这份诉状，诉状中提及的相关对话发生在旧版本ChatGPT上，该版本现已停止使用。”（中国新闻网）</p>\n  <p><strong>摩尔线程：完成MiniMax M3大模型适配</strong></p>\n  <p>36氪获悉，6月12日，MiniMax新一代原生多模态旗舰模型M3正式开源。同日，摩尔线程旗舰级AI训推一体智算卡MTT S5000已完成对该模型的Day-0极速适配。据介绍，摩尔线程已具备覆盖前沿模型“适配—部署—优化”的完整工程能力，帮助开发者以更快响应、更稳运行、更低迁移成本接入最新模型，加速大模型创新落地与规模化应用。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>A股10家退市公司波及超25万股民</strong></p>\n  <p>2026年以来，A股公司退市力度空前，仅半年就有超过20家公司锁定退市，其中财务类退市占比超过六成。在这批退市公司中，财务造假性质最为恶劣，部分公司的退市源于业绩预告的剧烈变脸。</p>\n  <p>据索赔区间内峰值股东户数统计，10家退市公司合计波及投资者超过25万户。 （21世纪经济报道）</p>\n  <p><strong>迪卡侬回应劣质货泛滥：建议从官方店铺购入</strong></p>\n  <p>据报道，大量消费者反馈买到迪卡侬劣质产品，电商平台上大量商家在商品标题或页面中标注“迪小侬”等近似字样，刻意模仿官方品牌，误导消费者以为是迪卡侬官方店铺，且涉事货物究竟是否为假货仍有待进一步检测。</p>\n  <p>记者致电迪卡侬官方咨询此事，接线客服表示，除官方旗舰店外，迪卡侬未对任何店铺和第三方授权，建议消费者认准官方旗舰店购入。针对不少网友疑惑的官方能否提供质量检测以供买到假货的消费者用于售后沟通，该客服表示，目前官方无法提供检测服务，建议消费者直接与卖家或者平台沟通处理。此外，该客服还透露，目前迪卡侬方也关注到了对应的事情，同时建议消费者后续在正规店铺购买，官方会全力售后。（蓝鲸新闻）</p>\n  <p><strong>阿里巴巴：“周靖人辞职”纯属谣言</strong></p>\n  <p>14日，阿里巴巴集团回复界面新闻询问称：“周靖人辞职”纯属谣言，“我们注意到近几日有人在网络上组织扩散该谣言，也呼吁大家不要传播不实信息。”（界面新闻）</p>\n  <p><strong>山姆客服回应极速达买到临期商品：可以在订单中备注“不要临期”</strong></p>\n  <p>近期，在网络社交平台上，不少消费者发帖维权，直指山姆极速达送来临期产品的情况。5月10日下午，江苏消费者刘女士（化名）通过“极速达”下单了一份蔬菜沙拉。收到货后，她下意识地看了一眼保质期——生产日期5月7日，保质期至5月11日。也就是说，距离过期仅剩不到24小时。“我花680元办的卓越会员，买的东西比菜市场还贵，结果山姆一声不吭地就把临期菜塞给我。”刘女士在社交媒体上愤怒发帖。客服回应：“我们公司制度就是这样上架的，如果你不想要临期的，你需要在订单里备注‘不要临期’。”</p>\n  <p>类似的情况并非个例，不少消费者也分享着自己在山姆极速达下单时，买到临期产品的经历。（海报新闻）</p>\n  <p><strong>SK海力士去年新增员工超2000人</strong></p>\n  <p>业内消息人士近日透露，受全球人工智能热潮推动，存储芯片需求激增，SK海力士去年新增员工超2000人。 在韩国整体就业市场放缓的大背景下，此次扩招尤为引人注目。 数据显示，截至2025年底，SK海力士员工总数达34549人，较上年增加2159人。 同期，三星电子旗下负责芯片业务的设备解决方案部门员工数量为78064人，较上年的78699人略有减少。 截至去年年底，两家科技巨头的芯片相关从业人员总计112613人，同比增加1554人。（财联社）</p>\n  <p><strong>H&amp;M重组全球架构，大中华区降级</strong></p>\n  <p>36氪独家获悉，瑞典快时尚巨头H&amp;M正在推进一场波及全球的组织架构调整：原本按地理划分的9大区域业务板块被打散，重新拆分为26个销售市场，并以市场表现为依据归入四个新设立的“洲级”事业部管辖。大中华区在这轮调整中降级为26个销售市场之一，归属新成立的亚太洲级事业部（Continent Asia Pacific）管理。原大中华区总裁司懿德（Saed El-Achkar）将出任该事业部董事总经理（Managing Director），任命预计在6月25日集团半年报发布前后正式对外公布，新架构于7月1日落地运转。</p>\n  <p><strong>A股投资者已超2.5亿，比上年增加5.86%</strong></p>\n  <p>中国证券登记结算有限责任公司6月12日发布了2025年年度报告。报告显示，2025年全年新增投资者1386.95万，其中新增自然人投资者1382.84万。2025年期末投资者数为25067.29万，比上年增加5.86%。</p>\n  <p>中国结算解释称，期末投资者数量指持有未注销、未休眠的A股、B股账户的一码通账户数量。截至2025年末，中国结算登记存管的沪深证券交易所的证券总市值为137.80万亿元、北京证券交易所的证券总市值为8694.42亿元、全国股份转让系统的证券总市值为19780.21亿元。其中，沪深A股总市值107.84万亿元，B股总市值1114.09亿元。</p>\n  <p>从中国结算公布的过往数据来看，近十年来，A股每年新增的投资者数量均超过1000万，高峰时期超过2000万。（券商中国）</p>\n  <p><strong>“木头姐”买入逾4亿美元SpaceX股票</strong></p>\n  <p>“木头姐”旗下ARK方舟基金于6月12日（周五）公布了当日交易记录，显示出了投资策略的重大转变。最引人注目的操作是，旗下多只ETF合计买入3,291,184股SpaceX的股票，交易总额高达444,309,840美元，表明该基金对太空技术领域的兴趣日益浓厚。与此同时，方舟大幅减持AMD，通过ARKQ、ARKW和ARKX三只ETF共卖出80,536股，交易总值为39,337,809美元，延续了对AMD持仓的削减趋势。（新浪财经）</p>\n  <p><strong>SpaceX业务呈现“一极盈利、两极亏损”格局</strong></p>\n  <p>SpaceX上市首个交易日，进入市场流通的股份仅占总股本的4.2%，筹码供不应求，认购热情高涨，股价短期冲高并不意外。但公司市销率已超过112倍，远超特斯拉的15倍和芯片巨头英伟达的近20倍。简单来讲，SpaceX的业务呈现“一极盈利、两极亏损”的格局。星链是当之无愧的“现金牛”。</p>\n  <p>据招股书披露，这项卫星互联网业务去年营收达113.9亿美元，占SpaceX总营收的61%，截至2025年底已服务超1000万用户。火箭发射业务凭借复用技术在全球商业火箭发射市场占据约80%份额，但去年仍亏损6.57亿美元，且星舰若要实现载人登陆火星，仍需大量资金投入、推动技术迭代。xAI及未来的太空算力业务则被视为“烧钱黑洞”。根据招股说明书，SpaceX自2002年成立以来累计亏损达413亿美元。（央视财经）</p>\n  <p><strong>中国裁判傅明首次亮相世界杯</strong></p>\n  <p>世界杯D组首轮，澳大利亚对阵土耳其。本场比赛，中国裁判傅明担任VAR辅助裁判，迎来个人执法生涯的世界杯首秀，这也是本届世界杯中国裁判的执法首秀。本届世界杯，中国有三名裁判员马宁、傅明、周飞入围裁判员名单，分别是以主裁、VAR裁判和助理裁判的身份入围。（北京日报）</p>\n  <p><strong>世界杯期间英格兰队装备遭窃，大部分已被追回</strong></p>\n  <p>正在参加美加墨世界杯的英格兰队日前在美国堪萨斯城遭遇意外，运输球队训练装备的车辆遭遇盗窃，包括一些球鞋和足球在内的部分球队装备被偷走。英国方面消息称，截至当地时间6月13日，英格兰队失窃的大部分装备已被追回。（新京报）</p>\n  <p><strong>美司法部批准派拉蒙收购华纳兄弟探索，称该交易不会损害竞争</strong></p>\n  <p>当地时间6月12日，美国司法部反垄断部门已批准派拉蒙天舞影业以1110亿美元收购华纳兄弟探索公司。反垄断部门在声明中表示，已完成对派拉蒙与华纳兄弟探索拟议合并的分析，并根据调查所得证据判定，该交易不太可能对竞争或美国消费者造成损害，具体涉及以下领域：(1) 订阅视频点播服务；(2) 线性电视；(3) 制片厂的电影开发、制作或院线发行。（界面新闻）</p>\n  <p><strong>印度政府出台汽柴油限购措施</strong></p>\n  <p>印度媒体12日报道，印度政府出台一项为期90天的汽油和柴油限购措施，禁止货运公司等机构用户在面向个人用户的加油站购买汽油和柴油，同时对普通消费者每日柴油购买量设限，以防止囤积和倒卖燃油加剧供应紧张。（新华社）</p>\n  <p><strong>专家：日本央行或上调利率以抑制通胀</strong></p>\n  <p>据日本方面消息，日本央行可能在本月15日到16日召开的货币政策会议上，将政策利率从目前的0.75%上调至1.0%。日本东短研究公司总裁加藤出认为，加息将给中小企业和普通日本家庭的生活带来压力，对于日元汇率的影响有待进一步观察。如果继续维持过低利率，恐怕会进一步助长通胀。日本央行判断，即便只是小幅度，也应把利率上调一些。随着日本银行持续加息，确实有可能出现一些有住房贷款的家庭以及部分中小企业感到越来越大的压力，但是从整体平衡来看，利率不得不上调。（央视新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>上海独角兽冲刺“脑机接口第一股”</strong></p>\n  <p>国内脑机接口头部企业博睿康IPO迎来重要节点。6月11日，上交所官网显示，博睿康技术（上海）股份有限公司（以下简称“博睿康”）科创板IPO审核状态变更为已受理。公司拟募资25亿元，主要用于脑机接口研发项目、脑机接口产业化建设项目以及补充流动资金。红杉恒辰、上海国资背景的国孚领航、浦东创投现身本次发行前的前十名股东名单。</p>\n  <p>当前，A股市场虽然聚集了不少脑机接口概念股，但尚无主营业务聚焦脑机接口的上市公司。在此背景下，博睿康被视为“脑机接口第一股”的有力竞争者。（上证报）</p>\n  <p><strong>三星电气：已向香港联交所递交H股发行上市申请</strong></p>\n  <p>6月14日，三星电气发布公告，宁波三星医疗电气股份有限公司已于2026年6月12日向香港联合交易所有限公司递交了发行境外股份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行上市的申请资料。</p>\n  <p>该申请资料为公司按照香港证监会及香港联交所的要求编制和刊发，为草拟版本，其所载资料可能会适时作出更新和变动。</p>\n  <p>公司本次发行上市尚需取得中国证券监督管理委员会、香港证监会和香港联交所等相关政府机构、监管机构、证券交易所的批准、核准或备案，并综合考虑市场情况以及其他因素方可实施，尚存在不确定性。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>新型有机分子实现超窄带发光</strong></p>\n  <p>日本京都大学研究团队开发出一种新型有机发光分子，在无需激光强激发的情况下，实现了接近单色光的超窄带发光，突破了长期以来“自发辐射必然产生宽光谱”的传统认知，为开发具有更高色彩纯度的新一代有机发光二极管（OLED）提供了全新设计思路，有望提升OLED色彩纯度。相关研究发表于新一期《自然》。（科技日报）</p>\n  <p><strong>整理</strong>｜何雨婷</p>", "category": "tech", "published_at": "2026-06-14T23:57:48+00:00", "fetched_at": "2026-06-15T03:44:36.972811+00:00", "fingerprint": "0c8cd320d1856a8f"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | EBike变速器供应商打破海外巨头垄断，获国泰、达晨参与新一轮数千万元融资", "url": "https://36kr.com/p/3853252135654660?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能短出行核心零部件供应商洛梵狄智能科技（以下简称“洛梵狄”）已完成新一轮数千万元B+融资。本轮投资方包括国泰海通、达晨财智、以及广州黄埔科创母基金，老股东达晨财智在本轮中继续追加投资。</p>\n  <p>据悉，本轮融资资金将主要用于持续的研发投入、产能扩张、全球销售网络建设及日常运营流动资金。其中，研发重点将聚焦于下一代智能内变速器的深耕。</p>\n  <p>洛梵狄自2012年成立以来，专注内变速器的研发和生产，是中国第一家、全球第三家量产智能内变速器的厂商。目前公司已研发出电控内变速器、电机内置变速器（MEGS）、机械自动内变速器、智能车锁等产品。</p>\n  <p>变速器产品主要被用于出行产品中。智能电动出行厂商也是洛梵狄的主要用户。</p>\n  <p>以Ebike为例，过去三年，全球Ebike市场经历着漫长的去库存过程中。从全球市场数据来看，2024年Ebike全球市场规模已突破618.9亿美元，预计2030年将达1136.4亿美元，年复合增长率保持在10.3%。</p>\n  <p>洛梵狄CFO燕普认为，以欧洲市场为例，欧洲不少EBike存量用户是在2018年以后购买的车。按照一辆车8到10年的使用寿命计算，预计在两三年内，第一批存量用户的换车潮将集中释放，全球EBike市场有望进入下一轮显著的增长期。</p>\n  <p>Ebike核心零部件市场过去被博世、禧玛诺等巨头垄断，导致Ebike产品同质化严重，使得整车品牌商有需求用电子内变速器变做差异化技术。而当前欧洲高端Ebike市场内变速器渗透率超40%，70%的大众Ebike市场因电子内变价格过高完全空白。</p>\n  <p>此外，博世、八方、安乃达等主流电机厂均在推出更大扭矩的电机系统，加速了Ebieke对大功率电机的应用，而传统的变速系统却遇到物理限制。</p>\n  <p>目前，变速器巨头禧玛诺的主流内变速器额定扭矩仅为85Nm，被中高端车型广泛采用的enviolo HD，其输入扭矩上限也仅为100Nm。在大功率电机的输出下，传统变速器处于超载状态，极易损毁。</p>\n  <p>硬氪了解到，洛梵狄凭借自研的UHT超大扭矩专利技术，将智能内变速器的输入扭矩上限提升至200Nm。相较于市面上99%仍在使用手动机械变速器的现状，洛梵狄实现全线智能电子自动变速。该系统能够通过电机、力矩和速度传感器，结合AI算法精准协调人力与电力输出配比，并在毫米级内自动换到最合适骑手和地形的档位，实现上坡自动降档，同时能提升整车续航里程达30%。</p>\n  <p>市场合作方面，洛梵狄的技术实力已逐步获得全球整车厂的量产验证。目前，已有多个海外知名Ebike品牌开始量产使用洛梵狄内变速产品的Ebike型号。</p>\n  <p><strong>CFO对谈：</strong></p>\n  <p><strong>硬氪：在禧玛诺、博世等巨头垄断数十年的零部件行业，它们也开始下场做电子内变速器，在这种情况下洛梵狄的优势是什么</strong></p>\n  <p><strong>燕普：</strong>这本质上不是技术能不能理解的问题，而是中西方完全不同的产品迭代与商业生存哲学所决定的。</p>\n  <p>像博世、禧玛诺这类欧美日的老牌巨头，其做事的底层逻辑是“长周期研发，并靠长生命周期收回高利润”。禧玛诺现在的很多内变速器还是20年前的产品，没有作任何技术改动，他们习惯一个新产品花5年论证和研发，一旦上市，就要持续卖10年、20年来赚取丰厚的利润，其主动更替模具、高频升级的周期非常缓慢。</p>\n  <p>但中国公司是大挑战者属性的逻辑。我们更在乎通过技术迭新尽快占领市场，不指望靠一代产品卖十几年来躺着赚钱。中国企业是在品质和稳定性的基础之上快速迭代，在设计之初就敢于尝试并不断优化。我认为只要我们的技术在快速迭代，而且还有快速迭代的可能性，海外公司就都不足为惧。</p>\n  <p><strong>硬氪：车厂的决策周期一般需要2到3年，你刚提到洛梵狄业务现在爆发增速很快，为什么是是这个时间点？</strong></p>\n  <p><strong>燕普：</strong>我们的变速器业务前年到去年增长了5倍，去年到今年预期还能再增长5倍，明年估计还能翻3倍。</p>\n  <p>这种爆发看似突然，其实经历了一个漫长的用户验证周期。因为B端客户测试很长，我们现在大批量量产的客户，其实在两三年前就已经在对接和测试。当时我们没有出过大批量的产品，所以虽然客户很感兴趣但也很审慎，在同步做大量的实车测试。</p>\n  <p>同时，我们的核心竞争力在于满足了三个要素的叠加：更高的性价比、更强的抗扭性能（200Nm）、以及电控自动变速带来的智能化骑行体验。</p>\n  <p>在供给端，同时满足这三点的智能变速器在市面上几乎是空白。</p>", "category": "tech", "published_at": "2026-06-15T01:30:46+00:00", "fetched_at": "2026-06-15T03:44:36.972804+00:00", "fingerprint": "ca6ed582c98e6268"}, {"source": "36氪 - 最新文章", "title": "硬氪首发 | 海洋具身智能公司「世航智能」拿下创纪录10亿融资，朱啸虎、淡马锡押注", "url": "https://36kr.com/p/3853011900142848?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，海洋具身智能公司「世航智能」完成A轮融资，融资金额超过10亿元，这也是目前全球海洋机器人领域规模最大的单轮融资。本轮融资由两家芯片公司「摩尔线程」和「昆仑芯」的产业投资方上河动量基金、新加坡国有投资平台Vertex Growth 、上市公司大洋电机等资方出资。</p>\n  <p>另外，金沙江创投也在本轮追加投资，这已是其创始人朱啸虎第五轮投资「世航智能」，祥峰中国、华映资本、长石资本等老股东亦全部超额跟投。</p>\n  <p>「世航智能」创始人兼CEO陈晓博为1989年出生的哈尔滨工程大学校友，长期深耕水下机器人领域，在28岁时获得国防科技进步一等奖，是该奖项最年轻获奖者，并主导研发全国首台商用水下清洗机器人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_f973153f6576424fb06765e4acbc200e@1199336245_oswg177265oswg1080oswg975_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>「世航智能」方面向硬氪透露，本轮融资将主要用于核心技术研发、全球化市场拓展及产业链生态建设，进一步推动海洋机器人在复杂水下场景中的规模化应用。</p>\n  <p>与工厂、仓储等相对标准化环境不同，<strong>海洋长期被视为机器人应用中难度最高的场景之一。</strong></p>\n  <p>在水下环境中，机器人需要同时面对低光照、高浑浊度、复杂洋流、通信受限、高压、腐蚀等多重挑战。这意味着，海洋机器人不仅要具备稳定的机械结构和运动控制能力，还要在复杂环境中完成感知、判断和自主作业。</p>\n  <p>在过去，大量水下作业仍高度依赖专业潜水员和大型装备完成，存在成本高、风险大、效率受限等问题。</p>\n  <p>据「世航智能」介绍，其长期围绕海洋机器人底层能力进行自主研发，核心技术覆盖动力、控制、传感、导航、密封和布放等六大核心系统。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_2c0c8e98a9724489971601cded7b6da8@1199336245_oswg630410oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>据了解，「世航智能」的机器人已具备0米至10000米全海深、全自由度作业能力，可在水下三维空间实现前进、后退、横移、翻滚等复杂动作，并支持自主导航、多机器人协同作业等功能。截至目前，「世航智能」的机器人已在<strong>船舶清洗、水下安保、海洋风电、海洋牧场、海底巡检</strong>等场景实现应用落地。</p>\n  <p>公司方面透露，仅2026年上半年，<strong>「世航智能」获得订单金额已超过10亿元。</strong></p>\n  <p>其中，「世航智能」旗下的“虎鲸机器人”已在招商轮船、中远散货等头部航运企业投入应用，并已经累计完成超千艘大型船舶养护作业，此前还牵头制定中国首个《水下清洗机器人操作规程》标准，获得2025年度中国航海学会科学技术进步一等奖。</p>\n  <p>在商业化布局之外「世航智能」也持续布局核心技术。今年4月，「世航智能」发布了<strong>海洋具身大模型“沧穹 CEORION”——</strong>与传统水下机器人依赖人工遥控或预设程序不同，沧穹试图让机器人具备感知、理解和自主执行能力。</p>\n  <p>「世航智能」创始人兼CEO陈晓博告诉硬氪，“沧穹 CEORION”采用统一端到端架构，将环境感知、任务理解和动作生成集成在同一个模型中，并结合真实作业数据与仿真数据进行训练。目前，“沧穹 CEORION”已基于百万小时级商业作业数据，构建了一个海洋世界模型，并通过真实任务持续迭代优化。</p>\n  <p>这意味着，搭载“沧穹 CEORION”的海洋机器人已经无需针对不同任务切换多个模型，即可覆盖<strong>巡检、检测、清洗、抓取、切割、焊接、勘探、搜救、应急等12大类水下作业场景。</strong></p>\n  <p>其中，在仿真测试中，<strong>“沧穹 CEORION”的任务成功率超过90%</strong>、精细控制定位抓取成功率超过90%——达到专业潜水操作员的操控水平。另外，面对从未见过的海域环境、水质条件、光照变化以及不同机器人平台，“沧穹 CEORION”的<strong>模型零样本适应能力超过70%。</strong></p>\n  <p>此外，海洋场景与陆地场景最大的区别还在于推理困难——视觉信息往往受到海水浑浊、光线衰减以及悬浮颗粒物影响。因此，模型需要同时融合多种感知信息，并具备复杂的物理推理能力，才能完成作业决策。</p>\n  <p>而在“沧穹 CEORION”的大模型架构中，「世航智能」将物理推理模块内置，使得模型能够在动作执行前预判潜在风险并优化决策，将碰撞事故率降低80%——这意味着，即便在弱通信甚至无通信环境下，机器人仍可自主完成任务规划与执行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_556b0b8f262a4dbc9b7702b5aa90d09f@1199336245_oswg1332297oswg1080oswg855_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>今年上半年，世航智能还入选新加坡海事及港务管理局国家水下船体检测与清洗计划，成为该国家级项目核心技术合作伙伴。</p>\n  <p>这些落地进展意味着，海洋机器人正在从单点项目验证走向规模化应用，而真实作业场景不仅为企业带来订单收入，也持续沉淀高价值作业数据，推动机器人能力在“作业—数据—模型”的循环中不断提升。</p>\n  <p>「世航智能」创始人兼CEO陈晓博告诉硬氪，公司将继续围绕海洋机器人核心技术、海洋具身智能模型和全球化应用场景进行投入，推动海洋机器人在更多高风险、高难度、高价值水下作业中实现应用落地。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_5260128d5c014f619077e7bf7143e241@1199336245_oswg53536oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>", "category": "tech", "published_at": "2026-06-15T01:50:00+00:00", "fetched_at": "2026-06-15T03:44:36.972796+00:00", "fingerprint": "2193c2611dc4b392"}, {"source": "36氪 - 最新文章", "title": "硬氪专访 | 智源研究院院长王仲远：VLA不会死，但世界模型是未来", "url": "https://36kr.com/p/3853016586359817?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>过去几个月，“世界模型”（World Model）从学术黑话迅速膨胀成AI和机器人行业里的关键词。</p>\n  <p>行业的目光转向背后是切实的焦虑。</p>\n  <p>一方面，经过了过去两年的野蛮生长，具身智能暴露了当前AI在物理世界中的短板——机器人能识别物体，却不懂“推杯子会掉”；能听懂指令，却无法预判“拧瓶盖需要多大的力”。世界模型正是试图补上这个短板，让机器人学会物理世界的规律、因果。</p>\n  <p>也就是说，世界模型与具身智能的关系，本质上是“大脑”与“身体”的关系。</p>\n  <p>另一面，大模型在经历了大语言、视觉模型、多模态的探索之后，需要从虚拟走向真实世界的下一阶段。</p>\n  <p>只是，当资本、技术专家、产业资源都倾注于此，世界模型到底如何上岸，人们没有答案。</p>\n  <p>在智源研究院院长王仲远看来，眼下全球围绕世界模型的探索，正被撕扯成四条截然不同的分岔路——</p>\n  <p>第一类是以<strong>语言为中心</strong>的世界模型，包括VLM、VLA，模型在文本空间中预测下一个词，学到的是语言描述的世界，并不能理解背后的物理后果；</p>\n  <p>第二类是以<strong>像素为中心</strong>的世界模型，像Sora和Seedance等视频生成类模型，在视觉空间中学习视频或图像，学到的是像素描述的世界；</p>\n  <p>第三类是以<strong>三维结构为中心</strong>的世界模型，包括3D重建以及李飞飞团队的World Labs Marble模型，不过模型重建3D空间不等于理解世界，几何结构也不代表物理状态；</p>\n  <p>第四类是<strong>以视觉表征为中心</strong>的世界模型，比如杨立昆的JEPA系列模型，预测的是视觉表征的压缩，但视觉嵌入演化不等于物理规律演化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_6b6ae97189f24037a81f6d6d4aba4219@1199336245_oswg141618oswg1080oswg1620_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智源研究院院长王仲远（图源/企业）</p>\n  <p>作为一家非营利性科研机构<strong>，</strong>北京智源人工智能研究院同样也是目前国内世界模型领域的中坚力量。</p>\n  <p>不同的是，智源研究院目前尝试的确是第五个分类——以语言和视觉为中心，<strong>融合进统一的「潜空间表征」</strong>：<strong>所有模态被压缩进同一个潜空间（latent space）仲，再由不同的\"解码器”（Decoder），按需还原成不同输出形态。</strong></p>\n  <p>举个例子，这个“潜空间”就像给机器人大脑准备了一张<strong>“万能草稿纸”，</strong>不管是看到的视频画面、听到的文字指令，统统先在“纸”上压缩成一种只有AI能懂的“密语笔记”，等需要时，机器人将会根据同一份笔记，<strong>画</strong>出接下来的场景，<strong>演</strong>出机器人的动作，或者<strong>算</strong>出物体的位置和力度。</p>\n  <p>在迈向世界模型进的前几年，智源研究院在AI上的动作，就像是一部层层递进的\"连续剧\",一步步构建从数字世界走向物理世界的通用基座——</p>\n  <p>从早年的\"悟道\"大模型，智源研究院将国内大模型叙事从0推到公共视野，再到逐渐把竞争点引导向原生多模态统一架构（包括悟界·Emu3/悟界·Emu3.5），此后，智源研究院明确提出要向“下一状态预测（NSP）”跃迁，并将这套逻辑接入悟·Physis和悟界·RoboBrain Orca的可部署系统中。</p>\n  <p>在这段期间，智谱AI、月之暗面、面壁智能、银河通用等多家行业头部企业的核心创始人唐杰、杨植麟、刘知远、王鹤等，也都均在智源开展过相关领域研究。</p>\n  <p>尽管世界模型热得滚烫，王仲远却对这股热潮保持着难得的冷静。他认为，<strong>世界模型大概处在深度学习的2012年前后</strong>——彼时，数据孤岛严重、路线未定、Benchmark还在打架，ChatGPT时刻尚未到来。</p>\n  <p>在他看来，世界模型接下来的硬仗，在于几个维度的综合比拼。</p>\n  <p>首先，模型不能只生成看起来<strong>真实但不符合真实物理规律的画面</strong>，比如只是生成“会飞上天的猪”，还要具备长时序一致性，不能不是几秒钟的视频，而是连续变化的状态。</p>\n  <p>其次，<strong>世界模型必须进行因果逻辑推断</strong>，需要理解动作和结果之间的关系，比如，要明白盖盖子和没盖子的杯子同时掉落时，会发生什么。最后，世界模型需要作为基座模型应用到多种场景，而<strong>不是只服务某个Demo或单一任务。</strong></p>\n  <p>落到应用侧，在他看来，世界模型的价值会在两大大方向兑现，除了用于突破具身智能的卡点，服务于机器人领域之外，世界模型还可以广泛应用于严肃工业、物理仿真、科学研究等真实物理场景。</p>\n  <p>“我们期待未来世界模型能成为真正的机器人大脑，世界模型解决了现在VLA、VLM解决不了的问题，提供了泛化、长程、复杂任务和主动探索能力。<strong>但这会是一个长期过程，可能需要三年甚至更长时间。”</strong>王仲远表示。</p>\n  <p><strong>近期，王仲远与硬氪等媒体聊了聊对世界模型的看法、以及世界模型与具身智能的衔接点，以下是采访实录（略经摘编）：</strong></p>\n  <h3><strong>世界模型四条分岔路</strong></h3>\n  <p><strong>硬氪：为什么今年智源大会重点谈“世界模型”，它和过去的大模型路线是什么关系？</strong></p>\n  <p><strong>王仲远：</strong>我们不是突然提出世界模型这个概念。早在2024年智源大会上，我们就对人工智能的发展路径做过预判：大语言模型之后，会进入原生统一多模态，再进入物理世界与硬件结合，进一步走向微观世界的AI for Science，最终通向物理AGI。</p>\n  <p>今年智源大会有两大主题，一个是世界模型，一个是智能体。智能体现在非常热，尤其是AI Coding已经进入蓬勃爆发阶段；<strong>世界模型则是我们认为人工智能从数字世界进入物理世界时必须面对的下一代基座模型问题。</strong></p>\n  <p><strong>硬氪：当前世界模型有哪几条技术路线？</strong></p>\n  <p><strong>王仲远：</strong>现在主流的有四条路：</p>\n  <p><strong>以语言为中心路线</strong>（如Gemini3）：能感知多模态数据，通过语言思考并描述下一状态，具备规划决策能力。</p>\n  <p><strong>以像素为中心路线（如Sora）：</strong>适合视频生成，但不懂物理因果；</p>\n  <p><strong>以三维结构为中心路线</strong>（如李飞飞World Labs的Marble）：瞄准元宇宙、游戏等数字世界仿真；</p>\n  <p><strong>以视觉表征为中心路线</strong>（如LeCun的V-JEPA系列）：预测的是视觉表征的压缩，但视觉嵌入演化不等于物理规律演化。</p>\n  <p><strong>硬氪：智源的世界模型可以归类于什么路线里？</strong></p>\n  <p><strong>王仲远：</strong>我们更倾向于在潜空间中学习世界知识，也就是Latent Relation，尝试把世界知识真正压缩到隐空间中，再通过不同Decoder输出Language、Action和Vision。</p>\n  <p>智源选择尝试以语言为中心的分类和以视觉表征为中心的分类可能的融合，原因很简单，世界模型不仅要“看懂”物理世界，更要“理解”并“决策”。比如人类看到半杯水被打翻，大脑会自动预判“水流方向、地面材质对流速的影响”——这种能力需要将视觉信号与语言推理深度融合，而不是只生成画面。</p>\n  <p>我也认同LeCun对“大语言模型局限性”的判断，但我并不认为语言模型不重要，语言是人类知识的载体，放弃语言等于放弃了人类积累的物理常识。</p>\n  <p><strong>硬氪：现在很多公司把视频生成模型称为世界模型，你怎么看？</strong></p>\n  <p><strong>王仲远：</strong>我非常明确地认为，视频生成不等于世界模型。现在世界模型这个词被广泛使用，很大程度上是因为OpenAI发布Sora时用了“World Simulator”的表述。</p>\n  <p>世界模拟器用于描述视频生成还算相对准确，但视频生成模型本身并不等同于世界模型。今年很流行的World Action Model，把视频和Action拼接起来，也不能完全代表真正意义上的世界模型。</p>\n  <p>在我看来，<strong>真正的世界模型应该是面向真实物理世界的下一代基座模型</strong>。它不是单纯生成一段看起来很逼真的视频，而是要<strong>理解真实物理世界的状态变化、动作因果、长时间序列一致性和泛化能力。</strong></p>\n  <p>语言模型时代的核心是Next Token Prediction，也就是预测下一个词元。而世界模型时代的核心应该是Next Physical State Prediction，预测下一个物理状态。</p>\n  <p>语言模型可以用Prompt激发能力，世界模型则需要用State激发能力。语言模型更多是被动观察，世界模型必须主动交互。语言模型可以是单模态或多模态，世界模型必须走向全模态。</p>\n  <p><strong>硬氪：一个真正面向物理世界的世界基座模型，需要具备什么能力？</strong></p>\n  <p><strong>王仲远：</strong>我认为至少需要几个能力。</p>\n  <p>第一，要<strong>物理正确</strong>，光学折射、重力、流体、物体运动都要符合真实物理规律。视频生成模型可能生成一群在天上飞的猪，但物理世界不会这样运行。如果机器人装上一个不能区分真实和虚幻的“大脑”，它可能误以为自己是钢铁侠，这会带来严重风险。</p>\n  <p>第二，要有<strong>动作因果可溯。</strong>模型不能只知道画面变化，还要知道Action会导致什么结果。比如，一瓶水有没有盖盖子，当人类看到它快掉落时，自然会预判不同后果，世界模型需要把这种动作与后果之间的关系学进去。</p>\n  <p>第三，要有<strong>长时间序列一致性</strong>。很多视频生成模型可以生成5秒、10秒甚至1分钟的视频，但并不代表它真正理解时间。如果给一个瓶子加水，旁边有一个时钟，镜头移开再移回来，模型要知道现实中确实经过了10秒或20秒，而不是随意生成一个看似合理的画面。</p>\n  <p>第四，要有<strong>通用泛化能力</strong>。世界基座模型必须能应用在多个下游场景，就像大语言模型可以用于很多任务一样。它不能只是一个特定场景的工具，而要能服务具身、物理仿真、科学预测等多种任务。</p>\n  <h3><strong>世界模型或成为真正的机器人大脑</strong></h3>\n  <p><strong>硬氪：当前具身智能最大的问题是什么？</strong></p>\n  <p><strong>王仲远：我认为具身智能还处在非常早期。</strong>现在的具身模型多数还是单场景、被动任务执行者。它们可以在特定工厂、特定任务、特定数据下工作，比如看到包裹就执行抓取、分拣、放置。这类场景中，VLA或者更简单的模型都可能有效。</p>\n  <p>但问题在于，它们很难泛化。真实物理世界是复杂的，有时间、空间、物理规律，也有人类创造的各种工具和环境变化。机器人如果只是被动执行指令，靠一个场景一个场景解决问题，就很难真正大规模落地。</p>\n  <p>我认为，世界模型和具身智能是相互呼应的。具身智能暴露了当前模型在物理世界中的短板，世界模型则试图补上这个短板。</p>\n  <p><strong>硬氪：现在也有一些论调称，“VLA已死”，世界模型是不是具身智能的必要路线，两者的关系是什么？</strong></p>\n  <p><strong>王仲远：</strong>我的判断是：<strong>VLA是当下，世界模型是未来。</strong></p>\n  <p><strong>VLA当然有用，而且有很大用处。</strong>它可以促进机器人在特定场景落地，甚至有些特定场景不一定需要更复杂的世界模型，只要看到包裹就执行动作，搜集特定数据就可以完成任务。</p>\n  <p>但VLA有局限，比如泛化性不足，其次是长程任务、复杂场景和空间物理规律理解能力不足。再者，VLA模型往往比较大，部署响应速度和Latency较高，不一定能满足真实物理世界中高频动作执行的要求。世界模型要解决的是更底层的问题。</p>\n  <p><strong>硬氪：世界模型对机器人执行任务的帮助，能否举一个具体的例子？</strong></p>\n  <p><strong>王仲远：</strong>世界模型不应该只是生成数据，也不只是生成视频。它更重要的能力是基于当前Context和状态，预测未来可能发生的状态，并据此做出当下最优决策。</p>\n  <p>可以用一个比喻来理解，有点像《奇异博士》看到不同未来，然���选择最优结果。机器人面对真实环境时，也需要类似能力。它要理解当前环境，预测不同动作会带来什么后果，再选择最合适的动作。</p>\n  <p>比如机器人在酒店或家庭环境中，看到一个门、一只手势、一个声音指令、一个房间状态，它需要结合历史记忆和当前Context做出判断：是关厨房的门，还是关房间的门，还是采取其他动作。这不是简单的图像识别，也不是简单的语言指令执行，而是复杂推理后的物理决策。</p>\n  <p>这就是我们说的世界模型要指挥Agent物理实体执行Action。执行之后，还要继续采集反馈，评估任务是否完成，并进入下一轮状态预测和决策。</p>\n  <p><strong>硬氪：世界模型最终是否会成为真正的机器人大脑？</strong></p>\n  <p><strong>王仲远：</strong>这是我们的期待。我们希望未来的世界模型能够在具身场景下真机部署，解决VLA、VLM和传统动作执行无法解决的问题。机器人需要有泛化能力、长程任务能力、复杂推理能力、主动探索能力。它不仅要能看懂世界，还要能理解动作后果，规划未来状态，指挥机器人执行动作，并根据反馈修正决策。</p>\n  <p>这件事不会短期完成。<strong>世界模型是一个长期过程，瞄准的不是短期落地应用，而是下一个人工智能时代的核心能力。</strong>短期内，具身机器人会先在具体场景中落地，采集数据，形成闭环；长期看，世界模型有机会成为真正意义上的机器人大脑。</p>\n  <p><strong>硬氪：世界模型现在最难突破的技术难点是什么？</strong></p>\n  <p><strong>王仲远：一个核心难点是数据，尤其是真实物理世界的数据。</strong></p>\n  <p>大语言模型的爆发依赖互联网数据。世界模型要进入物理世界，也需要足够多、足够高质量的真实物理数据。现在真实世界数据仍然非常缺乏，而且是散落的孤岛，没有形成足够充足、可复用、可训练的数据体系。</p>\n  <p>视频数据是目前最容易Scale Up（规模化）的数据，因为它海量存在，也确实包含大量真实物理世界的信息。但问题在于，现在科研技术还没有充分挖掘视频数据里的物理信息。</p>\n  <p>除了视频，我们还需要真实交互数据、异构感知数据、动作轨迹数据、人类指令数据、机器人执行反馈数据。具身机器人在真实工厂、酒店、家庭等场景中工作时，会产生大量有价值的数据，这些数据闭环可能会加速世界基座模型的训练和爆发。</p>\n  <p><strong>硬氪：如果真实物理世界数据不足，是否可以依靠仿真数据？</strong></p>\n  <p><strong>王仲远：</strong>仿真数据有必要，能弥补真实数据采集不足，但我对完全依赖仿真数据构建更强模型是有疑虑的。因为仿真数据本身是人类构造的，它的精准度不一定足够，如果用不够精准的海量数据训练模型，能不能构建出真正理解物理世界的模型？这是需要验证的。</p>\n  <p>未来可能会像语言模型训练中的数据配比一样，把互联网数据、视频数据、仿真数据、真实机器人数据、科学数据等，放在一起训练世界基座模型。</p>\n  <p>但不同数据如何配比，现在还没有标准答案，数据质量和配比会直接决定模型能力，这很大程度上仍然依赖研究员的判断、实验和下游任务验证。最直观的验证方式就是具身智能，模型真正部署到机器人上，能不能在训练数据之外完成任务，能不能在复杂场景中做出合理决策，这些会成为判断数据和模型能力的重要标准。</p>\n  <p><strong>硬氪：如果世界模型还很早期，具身智能短期如何落地？</strong></p>\n  <p><strong>王仲远：</strong>短期内，具身智能会沿途下蛋，也就是先解决具体场景问题，比如工厂分拣、打包、贴纸、放充电器、合上盖子，或者酒店服务等To B场景。</p>\n  <p>这些场景本身有商业价值，也能在落地过程中采集数据。机器人在真实场景中干活，会产生人类指令、人类交互、动作轨迹、任务结果等数据，这些数据反过来会帮助未来世界基座模型训练。</p>\n  <p>所以我们不能等所有数据都Ready之后再探索技术路径，技术要先行，产品和系统会跟上。就像深度学习、Transformer、大语言模型的发展一样，技术路径往往早于产品爆发。</p>\n  <h3><strong>世界模型尚未到GPT时刻</strong></h3>\n  <p><strong>硬氪：世界模型最可能率先落地在哪些场景？</strong></p>\n  <p><strong>王仲远：</strong>具身智能肯定是最重要的应用场景之一，除此之外，世界模型也可以用于物理仿真、科学实验、AI for Science等场景。</p>\n  <p>现在的很多模型无法解决这些真实场景中的问题，归根结底，我们希望有一个面向真实物理世界的基座模型，帮助人工智能更好地感知、理解物理世界，并具备推理和决策能力。</p>\n  <p><strong>硬氪：如果类比大语言模型的发展阶段，世界模型现在处于什么阶段？</strong></p>\n  <p><strong>王仲远：</strong>我认为<strong>世界模型和具身智能大概处在2012年的时期。</strong>那个时候深度学习刚刚兴起，从2012年到2018年，再到2022年底ChatGPT发布，大语言模型真正爆发走了大约十年。现在世界模型还没有到GPT时代，因为数据非常缺乏，技术路线也没有完全收敛。</p>\n  <p>但人工智能演化速度越来越快，世界模型可能三年到五年，随着视频数据进一步被挖掘，具身机器人不断在真实场景落地，真实物理世界数据不断累积，世界模型会更快进入爆发阶段。</p>\n  <p><strong>硬氪：大语言模型时代，中美通常被认为有六到十二个月差距。世界模型时代，中国和海外是否还有差距？</strong></p>\n  <p><strong>王仲远：</strong>大语言模型早期，我们更多是在跟随。世界模型是世界上最前沿的研究方向，概念、路线、模型形态都还没有完全收敛。我觉得世界模型没有差距，大家站在同一起跑线。</p>\n  <p><strong>硬氪：未来世界模型的竞争会集中在哪些方面？</strong></p>\n  <p><strong>王仲远：</strong>现在大家都说自己在做世界模型，但很多所谓世界模型其实是工具，或者是解决特定场景的模型，并不一定是通用世界基座模型。未来真正关键的竞争点，我认为包括几个方面：</p>\n  <p>第一，能否具备真实物理可验证能力。模型不能只生成看起来真实的画面，而要符合真实物理规律。</p>\n  <p>第二，能否具备长时序一致性。真实世界不是几秒钟的视频，而是连续变化的状态。</p>\n  <p>第三，能否进行因果逻辑推断。模型需要理解动作和结果之间的关系。</p>\n  <p>第四，能否作为基座模型，用不同数据微调后应用到多种场景，而不是只服务一个Demo或一个垂直任务。</p>\n  <p>我认为世界模型最后一定需要通过系统和产品来证明。只有当它能在机器人、物理仿真、科学实验等真实任务中体现价值，行业才会逐渐收敛对世界模型的定义和路线判断。</p>\n  <p><strong>硬氪：过去大模型积累的基础设施能否复用？世界模型对算力等等，有什么新的要求吗？</strong></p>\n  <p><strong>王仲远：</strong>我比较乐观地认为，现有的大模型算力基础设施、训练框架、数据工具链都可以在很大程度上复用。悟界Emu3.5当时强调的一个理念，就是采用类似大语言模型的架构，并证明它能够Scale Up。</p>\n  <p>到了世界模型阶段，依然需要处理声音、图像、动作轨迹、语言等各种模态，这些在多模态和具身领域已经有基础。但是，新的挑战在于Action和State怎么采集、怎么表达、怎么训练。世界模型会带来新的需求，但基础设施并不是完全从零开始。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v 5 and Mythos 5 was triggered in part by cybersecurity research from Amazon and conversations between CEO Andy Jassy and the White House. According to the report, the paper from Amazon claims that, through a series [&#8230;]", "category": "tech", "published_at": "2026-06-13T21:39:26+00:00", "fetched_at": "2026-06-14T03:34:54.187540+00:00", "fingerprint": "c8120a3f312c3589"}, {"source": "36氪 - 最新文章", "title": "读懂SpaceX的两万亿故事：为什么马斯克每一手棋，永远都可以提前摆好？", "url": "https://36kr.com/p/3851073239372809?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_92aaa336bcb4400e8d6697c9d789b56c@5579416_oswg209725oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">飞向宇宙、浩瀚无垠</p>\n  <p><strong>作者｜曹思颀</strong></p>\n  <p><strong>编辑｜靖宇</strong></p>\n  <p>6 月 12 日，在 SpaceX 正式挂牌当天，马斯克选择前往得州的星舰基地，和数百名员工一起，远程敲响了纳斯达克的开市钟。</p>\n  <p>在现场，他用熟悉的那股自嘲范儿说：「如果当年有人告诉我会有今天，我大概率觉得那个人嗑嗨了。因为当时我自己都认为这家公司会黄。」</p>\n  <p>这一天，SpaceX 正式登陆纳斯达克，发行价 135 美元，募资约 750 亿美元；开盘即涨，盘中一度冲过 176 美元，市值短暂站上 2 万亿美元。</p>\n  <p>从 2002 年因为买不到火箭而被迫创业，到如今完成人类商业史上最��的 IPO，这 24 年的旅程里，有大量反直觉、反共识的故事。</p>\n  <p>这家公司名义上造火箭，但火箭业务并不赚钱；它最出圈的成就是回收火箭，但撑起估值的是另外两个故事——星链，和刚刚写进招股书的「太空算力」。</p>\n  <p>我们整理了其中 15 个最具代表性的小故事，希望可以帮助你建立起对 SpaceX 更全面的了解。</p>\n  <h2><strong>1. SpaceX 的起点，来自一位商业新贵的「公关行为」</strong></h2>\n  <p>2001 年，刚从 PayPal 套现的马斯克想自掏腰包做一个叫「火星绿洲」的舆论工程：花一两千万美元一个迷你温室送上火星，拍下绿色植物长在红色土地上的照片，以此让国会增加给 NASA 的预算。</p>\n  <p>但他被运费卡住了。欧洲火箭太贵，三赴莫斯科买退役洲际导弹又被当成外行打发。</p>\n  <p>在后来的多次公开演讲以及媒体采访中，马斯克表示，受挫之后他认为卡住人类通往火星的既非公众意愿，也非国会预算，而是火箭的价格本身。于是「帮 NASA 募捐」变成了「自己把火箭做便宜」。</p>\n  <p>2002 年，SpaceX 正式成立。</p>\n  <h2><strong>2. 前六年，这家公司一直在「失败」</strong></h2>\n  <p>2002 到 2008 年，Falcon 1 前三次发射全部失败。</p>\n  <p>那个年代，造火箭的 know-how 全部锁在国家航天体制内。SpaceX 既买不到图纸，也雇不到人。马斯克后来自述时调侃说：他出任公司的首席工程师是因为「优秀的人都不愿意来」。</p>\n  <p>更残酷的是火箭的物理属性：它无法在地面上充分调试，唯一的学习方式就是发射、炸掉、再来。「三连败」是一家公司用实弹自学航天的学费——只是这份学费按千万美元计价，而马斯克的钱只够交四次。</p>\n  <h2><strong>3. 第四发成功，开启了「商业航天」时代</strong></h2>\n  <p>2008 年 9 月 28 日，Falcon 1 第四次发射成功——人类第一枚由私人资金研发的液体燃料火箭进入地球轨道。</p>\n  <p>在此之前，「航天」默认是国家的游戏：花钱的是政府，干活的是体制。</p>\n  <p>三个月后，NASA 把 16 亿美元的国际空间站货运合同（CRS）交给了这家刚刚死里逃生的公司。「商业航天」作为一个行业，这一天才算正式出生。</p>\n  <h2><strong>4. 商业航天的新玩法</strong></h2>\n  <p>传统航天采购是「成本加成」（cost-plus）：承包商花多少报多少，政府再加一笔利润——花得越多，赚得越多，没有任何人有动力省钱。</p>\n  <p>NASA 在商业货运项目（COTS/CRS）里给 SpaceX 的是固定价合同：一口价，省下的都是你的，超支的自己扛。这个看似枯燥的采购条款，才是商业航天真正的制度起点，它第一次让「把火箭做便宜」变成一门有利可图的生意。</p>\n  <p>SpaceX 后来贯穿始终的成本执念，一半是天性，一半是这纸合同逼出来的。</p>\n  <h2><strong>5. 可回收技术：让甲方心甘情愿地为「不靠谱的技术」掏钱</strong></h2>\n  <p>2015 年 12 月 21 日，Falcon 9（猎鹰 9 号）一级火箭第一次成功降落回地面——距公司成立整整 13 年。</p>\n  <p>在此之前，SpaceX 对回收的执念经历过漫长的试验和失败：2010 年 Falcon 9 头两次飞行， 就尝试过用降落伞回收一级火箭——火箭还没来得及开伞， 就在重返大气层时解体了。2013 年起改用反推动力方案， 此后两年多， 先后近十次尝试：有的在海面上硬摔， 有的在驳船甲板上爆炸、倾倒， 没有一枚完整地回来。</p>\n  <p>但这些试验几乎都不是自费专项测试， 而是搭在客户的付费发射上——同一枚火箭， 既执行任务， 又做实验。客户的载荷在前半程送入轨道， 钱货两讫；送完货的一级火箭， 按行业惯例本就是扔进大海的垃圾，SpaceX 拿它顺路练降落。</p>\n  <p>马斯克的「算盘」是：炸了， 炸的是垃圾；成了， 航天史改写。所以，其实是 SpaceX 用 NASA 的订单作为奖学金， 免费读完了「可回收」这个学位。如今 Falcon 9 任务成功率约 99.4%，2025年，Falcon 9系列共发射165次，其中助推器回收仅失手3次。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_543a3bf284e9409198b85d7f2b6a5f11@5579416_oswg873458oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">猎鹰9号火箭进行商业发射 | 图片来源：SpaceX</p>\n  <h2><strong>6. 今天的 SpaceX：星链（StarLink）赚钱养 AI</strong></h2>\n  <p>招股书显示，2025 年 SpaceX 总营收 187 亿美元，净亏损 49 亿美元。</p>\n  <p>但按分部拆开，故事完全不同：星链所在的连接业务一年贡献约 44 亿美元经营利润，是全公司唯一盈利的板块；火箭所在的太空业务小亏约 6.6 亿——主要因为往星舰研发砸了约 30 亿美元。</p>\n  <p>真正的大窟窿是并表进来的 xAI：一年经营亏损约 64 亿美元，一家就吞掉星链的全部利润还不够。</p>\n  <p>换句话说，如果只看「老 SpaceX」（火箭＋星链），它已经是一家赚钱的公司；让它重新「亏损」的，恰恰是它为下一个故事买入的 AI。</p>\n  <h2><strong>7. 星链是马斯克为可回收火箭提前布局的「内部甲方」</strong></h2>\n  <p>2015 年 1 月，马斯克公开宣布星链计划（StarLink），它是 SpaceX 用成千上万颗低轨小卫星组成的「天上的宽带网」， 向地面用户卖上网服务——尤其是海上、荒野、偏远地区这些光纤和基站够不到的地方。</p>\n  <p>同年 12 月，Falcon 9 才第一次成功着陆。也就是说，在「便宜的火箭」被证明之前，「便宜火箭的客户」已经内部立项了。</p>\n  <p>这不是巧合，是同一道算术题的两半：全球火箭发射市场一年只有五六十亿美元，且过去十年没有太大变化。所以便宜的运力放到这个市场里根本吃不饱；反过来，要给全球铺一张几千上万颗卫星的网，没有便宜的运力，账根本算不过来。</p>\n  <h2><strong>8. 星舰还没成功，它的「买方市场」已经换过一轮了</strong></h2>\n  <p>同样提前下注的故事发生在下一代重型火箭星舰（Starship）上。</p>\n  <p>2014 年，SpaceX 在得州博卡奇卡为星舰基地奠基——那一年，Falcon 9 连一次回收都还没成功。上一代未落地，下一代已动工。</p>\n  <p>更值得注意的是甲方的变迁：星舰最初的叙事是「人」——火星移民、太空旅行，马斯克讲了很多年；而太空算力概念兴起后，星舰的头号甲方悄然换成了「数据中心」。</p>\n  <p>逻辑没变：猎鹰 9 配约 20 吨级近地轨道运力，甲方是星链；星舰规划运力 100—150 吨（近地轨道、规划值），游客消耗不了这么大的运力，但太空数据中心需要的设备也许可以。</p>\n  <p>火箭每大一号，马斯克就得给它们「创造」一个商业层面更大的甲方。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_aa5f9d67052e4c56bbc0ac1413f12246@5579416_oswg608949oswg1080oswg588_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">星舰V3首次升空，一共搭载了33台猛禽V3助推器 | 图片来源：SpaceX</p>\n  <h2><strong>9.「筷子夹火箭」</strong></h2>\n  <p>2024 年 10 月 13 日， 星舰第五次试飞， 发射塔上两条机械臂在半空中夹住了缓缓下落的助推器， 全网刷屏。</p>\n  <p>此前，猎鹰 9 证明了火箭能「收回来」， 也能「再飞」——但每次回来要出海打捞、返厂翻修， 周期以周计， 本质上还是「修好再用」。而星舰要的是另一件事：像飞机一样， 落地、检查、加注、再起飞。</p>\n  <p>着陆腿是死重， 占运力；落在远处就要运输。让助推器直接回到发射塔的怀里， 意味着它落下来的地方就是它再次起飞的地方——中间环节被压到极限， 周转目标从「周」变成「小时」。</p>\n  <p>所谓「筷子夹火箭」，实际是指出了 SpaceX 眼中火箭的终极形态：从能回收， 到「航班化运行」。</p>\n  <h2><strong>10. 未必需要「国产星链」，但一定需要「国产运力」</strong></h2>\n  <p>「中国版 StarLink」是个流行叙事，但有个常被忽略的事实：星链解的是「地面基站够不到」的题——海上、荒野、地广人稀之处；而中国恰恰拥有全球覆盖最强的地面通信网络，星链式服务在国内的体感天然有限。</p>\n  <p>真正的命题在另一层：卫星不止通信一种用途——遥感、导航、未来的太空算力，每一样都需要把大量的东西便宜地、高频地送上天。</p>\n  <p>换句话说，中国可以不复制星链这个「产品」，但绕不开星链背后那个「运力」。对对中国商业航天而言，「要不要一张天上的网」并不是最核心的那个问题，「有没有织网的手」才是。</p>\n  <h2><strong>11. 打破「永不 IPO」的 flag</strong></h2>\n  <p>SpaceX 曾是硅谷最坚定的「永不 IPO」公司。马斯克的公开理由是，资本市场的短期主义和火星这种超长期目标不兼容。</p>\n  <p>转折发生在去年四季度：星链的用户增长和单用户收入都看得到天花板，而「太空算力」这个新故事的资本开支，大到只有公开市场才接得住。</p>\n  <p>招股书披露，仅 2026 年一季度，AI 业务的资本开支就超过了太空和连接两个板块之和。</p>\n  <p>所以，上市不是终点庆典，而是下一轮豪赌的融资动作。</p>\n  <h2><strong>12. 太空算力是「共识」，细节还是未知数</strong></h2>\n  <p>太空算力的概念虽然新，但却是科技行业在过去半年迅速达成的超级共识，几乎没有人再公开唱反调。</p>\n  <p>但往下追问一层，所有技术细节似乎都没有共同的答案：</p>\n  <p>太空数据中心长什么样？没有公开的产品定义。它算什么数据、数据从哪来？也没人知道。</p>\n  <p>借 AI 行业经典的三要素说——算法在地面狂奔，但「数据」和「算力部署」在太空语境下都还是空白。预训练还是推理？两者对供电、散热、组网的要求完全不同，对应的卫星设计也完全不同。一个被万亿资金定价的方向，连产品形态都还没收敛。</p>\n  <p>当然，如果换个角度看，这恰恰意味着牌桌上还有大量空座还没占。</p>\n  <h2><strong>13. 硅谷为「太空算力」掏出了真金白银</strong></h2>\n  <p>硅谷各大超级巨头对太空算力的支持，没有只停留在嘴上。</p>\n  <p>马斯克通过一次涉及万亿级资产的公司重组，合并了 SpaceX 和 xAI 两家公司。招股书写明，最早 2028 年部署在轨数据中心。</p>\n  <p>谷歌立项「捕日者计划」（Project Suncatcher）：发表技术论文、计划发射两颗搭载自研 TPU 的原型卫星，并在和 SpaceX 洽谈发射合同。</p>\n  <p>贝索斯的蓝色起源 2026 年 3 月向美国联邦通信委员会递交了 51600 颗数据中心卫星的「日出计划」申请。</p>\n  <p>前谷歌 CEO 施密特 2025 年收购火箭公司 Relativity Space，公开目的就是把数据中心送上轨道。</p>\n  <p>英伟达参投的 Starcloud，已于 2025 年 11 月把一块 H100 芯片送入轨道并完成在轨模型训练。</p>\n  <p>买公司、并资产、递牌照、发卫星——大家的基建竞赛已经开工。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_2f062e129bd34d5191bf67ab7c07e80c@5579416_oswg627233oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">硅谷初创公司 Starcloud 2025 年 11 月搭载 NVIDIA H100 GPU 入轨 | 图片来源：Starcloud</p>\n  <h2><strong>14. 冰冷的成本账</strong></h2>\n  <p>有航天工程师做过公开测算：建一个 1 吉瓦的轨道数据中心（约 4300 颗卫星、含五年运营），总成本超过 500 亿美元——约为地面同等规模的三倍。</p>\n  <p>要把这笔账翻过来，业内普遍的测算是入轨成本须压到每公斤约 200 美元以内，而今天 Falcon 9 对应的发射成本（请注意，「发射成本」和「入轨成本」并不完全相同）在每公斤约 2000—3000 美元。两者相差至少一个数量级。</p>\n  <p>这个数量级，需要星舰这样的二级可回收重型火箭来补课降成本。所以太空算力的时间表，是和星舰的进展深度绑定的。故事的真假，最终要用焊枪和发射台来验。</p>\n  <h2><strong>15. 更大的故事</strong></h2>\n  <p>回看 SpaceX 的成长史，它用一个买不到便宜火箭的客户，被逼成了乙方；然后又造出了自己的甲方（星链）；现在它为下一代火箭预订了一个更大的甲方（太空算力）。</p>\n  <p>过去 24 年里， 它把火箭可回收技术和星链这两个兑现前没人相信的故事变成了现实。今天，太空算力这张还没兑现的期票，以约 1.75 万亿美元的目标估值出现在了公开市场。</p>\n  <p>这次的故事比之前更大， 票价也更贵。</p>\n  <p>在我们的最新一期播客节目里，极客公园创始人张鹏进一步讲述了 2014 年马斯克第一次来华两人畅聊商业航天的逸事，太空算力投资人翟光龙则深入分析了太空算力对整个科技行业带来的影响和机会，欢迎扫码收听。</p>\n  <p>*头图来源：SpaceX</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/lpTceYXQoxlhbhPOBLBhSA\" rel=\"noopener noreferrer\" target=\"_blank\">“极客公园”</a>，作者：曹思颀，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T04:08:19+00:00", "fetched_at": "2026-06-14T03:34:54.026229+00:00", "fingerprint": "898f3bc090847a5e"}, {"source": "36氪 - 最新文章", "title": "“宁王系”，排队 IPO", "url": "https://36kr.com/p/3851106394117383?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_58350c4bd51f4d4996cf27cd413e3d9a@5579416_oswg103747oswg1080oswg460_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">越来越多CVC在路上</p>\n  <p>作者 |&nbsp;冯晓亭&nbsp;</p>\n  <p>&nbsp;编辑 | 吾人&nbsp;</p>\n  <p>来源 |&nbsp;融中财经&nbsp;</p>\n  <p>宁德时代，又出手了。</p>\n  <p>近日，中恒电气发布关于控股股东签署《战略投资合作框架协议》事项的进展公告。公告显示，公司控股股东杭州中恒科技投资有限公司（简称“中恒科技投资”）引进宁德时代新能源科技股份有限公司（简称“宁德时代”）的战略投资事宜正在有序推进中，宁德时代拟以40.9985882353亿元（约“41亿元”）认购中恒科技投资新增注册资本。</p>\n  <p>中恒电气表示，自《战略投资合作框架协议》签署后，各方基于框架协议达成的基本合意，共同推动有关中恒科技投资增资、公司与宁德时代形成战略业务合作关系等具体事宜的洽谈、磋商工作，目前相关工作仍在有序推进中。</p>\n  <p>值得一提的是，这并非宁德时代今年在资本市场首次出手。</p>\n  <p>公开数据显示，今年以来，宁德时代宣布入股的上市公司还有富临精工、赛力斯旗下的赛豆科技、世纪互联等。除此之外，今年3月，天眼查工商信息显示，博裕新智新产（宁波）股权投资合伙企业（有限合伙）发生工商变更，新增十余家投资方，其中便有宁德时代的身影；4月，宁德时代发布公告，拟设立全资子公司“时代资源集团”，后者定位为公司新能源矿产领域的专业投资运营与管理平台……凡此种种，不胜枚举。</p>\n  <p>且从宁德时代出手项目所涉猎的赛道来看，与自己的动力电池主业几乎没有直接关联。由此可见，现市值超万亿元的“宁王”从产业链协同投资，正转向更广阔的生态圈布局，未来也将有越来越多的“宁王系”企业推开二级市场大门。</p>\n  <p>而跨界进行投资布局的宁德时代并非孤例。放眼望去，越来越多产业龙头正做出相似的战略选择。在传统股权投资机构募资困难、退出遇阻的背景下，以产业龙头为核心的CVC，正逐渐成为中国创新资本市场不可忽视的一支力量。</p>\n  <h2><strong>41亿元，宁王入股中恒电气</strong></h2>\n  <p>这笔交易，前后历时两个月时间。</p>\n  <p>早在今年4月，中恒电气发布公告称，公司控股股东中恒科技投资拟接受宁德时代对其进行增资。拟议增资完成后，中恒科技投资控股股东朱国锭和包晓茹，以及宁德时代分别持有中恒科技投资35.70%股权和15.30%股权、49.00%股权。受此利好消息影响，公告发布次日开盘，中恒电气一字涨停。</p>\n  <p>谈及下一步规划，中恒电气在公告中表示，“各方发挥各自在相关领域的核心竞争力和资源优势，促进宁德时代与中恒电气围绕绿色ICT基础设施、交通电动化、新型电力系统（算电协同）等领域开展相关业务及战略合作，整合资源禀赋，赋能公司发展。”</p>\n  <p>要了解双方为何跨界联手，得先从认识中恒电气说起。</p>\n  <p>作为一家专注于零碳智能社会建设的数字能源公司，中恒电气深耕高压直流技术路线。公司主营业务涵盖数据中心与站点能源、数字电网与综合能源服务等领域，是数据中心HVDC（高压直流）供电技术方案的行业先行者，核心产品包括数据中心HVDC直流供配电、预制化Panama电力模组、通信电源系统、电力操作电源系统等，目前已广泛应用于互联网、第三方colo、智算中心、超算中心、通信运营商、金融政企等数据中心场景。</p>\n  <p>虽然名声不显，但国内HVDC行业集中度高，主要有中恒电气、维谛技术等，其中中恒电气凭借客户壁垒与技术优势成市占率第一企业，头部效应有望延续。</p>\n  <p>目前，AIDC（人工智能数据中心）投资进入高速扩张周期，数据中心供配电市场广阔。全球主要云厂商资本开支已进入放量期，以亚马逊、微软、谷歌、Meta为代表的海外头部云厂商单季度资本开支总额均在持续攀升，增长显著。资本开支的增量主要投向AI基础设施，驱动AIDC投资进入高速扩张周期。供配电系统作为AIDC的底层支撑，其投资规模与云厂商资本开支增长呈强正相关，变压器、HVDC、UPS、开关柜等关键设备需求将同步增长。</p>\n  <p>与此同时，随着AI大模型的训练与推理需求快速扩张，数据中心的用电量和供电稳定性要求也在同步攀升，配储也相应成为刚需。配储这个场景，恰恰是宁德时代的主场。</p>\n  <p>双方联手后，可协同解决AI智算中心绿电适配、峰谷调节等核心痛点，共同打造从绿电生产到储能、高效供电、算力消耗的全链路解决方案。简单说，宁德时代的储能系统可以跟着中恒的HVDC，顺着数据中心的渠道，进入一座又一座机房。在此之前，宁德时代便和商汤科技合作，在上海落地了临港智算中心（AIDC），共同建设了一套规模为17.888MW的储能系统，成为算电协同跑通的标杆项目之一。</p>\n  <p>至于宁德时代和中恒电气交易达成后会擦出怎样的火花，我们不妨拭目以待。</p>\n  <h2><strong>“宁王系”，遍布资本市场</strong></h2>\n  <p>跨界入股上市公司，对宁德时代而言并非新鲜事。</p>\n  <p>今年以来，宁德时代便以“股权投资+业务合作”的战略投资模式，直接或间接入股多家上市公司。1月，宁德时代和富临精工合作，双方意在加强在新能源产业的深度合作，同时在新兴产业领域构建务实合作格局，实现更深层次的资源整合与战略合作；5月，美股上市公司世纪互联发布公告表示，宁德时代关联公司PJ Millennium，以9.42亿美元（约合64亿元人民币）收购了该公司约6.5亿股A类普通股，有望成为该公司的第一大股东……</p>\n  <p>入股上市公司仅是宁德时代投资版图的冰山一角，在投资圈内，它早已是CVC领域的“老手”，于水面之下构筑起了一座横跨产业链上下游的庞大投资帝国。</p>\n  <p>企查查数据显示，宁德时代对外投资了158家企业，间接持股企业数量更是数以万计，<strong>通过投资，宁德时代的触手深入锂电原材料、整车、新能源、航空航天、具身智能等多个前沿赛道。直投项目中，先导智能、奇瑞汽车、首航新能、极氪汽车、日联科技、微导纳米等项目已成功IPO。</strong>与此同时，还有大批“宁王系”项目，站在二级市场门外，等待IPO。</p>\n  <p>与此同时，晨道资本、一村资本、恒旭资本、博裕资本、高瓴创投、国策投资、中金资本、普洛斯隐山资本、溥泉资本等多家投资机构的背后，都有宁德时代的身影。</p>\n  <p>其中，溥泉资本由宁德时代CVC“宁德时代新能源产业投资有限公司”持股，是后者的核心产业投资平台。据了解，溥泉资本旗下时代泽远基金历经多轮扩募，目前规模已百亿元，聚焦新能源、新能源汽车产业链、储能、机器人、高端制造、半导体芯片六大核心方向。截至目前，基金已落地近30个优质项目，累计投资金额近60亿元，单个项目平均投资额超2亿元。</p>\n  <p>团队充分发挥产业资本优势，以大比例、低成本方式入局，深度赋能产业链上下游企业。依托宁德时代深厚的产业协同能力，溥泉资本打造了特色化产投模式：一方面深度布局硅碳负极、电池管理系统、能源管理系统等锂电配套企业；另一方面发力通用机器人、智能机械手、自动驾驶矿车等高端制造领域。目前多个被投企业已启动上市申报工作，不少项目即将登陆港股、A股，投资成果丰硕。与此同时，机构同步推进并购基金、早期科技基金、海外美元基金布局，构建起多层次、全周期的投资体系，全面覆盖资源并购、早期科创、成熟项目投资等多个领域。</p>\n  <p>在溥泉资本投资项目中，独角兽银河通用机器人近日可谓风光无两，于今年3月正式宣布完成新一轮25亿元融资。值得关注的是，本次融资也是大基金通过国家人工智能产业投资基金首次出手投资具身智能赛道企业。</p>\n  <p>在宁德时代做LP这条路上，最新一幕发生在��年3月。彼时，天眼查工商信息显示，博裕新智新产（宁波）股权投资合伙企业（有限合伙）发生工商变更，新增宁德时代、腾讯、泡泡玛特、唯品会、宁波金控系、北京国管系、国泰海通系等十余家合伙人，出资额由200万元增至约40亿元。值得一提的是，这不是宁德时代和博裕资本首次合作，据悉，该基金将主要投资于科技、医疗健康、消费品和零售领域的成长期及成熟期企业。</p>\n  <p>不知不觉间，宁德时代的资本触角已经不再只服务于自身的供应链，而开始指向更广泛的财务回报和生态构建。</p>\n  <h2><strong>宁德时代之外，CVC崛起正当时</strong></h2>\n  <p>触手遍布创投圈的宁德时代并非孤例，在这背后其实是一个更大趋势的缩影。</p>\n  <p>CVC即“公司风险投资”，是指具有主营业务的非金融企业通过子公司对创业企业进行股权投资的行为。其核心特征包括依托母公司资源、追求战略协同效应而非单纯财务回报、激励机制受母公司制度约束等。投资对象多集中于与母公司行业关联度高或早期创新项目，退出时优先收购被投企业。</p>\n  <p>中国CVC起步较晚，1998年实达集团投资北京铭泰科技发展公司被视为第一个初具规模的CVC投资案例。随后一段时间发展较为缓慢，直至2010年前后，随着腾讯、阿里巴巴等互联网头部企业相继设立战投部门，中国CVC进入发展窗口期。2013年至2015年，在“大众创业、万众创新”的背景下，CVC投资案例数和金额呈现爆发式增长。近年来，投资主体从互联网巨头进一步扩展到宁德时代、华为哈勃投资等硬科技产业资本。</p>\n  <p>成立于2019年的哈勃投资，由华为投资控股有限公司全资控股，注册资本30亿元，管理规模约70亿元。据企查查数据，哈勃投资对外投资项目共有132个，重点覆盖半导体芯片设计、EDA工具、封装测试、半导体材料与设备等产业链各环节。</p>\n  <p>其中十余个项目已成功IPO，分别是瀚天天成、强一股份、昂瑞微、天域半导体、天岳先进、矽电股份、赛目科技、华丰科技、美芯晟、裕太微、杰华特、源杰科技、唯捷创芯、长光华芯、东微半导、炬光科技、东芯股份……项目清一色属于硬科技赛道。近年来，哈勃投资进一步将触角延伸至AI大模型和具身智能领域，入股了面壁智能、千寻智能、极佳视界等明星企业。</p>\n  <p>在创投圈，联想创投同样是CVC阵营中一股不容小觑的强劲力量。</p>\n  <p>“上一财年，联想创投年投资收益、IPO数量及被投企业生态协同金额等核心数据均创历史新高，交出了一份投资成果与产业价值并举的成绩单。”今年4月1日，联想集团副总裁、联想创投管理合伙人王光熙在联想集团2026/2027财年誓师大会演讲中说道。</p>\n  <p>累计投资超过300家科技企业，其中25家已成功上市；为联想集团年平均贡献收益超10亿元人民币——这是联想创投成立的第十个年头交出的一份可量化答卷。</p>\n  <p>政策层面的鼓励也在同步推进。2025年3月，深圳市发布《深圳市促进风投创投高质量发展行动方案（2025-2026）》，明确支持产业链主企业、上市公司开展企业风险投资（CVC）。“推动我市产业链主企业、大型科技企业和上市公司围绕产业链上下游开展企业风险投资（CVC）、参与上下游协同创新；探索设立面向CVC机构的专业化母基金，联合产业龙头、上市公司等共同出资设立一批‘链主’基金，推动重点产业‘补链强链延链’。”</p>\n  <p>今年4月，上海市国资委发布《关于进一步推动市国资委监管企业私募股权投资基金高质量发展的指导意见》，提出“鼓励监管企业发起设立创业投资基金，着力投早、投小、投长期、投硬科技”“鼓励龙头企业设立企业风险投资基金（CVC基金），围绕创新链布局孵化科创项目”“鼓励监管企业加大S基金、并购基金等组建力度”。</p>\n  <p>政策支持、产业需求、资本转向……在各方利好作用下，将有更多CVC在路上。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/Yak7o1sxORVZ6QwXfe-mjw\" rel=\"noopener noreferrer\" target=\"_blank\">“融中财经”</a>，作者：冯晓亭，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T04:59:03+00:00", "fetched_at": "2026-06-14T03:34:54.026223+00:00", "fingerprint": "051b636309cd3049"}, {"source": "36氪 - 最新文章", "title": "36氪研究院 | AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑", "url": "https://36kr.com/p/3846972367866119?f=rss", "summary": "<p>在AI浪潮重塑全球产业逻辑的当下，传统留学路径所依赖的学历溢价与信息差正在系统性失效，大量高薪专业的基础性任务面临被AI批量化替代的风险。70/80后家长遭遇教育投资回报率骤降，05后年轻一代则陷入人机协同时代“何以确立自身不可替代价值”的身份焦虑。面对旧共识瓦解、新航线未明的历史性分水岭，36氪研究院与新通教育联合发布《AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑》。白皮书基于新通三十年积累的百万级家庭服务数据及36氪研究院对2030年全球新兴产业集群的前瞻研判，倡导回归全生命周期的长期主义，为留学家庭提供一份客观、中立的未来就业生存指南。</p>\n  <h2><strong>从“向外破局”到“向内扎根”：中国留学生三十年心理变迁史</strong></h2>\n  <p>中国留学行业三十年，其底层逻辑是一部中产家庭的教育焦虑与价值观重塑史。留学意义经历了五个阶段的变迁——从生存驱动、打破信息垄断的拓荒破冰，到追逐名校光环的晋升通道，再到就业预期前置的工具理性内卷，继而转入风险规避与心理议题凸显的疫情重塑期，直至当下AI浪潮中意义感赤字、情感支撑成为刚需的新阶段。</p>\n  <p>过去留学的核心驱动力是向外打破信息差；如今，AI加速替代标准化岗位，学历信号与职业回报之间的因果链断裂，留学价值正悄然转向向内构建内核力。读懂这条心理变迁曲线，才能在不确定性洪流中为家庭锚定稀缺的确定性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260612/v2_55d528cdc42f41bc82f5a9369f3c901a@6387155_oswg186588oswg837oswg501_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <h2><strong>2030「CORE」未来胜任力模型：AGI时代穿越周期的“专属内核”</strong></h2>\n  <p>36氪研究院针对全球知名企业中层管理者的专项调研显示，AGI时代企业对海归人才的需求已从“唯名校、唯技能”转向“重内核、重潜能”。企业核心需求聚焦四大AI难以替代的深层素养：高效驾驭AI的人机协同能力、化解跨文化冲突的协作能力、抗压担当的韧性，以及洞察需求的人文共情能力。在此基础上提炼形成面向2030的留学生核心竞争力「CORE」模型--决定留学生能否跨越周期不被淘汰的，不再是技能包装或名校标签，而是其不可替代的“专属内核（CORE）”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_231e862526814f9b950ae6569ab7534f@6387155_oswg2854672oswg3356oswg1980_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <h2><strong>告别经验主义：用仿真器，绘制专业价值的新坐标</strong></h2>\n  <p>传统“热门专业即好就业”的线性逻辑，正被AI瓦解——大量标准化任务被自动化，仅凭历史数据判断专业价值的有效性正快速衰减。世界经济论坛预测，到2030年全球将有9200万个岗位被替代，同时新增1.7亿个新岗位，就业市场面临激烈重置。</p>\n  <p>36氪研究院依托深厚的产业洞察、权威评估体系、岗位增长与人才缺口数据，结合中国“十五五”产业方向，构建了以“AI任务自动化风险度”为横轴、“人类护城河深度”为纵轴的专业分析模型，将所有专业划分为三个区域——高护城河区、前沿探索区和审慎选择区。该划分方法的核心在于：AI替代的不是专业本身，而是专业内的特定任务；每个专业实为不同任务区的混合体，各区占比及任务向高自动化区域的迁移速度，决定了其结构性风险暴露程度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_5817b0ed4d514159adcaa6926bd28753@6387155_oswg3746695oswg2976oswg2292_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <h2><strong>锚定政策确定性，布局高科技、高效能、高质量产业方向</strong></h2>\n  <p>“十五五”规划纲要首次将“建设现代化产业体系”与“加快高水平科技自立自强”并列为两大打头阵的战略，标志着政策重心从规模扩张转向基础研究和原始创新驱动，资源配置优先级也从技术含量有限的规模化领域转向前沿技术。</p>\n  <p>为此，36氪研究院基于对“十五五”规划纲要的深度研判，结合新质生产力“高科技、高效能、高质量”的标尺，沿“政策导向—产业集群—就业方向”这一逻辑主线，对“十五五”时期七大黄金赛道——“<strong>AI+、低空经济与空天信息、合成生物与生命健康、绿色低碳与ESG、量子技术与前沿材料、智能制造与工业互联、数字出海与全球战略</strong>”展开深度解读，力求为新一轮产业升级中的就业趋势与人才结构性需求研判，提供一份具有前瞻性和战略参考价值的分析框架。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7142093951954ca6aa3ef5ed0bec451a@6387155_oswg5119378oswg3084oswg2376_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;&nbsp;</p>\n  <p><strong>本报告重点研究问题如下：</strong></p>\n  <ul>\n   <li>过去三十年中国留学生的心理需求经历了怎样的变迁？留学服务行业又随之发生了怎样的重构？</li>\n   <li>AGI时代，全球高校人才选拔逻辑与企业招聘需求正在经历哪些深层重构？</li>\n   <li>面向2030年，海归人才不可替代的核心竞争力是什么？“2030「CORE」未来胜任力模型”如何定义？</li>\n   <li>如何科学评估不同专业在AI时代的“风险敞口”与“增值潜力”？专业价值坐标体系发生了怎样的位移？</li>\n   <li>“十五五”规划指引下，有哪些值得重点布局的黄金赛道？它们分别对应哪些就业方向与专业选择？</li>\n   <li>在AGI技术深度渗透的背景下，传统专业如何通过“数字跃迁”实现价值升级？</li>\n  </ul>\n  <p>更多精彩内容，详见《AI时代留学就业白皮书：中国留学生全球就业趋势与人才价值重塑》，点击<a href=\"https://pan.baidu.com/s/1r1wZhIVDHBxIQNH75dRhaA?pwd=9f2z\" rel=\"noopener noreferrer\" target=\"_blank\">下载链接</a>，提取码：9f2z</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d03450fb33804b31bb3c7c0cb1491fcd@6387155_oswg3168280oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_452c808b2856488c8d4a7bd2526e779c@6387155_oswg2227422oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_edd5f5c5ff764bac9326b299cf91b34f@6387155_oswg687588oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_c6abb42feea0470c83ac78921a09d398@6387155_oswg334431oswg4762oswg6735_img_png?x-oss-process
