<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

ty. If you prefer to go in blind - the ideal way to watch any movie - Oddity [&#8230;]", "category": "tech", "published_at": "2026-05-17T14:00:00+00:00", "fetched_at": "2026-05-18T02:53:24.234683+00:00", "fingerprint": "a6f260c5a0faf5c8"}, {"source": "The Verge", "title": "University of Arizona students boo Eric Schmidt’s AI cheerleading during commencement", "url": "https://www.theverge.com/ai-artificial-intelligence/932203/university-of-arizona-students-boo-eric-schmidt-ai-commencement", "summary": "Former Google CEO Eric Schmidt delivered the commencement address at the University of Arizona on Friday. And, as his speech veered into talk of AI, he was repeatedly drowned out by boos. AI is already a contentious topic, and it's not surprising that those about to enter a ravaged job market feel particularly negative about [&#8230;]", "category": "tech", "published_at": "2026-05-17T17:22:23+00:00", "fetched_at": "2026-05-18T02:53:24.234678+00:00", "fingerprint": "e76ea613258ea2be"}, {"source": "The Verge", "title": "Revamped Siri will reportedly offer auto-deleting chats", "url": "https://www.theverge.com/tech/932207/siri-apple-intelligence-auto-deleting-chats", "summary": "Apple is hoping that its record on privacy can be the differentiator on the AI front, and maybe even buy it a little slack as it continues to lag behind the competition. According to Bloomberg's Mark Gurman, the more chatbot-like Siri set to debut in iOS 27 will include the option to autodelete chat histories. [&#8230;]", "category": "tech", "published_at": "2026-05-17T18:40:28+00:00", "fetched_at": "2026-05-18T02:53:24.234671+00:00", "fingerprint": "df560ca46adaef07"}, {"source": "The Verge", "title": "Microsoft is retiring Teams’ Together Mode", "url": "https://www.theverge.com/tech/932215/microsoft-teams-together-mode", "summary": "Microsoft launched Teams' Together Mode during the pandemic to give the illusion of a bunch of people sitting in a conference room together, even if they were really sitting at home without pants on. But times have changed, and it's now being retired in favor of a more simplified Teams experience. The feature used AI [&#8230;]", "category": "tech", "published_at": "2026-05-17T21:15:28+00:00", "fetched_at": "2026-05-18T02:53:24.234660+00:00", "fingerprint": "749d7251d454f926"}, {"source": "36氪 - 最新文章", "title": "3个人带100个AI程序员，一个月烧掉130万美元！OpenAI：钱我出", "url": "https://36kr.com/p/3812925591887368?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_399370c00c2a4df2b0ea4535d62d0160@5579416_oswg664907oswg1080oswg463_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Peter Steinberger</p>\n  <p>编辑：所罗门</p>\n  <p><strong>【新智元导读】3个人，100个AI agent，一个月烧掉130万美元——OpenClaw之父把软件开发变成了「AI流水线」，OpenAI替他买单。</strong></p>\n  <p>别人晒工资条，他晒账单——<strong>一个月130万美元！</strong></p>\n  <p>也就是将近900万人民币/每月。直接把网友们看傻了。</p>\n  <p>OpenClaw之父Peter Steinberger在X上轻描淡写地甩出一张截图。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_733f64563eac4279b50b9b9766e65770@5579416_oswg591789oswg1080oswg1231_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Peter Steinberger</p>\n  <p>但截图上的数字，属实不淡定：</p>\n  <p><strong>30天花费：$1,305,088.81。吞掉6030亿个token。发起760万次请求。</strong></p>\n  <p>你没看错，是130万<strong>美元</strong>。也不是哪家大厂的季度AI预算——<strong>一个3个人的小队，一个月的用量。</strong></p>\n  <p><strong>更炸裂的是：这钱，OpenAI给报销。</strong></p>\n  <p>评论区瞬间就疯了。</p>\n  <p>有人惊叹，有人质疑，有人掏出计算器开始算「这到底顶多少个程序员」。</p>\n  <p>Steinberger本人谈定回应：「关闭快速模式后，我的花费低于一个工程师的成本，而且这确实帮助大得多。」</p>\n  <p>翻译下就是——<strong>属实划算！</strong></p>\n  <p>更有网友惊叹于月薪40万刀的工程师——「旧金山的就业市场过于疯狂。」</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_1aa15ca9dfa74bd4a3f8f650371316b7@5579416_oswg304582oswg1080oswg792_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网友评论</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_f5f52273edf34125a620ed9d05b60a3d@5579416_oswg268984oswg1080oswg634_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网友评论</p>\n  <p>还有网友好奇，这个大量的Token花在了哪里。</p>\n  <p>Peter回应大部分都用在了OpenClaw的开发上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_4cc550f115a645cda4b98a1396684143@5579416_oswg138865oswg1080oswg452_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网友评论</p>\n  <h2><strong>云端程序员军团</strong></h2>\n  <p>这件事最离谱的是，Pete的小团队只有3个人。</p>\n  <p>他们在云端长期跑着约100个 Codex 实例，干软件工程里最脏、最累、最容易把人逼疯的活——</p>\n  <p>审PR、找安全漏洞、去重issue、改bug、监控benchmark、发现回归后发到Discord，甚至听完会议后直接开PR。</p>\n  <p>于是，AI不只是「帮你写代码」，而是进入软件协作的每一个缝隙。</p>\n  <p>这就很吓人了。</p>\n  <p>因为软件开发真正贵的是沟通、理解、上下文切换、审查、回归、修复、等待、重复劳动。</p>\n  <p>过去一个团队每天大量时间，消耗在这些看起来不像「创造」、但没有它们项目就会烂掉的事情上。</p>\n  <p>现在，Peter 把这些环节一口气丢给了一群AI agent。</p>\n  <p><strong>这是AI开始替��维护一个组织的神经系统。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_57785ec9cd9d42028f5f298cbe0846a1@5579416_oswg1998728oswg1055oswg1491_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">示意图</p>\n  <p>这张截图还有一个细节很重要：它不是OpenAI后台，而是 Peter 做的 CodexBar。</p>\n  <p>CodexBar 是一个 macOS 菜单栏工具，用来追踪各种AI编程工具的使用窗口、credit、成本和重置时间。</p>\n  <p>它支持 Codex、Claude、Cursor、Gemini、Copilot 等一堆服务。</p>\n  <p>以前程序员的菜单栏里是什么？CPU、内存、电量、网速。</p>\n  <p>现在多了一个东西：token。<strong>token正在变成一种新的「生产资料」。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_f8b24ef7058341c0a5a055f0e1b21748@5579416_oswg279085oswg1080oswg874_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">CodexBar</p>\n  <h2><strong>最后说两句</strong></h2>\n  <p>130万美元一个月，3个人，100个AI agent。</p>\n  <p>你细品这组数字——三个活人，带着一百个不吃饭不睡觉不提涨薪的数字员工，把一整个工程团队的活儿给干了。</p>\n  <p>有人看完热血沸腾：AI终于不是只会聊天的花瓶了！也有人看完脊背发凉：等等，那我们这些写代码的，以后干嘛去？</p>\n  <p>但说实话，最让我睡不着的，是Steinberger那句轻飘飘的话：<strong>「我在探索，如果token成本不是问题，软件开发会变成什么样。」</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_e1e639a607ec4bbfbd4e501124e1886d@5579416_oswg344211oswg1080oswg982_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Peter Steinberger</p>\n  <p>各位，他说的是「如果」。</p>\n  <p>可问题是，这个「如果」正在以肉眼可见的速度变成「当」。</p>\n  <p>今天130万美元干的活儿，模型降一轮价，13万。再降一轮，1.3万。</p>\n  <p>到那一天，100个AI agent同时干活，不再是硅谷大佬的独家游戏，而是随便一个三人创业团队的基本操作。</p>\n  <p>车库里三个年轻人，手握一百个不知疲倦的AI程序员——这画面，想想就离谱。</p>\n  <p>Peter Steinberger掀开了底牌。</p>\n  <p>底牌上写着：<strong>未来已经在敲门了，而且它不打算等你准备好。</strong></p>\n  <p>参考资料：</p>\n  <p>https://the-decoder.com/for-1-3-million-a-month-openclaw-founder-peter-steinberger-runs-100-ai-agents-that-code-review-prs-and-find-bugs/</p>\n  <p>https://x.com/steipete/status/2055346265869721905</p>\n  <p>https://developers.openai.com/codex/speed</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/5O0b8Q0xTKU6_jHq93IUwA\" rel=\"noopener noreferrer\" target=\"_blank\">“新智元”</a>，作者：新智元，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-17T06:08:32+00:00", "fetched_at": "2026-05-18T02:53:24.128155+00:00", "fingerprint": "d414da8ca77452fa"}, {"source": "36氪 - 最新文章", "title": "又诞生一位千亿女富豪", "url": "https://36kr.com/p/3813040859258373?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_f37d0b5651d64379a82dd7eca23a4dfa@5579416_oswg65665oswg1080oswg780_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">示意图</p>\n  <p>自4月初以来，立讯精密股价上涨超过55%。</p>\n  <p>5月11日，立讯精密市值创下历史新高，达到了5542亿人民币。立讯精密掌舵者王来春持股18.75%，身价也突破了千亿人民币，成为国内白手起家的又一位千亿女富豪。</p>\n  <p>如果说4月以来的涨幅，是因为立讯精密“站在光里”，短期股价大涨或许与一则收购公告有关。</p>\n  <p>5月10日，公告显示立讯精密拟通过收购京西智行集团全部股权，间接拿下京西国际约59.50%股份，有望成为其最终控股股东。这是立讯精密继两年前收购德国莱尼后，在汽车领域的又一关键资本动作。</p>\n  <h2><strong>郭台铭门 徒</strong></h2>\n  <p>立讯精密的故事通常被描述为“打工妹”逆袭成为女富豪的爽文剧本。实际上，只单纯地给创始人王来春贴上“打工妹”的标签，就像是只把立讯精密当做一家代工厂。</p>\n  <p>与现在创业者的背景不同，王来春既不是天才少女，也不是海归精英。她出生于20世纪60年代末的潮汕地区，当时物质和思想都极度匮乏，农家女出身的她，更是过早地尝到了生存的艰辛。</p>\n  <p>1988年，改革开放的风头正盛，21岁的王来春选择到最热闹的深圳求职，此时正赶上郭台铭来内地创业，于是，机缘巧合下，她成为了富士康首批150名员工之一。</p>\n  <p>早期的富士康被外界称为“血汗工厂”，流水线两班倒，每天站12个小时是家常便饭，累了一天，洗澡还得等。很多人受不了这份苦，干了几个月就走了，但王来春却坚持留了下来，这一留就是十年。</p>\n  <p>这十年间，王来春不仅成为了大陆员工里职位最高的女主管，还像海绵一样吸收了消费电子行业的大量经验，成长为了郭台铭最出色的学生。</p>\n  <p>一个细节是，她在立讯几乎复制了富士康模式，工厂管理军事化，连车间里都挂着郭台铭的管理语录。对于“徒弟”的成功，郭台铭曾公开评价：“富士康在中国大陆创造了很多亿万富翁，王来春是最具代表性的一位！”</p>\n  <p>1999年，受金融危机影响，香港很多公司都破产倒闭了。王来春看准机会，毅然辞去富士康高管职位，和哥哥王来胜共同收购了香港立讯公司。面对这一冒险举动，她的家人是反对的，其母亲甚至把家里的现金和存折都藏了起来。</p>\n  <p>然而，这并非是王来春的冲动之举，在立讯早期，王来春选择依附富士康生存，“富士康开到哪，立讯就跟到哪”，专门承接其一时无法处理的订单：低毛利的，高难度的。富士康给什么，她就做什么，在定价方面也完全由富士康说了算。</p>\n  <p>所以成立后的很长一段时间内，富士康始终是立讯的第一大客户，这种关系也让富士康越来越离不开立讯，因此，郭台铭兄弟还入股了立讯。</p>\n  <p>2004年，王来春成立立讯精密工业股份有限公司，开始独立开发自有客户并自主研发产品，逐步向高端产品线迈进。尽管如此，到2010年，立讯精密上市时，富士康依然为立讯精密贡献了一半销售额。</p>\n  <h2><strong>库克时代</strong></h2>\n  <p>如果说2010年之前的立讯精密，还是一个标准的“小富士康”，还是在王来春的舒适区里创业，那么2010年之后，立讯精密的发展，则完全依赖于王来春的智慧与资本布局。</p>\n  <p>因此，业内流传着一个说法—立讯精密真正的创业之路是从2011年开始的。</p>\n  <p>这一年，已经上市的立讯精密有了充裕的现金，此时的王来春不再满足于代工，把赚来的钱全部砸进了更难的技术领域，一边寻求转型，一边开始“去富士康化”。</p>\n  <p>也是在这一年，代工领域一个时代性的机会出现了。</p>\n  <p>2011年，库克执掌苹果并推行供应链多元化，王来春意识到，新帅上任，势必调整布局、扶植自己的心腹伙伴。若能在此时跻身“果链”并获库克青睐，立讯便有望摆脱依赖外部溢出订单的处境。</p>\n  <p>于是，她开启了一系列激进的“资本换技术”的并购。</p>\n  <p>并购的第一枪打在了昆山联滔电子身上，立讯精密斥资11.8亿元收购了其60%的股权，此举规避了苹果复杂的考核机制，使得立讯精密顺利进入了苹果供应链。</p>\n  <p>这起并购案只是一个开始，2016年，它又收购了苏州美特51%股权，靠着苏州美特在声学领域的多年积累进入到了声学领域，并在下一年获得了苹果AirPods的生产机会。</p>\n  <p>据悉，当时苹果的AirPods主要由台湾英业达生产，但英业达生产效率很低，经常出现供货延迟的情况，立讯精密拿到订单后攻克了AirPods生产效率低的问题，最终成为AirPods全球最大的供应商。</p>\n  <p>2020年7月，立讯精密又收购了江苏纬创、昆山纬新两家公司，正式切入iPhone代工领域，成为了中国大陆首家、全球第三家iPhone整机制造商，打破富士康、和硕的垄断格局，并于2021年首次获得iPhone 13部分订单，实现了从零部件供应商向整机组装商的关键转型。</p>\n  <p>2021年，立讯精密已发展成为营收超1500亿元，苹果业务占比达七成的全球消费电子巨头。</p>\n  <p>可此时，王来春却推出了三个五年计划，全方位发展消费电子、汽车、通信、工业、医疗等业务，并在汽车领域制定了Tier1业务进入全球前十的战略目标。她还提出，十年内将单一客户营收占比降至1/3以下，这个客户，就是苹果。</p>\n  <p>后来有分析称，王来春之所以如此决绝是因为看到了苹果供应商欧菲光的下场，2021年3月，欧菲光被踢出苹果供应链，但由于其业务太过于依赖苹果，进而受到了重创。</p>\n  <p>现在看来，立讯精密摆脱“果链依赖症”的效果也非常明显，从2021年到2025年，苹果贡献的业绩占比分别为74%、73%、75%、71%、57%。</p>\n  <p>整个库克时代，立讯精密陪伴苹果走过了十五年，业务覆盖了其各个业务线，营收也从25.6亿元增长至了3323.4亿元，市值也随之增长了近40倍。而如今库克即将退休，立讯精密也找到了汽车电子、通信业务等新增长引擎。</p>\n  <p>从某种程度上来说，这也是另一种圆满。</p>\n  <h2><strong>公司上市十六年，她身价涨千亿</strong></h2>\n  <p>再说回开篇提到的对京西国际的收购，这笔交易之所以能够直接带动立讯精密股价的上涨，与前文提到的“Tier1业务进入全球前十的战略目标”有直接关系。</p>\n  <p>此前，立讯精密的汽车业务主要集中在“线束”和“连接器”领域，而京西国际的优势在悬架系统和制动系统，这笔收购直接补齐了立讯精密在底盘域执行机构的短板。</p>\n  <p>更重要的是，京西国际拥有从德尔福继承的磁流变悬架和线控制动等全球稀缺技术，也拥有宝马、保时捷等欧洲顶级车企客户。要知道，底盘认证周期高达3至5年，技术壁垒极高，立讯通过这笔收购，相当于买了个时间差，直接拿到了这些高端客户的“入场券”。</p>\n  <p>另外根据去年财报，汽车电子作为第二增长曲线，迎来了爆发式跃升。该板块实现营收392.55 亿元，同比大幅增长185.34%，营收占比快速提升至 11.81%，成为立讯精密增长最强劲的引擎。</p>\n  <p>当然，5月11日市值能够创下新高，也离不开其四月底以来持续利好消息带来的股价拉升。</p>\n  <p>4月27日，立讯精密收获了又一个涨停，最高冲到了72.6元，创下历史新高，总市值突破5200亿元。当天天风国际分析师郭明錤独家爆料，OpenAI计划自研手机，立讯精密成为独家系统联合设计和制造合作伙伴，同时，公司预告2026年上半年归母净利润78.4亿—81.06亿元，同比大增18%-22%。</p>\n  <p>在此基础上，立讯精密近期披露，将持续加大铜光互连、散热及电源等核心产品的研发投入与产能布局，热门概念叠加下，立讯精密获得了资本真金白银的投票。</p>\n  <p>从2010年上市时不足70亿元的市值，到如今5542亿元的巨头，立讯精密用16年完成了79倍的市值增长。而王来春的身价也从上市之日的23亿元增长到了1039亿，实现了超千亿的财富增加。</p>\n  <p>然而，这并非是王来春身价的顶点。毕竟立讯精密已经向港交所递交了上市申请书，冲刺A+H上市，并预计今年下半年登陆港交所。</p>\n  <p>那时，“A股果链一哥”将向全球科技制造龙头发起冲击，更重要的，其作为全球唯一同时布局消费电子、汽车与光通信产业的企业，其资本溢价将进一步释放，王来春的新故事也将开启新篇。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/NTOoDiyonk4gU9Jg7CDZgQ\" rel=\"noopener noreferrer\" target=\"_blank\">“投中网”</a>，作者：张雪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-17T07:45:47+00:00", "fetched_at": "2026-05-18T02:53:24.128149+00:00", "fingerprint": "f5a416584841a5f7"}, {"source": "36氪 - 最新文章", "title": "科氪 | 对话韶音高层：开放式耳机，凭什么成为下一场颠覆TWS的“品类革命”？", "url": "https://36kr.com/p/3813305543794440?f=rss", "summary": "<h2>从运动孤岛到品类革命：解构韶音的“开放式”野心与底层技术硬实力</h2>\n  <p>在消费电子行业普遍面临增长红利见顶的今天，音频赛道却正在上演一场深刻的结构性变革。2026年5月15日下午，大雨初晴的深圳湾广场，Shokz韶音举办了备受瞩目的媒体专访会。韶音中国区CEO杨云与产品线总裁张浩锋悉数到场，向外界系统阐述了这家以“骨传导”和“运动”起家的品牌，如何在稳坐全球开放式耳机出货量第一王座的同时，向更广阔的泛场景音频帝国发起攻坚。</p>\n  <p>过去两年，开放式耳机在中国蓝牙耳机市场的整体销售额份额已率先突破30%。这不仅是一次产品形态的更迭，更是一场由韶音引领、正在席卷全球的“品类级替代”风暴。</p>\n  <h2>一、 宏观战略与行业洞察：以“全场景品类替代”重塑全球音频版图</h2>\n  <p>过去，大众对韶音的认知多停留在“专业运动”与“骨传导”这两个标签上。然而，在本次专访中，韶音高层明确指出，专业运动与泛场景用户从来不是一道非此即彼的选择题。韶音正在做的事情，是将用户的定义从最初的“专业运动人群”彻底拓展到“每一个需要开放聆听的用户”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_b11dfaa65fc9473890bce2c31e70882a@517825446_oswg1419174oswg6000oswg4001_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <h3>1. 舒适成为刚需：跨越品类鸿沟的终极逻辑</h3>\n  <p>韶音之所以做出“开放式耳机有机会取代真无线耳机”这一极具前瞻性的行业断言，其核心洞察深植于用户日常用耳习惯的根本性改变。随着线上办公、远程会议、长音频内容、网课以及日常碎片化聆听需求的激增，现代人佩戴耳机的时间正在无限拉长。</p>\n  <p>在长时间佩戴的背景下，传统入耳式耳机带来的耳道压迫、闭塞闷痛、卫生隐患以及无法感知外界环境的安全痛点，逐渐演变为不可调和的刚性冲突。而开放式耳机所具备的“全天候舒适佩戴”与“安全开放聆听”的天然优势，正让它从一款特定场景的“运动副机”，跨越成为用户日常生活中无可替代的“主力设备”。在音质水平已经通过近年来的技术迭代基本解决、甚至在部分产品上（如OpenFit Pro）接近或超越传统入耳式耳机的今天，用户在舒适度与开放感知方面的倾斜，成为了开放式耳机跨越品类鸿沟的决定性力量。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_c0d439dd784549eebf64a70d3bd2e784@517825446_oswg52489oswg1706oswg960_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <h3>2. 全球化视野下的“GLOCAL”战略</h3>\n  <p>在出海与全球化版图中，韶音在2023年至2025年间已连续三年斩获开放式耳机市场全球出货量份额第一的桂冠()。数据显示，不仅是中国市场在狂飙突进，在全球重点市场如美国、欧洲、日本、韩国、澳大利亚等地区，开放式耳机占比持续上升、对传统入耳式耳机产生强烈替代的趋势也已不可逆转。</p>\n  <p>面对全球化竞争，韶音的核心市场规划可以总结为“GLOCAL”战略——即全球化思考，本地化行动。杨云将当前的耳机品类竞争比作新能源汽车行业：全球绝大多数的核心品牌与顶尖供应链都集中在中国市场。因此，韶音选择将中国激烈的市场环境作为研发的“练兵场”，充分依托国内强大的工程师红利和极致的供应链优势，开发出在硬件、性能上足以打动并销售全球的标准标准化产品。</p>\n  <p>但在软件、服务及生态融合层面，韶音则在全球范围内开展极其精准的本地化深耕。例如，最新发布的专业运动耳机OpenSwim Pro 2，便成为了全球首款支持QQ音乐无线导入与离线播放的耳机，这一功能精准击中了本土运动爱好者的核心痛点，成为了全球标准化硬件与本土顶级流媒体生态成功联姻的范例。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_a0d2932b96fa4c148a4b7983b1eab4ad@517825446_oswg94922oswg1804oswg1279_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <h3>3. 拒绝短视的长期主义护城河</h3>\n  <p>在涌入者众多的多元化竞争环境下，韶音认为品牌真正的护城河来源于“技术创新”与“用户思维”的底层基因，以及对长期主义的笃定。做品牌是一条最难走、面临挑战与压力最大的路。在过去长达15年的时间里，韶音只做了一件事，那就是专注于开放式音频的深耕。</p>\n  <p>这种克制与长线思维同样体现在其品牌营销与用户沟通上。从跨界合作自由潜水世界冠军金明，到携手全球品牌大使张婧仪推出艺术礼盒，韶音的策略重点并非盲目追求流量快钱，而是通过这些契合品牌坚韧、优雅特质的合作伙伴，将“开放聆听、不急于求成”的理念具像化，从而在消费者心中建立起高端化、专业化且极具信任感的品牌壁垒。</p>\n  <h2>二、 产品迭代与技术革新：材料与声学的极限攻坚</h2>\n  <p>要在红海中完成对传统TWS的品类替代，单纯依靠概念营销是远远不够的，必须在产品和技术实操层面，以硬核的底层研发打破开放式耳机长期存在的物理瓶颈与行业痛点。在最新的产品矩阵中，韶音通过声学、材料学与垂直场景的深度融合，带来了行业瞩目的迭代升级。</p>\n  <h3>1. 5年磨一剑：以“韶音天篱滤噪技术”定义开放式新阶段</h3>\n  <p>在开放式耳机的普及过程中，抗噪能力弱、在嘈杂环境下听音模糊一直是阻碍其进入更广泛泛场景的致命短板()。针对这一行业痛点，韶音在行业内首次提出了“开放式滤噪”的颠覆性概念。</p>\n  <p>开放与滤噪，在物理和声学原理上天生是一对巨大的矛盾。在项目启动初期，这项技术在韶音内部甚至引发了巨大的争议，许多研发人员一度认为这是无法跨越的物理鸿沟。然而，基于对技术的长期投入和“因为相信，所以看见”的技术信仰，韶音早在2020年底至2021年便前瞻性地立项了滤噪预研技术——当时行业内甚至还没有出现如今大火的耳挂式开放式耳机，研发完全是基于骨传导的未来构想展开的。</p>\n  <p>历经5年多的高强度技术迭代与攻坚优化，韶音终于推出了“韶音韶音天篱滤噪技术”。该技术成功将滤噪的频段拓宽至接近4000Hz，并将滤噪深度降到了18dB，使其真正成为行业首个能够在健身房、咖啡厅、办公室等多场景完美适配的开放式滤噪方案。这标志着开放式耳机进入了一个全新阶段：既能保留开放聆听带来的环境感知与安全出行，又能兼顾沉浸专注的清晰听音体验。张浩锋更是透露，如果这项技术在未来能够继续向高铁、飞机等高难度嘈杂场景演进，那将直接触发音频行业的下一场彻底革命。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_3de0aa20485c4d9ab28c86f387c55d1a@517825446_oswg28632oswg919oswg585_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <h3>2. OpenSwim Pro 2：解锁游泳蓝海的“全能数据终端”</h3>\n  <p>多数音频厂商将运动耳机的目光死死锁在跑步赛道，而韶音则将下一个具备决定性增量的突破口精准锁定在了游泳市场()()。根据韶音内部的全球调研数据统计，经常游泳的人群已经占到了跑步人群的60%左右，这是一个庞大却长期被行业低估的蓝海。由于游泳场景极为单调且无法在运动中聊天拍照，用户在水中对音乐激励的需求比跑步往往更加强烈和刚性。然而，水下由于蓝牙信号无法有效传输、防水等级要求严苛，市面上长期缺乏优秀的解决方案，这一领域对于高品质音频而言几乎是零竞争对手的真空地带。</p>\n  <p>为此，OpenSwim Pro 2不仅将防水能力直接拉高到了极致的潜水级，更在硬件内部塞入了一颗强悍的6nm定制芯片与九轴传感器。基于对真实用户需求的深刻洞察，游泳者如果佩戴智能手表，在水中频繁抬腕观察数据会严重打断运动的节奏和划水连贯性。OpenSwim Pro 2通过这套顶级的传感器与芯片组合，能够精准识别泳姿、划次、游泳距离等核心运动指标，并通过语音实时播报的方式反馈给用户，完美做到了声学、运动科技与极端场景体验的闭环融合。</p>\n  <h3>3. OpenDots 2：夹式耳机的“微米级”舒适平衡</h3>\n  <p>近年来，耳夹式（Clip-on）形态因其潮流属性和独特的佩戴方式，正在疯狂吸纳传统的TWS用户。但耳夹式产品始终面临着一个行业内难以调和的悖论：夹得太紧耳廓容易产生压痛，夹得太松则在剧烈运动中容易松动脱落。</p>\n  <p>为了达成“久戴不痛、狂甩不掉”的黄金平衡，最新亮相的OpenDots 2在完美延续了前代OpenDots ONE所奠定的“动钛弧结构”以及“9G预紧力”两大技术核心优势的基础上，在材料学与重心分布上进行了极其细腻的微米级微调。</p>\n  <p>在结构优化上，OpenDots 2将内部核心的钛片宽度做到了极致压缩，最大减少了0.6毫米，这微小的尺寸缩减极大地减轻了对耳廓边缘的局部压迫感。同时，研发团队重新优化了耳机整体的重心分布，并全面提升了钛片的回弹性与抗疲劳度，从而保证了耳机在高强度、高频次拉伸使用的长期蹂躏下，依然能维持极其稳定、均衡且高性能的夹持体验。这种通过材料创新来化解佩戴稳固与舒适矛盾的研发路线，进一步筑牢了韶音在舒适科技领域的领先地位。</p>\n  <p>&nbsp;</p>\n  <h2>三、 未来战略演进：在AI与智能硬件洪流中的冷思考</h2>\n  <p>在当前言必称AI、智能眼镜与可穿戴健康监测设备大乱斗的硬件大潮中，韶音在专访中展现出了极强的战略定力与极其清醒的“冷思考”。面对未来的技术演进，他们并没有盲目跟风，而是有着自己一套逻辑严密的方法论。</p>\n  <h3>1. 激进的稳健派：AI重构智能耳机的三步走节奏</h3>\n  <p>对于风头正劲的AI技术，韶音在内部将自己定性为“激进的稳健派”。他们深信AI在未来势必会全方位重构整个智能硬件生态，但这一进程绝非一蹴而就，而是有着极其鲜明的节奏感。在韶音的蓝图中，AI在开放式耳机上的落地被清晰地划分为三个层层递进的演进维度：</p>\n  <p><strong>第一维度是性能增强（已全面落地）：</strong> 这是目前已经成熟并广泛应用的阶段。韶音通过AI算法深度优化了耳机的抗噪性能、麦克风通话降噪效果以及底层的声学音质表现。</p>\n  <p><strong>第二维度是交互体验的革命（正在切换）：</strong> 随着AI大模型的普及，人类与硬件的交互媒介正在从过去的键盘、屏幕逐步切换到极其自然的语音对话。由于开放式耳机具备全天候挂耳、不隔绝环境、高频佩戴的天然属性，它被韶音视为最自然、最适配的AI自然语音交互入口，未来在这个维度将爆发巨大的交互革命机会。</p>\n  <p><strong>第三维度是能力增强（韶音最核心聚焦的战略方向）：</strong> 这一维度不再局限于空泛的泛场景，而是将AI聚焦在特定的垂直场景中大显身手。例如，通过耳机上的传感器采集用户的实时运动行为数据，并借助AI在本地或云端进行深度处理，从而为用户提供私教级的智能运动辅导；或者在办公场景下，通过AI处理声音数据来大幅度提高用户的办公和生产力效率。这种切中垂直场景的能力增量，正是韶音当前最为看好并重兵投入的王牌方向。</p>\n  <h3>2. 智能眼镜 vs 开放式耳机：乐观的谨慎派视角</h3>\n  <p>针对当前行业内热议的“拥有4亿眼镜人口的中国市场，智能眼镜是否会吞噬耳挂/开放式耳机生存空间”的尖锐话题，韶音高层给出了基于商业底层的冷静理性的研判。</p>\n  <p>张浩锋坦言，韶音对于眼镜市场是一个“乐观且谨慎派”。眼镜作为面部穿戴设备，其复杂程度与面临的物理限制远超耳机。用户可以毫无心理负担地将一双轻巧的耳机挂在耳朵上一整天；但是，如果试图将一整块显示屏幕、复杂的计算单元、大容量电池强行架在用户的脸上，硬件在产品重量、续航能力、散热性能以及制造成本之间的“不可能三角”物理矛盾，在短期内根本无法得到完美解开。因此，开放式耳机与AI相结合的普及速度和商业落地节奏，注定会比智能眼镜来得更快、更扎实。眼��未来或许有巨大的长线潜力，但它的技术挑战与迭代周期注定会非常漫长。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_62bf099b04fe401fab3a68d06b5e852b@517825446_oswg42146oswg1280oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <h3>3. 健康监测的“减法哲学”与价值回归</h3>\n  <p>在智能穿戴设备拼命做“加法”、试图把心率、脑电等各种生物传感器塞入耳机的行业风潮下，韶音却展现出了一种极其难得的克制与“减法哲学”。</p>\n  <p>杨云指出，运动健康监测（如HRV、持续心率等）的核心商业价值与用户价值，高度依赖于“7×24小时无缝、长期且连续的数据基准支撑”。这正是智能手环、智能手表这类用户连洗澡、睡觉都几乎不摘单的设备的天然主场。相反，耳机作为一种高频摘戴、使用场景相对碎片化的设备，天生无法提供无断点的连续时间基准数据。如果在预研阶段为了拼凑功能和噱头强行塞入这些复杂的生物传感器，势必会严重牺牲耳机的佩戴重量、体积与续航体验。在经过严密的评估后，韶音认为这无法给用户带来更好的综合核心体验，因此他们选择克制，在不必要的功能上做取舍与减法，让耳机回归到极致的佩戴舒适科技与声学本源上。</p>\n  <p>&nbsp;</p>\n  <h2>四、 结语</h2>\n  <p>在韶音的终局思维里，开放式耳机从来不是属于一小撮硬核运动人群的专属孤岛，而是一场终将彻底颠覆并重塑传统真无线音频行业格局的品类海啸。从深耕骨传导、定义专业运动，到如今全面布局耳挂、耳夹全形态，走向全场景开放音频；从硬核预研“韶音天篱滤噪”打破物理矛盾，到重塑水下运动的高清聆听体验，韶音正用长达15年的笃定、对真实需求的洞察以及硬核的技术信仰，不断敲碎那些外界自以为是的行业天花板。</p>\n  <p>正如CEO杨云在媒体专访结束时所言，所谓的“终局思维”绝不意味着把天花板定在这里，韶音的技术上升空间与想象力依然巨大。这场将舒适与聆听自主权彻底还给消费者的开放式革命，才刚刚行至中流，而韶音显然已经握紧了通往下一个时代的船票。</p>", "category": "tech", "published_at": "2026-05-17T11:57:23+00:00", "fetched_at": "2026-05-18T02:53:24.128143+00:00", "fingerprint": "2bcc07705b91da0b"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨多款燃油车大降价，降幅最高近30%；蜜雪冰城上线黄仁勋同款饮品；“巴菲特慈善午餐”回归，获拍900万美元", "url": "https://36kr.com/p/3814030630084354?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>张雪机车，再夺冠</li>\n   <li>长安汽车否认与千里科技合作</li>\n   <li>深圳发布2026年住房发展计划</li>\n   <li>贵州茅台宣布公斤茅台等四款产品提价</li>\n   <li>法拉第未来宣布获得2500万美元融资</li>\n   <li>三星电子会长就公司“内部问题”公开道歉</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>多款燃油车大降价，降幅最高近30%</strong></p>\n  <p>日前，长安汽车旗下长安逸动经典版正式上市，新车售价6.49万元，限时享23000元购车现金优惠；相较于指导价8.79万元降幅达到26%。该款车型还享有限时的保养礼和流量礼。</p>\n  <p>其实，近期多家燃油车都开启了降价模式：起亚新狮铂拓界一口价10.99万元，较指导价15.49万元降29%；捷豹路虎5月12日推出限时“新发现”价；奇瑞4月中旬开展促销，综合补贴最高4万元；速腾2026款最低价11.99万元，降价3万元（降幅20%）；思域最低指导价9.79万元，降价3.2万元（降幅24.6%）；荣威i6最低价7.49万元，降价1.49万元（降幅16.6%）；一汽-大众奥迪A6于3月降价9.1万元（降幅29%）。</p>\n  <p>乘联分会秘书长崔东树最新披露的数据显示，2026年4月份，常规燃油车新车降价车型均价13.1万元的降价力度算术平均达到2.3万元，降价力度达到17.2%。今年1至4月份，常规燃油车新车降价车型均价23.6万元的降价力度算术平均达到3.4万元，降价力度达到14.6%。（光明日报）</p>\n  <p><strong>蜜雪冰城上线黄仁勋同款饮品</strong></p>\n  <p>5月15日，英伟达CEO黄仁勋在北京南锣鼓巷的蜜雪冰城门店点了杯“蜜桃四季春”，引发关注。5月16日上午，有媒体记者注意到，蜜雪冰城官方点餐小程序已火速上线“大佬同款”专属分类，直接把这款单品置顶。</p>\n  <p>郑州中原区多家门店的店员告诉记者，这款饮品价格没变，还是7元起，而且“大佬同款”销量相当不错。蜜雪冰城相关工作人员回应，小程序上线“大佬同款”后，蜜桃四季春当日销量环比前日增长接近140%，同比上周五增长超过90%。黄仁勋到访的南锣鼓巷店，蜜桃四季春销量环比增长超过90%。</p>\n  <p>另有消息称蜜雪冰城CEO张渊在朋友圈晒出黄仁勋喝“蜜桃四季春”的照片，并配文：“最顶级的显卡，往往需要最纯粹的散热方式。”同时，蜜雪冰城官方微博也发文称：“高温模式已开启！液冷降温和蜜桃四季春更配哦。”（界面新闻、新浪财经）</p>\n  <p><strong>“巴菲特慈善午餐”回归，获拍900万美元</strong></p>\n  <p>据eBay网站显示，在一场慈善筹款拍卖活动中，一位竞拍者同意出资900万零100美元，以换取与亿万富翁投资者沃伦·巴菲特以及篮球巨星斯蒂芬·库里共进晚餐的机会。目前尚无法立即确定中标者的身份。6月24日，巴菲特、库里及其妻子将与中标者及其选定的最多七位随行嘉宾，一同前往位于内布拉斯加州奥马哈市的伯克希尔·哈撒韦公司总部所在地共进晚餐。（同花顺财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小米卢伟冰：下半年部分国产旗舰直板手机价格或将破万</strong></p>\n  <p>5月16日，小米集团总裁卢伟冰在直播中表示，今年下半年，尤其是年底，可能有一些国产旗舰直板手机的价钱会突破1万元人民币。针对小米17 Max价格会不会受到内存价格影响，卢伟冰称，今天任何一款手机定价都会受到内存成本大幅上涨的影响，而小米17 Max的价格还在讨论当中。他预判，内存涨价趋势至少会延续到2027年底，甚至到2028年。（界面新闻）</p>\n  <p><strong>张雪机车，再夺冠</strong></p>\n  <p>当地时间5月16日，在刚刚结束的2026世界超级摩托车锦标赛（WSBK）捷克站WorldSSP组别第一回合正赛中，中国摩托车制造商“张雪机车”旗下的53号法国车手瓦伦丁·德比斯夺得冠军。（央视新闻）</p>\n  <p><strong>巨力索具今年25次登龙虎榜，在A股上市公司中高居第9</strong>5月15日晚，今年以来股价翻倍的商业航天概念股巨力索具公告称，公司于当日收到中国证监会下发的立案告知书，因涉嫌信披误导性陈述违法违规，根据相关法规，5月13日，中国证监会决定对公司立案。值得注意的是，今年以来，巨力索具25次登上龙虎榜，在A股上市公司中高居第9，累计买入143.86亿元、卖出134.52亿元，累计净买入9.35亿元。龙虎榜上，机构与游资频繁出没，散户跟风炒作。巨力索具披露的2026年一季报显示，一只私募基金、一家银行机构，以及两位高度关联的“超级牛散”，重仓押注，跻身前十大流通股东。而控股股东巨力集团则通过股权协议转让，持仓大幅减少4800万股。（中国证券报）</p>\n  <p><strong>长安汽车否认与千里科技合作</strong></p>\n  <p>近日有消息称，长安汽车将采用千里科技的智能辅助驾驶方案，并投资入股。长安汽车5月17日称，“暂无计划”。另有接近长安汽车的人士向记者透露：长安汽车自研的天枢智能已经到了收获期，不可能切换智能驾驶方案。据悉，去年12月，工信部公布了我国首批L3级有条件自动驾驶车型准入许可。长安汽车位列其中，搭载的是其自研的“天枢智能”辅助驾驶系统。（第一财经）</p>\n  <p><strong>蔚来：已在全国建成8870座充换电站</strong></p>\n  <p>36氪获悉，蔚来发布消息称，5月17日，NIO Power 2站上线。截至5月17日，蔚来全国建成8870座充换电站，其中换电站3849座，充电站5021座、充电桩28855根，累计提供超1亿次换电。</p>\n  <p><strong>深圳发布2026年住房发展计划，将筹建3万套、供应4万套保障房</strong></p>\n  <p>36氪获悉，深圳市住房和建设局近日发布《深圳市2026年住房发展年度计划》。优化保障性住房供给，建设筹集保障性住房3万套（间）、供应4万套（间），满足工薪群体和各类住房困难家庭基本住房需求；推进“好房子”试点项目建设，推进城中村改造和城镇老旧小区整治改造，推动创建未来社区（完整社区）试点，切实增强市民获得感、幸福感、安全感。</p>\n  <p><strong>最高涨价200元，贵州茅台宣布公斤茅台等四款产品提价</strong></p>\n  <p>5月16日凌晨，i茅台公告，自当天零时起，贵州茅台酒股份有限公司对部分贵州茅台酒产品自营体系零售价格进行调整。此次调整共涉及四款非标产品，最高涨幅为8%。调整的产品包括：53%vol 500ml陈年贵州茅台酒（15）由4199元/瓶调整为4279元/瓶；53%vol 500ml贵州茅台酒（精品）由2299元/瓶调整为2359元/瓶；53%vol 500ml贵州茅台酒（丙午马年）珍享版由2499元/瓶调整为2699元/瓶；飞天53%vol 1L贵州茅台酒由2989元/瓶调整为3119元/瓶。（澎湃新闻）</p>\n  <p><strong>国内航线燃油附加费5月16日起上调</strong></p>\n  <p>5月16日起，中国内地航线客票，燃油附加费上调。具体标准为：800公里以下航段每位旅客收取90元；800公里以上航段每位旅客收取170元。婴儿旅客免收燃油附加费，儿童、革命伤残军人、因公致残人民警察客票燃油附加费减半收取。（央视新闻客户端）</p>\n  <p><strong>2026年5月票房破15亿</strong></p>\n  <p>36氪获悉，据灯塔专业版，截至5月17日，2026年5月票房（含预售）突破15亿，《给阿嬷的情书》领跑5月电影票房榜。</p>\n  <p><strong>上海电信率先发布Token资费套餐：1元对应25万额度点，支持手机账单付</strong></p>\n  <p>面对AI时代日益增长的Token需求，上海电信宣布，即日起面向上海电信用户正式推出Token算力服务，成为上海首个发布Token资费套餐运营商。具体来说，一是按量订购，1元对应25万额度点（以KiMi-K2.5模型为例，约可支持调用25万输入Tokens）；二是按需选择，用多少买多少，多买可享折扣，支持话费账单支付。另据记者从上海电信获悉，用户购买额度点后，通过标准API接口即可调用30余款主流大模型（文本、多模态），将AI能力集成到自己的软件、脚本或自动化流程中。以10元购买250万额度为例，约可让程序自动总结100本10万字的电子书。(上观新闻)</p>\n  <p><strong>超310家企业落户香港或在港扩充业务</strong></p>\n  <p>香港特区政府投资推广署署长刘凯旋表示，截至5月初，已有310多家企业落户香港或在港扩充业务，首年直接投资额超260亿港元，其中中资企业占比超过五成。她认为这一成果得益于特区政府成立的“内地企业出海专班”的推动。(大湾区之声)</p>\n  <p><strong>法拉第未来宣布获得2500万美元融资</strong></p>\n  <p>36氪获悉，5月16日，法拉第未来宣布���公司已与机构投资者签署了2500万美元股份购买协议。根据协议，投资者已认购公司总本金为2500万美元的可转换本票。本次融资对应的普通股目前尚未注册，存在交易限制，暂不可立即流通。其中，1250万美元将直接汇入公司运营账户；其余1250万美元将依据公司与各投资者签署的受控账户协议，存入由投资者控制的监管账户，并将在满足特定条件后释放给公司使用。</p>\n  <p><strong>星巴克宣布在美关闭多个地区办公室</strong></p>\n  <p>当地时间5月15日，星巴克宣布将在美国裁员300人，以削减成本、力求重回增长轨道。星巴克还表示，关闭多个地区办公室，相关举措将产生包括遣散费以及资产减值等在内的4亿美元重组费用。（央视财经）</p>\n  <p><strong>伊朗宣布5月19日起恢复股票市场交易</strong></p>\n  <p>当地时间5月16日，伊朗证券交易组织表示，伊朗股票市场将于5月19日起恢复交易。伊朗证券交易组织负责交易所相关负责人表示，根据已完成的协调工作并在获得必要许可后，决定自19日起重新开放股票市场、各类股票投资基金及其衍生品交易。（央视新闻）</p>\n  <p><strong>盖茨基金会不再持有微软股票</strong></p>\n  <p>当地时间5月16日，根据提交给美国证券交易委员会的文件，微软创始人比尔·盖茨的慈善基金会已不再持有微软股票。盖茨基金会信托披露，已于今年第一季度出售剩余770万股微软股票，按当前股价计算价值32亿美元。（界面新闻）</p>\n  <p><strong>马斯克称他不会出售任何SpaceX股票</strong></p>\n  <p>马斯克称他不会出售任何SpaceX股票。（华尔街见闻）</p>\n  <p><strong>SpaceX据悉最早将于6月11日确定首次公开发行价格</strong></p>\n  <p>5月16日消息，据报道，SpaceX最早将于6月11日确定首次公开发行价格，股票将于6月12日上市。SpaceX将选择纳斯达克作为其首次公开发行的上市地点，股票将以“SPCX”为代码进行交易。（界面新闻）</p>\n  <p><strong>SpaceX拟推万亿火星薪酬方案，马斯克回应：旨在确保公司专注于多行星生活愿景</strong></p>\n  <p>5月16日，有消息称，正在推进上市的SpaceX在保密招股书中披露了一项激进的治理与薪酬方案。公司计划通过发行10倍投票权的B类股，确保马斯克拥有不可被解雇的绝对控制权。同时，董事会批准了一项总额可达万亿美元的超级薪酬方案，其考核标准直接与在火星上建立百万人口殖民地的目标挂钩。目前，SpaceX计划于今年6月登陆纳斯达克。针对这一治理方案，马斯克随即做出了公开回应。他表示：“我需要确保SpaceX始终专注于让生命成为多行星化、并将人类意识延伸至星辰大海的愿景，而不是去迎合某些人极其无聊的季度财报奖金！”马斯克说，这一目标实现起来异常艰难，过程绝非一帆风顺，但他坚信，“如果SpaceX成功实现了这个荒谬而艰巨的目标，它的价值将比地球目前的经济总量还要高出好几个数量级。”（界面新闻）</p>\n  <p><strong>三星电子会长就公司“内部问题”公开道歉</strong></p>\n  <p>5月16日，三星电子会长李在镕就公司“内部问题”公开道歉。目前，三星电子与公司工会之间劳资纠纷持续，工会计划于5月21日启动的18天罢工计划已有超过4万名员工登记。李在镕呼吁工会与公司团结一致，朝同一个方向前进。三星电子劳资双方自去年12月起开展谈判，但由于分歧一直未能缩小，谈判于今年3月破裂。此后，在调解下，劳资双方本月11日至13日进行了马拉松式谈判，但最终未能达成协议。据韩联社报道，若进行罢工可能会造成40万亿韩元、约合1824亿元人民币的损失，并殃及半导体产业，政府可能考虑行使紧急调整权。（CCTV国际时讯）</p>\n  <p><strong>OpenAI与马耳他达成协议，所有马耳他民众都能使用ChatGPT Plus</strong></p>\n  <p>美国人工智能（AI）公司OpenAI5月16日表示，已与马耳他政府签署协议，所有居民在完成使用AI培训课程后，均可免费使用其ChatGPT Plus服务一年。该项目将于5月启动，随着更多马耳他居民完成这门免费课程，服务规模预计将逐步扩大。该计划也将向旅居海外的马耳他公民开放。（新浪财经）</p>\n  <p><strong>贝莱德考虑对SpaceX首次公开募股投资数十亿美元</strong></p>\n  <p>据知情人士透露，贝莱德已讨论在下个月对SpaceX的首次公开募股（IPO）投资50亿至100亿美元。这笔巨额投资对应的IPO募资规模最高可达750亿美元，将代表这家全球最大资产管理公司对马斯克旗下企业投下重要信任票。（新浪财经）</p>\n  <p><strong>阿根廷牛肉消费量降至20年来最低水平</strong></p>\n  <p>阿根廷是牛肉生产和消费大国。然而，最新数据显示，阿根廷人均年牛肉消费量减少5公斤，降至20年来最低水平。分析人士认为，这缘于牛肉价格上涨、居民购买力下降以及出口增长。（新华社）</p>\n  <p><strong>欧洲国债收益率高企，通胀攀升或推动央行加息</strong></p>\n  <p>近期，欧洲国债市场波动明显加剧。随着国际油价持续高位运行，市场对欧洲通胀回升及利率提高预期正在升温，德国、英国等主要经济体长期国债收益率连续走高。部分市场机构目前预计，欧洲央行可能在更长时间内维持高利率，甚至不排除进一步加息的可能。（新华财经）</p>\n  <p><strong>韩国头部企业一季度营业利润突破千亿美元，超六成来自三星海力士</strong></p>\n  <p>行业数据5月17日显示，今年一季度韩国头部企业营业利润突破156万亿韩元（折合1040亿美元），其中超六成利润由韩国两大芯片巨头创造。企业数据机构CEO Score统计数据显示，韩国营收排名前500的企业中，328家企业今年一季度合计营业利润达156.35万亿韩元，同比大增158.6%。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>数据中心运营商DayOne正考虑在新加坡和美国双重上市</strong></p>\n  <p>据报道，一位知情人士称，全球数据中心运营商DayOne正考虑在新加坡和美国进行双重首次公开发行（IPO），不过目前新加坡IPO尚无具体计划。媒体早些时候报道称，DayOne最初考虑仅在纽约上市，但已被新加坡证券市场官员说服进行双重上市。由于该信息尚未公开，消息人士要求匿名。媒体今年2月曾报道，DayOne计划通过在美国上市筹集50亿美元，公司估值可能达到200亿美元。（新浪财经）</p>\n  <p><strong>宏和科技：向香港联交所递交境外上市股份（H股）发行并上市申请</strong></p>\n  <p>36氪获悉，宏和科技公告，公司已于5月15日向香港联交所递交了发行境外上市股份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行并上市的申请资料。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>网易新闻、网易小蜜蜂宣布已接入DeepSeek-V4</strong></p>\n  <p>36氪获悉，近日，网易传媒旗下网易新闻、网易小蜜蜂正式宣布接入DeepSeek-V4大模型。全面升级新闻资讯分发、智能内容创作、社区互动服务、AI工具辅助及个性化推荐等核心场景。据了解，网易小蜜蜂近期即将推出“校园龙虾养成计划”，创新地将前沿人工智能技术融入年轻用户日常社交场景。</p>\n  <p><strong>阿里健康正式发布医学AI助手“氢离子”</strong></p>\n  <p>36氪获悉，近日，阿里健康正式发布医学AI助手“氢离子”，同时宣布与英国BMJ集团达成独家合作。据了解，BMJ旗下70本医学期刊过去十年的内容资源接入氢离子，这是国际顶级期刊首次与中国AI平台达成此���合作。氢离子聚焦循证医学，采用四层架构：PICO+GRADE结构化理解、检索增强、模型微调、专家评审闭环。超300位中国临床专家参与共建评价标准，黄晓军、肖瑞平、于金明等10位顶级专家把关学术方向。</p>\n  <h2>大公司财报</h2>\n  <p><strong>长鑫科技：预计上半年营收1100-1200亿元</strong></p>\n  <p>36氪获悉，长鑫科技集团股份有限公司科创板IPO招股说明书（申报稿）显示，公司预计2026年1-6月主要财务数据如下：营业收入1100亿至1200亿元，同比增长612.53%至 677.31%；净利润660亿至750亿元，归属于母公司所有者的净利润500亿至570亿元，扣除非经常性损益后归属于母公司所有者的净利润520亿至580亿元。</p>\n  <h2>酷产品</h2>\n  <p><strong>华为鸿蒙智行首款旗舰级MPV智界V9上市</strong></p>\n  <p>36氪获悉，5月15日，华为鸿蒙智行首款旗舰级MPV智界V9正式上市，售价38.98万—51.98万元。据了解，作为鸿蒙智行首款旗舰MPV，智界V9拥有鸿蒙ALPS健康座舱3.0、MPV专属旗舰华为途灵平台、MPV首发车载制氧系统等配置。在辅助驾驶方面，新车全系标配38个传感器，是行业首款搭载全球量产最高规格896线激光雷达的MPV，并将首批升级华为乾崑智驾®ADS 5。</p>\n  <p><strong>乐道L80上市，售价24.28万起</strong></p>\n  <p>36氪获悉，5月15日晚，蔚来旗下品牌乐道汽车L80 正式上市，整车购买24.28万元起，BaaS电池租用方式购买15.68万元起。乐道L80提供Pro、Max+和Ultra+三个版型，Orin-X纯视觉版和神玑芯片+激光雷达版两种智驾方案选择。5月16日，乐道L80将开启全国交付。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-05-17T23:55:00+00:00", "fetched_at": "2026-05-18T02:53:24.128134+00:00", "fingerprint": "25ad6b830f8aa3a9"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 获超千万融资，「律动节拍」用演出票撬起千亿跨城观演赛道", "url": "https://36kr.com/p/3813463119863553?f=rss", "summary": "<p>36 氪获悉，「律动节拍」已于近期完成超千万级新一轮融资，由天空工场创投基金领投，投后估值达数亿元。</p>\n  <p>「律动节拍」成立于2025 年，是一家为用户提供跨城观演全消费场景的科技型文旅服务企业。公司聚焦 “因演出行” 垂直领域，以 “让一张票成为一座城市的游乐场” 为理念，搭建了面向 C 端用户的 AI演出行程管家。</p>\n  <p>依托集团其背后的生态资源与市场化合作，律动节拍已完成演出票品、酒旅、交通、餐饮、衍生品等多维度供给接入，通过AI与大数据模型训练，将演出资源与文旅资源整合，开发成为一站式定制化的演出行程管家产品&nbsp;。</p>\n  <p>本轮资金将主要用于AI 演出行程管家产品研发、行业大模型训练、全域供应链深化及市场推广。</p>\n  <h2><strong>跨城观演越火，用户痛点越显现</strong></h2>\n  <p>近年来，国内现场演出市场持续升温，跨城观演成为常态。</p>\n  <p>中国演出行业协会数据显示，2025 年国内大型营业性演出票房突破 324 亿元，跨城观众占比普遍超过 60%，热门场次外地观众占比甚至达到 90%。单场大型演出对交通、住宿、餐饮、本地消费的带动比例可达 1:6.85，全年带动的观演关联消费规模超过 2200 亿元。</p>\n  <p>市场高速增长的另一面，是行业供给能力的明显滞后。律动节拍团队在长期市场观察中发现，当下用户的观演出行，正被一系列低效、碎片化、充满不确定性的流程困扰：用户想要顺利看完一场演出，通常需要在票务平台抢票、在二级渠道辨票、在 OTA 平台比价订酒店、在社交平台做攻略、散场后排队打车，整个筹备过程平均耗时 3—4 小时，即便如此，仍可能面临票源不可信、酒店与场馆距离不合理、行程衔接混乱、旺季履约无保障等问题。</p>\n  <p>“现在早已不是信息不够，而是信息太多、太乱、太分散。” 律动节拍负责人骆昭直言，用户需要的不是更多平台、更多商品、更多选择，而是更低的决策成本、更高的执行效率、更确定的服务结果。</p>\n  <p>尤其是 95 后、00 后成为观演主力，他们对 省心的重视程度越来越高，愿意为效率、体验与确定性付费，这也成为律动节拍成立并切入市场的核心逻辑。</p>\n  <p>传统票务平台只卖票，不负责出行与体验；综合旅行平台有酒旅交通资源，却缺乏优质演出票源与场景理解；各类攻略平台信息零散，真假难辨。</p>\n  <p>平台之间相互割裂，用户被迫在多个 APP 之间反复切换、比价、核验、下单，一场以情绪消费为目的的观演行为，最终变成耗费精力的体力活。</p>\n  <p>针对这一行业结构性痛点，律动节拍选择以 AI 为工具，把分散在各个平台的服务能力整合起来，把用户需要手动完成的筛选、规划、比价、预约、下单等动作，全部交给系统自动完成。</p>\n  <h2><strong>打通跨城观演全场景</strong></h2>\n  <p>作为公司核心 C 端产品，AI 演出行程管家并非简单的行程规划工具，而是一套专为用户提供演出与赛事出行定制的智能Agent。</p>\n  <p>与市面上通用行程工具不同，AI 演途管家不做货架式陈列，也不由运营人工组合固定套餐。用户只需要向系统说明：想看哪场演出、从哪出发、计划停留几天、大致预算、同行人数，系统便会自动完成全网数据清洗、票源核验、酒店匹��、交通规划、本地玩乐推荐、接驳安排等一系列动作，在秒级内生成一套贴合个人偏好的完整行程。</p>\n  <p>这套系统要解决的，正是用户观演出行中最真实的几大痛点。</p>\n  <p>据悉，律动节拍以全域聚合型演出票务平台为核心载体，独家打通多家平台流量入口，实现演出资源与海量消费人群的对接；通过精细化运营持续沉淀高净值核心观演用户，构建起高粘性、高复购、高增长潜力的私域流量底盘。</p>\n  <p>骆昭透露，律动节拍AI 演出行程家会基于场馆位置、交通时效、观演节奏做深度匹配。如同样是在鸟巢看完演出，用户想去看升旗，或是想去三里屯休闲，住宿选择、交通动线、时间安排完全不同，系统会自动选择效率最高、体验最优的方案。</p>\n  <p>行程生成后给出律动节拍统一总价，用户一键支付即可完成全部预订，AI 自动对接各平台完成下单、预约、核销，用户不再需要在多个 APP 重复操作、逐一核对。</p>\n  <p>针对演出散场打车难这一高频痛点，系统支持提前锁定接送服务；同时提供全程行程节点提醒，覆盖出发、入场、住宿、返程全流程，把不确定性降到最低。</p>\n  <p>在技术层面，公司自研演出行业垂直大模型与动态定价算法。供应商只需提供底价，系统根据市场需求、库存、用户敏感度实时智能调价。</p>\n  <p>在用户定位上，律动节拍AI演出行程管家目标用户包括：喜欢体验便捷、有个性化定制需求的用户；将观演作为旅行核心的跨城游客；商旅人群等。这类用户对服务质量、效率、个性化需求更高，也更符合 AI演出行程管家的目标用户。</p>\n  <p>为了支撑这套 Agent 稳定运行，律动节拍AI演出行程管家依托集团背后的生态与市场化合作，目前业务已覆盖全国数百个城市，已打通与主流航司的合作资源，聚合3万多个酒店房源，涵盖中高端与连锁经济型酒店资源，聚合大巴、商务车、轿车运力资源，实现任由用户自有搭配的选择空间。</p>\n  <p>同时，律动节拍还与衍生品头部供应商展开合作，具备设计、生产、定制能力；实物电商接入百万级 SKU，可灵活实现 “票 + 商品” 组合套餐，实现一张票到一座城的全域消费。</p>", "category": "tech", "published_at": "2026-05-18T01:29:37+00:00", "fetched_at": "2026-05-18T02:53:24.128118+00:00", "fingerprint": "1dd8e57b48155700"}, {"source": "少数派", "title": "看剧不卡顿、游戏低延迟：「智能队列」这样改善你的冲浪体验", "url": "https://sspai.com/post/64870", "summary": "在无线路由器的设置页面上，我们可能会看到一个名为「智能队列」的功能（根据品牌或操作系统的不同，也可能会被称做「智能QoS」、「SQM」等）。这一功能是如何工作的？是否能让网速变快？是否需要打开？本文将 ...<a hr 现场分享了品牌对开放聆听的最新思考：“真实的世界从不静止。声音在流动，环境在变化，人的状态也在不断切换。过去，耳机给用户的选择并不多——要么沉浸而隔绝，要么感知而妥协。我们相信，理想的声音体验应当把选择权交还给用户。「随我动听」的核心，是声音跟随人的节奏。” &nbsp; 「随我」，意味着选择自由——用户可以沉浸于音乐世界，也能联结身边世界，随心而行、无需妥协；「动听」，是韶音深耕多年的专业运动基因延续，更是品牌对声音与生活关系的全新解读：无论是运动赛场、都市通勤，还是静坐办公、休闲独处，韶音致力于让用户在开放聆听中，与世界保持联结。 支撑这一主张的，是韶音十五年的技术积累和用户认可。2021至2025年，韶音开放式耳机发明专利申请公开数量全球第一；连续三年，韶音保持全球开放式耳机出货量首位。从骨传导声学、开放式滤噪到水下防水，每一项技术迭代都在回答同一个问题：如何让开放式聆听覆盖更多真实场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_d9fa3370f0604e6bbc561b9cae56a5e9@517825446_oswg1419174oswg6000oswg4001_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>&nbsp; &nbsp;从运动到生活，为不同场景提供开放聆听答案 本次Shokz Day重点解读的OpenSwim Pro 2，是韶音对水下聆听场景的一次跨越式升级。产品实现50米级深度防水，满足5ATM、IP68、IP69防护等级要求，适配游泳、冲浪及20米内自由潜等水类运动。OpenSwim Pro 2作为全球首款支持QQ音乐无线导入与离线播放的耳机，带来海量音乐资源，搭配64GB内存，可存储超16000首曲目。同时，OpenSwim Pro 2首次引入游泳数据智能监测与语音播报，内置6纳米芯片与九轴传感器，融合自研头部姿态算法，可实时播报配速、距离等信息，为水下运动提供稳定的听觉陪伴。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_3bea40e2ecc747999ef132bcc80faa14@517825446_oswg133386oswg1600oswg1067_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>&nbsp;OpenDots 2聚焦日常全场景佩戴，搭载BassSphere™ 2.0低频聚合技术与全新升级杜比音效，配合MirrorPitch™聚能镜技术，失真优化70%。OpenDots 2结构上延续动钛弧与不等距硅胶设计，支持AI通话降噪并新增骨导麦克风。配色推出白金缮、银雪松、黑芒星三款，其中白金缮灵感源自金缮工艺，经七涂七烤锻光处理，呈现珠光质感。</p>\n  <p>&nbsp;OpenDots Air则带来轻盈耳夹设计，采用韶音自研流星弧，柔软硅胶一体成型，内层采用0.28mm超薄钛片，兼顾贴合度与支撑性。配色以破晓紫、午夜黑为主打，多场景轻松适配。OpenDots Air搭载Bassphere™低频聚合技术与Shokz OpenBass™2.0+动态调音算法，新增“听书模式”并针对人声频段进行增强处理，让听感再进阶，实现人声清晰，三频均衡的听音体验。&nbsp;</p>\n  <p>&nbsp;品牌生态再进化，让开放聆听可触可感 &nbsp;</p>\n  <p>&nbsp;活动当天，韶音全球品牌大使张婧仪登台分享：“我一直在寻找一种平衡——既能专注于自己的世界，也不错过真实的外界声音。直到遇见韶音，我才真正理解什么是‘开放聆听’。它让我不必在沉浸音乐与连接世界之间做选择。”这种“不追逐外界节奏，在自己的步调中听清所想”的状态，与韶音“开放聆听，自在相联”的品牌哲学形成深度共鸣。 此前，韶音宣布自由潜世界纪录保持者金明出任品牌挚友。金明累计打破59项中国国家纪录、27项亚洲纪录、2项世界纪录，2025年以319米刷新动态单蹼平潜世界纪录，并以9分08秒闭气成绩带领中国自由潜水进入“9分钟时代”。赛场之外，他同时是企业家与投资者。韶音以“品牌挚友”身份携手金明，旨在通过这位跨界探索者，将开放式耳机的用户想象从“专业运动伙伴”拓展为“多元生活同行者”。&nbsp;</p>\n  <p>在艺术层面，韶音特邀曾服务于宝格丽等奢侈品牌的国际时尚设计大师Matteo Menotto，以金缮工艺为灵感打造「缮己新声」艺术限定礼盒，内含耳饰、丝巾与耳机包等作品，以“心有所缮，自有新声”为主题，将东方修缮美学引入科技产品设计。活动现场同步开设手作体验沙龙，开启共创之旅。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_d6024d4fa9384ec6806cc6da42db8daf@517825446_oswg651434oswg4000oswg2668_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>&nbsp;面向未来：全球化深耕，以创新拓宽聆听边界 未来，韶音将持续深化全球化布局。对韶音而言，全球化不只是把产品卖到更多市场，而是用全球视野、全球研发和全球服务体系，去回应不同文化、不同场景下用户的真实需求。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_072cad6708b449d591d895bd6030cd0a@517825446_oswg2256303oswg6000oswg4001_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方图片</p>\n  <p>与此同时，韶音也将积极探索AI对产品体验的改变——不是将AI作为营销标签，而是从运动、通勤、办公、休闲等真实场景出发，让耳机更理解用户的习惯与状态，提供更自然、更智能的开放聆听体验。</p>", "category": "tech", "published_at": "2026-05-15T13:50:58+00:00", "fetched_at": "2026-05-17T02:42:57.684964+00:00", "fingerprint": "6fc63a1ee539a93e"}, {"source": "36氪 - 最新文章", "title": "理想出牌：全新L9上市，45.98万元起｜最前线", "url": "https://36kr.com/p/3810562142445058?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_90d236a32d4a4f71bd00c6834b43d348@6310690_oswg1021806oswg2622oswg1206_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">理想汽车CEO 李想</p>\n  <p>能让李想豁出去跳舞挣眼球的发布会，仅在全新一代理想L9上市。</p>\n  <p>5月15日，理想发布会了全新一代理想L9，推出两个版本——理想L9 livis，售价 50.98万元；理想L9 Ultra版，售价45.98万元。且理想给出了现金2万元的首销权益，截止于6月30日。</p>\n  <p><a href=\"https://mp.weixin.qq.com/s/IKe8JulhMZOfbtf8IBuLiw\" rel=\"noopener noreferrer\" target=\"_blank\">36氪汽车曾报道指出</a>，理想今年第一目标就是加固增程和高端市场的基本盘。今年产品重心将回归增程市场，用换代产品拿回增程领先的位置。</p>\n  <p>全新一代理想L9就是第一枪。</p>\n  <p>上市前夕，我们体验了全新理想L9 livis，一个比较直观的感觉是，无论是外观和内饰的质感，车辆的性能相较于上一代产品都有了质的提升。</p>\n  <p>外观方面，理想L9 livis首次采用了双色车身，在保留经典辨识度的基础上，前悬调得更短，后悬拉长，让视觉重心后移，车长5255毫米、宽2000毫米、高1810毫米，轴距3125毫米。</p>\n  <p>车辆前脸的星环灯升级为三色，白色代表常规状态，蓝色代表车内无人时的辅助泊车等状态，橙色代表车外语音交互等状态。</p>\n  <p>座舱内饰在保留原来的风格之余，在多处地方进行了升级。车内外均提供机械门把手和电子门把手的车型，并且四个电动车门引入电容防夹条，具备防夹能力。</p>\n  <p>另外，全新一代L9搭载四零重力座椅，二排配备电动遮阳帘和高隔热的多级调光玻璃。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260515/v2_885942194ded40ba89e7843b6f2a0f5c@6310690_oswg3959602oswg4096oswg3072_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">理想L9 livis 座舱</p>\n  <p>智能化方面，全新一代理想L9前排搭载29英寸6K一体式超宽全景屏，支持90帧高刷，座舱芯片升级为高通骁龙8797芯片。后舱配备21英寸4K神奇移动屏，支持120毫米电动滑移，手掌一抬可召唤屏幕前后移动。</p>\n  <p>智能驾驶层面，L9 Livis搭载了两颗理想自研的马赫M100 5nm车规级芯片，总算力达到2560TOPS，Ultra版本搭载了一颗马赫M100，配合3D ViT感知模型与马赫VLA智驾大模型，在实际是试驾过程中，在高速路和城区路段都有稳定表现。</p>\n  <p>底盘是此次整车性能上的最大升级点。L9 Livis率先搭载了完全体线控主动底盘，集成线控转向、线控机械制动与后轮转向三大核心技术。（关于理想L9 Livis底盘技术的详解，可查阅36氪此前报道的<a href=\"https://mp.weixin.qq.com/s/-AuNaUqGhUDpiIrMYVEG0A\" rel=\"noopener noreferrer\" target=\"_blank\">《理想整车研发负责人刘立国：说理想不重视技术，是大大的误解》</a>）。</p>\n  <p>在实际试驾过程中，面对飞坡、减速带、连续起伏路和山路弯道等路况，全新一代理想L9能够主动控制车身姿态。</p>\n  <p>续航方面，新车全系标配72.7kWh 5C大容量电池，搭配理想自研第三代增程器。CLTC纯电续航420km，综合续航1650km。</p>\n  <p>理想在第三代增程器上下了较大功夫，采用了双主动降噪静音舱、150+处声学包裹、RNC路噪与EOC增程器双重主动降噪。试驾过程中，即使车速达到80-90km/h，车内NVH也没有太大影响。</p>\n  <p>据理想官方测试数据，理想L9 livis的NVH表现和纯电车型理想i8十分接近。</p>\n  <p>可以看到，理想在全新一代L9车型上下了很多猛料，L9 livis 的正式上市售价和此前李想给出的售价相差了5万元，给足了市场诚意。45.98万元的Ultra版本尽管有所减配，但售价比上一代ultra版本高了3万，和L9 livis则有5万的价格差。</p>\n  <p>理想的产品定价思路正在发生转变，不在遵循L6\\7\\8\\9逐级增长的定价策略，而是配置更高的车型冲击高端市场，拉开价格差距，用相对低价车型去走量，价格和销量两手抓。</p>\n  <p>理想已经出牌，接下来的最大变量是和其他九系产品的竞争，包括问界M9、蔚来ES9等，九系大战的序幕，才刚刚揭开。</p>", "category": "tech", "published_at": "2026-05-15T14:28:10+00:00", "fetched_at": "2026-05-17T02:42:57.684959+00:00", "fingerprint": "89659d6923a854cd"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨央视6000万美元获得世界杯版权；英伟达总市值超过德国GDP；iPhone 17 Pro系列全线下调1000元", "url": "https://36kr.com/p/3811265856626440?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI正考虑采取法律手段起诉苹果公司</li>\n   <li>三星电子开发下一代HBM封装技术，或用于智能手机等移动设备</li>\n   <li>海南：加快培育火箭链、卫星链、数据链，打造风电装备制造产业集群</li>\n   <li>世界银行首席经济学家英德米特・吉尔将于8月卸任退休</li>\n   <li>“海淘”智能穿戴设备或被植入窃密装置，国家安全部最新提示</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>央视确认获得2026年世界杯版权，费用为6000万美元&nbsp;</strong></p>\n  <p>5月15日下午，中央广播电视总台与国际足球联合会共同宣布，就国际足联世界杯新周期版权合作达成共识。合作赛事包括2026年世界杯、2030年世界杯、2027年女足世界杯、2031年女足世界杯。</p>\n  <p>根据双方合作意向，中央广播电视总台确认获得本周期合作赛事中国大陆独家全媒体权利及媒体分授权利，包括开路电视、付费电视、互联网和移动设��等。知情人士透露，中央广播电视总台与国际足联的版权协议已在15日下午生效。根据协议，美加墨世界杯的版权费为6000万美元。（每日经济新闻、澎湃新闻）</p>\n  <p><strong>英伟达市值首破5.7万亿美元，已超过全球第三大经济体德国的GDP&nbsp;</strong></p>\n  <p>5月15日外媒消息，在生成式人工智能热潮中获益颇丰的英伟达，股价在本周接连创下新高，市值在周三就已超过了全球第三大经济体德国的GDP。而在当地时间周四，英伟达股价再度上涨，市值已经突破了5.7万亿美元。</p>\n  <p>在股价上涨并再创新高后，英伟达的市值也创下了新高。按周四收盘价计算，他们的市值为57313.44亿美元，折合人民币约38.957万亿元。（TechWeb）</p>\n  <p><strong>iPhone 17 Pro系列全线下调1000元</strong></p>\n  <p>5月15日零点，苹果手机突然降价，iPhone 17 Pro系列全线下调1000元。京东Apple产品自营旗舰店已经第一时间调价，iPhone 17 pro系列直降叠加以旧换新，双重补贴优惠2000元，到手价6999元。iPhone 17 Pro迎来史上最低价，正式进入6000元档位。iPhone 17更是迎来上市后首次降价，多重补贴以旧换新到手价只要4499元。（证券时报）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>新能源车开启涨价潮，成本压力推动价格上涨&nbsp;&nbsp;</strong></p>\n  <p>近期，多家新能源车企释放调价信号，或直接上调部分车型售价，或逐步缩减终端购车优惠，开启低调的“涨价”试探。据不完全统计，近期已有10余家新能源车企公告调整价格、缩减优惠或计划二季度上调价格。</p>\n  <p>据报道，车价上涨背后的原因主要是成本压力。锂电池是新能源汽车的核心部件，约占整车成本的30%至60%，而碳酸锂是制造动力电池的重要原料。目前，碳酸锂的价格与去年同期相比涨幅超过250%，并且仍在持续上涨。此外，钴、镍、铜等其他金属价格也在同步上涨，进一步推高整车原材料成本。</p>\n  <p>与此同时，车规级芯片的紧缺与涨价也加剧了成本压力。全球半导体产能被AI算力产业大量挤占，导致车规级芯片供货周期延长、价格飙升。数据显示，近三个月内，车规级存储芯片整体价格上涨约180%。某车企4月下旬将其智驾系统的选装价从9900元上调至12000元，涨幅达2100元。（北京日报、北晚在线）</p>\n  <p><strong>美国总统特朗普结束访华</strong></p>\n  <p>5月15日下午，美国总统特朗普结束对中国的国事访问，乘专机离开北京。（央视新闻）</p>\n  <p><strong>美股收盘：三大指数收低 科技股显著回调&nbsp;</strong></p>\n  <p>5月16日讯，美股收盘，道指收跌1.07%，标普500指数收跌1.24%，纳指收跌1.54%。科技股普跌，美光科技(MU.O)大跌6.62%，英特尔(INTC.O)跌6.18%，英伟达(NVDA.O)跌4.42%，特斯拉(TSLA.O)跌4.75%。纳斯达克中国金龙指数收跌2.8%，百度(BIDU.O)跌5.56%，阿里巴巴(BABA.N)跌超6%。(金十数据APP)</p>\n  <p><strong>韩国股市熔断后暴跌7%，SK海力士跌超8%&nbsp;</strong></p>\n  <p>5月15日午后，韩国KOSPI指数跌幅扩大至7%，现报7421.91点。此前，韩国证券交易所运营机构针对基准指数——韩国综合股价指数（KOSPI）启动了卖方“熔断机制”。据韩国交易所披露，当地时间下午1时28分左右，由于KOSPI200指数期货跌幅达到或超过5%并持续至少一分钟，针对KOSPI指数的程序化交易随即暂停了五分钟。截至发稿，三星电子跌超9%，SK海力士跌超8%。（每日经济新闻）</p>\n  <p><strong>OpenAI正考虑采取法律手段起诉苹果公司</strong></p>\n  <p>知情人士周四透露，苹果公司与OpenAI长达两年的合作关系已然陷入紧张。这家人工智能初创企业未能从与苹果的合作中获得预期收益，目前正考虑采取法律行动。消息人士称，OpenAI原本希望能在不走法律途径的前提下解决与苹果之间的分歧，但其法务团队已联合外部律所，着手研究多种应对方案。相关选项包括向苹果发函指控其违反合同，但暂不提起正式诉讼。该消息同时证实了彭博社此前关于OpenAI内部磋商事宜的报道。（新浪财经）</p>\n  <p><strong>华为哈勃等入股弥尔光半导体</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，弥尔光半导体（北京）有限公司发生工商变更，新增华为旗下深圳哈勃科技投资合伙企业（有限合伙）、苏州未来科技企业服务合伙企业（有限合伙）等为股东，同时，注册资本由约515.5万人民币增至约551.4万人民币。 该公司成立于2021年5月，法定代表人为杨展予，经营范围包括半导体分立器件制造、半导体分立器件销售、新材料技术研发等，现由杨展予、上海仙纳多企业管理咨询合伙企业（有限合伙）及上述股东等共同持股。</p>\n  <p><strong>美证券交易委员会已与印度富豪阿达尼就一项民事欺诈诉讼达成和解</strong></p>\n  <p>印度亿万富翁、阿达尼集团（Adani Group）创始人高塔姆·尚提拉·阿达尼（Gautam Adani）已就美国证券交易委员会（SEC）发起的一项关联民事欺诈诉讼达成和解，尚待法院批准。该诉讼涉及阿达尼涉嫌行贿印度政府官员以获取太阳能发电项目。尽管部分检察官此前声称投资承诺不会影响案件走向。（新浪财经）</p>\n  <p><strong>长续航Model Y价格上调1.8万元？特斯拉中国：假消息</strong></p>\n  <p>5月15日，有消息称，特斯拉从5月1日起对Model Y系列车型调价，其中长续航版价格上调1.8万元，高性能版价格上调2万元。对此，特斯拉中国一位内部人士回应称：“（传闻为）假消息”。同时，也从特斯拉中国一位销售人员了解到，Model Y车型并未涨价，只是取消了此前的7年低息购车金融政策。（每经网）</p>\n  <p><strong>三星电子开发下一代HBM封装技术，或用于智能手机等移动设备</strong></p>\n  <p>三星电子正在开发下一代HBM封装技术，旨在为智能手机和平板电脑等移动设备提供高性能的设备端AI。该技术名为“多层堆叠FOWLP”，结合了超高纵横比铜柱和扇出型晶圆级封装（FOWLP），并对现有的垂直铜柱堆叠（VCS）技术进行了改进。虽然服务器级HBM已经具备高带宽，但移动设备在尺寸、厚度、功耗和发热量方面面临着更为严格的限制。（财联社）</p>\n  <p><strong>丰田提交申请，拟在美国得克萨斯州斥资20亿美元建厂</strong></p>\n  <p>美国得克萨斯州公共账目审计官办公室5月14日公布的文件显示，丰田汽车已提交申请，寻求批准在得克萨斯州兴建一座新的制造工厂，该厂址将位于贝克萨尔县，总投资额预计为20亿美元，这座即将落成的工厂预计将创造75个新的就业岗位。根据申请文件显示，该项目的建设工作将于今年启动，预计于2029年竣工，并计划于2030年正式投产运营。（界面新闻）</p>\n  <p><strong>海南：加快培育火箭链、卫星链、数据链，打造风电装备制造产业集群</strong></p>\n  <p>36氪获悉，海南省委常委会5月14日召开会议。会议指出，要以“五向图强”特色产业链和“四新”未来产业为主战场，立足“种源+种业+种市”推进种业振兴，以应用带动创新加快发展深海科技产业，加快培育火箭链、卫星链、数据链，打造风电装备制造产业集群，塑造数字经济发展新动能；坚持科技自立自强，主动对接国家战略科技力量，用好自由贸易港开放政策，深化国际科技合作、产业合作，推动科技创新和产业创新深度融合，因地制宜打造新质生产力重要实践地。</p>\n  <p><strong>世界银行首席经济学家英德米特・吉尔将于8月卸任退休</strong></p>\n  <p>媒体周四看到一份内部备忘录，世界银行行长阿杰伊・班加向员工通报，世行首席经济学家英德米特・吉尔将于8月底退休。班加对吉尔在世界银行集团的长期职业生涯予以高度评价。吉尔在2022年9月出任首席经济学家兼高级副行长之前，曾担任世行公平增长、金融与制度事务副行长。（新浪财经）</p>\n  <p><strong>美国政府披露特朗普Q1交易：买入英伟达、苹果 减持微软、亚马逊</strong></p>\n  <p>根据美国政府道德办公室当地时间周四最新公布的两份财务披露文件，美国总统唐纳德·特朗普在2026年第一季度进行了规模至少达到2.2亿美元的金融交易。这些文件涵盖了1月至3月期间，显示的交易涉及与美国一些规模最大、最知名公司相关的证券。文件披露的交易金额以大致范围而非精确数字表示，累计总额在2.2亿美元至约7.5亿美元之间。披露文件中所涉及的公司包括微软、Meta、甲骨文、博通、美国银行和高盛等。此外，市政债券的交易也被记录在案。备案文件并不总是明确说明证券类型，例如究竟是股票还是公司债券。但一些交易仍因其规模和时机而引人注目。（财联社）</p>\n  <p><strong>公募机构推出ETF主题产品，布局农业赛道</strong></p>\n  <p>从“冷门”到“热点”，农业赛道正成为当下公募机构布局的重要方向。近日，南方基金、万家基金、浦银安盛基金、鹏华基金等多家公募机构发布旗下农业主题基金发售公告。以ETF作为布局先锋，公募机构在申报端、发行端加码发力，积极设立农业主题基金产品，持续完善行业产品版图。（证券日报）</p>\n  <p><strong>“海淘”智能穿戴设备或被植入窃密装置，国家安全部最新提示</strong></p>\n  <p>36氪获悉，国家安全部15日发布安全提示文章。随着全球物流的快速发展，线上跨境购物（“海淘”）已成为一种热门的消费模式。消费者不用亲自出境，只需点击鼠标，远在海外的心仪商品便能送到家门口。广大消费者在享受“海淘”便利的同时，也要警惕和防范其中暗藏安全隐患，安全又愉快地“淘”好物。</p>\n  <p><strong>三星工会称仍计划于下周举行罢工，谈判要到罢工结束后进行</strong></p>\n  <p>三星电子最大的工会周五表示，尽管公司方面提出无条件重启谈判，但工会仍将按计划于下周举行大规模罢工。当天早些时候，三星电子管理层已向工会发出正式提议，这被视为管理层为避免原定于下周四开始的为期18天的罢工而做出的最新努力。此次罢工可能会扰乱这家全球最大存储芯片制造商的生产。（新浪财经）</p>\n  <p><strong>腾讯地图上线骑手模式</strong></p>\n  <p>36氪获悉，5月15日，腾讯地图宣布上线骑手模式，为外卖、快递等配送平台的骑手提供专业导航服务。基于海量骑行轨迹大数据、专研路线规划AI大模型、精准POI定位等核心技术优势，该模式可精准规划更高效、更安全、更直观的骑行路线，并支持商场室内导航、直达单元门、门禁提示等功能，让目的地更好找，系统性地助力解决骑手配送“最后100米”难题。实测数据显示，该模式可使骑手综合配送效率提升近20%。</p>\n  <p><strong>巨力索具:因涉嫌信息披露误导性陈述违法违规被证监会立案</strong></p>\n  <p>36氪获悉，巨力索具公告，公司收到中国证监会下发的《立案告知书》，因涉嫌信息披露误导性陈述违法违规，中国证监会决定对公司立案。目前公司经营状况正常，将积极配合调查并履行信息披露义务。</p>\n  <p><strong>金银价格大跌</strong></p>\n  <p>受美元走强、美国国债收益率上升影响，国际黄金、白银价格15日大跌，其中，金价跌至逾一周低点。</p>\n  <p>当天上午，纽约商品交易所6月黄金期价跌破每盎司4600美元，跌幅超过3%；7月白银期价跌破每盎司80美元，跌幅超过10%。（新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阿里发布Qoder 1.0</strong></p>\n  <p>36氪获悉，阿里发布Qoder 1.0，从AI IDE升级为智能体自主开发工作台，用户只需专注需求定义，Agent团队即可自主完成执行、验证和交付全流程任务。目前，Windows、macOS和Linux系统用户均可下载使用。</p>\n  <p><strong>QQ浏览器与元宝即将联合推出“元宝高考通”</strong></p>\n  <p>36氪获悉，5月15日，QQ浏览器与元宝联合宣布，面向2026高考场景推出系列Skill，并在SkillHub和ClawHub上线“元宝高考通-地区分数线查询”和“元宝高考通-一分一段查询”两项核心能力。双方联合打造的行业首个高考咨询师Agent“元宝高考通”也将于近期上线。</p>\n  <p><strong>xAI正式推出Grok Build早期测试版</strong></p>\n  <p>xAI正式推出Grok Build早期测试版，旨在为超级Grok重度用户提供编码代理服务。（财联社）</p>\n  <p><strong>CoreWeave推出Sandboxes服务，强化AI安全执行环境</strong></p>\n  <p>AI云基础设施提供商CoreWeave宣布正式推出Sandboxes服务，为AI研究人员和平台团队提供安全、隔离的执行环境，用于运行强化学习、智能体工具调用和模型评估等工作负载。（新浪财经）</p>\n  <p><strong>OpenAI推出Codex移动端，iOS和安卓全套餐用户可用</strong></p>\n  <p>Codex正式迎来移动端适配。这款由OpenAI约一年前推出的代码开发工具，现已接入ChatGPT手机应用，用户可远程查看和管理开发工作流程。这项新功能支持用户在任意设备上查看Codex正在运行的实时环境。OpenAI于当地时间周四官宣此次更新，目前该功能处于预览版阶段，iOS和安卓全套餐用户均可使用。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>山东安得医疗用品股份有限公司</strong></p>\n  <p>36氪获悉，据港交所文件，山东安得医疗用品股份有限公司向港交所提交上市申请书，中信建投国际为独家保荐人。</p>\n  <p><strong>深圳市爱德泰科技股份有限公司</strong></p>\n  <p>36氪获悉，据港交所文件，深圳市爱德泰科技股份有限公司向港交所提交上市申请书。</p>\n  <p><strong>安序源科技</strong></p>\n  <p>36氪获悉，据港交所文件，安序源科技向港交所提交上市申请书，联席保荐人为中金公司、浦银国际。</p>\n  <p><strong>合捷电器</strong></p>\n  <p>36氪获悉，据港交所文件，广东合捷电器股份有限公司向港交所提交上市申请书，独家保荐人为第一上海。</p>\n  <p><strong>国星宇航</strong></p>\n  <p>36氪获悉，据港交所文件，成都国星宇航科技股份有限公司向港交所提交上市申请书，独家保荐人为国泰君安国际。</p>\n  <h2>大公司财报</h2>\n  <p><strong>中国黄金国际：一季度净溢利2.36亿美元，创历史新高</strong></p>\n  <p>36氪获悉，中国黄金国际发布2026年一季度业绩报告。报告显示，一季度销售收入由2025年同期的273.1百万美元，增加66%至453.2百万美元；净溢利为236.4百万美元，与2025年同期的86.0百万美元相比增加150.4百万美元，公司史上首次单季突破两亿美元；经营所得现金流由2025年同期的143.5百万美元，增加至268.7百万美元。</p>\n  <h2>投融资</h2>\n  <p><strong>“深度机智”完成数亿元融资</strong></p>\n  <p>36氪获悉，具身智能企业“深度机智”近日完成数亿元融资，投资方包括中关村资本、诚通科创基金、北京熙诚致远、普华资本、东方富海、蓝湖资本、晶科能源控股旗下CVC基金、云岫资本、未来光锥前沿科技基金等；其核心模型已在WorldArena、RoboTwin 2.0、SimplerEnv、RoboCasa、LIBERO等多个公开评测中取得榜首或领先成绩。</p>\n  <p><strong>Anthropic同意以9000亿美元估值开展融资轮的条款</strong></p>\n  <p>据媒体援引两位知情人士的消息报道，投资者Dragoneer、Greenoaks、红杉资本和Altimeter Capital已同意共同领投Anthropic的融资轮。每位共同领投方可能投资20亿美元或更多。（新浪财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>曝iPhone 21或将采用改善版四曲屏，存在边缘亮度下降问题 &nbsp;</strong></p>\n  <p>韩媒ETNews消息，此前有消息称苹果正在为20周年纪念版iPhone（iPhone 20）开发一块“四曲面”面板，但目前该面板存在边缘亮度下降问题，苹果正在与三星、LG联手进行解决。</p>\n  <p>具体来看，相应“失真问题”主要出现在四曲面OLED屏幕所使用的阴极材料上。目前方案采用的是镁银合金（Magnesium-Silver Alloy）阴极层，但这种材料在屏幕边缘区域存在一定的形变风险，进而导致边缘亮度下降，从而影响整机观感。</p>\n  <p>苹果还在考虑将阴极材料替换为IZO（Indium-Zinc Oxide，铟锌氧化物），以从材料学层面改善曲面区域的显示稳定性与亮度一致性。不过考虑到档期，苹果很有可能到2028年的iPhone 21才会进行切换。</p>\n  <p>同时，目前仍存在另一种可能，如果苹果无法在量产前解决边缘失真问题，公司可能会暂时放弃四曲面方案，让iPhone 20继续采用传统平面边框设计。由于目前消息普遍指向2028年才是成熟四曲面屏幕真正进入量产的时间节点，因此苹果也有可能推迟这一技术，等待显示问题完全解决后再正式商用。（IT之家）</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜开心&nbsp;</p>", "category": "tech", "published_at": "2026-05-16T01:03:11+00:00", "fetched_at": "2026-05-17T02:42:57.684953+00:00", "fingerprint": "387b0a34695748ca"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜前苹果工程师跨界骨传导耳机，独创技术路线，打破头部企业专利垄断", "url": "https://36kr.com/p/3810520138243593?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，苏州索迩电子技术有限公司（骨传导运动耳机品牌Mojawa的母公司，以下简称“索迩电子”）于近日完成数千万元人民币的A+轮融资，本轮融资由正海资本领投。</p>\n  <p>据悉，本轮资金将主要用于拓展海外线下渠道，以及推进产品的AI智能化研发。</p>\n  <p>在音频产品市场中，由于对无线和开耳式聆听技术的需求不断增加，骨传导耳机市场出现了显著增长。</p>\n  <p>调研机构Market Growth统计的数据显示，2024年骨传导耳机市场规模为12.8亿美元，预计到2025年将增长到16.11亿美元，到2033年将超过81.5亿美元，复合年增长率为22.8%。</p>\n  <p>不过，该市场集中度较高，少数头部品牌（如韶音）占据主要份额，并建立相对完善的声学专利布局，提高了新品牌的准入门槛。</p>\n  <p>索迩电子通过不同的技术路径切入这一市场。公司成立于2020年，早期业务聚焦于B端的触觉反馈技术（Haptics），为VR手柄、智能座舱等提供宽频振动马达。2021年，团队将独创的“宽频振动技术”应用至声学领域，以此来改善骨传导耳机在低频频段的响应表现。</p>\n  <p>基于这一底层技术的平移，索迩电子创立自有品牌Mojawa墨觉。这种基于触觉马达延伸出的新一代发声架构，不仅在物理层面增加了中低频的下潜，也为骨传导耳机提供了一种新的技术方案，在一定程度上规避了和传统声学路线的专利重合。</p>\n  <p>在产品定位上，Mojawa避开了中低端市场的价格竞争，主要面向专业运动人群推出中高端产品；产品线上，Mojawa推出了多款细分产品，包括主打轻量化（26克）的Run Air，支持“蓝牙+MP3”双模式的Run Plus，以及集成心率监测功能的Terra；渠道测方面，在国内市场，Mojawa目前已进入中国山姆会员店（Sam's Club）的供应链体系。</p>\n  <p>海外市场是Mojawa营收的重要组成部分。2025年下半年，Mojawa入驻了美国BestBuy、Walmart.com、Target、Office Depot等主流KA线上平台。2026年，团队计划进一步拓展北美、欧洲及亚太核心市场的线下渠道。</p>\n  <p>本轮融资完成后，Mojawa计划从运动耳机品牌，向AI运动智能平台发展。由于骨传导耳机佩戴时贴合人体头部，具备集成心率、环境感知等多维传感器的物理条件。</p>\n  <p>基于此，Mojawa正在开发结合AI算法的运动辅助功能，试图覆盖用户训练前（方案推荐）、训练中（心率监测与预警）、训练后（数据复盘）的完整体验。</p>\n  <p>索迩电子创始人兼CEO Robin Cao告诉硬氪：“AI时代，真正的壁垒是对用户的深度理解和持续服务能力，而Mojawa在传感器数据和骨传导技术上的积累，让我们有能力构建出别人短期内无法复制的运动AI体验。”</p>\n  <p>团队背景方面，索迩电子创始人Robin Cao拥有硬件与供应链从业经历。创立索迩之前，其在苹果公司任职八年，曾参与iPhone及Apple Watch触觉产品线的开发与商业化。相关的技术与供应链经验，为索迩的研发和生产提供了基础。</p>\n  <h3><strong>创始人问答：</strong></h3>\n  <p><strong>硬氪：在高端产品线（如Terra）中，Mojawa加入了心率监测等功能。当时是出于怎样的考量决定向“智能穿戴”方向探索的？</strong></p>\n  <p><strong>Robin Cao：</strong>这源于真实的运动痛点。专业运动人群通常会佩戴智能手表和耳机，但在很多特定场景下，手表的交互并不方便。比如冬天在户外跑步，穿着厚羽绒服、戴着手套，或者在健身房举铁戴着护腕时，用户很难低头去看表盘数据。如果耳机能实时通过语音播报心率并进行运动指导，就能完美填补这个场景空缺。</p>\n  <p>从技术实现上看，骨传导耳机贴合在耳前的位置，内部紧贴着主动脉，比手腕处的毛细血管测心率要精准得多。为了把心率传感器和算法植入耳机，我们花了长达一年多的时间搞研发，投入大量的研发费用。</p>\n  <p>我们希望骨传导耳机不仅仅是一个音频播放器，而是一个能主动理解用户生理状态、提供科学指引的智能穿戴设备，这也是我们建立产品护城河的核心方向。</p>\n  <p><strong>硬氪：作为一个成长期的初创企业，面对拥有绝对体量优势的头部品牌，Mojawa在竞争策略上是怎么规划的？</strong></p>\n  <p><strong>Robin Cao：</strong>我们的底色是追求原生的技术创新，通过技术溢价来获取合理的商业利润。因此，我们从一开始就拒绝参与低价内卷，不去做几百块钱的“廉价平替”。我们瞄准的是中高端的专业运动人群，也就是所谓的“装备党”，他们看重的是产品的专业属性和真实体验。</p>\n  <p>在竞争维度上，我们本质上是跨界进来的。头部品牌更偏向传统的声学积累，而我们是做触觉和宽频振动起家的，这种底层的技术差异让我们在低频音质上具备物理优势，也天然规避了对方的专利封锁。未来我们会持续向AI交互和健康数据监测方向深耕，走出一条属于自己的智能化硬件道路。</p>", "category": "tech", "published_at": "2026-05-16T02:00:00+00:00", "fetched_at": "2026-05-17T02:42:57.684944+00:00", "fingerprint": "c3f2c597d5dfbcdb"}, {"source": "36氪 - 最新文章", "title": "48022桌需退款，这家网红店出了什么事？", "url": "https://36kr.com/p/3812706162220548?f=rss", "summary": "<p>“由于您吃到的只是‘烤熟的羊肉串’，而不是‘最佳状态的羊肉串’，我们内心感到惭愧，所以原路‘退回首轮烤制一半羊肉串的钱’作为补偿。”</p>\n  <p>近日，不少网友在社交平台发文称，收到了“很久以前羊肉串”的部分退款及一条道歉短信。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_443e0701ae7844f4a3d2b9876e8b2421@5579416_oswg135434oswg742oswg842_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：很久以前官方账号</p>\n  <p>据窄门餐眼数据，“很久以前羊肉串”开有142家门店，其中九成为商场店。羊肉串是其核心单品，门店特色是统一使用自动旋转电烤炉，消费者可自行动手翻面、完成烤制。</p>\n  <p>然而，此次退款事件的问题恰恰出在电烤炉上。</p>\n  <p>据有意思报告了解，“很久以前羊肉串”此前采用人工目测的方式判断烤炉温度，加热板变红即可烤制。但从2025年3月起，为了标准化流程，门店引入了电子测温枪，烤炉预热温度达到530°视为温度达标。</p>\n  <p>但据“很久以前羊肉串”在官方账号发布的声明透露，在实际使用过程中，门店过度依赖测温枪数值，忽视了门店电压波动导致功率不稳，会影响烤炉内部实际温度的稳定性。</p>\n  <p>结果就是原本应该高温快烤、做到外焦里嫩、汁水丰盈的羊肉串，由于烤制时间拉长、水分无法锁住，变成了只是烤熟了而已，肉质受到影响。</p>\n  <p>一位“很久以前羊肉串”店员告诉有意思报告，电子测温枪的测量方式也有问题，“测量的可能只是烤炉的表面温度，温度是达标的，但烤炉内部的空气温度却还没够，所以烤炉预热也是不足的。”</p>\n  <p>“很久以前羊肉串”统计发现，涉及的门店共计24家，受影响的顾客共计48022桌，预估退款为110余万元。</p>\n  <p>值得注意的是，此次退款行为其实是“很久以前羊肉串”主动为之，此前并没有大规模的消费者负面吐槽和反馈。</p>\n  <p>在社交平台上，网友对此次退款事件的评价不一。有经常复购的消费者说“很久以前又在想办法退款了”，还有网友认为“这就是一场搞噱头的营销”。</p>\n  <p>对此，资深公关专家姚素馨认为，将退款事件加以突出，对内能反向起到警示作用，加强内部管理；对外也能给品牌树立起一个重视品质的形象，获得一定曝光量。</p>\n  <p>“甚至有些时候即使负面舆情并不大，但品牌依旧判断是有风险的，就会做‘预防性召回’的动作，羊肉串无法召回，只能通过部分退款的方式了”，姚素馨说。</p>\n  <p>然而，退款事件也暴露出“很久以前羊肉串”在规模扩张中的品控问题。</p>\n  <p>食品行业分析师林岳分析：“由于电压、测量方式等问题，门店靠工具标准化会存在误差，变量需要员工靠经验来把握。此次退款涉及24家门店，且时间跨度半年，说明是系统性的品控漏洞，暴露出品牌过度依赖工具，在快速扩张中存在管理混乱。”</p>\n  <p>上述店员表示，当前，门店已经不再使用电子测温枪。总部对门店进行了统一培训，要求门店首波客人的烤炉预热时间从原本的7—8分钟，延长至10—12分钟，并且店员需要手动测温，手在炉面上方试温，若感觉很烫，无法停留，才是温度达标。</p>\n  <p>但这意味着，“很久以前羊肉串”又回到了原本人工测温的方式，将标准化流程依托于员工的判断。</p>\n  <p>而在“很久以前羊肉串”身上暴露出的规模与口味的割裂，其实是烧烤行业的共性痛点。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260517/v2_7b18cccb331c4bfba7c95e17b248a0a8@5579416_oswg119467oswg1047oswg508_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：红餐大数据</p>\n  <p>据红餐大数据，2025年全国烧烤市场规模已达到2680亿元，同比增长4.3%，占据餐饮大盘约5%的市场份额。截至今年2月，全国烧烤门店数量为40.9万家，但连锁化率仅为22%以上，门店达到100家以上的连锁烧烤品牌在行业中仅占1%。</p>\n  <p>烧烤行业看似门槛低，实则一直在面临开得“铺天盖地”后，要如何实现口味标准化的问题。</p>\n  <p>经营两家烧烤小店的陈明告诉有意思报告，他开店二十多年，拥有稳定的客流靠的正是不变的口味。他认为，烧烤的灵魂是火候，需要根据食材来调整火候的大小与时间，再根据手感搭配好调料，这些都需要依靠自己的经验。</p>\n  <p>正因如此，他多年来都未开更多门店，所有烤串都是由他和家人烤制完成。</p>\n  <p>林岳也补充，烧烤品类规模化的核心难点就在于标准化基础薄弱，烤串从穿串、腌制到烤制，各环节对人工依赖度极高，导致产品口味和品质稳定性弱。</p>\n  <p>而烧烤品牌想要实现标准化，往往会借助设备实现。大圣烧烤创始人候磊曾提到，大圣烧烤在AI智能烧烤机的投入颇多，想要通过它实现自动控温、自动翻转、自动喷料，保证烤制全程仅靠一人即可完成。</p>\n  <p>但“很久以前羊肉串”的退款事件无疑是一次警示，餐饮品牌在形成标准化的模式之前，需要不断对管理能力和操作环节进行复盘和优化，避免跑偏，对工具产生过度依赖，而产生新的品控问题。</p>\n  <p>不知道交了100多万学费后，“很久以前羊肉串”能不能让消费者一直吃到口味稳定的羊肉串。</p>\n  <p>作者：高越</p>\n  <p>编辑：安迪</p>\n  <p>值班编辑：甜豆</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/a-chVBt8rPVRQ4DEzHAUnw\" rel=\"noopener noreferrer\" target=\"_blank\">“有意思报告”</a>，作者：高越，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-17T01:29:37+00:00", "fetched_at": "2026-05-17T02:42:57.684928+00:00", "fingerprint": "22675cc102c0e038"},   const CATEGORIES = [

    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
