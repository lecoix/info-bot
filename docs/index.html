<style>
  :root {

    --accent: #0969da;

    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

t": "0fbbfc3d588a0105"}, {"source": "36氪 - 最新文章", "title": "谁能想到，系统流「爽文」最先被AI Agent实现了", "url": "https://36kr.com/p/3878522627518471?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_479f75a076024a17bafa8bcb0cb1a26d@5362858_oswg1152334oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>撰文｜深海</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_66e81b6f11544b53b6d7c7c632c151c1@5362858_oswg4801oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>网文里的“系统流”，被拍成了职场短剧</strong></h2>\n  <p>千禧年初的网文圈，有三大经典题材在爽文届立于不败之地：无限流、快穿流、系统流。</p>\n  <p>这三大爽文战神体横空出世时，对IP界几乎是降维打击。当传统小说还在费劲搭世界观、铺人物成长弧光时，系统流已经绕过漫长的发育过程，直接把爽感推到最大。系统，这个堪称bug的存在，无论主角进入什么样的世界副本，面对不同的任务、危机和奖励，它总会尽职尽责地当好一个无情的辅助工具，记录进度、提示规则、保存道具、结算积分、解锁技能……换句话说，一切琐事都干扰不到主角的成长，主角只管尽情体验人生。</p>\n  <p><strong>20年前这还只是一种遥不可及的畅想，但2026年，这个AI能力超速发展的时代，系统流已经越来越像一种现实剧本。</strong></p>\n  <p>最近，联想天禧AI推出了一部定制短剧《我的AI搭档之“禧”从天降》，拍的就是系统流和现实职场的结合。故事围绕一个职场新人叶天展开。叶天是一个普通打工人，被上司打压、被克扣奖金、被否定能力，职场新人该踩的坑一个没落下。但意外获得天禧AI后，他在一系列职场危机中化险为夷，一路逆袭。</p>\n  <p>这部短剧有种复古的爽感——爽点都是经典桥段：主角受委屈，系统从天而降；反派设局，系统现场拆局；任务压顶，系统直接开工。<strong>只是这一次，网文里的“金手指系统”，变成了以AI Agent为核心能力的天禧AI。</strong></p>\n  <p>故事这样开始。临近下班的叶天像往常一样倒霉，被上司要求当天完成一个全部门三个月都没啃下来的赛事营销方案。情绪崩溃之下，他把手机扔进水杯，没想到手机在水中亮起，天禧AI弹窗出现：“检测到宿主过去一个月内被姚主管说能力不行67次……我将出手。”</p>\n  <p>主角被现实逼得走投无路时，金手指上线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_cca9c0f795f44cf1ac3a4632b40dc648@5362858_oswg623909oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>紧接着，天禧AI扫描了叶天桌面上的方案、赛事集锦、外卖优惠券和工资到账记录，给了他一个基本状态判定：工资不高、任务不少、情绪不稳、离职未遂。叶天的日常事务被系统量化成了可以评判的指标后，系统开始了他的宿主分析，奖金为什么被扣、方案是谁做的……天禧AI调出了他的历史资料、赛事信息和原设计方案草稿后，快速完成了基础方案，再根据公司预算有限、不能大规模铺投放的现实情况，调整成更适合公司的“蹭热点”打法。</p>\n  <p>在这里，短剧制造的爽感不只是简单的“AI替人写PPT”——这功能还停留在初始阶段。系统给叶天的帮助是更高层面的，通过高速整理历史信息、生成框架，系统判断出经常上班看球的叶天，并不是单纯在摸鱼，其实他的大脑已经在进行资料研究，他对营销方案战略的把握和意识都是有积累的。</p>\n  <p><strong>所以，天禧AI并不是抢了主角的风头替他干活，而是帮主角把他已有的潜能引导出来，发挥到最大。系统就是最强辅助。它让被长期打压的叶天知道，他不是无能，而是被低估，从而实现心态到能力上的全方位觉醒。</strong></p>\n  <p>更爽的打脸桥段一个接一个。在汇报现场。叶天展示方案时PPT被人删空，公司又突然断网。上司借机发难指责他没完成工作、上班摸鱼，要求公司开除他。但叶天的“歪嘴龙王”时刻马上来了，天禧随即激活离线守护和企业级私有云备份，在断网情况下帮助叶天现场重建PPT，还根据现场人员状态判断出删文件的犯人。反派本想制造公开羞辱，反而把叶天推上了公开翻盘的舞台。</p>\n  <p>不得不说，很久没看过那么接地气的系统流短剧了。这大概是每个打工人都会做的梦——把“随身系统”塞进自己的现实生活，让这位全能助手帮你识别处境、拆解任务、保存资料、调用工具，关键时刻它会出手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_9e69b3d225574e668ace7575a38d67da@5362858_oswg1047639oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>但，看完短剧观众就会马上意识到，等等，这“系统流”，说的可不就是AI Agent吗？</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_33af2161af874091a41ccafb2e45d739@5362858_oswg5678oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>看完短剧你就理解了AI Agent，而且想要一个</strong></h2>\n  <p>看叶天一路开挂爽赢职场，观众很难不冒出一个念头：现实里也能有这样一款AI搭档的话，工作里的破事是不是能少很多？</p>\n  <p>至此《“禧”从天降》高明地完成了种草——它没有上来就给观众解释AI Agent是什么、递上一份科技说明书，而是先让观众跟着叶天体验一遍AI Agent能帮你做什么，包括但不限于被临时派活时帮你速推方案、文件出问题时上云端恢复进度、和客户沟通语言不通时实时翻译、信息过多时把它们分类整理成核心价值判断。</p>\n  <p><strong>这些问题，放在剧情里是爽点；放回现实里，就是普通用户对AI Agent最朴素的期待。</strong></p>\n  <p>过去，“AI Agent”对很多人来说都是一个有点悬浮的技术名词。它听起来很先进，经常出现在行业讨论里，但到底和豆包类的对话型AI有什么区别？我又为什么要装一个放进电脑里？很多用户都没有体感，技术名词一旦离开真实场景，就会变得难以理解。</p>\n  <p><strong>但短剧是天生的情景大师，它给了AI Agent一个非常好的理解入口</strong>：主人公叶天不是技术精英或专业玩家，他就是一个被任务追着跑、被琐事消耗的普通打工人，他用的AI Agent就是联想天禧AI，他在剧里获得的“系统助攻”，也都能在天禧AI的现实能力中找到对应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_41efac0c5aec40cba288be5f6b865e0e@5362858_oswg631035oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>比如，叶天第一次真正用天禧处理工作是在下班前十分钟赶赛事营销方案。剧里，天禧调取了他过去积累的赛事浏览记录、方案草稿和工作痕迹，把这些零散信息重新组织成方案素材。这个情节看着像开挂，本质上讲的却是AI Agent最关键的能力，即理解用户长期积累下来的电子痕迹、习惯偏好和上下文。</p>\n  <p>在真实的办公场景里这是一个非常具体的痛点。一个人写过的Word、看过的PDF、改过的Excel、没来得及整理的PPT、散落在本地文件里的资料，一般时候用户想不起来它们的存在。<strong>平时，它们只是躺在库里的死文件，在AI Agent介入后却可以被盘活，搬进知识库，成为AI Agent理解用户、帮助用户完成任务的素材。</strong></p>\n  <p>再看会议室里的断网反杀。天禧AI在叶天被设局陷害时启动的离线守护和企业级私有云备份，这是AI Agent可以轻易完成的任务，Agent日常就能持续理解任务链路、自动保存文件上云，在日常运行中就把关键文件、任务进度和上下文同步好。天禧Claw强调的零部署、开箱即用、端云协同、多端接力等特性，构成了短剧情节里那个“关键时刻从不掉链子”的强大系统。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4b513e8b0dd440558a497eae003de22f@5362858_oswg457813oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>接下来的剧情也巧妙展示了AI Agent的多功能。剧中叶天被上司质疑英语能力，却能借助天禧的实时同声传译，顺利和跨国项目客户沟通；上司还想进一步陷害叶天，故意在开会时把他叫走，想安个擅离职守的罪名，而天禧AI实时帮叶天生成虚拟影像继续参会，并用AI妙记留下完整会议纪要，帮叶天反手打了上司脸；在为营销方案寻找赛事代言人时，叶天在训练基地偶遇过气球员皮特，也是借助天禧AI调取球员的往期训练和比赛数据，判断出这个老将仍有竞技和传播的价值，最终说服对方为项目代言。</p>\n  <p>这些情节设计对应到真实的AI Agent，就是AI同声传译、AI妙记，以及AI Agent的信息整合判断功能。<strong>如果单独拿出来说，正儿八经的产品介绍大家不想费劲分析，但放进短剧里，它们就变成了观众能立刻理解的职场瞬间。</strong></p>\n  <p>看到一个打工人被AI搭档营救、逆袭翻盘，观众也自然被种草了这款最强帮手——原来，所谓的AI Agent，就是那个靠谱的随身系统“金手指”。一部短剧，用最朴素的方式让观众看明白了AI Agent。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_4cac3db44d6545aa8347fffaf19d4537@5362858_oswg512766oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_edd0ed1f1cd54e77985c675c079fdb31@5362858_oswg5664oswg900oswg140_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>从短剧走出后，天禧AI早在现实里运转起来了</strong></h2>\n  <p>从短剧走出后，回到现实世界的观众会发现，剧里的天禧AI并不只是一个爽剧设定，这个“金手指系统”，已经在现实世界中高效运转起来了。</p>\n  <p><strong>世界杯期间，联想作为本届FIFA世界杯官方技术合作伙伴高频带着天禧AI出镜。</strong>2026 FIFA世界杯开赛前夕，联想在北京开启“2026年FIFA世界杯联想嘉年华”启幕站，围绕混合式AI展示了一系列体育AI方案，并计划通过全国31城活动，把世界杯的技术体验和消费场景推到更多用户面前。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_ddf1f56480234d57b5af0bd4a6e8a058@5362858_oswg149307oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>短剧里的叶天做的是球赛营销策划，现实里，联想也把AI能力真正放进世界杯。天禧AI已经真正走进了专业级别的赛事规划中——<strong>在全球赛事层面，联想面向FIFA打造了世界杯足球AI超级智能体FIFA AI Pro。</strong>它会基于FIFA历史数据和战术分析数据，协调多个智能体，为球队对比、战术调整、球员个性化比赛分析提供支持。</p>\n  <p>联想还展示了3D数字人可视化方案、裁判视角AI视频增强系统等能力。出现复杂判罚时，联想天禧AI可以帮忙把赛事场景转化成更直观的3D影像；裁判第一视角也能通过AI视频增强，足球比赛里那些更专业的细节能被AI翻译成更易于理解的内容。</p>\n  <p>而在中国足球场景中，作为中足联全栈AI战略合作伙伴，联想也推出了中足联专属AI智能体“足智多谋AI”，服务赛事运营、赛事监管和指挥调度。围绕足球，联想打造了一个全方面维度的AI Agent，完整覆盖从专业赛事运营到大众消费端的全链路，实时赋能足球赛事。</p>\n  <p><strong>在普通观众层面，更直观的AI Agent赋能体验来自于“天禧AI足球智能体”——它就像一个“世界杯版随身系统”。</strong>一个球迷打开天禧AI足球智能体，最开始可能只是想查一下今晚有没有比赛，或者自己支持的球队下一轮对谁。用得多了后，AI Agent会开始展现它的智能，在用户选择主队后围绕这支球队推送赛程变化、球员动态、阵容变化、比赛提醒等各类信息。</p>\n  <p>世界杯本身就是一个信息量爆炸的场景。在小组赛密集推进阶段，球队状态天天变，伤病名单、历史交锋、积分形势、赛程压力都会影响下一场比赛，普通球迷很难把这些信息长期追全，更不用说整理成一套清楚的判断。天禧AI足球智能体会帮用户把分散的信息收拢起来，跟着比赛进程不断调整信息，而不只是劳烦用户一次次从零开始查询。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_511e81e807e24f7dbf887e39a0136738@5362858_oswg192554oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>当然，世界杯赛事只是天禧AI Agent功能集中展示的场景之一，它是普通观众理解和接纳Agent的入口，并不是终点。</strong>在世界杯赛事期间用户习惯了系统的陪伴，它也会逐渐渗透到工作、生活的不同场景，在别的大小事务上成为用户的好帮手。工作里，它也能整理文件、生成纪要、同步资料、辅助写作；进入生���场景，它还能提醒事项、跨设备接力、调用不同工具完成任务。</p>\n  <p>由爽感短剧种草的“随身系统”幻想被点燃后，这份对AI Agent的渴望也会蔓延到真实的生活中。世界杯赛事把幻想落到一个全民关注的现实场景里，让用户第一次上手感受到AI Agent的好用。等赛事热度过去后，那个处理日常琐事、帮人持续推进任务的好用帮手，也会真正留下来。</p>\n  <p>人手一个AI Agent跟随左右的日子，可能已经比想象中更近了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_a77ef2c498e248c6b38f828c1905bacc@5362858_oswg3021oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_74c0136c87c843a38f668487a3c15066@5362858_oswg13015oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>你在追世界杯吗？</strong></p>\n  <p><strong>你会需要这样一个AI Agent吗？</strong></p>", "category": "tech", "published_at": "2026-07-02T13:22:24+00:00", "fetched_at": "2026-07-03T02:32:59.765650+00:00", "fingerprint": "115a0043a7035fe8"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜证监会同意宇树科技科创板IPO注册；Meta“带崩”科技股？业内人士：算力过剩系误读", "url": "https://36kr.com/p/3878550357946625?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>奥飞娱乐：上半年净利润同比预增305.30%—413.38%</strong><br />36氪获悉，奥飞娱乐发布2026年半年度业绩预告，预计2026年上半年归属于上市公司股东的净利润为1.5亿元—1.9亿元，比上年同期增长305.30%—413.38%。</p>\n  <p><strong>雀巢称消费者因价格压力避开中等包装产品</strong></p>\n  <p>雀巢表示，在美国消费者专注于产品可负担性、购买者纷纷转向大包装或经济型包装而避开中等规格产品的背景下，该公司正努力控制价格。（新浪财经）</p>\n  <p><strong>盐湖股份：上半年净利润同比预增131.38%—142.95%</strong></p>\n  <p>36氪获悉，盐湖股份发布业绩预告，预计上半年净利润60亿元—63亿元，同比增长131.38%—142.95%。</p>\n  <p><strong>Meta“带崩”科技股？业内人士：算力过剩系误读</strong></p>\n  <p>7月2日，A股科技股大跌，半导体、算力硬件、存储芯片等板块跌幅较大。以科技股扎堆的“双创板”为例，创业板指和科创综指分别下跌5.71%和5.64%。从市场情况来看，A股科技股大跌源于Meta对外出售算力的消息被市场解读为算力过剩。然而，多位业内人士认为，该消息属于误读，Meta出售算力不是AI资本支出的结束，而是意味着AI基建商业模式成熟。（证券时报）</p>\n  <p><strong>抖音电商上线“肖像保护功能”</strong></p>\n  <p>36氪获悉，近日，抖音电商在北京举办“侵权仿冒治理开放日”活动，正式宣布上线“肖像保护功能”。平台将利用模型识别、核验授权信息、阻断相似内容传播等功能，主动识别并拦截AI仿冒、盗用素材等交易类侵权内容。据抖音电商披露，截至2026年6月，平台已累计处置侵权仿冒达人账号超1.2万个，处置仿冒带货商品超4.8万个，处置仿冒带货内容超26.1万条。与此同时，抖音电商“肖像保护功能”已主动拦截侵权账号9.2万个。</p>\n  <p><strong>知情人士辟谣一汽奥迪中方一把手换帅：不实消息</strong></p>\n  <p>据媒体报道，就一汽奥迪中方一把手被曝换帅的传言，一汽奥迪方面知情人士表示，不实消息，目前郭永锋仍为一汽奥迪销售有限责任公司执行副总经理。自2025年9月1日起，郭永锋开始担任一汽奥迪销售有限责任公司执行副总经理，全面负责一汽奥迪在华所有国产及进口车的销售、售后服务、网络及品牌营销工作。（财联社）</p>\n  <p><strong>普华永道预计2026年香港IPO融资额将达到3800亿港元</strong></p>\n  <p>普华永道预计2026年香港IPO融资额将达到3800亿港元。（财联社）</p>\n  <p><strong>北京君正：DRAM三季度价格会继续上调，四季度存在继续调价的可能性</strong></p>\n  <p>36氪获悉，北京君正近日接受机构调研时表示，DRAM涨价比较多，一季度国内客户开始调价，二季度国内客户仍在继续涨价，同时海外客户也陆续开始调整价格，预计二季度收入和毛利率会继续增长；三季度价格会继续上调，四季度的价格政策要到三季度才能确定，不过目前看四季度供应仍然较为紧张，存在继续调价的可能性。随着客户用部分SRAM产品来代替DRAM方案，部分SRAM芯片二季度价格也有所上涨。NOR Flash一、二季度都有涨价，涨价幅度总体来说比DRAM要小，NOR Flash虽然产能也在趋紧，但比DRAM要好很多，一季度公司Flash产品线实现了很好的收入增长，其中销量的增长占比较大。三季度的价格是根据具体产品和具体客户情况确定的，不一定都会调价。由于公司存储芯片持续在涨价，预计各季度毛利率会环比有所增长。</p>\n  <p><strong>证监会同意宇树科技科创板IPO注册</strong></p>\n  <p>36氪获悉，证监会同意宇树科技股份有限公司首次公开发行股票并在科创板上市的注册申请。</p>\n  <p><strong>小红书：世界杯开赛至今，足球内容日均发布量环比增长10倍</strong></p>\n  <p>36氪获悉，近日，小红书发布了《世界杯小组赛观赛报告》。小组赛期间，平台直播观看时长达到了开赛前的90倍，平台直播观看人次达到了开赛前的40倍，世界杯与足球内容曝光量达282亿。开赛至今，足球内容日均发布量，环比5月增长了10倍。</p>\n  <p><strong>香奈儿收购巴黎衬衫制造商Charvet</strong></p>\n  <p>7月2日，据报道，香奈儿表示，将收购总部位于巴黎的男装衬衫制造商Charvet。交易条款未予披露。Charvet是一家成立于1838年的法国高端衬衫制造商，主营衬衣与领带定制业务，在巴黎旺多姆广场设有专卖店。（新浪财经）</p>\n  <p><strong>理想“动刀”产品部：拆分整车和智驾产品，并入研发</strong></p>\n  <p>36氪从多位知情人士处获悉，理想即将围绕产品决策流程进行新一轮组织架构调整，计划将产品部的部分关键职能拆分，并入研发部门。从群组关系来看，理想汽车产品部由范皓宇负责，包含电动本体、空间智能、自动驾驶终端产品、交互设计、平台运营、App与官网等。了解调整动向的人士向36氪透露，目前调整主要针对电动本体和自动驾驶等核心产品定义团队，其中已经明确的是，产品部的电动本体定义团队，拆分并入刘立国带领的整车研发部门；自动驾驶终端产品团队将并进詹锟带领的基座模型研发团队。“可能也有一部分体验相关的产品人员进入刘杰的产品线。”一位知情人士说道。<a href=\"https://mp.weixin.qq.com/s/LpG5oLwglvx8A1rHPRnTEA\" rel=\"noopener noreferrer\" target=\"_blank\">原文</a></p>\n  <h2>投融资：</h2>\n  <p><strong>德国无人机制造商Quantum Systems获得12亿美元融资</strong></p>\n  <p>德国国防科技公司Quantum Systems周四表示，已筹集12亿美元新资金，这使这家无人机制造商的估值达到约80亿美元，这也是迄今为止欧洲国防科技公司获得的最大规模私募融资之一。这一估值较一年前高出约八倍。这家总部位于慕尼黑的公司表示，本轮融资得到了国际投资者的支持。（新浪财经）</p>\n  <p><strong>“灵珠”完成天使轮融资</strong></p>\n  <p>36氪获悉，AI创作平台“灵珠”近日完成了天使轮融资，由TikTok天使投资人韦海军领投。</p>\n  <h2>新产品：</h2>\n  <p><strong>秦淮数据投运行业首个算力中心SST商用项目</strong></p>\n  <p>36氪获悉，7月2日，行业首个算力中心SST（固态变压器）智能直流供电商业化项目在秦淮数据环首都·桑园云计算产业基地正式投运，标志着算力中心供配电体系实现从“工频”到“高频”、从“交流”到“直流”的范式突破。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>前5月我国软件业务收入同比增长10.3%</strong></p>\n  <p>记者从工业和信息化部了解到，今年前5个月，我国软件和信息技术服务业运行态势良好，软件业务收入同比增长10.3%。数据显示，今年前5个月：我国软件业务收入62451亿元，同比增长10.3%；软件业利润总额同比增长2.2%；软件业务出口达到276.5亿美元，同比增长12.8%。（央视新闻）</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-07-02T14:16:31+00:00", "fetched_at": "2026-07-03T02:32:59.765645+00:00", "fingerprint": "9b97fda7d8efea05"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“具身智能第一股” 宇树科技上市申请通过；SK海力士单日市值蒸发10000亿元；配置失误引发0元抢购潮，霸王茶姬致歉", "url": "https://36kr.com/p/3879158039834629?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>苹果拟于今明两年推出至少五款新iPhone</p>\n  <p>AI版支付宝开放公测，上线72项办事技能</p>\n  <p>特朗普回应“利用职位牟利”：股市在涨，大家都在赚钱</p>\n  <p>LV起诉茉莉奶白，茉莉奶白被判赔1030万元</p>\n  <p>6月赴日航班取消1488个</p>\n  <p>安克创新港股上市首日破发</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>证监会同意宇树科技科创板IPO注册</strong></p>\n  <p>7月2日，证监会网站显示，同意宇树科技首次公开发行股票注册。这意味着，全球首家在IPO前实现人形机器人规模化盈利的企业正式拿到A股“入场券”，将成为A股“人形机器人第一股”。&nbsp;</p>\n  <p>宇树科技从今年3月20日科创板IPO申请获受理，再到7月2日注册生效，仅用时104天。其创下科创板预先审阅机制落地以来的最快审核纪录，也成为科创板预先审阅机制落地以来继长鑫科技之后的又一标杆案例。（科创板日报）&nbsp;</p>\n  <p><strong>亚太股指重挫，SK海力士单日市值蒸发10000亿元</strong></p>\n  <p>7月2日，全球科技股罕见降温。截至收盘，亚太多数股指重挫。A股上证指数跌2.03%，深证成指跌3.85%，创业板指跌5.71%，科创50指数跌7.7%。算力硬件股大幅调整，剑桥科技、华工科技等跌停；半导体芯片股集体下挫，兆易创新、长电科技等跌停。北方华创、金海通及晶方科技等多股跌停。日经225指数收盘下跌1741.81点，跌幅2.47%，报68958点。韩国KOSPI指数下跌7.89%，为6月8日以来最低收盘水平。三星电子收跌9%，SK海力士收跌超14%。SK海力士单日蒸发1600亿美元市值（约合人民币10000亿元），总市值降至约1万亿美元。（中国经济网）</p>\n  <p><strong>配置失误引发0元抢购潮，霸王茶姬紧急致歉</strong></p>\n  <p>7月2日凌晨，霸王茶姬线上点餐小程序突发系统异常，原定上线的新品特惠饮品标价全部变为0元，大量消费者闻讯涌入下单，瞬时高流量直接挤垮小程序后台。当日上午，霸王茶姬湖北子公司发布官方致歉声明，公司7月2日推出的“远山鲜沏”系列9.9元特惠活动，因运营后台配置失误，产品意外以0元上架，才引发大规模免费下单抢购事件。声明公布后续解决方案，7月2日零点至系统修复前，所有标价0元生成的订单全部统一取消。为弥补故障给消费者带来的不佳体验，每位受影响用户的账户将直接到账三张 “远山鲜沏” 系列0.01元无门槛兑换券。霸王茶姬湖北子公司还表示，事件发生后，公司已全面复盘内部流程与系统审核机制，坚决杜绝此类失误再次发生。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>AI版支付宝开放公测，上线72项办事技能</strong></p>\n  <p>36氪获悉，7月2日，AI版支付宝“阿宝”完成新一轮产品迭代并正式开放公测。iOS 和安卓系统用户在应用商店或支付宝App内搜索“阿宝”或“蚂蚁阿宝”进行更新体验。本次升级围绕生活服务垂域模型能力、服务生态和用户陪伴体系三方面展开，优化用户通过自然对话办理各类生活服务的使用体验。同时，从数千项生活办事服务中精选出72项智能办事技能，作为公测阶段的首批上手清单。&nbsp;</p>\n  <p><strong>Anthropic或正与三星洽谈定制人工智能芯片</strong></p>\n  <p>7月2日，据报道，有三位知情人士表示，Anthropic已启动自研AI芯片的早期工作，并与三星电子就潜在制造合作进行了洽谈。（界面新闻）&nbsp;</p>\n  <p><strong>Meta首席执行官扎克伯格称AI智能体开发未达预期</strong></p>\n  <p>据报道，Meta首席执行官马克·扎克伯格表示，过去四个月AI的智能体开发“并未以我们预期的方式加速”。扎克伯格补充称，包含大规模裁员在内的重组工作本可以更“干净利落”，公司对新架构的押注“目前还没有取得成效”。（新浪财经）&nbsp;</p>\n  <p><strong>英伟达推出AI基础设施新合作模式</strong></p>\n  <p>英伟达当地时间7月1日宣布推出全新的AI基础设施合作模式，将通过收入分成（Revenue-sharing）和信用支持（Credit-support）机制，与AI云服务商共同建设大规模、多租户AI工厂，帮助初创企业、模型开发者、企业及科研机构更快获得AI算力，同时为英伟达创造与算力使用量挂钩的持续性收入。根据方案，AI云厂商将部署基于英伟达DSX AI Factory架构的AI工厂，对外提供云计算服务。首批合作伙伴包括Sharon AI和Firmus。其中，Sharon AI计划部署最多4万块NVIDIA Grace Blackwell GB300 GPU；Firmus将在印度尼西亚巴淡岛建设DSX AI工厂园区，规划扩展至360兆瓦电力规模，并部署最多17万块英伟达GPU。（财联社）&nbsp;</p>\n  <p><strong>阿里整合QoderWork、悟空、MuleRun，将推出新的生产力AI产品</strong></p>\n  <p>36氪获悉，阿里巴巴正在对旗下Agent产品线进行整合：以QoderWork为基础，整合悟空、MuleRun的能力，整合升级成一款更强大的面向企业生产力场景的AI产品。新产品由陈宇森负责。阿里巴巴方面回应称，QoderWork、悟空、MuleRun现有产品服务未来将无缝升级，所有用户权益不会受影响。&nbsp;</p>\n  <p><strong>Meta将推出自有预测市场应用Arena</strong></p>\n  <p>Meta曾就收购预测市场公司Kalshi进行过谈判，但最终决定自行开发名为Arena的预测市场应用，采用虚拟货币而非真实资金下注。据透露，Meta首席执行官马克·扎克伯格去年在Kalshi人气飙升时会见了该公司CEO塔雷克·曼苏尔，讨论可能的收购事宜，但谈判未能推进。关于谈判破裂的原因存在不同说法，有消息称曼苏尔不愿出售，也有说法称Meta认为Kalshi面临的法律和伦理问题过于复杂。（新浪财经）&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>理想“动刀”产品部：拆分整车和智驾产品，并入研发</strong></p>\n  <p>36氪从多位知情人士处获悉，理想即将围绕产品决策流程进行新一轮组织架构调整，计划将产品部的部分关键职能拆分，并入研发部门。从群组关系来看，理想汽车产品部由范皓宇负责，包含电动本体、空间智能、自动驾驶终端产品、交互设计、平台运营、App与官网等。了解调整动向的人士向36氪透露，目前调整主要针对电动本体和自动驾驶等核心产品定义团队，其中已经明确的是，产品部的电动本体定义团队，拆分并入刘立国带领的整车研发部门；自动驾驶终端产品团队将并进詹锟带领的基座模型研发团队。“可能也有一部分体验相关的产品人员进入刘杰的产品线。”一位知情人士说道。</p>\n  <p><strong>美光CEO再次暗讽苹果：低价采购是造成内存短缺的关键</strong></p>\n  <p>美光科技首席执行官最新表示，过去几年里，一些客户要求内存制造商降低价格，从而带来了一些负面影响。2023年美光的价格降到了原来的1/3，导致无力投资新的产能。美光的这番暗讽被普遍认为是针对其大客户苹果发出的，尽管他并未直接提及苹果的名字。美光与苹果之间的对峙，代表着内存公司与消费电子制造商的市场平衡因人工智能发展而改变。（新浪财经）</p>\n  <p><strong>马斯克两度否认SpaceX要造手机</strong></p>\n  <p>当地时间7月1日，有报道称SpaceX向一些投资者展示了一款类似于iPhone但“更纤薄”的原型机，该原型机将运行SpaceX的专有操作系统。知情人士表示，该设备还将采用SpaceX于2月份收购的xAI公司的AI技术，并使用高通公司的芯片。报道还显示，上述设备在公开展示前已向相关方进行过演示，但其设计在早期阶段，可能会有所修改。对此，马斯克予以否认，在社交平台发文称“完全不属实”。受上述消息带动，高通股价盘中一度跳涨超3%，股价短时站上190.99美元，但在马斯克回应后又下跌了1.55%，创下5月6日以来阶段新低。</p>\n  <p>SpaceX要造手机的消息并非首次传出。今年2月，曾有消息称SpaceX正考虑开发一款能够直接连接“星链”的移动设备。马斯克当时同样回应称，消息不实，SpaceX并未在开发手机。（界面新闻）</p>\n  <p><strong>苹果拟于今明两年推出至少五款新iPhone</strong></p>\n  <p>7月1日消息，据报道，苹果公司正计划在今年下半年至2027年上半年期间，发起一项雄心勃勃的iPhone新品发布计划，预计将推出至少五款新机型。尽管目前整个科技行业正面临供应链零部件短缺的困境，但苹果仍决定加大折叠屏手机的出货量，超出市场此前预期。报道称，苹果还计划于2027年上半年推出首款M7芯片，并发布第二代iPhone Air、入门版iPhone 18等产品。不过，由于内存和芯片供应紧张，部分产品发布时间仍可能调整。（界面新闻）</p>\n  <p><strong>张雪峰11岁女儿接手张雪峰公司股份</strong></p>\n  <p>7月2日消息，苏州研途教育科技有限公司近日发生工商变更，张雪峰（张子彪）退出，退出前任公司监事并持股约10.86%，退出后其所持股份由女儿张姩菡接手。公开信息显示，张姩菡，2015年6月出生，目前尚未成年。（界面新闻）</p>\n  <p><strong>腾讯QClaw负责人发长文宣布离职</strong></p>\n  <p>7月2日，腾讯AI助手QClaw产品负责人张舒昱在社交平台发文称，已于6月29日正式结束在腾讯的工作。她于2025年9月加入腾讯，在职约10个月，目前尚未透露下一站。关于张舒昱离职一事，记者向腾讯方面求证，截至发稿未获具体回应。（潇湘晨报）&nbsp;</p>\n  <p><strong>特朗普回应“利用职位牟利”：股市在涨，大家都在赚钱</strong></p>\n  <p>当地时间7月1日，特朗普回应了批评人士关于他“利用总统职位牟利”的指责，他说：“因为股市在上涨，大家都在赚钱。你有401（k）退休账户吗？大约上涨了85%左右。（你得说）谢谢您，特朗普总统。所以我们所有人都在赚钱。”他当天还对记者表示，“我不插手我的私事——我的钱由专人管理。嗯，在我当总统之前我就赚了很多钱，他们帮我投资，但我从不跟他们说话。我从来不——我甚至都不跟他们联系。”据了解，401（k）是美国最常见的企业养老金账户，账户资金通常投资于股票、基金等资产，因此股市上涨时，账户资产也可能随之增值。（中国新闻社、财联社）</p>\n  <p><strong>马斯克晒Optimus产线合照</strong></p>\n  <p>当地时间7月1日，马斯克发布了一张大合照，并配文称，在弗里蒙特工厂参观Optimus机器人生产线。这一言论可能代表着特斯拉的人形机器人Optimus正进入关键的量产阶段。特斯拉弗里蒙特工厂一直是该公司在美国的先锋制造中心，曾经用于生产特斯拉旗舰车型Model S轿车和Model X SUV，如今已成为该公司人形机器人生产线的所在地。（财联社AI daily）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_2318e6832c5a474dac4c52c059d693c7@5667365_oswg194047oswg1080oswg1389_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>安克创新港股上市首日破发</strong></p>\n  <p>7月2日，“充电宝一哥”安克创新（00668.HK）正式登陆港交所主板，完成A+H两地上市布局，但开盘瞬间即跌破99.32港元的发行价。截至午间休市，安克创新报94.05港元，跌5.31%，市值为548.23亿港元。午后，存储芯片概念持续下挫，兆易创新封跌停，成交超304亿元。记者拨打兆易创新投资者热线，对方工作人员回复：“公司目前生产经营一切正常，正值半年报披露窗口期，其他情况不便透露。”安克创新港股发行价对应A股收盘价折价约26%。其全球发售总量4663.28万股H股，配售结构采用9:1配比，90%股份投向国际机构认购，仅10%面向香港散户公开发售，同步设置15%超额配股权用于绿鞋稳定股价。（界面新闻、第一财经、财联社）&nbsp;</p>\n  <p><strong>6月赴日航班取消1488个</strong></p>\n  <p>航班管家DAST最新统计显示，6月共有25条中日航线取消全部航班。整个6月中国大陆赴日本共有1488个航班取消，取消率为37.5%。今年上半年TOP20通航国家中，韩泰日航班量位列前三，其中赴韩航班量超2019年水平，赴泰国、日本恢复率仅64.7%、53.5%。（界面新闻）</p>\n  <p><strong>“电子布大厂”富乔工业宣布涨价30%</strong></p>\n  <p>有市场消息称，由于制造成本上涨及市场供不应求，“电子布大厂”富乔工业近日向客户发出涨价通知，宣布旗下电子布产品价格上调15%至30%，新价格自2026年7月1日起执行。7月2日上午，记者致电富乔工业的核心经营主体富乔（东莞）玻纤有限公司进行了求证。该公司回应称，本轮调价已正式落地。其中，面向传统PCB、消费电子领域的普通E-glass电子布统一涨价30%；面向AI服务器、高速高频板等应用的低介电常数（Low DK2）电子布涨价15%。（上海证券报）</p>\n  <p><strong>LV起诉茉莉奶白，茉莉奶白被判赔1030万元</strong></p>\n  <p>7月2日消息，苏州市中院就路易威登马利蒂（Louis Vuitton Malletier，简称“LV”）诉茉莉奶白商标侵权案作出一审判决。法院认定，深圳市茉莉奶白餐饮管理有限公司及吴中经济开发区东侠饮品店侵害LV 7件四叶花卉图形注册商标专用权。茉莉奶白主体公司应在判决生效之日起10日内赔偿LV经济损失1000万元、维权合理开支30万元，合计1030万元。7月2日，记者致电茉莉奶白创始人张伯丞，其在电话中回复称，将上诉。记者在国家知识产权局商标检索发现，茉莉奶白申请的相关四叶花卉图形商标处于“驳回复审”或“无效”状态。（新黄河）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_132d202e40264398a5420ee46cab8aca@5667365_oswg161665oswg1080oswg1400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>北京君正：DRAM三季度价格会继续上调，四季度存在继续调价的可能性</strong></p>\n  <p>36氪获悉，北京君正近日接受机构调研时表示，DRAM涨价比较多，一季度国内客户开始调价二季度国内客户仍在继续涨价，同时海外客户也陆续开始调整价格，预计二季度收入和毛利率会继续增长;三季度价格会继续上调，四季度的价格政策要到三季度才能确定，不过目前看四季度供应仍然较为紧张，存在继续调价的可能性。随着客户用部分SRAM产品来代替DRAM方案，部分SRAM芯片二季度价格也有所上涨。NORFlash一、二季度都有涨价，涨价幅度总体来说比DRAM要小，NORFlash虽然产能也在趋紧，但比DRAM要好很多，一季度公司Flash产品线实现了很好的收入增长，其中销量的增长占比较大。三季度的价格是根据具体产品和具体客户情况确定的，不一定都会调价。由于公司存储芯片持续在涨价，预计各季度毛利率会环比有所增长。&nbsp;</p>\n  <p><strong>腾讯市值重回4万亿港元</strong></p>\n  <p>7月2日，腾讯控股股价涨超2%，市值重回4万亿港元。这是腾讯股价连续第三个交易日上涨。今年3月腾讯市值曾跌破5万亿港元，6月又跌破4万亿港元。（第一财经）</p>\n  <p><strong>SK海力士将于2029年在清州建成NAND闪存工厂</strong></p>\n  <p>SK海力士将在忠清南道清州新建一座大型NAND闪存晶圆厂，目标于2029年投入运营。包括该项目在内，SK集团计划在忠清地区总投资170万亿韩元，涵盖先进封装和人工智能数据中心领域，旨在打造全球AI枢纽。（新浪财经）</p>\n  <p><strong>雀巢称消费者因价格压力避开中等包装产品</strong></p>\n  <p>雀巢表示，在美国消费者专注于产品可负担性、购买者纷纷转向大包装或经济型包装而避开中等规格产品的背景下，该公司正努力控制价格。（新浪财经）</p>\n  <p><strong>知情人士辟谣一汽奥迪中方一把手换帅：不实消息</strong></p>\n  <p>据媒体报道，就一汽奥迪中方一把手被曝换帅的传言，一汽奥迪方面知情人士表示，不实消息，目前郭永锋仍为一汽奥迪销售有限责任公司执行副总经理。自2025年9月1日起，郭永锋开始担任一汽奥迪销售有限责任公司执行副总经理，全面负责一汽奥迪在华所有国产及进口车的销售、售后服务、网络及品牌营销工作。（财联社）</p>\n  <p><strong>全球人工智能数据中心面临极端高温威胁</strong></p>\n  <p>一家气候风险分析机构近日公布的研究数据称，目前全球数据中心高达79%的算力容量面临着各种突发气候灾害的威胁，包括洪水、极端大风及山火等，这些灾害可能导致运营中断、停机时间增加，并推高保险和维修成本。目前，各大科技企业也正意识到气候因素给人工智能数据中心运行带来的挑战，并探索解决方案。微软公司表示，正在通过选址、完善冗余系统和实时监控等手段，来管理极端高温和恶劣天气带来的风险。英伟达公司上周表示，其新型的人工智能服务器可以在最高45摄氏度的冷却液环境下运行。英伟达称，冷却液温度提高1摄氏度，就可以使冷却系统能耗降低约4%。（科创板日报）</p>\n  <p><strong>美股三大指数收盘涨跌不一，特斯拉跌超7%</strong></p>\n  <p><strong>36氪获悉，7月2日收盘，美股三大指数涨跌不一，道指涨1.14%，纳指跌0.8%，标普500指数平收。大型科技股涨跌不一，特斯拉跌超7%，Arm跌超6%，Meta跌超4%，英伟达跌超1%，谷歌小幅下跌；奈飞、苹果涨超4%，SpaceX涨超2%，微软涨超1%，亚马逊小幅上涨。热门中概股多数下跌，爱奇艺跌超4%，小鹏集团、蔚来、百度跌超3%，阿里巴巴、网易、B站、微博、理想汽车跌超1%；京东涨超1%。</strong></p>\n  <h2>上市进行时</h2>\n  <p><strong>胜达克半导体启动上市辅导</strong></p>\n  <p>36氪获悉，证监会官网显示，胜达克半导体科技（上海）股份有限公司已启动上市辅导，招商证券担任辅导机构。&nbsp;</p>\n  <p><strong>深圳宏芯宇电子股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳宏芯宇电子股份有限公司向港交所提交上市申请书。&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>快手：旗下视频生成大模型可灵AI落地近30亿美元融资</strong></p>\n  <p>快手在港交所公告，快手旗下领先的视频生成大模型可灵AI落地近30亿美元融资，投后估值有望达到180亿美元。此次融资，可灵AI创下全球视频大模型公司最大额融资纪录，标志着其独立商业化发展进程正式开启。本轮融资由CPE源峰、国方创投、BlueFive、腾讯、中关村科学城基金（联合国科投资）、中信证券联合领投，以及数十家一线机构共同参与。据悉，该轮融资汇聚阿里云、百度等顶级产业资本，华策影视和芒果产业投资人（厚为资本）等头部文娱产业方积极参与。（财联社）&nbsp;</p>\n  <p><strong>“乐享科技”完成近5亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，“乐享科技”今日正式官宣完成近5亿元Pre-A轮融资。至此，乐享科技成立仅一年半，累计融资总额已达10亿元人民币。本轮融资由蚂蚁集团领投，产业方吉利资本、三七互娱，元禾璞华跟投，老股东 Monolith持续超额跟投，投资者汇集了顶级战投方、产业投资人与市场化基金。本轮融资资金将重点用于六项核心技术自研、人才引入、全球化市场渠道拓展等。</p>\n  <p><strong>德国无人机制造商Quantum Systems获得12亿美元融资</strong></p>\n  <p>德国国防科技公司Quantum Systems周四表示，已筹集12亿美元新资金，这使这家无人机制造商的估值达到约80亿美元，这也是迄今为止欧洲国防科技公司获得的最大规模私募融资之一。这一估值较一年前高出约八倍。这家总部位于慕尼黑的公司表示，本轮融资得到了国际投资者的支持。（新浪财经）</p>\n  <p><strong>“高云半导体”完成数亿元Pre-IPO轮融资</strong></p>\n  <p>36氪获悉，“高云半导体”宣布完成Pre-IPO轮融资交割落地。本次融资总规模达数亿元。本次Pre-IPO轮融资由广开基金、广州工控资本、越秀产业基金、广州金控基金、知识城创投、国创集团（大湾区国创中心资产管理平台）、番禺产投等本地国资共同参与。同时，本次成功引入多家产业资本，包括恒旭资本、仁发投资、梁溪科创产业二期母基金（博华产投管理），以及专业科技投资机构朗姿韩亚、景祥资本、中广创投等。</p>\n  <p><strong>“灵珠”完成天使轮融资</strong></p>\n  <p>36氪获悉，AI创作平台“灵珠”近日完成了天使轮融资，由TikTok天使投资人韦海军领投。</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>海尔的Agent OS，已经开始进入研发、采购、生产、客服等核心业务场景。&nbsp;</p>\n  <p>&nbsp;</p>\n  <p><strong>“零食消费”小调查</strong></p>\n  <p>明明没吃多少，零食账单却越来越长。这届年轻人，怎么越来越嘴馋了？&nbsp;</p>\n  <p>零食在年轻人生活中的地位似乎日渐重要。加班到九点，要靠一包“高蛋白肉干”撑到回家；下午路过便利店，顺手就拿一盒冷藏甜品、几颗现制卤味犒劳自己；周末，逛量贩零食店大采购成了日常解压方式——零食，悄悄占据了打工人的生活，成了忙碌日常中的“隐藏刚需”。&nbsp;</p>\n  <p>你买零食时，会因为“高蛋白、0糖、低卡”这些标签多拿一包吗？你多久会试一次没吃过的网红新品？你曾用零食代替过一顿正餐吗？在你心里，零食算一时嘴馋，还是一日续命？欢迎填写「零食消费小调查」，聊聊你心里最想推荐给大家的那款零食~&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_20ba7d60512a4b4d8249b0ae493e42ff@5667365_oswg20714oswg512oswg512_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“零食消费”小调查</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-03T00:06:38+00:00", "fetched_at": "2026-07-03T02:32:59.765639+00:00", "fingerprint": "eb0c2654de447f4a"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 省级实验室团队做电氢耦合解决方案，获厦门高新投领投", "url": "https://36kr.com/p/3879274157928449?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，厦门启航氢能技术有限公司（以下简称“启航氢能”）近日完成新一轮融资，本轮由厦门高新投领投，融资资金将主要用于电氢耦合关键装备及离网制氢相关核心技术的持续研发投入与产品迭代升级。</p>\n  <p>启航氢能成立于2024年4月，<strong>技术起源于嘉庚创新实验室电氢耦合研究团队。</strong>公司专注于电氢耦合技术及应用场景的装备研发、生产与销售，核心团队在电力电子技术、智能电网与电化学等领域拥有近20年研究积累。嘉庚创新实验室是福建省政府设立的省级高水平科研平台之一，其氢能产业集群由实验室主任郑南峰院士、氢能研究院方晓亮院长牵头布局。</p>\n  <p>氢能在新型能源体系中承担着连接电力系统与终端用能的关键角色，尤其在风光等波动性可再生能源大规模接入背景下，如何实现高效、稳定的电力转化与消纳，成为产业落地的核心问题。其中，“<strong>电氢耦合”是决定绿氢效率与成本的关键环节，</strong>通过更精细的电源控制、更智能的系统级调度与离网制氢/微电网制氢架构设计，电氢深度耦合相关技术可以显著提升绿氢系统的稳定性与经济性。</p>\n  <p>区别于传统电源大厂仅提供通用型电源的路径，启航氢能基于对电化学特性的深刻理解，开发出了更加适配电解槽的智能电源系统。通过独家控制算法，更好地解决了电解槽冷启动电流冲击、运行期谐波损伤及老化期内阻补偿等全生命周期痛点。</p>\n  <p>目前，<strong>公司已完成IGBT制氢电源、离网制氢/微电网制氢解决方案及燃料电池逆变器三大产品系列的研发，构建起较为完整的电氢耦合核心电气产品矩阵。</strong></p>\n  <p>其中制氢电源产品覆盖液冷与风冷两种技术路线，功率范围从30kW延伸至20MW，并包括针对PEM电解槽的专用电源及光伏直驱制氢方案，可适配6–4000标方制氢规模场景。同时公司已启动下一代更高效率更低成本制氢电源的预研工作。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260703/v2_d65587b6160049309e342b0f083fb440@5920579_oswg147836oswg675oswg592_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在制氢微电网方面，公司可提供200kW–50MW级系统级解决方案，通过1500V直流或10~35kV交流中压架构实现中远距离电能传输与组网，并形成标准化模块化方案以支持快速部署。</p>\n  <p><strong>启航氢能定位为第三方氢能电气装备与系统解决方案供应商，不生产电解槽，而是面向电解槽厂商与终端能源业主提供配套能力。目前公司已先后合作超过50家电解槽企业，覆盖国内主流厂商的多数参与者，同时布局国内大客户及海外市场。</strong></p>\n  <p><strong>以下为硬氪与启航氢能CTO魏闻的交流节选：</strong></p>\n  <p><strong>硬氪：国内制氢电源赛道已有英特利、阳光电源等玩家，IGBT制氢电源也有多家在布局。请问启航氢能的“不可替代性”体现在哪里？</strong></p>\n  <p><strong>魏闻：</strong>我们的优势主要体现在三个层面。第一是工程化能力和产品对标能力。团队本身来自产业一线，具有十余年超大功率电力电子设备开发经验，在工程实现上积累比较扎实。我们对标的目标非常明确，就是世界顶级平台。在核心产品方面，目前我们已经能够做到和世界顶级公司的产品处于同一技术水平线，而不是停留在实验室阶段。</p>\n  <p>第二是对电解槽材料机理的研究及对前沿方向的延展能力。厦门大学及嘉庚创新实验室拥有世界级的电化学研究团队和实验支撑平台，足以支撑我们通过跨学科交叉融合，把学术界的最新研究和方法论引入研发体系中；跳出单一的电力电子视角研究制氢电源，而是建立起覆盖电解槽材料机理、整槽特性、离网制氢以及系统级解决方案的整体研究路线图，立志打造“更懂电解槽的制氢电源与电氢耦合解决方案”，从根本上推动行业技术演进。</p>\n  <p>第三是产品迭代速度。我们的组织机制相对灵活，能够更快完成从研发到产品化的闭环，且便于联合行业大客户开展定制化设计。行业里一代产品的开发周期通常在三年左右，我们内部的目标是压缩到一年半，最长不超过两年，比行业主流厂商提前一年以上推出新产品。因此，我们不是只追求技术不落后，而是逐步通过节奏优势形成产品和技术的领先。</p>", "category": "tech", "published_at": "2026-07-03T02:02:30+00:00", "fetched_at": "2026-07-03T02:32:59.765631+00:00", "fingerprint": "e8b3bba48b17551b"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 获宁德时代旗下基金领投数千万美元，智能出行公司上市首月已成印尼电摩品类订单第一", "url": "https://36kr.com/p/3877990989819909?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，智能两轮出行企业「OMOWAY」（目蔚科技）近期连续完成A轮和A+轮融资，单轮融资金额均为数千万美元。其中，A+轮由宁德时代支持设立的美元基金Lochpine Capital领投，A轮由Monolith领投，中金资本旗下基金及老股东真格基金跟投。</p>\n  <p>成立不到两年时间，OMOWAY已获得数轮融资。截至目前，其股东阵容包含红杉、真格、Monolith、中金等头部财务投资机构，还包括Lochpine Capital、星航资本（小鹏系基金）、惠友资本（比亚迪联创设立）等新能源产业投资方。</p>\n  <p>得益于充足资金和产业资源的支持，OMOWAY产品在全球市场的商业化落地也在咋加速。今年6月，OMOWAY首款旗舰产品OMO-X正式开启全球首发交付，首站落地印尼。</p>\n  <p>硬氪了解到，上市首月，OMO-X便登顶印尼全国电摩品类订单量第一。</p>\n  <p>长期以来，全球摩托车市场主要被日系燃油品牌主导，且行业普遍面临“高端智能产品溢价过高、普惠产品缺乏科技感”的痛点。OMOWAY的快速破局，则凭借智能化驱动带来的降维体验，打破当地传统出行产品的固有格局。</p>\n  <p>具体到产品层面，在智能化与硬件配置上，OMO-X全系标配数字钥匙、自动边撑和远程控车等功能，并搭载了摩托车行业少见的10.25英寸汽车级智能交互大屏，而行业主流屏幕在5-7英寸左右；此外，同时，车辆采用了常见于豪华汽车的自研双叉臂后连杆悬挂结构，有效提升操控稳定性和骑行舒适感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_fa6b125ee79c453f9932c2e78ffe3617@5836910_oswg487705oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在产品布局上，OMO-X Smart（智能版）聚焦智能化出行体验，通过数字化交互与智能生态连接，让骑行更加便捷高效；而其推出的OMO-X Balance（自平衡版）是全球首台量产落地的自平衡摩托车，OMOWAY团队针对摩托车“易倒、难扶”的痛点问题，通过引入源自航天领域的陀螺仪稳定技术，标配低速平衡辅助，大幅提升骑行稳定性。</p>\n  <p>为了适应复杂的真实路况，OMOWAY为OMO-X研发了强化学习模型。在云端仿真环境中，系统通过海量数据训练，优化了电机输出与陀螺仪扭矩的协同逻辑。在行驶安全方面，OMO X搭载了由双前视摄像头与四个鱼眼摄像头组成的360°全景视觉方案。在低速行驶过程中，面对湿滑路面、复杂弯道或潜在碰撞场景时，系统可通过预判风险，控制电机、转向与刹车系统提前介入，从而修正行驶姿态，提供主动安全防护。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_2b125ab79e674ccdb18de40abfb64b36@5836910_oswg179806oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>OMO-X各项动态能力的底层支撑，是OMOWAY自主研发的OMO-ROBOT通用技术架构。该架构将人工智能、机器人技术与车辆工程深度融合，涵盖了感知、决策、执行与信息传递的全链路闭环。在这一技术架构基础上，OMOWAY推出100%全自研的轮式机器人Mobility One，今年内有望发布原型。</p>\n  <p>以底层的技术架构为驱动，OMOWAY正加速其全球市场的版图拓展。作为出海首站，OMOWAY目前在印尼已铺设数十家经销商网络，全面覆盖雅加达、万隆、泗水及巴厘岛等核心区域。</p>\n  <p>未来，OMOWAY还将陆续进军泰国、新加坡以及欧洲市场。公司计划以智能两轮出行为起点，逐步向即时配送、、公共服务、家庭等多场景延伸，推动交通工具向智能伙伴进化，让高智能的产品体验进入每个家庭。</p>", "category": "tech", "published_at": "2026-07-03T02:26:11+00:00", "fetched_at": "2026-07-03T02:32:59.765618+00:00", "fingerprint": "7bc353d6e12cfa3d"}, {"source": "少数派", "title": "家用游戏机的新选择，Steam Machine 玩起来怎么样？", "url": "https://sspai.com/post/111763", "summary": "本文由IGN中国编译自IGNUS相关内容，原作者JacquelineThomas、编译者Tony，少数派经IGN中国授权转载，仅对文章格式略作调整。阅读原文>在经历八个月的等待之后，SteamMach ...<a href=\"https://sspai.com/post/111763\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T04:16:09+00:00", "fetched_at": "2026-07-03T02:32:58.221060+00:00", "fingerprint": "0760d825ec428276"}, {"source": "少数派", "title": "共创试读 | 给童年一份礼物：从是什么到为什么，找到合适的掌机", "url": "https://sspai.com/post/111069", "summary": "近年来，伴随着复古浪潮的席卷而来，许多玩家似乎又重新关注起了一些老游戏、老设备。从2022年的3DS涨价风波，到后来层出不穷的所谓「开源掌机」，大家似乎都在寻找一个通往童年的入口，重新回味那些历久弥新 ...<a href=\"https://sspai.com/post/111069\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T07:00:00+00:00", "fetched_at": "2026-07-03T02:32:58.221055+00:00", "fingerprint": "cf4aefe814bc76ec"}, {"source": "少数派", "title": "iOS 剪贴板管理工具 Procut：换个方式收藏碎片化信息", "url": "https://sspai.com/post/110950", "summary": "你一定有过这样的经历：在小红书刷到一篇感兴趣的笔记，复制链接想稍后再看，结果淹没在聊天记录里再也找不到了。微信群里有人分享了一个公众号文章，随手复制了链接，等真正有空时却想不起存到了哪里。收到快递取件 ...<a href=\"https://sspai.com/post/110950\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-0 nly a negative for gamers. We're losing the ability to [&#8230;]", "category": "tech", "published_at": "2026-07-01T22:03:37+00:00", "fetched_at": "2026-07-02T02:50:21.291805+00:00", "fingerprint": "375adf50591c34a1"}, {"source": "The Verge", "title": "Apple’s entry-level MacBook Pro could be up for a redesign", "url": "https://www.theverge.com/news/960541/apple-macbook-pro-entry-level-redesign-ipad-pro-update", "summary": "Apple is working on a \"revamped\" version of its entry-level MacBook Pro that it could launch as soon as the first half of 2027, Bloomberg reports. The company is also testing four new iPad Pros that are set to launch in the spring with a focus on \"internal improvements.\" The updated MacBook Pro, which will [&#8230;]", "category": "tech", "published_at": "2026-07-01T22:39:43+00:00", "fetched_at": "2026-07-02T02:50:21.291796+00:00", "fingerprint": "2969aefe0d543f31"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宾利低至27万，二手豪华燃油车价格大跳水；Anthropic回应暗藏代码检测中国用户；寒武纪市值一日蒸发700亿", "url": "https://36kr.com/p/3877746956611847?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>OpenAI据悉迎来重大技术突破：系统优化使模型推理成本减半</p>\n  <p>苹果首次上架iPhone16e官翻机，仅有黑色与白色可选</p>\n  <p>国内航线燃油附加费7月5日起大幅下调</p>\n  <p>巴菲特“断供”盖茨基金会</p>\n  <p>董明珠喊话股东：家电不换成格力，凭什么要分红</p>\n  <p><strong>詹姆斯发文告别湖人</strong></p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>二手豪华燃油车价格大跳水：宾利近27万、保时捷15万</strong></p>\n  <p>7月1日，在青岛市的陆海汽车交易市场，二手车商在售8年以上车龄的宾利飞驰挂牌价仅26.8万元，入门保时捷Macan则低至15万元，新车近90万元的大众途锐二手成交价6.8万元。此外，奔驰、路虎多款中大型豪华SUV同步出现大幅跳水，昔日百万级豪车如今跌至家用车价位区间。报道提及，青岛宝驰名车负责人刘青松表示，过去二手豪华燃油车全年折旧幅度普遍不超过30%，但今年5月单月折旧幅度就达到30%。</p>\n  <p>汽车之家最新信息则显示，宾利飞驰2012款6.0T限量版价格为35.8万，该车原价高达562万；奔驰G级2004款G 500报价33.8万，新车含税价则要150.34万。而像奥迪2013款A8L 50 TFSI quattro尊贵型报价跌至8.88万，新车含税价为148.17万。（山东半岛新闻）</p>\n  <p><strong>Anthropic回应Claude Code暗藏代码检测中国用户：将在更新中删除</strong></p>\n  <p>用户逆向分析发现，Claude Code自今年4月起内置了针对中国时区及147个特定域名的检测机制，并将检测结果以隐蔽方式编码在请求中。Anthropic团队回应称这是为防止账户转售和模型蒸馏攻击的实验性措施，并计划在新版本中删除。（IT之家）</p>\n  <p><strong>寒武纪大跌超7%，市值一日蒸发700亿</strong></p>\n  <p>6月30日，寒武纪股价盘中突破1600元，总市值跨过一万亿人民币的门槛。这是科创板开板七年来，第一只万亿市值的股票。30日晚，寒武纪发布公告称，公司股票价格近期累计涨幅较大，可能存在短期上涨过快出现的下跌风险。截至公告披露日，公司日常经营情况正常，不存在其他应披露而未披露的重大信息。7月1日，寒武纪股价遭遇重挫。截至发稿，寒武纪下跌7.07%，报1482.90元/股，总市值回落至约9315亿元。与前一日万亿市值高点相比，单日市值蒸发近700亿元。(每日经济新闻)</p>\n  <h2>AI最前沿</h2>\n  <p><strong>亚马逊豪掷68亿元加码AI</strong></p>\n  <p>当地时间6月30日，美国科技巨头亚马逊公司旗下的云计算服务平台亚马逊云科技宣布，将投入10亿美元（约合68亿元人民币）设立全新的人工智能部门，专门协助客户搭建并落地人工智能系统。亚马逊云科技方面表示，预计将配置数千名前线部署工程师，相关团队将与客户业务、研发、安全部门深度协作，仅需数周，就能帮助客户搭建可自主运维的技术团队，交付完整AI解决方案。外媒报道称，亚马逊云科技是全球营收规模第一的云服务商，也是首家推出该类驻场工程师专项业务的超大规模云厂商。（央视财经）&nbsp;</p>\n  <p><strong>Anthropic：Fable 5将于美国时间7月1日在Claude平台全球上线</strong></p>\n  <p>Anthropic称，Fable 5将于美国时间7月1日在Claude平台全球上线。将继续与美国政府协调，扩大“Glasswing”计划下Mythos5模型的开放范围，使更多美国国内及国际合作伙伴能够获得使用权限。将尽快在AWS、谷歌云和微软Foundry上重新启用Fable5访问。Pro、Max、Team和Select Enterprise用户可访问Fable 5，使用量在每周最高限制为50%，有效期至7月7日。（财联社）</p>\n  <p><strong>OpenAI据悉迎来重大技术突破：系统优化使模型推理成本减半</strong></p>\n  <p>6月30日，据报道，OpenAI工程师在内部透露，公司已通过一系列全新的系统底层优化，成功将AI模型的推理（运行）成本降低了50%以上。（界面新闻）&nbsp;</p>\n  <p><strong>Anthropic Claude模型正式登陆Microsoft Foundry</strong></p>\n  <p>Anthropic当地时间6月29日宣布，Claude模型即日起正式在Microsoft Foundry（Azure AI Foundry）全面可用，企业用户可直接在Azure环境中部署和调用Claude模型，并沿用现有Azure身份认证、计费及治理体系。目前支持Claude Opus 4.8和Claude Haiku 4.5，涵盖提示缓存（Prompt Caching）、扩展思考（Extended Thinking）等能力，可用于编程、智能代理及复杂推理等场景。Anthropic表示，用户还可根据需求选择推理运行于Azure或Anthropic托管环境，未来双方将逐步实现功能和模型的一致性。（界面新闻）</p>\n  <p><strong>Meta被曝将向外部客户销售过剩AI算力资源</strong></p>\n  <p>有媒体称Meta正在制定一项云基础设施业务计划，将销售AI计算能力和模型的访问权限，从而与亚马逊网络服务(AWS)、微软和谷歌云等行业巨头展开新的竞争。据知情人士透露，Meta一直在加紧获取昂贵的数据中心和其他基础设施，以支持其自身的人工智能发展。目前，该公司正在组建一项新业务，通过向外部客户销售过剩的计算能力来产生收入。（新浪财经）&nbsp;</p>\n  <p><strong>“大空头”迈克尔·伯里又向AI宣战</strong></p>\n  <p>在全球投资者仍沉浸在人工智能（AI）引领的牛市狂欢中时，“大空头”原型迈克尔·伯里（Michael Burry）在6月30日，再次充当了那个冷酷的“吹哨者”。伯里的枪口不仅重新对准了英伟达、特斯拉等AI风口浪尖上的科技巨头，甚至连卖推土机和挖掘机的传统工业老大哥——卡特彼勒，也赫然出现在了他的做空名单之首。这位曾精准预测2008年次贷危机的传奇投资者在周二的一篇SubStack帖子中写道，他以1060.98美元的价格做空了卡特彼勒股票，同时还对英伟达、应用材料、特斯拉以及iShares半导体ETF(SOXX)建立了新的空头头寸，以此为他所认为的AI相关股票日益过度上涨的行情修正做好准备。（第一财经）&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>传小红书启动秘密项目，目标再造一款小红书级别的新产品，公司暂无回应</strong></p>\n  <p>6月30日晚间消息，有消息称，小红书在近期内部启动达尔文（darwin）的创业孵化项目，面向公司内部员工开放报名通道。根据爆料内容，员工成功入选后将以脱产形式参与项目孵化，全程由公司L3级别核心高管亲自带队指导，同时可对接平台内部海量资源支持，传闻项目核心目标是再造一款小红书级别的新产品。对内部员工而言，若孵化项目成功落地，核心参与人员有望直接出任产品负责人，职级至少从L1起步。对此消息，向小红书官方进行求证，截至发稿暂无回应。（新浪科技）</p>\n  <p><strong>苹果首次上架iPhone16e官翻机，仅有黑色与白色可选</strong></p>\n  <p>7月1日消息，MacRumors发现，苹果美国官方翻新商店于当地时间6月30日更新了产品阵容，正式上架iPhone 16e官翻机型。这是该机型自2025年2月发布以来，首次以官方翻新的形式出现在苹果官方渠道中。今年3月，随着新一代iPhone 17e的推出，iPhone 16e已从苹果官网下架停产，消费者无法再从官方渠道购买全新机。此次上架的官翻机，也就成了从苹果官方渠道购入这款机型的唯一途径。（IT之家）</p>\n  <p><strong>国内航线燃油附加费7月5日起大幅下调</strong></p>\n  <p>九元航空7月1日发布通知，自2026年7月5日（出票日期）起，下调国内航线燃油附加费。其中800公里以上航线每位旅客收取100元，800公里（含）以下航线每位旅客收取50元。相较于调整前分别降低50元/30元。今年四月和五月，国内燃油附加费连续大幅上调，6月5日开始下调20元/10元，随着燃油价格的下滑，7月的燃油附加费下调幅度更大。（第一财经）</p>\n  <p><strong>特朗普家族因加密货币获利超10亿美元</strong></p>\n  <p>据美国媒体当地时间6月30日报告，美国总统特朗普提交给美国政府道德办公室的2025年度财务报告显示，去年特朗普家族的加密货币业务为其带来了超过10亿美元的收入。据披露的财务文件显示，特朗普家族的加密企业“世界自由金融公司”通过销售新型加密产品获得了逾5亿美元收入；另有约6.35亿美元来自其个人迷因币（Meme币）$TRUMP的销售。</p>\n  <p>对于这次美国媒体披露出来的财务报告内容，白宫方面强调“不存在利益冲突”。白宫方面在一份给媒体的声明中称，特朗普及其家人“从未卷入——也绝对不会卷入——任何利益冲突”。（CCTV国际时讯）</p>\n  <p><strong>巴菲特“断供”盖茨基金会</strong></p>\n  <p>据知情人士透露，美国知名投资人沃伦·巴菲特20年来首次暂缓向比尔及梅琳达·盖茨基金会进行年度捐赠，将等该基金会与美国已故富商杰弗里·爱泼斯坦一案关联的审查结果公布后再作定夺。美国《华尔街日报》6月29日援引知情人士的话报道，按照巴菲特此前向盖茨基金会许下的一项终身承诺，巴菲特每年6月或7月初都会向盖茨基金会捐赠旗下投资机构伯克希尔-哈撒韦公司股票，但今年首次中断了这一惯例。（第一财经）</p>\n  <p><strong>牧原让员工学董事长《拜猪文》被指职场PUA，公司回应：未要求员工无底线牺牲</strong></p>\n  <p>7月1日消息，近日有网友爆料，牧原股份企业文化宣传中出现一篇名为《拜猪文》的文章，文中提到“我们也愿意像猪一样淡然地奉献出我们的一切”等。有不少网友提出质疑，认为该内容画风怪异，疑似变相PUA。据了解，《拜猪文》为牧原股份董事长秦英林所作。秦英林对此阐释称：“我们的事业是养猪，实则是猪养活着我们。尊重猪就是尊重自己，崇拜猪就是崇拜自己。”</p>\n  <p>针对此次舆论争议，牧原股份回复称，《拜猪文》由公司创始团队创作于2012年，是团队深耕养猪行业20年的实践总结与行业感悟。该内容纳入企业文化培训，核心目的是引导员工敬畏生命、尊重行业事业、坚守价值创造、践行社会责任，并无刻意洗脑、精神控制员工，或是要求员工无底线奉献牺牲的导向。（湖北日报）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_51a16351b838490881ad9c0ef74de0ef@5667365_oswg806873oswg1080oswg1549_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>董明珠喊话股东：家电不换成格力，凭什么要分红</strong></p>\n  <p>6月30日，珠海格力股东大会现场，董明珠在表示，股东若要获得稳定分红，需依靠8万员工与渠道商的共同努力。她建议股东在获得分红后，将家中空调及其他家电都更换为格力产品。面对创下历年新高的四百余名到场股东，董明珠直白喊话，“家电不改为格力，凭什么分红？”此番言论随即引发广泛关注。据报道，2025年，格力电器(37.460, -0.04, -0.11%)的营业收入为1704亿元，归母净利润为290亿元，均同比下跌约9.8%，市场背景是去年空调市场整体增长承压。（观察者网）</p>\n  <p><strong>小米高层大调整：小米中国区总裁王晓雁不再兼任销售运营一部总经理，陈幕楠接任</strong></p>\n  <p>新浪科技获悉，小米中国区近日迎来人事调整，涉及汽车销交服部、销售运营一部、电商部、新零售部等多个部门。其中，任命樊家麟担任汽车销交服部下辖的销售运营部代理总经理，向汽车销交服部总经理夏志国汇报。任命陈幕楠担任销售运营一部总经理，向集团高级副总裁、中国区总裁王晓雁汇报。任命新零售部总经理张健兼任小米之家总经理，原小米之家总经理陈恺则担任电商部总经理，向集团高级副总裁、中国区总裁王晓雁汇报。在2025年12月的上一轮中国区大调整中，小米集团高级副总裁、中国区总裁王晓雁兼任销售运营一部总经理，被外界解读为亲自下场抓业绩。对比此次调整，他不再兼任销售运营一部总经理一职。（新浪科技）</p>\n  <p><strong>美联储主席：当前美国通胀水平仍然过高</strong></p>\n  <p>美国联邦储备委员会主席凯文·沃什7月1日在葡萄牙举行的欧洲央行中央银行论坛上表示，当前美国通胀水平仍然过高，同时重申美联储工作的优先事项是确保物价稳定。沃什说，美联储将“开辟一条新的政策路径”，但并未进一步加以说明，同时回避了有关7月货币政策会议是否加息的问题，强调不会对未来利率政策给出前瞻性指引。沃什表示，美联储正设立独立工作组，围绕货币政策沟通、经济数据体系、生产率、通胀框架以及资产负债表政策等课题展开研究。（央视新闻）</p>\n  <p><strong>美公布6亿美元月球任务计划，推进月球基地建设</strong></p>\n  <p>美国航空航天局30日公布月球基地建设项目最新安排，表示已与三家美国企业签订总额近6亿美元合同，将于2028年底执行4项新的月球登陆任务。（财联社）</p>\n  <p><strong>詹姆斯发文告别湖人</strong></p>\n  <p>北京时间7月1日凌晨，据美国媒体报道，NBA巨星勒布朗·詹姆斯已告知湖人他将在下赛季继续自己的职业生涯，但将离开湖人，前往其他球队效力。报道援引詹姆斯经纪人里奇·保罗的话说，詹姆斯已告知湖人队，球队可以按照自身规划推进后续工作，因为他将在新赛季加盟其他球队。现年41岁的詹姆斯将迎来个人第24个NBA赛季。2003年，他以状元秀身份进入NBA，职业生涯先后效力于骑士队、热火队和湖人队。他是NBA历史得分王，曾4次获得NBA总冠军、4次荣膺常规赛最有价值球员（MVP）。（第一财经）</p>\n  <p><strong>微软计划进行新一轮裁员，将影响数千个岗位</strong></p>\n  <p>7月1日，据报道，有知情人士透露，微软计划很快宣布新一轮裁员。这些知情人士称，此次裁员将影响数千个岗位，包括销售和咨询部门，以及Xbox游戏部门的职位。知情人士补充说，本轮裁员规模将小于去年的类似裁员，此次裁员幅度将不到公司22万名员工总数的2.5%。据其中一位知情人士透露，微软计划于下周宣布裁员消息，但具体时间可能有所变动。部分受影响的员工将立即获得新的岗位安排。（界面新闻）</p>\n  <p><strong>特斯拉：首台量产无人驾驶电动车Cybercab已开启工程测试</strong></p>\n  <p>36氪获悉，据特斯拉消息，首台量产赛博无人驾驶电动车Cybercab已在美国得州奥斯汀开启工程测试。</p>\n  <p><strong>瑞典法院裁定谷歌须支付近15亿美元反垄断赔偿金</strong></p>\n  <p>据报道，瑞典斯德哥尔摩专利与市场法院7月1日裁定，谷歌须向瑞典金融科技公司Klarna旗下比价平台PriceRunner支付约143亿瑞典克朗（约合15亿美元）的反垄断赔偿金。PriceRunner于2022年向该法院起诉谷歌并索赔约21亿欧元，指控谷歌通过操纵搜索结果来优待其自身的购物比价服务，违反反垄断法。（界面新闻）</p>\n  <p><strong>A股交易新规将于7月6日起正式施行，主板ST股涨跌幅提至10%</strong></p>\n  <p>经过两个多月的市场技术与业务准备，A股交易新规将于2026年7月6日(下周一)起正式施行。新规优化基金收盘交易机制、扩展盘后固定价格交易方式适用品种、主板ST股涨跌幅提至10%。对于投资者而言，需要关注三方面:一是调整基金尾盘交易习惯，最后三分钟投资者仅可提交限价申报，且不可撤单，所有委托统一集合竞价撮合;二是盘后固定价格交易按照收盘价成交，无法自主定价，同时交易活跃程度与连续竞价有较大差异;三是审慎参与主板风险警示股票交易。(第一财经)</p>\n  <p><strong>欧盟气候监测机构发出警告</strong></p>\n  <p>1日，欧盟气候监测机构哥白尼气候变化服务局（C3S）和哥白尼海洋服务局（CMEMS）均表示，全球海面温度已超过2023年和2024年同期观测到的最高纪录。C3S的每日海面温度数据显示，今年6月21日的温度达到20.86摄氏度，超过了2023年和2024年同期观测到的20.83摄氏度。C3S和CMEMS认为，随着赤道太平洋地区厄尔尼诺现象的出现，加上近几个月多个海域观测到的异常高温，全球海面温度在此时期创下新纪录是在预料之中的。预计这一纪录将对天气模式、全球气候及海洋生态系统产生影响。（第一财经）</p>\n  <p><strong>三星、SK海力士、台积电，抢购电子级氢氟酸</strong></p>\n  <p>7月1日，业内传出，台积电、三星、SK海力士都在抢购电子级氢氟酸（HF）。报道称，今年以来中东地缘政治紧张推升硫磺、硫酸及无水氢氟酸价格，带动电子级氢氟酸成本垫高，部分供货商已陆续调涨售价，涨幅约二至三成。目前半导体最高规格的G5级电子级氢氟酸因技术门坎高，全球供给相对有限。台塑大金指出，若未来客户持续扩产，公司也拟持续跟进，目前氢氟酸单月获利，已与台塑旗下的电子级异丙醇（IPA）接近。（中国台湾经济日报）</p>\n  <p><strong>宣传视频被指“擦边”，绿源电动车回应</strong></p>\n  <p>近日，绿源电动车官方账号发布的宣传视频中模特穿高跟鞋、黑丝袜，镜头特写隐私部位。有网民表示，模特穿搭不符合现实场景，拍摄视角引人不适，质疑故意“擦边”。</p>\n  <p>7月1日，绿源电动车客服人员表示，账号运营由公司内部部门负责，已下架整改相关视频，后续会加强审核全渠道广告，并就给消费者带来不适体验表示抱歉。（新京报）</p>\n  <p><strong>韩国投资者上半年持续加仓A股</strong></p>\n  <p>2026年上半年，韩国投资者持续加码配置中国市场。韩国证券存托结算院(KSD)数据显示，在韩国投资者净买入金额居前的中国市场标的中，多只ETF强势挤进榜单前列，科技、人工智能、半导体、新能源等主题产品尤为受到追捧。A股市场中，韩国投资者净买入前20名中，有8只ETF产品，包括通信ETF华夏、芯片ETF华夏、人工智能ETF易方达、上证指数ETF富国、云计算ETF易方达、科创50ETF华夏、电网设备ETF华夏、机器人ETF华夏。个股方面，韩国资金重点投向人工智能、先进制造等成长领域。A股市场中，上半年被韩国资金买入最多的三一重工，获999.75万美元净买入；东山精密、宁德时代紧随其后，分别获558.20万美元、555.24万美元净买入；此外，亨通光电、麦格米特、云南锗业、长飞光纤等也获得韩国资金持续增持。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，SpaceX跌超7%</strong></p>\n  <p>36氪获悉，7月1日收盘，美股三大指数集体下跌，道指跌0.03%，纳指跌0.66%，标普500指数跌0.22%。大型科技股涨跌不一，SpaceX跌超7%，Arm跌超4%，英伟达跌超1%;Meta涨超8%，奈飞、微软涨超3%，谷歌、亚马逊、苹果、特斯拉涨超1%。热门中概股多数上涨，拼多多涨超8%，理想汽车涨超4%，百度、腾讯音乐、京东涨超3%，小鹏集团、微博、B站涨超2%，网易涨超1%;蔚来跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>优步投资的Lime据悉确定IPO发行价为25美元</strong></p>\n  <p>据知情人士透露，Neutron HoldingsInc.（更广为人知的名字是Lime）已将其首次公开募股（IPO）定价为每股25美元，处于此前公布的发行价区间中位。该公司在2020年由Uber牵头的投资轮次中估值达5.1亿美元。Lime最早于2021年考虑上市。（新浪财经）&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>自变量多轮融资后估值突破200亿元</strong></p>\n  <p>6月30日，自变量机器人宣布，公司在过去两个多月内连续完成B+、B++和C轮融资，投资方包括中国移动链长基金、红杉中国、IDG资本、源码资本、达晨财智、中金资本、中保投资等30多家机构，估值突破200亿元。自变量机器人也是大湾区率先达到200亿元估值并全部完成交割的具身智能企业。（每日经济新闻）</p>\n  <p><strong>“感知纪元”完成千万级天使轮融资</strong></p>\n  <p>36氪获悉，“感知纪元”近日完成千万级天使轮融资，本轮由松禾资本领衔投资。融资资金将主要用于中试产线搭建、核心产品迭代升级及团队扩充，加速推进多模态智能触觉电子皮肤从研发走向量产。</p>\n  <p><strong>“MobAl”完成数百万元天使轮融资</strong></p>\n  <p>36氪获悉，AI创业公司“MobAl\"已完成数百万元天使轮融资，由港股上市公司赤子城科技独家投资。目前，由MobAI开发的AI互动叙事应用LunaverseStories已进入邀请制测试阶段。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事。</strong></p>\n  <p>短剧爽文里无所不能的“金手指”可能不会一夜出现，但AI Agent从工具到专属超能搭档，从回答问题到完成任务，变化已经开始发生。正如世界杯期间联想推出的天禧AI短剧《我的AI搭档之“禧”从天降》里那句台词：把判断交给人，把任务交给天禧AI，把时间还给人生。&nbsp;</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-02T00:10:58+00:00", "fetched_at": "2026-07-02T02:50:21.117434+00:00", "fingerprint": "c69a9feed25a1315"}, {"source": "36氪 - 最新文章", "title": "专访美图 CEO 吴欣鸿：做 AI 产品，是一场难以提前策划的游戏", "url": "https://36kr.com/p/3877112973733895?f=rss", "summary": "<p><strong>访谈｜周鑫雨 兰杰</strong></p>\n  <p><strong>文｜周鑫雨</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>截至 6 月中旬，吴欣鸿 2026 年的飞行距离已经超过了 230000 km，飞行时长近 300 个小时。他的轨迹横跨亚洲、北美、欧洲、南美，到达最远的地方是巴西和阿根廷。</p>\n  <p>航线所经之地，是美图近三年来靠 AI 产品扩展的市场版图。</p>\n  <p>美图 2025 年财报显示，海外 MAU 时隔多年重新回到 1 亿，其中，AI 视频编辑工具 Wink 和影像创作 Agent RoboNeo 在东南亚、墨西哥、巴西等地增长迅速，频频登上&nbsp;iOS 下载榜第一。</p>\n  <p>随全球拓展水涨船高的还有利润。2025 年，美图的收入达到 38.58 亿元，净利润达 9.65 亿元，同比增长 64.7%。其中，<strong>经过&nbsp;AI&nbsp;重构的影像与设计产品，已经成为造血主力，收入占比从一年前的 35%，提升至 76.6%。</strong></p>\n  <p>几年前，美图尚在盈亏线上挣扎。面对 AI 汹涌的浪潮，<a href=\"https://mp.weixin.qq.com/s?__biz=MzkwMDQ2NDU2Nw==&amp;mid=2247485974&amp;idx=1&amp;sn=bf934bff3b68fb13048c46954d4f5835&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">吴欣鸿和《智能涌现》聊的是被冲击的“危机感”，直言自己“如履薄冰”</a>。</p>\n  <p>两年来，美图也做了不少应对 AI 时代的组织革新。吴欣鸿在 2000 多人的公司中，设立了一批小型 AI 创新工作室，为单个团队提供最高 1000 万元的AI创新资金，激励内部快速孵化 AI 产品。</p>\n  <p>并且，团队还花几个月时间搭建了影像产品中台和增长中台，目的就是将技术工程、冷启动、投流等管线，复用到不同产品中，缩短产品研发和验证周期。</p>\n  <p>“AI 时代，你必须快，才有机会赢。”吴欣鸿告诉我们。</p>\n  <p>为此，美图内部制定了相当严苛的产品考核机制：从立项、研发，到市场验证和上线，时间控制在 1 个月内；PMF（产品市场适配度）验证的标准是，上线半年内， ARR 必须达到 10 万美元。</p>\n  <p>以及，吴欣鸿还提出，<strong>拥有庞大用户基数的“美图秀秀”等老产品，禁止给新产品大力导流，</strong>这是为了考验新产品自然生长的能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_0c4c312a6a83439f95a5a5eef5cf0465@5783683_oswg135280oswg1080oswg450_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△ 2026 年“美图影像节发布的 4 款新产品，同时，4 款老产品完成了 AI 功能的迭代。图源：企业供图</p>\n  <p>2026 年“美图影像节”发布的 4 款 AI 新产品中，AI 人像修图工具 Picchi、影像工作流搭建平台 MeituHub 就是“自然生长”出的产品。</p>\n  <p>比如，Picchi 源自美图团队对“美图秀秀”用户高频使用行为的洞察。“用户每一次修图都是想修成理想中的自己，但每次都要重复修图很麻烦。有没有可能让用户上传过去修好的图给 AI 看，让 AI 自动学习用户的修图手法。”美图 CPO 小白提到。</p>\n  <p>而另外两款略显“小众”的产品，MV 生成工具 MVLAND 和 概念视频创作工具 Artflo，则源自吴欣鸿个人的热爱，以及对“非共识”领域的押注。</p>\n  <p>“成功产品，大多都从没有竞争的场景开始。”吴欣鸿告诉《智能涌现》。</p>\n  <p>关于对新兴市场的洞察，工具赛道的竞争，以及“热爱”驱动产品的方法论，近期《智能涌现》和美图公司创始人、董事长兼 CEO 吴欣鸿，以及美图公司 CPO 兼影像产品事业群总裁陈剑毅（花名“小白”）聊了聊。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_e6477264626841829720a47d97028c96@5783683_oswg88808oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△&nbsp;美图公司创始人、董事长兼 CEO 吴欣鸿（中）；美图公司 CPO 兼影像产品事业群总裁陈剑毅（花名“小白”，左二）。图源：企业供图</p>\n  <p>以下是对交流的整理，内容略经编辑：</p>\n  <h2><strong>自然生长出来的产品，生命力更强</strong></h2>\n  <p><strong>智能涌现</strong>：今年影像赛道的竞争更激烈了吗？</p>\n  <p><strong>吴欣鸿</strong>：很长时间里，影像工具不被 VC、大厂和创业者关注，因为很难变现。</p>\n  <p>如今影像产品出现了商业化效应。因为影像有着非常丰富的生产力场景，图像、视频、3D 等等都在范畴内，非常多的行业都有影像的需求，但影像是一个非常分散的赛道，加上进入的人也越来越多，很难出现一家独大的情况。</p>\n  <p>我们现在就是在抢时间。</p>\n  <p><strong>智能涌现</strong>：为什么以前影像产品变现难？</p>\n  <p><strong>吴欣鸿</strong>：订阅模式普及之前，很多工具产品只能靠广告。广告模式的问题在于，一是变现效率不高，尤其是品牌广告，你需要组建专业团队服务客户；二是广告投放和用户体验是相悖的。</p>\n  <p><strong>智能涌现</strong>：影像赛道很分散，你们怎么选择先切入哪些场景？比如新发布的 MVLAND，背后是个很细分的赛道。</p>\n  <p><strong>吴欣鸿</strong>：说到这个，很多年前我就买下了一个域名：mv.com，未来可能会成为 MVLAND 的网址。</p>\n  <p><strong>智能涌现</strong>：很多年前你就想做 MV 相关的产品？</p>\n  <p><strong>吴欣鸿</strong>：我是一个美术生，从小学画画，所以我对具有艺术性的东西都很感兴趣。我一直以来思考的都是怎么用产品去结合我的爱好，以及我对影像和视觉比较长期的积累。</p>\n  <p>除了 MVLAND，今年发布的 Artflo，也是出于我的爱好。很难想象，中国有其他公司会去做一个把灵感转化成作品的产品，因为看上去没有市场。</p>\n  <p><strong>智能涌现</strong>：那它能赚到钱吗？</p>\n  <p><strong>吴欣鸿</strong>：我们也不知道。但我就是很喜欢。</p>\n  <p><strong>智能涌现</strong>：你们不是一家 PMF 或者数据先行的公司？</p>\n  <p><strong>吴欣鸿</strong>：<strong>我希望美图的产品矩阵中，有我的自留地，让我去做喜欢的事。</strong>这算我自己的私心吧，把兴趣变成事业会更有趣。纯赚钱的事我也能做，但会缺少一些热爱。</p>\n  <p>我们现在有两种做产品的方式。一种是自下而上的创新，我们通过数据洞察到一个需求、一个趋势，再做一些验证，之后慢慢放大产品；另一种是自上而下的战略推进。</p>\n  <p>两者之间并不矛盾。这样做有助于形成健康的产品生态：年轻同事有验证想法的机会，而我可以实现自己的兴趣。</p>\n  <p><strong>小白</strong>：其实 PMF 驱动和热爱驱动也不矛盾。<strong>MVLAND 是最近一年所有新产品中跑得最好的，内测两三个月，ARR 就到了 10 万美元，现在接近 50 万美元了。</strong></p>\n  <p><strong>智能涌现</strong>：这次发布的产品和功能中，哪些是出于热爱？哪些是自下而上的？</p>\n  <p><strong>吴欣鸿</strong>：其实挺难分的。但大多数情况下，<strong>自下而上的产品生命力更强，因为它是自然生长出来的，不是强推的。</strong></p>\n  <p>比如营收增速很快的“开拍”就是自下而上的产品。一开始我们并没有想做一个口播视频的应用，它是从“美颜相机”的提词器功能“长”出来的，当时我们只是发现使用这个功能的用户特别多。</p>\n  <p><strong>智能涌现</strong>：你热爱的、没有经过数据验证的产品，立项之初团队中有人反对吗？</p>\n  <p><strong>吴欣鸿</strong>：我们最后用产品数据说话。如果多次试验后，产品数据依然不好，那就只能结束业务。所以我们基本不在赞同或反对上多费口舌，而是快速验证。</p>\n  <p>美图是一家 2000 人左右的中等规模公司，有一定规模优势。我们可以将很多人力投入产品中台的建设，建立一套可以复用的产品研发管线，从而缩短打造和迭代产品的时间。</p>\n  <p><strong>智能涌现</strong>：能把时间缩短到什么程度？</p>\n  <p><strong>吴欣鸿</strong>：像 RoboNeo 新上线的 Agent Teams，我们花了一个月就做完了。</p>\n  <p>Agent 理论上是一个技术和工程都挺复杂的产品。因为我们有影像产品中台、增长中台等等，所以能将成熟的技术工程、冷启动、营销、增长等经验，高效复用到新产品或新功能上，对 PMF 进行快速验证。</p>\n  <p>这个时代，验证 PMF 的时间理论上越短越好，谁也不知道一个月后技术和市场怎么变。所以我们都将产品验证周期控制在一个月内。</p>\n  <p><strong>智能涌现</strong>：验证 PMF 的标准是什么？</p>\n  <p><strong>小白</strong>：<strong>产品上线半年内，ARR 超过 10 万美元——这是基准线，毕竟硅谷 ARR 百万美元的产品太多了。</strong></p>\n  <h2><strong>先发产品，再找市场</strong></h2>\n  <p><strong>智能涌现</strong>：听说你们马上要飞巴西。</p>\n  <p><strong>吴欣鸿</strong>：是的。带团队去感受一下，和当地的用户、创作者交流。我们也打算拜访一些出海很优秀的中国公司，学习一下经验。</p>\n  <p><strong>智能涌现</strong>：现在美图的重点市场有哪些？</p>\n  <p><strong>吴欣鸿</strong>：<strong>重点市场永远是中国。</strong>中国的用户体量全球最大，语言最统一，美图又有本土的优势。</p>\n  <p>虽然中国市场很卷，但卷有卷的好处，可以锻炼团队的战斗力，有助于我们在海外的竞争。因为我们从本土的竞争突围后，再去海外其他国家，会发现竞争强度远没有在中国高。</p>\n  <p>我们从 2013 年就开始出海，现在美图产品在一些亚洲国家的市占率，尤其是东亚和东南亚，已经逼近中国。</p>\n  <p><strong>智能涌现</strong>：你当下最想开拓哪些市场？</p>\n  <p><strong>吴欣鸿</strong>：南美。巴西、墨西哥等国家的绝对人口也很多，比如<strong>巴西有 2.1 亿的人口，而且他们有旺盛的社交分享需求，从中会延伸出一系列影像创作需求</strong>。有些产品如 RoboNeo、Airbrush，巴西用户是最多的，超过了中国。</p>\n  <p>未来我们也很看重<strong>非洲市场</strong>。刻板印象中，非洲用户比较边缘，好像没有很旺盛的影像创作需求。但事实上，我们收到的用户反馈，有不少是来自非洲的。所以有机会我也想带团队去了解一下非洲市场。</p>\n  <p><strong>智能涌现</strong>：南美、非洲这些市场，是你们 Day 1 就判断要做的吗？</p>\n  <p><strong>吴欣鸿</strong>：不是，我们往往是先发布产品，再根据用户反馈，才去挖掘新的市场、新的增长机会。</p>\n  <p><strong>因为影像产品，或者说互联网产品，边际成本都比较低，能够轻量地、快速地去服务全球用户。</strong>所以我们往往做好各地的语言包之后，就等着用户自己去下载使用、给出反馈。</p>\n  <p>慢慢地，我们就会构建出一幅热点图，知道产品在哪些国家和地区比较受欢迎。接着我们会持续地找原因，如果能找到一个产品和市场的很好的契合点，我们就会尽量放大。</p>\n  <p><strong>所以很多东西都不是策划出来的，而是自然长出来的。只不过长出来之后，我们去浇水，去更好地养护，让产品长得更茁壮。</strong></p>\n  <p><strong>智能涌现</strong>：市场往往是后验的，那哪些判断是可以先验得出的？</p>\n  <p><strong>小白</strong>：感性判断肯定是先验的，MVLAND 就是欣鸿的“小小私心”（笑）。</p>\n  <p>但 PMF 前期是没法先验验证的，需要靠后续一套商业交付的价值衡量体系。以 MVLAND 为例，我们做了很多音乐工作室的调研，盘清了歌曲的产量、MV 的制作成本，以及有多少歌曲配了 MV。</p>\n  <p>不少音乐工作室都提到，假设给他们一个低成本制作的方式，将每首歌都配上 MV，他们就能在抖音、YouTube 等平台上做内容分发，从中赚取广告费，或者做更多歌手 IP 的包装——这些都是目标用户能具体量化的商业价值，我们就能反推 MVLAND 的 PMF。</p>\n  <p><strong>智能涌现</strong>：怎么找种子用户？超级创作者会是你们的核心种子用户吗？</p>\n  <p><strong>小白</strong>：<strong>尽量不要把“超创”纳入种子用户。</strong>他们太全能了，不是典型的用户，所以加入“超创”会污染种子用户的使用行为。</p>\n  <p>“超创”的作用是帮我们触达更多的种子用户，以及做品牌推广。</p>\n  <p><strong>智能涌现</strong>：目前哪些需求是被你们“证伪”的？</p>\n  <p><strong>小白</strong>：<strong>AI&nbsp;试衣。</strong>试衣有两个场景，一种是面向电商平台的商业场景，目前技术是最大的瓶颈，我们也还在攻克衣服一致性、材质还原等问题。</p>\n  <p>另一种是面向消费场景，帮助用户用AI做穿搭。但我们发现，还是把用户想得太理想了。大家不会为了做AI试穿，就把自己衣柜里的衣服一套套全拍下来上传，以及他们更享受现实中试穿、自己搭配的过程。</p>\n  <h2><strong>巨头不会吃掉一切</strong></h2>\n  <p><strong>智能涌现</strong>：在大家都期待用 AI 替代人工时，你们针对“不想学 AI”的用户发布了“真人创作服务”，让设计师在线接单。这会不会反而阻碍用户 AI 心智的形成？</p>\n  <p><strong>小白</strong>：那挺好，真人的毛利率更高（笑）。</p>\n  <p>我们参考滴滴专车的模式，自营一支服务团队，对设计师进行专业化的培训，提供标准化的服务。目前提供 AI 创作服务的大概有几十人。</p>\n  <p><strong>智能涌现</strong>：有真人服务需求的用户，占比大概有多少？</p>\n  <p><strong>小白</strong>：<strong>如果放眼全世界，最少 90% 以上。</strong></p>\n  <p>AI 普及率其实低得惊人。以中国市场为例，我们的人力成本是很低的，所以用户不愿意自己学着使用一些工具，而是直接购买人力服务。</p>\n  <p>比如，水果庄园主的念头是把水果种好，而不是去学剪视频、学短视频营销。他们更愿意每个月花几百块钱，找团队每天做 3 条视频。</p>\n  <p><strong>智能涌现</strong>：从“美图秀秀”到现在的 Agent，产品交互界面最大的变化是什么？</p>\n  <p><strong>小白</strong>：“美图秀秀”类的产品大多以编辑为起点，对话做辅助。Agent 产品会以“对话”为起点，再结合后续的编辑器、资产库等等。</p>\n  <p><strong>智能涌现</strong>：美图是偏应用层的公司，为什么仍然选择自己训练大模型？</p>\n  <p><strong>小白</strong>：“美图奇想大模型”针对人像进行了很多优化。市面上大多模型我们都测评过，在人像表现上都没法落地，没法满足我们的要求。</p>\n  <p><strong>智能涌现</strong>：成本、质量、生成速度，是影像生成模型的不可能三角。作为下游应用公司，你们会不得不牺牲一角吗？</p>\n  <p><strong>吴欣鸿</strong>：<strong>质量是影像产品的灵魂。</strong>即便我们想进入某个很有潜力的场景，如果产品效果没能做好，我们也会战略性地先放弃。同样的，只要无法判断能否交付高质量的生成效果，我们就不会进入场景。</p>\n  <p>一旦决定进入某个场景，我们一定会“死磕到底”，把效果做到第一名。</p>\n  <p><strong>智能涌现</strong>：现在很多工具产品都靠低价、补贴去获客。你们会牺牲一定毛利去做增长吗？</p>\n  <p><strong>小白</strong>：现在有的创业公司疯狂烧钱做算力补贴，很像是拿投资人的钱帮模型厂商刷流水，把 ARR 冲高了再去融更多的钱——<strong>这好比走钢索，赌的是未来算力成本一定会降下来，这个风险太高了。</strong></p>\n  <p>就好比电商提升 GMV 最快的办法就是补贴卖 iPhone 和金条，这套打法只适合背后有几百亿弹药的公司。</p>\n  <p>我们会有一定的补贴做拉新，但更倾向于保持一定的利润，持续补贴做不出产品优势，而产品优势才是我们的溢价空间。</p>\n  <p><strong>智能涌现</strong>：美图的产品是 Day 1 就开始收费的，你们怎么决定收费 Timing 的？</p>\n  <p><strong>小白</strong>：AI 时代就要 Day 1 收费，因为 Token 很贵。先免费、再收���，很多用户会骂你；前期因为免费进来的用户，也不一定是你真正的用户。</p>\n  <p>“豆包”能先免费再收费，还是因为字节有钱。</p>\n  <p><strong>智能涌现</strong>：Picchi、“开拍”都是从“美图秀秀”“美颜相机”这些老产品的单点功能中孵化的产品。单点功能作为一个独立产品，会因为“太薄”而更容易被颠覆吗？</p>\n  <p><strong>小白</strong>：有这样观点的人，大多都 30 岁以上。为什么现在的年轻人不喜欢买奢侈品，而是喜欢新潮牌？因为他们喜欢用这种方式来定义自己跟上一代的不同。</p>\n  <p><strong>所以在影像赛道，我们也希望创造像 Picchi 这样的“时尚单品”。</strong></p>\n  <p>“美图秀秀”是一个集成型的平台，一旦我们发现平台上某个场景下的工作流使用量特别高，我们会转化成独立产品。</p>\n  <p><strong>智能涌现</strong>：你之前提到“美图秀秀”等拥有庞大用户基数的老产品，不会为新产品导流。为什么？</p>\n  <p><strong>吴欣鸿</strong>：我们要确保新产品有自然生长的能力，而不是靠老产品喂流量。如果一个新产品效果不好，用户留不下来，给再多流量也会漏走。</p>\n  <p>未来，我们的主要竞争对手会是初创公司，他们的资源一定不富饶，所以会拼命想办法做增长。所以，<strong>我们要尽可能去模拟初创的环境。</strong></p>\n  <p><strong>智能涌现</strong>：为什么主要竞争对手会是初创公司，而不是大厂？</p>\n  <p><strong>吴欣鸿</strong>：大厂的资源都会往更底层的芯片、模型走，我们进入的是应用的战场。每一家公司都有自己的主航道。</p>\n  <p>即便大厂真的下场，猛兽会不会吃掉所有的生物？我猜是不会的。QuestMobile 的数据显示，目前中国视频创作工具的市占率排名，剪映是第一，第二名是我们的“Wink”，第五名是我们的“开拍”——这意味着我们突破了层层封锁。</p>\n  <p>而且市场和用户需求是动态变化的，美图团队擅长在垂直细分领域里深度思考，持续为用户打磨符合预期的产品形态。</p>\n  <p><strong>智能涌现</strong>：你认可 AI 革命把所有玩家拉到同一起跑线上吗？</p>\n  <p><strong>吴欣鸿</strong>：我不太认可。</p>\n  <p>规模效应非常关键。说实话，同样的事，投入 800 人和只投入两三人是完全不一样的。因为产品背后更多的是工程，而不仅仅是算法。</p>\n  <p><strong>工程需要实打实的投入</strong>，不是靠 Vibe Coding 和足够聪明就能解决的。这也是我们建产品中台的原因，尽量将工程环节的脏活、累活，变成可复用的管线。</p>\n  <p><strong>智能涌现</strong>：美图是一家成功了很多次的公司，而且每款产品所处的赛道竞争都很激烈。能不能从中总结出一些共性的经验？</p>\n  <p><strong>吴欣鸿</strong>：<strong>成功产品，大多都从没有竞争的场景开始。</strong>像这次发布的 4 款新品，市场中都没有什么竞争者，我们只和自己竞争。</p>\n  <p>以及，美图最擅长跑马拉松了。之前我们跟腾讯的“天天 P 图”、百度的“百度魔图”都跑过 N 次了。坚持下去，产品效果会说话。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_a0884b4be197427fb91111d7e7943396@5783683_oswg649725oswg1389oswg517_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_abd5262e581f4160ad8f2c97183261f8@5783683_oswg156754oswg900oswg335_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！j</p>", "category": "tech", "published_at": "2026-07-02T00:30:23+00:00", "fetched_at": "2026-07-02T02:50:21.117430+00:00", "fingerprint": "4de9e9f09b2154db"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨北大博士量子团队获高瓴创投领投，国内唯一实现纳开温区量子计算机工程化", "url": "https://36kr.com/p/3877814169530630?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，国内首家nK级中性原子量子计算机公司——纳开启元（北京）量子科技有限公司（下称“「纳开量子」”）近期已完成首轮数千万元融资，由高瓴创投（GL Ventures）领投，英诺、长石、飞图三家机构跟投。所募资金将重点用于新一代中性原子量子计算机的研发、超冷原子量子模拟计算机的生态建设及标杆客户交付。</p>\n  <p>「纳开量子」成立于2026年4月，是国内首家聚焦超冷原子量子模拟计算与中性原子通用量子计算路线的公司，已形成覆盖量子计算整机、冷/超冷原子实验系统、关键子系统及高精度模块化控制电路的全栈式产品矩阵。公司已斩获千万级市场订单，预计2026年全年营收达数千万元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_41b4aa3091374092a3d7be8eb016f214@6221844_oswg920864oswg918oswg688_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纳开量子超冷原子量子模拟计算机（图源/企业）</p>\n  <p>「纳开量子」的核心团队源自北京大学量子电子所冷原子与精密测量课题组（CAP组）。公司创始人兼CEO樊耀塬出生于1998年，本科毕业于北京大学物理学院，博士毕业于北京大学电子学院，从事冷原子研究超过8年，兼具物理前沿探索与工程实现能力。博士期间，他主导搭建了国内首台超冷原子干涉陀螺仪，并联合搭建了国内首台超冷原子布洛赫振荡型重力仪。</p>\n  <p>量子计算被广泛认为是下一代算力的关键突破口，尤其在大规模并行计算与复杂系统模拟方面具有经典计算无法替代的优势。</p>\n  <p>在众多技术路线中，中性原子因其天然的全同性与可扩展性，被视为最有希望实现大规模通用量子计算的路径之一。</p>\n  <p>「纳开量子」正是沿着这一方向展开布局。公司名称中的“纳开”源自绝对温标中的纳开尔文（nK）单位，象征其在原子的极限冷却与精准操控方面的核心能力。团队掌握将铷、钾、铯、锂、钠、镱、锶、镝、铒等9种元素原子及其同位素冷却至10nK以下温区的核心技术工艺，可控原子数量及温区均为国内第一。</p>\n  <p>樊耀塬向硬氪表示，在技术壁垒上，「纳开量子」具备两大优势：一是国内唯一能将这么多种原子温度工程化地冷却至10nK以下的团队，原子温度越低，无规则热运动越容易被抑制，量子效应越显著，计算性能越优；二是拥有业界顶尖的光晶格技术，包括动态晶格、脉冲晶格及超晶格等，可实现高精度的超冷原子操控。</p>\n  <p>「纳开量子」的商业模式呈现“双轮驱动”特征。一方面，通过量子模拟计算机（专用量子计算机）的整机交付持续提供营收增长与现金流，实现自我造血；另一方面，同步推进通用量子计算机新架构的研发，瞄准中长期战略高地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_27adb5141e83441289858f69321a3090@6221844_oswg731438oswg1080oswg716_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纳开量子双轮驱动商业模型（图源/企业）</p>\n  <p>专用计算方面，公司已具备批量交付能力，向国内多家科研单位批量交付量子模拟实验平台、冷原子教学系统、MOT系统等产品。通用计算方面，公司重点攻关中性原子量子计算机的连续运行和高保真度门操作等关键技术瓶颈，瞄准中国首台多场景可实用的通用量子计算机。</p>\n  <p><strong>以下是硬氪与创始人樊耀塬的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：中性原子路线近年较为火热，核心原因是什么？纳开的技术差异化在哪里？</strong></p>\n  <p><strong>樊耀塬：</strong>2022到2023年，哈佛背景的QuEra公司推出了一个把动态光镊和静态光镊结合的新架构，第一次真正做出了可编程的中性原子量子计算机雏形。整个行业的预期从“需要几十年”一下子拉近到十年左右。这也是我从学术转向产业的重要原因之一——量子计算工程化变得可能了。</p>\n  <p>跟很多中性原子公司不同的是，我们在做下一代架构：比起在物理比特数量甚至光镊阵列数量上刷新记录，我们公司更务实地在解决系统连续运行以及保真度提升这类关键问题。我们是国内唯一能把这么多种原子冷却到10nK以下并工程化的团队，这一技术对保真度的提升至关重要。另外，超冷原子也是专用量子模拟计算的硬性门槛，这形成了我们很深的技术护城河。</p>\n  <p><strong>硬氪：量子计算有超导、离子阱、中性原子多条技术路线，为什么纳开选择中性原子？</strong></p>\n  <p><strong>樊耀塬：</strong>目前主流就是这三条路线。离子阱最早，保真度能做到最高，但离子带电，存在长程相互作用，串扰严重，工程化非常复杂、烧钱。超导的优势是和半导体产业结合紧密，产业化做得最好，短期内可能还是主导路线。但超导的量子点是人为刻蚀的，一定会有缺陷，而在量子系统里缺陷会被无限放大。</p>\n  <p>中性原子的优势在于：每一个原子天生就是全同的，而且通过光晶格阵列，比特规模可以做到非常大——超导做到几十个比特就很难了，中性原子能轻易做到上千甚至上万个。这是它这两年突然火起来的最重要原因。</p>\n  <p>但中性原子也有明显短板。评判一个量子系统好不好，主要看三个维度：比特数、保真度、运行时间。中性原子只在比特数上有压倒性优势，保真度不如离子阱，运行时间更是只有几百毫秒就得重启一次。所以我们公司重点就在啃这两块硬骨头。一旦把这两个短板补齐，中性原子一定是最优路线，没有之一。</p>\n  <p><strong>硬氪：公司目前营收主要来自科研市场，如何看这个市场的天花板？未来向工业界拓展的路径是什么？</strong></p>\n  <p><strong>樊耀塬：</strong>科研市场其实并不小，像国仪量子这类公司也是以科研市场为基础走到IPO。更重要的是，目前国内在超冷原子专用量子模拟计算这个细分方向，能够提供整机交付的只有我们，相当于垄断地位。</p>\n  <p>工业界的拓展是我们的下一步重点。专用量子计算可以用于材料研发、制药、半导体仿真等场景。我们已经在和一些企业对接。但工业应用需要我们对算法和软件做针对性研发，这是一个自然延伸的过程。先通过科研市场把产品和工程能力打磨成熟，再往工业场景下沉，路径是清晰的。</p>\n  <p><strong>投资方观点：&nbsp;</strong></p>\n  <p><strong>高瓴创投（GL Ventures）表示</strong>，量子计算正从科学验证走向工程化攻关与产业化探索，能够实现稳定整机交付、持续提升系统可扩展性和可用性的团队，将在下一阶段竞争中占据重要位置。中性原子路线在规模化、可操控性等方面展现出较强潜力，是量子计算值得长期投入的重要方向。纳开量子依托北京大学在超冷原子与量子计算领域的深厚积累，团队兼具前沿科研能力、工程实现能力和产品化能力，在核心技术、工程体系和产品交付上持续探索，值得长期关注。</p>\n  <p><strong>英诺天使基金表示</strong>：纳开团队依托北京大学超冷原子实验室，打造了超冷原子量子技术全链条的产品生态，覆盖量子教学仪器，专用量子计算机与通用量子计算机等。技术指标位居世界前列。年内将推出超千比特连续装载量子计算机。英诺看好团队在中性原子领域数十年的深厚积淀，以及樊博带领的北大博士团队的研发实力，将助推早日实现量子计算规模商用。</p>\n  <p><strong>长石资本</strong>：量子计算作为未来终极计算方式，其商业化应用潜力巨大。长石资本坚信，随着相关政策的支持和市场资金的投入，未来中国将会出现一批优秀的量子计算上市企业。长石资本依托自身产业资源和高校科研资源，已经在量子计算投资多家头部企业。中性原子作为量子计算的新兴技术路线，凭借极强的可扩展性，正呈异军突起之势。纳开团队依托北京大学在冷原子领域深厚的技术积累，已展现出行业黑马之姿，未来有望成长为中国中性原子路线的领军企业。长石资本也将持续在产业资源对接、人才引荐等方面为团队提供全力支持，助力企业加速发展。</p>\n  <p><strong>飞图创投</strong>：飞图长期看好量子计算在未来前沿科技中的重要地位。目前量子计算的各个技术路线并未完全收敛，中性原子凭借高可扩展性、长相干时间、低纠错成本等优势，正从实验室走向工程化落地，是最有望率先实现实用化量子算力的路径之一。纳开启元团队具备顶尖学术与工程能力：由北大优秀毕业生樊耀塬博士领衔，核心成员大多数为北大毕业的博士硕士，团队发表160 + 篇高水平论文、出版2 本专著，主持十余项国家级课题。在超冷原子制备与工程交付上经验丰富，壁垒深厚。而超冷原子制备恰恰又是中性原子技术路线的第一性基础。纳开团队在冷原子制备、原子俘获、原子重排、里德堡量子门操控、纠错与扩展方面都有极强的工程化经验。纳开启元已完成专用量子计算机的实际交付，并计划于今年末至明年初发布业界领先的通用量子计算机。因此，我们坚定布局这一兼具技术确定性与团队硬实力的优质标的。</p>", "category": "tech", "published_at": "2026-07-02T01:16:49+00:00", "fetched_at": "2026-07-02T02:50:21.117424+00:00", "fingerprint": "dea24cb6436a5c41"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前大疆科学家创业，半年内连获四轮数亿融资，耀途资本、锦秋基金等押注", "url": "https://36kr.com/p/3877830625046535?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，聚焦通用空中智能的硅羽科技（SPARO）半年内已连续完成四轮数亿元融资，在种子轮耀途资本之后，锦秋基金、阿里巴巴、弘毅投资、普洛斯隐山资本、云时资本相继入局。资金用途方面，现阶段融资将主要⽤于扩充关键岗位的团队建设、推进产品线的商业化落地与规模化交付，以及加速技术平台的持续迭代。</p>\n  <p>硅羽科技成立于2026年2月，专注于通用空中智能，致力于推动飞行器从传统遥控工具，进化为能够理解环境、思考决策并自主完成任务的空中智能体。</p>\n  <p>硅羽核心团队来自全球顶尖研究机构及大疆、华为等头部企业，拥有十余年前沿技术积累与产业化经验。公司构建了多模态感知、端到端小脑、世界导航模型大脑以及灵巧作业与集群协同全栈技术体系，让飞行器进入无GPS信号、弱光、动态变化等复杂环境中完成任务，并实现跨场景、跨平台、跨形态应用。</p>\n  <p>硅羽科技创始人张富则是典型的“学术+产业”复合型人才。他入选Clarivate全球前1%顶尖科学家，在ScholarGPS近五年全球机器人学者影响力排名中位列全球第五、华人第一，现任香港大学终身副教授、MaRS Lab负责人。</p>\n  <p>学术之外，他曾任大疆高级顾问科学家8年，深度参与大疆等行业头部企业的核心技术研发与产品化落地，涵盖飞控系统、多传感器融合、激光雷达等多个关键方向，开发的相关开源技术被宇树、美团等数十家企业验证使用。</p>\n  <p>从行业发展来看，飞行器行业的上半场比拼的是工程成熟度与性价比，头部企业已将这两个维度推向极致。但在张富看来，行业的真正下半场才刚刚开始，核心变量正从硬件参数转向自主能力。</p>\n  <p>“现在的无人机也能干活，但它只能干‘观察’的活，搭载相机、激光雷达去看，没办法真正改变环境。”张富向硬氪表示，“可操作意味着它能够干预这个世界。”</p>\n  <p>在他看来，当下市面上并不存在真正智能化的飞行器，“因为它很难。”</p>\n  <p>而张富选择这一赛道，正是基于两个底层判断：“这个事足够难，也就意味着足够有壁垒。无人机受限于重量尺寸功耗，要把感知、决策能力集成在一块很小的芯片上，难度远超地面机器人。”</p>\n  <p>另一个原因则关乎商业本质：“空中智能体去的是人去不到或人很难去的地方，这种属性意味着它天生具有不可替代性。”</p>\n  <p>硬氪了解到，硅羽科技的核心技术壁垒，在于一套覆盖感知、小脑、大脑与数据的全栈自研架构：</p>\n  <p>感知方面，硅羽科技的多模态融合感知方案，将激光雷达、视觉、惯导等多源信息深度耦合，在无GPS条件下实现厘米级定位，在暗光、浓烟等退化场景中保持稳定感知。算法减少了对特征提取的依赖，更好适配弱纹理、光照剧变等复杂场景，计算效率较传统方案提升十倍以上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_29d41b66367f47e6b55f35a6f4aa1c37@6221844_oswg550778oswg1068oswg612_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;对陌生环境实时建模理解（图源/企业）</p>\n  <p>决策方面，基于端到端小脑，硅羽科技将避障响应延迟压缩至5毫秒以内——人类飞行员的反应时间约为百毫秒。这意味着飞行器在20米/秒的高速飞行中，仍能对动态障碍做出实时判断和规避。</p>\n  <p>大脑方面，硅羽科技正构建基于World Navigation Model的通用飞行器大脑。传统SLAM解决“我在哪、周围什么样”的问题，而World Navigation Model解决“这个空间如何运作、接下来会发生什么”——飞行器不只是建图，而是理解空间的几何结构、语义属性和动态变化。真机采集的数据在仿真环境中完成迭代训练，再部署回真实世界，形成“越飞越聪明”的数据飞轮。</p>\n  <p>还有灵巧作业与集群协同方面，飞行器像鸟类一样学会抓握、栖息、碰撞调整，能与环境产生物理交互。同时通过分布式架构实现千架级集群协同。从单体灵巧操作到群体智能，具备空中规模化作业能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_07b52edf9dd5409f9491a0adedb98bde@6221844_oswg189444oswg976oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">产品在室内工作（图源/企业）</p>\n  <p>张富告诉硬氪，成立仅半年，硅羽科技已积累数十家种子客户与合作伙伴，包括无人机、物流配送企业等。</p>\n  <p><strong>以下是硬氪与硅羽科技创始人张富的对话（经编辑）：</strong></p>\n  <p><strong>硬氪：空中智能体这和传统无人机的核心区别是什么？</strong></p>\n  <p><strong>张富：</strong>与传统无人机相比，我们有三个核心区别：一是通用性，要跨场景跨平台，在室内、地下、近地超低空都能飞；二是会思考，不需要人遥控，能自己推理世界、做决策；三是可操作，不仅能看，还能干预环境，比如做修复、清洗这类工作。</p>\n  <p><strong>硬氪：如何看待和大疆这类头部企业的关系？</strong></p>\n  <p><strong>张富：</strong>大疆是无人机领域的标杆企业，定义了成熟的飞行平台，但我们在做的是增量市场和新品类，两者并不是简单的同类替代关系，而是在飞行器智能化演进中的不同侧重。我们的特点主要在三个方面：原始技术创新能力，尤其是源头技术；前沿技术转化为量产产品的落地能力；以及过去十年积累的核心技术。</p>\n  <p><strong>硬氪：接下来两三年的规划是什么？</strong></p>\n  <p><strong>张富：</strong>产品布局主要分为两条，整机率先在真实环境中跑通从感知到任务执行的完整闭环，验证全链路可靠性。空中智能模块则将定位、感知、导航和避障能力轻量化封装，即插即用地赋能多旋翼、eVTOL、固定翼���各类飞行平台。</p>\n  <p>更重要的是建立生态。通过整机验证能力、模块复制能力以及面向开发者和生态伙伴的S2R仿真平台，构建一个空中智能体从技术研发到规模化落地的完整基础设施。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>（种子轮独家投资方）耀途资本表示：</strong>张富老师团队由全球稀缺的、同时掌握多模态SLAM底层算法与无人机整机端到端系统能力的顶尖学者构成。FAST-LIVO已经成为全球机器人领域事实上的工业基准之一。当前空中具身最大的瓶颈，是在复杂环境里实现自主感知，而这恰恰是张老师团队的技术强项。我们看好硅羽科技把顶尖学术成果工程化、产品化的能力，期待公司打造出真正面向真实作业场景的通用空中智能底座。</p>\n  <p><strong>锦秋基金表示：</strong>锦秋已经投资了超过十家具身智能相关的公司，而硅羽的独特定位则是在2m以上的广阔空间的感知-理解-任务执行。就像AI给机器人领域带来的范式变化，我们也非常相信随着多模态的感知、导航再到“飞行智能体”的自主思考、任务执行，也会很快到来。在港大见完张富老师我们在十天内完成了决策，我们笃定AI技术会成为无人机领域的新变量，从而带来新的巨大的机会，而张富老师是我们在这个蓝海的领域里见到的全球顶尖的学术团队，在产品化和商业化的迭代速度也让我们印象深刻。</p>\n  <p><strong>弘毅投资投资总监谷雨：</strong>作为硅羽科技的早期投资方，我们看重的不只是一个新硬件产品，而是团队在飞行智能体底层技术上的系统性积累。张富教授及 HKU MaRS Lab 团队长期深耕空中机器人，在多模态感知融合、高精度定位建图、端到端导航与控制等方面形成了领先能力，并具备将前沿研究转化为可量产产品的工程经验。我们相信，下一代飞行平台会从“被控制的设备”走向具备自主感知、实时决策和可靠执行能力的智能系统。硅羽科技正在把这些核心技术带入真实场景，推动飞行机器人从技术验证走向规模化应用，我们期待团队持续定义这一代飞行智能体的产品形态和产业价值。</p>\n  <p><strong>普洛斯隐山资本表示：</strong>我们长期看好空中具身智能领域的发展机遇，其代表空间通用智能的演进方向，重构低空产业范式。硅羽科技团队拥有空中智能体领域全球领先的学术研究能力和卓越的产业化经验。依托普洛斯物流和算力基础设施生态及隐山资本的产业资源，我们期待通过“资本+产业”协同赋能，助力硅羽科技开启具身智能+无人机的新纪元。</p>\n  <p><strong>云时资本投资人李想表示：</strong>我们长期关注空天地海各层级的颠覆性创新机会，置身于AI与物理世界的交融奇点，硅羽将低空经济和具身智能融合，通过学习驱动的新范式重塑自主无人机的飞行轨迹与全流程复杂操作。创始人张富及核心团队在软硬耦合的前沿科技领域拥有多次-1到100从科研到爆款落地的稀缺能力，已经将无人机在未知、复杂物理三维空间中的感知能力推向极致。我们将一路同行，支持团队不断破局，将更小、更智能、集群化的空中智能体推向千家万户，定义新时代的通用空间控制轨迹。</p>", "category": "tech", "published_at": "2026-07-02T01:33:33+00:00", "fetched_at": "2026-07-02T02:50:21.117418+00:00", "fingerprint": "c8c6a7c871c9b33e"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 清华、中科院团队联合华西医院研发康养转运机器人，进一步布局居家养老场景", "url": "https://36kr.com/p/3877863381741577?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，深圳可立点科技有限公司（以下简称“可立点科技”）近日完成战略融资，由力合科创领投，江苏中科智能科学技术应用研究院旗下平台跟投。本轮融资将主要用于产品研发迭代、核心团队建设及商业化落地推进。</p>\n  <p>可立点科技总部位于深圳，<strong>是一家聚焦“AI+机器人”养老场景的科技公司，围绕银发群体布局家庭陪伴与院内康复两大产品线。</strong>目前，公司已推出面向居家养老场景的主动陪伴机器人，以及与四川大学华西医院联合研发的康复助行转运机器人，两款产品均已完成工程样机开发，正在推进小批量试产和商业化。</p>\n  <p>随着人口老龄化持续加深，银发经济正成为重要的新兴市场。业内预计，2035年我国银发经济市场规模有望突破30万亿元。在“积极应对人口老龄化”国家战略和相关支持政策推动下，康养机器人也成为增长较快的细分方向之一。</p>\n  <p>其中，<strong>与四川大学华西医院联合研发的GR-150康复助行转运机器人</strong>，主要面向医疗机构和康养机构场景，基于高精度SLAM定位导航与多传感器融合技术，可实现室内自主导航和无人化移动，为失能、半失能患者提供智能转运和移动辅助服务。目前，公司已拥有相关自主知识产权，累计布局数十项专利及软件著作权，并正在申请中国医疗器械二类注册。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_d822f015fb6843539d7ba3dcc5ed901c@5920579_oswg92507oswg674oswg379_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>面向家庭场景推出的第二代居家养老陪伴机器人</strong>，定位为家庭智能陪伴助手，集健康监测、情感陪伴、认知辅助和安全巡检于一体。产品支持主动交互，可识别用户回家、进行语音问候、夜间跟随陪伴，并具备跌倒检测和异常报警能力。同时，机器人配备交互式屏幕，可播放视频、音乐、提醒服药。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_a00e6c255dbf44ab8692aa6d8fb037c4@5920579_oswg311304oswg651oswg488_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>底层技术方面，产品围绕老年用户需求进行了针对性研发。针对老年人语速慢、发音不标准、语句重复以及方言使用等特点，公司自主优化了NLP/NLU引擎，提升语音理解能力；健康监测方面，结合生物雷达或红外热成像技术与AI算法，实现睡眠呼吸暂停筛查、心率变异性分析等健康预警功能；在人机交互方面，通过融合语音情感识别、文本情感分析及面部微表情识别，构建多模态情感计算模型，以提升陪伴体验。</p>\n  <p>据公司介绍，陪伴机器人产品目前已获得部分养老院、保险公司及渠道代理商的采购意向。按照规划，<strong>公司预计于2026年第三季度完成产品最终定型，第四季度启动小批量量产，并于2027年逐步实现规模化营收。</strong></p>\n  <p>团队方面，可立点科技创始人兼董事长王禹衡拥有国际投行及连续创业背景，福布斯中国最具影响力华人精英Top100，曾就职于国际投资银行5年，后曾创立加拿大外卖平台Nomme（后被DoorDash收购）以及AI社交点餐平台ClickDishes（已被收录于哈佛商学院商业案例）。主要负责公司战略规划、融资及全球化布局。</p>\n  <p>公司CEO兼CTO张腾腾为清华大学博士后、哈尔滨工程大学博士，中科院硕士，长期从事模式识别、机器人感知与决策控制、移动机器人及AI深度学习研究。联合创始人兼首席科学家宫新一为杭州电子科技大学教授、中国科学院硕士博士、清华大学本科，在智能控制与机器人领域具有长期科研积累，为公司的技术研发提供学术与技术支撑。</p>\n  <p><strong>以下为硬氪与创始人王禹衡交流节选：</strong></p>\n  <p><strong>硬氪：老年陪伴赛道目前已经有不少玩家，你们的优势是什么？</strong></p>\n  <p><strong>王禹衡：</strong>&nbsp;我们认为，目前市场上的很多产品仍以单一功能为主，例如健康监测、生命体征采集等，大多依赖穿戴设备实现。而我们的定位并不是做一款单独的监测硬件，而是一个家庭智能管家型机器人，成为连接各种智能设备和服务的核心入口。</p>\n  <p>未来，无论是健康穿戴设备还是智能家居，都可以与机器人联动。机器人既能够完成健康监测、风险预警等功能，也能够依托接入的大模型系统，与老人进行自然交流、提供情感陪伴，并回答日常生活中的各种问题，例如天气查询、生活建议等，实现陪伴、交互和管理能力的融合。相比聚焦某一垂直场景的产品，我们更强调开放融合的平台能力，希望把机器作为家庭中的智能中枢。</p>\n  <p>其次，公司的核心创始与技术团队来自清华大学和中国科学院，在算法和底层技术研发方面具备较强实力。再次，我们非常重视产品设计和用户体验。目前展示的产品仍属于功能验证样机，未来将在工业设计、交互体验和情感化表达等方面持续投入，让机器人真正融入家庭生活。</p>\n  <p>我们判断，人形机器人大规模落地家庭场景仍有很长一段时间，我们研发的陪伴机器人将能够更快更早进入家庭场景，为老人提供更接地气更实际的服务，成为家庭机器人智能化升级过程中的重要过渡产品。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>力合科创表示：</strong>可立点科技是我们在银发经济与具身智能交叉赛道上发现的一支极具潜力的团队。创始团队兼具清华系AI技术功底和国际化商业视野，核心产品与华西医院的深度合作更体现了其临床落地的扎实路径。我们看好康养机器人在中国老龄化加速背景下的巨大市场空间，期待可立点科技成为这一领域的领军企业。</p>", "category": "tech", "published_at": "2026-07-02T02:07:44+00:00", "fetched_at": "2026-07-02T02:50:21.117405+00:00", "fingerprint": "d015057cf386ebef"}, {"source": "少数派", "title": "年度报告不够看？微信读书 Skill 上手体验", "url": "https://sspai.com/post/109932", "summary": "人对自己或许会偶尔不诚实，但你的书架是很诚实的。<a href=\"https://sspai.com/post/109932\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-01T02:27:40+00:00", "fetched_at": "2026-07-02T02:50:19.557203+00:00", "fingerprint": "a3059a3dd4994f0b"}, {"source": "少数派", "title": "[送码] 白描 App 的 9 周年：推出鸿蒙版，白描 PDF 共创首发", "url": "https://sspai.com/post/111640", "summary": "2017年6月21日，白描App按下了发布键。那时的它还很简单，甚至有些单薄：拍下一张图片，识别里面的文字，再复制出来。它最初想解决的，也只是一个非常具体、非常日常的小烦恼：帮女朋友把读书笔记从照片里 ...<a href=\"https://sspai.com/post/111640\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-01T07:03:51+00:00", "
