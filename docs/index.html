/p>\n  <p>编辑丨果脯</p>\n  <p>篮球再一次证明了它在国民运动中的影响力，不过这次是作为二游。</p>\n  <p>错开年底即将登场的几位“大咖”，灵犀互娱的《篮球少女：飞跃巅峰》（以下简称《篮球少女》）抓住空档，成为了十月底的“黑马”。这款以篮球为主题的养成系二游，一度被类比为“国产赛马娘”，公测后直接冲上iOS畅销榜第4名，并在TapTap上取得了8.2的评分。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_69f85174298c456985653ea54f04f43c@6449318_oswg112116oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">B站官方宣传图</p>\n  <p>对于灵犀，制造爆款已不算是什么稀奇事，《三国志·战略版》《如鸢》等作品都出自他们名下，但自灵犀离开阿里后，除了《旅行青蛙·中国之旅》停运以外，还真没什么大动作。而且不管是养成，还是二次元，都是灵犀此前很少接触的游戏类型，此次切入校园运动题材，从各种角度来说，都是灵犀跳出舒适圈的一作。</p>\n  <p>非IP、无经验、回归之作，按理说，这间BUFF叠满的工作室，研发压力应该不小。然而《篮球少女》的游玩体验却相当舒适，游戏不仅画风软萌，各种梗又多到爆炸。可以说，制作人在自己熬着大夜、镜片变厚的同时，将“梦想”与“成长”故事，用最温柔的方式呈现给了玩家。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_f58ef04e31e5429db5c18f8a2707caf5@6449318_oswg337136oswg705oswg432_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <h2><strong>01 游戏？梗盲盒！</strong></h2>\n  <p>玩《篮球少女》，你永远不知道下个梗会在什么时候蹦出来，可能是触发的偶然事件、可能是与角色的日常对话，甚至可能是在你第一次发现这游戏的工作室叫什么的时候——</p>\n  <p>篮球题材的游戏，叫黑曼巴工作室很合理吧？类赛马娘的玩法，叫“曼波”工作室也很合理吧？但《篮球少女》这场篮球与养成的邂逅，始料未及地让“曼巴”与“曼波”结合在了一起，“黑漫波工作室”，再次证明了一个有趣的游戏，从命名环节就应该开始展示梗浓度。</p>\n  <p>而当你试图为制作组“请个高人”，但你会发现他们又做到先你一步！《篮球少女》不仅请来了一个大家熟悉的“高人”，还把“姚明”直接做成了游戏角色。不过，《篮球少女》既要有篮球元素，也应该有少女元素，大姚只会打篮球可不够“入乡随俗”，还要经历“少女化”才能完美融入游戏世界。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_9ad4d3bcb3e74869b7866cde81958884@6449318_oswg771786oswg1080oswg799_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">B站玩家AI二创图</p>\n  <p>姚明在游戏中对应的是一位名叫“洺瑶”的女高中生，从184cm的身高与傲人的身材比例，玩家不难看出两者的关联。虽然角色名有些“难绷”，但《篮球少女》对角色的塑造却没掺水分。</p>\n  <p>游戏中的每个交互内容，都能增进你对球员的了解。比如洺瑶就是一位“天赋大于努力”的选手，仅凭自己的身高优势，就足以让她在女篮赛场上成为重型坦克一般的存在。和这一切显得有点反差的是，她本人将更多的精力花费在自研游戏而非篮球，作为游戏宅，你想用毛绒小熊或草莓蛋糕来俘获她的心可不行，8090显卡才是真正的对“瑶”宝具，做出爆款游戏实现“躺平”才是洺瑶真正的梦想。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_70f83c810ed14f90bd13b2a5a8d60ab6@6449318_oswg1044927oswg1080oswg808_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">B站玩家AI二创图</p>\n  <p>在《篮球少女》的世界里，所有篮球明星一律平等，统统没逃掉“变可爱”的命运。除了洺瑶外，你还能和金毛单马尾的“詹姆斯”在训练后共享汉堡与炸薯条，听见她说出那句“只要查过比赛数据就能知道，我在本场比赛的表现简直完美无缺”的经典发言；“火箭登”变成白毛异瞳的中二病少女，一边说着“观测者”、“恶灵”之类令人头皮发麻的台词，一边用“终焉后撤步”投进三分球逆转全局。</p>\n  <p>在赛场表现之外，玩家还能够提升角色亲密度，为少女们穿搭新的服装……虽说篮球的情怀一直很坚定，但对于这些老朋友的“另一面”，还是很难不产生多余的情感。改编确实不能乱编，但编得特别有乐子的除外。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_e93c0d639f6d4b6baa38debec75c5e8f@6449318_oswg646490oswg1080oswg729_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>将原型进行娘化处理，这种做法并不是第一次取得好的效果。下半年，蓝色鲸鱼娘带着表情包刷爆B站评论区，娘化马尔福与哈利波特请全球网民吃上CP糖，反差的萌点，是网民屡屡选择她们的关键。</p>\n  <p>DeepSeek原本只是一个没有情感的AI工具，而穿上女仆装后就有了爱撒娇、爱偷懒的性格特质，不仅形象鲜活了起来，而且能够承接用户更多的情感互动；马尔福本身是哈利波特系列中的反派，其娘化形象褪去了角色阴暗面，只保留了傲娇与冷魅的闪光点，观众能够更轻松地接纳角色。“窈窕淑女，君子好逑”，少女的形象总是能承载人们许多对美好的憧憬，“篮球娘”证明这一点在体育养成题材中也不例外。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_acde8a3a019346818bbc7ecabfd0bd12@6449318_oswg53765oswg479oswg680_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">网络二创图片</p>\n  <p>现实的NBA赛场充满对抗色彩，就像那句经典的“菜是原罪”，无冠者往往会被剥夺一切。当球星被转化为美少女形象，原本有些沉重的职业赛事得到了娱乐化，懂球的玩家一眼就能看出其中的乐点，不太熟悉篮球的玩家理解起来也不会有太高的门槛。游戏背景从不进则退的竞技舞台，转移到轻松活泼的校园生活，不只是拉近了与二游玩家之间的距离，也更容易触发剧情对于玩家记忆的共鸣暴击。</p>\n  <p>《篮球少女》的主线，落脚在很经典的叙事框架，联赛入围失利，主力退队风险紧随其后，队伍解散的阴影笼罩在每个人头上，而“我”作为王牌教练力挽狂澜。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_7580605e938843f6a9ca0d6c204a5b33@6449318_oswg84492oswg1080oswg971_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">B站玩家二创梗图</p>\n  <p>这种退队流套路，我们从孙悟空三打白骨精，看到《MyGO!!!!!》里长崎素世惊天一跪，品鉴了太多次，却不会觉得太腻味。不如说，这种分离与决裂的情节已经成为热血竞技中不可不品的一环，成员之间因彼此热爱又彼此伤害，每一个瞬间都在吸引观众去抓取青春的记忆，为过去的遗憾打上补丁。现实的诀别十分伤痛，大家并非想直面这种带刺的骨感，《篮球少女》在其中加入丰富的梗元素做调味，才能让玩家真正吃得下去。</p>\n  <h2><strong>02 从“难绷”到“上头”，用了不到半天</strong></h2>\n  <p>好的梗文化能让玩家有下载游戏的动力，但只凭借这一点，还很难让玩家留住脚步。《篮球少女》很好地把握了一个度，制作组没有将这款游戏做成披着篮球外衣的“美少女图画集”，你可以感觉到里面的角色是真心在玩篮球，球员之间也有客观的天赋差异。虽然在赛场上跑动的是Q版的“大头娃娃”，但玩家能感受到的不仅是欢笑，也有角色的汗水与泪水。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_b7807275aba0487bac6452407cf64fdd@6449318_oswg683077oswg1080oswg619_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内剧情截图</p>\n  <p>《篮球少女》的游戏性并不是特别出彩的那一档，但它的游戏目标特别明确，就是想尽一切办法提升数值，再将养好的“自家孩子”拉到球场上溜溜检验成果。游戏大致可以分为“养成”与“参赛”两个板块。</p>\n  <p>作为养成类游戏，一些行业通病是玩家最容易关注到的地方。传统养成重复性很高，在数值不断提升的同时，玩家对于数值变动的敏感度也在降低，当数值达到一定程度，还会有较长的平台期，很大程度上降低了玩家体验的流畅性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_b8075e647a144a74ab2f25a555d79ed8@6449318_oswg742286oswg1080oswg628_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内时装截图</p>\n  <p>《篮球少女》做了一个很聪明的创新，制作组在养成中融入Roguelike的循环元素。训练周期以一周为单位，周一到周五训练，周六日可以外出活动，在此期间玩家遭遇的事件与道具完全随机，每次抽取数值奖励都像是一场豪赌，这种盲盒式体验能给予玩家高频的快感连击。</p>\n  <p>作为少女们的教练，你可以为表现好的球员给予奖励，也可以在训练失败后给她送上安慰，刷数值的过程并没有机械的感觉，而好像是你在见证一位朋友的成长轨迹，玩家在角色数值成长以外，也能从丰富的事件收集中获得乐趣。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_cd8cd9a0738641ae954f43dcda5b2853@6449318_oswg719963oswg1080oswg632_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内时装截图</p>\n  <p>《篮球少女》养成系统主要分为三个流派，其中训练流是目前最热门的玩法，玩家需要追求队员们做出更加同频的训练动作，用老虎机转出具有相同表情的队员，从而取得额外的Bonus数值。配合角色技能，可以将Bonus倍率提升到5倍甚至6倍，爆出更高而且特效更加华丽的数字。</p>\n  <p>而商店流和扭蛋流则显得更简单，玩家只需要在周六日去餐厅打工赚取经费，再用积攒下来的钱将购物车一口气清空，队员的数值就能蹭蹭往上涨了。在养成板块，“篮娘”用最简单的玩法引出了玩家最纯粹的爽感。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_fe76b8dff37042d29a26c0c0cf0cee45@6449318_oswg540807oswg1080oswg680_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>在参赛板块，《篮球少女》构建了一座金字塔式的赛事体系，玩家扮演的王牌教练要从外卡队伍开始执教，跨越强队如云的东部大赛，最终达成入围全国大赛的目标。游戏对养成成果的检验，全部是通过赛事来进行的，玩家可以选择PVE“爬塔”获取奖励，也可以参加竞技场和“立冬杯”等特殊杯赛，与全服玩家来一场PK。</p>\n  <p>但关于对战画面，说实话我并没有对它“一见钟情”，因为印象之中的球类游戏，是像《街头篮球》这样依靠即时战略出奇制胜；或是像《The Spike》一样，触球时的打击感满满。而“篮娘”的核心玩法是回合制，几乎全程都由AI引导角色的跑位和联动，玩家虽然作为教练，实际上与观众席也没有差多少。作为体育题材游戏，赛场战斗仿佛成了重要性不是很高的环节，让我在一开始不太适应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_9d47f1a4e8374be9b72232fdf44d0215@6449318_oswg378807oswg1080oswg604_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>到了游戏后期，上述问题得到了有效缓解。因为当球员的属性提高，她们能更多地触发三分球、滑步过人、抢断、盖帽等动作，使战斗衔接更加丝滑，“力竭”的球员开始倾向于传球给其他队友，球员之间有了更多的配合。在此之外，“正射之矢”、“毁灭重扣”等强力大招的释放进一步提升了比赛的观赏性，仅凭数值比拼，玩家不一定能精准预测比赛的走向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_77974504277b46828a0ed395e56a5b1a@6449318_oswg439109oswg1080oswg615_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>玩家也能通过配队来干预对局结果，一些球员在养成板块中是流派的核心，但自身数值可能并不适合竞技场的比拼，追求高品阶、高星级的球员并不是赛场上的最优解。例如位于“大前”之位的龙宫寺，虽然是紫色品阶的球员，但吃满五层速度型球员加成的她，很容易在比赛后程以三分连中逆转战局。当玩家手上没什么好牌，还能够玩“四保一”阵容，将主力球员的数值与持球概率拉满，展现一次极致的“个人英雄主义”也没什么不妥。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_e1e22354edcd4946aabdf603cc9e116f@6449318_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">游戏官方时装介绍宣传图</p>\n  <p>经过一定时间的体验，我逐渐理解了这种轻玩家干预的球赛玩法。相对于赛马娘，篮球题材在中国地区具有更大的受众基础，但看过打篮球的人不少，亲自上手打过篮球的就没那么多了，而真正熟悉篮球联赛规则的人可能就更少。被篮球+少女题材吸引来的玩家，可能是篮球爱好者，但更可能是不那么熟悉篮球、想以此获得快乐的普通玩家。黑漫波这番操作，是想把游戏的受众做大。</p>\n  <p>就像制作者在游戏寄语中提到，“希望更多的人能通过我们的游戏，体会到篮球的热血……降低玩懂篮球的门槛，无痛体会赛场的热血与对抗”。《篮球少女》没有选择走赛马娘那样养成周期长、手操频率高的老路，反而可能是它能爆火的关键。制作组不断在操作门槛上做减法，玩家仅需要为主力球员做好关键决策即可。</p>\n  <p>为了加快比赛节奏，游戏还移除了赛场上对于“犯规”的惩戒，采用类似“石头剪子布”一样的卡牌玩法，以力量、技巧、运控三色卡构建克制循环，即使是从未上手过篮球的玩家，也能秒懂其中的操作技巧。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_b8a26e6b0fe14e1392a9d3ab7b8be13d@6449318_oswg384058oswg1080oswg594_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>这种简单化的处理并没有让游戏失去“运动味”，你可以看到《篮球少女》对于每个球员的属性都表现得相当严谨。不仅是身高体重，玩家可以从球员的个人档案中查看所有专业数据，惯用手、联赛场均得分、臂展、垂直起跳、百米冲刺等都记载得清清楚楚，并且每一项数据都会反馈到具体对局中。</p>\n  <p>例如目前在游戏中身材最高、体重最大的洺瑶，在身体对抗中格外有优势，发动技能“绝望的城壁”时，甚至能将对位角色直接撞倒；而臂展达到188cm的千圣，在抢篮板这一块几乎是无人匹敌。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_0422bc95d1434905a9856ab2636d0e3c@6449318_oswg345518oswg1080oswg561_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内截图</p>\n  <p>制作组埋藏的种种细节，能让玩家感觉到《篮球少女》的乐趣并不是聚焦在某一点，比赛内容追求精彩的演绎，但为对局进行锻炼与筹备的过程也同样能令人兴奋。</p>\n  <p>玩家能收集闪卡解锁球员立绘，也能玩大富翁赚取游戏道具，当推演训练剧本时，还能与球员们穿上泳衣一起去看看海滨的风景。你能很明显地感受到自己是真正融入了一种完整的生活，校园的一切人物、一切行为都有着让人感到熟悉的温度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_6a09bbcee0d1409bbb2f575e600ba7dc@6449318_oswg874335oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内CG图</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_1014478b37284c7abd920bc90d8b54f1@6449318_oswg920929oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内CG图</p>\n  <p>事实上，对于很多人来讲，篮球已经成为“运动”一词在青春中的一个代号，与赛场上的少女们产生共鸣，并不以打过篮球比赛为先决条件。当赛事解说员的激情播撒整个赛场，不管你是否打过球，你会自然地想为这支队伍赢下所有。而当皮球伴随哨响落向地面，你又能意识到，不论输赢在哪一方，赛场上的每个人都与那颗篮球一样，他们怀揣着从地上再次弹起的勇气。</p>\n  <p>制作组的愿景想来是成功的，因为就拿我来说，为了实现更佳的队伍搭配，这次踏踏实实地看完了一个多小时的篮球基础知识介绍。让更多人认识篮球、喜爱篮球，“篮娘”做得可能比大多数人预想的还要好。因为青春的矛盾谁都有，未必每个人都有一个标准答案，从篮球的故事中找到曾经的自己，并没有太高的门槛。</p>\n  <p>本文<a href=\"https://mp.weixin.qq.com/s/1hz-mZUXVFvgfs6F8q7Ikg\" target=\"_blank\">首发自“36氪游戏”。</a></p>", "category": "tech", "published_at": "2026-11-06T07:33:38+00:00", "fetched_at": "2026-11-07T04:22:02.454075+00:00", "fingerprint": "d9e384253aa8d69e"}, {"source": "36氪 - 最新文章", "title": "美的全屋智能锚定A2A：家电互联正从「接口对接」走向「Agent对话」｜最前线", "url": "https://36kr.com/p/4057965347869576?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>全屋智能概念发展多年，行业始终没有跨过规模化普及的门槛。市面上大量产品可以在单品牌体系内流畅联动，一旦跨品牌、跨品类协作，往往就陷入割裂。</p>\n  <p>近日，美的集团第31届科技月大会在佛山顺德举办，集中展出了美的在技术研发、产品创新与数智转型上的最新成果。</p>\n  <p>美的全屋智能总经理尚喆博士在科技月期间的采访中指出，长期以来，全屋智能行业的卡点并不来自单体硬件性能，而是三道系统性约束：异构设备的数据孤岛难以打通；智能交互的实际效果与用户预期存在落差；系统部署调试的工程门槛对普通家庭不够友好。</p>\n  <p>硬件本身的性能已经可以满足基础使用，但体验短板集中暴露在系统协同层面。这三道表象问题背后，藏着同一个结构性矛盾：行业并不缺少互联互通的主观意愿，却始终没有形成一套低成本、可大规模复制的跨品��、跨品类协同技术范式，多数合作只能停留在点状项目试点，难以向海量普通家庭普及。</p>\n  <p>比如主流的云云点对点API对接方案，这套实现路径逻辑直观，却存在难以回避的规模缺陷，对接成本会随着合作生态数量呈指数级上涨。</p>\n  <p>“假设A厂商、B厂商各自有上千款设备，双向打通就意味着海量接口开发、持续联调与后期维护。”尚喆博士算了一笔产业账，每接入一个新的合作生态，就要重新完成一轮接口适配。这就决定了API模式只适合打造少数案例，不适配支撑大范围的设备互联，这也是行业生态难以破局的技术根源之一。</p>\n  <p>当大模型浪潮下，AI Agent开始成为家庭、车载系统的能力中枢，行业出现了另一条解题思路：Agent to Agent（A2A）。</p>\n  <p>A2A 的核心思路，不再是为每一台设备单独写对接接口。简单来讲，是由两方的AI智能体直接对话：一方把用户的真实需求传递过去，交由合作方的智能体自行判断这件事能不能做，再调度自家设备完成动作，最后把执行结果反馈回来。</p>\n  <p>如果碰到涉及家庭安全等敏感信息操作，Agent会将选择权交还到用户手上确认。整套协作只需做好两套AI Agent间统一的沟通语言，无需再对各式各样的硬件逐个做开发适配。</p>\n  <p>据尚喆介绍，美的与奇瑞iCAR已完成A2A对接，iCAR车型已接入美的美居平台，实现车家互联。车主在车内用自然语言下达指令，就能查询家中耗材余量，后续还可延伸至语音触发补货。这一步已经突破了传统“车控家”的开关联动，设备之间不再是简单的指令转发，而是跨系统的业务级任务协作。</p>\n  <p>支撑美的A2A平台的技术底座，是美的自研家庭智能体MevoX。它区别于市面上多数仅能应答显性指令的语音助手，具备两大核心能力：一是深度推理。面对用户模糊、不完整的表达，MevoX能结合空间范围、设备归属和环境情境拆解真实意图，而不是停留在字面指令的匹配上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_34bb6c9c8aa049c796b39f1c63a4f601@6022551_oswg4917407oswg4720oswg3148_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">美的自研家庭智能体MevoX（图源/企业）</p>\n  <p>二是长期记忆。用户的使用习惯会被持续沉淀下来，后续调节灯光、空气等个性化参数时，系统会默认用户更偏好的设定，让全屋智能交互逐步走向千人千面，而不是每次从零开始。</p>\n  <p>叠加美的多年的家电智能化积累和全品类硬件矩阵，构成了MevoX在真实家庭场景里的能力纵深：前端能接住模糊意图，后端能调动具体设备，中间基于上下文记忆把一次次交互串起来。这不是单点技术的堆叠，而是从理解意图到执行落地的完整链路。</p>\n  <p>落到业务策略层面，美的选择定位为家庭侧能力供给方，坚持向外开放互联，与外部车载、移动端Agent建立协作关系。</p>\n  <p>目前，美的已同华为、vivo、OPPO、荣耀等头部手机厂商，及比亚迪、蔚来、长安、奇瑞等核心车企实现人车家互联。今年，美的作为家电行业中首个将家庭智能体A2A与生态伙伴打通的企业，已率先实现了与千问、微信小微、荣耀yoyo助手和奇瑞汽车的智能体深度协同。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_d73c14017487488c9b507e77be60a8e6@6022551_oswg5366585oswg3200oswg1800_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">首个将家庭智能体A2A与生态伙伴打通的家电企业（图源/企业）</p>\n  <p>当前，行业底层硬件协议的标准化建设也在同步推进。如由工信部组织、美的作为核心工作组成员、多家企业共同参与制定的多项家电互联互通标准从去年八月启动相关工作以来，到今年九月底，已有五项标准草案基本制定结束，十月起进入技术标准测试验证阶段，预计明年1月完成��证并进入公示。这套标准要解决的，正是不同品牌设备间的互联互通难题。</p>\n  <p>车家互联方面，美的还联合中国信通院、比亚迪等机构和企业，以及相关行业组织，共同推进车家互联标准相关工作。美的正把开放连接从企业间的点对点对接，推向更广泛的产业协同。</p>\n  <p>从产业周期视角来看，全屋智能的竞争范式已经迎来迭代。衡量企业竞争力的核心锚点，正由硬件单品、设备接入的规模指标，逐步转向 Agent 的推理能力与跨生态协同效率。</p>\n  <p>而随着A2A智能体互操作范式实现成熟落地，最直接的产业效应就是跨厂商协同边际成本大幅降低。中小厂商不必投入高额研发成本逐一对接多套生态，异构硬件也可打破品牌壁垒，围绕用户场景完成联动。</p>\n  <p>其带来的深层变革，是生态架构的迭代，传统“中心化平台+接入伙伴”的模式，有望演进成多Agent对等协作的“分布式”网络。头部企业的壁垒不再来源于生态圈地，中小厂商无需依附外部平台获取场景入口，竞争焦点将回归企业自身核心能力。</p>", "category": "tech", "published_at": "2026-11-06T11:08:17+00:00", "fetched_at": "2026-11-07T04:22:02.454071+00:00", "fingerprint": "7ba87aab3b7f4791"}, {"source": "36氪 - 最新文章", "title": "科氪 | 荣耀李健：以用户为中心，共建入口、共筑信任， 开启智能经济时代AI终端生态新范式", "url": "https://36kr.com/p/4058473008616581?f=rss", "summary": "<p>荣耀CEO李健在2026移动网络大会发表主题演讲，围绕“以用户为中心，共建入口、共筑信任、共创未来”分享对智能经济时代产业演进的思考。他提出，AI入口之争并非存量零和博弈，行业应以赢得用户信任为导向，开放协同，让入口主权回归用户，共创智能经济新生态。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261107/v2_27d9c7b04b6c435d9ae28fab4c19fbaf@517825446_oswg917317oswg5602oswg3735_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方供图</p>\n  <p>李健表示，算力、大模型与具身智能深度融合，正在重塑产业、经济和社会底层逻辑，AI带来的不是局部功能微调，而是全行业工作流与生产范式的颠覆性重构。但当下，用户日常交互仍持续陷入繁琐切换App、反复操作的消耗之中，人机交互大多停留在“人找服务”的阶段。</p>\n  <p>&nbsp;</p>\n  <p>在李健看来，决定商业范式走向的核心变量是“稀缺”，产业演进史本质上就是稀缺要素迭代的过程：移动通信经济时代连接充足、信息稀缺，对应内容变现的通道经济；移动互联网经济时代注意力稀缺，形成流量变现的注意力经济；迈入智能经济时代，意图委托成为新的稀缺，商业逻辑转向按结果变现的意图经济。过去入口是可供点击的图标，未来入口诞生于用户产生意图的瞬间，价值核心蕴藏在每一次被用户托付的结果之中。</p>\n  <p>&nbsp;</p>\n  <p>从意图生成到结果交付，全行业仍需要跨越三道门槛。智能能力持续突破边界，长期记忆能力让AI愈发善解人意，但智能服务越主动，信任层面的挑战就越突出：其一为智能稀缺，考验AI能否落地办事；其二为上下文稀缺，考验AI能否读懂用户，AI不缺基础能力，缺少对用户身份、场景、需求、过往行为的感知；其三为信任稀缺，考验AI是否值得托付，上下文属于用户个人主权资产，授权与否取决于AI能否做到可信、可靠、可控。“能力决定AI能走多快，信任决定AI能走多远。”李健说。</p>\n  <p>&nbsp;</p>\n  <p>这一判断也和当前行业竞争趋势相呼应。高盛年初研报将2026年定义为中国互联网行业 “关键之年”，行业竞争范式已经从流量、规模比拼，转向入口控制权与商业闭环兑现。Omdia资深分析师钟晓磊认为，AI手机竞争正从“App入口之争”转向“AI任务调度权之争”，手机厂商承担意图理解与任务调度角色，互联网企业供给具体服务，商业利益分配仍存在博弈空间。</p>\n  <p>&nbsp;</p>\n  <p>国家网信办等三部门联合印发的《智能体规范应用与创新发展实施意见》，明确将安全、可靠、可信作为产业发展底线，而这条底线最终要落到离用户最近的终端之上。终端既是用户意图的天然载体，也是信任的天然护盾，看得见、摸得着，深度嵌入用户生活；数据权限由用户自主掌控、可留在本地，它不只是一块屏幕，既是意图的入口，也是信任的出口。荣耀的目标，是让智能渗透到用户每一台终端、每一处场景，推动万物有灵、人机共生，让智能普惠日常，最终成就更强大的人。</p>\n  <p>&nbsp;</p>\n  <p>作为AI终端生态公司，荣耀秉持AHI“智启人本”理念，主张AI的价值是增强人而非替代人。继此前提出IQ（智能度）、EQ（生命感）两大维度之后，李健在本次大会新增 TQ（信任度），将其作为AI进化的第三个核心维度。他以荣耀 Magic9传承经典阿莱三镜头转塔设计作比喻：IQ、EQ、TQ就是荣耀AI的三镜头转塔，三者协同，AI才能从“会办事”升级为“可信赖”；缺少 TQ 约束，IQ、EQ 越强，潜在风险越高。荣耀以此为基础打造 “用户共生型YOYO智能体”——它是高效助手、懂人的伙伴，更是和用户共生的数字分身，唯一使命是理解、增强、守护用户。</p>\n  <p>&nbsp;</p>\n  <p>李健谈到，“入口无需争夺，信任自会汇聚。”过往行业常以封闭筑墙打造护城河，但用户生活本无边界，割裂的生态壁垒，最终会割裂连贯的智能体验。荣耀要打造的入口，不是抬高围墙，而是拓宽通路：一端汇聚各类服务生态，立足真实用户需求与场景；另一端汇聚模型生态，打通云端模型、算力供给与全链条 AI 服务供给。</p>\n  <p>&nbsp;</p>\n  <p>面向未来，荣耀将携手中国移动以及生态伙伴开放共创，搭建以用户为中心的智能经济生态：共建入口，YOYO联动灵犀、千问、豆包、Gemini等伙伴搭建智能体网络，针对差异化的用户需求，提供丰富、多元的解决方案；共筑信任，和中国移动共同搭建覆盖可信网络、可信身份、可信结算、可信运营、可信终端的完整信任链条，让智能服务不止是效率工具，更是可靠伙伴；共创模式，荣耀与中国移动联合，在荣耀Magic9系列定制机上首发 Token套餐，荣耀也将联合更多合作伙伴，围绕Token分发、用户订阅、定制终端、服务分发持续探索全新商业模式。</p>\n  <p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261107/v2_cc0362f78ae34e0788e137b6b7908641@517825446_oswg1042353oswg5112oswg3408_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方供图</p>\n  <p>李健引用乌镇世界互联网大会相关表述谈到，科技应增强人的能力、拓展人的选择、彰显人的价值、增进人的福祉，技术的尺度，最终是人的尺度。“过去，入口是一个APP 图标；今天，入口是用户产生意图的那一刻。”李健说。交互范式正从点击图标转向意图直达，未来入口不属于任何单一厂商，行业真正该回答的，不是“入口归谁”，而是“如何把最好的体验交给用户”。当意图成为入口、Agent自主行动、智能无处不在，入口主权在用户，智能根基在信任，AI未来在共创。</p>", "category": "tech", "published_at": "2026-11-06T16:12:19+00:00", "fetched_at": "2026-11-07T04:22:02.454068+00:00", "fingerprint": "bb4968c07741fb82"}, {"source": "36氪 - 最新文章", "title": "9点1氪丨豆包工作个人版取消5小时额度限制；人类低温纪录被打破；美科技股反弹，SpaceX市值一夜暴涨9653亿", "url": "https://36kr.com/p/4058997417563266?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI完成110亿美元新融资，估值1.25万亿美元&nbsp;</li>\n   <li>美国企业支付开源模型费用89%流向中国</li>\n   <li>宝马中国辟谣气囊召回短信</li>\n   <li>谷歌加入科技企业裁员大潮</li>\n   <li>日本股市进入技术性熊市，日经225指数盘中跌超6%</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>豆包工作个人版取消5小时额度限制</strong></p>\n  <p>记者获悉，11月6日起，豆包工作个人版取消5小时额度限制。调整后，个人用户不再受到5小时短周期额度限制，可以在周额度范围内，根据实际工作节奏灵活安排使用时间。周额度及其他使用规则仍以对应套餐为准。据了解，此前豆包工作个人版与市面上主流大模型类似，采用5小时、7天双周期额度管理。即使周额度仍有剩余，用户在达到5小时额度上限后，也需等待短周期额度重置才能继续使用。（贝壳财经）</p>\n  <h4><strong>人类低温纪录被打破</strong></h4>\n  <p>11月6日，中国科学院空间应用工程与技术中心发布中国空间站最新科研成果。我国科研团队利用中国空间站梦天舱的超冷原子物理实验柜，制造出已知最冷人造物质，刷新人类最低温物质纪录，朝着绝对零度再进一步。绝对零度，即零下273.15摄氏度，是宇宙里最低温度的下限。按照热力学第三定律，人类只能无限接近它，却永远无法真正达到。在本次探索极低温实验中，科研团队利用全光阱冷却技术，成功将中国空间站超冷原子实验柜中的铷原子云等效温度降至9.7皮开尔文，这是室温下物质温度的约一百万亿分之一，并持续观测了7秒。（财联社）&nbsp;</p>\n  <p><strong>美科技股反弹，SpaceX市值一夜暴涨9653亿</strong></p>\n  <p>美东时间周五，美股三大指数收盘涨跌不一，道指跌0.46%，标普500指数涨0.31%，纳指涨1.09%。板块方面，大型科技股涨跌不一，特斯拉涨4.23%，英伟达涨2.78%，脸书涨0.84%，谷歌涨0.78%，亚马逊跌0.35%，苹果跌0.52%，微软跌0.99%。存储芯片股多数走强，希捷科技跌1.19%，闪迪涨3.55%，美光科技涨5.12%，西部数据跌1.44%，SK海力士涨2.78%。SpaceX涨超8%，市值一夜大涨约1446 亿美元（约合人民币9653亿元）。半导体股全线收涨，超威半导体涨11.04%，英特尔涨7.71%，台积电涨6.26%，高通涨5.52%，阿斯麦涨5.02%，ARM涨4.74%，博通涨0.74%。（中新经纬）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI完成110亿美元新融资，估值1.25万亿美元，软银、红杉资本等参投</strong></p>\n  <p>据知情人士透露，OpenAI已完成约110亿美元的新融资，这是本轮估值1.25万亿美元融资的首笔部分。资金已于周五划入公司账户。本轮剩余部分——总额可能增至最高200亿美元——预计将在未来数周内完成。在推迟了首次公开募股（IPO）计划后，这家AI开发商已就一轮大额融资洽谈了一个多月。OpenAI最初计划以1.4万亿美元估值融资300亿美元或更多，随后在AI板块遭遇公开市场暴跌的背景下缩减了计划。参与首笔交割的投资者包括Coatue Management和T. Rowe Price。本轮其他投资者包括软银集团、红杉资本、Founders Fund和Andreessen Horowitz。一个来自阿联酋的投资者财团也已加入。OpenAI正与投行合作，向高净值个人和零售投资者募资。（华尔街见闻）&nbsp;</p>\n  <h4><strong>Meta收购AI代码初创公司Conductor</strong></h4>\n  <p>多名知情人士透露，Meta收购了AI代码初创企业Conductor，这款产品可以让程序员同时管理多个代码智能体。代码已经成为AI落地、抢占企业开支的关键赛道，Meta正加入OpenAI等AI巨头的竞争，争夺开发者工具生态。这笔收购体现Meta持续加码AI的野心，将为其自研模型与生态打下基础，争夺开发者群体——开发者是AI最重要的核心用户。（新浪财经）</p>\n  <h4><strong>谷歌推出Gemini Omni 1.2 Flash，价格下调30%</strong></h4>\n  <p>当地时间11月5日，谷歌宣布正式推出视频生成模型Gemini Omni 1.2 Flash，并在Gemini API和Gemini for Business中全面开放。谷歌表示，Gemini Omni 1.2 Flash引入了原生15秒视频创作、多轮对话式编辑功能以及增强的参考遵循能力。该模型价格较Gemini Omni 1.1下调30%，720p分辨率下定价为每秒0.07美元。（界面新闻）</p>\n  <h4><strong>OpenAI推出网络安全模型GPT-6 Cyber</strong></h4>\n  <p>北京时间11月6日，OpenAI宣布推出GPT-6 Cyber，一款经过训练、能够发现并验证可被利用的漏洞，同时始终不超出研究人员所设定范围的网络安全模型。GPT-6 Cyber首批通过API与Codex向一小部分获批的Daybreak Red客户开放，并将逐步把访问范围扩大到所有DaybreakRed客户，同时也将GPT-5.6 Cyber开放给全体Daybreak Red客户。（界面新闻）</p>\n  <h4><strong>Anthropic为Claude上线个人理财功能</strong></h4>\n  <p>Anthropic宣布，将为Claude推出个人理财功能。在公司筹备IPO的时间点，理财咨询一直是用户向这款对话机器人咨询最多的需求方向之一。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <h4><strong>美国企业支付开源模型费用89%流向中国&nbsp;</strong></h4>\n  <p>硅谷知名风险投资机构门罗风投（Menlo Ventures）发布的《2026年企业AI现状报告》显示，美国企业用于开源模型的支出中，89%付给了中国模型。前三名中，Kimi占61%，DeepSeek占15%，GLM占11%。</p>\n  <p>在全球AI模型聚合平台OpenRouter上，10月26日至11月1日这一周，中国大模型词元（Token）调用量已连续27周超过美国模型。当周平台模型调用量排名前五的模型中，中国模型占据四席。（第一财经）</p>\n  <h4><strong>小米汽车架构调整：成立国际业务部，副总裁于立国兼任总经理</strong></h4>\n  <p>11月6日消息，据新浪科技报道，小米汽车近日宣布迎来架构调整，成立国际业务部，任命汽车部副总裁于立国兼任国际业务部总经理，向集团CEO、汽车部总裁雷军和集团总裁卢伟冰双线汇报。同时，小米汽车国际业务部下设汽车国际市场部，相关工作向国际业务部总经理于立国和集团副总裁、CMO许斐双线汇报。下设GTM部、销售部、 网络发展部、交付物流部、用户服务部、综合管理部、海外各地区部，相关工作向国际业务部总经理于立国汇报。（新浪科技）</p>\n  <p><strong>中国石油、宇树科技，联手新设合营企业</strong></p>\n  <p>据北京市市场监督管理局近日公示信息，中国石油集团昆仑制造有限公司（下称“昆仑制造”）及其一致行动人昆仑资本，拟与宇树科技股份有限公司（下称“宇树科技”）、北京泛界智能科技有限公司（下称“泛界智能”）签署协议，共同新设一家合营企业。该合营企业将主攻工业具身智能机器人解决方案业务，目前相关经营者集中简易案件已进入公示期，公示期为2026年11月4日至11月13日。根据公示的股权结构，交易完成后，昆仑制造及其一致行动人将合计持有合营企业60%的股份，宇树科技与泛界智能则各持有20%股份，三方将共同控制该合营企业。（财联社）</p>\n  <h4><strong>OpenAI承诺公布数据中心用水量，并委托进行独立的噪音研究</strong></h4>\n  <p>OpenAI周四表示，将公布其数据中心的用水量，公开建设方案，并在数据中心投入运营前委托进行独立的噪音研究。该公司还承诺，不会要求与其讨论这些备受争议的设施的公职人员签署保密协议。在至少38个司法管辖区的选民通过限制或禁止数据中心建设的法案两天后，OpenAI发布了其“国家社区契约”。（新浪财经）&nbsp;</p>\n  <h4><strong>韩国股市今年第11次触发熔断</strong></h4>\n  <p>韩国综合股价指数（KOSPI）今天（11月6日）暴跌，跌幅超过8%，触发熔断机制，暂停交易20分钟。这是韩国有价证券市场今年第11次触发熔断。熔断解除之后，有价证券市场触发暂停程序化交易卖单的临时停牌机制。KOSPI自今年2月6日以来再次失守5000点，据分析，在美国民主党赢得中期选举的背景下，市场担忧人工智能数据中心项目将面临监管风险，导致美国股市遭遇科技股大抛售，KOSPI受此影响大跌。据财联社消息，韩国财长称，股市对外部因素反应过度。韩国经济基本面稳健，需警惕市场过度恐慌。将主动出手，避免市场恐慌情绪进一步发酵；将以最高警戒级别监控股市；将放宽融资投资相关监管，平抑市场波动。（CCTV国际时讯）</p>\n  <h4><strong>美股持仓遭遇大跌，但斌回应</strong></h4>\n  <p>美股科技股昨夜遭遇大幅抛售，东方港湾董事长但斌旗下海外基金此前披露的多只重仓股也在下跌之列。11月6日上午，面对市场对AI投资前景的担忧，但斌在社交平台回应称，可以承认这是一次阶段性冲击，但就此判定AI时代落幕，他认为概率极小。（财联社）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261107/v2_a7d83188269a4a868d5a64bbc9639a64@1200352198_oswg536951oswg714oswg922_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片：微博截图</p>\n  <h4><strong>谷歌加入科技企业裁员大潮</strong></h4>\n  <p>谷歌正在推出自愿离职补偿方案；与此同时微软、甲骨文、Meta也在收缩人员规模。今年大型科技企业的裁员+买断离职总人数已经突破10万人。无论裁员动因是AI带来的效率提升，还是数据中心巨额开支造成的压力，裁员节奏几乎没有放缓迹象，甚至可能进一步加速。（新浪财经）</p>\n  <h4><strong>三星电子越南手机基地面临关税风险</strong></h4>\n  <p>越南是三星电子最大智能手机生产基地。随着美国总统特朗普加码关税政策，越南正面临越来越大压力。美国政府正在调查越南的知识产权保护情况，计划在本月底决定是否征额外关税。三星销往美国市场的智能手机有很大一部分在越南生产，一旦加征关税，将冲击其定价能力与利润率。美国贸易代表办公室（USTR）6日称，美方计划在29日完成针对越南知识产权保护与执法情况的301调查。（新浪财经）&nbsp;</p>\n  <h4><strong>Martine Rose出任巴黎世家创意总监，11月16日正式履职</strong></h4>\n  <p>11月6日，开云集团宣布，英国时装设计师马丁·罗斯（Martine Rose）出任旗下品牌巴黎世家创意总监，将于11月16日在巴黎正式履职。（界面新闻）</p>\n  <h4><strong>宝马中国辟谣气囊召回短信</strong></h4>\n  <p>11月6日，宝马中国发布声明：近期发现有不法分子冒充宝马官方，以“车辆召回”为名实施电信诈骗。近期流传的此类“召回通知”均非宝马官方发布。宝马官方发布的召回通知不会以任何名义引导车主提供银行卡、验证码等敏感信息，或进行转账、付款等操作。如需确认车辆是否涉及官方召回，请通过国家市场监管总局缺陷产品召回技术中心官方渠道进行查询，或联系宝马客户服务中心、宝马授权经销商进行核实。（界面新闻）</p>\n  <h4><strong>日本股市进入技术性熊市，日经225指数盘中跌超6%&nbsp;</strong></h4>\n  <p>11月6日，随着全球科技股抛售潮蔓延，日本股市遭遇重挫。日经225指数开盘后持续走低，盘中跌幅一度扩大至7%，跌破备受关注的60000点整数关口，较今年6月份创下的历史峰值回撤超过20%，正式步入技术性熊市区间。个股方面，AI及半导体产业链成为抛售重灾区，东京电子下跌13%，爱德万测试跌13%，软银集团跌14%。</p>\n  <p>本轮日本股市的剧烈调整，核心导火索在于美国中期选举后市场对AI监管环境的担忧急剧升温。民主党在中期选举中表现强劲，引发投资者对数据中心建设放缓、AI行业面临更严格限制的忧虑，隔夜美股AI板块率先崩盘，费城半导体指数本周累计下挫约16%。（财联社、华尔街见闻）</p>\n  <h4><strong>美股崩跌原因，民主党中期选举大胜引发AI监管恐慌</strong></h4>\n  <p>美东时间11月5日，美股遭遇历史性抛售。纳斯达克综合指数暴跌5.52%，创下19个月以来最大单日跌幅，并较10月6日的历史收盘高点回落超过10%，正式进入技术性回调区间；标普500指数下跌4.36%，道指下跌3.44%，三大股指均创下2025年4月“解放日”关税政策以来最大单日跌幅。据估算，标普500成分股单日市值蒸发约2.9万亿美元，纳斯达克综合指数成分股市值缩水2.5万亿美元，科技七巨头合计蒸发约1.04万亿美元。</p>\n  <p>民主党在11月3日的中期选举中横扫国会参众两院，并在得克萨斯、俄亥俄等数据中心重镇取得州长层面的突破。市场担忧，更严格的AI监管和地方层面对数据中心建设的限制，可能延缓美国AI基础设施投资进程。联邦参议员伯尼·桑德斯公开表示，美国44个选区中有43个在中期选举中投票支持暂停人工智能数据中心建设；亚利桑那州联邦众议员安萨里称，民主党下一届国会的头号要务就是对“超级人工智能”颁布禁令。瑞银分析师估计，美国2028年预计新增的数据中心容量中，约30%可能受到潜在建设暂停的影响。（财联社、新华财经）</p>\n  <h4><strong>Brookfield据悉考虑出售耐克标签供应商Trimco</strong></h4>\n  <p>知情人士称，Brookfield Asset Management Inc.正在考虑出售总部位于香港的标签、包装及品牌识别跟踪产品制造商Trimco，此前已收到对该公司的收购意向。知情人士透露，Brookfield已与潜在顾问就可能的出售事宜进行了初步磋商。他们表示，交易对Trimco的估值可能超过10亿美元。知情人士称，投资公司和行业参与者已对该资产表现出一定兴趣，并补充说正式流程可能要到明年才会启动。Brookfield的一位代表不予置评。（新浪财经）</p>\n  <p><strong>港交所：10月底证券市场市价总值42.4万亿港元</strong></p>\n  <p>36氪获悉，11月5日，香港交易所数据显示：证券市场市价总值于2026年10月底为42.4万亿港元。2026年10月的平均每日成交金额为1807亿港元。2026年首十个月的平均每日成交金额为2638亿港元，同比上升2%。2026年首十个月的交易所买卖基金平均每日成交金额为371亿港元，同比上升8%。2026年首十个月有121家新上市公司，同比上升49%。2026年首十个月的首次公开招股集资金额为4039亿港元，同比上升84%。</p>\n  <p><strong>美股半导体股暴跌冲击A股，“易中天”等科技龙头午间集体发声</strong></p>\n  <p>11月6日午间，中际旭创、新易盛、天孚通信、东山精密、胜宏科技、立讯精密、海光信息、联讯仪器、金发科技等上市公司纷纷在午间发布公告。中际旭创称，行业需求依然强劲，公司正在积极准备物料和产能。新易盛称，目前公司在手订单充足，订单交付及产能扩充正按业务需求推进。天孚通信称，公司将适时研究并依法合规充分运用政策工具，维护公司价值与全体股东利益。东山精密称，本次已累计回购公司股份255,200股，成交总金额为49,99.5万元。11月5日，美股费城半导体指数暴跌12.25%，拖累11月6日A股算力硬件股低开，截至午间收盘，中际旭创、新易盛、天孚通信分别下跌8.78%、7.04%、5.29%。（财联社）</p>\n  <h4><strong>AI监管担忧冲击信用市场，SpaceX违约保险成本创纪录&nbsp;</strong></h4>\n  <p>在周四信用市场的普遍下跌中，SpaceX和CoreWeave在受创最严重的公司之列。民主党横扫国会后，市场担心其可能加强对人工智能行业的监管，这种担忧正在持续冲击市场。AI云计算公司CoreWeave一只债券的收益率飙升至逾17%的纪录高位，而为SpaceX债务违约提供保险的成本也升至历史最高水平。两家公司的股票均大幅下跌。（新浪财经）</p>\n  <h2>投融资</h2>\n  <h4><strong>“阿法纳生物”完成5000万美元A轮融资</strong></h4>\n  <p>36氪获悉，近日，“阿法纳生物”宣布完成A轮融资首关。A轮融资总规模为5000万美元，首关由国中资本领投，合肥产投集团旗下生命健康公司、产投国正，安徽策源产业投资有限公司联合领投，合肥产投集团旗下创业投资引导基金公司追加投资，南京鸿景、深圳久荣、上海钦荔跟投。浩悦资本担任独家财务顾问。本轮融资将主要用于加速阿法纳生物in vivo CAR-T、肿瘤疫苗等核心管线的高效推进，持续迭代TALENT®技术平台，并进一步加强公司在CMC、注册开发及产业化等方面的综合能力。&nbsp;</p>\n  <h4><strong>富锂锰电池企业“陀普科技”完成数千万元融资</strong></h4>\n  <p>36氪获悉，富锂锰电池企业“陀普科技”近日完成数千万元A轮融资，投资方包括淮北集善、安徽恒纳、重庆海特。本轮融资资金用于安徽淮北0.5GWh生产基地的产能扩建，并计划于2027年1月投入生产。</p>\n  <h4><strong>宁德时代旗下贵州新能源公司增资至22亿，增幅10%</strong></h4>\n  <p>36氪获悉，天眼查App显示，近日，宁德时代（贵州）新能源科技有限公司发生工商变更，注册资本由20亿元人民币增至22亿元人民币，增幅10%。该公司成立于2021年11月，法定代表人为陈凌，经营范围包括新兴能源技术研发、电池制造、电池销售等，由宁德时代新能源科技股份有限公司全资持股</p>\n  <h2>上市进行时</h2>\n  <h4><strong>九州云箭启动IPO辅导</strong></h4>\n  <p>36氪获悉，证监会网站披露，九州云箭空间科技股份有限公司于2026年11月5日在上海证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为国泰海通证券。辅导备案报告显示，该公司控股股东为季凤来，持股比例为10.38%。</p>\n  <h4><strong>马克・洛尔旗下Wonder秘密递交IPO申请</strong></h4>\n  <p>食品科技初创企业Wonder周四对外披露，已经秘密提交首次公开募股申请。Wonder今年早些时候完成D轮融资，投前估值达到90亿美元。洛尔9月接受采访时表示，IPO募集资金将用于更多收购。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <h4><strong>杜邦公司第三季度净销售额19亿美元，同比增长4%</strong></h4>\n  <p>11月6日，杜邦公司最新财报披露，2026年第三季度净销售额为19亿美元，同比增长4%；经营性EBITDA（息税折旧摊销前利润）为4.69亿美元，同比增长8%。（界面新闻）</p>\n  <p><strong>安德玛第二财季营收同比下降7%至12.42亿美元，维持全年收入下滑预期</strong></p>\n  <p>安德玛公布2027财年第二季度业绩，营收12.42亿美元，同比下降6.9%；净亏损42.5万美元，上年同期净亏损1881万美元；摊薄后每股亏损接近于零，上年同期亏损0.04美元。毛利率下降30个基点至47%。公司维持2027财年全年营收同比下降中个位数的预期，同时将全年毛利率增长预期从220至270个基点下调至170至220个基点；预计全年营业利润为9900万至1.19亿美元，调整后营业利润为1.40亿至1.60亿美元。（财联社）</p>\n  <p><strong>香港交易所：第三季度股东应占溢利为48.59亿元，同比减少1%</strong></p>\n  <p>36氪获悉，香港交易所公告，2026年第三季收入及其他收益为78.67亿元，同比增长1%；股东应占溢利为48.59亿元，同比减少1%。</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-11-07T01:10:18+00:00", "fetched_at": "2026-11-07T04:22:02.454062+00:00", "fingerprint": "d5a9e87d7a28df45"}, {"source": "36氪 - 最新文章", "title": "成都具身智能公司获千万级天使轮融资，基于开源鸿蒙开发机器人大脑｜硬氪首发", "url": "https://36kr.com/p/4052696726328452?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄楠</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，成都具身大脑公司「奇林波」近日完成千万级人民币天使轮融资，投资方包括成都方寸引擎科技有限公司及天使投资人。本轮资金将重点用于核心技术研发、研发团队建设和市场拓展，为公司持续推进机器脑与多机协作系统的研发、产品化及应用落地提供资金支持。</p>\n  <p>奇林波成立于2025年12月，公司聚焦具身智能核心软件，以机器人自主行动与多机协作为核心方向，致力于让机器人具备持续执行任务的能力，并通过多机协作完成更复杂的工作。</p>\n  <p>联合创始人兼CEO唐佐林具备跨AI算法、嵌入式系统、国产操作系统的复合技术背景；他早年任职摩托罗拉，深耕嵌入式、芯片与驱动开发；后续作为核心开发者参与开源鸿蒙基座、Python国产化框架相关建设。</p>\n  <p>技术差异化方面，开源鸿蒙、国产计算平台适配与本地模型部署是公司的重要研发方向。奇林波团队将国产化基座作为支撑机器人应用、适配不同场景的重要工程基础。</p>\n  <p>其具身机器人可搭载开源鸿蒙系统。奇林波联合创始人唐佐林向硬氪表示，以开源鸿蒙为基座开发具身智能，能够发挥团队在底层系统与软硬件适配方面的技术积累，也有助于公司面向自主可控、数据安全要求较高的场景开展应用。这一优势的前提是系统、芯片与算法能够协同工作。</p>\n  <p>依托在鸿蒙体系上的技术积累，公司已形成稳定现金流订单。团队将相关能力迁移至机器人领域，优先面向中小学与高校，交付桌面履带机器人、桌面机器狗，匹配人工智能普惠教育、鸿蒙+具身智能的教学科研需求。在桌面机型基础上，进一步推进工业级四足机器狗与工业机械臂的应用适配。</p>\n  <p>奇林波整套技术架构分为端云两层，一侧是自研“灵雁引擎”，面向单台机器人的任务理解、规划决策与自主执行。另一侧的“雁阵系统”面向不同形态机器人的任务分配、资源协调与协同工作。</p>\n  <p>单体智能加协作智能的两级结构之上，单机在端侧完成实时响应，云端则在更高层级完成跨设备、跨空间的任务分配与资源调度。</p>\n  <p>目前，“灵雁引擎”支持跨形态适配，可部署于机器狗、机械臂、人形机器人等不同本体，并接入“雁阵系统”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_951677f209b34e9f9afc81e817447b8a@6022551_oswg907751oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">支持多具身机器人落地适配（图源/企业）</p>\n  <p>按照规划，现阶段教育科研场景是其端侧、云端系统重要的打磨与验证载体。团队在教学科研场景中持续迭代“灵雁引擎”与“雁阵”调度系统，并结合不同本体与任务需求，逐步向园区、工业等场景拓展，推进项目应用与实地验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_533f335f338f4122ba8f70aa7b4a7537@6022551_oswg152625oswg1080oswg580_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">灵雁引擎架构（图源/企业）</p>\n  <p>这一架构判断源于唐佐林对行业结构性短板的观察。</p>\n  <p>唐佐林告诉硬氪，随着具身本体数量快速增长，多数本体仍停留在演示与单机作业阶段，缺乏真实工况下持续完成任务的能力。“本体之间的协同是下一阶段的关键缺口，单机智能再强，也无法独立完成需要多设备配合的任务。”</p>\n  <p>以跨楼层巡检场景为例，当一台机器狗巡检中发现突发情况、发出协助请求时，需要系统结合任务规则判断是否需要支援，并协调其他机器人资源。云端大脑负责需求研判、资源匹配与协同调度，再将任务下发至端侧执行。端侧负责“任务如何执行”，云端负责判断“哪台设备来负责、怎么配合”，两层能力相互配合。</p>\n  <p>在教育科研之外，奇林波也关注高风险、低效率、人力难以持续覆盖的工况，定位是与人形成协同互补。以园区夜间巡检为例，人工巡场存在时间盲区，难以持续覆盖重点点位的温度监测；搭载红外热成像模块的机器狗可在点位采集热数据并回传，值班人员在中控端即可完成风险研判。油田、矿山、森林防火等也是公司关注的潜在应用方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_d2f4823808c647109e3518139b69fe52@6022551_oswg1357178oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">搭载“灵雁引擎”的四足机器人进行园区巡检中（图源/企业）</p>\n  <p>硬氪了解到，在当前园区与工业应用探索中，公司将四足机器人作为主要适配本体之一，核心考量是相关场景对结构稳定性和持续作业能力的要求。四足结构在负重、越障和复杂地形通过性上更适配巡检类任务，也便于在现阶段推进适配与实机验证。唐佐林同时表示，公司也关注人形本体，未来若人形机器人在特定场景中形成明确任务闭环，同样可以部署“灵雁”系统。</p>\n  <p>本轮融资后，奇林波将进一步加强机器人应用开发、具身智能算法和工程化团队建设，把研发投入落实到开源鸿蒙与国产计算平台适配、核心软件、模型部署、任务技能与实机验证等环节。通过持续迭代，提升产品的稳定性、可维护性和部署效率，逐步形成能够在不同设备与任务中复用的软件能力。</p>\n  <p><strong>以下为硬氪与奇林波联合创始人兼CEO唐佐林的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：以开源鸿蒙为代表的国产化软硬件栈，在具身智能落地中是差异化叙事，还是重点行业的准入条件？这套选型对交付、成本与行业拓展有哪些实际影响？</strong></p>\n  <p><strong>唐佐林：</strong>在我们看来，国产化软硬件栈既是团队的技术特色，也是面向部分重点行业项目的重要工程条件。公司设备优先采用国产芯片，系统层支持开源鸿蒙或Linux，不依赖单一海外算力生态。这一选择有两层现实逻辑。</p>\n  <p>第一层是行业与项目要求。矿山、油田、能源、政务等场景对安全、合规和数据自主可控的要求较高，部分项目也会对国产化软硬件提出明确要求。供应链、数据与系统能力需要可控，底层算力生态需要减少单点依赖。过去不少具身方案高度依赖单一海外算力生态，一旦涉及重点行业部署或外部供应波动，就容易在准入、交付和长期运维上受限。国产芯片加开源鸿蒙的组合，有助于我们从底层增强系统的自主性。</p>\n  <p>第二层是成本与可控性。国产芯片在满足端侧推理需求的前提下，为采购成本、供货渠道和深度适配提供了更多选择。国产化需要全栈适配能力：系统裁剪、编译优化、驱动适配、算子调优、性能调优，缺一环都难以充分释放硬件算力。</p>\n  <p>这也是我们团队背景上的长板。早期参与开源鸿蒙基座和Python国产化框架建设，让团队对底层系统的裁剪、编译、驱动适配和性能调优有长期积累，能够持续优化国产硬件在机器人端侧的实际运行表现。</p>\n  <p>这些底层能力也可以为不同机器人形态和应用场景的适配提供基础。在教育科研、园区和工业等场景中，设备形态、任务需求和部署条件各不相同，我们希望通过持续适配与验证，逐步沉淀能够复用的软件能力。</p>\n  <p>从落地影响看，国产化选型会影响项目适配范围、交付与运维的自主性，以及成本结构。具身智能要规模化进入能源、矿山、政务等对安全与合规要求较高的场景，需要结合具体项目要求，持续完善国产化适配与工程验证。</p>\n  <p>奇林波团队将国产化纳入系统基座的研发，目的正是让大脑系统从一开始就重视面向不同设备和场景的工程条件。</p>\n  <p><strong>硬氪：通用大模型能力持续增强的背景下，端云协同架构在实时性、可靠性与成本之间如何取舍？</strong></p>\n  <p><strong>唐佐林：</strong>通用大模型强在高层语义理解、开放场景推理和长程任务规划，但机器人真正复杂的部分，是大量强实时、强确定性的物理闭环。抓取、接触、避障、避险这类操作，对反馈延时高度敏感；云端往返的网络抖动，可能影响动作执行的稳定性与安全性。</p>\n  <p>如果所有感知与决策都依赖云端，就绕不开网络时延、带宽占用、断网风险，以及不同应用环境下网络条件不稳定的现实约束。过度依赖云端，会让作业可靠性受到网络条件的较大影响。</p>\n  <p>因此，我们坚持在端侧部署自研“灵雁引擎”，针对机器人物理交互做定向优化：通过模型蒸馏、结构轻量化、算子裁剪和硬件适配，推进高频感知、实时响应与执行能力的本地部署，提升本体在断网或弱网条件下基础作业的连续性；同时保留对大模型的调用通道，处理相对低频的高层语义理解与长程规划。云端“雁阵”系统承担全局调度与多机协同，这部分可以复用成熟的开源大模型能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_1e2c26b75e1b435683abd868a697bc4c@6022551_oswg166732oswg1080oswg576_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">端云架构（图源/企业）</p>\n  <p>这套端云架构的核心，是按任务特性分配算力与职责：强实时、强可靠的物理闭环留在端侧，复杂推理、全局协同、多机调度交给云端。端侧解决“能不能安全、稳定地动起来”，云端解决“多台本体如何协同、任务如何编排”。</p>\n  <p>对机器人的实际应用而言，可靠性是基础要求。端云协同的价值，正在于通过架构分层，在实时性、可靠性与成本之间取得平衡，并根据不同设备和场景的要求调整部署方式。</p>", "category": "tech", "published_at" 、国庆7天、劳动节5天，元旦、清明都是3天，假期后最长的工作日也只有6天。（央视新闻）</p>\n  <p><strong>美股史诗级抛售，前五大身价缩水富豪财富单日蒸发1500亿美元，马斯克一人损失近1000亿美元</strong></p>\n  <p>美股周四遭遇大幅抛售，科技股成为重灾区。盘中，道指、标普500指数和纳斯达克综合指数最大跌幅一度分别达到2.38%、3.57%和5.35%，AI硬件产业链遭遇集中抛售。英伟达一度大跌9%。福布斯实时亿万富豪排行榜显示，美股下跌令全球多位科技富豪身价大幅缩水。埃隆·马斯克单日身价减少912亿美元，跌幅10.50%；戴尔科技创始人迈克尔·戴尔减少205亿美元，跌幅9.60%；英��达CEO黄仁勋减少151亿美元，跌幅8.70%；甲骨文创始人拉里·埃里森减少132亿美元，跌幅8.05%；Meta创始人马克·扎克伯格减少129亿美元，跌幅5.98%。上述五位富豪单日身价合计缩水1529亿美元。其中，马斯克一人身价减少额占五人合计损失的近六成。（财联社）</p>\n  <p><strong>《后会友期》带崩芒果TV</strong></p>\n  <p>11月5日中午，芒果TV出现因热门综艺《后会友期》更新，致服务器过载的大面积登录故障，大量用户反馈账号无法登录、收不到验证码或页面报错，目前平台已恢复正常。据了解，芒果TV是芒果超媒旗下互联网视频平台，由快乐阳光负责运营。芒果超媒近期股价表现活跃，11月5日盘中一度涨超14%，收盘价报32.78元，涨幅9.27%。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>前Claude Code产品负责人宣布加入OpenAI</strong></p>\n  <p>11月5日，Cat Wu在社交平台发文宣布加入OpenAI，担任核心产品（Core Products）产品管理负责人。她此前在Anthropic工作两年，曾参与Claude Code、Cowork和Tag等产品的开发。她表示，自己加入Anthropic时，Claude Code还只是一个内部工具，���后参与了该产品的发展，并称上周五是自己在Anthropic的最后一个工作日。Cat Wu表示，期待与OpenAI产品管理团队及公司员工合作，共同开发能够为用户及团队提供支持、同时让用户保持控制权的智能体产品。OpenAI总裁格雷格·布罗克曼随后转发该帖文，欢迎Cat Wu加入团队。（界面新闻）</p>\n  <p><strong>月之暗面：Kimi Hosted Agents正式发布</strong></p>\n  <p>36氪获悉，月之暗面宣布发布Kimi Hosted Agents（托管智能体），将支撑Agent运行的Harness作为云端服务提供给企业和开发者，企业无需自行搭建和维护运行框架，即可获得7×24小时的托管环境，支持长程任务执行与多智能体高效协作。</p>\n  <p><strong>DeepSeek Harness披露最新数据：日活154万，日耗Token 92万亿</strong></p>\n  <p>36氪获悉，Deepseek披露最新数据，截至11月4日，以使用官方API的用户为统计范围，DeepSeek Harness日活跃用户已达154万，日消耗Token约92万亿。第三方插件数量已增至约3.5万个，约60%的活跃用户制作或安装了至少一款第三方插件。</p>\n  <p><strong>OpenAI推出Images 2.6，图像生成速度提升50%，新增GIF生成功能</strong></p>\n  <p>当地时间11月4日，OpenAI发布图像生成模型Images 2.6，现已面向全球用户开放，支持在ChatGPT、Codex及API中使用。该模型图像生成速度较上一版本提升50%，并增强了多轮编辑中的细节控制和角色、产品及品牌元素一致性。Images 2.6新增GIF生成功能，可将静态图像、角色或产品视觉转化为循环动画。在API端，开发者可选择GPT-Image-2.6 Flare和Sunburst两种版本，并使用图像标注编辑、SVG导出及复杂度参数等功能。其中，Flare在低质量设置下最快可在6秒内生成图像，Sunburst则侧重更高质量和编辑一致性。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>前三季度结婚登记464.8万对</strong></p>\n  <p>民政部最新数据显示，2026年前三季度全国结婚登记464.8万对、离婚登记208.2万对。婚姻登记全国通办累计办理101.4万对，多地推出婚嫁补贴、新婚消费券、红娘奖励等激励政策，同时配套初婚家庭购房补贴、房贷贴息等住房保障举措，降低婚育成本。多地打造文旅婚登新场景，带动\"婚登+文旅\"新业态发展。（第一财经）</p>\n  <p><strong>苹果下调员工AI使用预算，部分工程团队日额度或降至100美元</strong></p>\n  <p>11月4日，据报道，苹果公司正收紧员工使用人工智能模型的预算，以控制成本。据悉，苹果上月已将部分工程师使用AI模型的每日支出上限从300美元下调至200美元，目前计划进一步削减部分工程团队的额度，最低可能降至100美元。部分非工程团队的每日上限已为100美元，苹果还考虑将部分团队的额度进一步降至25美元。员工如需更高预算，可向公司高层申请豁免。苹果员工目前可使用Anthropic的Claude、OpenAI的ChatGPT及谷歌Gemini等服务，部分团队被要求改用成本更低的模型或本地运行的AI模型。苹果2026财年研发支出同比增长32%，公司整体运营支出增长22%至755亿美元。（界面新闻）</p>\n  <p><strong>全球平板电脑出货量创新低，苹果跌近3成</strong></p>\n  <p>Omdia数据显示，2026年第三季度全球平板出货3219.1万台，同比下滑23%，创下近三年单季新低，中东、中国、西欧跌幅居前。头部品牌多数承压：苹果仍居第一，出货1158.1万台，同比下滑27.5%；三星同比下滑21.7%；华为同比跌43%，仅中东欧、亚太局部市场保持增长；小米同比下滑10.6%；联想是前五里唯一正增长的品牌，同比增11.9%。行业分析认为，供应链紧张、新品缺乏差异化亮点，导致消费者换新意愿低迷，机构预判平板市场最早2028年才有望实质性复苏。（界面新闻）</p>\n  <p><strong>POS刷卡成功钱却不到账，鲲鹏支付致歉</strong></p>\n  <p>近期大量鲲鹏支付POS商户反馈，刷卡交易显示成功，但资金迟迟未能结算到账，不少中小商户现金流承压。11月4日鲲鹏支付发布公告致歉，称问题源于清算调度、出款链路及内部风控环节不足，否认平台关停传言。公司已成立专项工作组，优先处理合规交易资金结算，开通登记通道，并向监管部门报备。资料显示，鲲鹏支付前身是钱宝支付，拥有银行卡收单牌照，此前曾被罚没914.35万元、股权遭冻结，行业人士指出，按时结算资金是持牌支付机构的核心信用基础。（界面新闻）</p>\n  <p><strong>“禾与春时”，账号涨粉超60万</strong></p>\n  <p>日前，与辉同行负责人董宇辉在新账号“禾与春时旗舰店”发布视频，正式对外官宣与辉同行旗下自有品牌“禾与春时”。董宇辉在视频中表示，团队在消费品领域深耕约3年，累计发货超7亿单，对消费者诉求有了更深了解。团队调研发现，消费者有特定需求时，当前市场可能缺乏供应或供应不稳，因此决定打造自有产品，深度参与研发生产全链条，将品控向产业前端延伸，从而让消费者满意。目前，抖音店铺“禾与春时旗舰店”已经上线，账号粉丝总量达68.2万。（鞭牛士）</p>\n  <p><strong>OpenAI总裁称公司大部分收入已来自企业业务，预计2027年具备上市条件</strong></p>\n  <p>当地时间11月4日，OpenAI总裁格雷格·布罗克曼在一场科技会议上表示，公司目前大部分收入已来自企业客户，并预计OpenAI将在2027年具备上市条件。在被问及公司明年是否准备好首次公开募股（IPO）时，布罗克曼回答称：\"我认为可以。\"布罗克曼表示，OpenAI正加快企业业务拓展，与竞争对手Anthropic争夺企业客户，并积极推广Codex智能体产品。Anthropic预计可能在2026年年底前上市。此前，OpenAI曾推迟上市计划，目前正加快融资步伐，以把握近期业务增长带来的机会。（界面新闻）</p>\n  <p><strong>苹果拟通过发行美元债券筹集至多70亿美元资金</strong></p>\n  <p>11月5日，据报道，苹果计划通过发行美元债券筹集至多70亿美元资金。（界面新闻）</p>\n  <p><strong>耗资近2700万美元，巴菲特旗下伯克希尔连续3天扫货</strong></p>\n  <p>当地时间11月4日，美国证券交易委员会（SEC）披露的一份文件显示，“股神”巴菲特旗下伯克希尔·哈撒韦在10月30日至11月3日的三个交易日内连续买入卫星广播公司Sirius XM Holdings（SIRI.US），合计92.43万股，耗资约2689万美元。按《巴伦周刊》测算，该持仓约占伯克希尔股票组合的1%，位列前二十大重仓股末段。（界面新闻）</p>\n  <p><strong>联讯仪器:控股股东提议回购1亿元至1.5亿元股份</strong></p>\n  <p>36氪获悉，联讯仪器公告，控股股东、实际控制人、董事长胡海洋提议公司以自有资金或自筹资金通过集中竞价交易方式回购公司部分A股股份，回购资金总额不低于1亿元且不高于1.5亿元，回购股份将用于员工持股计划或股权激励，回购价格不高于董事会审议通过前30个交易日股票交易均价的150%，期限为董事会审议通过之日起12个月内。</p>\n  <p><strong>英国央行加息25个基点</strong></p>\n  <p>英国央行加息25个基点至4.00%，为2023年8月以来首次加息，符合市场预期。（财联社）</p>\n  <p><strong>丰田设立机器人部门</strong></p>\n  <p>11月5日丰田官宣组织架构调整，新设独立机器人事业部，定位为未来核心支柱，由首席生产官志贺武文主管，整合分散研发团队，布局工业、人形、护理服务三类机器人，兼顾工厂自动化升级与对外商业化落地。丰田拥有近50年机器人技术积累，本次是首次将机器人业务升级至和电动化、软件业务并列的战略板块。同步披露的财报显示，其二季度营业利润同比增34.2%，公司上调全年营业利润预期，扩大股票回购规模，财报发布后股价盘中一度涨约13%。（界面新闻）</p>\n  <p><strong>理想汽车：不存在所谓\"气囊召回\"事项</strong></p>\n  <p>11月5日，理想汽车法务部发布声明，提醒车主收到假借理想汽车名义发送的诈骗短信，谎称车辆气囊需要召回，要求限时点击链接办理，还以逾期取消质保进行胁迫。理想汽车表示，气囊召回为虚构信息，该短信以及附带网址均非官方渠道，提醒车主不要点击陌生链接、填写信息和验证码，谨防受骗。（第一财经）</p>\n  <p><strong>高盛和阿波罗寻找买家接盘部分400亿美元SpaceX芯片交易</strong></p>\n  <p>据报道，高盛和阿波罗全球管理公司正在与投资者进行磋商，计划出售SpaceX人工智能（AI）芯片约400亿美元融资方案中的一部分。知情人士称，这两家公司已开始接触潜在买家，并要求部分投资者在正式银团贷款流程启动前购入最高达5亿美元的份额。这笔芯片融资交易的设计旨在避免债务计入SpaceX的资产负债表，报道称，该交易是迄今为止针对GPU的同类交易中规模最大的一笔。（新浪财经）</p>\n  <p><strong>联想集团任命摩托罗拉全球业务新负责人</strong></p>\n  <p>36氪获悉，联想集团近日宣布，任命集团高级副总裁、亚太区总裁Amar Babu为移动业务集团（MBG）总经理兼摩托罗拉全球总裁，自2027年1月1日起正式生效。履新后，Amar将向联想集团执行副总裁、智能设备业务集团（IDG）总裁Luca Rossi汇报，全面负责摩托罗拉全球业务，推动高端智能手机、个人AI及智能设备生态发展。</p>\n  <p><strong>商务部回应欧盟对低价值进口商品叠加征收有关税费</strong></p>\n  <p>欧盟自11月1日起对低价值进口商品征收2欧元手续费，此前已于7月开始征收3欧元关税。商务部新闻发言人黄玲在5日举行的例行新闻发布会上对此表示，中方高度关注欧方有关新规。跨境电商作为国际贸易的新业态、新模式，为全球企业和消费者提供了多元化选择。希望欧方审慎评估相关政策影响，为中欧在电商等领域合作创造有利条件。(新华社)</p>\n  <p><strong>美股三大指数集体收跌，存储、光通信板块重挫</strong></p>\n  <p>36氪获悉，11月5日收盘，美股三大指数集体大幅下挫，道指跌3.44%，纳指跌5.52%，标普500指数跌4.35%并创下自2025年4月以来最大单日跌幅。存储、光通信板块重挫，闪迪跌超22%，西部数据、美光科技跌超17%，Lumentum跌超18%，迈威尔科技跌超16%，海力士跌超13%；大型科技股集体下挫，特斯拉跌超10%，英伟达跌超9%，Meta、微软跌超3%，谷歌、亚马逊跌超2%，苹果跌超1%。热门中概股涨跌不一，网易涨超4%，京东涨超3%，阿里巴巴、拼多多、理想汽车、哔哩哔哩涨超2%，蔚来跌超3%，小鹏集团跌超2%，百度、爱奇艺跌超1%。</p>\n  <p><strong>义乌跨境电商进口规模超去年全年，创历史同期新高</strong></p>\n  <p>截至11月4日，2026年义乌海关监管义乌跨境电商网购保税进口清单量1.1亿单，超过去年全年，创同期历史新高。义乌跨境电商进口规模居全国首位，商品品种丰富，累计进口商品7万多种，主要是食品、化妆品、婴幼儿奶粉、玩具等，来自全球90多个国家和地区。作为义乌跨境电商进口的主要平台，义乌综合保税区和义乌保税物流中心目前集合了130多家跨境电商企业，前10月跨境电商保税进口271.48亿元，同比增长25.63%。（央视新闻）</p>\n  <p><strong>培育钻石再度涨价</strong></p>\n  <p>财联社消息，黄河旋风宣布自11月1日起，培育钻石毛坯大单晶产品提价10%，这是年内第二轮调价。本轮涨价受下游需求回暖、人民币升值带来成本压力等因素推动，印度抛光培育钻石出口数据明显向好，多家金刚石产业链上市公司三季报业绩回暖。被寄予厚望的金刚石散热业务目前仅小批量出货，大规模商用尚需时间，培育钻石仍是行业基本盘。（财联社）</p>\n  <p><strong>C罗宣布从葡萄牙国家队退役</strong></p>\n  <p>当地时间11月5日，葡萄牙球星克里斯蒂亚诺·罗纳尔多通过社交媒体宣布，他正式从葡萄牙国家足球队退役，结束长达23年的国家队生涯。（央视新闻）</p>\n  <p><strong>特朗普中期选举惨败，马斯克删帖</strong></p>\n  <p>美国中期选举民主党拿下参众两院控制权。马斯克本轮为共和党助选投入4.74亿美元，创下非参选捐赠者单选举周期支出纪录，选举日曾在X平台发帖呼吁选民\"投红色\"，该帖在选举结果出炉后被删除。媒体称，马斯克成为本次选举主要失意者之一。（财联社、环球时报）</p>\n  <h2>上市进行时</h2>\n  <p><strong>高新兴：控股子公司创联科技终止北交所上市辅导备案</strong></p>\n  <p>36氪获悉，高新兴公告，公司控股子公司创联科技基于未来战略规划考虑，经与申万宏源友好协商，双方同意终止北交所上市辅导协议，并于2026年11月4日签订终止协议。申万宏源同日向浙江证监局撤回上市辅导备案申请。该事项无需公司董事会及股东会审议，对生产经营不会产生重大影响。</p>\n  <p><strong>崇达技术：控股子公司普诺威撤回北交所上市申请</strong></p>\n  <p>36氪获悉，崇达技术公告，公司控股子公司普诺威基于自身发展战略、市场环境及申报安排的综合考虑，决定撤回向北交所报送的公开发行股票并上市申请材料。该事项已获普诺威董事会审议通过，不构成对上市计划的终止，后续将择机另行报送。本次撤回不会对公司及普诺威生产经营产生重大不利影响。</p>\n  <h2>投融资</h2>\n  <p><strong>\"睿芯行\"完成数千万元新一轮融资</strong></p>\n  <p>36氪获悉，\"睿芯行\"近日完成数千万元新一轮融资，投资方包括创新工场、中力股份及今天国际。</p>\n  <p><strong>\"易博图\"连续完成两轮近4亿元融资</strong></p>\n  <p>36氪获悉，\"易博图\"近日连续完成两轮近4亿元融资，投资方包括投资人葛卫东、辰韬资本、弘毅投资、零一汽车、兴富资本、猎鹰投资旗下星奇基金等。</p>\n  <h2>大公司财报</h2>\n  <p><strong>华虹宏力：前三季度净利润16.03亿元，同比增长138.23%</strong></p>\n  <p>36氪获悉，华虹宏力公告，前三季度实现营收186.11亿元，同比增长14.06%；归母净利润16.03亿元，同比增长138.23%。第三季度实现营收67.06亿元，同比增长13.95%；归母净利润8.35亿元，同比增长136.14%。</p>\n  <p><strong>任天堂上半财年营业利润同比增长49.1%，Switch 2硬件销量达649万台</strong></p>\n  <p>任天堂公布2026财年上半年（2026年4月至9月）业绩，营收为9660亿日元，同比下降12.1%；营业利润为2165亿日元，同比增长49.1%；归属于母公司股东的净利润为2209亿日元，同比增长11.4%。同期，Switch 2硬件销量为649万台，软件销量为2449万份；初代Switch硬件销量为127万台，软件销量为6573万份。数字业务销售额为2496亿日元，同比增长60.5%；IP相关业务销售额为627亿日元，同比增长87.9%。任天堂维持2026财年全年业绩预期不变，预计营收2.05万亿日元，同比下降11.4%；营业利润3700亿日元，同比下降20.7%；归属于母公司股东的净利润3100亿日元，同比下降26.9%。（界面新闻）</p>\n  <p><strong>索尼第二财季营业利润同比增长45.1%</strong></p>\n  <p>索尼集团公布2026财年第二财季（截至9月30日）业绩，季度营收为3.43万亿日元，同比增长10.3%；营业利润为6223亿日元，同比增长45.1%；归属于索尼集团股东的净利润为4496亿日元，同比增长24.2%。2026财年上半年（4月至9月），索尼营收为6.27万亿日元，同比增长9.4%；营业利润为1.10万亿日元，同比增长42.9%；归属于股东的净利润为7918亿日元，同比增长38.8%。索尼预计，2026财年全年营收为13万亿日元，同比增长4.2%；营业利润为1.87万亿日元，同比增长29.2%；归属于股东的净利润为1.33万亿日元，同比增长29%。（界面新闻）</p>\n  <p><strong>丰田上调2027财年营业利润预期至3.9万亿日元，半年净利润同比增长26.1%至2.24万亿日元</strong></p>\n  <p>11月5日，丰田汽车公布2027财年上半年（2026年4月至9月）业绩，营收26.96万亿日元，同比增长9.5%；营业利润2.19万亿日元，同比增长9.2%；归属于丰田汽车公司的净利润2.24万亿日元，同比增长26.1%。丰田将2027财年全年营业利润预期从此前的3.4万亿日元上调至3.9万亿日元，预计营收53.5万亿日元，归母净利润3.57万亿日元。公司还将全年股票回购授权额度增加3000亿日元至最高1.3万亿日元，并计划全年派息每股100日元。（界面新闻）</p>\n  <p><strong>整理丨李琪</strong></p>", "category": "tech", "published_at": "2026-11-06T00:00:34+00:00", "fetched_at": "2026-11-06T04:51:11.652646+00:00", "fingerprint": "bfbba2d07b7094c4"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨轴向磁通电机企业获超亿元融资，产能将达15万台，已合作多家头部车企", "url": "https://36kr.com/p/4057654794982537?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_dcc1c48808464887ad0ce13cbd270f52@6221844_oswg1176965oswg1024oswg1024_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2300</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，轴向磁通电机方案提供商——叁零陆（常州）电气有限公司（下称“306电机”）近期已完成超亿元A轮融资。本轮融资由建信北京、申能诚毅、深高新投、纵横股份（688070.SH）、赫尔墨斯创投等共同投资。资金将主要用于扁线轴向磁通电机的研发投入、新产品开发与产能建设。</p>\n  <p>306电机成立于2016年，起始于电机零部件制造，并较早介入了扁线电机的研发与量产。公司创始人、董事长秦金玉拥有17年创业及企业管理经验，他主导了扁线电机、轴向磁通电机产品及工艺创新发明专利10件。</p>\n  <p>在全球能源转型与装备电动化持续推进的背景下，高功率密度、高扭矩密度、高效率和轻量化正成为电机技术演进的重要方向。</p>\n  <p>相较于传统径向电机，轴向磁通电机采用扁平盘式结构，在体积、重量与集成度上具备显著优势，被视为下一代高效电机的“最优解”。随着工程化量产能力的突破，这一赛道正从早期的技术验证走向商业落地。</p>\n  <p>秦金玉向硬氪表示，团队在产业链中对新技术一直保持敏感，早在2017年便开始“闷着头”做轴向磁通电机的工艺落地与结构研发。与常见的初创公司不同，306电机拥有深厚的工程化量产基因。公司早期成功交付了知名主机厂的扁线电机项目。</p>\n  <p>目前，公司现有扁线电机产能已达30万台/年，并正在建设年产15万台轴向磁通电机产线。这种大规模交付经验，为其在轴向磁通电机领域的量产落地提供了宝贵的基础。秦金玉坦言：“我们经历了扁线电机量产的经验，有这样的产品交付知名主机厂案例，再做轴向磁通的量产，相对来说会比其他同行更有优势。”</p>\n  <p>在核心技术壁垒上，306电机实现了极高的自制率与设备自研。公司电机零部件70%自研自制，涵盖有色金属件、定转子铁芯等。针对轴向磁通电机“散热难、易退磁”的共性难题，团队自研了定子铁芯冲卷机床，将定子铁芯端面平整度控制在0.05毫米以内，并独创了“浸泡+淋油+外部导热”三合一散热方案。这一方案用传统的普通材料便实现了快速散热，推动电机转速突破2万转，为行业提供了可复制的工程化量产路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_775b7429d1aa42f0b103a4a3d47b129f@6221844_oswg684279oswg1047oswg786_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">轴向磁通电机产品（图源/企业）</p>\n  <p>目前，306电机的产品主要围绕新能源汽车、人形机器人、空天产业和算力液冷四大领域展开。秦金玉透露，汽车和算力液冷是目前投入精力最多的两块业务，其中汽车业务在整体盘子中占比超90%。在商业模式上，306电机在汽车领域多采取“共研”状态，与整车厂共同开发；而在机器人、算力液冷等新兴领域，则更多是“黑盒”状态，由公司主导定向开发。</p>\n  <p>秦金玉透露，306电机已连续5年保持50%的营收增长率，其中轴向磁通电机业务近两年增速更是高达100%。秦金玉预计，今年公司轴向磁通电机业务营收可达3000万元左右，随着新产线的投产与客户项目的规模化交付，业绩有望迎来爆发。</p>\n  <p><strong>以下是硬氪与306电机董事长秦金玉的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：轴向磁通电机并非新概念，为何直到现在才被行业广泛关注？其核心技术难点在哪？</strong></p>\n  <p><strong>秦金玉：</strong>从去年年底开始，宁德时代公布了轴向磁通电机上汽车主驱的方案后，行业热度就起来了。</p>\n  <p>过去行业没起来，核心卡点在于“工艺落地”和“低成本批量方案”。批量落地难在设备精度、设计、散热以及基础原材料等多个方面，这些都需要一项项攻克。比如散热，我们走的是“把热带走”的三合一方案，用传统材料实现快速散热，这为我们转速突破2万转提供了前提。目前我们的设备、模具都是自研自制，不对外只对内，这是我们能实现低成本、高可靠性量产的底气。</p>\n  <p><strong>硬氪：目前轴向磁通电机的应用场景中，您最看好哪一块的爆发潜力？</strong></p>\n  <p><strong>秦金玉：</strong>算力液冷和汽车是我们目前最看好的两块。汽车本身量比较大，且随着整个电机的功率密度提高，技术迭代会带来很大的增长空间。目前汽车业务占我们整体的90%以上，但我们同时在开拓电摩、低空经济、机器人等领域。人形机器人和算力液冷这两块我们投入精力较大，像机器人预计要到2028年才会有陆续的放量，但增速会非常快。轴向磁通电机在行业整体替代的渗透率可能在30%，现在几乎是从0起步，增长主要来自新需求与替代的双重驱动。</p>\n  <p><strong>硬氪：您提到公司的竞争优势是“更灵活”和“开源”，面对未来可能的头部企业下场竞争，您怎么看？</strong></p>\n  <p><strong>秦金玉：</strong>我们属于开源性的企业，不会关起门来造车。我们希望推动整个轴向磁通电机行业发展，只有大家一起来把体量推起来，才能在其中分到一杯羹。目前批量能做轴向磁通电机的企业还不多，我们算是其中之一。</p>\n  <p>我们未来的技术迭代方向将围绕汽车、机器人、电摩、液冷展开。在结构上，目前我们主要批量生产双定单转和单定单转两种结构，下一步目标是攻克单定双转批量方案落地，这个我们未来两年的重点。竞争对手各有优势，但我们更看重自身对核心工艺的掌握和场景应用的快速响应。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>申能诚毅首席投资官陈大明表示：</strong>“轴向磁通电机正处在工程化验证向规模化应用过渡的关键阶段，产业竞争的核心不仅是单点参数，更是精密制造、工艺装备、热管理和批量交付的系统能力。306电机以定子精密制造和扁线电机量产经验为基础，持续推进分布式扁线绕组、三合一散热和全新硅钢堆叠轴向单齿铁芯工艺，形成了清晰的技术迭代路径。申能诚毅看好公司在新能源汽车、算力液冷等领域的产业化潜力，也将发挥金融与产业资源优势，支持公司提升研发与规模化交付能力。”</p>\n  <p><strong>深高新投远望谷基金总经理金鑫表示：</strong>“轴向磁通电机正从技术验证加快迈向产业化应用，工程化量产能力是决定技术价值能否充分释放的关键。306电机在扁线工艺、核心装备、精密制造和客户验证等方面形成了较为完整的积累，展现出从技术可行走向商业可行的清晰路径。我们期待通过资本与产业资源协同，支持公司持续提升研发、制造与交付能力，推动高性能电机在更多应用场景落地。”</p>", "category": "tech", "published_at": "2026-11-06T02:20:10+00:00", "fetched_at": "2026-11-06T04:51:11.652640+00:00", "fingerprint": "d4702237b5d8482c"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨富锂锰电池企业完成数千万元融资，已在无人机领域批量出货并实现盈利", "url": "https://36kr.com/p/4057654395736963?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2600字，建议阅读6分钟</p>\n  </blockquote>\n  <p>硬氪获悉，佛山陀普科技有限公司（以下简称“陀普科技”）近日完成数千万元A轮融资，投资方包括淮北集善、安徽恒纳、重庆海特。本轮融资资金用于安徽淮北0.5GWh生产基地的产能扩建，并计划于2027年1月投入生产。</p>\n  <p>陀普科技成立于2019年，是一家聚焦高能量密度锂电池及固态电池技术研发与产业化的企业。公司创始人陈光森博士拥有30余年电池研发与产业化经验，曾先后任职于日本株式会社研究院、新加坡材料研究院、德国Varta电池开发部副经理。2019年，陈光森创立陀普科技，重点布局富锂锰基正极、全硅碳负极及固态电解质等技术方向。</p>\n  <p>高能量密度电池一直面临性能与量产之间的平衡难题。一方面，提高电池能量密度需要突破正负极材料的性能上限；另一方面，材料在充放电过程中的结构变化、界面稳定性及循环寿命，又会影响电池的实际使用表现。尤其是富锂锰基材料长期存在的电压衰减问题，以及全硅负极在循环过程中的体积膨胀问题，都是行业推进相关技术产业化时需要解决的难点。</p>\n  <p>陈光森博士向硬氪介绍，陀普科技目前已围绕富锂锰基正极、全硅碳负极、复合固态电解质及低衰减技术建立起相对完整的技术体系，并推动相关产品进入量产和商业化阶段。</p>\n  <p>其中，公司在准固态（电解液≤10%）电池领域已实现批量交付，量产电芯能量密度达到460Wh/kg，并规划于2027年率先实现电解液≤5%、满足国标 GB/T 43568-2026指标的全固态电池小批量样件交付验证。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_680862efd2c94a398b392788b6777d47@5920579_oswg1046325oswg832oswg1003_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>正极材料方面，陀普科技重点布局富锂锰基材料。相较于传统三元材料，富锂锰基材料具有较高的理论比容量，同时具备低镍、无钴等成本优势。不过，其电压衰减问题长期制约着材料的实际应用。陀普科技通过材料配方优化、补锂工艺及表面改性等技术手段改善材料的电压保持能力和倍率性能。</p>\n  <p>据公司介绍，其富锂锰基正极材料克容量可达300mAh/g，并已开展车规级量产验证，公司已与一汽奔腾在做技术服务对接，并签署保密协议。</p>\n  <p>负极材料方面，公司于2024年推动全硅碳负极技术落地量产。硅材料具有较高的理论比容量，但在充放电过程中体积变化显著，容易造成电极结构破坏和循环寿命下降。针对这一问题，陀普科技开发了原位固态电解质包覆技术，以改善材料膨胀过程中的界面稳定性。据介绍，其全硅碳负极可实现稳定循环700次，搭配自研正极体系后，电芯整体循环次数超过500次，量产电芯能量密度达到460Wh/kg。</p>\n  <p>在固态电池方向，陀普科技选择氧化物与聚合物复合电解质路线，希望在安全性、离子传导能力和现有生产设备适配性之间取得平衡。与硫化物路线相比，该路线对产线改造幅度更小、工艺兼容性更强、产业化落地更快、量产确定性更高。公司目前已完成相关实验室扣式电池验证，正在推进全电池测试，并计划进一步降低电芯中的液态电解质含量，向更高固态化程度的产品演进。</p>\n  <p>除材料体系外，陀普科技还布局了电芯低衰减技术，通过材料配方、电芯结构、界面调控及制造工艺的协同优化，改善电池在长期循环中的容量保持表现。公司称，相关技术已应用于不同电池材料体系，目标是延长电芯有效使用寿命，可实现500–700次循环后容量保持率≥80%。</p>\n  <p>从商业化进展来看，无人机电池是陀普科技目前的主要业务，其400Wh/kg级高能量密度电池已稳定供货两年，460Wh/kg电池已实现批量交付。无人机对电池的能量密度、瞬时放电能力和重量较为敏感，因此成为高性能电池率先落地的细分市场。相比新能源汽车等领域，无人机电池的验证和应用场景相对集中，也为高性能电池产品提供了商业化切入口。</p>\n  <p>公司还将高倍率电池拓展至高速电摩领域，相关产品支持持续8C、瞬时12C放电，并已与快轮科技、悍能等品牌开展合作。此外，公司布局了超薄高能量密度充电宝产品，相关产品已通过3C认证。2026年，公司预估营收1.8亿–2亿元，并已实现盈利。</p>\n  <p>产能布局方面，陀普科技目前以佛山为总部和研发中心，拥有电芯中试线及PACK产线；安徽淮北基地则是本轮融资后的重点扩产方向，建设2万多平方米的富锂锰基正极材料合成及电芯量产产线并实现90%自动化，进一步支撑高能量密度电池产品的规模化交付，将于2027年1月投产。</p>\n  <p><strong>以下为硬氪与创始人陈光森博士交流节选：</strong></p>\n  <p><strong>硬氪：为什么全固态电池选择氧化物与聚合物复合路线，而不是目前更受关注的硫化物路线？公司在富锂锰材料上的积累，又将为固态电池研发带来哪些优势？</strong></p>\n  <p><strong>陈光森博士：</strong>不同固态电解质路线各有优劣。硫化物电解质的离子电导率较高，但对水分敏感，遇水可能产生有毒的硫化氢气体，因此对生产环境、设备和安全管理的要求较高，产业化投入也比较大。</p>\n  <p>相比之下，氧化物与聚合物复合体系更容易与现有电池制造设备衔接，可以在一定程度上降低产线改造成本。不过，氧化物材料本身较硬，与电极之间容易产生较高的界面接触电阻，需要通过聚合物和界面工程改善接触及离子传输。目前，公司正在围绕这些问题持续推进技术验证。</p>\n  <p>陀普科技的优势在于，我们已经在富锂锰材料的产业化方面积累了技术和量产经验。无论采用氧化物、卤化物还是硫化物电解质，固态电池最终都需要解决成本和规模化生产的问题。我们希望将富锂锰材料与固态电池技术结合，在提高能量密度的同时，进一步降低电池成本。长期来看，我们看好富锂锰固态电池的产业化前景，认为这有望成为公司未来的重要竞争优势。</p>\n  <p><strong>硬氪：目前公司约90%的出货量来自无人机电池，未来在应用场景拓展上还有哪些考量？</strong></p>\n  <p><strong>陈光森博士：</strong>现阶段，我们优先布局无人机电池，主要是因为这一市场与公司的技术优势比较匹配。无人机对电池的能量密度和倍率性能有较高要求，既希望电池尽可能轻，又需要满足飞行过程中的瞬时大电流放电需求。我们的高硅碳负极技术能够支持400Wh/kg以上的电芯能量密度，并满足高倍率放电需求。目前，无人机电池已成为公司的主要出货产品和利润来源。相比之下，新能源汽车电池市场竞争更加激烈。因此，我们希望先在高性能细分市场建立优势，待产能进一步提升后，再逐步拓展汽车电池业务。</p>\n  <p>与此同时，我们也在布局其他应用场景。例如，利用现有电池技术开发超薄充电宝产品，并进一步拓展高速电摩市场。目前，公司正在推进相关业务合作，也在关注越南及东南亚市场的机会。</p>\n  <p>此外，我们正在关注数据中心储能等新兴需求。随着数据中心对供电能力和储能系统的要求不断提高，电池的能量密度、安全性及空间利用效率也愈发重要。我们认为，如果富锂锰材料能够与固态电池技术进一步结合，有望在这些场景中形成新的竞争优势。整体而言，公司会先发挥现有技术在高性能细分市场的优势，再逐步向新能源汽车及其他更大规模的应用领域拓展。</p>", "category": "tech", "published_at": "2026-11-06T02:20:12+00:00", "fetched_at": "2026-11-06T04:51:11.652633+00:00", "fingerprint": "d1b6f332e544caf0"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨重载物理AI公司成立一年内融资近4亿，核心成员来自华为、理想，已运营车辆超百台", "url": "https://36kr.com/p/4057656248685701?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_dfd1b221693147b69556406151d20e95@5920579_oswg393232oswg3164oswg1281_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2800字，建议阅读7分钟</p>\n  </blockquote>\n  <p>硬氪获悉，上海易博图科技有限公司（EABOT，以下简称“易博图”）近日连续完成两轮近4亿元融资，投资方包括知名投资人葛卫东、辰韬资本、弘毅投资、零一汽车、兴富资本、猎鹰投资旗下星奇基金等。</p>\n  <p>易博图成立于2026年2月，聚焦重载工业物理AI，核心业务是研发面向重载场景的“移动+操作”物理AI模型。目前，公司已运营100多台重卡，覆盖60条线路，主要集中在0-300公里的大宗物料短倒场景，并且已经在新疆、内蒙古等不同区域的复杂路况中开展真实道路零接管测试。</p>\n  <p>模型研发、上车验证与车队运营在一年内同步推进，标志着易博图的技术路线正式进入真实业务场景验证阶段。现阶段，易博图以重卡无人驾驶为切入点，长期则希望将技术能力拓展至矿山、电厂、港口等重载工业场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261106/v2_36538718f64e40d2befef6e3ff10872c@5920579_oswg1115677oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>易博图团队核心成员来自华为、理想、Momenta、苹果等头部企业，覆盖了自动驾驶、AI模型研发及工程化落地等领域，具备扎实的技术与落地经验。其中，CTO李伟曾任赢彻算法负责人，参与从0到1研发与运营支持。</p>\n  <p>李伟向硬氪介绍，公司模型架构基于AI原生范式，采用Efficient Physical AI技术路线，以通用多模态与世界模型为底层基座，向上支撑面向重卡L4的专项驾驶能力，并通过真实物理闭环实现数据与模型的持续反哺与演进，长期目标是从重卡场景泛化至全重载工业。</p>\n  <p>具体而言，在这一模型架构中，通用多模态预训练基座负责学习场景、空间关系和环境变化；世界模型则用于生成训练数据、补充复杂边缘场景，并辅助模型训练和仿真评测。在此基础上，公司通过后训练强化模型对驾驶任务的理解与执行能力，并针对规则遵从和安全要求进行强化学习训练。</p>\n  <p>车端执行层面，易博图独创了TwinFast“双快协同认知驾驶系统”，由JEV决策系统负责快速场景判断与决策，E2E端到端规划系统则将决策转化为具体的车辆控制动作。</p>\n  <p>传统自动驾驶架构通常由高层决策模型和实时规划系统协同完成任务，前者负责理解复杂场景并做出决策，后者负责生成实时轨迹。但如果高层模型推理速度较慢，即使具备较强的场景理解能力，也难以及时影响车辆的实时行为。TwinFast是对传统快慢系统的一种改进，核心在于提升高层决策效率，使其与实时规划系统在速度上更好地匹配，从而充分发挥AI模型在复杂驾驶场景中的作用。</p>\n  <p><strong>CTO李伟介绍，易博图模型能够快速落地的另一大优势在于数据采集与处理体系。</strong></p>\n  <p>目前，公司月均新增数据超过200万段clips，自动标注规模超过1亿帧。围绕数据闭环，团队搭建了涵盖数据基础设施、数据挖掘、数据处理和自动标注的完整流程，并配套组建运营团队，管理100多台车辆及100多名司机，持续采集真实道路数据。</p>\n  <p>对于无人驾驶模型而言，数据规模只是基础。复杂场景的覆盖程度、数据处理和标注效率，以及模型能否从实际运行中持续获得反馈，同样影响研发进度。易博图希望通过车辆运营、数据处理和模型训练之间的闭环，缩短从发现问题到模型迭代的周期。</p>\n  <p>商业化方面，易博图目前主要通过自营车队验证L4无人驾驶解决方案及配套运营流程。对于传统运输车队而言，部署无人驾驶车辆并不只是采购一套软件，还涉及车辆管理、调度、日常运维和异常处理等一整套运营能力。因此，公司计划先由自身团队持有并运营车辆，跑通技术和成本模型，再向客户输出包括车辆、软件系统及运营标准在内的“AI司机服务”，逐步将成熟的无人化运营方案交付给客户。</p>\n  <p>从行业空间来看，重卡无人驾驶并非单一的车辆智能化市场。其潜在价值还包括运输车队的运营管理、车辆调度、能源管理，以及后续与装载、卸载等作业环节的协同。如果无人驾驶能够从单车能力延伸至整条运输链条，所对应的市场将不再局限于传统的智能驾驶软硬件，而是面向大宗物料运输和重载工业生产的综合性服务市场。公司未来计划从重卡进一步拓展至挖掘机、装载设备等场景，实现矿山等重载工业场景的全流程无人化。</p>\n  <p><strong>以下为硬氪与易博图CTO李伟交流节选：</strong></p>\n  <p><strong>硬氪：为什么选择在这个时间点切入重卡领域做物理AI？</strong></p>\n  <p><strong>李伟：</strong>&nbsp;我们认为现在是切入重卡无人驾驶的一个比较好的时间窗口，核心原因是技术范式正在发生变化。过去，无人驾驶主要依赖规则驱动（Rule-based）的方法，行业玩家已经在这套技术体系上积累了大量研发成果。但随着AI驱动的技术路线逐渐成熟，尤其是乘用车端到端自动驾驶，以及基于大模型的新技术不断发展，行业正在迎来新的技术拐点。</p>\n  <p>在技术范式发生变化时，新玩家有机会绕过传统技术路线的历史包袱，直接基于新的架构建立优势��以乘用车领域为例，端到端技术已经展现出相较于���统方案的明显性能提升，特斯拉等公司的实践也在推动行业进一步向AI驱动的路线演进。</p>\n  <p><strong>硬氪：数据积累是公司的优势之一。这与团队此前的研究经历有关，还是公司成立后快速建立了数据采集和标注能力？</strong></p>\n  <p><strong>李伟：</strong>更重要的是我们从一开始就将自己定位为一家物理AI公司，并把数据基础设施作为核心能力建设。围绕数据闭环，我们搭建了从数据采集、数据挖掘、数据处理到自动化标注的一系列基础设施，并组建运营团队，负责数据采集和质量管理。</p>\n  <p>目前，我们有100多台车投入数据采集，也管理着超过100人的司机团队及相应的车队管理人员，持续获取符合模型训练需求的真实场景数据。对物理AI而言，数据不仅要有规模，还要能够持续采集、高效处理，并真正服务于模型训练和迭代。</p>\n  <p><strong>硬氪：TwinFast双快系统与传统自动驾驶中的快慢系统有什么区别？</strong></p>\n  <p><strong>李伟：</strong>传统快慢系统通常由高层决策模型和实时规划系统组成。前者负责理解场景、判断应该采取什么行动，后者负责生成具体轨迹并控制车辆执行。</p>\n  <p>问题在于，高层模型虽然具备较强的理解和推理能力，但如果推理速度较慢，就很难及时影响车辆的实时行为。例如，高层模型每秒只能完成一次推理，而底层规划系统每秒可以生成十次甚至更多规划结果，两者之间就会出现响应速度不匹配的问题。</p>\n  <p>我们的思路是让高层决策系统变得更快，同时保留实时规划系统的速度优势。传统基于多模态语言模型的决策方式，往往需要逐个生成Token并形成思维链，在驾驶场景中可能带来较高延迟。双快系统能够减少对逐Token生成的依赖，让模型更直接、高效地完成场景判断和行动选择，从而使决策与规划更好地协同。</p>\n  <p><strong>硬氪：公司成立时间不长，模型研发和上车进度都比较快。您认为背后的关键因素是什么？</strong></p>\n  <p><strong>李伟：</strong>我认为主要有三个因素。</p>\n  <p>第一是基于物理AI定位的技术范式选择。我们从成立之初就定位为一家物理AI公司，因此选择以AI驱动的范式，直接围绕更容易泛化的技术路线搭建架构。</p>\n  <p>第二是数据基础设施和运营能力。我们从公司成立之初就重视数据建设，不仅搭建了数据采集、处理和标注体系，也通过车辆和司机团队持续获取真实场景数据。这套基础设施能够帮助我们加快模型迭代。</p>\n  <p>第三是模型团队的人才密度。我们的核心团队具备较强的AI模型研发能力。我们希望从一开始就以AI-native的方式组织研发，将模型能力作为核心，而不是在原有规则驱动的技术体系上进行局部改造。</p>", "category": "tech", "published_at": "2026-11-06T02:23:15+00:00", "fetched_at": "2026-11-06T04:51:11.652624+00:00", "fingerprint": "3db7987155d11355"}, {"source": "36氪 - 最新文章", "title": "米哈游退出，交大系基金投资接手「零唯一思」｜36氪首发", "url": "https://36kr.com/p/4056456893993857?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>10月底，米哈游已退出上海零唯一思科技有限公司（下称“零唯一思”）股东行列。<strong>36氪获悉，近日，这家由上海交通大学教授吕宝粮创办的脑机接口公司，正式完成重组，并获得来自交大菡源资产数百万元的独家投资。该资金将用于团队组建与脑电基础模型研发。</strong></p>\n  <p>零唯一思成立于2021年底，最早从情感脑机接口切入，探索脑电、眼动信号在抑郁、焦虑等情绪障碍客观评估中的应用，曾推出过多模态情绪评估系统“情绪X光机”和脑电基础模型。</p>\n  <p><strong>本次，公司联合创始人、总经理石立臣对36氪表示，未来，将从情感脑机接口技术拓展到脑电基础模型和通用神经解码平台，采取底层技术研发与应用探索并行的策略</strong>。石立臣为上海交通大学计算机学院博士，师从吕宝粮教授。他曾任货拉拉技术总监、滴滴首席算法工程师、百度高级工程师，有过6年创业经历。</p>\n  <p>石立臣认为，这种拓展“是从具体应用向底层共性技术的延伸，并非更换赛道”。传统脑电解码算法，特征表达和任务决策系统同时训练，只能使用任务相关的标注数据；数据标注成本高、数据规模和多样性受限，导致解码能力有限；此外，算法与设备、任务高度绑定，换一个设备或换一个场景，往往就要重新采集数据、训练模型。“例如，从睡眠监测任务，变更为情绪识别任务，或者换一款脑电采集设备，数据采集、标注、模型训练都要从头开始。”</p>\n  <p>在零唯一思团队看来，脑电基础模型或许能提供一种解法。其核心思路是，将脑电解码拆分为两个阶段。第一阶段通过自监督学习，在无需标注的数据上大规模学习脑电信号中的通用神经表征；第二阶段再针对特定任务，用少量标注数据进行后训练，让模型在已有表征基础上形成决策能力。这种“预训练-后训练”的两阶段框架，借鉴了特征表达与决策系统解耦训练的思想，并将其适配到了脑电这一特殊信号模态上。</p>\n  <p>“预训练用的是未标注数据，采集成本低得多，而且规模越大、覆盖的设备和人群越多样，学到的神经表征就越丰富、越有泛化能力。”石立臣解释道：“后训练阶段只需要学习决策边界，对标注数据的需求就大幅减少了。这意味着面对新用户、新设备或者新应用，模型的适配成本和样本依赖都有望降低。”</p>\n  <p>这个逻辑可以用移动通信产业类比。在智能手机出现之前，功能机时代的硬件、操作系统和应用软件高度绑定，换设备意味着从头开发应用。但智能手机通过统一操作系统接口，实现硬件与应用的“适配”，由此催生移动互联网爆发。</p>\n  <p>零唯一思团队相信，脑机接口产业目前在某种程度上仍处在“功能机阶段”。“所以，我们希望把神经解码能力从具体场景中抽离出来，变成可复用的底层能力，让不同设备都能低成本接入，也让应用开发者不必从零开始解决脑电算法问题。”</p>\n  <p>技术方面，团队现有技术储备主要来自吕宝粮团队关于脑电基础模型的前期研究。</p>\n  <p>首先是用于解决脑电信号通用表征问题的LaBraM模型相关论文已在机器学习顶会ICLR2024发表。&nbsp;“LaBraM在脑电异常检测、情绪识别等多种任务上已取得一定结果，初步验证了通过大规模预训练，可以建立可复用的脑电基础模型这一路径。”近期，团队还在持续推进脑电基础模型的规模化研究，基于近8万小时的多来源脑电数据开展预训练，进一步探索更大数据和模型规模下的跨任务泛化能力。</p>\n  <p>第二项工作NeuroLM则进一步探索了多任务统一解码。它将连续的脑电信号转换成类似语言token的序列表示，结合语言模型通过指令训练支持多种脑电任务。</p>\n  <p>“举个例子，传统模型可能需要分别开发情绪识别和脑电异常分类两套独立算法，我们在做NeuroLM时则尝试用一个统一模型，通过不同的任务指令分别完成相应的解码。这项研究使用了约2.5万小时的脑电数据，最大模型规模达到17亿参数，其意义在于探索脑电解码能否从多个独立的专用模型，向统一的多任务模型演进。”石立臣表示。</p>\n  <p>此外，吕宝粮团队今年又推出一款名为CerebraGloss的智能系统，它主要关注临床脑电图的专业理解和生成式分析。过去，临床医生阅读脑电图，需要结合经验观察复杂的波形特征，而传统AI通常只能识别简单的问题，比如某段脑电是否异常。“CerebraGloss则尝试用视觉语言大模型分析脑电图，不仅能识别相关波形，还能够用自然语言描述和回答问题，并支持多轮交互。”</p>\n  <p>石立臣介绍，这三项工作意在“从不同方向探索脑电大模型的能力边界”。同时，零唯一思在推进下一代脑电基础模型的训练范式迭代，计划引入与脑电时间对齐的外部刺激、感知、认知、行为等多模态数据。</p>\n  <p>除模型层面的探索外，零唯一思团队也在不断积累自己的数据集。目前，团队已积累超过10万小时的脑电数据，其中既有来自公开渠道的大规模数据，也有近万例自采数据。</p>\n  <p>商业化方面，石立臣表示，脑机接口的终极应用尚未收敛，零唯一思计划同步开展技术平台合作以及应用探索。一方面持续提升脑电基础模型的解码能力和跨设备、跨应用的适配能力；另一方面，通过医疗、AI交互、具身智能等场景快速验证技术价值。“后续，我们将推出一款可用的脑机接口智能开发平台，以API、SDK或私有化部署的形式向合作伙伴提供神经解码服务。”</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>菡源资产投资副总监陈之弘表示：零唯一思从情感脑机接口向脑电基础模型的战略升级，精准把握脑机接口产业从“专用工具”向“通用智能平台”的演进。团队具备扎实的脑机接口领域研究基础，又拥有多年创业及大厂技术负责人的实战经验，为公司注入产业化加速度，这是我们极为看重的变量。菡源资产将依托上海交通大学在脑科学、AI及临床医学的跨学科生态，在算法迭代、临床验证与产业资源对接等方面为零唯一思提供全方位赋能，推动其脑电通用解码平台加速落地。</p>", "category": "tech", "published_at": "2026-11-06T02:58:44+00:00", "fetched_at": "2026-11-06T04:51:11.652608+00:00", "fingerprint": "5de64d87b9d35bfa"}, {"source": "少数派", "title": "不用困在厨房也能做出好饭：三十道省事家常蒸菜", "url": "https://sspai.com/prime/story/30-easy-steamed-dishes", "summary": "蒸锅真是懒人做饭好帮手。<a href=\"https://sspai.com/prime/story/30-easy-steamed-dishes\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-11-05T07:16:51+00:00", "fetched_at": "2026-11-06T04:51:09.985726+00:00", "fingerprint": "cb6bf2695060fea1"}, {"source": "少数派", "title": "新玩意 255｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/118541", "summary": "编注：很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑部的新玩意」介绍编辑部成员们最近在用的新奇产品，让他们自己来谈谈这些新玩意的使用体验究竟如何。内容声明：《新玩意》栏目如含有 ...<a href=\"https://sspai.com/post/118541\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-05T09:11:28+00:00", "fetched_at": "2026-11-06T04:51:09.985720+00:00", "fingerprint": "9af3d4ae929445ea"}, {"source": "少数派", "title": "开启 Mac 的下一世代：MacBook Pro (PROLED XDR) 首发体验", "url": "https://sspai.com/post/118546", "summary": "全新 MacBook Pro，开启 Mac 的下一个世代。<a href=\"https://sspai.com/post/118546\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-05T14:00:51+00:00", "fetched_at": "2026-11-06T04:51:09.985713+00:00", "fingerprint": "96889708d2bd33d8"}, {"source": "少数派", "title": "派早报：国务院办公厅发布 2027 年部分节假日放假安排等", "url": "https://sspai.com/post/118587", "summary": "OpenAI 推出 Images 2.6 模型，Nothing CMF Speaker S/M 音箱国行上市等。<a href=\"https://sspai.com/post/118587\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-06T00:24:39+00:00", "fetched_at": "2026-11-06T04:51:09.985706+00:00", "fingerprint": "560136f25a668e56"}, {"source": "少数派", "title": "更高能效比，带来新惊喜：M6 款 MacBook Pro 初探", "url": "https://sspai.com/post/118570", "summary": "M6 芯片提供了足够的性能保障，无论修图、视频剪辑还是运行入门级的 AI 大模型，它都能应对。在此基础上，你原本可能需要加在 Pro 级 SoC 上的预算就能省下来，花给内存或者硬盘。<a href=\"https://sspai.com/post/118570\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-06T03:06:53+00:00", "fetched_at": "2026-11-06T04:51:09.985695+00:00", "fingerprint": "e68d9b365055b962"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.6682 CNY ↓-0.27%", "url": "https://www.frankfurter.app/2026-11-05?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-11-05</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.6682 CNY</b> <span style=\"color:#5cb85c;font-size:14px;\">↓ -0.0125 (-0.27%) 贬值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-11-06T04:51:08.671745+00:00", "fingerprint": "652b0eb9c3e16c95"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
