<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

eak the bank? The Fiat Topolino is basically the ultimate embodiment of those tradeoffs. [&#8230;]", "category": "tech", "published_at": "2026-07-08T17:57:53+00:00", "fetched_at": "2026-07-09T02:32:45.624215+00:00", "fingerprint": "9f67f83fa82e4f0c"}, {"source": "The Verge", "title": "Microsoft&#8217;s Xbox reset is pivoting Obsidian to make Fallout instead of Avowed", "url": "https://www.theverge.com/games/963024/microsoft-xbox-reset-obsidian-fallout-layoffs", "summary": "As part of Microsoft's big Xbox \"reset,\" which includes layoffs affecting 3,200 staffers, jettisoning studios, and shifting investments to focus on \"higher priority projects,\" Obsidian Entertainment is changing its plans. The studio, behind games like Grounded and The Outer Worlds, is starting work on a new Fallout title and has canceled \"multiple projects,\" including a [&#8230;]", "category": "tech", "published_at": "2026-07-08T18:50:27+00:00", "fetched_at": "2026-07-09T02:32:45.624209+00:00", "fingerprint": "69b0ae6eeab5b540"}, {"source": "The Verge", "title": "Get a $30 credit when you reserve Samsung’s upcoming Galaxy phones", "url": "https://www.theverge.com/gadgets/962999/samsung-unpacked-z-fold-flip-wide-reserve-credit-preorder", "summary": "Even though they haven’t been officially announced yet, Samsung is giving you a chance to save some cash when you preorder what we’re expecting to be the brand’s updated Galaxy Z Fold phones. The next Galaxy Unpacked event will take place on July 22nd, 2026, and features the tagline “A new shape unfolds.” In addition [&#8230;]", "category": "tech", "published_at": "2026-07-08T20:00:00+00:00", "fetched_at": "2026-07-09T02:32:45.624202+00:00", "fingerprint": "04a5e44920640d0a"}, {"source": "The Verge", "title": "Meta is reportedly working on smart glasses that would be recording all the time", "url": "https://www.theverge.com/tech/963138/meta-smart-glasses-recording-super-sensing-ai", "summary": "Meta might be the next company to make an always-on AI wearable. The company is working on prototype \"super sensing\" always-aware smart glasses that could continuously record audio and snap photos \"every few seconds,\" according to the Financial Times. The wearer could then ask Meta AI about the captured audio and images. However, the images [&#8230;]", "category": "tech", "published_at": "2026-07-08T22:37:25+00:00", "fetched_at": "2026-07-09T02:32:45.624190+00:00", "fingerprint": "0956ebd23de8c68a"}, {"source": "36氪 - 最新文章", "title": "从跨境电商到AI大模型：一个旅欧10年90后女生的两次出海", "url": "https://36kr.com/p/3886574096265481?f=rss", "summary": "<p>20世纪50年代，“日本制造”对世界来说意味着低廉的价格和三流的产品。到70年代日本家电崛起，巅峰时期美国市场三成的彩电都是日本产品。80年代，丰田、本田、日产等日本汽车品牌接棒家电走向世界。再往后，日本动漫、游戏、音乐等文化娱乐产业开始向海外输出并成为支柱产业。</p>\n  <p>从廉价服装到二次元，日本输出海外的核心产品在过去七十年里换了好几轮，从侧面说明一国出海的主流产品从来不是固定的，会跟着国家的产业能力变迁。</p>\n  <p>这种变迁的剧本也正在今天中国出海人的身上重演。2015年，李露薇从宁波赴法留学。彼时国内大厂刚开始试水跨境电商业务，中国商品开始借助亚马逊、速卖通、eBay等线上渠道进入欧美市场，海运等跨境物流网络开始形成。<strong>还在读研究生的李露薇也顺势抓住时机，于2017年独创了一个B2B2C电商平台Import Market Sales (IMS)，</strong>链接中国的产业带和欧洲的本土电商平台和最终消费者。<strong>该平台专注在户外家具这个细分类目，同时也创建了独立站品牌Avril Paris。</strong>在9年时间内，在没有融资的情况下，累计销售额从0做到了3500万欧元，与法国和英国20多个国际和本土电商平台达成合作，服务8万多名直接客户。</p>\n  <p>在2025年的一次摩洛哥出差期间，李露薇注意到许多本地人都在讨论DeepSeek等中国AI模型。她意识到，世界已经变了，出海的机会点也在转向。</p>\n  <p>1年后，李露薇离开巴黎，来到伦敦加入字节跳动，负责AI大模型全球伙伴和生态系统开拓业务。最近，她向我们讲述了过去10多年的创业故事和她对欧洲市场的观察。以下是李露薇的自述。</p>\n  <p><strong>1.带着7人团队9年累计实现3500万欧元营收</strong></p>\n  <p>10年前第一次在法国创业的时候，我还在留学，发现法国人喜欢住带花园的house，也会花很多的时间和精力打理自己的花园，这让我意识到这是一个被忽略的大市场。恰好我的老家宁波有户外家具产业带，所以我选择了户外家具这个类目进行切入。</p>\n  <p>当时跨境电商还是一个新鲜但陌生的概念，做海外市场主要靠参加展会，通过经销商或者海外大客户下订单，中国产品和海外C端消费者之间隔着一层层进口商、批发商和零售商，市场距离也很远。虽然我手上不缺供应链资源，但没有资金大量存货，所以我就原创了一个新的电商平台架构，做B2B2C，把工厂，本土平台和终端消费者连接起来。<strong>我的初创公司提供品牌授权和营销，供应商供货，平台收取佣金。</strong>这样的模式在当时是没有先例的，我也因此在2017年就入选了法国知名孵化器Station F 进行初创企业的孵化，也在2020年获得了法国经济部French Tech组织颁发的“创新型企业”官方认可。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_db2c5fd3e93b4794a07b09046432dbc7@6244039_oswg186031oswg1080oswg812_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">李露薇在Station F孵化器和同事</p>\n  <p>李露薇在法国Station F孵化器时的照片</p>\n  <p>在欧洲做跨境电商创业涉及供应链、物流、仓储、营销、财务、法务等几个环节。每个环节需要接触的法国公司，我就一家一家去谈合作。在这个过程中，市场营销是最需要本土化的。在一场电商展会上，我和一家营销公司的CEO聊完之后，觉得对方的经验和我很互补，就向他抛出合伙的橄榄枝。</p>\n  <p>法国是一个很难进入的市场。你必须会说法语，要懂当地的法律、税务、文化，因此需要深入当地生活、工作。我这么多年，也是摸着石头过河，慢慢把这条路蹚出来。</p>\n  <p>外国人创业，国际化人才管理也是一个需要积累的经验。我的团队都是本地招聘的，大家在一起共事很多年。我也一直有意保持团队的小规模，这样有助于保持初创企业的灵活性。同时，大量投入内部软件的开发（累计超过30万欧），我也每年都制定新的流程自动化目标，这样才能做到规模化。团队最多的时候也只有7个人，9年累计做了3500万欧元的销售额，人均产出500万欧元/人，这在前AI时代是非常高的人效比。</p>\n  <p><strong>2.从电商到AI</strong></p>\n  <p>2020-2022年期间， 得益于消费者对家居用品的增长和网购需求的爆发，我们的业务达到了高峰，<strong>峰值达到每年700多万欧元销售额，年均增长率82%。</strong></p>\n  <p>但是从2023年开始，法国受到国际局势影响，经历了近40年来最严重的通货膨胀，削���了法国家庭的购买力。法国消费者开始降低非必要支出，也开始比价格，偏好更便宜的东西。Temu、Shein也是从那时候开始在法国流行起来的。</p>\n  <p>去年一些主攻美国市场的跨境电商品牌，因为受到关税冲突的打击，也开始把重心转向欧洲市场，供给变多，产品同质化更严重，市场竞争更加激烈了。在内外承压的局面下，我决定结束这段创业。</p>\n  <p>决定结束电商创业之后我开始想一个问题：前几年做跨境电商，我为什么能成功？</p>\n  <p>一部分确实得益于自己的判断和执行力，但回过头看，如果没有2019-2022年欧洲居家办公催生的网购需求井喷，没有国内制造业对跨境电商平台的集体拥抱，没有线上支付和物流体系的成熟，我再怎么折腾，可能也只是小打小闹的生意。</p>\n  <p>所以寻找产业变迁的趋势，寻找新的生产力浪潮很重要。</p>\n  <p><strong>那下一个浪潮在哪里？</strong></p>\n  <p>2025年春天我飞了一趟摩洛哥，原本想和当地头部企业洽谈跨境电商方向的新机会。但和当地做物流、电商、金融科技的企业领导人聊下来，大家都在激动地说：你们的DeepSeek真的很厉害。这让我意识到世界已经变了，中国的优势产业也发生了巨变。<strong>我开始重点研究中国和欧洲头部的AI企业，以及AI在欧洲的落地情况。</strong></p>\n  <p>在欧洲AI既有巨大的想象力，也和当年的跨境电商一样，正处在爆发前夜。我于2025年秋天参加了法国最大的AI展之一的Adopt AI，发现95%的企业CEO想要AI来提升组织效率，但只有不到5%明白如何落地。</p>\n  <p>和直接创业不同，这次我选择加入一家领先的AI大模型公司。于是我来到伦敦加入字节跳动，做AI大模型的全球伙伴和生态系统开拓工作。</p>\n  <p>在欧洲的大模型市场，OpenAI、Anthropic、谷歌三家基础模型能力最强，是绕不开的对手。欧洲本土也有一些大模型公司，比如法国的Mistral，政府订单基本都会给他们，但这些公司更偏本土化，更专注于单一模型，和中国企业没有正面竞争，更多的是合作对象。</p>\n  <p>和过去中国产品出海靠性价比打开市场不同，在AI领域，只要技术竞争力够强，数据安全和本土合规做到位，部分产品定价甚至可以高于国际企业。</p>\n  <p>但和美国相比，欧洲并不算真正意义上的统一大市场，而是由众多国家的小市场拼起来，合规成本更高，每个国家企业的采购逻辑和商业习惯都不一样。所以对AI模型或AI产品企业来说，在每一个国家都需要重新做本地化适配。</p>\n  <p>这些挑战，和我之前的创业所面临的有很大的相似之处。所以，这次的转型，看似涉及两个行业，实际上是在前10年经验沉淀上的一次迸发，需要的欧洲出海方法论和深度市场理解是一样的。我也很期待，在更国际化的市场，更高增长的赛道，与本土伙伴企业合作，把AI带来的生产力赋能到欧美的本土企业中去。</p>", "category": "tech", "published_at": "2026-07-08T09:33:33+00:00", "fetched_at": "2026-07-09T02:32:45.472573+00:00", "fingerprint": "895e490ccd1b4605"}, {"source": "36氪 - 最新文章", "title": "eVTOL 走向商业化，难点不只在“飞起来”", "url": "https://36kr.com/p/3886750049808389?f=rss", "summary": "<p>低空经济的热度，很多时候是从一架飞行器开始的。</p>\n  <p>过去几年，eVTOL真机亮相、飞行汽车概念升温、低空航线试点、地方产业基金入场，让这个行业快速成为新兴产业里的高频词。相比传统无人机，eVTOL为代表的载人载货飞行器，显然承载了更大的想象力：它不仅指向低空物流、应急救援、城市治理，也指向未来城市空中交通、城际运输和立体出行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_7b2303c9cefe478ea26e243fd10c911e@5510391_oswg1541929oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>这股热度背后，更值得关注的不是市场空间想象，而是产业正在从概念展示进入审定、取证和运行体系建设阶段。</strong>公开资料显示，国内无人驾驶、电动垂直起降等新技术快速突破，已完成19个无人驾驶航空器型号审定工作，在审新兴航空器型号数量超过70个。</p>\n  <p>与此同时，新修订的《中华人民共和国民用航空法》已于2026年7月1日起施行，法律层面进一步完善了支持民航制造业、运输业和低空经济发展的制度安排，也加强了对民用无人驾驶航空器设计、生产、维修和飞行活动的管理。</p>\n  <p>但当行业从概念、试飞和展台展示走向商业化，一个更现实的问题开始浮出水面：飞行器能飞起来，只是第一步。</p>\n  <p>真正决定eVTOL能不能跑起来的，不只是某一款机型的参数，也不只是一次成功飞行，而是它能不能进入一条稳定、合规、安全、成本可控、有人买单的航线。</p>\n  <p>换句话说，eVTOL的商业化，不是把飞行器造出来，而是把一套低空运营系统跑通。</p>\n  <p>一架eVTOL从A点飞到B点，看起来只是一次飞行任务。但如果把这条航线拆开，会发现它背后是一整套系统工程：起降点放在哪里？空域如何协调？适航和运行标准如何满足？乘客或货主为什么付费？天气变化怎么办？安全责任如何划分？运营成本能否被覆盖？维修、保险、调度和应急体系能不能长期支撑？</p>\n  <p><strong>这些问题，正在成为eVTOL从“飞起来”走向“用起来”的关键。</strong></p>\n  <p>低空经济上半场，行业关注谁能先飞起来；下半场，更关键的问题是，谁能让它安全、合规、稳定、低成本地运行起来。</p>\n  <h2><strong>一条航线，远比飞行器复杂</strong></h2>\n  <p>eVTOL 最容易被看见的，是飞行器本身。</p>\n  <p>这并不难理解。相比空域管理、适航审定、运营调度和安全责任，飞行器更直观，也更有传播性。一架可以垂直起降的航空器、一场低空飞行演示、一张未来城市空中交通的想象图，都能快速让公众感受到低空经济的技术进度。</p>\n  <p>但商业化不是展示，适航审定进度，正在成为观察 eVTOL 商业化的重要指标。公开资料显示，国内已完成19个无人驾驶航空器型号审定工作，在审新兴航空器型号数量超过70个。这说明行业已经开始从早期试飞、演示和技术验证，进入更严格的审定与运行准备阶段。</p>\n  <p>以亿航EH216-S为例，公开信息显示，该机型已获得中国民航局颁发的型号合格证、标准适航证和生产许可证；2025年，其相关运营航司又获得运营合格证。运营合格证意味着企业具备安全、合规开展商业飞行的能力，也标志着eVTOL商业化从“产品取证”进一步走向“运营取证”。</p>\n  <p>另一个案例是峰飞V2000CG。民航华东地区管理局信息显示，V2000CG是华东局受理的首个吨级以上电动垂直起降航空器系统项目，审查组基于eVTOL设计及运行特点开展适航审定，历时1年5个月完成型号合格审定工作。</p>\n  <p>这些案例说明，行业已经从“能不能造出来、飞起来”，进入“能不能合规生产、交付、运行”的新阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_e103d5497d9849bbaead8eb4b28452f5@5510391_oswg2716369oswg3840oswg2160_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对&nbsp;eVTOL 来说，真机亮相只是起点。真正进入真实场景之后，它首先要面对的是航线问题。一条&nbsp;eVTOL 航线要成立，至少要回答三个问题。</p>\n  <p><strong>第一个问题是需求是否足够稳定。</strong></p>\n  <p>无论是载人出行还是载货运输，eVTOL 都不能只靠偶发需求形成商业闭环。它需要稳定客流、货流或公共服务需求。比如，城市核心区到机场、城市群之间的短途通勤、海岛和山区运输、应急救援、医疗转运、消防巡查、城际物流等场景，是否真的存在高频、刚性、可付费的需求？</p>\n  <p>如果需求不稳定，eVTOL 就很容易停留在试飞、演示和单点示范。</p>\n  <p><strong>第二个问题是成本是否能够跑通。</strong></p>\n  <p>eVTOL 的成本，不只是飞行器本身的采购和制造成本。真正进入运营后，它还包括适航验证、起降场建设、航线运营、能源补给、维修保障、飞行调度、安全管理、保险和人员培训等成本。</p>\n  <p>这意味着，eVTOL 的商业化并不是简单替代地面交通，而是重构一套新的低空出行或低空运输链路。如果它不能在特定场景中证明时间价值、效率价值或公共服务价值，就很难从“能飞”走向“常态化运行”。</p>\n  <p><strong>第三个问题是责任是否足够清晰。</strong></p>\n  <p>eVTOL 一旦进入城市和公共空间，安全和责任就会成为商业化前提。它飞过哪里、由谁调度、谁来监管、发生事故怎么定责、乘客如何保障、货物如何赔付、数据如何留存，都需要明确规则。</p>\n  <p>这种系统压力已经开始显现。中国民航局公开数据显示，截至2026年3月底，我国实名登记无人机超过380万架，操控员数量超过43万人；2025年，无人机累计飞行4530万小时，同比增长近70%。低空飞行活动规模快速扩大，意味着未来eVTOL等更高安全等级的载人载货飞行器进入低空空域时，对通信、导航、监视、气象、调度和安全监管的要求只会更高。</p>\n  <p>这也是&nbsp;eVTOL 与普通硬科技产品不同的地方。</p>\n  <p>一些技术产品只要性能足够强，就有机会被市场快速接受；但&nbsp;eVTOL 不一样，它天然进入公共空间，涉及空域、安全、城市治理和公众信任。飞行器能飞只是起点，能不能被社会系统接受，才决定它能不能真正扩张。</p>\n  <h2><strong>商业化卡在运营系统</strong></h2>\n  <p>从&nbsp;eVTOL 继续往下看，会发现低空经济真正稀缺的，不只是更先进的飞行器，而是一套能够让飞行器长期运行的运营系统。</p>\n  <p>这套系统至少包括几个层面。</p>\n  <p><strong>首先是适航和安全体系。</strong></p>\n  <p>对载人载货飞行器来说，适航不是附加环节，而是进入商业化的入场券。无论是载人出行还是载货运输，飞行器都必须证明自身在设计、制造、测试、运行和维护环节具备足够安全性。</p>\n  <p>这也是为什么&nbsp;eVTOL 的商业化节奏很难只由企业自身决定。它需要监管体系、测试验证能力、适航审定资源和运行标准同步推进。</p>\n  <p><strong>其次是基础设施。</strong></p>\n  <p>eVTOL 的垂直起降能力降低了对传统机场的依赖，但并不意味着它不需要基础设施。真正运行起来，它需要起降点、能源补给、通信导航、低空感知、气象服务、运行管理和应急保障。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_b14e0054475c472ba9d6af73d153a9f9@5510391_oswg2732524oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这也解释了为什么低空经济不能只靠整机企业推进。中国民航局公开信息提到，低空服务保障能力建设正在加快推进，包括建设民用低空飞行服务调度平台，持续完善低空通信、导航、监视、气象一体化保障能力，推动构建低空监视网络；同时，全国共建成飞行服务站47个，其中38个通过民航地区管理局符合性检查；“十五五”期间，努力实现民用无人机实名登记率100%，有效无人机操控员执照持有人数量超过100万人，民用低空航空器年飞行总量超过8000万小时。</p>\n  <p>对eVTOL而言，这些能力不是背景设施，而是未来能否进入常态化运营的前提。</p>\n  <p><strong>再次是运营调度。</strong></p>\n  <p>eVTOL 进入真实场景后，不是一架飞行器单独飞行，而是多架飞行器、多条航线、多类场景共同运行。如何调度、如何避障、如何应对天气变化、如何处理突发情况，都会影响商业化效率。</p>\n  <p>这也意味着，eVTOL 的竞争不只是整机企业之间的竞争，也会延伸到航电系统、通导监感知、安全监管、低空基建、运行服务等环节。</p>\n  <p><strong>最后是公众信任。</strong></p>\n  <p>载货飞行器可以先从货物和公共服务场景切入，但载人飞行器最终要面对普通乘客。用户是否愿意坐，是否愿意为更快的通勤或城际出行付费，是否相信它足够安全，都会影响&nbsp;eVTOL 的商业化速度。</p>\n  <p>从这个角度看，eVTOL 真正要完成的，不只是技术验证，而是社会信任的建立。</p>\n  <h2><strong>载人之外，载货先行</strong></h2>\n  <p>eVTOL 最有想象力的场景，往往是载人出行。</p>\n  <p>空中通勤、机场接驳、城际飞行、城市群短途运输，这些场景都足够吸引人。它们也最容易让公众理解低空经济的未来图景：原本在地面拥堵中消耗的时间，被一条低空航线重新组织。</p>\n  <p>但从商业化难度看，载人出行也可能是门槛最高的场景。</p>\n  <p>它对安全、适航、运营、保险、公众信任和城市管理的要求更高。一条载人航线，不仅要证明飞行器能飞，还要证明乘客愿意坐、监管允许飞、城市能够管、事故责任可追溯、运营成本可持续。</p>\n  <p><strong>相比之下，载货、应急、消防、巡检、城际运输等场景，可能更早成为&nbsp;eVTOL 和其他载人载货飞行器验证运营能力的切入口。</strong></p>\n  <p>峰飞V2000CG就是一个典型案例。作为吨级以上eVTOL航空器系统项目，它的取证路径说明，货运、应急、特殊区域运输等场景，可能会成为载人载货飞行器率先验证运营系统的入口。公开资料显示，V2000CG主要面向低空物流、紧急物资运输和应急救援等场景，并已完成型号合格审定。</p>\n  <p><strong>这些场景未必像“空中打车”那样有传播性，但它们更容易证明低空经济的实际价值。</strong></p>\n  <p>也就是说，低空经济不能只看“什么时候能空中通勤”，也要看载货、应急、消防、巡检、物流和公共服务这些场景能否率先跑通。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_9bb38ff4d6ce4b948cf5326e69d53369@5510391_oswg3303734oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对&nbsp;eVTOL 而言，商业化可能不是一步到位进入大众出行，而是先在载货和公共服务场景中验证安全、调度、成本和运行体系，再逐步走向更大规模的载人场景。</p>\n  <p>真正重要的问题，不是还有多少飞行器会亮相，而是这些飞行器能进入多少条可重复运行的航线，能服务多少个真实场景。</p>\n  <h2><strong>看懂低空经济，需要进入产业现场</strong></h2>\n  <p>也正因为如此，理解&nbsp;eVTOL 和低空经济，不能只停留在新闻、政策和融资事件里。</p>\n  <p><strong>很多问题，只有进入产业现场才会变得具体</strong>：一架&nbsp;eVTOL 旁边，是否有做航电、动力、材料、通信、定位和安全监管的企业？一条低空航线背后，是否有地方政府、场景应用方和运营服务机构参与？一次低空飞行演示，是否能看到调度、响应、通信和安全机制？一场论坛讨论的，是概念热度，还是适航、运营、合规、人才、保险和场景落地这些真实问题？</p>\n  <p><strong>这也是&nbsp;2026 国际低空经济博览会值得放到行业变化中观察的原因。</strong></p>\n  <p>根据公开信息，2026 国际低空经济博览会将于 7 月 22 日至 25 日在国家会展中心（上海）举办，主题为“驭低空新势，启经济新篇”。本届展会规模预计为 6 万平方米，汇聚 400 余家参展商，并设置 80 余场会议和活动。</p>\n  <p>如果只把它理解为一次低空装备展示，就低估了这类展会在当下的意义。</p>\n  <p>从已公布的参展阵容看，展会一方面聚集了亿航智能、沃兰特航空、时的科技、蓝色向量&nbsp;SKYLA、沃飞长空、峰飞航空、御风未来、览翌航空等 eVTOL 整机厂商；另一方面，也覆盖航空电子、材料增材、通导监感知、安全治理、低空基建等配套环节。</p>\n  <p><strong>这意味着，展会真正值得观察的，不只是&nbsp;eVTOL 真机本身，而是围绕这些飞行器形成的产业协同网络。</strong></p>\n  <p>一架载人载货飞行器要进入商业化，需要的不只是整机厂。它还需要核心零部件企业提供可靠的系统支撑，需要材料企业帮助飞行器减重和提升安全性，需要通信、导航、感知企业保障低空运行，需要安全治理和适航验证体系提供底层保障，也需要地方政府、金融机构、法律服务机构、科研院校和人才平台共同参与。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_f7baf4a6f3a940b1831ca30edebaa153@5510391_oswg3719157oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p><strong>展会把这些角色放到同一个现场，提供了一个观察低空经济商业化进程的窗口。</strong></p>\n  <p>同时，展期内围绕&nbsp;eVTOL、基础设施、安全运营、物流、金融保险、人才教育等方向设置的会议和活动，也对应了 eVTOL 从“飞起来”走向“运营起来”所必须补齐的能力。</p>\n  <p>例如，先进低空飞行器（eVTOL）设计研发、测试与核心零部件技术论坛，指向的是整机和关键系统能力；低空经济基础设施发展大会、低空空管基础设施发展论坛、低空起降场地规划建设发展论坛，讨论的是飞行器进入航线所需要的基础设施；低空安全与运营管理学术论坛、无人机安全专业委员会年度会议、低空金融保险发展论坛，则对应安全、运营、责任和风险保障；低空产业人才发展与教育创新论坛，则回应行业从试飞走向运营后对复合型人才的需求。</p>\n  <p><strong>这些议题看似分散，本质上都指向同一个问题：eVTOL 要真正商业化，不能只有飞行器，还要有基础设施、监管体系、运营服务、金融保险、人才供给和场景组织能力。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4294ac8ea951427ba378dac2d0b94f33@5510391_oswg2438475oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>展会中的低空百大应用飞演、无人机飞行嘉年华、青少年智能救灾创新展示等活动，则提供了另一个角度：让低空经济从产业话题进入具体场景。</p>\n  <p>对公众来说，飞行演示和体验活动的意义，不只是“看飞行器飞起来”，而是看到低空技术如何进入应急、消防、物流、文旅和公共服务。对产业方来说，这些活动则是观察场景需求、验证产品能力、寻找合作入口的现场。</p>\n  <p>因此，这场展会更像一个进入低空经济的产业现场。它不是单纯告诉人们“低空经济很热”，而是让人看到：eVTOL 如何从展台走向航线，载人载货飞行器如何进入真实场景，产业链上下游如何围绕安全运行和商业化落地完成协同。</p>\n  <h2><strong>行业信心来自可复制的场景&nbsp;</strong></h2>\n  <p>低空经济真正进入大众生活时，公众看到的可能是一次机场接驳、一条城际低空航线、一单高时效货物运输、一场低空文旅体验，或者一次更快抵达现场的应急救援。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_180ce4d512eb444186268f3975f240f6@5510391_oswg4953418oswg1920oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>这些都是看得见的应用。</p>\n  <p><strong>但在这些应用背后，真正决定它们能否稳定运行的，是一整套看不见的系统：航线是否稳定，起降点是否完善，适航和监管是否清晰，运营成本是否可控，安全责任是否可追溯，人才是否能够跟上，公众是否能够建立信任。</strong></p>\n  <p>从EH216-S先后取得适航相关证件并推动运营资质落地，到V2000CG这类吨级以上eVTOL完成型号合格审定，再到本届博览会聚合整机、航电、材料、通导监、低空基建、安全运营、金融保险和人才教育等资源，低空经济的进度条已经不只写在单次飞行演示里，而是写在一条越来越清晰的产业协同链条里。</p>\n  <p>eVTOL 的行业信心，不会只来自概念热度，也不会只来自单次飞行演示，而是来自越来越多可被看见、可被体验、可被复制的运行路径。</p>\n  <p>从这个角度看，2026 国际低空经济博览会的标杆意义，不只是集中展示当下的技术和产品，更是提供一个产业现场：让行业参与者、资本方、场景方和公众能够更具体地理解低空经济，更切身地感受载人载货飞行器的产业进度，也更清晰地看到它从概念热度走向商业化落地的路径。</p>\n  <p>低空经济的上半场，行业关注谁能先飞起来；低空经济的下半场，更关键的问题是，谁能让它安全、合规、稳定、低成本地运行起来。</p>\n  <p>飞行器决定低空经济的想象力，运营系统决定低空经济的商业化速度。</p>\n  <p>而一个真正有价值的产业平台，能做的不只是展示当下，更是为行业建立信心，为未来发展提供可被看见、可被体验、可被参与的入口。</p>", "category": "tech", "published_at": "2026-07-08T09:36:57+00:00", "fetched_at": "2026-07-09T02:32:45.472566+00:00", "fingerprint": "1d8c00e8e3e72e7c"}, {"source": "36氪 - 最新文章", "title": "8点1氪｜小米将发布澎程系列增程SUV；OpenAI首席未来学家宣布离职；张小龙辞任粉笔首席执行官、董事会主席", "url": "https://36kr.com/p/3887648675133960?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>工信部：AI编程工具Claude Code存在安全后门隐患，危害严重</li>\n   <li>字节绩效规则调整：加大半年激励，加强字节范与领导力考核</li>\n   <li>沙特阿美大降价吸引亚洲买家，国际机构看空下半年油价</li>\n   <li>欧盟法院驳回苹果上诉，维持App Store和iOS“看门人”认定</li>\n   <li>摩根大通：投资者低估了特斯拉与SpaceX合并的潜在障碍</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>小米汽车新产品系列命名为SKYNOMAD，雷军回复上市时间</strong></p>\n  <p>7月8日，小米汽车官方微博发布主题为“SKYNOMAD”的海报，“SKY”指天空，“NOMAD”指游牧者，海报上带有小米品牌LOGO。据媒体报道，小米汽车首款增程式SUV将归属全新独立子品牌“SKYNOMAD”，计划于2026年下半年正式发布。SKYNOMAD并非此前网传的“红米汽车”，而是小米汽车继SU7、YU7后的新产品新型号。据悉，该车型内部代号为昆仑N3，此前网传的“YU9”命名已被取消。同日，小米创办人，董事长兼CEO雷军在个人账号官宣小米汽车新系列SkyNomad。其评论区下有网友询问车辆发布时间，雷军回复表示“快了”。（界面新闻、36氪）</p>\n  <p><strong>OpenAI首席未来学家宣布离职</strong></p>\n  <p>北京时间7月8日，OpenAI首席未来学家（Chief Futurist）约书亚·阿奇亚姆（Joshua Achiam）在社交媒体发文表示，将于本月离开这家他效力了近九年的公司。34岁的阿奇亚姆表示，离开没有具体原因，而是长久以来深思熟虑的结果。现在全世界都已经知道了AI发展潜力这个“秘密”，那么到顶级前沿实验室围墙之外，似乎也同样可以实现这一使命。他表示，依然坚信人类可以走向一个充满和平、空前繁荣以及充满无限社会与科学可能的未来，无论接下来做什么，他都将继续致力于推动这一愿景的实现。（界面新闻）</p>\n  <p><strong>张小龙辞任粉笔首席执行官、董事会主席</strong></p>\n  <p>36氪获悉，7月8日，粉笔发布公告，因需处理其他个人事务，张小龙已辞任执行董事、首席执行官、董事会主席、董事会薪酬委员会成员及董事会提名委员会主席，且不再担任公司任何职位，即日起生效。粉笔宣布，盛海燕将获委任为执行董事、首席执行官兼董事会主席，自7月8日起生效。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯宣布OpenAI前研究员田永龙入职，参与VLM研发</strong></p>\n  <p>从腾讯相关负责人处获悉，OpenAI前研究员Yonglong Tian（田永龙）已于近期加入腾讯大语言模型部，后续将参与 VLM（视觉语言模型）相关研发。这也是腾讯再次挖角OpenAI。去年12月17日，腾讯宣布升级大模型研发架构，新成立AI Infra部、AI Data部、数据计算平台部，任命前OpenAI高级研究员姚顺雨为“CEO / 总裁办公室”首席AI科学家（向刘炽平汇报），同时兼任AI Infra部、大语言模型部负责人（向卢山汇报），此事一度在社交媒体引发广泛关注。（澎湃新闻）</p>\n  <p><strong>报道称特朗普政府解除对OpenAI的GPT 5.6的限制</strong></p>\n  <p>据报道，特朗普政府解除对OpenAI的GPT 5.6的限制，美国商务部已批准OpenAI广泛推出其先进的GPT 5.6模型。（财联社）</p>\n  <p><strong>SpaceX AI将于7月9日向公众开放Grok4.5</strong></p>\n  <p>马斯克表示，SpaceX AI将于7月9日向公众开放Grok4.5。（财联社）</p>\n  <p><strong>OpenAI将于9日正式发布GPT-5.6系列</strong></p>\n  <p>OpenAI宣布，将于当地时间7月9日正式公开发布GPT-5.6 Sol、Terra和Luna版本。（界面新闻）</p>\n  <p><strong>OpenAI发布GPT-Live语音模型，让ChatGPT更像真人对话</strong></p>\n  <p>OpenAI正式推出新一代语音模型GPT-Live-1和GPT-Live-1 mini，对ChatGPT的语音功能进行了全面升级。新模型采用“全双工”架构，能够同时收听和说话，用户可以在AI回应时随时打断，交互方式更接近真实对话。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>工信部：AI编程工具Claude Code存在安全后门隐患，危害严重</strong></p>\n  <p>近日，工业和信息化部网络安全威胁和漏洞信息共享平台（NVDB）监测发现，AI编程工具Claude Code存在安全后门隐患，危害严重。Claude Code是美国Anthropic公司开发的AI编程工具，可根据文字需求自主完成代码编写、修复等工作。由于其内置了监控机制，未经用户同意即可向远程服务器回传用户地域、身份标识等敏感信息，受影响的Claude Code为2.1.91至2.1.196版本。</p>\n  <p>建议相关单位和用户立即开展全面排查，对于安装上述受影响版本的开发终端，立即卸载或升级至已清除相关后门代码的最新安全版本；加强核心业务网段内开发工具外联权限管控与流量监测，防止敏感数据违规外传。（第一财经）</p>\n  <p><strong>字节绩效规则调整：加大半年激励，加强字节范与领导力考核</strong></p>\n  <p>7月8日午间消息，字节跳动发布全员通知，发布2026半年绩效评估说明，本次绩效将于7月15日启动。通知内容提到，本周期开始，综合绩效E及以上的同学可获得半年激励。公司将加大激励力度，计算基数将从月薪调整为月总包（月薪+月期权/RSU）；发放形式将从100%发现金调整为25%发现金、75%发绩效期权/RSU（两者均按月匀速归属）。此外，字节跳动进一步明确字节范和领导力原则对综合绩效的影响。通知内容称，综合绩效是以业务产出为基础，综合考虑字节范、领导力原则进行整体评估。多数情况下，综合绩效与业务产出评分一致，当字节范或领导力原则表现突出或者存在不足时，可作为综合绩效上调或下调的参考。（新浪科技）</p>\n  <p><strong>B站内测上线网页内容发布平台“Toy”，使用量已突破850万次</strong></p>\n  <p>36氪获悉，B站已从6月起启动小范围内测，上线网页内容发布平台“Toy”。该平台支持将本地创意网页一键发布为站内可直接访问、可玩的互动作品（即Toy作品，简称Toy）。据了解，内测启动一个多月以来，UP主已上传超300件作品，涵盖游戏、互动叙事、工具、测试、报告、画册等多个品类。同时站内公开数据显示，平台用户体验量已累计超850万次。</p>\n  <p><strong>金饰价格集体下调</strong></p>\n  <p>7月8日早盘，现货黄金开盘即失守4100美元/盎司整数关口。8日，国内各大黄金品牌的金饰挂牌价持续下调，部分品牌克价距离年初高点跌幅高达467元。老凤祥报价1246元/克，克价距离年初高点1713元跌467元；周生生报价1249元/克，克价距离年初高点1708元跌459元；周大福报价1252元/克，克价距年内高点1706元跌454元；老庙黄金报价1255元/克，距离年初高点1722元跌467元。（中新经纬）</p>\n  <p><strong>韵达、圆通、申通退出蜂网投资</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，蜂网投资有限公司发生工商变更，上海韵达货运有限公司、上海圆通蛟龙投资发展（集团）有限公司、申通快递有限公司退出股东行列。蜂网投资有限公司成立于2013年12月，法定代表人为黄俊豪，注册资本2.5亿人民币，经营范围包括速递网络软件的研发、设计与制作，并提供相关技术咨询与技术服务等，该公司现由上海易旭朗晟企业管理有限公司全资持股。</p>\n  <p><strong>MiniMax解禁前夕，超八成Pre IPO及基石股东表态长期持有</strong></p>\n  <p>36氪获悉，在MiniMax基石投资者解禁窗口临近之际，超八成 Pre IPO 及基石股东明确表态长期看好并将继续持有。表态机构包括 Aspex、博裕、IDG、Martis Fund等基石投资人，国寿投资、徐汇资本等国资机构，以及阿里、米哈游、云启、明势等早期股东，涵盖产业战略投资者、国际长线基金、国有资本及地方产业投资平台、市场化专业投资机构和公募基金等多元类型。</p>\n  <p><strong>多家银行推出消费贷让利活动，年化利率低至3%</strong></p>\n  <p>暑期消费信贷市场迎来集中营销窗口期。记者在采访中了解到，当前，多家银行正紧抓暑期消费旺季，密集推出消费贷让利活动。其中，部分产品限时优惠年化利率最低可至3%，贴息、微信立减金、利息抵扣券等多重福利也同步上线。受访专家表示，银行推出消费贷让利活动，既是借旺季批量拓展年轻客群的短期营销手段，也是信贷环境、扩内需政策与银行优化资产结构共同驱动的结果。低价让利虽能短期刺激消费，但“价格战”并不具备可持续性，消费贷行业后续竞争重点将从利率比拼转向机构对场景搭建、精细化客群经营与差异化综合服务等方面的打造。（证券日报）</p>\n  <p><strong>高温热浪催生多维降温刚需，清凉经济扩容升级</strong></p>\n  <p>入夏以来，全国大范围高温天气持续出现，民生消暑、工业生产、算力散热等多层次降温需求集中爆发，重塑传统夏日消费格局。高温天气不仅带动家用商用制冷设备海内外订单走高，激活传统清凉消费旺季行情，更推动全社会用电负荷屡创历史新高，电力保供刚需持续释放，同时倒逼AI数据中心加速液冷技术迭代落地。分析人士指出，从民用家电产销两旺、电力产业链稳供增效，到数字基建热管理赛道扩容，清凉经济正摆脱单一季节性属性，实现向实体产业、数字经济的全域延伸与业态升级。上市公司正抢抓结构性风口，在传统赛道提质增效、新兴赛道抢先布局，全方位打开夏日经济增长新空间。（中证报）</p>\n  <p><strong>特朗普：美伊谅解备忘录“已终结”</strong></p>\n  <p>美国总统特朗普7月8日在北约峰会上说，他认为美伊谅解备忘录“已终结”。（新华社）</p>\n  <p><strong>Anthropic扩张美国纽约办公室，员工规模将翻番至1000人</strong></p>\n  <p>据报道，美国人工智能公司Anthropic当地时间7月7日宣布，将租赁位于纽约曼哈顿哈德逊街330号的一栋16层办公楼，并计划今年将纽约员工规模扩大一倍至1000人。Anthropic称，扩张前的纽约办公室已是该公司除旧金山总部外最大的办公地点。（界面新闻）</p>\n  <p><strong>多位“果链”企业人士：预计苹果折叠机可正常交付，“没听说”产品延期发售</strong></p>\n  <p>近期有市场传闻称，苹果首款折叠机产品或因产品组装复杂、良率较低等原因延期发售。对此，记者采访多位苹果链企业人士获悉，苹果折叠机产品方案早已确定，目前相关企业已进入生产旺季，相关产品正常量产中。多位人士还表示，9月交付应该“没问题”，对于产品延期传闻发售，则表示“没听说”。（财联社）</p>\n  <p><strong>沙特阿美大降价吸引亚洲买家，国际机构看空下半年油价</strong></p>\n  <p>近日国际原油供应商相继下调售价。随着霍尔木兹海峡逐步恢复通航，市场地缘风险担忧显著降温，布伦特原油价格大幅回落，国际动力煤价格也重回冲突爆发前的水平。7月6日，全球最大原油生产商沙特阿美大幅下调8月亚洲市场阿拉伯轻质原油售价，意在吸引亚洲买家。多家国际机构看空下半年油价，花旗预计布伦特原油年底或下探至60美元/桶。（证券时报）</p>\n  <p><strong>奈飞、迪士尼和YouTube拟竞购下届世界杯美国转播权，版权费或达20亿美元</strong></p>\n  <p>据报道，奈飞、迪士尼和YouTube有意同福克斯竞购2030年和2034年世界杯美国转播权，亚马逊与苹果也可能入局。知情人士称，预计国际足联与潜在媒体合作伙伴的谈判将在未来三个月内启动。今年早些时候的初步会谈中，国际足联已向各媒体公司通报，针对美国市场的英语和西班牙语转播权很可能会捆绑出售，而不再像包括2026年世界杯在内的过往赛事那样分开出售。各媒体公司的高管正针对每届赛事的美国市场转播权（涵盖英语和西班牙语）制定15亿至20亿美元预算。（界面新闻）</p>\n  <p><strong>欧盟法院驳回苹果上诉，维持App Store和iOS“看门人”认定</strong></p>\n  <p>当地时间7月7日，欧盟法院裁定，驳回苹果对《数字市场法案》（DMA）相关认定的上诉，确认欧盟委员会将App Store和iOS纳入DMA监管范围、认定苹果为这两项服务“看门人”的决定合法。法院同时认为，苹果针对iMessage相关程序提出的诉求不予受理。苹果仍可向欧盟最高法院继续上诉。此次裁决意味着苹果仍需遵守DMA规定的开放竞争义务，也可能进一步增强欧盟利用DMA加强对大型科技平台监管的力度。（界面新闻）</p>\n  <p><strong>摩根大通：投资者低估了特斯拉与SpaceX合并的潜在障碍</strong></p>\n  <p>摩根大通分析师Rajat Gupta表示，尽管特斯拉和SpaceX合并“纸面上看起来合情合理”，但目前围绕合并的猜测低估了阻碍交易的潜在障碍。Gupta称，合并将使首席执行官埃隆·马斯克能够“合并两大平台的愿景、使命和工程领导力”，两家公司共同的人工智能雄心将成为“潜在的战略黏合剂”。不过，这位分析师表示，潜在障碍包括多司法辖区的监管批准；治理和投票权对称性；以及“外界认为合并将是由SPCX主导的收购，而不是对等合并”的看法。他补充说：“总体而言，我们将关注SPCX的收购货币、监管格局以及马斯克在特斯拉的投票权，将其作为潜在合并临近的催化因素”。摩根大通表示，如果交易发生，最可能的结构将是由SpaceX主导、以全股票方式收购特斯拉，Gupta表示，这一交易结构可能最能弥合估值差距，并避免大规模现金支出。Gupta对特斯拉的评级为中性，目标价为475美元。（界面新闻）</p>\n  <p><strong>法拉利高管称中国车企像在开发快销品，驾驶情感是明显短板</strong></p>\n  <p>7月8日消息，法拉利全球营销总监埃马努埃莱·卡兰多表示，暂时并不担心被中国新兴车企赶超。其认为，中国车企在性能方面进步惊人，但驾驶情感仍是明显短板。卡兰多还表示，中国车型与法拉利产品的整体特质差异很大。中国车企更像是在开发快消品，每个月都有新车推出，消费者手里的旧车很快就会显得过时。（新浪汽车）</p>\n  <p><strong>苹果将增加与博通的合作支出，该协议预计超300亿美元</strong></p>\n  <p>苹果将增加与博通的合作支出，该协议预计将超过300亿美元，将生产超过150亿枚美国制造的芯片。（财联社）</p>\n  <p><strong>亚马逊秘密推进Alexa“智能体”计划，成本高昂引发内部担忧</strong></p>\n  <p>7月8日消息，据报道，亚马逊内部规划文件显示，公司正在秘密推进一项名为“Moonraker”的全新Alexa AI项目，旨在将这一语音助手推向AI智能体赛道。然而，该项目极其高昂的研发与运行成本已在公司内部引发广泛担忧。（界面新闻）</p>\n  <p><strong>智谱：配售新H股，所得款项总额预期约314.1亿港元</strong></p>\n  <p>36氪获悉，智谱在港交所公告，根据一般授权配售新H股，每股配售股份的配售价为1588港元。假设所有配售股份获悉数配售予承配人，配售事项所得款项总额预期约为314.1亿港元，而配售事项所得款项净额（经扣除佣金及估计开支后）预期合共约为313.75亿港元。董事会认为，通过配售事项引入额外资金，将有助于进一步增强公司资本实力，支持公司持续推进基座模型研发、技术创新、商业化落地及生态建设。</p>\n  <p><strong>SK海力士美国IPO获得逾七倍的超额认购</strong></p>\n  <p>知情人士表示，SK海力士美国IPO获得逾七倍的超额认购。这家韩国存储芯片制造商计划于周四定价。部分知情人士表示，此次发行1.779亿份美国存托凭证（ADR）吸引了全球多头基金、专注科技领域的基金、主权财富基金以及专注亚洲市场的全球投资者的认购。（新浪财经）</p>\n  <p><strong>美股三大指数收盘涨跌不一，阿里巴巴涨超11%</strong></p>\n  <p>36氪获悉，7月8日收盘，美股三大指数涨跌不一，道指跌1.09%，纳指涨0.2%，标普500指数跌0.28%。大型科技股多数下跌，特斯拉、Meta跌超2%，微软、谷歌跌超1%，亚马逊跌0.96%，SpaceX跌0.78%，奈飞跌0.77%；英伟达涨超3%，苹果涨0.88%。热门中概股普涨，阿里巴巴涨超11%，爱奇艺涨超5%，百度、京东涨超4%，拼多多、腾讯音乐涨超2%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>同创普润科创板IPO审核状态变更为“已问询”</strong></p>\n  <p>36氪获悉，上交所官网显示，上海同创普润新材料股份有限公司科创板IPO审核状态变更为“已问询”。</p>\n  <p><strong>三星电子支持的韩国AI芯片创企Rebellions计划明年在韩IPO</strong></p>\n  <p>据报道，三星电子支持的韩国AI芯片创企Rebellions首席执行官Sunghyun Park表示，该公司计划明年第一或第二季度在韩国IPO。Sunghyun Park称，Rebellions目前已开始产生实际营收，“正因如此，我们正与摩根大通及三星证券的承销团队合作筹备IPO事宜”。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>阿里Q1财报前瞻：云增长45%大超预期，电商利润恢复，闪购减亏快于预期</strong></p>\n  <p>根据市场消息，阿里巴巴2027财年Q1财报前瞻显示，阿里云收入增长加速至45%左右，大超市场预期；整体电商业务（中国电商+AIDC）利润恢复，同⽐持平，好于市场预期；淘宝闪购减亏快于市场预期。前瞻消息显示，在云和AI领域，阿里云季度收入增长加速至45%左右，大超市场预期。阿里云EBITA margin持续改善，从往季的9.1%左右加速提升至低双位数，兑现此前指引。前瞻显示，阿里基本面稳健，股价上行空间较大，截至发稿，港股阿里巴巴涨超13%，报108.3港元\\股。</p>\n  <p><strong>中孚实业：预计2026年半年度净利润同比增长154%-176%</strong></p>\n  <p>36氪获悉，中孚实业公告，预计2026年半年度归属于母公司所有者的净利润为18亿元-19.5亿元，同比增长154.42%-175.62%。业绩增长主要因上下游产业链协同降本、电解铝价格高位运行、铝精深加工高附加值产品开发及节能技改项目推进。</p>\n  <p><strong>德业股份：预计上半年净利润同比增长75%-79%</strong></p>\n  <p>36氪获悉，德业股份公告，预计2026年半年度归属于上市公司股东的净利润为26.68亿元-27.28亿元，同比增长75.28%-79.22%。业绩变动主要系海外储能市场需求旺盛，公司紧抓窗口期实现销售放量。</p>\n  <p><strong>中金公司：预计上半年净利润同比增长78%-90%</strong></p>\n  <p>36氪获悉，中金公司公告，预计2026年半年度实现归属于母公司股东的净利润为人民币77.08亿元到人民币82.27亿元，与上年同期相比，将增加人民币33.78亿元到人民币38.97亿元，同比增加78%到90%。报告期内投资银行、股票业务、财富管理等六柱核心业务协同发力，国际业务同步实现良好增长，带动整体经营业绩同比显著提升。</p>\n  <p><strong>海思科：预计上半年净利润同比增长513%-575%</strong></p>\n  <p>36氪获悉，海思科公告，预计2026年半年度归属于上市公司股东的净利润为7.90亿元-8.70亿元，同比增长513.25%-575.35%。业绩变动主要系创新药国内销售持续快速增长，以及多个产品对外授权交易收到首付款等款项，实现较大金额产品授权收入。</p>\n  <h2>投融资</h2>\n  <p><strong>“快造科技”完成10亿元融资，为一级市场消费级3D打印最大单笔融资</strong></p>\n  <p>36氪独家获悉，消费级3D打印企业“快造科技”（Snapmaker）于近期完成10亿元新一轮融资。本轮融资由凯辉基金领投，好未来战投跟投，美团战投、美团龙珠、高瓴创投、顺为资本���现有股东大比例超额追投，高鹄资本担任独家财务顾问。这是2025年以来消费硬件赛道规模最大的单笔融资之一，也是近两年一级市场消费级3D打印最大规模的单笔融资。</p>\n  <p><strong>“中科新松”完成数亿元A+轮融资</strong></p>\n  <p>36氪获悉，“中科新松”宣布正式完成A+轮数亿元股权融资，本次融资由洪泰基金、鼎晖百孚联合领投，诚通基金、大众聚鼎、广州素元等知名资本跟投，老股东东珺资本加注。</p>\n  <p><strong>“上海星合”完成数亿元融资</strong></p>\n  <p>36氪获悉，高端机床企业“上海星合”近日完成数亿元融资。本轮融资由五粮液基金领投，上市公司麦格米特跟投，深蓝资本担任长期独家财务顾问。融资资金将主要用于高端磨齿机、磨床、铣床等产品的研发投入，并推动新产品及海外市场的商业化。</p>\n  <p><strong>“星辰新能”完成近5亿元第三轮融资，正式开启Pre-IPO轮融资进程</strong></p>\n  <p>36氪获悉，近日，“星辰新能”完成近5亿元人民币第三轮融资。本轮投资方包括绍兴星辉、中信建投资本、四川绿色、东方财富投资、工银资本、长石投资、艾斯能源等多家机构。这是星辰新能继去年完成超3亿元人民币融资后，再次获得资本市场加注。本轮融资落地后，公司正式开启Pre-IPO轮融资进程。</p>\n  <h2>酷产品</h2>\n  <p><strong>谷歌发布会定档8月12日，将发布Pixel 11系列手机</strong></p>\n  <p>谷歌宣布将于美国东部时间8月12日18点在纽约举办Made By Google发布会，将发布Pixel 11系列手机。谷歌Pixel 11系列手机将彻底取消128GB版本，全系机型都将升级至256GB起步，Pro、Pro XL和Pro Fold机型额外提供1TB版本。（界面新闻）</p>\n  <p><strong>整理</strong>｜葡萄</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s?__biz=MzI2NDk5NzA0Mw==&amp;tempkey=MTM4Ml9VM3QydVNTV2pHcjd6K2JULVdPZnlPQ0xaa3lxdWdBRmY5UzR2SHloeG9OUzlwcGpSSGVaYzROa2RKRGdLOVYtOGxDUldobHZWanZ3bjB6dkp5dHJhem8tci11bTZmOXFZeTJYbG9XVlc4TlJJQzZPRGZsOGl5aGJ1U2xCU05YbnlSMVdodkFyYnByMGV0SmtqX1ZYVVBqV0pPZE1QUzVaV3FDajVnfn4%3D&amp;chksm=680b875cabea47232952c1de690307f9c85a9fc858269ec9d05799618a402400f3095a600dc8&amp;mpshare=1&amp;scene=1&amp;srcid=0709KdQnLyOW9UQ7K1woMQAF&amp;sharer_shareinfo=363fc028524e091303d2ec0a3ec64aac&amp;sharer_shareinfo_first=306159b703c9171e13b258a68d6157b2#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-07-09T00:03:11+00:00", "fetched_at": "2026-07-09T02:32:45.472559+00:00", "fingerprint": "eef0ce22dfe3cec1"}, {"source": "36氪 - 最新文章", "title": "上市前夜｜35岁清华学霸冲港股IPO，做出手机指纹中国第二", "url": "https://36kr.com/p/3887659913083392?f=rss", "summary": "<p>本文约3300字，建议阅读7分钟</p>\n  <p>作者&nbsp;|&nbsp;彭孝秋</p>\n  <blockquote>\n   <p><strong>编者按：</strong>《上市前夜》栏目聚焦企业冲刺资本市场的关键时刻。每一份招股书里，都藏着一家企业上市前的野心、周期与隐忧。这是第四期——极豪科技。</p>\n  </blockquote>\n  <p>近日，极豪科技（JIIOV Technology）正式向港交所递交招股书。这家公司做的不是手机、不是模组，而是藏在手机指纹解锁背后的那颗感知大脑。</p>\n  <p>按沙利文口径，按2025年收入计，极豪在中国智能手机生物识别解决方案市场排名<strong>第二</strong>，份额14.5%；它的指纹传感器已经装进了<strong>中国十大手机品牌里的八家</strong>。听上去是个闷声赚钱的卖铲子故事，但硬氪翻完364页的招股书后发现，这门生意的账本、股东名册和人脉网，远比中国第二要曲折。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_2ed96318b34e42b8a7e643e5d27f3292@430412560_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>光学指纹传感器贡献大头收入，亏损收窄</strong></h2>\n  <p>极豪2023—2025年收入分别为2.08亿、3.68亿、4.69亿元，三年复合增速<strong>50.1%</strong>；毛利率从26.3%一路爬到37.6%。最亮眼的是盈利��点：经调整净利润（非国际财务报告准则）从2023年亏6681.4万，收窄到2024年亏1371.2万，到2025年<strong>转正为盈利2046.4万元</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_6b5f364f3caa41f087b84dff1d08516f@430412560_oswg51471oswg1080oswg589_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>看着，是熬出头了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_11388459946b40e3b2872632149a1099@430412560_oswg455534oswg1080oswg781_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但经调整口径剔除了两项：以股份为基础的付款（618.4万）和赎回负债账面值变动（2866.4万）。把这两项加回来看国际财务报告准则（IFRS）报表。2025年极豪年内亏损<strong>1438.4万元</strong>。最近三年 IFRS 净亏损分别是9178.2万、3827.7万、1438.4万。</p>\n  <p>亏损确实在快速收窄，但真实的账面还没跨过盈亏线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_9171c53c9db1429bbe670d1d66b125ff@430412560_oswg42994oswg1080oswg499_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>拆开极豪的收入结构能看到，2025年<strong>90.9%来自智能手机解决方案</strong>，贡献4.26亿元。其中是两类指纹传感器的此消彼长：<strong>光学指纹传感器</strong>，屏下指纹用的高阶方案，2025年收入<strong>2.81亿，占比60.0%</strong>，毛利率45.8%。这是增长主引擎，三年时间从0.81亿飙到2.81亿。</p>\n  <p><strong>电容式指纹传感器</strong>，侧边和背面的传统低阶方案，2025年收入1.45亿，占比30.9%，毛利率只有<strong>15%</strong>。且已见顶回落，2024年也是1.45亿，几乎零增长。</p>\n  <p>一升一降的意义很清楚。极豪整体毛利率从26.3%提到37.6%，靠的就是<strong>高毛利的光学指纹在收入里占比越来越大、低毛利的电容指纹被稀释</strong>。光学指纹主要集成在中高端机型，是真正的利润来源。电容指纹更像是走量的存量业务。</p>\n  <p>真正的变量是第三块<strong>技术服务（NRE）</strong>。这块2023年才247.9万，2025年<strong>暴增到3996.4万，占收入8.5%</strong>，毛利率高达<strong>62.3%</strong>。NRE 是一次性工程服务费，对应的是极豪给智能眼镜、具身智能客户做的前期定制开发。</p>\n  <p>侧面来看，这是极豪把故事从手机指纹往智能眼镜+具身智能延伸的第一个想象力。虽然目前占比还小，但增速和毛利率都最猛。</p>\n  <p>算一笔单位经济也能感受这门生意。极豪本质是个 Fabless 芯片+算法公司，芯片交给第三方晶圆代工，自己卖的是专有芯片+算法组合。它可在大幅保留模型精度前提下，把模型的算力需求降低1000倍以上、也能塞进边缘端跑。这是它敢用算法定义硬件、而不是迁就硬件的底气，也是光学指纹能拿到45%毛利的原因。</p>\n  <p>此外，2025年经营活动现金流<strong>转正为1225万元，</strong>2023、2024年分别为-2866.9万、-529.2万。造血刚刚开始，但至少方向对了。</p>\n  <p>值得一提的是，按2025年收入（不含iOS），中国智能手机生物识别前五名合计吃掉80.8%的市场。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_b743a5bd2373477f8b82ca7f11467f38@430412560_oswg73580oswg1080oswg330_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从表中可知，<strong>老大应为汇顶科技，收入约为极豪的3.4倍、份额49.3%，目前是个巨头</strong>。但是在这个整体增长缓慢的成熟赛道里，汇顶增速只有4.1%，而极豪跑出了44.4%的复合增速。</p>\n  <p>前五名里增速第二的公司，复合增速约15%，极豪是其三倍。按出货量计，极豪份额24.1%、也是第二。</p>\n  <p>也就是说，在一个成熟到快见顶的市场里，极豪是唯一一个还在三位数加速增长的玩家。它的差异化叙事是：<strong>别人还在用单场景算法、模组堆叠，极豪是当前中国感知交互市场里唯一有感知交互大模型的公司</strong>，用统一多模态模型把指纹、人脸、手势、眼动、触觉都收进一个架构，理论上能低成本横向扩展到新终端。</p>\n  <p>不过这套数据飞轮+统一模型是不是真护城河，得看智能眼镜和具身智能能不能兑现。目前这两块还主要是 NRE 阶段，其中智能眼镜方案已通过小米、荣耀等四家验证，vivo Vision 也用了极豪的手势方案。具身智能5毫米超薄传感器，2026 Q2 才完成模组开发。</p>\n  <p>极豪的销售模式也决定了客户集中度高，2023-2025年<strong>前五大客户占总收入 99% 、97.4% 、89.6%</strong>，<strong>单一最大客户就占 44.5% 、46.8% 、 41.4%</strong>。2025年集中度虽有下降，但一家客户拿走四成收入，仍是悬在头上的剑。</p>\n  <p>极豪<strong>不直接卖给手机品牌，而是通过代理，把芯片+算法卖给模组制造商</strong>，模组厂再整合成模组交付给品牌。招股书披露的三家大客户，客户集团B做摄像头模组+指纹模组，2023年占收44.5%，2025占比27.4%；客户A做指纹识别模组，2023年占28.2%，2025年占比41.4%。全是模组厂，不是终端品牌。</p>\n  <p>这个位置有利有弊：好处是卡在上游、被八家头部品牌选中，需求有天花板护着；坏处是<strong>极豪隔着模组厂和代理，离终端品牌隔了两层，议价权和订单能见度都受制于中间环节。</strong>一旦某家大模组厂切换供应商或砍单，或许冲击直接而剧烈。供应端同样集中，2025年前五大供应商占采购额84%，其中第一大供应商占比50.1%。</p>\n  <p>不过，极豪2025年<strong>贸易应收周转仅19天、存货周转76天、应付46天</strong>（因为主要通过代理销售、回款快）。这一点跟很多增收不增现金的硬件公司不同，极豪收钱挺利索。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_1cfaaefe26d64201ab5a1bf0dd777d10@430412560_oswg4716oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>无控股股东，旷视科技+豪威班底</strong></h2>\n  <p>极豪2020年成立至今，其完成的股权融资和股权转让为：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_05a08b25c481488c9198ca3326bee838@430412560_oswg52321oswg1080oswg428_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p><strong>第一次股权转让（2021/12）：每股仅&nbsp;2元&nbsp;，涉资1.02亿元。这是全场地板价，资方是北京千寻/北京兴昊（员工持股相关平台）</strong></p>\n  <p><strong>第二次股权转让（2021/12）：每股&nbsp;7元&nbsp;，涉资5000万元，巡星投资（OPPO 生态）透过豪威、下游供应商认识入场；</strong></p>\n  <p><strong>Pre-A 轮（2022/03，结清2022/11）：投入1亿元，每股&nbsp;12.60元，投后估值人民币18.9亿；其中韦豪5000万元、启明4000万、台湾分销巨头大联大1000万等；</strong></p>\n  <p><strong>第三/五/六次转让（2022–2024）：每股稳定在&nbsp;11.27元；</strong></p>\n  <p><strong>第四次转让（2023/08）：每股 9.62元，北京千寻转让4910万给启明；</strong></p>\n  <p><strong>A 轮（2024/06）：海河沄柏投入3300万，每股&nbsp;12.93元，投后估值人民币19.5亿；</strong></p>\n  <p><strong>第七次转让（2026/02，临上市前）：每股&nbsp;13.04元，资方为深圳陆骐1200万、厦门清悦3300万。</strong></p>\n  <p>谁是这场IPO最大赢家？看入场成本就懂。<strong>最早一批以每股2元、7元进来的机构，相对A轮12.93元、更相对未来的招股价，账面浮盈以数倍到几十倍计</strong>。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_c8606de89b2f4d61841124fe575df29a@430412560_oswg94406oswg1080oswg388_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>但这里有个不寻常的信号，<strong>Pre-A 轮（2022）投后18.9亿，到 A 轮（2024）投后仅19.5亿</strong>。两年多时间，估值几乎没动。这说明极豪在2022—2024年这段时间内，一级市场并没有给它明显溢价。估值的抬升主要压在了这次IPO上，招股书也披露港股上市门槛市值须大于40亿港元。</p>\n  <p><strong>创始人陈可卿，35岁，清华计算机本硕</strong>（2014学士、2017硕士），约15年深度学习与计算机视觉经验。2017至2019年，他是北京旷视科技（Megvii）的副总经理，主导过 Face ID 云身份验证平台的开发。其通过极众创芯（13.72%）和豪宏芯勤（11.98%），合计控制<strong>25.70%投票权。</strong></p>\n  <p>极豪本质是一支从旷视出走的AI视觉团队：<strong>CFO 张亮去年11月加入</strong>，清华、毕马威出身，做过<strong>旷视战略投资高级经理</strong>，又当过港股上市公司爱芯元智（00600）的高级财务总监；<strong>独董许欣然</strong>（33岁），前<strong>旷视首席软件开发工程师</strong>，现任<strong>月之暗面（Kimi 母公司）工程副总裁</strong>；</p>\n  <p>项目管理总监孔沅、算法中心总监汤瑶博士、研发中心总监王海生，<strong>清一色前旷视班底</strong>。</p>\n  <p>招股书中，极豪唯一提到的联合创始人为陈先生（Tan Kah Ong），称“公司创立初期，豪威指派陈先生，就公司设立、初期业务规划、运营体系搭建等一系列基础事务提供战略指导与落地支持”。</p>\n  <p><strong>Tan Kah Ong，56岁，曾任豪威副总裁17年</strong>，如今是豪威投资平台上海韦豪创芯的合伙人兼董事总经理；产品营销总监方军、供应链总监李嗣勇也都出自豪威。豪威本身持股18.40%，是极豪最大的产业股东之一。极豪 Fabless 造芯、要拿晶圆产能、要打进手机供应链，豪威给的是<strong>图像传感器龙头的产业链资源</strong>。</p>\n  <p>产业资本还不止豪威。<strong>OPPO 生态的巡星投资持股4.66%，其最终实益拥有人正是 OPPO 创始人陈明永</strong>；<strong>启明创投</strong>通过启明融乾+启明融凯，合计持有5.40%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_60abd59d6ec44d4ba1e99c36248010bd@430412560_oswg48818oswg1080oswg209_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（图源/硬氪整理）</p>\n  <p>值得一提的是，极豪单一最大持股方是北京兴昊，持有22.05%，并无控股股东。</p>\n  <p>极豪的故事，是一支旷视系清华团队，用一颗感知交互大模型，在成熟到快见顶的手机指纹赛道里跑出了三倍于同行的增速，做到了中国第二、覆盖八成头部品牌。</p>\n  <p><strong>排版｜范馨雅</strong></p>", "category": "tech", "published_at": "2026-07-09T00:12:43+00:00", "fetched_at": "2026-07-09T02:32:45.472550+00:00", "fingerprint": "0ecafc4626233c06"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 物理AI公司获晶科能源、国投创新等数亿融资，要做全球能源基础设施“大脑”", "url": "https://36kr.com/p/3887726503688968?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260709/v2_f5ee7e0511474f27833b094691d67fa7@6221844_oswg121767oswg2276oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>2200</strong>字，建议阅读<strong>6</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，物理AI企业深度智控（DeepCtrls）近期完成数亿元人民币B轮融资。本轮融资由晶科能源战略投资，国投创新、招银国际联合领投，红杉中国、源码资本、光远资本、招商局创投等老股东持续跟投。</p>\n  <p>本轮资金将主要用于核心物理AI算法与产品线的持续研发、标准化产品DeepBot的规模化拓展，以及东南亚、中东、欧美等海外市场的进一步布局，持续夯实“物理AI全球能源基础设施重塑者”的技术与市场底座。</p>\n  <p>深度智控（DeepCtrls）基于自研“PhyAI”物理AI引擎，构建了业内独有的机电能源系统物理AI模型，将物理机理与AI深度耦合，让AI真正“理解”设备底层物理特性，从根源上解决工业AI“黑箱不可信”的行业痛点，使AI具备可解释、可追溯、可迁移等能力。</p>\n  <p>“相比大多数仍停留在‘诊断建议系统’阶段的工业AI，深度智控（DeepCtrls）让AI真正理解物理世界，在真实环境中实现自主寻优、自主决策和闭环控制，已完成从市场主流的L2/L3级控制向L4/L5级AI自治的代际跨越，直击工业与智算中心领域的核心痛点。”深度智控COO张雨馨表示。</p>\n  <p>她进一步指出，以DeepSeek为代表的生成式AI，大幅提升了AI在数字世界的理解与推理能力；DeepCtrls所深耕的物理AI，则聚焦AI在真实物理世界的自动识别、自主决策、自主优化与闭环控制，是AI产业落地的终局形态。</p>\n  <p>这并非蹭热点的命名巧合，却精准道出了AI在不同发展阶段的特点与使命——深度智控（DeepCtrls）的名字与物理AI技术路线，早在2018年公司成立之初就已确立。“DeepSeek聚焦数字世界的‘深度求索’，攻克的是大模型的逻辑推理与内容创造，让AI拥有‘思考的能力’，代表AI的上半场；DeepCtrls则聚焦物理世界的‘深度控制’，攻克的是工业能源系统的自主闭环运行，让AI拥有‘动手的能力’，开启AI下半场。二者共同构成了AI从思考推理、到实体控制的完整产业闭环。”张雨馨表示。</p>\n  <p>这一路线源于创始人李辉博士二十余年的跨领域深耕与积累。从在清华大学深耕物理模型研究，到在美国劳伦斯伯克利国家实验室从事AI与能源的交叉研究，李辉逐步形成了“物理+AI”的技术路径，也为深度智控（DeepCtrls）后续的产品研发与产业化奠定了基础。</p>\n  <p>在张雨馨看来，中国完整且复杂的工业体系，为物理AI提供了全球独有的训练与验证环境。半导体、新能源、数据中心等行业不仅系统复杂、能耗高，而且对控制精度与系统稳定性的要求也极高。这些场景既是过往技术路线难以突破的领域，也成为物理AI最早实现规模化商业闭环落地、最容易跑出技术壁垒的产业场景之一。</p>\n  <p>相比不少物理AI企业仍处于概念与试点验证阶段，深度智控（DeepCtrls）自2023年商业化以来，已连续多年保持营收翻倍增长，去年实现规模化盈利，率先跑通了物理AI的商业闭环，形成了头部客户复购、标准化产品放量、智算中心与海外市场爆发的多轮驱动结构。</p>\n  <p>据了解，深度智控（DeepCtrls）已服务超过360家头部企业客户，包括台积电、长鑫存储、中际旭创、工业富联、腾讯、字节、宁德时代等头部集团企业。海量、高复杂度场景打磨出的技术能力，也逐步形成了海外企业难以复刻的壁垒。目前，深度智控（DeepCtrls）的模型基于超过30万台设备的实时运行数据持续迭代，最终炼出的PhyAI物理AI引擎，模型泛化误差低于3%，逼近系统理论最优极限。</p>\n  <p>这种在国内超复杂场景，打磨验证成熟的产品能力，成为深度智控（DeepCtrls）拓展海外市场的核心优势。2024年，深度智控（DeepCtrls）启动全球化布局，产品快速落地东南亚、中东、北美等十余个国家和地区，2025年海外业务已直接切入海外本土高端制造与智算中心核心场景。</p>\n  <p><strong>硬氪：海外业务核心竞争力是什么？未来全球化布局有什么规划？</strong></p>\n  <p><strong>张雨馨：</strong>一是物理AI的技术代差优势。海外绝大多数能源系统控制仍还停留在L2级专家规则阶段，我们的物理AI产品经头部客户复杂场景打磨成熟，具备自主寻优和闭环控制能力，因此在进入全球市场时具备明显的技术优势。二是海外智算中心市场需求的高速爆发，而能源与温控正成为新的增长瓶颈，这为物理AI产品带来了广阔的市场机会。未来我们会继续巩固东南亚市场，重点布局中东、北美等高价值市场，推动物理AI更深入地进入全球能源基础设施核心场景。</p>\n  <p><strong>硬氪：行业大多数工业AI还停留在概念验证或试点阶段，深度智控是极为稀缺的实现规模化应用且盈利的物理AI企业，核心原因是什么？</strong></p>\n  <p><strong>张雨馨：</strong>核心源于物理AI的底层技术。我们构建了机电能源系统的物理AI模型，将物理机理深度融入AI，并最终实现L4/L5级自主闭环控制。一方面，物理定律打底让AI的决策过程具备可解释性、确定性与可靠性，解决了工业场景“黑箱不可信、不敢用”的落地障碍；另一方面，物理AI模型具备强泛化性，无需在每一个新场景从零积累数据与建模，可跨设备、跨系统、跨场景迁移复制，因而自然能跑通规模化商业闭环。</p>\n  <p><strong>硬氪：未来几年公司的战略重点是什么？</strong></p>\n  <p><strong>张雨馨：</strong>AI产业的发展，正在将能源问题推向前所未有的重要位置。从Deep Learning到Deep Reasoning，再到Deep Controls，AI正在经历一次从数字认知向物理闭环控制的能力跃迁。深度智控（DeepCtrls）正在做的，是让AI不仅能够理解世界，也能够安全、可靠地优化控制真实系统。</p>\n  <p>因而我们的战略将始终围绕“物理AI能源基础设施重塑者”的定位展开：第一是纵向持续深耕PhyAI物理AI引擎，实现全场景覆盖，所有产品最终实现L5级自主智能；第二是横向拓展能力与价值，从即插即用的设备端AI控制模块，到系统级优化控制，再到算电协同与源网荷储一体化的全域能源调度；第三是加速全球化布局，我们最终重塑的，是支撑全球产业与AI算力持续运行的能源基础设施。</p>", "category": "tech", "published_at": "2026-07-09T01:20:08+00:00", "fetched_at": "2026-07-09T02:32:45.472533+00:00", "fingerprint": "043c1c63b95b88de"}, {"source": "少数派", "title": "好的桌面需要设备，更需要灯光：明基×少数派线下店体验空间升级", "url": "https://sspai.com/post/110993", "summary": "如果你最近正在考虑升级自己的桌面，或者想体验墨水屏显示器、屏幕挂灯、阅读灯在真实环境下的使用效果，欢迎来到少数派深圳线下体验店，坐下来试试看。<a href=\"https://sspai.com/post/110993\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T03:00:00+00:00", "fetched_at": "2026-07-09T02:32:44.008726+00:00", "fingerprint": "f5a8fe370d0dbf13"}, {"source": "少数派", "title": "我的出行好伙伴，用 iPhone 一站式解决旅途痛点", "url": "https://sspai.com/post/112044", "summary": "暑期将至，许多「大朋友、小朋友」都会选择在最近两个月内出游。在旅行的过程中，我们难免会遇到各种各样的问题，也会遇到各种各样令人心烦的琐事。如果你恰好在使用iPhone，不妨看看我如何从出发前、在路上、 ...<a href=\"https://sspai.com/post/112044\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T07:14:26+00:00", "fetched_at": "2026-07-09T02:32:44.008719+00:00", "fingerprint": "976375af029ba4cd"}, {"source": "少数派", "title": "乌兰布统，草原观星", "url": "https://sspai.com/post/111923", "summary": "以后争取每年都来乌兰布统这一大片地方走走看看。<a href=\"https://sspai.com/post/111923\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-08T09:26:49+00:00", "fetched_at": "2026-07-09T02:32:44.008712+00:00", "fingerprint": "e08e042cc9c9cb2f"}, {"source": "少数派", "title": "派早报：GPT-5.6 即将开放使用、Nothing 发布 Phone (4b) 等", "url": "https://sspai.com/post/112091", "summary": "Notion 推出全新应用 Agents、Jolla Phone (2026) 手 26/jul/07/elon-musk-doge-cuts-usaid-ebola", "summary": "<p>Experts say cuts have hindered the response to DRC’s Ebola outbreak and resulted in ‘significant numbers’ of deaths</p><p>Elon Musk has an Ebola problem. SpaceX stock dropped precipitously after its initial public offering, and Tesla faces a wave of lawsuits. But instead of focusing on his companies, Musk has posted frequently on X about the US Agency for International Development (USAID), which he helped dismantle – or, in his words, feed into the woodchipper – last year.</p><p>“Elon’s USAID crash-out over the past week has been a thing to behold,” said Jeremy Konyndyk, a former top USAID official who oversaw the agency’s Ebola response in 2014-2015 and the president of Refugees International. “In a way, it’s helpful that Elon is doing this, because it’s putting attention back on the issue of what he did last year.”</p> <a href=\"https://www.theguardian.com/technology/2026/jul/07/elon-musk-doge-cuts-usaid-ebola\">Continue reading...</a>", "category": "politics", "published_at": "2026-07-07T11:00:06+00:00", "fetched_at": "2026-07-08T02:14:28.866015+00:00", "fingerprint": "5f221a2f3a20c2c2"}, {"source": "The Guardian - World", "title": "Catnip lotion as effective as Deet at repelling mosquitoes, study finds", "url": "https://www.theguardian.com/global-development/2026/jul/07/catnip-lotion-as-effective-as-deet-at-repelling-mosquitoes-study-finds", "summary": "<p>Researchers testing a cheap, homegrown oil in Uganda found what cats knew all along – it worked as well as the artificial chemical used globally </p><p>A homegrown catnip lotion has proven “just as effective as Deet” as a mosquito repellant in trials carried out in Uganda.</p><p>Catnip, or <em>Nepeta cataria</em>, is a common herb from the mint family. The chemical in the plant that causes feline euphoria – nepetalactone – also has insect-repelling properties but this has not previously been commercialised.</p> <a href=\"https://www.theguardian.com/glo ade by its Superintelligence Labs division. The Muse Image model now powers the image-making tools across the Meta AI app, Instagram, and WhatsApp, and it's coming soon to Facebook and Messenger, according to an announcement on Tuesday. It's part of the growing Muse family of AI [&#8230;]", "category": "tech", "published_at": "2026-07-07T20:31:58+00:00", "fetched_at": "2026-07-08T02:14:27.614997+00:00", "fingerprint": "779fe69a19a664e4"}, {"source": "The Verge", "title": "Netflix is about to host videos from BuzzFeed, Condé Nast, and other publishers", "url": "https://www.theverge.com/streaming/962528/netflix-digital-media-brands-streaming", "summary": "Starting on August 3rd, Netflix's streaming library will include video content from dozens of digital media brands including BuzzFeed, Cond&#233; Nast, Hearst Magazines, People Inc, and Tastemade. As reported earlier by TechCrunch, the deal includes a mix of licensed past videos and new ongoing series that would have typically been published on YouTube or other [&#8230;]", "category": "tech", "published_at": "2026-07-07T21:37:19+00:00", "fetched_at": "2026-07-08T02:14:27.614992+00:00", "fingerprint": "2671f7ae2b26e9d4"}, {"source": "The Verge", "title": "Of course viewers are giving up on Netflix shows", "url": "https://www.theverge.com/entertainment/962382/netflix-season-two-viewrship-dropoff-beef-avatar-one-piece-tiktok", "summary": "Even though Netflix is the world's most popular paid streaming service, the company has been struggling to keep viewers watching its series after their first seasons. Beef - the streamer's anthology about people locked in feuds - lost 70 percent of its viewership when it returned earlier this year. There seems to be some confusion [&#8230;]", "category": "tech", "published_at": "2026-07-07T21:58:39+00:00", "fetched_at": "2026-07-08T02:14:27.614986+00:00", "fingerprint": "718442ff55c6dbca"}, {"source": "The Verge", "title": "Meta’s glasses will turn off the camera if you tamper with the privacy light", "url": "https://www.theverge.com/gadgets/962514/meta-privacy-light-tampering-smart-glasses-update", "summary": "Amid public backlash over its smart glasses, Meta announced that it will be updating its glasses with a new feature that will disable the camera when it detects that someone has tampered with or destroyed the glasses' privacy LED light. The update is meant to address modders who have taken actions such as physically drilling [&#8230;]", "category": "tech", "published_at": "2026-07-07T23:55:19+00:00", "fetched_at": "2026-07-08T02:14:27.614977+00:00", "fingerprint": "3f32262a31b3c2f3"}, {"source": "36氪 - 最新文章", "title": "瑞为技术暗盘破发，收盘跌17%｜敲钟时刻", "url": "https://36kr.com/p/3885560015220997?f=rss", "summary": "<blockquote>\n   <p>《敲钟时刻》栏目聚焦企业正式登陆资本市场的关键时刻。每一次敲钟之后，市场都会给出它对一家企业增长、估值与成色的第一重答案。</p>\n  </blockquote>\n  <p>在7月7日下午的暗盘，<strong>视觉具身智能第一股瑞为技术（07656.HK）</strong>破发了<strong>。</strong>暗盘收在17.99港元，较21.66港元的发行价跌16.94%，对应市值54.92亿港元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_b2063cbd802e4df784ed1882a2a42c13@430412560_oswg679827oswg1290oswg2464_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>整个暗盘交易中，盘中最高冲到<strong>25港元</strong>，涨15.4%；最低砸到<strong>16.07港元，</strong>跌25.8%；<strong>振幅高达41.23%</strong>，均价20.26港元，全天成交额5310万港元。</p>\n  <p>瑞为此次IPO，<strong>既没有引入基石投资者，也没有设置绿鞋（超额配股权）机制。</strong>无基石带来的连锁反应是：<strong>全流通、且薄。</strong></p>\n  <p>这次全球发售2808.70万股，仅占发行后总股本的<strong>9.20%。</strong>按发行价算，绝对流通市值只有约6.08亿港元。因为没有基石锁定，这9.20%从上市第一刻起就<strong>全部可以自由交易</strong>。</p>\n  <p>薄盘＋全流通＋无稳价，是一个天然放大波动的组合。可售筹码少，一点买盘就能冲高，一点卖压也能砸穿。暗盘里25.00到16.07港元的巨大区间，就是这种薄筹码在无稳价环境下的双向甩动。它可能在情绪好时助涨，但在情绪弱时，同样会加速下跌。</p>\n  <p>情绪和结构之外，还有估值这本账。按发行价21.66港元，发行后约3.05亿股，发行市值约66.1亿港元，<strong>静态市销率约12.9倍</strong>。<strong>而瑞为2025年收入同比只增长了12.1%，</strong>2023、2024、2025年收入分别为2.42亿、3.95亿、4.43亿元。</p>\n  <p>IPO前的最后一轮E轮，2025年8月完成后的投后估值是人民币35.5亿元。<strong>发行市值约是它的1.61倍，即便暗盘破发后也还有1.34倍。</strong></p>\n  <p>作为18C身份冲刺的新股，瑞为2023、2024、2025年净利润分别是-3258万、+829万、-6815万，中间2024年短暂盈利。</p>\n  <p><strong>但应收账款是压在报表上的大石头。</strong>2025年末，瑞为的应收账款净额高达<strong>5.87亿元，反超全年4.43亿的收入</strong>；周转天数从200天一路飙到<strong>440天</strong>（2025上半年一度1047天）。</p>\n  <p>毛利率最高（59.2%）的智慧民航，2025年收入不升反降24.7%；顶上来的是低毛利（16.4%）的政府驱动安全驾驶订单。</p>\n  <p>暗盘属于场外交易，对这家公司真正的考验，从来不在暗盘那两个小时，而在上市之后。明天首日上市表现如何，持续关注。</p>", "category": "tech", "published_at": "2026-07-07T12:59:57+00:00", "fetched_at": "2026-07-08T02:14:27.412631+00:00", "fingerprint": "4d76fc98a1f2b201"}, {"source": "36氪 - 最新文章", "title": "「德睿智药」获5200万美元B轮融资，AI设计的减肥药已进入3期临床｜36氪首发", "url": "https://36kr.com/p/3885479689465858?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36 氪获悉，德睿智药近期已完成 5200 万美元B轮融资，投资方包括头部人民币和美元基金，凯乘资本为独家财务顾问。募集资金将用于AI制药引擎Molecule Arts Platform（MAP）升级迭代，完善其多智能体（Multi-Agent）协同体系与临床数据闭环（Clinical Data-in-the-Loop），以及推进自研口服GLP-1小分子MDR-001的III期临床和商业化、拓展其他差异化创新药管线。</p>\n  <p>德睿智药的愿景是成为AI Native生物制药公司，创始人兼CEO牛张明拥有多年德国AI医疗上市公司CTO经验。他认为，传统新药研发高度依赖资深专家经验，需要合成数百上千个分子反复试错。但如今，AI技术的突破正有望不断颠覆这一传统路径，将大海捞针般的“试错式”新药研发模式，转变为由数据驱动的可计算、可迭代的“标准化创造”。</p>\n  <p>这也是德睿智药搭建MAP的初衷。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_92db90325a1b449a886c7f9f82d0dbc0@5930287_oswg1303508oswg7680oswg4320_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">德睿智药Molecule Arts Platform（MAP）技术平台示意（图源：德睿智药）</p>\n  <p>据介绍，Molecule Arts Platform（下称“MAP”）平台共分为3层架构：第一层是AI设计层，整合了公司自研的PharmkGPT生物学平台、Molecule Pro小分子制药平台和Molecule Dance结构生物学平台，可覆盖小分子、多肽等多种类型药物从临床前到IND申报的全流程。</p>\n  <p>第二层干湿互补实验平台主要承担数据供给工作，主要由干实验仿真系统Proxima Matrix和湿实验室Proxima Foundary同步运转，持续产出高质量训练数据支撑AI模型迭代。“德睿智药自有200张显卡自主训练生物医药基座大模型、自建数据产线，目的是让制药公司更接近一个能快速迭代的AI Native公司，并通过标准化实验室定制化产出模型需要的高质量数据。”牛张明表示。</p>\n  <p>第三层则是Clinical Pro临床AI平台，它并非简单沉淀临床数据，而是试图把临床反馈纳入研发系统，用于校正前期计算和实验判断。这也是德睿智药区别于其他AI制药企业的核心壁垒。这些反馈部分来自于德睿智药通过自有临床管线积累的临床研究数据或临床数据，比如，Clinical Pro已依托GLP-1管线MDR-001沉淀超1300例脱敏临床相关数据。</p>\n  <p>“我们没有把MAP单纯定义为一个AI工具，而是一套可以持续学习、��化的药物研发系统。其核心愿景是，<strong>通过AI多智能体助手连接起临床前到临床的全流程数据，‘Clinical Data-in-the-Loop’，持续自我迭代。这样，每一条管线无论成败，产生的真实数据都能反向提升平台能力，进而降低后续新药研发成本与失败概率</strong>。”牛张明表示。</p>\n  <p>目前，MAP的首款验证药物MDR-001已于2025年底经进入III期临床阶段。公司已在国内完成招募760名受试者，合作临床中心近50家。若顺利，该药物“有望于未来2-3年内在中国上市”，冲击千亿美金GLP-1市场。</p>\n  <p>回顾MDR-001研发历程，德睿智药团队在8个月内、合成80余个全新小分子的情况下，就完成PCC（临床前候选分子）确认，从立项到启动III期临床用时约为4年半、投入约2300万美金（德睿智药提供数据称，这一效率达到行业平均10倍以上）。而传统方法下，一款创新药从设计到进入III期临床往往需7-9年时间，耗资3-4亿美元。</p>\n  <p>这种高效率并非个例。得益于AI技术的赋能，创业至今，德睿智药团队仅40余人，但已有15条创新管线在研，储备5款PCC、并在在中美两地取得3项IND批件。MDR-001之后，针对胰腺癌等无有效治疗方案实体瘤的WEE1 &amp; YES1双靶点药物MRANK-106也已获批临床。药物类型上，德睿智药的管线资产覆盖GPCR��分子胶、别构抑制剂、双靶点肿瘤小分子等多种前沿药物模态。</p>\n  <p>牛张明认为，随着AI技术逐步全方位进入公司的研发体系，未来AI Native Pharma公司的价值也不再局限于单纯的Biotech框架内。“传统Biotech估值逻辑来自单药NPV模型，而AI Native制药企业验证的是更高效生产药物的方法，就德睿智药而言，这便是MAP系统。随着越来越多药物管线的推进，MAP可以把既往研发经验迁移到后续管线中，形成持续复用的研发飞轮。”</p>\n  <p>这也曾是上一代CADD（计算机辅助药物设计）企业遵循的路径。以全球CADD先驱，市值1200亿美金的福泰制药（Vertex&nbsp;Pharma）为例，公司通过计算机精准设计分子的战略，持续推出数款年销售额超百亿美元的重磅药物，成长为千亿市值制药巨头。其经历证明，掌握最先进计算工具、最高预测精度后，或许能用更精简的资源撬动更大的商业回报。</p>\n  <p>如今，德睿智药希望以此为目标，打造AI时代的福泰制药，让“每一次分子设计、实验数据和临床结果都成为下一轮创新的起点”。公司期待持续将重磅药物推进临床乃至商业化，并以药品销售为公司提供稳定现金流，反哺AI技术平台的迭代，不断产出具备全球竞争力的新药资产。</p>", "category": "tech", "published_at": "2026-07-08T00:00:00+00:00", "fetched_at": "2026-07-08T02:14:27.412626+00:00", "fingerprint": "f7300762c4294ebb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨前华为天才少年吐槽DeepSeek面试，称面试官质疑他抄袭；苹果折叠屏已在量产；特朗普呼吁购买戴尔电脑，引发戴尔暴涨百亿美元", "url": "https://36kr.com/p/3886238403129353?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>网传“7月1日新规：新车智驾芯片自主化率不低于70%”系谣言</p>\n  <p>商业银行不良处置仍在加速，上半年全行业转让核销合计至少5000亿</p>\n  <p>国家外汇管理局：截至2026年6月末，中国外汇储备规模为34163亿美元</p>\n  <p>汇丰暂停向风险较高的私募信贷客户提供贷款</p>\n  <p>SpaceX公布AI数据中心计划，同步推进星链卫星脱轨</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>前华为天才少年吐槽DeepSeek面试，称面试官质疑他抄袭</strong></p>\n  <p>7月6日，前华为“天才少年”李博杰在社交平台公开吐槽DeepSeek的面试流程，提及流程较慢且繁琐，面试官存在态度问题，质疑他抄袭，他感到“被严重冒犯”。面试过程并不愉快，他还被面试官质疑抄袭。“因为在代码面试中有两个屏幕，面试官说我不断在瞟左边的屏幕，说我在抄代码，让我停止抄代码，并说如果我不能证明我没有在抄代码，面试就无法继续下去了。”李博杰选择了终止面试，并认为面试官的表现，与他想象中的DeepSeek不同。</p>\n  <p>李博杰是中国科学技术大学计算机科学博士、华为首批“天才少年”计划入选者，其个人网站介绍显示，他曾在SIGCOMM SOSP、NSDI、ATC、PLDI等顶级会议上发表多篇论文，曾获ACM中国优秀博士学位论文奖和“���软学者”奖学金。他目前正在投身大模型创业，是Pine AI首席科学家。DeepSeek表示在“努力将所有部门的规模扩大至少一倍”，并承诺让新人直接参与最核心、最重要的任务，希望员工能够快速成长为行��顶尖人才。对于这次面试，DeepSeek并未有官方置评。（第一财经）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4a53a5122fbd42318e1dffbd7d7afe8c@5667365_oswg243940oswg1080oswg1598_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">李博杰社媒截图</p>\n  <p><strong>苹果折叠屏已在量产</strong></p>\n  <p>多方消息表明，苹果首款折叠屏iPhone落地进度提速。记者从产业人士处求证获悉，该款折叠屏iPhone已经在量产阶段。代工龙头富士康率先启动大规模招工，为新机生产储备人力。7月7日，赣州富士康发布公众号招聘文章，要求招聘18至50岁员工，主要从事苹果手机精密组件的生产与加工；7月6日，富士康人资发文招募临时工，招聘范围覆盖龙华/观澜苹果A事业群、龙华三赢事业群。据悉上述业务群涉及折叠屏iPhone组装。（上海证券报）</p>\n  <p><strong>特朗普呼吁购买戴尔电脑，引发戴尔暴涨百亿美元</strong></p>\n  <p>美国总统特朗普在白宫活动上再次公开呼吁美国人购买戴尔电脑，其言论引发戴尔股价一度上涨近10%——这已经是最近特朗普第三次为戴尔公司“喊单”。美东时间7月6日，特朗普在椭圆办公室举行了一场“敲钟仪式”，同时敲响纽交所和纳斯达克的开市钟，庆祝“特朗普账户”的首个交易日——这是一种为18岁以下儿童提供税收优惠的投资工具。在仪式上，特朗普专门点名呼吁美国人出门买戴尔电脑：“出去买一台戴尔电脑吧。”而在他身边站着的，正是戴尔公司创始人迈克尔·戴尔本人。特朗普在活动上，直接表达了对迈克尔·戴尔及其妻子苏珊·戴尔的支持和赞美，此前两人已承诺向“特朗普账户”项目捐赠超过60亿美元。这并非特朗普首次公开支持戴尔公司。今年2月和5月，他都曾用类似措辞称赞戴尔公司的捐赠行为。（中新经纬）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯“吐司”iOS版正式上线</strong></p>\n  <p>36氪获悉，7月6日，腾讯旗下的AI应用生成及灵感共创平台“吐司”iOS版正式上线。作为一款零门槛的VibeCoding产品，用户只需用自然语言描述需求，就能借助吐司生成并调整专属App。据了解，吐司将于8月面向开发者生态全量开放一站式上架服务、商业化组件能力以及更多API能力。</p>\n  <p><strong>支付宝AI开放平台开启邀测</strong></p>\n  <p>36氪获悉，7月7日，支付宝正式上线AI开放平台，面向商家、机构、服务商、智能终端、大模型平台等生态伙伴开放AI接入能力。</p>\n  <p><strong>AI小程序成长计划上新混元Hy3</strong></p>\n  <p>36氪获悉，据腾讯公开课，小程序成长计划再次升级，据了解，本次升级把资源扶持加码到底，大模型Token额度从1亿提升至10亿，AI生图额度从1万张提升至10万张；同时模型全面升级至混元最新模型Hy3与Hy Image 3.0生图模型。</p>\n  <p><strong>微软开始在部分软件中改用自研AI模型，减少对OpenAI和Anthropic依赖</strong></p>\n  <p>微软公司寻求降低人工智能成本，正开始在Excel和Outlook等软件产品中以自研模型取代OpenAI和Anthropic的模型。据一位知情人士透露，这两款广泛使用的软件中，每周有数以万计的AI任务由微软内部开发的MAI人工智能模型完成。该知情人士表示，此前Excel和Outlook更多依赖OpenAI和Anthropic的模型。（新浪财经）</p>\n  <p><strong>Meta推出AI图像生成模型，接入聊天机器人和Instagram</strong></p>\n  <p>Meta Platforms Inc．发布一款新的图像生成式人工智能（AI）模型，这是该公司一年前斥资数十亿美元重建AI实验室、由Alexandr Wang担任首席AI官以来首次发布此类模型。该公司在博客文章中表示，这款名为Muse Image的模型周二上线Meta AI聊天机器人。它还将嵌入Meta旗下多款社交应用，包括Instagram和WhatsApp。用户可以利用该模型根据文本提示生成图像，也可以要求它修改现有图片。广告主也将很快能够使用该模型来制作营销材料。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美股三大指数集体收跌，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，7月7日收盘，美股三大指数集体下跌，道指跌0.25%，纳指跌1.16%，标普500指数跌0.45%。大型科技股涨跌不一，Meta涨超2%，亚马逊涨0.75%，英伟达涨0.71%，微软涨0.54%，奈飞涨0.21%，谷歌涨0.16%；英特尔跌超9%，SpaceX、Arm跌超6%，特斯拉跌超4%，苹果跌0.64%。存储芯片股继续下挫，闪迪(SNDK.O)跌7%，西部数据(WDC.O)跌近8%，美光科技(MU.O)跌4.7%。热门中概股多数下跌，爱奇艺跌近7%，富途控股跌超4%，小鹏集团、蔚来、老虎证券、百度跌超2%，哔哩哔哩、拼多多、名创优品、京东跌超1%；唯品会涨超1%，理想汽车涨0.25%，阿里巴巴涨0.23%。</p>\n  <p><strong>网传“7月1日新规：新车智驾芯片自主化率不低于70%”系谣言</strong></p>\n  <p>36氪获悉，近日，有网民发布题为《7月1日新规正式落地！新车智驾芯片自主化率不低于70%》的文章。文中称“7月1日，工信部联合市监总局出台的《新能源汽车车规级AI芯片技术规范》正式强制执行”，并称“国内生产、销售的所有新能源乘用车���智驾芯片全链路关键技术自主化率必须达到70%以上，不达标车型禁止申报、生产、上牌”。经工业和信息化部核查，并未发布过该文件，也从未就新能源车芯片技术自主化率作出规定。</p>\n  <p><strong>商业银行不良处置仍在加速，上半年全行业转让核销合计至少5000亿</strong></p>\n  <p>商业银行仍在加快不良资产的处置。银登中心和机构最新统计数据显示，上半年银登中心转让不良为1011亿元，结合前5个月商业银行不良核销4868亿元，粗略合计上半年全行业不良资产处置至少超5000亿元。（财联社）</p>\n  <p><strong>中国规上工业企业人工智能应用普及率已超30%</strong></p>\n  <p>工业和信息化部科技司副司长甘小斌在7月7日举行的上海市新闻发布会上表示，今年人形机器人全年整机产量有望突破10万台。制造业是人工智能赋能应用的主战场。目前，中国规上工业企业人工智能应用普及率已超30%，人形机器人开始“进工厂、下车间”。目前工业和信息化部正会同各方深入实施“模数共振”“人形机器人与具身智能实景实训”等专项行动，挖掘高价值应用场景。大会期间，中国—金砖国家人工智能发展与合作中心将发布“国际人工智能伦理治理行动计划”。（界面新闻）</p>\n  <p><strong>国家外汇管理局：截至2026年6月末，中国外汇储备规模为34163亿美元</strong></p>\n  <p>36氪获悉，国家外汇管理局统计数据显示，截至2026年6月末，中国外汇储备规模为34163亿美元，较5月末下降260亿美元，降幅为0.75%。2026年6月，受主要经济体宏观经济数据、主要央行货币政策及预期等因素影响，美元指数上升，全球主要金融资产价格表现涨跌互现。汇率折算和资产价格变化等因素综合作用，当月外汇储备规模下降。中国经济总体平稳、向新向优发展，有利于外汇储备规模保持基本稳定。</p>\n  <p><strong>暑假机票价格大跳水，多条热门航线票价低于高铁</strong></p>\n  <p>进入7月，2026年暑运正式启幕。受暑运航班增加、燃油附加费大幅下调等因素影响，今年暑期机票价格成为近年来的“洼地”，7月上旬多条热门航线机票售价甚至低于高铁二等座票价，带动机票预订量大涨。根据航班管家最近几天的票价监测，暑运期间的平均经济舱票价比去年同期和2019年同期都要低。比如暑运第五天（7月5日）的平均票价831.5元，同比2025年下降2.3%，同比2019年下降7.6%；暑运第四天的平均票价822.4元，同比2025年下降2.3%，同比2019年下降2.4%。</p>\n  <p>7月7日，界面新闻查询航旅纵横发现，从北京出发，有多条航线价格低至200元起。具体包括北京—吕梁、北京—鞍山，价格200元起；北京—长治，价格210元起；北京—榆林、北京—太原，价格220元起。另外，北京到长春、武汉、南昌和西安等多个省会城市的机票价格也都在300元以内。（界面新闻）</p>\n  <p><strong>浙大求是鹰商标注册与阿玛尼无关，代理人辟谣浙大连夜抢注商标</strong></p>\n  <p>有网友发现，浙江大学校徽中的“求是鹰”图案和奢侈品品牌阿玛尼的logo相似，引发讨论。</p>\n  <p>杭州恒慧商标事务所有限公司顾问张奕峰负责代理浙江大学的商标注册事务，他告诉第一财经记者，浙江大学之前注册过整体校徽图案的商标，但没有注册过单独的“求是鹰”图形。去年年底对这个图形进行了商标注册申请，主要因为当时有很多小公司在冒用这个图案，和大家提到的奢侈品牌没有关系。（第一财经）</p>\n  <p><strong>亏损加剧叠加需求淡季，7月建材计划产量继续走低</strong></p>\n  <p>据SMM调研重点生产钢企56个样本数据：7月螺纹计划产量742.8万吨，较6月实际产量减少38.97万吨，降幅4.98%；7月螺纹日产23.96万吨，环比降幅8.05%。7月线盘计划产量319.7万吨，较6月实际产量增加1.87万吨，增幅0.59%；但7月线盘日产10.31万吨，环比降幅2.66%。焦炭第十轮提涨发起，落地虽处于博弈阶段，但钢厂6月经过额外的3-4轮提涨，产成材效益持续压缩，部分企业已处于亏损阶段，现阶段钢厂盈利率在33.33%，较6月下降明显，目前普遍效益水平在（-200-100）之间。（财联社）</p>\n  <p><strong>汇丰暂停向风险较高的私募信贷客户提供贷款</strong></p>\n  <p>据英国《金融时报》7日援引知情人士的话报道，汇丰银行最近几周告知部分客户，由于决定停止向收益不足以弥补风险的私募信贷基金放贷，因此将不再续签客户的贷款协议。知情人士还补充说，汇丰银行将转而专注于向风险较低的私募信贷基金放贷。（财联社）</p>\n  <p><strong>韩国股市7月7日再次熔断</strong></p>\n  <p>韩国交易所7月7日公告称，当地时间13时51分34秒，启动KOSPI指数熔断机制，交易暂停20分钟。韩国交易所（KRX）7月7日公告称，当地时间10时23分41秒，因KOSPI200近月期货价格较前一交易日基准价下跌5.12%，触发韩国股市“边车”（程序化交易临时停牌）机制。根据规定，KOSPI市场程序化卖单暂停5分钟，以缓解市场短期剧烈波动。此次触发时，KOSPI200近月期货报1227.32点，较基准价1293.58点下跌66.26点。（界面新闻）</p>\n  <p><strong>智谱涨幅扩大至10%</strong></p>\n  <p>36氪获悉，智谱涨幅扩大至10%。此前智谱辟谣“撤回A股IPO辅导备案”：不属实，存在恶意炒作之嫌，A股发行辅导工作已完成。</p>\n  <p><strong>Omdia：中国半导体市场规模将在2026年超过8000亿美金，存储芯片市场总额暴涨262.9%</strong></p>\n  <p>36氪获悉，Omdia报告显示，2026年中国半导体市场预计同比增长率将大幅上修至92.9%，达8120.8亿美元，相较于《AMFT出货量：中国——2025年四季度更新》版本（2026年中国半导体市场预计增长31.26%，市场规模将达到5465亿美元）整体上调了2656亿美金，增幅达到48.6%。根据Omdia 2026年二季度最新数据显示，2026年中国半导体存储市场预计增长率大幅上修至262.9%，达4496亿美元。</p>\n  <p><strong>SK海力士大幅波动放大杠杆ETF风险，韩国政府称将研究完善措施</strong></p>\n  <p>随着SK海力士股价波动加剧，追踪SK海力士股价两倍涨跌幅的单只股票杠杆交易所交易基金（ETF）之间，收益率差距也扩大至超过5个百分点。市场指出，由于产品结构和基金管理能力的差异正在直接反映到收益率上，投资者需要提高警惕。与此同时，韩国副总理兼企划财政部长官具润哲表示，针对单一个股杠杆产品，“正在讨论完善方案”。（财联社）</p>\n  <p><strong>汇丰暂停向风险较高的私募信贷客户提供贷款</strong></p>\n  <p>据英国《金融时报》7日援引知情人士的话报道，汇丰银行最近几周告知部分客户，由于决定停止向收益不足以弥补风险的私募信贷基金放贷，因此将不再续签客户的贷款协议。知情人士还补充说，汇丰银行将转而专注于向风险较低的私募信贷基金放贷。（财联社）</p>\n  <p><strong>Meta称美国四个州在8月的青少年安全诉讼中寻求1.4万亿美元罚款</strong></p>\n  <p>Meta7月6日在一份法庭文件中表示，美国四个州正寻求对其处以1.4万亿美元的罚款，指控该公司设计其Facebook和Instagram平台旨在使年轻用户上瘾，并误导公众对其安全性存在误解。Meta在回应各州总检察长提交的关于如果各州胜诉应如何计算罚款的文件时提出了这一数字。（新浪财经）</p>\n  <p><strong>SpaceX公布AI数据中心计划，同步推进星链卫星脱轨</strong></p>\n  <p>太空探索技术公司SpaceX7月6日公布了一项新的AI数据中心建设计划，同时确认正在按计划推进约100颗第一代星链卫星的脱轨操作。这标志着这家由埃隆·马斯克领导的航天企业正加速向AI基础设施领域延伸布局。根据公司发布的信息，SpaceX计划在美国中西部建设一座专门面向AI工作负载的数据中心，将直接利用其星链卫星网络提供的高速低延迟数据回传能力。（新浪财经）</p>\n  <p><strong>LG新能源预计第二季度营业利润将因电动汽车需求疲软而下降77%</strong></p>\n  <p>韩国电池制造商LG能源解决方案（LGES）7月7日表示，预计4月至6月的营业利润将下降77%，至1130亿韩元（7391万美元），原因是电动汽车（EV）需求疲软继续拖累电池销售。相比之下，LSEG SmartEstimate的预测利润为2490亿韩元，该预测主要参考了那些预测准确率更高、更稳定的分析师的观点。（新浪财经）</p>\n  <p><strong>智谱基石解禁日获近七成基石投资者表态长期持有</strong></p>\n  <p>7月7日，记者获悉，智谱在基石投资者解禁窗口临近之际，获多家机构投资者明确表态长期看好并将继续持有。表态机构包括JSC International Investment Fund SPC、WT Asset Management、Optimas Capital Limited和智谱早期股东及基石投资人凌云光技术股份有限公司等，合计持股占本次解禁基石股数的近七成，涵盖了国家级战略资本、地方政府产业引导基金、大型国企产业基金及市场化专业投资机构。（证券时报）</p>\n  <p><strong>中国央行连续第20个月增持黄金</strong></p>\n  <p>36氪获悉，据央行数据，中国6月末黄金储备报7544万盎司，5月末黄金储备报7496万盎司，为连续第20个月增持黄金。6月末外汇储备报34162.6亿美元，5月末34422.38亿美元。</p>\n  <h2>上市进行时</h2>\n  <p><strong>玻色量子启动IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，北京玻色量子科技股份有限公司于2026年7月6日在北京证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为国泰海通证券。</p>\n  <h2>大公司财报</h2>\n  <p><strong>招商证券：上半年净利润同比预增93%—112%</strong></p>\n  <p>36氪获悉，招商证券披露业绩预告，预计2026年上半年实现归属于母公司股东的净利润净利润为100亿元—110亿元，同比增长93%—112%。</p>\n  <p><strong>光库科技：上半年净利润同比预增170%—190%</strong></p>\n  <p>36氪获悉，光库科技披露业绩预告，预计2026年上半年实现归属于上市公司股东的净利润1.4亿元—1.5亿元，同比增长170%—190%。</p>\n  <p><strong>瑞芯微：上半年净利润同比预增60.03%—71.33%</strong></p>\n  <p>36氪获悉，瑞芯微披露业绩预告，预计2026年上半年营业收入28.7亿元至29.1亿元，同比增长40.28%至42.24%；归属于母公司所有者的净利润8.5亿元至9.1亿元，同比增长60.03%到71.33%。</p>\n  <h2>投融资</h2>\n  <p><strong>“迈巨微电子”完成数千万元融资</strong></p>\n  <p>近日，“迈巨微电子”完成数千万元融资，由华宝新能领投，老股东欣旺达、启赋资本持续加注，资金将主要用于智能单电芯级多维监测传感器芯片MagiCell™的量产导入、MagicFETs™与MagicAFE™系列产品线的迭代扩产，以及面向工商业储能和汽车电子市场的研发与市场拓展。迈巨微电子是一家专注于锂电池安全管理芯片和智慧电芯传感器芯片解决方案的国产半导体设计公司，已形成覆盖全电压段的完整芯片产品矩阵。</p>\n  <p><strong>“逸文科技（Even Realities）”宣布完成Pre-B轮融资</strong></p>\n  <p>7月6日，“逸文科技（Even Realities）”宣布完成Pre-B轮融资，融资金额为1.5亿美元，投后估值超10亿美元，正式跻身独角兽行列。本轮融资由美团龙珠及美团战投领投，腾讯及其他老股东超额跟投。成立不到三年，逸文科技已经完成多轮融资，投资方包括红杉资本、鼎晖投资、爱尔眼科、青山资本等一众一线机构。（中国基金报）</p>\n  <p><strong>整理</strong>｜葡萄&nbsp;</p>", "category": "tech", "published_at": "2026-07-08T00:09:01+00:00", "fetched_at": "2026-07-08T02:14:27.412620+00:00", "fingerprint": "5f8a03c510a28f7d"}, {"source": "36氪 - 最新文章", "title": "36氪独家 | 快造科技完成10亿元融资，为一级市场消费级3D打印最大单笔融资", "url": "https://36kr.com/p/3885728813691145?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪独家获悉，消费级3D打印企业快造科技（Snapmaker）于近期完成10亿元新一轮融资。本轮融资由凯辉基金领投，好未来战投跟投，美团战投、美团龙珠、高瓴创投、顺为资本等现有股东大比例超额追投，高鹄资本担任独家财务顾问。</p>\n  <p><strong>这是2025年以来消费硬件赛道规模最大的单笔融资之一，也是近两年一级市场消费级3D打印最大规模的单笔融资。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_cddc5ad8eb444fcd88b935717212245b@5836910_oswg416616oswg864oswg486_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>此外，硬氪独家了解到，得益于U1这代产品，快造科技营收同比增长10倍。</strong></p>\n  <p>过去十年，消费级3D打印经历了从概念到落地的完整周期。不过长期以来，单色、单材料的产品体验将其局限在工程师、极客群体和部分消费者中——用户能打印的东西\"不够好看、不够好用\"，是制约市场破圈的核心瓶颈。</p>\n  <p>\"多色多材\"打印技术的成熟，正在打破这一瓶颈，也是U1破局市场的关键。当一台桌面设备能够同时实现多色外观与多材内里的结合，3D打印的输出物将具备接近消费品的品质——不再是\"打印一个单色零件再进行组装\"，而是\"直接创造出一个可即刻使用的彩色成品\"。</p>\n  <p>这一变化的意义在于技术体验能够跨过\"够用\"门槛，迎接更大的消费级市场。</p>\n  <p>多色多材料已成为消费级3D打印的共识方向。然而，当前行业主流方案依赖单喷头反复换料，每次换色都需要抽料、进料和冲刷，导致打印一个多色模型动辄数十小时，产生大量废料，且较难支持多材料混合打印。这对普通大众而言，远未达到消费级体验。</p>\n  <p>快造科技选择突破更难的技术创新路线。其旗舰产品U1采用4独立工具头+SnapSwap™快速换头系统的全新架构，从底层重新设计多色打印的工作流。相较传统方案，U1实现了5倍打印效率提升、耗材浪费减少约80%。这不是参数层面的渐进优化，而是架构层面的代际跨越。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260707/v2_e03da1c4c08e4f9882a2a371a4314ffe@5836910_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>市场的反馈已验证该判断：U1在Kickstarter平台筹得2061万美元（约1.5亿元人民币），获得全球超2万名用户支持，刷新全球3D打印品类众筹历史纪录。过去半年，快造科技从众筹爆发到规模化交付，实现新品的闭环验证，<strong>目前已实现超10万台交付</strong>。</p>\n  <p>在快造科技看来，下一步的商业机会在于围绕创造行为本身构建生态——硬件是入口，耗材实现复购，内容社区创造粘性，AI实现创作门槛的降低。</p>\n  <p>硬氪了解到，快造科技今年的战略重心是模型站点建设，帮助用户实现一键打印，并积极探索AI工具的应用，降低3D设计门槛。未来公司希望从单点设备能力走向系统性生态构建：让用户不仅\"能打印\"，更\"想打印、会打印、持续打印\"，真正实现“让每个人都能在物理世界中自由创造”。</p>", "category": "tech", "published_at": "2026-07-08T00:50:00+00:00", "fetched_at": "2026-07-08T02:14:27.412612+00:00", "fingerprint": "39bd01a8bf20414d"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 获上海国投领投，这家量子传感企业产品已落地惯性导航、气体监测等", "url": "https://36kr.com/p/3886301334630407?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_7d290a69b7d74c58a7ac5cdb3d51b253@6221844_oswg529905oswg804oswg535_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，上海量感智能科技有限公司（以下简称“量感智能”）近日已完成数千万元天使轮融资，由孚腾资本（上海国投旗下）领投，六禾创投跟投。</p>\n  <p>量感智能公司于2023年9月成立，由上海交通大学量子感知研究所成员孵化。公司聚焦量子传感方向，已推出的产品覆盖惯性导航、气体监测等市场。公司同步深耕量子 AI 技术研发与应用，推动相关算法和硬件模块快速实现商业化落地。同时，公司结合量子传感与量子智算，致力于打造量子智能传感器。</p>\n  <p>硬氪了解到，量感智能联合创始团队共四人，均来自上海交通大学。其中创始人是国内最早一批从事量子信息科技研究的学者之一，90年代起进入该领域，现为上海交大长聘教授、博导，德国洪堡学者，上海交大量子感知与信息处理研究所所长。</p>\n  <p>量子技术正在经历从实验室到产业化的关键转折。量子传感作为量子信息三大方向之一，与实际应用场景的距离相对更近，落地探索较快。</p>\n  <p>近年来，电力电网对痕量气体监测的刚性需求、惯性导航领域对高精度低成本陀螺仪的迫切期待等，都为量子传感技术提供了明确的市场空间。</p>\n  <p>公司依托自研的光量子增强核心技术，搭建了覆盖量子惯性导航、量子气体监测的产品体系：</p>\n  <p>一是多梯度量子导航设备，可实现降本提效，优化无人装备作业能力，高端技术能够突破国内工艺瓶颈、填补行业空白，适配高端装备、军民相关核心应用场景、科研领域等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_4c05ed93177d4ee89e099d552cea7026@6221844_oswg43146oswg314oswg314_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">量子陀螺仪（图源/企业）</p>\n  <p>二是电力量子气体监测设备，检测灵敏、作业高效，可满足高压设备全天候监测需求，有望打破外资品牌的行业垄断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260708/v2_b93baa656f2645f091d07ab8a3df20c3@6221844_oswg43144oswg385oswg289_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">量子气检仪（图源/企业）</p>\n  <p>公司目前处于小批量试制阶段，已有少量订单交付，客户包括电网公司、航天院所等。</p>\n  <p><strong>以下为硬氪与量感智能公司副总经理陈康的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：量感智能的技术路线与市面上其它量子传感公司有何不同？</strong></p>\n  <p><strong>陈康：</strong>量感智能公司选择光量子增强技术作为核心实现手段，室温即可运行，突破口是“量子增强技术”。针对该技术，创始团队已经研究打磨了超过十五年，相继取得了一批优秀的科研成果、技术成果和工程成果，并在相关应用场景中得到了测试和应用验证。所研制的产品，通过量子增强技术放大微弱信号、抑制系统噪声，可直接与现有传感器架构无缝融合，不改变原有供应链和用户使用习惯，产品具有良好的鲁棒性和稳定性。</p>\n  <p><strong>硬氪：目前量子相关技术都仍较为前沿，你们核心技术的商业落地为何那么快？</strong></p>\n  <p><strong>陈康：</strong>量子精密测量是量子信息三大方向里最贴近产业应用的。特别是，我们的创始团队一直采取“机理探索、技术攻关、样机研制”的思路进行整体布局，因此早期开展的相关技术，经过多年打磨后已经具备了工程实践和应用能力。针对光量子增强技术，我们已经开展不少于15年的机理研究和技术积累，完成了从原理到工程实践的一些列验证，研制出了性能优异的量子增强模块产品，为其它系列产品的研制打下了扎实基础。例如，我们基于量子增强技术研发出微型光量子陀螺仪，核心部分只有米粒大小，却可以达到导航级精度，去年进一步完成了外场星载测试验证，目前正在进行工程实现以及相关应用验证。又如：几年前我们提出了基于量子增强技术的高灵敏、快速、多组分痕量气体检测新方案，并在此基础上研制出了量子气检仪样机，并通过了CNAS第三方检测认证，某电网公司采购后，该产��效果得到认可，现在正在推进后续合作。</p>\n  <p><strong>硬氪：公司接下来的战略重点是什么？</strong></p>\n  <p><strong>陈康：</strong>重点围绕三个方面，公司将继续基于光量子增强技术，以 “量子感知” 为基础、“量子智算” 为高度、“量子感算” 为方向，为客户提供高性能产品和高价值解决方案。</p>\n  <p>一是产品打造；目前以量子传感器扎根市场，打磨产品、优化迭代，以量子陀螺仪为例，在提升精度的同时把体积做小，覆盖军民两用市场。下个阶段，将量子传感器和量子智能相结合，打造量子智能传感设备或者系统。</p>\n  <p>二是市场培育，量子技术对很多行业来说还是新事物，客户需要时间验证稳定性和经济性。去年我们的营收已经突破千万，未来增长我们主要打造现有场景的复制。</p>\n  <p>三是团队扩充，相信有资本的加持后，公司的科研团队和市场团队能够得到快速成长，产品研发的速度和市场开拓的速度能够得到质的提升。为公司打开更大的市场。加速量子产品和产业的实际落地。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>孚腾资本表示：</strong>“十五五”规划将量子科技列为未来产业重点方向，其中量子测量产业化路径最为清晰，能够直接突破高端传感器的“卡脖子”问题，并快速嵌入现有工业与科研体系。上海交大量子感知团队长期深耕量子技术，在量子传感领域实现多项突破性进展。已推出量子陀螺仪（系列）、气检仪（系列）等产品，并在市场得到小试，形成了明确的产业化基础，展现出良好的发展前景。</p>\n  <p><strong>六禾创投表示：</strong>我们坚定看好量感智能在量子精密测量领域的先发优势与技术壁垒。量子信息技术正迎来从实验室走向工程化落地的关键拐点，而高精度量子传感是产业化最先、也最具确定性的核心方向之一。量感智能团队在量子增敏测量技术方面实现了机理创新，其产品方案已在高精度导航定位、气体监测等关键场景完成验证。本轮融资后，我们期待量感智能加速核心产品的批量交付与标杆客户拓展，成为量子精密测量的头部创新力量。</p>", "category": "tech", "published_at": "2026-07-08T01:10:36+00:00", "fetched_at": "2026-07-08T02:14:27.412598+00:00", "fingerprint": "51be2894aa1b5943"}, {"source": "少数派", "title": "新手日记的「为什么」与「写什么」", "url": "https://sspai.com/post/111655", "summary": "如何迈出日常写作的第一步？<a href=\"ht
