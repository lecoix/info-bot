ves the home screen a much-needed update to the interface it launched with in 2024. It had already added Alex Plus AI support, but the new interface has a cleaner, fully customizable layout that fits more smart home info and controls on the [&#8230;]", "category": "tech", "published_at": "2026-06-11T22:06:32+00:00", "fetched_at": "2026-06-12T03:32:01.639209+00:00", "fingerprint": "6ec888266e2c0bb1"}, {"source": "36氪 - 最新文章", "title": "最前线｜坦途科技全球首款消费级水上飞行器首飞，拓展水陆空场景出行生态", "url": "https://36kr.com/p/3848476414792709?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>近期，智能户外出行品牌坦途科技在苏州发布了全球首款消费级载人水上飞行器WaveFly 5X，并完成首次公开飞行。随着该产品的亮相，坦途科技的硬件布局正式从陆地短交通延伸至水域与低空出行领域。</p>\n  <p>这一新品类的推出，切中低空经济在消费端的产品空白。据摩根士丹利的预测，全球低空经济市场规模将在2030年突破2万亿美元，其中水域飞行是一个具备消费潜力的细分场景，但此前市场上缺乏面向普通消费者的量产产品。</p>\n  <p>坦途科技此次选择的“地效贴水飞行”形态，旨在通过技术手段降低个人飞行的准入和操作门槛。</p>\n  <p>在产品设计上，WaveFly 5X采用双串翼式布局与航空级碳纤维机身。由于其基于地效原理运行，飞行高度保持在距水面30至80厘米的低空，能够直接在开阔水面起降，无需专用跑道、机场和繁琐的飞行审批。在性能参数方面，该飞行器最高时速为85公里，最大载重140公斤，续航里程达80公里。机身搭载模块化快换电池，单次续航最长为70分钟。</p>\n  <p>对于非专业用户而言，WaveFly 5X的核心在于安全和操控的轻量化。由于近水飞行的地效特性，产品规避了传统航空器高空坠落的风险；同时，整机仪表盘被大幅精简，全流程操控被集成在单手摇杆上，用户无需考取专业航空驾照，经过短期培训即可上手。发布会现场，坦途科技已与美澳等地区合作伙伴签署了首批代理意向书。</p>\n  <p>水上飞行器的研发并非孤立进���。自2021年创立以来，坦途科技已在两轮短交通领域积累了近500项专利申报。其电动滑板车业务已在全球60多个国家和地区铺开，已搭建了通勤、越野、旗舰三大产品序列。滑板车研发中所积累的电池、电机和电控等工程经验，后续被系统性地复用到了智能电助力自行车产品线上，推出了面向城市通勤的高性能Speed&nbsp;Pedelec SP01和越野玩乐的Storm X Pro。</p>\n  <p>通过滑板车和E-bike的技术外溢，坦途科技正在将产品线向更广泛的户外出行周边渗透。除两轮工具外，其展出的硬件还包括搭载UWB跟随技术的Birdie系列高尔夫球包车、E-WAGON 4X-LITE电动露营车，以及辅助行走的机械外骨骼装备。</p>\n  <p>随着WaveFly 5X的正式亮相，坦途科技（NAVEE）实现了地面与水域、短途通勤与户外探索的场景融合。这款消费级产品的推出，在一定程度上回应了低空经济从概念走向实际落地的行业命题，也反映出该品牌推动智能户外出行从工具属性向生活方式演进的全球化产品企图。</p>", "category": "tech", "published_at": "2026-06-11T07:53:52+00:00", "fetched_at": "2026-06-12T03:32:01.482300+00:00", "fingerprint": "9e7212167e6bcb94"}, {"source": "36氪 - 最新文章", "title": "ChinaJoy最硬核的区域，36氪与你共同探索 | Vision Future前沿科技展区 × 36氪直播间开启预约", "url": "https://36kr.com/p/3848564910036229?f=rss", "summary": "<p>两个月后，<strong>ChinaJoy即将在上海浦东举办，这里又会挤满全国最爱玩、最关注前沿科技的年轻人。</strong></p>\n  <p>作为国内延续二十年的数字娱乐展会，ChinaJoy早已不只是玩家试玩新游戏的狂欢，它已经变成整个科技+数字娱乐行业一年一度的线下交汇点——这里有最新的产品、最先锋的趋势，更聚集了一群想改变行业的年轻人和创业者，在这里你能摸到这个行业最真实的脉搏。</p>\n  <p><strong>作为ChinaJoy Vision Future 前沿科技展区的战略合作伙伴，以及ChinaJoy AI未来生态大会的战略合作伙伴，36氪游戏与ChinaJoy 联合打造「ChinaJoy Vision Future 前沿科技展区 × 36氪直播间」，将一线报道的质感和信息密度直接带给观众。</strong></p>\n  <p>过去三年，科技对数字娱乐的改造速度超过了所有人的预期，AI从实验室概念变成了行业标配的生产工具，具身智能、新一代消费电子不断打开新的想象空间，整个赛道每天都有新公司、新产品、新模式冒出来，很多变化都发生在一线，只看线上通稿你根本摸不到真实的行业温度。</p>\n  <p>而变化也正在发生：刚刚结束的谷歌I/O大会上，谷歌发布Gemini Omni世界模型，直接把目标瞄准了\"生成符合物理规则的游戏开放世界内容\"；全球最大UGC游戏平台Roblox今年开放全平台AI生成工具后，目前平台超过三成的新增用户内容已经由AI生成。科技对数字娱乐的改造，早就不是概念，已经落到了每天的生产环节里。</p>\n  <p>36氪游戏从一开始就定位于「科技+数字娱乐」的交叉赛道，我们长期关注技术给游戏、数字娱乐、消费电子带来的真实改变，从AI生成内容进入游戏开发，到具身智能在娱乐场景落地，每一个新趋势出现的时候，我们都第一时间在一线报道。</p>\n  <p>这一次，<strong>36氪与ChinaJoy Vision Future前沿科技展区深度合作</strong>，将直播间直接搬到展区现场。<strong>7月31日到8月2日，我们将邀请18组嘉宾坐到镜头前，面对面聊聊科技到底给数字娱乐带来了哪些真变化。</strong></p>\n  <h3><strong>我们聊什么？聚焦「科技+数字娱乐」真问题</strong></h3>\n  <p>这次我们不聊空话，只聊一线真问题，核心话题覆盖：</p>\n  <ul>\n   <li><strong>AI+游戏</strong>：AI生成内容真的改变开发流程了吗？中小团队能靠AI追上大厂吗？世界模型能给开放世界开发降本多少？</li>\n   <li><strong>具身智能×数字娱乐</strong>：消费级具身智能产品离普通人还有多远？机器人能走进娱乐消费场景吗？</li>\n   <li><strong>新一代消费电子</strong>：AI眼镜、VR/AR这些新产品，真的能重构娱乐体验吗？</li>\n   <li><strong>新内容新商业模式</strong>：AI短剧、AI直播、AIGC营销，这些新方向真的跑出可持续的商业模式了吗？</li>\n  </ul>\n  <p>所有对谈都来自一线从业者，我们请来创业者、技术带头人、行业操盘手，坐到镜头前聊真实进展、踩过的坑、接下来的机会，给你呈现最鲜活的行业趋势。</p>\n  <p>目前我们正在定向邀请一批行业头部嘉宾和领先项目，现在还留出少量席位，面向优秀创业者、前沿项目和关注「科技+数字娱乐」领域的合作伙伴开放。</p>\n  <p><strong>如果你正在科技+数字娱乐赛道探索，认同我们对行业的判断，想在ChinaJoy Vision Future前沿科技展区现场面对全国行业观众分享你的产品、思考和判断，欢迎联系我们对接直播间席位。</strong></p>\n  <p><strong>同时，ChinaJoy Vision Future前沿科技展区展位正在火热招商中。</strong>&nbsp;展区聚焦AI、具身智能、新一代消费电子等前沿科技在数字娱乐领域的创新应用，是ChinaJoy最具科技含量的核心展区之一。欢迎科技企业、创新项目入驻前沿科技展区，与36氪直播间形成线上线下联动曝光。</p>\n  <p>我们欢迎所有符合主题的项目：不管你是AI游戏创业团队，还是做具身智能消费电子，或是在数字娱乐科技方向有新探索，都可以对接。</p>\n  <h2><strong>写在最后</strong></h2>\n  <p>这几年科技+数字娱乐的变化太快了，很多真实的行业趋势都在一线现场，藏在从业者面对面的聊天里，而不是PPT上。</p>\n  <p><strong>ChinaJoy Vision Future前沿科技展区 × 36氪直播间</strong>，就是想把这些一线的思考直接带给你——三天18场对谈，和18组真正在干的从业者聊聊，给你呈现科技+数字娱乐最真实的现在和未来。</p>\n  <p>2026年7月31日-8月2日，上海新国际博览中心E6馆ChinaJoy Vision Future前沿科技展区，我们直播间见。</p>\n  <h4><strong>对接联系方式：</strong></h4>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_6423823d96fa4b769f925beeeb209c8a@16519798_oswg100259oswg818oswg1215_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码了解</p>\n  <p><strong>或发送资料至邮箱：guopengchao@36kr.com</strong></p>", "category": "tech", "published_at": "2026-06-11T09:24:11+00:00", "fetched_at": "2026-06-12T03:32:01.482294+00:00", "fingerprint": "d0a6f60d541129d6"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜百万Token只要几块钱，算力价格还在往下降；OpenAI正考虑大幅下调产品价格；今起儿童旅客可购买铁路旅游计次票，票价为成人旅客的5折", "url": "https://36kr.com/p/3848516305605892?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848492224681223\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>克里斯蒂安·斯坦出任雷诺集团西班牙首席执行官</strong></a></p>\n  <p>7月1日起，克里斯蒂安·斯坦（Christian Stein）将接替何塞·马雷亚·里卡森（Josep María Recasens）, 出任雷诺集团西班牙新任首席执行官。何塞·马雷亚·里卡森将离开雷诺集团，寻求新的职业发展。克里斯蒂安·斯坦将在担任该新职务的同时，继续兼任雷诺集团首席传播官，并向雷诺集团首席执行官福兰（François Provost）汇报。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848022152401920\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>通用或停止将磷酸铁锂电池用于电动汽车</strong></a></p>\n  <p>通用汽车电池技术负责人表示，该公司可能会放弃使用低成本的铁基电池技术，而许多汽车制造商正在使用这种技术来降低电动汽车的成本。这家底特律汽车制造商此前曾表示，计划开发磷酸铁锂（LFP）电池，用于未来的电动汽车车型，并计划于2027年底在田纳西州一家合资工厂开始生产这种电池。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848509811250435\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</strong></a></p>\n  <p>数据显示，全球两大预测市场平台（Polymarket和Kalshi）针对本届世界杯冠军归属的事件合约成交额，已超过了20亿美元。这使得该事件有望刷新单项预测市场合约的成交纪录。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848456795542785\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>百万Token只要几块钱，算力价格还在往下降</strong></a></p>\n  <p>在一家算力超市了解到，他们目前提供两种类型产品，一种是针对算力的产品，一种是针对大模型Token的产品，两种产品采用不同的计费模式。负责人介绍：“算力租赁的产品，一张卡一小时是一种计费方式。第二种是包年包月，就是按Token计费，根据不同的模型，一般都是以百万Token为单位，百万Token大概是几块钱。按照现在的趋势来看，价格还在往下降。”据悉，这个算力超市的算力来自多个渠道，用户选好产品，超市负责匹配、调度和交付。此外，这家算力超市的负责人表示，目前他们服务的用户80%都是中小企业，覆盖了教科文、电商、人工智能、机器人、具身智能等多个传统和新兴行业。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848443731612929\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</strong></a></p>\n  <p>为从竞争对手Anthropic手中争夺客户，OpenAI正考虑大幅下调面向用户的收费标准。据知情人士透露，该公司计划大幅下调代币计费单价——代币是人工智能企业核算产品费用的计量单位。此举意在应对Anthropic预计也会推出的降价举措。目前，企业高管已开始对高昂的AI使用成本感到抵触。OpenAI首席执行官山姆・奥尔特曼在近期一场活动中坦言，成本问题已成为一大难题。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848307627136005\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>极兔回应被立案调查：高度重视，全面整改</strong></a></p>\n  <p>关于国家邮政局依法对极兔速递有限公司立案调查一事，极兔回应：极兔速递中国区高度重视，诚恳接受，坚决服从、全力配合主管部门依法依规开展的各项调查工作。极兔方面强调，安全生产是企业不可逾越的红线。极兔中国对照关于安全生产的重要指示深刻反思，深感作为品牌总部，在对使用“极兔速递”商标、字号、快递运单经营的部分企业落实安全保障统一管理责任方面存在差距和不足，教训深刻。对此，极兔中国诚恳接受监督。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848228866544903\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>速卖通欧美拉5国上线官方配送服务</strong></a></p>\n  <p>36氪获悉，阿里旗下跨境电商平台速卖通AliExpress近期在美国、波兰、法国、西班牙、墨西哥五国上线官方本地配送服务，覆盖欧洲、北美、拉美三大经济圈。据了解，商家加入后，可依托海外仓实现更稳定、更低成本的\"本地发货、本地配送\"。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848340680414467\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>影石发布全球首款8K徕卡双摄云台相机 Luna Ultra</strong></a></p>\n  <p>6月10日，智能影像品牌影石Insta360正式推出行业首款旗舰双摄云台相机Luna Ultra，3999元起售。据介绍，Luna Ultra是影石与徕卡联合研发的8K旗舰影像云台相机，首次将双徕卡Summicron光学镜头、8K杜比视界、专业级10bit I-Log融为一体，达成1-12倍黄金5焦段覆盖，覆盖旅行、日常Vlog、专业影像记录等多种场景。多个电商平台数据显示，该产品上架几分钟内即宣告售罄。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848442560599301\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>德国机器人公司Neura Robotics完成14亿美元融资，获亚马逊、英伟达等多方支持</strong></a></p>\n  <p>6月10日，德国机器人公司Neura Robotics宣布完成创纪录的C轮融资，本轮总规模最高可达14亿美元，旨在加速构建全球领先的物理人工智能平台。此轮融资获得了亚马逊、英伟达和欧洲投资银行等多方支持。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848497553609735\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>贵州茅台董事长陈华：价格不能出现大起大落，大家不传谣、不信谣</strong></a></p>\n  <p>6月11日下午，贵州茅台2025年度股东会在茅台会议中心召开，来自全国千余名茅台股东、机构投资者与分析师齐聚茅台镇。针对茅台酒价格问题，茅台集团董事长陈华表示，将随行就市，相对平稳，价格不能出现大起大落，供需适配、量价平衡。目前，茅台酒价格调整社会高度关注，公司对此高度保密，网上流传有各种信息，大家不传谣、不信谣。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848387791099141\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>特朗普：很快将与顶尖的人工智能公司高管会面，讨论如何回馈公众</strong></a></p>\n  <p>美国总统特朗普周三再次表示，希望顶尖的人工智能公司同意回馈公众，暗示美国政府可能持有这些公司的股份。特朗普称，自己很快将与行业顶尖的12或15名高管会面，讨论如何回馈公众，公众将因此变得非常富有，他认为行业高管们会同意这样做，且这一做法将非常受欢迎。上周五，特朗普首次公开表示，希望与人工智能公司会面，讨论让美国政府持有其公司股份的可能性，这些股份带来的收益未来可以分配给美国公众。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848134762697730\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>今起儿童旅客可购买铁路旅游计次票，票价为成人旅客的5折</strong></a></p>\n  <p>今天起儿童旅客可购买铁路旅游计次票，并享受儿童优惠票政策，亲子、家庭���游出行更加便捷实惠。此次推出的儿童旅游计次票是在既有成人旅游计次票基础上优化升级的服务产品。2023年6月开始实行的铁路旅游计次票产品，主要面向成人旅客发售，按照“1次购买、分段乘坐、15天有效”的模式运行，购票人可在指定的车站间自主选择2至10段行程出行，每段行程单次、单向、指定席别，票价均享受不同幅度的折扣优惠，最低为同径路同席别各车次平均执行票价的8.5折。</p>", "category": "tech", "published_at": "2026-06-11T11:00:00+00:00", "fetched_at": "2026-06-12T03:32:01.482287+00:00", "fingerprint": "25ffa464361ef3e3"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨SpaceX上市在即，马斯克或成全球首位万亿富翁；92年技术极客陈宇森接任钉钉CEO；比尔·盖茨就爱泼斯坦案出席国会听证", "url": "https://36kr.com/p/3849431503869187?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</li>\n   <li>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</li>\n   <li>SK海力士设备供应商要求涨价</li>\n   <li>端午前机票价格跳水</li>\n   <li>SpaceX上市前夕，美股太空股提前狂欢</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>SpaceX上市在即，马斯克或成全球首位万亿富翁</strong></p>\n  <p>据报道，SpaceX将于美东时间6月12日在纳斯达克挂牌交易，股票代码SPCX。根据SpaceX 6月11日在官网发布的声明，公司此次IPO发行5.556亿股，发行价为每股135美元，募资总额达750亿美元。SpaceX此次IPO募资规模是沙特阿美2019年创下的294亿美元上市纪录的逾两倍。声明显示，SpaceX还授予承销银行超额配售权，可按发行价额外购买8330万股股票。若该权利全部行使，IPO融资规模将增至约860亿美元。若按135美元定价，叠加特斯拉约15%持股及其他资产，马斯克身价突破1万亿美元，成为全球首位万亿富豪。（新浪财经、三言科技）</p>\n  <p><strong>钉钉换帅，92年技术极客陈宇森接任钉钉CEO</strong></p>\n  <p>36氪获悉，6月11日，阿里巴巴宣布钉钉管理层调整：陈航卸任钉钉CEO，92年技术极客陈宇森接棒。接任钉钉CEO后，陈宇森成为阿里巴巴最年轻的事业部CEO。陈宇森生于1992年，是年少成名的技术极客，也是技术型连续创业者，入选福布斯亚洲“30 Under 30“榜单。他曾在国内外顶级计算机赛事中屡获冠军，22岁时创办的网络安全公司长亭科技被阿里云收购。他2025年在阿里云内部创业，带领研发了AI Agent产品MuleRun。</p>\n  <p><strong>比尔·盖茨国会作证，称被爱泼斯坦用婚外情施压</strong></p>\n  <p>美东时间6月10日，前世界首富、微软公司联合创始人比尔·盖茨结束了在国会众议院监督与政府改革委员会的闭门听证会。作证期间，议员们主要询问了两人的交往细节、财务往来，以及盖茨是否知晓对方的犯罪行为。盖茨否认参与爱泼斯坦的非法行为，重申后悔认识他，并再次为曾与爱泼斯坦互动向盖茨基金会员工致歉。盖茨在个人网站上公布了当天的证词。盖茨强调，期间爱泼斯坦暗示知晓自己的几段婚外情，并以此向自己施压，重新取得联系。爱泼斯坦希望借助与盖茨的交往来接触美国政商高层，搭建自身的权力关系网络。（中国新闻周刊）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</strong></p>\n  <p>为从竞争对手Anthropic手中争夺客户，OpenAI正考虑大幅下调面向用户的收费标准。据知情人士透露，该公司计划大幅下调代币计费单价——代币是人工智能企业核算产品费用的计量单位。此举意在应对Anthropic预计也会推出的降价举措。目前，企业高管已开始对高昂的AI使用成本感到抵触。OpenAI首席执行官山姆·奥尔特曼在近期一场活动中坦言，成本问题已成为一大难题。（新浪财经）</p>\n  <p><strong>Anthropic CEO再次“喊话”警惕AI风险</strong></p>\n  <p>北京时间6月11日，Anthropic CEO达里奥·阿莫迪再次围绕AI安全发声。阿莫迪认为AI发展远超政策流程设计时应承载的速度，并在《人工智能指数政策》中表示，四年间，AI模型进步巨大，预估随着计算能力的不断提升，AI通用认知能力将呈指数级增长。但相比AI发展速度，政策，尤其是立法，推进得极为缓慢。阿莫迪表示，政府握有重大权力，但通常情况下不宜仓促行使。但这种时间尺度上的错配可能造成：在国会耗时数年方能采取行动的周期内，AI已从一个有趣的玩具演变为一个汇聚天才的国度。（第一财经）</p>\n  <p><strong>阿里云Meoo CLI发布，本地AI编程项目可直接部署上线</strong></p>\n  <p>36氪获悉，阿里云Meoo（秒悟）推出开源命令行工具Meoo CLl.安装后，Claude Code、Codex、Cursor等本地AI编程助手可通过该工具调用云端能力，完成数据库接入、用户登录、文件存储及项目发布，将本地项目推进到线上可用状态。</p>\n  <p><strong>谷歌推出DiffusionGemma开源模型</strong></p>\n  <p>谷歌当地时间6月10日发布实验性开源模型DiffusionGemma，采用文本扩散架构，在专用GPU上文本生成速度较传统自回归大语言模型最高提升4倍，模型以Apache 2.0许可证发布。谷歌称，DiffusionGemma定位为面向研究者和开发者的实验性模型，整体输出质量低于标准Gemma4，生产环境仍建议使用后者。该模型的速度优势主要体现于本地及低并发推理场景，在高并发云端部署中优势有限。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>SpaceX约400名持股员工身价或达1亿美元</strong></p>\n  <p>据财联社消息，6月11日，航空科技和人工智能公司SpaceX即将在周五IPO，而据此前报道，该公司的认购需求超过发行规模的四倍，总认购规模突破2500亿美元，远超计划的750亿美元募资目标。火爆的IPO也让持有SpaceX股票的员工满怀期待。SpaceX拥有2.2万名员工以及数百名已经离职的前员工，其中包括工程师和发射场的蓝领工人。据旧金山投资平台Hill.com的分析，SpaceX的4400多名现任和离任员工有望在IPO中成为百万富翁。其中，约有400人预计将获得1亿美元或以上的财富。Hill.com创始人兼首席执行官Andrew Benson指出，大多数IPO中通常只有创始人才能成为亿万富翁。而此次SpaceX推动400人身家达到1亿美元的门槛实属罕见，说明该公司正在创造巨额财富。（财联社）</p>\n  <p><strong>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</strong></p>\n  <p>数据显示，全球两大预测市场平台（Polymarket和Kalshi）针对本届世界杯冠军归属的事件合约成交额，已超过了20亿美元。这使得该事件有望刷新单项预测市场合约的成交纪录。（财联社）</p>\n  <p><strong>李书福卸任极氪董事长</strong></p>\n  <p>天眼查App显示，近日，浙江极氪智能科技有限公司发生工商变更，李书福卸任董事长，安聪慧卸任法定代表人，由淦家阅接任法定代表人。该公司成立于2021年7月，注册资本130亿人民币，经营范围包括数据处理服务、数据处理和存储支持服务、互联网数据服务、大数据服务等，由Zeekr Technology Limited全资持股。（证券时报）</p>\n  <p><strong>SK海力士设备供应商要求涨价</strong></p>\n  <p>据媒体消息称，近期SK海力士多家设备一级供应商提出涨价要求，供货价格涨幅在3%-4%。而SK海力士已要求这些供应���提交依据材料，以评估调价申请。业内人士指出，比较常见的是原材料和零部件供应商因成本波动较大而进行涨价谈判，但连设备厂也提出涨价要求则较为少见。（财联社）</p>\n  <p><strong>豆包手机硬件负责人林夕离职，曾任职于华为</strong></p>\n  <p>6月11日，据科创板日报消息，字节跳动AI硬件核心团队Ocean旗下、豆包手机硬件产品负责人林夕已于近日离职。这也是字节自2024年启动AI手机项目以来，首位出走的核心硬件管理人员。界面新闻就此向字节跳动方面求证，截至发稿，暂未有回应。公开信息显示，加入字节之前，林夕曾在华为终端长期任职，主要担任Pura X阔折叠手机硬件产品负责人。Pura X是华为首款“阔折叠”旗舰手机，也是全球首款量产16:10阔型内屏折叠屏。该产品于去年3月发布，起售价7499元，首销48小时预订量达120万台，首周激活量近10万台。（科创板日报）</p>\n  <p><strong>LABUBU亮相2026世界杯开幕式</strong></p>\n  <p>北京时间6月12日，2026美加墨世界杯开幕式正式开启，泡泡玛特麾下IP LABUBU登场，作为赛事特邀嘉宾，亮相世界级体育舞台。开幕式现场，两只身着球衣的LABUBU首度现身世界杯，以萌趣热血的球迷姿态亮相，也让中国原创IP登上国际赛场。泡泡玛特THE MONSTERS与FIFA世界杯联名系列已正式开售。（第一财经）</p>\n  <p><strong>7家涉火车票销售第三方平台被约谈</strong></p>\n  <p>6月11日，市场监管总局会同中央网信办、国家铁路局，依法约谈携程、同程、去哪儿、飞猪、美团、智行火车票、高铁管家等7家第三方平台企业，针对其不当宣传“候补帮抢”及付费选座业务、不当诱导用户“买长乘短”或“买短乘长”、不当收集和使用平台用户个人信息等不规范经营问题。（央视新闻）</p>\n  <p><strong>丰巢回应“取件得先看广告”</strong></p>\n  <p>近日，有多地市民反映称，“在丰巢快递柜取件时，会频繁弹出广告并跳转至其他平台”，引发网友持续讨论。6月10日，丰巢方面向南都N视频记者表示，“丰巢App内已提供‘广告展示’关闭选项，并于近期优化了相关界面，目前丰巢正与可能跳转广告的相关平台进行沟通。”（南方都市报）</p>\n  <p><strong>iOS 27打破15年肌肉记忆，通知下滑手势让位Siri AI</strong></p>\n  <p>据IT之家6月11日消息，iOS27、iPadOS 27系统中，苹果公司调整通知中心操作手势，打破了iPhone和iPad用户15年来的肌肉记忆。自苹果公司于2011年推出iOS 5以来，用户从屏幕顶部中央向下滑动，即可查看按照时间顺序排列的各应用通知。不过在iOS 27系统中，苹果启用Siri AI后，用户从屏幕顶部中央向下滑动，会唤出全新的Siri AI体验。不过通知中心并未消失，用户从左上角向下滑动即可访问。上一次苹果对手势做如此大的调整，是在iPhone X时代将控制中心从底部上滑改为右上角下滑。苹果随后在所有设备上统一了这一交互方式。如今轮到通知中心被重新定位。（IT之家）</p>\n  <p><strong>美团、淘宝闪购、京东外卖集体签约，建立“黑名单”共享机制</strong></p>\n  <p>36氪获悉，6月11日，广东省市场监管局举办网络餐饮平台自律公约和协同共治协议签署活动。活动中，在广东省市场监管局有关负责人的见证下，美团、淘宝闪购、京东外卖三家网络餐饮平台共同签署了《广东省网络餐饮行业高质量发展与食品安全自律公约》。公约全文共五章二十一条，紧扣《网络餐饮服务经营者落实食品安全主体责任监督管理规定》(国家市场监管总局第123号令)核心要求，围绕平台主体责任、入网餐饮商户管理、配送人员关怀、社会共治等方面作出明确约定，首次提出建立跨平台“黑名单”共享机制，对严重违法商户实施跨平台联合约束，实现“一处违法、全网受限”。</p>\n  <p><strong>理想法务部：就某公司利用AI批量生成不实内容一事，已报案</strong></p>\n  <p>6月11日，理想汽车法务部发文：近日，我司就江西某文化传媒公司利用AI工具批量生成涉理想汽车不实内容一事，正式向公安机关报案。相关执法部门已依法调查处置，涉事机构就上述行为公开道歉。近年来，针对我司旗下系列产品、品牌及用户的恶意诋毁、造谣行为持续发生，这些不法行为以批量捏造、散布涉理想车主的不实内容为主要方式，系统性污名化用户群体，并借此损害公司品牌声誉。我们将客观的批评监督与恶意的造谣诋毁严格区分开来。前者我们谦卑倾听，后者我们坚定回击。当违法者开始借助AI工具批量传播虚假信息，我们毫不犹豫拿起的是法律武器。（第一财经）</p>\n  <p><strong>端午前机票价格跳水</strong></p>\n  <p>随着端午节和暑假临近，民航运输再次步入旺季。近日，在深圳机场，已经有不少旅客提前出行，错峰出游。有旅客告诉央视财经记者，从沈阳坐飞机旅游，返程不是节假日的话，每张机票能便宜1000元。端午节前一周，从深圳飞往杭州、贵阳、海口、武汉等地均只需200多元，只有7月均价的一半甚至三分之一，一些飞往北方地区的长航线机票价格更划算。在线旅游平台统计数据显示，截至目前，端午前（6.1-6.15）错峰游机票预订量同比去年节前增长了19.6%。（央视财经）</p>\n  <p><strong>现货黄金跌破4100美元大关，创年内新低，多家品牌金饰价格较昨日下跌近40元/克</strong></p>\n  <p>6月11日，黄金白银再次大跌。亚市早盘现货黄金一路走低，日内最低跌超1%，下探到4023.1美元/盎司，创至2025年11月以来的新低。COMEX黄金期货最低跌超过2%，下探到4046.2美元/盎司。现货白银早盘最低下探到62.002美元/盎司，距离今年3月的低点60.85美元/盎司仅一步之遥。6月11日国内黄金饰品价格对比显示，多家品牌金饰价格较昨日下跌近40元/克，普遍报1236-1240元/克;周大福报价1238元/克，周生生报价1240元/克，老庙黄金报价1238元/克。（界面新闻）</p>\n  <p><strong>欧洲央行宣布加息25个基点</strong></p>\n  <p>当地时间6月11日，欧洲央行宣布将欧元区三大关键利率分别上调25个基点，欧元区存款机制利率、主要再融资利率和边际借贷利率分别为2.25%、2.40%和2.65%。本月初，欧盟统计局公布的初步数据显示，欧元区5月消费者价格指数(CPI)同比上涨3.2%，创下自2023年9月以来的最高水平。欧元区能源价格同比涨幅连续两个月超过10%。分析认为，在中东冲突引发能源价格上涨、导致欧元区通胀压力再度抬头的背景下，欧洲央行希望在成本冲击进一步扩散至整体经济之前，通过加息遏制通胀。（央视财经）</p>\n  <p><strong>安克创新CEO称充电宝大概率过几年就死了</strong></p>\n  <p>近日，安克创新创始人阳萌在一次访谈中表示，充电宝不但不会变成千亿级品类产品，甚至有可能过几年就会消失。阳萌以MP3、磁带机、CD机类比称电子产品从大家开始买它到不买它，中间的跨度也就10年。公开资料显示，安克创新成立于2011年，旗下拥有Anker、Soundcore、eufy等品牌，曾凭借充电宝等产品打开海外市场，被称为“充电宝一哥”。2025年，公司营收305.14亿元，同比增长23.49%。其中，充电储能类业务实现收入154.02亿元，占总营收约一半，传统充电宝已不再是其核心收入来源。（界面新闻）</p>\n  <p><strong>于东来称胖东来员工不值这么多钱，出去就完蛋</strong></p>\n  <p>6月10日，于东来在胖东来内部会上表示，公司30年来一直用超越员工期望的薪酬激发热情，但也容易产生“溺爱”。他说，员工其实不值那么多钱，高薪会导致认知偏差，让人真以为自己值这个价。在胖东来内会感到骄傲幸福，但一旦离开就会“完蛋”。他坦言，自己过于包容，反而害了家庭和企业。（界面新闻）</p>\n  <p><strong>A股市场又一次迎来“世界杯魔咒”的讨论窗口</strong></p>\n  <p>按照赛程，本届世界杯将于6月11日至7月19日在美国、加拿大、墨西哥三国举行，48支球队参赛、104场比赛、39天赛期，均创世界杯历史新高。由于多数赛事对应北京时间凌晨至上午时段，因此也被多家券商纳入赛事经济观察范围。但券商给出的共同判断并不激进：世界杯窗口确实存在一定交易热度下降和阶段性弱势特征，但所谓“世界杯魔咒”并不是稳定有效的择时规律。相比盯着指数涨跌，市场更应回到当下的资金环境、产业主线和中报验证窗口。换言之，世界杯可以带来情绪扰动和消费主题，但很难改变A股原本的运行逻辑。（财联社）</p>\n  <p><strong>SpaceX上市前夕，美股太空股提前狂欢</strong></p>\n  <p>6月11日，美股太空股夜盘集体上扬。DXYZ涨超8%，Rocket Lab（RKLB.US）、AST SpaceMobile（ASTS.US）、Redwire（RDW.US）、Intuitive Machines（LUNR.US）均涨超2%。消息面上，特斯拉（TSLA.US）CEO马斯克旗下SpaceX将在在当地时间6月12日登陆纳斯达克挂牌上市，SpaceX已吸引超过2500亿美元的投资需求，远超其计划筹集的750亿美元规模。此次IPO超额认购率已达到3.5至4倍，有望成为有史以来规模第一的IPO。（财闻）</p>\n  <p><strong>国家邮政局依法对极兔速递有限公司立案调查</strong></p>\n  <p>今年以来，使用“极免速递\"商标、字号、快递运单经营快递业务的企业多发生产安全事故，场所内多次被检查发现生产安全事故隐患。极免速递有限公司对极免速递相关企业安全生产管理缺位，未按规定实行安全保障统一管理，国家邮政局依法对极免速递有限公司进行立案调查。</p>\n  <p>对此，极兔回应记者称：极兔速递中国区高度重视，诚恳接受，坚决服从、全力配合主管部门依法依规开展的各项调查工作。（央视新闻、21世纪经济新闻）</p>\n  <p><strong>微信聊天可以“合并发图”了</strong></p>\n  <p>6月11日，据微信派消息，微信聊天可以“合并发图”了。现在发送3张及以上的图片、视频时能看到“发送后合并展示”。发出去的图片支持展开或收起，点一下即可切换形态，此外还可以一键保存“合并展示”的全部内容，或转发给其他朋友。（界面新闻）</p>\n  <p><strong>经销商回应路虎揽胜极光L价格暴跌至17万多：属实</strong></p>\n  <p>近日，有消息称，路虎揽胜极光L价格暴跌，目前部分终端市场成交价格下探至17.98万元甚至更低，与42.98万元起的官方指导价相比，跌幅接近六成。6月11日，界面新闻就揽胜极光L降价一事，致电北京捷豹路虎四惠门店，相关工作人员表示，“SE配置的裸车，全款18.5万元；综合优惠的话，裸车可以降至17万多”。北京中进捷旺汽车销售服务公司的工作人员也对界面新闻表示，裸车SE目前18.5万元，HSE配置是23万元，“到店的话，会有相应的活动，最终价格更有优势”。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，6月11日收盘，美股三大指数集体上涨，纳指涨2.54%，标普500指数涨1.75%，道指涨1.86%。大型科技股多数上涨，Arm涨超11%，英特尔涨超9%，特斯拉涨超4%，英伟达涨超2%，亚马逊、苹果涨超1%，谷歌小幅上涨；甲骨文跌超8%，微软跌超1%，奈飞、Meta小幅下跌。热门中概股涨跌不一，富途控股涨超2%，哔哩哔哩涨超1%，蔚来、理想汽车小幅上涨；小鹏集团跌超2%，阿里巴巴、京东、百度跌超1%。</p>\n  <h2>投融资</h2>\n  <p><strong>德国机器人公司Neura Robotics完成14亿美元融资，获亚马逊、英伟达等多方支持</strong></p>\n  <p>6月10日，德国机器人公司Neura Robotics宣布完成创纪录的C轮融资，本轮总规模最高可达14亿美元，旨在加速构建全球领先的物理人工智能平台。此轮融资获得了亚马逊、英伟达和欧洲投资银行等多方支持。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>追觅Eclix俞雷：即将推出一款没有APP的AI手机</strong></p>\n  <p>6月10日，界面新闻独家获悉，追觅生态品牌Eclix团队已与国内头部大模型厂商达成深度合作，预计将于2026年9月发布第一代AI手机，双十一前上市。该产品主打高端，定价5000元以上，目前核心团队研发已接近完成，即将进入整机测试阶段。Eclix手机团队由前金立集团副总裁俞雷组建，俞雷于2026年3月正式入职MOVA，任手机和AI硬件业务负责人。（界面新闻）</p>\n  <p><strong>智元推出灵犀X2 EDU(人人造)版本，面向科教实训等丰富场景</strong></p>\n  <p>36氪获悉，6月10日，智元推出灵犀X2 EDU(人人造)版本，面向科研教育、工程实训、机器人赛事开发等多元场景，聚焦设备拆装实训与软件二次开发。据介绍，灵犀X2 EDU(人人造)版本在硬件设计上强调可拆装、可扩展与可二次开发。</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-12T00:04:29+00:00", "fetched_at": "2026-06-12T03:32:01.482279+00:00", "fingerprint": "de0b1529f967068e"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前瓦锡兰老兵创业，为船舶装上中国“心脏”，半年超 5000万订单", "url": "https://36kr.com/p/3849520020231432?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，连云港力普司船舶科技有限公司（下称“力普司LiiPuS”）近期连续完成种子轮及天使轮融资，总额达数千万元。其中，种子轮由江苏金桥基金独家投资，天使轮由云时资本独家投资。本轮资金将主要用于高端船舶综合电力推进系统及产品的样机测试、持续改进及小批量交付，加速国产高端推进系统在港口拖轮、海工船、豪华游艇等场景的规模化应用。</p>\n  <p>力普司2025年7月成立于连云港，聚焦大型船舶综合电力推进系统的研发、设计与生产，产品覆盖领先一代的L型永磁全回转推进器、永磁吊舱推进器、破冰型全回转推进器等全矩阵系列，全系列产品采用标准化、模块化的设计和制造理念，具有尺寸小、重量轻、功率密度大、可靠性高等优点。</p>\n  <p>公司创始人李祥彪曾先后任职于苏船、南高精、瓦锡兰及斯凯孚，推进器经验近20年，熟悉国内外同类产品的技术路线、制造工艺、质量水平等，深知国内用户痛点，中国产品与欧洲产品仍有不小的质量差距，力普司有望解决行业痛点，缩小与国际品牌之间的差距。</p>\n  <p>硬氪了解到，永磁推进器因结构紧凑、效率高、操控灵活，被视为当前最高效的船舶推进方案。但在大功率、高质量要求的细分市场，瓦锡兰、康世伯、肖特尔等国际品牌长期占据垄断地位，国产替代空间巨大。</p>\n  <p>此外，随着中国向造船强国转变，核心装备国产化率逐渐提高，同时，减碳与电动化趋势推动港口拖轮、海工船、内河船等场景加速淘汰旧船、新造高效环保船舶，永磁推进器作为电动化动力系统的关键部件，需求明确且持续走强。</p>\n  <p>目前，公司已完成0.5-5MW L型永磁全回转推进器、0.2-2MW永磁吊舱推进器、2-10MW破冰型全回转推进器等产品的系列化开发，并在江苏连云港、南通和广东江门布局批量生产交付基地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260612/v2_09f8dfd5591b4aaabfbe35a980c43a41@6221844_oswg196747oswg794oswg381_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">力普司相关产品（图源/企业）</p>\n  <p>成立半年时，力普司累计在手订单已超过5000万元，重点覆盖港口拖轮、海工船及豪华游艇三大领域。公司预计今年实现1亿元的小目标，未来每年保持2-3倍增长。</p>\n  <p>李祥彪告诉硬氪，未来公司产品还将推进智能化方向，为船舶提供AI辅助驾驶控制软件与算法，实现船舶智能航行与智能控制。预计智能化相关功能将在今年完成研发测试，明年开始推广使用。</p>\n  <p><strong>以下为硬氪与李祥彪的对话节选：</strong></p>\n  <p><strong>硬氪：推进器领域国际巨头垄断已久，力普司的差异化优势具体体现在哪些方面？</strong></p>\n  <p><strong>李祥彪：</strong>我们研发生产的产品是领先国内一代的产品，质量和可靠性与欧洲品牌相当。L型永磁全回转推进器和永磁吊舱推进器均采用了电机和推进器融合设计的理念，电机扭矩曲线和螺旋桨扭矩曲线采用耦合计算，提高了机桨匹配性和推进效率。</p>\n  <p><strong>硬氪：民企会面临国企或研究所带来的较大竞争压力吗？</strong></p>\n  <p><strong>李祥彪：</strong>目前没有直接竞争关系，我们的产品定位、设计理念、制造工艺都有所不同，船厂方面，他们主要负责船舶建造，核心设备如推进器、电机、电控系统很多由民营企业提供。我们的客户主要是港口拖轮、海工船、豪华游艇领域，这些领域对产品质量和性能要求极高，目前仍严重依赖进口，市场需求非常强烈。</p>\n  <p><strong>硬氪：目前公司面临较大的挑战是什么？</strong></p>\n  <p><strong>李祥彪：</strong>我们目前最大挑战还不是接多少订单，而是满足高端装备精密制造的产能准备。我们成立不到一年，产能布局还没完全铺开，还不能大规模接单——接多了不能按时、按高质量标准交付会很麻烦。今年下半年的重点是产业规划布局和船级社资质认证。我们规划了连云港、南通、江门三个制造基地，27年产能交付能力会从现在的20-30台提升到150台左右。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>云时资本：</strong>力普司由来自国际超一流厂商的成建制团队构成，创始人具备极为领先的创新观念和工程实践能力，在船舶大功率推进器领域有着丰富的经验。全球船舶电动化和智能化趋势显著，中国作为造船大国在其中引领，海洋产业也是十五五规划重中之重。非常看好力普司未来的发展潜力，期待公司成为下一代船舶软硬件系统的重要支柱。</p>\n  <p><strong>江苏金桥基金：</strong>力普司拥有一支真正懂产品、懂市场、懂制造的成建制团队，创始人李祥彪近20年的国际头部企业实战经验，使得公司在高端船舶推进系统领域具备了与欧洲品牌直接对标的能力。其产品在功率密度、效率、可靠性上达到国际一流水平，同时凭借显著的成本和交付周期优势，精准切中港口拖轮、海工船、豪华游艇等场景的国产替代痛点。</p>\n  <p>全球船舶电动化、智能化浪潮叠加海洋产业被纳入“十五五”规划重点方向，力普司有望成为下一代船舶综合电力推进系统的核心支柱。我们坚定看好公司的长期成长性。</p>", "category": "tech", "published_at": "2026-06-12T01:34:28+00:00", "fetched_at": "2026-06-12T03:32:01.482264+00:00", "fingerprint": "12ca07f7eb8b557e"}, {"source": "少数派", "title": "苹果新增的「围绝经期」提醒，你该比 watchOS 27 多了解一点", "url": "https://sspai.com/post/75419", "summary": "当它突然出现在生命里时，你就知道了该如何面对；当它出现在身边人身上，你也知道该如何帮助她们步入这个全新的人生阶段。<a href=\"https://sspai.com/post/75419\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-11T03:41:47+00:00", "fetched_at": "2026-06-12T03:31:59.004193+00:00", "fingerprint": "135ded71693b3aa3"}, {"source": "少数派", "title": "5月音乐推荐：不可错过的9张惊喜专辑", "url": "https://sspai.com/post/110670", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/110670\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-11T06:58:32+00:00", "fetched_at": "2026-06-12T03:31:59.004187+00:00  href=\"https://36kr.com/newsflashes/3846974434674952\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>韩IT巨头Kakao工会史上首次启动局部罢工</strong></a></p>\n  <p>据报道，韩国IT巨头Kakao工会于6月10日启动公司史上的首次局部罢工。参加罢工的包括Kakao总部和Kakao Pay、Kakao Enterprise、Dk Techin、XLGAMES四家子公司。工会方面表示，有1500余名员工参与罢工，其中总部员工约1000余人。据了解，Kakao劳资双方围绕绩效奖金发放标准现分歧。劳方要求资方将营业利润的13～14%用作绩效奖金发放，不将限制性股票单位（RSU）算进绩效奖金。资方则主张劳方相关诉求对公司经营造成负担。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846963366808066\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>字节AI制药开启拆分融资，AI4S进入产业化阶段</strong></a></p>\n  <p>36氪独家获悉，字节跳动AI制药业务线已启动拆分与独立融资进程。据了解，拆分后字节仍将控股新公司，AI制药核心团队、核心算法、技术平台和已有管线资产将整体进入新主体。同时，该业务也将继续从火山引擎获得算力支持。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846949987125766\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星考虑新建先进芯片封装厂，以满足全球芯片需求</strong></a></p>\n  <p>三星电子考虑在韩国光州建设先进半导体封装工厂，以满足全球芯片需求。三星正扩大HBM市场布局，以加强其在AI芯片供应链中的地位。预计三星将在6月29日韩国总统与企业集团负责人会议上公布投资计划。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846876921989637\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>马斯克旗下企业SpaceX及xAI被告扰民，1万多人提起集体诉讼</strong></a></p>\n  <p>美国密西西比州居民日前向法院起诉美国企业家埃隆·马斯克旗下的太空探索技术公司（SpaceX）及其新合并的xAI公司，原因是被告运营的一座为数据中心供电的发电厂持续发出噪音，让居民不堪其扰。6月9日对外公布的法庭文件显示，3名密西西比州居民代表1万多人向该州一家联邦法院提起集体诉讼，指控这两家公司未能采取措施遏制发电厂持续发出过大噪音，不仅给居民造成精神伤害，而且造成房产贬值等损失，要求企业作出赔偿。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846829988464897\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>世界杯奖杯价值较上届世界杯飙升157%</strong></a></p>\n  <p>根据伦敦证券交易所集团（LSEG）的分析，本届世界杯的纯金奖杯按今日金价计算价值约71.3万美元。自2022年以来，该世界杯奖杯的价值飙升了157%。按熔化价值计算，国际足联的世界杯奖杯位居世界体育奖杯榜首，远远超过欧洲冠军联赛、欧罗巴联赛和超级碗奖杯。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3846848313543176\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</strong></a></p>\n  <p>何小鹏发出内部信，宣告自己将亲自下场直管机器人业务。何小鹏在内部信中称，小鹏人形机器人现在所处的阶段尤为关键，相当于8年前小鹏汽车即将完成第一款车G3发布的阶段，正站在量产交付的门槛上。按照何小鹏的规划：2026年第四季度，小鹏将实现人形机器人量产；2027年一季度，小鹏将人形机器人带入线下门店进行导购工作；2027年二季度，人形机器人将被推向海外市场；2028年，机器人将开始走向更多的家庭。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847027456870661\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>千问发布高考志愿填报Agent，免费提供志愿咨询</strong></a></p>\n  <p>36氪获悉，6月10日，千问上线高考志愿填报Agent，具备“志愿报告”、“志愿日历”、“志愿问答”三项核心能力，为考生免费提供志愿咨询服务。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847059940821511\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士最早将于8月在美国上市</strong></a></p>\n  <p>据透露，SK海力士计划最早于8月在美国上市，这家韩国存储芯片巨头希望借此抓住人工智能相关股票的强劲需求，并扩大其投资者基础。其中一位消息人士称，美国证券交易委员会（SEC）很可能在6月22日当周批准SK海力士的美国存托凭证（ADR）上市申请。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3846796951603459\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>阿里合伙人委员会内网发帖：钉钉管理“不是阿里文化该有的样子”</strong></a></p>\n  <p>36氪获悉，6月10日，阿里巴巴合伙人委员会在公司内网发布帖文《有情有义有成长，才是阿里文化》，对近日钉钉前产品经理离职长文《置身钉内》引发的讨论表达了清晰的态度。帖文以严厉的措辞批评了钉钉团队的管理方式，直接指出这\"不是阿里文化该有的样子\"。 此前，钉钉的管理风格曾多次引发外部讨论。合伙人组织进行了认真讨论并形成一致判断，强调\"无论什么情况下，无论任务多么紧迫\"都不应该出现这种管理，“这不是阿里文化倡导的方向”。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3847017232927240\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>我国已建成五基空天地一体生态监测网络</strong></a></p>\n  <p>过去对河流环境污染的监控只能依靠人工巡查、定点监测，往往只能进行局部排查、问题的发现相对滞后。随着生态遥感科技的飞速升级，一套空天地一体化的智慧监测体系正在全面落地。五基一体化监测体系包括天基卫星、空基遥感、航空无人机、移动监测（巡护）车和地面观测设备。近期生态环境部启动空天地一体化的卫星研判系统，给水环境污染和生物多样性监测装上智慧的大脑。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3847001841846536\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>工信部：到2028年城域算力1毫秒时延圈覆盖率不低于75%</strong></a></p>\n  <p>36氪获悉，工信部印发《“人工智能+信息通信”创新发展实施意见（2026—2028年）》。实施意见提出，到2028年，人工智能与信息通信初步构建融合互促的创新发展格局。信息通信智能运营和服务能力达到国际先进水平，信息通信网络初步实现高等级自智，形成30个以上高价值典型场景，打造一批典型应用和特色智能体。网络、算力等信息基础设施支撑人工智能能力进一步提升，城域算力1毫秒时延圈覆盖率不低于75%。</p>", "category": "tech", "published_at": "2026-06-10T08:32:14+00:00", "fetched_at": "2026-06-11T03:32:04.896460+00:00", "fingerprint": "263710e0f5c8cfd9"}, {"source": "36氪 - 最新文章", "title": "雅典表发布2026新品系列，180周年之际加码机械创新与艺术合作｜最前线", "url": "https://36kr.com/p/3847339087140104?f=rss", "summary": "<p>2026年6月，上海敬华艺术空间被布置成一间“奇想实验室”。瑞士高级制表品牌Ulysse Nardin雅典表在此举办“奇想无界，创造无境”2026新品品鉴会，将全新[Super] Freak奇想超级腕表、与中国当代艺术家刘人岛合作的鎏金系列《名扬四海》联名腕表，以及多枚代表性时计一并陈列。</p>\n  <p>对这家1846年诞生于瑞士勒洛克的独立制表商而言，这是一个被精心挑选的时间点——品牌创立180周年，恰逢其标志性的FREAK奇想系列问世25周年。</p>\n  <p>在全球奢侈品消费整体承压、中国高端钟表市场进入结构性调整的当下，一个拥有180年历史的瑞士品牌，为何把重要的周年节点放在上海，又为何选择与一位以国画见长的中国艺术家联名？答案藏在产品结构与叙事策略的双线之中。</p>\n  <p>从商业结构看，这场品鉴会呈现的是一组“金字塔”式的产品组合。塔尖是作为周年献礼的[Super] Freak奇想超级腕表。据品牌介绍，新作历时四年研制，是世界上首款融合双陀飞轮与卡罗素结构的自动上链腕表，搭载自制UN-252机芯，由511个零件构成，融合8项专利技术，限量发行50枚，被雅典表称为“品牌制表史上最复杂的‘纯时间’腕表”。</p>\n  <p>据品牌披露，这枚腕表逾七成零部件经手工装饰打磨，约97.46%的机芯零件处于运动状态，并由同一位制表大师耗时60小时完成组装。塔身则是更具文化指向的《名扬四海》联名系列——《知音》《妙音》《玄曲》《悠雅》四款，均采用40毫米5N玫瑰金表壳与自制UN-320机芯，配备硅质游丝与擒纵机构，每款限量25枚，全系列共100枚。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_9f11b563a8184821812391bc5523840a@5922386_oswg83206oswg1350oswg900_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：品牌</p>\n  <p>高复杂度的“光环产品”负责确立技术与价格的天花板，文化联名负责打开本土市场的情感入口，这是高端制表品牌常见的组合打法。而联名的另一半——艺术家刘人岛，提供了这套叙事的东方落点。</p>\n  <p>刘人岛的履历横跨多个标签：把国画送上太空、在故宫办展、横跨“六艺”。但海洋对他而言原本是陌生题材。“我的老家在湖南新宁，属于‘八山半水’的内陆地区，”他回忆，真正看到海，是上大学后第一次外出写生时——一位女同学落水，他下水相救，连呛了几口海水。“当时海给我的感觉就是特别壮阔，无边无际���以及苍茫。”正是这种印象，催生了他后来《观沧海》等海洋题材的创作。</p>\n  <p>与雅典表的相遇带着偶然。据刘人岛讲述，2024年他在苏州举办个人画展，雅典表中国区负责人前来参观，对其山水与海洋作品产生兴趣，双方由此展开对话。更早的渊源则来自一段口述历史——他的朋友、瞿秋白的侄子曾向他提起，瞿秋白早年将收藏的雅典表典当，用以支持革命。</p>\n  <p>让双方“一拍即合”的，是一种关于“运动”的共识。“时间是一种流动，海洋也是在运动，雅典表的机芯也是一种运动中的状态，”刘人岛告诉36氪。雅典表以航海天文台钟起家，海洋是其品牌历史的精神源流；而在他的笔下，海则是东方语境里流动、包容、生生不息的意象。</p>\n  <p>被问及在这次合作中最希望被如何定义——“海洋画家”“太空艺术家”抑或其他，刘人岛给出的答案是“全能的画家”。</p>\n  <p>“艺术是相通的，”他说，画山水时碰到人就得画人，花鸟、山河、海洋、气候都要能驾驭，“画山水有大的气势，画海洋也要一种气势”。在他看来，全能意味着对整幅画的宏观把控，否则“画什么也只是一个局部”。这种“通”的自我定位，某种程度上与雅典表跨越机械结构、材料与时间显示方式的“破界”叙事形成了呼应。</p>\n  <p>联名系列的命名同样被刻意经营。英文“Make Waves”意为“造浪”，中文译作“名扬四海”。刘人岛称命名先于创作：“很多事情讲究的其实是一种‘缘’，它既是缘分，也是‘圆满’。”在他看来，地球上的各大洋本就圆融一体，四幅画作要表现的正是这种“圆”，其中既有海洋，也包含对四季轮回与人生的思考。四款表名亦取东西兼容之意：知音既指中国语境里的知己，也暗合钟表运转的声音；玄曲取“科学的最高境界是玄学”之意；悠雅之“雅”呼应“雅典”。</p>\n  <p>一个绕不开的技术与美学难题，是中国画的“留白”如何落到以精确为天职的表盘上。“海洋最难画的不是海的整体，而是浪，”刘人岛解释，浪花在阳光透射下晶莹剔透，若直接以白色涂抹，画面会“显得很板，没有灵动性”。他将海浪的生命力比作人的不同年龄阶段——幼年活蹦乱跳、中年奔放、晚年平静，“海最经典的状态，应该像我们人生一样，只有在生命力最奔放的时候，才是最美的时候”。据品牌介绍，雅典表的微绘大师将其原创水墨凝练于表盘，在毫米之间保留海浪的层次、光影与气韵。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_4a37cb7fd9644073aa4c2df12018ca60@5922386_oswg94902oswg1350oswg900_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：品牌</p>\n  <p>那么，这套用料不菲、产量极小的联名系列，瞄准的是谁？刘人岛的回答没有停留在“藏家”或“新中产”的标签上。“谁碰到它，能够把它当成自己的知己，那就是它的受众，”他说。在他的描述里，这四块表是表的理性机械与中国绘画感性之间的碰撞，最终指向“那些愿意去思考‘时间的形状究竟是什么’的人”——当指针扫过腕间浪涛，“感受到时间不是冰冷的刻度，而是奔涌不息的浪、是停在方寸的蓝”。</p>\n  <p>对雅典表而言，这种“东方知音”的叙事，是其更大版图中的一块。据品牌资料，自1846年起，Nardin家族历经五代，打造出广受多国海军信赖的航海时计，迄今累计获得超过4300项技术与设计大奖；2001年问世的FREAK奇想腕表以“无表冠、无指针、无表盘”重新定义机械腕表，其FREAK [ONE]曾摘得2023年日内瓦钟表大赏（GPHG）“最佳标志性腕表”奖项；品牌还与芝柏表联合创立独立制表体系，并在日内瓦、硅谷、迪拜与上海设有旗舰店。</p>\n  <p>从财经视角审视，这套组合折射出独立高端制表近年的一种共同选择：<strong>以极致复杂度与超低产量制造稀缺性，再借文化联名降低进入新兴市场的叙事门槛。</strong>100枚联名腕表与50枚超级腕表的发行量，决定了它们更接近“叙事载体”而非走量产品；其商业回报，既来自单品的高溢价，也来自周年节点上品牌资产的再确认。雅典表在品鉴会上未披露相关定价与销售目标，实际市场反响仍有待观察。</p>\n  <p>180年的航海传承与25年的“破界”叙事，如今在上海与一位中国艺术家的水墨相遇。这场相遇能否转化为持久的市场认同，仍需时间检验；但至少在方寸表盘之上，雅典表完成了一次东西方语汇的拼合。正如刘人岛所言，他要画的从来不只是海洋本身，“更关乎内观、流动与生命的节律”。</p>", "category": "tech", "published_at": "2026-06-10T13:35:14+00:00", "fetched_at": "2026-06-11T03:32:04.896454+00:00", "fingerprint": "e6de4b97bb55b558"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨世界杯门票遇冷，近18万张门票待转售；台积电释放涨价信号；但斌回应“被段永平拉黑”", "url": "https://36kr.com/p/3848000003953926?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>花旗警告：金价或跌至3500美元</li>\n   <li>韩国股市再度熔断</li>\n   <li>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</li>\n   <li>伊朗宣布对所有船只关闭霍尔木兹海峡</li>\n   <li>SpaceX认购资金超2500亿美元</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>2026世界杯门票遇冷，近18万张门票待转售</strong></p>\n  <p>北京时间6月12日，2026年美加墨世界杯将举行揭幕战。目前，国际足联（FIFA）官方转售平台上挂牌出售的门票达17.6万张，主要集中在小组赛阶段。根据FIFA平台数据所做的价格与库存统计，不同球队之间的人气差异十分明显。例如，在伊朗队参加的3场小组赛中，仍有约1.6万张门票尚未售出，市场上最便宜的普通座位售价为138美元（约合934元人民币）。过去一个月，官方转售平台上的门票中位价已累计下跌20%。媒体测算显示，考虑到平台对转售交易收取26%的手续费，大多数转售卖家如今可能已处于亏损状态。对FIFA而言，若比赛出现大量空座将十分尴尬。先前，该机构将本届世界杯门票价格定得远高于往届，并表示此举符合当地市场环境。（财联社）</p>\n  <p><strong>台积电释放涨价信号</strong></p>\n  <p>台积电首席财务官（CFO）黄仁昭近日在接受媒体采访时表示，通货膨胀正在推高该公司的运营成本，并表示不排除对芯片提价的可能性。台积电生产由英伟达、AMD和苹果等公司设计的最先进芯片，因此任何价格涨价举措都可能波及人工智能基础设施的成本，并可能随着时间的推移，影响客户购买电子设备时的支付价格。虽然黄仁昭并未明确一定会提价，但他表示，“通胀确实导致了（我们的）成本上升。”不过，黄仁昭同时也表示，台积电不会突然涨价“四、五倍”。（财联社、科创板日报）</p>\n  <p><strong>但斌回应“被段永平拉黑”：一直非常尊重段总，他是否拉黑我不知道</strong></p>\n  <p>6月10日消息，日前，一篇题为《段永平和但斌的怨由》的网络文章在投资圈流传，文中详细叙述了知名投资人段永平与但斌之间多年来的“互动往事”，包括所谓“段永平早年点评但斌发基金”“段永平拉黑但斌”等情节。6月10日下午，但斌本人通过社交媒体正式回应，明确否认了文中若干关键说法。对于文中“段永平拉黑但斌”的描述，但斌回应称：“对段永平一直非常尊重。他是否拉黑我，我不知道，我理解应该是取消关注。为何取消关注，段总有他自己的看法，我觉得也没问题，个人性格决定，就像我从不拉黑任何人一样。对投资的判断，有分歧也正常，没什么大不了的。”并希望作者不要凭空捏造事实。据了解，但斌是东方港湾创始人、国内知名价值派私募大佬，因长期重仓茅台成名，著有投资经典《时间的玫瑰》，常被称作 “中国巴菲特”。（红星新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阿里云：下调容器计算服务ACS Agent Sandbox价格</strong></p>\n  <p>36氪获悉，阿里云发布容器计算服务ACS Agent Sandbox（default算力质量）降价通告，将于北京时间2026年6月15日12点起对该算力进行价格下调。本次降价调整仅涉及ACS Agent Sandbox（default算力质量），其他算力如ACS通用型（default、best-effort算力质量）、ACS性能型（default、best-effort算力质量）价格不变。</p>\n  <p><strong>Meta与安巴尼旗下的信实集团合作，在印度建设人工智能数据中心</strong></p>\n  <p>Facebook母公司Meta周三表示，已与印度亿万富翁穆克什·安巴尼旗下的信实工业集团达成合作，将在印度共建一座人工智能数据中心。声明称，信实工业将在古吉拉特邦贾姆纳加尔建设一座容量为168兆瓦的数据中心，Meta将租用该中心，并保留扩容选项。（新浪财经）</p>\n  <p><strong>SpaceX计划于2027年启动太空AI基础设施演示</strong></p>\n  <p>媒体援引两名出席投资者推介会的不具名人士报道称，SpaceX高管表示该公司正计划在2027年底前启动基于太空的人工智能（AI）基础设施的初步演示。在这两场投资者推介会上，SpaceX概述了计划于2027年开始展示轨道计算能力的路线图，总裁Gwynne Shotwell和首席财务官Bret Johnsen均有出席。SpaceX未立即回复置评请求。（新浪财经）</p>\n  <p><strong>博通联合阿波罗与黑石设立AI XPV平台，首期350亿美元支持Anthropic算力扩张</strong></p>\n  <p>博通6月9日宣布与阿波罗及黑石信贷与保险业务共同设立AI XPV平台，三方作为初始锚定投资方，目标是通过博通定制XPU及网络解决方案，在2028年前为Anthropic、OpenAI等前沿AI实验室部署逾20吉瓦算力。平台首期由阿波罗牵头、黑石联合注资350亿美元，用于支持Anthropic此前宣布的逾1吉瓦算力基础设施扩容计划，相关部署预计于2026年中起在Fluidstack站点落地。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>字节AI制药开启拆分融资，AI4S进入产业化阶段</strong></p>\n  <p>36氪独家获悉，字节跳动AI制药业务线已启动拆分与独立融资进程。据了解，拆分后字节仍将控股新公司，AI制药核心团队、核心算法、技术平台和已有管线资产将整体进入新主体。同时，该业务也将继续从火山引擎获得算力支持。新公司将由字节跳动AI制药团队主导负责。</p>\n  <p>据悉，字节AI制药团队成立于2021年，由刘凯负责，核心成员约50人，由AI4S算法人才和资深制药领域专家构成，该团队自成立起便承担着从基础模型研究到产业化的核心职能。</p>\n  <p>知情人士透露，此次进行业务拆分，是为了建立更符合该业务特征的独立</p>\n  <p>组织架构。</p>\n  <p><strong>香港超越瑞士，成为全球最大的跨境财富管理中心</strong></p>\n  <p>波士顿咨询公司（BCG）最新发布的《2026全球财富报告》显示，2025年，香港跨境财富记账规模上升10.7%至2.9万亿美元，首次超过瑞士，成为全球最大的跨境财富管理中心。BCG还预计，这一趋势将延续——到2030年，香港的跨境财富管理规模将以每年9%的速度增长，达到4.6万亿美元，持续领先全球。数据更显示，短短数年间，瑞士跨境财富管理资产规模从2020年的2.4万亿美元近乎腰斩至2025年的1.3万亿美元。（21世纪经济报道）</p>\n  <p><strong>微博回应追觅科技CEO俞浩被禁言</strong></p>\n  <p>微博平台官方账号“围脖侠”发文表示，经核实，账号@俞浩-爱送黄金 被某企业投诉，其作为网络名人账号以“喊话”等形式发布质疑、拉踩企业的违规内容，因违反中央网信办“清朗·优化营商网络环境 整治恶意炒作涉企信息”专项行动要求，在多个平台被责令予以禁言处置。请广大网友知悉原因、加强辨识，切勿轻信和传播不实信息。（界面新闻）</p>\n  <p><strong>亚马逊英伟达下场抢光纤，存储之后光纤成最紧缺AI硬通货</strong></p>\n  <p>据第一财经报道，继Meta、英伟达之后，亚马逊再度出手锁定光纤核心供应，全球AI算力军备竞赛正从算力层向底层物理传输介质全面蔓延。6月8日晚，亚马逊宣布与康宁签下数十亿美元长期光纤采购协议，用于连接美国快速扩张的数据中心。海外巨头的接连锁单动作点燃了A股资金热度，6月9日，光纤板块掀起涨停潮，太辰光、长芯博创分别大涨18.07%、12.13%，长飞光纤、亨通光电、中天科技等股涨停。继存储之后，AI浪潮掀起了一个又一个电子细分赛道的热潮，如今，被视为AI算力“血管”的光纤，正在迎来一轮历史性周期。（第一财经）</p>\n  <p><strong>今年前5月居民境外收入补税约130亿元</strong></p>\n  <p>6月10日，国家税务总局公开信息显示，税务机关持续加强高收入人员纳税引导规范，对个人所得税增长带来一定增收效应。比如，不断加强对居民个人境外所得的宣传引导和政策辅导，取得境外收入的纳税人遵从度明显提高，1—5月份累计补缴税款约130亿元；再如，持续强化文娱和网络主播领域的税收监管，通过大数据及时发现并纠正从业人员涉税问题，进一步提升了纳税人合规意识和纳税遵从。截至5月底，超过1.6亿人完成汇算申报，超过1.1亿人办理了退税。（第一财经、界面新闻）</p>\n  <p><strong>韩国股市再度熔断</strong></p>\n  <p>6月10日午后，韩国综合指数突然跳水，跌幅持续扩大，截至发稿，该指数跌超6%。韩国交易所启动熔断机制，暂停KOSPI程序化交易。此外，日经225指数跌超2%。热门个股方面，SK海力士跌超9%，三星电子跌超7%。（证券时报）</p>\n  <p><strong>花旗警告：金价或跌至3500美元</strong></p>\n  <p>黄金的下跌速度超过了市场的预期。6月10日早间，现货黄金击穿4200美元关口，最低跌至4172.64美元/盎司，创3月23日以来新低。截至15:20，现货黄金日内下跌1.4%报4199.57美元/盎司，今年的涨幅悉数抹平，目前累计跌超2%。国内金饰价格也在跳水。6月10日，国内首饰金已经跌破1300元/克，较1月29日的阶段高点1713元/克，跌幅超过400元/克。（21世纪经济报道）</p>\n  <p><strong>亚瑟士计划分拆旗下鬼冢虎业务</strong></p>\n  <p>日本运动用品制造商亚瑟士6月10日宣布，将旗下品牌鬼塚虎转移至亚瑟士全资子公司OT GROUP，生效日期暂定为2027年1月1日。同时，亚瑟士决定将各区域运营公司的鬼塚虎业务剥离，并重组为OT GROUP的子公司。（界面新闻）</p>\n  <p><strong>香港宣布全体公务员加薪2%&nbsp;</strong></p>\n  <p>6月9日，香港特区政府公务员事务局局长杨何蓓茵在记者会上表示，香港特区行政长官李家超会同行政会议在当天会议上讨论了公务员的薪酬调整，决定向公务员职方提出2026年至2027年度香港全体公务员的薪酬划一向上调2%，生效日期追溯至2026年4月1日。（南方日报报道）</p>\n  <p><strong>马斯克旗下企业SpaceX及xAI被告扰民，1万多人提起集体诉讼</strong></p>\n  <p>美国密西西比州居民日前向法院起诉美国企业家埃隆·马斯克旗下的太空探索技术公司（SpaceX）及其新合并的xAI公司，原因是被告运营的一座为数据中心供电的发电厂持续发出噪音，让居民不堪其扰。6月9日对外公布的法庭文件显示，3名密西西比州居民代表1万多人向该州一家联邦法院提起集体诉讼，指控这两家公司未能采取措施遏制发电厂持续发出过大噪音，不仅给居民造成精神伤害，而且造成房产贬值等损失，要求企业作出赔偿。（新华社）</p>\n  <p><strong>何小鹏发内部信：本人亲自带队，最后200天冲刺机器人量产</strong></p>\n  <p>何小鹏发出内部信，宣告自己将亲自下场直管机器人业务。何小鹏在内部信中称，小鹏人形机器人现在所处的阶段尤为关键，相当于8年前小鹏汽车即将完成第一款车G3发布的阶段，正站在量产交付的门槛上。按照何小鹏的规划：2026年第四季度，小鹏将实现人形机器人量产；2027年一季度，小鹏将人形机器人带入线下门店进行导购工作；2027年二季度，人形机器人将被推向海外市场；2028年，机器人将开始走向更多的家庭。（第一财经）</p>\n  <p><strong>伊朗宣布对所有船只关闭霍尔木兹海峡</strong></p>\n  <p>当地时间6月11日凌晨，伊朗武装部队哈塔姆·安比亚中央司令部发表声明称，鉴于本地区安全局势动荡，霍尔木兹海峡即日起对包括油轮和商船在内的所有类型船只关闭，任何试图通过该海峡的船只都将受到攻击。（央视新闻）</p>\n  <p><strong>星巴克据悉考虑日本业务相关选项，包括出售股权和IPO</strong></p>\n  <p>据多位知情人士透露，星巴克正在考虑日本业务的相���选项，其中包括出售股权。此前，该公司已出售中国业务的多数股权。知情人士称，这家美国咖啡连锁巨头已与投资银行进行了初步磋商，以帮助确定日本业务的处理方式。知情人士因相关讨论未公开而不愿具名。日本是星巴克最大的市场之一，约有2,100家门店，其中大多数由星巴克直接运营。部分知情人士称，出售股权的估值可能在4000亿日元至5000亿日元，并可能吸引其他行业参与者和私募股权公司的兴趣。他们说，将日本业务IPO也是一个选项。知情人士补充称，相关考虑仍处于初步阶段，尚未作出最终决定。（新浪财经）</p>\n  <p><strong>韩IT巨头Kakao工会史上首次启动局部罢工</strong></p>\n  <p>据报道，韩国IT巨头Kakao工会于6月10日启动公司史上的首次局部罢工。参加罢工的包括Kakao总部和Kakao Pay、Kakao Enterprise、Dk Techin、XLGAMES四家子公司。工会方面表示，有1500余名员工参与罢工，其中总部员工约1000余人。据了解，Kakao劳资双方围绕绩效奖金发放标准现分歧。劳方要求资方将营业利润的13～14%用作绩效奖金发放，不将限制性股票单位（RSU）算进绩效奖金。资方则主张劳方相关诉求对公司经营造成负担。（界面新闻）</p>\n  <p><strong>微信上线朋友圈搜索功能</strong></p>\n  <p>腾讯微信官方账号“微信派”发文，正式官宣朋友圈搜索功能。点击“我-朋友圈”，右上角搜索入口，输入关键词，就能精准搜到曾经发过朋友圈。（界面新闻）</p>\n  <p><strong>三星考虑新建先进芯片封装厂，以满足全球芯片需求</strong></p>\n  <p>三星电子考虑在韩国光州建设先进半导体封装工厂，以满足全球芯片需求。三星正扩大HBM市场布局，以加强其在AI芯片供应链中的地位。预计三星将在6月29日韩国总统与企业集团负责人会议上公布投资计划。（财联社）</p>\n  <p><strong>美国5月CPI同比涨幅“破4”，美联储年内加息概率上升</strong></p>\n  <p>美国劳工部10日发布的数据显示，受能源价格上涨推动，美国5月消费者价格指数（CPI）同比上涨4.2%，创2023年5月以来新高。剔除食品和能源价格后，美国5月核心CPI同比上涨2.9%。</p>\n  <p>分析人士认为，上周五远高出预期的非农数据已令市场降息预期消退，芝商所“美联储观察工具”显示，美联储年内加息25个基点的预期概率已升至约43%，并且不排除年内累计加息50个基点的可能。（央视财经）</p>\n  <p><strong>香港证监会：香港持牌公司可继续为存量内地客户提供服务，但不能在内地境内提供</strong></p>\n  <p>6月10日，香港证监会就5月22日通函进一步进行解读。通函中的常见问题（九）提到，香港持牌公司可继续为中国内地投资者（即以中国居民身份证及/或中国护照作为身份证明文件的投资者）开立新账户，但必须符合所有开立账户规定。香港证监会对此表示，香港持牌公司可继续为现有的中国内地客户提供服务，前提是有关服务并非在中国内地境内提供，且其已遵守香港及适用司法管辖区的一切相关法律及监管规定。香港证监会还表示，其注意到中国内地当局于2026年5月22日联合发布的通知，其相关要求亦适用于其他司法管辖区（即不限于香港）的金融机构在向中国内地投资者提供服务时的相关活动。（界面新闻）</p>\n  <p><strong>世界杯开幕在即，啤酒股集体拉升</strong></p>\n  <p>世界杯开幕在即，A股市场啤酒股10日集体上涨。截至午盘，其中，惠泉啤酒涨停，珠江啤酒、燕京啤酒涨超5%，重庆啤酒涨超2%。中银证券表示，从板块基本面来看，2025年第二、三季度受现饮场景限制及需求端疲软影响，啤酒量价边际走弱，低基数下，叠加高温天气及世界杯赛事催化，2026年第二、三季度行业报表端收入增速有望得到修复改善。（第一财经）</p>\n  <p><strong>三星和海力士据悉或将宣布韩国投资计划</strong></p>\n  <p>据报道，三星电子和SK海力士正处于对韩国各地区投资计划进行最终审查的阶段，最早可能在本月发布公告。这两家芯片制造商可能在韩国西南部和中部扩大设施投资。相关投资或包括封装设施，亦有猜测可能会建设半导体晶圆厂。（财联社）</p>\n  <p><strong>张雪回应张雪机车是否有上市计划：顺其自然</strong></p>\n  <p>在中国摩托车产业高质量发展圆桌会议期间，张雪机车有限公司董事长张雪与媒体对话。被问及张雪机车有没有登陆资本市场的相关规划，张雪表示：“顺其自然”。（新浪财经）</p>\n  <p><strong>美股三大指数集体收跌，特斯拉跌超3%</strong></p>\n  <p>36氪获悉，6月10日收盘，美股三大指数集体下跌，道指跌1.87%，纳指跌1.98%，标普500指数跌1.62%。大型科技股跌多涨少，Arm跌超5%，英伟达、特斯拉跌超3%，亚马逊、Meta、亚马逊、谷歌跌超2%，微软跌超1%；苹果、奈飞小幅上涨。热门中概股涨跌不一，网易涨超3%，B站涨超2%，腾讯音乐涨超1%，微博小幅上涨；小鹏集团跌超4%，阿里巴巴跌超3%，理想汽车跌超2%，蔚来跌超1%，京东、爱奇艺跌近1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>SpaceX认购资金超2500亿美元</strong></p>\n  <p>美东时间6月9日，据消息人士透露，埃隆·马斯克的SpaceX已吸引超过2500亿美元的认购需求，远超该公司计划筹集的750亿美元，这将使其成为有史以来规模最大的IPO。消息人士称，此次SpcaceX融资的超额认购率已达计划发行规模的三到四倍。银行家和投资者认为,这一迹象表明投资者对SpaceX的需求强劲。6月11日下午，SpaceX预计将公布IPO定价，而投资者需求在那之前仍可能发生变化。</p>\n  <p><strong>SK海力士最早将于8月在美国上市</strong></p>\n  <p>据透露，SK海力士计划最早于8月在美国上市，这家韩国存储芯片巨头希望借此抓住人工智能相关股票的强劲需求，并扩大其投资者基础。其中一位消息人士称，美国证券交易委员会(SEC)很可能在6月22日当周批准SK海力士的美国存托凭证（ADR）上市申请。（新浪财经）</p>\n  <p><strong>新易盛：筹划发行H股并在香港联交所上市</strong></p>\n  <p>36氪获悉，新易盛公告，公司第五届董事会第十四次会议审议通过发行H股股票并在香港联交所主板上市的议案。此举旨在提高资本实力和综合竞争力，提升国际影响力。该事项尚需提交股东会审议，并需经证监会备案及香港联交所、香港证监会核准，存在不确定性。</p>\n  <h2>投融资</h2>\n  <p><strong>“巴泰医疗”完成近2亿元D轮融资</strong></p>\n  <p>36氪获悉，近日，“巴泰医疗”宣布完成近2亿元D轮融资，本轮融资由创东方投资领投，浙江省“4+1”生物医药与高端器械产业基金、倚锋资本、中益仁资本及个人产业投资人共同跟投，原有股东君行健资本持续加码，启峰资本提供融资支持。本轮融资将主要用于巴泰医疗的第三代约束型药物球囊商业化推广和临床证据积累、拓建新一代智能生产基地、后续血管介入创新产品研发等用途。</p>\n  <h2>酷产品</h2>\n  <p><strong>无线芯片，嵌入单晶金刚石后突破散热瓶颈&nbsp;</strong></p>\n  <p>美国麻省理工学院研究团队给氮化镓芯片嵌入一层超薄单晶金刚石，突破了高功率无线芯片散热瓶颈，并制备出性能创纪录的无线功率放大器，为6G通信、卫星互联网等高功率电子设备提供了新的芯片级热管理方案。相关成果在2026年IEEE国际微波研讨会上发布。硅是目前绝大多数芯片的基础材料，但其功率承载能力存在天然限制，难以满足未来高速无线通信对性能和能效的要求。相比之下，氮化镓具有更高的功率密度和工作频率，被视为6G通信、高功率雷达和卫星通信的重要候选材料。（科技日报）</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-10T23:48:20+00:00", "fetched_at": "2026-06-11T03:32:04.896446+00:00", "fingerprint": "fa9b0f043d9e20f4"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 创维独家投资数千万，这家企业将碳化硅切割损耗降至40微米内", "url": "https://36kr.com/p/3848094835217666?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，高端工业激光装备制造商——中微精仪科技（深圳）有限公司（下称“中微精仪”）近期已完成数千万元天使+轮融资，由创维投资独家投资。资金将主要用于市场拓展、产能提升及新产品开发。</p>\n  <p>中微精仪成立于2024年11月，专注于碳化硅晶锭激光剥离、金刚石激光剥离、水导激光精密加工等高端工业激光装备的研发与制造。公司创始人陈景煜为澳大利亚新南威尔士大学研究员，长期从事特种芯片集成开发；首席科学家孙洪波则为中国科学院院士、清华大学教授，是非线性激光超精密制造领域的先驱。</p>\n  <p>与市面上多数激光设备公司不同，中微精仪定位为激光精密加工技术平台，覆盖从机理研究、工艺开发到工程化落地的全链条。其设备已在碳化硅衬底切割、金刚石加工等领域进入头部客户量产验证阶段。</p>\n  <p>公司当前的核心业务聚焦两大方向：</p>\n  <p>一是碳化硅衬底激光分片设备。中微精仪自研的脉冲可编程与裂纹定向诱导生长技术，已能将分片损耗稳定控制在40微米以内，远低于行业常见的80-120微米水平。</p>\n  <p>当前，碳化硅行业正经历从6英寸向8英寸产线升级的关键窗口期。据陈景煜判断，近两年下游需求端正在快速扩张，数据中心电源对碳化硅器件的需求显著增加，消费电子领域如空调、冰箱等产品也开始采用碳化硅功率器件替代传统硅基器件。</p>\n  <p>然而，行业仍面临核心瓶颈。随着8英寸碳化硅成为行业降本主线，衬底切割环节的损耗率成为关键卡点。</p>\n  <p>据公司实测，其6英寸碳化硅分片速度为15-20分钟，8英寸为25-30分钟。中微精仪相当于每切割8片即可多产出1片，为客户带来显著的降本增效。</p>\n  <p>同时中微精仪的激光技术可以实现低损耗控制，在SiC晶圆背板减薄领域可以实现突破性应用，可以替代SiC晶圆背板减薄研磨抛光工艺，帮助SiC晶圆厂商实现降本增利，由以前研磨成粉末，变化为激光剥离，实现SiC剥离片二次利用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_7e868e926c124d119ee28af4cb97a1dd@6221844_oswg48325oswg667oswg500_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中微精仪团队手持由自主研发SiC激光剥离设备加工的6英寸、8英寸及12英寸SiC晶圆（图源/企业）</p>\n  <p>二是金刚石激光加工设备。针对单晶/多晶金刚石的剥离、切割与抛光，中微精仪实现了磨砂面白色加工效果，避免了友商常见的材料表面石墨化发黑问题，从而省去了后续研磨工序，可直接用于再生长。</p>\n  <p>此外，陈景煜透露，中微精仪将于今年七至八月份启动量子芯片加工器件的客户交付。这一业务延伸验证了中微精仪作为激光精密加工技术平台的可扩展性——从超硬材料切割延伸至量子计算核心元器件的加工。</p>\n  <p>公司目前已收到多家头部客户的进场邀约，预计6月起陆续进入更多产线进行Demo验证。</p>\n  <p>作为本轮独家投资方，创维投资已在碳化硅产业链上下游布局多家企业。中微精仪创始人陈景煜表示，创维投资所投企业覆盖了衬底、外延、器件等关键环节，能够有效帮助公司将设备与下游客户直接对接。</p>\n  <p><strong>以下是硬氪与陈景煜的访谈摘要：</strong></p>\n  <p><strong>硬氪：碳化硅行业目前竞争激烈，公司如何在这个节点找到机会？</strong></p>\n  <p><strong>陈景煜：</strong>6寸碳化硅现在卖一片亏一片，整个产业链环节能降本的地方全降了，唯独切割环节的损耗一直控不下来。从线切割的250微米降到激光切割的80微米已经是一大步，但我们把损耗降到40微米以内，仍然可以进一步控制在30微米以内，预示客户每切8片就最少能多出1片，这是他们现在最需要的竞争力。随着8寸线马上大规模上量，切割损耗会成为决定谁胜出的关键。</p>\n  <p><strong>硬氪：公司如何看待8英寸碳化硅时代的市场窗口？</strong></p>\n  <p><strong>陈景煜：</strong>今年下半年预计是8寸线建设的元年。头部客户的环评已经拿到了，基建陆续启动，设备选型正在发生。8寸片的核心目的就是降成本，如果切割环节损耗控不下来，8寸的优势就发挥不出来。所以这个窗口对我们来说是决定性的。</p>\n  <p>我们能稳定把损耗控制在40微米以内，而且设备进场当天就能跑量产，这些都非常重要。现在不是我们找客户，是客户在催我们进场。</p>\n  <p><strong>硬氪：从碳化硅到量子芯片，公司的技术边界在哪里？</strong></p>\n  <p><strong>陈景煜：</strong>我们不是一个做碳化硅切割设备的公司，而是一个激光精密加工的技术平台。团队核心能力是把不同激光与不同材料的相互作用机理研究透——切碳化硅、切金刚石、用量子芯片加工，底层都是同一套能力。公司实验室目前已经完成了12寸硅片的超薄切片验证，损耗可控制在1微米以内。平台搭好了，应用场景只是不同的输出。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>创维投资负责人表示：</strong>目前全球SiC衬底处于高速扩产和6寸向8寸迈进的产业周期，传统的切割方式难以满足产业升级的要求，2026年8寸线产业化正在加速发展。长期以来，上游环节的工业激光切割设备一直被国外企业垄断，高度存在被“卡脖子”风险。中微精仪现已推出相关产品，并且获得了重要客户的订单，这是源于团队掌握超快冷激光切割设备最核心的光路调控技术，从机理探索、工艺开发、光学优化、系统设计四个方面具备完全自主可控的能力，具有未来良好的发展前景。</p>", "category": "tech", "published_at": "2026-06-11T01:24:41+00:00", "fetched_at": "2026-06-11T03:32:04.896438+00:00", "fingerprint": "421941d9b570e56a"}, {"source": "36氪 - 最新文章", "title": "浪往南走：今年盛夏，WAVES来到番禺", "url": "https://36kr.com/p/3848188076381187?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_0e103d4a145e4eeeb2f68b9ef803d7c5@6381723_oswg553734oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_c3c73f00638e4a3bba6e4328cca430e2@6381723_oswg798oswg900oswg60_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>浪来了，你到不到？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_a76d589dae044586be857f0e035b15ac@6381723_oswg269oswg900oswg80_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>WAVES是36氪每年夏天最重要的一场会。</p>\n  <p>但它不仅仅是��个“会”。</p>\n  <p>从2023年北京金海湖碧波岛的草坪，到2024年郎园Station的市集，到2025年良渚五千年的夜空下——WAVES每年都在找一个地方，把36岁以下最值得关注的创业者和投资人放在同一个空间里。没有红毯，没有礼服，没有人念稿。白天是圆桌和碰撞，晚上是脱口秀、AI集市和珠江边的清风。</p>\n  <p>今年盛夏，WAVES第一次来到珠江边——广州市番禺区，良仓·新造创意园。</p>\n  <p>为什么是番禺？</p>\n  <p>不是因为场地大。是因为番禺本身就是一片正在翻涌创新创业的投资热土。</p>\n  <p>SHEIN从番禺的服装工厂里长出来，长成了全球第四大独角兽。小鹏汇天深耕番禺造飞行汽车。广汽埃安从这里出发，三年目标2000亿产值。番禺全区现有规上企业5000多家，服务业企业1100多家，3家千亿级企业，29家上市公司。全区2025年GDP3150.66亿元。</p>\n  <p>但更重要的是——番禺的“2104”产业体系里，有3个未来产业：具身智能、智能无人系统、前沿新材料。</p>\n  <p>这恰好是今年WAVES所有圆桌最密集的赛道。</p>\n  <p>这不是巧合。当36氪决定把WAVES带到南方的时候，番禺是那个“产业底色和大会内容天然咬合”的地方。WAVES聊的事，番禺正在全力招商引资。</p>\n  <p>浪往南走了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_23bf9b3a1d764fb18221dd9cdacf4685@6381723_oswg6453oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>番禺：历史文化底蕴厚重</strong></p>\n  <p>这句话不是口号，是事实。</p>\n  <p>番禺设县于秦代，距今2200多年，是岭南文化的重要发源地、广东音乐之乡、著名侨乡和海上丝绸之路起点之一。</p>\n  <p>今天的番禺，是粤港澳大湾区的地理中心。529平方千米土地上，住了330多万人。它同时拥有三张别人很难复制的牌：</p>\n  <p>第一张牌叫交通。广州南站，全国客流量第一的高铁站，2025年到发旅客超1.75亿人次，日均峰值92万。从南站出发，33分钟到白云机场，11分钟到琶洲。5条城际铁路、8条地铁线路在这里交汇。番禺是广州地铁里程最长的区，也是能最快抵达白云、香港、深圳三个国际机场的区域。</p>\n  <p>这意味着什么？意味着你在番禺落地，你的投资人、你的客户、你的供应链伙伴，从全国各地过来，都在一小时圈内。</p>\n  <p>第二张牌叫产业密度。3家千亿级企业（海大集团、广汽集团、SHEIN），4家独角兽（埃安、希音、小鹏汇天、探迹），50多个国家级专精特新企业，1900多个国家高新技术企业。灯光音响占全国48%市场份额，珠宝占港澳市场70%。这不是一个“有产业”的区，这是一个产业浓度极高的地方——上下游都在身边，从工厂到出海港口的距离，比别人短。</p>\n  <p>第三张牌叫人才。广州大学城在番禺。12所高校，20多万师生，73名院士。这是全国高校学生数量最多的大学城，也是国家未来产业科技园的所在地。紧邻大学城的东西庄科技创新集聚区，产业用地正在释放。狮子洋智造创新园已经入驻了100多个战略性新兴产业项目。</p>\n  <p>人才、空间、产业，番禺三张牌同时摊在桌面上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_57e8b1a459c8494ab5478d0a10e7733e@6381723_oswg10273oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>&nbsp; &nbsp;番禺招商政策，</strong></p>\n  <p><strong>用明确的数字展示诚意</strong></p>\n  <p>番禺的招商政策有一个特点：不藏着掖着，数字直接摆出来。</p>\n  <p>人才政策是最大的亮点。不是“绿色通道”“优先办理”这种虚的，是真心实意的：</p>\n  <p>创新创业领军团队：单个项目最高1000万元经费支持</p>\n  <p>杰出产业人才：最高500万元</p>\n  <p>博士落户：最高10万元</p>\n  <p>人才服务卡分三级：白金卡（120㎡五年全免租金）→金卡（90㎡两年半价）→银卡（45㎡两年八折）。</p>\n  <p>对世界级科学家团队、全球顶尖战略科学家、“卡脖子”攻关人员、生物医药顶尖项目（市级最高50亿元全链条支持）——纸面上的数字已经是天花板，但真正重量级的项目来了，天花板之上还有空间。</p>\n  <p>AI和机器人赛道，省市政策叠加。番禺的“2104”体系把具身智能列为三大未来产业之首，省级政策给到国家级制造业创新中心最高5000万元、工业AI标杆项目最高800万元、开源社区最高800万元。专精特新“小巨人”企业，省奖100万+市奖100万+区再奖，三级叠加最高300万元。</p>\n  <p>租金减免也是实打实的。国转中心入驻项目前三年全免，第四五年减半。科技成果交易平台按成交额1%补贴，每年最高500万元。</p>\n  <p>一句话总结：番禺的政策逻辑是——用真情实意抢人，用空间换项目落地，用省市叠加放大AI赛道的吸引力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_13f385ad58954110b576738404325d16@6381723_oswg10802oswg1080oswg144_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>&nbsp; 跟随WAVES来到番禺，</strong></p>\n  <p><strong>你能得到什么</strong></p>\n  <p>今年盛夏，WAVES 2026会期两天——6月16日至17日，广州番禺，良仓·新造创意园。</p>\n  <p>如果你是投资人或创业者，WAVES的议程里有你关心的所有议题：</p>\n  <p>出海圆桌——“迎风而立的人”，投资人和企业一起聊出海的真实水位</p>\n  <p>AI+医疗圆桌——从工具到处方，谁来为AI医疗买单</p>\n  <p>具身智能圆桌——FA和企业对谈，百亿估值与真实落地</p>\n  <p>AI Native圆桌——投资人们聊旧常识崩塌之后的新规则</p>\n  <p>中国AI的真实坐标——蓝驰创投×00后创业者的深度对谈</p>\n  <p>早期投资专场——“我们永远赞美冒险”，更小、更早、更水下</p>\n  <p>......</p>\n  <p>两天时间里，数十位Under36创业者和投资人站上台，台下是数百位36氪读者、投资机构合伙人、企业创始人和行业观察者。</p>\n  <p>如果你对番禺感兴趣，WAVES还准备了一整套对接机制：</p>\n  <p>番禺产业空间对接——如果你正在为团队找办公空间或生产基地，狮子洋专精特新聚集区、广州大学城、万博商务区、广州南站商务区都有优良的载体资源，番禺的工作人员会直接和你聊具体条件</p>\n  <p>番禺招商政策咨询——人才补贴、租金减免、现场有专人答疑，不需要你先跑三趟政府窗口</p>\n  <p>WAVES之夜社交——16日晚间的珠江边，Under36颁奖、青年脱口秀、AI集市、番禺美食、江边摩托车试骑。没有人穿西装，所有人都在同一个不设防的空间里。你端着酒走过去，可能遇到的下一个对话对象，就是你的下一个投资人、下一个合作伙伴、或者下一个合伙人</p>\n  <p>这不是“听完会就走”的行程。番禺给了空间和政策，WAVES给了内容和人。剩下的事，发生在江边的晚风里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_1c645835aa8d49dd82601ee7026f1cc6@6381723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>报名</strong></p>\n  <p>如果你是投资人、创业者或企业决策者，想在WAVES 2026期间与番禺进行产业对接、政策咨询或空间考察，请填写以下信息。</p>\n  <p>所填信息仅用于番禺区招商对接，填写即视为默认接受番禺工作人员联系。</p>\n  <p>意向参与番禺招商对接，点击<a href=\"https://jsj.top/f/NA2gwy\" rel=\"noopener noreferrer\" target=\"_blank\">https://jsj.top/f/NA2gwy</a>即可填报报名。</p>\n  <p>今年盛夏。珠江边上。浪来了，你到不到？</p>\n  <p><strong>WAVES 2026&nbsp;· 今年盛夏 · 6月16日-17日</strong></p>\n  <p><strong>广州番禺 · 良仓·新造创意园</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_ccd76b6745bf4440a912e4391195acde@6381723_oswg4950oswg1080oswg72_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_ae9d9ea427794cf599549b0551052385@6381723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_06cfc13925d74043ade4743c7f83a434@6381723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_4f032cf97be14af98625988384bc0685@6381723_oswg10530oswg1080oswg156_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-06-11T02:59:54+00:00", "fetched_at": "2026-06-11T03:32:04.896422+00:00", "fingerprint": "72acc2c3b33cbfc9"}, {"source": "少数派", "title": "这些人用实测，给麦金獭钢化膜交了份真实答卷", "url": "https://sspai.com/post/110868", "summary": "编注：挑选钢化膜向来讲究贴合自身机型与使用习惯，优劣好坏仅凭介绍难以定论。麦金獭钢化膜上线已有一段时日，少数派编辑部汇总大量真实买家反馈，内容拆分为「用户体验」、「进阶体验」两部分，帮大家选购前摸清产 ...<a href=\"https://sspai.com/post/110868\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-10T03:00:00+00:00", "fetched_at": "2026-06-11T03:32:03.252698+00:00", "fingerprint": "4290163a79c33e6c"}, {"source": "少数派", "title": "告别阅读焦虑：一份硬核科学阅读指南", "url": "https://sspai.com/post/110557", "summary": "阅读是个熟练功夫。<a href=\"https://sspai.com/post/110557\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-10T03:29:04+00:00", "fetched_at": "2026-
