91805+00:00", "fingerprint": "375adf50591c34a1"}, {"source": "The Verge", "title": "Apple’s entry-level MacBook Pro could be up for a redesign", "url": "https://www.theverge.com/news/960541/apple-macbook-pro-entry-level-redesign-ipad-pro-update", "summary": "Apple is working on a \"revamped\" version of its entry-level MacBook Pro that it could launch as soon as the first half of 2027, Bloomberg reports. The company is also testing four new iPad Pros that are set to launch in the spring with a focus on \"internal improvements.\" The updated MacBook Pro, which will [&#8230;]", "category": "tech", "published_at": "2026-07-01T22:39:43+00:00", "fetched_at": "2026-07-02T02:50:21.291796+00:00", "fingerprint": "2969aefe0d543f31"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宾利低至27万，二手豪华燃油车价格大跳水；Anthropic回应暗藏代码检测中国用户；寒武纪市值一日蒸发700亿", "url": "https://36kr.com/p/3877746956611847?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>OpenAI据悉迎来重大技术突破：系统优化使模型推理成本减半</p>\n  <p>苹果首次上架iPhone16e官翻机，仅有黑色与白色可选</p>\n  <p>国内航线燃油附加费7月5日起大幅下调</p>\n  <p>巴菲特“断供”盖茨基金会</p>\n  <p>董明珠喊话股东：家电不换成格力，凭什么要分红</p>\n  <p><strong>詹姆斯发文告别湖人</strong></p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>二手豪华燃油车价格大跳水：宾利近27万、保时捷15万</strong></p>\n  <p>7月1日，在青岛市的陆海汽车交易市场，二手车商在售8年以上车龄的宾利飞驰挂牌价仅26.8万元，入门保时捷Macan则低至15万元，新车近90万元的大众途锐二手成交价6.8万元。此外，奔驰、路虎多款中大型豪华SUV同步出现大幅跳水，昔日百万级豪车如今跌至家用车价位区间。报道提及，青岛宝驰名车负责人刘青松表示，过去二手豪华燃油车全年折旧幅度普遍不超过30%，但今年5月单月折旧幅度就达到30%。</p>\n  <p>汽车之家最新信息则显示，宾利飞驰2012款6.0T限量版价格为35.8万，该车原价高达562万；奔驰G级2004款G 500报价33.8万，新车含税价则要150.34万。而像奥迪2013款A8L 50 TFSI quattro尊贵型报价跌至8.88万，新车含税价为148.17万。（山东半岛新闻）</p>\n  <p><strong>Anthropic回应Claude Code暗藏代码检测中国用户：将在更新中删除</strong></p>\n  <p>用户逆向分析发现，Claude Code自今年4月起内置了针对中国时区及147个特定域名的检测机制，并将检测结果以隐蔽方式编码在请求中。Anthropic团队回应称这是为防止账户转售和模型蒸馏攻击的实验性措施，并计划在新版本中删除。（IT之家）</p>\n  <p><strong>寒武纪大跌超7%，市值一日蒸发700亿</strong></p>\n  <p>6月30日，寒武纪股价盘中突破1600元，总市值跨过一万亿人民币的门槛。这是科创板开板七年来，第一只万亿市值的股票。30日晚，寒武纪发布公告称，公司股票价格近期累计涨幅较大，可能存在短期上涨过快出现的下跌风险。截至公告披露日，公司日常经营情况正常，不存在其他应披露而未披露的重大信息。7月1日，寒武纪股价遭遇重挫。截至发稿，寒武纪下跌7.07%，报1482.90元/股，总市值回落至约9315亿元。与前一日万亿市值高点相比，单日市值蒸发近700亿元。(每日经济新闻)</p>\n  <h2>AI最前沿</h2>\n  <p><strong>亚马逊豪掷68亿元加码AI</strong></p>\n  <p>当地时间6月30日，美国科技巨头亚马逊公司旗下的云计算服务平台亚马逊云科技宣布，将投入10亿美元（约合68亿元人民币）设立全新的人工智能部门，专门协助客户搭建并落地人工智能系统。亚马逊云科技方面表示，预计将配置数千名前线部署工程师，相关团队将与客户业务、研发、安全部门深度协作，仅需数周，就能帮助客户搭建可自主运维的技术团队，交付完整AI解决方案。外媒报道称，亚马逊云科技是全球营收规模第一的云服务商，也是首家推出该类驻场工程师专项业务的超大规模云厂商。（央视财经）&nbsp;</p>\n  <p><strong>Anthropic：Fable 5将于美国时间7月1日在Claude平台全球上线</strong></p>\n  <p>Anthropic称，Fable 5将于美国时间7月1日在Claude平台全球上线。将继续与美国政府协调，扩大“Glasswing”计划下Mythos5模型的开放范围，使更多美国国内及国际合作伙伴能够获得使用权限。将尽快在AWS、谷歌云和微软Foundry上重新启用Fable5访问。Pro、Max、Team和Select Enterprise用户可访问Fable 5，使用量在每周最高限制为50%，有效期至7月7日。（财联社）</p>\n  <p><strong>OpenAI据悉迎来重大技术突破：系统优化使模型推理成本减半</strong></p>\n  <p>6月30日，据报道，OpenAI工程师在内部透露，公司已通过一系列全新的系统底层优化，成功将AI模型的推理（运行）成本降低了50%以上。（界面新闻）&nbsp;</p>\n  <p><strong>Anthropic Claude模型正式登陆Microsoft Foundry</strong></p>\n  <p>Anthropic当地时间6月29日宣布，Claude模型即日起正式在Microsoft Foundry（Azure AI Foundry）全面可用，企业用户可直接在Azure环境中部署和调用Claude模型，并沿用现有Azure身份认证、计费及治理体系。目前支持Claude Opus 4.8和Claude Haiku 4.5，涵盖提示缓存（Prompt Caching）、扩展思考（Extended Thinking）等能力，可用于编程、智能代理及复杂推理等场景。Anthropic表示，用户还可根据需求选择推理运行于Azure或Anthropic托管环境，未来双方将逐步实现功能和模型的一致性。（界面新闻）</p>\n  <p><strong>Meta被曝将向外部客户销售过剩AI算力资源</strong></p>\n  <p>有媒体称Meta正在制定一项云基础设施业务计划，将销售AI计算能力和模型的访问权限，从而与亚马逊网络服务(AWS)、微软和谷歌云等行业巨头展开新的竞争。据知情人士透露，Meta一直在加紧获取昂贵的数据中心和其他基础设施，以支持其自身的人工智能发展。目前，该公司正在组建一项新业务，通过向外部客户销售过剩的计算能力来产生收入。（新浪财经）&nbsp;</p>\n  <p><strong>“大空头”迈克尔·伯里又向AI宣战</strong></p>\n  <p>在全球投资者仍沉浸在人工智能（AI）引领的牛市狂欢中时，“大空头”原型迈克尔·伯里（Michael Burry）在6月30日，再次充当了那个冷酷的“吹哨者”。伯里的枪口不仅重新对准了英伟达、特斯拉等AI风口浪尖上的科技巨头，甚至连卖推土机和挖掘机的传统工业老大哥——卡特彼勒，也赫然出现在了他的做空名单之首。这位曾精准预测2008年次贷危机的传奇投资者在周二的一篇SubStack帖子中写道，他以1060.98美元的价格做空了卡特彼勒股票，同时还对英伟达、应用材料、特斯拉以及iShares半导体ETF(SOXX)建立了新的空头头寸，以此为他所认为的AI相关股票日益过度上涨的行情修正做好准备。（第一财经）&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>传小红书启动秘密项目，目标再造一款小红书级别的新产品，公司暂无回应</strong></p>\n  <p>6月30日晚间消息，有消息称，小红书在近期内部启动达尔文（darwin）的创业孵化项目，面向公司内部员工开放报名通道。根据爆料内容，员工成功入选后将以脱产形式参与项目孵化，全程由公司L3级别核心高管亲自带队指导，同时可对接平台内部海量资源支持，传闻项目核心目标是再造一款小红书级别的新产品。对内部员工而言，若孵化项目成功落地，核心参与人员有望直接出任产品负责人，职级至少从L1起步。对此消息，向小红书官方进行求证，截至发稿暂无回应。（新浪科技）</p>\n  <p><strong>苹果首次上架iPhone16e官翻机，仅有黑色与白色可选</strong></p>\n  <p>7月1日消息，MacRumors发现，苹果美国官方翻新商店于当地时间6月30日更新了产品阵容，正式上架iPhone 16e官翻机型。这是该机型自2025年2月发布以来，首次以官方翻新的形式出现在苹果官方渠道中。今年3月，随着新一代iPhone 17e的推出，iPhone 16e已从苹果官网下架停产，消费者无法再从官方渠道购买全新机。此次上架的官翻机，也就成了从苹果官方渠道购入这款机型的唯一途径。（IT之家）</p>\n  <p><strong>国内航线燃油附加费7月5日起大幅下调</strong></p>\n  <p>九元航空7月1日发布通知，自2026年7月5日（出票日期）起，下调国内航线燃油附加费。其中800公里以上航线每位旅客收取100元，800公里（含）以下航线每位旅客收取50元。相较于调整前分别降低50元/30元。今年四月和五月，国内燃油附加费连续大幅上调，6月5日开始下调20元/10元，随着燃油价格的下滑，7月的燃油附加费下调幅度更大。（第一财经）</p>\n  <p><strong>特朗普家族因加密货币获利超10亿美元</strong></p>\n  <p>据美国媒体当地时间6月30日报告，美国总统特朗普提交给美国政府道德办公室的2025年度财务报告显示，去年特朗普家族的加密货币业务为其带来了超过10亿美元的收入。据披露的财务文件显示，特朗普家族的加密企业“世界自由金融公司”通过销售新型加密产品获得了逾5亿美元收入；另有约6.35亿美元来自其个人迷因币（Meme币）$TRUMP的销售。</p>\n  <p>对于这次美国媒体披露出来的财务报告内容，白宫方面强调“不存在利益冲突”。白宫方面在一份给媒体的声明中称，特朗普及其家人“从未卷入——也绝对不会卷入——任何利益冲突”。（CCTV国际时讯）</p>\n  <p><strong>巴菲特“断供”盖茨基金会</strong></p>\n  <p>据知情人士透露，美国知名投资人沃伦·巴菲特20年来首次暂缓向比尔及梅琳达·盖茨基金会进行年度捐赠，将等该基金会与美国已故富商杰弗里·爱泼斯坦一案关联的审查结果公布后再作定夺。美国《华尔街日报》6月29日援引知情人士的话报道，按照巴菲特此前向盖茨基金会许下的一项终身承诺，巴菲特每年6月或7月初都会向盖茨基金会捐赠旗下投资机构伯克希尔-哈撒韦公司股票，但今年首次中断了这一惯例。（第一财经）</p>\n  <p><strong>牧原让员工学董事长《拜猪文》被指职场PUA，公司回应：未要求员工无底线牺牲</strong></p>\n  <p>7月1日消息，近日有网友爆料，牧原股份企业文化宣传中出现一篇名为《拜猪文》的文章，文中提到“我们也愿意像猪一样淡然地奉献出我们的一切”等。有不少网友提出质疑，认为该内容画风怪异，疑似变相PUA。据了解，《拜猪文》为牧原股份董事长秦英林所作。秦英林对此阐释称：“我们的事业是养猪，实则是猪养活着我们。尊重猪就是尊重自己，崇拜猪就是崇拜自己。”</p>\n  <p>针对此次舆论争议，牧原股份回复称，《拜猪文》由公司创始团队创作于2012年，是团队深耕养猪行业20年的实践总结与行业感悟。该内容纳入企业文化培训，核心目的是引导员工敬畏生命、尊重行业事业、坚守价值创造、践行社会责任，并无刻意洗脑、精神控制员工，或是要求员工无底线奉献牺牲的导向。（湖北日报）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_51a16351b838490881ad9c0ef74de0ef@5667365_oswg806873oswg1080oswg1549_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p><strong>董明珠喊话股东：家电不换成格力，凭什么要分红</strong></p>\n  <p>6月30日，珠海格力股东大会现场，董明珠在表示，股东若要获得稳定分红，需依靠8万员工与渠道商的共同努力。她建议股东在获得分红后，将家中空调及其他家电都更换为格力产品。面对创下历年新高的四百余名到场股东，董明珠直白喊话，“家电不改为格力，凭什么分红？”此番言论随即引发广泛关注。据报道，2025年，格力电器(37.460, -0.04, -0.11%)的营业收入为1704亿元，归母净利润为290亿元，均同比下跌约9.8%，市场背景是去年空调市场整体增长承压。（观察者网）</p>\n  <p><strong>小米高层大调整：小米中国区总裁王晓雁不再兼任销售运营一部总经理，陈幕楠接任</strong></p>\n  <p>新浪科技获悉，小米中国区近日迎来人事调整，涉及汽车销交服部、销售运营一部、电商部、新零售部等多个部门。其中，任命樊家麟担任汽车销交服部下辖的销售运营部代理总经理，向汽车销交服部总经理夏志国汇报。任命陈幕楠担任销售运营一部总经理，向集团高级副总裁、中国区总裁王晓雁汇报。任命新零售部总经理张健兼任小米之家总经理，原小米之家总经理陈恺则担任电商部总经理，向集团高级副总裁、中国区总裁王晓雁汇报。在2025年12月的上一轮中国区大调整中，小米集团高级副总裁、中国区总裁王晓雁兼任销售运营一部总经理，被外界解读为亲自下场抓业绩。对比此次调整，他不再兼任销售运营一部总经理一职。（新浪科技）</p>\n  <p><strong>美联储主席：当前美国通胀水平仍然过高</strong></p>\n  <p>美国联邦储备委员会主席凯文·沃什7月1日在葡萄牙举行的欧洲央行中央银行论坛上表示，当前美国通胀水平仍然过高，同时重申美联储工作的优先事项是确保物价稳定。沃什说，美联储将“开辟一条新的政策路径”，但并未进一步加以说明，同时回避了有关7月货币政策会议是否加息的问题，强调不会对未来利率政策给出前瞻性指引。沃什表示，美联储正设立独立工作组，围绕货币政策沟通、经济数据体系、生产率、通胀框架以及资产负债表政策等课题展开研究。（央视新闻）</p>\n  <p><strong>美公布6亿美元月球任务计划，推进月球基地建设</strong></p>\n  <p>美国航空航天局30日公布月球基地建设项目最新安排，表示已与三家美国企业签订总额近6亿美元合同，将于2028年底执行4项新的月球登陆任务。（财联社）</p>\n  <p><strong>詹姆斯发文告别湖人</strong></p>\n  <p>北京时间7月1日凌晨，据美国媒体报道，NBA巨星勒布朗·詹姆斯已告知湖人他将在下赛季继续自己的职业生涯，但将离开湖人，前往其他球队效力。报道援引詹姆斯经纪人里奇·保罗的话说，詹姆斯已告知湖人队，球队可以按照自身规划推进后续工作，因为他将在新赛季加盟其他球队。现年41岁的詹姆斯将迎来个人第24个NBA赛季。2003年，他以状元秀身份进入NBA，职业生涯先后效力于骑士队、热火队和湖人队。他是NBA历史得分王，曾4次获得NBA总冠军、4次荣膺常规赛最有价值球员（MVP）。（第一财经）</p>\n  <p><strong>微软计划进行新一轮裁员，将影响数千个岗位</strong></p>\n  <p>7月1日，据报道，有知情人士透露，微软计划很快宣布新一轮裁员。这些知情人士称，此次裁员将影响数千个岗位，包括销售和咨询部门，以及Xbox游戏部门的职位。知情人士补充说，本轮裁员规模将小于去年的类似裁员，此次裁员幅度将不到公司22万名员工总数的2.5%。据其中一位知情人士透露，微软计划于下周宣布裁员消息，但具体时间可能有所变动。部分受影响的员工将立即获得新的岗位安排。（界面新闻）</p>\n  <p><strong>特斯拉：首台量产无人驾驶电动车Cybercab已开启工程测试</strong></p>\n  <p>36氪获悉，据特斯拉消息，首台量产赛博无人驾驶电动车Cybercab已在美国得州奥斯汀开启工程测试。</p>\n  <p><strong>瑞典法院裁定谷歌须支付近15亿美元反垄断赔偿金</strong></p>\n  <p>据报道，瑞典斯德哥尔摩专利与市场法院7月1日裁定，谷歌须向瑞典金融科技公司Klarna旗下比价平台PriceRunner支付约143亿瑞典克朗（约合15亿美元）的反垄断赔偿金。PriceRunner于2022年向该法院起诉谷歌并索赔约21亿欧元，指控谷歌通过操纵搜索结果来优待其自身的购物比价服务，违反反垄断法。（界面新闻）</p>\n  <p><strong>A股交易新规将于7月6日起正式施行，主板ST股涨跌幅提至10%</strong></p>\n  <p>经过两个多月的市场技术与业务准备，A股交易新规将于2026年7月6日(下周一)起正式施行。新规优化基金收盘交易机制、扩展盘后固定价格交易方式适用品种、主板ST股涨跌幅提至10%。对于投资者而言，需要关注三方面:一是调整基金尾盘交易习惯，最后三分钟投资者仅可提交限价申报，且不可撤单，所有委托统一集合竞价撮合;二是盘后固定价格交易按照收盘价成交，无法自主定价，同时交易活跃程度与连续竞价有较大差异;三是审慎参与主板风险警示股票交易。(第一财经)</p>\n  <p><strong>欧盟气候监测机构发出警告</strong></p>\n  <p>1日，欧盟气候监测机构哥白尼气候变化服务局（C3S）和哥白尼海洋服务局（CMEMS）均表示，全球海面温度已超过2023年和2024年同期观测到的最高纪录。C3S的每日海面温度数据显示，今年6月21日的温度达到20.86摄氏度，超过了2023年和2024年同期观测到的20.83摄氏度。C3S和CMEMS认为，随着赤道太平洋地区厄尔尼诺现象的出现，加上近几个月多个海域观测到的异常高温，全球海面温度在此时期创下新纪录是在预料之中的。预计这一纪录将对天气模式、全球气候及海洋生态系统产生影响。（第一财经）</p>\n  <p><strong>三星、SK海力士、台积电，抢购电子级氢氟酸</strong></p>\n  <p>7月1日，业内传出，台积电、三星、SK海力士都在抢购电子级氢氟酸（HF）。报道称，今年以来中东地缘政治紧张推升硫磺、硫酸及无水氢氟酸价格，带动电子级氢氟酸成本垫高，部分供货商已陆续调涨售价，涨幅约二至三成。目前半导体最高规格的G5级电子级氢氟酸因技术门坎高，全球供给相对有限。台塑大金指出，若未来客户持续扩产，公司也拟持续跟进，目前氢氟酸单月获利，已与台塑旗下的电子级异丙醇（IPA）接近。（中国台湾经济日报）</p>\n  <p><strong>宣传视频被指“擦边”，绿源电动车回应</strong></p>\n  <p>近日，绿源电动车官方账号发布的宣传视频中模特穿高跟鞋、黑丝袜，镜头特写隐私部位。有网民表示，模特穿搭不符合现实场景，拍摄视角引人不适，质疑故意“擦边”。</p>\n  <p>7月1日，绿源电动车客服人员表示，账号运营由公司内部部门负责，已下架整改相关视频，后续会加强审核全渠道广告，并就给消费者带来不适体验表示抱歉。（新京报）</p>\n  <p><strong>韩国投资者上半年持续加仓A股</strong></p>\n  <p>2026年上半年，韩国投资者持续加码配置中国市场。韩国证券存托结算院(KSD)数据显示，在韩国投资者净买入金额居前的中国市场标的中，多只ETF强势挤进榜单前列，科技、人工智能、半导体、新能源等主题产品尤为受到追捧。A股市场中，韩国投资者净买入前20名中，有8只ETF产品，包括通信ETF华夏、芯片ETF华夏、人工智能ETF易方达、上证指数ETF富国、云计算ETF易方达、科创50ETF华夏、电网设备ETF华夏、机器人ETF华夏。个股方面，韩国资金重点投向人工智能、先进制造等成长领域。A股市场中，上半年被韩国资金买入最多的三一重工，获999.75万美元净买入；东山精密、宁德时代紧随其后，分别获558.20万美元、555.24万美元净买入；此外，亨通光电、麦格米特、云南锗业、长飞光纤等也获得韩国资金持续增持。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，SpaceX跌超7%</strong></p>\n  <p>36氪获悉，7月1日收盘，美股三大指数集体下跌，道指跌0.03%，纳指跌0.66%，标普500指数跌0.22%。大型科技股涨跌不一，SpaceX跌超7%，Arm跌超4%，英伟达跌超1%;Meta涨超8%，奈飞、微软涨超3%，谷歌、亚马逊、苹果、特斯拉涨超1%。热门中概股多数上涨，拼多多涨超8%，理想汽车涨超4%，百度、腾讯音乐、京东涨超3%，小鹏集团、微博、B站涨超2%，网易涨超1%;蔚来跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>优步投资的Lime据悉确定IPO发行价为25美元</strong></p>\n  <p>据知情人士透露，Neutron HoldingsInc.（更广为人知的名字是Lime）已将其首次公开募股（IPO）定价为每股25美元，处于此前公布的发行价区间中位。该公司在2020年由Uber牵头的投资轮次中估值达5.1亿美元。Lime最早于2021年考虑上市。（新浪财经）&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>自变量多轮融资后估值突破200亿元</strong></p>\n  <p>6月30日，自变量机器人宣布，公司在过去两个多月内连续完成B+、B++和C轮融资，投资方包括中国移动链长基金、红杉中国、IDG资本、源码资本、达晨财智、中金资本、中保投资等30多家机构，估值突破200亿元。自变量机器人也是大湾区率先达到200亿元估值并全部完成交割的具身智能企业。（每日经济新闻）</p>\n  <p><strong>“感知纪元”完成千万级天使轮融资</strong></p>\n  <p>36氪获悉，“感知纪元”近日完成千万级天使轮融资，本轮由松禾资本领衔投资。融资资金将主要用于中试产线搭建、核心产品迭代升级及团队扩充，加速推进多模态智能触觉电子皮肤从研发走向量产。</p>\n  <p><strong>“MobAl”完成数百万元天使轮融资</strong></p>\n  <p>36氪获悉，AI创业公司“MobAl\"已完成数百万元天使轮融资，由港股上市公司赤子城科技独家投资。目前，由MobAI开发的AI互动叙事应用LunaverseStories已进入邀请制测试阶段。</p>\n  <h2>氪大事</h2>\n  <p><strong>氪大事短视频栏目，鲜活解读商业世界大事。</strong></p>\n  <p>短剧爽文里无所不能的“金手指”可能不会一夜出现，但AI Agent从工具到专属超能搭档，从回答问题到完成任务，变化已经开始发生。正如世界杯期间联想推出的天禧AI短剧《我的AI搭档之“禧”从天降》里那句台词：把判断交给人，把任务交给天禧AI，把时间还给人生。&nbsp;</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-02T00:10:58+00:00", "fetched_at": "2026-07-02T02:50:21.117434+00:00", "fingerprint": "c69a9feed25a1315"}, {"source": "36氪 - 最新文章", "title": "专访美图 CEO 吴欣鸿：做 AI 产品，是一场难以提前策划的游戏", "url": "https://36kr.com/p/3877112973733895?f=rss", "summary": "<p><strong>访谈｜周鑫雨 兰杰</strong></p>\n  <p><strong>文｜周鑫雨</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>截至 6 月中旬，吴欣鸿 2026 年的飞行距离已经超过了 230000 km，飞行时长近 300 个小时。他的轨迹横跨亚洲、北美、欧洲、南美，到达最远的地方是巴西和阿根廷。</p>\n  <p>航线所经之地，是美图近三年来靠 AI 产品扩展的市场版图。</p>\n  <p>美图 2025 年财报显示，海外 MAU 时隔多年重新回到 1 亿，其中，AI 视频编辑工具 Wink 和影像创作 Agent RoboNeo 在东南亚、墨西哥、巴西等地增长迅速，频频登上&nbsp;iOS 下载榜第一。</p>\n  <p>随全球拓展水涨船高的还有利润。2025 年，美图的收入达到 38.58 亿元，净利润达 9.65 亿元，同比增长 64.7%。其中，<strong>经过&nbsp;AI&nbsp;重构的影像与设计产品，已经成为造血主力，收入占比从一年前的 35%，提升至 76.6%。</strong></p>\n  <p>几年前，美图尚在盈亏线上挣扎。面对 AI 汹涌的浪潮，<a href=\"https://mp.weixin.qq.com/s?__biz=MzkwMDQ2NDU2Nw==&amp;mid=2247485974&amp;idx=1&amp;sn=bf934bff3b68fb13048c46954d4f5835&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">吴欣鸿和《智能涌现》聊的是被冲击的“危机感”，直言自己“如履薄冰”</a>。</p>\n  <p>两年来，美图也做了不少应对 AI 时代的组织革新。吴欣鸿在 2000 多人的公司中，设立了一批小型 AI 创新工作室，为单个团队提供最高 1000 万元的AI创新资金，激励内部快速孵化 AI 产品。</p>\n  <p>并且，团队还花几个月时间搭建了影像产品中台和增长中台，目的就是将技术工程、冷启动、投流等管线，复用到不同产品中，缩短产品研发和验证周期。</p>\n  <p>“AI 时代，你必须快，才有机会赢。”吴欣鸿告诉我们。</p>\n  <p>为此，美图内部制定了相当严苛的产品考核机制：从立项、研发，到市场验证和上线，时间控制在 1 个月内；PMF（产品市场适配度）验证的标准是，上线半年内， ARR 必须达到 10 万美元。</p>\n  <p>以及，吴欣鸿还提出，<strong>拥有庞大用户基数的“美图秀秀”等老产品，禁止给新产品大力导流，</strong>这是为了考验新产品自然生长的能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_0c4c312a6a83439f95a5a5eef5cf0465@5783683_oswg135280oswg1080oswg450_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△ 2026 年“美图影像节发布的 4 款新产品，同时，4 款老产品完成了 AI 功能的迭代。图源：企业供图</p>\n  <p>2026 年“美图影像节”发布的 4 款 AI 新产品中，AI 人像修图工具 Picchi、影像工作流搭建平台 MeituHub 就是“自然生长”出的产品。</p>\n  <p>比如，Picchi 源自美图团队对“美图秀秀”用户高频使用行为的洞察。“用户每一次修图都是想修成理想中的自己，但每次都要重复修图很麻烦。有没有可能让用户上传过去修好的图给 AI 看，让 AI 自动学习用户的修图手法。”美图 CPO 小白提到。</p>\n  <p>而另外两款略显“小众”的产品，MV 生成工具 MVLAND 和 概念视频创作工具 Artflo，则源自吴欣鸿个人的热爱，以及对“非共识”领域的押注。</p>\n  <p>“成功产品，大多都从没有竞争的场景开始。”吴欣鸿告诉《智能涌现》。</p>\n  <p>关于对新兴市场的洞察，工具赛道的竞争，以及“热爱”驱动产品的方法论，近期《智能涌现》和美图公司创始人、董事长兼 CEO 吴欣鸿，以及美图公司 CPO 兼影像产品事业群总裁陈剑毅（花名“小白”）聊了聊。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_e6477264626841829720a47d97028c96@5783683_oswg88808oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△&nbsp;美图公司创始人、董事长兼 CEO 吴欣鸿（中）；美图公司 CPO 兼影像产品事业群总裁陈剑毅（花名“小白”，左二）。图源：企业供图</p>\n  <p>以下是对交流的整理，内容略经编辑：</p>\n  <h2><strong>自然生长出来的产品，生命力更强</strong></h2>\n  <p><strong>智能涌现</strong>：今年影像赛道的竞争更激烈了吗？</p>\n  <p><strong>吴欣鸿</strong>：很长时间里，影像工具不被 VC、大厂和创业者关注，因为很难变现。</p>\n  <p>如今影像产品出现了商业化效应。因为影像有着非常丰富的生产力场景，图像、视频、3D 等等都在范畴内，非常多的行业都有影像的需求，但影像是一个非常分散的赛道，加上进入的人也越来越多，很难出现一家独大的情况。</p>\n  <p>我们现在就是在抢时间。</p>\n  <p><strong>智能涌现</strong>：为什么以前影像产品变现难？</p>\n  <p><strong>吴欣鸿</strong>：订阅模式普及之前，很多工具产品只能靠广告。广告模式的问题在于，一是变现效率不高，尤其是品牌广告，你需要组建专业团队服务客户；二是广告投放和用户体验是相悖的。</p>\n  <p><strong>智能涌现</strong>：影像赛道很分散，你们怎么选择先切入哪些场景？比如新发布的 MVLAND，背后是个很细分的赛道。</p>\n  <p><strong>吴欣鸿</strong>：说到这个，很多年前我就买下了一个域名：mv.com，未来可能会成为 MVLAND 的网址。</p>\n  <p><strong>智能涌现</strong>：很多年前你就想做 MV 相关的产品？</p>\n  <p><strong>吴欣鸿</strong>：我是一个美术生，从小学画画，所以我对具有艺术性的东西都很感兴趣。我一直以来思考的都是怎么用产品去结合我的爱好，以及我对影像和视觉比较长期的积累。</p>\n  <p>除了 MVLAND，今年发布的 Artflo，也是出于我的爱好。很难想象，中国有其他公司会去做一个把灵感转化成作品的产品，因为看上去没有市场。</p>\n  <p><strong>智能涌现</strong>：那它能赚到钱吗？</p>\n  <p><strong>吴欣鸿</strong>：我们也不知道。但我就是很喜欢。</p>\n  <p><strong>智能涌现</strong>：你们不是一家 PMF 或者数据先行的公司？</p>\n  <p><strong>吴欣鸿</strong>：<strong>我希望美图的产品矩阵中，有我的自留地，让我去做喜欢的事。</strong>这算我自己的私心吧，把兴趣变成事业会更有趣。纯赚钱的事我也能做，但会缺少一些热爱。</p>\n  <p>我们现在有两种做产品的方式。一种是自下而上的创新，我们通过数据洞察到一个需求、一个趋势，再做一些验证，之后慢慢放大产品；另一种是自上而下的战略推进。</p>\n  <p>两者之间并不矛盾。这样做有助于形成健康的产品生态：年轻同事有验证想法的机会，而我可以实现自己的兴趣。</p>\n  <p><strong>小白</strong>：其实 PMF 驱动和热爱驱动也不矛盾。<strong>MVLAND 是最近一年所有新产品中跑得最好的，内测两三个月，ARR 就到了 10 万美元，现在接近 50 万美元了。</strong></p>\n  <p><strong>智能涌现</strong>：这次发布的产品和功能中，哪些是出于热爱？哪些是自下而上的？</p>\n  <p><strong>吴欣鸿</strong>：其实挺难分的。但大多数情况下，<strong>自下而上的产品生命力更强，因为它是自然生长出来的，不是强推的。</strong></p>\n  <p>比如营收增速很快的“开拍”就是自下而上的产品。一开始我们并没有想做一个口播视频的应用，它是从“美颜相机”的提词器功能“长”出来的，当时我们只是发现使用这个功能的用户特别多。</p>\n  <p><strong>智能涌现</strong>：你热爱的、没有经过数据验证的产品，立项之初团队中有人反对吗？</p>\n  <p><strong>吴欣鸿</strong>：我们最后用产品数据说话。如果多次试验后，产品数据依然不好，那就只能结束业务。所以我们基本不在赞同或反对上多费口舌，而是快速验证。</p>\n  <p>美图是一家 2000 人左右的中等规模公司，有一定规模优势。我们可以将很多人力投入产品中台的建设，建立一套可以复用的产品研发管线，从而缩短打造和迭代产品的时间。</p>\n  <p><strong>智能涌现</strong>：能把时间缩短到什么程度？</p>\n  <p><strong>吴欣鸿</strong>：像 RoboNeo 新上线的 Agent Teams，我们花了一个月就做完了。</p>\n  <p>Agent 理论上是一个技术和工程都挺复杂的产品。因为我们有影像产品中台、增长中台等等，所以能将成熟的技术工程、冷启动、营销、增长等经验，高效复用到新产品或新功能上，对 PMF 进行快速验证。</p>\n  <p>这个时代，验证 PMF 的时间理论上越短越好，谁也不知道一个月后技术和市场怎么变。所以我们都将产品验证周期控制在一个月内。</p>\n  <p><strong>智能涌现</strong>：验证 PMF 的标准是什么？</p>\n  <p><strong>小白</strong>：<strong>产品上线半年内，ARR 超过 10 万美元——这是基准线，毕竟硅谷 ARR 百万美元的产品太多了。</strong></p>\n  <h2><strong>先发产品，再找市场</strong></h2>\n  <p><strong>智能涌现</strong>：听说你们马上要飞巴西。</p>\n  <p><strong>吴欣鸿</strong>：是的。带团队去感受一下，和当地的用户、创作者交流。我们也打算拜访一些出海很优秀的中国公司，学习一下经验。</p>\n  <p><strong>智能涌现</strong>：现在美图的重点市场有哪些？</p>\n  <p><strong>吴欣鸿</strong>：<strong>重点市场永远是中国。</strong>中国的用户体量全球最大，语言最统一，美图又有本土的优势。</p>\n  <p>虽然中国市场很卷，但卷有卷的好处，可以锻炼团队的战斗力，有助于我们在海外的竞争。因为我们从本土的竞争突围后，再去海外其他国家，会发现竞争强度远没有在中国高。</p>\n  <p>我们从 2013 年就开始出海，现在美图产品在一些亚洲国家的市占率，尤其是东亚和东南亚，已经逼近中国。</p>\n  <p><strong>智能涌现</strong>：你当下最想开拓哪些市场？</p>\n  <p><strong>吴欣鸿</strong>：南美。巴西、墨西哥等国家的绝对人口也很多，比如<strong>巴西有 2.1 亿的人口，而且他们有旺盛的社交分享需求，从中会延伸出一系列影像创作需求</strong>。有些产品如 RoboNeo、Airbrush，巴西用户是最多的，超过了中国。</p>\n  <p>未来我们也很看重<strong>非洲市场</strong>。刻板印象中，非洲用户比较边缘，好像没有很旺盛的影像创作需求。但事实上，我们收到的用户反馈，有不少是来自非洲的。所以有机会我也想带团队去了解一下非洲市场。</p>\n  <p><strong>智能涌现</strong>：南美、非洲这些市场，是你们 Day 1 就判断要做的吗？</p>\n  <p><strong>吴欣鸿</strong>：不是，我们往往是先发布产品，再根据用户反馈，才去挖掘新的市场、新的增长机会。</p>\n  <p><strong>因为影像产品，或者说互联网产品，边际成本都比较低，能够轻量地、快速地去服务全球用户。</strong>所以我们往往做好各地的语言包之后，就等着用户自己去下载使用、给出反馈。</p>\n  <p>慢慢地，我们就会构建出一幅热点图，知道产品在哪些国家和地区比较受欢迎。接着我们会持续地找原因，如果能找到一个产品和市场的很好的契合点，我们就会尽量放大。</p>\n  <p><strong>所以很多东西都不是策划出来的，而是自然长出来的。只不过长出来之后，我们去浇水，去更好地养护，让产品长得更茁壮。</strong></p>\n  <p><strong>智能涌现</strong>：市场往往是后验的，那哪些判断是可以先验得出的？</p>\n  <p><strong>小白</strong>：感性判断肯定是先验的，MVLAND 就是欣鸿的“小小私心”（笑）。</p>\n  <p>但 PMF 前期是没法先验验证的，需要靠后续一套商业交付的价值衡量体系。以 MVLAND 为例，我们做了很多音乐工作室的调研，盘清了歌曲的产量、MV 的制作成本，以及有多少歌曲配了 MV。</p>\n  <p>不少音乐工作室都提到，假设给他们一个低成本制作的方式，将每首歌都配上 MV，他们就能在抖音、YouTube 等平台上做内容分发，从中赚取广告费，或者做更多歌手 IP 的包装——这些都是目标用户能具体量化的商业价值，我们就能反推 MVLAND 的 PMF。</p>\n  <p><strong>智能涌现</strong>：怎么找种子用户？超级创作者会是你们的核心种子用户吗？</p>\n  <p><strong>小白</strong>：<strong>尽量不要把“超创”纳入种子用户。</strong>他们太全能了，不是典型的用户，所以加入“超创”会污染种子用户的使用行为。</p>\n  <p>“超创”的作用是帮我们触达更多的种子用户，以及做品牌推广。</p>\n  <p><strong>智能涌现</strong>：目前哪些需求是被你们“证伪”的？</p>\n  <p><strong>小白</strong>：<strong>AI&nbsp;试衣。</strong>试衣有两个场景，一种是面向电商平台的商业场景，目前技术是最大的瓶颈，我们也还在攻克衣服一致性、材质还原等问题。</p>\n  <p>另一种是面向消费场景，帮助用户用AI做穿搭。但我们发现，还是把用户想得太理想了。大家不会为了做AI试穿，就把自己衣柜里的衣服一套套全拍下来上传，以及他们更享受现实中试穿、自己搭配的过程。</p>\n  <h2><strong>巨头不会吃掉一切</strong></h2>\n  <p><strong>智能涌现</strong>：在大家都期待用 AI 替代人工时，你们针对“不想学 AI”的用户发布了“真人创作服务”，让设计师在线接单。这会不会反而阻碍用户 AI 心智的形成？</p>\n  <p><strong>小白</strong>：那挺好，真人的毛利率更高（笑）。</p>\n  <p>我们参考滴滴专车的模式，自营一支服务团队，对设计师进行专业化的培训，提供标准化的服务。目前提供 AI 创作服务的大概有几十人。</p>\n  <p><strong>智能涌现</strong>：有真人服务需求的用户，占比大概有多少？</p>\n  <p><strong>小白</strong>：<strong>如果放眼全世界，最少 90% 以上。</strong></p>\n  <p>AI 普及率其实低得惊人。以中国市场为例，我们的人力成本是很低的，所以用户不愿意自己学着使用一些工具，而是直接购买人力服务。</p>\n  <p>比如，水果庄园主的念头是把水果种好，而不是去学剪视频、学短视频营销。他们更愿意每个月花几百块钱，找团队每天做 3 条视频。</p>\n  <p><strong>智能涌现</strong>：从“美图秀秀”到现在的 Agent，产品交互界面最大的变化是什么？</p>\n  <p><strong>小白</strong>：“美图秀秀”类的产品大多以编辑为起点，对话做辅助。Agent 产品会以“对话”为起点，再结合后续的编辑器、资产库等等。</p>\n  <p><strong>智能涌现</strong>：美图是偏应用层的公司，为什么仍然选择自己训练大模型？</p>\n  <p><strong>小白</strong>：“美图奇想大模型”针对人像进行了很多优化。市面上大多模型我们都测评过，在人像表现上都没法落地，没法满足我们的要求。</p>\n  <p><strong>智能涌现</strong>：成本、质量、生成速度，是影像生成模型的不可能三角。作为下游应用公司，你们会不得不牺牲一角吗？</p>\n  <p><strong>吴欣鸿</strong>：<strong>质量是影像产品的灵魂。</strong>即便我们想进入某个很有潜力的场景，如果产品效果没能做好，我们也会战略性地先放弃。同样的，只要无法判断能否交付高质量的生成效果，我们就不会进入场景。</p>\n  <p>一旦决定进入某个场景，我们一定会“死磕到底”，把效果做到第一名。</p>\n  <p><strong>智能涌现</strong>：现在很多工具产品都靠低价、补贴去获客。你们会牺牲一定毛利去做增长吗？</p>\n  <p><strong>小白</strong>：现在有的创业公司疯狂烧钱做算力补贴，很像是拿投资人的钱帮模型厂商刷流水，把 ARR 冲高了再去融更多的钱——<strong>这好比走钢索，赌的是未来算力成本一定会降下来，这个风险太高了。</strong></p>\n  <p>就好比电商提升 GMV 最快的办法就是补贴卖 iPhone 和金条，这套打法只适合背后有几百亿弹药的公司。</p>\n  <p>我们会有一定的补贴做拉新，但更倾向于保持一定的利润，持续补贴做不出产品优势，而产品优势才是我们的溢价空间。</p>\n  <p><strong>智能涌现</strong>：美图的产品是 Day 1 就开始收费的，你们怎么决定收费 Timing 的？</p>\n  <p><strong>小白</strong>：AI 时代就要 Day 1 收费，因为 Token 很贵。先免费、再收���，很多用户会骂你；前期因为免费进来的用户，也不一定是你真正的用户。</p>\n  <p>“豆包”能先免费再收费，还是因为字节有钱。</p>\n  <p><strong>智能涌现</strong>：Picchi、“开拍”都是从“美图秀秀”“美颜相机”这些老产品的单点功能中孵化的产品。单点功能作为一个独立产品，会因为“太薄”而更容易被颠覆吗？</p>\n  <p><strong>小白</strong>：有这样观点的人，大多都 30 岁以上。为什么现在的年轻人不喜欢买奢侈品，而是喜欢新潮牌？因为他们喜欢用这种方式来定义自己跟上一代的不同。</p>\n  <p><strong>所以在影像赛道，我们也希望创造像 Picchi 这样的“时尚单品”。</strong></p>\n  <p>“美图秀秀”是一个集成型的平台，一旦我们发现平台上某个场景下的工作流使用量特别高，我们会转化成独立产品。</p>\n  <p><strong>智能涌现</strong>：你之前提到“美图秀秀”等拥有庞大用户基数的老产品，不会为新产品导流。为什么？</p>\n  <p><strong>吴欣鸿</strong>：我们要确保新产品有自然生长的能力，而不是靠老产品喂流量。如果一个新产品效果不好，用户留不下来，给再多流量也会漏走。</p>\n  <p>未来，我们的主要竞争对手会是初创公司，他们的资源一定不富饶，所以会拼命想办法做增长。所以，<strong>我们要尽可能去模拟初创的环境。</strong></p>\n  <p><strong>智能涌现</strong>：为什么主要竞争对手会是初创公司，而不是大厂？</p>\n  <p><strong>吴欣鸿</strong>：大厂的资源都会往更底层的芯片、模型走，我们进入的是应用的战场。每一家公司都有自己的主航道。</p>\n  <p>即便大厂真的下场，猛兽会不会吃掉所有的生物？我猜是不会的。QuestMobile 的数据显示，目前中国视频创作工具的市占率排名，剪映是第一，第二名是我们的“Wink”，第五名是我们的“开拍”——这意味着我们突破了层层封锁。</p>\n  <p>而且市场和用户需求是动态变化的，美图团队擅长在垂直细分领域里深度思考，持续为用户打磨符合预期的产品形态。</p>\n  <p><strong>智能涌现</strong>：你认可 AI 革命把所有玩家拉到同一起跑线上吗？</p>\n  <p><strong>吴欣鸿</strong>：我不太认可。</p>\n  <p>规模效应非常关键。说实话，同样的事，投入 800 人和只投入两三人是完全不一样的。因为产品背后更多的是工程，而不仅仅是算法。</p>\n  <p><strong>工程需要实打实的投入</strong>，不是靠 Vibe Coding 和足够聪明就能解决的。这也是我们建产品中台的原因，尽量将工程环节的脏活、累活，变成可复用的管线。</p>\n  <p><strong>智能涌现</strong>：美图是一家成功了很多次的公司，而且每款产品所处的赛道竞争都很激烈。能不能从中总结出一些共性的经验？</p>\n  <p><strong>吴欣鸿</strong>：<strong>成功产品，大多都从没有竞争的场景开始。</strong>像这次发布的 4 款新品，市场中都没有什么竞争者，我们只和自己竞争。</p>\n  <p>以及，美图最擅长跑马拉松了。之前我们跟腾讯的“天天 P 图”、百度的“百度魔图”都跑过 N 次了。坚持下去，产品效果会说话。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_a0884b4be197427fb91111d7e7943396@5783683_oswg649725oswg1389oswg517_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260701/v2_abd5262e581f4160ad8f2c97183261f8@5783683_oswg156754oswg900oswg335_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！j</p>", "category": "tech", "published_at": "2026-07-02T00:30:23+00:00", "fetched_at": "2026-07-02T02:50:21.117430+00:00", "fingerprint": "4de9e9f09b2154db"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨北大博士量子团队获高瓴创投领投，国内唯一实现纳开温区量子计算机工程化", "url": "https://36kr.com/p/3877814169530630?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，国内首家nK级中性原子量子计算机公司——纳开启元（北京）量子科技有限公司（下称“「纳开量子」”）近期已完成首轮数千万元融资，由高瓴创投（GL Ventures）领投，英诺、长石、飞图三家机构跟投。所募资金将重点用于新一代中性原子量子计算机的研发、超冷原子量子模拟计算机的生态建设及标杆客户交付。</p>\n  <p>「纳开量子」成立于2026年4月，是国内首家聚焦超冷原子量子模拟计算与中性原子通用量子计算路线的公司，已形成覆盖量子计算整机、冷/超冷原子实验系统、关键子系统及高精度模块化控制电路的全栈式产品矩阵。公司已斩获千万级市场订单，预计2026年全年营收达数千万元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_41b4aa3091374092a3d7be8eb016f214@6221844_oswg920864oswg918oswg688_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纳开量子超冷原子量子模拟计算机（图源/企业）</p>\n  <p>「纳开量子」的核心团队源自北京大学量子电子所冷原子与精密测量课题组（CAP组）。公司创始人兼CEO樊耀塬出生于1998年，本科毕业于北京大学物理学院，博士毕业于北京大学电子学院，从事冷原子研究超过8年，兼具物理前沿探索与工程实现能力。博士期间，他主导搭建了国内首台超冷原子干涉陀螺仪，并联合搭建了国内首台超冷原子布洛赫振荡型重力仪。</p>\n  <p>量子计算被广泛认为是下一代算力的关键突破口，尤其在大规模并行计算与复杂系统模拟方面具有经典计算无法替代的优势。</p>\n  <p>在众多技术路线中，中性原子因其天然的全同性与可扩展性，被视为最有希望实现大规模通用量子计算的路径之一。</p>\n  <p>「纳开量子」正是沿着这一方向展开布局。公司名称中的“纳开”源自绝对温标中的纳开尔文（nK）单位，象征其在原子的极限冷却与精准操控方面的核心能力。团队掌握将铷、钾、铯、锂、钠、镱、锶、镝、铒等9种元素原子及其同位素冷却至10nK以下温区的核心技术工艺，可控原子数量及温区均为国内第一。</p>\n  <p>樊耀塬向硬氪表示，在技术壁垒上，「纳开量子」具备两大优势：一是国内唯一能将这么多种原子温度工程化地冷却至10nK以下的团队，原子温度越低，无规则热运动越容易被抑制，量子效应越显著，计算性能越优；二是拥有业界顶尖的光晶格技术，包括动态晶格、脉冲晶格及超晶格等，可实现高精度的超冷原子操控。</p>\n  <p>「纳开量子」的商业模式呈现“双轮驱动”特征。一方面，通过量子模拟计算机（专用量子计算机）的整机交付持续提供营收增长与现金流，实现自我造血；另一方面，同步推进通用量子计算机新架构的研发，瞄准中长期战略高地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_27adb5141e83441289858f69321a3090@6221844_oswg731438oswg1080oswg716_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纳开量子双轮驱动商业模型（图源/企业）</p>\n  <p>专用计算方面，公司已具备批量交付能力，向国内多家科研单位批量交付量子模拟实验平台、冷原子教学系统、MOT系统等产品。通用计算方面，公司重点攻关中性原子量子计算机的连续运行和高保真度门操作等关键技术瓶颈，瞄准中国首台多场景可实用的通用量子计算机。</p>\n  <p><strong>以下是硬氪与创始人樊耀塬的对话节选（经编辑）：</strong></p>\n  <p><strong>硬氪：中性原子路线近年较为火热，核心原因是什么？纳开的技术差异化在哪里？</strong></p>\n  <p><strong>樊耀塬：</strong>2022到2023年，哈佛背景的QuEra公司推出了一个把动态光镊和静态光镊结合的新架构，第一次真正做出了可编程的中性原子量子计算机雏形。整个行业的预期从“需要几十年”一下子拉近到十年左右。这也是我从学术转向产业的重要原因之一——量子计算工程化变得可能了。</p>\n  <p>跟很多中性原子公司不同的是，我们在做下一代架构：比起在物理比特数量甚至光镊阵列数量上刷新记录，我们公司更务实地在解决系统连续运行以及保真度提升这类关键问题。我们是国内唯一能把这么多种原子冷却到10nK以下并工程化的团队，这一技术对保真度的提升至关重要。另外，超冷原子也是专用量子模拟计算的硬性门槛，这形成了我们很深的技术护城河。</p>\n  <p><strong>硬氪：量子计算有超导、离子阱、中性原子多条技术路线，为什么纳开选择中性原子？</strong></p>\n  <p><strong>樊耀塬：</strong>目前主流就是这三条路线。离子阱最早，保真度能做到最高，但离子带电，存在长程相互作用，串扰严重，工程化非常复杂、烧钱。超导的优势是和半导体产业结合紧密，产业化做得最好，短期内可能还是主导路线。但超导的量子点是人为刻蚀的，一定会有缺陷，而在量子系统里缺陷会被无限放大。</p>\n  <p>中性原子的优势在于：每一个原子天生就是全同的，而且通过光晶格阵列，比特规模可以做到非常大——超导做到几十个比特就很难了，中性原子能轻易做到上千甚至上万个。这是它这两年突然火起来的最重要原因。</p>\n  <p>但中性原子也有明显短板。评判一个量子系统好不好，主要看三个维度：比特数、保真度、运行时间。中性原子只在比特数上有压倒性优势，保真度不如离子阱，运行时间更是只有几百毫秒就得重启一次。所以我们公司重点就在啃这两块硬骨头。一旦把这两个短板补齐，中性原子一定是最优路线，没有之一。</p>\n  <p><strong>硬氪：公司目前营收主要来自科研市场，如何看这个市场的天花板？未来向工业界拓展的路径是什么？</strong></p>\n  <p><strong>樊耀塬：</strong>科研市场其实并不小，像国仪量子这类公司也是以科研市场为基础走到IPO。更重要的是，目前国内在超冷原子专用量子模拟计算这个细分方向，能够提供整机交付的只有我们，相当于垄断地位。</p>\n  <p>工业界的拓展是我们的下一步重点。专用量子计算可以用于材料研发、制药、半导体仿真等场景。我们已经在和一些企业对接。但工业应用需要我们对算法和软件做针对性研发，这是一个自然延伸的过程。先通过科研市场把产品和工程能力打磨成熟，再往工业场景下沉，路径是清晰的。</p>\n  <p><strong>投资方观点：&nbsp;</strong></p>\n  <p><strong>高瓴创投（GL Ventures）表示</strong>，量子计算正从科学验证走向工程化攻关与产业化探索，能够实现稳定整机交付、持续提升系统可扩展性和可用性的团队，将在下一阶段竞争中占据重要位置。中性原子路线在规模化、可操控性等方面展现出较强潜力，是量子计算值得长期投入的重要方向。纳开量子依托北京大学在超冷原子与量子计算领域的深厚积累，团队兼具前沿科研能力、工程实现能力和产品化能力，在核心技术、工程体系和产品交付上持续探索，值得长期关注。</p>\n  <p><strong>英诺天使基金表示</strong>：纳开团队依托北京大学超冷原子实验室，打造了超冷原子量子技术全链条的产品生态，覆盖量子教学仪器，专用量子计算机与通用量子计算机等。技术指标位居世界前列。年内将推出超千比特连续装载量子计算机。英诺看好团队在中性原子领域数十年的深厚积淀，以及樊博带领的北大博士团队的研发实力，将助推早日实现量子计算规模商用。</p>\n  <p><strong>长石资本</strong>：量子计算作为未来终极计算方式，其商业化应用潜力巨大。长石资本坚信，随着相关政策的支持和市场资金的投入，未来中国将会出现一批优秀的量子计算上市企业。长石资本依托自身产业资源和高校科研资源，已经在量子计算投资多家头部企业。中性原子作为量子计算的新兴技术路线，凭借极强的可扩展性，正呈异军突起之势。纳开团队依托北京大学在冷原子领域深厚的技术积累，已展现出行业黑马之姿，未来有望成长为中国中性原子路线的领军企业。长石资本也将持续在产业资源对接、人才引荐等方面为团队提供全力支持，助力企业加速发展。</p>\n  <p><strong>飞图创投</strong>：飞图长期看好量子计算在未来前沿科技中的重要地位。目前量子计算的各个技术路线并未完全收敛，中性原子凭借高可扩展性、长相干时间、低纠错成本等优势，正从实验室走向工程化落地，是最有望率先实现实用化量子算力的路径之一。纳开启元团队具备顶尖学术与工程能力：由北大优秀毕业生樊耀塬博士领衔，核心成员大多数为北大毕业的博士硕士，团队发表160 + 篇高水平论文、出版2 本专著，主持十余项国家级课题。在超冷原子制备与工程交付上经验丰富，壁垒深厚。而超冷原子制备恰恰又是中性原子技术路线的第一性基础。纳开团队在冷原子制备、原子俘获、原子重排、里德堡量子门操控、纠错与扩展方面都有极强的工程化经验。纳开启元已完成专用量子计算机的实际交付，并计划于今年末至明年初发布业界领先的通用量子计算机。因此，我们坚定布局这一兼具技术确定性与团队硬实力的优质标的。</p>", "category": "tech", "published_at": "2026-07-02T01:16:49+00:00", "fetched_at": "2026-07-02T02:50:21.117424+00:00", "fingerprint": "dea24cb6436a5c41"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前大疆科学家创业，半年内连获四轮数亿融资，耀途资本、锦秋基金等押注", "url": "https://36kr.com/p/3877830625046535?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，聚焦通用空中智能的硅羽科技（SPARO）半年内已连续完成四轮数亿元融资，在种子轮耀途资本之后，锦秋基金、阿里巴巴、弘毅投资、普洛斯隐山资本、云时资本相继入局。资金用途方面，现阶段融资将主要⽤于扩充关键岗位的团队建设、推进产品线的商业化落地与规模化交付，以及加速技术平台的持续迭代。</p>\n  <p>硅羽科技成立于2026年2月，专注于通用空中智能，致力于推动飞行器从传统遥控工具，进化为能够理解环境、思考决策并自主完成任务的空中智能体。</p>\n  <p>硅羽核心团队来自全球顶尖研究机构及大疆、华为等头部企业，拥有十余年前沿技术积累与产业化经验。公司构建了多模态感知、端到端小脑、世界导航模型大脑以及灵巧作业与集群协同全栈技术体系，让飞行器进入无GPS信号、弱光、动态变化等复杂环境中完成任务，并实现跨场景、跨平台、跨形态应用。</p>\n  <p>硅羽科技创始人张富则是典型的“学术+产业”复合型人才。他入选Clarivate全球前1%顶尖科学家，在ScholarGPS近五年全球机器人学者影响力排名中位列全球第五、华人第一，现任香港大学终身副教授、MaRS Lab负责人。</p>\n  <p>学术之外，他曾任大疆高级顾问科学家8年，深度参与大疆等行业头部企业的核心技术研发与产品化落地，涵盖飞控系统、多传感器融合、激光雷达等多个关键方向，开发的相关开源技术被宇树、美团等数十家企业验证使用。</p>\n  <p>从行业发展来看，飞行器行业的上半场比拼的是工程成熟度与性价比，头部企业已将这两个维度推向极致。但在张富看来，行业的真正下半场才刚刚开始，核心变量正从硬件参数转向自主能力。</p>\n  <p>“现在的无人机也能干活，但它只能干‘观察’的活，搭载相机、激光雷达去看，没办法真正改变环境。”张富向硬氪表示，“可操作意味着它能够干预这个世界。”</p>\n  <p>在他看来，当下市面上并不存在真正智能化的飞行器，“因为它很难。”</p>\n  <p>而张富选择这一赛道，正是基于两个底层判断：“这个事足够难，也就意味着足够有壁垒。无人机受限于重量尺寸功耗，要把感知、决策能力集成在一块很小的芯片上，难度远超地面机器人。”</p>\n  <p>另一个原因则关乎商业本质：“空中智能体去的是人去不到或人很难去的地方，这种属性意味着它天生具有不可替代性。”</p>\n  <p>硬氪了解到，硅羽科技的核心技术壁垒，在于一套覆盖感知、小脑、大脑与数据的全栈自研架构：</p>\n  <p>感知方面，硅羽科技的多模态融合感知方案，将激光雷达、视觉、惯导等多源信息深度耦合，在无GPS条件下实现厘米级定位，在暗光、浓烟等退化场景中保持稳定感知。算法减少了对特征提取的依赖，更好适配弱纹理、光照剧变等复杂场景，计算效率较传统方案提升十倍以上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_29d41b66367f47e6b55f35a6f4aa1c37@6221844_oswg550778oswg1068oswg612_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;对陌生环境实时建模理解（图源/企业）</p>\n  <p>决策方面，基于端到端小脑，硅羽科技将避障响应延迟压缩至5毫秒以内——人类飞行员的反应时间约为百毫秒。这意味着飞行器在20米/秒的高速飞行中，仍能对动态障碍做出实时判断和规避。</p>\n  <p>大脑方面，硅羽科技正构建基于World Navigation Model的通用飞行器大脑。传统SLAM解决“我在哪、周围什么样”的问题，而World Navigation Model解决“这个空间如何运作、接下来会发生什么”——飞行器不只是建图，而是理解空间的几何结构、语义属性和动态变化。真机采集的数据在仿真环境中完成迭代训练，再部署回真实世界，形成“越飞越聪明”的数据飞轮。</p>\n  <p>还有灵巧作业与集群协同方面，飞行器像鸟类一样学会抓握、栖息、碰撞调整，能与环境产生物理交互。同时通过分布式架构实现千架级集群协同。从单体灵巧操作到群体智能，具备空中规模化作业能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_07b52edf9dd5409f9491a0adedb98bde@6221844_oswg189444oswg976oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">产品在室内工作（图源/企业）</p>\n  <p>张富告诉硬氪，成立仅半年，硅羽科技已积累数十家种子客户与合作伙伴，包括无人机、物流配送企业等。</p>\n  <p><strong>以下是硬氪与硅羽科技创始人张富的对话（经编辑）：</strong></p>\n  <p><strong>硬氪：空中智能体这和传统无人机的核心区别是什么？</strong></p>\n  <p><strong>张富：</strong>与传统无人机相比，我们有三个核心区别：一是通用性，要跨场景跨平台，在室内、地下、近地超低空都能飞；二是会思考，不需要人遥控，能自己推理世界、做决策；三是可操作，不仅能看，还能干预环境，比如做修复、清洗这类工作。</p>\n  <p><strong>硬氪：如何看待和大疆这类头部企业的关系？</strong></p>\n  <p><strong>张富：</strong>大疆是无人机领域的标杆企业，定义了成熟的飞行平台，但我们在做的是增量市场和新品类，两者并不是简单的同类替代关系，而是在飞行器智能化演进中的不同侧重。我们的特点主要在三个方面：原始技术创新能力，尤其是源头技术；前沿技术转化为量产产品的落地能力；以及过去十年积累的核心技术。</p>\n  <p><strong>硬氪：接下来两三年的规划是什么？</strong></p>\n  <p><strong>张富：</strong>产品布局主要分为两条，整机率先在真实环境中跑通从感知到任务执行的完整闭环，验证全链路可靠性。空中智能模块则将定位、感知、导航和避障能力轻量化封装，即插即用地赋能多旋翼、eVTOL、固定翼���各类飞行平台。</p>\n  <p>更重要的是建立生态。通过整机验证能力、模块复制能力以及面向开发者和生态伙伴的S2R仿真平台，构建一个空中智能体从技术研发到规模化落地的完整基础设施。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>（种子轮独家投资方）耀途资本表示：</strong>张富老师团队由全球稀缺的、同时掌握多模态SLAM底层算法与无人机整机端到端系统能力的顶尖学者构成。FAST-LIVO已经成为全球机器人领域事实上的工业基准之一。当前空中具身最大的瓶颈，是在复杂环境里实现自主感知，而这恰恰是张老师团队的技术强项。我们看好硅羽科技把顶尖学术成果工程化、产品化的能力，期待公司打造出真正面向真实作业场景的通用空中智能底座。</p>\n  <p><strong>锦秋基金表示：</strong>锦秋已经投资了超过十家具身智能相关的公司，而硅羽的独特定位则是在2m以上的广阔空间的感知-理解-任务执行。就像AI给机器人领域带来的范式变化，我们也非常相信随着多模态的感知、导航再到“飞行智能体”的自主思考、任务执行，也会很快到来。在港大见完张富老师我们在十天内完成了决策，我们笃定AI技术会成为无人机领域的新变量，从而带来新的巨大的机会，而张富老师是我们在这个蓝海的领域里见到的全球顶尖的学术团队，在产品化和商业化的迭代速度也让我们印象深刻。</p>\n  <p><strong>弘毅投资投资总监谷雨：</strong>作为硅羽科技的早期投资方，我们看重的不只是一个新硬件产品，而是团队在飞行智能体底层技术上的系统性积累。张富教授及 HKU MaRS Lab 团队长期深耕空中机器人，在多模态感知融合、高精度定位建图、端到端导航与控制等方面形成了领先能力，并具备将前沿研究转化为可量产产品的工程经验。我们相信，下一代飞行平台会从“被控制的设备”走向具备自主感知、实时决策和可靠执行能力的智能系统。硅羽科技正在把这些核心技术带入真实场景，推动飞行机器人从技术验证走向规模化应用，我们期待团队持续定义这一代飞行智能体的产品形态和产业价值。</p>\n  <p><strong>普洛斯隐山资本表示：</strong>我们长期看好空中具身智能领域的发展机遇，其代表空间通用智能的演进方向，重构低空产业范式。硅羽科技团队拥有空中智能体领域全球领先的学术研究能力和卓越的产业化经验。依托普洛斯物流和算力基础设施生态及隐山资本的产业资源，我们期待通过“资本+产业”协同赋能，助力硅羽科技开启具身智能+无人机的新纪元。</p>\n  <p><strong>云时资本投资人李想表示：</strong>我们长期关注空天地海各层级的颠覆性创新机会，置身于AI与物理世界的交融奇点，硅羽将低空经济和具身智能融合，通过学习驱动的新范式重塑自主无人机的飞行轨迹与全流程复杂操作。创始人张富及核心团队在软硬耦合的前沿科技领域拥有多次-1到100从科研到爆款落地的稀缺能力，已经将无人机在未知、复杂物理三维空间中的感知能力推向极致。我们将一路同行，支持团队不断破局，将更小、更智能、集群化的空中智能体推向千家万户，定义新时代的通用空间控制轨迹。</p>", "category": "tech", "published_at": "2026-07-02T01:33:33+00:00", "fetched_at": "2026-07-02T02:50:21.117418+00:00", "fingerprint": "c8c6a7c871c9b33e"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 清华、中科院团队联合华西医院研发康养转运机器人，进一步布局居家养老场景", "url": "https://36kr.com/p/3877863381741577?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，深圳可立点科技有限公司（以下简称“可立点科技”）近日完成战略融资，由力合科创领投，江苏中科智能科学技术应用研究院旗下平台跟投。本轮融资将主要用于产品研发迭代、核心团队建设及商业化落地推进。</p>\n  <p>可立点科技总部位于深圳，<strong>是一家聚焦“AI+机器人”养老场景的科技公司，围绕银发群体布局家庭陪伴与院内康复两大产品线。</strong>目前，公司已推出面向居家养老场景的主动陪伴机器人，以及与四川大学华西医院联合研发的康复助行转运机器人，两款产品均已完成工程样机开发，正在推进小批量试产和商业化。</p>\n  <p>随着人口老龄化持续加深，银发经济正成为重要的新兴市场。业内预计，2035年我国银发经济市场规模有望突破30万亿元。在“积极应对人口老龄化”国家战略和相关支持政策推动下，康养机器人也成为增长较快的细分方向之一。</p>\n  <p>其中，<strong>与四川大学华西医院联合研发的GR-150康复助行转运机器人</strong>，主要面向医疗机构和康养机构场景，基于高精度SLAM定位导航与多传感器融合技术，可实现室内自主导航和无人化移动，为失能、半失能患者提供智能转运和移动辅助服务。目前，公司已拥有相关自主知识产权，累计布局数十项专利及软件著作权，并正在申请中国医疗器械二类注册。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_d822f015fb6843539d7ba3dcc5ed901c@5920579_oswg92507oswg674oswg379_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>面向家庭场景推出的第二代居家养老陪伴机器人</strong>，定位为家庭智能陪伴助手，集健康监测、情感陪伴、认知辅助和安全巡检于一体。产品支持主动交互，可识别用户回家、进行语音问候、夜间跟随陪伴，并具备跌倒检测和异常报警能力。同时，机器人配备交互式屏幕，可播放视频、音乐、提醒服药。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260702/v2_a00e6c255dbf44ab8692aa6d8fb037c4@5920579_oswg311304oswg651oswg488_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>底层技术方面，产品围绕老年用户需求进行了针对性研发。针对老年人语速慢、发音不标准、语句重复以及方言使用等特点，公司自主优化了NLP/NLU引擎，提升语音理解能力；健康监测方面，结合生物雷达或红外热成像技术与AI算法，实现睡眠呼吸暂停筛查、心率变异性分析等健康预警功能；在人机交互方面，通过融合语音情感识别、文本情感分析及面部微表情识别，构建多模态情感计算模型，以提升陪伴体验。</p>\n  <p>据公司介绍，陪伴机器人产品目前已获得部分养老院、保险公司及渠道代理商的采购意向。按照规划，<strong>公司预计于2026年第三季度完成产品最终定型，第四季度启动小批量量产，并于2027年逐步实现规模化营收。</strong></p>\n  <p>团队方面，可立点科技创始人兼董事长王禹衡拥有国际投行及连续创业背景，福布斯中国最具影响力华人精英Top100，曾就职于国际投资银行5年，后曾创立加拿大外卖平台Nomme（后被DoorDash收购）以及AI社交点餐平台ClickDishes（已被收录于哈佛商学院商业案例）。主要负责公司战略规划、融资及全球化布局。</p>\n  <p>公司CEO兼CTO张腾腾为清华大学博士后、哈尔滨工程大学博士，中科院硕士，长期从事模式识别、机器人感知与决策控制、移动机器人及AI深度学习研究。联合创始人兼首席科学家宫新一为杭州电子科技大学教授、中国科学院硕士博士、清华大学本科，在智能控制与机器人领域具有长期科研积累，为公司的技术研发提供学术与技术支撑。</p>\n  <p><strong>以下为硬氪与创始人王禹衡交流节选：</strong></p>\n  <p><strong>硬氪：老年陪伴赛道目前已经有不少玩家，你们的优势是什么？</strong></p>\n  <p><strong>王禹衡：</strong>&nbsp;我们认为，目前市场上的很多产品仍以单一功能为主，例如健康监测、生命体征采集等，大多依赖穿戴设备实现。而我们的定位并不是做一款单独的监测硬件，而是一个家庭智能管家型机器人，成为连接各种智能设备和服务的核心入口。</p>\n  <p>未来，无论是健康穿戴设备还是智能家居，都可以与机器人联动。机器人既能够完成健康监测、风险预警等功能，也能够依托接入的大模型系统，与老人进行自然交流、提供情感陪伴，并回答日常生活中的各种问题，例如天气查询、生活建议等，实现陪伴、交互和管理能力的融合。相比聚焦某一垂直场景的产品，我们更强调开放融合的平台能力，希望把机器作为家庭中的智能中枢。</p>\n  <p>其次，公司的核心创始与技术团队来自清华大学和中国科学院，在算法和底层技术研发方面具备较强实力。再次，我们非常重视产品设计和用户体验。目前展示的产品仍属于功能验证样机，未来将在工业设计、交互体验和情感化表达等方面持续投入，让机器人真正融入家庭生活。</p>\n  <p>我们判断，人形机器人大规模落地家庭场景仍有很长一段时间，我们研发的陪伴机器人将能够更快更早进入家庭场景，为老人提供更接地气更实际的服务，成为家庭机器人智能化升级过程中的重要过渡产品。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>力合科创表示：</strong>可立点科技是我们在银发经济与具身智能交叉赛道上发现的一支极具潜力的团队。创始团队兼具清华系AI技术功底和国际化商业视野，核心产品与华西医院的深度合作更体现了其临床落地的扎实路径。我们看好康养机器人在中国老龄化加速背景下的巨大市场空间，期待可立点科技成为这一领域的领军企业。</p>", "category": "tech", "published_at": "2026-07-02T02:07:44+00:00", "fetched_at": "2026-07-02T02:50:21.117405+00:00", "fingerprint": "d015057cf386ebef"}, {"source": "少数派", "title": "年度报告不够看？微信读书 Skill 上手体验", "url": "https://sspai.com/post/109932", "summary": "人对自己或许会偶尔不诚实，但你的书架是很诚实的。<a href=\"https://sspai.com/post/109932\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-01T02:27:40+00:00", "fetched_at": "2026-07-02T02:50:19.557203+00:00", "fingerprint": "a3059a3dd4994f0b"}, {"source": "少数派", "title": "[送码] 白描 App 的 9 周年：推出鸿蒙版，白描 PDF 共创首发", "url": "https://sspai.com/post/111640", "summary": "2017年6月21日，白描App按下了发布键。那时的它还很简单，甚至有些单薄：拍下一张图片，识别里面的文字，再复制出来。它最初想解决的，也只是一个非常具体、非常日常的小烦恼：帮女朋友把读书笔记从照片里 ...<a href=\"https://sspai.com/post/111640\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-01T07:03:51+00:00", "fetched_at": "2026-07-02T02:50:19.557198+00:00", "fingerprint": "7f3f37e472fa67e3"}, {"source": "少数派", "title": "声擎×少数派｜「角落新声」征文活动", "url": "https://sspai.com/post/111709", "summary": "那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅，是如何被你切片、重排并注入新生的？<a href=\"https://sspai.com/post/111709\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-01T09:30:00+00:00", "fetched_at": "2026-07-02T02:50:19.557192+00:00", "fingerprint": "40892d1f85e594ff"}, {"source": "少数派", "title": "派早报：WhatsApp 开放用户名预留、PS 将取消实体光盘等", "url": "https://sspai.com/post/111861", "summary": "Gmail Live 进入测试阶段、大我推出 B251 PRO 显示器等。<a href=\"https://sspai.com/post/111861\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-02T00:34:51+00:00", "fetched_at": "2026-07-02T02:50:19.557182+00:00", "fingerprint": "9d91d4460dc122b6"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.6823 CNY ↑+0.19%", "url": "https://www.frankfurter.app/2026-07-01?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-07-01</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.6823 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0091 (+0.19%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-07-02T02:50:18.452390+00:00", "fingerprint": "f47b217e87e2af6e"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
