<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

0", "fetched_at": "2026-08-22T00:57:35.884312+00:00", "fingerprint": "7c3227e89061b9d2"}, {"source": "The Verge", "title": "TikTok will pay $400 million to settle DOJ child privacy lawsuit", "url": "https://www.theverge.com/tech/983531/tiktok-settle-doj-lawsuit-coppa", "summary": "The US Department of Justice announced on Friday that TikTok will pay $400 million to settle a lawsuit filed in 2024 over allegedly violating the Children's Online Privacy Protection Act (COPPA). In the lawsuit, the DOJ alleged that TikTok collected data from children without notifying parents or obtaining consent and did not delete the accounts [&#8230;]", "category": "tech", "published_at": "2026-08-21T22:13:34+00:00", "fetched_at": "2026-08-22T00:57:35.884306+00:00", "fingerprint": "8ae89ac8295241aa"}, {"source": "The Verge", "title": "HoverAir’s transforming modular drone has already been halted in the US", "url": "https://www.theverge.com/tech/983500/hoverair-versa-halted-us-fcc-drone-ban-indiegogo", "summary": "I am so sorry, fellow US gadget fans: the FCC's drone ban appears to have struck again. The HoverAir Versa - a baby steadycam with snap-on propeller wings that transform it into a drone - has already stopped taking US orders just three days after its Indiegogo debut, and may be forced to abandon shipping [&#8230;]", "category": "tech", "published_at": "2026-08-21T22:14:11+00:00", "fetched_at": "2026-08-22T00:57:35.884296+00:00", "fingerprint": "eaac9111649bb58a"}, {"source": "36氪 - 最新文章", "title": "36氪2024年度中国最具影响力产业投资暨十大领域年度名册｜正式发布", "url": "https://36kr.com/p/3949029563677824?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_c28e1c45300a4e55965726e554aeb1f1@5352461_oswg49093oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <blockquote>\n   <p>向内求。</p>\n  </blockquote>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5d5baccdf58f493d9c63cc74118d7016@5352461_oswg300oswg1080oswg57_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>出品｜</strong>36氪创投研究院</p>\n  <p>2024年，全球经济格局正在经历深刻调整，世界产业链的格局也在急剧转变中。在环境变革的持续影响下，中国风险投资乃至整个金融市场，都处在一个漫长的调整期。</p>\n  <p>这一点，从募资、退出数据上就可见端倪：2024上半年新募集基金数量和募资规模均大幅下降，分别接近50%和23%，且其中大笔基金来源以国资、地方政府、产业龙头为主，携带着精准服务区域招商引资、严格把控风险、支持中小企业和科技创新发展等要求。</p>\n  <p>退出难度也一并升级。IPO方面持续收缩，上半年中企IPO数量82家，同比下降62%，其中获得VC/PE支持接近共55家企业。这个数字在2023年上半年是139家。而被给予厚望的“并购”和“S交易”，实际在操作层面也是步履蹒跚。</p>\n  <p>在以国资主导的当下，风险投资早就不仅仅是为超额收益而存在，而是背负了更多元的意志。</p>\n  <p>6月19日，国务院办公厅印发《促进创业投资高质量发展的若干政策措施》指出，发展创业投资是促进科技、产业、金融良性循环的重要举措。其中涉及的私募基金监管规范化、多层次资本市场高质量发展以及新质生产力的加速培育，对当下匍匐前行的机构们、提出了新的历史任务。</p>\n  <p>在此背景之下，投资机构不但要在寻常“募投管退”运作中不断精进自身，还需要从全局出发、形成强有力的“产业生态”影响力、号召力；从内到外、由浅至深的建立基于ESG理念的投资脉络……与此同时，协助被投企业渡过难关也是应有之义，尤其当下所涉及的供应链安全、数据安全、跨境产业链整合与运营等等棘手问题。</p>\n  <p>部分头部双币基金拆分本土团队、设立独立品牌，在本土市场全面聚焦“科技创新”前沿产业，例如人工智能、具身智能等；完全本土基因的机构们，则是收敛选择、持续深耕先进制造、芯片/半导体、医疗健康、新能源/新材料等等领域；而背靠产业龙头企业的CVC们则是向产业纵深走去，提振整个产业在国际化竞争中的地位。</p>\n  <p>这或许是历史上最为冲突又混乱的一段时期：关键性科学技术在疯狂更迭、日新月异，产业变革正在悄然发生，玩家们在困境中寻找一线生机。</p>\n  <p>至此时刻，基于“36氪股权投资市场在线调研系统”（https://touzi.36kr.com/）收集的申报者们在“募投管退”环节的整体表现，具体包括：1）管理规模；2）近3+1年的投资活跃度、明星项目情况、portfolio公司后续获得新融资的项目数量；3）退出回报水平；以及4）在各个关键产业（ESG投资）的影响力等细分维度。</p>\n  <p>评选出2024年36氪“中国最具影响力产业投资基金”、“中国十大领域产业投资基金/投资人”，“中国最佳ESG投资实践投资机构”。</p>\n  <p>以下是全名单：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_502b869ad5774005b5d5fbd211614d8a@5352461_oswg469969oswg1080oswg5905_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_c850906877ab48159992fa9b2ed90e8f@5352461_oswg242812oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_1d48caa0e8e245b8aa21cfc17998565f@5352461_oswg263407oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_10d8cc01d5724bccbb1752e4bc9d37f3@5352461_oswg237674oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_002aa3593c2c4d5480d53c67355fe36b@5352461_oswg252746oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5b2b8974d16740c2bd8e28d215768b0b@5352461_oswg232834oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_781be5febd7f450cb481d29498fbad85@5352461_oswg255866oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_4e31338bf19549c4ac6fd22b32ac8bdd@5352461_oswg236142oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_084b66d8b08f4dfbb19a608606c1524d@5352461_oswg260205oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5033b539691741cfb20f389d255f94b6@5352461_oswg236655oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_ef3b36989bfd4ad1a7aa326a9b6c25b6@5352461_oswg258964oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_9a7dffd26dba493eb2ae77a1cdfabbe7@5352461_oswg235407oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_7d59d8f24ddc4a5293cb714bba52c839@5352461_oswg257954oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_3509f8022285415aa6c066da55c3c671@5352461_oswg232248oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_f1db242fc0c34a7396d5c2e408eabe5b@5352461_oswg253812oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_09388a36ac8643b9810cd0a8a2d90690@5352461_oswg234765oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_3431129b966b4498976344403ee301e5@5352461_oswg256333oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_e5ae653d3dbb42b18d03c82cf392be3a@5352461_oswg237422oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_0ad5480bc0074ced8ad6ec5b9e318a68@5352461_oswg259499oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5a4b494564434fc1b8a239daba8fc50a@5352461_oswg242765oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5297c02c7efc412fb36655aa98b85451@5352461_oswg261771oswg1080oswg2917_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_d93f172b31a245ef8121307525e53e82@5352461_oswg459361oswg1080oswg5905_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>与此同时，我们还向市场广泛征集，试图找到一群顺应市场变化、深耕产业的精品投行，评选出“中国最具影响力/成长力精品投行”、“中国最具影响力并购重组/企业融资精品投行”，以及“中国十大领域精品投行”。&nbsp;</p>\n  <p>主要评选维度包括最近3+1年内，并购/融资领域服务项目（轮次）数量、并购/融资涉及资金规模、明星项目数量、服务周期与效率。最终，我们找到了当下依然值得被关注的精品投行们。&nbsp;</p>\n  <p>以下是全名单：&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_15f9704f6ee84025af554663828bd72d@5352461_oswg138756oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_44aae6b96c8647ed883f40d64959c77e@5352461_oswg142841oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_6bf652d4c492464c940bb1bec9712c37@5352461_oswg107232oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_76b297952897420b940a46de2baa7448@5352461_oswg106200oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_b547452af88a4c9e9dd137745fd4af26@5352461_oswg86130oswg1080oswg1936_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_54515bccad94469e9a4280927868f2f0@5352461_oswg84021oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_dc7dee9d143e4c9ea9e9956150f04834@5352461_oswg84716oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_853c884d8ec049caada307e1c1a7fba8@5352461_oswg85310oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_4e0c814eda104b4d8cb78e5c9317680b@5352461_oswg85946oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_e7222f36b5dc434a8fe66346594fb019@5352461_oswg84846oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_c93338c819014587ae6f7fd641c0b4f0@5352461_oswg86300oswg1080oswg1936_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_c3977d9aad4447eb923e3913a79364a8@5352461_oswg86120oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_5b0a19f60a7847b8ab032a0022182a12@5352461_oswg83887oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_98e2b1b3972a4c8f8eab5cece3f884d3@5352461_oswg84993oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_83ec655cc0744d27b6d14e41825c9eeb@5352461_oswg1954oswg1080oswg87_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-08-21T09:32:38+00:00", "fetched_at": "2026-08-22T00:57:35.787841+00:00", "fingerprint": "39742a276b6d2b6b"}, {"source": "36氪 - 最新文章", "title": "卫星终端量产、数据平台开放，「天行探索」完成数千万天使+轮融资｜36氪首发", "url": "https://36kr.com/p/3948924484107395?f=rss", "summary": "<p>36氪获悉，卫星互联网连接与数据服务提供商北京天行探索科技有限公司（以下简称“天行探索”）<strong>已完成数千万天使+轮融资，由陆石投资和梅花创投共同出资。这也是陆石投资继天使轮独家投资后的连续加注。</strong></p>\n  <p>本轮资金将主要用于产品研发与生产，以及多体制融合中试平台和软件平台的搭建，重点强化团队设计、开发、测试三个环节的能力。</p>\n  <p>天行探索成立于2025年4月，是36氪长期关注的企业。创始人告诉36氪，公司<strong>高轨高通量和低轨物联网终端均已进入批量生产和销售阶段</strong>，目前主要收入来自终端硬件销售，其中交通（车载、越野、户外）场景贡献了90%以上的营收。</p>\n  <p>海外业务也开始产生实际收入：设备月均销售千套，形成了相对稳定的客户群体。团队也正在为无人船、无人艇进行定制化卫星通信产品测试，预计年底前逐步进行海洋业务的市场拓展。</p>\n  <p>此外，<strong>天行探索目前正在与奇瑞、比亚迪、长安等多家具备越野属性和有海外业务布局的车企推进合作</strong>，短期内将以软件前装和硬件后装精品模式先行渗透，硬件前装合作也将随着车型适配的验证测试逐步推进。</p>\n  <h2><strong>一年三步走：上新、量产、扩张</strong></h2>\n  <p>过去一年，天行探索在产品生产研发、组织规模、资源整合等多方面都取得了一定进展。</p>\n  <p>组织布局上，先后在青岛、哈萨克斯坦、深圳三个区域新设立了分支机构：加上此前已有的成都团队，形成了“北京运营中心+成都研发中心+多个场景/区域业务主体”的结构。</p>\n  <p>在资源层面，先后与中国卫通、铱星中国、时空道宇、长光卫星等卫星资源方开展战略合作。</p>\n  <p>产品侧进展最为显著。</p>\n  <p>去年10月，天行探索发布卫星终端原型产品；今年4月，高轨高通量和低轨物联网硬件终端分别进入批量生产和销售阶段。软件方面，行者Adventure APP今年5月起正式对外公测，目前注册用户数千个，近期日新增注册量持续走高。车机版软件也已同时对外发布。今年6月，运营服务平台正式上线。</p>\n  <p>在创始人看来，产品进展的背后，是团队交付速度和落地能力的体现。在不到一年时间内完成两轮产品迭代并推动批产，这种从定义到落地的全流程能力，叠加应用层赛道逐步明确的机会，也正是机构愿意在这一阶段继续加注天行探索的原因。</p>\n  <h2><strong>硬件做入口，平台做生态</strong></h2>\n  <p>经过一年开发迭代，天行探索逐步形成了“硬件终端+软件应用+数据平台”的完整架构。</p>\n  <p>硬件端分为三个层级——面向后装市场的便携终端“行者mini”、支持高轨高通量卫星通信的高性能终端“行者Pro”、面向车规级前装的“行者S-BOX”控制盒。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_33873ce4c2fc4994a890edf0f430886a@6413691_oswg132390oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">便携终端“行者mini”</p>\n  <p>软件端包括手机APP和车机APP，可与硬件互联实现定位、轨迹和报警数据的实时回传；也可脱离硬件独立运行，提供线路规划、组队通信、精品路书等功能，以更低门槛触达用户。目前，APP端仍以免费策略获客，未来将通过数据增值服务实现付费转化。</p>\n  <p>数据层则由“行者Horizon平台”作为支撑，通过整合多星座资源，为车载场景提供路况预测、预警提示和决策支持等增值服务。</p>\n  <p>在天行探索的设想中，<strong>Horizon平台的定位并不仅局限于服务自有产品，而是更具开放性的应用共享生态入口。</strong></p>\n  <p>平台从设计之初就预留了标准化API接口，便于第三方终端产品按统一规范快速接入。这意味着，用户未来无需再为选择哪家星座、适配哪类网络而困扰，只要接入Horizon平台，就能在同一个服务体系中获得连接能力。</p>\n  <p>不过这一目标的实现仍需时间。目前不同星座之间的底层接口尚未打通，天行探索的策略是自上而下、逐步推进——先打通部分星座的上层协议，让用户在应用侧使用起来；随着客户规模和商业闭环的形成，再逐步向物理层深入，最终实现真正意义上的跨星座通信与服务。</p>\n  <h2><strong>不只解决0到1</strong></h2>\n  <p>卫星通信领域的门槛不仅在于达成某项底层协议，更大的挑战是如何让已有技术在真实场景中可靠地工作。</p>\n  <p>这也反映在天行探索自身的实践路径上。</p>\n  <p>自2025年10月以来，天行探索先后参与了阿拉善英雄会、N35穿越、环塔拉力赛、青戈赛等多场赛事活动的通信保障工作。目前，团队已跟随赛方及各大车队完成了约20万公里的实路测试，在持续颠簸、极端温差的环境中反复测试对星算法和传输稳定性，并在发现问题后远程即时调优算法，再重新投入验证使用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_336b9aefc29e425cbb80a63297bc9e12@6413691_oswg164138oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">硬件终端在沙漠环境中进行测试</p>\n  <p><strong>“只有不断地深入场景，不断地打磨产品，才能在卫星互联网应用领域解决更多从1到10、从10到100的问题。”</strong>创始人认为，类似的场景化精细打磨，是传统卫星终端厂商相对薄弱的环节，也是天行探索的差异化所在。</p>\n  <p>但产品可靠只是第一步。如果只解决“连上天”的问题，卫星通信将仍是小众低频的赛道。</p>\n  <p>天行探索对卫星互联网应用产业的判断是：2027年前后进入网络运营期，2030年进入信息增值期。届时，竞争的核心将不再是用哪家的终端，而是建立连接之后，能在网络上跑什么数据、给用户提供何种价值。</p>\n  <p>基于此，天行探索将商业模式拆解为四层：硬件终端、流量运营、场景增值和数据服务。</p>\n  <p>在创始人看来，天行探索未来的定位是产品定义者和提供商，<strong>核心是贯穿“连接—数据—场景”的一体化意识</strong>——在生产适配典型场景的硬件终端的同时，规划数据服务，通过整合通导遥数据、搭建生态平台，把连接能力转化为可规模化交付的服务能力。</p>\n  <p>目前，天行探索正在申请电信增值服务相关资质，计划于下半年开启新一轮融资。</p>", "category": "tech", "published_at": "2026-08-21T10:22:10+00:00", "fetched_at": "2026-08-22T00:57:35.787835+00:00", "fingerprint": "58ba79188dfd8e99"}, {"source": "36氪 - 最新文章", "title": "泡泡玛特要把去年赚的钱全分了", "url": "https://36kr.com/p/3949149310975362?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑</strong>&nbsp;<strong>|</strong>&nbsp;张帆</p>\n  <p>8月20日盘后，泡泡玛特交出了2026年中期答卷。</p>\n  <p>摊开财报来看，喜忧参半的底色十分明显：上半年营收171.7亿元，同比增长23.8%；经调整后净利润51.6亿元，同比增长9.5%。营收仍在增长，净利润增速却已滑落至个位数；毛利率69.7%，相较去年同期微降0.6个百分点。</p>\n  <p>资本市场用下跌回应这份成绩单。</p>\n  <p>财报次日，泡泡玛特股价跌超3%，总市值回落至1984亿港元。这与LABUBU火遍全球时、市值冲破4359亿港元的盛况，不可同日而语。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_a462a6fe1c114824b6521b42fd0ee6b8@394564713_oswg88636oswg729oswg446_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪截自财报</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_377ea5e914904c588729fa7eb87cb9a9@394564713_oswg44985oswg1056oswg579_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自Wind</p>\n  <p>如果拉一条时间轴，2025年的泡泡玛特还在狂飙——全年营收371.2亿元，同比增长184.7%。彼时公司创始人王宁表示，“感觉今年300亿很轻松”。</p>\n  <p>狂飙的代价则在2026年集中显现。</p>\n  <p>半年报业绩会上，王宁直言，今年是“经营调整年”，上半年的压力比预想的大，下半年压力只会更大，“大概率完不成年初定的20%的增长目标”。</p>\n  <p>这个“完不成”的预判，与单季度的数据形成对照。</p>\n  <p>今年一季度，泡泡玛特体收益同比增长75%-80%，中国市场甚至翻倍；但到了二季度则明显放缓。参考上半年整体增速，二季度的增速可能降至个位数。</p>\n  <p><strong>与之伴随的，是海外市场的“急刹车”。</strong></p>\n  <p>2025年，海外业务还是泡泡玛特最强劲的增长引擎：全年海外收入162.68亿元，同比增长292%，收入占比从31.8%提升至43.8%，美洲地区增速一度高达748%。</p>\n  <p>然而2026年上半年，海外业务营收49.72亿元，同比下滑11%。亚太地区收入25.8亿元，下降9.7%；美洲大跌16.5%至18.9亿元；唯有欧洲增长5.9%，实现收入5.1亿元。海外收入的占比也从去年全年的43.8%，骤降至约29%。</p>\n  <p>这背后的原因是多重的。</p>\n  <p>泡泡玛特首席运营官司德表示，去年海外的高增长很大程度由LABUBU拉动，大量新增用户缺乏潮玩文化认知，对品牌其他IP不熟悉；而海外团队多为去年新入职，“专业积淀甚至不及普通用户”。</p>\n  <p>更现实的痛点在于供应链。管理层在业绩会上提到，美国市场“能运过去的量很少，可能最终需要空运的费用又很高”。</p>\n  <p>销量下滑与运输的困难直接反映在存货方面。截至2026年上半年，泡泡玛特存货周转天数已从2025年末的123天升至201天。存货余额从54.7亿元增至61亿元。海外扩张的粗放式增长，正在回归精细化运营。</p>\n  <p><strong>IP结构的变化，是半年报的另一条暗线。</strong></p>\n  <p>LABUBU所在的THE MONSTERS家族，上半年营收44.5亿元，仍居第一，但收入占比已从2025年的38.1%降至26%，同比下降7.5%。这个曾以一己之力撑起泡泡玛特全球声量的超级IP，正在经历自然的生命周期回调。</p>\n  <p>接棒的是星星人。</p>\n  <p>上半年，泡泡玛特共有6个IP破10亿、11个IP过亿，IP矩阵的多元化确有进展。其中，星星人带来的营收达到26.5亿元，同比暴涨580.6%，收入占比从2.8%跃升至15.4%，成为集团第二大IP。</p>\n  <p>此外，CRYBABY、DIMOO、SKULLPANDA、Hirono小野等主流IP均保持双位数增长。司德尤其表示，SKULLPANDA、Hirono小野乃至Nyota、Peach Riot，都在欧美市场获得了不错的表现。</p>\n  <p><strong>2026年以来，泡泡玛特先后推出“Nyota小小瞬间”搪胶系列与“Nyota×樱桃小丸子”联名系列，也表明公司对“腰部IP”的持续投入。</strong></p>\n  <p>再从产品品类划分，毛绒玩具实现收入98.3亿元，同比增长60%，为集团贡献了57.2%的收入。手办类产品保持相对稳定，上半年实现销售收入51.9亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_ba880de0776f4211b8d9b560d777ce48@394564713_oswg887692oswg1268oswg568_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">泡泡玛特上半年新品；图片截自官方微博</p>\n  <p>不过隐忧同样存在。</p>\n  <p>今年上半年，MOLLY收入9亿元，同比大跌33.6%。这也是MOLLY这位“元老”，自2023年起首次跌出十亿阵营。</p>\n  <p>司德称，MOLLY会在年底或者明年上半年，有较大的突破性产品推出。“我们希望可以帮助MOLLY在传统产品线之外，让大家看到一些更亮眼的、不太一样的产品形式。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_1cb2f85f25e2437e9605fbbc946892a3@394564713_oswg116611oswg750oswg567_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪截自财报</p>\n  <p>市场观望的同时，泡泡玛特也需要“保卫利润”。</p>\n  <p>报告期内，公司毛利率为69.7%，较同期下降了0.6个百分点，主要由于海外收入占比下降，同时受国际局势不稳定因素影响，原材料成本上涨。</p>\n  <p>各项费用方面，上半年的销售费用及管理费用较去年同期增长了8.95亿元。原因在于，报告期内全球增加的105家线下门店。尽管经调整后，泡泡玛特的净利率仍维持在30%的水平。</p>\n  <p>而在今年下半年，泡泡玛特仍计划在海外市场开出更多新店。对于中国市场，升级焕新也会持续进行。但王宁强调——今年不会追求特别激进的、增收不增利的成长模式。</p>\n  <p>这意味着，泡泡玛特已将利润增长置于规模扩张之上。</p>\n  <p>此外，为了回应资本市场的焦虑，公司也将在未来6个月启动20亿至50亿元的股份回购计划。</p>\n  <p>这并非临时起意。今年3月业绩发布后，泡泡玛特股价下跌，公司也在6个交易日内连续回购近14亿港元。年初至今，泡泡玛特已累计回购约17.4亿港元。</p>\n  <p><strong>值得注意的是，粗略计算，叠加上半年执行的约32亿元的派息分红，泡泡玛特今年“分红加回购”的支出在67亿至96亿元之间。公司去年的净利润为127.8亿元，经营性现金流为108亿元。</strong></p>\n  <p><strong>换句话说，泡泡玛特要把去年赚的钱“全分了”，这家公司正在用“极高的股东回报”，稳住投资人的信任，对冲未来业绩的不确定性。</strong></p>\n  <p>综合来看，2026年中期的泡泡玛特，折射出的是公司处于高速增长换挡期的复杂光谱。在未来，星星人能否承接住压力、海外市场能否恢复元气、LABUBU大电影能否持续推进、泡泡玛特能否真正成为一家IP平台，还要在下半年乃至更长的时间揭晓。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_9d162da84c574d77a9bf79eb1fbcd7f8@394564713_oswg68085oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-08-21T11:29:24+00:00", "fetched_at": "2026-08-22T00:57:35.787828+00:00", "fingerprint": "2a3bee9454faa276"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜中科曙光超节点产品亮相安徽算力大会；广州市中级人民法院依法受理恒大地产集团有限公司破产清算案；科大讯飞：将于今年全球1024开发者节推出全新主力通用大模型", "url": "https://36kr.com/p/3946071687921026?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3948915740753287\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>苹果裁撤60名VR团队员工 战略重心或转向AI眼镜</strong></a></p>\n  <p>据报道，苹果已对Vision业务团队进行人员调整，至少60名隶属于Vision小组、从事VR相关开发的员工遭到裁员，苹果官方尚未对该消息作出回应。报道指出，本次裁员背后是苹果战略转向，该公司资源正流向AI智能眼镜，这款新品预计于2027年WWDC大会亮相，同年晚些时候上市。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948909849738376\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>马斯克称SpaceX目标到2030年每年发射约1万次，到2030年代末营收增长远超2000%</strong></a></p>\n  <p>马斯克周四在回应用户分享的关于美国政府计划到2030年实现每年1000次火箭发射的帖子时表示，SpaceX的目标是“到2030年实现星舰每日30次以上发射，换算成年度规模约为1万次。” 同一天，马斯克回应了另一位网友的帖子，后者预测到2030年代末，SpaceX的营收将增长2090%，特斯拉的营收将增长119%。马斯克回复称：“我知道现在听上去很疯狂，但我认为SpaceX和特斯拉的表现都会超出这些预期。”（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948826792115589\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>豆包：上线技能·连接器·工作伙伴</strong></a></p>\n  <p>36氪获悉，8月21日，据豆包消息，豆包工作任务模式上新，技能·连接器·工作伙伴/小队现已上线。据介绍，打开豆包电脑版侧边栏，选择“技能·连接器·伙伴”，即可体验。目前，豆包内已上架超200个技能和连接器，并支持自定义新建技能。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948811662539912\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>韩国互联网巨头Kakao拟分拆核心业务以加强AI能力</strong></a></p>\n  <p>韩国互联网巨头Kakao公司周五表示，计划将包括其热门即时通讯服务KakaoTalk在内的主要业务拆分为两个独立实体，以加强其人工智能（AI）能力。该公司在一份监管文件中表示，将公司拆分为KakaoAI和KakaoX的计划已在董事会会议上获得批准。Kakao计划于明年1月1日前完成分拆，并于1月27日重新上市KakaoAI。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948989558947203\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中科曙光超节点产品亮相安徽算力大会</strong></a></p>\n  <p>36氪获悉，8月21日，安徽算力产业生态大会期间，中科曙光无线缆箱式超节点scaleX40作为“算力产业新技术新业态成果”，在大会上重点展示。该超节点面向企业级AI场景，采用正交无线缆一级互联架构，单节点集成40张GPU，总算力超28PFLOPS，可将部署周期从数月缩短至数小时。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948769575566725\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>广州市中级人民法院依法受理恒大地产集团有限公司破产清算案</strong></a></p>\n  <p>36氪获悉，据广州市中级人民法院消息，8月21日，广州农村商业银行股份有限公司华夏支行以恒大地产集团有限公司不能清偿到期债务，并且资产不足以清偿全部债务为由，向法院申请对恒大地产集团有限公司破产清算。广东省广州市中级人民法院经审查认为，该申请符合《中华人民共和国企业破产法》第二条第一款的规定，于2026年8月21日裁定受理广州农村商业银行股份有限公司华夏支行对恒大地产集团有限公司的破产清算申请。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3949066882497926\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>追觅扫地机获欧睿认证：全球首创180℃蒸汽源技术</strong></a></p>\n  <p>近日，追觅扫地机获得欧睿国际权威认证，搭载的“180℃蒸汽源”技术系全球首创。据了解，追觅X60 Pro Steam扫地机可以在8秒内制备180℃蒸汽，通过四路加压喷射，让高温蒸汽充分作用于地面污渍，配合75℃热水洗拖功能，快速瓦解重油污、脚印泥渍等顽固污垢，让地面干净如新。截至目前，追觅已进入全球120个国家和地区市场，并在全球30个国家获市占第一，10个国家市场份额超50%。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3949065247227010\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>贵州茅台董事长陈华：适配真实消费、防止中间炒作的价格体系和机制已搭建完毕</strong></a></p>\n  <p>8月21日，贵州茅台召开2026年半年度业绩说明会，董事长陈华表示，今年以来，公司建立和完善“随行就市、相对平稳、供需适配、量价平衡”的动态价格调整机制，7个月来已经进行五次市场价格动态调整，产品零售价格接轨市场零售价。目前，茅台酒主力产品在“i茅台”对社会开放销售，全系产品在全国43家自营店向社会开放销售。至此，能够适配真实消费、防止中间炒作的价格体系和机制已经搭建和塑造完毕。（证券时报）</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3948746932583555\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>五一视界与联合影像成立合资公司，推出AperData产品</strong></a></p>\n  <p>36氪获悉，五一视界与联合影像成立合资公司深圳万物临场智能科技，聚焦具身智能数据基础设施。合资公司发布软硬一体数据平台AperData，贯通数据采集与训练交付，发布两日订单超1万套，首批产品将于8月底量产交付，并进一步拓展智驾、具身及空天领域。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3948941687225736\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>全新深蓝G318上市</strong></a></p>\n  <p>36氪获悉，8月21日，深蓝汽车在2026成都国际车展上正式发布全新深蓝G318。新车提供华为乾崑与天枢领航两套智能辅助驾驶系统，共推出四驱舒享天枢版、四驱舒享乾崑版、四驱空悬乾崑版三款配置车型。与此同时，\"公路磁悬浮\"深蓝L06全新特别版也迎来首秀。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3949028903566720\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>科大讯飞：将于今年全球1024开发者节推出全新主力通用大模型</strong></a></p>\n  <p>36氪获悉，8月21日下午，在科大讯飞2026年半年度业绩说明会上，公司总裁吴晓如透露，在今年全球1024开发者节上，科大讯飞将推出基于全国产算力的全新主力通用大模型；在今年8月底，公司将先推出阶段性版本。他表示，即将推出的全新主力通用大模型将在代码能力和Token性价比上整体达到国内第一梯队，同时在全国产算力训练的通用大模型中，各项指标继续保持国内领先。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3949037799554181\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国家发展改革委召开“两重”建设工作推进会，督促各地有力有效加快重大项目建设</strong></a></p>\n  <p>36氪获悉，据国家发展改革委，8月20日，国家发展改革委党组成员、副主任岳修虎同志主持召开“两重”建设工作推进会，天津、内蒙古、江苏、浙江、河南、广东等6省（区、市）分别做了发言。会议重点通报全国“两重”建设项目实施进展情况，布置下一步重点工作，要求各地加大督促力度，真抓实干、有力有效加快推动重大项目建设。国家发展改革委投资司负责同志参加会议。</p>", "category": "tech", "published_at": "2026-08-21T12:12:53+00:00", "fetched_at": "2026-08-22T00:57:35.787820+00:00", "fingerprint": "8b2f20791a2af313"}, {"source": "36氪 - 最新文章", "title": "成本超12亿的《诡秘之主》，能否成为快手自研游戏的破局点？", "url": "https://36kr.com/p/3949238923181444?f=rss", "summary": "<p>文丨果脯</p>\n  <p>由同名IP小说改编的MMO网游《诡秘之主》，今天终于端上桌了。</p>\n  <p>自2023年首曝以来，《诡秘之主》游戏就已经收获了大量关注，其首曝视频在B站获得了超600万的播放量，不久后的实机场景演示更是突破700万。</p>\n  <p>上线前，这款产品还在TapTap收获了210万的预约，成为TapTap里市场预约量最高的MMO新作。在MMO逐步式微的当下，这数据显然相当难得。而上线后，这款产品也不出预料登顶了iOS免费榜。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_d7427141e0e641a68448a294359ac18b@6202862_oswg48233oswg457oswg397_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">七麦数据iOS免费榜</p>\n  <p>不可否认，《诡秘之主》游戏绝对算得上一款“含着金钥匙”出生、具有极大野心的产品。其IP原著小说是起点近几年以来最出圈的现象级作品之一，曾打破多项网文纪录，而开发团队则是快手旗下的弹指宇宙，要人有人要钱有钱。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_f7c85b33c3aa4853969fa9f6376eb283@6202862_oswg621042oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">原著作者的寄语</p>\n  <p>而据官方公告，游戏整体基于UE5打造，项目组成员超600人，迄今包含推广费用在内项目总成本已经超过12亿元人民币。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_1778621b35044ae3a022ea6de4fa406f@6202862_oswg19064oswg682oswg210_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方公众号的推文QA</p>\n  <p>放眼整个行业，这样的起步也相当少见。</p>\n  <p>“究竟该改编成一款怎样的游戏？”</p>\n  <p>这既是游戏首曝初期项目组一度反复思考的问题，也是所有IP粉丝最为好奇的一点。</p>\n  <p>弹指宇宙作为快手旗下的自研游戏厂牌，《诡秘之主》无疑是其迄今为止最重磅的项目，也是一张风险最高的Joker牌。</p>\n  <p>做好了，Joker自然是王牌，《诡秘之主》无疑能够基于大IP加持赚得盆满钵满，IP粉丝也能收获一个心满意足的结果，同时还可以进一步吸引许多未曾看过原著的新用户。但如果做砸了，那Joker恐怕就成了真小丑，从项目组到弹指宇宙，乃至快手，都得从成本到口碑付出代价。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_84638d343ea44cd3a55948f07f7b0e03@6202862_oswg376679oswg1080oswg601_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏官方海报</p>\n  <p>从公测给出的答案来看，他们最终还是选择了一套比较克制、但又相当肯砸钱的打法。</p>\n  <p>二测前后，《诡秘之主》官方主动披露了开发团队的构成背景。其中，制作人是前雷火祝融工作室总监徐杰，他同时也是前《逆水寒》制作人。大部分核心团队成员，也都来源于业内多家头部大厂，都是具有多年MMO经验的开发者。</p>\n  <p>所以，《诡秘之主》最终走的也是团队最擅长、最有经验的路径，即复刻当年网易改编温瑞安小说《逆水寒》的路子。</p>\n  <p><strong>就实际体验来看，这套路径复刻得相当彻底——甚至连官号营销风格都学了七八分。</strong></p>\n  <p>《诡秘之主》许多玩法体系和商业化模式，能从《逆水寒》的诸多成功版本里看到不少影子，大到日常本、周本乃至大月卡的资源调度、节奏安排，小到系统框架、操作模式等底层设计逻辑。</p>\n  <p>比如《诡秘之主》将玩家的日常行动分成了游玩和获取奖励两大板块。玩家可在“躺赢”系统里体验当天的推荐玩法，并获得活力（即体力）奖励，而活力则用于开启各类奖励。当然，活力也能随时间自然恢复。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_4cc858fc737349eba2e1e89d9b16fce4@6202862_oswg820195oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">“躺赢”系统</p>\n  <p>这一系列设计，《逆水寒》已经验证数年，基本上不会出现踩雷的情况。</p>\n  <p>但若按网友所说，把《诡秘之主》粗暴地类比成“西幻风格的换皮《逆水寒》”，其实多少有失公正。</p>\n  <p>就像战牧法是MMO的职业核心框架，当下《逆水寒》的整体框架无疑是最安全的选择，并且也是徐杰及团队最了解的设计。在笃定做传统MMO的情况下，他们沿用这套熟悉的框架无可厚非。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_2885a66e117343e6b00f566e93033bf9@6202862_oswg377546oswg1080oswg482_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏职业海报</p>\n  <p>而有了更安全的基础，《诡秘之主》也才有条件和更多成本去做一些无从参考的设计。这往大了说，是怎么基于UE5开创一款新时代的MMO，往小了说，是怎么围绕IP去设计游戏的美术、叙事等内容设计。</p>\n  <p>毕竟，大家都觉得《诡秘之主》游戏属于“天胡开局”，但它的创作也同样走在行业内难度较大的一条道上。现在，MMO的市场热度在下降、IP改编天然不被看好，可谓是Buff多，Debuff也不少。</p>\n  <p>比如他们在美术层面应该下了挺大的功夫，并且游戏背景中的维多利亚时代风格，市面上乃至历史上其实缺乏比较符合当下审美的相关设计。《诡秘之主》游戏想做好这点，无疑相当于从零开始。</p>\n  <p>目前来看游戏的美术设计基本可圈可点。从最早期的实机场景演示，到游戏里整座廷根城镇的大小风景、服装设计、人文奇观，都可以让不熟悉IP的玩家感到耳目一新。而熟悉原著的用户，大概率也能迅速将小说中的各个场景与游戏联系在一起。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_8918cf5767fb4f67b48567fed6a3bae9@6202862_oswg623028oswg1080oswg463_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">初入廷根CG</p>\n  <p>只不过，IP故事还强调各类悬疑莫测的克系表达，这同时也需要恰到好处的美术设计来辅助表达。力度轻了，可能传递不出诡秘与恐怖感，而用力过猛，又容易变成特效乱飞，设计难度比较接近强调氛围营造的中式恐怖。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_77a19bfaddc942789fb6e53cf9c3b82e@6202862_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">雨景动图</p>\n  <p>而在氛围设计上，UE5引擎无疑能提供一个较高的上限。但游戏首日并没有开放太多的主线剧情，目前还很难针对“做得好不好”下一个定论。</p>\n  <p>可以确定的是，《诡秘之主》游戏在叙事和衍生玩法方面倒是已经交出了一个还算及格的答卷。</p>\n  <p>在叙事方面，《诡秘之主》游戏最初给人的感觉是玩家扮演小说主角，以游戏的形式重新跑一遍原著剧情。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_027d415b77754ad0bfe3a256119106b5@6202862_oswg467696oswg1080oswg602_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">最初的实机场景+故事对白演示</p>\n  <p>这看似是一个保本不出错的选项，但其实存在更多问题：在尊重原著用户的基础上，剧情往往很难做较大改动，这意味着游戏系统、版本节奏会受到极大限制。<strong>最终，《诡秘之主》游戏的选择是“我全都要”。</strong></p>\n  <p>游戏目前分成了两条故事线。其中，原创剧情故事线发生在原著剧情结局的两年后，玩家扮演一位被克莱恩，或者说整个塔罗会选定的角色，带着拯救世界危机的使命出现在廷根。有着原著作者“爱潜水的乌贼”监制，整体原创内容线基本都符合原作基调，并且部分原创支线在测试期间就已经收获了大量玩家的好评。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_c3ec938e8cef4782b185f5fbd2eab38f@6202862_oswg524372oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NPC“魔术师”</p>\n  <p>而同时，《诡秘之主》游戏也通过“灰雾之上”任务线，完整保留了原著的所有剧情——完整到所有台词一句都没有增减，原话完全保留的程度。</p>\n  <p>一些城镇里的琐碎剧情，游戏还将其分布在了廷根的大街小巷之中，玩家路过时能够选择交互触发。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_4c9e4a991be149e68872505e4dd2ac4c@6202862_oswg980143oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">原著中的搬家剧情</p>\n  <p>这对IP用户无疑是一个天大的好消息，毕竟大家过去已经吃过太多IP改编“毁原作”的苦了。</p>\n  <p>此外游戏还提供了第三人称越肩的沉浸视角供玩家选择。哪怕对MMO整体内容不太感冒的用户，也完全可以将其当成一个IP衍生单机产品体验。</p>\n  <p>当然，前提是你能忽略里面一些MMO味儿过重的设计。比如剧情里砸开一个箱子，玩家要先后交互两次。</p>\n  <p>而在外围玩法中，《诡秘之主》游戏也铺设了大量的可体验内容。</p>\n  <p>在“探秘”系统里，游戏分成了“秩序世界”和“城市暗面”两大模块，整体涵盖了射击、解谜、肉鸽乃至跑团等多种趣味小玩法。</p>\n  <p>以“城市暗面”板块为例，它涵盖了大量符合阴暗基调的长支线剧情，并提供了竞速、战斗等多种玩法挑战。而在每天晚上8点后，游戏还会开启“疯抢之夜”，NPC和玩家都不再受到廷根法律的约束，像“五星好市民”般互相抢夺地图上的资源。</p>\n  <p>如果玩家运气够好，还有机会获得“零元购凭证”，能免费兑换任意商场直售外观。并且从列表看，游戏明天还会额外开启“越狱”玩法。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_b11cd415176e40c09a119a1e98e53707@6202862_oswg749245oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">游戏内“探秘”系统板块</p>\n  <p>此外，游戏也加入了比较独特的GVG玩法模式“四皇之战”，最多允许上千玩家分成4大阵营同屏竞技。而针对其中的硬核玩家，他们搭建了特殊的“战略服”，只允许赛区积分排名前四的俱乐部进入，共16家。最终胜出的俱乐部，能获得一套专属外观和永久战旗。</p>\n  <p>说实话，在MMO当中，这种内容插入的体量已经大到有些不计成本了，而未来随着版本更新，官方大概率还会保持着这种节奏持续推出更多的外围玩法内容。<strong>如此一来，几乎对内容有任何需求的玩家，都可以在《诡秘之主》游戏里找到自己感兴趣的部分。</strong></p>\n  <p>就《诡秘之主》游戏的公测表现来看，尽管上半年官方一直在强调“抓住MMO最核心的乐趣”——事实上他们也确实这么做了，产品的内容丰富度依旧超出了多数人的预期。</p>\n  <p>而他们实际的产品思路也自然呼之欲出。</p>\n  <p><strong>《诡秘之主》游戏套用了头部同类游戏的IP改编路径，并且希望借助IP本身的题材、风格，从诸多武侠、仙侠类MMO中找到一个更新的可能性，进一步增加赛道内容的丰富度。</strong></p>\n  <p>毕竟过去提起西幻MMO，大家基本上都是想到那堆如出一辙的经典设定，即多种族、多职业、大世界。而就像IP原著打破了网文升级的惯用路径和叙事节奏，《诡秘之主》游戏也想打破过去玩家们对MMO的固有印象和自我束缚，为赛道找到新的可能性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_4f9b6638bb424769b83deed90a649228@6202862_oswg506047oswg1080oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方地区海报</p>\n  <p>说白了，《诡秘之主》游戏团队虽然走��老路，但也有着自己的想法，不希望始终沿袭MMO传统路径和IP改编的刻板路径，而是想找到品类新的分岔口和未曾被覆盖的地方。</p>\n  <p>当然，现在的《诡秘之主》或许还不算完全体，距离所谓“用UE5革新MMO”的口号也还有一定距离，比如如何做好游戏优化、持续平衡玩家需求、做出与其他MMO差异化的特色内容等等。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260821/v2_dfd461d391e546439caa0b8b59affe0d@6202862_oswg377001oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方KV</p>\n  <p>而在产品之外，弹指宇宙自身面临的挑战同样不少。</p>\n  <p>尽管弹指宇宙已经成立4年，用的大多也是行业老兵，但《诡秘之主》游戏作为团队最早期一路同步推进过来的首款核心产品，肯定会受到弹指宇宙与快手之间的磨合与阵痛期带来的影响——就像很多网友对弹指宇宙的质疑，都来源于公司前面三款产品的表现不佳。</p>\n  <p>况且，阿里、字节等过去互联网出身的公司，都已经在自研游戏板块遭遇过或大或小的滑铁卢。</p>\n  <p>从今年初快手内部的组织架构调整变化看，带有强互联网基因的公司往往会将游戏、短剧、小说统一划分为“内容消费”。<strong>但更多时候，游戏与其他两者的商业逻辑存在较大区别，一概而论，反而容易陷入吃力不讨好的尴尬境地。</strong></p>\n  <p>不同的是，与灵犀、朝夕光年相比，弹指宇宙具有更高的独立性和话语权，在内部也仍旧算是年轻创新的业务线。快手能否做到其他同类公司未能实现的业务扩展，或许也看《诡秘之主》未来的持续表现了。</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s?__biz=MzkzOTY5MTQyNQ==&amp;tempkey=MTM4OF8rZ0tlNEdhRGw2b3ZPaWVrVHBGVlBreDI0VFBPUHJsd1A4U1FqSUJ1QmVUaWhQQnRsSWpuRjlxeVNMbW85LWQ3MXpLMm1aVlNZTU5XNGRqTURDRm9YV1lab3BwV0Z5YlBqREZ5NVUwdHNaOWExejZuU0ZvQ3hnYmZfQ2tmSHlOeDc0ejk0MGdOOVpDTWot ecause the company hasn't \"seen enough players stick with the game to get to a path toward sustainability.\" Servers will [&#8230;]", "category": "tech", "published_at": "2026-08-20T19:59:09+00:00", "fetched_at": "2026-08-21T01:01:23.182835+00:00", "fingerprint": "7c5b609baa8a7782"}, {"source": "The Verge", "title": "Google Discover is getting an AI chatbot-tuned feed", "url": "https://www.theverge.com/tech/983088/google-discover-ai-chatbot-feed", "summary": "Google will soon allow you to customize your Discover feed by describing what you want to see. The new feature, rolling out to the Google app in the \"coming days,\" will use AI to automatically tweak your feed and \"remember\" your preferences for future visits. You'll find the option within the three-dot menu on your [&#8230;]", "category": "tech", "published_at": "2026-08-20T21:50:22+00:00", "fetched_at": "2026-08-21T01:01:23.182823+00:00", "fingerprint": "bdb698ec663c3ddc"}, {"source": "36氪 - 最新文章", "title": "硬氪独家 | 清华，中科院具身大脑企业融资10亿，已获得数亿海外订单", "url": "https://36kr.com/p/3947288204770693?f=rss", "summary": "<p>硬氪获悉，近日具身智能企业中科第五纪连续完成A1轮、A2轮融资，总融资金额超过十亿元。其中A1轮由锡高投、中国银行旗下中银AIC基金、三锋投资联合投资；A2轮由芯能创投、中银AIC基金、中山创投、鸿瑞达投资、博彦科技、金创投(浙江省新能源汽车子基金)联合投资。</p>\n  <p>中科第五纪成立于2024年，成立不到两年时间已完成数十亿融资。第五纪是一家头部的“具身大脑”公司，围绕具身操作大模型构建产品与解决方案。国内已服务中石化集团、零跑、国家电网等十余个核心客户。</p>\n  <p>相比国内市场，中科第五纪下一阶段更明显的增量来自海外。本轮融资完成后，全球化将成为公司未来发展的核心方向之一。<strong>目前，第五纪获得数亿元海外订单，海外业务进入实际交付阶段，并已构建起本地化服务体系。未来半年，第五纪将重点拓展欧洲、澳大利亚、新西兰、日本、韩国等海外市场。</strong></p>\n  <p>今年3月，中科第五纪在德国一家全球制造业企业总部完成了通用料箱搬运实景验证。面对随机摆放、规格不同的料箱，机器人无需人工干预，即可连续完成识别、抓取和搬运。对于具身智能公司而言，能够在欧洲制造业现场完成验证，意义不只是一笔项目落地，更意味着其技术开始接受高标准工业体系的检验。</p>\n  <p>公司创始人兼CEO刘年丰是中科院自动化所博士，师从中国科学院院士谭铁牛，长期从事人工智能、机器人产品研发及核心技术产品化落地工作。他告诉硬氪：“欧洲制造业正面临劳动力结构变化和新一轮自动化升级，这为中国具身智能企业提供了新的市场机会。在海外，‘说到做到’极其重要。能拿到头部制造企业订单，靠的是产品能快速适应当地生产体系，并把项目真正交付下去。”</p>\n  <p>过去一年多里，全球具身智能赛道正经历一场关于技术路线的转移。在硅谷，以Figure、1X Technologies为代表的梯队，普遍将互联网大模型的Scaling Law引入物理世界，试图通过无限堆叠视频扩散模型与数以百万小时计的机器人真实抓取数据，去催生具身智能的GPT时刻。不过，真实物理世界的非结构化特征导致数据采集成本较高、场景泛化部署周期很长等问题。</p>\n  <p>在这一行业背景下，第五纪推出了全球首创的超少样本FAM系列具身操作大模型。传统VLA架构在降维过程中极易丢失物理世界的空间结构先验，导致机器人稍换背景或光照就发生误操作。因此，第五纪独创了“热力图对齐”技术，将特征精准“拉高”回三维热力图，保留了三维空间几何关系，通过业内首创的模型架构创新技术减少了空间数据损失，提升了数据利用效率，从而实现“少样本、高可靠、强泛化”的技术闭环。</p>\n  <p>在实际操作部署中，该模型将任务的学习门槛降到了仅需3至5条真实示范，即可实现高达97%的基础任务成功率，数据需求量降至传统方法的1%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_558d75e35d1b4bafa81fba453dd38ac3@6310669_oswg1176685oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在提升操作泛化能力的同时，第五纪还通过世界模型模仿人类行动前预判结果、判断风险的能力，让机器人先推演、再执行，进一步提升真实作业中的安全性。在其近期升级的FAM-1.3版本中，团队首次将三维空间结构先验与视频生成深度融合，实现了从离散热力图预测到序列化热力图生成的跨越。另一款世界模型BridgeV2W，能够将复杂的动作指令直接“翻译”成未来可能看到的画面，从而实现对动作结果的高精度、可视化模拟。其暂未正式发布的新一代世界模型FlowWAM则在今年4月登顶了WorldArena全球榜单总分榜。</p>\n  <p>搭载第五纪自研的首款轮式具身机器人已在物流、工业柔性产线、能源巡操三大核心场景实现规模化落地。机器人承载了FAM系列大模型，身高189cm，臂展65cm，采用轻量化设计，全身具备28个自由度，其中仿人形手臂拥有7个自由度，在参数上兼顾了高负载与高灵活度。</p>\n  <p>在技术上的突破也是第五纪重点开拓海外市场的原因之一，海外工厂在物料规格、生产节拍、工位布局等方面存在明显差异，第五纪依托FAM系列具身操作大模型，用超少样本学习，提高机器人面对陌生场景时的快速适配能力，也就降低了不同国家、不同工厂部署成本。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_9bf25f38b69d44589aeedbb2bbd0f80f@6310669_oswg811236oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>目前，公司海外业务重点聚焦工业物流、柔性制造等标准化程度较高、市场需求明确的工业场景。相比于以硬件出口为主的机器人企业，刘年丰表示，我们会坚持软硬一体，因为只有软硬一起做，才能真正打通场景、数据、模型、控制和交付。</p>\n  <p><strong>以下是对第五纪创始人兼CEO刘年丰的访谈：</strong></p>\n  <p><strong>硬氪：行业主流目前都在沿着VLA路线走，为什么第五纪在成立之初就选择“颠覆”它？把一维特征“拉高”回三维热力图，在工程实现上最大的挑战是什么？</strong></p>\n  <p><strong>刘年丰博士：</strong>我们希望具身机器人理解世界的方式，更接近人。</p>\n  <p>人面对真实世界时，并不会对所有信息做同等强度的计算。大脑始终在筛选：什么与当前任务有关，什么可以暂时忽略，哪里值得投入更多注意力。真正有效的智能，从来不是处理的信息最多，而是能够迅速抓住决定结果的部分。</p>\n  <p>这也是我们重新设计技术架构的起点。具身机器人生活在三维物理世界中，位置、距离、遮挡、接触关系都直接决定动作是否成立。如果把这些信息过早压缩为一维特征，计算可能更简单，但三维结构和空间约束也可能随之丢失。</p>\n  <p>第五纪把特征重新拉回三维热力图，一方面保留物理世界原本的空间关系，另一方面让模型形成类似于人类注意力的选择机制，快速锁定与任务最相关的区域。</p>\n  <p>工程上最大的挑战，是在三维空间中准确表达目标、位置和动作之间的关系，同时让模型从复杂环境中迅速找到真正决定任务成败的关键区域。我们既要解决空间信息在特征压缩中的损失，也要避免模型对所有信息进行无差别处理。第五纪的核心，是让具身机器人既理解三维世界，又具备抓重点的能力。</p>\n  <p><strong>硬氪：行业目前还在用海量数据灌大模型，你们敢赌“超少样本”的原因是什么？如果用超少样本，对示范数据的质量、维度和操作人员会提出更高要求吗？</strong></p>\n  <p><strong>刘年丰博士：</strong>模型能力取决于两个变量，一个是数据数量，一个是数据质量。</p>\n  <p>我相信数据越多模型能力越强，但问题在于，今天具身智能真正稀缺的是高质量真机数据。当数据数量短期内很难大幅增长时，行业就不能只关注“有多少数据”，还要关注数据使用效率。</p>\n  <p>如果模型的数据使用效率只有1%，即便不断增加数据，大量有效信息仍然会被浪费；如果使用效率能够从1%提高到更高水平，同样的数据量就能支撑更强的学习能力。未来数据规模扩大，这种效率优势还会被进一步放大。所以我们进行了模型的架构创新，将学习一个新任务所需的示范数据降低到3—5条。超少样本只是结果，我们真正突破的，是具身智能长期存在的数据利用效率瓶颈。</p>\n  <p>至于第二个问题，恰恰相反——超少样本不是把负担转嫁给现场人员，而是把复杂性消化在系统内部。现场工人只需要按照正常的作业方式，完成几次简单的示范操作就行。至于动作理解、空间建模、安全校验这些复杂推理，本来就应该由模型和系统去完成。我们的原则很简单：让客户用最少的干预，拿到最稳的落地效果。如果“超少样本”反而让客户更累，那它就没有任何商业价值。</p>\n  <p><strong>硬氪：今年世界模型非常火热，第五纪也发布了 BridgeV2W ，第五纪的技术蓝图里，世界模型扮演什么角色？</strong></p>\n  <p><strong>刘年丰博士：</strong>世界模型，本质上是在模拟人类“行动前推演”的能力。</p>\n  <p>人并不是接收到信息之后就立刻行动。真正开始前，大脑会根据过去的经验，对接下来可能发生的结果进行快速推演：这个动作是否可行，环境会怎样变化，可能出现什么风险，是否需要换一种方式。很多时候，这种推演并不被我们明确感知，却是人能够在复杂环境中完成行动的重要原因。</p>\n  <p>BridgeV2W要赋予机器人的，正是这层能力。机器人在真正执行动作之前，先预测动作可能带来的环境变化，对结果进行判断。预期结果合理，再进入执行；如果存在碰撞、掉落或其他风险，就及时调整动作，必要时引入人工干预。</p>\n  <p>简单来说，超少样本解决的是具身机器人如何像人一样，从有限经验中高效学习；���界模型解决的是具身机器人如何像人一样，在行动之前预判结果。它让具身机器人的决策不再停留在“看到什么、应该做什么”，而是进一步理解“这样做之后，会发生什么”。</p>\n  <p><strong>硬氪：你们自研了首款 189cm 的轮式双臂具身机器人，第五纪选择自研本体的逻辑是什么？未来会坚定地走软硬一体路线，还是更倾向于做具身智能时代的大脑供应商？</strong></p>\n  <p><strong>刘年丰博士：</strong>先明确一点——我们本质上还是个“大脑公司”。自研本体，是现阶段把大脑带进工业现场的必要选择。</p>\n  <p>目前绝大多数机器人本体更适合展示，距离工业级作业还有明显差距。真实工厂要求机器人在高节拍下长期连续运行，同时满足高稳定性、高可靠性、大负载以及宽温域作业等要求。身体如果达不到这些标准，再强的大脑也无法真正发挥能力。</p>\n  <p>因此，我们根据具体任务对负载、工作范围、作业节拍和环境适应性的要求，匹配了一副能够承载大脑能力的身体。189cm、轮式和双臂，都是从现有工业工位和实际作业需求出发作出的选择。</p>\n  <p>第五纪会持续保持软硬一体的能力，因为大脑必须在真实身体和真实场景中完成验证与迭代。但公司的核心始终是具身大脑。自研本体服务于大脑能力的落地，未来我们的具身大脑也会适配更多形态的机器人。</p>", "category": "tech", "published_at": "2026-08-20T03:10:00+00:00", "fetched_at": "2026-08-21T01:01:23.096862+00:00", "fingerprint": "933c971cdb91c53e"}, {"source": "36氪 - 最新文章", "title": "一个扭转命运的决定：5000 亿智谱如何「逆风改命」|深氪", "url": "https://36kr.com/p/3947451908357257?f=rss", "summary": "<p><strong>文 | 周鑫雨 张雨忻</strong></p>\n  <p><strong>编辑 | 张雨忻 杨轩</strong></p>\n  <p>GLM 5.3 发布后不到一小时，智谱一名销售的电话和微信都爆了：十几个来询问 API 上线时间的，以及吸取了 Kimi K3 教训，想提前锁定智谱推理算力的客户也不少。这种状况一直持续了整个周末。</p>\n  <p>8 月 14 日下午，智谱突然发布了新一代模型，在测评榜单上再次刷新国产模型的 Coding 表现，与不久前发布的 Kimi K3 并列开源第一，与Claude Fable 5、GPT-5.6 Sol 等闭源旗舰模型处于同一水平。这瞬间引爆了客户们的热情。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_ec7f7cd8d0654f8888c20d6859a469e7@1104_oswg847455oswg2560oswg1045_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;Artificial Analysis 榜单。图源：智谱公众号</p>\n  <p>周末过去，消息和电话并没有停——原定 8 月 18 日要上线的 GLM 5.3 API 推迟了，销售再一次被客户“围攻”。“客户在电话里对我喊：内部预算和开发运维都到位了，delay 一天我们的管理成本就多好几万！”</p>\n  <p>上述销售回忆，如此这般的 “API 哄抢”大概是从 2026 年 2 月开始的——这是智谱发布大版本更新模型 GLM 5 的时间，当时多家外媒都评价其“第一次真正把中国开源模型推到全球前沿模型附近”。在那以后的 GLM 5.1 来到全球第一模型梯队，GLM 5.2 拿到全球开源模型 SOTA（最佳）。可以说，每一个版本都在显著提升。</p>\n  <p>这期间，越来越多人开始问，这些模型背后的智谱，是一家怎样的公司？</p>\n  <p>其实，在中国 2023 年开始兴起的大模型浪潮中，智谱原本是一个“不够主流叙事”的存在。</p>\n  <p>它不够年轻——2019 年就已经成立，在推崇“小天才”的气氛下看起来不够酷；</p>\n  <p>它不够“公司化”——几乎完全脱胎于清华，带着鲜明的学院派和实验室气质；</p>\n  <p>它的商业化路径看起来不够性感——长期给政企客户做模型私有化部署，不是互联网的“可复制、规模化”逻辑。</p>\n  <p>但是，如果你是近一年才关注到这家公司，对它的认知大概率会是：全球大模型第一股，最高曾摸到 1.3 万亿港元市值，堪比好几个美团；拥有开源 SOTA 的模型，口碑全球出圈；ARR（年度经常性收入） 目前在中国模型厂里位列第一......</p>\n  <p>这种大转变的核心，就在模型的 Coding 能力上——当全球大模型都沉浸在 Anthropic 带来的 Coding 狂欢中时，智谱是中国最早拿到 Coding 门票的大模型公司，靠着足够好的 Coding 模型迎来口碑爆发和收入激增，并且一定程度上推高了过去半年国内大语言模型的竞争烈度。</p>\n  <p>智谱做了什么？率先拿到 Coding 门票的，为什么会是智谱？</p>\n  <p>要解答这些问题，需要先回到 2025 年 5 月，“智谱押中 Coding” 的前两个月。</p>\n  <h2>一、背水一战，和意外的 Coding 爆发</h2>\n  <p>2025 年 5 月，智谱紧急召开了一次战略会。“只有核心高管和少数股东参与了，核心议题之一是，智谱下一阶段的模型要往哪个方向走。” 一位知情者告诉 36 氪。</p>\n  <p>这个议题，在那个时间点几乎决定了智谱的接下来的命运。</p>\n  <p>一方面，<strong>在 2025 年春节横空出世的 DeepSeek R1 几乎一刀悬在了智谱的商业化大动脉上。</strong>这个性能比肩 OpenAI o1，但价格只有 o1 1/30 的模型，冲击了当时整个 B 端市场，而面向 B 端做定制化模型部署是智谱当时最重要的商业化方向。</p>\n  <p>一位智谱做商业交付的员工告诉36氪，他就没能过个好年：“一天接 5、6 个客户的电话，但大部分是来问能不能部署 DeepSeek 的。” 他心里有些五味杂陈，“DeepSeek 一夜之间全民知晓，不少客户的老板都交代下面的人改用 DeepSeek。” 另有智谱员工告诉 36 氪，“保守估计，当时智谱近 30% 的客户流向了 DeepSeek，对公司打击很大。”他提到，为了留住客户，智谱给一些客户开出了非常低的折扣。</p>\n  <p>而另一方面，国内的大模型市场也在悄然转向。Chatbot 的热度褪去，当时与智谱同为“六小虎”成员的月之暗面、MiniMax 都在押注以调用工具、执行复杂任务能力见长的旗舰模型。</p>\n  <p><strong>面对危机和变化，智谱的这次战略会做出了一个扭转命运的决定：改变原本针对文本、多模态、编程等能力各自做垂直模型的路线，押注 Reasoning（推理）、Coding（编程）、Agentic（智能体） 三类数据融合的大参数、三合一模型。</strong></p>\n  <p>智谱意识到，必须走出舒适区，寻找属于下一阶段的新机会，而新机会只会从效果足够好的、能解决更复杂的生产力需求的大模型里长出来。</p>\n  <p>这个决定对智谱来说并不容易。“不少股东都反对继续 scale up 模型（即推高模型参数），因为投入太高了。”一位知情者告诉36 氪。智谱的财务压力一直都不小——2025 年财报显示，智谱净亏损高达 47.18 亿元，仅研发一项就花费了 31.82 亿元，是当年总营收的 4 倍。</p>\n  <p>另一个原因则在于，<strong>多数据融合的模型，与智谱走 B 端定制的商业模式天然相悖。</strong>一名智谱 B 端业务人士告诉我们，为了匹配客户的具体业务场景，智谱此前将模型能力做了很清晰的垂直场景划分——对话、生图、生视频、Coding 等各有对应的模型和产品。若用一个融合模型匹配所有场景，那么部署成本会变得非常高。</p>\n  <p><strong>这个“三合一”模型，就是在 2025 年 7 月上线的 GLM 4.5</strong>。“原本 4 月就要上线的，但因为临时调整了模型方向，硬生生拖到了 7 月。” 一位知情人士告诉 36 氪。</p>\n  <p>这是智谱的背水一战。为了训练“三合一”的模型，<strong>智谱准备了 15 万亿 Token 的通用数据，以及 8 万亿 Token 的 Coding、Reasoning 和 Agentic 数据，总训练数据量几乎是同期模型的 1.5 倍</strong>。</p>\n  <p>焦虑几乎弥漫在所有人身上。多位智谱员工告诉 36 氪，GLM 4.5 发布前的几个月，AI 院（智谱的技术和产研部门）的所有算法几乎住在公司，“4.5 发布那天，我凌晨下班，早上上班的时候，算法那边坐的整整齐齐，和昨晚我走的时候几乎一模一样。”还有市场侧员工在发布日通宵到早上 8 点，“太焦虑了，不知道 GLM 4.5 的市场反响会怎么样。”</p>\n  <p>后来的故事人尽皆知：<strong>GLM 4.5 成为了智谱第一个在 Coding 上收获口碑的大模型，也让智谱成了国内最早押中 Coding 赛道的大模型公司之一。它真的帮智谱找到了属于下一竞争阶段的新机会——Coding。</strong></p>\n  <p>其实在国内，不少大模型公司在 2024 年 6 月 Claude 3.5 Sonnet 发布时就已经关注到了 Coding 的苗头，但却没敢入局。</p>\n  <p><strong>MiniMax 创始人闫俊杰两年前就曾问过 DeepSeek 创始人梁文锋：“你们要不要做 AI Coding。” 梁给出了否定的答案。</strong>“当时大家的共识是，全中国会写代码的人可能只有 100-200 万，这似乎不是一个足够大的市场。”闫俊杰在一场活动上回忆道。但他们没想到的是，当 AI Coding 成为改变生产方式的变量，200 万人的市场也可以变成 2000 万人。</p>\n  <p>不过，智谱的率先押中，也并非是“一切尽在计划中”。</p>\n  <p>一名智谱员工告诉我们，“三合一”刚开始训的时候，Reasoning、Coding 和 Agentic 之间的优先级没有明显差别，<strong>模型最终聚焦到 Coding 上，一个直接的诱因是，用户的选择。</strong></p>\n  <p>据 36 氪了解，研发过程中团队内部反复讨论提到，模型要贴近用户的真实需求，不要围着榜单来，模型真正的能力需要在真实任务中得到验证。所以算法团队会频繁参考用户/客户反馈，了解他们的需求点。其中，<strong>“提高研发效率”，是一个被高频提及的需求。</strong>而恰好，这也与管理层所强调的“追求更高智能上限”方向一致。</p>\n  <p>GLM 4.5 发布后，一位销售记得，当时不断有 KA 客户提需求，将 GLM 4.5 接入程序员的工作流。社交媒体上，“Claude 平替”的声音也开始出现——毕竟，GLM 4.5 的 Coding 能力逼近 Claude Sonnet 4，价格却只要后者的 1/7。</p>\n  <p><strong>Coding 成了 GLM 4.5 市场反响最好的能力</strong>。2025 年 9 月，智谱推出了“GLM Coding Plan”，<strong>成为国内第一个推出 Coding Plan 的大模型公司</strong>。10 月，“GLM Coding Plan 企业版”上线， 同月推出的新模型 GLM 4.6，据官方说法，特别强化了 Coding 能力。</p>\n  <p><strong>到这里，智谱的新故事线逐渐清晰——在又重又难以复制的 B 端模型部署生意之外，抓住了能规模化、且商业价值较高的 Coding 生意。</strong></p>\n  <p>“Chatbot 的故事，从 DeepSeek 出来后，就已经结束了。我们应该思考的是下一个 bet 是什么。” 在 2025 年初的一场活动上，智谱创始人唐杰曾提到。现在回头看，这个 bet 就是 Coding。</p>\n  <h2>二、GLM 5.2 和万亿市值</h2>\n  <p>智谱今年1月在香港挂牌上市、成为“全球大模型第一股”这天，CEO 张鹏给每位员工发了 200 元的红包。但这份喜悦只维持了一天——一天后，MiniMax 上市，股价首日暴涨 109%，市值突破千亿元，几乎是智谱的两倍。</p>\n  <p>当两家基因完全不同的大模型公司被同一时间放到公开市场上被审视，智谱在市值上暂时落了下风。“在国内，当时 MiniMax 聚焦的 C 端市场被认为有更大的想象力，被贴上 toB、toG 标签的智谱看上去就没那么性感。”一名大模型投资人对36氪说。</p>\n  <p><strong>但仅过了 5 个月，智谱用一个开源的 SOTA 模型再次扭转局势，而这一次，比 GLM 4.5 那次更为彻底：收入、口碑、股价，迎来全面爆发。</strong></p>\n  <p>2026 年 6 月 13 日，智谱发布了新一代旗舰模型 GLM 5.2 。这个依旧以 Coding 为最主要能力的模型在 Artificial Analysis 综合榜单上位列开源模型 SOTA，仅次于闭源的 Claude Fable 5、Claude Opus 4.8（max），以及 GPT 5.5（xhigh）。</p>\n  <p>用户的钱包是最诚实的。<strong>GLM 5.2 让智谱的 API 收入快速攀升。</strong></p>\n  <p>智谱股东告诉 36 氪，2026 年 5 月，智谱的 ARR 还在 5-6 亿美元左右，对年底 ARR 的预期为 10-15 亿美元。而在 GLM 5.2 发布后一个月，36 氪再度独家获悉，<strong>7 月智谱的 ARR 已飙升至 10 亿美元，相较 2 个月前几乎翻倍，而年底的 ARR 预期也提升至 25 亿美元。</strong>针对这一数据，智谱暂无回应。</p>\n  <p>能够从销售第三方模型里获得分成的云厂商们也快速捕捉到了 GLM 5.2 带来的机会。一名智谱人士告诉 36 氪，阿里云、火山引擎、甚至小米和金山云，“推销 GLM 5.2 比智谱自己都狠”，因为“客户都是来问 GLM 5.2 的”。 阿里云一名销售也证实了这件事：由于下游需求太旺盛，到了 7 月，阿里云“直接给客户推 GLM 5.2” 。</p>\n  <p><strong>智谱迎来了自己的“DeepSeek 时刻”。</strong></p>\n  <p>不仅国内，海外影响力也因 GLM 5.2 被快速打开。云端部署与托管平台 Vercel 的监测显示，<strong>GLM 5.2 调用量的增长速度是 2026 年以来所有模型中最快的，超过了 4 月发布的 DeepSeek V4。</strong></p>\n  <p>“智谱没多少营销预算，我们的做法就是免费给潜在 KA 和 KOL early access（试用名额），让他们直观感受模型能力。”一位销售告诉 36 氪。另有市场推广业人士告诉我们，<strong>在 GLM 5.2 发布前，智谱的中高层一有机会就飞去海外见 KA 客户和科技 KOL，邀请他们参与内测。</strong>“当时不少海外客户用过之后发现，GLM 5.2 的综合能力超过了 DeepSeek V4，海外口碑就是这么逆转的</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_b99f5eac5cd64f67829618563f3907cd@1104_oswg155696oswg1280oswg960_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GLM 5.2 发布后，智谱总部搜狐网络大厦外墙的 LOGO，从汉字“智谱”，换成了“Z”。图源：作者拍摄</p>\n  <p>股价也飞升了。</p>\n  <p><strong>GLM 5.2 发布后的第一个交易日，智谱股价大涨 32%，并在一周后，达成万亿市值。</strong>在这个时间点下，智谱的市值大约是2.5 个美团，和 3.5 个京东。</p>\n  <p>回溯到年初股价节节攀升的时期，智谱在商业化上就做了一个决定：<strong>大幅提升 MaaS 业务的优先级。实际上，不少股东都认为，智谱原有的（B 端）定制化生意，撑不起太高的市值。</strong></p>\n  <p>一方面，定制化业务没有规模效应，想接更多单子，就必须加更多人。<strong>据一位智谱员工的测算，B 端业绩每年稳定在 1.5 倍的增长幅度——稳健，但天花板就在那。</strong>并且，每一笔订单都是高度非标的。“有时候为了尽快拿到验收单，我们工作之余还要付出很多额外的情绪和体力劳动：替客户开会，帮他们制作汇报 PPT，甚至帮他们接孩子......说白了，就是要付出大量人力把客户服务好。”</p>\n  <p>另一方面，现在模型的迭代速度太快，可能一个模型在开始部署时还是行业内最领先，但花几个月部署完之后已经被别的模型远远超过。越来越多客户也认为购买 MaaS 服务是更灵活的方式。</p>\n  <p>其实早在 2021 年，智谱内部就讨论过未来的商业模式，当时内部已经认为，应该对标（彼时的）OpenAI，把重点放在 API 调用收费上。但由于当时国内 MaaS 市场太早期，也没有真正能打的模型，所以没有条件推下去。</p>\n  <p>5 年后的现在，张鹏选择把对标对象明确为了 Anthropic。但对比 Anthropic 来看，智谱的 MaaS 业务还有巨大的收入鸿沟需要填补。根据最新的公开数据，智谱的市销率高达 Anthropic 的 5 倍多。<strong>基于 Anthropic 的市销率，智谱的市值若想稳定在万亿港元，ARR 要达到 487.8 亿港元，约 62.2 亿美元。</strong>而当下，智谱的 ARR 刚刚达到 10 亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_6651a8a926cc407b897ada35697b9733@1104_oswg126885oswg1524oswg658_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：36 氪制作</p>\n  <h2>三、取舍的胜利，“不犯错”的胜利</h2>\n  <p>“为什么是智谱？” 当智谱用 GLM 4.5 踢开 Coding 的大门，并以 GLM 5.2 一飞冲天后，不少人开始问出这个问题。</p>\n  <p>36 氪也向多位智谱员工抛出了这个问题，得到的答案几乎一致：<strong>克制地聚焦、没犯错、每一步基本做对了</strong>——“把每一步都做对，模型几乎不可能差”这个结论，在字节的 Seedance 的成功上也被验证过。</p>\n  <p>这些看起来偏“稳健”的风格和做法，与智谱这家公司的基因息息相关。回溯智谱在一些关键时刻做过的对的选择，有一个因素非常重要，那就是——尊重自己的基因。</p>\n  <p><strong>张鹏曾这样评价智谱：“就像清华的理工男一样，很聪明、很能干，你让他干什么事情，他能干得很漂亮，但是就是没有太多的情绪价值。” 这符合一直以来外界对智谱的印象：有技术、有视野，但看起来不够有趣，不够性感。</strong></p>\n  <p>而张鹏关于智谱“没有太多情绪价值”的评价，与智谱的模型和产品之间，形成了有趣的互文。</p>\n  <p>2024 年，智谱曾与一家硬件厂商合作，将 GLM 接入产品。当时，智谱拿出了 GLM “情商最高的系列”。但在内部测评中，当员工输入“我的心情有点 down”时，接入了 GLM 的产品的回复竟是：“打开空调”。</p>\n  <p>张鹏曾在媒体访谈中提到：“（杨）植麟（月之暗面创始人）知道怎么去理解普通人的需求和想法，我们在这方面可能做得没有那么好，这跟我们的定位有关系。” 智谱在这方面的弱势，使它<strong>在 toC 产品上存在短板。</strong></p>\n  <p>两个典型案例是 Chatbot “智谱清言”和视频生成模型“智谱清影”。根据“AI 产品榜”数据，截至 2025 年 3 月，Chatbot 大战约一年半后，智谱清言 App 端月活为 1043 万；同时期，豆包的月活是9736 万。而“清影”的销售情况则可以用“惨淡”来形容，一位智谱销售告诉我们，“客户大多是从事艺术领域工作的，看不上清影的审美。”</p>\n  <p>不擅长聊天、不擅长视觉类审美这样的市场反馈，并没有让智谱失去战斗力。相反，<strong>意识到自己的短板后，智谱果断将资源从这些方向上撤出，聚焦到了自己擅长的方向上。“智谱是一个非常理工科气质的公司，Coding 就是最适合他们的方向。”一位业内人士评价。</strong></p>\n  <p>目前，<strong>在智谱 AI 院中，负责多模态模型训练的算法降缩减 10 人左右；而聚焦文本、Coding 方向的算法则有百人。</strong>一名知情人士透露，<strong>智谱有较高的预算做 Coding、Agentic 的 RL 环境搭建和数据工程。</strong></p>\n  <p>在当下算力资源、模型容量、模型数据量等现实掣肘下，模型厂商们都不可避免地要做选择题，为不同的模型能力排优先级。<strong>如果既要又要，可能导致哪方能力面都不够突出的结果。</strong></p>\n  <p>“模型每一种后训练目标都会占用其他目标的能力。 把提升 Coding 能力作为训练目标，意味着训练数据要少废话、高精度，这和正常人之间带有情感的交流是相悖的。” 智谱一名前算法员工举了个例子：GPT-5 和 DeepSeek V4 发布时，都因为提升了 Coding 和 Reasoning 能力，而被用户评价“情商变低”。</p>\n  <p>还有一个例子是 MiniMax。模型 M3 发布后，一名参与训练的算法反思，M3 各项能力都不突出，就在于训练目标没有收敛：“MiniMax 的优势业务都是 toC 的，虽然老板们知道 Coding 和 Agentic 重要，但也放不下模型的情商优化工程。” 最后的结果就是，M3 发布后行业反响平平。</p>\n  <p><strong>不过近期，36 氪独家获悉 MiniMax 在 6 月底解散了后训练团队中的“泛娱乐组”，将人力和资源投入到了 Reasoning 和办公场景。</strong></p>\n  <p><strong>做对方向的取舍之后，在接下来模型训练的每一个关键环节中，智谱也基本做到了“不犯错”。一个核心原因在于，智谱搭建了精细的 A/B Test 体系。</strong>一名智谱员工告诉我们，“遇到关键技术选型时，智谱会分两三波人马做 A/B Test，每个测试组放两三个研究员，就像实验室一样。”</p>\n  <p>另有员工提到，<strong>智谱将训练阶段和训练路线拆得很细致，一旦无法确定技术选型，算法就会将每一条路线下的训练结果去测试集上跑一跑，择优而取。</strong></p>\n  <p>另一个不犯错的原因，则来源于“经验”。早在 2021 年，唐杰就主导了智源研究院发起的万亿参数大模型“悟道 2.0”的训练。在一众大模型公司的创始人中，做过这个参数量模型的只有唐杰和杨植麟。</p>\n  <p><strong>经验带给智谱的，是对数据和后训练的重视</strong>。目前业界的共识是，提升 Coding 能力的关键，是做好 SFT（监督微调）和 Agentic RL（基于 Agent 任务环境做强化学习）。在这两个后训练环节，“<strong>至少对于一些前端任务，数据的作用比算法大。</strong>”一位大模型行业人士判断。</p>\n  <p>然而，制定数据策略有相当高的经验壁垒。“用哪些 query 去问，基于哪些 task 跑，合成的数据用来做 SFT 还是 RL，是用来生成训练的模拟环境，还是直接用于训练，这些决策都离不���经验。”一名 MiniMax 算法告诉我们，M3 发布后，MiniMax 内部开了场反思会，内部得出的一个结论就是：数据策略没做好。</p>\n  <p>早在 2024 年，智谱就在海外投入了一个团队，从事数据的采购。<strong>在内部，负责模型训练和数据的张笑涵主导搭建了一个数据标注平台，名为“狂标”。在语言模型和多模态模型两个组轮训期间，待训组的核心任务，就是标数据。</strong></p>\n  <p><strong>另外，自GLM 4.5 起，算法团队开始愈发重视下游客户的反馈。</strong>一位智谱员工记得，AI 院常常与销售和交付团队的负责人们开会，从而收集 KA 客户的反馈。<strong>模型发版前，内部会设置两道测评</strong>：一道在 AI 院，做通用能力测试；另一道则在交付团队，基于目标用户高频场景做测评。“所以，GLM 的 Coding 能力在开发者群体中口碑很好。”</p>\n  <h2>四、人才壁垒：师门下的组织</h2>\n  <p>这套“不犯错”的体系背后，是智谱 AI 院的数百名算法人员。“<strong>智谱的算法用钱挖不动</strong>。” 一名从事高招的猎头告诉 36 氪，“有大厂愿意开数千万元薪资包挖智谱 AI 院的核心算法，但最后以失败告终。”</p>\n  <p>一方面，智谱的核心算法确实很贵——公司市值快速攀升，核心算法手里的期权都值十几亿了。但更重要的原因是，<strong>智谱与它的核心人才之间形成了一种金钱之外的深度关系，这是其它大模型公司难以复制的。</strong></p>\n  <p>这种关系是怎么建立的？</p>\n  <p>在国内一众大模型公司里，智谱是一个鲜明的存在：从创始人到各个岗位上的核心成员，几乎都来自清华，其中不乏大量同门和师生关系。很多行业人士在提到智谱的组织时都会提到几个词：学院派、清华系、唐杰和他的学生......</p>\n  <p>“它是一个公司、学校、研究院的结合体”，一名投资人如此评价智谱。</p>\n  <p>作为以模型训练为核心的组织，这个组织绕不开的人物，是它的创始人兼首席科学家唐杰。作为清华计算机系教授，唐杰是中国最早做机器学习、NLP（自然语言处理）的学者之一。多位投资人和 FA 评价，当他们在 2022 年底找对标 OpenAI 的标的时，脑海中最先跳出的清华学者是：唐杰、孙茂松、黄民烈。</p>\n  <p>在不少智谱员工看来，“唐杰热情、有信服力、执行力也强”，但同时对待技术和业务又要求极高。一名智谱 AI 院的算法记得，智谱 Agent 产品 AutoGLM 2.0 的训练结果不理想，唐杰直接推迟了上线时间。</p>\n  <p>这家公司的核心团队带有强烈的清华系人际羁绊。负责商业化的 CEO 张鹏，清华本、硕、博出身，与唐杰同属计算机系；负责政府关系的智谱总裁王绍兰和董事长刘德兵，也都毕业于清华，与创始团队在清华数据科学研究院大数据研究中心共事过。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_a5a7d27eb1264e0293835aec016c613a@1104_oswg1643068oswg1280oswg853_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">智谱港交所挂牌上市当天，张鹏（左二）、王绍兰（左一）、刘德兵（发言者）等智谱核心成员到场。图源：智谱</p>\n  <p>而智谱的心脏——负责模型训练的 AI 院，<strong>数百位位研究员中 70% 以上都是清华计算机系的本科生、硕士生或博士生</strong>。</p>\n  <p><strong>庞大清华师生构成的智谱形成了一个相对稳固的算法组织，被师门关系所包裹，“学院”文化鲜明。</strong></p>\n  <p>学院文化一方面体现在工作方式上：<strong>AI 院层级扁平，比起公司，更像一个实验室</strong>。据智谱员工，很多关键方向都是从一个技术问题或一次实验结果的讨论开始的，不同背景的研究人员会很自然地参与进来。对年轻研究员来说，有比较大的空间来提出问题、验证想法。</p>\n  <p>并且，不少学生都表示，出于对自己老师、学长的尊重和情感，不会轻易选择离开。“想在唐老师门下读硕士博士的学生里，有一些也会选择先来智谱工作。” 一位前智谱算法告诉我们。</p>\n  <p><strong>源源不断的人才供给，加上较低的流失率，智谱的算法人才壁垒就这样形成。</strong>据 36 氪了解，GLM 5 发布后，有智谱的算法实习生一天之内就收到近 10 通猎头的电话；字节的猎头曾对着 GLM 论文上的署名，一个个打电话；腾讯混元愿意开两倍的底薪，去挖一个智谱的硕士。而以上种种，成功率都不高。</p>\n  <p>大模型公司之间的竞争，只会越来越激烈。</p>\n  <p>8 月 19 日，唐杰在 X 上发帖，阐述他对 Scaling Law 的理解：模型能力已经不再单纯由参数量决定，它更像是一个控制变量的实验，而变量包括“用了多少数据”、“准备把算力花在哪里”、“模型最终由谁、在什么条件下运行”等。这个论述指向 GLM 5.3 相较于上一代，实际是在后训练环节下功夫，而非卷预训练参数。</p>\n  <p>而大比例推高模型参数的几乎是剩下的所有头部大模型。过去一个月，月之暗面、DeepSeek、阿里都相继发布了新版旗舰模型，参数在 1.6 亿-2.8 亿之间，是 GLM 5.3 的 2-4 倍。其中，月之暗面在 7 月 17 日发布的 K3，取代了 GLM 5.2 维持了一个月的开源 SOTA 之位；而仅过了 20 多天，智谱又用 GLM 5.3 再次夺回。</p>\n  <p>模型方向、训练路线、数据质量、算法人才......围绕大模型各个维度的争论和竞速，远没有到可以分出胜负的时候。</p>\n  <p>（36 氪作者邓咏仪、李炤峰对本文亦有贡献）</p>", "category": "tech", "published_at": "2026-08-20T07:12:42+00:00", "fetched_at": "2026-08-21T01:01:23.096856+00:00", "fingerprint": "2e8a4101d9bf28f7"}, {"source": "36氪 - 最新文章", "title": "最前线｜拓竹启动消费级UV打印机项目，已开放首批研发岗位", "url": "https://36kr.com/p/3947546313374851?f=rss", "summary": "<p>文｜张子怡</p>\n  <p>编辑｜袁斯来</p>\n  <p>36氪获悉，拓竹科技已启动消费级UV打印机项目，首批研发岗位近期已上线招聘。</p>\n  <p>8月19日，拓竹科技确认，公司已经启动消费级UV打印机项目。接近拓竹的知情人士称，目前项目已规划十余个岗位方向，覆盖喷头驱动、波形与墨路、材料验证以及软件协同等研发环节。</p>\n  <p>目前，拓竹官网已经开放UV打印技术专家、FPGA开发工程师、喷墨控制工程师、机械结构工程师（墨路系统）等岗位。从招聘要求来看，部分岗位要求候选人具备Epson、Ricoh、Xaar等主流喷头的选型或开发经验，并有工业、商用喷墨设备量产经历。</p>\n  <p>这意味着，继3D打印和激光加工之后，拓竹正在进入另一类数字制造设备——UV打印机。</p>\n  <p>UV打印目前主要应用于广告、包装、工业印刷等领域。相比普通家用打印设备，传统UV打印机的设备体积、价格和使用门槛都更高。新闻稿援引Mordor Intelligence数据称，2026年全球UV打印机市场规模约11亿美元，预计2031年达到15.8亿美元，2026年至2031年的年复合增长率为7.59%。</p>\n  <p>对于拓竹而言，进入这一市场的关键并不只是做出一台UV打印机，而是能否延续其此前在消费级3D打印机上的产品思路——把原本面向专业用户的设备缩小、降低操作门槛，并通过软硬件配合，让普通用户也能完成较复杂的制造流程。</p>\n  <p>过去一年，拓竹已经明显扩大了3D打印之外的产品边界。</p>\n  <p>2025年3月发布的旗舰产品H2D，在3D打印之外集成了激光切割与雕刻、数控刀切、绘图等加工方式。今年8月13日，拓竹又预热了激光产品R1。此次启动UV打印机项目后，拓竹目前公开推进的技术路线已经覆盖3D打印、激光加工和UV打印。</p>\n  <p>从这一系列产品动作看，拓竹正在尝试从一家3D打印机公司，向覆盖更多桌面制造方式的硬件公司延伸。</p>\n  <p>不过，与3D打印相比，UV打印涉及喷头、墨路、材料适配等新的技术体系。此次大规模招聘具备喷墨设备经验的工程师，也说明项目仍处于从团队和技术能力搭建向产品落地推进的阶段。至于首款消费级UV打印机的产品形态、价格和发布时间，目前拓竹尚未披露。</p>", "category": "tech", "published_at": "2026-08-20T07:32:13+00:00", "fetched_at": "2026-08-21T01:01:23.096850+00:00", "fingerprint": "f6e10b71232292f2"}, {"source": "36氪 - 最新文章", "title": "斗鱼26年Q2财报发布：总收入9.81亿元，毛利润同比增长12%", "url": "https://36kr.com/p/3947666391301504?f=rss", "summary": "<p>8月20日，斗鱼发布2026年第二季度未经审计财务报告。</p>\n  <p>本季度斗鱼总收入9.81亿元，环比增长19.4%，受本季度内容投入阶段性增长影响，第二季度GAAP净亏损为7235万元，调整后净亏损为1345万元。依托收入结构及运营成本效率提升，毛利润为1.59亿元，同比增长12%，毛利率为16.2%，同比、环比均有所改善。创新业务、广告及其他收入为4.78亿元，占总收入48.7%，同比增长0.4%，环比增长32.2%，连续六个季度占总收入比重40%以上。</p>\n  <p>斗鱼CEO任思敏表示：“第二季度，尽管外部环境仍存挑战，我们在多个方面取得了稳步进展。直播收入实现环比增长，用户参与度有所提升，进一步体现了我们核心直播生态的韧性。创新业务、广告及其他业务收入继续增长，反映出我们在收入多元化方面保持了良好势头。季度内，我们成功举办了斗鱼嘉年华，初步验证了自有IP在激活主播生态、提升品牌认知及深化厂商合作方面的长期价值。未来我们将继续采取聚焦且审慎的投资策略，同时持续提升活动及内容供给的质量、成本效率和变现能力。通过这些举措，我们将进一步夯实直播业务，并推动平台实现健康、可持续的增长。”</p>\n  <h2><strong>版权+自制双轨并进，持续深耕电竞内容矩阵</strong></h2>\n  <p>2026年第二季度，斗鱼累计完成63场版权电竞赛事转播，同步落地37场自制赛事及特色直播活动。平台通过覆盖头部版权与原创自制的多元电竞内容矩阵，充分满足核心用户的观赛需求，在持续优化用户观赛体验的基础上，稳步提升赛事运营效率与内容供给吸引力。</p>\n  <p>版权赛事方面，平台持续引入高关注度电竞内容，包括KPL春季赛、王者荣耀挑战者杯、CS2科隆Major等头部电竞系列赛事，在激活垂类分区热度的同时，推动赛事期间用户流量与平台运营表现提升。同时平台依托头部主播资源配套推出二路解说、轻量互动观赛活动，为用户提供了更多元的观赛选择，进一步提升了平台电竞内容供给的丰富度。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_8cb47010cd34498286b82e40be4cceba@242988687_oswg4392270oswg1982oswg1308_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">斗鱼线上线下生态正在齐头并进</p>\n  <p>自制赛事方面，斗鱼持续深化内容IP运营能力，围绕头部游戏品类和核心用户社区打造多元化的电竞直播内容。第二季度，平台推出三角洲行动鱼跃杯武神挑战赛、CS2妹力对决、斗鱼DOTA2宝可梦、英雄联盟驴酱杯和星际争霸2斗鱼嘉年华传奇邀请赛等自制赛事，依托主播联动参与、线下落地决赛及全周期系列化运营，在版权赛事之外形成有效内容补充，稳步提升平台社区整体活跃度。</p>\n  <h2><strong>直播收入环比增长，收入多元化协同赋能</strong></h2>\n  <p>本季度，斗鱼依托平台运营资源，推出一系列跨分区主播联动的PGC直播内容，包括伐木训练营S2、红蓝对抗赛等，通过不同分区主播优势互补，提升了直播效果与用户体验，其中伐木训练营S2吸引数千万用户观看，推动相关活动取得了良好的商业化成效。本季度斗鱼直播收入为5.03亿元，环比增长9.3%，进一步验证了“内容运营+商业转化”的协同效果，展现出斗鱼核心直播业务的长期运营韧性。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_0cb533ed0266414489fba97b40cd65cd@242988687_oswg1391038oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">电竞内容持续为平台带来新鲜热度</p>\n  <p>与此同时，创新、广告及其他收入4.78亿元，占总收入的48.7%，同比增长0.4%，环比增长32.2%，连续六个季度占总收入比重的40%以上。其中语音社交业务继续优化流量分发与资源配置效率，在商业化效率与社区生态健康之间保持平衡，第二季度收入2.72亿元，平均MAU为31.43万，月度平均付费用户为6.62万，展现出可持续的发展态势，协同推动平台营收结构优化升级。</p>\n  <h2><strong>战略加码重点自有IP，斗鱼嘉年华落地深化线下影响力</strong></h2>\n  <p>本季度，斗鱼加大重点自有IP项目投入，斗鱼嘉年华时隔7年重启，充分发挥平台以游戏为核心的社区优势、主播生态及内容运营能力，汇聚多家头部游戏厂商及行业生态伙伴，如《和平精英》《三角洲行动》《盛世天下》《猛兽派对》等，设置游戏展台、电竞赛事、主播互动、明星舞台等多元活动板块，为到场用户打造了超10万平方米的集游戏电竞互动、音乐演出于一体的综合线下体验空间。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_5aaa5d8a83eb4fe58e77b5cc4769f603@242988687_oswg3745022oswg1986oswg1302_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">斗鱼嘉年华</p>\n  <p>活动落地武汉4天共吸引游客超22万人次，外地游客占比达75%，进一步强化了平台与游戏厂商、主播、行业合作伙伴及核心用户的协同连接，成为各大品牌触达年轻群体、提升品牌影响力的优质场景，也打造出游戏文化与地方文旅深度融合的标杆案例。得益于Q2线上、线下内容及活动供给的持续完善，平台用户体验稳步优化，本季度平均MAU超4500万，环比增长2.6%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260820/v2_705ee455098848e3abeaf055734508e7@242988687_oswg2697066oswg1600oswg1067_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">斗鱼嘉年华</p>\n  <p>斗鱼副总裁曹昊表示：“第二季度，斗鱼总收入环比增长19.4%，同比降幅继续收窄。受收入结构优化及成本效率提升的推动，毛利润同比增长12%，毛利率提升至16.2%。本季度我们对重大品牌及内容活动进行了较为集中的投入，带动期间营业费用上升。展望未来，我们将继续坚持审慎投资，在支持内容生态和创新业务发展的同时，持续提升经营质量和财务韧性，推动盈利能力逐步改善。”</p>\n  <p>第二季度，斗鱼持续优化线上内容生态，推动斗鱼嘉年华等标杆自有IP线下落地，进一步优化用户和主播的社区生态，强化游戏厂商和行业伙伴的协同联动，积极拓展平台长期运营的价值空间。今后，斗鱼将继续以稳健的运营节奏，一步步夯实直播赛道的核心优势，驱动整体业务实现健康可持续发展。</p>", "category": "tech", "published_at": "2026-08-20T10:18:10+00:00", "fetched_at": "2026-08-21T01:01:23.096841+00:00", "fingerprint": "db2d7a14a19c647f"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨许家印被判处无期徒刑；宇树大跌，中签者说幸亏全卖了；云南已规定感染艾滋病要告知配偶", "url": "https://36kr.com/p/3948502822550665?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>免部署一键调用，国家超算互联网上线GLM-5.3 API</li>\n   <li>商务部回应美征收无人机关税问题</li>\n   <li>上海市调整商业性个人住房贷款最低首付比例政策</li>\n   <li>台积电A16工艺完成开发验证，目标Q4量产</li>\n   <li>“大空头”伯里唱空英伟达，力挺AI芯片新秀Etched</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>许家印被判处无期徒刑，恒大集团、恒大地产等案一审宣判</strong></p>\n  <p>2026年8月20日上午，广东省深圳市中级人民法院对被告单位恒大集团有限公司（以下简称恒大集团）、被告单位恒大地产集团有限公司（以下简称恒大地产）、被告人许家印案进行一审公开宣判。对恒大集团数罪并罚，判处罚金人民币88.2亿元；对恒大地产判处罚金人民币70亿元；对许家印数罪并罚，判处无期徒刑，剥夺政治权利终身，并处没收个人全部财产；对违法所得继续追缴，不足部分责令退赔。（央视新闻）</p>\n  <p><strong>宇树大跌19%，有中签者说幸亏全卖了</strong></p>\n  <p>8月20日，宇树科技低开6.51%，截至收盘，宇树科技大跌近19%，总市值跌破2800亿元。8月19日，该股以1100元/股、629%的涨幅开盘，中一签最高浮盈超47万元，但开盘后股价迅速从高点回落，震荡加剧。面对8月20日行情，多位首日清仓的中签者直言“庆幸”。炒股七八年的李萌（化名）对中新经纬表示：“本来还感觉卖少了亏了，今天再回看，幸亏全卖了！”她回忆，若开盘时挂低点卖出可赚40多万元，最终她在股价回落至899元附近时分两笔卖出，500股净赚超37.32万元。李萌透露，这笔收益将用于配置国债或定期理财，她也会继续坚持打新。</p>\n  <p>另一名福建中签者小枝也在上市首日清仓，获利约38万元。她表示自己一贯坚持“首日即卖”的策略，此前中签的皓元医药曾赚13万多，近期又连续中签长鑫和宇树，“我偏财运挺好的”。不过她明确表示不会再入手宇树科技，“钱取出来直接用，不打算继续买票了。” （中新经纬、第一财经）</p>\n  <p><strong>云南已规定感染艾滋病要告知配偶，律师称是否告知感染艾滋病暂无全国性规定</strong></p>\n  <p>8月20日，“艾滋病检测结果不得告知配偶”，登上热搜引发网友热议。有网友发帖称，“为保护艾滋病患者隐私，请本院医生严格遵守我国法律法规。不得将艾滋病检测结果告知其配偶以及家属。九派新闻记者注意到，2021年3月1日起实施的《云南省艾滋病防治条例》，其中第二十条规定：感染者和病人应当将艾滋病病毒的事实及时告知其配偶或性伴侣，本人不告知的，医疗卫生机构有权告知；第五十七条规定：感染者不及时将感染艾滋病病毒的事实告知其配偶、有性关系者等存在暴露风险的人群，将被依法追究刑事责任。</p>\n  <p>浙江五联律师事务所张建齐律师表示，根据现行《艾滋病防治条例》，医疗机构及相关知情方在未经患者本人同意的情况下，负有保密义务，不得向外界披露其感染状况，此举旨在保障艾滋病患者的隐私权。同时，条例第三十九条明确要求感染者本人应主动将感染情况告知其配偶，这是对感染者自身设定的法定义务。有人问当医院通过检测发现患者感染艾滋病，而患者本人未履行告知义务时，医院应如何行事？张律师表示，目前全国性法律及行政法规对此尚无明确规定，即并未赋予医院主动告知配偶的权利。相反，条例对医院的保密责任作出了约束，强调未经患者同意，医院须为之保守秘密，不得擅自告知他人。因此，从权利与义务相统一的角度看，医院现阶段并不承担向患者配偶主动告知的法律义务。（九派新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI称ChatGPT.com注册和登录功能无法使用，正在修复中</strong></p>\n  <p>8月20日消息，OpenAI系统状态页面显示，ChatGPT.com的所有注册和登录功能目前均无法使用。该公司表示正在着手实施缓解措施。（界面新闻）</p>\n  <p><strong>百度文心助手推出任务引擎2.0，日活用户同比增长83%</strong></p>\n  <p>36氪获悉，8月20日，百度App发布多项产品升级。文心助手升级任务引擎2.0，覆盖用户群的高频场景，且完全免费。该任务引擎可根据用户目标自主规划与执行，全程无须人工干预。据悉，今年6月文心助手日活跃用户同比增长83%，日均对话轮次增长超过两倍。</p>\n  <p><strong>免部署一键调用，国家超算互联网上线GLM-5.3 API</strong></p>\n  <p>36氪获悉，8月19日，国家超算互联网上线智谱新一代基座模型GLM-5.3 API调用服务。企业和开发者无需繁琐环境配置，登录超算互联网即可一键调用该旗舰模型。</p>\n  <p><strong>稀宇科技推出MiniMax Design</strong></p>\n  <p>36氪获悉，据稀宇科技消息，公司推出MiniMax Design。MiniMax Design是一款把多模态模型能力变成真实可用的生产力的Harness。用户提出创作需求后，它能够理解目标、拆解任务、调用相应的模型与Skills，完成从素材处理、生成和编辑到最终交付的完整过程。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>商务部回应美征收无人机关税问题</strong></p>\n  <p>商务部新闻发言人何亚东在20日举行的例行新闻发布会上回应有关美征收无人机关税的提问时说，我们注意到美方对无人机及零部件征收232关税的决定。中方一贯认为，美方232措施是以“国家安全”为名实施单边主义、保护主义。事实上，中国对美出口无人机主要应用于农业、设备巡检、影视娱乐等民用场景。何亚东表示，美方232措施泛化国家安全概念，对贸易伙伴实施差异化关税税率，歧视性对待中国相关产品，严重损害中国企业利益，扰乱全球无人机产供链合作秩序，进一步破坏公平竞争的市场环境，中方对此坚决反对。我们敦促美方立即撤销232相关关税措施。（新华社）</p>\n  <p><strong>王兴兴：具身智能跨越ChatGPT时刻，关键在于模型与机器人对齐</strong></p>\n  <p>8月20日，在2026世界机器人大会主论坛上，宇树科技董事长、总经理兼首席技术官王兴兴表示，具身智能迈过ChatGPT时刻最核心的挑战是，AI模型的输入输出和真实机器人的对齐。（界面新闻）</p>\n  <p><strong>美股三大指数集体收跌，大型科技股普跌</strong></p>\n  <p>36氪获悉，8月20日收盘，美股三大指数集体下跌，纳指跌1%，道指跌1.31%，标普500指数跌0.86%。大型科技股普跌，亚马逊跌超2%，苹果、特斯拉、谷歌涨超1%，英伟达、微软、Meta小幅下跌；沃尔玛跌超9%，创下2022年5月以来最大单日跌幅。热门中概股多数下跌，爱奇艺跌超8%，网易跌近6%，微博跌超4%，哔哩哔哩跌超3%，蔚来跌超1%，百度、拼多多小幅下跌，阿里巴巴、理想汽车涨超1%，京东、小鹏集团小幅上涨。</p>\n  <p><strong>阿里吴泳铭：AI算力Capex投资回报确定性非常高，Capex投入三年内回本</strong></p>\n  <p>36氪获悉，8月20日，阿里巴巴集团发布2027财年第一季度财报，本季度，阿里AI相关产品年化收入（ARR）突破495亿元人民币（73亿美元），在阿里云外部商业化收入中的占比升至35%，AI相关产品毛利率显著高于云产品平均水平。在分析师电话会上，集团CEO吴泳铭表示，AI算力Capex投资回报确定性非常高，Capex投入可三年内回本。考虑到AI相关产品毛利率还在提升，未来有望缩短到2.5年回本甚至2年。</p>\n  <p><strong>寒武纪盘中跌破1000元关口</strong></p>\n  <p>36氪获悉，8月20日寒武纪盘中跌超5%，股价跌破1000元关口，最低探至995元。收1010.88元跌3.77%，自6月1620元高点回撤近40%。</p>\n  <p><strong>宇树科技王兴兴：公司正在推进让物理AI机器人模型自进化</strong></p>\n  <p>宇树科技董事长王兴兴在论坛上表示，过去多年，AI多用于编程和开发，但在机器人领域的应用仍显不足。所以公司最近一段时间在推动的事情就是，直接让物理AI机器人模型自进化。“就是使用目前最前沿的顶尖AI大模型来驱动，然后我们自己定一些规则，定一些经验，包括定一些约束和工具，让它自己去网上搜索最新的一些论文，最好的一些研究成果，最好的一些各种的一些开源方案，让它自己去编程，生成自己的机器的控制代码。”王兴兴说，控制代码生成以后，它可以在仿真环境里面运行，或者去生成一些、调用一些大模型，然后去控制一个实物机器人，在实物机器上做一些部署测试，然后进行评价和打分。（财联社）</p>\n  <p><strong>南京银行回应上半年信用减值损失同比上升：主要是考虑加大风险处置出清力度</strong></p>\n  <p>数据显示，截至6月末，南京银行不良贷款率较上年末下降0.01个百分点至0.82%；拨备覆盖率较上年末下降了7.51个百分点至306.11%；上半年信用减值损失同比增加34.77%。对此，南京银行独立董事强莹在2026年半年度业绩说明会上回应，上半年信用减值损失同比上升主要是考虑加大风险处置出清力度。未来公司将继续坚持长期稳健和高质量发展，以保持足够的风险安全垫与适度的盈利水平。作为公司独立董事，强莹表示，将积极参与公司科学决策，督促公司遵守国家法规政策，推进高质量转型，监督大股东与公司的利益冲突，保护中小股东权益，切实履行忠实和勤勉职责义务。（证券时报）</p>\n  <p><strong>2026年度票房超265亿，暑期档观影场次、人数再创新高</strong></p>\n  <p>据网络平台数据，截至目前，2026年度电影总票房（含预售），突破265亿元，观影人次超6.7亿，总场次超9600万。（央视新闻）</p>\n  <p><strong>上海市调整商业性个人住房贷款最低首付比例政策</strong></p>\n  <p>36氪获悉，中国人民银行上海市分行联合国家金融监督管理总局上海监管局印发《关于调整上海市商业性个人住房贷款最低首付比例政策的通知》，对上海市商业性个人住房贷款政策作出以下调整：优化个人住房信贷政策，调整二套房贷款首付比例下限。对购买外环外（包括原实施差异化政策区域）住房的，二套住房商业性个人住房贷款最低首付比例调整为15%，其他区域为25%。银行业金融机构应根据本通知规定的下限要求，结合本机构经营状况、客户风险状况等因素，合理确定每笔贷款的具体首付比例水平。在具体实施中，各家银行需充分考虑在途交易等因素，切实便民利民。本通知自2026年8月21日起施行。</p>\n  <p><strong>《黑神话：钟馗》超长实机演示首次曝光</strong></p>\n  <p>8月20日，黑神话在其官方微博发文称，由游戏科学开发的黑神话系列第二部作品《黑神话：钟馗》，今日带来全新15分钟游戏实机演示，首次展示主角战斗与部分剧情片段。文中表示，本视频为开发中版本录制，运行时屏幕宽高比设置为21:9。因产品仍处于研发早期，最终发售内容可能有所不同。</p>\n  <p>游戏科学创始人、CEO冯骥同日发布长文：“《黑神话：钟馗》的实机操作视频公开了，照例得说点什么，可又没法剧透。于是索性整理了游戏科学内部的一些工作原则，努力凑了十条，算是对过去从业的思考与回顾，也可看作对后续项目的提醒。”（第一财经）</p>\n  <p><strong>泡泡玛特王宁：公司将在未来6个月内启动20-50亿人民币的股份回购计划</strong></p>\n  <p>36氪获悉，泡泡玛特创始人王宁在中期业绩电话会上表示，未来六个月，集团将启动不低于20亿元、不高于50亿元的股份回购计划，这也是其首次在业绩会上公布股份回购计划。截至2026年4月，公司累计回购金额约17.44亿港元。</p>\n  <p><strong>三星晶圆代工技术蓝图调整，1.4纳米延后至2029年量产</strong></p>\n  <p>三星晶圆代工近期在SAFE Forum 2026论坛上更新技术蓝图，调整1.4纳米量产时间，目前已预告预定2029年量产，相关目标将晚于台积电约一年（台积电A14计划于2028年如期进入量产）。三星晶圆代工最初在2022年曾发布新闻稿预告，2纳米2025年量产以及1.4纳米2027年量产。（财联社）</p>\n  <p><strong>台积电A16工艺完成开发验证，目标Q4量产</strong></p>\n  <p>据报道，台积电已完成1.6nm级A16工艺开发与验证，计划今年第四季度量产。该工艺采用背面供电网络技术“超级电源轨（SPR）”，将电源与信号线路分离，从晶圆背面供电��以减少布线瓶颈、提升能效与性能，同时保持与现有设计的兼容性。A16瞄准AI与高性能计算市场。相较增强版2nm工艺N2P，A16在同等功耗下性能提升8%-10%，同等性能下功耗降低15%-20%，芯片密度提升8%-10%。A16被视为向1.4nm级A14过渡的中间节点，后者目标2028年量产。（新浪财经）</p>\n  <p><strong>OpenAI对抗Anthropic的最新举措：承诺不留存客户数据</strong></p>\n  <p>OpenAI承诺不会留存使用其人工智能模型的企业客户数据，同时提升产品安全能力，意在从竞争对手Anthropic手中抢夺客户。不少企业对Claude的开发方保存自身业务数据的做法感到不满。ChatGPT开发商于8月19日表示，已向部分客户开放新技术预览。该技术能够跨多轮模型交互行为识别行为模式与安全风险。以往AI安全系统只能对单条交互记录逐一监测，若不留存部分客户数据，就很难保障工具得到合规使用；新方案旨在突破这一局限。（新浪财经）</p>\n  <p><strong>三星据悉将公布100万亿韩元股东回报计划</strong></p>\n  <p>8月20日，据报道，三星将公布100万亿韩元股东回报计划。（界面新闻）</p>\n  <p><strong>比特币逼近7万美元，空头单日爆仓规模创历史新高</strong></p>\n  <p>受比特币价格快速拉升影响，加密货币市场空头遭遇创纪录的集中平仓。据市场数据显示，在截至本8月20日的24小时内，空头头寸平仓总额达约27.4亿美元，超过2025年10月市场暴跌期间的空头损失，创下自2021年有记录以来的最大单日空头平仓规模。CoinGlass数据显示，比特币价格在亚洲交易时段一度触及近69900美元，较8月19日低点约64100美元反弹逾5700美元，为6月初以来首次触及该水平。截至发稿，比特币报于69100美元上方，24小时涨幅约8%。（新浪财经）</p>\n  <p><strong>“大空头”伯里唱空英伟达，力挺AI芯片新秀Etched</strong></p>\n  <p>“大空头”迈克尔·伯里再次唱空英伟达，称AI芯片公司Etched是其严峻竞争对手，后者芯片性能提升10倍、成本更低。Etched约15%员工来自英伟达，8月18日完成7亿美元融资估值210亿美元，其芯片仅用44天投入运行。（财联社）</p>\n  <p><strong>SK海力士与工会就薪酬和奖金达成初步协议</strong></p>\n  <p>据报道，SK海力士与工会达成了一项初步的工资和奖金集体谈判协议，其中包括6.3%的加薪以及对其利润分享奖金制度的调整。根据拟议方案，40%的利润分享奖金将以现金形式支付，60%以股票形式支付。在股票奖金中，40%的股票可在授予的同一年出售，剩余20%将延期出售。协议还包括增加员工福利积分。工会计划尽快举行代表投票，以最终敲定该协议。（新浪财经）</p>\n  <p><strong>美光在美设立研究实验室，未来十年将提供100亿美元投资支持</strong></p>\n  <p>美光科技宣布在美国爱达荷州成立美光研究实验室，将在未来十年提供100亿美元投资支持。该实验室旨在支持关键技术领域的前沿研究，涉及关键存储技术、先进存储和计算架构、封装以及未来半导体制造等。（界面新闻）</p>\n  <p><strong>富士康紧急招工冲刺iPhone18量产</strong></p>\n  <p>8月20日，苹果秋季发布会在即，代工厂富士康正大规模紧急招工，入职最高返费7800元，多家招聘平台的招聘信息后打上了“急聘”“急招”标签。8月20日，从深圳富士康招聘主管处获悉，苹果新品即将上市，工厂正处于招聘旺季。据闽南网援引公开信息，苹果预计9月9日举行秋季特别活动，打破近20年“全系齐发”惯例，仅推出iPhone18 Pro、iPhone18 Pro Max及首款折叠屏iPhone三款高端机型，标准版iPhone18推迟至2027年春季发布。（红星资本局）</p>\n  <p><strong>Anthropic首次公开募股规模料追平甚至赶超SpaceX创下的纪录</strong></p>\n  <p>Anthropic PBC预计其IPO规模将至少达到SpaceX创下的纪录水平，甚至可能更高。消息人士透露，Anthropic正在测算相关数据，准备最快于本月底公开提交潜在大型IPO的文件。近期由首席财务官Krishna Rao牵头的投资者说明会并未正面谈及估值问题。数据显示，SpaceX在IPO初始阶段募资750亿美元，创下全球新股发行规模纪录。若计入超额配售选择权，最终募资规模增至862亿美元。（财联社）</p>\n  <p><strong>美国会工作人员用AI起草法案藏隐患</strong></p>\n  <p>据美国《政治报》近日报道，越来越多的美国国会工作人员和外部团队开始使用人工智能起草立法提案，但这些提案往往错误百出，存在法律条文引用错误、法律定义混乱、措辞不当等问题。曾就职美国国会立法顾问办公室的韦德·巴卢表示，“美国政府各个部门都已开始应用人工智能工具，但将这种容易出现错误的技术直接应用在法律文本上，可能造成极大的隐患。（CCTV国际时讯）</p>\n  <p><strong>谷歌旗下Waymo据悉为其无人出租车自研定制芯片</strong></p>\n  <p>8月20日，据报道，谷歌旗下Waymo自研了一款定制芯片，旨在提升其无人出租车的性能，并将芯片供应来源从英伟达等第三方公司拓展至自研渠道。这款专用集成电路（ASIC）芯片已在Waymo最新一代无人出租车中投入量产，将提升车辆的反应速度和导航能力。Waymo表示，该芯片算力超过1000 TOPS，采用台积电5纳米工艺制造。（界面新闻）</p>\n  <p><strong>SpaceX完成今年第100次火箭发射，此次任务将把24颗SpaceX星链互联网卫星送入近地轨道</strong></p>\n  <p>美国东部时间8月19日凌晨12时01分，一枚猎鹰9号火箭从美国加利福尼亚州范登堡太空军基地发射升空。这是SpaceX今年进行的第97次猎鹰9号发射，也是公司2026年完成的第100次发射任务。SpaceX今年的大多数发射任务都用于扩充星链卫星网络，目前这一庞大的卫星星座已经拥有近1.1万颗正在运行的卫星。截至目前，SpaceX今年已有74次发射任务用于部署星链卫星。</p>\n  <p>如果一切按照SpaceX的计划推进，未来几年这一数字还将大幅增长。SpaceX创始人兼CEO埃隆·马斯克曾表示，公司希望让星舰实现每天多次发射，从而将年发射次数提升至约1000次。（IT之家）</p>\n  <h2>上市进行时</h2>\n  <p><strong>君乐宝更新招股书</strong></p>\n  <p>36氪获悉，据港交所文件，8月20日，君乐宝乳业集团股份有限公司已重新向港交所提交上市申请书，联席保荐人为中国国际金融香港证券有限公司、摩根士丹利亚洲有限公司。</p>\n  <h2>大公司财报</h2>\n  <p><strong>阿里巴巴发布2027财年第一财季财报</strong></p>\n  <p>36氪获悉，阿里巴巴发布2027财年第一季度财报。财报显示，第一季度阿里巴巴营收2690亿元，上年同期营收2476.52亿元。其中，阿里云外部商业化收入加速增长45%，增速创22个季度新高；经调整EBITA同比增长133%，EBITA利润率增至12%；AI相关产品收入连续第十二个季度实现三位数同比增长，AI已成为云增长的确定性引擎。大消费方面，即时零售收入同比增长45%，淘宝闪购市场份额稳固，UE环比持续改善。</p>\n  <p><strong>泡泡玛特：上半年营收171.7亿元，同比增长23.8%</strong></p>\n  <p>36氪获悉，泡泡玛特发布2026半年报，上半年实现营收171.7亿元，同比增长23.8%。经调整后净利润51.6亿元，调整后净利率为30%，毛利率69.7%。半年报披露，泡泡玛特在全球运营676家线下门店与2827台机器人商店，全球累计注册会员数量超1亿人。其中，中国市场共经营门店455家，营收为122亿元，实现了47.3%的增长。</p>\n  <p><strong>中国电信：2026上半年净利润195.88亿元，同比下降14.9%</strong></p>\n  <p>36氪获悉，中国电信公告，2026上半年营收2590亿元，同比下降3.9%；上半年净利润195.88亿元，同比下降14.9%。</p>\n  <p><strong>网易：第二季度营收301亿元，同比增长7.9%</strong></p>\n  <p>36氪获悉，网易发布2026年第二季度财报。财报显示，二季度网易实现营收301亿元，同比增长7.9%；归属于公司股东的净利润70亿元。营业利润121亿元，去年同期91亿元；研发投入46亿元，研发投入强度15%。其中，游戏及相关增值服务净收入250亿元，同比增长9.7%；有道净收入15亿元，连续八个季度经营利润为正；网易云音乐净收入20亿元，同比持平。</p>\n  <p><strong>网易云音乐：上半年营收40亿元，同比增长3.4%</strong></p>\n  <p>36氪获悉，网易云音乐发布2026年上半年业绩，上半年营收40亿元，同比增长3.4%，毛利率提升至37.2%。上半年，网易云音乐DAU/MAU比例保持在30%以上，且同比和环比均呈上升趋势。</p>\n  <p><strong>雅诗兰黛集团：2026财年销售额150亿美元，同比增长5%</strong></p>\n  <p>36氪获悉，雅诗兰黛集团公布2026财年第四季度及全年财报，全年有机销售额增长3%，销售额150亿美元增长5%。第四季度有机销售额增速加快至5%，并连续四个季度实现增长。毛利率增加150个基点至75.5%，调整后每股收益率增长66%至2.51美元。中国大陆市场有机净销售额第四季度增长7%，全年增长9%。中国大陆市场有机净销售额第四季度增长7%，全年增长9%。</p>\n  <p><strong>燕京啤酒：上半年净利润13.99亿元，同比增长26.86%</strong></p>\n  <p>36氪获悉，燕京啤酒公告，2026年上半年实现营收90.31亿元，同比增长5.53%；归母净利润13.99亿元，同比增长26.86%。</p>\n  <p><strong>沃尔玛二季度营收1879.4亿美元，同比增加5.9%</strong></p>\n  <p>沃尔玛8月20日公布二季度营收1879.4亿美元，同比增加5.9%，预估1868.7亿美元；调整后每股收益0.81美元，预估0.74美元；经营现金流197亿美元；预计全年调整后每股收益2.80美元至2.87美元，此前预计2.75美元至2.85美元，预估2.90美元。（界面新闻）</p>\n  <p><strong>科大讯飞：上半年营收116.23亿元，同比增长6.52%</strong></p>\n  <p>36氪获悉，科大讯飞披露2026年半年报。财报显示，今年上半年，公司实现营收116.23亿元，同比增长6.52%；归母净利润同比增长14.68%；研发投入30.07亿元，同比增长25.73%。此外，公司上半年销售回款总额118.96亿元，较去年同期增长超15亿元。</p>\n  <p><strong>李宁：上半年营收152.4亿元，同比增长2.8%</strong></p>\n  <p>36氪获悉，8月20日，李宁公司发布2026年中期业绩，营收达152.4亿元，同比增长2.8%。毛利为77.5亿元，较去年同期上升4.5%；整体毛利率为50.9%，同比提升0.9个百分点；净利润18.2亿元，净利率11.9%。</p>\n  <p><strong>中国平安：上半年净利润925.85亿元，同比增长36.1%</strong></p>\n  <p>36氪获悉，中国平安公告，2026年上半年实现营收6153.51亿元，同比增长12.6%；归母净利润925.85亿元，同比增长36.1%。</p>\n  <h2>投融资</h2>\n  <p><strong>“原子矩阵”完成数亿元人民币A+轮融资</strong></p>\n  <p>36氪获悉，杭州原子矩阵计算有限公司（MatriQ，下称“原子矩阵”）宣布完成数亿元人民币A+轮融资。本轮由云锋基金、三七互娱、普华资本、财通资本、上海半导体产投、唐兴资本、博睿资本、合创资本、海邦投资等多家机构联合投资，老股东民银国际持续加注。</p>\n  <p><strong>“钛动科技”完成新一轮融资</strong></p>\n  <p>36氪获悉，AI营销科技公司“钛动科技”宣布完成新一轮融资。本轮融资由华泰泛大西洋基金领投，鲲鹏光远、广汽资本、金沙江创投等机构跟投。</p>\n  <h2>酷产品</h2>\n  <p><strong>宇树发布仿生7轴灵巧机械臂，售价9900元起</strong></p>\n  <p>36氪获悉，宇树科技发布仿生7轴灵巧机械臂，采用高精度七轴仿生关节，售价9900元起，自重5.5kg。</p>\n  <p><strong>三星宣布将于下周发布Galaxy S26最新机型</strong></p>\n  <p>韩国三星电子公司8月20日表示，将于下周发布其Galaxy S26智能手机系列的最新机型。该公司表示，发布会将于8月27日在线举行。三星未直接公布该产品的名称，但据传即将发布的设备为Galaxy S26 FE。（新浪财经）</p>\n  <p><strong>鸿蒙智行正式发布享界G9</strong></p>\n  <p>36氪获悉，鸿蒙智行正式发布享界G9，首发华为全地形途灵平台、鸿蒙智行智能全地形系统、800V全主动可断开稳定杆，搭载华为星河通信3.0天地网。</p>\n  <p><strong>整理</strong>｜葡萄</p>", "category": "tech", "published_at": "2026-08-20T23:44:54+00:00", "fetched_at": "2026-08-21T01:01:23.096825+00:00", "fingerprint": "33b6ec8679335982"}, {"source": "少数派", "title": "派早报：石头发布 A30 Pro Steam 3.0 洗地机、Framework 升级 Laptop 12 笔记本", "url": "https://sspai.com/post/113638", "summary": "哈浮 VERSA 飞行口袋云台相机发布，OpenAI 回应少量 Codex 用户调用 GPT-5.6 系列 AI 模型误删文件问题等。<a href=\"https://sspai.com/post/113638\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-20T00:46:04+00:00", "fetched_at": "2026-08-21T01:01:21.337631+00:00", "fingerprint": "12caf3b954241f9d"}, {"source": "少数派", "title": "「务实且高效」的日系次旗舰：夏普 AQUOS R9 评测", "url": "https://sspai.com/post/113497", "summary": "在 R9 身上，我竟依稀能感到夏普正在谋求一种仰望星空和脚踏实地间的精妙平衡。<a href=\"https://sspai.com/post/113497\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-20T02:41:31+00:00", "fetched_at": "2026-08-21T01:01:21.337625+00:00", "fingerprint": "00cf538a23587ba4"}, {"source
