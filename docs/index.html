re reliable and structured responses that are easier to scan, according to Microsoft. The redesign, which is rolling out across desktop and mobile devices, comes [&#8230;]", "category": "tech", "published_at": "2026-05-28T20:14:07+00:00", "fetched_at": "2026-05-29T02:48:42.544830+00:00", "fingerprint": "1dd18e5ec70038e3"}, {"source": "The Verge", "title": "Nintendo&#8217;s newest WarioWare is a weirdo smartphone app", "url": "https://www.theverge.com/games/939283/pictonico-nintendo-mobile-game", "summary": "A decade ago, Nintendo made a big splash into the world of mobile gaming with a new Super Mario platformer directed by none other than Shigeru Miyamoto. But even though the game proved popular, it wasn't the success the company had hoped for. Over the ensuing years Nintendo has slowly retreated from smartphone gaming, with [&#8230;]", "category": "tech", "published_at": "2026-05-28T20:16:16+00:00", "fetched_at": "2026-05-29T02:48:42.544821+00:00", "fingerprint": "f3fbea45fe25af7d"}, {"source": "36氪 - 最新文章", "title": "半年访谈600+用户、获千万元融资，这名清华毕业生想把脑机“戴”进运动场｜早期项目", "url": "https://36kr.com/p/3827323136004992?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>“运动场景中的脑状态监测，正在成为高水平训练和运动健康管理中的新需求。”创业两年，张昊天这样判断。</p>\n  <p>张昊天毕业于清华大学，研究生期间开始探索如何将脑机接口技术应用在C端场景。他坦言，自己最初也没想好具体的落地方向，研究过程中，团队陆续接触过一些运动类企业，发现“重视运动表现结果的场景，对大脑状态监测都存在一定需求”。</p>\n  <p>运动健康类可穿戴设备的需求其实早已得到验证，估值百亿美元、从极客圈火到大众市场的Whoop、Oura就是最好的说明。它们用心率、血氧等多项生理数据指标证明，监测身体状态能提升运动表现和恢复效率，也让大众逐步形成为科学运动数据付费的习惯。</p>\n  <p>但张昊天认为，目前，市面上的可穿戴设备主要通过四肢末梢数据反映身体侧状态，很难直接观察运动过程中的专注、压力、神经疲劳等脑状态变化，而脑状态是运动训练和比赛中“高度影响发挥、却长期看不见”的关键状态变量。</p>\n  <p>“运动不只是身体能力的竞争，也是一场关于大脑状态的竞争。对于水平接近的运动员来说，成绩差距不只来自体能、技巧本身，大脑状态也很关键。比如射击运动，最终胜负往往取决于扣动扳机时的瞬时专注力、抗压能力与情绪状态。”</p>\n  <p>即便是在非竞技类的普通运动人群中，这种影响同样存在。张昊天介绍，团队曾在半年时间里访谈了超过600位运动类用户，“我们发现，几乎所有受访者都出现过‘无实际肌肉损伤、但训练状态明显不对’的情况，进一步追问，‘脑子累’‘不想练’‘越练越差’是高频反馈。用户普遍希望有工具帮助他们理解训练中的主观状态变化”。</p>\n  <p>当前，职业体育圈一般会通过配备运动心理师的方式应对这类问题，但依赖人工评估的模式成本高、时效差、主观性强，更无法覆盖大众运动人群。</p>\n  <p>那么，如果能在运动中稳定采集脑电信号，并结合补偿算法进行质量判断，就有机会更直接地观察影响运动表现的脑状态变化。</p>\n  <p>因此，2024年毕业后，张昊天团队正式创办了“脑回录（Nanoloop）”，希望将非侵入式脑机接口技术融入进一款“智能运动头带”Nuromova N1，通过采集运动中的前额脑状态数据，结合多模态传感和AI算法，将脑状态趋势转化为直观且可理解的训练反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_ee326ab61e7b4f10b024de9265a49777@5930287_oswg4369581oswg3200oswg2400_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：脑回录（Nanoloop）</p>\n  <p>据介绍，这其中的难点不在于采集脑电本身，而是在运动场景下识别并剔除伪影，判断哪些数据真正可用。面对脑电伪影和噪声，Nuromova试图通过电极结构、噪声识别与信号补偿、SQI质量评估、算法剔除和个体基线来提升可用性。</p>\n  <p>Nuromova N1通过监测与注意调节、认知负荷和情绪相关过程有关的前额区域，结合脑电特征和个体基线，对状态趋势进行计算，识别疲劳、专注力、压力、情绪波动等状态趋势，在基础指标之上，系统会形成训练有效性、压力承受状态、恢复趋势等复合指标。</p>\n  <p>通过这些数据，Nuromova N1能够帮助运动者纵向观察自身状态变化，为训练复盘和计划调整提供参考。目前，Nuromova N1分为教练端和C端两个应用版本。</p>\n  <p>以教练端产品为例，从长周期看，教练训练学员需覆盖体能、技术、心态等多个维度。有了脑状态数据辅助后，能更有针对性地精细化管理训练计划，合理安排训练内容与节奏，不再依赖“高强度硬练”的传统方式。</p>\n  <p>从单次训练前、中、后的短周期看，训练前，中枢神经状态直接影响肌肉协调性、爆发力等。“我们的设备通过采集脑电，观察中枢神经相关状态与认知表现趋势，AI教练会帮助提供相关的数据解释，提供反馈建议，帮助用户通过冥想、拉伸、认知训练等方式，在热身前更好地进入训练状态。”</p>\n  <p>训练中，设备会以不打扰用户的方式观察、记录数据，不影响用户专注于运动表现。</p>\n  <p>训练后，数据则可用于复盘与恢复。比如，复盘时，可通过周期数据对比分析训练问题；而恢复是运动训练的核心课题，通常情况下，恢复不仅依赖睡眠、饮食，也与压力管理、放松训练和训练节奏有关。依托脑状态数据，用户可以结合呼吸、冥想、拉伸、放松训练、睡眠调整等方式进行恢复管理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_f2b2bac4df8641e8af55141dad7abca2@5930287_oswg259965oswg1600oswg900_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：脑回录（Nanoloop）</p>\n  <p>张昊天认为，这些运动场景的数据和经验积累，如脑电数据、脑电-运动表现模型、硬件研发经验等，会成为脑回录未来的核心资产。“非侵入式脑机接口普遍存在运动伪影、噪声干扰，运动场景尤其如此。我们通过算法补偿、噪声剔除技术，能获取满足运动场景需求的有效信号。理论上，运动场景对信号稳定性要求更高，相关工程能力未来有机会迁移到更多日常状态管理场景。”</p>\n  <p>目前，脑回录团队累计已积累约500小时多模态数据，包含脑电、IMU、训练事件和主观反馈等维度，覆盖射击、高尔夫、自行车、摔跤、篮球等运动场景。此外，公司已与清华大学、北京体育大学、首都体育学院等高校院所，以及部分运动数据服务商开展合作，并开始获得来自运动爱好者和早期用户的C端订单；同时，海外市场推广也在规划中。</p>\n  <p>另据了解，近期，脑回录已完成由南山战新投投资的千万元级种子+轮融资。募集资金主要用于核心技术迭代、产品工程化落地及市场拓展等，以加速非侵入式脑机接口穿戴设备在运动场景中的规模化商用。</p>", "category": "tech", "published_at": "2026-05-29T00:30:00+00:00", "fetched_at": "2026-05-29T02:48:42.413595+00:00", "fingerprint": "101a6019dc985d82"}, {"source": "36氪 - 最新文章", "title": "「卡玺CardChic」  获天使轮融资，以中国文化IP＋精品化打造收藏卡品牌 | 36氪首发", "url": "https://36kr.com/p/3829202710045827?f=rss", "summary": "<p>文 | 小葵</p>\n  <p>编辑 | 刘士武</p>\n  <p>36氪获悉，<strong>专注于中国文化IP的精品卡牌发行品牌「卡玺CardChic」近日已完成近千万级人民币天使轮融资。本轮资金将用于重磅IP的签约储备、产品工艺升级以及新一代TCG对战卡牌的研发与推广。&nbsp;</strong></p>\n  <p>卡玺CardChic创办于2025年，总部位于杭州。核心团队中，创始人李昌林毕业于新加坡南洋理工大学，高中起连续创业，研究生期间创办广告公司并实现年营收近千万元，成功退出后曾加入腾讯；供应链合伙人拥有20年印刷行业经验；运营合伙人在国内卡牌圈深耕四年，个人收藏卡价值达数千万元；团队具备球星卡、PTCG、国产卡等多种卡牌品类的丰富经验。公司主要业务为影视、动漫等中国文化IP的精品收藏卡牌发行。&nbsp;</p>\n  <p>当前国内卡牌行业呈现分层竞争格局：卡游凭借小马宝莉、奥特曼等IP在线下零售渠道做到单品10亿级以上销售规模；HitCard专注影视收藏卡，以线上销售为主；Kakawo深耕迪士尼系列卡牌，其母公司Suplay正运作上市；闪魂于2025年获得亿元级天使轮融资，推出符文战场TCG卡牌；集卡社则聚焦二次元动漫IP，近期完成了接近20亿估值的融资。&nbsp;</p>\n  <p>面对这样一个巨头和垂类玩家林立的市场，卡玺CardChic选择了差异化路线，以具有强中国文化代表性的影视、动漫IP为内容核心，走高端工艺和差异化市场，定制精品收藏卡牌。&nbsp;</p>\n  <p>具体到业务端，团队选择以卡牌发行为核心切入收藏卡市场，其中周星驰《大话西游》纪念收藏卡作为首款产品，在上线7天实现了数千万GMV并售罄，获得国际知名评级机构PSA认可，成功在收藏卡领域建立起了品牌认知。目前，卡玺CardChic正在持续加码头部IP储备，已签约《凡人修仙传》等头部国漫IP，为进一步夯实内容矩阵奠定了基础。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_c0ee8964300943b5a4c16d14e79e9b63@242988687_oswg153162oswg1080oswg659_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《大话西游》纪念收藏卡</p>\n  <p>李昌林表示，国内收藏卡行业长期面临IP授权分散、产品生命周期短等挑战，多数项目在发行一弹后便难以为继。“中国需要像宝可梦一样具备长期生命力的卡牌IP，而这背后依赖的是对IP的深度运营，不仅仅是快速发行，而是给用户提供真正有价值的收藏级产品，并持续构建用户线下互动生态。”</p>\n  <p>李昌林告诉36氪，卡玺CardChic的解法是坚持精品化路线，只选择团队基因里真正喜欢的且具有强故事性的IP，同时和IP方价值观高度一致，将电影、动漫的经典叙事与情感融入产品设计，为用户提供兼具情绪价值和长期收藏属性的卡牌作品，并以此反哺IP方，延长IP的生命周期。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_58cb4b16059146609931f5adae6d8f77@242988687_oswg52166oswg707oswg489_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《大话西游》</p>\n  <p>为从根本上解决收藏卡项目持续性不足的问题，卡玺CardChic于今年正式启动TCG对战卡牌、AI陪伴潮玩、联合IP孵化、自有工厂投资、核心线下体验场景店等布局，计划通过玩法驱动形成长期活跃的玩家生态。李昌林认为，只有当卡牌成为承载社交和经济的载体，IP的生命周期才能被真正激活，才有机会沉淀出属于自己的文化符号。&nbsp;</p>\n  <p>渠道层面，卡玺CardChic目前采用“线上为主，线下为辅”的销售策略。线上拆卡直播间是主要的出货阵地，能够高效消耗大量货品；线下则覆盖KA门店与潮玩零售渠道，同时针对不同产品属性匹配不同的发售方式——周星驰《大话西游》纪念收藏卡主要在线上直播间触达核心收藏用户，而定价相对亲民的“草莓音乐节”则选择在音乐节现场发售。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_f74ab8e712b14bd5913c6e925f813965@242988687_oswg2022745oswg1080oswg1437_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">草莓音乐节限定收藏卡</p>\n  <p>融资完成后，卡玺CardChic将在四个方面重点投入：持续锁定具有中国文化代表性和强故事性的头部IP，扩大核心IP储备；升级产品工艺与设计能力，建设工厂产线，在收藏价值与视觉体验上建立更高的壁垒；加速对TCG对战卡牌的研发，争取在国产卡牌赛道中走出一条从“短期爆发”到“长线运营”的差异化道路；联合知名IP厂商孵化自有优质IP，内部孵化AI潮玩等更多情绪价值产品。</p>\n  <p>李昌林表示，团队不希望卡玺CardChic是一个追逐IP风口的发行品牌，而是一个能真正陪伴IP长期生长、与玩家共同构建收藏文化的卡牌品牌。</p>\n  <p class=\"editor-note\">本文首发自微信公众号“36氪游戏”。</p>", "category": "tech", "published_at": "2026-05-29T01:01:06+00:00", "fetched_at": "2026-05-29T02:48:42.413590+00:00", "fingerprint": "7d19164e7502cec4"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 李泽湘系投过的星空摄影设备品牌再获数百万美金融资，产品即将登陆众筹", "url": "https://36kr.com/p/3829705374098823?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，星空原野（重庆）科技有限公司（以下简称“星空原野”）近日完成新一轮融资，由线性资本独家投资数百万美金，安可资本担任公司独家财务顾问。此前公司曾获明月湖国际智能产业科创基地（XbotPark 重庆）孵化基金，及重庆市种子投资基金投资。</p>\n  <p>星空原野成立于2024年，是一家聚焦星空摄影设备和智能影像解决方案的创新型科技企业。公司以星野摄影为切入点，正在探索新一代星野 Robot Camera：通过软硬件一体化，把过去依赖专业设备、复杂参数和电脑后期的星空创作流程，转化为普通用户也能完成的移动影像体验。</p>\n  <p>星空原野创始人周少阳是智能硬件领域连续创业者，长期从事机器人系统与智能硬件产品的研发与落地，拥有完整的产品化经验。与此同时，周少阳拥有十余年星空与风光摄影经历，是视觉中国签约摄影师。登山、摩托骑行与户外旅行的爱好让他对星野摄影场景、户外拍摄流程以及用户需求能够形成更深入的理解。</p>\n  <p>星空摄影主要分为深空与星野两类。深空摄影偏向专业化创作，依赖长焦镜头、赤道仪、天文望远镜及高精度长时间曝光，评价体系涉及导星精度、信噪比、后期处理等较高门槛，理解和传播范围相对有限。</p>\n  <p>相比之下，星野摄影以广角视角为核心，将星空与地景、人物、建筑、旅行和生活方式相结合，强调“人在天地之间”的真实体验。它既可呈现露营、公路旅行等场景，也适合社交媒体上的风光作品。由于画面直观、情绪感染力强、审美门槛低，具备更广泛的大众传播能力，是星空摄影中覆盖人群最广、最易向泛摄影与大众创作扩展的方向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_5300472413dc4567b280bb19b963bdb8@5920579_oswg778107oswg866oswg576_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>周少阳介绍称，尽管星野摄影的作品呈现接近最终成果，但其创作过程极为复杂，90%的难度集中在技术执行而非美学表达，形成了“低审美门槛、高创作门槛”的矛盾。这正是星空原野希望解决的痛点——通过便携化智能设备，降低星野摄影的门槛。</strong></p>\n  <p>团队首款产品ASTERRA-Z为轻量化赤道仪，在星空摄影中，赤道仪用于抵消地球自转以实现长曝光拍摄。然而，传统赤道仪源自天文观测需求，体积大、重量重，不适用于移动拍摄。</p>\n  <p><strong>公司的赤道仪产品于2024年底推出，2025年升级为Z Plus版本，在摄影社区尤其是星野KOL中获得广泛认可，主要用户为准专业摄影师。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_a60dfe64b5514463bba74c2d3705c1ee@5920579_oswg200648oswg875oswg656_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>在完成首款产品私域用户积累的同时，星空原野也在进行首款星野robot camera的研发。</strong>周少阳表示，普通用户即使手机已具备拍星能力，仍因需额外购买并掌握赤道仪而望而却步，因此未来方向是“跨越赤道仪”，将其功能内嵌至更易用的设备中。</p>\n  <p><strong>新产品采用全新的多轴云台架构，机身尺寸仅略大于 DJI Pocket 3 系列，在保持便携性的同时，可实现远超传统云台的运动能力。</strong>除常规稳定功能外，其复合运动系统可模拟赤道仪跟踪逻辑，用户无需复杂设备、专业调校或天文摄影经验，即可一键完成星空跟踪拍摄。</p>\n  <p>它首次将过去属于少数专业玩家的星野摄影能力，降低到普通摄影用户甚至完全零基础小白都能够轻松进入的门槛，让星野创作从“小众技术”变成一种大众化的影像体验。</p>\n  <p>围绕星野摄影这一特殊赛道，产品也进行了更贴近需求的设计，例如，传统云台不利于长曝光，因浮动结构易产生抖动。新设备通过独特机构设计提升静态稳定性，确保长时间曝光清晰。在城市里的星空拍摄场景，由于星空跟城市的光污染波段接近，星空光线被遮盖，新设备通过特殊的光路设计，拓展用户可以实践的拍摄场景，在城市中捕捉银河和星空。</p>\n  <p>公司还同步进行了软件开发，AI智能体ASTRA Bot分为两部分：一是创作建议系统，基于位置、时间、天气、月相等数据，主动提示用户“何时、何地、能拍什么”，例如“今晚海边可能出现银河与灯塔同框”“凌晨的雾气适合低角度人物剪影”等，让用户在真实世界中不断发现值得创作的瞬间，在此基础上进一步提供自动化拍摄规划与参数建议，帮助用户完成作品。</p>\n  <p>二是图像处理引擎，将过去复杂且专业化的星空摄影后期流程全面自动化。系统可在手机端一键完成堆栈降噪、天地拼接、色彩还原、星空增强、全景拼接等复杂处理，甚至支持流星雨合成、多张素材自动融合等传统上需要电脑与专业软件才能完成的工作。</p>\n  <p><strong>新产品预计2026年第四季度上市，优先通过 Kickstarter 发起海外众筹，同步推进国内销售渠道建设。</strong>目前仅在国内私域销售的 ASTERRA-Z 赤道仪产品口碑良好，头部星野摄影师多采用其作为主力设备；公司也已开始接触海外星野摄影 KOL 与垂直社群，为新品在国际市场的传播与测试积累基础。</p>\n  <p><strong>以下为访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：为什么这次创业选择切入星空摄影的赛道？</strong></p>\n  <p><strong>周少阳：</strong>之所以选择星空摄影，是因为它同时具备“大众审美门槛低、创作技术门槛高”这两个特点。大部分日常的摄影题材，都需要很强的美学能力才能把普通“素材”变成“作品”。少部分专垂直领域的摄影，比如鸟类、深空摄影，只有圈内人能理解，普通人其实很难判断作品好坏。但星野摄影不一样——有天空、有地景、有人物，普通人天然就会觉得“很美”。人类对星空本身就有一种近乎本能的向往，因此星野摄影是一种非常普适的视觉体验，也是“素材”和“作品”最接近的一种摄影。</p>\n  <p>星空摄影的大部分难度并不在创作本身，而在复杂的工程化流程里。用户需要研究天气、月相、地理位置、设备参数，还要做堆栈、拼接、降噪、调色等后期处理。很多人看到作品会觉得“我也想拍”，但真正上手后发现门槛极高。</p>\n  <p>这也是我们想解决的问题。今天很多所谓“星空摄影师”，某种程度上更像是熟练的工具使用者。我们希望通过工程化和智能化能力，像大疆当年降低航拍门槛一样，把复杂流程尽量自动化，让更多普通人也能轻松进入星野摄影这个创作领域。</p>\n  <p><strong>硬氪：ASTERRA-C 与传统赤道仪或运动相机最大的区别是什么？</strong></p>\n  <p><strong>周少阳：</strong>传统赤道仪本质上是为天文观测发展出来的设备，它很精密，但也很重、很复杂。运动相机和手机则足够轻便，但在长曝光、星空跟踪和复杂后期上又不够完整。我们希望 ASTERRA-C 处在两者之间：它不是把一个专业赤道仪缩小，而是重新思考星野摄影这件事需要什么样的硬件形态。用户看到的可能只是一个便携设备，但背后其实包含跟踪、稳定、构图、拍摄规划和后期处理的完整链条。</p>\n  <p><strong>硬氪：为什么要同步做软件的开发？</strong></p>\n  <p><strong>周少阳：</strong>AI时代，生成一张“漂亮图片”越来越容易，未来普通用户可能很难分辨星空照片是AI生成还是真实拍摄。但我们认为，用户真正需要的不是结果，而是“可信的创作感”——从到达现场、等待天气、到按下快门、获得传播的完整体验。那张照片承载的是独家记忆，而非一段提示词。</p>\n  <p>例如，一个新手不知道今晚能拍什么，系统会告诉他哪里适合拍、几点银河最好、用什么参数，拍完后后期也能自动完成，让他不用学太多就能迈出第一步。我们觉得未来最核心的问题，不是 AI 能不能生成内容，而是如何在 AI 深度参与之后，用户依然保有真实的创作体验。这也是我们同步做软件和 AI 系统的核心原因。</p>\n  <p><strong>硬氪：为什么现在要把产品推向海外市场？</strong></p>\n  <p><strong>周少阳：</strong>星野摄影本身就是全球化的兴趣场景。无论是在中国西部、澳洲、新西兰、美国西部，还是欧洲高山地区，用户面对的痛点都很相似：想拍到星空，但不知道去哪、什么时候拍、怎么设置参数、拍完之后怎么处理。我们第一代产品已经在国内核心用户里完成了比较充分的验证，下一阶段希望通过 Kickstarter 和海外 KOL、社群，把产品带到更广泛的星野摄影和户外创作者面前。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>线性资本表示：</strong>大疆重做了航拍，少阳有机会重做星野。十余年摄影实战叠加连续创业的硬件工程能力，让他对这个品类的痛点与解法都有第一手的理解。期待星空原野把一种小众体验，变成大众语言。</p>", "category": "tech", "published_at": "2026-05-29T01:39:23+00:00", "fetched_at": "2026-05-29T02:48:42.413583+00:00", "fingerprint": "065176ba29fddd41"}, {"source": "36氪 - 最新文章", "title": "再花22亿乘胜追击，北京城建“龍樾”要抢跑了", "url": "https://36kr.com/p/3829749268981123?f=rss", "summary": "<p>5月28日，北京石景山区黄庄村43号棚户区改造项目SS00-1622-002、SS00-2501-002地块进入现场竞拍，最终该地块由北京城建兴通置业有限公司以底价22亿元摘得，成交楼面价约3.31万元/㎡。</p>\n  <p>北京城建兴通置业有限公司是北京城建的全资子公司。<strong>这是去年第四季度以来，北京城建第三次独立拿地补仓。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_5e6360830cc44c4080a147fff788a9bf@6208419_oswg156697oswg1080oswg972_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：天眼查</p>\n  <p><strong>在拿下石景山黄庄村地块的同一时间，北京城建公布了这个新项目的案名：龍樾璟序。</strong></p>\n  <p>从官方案名来看，石景山黄庄村项目与最近开盘的昌平新盘龍樾海序属于同一条产品线。而昌平龍樾海序5月16日开盘即获得了网签493套的亮眼成绩，首开去化率约六成，网签金额超26亿元，强势登顶北京新盘成交榜。</p>\n  <p>龙樾产品系是北京城建的高端产品线，首个落地项目是位于‌丰台区卢沟桥的龙樾天元（2022年入市），但到了昌平龍樾海序项目，<strong>项目名称中代表产品线的“龍樾”变成了繁体字，且操盘思路也发生了改变。</strong></p>\n  <p>相隔四年的两个项目，代表了北京城建对市场理解的不同，<strong>更折射出北京城建在新领导班子带领下的产品逻辑转变。</strong></p>\n  <p>新拿地的龍樾璟序与刚刚近期开盘热销的龍樾海序有一些相似之处，它们不仅同属一条产品线，相隔时间不长（2025年10月拿地），且都位于临近海淀的板块。龍樾海序热销之后，北京城建又快速拿下石景山黄庄村龍樾璟序项目，是在借势乘胜追击。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_e8b8737cf9fe4c858b23074fedf31a08@6208419_oswg388880oswg545oswg503_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">地块位置，来源：北京市规自委</p>\n  <p>实际上，在石景山地块拿地之前，北京城建已经悄悄发了招标预告。5月7日到8日，北京城建密集发布数则招标计划，总投资额为7.6亿元，全面铺开前期工程，为项目在今年下半年尽早开盘入市做准备。</p>\n  <p>从最近的一系列动作来看，<strong>北京城建在悄悄“抢跑”。</strong></p>\n  <p>近一年来，北京城建（含城建发展及城建六建）在北京土地市场共斩获7宗地块，总成交金额171.83 亿元，总规划建筑面积46.87万㎡，布局覆盖东城、石景山、丰台、昌平、房山、密云等多个区域。</p>\n  <p>北京城建为何敢于“多点开花”大手笔拿地？主要是因为北京城建有两个优势。</p>\n  <p><strong>首先，北京城建的土地一级开发能力很强。</strong>最新竞得的石景山黄庄村地块的一级土地整理者就是城建发展的兄弟公司——北京城建房地产。</p>\n  <p>仅从环线位置来看，石景山黄庄村地块坐落于西三环与西四环之间，位置优越，其行政上虽规划石景山，但地理位置上更贴近海淀，与海淀玉泉路板块的直线距离不足2公里。但这块地之所以争夺者不多，核心在于地块素质一般，存在地块形状不规则、地块北侧京九铁路线可能会有较大噪音等明显不足。</p>\n  <p>实际上，早在2024年8月，这宗地就曾在供地清单中亮相，并进到了预申请流程。不过，最终因无人报名而未能正式挂牌出让。</p>\n  <p><strong>这次北京城建敢于拿地，是因为它“捡漏”了。</strong>早在2024年首次上市时，起始总价达42.43亿元，总建筑面积约8.49万㎡，容积率2.55，楼面价约5万元/㎡。此番重返市场，该地块出让条件已显著优化：起始总价降至22亿元，总建面调至7.23万㎡，分别下降48%和15%，容积率亦降至2.15。大幅度“降价、瘦身”不仅降低了企业拿地成本，也为未来操盘提供了更灵活的空间。</p>\n  <p>中指研究院土地市场研究负责人张凯分析，近年来玉泉路及五棵松板块新增供应稀缺，市场以存量部队大院、机关单位住房为主，仅北侧有半壁店保利熙瑞、海宸元境等少数项目在售。因此，该地块有望承接海淀南部外溢客群、五棵松区域改善需求，以及石景山本地升级客户。</p>\n  <p>价格方面，项目西侧首钢园板块内近些年存量竞争较为激烈，如璟悦长安近半年销售均价6万元/㎡，长安源境5.8万元/㎡；四环外建工熙华台销售均价约7.8万元/㎡且接近清盘。二手房方面，北侧大型社区远洋山水可作为地块价值的直接参考锚，作为西四环沿线标志性大盘，该项目建成于2000年，目前挂牌均价约4.2-4.8万元/㎡，实际成交价约4.0-4.5万元/㎡。综合周边新房与二手房价差，预计该地块入市后，价格可能接近6.5万元/㎡。</p>\n  <p><strong>较低的地价，为北京城建留足了产品升级和盈利空间。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_a8973a8d148e40129ab556814c075dc2@6208419_oswg550220oswg865oswg676_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">来源：克而瑞</p>\n  <p>其次，<strong>北京城建近年来产品力也在持续提升。</strong>这也是其项目热销的核心原因。最新热销的龍樾海序，全产品户型使用率达到90%—97%，部分边户高达99%，同等面积比普通项目多出15-20㎡使用面积。另外在室内空间方面也有一系列创新。</p>\n  <p>根据石景山黄庄村地块出让文件，项目总用地面积3.66公顷，规划地上建面7.23万㎡。其中，1622-002住宅地块占地3.15公顷，地上建筑规模6.769万㎡。未来，作为北京城建又一“龍樾”产品，项目大概率以小高层、三居户型为主，户均面积约在105㎡-110㎡，预计总价500万即可上车，与附近的海淀五棵松板块相比，价格优势明显，再加上石景山在规划审批方面比海淀放得更松，预计北京城建新项目将会虹吸一部分海淀南部改善群体。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/snJ7N-EEeOpERUM9tS4sPQ\" rel=\"noopener noreferrer\" target=\"_blank\">“未来可栖”</a>，作者：小屋见大屋，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-29T02:26:05+00:00", "fetched_at": "2026-05-29T02:48:42.413575+00:00", "fingerprint": "110c2218ed67a0d0"}, {"source": "36氪 - 最新文章", "title": "谁是世界上第二爱泡泡玛特的人？", "url": "https://36kr.com/p/3829746420835715?f=rss", "summary": "<p><strong>作者 |&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑 | </strong>张帆&nbsp;</p>\n  <p>一纸权益披露文件，让市场看到段永平对泡泡玛特的热爱绝不止是“口嗨”。</p>\n  <p>5月27日晚间，段永平与其全资控股的H&amp;H International，同步增持了泡泡玛特的股份，一致行动人持股比例达5.69%，对应约7637.16万股，一跃成为仅次于创始人王宁的第二大股东。</p>\n  <p>知名投资人的每一次站台，总是能或多或少地提升市场信心。</p>\n  <p>截至发稿前，泡泡玛特收盘价161.5港元，涨幅4.74%。若以最新股价计算，段永平的这笔持仓对应的市值达到123亿港元。而他对泡泡玛特的态度，也堪称180度的“史诗级逆转”。</p>\n  <p>就在去年8月，当泡泡玛特的股价逼近历史高点、被称作“新消费茅台”时，段永平唱了反调，表示“看不懂10年后的泡泡玛特。”今年1月，他在雪球回应网友提问时还说，“依然无法理解人们为什么需要这个东西，万一过两年大家都不要了呢？”</p>\n  <p>两个月后，泡泡玛特发布2025年财报，全年营收371.2亿元，同比增长184.7%；经调整净利润130.8亿元，同比增长284.5%；毛利率达到72.1%。</p>\n  <p>仅从财报表现看，泡泡玛特的任何一个数据放在消费行业都是炸裂的，但资本市场明显对管理层给出的2026年业绩指引感到担忧，同时因LABUBU的热度下跌产生恐慌。</p>\n  <p><strong>这也导致，3月25日财报发布当日，泡泡玛特的股价连续5个交易日暴跌，累计跌幅达到34.7%。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_cdecbf2fd5a14288a6a468e73bd02860@394564713_oswg54522oswg1056oswg573_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自Wind</p>\n  <p>未曾想，恰恰是在市场最悲观的时刻，段永平发帖称，“连续好几天去理解这家公司”。在专门跑到伦敦的泡泡玛特门店探访，以及读完了王宁的个人传记《因为独特》后，段永平宣布收回此前“不投资”的说法，并表示已“很久没有过这种兴奋感”。</p>\n  <p><strong>更关键的动作在4月9日，段永平发起的Put试水。</strong></p>\n  <p>看跌期权的本质是一种谨慎、更有安全边际的投资方式。</p>\n  <p>当你卖出一份看跌期权（也称卖出Put），可以向买方收取一笔“权利金”，同时承诺对方一个约定的价格（行权价）。如果股价没有跌破这个价格，权利金就由卖方白赚；如果股价跌破，买方行权，卖方就需要在赚取权利金的同时，按约定价格从买方手中买入正股。</p>\n  <p>所以，段永平说“我的泡泡玛特保险公司开张了”。简单翻译就是：“我觉得直接买有点贵，不如先卖点‘下跌保险’赚取权利金。如果股价不跌，我白赚；如果跌了，正好用更低的成本接盘。”</p>\n  <p>此前他也在雪球上透露，短短20天，已合计卖出22500张看跌期权。而在4月29日的行权期，泡泡玛特的收盘价为154.07港元，市场推测的行权价大多在150港元。这也意味着，段永平一股没买到，却白赚了丰厚的权利金。</p>\n  <p><strong>直至5月7日，段永平对泡泡玛特已没有任何保留，甚至算得上是公共语境下“第二”爱这家公司的人。</strong></p>\n  <p>他公开表示“把神华都换成了泡泡玛特”，甚至在回应网友时直言：“我理解王宁不是因为我的投资，而是因为我也曾是个‘企业家’，能看懂他有多厉害。他还那么年轻。”</p>\n  <p>几乎在同时，段永平再度加仓了贵州茅台。左手茅台，右手泡泡玛特——在这位“中国巴菲特”的投资棋盘上，新旧标同场竞技。</p>\n  <p><strong>实际上，段永平的投资逻辑非常简洁。</strong></p>\n  <p><strong>他一直反复强调，“我理解的买股票就是买公司，买公司就是买公司的未来现金流折现。”而段永平筛选好股票、好公司的方法与巴菲特一致，非常看重ROE（即净资产收益率，核心算法为净利润/净资产），这一数值能更直观地反映一家公司的赚钱效率。</strong></p>\n  <p>在多次访谈中，段永平也表示，一只股票的年化回报率会趋近于ROE。如果一个企业的ROE长期维持在20%以上，说明它拥有强大的护城河。</p>\n  <p>两个投资案例能更好地展现他的理念。</p>\n  <p>2011年，乔布斯去世，苹果股价暴跌。段永平逆势重仓，也曾用卖Put的方式对苹果建仓，持有其股票14年不动。在这一期间，苹果公司的市值从3000亿涨到3万亿，段永平的收益超过10倍。他投资苹果的逻辑，更多在于IOS生态系统对用户的深度锁定。</p>\n  <p>2013年，塑化剂风波叠加反腐风暴，白酒行业陷入低谷。彼时的段永平更看中茅台未来十年的发展。他认为，茅台的行业地位和人们对顶级白酒的产品需求，不会发生根本性变化。</p>\n  <p>再从ROE这一数据来看，贵州茅台常年保持30%的水平。2025年，贵州茅台的ROE平均值达到34.36%。</p>\n  <p>苹果则呈现另一种结构。由于苹果近年来的持续股权回购，其净资产被压缩，ROE甚至达到170%（回购股权需要花费现金流，也影响股票数量）。但若撇开财务杠杆，苹果近年来的ROIC（投入资本回报率）也稳定在50%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_c9a500971e3d46f4874b3af7b3c59af8@394564713_oswg26950oswg762oswg423_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">苹果、贵州茅台、泡泡玛特ROE（平均）值；36氪根据Wind数据制图</p>\n  <p><strong>反观泡泡玛特的ROE数据，却不像苹果与茅台那样稳定。</strong></p>\n  <p>随着盲盒的商业模式受到质疑，泡泡玛特的净资产收益率一度跌至2022年的6.9%，随着公司对产品线的调整、多IP的布局，逐渐恢复至2024年的33.87%，2025年又飙升至77.52%。而泡泡玛特2025年的ROE表现，无疑受到LABUBU爆火的影响。</p>\n  <p><strong>曾有券商人士对36氪透露，部分投资者仍将泡泡玛特视作“周期股”。</strong></p>\n  <p>“2025年泡泡玛特、老铺黄金被炒得那么高，是因为港股市场、A股市场的科技股还没有明确的主线。美国市场的科技股，譬如存储，也是在去年年中后才开始大热。”</p>\n  <p>再从最能反映“当期利润”的市盈率来看，进入2026年以来，苹果稳定在30以上，贵州茅台始终在20上下起伏，泡泡玛特则从2月最高的48一路下跌至现如今的15.15。这也让部分投资者怀疑，泡泡玛特是否已经度过了高速增长的时期。</p>\n  <p>这又回到了“谁能承接LABUBU的泼天流量”，以及IP生命周期的老问题。</p>\n  <p>更早前，市场也曾担心泡泡玛特过于依赖Molly；到了2025年，以LABUBU为代表的“THE MONSTERS家族”为公司贡献的营收达到141.6亿元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_97d9edd0351a411185056f9af876ac06@394564713_oswg130601oswg690oswg920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来自麦当劳官方微博</p>\n  <p>尽管在去年下半年，泡泡玛特主动放量，进而影响了LABUBU四代及后期产品在二手市场的价格表现。但对于消费品，从渠道手中夺回产品定价权，无疑是对公司未来净利润与品牌调性的最好保护。与泡泡玛特如出一辙，2026年1月以来，飞天茅台在“i茅台”的销售已成常态。</p>\n  <p>与此同时，泡泡玛特2025年财报也显示，公司共有17个艺术家IP收入过亿。除THE MONSTERS之外，SKULLPANDA、CRYBABY、MOLLY、DIMOO、星星人、HIRONO六大IP营收均突破20亿元。</p>\n  <p>近期，星星人还与麦当劳联名，双方合作推出的“星星人合唱团”系列盲盒大卖，首批40万个产品在15分钟内售罄。能够与国际大牌联合，也是星星人IP价值的一次成功商业兑现。</p>\n  <p><strong>一个明确的事实是，泡泡玛特早已是一个IP平台。</strong></p>\n  <p>当然，泡泡玛特未来的ROE水平能否稳定在某一区间内，还需时间沉淀。这个投资标的对于段永平的价值，也要在十年后才能兑现。资本市场或许要给予泡泡玛特更多耐心。</p>\n  <p>*免责声明：&nbsp;</p>\n  <p>本文内容仅代表作者看法。&nbsp;</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_79544f5c84f64f278a47f5a0b86b3165@394564713_oswg63834oswg901oswg571_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/etREmLu4wi1kzuT9mdRORQ\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪财经”</a>，作者：谢芸子&nbsp;张帆，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-29T02:40:19+00:00", "fetched_at": "2026-05-29T02:48:42.413561+00:00", "fingerprint": "d0758757699b9642"}, {"source": "少数派", "title": "免费试读 | 零基础美术启蒙，该如何准备适合的美术器材", "url": "https://sspa :#5cb85c;font-size:14px;\">↓ -0.0090 (-0.19%) 贬值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-05-29T02:48:39.850852+00:00", "fingerprint": "8da945a5f889a7ba"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
