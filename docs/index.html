stone dismissed the lawsuit Ann Altman filed last year alleging that her brother, OpenAI CEO Sam Altman, had sexually abused her throughout her childhood. As reported earlier by The Guardian, the judge wrote that over the past year, Ann had failed to appear for an independent medical examination or [&#8230;]", "category": "tech", "published_at": "2026-10-20T23:04:19+00:00", "fetched_at": "2026-10-21T03:03:51.084056+00:00", "fingerprint": "9a73f4d6937ae6af"}, {"source": "The Verge", "title": "YouTube might be testing hiding the dislike button", "url": "https://www.theverge.com/streaming/1015099/youtube-dislike-button-hide-menu", "summary": "YouTube appears to be testing hiding the dislike button on videos, as reported by 9to5Google. At least two users on X have recently shared screenshots of the dislike button now being placed in the three-dots submenu, and a user on Reddit also shared an image of the dislike button being absent for them. Right now, [&#8230;]", "category": "tech", "published_at": "2026-10-21T00:00:56+00:00", "fetched_at": "2026-10-21T03:03:51.084047+00:00", "fingerprint": "c014b161f25d8a75"}, {"source": "36氪 - 最新文章", "title": "鸿蒙智行抢滩海外，问界计划采用“博世inside”方案｜36氪独家", "url": "https://36kr.com/p/4034025645560963?f=rss", "summary": "<p>巴黎车展上，赛力斯副总裁康波宣布，问界将在明年秋季进入欧洲市场，此后赛力斯A股股价涨停。</p>\n  <p>36氪从多位产业人士处了解到，问界的海外车型将采用“BOSCH Inside”的合作模式，与国际巨头博世联合开发。海外版问界M6、M7、M8、M9，都将搭载博世的全套智能化方案。博世的全套智能化方案涵盖高阶辅助驾驶、智能座舱和底盘。</p>\n  <p>目前，博世已启动了问界海外车型的开发，暂计划于明年9月量产高速NOA。</p>\n  <p>问界是华为与赛力斯深度合作打造的高端汽车品牌，但36氪了解到，华为已将问界等品牌的海外车型主导权交给了车企。有接近问界海外项目的人士对36氪解释，“BOSCH Inside”这一模式“和华为的HI（HUAWEI Inside）模式有点类似”。</p>\n  <p>除了问界，有行业人士透露，华为与奇瑞集团联合打造的汽车品牌智界，也在积极筹划出海。其中，智界V9是有望更早出海的车型。</p>\n  <h3><strong>问界博世深度合作问界海外车型</strong></h3>\n  <p>自主品牌的出海热情逐年汹涌，这届巴黎车展，超20个自主品牌集体参展，正是这一趋势的反映。</p>\n  <p>除了吉利、长安、小鹏、零跑等品牌，此前聚焦国内市场的理想，破天荒在这届巴黎车展发布了新车——Li6。</p>\n  <p>理想在国内的强劲对手——问界，也携M6、M7、M8、M9四款车型，以及魔方（MF）平台技术亮相欧洲。赛力斯副总裁康波在车展上喊出了“与用户共享新豪华”的口号，并官宣问界会在明年秋季进入欧洲市场。</p>\n  <p>部分接近问界的行业人士告诉36氪，赛力斯已为问界的出海，做了较为充分的技术和组织架构层面的储备。</p>\n  <p>2027年起，问界品牌旗下车型将陆续出海，除了欧洲，问界也可能尝试销往中东市场。</p>\n  <p>问界M6、M7、M8、M9的海外车型，采用“BOSCH Inside”的合作模式，与博世联合发开、深度合作。未来这些车型将搭载博世的全套智能化方案出海，其中包括博世的高阶辅助驾驶、智能座舱和底盘。据36氪了解，博世已启动了问界海外车型的开发，或于明年9月量产高速NOA。</p>\n  <p>博世是汽车行业的国际巨头，无论是对海外法规、市场环境的熟悉程度，还是品牌知名度，它都有着相当优势。因而与博世结盟，是问界等自主品牌出海的共同选择。康波也在巴黎车展上公开表示：“问界正积极推进监管合规认证与本地化运营。”与博世正可视为问界推进监管合规的一项重要动作。</p>\n  <p>于博世而言，问界海外项目，也是博世全套智能化方案首次上车。因而赛力斯与博世对于这次合作都相重视。</p>\n  <p>另有接近赛力斯的行业人士告诉36氪，为了保障出海进度，赛力斯还将海外BU合并入了问界BG。原本，赛力斯的海外BU与问界BG是两个平行部门，整合之后，海外BU成了问界BG的子部门。36氪了解到，两个部门各自独立时，问界海外车型的研发、市场等工作推进时遇到过阻碍，整合则利于双方的协同。针对以上信息，36氪曾向赛力斯求证，赛力斯回应称不实。</p>\n  <p>除了问界，智界品牌也在筹划出海。</p>\n  <p>部分接近智界的行业人士告诉36氪，智界内部已成立了“蓝海”项目组，推进智界车型的出海。“国内市场是片红海，海外市场是片相对的蓝海，所以项目命名为‘蓝海’项目。”“蓝海”项目的第一阶段是把智界销往中东，第二阶段会去东南亚，第三阶段去欧洲。</p>\n  <p>智界的海外车型将搭载奇瑞的电子电器架构，智能化方面，初步计划采用奇瑞的猎鹰智驾、灵犀智舱，“到了海外后也可能有当地智能化供应商的加入”。但有智界人士表示，这些构想今后也可能有所变化。</p>\n  <p>按智界和奇瑞的规划，智界V9是有望更早出海的车型，智界R7则受限于部分零部件的法规要求，将放慢出海步伐。</p>\n  <p>现今，奇瑞研发总院正推进智界V9的海外车型开发。有智界人士表示：“智界团队人手有限，加上海外市场短期内规模不会太大，所以智界暂时还是聚焦国内车型。可以理解为‘蓝海’项目组，把海外车型的开发工作外包给了奇瑞研发院。”</p>\n  <p>36氪还了解到，在智界品牌现有车型之外，智界还在规划一款轿跑车型，这款车将面向全球进行开发，计划达到一个较为极限的性能目标。届时它或将被送往纽北赛道，挑战一众国外豪华超跑车型。但这一项目至今还在预研阶段，尚未正式立项。</p>\n  <h3><strong>高端自主品牌出海的阻力和机遇</strong></h3>\n  <p>出海是近些年许多自主品牌重点布局的一盘大棋，原因无他，只因国内市场竞争不断升级，自主品牌无不承受着销量、成本等多重压力。</p>\n  <p>根据乘联会数据，今年以来，国内汽车每个月的零售规模，都是同比负增长，而且下降幅度逐月增高。拿刚刚过去的9月来说，国内汽车零售量比去年同期少了28%。</p>\n  <p>国内市场体量整体萎缩，市场份额却相当分散，再叠加内存等供应链成本的上涨，自主品牌普遍难以看到规模效应。</p>\n  <p>由此导致的结果就是，理想、问界、小米等本已实现盈利的汽车品牌，在今年上半年集体转向亏损。在这样的背景下，自主品牌急需开辟海外市场，打造第二增长点。</p>\n  <p>但问界的出海，对于中国汽车产业还有着别样的意义。</p>\n  <p>在相当一段时间内，能在海外畅销的自主品牌，多是中低端品牌。比如在海外市场相对领先的上汽、奇瑞集团，前者的海外销量主要来自MG，后者则靠瑞虎系列燃油、插混车型占据大片海外市场。</p>\n  <p>高端自主品牌出海成功的案例相对稀缺。</p>\n  <p>蔚来是较早尝试出海的高端自主品牌。</p>\n  <p>2021年二代蔚来ES8 在挪威上市，差不多时间，蔚来在欧洲开了第一家 NIO House，这在某种意义上标志着蔚来出海欧洲的开始。随后，蔚来又先后进入德国、荷兰、瑞典、丹麦等其他欧洲市场。</p>\n  <p>彼时，蔚来在欧洲市场，照搬国内直营+换电基建先行的经营模式，后来由于品牌认知弱、投入产出失衡等因素，蔚来调整了出海的节奏。蔚来创始人李斌去年在接受媒体采访时，总结当时大规模布局欧洲市场是一种“误判”，“交了很多学费”。</p>\n  <p>如今的问界，正是继蔚来之后，又一个发力欧洲的高端自主品牌，它的出海势必也会遇到同样的阻力。</p>\n  <p>最直接的阻碍来自品牌认知。</p>\n  <p>在国内市场，问界已经用销量证明了，用户对其高端品牌形象的认可。但出海欧洲，正如李斌所言，“在当地快速建立品牌认知、赢得用户信任、建立销售服务网络，这比想象的要难，可能比建工厂更复杂”。</p>\n  <p>不过，在某种意义上，问界是幸运的，它的出海赶上了自主品牌集体出海的潮流。</p>\n  <p>早年，蔚来在欧洲市场的尝试，是孤军奋战。而今自主品牌出海热情高涨，抱团出海或将使自主品牌，更快地在海外用户心中建立起品牌认知。</p>\n  <p>尤其是比亚迪这样的大厂，有更雄厚的资源在海外做品牌推广，比如2024年比亚迪对欧洲杯的冠名，对于在海外塑造自主品牌的集体形象，无疑起到了较为关键的推动作用。</p>\n  <p>有蔚来人士告诉36氪，蔚来内部在复盘出海的教训时，也曾提到，蔚来如果在比亚迪出海之后跟进，而非率先孤身出海，或许能少走些弯路。</p>\n  <p>海外市场对中国电动车的态度也在改善。10月14日，中国汽车工业协会发布声明，中欧双方已经就混动汽车、电动汽车的贸易问题达成了共识，这有望降低中国汽车出海欧洲的壁垒。</p>\n  <p>无论如何，问界在国内高端市场的影响力，离不开华为的赋能。而到了海外，要重新建立品牌号召力，似乎是个不小的挑战，与博世的深度联合，似乎是问界找到的新路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_3deaf1d20c7041318d8ffcc9107cb3c4@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-10-20T09:43:34+00:00", "fetched_at": "2026-10-21T03:03:50.989538+00:00", "fingerprint": "cc3559a554c570b1"}, {"source": "36氪 - 最新文章", "title": "从“卡脖子”到自主可控：航空制造国产替代进行时｜OpenTalk直播预告", "url": "https://36kr.com/p/4034016455627655?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_fe31ef1b8c6247e99538c804321d8742@6413691_oswg564530oswg2096oswg1180_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>航空制造高度集成先进材料、精密制造、机载系统与适航认证能力，产业链长、协作密度高，既是检验高端制造体系的综合考题，也是带动上下游产业链升级的重要引擎。</p>\n  <p>在相当长一段时间里，国产航空制造在发动机、航电、飞控、关键材料与适航体系等环节大量依赖引进。而如今，国产替代正从整机环节向纵深传导，过去被海外垄断的环节开始出现国产方案。但替代尚未走完最后一程，工程化、质量一致性与规模化交付，仍是产业必须面对的现实考验。</p>\n  <p>2026年10月27日（周二）17:00，36氪OpenTalk举办<strong>「从“卡脖子”到自主可控：航空制造国产替代进行时」</strong>直播活动，特别邀请<strong>直列动力副总裁兼CFO王仕东、吉太航空科技总经理孙鹏、二零八先进科技创始人兼总经理王飞</strong>三位嘉宾，围绕航空动力、机载系统、导航技术、适航认证、商业化节奏等话题，共同探讨航空制造国产替代的落地进展和产业机会。</p>\n  <p>欢迎关注航空制造与低空经济的创业者、投资人及从业者扫描下方活动海报二维码报名，与嘉宾在线互动。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_8389e387876441628b1484431d1d4222@6413691_oswg861260oswg1000oswg4934_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h2>嘉宾信息</h2>\n  <h3><strong>直列动力副总裁兼CFO 王仕东</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_05cba7cb702b4ea2909baf21012c29cb@6413691_oswg1325002oswg2250oswg4263_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <h3><strong>吉太航空科技总经理 孙鹏</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_dd9751b1e0ac462f88543586f9a53d1b@6413691_oswg306360oswg1080oswg2046_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h3><strong>二零八先进科技创始人兼总经理 王飞</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_d9c0682b853e4bdfadec940a6e02f55e@6413691_oswg1169806oswg2250oswg4263_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-10-20T10:04:12+00:00", "fetched_at": "2026-10-21T03:03:50.989534+00:00", "fingerprint": "741bc8d71f58a2b7"}, {"source": "36氪 - 最新文章", "title": "机构预计北京写字楼市场将于2028年企稳", "url": "https://36kr.com/p/4033965080155016?f=rss", "summary": "<p>当前，北京办公楼市场正在经历一场跨度十年的深度调整，全面迈入以“重新定价”为标志的系统性重构时期。据仲量联行发布的《2026北京办公楼市场白皮书》数据，截至2026年第三季度，全市空置率维持在17%左右，稳居全国一线城市最低水平。同时租金继续回落，三季度末全市甲级办公楼平均租金回落至198元/平方米/月，距2018年末的历史峰值8年累计下调近50%。其中，2024年和2025年租金年均同比下滑16%以上，折射出市场心理基线的持续下移。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_6fd2fbef2e954ee483e90eb9add54345@337187376_oswg38750oswg1098oswg753_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：仲量联行研究部</p>\n  <p>仲量联行认为，这一深度的租金回调并非短期波动，而是顺应宏观经济转型与产业结构升级的理性回归，本质上是对办公楼资产的“重新定价”。支撑“重新定价”趋势的，是供需关系的结构性转变。北京甲级办公楼市场正迎来继2008年、2019年后的第三轮供应高峰。2026至2030年，预计新增高品质办公面积逾100万平方米，集中于CBD核心区与望京，对存量项目的续租与招商形成直接分流和竞争。&nbsp;</p>\n  <p>本轮放量正在进一步重塑供需天平。凭借地段与硬件优势粗放增长的周期红利已然消退，市场在结构性的“租户方市场”中步入博弈的深水区。市场正从五大维度重构：定价逻辑重构，租金锚点下移，市场寻找新均衡；供需关系重构，新增供应叠加企业需求趋于理性，租户主导格局强化；决策逻辑重构，企业选址不再局限区位与租金，转向空间效能、运营效率、全生命周期成本综合评估；需求形态重构，整体需求保持审慎，但人工智能、高精尖产业释放结构性机会；竞争流向重构，项目竞争从同片区、同等级比拼，延伸至跨区域、跨品类、跨等级博弈。</p>\n  <p>随着调整深化，北京办公楼市场租金下行节奏已显著趋稳，市场微观周期已由快速下探转入放缓寻底阶段。预计整体市场2026年租金跌幅将收窄至6-7%，并于2028年末逐步企稳触底。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_09ba3674e3d54bbcbe7d806570b0b11f@337187376_oswg71764oswg1062oswg369_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：仲量联行研究部</p>\n  <p>在整体市场寻底过程中，北京东西部办公市场存在显著的周期“时差”。2026年，西部市场已率先筑底企稳，超过半数的甲级资产在前三季度录得租金持平或正增长。部分区位核心或品质优越的项目已接近满租，带动租金报价大幅攀升。&nbsp;</p>\n  <p>以中关村为例，2019至2022年间租金累计跌幅仅约5元/平方米/月，大多数项目鲜有下调租金的意愿。2026年第三季度，该区域甲级办公楼租金增长率由负转正，环比平均增幅达到2.4%。当前，中关村核心区域的主流项目空置率保持在10%以内，部分甚至接近满租，优质企业频繁在楼内或周边项目中连续扩租，空置面积一旦释放往往会被迅速吸收。&nbsp;</p>\n  <p>相比之下，东部区域受新增供应入市及需求端保持审慎的双重影响，整体租金仍处于深度调整的通道中。东部核心商务区普遍面临较大的去化与空置压力，在过去一段时间内，业主间的租金博弈趋于白热化，但这同时也为企业端提供了难得的成本优化与升级窗口。当前，东部市场租户对空间效能的要求达到前所未有的高度。超甲级资产正从周边楼宇中持续虹吸升级型需求，协助企业实现成本管理与办公空间的同步进阶。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_08432524721341d99675ed28cb6f5f27@337187376_oswg77380oswg1058oswg557_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">数据来源：仲量联行研究部</p>\n  <p>白皮书调研显示，37%受访企业租户预判市场将于2028年触底，业主预期同样集中于这一时间窗口，2028年被视作北京办公楼实质性筑底回稳关键节点。区域预期差异明显：西部市场企业对2026—2027年率先企稳信心更强；东部市场多数租户将触底时间锚定在2028年及以后。虽然近四成租户判断租金仍存在5%至10%下行空间，但市场对租金大幅下跌的预期已经明显收窄。&nbsp;</p>\n  <p>另据统计，近几年，北京办公楼市场中新租与续租之间的价差持续收窄。2019年后，新租租金率先触顶回落，续租租金在经历一段高位运行后，亦步入下行通道。到2025-2026年，两者的平均租金价差已从峰值时的60-80元，大幅压缩至20-30元。这个过程削弱了搬迁的经济驱动力，租户通过搬迁实现显著租金节省的收益空间已被大幅挤压。当新租与续租价差收窄至当前区间时，搬迁所带来的账面租金节省往往已较难覆盖搬迁本身的摩擦成本，这包括复原成本、装修成本等大额一次性支出和繁杂的隐性成本。因此，租户继续留在原址的动机显著增强，因惬意换租带来的市场波动也将逐渐趋向于平稳。&nbsp;</p>\n  <p>仲量联行华北区研究部资深董事纪明表示，当前市场积极信号在于供需双方预期逐步走向理性。优质租户不再单纯等待所谓市场“绝对底部”，而是结合未来三年业务规划主动锁定办公空间；业主的核心目标转向提升入驻率、优化租户结构。预期共识正在支撑市场平稳筑底，北京办公楼正从深度调整迈向新均衡。</p>", "category": "tech", "published_at": "2026-10-20T12:35:54+00:00", "fetched_at": "2026-10-21T03:03:50.989529+00:00", "fingerprint": "90c47ed36e486a7f"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨将实施“消费才可入座”？星巴克中国回应；Anthropic上半年净亏807亿美元；日本优衣库宣布涨价", "url": "https://36kr.com/p/4034867385537670?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>官方定调L2禁用智驾“小蓝灯”</li>\n   <li>10月LPR报价出炉</li>\n   <li>特斯拉与支付宝达成合作</li>\n   <li>谷歌前CEO施密特据悉持有Anthropic约1%股份</li>\n   <li>马斯克去年薪酬超1万亿，但到手为零</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>“强制消费入座”？星巴克中国回应&nbsp;</strong></p>\n  <p>星巴克门店要求消费后才能入座？10月20日，针对网传今日起星巴克门店“消费入座”的相关规定，星巴克中国方面回应澎湃新闻记者称，“星巴克一直致力于为顾客提供舒适的第三空间体验，基于对全国顾客和伙伴声音的持续倾听，我们会持续投入提升顾客的门店体验。”</p>\n  <p>澎湃新闻记者当天探访上海多家星巴克门店，均未看到店内有与“消费入座”相关的提示。有门店人员表示，“相关提示物料还没有到店，可能11月开始就会正式使用，并非强制消费入座，只是提倡第三空间氛围。”另有多家门店人员向记者表示，目前提倡消费入座，是为了给其他顾客更好的体验，但不是强制，暂未收到相关官方通知。记者还以消费者身份咨询星巴克客服，其表示暂时没有“消费入座”相关信息。（澎湃新闻）</p>\n  <p><strong>Anthropic据悉上半年净亏807亿美元，未来数年或再花7500亿美元购买算力</strong></p>\n  <p>据报道，招股书草案显示，Anthropic今年上半财年净亏损807亿美元，远大于上年同期130亿美元的净亏损额。报道称，上半年净亏损的绝大部分（即720亿美元），来自Anthropic发行的可转换票据及其他工具价值变动相关的会计费用。据报道，截至6月30日的六个月，Anthropic在算力和基础设施方面支出近90亿美元，而2025年同期为23亿美元。该公司今年上半年用于获取算力的资金已经超过2025年全年的73亿美元。报道称，Anthropic未来数年可能再花费7500亿美元用于购买算力。（界面新闻）</p>\n  <p><strong>日本优衣库宣布涨价&nbsp;</strong></p>\n  <p>优衣库10月19日宣布，将上调日本部分商品和服务的价格，2026年秋冬季商品整体平均涨价约4%。其中“感动西装外套”将于11月10日起从6990日元涨至7990日元。原本以4双990日元销售的袜子多件优惠措施将停止，改为单双售价390日元。优衣库表示，涨价受到原材料成本、物流费用上涨及日元贬值的影响。（界面新闻）</p>\n  <h2>AI最前线</h2>\n  <p><strong>DeepSeek：进一步将内部推理框架DeepInfer全面开源</strong></p>\n  <p>36氪获悉，DeepSeek表示，在此前开源一系列大模型、TileLang编译工具及推理算子库的基础上，决定进一步将内部推理框架DeepInfer全面开源。基于DeepInfer，已实现DeepSeek V4.1 Flash高吞吐、低延迟的大规模推理服务。未来，DeepSeek新模型的推理代码及后续优化也将在此持续更新。</p>\n  <p><strong>三星研发24小时工作的机器人</strong></p>\n  <p>统管三星电子机器人业务的RX业务推进室正在首尔牛眠洞首尔R&amp;D园区验证可在产业现场24小时运转的机器人性能。这款机器人在执行搬运货物等制造、物流现场重复作业的同时，也在学习周边环境和作业方式。一位业界人士表示，“三星电子和合作公司员工正按24小时三班倒，检查机器人工作的过程”。据悉，三星电子正以包括这款机器人在内的多个候选产品为对象，研究是否参展CES。（新浪财经）</p>\n  <p><strong>黄仁勋：AI发展不能急刹车，但必须装“安全带”</strong></p>\n  <p>英伟达首席执行官黄仁勋在伦敦表示，反对以“急刹车”或严厉监管来限制AI发展，应该建立“安全带”，通过更智能的安全标准、监测机制和事故防范措施约束。（财联社）</p>\n  <p><strong>甲骨文与阿斯利康合作探索AI医疗应用</strong></p>\n  <p>甲骨文与阿斯利康宣布达成一项非约束性协议，计划探索利用人工智能（AI）和真实世界数据识别符合临床试验条件的患者、加快医学证据生成，并将相关研究成果融入日常诊疗流程。双方将结合阿斯利康的科研及治疗领域专长与甲骨文的数据、云计算、AI和临床工作流技术。双方初步考虑在肿瘤、心血管、肾脏及代谢疾病、呼吸与免疫疾病和罕见病等领域探索应用，并计划建立共同治理机制和效果评估指标，以评估相关方案能否推广至更多疾病领域。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>官方定调L2禁用智驾“小蓝灯”</strong></p>\n  <p>L2级别智驾“小蓝灯”正式被官方禁用。10月20日，工业和信息化部装备工业一司发布《汽车及挂车外部照明和光信号装置的安装要求（征求意见稿）》。其中明确，不具备L3级及以上自动驾驶系统的车辆，禁止安装ADS标志灯。同时，ADS标志灯的专用光色要求为蓝绿色。此前，L2级别辅助驾驶信号灯大多采用蓝色。（第一财经）</p>\n  <p><strong>格力技校首届新生开课，董明珠：禁止谈恋爱&nbsp;</strong></p>\n  <p>10月19日，珠海市格力技工学校迎来开学第一课。校长董明珠围绕校园日常和生活细节，对首届新生提出纪律要求，其中“十几岁的娃娃讲谈恋爱，这是不允许的”迅速成为舆论关注焦点。</p>\n  <p>据媒体报道，董明珠在授课时分享了自己的行程与成长经历，并向学生提出具体要求。她表示，看到校内超市“一个橘子卖1.5块”，认为这是在“宰学生”，明确表态“这种超市是不允许在这开的”；看到学生头发很长，学校便请了专业理发师队伍，周末来校做义工为学生剪头发。在纪律方面，董明珠直言：“十几岁的娃娃讲谈恋爱，这是不允许的。”她勉励学生在校期间三年潜心学习，保持自信、勤奋，秉持自信、诚信、包容的品格，拥有利他思想，把学校当成大家庭。”从跨入校门那一刻起，大家就是格力人。\"（界面新闻）</p>\n  <p><strong>AI公司“Today AI”完成超2亿美元融资&nbsp;</strong></p>\n  <p>近日，Personal AI公司“Today AI”完成超2亿美元融资，投资方包括IDG资本、腾讯、五源资本、蚂蚁集团、红杉中国、传音控股、同歌创投、上海交大菡源资产。Today AI致力于打造个性化的AI系统，为用户提供“更懂你”的AI助理。据了解，该公司目前持续招募各方向人才。</p>\n  <p><strong>外交部回应美政府要求机构停用DeepSeek&nbsp;</strong></p>\n  <p>10月20日，针对有报道说美国政府要求其机构停止使用来自中国企业的DeepSeek等人工智能工具，外交部发言人毛宁在例行记者会上表示，中方一贯反对泛化国家安全概念、将科技经贸问题政治化，我们将坚决维护中国企业的合法权益。（央视新闻）</p>\n  <p><strong>Momenta曹旭东：世界模型加速智驾摩尔定律，2028年将迎来L4规模化拐点</strong></p>\n  <p>36氪获悉，在2026物理AI与世界模型大会上，Momenta CEO曹旭东发表主题演讲，指出世界模型正加速智驾摩尔定律，并预判2028年将成为L4规模化落地的重要拐点。曹旭东将智驾安全性与性能每两年提升十倍的趋势概括为“智驾摩尔定律”，并认为这一规律也适用于更广泛的大模型与人工智能领域。他判断，2026年至2028年，行业头部企业有望实现安全性与性能每年提升十倍。世界模型、Data Scaling与Model Scaling，是推动这一提速的关键。</p>\n  <p><strong>国际油价拉升，WTI原油升破100美元/桶</strong></p>\n  <p>36氪获悉，10月20日，国际油价拉升，WTI原油期货价格涨1.81%，报100.324美元/桶；布伦特原油期货价格涨1.54%，报111.234美元/桶。</p>\n  <p><strong>人民币兑美元创2022年6月28日以来新高&nbsp;</strong></p>\n  <p>10月20日，在岸人民币兑美元早盘涨24点至6.6793元，创2022年6月28日以来新高。离岸人民币兑美元涨39点至6.6784元，创2022年6月28日以来新高。（财联社）</p>\n  <p><strong>金价回撤至4100美元，多家银行积存金零费率抢客&nbsp;</strong></p>\n  <p>最近国际金价回到4100-4200美元/盎司，多家银行推出了积存金手续费优惠活动。部分银行，比如工行，目前主动积存和定投都能0手续费，浙商银行也免收认购手续费。南京银行买入手续费率是0.05%，也算相对低的，但仅限江苏、北京、上海、杭州地区客户。（21财经）</p>\n  <p><strong>10月LPR报价出炉&nbsp;</strong></p>\n  <p>中国人民银行授权全国银行间同业拆借中心公布，2026年10月20日贷款市场报价利率（LPR）为：1年期LPR为3.0%，5年期以上LPR为3.5%。以上LPR在下一次发布LPR之前有效。（界面新闻）</p>\n  <p><strong>AI担忧卷土重来，韩国数据中心公司Elice上市首日大跌32%</strong></p>\n  <p>数据中心基础设施公司Elice Inc.上市首日股价暴跌，凸显投资者担忧AI发展景象能否证明该行业的巨额投资是合理的。这家总部位于首尔的公司开盘大幅下挫，一度暴跌38%，截至收盘跌幅收窄至32%。数据显示，这是韩国大型IPO有史以来最糟糕的首日表现。此前，该公司通过IPO融资2010亿韩元（1.51亿美元），发行价位于指导价区间高端，散户部分认购倍数达到400倍。（财联社）</p>\n  <p><strong>多省份用户访问异常跳转至博彩网站，最新调查报告公布</strong></p>\n  <p>近期，中国多个省份多次发生用户访问请求异常跳转至博彩网站的事件，对广大人民的财产安全和正常上网权利造成了严重危害。经分析，攻击者利用中国境外自治域AS 402425，主要采取宣告虚假路由、篡改域名解析数据等手段进行攻击，危害范围广泛，特此公布有关调查情况，为全球相关国家、单位和广大网民有效发现和防范此类攻击提供借鉴。（央视新闻）</p>\n  <p><strong>消息称三星电子下调明年OLED Galaxy A系列手机出货目标至1亿部</strong></p>\n  <p>据报道，三星电子暂定明年搭载有机发光二极管（OLED）屏幕的中端Galaxy A系列手机出货量目标为1亿部，相较于三星电子9月底向合作伙伴公布的OLED Galaxy A系列1.2亿部出货量目标减少了2000万部。据悉，三星电子下调出货量的主要原因是存储价格上涨。这也增加了其明年智能手机整体出货量目标下调的可能性。三星电子最初计划明年出货超过2.5亿部智能手机 ，但据报道，该公司正在修订这一计划。普遍认为，最终出货量将比原计划减少2000多万部。（新浪财经）</p>\n  <p><strong>畅通跨境投资渠道，60/40结构ETF密集上市</strong></p>\n  <p>在资本市场高水平对外开放持续推进的背景下，一种新的基金品类正成为港股ETF市场的亮点。9月，合计17只60/40结构ETF密集上市，涉及韩国、马来西亚、美国等多个资本市场。在业内人士看来，60/40结构ETF集中上市的背后，是ETF互联互通规则调整、内地与香港互联互通持续深化共同作用的结果。作为跨市场投资工具，60/40结构ETF被视为打开港股ETF市场发展空间，乃至推动跨境资本流动的重要抓手。此类基金持续发展，有望进一步疏通连接中国优质资产与国际资本的渠道。（上证报）</p>\n  <p><strong>谷歌前CEO施密特据悉持有Anthropic约1%股份</strong></p>\n  <p>据知情人士称，谷歌前首席执行官埃里克·施密特持有人工智能初创公司Anthropic约1%的股份；这意味着一旦Anthropic上市，他有望获得一笔巨额“意外之财”。消息人士称，施密特曾在Anthropic的A轮融资中投入了数千万美元。目前尚不清楚他此后是否出售过所持股份。Anthropic计划进行的首次公开募股（IPO）预计将为其早期投资者和员工带来可观的回报。上周有报道称，一些投资者在一次会议上讨论了约1.5万亿美元的估值，这一数字低于此前约2万亿美元的预期。（新浪财经）</p>\n  <p><strong>英伟达据悉成功从人工智能初创公司Modal赢得CPU芯片订单</strong></p>\n  <p>据报道，英伟达成功从快速增长的人工智能初创公司Modal赢得中央处理器(CPU)芯片订单。Modal此前完全依赖英特尔和AMD芯片，这初步表明，英伟达进军长期由这两家竞争对手主导的市场已取得成效。（财联社）</p>\n  <p><strong>特斯拉与支付宝达成合作&nbsp;</strong></p>\n  <p>10月20日，第一财经记者获悉，特斯拉与支付宝正式签署车载助手项目合作协议。据悉，特斯拉中国车机系统计划上线支付宝车载助手智慧停车服务，通过后续软件升级，车主将在车机屏幕上实现停车费快捷安全支付。另外，更多车载生活场景的便利化功能正在开发。（第一财经）</p>\n  <p><strong>3M与亚马逊扩大合作，亚马逊可在七年内认购逾316万股3M股票</strong></p>\n  <p>当地时间10月19日，3M宣布与亚马逊全资子公司扩大战略商业合作，并向亚马逊另一家全资子公司发行认股权证，允许其在七年内以每股164.89美元的价格认购最多316.2万股3M普通股。根据协议，85%的认股权证股份将在亚马逊支付光连接及其他数据中心产品货款后逐步归属，累计付款达到60亿美元时全部归属；其余15%则取决于特定事件里程碑。（界面新闻）</p>\n  <p><strong>1小时赚1.2亿，马斯克去年薪酬超1万亿，但到手为零&nbsp;</strong></p>\n  <p>10月19日，特斯拉向美国证券交易委员会（SEC）提交的文件披露，公司CEO埃隆·马斯克去年总薪酬为1583.59亿美元（约合1.07万亿元人民币），全部以股票奖励形式发放。如果按照全年8760小时折算，这笔薪酬相当于马斯克去年每小时赚1808万美元（约合1.2亿元人民币）。不过，1583.59亿美元的股票奖励，并非马斯克实际到手的真金白银，而是特斯拉去年CEO绩效奖励计划的会计公允价值估值。特斯拉在文件中表示，2025年公司市值指标、经营业绩等多项考核全部未达标，马斯克全年实际到手收入为零，没有现金，也没有解锁任何股权。（界面新闻）</p>\n  <p><strong>央行公告：将在10月21日至11月2日开展隔夜逆回购操作</strong></p>\n  <p>36氪获悉，央行公告，将在10月21日至11月2日开展隔夜逆回购操作，采用固定利率、数量招标，每日操作量不超过10000亿元。</p>\n  <p><strong>美股三大指数收盘涨跌不一，大型科技股多数下跌</strong></p>\n  <p>36氪获悉，10月20日收盘，美股三大指数涨跌不一，道指涨1.02%，纳指跌0.02%，标普500指数涨0.29%。大型科技股多数下跌，谷歌、Meta跌超1%，苹果跌1%，微软、英伟达小幅下跌，特斯拉涨超1%，亚马逊小幅上涨。热门中概股多数上涨，小鹏集团涨超7%，理想汽车涨超5%，蔚来涨超1%，百度、拼多多、阿里巴巴小幅上涨，京东、网易、哔哩哔哩小幅下跌。</p>\n  <p><strong>马斯克：SpaceX与特斯拉已开始研究潜在合并交易</strong></p>\n  <p>马斯克表示，SpaceX和特斯拉已成立特别委员会，研究潜在合并。如果最终得以推进，这可能成为史上规模最大的企业合并交易。同时担任这两家公司首席执行官的马斯克周二在SpaceX财报电话会上表示：“我认为两家公司合并有很多好处，在开发超级智能软件方面进行合作将大有裨益。”（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>微见先进启动IPO辅导&nbsp;</strong></p>\n  <p>10月20日，证监会网站披露，深圳微见先进封装技术股份有限公司（以下简称“微见先进”）于2026年10月19日在深圳证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为华泰联合证券有限责任公司。公开资料显示，微见先进成立于2019年，是一家专注于高精度、复杂工艺芯片封装设备研发生产的国家级专精特新“小巨人”企业，致力于为全球半导体及泛半导体客户提供先进封装设备与系统化解决方案。（财联社）</p>\n  <h2>大公司财报</h2>\n  <p><strong>宁德时代：前三季度净利润645.3亿元，同比增长31.6%</strong></p>\n  <p>36氪获悉，宁德时代披露2026年第三季度财报，前三季度营业收入4421.37亿元，同比增长56.19%；归属于上市公司股东的净利润为645.3亿元，同比增长31.6%。其中，第三季度营收1652.21亿元，同比增长58.58%；归属于上市公司股东的净利润212.46亿元，同比增长14.54%。</p>\n  <p><strong>Netflix第三季度营收128.74亿美元，同比增长12%</strong></p>\n  <p>当地时间10月20日，Netflix公布2026年第三季度业绩：营收为128.74亿美元，同比增长12%；净利润36.6亿美元，去年同期为25.5亿美元。预计第四季度营收为134亿美元，同比增长12%；预计2026年全年营收为511亿美元，同比增长13%。</p>\n  <p><strong>SpaceX第三季度净利润44亿美元，同比扭亏</strong></p>\n  <p>36氪获悉，当地时间10月20日，SpaceX公布截至2026年9月30日的第三季度业绩：营收146亿美元，同比增长161%；净利润44亿美元，上年同期净亏损11亿美元。其中，太空业务营收为18亿美元，环比增长84%，同比增长6%。</p>\n  <p><strong>圣晖集成：前三季度净利润1.52亿元，同比增长58.61%</strong></p>\n  <p>36氪获悉，圣晖集成披露三季报，公司2026年前三季度实现营业收入18.4亿元，同比下降13.05%；归属于上市公司股东的净利润1.52亿元，同比增长58.61%。其中，第三季度实现营业收入7.52亿元，同比下降8.4%；归属于上市公司股东的净利润8150.26万元，同比增长145.62%。</p>\n  <p><strong>三一重能：前三季度净利润3.71亿元，同比增长204.15%</strong></p>\n  <p>36氪获悉，三一重能披露三季报，公司2026年前三季度实现营业收入172.32亿元，同比增长19.24%；归属于上市公司股东的净利润3.71亿元，同比增长204.15%。其中，第三季度实现营业收入65.72亿元，同比增长12.21%；归属于上市公司股东的净利润1.37亿元。</p>\n  <p><strong>钛能化学：前三季度净利润5.74亿元，同比增长81.67%</strong></p>\n  <p>36氪获悉，钛能化学披露三季报，公司2026年前三季度实现营业收入67.63亿元，同比增长17.3%；归属于上市公司股东的净利润5.74亿元，同比增长81.67%。其中，第三季度实现营业收入22.06亿元，同比增长10.53%；归属于上市公司股东净利润1.54亿元，同比增长171.7%。</p>\n  <p><strong>国药股份：前三季度净利润14.76亿元，同比下降1.07%</strong></p>\n  <p>36氪获悉，国药股份披露三季报，公司2026年前三季度实现营业收入406.06亿元，同比增长3.11%；归属于上市公司股东的净利润14.76亿元，同比下降1.07%。其中，第三季度实现营业收入138.78亿元，同比增长0.95%；归属于上市公司股东的净利润5.96亿元，同比增长9.7%。</p>\n  <p><strong>福耀玻璃：前三季度净利润60.06亿元，同比下降14.97%</strong></p>\n  <p>36氪获悉，福耀玻璃披露三季报，2026年前三季度实现营业收入341.23亿元，同比增长2.46%；归属于上市公司股东的净利润60.06亿元，同比下降14.97%。其中，第三季度实现营业收入121.52亿元，同比增长2.51%；归属于上市公司股东的净利润20.36亿元，同比下降9.87%。</p>\n  <p><strong>澜起科技：预计第三季度净利润同比增长153.6%-174.7%</strong></p>\n  <p>36氪获悉，澜起科技公告，预计2026年第三季度归属于上市公司股东的净利润为12.00亿元-13.00亿元，同比增长153.6%-174.7%。</p>\n  <h2>投融资</h2>\n  <p><strong>“新石器”完成E轮近4亿美元融资</strong></p>\n  <p>36氪获悉，自动驾驶科技公司“新石器”宣布完成E轮近4亿美元融资。本轮融资由博裕投资与某国家级基金联合领投，阿里巴巴AEF NextGen香港基金、Monolith砺思资本、纪源资本、淡马锡旗下Vertex Growth、高鹄资本等机构参与投资，磊石资本、信宸资本、高成投资、云启资本、软银亚洲等早期及长期股东继续跟投。高鹄资本担任本轮融资独家财务顾问。本轮融资也创造了今年国内自动驾驶领域最大单笔融资纪录，迄今为止，新石器公司累计融资额已突破百亿元人民币，融资规模居无人配送车行业第一。</p>\n  <h2>酷产品</h2>\n  <p><strong>三星将于下周在韩国推出首款开放式耳机</strong></p>\n  <p>三星电子10月20表示，将于下周推出其首款开放式耳机，命名为“Galaxy Buds On”。该公司称，这款耳机将于10月27日在韩国上市，仅提供黑色版本，售价为299000韩元（约合225美元）。Galaxy Buds On 采用开放式设计，可轻巧地置于耳部；用户在欣赏音乐或观看视频内容的同时，仍能感知周围环境。产品还面向那些在跑步时需要留意周围环境的用户，以及希望在日常生活中佩戴耳机的同时仍能听到环境音的用户。（新浪财经）</p>\n  <p class=\"editor-note\"><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-10-21T00:02:13+00:00", "fetched_at": "2026-10-21T03:03:50.989522+00:00", "fingerprint": "773719581172eb01"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨华为、高瓴等押注，物理空间智能基础设施公司完成超亿元融资", "url": "https://36kr.com/p/4035014691345540?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_076efb384a0f4c2698ffb62051071892@5920579_oswg701274oswg1872oswg1056_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <blockquote>\n   <p>本文约4000字，建议阅读10分钟</p>\n  </blockquote>\n  <p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，以物理空间引擎为基座的空间智能Infra公司「乙太科技」近日连续完成种子轮及天使轮融资，累计融资规模超亿元。其中产业投资方包括华为哈勃、嘉立创、自变量、智元、中科第五纪、软通动力。财务投资方包括高瓴、深高新投、上海半导体、中平资本、芯能创投、交源资产、Neuron VC、德石、曦晨等。</p>\n  <p>乙太科技成立于2025年12月，致力于以物理空间引擎为核心，构建空间智能infra。公司创始人兼CEO 杨叶青曾任HTC VIVE Chief of Staff，中国区元宇宙事业部及软件和服务事业部负责人，从0到1主导开发了国内首款元宇宙系统平台。公司核心团队来自HTC VIVE、微软、京东、美团、北京大学、香港科技大学、北京航空航天大学等知名企业及院校。</p>\n  <p><strong>杨叶青向硬氪介绍，乙太科技所专注的“物理空间引擎”，并非三维重建、数字孪生或空间数据的简单叠加，而是要解决空间如何被持续认知、统一表达并可靠运行这一更基础的问题。</strong></p>\n  <p>语言模型让AI掌握了符号世界的表达能力，可以写文章、写代码、进行推理。但如果要让AI真正进入物理世界，还需要解决一个更底层的问题：现实与虚拟如何共享一套可计算、可运行、可翻译的空间语言。</p>\n  <p>过去的软件主要处理二维数据，例如文字、图片、表格和网页，但现实空间并不是一张静态地图。工厂的生产环境会不断变化，仓库会随着货物和人员的流动而改变，建筑现场也会在施工过程中持续重构。空间中的物体有位置、姿态、几何与材质，也有各自的物理属性与运动规律，并受到人的操作和环境变化影响。</p>\n  <p>因此，行业需要的不只是简单的三维扫描，而是一种能够持续理解空间状态与交互关系的底层能力。传统信息记录侧重于描述“是什么”，却难以完整表达“在哪里”、“如何运动”、“如何交互”以及空间整体如何持续演化。“这正是空间智能要解决的问题，也是乙太科技构建物理空间引擎的出发点。”杨叶青表示。</p>\n  <p>基于这一思路，乙太科技正在建设的物理空间引擎是一套依托空间认知数据打通现实和虚拟的底层认知系统。以空间数据为输入、高精度真值为基准，持续将现实空间编译为可计算、可运行、可迁移、可部署的空间表达，再借助现实场景反馈不断优化数据，为具身智能、世界模型以及各类行业应用提供底层支撑。</p>\n  <p><strong>从技术架构来看，引擎自下而上包含输入层、核心能力层、空间资产层、平台层和应用层五层。</strong>输入层负责采集现实与虚拟环境中的多模态数据，包括视觉、空间定位、力触觉、惯性等传感器信息，为引擎提供原始空间数据，解决“空间里有什么原始信息”。核心能力层则对这些数据进行融合与时空对齐，识别空间结构、物体状态及交互关系，并结合物理约束，形成对空间状态的表达，解决“空间是什么状态、如何运行”。</p>\n  <p>经过处理的信息会在空间资产层沉淀为可加载、可编辑、可复用的空间资产。与单纯记录空间几何外观不同，这些资产还包含物体之间的碰撞关系、物理约束和交互属性，为不同场景的调用与复用提供基础。同时，乙太科技也在推动建立统一的空间资产标准，既用于评测空间表达的准确性与一致性，也支持不同行业在同一框架下直接调用空间能力，降低跨场景复用的门槛。</p>\n  <p>再往上，平台层通过SDK、API、多端部署及私有化部署等方式，将空间引擎的能力封装为可供不同设备和系统调用的服务；应用层则面向机器人、工业制造、汽车、建筑、物流、游戏、文旅、教育等行业，探索空间引擎的具体落地方式。</p>\n  <p><strong>在数据输入层，乙太科技将空间数据分为两个维度：一是空间的物理结构，理解空间的形态与布局；二是人在空间中的交互数据，理解空间里发生了什么，以及人如何移动、操作和反馈。</strong></p>\n  <p>现阶段，乙太科技优先关注人类双手及其交互数据。杨叶青介绍称，双手是人类作用于空间最直接的接口。抓取、推动、旋转、插入、装配和工具使用等动作，包含大量空间关系、操作经验与物理反馈。真正有价值的空间数据，不只是记录手部移动轨迹，还需要记录动作发生的位置、接触关系、空间判断、物体状态变化，以及任务执行过程中的反馈。</p>\n  <p>这些数据既可以用于具身智能和世界模型训练，也可以用于空间过程建模、物理交互生成等领域。例如，在工业领域，分析产线工人的操作路径，与设备、工装、物料之间的真实接触关系、力度反馈和状态变化，提取可迁移的操作逻辑与物理约束、识别工序瓶颈。</p>\n  <p>在游戏领域，游戏开发者无需从零构建场景与动作，可以实时调用现实锚定的空间资产，生成关卡、机关与跨端互动；物体具备真实物理属性，玩家可在UGC空间中自然交互，AINPC与数字人能理解物体位置、接触与状态变化并做出符合物理逻辑的反馈；真实操作数据反哺为可调用的空间资产，使场景随玩家行为持续演化，形成可运行、可编辑、可迁移的空间内容。</p>\n  <p>作为物理空间引擎最早关注的输入类型之一，人类交互数据记录的不只是“手移动到了哪里”，还包括人在什么环境中、为了什么目标、以什么方式作用于哪个对象，以及最终产生了什么结果。乙太科技希望以此为基础，构建能够服务所有需要理解、重建或操作空间的行业。</p>\n  <p>乙太科技团队拥有近十年的XR技术研发经验，经历从数字孪生、元宇宙到空间智能的演进，在空间定位、三维重建、人体与物体追踪、物理解算、多传感器融合及低延迟交互等方面积累了深厚的技术经验。</p>\n  <p>这些技术也是空间引擎处理空间数据的基础。以XR空间计算为例，系统不仅要确定设备自身的位置和姿态，还需要识别周围环境、追踪人体与物体的运动，并将不同传感器采集的信息统一到同一时空坐标系中。只有完成这些处理，才能准确还原空间结构及其中的交互关系，而不只是将现实画面叠加到虚拟场景中。团队希望将过去应用于XR空间计算的能力进一步抽象，用于处理更广泛的空间数据，并将其转化为可供机器人、世界模型等系统调用的空间信息。</p>\n  <p>据介绍，从技术实现来看，空间计算的核心是建立一套与现实世界实时同步的状态空间，持续感知并理解设备运动、环境几何结构、物体状态变化以及人与空间的交互关系，使视觉、动作、空间与物理约束在统一时空基准下保持一致，从而支撑可运行的空间表达，持续构建一个能够跟随现实变化而更新的状态空间。</p>\n  <p>具体到引擎的应用层面，杨叶青介绍，乙太科技目前已在机器人和世界模型等领域开展应用，相关合作主要围绕空间数据展开。团队过往曾服务于全球头部B端客户与海量C端开发者，覆盖文娱、游戏、工业、文物、医疗等领域，因此公司也在探索空间资产的直接应用。</p>\n  <p>例如，在游戏领域探索新的内容创作方式并降低制作成本；在手工与工业制造领域将老师傅的操作过程转化为可分析、可复用的空间资产，用于培训或辅助自动化修复。</p>\n  <p>目前，乙太科技正在搭建更为通用的空间计算能力，通过物理空间引擎构成一套完整的空间语言系统：向下连接真实环境和虚拟环境，向上连接不同模型、设备和行业系统，让空间能够被准确感知、结构化表达、持续编辑、物理模拟并跨端部署，让用户都能够理解、表达和使用空间。</p>\n  <p><strong>以下为创始人问答节选：</strong></p>\n  <p><strong>硬氪：物理空间引擎和三维重建、数字孪生有什么区别？以及，如何理解3D生成路线的世界模型和乙太科技提出的物理空间引擎的关系。</strong></p>\n  <p><strong>杨叶青：</strong>三维重建主要回答的是某一时间点的空间长什么样，它解决的是几何还原问题，输出的是静态的、以观察为目的，但无法完整描述空间状态如何持续变化。一个空间要真正产生价值，还需要理解其中不断发生的变化，以及人与空间之间的交互关系。</p>\n  <p>数字孪生则更进一步，它会将物理世界中一些对象的状态映射到虚拟环境中，描述“现实对象处于什么状态”，让现实世界的设备、产线或建筑在虚拟空间里有一个对应的状态镜像。两者都可以成为物理空间引擎的输入和组成部分，但它们本身不解决“空间如何被持续理解、结构化表达、编辑、模拟和部署”。</p>\n  <p>物理空间引擎不仅要回答空间里有什么、对象在哪里、彼此什么关系，还要回答哪些对象可操作、人正在做什么、动作如何改变空间状态、虚拟变化能否在现实中成立。它不只还原空间，更让空间变得可计算、可运行、可调用。</p>\n  <p>我们理解世界模型的核心是生成世界，预测或生成世界下一时刻的状态；我们不做生成，而是负责表达空间的状态。这是两者本质上的区别。我们定位的是世界模型底层的基础设施，世界模型可以调用我们的能力，比如高质量的空间数据、可运行的空间资产和物理约束环境。我们将真实空间转化为可计算、可编辑的空间资产，世界模型则可以调用这些资产及相关空间信息。</p>\n  <p><strong>硬氪：物理空间引擎的数据采集和现在常见的面向具身的数据采集有什么区别？</strong></p>\n  <p><strong>杨叶青：</strong>市面上常见的数据采集只是空间输入的一部分，具身的数据采集重点在“记录人做了什么动作”；而物理空间引擎的数据采集，重点在“记录人与空间的关系”——不仅采集手部轨迹，还采集动作发生的空间位置、接触关系、力度、意图、物体状态变化和任务反馈等信息。如果只服务于具身智能或世界模型训练，现有的一些数据可能已经够用；但如果要构建更完整、丰富的空间表达，就需要引入更多维度的信息，去回答“人在什么空间里、为了什么目标、以什么方式作用于哪个对象、产生了什么结果，以及这个空间如何被复用和运行”。</p>\n  <p><strong>硬氪：在人类交互数据采集方面，乙太科技相比其他数采公司的优势是什么？</strong></p>\n  <p><strong>杨叶青：</strong>我们的优势主要体现在三个方面：第一，精度高，可以达到亚毫米级；第二，数据维度丰富；第三，在数据处理方面有较深的技术积累。</p>\n  <p>这些能力主要来自团队此前在XR空间计算领域的长期积累。XR本质就是把空间中的各种信息转化为可计算的信息。我们过去积累的空间定位、三维重建、多传感器融合等技术，在人体交互数据采集中都非常重要。</p>\n  <p>目前市场上的数据质量参差不齐，根本原因在于入口数据质量受硬件、软件与技术架构等多重因素共同制约，并非单一环节优化即可解决。团队依托空间计算技术的深耕，从源头硬件与算法、工程化软件实现，到全局领先的技术架构，形成了完整的能力闭环，从而在数据入口侧即保障高质量输入。这种优势并非依赖单一技术路径突破，而是源于全局架构层的系统性设计与持续演进，也正是公司深耕空间智能十余年所积累的核心壁垒。</p>", "category": "tech", "published_at": "2026-10-21T02:30:18+00:00", "fetched_at": "2026-10-21T03:03:50.989508+00:00", "fingerprint": "5e038c4caca7a374"}, {"source": "少数派", "title": "App+1 | 紫毫：基于 Rime 引擎、支持双拼纠错的 iOS 输入法", "url": "https://sspai.com/post/116430", "summary": "简单干净、支持双拼纠错的 iOS 输入法。<a href=\"https://sspai.com/post/116430\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-20T02:34:39+00:00", "fetched_at": "2026-10-21T03:03:49.774345+00:00", "fingerprint": "7bf51060b58dc322"}, {"source": "少数派", "title": "从「空间扩展」到「等比放大」：我如何为 MacBook Pro 搭建双屏桌面", "url": "https://sspai.com/post/116661", "summary": "原厂屏幕之外最省心的搭档。<a href=\"https://sspai.com/post/116661\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-20T07:07:54+00:00", "fetched_at": "2026-10-21T03:03:49.774340+00:00", "fingerprint": "5cd79fd3b392fe10"}, {"source": "少数派", "title": "TDS REVIE h slows down, a new report shows. Electricity demand is also climbing faster than it has in more than a decade with more data centers, factories, and electric vehicles plugging into the grid. Despite those growing demands, the [&#8230;]", "category": "tech", "published_at": "2026-10-19T21:48:01+00:00", "fetched_at": "2026-10-20T03:09:53.796775+00:00", "fingerprint": "fe71d377ee244b05"}, {"source": "The Verge", "title": "Elon Musk’s proposed SpaceX stock giveaway would go into &#8216;Trump Accounts&#8217;", "url": "https://www.theverge.com/tech/1014115/elon-musk-spacex-trump-account", "summary": "President Donald Trump announced this afternoon that Elon Musk's SpaceX shares for children will be given through Trump Accounts. Musk said earlier today that he would give one of his SpaceX shares to \"every kid in America\" sometime next year. Musk had thanked Trump Account booster Brad Gerstner for \"helping enable this,\" and Trump appeared [&#8230;]", "category": "tech", "published_at": "2026-10-19T22:30:42+00:00", "fetched_at": "2026-10-20T03:09:53.796764+00:00", "fingerprint": "1d960afcbf15efa4"}, {"source": "36氪 - 最新文章", "title": "36氪报告图解 | 《2026年中国AI Agent行业发展研究报告》", "url": "https://36kr.com/p/4032427409609096?f=rss", "summary": "<p>2026年，随着基础模型能力持续成熟、推理成本下降，AI的价值重心正在从“简单对话”转向“决策执行”。AI Agent以大模型为决策大脑，集成环境感知、长期记忆、规划推理与工具调用能力，能够在较少人工干预下自主理解目标、拆解任务、调用工具并交付结果，当前AI Agent市场已从概念验证迈向生产力验证。</p>\n  <p>&nbsp;近期，36氪研究院发布了《2026年中国AI Agent行业发展研究报告》（以下简称“报告”）。中国AI Agent行业正在进入生产力验证与商业化放量的早期阶段：企业通用Agent率先落地，行业垂直Agent加速规模化，个人消费Agent快速探索，端侧与具身Agent仍处生态布局和早期验证。据CIDC数据，2025年中国企业级AI Agent市场规模为212亿元，报告预计2029年将达3,320亿元，年复合增长率（CAGR）高达107.6%。产业整体仍处于早期，但商业化扩张速度明显加快。</p>\n  <p>以下是我们挑选出的报告核心内容，欢迎关注「具身万象」公众号，后台回复关键词「AI Agent」领取《2026年中国AI Agent行业发展研究报告》完整版</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_4b5e3f59db5e44539dc14776efd9fee5@6340959_oswg1336105oswg800oswg3557_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">行业概况</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_8ecd084615c44043b097832fe0a018fd@6340959_oswg1709593oswg800oswg4455_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">产业生态</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_a23bed1afaa24450a2ff3291e7ca206b@6340959_oswg1717914oswg800oswg4086_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">未来趋势</p>", "category": "tech", "published_at": "2026-10-19T06:49:04+00:00", "fetched_at": "2026-10-20T03:09:53.639624+00:00", "fingerprint": "e89664d04fafe6fd"}, {"source": "36氪 - 最新文章", "title": "飞利浦把剃须刀做成随身配饰，年轻化能否打开新市场？｜最前线", "url": "https://36kr.com/p/4032678742069640?f=rss", "summary": "<p>36氪获悉，10月16日，飞利浦在上海发布第三代便携式剃须刀「萤火虫」。与传统电动剃须刀强调剃净效率、刀头技术和续航能力不同，这款产品采用小巧机身、六种配色、磁吸开合与呼吸灯设计，试图将日常理容与年轻人的穿搭、出行和社交场景联系起来。</p>\n  <p>这背后是飞利浦对男士理容消费人群的一次细分。相较于面向成熟消费者的传统剃须刀，飞利浦希望通过设计、便携性和相对亲民的价格，吸引更年轻的用户，并让电动剃须刀成为他们的第一把剃须刀。</p>\n  <p>飞利浦大中华区高级副总裁、健康生活事业群总经理吴品慧在媒体群访中表示，中国剃须刀市场已经相对成熟，但仍有不少消费者使用手动剃须刀。飞利浦希望借助新品降低消费者尝试电动剃须刀的门槛，将其从一件功能性工具变成兼顾理容、护肤与个性表达的消费品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_bb874d5c0a9a470682ea732606516fac@5922386_oswg122700oswg1280oswg1920_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">飞利浦第三代便携式剃须刀「萤火虫」</p>\n  <p>这一思路并非单纯依靠外观变化。飞利浦大中华区健康生活事业群男士理容事业部总经理冯雪表示，品牌从三四年前便开始围绕年轻消费者开展调研，并跟随消费者出游、运动，观察产品在实际生活中的使用方式。团队发现，29岁以下的消费者既希望快速完成剃须，也在意产品外观和使用体验，希望日常用品能够体现个人风格。</p>\n  <p>萤火虫的设计由此呈现出一些不同于传统剃须刀的特征。产品重119克，采用磁吸上盖和带有灯光反馈的按键设计，通过不同灯光对应剃须模式；功能方面则搭载3D浮动刀头，并提供敏感肌模式。按照飞利浦公布的信息，产品支持3分钟快充，续航最长可达40天。公司试图将便携、快速剃须与视觉设计结合，让产品能够出现在通勤、健身、露营等浴室之外的场景。</p>\n  <p>不过，把剃须刀做得更像潮流单品，并不意味着功能竞争已经退居次要位置。对剃须产品而言，剃净效果、皮肤刺激、使用便利性和耐用程度仍然是决定复购的重要因素。灯光和配色可以带来初次购买的新鲜感，但能否形成持续需求，仍取决于产品在日常使用中的表现。飞利浦在采访中强调，萤火虫并未因体积缩小而牺牲性能，但相关性能优势仍需要通过实际使用和消费者反馈来检验。</p>\n  <p>从产品矩阵来看，萤火虫也不是飞利浦便携剃须刀业务的孤立尝试。2024年，飞利浦推出鹅卵石系列，主要面向中高端消费及礼赠需求；此次萤火虫进一步向年轻人延伸。与此同时，飞利浦还在高端产品线上推进带有屏幕定制、智能感应等功能的新品，尝试覆盖不同消费能力与理容需求的人群。</p>\n  <p>这意味着，飞利浦的策略并不是让所有消费者购买同一种剃须刀，而是通过价格、功能和设计的差异建立更细致的产品梯队。<strong>对于一个已经拥有成熟产品与品牌认知的企业而言，推出面向年轻人的产品，可以在不完全改变核心技术路线的情况下，拓展新的消费场景。</strong></p>\n  <p>价格则是这套策略能否成立的另一关键。吴品慧表示，品牌希望通过相对亲民的定价，让电动剃须刀成为更多年轻男性的入门选择。不过，对于年轻消费者而言，外观和情绪价值固然能够影响购买决策，但如果产品价格超出其日常用品的预算，场景化设计未必足以支撑购买。</p>\n  <p>飞利浦同时希望将中国市场打造为全球创新的重要来源。吴品慧表示，品牌过去几年持续在中国推进本土研发和产品创新，并希望将中国消费者认可的产品与营销经验带向其他市场。萤火虫所体现的本土化方向，是将年轻消费者的审美偏好和生活方式纳入产品设计，而不只是将海外成熟产品引入中国销售。</p>\n  <p>从行业经营的角度看，这种尝试能否产生实际增量，最终仍需要回到销售表现、用户结构和复购情况。年轻化设计可以让一件成熟品类重新获得关注，却不必然意味着消费者愿意为此增加预算。对于飞利浦而言，萤火虫真正需要验证的，不只是年轻人是否喜欢一把会发光、可以随身携带的剃须刀，而是这种设计能否转化为稳定的购买需求，并为成熟的电动剃须刀市场带来新的消费者。</p>", "category": "tech", "published_at": "2026-10-19T10:53:48+00:00", "fetched_at": "2026-10-20T03:09:53.639617+00:00", "fingerprint": "742a32aed2a63075"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨被指品质暴跌，山姆回应；宇树科技市值重回2000亿，人形机器人股批量涨停；马斯克承诺给“美国每个孩子”1股SpaceX股份", "url": "https://36kr.com/p/4033470689268610?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>长鑫科技旗下北京集电存储技术公司增资至约601.8亿</p>\n  <p>为什么有些功能微信鸿蒙版上还没有？微信回应</p>\n  <p>股票ETF上周净流入885亿元，为年内第四高</p>\n  <p>西贝否认“漫迩朵鲜羊肉铺”为旗下新品牌</p>\n  <p>国家税务总局发布关于离岸信托纳税申报的提示提醒</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>被指品质暴跌，山姆回应</strong></p>\n  <p>10月18日，“山姆品质暴跌你还敢去吗”话题登上热搜引发热议。10月19日，山姆会员商店发布声明称：近日，我们关注到在多个社交媒体平台上集中出现数千条针对山姆的恶意攻击及虚假营销信息。部分不良主体账号通过AI生成、拼接素材、伪造采访等方式，批量制造内容高度雷同、形式极其相似的不实信息攻击山姆的品质管理，实则是将从未在山姆上架的洗护、保健品、食品等品类的商品，编造成“山姆下架好物”的虚假信息进行欺骗性营销，引流牟利。</p>\n  <p>针对相关涉企不实信息传播、恶意营销炒作及网络黑公关行为，公司法务团队已对相关不实内容完成证据固定，并向平台及监管部门发起投诉举报，后续将依法采取法律维权行动，坚决维护消费者合法权益与山姆品牌声誉，对此类“以造谣谋私利”的恶劣行径绝不姑息。（第一财经）</p>\n  <p><strong>宇树科技市值重回2000亿，人形机器人股批量涨停</strong></p>\n  <p>10月19日，午后人形机器人概念持续走高，兆威机电、浙江荣泰、福莱新材、日盈电子、宁波东力涨停，宇树科技、斯菱智驱涨超10%，巨轮智能、步科股份、长盛轴承、中大力德等涨幅靠前。</p>\n  <p>另外，机器人龙头宇树科技 - W（688836.SH）午后持续反弹，涨幅超16%，总市值重返2000亿上方。截至收盘，宇树科技报495.92元/股，较前一交易日上涨68.94元，涨幅16.15%，总市值2005.82亿元。该股当日开盘427.00元，盘中最高触及508.99元，收盘创下8月19日科创板上市之后，除IPO首日外的最大单日涨幅。（财联社、界面新闻）</p>\n  <p><strong>马斯克承诺明年赠给“美国每个孩子”1股SpaceX股份</strong></p>\n  <p>埃隆·马斯克表示，明年他将把自己持有的SpaceX股份赠予“美国每个孩子”一股。他补充道：“这将是众多行动中的第一个”。数据显示，SpaceX有约81亿股已发行股份。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>MiniMax M3.1 Flash 上线,性能全面加强，速度提升3倍，价格降低70%</strong></p>\n  <p>36氪获悉，MiniMax正式发布新一代Flash模型M3.1Flash。此前以匿名身份处理了超过200TToken的Space Bunny模型，正是MiniMaxM3.1Flash的早期版本。作为新一代Flash模型，M3.1Flash在Agentic任务、编程、ComputerUse及网络安全能力等方面实现了代际的提升，同时线上推理速度提升了近3倍，使用成本降低了70%。据MiniMax预告，追求更高智能上限的Pro版本将于不久后推出。</p>\n  <p><strong>OpenAI拟融资300亿美元，估值或超1.4万亿美元</strong></p>\n  <p>据报道，OpenAI正加快推进一轮约300亿美元的融资，目标估值可能超过1.4万亿美元，并希望赶在竞争对手Anthropic预计于11月中旬上市前获得投资者承诺。软银集团、阿布扎比投资机构MGX及其他现有投资者正洽谈参与本轮融资。OpenAI向投资者表示，其年化营收在推出GPT-6 Astra模型后加速增长，目前已达500亿美元，预计年底升至700亿美元。公司希望在Anthropic披露更多财务信息、引发投资者进一步比较之前完成融资。OpenAI今年3月在一轮1220亿美元融资后估值达到8520亿美元。（界面新闻）</p>\n  <p><strong>国内55%算力用于视频和短剧？豆包辟谣</strong></p>\n  <p>近日，“国内超一半算力在造爽剧”的话题，引发广泛关注。对此，豆包公关负责人刘星10月19日在微博发文表示：“某公司发布的这个算力数据有些不靠谱，就字节来说，我们公司的总算力中，只有约10%，用于视频生成模型的训练和推理。”（第一财经）</p>\n  <p><strong>Deepseek公布API网页搜索与抓取费用：每1000次成功请求5元</strong></p>\n  <p>36氪获悉，据DeepSeek消息，DeepSeek API已支持网页搜索与抓取，按请求次数计费，单价为每1000次成功请求5元。公告称，当前用户在DeepSeek Harness/Claude Code/Codex中使用DeepSeek API时，已经会通过Server端工具调用访问到Search/Fetch接口，这部分Search/Fetch接口调用目前未计费，并将于11月1日00:00起按次收取调用费用。</p>\n  <p><strong>OpenAI大举招募人才加码机器人研发</strong></p>\n  <p>从“用大模型给机器人当大脑”到进一步向机器人硬件、控制系统和制造环节延伸，OpenAI正在加码机器人研发。截至10月19日，OpenAI在官网发布了19个与“Robotics”相关的职位招聘信息，涵盖机器人控制系统、电气工程、执行器、电机设计、制造、数据系统等多个方向。OpenAI在官网表示，这支机器人团队希望开发能够在动态真实环境中工作的通用机器人，并探索多种机器人形态。他们目前正同时推进机器人软硬件研发，并建立现实世界机器人数据采集和训练体系。OpenAI的现场工程师岗位的招聘信息中透露，其机器人数据采集环境中已经运行着多个机器人工作站。（澎湃新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>汇源集团回应与“汇源”品牌切割</strong></p>\n  <p>10月19日，汇源集团发布关于与“汇源”品牌进行切割并推出“咱家果源”品牌的声明。对此，汇源集团回应称，“切割是把历史争议留给法律，把产品选择交给消费者，把企业的精力还给市场。\"该声明称，汇源集团及下属企业，不再生产带有“汇源”商标的果汁产品，终止相关代工合同，不再开展与该商标的合作;公司已经正式启用“咱家果源\"品牌，依托完整自有全产业链继续深耕果汁事业。(界面)</p>\n  <p><strong>宇树科技：公司持续关注核心零部件的自主可控与供应链优化</strong></p>\n  <p>36氪获悉，宇树科技在互动平台表示，公司持续关注核心零部件的自主可控与供应链优化，具体自研自产比例等经营数据，请以公司公开披露的信息为准。</p>\n  <p><strong>金发科技：董事长提议回购3亿至5亿元股份</strong></p>\n  <p>36氪获悉，金发科技公告，公司董事长陈平绪提议公司使用自有资金及自筹资金，通过集中竞价交易方式回购部分A股股份，回购资金总额为3亿元至5亿元，回购股份将全部用于注销并减少注册资本。回购价格上限不高于董事会审议通过方案前30个交易日股票交易均价的150%，回购期限为股东会审议通过之日起12个月内。</p>\n  <p><strong>长鑫科技旗下北京集电存储技术公司增资至约601.8亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，长鑫集电（北京）存储技术有限公司发生工商变更，注册资本由约508.5亿人民币增至约601.8亿人民币，增幅约18%。该公司成立于2016年8月，法定代表人为赵纶，经营范围含集成电路设计、集成电路芯片及产品制造、集成电路制造等，由长鑫科技集团股份有限公司、北京亦庄国际投资发展有限公司、国家集成电路产业投资基金二期股份有限公司、北京亦庄科技有限公司、北京屹唐科技有限公司共同持股。</p>\n  <p><strong>3家券商、2家基金公司因在境外调研违规行为被采取监管措施</strong></p>\n  <p>监管最新通报称，部分基金公司参加证券公司研究所组织的境外调研活动时，存在由证券公司承担专家咨询、调研门票等费用的情形，反映出相关证券公司、基金公司内部控制有效性存在不足；个别基金公司从业人员因私出国旅游的往返机票、酒店等费用由证券公司支付。针对此情况，监管部门已依法从严对存在不配合检查情形的G1证券公司采取监管谈话的监管措施，责令公司对相关负责人从严处分；对H、G2证券公司和F、H基金公司采取出具警示函的监管措施；对H基金公司基金经理采取责令改正的监管措施，并要求公司严肃内部追责。（财联社）</p>\n  <p><strong>紫竹高科：控股子公司拟向全国中小企业股份转让系统申请股票终止挂牌</strong></p>\n  <p>36氪获悉，紫竹高科公告，公司控股子公司上海紫江新材料科技股份有限公司（简称“紫江新材”）拟主动申请将其股票在全国中小企业股份转让系统终止挂牌。该事项不会影响公司对紫江新材的持股比例及控股地位。紫江新材作为公司的控股子公司，将继续在铝塑膜领域内积极拓展业务。</p>\n  <p><strong>微信发起公众号小说改编微短剧激励，作者与承制方各获额外5%分成</strong></p>\n  <p>36氪获悉，10月19日，微信开放平台联合视频号团队发起“公众号小说改编微短剧：第一期”激励活动，支持原创小说IP开展微短剧改编。根据规则，入选作品作者与短剧承制方在2026年11月1日至12月31日期间签署改编合同、完成改编并于微信生态优先发行后，双方均可获得该短剧在优先发行期（发行后前30天）变现收入额外5%的现金激励，上不封顶。发行载体为绿泡泡短剧小程序与视频号原生短剧；若优先发行期内于第三方平台上线，平台有权回收全部激励。</p>\n  <p><strong>为什么有些功能微信鸿蒙版上还没有？微信回应</strong></p>\n  <p>10月19日，针对为何有些功能微信鸿蒙版上还没有，微信公关团队成员小蒋在播客中表示，“很长一段时间的误解是，微信是不是在‘敷衍’，或者说有意拖慢这个事情？我们用的方式是‘先上尝鲜版，再公测，再正式上架’这么一个过程。面临一个全新的操作系统，它功能更新的过程，跟用户的预期之间，会有一些差距。”（界面新闻）</p>\n  <p><strong>潘功胜：将退出存贷款基准利率，用市场化利率指标来替代</strong></p>\n  <p>在2026金融街论坛年会开幕式上，中国人民银行行长潘功胜表示，退出存贷款基准利率。随着利率市场化改革推进，存贷款基准利率逐步被市场化的定价基准替代。银行贷款利率已经有贷款市场报价利率、银行间隔夜回购利率等多个定价基准；自今年一季度开始，人民银行对外公布了各个期限的存款平均利率，作为银行存款定价的参考。下一步，人民银行将推动这些领域的计息依据用市场化的利率指标来替代，实现退出金融机构存贷款基准利率。（财联社）</p>\n  <p><strong>财政部决定开展10月份国债做市支持操作</strong></p>\n  <p>36氪获悉，据财政部消息，为支持国债做市，提高国债二级市场流动性，健全反映市场供求关系的国债收益率曲线，财政部决定开展国债做市支持操作。</p>\n  <p><strong>鸿海拟收购三菱电机移动50%股权，共同经营汽车设备业务</strong></p>\n  <p>10月19日，鸿海宣布，将通过旗下投资管理子公司Lin Yin与三菱电机签订策略联盟，共同经营汽车设备业务。根据合作协议，三菱电机将移转旗下负责汽车设备业务的三菱电机移动50%股权予Lin Yin，未来由双方共同经营三菱电机移动。此次股权移转交易金额预计为1150亿日元（约合7.27亿美元）。根据股权移转协议，标的业务的企业价值为3200亿日元（约合20.24亿美元），股权价值为2300亿日元（约合14.54亿美元），本次交易价格即依据股权价值计算。待相关条件均获满足后，预计于2027年10月1日完成股权移转交易。（界面新闻）</p>\n  <p><strong>股票ETF上周净流入885亿元，为年内第四高</strong></p>\n  <p>持续放量，使得上周股票ETF净流入额来到年内第四高的水平。Wind数据显示，上周股票ETF合计净流入884.93亿元，仅次于7月的3周水平。4只股票ETF在上周净流入超过百亿，分别是沪深300ETF易方达（净流入196.92亿元）、沪深300ETF华泰柏瑞（净流入176.47亿元）、创业板ETF易方达（净流入111.83亿元）、科创50ETF华夏（净流入104.2亿元）。其中，上周五也是上周单日净流入最高，净流入250.39亿元，仅沪深300ETF华泰柏瑞（净流入129.95亿元）就贡献过半的净流入。（财联社）</p>\n  <p><strong>西贝否认“漫迩朵鲜羊肉铺”为旗下新品牌</strong></p>\n  <p>10月19日，西贝方面对界面新闻表示，宁波世纪东方商场的“漫迩朵鲜羊肉铺”与其无关，并非旗下新品牌。界面新闻注意到，此前，宁波世纪东方商场的西贝门店改为“天边砂锅焖面”，随后再更换成为“漫迩朵鲜羊肉铺”，菜品与西贝类似，主做内蒙羊肉。社交平台上有网友称该品牌也归属西贝旗下。工商登记信息显示，其关联公司为宁波市鄞州福明漫朵餐饮店，与西贝没有股权、隶属、直营主体关系。（界面新闻）</p>\n  <p><strong>国家统计局：9月一二三线城市商品住宅销售价格同比降幅均收窄</strong></p>\n  <p>36氪获悉，据国家统计局，9月一二三线城市商品住宅销售价格同比降幅均收窄。　9月份，一线城市新建商品住宅销售价格同比下降0.5%，降幅比上月收窄0.4个百分点。其中，北京、广州和深圳分别下降2.7%、1.1%和1.0%，上海上涨2.8%。二、三线城市新建商品住宅销售价格同比分别下降2.4%和3.9%，降幅分别收窄0.3个和0.2个百分点。9月份，一线城市二手住宅销售价格同比下降1.5%，降幅比上月收窄1.2个百分点。其中，北京、广州和深圳分别下降2.5%、2.9%和1.5%，上海上涨0.8%。二、三线城市二手住宅销售价格同比分别下降4.5%和5.4%，降幅分别收窄0.4个和0.2个百分点。</p>\n  <p><strong>iPhone Duo商家近百万元订单遭压价，陷入亏本风险</strong></p>\n  <p>苹果首款折叠屏iPhone Duo 近日刚开启预售，首发溢价行情快速降温，不少提前囤货的手机商家遭遇订单压价，陷入亏本风险。郑州手机经销商许山提前锁定50台首批货源，这批机器总货款接近百万元，合计999950元。他已经向上游支付了25000元订金，原本计划转手卖给同行赚取差价。按照最初约定，每台能赚取2000元利润，50台合计可赚10万元。然而行情急转直下，原定收货的下家一夜之内两次下调接货报价，10月17日上午给出的3500价格已经低于许山原价加4000元进货成本。按照最新报价，这批货全部出手将直接亏损2.5万元。</p>\n  <p>与此同时，普通抢购用户也遭遇溢价缩水。有消费者抢到新机，原本打算加价6000元转手，结果二手收货商最高只给到加价3000元，首发万元溢价的行情也落空。业内人士分析，折叠屏新机产能爬坡速度超出预期，市场溢价窗口期大幅缩短，盲目囤货的黄牛将面临较大亏损风险。（快科技）</p>\n  <p><strong>木头姐看多韩存储芯片：韩股下跌源于程序化交易，韩国半导体板块已进入买入区间</strong></p>\n  <p>方舟投资CEO、“颠覆性创新投资”代表人物凯茜・伍德，近期如此解读遭外资抛售冲击的韩国股市。对于大幅回调的韩国半导体个股，她表示：“市场确实已经进入买入区间。”被问及外资撤离的核心诱因，伍德解释：“今年6月，存储芯片价格见顶回落，同时韩元兑美元汇率创下新高。股价下跌叠加汇率因素，触发大量机械式程序化交易，问题根源并非韩国市场本身基本面存在硬伤。”（新浪财经）</p>\n  <p><strong>国家税务总局发布关于离岸信托纳税申报的提示提醒</strong></p>\n  <p>从国家税务总局获悉，税务总局网站当日发布提示，提醒相关纳税人尽快梳理本人离岸信托情况，在过渡期内依法申报纳税，避免产生滞纳金及其他相关风险。按照财政部、税务总局7月24日印发的《关于离岸信托个人所得税有关事项的公告》规定，离岸信托纳税人需就离岸信托收益申报缴纳个人所得税。公告给予纳税人90日的过渡期，在过渡期内(10月22日前)完成申报缴税，不加收滞纳金。此次提示明确，税务部门将为纳税人提供细致税收辅导和办税服务，帮助纳税人依法履行纳税义务、维护自身权益。(新华社)</p>\n  <p><strong>美股三大指数涨跌不一，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，10月19日收盘，美股三大指数涨跌不一，纳指涨1.11%，标普500涨0.41%，道指跌0.07%；大型科技股多数上涨，闪迪涨超5%，亚马逊、SK海力士涨超4%，特斯拉涨超3%，美光科技、英特尔涨超2%，英伟达、谷歌涨超1%，微软小幅上涨，苹果、Meta小幅下跌；热门中概股普跌，爱奇艺跌超2%，蔚来跌超1%，京东、网易、阿里巴巴、百度、理想汽车、小鹏集团小幅下跌，拼多多小幅上涨。</p>\n  <p><strong>苹果宣布将于10月28日举行产品发布活动，分析师预计将推出触屏笔记本电脑</strong></p>\n  <p>苹果宣布将于10月28日举行产品发布活动，并于周一向媒体和分析师发出邀请，活动名为“Apple Experience in Los Angeles”。邮件中写着“Pro and tell”，暗示此次发布将聚焦于搭载强大自研芯片的高端“Pro”设备。Melius Research分析师Ben Reitzes周一在报告中写道，他预计今年秋季将推出新款Mac，“包括一款触屏笔记本”。他表示，对于上月接替Tim Cook出任首席执行官的John Ternus而言，这样的发布节奏标志着相比以往每年两场活动的“重大转变”。（新浪财经）</p>\n  <p><strong>纽约证券交易所将延长部分期权交易时段，涉及英伟达、苹果等证券</strong></p>\n  <p>纽约证券交易所(NYSE)对部分NYSEAmerican期权延长交易时段，首批符合条件的标的证券包括道富SPDR标普500ETF信托、iShares安硕罗素2000ETF、SPDR黄金信托、以及苹果、微软、英伟达、Alphabet、亚马逊和甲骨文。早盘交易时段为美东时间上午7:30至9:25；晚盘交易：时段为美东时间下午4:00至4:15。纽交所首席产品官KevinTyrrell表示：“延长期权交易时段反映了市场需求，让投资者能在更长时间内把握投资:机会并进行可靠的风险管理”。(财联社)</p>\n  <h2>上市进行时</h2>\n  <p><strong>韩国称SK海力士旗下Solidigm上市将构成重复上市</strong></p>\n  <p>韩国金融监督院院长李灿珍表示，韩国最高金融监管机构正密切关注SK海力士旗下Solidigm的上市事宜，认为其潜在首次公开发行属于所谓“重复上市”。李灿珍10月19日向国会议员表示，监管机构将讨论本次IPO是否需要遵守韩国证券注册相关规定。韩国已收紧母公司与子公司分拆上市的监管规则，以保护中小股东权益；但根据现行法规，监管机构无权阻止Solidigm赴海外上市。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>海光信息：2026年前三季度净利润28.47亿元，同比增长45.12%</strong></p>\n  <p>36氪获悉，海光信息公告，2026年前三季度营业收入149.55亿元，同比增长57.58%;扣非净利润25.84亿元，同比增长42.25%;第三季度营业收入58.56亿元，同比增长45.46%，归母净利润10.48亿元，同比增长37.90%。</p>\n  <p><strong>科大讯飞：2026年第三季度净利润2.26亿元，同比增长31.05%</strong></p>\n  <p>36氪获悉，科大讯飞公告，2026年第三季度营业收入65.64亿元，同比增长7.99%；归属于上市公司股东的净利润2.26亿元，同比增长31.05%；扣非净利润亏损1.26亿元。2026年前三季度营业收入181.87亿元，同比增长7.05%；归属于上市公司股东的净利润2188.72万元，同比增长132.83%；扣非净利润亏损7.63亿元。</p>\n  <p><strong>璞泰来：2026年第三季度净利润8.24亿元，同比增长27.79%</strong></p>\n  <p>36氪获悉，璞泰来公告，2026年第三季度营业收入57.44亿元，同比增长53.48%；归母净利润8.24亿元，同比增长27.79%；扣非净利润8.07亿元，同比增长34.92%。2026年前三季度营业收入158.58亿元，同比增长46.43%；归母净利润22.76亿元，同比增长33.87%；扣非净利润21.19亿元，同比增长33.25%。</p>\n  <p><strong>佛燃能源：2026年第三季度净利润1.96亿元，同比增长8.83%</strong></p>\n  <p>36氪获悉，佛燃能源公告，2026年第三季度营业收入64.75亿元，同比下降20.69%；归母净利润1.96亿元，同比增长8.83%；扣非净利润1.82亿元，同比增长5.34%。2026年前三季度营业收入195.45亿元，同比下降16.84%；归母净利润5.26亿元，同比增长7.40%；扣非净利润5.44亿元，同比增长13.32%。</p>\n  <p><strong>中国巨石：2026年第三季度净利润24.12亿元，同比增长173.80%</strong></p>\n  <p>36氪获悉，中国巨石公告，2026年第三季度营业收入69.19亿元，同比增长44.30%；归母净利润24.12亿元，同比增长173.80%；扣非净利润24.06亿元，同比增长163.98%。2026年前三季度营业收入180.78亿元，同比增长30.02%；归母净利润53.46亿元，同比增长108.15%；扣非净利润53.13亿元，同比增长103.39%。</p>\n  <h2>投融资</h2>\n  <p><strong>“铭芯启睿”完成超4亿元A轮融资</strong></p>\n  <p>36氪获悉，10月19日，铭芯启睿（MemSilicon）宣布完成超4亿元A轮融资。本轮融资由博原资本领投，博世创投、创领资本、米哈游、中关村科学城公司、兆易创新等跟投，老股东复容投资、国开科创、恒裕资本、锦秋基金、顺禧基金、小米战投、中科创星持续加注。本轮融资将主要用于RRAM的产业化与商业化，以及新产品LPU的研发。</p>\n  <p><strong>“山海氢”完成数千万元天使+轮融资</strong></p>\n  <p>36氪获悉，近日，“山海氢”完成数千万元天使+轮融资，本轮由中赢创投领投。这是继中科创星独家投资后，公司半年内完成的第二轮千万元级融资。资金将主要用于膜电极产能释放、催化剂及浆料量产迭代，以及国内外市场拓展。</p>\n  <p><strong>“原力能源”完成数亿元融资</strong></p>\n  <p>36氪获悉，近日，“原力能源”完成新一轮融资。据公司披露，本轮融资金额数亿元，投资方包括合肥仁创四期创业投资合伙企业（有限合伙）、合肥仁新创业投资合伙企业（有限合伙）。本轮资金将主要用于产品及能源垂直模型研发、区域市场拓展，以及部分能源资产投资。</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-10-20T00:20:39+00:00", "fetched_at": "2026-10-20T03:09:53.639610+00:00", "fingerprint": "037c785859e2dc72"}, {"source": "36氪 - 最新文章", "title": "顺为投了一位北大PI，想用AI“解密”人脑", "url": "https://36kr.com/p/4032248929686151?f=rss", "summary": "<p>&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_42a5fd3a4caa4331abb8eb7b6b023d6d@5930287_oswg2840681oswg1672oswg941_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">人脑从万维空间中涌现（图源：格原万维）</p>\n  <p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>人脑，是自然界演化出的最复杂的系统之一。</p>\n  <p>成年人脑只有两个拳头大小，但容纳了近860亿个神经元及同等数量的非神经元细胞，它们彼此连通，织就庞大繁复的脑网络，承载起人类全部的智能、情感、记忆和自我意识。这套系统如此精妙，以至于人脑最大的悖论是，我们的大脑不够聪明去理解如此聪明的大脑。</p>\n  <p>那么，AI能做得更好吗？</p>\n  <p>这是卢萌过去15年来一直想做的事。从2011年赴剑桥大学读博,到2024年回国前担任高级研究员，卢萌一直主攻神经退行性疾病研究。遵循传统神经科学研究范式，他搭建了不少细胞模型和分析算法，从分子、细胞层面解析脑疾病与药物的作用机制；也借助过成像技术，追踪疾病进程中或用药后的细胞内部结构变化。</p>\n  <p>但他随后意识到，<strong>这类研究如同手持绣花针，只能锚定极小的微观尺度，难以窥见人脑全貌，更无法还原疾病发生、扩散的完整过程。</strong></p>\n  <p>卢萌由此产生一个想法：如果能逐层打通分子、细胞、脑区直至全脑的多尺度信息，或许可以搭建一套“完整理解大脑的研究体系”。</p>\n  <p>这需要海量数据和大规模算力协助完成。因此，2017年左右，卢萌就尝试将AI引入神经科学研究。但彼时的AI能力还停留在计算机视觉阶段，难以支撑跨尺度人脑建模。</p>\n  <p>直到大语言模型出现后，卢萌惊喜地发现，“Transformer的自注意力机制与生物信息高度契合”。“如果我们把细胞比作长句子，每个基因就是一个词，细胞所处环境就是上下文，而上下文决定了基因表达水平、细胞在组织内的状态。大模型和生物信息底层原理相通，这为搭建跨尺度人脑模型创造了技术机会”。</p>\n  <p>于是，2024年回北大担任助理教授后，卢萌正式启动这项工作，并担任AI4S公司格原万维（LattixOrigin）的首席科学家。</p>\n  <p><strong>36氪独家获悉，近期，格原万维已完成近千万美元种子轮融资。投资方包括顺为资本、云沐资本、Xirius和中关村资本。本轮募集资金将用于搭建干湿实验验证闭环，以及购买算力、组建团队等。</strong></p>\n  <p>卢萌坦言，想将这套跨尺度解析人脑的宏大构想落地，仅凭高校实验室资源很难维持。AI快速席卷一切的今天，算力、顶尖跨学科人才成本水涨船高；模型训练、搭建干湿实验闭环，每一步都需要持续资金投入。这也是他选择吸纳外部资金的重要原因。</p>\n  <p>在卢萌看来，AI与生物学的关系正在发生根本性翻转。在传统生物学研究中，AI更多是被当作一种工具，嵌入既有的生物学研究流程。科研人员的假设是起点，也是终点，能探索的路径有限。</p>\n  <p>而他想做的，是<strong>“站在AI视角重新组织生物学研究”</strong>。先有高质量、标准化的数据，再让模型从海量信息中学习底层规律，而非将人的主观预设强加给模型。</p>\n  <p>据了解，格原万维团队已训练出初代DigitalBrain-M1人脑基础模型，在部分脑区的功能解析上，与影像组学高度吻合。</p>\n  <p>随着后续模型迭代，卢萌希望，DigitalBrain系列模型能作为人脑的“GPT”：研究者做脑疾病药物研发时，可以依托这套系统快速发现靶点，解析机制，找到最优的疾病干预路径；更进一步，或许还能帮助人类理解智能本身。</p>\n  <p>这些，都将成为摘取人脑“科学圣杯”的漫漫长路上，接连踏出的每一小步。</p>\n  <p>对话（经编辑）：</p>\n  <h2><strong>炼8000万脑细胞，画“人脑版”谷歌地图</strong></h2>\n  <p><strong>36氪：能不能先描述一个画面，未来，模型具备你预期的“跨尺度推理能力”后，能给科学家研发新药带来什么改变？</strong></p>\n  <p><strong>卢萌：</strong>对比传统研究模式，模型能帮助研究者更快发现疾病靶点解析机制；并且，可以预测扰动靶点之后会产生怎样的生物学效应，从而更精准地找到致病基因、发掘有效靶点，更早干预疾病。</p>\n  <p>以阿尔茨海默症为例，传统阿尔茨海默症药物研发，靶点大多集中在β淀粉样蛋白沉淀上，因为这是患者大脑里最明显的病理特征。但是，等β淀粉样蛋白沉淀出现时，大脑一般已经产生实质性损伤。这个阶段哪怕清除了沉淀，认知损伤也很难被修复。因此，理想状况是在明确的病理标志物出现前完成干预，阻断病变进入不可逆阶段。</p>\n  <p>如果我们能拥有全模态、多尺度人脑模型，或许可以推演阿尔茨海默症的完整发病进程：病变从哪些脑区起始、又如何扩散到其他脑区？完整病程是怎么演进的，什么时候是干预阈值？这就有可能帮我们找到更早的干预节点，在病变进入不可逆阶段前把它挡住。其价值是根本性的。</p>\n  <p><strong>36氪：2024年，你入职北大。但在开始做DigitalBrain系列模型前，你先花了两年多时间打磨数据集，为什么做这件“苦工”？</strong></p>\n  <p><strong>卢萌：</strong>脑疾病药物研发的核心瓶颈是，模型与真实人脑不匹配。传统方法中，科学家主要靠动物实验推测人类大脑变化，但两者生理系统差异巨大，导致大量在动物身上有效的靶点，到人体就失效。例如，小鼠不会自发患上阿尔茨海默症，哪怕人为转入致病基因，也只能模拟部分症状。</p>\n  <p>我们认为，想更好地开展脑科学研究、开发脑疾病药物，就要以真实人脑数据为底层支点，做人脑基础模型。</p>\n  <p>早期，我们其实有些低估了项目难度。搭建高质量模型的前提是优质数据，但在脑科学领域，研究者无法像做动物实验那样规模化采集人脑样本，大多只能从医院获取，导致全球公开的人脑研究数据一直非常零散、总量有限，且缺少统一质控和标注标准。这不利于训练模型。</p>\n  <p>所以，我们决定从构建数据集开始做起，再以此为基础，训练出一个能完成跨尺度表征的人脑基础模型。</p>\n  <p><strong>36氪：原始数据的主要来源是什么？有没有比较独家的自采数据？</strong></p>\n  <p><strong>卢萌：</strong>坦诚讲，早期时团队与国内医院的合作基础相对薄弱，主要使用公开研究数据。</p>\n  <p>我们整合了包括跨国联合科研项目BICCN（大脑细胞普查网络）等200余项研究，全部原始数据总量近亿级的人脑细胞，规模上位居全球前列。横向对比，2023年BICCN在《Science》上发表的核心研究成果的数据量为330万，顶级脑科学研究机构艾伦研究所（Allen Institute）最大的人脑数据集SEA-AD（2026）为600万。</p>\n  <p><strong>此外，我们的数据类型也较广泛，包含超过4000名供体、年龄跨度为0-96岁，覆盖全脑165个脑区以及神经元、胶质细胞、血管细胞等全部细胞类型。</strong></p>\n  <p><strong>这个量级、丰富度已可供我们先训练初代DigitalBrain-M1人脑基础模型，探索人脑共通的底层机制和约束。</strong>后续，我们计划推进与国内外顶级医院等医疗机构的合作，进一步补充中国人脑数据等特色数据。</p>\n  <p><strong>36氪：如果核心数据源都是公开的，你们花这么大力气做这件事的价值主要是什么？</strong></p>\n  <p><strong>卢萌：</strong>简单的数据收集、汇总，门槛确实较低。</p>\n  <p>但我们做了专业的数据“精炼”。我们参考艾伦“金标准”的标注体系，对各项研究进行了统一的去批次、降噪、补充元信息、对齐到同一个表征空间，产出AI-ready的标准化人脑数据集，形成训练底座。</p>\n  <p>同时，我们还开发了独有的基因检索功能。过去，研究人员只能了解某个基因在局部脑区的表达，还得先找到原始切片图或表达矩阵，再自己写代码处理，耗时长，结论也未必清晰。在我们的系统中，大家能像打车软件一样直接检索任意基因在全脑各脑区各类细胞中的准确表达情况，还可选择疾病和年龄条件，DigitalBrain-Atlas的数据覆盖面与精度都是行业内较为领先的。</p>\n  <p>这就像给人脑构建了一个谷歌地图，精准了解基因坐标。这将对研究人脑，以及定位脑疾病致病基因、挖掘相关药物靶点，乃至脑机接口研究等工作有重要意义。目前，我们已将近1700万个细胞的标准化数据开源，供全球研究者免费检索使用。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_39dc50d756294f8cb7f539b93a5c9c0b@5930287_oswg2039447oswg2558oswg1318_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：格原万维DigitalBrain-Atlas（https://digitalbrain-human.com/）</p>\n  <p><strong>36氪：将各项研究“标准化”的主要难点是什么？</strong></p>\n  <p><strong>卢萌：</strong>繁琐之处在于，需逐份核对数据集。虽然自动化批量处理算法也能做这件事，但无法解决全部问题，例如，部分数据集存在文件名与内部数据不匹配、重复标注、标注错误等问题。在海量数据点里定位错误来源，就像从成千上万个零件里排查故障零件。为保质量，我们会逐一做人工复核校验。</p>\n  <h2><strong>人脑基模的Scaling Law</strong></h2>\n  <p><strong>36氪：完全用人脑细胞数据训练出来的模型，现在表现得怎么样？</strong></p>\n  <p><strong>卢萌：</strong>先厘清一个问题，模型不会自动实现跨尺度推理。预训练阶段，它输出的是表征嵌入（embedding），即将基因、细胞的生物学信息编码成数字向量。生物学上越相似的东西，在这个向量空间里离得越近。但这是模型理解生物信息的“基础产物”，还不能直接用来做疾病推演、靶点预测等复杂任务。</p>\n  <p>但有意思的是，我们用DigitalBrain-M1的表征分析脑区之间的功能关联，结果和传统影像组学（fMRI）的观测高度匹配。</p>\n  <p>最典型的是BA23和BA32两个脑区。它们都在大脑内侧的扣带回上，你可以想象成大脑中间有一条C形走廊，BA32在前，BA23在后，隔得不算近。但功能上，它们同属默认模式网络，负责回忆、内省、自我价值评判等活动。DigitalBrain-M1只看成千上万个细胞的基因表达，没见过脑影像信息，却能识别出这两个脑区存在功能关联，<strong>这说明模型捕捉到跨层级脑网络的底层生物学规律，是一种人脑结构的涌现，令我们非常振奋</strong>。</p>\n  <p>当然，目前达成的还只是部分脑区的匹配，全脑范围的精准匹配还做不到。我们后续会开发适配器和解码器，让模型能直接做推理和预测。</p>\n  <p><strong>36氪：模型输出结果和常规影像学结果相互印证，说明你们这套研究人脑的技术路径是可行的？</strong></p>\n  <p><strong>卢萌：</strong>我认为，这至少证明我们探索出了一个正确的方向。</p>\n  <p><strong>36氪：延续这个思路，DigitalBrain后续的迭代规划是怎样的？</strong></p>\n  <p><strong>卢萌：</strong>构建AI4S的Scaling Law，不断扩大数据集规模，提高算力和参数量。就好比ChatGPT，GPT-2最初只是一个可以续写文本的模型，但其真正的价值在于走上了Scaling Law的正确路线，只是能力不够颠覆。后续GPT-4、GPT-5随着规模放大，涌现出的推理能力、多模态能力，使模型能够落地到很多小模型阶段预想不到的应用场景。</p>\n  <p>在这个维度上，DigitalBrain-M1相当于GPT-2，是我们打通技术路线的第一个版本。M2已经启动研发，我们希望模型能涌现出更强的多尺度人脑解析能力。</p>\n  <p><strong>36氪：要实现这些目标，还需要做哪些事情？</strong></p>\n  <p><strong>卢萌：</strong>需要打造两套闭环。首先是对外生态闭环，联合医院共建数据集；第二，联合高校构建干湿实验闭环。</p>\n  <p>AI4S和纯AIGC不太一样，前者必须依靠真实实验数据来迭代模型。但传统科研“小作坊”模式的数据产出效率远远不够，所以我们需要依靠自动化和机器人，以工业级规模生产生物学数据，支撑Scaling Law落地。</p>\n  <h2><strong>服务脑机接口等研究</strong></h2>\n  <p><strong>36氪：除新药研发外，脑机接口是公司规划的远期落地场景。但脑机接口给人的印象更多是“读脑信号、植电极、刺激大脑”，和你们做的“分子层面的人脑模型”听起来是两回事，这两者是怎么联系起来的？</strong></p>\n  <p><strong>卢萌：</strong>从生物学的基本原理而言，所有层级的结构和动力学都由最底层的基因表达决定，这也是我们的出发点。我们希望DigitalBrain可以作为基础底座模型，服务脑机接口以及其他人脑大尺度研究。脑机接口的核心，其实就是找到精准靶点，用合适的模式做刺激调控。而找靶点、预测刺激效果，恰恰是我们的模型能发挥作用的地方。</p>\n  <p>例如抑郁症、精神分裂症这类精神疾病。依托完整的分子信息，模型可以推演大脑的连接网络，再基于网络做预测、模拟扰动，评估特定基因背景下的患病概率；或定位网络里比较脆弱的节点，研究怎么调控才能降低发病风险。相当于告诉你“刺激哪里、怎么刺激”。</p>\n  <p>其实这就相当于数据共享。脑机接口可以调用我们的人脑基模优化自身模型，而我们也希望获取脑机接口的实测数据，迭代我们自己的模型。不同领域团队都在朝着同一个研究目标收敛，可以理解为双向奔赴。</p>\n  <p><strong>36氪：如果脑机接口公司、医疗影像公司自己做模型，是不是也能做这件事？</strong></p>\n  <p><strong>卢萌：</strong>的确，一些脑机接口、脑影像公司虽也在做人脑基础模型，但主要基于影像数据做训练，其分辨率为毫米级，能看脑区整体情况，但缺乏最底层的单细胞、基因表达这类微观分子信息；一些虚拟细胞企业尝试做类似的事，但主要聚焦在实验室条件下的细胞扰动训练，缺乏真实细胞的人脑层级信息。我们以人脑细胞为基础，构建基于基因表达的层级涌现模型，是我们独特的地方。</p>\n  <p>这其实也是投资机构对我们感兴趣的原因之一。在我们的体感中，科技投资人们希望挖掘科学逻辑无懈可击，且具备创新性的方向。脑科学领域，很多同时满足这两个条件的事情大家都已经在做了，且竞争比较充分，例如用脑机接口治疗帕金森、瘫痪等。而构建“跨尺度人脑基础模型”这件事本身，还没有人做过。</p>\n  <p><strong>36氪：想要真正落地在脑机接口场景，DigitalBrain模型还需要补齐哪些能力？</strong></p>\n  <p><strong>卢萌：</strong>首先，需要从现在的局部匹配到实现完整、精准的全脑脑网络涌现能力；其次是动态状态空间，也就是时间序列预测能力。不只是预测静态的脑区关联，还要能预测施加刺激、扰动之后，脑网络的状态怎么随时间变化。比如刺激之后效果能持续多久，不同频率、不同强度的刺激有什么不同效果等。</p>", "category": "tech", "published_at": "2026-10-20T01:00:00+00:00", "fetched_at": "2026-10-20T03:09:53.639601+00:00", "fingerprint": "76405957dab6d280"}, {"source": "36氪 - 最新文章", "title": "硬氪首发｜用AI智能体辅助新材料研发，睿质科技完成数千万元天使轮融资", "url": "https://36kr.com/p/4033523733042053?f=rss", "summary": "<p>文｜杨媛</p>\n  <p>编辑｜彭孝秋</p>\n  <p>硬氪获悉，北京睿质科技有限公司（以下简称“睿质科技”）近日完成数千万元天使轮融资，本轮由中关村资本领投，中关村科学城公司跟投，中关村产业研究院担任独家财务顾问。目前，公司正在推进新一轮融资。</p>\n  <p>睿质科技是一家从事AI材料研发软件及平台开发的科技企业，由院士、长江学者团队领衔，主要面向科研机构及工业企业提供材料计算、性能预测和研发服务。</p>\n  <p>公司目前围绕科研智能体、材料计算和数据管理等方向开发AI材料研发平台，业务涉及先进功能陶瓷、合金、新能源材料等领域。</p>\n  <p>与直接生产、销售材料的企业不同，睿质科技主要将材料研发过程中的计算模拟、数据分析等能力转化为软件产品和研发服务，供科研机构及工业企业使用。</p>\n  <p>例如，开发新型合金需要设计不同材料配方，再通过实验测试其性能。材料计算软件则可以在实验之前，对不同配方的结构和性能进行模拟预测，帮助企业研发人员缩小候选范围。</p>\n  <p>睿质科技提供的正是这类工具和服务。公司希望通过自主研发的Archeos智能体平台，将原本需要科研人员分别完成的方案设计、结构建模、计算分析及数据处理等工作整合起来，减少不同工具之间的切换，并进一步进入工业企业的研发流程。</p>\n  <h3><strong>把材料研发中的计算环节做成产品</strong></h3>\n  <p>在材料研发过程中，从材料配方设计、工艺优化到性能验证，研究人员往往需要使用不同的计算方法和软件工具。由于不同软件的数据格式、计算流程和操作方式存在差异，研究人员通常还需要投入时间完成工具部署、数据转换和计算流程设计。</p>\n  <p>睿质科技希望通过平台化产品整合这些工作。其核心产品Archeos采用多智能体架构，集成文献检索、材料设计、计算仿真、结果分析及报告生成等功能，将原本分散在不同软件和研发环节中的工作整合起来，使研究人员能够在统一平台上完成更多计算任务。</p>\n  <p>具体而言，平台将材料研发任务拆分为不同环节，再由相应智能体调用计算工具，完成方案生成、计算执行、结果分析及反馈迭代等工作。例如，在材料性能预测任务中，研究人员可以提出具体研发需求，由平台辅助完成相关资料检索、计算方案设计和模型调用，并对计算结果进行整理和分析。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_28f1c80c84aa4e43bf453f805dcf46b3@430412560_oswg12092946oswg2534oswg1588_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对于工业客户而言，这类平台的使用价值主要体现在减少重复操作、降低计算工具的使用成本，以及帮助研发人员完成材料设计和性能分析。</p>\n  <h3><strong>从科研成果到工业客户</strong></h3>\n  <p>材料计算平台能否形成商业收入，取决于其能否进入客户的实际研发流程。据公司介绍，在某工业级合金材料性能预测项目中，团队通过整合计算仿真数据、建立机器学习模型，辅助客户开展材料配方选择及性能分析。</p>\n  <p>对于相关企业而言，提前预测材料性能，可以为材料配方筛选和后续实验设计提供参考。与软件授权相比，定制化项目能够直接对应客户的研发问题，但通常也需要企业投入技术人员完成模型开发、结果分析及项目交付。</p>\n  <p>睿质科技目前正尝试将两类业务结合起来。一方面，通过Archeos平台向客户提供材料计算及数据分析工具；另一方面，针对企业的具体研发需求，提供定制化计算和技术服务。</p>\n  <p>在现有软件平台及研发服务之外，睿质科技还计划进一步参与新材料开发。根据公司规划，未来希望将计算模拟与实验验证结合起来，与产业客户联合开展材料研发，并探索技术授权、联合开发及收益分成等商业化方式。</p>", "category": "tech", "published_at": "2026-10-20T01:12:47+00:00", "fetched_at": "2026-10-20T03:09:53.639586+00:00", "fingerprint": "e9e446073047f20f"}, {"source": "少数派", "title": "开源掌机的文化线索", "url": "https://sspai.com/post/115125", "summary": "在开源掌机这个特定的产品类型背后，都有哪些故事值得讲？<a href=\"https://sspai.com/post/115125\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-19T02:49:51+00:00", "fetched_at": "2026-10-20T03:08:56.225150+00:00", "fingerprint": "1384e5f082d4c618"}, {"source": "少数派", "title": "9 月音乐精选：用这 8 张新专辑，激发人生新可能", "url": "https://sspai.com/post/116699", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/116699\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-19T08:00:19+00:00", "fetched_at": "2026-10-20T03:08:56.225143+00:00", "fingerprint": "adb19aa69c037664"}, {"source": "少数派", "title": "与 Tim Cook 走进「蓝盒子」，了解 Mac 如何助力中国企业成长", "url": "https://sspai.com/post/116585", "summary": "离开了北京之后，TimCook上周四来到了位于上海市闵行区的「蓝盒子」办公室，开启了此次访华行程的上海之行。蓝盒子是一家成立于2019年的床垫及家居品牌，旗下产品以简洁并具有辨识度的设计，以及「一百天 ...<a href=\"https://sspai.com/post/116585\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-19T08:35:40+00:00", "fetched_at": "2026-10-20T03:08:56.225137+00:00", "fingerprint": "47d4fdffc3eee16e"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/116705", "summary": ">下载少数派客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\ here's something deeply unsettling about Michael Organ and his intimate campaign of terror against everyone who enters his life. Mister Organ is a documentary by David Farrier, an Auckland, New Zealand journalist. [&#8230;]", "category": "tech", "published_at": "2026-10-18T19:30:00+00:00", "fetched_at": "2026-10-19T02:59:16.895076+00:00", "fingerprint": "f8740cf8c54e30f2"}, {"source": "The Verge", "title": "A Savannah police officer gave her Flock login to her ICE agent husband", "url": "https://www.theverge.com/policy/1013573/spd-officer-fired-flock-ice-husband", "summary": "Now, former Savannah police officer Amber Harpe was fired in August following a department investigation that found she had shared her Flock login information with her husband, Tyler Harpe, an ICE agent. SPD does not share its Flock data with ICE and said sharing access to the system violated the department's security protocols. While he [&#8230;]", "category": "tech", "published_at": "2026-10-18T22:20:53+00:00", "fetched_at": "2026-10-19T02:59:16.895066+00:00", "fingerprint": "4615586fa44617cf"}, {"source": "36氪 - 最新文章", "title": "老板们不再把钱交给VC了", "url": "https://36kr.com/p/4031081236042116?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_50ce313c2f4d4da7a72684ebe47c2fe8@5579416_oswg53054oswg1080oswg721_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">家办，正在成为中国一级市场上冉冉升起的一股新势力。</p>\n  <p>作者 陶辉东</p>\n  <p>编辑 王庆武</p>\n  <p>不知道你有没有注意到，“家办”这两个字今年越来越频繁的出现在融资通稿里。</p>\n  <p>2月，千寻智能完成近20亿融资，投资方名单中明确列出了“明荟投资（汇川技术董事长朱兴明家办）”。</p>\n  <p>5月，Zenbot 宣布完成近亿元人民币天使轮，联合领投的是“长盈精密、科达利、肇民科技等精密制造细分领军企业的家族办公室”。</p>\n  <p>7月，无界智航获近亿元天使轮融资，“特步家办”出现在通稿里。</p>\n  <p>9月份，地瓜机器人宣布完成4亿美元C轮融资，提到“老股东九阳家办继续追加投资”。</p>\n  <p>以上只是公开可查的家办投资事件，水面以下的案例应该更多。由于家办一般并不需要募资，在投资端也自带产业背书，所以大多很低调，并不愿意公开PR。</p>\n  <p>更多的家办还在路上。一位投资人告诉我，某家第三代半导体龙头的老板也在组建家办，正在苏州找办公室和招人。猎头那边也表示，家办的招聘相当密集，从投研岗到中后台都在招人。</p>\n  <p>家办，正在成为中国一级市场上冉冉升起的一股新势力。</p>\n  <h2><strong>家办开始亲自“看牌”</strong></h2>\n  <p>这里说的家办，特指家办型VC。</p>\n  <p>家族办公室在国内不算新鲜词，但过去十几年，中国的单一家办干的活主要是<strong>财富管理</strong>：把减持、分红拿到的钱做配置，买理财、公募专户、二级私募，不动产和境外保单各占一块，讲究保值与传承。在一级市场上，它们大多选择做VC基金的LP——是出钱的人，而不是看牌的人。其中比较有名的有阿里蔡崇信的蓝池资本、字节张一鸣的Cool River Venture、海底捞张勇舒萍夫妇的Sunrise Capital、美团王慧文的Lollapalooza Capital，创办人来自互联网和消费，注册地多半在中国香港和新加坡，资金的主要投向不是一级市场。</p>\n  <p>现在冒出来的这一批不一样。它们的钱只出不进，投的是未上市公司的股权，而且从B轮、C轮一路下沉到天使轮、Pre-A轮。为了让这笔钱花得像样，它们还会从专业VC挖人，拉起投前投后的整套班底。</p>\n  <p>这类机构，才可以称作<strong>家办型VC</strong>——企业家以家族办公室的形式做风险投资。</p>\n  <p>它不是传统家办。传统家办的核心是资产配置，是把钱交给专业管理人；而家办型VC的核心是股权投资，是自己下判断。</p>\n  <p>它也不是CVC。CVC的钱是上市公司的，要过董事会、要披露、要为战略协同负责，投什么基本逃不出主业半径。而家办的钱是家族的，可以投跟主业毫不相干的量子计算和可控核聚变，也可以投自己主业的潜在对手，亏了不必向中小股东交代。</p>\n  <p>它跟“前企业家下场做GP”同样不是一回事。后者是二次创业做管理人，核心动作是募资，管的是别人的钱；家办型VC一般不募资，也就没有七年存续���、没有要给谁看的DPI报表。</p>\n  <p>一句话概括：家办型VC是<strong>用自家的钱、自家的产业认知、自己招的人，去做早期股权投资</strong>。这在过去其实相当少见。</p>\n  <h2><strong>为什么要自己下场？</strong></h2>\n  <p>家办型VC这两年的冒头，不能单独看。它恰好发生在人民币基金出资结构剧烈变化之后：一级市场并不是没有钱，而是钱越来越多来自国资，资金本身也越来越带有明确的政策、地域和产业属性。</p>\n  <p>问题不在于国资能不能投出好项目，而在于一笔钱往往要同时完成更多目标。尤其是地方政府基金和国资LP，GP除了看项目本身，还经常要兼顾返投、落地、招商、产业链补齐、合规审计和退出安排。对GP来说，投资越来越像一道多目标优化题；对创业者来说，拿一笔钱，也常常意味着同时接住这笔钱背后的多重诉求。</p>\n  <p>一家GP拿的国资多了，就得同时应付两套逻辑，一套投资逻辑，一套招商逻辑。而老板们只想要投资逻辑，所以自己下场做VC，其实也有一点“被迫”的成分。</p>\n  <p>站在创业公司的角度，家办型VC是不可多得的优质股东。</p>\n  <p>首先是决策快。家办型VC的决策链条短，一笔投资从见面到拍板，中间要过的层级很少。</p>\n  <p>其次，家办型VC也是为数不多的比较优质的市场化的长钱，没有存续期，没有出资人念叨DPI，没有明确的退出周期的限制，而且不像CVC有那么多的条条框框限制，更适合投资那些前沿项目。所谓“长钱”，在这里首先是一种资金结构，而不是一句口号。</p>\n  <p>这类钱的最大的吸引力，还在于它背后通常就是产业龙头和企业家本人，能给的往往是供应链、客户、试产场景、管理经验和海外渠道等方面的直接支持。</p>\n  <p>这也解释了为什么近两年家办型VC的存在感会突然变强。传统市场化GP一边要募资，一边要满足越来越复杂的LP诉求；创业者也要在资本、产业、地方落地和退出安排之间做平衡。家办把资金所有者、产业认知和投资团队重新放到了同一张桌子上，委托链条更短，投资目标也更集中。</p>\n  <p>因此，也可以说家办型VC引领了一级市场的一次“文艺复兴”。这并不是说投资方法回到了过去，而是说一级市场最核心的问题重新变得简单：这个创业者行不行，技术和产品有没有价值，这个产业是不是足够大，以及这家公司值不值得陪很多年。近些年一级市场上的干扰变量越来越多，GP和创业者都有过无所适从，家办型VC重新带来了的回归本源的解法——用专业的方式，做相对纯粹的事情。</p>\n  <p>当然，家办型VC同样也有一些超出财务回报之外的动机。对这些老板而言，做投资也是在给主业寻找新的可能性，但目的性并不像CVC那样直接。</p>\n  <p>数据上看，一级市场的玩家的确是在出清。2026年上半年，国内出手过的机构同比减少8%。备案信息也显示，上半年新增私募管理人仅20家，同时注销却高达364家。这些消失的份额，至少有一部分流向了没有基金化的家办型VC。这未必不是一件好事，甚至可以称之为一次对一级市场的重新校准。</p>\n  <h2><strong>他们投什么？</strong></h2>\n  <p>就像前面说的，要系统性的把家办型VC们找出来很困难，因为它们几乎从不主动曝光。我让AI批量翻了翻几大热门赛道上今年融资的创业公司的股东名册，找到了以下五家今年非常活跃的家办型VC：</p>\n  <p>明荟致远，汇川技术家办；</p>\n  <p>立翎创投，立讯精密家办；</p>\n  <p>长盈鑫投资，长盈精密家办；</p>\n  <p>万沣投资，特步家办；</p>\n  <p>群欣投资，蓝思科技家办；</p>\n  <h3><strong>汇川技术：明荟致远投资（深圳）</strong></h3>\n  <p>汇川技术董事长朱兴明持股1%并任监事，潘莉持股99%并任执行董事、总经理。公司成立于2022年5月，一共14笔对外投资。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_c828ab206b6042a6aaa36353ae1248b4@5579416_oswg48982oswg548oswg309_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">汇川技术：明荟致远投资（深圳）</p>\n  <p>明荟致远的14笔投资里有13笔直投，几乎所有钱都投向了机器人产业链（力觉传感器、运动控制、本体、大脑）与AI计算；单笔认缴多在几万到几十万元之间，典型的“跟着轮次一点点进”。投资的唯一一只基金，是2024年11月用9000万元做了重投芯耀一号的LP，占该基金44.98%的份额。另外，</p>\n  <p>它跟汇川技术的CVC平台也有互动——坤维科技A2轮的领投方是汇川产投。</p>\n  <h3><strong>立讯精密：立翎系</strong></h3>\n  <p>立翎系的投资主体比较杂。先是2021年在江苏成立了立翎创业投资有限公司，并于在2023年提交过私募基金管理人登记申请，后来放弃登记以自有资金开展了少量投资。2024年1月，“家族二代”易磊新设了深圳市立翎私募股权基金管理有限公司，于2025年7月19日完成私募基金管理人登记。这家GP此后成为立翎系主要的投资主体。</p>\n  <p>虽然采取基金化的方式投资，但立翎与普通VC的募资方式区别很大，没有路演，没有母基金，没有国资，也没有政府引导基金，只在一个人数并不多的制造业老板朋友圈里募资，另一家制造业上市公司快克智能实控人戚国强、金春夫妇是重要的基金出资人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_8ca045f2ea7a489cabe02a6d397b7ae2@5579416_oswg59523oswg477oswg516_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">立讯精密：立翎系</p>\n  <p>立翎系基金的七成投资都压在芯片与材料上，与立讯精密的消费电子主业正好构成上下游关系。它也不怎么追最新的风口，喜欢挑已经在产线上磨了很多年的“老公司”下注，看中的标的会反复加注。</p>\n  <h3><strong>长盈精密：深圳市长盈鑫投资</strong></h3>\n  <p>2014年7月成立。17笔对外投资，从没当过任何一家机构的LP，法定代表人是长盈精密董事长‌陈奇星本人。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_e22972034f58456cb890a45f9eb1516a@5579416_oswg49227oswg471oswg346_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">长盈精密：深圳市长盈鑫投资</p>\n  <p>11年17笔，均匀分布在机器人、半导体、新能源材料、机器视觉四条线上，持股普遍在3%到20%之间，2025年10月之后节奏明显加快。</p>\n  <h3><strong>特步：晋江万沣投资</strong></h3>\n  <p>特步创始人丁明忠持股70%，2014年8月成立于福建晋江。多大40条对外投资，是五家里出手最多的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_134e6e7d50d44a3b863e8da019061277@5579416_oswg72003oswg525oswg443_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">特步：晋江万沣投资</p>\n  <p>这是五家里对基金的出资最多的，另有20只基金与GP类出资没有在表里列出来。11笔直投的分布也非常广，从建材、体育赛事、教育、医疗、生物都有，比较接近综合型母基金的打法。这更像一个正从LP转向GP的家族投资平台，而非典型的家办型VC。</p>\n  <h3><strong>蓝思科技：长沙群欣投资</strong></h3>\n  <p>蓝思科技董事长周群飞持股98%，2011年成立，是五家里最早的一家。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261018/v2_5556d6f05167471a93b8fbba56ac646e@5579416_oswg69505oswg513oswg518_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝思科技：长沙群欣投资</p>\n  <p><strong>群欣投资</strong>有19笔对外投资，其中有5笔基金出资，但都发生在2021年12月之前，此后再无新增LP出资，全面转向直投。最重仓的是半导体（驰芯、芯至、芯爱、迦美信芯）与机器人（南科佳安、跨维、具生）。</p>\n  <p>总体上看，家办型VC的投资偏好明显受到企业家自身经验的影响，长盈、蓝思、立翎的投资都能看到明显的制造业路径依赖。但他们并不完全受制于自身企业的主业，机器人、AI、商业航天、脑机接口这些离传统主业并不近的新方向，也开始频繁出现在组合里。对这些企业家来说，家办既是财务投资工具，也是一支伸向下一轮技术周期的触角。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/yPSzbQb3CVazDuad449f1g\" rel=\"noopener noreferrer\" target=\"_blank\">“投中网”</a>，作者：陶辉东，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-10-18T07:55:27+00:00", "fetched_at": "2026-10-19T02:59:16.780642+00:00", "fingerprint": "bfb04e87bc03afa8"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨iPhone Duo溢价暴跌至3000元；多家A股科技龙头公司宣布计划回购；王自如称想与罗永浩和解", "url": "https://36kr.com/p/4032044521558403?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>DeepSeek新模型Token消耗降超五成</p>\n  <p>燃油车在中国市场销售占比首次跌破三分之一</p>\n  <p>特斯拉将发布财报，SpaceX将公布上市后的第二份财报</p>\n  <p>Swisse“抗糖丸”被检出铅超标，官方客服：相关批次未进入中国销售</p>\n  <p>港股结算机制生变：“T+2”将改为“T+1”，2028年下半年完成</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>iPhone Duo溢价暴跌至3000元</strong></p>\n  <p>10月16日晚8时，iPhone Duo开启预购。预购开启后，苹果官网和多家电商平台预售界面均显示等待状态，无法进入选购，随后多平台显示售罄。预售开启几分钟后，iPhone Duo多个版本的市场成交价突破2万元。</p>\n  <p>早在一个月前，二手平台上的iPhone Duo预售订单就已开始报价。9月11日，定价21499元的1TB版本一度溢价至79999元，溢价超过5.8万元。如今，iPhone Duo在第三方渠道的报价已大幅下跌，多位黄牛在二手交易平台上只加价3000元，并承诺首销当天就能拿货。（快科技）</p>\n  <p><strong>多家A股科技龙头公司宣布计划回购，生益科技、海光信息、中科曙光、澜起科技集体出手</strong></p>\n  <p>18日，生益科技、海光信息、中科曙光、澜起科技等多家A股科技龙头公司宣布计划回购股份。</p>\n  <p>生益科技(600183.SH)公告称，公司董事长陈仁喜提议公司使用自有资金或自筹资金通过集中竞价交易方式回购部分A股股份，回购资金总额为2亿元至3亿元；海光信息(688041.SH)公告称，公司董事长历军提议以自有资金通过集中竞价交易方式回购公司股份，回购资金总额不低于5亿元且不超过8亿元。</p>\n  <p>中科曙光(603019.SH)公告称，公司董事会收到董事长、总经理历军提议，拟使用自有资金以集中竞价交易方式回购公司A股股份，回购资金总额不低于3亿元、不超过5亿元；澜起科技(688008.SH)公告称，公司独立董事程玉华提议公司以自有资金通过集中竞价交易方式回购A股股份，回购资金总额不低于3亿元且不超过5亿元；上述公司回购股份均将用于员工持股计划或股权激励。（财联社）</p>\n  <p><strong>王自如喊话罗永浩，称想与其和解</strong></p>\n  <p>10月17日，在微博V影响力大会科技论坛上，王自如就“再给一次机会，是否还会和罗永浩吵架”作出回应。他表示：“我下次可能就是十字路口了吧，借微博喊话，不吵了和解了。如果你想吵架成为大V的话，输赢并不重要，比如我是吧。”（东方财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Meta修改商业服务条款引AI训练数据争议相关表述已删除</strong></p>\n  <p>Meta公司近日更新商业服务条款一事引发行业争议，修改条款中涉及使用企业账户相关网页内容用于人工智能模型训练的内容，受到外界广泛讨论，目前该相关表述已被正式删除。（财联社）</p>\n  <p><strong>DeepSeek新模型Token消耗降超五成</strong></p>\n  <p>DeepSeek正式推出大模型新版本V4.1 Flash-1017。在国产人工智能大模型普遍处于迭代关键期的当下，该版本率先完成升级，整体性能实现显著跃升。 此前已有公开数据显示其技术指标，此次DeepSeek更首次自主发布帕累托前沿曲线，直观呈现模型在效率与成本维度的综合表现。V4.1 Flash-1017在此曲线中达到行业领先水平：单位任务综合成本仅为Fable、Astra等同类模型的百分之一至二十分之一，性价比优势达四五十倍以上。本次发布的1017版本虽维持原有API价格体系，但在Token使用效率方面完成深度重构——通过任务感知型压缩、动态上下文裁剪及自适应解码策略，显著降低各类型请求的实际Token消耗。实测表明，多数场景下Token用量较前版下降逾50%，相应TCO水平亦将同步迎来新一轮实质性下探。（新浪财经）</p>\n  <p><strong>Anthropic聘请法律人士，助力AI智能体完成交易谈判</strong></p>\n  <p>Anthropic正与法律机构磋商，以解决一个全新难题：AI智能体应当如何谈判，为人类使用者争取最优交易结果。两名了解Anthropic思路的人士称，该公司正向律所寻求建议，研究律师如何开展谈判，既能代表客户利益，又兼顾公平结果。一名熟悉Anthropic项目的人士表示，公司正在探索模型交互时的“谈判规范”。随着智能系统持续迭代，AI智能体将代表用户，去对接目标存在冲突的其他智能体。该人士补充，公司还在权衡：谈判过程中智能体需要多大程度寻求人类反馈；面对其他AI对手，应当保持多高警惕，同时避免陷入多疑、阴谋论式的判断。另一位接近该公司的人士透露，Anthropic还探讨过一个方案：让用户出具签名文件，向智能体确认委托事项以及需要遵守的全部规则。（新浪财经）</p>\n  <p><strong>微软取消AI相关合作，英国本土数据中心先锋企业遭遇重大挫折</strong></p>\n  <p>微软已退出一笔位于埃塞克斯的数据中心交易，对英国企业Nscale规模达数十亿美元的上市计划构成打击。作为Nscale最大的两家客户之一，这家美国科技巨头近期通知Nscale，将终止去年公布的合作协议。对Nscale而言，这是一次重大挫折：微软原本是该公司位于埃塞克斯劳顿的首座英国数据中心的锚定租户。尽管AI算力板块遭遇惨烈抛售，微软的决定仍可能打乱Nscale推进最高350亿美元（约合260亿英镑）华尔街上市的步伐。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>燃油车在中国市场销售占比首次跌破三分之一</strong></p>\n  <p>中国汽车流通协会乘用车市场信息联席分会近日发布的数据显示，2026年9月，燃油车在中国市场上的销售占比首次跌破三分之一，新能源车整体渗透率攀升至67%的新高。而五年前，燃油车还占据中国乘用车市场九成以上份额。美国特斯拉公司首席执行官埃隆·马斯克转发了相关数据并评论说，“中国对石油的依赖正在快速下降”。（新华社）</p>\n  <p><strong>苹果客服称泡水iPhone不会二次流入市场</strong></p>\n  <p>新加坡海事及港务管理局10月14日发布公告称，一艘新加坡货轮于当地时间10月13日通过霍尔木兹海峡期间，发生火灾最终沉没。船上21名船员全部安全撤离，未报告人员受伤。另一艘新加坡注册集装箱船“GFS Giselle”也在相关事件中受损，但最终自行驶抵安全锚地。</p>\n  <p>随后，网上开始流传的一段视频显示，大量印着苹果手机logo的手机包装盒漂浮在海面上，小船在海面上穿梭，渔民将漂浮的货物捡入船中。</p>\n  <p>据最新核查报道，有开放源信息调查团队通过反向搜索发现，多段所谓“伊朗民众打捞iPhone”的视频，最初来自Instagram账号“Nativora”。该账号将自己的内容定位为利用人工智能制作的虚构自然与野生动物题材影像。上述视频于10月16日出现在该Instagram账号中，创作者还明确添加了“AI Content”标识，表明内容由人工智能生成。</p>\n  <p>苹果官方客服表示：公司目前没有相关通知。但不会让这批有瑕疵的货物二次流入市场，消费者不必担心。（搜狐视频、红星新闻）</p>\n  <p><strong>盛和资源：拟向中稀发展转让4家稀土冶炼分离子公司51%股权</strong></p>\n  <p>36氪获悉，盛和资源公告，公司拟与中国稀土集团产业发展有限公司开展股权合作，将控股子公司乐山盛和（剥离非稀土冶炼分离业务后）及全南新资源、江阴加华、淄博加华4家公司各51%股权转让给中稀发展。标的公司评估预估值合计32.5亿元至35.5亿元，对应交易价款预计16.575亿元至18.105亿元。交易完成后，4家标的公司将不再纳入合并报表范围，公司对标的公司由成本法转为权益法核算。本次股权合作仅限于稀土冶炼分离业务，不涉及公司其他业务。中国稀土集团拥有资源和产业优势，此次通过股权转让引入中国稀土集团全资子公司对4家稀土冶炼分离企业持股，实现双方在冶炼分离业务的股权合作。</p>\n  <p><strong>马斯克飞行汽车遭“踢馆”：一公司飞行汽车比特斯拉早11年</strong></p>\n  <p>在埃隆·马斯克发布特斯拉Roadster飞行跑车的当天，全球首个‌获得美国联邦航空管理局（FAA）特殊适航认证的飞行汽车研发商，也是硅谷头部电动飞行汽车初创公司Alef Aeronautics，发布了一段视频。</p>\n  <p>视频中该公司的电动飞行汽车飞越了特斯拉的Cyber卡车和其发布的新款Roadster跑车，并将这段视频称为对“飞行汽车竞赛”的欢迎。</p>\n  <p>据报道，马斯克周四在得克萨斯州SpaceX的测试基地展示了令全球惊艳的Roadster飞行跑车。他表示，这辆车使用“超高压气罐”来驱动。据悉，Alef公司的飞行汽车则采用分布式电力推进、翼型车身、旋转座舱，并且起飞动力来自空气而非储存的压缩气体。Alef公司称，其更轻的设计使其能够使用整车弹道降落伞。（红星新闻）</p>\n  <p><strong>iPhone 18 Pro Max激活量破纪录，国内单周激活量近90万</strong></p>\n  <p>据博主数码闲聊站透露，iPhone 18 Pro Max再度刷新纪录，在2026年第41周（10月5日至10月11日）单周单品国内激活接近90万台。此外，iPhone 18 Pro系列双杯累计销量目前已经超过400万台。</p>\n  <p>近期发布的安卓旗舰机型因关键零部件成本上升普遍提价，万元价位段内安卓顶配与iPhone Pro系列的价格差距明显收窄，客观上强化了苹果高端机型的价值感知。相当一部分原本倾向安卓顶配的用户转向新款iPhone，叠加高端消费群体对价格变动敏感度较低，共同支撑了持续激活量。</p>\n  <p>值得注意的是，iPhone 18 Pro系列近期还参与了双11促销活动，全系可销售最高800元的综合补贴优惠，入手价格明显降低，会进一步激发销量。（快科技）</p>\n  <p><strong>特斯拉将发布财报，SpaceX将公布上市后的第二份财报</strong></p>\n  <p>近期Meta、特斯拉、SpaceX、德州仪器和西部数据将陆续披露业绩，覆盖AI资本开支、芯片需求以及热门科技公司的盈利前景。另一边，宝洁、美国运通、GE航空航天等公司的财报，则将帮助投资者检验消费与工业需求的韧性。</p>\n  <p>其中，SpaceX将于周二盘后公布上市后的第二份财报，市场预期其调整后每股收益有望首次转正。随着特斯拉于下周三盘后披露业绩，两家公司潜在整合的市场猜测将受到关注；Meta将在当地时间下周三盘后公布三季度业绩，成为观察大型科技公司AI投资回报的重要窗口。（财联社）</p>\n  <p><strong>美银：超大规模云服务商合计未来12个月自由现金流已经暴跌至负1000亿美元以下，资金历史性流向半导体供应商</strong></p>\n  <p>据美银全球研究报告，超大规模云服务商合计未来12个月自由现金流已经暴跌至负1000亿美元以下，资本开支消耗掉95%的经营现金流，标志着资金历史性流向半导体供应商。与之形成鲜明对比，截至2026年9月，英伟达、美光、博通这三大半导体头部厂商未来12个月自由现金流已经飙升至接近5000亿美元。这种巨大分化，源于一轮激进的基础设施建设浪潮：微软、亚马逊、Alphabet、Meta、甲骨文等云巨头，在相关收入兑现之前就大幅加码支出。（新浪财经）</p>\n  <p><strong>英伟达辟谣RTX 5090停产：只是产能不足，不会断供</strong></p>\n  <p>10月18日消息，据TechPowerUp报道，有关英伟达RTX 5090显卡停产的消息引发行业关注。英伟达个人计算业务高级副总裁杰夫・费舍尔日前在台北相关活动上公开回应相关传闻，明确否认停产说法，表示RTX 5090仍为企业核心产品，后续将继续保持供货。（环球网）</p>\n  <p><strong>银行托管新规后，首个持牌专营中心开业</strong></p>\n  <p>获批筹建8个月后，10月16日，北京金融监管局批复了广发银行资产托管中心的开业。该资产托管中心也由此成为了今年2月1日《商业银行托管业务监督管理办法（试行）》（下称银行托管新规）施行后，首家获批并开业的独立专营托管业务的持牌机构。</p>\n  <p>据记者了解，广发银行此前将资产托管部设为一级部门。行内较早将托管业务定位为重要业务板块，并充分借力股东中国人寿资源，在系统建设、协同托管等方面持续投入。记者查阅该行2025年年报，部分措辞透露了该行托管业务经营业绩：截至2025年末，广发银行资产托管及运营外包业务规模达4.33万亿元。2025年该行公私募基金托管规模突破万亿元，实现托管业务手续费收入5.86亿元。（券商中国）</p>\n  <p><strong>Swisse“抗糖丸”被检出铅超标，官方客服：相关批次未进入中国销售</strong></p>\n  <p>近日，海关总署进出口食品安全局发布通报称，澳大利亚品牌“SWISSE”（中文产品名“斯维诗”）两个批次的“Beauty Skin Regeneration+”（中文俗称“抗糖丸”）产品被检出铅超标，提醒消费者立即停止使用涉事产品。10月18日，斯维诗官方客服回应表示，经核查，该产品回流情况仅涉及澳洲市场的144520、143217两个批次，上述批次未流转至消费者端，也未进入中国销售。（澎湃新闻）</p>\n  <p><strong>港股IPO火爆，募资刷新近15年纪录，香港证监会警示可疑认购</strong></p>\n  <p>2026年前三季度，港股IPO市场交出一份远超预期的成绩单，共有115家企业上市，募资总额3855.66亿港元，这一募资规模已超过2011年以来任何一年的全年水平。在展望四季度时，德勤、毕马威近期先后表示，港股全年IPO融资额有机会逼近5000亿港元。市场火热也让中介机构受益。头部效应十分明显，前三家承销商的承销规模合计占比已达42%。不过，保荐机构的资源紧张问题以及执业质量仍然受到监管关注。</p>\n  <p>10月13日香港证监会表示，当前资源紧张有所缓解，体现在五家最活跃保荐人的在审上市申请占比由年初的77%降至9月的65%；负担过重的主要签署人员数量减少78%。香港证监会特别提醒，当前保荐机构要警惕涉及首次公开招股及上市后活动的不透明安排，这些安排可能会产生可疑的认购指示、人为夸大首次公开招股的股份需求，或助长上市后潜在操纵买卖的交易活动。（券商中国）</p>\n  <p><strong>美联储10月维持利率不变的概率为83.9%</strong></p>\n  <p>据CME“美联储观察”：美联储到10月维持利率不变的概率为83.9%，累计加息25个基点的概率为16.1%。美联储到12月维持利率不变的概率为8.2%，累计加息25个基点的概率77.3%，累计加息50个基点的概率为14.5%。（财联社）</p>\n  <p><strong>国家数据集团或将于近日挂牌成立</strong></p>\n  <p>国家数据集团或将于近日挂牌成立。（中证报）</p>\n  <p><strong>马斯克：正在开发专用议价机器人，每年可为全球节省6万亿美元</strong></p>\n  <p>马斯克发文称：我们正投入大量资源开发面向商业场景的专用议价机器人（Hagglebot），我们认为该产品能够将企业成本效率提升5%乃至更高。如果放到全球GDP的维度测算，每年可节省的成本规模最高可达6万亿美元；凡是使用Grok的企业，都能获得立即可量化的竞争优势。（财联社）</p>\n  <p><strong>ST绝味：撤销其他风险警示，10月20日复牌</strong></p>\n  <p>36氪获悉，ST绝味公告，公司股票将于2026年10月19日停牌1天，自2026年10月20日起复牌交易，公司股票将撤销其他风险警示，A股股票简称由“ST绝味”变更为“绝味食品”，证券代码仍为“603517”。撤销其他风险警示后，公司股票转出风险警示板交易，公司股票交易的日涨跌幅限制为10%。</p>\n  <p><strong>今年前三季度全国铁路发送旅客37.1亿人次，创历史同期新高</strong></p>\n  <p>10月18日，中国铁路发布数据显示，今年前三季度，全国铁路累计发送旅客37.1亿人次、同比增长4.8%，创历史同期新高。前三季度，全国铁路日均安排开行旅客列车11511列，同比增长5.3%。前三季度全国铁路累计开行旅游列车2860列，同比增长25.5%，其中旅游专列1613列、旅游专线列车1247列。广深港高铁、中老铁路分别发送跨境旅客2584.5万、26.5万人次，同比分别增长11.8%、37.8%。全国铁路发送外籍旅客1900.2万人次、同比增长33.4%。（财联社）</p>\n  <p><strong>养老专属理财密集上新</strong></p>\n  <p>多家银行及理财公司密集推出了面向养老群体的专属理财产品。以稳健资产打底，主要是投向存款、存单以及高等级的信用债，期限是从一年到两年期不等。业内人士提示，养老群体在选择理财产品时，应注意投资策略与生命周期适配。相对中年的群体，建议通过多资产多策略的投资选择，在更长的周期内实现资产的保值和增值。距离退休10年左右的群体，建议在资产配置上逐步向偏稳健和低波动率的资产配置进行倾斜，对于临近退休的群体，建议更关注金融产品收益的确定性和能够提供相对稳定的现金流。（央视财经）</p>\n  <p><strong>科技记者古尔曼：苹果在供应有限的情况下过早推出了iPhone Duo</strong></p>\n  <p>科技记者古尔曼称，苹果未透露其门店是否会在发售首日供货iPhone Duo。苹果显然是在供应有限的情况下过早推出了iPhone Duo，只是为了让它更早上市，他认为苹果公司知道最早也要到11月才会有合理的供应量。（财联社）</p>\n  <p><strong>港股结算机制生变：“T+2”将改为“T+1”，2028年下半年完成</strong></p>\n  <p>10月16日，港交所发布有关缩短港股现货市场结算周期的咨询总结文件。市场广泛支持港股市场实施“T+1”结算周期。综合各市场参与者意见后，港交所拟在市场准备就绪并获监管机构批准的前提下，于2028年下半年完成相关过渡。业内人士表示，“T+1”结算周期的推出是港股结算与交易市场的重大改革，能够让投资者在更短结算周期中再投资、调仓，提升资金周转率，港股的交投活跃度有望提升。（上证报）</p>\n  <h2>上市进行时</h2>\n  <p><strong>智界将获独立造车资质，内部人士确认公司计划上市</strong></p>\n  <p>工信部10月16日公示《道路机动车辆生产企业及产品公告》（第412批），公告显示，安徽智界新能源汽车有限公司（下称“智界”或“智界汽车”）列入“拟发布新准入车辆生产企业”清单，公示期至10月23日。随后，“智界拿到独立造车资质”的消息随即扩散。10月17日，智界汽车内部人士确认，智界汽车在公示结束获批后将取得独立造车资质，“是奇瑞的工厂给到了智界”，该人士还同步确认了智界汽车未来计划独立上市的信息。（第一财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>恒力石化：预计前三季度净利润同比增长104.20%</strong></p>\n  <p>36氪获悉，恒力石化公告，预计2026年前三季度归属于上市公司股东的净利润为102.56亿元，同比增长104.20%。业绩变动主要系行业供需格局改善、景气度回升，炼化、芳烃、PTA及聚酯新材料产业链运行持续向好，公司发挥“油、煤、化”深度融合的“大化工”平台优势，核心装置运行平稳，产业链协同效应释放，炼化、PTA板块加工价差显著修复，有效增厚经营业绩。</p>\n  <p><strong>信达证券：前三季度净利润同比下降4.83%</strong></p>\n  <p>36氪获悉，信达证券公告，前三季度实现营业收入33.05亿元，同比增长9.48%；归属于上市公司股东的净利润12.88亿元，同比下降4.83%。第三季度营业收入8.70亿元，同比下降11.37%；归属于上市公司股东的净利润1.91亿元，同比下降42.03%。净利润变动主要系当期所得税费用增加导致净利润减少。</p>\n  <h2>投融资</h2>\n  <p><strong>具身大脑公司“格物通智”已完成近亿元天使轮融资</strong></p>\n  <p>36氪获悉，具身大脑公司“格物通智”已完成近亿元天使轮融资，投资方包括匹克投资、鸿富资产、杭州资本、杭州人才集团、某省级具身产投及多家头部上市公司。资金将主要用于物理反演世界模型的大规模预训练与技术迭代、硬件与本体构建等，加快人才引进和规模扩充，并推进多个场景PoC验证和真实数据采集。Maple Pledge 枫承资本出任本轮独家私募股权融资顾问。</p>\n  <p><strong>“六方半导体”完成超亿元C1轮股权融资</strong></p>\n  <p>36氪获悉，“六方半导体”近日完成超亿元C1轮股权融资，本轮由北京仓廪资本与诸暨产业投资集团有限公司联合出资。公司本轮融资资金将重点用于前沿新品研发及产能扩建，占地100亩的新厂房预计2026年12月正式投产。</p>\n  <p><strong>整理丨</strong>何雨婷&nbsp;</p>", "category": "tech", "published_at": "2026-10-19T00:10:05+00:00", "fetched_at": "2026-10-19T02:59:16.780635+00:00", "fingerprint": "b121c8cb57138511"}, {"source": "36氪 - 最新文章", "title": "聚焦在轨服务，要打造太空机器人集群，「国宇星辰」完成近亿元A轮融资｜36氪首发", "url": "https://36kr.com/p/4032195238482313?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>商业航天的叙事，正在从“把卫星送上天”过渡至“卫星上天后”怎么管、怎么运营。</p>\n  <p>除了组网建设加速，一个直观的信号是，低轨星座的补网压力也正在逼近。根据NASA戈达德航天中心此前发布的研究数据，2020至2024年间，有583颗星链卫星从极低地球轨道坠落。而为了防止失控与碰撞，卫星的主动变轨和避让动作也变得愈发频繁。根据SpaceX 7月向美国联邦通信委员会（FCC）提交的报告，仅半年内，星链卫星执行的避让动作次数就超20万次。</p>\n  <p>当几万颗卫星陆续铺满近地轨道，问题被摆到台前：<strong>谁来负责太空中的“管、修、加、清”？</strong></p>\n  <p>答案在国外已经有人跑通。日本的Astroscale 以碎片清理起家，2024年登陆东京证券交易所，营收四年增长约五倍；意大利的D-Orbit用20余次轨道运输任务验证了客户付费意愿；美国Space Logistics的MEV-1在2020年完成首次商业在轨延寿，为一颗工作了19年的GEO卫星续命五年。根据Fortune Business Insights的报告，全球在轨服务市场正处于稳定增长通道，预计从2026年的31.8亿美元增长至2034年的68.7亿美元，复合年增长率（CAGR）为10.10%。</p>\n  <p>需求已至，国内卡位者批量涌现。一家低调布局了四年的公司，正在加速其产品的在轨验证。</p>\n  <p>36氪获悉，<strong>国宇星辰（上海）航天科技有限公司（以下简称国宇星辰）已于近期完成近亿元A轮融资，由沂景资本、复星创富、路遥资本联合投资。</strong>在此之前，国宇星辰已完成三轮融资，资方包括元禾原点、厚雪资本、尚颀资本等机构。</p>\n  <p>国宇星辰成立于2022年，创始人张龙拥有超20年航天科研、工程管理与企业管理经验，曾供职于航天科技集团，深度参与国家载人航天、探月及火星探测等重大专项，历任型号主任设计师、集团处长，2015至2021年期间担任蓝箭航天总裁。公司核心技术团队来自中科院微小卫星创新研究院、航天科技集团、清华大学等，具备飞行器研制、发射任务运营和型号工程任务管理能力。</p>\n  <p>聚焦在轨服务领域，<strong>国宇星辰核心业务覆盖在轨服务（辅助入轨/离轨，在轨加注、在轨维修）、在轨组装、太空制造和深空开发。</strong></p>\n  <p>由国宇星辰自主研发的太空机器人，则是执行上述具体任务的核心载体。</p>\n  <p>在国宇星辰的定义里，它是一套软硬件一体的空间作业系统，包含躯体、感知、大脑、执行四个部分。</p>\n  <p>其中，<strong>躯体</strong>（智能平台和组合动力）实现轨道机动和姿态调整；<strong>感知</strong>（多源融合AI感知模组）用于对合作目标/非合作目标的精准识别、定位和引导；<strong>大脑</strong>（星载AI决策单元）能够在通信时延下进行本地任务规划和自主决策；<strong>执行</strong>（太空灵巧机械臂和加注接口）则需要完成抓取、对接、维修、加注等复杂物理交互。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_acbef6cef8154ae6af68a65d673d4f1c@577536001_oswg187572oswg1080oswg324_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国宇星辰产品规划</p>\n  <p>去年5月21日，国宇星辰自研验证星“星迹源一号”在酒泉卫星发射中心成功发射，是国内首个由商业航天公司研制并完成飞行任务的在轨服务及天地感知新技术验证平台，累计在轨时长超一年。</p>\n  <p>一个进展是，国宇星辰已进入国家级卫星互联网星座运营商的供应商名录。<strong>星迹源二号计划于2027年一季度发射，将增加其自研的七自由度机械臂进行在轨验证，</strong>这也是国宇星辰核心技术版图中的最后一块拼图。</p>\n  <h2><strong>四年蛰伏，一次反共识的创业</strong></h2>\n  <p>把时间拉回到2022年，中国商业航天赛道已经走过第一轮从过热到退烧的周期，市场趋于冷静，疫情则进一步加剧了创业公司要面对的外部复杂性。当时，行业的主流叙事集中在火箭和卫星，除了“国家队”，在轨服务鲜有商业公司涉足。</p>\n  <p>一个造火箭出身的老航天人，按照经验和能力惯性，出来创业最容易“找钱”的路可能是继续做运载——先解决进入太空的问题。但张龙的选择恰恰相反，他一头扎进了在轨服务这个在当时看起来有点冷、甚至反共识的赛道。</p>\n  <p><strong>方向的判断主要来自三个层面。</strong>从太空安全和国家战略方向来看，我国大力发展卫星互联网是必然选择，在轨服务从长期来看具备产业基础和用户方向；其次，中国商业航天从2015年起步到2022年前后已经走过一轮发展周期，火箭公司技术迭代和发射验证提速，这意味着进入太空的能力和成本降低进入可预期的阶段；未来随着产业成熟度的提升，下游运营服务拥有更高的附加值和市场空间。</p>\n  <p><strong>“2015年商业公司开始造火箭的时候，也有很多人不看好，但后来的事实证明：反共识恰恰是早期赛道的机会。”</strong>在张龙看来，在轨服务产品有研制周期、验证周期，还有被客户认知的周期，等需求真正爆发再介入就晚了。</p>\n  <p>还有另外一个更感性版本的答案是，“那个时间点，确实是看到了一束光，我们想追光。”</p>\n  <p>和张龙一样看好这个方向的还有吴树范和容建刚。作为国宇星辰联合创始人兼首席科学家，吴树范是国际宇航科学院院士、国家引进的海外高层次微小卫星专家，拥有30余年航空航天领域的学术研究、技术开发和产业创新经验，把控公司整体技术方向；CTO容建刚曾供职于中国科学院微小卫星创新研究院，参与过天宫二号伴随卫星、空间达芬奇计划等重大专项的控制系统工作，受聘中国科学院首批核心技术骨干、控制工程委专家组委员，擅长工程化落地和型号抓总。</p>\n  <p>方向有了，创始团队搭起来了，具体路线怎么选，张龙的思路是：先想清楚未来服务什么场景，再倒推需要怎样的产品，最后补充其中的关键技术版图。</p>\n  <p>团队把核心在轨服务场景分析了一遍，比如辅助入轨/离轨、在轨加注、在轨维修、在轨组装与太空制造等等。<strong>拆到底，最核心的能力需求其实是四个，简单来说就是得有一双“手”去操作、有“眼睛”能看见、有“腿”跑得动、有“大脑”控制得住。</strong></p>\n  <p>“我们分析完场景和需求，再看供应链，发现不能买，平台、机械臂、核心系统都要自己做。只有自研才能提高技术迭代效率、掌握产品话语权、实现成本的持续降低。”张龙提到，国宇星辰选择自研星载智能控制模组、组合动力系统、视觉导航系统和太空机械臂——这也对应了其当下的四项关键产品。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261019/v2_be0bdd168c11435f86fce41bc4560aff@577536001_oswg515331oswg1080oswg427_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">国宇星辰产品概念图</p>\n  <p>围绕四大产品，向下拆解，是天基目标识别及自主导航及精准测量、太空机器人灵巧操控、模块化在轨更换及补加延寿、姿轨协同交会对接控制、编队飞行、多智能体协同控制与智能操控技术等更细的技术纵深方向，为国宇星辰早期人才团队的组建明确了重点；向外延伸，则对应了以在轨服务、在轨组装、太空制造和深空开发等为核心的服务应用场景。</p>\n  <p>截至目前，<strong>国宇星辰自研的星载智能控制模组、组合动力系统、视觉导航系统均已完成在轨验证。</strong></p>\n  <p>“唯一还没上过天的，就是这条七自由度机械臂，地面力学实验、EMC实验、功能性实验已经全部完成，计划将于11月中上旬完成总装。”张龙提到，按照当前国内火箭发射成本下降趋势，通过核心系统自研、采用工业级部组件和元器件，以及团队独创的筛选验证方法，国宇星辰产品商业化后的成本，相比当前国内外主流体系，未来有望降低一半以上。</p>\n  <h2><strong>不只是一次技术试验，首飞就应该赚到钱</strong></h2>\n  <p>去年5月21日，星迹源一号在酒泉卫星发射中心发射升空，顺利进入预定轨道。这是国宇星辰成立三年迎来的第一个重要里程碑，当时，公司团队规模只有23人。</p>\n  <p>这颗百公斤级的平台搭载了来自中国航天科技集团、中国电科集团、中国科学院、西北工业大学等多家用户的11台新研载荷，包括快速成型材料制造、自供电微系统、国产智能芯片模组、高精度导航接收机、星屏摄录组合、中波红外遥感载荷等。</p>\n  <p>“为什么要装这么多载荷？一方面我们要考核星上处理单元响应多载荷的能力，另一方面也是为日后在大型星座上的应用做储备。”</p>\n  <p>张龙提到，“星迹源一号在轨一年多，除了机械臂之外，组合动力系统、星载智能控制系统、视觉导航都装上了。第一，这几套系统协同工作，自主规划变轨、非合作目标识别等能力均得到验证。第二，通过搭载多用户载荷，也反向验证了平台响应多载荷、多任务自主管理控制的能力和多订单履约服务能力。”</p>\n  <p>发射前，<strong>张龙给星迹源一号定了三条要求：首飞必有用，首飞必成功，首飞必赚钱。</strong>“我们不能只是为了做一次技术实验，要带着真实的客户任务上天，只用投资人的钱去打一颗星，说服不了自己，也验证不了签单和履约的能力。”</p>\n  <p>事实上，能不能上天完成任务、有没有成功经验，是商业航天创业公司的第一道生死线。只有真实在轨，才能验证产品在太空辐照环境中的真实能力，才能把问题暴露出来，通过空间环境数据和任务经验的积累，迭代产品和系统可靠性，最终把一次飞行变成可复制、可交付、可规模化的能力。</p>\n  <p>据悉，国宇星辰组合动力系统已完成在轨飞行考核，通过多次冷热启动运行、极端工况试验等数据优化第二代产品，目前已完成热真空长时间试车及各环境考核试验。</p>\n  <p>星载控制模组方面，团队优化了算法，通过分析和解决一号星在轨遇到的短暂信号丢失等问题，对抗辐照能力进行了加强，并提升了系统级容错设计。</p>\n  <p>针对视觉导航系统遇到的强光干扰等问题，已通过地面强光模拟实验，提升了第二代产品的强光抑制能力和抗饱和成像能力。</p>\n  <p>“一号星的作用就是把问题暴露出来，问题越解决越少。”张龙表示，国宇星辰未来一年的时间表很清晰：<strong>上半年星迹源二号发射，完成机械臂和加注接口的首次在轨验证；星迹源三、四号已经开始研制，如果进展顺利，有望在2027年下半年发射。</strong></p>\n  <p>“星迹源一号成功入轨，证明的是太空机器人能干什么。但要真正跑通商业模型，还得建起一张在轨服务星座的网。国宇星辰正从单星能力，迈向太空机器人集群时代——只有走到这一步，在轨服务才不再是试验项目，而是可规模化的商业闭环。”张龙强调。</p>\n  <p>随着星迹源系列卫星实现组网，国宇星辰就能在特定轨道形成服务响应能力——哪里需要服务、哪颗飞行器近，就调度哪颗过去执行任务，形成常态化的运营和服务合作。而在此之前，国宇星辰会先通过验证星搭载商业载荷、关键组件销售等业务赚收入，反哺公司经营。</p>\n  <p>一组进展是，载荷搭载业务方面，国宇星辰已签订数千万元订单；关键组件销售方面，组合动力系统已交付多台套，并建立海外销售渠道；在轨服务方面，目前国宇星辰已进入国家级卫星互联网星座运营商的供应商名录。</p>\n  <p>据张龙透露，到今年底，国宇星辰还有望拿下一个大体量订单和一项国家级任务。“如果这两件事也成了，我觉得今年可以给团队打100分。”</p>\n  <p>回到2022年那个决定创业的时间点，张龙说他们“看到了一束光”，但团队之后埋头做事的4年，才代表了这句话真实的后半句——在追光的路途上，先要穿过的是阴影。</p>\n  <p>好在这条路走得通。2026年，商业航天再次成为一级市场炙手可热的方向，在轨服务成为新的叙事之一。</p>\n  <p>国宇星辰提前站上了起跑线，但它依旧身处竞赛之中。如今这条路上也站满了玩家，接下来的问题是：谁能让叙事更稳、更快地落地，变成一门真正的生意。</p>", "category": "tech", "published_at": "2026-10-19T02:43:02+00:00", "fetched_at": "2026-10-19T02:59:16.780619+00:00", "fingerprint": "3b4722ff19e1b6d6"}, {"source": "少数派", "title": "Quote/0 妙用 +1，把墨水屏变成点餐助手", "url": "https://sspai.com/post/115241", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/115241\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-18T07:01:02+00:00", "fetched_at": "2026-10-19T02:59:15.555019+00:00", "fingerprint": "27ce52901798a8a3"}, {"source": "少数派", "title": "派早报：三季度全球手机出货量继续两位数下降", "url": "https://sspai.com/post/116641", "summary": "<p>三季度全球手机出货量继续两位数下降</p><p>Roadster 发布会留下诸多疑问</p><p>闰时将取代闰秒</p><p>微软声称 Windows 11 响应提速 20%，为 8GB 优化</p><p>E Ink 发布 Kaleido 4</p><p>全国铁路列车车次编排更新</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/116641\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-18T23:13:24+00:00", "fetched_at": "2026-10-19T02:59:15.555008+00:00", "fingerprint": "f93e2daa812bff57"}, {"source": "BBC World News", "title": "Anti-government protesters battle with police in Albania", "url": "https://www.bbc.co.uk/news/articles/crwydey50xeno?at_medium=RSS&at_campaign=rss", "summary": "There were violent clashes betw
