 <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d5addccf98b444fb8d1a816a627e75f5@6387155_oswg2194978oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_08f597660bcb428a8b871b1d32c8a020@6387155_oswg2497930oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_eeec0d839200498eaf87ff74e8e09ddc@6387155_oswg2327540oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_f3f0a26d4f8c4dc6bc0d61e00f5b790a@6387155_oswg2752336oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_0e2ef2cf56a248c4ba54620a3bfe4722@6387155_oswg2237865oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_f400396642eb4c66a56b3a8419ab3e78@6387155_oswg2032136oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_c2c0e8db07ae4660ab27b2060b28667c@6387155_oswg2306860oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_ab71dc2146524aac85edee8f927246a2@6387155_oswg1996354oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_0c4ccb71b3d64498b42b663011a8b19a@6387155_oswg2205853oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_266aa66bdd77481f80b9e371c38f430a@6387155_oswg2322235oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_a468e887328d487baa36dac3fa4fde6d@6387155_oswg1938728oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d66d31b3c1ef4a57baa44b43cf5b094a@6387155_oswg358575oswg4762oswg6735_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_8b0fb85a0c2e4464a09034bf71e33a40@6387155_oswg2360248oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_f9de8d5b23f1465ba39eb07b1f48c3d9@6387155_oswg2328779oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_f488c7c09620447a8efd97e22eecc73c@6387155_oswg1946740oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_36e6e0b5d6e54173921e2dcd4cdc08a7@6387155_oswg2090917oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_54c9ea7742f1464a9dfbe0215eeb1bcc@6387155_oswg2669708oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_7817d34bfc3d48d4a8c1f9032ac8fe3c@6387155_oswg2724327oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d70efd272acf4c3f8812b4c70124443d@6387155_oswg2180526oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_a04aa3b4f9ac4cd5a3f408cb5cc2091f@6387155_oswg2567371oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_f70f136b9a764f79a44e9947383e833e@6387155_oswg1879288oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_d39e3c260826428a9036b6f177561951@6387155_oswg1926334oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_18f43aed973e4de482a2a6d2a2e29f02@6387155_oswg1949525oswg4762oswg6735_img_png?x-oss-process=imag 60610/v2_a433808b4944458d849503460b02aa4f@6387155_oswg360390oswg4762oswg6735_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_36a3b6e49fa04e31a493afe3b019b122@6387155_oswg3103188oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_bde3e29217df4f90bd4f8640e72cb8b1@6387155_oswg3611698oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_2b811c0eb7b24da59d661554d861ee8d@6387155_oswg3803599oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_86010dc44e99441fba468ba403812ee8@6387155_oswg3029499oswg4762oswg6735_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_31734a9e52c745009dae2f42124db1a8@6387155_oswg1648357oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_3a37bbe58ea743d4ab1fff8f3d852797@6387155_oswg1819120oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_e08f4d0f68084f43988d7bf82a1537ab@6387155_oswg1946874oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_61b57cfb3ea64bb798b47ca016a6c928@6387155_oswg1340737oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260610/v2_2529812638a6488a88e8163dd4d71506@6387155_oswg1808856oswg4762oswg6735_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>", "category": "tech", "published_at": "2026-06-13T06:00:00+00:00", "fetched_at": "2026-06-14T03:34:54.026217+00:00", "fingerprint": "9d76a1bc4b7aeb24"}, {"source": "36氪 - 最新文章", "title": "曼联，要被卖了", "url": "https://36kr.com/p/3851350342325504?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_e0c77006185f4bd984e08da061c95864@5579416_oswg342733oswg600oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片来源：视觉中国</p>\n  <p>作者/余梦莹</p>\n  <p>报道/投���界PEdaily</p>\n  <p>史上最盛大世界杯正在上演。</p>\n  <p>48支球队、39天、104场比赛，总奖金飙升至8.71亿美元。梅西、C罗、莫德里奇“最后一舞”，哈兰德、姆巴佩、亚马尔崛起，诸神之战拉开帷幕。</p>\n  <p>赛场之外，一家老牌足球豪门却站在了十字路口——彭博社消息，<strong>掌控英超球队曼联超20年的格雷泽家族内部，近期正在讨论出售事宜。</strong></p>\n  <p>绰号“红魔”，这是英格兰足球史上最富盛名的豪门。最初只是铁路工人组建的业余球队，2005年被美国格雷泽家族全面控股。历经辉煌也走过低谷，“红色旗帜永不落幕”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_22d0787e17cb4a178c17f5c69a90dcd1@5579416_oswg242103oswg600oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">红魔</p>\n  <p>这一幕颇为感慨。足球这门生意实在赚钱，越来越多俱乐部被摆上了货架，浸泡在资本的洪流中。</p>\n  <h2><strong>美国大亨，要卖掉曼联了</strong></h2>\n  <p>这也许是“红魔”球迷们日思夜想的一幕。</p>\n  <p>格雷泽，美国商业大亨，最擅长的就是“以小博大”。自2003年起，他开始陆续收购曼联股份，两年后完全控股曼联，成为“红魔”的新东家。</p>\n  <p>彼时，格雷泽家族采取杠杆收购的方式，仅拿出2.7亿英镑便买下了价值7.9亿英镑的曼联，其余都是借款。从此，这家风光无限的足球俱乐部开始了与债务为伴的日子。</p>\n  <p>从一开始，格雷泽家族就不受“红魔”球迷待见。那时西亚资本还没有开始觊觎英超，何况这个外国东家不爱足球只爱赚钱，对于英格兰足球古老的传统可谓是莫大的打击。</p>\n  <p>曾有球星凌晨结束比赛回到俱乐部，第二天就要跑赞助。种种经营下，2005年营业额还不到1.59亿英镑的曼联，2019年收入一跃而至创纪录的6.27亿英镑，商业收入更是达到了2.75亿英镑。</p>\n  <p>更夸张的是，格雷泽先是利用曼联发债5亿英镑再融资，又于2012年推动曼联在纽交所上市，募资2.33亿美元——一半用于还债，一半落入格雷泽家族口袋。</p>\n  <p>入主二十年来��格雷泽家族已在曼联身上赚得盆满钵满，但在管理层面却是每况愈下。终于到了2022年11月，格雷泽家族决定脱手。</p>\n  <p>一番角逐后，两个潜在买家浮出水面——一家是卡塔尔财团，另一家则是英国化工巨头英力士集团，董事长是知名富豪拉特克利夫。最终英力士以约13亿英镑收购曼联25%股份，并全面接管足球运营。</p>\n  <p>时年74岁的拉特克利夫是曼彻斯特人，从小就是曼联的铁杆拥趸。“红魔”终于回到了英国人手中。此后历经几次增资，英力士共持有曼联近29%的股份，格雷泽家族则拥有67.91%的投票权。</p>\n  <p>但前路仍然不算好走。俱乐部此前公布计划，拟在老特拉福德球场附近建设一座可容纳10万人的新球场，项目成本预计约20亿英镑，而这意味着更高的长期资金压力。</p>\n  <p>“目前已有成员试图说服其他家族成员一同加入出售行列。”彭博社报道称。早前就有传闻透露，格雷泽家族静待海外资本报价，只要高于50亿英镑，他们愿意出让合计48.9%的曼联股份。</p>\n  <h2><strong>百年豪门“红魔”，辉煌与失落</strong></h2>\n  <p>曼联的故事几乎可以算作工业时代的缩影。</p>\n  <p>时间回到1878年，兰开夏郡和约克郡铁路公司的一群工人决定组建一支足球队。最初只是为了锻炼和消遣，球场弥漫着蒸汽机车排出的煤烟，球员甚至没有间像样的更衣室。</p>\n  <p>很快，球队转为职业队，加入英格兰足球联赛。但由于实在太穷，一度濒临解散。危急关头，当地富商约翰·亨利·戴维斯注资接管了俱乐部，并于1902年正式更名为曼联。</p>\n  <p>一次转会彻底改变了曼联的命运。那是1906年，主教练曼格纳尔低价挖走了曼城的核心、绰号“威尔士巫师”的比利·梅瑞迪斯。在他的带领下，曼联以创纪录的82个进球夺得队史首个顶级联赛冠军，随后又拿下了首座足总杯冠军。</p>\n  <p>曼联也经历过浴火重生的时刻。</p>\n  <p>上世纪中叶，一位名叫马特·巴斯比的年轻教练接手曼联。他们从全国各地网罗天才少年，集齐一群平均年龄仅22岁的年轻人，这就是大名鼎鼎的“巴斯比的孩子们”（Busby Babes）。</p>\n  <p>这群年轻人有多猛？1956和1957年连夺两届联赛冠军，成为英格兰足球历史上第一支参加欧洲冠军杯的球队。然而命运弄人，慕尼黑一场空难夺走了多位球员的生命，随之而来的是漫长而痛苦的重建工作。</p>\n  <p>所有人都以为曼联会就此倒下，但巴斯比带着球队从废墟中站了起来——1968年，新一代“红魔”在欧冠决赛中战胜葡萄���本菲卡队。赛后巴斯比颤抖着将冠军杯高高举起了8次，构成曼联历史上极富冲击性的一幕。</p>\n  <p>“红魔”队名也是来自这一时期——50年代，萨尔福德队身穿红色球衣在法国巡回比赛，凭借辉煌的不败战绩被球迷形象称呼为“红魔”。恰逢曼联球队重建，时任主帅巴斯比注意到了这个名字，遂借用过来送给曼联。</p>\n  <p>那之后，“红魔”的绰号在球迷间流传开来。1973年，俱乐部正式将手持三叉戟的红魔鬼形象加入了队徽，至此成为俱乐部闻名的标志。</p>\n  <p>伴随巴斯比爵士功成身退，曼联一度陷入多年的沉寂，直到1986年亚历克斯·弗格森接过教鞭。大家仍记得1999年的巴塞罗那，曼联成就了史无前例的“三冠王”，成为弗格森执教生涯的最高峰。</p>\n  <p>“逆转的感觉很好，永不放弃是我们的传统。”细数下来，这位倔强老人共为曼联拿下了37个冠军，带领球队打了1000场联赛。放眼当今足坛，这样的数字称得上一个传奇。</p>\n  <p>惋惜的是，弗格森退休后曼联仿佛失去了灵魂，球队竞争力大不如前，甚至在2024-25赛季创下了英超时代最差的第15名。时至今日，曼联依然在试图找回昔日荣光。</p>\n  <p>但它的故事远未结束。正如那首著名的队歌所唱：“Glory, Glory, Man United……”（光荣，光荣，属于曼联……），红魔精神，仍在继续。</p>\n  <h2><strong>体育资产重估时代</strong></h2>\n  <p>时至今日，越来越多体育项目裹挟上了资本的外衣。</p>\n  <p>今年3月，NBA官方宣布，联盟董事会批准将开拓者队出售给由汤姆·邓顿领导的投资者集团，估值高达42.5亿美元。收购方阵容豪华——除核心掌舵人、美国知名商人邓顿外，还包括投资公司CollectiveGlobal首席执行官希尔·泰尔、BlueOwl联合总裁马克·扎、熊猫快餐所有者程氏家族等等。</p>\n  <p>至此，这家由微软联合创始人保罗·艾伦及其家族掌控了38年的球队迎来了新主人。</p>\n  <p>回望过去一年，球队出售控股权的估值记录被两度打破——</p>\n  <p>先是凯尔特人队，以61亿美元的估值卖给了私募股权大亨比尔·奇泽姆（Bill Chisholm）领衔的投资集团。交易堪称一笔完美的高位套现——此前球队刚刚夺得创纪录的第18冠。</p>\n  <p>仅仅两个月后，洛杉矶湖人队就被曝出售给TWG Global CEO兼洛杉矶道奇队老板马克·沃尔特（Mark Walter），交易估值100亿美元（约720亿人民币），一举缔造职业体育球队最高估值。</p>\n  <p>这是NBA史上最负盛名的球队之一。47年前，杰里·巴斯花费6750万美元买下了它，期间收获荣誉无数。此后长女珍妮·巴斯接管湖人队，直到今天，这笔交易增值近150倍。</p>\n  <p>一个时代背景是：投资体育已变成一件极为性感的事。</p>\n  <p>数据显示，过去20年里，北美四大职业男子体育联盟（NBA、NFL、MLB和NHL）的特许经营权表现优于大多数其他资产类别，实现了13.2%的年化回报率，过去一年更是达到了16.9%，仅次于媒体和娱乐业。</p>\n  <p>以NBA为例，最近几年NBA球队出让的估值一路上涨，每一次涨幅几乎都在十亿级别以上。行情如日中天，很多NBA老板纷纷开始出卖手中股权。</p>\n  <p>此外还有：阿布扎比联合财团主导的城市足球集团，先后入股了曼城、纽约城、墨尔本城等地的足球俱乐部；沙特公共投资基金买下纽卡斯尔联80%的股权；阿波罗通过专项体育基金协议收购马德里竞技俱乐部55%的股权……明码标价的球队数不胜数。</p>\n  <p>这些俱乐部既是文化机构也是金融资产，它们的稀缺性、全球影响力和品牌价值足以使其成为亿万富翁、家族办公室和机构投资者梦寐以求的配置标的。</p>\n  <p>当然，买卖球队并非一劳永逸。譬如“红魔”球迷们声讨格雷泽家族，资本的短期回报与俱乐部长久生存之间天然存在着矛盾，而这往往会伴随对原始文化根基的冲击。</p>\n  <p>但就像一直有人管湖人主场叫“斯台普斯”，当这些球队被扔进一个全新而精密的资本机器中运转，它也许会就此改变自己的基因。同时，也永远会有新球迷穿上球衣，坐在观众席为其呐喊。</p>\n  <p>如此，构成了竞技体育最富魅力的时刻。</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/A0x2o3FrvT8AuKymfvClog\" rel=\"noopener noreferrer\" target=\"_blank\">“投资界”</a>，作者：余梦莹，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-13T08:37:21+00:00", "fetched_at": "2026-06-14T03:34:54.026209+00:00", "fingerprint": "61a4c9339ea4e22b"}, {"source": "36氪 - 最新文章", "title": "高瓴出手了一家消费级柔性机器人公司，要把“大白”从电影搬进现实家庭｜硬氪首发", "url": "https://36kr.com/p/3851572421432324?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，消费级柔性机器人公司SoulX日前已完成数千万元天使轮融资，投资方为高瓴创投，向阳资本担任独家财务顾问。资金将重点投入产品持续迭代、技术研发，并加快供应链与规模化交付体系搭建。首款机器人产品MoYa将于2026年下半年正式发布。</p>\n  <p>SoulX隶属于深圳市弘火智能科技有限公司，团队长期专注于柔性机器人技术与睡眠、压力与家庭健康关护。公司以睡眠场景为切入点，自主研发了睡眠安抚机器人MoYa。该产品融合机器人技术、神经科学与心理学，采用无摄像头设计，通过模拟拥抱帮助用户缓解身心压力。</p>\n  <p>家庭场景下的情感与健康关护，长期面临一个“人机关系”设计上的根本问题：在需要身心双重安抚的场景里，机器应该以怎样的方式“在场”？</p>\n  <p>过去几年，不同产品从多个维度给出答案。智能床垫、白噪音机擅长改善环境与生理舒适度；可穿戴设备精于睡眠数据的连续监测；毛绒玩具在情绪投射与安全感的建立上有天然优势；新兴的AI对话机器人则在更自然的表达，促进沟通方面快速迭代。</p>\n  <p>触觉安抚传递物理层面的安全感，语言疏导实现心理层面的释放，睡眠障碍与情绪内耗往往需要二者在同一时间、同一场景下协同工作：身体放松为心理释放创造条件，心理释放反过来进一步降低生理紧张。但长期以来，这两条路径被拆分成独立的产品体系，各自回应用户身心安抚的某一个侧面。</p>\n  <p>SoulX创始人兼CEO郑潜捕捉到了这一功能断层。他没有选择更复杂的动作或更聪明的对话，而是从触觉神经科学出发，以柔性机器人为载体，试图将“触觉安抚”与“认知卸载”两大功能，整合进其首款睡眠安抚机器人产品MoYa当中。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_2d8a7fc7d0bd4781914a3b00ea772f16@6022551_oswg2356535oswg1920oswg1440_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa（图源/企业）</p>\n  <p>“大部分睡眠问题不是温度、支撑或时长的问题，而是神经系统一直处于紧绷和警觉的状态。”郑潜告诉硬氪，“当人们的大脑停不下来，前额叶过载，不仅会久久难以入睡，长此以往甚至会形成躯体化反应。”针对这一生理性痛点，研发团队确定了MoYa的核心功能定义：不停留在优化睡眠的物理参数层面，而是帮助用户完成从高唤醒状态到放松状态的神经切换。</p>\n  <p>触觉安抚是实现这一切换的关键路径。温和的按压和有节奏的拍抚能够激活迷走神经，降低皮质醇。但如何让一个机器人在家庭中跟人能安全地完成“拥抱”？SoulX团队选择在MoYa中植入了一套自研的柔性气动材料，结构与控制算法。</p>\n  <p>不同于传统电机驱动的机器人，MoYa采用气泵驱动替代电机，运行过程中几乎没有噪音，力度也更容易控制。即使用户整个身体施压状态下，也可以有效避免夹伤或磕碰的风险，这种天然的安全性令其更贴近适合睡眠场景使用。</p>\n  <p>它没有电机关节，而是一个可以精确控制充气放气的软体系统。其中，机器人的胸前和后背分布着多个触觉传感器，可以实时监测压力与面积的变化，为气压调节提供闭环反馈。当用户提出“抱紧一点”，气泵增加气压，机器人的身体从多方向膨胀，产生大面积且均匀的深层压力。</p>\n  <p>除了拥抱时的力度调节，MoYa还搭载了节律安抚与生理同步算法。它会跟随用户的呼吸节律进行安抚拍抚，在舒缓压力的同时不会干扰睡眠。这种同步不是固定的节奏，而是通过传感器感知用户的呼吸频率，动态调整拍抚的间隔和力度，让机器人的动作与用户的身体自然合拍。</p>\n  <p>看似自然的拥抱，背后并不是一个简单的硬件功能。柔性机器人需要同时解决本体结构、材料特性、非线性运动控制、触觉反馈、消费级泵阀、噪声与振动、耐久性和量产一致性等问题。SoulX已围绕柔性本体、底层控制和消费级气动供应链形成多层技术积累。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260614/v2_d2cb5f9f3c144713934f07a2fc9961a2@6022551_oswg700927oswg1002oswg742_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa（图源/企业）</p>\n  <p>在交互层面，MoYa遵循“被动触发”的原则，这是睡眠场景的特殊性决定的。MoYa不会主动发起动作，而是当用户触碰或者发出语音指令时才响应。</p>\n  <p>“从静态毛绒过渡到安抚机器人，人的心理认知是有阻碍的。人真的准备好跟一个机器人相处了吗？我觉得用户需要时间去认同并接受。”郑潜说，“所以我们在产品定义时就确定了，MoYa得被动，得少自由度，也不加复杂的行为模式。用户不需要说明书，而是在看到产品就会天然地知道如何与它互动：抱它，拍它，跟它说话，此时它才会有反应，进而把认知障碍降到最低。”</p>\n  <p>硬氪了解到，MoYa首代系统已完成关键链路验证，小范围批量测试正在推进。这意味着柔性机器人从技术展示走向消费产品，正显现出一条清晰可行的路径。也正因为本体、控制、供应链与体验高度耦合，这是一条很难依靠单点能力快速复制的路线。</p>\n  <p>而安全进入家庭，正是所有技术决策的前提。</p>\n  <p>郑潜告诉硬氪，其产品迭代也需要逐步“减少棉花的作用”，让柔性机器人本体本身承担更多包裹、支撑与动作表达。</p>\n  <p>在验证了一套技术方案可行性的基础上，SoulX的野心不止于做一个睡眠机器人产品。</p>\n  <p>MoYa是家庭关护机器人的第一步，更长期的方向，则是面向家庭近距离交互的刚柔耦合机器人：该柔的时候柔，该刚的时候刚。</p>\n  <p>家庭关护的核心入口，不在于叠加更多功能，而在于重新理解“在场”的含义。睡眠场景提供了高频、刚需、低侵入性的验证环境，而柔性气动技术与心智Agent的组合，构成了从睡眠到卧室再到全屋关护的可扩展技术基座。</p>\n  <p>依托现有行为追踪、RPPG无接触心率监测等感知能力，产品早已跳出普通睡眠摆件的局限，可精准捕捉用户生理与情绪波动，主动提供适配当下场景的温柔陪伴，切实改善睡眠状态、逐步引导健康作息。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_789a0ff6780041588dfa126fee5ae70f@6022551_oswg1159903oswg1600oswg1066_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">睡眠安抚机器人产品MoYa在BEYOND Expo展会（图源/企业）</p>\n  <p>随着未来视触觉多模态交互能力持续落地迭代，SoulX将从睡眠伴侣延伸至卧室情绪管家，再到覆盖全屋的关护中枢，彻底摆脱被动应答的传统逻辑，基于全方位实时感知主动捕捉用户潜在需求，进一步拓宽家庭智能关护机器人的能力边界。</p>\n  <p>更深层的价值，来自长期多模态数据沉淀形成的认知能力。郑潜把这套系统称为“家庭动态心智档案”。它不仅仅是增加聊天记忆，而是持续记录生活线索、情绪周期和家庭成员之间的互动模式，逐步构建一个具备预测能力的“心智世界模型”，并成为一个能理解“这个今天发生了什么”的智能家庭成员。</p>\n  <p>在技术不断追逐更强大、更智能的当下，可以说，MoYa做的事情并不复杂。它学会轻柔安抚的拥抱，记住用户的心事，在合适的时刻默默陪伴左右。</p>\n  <p>夜晚来临，当一个人抱着柔软的躯体感受舒缓轻拍，听它说出贴合当下心境的宽慰话语，这份被陪伴的宁静，或许比任何精密的算法都更接近关护的本质。</p>\n  <p><strong>以下为硬氪与SoulX创始人兼CEO郑潜的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：市面上不少陪伴类产品追求高自由度、主动交互，</strong>MoYa<strong>却采用了被动触发的设计。这个选择的背后逻辑是什么？如何规避用户短期新鲜感消退、闲置吃灰的问题？</strong></p>\n  <p><strong>郑潜：</strong>这是核心场景适配层面的关键取舍。睡眠、卧室休憩场景存在天然变量，用户摆放、抱持设备的姿态完全无固定标准，机身位置、朝向随时变化。如果叠加高自由度自主运动结构，机器人在用户靠近时突然转头或发生其他动作异动，很容易触发恐怖谷效应，给用户带来强烈不适感。</p>\n  <p>人类对动态智能载体存在天然心理认知门槛，从静态毛绒物件到自主活动机器人的切换，心理接受度存在明显断层，这也是目前大多数产品忽略的关键体验问题。</p>\n  <p>针对床、沙发这类近距离居家场景，我们选择低自由度、被动响应架构，仅在用户触碰、拥抱、语音交互时触发反馈，最大限度降低用户心理隔阂。线下实测也能印证这套逻辑，用户不用阅读说明书就能自然懂得抱握、轻拍、对话的交互方式，学习成本几乎为零。</p>\n  <p>用户留存与使用粘性我们并不担心，主要三个方面。第一是产品尺寸比较大、60公分，放置于床面具备强视觉在场感，很难被忽略； 其二，触觉安抚具备先天生理成瘾性，源于人自幼的依恋心理，拥抱、轻拍带来的舒缓体感，能形成稳定使用习惯； 其三，设备搭载持续记忆对话能力，作为居家专属陪伴载体，用户有倾诉情绪、分享日常的交互诉求。</p>\n  <p>初步种子用户测试显示，MoYa的使用高峰集中在睡前放下电子设备、晨起与归家休整三个场景。</p>\n  <p>在连续两周的小范围测试中，用户人均每日发起约3至4次拥抱或节律安抚，单次交互通常持续数分钟；部分活跃用户会在睡前与MoYa持续展开更深入的沟通。从用户反馈来看，约七成用户感觉使用后更容易从紧绷状态逐渐放松；超六成用户认为，睡前安全感或入睡体验有所改善。</p>\n  <p>目前我们也在扩大测试样本，并结合主观量表、HRV等生理指标完成进一步验证。</p>\n  <p><strong>硬氪：</strong>MoYa<strong>的长期记忆不是简单存储对话历史，而是构建“家庭心智图谱”。这套系统具体会捕捉哪些信息？相较于常规对话机器人的记忆能力，它的差异化设计体现在哪些方面？</strong></p>\n  <p><strong>郑潜：</strong>二者底层逻辑完全不同。我们这套心智图谱存储的不是标准化统计标签，不会单纯记录用户睡眠时长、作息数字这类孤立参数，沉淀的记忆是关于你个人的生活线索，完整留存用户日常里细碎的生活叙事与情绪线索，包括跟朋友、跟家人相处、工作琐事等各类细节。我们管它叫“心智画像”。</p>\n  <p>举个直观例子，系统不会只标记“用户压力大、失眠”，而是完整留存对话上下文，比如和上司产生矛盾、当日摄入大量咖啡、自家宠物身体不适、长期入睡困难这类连贯事件。所有信息都会站在用户的视角串联成完整叙事脉络，而非零散数据。</p>\n  <p>这也造就了独有的连续交互能力，当用户再次提起相关话题，设备会主动承接过往细节去组织的叙事图谱，主动关心“你那只猫好点了吗？”“你今天还喝那么多咖啡吗？”，这种记忆连贯性，恰恰是拉近情感、建立亲密陪伴感的核心。</p>\n  <p>同时，它的感知不会局限于单次对话内容，而是持续追踪用户的情绪起伏、压力来源、睡眠变化，形成动态、多维度的完整用户认知。放在过去，能完整记住我们所有细碎心事、长期留意身心状态的，往往是家人或挚友，而SoulX团队希望能把这种长期共情记忆能力落地在机器人上。这也是它和通用聊天机器人最大的区分点。</p>", "category": "tech", "published_at": "2026-06-14T01:30:00+00:00", "fetched_at": "2026-06-14T03:34:54.026195+00:00", "fingerprint": "fd4514e07d82e836"}, {"source": "少数派", "title": "具透 | 除了 AI，iOS 27 首个开发者测试版中你不能错过的新功能", "url": "https://sspai.com/post/110973", "summary": "少数派在体验了新版系统之后，帮你整理了 iOS 27 中值得关注的新功能和新特性，希望帮你能了解新版系统的方方面面。<a href=\"https://sspai.com/post/110973\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-13T02:37:12+00:00", "fetched_at": "2026-06-14T03:34:52.370333+00:00", "fingerprint": "7b5405883437281f"}, {"source": "BBC World News", "title": "Discovery of €1.2m jewellery prompts fresh probe into former Spanish PM", "url": "https://www.bbc.com/news/articles/cjeg9p1xqdwo?at_medium=RSS&at_campaign=rss", "summary": "José Luis Rodriguez Zapatero is suspected of being unable to show proof he paid import duties on the jewellery.", "category": "politics", "published_at": "2026-06-12T15:55:46+00:00", "fetched_at": "2026-06-13T02:56:55.572023+00:00", "fingerprint": "6759c72f41be88ed"}, {"source": "BBC World News", "title": "French town buries murdered child as prices", "summary": "If you're thinking about upgrading your phone, \"the best time was yesterday,\" according to Nothing CEO and co-founder Carl Pei, echoing a message we heard during MWC. As Android Authority reports, Pei said in a post on X that the RAM shortage has already impacted Nothing's less expensive mid-range phone: \"For Phone 4A , memory [&#8230;]", "category": "tech", "published_at": "2026-06-12T20:02:48+00:00", "fetched_at": "2026-06-13T02:56:54.761287+00:00", "fingerprint": "c436788f12c6bd10"}, {"source": "The Verge", "title": "Valve just imported 13 tons of VR headsets in one day", "url": "https://www.theverge.com/news/949517/valve-vr-headset-import-records-steam-frame-steam-machine-game-console", "summary": "On June 10th, the German container ship Posen docked in Los Angeles after a two-week voyage from Shanghai. As Valve watcher Brad Lynch notes, it was almost certainly carrying the first mass production shipments of the Steam Frame, Valve's new gaming headset. Import records show that Valve's distribution partner Ceva offloaded nearly 32 metric tons [&#8230;]", "category": "tech", "published_at": "2026-06-13T01:32:18+00:00", "fetched_at": "2026-06-13T02:56:54.761279+00:00", "fingerprint": "377df49961d2edfe"}, {"source": "36氪 - 最新文章", "title": "神秘失窃案背后，比亚迪如何“驯服”泰国工厂？｜深氪lite", "url": "https://36kr.com/p/3846882883963139?f=rss", "summary": "<p>比亚迪泰国罗勇工厂，曾接连陷入神秘“失窃案”。然而盘点下来，钢材螺栓数目齐全，劳保用品甚至都没有异常消耗。</p>\n  <p>实际上，被盗的并非值钱物件，而是车间水房里，桶装水塑料标签上的“BYD”Logo（品牌符号）。</p>\n  <p>那些本应随意摆放的桶装水，总会被转成同一个角度。桶身上原本完整的BYD字样齐齐消失，只留下一道被小刀精心裁剪过的轮廓痕迹。</p>\n  <p>李有才是首批加入比亚迪罗勇项目的员工之一，他告诉36氪，直到一次受邀参加当地泰籍员工间的聚会，他才找到这些被“偷走”的BYD Logo。</p>\n  <p>“<strong>有一个当地人穿了一件T恤，那不是我们的工服，但胸前却有一个BYD的Logo，我凑近了看才发现，那就是桶装水上的Logo塑料片，他们用胶水小心地粘在衣服上</strong>”，在李有才的询问下，当地人纷纷向他展示自己的贴有BYD Logo的“周边”，有帽子、鞋子，甚至是菲亚特汽车上。</p>\n  <p>中国工业品牌第一次在海外变成了\"想要贴在身上的符号\"。</p>\n  <p>“他们就想让别人知道自己在比亚迪工作”，李有才告诉36氪，“比亚迪在罗勇，就像90年代在中国的外企，所有人都认可比亚迪产品好、技术稳、环境好、待遇好、成长空间大”。</p>\n  <p>比亚迪免费发放的蓝色工服，也成了泰国罗勇当地的“硬通货”。总有员工跑来登记说工服丢了，要求补领。</p>\n  <p>李有才告诉36氪，比亚迪工服在罗勇，如今就跟三星海力��的工服在韩国一样，特别有面子，“他们根本没有丢工服，而是很多亲戚朋友想要这件BYD的衣服，都拿出去送人了”。</p>\n  <p>这家在中国被称为“带头卷价格”的品牌，在泰国罗勇却成了当地劳工心里的“保时捷”。而这距离比亚迪在泰国罗勇建设这座工厂，才过去短短2年时间。</p>\n  <p>中国车企和核心产业链，在过去数年时间，都开始轮番向海外市场发起冲击。</p>\n  <p>过去三年，中国车企新规划与投产的海外乘用车基地超15座，而比亚迪显然是最为激进的行动者之一，其海外市场销量已经从2024年的40万辆增长到2025年105万辆，今年更是制定了高达160万辆的目标。</p>\n  <p>但除了出口，对于欧洲、东南亚等大型的区域市场来说，本地制造甚至建立起当地产业链，才是更为持久和安全的出海战略。泰国工厂，正是诞生于这样的背景之下。</p>\n  <p>凭借地理位置与贸易政策便利，泰国早已成为日系品牌全球最大的右舵车生产基地，每年为其生产130万辆车。比亚迪也曾在多个场合强调，其在泰国建厂的愿景并非仅限于本土市场，而是希望以泰国为据点，辐射东盟乃至全球右舵市场。</p>\n  <p>而东南亚地区的人员文化融合和用工问题，几乎是大量出海企业都面临过的困扰。就连苹果与富士康的印度工厂，也曾因为中方工程师回撤而一度面临停工。</p>\n  <p>比亚迪在短短两年时长内，让一个海外工厂正常运转，工厂内部的多种文化生态顺利融合，甚至让生产效率与国内工厂同频。这相当于中国车企在这场出海远途中，探出了一条路。</p>\n  <p>据36氪了解，比亚迪在泰建厂的头一年，其员工流失率便低于泰国工会12%的平均值。而如今，长城、长安等中方企业更是以50%的薪资涨幅，在大力挖角比亚迪培养的泰籍工程师。</p>\n  <p>回到2023年，面对罗勇工地的尘土，和当地中企员工动辄50%的流失率传说，李有才怎么也无法想象，比亚迪究竟要怎样做，才能在泰国这片土地上真正俘获人心。</p>\n  <h3><strong>进驻罗勇府：准备功夫做足两年</strong></h3>\n  <p>比亚迪罗勇项目团队成立于2022年，李有才告诉36氪，尽管比亚迪此前已在泰国涉足商用车的零售与合作，但面对“去泰国建厂”这件事，当时项目组所有人的心里都没底。</p>\n  <p>“厂房和设备，我们中国人直接过去建就行，这个倒不担心。当时心里第一个大挑战，是怎么招到泰籍工程师，以及让他们学会比亚迪那一套章程”。</p>\n  <p>根据国际劳工组织的数据，东南亚地区的劳资纠纷发生率显著高于全球平均水平，连苹果与富士康的工厂，都高度依赖中国工程师运转。</p>\n  <p>比亚迪并没有急着把人派往泰国，而是先让团队沉下心来，在国内做了整整一年的案头功夫。</p>\n  <p>“集团准备了很多资料，泰国的政策、人文、经商环境、工厂环境，<strong>尤其是丰田、三花、福特泰国工厂的相关资料”，李有才告诉36氪，光是书面资料学习，就经历了将近三个月。</strong></p>\n  <p>案头工作里最吃重的，是将比亚迪研发生产流程中的每道工序、每个细节，写成执行手册，再拍成视频，并全都做成中泰双语。</p>\n  <p>泰国汽车产业的情况有些特殊。它长期在日本品牌的体系下运转，培养了数十万熟练技工，但真正手握核心技术的工程师却凤毛麟角，至于电池等新能源汽车配套人才，更是断档严重。</p>\n  <p>对中国新能源车企来说，想把本地的“会组装”变成“懂体系、懂标准、能把流程文件跑通”，这条路并不好走。</p>\n  <p>“我们听过不少前车之鉴，有的公司中国工程师前脚刚走，当地员工后脚就看不懂操作手册了”。</p>\n  <p>李有才告诉36氪，当时团队贯彻的原则之一，就是即便未来无法联络上中方员工，泰籍同事也能凭借这些文本与视频，独立解决产线上的突发难题，<strong>“必须考虑到所有细节，哪怕是在中国工厂从未暴露的问题，也必须逐项落于纸面、录入镜头”。</strong></p>\n  <p>在案头筹备和厂房建设的尾声，比亚迪正式开启当地的招聘工作。“钞能力”，便是比亚迪的第一张牌。</p>\n  <p>罗勇府一般电子机械类操作工的月薪约为2000元人民币；而在首都曼谷，同类岗位的月薪通常可达3000元人民币。</p>\n  <p>多位知情人士告诉36氪，比亚迪的薪酬水平较曼谷更高30%。操作工月薪普遍达到4000元人民币，部分核心技术工人能够达到6000元人民币。工程师人才则相对匮乏，比亚迪只能从成熟企业挖角，“上浮30-50%的工资挖人是常有的事”。</p>\n  <p>除此之外，罗勇基地员工的工资结构也与国内不同。</p>\n  <p>在员工基础工资外，比亚迪还设置了月度绩效、季度奖金、年度奖金；工作时长严格遵守劳动法、加班工资加码，普通周末双倍、节假日三倍；每年15天年假，如未休假可以折现；生产线部分岗位甚至享有单独津贴。</p>\n  <p><strong>人招进来了，但更大的挑战才刚刚开始。摆在比亚迪面前的第二道难关，便是如何留住这些泰籍员工，把居高不下的流失率降下来。</strong></p>\n  <p>李有才告诉36氪，产线技工占员工总数超过九成。“中国人根本猜不透当地人的心思。招聘机构说得很直白：这些技工很难管，有人干一个月就预支工资，预支完直接跑路。这不是比亚迪独有的问题，很多泰国本地工厂也一样头疼”。</p>\n  <p>我们的思路是先了解人。”李有才说，他和团队成员实地走访了罗勇府基层劳工的生活环境，发现，“穷一点的住在木头房子里，跟中国80年代差不多，下大雨偶尔还漏水。没空调，全家只有一台电风扇。这就是大多数基层操作工家庭的真实写照。”</p>\n  <p>早在2010年，王传福就曾直言比亚迪的管理思路：\"<strong>你是企业家，就要像家里的老父亲老母亲一样，事事为儿女着想般地为员工着想。</strong>你只有把他们照顾好，他们才会照顾好你的公司，进而照顾好你的利润\"。</p>\n  <p>如今，罗勇基地再次让这句朴素的道理落了地。</p>\n  <p>“早期去的中国同事把苦吃透了，就为了给泰籍同事创造好的环境”，李有才向36氪表示，基地建设初期人手非常紧张，食堂用具与原料、工服与劳保用品、员工宿舍楼的电器与床上用品等等琐事都压在他团队的肩上。</p>\n  <p>“团队只有零星几个人，在罗勇、春武里、曼谷等地来回奔波采购，我甚至在毛坯宿舍楼里住了半个月，你必须亲身感受，才知道哪里能优化”。在李有才的回忆中，罗勇项目组成员都在贯彻这样的工作原则。</p>\n  <p>比亚迪罗勇基地的总经理，此前在比亚迪中国某基地任管理要职。多位接近罗勇基地的人士向36氪表示，他抵达罗勇厂区后，<strong>除了建设进度外，最重视的就是与员工切实相关的生产安全与生活舒适度相关问题</strong>。</p>\n  <p>“每周开会他都要强调，中国基地能做到什么程度，罗勇基地就必须做到什么程度，不能因为条件艰苦就放低标准”。</p>\n  <p>“他几乎用脚走遍了厂区的每一个角落，厂房哪个角落需要加装风扇、哪段路走起来太远需要安排固定接驳车，他对厂区的指导意见是非常细致且实用的”。</p>\n  <p>从最初撰写案头规划，到最终将这些设施与服务逐一落地，比亚迪罗勇基地整整花了两年时间。如此大费周章，究竟是为了什么？</p>\n  <p>初来乍到的中国企业在泰国毫无信任背书。吃苦耐劳、疯狂加班的印象在前，16个月拔地而起的比亚迪罗勇工厂在后，这让信奉“过度的苦不增加功德”的泰国人，从开始便心生抵触。</p>\n  <p>而早期中国车企在泰国的做法，偏偏又非常“中国化”：我给够了钱，你总该愿意加班了吧？事实却是：员工非但不愿意加班，流失率反而高达30%-50%，远超当地平均水平。</p>\n  <p>要打破困局，就必须拼命证明一件事：自己不是血汗工厂。</p>\n  <p>当比亚迪的床垫比丰田的更软乎，饭菜比泰国电子厂的更香，班车线路比福特的更合理，比亚迪试图用行动告诉泰国人：我请你来，不是为了把你钉在流水线上。我在乎你在这里工作的每一个日子，把你当成一个活生生的人，而不只是一个工人。</p>\n  <p>然而，这一切都只是铺垫。一个工厂成败，产能是最核心的指标。真正的硬仗，在产线启动的那一刻，正式打响。</p>\n  <h3><strong>投产：中国速度遇上“轻松做工”的泰国人</strong></h3>\n  <p>初期，比亚迪在罗勇实行一对一、师带徒的教学模式，“在中国叫了很大一批工程师和生产领班。这些岗位基本都会英语，不会英语的科室就配了两名翻译，还准备了翻译机翻译软件，教学还算顺利，但不同文化间的摩擦在所难免”。</p>\n  <p>李有才向36氪回忆，“有天快下班了，一个泰籍员工找到我，说中方工程师骂他笨，他很生气，甚至想要离职”，他当时的做法便是，立刻致电厂长，将带教的中方工程师叫到现场，“双方一句一句对，看看是哪句话让泰籍员工感到被冒犯了。但结果只是，中方工程师说话的时候比较急比较大声”。</p>\n  <p>“这样的事，早期经常发生”，李有才补充。</p>\n  <p>泰国劳工的口头禅永远是“ใจเย็นๆ”（慢慢来，别急）。他们相信赚钱是为了生活，而非活着只为赚钱。一到下班点，人必须走：回家、参加寺庙活动、朋友聚会，各有各的安排。他们看重工作氛围和同事间的体面：方法可以教，错可以指，但不能当众让人难堪。</p>\n  <p>自此，比亚迪开始推行一系列措施：设置了每周座谈会、投诉信箱、投诉二维码，<strong>甚至厂长办公室也随时开放，“只要你觉得不舒服了，随时可以立刻去找厂长说”。</strong></p>\n  <p>各级领导每日强调必须尊重泰籍同事，坚持耐心教导、多予鼓励、禁止直接批评谩骂；泰籍员工投诉，须当日事当日毕，无法当下解决则需约定何时答复；工厂层面实行幸福工厂计划，将员工满意度与工厂月度业绩分红挂钩等等。</p>\n  <p>在泰国，尊严是一条看不见的红线，社会共识是：权力再大，也不该用来踩碎一个人的体面。</p>\n  <p>而比亚迪又是一家完全陌生的中资工厂，当地工人的神经几乎绷得像一根即将断掉的弦：中方员工的眼神稍微冷一点、声调稍微高一点，都可能被读作冒犯。</p>\n  <p>一旦冲突处置失当，比亚迪面对的不仅是员工流失，更是一个挥之不去的“坏雇主”标签，而这足以让它在当地的扩产计划举步维艰。</p>\n  <p><strong>“总经理当时甚至下了一条指令，如果中方员工和泰方员工发生矛盾，中国员工要先让一步</strong>”，李有才告诉36氪，“我有时候都在想，领导们是不是膝盖有点太软了，为什么要对外国人这么好呢？连说都不能说”。</p>\n  <p>直到基地统计员工流失率，看到那个低于10%的数字，李有才恍然大悟，理解了那些“不合理”背后的合理。</p>\n  <p>然而，新的难题很快来临：中方员工的外派期限就那么长，政策对泰籍员工比例的要求不断增加，泰国工厂得尽快学会自己走路。</p>\n  <h3><strong>中方回撤：泰国人如何扛大梁？</strong></h3>\n  <p>中泰职场文化存在一道明显的分水岭。在中国，只要是领导，谁都能管你。但在泰国，许多人只认自己直属的那一位，越级而来的指令，他们不买账。<strong>中国的“宣讲式管理”到了泰国，彻底水土不服，那种自上而下、单向灌输的方式，泰国人根本不买账。</strong></p>\n  <p>2024年底，罗勇基地开始实行一项“种子人才计划”。</p>\n  <p>“从操作组长、工程师里，挑出比较优秀的、认可比亚迪文化、并且对中国比较向往的员工，到中国进行培训，返泰后让他们担任管理要职”，李有才告诉36氪，第一批被委派至中国学习的泰籍员工共一百余人。</p>\n  <p>这些泰籍员工抵达中国后，将接受为期三个月的培训，“会安排一个同岗位的中国员工跟他们同吃同住，参观比亚迪中国2-3个基地，了解新车研发、试制到投产的全流程，了解比亚迪工程师背景和日常生活，甚至还有一些中国文化相关的活动”。</p>\n  <p>返回罗勇基地后，这些“优秀学员”便会成为泰籍员工队伍中的管理者，承担中泰两方员工之间的桥梁工作。</p>\n  <p>再后来产线上遇见问题，中方员工都必须先找到这个管理者，向这名管理者描述问题，并展示正确做法。</p>\n  <p>“他们了解问题和解决方案后，再以他们觉得适合的方式去和当事员工沟通。相当于，中方员工不用去摸清每个泰国员工的脾气秉性了，<strong>我们只需要和这个管理者沟通，而这个管理者是已经接受过比亚迪更完善培训的了</strong>”，李有才表示，种子人才计划如今已成为罗勇甚至其他海外分部的长期计划。</p>\n  <p>“我们准备得挺周全了，但泰籍员工和中国人的工作习惯还是不同”，李有才表示，泰国当地节假日数量多，绝大部分员工都拒绝节假日加班，“还有一个兜底政策就是，泰国人搞不定的，中国人上。前期外派的中国员工经常干到晚上9、10点”。</p>\n  <p>比亚迪罗勇工厂用两年时间，跳出单纯建厂造车的浅层出海模式，探索出了从薪酬福利、文化包容、本土育才的完整落地路径。对比诸多出海车企遇阻的用工矛盾、人才断层难题，这座生产基地，可以说是中国车企难得的标杆样本。</p>\n  <h3><strong>罗勇工厂2026：如何突破、如何复制</strong></h3>\n  <p>在海外建设的第一座基地，比亚迪几乎倾注了全部的成本与精力。</p>\n  <p>然而，即便做了最大努力，在投产12至18个月后，本该是产能爬坡结束的时期，其产能利用率仍不足50%——这个表现，相比许多其他出海车厂比下有余，但比上不足——同期，丰田泰国皮卡工厂稳定超过80%，比亚迪中国部分基地甚至高达95%。</p>\n  <p>另一方面，2025年比亚迪在东南亚的销量正在狂飙：泰国市场同比增长超60%，印尼市场猛增200%并跃居销量第一，菲律宾更是暴涨400%。</p>\n  <p>在泰国建厂，本意正是以此为支点，辐射整个东南亚右舵市场，为区域扩张提供制造腹地。<strong>然而现实是，泰国工厂的产能爬坡速度，目前仍落后于比亚迪在东南亚的销量增长步伐。</strong></p>\n  <p>2026年，比亚迪为出海业务设定了更高的目标：年销量突破150万辆。然而，其自建滚装船队的实际年运力约80万辆，剩余70万辆如若依赖第三方运力，高昂的运费将大幅侵蚀其海外利润。因此，加速海外工厂的产能释放，成为比亚迪今年的重中之重。</p>\n  <p>从销量结构看，目前全球增速最快的区域正是南美洲和以泰国为核心的东盟。而目前，比亚迪巴西工厂2025年刚投产，尚处爬坡期；印尼工厂仍在建设，目标是在年底实现投产。</p>\n  <p>泰国罗勇工厂，从过去到现在，始终占据着一个特殊的位置。它打下了比亚迪海外工厂的第一块砖，如今也最先直面“如何继续扩产”这道难题。</p>\n  <p>如今，比亚迪刚刚走通从“中国方法”到“泰国方法”的路，第一次真正学会了如何在海外建设一座工厂。但李有才向36氪坦言，“罗勇项目组的同学调到巴西去，发现也得从0开始干活，并没有能完全复用的东西”。</p>\n  <p>2025年，比亚迪巴西工厂因承包商违规让31人共用一间卫生间，这一违规用工行为被巴西政府查处。“中国人很难想象国外对用工环境的要求有多严，也很难想象员工会因为什么就不干了”，李有才对36氪说，虽然泰国罗勇工厂倾尽心血，换来的不过是50%的产能利用率，“但不认真做，压根就开不了工”。</p>\n  <p><strong>中国人可以把标准化的钢筋厂房和产线设备带到任何地方，但让那套设备转起来的“社会环境”，却无法复制。</strong>即便同在东盟，泰国和印尼的气候如此相似，当地人的宗教信仰（泰国佛教为主，印尼伊斯兰教为主）、家庭结构和文化教育，也已截然不同。</p>\n  <p>出海建厂已成定局，中国车企缺的不是蓝图，而是一本能在不同国度反复生效的真经。</p>\n  <p>从比亚迪罗勇基地，我们看到一个朴素的道理：中国企业出海建厂，首先要成为“值得被尊重的雇主”。赢得尊重的方式，在中国，可能是待遇与情义；在德国，是可靠与规矩；在泰国，要顾及员工的体面与个人成长；在南美，则或许在于如何证明自己的长期主义。</p>\n  <p>归根结底，无论身处哪一国，受人敬仰的企业做的都是同一件事：让自己成为那个地方的一部分，而不是那个地方的过客。</p>\n  <p>*李有才为化名</p>", "category": "tech", "published_at": "2026-06-12T06:26:00+00:00", "fetched_at": "2026-06-13T02:56:54.598181+00:00", "fingerprint": "c8fc360edff6e943"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜SpaceX确定发行价，募资750亿美元创史上最大IPO；OpenAI CEO奥特曼推迟访韩计划；中央网信办举报中心开设“涉AI应用乱象举报专区”", "url": "https://36kr.com/p/3849942472512769?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849894508041220\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenAI CEO奥特曼推迟访韩计划</strong></a></p>\n  <p>据报道，OpenAI首席执行官山姆·奥特曼因个人原因推迟访韩计划。奥特曼原定于14日至15日访韩，会见三星电子、Kakao、NAVER等企业负责人。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849421770658823\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Alphabet旗下自动驾驶公司Waymo将推出30美元月费会员计划</strong></a></p>\n  <p>当地时间6月11日，Alphabet旗下自动驾驶公司Waymo宣布，将推出仅限受邀用户参与的Waymo Premier30美元月费会员计划，会员可享受优先接送、每次行程10%的乘车返现（以乘车积分形式返还）、在新城市优先体验Waymo服务以及每月最多五次免费取消行程等权益。Waymo表示，最初将通过应用程序和电子邮件向美国旧金山、洛杉矶和凤凰城的数万名符合条件的乘客发送邀请，计划最终将会员计划推广到Waymo应用程序已覆盖的其他城市。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849477119939840\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士考虑引入ChatGPT等外部人工智能服务</strong></a></p>\n  <p>据业内人士周五透露，继三星电子之后，SK海力士也在考虑更广泛地采用人工智能（AI）技术来改变其工作流程。消息人士称，SK海力士CEO郭鲁正周四在一次会议上表示，该公司正寻求在保护工业技术和扩大人工智能应用之间取得平衡，同时也在评估引入外部生成式AI模型的可能性。郭鲁正表示：“我们正在考虑采用Microsoft 365和CoPilot，同时也在从安全性和系统架构的角度评估ChatGPT在公司内部的潜在应用。���</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849778096198656\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>华尔街大行限制对冲基金对SK海力士和三星等亚洲芯片股的做多杠杆</strong></a></p>\n  <p>据知情人士透露，全球银行正在限制对冲基金对亚洲顶级芯片制造商（包括SK海力士和三星电子）的杠杆押注，此前今年以来的猛烈上涨引发了可能回调的担忧。知情人士表示，包括花旗集团、摩根大通和高盛在内的经纪商已经提高了对冲基金通过掉期方式押注SK海力士和三星电子股票的融资成本。银行收紧了新交易的规模以及向哪些公司提供交易，有些银行甚至拒绝客户提出的新掉期交易请求，或根据具体情况进行评估。针对台积电，银行也采取了类似措施。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849744240989442\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>谷歌宣布追加投入5000万美元培训美国技工，以满足AI基础设施建设需求</strong></a></p>\n  <p>随着人工智能的蓬勃发展，对数据中心和基础设施的需求空前高涨，Alphabet旗下的谷歌正在加大对美国技术工人队伍的投资。当地时间周四，Alphabet首席执行官桑达尔·皮查伊宣布，谷歌将追加投资5000万美元，帮助美国20多个州的30多万美国人做好从事技术行业职业的准备。据谷歌称，这项新的投入是其更大规模计划的一部分。自2022年以来，该公司已在全球范围内投入超过10亿美元用于培训和技能提升项目，帮助超过1亿人掌握数字和人工智能相关技能。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849684512019457\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SK海力士回应厂区火灾：已初步控制，生产设备运行正常</strong></a></p>\n  <p>6月12日，消息显示韩国SK海力士清州第四园区爆发火情。对于最新情况和影响，SK海力士方面向记者表示，已完成初步控制，正调查具体情况。目前生产设备运行正常。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849592681895176\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>晶核能源发布全球首款专为机器人场景定制的高性能固态电池</strong></a></p>\n  <p>36氪获悉，近日，上海FINE 2026未来产业新材料博览会启幕，晶核能源携全球首款专为机器人场景定制的高性能固态电池首发，并获 “2026固态电池领军金球奖”。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849759679436038\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“碳生万物”完成A轮融资</strong></a></p>\n  <p>36氪获悉，据高榕创投消息，近日，“碳生万物”宣布完成A轮融资。本轮融资由黄河三角洲投资、高榕创投和博远资本共同领投，同时引入宁德时代、阳光电源、倚锋资本等新股东，多家老股东持续跟投。&nbsp;本轮融资资金将用于公司宁夏千吨级DAC（直接空气碳捕集）制备e-SAF（可持续航空燃油）项目建设、工艺放大、核心技术迭代及全球顶尖人才引进。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849378031899913\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX确定发行价，募资750亿美元创史上最大IPO</strong></a></p>\n  <p>根据SpaceX周四在官网发布的声明，公司此次IPO发行5.556亿股，发行价为每股135美元，募资总额达750亿美元。SpaceX此次IPO募资规模是沙特阿美2019年创下的294亿美元上市纪录的逾两倍。声明显示，SpaceX还授予承销银行超额配售权，可按发行价额外购买8330万股股票。若该权利全部行使，IPO融资规模将增至约860亿美元。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849754408326150\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>欧洲央行管委内格尔：如有必要将于7月再次加息</strong></a></p>\n  <p>据报道，欧洲央行管委内格尔表示，欧洲央行将在7月保持所有选项的开放性，一旦需要，随时准备再次作出响应。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3849870270256390\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“词元（Token）云服务提质赋能评估计划” 正式启动</strong></a></p>\n  <p>36氪获悉，中国信息通信研究院以“可信词元（Token）云服务”为主题，于2026年6月10日组织开展了研讨会。中国工程院院士郑纬民、中国信通院总工程师何宝宏、中国信通院云计算与数字化研究所副所长（主持工作）栗蔚出席并发言。会上，中国信通院联合天翼云、阿里云、华为云、京东云、联想、阶跃星辰、金山办公、清程极智等十余家企业，发起了“词元（Token）云服务提质赋能评估计划”并发布多项成果。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849819407127559\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中央网信办举报中心开设“涉AI应用乱象举报专区”</strong></a></p>\n  <p>36氪获悉，为配合“清朗·整治AI应用乱象”专项行动，进一步规范AI服务和应用，促进行业健康有序发展，切实保障公民合法权益，中央网信办举报中心自2026年6月起开设“涉AI应用乱象举报专区”，专项受理公众举报。受理范围主要包括生成合成内容标识落实不到位、制作发布虚假不实和暴力低俗信息等14类问题。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3849556520244481\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>全国最大半潜式综合性网箱养殖平台将投产</strong></a></p>\n  <p>今天（12日）下午，全国规模最大的半潜式综合性网箱养殖平台将在海南三亚正式投产，并投放首批鱼苗。该平台的养殖水体总量达到6.4万立方米，相当于约20个标准奥运游泳池的水量。全年可以产出800万斤鱼，同时还可以发展休闲渔业和垂钓观光等农旅融合新业态。</p>", "category": "tech", "published_at": "2026-06-12T13:15:02+00:00", "fetched_at": "2026-06-13T02:56:54.598176+00:00", "fingerprint": "919fd6157ff02963"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜SpaceX市值破2.1万亿美元，马斯克身家达巴菲特7倍；胖东来回应“员工不值这么多钱”等言论；FIFA联名款labubu世界杯销量暴涨30倍", "url": "https://36kr.com/p/3850898430989577?f=rss", "summary": "<h2><strong>今日热点导览</strong></h2>\n  <p>Kimi与一国有银行合作，全球首张AI原生信用卡开放预约</p>\n  <p>韩美半导体将使用500亿韩元投资于SpaceX</p>\n  <p>SK海力士回应本月发生第二起火灾</p>\n  <p>杭州小龙虾降价超50%</p>\n  <p>金价连跌，批发商集中补货</p>\n  <h2><strong>TOP3大新闻</strong></h2>\n  <p><strong>SpaceX市值破2.1万亿美元，马斯克身家达巴菲特7倍</strong></p>\n  <p>当地时间6月12日，万众瞩目的太空探索公司SpaceX于在纳斯达克交易所完成了上市。SpaceX是有史以来规模最大的IPO，发行价定为135美元，对应市值达1.77万亿美元。该股开盘价150美元，午盘涨幅一度突破30%触及176.53美元，随后股价震荡回落收盘报160.99美元，涨幅19.22%，跻身美国市值第六大企业，总市值达到2.1万亿美元。马斯克的个人财富随之升至约1.05万亿美元，成为全球首位净资产超过万亿美元的富翁。这相当于瑞士全年GDP，根据彭博富豪指数，这约等于全球第二到第五名富豪总和，是“股神”巴菲特1450亿美元的七倍。（第一财经）</p>\n  <p><strong>胖东来：从未有任何降薪决定</strong></p>\n  <p>6月12日，针对网络上出现大量关于“胖东来大幅降薪，将调整员工薪酬”、“员工不值这么多钱”“员工收入六千已经非常好了”等话题的讨论，胖东来发布情况说明，“请大家不要误读”。胖东来表示，从未有任何降薪的决定，薪酬政策是在公平公正的基础上保障薪酬收入与创造价值相匹配，目的也是为了培养人和成就人。（财联社）</p>\n  <p><strong>FIFA联名款labubu世界杯销量暴涨30倍</strong></p>\n  <p>快科技6月12日消息，2026年美加墨世界杯开幕，开幕式上亮相的中国原创潮玩IP拉布布迅速走红，一跃成为现象级带货单品，相关联名产品热度空前高涨。作为世界杯历史上首个登台的中国潮玩形象，两只萌趣的拉布布人偶在开幕式收获满堂喝彩，相关画面流传至国内网络后，立刻掀起了抢购热潮。</p>\n  <p>这款泡泡玛特推出的FIFA联名拉布布公仔定价599元，为了应对抢购热潮，平台设置了限购规则，每个账号最多只能入手两件。世界杯开幕后，该款产品的搜索量大幅攀升，整体销量环比暴涨超30倍，多个电商店铺销量轻松破万，部分平台销量甚至接近两万件。（快科技）</p>\n  <h2><strong>AI最前沿</strong></h2>\n  <p><strong>被指设计缺陷致人自杀，OpenAI遭起诉</strong></p>\n  <p>6月11日，一名加拿大女子在美国加州对OpenAI及其首席执行官萨姆·奥尔特曼提起诉讼，称聊天机器人ChatGPT的设计问题导致她女儿爱丽丝自杀身亡。起诉书称，爱丽丝在自杀前约一年半的时间里，曾多次向ChatGPT表露自杀想法，倾诉情感问题，但聊天机器人的安全系统并未启动和介入，也未通知危机处理机构或爱丽丝的家人。此外，ChatGPT的设计优先考虑用户参与度而非安全性，在聊天中提供持续情感支持，可能导致一些人对聊天机器人过度依赖。对此，OpenAI发言人回应称，这起事件令人心碎，公司正在加强对敏感情况的应对能力。据原告律师透露，OpenAI目前面临多起类似诉讼，均由自杀或试图自杀者的家属提起。（央视新闻）</p>\n  <p><strong>SK海力士考虑引入ChatGPT等外部人工智能服务</strong></p>\n  <p>据业内人士6月12日透露，继三星电子之后，SK海力士也在考虑更广泛地采用人工智能技术来改变其工作流程。消息人士称，SK海力士CEO郭鲁正在一次会议上表示，该公司正寻求在保护工业技术和扩大人工智能应用之间取得平衡，同时也在评估引入外部生成式AI模型的可能性。郭鲁正表示：“我们正在考虑采用Microsoft 365和CoPilot，同时也在从安全性和系统架构的角度评估ChatGPT在公司内部的潜在应用。”（新浪财经）</p>\n  <p><strong>谷歌宣布追加投入5000万美元培训美国技工，以满足AI基础设施建设需求</strong></p>\n  <p>随着人工智能的蓬勃发展，对数据中心和基础设施的需求空前高涨，Alphabet旗下的谷歌正在加大对美国技术工人队伍的投资。当地时间6月11日，Alphabet首席执行官桑达尔·皮查伊宣布，谷歌将追加投资5000万美元，帮助美国20多个州的30多万美国人做好从事技术行业职业的准备。据谷歌称，这项新的投入是其更大规模计划的一部分。自2022年以来，该公司已在全球范围内投入超过10亿美元用于培训和技能提升项目，帮助超过1亿人掌握数字和人工智能相关技能。（新浪财经）</p>\n  <p><strong>Kimi与一国有银行合作，全球首张AI原生信用卡开放预约</strong></p>\n  <p>36氪获悉，月之暗面Kimi6月12日宣布，全球首张AI原生信用卡Kimi信用卡正式开启预约，这是首张将AI服务纳入核心权益体系的实体信用卡，持卡人的每一笔消费可转化为AI算力额度，直接兑换Agent使用额度和高级功能等权益。据了解，Kimi已与一大型国有银行及国际卡组织进行合作，探索Token和信用卡积分相互流通的全新金融范式。消费积分可兑换算力额度，持卡人也可以优先内测最新模型。</p>\n  <p><strong>腾讯云:下调MiniMax-M3与Hy-MT2-Pro模型价格</strong></p>\n  <p>36氪获悉，腾讯云公告，大模型服务平台TokenHub将于北京时间2026年6月15日起下调MiniMax-M3模型价格，推理输入、推理输出及缓存命中费用均下调50%。大模型服务平台TokenHub将于北京时间2026年6月12日起下调Hy-MT2-Pro模型价格，输入价格下调66.67%、输出价格下调55.56%。</p>\n  <h2><strong>大公司/大事件</strong></h2>\n  <p><strong>阿里拟出资15亿美元竞购中国生鲜电商“朴朴超市”</strong></p>\n  <p>阿里巴巴正出资15亿美元收购中国生鲜外卖平台“朴朴超市”。知情人士透露，阿里提出的这一价格是此前高鑫零售报价的两倍多。（新浪财经）</p>\n  <p><strong>韩美半导体将使用500亿韩元投资于SpaceX</strong></p>\n  <p>据公司声明，韩美半导体将花费500亿韩元购买SpaceX的股份。这项投资是一项提前布局的战略举措，其驱动力是SpaceX的增长和Terafab项目。（新浪财经）</p>\n  <p><strong>“滴滴出行”改名“滴滴”</strong></p>\n  <p>6月12日上午9点，界面新闻搜索苹果软件App获悉，滴滴出行App 8.0版本11日已正式上线，App名称从“滴滴出行”正式更名为“滴滴”。据滴滴官方介绍，更新后的App页面结构全面升级，新增顶部导航栏，底部新增“消息”、“行程”入口，覆盖出行、送货、旅行、车主等多重使用场景，操作更顺畅。用户可通过语音使用AI打车，“送货”整合了大件送货、快送跑腿、搬家等服务，“旅行”提供租车、机票、酒店、火车票预订及“滴滴私家团”旅游服务。（界面新闻）</p>\n  <p><strong>恒生港美科技指数将纳入SpaceX</strong></p>\n  <p>恒生指数公司6月12日公告，SpaceX于2026年6月12日上市。因此，恒生港美科技指数的编算方法将新增太空探索技术公司（「SpaceX」，股票代号：SPCX.O）至指定美国成分股名单（目前：科技七巨头）。8只美国上市成分股的比重将于2026年6月23日（SpaceX的第7个交易日）收市后重新计算至等权重，新增成分股和更新后的成分股比重将于2026年6月29日（SpaceX的第11个交易日）生效。（界面新闻）</p>\n  <p><strong>SK海力士回应本月发生第二起火灾</strong></p>\n  <p>当地时间6月12日上午9点50分左右，SK海力士清州四号园区M15X二楼的燃气房发生火灾。这是本月发生的第二起火灾事故。据报道，目前尚未发生气体泄漏或人员伤亡。由于工厂内部安装的自动喷水灭火系统立即启动，火势并未迅速蔓延。对于最新情况和影响，SK海力士方面向记者表示，已完成初步控制，正调查具体情况。目前生产设备运行正常。（财联社、证券时报）</p>\n  <p><strong>按姓氏笔画排列、不得单独署艺名，三协会发文整治演员署名“撕番”乱象</strong></p>\n  <p>6月12日，三协会发步通知规范电视剧演员署名。《通知》明确，演员署名实行分类管理，应根据角色性质、戏份体量及实际参与情况，规范使用“领衔主演”“特别出演”“出演”三类头衔，不得随意修改、增加其他名目。需说明的是，上述类别仅适用于有明确角色对应关系的演员。《通知》强调，在分类的基础上，演员署名按照法定姓名的姓氏笔画由少至多排列（复姓按首字笔画计算，少数民族按身份证登记姓名的首个汉字笔画计算）。如笔画相同，则依次比较姓名第二个字、第三个字的笔画，直至形成唯一排序。（央视新闻）</p>\n  <p><strong>燃料涨价推高韩国海鲜价格</strong></p>\n  <p>受霍尔木兹海峡航运受阻带来的油价走高以及气候变化等因素影响，韩国海鲜价格近来显著上涨，渔业经营面临严峻挑战。《韩国商业电讯》6月11日报道，首尔鹭梁津水产市场数据显示，5月最后一周，多种热门海鲜产品的拍卖价格大幅上涨。帝王蟹价格较前一周飙升56.4%，带鱼价格上涨29.1%，雪蟹和八爪鱼的价格分别上涨了28.2%和24.7%。能制作生鱼片的鱼类价格也有显著涨幅。野生比目鱼价格上涨超过30%，养殖比目鱼、野生海鲈鱼和养殖真鲷的价格涨幅均达两位数。（新华社）</p>\n  <p><strong>OpenAI CEO奥特曼推迟访韩计划</strong></p>\n  <p>据报道，OpenAI首席执行官山姆·奥特曼因个人原因推迟访韩计划。奥特曼原定于14日至15日访韩，会见三星电子、Kakao、NAVER等企业负责人。（界面新闻）</p>\n  <p><strong>杭州小龙虾降价超50%</strong></p>\n  <p>进入6月，湖北潜江小龙虾供货量逐渐减少，在走访时发现，目前杭州市场上的小龙虾已经完成了产地轮换，江苏、安徽和浙江本地产的小龙虾增多，货源充足，小龙虾价格也大幅回落，不少市民直呼实现了“小龙虾自由”。目前中青规格小龙虾的批发价每斤12元，大青规格小龙虾每斤16元，跟今年二三月份刚上市时的价格相比，降幅均超过50%。此外，广阔的海外市场，为小龙虾打开了利润增长空间。今年，多地小龙虾出口量与货值双双攀升，远销欧美及东南亚。（央视财经）</p>\n  <p><strong>长江证券：陈佳辞任副董事长</strong></p>\n  <p>36氪获悉，长江证券���告，公司董事会收到副董事长陈佳的书面辞职报告，因个人原因，陈佳申请辞去公司董事、副董事长等职务。陈佳的辞职报告自送达董事会时即生效，辞职后将不再担任公司任何职务。</p>\n  <p><strong>金价连跌，批发商集中补货</strong></p>\n  <p>自年初创下历史新高后，国际金价最近几天连续多个交易日持续下行，国内金饰价格也大幅下跌。工作日的下午3点，深圳水贝各大黄金柜台前依然聚集了不少消费者。央视财经记者走访中发现，对于有婚庆等刚需的消费者来说，金价下跌带来的吸引力尤为明显。多家门店销售人员表示，本周来水贝的消费者明显增加。随着金价回调，不少此前持观望态度的批发商也开始集中补货，采购活跃度明显回升。此外，在北京市西城区一家黄金销售门店，投资金柜台前人头攒动，金条的结账柜台前排起了长队。记者走访发现，近期，多数新增投资者主要看好金价未来走势与黄金长期投资价值，在金价回落时点选择逢低小额度购入。（央视财经）</p>\n  <p><strong>现代汽车工会称薪资谈判未达协议，25日将投票决定是否罢工</strong></p>\n  <p>据报道，现代汽车工会6月12日称薪资谈判未达成协议，将于25日投票决定是否罢工。（界面新闻）</p>\n  <h2><strong>上市进行时</strong></h2>\n  <p><strong>众擎机器人据悉将向港交所提交IPO申请</strong></p>\n  <p>众擎机器人据悉将向港交所提交IPO申请。（新浪财经）</p>\n  <p><strong>长鑫科技集团股份有限公司IPO审核状态变更为注册生效</strong></p>\n  <p>36氪获悉，据上交所官网显示，长鑫科技集团股份有限公司IPO审核状态变更为注册生效。</p>\n  <p><strong>沐曦股份：筹划发行H股股票并在香港联合交易所有限公司上市</strong></p>\n  <p>36氪获悉，沐曦股份公告，为满足公司业务发展的需要，进一步提升公司治理水平和核心竞争力，深入推进公司全球化战略，公司拟发行境外上市外资股（H股）股票并申请在香港联合交易所有限公司（以下简称“香港联交所”）主板挂牌上市（以下简称“本次发行并上市”或“本次发行”）。公司将充分考虑现有股东的利益和境内外资本市场的情况，在股东会决议有效期内（即自公司股东会审议通过之日起24个月内）或股东同意延长的其他期限内选择适当的时机和发行窗口完成本次发行并上市。</p>\n  <p><strong>江苏贝尔家居科技股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，江苏贝尔家居科技股份有限公司向港交所提交上市申请书。</p>\n  <h2><strong>投融资</strong></h2>\n  <p><strong>AI机器人企业Theker获路威酩轩等投资方8500万美元融资</strong></p>\n  <p>总部位于巴塞罗那的人工智能机器人企业Theker于6月11日宣布完成一轮总额8500万美元的融资。Theker表示，公司研发搭载人工智能技术的机器人，可在工业场景中完成各类作业。本轮融资由风投公司CRV领投，三星、路威酩轩集团等机构参与投资。（新浪财经）</p>\n  <p><strong>“力普司LiiPuS”连续完成种子轮及天使轮融资，总额达数千万元</strong></p>\n  <p>36氪获悉，“力普司LiiPuS”近期连续完成种子轮及天使轮融资，总额达数千万元。其中，种子轮由江苏金桥基金独家投资，天使轮由云时资本独家投资。本轮资金将主要用于高端船舶综合电力推进系统及产品的样机测试、持续改进及小批量交付，加速国产高端推进系统在港口拖轮、海工船、豪华游艇等场景的规模化应用。</p>\n  <p><strong>“星能玄光”连续完成A系列两轮融资</strong></p>\n  <p>36氪获悉，可控核聚变FRC技术路线企业“星能玄光”近日连续完成A系列两轮融资，金额五亿元，此次融资将用于继续提升和推进高性能FRC装置的参数。</p>\n  <p><strong>“碳生万物”完成A轮融资</strong></p>\n  <p>36氪获悉，据高榕创投消息，近日，“碳生万物”宣布完成A轮融资。本轮融资由黄河三角洲投资、高榕创投和博远资本共同领投，同时引入宁德时代、阳光电源、倚锋资本等新股东，多家老股东持续跟投。本轮融资资金将用于公司宁夏千吨级DAC（直接空气碳捕集）制备e-SAF（可持续航空燃油）项目建设、工艺放大、核心技术迭代及全球顶尖人才引进。</p>\n  <h2><strong>酷产品</strong></h2>\n  <p><strong>晶核能源发布全球首款专为机器人场景定制的高性能固态电池</strong></p>\n  <p>36氪获悉，近日，上海FINE 2026未来产业新材料博览会启幕，晶核能源携全球首款专为机器人场景定制的高性能固态电池首发，并获“2026固态电池领军金球奖”。</p>\n  <h2><strong>AI图谱</strong></h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>55岁的马斯克很缺钱？SpaceX上市背后的三个真相。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜Kris</p>", "category": "tech", "published_at": "2026-06-13T01:01:24+00:00", "fetched_at": "2026-06-13T02:56:54.598170+00:00", "fingerprint": "bba2eafb4452a7f5"}, {"source": "36氪 - 最新文章", "title": "SpaceX 2万亿美元市值这一夜，回望中国商业航天十年冷暖", "url": "https://36kr.com/p/3850902095336449?f=rss", "summary": "<p>6月12日晚，SpaceX以史上最大估值完成IPO，股价冲高至176美元，截至目前市值已经突破2万亿美元。 马斯克成为历史上第一位万亿美元身价的富豪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_3e347a3fd2bf4c729355071525e08d5c@5920579_oswg57991oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">马斯克在得克萨斯“星际基地”（Starbase）敲钟</p>\n  <p>其实在SpaceX敲钟之前，大洋彼岸的行业水温早已接近沸腾。</p>\n  <p><strong>过去半年，商业航天成为国内一级市场最热的赛道之一。</strong>投资人排队约见创始人，地方政府争抢项目落地，一些过去很少关注航天的基金，也开始研究火箭、卫星和星座。<strong>“头部项目现在整个市场有几百家机构在跟，根本聊不上。”</strong>一位长期关注商业航天的投资人告诉硬氪。</p>\n  <p>资本涌入的速度和规模都在刷新纪录，头部公司融资金额动辄20亿元以上。<strong>最大的一笔是2026年2月星际荣耀的D++轮，金额超过50亿元。</strong></p>\n  <p>热度并非毫无根基。<strong>从2014年政策破冰，到2025年IPO大门开启，中国商业航天恰好走完一个十年周期。</strong></p>\n  <p>十年中，失望和寒冬几乎是常态，偶尔的回温也转瞬即逝。火箭太贵，周期太长，商业闭环迟迟没有出现。投进去的钱短期内看不到结果，“一级市场投不动了”。</p>\n  <p><strong>但2026年，市场的情绪彻底扭转。</strong>SpaceX的IPO证明这个赛道的价值，中国上市通道打开，愿景有了兑现的清晰路径。<strong>“很兴奋。有退出通道，我们才更有动力持续投入；有上市公司，才能带动整个产业。”一位投资人表示。</strong></p>\n  <p>更何况，他们有信心：中国公司即便达不到SpaceX的程度，也能有相当丰厚的回报。</p>\n  <p><strong>他们并非盲目乐观。</strong>过去十年，我们可以看到中国商业航天公司从凑不齐发动机，一步步走到火箭升空。这群人中找不出马斯克，但因为有庞大的制造业托底，有政策扶持，铺路的动作从未停止。</p>\n  <p>或许，中国公司真的能摸索出和SpaceX不同的道路。<strong>“美国有一家Tesla，中国有比亚迪、吉利、长城、奇瑞和蔚小理；美国有一家SpaceX，中国商业航天未必只有一个赢家。”一位投资人表示。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_7d925194f93446ef8a6c74d52d1c1fc7@5920579_oswg4040oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>从PPT，到火箭升空</strong></p>\n  <p>中国的商业航天产业和SpaceX类似，都由体系垄断一步步走向市场。</p>\n  <p>长期关注商业航天的人，仍记得2015年前后SpaceX带给行业的震撼。大西洋上的回收驳船一次次等待火箭归来，火箭一次次坠海、爆炸、解体，又一次次重新起飞。每一次失败，都在为可重复使用积累数据。</p>\n  <p><strong>“那时候大家意识到，把航天看作一个高大上的产业没有意义了，人家已经快用工业化逻辑把这件事做成了。”</strong>一位从业多年的商业航天人士回忆。</p>\n  <p><strong>所谓用工业化逻辑重做航天，核心是成本与效率。</strong>传统航天是国家工程，强调极致可靠，用最高等级的宇航级器件，不计成本地追求成功率；商业航天则大量使用经过验证的工业级产品，靠缩短研发周期、优化供应链来压成本。这条路被SpaceX验证过，也在近地轨道的应用环境里逐渐成为行业共识。</p>\n  <p><strong>中国的拐点出现在2014年。</strong>国务院发布《关于创新重点领域投融资机制鼓励社会投资的指导意见》，首次明确鼓励社会资本进入航天领域。随后，一批来自航天科技集团、航天科工集团、中科院体系的技术人员离开体制，创办了中国第一批商业航天企业。</p>\n  <p><strong>“刚开始其实什么都没有，就是一群人画PPT。”</strong>上述人士向硬氪回忆。那时的中国商业航天更像一个概念，真正愿意下注的资金，大多来自中科院体系、地方产业基金这类带着战略布局属性的机构。</p>\n  <p>2015年12月21日，猎鹰9号一级火箭在卡纳维拉尔陆地着陆场回收成功，人类首次实现轨道级火箭垂直回收，可复用火箭从理论走向现实。此后几年，SpaceX快速迭代，星链开始规模化组网，一个全新的产业样本摆在全球面前。<strong>市场化基金开始探讨一个故事：中国能不能拥有自己的SpaceX。</strong></p>\n  <p>但当时这件事遥不可及。<strong>“刚开始去尽调的时候我们很惊讶。”</strong>一位市场化基金投资人回忆，<strong>“大家都说是民营商业航天，但很多核心零部件还得进口，创业公司甚至拿不到体制内单位的供货。”</strong></p>\n  <p><strong>很长一段时间，国内不存在真正意义上的民营航天供应链</strong>。发动机、伺服机构、特种材料、电子系统等关键环节大多掌握在体制内单位手中，有限的产能要优先保障国家任务，民营企业很难拿到供货。</p>\n  <p>“2016年前后，我们只能做固体火箭，本质上是把成熟导弹技术改造成运载火箭。但很多关键部件也买不到，拼不齐一个火箭。即便能买到，也非常贵。”大航跃迁创始人陈曙光回忆。</p>\n  <p><strong>这意味着，资本投下去，并不能立刻变成产品。整个行业要从零搭建基础设施。</strong></p>\n  <p>2017年前后，行业出现松动。部分航天科技、航天科工及军工集团开始向民营企业开放部分资源。能买到的仍以探空火箭部件为主，但商业航天企业至少有了从验证走���实践的机会。</p>\n  <p>2018年因此成为中国民营商业火箭元年。这一年，星际荣耀、零壹空间、蓝箭航天三家民营企业集中完成4次亚轨道火箭发射和1次运载火箭首飞试验。</p>\n  <p><strong>但这种尝试没办法变成持续、标准化的生产。最终给行业按下加速键的，仍是国家队。</strong>2023年，中国星网启动全产业链大规模招标，拉通整条供应链，给民营航天企业提供了入场机会。</p>\n  <p><strong>对长期缺乏需求牵引的商业航天来说，这是标志性事件。</strong>“<strong>星网和垣信出来之后，两大星座规划规模接近3万颗卫星，真正拉动了一级市场和产业链的变化。</strong>”一位长期关注行业的投资人表示。</p>\n  <p>同一时间，火箭侧独立的发动机供应商、伺服机构、贮箱等核心部件供应商也相继出现，火箭关键系统的成本持续下降。陈曙光回忆，<strong>2023年调研行业时，“全箭90%以上的零部件、90%以上的价值量，都已经可以在民营体系内完成。”</strong></p>\n  <p>商业航天的核心，是让市场的事归于市场。<strong>“长远来看，天上一定会有上万颗卫星。如果还像前十年一样用半商业化的逻辑去做，成本根本降不下来。”</strong>一位卫星领域从业者表示，<strong>“未来十年，供应链进一步工业化是大势所趋。”</strong></p>\n  <p>从体系内走向体系外，商业航天不再是PPT上的故事，变成了发射场上的轰鸣。</p>\n  <p>接下来的问题是：到底怎么挣钱？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_a812782c681244e8900c8fd59bbf7b30@5920579_oswg4703oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>商业航天离挣钱有多远？</strong></p>\n  <p>中国商业航天公司可以靠市场力量造出火箭，但还无法自我造血。</p>\n  <p><strong>航天商业化有一条环环相扣的逻辑链：</strong>火箭可回收降低发射成本，发射成本下降推动卫星盈利，卫星盈利后才能继续组网、持续购买发射服务，最终形成闭环。这就是SpaceX今天的运营逻辑。</p>\n  <p><strong>闭环的第一步，是火箭可回收。</strong></p>\n  <p>可回收要求火箭的一子级在返回大气层时能够精准控制姿态、保证稳定并且精准定点着陆，这对火箭的整体稳定性与控制能力提出了更高要求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_0a4f1f1d9d42496484d1f31e6bd6015d@5920579_oswg452634oswg832oswg524_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">火箭一子级（图源/蓝箭航天官网）</p>\n  <p>具体在发动机层面，固体发动机是天然一次性的，液体发动机才能支撑更大的运载能力，也是重复使用的基础。</p>\n  <p>现代运载火箭多采用发动机并联布局，即多个发动机一起工作。并联更少的台数，能够降低系统复杂度、提升整体可靠性，同时减少综合成本。要做到少并联，必须提高单台发动机的推力。</p>\n  <p>目前，国内较为成熟的单台液体发动机推力为80吨级和120吨级。对比来看，成功回收的SpaceX猎鹰系列，单台发动机推力超过200吨。</p>\n  <p><strong>看起来只是数字的差距，背后是完全不同的工程难度。</strong>推力提升后，燃烧室内的温度、压力和燃气流速都会逼近极限，燃烧室、喷管、涡轮泵长期处在高温高压下，容易烧蚀、变形、疲劳，对材料、工艺和冷却设计的要求成倍增加。</p>\n  <p>“现在让很多公司设计200吨级的发动机，图纸都能画出来。但流量放大以后，整个系统都要重构，发动机、管路、控制、结构全部要重新协同。<strong>这本质上是一个超级工程。</strong>”一位火箭发动机从业者告诉硬氪。</p>\n  <p><strong>无法实现可回收，就无法控制发射成本</strong>。“现在大家诟病商业航天不挣钱，原因很简单：花得太多。花得最多的地方就是发射。”一位前商业卫星公司从业者表示。</p>\n  <p>如今，猎鹰9号的发射成本已降至每公斤数千美元。按马斯克的设想，如果星舰实现完全重复使用，未来有机会进入每公斤数百美元的时代。相比之下，国内不同型号火箭虽有差异，平均发射成本普遍在每公斤6万到7万元人民币。</p>\n  <p><strong>很多商业卫星公司规划了大量卫星，却用不起火箭。“大家都是咬着牙往天上打，也知道自己某种程度上是在给火箭公司打工。”上述人士表示。</strong>业内普遍认为，如果可回收技术把成本降到每公斤3万元以下，卫星发射需求会迎来明显释放。</p>\n  <p><strong>而卫星需求释放，仍不等于商业闭环。</strong></p>\n  <p>SpaceX的特殊之处，在于它同时拥有火箭发射、卫星制造和Starlink运营体系，靠垂直整合形成完整闭环。</p>\n  <p>中国商业航天的路径更像一个产业集群：火箭公司、卫星公司、运营商、材料和零部件企业各自成长，再靠协同构建生态。<strong>这种模式能发挥中国制造的体系优势，也意味着链条更长、参与方更多，闭环更难形成。</strong></p>\n  <p><strong>即便未来可回收成熟、发射成本下降，产业链还要跨过下一道门槛：卫星怎么赚钱。</strong>发射成本下降只是降低了入轨的门票价格，并不直接创造收入。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_f15640a9b98a4a07a7353e988d654d9f@5920579_oswg703275oswg859oswg537_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">卫星互联网概念图 （图源/视觉中国）</p>\n  <p>Starlink的用户来自全球160多个国家和地区，年收入已达114亿美元。那么，中国的卫星要为谁服务？又有谁来买单？</p>\n  <p>如果只做国内市场，中国的地面通信网络已经高度发达，对卫星直连的需求没有那么迫切，很难长期撑起整个产业链。</p>\n  <p>因此，不少业内人士认为，<strong>中国商业航天最终要走向全球市场，和SpaceX在同一个盘子里分蛋糕。</strong></p>\n  <p>“像印度尼西亚这样的岛国，建地面通信网络成本很高，卫星互联网的优势就非常明显。中国星座未来想实现商业化，最终还是要出海。<strong>而到那时，要直面的竞争对手就是Starlink。”</strong>一位卫星领域从业者表示。</p>\n  <p>不过，现在谈全球竞争还太早。对中国商业航天而言，低成本发射这个前提还没有完成。<strong>这个行业依然需要大量的资金、时间和耐心。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_7f8a98e0575942a080a5374bb37a684d@5920579_oswg4962oswg900oswg145_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>IPO，下一程长跑的起点</strong></p>\n  <p>商业航天公司能上市是个分水岭，当自己无法盈利时，它们也可以撬动更充裕的资金。</p>\n  <p>这一步来得艰难。</p>\n  <p>如果按商业航天行业自身的发展节奏和过去的上市要求，IPO可能还要等很多年。</p>\n  <p><strong>但紧迫性变了。</strong></p>\n  <p>2022年，俄乌冲突期间，传统地面通信网络大面积受损，Starlink大规模参与战场通信保障。<strong>卫星互联网的意义，从商业基础设施上升为战略基础设施。</strong>Starlink还和美国政府合作，推出专门为军方设计的“星盾”服务。</p>\n  <p><strong>与此同时，近地轨道和无线电频率资源是有限的，总共只开放6–10 万颗。但Starlink一家就号称要部署4.2万颗。</strong>国际电信联盟的频轨申报遵循先到先得，留给后来者的窗口在迅速缩小。</p>\n  <p><strong>参与者们必须加速，抢占资源。</strong></p>\n  <p>首先就是打开融资渠道。2025年，商业航天与卫星互联网被纳入“十五五”规划重点方向；同年12月26日，上交所发布商业火箭企业科创板上市指引，明确采用可重复使用技术的中大型运载火箭企业可适用相关上市标准。</p>\n  <p><strong>“一级市场不可能无限输血，而国家战略上又不能没有这个行业。”一位投资人表示，“让二级市场加入，助力产业发展，这某种程度上也是科创板设立的意义。”</strong></p>\n  <p>大型液体火箭的研发和卫星工厂的建设动辄数亿元，一型火箭从立项到首飞往往要数年，绝大多数企业还在持续投入、持续亏损。“如果这个阶段无法上市，头部几家企业的资金也很紧张。”</p>\n  <p><strong>除了解绑二级市场，政府层面也会提供更多燃料。</strong></p>\n  <p>几乎上交所发布指引的同一时间，中国向国际电信联盟新增提交20.3万颗卫星对应的频率与轨道资源申请，创下国内单次申报规模纪录。</p>\n  <p>这场大规模申报，像一场面向未来十年的产业总动员：国家级商业航天引导基金落地，北京、上海、广东、安徽等地设立百亿级产业基金，地方政府用财政补贴、税收优惠吸引项目落地。</p>\n  <p><strong>正如关注商业航天的投资人常说一句话：想象空间很大。</strong>至少从国家层面看，这是必须押注的产业。</p>\n  <p><strong>“今天很多商业航天公司的规模并不大，没发多少东西。”一位投资人表示，“但市场看的不是现在，而是未来。基础设施建成以后，这会是一个完全不同量级的市场。”</strong></p>\n  <p>如果按SpaceX描绘的路线图，可回收火箭大幅降低发射成本、数以万计的卫星完成组网，这只是第一步——铺路。路铺好之后，太空算力、太空旅行、深空探索才成为可能。</p>\n  <p><strong>无论对国家还是参与其中的人，追逐的都不是火箭和卫星本身，而是一个新的太空时代。</strong>它超越当下的生活，代表某种更宏伟的终极梦想，支撑起了SpaceX万亿美金市值。“我们对这个世界必须抱有希望，必须有能够振奋人心的东西。”</p>", "category": "tech", "published_at": "2026-06-13T01:02:18+00:00", "fetched_at": "2026-06-13T02:56:54.598163+00:00", "fingerprint": "87c83f9dbd83833c"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 核心材料成本降至进口材料五分之一，电致变色技术厂商获投，车规级产线建设中", "url": "https://36kr.com/p/3850904887268611?f=rss", "summary": "<p>硬氪获悉，中科电墨近日完成数千万元Pre-A轮融资，由西安龙鼎投资独家投资。本轮融资将主要用于车规级电致变色产线建设、核心材料研发迭代以及汽车领域市场拓展。</p>\n  <p>伴随新能源汽车向智能化、舒适化方向升级，汽车玻璃正从传统结构件逐步演变为集隔热、防晒、隐私保护和交互体验于一体的功能件。尤其是全景天幕快速普及后，调光玻璃开始成为车企提升产品差异化的重要配置之一。</p>\n  <p>目前市场主流调光技术主要包括PDLC（液晶调光）、SPD（悬浮粒子调光）以及EC（电致变色）三种路线。PDLC和SPD主要依靠光散射实现遮蔽效果，普遍存在雾度较高、隔热能力有限、驱动电压较高等问题。而电致变色技术则通过材料发生氧化还原反应，实现玻璃透光率变化，不仅能够实现连续调光，同时具备低雾度、低能耗以及隔绝红外热辐射等优势，被认为是下一代智能玻璃的重要技术路线之一。</p>\n  <p>中科电墨成立于2023年，专注于电致变色核心材料及器件研发。公司首席科学家马明明博士长期从事导电高分子材料研究，于2017年成功研发出相关核心材料体系。通过引入自主设计的导电聚合物材料，中科电墨突破了长期由海外企业主导的关键材料环节，在性能提升的同时显著降低成本。</p>\n  <p><strong>据张莹介绍，目前国际市场高端电致变色导电聚合物材料主要由少数海外企业供应，而中科电墨已实现自主可控，核心材料售价仅为国际同类产品的约五分之一。</strong></p>\n  <p>此外，中科电墨的电致变色产品可实现99%以上紫外线阻隔和99%以上红外线阻隔，并满足汽车15年以上服役寿命要求。响应速度方面，同等尺寸汽车天幕从透明态到深色态的变色时间可缩短至90秒以内，而目前部分量产产品完成同样过程通常需要数分钟。同时，其驱动电压仅需约±1.5V，仅相当于一枚纽扣电池的供电水平，相较部分需要数十伏驱动电压的调光方案，可显著降低整车能耗负担。</p>\n  <p>除了材料创新，中科电墨还在制造工艺上进行了系统优化。</p>\n  <p>传统电致变色产品多采用磁控溅射等工艺路线，设备投入高、生产效率有限，且难以兼顾大尺寸产品制造。中科电墨则开发了卷对卷涂布结合连续真空镀膜的一体化生产工艺，将行业平均良率由约70%提升至92%以上，同时实现综合制造成本下降近30%。</p>\n  <p>商业化方面，汽车是公司当前最重要的战略方向。</p>\n  <p>据介绍，中科电墨已与国内头部车企、新势力品牌以及国际产业链企业展开合作。目前，中科电墨正在浙江嘉兴建设首条车规级智能化柔性产线。一期项目总投资约4000万元，规划年产能约60余万平方米，可满足1至2款车型量产需求。未来三期项目总投资将超过1亿元，并具备天幕、侧窗及光学镜片等多品类产品柔性切换能力。</p>\n  <p>公司预计，随着车规级产线建设完成，汽车业务将在2027年进入规模化量产阶段。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_28fa5f43fba54b9fa4ddd7b92dce257a@5920579_oswg179774oswg629oswg354_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>与此同时，公司也在建筑、消费电子以及特种装备领域同步布局。其中，在建筑领域正参与标杆项目建设及行业标准相关工作；在消费电子领域，公司正推动电致变色技术向AR眼镜、智能眼镜、骑行镜及智能头盔等产品拓展；在特种装备领域，其电致变色膜产品已实现相关应用落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260613/v2_bf96e0d2667d4a2985ba6461eb7deef5@5920579_oswg153590oswg567oswg379_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>以下为硬氪与中科电墨创始人张莹交流节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：公司的核心竞争力更多来自工艺还是材料？</strong></p>\n  <p><strong>张莹：</strong>材料是最核心的竞争力。我们的首席科学家长期从事导电高分子材料研究，在这一领域积累超过二十年。电致变色本质上是材料科学问题，材料决定了产品的寿命、响应速度、颜色表现以及隔热性能。</p>\n  <p>基于自主研发的导电聚合物体系，我们不仅能够实现99%以上紫外线阻隔和99%以上红外线阻隔，还能够根据客户需求设计不同颜色体系。例如未来汽车出厂时就可以搭载与车身同色的电致变色玻璃，实现从深色到透明的动态变化。此外，</p>\n  <p>此外，我们的核心材料成本仅为国际同类产品的约五分之一，在保证性能的同时显著降低了产业化门槛，具有很大的成本优势。</p>\n  <p><strong>硬氪：目前公司的商业化进展如何？</strong></p>\n  <p><strong>张莹：</strong>汽车是我们最重点布局的市场。目前我们已经与国内车企、新势力品牌以及国际产业链伙伴展开合作，部分项目已经进入样车验证阶段。由于此前没有自有车规级产线，相关产品主要通过合作工厂完成验证，因此当前最大的挑战其实是产能建设。今年我们正在嘉兴建设首条车规级柔性智能产线，并同步按照主机厂审厂标准推进建设，希望在产线建成后能够快速进入量产阶段。</p>\n  <p>除汽车外，我们也在建筑、消费电子和特种装备领域推进落地。例如建筑领域的智能调光幕墙、AR眼镜和智能眼镜等消费电子产品，以及部分特种装备应用场景。预计今年消费电子等业务将贡献近两千万元收入，汽车业务有望在2027年开始形成规模化营收。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>龙鼎投资赵聪先生表示：</strong>电致变色材料是智能调光领域的核心技术，市场空间广阔且符合国家新材料国产化战略。中科电墨团队拥有深厚的技术积累与产业化经验，自主研发的EC技术路线在性能与成本上具备显著竞争优势，商业化落地进度领先行业。我们看好公司在智能汽车、绿色建筑等场景的爆发潜力，未来将充分发挥自身产业链资源与资本赋能优势，在技术研发、产能建设、市场拓展、战略规划等方面提供全方位支持，助力中科电墨快速成长为全球领先的电致变色材料企业。</p>", "category": "tech", "published_at": "2026-06-13T01:04:10+00:00", "fetched_at": "2026-06-13T02:56:54.598150+00:00", "fingerprint": "7951834d79930bf7"}, {"source": "少数派", "title": "WWDC 26 发布会上，Apple 没告诉你的那些事", "url": "https://sspai.com/post/110967", "summary": "除了大谈特谈的 AI，今年的 WWDC 开幕式上还有这些有趣的细节值得注意。<a href=\"https://sspai.com/post/110967\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T03:40:54+00:00", "fetched_at": "2026-06-13T02:56:52.789194+00:00", "fingerprint": "ebf1f52f50bcf284"}, {"source": "少数派", "title": "把 AI 装进口袋，然后把它忘掉：\nYoooClaw C·ONE 智能硬件一个月使用体验", "url": "https://sspai.com/post/110914", "summary": "拿到YoooClawC·ONE，还没拆箱的第一印象是：这也太小了吧，包装盒都比我想象中小了好几倍。打开后，发现C·ONE是一张信用卡大小的紫色超薄哑光卡片，没有屏幕、只有一个长条LED呼吸灯和一个按键 ...<a href=\"https://sspai.com/post/110914\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T06:42:07+00:00", "fetched_at": "2026-06-13T02:56:52.789189+00:00", "fingerprint": "bb3b00d68de46eca"}, {"source": "少数派", "title": "Level Read：让英语学习从「读得懂」开始，每天都进步一点点", "url": "https://sspai.com/post/110329", "summary": "你不需要一开始就读最难的内容，不需要把英语变成一件很痛苦的任务。每天读一篇适合自己难度的英文新闻，听一听、查几个词、慢慢积累。<a href=\"https://sspai.com/post/110329\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-12T07:00:00+00:00", "fetched_at": "2026-06-13T02:56:52.789184+00:00", "fingerprint": "ab6f9ed0f64c521f"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 10 部作品", "url": "https://sspai.com/post/110992", "summary": "📅本周新预告《攻壳机动队THEGHOSTINTHESHELL》新预告6月11日，TV动画《攻壳机动队THEGHOSTINTHESHELL》发布了新预告，将于7月7日开始播出。木村翔马执导，圆城塔编剧， ...<a href=\"https://sspai.com/post/110992\" target=\"_blank\">查看全文</a>", "category": "tech", "publi y 5X采用双串翼式布局与航空级碳纤维机身。由于其基于地效原理运行，飞行高度保持在距水面30至80厘米的低空，能够直接在开阔水面起降，无需专用跑道、机场和繁琐的飞行审批。在性能参数方面，该飞行器最高时速为85公里，最大载重140公斤，续航里程达80公里。机身搭载模块化快换电池，单次续航最长为70分钟。</p>\n  <p>对于非专业用户而言，WaveFly 5X的核心在于安全和操控的轻量化。由于近水飞行的地效特性，产品规避了传统航空器高空坠落的风险；同时，整机仪表盘被大幅精简，全流程操控被集成在单手摇杆上，用户无需考取专业航空驾照，经过短期培训即可上手。发布会现场，坦途科技已与美澳等地区合作伙伴签署了首批代理意向书。</p>\n  <p>水上飞行器的研发并非孤立进���。自2021年创立以来，坦途科技已在两轮短交通领域积累了近500项专利申报。其电动滑板车业务已在全球60多个国家和地区铺开，已搭建了通勤、越野、旗舰三大产品序列。滑板车研发中所积累的电池、电机和电控等工程经验，后续被系统性地复用到了智能电助力自行车产品线上，推出了面向城市通勤的高性能Speed&nbsp;Pedelec SP01和越野玩乐的Storm X Pro。</p>\n  <p>通过滑板车和E-bike的技术外溢，坦途科技正在将产品线向更广泛的户外出行周边渗透。除两轮工具外，其展出的硬件还包括搭载UWB跟随技术的Birdie系列高尔夫球包车、E-WAGON 4X-LITE电动露营车，以及辅助行走的机械外骨骼装备。</p>\n  <p>随着WaveFly 5X的正式亮相，坦途科技（NAVEE）实现了地面与水域、短途通勤与户外探索的场景融合。这款消费级产品的推出，在一定程度上回应了低空经济从概念走向实际落地的行业命题，也反映出该品牌推动智能户外出行从工具属性向生活方式演进的全球化产品企图。</p>", "category": "tech", "published_at": "2026-06-11T07:53:52+00:00", "fetched_at": "2026-06-12T03:32:01.482300+00:00", "fingerprint": "9e7212167e6bcb94"}, {"source": "36氪 - 最新文章", "title": "ChinaJoy最硬核的区域，36氪与你共同探索 | Vision Future前沿科技展区 × 36氪直播间开启预约", "url": "https://36kr.com/p/3848564910036229?f=rss", "summary": "<p>两个月后，<strong>ChinaJoy即将在上海浦东举办，这里又会挤满全国最爱玩、最关注前沿科技的年轻人。</strong></p>\n  <p>作为国内延续二十年的数字娱乐展会，ChinaJoy早已不只是玩家试玩新游戏的狂欢，它已经变成整个科技+数字娱乐行业一年一度的线下交汇点——这里有最新的产品、最先锋的趋势，更聚集了一群想改变行业的年轻人和创业者，在这里你能摸到这个行业最真实的脉搏。</p>\n  <p><strong>作为ChinaJoy Vision Future 前沿科技展区的战略合作伙伴，以及ChinaJoy AI未来生态大会的战略合作伙伴，36氪游戏与ChinaJoy 联合打造「ChinaJoy Vision Future 前沿科技展区 × 36氪直播间」，将一线报道的质感和信息密度直接带给观众。</strong></p>\n  <p>过去三年，科技对数字娱乐的改造速度超过了所有人的预期，AI从实验室概念变成了行业标配的生产工具，具身智能、新一代消费电子不断打开新的想象空间，整个赛道每天都有新公司、新产品、新模式冒出来，很多变化都发生在一线，只看线上通稿你根本摸不到真实的行业温度。</p>\n  <p>而变化也正在发生：刚刚结束的谷歌I/O大会上，谷歌发布Gemini Omni世界模型，直接把目标瞄准了\"生成符合物理规则的游戏开放世界内容\"；全球最大UGC游戏平台Roblox今年开放全平台AI生成工具后，目前平台超过三成的新增用户内容已经由AI生成。科技对数字娱乐的改造，早就不是概念，已经落到了每天的生产环节里。</p>\n  <p>36氪游戏从一开始就定位于「科技+数字娱乐」的交叉赛道，我们长期关注技术给游戏、数字娱乐、消费电子带来的真实改变，从AI生成内容进入游戏开发，到具身智能在娱乐场景落地，每一个新趋势出现的时候，我们都第一时间在一线报道。</p>\n  <p>这一次，<strong>36氪与ChinaJoy Vision Future前沿科技展区深度合作</strong>，将直播间直接搬到展区现场。<strong>7月31日到8月2日，我们将邀请18组嘉宾坐到镜头前，面对面聊聊科技到底给数字娱乐带来了哪些真变化。</strong></p>\n  <h3><strong>我们聊什么？聚焦「科技+数字娱乐」真问题</strong></h3>\n  <p>这次我们不聊空话，只聊一线真问题，核心话题覆盖：</p>\n  <ul>\n   <li><strong>AI+游戏</strong>：AI生成内容真的改变开发流程了吗？中小团队能靠AI追上大厂吗？世界模型能给开放世界开发降本多少？</li>\n   <li><strong>具身智能×数字娱乐</strong>：消费级具身智能产品离普通人还有多远？机器人能走进娱乐消费场景吗？</li>\n   <li><strong>新一代消费电子</strong>：AI眼镜、VR/AR这些新产品，真的能重构娱乐体验吗？</li>\n   <li><strong>新内容新商业模式</strong>：AI短剧、AI直播、AIGC营销，这些新方向真的跑出可持续的商业模式了吗？</li>\n  </ul>\n  <p>所有对谈都来自一线从业者，我们请来创业者、技术带头人、行业操盘手，坐到镜头前聊真实进展、踩过的坑、接下来的机会，给你呈现最鲜活的行业趋势。</p>\n  <p>目前我们正在定向邀请一批行业头部嘉宾和领先项目，现在还留出少量席位，面向优秀创业者、前沿项目和关注「科技+数字娱乐」领域的合作伙伴开放。</p>\n  <p><strong>如果你正在科技+数字娱乐赛道探索，认同我们对行业的判断，想在ChinaJoy Vision Future前沿科技展区现场面对全国行业观众分享你的产品、思考和判断，欢迎联系我们对接直播间席位。</strong></p>\n  <p><strong>同时，ChinaJoy Vision Future前沿科技展区展位正在火热招商中。</strong>&nbsp;展区聚焦AI、具身智能、新一代消费电子等前沿科技在数字娱乐领域的创新应用，是ChinaJoy最具科技含量的核心展区之一。欢迎科技企业、创新项目入驻前沿科技展区，与36氪直播间形成线上线下联动曝光。</p>\n  <p>我们欢迎所有符合主题的项目：不管你是AI游戏创业团队，还是做具身智能消费电子，或是在数字娱乐科技方向有新探索，都可以对接。</p>\n  <h2><strong>写在最后</strong></h2>\n  <p>这几年科技+数字娱乐的变化太快了，很多真实的行业趋势都在一线现场，藏在从业者面对面的聊天里，而不是PPT上。</p>\n  <p><strong>ChinaJoy Vision Future前沿科技展区 × 36氪直播间</strong>，就是想把这些一线的思考直接带给你——三天18场对谈，和18组真正在干的从业者聊聊，给你呈现科技+数字娱乐最真实的现在和未来。</p>\n  <p>2026年7月31日-8月2日，上海新国际博览中心E6馆ChinaJoy Vision Future前沿科技展区，我们直播间见。</p>\n  <h4><strong>对接联系方式：</strong></h4>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260611/v2_6423823d96fa4b769f925beeeb209c8a@16519798_oswg100259oswg818oswg1215_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码了解</p>\n  <p><strong>或发送资料至邮箱：guopengchao@36kr.com</strong></p>", "category": "tech", "published_at": "2026-06-11T09:24:11+00:00", "fetched_at": "2026-06-12T03:32:01.482294+00:00", "fingerprint": "d0a6f60d541129d6"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜百万Token只要几块钱，算力价格还在往下降；OpenAI正考虑大幅下调产品价格；今起儿童旅客可购买铁路旅游计次票，票价为成人旅客的5折", "url": "https://36kr.com/p/3848516305605892?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848492224681223\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>克里斯蒂安·斯坦出任雷诺集团西班牙首席执行官</strong></a></p>\n  <p>7月1日起，克里斯蒂安·斯坦（Christian Stein）将接替何塞·马雷亚·里卡森（Josep María Recasens）, 出任雷诺集团西班牙新任首席执行官。何塞·马雷亚·里卡森将离开雷诺集团，寻求新的职业发展。克里斯蒂安·斯坦将在担任该新职务的同时，继续兼任雷诺集团首席传播官，并向雷诺集团首席执行官福兰（François Provost）汇报。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848022152401920\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>通用或停止将磷酸铁锂电池用于电动汽车</strong></a></p>\n  <p>通用汽车电池技术负责人表示，该公司可能会放弃使用低成本的铁基电池技术，而许多汽车制造商正在使用这种技术来降低电动汽车的成本。这家底特律汽车制造商此前曾表示，计划开发磷酸铁锂（LFP）电池，用于未来的电动汽车车型，并计划于2027年底在田纳西州一家合资工厂开始生产这种电池。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848509811250435\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</strong></a></p>\n  <p>数据显示，全球两大预测市场平台（Polymarket和Kalshi）针对本届世界杯冠军归属的事件合约成交额，已超过了20亿美元。这使得该事件有望刷新单项预测市场合约的成交纪录。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848456795542785\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>百万Token只要几块钱，算力价格还在往下降</strong></a></p>\n  <p>在一家算力超市了解到，他们目前提供两种类型产品，一种是针对算力的产品，一种是针对大模型Token的产品，两种产品采用不同的计费模式。负责人介绍：“算力租赁的产品，一张卡一小时是一种计费方式。第二种是包年包月，就是按Token计费，根据不同的模型，一般都是以百万Token为单位，百万Token大概是几块钱。按照现在的趋势来看，价格还在往下降。”据悉，这个算力超市的算力来自多个渠道，用户选好产品，超市负责匹配、调度和交付。此外，这家算力超市的负责人表示，目前他们服务的用户80%都是中小企业，覆盖了教科文、电商、人工智能、机器人、具身智能等多个传统和新兴行业。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848443731612929\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</strong></a></p>\n  <p>为从竞争对手Anthropic手中争夺客户，OpenAI正考虑大幅下调面向用户的收费标准。据知情人士透露，该公司计划大幅下调代币计费单价——代币是人工智能企业核算产品费用的计量单位。此举意在应对Anthropic预计也会推出的降价举措。目前，企业高管已开始对高昂的AI使用成本感到抵触。OpenAI首席执行官山姆・奥尔特曼在近期一场活动中坦言，成本问题已成为一大难题。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848307627136005\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>极兔回应被立案调查：高度重视，全面整改</strong></a></p>\n  <p>关于国家邮政局依法对极兔速递有限公司立案调查一事，极兔回应：极兔速递中国区高度重视，诚恳接受，坚决服从、全力配合主管部门依法依规开展的各项调查工作。极兔方面强调，安全生产是企业不可逾越的红线。极兔中国对照关于安全生产的重要指示深刻反思，深感作为品牌总部，在对使用“极兔速递”商标、字号、快递运单经营的部分企业落实安全保障统一管理责任方面存在差距和不足，教训深刻。对此，极兔中国诚恳接受监督。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848228866544903\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>速卖通欧美拉5国上线官方配送服务</strong></a></p>\n  <p>36氪获悉，阿里旗下跨境电商平台速卖通AliExpress近期在美国、波兰、法国、西班牙、墨西哥五国上线官方本地配送服务，覆盖欧洲、北美、拉美三大经济圈。据了解，商家加入后，可依托海外仓实现更稳定、更低成本的\"本地发货、本地配送\"。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848340680414467\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>影石发布全球首款8K徕卡双摄云台相机 Luna Ultra</strong></a></p>\n  <p>6月10日，智能影像品牌影石Insta360正式推出行业首款旗舰双摄云台相机Luna Ultra，3999元起售。据介绍，Luna Ultra是影石与徕卡联合研发的8K旗舰影像云台相机，首次将双徕卡Summicron光学镜头、8K杜比视界、专业级10bit I-Log融为一体，达成1-12倍黄金5焦段覆盖，覆盖旅行、日常Vlog、专业影像记录等多种场景。多个电商平台数据显示，该产品上架几分钟内即宣告售罄。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848442560599301\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>德国机器人公司Neura Robotics完成14亿美元融资，获亚马逊、英伟达等多方支持</strong></a></p>\n  <p>6月10日，德国机器人公司Neura Robotics宣布完成创纪录的C轮融资，本轮总规模最高可达14亿美元，旨在加速构建全球领先的物理人工智能平台。此轮融资获得了亚马逊、英伟达和欧洲投资银行等多方支持。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848497553609735\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>贵州茅台董事长陈华：价格不能出现大起大落，大家不传谣、不信谣</strong></a></p>\n  <p>6月11日下午，贵州茅台2025年度股东会在茅台会议中心召开，来自全国千余名茅台股东、机构投资者与分析师齐聚茅台镇。针对茅台酒价格问题，茅台集团董事长陈华表示，将随行就市，相对平稳，价格不能出现大起大落，供需适配、量价平衡。目前，茅台酒价格调整社会高度关注，公司对此高度保密，网上流传有各种信息，大家不传谣、不信谣。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3848387791099141\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>特朗普：很快将与顶尖的人工智能公司高管会面，讨论如何回馈公众</strong></a></p>\n  <p>美国总统特朗普周三再次表示，希望顶尖的人工智能公司同意回馈公众，暗示美国政府可能持有这些公司的股份。特朗普称，自己很快将与行业顶尖的12或15名高管会面，讨论如何回馈公众，公众将因此变得非常富有，他认为行业高管们会同意这样做，且这一做法将非常受欢迎。上周五，特朗普首次公开表示，希望与人工智能公司会面，讨论让美国政府持有其公司股份的可能性，这些股份带来的收益未来可以分配给美国公众。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3848134762697730\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>今起儿童旅客可购买铁路旅游计次票，票价为成人旅客的5折</strong></a></p>\n  <p>今天起儿童旅客可购买铁路旅游计次票，并享受儿童优惠票政策，亲子、家庭���游出行更加便捷实惠。此次推出的儿童旅游计次票是在既有成人旅游计次票基础上优化升级的服务产品。2023年6月开始实行的铁路旅游计次票产品，主要面向成人旅客发售，按照“1次购买、分段乘坐、15天有效”的模式运行，购票人可在指定的车站间自主选择2至10段行程出行，每段行程单次、单向、指定席别，票价均享受不同幅度的折扣优惠，最低为同径路同席别各车次平均执行票价的8.5折。</p>", "category": "tech", "published_at": "2026-06-11T11:00:00+00:00", "fetched_at": "2026-06-12T03:32:01.482287+00:00", "fingerprint": "25ffa464361ef3e3"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨SpaceX上市在即，马斯克或成全球首位万亿富翁；92年技术极客陈宇森接任钉钉CEO；比尔·盖茨就爱泼斯坦案出席国会听证", "url": "https://36kr.com/p/3849431503869187?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</li>\n   <li>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</li>\n   <li>SK海力士设备供应商要求涨价</li>\n   <li>端午前机票价格跳水</li>\n   <li>SpaceX上市前夕，美股太空股提前狂欢</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>SpaceX上市在即，马斯克或成全球首位万亿富翁</strong></p>\n  <p>据报道，SpaceX将于美东时间6月12日在纳斯达克挂牌交易，股票代码SPCX。根据SpaceX 6月11日在官网发布的声明，公司此次IPO发行5.556亿股，发行价为每股135美元，募资总额达750亿美元。SpaceX此次IPO募资规模是沙特阿美2019年创下的294亿美元上市纪录的逾两倍。声明显示，SpaceX还授予承销银行超额配售权，可按发行价额外购买8330万股股票。若该权利全部行使，IPO融资规模将增至约860亿美元。若按135美元定价，叠加特斯拉约15%持股及其他资产，马斯克身价突破1万亿美元，成为全球首位万亿富豪。（新浪财经、三言科技）</p>\n  <p><strong>钉钉换帅，92年技术极客陈宇森接任钉钉CEO</strong></p>\n  <p>36氪获悉，6月11日，阿里巴巴宣布钉钉管理层调整：陈航卸任钉钉CEO，92年技术极客陈宇森接棒。接任钉钉CEO后，陈宇森成为阿里巴巴最年轻的事业部CEO。陈宇森生于1992年，是年少成名的技术极客，也是技术型连续创业者，入选福布斯亚洲“30 Under 30“榜单。他曾在国内外顶级计算机赛事中屡获冠军，22岁时创办的网络安全公司长亭科技被阿里云收购。他2025年在阿里云内部创业，带领研发了AI Agent产品MuleRun。</p>\n  <p><strong>比尔·盖茨国会作证，称被爱泼斯坦用婚外情施压</strong></p>\n  <p>美东时间6月10日，前世界首富、微软公司联合创始人比尔·盖茨结束了在国会众议院监督与政府改革委员会的闭门听证会。作证期间，议员们主要询问了两人的交往细节、财务往来，以及盖茨是否知晓对方的犯罪行为。盖茨否认参与爱泼斯坦的非法行为，重申后悔认识他，并再次为曾与爱泼斯坦互动向盖茨基金会员工致歉。盖茨在个人网站上公布了当天的证词。盖茨强调，期间爱泼斯坦暗示知晓自己的几段婚外情，并以此向自己施压，重新取得联系。爱泼斯坦希望借助与盖茨的交往来接触美国政商高层，搭建自身的权力关系网络。（中国新闻周刊）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI正考虑大幅下调产品价格，预判将与Anthropic展开用户之争</strong></p>\n  <p>为从竞争对手Anthropic手中争夺客户，OpenAI正考虑大幅下调面向用户的收费标准。据知情人士透露，该公司计划大幅下调代币计费单价——代币是人工智能企业核算产品费用的计量单位。此举意在应对Anthropic预计也会推出的降价举措。目前，企业高管已开始对高昂的AI使用成本感到抵触。OpenAI首席执行官山姆·奥尔特曼在近期一场活动中坦言，成本问题已成为一大难题。（新浪财经）</p>\n  <p><strong>Anthropic CEO再次“喊话”警惕AI风险</strong></p>\n  <p>北京时间6月11日，Anthropic CEO达里奥·阿莫迪再次围绕AI安全发声。阿莫迪认为AI发展远超政策流程设计时应承载的速度，并在《人工智能指数政策》中表示，四年间，AI模型进步巨大，预估随着计算能力的不断提升，AI通用认知能力将呈指数级增长。但相比AI发展速度，政策，尤其是立法，推进得极为缓慢。阿莫迪表示，政府握有重大权力，但通常情况下不宜仓促行使。但这种时间尺度上的错配可能造成：在国会耗时数年方能采取行动的周期内，AI已从一个有趣的玩具演变为一个汇聚天才的国度。（第一财经）</p>\n  <p><strong>阿里云Meoo CLI发布，本地AI编程项目可直接部署上线</strong></p>\n  <p>36氪获悉，阿里云Meoo（秒悟）推出开源命令行工具Meoo CLl.安装后，Claude Code、Codex、Cursor等本地AI编程助手可通过该工具调用云端能力，完成数据库接入、用户登录、文件存储及项目发布，将本地项目推进到线上可用状态。</p>\n  <p><strong>谷歌推出DiffusionGemma开源模型</strong></p>\n  <p>谷歌当地时间6月10日发布实验性开源模型DiffusionGemma，采用文本扩散架构，在专用GPU上文本生成速度较传统自回归大语言模型最高提升4倍，模型以Apache 2.0许可证发布。谷歌称，DiffusionGemma定位为面向研究者和开发者的实验性模型，整体输出质量低于标准Gemma4，生产环境仍建议使用后者。该模型的速度优势主要体现于本地及低并发推理场景，在高并发云端部署中优势有限。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>SpaceX约400名持股员工身价或达1亿美元</strong></p>\n  <p>据财联社消息，6月11日，航空科技和人工智能公司SpaceX即将在周五IPO，而据此前报道，该公司的认购需求超过发行规模的四倍，总认购规模突破2500亿美元，远超计划的750亿美元募资目标。火爆的IPO也让持有SpaceX股票的员工满怀期待。SpaceX拥有2.2万名员工以及数百名已经离职的前员工，其中包括工程师和发射场的蓝领工人。据旧金山投资平台Hill.com的分析，SpaceX的4400多名现任和离任员工有望在IPO中成为百万富翁。其中，约有400人预计将获得1亿美元或以上的财富。Hill.com创始人兼首席执行官Andrew Benson指出，大多数IPO中通常只有创始人才能成为亿万富翁。而此次SpaceX推动400人身家达到1亿美元的门槛实属罕见，说明该公司正在创造巨额财富。（财联社）</p>\n  <p><strong>全球两大预测平台世界杯冠军合约成交额破20亿美元，有望刷新单项纪录</strong></p>\n  <p>数据显示，全球两大预测市场平台（Polymarket和Kalshi）针对本届世界杯冠军归属的事件合约成交额，已超过了20亿美元。这使得该事件有望刷新单项预测市场合约的成交纪录。（财联社）</p>\n  <p><strong>李书福卸任极氪董事长</strong></p>\n  <p>天眼查App显示，近日，浙江极氪智能科技有限公司发生工商变更，李书福卸任董事长，安聪慧卸任法定代表人，由淦家阅接任法定代表人。该公司成立于2021年7月，注册资本130亿人民币，经营范围包括数据处理服务、数据处理和存储支持服务、互联网数据服务、大数据服务等，由Zeekr Technology Limited全资持股。（证券时报）</p>\n  <p><strong>SK海力士设备供应商要求涨价</strong></p>\n  <p>据媒体消息称，近期SK海力士多家设备一级供应商提出涨价要求，供货价格涨幅在3%-4%。而SK海力士已要求这些供应���提交依据材料，以评估调价申请。业内人士指出，比较常见的是原材料和零部件供应商因成本波动较大而进行涨价谈判，但连设备厂也提出涨价要求则较为少见。（财联社）</p>\n  <p><strong>豆包手机硬件负责人林夕离职，曾任职于华为</strong></p>\n  <p>6月11日，据科创板日报消息，字节跳动AI硬件核心团队Ocean旗下、豆包手机硬件产品负责人林夕已于近日离职。这也是字节自2024年启动AI手机项目以来，首位出走的核心硬件管理人员。界面新闻就此向字节跳动方面求证，截至发稿，暂未有回应。公开信息显示，加入字节之前，林夕曾在华为终端长期任职，主要担任Pura X阔折叠手机硬件产品负责人。Pura X是华为首款“阔折叠”旗舰手机，也是全球首款量产16:10阔型内屏折叠屏。该产品于去年3月发布，起售价7499元，首销48小时预订量达120万台，首周激活量近10万台。（科创板日报）</p>\n  <p><strong>LABUBU亮相2026世界杯开幕式</strong></p>\n  <p>北京时间6月12日，2026美加墨世界杯开幕式正式开启，泡泡玛特麾下IP LABUBU登场，作为赛事特邀嘉宾，亮相世界级体育舞台。开幕式现场，两只身着球衣的LABUBU首度现身世界杯，以萌趣热血的球迷姿态亮相，也让中国原创IP登上国际赛场。泡泡玛特THE MONSTERS与FIFA世界杯联名系列已正式开售。（第一财经）</p>\n  <p><strong>7家涉火车票销售第三方平台被约谈</strong></p>\n  <p>6月11日，市场监管总局会同中央网信办、国家铁路局，依法约谈携程、同程、去哪儿、飞猪、美团、智行火车票、高铁管家等7家第三方平台企业，针对其不当宣传“候补帮抢”及付费选座业务、不当诱导用户“买长乘短”或“买短乘长”、不当收集和使用平台用户个人信息等不规范经营问题。（央视新闻）</p>\n  <p><strong>丰巢回应“取件得先看广告”</strong></p>\n  <p>近日，有多地市民反映称，“在丰巢快递柜取件时，会频繁弹出广告并跳转至其他平台”，引发网友持续讨论。6月10日，丰巢方面向南都N视频记者表示，“丰巢App内已提供‘广告展示’关闭选项，并于近期优化了相关界面，目前丰巢正与可能跳转广告的相关平台进行沟通。”（南方都市报）</p>\n  <p><strong>iOS 27打破15年肌肉记忆，通知下滑手势让位Siri AI</strong></p>\n  <p>据IT之家6月11日消息，iOS27、iPadOS 27系统中，苹果公司调整通知中心操作手势，打破了iPhone和iPad用户15年来的肌肉记忆。自苹果公司于2011年推出iOS 5以来，用户从屏幕顶部中央向下滑动，即可查看按照时间顺序排列的各应用通知。不过在iOS 27系统中，苹果启用Siri AI后，用户从屏幕顶部中央向下滑动，会唤出全新的Siri AI体验。不过通知中心并未消失，用户从左上角向下滑动即可访问。上一次苹果对手势做如此大的调整，是在iPhone X时代将控制中心从底部上滑改为右上角下滑。苹果随后在所有设备上统一了这一交互方式。如今轮到通知中心被重新定位。（IT之家）</p>\n  <p><strong>美团、淘宝闪购、京东外卖集体签约，建立“黑名单”共享机制</strong></p>\n  <p>36氪获悉，6月11日，广东省市场监管局举办网络餐饮平台自律公约和协同共治协议签署活动。活动中，在广东省市场监管局有关负责人的见证下，美团、淘宝闪购、京东外卖三家网络餐饮平台共同签署了《广东省网络餐饮行业高质量发展与食品安全自律公约》。公约全文共五章二十一条，紧扣《网络餐饮服务经营者落实食品安全主体责任监督管理规定》(国家市场监管总局第123号令)核心要求，围绕平台主体责任、入网餐饮商户管理、配送人员关怀、社会共治等方面作出明确约定，首次提出建立跨平台“黑名单”共享机制，对严重违法商户实施跨平台联合约束，实现“一处违法、全网受限”。</p>\n  <p><strong>理想法务部：就某公司利用AI批量生成不实内容一事，已报案</strong></p>\n  <p>6月11日，理想汽车法务部发文：近日，我司就江西某文化传媒公司利用AI工具批量生成涉理想汽车不实内容一事，正式向公安机关报案。相关执法部门已依法调查处置，涉事机构就上述行为公开道歉。近年来，针对我司旗下系列产品、品牌及用户的恶意诋毁、造谣行为持续发生，这些不法行为以批量捏造、散布涉理想车主的不实内容为主要方式，系统性污名化用户群体，并借此损害公司品牌声誉。我们将客观的批评监督与恶意的造谣诋毁严格区分开来。前者我们谦卑倾听，后者我们坚定回击。当违法者开始借助AI工具批量传播虚假信息，我们毫不犹豫拿起的是法律武器。（第一财经）</p>\n  <p><strong>端午前机票价格跳水</strong></p>\n  <p>随着端午节和暑假临近，民航运输再次步入旺季。近日，在深圳机场，已经有不少旅客提前出行，错峰出游。有旅客告诉央视财经记者，从沈阳坐飞机旅游，返程不是节假日的话，每张机票能便宜1000元。端午节前一周，从深圳飞往杭州、贵阳、海口、武汉等地均只需200多元，只有7月均价的一半甚至三分之一，一些飞往北方地区的长航线机票价格更划算。在线旅游平台统计数据显示，截至目前，端午前（6.1-6.15）错峰游机票预订量同比去年节前增长了19.6%。（央视财经）</p>\n  <p><strong>现货黄金跌破4100美元大关，创年内新低，多家品牌金饰价格较昨日下跌近40元/克</strong></p>\n  <p>6月11日，黄金白银再次大跌。亚市早盘现货黄金一路走低，日内最低跌超1%，下探到4023.1美元/盎司，创至2025年11月以来的新低。COMEX黄金期货最低跌超过2%，下探到4046.2美元/盎司。现货白银早盘最低下探到62.002美元/盎司，距离今年3月的低点60.85美元/盎司仅一步之遥。6月11日国内黄金饰品价格对比显示，多家品牌金饰价格较昨日下跌近40元/克，普遍报1236-1240元/克;周大福报价1238元/克，周生生报价1240元/克，老庙黄金报价1238元/克。（界面新闻）</p>\n  <p><strong>欧洲央行宣布加息25个基点</strong></p>\n  <p>当地时间6月11日，欧洲央行宣布将欧元区三大关键利率分别上调25个基点，欧元区存款机制利率、主要再融资利率和边际借贷利率分别为2.25%、2.40%和2.65%。本月初，欧盟统计局公布的初步数据显示，欧元区5月消费者价格指数(CPI)同比上涨3.2%，创下自2023年9月以来的最高水平。欧元区能源价格同比涨幅连续两个月超过10%。分析认为，在中东冲突引发能源价格上涨、导致欧元区通胀压力再度抬头的背景下，欧洲央行希望在成本冲击进一步扩散至整体经济之前，通过加息遏制通胀。（央视财经）</p>\n  <p><strong>安克创新CEO称充电宝大概率过几年就死了</strong></p>\n  <p>近日，安克创新创始人阳萌在一次访谈中表示，充电宝不但不会变成千亿级品类产品，甚至有可能过几年就会消失。阳萌以MP3、磁带机、CD机类比称电子产品从大家开始买它到不买它，中间的跨度也就10年。公开资料显示，安克创新成立于2011年，旗下拥有Anker、Soundcore、eufy等品牌，曾凭借充电宝等产品打开海外市场，被称为“充电宝一哥”。2025年，公司营收305.14亿元，同比增长23.49%。其中，充电储能类业务实现收入154.02亿元，占总营收约一半，传统充电宝已不再是其核心收入来源。（界面新闻）</p>\n  <p><strong>于东来称胖东来员工不值这么多钱，出去就完蛋</strong></p>\n  <p>6月10日，于东来在胖东来内部会上表示，公司30年来一直用超越员工期望的薪酬激发热情，但也容易产生“溺爱”。他说，员工其实不值那么多钱，高薪会导致认知偏差，让人真以为自己值这个价。在胖东来内会感到骄傲幸福，但一旦离开就会“完蛋”。他坦言，自己过于包容，反而害了家庭和企业。（界面新闻）</p>\n  <p><strong>A股市场又一次迎来“世界杯魔咒”的讨论窗口</strong></p>\n  <p>按照赛程，本届世界杯将于6月11日至7月19日在美国、加拿大、墨西哥三国举行，48支球队参赛、104场比赛、39天赛期，均创世界杯历史新高。由于多数赛事对应北京时间凌晨至上午时段，因此也被多家券商纳入赛事经济观察范围。但券商给出的共同判断并不激进：世界杯窗口确实存在一定交易热度下降和阶段性弱势特征，但所谓“世界杯魔咒”并不是稳定有效的择时规律。相比盯着指数涨跌，市场更应回到当下的资金环境、产业主线和中报验证窗口。换言之，世界杯可以带来情绪扰动和消费主题，但很难改变A股原本的运行逻辑。（财联社）</p>\n  <p><strong>SpaceX上市前夕，美股太空股提前狂欢</strong></p>\n  <p>6月11日，美股太空股夜盘集体上扬。DXYZ涨超8%，Rocket Lab（RKLB.US）、AST SpaceMobile（ASTS.US）、Redwire（RDW.US）、Intuitive Machines（LUNR.US）均涨超2%。消息面上，特斯拉（TSLA.US）CEO马斯克旗下SpaceX将在在当地时间6月12日登陆纳斯达克挂牌上市，SpaceX已吸引超过2500亿美元的投资需求，远超其计划筹集的750亿美元规模。此次IPO超额认购率已达到3.5至4倍，有望成为有史以来规模第一的IPO。（财闻）</p>\n  <p><strong>国家邮政局依法对极兔速递有限公司立案调查</strong></p>\n  <p>今年以来，使用“极免速递\"商标、字号、快递运单经营快递业务的企业多发生产安全事故，场所内多次被检查发现生产安全事故隐患。极免速递有限公司对极免速递相关企业安全生产管理缺位，未按规定实行安全保障统一管理，国家邮政局依法对极免速递有限公司进行立案调查。</p>\n  <p>对此，极兔回应记者称：极兔速递中国区高度重视，诚恳接受，坚决服从、全力配合主管部门依法依规开展的各项调查工作。（央视新闻、21世纪经济新闻）</p>\n  <p><strong>微信聊天可以“合并发图”了</strong></p>\n  <p>6月11日，据微信派消息，微信聊天可以“合并发图”了。现在发送3张及以上的图片、视频时能看到“发送后合并展示”。发出去的图片支持展开或收起，点一下即可切换形态，此外还可以一键保存“合并展示”的全部内容，或转发给其他朋友。（界面新闻）</p>\n  <p><strong>经销商回应路虎揽胜极光L价格暴跌至17万多：属实</strong></p>\n  <p>近日，有消息称，路虎揽胜极光L价格暴跌，目前部分终端市场成交价格下探至17.98万元甚至更低，与42.98万元起的官方指导价相比，跌幅接近六成。6月11日，界面新闻就揽胜极光L降价一事，致电北京捷豹路虎四惠门店，相关工作人员表示，“SE配置的裸车，全款18.5万元；综合优惠的话，裸车可以降至17万多”。北京中进捷旺汽车销售服务公司的工作人员也对界面新闻表示，裸车SE目前18.5万元，HSE配置是23万元，“到店的话，会有相应的活动，最终价格更有优势”。（界面新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，6月11日收盘，美股三大指数集体上涨，纳指涨2.54%，标普500指数涨1.75%，道指涨1.86%。大型科技股多数上涨，Arm涨超11%，英特尔涨超9%，特斯拉涨超4%，英伟达涨超2%，亚马逊、苹果涨超1%，谷歌小幅上涨；甲骨文跌超8%，微软跌超1%，奈飞、Meta小幅下跌。热门中概股涨跌不一，富途控股涨超2%，哔哩哔哩涨超1%，蔚来、理想汽车小幅上涨；小鹏集团跌超2%，阿里巴巴、京东、百度跌超1%。</p>\n  <h2>投融资</h2>\n  <p><strong>德国机器人公司Neura Robotics完成14亿美元融资，获亚马逊、英伟达等多方支持</strong></p>\n  <p>6月10日，德国机器人公司Neura Robotics宣布完成创纪录的C轮融资，本轮总规模最高可达14亿美元，旨在加速构建全球领先的物理人工智能平台。此轮融资获得了亚马逊、英伟达和欧洲投资银行等多方支持。（界面新闻）</p>\n  <h2>酷产品</h2>\n  <p><strong>追觅Eclix俞雷：即将推出一款没有APP的AI手机</strong></p>\n  <p>6月10日，界面新闻独家获悉，追觅生态品牌Eclix团队已与国内头部大模型厂商达成深度合作，预计将于2026年9月发布第一代AI手机，双十一前上市。该产品主打高端，定价5000元以上，目前核心团队研发已接近完成，即将进入整机测试阶段。Eclix手机团队由前金立集团副总裁俞雷组建，俞雷于2026年3月正式入职MOVA，任手机和AI硬件业务负责人。（界面新闻）</p>\n  <p><strong>智元推出灵犀X2 EDU(人人造)版本，面向科教实训等丰富场景</strong></p>\n  <p>36氪获悉，6月10日，智元推出灵犀X2 EDU(人人造)版本，面向科研教育、工程实训、机器人赛事开发等多元场景，聚焦设备拆装实训与软件二次开发。据介绍，灵犀X2 EDU(人人造)版本在硬件设计上强调可拆装、可扩展与可二次开发。</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-12T00:04:29+00:00", "fetched_at": "2026-06-12T03:32:01.482279+00:00", "fingerprint": "de0b1529f967068e"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 前瓦锡兰老兵创业，为船舶装上中国“心脏”，半年超 5000万订单", "url": "https://36kr.com/p/3849520020231432?f=rss", "summary": "<p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，连云港力普司船舶科技有限公司（下称“力普司LiiPuS”）近期连续完成种子轮及天使轮融资，总额达数千万元。其中，种子轮由江苏金桥基金独家投资，天使轮由云时资本独家投资。本轮资金将主要用于高端船舶综合电力推进系统及产品的样机测试、持续改进及小批量交付，加速国产高端推进系统在港口拖轮、海工船、豪华游艇等场景的规模化应用。</p>\n  <p>力普司2025年7月成立于连云港，聚焦大型船舶综合电力推进系统的研发、设计与生产，产品覆盖领先一代的L型永磁全回转推进器、永磁吊舱推进器、破冰型全回转推进器等全矩阵系列，全系列产品采用标准化、模块化的设计和制造理念，具有尺寸小、重量轻、功率密度大、可靠性高等优点。</p>\n  <p>公司创始人李祥彪曾先后任职于苏船、南高精、瓦锡兰及斯凯孚，推进器经验近20年，熟悉国内外同类产品的技术路线、制造工艺、质量水平等，深知国内用户痛点，中国产品与欧洲产品仍有不小的质量差距，力普司有望解决行业痛点，缩小与国际品牌之间的差距。</p>\n  <p>硬氪了解到，永磁推进器因结构紧凑、效率高、操控灵活，被视为当前最高效的船舶推进方案。但在大功率、高质量要求的细分市场，瓦锡兰、康世伯、肖特尔等国际品牌长期占据垄断地位，国产替代空间巨大。</p>\n  <p>此外，随着中国向造船强国转变，核心装备国产化率逐渐提高，同时，减碳与电动化趋势推动港口拖轮、海工船、内河船等场景加速淘汰旧船、新造高效环保船舶，永磁推进器作为电动化动力系统的关键部件，需求明确且持续走强。</p>\n  <p>目前，公司已完成0.5-5MW L型永磁全回转推进器、0.2-2MW永磁吊舱推进器、2-10MW破冰型全回转推进器等产品的系列化开发，并在江苏连云港、南通和广东江门布局批量生产交付基地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260612/v2_09f8dfd5591b4aaabfbe35a980c43a41@6221844_oswg196747oswg794oswg381_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">力普司相关产品（图源/企业）</p>\n  <p>成立半年时，力普司累计在手订单已超过5000万元，重点覆盖港口拖轮、海工船及豪华游艇三大领域。公司预计今年实现1亿元的小目标，未来每年保持2-3倍增长。</p>\n  <p>李祥彪告诉硬氪，未来公司产品还将推进智能化方向，为船舶提供AI辅助驾驶控制软件与算法，实现船舶智能航行与智能控制。预计智能化相关功能将在今年完成研发测试，明年开始推广使用。</p>\n  <p><strong>以下为硬氪与李祥彪的对话节选：</strong></p>\n  <p><strong>硬氪：推进器领域国际巨头垄断已久，力普司的差异化优势具体体现在哪些方面？</strong></p>\n  <p><strong>李祥彪：</strong>我们研发生产的产品是领先国内一代的产品，质量和可靠性与欧洲品牌相当。L型永磁全回转推进器和永磁吊舱推进器均采用了电机和推进器融合设计的理念，电机扭矩曲线和螺旋桨扭矩曲线采用耦合计算，提高了机桨匹配性和推进效率。</p>\n  <p><strong>硬氪：民企会面临国企或研究所带来的较大竞争压力吗？</strong></p>\n  <p><strong>李祥彪：</strong>目前没有直接竞争关系，我们的产品定位、设计理念、制造工艺都有所不同，船厂方面，他们主要负责船舶建造，核心设备如推进器、电机、电控系统很多由民营企业提供。我们的客户主要是港口拖轮、海工船、豪华游艇领域，这些领域对产品质量和性能要求极高，目前仍严重依赖进口，市场需求非常强烈。</p>\n  <p><strong>硬氪：目前公司面临较大的挑战是什么？</strong></p>\n  <p><strong>李祥彪：</strong>我们目前最大挑战还不是接多少订单，而是满足高端装备精密制造的产能准备。我们成立不到一年，产能布局还没完全铺开，还不能大规模接单——接多了不能按时、按高质量标准交付会很麻烦。今年下半年的重点是产业规划布局和船级社资质认证。我们规划了连云港、南通、江门三个制造基地，27年产能交付能力会从现在的20-30台提升到150台左右。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>云时资本：</strong>力普司由来自国际超一流厂商的成建制团队构成，创始人具备极为领先的创新观念和工程实践能力，在船舶大功率推进器领域有着丰富的经验。全球船舶电动化和智能化趋势显著，中国作为造船大国在其中引领，海洋产业也是十五五规划重中之重。非常看好力普司未来的发展潜力，期待公司成为下一代船舶软硬件系统的重要支柱。</p>\n  <p><strong>江苏金桥基金：</strong>力普司拥有一支真正懂产品、懂市场、懂制造的成建制团队，创始人李祥彪近20年的国际头部企业实战经验，使得公司在高端船舶推进系统领域具备了与欧洲品牌直接对标的能力。其产品在功率密度、效率、可靠性上达到国际一流水平，同时凭借显著的成本和交付周期优势，精准切中港口拖轮、海工船、豪华游艇等场景的国产替代痛点。</p>\n  <p>全球船舶电动化、智能化浪潮叠加海洋产业被纳入“十五五”规划重点方向，力普司有望成为下一代船舶综合电力推进系统的核心支柱。我们坚定看好公司的长期成长性。</p>", "category": "tech", "published_at": "2026-06-12T01:34:28+00:00", "fetched_at": "2026-06-12T03:32:01.482264+00:00", "fingerprint": "12ca07f7eb8b557e"}, {"source": "少数派", "title": "苹果新增的「围绝经期」提醒，你该比 watchOS 27 多了解一点", "url": "https://sspai.com/post/75419", "summary": "当它突然出现在生命里时，你就知道了该如何面对；当它出现在身边人身上，你也知道该如何帮助她们步入这个全新的人生阶段。<a href=\"https://sspai.com/post/75419\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-11T03:41:47+00:00", "fetched_at": "2026-06-12T03:31:59.004193+00:00", "fingerprint": "135ded71693b3aa3"}, {"source": "少数派", "title": "5月音乐推荐：不可错过的9张惊喜专辑", "url": "https://sspai.com/post/110670", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/110670\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-11T06:58:32+00:00", "fetched_at": "2026-06-12T03:31:59.004187+00:00", "fingerprint": "42184d79f60895bd"}, {"source": "少数派", "title": "618 相机存储卡选购全攻略（2026）", "url": "https://sspai.com/post/110334", "summary": "希望这篇攻略，能帮各位摄影玩家精准避坑，在今年 618 选到适配自己设备、稳定耐用、性价比拉满的存储卡。<a href=\"https://sspai.com/post/110334\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-11T09:30:00+00:00", "fetched_at": "2026-06-12T03:31:59.004181+00:00", "fingerprint": "98b106426d836927"}, {"source": "少数派", "title": "家庭饮品 DIY 指南（一）：工欲善其事，必先利其器", "url": "https://sspai.com/prime/story/home-made-beverages-1", "summary": "前言其实开始喝咖啡以后，就对各种饮品的制作自然而然的来了兴趣，经过几年的积累，略有心得，感觉可以拿来跟大家分享一下。这次的主题家庭饮品DIY。通过简单的设备、物料以及简单的制作方法，教大家如何在家做饮 ...<a href=\"https://sspai.com/prime/story/home-made-beverages-1\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "
