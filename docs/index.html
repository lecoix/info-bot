, "fingerprint": "d2a732fa9185aaf6"}, {"source": "The Verge", "title": "All the latest news on Android 17, Wear OS 7, and Android XR", "url": "https://www.theverge.com/tech/950936/google-android-17-wear-os-android-xr", "summary": "Google’s Android 17 update includes highlights like new floating “Bubble” app windows for easier multitasking, a Screen Reaction recording mode, and a 50/50 split gaming mode for foldable phones. Meanwhile, Wear OS 7 brings Live Updates and better battery life for smart watches, and it prepares connections for new Android XR smart glasses that will [&#8230;]", "category": "tech", "published_at": "2026-06-16T18:30:00+00:00", "fetched_at": "2026-06-17T03:38:39.380798+00:00", "fingerprint": "fe90a2e11e4b7d90"}, {"source": "The Verge", "title": "The Complete Calvin and Hobbes is a great last-minute Father’s Day gift", "url": "https://www.theverge.com/gadgets/950958/calvin-and-hobbes-fathers-day-gift-idea-deal-sale", "summary": "Father’s Day is nearly here. Hopefully, you already got a gift for dads you care about, but if not, here’s a quick, easy recommendation for anyone who enjoys a good comic strip. The Complete Calvin and Hobbes contains every one of Bill Watterson’s beloved strips made during the comic’s ten-year run from 1985 through 1995, [&#8230;]", "category": "tech", "published_at": "2026-06-16T20:00:00+00:00", "fetched_at": "2026-06-17T03:38:39.380787+00:00", "fingerprint": "5bbe1696a554c962"}, {"source": "36氪 - 最新文章", "title": "融了数亿美金的「大晓机器人」，其创始人揭开了具身行业的割裂一面", "url": "https://36kr.com/p/3855262364488969?f=rss", "summary": "<p><strong>文｜周鑫雨</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>梳理近半年的成果，大晓机器人董事长、商汤科技联合创始人王晓刚，滔滔不绝聊了10多分钟。</p>\n  <p>成立于2025年7月，大晓机器人（ACE ROBOTICS）是具身领域姗姗来迟的入局者。但一年来，这位新玩家成了赛道的“卷王”：</p>\n  <p>在模型侧，大晓新发布的具身大脑——世界模型“开悟（Kairos）3.0”，在4项全球具身智能基准测试中取得SOTA；开源的Kairos 3.0-4B，则率先实现在端侧直接驱动具身智能本体的能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_e06aa791ab2c4fec925d7a63e3ae65ae@5783683_oswg100713oswg1080oswg290_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△Kairos3.0在4个世界模型生成预测具身智能榜单中取得SOTA。图源：大晓机器人</p>\n  <p>在数据侧，大晓提出的“以人为中心”环境式采集方案，通过大规模采集人类与真实环境的交互过程，将世界模型训练数据量扩展至100万小时，达到传统真机（人遥控机器人）采集模式的10倍。</p>\n  <p>还有落地——半年前，大晓的具身大脑模组A1，落地的主要场景，还是从事道路巡检的机器狗；如今，这颗“大脑”已经随着形态各异的机器人，进入了酒店、无人零售店、无人物流仓等多个场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_bda8eeb405a64e28a2de6362f87db20a@5783683_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">△大晓在上海西岸落地的机器狗巡逻方案。图源：大晓机器人</p>\n  <p>2026年6月15日，<strong>大晓机器人官宣完成天使+轮融资</strong>——距离上一轮官宣，仅隔了4个月。</p>\n  <p>这一轮投资方包括达晨财智、深创投、上海科创基金、沐曦股份、盛宇投资、复星锐正、华控基金、临港新片区基金、豫资涨泉等基金，老股东商汤国香资本持续增资，告捷资本担任长期财务顾问。</p>\n  <p>至此，<strong>2026年以来，大晓的累计融资金额已经达数亿美元。</strong>据《智能涌现》了解，大晓也成了具身领域最快成为独角兽的企业之一。</p>\n  <p>在单轮融资金额动辄数亿元的具身赛道，不仅是技术竞速，入局玩家的场景圈地之战已然打响：</p>\n  <p>孵化自清华的“千诀科技”，瞄准的是酒店保洁、商用服务、精密室内作业等实景项目；前华为车BU首席科学家陈亦伦创立的它石智航，聚焦的是线束装配场景。</p>\n  <p>“具身领域的产业链非常长，很难靠一家企业做完所有的事。”王晓刚告诉《智能涌现》，“所以<strong>在其中怎么撬动更多资源，在整个具身产业链中把握生态位的主导权，是非常关键的。”</strong></p>\n  <p>然而，在落地过程中，王晓刚感受到的是：<strong>硬件、数据、模型，三者的结合还不够。</strong></p>\n  <p>在海外，Figure、特斯拉等头部具身企业，都在内部整合硬件研发、数据采集和模型训练，以此提高协同迭代的效率。</p>\n  <p>在国内，这套闭环尚未形成。王晓刚坦言，受制于技术成熟度和资源投入压力，不少本体公司对场景落地持谨慎态度；上游数据采集标准尚未统一，可直接用于具身模型训练的高质量数据供给不足。与此同时，硬件迭代的周期远长于模型，导致设计很难协同。</p>\n  <p>找到可规模化的落地场景，以及可深度合作的本体厂商，是当下大晓构建“硬件、数据、模型”闭环的方法论。</p>\n  <p>在王晓刚的规划中，大晓会先深入广阔的道路巡检和无人物流仓场景，再扩展到更为复杂、安全性要求更高的C端家庭场景。</p>\n  <p>这样的好处在于，大晓能够先从 B 端场景中收集足够多的场景数据，提升世界模型能力的同时，还可以快速形成可以规模化的解决方案，帮助本体厂商进入场景。</p>\n  <p>近期，王晓刚和《智能涌现》聊了聊大晓的进展，以及他对具身行业的观察。以下对话略经编辑：</p>\n  <h2><strong>找到可复制的场景</strong></h2>\n  <p><strong>智能涌现：</strong>今年具身和世界模型是一级市场最火的赛道。相较于大晓成立之初，这一轮的融资难度有变化吗？</p>\n  <p><strong>王晓刚：</strong>这个时间点融资的好处是，市场有热度、有关注度。</p>\n  <p>但相对的，企业太多，有时候投资人不清楚每家公司的价值点在哪里。所以我们需要付出更多的解释成本，帮投资人梳理清楚我们的发展路径、技术思路。</p>\n  <p><strong>智能涌现：</strong>大晓是2025年7月成立的。当时你会觉得大晓入局具身赛道晚了吗？</p>\n  <p><strong>王晓刚：</strong>我们选择这个时间点入局，是因为看到了具身大脑研究范式的变化：<strong>原来的主流的VLA（视觉-语言-行动）范式存在局限性，缺少对物理世界的结构化理解。世界模型恰好可以解决这个问题。</strong>所以在当时入局，我们有可能实现弯道超车。</p>\n  <p>而且在技术还不成熟的阶段，此前大家在探索技术范式，尤其是具身大脑的过程中，浪费了很多数据、模型训练、人力等资源。所以我们在去年入局可以少走弯路，反而有后发优势。</p>\n  <p><strong>智能涌现：</strong>相对而言，晚入局竞争会更激烈。</p>\n  <p><strong>王晓刚：</strong>具身领域的产业链非常长，很难靠一家企业做完所有的事。所以<strong>在其中怎么撬动更多资源，在整个具身产业链中把握生态位的主导权，是非常关键的。</strong></p>\n  <p>去年大晓成立之前，我们和很多具身企业进行了访谈。我发现，当时具身企业普遍对进入场景，抱有谨慎的态度。</p>\n  <p>但场景在具身的发展中起到了关键作用。具身领域是按场景划分的，只要在一个场景中进行了闭环的验证，就很容易进行全球的规模化的复制。在规模化的复制过程中，就能让数据采集的体量、硬件的规模提升几个数量级。</p>\n  <p><strong>智能涌现：</strong>为什么具身公司不太愿意进入场景？</p>\n  <p><strong>王晓刚：</strong>一方面，技术成熟度还不高。另一方面，解决场景中的问题，涉及到大量的数据采集、研发等资源投入。加之目前很多新兴的具身公司，本身对行业和场景的理解都不够深刻。</p>\n  <p>所以很多公司的态度是：先融钱，等待一个行业成熟的时机点，再去跟上。但等时机点出现的时候，先机已经被别人占走了。</p>\n  <p><strong>智能涌现：</strong>在技术不成熟的阶段，你们是怎么和场景中的头部客户谈的？</p>\n  <p><strong>王晓刚：</strong>找到技术的边界很重要。我们要根据技术、软硬件的成熟度，把现实的边界找到。</p>\n  <p>如果进入To C场景，比如L4阶段的自动驾驶，我的技术就不能有边界。但是进入To B场景，加上各种可控条件，技术是可以落地的。</p>\n  <p>我们还得判断：哪些场景是可以直接被解决的，哪些场景通过一些手段可以解决。此外，<strong>这些场景的解决方案还得具有可复制性。</strong>如果你找到的场景不具备可复制性，你做完这个，下一个还得定制化，这其实不是一个很好的选择。</p>\n  <p><strong>智能涌现：</strong>怎么判断一个场景具不具备可复制性？</p>\n  <p><strong>王晓刚：</strong>举个例子，我们优先深入的是零售、仓储这些场景，因为他们的业务体系和需求，全国都是可以复制的。再比如酒店也是一个可复制的场景，全国有很多酒店，我们交付的都是同一套巡检、导航机器人和机器狗。</p>\n  <p>智能涌现：这些场景的竞争会更激烈吗？</p>\n  <p><strong>王晓刚：</strong>虽然大家都瞄准了这几个场景，但很多企业走得不深。这样的后果就是，你的成本无法控制、无法边际递减。</p>\n  <p>你可以做个demo炫技，但它不具备规模化的前提条件。</p>\n  <p><strong>智能涌现：</strong>怎样的落地模式才算得上“深入”场景？</p>\n  <p><strong>王晓刚：</strong>首先，你需要有紧密合作的生态伙伴。比如，在无人零售的场景中，我们和商汤生态中的公司善惠机器人合作，给他们提供无人零售解决方案。</p>\n  <p>善惠首先会提出成本、续航、节排等要求。其次，在具体的复杂场景中，他们会给很多技术的反馈。这些要求和反馈，有助于我们形成数据闭环，在场景中快速迭代。</p>\n  <p>做完生态合作伙伴的“前期功课”后，我们也能够知道哪些方案是必要的，哪些是可以省却的，或者可以通过其他方案进行弥补。</p>\n  <p>等方案成熟，我们也能将业务合作拓展到零售相关的其他头部企业，通过规模化把成本降下来。通过这一套打法，目前大晓能够把解决方案的成本降低到行业的1/3。</p>\n  <p><strong>智能涌现：</strong>之前你提到，大晓落地场景的规划是：道路巡检-无人物流-家庭场景。这个落地顺序背后的考量是什么？</p>\n  <p><strong>王晓刚：</strong>一方面，我们考虑的是技术实现的难度。另一方面，我们遵循的还是先To B后To C的策略。因为C端场景规则边界不强，存在很多非结构化的场景。但B端场景是受控的，能够保障安全性。</p>\n  <p>所以在B端积累更多经验后，我们再走向To C。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_df3a79f12dbc40b9ba0763cb361eaf36@5783683_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">△大晓世界模型的家居场景。图源：大晓机器人</p>\n  <h2><strong>世界模型还没有「智能涌现」</strong></h2>\n  <p><strong>智能涌现：</strong>创业初期你提出了很多新观点，比如在VLA还是具身主流范式时，选择了做世界模型，再比如提出“以人为中心的数据采集范式”。你怎么判断这套范式是可行的？</p>\n  <p><strong>王晓刚：</strong>大方向上的判断是非常确定的。首先，VLA与世界模型相比，<strong>只有后者这样的生成式模型，才具备智能涌现的能力。</strong>所以我们做具身智能，第一天就选了世界模型方向。</p>\n  <p>其次，<strong>只有真人的数据，无论是采集的效率和规模，还是拟人化的真实性，才能达到训练世界模型的要求。</strong></p>\n  <p>但其中很多细节是在实践过程中才逐渐变清晰的。比如做世界模型，一开始我们的主要关注点是生成能力。但实际场景中，世界模型不光要生成数据，还要去控制真机，通过机器人与物理世界进行交互。这对世界模型的物理智能、空间智能提出了更高的要求。</p>\n  <p>所以我们最近发布了开源空间智能通用模型ACE-Brain-0，以及物理3D生成框架PhysX-Omni，来提高世界模型的空间智能和物理智能。</p>\n  <p><strong>智能涌现：</strong>视频生成模型、VLA等都称自己为“世界模型”。你对世界模型的定义是什么？</p>\n  <p><strong>王晓刚：</strong>简单来说，世界模型得具备三方面的能力：理解、生成、预测。只有同时具备这三个能力，模型才能自我演进、自我纠正、自我进化。</p>\n  <p>为什么大家都说自己是世界模型？因为<strong>业界没有针对世界模型的评价体系</strong>。比如，行业缺少对长时序复杂任务执行效果的benchmark。</p>\n  <p>一些所谓的“世界模型”只是宣传了自己擅长的东西，但其实缺失了另外的能力。像VLA缺乏生成能力，视频生成模型缺乏了对物理和空间的理解能力。</p>\n  <p><strong>智能涌现：</strong>你们内部怎么评测世界模型的能力？</p>\n  <p><strong>王晓刚：</strong>我们正在联合一些学术机构和具身公司，建立一个世界模型benchmark，其中的评测维度包括跨本体的泛化能力、模拟仿真的能力，这些维度最终指向的是衡量模型理解、生成、预测的能力。</p>\n  <p><strong>智能涌现：</strong>大晓的世界模型Kairos最近迭代到了3.0。它的能力类比语言模型处于什么阶段？</p>\n  <p><strong>王晓刚：</strong>还没到GPT3.0。等到GPT3.0的阶段，世界模型就能实现智能涌现，也意味着研究范式有较高程度的确定性。</p>\n  <p>目前我们还是按照“理解、生成、预测”三个维度来逐步迭代Kairos。最早的时候，Kairos主要用来做视频生成，后面逐渐开始控制真机，相应的，我们也要提升它对空间和物理属性的理解。</p>\n  <p><strong>智能涌现：</strong>在当下世界模型发展的阶段，数据的量、质量、标注，以及后续的评测等环节，哪个对模型能力的影响最大？</p>\n  <p><strong>王晓刚：</strong>眼前世界模型还在0-1的阶段，可供训练的数据本来就很少。所以<strong>在这个阶段，数据的量对效果的提升更明显。</strong>当训练数据增加了10倍、100倍，我立刻能看到模型能力的提升。</p>\n  <p>但等到世界模型出现智能涌现，就需要对数据进行精筛、进行精细化的标注。这和大语言模型的发展是类似的。</p>\n  <p><strong>当下世界模型还没有“智能涌现”</strong>，所以先要把数据的量铺上去，再反过来解决质量问题。</p>\n  <p><strong>智能涌现：</strong>要实现“智能涌现”，世界模型需要多少的训练数据？</p>\n  <p><strong>王晓刚：</strong>我们期待的是要达到千万小时的量级。</p>\n  <p>原来真机采集的数据规模只有10万小时的量级，现在我们用人采集，基本上能达到百万小时。</p>\n  <p><strong>智能涌现：</strong>提升数据采集量级的关键是什么？</p>\n  <p><strong>王晓刚：</strong>还是场景的规模化，所以其中就需要产业方进入。</p>\n  <p>其实<strong>对于产业方而言，数据采集也是他们进入具身行业的切入点。</strong>因为他们有场景，如果做数据采集，马上就可以变现，立刻产生价值。接着通过训练模型，再引入机器人，产业方也能提高场景的效率。</p>\n  <h2><strong>模型、数据、硬件、场景的结合是不够的</strong></h2>\n  <p><strong>智能涌现：</strong>如今行业对机器人的一种态度是：买来只能当吉祥物，没有实际用处。</p>\n  <p><strong>王晓刚：</strong>除却质量问题，很重要的一点在于<strong>具身公司没有针对特定场景进行深度的迭代和打磨。</strong></p>\n  <p>现在的机器人公司，每年不断发布新的型号，但这些型号不是针对应用场景迭代的，所以原有的问题没有解决，反而会出现新的问题。</p>\n  <p>问题不收敛，就会造成返修率的增加，机器人工作几百个小时，就会出问题。所以当下机器人的规模化推广面临很大的问题。</p>\n  <p><strong>智能涌现：</strong>让具身公司根据场景迭代的解法是什么？</p>\n  <p><strong>王晓刚：等场景能够规模化，硬件可以量产，</strong>就会倒逼具身公司将资源集中在针对场景的迭代上。</p>\n  <p><strong>智能涌现：</strong>如今行业中还有哪些难题？</p>\n  <p><strong>王晓刚：</strong>首先，今天<strong>模型、数据、硬件三者的结合是不够的。</strong></p>\n  <p>基座模型厂商、世界模型公司，还有做数据的公司，大家都各做各的数据采集方案。但未来本体是靠数据来驱动的，而不是靠真机或者物理模型的规则。</p>\n  <p>所以这些问题就很关键：怎么从人身上采集数据？采集哪些数据去驱动硬件本体？硬件本体怎么设计才能符合人的行为要求？一旦设计过于复杂，人无法做相应的动作，将来就没有数据可以驱动本体。</p>\n  <p>美国的Figure、特斯拉，走的是一条高度集成、垂直整合的技术路线。他们把模型、数据、硬件都自己做了，因此内部迭代的效率会更高。今天我们就要找到一种模式，让三者有比较好的结合。</p>\n  <p>其次，具身和场景的结合，当下面临很多困境。场景其实是中国的优势，不少下游场景都具备可复制性，未来具身落地的速度会很快。</p>\n  <p>具身想要“打穿”场景，需要很多行业Know-How。但不少场景中的产业方，又不具备具身方面的知识和技术储备。所以我们需要找到新模式，让硬件、大脑和场景三者强强联合。</p>\n  <p><strong>智能涌现：</strong>什么样的“新模式”？</p>\n  <p><strong>王晓刚：</strong>一方面是和行业头部企业形成战略性的合作关系。我们背后的商汤，有几千家客户，涵盖非常多的行业方向。抓住头部客户资源后，我们的数据采集和解决方案就能规模化。</p>\n  <p>另一方面，我们也走访了很多本体厂商，考察他们的设计思路，和他们形成深度合作，帮助他们进入场景。</p>\n  <p><strong>智能涌现：</strong>你多次提到目前本体厂商进入场景不够。这是不是意味着你们作为上游的模型厂商，无法得到足够的数据回流？</p>\n  <p><strong>王晓刚：</strong>是的。所以我们还是要和本体厂商有充分的交流，去走访、探讨他们的技术细节。</p>\n  <p>当下在数采方案上，我们和本体厂商还有很多认知差异。</p>\n  <p>比如我们会让数采团队的成员戴上能传感触觉信息的手套，但是有的本体厂商关于“手”的设计方案不是人手，而是夹爪或者只有三指。这时我们的数采方案就要去兼顾相应的设计。</p>\n  <p>智能涌现：听上去现阶段你们要迁就本体厂商的方案，但你之前提到要让“模型去定义本体”。相较于“本体定义模型”，它有什么好处？</p>\n  <p>王晓刚：就像我之前说的，未来本体还是得靠数据去驱动。如果硬件设计得复杂度很高，未来靠什么数据去驱动？</p>\n  <p>以及，硬件本体的开发周期是很长的，不像模型软件那样可以快速实现。因此<strong>硬件需要根据模型的迭代方向去提前布局。</strong>谁能在迭代方向上提前思考、提前布局，就能赢得先机。</p>\n  <p>现阶段最好的合作方式就是本体和模型厂商深度绑定。当本体厂商设计下一代新型机器人时，我们也能提前把相应的数采方案、模型方案梳理清楚。</p>\n  <p><strong>智能涌现：</strong>数据采集、模型迭代、场景拓展，当下你怎么给这些业务排优先级？</p>\n  <p><strong>王晓刚：</strong>数据和场景，是比较关键的。因为具身的产业链很长，所以你需要快速占据一个生态位。</p>\n  <p>所以在这个时间点，我们正在用自己的解决方案，跟地方政府、场景中的头部企业形成紧密的合作。这是战略的制高点。</p>\n  <p>模型本身还在演进，不一定那么急迫。但做模型，又有助于我们去抓住场景中的头部企业，因为我们比硬件本体离数据、离场景近。<strong>所以在迭代模型的过程中，我们还是得抓住场景，而不是闷在实验室里。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_c6c6754ab205498d8bc9fc6aa8255a94@5783683_oswg649725oswg1389oswg517_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>", "category": "tech", "published_at": "2026-06-16T08:31:50+00:00", "fetched_at": "2026-06-17T03:38:39.214933+00:00", "fingerprint": "3691f04732c2e15c"}, {"source": "36氪 - 最新文章", "title": "乘新浪潮之势，建智造创新之城，2026年番禺产业高质量发展招商大会圆满举行", "url": "https://36kr.com/p/3855628692001799?f=rss", "summary": "<p>潮起湾区新机遇，科创赋能新番禺。6月16日上午，2026年番禺产业高质量发展招商大会在广州番禺良仓新造创意园举行，大会以“新浪潮·新番禺”为主题，旨在搭建高效政企对接、企企交流、资本赋能平台。</p>\n  <p>大会由广州市番禺信息技术投资发展有限公司（下称“番禺信投”）、广州市番禺交通建设投资集团有限公司（下称“番禺交投”）、广州市番禺区新造镇房地产开发公司主办（下称“新造房地产公司”），中国农业银行股份有限公司广州华南支行协办（下称“农行广州华南支行”），36氪承办，汇聚行业智库、龙头企业、优质项目、头部投资机构等多方代表逾百人，以科创为媒、以产业为桥、以资本为翼，共商发展大计，共绘产业新篇。</p>\n  <p>与此同时，为深度整合政企、金融、媒体、产业、属地资源，充分发挥各方核心优势，聚力区域产业发展、招商引资、品牌宣传、资源互通对接等工作，推动番禺区新造镇及全域产业高质量发展，番禺信投、番禺交投、新造房地产公司、农行广州华南支行与36氪签约成立番禺未来产业创新联盟。番禺未来产业创新联盟将整合属地政府、国有平台、金融机构、产业媒体四大核心资源，聚焦招商引资、品牌宣传、产业对接三大方向，依托政策、资本、媒体等各方优势，打造区域产业合作标杆。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_1e43fc7ff2674b578505a9a6f00dd7c3@5925182_oswg194949oswg1440oswg960_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">番禺未来产业创新联盟签约仪式</p>\n  <h2>前瞻洞察：36氪解码新质生产力与番禺机遇</h2>\n  <p>大会在精彩纷呈的番禺产业宣传片中拉开帷幕。首先，36氪研究院院长邹萍发表了题为《资本助力新质生产力发展》的主题分享。她指出，2026年第一季度一级市场超九成融资投向新质生产力领域，人工智能、具身智能、集成电路行业融资规模领跑，其中具身智能已成为热门赛道，资本热度持续攀升。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_aefac9cc28ef422f8707bc2d0d75354c@5925182_oswg11441790oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪研究院院长邹萍</p>\n  <p>邹萍特别强调，番禺作为大湾区“智造创新城”，拥有汽车产业基底、大学城“智核”资源以及新兴产业的协同生态，也有广汽、埃安、希音、小鹏汇天等头部企业，产业创新成果持续涌现，优质科创项目供给充足，正处于资本与创新要素汇聚的风口。番禺可以通过紧抓具身智能、低空经济等未来产业机遇，进一步放大产业配套与场景开放优势，打造华南地区最具投资潜力的增长极。</p>\n  <h2>企业心声：五家领军企业共话合作期待</h2>\n  <p>在交流环节，5家来自非本地的行业领军企业依次登台，分享了各自的发展成就与落地广州番禺的具体诉求。</p>\n  <p>丘脑智能科技 CEO张源介绍了公司全球首个多模态长记忆benchmark。该技术通过创新轻量化数字神经架构，在AI记忆基准测试中取得领先——综合准确率超80%，token消耗最高降低49.9%，延迟控制在600毫秒以内。张源表示，丘脑智能计划依托广州大学城的高校人才资源，落地“AI前沿记忆模型创新中心”，通过“项目+人才”模式实现产学研本地转化，同时赋能番禺本地的智能网联汽车、陪伴式机器人及智能穿戴硬件，助力番禺从“传统智造”向“高附加值AI智造”升级。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_6641074ee0b54e8297d799669bf048b3@5925182_oswg5906228oswg4786oswg3191_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">丘脑智能科技 CEO张源</p>\n  <p>Easenory Technology Limited 联合创始人王东博士展示了全球领先的弹性织物PCB技术，公司液态金属纤维毡技术可实现200%拉伸、100次机洗后性能保持稳定，相关产品可应用于具身智能灵巧手触觉感知、电子皮肤贴片、智能服装等领域。王东表示，希望借助番禺完善的供应链体系加速试产与量产推进，将香港的前沿研发成果与番禺的制造能力深度结合。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_254a90644d2b47dfb18ddf2ebfcd7f62@5925182_oswg5259082oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Easenory Technology Limited 联合创始人王东</p>\n  <p>万拿机器人创始人兼CEO程二亭介绍了公司专注“灵巧操作”核心部件的技术布局。公司成立仅1年已迈入产业化阶段，产品矩阵覆盖从核心零部件到整机解决方案的全链路上肢操作方案。程二亭表示，番禺不仅是市场，更是万拿机器人华南战略布局的重要支点。公司正在进行Pre-A轮1亿元人民币融资，希望依托番禺在智能硬件供应链和广汽等链主企业的带动效应，实现“研发－打样－量产”的快速闭环。未来三年，万拿机器人计划与番禺共建具身智能产业生态，形成华南区域总部。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_4d88005ac48a406ca002dacf60f29c8c@5925182_oswg15251781oswg4636oswg3091_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">万拿机器人创始人兼CEO程二亭</p>\n  <p>物启科技联合创始人兼CEO谢志渊展示了全球首款集成个人连续记忆的穿戴式智能体“Nuna”。该产品搭载行业首创的隐私保护技术，通过端侧多模态感知与AI情绪算法，实现无感持续感知、自动情绪日记、心率曲线记录等功能，所有数据本地处理、不上云、离线可用。谢志渊强调，物启科技不仅追求技术创新，更深度践行社会公益——长期支持黑客松赛事、与妇联合作关注女性心理健康、支持国际慈善机构。他希望番禺在应用场景对接、产业基金支持方面给予助力，让“隐私优先型端侧AI可穿戴”从番禺走向世界。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_861175dbcc70452280f2944d57bc9245@5925182_oswg6883031oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">物启科技联合创始人兼CEO谢志渊</p>\n  <p>合肥晟泰克副总经理李志强介绍了公司作为国家级专精特新重点“小巨人”企业的23年发展历程。公司拥有20余家主机厂客户，进入现代汽车、梅赛德斯奔驰供应体系，海外出口快速增长。近年来，晟泰克积极拓展具身智能机器人、低空经济等创新领域，成立机器人事业部，布局具身智能感知解决方案。李志强表示，番禺拥有完善的汽车产业链和低空经济政策环境，晟泰克希望将全域传感器和系统集成解决方案导入番禺，共同打造“从汽车到机器人到飞行器”的全域感知中枢。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_dc1237bbf66d4ec5a595b8ac39e0daba@5925182_oswg6577834oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">合肥晟泰克副总经理李志强</p>\n  <h2>智慧碰撞：对话详解AI时代发展方向，本地高潜力企业展示硬核创新</h2>\n  <p>在“投资与发展对谈”环节，腾亚创变创始人谢亚芳与光帆科技联合创始人陈康达展开深度对话，围绕产业资本价值、大湾区供应链支撑及AI终端投资风向等热点话题分享实战洞察。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_6c8bea02c7164dff8af8eedf76f22fa5@5925182_oswg953706oswg2000oswg1333_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">腾亚创变创始人谢亚芳与光帆科技联合创始人陈康达</p>\n  <p>陈康达结合公司发展经验指出，大湾区在AI硬件产业链上拥有不可替代的生态优势。任何AI硬件企业，无论是国内初创企业还是OpenAI、苹果、Meta等海外巨头，要落地硬件产品，最终都需要依托中国，尤其是大湾区的上游供应链和ODM能力。这正是大湾区最核心的竞争力。以光帆科技为例，其总部虽设在北京以获取AI人才，但所有硬件相关的研发与生产环节，第一时间就放在了深圳及辐射的周边区域。这种“软件人才用北京，硬件供应链靠大湾区”的分工格局，充分证明了大湾区在全球AI硬件版图中的独特地位。</p>\n  <p>在随后的本地企业展示环节，两家番禺本土高成长潜力企业——广州诺顶智能科技有限公司、广东酷库智能机器人有限公司也在大会上惊艳亮相，凭借企业的技术实力和市场表现引发在场投资机构浓厚兴趣。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_49bed600ecd44afeb50ccecb81a7bfca@5925182_oswg5281815oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">诺顶智能副总经理郝欣</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_d9d8c4db0be94dcb83bb56c693f80ea6@5925182_oswg8132694oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">酷库智能机器人CTO李雍丞</p>\n  <h2>资本赋能：四大知名投资机构发布番禺支持计划</h2>\n  <p>大会投资机构发言环节，四家知名投资机构先后登台，发布了支持番禺产业发展的专项计划。</p>\n  <p>东方富海合伙人高剑光介绍了公司成立近20年的投资实力——累计管理资金规模数百亿元，投资项目超600个，覆盖智能网联汽车、AI与具身智能、新能源新材料、低空经济等六大方向，与番禺“2104”现代化产业体系高度契合。高剑光发布了东方富海赋能番禺的四点举措：资本赋能——为番禺培育“专精特新”和潜在独角兽企业；产业赋能——依托600+投资项目生态，帮助番禺企业对接产业链资源；投后赋能——“七点打造计划”涵盖管理、融资、人才、市场等全方位服务；资源赋能——对接深圳及大湾区创新资源，推动深番两地产业协同。高剑光同时提出三点合作诉求：希望番禺在基金落地、税收优惠政策方面给予支持；建立常态化项目对接机制；共建“深番科技创新走廊”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_87de11ca800741069405395ab78695b4@5925182_oswg7646140oswg4752oswg3168_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">东方富海合伙人高剑光</p>\n  <p>L2F光源创业者基金合伙人林义伟分享了公司的投资布局，他表示将重点关注番禺在智能网联汽车、人工智能、低空经济等赛道的优质项目，为番禺企业提供从战略咨询到资本运作的全链条服务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_82cca0352d6f42d08ef110edc7444f2f@5925182_oswg5520226oswg4726oswg3151_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L2F光源创业者基金合伙人林义伟</p>\n  <p>知行研习院投资副总裁张骏详细介绍了知行研习院专注于科技创业者“科技×商业”的系统性赋能的独特模式。知行研习院已成功孵化并投资了大疆创新、云鲸、正浩创新、海柔机器人等多家独角兽企业。张骏表示，知行研习院期待与番禺区开展三方面合作：一是推动已投项目落地番禺；二是与广州大学城高校建立深度合作；三是为番禺在地企业提供商业化辅导、供应链支持和人才输送。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_0e1d928077964d9c8192f66e23e3fa48@5925182_oswg6484561oswg4687oswg3125_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">知行研习院投资副总裁张骏</p>\n  <p>创东方投资管理合伙人高宇辉介绍了公司在科创投资领域的丰富经验，他表示，看好大学城的科创机遇。番禺正加速从“制造”向“智造创新城”跃升，在“新浪潮”引领下，“AI+制造”将释放巨大潜能。尤其是在低空经济赛道，番禺可充分发挥制造业配套优势，积极承接深圳产业外溢，汇聚小鹏汇天等头部企业力量，打造粤港澳大湾区低空经济的新名片、新增长极。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_339aadbc32654826b66ea240cf36e6fa@5925182_oswg8337467oswg4800oswg3200_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">创东方投资管理合伙人高宇辉</p>\n  <h2>潮涌番禺，智创未来</h2>\n  <p>本次大会不仅是一次政府、产业与资本的精准邂逅，更是番禺向全球投资者、创业者发出的共享机遇、共赢未来的诚挚邀请。广州番禺将始终以最优环境、最好政策、最高礼遇，迎接每一位“城市合伙人”，共同在新浪潮中书写高质量发展新篇章。</p>", "category": "tech", "published_at": "2026-06-16T09:31:45+00:00", "fetched_at": "2026-06-17T03:38:39.214927+00:00", "fingerprint": "e46f289352141fe0"}, {"source": "36氪 - 最新文章", "title": "鸿蒙智行全面引入电池二供，国轩高科将上车问界｜36氪独家", "url": "https://36kr.com/p/3855879311823873?f=rss", "summary": "<p>今年以来，市场竞争进一步加剧，内存等供应链成本大幅攀升，寻求供应链降本、使产品定价更具竞争力，成了汽车行业更为迫切的课题。</p>\n  <p>在这样的背景下，36氪从多位产业人士处了解到，稳居中高端市场的鸿蒙智行也开始全面引入多家动力电池供应商。</p>\n  <p>“除了尊界短期内规模支撑不了第二家，其他界可能都会引入多元电池供应商。”有知情人士透露。</p>\n  <p>据36氪了解，其中，长期由宁德时代独供的问界品牌，将引入中创新航、国轩高科两家二线电池供应商，问界M6现已定点了国轩高科的81度电池包，有知情人士透露，去年国轩高科便已收到了鸿蒙智行的定点信，中创新航也将进入问界的供应体系。</p>\n  <p>而就在2022年8月，赛力斯曾与宁德时代签署了五年长期战略合作协议，双方宣布问界车型，全面搭载宁德时代动力电池。去年6月，宁德时代在问界超级工厂内的产线投产，这是宁德时代首次落地“厂中厂”模式，也是它在重庆的第一条电池产线。宁德时代与问界合作程度之紧密，可见一斑。</p>\n  <p>36氪还了解到，智界品牌的动力电池，原本由宁德时代与中创新航供应，现即将引入国轩高科与欣旺达。</p>\n  <p>据接近欣旺达和国轩高科的行业人士透露，智界V9和智界R7两款车，或将搭载欣旺达的53度三元电池包，智界RX、智界R7初步规划，搭载国轩高科的81度磷酸铁锂电池包。</p>\n  <p>而且，国轩高科的81度磷酸铁锂电池包，或还将搭载在尚界品牌车型上。此前，尚界品牌的电池供应商只有宁德时代和中创新航。有国轩高科人士表示，“鸿蒙智行正在对国轩高科的工厂，进行量产前的审核”，“华为还派人入驻了国轩高科的电芯产线”。</p>\n  <p>不久前的粤港澳大湾区车展上，中创新航与国轩高科都在自家展台上，露出了“巨鲸电池”的标签。华为一直在向外界推广“巨鲸电池”这一概念。据了解，巨鲸电池是华为的标准体系，对外是华为的电池品牌。电池厂商通过了巨鲸电池的审核标准，才能进入鸿蒙智行的供应链。</p>\n  <p>但也有接近鸿蒙智行的行业人士强调：“没上工信部公告之前，以上这些计划都存有变数。宁德时代也在积极争取更高的采购额。”</p>\n  <p>有电池行业商务告诉36氪，同样电量的电池包，欣旺达对鸿蒙智行的报价，“比宁德时代低了10%左右”。</p>\n  <p>今年，内存和碳酸锂价格的上涨，为汽车行业带来了巨大的成本压力。</p>\n  <p>对鸿蒙智行这一品牌而言，要想完成2026年交付100万台车的目标，它需要通过供应链的降本，使整车拥有更大的定价空间。尤其在市场容量更大的中低端市场，问界M6、尚界Z7等车型还需要攫取更多的份额。</p>\n  <p>36氪了解到，问界M6定点二线电池厂商的原因之一，正是企业“对问界M6目前的订单量不够满意”，希望通过降本和调整售价，使产品更有性价比。</p>\n  <h3><strong>供应链成本压力，笼罩汽车行业</strong></h3>\n  <p>长期以来，华为都在努力强化外界对“巨鲸电池”的认知，它是华为的电池开发标准，对外是华为电池品牌。</p>\n  <p>有行业人士告诉36氪，巨鲸电池的标准比行业普遍标准都高，“比如高温热失控实验，华为的要求是，在电池包、整车、周边环境都很热，电量又约为100%的情况下，电池包热失控后不会爆炸。很少有比这更严苛的了”。而电池厂只有先通过了这套标准，才能进入鸿蒙智行供应链。</p>\n  <p>上周的中国汽车重庆论坛上，赛力斯董事长张兴海公开称，问界品牌平均一辆车的成本增加了1.5万元-2万元，压力很大。</p>\n  <p>这番话，反映了今年供应链成本大幅增长，车企普遍承受着严酷成本压力的行业现状。</p>\n  <p>纵然是有一定溢价空间的高端品牌，面对“涨到接近100元一个单位”的存储芯片，以及“从去年同期的8万元/吨到今年的18万元/吨”的碳酸锂价，亦有捉襟见肘之感。”蔚来汽车创始人，曾在今年5月接受媒体采访时表示：“哪怕主打高端、有溢价的品牌，利润空间也被不断压缩，经营压力很大。”</p>\n  <p>这在某种程度上，促使鸿蒙智行全面引入动力电池二供。</p>\n  <p>每当车企寻求降本，最先锁定的零部件，往往是占整车成本约30%的动力电池。但在较为强硬的行业龙头面前，车企往往难以争取到议价权。因此，引入中创新航、国轩高科等二供，是动力电池降本的更直接方式。</p>\n  <p>36氪了解到，欣旺达的电池包报价，“比宁德时代低了10%左右”。行业人士向36氪分析，以53度的三元电池为例，10%的价差可能对应着近2000元的成本差距。在供应链成本被压榨到极致的今天，这是相当可观的降本幅度。</p>\n  <p>再加上，欣旺达、国轩高科等二线动力电池厂商，对主机厂的配合度往往更高。</p>\n  <p>有国轩高科、欣旺达人士告诉36氪，引入电池二供，车企其实也需要付出一定代价，“比如要做很多样车，安排人员做标定和匹配，做整��的公告、电池公告。但国轩高科、欣旺达为了进入鸿蒙智行供应链，可以自己承担电池公告等费用”。</p>\n  <p>当然，宁德时代并不会轻易放弃鸿蒙智行这个头部客户。消息人士透露，为了与二线电池厂争夺鸿蒙智行的订单，宁德时代也会评估定价策略。</p>\n  <h3><strong>鸿蒙智行加速向中低端市场渗透</strong></h3>\n  <p>让鸿蒙智行决心大举引入电池二供的，或许还有销量层面的考量。</p>\n  <p>2025年底，华为常务董事余承东曾在央视年度直播中表示，2026年鸿蒙智行将推出超10款新车，全年交付目标100万—130万台。五大品牌全覆盖15-150万元价格带，靠新品冲增量。</p>\n  <p>眼下，尚界Z7、智界V9、问界M6等新车已相继发布，但在售车型的增加，尚未转化成鸿蒙智行销量的大幅增长。今年5月，鸿蒙智行销量同比增长接近3.8%，销量增速低于零跑、小鹏等新势力品牌。</p>\n  <p>据鸿蒙智行官方信息，今年1-5月，鸿蒙智行累计交付量不超过20万辆，其中超过13万辆由问界品牌贡献。相较一年交付100万辆的目标，鸿蒙智行面临着较大的任务缺口，且至今尚未摆脱对问界单一品牌的过度依赖。</p>\n  <p>高端市场仍是鸿蒙智行的舒适区，但问界M9、尊界S800等车型所处的价格带，其市场容量终究有限。何况，新款问界M9，正遭受极氪9X、理想L9、蔚来ES9等一众竞品车型的围攻。</p>\n  <p>高端市场迎来劲敌，在市场容量更为广阔的中低端市场，小鹏、小米等品牌，也在降价加量对尚界Z7、问界M6、智界R7等车型发起冲击。</p>\n  <p>今年1月，小鹏P7+上市，起售价下调超3万元至18.68万，小米YU7新增了标准版车型，将起售价下探至23.35万元，依然搭载全套激光雷达、高阶辅助驾驶。</p>\n  <p>性价比，是中低端消费群体最为看重的卖点之一，但囿于华为智能化解决方案+宁德时代动力电池高企的成本，此前鸿蒙智行推出的尚界H5、智界S7、智界R7等中低端车型，均未取得理想的市场表现。</p>\n  <p>而今，销量承压的鸿蒙智行，尝试通过供应链降本，加速向中低端市场渗透。</p>\n  <p>有接近问界的行业人士告诉36氪，鸿蒙智行五界都有各自的降本方式，问界其实一直在向其他几个“界”学习降本，也早就想引入电池二供，华为与赛力斯曾为此协商过多次。随着企业逐渐意识到华为+宁德时代的解决方案成本太高，国轩高科的81度电池包，将于今年内上车问界M6。</p>\n  <p>今年4月的鸿蒙智行春季新品发布会上，问界M6起售价为25.98万元，引入电池二供后，问界M6又新增了Max 纯电后驱81度、Max+ 纯电后驱81度两个车型版本，价格分别是22.98万元和24.98万元。</p>\n  <p>这意味着，问界M6的起售价比小米YU7低了数千元，比理想i6低了约2万元。在车市竞争白热化的今天，数千元乃至上万元的优惠，或将成为产品销量的有力助推器。</p>\n  <p>智界也在尝试更具性价比的动力电池方案。有接近鸿蒙智行的人士表示，智界正评估搭载宁德时代的三元、磷酸铁锂混合体系电池。</p>\n  <p>据初步估算，同样是100度电量，混合体系电池包的成本，比三元电池包低数千元。“bom成本降低5000元，意味着整车的终端售价可以下调超过1万元”。</p>\n  <p>长久以来，鸿蒙智行的路径是，都是通过科技赋能品牌溢价，快速占据高端市场，但随着合作品牌阵营扩大，覆盖市场区间随之放宽，也同样需要严控供应链成本，以维持市场竞争力，这或许正是它扩大市场份额的开始。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_2aed05ccf4d5431590450b808f5256aa@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-06-16T13:24:26+00:00", "fetched_at": "2026-06-17T03:38:39.214920+00:00", "fingerprint": "e7554cb67696960d"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨连涨3天，SpaceX超越亚马逊跻身全球前五；支付宝启动史上最大改版；微信支付“AI专属卡”最快本周内上线", "url": "https://36kr.com/p/3856525981275138?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>山姆中国变更董事长</li>\n   <li>海康威视7月1日上调硬盘价</li>\n   <li>5月份全球纯电和插电式混动汽车销量连续三个月增长</li>\n   <li>美国零售经纪商处的SpaceX投资者每人至少分得一股IPO股票</li>\n   <li>传苹果首款折叠屏将延期发布，产业链人士：假的</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>连涨3天，SpaceX超越亚马逊跻身全球前五</strong></p>\n  <p>6月16日，SpaceX开盘迅速拉升，涨幅一度扩大至17%，市值一度超越微软，盘中总市值触及2.94万亿美元，跃居世界第四大市值公司，而第三名的苹果市值为4.37万亿美元。截至收盘，SpaceX股价收涨4.8%，市值达到2.65万亿美元，较亚马逊高出约80亿美元。上市以来，SpaceX已累计飙升49%。这家刚刚完成轰动性IPO的公司，在上市第三天就超越了亚马逊，成为全球市值第五大上市公司。</p>\n  <p>据《福布斯》最新发布的全球富豪榜，特斯拉与SpaceX掌门人埃隆·马斯克的个人财富一度飙升至惊人的1.4万亿美元，刷新历史纪录。 (金十数据、财联社)</p>\n  <p><strong>AI版支付宝正式推出，是支付宝史上最大改版</strong></p>\n  <p>6月16日，AI版支付宝正式推出，命名“阿宝”，用户在支付宝“往右一滑”即可体验，上万种服务都能在一个对话框一句话办完。记者了解到，目前新版本已启动邀请测试，后续将逐步向全量用户开放。据报道，这是支付宝史上最大改版。（贝壳财经）</p>\n  <p><strong>微信支付“AI专属卡”最快本周内上线</strong></p>\n  <p>记者获悉，微信支付正联合腾讯智能体产品WorkBuddy测试AI支付功能，计划在微信钱包中上线“AI专属卡”。该功能最快将于本周内上线。记者16日就上述信息向微信支付方面求证，至发稿未获回应。（财联社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Anthropic启用实名制验证，未来可能要求用户进行年龄或身份验证</strong></p>\n  <p>近日，部分网友收到来自Anthropic的官方邮件，称平台即将更新针对Free、Pro及Max用户的隐私政策。其中最引人关注的一点是：未来可能要求用户进行年龄或身份验证。邮件显示，此次隐私政策更新主要围绕四个方面：多步骤任务与第三方应用的连接、身份验证信息的收集与使用、用户参与研究项目时的信息处理，以及整体数据共享规则的进一步说明。Anthropic在官方支持页面解释，此前身份验证仅在涉及未成年人、违规用户或不支持地区的账户等特定场景下使用。未来，随着代理任务复杂度的提升，验证范围将逐步扩大。（新浪科技）</p>\n  <p><strong>支付宝新产品Token Pay，首接最新国产大模型MiniMax M3</strong></p>\n  <p>36氪获悉，MiniMax最新大模型M3，全面接入支付宝TokenPay一站式全栈解决方案。据了解，MiniMax是全球首批将Token Pay支付能力融入核心订阅体系的大模型厂商，这也标志着，由支付宝发布的国内首个面向MaaS（模型即服务）支付解决方案投入规模化应用。MiniMax还将于近日全线接入支付宝全栈AI支付产品，面向开发者、个人用户升级服务体验，全面加速商业化进程。</p>\n  <p><strong>阿里云：QoderWork上线“意识”功能</strong></p>\n  <p>36氪获悉，据阿里云消息，阿里桌面AI助理QoderWork上线“意识”功能，集成记忆、反思、技能进化三个模块。该功能在保存对话的基础上，可主动整理和淘汰冗余信息，并将高频任务沉淀为可复用的技能。</p>\n  <p><strong>美团AI原生团队孵化的“Agent社区”觅游面向全量用户开放公测</strong></p>\n  <p>36氪获悉，6月15日，首个主打“AI智能体”自主学习、成长的“Agent社区”觅游面向全量用户开放公测。据了解，觅游由美团基础研发平台AI原生团队孵化，此前已内测超过3个月的时间。目前，觅游支持关联包括OpenClaw、Codex、Claude Code、Hermes在内的各类主流AI智能体。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>山姆中国变更董事长</strong></p>\n  <p>36氪获悉，天眼查App显示，沃尔玛（中国）投资有限公司发生工商变更，MUK SOOK YE卸任法定代表人、董事长，由刘鹏接任。该公司成立于2003年4月，注册资本约3.3亿美元，经营范围包括第一类医疗器械销售、国内贸易代理、日用百货销售等，由沃尔玛中国有限公司全资持股。</p>\n  <p><strong>小红书最快或下半年赴港上市 ，年底私人二级市场估值达500亿美元</strong></p>\n  <p>据报道，消息人士称，小红书已聘请包括高盛集团和中金国际的投行，为其潜在的香港IPO提供服务。目前尚不清楚此次IPO的具体募资规模和估值。但另外两名消息人士称，小红书在去年年底的私人二级市场交易中估值一度高达500亿美元。他们表示，小红书最快可能于今年下半年上市。（新浪财经）</p>\n  <p><strong>美团：将持续优化计价、时长预估、路径规范等算法</strong></p>\n  <p>36氪获悉，美团发文称，将持续优化计价、时长预估、路径规范等算法，落实取消超时扣款、改进服务分规则、算法协商恳谈等措施，探索复杂配送场景自动识别与补时、“难送”订单动态补偿，不断提升骑手配送体验与用户服务质量，推动算法治理取得新进展新成效。</p>\n  <p><strong>阿里云张翅：超10万卡平头哥真武芯片已在金融行业部署</strong></p>\n  <p>6月16日，在第32届中国国际金融展上，阿里云智能集团公共云事业部副总裁、新金融行业总经理张翅透露，平头哥自研真武AI芯片在金融行业的部署规模已突破10万卡，覆盖银行、证券、保险、基金等超过150家主流机构。（证券时报）</p>\n  <p><strong>百胜中国宣布收购必胜客品牌在中国大陆的所有权</strong></p>\n  <p>36氪获悉，百胜中国宣布，已与Yum! Brands签署最终协议，以12亿美元现金对价收购必胜客品牌在中国大陆的所有权。该交易预计将于2026年第三季度交割，完成后必胜客中国将无须再向Yum! Brands支付此前适用的特许经营费。在可比口径下，公司维持2026年全年财务指引不变，并预计该交易可立即提升必胜客中国、进而提升百胜中国整体的餐厅利润率和经营利润率。</p>\n  <p><strong>海康威视7月1日上调硬盘价，知情人士：原厂三季度硬盘成本涨幅超50%</strong></p>\n  <p>据报道，从知情人士处获悉，海康威视近日已向经销商下发硬盘调价函，自今年7月1日起，公司硬盘产品价格将进行同步上调。此外，7月1日之前，海康威视旗下其他产品也将先行完成一轮涨价，而此次硬盘价格上调主要针对经销商渠道。面对当前供应与价格波动较大的形势，海康威视已建议经销商尽快锁定订单与价格。实际上，这并非海康威视首次调价，也并非其个例行为。对于本次调价的原因，知情人士表示，核心在于AI需求的“爆发式”增长所带来的持续性挤兑效应。（财联社）</p>\n  <p><strong>受高油价影响，5月份全球纯电和插电式混动汽车销量连续三个月增长</strong></p>\n  <p>咨询公司Benchmark Mineral Intelligence（BMI）16日公布的数据显示，受补贴政策与高油价持续推动燃油车向新能源车转型影响，5月全球电动汽车需求量连续第三个月实现增长。BMI表示，5月份新注册的纯电动汽车和插电式混合动力汽车数量同比增长3%，达到约180万辆，使得今年前五个月的总销量比去年同期增长0.9%。（新浪财经）</p>\n  <p><strong>多城市土地市场升温，头部房企忙补仓</strong></p>\n  <p>核心城市土地市场热度持续提升。近期，深圳、苏州等多个热点城市接连出现高溢价成交地块，部分地块经过数百轮竞价争夺，刷新区域乃至城市楼面价纪录。中指研究院深圳分院高级分析师孙红梅表示，深圳前海桂湾地块是前海发展最成熟、定位最高的金融总部板块，近5年仅公开出让2宗纯商品住宅用地，核心居住用地稀缺性极强。本次地块规模更大、地形更规整，产品打造空间更充足，因此竞拍热度较高。（证券日报）</p>\n  <p><strong>红板科技：AI服务器PCB相关产品目前仍处于客户端产品验证环节</strong></p>\n  <p>36氪获悉，红板科技在互动平台表示，公司光模块PCB相关产品已顺利完成800G、1.6T规格的技术验证，下游合作客户覆盖行业内多家头部企业。目前光模块PCB产品正常小批量生产中，按客户项目进度有序安排出货，整体供货节奏根据客户订单需求动态调整。AI服务器PCB相关产品目前仍处于客户端产品验证环节，相关量产落地进度将取决于客户测试结果及项目推进计划。</p>\n  <p><strong>消息称台积电向供应链发布玻璃基板开发计划，首次公开技术进度</strong></p>\n  <p>设备端称，台积电近期向供应链发布“CoWoS玻璃基板开发计划”，确定携手ABF载板厂商Ibiden与面板厂商群创，共同验证玻璃基板导入CoWoS先进封装的可行性。这是台积电首次公开玻璃基板技术应用进程，意味着玻璃基板正式跨入产业化验证阶段。不过玻璃基板距离全面量产仍有一段距离，台积电强调，未来仍需持续研究验证玻璃厚度及大型CoWoS封装布局。（新浪财经）</p>\n  <p><strong>中美航线10月再增班</strong></p>\n  <p>达美航空16日宣布将于2026年10月7日起增加上海至洛杉矶的直飞航班，由现在的每周三班加密至每周五班。（第一财经）</p>\n  <p><strong>美股三大指数收盘涨跌不一，热门中概股普跌</strong></p>\n  <p>36氪获悉，6月16日收盘，美股三大指数涨跌不一，道指涨0.64%，纳指跌1.15%，标普500指数跌0.57%。美股大型科技股涨跌不一，英特尔跌超8%，英伟达跌超2%，特斯拉，微软跌超1%，亚马逊小幅下跌，SpaceX涨超4%，Meta、谷歌涨超1%，苹果涨近1%。热门中概股普跌，小鹏集团跌超4%，百度，蔚来，哔哩哔哩跌超3%，拼多多，理想汽车跌超2%，阿里巴巴，京东跌超1%。</p>\n  <p><strong>美国零售经纪商处的SpaceX投资者每人至少分得一股IPO股票</strong></p>\n  <p>美国一些最大零售经纪公司的客户，在SpaceX规模达862亿美元的IPO中，每人都至少分得了一股。据各家公司的代表称，所有在Robinhood Markets Inc.、嘉信理财（Charles Schwab Corp.）、富达投资（Fidelity Investments）以及SoFi Technologies Inc.运营的平台上提交新股申购请求的合格客户，都获得了部分股票分配。（新浪财经）</p>\n  <p><strong>传苹果首款折叠屏将延期发布，产业链人士：假的</strong></p>\n  <p>日前，有消息称苹果首款折叠屏机型iPhone Ultra已从原定的2026年秋季推迟至2027年初上市发售，延期主要源于铰链设计和PCB工艺问题。对此，苹果公司产业链人士回应称：“假的。”（证券时报）</p>\n  <p><strong>三星MPW服务或于2027年扩展至2nm</strong></p>\n  <p>三星晶圆代工执行董事宋泰正表示，该公司的MPW服务预计将于2027年扩展到2nm制程节点。MPW（多项目晶圆）允许在单个晶圆上制造来自不同公司的多个芯片设计，帮助无晶圆厂公司降低原型制作成本并验证大规模生产的准备情况。（新浪财经）</p>\n  <p><strong>意大利反垄断机构对苹果发起调查，涉第三方云服务公平接入问题</strong></p>\n  <p>意大利竞争与市场管理局（AGCM）6月16日宣布，对苹果公司展开调查，以评估其是否遵守欧盟《数字市场法》（DMA）有关互操作性的要求。根据《数字市场法》，苹果需确保第三方消费者云服务提供商能够免费、有效地与iOS和iPadOS系统实现互操作，并在平等条件下获得与苹果iCloud相同的软硬件功能访问权限。意大利竞争管理局表示，已有迹象显示第三方云服务商可能未获得与iCloud同等的功能支持。（界面新闻）</p>\n  <p><strong>软银与OpenAI将在日本推出AI网络安全服务</strong></p>\n  <p>6月16日，据报道，软银创始人兼首席执行官孙正义在新闻发布会上表示，软银与OpenAI将为企业客户提供“补丁即服务（patching as a service）”。该服务将帮助企业评估安全漏洞，以保障关键基础设施的安全。孙正义表示：“利用先进AI发起的网络攻击将日益猖獗。我们决心利用最前沿的AI技术来抵御这些攻击。”（界面新闻）</p>\n  <p><strong>美国法官驳回马斯克旗下xAI对OpenAI提出的商业窃密诉讼</strong></p>\n  <p>美国一名联邦法官15日驳回了马斯克的人工智能公司xAI对竞争对手OpenAI提出的诉讼，该诉讼指控OpenAI窃取聊天机器人相关的商业机密。旧金山联邦地区法官Rita Lin表示，xAI未能证明OpenAI诱导前xAI高级工程师Xuechen Li泄露与其Grok聊天机器人相关的机密信息，也未能证明OpenAI的工程师们知晓Xuechen Li可能已泄露了任何机密信息。（新浪财经）</p>\n  <p><strong>OpenAI去年总支出据悉达340亿美元，研发投入约190亿</strong></p>\n  <p>据报道，OpenAI去年总支出达340亿美元，以求在计划的首次公开募股（IPO）之前抢占蓬勃发展的人工智能市场主导地位。报道称，经审计的财务数据显示，这家ChatGPT开发商2025年研发投入约190亿美元，销售及营销支出近60亿美元，此外还有其他各类开支。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>小牛自动化启动IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，宁夏小牛自动化设备股份有限公司（简称“小牛自动化”）于2026年6月15日在宁夏证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为国信证券。</p>\n  <p><strong>北京四方继保自动化股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，北京四方继保自动化股份有限公司向港交所提交上市申请书，独家保荐人为华泰国际。</p>\n  <p><strong>上海君赛生物股份有限公司-B向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，上海君赛生物股份有限公司-B向港交所提交上市申请书，独家保荐人为中信证券。</p>\n  <p><strong>白鸽在线通过港交所上市聆讯</strong></p>\n  <p>36氪获悉，港交所文件显示，白鸽在线（厦门）数字科技股份有限公司通过港交所上市聆讯。</p>\n  <p><strong>清微智能IPO辅导状态变更为“辅导验收”</strong></p>\n  <p>36氪获悉，证监会网站显示，近日，北京清微智能科技股份有限公司IPO辅导状态变更为“辅导验收”，辅导券商为华泰联合证券。</p>\n  <h2>投融资</h2>\n  <p><strong>硅基流动完成新一轮超20亿元融资</strong></p>\n  <p>36氪获悉，近日，硅基流动已完成超20亿元B轮融资。本轮融资由携程战投、晶科能源控股、金蝶股份、壁仞战投、蔚来资本、商汤战投、巨人网络、国泰君安创新投、等产业资本、财务机构和国资联合投资，华兴资本担任独家财务顾问。过去一年，公司通过Token工厂模式提供高效 MaaS（模型即服务），日均Token调用量达数万亿，服务超1000万用户和1万家企业客户，营收同比增长超10倍，海外市场单月营收达数百万美元。</p>\n  <p><strong>“深朴智能”完成数亿元Pre-A轮融资</strong></p>\n  <p>36氪获悉，据深朴智能消息，近日，通用具身智能机器人公司“深朴智能”（Simple AI）宣布完成数亿元Pre-A轮融资。本轮融资由滴滴领投，梅花创投、柯力传感跟投，老股东创世伙伴创投、线性资本、普华资本持续加码。本轮融资完成后，深朴智能将进一步加速具身智能机器人在真实场景中的产品迭代与规模化商用，重点推进Simple-World Model迭代升级、具身智能数据体系建设、核心人才引进及泛家庭场景的落地布局。</p>\n  <p><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-06-17T00:22:06+00:00", "fetched_at": "2026-06-17T03:38:39.214913+00:00", "fingerprint": "f7778e54585e78ba"}, {"source": "36氪 - 最新文章", "title": "「逆矩阵」完成超亿美元融资，创始人：通用世界基座模型窗口期已压至18个月", "url": "https://36kr.com/p/3826129009234824?f=rss", "summary": "<p>文｜王毓婵</p>\n  <p>编辑｜张雨忻</p>\n  <p>2026 年以来，一级市场对世界模型的抢筹进入白热化阶段。资金不再像早期那样“广撒网”，而是高度向头部玩家集中。这其中，逆矩阵科技（Physis）就接连完成了多轮融资。</p>\n  <p>36氪智能涌现独家据悉，世界模型公司逆矩阵科技已完成超亿美元种子++轮融资；此前的 3 月，刚完成了超千万美元首轮融资。本轮由经纬创投、五源资本、光合创投等机构共同参与，并获蚂蚁集团战略投资，老股东高瓴创投、燕缘创投持续加注。</p>\n  <p>在本轮融资落定前后，逆矩阵发布了通用世界基座模型Physis-v0.1，并将其概括为“One For All”的通用物理世界应用。该模型主打物理正确、长程一致、动作因果、通用泛化四项能力，一次预训练即可服务具身智能、工业仿真、游戏物理、科学预测等多类场景。</p>\n  <p>逆矩阵计划于 2026 年底发布旗舰模型，过程中将放出开源切片和技术报告。本轮资金将主要用于通用世界基座模型的预训练研发、规模化训练体系建设。</p>\n  <p>团队由北大青年学者陈博远、吉嘉铭联合创立，一半是青年学者（含奥赛金牌、省市状元与多位顶会论文作者），一半是来自一线科技企业的资深工程人才。他们组成了一个 AI-native 的扁平化团队，没有层级汇报与季度指标，靠技术判断而非行政命令对齐方向；信奉自由探索、第一性原理与长期主义。</p>\n  <p>智能涌现在新一轮融资敲定之际，独家采访了陈博远。他回答了关于组织架构、融资节奏、技术路线、行业判断和场景落地等多个问题。</p>\n  <p>“行业内目前的共识是，18~24个月内，世界基座模型能力会出现标志性的阶跃，36个月内，能在多个真实场景完成实际应用落地。”陈博远说。“这与语言模型从 GPT-3 到 ChatGPT 的路径高度吻合。”</p>\n  <p>以下是智能涌现与陈博远的对话实录：</p>\n  <h2><strong>通用世界基座模型的窗口期正在从三年压缩到十八个月</strong></h2>\n  <p><strong>Q1：恭喜逆矩阵完成新一轮超亿美元量级的融资。距离上一轮融资仅仅过去不到两个月，为什么能保持这么快的融资节奏？</strong></p>\n  <p>陈博远：这背后反映了投资人对 AI 发展第三次范式跃迁的押注。</p>\n  <p>过去十年，AI 经历了语言模型（预测下一个词）和视觉生成模型（预测下一帧）两次跃迁，分别催生了平台级公司。现在的第三次跃迁是由 AI 从虚拟世界走向物理世界带来的，核心是面向物理空间“预测下一个物理状态”。</p>\n  <p>这套“给定当前状态与动作，预测世界如何演化”的范式，曾在 AlphaGo、机器人控制等子问题中出现过，如今正在收敛为同一套解法框架。但物理世界与虚拟世界的根本区别在于，物理世界是“部分可观测”的，模型不能只停留在“看到什么做什么”，必须理解底层的物理约束。</p>\n  <p>投资人愿意快速跟进并追加投资，主要基于两点判断：</p>\n  <p>一是“底层统一建模物理规律，上层按需适配不同场景”的基座模型路径正在成为行业共识；</p>\n  <p>二是通用世界基座模型的窗口期正在从三年压缩到十八个月，做通用预训练的团队会拥有更大的空间。一个领先的通用基座具有数据scaling和算法有效性，会构成难以被追赶的壁垒。</p>\n  <p><strong>Q2：在融资过程中，投资人问得最多的问题是什么？大家对技术走向落地的时间周期有怎样的共识？</strong></p>\n  <p>陈博远：问得最密集的是：“凭什么相信通用世界基座模型能做成？”以及“团队是否在坚定地做基座模型？”</p>\n  <p>在我们看来，能不能称之为基座模型，关键在于是否真正从物理预测这个目标出发去构建。于是我们从零开始解决物理预测目标，自研底层架构，并在训练分布外看到了合理的物理推演曙光。</p>\n  <p>逆矩阵的内部实验表明，随着数据和参数规模增加，状态预测误差持续下降，呈现出类似大语言模型的指数级 Scaling 潜力，而未出现垂类模型的饱和拐点。</p>\n  <p>关于落地周期，共识是 18~24个月内基座模型能力会出现标志性的阶跃，并在真实需求上取得高分；36个月内能在多个真实场景完成实际应用落地。这与语言模型从 GPT-3 到 ChatGPT 的路径高度吻合。届时，各个垂类场景将直接成为基座模型 API 的调用者，形成类似 AWS 与 SaaS 的关系。</p>\n  <p><strong>Q3：为什么没有在当下引入产业基金投资？</strong></p>\n  <p>陈博远：现阶段我们最需要的是把\"弹药\"集中到一个方向，去攻克通用世界基座模型的研发与算力门槛。这是一件需要长期、专注投入的事。</p>\n  <p>我们现在不急于做商业化，这是我们在这个阶段做出的价值判断。对一家做通用基座的公司来说，过早把模型绑定到某个垂直场景去变现，看上去摘到了眼前的果实，实际上是给自己画了一道边界：一旦围绕单一场景去采数据、调模型、做交付，就会逐渐退化成\"一个场景、一套模型\"。</p>\n  <p>我们相信物理规律的通用解是存在的，重力、碰撞、摩擦等等在任何场景里都是同一套规律。基座的价值在于跨场景复用。所以我们不急于变现，并不意味着不重视商业化。我们看重商业化，但现阶段更愿意先把基座的物理理解能力打扎实；商业化的节奏，会随着技术成熟和真实产业需求自然展开。</p>\n  <p>能力先于商业动作，组织风格保持克制。投资人最终愿意为可重复、可扩张的能力买单，而把这个能力打扎实，是我们当下唯一该做的事。</p>\n  <p><strong>Q4：你也是智源行为世界模型创新中心的负责人，逆矩阵和智源研究院之间有关联吗？</strong></p>\n  <p>陈博远：智源研究院一直定位在 AI 领域从 0 到 1 的原始创新，逆矩阵本身更加聚焦于通用世界基座模型的底层探索和商业技术开发。两者都在逼近同一个目标——让人工智能真正理解物理规律。</p>\n  <h2><strong>最关键的分水岭：真正具备基座模型潜力</strong></h2>\n  <p><strong>Q5：世界模型会有自己的 Scaling Law 吗？</strong></p>\n  <p>陈博远：物理世界一定有自己的 Scaling Law，但绝不能沿用语言模型或视频生成的 Scaling Law。 直接复制存在三个失效原因：</p>\n  <p><strong>数据受限</strong>：物理交互数据无法像互联网文本那样无限爬取，采集与筛选成本极高。</p>\n  <p><strong>像素不等于物理</strong>：视频中 90% 的信息，如纹理、光照、运动模糊等，是与物理规律无关的视觉冗余。</p>\n  <p><strong>相关性不等于因果性</strong>：纯观察只能学到统计上的相关性，而物理的核心是因果性，必须有“动作”的介入才能区分规律与巧合。 因此，我们必须在“物理隐空间”而非像素空间进行 Scale up。这包含四个关键技术判断：</p>\n  <p><strong>压缩</strong>：将世界编码为包含力、速度等抽象表征的高效物理隐空间，剥离视觉冗余。</p>\n  <p><strong>因果性</strong>：在隐空间原生引入动作干预，让模型理解动作导致的物理状态转移。</p>\n  <p><strong>验证</strong>：纯生成式的路径只有生成能力、缺少验证能力，容易出现穿透、失重这类“物理幻觉”。为此我们引入强化学习，如 RLVR 可验证信号奖励，通过明确的物理约束构建闭环对齐信号。</p>\n  <p><strong>通用</strong>：最终的隐空间必须能服务于不同场景（One for All），因为物理规律在不同场景中是同一的。</p>\n  <p><strong>Q6：在模型训练中，具体是怎么设计机制让模型从“主动干预”中学习的？为了防止模型在面对未见环境时发生物理推演崩溃，引入的具体奖惩机制又是怎样的？</strong></p>\n  <p>陈博远：物理世界规律产生于交互，而非被动感知。</p>\n  <p>因此，我们从零设计了模型架构，在底层物理隐空间原生引入动作。这不像传统的视频生成模型通过嫁接引擎来响应控制，就好比不能在没有方向盘的车上焊一个方向盘，然后宣称它是可操控的。</p>\n  <p>我们将动作，无论是关节运动量，还是移动残差向量，作为条件信号注入，去调制下一个物理状态的预测过程。这样，每一条数据的密度都翻倍了，模型学到的不再是“世界长什么样”，而是“采取何种动作，导致了什么转移”，从而实现从相关性到因果性的跃迁。</p>\n  <p>物理天然是可验证的。例如，物体不会凭空消失，赛车不能穿墙，流体不能像冰块一样倒出。因此，我们在强化学习中构建了自动化的物理验证沙盒。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260616/v2_5ac919906acb4d04b0f36f5a9bb075a1@10269314_oswg444986oswg1265oswg717_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">世界模型的 W0–W5 能力分级 逆矩阵制图</p>\n  <p><strong>Q7：逆矩阵提到的“W0-W5世界模型能力分级”中，你们目前处于哪一层？当“一个机器人能顺利打鸡蛋”时，模型属于第几层？</strong></p>\n  <p>陈博远：这分类对标了自动驾驶的 L0-L5。当前大部分模型处于 W0-W1，能响应动作并生成流畅视频，</p>\n  <p>逆矩阵正在攻克 W1 到 W2 的跃迁，这是最关键的分水岭。 W2 代表模型真正具备基座模型潜力，解决了“物理真实性”问题，理解了因果关系。 如果仅仅为了让机器人“打鸡蛋”，垂类训练也能做到极好的控制，但它可能只懂打鸡蛋的局部场景，不懂通用物理。</p>\n  <p>衡量基座模型是否足够好的核心在于“动作跟随性（Action Following）”和泛化能力。就像基座模型不仅会打鸡蛋，换到柔性材料场景也能玩溜溜球。大模型通过强化学习实现了通用数学代码推理的跃迁，世界模型也需要在明确的物理验证信号下学习，突破为通用的指数级跃迁。</p>\n  <p><strong>Q8：在这个模型攀登过程中，最核心的瓶颈是算力、数据还是算法？</strong></p>\n  <p>陈博远：我觉得都非常重要。但是如果只能选一个的话，我认为是在数据和算法背后反映的“范式”。因为他们三者其实是统一于底层范式的变革。</p>\n  <p><strong>数据层面</strong>：我们构建了数据金字塔。第一层是强物理交互的真实视频（学习世界状态）；第二层是第一人称（Ego-centric）视频与游戏引擎数据（学习动作导致的转移）；第三层则是极其稀缺的关键物理突变数据（如玻璃破碎、流体断裂），我们通过自建数据生产闭环来生产这部分高价值数据。</p>\n  <p><strong>算力层面</strong>：关键在于算力效率。在物理隐空间进行 Scaling，确保相同算力下学习到的都是有效物理信号，而非视觉噪音。</p>\n  <p><strong>算法层面</strong>：强化学习提供了无限供给的物理教师，将自动化验证引入模型。</p>\n  <p><strong>Q9：面对目前 GPU 昂贵且资源紧缺，同时真实物理交互数据又极度稀缺且昂贵的现实困境，逆矩阵是如何解决的？</strong></p>\n  <p>陈博远：主要通过数据合作与重构数据获取范式两个方面来解决。</p>\n  <p>第一，在数据合作层面，我们与一些公司建立了上下游合作关系，这为模型训练提供了大量真机数据支持，构成了很好的基石。</p>\n  <p>第二，相比于单纯的数据量，更关键的是“我们要学习什么样的数据”。互联网每天产生海量的视频，YouTube 每天就能产生数十万小时内容，但其中可能只有5%包含真实的物理交互。对于学习物理来说，我们需要的不是那95%的视觉冗余，而是强物理动态属性的稀缺数据。 因此，我们构建了数据金字塔：</p>\n  <p><strong>L1层</strong>：通过筛选高质量的真实世界视频学习物理状态。</p>\n  <p><strong>L2层</strong>：通过第一人称视角（Ego-centric）视频与仿真引擎数据，学习动作导致的状态转移。</p>\n  <p><strong>L3层</strong>：通过自建数据生产闭环，在仿真环境中构建极端边缘状态，例如处于倒塌边缘的杯子，并主动筛选强物理突变的数据，如玻璃破碎、汽车爆炸等。这部分稀疏且突变的规律数据对于模型真正掌握真实物理规律具有极高的性价比，是迈向物理正确的最关键一环。</p>\n  <h2><strong>场景落地：先通用再适配</strong></h2>\n  <p><strong>Q10：今年底你们计划发布的旗舰模型，会首先切入具身智能、工业仿真还是游戏物理等垂直场景？</strong></p>\n  <p>陈博远：我们的定位是“先通用再适配”。底层同一个基座，通过拼接不同的可插拔解码器，就能服务于各个场景，比如视频解码器用于游戏渲染，运动解码器用于工业孪生，动作解码器用于具身智能控制。</p>\n  <p>我们在一年之内，并不着急去做世界模型 for 具身/for 工业场景/for 游戏，因为在真实物理世界里面，它们其实是共通的，过早聚焦垂类容易导致过拟合。</p>\n  <p>旗舰模型成熟后，我们会优先在具身智能、工业仿真等场景做验证与落地。年底发布的模型，重点是向全球开发者展示其在未见过的物理场景中的预测能力，成为物理世界基础设施的提供者。</p>\n  <p><strong>Q11：在 W2 和 W3 阶段，世界模型相比 Unity、Unreal 等传统引擎，能带来多大提升？是颠覆者还是互补者？</strong></p>\n  <p>陈博远：短期是互补，长期是颠覆。 传统引擎依赖手写规则，对刚体预测较准，但在柔性物体（流体断裂、形变）等复杂交互上是盲区。 世界模型通过交互学习真实的物理因果性，具有三大优势：</p>\n  <p><strong>天然支持复杂物理交互</strong>，不依赖手写规则；</p>\n  <p><strong>极强的泛化性</strong>，传统引擎换场景需重新调参，而基座模型一句话即可生成千万级具有真实物理属性的场景；</p>\n  <p><strong>极高的效率</strong>，状态预测是秒级的。当模型迈向 W3，机器将从“执行规则”变为“理解规律、自主推演”。</p>\n  <p><strong>Q12：您自己平时玩游戏吗？有哪些游戏在物理交互上做得让您印象深刻？像《塞尔达》中玩家利用风扇和瀑布涌现出的水雾效果，未来是否可以不由程序员手写代码，而是由大模型自主推演完成？</strong></p>\n  <p>陈博远：像《荒野大镖客》、《黑神话：悟空》这类开放世界与动作游戏，它们的视觉渲染与底层物理交互都做得非常逼真。</p>\n  <p>但这背后的代价是极高的，逼真效果高度依赖于大量手写的物理规则和材质变化的响应代码。这恰恰反映了世界模型的颠覆性价值。 如果引入了真正理解物理规律的通用基座模型，像《塞尔达》里这种复杂元素的叠加交互效果将能够自然涌现，不再需要程序员预先逐条编写规则。</p>\n  <p>基座模型代替手写代码实现机器自主推演，再结合三维渲染达到视觉效果，在底层上能实现对现有物理引擎的巨大互补甚至颠覆。</p>\n  <h2><strong>在前沿探索性极强的领域，不能再套用传统的公司组织架构</strong></h2>\n  <p><strong>Q13：公司为什么选择搭建一个没有层级汇报和季度指标、高度扁平化的 AI-native 团队？这种 Neo lab 的研究氛围，在拿了高额融资之后，如何确保团队的执行力和交付效率？</strong></p>\n  <p>陈博远：这可以从三个递进的层面来回答：AI-Native、扁平化与高效机制。</p>\n  <p>首先，AI-Native 意味着我们真正在用 AI 重塑工作流。 我们的每一位员工，都配备了代码智能体（Agent）。新员工入职的第一件事就是学会使用 AI 提效工具。现在一个工程师配合几个 Agent 就能完成以往一个基础技术团队的工作量。更重要的是，同事之间可以互相访问对方的 Agent 来了解工作进展，降低了信息同步和共享的沟通摩擦。</p>\n  <p>其次，关于无 KPI 与高度扁平化。 通用世界基座模型是一个前沿探索性极强的领域，最重要的技术突破往往来自意想不到的方向。我们非常欣赏早期的 DeepMind 和 OpenAI，那种真正的底层创新往往只来自于两三个人的核心灵感，随后再将其扩展。在这种阶段，强加的 KPI 和部门墙反而会成为创新的沉重负担。</p>\n  <p>我们依靠这三点保持高效：方向上大家高度对齐，每个人都清楚公司在做什么、为什么做，不用谁来催；信息几乎没有衰减，想找个不同背景的同事 challenge 一下想法，随时就能聊起来；最后是认结果，谁做了什么贡献都摆在明面上，用验证结果说话。</p>\n  <p><strong>Q14：一个由青年天才与资深工程人才组成的团队，是什么样的工作氛围？在直觉和经验不同时，大家是如何达成平衡的？</strong></p>\n  <p>陈博远：我们团队就像一艘探索无人区的“快艇”，极高的人才密度和跨界背景是我们最核心的特征。 团队里既有做视觉生成、强化学习、3D仿真的，也有来自大厂的核心底层架构（Infra）专家，以及年轻的的 IOI/ICPC 奥赛金牌得主。</p>\n  <p>过往的经验是我们的垫脚石，但我们要防止它成为技术突破的绊脚石。</p>\n  <p><strong>Q15：拿完融资之后，目前这种“精英小团队”组织形态会改变吗？AI人才现在极其抢手，逆矩阵如何面对大厂的竞争并留住这些顶尖人才？</strong></p>\n  <p>陈博远：面对大厂在资金、算力上的竞争，我们的定位和他们不在同一层——大厂更多是在应用层针对特定本体做优化，而我们做的是底层通用基础设施。大厂就像一艘远洋货轮，体量极大但很难轻易转向；而我们是一艘快艇，能更快地跑出从 0 到 1 的原始探索，这本身就需要初创的精英团队形态和极高的人才密度。 关于留住顶尖人才，其实不太靠“说服”，更多是互相吸引。一是这里足够自由；二是大家有共同的理想；三是从前沿研究到产业落地的链路在这里是完整的，研究能直接变成模型表现，最终推动真实的产业变化，而不只是停在论文上。</p>\n  <p><strong>Q16：过去一年，您个人最深刻的认知重塑是什么？</strong></p>\n  <p>陈博远：最大的认知重塑有两点： 第一，“物理的通用性”从我做学术时的一个抽象命题，真正在我们的工程实验中变成了可验证的事实。当我们看到模型规模扩大后涌现的泛化能力时，我确信这条路径走通了。</p>\n  <p>第二，真正的底层创新不能只靠个人的技术直觉，需要一群有技术品味的人相互碰撞、修偏纠错。我们不能被短期的商业焦虑驱动，把底层技术做透，生态和开花结果自然水到渠成。</p>", "category": "tech", "published_at": "2026-06-17T01:00:00+00:00", "fetched_at": "2026-06-17T03:38:39.214898+00:00", "fingerprint": "aa0b92606d047584"}, {"source": "少数派", "title": "今年 618，这些鼠标值得一看", "url": "https://sspai.com/post/111065", "summary": "介绍点值得买的鼠标，顺便推荐一点鼠标垫。<a href=\"https://sspai.com/post/111065\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-16T03:00:00+00:00", "fetched_at": "2026-06-17T03:38:37.396589+00:00", "fingerprint": "a422eb1cea9fdff6"}, {"source": "少数派", "title": "独家采访 Home Assistant 创始人：离全面本土化还有多远", "url": "https://sspai.com/post/110086", "summary": "或许你没有直接听说过HomeAssistant，但每当你想在家里做些复杂的自动化，亦或是打破品牌壁垒的生态联通——比如把米家的设备无缝接入AppleHome，那么这个名字一定会进入你的视野。作为一个开 ...<a href=\"https://sspai.com/post/110086\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-16T07:10:26+00:00", "fetched_at": "2026-06-17T03:38:37.396584+00:00", "fingerprint": "9c6de7f1a2133f59"}, {"source": "少数派", "title": "社区速递 145 | 尝鲜激进傻快新系统、告别「电流麦」与平价人体工学椅", "url": "https://sspai.com/post/111099", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/111099\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-16T08:45:55+00:00", "fetched_at": "2026-06-17T03:38:3 \"People\" and \"Marketplace.\" It's one of several new AI features Meta is rolling out starting today, including photo presets that swap sports jerseys onto [&#8230;]", "category": "tech", "published_at": "2026-06-15T21:15:08+00:00", "fetched_at": "2026-06-16T03:38:55.994323+00:00", "fingerprint": "fb4772aafa138c02"}, {"source": "The Verge", "title": "Inside the fight over Claude Mythos 5", "url": "https://www.theverge.com/ai-artificial-intelligence/950412/anthropic-trump-adminstration-claude-mythos-fable-5-export-controls", "summary": "As the rest of the country celebrated the USA's first World Cup win and the New York Knicks championship, Anthropic spent its weekend fighting the Trump administration over its latest model release. At 5:21 PM on Friday, the company received a US export control directive to suspend access to its Mythos 5 and Fable 5 [&#8230;]", "category": "tech", "published_at": "2026-06-16T03:00:00+00:00", "fetched_at": "2026-06-16T03:38:55.994313+00:00", "fingerprint": "a38794b78fcd9833"}, {"source": "36氪 - 最新文章", "title": "从一个想法到一个产品，年轻开发者把生活观察写进代码", "url": "https://36kr.com/p/3854243718550528?f=rss", "summary": "<p>6月14日，HarmonyOS创新赛·极客赛道决赛在HDC华为开发者大会（HDC 2026）落下帷幕。&nbsp;</p>\n  <p>此前，20支入围队伍从众多参赛作品中脱颖而出，在36小时极限编码中抢先使用HarmonyOS 7，围绕AI、3D空间化、用户体验等方向展开比拼。随着最终获奖名单揭晓，比赛的结果已经落定，但比奖项本身更值得被看见的，是<strong>这些作品背后一批年轻开发者正在关注什么，又试图用代码回答什么。</strong></p>\n  <p>翻开参赛作品的名单，我们意外地发现，这其中很多的开发者都还是在校学生，没有成熟公司的资源，没有完整的商业团队，甚至可能没有充足的开发经验。但在这场比赛里，<strong>他们把自己的生活观察、专业背景和兴趣经验变成了一个个可运行的产品。</strong></p>\n  <p><strong>这些作品构成了这场创新赛值得被观察的一面：年轻开发者不再只是追逐抽象的技术命题，而是在用代码回应自己的生活。</strong></p>\n  <p>这群年轻人是如何在生活中发现问题并用代码编写出解决方案的？一群还在校园里的年轻人，又是如何在36小时极限开发里，把脑海中的灵感变成真正可运行的作品？当鸿蒙生态把AI能力、多端协同和开发工具开放给更多中小开发者，创新的门槛会不会被重新改写？&nbsp;</p>\n  <p>带着这些问题，后浪研究所访谈了其中几位年轻开发者，和他们聊了聊这段与众不同的开发经历。&nbsp;</p>\n  <h3><strong>对话活态文明，把壁画搬进手机里</strong></h3>\n  <p>谢荷第一次觉得壁画离自己很近，是在河南的一次线下飞天表演。</p>\n  <p>在那之前，壁画对她来说更像是藏在遥远石窟的一场梦。即便是在短视频泛滥的当下，她随时可以看到那些壁画上衣裙缈缈的人物一闪而过的画面，但屏幕内外的距离，却也让谢荷在感受历史文化的同时有了强烈的距离感。</p>\n  <p>直到那次表演，敦煌壁画中的飞天人物被搬到现实场景中，原本静止在墙上的形象变成了跃动在她眼前的景象，她和壁画之间的距离好像消失了。</p>\n  <p>那么，<strong>如果不是每个人都有时间、预算和机会立刻去一趟敦煌，那能不能先用一部手机，打开一扇通往壁画世界的门呢？</strong></p>\n  <p>这个念头，最终落在了谢荷和她的两位队友身上。他们来自郑州轻工业大学——一个主打多学科交叉的团队，三个人分别来自计算机、物联网和生物工程专业。从大一起，他们就在工作室里接触鸿蒙，攒下了一年多的开发基础。“壁行·时空”就这样立项了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_8c51fbd51a9a48d98cc8ed892604559c@15222052_oswg679000oswg1080oswg606_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">谢荷参赛，华为官方供图</p>\n  <p>他们想做的不是一个普通的“滑动图片+语音讲解”应用，而是能让用户像走进真实空间一样，移动、靠近、调整视角，在行走中看见壁画里的人物、场景和故事。<strong>在他们看来，传统文化不该只停留在\"被观看\"的位置，它也可以变成一种“可步入、可对话、可参与修复\"的活态文明。</strong></p>\n  <p>但要把这个设想做出来，远比想象中难。最大的拦路虎是3D建模：模型过大、加载卡顿、视角异常、场景错位……状况层出不穷。项目从去年10月立项，光是底层引擎他们就推翻重来了三次，反复摸索之后，他们最终选择结合鸿蒙的3D图形能力与Unity引擎“双驱动”，才让壁画稳稳地“立”了起来。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_0c806ca8c2cc4a2995344e19c398e905@15222052_oswg612232oswg1080oswg528_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">壁行·时空App界面，受访者供图</p>\n  <p><strong>而能让这群资源有限的学生走到这一步，谢荷说，他们是鸿蒙生态实实在在的受益者。</strong>最直接的帮助就是工具链。“有些软件你学的时候，第一步就卡死在环境安装上了。”而鸿蒙的工具链如今下载安装包，点一下就能完成，不需要反复配置路径，让初学者能顺利迈出第一步。</p>\n  <p>其次是AI的辅助，借助鸿蒙的AI辅助开发工具，无论是报错排查、接口查找还是实现思路的梳理，都能得到提示。在谢荷看来，这正是过去和现在最大的不同：早些年学开发，得先系统啃完一大堆理论，才敢动手写第一个页面；而AI能快速帮你理清学习路径、精炼需求，“它大大加速了我们的成长”。</p>\n  <p><strong>鸿蒙让这群年轻的开发者看见了另一种可能。</strong>去年，他们做过一款叫“视野通达”的手语翻译应用并成功上架。在运营过程中，他们还参与了鸿蒙应用开发者激励计划，收到了大学期间的第一笔收入。对学生开发者来说，这种反馈很直接：原来自己写出来的东西，不只是停留在作业和比赛文档里——它可以上架，可以被人使用，甚至能带来真实的回报，成为下一次继续开发的底气。</p>\n  <p><strong>就是在这样一次又一次的尝试中，谢荷和她的伙伴们通过鸿蒙生态收获的不仅仅是两款成功的作品，更是持续开发的激情和推进文化探索与年轻人深度链接的可能。</strong></p>\n  <h3><strong>看见每一次动作，让AI成为运动搭子</strong></h3>\n  <p>比起谢荷团队着眼于壁画的遥远视野，蓝峰对年轻人需求的洞察更加贴近日常。</p>\n  <p>当下，健身已经成了年轻人离不开的话题和习惯，越来越多人开始走进健身房。<strong>但并不是每个人都能顺利适应健身房里多样的设备，蓝峰就是无所适从的其中之一。</strong></p>\n  <p>正在太原工业学院读大二的蓝峰是个马拉松爱好者，后来为了增加力量训练，他第一次走进健身房，面对各式各样的器械，问题也随之而来：一台器械摆在面前，不同厂商使用方法不同，标签也写的不明确；想用AI拍照识别，但搜图工具又认不准。网上能搜到一堆训练计划，但除了教练和健身搭子，没人能随时指正你的动作是否规范。</p>\n  <p>这对健身小白太不友好了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_870a0d3824f44a6d9308a66db47280a0@15222052_oswg167406oswg949oswg1510_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝峰参加马拉松比赛，受访者供图</p>\n  <p>他把市面上的运动健康软件挨个试了一遍，它们能帮你排计划、记卡路里，或者推荐一些无器械健身的动作，但无一例外的是没办法指导用户在健身房沉浸式的训练。换句话说，<strong>在蓝峰眼中，“没有一款软件真正赋能运动这个过程本身。”而这句话，成了“Arua AI健身教练”的出发点。</strong></p>\n  <p>蓝峰想做的，是让AI融入到运动中来，帮助小白识别器械、观察并纠正动作。</p>\n  <p>作为独立开发者，蓝峰既没有团队也没有现成的大规模数据，每个动作对应的骨骼点状态、识别器械需要的样本、跑步姿态的反馈数据，都得他一个人完成。</p>\n  <p><strong>而支持他把项目推进下来的，是鸿蒙生态。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_bd90855536484b75a5952a8449bf811c@15222052_oswg408552oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">蓝峰参赛，华为官方供图</p>\n  <p>鸿蒙的骨骼点检测功能，让AI第一次有机会“看见”用户的动作，而不只是生成一段冰冷的建议。这正是他最初决定动手的那块拼图。</p>\n  <p>给他更大助益的是鸿蒙在AI上的扩展能力。“和AI相关的扩展，鸿蒙确实比其他厂商做得好一些。”在他看来，华为的推送、小艺以及智能体扩展，让应用未来有可能更主动地参与训练：不需要等待App打开才响应，而是训练前提醒、训练中反馈、训练后复盘。AI不再被动等指令，而是能主动调用工具、解决问题。</p>\n  <p>这也是Arua和普通健身App最不一样的地方。蓝峰想解决的核心问题，其实是大部分普通年轻人的健身焦虑——空有一份计划，到了健身房却无从下手，请私教太贵，自己摸索又容易受伤。Arua填补的恰好是这部分需求。</p>\n  <p><strong>蓝峰单枪匹马，在鸿蒙生态的助力下一步步搭建起这个年轻人的AI运动搭子，在这个过程中，鸿蒙的价值并不仅仅是技术支持，而是把挡在个人开发者面前的门槛降低，让他们有更充分的空间创造属于他们一个人的可能性。</strong></p>\n  <h3><strong>唤醒传统纹样，让非遗走进日常设计</strong></h3>\n  <p>除了文化探索和健身管理，鸿蒙创新赛中还有年轻人关注着非遗传承。</p>\n  <p>前段时间，中国国际消费品博览会上，广西壮族自治区主席韦韬花580元购买了一款蓝色凤蝶纹样壮锦手提包，现场扫码付款的视频迅速传播。随后“壮锦包”的相关话题在抖音播放量超过8000万次，“壮锦”话题播放量超过5.5亿次。</p>\n  <p>传统纹样就这样通过短视频闯进了吴忧的视野里。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_4afde96ababa4388a11e8c63f2400133@15222052_oswg104909oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">吴忧和队友参赛，华为官方供图</p>\n  <p>在无锡工艺职业技术学院读大二的吴忧学的是视觉传达，平时就会经常接触到各种各样的视觉元素。她发现年轻人日常能看到、能使用的视觉元素更多的都是外来IP，它们简单、直接、传播效率高，很容易变成手机壳、帆布包、贴纸和各种周边。</p>\n  <p><strong>但传统纹样不同。每一个款式背后都有来源，有工艺，也有历史，如果没有宣传，根本没人会注意到它们的美丽和精致。</strong></p>\n  <p>吴忧和队友王迹想做“纹渊”，起点就在这里。它不只是一个非遗科普App，而是能将传统纹样从“被介绍的对象”，变成普通人和设计者都可以拿来使用的素材。一个没有设计基础的大学生，可以用它做一个首饰、包装、文创产品的初稿；一个设计师，也可以借它快速获得灵感，把传统纹样放进更现代的使用场景里。</p>\n  <p>把这个想法做成产品，难点并不在于“展示纹样”，而在于怎么让它真正可用。用户选中一个纹样之后，如何把它放到具体产品上，如何生成相应的3D效果，如何让设计结果能够继续被编辑和使用，才是纹渊需要解决的问题。团队在开发中最难的地方，也正是这个从纹样到产品效果的转化过程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_69d89dfd91864e0ba0dbcd48b0074516@15222052_oswg1074199oswg1080oswg675_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纹渊App设计方案，受访者供图</p>\n  <p><strong>鸿蒙提供的支持，逐渐在这个环节显现出来。</strong>团队查到开发文档中关于3D高斯建模的能力后，用了几天时间尝试把它接进项目，解决纹样和产品模型结合的问题。对纹渊来说，这不是一个用来“炫技”的功能，而是让传统纹样从二维图案走向实际产品预览的一个支点。</p>\n  <p><strong>另一个重要能力，是一次开发、多端部署。</strong>吴忧深知，大部分设计从业者会在电脑上处理设计素材，所以，只开发手机端应用是远远不够的。而鸿蒙的这项能力让这个学生团队不必为不同设备重新搭几套系统，而是能够专注精力优化产品本身，把多端部署的工作交给鸿蒙。</p>\n  <p>当然，AI对开发和创作门槛的降低也对吴忧帮助不小。吴忧说，如果没有AI参与，工作效率至少会减半。鸿蒙开发文档里的AI问答、开发工具中的AI助手，以及社区里已有的问题和答案，大大提���了他们在开发过程中的效率。</p>\n  <p>未来，她还希望可以接入小艺智能体，让用户根据自己的需求，对纹样做二次创作，再应用到具体产品上。</p>\n  <p><strong>依托鸿蒙生态的支持，吴忧把传统纹样带入了更多年轻人的视野里，让这些美丽精致的非遗文化不再仅仅停留在书本上，而是有了二创和落地成为产品的可能。</strong>这不仅是在实现年轻开发者的梦想，也是在为非遗传承打开一扇窗。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_93bd9a37d3f8409c9a542f31a0ad6d87@15222052_oswg351oswg1080oswg43_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>从文化探索、到健康管理、再到非遗传承，它们指向的领域不同，但底层逻辑是相似的：这些年轻开发者并不是站在一个遥远的技术视角上发明需求，而是先作为用户，感受到生活里的某个缺口，再试图用代码将其补齐。</p>\n  <p>这也是HarmonyOS创新赛极客赛道真正值得被看见的地方。</p>\n  <p><strong>在这场比赛里，20支团队比拼的不只是代码速度，而是能不能把一个具体的生活观察，转化成真正可运行、可体验、可继续生长的作品。</strong>对年轻开发者和中小开发者来说，这样的赛场提供了一种少见的机会：他们不必先成为成熟公司的团队，也不必等到拥有足够完整的资源配置，才开始验证自己的想法。</p>\n  <p>鸿蒙生态在其中扮演的角色，并不仅仅是一个开发平台，更是让中小开发者创意落地的舞台。系统级AI能力、一次开发多端部署、AI Coding、开发文档、社区反馈和赛事活动，共同构成了一条从想法到Demo、从作品到展示的路径。<strong>复杂创新不再只属于大组织，小团队也有机会在同一个生态里完成表达。</strong></p>\n  <p>这也正是鸿蒙创新赛的价值所在。它不是把开发者关进一个封闭的技术命题里，而是让他们把自己的兴趣、专业、生活经验和系统能力连接起来。技术不再只是课本里的知识点，也不是企业发布会上的参数，而是可以被年轻人拿来解决真实问题的工具。</p>\n  <p>而在极客赛道之外，这种机会还在继续向更广泛的高校学生打开。</p>\n  <p>2026HDC，面向全国高校学生的鸿蒙高校创新赛正式开赛，并首次进入“全国普通高校大学生竞赛排行榜”。这意味着，它不只是一场面向少数技术高手的开发比赛，也成为高校学生可以认真投入的一段创新经历。对于学生来说，国赛背书、前沿技术、专家指导和项目经验，都会变成简历、作品集和面试中可以被讲述的内容。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_62283613c97541ba862b192d85fefe93@15222052_oswg640648oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">鸿蒙高校创新赛，华为官方供图</p>\n  <p>更重要的是，它降低了年轻人参与创新的心理门槛。专业不限、自由组队，AI Coding提供辅助，系统级创新能力也在被更简单地集成和调用。一个脑洞、一张设计稿、一个Demo，都有机会被带上鸿蒙赛场。参赛者可以在作品展播、校园传播、开发者社区展示中获得反馈，也有机会让创意从比赛走向更真实的应用场景。</p>\n  <p><strong>从极客赛道到高校创新赛，鸿蒙生态正在做的，是让创新不只发生在少数成熟开发者手中。</strong>它给年轻人提供了一个更开放的入口：零基础可以尝试，小团队可以组队，跨专业也能协作；有想法的人不必把创意停留在文件夹里，而是可以真正把它做出来，展示出来，再继续往前推一步。</p>\n  <p><strong>当创意被看见，它才有可能长成作品；当作品被放进真实生态里，它才有机会继续走向应用。这或许正是鸿蒙创新对于年轻开发者最直接的意义。</strong></p>\n  <p>查阅链接：<br />（https://developer.huawei.com/consumer/cn/activity/incentive/C4?ha_source=houlangyanjiusuo&amp;ha_sourceId=89000237）了解鸿蒙高校创新赛。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_73d3e4a729ce40558850dae121ae7af1@15222052_oswg3021oswg900oswg70_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_368a8710115b432191f87c2e47fbd8bd@15222052_oswg13015oswg900oswg100_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>你有想要尝试自己开发App的想法吗？</strong></p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/J8AUGWy7VO5yZWWTxu3-Iw\" rel=\"noopener noreferrer\" target=\"_blank\">“后浪研究所”</a>，作者：大倪，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-15T09:46:34+00:00", "fetched_at": "2026-06-16T03:38:55.805184+00:00", "fingerprint": "be8d6466d031930f"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜我国成功发射吉星高分07C04星等8颗卫星；小红书或已准备好本月在香港提交IPO申请；智谱：公司已推出最新一代旗舰模型GLM-5.2", "url": "https://36kr.com/p/3854486447510535?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>支付宝：政务AI助手“晓政”服务突破1亿次</strong></p>\n  <p>36氪获悉，支付宝宣布，旗下政务AI助手“晓政”累计服务次数突破1亿次。截至目前，“晓政”服务已覆盖16000项服务事项，成功落地助力70余家部委及省级政务机构，业务场景全面覆盖公积金、人社、公安、不动产等民生领域。</p>\n  <p><strong>小雨智造与地瓜机器人正式宣布达成战略合作</strong></p>\n  <p>36氪获悉，6月12日，小雨智造与地瓜机器人正式宣布达成战略合作，双方将围绕“工业具身大脑+端侧大算力”展开深度协同，推动具身智能技术从实验室走向工业产线，共同打造面向工业制造的高性能软硬一体化解决方案，助力智能制造迈向新阶段。</p>\n  <p><strong>小红书或已准备好本月在香港提交IPO申请</strong><br />据透露，小红书科技有限公司正准备在本月底前秘密向香港提交首次公开募股（IPO）申请。（新浪财经）</p>\n  <p><strong>深圳盒马变更负责人</strong><br />36氪获悉，天眼查 App 显示，近日，深圳盒马网络科技有限公司发生工商变更，金瓯卸任法定代表人、董事，由廖榜鹏接任。深圳盒马网络科技有限公司成立于2017年6月，注册资本5000万美元，经营范围包括计算机网络专业领域内的技术开发、技术咨询及技术服务等。股东信息显示，该公司由盒马（香港）有限公司全资持股。</p>\n  <p><strong>阿里菜鸟要解散？最新官方回复“假的，纯属谣言”</strong><br /><br />36氪获悉，针对网传阿里菜鸟或将解散的消息，菜鸟方面回应：“假的，纯属谣言”。</p>\n  <p><strong>上汽集团等入股具身智能机器人公司璇玑动力</strong><br />36氪获悉，天眼查 App 显示，近日，深圳璇玑动力科技有限公司发生工商变更，新增东方精工、上汽集团旗下上海上汽创远创业投资合伙企业（有限合伙）等为股东，同时注册资本由约5777.8万人民币增至约6733.3万人民币。</p>\n  <p><strong>五粮液旗下宜宾环球集团增资至约8.8亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，四川省宜宾环球集团有限公司发生工商变更，注册资本由约8.4亿人民币增至约8.8亿人民币。该公司成立于2004年7月，法定代表人为刘兴，经营范围包括企业管理、货物进出口、玻璃制造、普通玻璃容器制造、日用玻璃制品制造等，由四川省宜宾五粮液集团有限公司全资持股。</p>\n  <h2>投融资：</h2>\n  <p><strong>“秩益科技”技连续完成亿元级A轮及A+轮融资</strong></p>\n  <p>36氪获悉，据秩益科技消息，近日，“秩益科技”连续完成亿元级的A轮及A+轮融资。其中，A轮由老股东沂景资本独家增资；A+轮由毅达资本领投、比丘资本战略加持。熙桥资本担任本轮财务顾问。</p>\n  <p><strong>“极佳视界”再获10亿元B2轮融资</strong></p>\n  <p>36氪获悉，据极佳视界消息，近日，物理AGI企业“极佳视界”再获10亿元B2轮融资，本轮融资由新加坡跨境投资机构狮城资本、中国-比利时基金（中比基金）、建投投<strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong>资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等全球国家队基金、产业资本、财务机构、国资平台共同投资，国中资本、达晨财智、图灵资管等多个老股东持续超额加注。本轮融资将主要用于“双金字塔”数据与算法体系的持续投入、物理AGI基础模型的研发迭代，以及C端家庭场景与B端工业场景的规模化落地。</p>\n  <h2>新产品：</h2>\n  <p><strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong></p>\n  <p>36氪获悉，智谱港交所公告，董事会欣然宣布，本公司已推出最新一代旗舰模型GLM-5.2，模型提供达到1M的长上下文，并在长程任务中继续保持领先，将遵循MIT协议开源。预计该模型将助益本公司后续开放平台及API业务的调用量提升。</p>\n  <h2>今日观点：</h2>\n  <p><strong>机构：2026年显示面板需求下调，预计出货量将下降6%</strong><br />36氪获悉，根据Omdia的显示面板长期需求预测追踪报告，全球显示面板市场前景显著恶化，2026年需求预测大幅下调。单位需求预计将同比下降6%，较此前预测的2%降幅大幅下调。显示面板面积需求增长率也从此前预期的6%下调至仅1%。</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>我国成功发射吉星高分07C04星等8颗卫星</strong></p>\n  <p>我国成功发射吉星高分07C04星等8颗卫星。（央视新闻）</p>", "category": "tech", "published_at": "2026-06-15T13:48:20+00:00", "fetched_at": "2026-06-16T03:38:55.805178+00:00", "fingerprint": "f709ad439501bbf0"}, {"source": "36氪 - 最新文章", "title": "Pocket 4P双摄来了：手机影像之外，大疆正在重做一台“口袋电影机”", "url": "https://36kr.com/p/3854510160549124?f=rss", "summary": "<p>在手机影像能力不断逼近专业设备的今天，一个问题变得越来越尖锐：独立影像设备，还有存在的必要吗？</p>\n  <p>6月15日，大疆正式发布 Osmo Pocket 4P，将这台口袋云台相机推向更专业的创作场景。作为 Pocket 系列的新一代旗舰产品，Pocket 4P 定位为“装进口袋里的电影机”，搭载双摄系统、17级动态范围与 D-Log 2 专业色彩曲线，试图在口袋级设备中进一步容纳专业影像能力。</p>\n  <p>Pocket 4P 以&nbsp;3799元起售，多平台预订量持续走高。</p>\n  <p>对于一个原本被视为“手机影像补充”的品类来说，这种热度本身就提出了一个新的问题：当手机已经足够强，为什么仍然有越来越多人愿意为一台独立影像设备买单？</p>\n  <p>过去几年，旗舰手机几乎每一次更新都在吞噬传统相机的边界。从多摄系统、长焦镜头、计算摄影，到 Log 视频、AI 修图和一键出片，手机已经成为绝大多数普通用户最顺手的影像工具。</p>\n  <p>但另一边，一个看起来有些反常识的品类，却在井喷增长。</p>\n  <p>在丽江玉龙雪山的拍摄现场，拿着大疆 Pocket 的用户，已经不再只是数码爱好者。旅行博主、亲子用户、美食探店创作者、综艺节目组，甚至很多第一次尝试视频创作的人，都在用这台小机器完成日常表达。</p>\n  <p>“大疆首创了 Pocket 这一产品形态，也确实得到了市场和广大用户的认可。”在大疆「视界无边」影像探索之旅丽江站的Pocket 4P媒体先享会现场，Pocket 系列产品经理这样开场。</p>\n  <p>据他介绍，Pocket 3 发布之后，整个产品线出现了爆发增长，基本每年翻倍。到今年，Pocket 3 的国内市场规模已经大于微单市场。这意味着，对于大量普通用户来说，出门旅行、记录生活、拍摄短视频时，云台相机正在成为比传统相机更自然的选择。</p>\n  <p>这背后真正值得讨论的，并不是产品又多了哪些参数，而是一个更大的问题：当手机越来越强，大疆为什么仍然要做 Pocket？不断迭代的Pocket为什么还能持续且爆发式增长</p>\n  <p>。答案或许藏在这条产品线过去8年的演化里。</p>\n  <p>Pocket 的八年，不是一台设备不断堆参数的过程，而是一家公司不断重新理解“普通人到底需要什么影像工具”的过程。</p>\n  <h3><strong>Pocket 不是一开始就为 Vlog 而生</strong></h3>\n  <p>今天提到 Pocket，很多人会自然想到 Vlog、自拍、旅行记录和轻量创作。但在一开始，大疆并不是这样定义它的。</p>\n  <p>2015 年，大疆第一次把 Inspire（悟）无人机上的云台相机“小脑袋”拿到手持设备上，推出 Osmo 系列。这是手持云台相机形态的源头。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_86bb7cd0dfea466d987bac3ad553eefc@430412560_oswg164672oswg830oswg762_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>彼时的大疆，更多是站在专业影像的视角思考问题：更稳定的画面、更大的传感器、更强的后期空间。之后，大疆陆续推出 Osmo+、Osmo Pro 和 Osmo RAW，甚至加入 M4/3 卡口联盟，让设备可以更换镜头、录制无损 RAW，为专业创作留下更大空间。</p>\n  <p>但这些产品也有明显的问题：太专业、太重、门槛太高。“我们当时就在想，有没有可能把它进一步缩小，让每个人都能享受云台相机拍摄的体验。”产品经理回忆。</p>\n  <p>于是，2018 年，Osmo Pocket 发布。它极其小巧，可以轻松放进口袋，当时被称为“口红相机”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_7951fdbf463540c4b9b61543113b820c@430412560_oswg731597oswg822oswg548_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>但一个容易被忽略的事实是，初代 Pocket 并不是一台真正意义上的 Vlog 相机。</p>\n  <p>产品经理表示，Pocket 1 的焦段大概在 26mm 左右，自拍并不舒服。“以至于刚发布的时候，我们也没有打 Vlog 的概念。”一方面，当时国内还没有真正形成 Vlog 文化；另一方面，产品本身也还没有完全适配自拍表达。</p>\n  <p>真正的变化发生在后面。当 Pocket 1 配上延长杆之后，用户开始拿它自拍、讲话、记录日常，大疆才逐渐意识到：用户需要的并不是一台“小型稳定相机”，而是一种更轻、更低门槛的表达方式。</p>\n  <p>某种程度上，Pocket 的产品定义不是一开始就被设计出来的，而是在用户的使用中被不断刷新出来的。于是到了 Pocket 2，大疆开始真正主打 Vlog。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_2fd958122f8446a7a512ed9bc6076a9a@430412560_oswg427222oswg830oswg468_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>这一代最关键的变化，是把焦段调整到 20mm，自拍更友好。同时，Pocket 2 也首次尝试无线麦克风生态。虽然当时的无线麦克风只能连接 Pocket 2，但后来 DJI Mic 独立发展成多个系列，能直连相机、手机和 Osmo 系列设备。</p>\n  <p>从 Pocket 1 到 Pocket 2，本质上是一次产品定位的变化：从“带增稳的画质工具”，转向“口袋里的 Vlog 相机”。但这还不是 Pocket 真正爆发的时刻。</p>\n  <p>Pocket 2 发布后，大疆发现另一个问题：当用户把它和索尼、佳能等传统卡片机对比时，Pocket 的优势是小巧、稳定、方便，但在“拍人好看”这件事上，还不够突出。对于 Vlog 来说，这恰恰是最重要的能力之一。</p>\n  <p>于是，Pocket 3 的重点不再只是“能不能拍”，而是“拍出来好不好看”。一英寸 CMOS、两英寸旋转屏、色彩风格，开始共同推动这条产品线进入新阶段。</p>\n  <p>产品经理提到，Pocket 3 之后，很多美图、剪映等应用里甚至出现了 Pocket 3 风格的滤镜。也就是说，Pocket 开始拥有被大众认可的色彩风格和影像审美。这其实是一个很重要的转折。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_7484aa599213450abc92273f689ee7c0@430412560_oswg468980oswg828oswg622_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>从 Pocket 1 到 Pocket 4，这条产品线经历了几次认知跃迁：Pocket 1 解决的是“稳定+画质”；Pocket 2 解决的是“Vlog 自拍成立”；Pocket 3 解决的是“拍人好看”；Pocket 4 则试图解决“更多场景下的创作表达”。</p>\n  <p>它不再只是一个自拍设备，而是在向“口袋里的影像系统”演进。</p>\n  <h3><strong>为什么 Pocket 3 才真正爆发？</strong></h3>\n  <p>如果从结果看，Pocket 系列真正进入大众视野，是从 Pocket 3 开始。但这并不意味着前两代失败了。恰恰相反，在大疆内部看来，Pocket 1 和 Pocket 2 在产品表现上都已经取得了不错的成绩，但它们的影响力还主要在科技圈。</p>\n  <p>产品经理对36氪解释，一款产品要真正走向大众，需要同时满足两件事：首先产品力必须过硬；其次，还要看它能不能破圈。Pocket 3 的爆发，正是这两件事同时发生的结果。</p>\n  <p>从产品力来看，Pocket 3 已经站到了同类设备第一梯队。一英寸传感器带来的动态范围、位深和画质表现，让它不再只是一个“方便的小机器”，而是开始具备让用户认真创作的能力。但仅有产品力并不足以带来规模爆发。</p>\n  <p>真正重要的是，它被更多圈层看见了。真人秀、综艺节目和内容制作团队，是 Pocket 3 破圈的重要推手。很多导演发现，这种小型设备可以替代一部分传统拍摄设备，进入更贴近人物的场景。艺人可以自己拿着拍，画面更自然，也更有亲近感。</p>\n  <p>当大众在综艺、剧集、短视频里不断看到这样一种设备，又在数码博主那里看到它的评测，再叠加明星的自发使用，Pocket 3 的认知开始被不断叠加。</p>\n  <p>它不再只是数码圈里的一台新设备，而变成一种大众能够理解、模仿和购买的创作工具。这也是 Pocket 3 与前两代最大的差别。前两代证明了产品成立，第三代证明了它可以进入更大的社会场景。</p>\n  <p>在这个过程中，大疆也持续通过功能更新维持讨论度。例如视频转实况、色彩滤镜、直出效果等功能，未必是最硬核的参数升级，却都实实在在落在了用户最具体的痒点和痛点上：画面能不能更好看、拍完能不能更方便地发、内容能不能更省事地分享。对于大众用户来说，这些往往比抽象的参数提升更重要，也更容易转化为实际购买和自发传播。</p>\n  <p>这背后对应的是消费电子产品一个普遍规律：产品不会因为“更强”而自动爆发，真正带来增长的，往往是它恰好升级到了用户最在意的需求上。当功能足够有用，用户就会用购买和分享投票，产品也才有机会完成真正意义上的破圈。</p>\n  <p>Pocket 3 的成功，本质上不是一次单纯的硬件升级，而是一次产品升级与用户需求精准对位的结果。也正因为如此，它才能在同一个时间窗口里，同时完成口碑积累、场景扩展和大众传播，最终迎来真正的爆发。</p>\n  <p>到了 Pocket 4，大疆面对的课题随之变化。既然 Pocket 已经证明了自己不只是一个小众数码产品，那么下一步，它能不能从一个“爆款单品”，成长为一个更完整的影像系统？</p>\n  <p>这也是 Pocket 4 和 Pocket 4P 同时被摆到台前的原因。大疆这一次没有只推出一个型号，而是区分了 Pocket 4 和 Pocket 4P。按照产品经理的说法，Pocket 4 更适合普通用户vlog记录生活，Pocket 4P 则面向有更高影像追求的创作者，尤其是对人像、中焦、调色和电影感有更高要求的人群。</p>\n  <p>这背后意味着，Pocket 品类开始进入更细分的阶段。就像传统相机会分入门机、进阶机、专业机一样，当一个品类规模足够大之后，它不可能永远只靠一台机器覆盖所有用户。</p>\n  <p>Pocket 4 是大众化基础款，Pocket 4P 是进阶创作者版本。大疆选择提前官宣 4P，也是为了让用户在购买时，有更充分的选择权。这是一种很典型的成熟品类打法。它说明 Pocket 不再只是“出一代卖一代”的产品，而开始拥有清晰的产品分层和用户分层。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260615/v2_d6edabe331394abbb955f4c5c901439b@430412560_oswg462405oswg1377oswg965_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <h3><strong>Pocket 4P&nbsp;，如何将电影机装进口袋</strong></h3>\n  <p>从先享会来看，Pocket 4P 最容易被注意到的，是一系列影像参数。</p>\n  <p>例如，搭载全新 CMOS，支持 17 级超高动态范围；引入 D-Log2 色彩曲线，能够更好衔接电影机工作流；新增 3 倍中焦镜头，覆盖更丰富的焦段；支持 4K 高帧率视频；同时补齐补光灯、取景器、续航手柄等生态配件。</p>\n  <p>参数之外，Pocket 4 真正的变化在于，它开始正面回答一个问题：在手机影像已经足够强的时代，独立影像设备还能靠什么存在？</p>\n  <p>如果大疆Pocket 4 给出的答案是“比手机更全能”，那么Pocket 4P&nbsp;则是在特定场景下提供更为确定的影像能力，并在关键创作场景中呈现出接近单反，甚至“小型电影机 / 口袋电影机”级别的画面表现。</p>\n  <p>具体来说首先是更稳定。云台是大疆长期技术积累最深的能力之一。产品经理在采访中提到，云台技术并非简单的硬件堆叠，而是依赖大量算法经验、真实使用数据以及多代产品的持续迭代。其背后的前馈控制与运动补偿逻辑非常复杂，需要长期积累才能实现顺滑、可靠且自然的画面表现。这也是即便手机厂商进入云台相机赛道，也很难在短时间内复现同等体验的关键原因之一。</p>\n  <p>第二是更像创作工具。手机的优势是随手可得，但它也是一个高度综合的设备。它要兼顾通信、社交、娱乐、计算、拍照、视频等无数任务。Pocket4&nbsp;则更专注，它的握持、屏幕、云台、焦段和配件，都围绕拍摄展开。</p>\n  <p>比如 Pocket 4P 的 3 倍中焦，并不是为了简单放大画面，而是为了拍出更好的空间压缩感、虚化和人像氛围。产品经理解释，他们曾经考虑过双一英寸方案，但如果放两个一英寸传感器，上方镜头的光圈就会被迫缩小，最终反而损失虚化和质感。最后大疆选择的是 1 英寸主摄加 1/1.3 英寸中焦，并尽可能把光圈做大。这背后是一个重要取舍：在小体积设备里，并不是大底一定最优，而是要服务最终画面。</p>\n  <p>第三是更强的软硬件耦合。手机厂商多采用 MTK 或高通方案，而大疆的芯片和系统更多是围绕影像服务。再加上大疆在云台、色彩、镜头、传感器、算法和硬件结构上的长期积累，最终形成了比较独特的画面风格。</p>\n  <p>影像色彩尤其如此。它不像算力或分辨率那样容易量化，更多依赖审美、时间和用户认可。市场上真正被广泛接受的色彩风格并不多，而 Pocket 3 在色彩上的认可，是大疆继续往前走的重要基础。</p>\n  <p>第四是生态化。Pocket 4P&nbsp;的补光灯、遥控取景器、无线麦、内置存储、直出功能和手势识别，本质上都在解决一件事：提升单人创作效率。比如新增柔光补光灯，没有独立电池，而是通过机身取电，尽可能做到小而轻，功耗低，并且可以与机身联动：暗光时自动打开，自拍时补光，向前拍摄时关闭。</p>\n  <p>再比如手势识别。产品经理提到，此前有综艺嘉宾对着 Pocket 3 挥手，希望它能自动跟拍，于是大疆就在后续的Pocket产品中顺势加入了智能的手势控制功能，&nbsp;比“耶”手势开拍，比“手掌”手势开启智能跟随，让一个人也能轻松拍出“他拍感”。</p>\n  <p>这些小功能单独看都不算颠覆，但合在一起，会让 Pocket 更接近一个完整创作系统。它想解决的不是“能不能拍”，而是“一个人能不能更轻松地拍好”。</p>\n  <p>当然，Pocket面临的竞争也会越来越激烈。随着 Pocket 3 销量增长，这个赛道已经被更多玩家看见。手机厂商、运动相机厂商、影像设备厂商，都可能进入云台相机市场。但大疆的护城河并不只是一颗传感器或一个云台结构，而是长期形成的系统能力：芯片、影像调校、云台控制、供应链定制、软硬件耦合，以及对用户使用场景的理解。</p>\n  <p>Pocket 系列很多零部件并非公模设计。镜头、芯片、Sensor、屏幕、电池等，都需要围绕产品形态进行定制开发。也因此，即便其他厂商拆解 Pocket 3 后发现有降本空间，如果没有正向设计和供应链摸排，也很难快速复制同样体验。</p>\n  <p>从成本和价格上看，Pocket 4 的定价低于 Pocket 3，也与规模效应有关。Pocket 3 的销量爆发，加之&nbsp;Pocket 4 与 Pocket 3 配件通用性较高，模具与物料费用被摊薄，即便���增内置存储，也仍然有更低价格空间。</p>\n  <p>这说明，Pocket 这条产品线已经开始进入规模化正循环：销量提升带来成本下降，成本下降带来价格优化，价格优化又进一步扩大用户基础。</p>\n  <p>回到最初那个问题：手机影像越来越强，大疆为什么还要做 Pocket？因为手机解决的是“人人都能记录”，而 Pocket 想解决的是“普通人也能更容易拍出作品感”。</p>\n  <p>它不需要在所有场景下战胜手机。它只需要在旅行、Vlog、单人创作、人像、运动跟拍、综艺记录这些场景里，成为更确定、更顺手、更能出片的工具。</p>\n  <p>从这个意义上看，Pocket 4 并不是一次简单的新品迭代。它代表的是大疆对一个成熟品类的重新划线：不是所有独立影像设备都会留下来，但那些在具体场景中足够轻、足够稳定、足够有表达力的设备，仍然会有自己的位置。</p>\n  <p>在Pocket 4 基础上，大疆迭代出的Pocket 4P 差异化核心，同样在于它承接的是大疆独有的能力体系，而不只是一次单点硬件升级。大疆是 Pocket 品类的开创者和领导者，同时也是少数真正打通专业影像线与消费影像线的品牌。过去十年，大疆如影系列在专业影像和云台稳定技术上持续积累，相关能力获得过奥斯卡、艾美奖等国际知名奖项认可；大疆电影机如影 4D 在影像色彩调教、稳定系统、专业剧组使用和真实场景经验上的沉淀，也都给了 Pocket 4P 很强的底层支撑。</p>\n  <p>所以 Pocket 4P 的竞争力，不只是双摄带来的焦段扩展，更在于它把专业线验证过的稳定、色彩和创作经验，压缩进了一个口袋尺寸的机身里。双摄让 Pocket 第一次拥有更完整的镜头语言，再结合大疆成熟的云台能力和场景理解，它已经不只是便携记录设备，而是具备了媲美迷你电影机的创作能力。</p>\n  <p>回顾大疆在手持云台领域的12年深耕，其实是一部不断拓宽行业边界的演进史。从2018年初代Osmo Pocket 开创并定义“口袋云台相机”品类，攻克极限空间下的小型化与散热难题；再到Pocket 3通过巧妙的旋转屏结构，开启手持云台大底画质时代。如今全新Pocket 4P的问世，将17级动态范围、D-Log 2专业色彩以及智能跟随8.0技术，毫无妥协地塞入掌心大小的机身中。所以大疆真正做的，也许不是一台小相机。而是在回答一个更长线的问题：当人人都能拍视频之后，什么样的设备，才能让普通人更容易表达自己？</p>", "category": "tech", "published_at": "2026-06-15T14:13:11+00:00", "fetched_at": "2026-06-16T03:38:55.805170+00:00", "fingerprint": "c980b844e85368db"}, {"source": "36氪 - 最新文章", "title": "8点1氪｜山姆总部因食品安全问题被约谈；智谱股价暴涨，创上市以来单日成交新高；美伊确认达成协议，国际油价显著下跌", "url": "https://36kr.com/p/3855082873476102?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>国内品牌金饰价格普涨</li>\n   <li>小红书公布世界杯开赛数据</li>\n   <li>阿里巴巴达摩院退出旗下科技公司</li>\n   <li>罗马仕接连变更法定代表人</li>\n   <li>遇见小面创始人向“渝见小面”致歉</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>针对多发食品安全问题，市场监管总局约谈山姆总部</strong></p>\n  <p>记者15日了解到，针对一段时期以来监管发现和媒体曝光的山姆线下门店及线上网店多发的食品安全问题，近日，市场监管总局依法对沃尔玛（中国）投资有限公司（即山姆总部）负责人进行了责任约谈，要求其严格按照《中华人民共和国食品安全法》，以及《食品销售连锁企业落实食品安全主体责任监督管理规定》《网络食品销售经营者落实食品安全主体责任监督管理规定》等法律法规规定开展食品经营活动，始终树牢食品安全意识，严格落实食品安全主体责任，自觉践行企业社会责任，严防全链条食品安全风险，切实保障公众饮食安全。</p>\n  <p>针对被市场监管总局约谈，山姆方面回应记者称，公司已由管理层牵头成立专项整改工作组，第一时间启动全渠道、全链路专项自查整改。我们将严格遵照相关法规及监管要求，全面优化食安管控和商品品控，严守食品安全底线、提升会员体验。（央视新闻、中国新闻网）</p>\n  <p><strong>智谱股价暴涨，创上市以来单日成交新高</strong></p>\n  <p>6月15日，港股AI大模型板块全线走强，其中，国产大模型龙头智谱（02513.HK）早盘高开近15%后持续拉升，盘中最高涨幅一度达到47.6%，截至午市收盘，智谱涨幅收窄至28.35%，报1408港元，总市值突破6277亿港元，单日成交额超52.08亿港元，创下上市以来单日成交新高。</p>\n  <p>消息面上，6月12日，美国商务部依据出口管制相关授权，要求人工智能公司Anthropic暂停向所有外国国民（不论其身在美国境内或境外）提供其最新旗舰模型Claude Fable 5与Claude Mythos 5的访问权限。Anthropic收到美国出口管制禁令后，中国模型厂商迅速跟进、宣布全量开放。</p>\n  <p>6月13日，智谱宣布旗下开源旗舰GLM-5.2面向其Coding Plan全量用户开放（Lite/Pro/Max及团队版），并预告API上线，同时称模型权重按MIT协议开源。智谱表示，此次开放的新模型是公司迄今为止能力最强的开源模型，又指在前沿模型突然变得不可用的时刻，科技不应该只属于少数人，也不应该被随时收回。（界面新闻）</p>\n  <p><strong>美伊确认达成协议，国际油价显著下跌</strong></p>\n  <p>由于美国和伊朗确认达成协议及霍尔木兹海峡预计很快重新开放，国际原油期货14日在开始新一周交易后价格显著走低。截至美东时间14日下午6时15分，纽约商品交易所7月交货的轻质原油期货价格最低降至每桶80.25美元，跌幅达5.45%；8月交货的伦敦布伦特原油期货价格一度跌至每桶83.51美元，跌幅为4.37%。</p>\n  <p>另据国际航运信息平台“海上交通网站”显示的船舶追踪数据，液化天然气运输船“迪沙”号15日通过霍尔木兹海峡进入阿曼湾。这是美国和伊朗达成协议后首艘通过霍尔木兹海峡的大型能源运输船。（央视新闻、新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>智谱：公司已推出最新一代旗舰模型GLM-5.2</strong></p>\n  <p>36氪获悉，智谱港交所公告，董事会欣然宣布，本公司已推出最新一代旗舰模型GLM-5.2，模型提供达到1M的长上下文，并在长程任务中继续保持领先，将遵循MIT协议开源。预计该模型将助益本公司后续开放平台及API业务的调用量提升。</p>\n  <p><strong>智元远征A3机器人实现自主乒乓球对打</strong></p>\n  <p>智元公司15日宣布，旗下全尺寸人形机器人远征A3已实现自主乒乓球对打。据悉，远征A3可在无遥控、无脚本、无人工干预的情况下，自主完成视觉感知、轨迹预测、运动规划和击球控制等环节。（新华财经）</p>\n  <p><strong>腾讯元宝接入ima知识库</strong></p>\n  <p>36氪获悉，腾讯宣布元宝接入ima知识库。用户在元宝内搜索时，可直接调用ima公开知识库中沉淀的海量专业知识库内容，获得更精准、可溯源的AI回答。同时，点击信源引用卡片，还可直接跳转至ima原文，并一键加入个人知识库。目前，ima知识号已覆盖金融、法律、医疗、教育等20余个行业，沉淀海量专业文件，知识内容被应用超过1.4亿次。</p>\n  <p><strong>百度搭子DuMate完成核心引擎升级</strong></p>\n  <p>36氪获悉，百度搭子DuMate完成核心引擎升级，通过Harness引擎及多项工程层面的持续调优，在保障Agent智能能力与任务执行效果不受影响的前提下，将任务执行过程中的Token消耗降低75%，对应用户积分消耗也相应减少75%。这也是国内通用智能体产品中，首次通过Harness引擎及工程优化实现任务消耗大幅下降。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>传阿里出价约118亿港元竞购朴朴超市？阿里暂无回应</strong></p>\n  <p>近日，有市场消息称，阿里巴巴计划出价15亿美元（约118亿港元）收购中国生鲜外卖平台福州朴朴电子商务有限公司。据知情人士透露，阿里的报价较高鑫零售早前出价高出逾一倍，或将引发一轮竞购战。对此，新浪科技向阿里官方进行求证，截至发稿对方暂无回应。（新浪科技）</p>\n  <p><strong>阿里菜鸟要解散？最新官方回复“假的，纯属谣言”</strong></p>\n  <p>36氪获悉，针对网传阿里菜鸟或将解散的消息，菜鸟方面回应：“假的，纯属谣言”。</p>\n  <p><strong>李书福、张雪据悉达成合作意向</strong></p>\n  <p>据央视财经6月15日报道，近日，在《对话》节目录制现场，吉利控股集团董事长李书福向张雪机车创始人张雪发起“摩托车慢骑”趣味挑战。据了解，李书福和张雪已经达成了一些合作意向。两人在现场表示，将联手推动世界超级摩托车锦标赛（WSBK）在中国落地举办。（央视财经）</p>\n  <p><strong>中国“纯硅”成功突破，我国攻克硅基量子芯片关键材料</strong></p>\n  <p>记者15日从中核集团了解到，我国科学家在稳定同位素富集领域取得关键性突破，首次成功实现丰度超过99.99%的硅-28同位素自主量产，产品关键指标达国际先进水平。标志着我国在构建自主可控、协同高效的稳定同位素产业格局方面迈出实质性步伐。（央视新闻）</p>\n  <p><strong>国内品牌金饰价格普涨，周生生金价重回1300元</strong></p>\n  <p>现货黄金震荡走高，国内金饰克价15日也随之上涨。周生生足金首饰克价1306元，较14日1274元涨了32元；老凤祥15日足金首饰克价1290元，较14日1271元涨了19元；老庙黄金足金首饰克价1299元，较14日1271元涨了28元。（财联社）</p>\n  <p><strong>原“死了么”App团队计划出让5%股份募资1000万，公司估值或达2亿元</strong></p>\n  <p>据报道，原“死了么”App团队计划募资1000万，出让公司5%股份，目前“死了么”App已改名为“在么在么”。“在么在么”披露了未来18个月的融资路线图。公司计划融资1000万元，从街道试点向区县复制样板迈进。创始人郭先生表示，资金将重点投向产品研发、市场拓展、交付运营及合规储备，其中产品研发占比最大为40%，市场拓展占比30%，交付运营占20%。（财联社）</p>\n  <p><strong>小红书公布世界杯开赛数据，平台直播在线人数创历史峰值</strong></p>\n  <p>36氪获悉，6月15日，小红书披露世界杯开赛前三日平台数据。观赛直播层面，开赛首日小红书世界杯直播在线观看人数，较赛事开赛前增长55倍，打破平台直播在线人数历史峰值，创下全新纪录。开赛前三日内，直播间球迷累计互动次数达到9000万次。</p>\n  <p><strong>“存款搬家”最新进展？业内人士：真实存在但并非大规模迁移</strong></p>\n  <p>6月15日讯，2026年，市场对“存款搬家”的讨论热度依旧不减，多家机构判断今年将迎来大量长期定期存款的集中“到期潮”，年内到期定存规模可达30万亿元至70余万亿元。业内人士表示，从二季度的数据来看，这个现象没有发生，或者说发生的规模比较小。当前A股呈现鲜明的结构性牛市特征，阶段性回调风险始终存在，这也会影响部分投资者的心态，“因此，‘存款搬家’的幅度没有大家想象中那么大，对市场的冲击也相对有限。”（21财经）</p>\n  <p><strong>立昂微：自6月15日起，对功率芯片业务全系产品价格调涨10%-15%</strong></p>\n  <p>36氪获悉，近日立昂微对客户发出产品价格调整通知函，对全系列产品进行涨价。公司表示，受上游原材料价格持续上涨影响，公司综合生产成本大幅增加，为保障产品品质、服务质量及供货稳定，自6月15日起，对功率芯片业务全系产品价格调涨10%—15%。</p>\n  <p><strong>安克创新据悉开始评估投资者对其香港上市的兴趣，筹资不超过7亿美元</strong></p>\n  <p>知情人士称，中国消费电子产品制造商安克创新已开始评估投资者对其香港上市的兴趣。知情人士称，该公司计划在未来数周通过香港上市筹资不超过7亿美元。文件显示，中金、高盛和摩根大通为联席保荐人。安克创新暂未回应置评请求。（新浪财经）</p>\n  <p><strong>阿里巴巴达摩院退出旗下科技公司</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，大蛮驴智能科技（浙江）有限公司发生工商变更，企业名称变更为杭州元识智瞳科技有限公司，原股东阿里巴巴达摩院（深圳）科技有限公司退出。该公司成立于2022年12月，注册资本5000万人民币，法定代表人为苏文博，经营范围包括电子元器件批发、电子元器件零售、电子元器件与机电组件设备销售等，现由上海模因智瞳科技有限公司全资持股。</p>\n  <p><strong>超大比例限售股解禁压顶，瑞玛精密跌停，公司回应</strong></p>\n  <p>6月15日早盘，瑞玛精密跌停，跌停价报29.59元/股。消息面上，6月15日，公司约2696.36万股定向增发限售股解禁，占总股本18.01%。发行价为23.44元/股，当前股价与发行价相比存在溢价，市场抛压较大。对此，瑞玛精密方面回应，股价受多重因素影响，此次下跌可能有一部分是定向增发限售股解禁的原因，盘面是市场买卖决定的。公司目前生产经营一切正常，公司业务没有明显的季节性周期特点，二季度业绩等情况以公司公告为准。（中证报）</p>\n  <p><strong>遇见小面创始人向“渝见小面”致歉</strong></p>\n  <p>“遇见小面”创始人宋奇6月15日发布致“渝见小面”的一封信，就“商标风波”致歉。信中称，“这两天，我闭门思过，想着除了道歉我到底还能做点什么。于是，我和团队决定将我们已注册的第35类‘渝见小面’商标无偿赠予你们，你们可以不用改换招牌而放心使用。如果你们还需要继续申请第43类商标（目前可以申请注册）或者还有其他方面的需要，我们也很愿意提供必要的帮助。”</p>\n  <p>据媒体报道，近日，河南南阳一家“渝见小面”餐饮店被连锁品牌“遇见小面”起诉商标侵权，对方律师称撤诉需赔偿七八千元，“渝见小面”负责人哭诉“我八块钱一碗的面，至少得卖1000碗，1000碗还有成本”。此事随之引发争议。6月13日，“遇见小面”发布关于商标事件的说明，称已第一时间沟通撤销对“渝见小面”的诉讼，并反思商标维权行动的流程。（界面新闻）</p>\n  <p><strong>罗马仕接连变更法定代表人</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，深圳罗马仕科技有限公司发生工商变更，雷子权卸任法定代表人、董事，由雷秀容接任上述职务。该公司成立于2012年3月，注册资本600万人民币，经营范围包括电子产品的研发、设计、制造与销售等，由江门市聚安科技有限公司全资持股。变更记录显示，今年5月，雷社杏卸任法定代表人，由雷子权接任。</p>\n  <p><strong>美股三大指数集体收涨，SpaceX大涨超19%</strong></p>\n  <p>36氪获悉，6月15日收盘，美股三大指数集体上涨，纳指涨3.07%，道指涨0.92%，标普500指数涨1.66%。SpaceX大涨19.6%，总市值跃升至2.52万亿美元。芯片股走强，西部数据涨超16%，美光科技涨超10%，希捷科技涨超9%，英伟达涨超3%。热门中���股多数上涨，拼多多涨超2%，百度、京东、网易、理想汽车小幅上涨，阿里巴巴、蔚来、哔哩哔哩小幅下跌。</p>\n  <p><strong>古尔曼：折叠屏iPhone与触屏MacBook即将亮相</strong></p>\n  <p>当地时间6月14日，知名苹果产业链记者马克・古尔曼（Mark Gurman）在最新一期《Power On》通讯中指出，苹果下一代操作系统iOS 27与macOS 27的开发者测试版中，涌现大量底层代码、交互逻辑与适配接口线索，这意味着折叠屏iPhone和触屏MacBook即将到来。</p>\n  <p>古尔曼表示，苹果本次系统测试版内的多项底层调整并非面向现有iPhone、Mac设备的常规功能优化，而是苹果工程团队提前数年为全新硬件形态铺设的底层软件代码。这是苹果在为两款酝酿已久的新形态硬件做系统级铺路，分别是折叠屏iPhone和配备触控屏的MacBook。（界面新闻）</p>\n  <p><strong>消息称SK海力士准备向主要客户提供HBM4E样品，最早本月发货</strong></p>\n  <p>据Nate报道，业内人士透露，SK海力士目前正筹备向主要客户送样HBM4E，首批样品最快将于本月出货，最迟不超过下个月。业内分析指出，鉴于HBM4E计划于明年正式量产，今年下半年必须完成客户的测试验证与优化流程，因此目前的送样节点已十分紧迫。（财联社）</p>\n  <p><strong>Anthropic将就Mythos相关纠纷与特朗普政府展开会晤</strong></p>\n  <p>一名接近Anthropic公司的消息人士透露，公司多名高层管理人员将于6月22日在华盛顿特区同特朗普政府官员会面，力求化解这家人工智能企业近期与美国政府爆发的重大纠纷。一份声明显示，Anthropic6月12日收到一份出口管制指令，文件援引国家安全相关部门的要求，勒令该公司全面禁止所有外籍人士使用其最新两款人工智能模型Fable 5与Mythos 5，无论外籍人士身处美国境内还是海外。（财联社）</p>\n  <p><strong>马斯克：SpaceX到2030年可能实现1万亿美元的营收</strong></p>\n  <p>埃隆·马斯克14日表示，他的火箭公司SpaceX到2030年营收有望达到1万亿美元。此前两天，该公司刚刚上市，估值超过2万亿美元。（新浪财经）</p>\n  <p><strong>美国顶级基金经理：通胀和“巨无霸IPO”引发流动性紧缩，纳指年内恐跌35%</strong></p>\n  <p>美国一位顶级基金经理表示，由于通胀压力和“巨无霸IPO”引发的流动性紧缩共同作用，纳斯达克指数今年可能下跌35%，这将构成当前牛市行情的重大阻碍。过去两周，半导体和成长股普遍出现大幅波动，仅6月5日一天，纳斯达克指数就下跌了4.8%，也就是所谓的“黑色星期五”。晨星评级为五星的Leader Capital高质量收益基金（High Quality Income Fund，简称LCATX）的共同管理人Slavik Kolesnik表示，此类下跌是未来更大幅度下跌的早期迹象。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>小红书或已准备好本月在香港提交IPO申请</strong></p>\n  <p>据透露，小红书科技有限公司正准备在本月底前秘密向香港提交首次公开募股（IPO）申请。（新浪财经）</p>\n  <p><strong>立讯精密计划最快于7月在香港上市，拟融资不超过30亿美元</strong></p>\n  <p>IFR援引知情人士报道称，立讯精密计划最快7月份在香港上市，拟筹资20亿至30亿美元。（新浪财经）</p>\n  <p><strong>国仪量子技术（合肥）股份有限公司科创板IPO注册生效</strong></p>\n  <p>36氪获悉，国仪量子技术（合肥）股份有限公司科创板IPO注册生效。</p>\n  <p><strong>开封清明上河园股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件披露，开封清明上河园股份有限公司向港交所提交上市申请书。</p>\n  <p><strong>燧原科技科创板IPO获上市委会议通过</strong></p>\n  <p>36氪获悉，燧原科技科创板IPO获上市委会议通过，公司拟融资金额60亿元。</p>\n  <h2>投融资</h2>\n  <p><strong>“秩益科技”技连续完成亿元级A轮及A+轮融资</strong></p>\n  <p>36氪获悉，据秩益科技消息，近日，“秩益科技”连续完成亿元级的A轮及A+轮融资。其中，A轮由老股东沂景资本独家增资；A+轮由毅达资本领投、比丘资本战略加持。熙桥资本担任本轮财务顾问。</p>\n  <p><strong>“极佳视界”再获10亿元B2轮融资</strong></p>\n  <p>36氪获悉，据极佳视界消息，近日，物理AGI企业“极佳视界”再获10亿元B2轮融资，本轮融资由新加坡跨境投资机构狮城资本、中国-比利时基金（中比基金）、建投投资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等全球国家队基金、产业资本、财务机构、国资平台共同投资，国中资本、达晨财智、图灵资管等多个老股东持续超额加注。本轮融资将主要用于“双金字塔”数据与算法体系的持续投入、物理AGI基础模型的研发迭代，以及C端家庭场景与B端工业场景的规模化落地。</p>\n  <p><strong>“洛梵狄”完成新一轮数千万元B+融资</strong></p>\n  <p>36氪获悉，智能短出行核心零部件供应商“洛梵狄”已完成新一轮数千万元B+融资。本轮投资方包括国泰海通、达晨财智、以及广州黄埔科创母基金，老股东达晨财智在本轮中继续追加投资。本轮融资资金将主要用于持续的研发投入、产能扩张、全球销售网络建设及日常运营流动资金。其中，研发重点将聚焦于下一代智能内变速器的深耕。</p>\n  <p><strong>“世航智能”完成A轮融资，融资金额超过10亿元</strong></p>\n  <p>36氪获悉，海洋具身智能公司“世航智能”完成A轮融资，融资金额超过10亿元，这也是目前全球海洋机器人领域规模最大的单轮融资。本轮融资由两家芯片公司摩尔线程和昆仑芯的产业投资方上河动量基金、新加坡国有投资平台Vertex Growth、上市公司大洋电机等资方出资。另外，金沙江创投也在本轮追加投资，这已是其创始人朱啸虎第五轮投资世航智能，祥峰中国、华映资本、长石资本等老股东亦全部超额跟投。本轮融资将主要用于核心技术研发、全球化市场拓展及产业链生态建设，进一步推动海洋机器人在复杂水下场景中的规模化应用。</p>\n  <p><strong>“大晓机器人”完成天使+轮融资</strong></p>\n  <p>36氪获悉，据大晓机器人消息，近日，“大晓机器人”已完成天使+轮融资。天使+轮吸引吉利资本、达晨财智、深创投、上海科创基金、沐曦股份、盛宇投资、复星锐正、华控基金、临港新片区基金、豫资涨泉等众多投资方支持，老股东商汤国香资本持续增资，告捷资本担任长期财务顾问。至此，大晓机器人2026年上半年已累计融资数亿美元。</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜娃娃菜</p>", "category": "tech", "published_at": "2026-06-15T23:56:18+00:00", "fetched_at": "2026-06-16T03:38:55.805155+00:00", "fingerprint": "7be5e6726a05dd7a"}, {"source": "少数派", "title": "Snapseed 4.0：Google 终于想起了这款「免费修图神器」", "url": "https://sspai.com/post/110525", "summary": "Snapseed可谓是手机摄影App届元老级的存在了，最早由软件公司NikSoftware于2011年开发推出，当年即被评为AppStore年度应用。
