 chip space with RTX Spark is huge. Apple has proved for years that Arm-based chips can perform incredibly well while also delivering great battery life - at least on the Mac. In the Windows world, performance hasn't fully matched up under Qualcomm chips, mostly in the [&#8230;]", "category": "tech", "published_at": "2026-06-01T20:02:31+00:00", "fetched_at": "2026-06-02T03:33:37.478679+00:00", "fingerprint": "fb5ac42330348230"}, {"source": "The Verge", "title": "Pebblebee&#8217;s Halo can help track lost items and keep you safe, and it&#8217;s on sale for $50", "url": "https://www.theverge.com/gadgets/941273/pebblebee-halo-bluetooth-tracker-personal-safety-deal-sale", "summary": "If you&#8217;re planning to travel this summer, both a Bluetooth tracker and a personal safety device can come in handy, especially if you&#8217;ll be exploring on your own. The Pebblebee Halo combines those two gadgets into one, and it&#8217;s currently on sale for $49.99 ($10 off) at Amazon, which is the best price we’ve seen. [&#8230;]", "category": "tech", "published_at": "2026-06-01T20:30:06+00:00", "fetched_at": "2026-06-02T03:33:37.478673+00:00", "fingerprint": "f3ca3476eeedfdc6"}, {"source": "The Verge", "title": "The Google Pixel Watch 5 may have been spoiled by… the creator of Borderlands", "url": "https://www.theverge.com/tech/941293/google-pixel-watch-5-randy-pitchford-borderlands", "summary": "We may just have gotten an early look at the Google Pixel Watch 5 - and from an unusual source. Randy Pitchford, the creator of the Borderlands game franchise, posted a pair of images of a watch on X, saying that his friend found it underwater while scuba diving near Saint Martin, as reported earlier [&#8230;]", "category": "tech", "published_at": "2026-06-01T20:59:14+00:00", "fetched_at": "2026-06-02T03:33:37.478663+00:00", "fingerprint": "9c753e24f6c74871"}, {"source": "36氪 - 最新文章", "title": "豆包6月下旬正式付费，并加速打通抖音电商丨独家", "url": "https://36kr.com/p/3834544830721671?f=rss", "summary": "<p>5月初旬，豆包将推出付费订阅服务的消息，引发市场广泛讨论。其在苹果App Store中更新的付费订阅方案显示，豆包将推出四档收费标准：基础版、标准版、加强版、专业版。对应的月收费价格为：免费、68元、200元、500元；年收费价格为：免费、688元、2048元、5088元。</p>\n  <p>随后官方回应：“豆包始终提供免费服务。在免费服务的基础上，我们也在探索推出更多增值内容，以满足不同用户的差异化需求。”</p>\n  <p>据36氪独家了解，以上只是豆包商业化的预热动作。在接下来的季度中，豆包将持续推进商业化的落地。知情人士透露，<strong>豆包预计将在6月下旬正式上线付费内容，并于同期举行的Force大会上更新相关功能。</strong>之所以选择这一时间节点，是因为PC端与移动端仍需约一个月时间，完成基础功能与收费体系的适配改造。</p>\n  <p><strong>据36氪了解，若进展顺利，豆包将于三季度进一步结合电商功能更新完善付费场景，并通过补贴为抖音商城进行引流，四季度进入运行期。</strong>这些动作，皆是为了面向2027年及更长期的商业化回报做准备。因此，2026年豆包将不会把付费用户的渗透率作为考察指标。</p>\n  <p>2025年10月，豆包初步和抖音电商打通。用户可以通过和豆包的对话，获取商品信息和购物链接推荐。据前述知情人士透露，当时，字节曾在小范围测试豆包硬广能力，但由于用户体验问题，后续暂停了放量。目前，豆包采取的是优先响应用户问题，再在答案中穿插横条商品推荐的互动模式。</p>\n  <p>前述知情人士表示，<strong>自2026年4月以来，用户对AI购物推荐的接受度较去年下半年有所提升，点击商品卡并看完详情页的转化率达3%以上。</strong>另一方面，豆包目前的用户增长已有所放缓。据36氪了解，增速放缓一部分也是字节有意为之的结果——昂贵的算力推理成本，使得字节在新一年减少了对豆包的推广投流。</p>\n  <p>移动互联网产品的常规节奏是先烧钱圈用户，再做商户化，但AI产品的商业化显然更紧迫了。字节也不例外。</p>\n  <h2><strong>01</strong></h2>\n  <h2><strong>订阅是个好选择吗？</strong></h2>\n  <p>据《彭博社》5月27日报道，字节跳动正在考虑投入最高700亿美元的资本支出，用于推进AI发展。而就在不到一个月前，《南华早报》5月9日援引知情人士报道称，字节已将其AI基础设施预算从去年的1600亿元人民币，上调至2000亿元人民币（约300亿美元）。持续加码的投入，也显示出字节正以前所未有的力度押注AI。</p>\n  <p>全球AI军备竞赛仍在不断升温，但如何赚钱已成为摆在所有公司面前的现实问题。</p>\n  <p>此前，36氪曾报道：尽管字节跳动2025年海外营收增长近50%，但由于对AI业务的巨大投入，整体净利润出现了超过70%的降幅（官方后澄清该降幅主要是国际会计准则的原因）。随着巨额资金的不断投入，迫使全球的科技公司，都很难继续停留在只谈技术理想、而不谈商业回报的阶段。</p>\n  <p>当前市场上，<strong>AI商业化落地最常被提及的三种路径，分别是订阅制、广告变现以及To&nbsp;B模型服务。其中，订阅制是最先被切入的商业化场景。</strong></p>\n  <p>回看海外市场，头部AI产品实际上很早便开始探索付费模式。2022年11月上线后，ChatGPT仅用了约两个月时间，便在2023年2月推出每月20美元的ChatGPT Plus订阅服务。随后，Anthropic也在2023年9月推出Claude Pro，同样定价20美元/月。相比之下，国内Chatbot产品过去较长时间仍停留在免费阶段，依旧延用“烧补贴抢占用户量”的竞争思路。</p>\n  <p>作为国内首个计划转向订阅的Chatbot产品，豆包的确拥有更深厚的用户基础。据AICPB产品榜全球总榜显示，豆包App端2026年4月的月活跃用户数约为3.36亿，环比增长1.51%，仅次于ChatGPT，排名全球第二。</p>\n  <p>问题在于：豆包能在Chatbot产品中迅速跻身头部，靠的并非模型本身的智能程度，更多是产品层面的易用性。加上抖音流量池强大的输送能力，让豆包率先在下沉市场中抢占了用户心智。</p>\n  <p>事实上，国内用户对单一AI产品并没有太强的忠诚度。据《晚点LatePost》报道，目前豆包的单用户日均使用时长为10分钟。在没有显著的技术壁垒、竞争对手又依旧免费的情况下，开放订阅可能会造成用户的流失。</p>\n  <p>不过，抛开产品本身不谈，订阅制本身也并非AI商业化的最佳路径。</p>\n  <p>即便是在付费意愿更强的西方市场，订阅所能带来的收益转化也依然有限。为了增加付费用户，ChatGPT在2026年推出了更便宜的ChatGPT Go，每月只需8美元。这使得它的付费用户人数从去年年底的4700万，增加至第一季度的5500 万。但据《The Information》报道，ChatGPT第一季度的周活跃用户平均约为9.05亿。<strong>换言之，即便是全球MAU规模最大的Chatbot产品，在推行订阅制三年后，付费转化率也仅为6.1%。</strong></p>\n  <p>付费人数难以提升，在于AI订阅模式自身的两难。</p>\n  <p>一方面，在竞争激烈、产品高度同质化的情况下，没有任何一家模型公司敢于彻底取消免费服务。对大多数轻度用户而言，免费版足以满足他们日常问答、资料查询的基础需求。另一方面，在Token依旧昂贵的当下，若需要AI来完成更复杂的任务，目前需要支付的最高价格则达到200美元/月（约1400元人民币）。而愿意为此长期买单的，本就是少数人。</p>\n  <p>更关键的是，即便定价如此之高，AI公司也未必赚钱。2025年6月，Sam Altman曾公开在社交平台X上表示，OpenAI在200美元/月的ChatGPT Pro的订阅上亏钱了。<strong>这导致了一个悖论——定价太高，用户不愿付费；定价太低，又难以覆盖算力成本。</strong></p>\n  <p>因此，C端订阅在当下更多只是“赔本赚吆喝”。想要真正实现商业回报，各大科技公司仍需探索更多商业化场景。比如，OpenAI就在今年2月，开始在ChatGPT中逐步上线并推广广告业务。</p>\n  <h2><strong>02</strong></h2>\n  <h2><strong>AI商业化如何落地</strong></h2>\n  <p>在经历长时间碰壁后，眼下，科技巨头们似乎终于找到了通往商业化的最佳路径——面向企业出售模型能力。企业无需自己训练模型，只要通过API接入，就能直接调用科技公司研发出来的AI模型能力，并按Token用量付费。</p>\n  <p>比起付费意愿有限的个人用户，企业完全有能力、也有意愿使用这些AI工具，来试图推动组织内部的经营提效。<strong>更重要的是，To B模式下，企业通常按照Token调用量持续付费，而非包月订阅</strong>（如前所述，面向普通用户的包月订阅价通常无法覆盖算力成本）。对模型厂商来说，这显然是笔稳赚不赔的好买卖。</p>\n  <p>Anthropic的利润增长已经充分说明了这一点。据《华尔街日报》5月21日报道，Anthropic第二季度的收入预计将增长逾一倍，达到109亿美元，并可能实现5.59亿美元的营业利润。<strong>在行业内仍在大规模烧钱补贴的阶段，Anthropic是第一家接近盈利的大模型公司。</strong>其主要收入来源是企业和初创公司的API调用。截至2025年10月，Anthropic拥有超过30万家企业客户，约占总收入的80%。</p>\n  <p>国内的互联网大厂也已相继在ToB市场布局和发力。和Anthropic等AI初创公司不同，互联网大厂坐拥云计算能力：一方面靠模型API变现，这类将A模型封装为云服务对外输出的形态，就是MaaS（模型即服务）；另一方面模型调用带来的算力消耗，又可能拉动自家云业务增长。</p>\n  <p>在这场新的AI云竞争中，字节旗下的火山引擎增长最快。5月7日，国际数据公司IDC公布的数据显示，2025年，中国企业在公有云上的大模型调用量相比去年暴增16倍。其中，接近一半的调用量都发生在火山引擎平台上，其市场份额达到49.5%，位居行业第一。</p>\n  <p>阿里也在2025年11月末启动了“百炼战役”，试图追赶AI云上的市场份额。据阿里2026年Q4财年的财报数据显示，阿里的“百炼平台”（阿里云的MaaS平台）客户数同比增长8倍。这也说明，阿里正在快速补强其AI To B市场能力。</p>\n  <p>除了To B市场带来的显性收益外，字节也在积极利用AI能力，来为自家的主营业务赋能。</p>\n  <p>以字节旗下的王牌AI模型seedance 2.0为例，其生视频能力进一步推动了短剧市场的创作热潮。有短剧行业人士告诉36氪，随着视频创作门槛的不断降低，行业内涌入了大量新玩家。他们背景各异，来自游戏、潮玩，甚至传统制造业。此外，单部短剧制作成本的降低，也让制作公司能够在总预算不变的情况下，生产更多剧集。</p>\n  <p><strong>创作者数量的激增，和制作成本的降低，双双推高了AI短剧的供给量。而在当下，短剧获取播放量最核心的方式，依旧是抖音侧的投流。</strong>一位短剧投流人士透露，目前AI短剧在字节巨量引擎体系内的日耗峰值约为1.2亿元。</p>\n  <p>负责短剧发行的嘉书科技创始人王小书告诉36氪，其所在公司去年每天的投流消耗仍只有几十万元，而今年已达数百万元，增长约10倍。与此同时，短剧出品方在巨量引擎上的ROI通常仅为1.03至1.07。这意味着，每投入100万元广告费用，能获得约3万至7万元利润。</p>\n  <p>可见，在短剧行业不断膨胀繁荣的背后，真正稳定受益的，更多仍是平台本身。</p>\n  <p><strong>AI+电商购物或将成为字节下一个发力场景。</strong>2026年3月30日，据《界面新闻》报道，豆包的购物支付功能正在进行灰度测试。该功能支持用户在豆包APP内直接下单商品并完成支付，无需跳转至抖音商城。</p>\n  <p>豆包不是第一个试图打通AI购物闭环的AI产品。今年5月11日，阿里千问就已正式接入淘宝，打通了AI购物功能。去年9月，ChatGPT也曾推出过“即时结账”（Instant Checkout）功能，试图引导用户直接在AI对话框中完成下单与支付。但今年3月，OpenAI已经取消了这一功能。原因在于，打通技术路径容易，但想打通背后完整的电商生态体系却很难。</p>\n  <p>豆包与千问的优势在于，它们背后分别站着抖音商城与淘宝这两大成熟电商体系。无论是商品库、商家生态、支付还是履约能力，都早已存在。这也让AI购物这件事，在理论上看起来更加成立。</p>\n  <p>但即便如此，AI购物仍需面对两大核心拷问。<strong>一是，AI购物本身是否是真需求？</strong>春节期间，千问曾投入30亿元红包，请用户用AI点奶茶，试图培养消费者通过AI完成消费决策的习惯，36氪也曾对此进行报道。但从结果来看，大多数用户并未形成长期留存。而相比点外卖，购物本身又是一个更复杂、更依赖比较与决策的场景。</p>\n  <p><strong>二是，消费者是否真的会信任AI的商品推荐？</strong>随着AI搜索与推荐能力的重要性提升，部分商家已经开始通过GEO（生成式引擎优化）等方式，影响大模型对信息的抓取与排序。今年315晚会上被曝光的GEO产业链，也曾引发广泛讨论。当AI推荐开始受到商业投放与利益关系的影响后，消费者究竟会将其视为客观建议，还是新的广告入口，仍有待观察。</p>\n  <p>（周鑫雨对本文亦有贡献）</p>\n  <p><strong>编辑&nbsp;|&nbsp;乔芊 杨轩</strong></p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/2yBSevOAAyRuE24aiICLAQ\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪未来消费”</a>，作者：肖思佳，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-06-01T11:44:01+00:00", "fetched_at": "2026-06-02T03:33:37.337867+00:00", "fingerprint": "e782e9d68acc479d"}, {"source": "36氪 - 最新文章", "title": "首轮融资数千万美元、估值2.5亿美元，「Aippy」正在打造下一代AI游戏社区 | 36氪首发", "url": "https://36kr.com/p/3834400181741440?f=rss", "summary": "<p>36氪获悉，<strong>NADA AI团队开发的AI游戏社区「Aippy」，已于近日完成数千万美元首轮融资，本轮由歌未资本（Glowill Capital）投资，投后估值2.5亿美元。</strong>本轮资金将主要用于顶尖人才引进和欧美核心市场用户规模化增长。</p>\n  <p>Aippy成立于2025年，由港股上市公司赤子城科技孵化，其创始人、CEO&nbsp;Evan (叶椿建）是赤子城联合创始人，并长期担任赤子城CTO，在海外社交、游戏领域有十余年深耕经验。目前团队规模接近30人，核心成员来自清华大学、美国西北大学、慕尼黑工业大学等国内外顶尖高校，覆盖算法、产品、运营等关键岗位。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_6bfbfcd3a065413d9cb6072dcaed7537@242988687_oswg408135oswg1200oswg657_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Aippy产品界面图</p>\n  <p><strong>作为AI驱动的游戏创作与互动社区，Aippy定位于为年轻一代数字原住民打造“人人都能做游戏”的UGC平台，用户仅需用自然语言描述想法，AI即可在数分钟内生成可交互游戏。</strong>其他用户可以像刷短视频一样沉浸式体验平台内的UGC游戏，也能一键在原有作品基础上进行二创（Remix），融入个人创意后重新发布。</p>\n  <p>据了解，Aippy最初诞生于AI工具方向的探索。2025年初Vibe Coding概念兴起时，Evan&nbsp;带领团队切入，但很快产品便做出关键战略转向，因为团队判断纯AI工具赛道天花板有限，不仅面临巨头厂商的竞争，也难以解决用户黏性和商业化两大核心问题。</p>\n  <p>AI降低创作门槛后，普通用户的创造力有待释放，若能打造一个面向大众的AI游戏创作社区，市场空间远大于工具赛道。因此，团队果断放弃了纯工具方向，从年轻人熟悉的游戏品类切入，正式转向C端AI游戏社区，仅用数月便完成了产品验证。</p>\n  <p><strong>截至目前，Aippy全球总下载量突破300万，月活跃用户近200万，</strong>在美国App Store评分为4.8分；平台UGC游戏作品总量突破200万，每日新增创作量较年初增长10倍。</p>\n  <p>此外，用户日均使用时长较年初提升25%，DAU互动率接近50%；Discord核心社区已聚集1.5万名深度用户，形成了真实的创作者交流氛围。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_918d5ae54dbf458891c7344ebff0ee9c@242988687_oswg3369961oswg4001oswg2251_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">用户在 Aippy 中生成的游戏作品</p>\n  <p>为降低普通用户的创作门槛，Aippy做了大量针对性产品优化：平台提供预设创意模板引导，AI会实时给用户延伸创作建议，避免用户面对空白页面卡壳；支持语音输入、AI生成素材、一键修复错误、预览调整等全链路创作工具，让整个创作流程都能在平台内完成，用户不需要跳转其他工具。</p>\n  <p>核心的Remix二创机制进一步降低了创作门槛，用户看到喜欢的作品，可以直接在原有基础上修改融入个人创意，重新发布即可。这一机制让同一个创意源头能够衍生出数十个新版本，内容越丰富越能激发更多创作。</p>\n  <p>市场策略方面，和很多同类项目追求快速扩张、全区域覆盖不同，<strong>Aippy坚持聚焦欧美等发达地区，保持社区调性。</strong></p>\n  <p>NADA AI团队接受36氪采访时表示，选择聚焦欧美核心市场出于三点考量：第一，欧美用户对新奇的AI原生内容接受度更高，UGC创作者文化也更加成熟，与Aippy的模式天然适配；第二，欧美用户的内容付费习惯早已养成，不需要重新教育市场，早期验证商业模式的效率更高；第三，当前主流大语言模型对英文Prompt的理解和生成质量优于其他语言，能给用户更好的AI生成体验。</p>\n  <p>这一策略也得到了数据验证：<strong>Aippy目前自然流量占比已超过30%</strong>，证明产品已经形成了自传播趋势，不需要完全依赖买量拉动。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_2581da3fe86b411092e44cf4b8d382f4@242988687_oswg773846oswg1400oswg900_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Aippy对话式创作Agent</p>\n  <p>本轮融资后，Aippy将围绕两个核心方向发力，一是继续优化内容推荐与分发机制，提升用户使用体验；二是升级创作者成长体系和激励机制，与更多创作者共建健康、高质量的游戏内容社区。目前，<strong>NADA AI希望吸引更多高级的算法、Agent工程师，以及产品运营方向的顶尖人才。</strong></p>\n  <p>对于AI&nbsp;互动游戏赛道，Aippy团队认为，AI的价值不是取代专业游戏开发者，而是释放普通用户的创造力，就像数码相机普及后没有取代专业摄影师，反而让摄影走进大众生活，AI也不会取代游戏公司，而是会开辟一个全新的互动娱乐市场，让每个普通人都能把想法变成可玩的游戏，让创意回归纯粹的乐趣。</p>\n  <h4><strong>投资方观点：</strong></h4>\n  <p>本轮投资方歌未资本Glowill Capital成立于中国香港，是⼀家面向全球的多策略、多市场资本平台，聚焦人工智能、量子计算、新能源、生物医药、半导体等全球高景气赛道。</p>\n  <p>歌未资本相关负责人表示，投资Aippy主要基于两点判断：一是团队具备扎实的ToC互联网产品和海外市场运营经验，在社交、游戏等领域有深厚积淀，能力模型稀缺；二是看好赛道的成长空间，Aippy在“降低游戏创作门槛+社区生态打造”这个方向上跑在了前列。</p>", "category": "tech", "published_at": "2026-06-02T00:00:06+00:00", "fetched_at": "2026-06-02T03:33:37.337861+00:00", "fingerprint": "855da7c52fa1044f"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨豆包将在6月下旬正式付费 ；韩国SK海力士工厂发生火灾；宇树科技IPO过会，王兴兴身家或超140亿", "url": "https://36kr.com/p/3835278829008257?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>闲鱼回应读取用户手机内文物照片上架售卖</li>\n   <li>赛力斯字节合作新品牌细节曝光：将推纯电、增程双动力</li>\n   <li>英伟达推出NVIDIA DSX平台</li>\n   <li>OpenAI官宣进军机器人赛道，短期内专注研发协助型机器人</li>\n   <li>4月中国产汽车在韩国注册登记进口榜排第三，史上首超日本车</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>豆包预计6月下旬正式付费，并加速打通抖音电商</strong></p>\n  <p>5月初旬，豆包将推出付费订阅服务的消息，引发市场广泛讨论。随后官方回应：“豆包始终提供免费服务。在免费服务的基础上，我们也在探索推出更多增值内容，以满足不同用户的差异化需求。”</p>\n  <p>据36氪独家了解，以上只是豆包商业化的预热动作。在接下来的季度中，豆包将持续推进商业化的落地。知情人士透露，豆包预计将在6月下旬正式上线付费内容，并于同期举行的Force大会上更新相关功能。之所以选择这一时间节点，是因为PC端与移动端仍需约一个月时间，完成基础功能与收费体系的适配改造。</p>\n  <p>若进展顺利，豆包将于三季度进一步结合电商功能更新完善付费场景，并通过补贴为抖音商城进行引流，四季度进入运行期。</p>\n  <p><strong>韩国SK海力士工厂发生火灾，造成对人体有害的氟气泄露</strong></p>\n  <p>当地时间6月1日上午10时32分左右，位于韩国忠清北道清州市的SK海力士第四园区内，连接两个生产间的气体室发生火灾，自动喷淋系统在起火后随即启动，火势及时得到控制，但对人体有害的氟气发生泄露，7人被送往医院接受治疗。</p>\n  <p>在有毒气体泄漏后，SK海力士立即疏散了相关工厂内的约3600名员工。之后于当地时间13时38分左右完成残留气体清除工作，经确认无异常情况后，重新开放全部工厂建筑，并宣布事件处置结束。SK海力士方面表示，工厂的生产设备运行未受影响，不会使生产中断；目前公司正在调查事故发生的确切原因。”（央视新闻）</p>\n  <p><strong>宇树科技科创板IPO过会，拟募资42.02亿元</strong></p>\n  <p>上交所官网显示，上交所上市审核委员会定于6月1日召开审议会议，审议宇树科技（首发）。宇树科技此次科创板IPO拟募资42.02亿元，拟用于智能机器人模型研发、机器人本体研发、新型智能机器人产品开发及智能机器人制造基地建设四大项目。</p>\n  <p>截至目前，本周（6月1日到5日）将有3家公司IPO上会，为拟闯关科创板IPO的宇树科技（300674），创业板IPO的中塑股份，北交所IPO的杰锋动力。（证券时报）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美股三大指数集体收涨，英伟达涨超6%</strong></p>\n  <p>36氪获悉，6月1日收盘，美股三大指数集体上涨，道指涨0.09%，纳指涨0.42%，标普500指数涨0.26%。大型科技股跌多涨少，Meta跌超5%，特斯拉跌超4%，苹果、谷歌跌超1%，奈飞小幅下跌；Arm涨超15%，英伟达涨超6%，微软涨超2%。热门中概股涨多跌少，蔚来涨超6%，B站涨6%，小鹏集团涨超4%，腾讯音乐、拼多多涨超3%，爱奇艺涨超2%，微博涨超1%；理想汽车跌超3%，百度跌超2%。&nbsp;</p>\n  <p><strong>谷歌拟筹800亿美元，伯克希尔100亿美元跟投</strong></p>\n  <p>6月2日，谷歌母公司Alphabet(GO0G.0)正通过股权发行筹集800亿美元资金，其中包括与伯克希尔·哈撒韦公司达成的一项投资协议，旨在为其雄心勃勃的人工智能支出计划筹措资金。Alphabet在公告中披露，此次融资行动包括300亿美元的承销公开发行，以及400亿美元的“按市价发行”(ATM)交易。作为此次融资计划的一部分，伯克希尔·哈撒韦公司将通过私募方式认购价值100亿美元的股票，Alphabet将以每股351.81美元的价格向伯克希尔发行价值50亿美元的A类普通股，并以每股348.20美元的价格发行另外50亿美元的C类普通股。该公司在声明中表示：AI需求已超出公司现有供应能力。通过扩大投资规模，公司旨在扩展基础架构，从而为迎接未来的巨天增长机遇提供有力支撑。（金十数据）</p>\n  <p><strong>智谱：建议A股发行并在科创板上市</strong></p>\n  <p>36氪获悉，智谱公告，于2026年6月1日举行的董事会会议上，公司建议向中国相关监管机构申请配发及发行A股，并向上海证券交易所申请该等A股在科创板上市及准予交易。公告指出，建议A股发行数量占建议A股发行完成后公司总股本的2%至8%之间（不含因超额配股权获行使而将予发行的任何A股），即不少于9,098,838股且不多于38,768,964股新A股。预计建议A股发行全部为新股发行，原股东不公开发售股份。</p>\n  <p><strong>黄仁勋宣布：联手宇树打造1.8米参考人形机器人</strong></p>\n  <p>6月1日，英伟达首席执行官黄仁勋宣布，英伟达已与宇树科技合作，推出新一代人形机器人参考设计H2+，也被称为Isaac GR00T系统，以加速全球人形机器人行业创新。黄仁勋在演讲中表示，这套系统已经完成整体集成。机器人本体拥有31个自由度，每只机械手拥有25个自由度，整机身高约1.8米、重量约68公斤。（红星新闻）</p>\n  <p><strong>闲鱼回应读取用户手机内文物照片上架售卖</strong></p>\n  <p>5月30日，江苏网友顾女士发帖吐槽称，自己打开闲鱼APP后发现，账号待售页面竟出现了陕西历史博物馆镇馆之宝“唐鎏金舞马衔杯纹皮囊式银壶”，标价6000元，而整个上架过程由平台AI自动完成，她本人毫不知情。</p>\n  <p>客服解释称，可能是她此前将照片上传至“闲鱼空间”，系统因此自动生成商品并上架。但顾女士表示，自己不记得上传过这张文物照片，而且即使曾误传到“闲鱼空间”，平台也不应在没有明确提示的情况下，自动将照片包装成商品并标价出售。她发现，系统不仅自动生成了价格，还配上了“整体包浆自然”“适合收藏或陈设摆件”等AI文案。</p>\n  <p>闲鱼对此表示，闲鱼始终严守法律底线，坚决反对并积极配合国家机关打击文物违法交易。目前，闲鱼已接入国家文物局“中国被盗（丢失）文物信息发布平台”，可对820条国家级被盗文物数据进行智能比对；同时已对收藏领域72个高敏类目提升发布门槛，要求卖家明确勾选是否具备来源凭证。对于相关产品体验问题给大家带来的困扰，我们深表歉意。后续将尽快加强���品上架提醒和用户确认，避免类似误解再次发生。（上游新闻、中新经纬）</p>\n  <p><strong>超1.4万人砸12亿抢购SpaceX代币，总认购资金高达1.77亿美元</strong></p>\n  <p>今年4月，一款标榜能分享SpaceX上市收益、最低投资门槛仅100美元、且仅面向美国以外投资者的代币——preSPAX，在短短三天内吸引了超过1.4万名投资者涌入，总认购资金高达1.77亿美元（约合人民币12亿元）。</p>\n  <p>然而，preSPAX投资者买到的并非SpaceX真实股权，也无法享受SpaceX分红与投票权。这款代币的性质及其发行人的风险，可能导致投资者“血本无归”。“100美元，即可押注SpaceX上市经济效益”，这让原本仅面向机构的pre-IPO投资，看似向普通投资者敞开了大门。</p>\n  <p>4月18日，总部位于开曼群岛的私募股权投资与代币化公司Republic发行的代币产品preSPAX一经开放认购，便遭疯抢，仅3小时就吸引了4633人参与。截至4月21日认购期结束，共有14435名投资者参与，总认购金额达到1.77亿美元，较原定发行额度超额认购约2.9倍。（每日经济新闻）</p>\n  <p><strong>黄仁勋表示AI未减少工作岗位</strong></p>\n  <p>英伟达CEO黄仁勋在台北的GTC演讲中表示，“有用的AI”时代已经到来，现在token（词元）是利润单位，AI是GDP“生成器”，软件工程师的数量正在增加。人们谈论AI减少了工作岗位，这完全是胡说八道，实际上有更多软件工程师被雇用。（第一财经）</p>\n  <p><strong>多家全国性银行今年不再报送数据，房地产贷款集中度管理进一步“放松”</strong></p>\n  <p>记者近日从多家全国性银行了解到，2021年起执行的“商业银行房地产贷款‘五档两线’集中度管理制度”已进一步“放松”，有关部门去年底已不再要求专门上报相关数据。一家全国性商业银行对公业务负责人向记者证实，今年该行没有报送数据，因去年底有关部门曾口头传达相关数据不再报送。一家全国性商业银行负责贷款统计和管理的人士亦对记者表示，有关部门已经不再向银行提及房地产贷款占比的情况，“没再听说有相关要求”。（财联社）</p>\n  <p><strong>梦露百年诞辰遗物首拍：精神科医生信件曝光其生命最后一天</strong></p>\n  <p>今年6月1日是好莱坞传奇演员玛丽莲·梦露（Marilyn Monroe）的百年诞辰。趁此机会，她的一批珍贵遗物也于当天首次登上拍卖场。负责这次拍卖的海瑞得拍卖行（Heritage Auctions）推出的线上专场中，包含梦露生前的手写信、照片、诗作、水彩画、服饰及各类配饰等物件，有待价高者得。</p>\n  <p>这批拍品大多来自梦露的好友、美国诗人诺曼·罗斯滕（Norman Rostwo'gen）及他的妻子赫达（Hedda Rosten）的个人收藏，起拍价在500美元到50000美元不等。其中，最贵的拍品是梦露的精神科医生拉尔夫·格林森（Ralph Greenson）写给罗斯滕的三封信件。最重要的一封写于1962年8月15日——距离梦露猝然离世仅11天，格林森医生在信中详细回顾了梦露生命最后一天的经过，以及她去世后数小时内的情况。（澎湃新闻）</p>\n  <p><strong>俄政府出台临时禁令：6月1日起禁止出口航空煤油</strong></p>\n  <p>当地时间6月1日，俄罗斯政府发布消息称，为保障国内燃料市场的稳定可靠供应，对航空煤油（包括在交易所交易中购得的煤油）实施临时出口禁令。该禁令自6月1日起生效，将持续至2026年11月30日。</p>\n  <p>禁令不适用于以下情况：运输途中飞行器技术容器内的燃料、禁令生效前已报关的航空煤油批次，以及根据政府间协议的供应。（央视新闻）</p>\n  <p><strong>赛力斯字节合作新品牌细节曝光：将推纯电、增程双动力</strong></p>\n  <p>据媒体报道，赛力斯和字节跳动旗下火山引擎深度合作的新汽车品牌快要来了。6月1日，记者从知情人士处获悉，赛豆科技旗下首款车型预计今年内推出，或为跨界车，即介于SUV和轿车之间，并预计将推纯电+增程双动力。据前述知情人士透露，该车预计将在赛力斯凤凰工厂生产，后者目前已处于改线阶段。“赛豆科技相关车型主要与火山引擎合作车机交互大模型等，双方会定期交流等，智驾方案预计不会用华为乾崑。”前述知情人士向记者透露。（新浪财经）</p>\n  <p><strong>行业内爆料称iOS&nbsp;28或迎来颠覆性升级</strong></p>\n  <p>据行业相关爆料，目前iOS 28和iPadOS 28已经进入早期开发阶段，整个系统的内部开发代号为Bell，整套系统完全围绕iPhone 20的全新硬件特性量身打造，是苹果近年来规划层级最高、投入资源最多的一次软件升级，战略意义非同一般。</p>\n  <p>从最新流出的开发计划信息来看，今年将要推送的iOS 27只是一次常规迭代，并不会有颠覆性的底层视觉升级，明年的iOS 28才是苹果的重头戏。（快科技）</p>\n  <p><strong>存储器价格暴涨近1000%，供需紧张与AI需求激增</strong></p>\n  <p>今年一季度，中国集成电路出口724.7亿美元，同比增长77.5%，其中存储器产品出口459.9亿美元，同比增长174.2%。业内人士表示，跟去年3月份比，存储器价格涨幅已经达到了将近十倍，甚至还有一些十几倍的增长，国产品牌价格和海外品牌有比较大的价差，价格是很有竞争力的。</p>\n  <p>业内人士表示，存储器产品出口的爆发式增长，既有全球供需紧张的周期性因素，更有国内存储行业产业链升级、市场份额提升的产业结构性变革等因素。记者发现，在存储器出口金额激增的背景下，国产存储企业正经历一场从“规模扩张”到“技术深耕”的深刻转变。业内人士表示，这一轮AI驱动的“超级周期”，为国产存储行业提供宝贵的“利润反哺研发”窗口期，不少企业正抓住机遇，从“跟随者”向“并跑者”转变。（央视财经）</p>\n  <p><strong>英伟达推出NVIDIA DSX平台</strong></p>\n  <p>英伟达当地时间5月31日宣布推出NVIDIA DSX平台，为基础设施构建者提供创建AI工厂的完整行动指南。英伟达CEO黄仁勋表示：“借助DSX平台，你可以在不花一分钱的情况下对整个工厂进行模拟，在安装一个机架之前验证性能，并以生产级AI所需的可靠性运营。”（界面新闻）</p>\n  <p><strong>OpenAI官宣进军机器人赛道，短期内专注研发协助型机器人</strong></p>\n  <p>OpenAI CEO山姆·奥特曼在社交平台发布OpenAI Robotics招聘信息，称公司正在寻找杰出的全栈硬件、运营、系统及机器学习工程师，共同编程并制造对社会真正有用的机器人。奥特曼表示，人工智能应当能够在现实世界中帮助人类。短期内，OpenAI专注于研发能够协助技术工人建设未来基础设施的机器人；长远来看，公司设想未来的每个人都能拥有一个可以完成各种需求的个人机器人。奥特曼透露，OpenAI的世界模拟研究项目在过去一年中发展迅速，现演变为OpenAI Robotics。项目由阿迪亚·拉梅什领导，目前的进展十分迅猛，其根基在于机器人硬件研究与机器学习研究的深度融合与协同设计。（界面新闻）</p>\n  <p><strong>宗馥莉名下娃哈哈广盛投资公司更名宏盛</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，杭州娃哈哈广盛投资有限公司发生工商变更，企业名称变更为杭州宏胜广盛投资有限公司。该公司成立于2001年6月，宗馥莉为法定代表人、执行董事、经理并全资持股该公司，注册资本8000万人民币，经营范围为实业投资。</p>\n  <p><strong>小米汽车：2026年5月，小米汽车交付量持续超过30000台。</strong></p>\n  <p>36氪获悉，小米汽车公布，2026年5月，小米汽车交付量持续超过30000台。</p>\n  <p><strong>4月中国产汽车在韩国注册登记进口榜排第三，史上首超日本车</strong></p>\n  <p>韩国进口车协会（KAIDA）6月1日发布数据显示，4月在韩新注册登记的进口车中，中国产汽车排名第三，史上首次赶超日本产汽车。数据显示，欧洲产以1.68万辆排名第一，其后依次为美国产（1.36万辆）、中国产（2023辆）和日本产（1974辆）等。中国产占比为6%，略高于日本产（5.8%）。（界面新闻）</p>\n  <p><strong>中金：钨的新兴需求及战略属性日益增强，钨价有望企稳回升</strong></p>\n  <p>36氪获悉，中金公司研报指出，2025年钨价行情启动，国内钨精矿价格自14.2万元/吨上涨至年底45.6万元/吨，累计+221%。进入2026年，国内钨价加速向上，在3月中一度突破100万元/吨。但是，今年2月中东冲突以来，霍尔木兹海峡通行受阻、交战双方互相攻击能源设施引发油价超预期上涨，加剧全球经济滞胀恐慌。这导致此前本就过快上涨的国内钨价迎来逆转，产业链出现抛售潮，下游观望情绪加重。今年5月国内白钨精矿价格下探至40.6万元/吨年内低点，较3月高点-61%。</p>\n  <p><strong>国家统计局6月1日启动入户调查</strong></p>\n  <p>近日，国家统计局发布公告称，将于2026年在全国范围内开展两次人口固定样本跟访调查。国家统计局决定于2026年在全国范围内开展两次人口固定样本跟访调查。调查结果将用于加强人口变动统计，服务人口高质量发展。入户调查于6月1日启动。（央视新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>字节跳动AI Agent平台扣子Coze正式上线3.0全新版本</strong></p>\n  <p>36氪获悉，6月1日，字节跳动旗下AI Agent平台扣子（Coze）3.0全新版本正式上线。据了解，扣子3.0全新版本支持多人多Agent协作、金融、自媒体、医疗、法律、科研等行业技能包，以及一键加载、多端同步等。同时，Claude Code、Codex CLI、Openclaw等可一键接入。</p>\n  <p><strong>牧原与阿里云达成AI战略合作</strong></p>\n  <p>36氪获悉，牧原集团与阿里云达成AI战略合作。双方将依托牧原在畜牧行业积累的数据与专家经验，结合千问大模型与阿里云智算算力，共同打造智能养猪大模型，推动AI在饲料营养、种猪育种、养殖管理、兽医健康等核心领域的落地。目前，基于千问打造的AI应用\"小牧助手\"已将每批次约600头猪的健康检测耗时从20分钟大幅缩短至秒级，效率提升超百倍。</p>\n  <p><strong>LobsterAI上线图片视频大模型矩阵</strong></p>\n  <p>36氪获悉，国内大厂首个开源龙虾类产品LobsterAI（网易有道龙虾）近日宣布上线图片生成与视频生成能力，并一次性接入包括Seedream、Seedance、HappyHorse、MiniMax-Hailuo在内的模型。</p>\n  <p><strong>鸿海和法国公司Bull将合作生产AI和云基础设施</strong></p>\n  <p>据声明，Bull和鸿海科技集团（富士康）将共同制造人工智能AI和云基础设施。 该项目将涉及Bull位于法国昂热的工厂和富士康位于捷克帕尔杜比采的工厂。Bull在声明中表示：“为了在法国执行这项战略部署，该项目预计将涉及超过1.2亿欧元的初始投资”。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>Anthropic称已秘密提交IPO申请</strong></p>\n  <p>Anthropic周一表示，已向监管机构秘密提交了首次公开募股招股说明书，这是这家人工智能初创公司走向上市的重要一步。Anthropic在一份声明中表示：“这让我们在美国证券交易委员会完成审核后可以选择上市。拟议的首次公开募股将取决于市场状况和其他因素。”（新浪财经）</p>\n  <p><strong>智享生物向港交所提交上市申请</strong></p>\n  <p>36氪获悉，据港交所文件，6月1日，智享生物（苏州）股份有限公司向港交所提交上市申请书，独家保荐人为东兴证券（香港）。</p>\n  <p><strong>上海福贝宠物用品股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，上海福贝宠物用品股份有限公司向港交所提交上市申请书，独家保荐人为国金证券（香港）有限公司。</p>\n  <p><strong>成都卡诺普机器人技术股份有限公司向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，成都卡诺普机器人技术股份有限公司向港交所提交上市申请书，独家保荐人为国泰海通。</p>\n  <h2>大公司财报</h2>\n  <p><strong>美团：第一季度营收910.4亿元，同比增长5.6%</strong></p>\n  <p>36氪获悉，美团发布2026年第一季度财报，财报显示，该季度营收910.4亿元，同比增长5.6%；经营亏损由上季度的161亿元减少至65亿元。一季度，美团核心本地商业实现收入641亿元，经营亏损环比收窄至20亿元；新业务收入270亿元，同比增长21%，经营亏损收窄至21亿元。一季度，美团研发投入70亿元，同比增长22%，占总收入的7.7%。</p>\n  <h2>酷产品</h2>\n  <p><strong>英伟达发布面向Windows系统个人电脑的新款处理器</strong></p>\n  <p>英伟达正式进军个人电脑芯片市场，推出全新处理器，意在打破英特尔在该领域的垄断地位，并推动PC设备适配人工智能时代的发展需求。英伟达首席执行官黄仁勋在台北国际电脑展上表示，今年秋季起，戴尔、联想等主流PC品牌将陆续推出搭载RTX Spark超级芯片的笔记本及台式机。这款由英伟达联合联发科共同研发的产品，集成了处理器与显卡，可运行微软Arm架构版Windows系统。（财联社）</p>\n  <p><strong>科技记者古尔曼：苹果更轻薄的Vision Air头显预计2028年末或2029年发布</strong></p>\n  <p>科技记者古尔曼称，苹果在研发一款更纤薄、轻便的头显，作为售价3499美元的初代Vision Pro的迭代产品。这款新品最早要到2028年末或2029年才会发布。（财联社）</p>\n  <p><strong>英特尔拟年底前推出新AI芯片，将使用更便宜内存与风冷技术</strong></p>\n  <p>据报道，英特尔计划在今年年底前推出一款人工智能芯片，该芯片使用的内存和冷却技术比英伟达和AMD的同类产品更便宜。领导英特尔数据中心部门的Kevork Kechichian表示，该公司正“从基础入手”。其新款“Crescent Island”图形处理器旨在加速“推理”任务（即用户提出请求的阶段），而非模型训练——这是英伟达处理器占据主导地位的领域。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“无界进化”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，据晶泰科技消息，其深度孵化的AI生物企业“无界进化”（INFevo）已完成数千万元天使轮融资，由顺为资本、红杉中国与松禾资本共同参与。</p>\n  <p><strong>“博登智能”宣布完成数亿元A+轮及A++轮融资</strong></p>\n  <p>近日，“博登智能”正式宣布完成数亿元A+轮及A++轮融资，鼎晖百孚、清新资本、鲁信创投、深产投等多家知名机构联合参投。作为面向Physical AI时代的真实世界AI基础设施公司，博登智能深度布局具身智能、大模型与自动驾驶三大核心方向，构建起“真实世界场景网络、全自动化数据引擎、现实世界验证体系”三层能力生态。本轮融资将进一步推动博登智能核心技术平台升级、全球真实世界训练网络建设及顶尖人才集聚，加速“Train at Scale, Validate in Reality”战略落地。</p>\n  <p><strong>“微光医疗”完成数亿元融资</strong></p>\n  <p>36氪获悉，近日，“微光医疗”完成新一轮数亿元融资。本轮融资由中美绿色长三角和倚锋资本共同领投，中银资本、汇誉投资共同跟投。此次融资将重点用于公司核心产品的全球商业化布局，以及创新管线的研发、注册与临床推进，进一步夯实微光医疗在智能介入领域的战略布局。</p>\n  <p><strong>“睿健医药”完成2.1亿元C1轮融资</strong></p>\n  <p>通用型细胞治疗平台企业“睿健医药”近日宣布完成2.1亿元人民币C1轮融资，本轮融资由光合创投及杏泽资本联合领投。募集资金将主要用于公司核心临床管线推进、AI+化学诱导平台持续升级、规模化生产体系建设、全球临床开发及国际化商业合作布局。</p>\n  <p><strong>整理</strong>｜徐嘉彤</p>", "category": "tech", "published_at": "2026-06-02T00:12:57+00:00", "fetched_at": "2026-06-02T03:33:37.337855+00:00", "fingerprint": "11f7ac5d14512780"}, {"source": "36氪 - 最新文章", "title": "前美团外卖技术负责人创业，做具身智能时代的“餐饮世界模型”", "url": "https://36kr.com/p/3834292242130825?f=rss", "summary": "<p>具身智能的落地，正在从实验室走向最真实、最繁忙的物理世界。</p>\n  <p>而元节智能（AtomBite.AI）选择了一个看起来并不性感、但足够真实的场景：餐饮后厨。</p>\n  <p>36氪获悉，具身智能公司元节智能近日完成千万级种子轮融资，由英诺科创基金领投，水木清华校友种子基金、知名投资人个人跟投。资金将主要用于餐饮场景具身世界模型研发及核心产品落地。</p>\n  <p><strong>元节核心团队在成立公司前有过较长时期的探索和孵化，此次融资标志着项目初步验证可行性，并已拿到国内外多家头部公司的产品合作部署意向。</strong></p>\n  <p>元节智能的创始团队带有鲜明的“美团基因”。</p>\n  <p>创始人兼CEO王栋博士曾任美团外卖事业部技术负责人，管理千人产研团队，主导构建支撑日均数千万订单的外卖算法、数据与系统架构；联合创始人李滔曾执掌美团外卖算法与数据体系，是少数真正跑通过“全链路数据算法驱动”的技术负责人；联合创始人李浩哲则是连续创业者，具备多年全球化商业落地经验。</p>\n  <p>过去几年，餐饮数字化已经被SaaS、点餐小程序、配送调度系统改造了一轮又一轮，但当全球外卖订单持续攀升，一个长期被忽视的问题开始变得越来越突出：从商家出餐到骑手取餐之间，仍然存在大量高度依赖人工的物理操作环节。</p>\n  <p>比如打包、封签、分拣、接驳、配送。</p>\n  <p>这些流程看似琐碎，却直接影响整个履约效率。错单、漏单、撒漏带来的损耗，会同时传导至用户、商家、骑手与平台四端。与此同时，全球餐饮行业还普遍面临结构性用工问题：北美快餐行业时薪持续上涨，国内餐饮门店则长期存在招工难、流动率高的问题。</p>\n  <p>离开美团之后，王栋曾在北美与新加坡进行了持续数月的市场考察，深入走访大量餐饮商家与外卖平台。他最终形成了一个明确判断：餐饮后厨，可能是具身智能最具确定性的商业落地方向之一。</p>\n  <p>原因在于，这个场景同时具备几个关键特征。</p>\n  <p>首先，它是全球共通需求。无论中国、北美还是东南亚，餐饮行业都面临人力成本上升与履约效率问题。</p>\n  <p>其次，它的ROI足够清晰。只要能够降低错单率、减少人工、提升出餐效率，商家就愿意为此付费。</p>\n  <p>更重要的是，相比家庭、养老等强调情感交互的场景，餐饮属于专业服务领域，决策链条更短，中小商家合作意愿更强。</p>\n  <p>在接受36氪采访时，王栋表示，服务业本身占据全球GDP的巨大比例。如果能够在餐饮后厨这个高频场景中建立起真正可运行的具身方案，实现从模型到应用的系统性落地闭环，本身就价值巨大，并且也具备未来再向家庭厨房等更复杂的场景延伸的可能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_24d121a07ea1430391f2b75c4cd8da30@5920579_oswg3235683oswg2560oswg1440_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>相比不少公司优先做“通用具身世界模型”，元节智能更倾向于从真实场景中持续学习以逐步建立模型能力。</p>\n  <p>王栋表示，“移动能力（Locomotion）经过七八年发展，其实已经基本解决了。现在行业真正的焦点，开始转向精细操作。虽然灵巧手距离真正成熟还有距离，但二指、三指夹爪已经出现大量成熟的工程化方案，可以支撑部分标准化任务落地。”</p>\n  <p><strong>在这样的判断下，元节智能没有把重点放在重新发明机器人硬件，而是要做一套面向餐饮场景的“世界动作模型（World Action Model，WAM）”。</strong></p>\n  <p>在王栋看来，VLA（Vision-Language-Action）路线过度依赖语言模块进行高层规划，但对视觉表征不足，而真实世界里的动作控制，本质上并不依赖语言。“人类真正的动作控制路径，其实没有那么强依赖language。更核心的问题，是视觉理解、物理理解，以及动作如何与真实世界建立映射。”</p>\n  <p><strong>基于这一判断，元节智能在模型层面更强调探索融合视觉（Vision）与触觉（Touch）的“VT-WAM”（视觉-触觉世界动作模型）。</strong>王栋解释道：“视觉看得见物体，却看不见接触；触觉看不见全局，却看得见成败。视觉ground的是世界的几何侧面，触觉ground的是世界的物理侧面。VT-WAM再把这两类信息通过隐空间综合进一个能预判接触后果的‘世界-动作模型’。”</p>\n  <p>世界模型不仅需要视觉感知能力，更重要的是理解真实物理世界中的规律与因果关系。他举例说，一个饮料杯是否装水、装得满不满、温度是冷是热，都会影响机器人抓取时的摩擦力、重心变化与操作稳定性。</p>\n  <p>元节智能希望通过视觉、触觉等多传感器协同感知物体状态，并在模型中嵌入对液体晃动、重心变化等物理属性的因果理解，让机器人的动作不只是基于数据拟合，而是真正符合现实世界的物理规律，从而提升抓取与操作的稳定性和精细度。</p>\n  <p>从技术架构来看，元节的系统大致分为三层：最上层是具身世界模型，用于形成对后厨环境的认知，并完成决策与动作规划；中层是任务编排与调度引擎，将认知结果转化为具体执行计划，并统一调度不同设备；底层则是自研核心部件与通用硬件本体的融合，确保系统能够在真实后厨长期稳定运行。</p>\n  <p>这套架构背后的核心逻辑是：不是先造一个通用机器人，再去寻找应用场景，而是在一个足够高频、足够痛的场景里持续收集真实交互数据，反过来喂养世界模型，让模型在物理世界中越来越“聪明”。</p>\n  <p>餐饮后厨每天都在重复大量高频操作——打包、分拣、搬运、烹饪、接驳——这些动作天然能够形成海量、多样化的真实世界数据，而这类数据很难单纯依靠仿真环境生成。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_e7f06f1a8782456ca22b457311ad3d08@5920579_oswg3348966oswg2560oswg1440_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>具体落地路径上，元节智能目前选择从“外卖打包与接驳”切入。这是整个履约链路中出错率最高、标准化程度相对较高、同时又最容易量化价值的环节。</p>\n  <p>“打包环节的任务范围清晰，场景可控，我们的路径是以商业价值为依据，先聚焦提升抓取精准度，做到可用可靠。”王栋表示，“站在商业视角，商家并不在意你的机器人像不像���，会不会跳舞，商家更在乎你到底能帮我干什么活。”</p>\n  <p>目前，元节的方案是将高频、标准化动作交给端侧轻量化小模型执行，例如套餐装盒、封签等动作，以降低延迟与网络依赖；而云端大模型则主要用于处理异常情况，例如物料缺失、异物干扰等复杂场景，并通过KDS系统联动后厨人工补位。</p>\n  <p>打包环节模型预计会在2026年内进入真实商家后厨进行规模化部署。</p>\n  <p>在团队的设想中，未来模型能力会从打包这一单点环节切入，继续向更复杂的后厨操作延伸，包括分拣、配送接驳、烹饪协同，甚至逐步进入更广泛的服务业场景。</p>", "category": "tech", "published_at": "2026-06-02T01:57:17+00:00", "fetched_at": "2026-06-02T03:33:37.337846+00:00", "fingerprint": "afef3e38d5f67d5d"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜原小天才团队做老年硬件，切入居家看护赛道，即将进入海外市场", "url": "https://36kr.com/p/3835387558065541?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，近日，居家养老消费电子品牌「元生智能」完成新一轮超千万元Pre-A轮融资。本轮融资由银创资本领投，东科创跟投。本轮资金将主要用于渠道拓展以及相关新产品的持续迭代。</p>\n  <p>元生智能是硬氪长期关注的企业，成立于2022年，主要为65岁以上空巢、独居老人提供居家看护产品。公司创始人、CEO邓龙生曾任小天才学习平板产品负责人、星火教育合伙人；联合创始人房少杰同样来自小天才，曾任小天才电话手表及火火兔产品负责人。</p>\n  <p>元生智能旗下老年看护品牌「亲鹿」于2025年初推出亲鹿Z9老人看护机，并开启全渠道销售，目前已进入快速增长阶段。</p>\n  <p>今年，公司进一步升级防跌倒模型，并推出新品D系列看护机以及焕新版的Z9E。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_acc89136cca34ff0b9166a4228353aa5@5920579_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>新一代模型采用毫米波雷达与视觉融合的大模型方案进行跌倒检测，采用混合大模型融合技术，实现了更快速、更精准的识别响应。当前，产品跌倒检测精度已达到行业领先水平，误报率与漏报率均维持在极低水平。</p>\n  <p>除跌倒识别与家属联络功能外，产品还可基于毫米波雷达技术，对老人的心率与呼吸状态进行实时监测。当老人心率过低或过高时，系统将自动触发预警并通知家属。</p>\n  <p>D系列取消了屏幕设计，价格更加亲民。而且D1 Plus根据隐私保护的需求强弱，提供两种终端型号，分为“真实画面”与“隐私线稿保护画面”两类产品选择，在保证看护有效性的同时，也尽可能尊重老人的隐私与生活自由。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260602/v2_e12cb0ee0554475f9319c92f5b7e094a@5920579_oswg817408oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>针对老年用户的使用习惯，元生智能也进行了大量适老化设计。例如，考虑到大部分老人家庭普遍存在多房间，部分设备会离路由器远的情况，设备支持自动中继联网，实现全屋的互联覆盖。</p>\n  <p>此外，产品的喇叭与声音效果也针对老年人的听力曲线进行了定制化优化，更强调低频输出，以提升语音清晰度与可辨识度。</p>\n  <p>在海外市场方面，元生智能正在通过B2B模式进入加拿大、马来西亚、澳大利亚等市场，并计划于2026年下半年开启海外亚马逊DTC渠道。</p>\n  <p><strong>以下为硬氪与元生智能创始人邓龙生访谈节选：</strong></p>\n  <p><strong>硬氪：做面向老年人的硬件产品的难点是什么？</strong></p>\n  <p><strong>邓龙生：</strong>儿童产品通常是家长买给孩子使用，但老年产品更多是子女买给父母使用。老人作为独立成年人，有自己的需求、情绪和生活习惯，如何在子女与老人之间取得平衡，其实对产品设计提出了很高要求。</p>\n  <p>我们非常重视一线用户反馈，我自己也会经常给用户打电话回访，了解退货原因和真实体验。只有真正接触用户，才能避免团队陷入自我感动。</p>\n  <p>有一个很典型的细节：曾有老人反馈，自己在摄像头下和人聊天时，会担心设备连接的其他家人在“偷听”。后续我们专门增加了语音传输提示功能——只要开启语音传输，设备就会主动播报提示音，避免“静默监听”，也尽量减少由此引发的家庭矛盾。</p>\n  <p>相比儿童产品，成年人的需求其实复杂得多。除了功能需求，还涉及情绪需求、人与人之间的关系需求，以及尊严感、隐私感等更微妙的问题。这些细节都需要团队反复推敲。</p>\n  <p><strong>硬氪：为什么您觉得现在做老年硬件的时机成熟了？</strong></p>\n  <p><strong>邓龙生：</strong>我们是在2022年开始创业的，当时整个养老行业其实刚刚进入成型阶段。参考日本经验，当一个国家60岁以上人口占比超过18%、65岁以上人口占比超过14%时，养老产业会进入加速发展阶段，而中国直到2022年底才达到这一节点。</p>\n  <p>之所以说现在是关键时间点，是因为今年长护险（长期护理保险）将在国内进一步全面铺开。类似制度在日本叫“介护险”，美国则有商业护理险。随着这类政策推进，整个养老市场会从早期市场逐渐演进到中后期市场，行业也会进入高速增长阶段。</p>\n  <p>这恰恰给了我们机会。当前赛道的特点是“有品类、缺品牌”，而我们希望借此机会，把“亲鹿”真正做成行业品牌。这一轮融资，一方面会用于渠道拓展，另一方面也会投入到长护险相关产品的持续迭代中。</p>\n  <p><strong>硬氪：公司未来还有哪些规划？</strong></p>\n  <p><strong>邓龙生：</strong>我们的目标是做“老年版的小天才”——一家真正能够引领行业的养老科技公司。对我们来说，做硬件产品只是起点，更重要的是持续围绕老年人的真实需求，构建完整的养老科技体系。</p>\n  <p>未来，我们会继续深耕居家看护赛道，同时逐步拓展更多新的产品线。</p>\n  <p>今年下半年我们还将推出紧急救助相关服务，包括7×24小时在线救助体系，进一步完善老年居家看护场景，提升突发情况下的响应能力与安全保障。</p>", "category": "tech", "published_at": "2026-06-02T02:00:58+00:00", "fetched_at": "2026-06-02T03:33:37.337830+00:00", "fingerprint": "76bf24e0a6f3028c"}, {"source": "少数派", "title": "把一句经文放进每天：「一日一偈」的轻阅读尝试", "url": "https://sspai.com/post/110094", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/110094\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-01T03:01:26+00:00", "fetched_at": "2026-06-0  [&#8230;]", "category": "tech", "published_at": "2026-05-31T23:00:00+00:00", "fetched_at": "2026-06-01T03:36:36.155449+00:00", "fingerprint": "c99ee60afef52d4a"}, {"source": "The Verge", "title": "The QD-OLED gaming monitor that started it all got a big upgrade", "url": "https://www.theverge.com/games/938956/alienware-computex-tandem-qd-oled-penta-rgb-stripe-gaming-monitors-specs", "summary": "Alienware is taking to this year's Computex 2026 in Taipei to announce some cool gaming monitors, most notably two exciting OLED options that are coming at different points this year. First off, the company is debuting the successor to its very first QD-OLED gaming monitor from 2022 with a refreshed design and high-end specs that's [&#8230;]", "category": "tech", "published_at": "2026-05-31T23:00:00+00:00", "fetched_at": "2026-06-01T03:36:36.155443+00:00", "fingerprint": "f0f24812f89a03f4"}, {"source": "The Verge", "title": "AMD’s new pitch: our old tech is so good you should just keep using it", "url": "https://www.theverge.com/tech/940524/amd-computex-am5-promise-2029-rx9070gre-7700x3d-5800x3d", "summary": "Computex 2026 is underway in Taiwan, and we're expecting all manner of flashy computers with jaw-dropping prices (or no prices at all) as the entire industry navigates RAMageddon. But for desktop PC gamers, AMD has a different pitch. It's relaunching three old components alongside a big new promise: you won't need to buy a new [&#8230;]", "category": "tech", "published_at": "2026-06-01T00:00:00+00:00", "fetched_at": "2026-06-01T03:36:36.155433+00:00", "fingerprint": "cec216e39af8cf19"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨停服三年后，天涯社区正式恢复访问；广东辟谣高考将用AI改卷；MiniMax拟科创板上市", "url": "https://36kr.com/p/3833859545343618?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>OpenAI称使用AI攻克“80岁”数学难题</li>\n   <li>亚马逊：关停词元跟踪榜单</li>\n   <li>马斯克辟谣SpaceX估值下调</li>\n   <li>三花智控高管“为孩子教育”减持套现超4.3亿</li>\n   <li>哈根达斯中国被曝将被柠季收购</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>天涯社区正式恢复访问</strong></p>\n  <p>6月1日起，天涯社区正式恢复访问。据“天涯社区”官方微博发布的《关于天涯社区恢复访问进展的情况说明》，自2023年4月1日起，天涯社区因电信IDC欠费而暂停访问。为了确保涉及上亿用户的天涯数据完整存续以及天涯社区的恢复访问，三年来，天涯社区重启团队持续不懈地展开自救。今年2月份，在新天涯联合工作组的支持下，确立了推进2026年6月1日前恢复天涯社区访问的方案。此外，天涯社区数据迁移仍在等待相关审批流程，根据当前的进程，天涯社区整体数据恢复将在6月份内完成。另外，由于种种原因，tianya.cn域名暂时无法使用。6月1日零时起，www.tianya.net正式开放访问，将首先实现部分天涯社区精华帖子的浏览功能。</p>\n  <p>据了解，天涯社区是中国互联网早期最著名的论坛之一，创办于1999年，最初是炒股爱好者邢明用来交流和学习的股票论坛，后聚集了许多高质量网友与内容，《鬼吹灯》《明朝那些事儿》等小说在天涯社区连载，第一代网红“芙蓉姐姐”也诞生于此。（IT之家）</p>\n  <p><strong>广东辟谣高考将用AI批卷</strong></p>\n  <p>近日，一则“广东夏季高考用AI批卷”的信息在网络空间流传。对此，广东省教育考试院表示，“用AI批卷”为不实传言。事实上，为保障考试公平，自2024年起，广东在全省考场启用实时智能巡查系统，利用人工智能技术分析考试异常行为。而发帖网友将“AI辅助巡考”误解为“AI批卷”，纯属概念误解。广东从未宣称或部署由AI参与评卷的工作。在监考环节，AI巡考主要起到观察、预警、辅助作用，而在评卷环节，广东走的是一条严谨、严格的人工路径。正式评卷中，各科目主观题全部实行双人独立评阅，评分差超过阈值则增加三评环节。此外，进行实时监控，由系统随机抽检评卷结果，及时发现和纠正错评漏评等问题。（南方日报）</p>\n  <p><strong>MiniMax拟科创板上市</strong></p>\n  <p>5月31日晚间，MiniMax Group Inc.（简称“MiniMax”）公告，董事会宣布已决议探究拟发行人民币股份的初步建议，可能涉及与专业顾问订立协议及与相关证券或其他监管机构进行咨询及磋商。公司已聘请专业顾问就符合在科创板上市条件提供咨询，并签订辅导协议。拟发行人民币股份事宜将取决于市场状况及必要的监管批准。于本公司在香港联交所成功上市后，本公司持续评估资本市场，包括对在科创板上市进行评估。据证监会网站消息，MiniMax已于2026年5月29日同中信证券签署辅导协议，正式启动A股IPO进程。</p>\n  <p>公开资料显示，MiniMax今年1月登陆港交所。从成立到敲钟仅用时四年多，创下全球AI公司从创立至IPO的最快纪录。（每日经济新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>柠季回应收购哈根达斯中国传闻&nbsp;</strong></p>\n  <p>5月28日，有市场消息称，国内柠檬茶连锁品牌柠季正就拿下哈根达斯在华门店业务一事进行洽谈。接近柠季的人士对《每日经济新闻》记者回应称，现在还不方便透露，等对方公布。根据哈根达斯官方小程序，截至2026年5月29日，其在中国内地拥有门店171家。对比2025年6月，其门店数已经减少了92家。此前，2021年9月，哈根达斯高管曾对外透露，全世界有六七百家哈根达斯门店，中国就占了400家。（每日经济新闻）</p>\n  <p><strong>3C认证实施规则迎来新调整，移动电源新增多项安全测试</strong></p>\n  <p>市场监管总局近日发布《关于增加移动电源等强制性产品认证依据标准并发布新版实施规则的公告》，调整完善CCC认证实施要求。《公告》重点明确了三个方面的内容：一是增加强制性国家标准GB47372—2026《移动电源安全技术规范》作为CCC认证依据。二是修订发布新版CCC认证实施规则，对企业实施分类监管，加大证后监督力度，压紧压实认证活动各相关方主体责任。三是结合强制性国家标准实施日期，明确2027年3月31日前为过渡期，2027年4月1日起，必须全面执行新版规则。其中，对于已获证的移动电源及其内部使用的锂离子电池和电池组，应当在2027年4月1日前完成证书转换。（IT之家）</p>\n  <p><strong>马斯克辟谣SpaceX估值下调</strong></p>\n  <p>据报道，美国太空探索技术公司（SpaceX）正寻求在其首次公开募股（IPO）中获得不低于1.8万亿美元的估值，低于今年4月市场传出的超2万亿美元目标估值。报道称，此次变动是公司与投行顾问及部分投资者沟通后做出的审慎调整，路演阶段仍可能根据市场反馈进一步上调估值。不过，SpaceX首席执行官马斯克29日在社交平台X上发文辟谣，否认相关报道，仅简短回复“不实”（False）。（央视财经）</p>\n  <p><strong>尼康要用便宜光刻机打破ASML垄断</strong></p>\n  <p>在荷兰ASML几乎垄断全球光刻机市场的背景下，日本光刻巨头尼康正准备发起反击。日本尼康新任总裁兼CEO大村泰弘（Yasuhiro Omura）近日接受《日经亚洲》专访时透露，公司将通过大幅降低ArF（氟化氩）沉浸式光刻机的售价，挑战荷兰ASML在全球光刻设备市场的垄断地位。依托核心零部件自主生产的成本优势，尼康目前正与美国和亚洲多家大型芯片厂商展开洽谈，部分合作已接近签署采购订单阶段。（快科技）</p>\n  <p><strong>周六福就“售卖不合格足银手镯”致歉</strong></p>\n  <p>36氪获悉，近日，周六福珠宝股份有限公司因生产销售抽检不合格的足银手镯，被深圳市市监局处以罚款739.75元并没收违法所得231.17元。5月29日，“周六福珠宝”发布情况说明称，涉事单品仅采用易受氧化等因素影响的GB/T18043-2013表面检测方法，未做破坏性检测，而该标准明确规定表面检测结果不能单独作为判定依据；周六福表示已将同批次产品送至国家珠宝玉石首饰检验集团有限公司按国标GB 11887-2012进行破坏性检测，结果合格。</p>\n  <p><strong>英国外交大臣库珀将访华并举行第十一次中英战略对话</strong></p>\n  <p>据外交部网站消息，5月31日，外交部发言人宣布：应中共中央政治局委员、外交部长王毅邀请，英国外交大臣库珀将于6月1日至3日访华并举行第十一次中英战略对话。（央视新闻）</p>\n  <p><strong>世界杯在即，伊朗所有成员仍未获发美国签证</strong></p>\n  <p>距离美加墨世界杯开幕还有不到两周时间，在参加世界杯的48支球队中，伊朗队的处境充满变数。截至5月30日，伊朗球队、教练及后勤团队的所有成员均未获发美国和墨西哥的签证。据央视新闻报道，2026年足球世界杯定于6月11日至7月19日在美国、加拿大和墨西哥举行，这是首次有48支球队参赛的世界杯，比赛场次也大幅增加至104场。（澎湃新闻）</p>\n  <p><strong>深圳网约车市场已饱和，官方发布风险提示</strong></p>\n  <p>近日，深圳市交通运输局发布，2026年4月份深圳市网约车行业运营动态与风险提示，当前市场总体已饱和，4月全市网约车日均单车完成订单量约为13.01单。 官方郑重提醒，拟从业者应充分调研，理性决策，并警惕六大风险：一是部分平台采用“上班/保底模式”代收流水，公司经营不善将导致司机受损； 二是未获授权的中间商易引发纠纷；三是警惕“月入过万”等虚假广告，避免退车违约；四是认清“无证不罚”骗局，无证营运将被处罚且保险拒赔； 五是防范“免押金”“高回报”等租车套路，签约需核对条款；六是警惕租车公司逾期缴纳保险导致失效的风险。（深圳新闻网）</p>\n  <p><strong>宝鼎科技：公司未与英伟达有过接触或业务合作，目前未有高速覆铜板M7和M9产品销售</strong></p>\n  <p>36氪获悉，宝鼎科技公告，公司澄清，近期网上关于公司产品纳入英伟达供应链体系认证的信息为不实信息，公司未与英伟达有过接触或业务合作。公司覆铜板产品为常规产品，无AI覆铜板，高速覆铜板M7和M9均无销售；铜箔产品主要为普通铜箔，超低轮廓HVLP铜箔尚处客户认证阶段，2026年第一季度营收约10万元，占比仅0.01%。2025年度公司覆铜板及铜箔业务亏损，净利润为-1,850.99万元。公司基本面未发生重大变化，提醒投资者注意风险。</p>\n  <p><strong>三花智控高管“为孩子教育”减持套现超4.3亿</strong></p>\n  <p>据报道，头顶A股“具身智能”光环的三花智控，近期因一份《投资者关系活动记录表》中高管们“为孩子教育费用和生活需求”的减持理由，被推至舆论风口浪尖。在股价经历2025年的飙涨后，多位核心管理层在股价高位减持，而今年一季度公司业绩增速下滑明显，这与市场对公司机器人业务的高期待形成鲜明对比。</p>\n  <p>在2026年5月26日的业绩说明会上，有投资者询问公司多位高管为何要减持股份。面对投资者对公司多位高管减持股份的疑问，公司回应称，董事长减持主要原因为个人资金需求，本次减持资金将继续用于产业投资。其余5位董事或高级管理人员减持股票主要来源于历年积累的股权激励，本次减持资金主要用于孩子教育费用和生活需求。（每日经济新闻报道）</p>\n  <p><strong>中际旭创紧急辟谣一篇“董事长演讲稿”：未参加相关论坛 内容系杜撰</strong></p>\n  <p>5月30日，中际旭创发布官方声明称，部分网络媒体、自媒体和社交媒体平台传播人为捏造的题为《中际旭创董事长2026光互联论坛（5.28 上海）演讲全文》的文章及相关内容。此文全文皆为杜撰的虚假内容，公司及董事长刘圣从未发表此文中提及的内容，此文与公司无关并完全不代表公司及董事长刘圣立场。敬请广大投资者理性投资，不信谣、不传谣、不造谣、切勿轻信各类不实传言，以公司公告为准，避免因虚假信息带来的影响。（21世纪经济报道）</p>\n  <p><strong>深圳发放800元养老消费券</strong></p>\n  <p>今年1月1日起，民政部、财政部在全国启动实施中度以上失能老年人养老服务消费补贴项目。随着补贴在各地陆续落地，养老服务消费券正“变现”为养老照护服务。杨志宇是街道办工作人员，近期，他的主要工作是上门协助老人领取和使用消费券。老人通过小程序完成注册，选择就近的评估点进行评估，只要符合中度及以上失能等级，就可以每月领取一张800元的消费券，并根据需求选择相应服务，消费券可分次使用。目前，深圳养老服务消费补贴政策覆盖的居家养老服务，可抵扣50%费用，每月最高800元。（央视财经）</p>\n  <p><strong>丰田回应将中止雷克萨斯下一代纯电轿车开发</strong></p>\n  <p>近日有消息称，丰田将中止高档车品牌“雷克萨斯”纯电动轿车“LF-ZC”的量产车型开发。丰田方面回应称，该信息属实，本次车型开发中止的原因是“考虑到市场需求的变化，对公司整体车辆开发项目进行调整的一部分”。丰田还强调，公司只是调整了部分车辆的开发规划，并不代表放弃BEV（纯电动汽车）。（第一财经）</p>\n  <p><strong>新包装矿泉水停止销售，胖东来：系设计方面重大失误，正重新设计</strong></p>\n  <p>5月29日晚，许昌市胖东来超市有限公司发文表示：胖东来新包装DL饮用天然矿泉水，在上市前发现与市面上现有同品类产品的瓶型外观有视觉近似的可能，我们立即暂停上市并主动与相关品牌生产商进行沟通，经双方沟通后于5月10日上市。此次出现的情况是我们在设计方面的重大失误。基于对知识产权原创的尊重和保护，也为了避免给对方品牌市场造成影响，经过胖东来集团公司商品委员会商议决定：第一批次生产的新包装DL饮用天然矿泉水于5月31日销售完毕后停止销售，原包装DL饮用天然矿泉水继续正常销售。我们也会加快新包装的重新设计，计划3个月完成设计，争取在9月份上市与大家见面。（界面新闻）</p>\n  <p><strong>Meta计划今年下半年售出1000万台可穿戴设备</strong></p>\n  <p>据报道，Meta计划通过推出新品、拓展销售市场等举措在今年下半年���出1000万台可穿戴设备，目标年底实现可穿戴设备月活跃用户达680万人。另外，Meta计划明年启动一款人工智能吊坠的测试工作。（界面新闻）</p>\n  <p><strong>风华高科：不涉及英伟达认证及暂停接单传闻不实</strong></p>\n  <p>36氪获悉，风华高公告，经核查，公司关注到近期有媒体提及公司“针对代理商0402、0603芯片电阻、MLCC全线暂停接单”，经核查，以上信息不属实，为做好部分数字系统升级及产品结构调整，公司执行部分产品暂缓接单，截至公告日，公司已恢复接单。公司关注到近期有媒体提及公司为“国内唯一通过英伟达全系列MLCC认证的企业”，经核查，以上信息不属实，截至公告日，英伟达未对公司开展任何产品认证。</p>\n  <h2>AI最前沿</h2>\n  <p><strong>亚马逊：关停词元跟踪榜单</strong></p>\n  <p>据报道，亚马逊在近期通知员工，旗下“Kirorank”榜单已停止服务。该榜单由内部开发者制作，可用于跟踪员工的Token消耗情况，其设立初衷是推动AI在业务场景的应用。然而事与愿违，部分员工为追求更高的排名和绩效，将AI智能体当作不计成本的“烧Token”工具，导致公司算力资源被浪费。为此，亚马逊高级副总裁戴夫·特雷德韦尔(Dave Treadwell)劝诫员工：“请不要为了用AI而用AI。”（财联社）</p>\n  <p><strong>字节2026资本开支预计达700亿美元，还打算自研CPU</strong></p>\n  <p>5月27日据知情人士透露，字节跳动正在讨论将2026年资本开支大幅提升至最高700亿美元，较2025年的约250亿美元增长近两倍，主要用于建设大规模数据中心及其他AI基础设施。上述数字尚属初步估算，可能随市场情况每季度调整。5月28日另有报道称，面对英特尔和AMD近几个季度每季度环比提价10%至35%、交货周期长达6个月的压力，字节跳动正在自研CPU以降低成本，同时推进Arm和RISC-V两条架构路线，项目仍处于早期阶段。据今年2月的报道，字节芯片研发团队规模已超千人，其中AI芯片方向逾500人，CPU方向约200人。（第一财经）</p>\n  <p><strong>OpenAI称使用AI攻克“80岁”数学难题</strong></p>\n  <p>OpenAI近日声称，其人工智能（AI）推理能力再次取得重大进展，成功攻克了一个困扰数学界80年的难题——匈牙利数学家保罗·埃尔德什（Paul Erdős）于1946年提出的“平面单位距离问题”。埃尔德什提出的问题是：如果你在一张纸上画出若干个点，那么有多少对点之间的距离可以恰好相同（具体来说是相距1个单位）？埃尔德什证明：如果把这些点按网格排列，可以得到相当多的单位距离点对。随后他猜想，没有任何其他排列方式能比网格好太多。几十年来，人们都试图证明这个猜想是正确的。然而，OpenAI的模型得出了不同的结论，指出有排列方式比埃尔德什预测的“上界”（不会超过的最大范围）更优。这意味着，它不是证明了猜想，而是推翻了猜想。OpenAI的研究团队指出，模型给出的解决方案极其反直觉，过去大多数数学家都默认埃尔德什的猜想是正确的，因此他们一直在寻找证明。而AI没有这种心理包袱，它会尝试大量看似荒谬的方向，最终正是在这些尝试中发现了突破口。（澎湃新闻）</p>\n  <p><strong>软银承诺斥资750亿欧元在法国建设人工智能设施</strong></p>\n  <p>软银承诺最高投入750亿欧元，在法国打造大型人工智能计算集群网络，该项目将成为欧洲规模最大的数据中心工程。这也是软银在美国以外完成的单笔最大规模人工智能投资。知情人士称，今年4月初法国总统马克龙与孙正义在东京共进晚餐后，双方迅速敲定了此项合作。软银首期将牵头投入450亿欧元，计划到2031年在上法兰西大区建成3.1吉瓦的算力规模，后续还规划新增2吉瓦算力。（新浪财经）</p>\n  <p><strong>全国首个绿色算力全栈AI平台上线</strong></p>\n  <p>5月30日，全国首个绿色算力全栈AI平台在内蒙古自贸试验区呼和浩特片区正式上线运行，填补了区域一站式算力模型词元综合服务交易的空白。此次上线的绿色算力全栈AI平台，集成算力调度交易、智能模型调用、词元交易结算等一站式核心功能。据了解，平台，全面兼容国产芯片与主流算力架构，首批接入三大通信运营商及头部科技厂商的十余款主流模型。根据用户需求，平台可整合全国接入节点的通算、智算、超算等多元算力资源，通过智能调度算法实现算力资源的弹性分配、高效调度、经济供给，为用户提供便捷易用、低碳绿色、质优价宜的词元（Token）交易服务。</p>\n  <h2>上市进行时</h2>\n  <p><strong>龙行天下IPO申请获受理</strong></p>\n  <p>上交所官网显示，5月29日，广东龙行天下科技股份有限公司（简称“龙行天下”）申报沪市主板IPO申请获受理，保荐机构为招商证券。资料显示，公司主营业务为运动鞋履的开发设计、生产与销售。2025年，公司实现营业收入58.34亿元，扣非后归母净利润为2.44亿元。（新浪财经）</p>\n  <h2>投融资</h2>\n  <p><strong>商业载人航天穿越者完成Pre-A轮亿元融资</strong></p>\n  <p>近日，北京穿越者载人航天科技有限公司完成Pre-A轮亿元融资。本轮由头部互联网战投领投，上市公司探路者集团等产业资本跟投，老股东中天汇富、彬复资本持续加码，光源资本担任本轮独家财务顾问。本轮融资资金将重点用于“穿越者壹号（CYZ1）”载人飞船核心系统研发、地面试验验证及关键技术攻关。（科创板日报）</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜迟雨&nbsp;</p>", "category": "tech", "published_at": "2026-06-01T00:05:59+00:00", "fetched_at": "2026-06-01T03:36:35.839437+00:00", "fingerprint": "5ccade8018784a2f"}, {"source": "36氪 - 最新文章", "title": "“世纪合并”落空，雅诗兰黛松了一口气", "url": "https://36kr.com/p/3825786926633607?f=rss", "summary": "<p>化妆品公司全球市值第四和第九的合并交易落空。</p>\n  <p>5月21日，美国高端美妆巨头雅诗兰黛与西班牙香水美容集团Puig联合宣布，双方已正式终止就潜在合并事宜展开的谈判，协议未能达成。雅诗兰黛盘后股价随即跳涨逾10%，至86.9美元；Puig股价则在马德里市场重挫逾14%。</p>\n  <p>交易告吹的导火索，外界说法不一。路透社援引两名知情人士称，Puig旗下英国彩妆品牌Charlotte Tilbury的同名创始人在谈判过程中提出了一系列涉及自身持股回购条款的诉求，在财务上大幅抬高了交易推进的复杂程度。据悉，Charlotte Tilbury目前仍持有品牌约21.5%的股份，Puig预计将在2026至2031年间通过一系列绑定品牌业绩的期权协议逐步完成全额收购——这一未解的悬念，直接搅乱了合并谈判的节奏。</p>\n  <p>但36氪独家消息来源指出，问题的症结远不止于此：<strong>两大集团创始家族内部在合并后公司控制权归属上的根本性分歧，才是谈判最终破裂的核心原因。</strong></p>\n  <p><strong>该知情人士表示，雅诗兰黛集团第三代创始人Jane Lauder发言权近年在家族内部极速提升，而她正是家族内部针对该交易的反对者。</strong>Jane lauder其父、创始人之子Ronald Lauder，也反对其兄长之子——William Lauder支持的合并立场。劳德家族虽然退出了公司的日常管理，但仍掌握着公司82%的投票权。</p>\n  <p>在Puig一侧，局面同样复杂。曾以一己之力推动Puig集团于2024年完成西班牙十年来最大规模IPO的前任CEO Marc Puig是此次交易的力推者。然而，集团副董事长兼最大个人股东、其堂兄弟Manuel Puig Rocha对此收购表示反对。BeautyMatter曾援引知情人士称，两人之间长期存在的嫌隙，是任何协议落地的最大障碍。</p>\n  <p>据36氪了解，两者之间具有交易意向的接触要追溯到2025年。一种观点认为，双方高管之间非常紧密的私交是该交易能进行的重要原因。</p>\n  <p>雅诗兰黛的第一位外聘CEO傅懿德（Fabrizio Freda），执掌雅诗兰黛15年后于去年卸任，目前仍以顾问身份留任。他与Marc Puig相识多年，两人是密友。这份渊源甚至可以追溯至更早一代：长期担任雅诗兰黛CEO并主导公司早期扩张的Leonard Lauder，与Puig集团的长期掌舵者Mariano Puig，在Mariano Puig于2021年辞世之前，两人维系着数十年的相互欣赏之情。</p>\n  <p>十年前，在巴塞罗那IESE商学院举办的一场关于家族企业的会议上，Mariano Puig还与傅懿德一同出席，探讨了家族控股企业的优势与矛盾。</p>\n  <p>“我个人认为，家族企业的核心在于以一种不同的方式参与竞争——更着眼于长远发展，致力于行业进步，并为所有利益相关者谋取福祉，”傅懿德向媒体表示，“这既不是关于外部管理，也不是关于家族：而是两者兼顾，正是它们的协同作用造就了这种魔力。”</p>\n  <p>除此之外，谈判可能进行下去的重要一点还有两者都有共同的敌人——欧莱雅。</p>\n  <p><strong>雅诗兰黛与欧莱雅的爱怨纠葛不必细说，Puig与欧莱雅的之间在地域市场和强势品类的冲撞也愈演愈烈。</strong>在2018年和2019年，欧莱雅相继夺得了瓦伦蒂诺（Valentino）和普拉达（Prada）的关键香水授权后，竞争进一步加剧，迫使Puig重新审视其商业模式——这家西班牙集团由此从授权经营转向构建自有品牌组合，收购了彩妆品牌Charlotte Tilbury和香水品Byredo，后者是在一场竞标中由Puig胜出，而欧莱雅最终落败。</p>\n  <p>合并终止的消息公布当晚，雅诗兰黛盘后股价收于86.9美元，涨幅达10.13%，最新市值284.55亿美元，过去12个月累计涨幅23.96%。RBC分析师Nik Modi直言：\"听到谈判终止的消息，我们松了一口气——整合风险本将对股价形成旷日持久的压制。\"雅诗兰黛CEO司泰峰（Stéphane de La Faverie）则在声明中表示，公司将\"全力聚焦于可持续销售增长与长期盈利能力改善”。</p>\n  <p>上市知情人士亦向我们确认了公司内部对交易终止的正向态度。</p>\n  <p><strong>市场对时尚行业\"弱者抱团\"的故事，素来保持审慎</strong>。2021年，美国轻奢双雄Tapestry与Capri传出合并消息，最终因监管阻碍搁浅；如今Tapestry凭借Coach完成漂亮翻身，Capri至今萎靡不振。这或许说明，即便面临相似的市场压力，时尚与美妆集团各自的品牌基因差异极大，任何合并整合的变数，都远比财务报表所呈现的更为深远。</p>\n  <p>以下是双方接触的主要时间线——</p>\n  <p>今年3月23日，《金融时报》与《华尔街日报》率先披露传闻，雅诗兰黛当日即发公告确认磋商属实。4月1日，彭博社披露交易将以股票置换为主体结构；投行Jefferies随后将方案细化为\"20%现金+80%股票\"混合要约，合并后Lauder家族持股26.7%，Puig家族21.7%，现有雅诗兰黛股东43.6%，Puig少数股东8%。</p>\n  <p>4月21日，谈判出现重大进展，路透社引述西班牙《Expansión》报道，JP摩根已为雅诗兰黛设计一套约50亿欧元的融资方案并积极征集贷款方——这是谈判进入实质阶段最清晰的信号。4月30日，路透社再度报道，雅诗兰黛正考虑以每股18至19欧元要约收购Puig B类股。一个月后，谈判宣告终止。</p>", "category": "tech", "published_at": "2026-06-01T01:50:58+00:00", "fetched_at": "2026-06-01T03:36:35.839430+00:00", "fingerprint": "b061ce37eec1f514"}, {"source": "36氪 - 最新文章", "title": "硬氪观察 | 苹果代工厂开造人形机器人，一场豪赌未来的产能大迁移", "url": "https://36kr.com/p/3833985105782402?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>在龙旗位于南昌的智能制造工厂中，两台智元精灵G2人形机器人已融入平板产线，承担起多媒体集成测试（MMIT）工站的上下料作业。</p>\n  <p>其工作节拍已接近熟练产线员工——依托腰部的三个运动自由度与全向移动底盘，机器人精准从传送带抓取生产完成的平板，送入检测机箱；待测试完毕，又能迅速取出合格产品、利落放回传送带分流。</p>\n  <p>据现场实测数据，单台机器人每小时可稳定处理约310台平板设备，峰值达316台，8小时连续作业整体成功率超99.5%</p>\n  <p>这并非一次单纯的展示。</p>\n  <p>2026年，中国的具身智能机器人热潮中，一大波市值百亿、千亿手机供应链巨头躬身入局，成为机器人行业里无法忽视的关键玩家。除了龙旗，动作激进的还有富士康、华勤、蓝思、立讯精密等等，它们的名字都出现在头部具身智能的投资人名单上。</p>\n  <p>机器人上产线只是个开端。它能最直接地帮助工厂降本增效。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_0905cd756c404a94a3abc396e4845f55@1199336245_oswg141117oswg1080oswg498_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;（图源/企业）</p>\n  <p>但显然，手机供应链巨头不可能只满足于当个买家。硬氪了解到，今年中国头部手机代工厂商（包括华勤、立讯、龙旗等）都在积极接触下游机器人公司。一家机器人公司CEO告诉硬氪，<strong>代工厂们不惜拿出“有诚意的报价”、搬出“有深度合作机器人客大客户”为话术来打单。</strong></p>\n  <p>它们受够了挣辛苦钱。过去十多年，在全球智能手机分工体系中，中国供应链公司，总在利润相对低的那一端徘徊。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_e2f0514427a24995a3ce93753b034642@1199336245_oswg354190oswg1080oswg630_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">中国手机代工巨头如何布局人形机器人 &nbsp;硬氪基于公开信息整理</p>\n  <p>他们呼唤这样一个行业，它将生于中国，定义于中国，制造于中国。当具身智能这个故事的轮廓一步步变得清晰，手机供应链错过它，将是不可原谅的战略级错误。</p>\n  <p>具身智能也等待手机供应链太久。为全球造了百亿部手机，中国手机供应链积累了厚重的消费电子技术和生产经验，只有它们能把机器人产业从过去的“手搓”带往真正的量产。</p>\n  <p>一场隐秘的供应链迁移，开始了。</p>\n  <h3><strong>机器人进厂造3C</strong></h3>\n  <p>中国手机供应链正站在一个微妙的转折点。过去三十年，凭借极致的成本控制与庞大的劳动力红利，中国手机供应链创造了高效且低价的奇迹。</p>\n  <p>然而，“世界工厂”的光鲜表象之下，一些隐忧浮现——人口红利和劳动力结构变化，倒逼人海战术著称的产业链玩家寻找新的解法。</p>\n  <p>人形机器人毫无疑问成为了供应链巨头们眼中解决结构性矛盾的必选项。</p>\n  <p>一名与手机供应链代工厂商合作的机器人工程师告诉硬氪，以3C的检测环节为例，在两班倒的情况下，工人日均工作时长十小时，且需要在多个机柜间来回穿梭送检。方寸的移动距离里，工人们的日步数高达三万步。</p>\n  <p>管理与风控的矛盾也逐渐暴露。由于工人们经手的零部件单价高昂，而基层工人薪资相对微薄，工厂不得不采取严苛的“军事化管理”模式。</p>\n  <p>硬氪曾参观不少手机代工工厂，发现封闭式管理是工人们的日常——工人进出产线前后需过严格接受安检，产线内还设有严密监控。在工作时，工人们也无法自如移动。</p>\n  <p>一位手机代工厂资深管理者向我们坦言：“<strong>我们必须假定人性本恶来做管理。</strong>”</p>\n  <p>高压工作环境也与新兴劳动力的择业观念背离。前述工程师称，中国手机供应链代工厂里的工人月离职率高达15%，产线几乎处于“三个月一换血”的恶性循环中。</p>\n  <p>而频繁的人员流动所产生的新人培训、良率波动、熟练工流失，都正在吞噬原本就微薄的代工利润。</p>\n  <p>过去十年，中国的手机供应链尽管已经意识到这一点，并已大规模引入机械臂提高自动化，但这种方案在疾速变化的消费电子行业里，未免捉襟见肘。</p>\n  <p>一名行业人士告诉硬氪，消费电子产品迭代极快，产线变动频繁，且存在明显的淡旺季波峰波谷。</p>\n  <p>而传统的专用机械臂非标程度高，一旦产品改型，意味着昂贵的夹具可能作废。而人形机器人的好处是操作更灵活，当工序变化时，只需要重新适配和模型微调，且人形更有利于主动适应原本本就为人设计的工厂环境。</p>\n  <p>“人形机器人进工厂，是替代掉原来的人，不是替代掉原来的自动化机械臂，二者将实现互补，让产线实现有更高程度的柔性生产”，前述行业人士表示。</p>\n  <h3><strong>面向未来的生存之战</strong></h3>\n  <p>不过，引入人形机器人，不仅仅是基于劳动力情况和行业特征所做出的权宜之计，更是供应链巨头们一场面向未来的生存之战。</p>\n  <p>对他们而言，老业务的前景暗淡。</p>\n  <p>尽管华勤、立讯等巨头近两年营收仍在增长，但营收并未转化成利润，各家的代工业务毛利率依旧徘徊在10%–13%，部分低附加值产品甚至低至5%-8%。对比来看，被称为国产机器人减速器“一哥��的绿的谐波，2025年销售毛利率为37%。</p>\n  <p>手机代工的本质是一场规模游戏，而在全球智能手机出货量承压、叠加上游存储涨价的情况下，过去薄利多销、用价换量的思路已举步维艰。人形机器人这一新的生产力，被视为下一个增长机会点。</p>\n  <p>“我们舍得投入，愿意投入，坚信机器人一定是工业的下一个机会。这不是量变是质变”，一家手机代工厂机器人事务部总经理告诉硬氪。</p>\n  <p>人形机器人成了手机代工巨头拯救利润的稻草。同时，中国机器人产业的规模化落地也极度渴求成熟的手机供应链介入——过去几年，由于核心产业链未真正成熟，中国人形机器人行业长期处于“手搓”状态。</p>\n  <p>一名人形机器人厂商高管告诉硬氪，近两年来，人形机器人的研发与生产过程相当“痛苦”。</p>\n  <p>比如，由于供应链标准缺失、工艺不成熟，一些人形机器人运行一段时间后经常出现关节异响，或是脚底材质仅几十小时就磨损报废。这意味着，机器人后续的设计都需要修改，而产线上已制造出的机器人也需要全部召回返工。</p>\n  <p>对于人形机器人厂商来说，不仅要免费维修，还要支付高昂的零部件与人工维护成本，而这种“手搓”的作坊式生产也严重拖累商业化节奏。</p>\n  <p>但今年以来，这一局面正在被打破。顶级的代工厂都在放下身段，接下过去根本不屑一顾的人形机器人订单。</p>\n  <p><strong>“华勤、立讯这类公司向来对成本和数量极其敏感，如果他们愿意主动接单，说明他们认为机器人这个品类真的能上量，这是非常积极的信号”，前述CEO表示。</strong></p>\n  <p>Interact Analysis数据显示，2025年全球人形机器人产量总计超过2万台，是2024年的约10倍。其中，宇树科技和智元机器人各自产量超过5000台大关，占全球产量50%以上，另外，至少还有10家中国人形机器人公司处于数百到上千台跨越的关键节点，包括优必选、乐聚机器人、加速进化、银河通用等等。</p>\n  <p>一名行业人士向硬氪分析，1000台是2026年人形机器人厂商的“坎”，是行业从<strong>炫技迈向工业化量产</strong>关键分水岭。而中国手机供应链的介入，毫无疑问为行业送来了关键的工程化能力。</p>\n  <p>从供应链的角度，人形机器人与手机其实高度同源——</p>\n  <p>手机上的摄像头模组和麦克风阵列，可复用作机器人的感知“五官”；手机上的微型电机和线性马达，则可支持机器人的精细操作；</p>\n  <p>手机上的高密度电池、液冷，则可转化为机器人高密度的供电和散热方案；另外，手机上积累钛合金、碳纤维、以及折叠屏手机的精密铰链，则可能成为机器人的骨骼与外壳。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_882c9ff8660647b0bf5d5bad3bbdf10d@1199336245_oswg335697oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">机器人供应链与手机、汽车供应链的异同 &nbsp;硬氪基于公开信息整理</p>\n  <p>一个有力的证明便是，不久前，跨界进入机器人仅一年的荣耀，便依靠复用、整合手机技术，力克宇树和上届冠军北京人形，包圆亦庄马拉松第六名。</p>\n  <p>当人形机器人正从研发演示走向千台的量产拐点，市场紧缺的正是大规模、低成本、高品质交付的工程底座。而这正是中国手机代工巨头们最擅长的本领。</p>\n  <p>目前人形机器人还远未到爆发的时刻，但能够确定的是，代工厂们将写出和上个时代全然不同的情节。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜范馨雅</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260601/v2_33acbf5934fc46ce9bab49dd75318386@1199336245_oswg53536oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">end</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-06-01T02:12:48+00:00", "fetched_at": "2026-06-01T03:36:35.839422+00:00", "fingerprint": "bfed8a1a13a79cf8"}, {"source": "36氪 - 最新文章", "title": "获国家队采购、联名比音勒芬，「PLAYTOP」想用东方美学演绎户外功能服饰｜早期项目", "url": "https://36kr.com/p/3824416083825027?f=rss", "summary": "<p>当户外运动品牌纷纷在“防晒”“速干”“保暖”等参数上展开竞赛时，一家成立仅三年的新锐品牌，开始在功能的基础上，将“东方美学”元素融入一件功能衣中。</p>\n  <p><strong>成立于2022年的「PLAYTOP」，是一家将东方美学与天然功能材料融合的户外品牌，瞄准25-40岁追求颜值与舒适体验的高智菁英人群。2025年雪季，PLAYTOP做到了小红书滑雪速干衣用户主动搜索排名第一。</strong></p>\n  <p>目前，PLAYTOP已获得12项独家专利及多国环保创意新材料奖，产品被国家队和军事科学院采购，也是首个连续登上中国国际时装周的户外针织品牌。</p>\n  <p>PLAYTOP的诞生，源于一个“奢品+供应链”的组合。创始人梁辰是服装设计出身，曾任职香奈儿和巴宝莉，也有过8年的服装设计创业经历。她的合伙人则拥有为国家队和军事科学院做供应链的背景。2022年，两人瞄准冰雪和户外赛道的机遇，共同创立PLAYTOP。</p>\n  <p><strong>2025年，PLAYTOP完成3000万元销售额，2026年预计翻倍至6000万元。</strong>梁辰告诉36氪，它的定位很清晰：用东方美学演绎户外功能，让贴身层、中间层、外层等功能衣不仅“能打”，还要“好看”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_e26f3947b12a493cb4e948777bf3a8b6@5748245_oswg804185oswg726oswg610_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\" label=\"图片描述\">官方产品图</p>\n  <h3>让功能成为视觉符号</h3>\n  <p>在户外服饰领域，贴身层长期被视为功能型产品，玩家的比拼多集中在面料导湿率、升温速度等技术指标。PLAYTOP的切入点则是，在功能基础上，叠加东方结构美学。</p>\n  <p>最典型的案例是其注册专利的“龙脊”设计。PLAYTOP在每件衣服的后背中线，通过立体编织形成一个隆起的功能区。这个设计的灵感来自中国甲胄文化——就像护背甲片守护战士的脊柱，这个功能区既能贴合脊柱曲线、辅助核心发力，又能通过中空纤维结构隔离空气、调节温湿，防止运动后寒冷。梁辰希望它像香奈儿的经典元素一样，成为品牌延续百年的视觉符号。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_3a064022531d419f8728422b37e7b0b9@5748245_oswg213630oswg754oswg412_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\" label=\"图片描述\">&nbsp;官方产品图</p>\n  <p>类似思路在PLAYTOP的其他产品线中也有体现：从甲胄中提取的护臂结构（臂鞲），被融入上肢防护设计，寓意“抵御外部侵略”；将如意云肩的线条，转化为宽檐防晒帽的形态，兼顾棕榈草编的防水透气与东方美感；传统建筑中的透雕镂空，演变为透气与压缩并重的织造纹理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_817ecb706f544c7ab0ffb1d598e5f18e@5748245_oswg304901oswg830oswg400_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\" label=\"图片描述\">官方产品图</p>\n  <p>“东方美学并不是龙飞凤舞，而是把中国的美好纹样，用极简和国际化的方式呈现。”梁辰说。</p>\n  <p>在材料端，PLAYTOP的产品均是通过纱线配方实现功能，而非依赖后整理助剂。譬如，火山泥经高温碳化研磨后与涤纶共混，实现远红外蓄热与抑菌消臭；16.5微米美丽诺羊毛兼具保温透气与紫外线防护等。</p>\n  <h3>从滑雪到网球、高尔夫、徒步，爆款即心智</h3>\n  <p>成立前三年，PLAYTOP的重心在于打磨产品，并未大规模扩张。梁辰的策略是，先跑通模式，让每个渠道保持正向利润。</p>\n  <p><strong>目前，PLAYTOP的爆款产品“巅峰木兰”速干套装在小红书滑雪功能层类目排名第一，天猫同类目排名第五。</strong></p>\n  <p><strong>品类分布上，滑雪产品占据PLAYTOP总营收的80%。</strong>在此基础上，它进一步向徒步、网球、高尔夫延伸。“我们发现跟冰雪用户交集最大的是网球、高尔夫，但这几项运动都相对垂直，徒步则是一个大众场景，我们可以用好的单品打开它。”梁辰对36氪解释品类延展逻辑。</p>\n  <p>其中，在高尔夫品类，得益于梁辰多年的设计服务背景，PLAYTOP与比音勒芬等品牌达成联名合作，前者负责研发生产，在后者的线下门店销售。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_532454a2dbc64c42b16b8fb23190ae3a@5748245_oswg588967oswg830oswg562_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">PLAYTOP与比音勒芬的高尔夫系列联名产品</p>\n  <p><strong>新品开发逻辑上，PLAYTOP构建了“颜值功能双六矩阵”，将美学矩阵和功能矩阵做成两个齿轮，“每个产品在开发时，可以沿着齿轮做各种结合，灵感是源源不断的。”</strong></p>\n  <p>从产品细节看，木兰套装便体现了它的“颜值+功能”双轮逻辑：侧腰升级支撑带，秩序感螺纹编织使承托力提升150%，构建腰臀差；肌贴组织模拟肌腱交错结构，减少肌肉震颤能耗；小腿绑带采用立体环绕织，稳固肌肉、缓震解压；腰部前低后高立体版型，让后腰部位更保暖。</p>\n  <p>梁辰透露，PLAYTOP每年打造约10个爆款，单款销量过万件。2026年，在贴身层做出爆款的基础上，针织中层及户外配件将成为PLAYTOP的发力新重心。</p>\n  <h3>没有贵到“买不起”，也不想卷成“白牌”</h3>\n  <p>价格策略上，PLAYTOP选择了一条中间路线。</p>\n  <p>“贴身层加中间层这两个类目，还没有跑出绝对的头部品牌。”梁辰说。<strong>价格带方面，PLAYTOP定位200-300元的贴身层、500元左右的中层、800元左右的外层，接近蕉内的价格倍率。“我们不做白牌那种卷法，但也没有贵到买不起。”</strong></p>\n  <p>渠道侧，天猫作为品牌门面，小红书承担精准种草（偏一线城市、注重日常美感的女性用户），抖音和视频号则是增速最快的新渠道。线下除雪具店外，品牌还进入户外综合店，与Icebreaker、凯乐石等同场陈列。</p>\n  <p>从冰雪场景延展至徒步综训，从火山泥到美丽诺羊毛，从“龙脊”支撑到“小蛮腰”塑形，PLAYTOP想用东方美学的语言，重新定义户外贴身层——让每一件衣服的脊柱线上，都有一条看得见的“风骨”。</p>", "category": "tech", "published_at": "2026-06-01T03:19:10+00:00", "fetched_at": "2026-06-01T03:36:35.839407+00:00", "fingerprint": "545be77d1a7c919c"}, {"source": "少数派", "title": "本月玩什么｜混音青春、007 初露锋芒、归零巡礼、地平线 6", "url": "https://sspai.com/post/110488", "summary": "给你的快乐查漏补缺。<a href=\"https://sspai.com/post/110488\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-31T06:36:11+00:00", "fetched_at": "2026-06-01T03:36:34.089260+00:00", "fingerprint": "ff310de45347bfa6"}, {"source": "少数派", "title": "派早报：Anthropic 估值超过 OpenAI", "url": "https://sspai.com/post/110519", "summary": "<p>Anthropic 估值超过 OpenAI</p><p>海盗湾被查封二十周年，至今仍维持运营</p><p>高通推出骁龙 C 系列，用于对标 MacBook Neo 的笔记本 PC</p><p>Last.fm 重归独立运营</p><p>vivo 发布 vivo S60 系列</p><p>北京互联网法院称有未成年人游戏充值单案超 60 万元</p><p>比尔·盖茨公众形象面临空前危机</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/110519\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-31T23:26:34+00:00", "fetched_at": "202 s://36kr.com/p/3831348302358408?f=rss", "summary": "<p>5月29日，欧莱雅中国在复旦大学启动2026年度“有意思青年”高校公益计划，并首次以校园运动会形式开启新一年的项目活动。活动现场，乒乓球运动员马龙、篮球运动员杨力维、足球运动员赵丽娜等体育界人士与高校学生展开互动，欧莱雅同时宣布向中国青少年发展基金会捐赠总价值约468万元的产品，并启动新一年度校园义卖活动。</p>\n  <p>从表面来看，这是一场校园公益活动；但放在全球美妆行业的发展背景下，它更像是美妆品牌持续拥抱运动文化和健康生活方式的一次缩影。</p>\n  <p>过去很长一段时间，美妆与运动被视为两个相对独立的消费领域。前者围绕审美表达展开，后者则强调竞技和功能价值。<strong>然而近年来，随着健康消费崛起、女性运动参与率提升以及生活方式经济快速发展，两者之间的边界正在被重新定义。</strong></p>\n  <p>国际市场已经率先显现出这一变化。</p>\n  <p>根据尼尔森IQ（NIQ）发布的《State of Beauty 2025》报告，全球美妆市场过去一年实现约10%的增长，其中“Beauty+Wellness（美容与健康融合）”被认为是推动行业扩容的重要力量。报告指出，消费者越来越倾向于将护肤、美容、营养、运动和健康管理视为一个整体体系，相关消费机会较传统美容市场扩大超过60%。</p>\n  <p>与此同时，运动经济本身也在快速增长。市场研究机构Grand View Research数据显示，全球运动服饰市场规模已达到约4400亿美元，预计2033年将超过9000亿美元。跑步、骑行、瑜伽、力量训练等运动项目正逐渐成为年轻消费者日常生活的重要组成部分，而不再只是专业竞技活动。</p>\n  <p>消费行为的变化，正在反向影响美妆行业。过去几年，围绕运动场景的产品需求明显增长。从高倍防晒、运动后修护，到头皮护理、身体护理，再到防汗型彩妆，“运动中的皮肤管理”正成为新的产品开发方向。国际市场甚至开始出现“Active Beauty（活力美容）”概念，用以描述专门服务运动生活方式人群的美妆产品与服务体系。</p>\n  <p>这种趋势也体现在品牌营销层面。</p>\n  <p>2024年巴黎奥运会期间，欧莱雅集团成为奥运会官方合作伙伴之一，将品牌叙事与运动员故事深度结合；美国彩妆品牌e.l.f. Beauty近年来持续投资女子足球和女性职业体育赛事；全球美妆零售商Sephora则不断通过女性跑团、健身活动以及健康生活方式社群与消费者建立联系。</p>\n  <p>另一方面，运动品牌也正在向美妆行业靠近。从Nike围绕女性运动员打造的内容生态，到Lululemon持续扩展的瑜伽、冥想与身心健康社区，越来越多运动品牌开始强调情绪价值和生活方式属性，而不仅仅是产品功能。美妆与运动看似属于不同产业，却正在服务同一批消费者——那些关注健康、自我管理和个人表达的新一代年轻人。</p>\n  <p>在这样的背景下，欧莱雅此次将“有意思青年”与运动场景结合，也体现出企业对年轻群体沟通方式的调整。</p>\n  <p>活动现场设置了篮球、跑步、网球、拳击、高尔夫和乒乓球等多个运动体验区域，旗下修丽可、理肤泉、适乐肤、碧欧泉、巴黎欧莱雅等品牌参与其中。相比传统校园宣讲或品牌路演，运动场景天然具备更强的参与感和社交属性，也更符合当下大学生群体对于线下活动的期待。</p>\n  <p>值得注意的是，活动的重点并不完全在产品展示。</p>\n  <p>作为持续23年的校园公益项目，“有意思青年”长期围绕公益义卖、青年发展和职业赋能展开。今年除了校园义卖活动外，现场还设置了职业咨询、简历指导以及可持续发展互动区域，希望将就业、公益和社会议题融入活动之中。</p>\n  <p>事实上，随着线上流量红利逐渐见顶，越来越多消费品牌开始重新评估与年轻消费者建立关系的方式。</p>\n  <p>过去十年，美妆行业高度依赖明星代言、广告投放和电商流量获取用户，但随着获客成本不断上升，单纯依靠营销曝光已经难以形成长期品牌认同。相比之下，校园项目、兴趣社群以及运动活动等具有持续互动属性的场景，正在成为品牌新的投入方向。</p>\n  <p>对于美妆企业而言，运动或许正是最具潜力的场景之一。</p>\n  <p>一方面，运动天然对应防晒、头皮护理、身体护理等核心品类需求；另一方面，其所代表的积极、健康、自律等价值观，也与当代消费者的身份认同高度契合。相比单纯跨界联名，这种基于真实消费场景建立起来的联系更容易获得市场认可。</p>\n  <p>不过，从全球市场经验来看，运动营销能否真正转化为长期竞争力，最终仍取决于品牌是否能够持续推出满足运动场景需求的产品和服务，而不仅仅停留在赛事赞助或明星资源层面。</p>\n  <p>从这个角度来看，欧莱雅此次将校园公益与运动文化结合，更像是全球“Beauty+Wellness”趋势在中国市场的一次本土化实践。当运动逐渐成为年轻人生活方式的一部分，美妆品牌也正在走出传统零售空间，进入球场、跑道和健身房，寻找下一阶段增长的新入口。</p>", "category": "tech", "published_at": "2026-05-30T05:33:05+00:00", "fetched_at": "2026-05-31T02:59:24.556320+00:00", "fingerprint": "86a0a44bb4d28fa6"}, {"source": "少数派", "title": "AI 如何影响你的审美？", "url": "https://sspai.com/post/110172", "summary": "去感受、去思考、去创作吧，这是只有身为人类的你能做到的事情。<a href=\"https://sspai.com/post/110172\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-30T09:04:38+00:00", "fetched_at": "2026-05-31T02:59:21.435928+00:00", "fingerprint": "cf115fccec6bed94"}, {"source": "The Guardian - World", "title": "Friday briefing: ​What do the cuts in aid mean for the fight against Ebola in the DRC?", "url": "https://www.theguardian.com/world/2026/may/29/friday-briefing-what-do-the-cuts-in-aid-mean-for-the-fight-against-ebola-in-the-drc", "summary": "<p>In today’s newsletter: As the virus spreads across borders, health workers warn that weakened global support is making a prolonged crisis more likely</p><p></p><p>Ebola is spreading rapidly in parts of east Africa. The deadly disease, which kills around half of those it infects, is <a href=\"https://www.who.int/emergencies/alert-and-response\">suspected to have claimed</a> the lives of at least 240 people since the outbreak began in Ituri province in the Democratic Republic of the Congo earlier this month.</p><p>Public health officials are scrambling to contain the virus in one of the toughest environments: Ituri province, the centre of the crisis<strong>,</strong> is a mining hub where thousands of people work in close proximity every day, and a conflict zone, with ongoing fighting between rebel groups. Medical facilities are modest, while waves of displaced people are being forced into overcrowded camps to escape fighting<strong>, </strong>making it even harder to control transmission. The virus has already spread to other  "fingerprint": "e4cca38d8005e773"}, {"source": "36氪 - 最新文章", "title": "连续15年披露ESG报告，自然堂开始把“可持续”做成一门生意｜最前线", "url": "https://36kr.com/p/3830545234552452?f=rss", "summary": "<p>在中国美妆行业增长放缓、价格竞争加剧的背景下，越来越多品牌开始重新审视“可持续发展”这件事的商业意义。</p>\n  <p>5月26日，自然堂集团发布《2025年度可持续发展报告》，这是其连续第15年披露ESG相关内容。相比早期以公益、环保为主的企业社会责任叙事，今年的报告更强调“可量化”与“产业化”：包括首次按照科学碳目标倡议（SBTi）标准制定减碳路径、扩大范围三碳排放披露边界，以及将生物多样性、绿色原料、智能制造与供应链效率直接绑定。</p>\n  <p>对于当前的中国美妆行业而言，这种变化并不只是“做ESG”，更像是在寻找下一阶段竞争力。</p>\n  <p>过去几年，ESG更多是国际消费品公司的标准动作。包括L'Oréal、Estée Lauder Companies、Shiseido等国际美妆集团，均已将减碳、绿色包装、生物多样性纳入长期战略，并逐步向供应链、原料采购与工厂体系延伸。</p>\n  <p><strong>而随着国内美妆行业进入存量竞争阶段，ESG也开始从“附加项”变成影响品牌长期经营的重要变量。</strong>尤其是在高端化、研发能力、供应链透明度越来越被市场关注的情况下，企业需要证明的不只是销量增长，还包括其长期运营能力。</p>\n  <p>自然堂集团公共事务总经理陈娟玲向36氪表示，虽然现阶段ESG仍需要巨大的投入，难以从ROI的角度来计算这一投入的价值。但从长远发展眼光看，ESG的理念将会渗透进自然堂集团的产品和服务当中，最终成为集团竞争力的一部分。</p>\n  <p>自然堂此次披露的一项重点，是其2030减碳目标。</p>\n  <p>根据报告，以2023年为基准年，集团计划到2030年将范围一和范围二温室气体绝对排放量减少42%，并首次将范围三六大重点类别纳入披露边界。对于消费品行业而言，范围三通常涉及原料采购、物流运输、包装与消费者使用等更复杂的供应链环节，也是减碳难度最高的部分。</p>\n  <p>在业内看来，中国消费企业过去较少系统披露范围三数据，原因在于供应链数字化基础不足、统计成本较高。而随着国际市场、资本市场以及大型渠道方对ESG要求提高，供应链透明化正在成为趋势。</p>\n  <p>与减碳目标同步推进的，还有自然堂近年来持续加码的智能制造项目。</p>\n  <p>位于上海东方美谷的“自然堂未来美妆城”于2025年正式启用。该项目集成了分布式光伏、智能物流、数字孪生系统与工业旅游功能。根据披露，其屋顶3.1兆瓦光伏项目预计年发电量约380万度，自用消纳率超过95%。</p>\n  <p>近年来，“绿色工厂”已经成为不少消费品企业的新投入方向。尤其在美妆行业，由于生产环节涉及大量包装、物流与能源消耗，绿色制造不仅影响ESG指标，也直接关系成本控制与运营效率。</p>\n  <p>例如，自动化仓储与“黑灯物流”系统，本质上既是节能项目，也是提升供应链效率的基础设施。而数字化能源管理，则有助于企业建立更细颗粒度的碳排放数据体系。</p>\n  <p>相比单纯强调环保理念，当前行业更关注的是：ESG是否能转化为研发能力、供应链能力和品牌资产。</p>\n  <p>这一逻辑同样体现在自然堂对“喜马拉雅”概念的重新包装上。</p>\n  <p>过去十余年，喜马拉雅一直是自然堂品牌叙事的重要来源。而近几年，其开始将这一概念进一步延伸至生物多样性保护与原料研发。</p>\n  <p>报告显示，“种草喜马拉雅”项目已累计修复666万平方米土地，并升级为“2025-2030喜马拉雅生物多样性保护项目”。与此同时，自然堂与西藏农牧大学合作研发的蓝玉簪龙胆提取物，于2025年完成国家化妆品新原料备案，成为西藏首个备案化妆品新原料。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260529/v2_caf93e953cbd43ef9c7ad38574e74fa6@5922386_oswg592802oswg587oswg391_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">自然堂集团生物多样性保护项目色季拉山考察</p>\n  <p>在全球美妆行业，“原料自主化”正成为新的竞争焦点。</p>\n  <p>一方面，国际大集团正在加大对专利成分、生物发酵与植物细胞培养技术的投入；另一方面，中国品牌也开始尝试从“成分应用”转向“成分研发”。</p>\n  <p>自然堂披露，其上海微生物实验室已全面应用第五代智能生物发酵技术，酵母类、乳酸菌类核心原料实现自主生产，部分专利成分有��提取率提升300%，同时降低生产能耗。</p>\n  <p>对于本土美妆企业而言，这意味着竞争逻辑正在发生变化。过去行业依赖营销投放和流量红利，而未来，原料能力、专利储备和供应链效率的重要性正在上升。</p>\n  <p>与此同时，绿色包装与循环经济也成为行业的新方向。</p>\n  <p>根据报告，自然堂2025年推进了覆盖90个SKU的减塑项目，包括替换装、补充装与一次性成型渐变吹瓶技术等。其中，小紫瓶精华替换装全年减少约0.54吨原生塑料使用，袋装补充装则累计减少约14吨原生塑料。</p>\n  <p>这类“替换装”模式，目前已被越来越多国际品牌采用。原因并不只是环保，更因为其能够提高消费者复购率，并降低包装与物流成本。</p>\n  <p>此外，自然堂还提到，其空瓶回收计划已吸引超过万名消费者参与，并入选上海市“无废城市细胞”案例。</p>\n  <p>相比此前偏概念化的ESG表达，如今中国消费企业开始越来越强调“可验证的数据”和“可追踪的指标”。背后原因在于，ESG已经不再只是品牌形象工程，而正在逐渐影响企业融资、渠道合作、国际化以及供应链管理。</p>\n  <p>对于中国美妆行业而言，这也意味着竞争维度的进一步升级。</p>\n  <p>当流量增长趋缓、行业进入更深度整合阶段后，企业之间比拼的，可能不再只是新品速度和营销声量，而是研发体系、供应链韧性，以及长期经营能力。</p>\n  <p>而ESG，正在成为这些能力的一部分。</p>", "category": "tech", "published_at": "2026-05-29T16:02:16+00:00", "fetched_at": "2026-05-30T02:42:31.610943+00:00", "fingerprint": "8e59d5db54dc5ac7"}, {"source": "36氪 - 最新文章", "title": "千里科技再添筹码，或将整合吉利辅助驾驶团队｜36氪独家", "url": "https://36kr.com/p/3830580716365449?f=rss", "summary": "<p>为助力千里科技成为“第二个华为”，吉利决定为它增添新的技术筹码。</p>\n  <p>36氪从多位产业人士处了解到，吉利中央研究院数百人的辅助驾驶团队，将在近期被整合入千里科技。目前，吉利研究院辅助驾驶团队，已有人收到了转移合同的通知。</p>\n  <p>有接近吉利的知情人士告诉36氪：“这轮整合后，吉利研究院辅助驾驶团队，被平移至千里智驾与极氪的合资公司千里浩瀚，千里浩瀚今后主要负责为吉利的车型提供定制化开发和量产交付。千里智驾可以将更多精力转移至主线研发，提供平台级能力。吉利暂定了这样一个整合方案。”针对以上信息，36氪向吉利求证，截止发稿，没有回应。</p>\n  <p>据公开信息显示，千里智驾是千里科技负责辅助驾驶研发的子公司，千里科技通过重庆江河间接持有千里智驾30%的股份。</p>\n  <p>千里浩瀚是千里智驾和极氪的合资公司，千里智驾和极氪分别持有千里浩瀚48%、47%的股份。</p>\n  <p>2025年8月，极氪辅助驾驶团队、旷世科技旗下辅助驾驶子公司迈驰智行，以及吉利研究院少数人，被整合入千里智驾，组成了一个约2000人规模的辅助驾驶研发团队。</p>\n  <p>有吉利人士对36氪表示，前一轮整合中，被保留在吉利研究院的辅助驾驶团队，主要负责对供应商提定制化需求、测试等。这些人对千里智驾CEO陈奇汇报。</p>\n  <p>千里科技的前身为力帆科技，2020年被吉利投资并控股。2024年，印奇成为千里科技的董事长后，主导企业向“AI+车”战略转型。当前，千里科技的业务范围涵盖辅助驾驶、智能座舱、具身智能等领域。</p>\n  <p>吉利集团对它寄予厚望。去年，吉利执行董事桂生悦曾不止一次公开表示，吉利要与千里科技一起打造“第二个华为” 。今年��京车展上，千里科技又将其商业目标进一步量化——2026 年底ASD搭载量100–130万辆；2027年270–330万辆；2028年挑战800万辆，成为全球最大智驾方案供应商之一。</p>\n  <p>为实现这一宏伟目标，千里科技正积极开拓吉利以外的客户，北汽是目前与之合作意向最明确的车企。双方将在今年成立合资公司，现已规划了5款合作车型，其中包含一款轿车，一款越野车型，还有一款轿跑猎装版。其中部分车型计划于今年发布。</p>\n  <p>但千里科技与北汽合作的车型，其市场表现终究尚存在不确定性，千里科技能否兑现“2026年底ASD搭载量100–130万辆”的承诺，吉利是更关键的客户。</p>\n  <p>2025年，吉利累计销量超过300万辆，但这300多万台车，并不全是千里科技的项目。有吉利人士告诉36氪，此前，千里科技辅助驾驶团队，主要负责极氪的全系车型、领克900等项目，吉利品牌旗下车型，以及领克900之外的领克品牌车型，由吉利研究院辅助驾驶团队负责。</p>\n  <p>如今吉利研究院这数百人规模的辅助驾驶团队加入千里科技，这不仅能够夯实千里科技的技术实力，也使千里科技拥有了更多来自吉利的车型项目，从而提升千里科技ASD搭载量。</p>\n  <p>于吉利而言，这轮辅助驾驶业务的整合，将使吉利今后更聚焦整车业务。</p>\n  <p>吉利集团的智能化业务曾经历过数次整合。</p>\n  <p>吉利集团本有5股不同的辅助驾驶力量——研究院辅助驾驶中心、极氪辅助驾驶团队、路特斯辅助驾驶团队、子公司亿咖通、脱胎于吉利的福瑞泰克。</p>\n  <p>去年3月，吉利集团在吉利AI智能科技发布会上，发布千里浩瀚智驾解决方案，吉利集团CEO淦家阅公开表示：“‘千里浩瀚’是吉利统一的智能出行解决方案，整个吉利的高阶智驾‘一盘棋’。”这在一定意义上可以视作，吉利集团辅助驾驶团队初步整合的标志。</p>\n  <p>去年8月，吉利系辅助驾驶团队迎来了更深彻的整合。</p>\n  <p>极氪辅助驾驶团队、旷视旗下的辅助驾驶品牌“迈驰智行”，以及吉利研究院辅助驾驶团队少部分人，一同被整合至新的主体——千里智驾。千里科技联席总裁王军担任千里智驾CEO，前极氪智驾副总裁陈奇任联席 CEO，旷视觉科技联合创始人杨沐任 CTO。</p>\n  <p>如今，吉利研究院与千里科技辅助驾驶业务的更全面整合，在财务上，能为吉利集团节省大量研发投入，同时可使吉利更聚焦整车的研发，进而拓展更多市场份额。</p>\n  <p>千里科技自成立以来，从未掩饰对标华为的壮志。今年4月，千里科技向港交所第二次递交了上市申请书，如今吉利又将研究院辅助驾驶团队，整合入千里科技，这些努力，都在推动千里科技朝“第二个华为”迈进。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_e0efe5c8943c4edd85c525ac1b39ca46@6215398_oswg41960oswg1080oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-05-29T16:28:31+00:00", "fetched_at": "2026-05-30T02:42:31.610938+00:00", "fingerprint": "462997b2e88380e9"}, {"source": "36氪 - 最新文章", "title": "最前线｜中科创星第十二期“好望角科学沙龙”聚焦“太空智驾”，卫星将从被动响应走向自主决策", "url": "https://36kr.com/p/3831071878358659?f=rss", "summary": "<p>“太空智驾时代将到来，卫星和星座会如同L4级自动驾驶汽车一样，在太空具备自主环境感知、任务规划和机动决策能力。”</p>\n  <p>5月28日，在上海举行的“好望角科学沙龙”上，中国科学院西安光学精密机械研究所（简称“西安光机所”）副所长邵晓鹏在演讲中提出了这一判断。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_896e0741b5d441d48842a792a569594f@5920579_oswg994152oswg1268oswg846_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">西安光机所副所长邵晓鹏在沙龙上演讲</p>\n  <p>“好望角科学沙龙”是由中科创星发起，中科创星、东壁科技数据、上海市研发公共服务平台管理中心、曲率引擎共同主办的科创融合与跨界交流平台。本期沙龙以“星际智控——太空智驾与遥感技术的产业共振”为主题，汇聚了航天领域专家，以及来自科创企业、投资机构与地方政府的近百位代表，共同探讨卫星和星座从被动响应向自主决策升级的技术路径与落地模式。</p>\n  <p>过去几年，全球商业航天进入加速阶段，卫星在轨数量持续攀升，空间碎片、轨道碰撞等风险也在增加。传统依赖地面站逐一管控的卫星在轨管理模式已难以为继，强调卫星自主感知、自主响应与自主决策能力的“太空智驾”概念应运而生。</p>\n  <p>在以《计算成像：重塑“太空智驾”》为题的演讲中，邵晓鹏表示，“AI+光学”的新范式，将推动航天光学载荷从传统的“精密机械”向“智能信息终端”转变，并进一步提升卫星系统的自主化能力。</p>\n  <p>这一思路的核心理论支撑是“计算成像”技术。</p>\n  <p>邵晓鹏打了个比方说：“不必把透镜磨到绝对完美，只需磨到‘差不多’，用算法来补足剩余误差。”对应到工程上，就是在物理域简化硬件（放宽精度要求、减少镜片数量），信息域用AI补偿（像差复原、智能识别）。</p>\n  <p>2025年9月5日，西安光机所等单位共同研制的计算成像遥感相机（可见光波段全金属相机），搭载于开运一号（天雁28星）卫星，由谷神星一号遥十五运载火箭送入太空，标志着计算成像光学系统理论与计算域补偿协同创新技术模式，首次接受真实太空环境验证。</p>\n  <p>相比传统遥感相机，这套系统结构更简单，重量大幅减轻，面形精度大幅放宽，制造成本降至原来的1/5至1/10。根据初步在轨数据，在低信噪比条件下，计算复原后的影像细节与传统遥感成像模式基本一致，验证了技术路径的可行性。</p>\n  <p>而对于卫星自主化而言，不仅要“看得清”，还要“看得懂”。</p>\n  <p>据介绍，针对星上算力受限的问题，西安光机所团队对地面大模型进行了“剪枝”“量化”和“知识蒸馏”等处理，形成适用于星载环境的轻量化模型，以降低部署门槛，提升星上自主处理能力。</p>\n  <p>西安中科天塔科技股份有限公司（简称“中科天塔”）是西安光机所商业航天领域的产业化平台。中科天塔总经理曾伟刚在沙龙上表示，公司正联合西安光机所及产业链伙伴，同步布局“太空智驾”相关能力。</p>\n  <p>按照其规划，未来地面端将围绕卫星在轨管理，提供测运控、健康管理、仿真训练和自动化遥控等服务；星上端则以新一代星载激光通信终端为核心，提升卫星之间的数据传输与协同能力。</p>", "category": "tech", "published_at": "2026-05-30T00:48:34+00:00", "fetched_at": "2026-05-30T02:42:31.610933+00:00", "fingerprint": "234d3cf13b26d5d3"}, {"source": "36氪 - 最新文章", "title": "9点1氪｜泡泡玛特大涨，段永平日赚10亿；诺基亚发布首款微聊手机，售价199元；滴滴回应“乘客车内排泄”", "url": "https://36kr.com/p/3831073348855433?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>黄仁勋披露“赶飞机”细节，特朗普要出发时来电话</li>\n   <li>国内航线燃油附加费6月5日起首次下调</li>\n   <li>铁路将实施新规：违规乘车拒不补票将被限制购票</li>\n   <li>iPhone 17系列中国销量破3000万台，Pro Max版占近一半</li>\n   <li>SpaceX据悉将IPO估值目标下调至至少1.8万亿美元</li>\n  </ul>\n  <h2>TOP3大新闻</h2>\n  <p><strong>泡泡玛特上涨，段永平单日盈利近10亿港币</strong></p>\n  <p>泡泡玛特迎来强势上涨，5月29日盘中最大涨幅超12%，截至29日记者发稿报收176港元，涨幅达8.98%。此番行情走高，与知名投资人段永平大举布局相关。据港交所5月27日披露的信息显示，知名投资人段永平举牌泡泡玛特，当时的持仓市值超117亿港元。伴随29日股价上扬，其单日账面盈利接近10亿港元。泡泡玛特29日大涨之后，段永平在雪球平台上接连两次发布同款表情包，引发市场热议。（中国新闻周刊）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_651c648ba21349adae3e7bdb806fafd2@6100851_oswg52960oswg928oswg385_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <p><strong>诺基亚发布首款微聊手机，售价199元</strong></p>\n  <p>5月29日，诺基亚发布了200 4G手机，售价199元，是首款微聊手机，可通过微信小程序与其他手机视频通话，主打学生、长辈及备用机市场。据官方旗舰店销售页面介绍，该手机搭载2.4英寸屏幕、1450mAh电池，支持双卡双待与全网通4G。通过HMD微聊实现功能机与功能机之间、功能机与智能机之间互通，支持语音通话、视频通话、图文聊天、群组聊天、电子围栏及定位等功能。该手机还有群组聊天、电子围栏等功能，配有喜马拉雅、咪咕音乐等应用。&nbsp;值得注意的是，诺基亚官方在公众号评论区回应，由于芯片问题所以这款新机支持不了WiFi功能。针对网友称其将功能机性能压榨至极致的评论，官方直言 “也是尽力了”。（界面新闻）</p>\n  <p><strong>滴滴回应“乘客车内排泄”，平台将帮司机承担清洁费</strong></p>\n  <p>此前，据多家媒体报道，近日在四川南充，一名网约车司机遇到乘客在车内排泄。司机陈师傅表示，乘客全程清醒。乘客下车后，他只能花1000多元更换座椅。</p>\n  <p>5月29日，“滴滴出行”发文称，留意到“乘客车内排泄司机花1000元换座椅”相关事件，对于陈师傅的遭遇非常关心，及时核查了该笔订单的情况。该订单发生在5月27日凌晨，为代叫订单。乘客下车后，司机陈师傅发现车辆后排座椅、脚垫被排泄物污染，车辆受损无法正常运营。陈师傅随即选择报警，并向平台提交了问题反馈。</p>\n  <p>接到反馈后，我们立刻先后联系陈师傅与实际下单的用户，希望敦促他们向司机师傅道歉并承担司机损失。叫车人表示不认识实际乘车人，也无法取得联系。目前陈师傅的车辆仍在维修中，平台也积极配合警方相关工作，协助跟进处理。考虑到陈师傅车辆受损的情况，以及此次遭遇带来影响，平台将帮助陈师傅承担座椅更换、车辆清洁的相关费用，并提供顺心补贴，助力师傅早日恢复正常接单。滴滴表示，会努力保障好司机师傅们的权益，同时也呼吁广大乘客文明乘车，若途中遇到特殊状况，请及时和司机沟通，感谢大家的理解与配合。（第一财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>飞船返回舱成功着陆，神二十一乘组凯旋</strong></p>\n  <p>据中国载人航天工程办公室消息，北京时间2026年5月29日20时11分，神舟二十一号航天员乘组搭乘神舟二十二号载人飞船在东风着陆场成功着陆，现场医监医保人员确认航天员张陆、武飞、张洪章身体状态良好，任务取得圆满成功。（央视新闻）</p>\n  <p><strong>比亚迪发布中国首款4nm制程智驾芯片</strong></p>\n  <p>36氪获悉，5月28日，比亚迪召开“敢为”智能化战略发布会，发布中国首款4nm制程智驾芯片——璇玑A3，已开启规模化量产，支持L3、L4自动驾驶，通过三颗芯片的高效协同，实现超2100TOPS的总算力，同时兼顾功耗控制与算力利用率。</p>\n  <p><strong>黄仁勋披露“赶飞机”细节，特朗普要出发时来电话</strong></p>\n  <p>据中央电视台中文国际频道，英伟达创始人、CEO黄仁勋在接受采访时，披露了此次随特朗普访华的幕后细节。黄仁勋称，特朗普总统在准备出发时给他打的电话，“他当时并不知道我原本不去”，然后坚持要求他一起去，“所以我就匆忙收拾了一下”。黄仁勋还称，他当时在美国西海岸，而“空军一号”在华盛顿特区，随后他飞到阿拉斯加和特朗普会合，登上了“空军一号”飞往中国。（界面新闻）</p>\n  <p><strong>雷军称YU7车主超三分之一是女性，超过一半是苹果用户</strong></p>\n  <p>据报道，小米汽车5月29日上午在小米汽车工厂交付中心举办YU7 GT首批车主交付仪式，小米创办人、董事长兼CEO雷军和小米汽车品牌代言人舒淇小姐，一起为小米YU7 GT首批车主交车。雷军表示，小米YU7受到很多科技行业、金融行业车主的喜爱，YU7的车主，超过1/3是女性车主，超过一半是苹果用户。舒淇自己也是小米SU7 Max流金粉的车主，目前还在等待交付，应该很快就可以提车。虽然暂时还没有驾照，但看到YU7 GT之后，她表示也心动想要去考驾照了。（IT之家）</p>\n  <p><strong>国内航线燃油附加费6月5日起首次下调</strong></p>\n  <p>5月29日，去哪儿接到多个航空公司通知，自2026年6月5日（出票日期）起，成人旅客：800公里以上航线每位旅客收取150元燃油附加费，800公里(含)以下航线每位旅客收取80元燃油附加费。相较于调整前分别降低了20元/10元。今年四月和五月，国内燃油附加费连续大幅上调，此次为今年以来首次下调。（第一财经）</p>\n  <p><strong>段永平捐赠1万股贵州茅台股票</strong></p>\n  <p>5月29日消息，据江西省安福县委县政府官方公众号“美好安福”消息，段永平向安福县捐赠1万股贵州茅台股票。5月26日，“安福县段永平教育专项基金”捐赠仪式在南昌顺利举行。知名企业家、投资家段永平向安福县慈善会无偿捐赠所持贵州茅台酒股份有限公司股票1万股，专项支持安福教育事业发展。据报道，此次捐赠的1万股贵州茅台股票，将作为“安福县段永平教育专项基金”长期保留基金，以股票年度分红、股息等派生权益作为专项基金可使��资金，持续、稳定、长期助力安福教育提质、励教奖学、助学育才。（界面新闻）</p>\n  <p><strong>何小鹏回应为何机器人没有脸：必须要跟人有一定的差距</strong></p>\n  <p>小鹏集团董事长何小鹏在访谈中表示，机器人可以穿衣服、甚至有头发，但是它不能有自己的脸，必须要跟人有一定的差距。何小鹏称，机器人不能有自己的脸，有一些是因为恐怖谷效应，也有些是其它的法律和社会的学的效应。面对主持人提问“怎么面对跟友商的竞争”时，他表示：我觉得我们跟每一家都是友商，也都是同盟者，也可能是竞争者。我相信蔚小理在大九系这一次都会给出各自不同的看法跟理解。（新浪科技）</p>\n  <p><strong>欣旺达：公司已量产达到10000毫安的手机电池</strong></p>\n  <p>36氪获悉，欣旺达在互动平台表示，公司已量产达到10000毫安的手机电池。</p>\n  <p><strong>铁路将实施新规：违规乘车拒不补票将被限制购票</strong></p>\n  <p>记者从中国国家铁路集团有限公司获悉，新版《中国国家铁路集团有限公司铁路旅客运输规程》将于6月1日起正式实施。新版客规首次对违规乘车并拒绝补票的旅客做出限制购票规定。</p>\n  <p>新版客规首次对违规乘车并拒绝补票的旅客做出了限制购票规定，并纳入铁路旅客运输合同约定事项。旅客如发生“无票乘车”“持用变造、伪造或涂改的乘车凭证乘车”“票、证、人不一致”“持用低票价席别车票乘坐高票价席别”“持优惠票、优待票，没有规定的减价凭证或不符合减价条件”等违规乘车行为并拒不补票，铁路站车工作人员将现场告知违规乘车行为及后续限制购票措施；当上述几类拒不补票旅客再次购票时，铁路运输企业将通过铁路12306自动提示或售票窗口人工提示，告知限制其购票。（新华社）</p>\n  <p><strong>三星电子、SK海力士屡创新高触发意外抛售，今年合计净流出资金达586亿美元</strong></p>\n  <p>全球投资者今年疯狂涌入三星电子和SK海力士股票交易，推动这两只内存股分别上涨了147%和245%，但飙升的股价给一些基金带来了意想不到的麻烦。由于这两家公司股价屡创新高，已经触及了一些基金单只股票持仓比例上限10%的限制，迫使这些基金抛售这两只股票。这一被迫抛售无疑凸显了当前内存市场的拥挤程度，也可能��一步加大波动性。截至5月28日，全球投资者净抛售了价值636亿美元的韩国股票，这是自1999年有数据以来最大的单月抛售量。其中，三星和SK海力士今年合计净流出资金达586亿美元。（财联社）</p>\n  <p><strong>iPhone 17系列中国销量破3000万台，Pro Max版占近一半</strong></p>\n  <p>据第三方市场统计数据显示，iPhone 17系列在中国市场的受欢迎程度远超行业预期，上市至今的累计销量已经突破3000万台。相关统计数据显示，截至2026年第20周也就是5月11日至17日的时间节点，iPhone 17系列在国内的总销量已经达到约3040.55万台，整体市场表现十分亮眼。国内用户对顶配版iPhone 17 Pro Max的青睐程度远超其余机型，这一消费偏好也直观展现出国内消费者的高端购机能力。有数码博主放出的后台激活数据显示，在上述累计总销量中，iPhone 17 Pro Max的累计激活量已经突破1320万台，iPhone 17 Pro的累计激活量超过780万台，基础款iPhone 17的累计激活量也突破了916万台。（快科技）</p>\n  <p><strong>赛力斯回应特斯拉FSD入华，FSD模拟的是人类视觉驾驶逻辑</strong></p>\n  <p>5月29日，在第四届未来汽车先行者大会上，赛力斯汽车董事长张正萍就华为乾崑智驾与特斯拉FSD的对比发表了看法。他表示，两款智驾系统孰优孰劣，最终应交由市场来客观评判。在谈及具体技术路线时，张正萍指出：“哪个智驾系统好用还是要交给市场来回答。全新一代问界M9搭载了6颗激光雷达，这方面不输给FSD。另外，FSD模拟的是人类视觉驾驶逻辑，而华为乾崑智驾能够达到‘不只是人眼可以看到’的状态。”（IT之家）</p>\n  <p><strong>苹果Siri迎来近十五年最大改版，更多人工智能功能将推出</strong></p>\n  <p>苹果公司备受期待的Siri重大升级将成为下一代iPhone、iPad和Mac软件更新的核心亮点。彭博制作的示意图展示了重新设计后的Siri界面、一款全新的聊天机器人应用，以及苹果计划在6月8日全球开发者大会（WWDC）上公布的其他iOS 27重大更新。这些图片基于彭博看到的信息，以及知情人士提供的消息。苹果发言人拒绝置评。该公司通常会在内部测试多种功能设计，6月发布的最终版本可能与当前设计有所不同。（新浪财经）</p>\n  <p><strong>SpaceX据悉将IPO估值目标下调至至少1.8万亿美元</strong></p>\n  <p>据知情人士透露，SpaceX当前对首次公开募股（IPO）的目标估值至少为1.8万亿美元。上个月有报道称，其目标估值逾2万亿美元。但知情人士透露，这家火箭、数据和人工智能公司在与顾问和投资者磋商后，将目标估值下调。知情人士表示，IPO的发行规模和估值等细节通常会在定价前根据各方反馈调整。据此前报道，SpaceX预计最早将于6月4日正式启动IPO推介，并最早于6月11日定价。（新浪财经）</p>\n  <p><strong>美国迎来“娃娃炒股”金融实验，千万新生儿一出生就开始买ETF</strong></p>\n  <p>随着一款名为“特朗普账户”的App上线，一场规模空前、横跨数十年的金融实验正式进入上线前的最后阶段。作为背景，“特朗普账户”是美国政府去年设立的延税投资项目，目标是让儿童自出生开始自动成为股民，亲身体验储蓄随着复利增长，然后到18岁生日那天接管账户并决定如何使用这笔钱（或继续投资）。入户资金将自动投入默认的合格低成本指数基金。按照美国去年出生人口约360万推算，参与这场投资实验的人数预估至少在1000万人以上。（财联社）</p>\n  <p><strong>OpenAI：正在调查影响用户登录和使用ChatGPT的故障</strong></p>\n  <p>OpenAI在网站上表示，公司正在调查可能导致用户无法与ChatGPT对话、登录或创建帐户的问题。 根据网络状况监控网站Downdetector的数据，截至美东时间晚上11:04，已有约5000起相关故障的报告。（财联社）</p>\n  <p><strong>三星电子：开始向主要全球客户发运12层HBM4E芯片样品</strong></p>\n  <p>据报道，三星电子5月29日表示，已开始向主要全球客户发运12层HBM4E芯片样品。（界面新闻）</p>\n  <p><strong>特斯拉Optimus专属机器人工厂动工，规划年产能最高可达1000万台</strong></p>\n  <p>据报道，特斯拉位于得克萨斯州的超级工厂内，专属Optimus人形机器人工厂正式动工建设，规划年产能最高可达1000万台。该工厂将搭建第二代生产线，计划2027年夏季实现大规模量产，全面投产后日均产量约2.7万台。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>阶跃发布Step 3.7 Flash</strong></p>\n  <p>36氪获悉，据阶跃星辰消息，阶跃正式发布并开源Step 3.7 Flash。据介绍，Step 3.7 Flash是面向Agent生产化阶段推出的新一代Flash模型，围绕Agent、Coding、Search与多模态工作流进行系统优化。</p>\n  <p><strong>AI算力驱动需求爆发，国产光通信产品出海热销</strong></p>\n  <p>眼下，国产光通信产品订单火爆，走俏国际市场，呈现量价齐升的景气态势，多家企业出口订单已排到2028年。A股市场上，今年以来光纤和光模块概念持续升温，截至5月28日收盘，万得光模块（CPO）概念指数、万得光纤概念指数年内涨幅均超过了100%，分别为104.76%、108.48%。（经济参考报）</p>\n  <p><strong>亚马逊员工刷AI数据致算力成本激增，公司关闭使用量排行榜</strong></p>\n  <p>亚马逊近日关闭了一项内部AI使用量排行榜。此前员工为冲排名、刻意刷高AI调用量，导致公司算力成本激增。据两位知情人士透露，这家市值2.9万亿美元的科技巨头本周通知员工，其内部服务“Kirorank”已下线。该工具原本用于给开发者平台Kiro的用户打分，分数完全基于其AI活动量。下线原因是：部分员工为冲榜，滥用AI智能体（可代用户执行任务的自动程序），让其执行大量无意义操作。（新浪财经）</p>\n  <h2>上市进行时</h2>\n  <p><strong>汇成股份：已向香港联交所递交H股发行并上市申请</strong></p>\n  <p>36氪获悉，汇成股份公告，公司已于5月29日向香港联交所递交发行H股并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登此次H股发行并上市的申请资料。</p>\n  <p><strong>江波龙向港交所提交上市申请书</strong></p>\n  <p>36氪获悉，据港交所文件，深圳市江波龙电子股份有限公司向港交所提交上市申请书，联合保荐人为中信证券、花旗。</p>\n  <h2>大公司财报</h2>\n  <p><strong>开市客三季度总营收705.3亿美元，高于市场预期</strong></p>\n  <p>开市客（Costco）5月28日公布三季度总营收705.3亿美元，同比增长12%，预估696.2亿美元；每股收益4.93美元，同比增长15.2%，预估4.91美元。（界面新闻）</p>\n  <p><strong>霸王茶姬：第一季度总GMV达79.18亿元，拟未来12个月回购最高1.5亿美元ADS</strong></p>\n  <p>36氪获悉，5月29日，霸王茶姬公布2026年第一季度（截至2026年3月31日）财务及经营业绩。财报期内，霸王茶姬实现总营收35.46亿元，同比增长4.5%；总GMV达79.18亿元，环比增长8.1%；经调整净利润5.07亿元。截至2026年3月31日，霸王茶姬全球门店数达7531家，会员数突破2.48亿，季度净增超千万。此外，霸王茶姬董事会已批准股份回购计划，公司拟根据市场情况、监管要求及其他因素，在未来12个月内回购不超过1.5亿美元的美国存托股份（ADS）。</p>\n  <h2>投融资</h2>\n  <p><strong>AI保险平台Corgi融资1.06亿美元，估值26亿美元</strong></p>\n  <p>人工智能保险平台Corgi当地时间5月28日宣布，已完成由投资公司TCV领投的1.06亿美元融资，公司估值达26亿美元。该公司首席执行官Nico Laqua表示，Corgi上月已实现盈利，新一轮融资将帮助公司拓展至更多领域，包括货运、小型企业和体育行业。（界面新闻）</p>\n  <p><strong>“易启未来”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，“易启未来”宣布完成数千万元A轮融资，由同创伟业、优山资本、杭州资本润苗基金等股东联合投资，天使股东网易继续加持。该公司由网易伏羲孵化，聚焦按摩机器人，自研3秒穴位识别算法与六轴机械臂运控算法。本轮资金将用于技术迭代、产品研发与规模化量产，加速海内外市场拓展。</p>\n  <h2>酷产品</h2>\n  <p><strong>全新猛士M817预售开启</strong></p>\n  <p>36氪获悉，猛士汽车与华为乾崑联手打造的全新猛士M817，完成全球首秀并正式开启预售，官方预售价37万元起。</p>\n  <p><strong>整理</strong>｜徐嘉彤</p>", "category": "tech", "published_at": "2026-05-30T00:52:20+00:00", "fetched_at": "2026-05-30T02:42:31.610925+00:00", "fingerprint": "e9939830330d8bab"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 服务富士康，半年营收超两千万的机器人解决方案商完成天使轮融资", "url": "https://36kr.com/p/3831135917107075?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，乘物机器人（深圳）有限公司（以下简称“乘物机器人”）近日完成天使轮融资，由中国台湾工业自动化与智能机器人解决方案领域龙头企业和椿科技战略投资，华君资本担任独家财务顾问。</p>\n  <p>乘物机器人成立于2025年，总部位于深圳，专注工业具身智能技术研发与产品解决方案，具备从软硬件研发、数据采集、模型训练、场景部署与维护的一体化技术能力。</p>\n  <p>创始人黄金龙技术出身，拥有十余年机器人全栈研发与产业化经验，主导过多类工业机器人产品研发与落地；联合创始人单玉虎博士，曾先后在腾讯、小鹏、美团等企业负责机器人核心技术研发，深耕多模态大模型、3D感知、多传感器融合等领域，拥有丰富量产实战经验。</p>\n  <p>工业场景中，非标场景普遍存在，机器人落地应用往往需要定制化的解决方案。乘物机器人由此切入，成立之初便聚焦工业场景，通过本体整合成熟供应链方案，自研末端执行结构、电子硬件、软件算法、云端能力及核心大模型，快速沉淀出标准化的技术产品包，具备了覆盖工业场景全流程的交付能力。</p>\n  <p><strong>目前，公司已完成十余个工业场景落地项目，2025年累计营收超两千万元，服务包括富士康在内的一系列代表性头部制造企业。</strong></p>\n  <p><strong>在此期间，团队与数十家头部主流机器人本体厂商建立深度合作关系，并获得8家头部品牌的最高权限授权，为其落地具体场景做定制化服务。</strong></p>\n  <p><strong>同时，乘物机器人也在布局模型端。公司正以工业垂类VLA（Vision-Language-Action）大模型为核心研发方向，希望打造具备“一脑多形”跨本体泛化能力的具身智能模型。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260530/v2_ab23dbd36ba34964bedeb8f969450d14@5920579_oswg270130oswg1080oswg505_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>该模型融合空间感知、强化学习及世界模型的能力，能够提高对复杂异形物体的三维感知、精准操作与跨场景泛化能力，解决传统方案泛化性不足的问题。</p>\n  <p>具身模型的核心瓶颈之一在于数据。乘物机器人自研了Egocentric-UMI数据采集装置与Bybot-TeleOp远程操作系统，通过遥操模拟真实产线环境，高效采集视觉、力矩等多模态数据，大幅降低模型训练与部署周期，解决传统数据采集成本高、效率低的问题。</p>\n  <p><strong>目前，公司自研VLA模型Bybot Foundation Model-1（BFM-1）的训练及部署流程已全面跑通，技术验证顺利推进。</strong></p>\n  <p>硬件层面，乘物机器人同步研发工业精准操作的上半身机器人原型产品，搭载仿生力控双机械臂、灵巧手、腕部相机及RGBD相机等核心部件，为工业垂类基础模型训练与场景适配提供硬件支撑，推动大模型与工业机器人本体深度融合。</p>\n  <p><strong>以下为访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：为什么从场景落地转向模型研发？</strong></p>\n  <p><strong>黄金龙：</strong>我们非常看好VLA和具身智能的发展方向。在我们看来，机器人本体本身并不是最难的部分，尤其是在深圳这样的硬件产业链环境里，把机器人“做出来”并不算特别高的门槛。真正困难的是：模型如何和本体融合，并最终在真实客户场景中落地，让客户愿意持续付费。</p>\n  <p>目前行业里真正实现规模化落地的案例并不多。我们认为，具身智能的发展路径会遵循“工业—商业—服务—家庭”这样逐步演进的过程。其中工业场景最容易率先落地，因为很多工业任务并不需要特别复杂的灵巧操作，很多场景通过二指夹爪就能完成。相比之下，家庭场景对安全性、泛化性和稳定性的要求更高。</p>\n  <p>另外，和椿除了战略投资外，也为我们带来了大量产业客户资源。我们目前已经进入富士康等客户体系，并有项目进入实际交付阶段。由于能够直接接触一线客户，我们可以更清楚地理解客户真正需要什么：如果传统自动化技术能够解决问题，我们就优先采用传统方案；如果具身模型能够创造更高价值，我们就用具身技术去完成交付。</p>\n  <p><strong>硬氪：乘物机器人做具身模型的核心优势是什么？</strong></p>\n  <p><strong>黄金龙：</strong>首先是全栈能力与真实交付经验。团队具备从机械、电子到软件、算法、云端服务的完整研发能力，过去也长期为头部机器人厂商提供定制化解决方案，因此对工业场景中的非标需求、交付流程以及客户痛点有非常深入的理解。相比只做模型的团队，我们更清楚模型如何真正转化为可商用的解决方案。</p>\n  <p>其次，我们希望打造的是“平台化”的具身模型能力。目前VLA模型普遍存在泛化能力不足的问题：一个场景中训练出来的数据和模型，往往无法迁移到另一台机器人或另一个环境中。乘物机器人的模型设计并不绑定单一本体，而是能够适配不同厂商、不同类型机器人平台，从而解决行业中模型难以跨平台部署的问题。</p>", "category": "tech", "published_at": "2026-05-30T01:53:46+00:00", "fetched_at": "2026-05-30T02:42:31.610912+00:00", "fingerprint": "b4c240e515efba0d"}, {"source": "少数派", "title": "什么才是「好」的 Android 音频输出？从一台旧日 Xperia 说起", "url": "https://sspai.com/post/110120", "summary": "Android 早已具备高质量音频输出的能力，但一段声音从在抵达耳机之前，往往还要经过系统层层处理。下面我们一起探究 Android 高保真输出背后的秘密。<a href=\"https://sspai.com/post/110120\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-29T02:57:32+00:00", "fetched_at": "2026-05-30T02:42:30.204951+00:00", "fingerprint": "1327b8bf9324d93e"}, {"source": "少数派", "title": "Await：五分钟，把点子变成 iPhone 小组件", "url": "https://sspai.com/post/110106", "summary": "我希望 Await 最后留下的，是一种更轻的创作入口：不必很大，但足够好看和好玩，也足够贴近自己每天使用手机的方式。<a href=\"https://sspai.com/post/110106\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-29T07:00:28+00:00", "fetched_at": "2026-05-30T02:42:30.204945+00:00", "fingerprint": "5b1afc41fa718f5d"}, {"source": "少数派", "title": "住久了没意思（三）：打造能好好放松的卧室", "url": "https://sspai.com/prime/story/how-to-renovate-a-rental-bedroom", "summary": "前文回顾：租房常见问题与我的改造原则从有光的地方开始动手对大部分人来说，卧室可能是在家里待得最长时间的区域。除了每天睡觉，周末可能也会花很多时间赖在卧室；如果家里比较小，卧室还可能承担休闲和娱乐的功能 ...<a href=\"https://sspai.com/prime/story/how-to-renovate-a-rental-bedroom\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-05-29T09:20:56+00:00", "fetched_at": "2026-05-30T02:42:30.204939+00:00", "fingerprint": "ee58caca4baf8e8b"}, {"source": "少数派", "title": "本周看什么 | 最近值得一看的 8 部作品", "url": "https://sspai.com/post/110446", "summary": "📅本周新预告《玩具总动员5》终极预告5月26日，皮克斯动画电影《玩具总动员5》发布了终极预告，将于6月19日内地上映。安德鲁·斯坦顿、麦肯纳·哈里斯执导，胡迪、巴斯光年、翠丝等老朋友们回归，无所不能的 ...<a href=\"https://sspai.com/p
