: "", "category": "tech", "published_at": null, "fetched_at": "2026-08-05T02:03:18.502260+00:00", "fingerprint": "e762e41d1a2ba1ad"}, {"source": "The Verge", "title": "SpaceX made more revenue as an AI company than a space company", "url": "https://www.theverge.com/science/975335/spacex-made-more-money-as-a-neocloud", "summary": "SpaceX's AI revenue grew more than three times to $2.6 billion from the year before, mostly because of deals that the company made to provide compute to other AI companies, according to SpaceX's quarterly earnings. The AI division, which the company said in its documents to go public was the source of most of its [&#8230;]", "category": "tech", "published_at": "2026-08-04T20:47:55+00:00", "fetched_at": "2026-08-05T02:03:18.252815+00:00", "fingerprint": "30d8d6544d2f9c31"}, {"source": "The Verge", "title": "AMD&#8217;s data center business is booming while gaming takes a backseat", "url": "https://www.theverge.com/tech/975381/amd-q2-2026-earnings-ai-gaming-ryzen", "summary": "Driven by demand for AI capacity, AMD's data center revenue more than doubled year-over-year in its latest earnings report, reaching $6.7 billion. That's up from $5.8 billion in Q1, and jumping 107 percent from the $3.2 billion it reported for the same period a year ago. During Tuesday's earnings call, AMD CEO Lisa Su said [&#8230;]", "category": "tech", "published_at": "2026-08-04T20:57:49+00:00", "fetched_at": "2026-08-05T02:03:18.252809+00:00", "fingerprint": "9be0fafa6f21f3b3"}, {"source": "The Verge", "title": "Now you can securely link multiple phones to one Signal account", "url": "https://www.theverge.com/tech/975407/signal-linked-devices-sync", "summary": "You can link more devices with one phone number on Signal now, including an Android phone or iPhone. Signal already supported linking PCs and iPads, but not additional phones. When you link a device on Signal, you can check and respond to new messages across all of your linked devices. You can also choose whether [&#8230;]", "category": "tech", "published_at": "2026-08-04T22:02:46+00:00", "fetched_at": "2026-08-05T02:03:18.252803+00:00", "fingerprint": "a684e656622447b2"}, {"source": "The Verge", "title": "Don’t screw this up, Marvel", "url": "https://www.theverge.com/entertainment/975297/spider-man-brand-new-day-marvel-sony-xmen-doomsday", "summary": "In less than a week, Spider-Man: Brand New Day raked in $1 billion worldwide and had the biggest box office opening weekend in Hollywood history. The feature has been a reminder of why Sony is probably never going to give up the Spider-Man film rights, and highlighted how Marvel Studios was smart to strike a [&#8230;]", "category": "tech", "published_at": "2026-08-04T23:20:56+00:00", "fetched_at": "2026-08-05T02:03:18.252793+00:00", "fingerprint": "002205d8a5fdc28a"}, {"source": "36氪 - 最新文章", "title": "一层“布”涨价270%之后，投资机构用数亿元投票玻璃基板，巽霖科技完成近2亿元B轮融资", "url": "https://36kr.com/p/3924953058605444?f=rss", "summary": "<p><strong>【导语】当前，电子级玻纤布价格较2025年低点翻倍、FR-4覆铜板涨幅超270%，AI封装载板部分交期拉长至6个月以上，有机基板供给危机持续加深。在此背景下，</strong>国内玻璃基板领军企业巽霖科技宣布完成近2亿元B轮融资——这已是该公司半年内完成的第三轮次融资。本轮由英诺基金、千乘资本、海目星、光莆股份、同鑫资本等新股东投资，金雨茂物、海通开元、北岸产投等老股东持续加码。募集资金将主要投向玻璃基板产能扩张、封装产线建设投产、制程精度升级研发，以及光通讯前沿应用布局。</p>\n  <p>&nbsp;</p>\n  <h2><strong>股东结构：市场化资本、产业资本、区域国资同席，老股东再投票</strong></h2>\n  <p>这一轮的股东阵容，呈现鲜明的“三重奏”：以英诺基金、千乘资本、同鑫资本为代表的市场化硬科技基金，长期深耕半导体与先进制造；以海目星、光莆股份为代表的产业资本，分别来自激光装备与光通讯两大与玻璃基板强相关的产业上下游；以金雨茂物、北岸产投、海通开元为代表的市场化基金、区域国资与券商系资本，则在本轮继续加码。多元股东的持续投入，为公司的产业化进程提供了坚实支撑，也是对其量产进展最直接的确认。</p>\n  <h2><strong>行业背景：载板紧缺与涨价潮叠加，玻璃基板迎来确定性窗口</strong></h2>\n  <p>这轮融资本质上是一次对时间窗口的卡位。AI算力狂飙之下，封装载板持续紧缺，ABF载板供不应求、交期一再拉长；而当芯片封装尺寸不断突破、光模块速率持续跃升，有机基板在热膨胀匹配、高频损耗与布线密度上，正在逼近物理极限。巨头的选择已经给出答案——英特尔宣布玻璃芯基板（GCS）进入大规模量产，台积电CoPoS试产线年内通线，三星、SKC Absolics加速送样与量产准备。玻璃基板，正在从巨头的实验室走向产业的中心。</p>\n  <p>&nbsp;</p>\n  <h2><strong>替代大逻辑：一层“布”卡住了有机基板，三大应用走向全面玻璃基化</strong></h2>\n  <p>比巨头动向更值得关注的，是有机基板的成本地基正在松动。2025年下半年以来，PCB产业链经历了一轮罕见涨价：覆铜板价格大幅攀升，PCB厂商全线调价。而涨价的真正源头，不是铜箔，也不是树脂，而是一层“布”——电子级玻璃纤维布。它的价格较2025年低点翻倍，行业库存降至历史极低位，高端低介电产品被海外厂商高度垄断，而扩产以年计。这层“布”的紧缺，短期内无解。</p>\n  <p>玻纤布之所以不可或缺，是因为它是有机基板的“骨架”，核心使命之一正是热应力匹配：AI服务器PCB层数不断攀升，为了让有机基材的热膨胀系数贴近硅芯片，行业不得不大量使用昂贵的低CTE特种玻纤布。换句话说，<strong>有机基板正在用越来越贵的“布”，去模仿玻璃与生俱来的性能</strong>——玻璃CTE天然与硅匹配，介电损耗远低于有机材料，而且根本不需要这层“布”。当“补丁”的成本越过材料替代的成本拐点，玻璃基化就从可选项变成了必然项。但“玻璃基化”并不是一件事，而是三件事——三大应用的需求逻辑、技术指标与产业节奏，截然不同：</p>\n  <p><strong>第一类，PCB替代——一场由经济性驱动的存量替代，节奏最快。</strong>面向AI服务器背板、高频通信板与新型显示基板，替代对象是FR-4与传统PCB，逻辑简单而锋利：性能更好，成本更低。信号损耗显著降低，显示与HDI基板场景的综合成本大幅优于PCB基板。这一类比拼的是大规模制造与成本控制能力，是当前放量的主战场——2026年，将是玻璃基PCB的替代元年。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_347f933315314b7bacecb2f9f9a631a8@5284654_oswg3007833oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板替代传统PCB示意图</p>\n  <p><strong>&nbsp;</strong></p>\n  <p><strong>第二类，ABF载板替代——由可靠性与供给安全驱动，节奏居中。</strong>面向超大尺寸FC-BGA封装、Chiplet与HBM高带宽存储，替代被海外垄断且持续紧缺的载板。这是一场硬指标的对决：翘曲、线宽线距、孔径与深宽比全面收紧，考验的是精细制程与可靠性验证的深水区能力。相关产品将在2027年逐步推向市场。</p>\n  <p>&nbsp;</p>\n  <p><strong>第三类，Interposer替代——由成本革命驱动的远期替代，空间最大。</strong>面向CoWoS先进封装与CPO光电共封装，替代昂贵的硅TSV中介层：玻璃介电性能显著优于硅，面板级加工利用率更高，综合成本有望大幅低于硅TSV；更关键的是，CPO场景下玻璃可以直接承载光波导，实现光电一体化。这条产业链将在2027-2030年逐步成熟——谁提前卡位，谁就握住了下一代封装的入场券。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_969d298d35a9443f9288dad2f7f6c9d7@5284654_oswg2828838oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃芯基板与玻璃中阶层的应用示意图</p>\n  <p>&nbsp;</p>\n  <p><strong>值得注意的是，当行业目光普遍聚焦GCS（Glass Core Substrate）与GI（Glass Interposer）时，PCB的玻璃基化同样必然快速落地，而Glass PCB有一个残酷前提：替代指标极高，极少企业能够真正满足。</strong>玻璃基板要替代有机PCB，必须同时跨过三道门槛——<strong>成本框架</strong>，多数企业的TGV基板成本模型根本无法闭合；<strong>高铜厚线宽比</strong>，精细线路之下，服务器电源与显示大电流驱动同样要求厚铜，而厚铜恰是行业玻璃覆铜的普遍短板；<strong>全工序直通良率</strong>，这是行业公认的经济性生死线，国内量产水平参差不齐。<strong>巽霖科技是全球极少数三重指标全部通过、且具备量产可能性的企业</strong>：综合成本有望较同类型PCB大幅降低，厚铜能力与精细线路兼得，直通良率行业领先，叠加数倍于行业的覆铜结合强度，保障贴装与返修的长期可靠性。涨价持续的窗口期里，玻璃基板与有机PCB的性价比天平正在反转——而反转之后能接住需求的企业，必须先过这三关。</p>\n  <p>&nbsp;</p>\n  <h2><strong>量产进展：最后一公里已经打通</strong></h2>\n  <p>行业从来不缺概念和样品，缺的是能稳定批量交付的真实产能。在巽霖科技看来，只有工厂落地、良率跑通、成本模型闭合，需求才能从样品订单变成可持续的批量订单。为此，巽霖在天津自主建设了玻璃基板全流程工厂，从切割、减薄、TGV成孔，到PVD金属化、电镀、图形化、阻焊，全制程一厂覆盖，年产能30万平方米。依托源自航空发动机热障涂层体系的自研PVD覆铜技术与Cu-ABX四元合金种子层，公司覆铜结合强度数倍于行业水平，TGV量产孔径与深径比覆盖主流需求，连续VCP电镀产能数倍于传统线体。目前，公司Mini LED背光、COB直显及MIP显示模组基板已进入批量出货阶段，并通过自有模组封装线体获得国内头部客户验证——玻璃基板PCB从实验室走向生产线的“最后一公里”，已被打通。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_ca737d3a8a304616a6f021f1cdf37d7a@5284654_oswg3150534oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板在MicroLED中的应用</p>\n  <p>&nbsp;</p>\n  <h2><strong>加工路径：三套工艺平台递进交互，六级精度逐级跃迁</strong></h2>\n  <p>巽霖的扩产逻辑，不是产能的简单复制，而是围绕TGV成孔、PVD金属化、电镀与图形化等底层能力，构建三套递进且交互的工艺平台，在孔径、孔密度、结构、层数、线宽线距五个维度逐级收紧、逐级打开市场——六级产品，沿三条工艺主线拾级而上。</p>\n  <p>这条路径的起点，是<strong>第一套平台——以减成法为核心的大尺寸玻璃基PCB工艺</strong>：已进入量产的显示背光与COB玻璃基PCB，双面覆铜加TGV垂直导通，大板面、高良率，既是现金流基本盘，也是所有层级的可靠性底座；同一平台收紧图形化精度，即延伸出玻璃基HDI，引入微孔与盲埋孔，实现多层TGV精细布线，切入高速PCB与光模块载板。<strong>第二套平台，是以半加成精细线路与多层键合为核心的高阶互连工艺</strong>：高阶HDI以单元体键合实现层数倍增堆叠，规避逐层压合的累积对准误差，这是巽霖多层化的差异化打法；这套精细线路能力继续向载板延伸，便打开了GCS玻璃芯载板——转向“通孔—填孔—RDL—多层堆叠”的精细制程，直指百亿美金级的ABF存量替代市场，也是本轮融资的研发主攻方向。<strong>第三套平台，面向封装与光的融合</strong>：高精度TGV与玻璃中介层（GI）向更小孔径、更高深宽比与更高通孔密度持续攻关，成本有望大幅低于硅TSV，面向2.5D/3D封装与HBM的远期市场；同一平台上再叠加光加工能力，同板加工离子交换光波导、激光直写改性、光纤穿插孔与精密腔体，最终实现“电路+光路”的同板共构。三套平台并非彼此割裂：减成法平台验证的覆铜可靠性与量产良率，是精细线路与封装工艺的共同底座；而填孔、RDL与光加工中沉淀的精密能力，又持续反哺前两套平台的精度爬升——递进之中，互为支撑。</p>\n  <p>这条六级路径不是跳跃式押注，而是精度迭代的线性演进——与国内PCB大厂“单双面板—多层板—HDI—高阶HDI—IC载板”的爬升逻辑完全同构：孔径持续收紧、线路不断精细、层数从双面走向数十层，本质是共享底层工艺能力上的连续收窄与逐级叠加。<strong>这一模式从根本上规避了行业最大的隐性风险——产线淘汰与投资失效</strong>：TGV、PVD、电镀、曝光、蚀刻等核心制程在三套平台间大量复用，平台升级依靠工艺包迭代与模块化工序叠加，而非推倒重建；每一级产品的量产收入，又反哺下一代研发。本轮融资形成的产能，不会随产品迭代贬值，反而会随精度爬升持续增值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_48e338ae4f5e4964ad08134be1c29637@5284654_oswg3069351oswg2000oswg1123_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玻璃基板产业升级跳转逻辑</p>\n  <p>&nbsp;</p>\n  <h2><strong>投资方与创始人观点</strong></h2>\n  <p>本轮投资方英诺基金表示：“玻璃基板正处在从技术验证走向规模量产的关键窗口期。我们看重巽霖科技在PVD覆铜等底层工艺上的原创突破，更看重其已建成全流程产线并实现批量出货的落地能力——在硬科技投资中，能交付的团队最稀缺。”</p>\n  <p>巽霖科技创始人兼CEO甄真博士表示：“本轮融资是产业伙伴与市场资本对玻璃基板量产路线的双重确认。玻纤布涨价让全行业看清了有机基板的成本天花板，也让玻璃基板的替代价值第一次有了经济学的确定性。接下来，资金将集中投向产能爬坡、封装落地与精度升级——从显示基板到高阶HDI，从玻璃芯载板到光波导，我们用三套递进交互的工艺平台与持续的精度跃迁，让真实的批量交付成为行业需求的最终解。”</p>\n  <p>&nbsp;</p>\n  <p><strong>关于巽霖科技</strong></p>\n  <p>巽霖科技成立于2023年9月，专注于玻璃基板全制程技术的研发与产业化，覆盖TGV通孔、PVD复合镀膜、连续式电镀与精细线路等核心工艺，产品应用于Mini LED背光、COB/Micro LED直显、玻璃基HDI、先进封装载板及光电共封装等领域。公司已实现Micro LED级别线路精度与高密度TGV基板量产，正加速推进从基板到模组、从显示到封装、从电到光的产业版图。</p>", "category": "tech", "published_at": "2026-08-04T08:31:59+00:00", "fetched_at": "2026-08-05T02:03:18.038329+00:00", "fingerprint": "2a904d7000b1f247"}, {"source": "36氪 - 最新文章", "title": "从追番到下单，国风IP正在重塑硬核数码消费", "url": "https://36kr.com/p/3925017067862409?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_b648027c573948238feec75943fa277a@19153231_oswg1479097oswg900oswg1030_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <h2><strong>当国风联名吹到硬核数码</strong></h2>\n  <p>这个夏天，《八仙！》成了暑期档最大的黑马。凭借反套路的剧情设计与极具东方美学的画面一路狂飙，斩获豆瓣8.2的评分，预测总票房达到20亿。</p>\n  <p>想不到的是，电影里那只随手捏出来的“红土鸭子”，竟也成了今年夏天受年轻人追捧的玄学单品。</p>\n  <p>在官方授权店里，这只鸭子上架没多久，就售罄下架。没抢到的网友们也被逼成了野生手艺人，有人用红土陶复刻同款，有人用3D打印自制平替，也有人花两小时用拼豆拼了个2D的鸭子出来。<strong>社交平台上，催促官方赶紧售卖周边的声音也此起彼伏，</strong>“急切想花钱但是花不出去”，“八仙你会做周边吗急死我了”……&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_1ba0cf1b994941cd827b2385fba5b469@19153231_oswg69769oswg1080oswg452_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源@电影八仙</p>\n  <p>可见，<strong>年轻人对国风IP是越来越上头了。</strong></p>\n  <p>数据也证明了年轻人对国风IP的喜爱。《中国青年报》发布的《2025青年国潮趋势报告》显示，<strong>91.6%的年轻人认为国潮产品已更深入地走进了大众日常生活。</strong>也有59.9%的年轻人明显感觉到近些年来，国潮产品的跨界联名愈发多样，品类也越来越丰富。</p>\n  <p><strong>听到了年轻人的呼唤，敏锐的品牌们也开始在国风联名上玩起了新花样。</strong></p>\n  <p>比如最近，蜜雪冰城、美团外卖又与广东粤剧院展开三方跨界联名，推出了包含粤剧文化元素的折扇与挂件，雪王和袋鼠双双披上戏服，折扇一挥，挂件一晃，将国风碰撞出的实用性与文化底蕴拿捏得死死的。</p>\n  <p><strong>这股联名的风潮不只局限于轻量级的工艺品，也刮进了对技术与工艺要求极高的硬核数码硬件圈。</strong></p>\n  <p>7月20日，<strong>迈从和国漫IP《凡人修仙传》联手，重磅推出了售价1299元的高端系列新品——God 60联名款磁轴键盘礼盒。</strong>产品开放预约后，短短几天，预约量迅速突破6万，并在首批抢先购开售后立即售罄。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_ef197a44b82d4053b8664f1cc12db4b3@19153231_oswg4955512oswg5000oswg3333_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">迈从God 60高端系列</p>\n  <p>年轻人对国风 IP 的热爱，正在从内容消费延伸到真实产品选择。<strong>迈从God 60联名款的热度说明，当IP情绪、产品性能和日常使用场景被打通，硬核数码也能成为国风文化的新入口。</strong></p>\n  <p>具体来看，迈从尝试将那个缥缈的修仙世界搬到玩家的桌面上。</p>\n  <p><strong>外包装摒弃了常规的数码纸盒，而是做成了剑匣的模样，盒身上贯穿着云纹样式，仙气十足。</strong>交互设计也极具仪式感，指尖触碰正面的“掌天瓶”滑块，向右轻轻滑动，大庚剑阵的图样像解开封印一般徐徐展开，让人有一种修仙世界里“开匣出剑”的隐秘快感。</p>\n  <p>礼盒中的键盘，整体为青金色，每一行键盘的颜色都不同，<strong>从上到下呈渐变，接通电源的瞬间就能看见键帽展示大庚剑阵的灯光效果。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_9668605148934d97bcd39cb50af7ee32@19153231_oswg797435oswg3205oswg2135_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p><strong>键帽也有着不同的设计，左侧是雾透效果键帽，左上角的Esc键被替换成了《凡人修仙传》中黄枫谷发放的入门特权令牌——升仙令。</strong>让人印象深刻的，还有那3枚可替换的金属键帽，分别刻着大庚剑阵的阵眼与代表男主韩立性格与态度的“谨慎行事”和“念头通达”。</p>\n  <p>整个礼盒像是一个百宝箱，印着“可叩响仙门”字样的键盘手托、盲盒般的动画鼠标垫、宗门专属的配件盒、带有名场面显影片的电气灯……甚至连撕拉吧唧、动画贴纸这些小周边都安排得明明白白。&nbsp;</p>\n  <p>在这份溢出屏幕的真心背后，我们也不禁好奇，从极其考究的“剑匣”式包装盒，到定制款异形金属键帽，<strong>一个过去习惯了用主流价位爆品打响知名度的品牌，究竟为这场高端产品推出做了多少准备？</strong></p>\n  <h2><strong>迈从的修炼</strong></h2>\n  <p>过去几年，迈从一直在“修炼”。</p>\n  <p>它始终深耕外设赛道，在键盘、鼠标、耳机的主流价位段专攻性能与品质，连续打造出了Ace 68磁轴键盘、G87机械键盘、A7电竞鼠标、V9电竞耳机等一系列高销量爆品。也通过在品控上的严苛把关，以及诸如“90天只换不修”“24个月质保”的服务承诺，一步步建立起了年轻消费者对其产品性能、软件体验与售后体系的信任。</p>\n  <p>建立在真实体验上的口碑积累，让迈从成为了年轻消费者喜欢的外设品牌——<strong>2025年，迈从经过弗若斯特沙利文认证，拿下了机械键盘全国销量第一的成绩，成为了极具影响力的国产消费电子品牌。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_232ccd7e95164ed5b4a79d1a2d6874c2@19153231_oswg1503270oswg1300oswg867_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p>规模做大了，基本盘稳了，迈从决定走出舒适区，向上迈出关键的一步。</p>\n  <p>评估了市面上众多热门IP后，最终将目光锁定在了《凡人修仙传》上。</p>\n  <p>作为许多年轻人心中的国漫Top1，主角韩立出身平凡，没有世家托举，也没有修道基础，却凭借着“谨慎行事”“意志坚定”的行事风格与脚踏实地的修炼，一步步从凡人成长为修仙界巅峰。</p>\n  <p>这种热血又接地气的逆袭轨迹，打动了不少年轻人，也和迈从自身的品牌成长轨迹相契合——<strong>从籍籍无名到全网销量第一，迈从的进阶之路，也像是一场外设界的“修仙”。</strong></p>\n  <p>但要稳稳承接住《凡人修仙传》这样的超级IP，光有精神上的契合还远远不够，必须依靠足够强悍的系统工程能力，将厚重的文化内容与审美意境，转化为消费者真实可感的使用体验。</p>\n  <p><strong>光是在产品设计上，就能看到迈从的很多的用心之处。</strong></p>\n  <p>首先，为了在最了解产品、也最认可紧凑配列的核心用户中建立God高端系列认知，迈从没有选择常规的大配列，而是克制且果断地采用了60配列，<strong>不光将桌面的活动空间还给了鼠标，也给玩家们带来了更专注、纯粹的操作体验，希望借此通过核心用户的体验和口碑，向更广泛人群延伸。</strong></p>\n  <p>在视觉与工艺上，迈从也将细节拉满。在《凡人修仙传》中，最具有代表性的视觉符号就是剑阵，为了给玩家更沉浸的体验，迈从专门设计了镂空的键帽，就是为了在键盘开启后，底部的光芒能完美穿透键帽，呈现出完美的剑阵效果灯光。同时，键盘也配备了定制的RGB剑阵灯光，按压阵眼键时，光效会从中⼼向外发散，让剑阵的视觉与光效实现了完美的联动。</p>\n  <p>“谨慎行事”与“念头通达”两枚异形金属键帽，分别对应Backspace键和Enter键：前者呼应删除操作前的谨慎判断，后者对应确认后的念头通达，<strong>这些别出心裁的小巧思，让玩家在每一次敲击时，都能产生情绪代入与精神共鸣。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_4239310cb7ab4584bf679fd95a57f16f@19153231_oswg1227451oswg1080oswg1440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>在极具仪式感的设计之外，God 60也依然装备了业内顶尖的参数配置。</strong>它搭载了迈从自研的“天问方案”与神核引擎，配合磁悬浮轴体，实现了0.001mm调节精度、256K扫描率、16K回报率以及0.06ms极低延迟，保持着品牌一贯的电竞级硬核性能。</p>\n  <p>一直以来，迈从都主打为用户提供综合体验与定价匹配的高质价比产品。God 60延续了迈从对性能和实用体验的重视，并将过去在主流价位产品中形成的研发、设计和工程能力，进一步延伸至更高价值区间，加入更完整的审美与文化表达。</p>\n  <p><strong>一套组合拳下来，也完美诠释了迈从对God高端系列的定义——高性能、高完成度与高质价比，</strong>致力于在更高的价位段里，为消费者提供了一份融合了硬核性能、惊艳设计与深厚文化底蕴的综合体验。</p>\n  <h2><strong>这一把，高端局</strong></h2>\n  <p>长久以来，年轻人的桌面外设，似乎一直都被海外IP“占据”。</p>\n  <p>在电竞玩家的电脑桌上，出现的大多是漫威宇宙、高达机甲，或者是宝可梦。</p>\n  <p>God 60与《凡人修仙传》这次携手，干脆利落地打破了这个局面。它向市场展示了一次完美的双向奔赴，<strong>一边是自带庞大号召力的国漫IP，另一边是具有极高工程水准的国产外设，二者强强联手，将国风IP和硬核电竞做到了完美融合。</strong></p>\n  <p>对于迈从来说，这次联名既是一次破圈，也是一次“破局”。</p>\n  <p>��借着极具诚意的联名设计，迈从吸引的不光是电竞圈的玩家，也硬控了一波有电竞需求的《凡人修仙传》的粉丝，精巧的“青竹蜂云剑”剑匣与发光的“大庚剑阵”成功满足了用户体验，<strong>在每一次按键、插入、打开和替换中，玩家都能实打实地与那个修仙世界产生了奇妙的情感连接。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_bf3bb92b93f244c399f2d23dbea7987f@19153231_oswg127046oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ChinaJoy上体验God 60的玩家们</p>\n  <p>这波操作，也在年轻群体中刷足了好感度。对他们来说，<strong>键盘既是高频使用的工具，也可以承载性能体验、桌面审美和兴趣表达。</strong></p>\n  <p>迈从围绕年轻玩家对电竞性能、桌面空间和个性表达的需求进行产品定义，并通过God 60将性能体验与文化表达纳入同一套产品逻辑。这套产品能够落地，依赖的也不只是一次设计创意，而是迈从在多产品、多品类上长期积累的系统能力。</p>\n  <p>现在，迈从已经完全具备了覆盖技术研发、产品定义、结构工程、规模供应链协同以及高阶品牌审美表达的系统化能力。<strong>God 60的推出，也让外界对迈从的认知从“高质价比品牌”，蜕变为一个兼具极致性能、高完成度和文化底蕴的品牌。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_31896d3f07bb45ab8c3c4f012f7dddf4@19153231_oswg6706530oswg4037oswg2691_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p>对已经在主流价位形成稳定优势的迈从而言，进入高端市场意味着主动打破原有舒适圈。品牌需要面对更复杂的产品定义、更高的设计与工程标准，以及用户对稳定性、审美和品牌价值的综合检验。</p>\n  <p>这一步并非否定原有路径，而是将已经经过市场验证的能力推向要求更高的产品区间。<strong>所以迈从走向高端，绝对不等同于简单粗暴的全线涨价，更不是抛弃主流用户。恰恰相反，它是在原本坚固的地基上，盖起了更高的楼。</strong></p>\n  <p>那些曾在主流价位杀疯了的爆款产品，依然会像定海神针一样，牢牢守护着粉丝基本盘，持续扩大用户覆盖，建立并巩固消费者对迈从的绝对信任。而以God 60为代表的高端产品，则肩负着拉升品牌价值天花板，拓宽文化与审美边界的重任。<strong>二者互相补充，也拼出了一张更加健全、可持续的迈从生态蓝图。</strong></p>\n  <p>真正的品牌向上，从来都不是急于求成地靠某个热门IP进行短期包装，而是像迈从一样，甘于沉淀、厚积薄发。</p>\n  <p><strong>God 60的落地，意味着迈从的高端化已经具备了系统能力、产品载体、核心用户路径和更完整的价位段布局。</strong>而对于国产外设品牌来说，怎么打好这把“高端局”，也终于有了稳扎稳打且后劲十足的新解法。 &nbsp;</p>", "category": "tech", "published_at": "2026-08-04T09:38:53+00:00", "fetched_at": "2026-08-05T02:03:18.038322+00:00", "fingerprint": "7f2c259ca480f9fc"}, {"source": "36氪 - 最新文章", "title": "自研高性能分布式解决方案，「芯晓科技」将芯片电源签核周期从几周缩短至几天 | 水下项目", "url": "https://36kr.com/p/3925067918227591?f=rss", "summary": "<p>一枚先进制程芯片从设计、验证，到流片、制造，需要经过上百个环节。其中电源签核（Sign-off）是设计流程最后的、也最重要的一环，相当于建造一栋大楼时对全楼供电系统进行竣工验收。</p>\n  <p>具体来说，电源核签是通过对电源网络的上亿个节点进行整体分析，测试供电网络的功耗、电压降与电迁移等表现，从而决定芯片能否顺利进入量产流片。一旦结果出错，不仅导致芯片性能不达标，甚至会造成流片失败。</p>\n  <p>由于芯片电源网络是由大量金属线组成的互联结构，因此电源签核时必须将其作为一个整体进行分析，“相当于求解一个维度高达数亿的稀疏矩阵方程，完成一次需要大量时间。”「芯晓科技」总经理谢卓解释道。</p>\n  <p>而随着芯片工艺制程不断缩小，晶体管数量指数级增加，电源核签的周期被进一步不断拉长，一次完整的电源签核往往需要几周时间之久。如果分析结果不理想，设计工程师还需要根据反馈修改版图，再重复一轮电源签核。</p>\n  <p>针对这一行业痛点，芯晓科技运用分布式矩阵求解技术，打破电源核签效率制约芯片交付周期瓶颈。公司推出的首款数字电源签核工具“IcPower”，支持7nm等先进工艺，能满足百亿门级芯片电源，在典型测试用例中速度是国外大厂工具的4.5-8.5倍，目前已在国内多家芯片厂商的芯片设计环节投入使用。</p>\n  <h2><strong>1.采用分布式求解技术，提高电源核签效率3-10倍</strong></h2>\n  <p>谢卓在创办芯晓科技以前，曾任国际知名EDA厂商Cadence电源完整性分析工具Voltus的中国技术团队负责人。</p>\n  <p>据他介绍，分布式求解的核心技术思路，来源于计算数学领域的“区域分解法”，通过将电源核签的巨大矩阵拆分为许多可以高效计算的小矩阵，用多台计算机并行运算，从而缩短整体求解时间，每个分析工具在求解大规模问题时候都会采用类似方法，但难点在于各个工具求解的效率会参差不齐。</p>\n  <p>谢卓表示，难点同时集中在算法和工程两方面。</p>\n  <p>一是要切得“科学”，也就是针对电源网络稀疏矩阵的特性，采用基于图论的智能区域分解算法，将百亿级的全局矩阵科学地切分为多个子矩阵，最小化子矩阵间的边界耦合。</p>\n  <p>二是需要运用分布式矩阵求解器优化节点间的通信拓扑和消息传递机制，大幅降低分布式环境下的网络通信开销。在分布式切分求解过程中，还需要引入严格的数值稳定性控制算法，确保分布式计算与单机高精度求解器的结果，达到数学意义上的严格一致，从而满足先进制程严苛的签核精度要求。</p>\n  <p>芯晓科技正是凭借团队在算法和工程层面的技术积累和创新，使IcPower相比国外工具速度提升上3-5倍，“对于一些耗时特别长的动态分析，部分测试水平可以做到10倍以上的速度提升，以前需要跑几周的电源签核，IcPower几天就能完成。”谢卓表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_210c834470104dd991a6a16952f88525@5688585_oswg35555oswg1031oswg440_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">IcPower实测性能对比</p>\n  <h2><strong>2.抓住国产替代红利，致力于打造芯片设计平台</strong></h2>\n  <p>和许多近几年出现的EDA工具初创企业一样，芯晓科技切入电源签核赛道也是想抓住当下EDA行业“国产替代”的窗口期。</p>\n  <p>全球EDA市场长期被Synopsys（新思科技）、Cadence（楷登电子）、Siemens EDA（西门子EDA）三大巨头垄断。中国银河证券报告显示，三家在全球市场中的份额约为74%。而近年来不断升级的中美科技博弈，使越来越多国内芯片开始重视使用国产工具，将其作为替代或备份方案。</p>\n  <p>基于性能自信，芯晓科技在商业模式上选择对标国外工具，以软件授权为主，定价与国外工具相当。目前IcPower已在国内多家芯片设计公司投入使用，覆盖国产CPU、GPU、智驾芯片等类型，并在应用过程中借助客户的广泛设计用例与测试平台，不断迭代自身产品性能。</p>\n  <p>谢卓透露，2025年芯晓科技营收达到数百万元。“软件的研发成本基本是固定的，客户越多，盈利能力就能越强。”</p>\n  <p>但他也坦承，拓展客户是当下商业化的难点。“客户往往担心创业公司难以保证产品供应的持续性，因此首选规模更大的企业规模，虽然大公司在创新上的能力可能比不上创业公司。”</p>\n  <p>2026年下半年，芯晓科技计划开启天使轮后的新一轮融资，重点引入产业方资金，目的是在市场拓展方面获得更多帮助。</p>\n  <p>以华为提出的“韬（τ）定律”为代表，随着摩尔定律逐渐逼近物理极限，芯片行业正在从制程微缩转向纵向堆叠，这对电源核签来说意味着分析规模将呈指数级增长。</p>\n  <p>“底层技术积累越强，在这个方向上就越有竞争力。”谢卓表示，接下来芯晓科技的产品路线图也将围绕这一趋势展开，下半年将推出热分析和应力分析产品，支撑完整的热电耦合分析，帮助客户在3DIC设计早期发现芯片堆叠带来的发热和热应力问题。</p>\n  <p>此外，芯晓科技也在探索AI智能体在芯片设计中的应用，使客户通过自然语言就可以调用工具并完成各类设计任务，最终打造一个AI驱动，并能够接入其他EDA工具的芯片设计平台。</p>\n  <p>芯晓科技规划的这条路径最终能否走通，不仅取决于核心技术能否在更多场景中得到验证，还要看未来客户的规模化采购意愿，以及资本市场对公司发展潜力的持续信心。</p>", "category": "tech", "published_at": "2026-08-04T10:27:21+00:00", "fetched_at": "2026-08-05T02:03:18.038297+00:00", "fingerprint": "be708d6cab2e4885"}, {"source": "36氪 - 最新文章", "title": "“车企牌”电池相继上车，不只是PK宁德时代", "url": "https://36kr.com/p/3925382191708552?f=rss", "summary": "<p>“车企牌”电池正在不断涌现，并交付上车。鸿蒙智行推出了巨鲸电池，理想汽车推出了理想牌电池，不久前的7月30日晚，小米正式对外发布了龙甲电池。</p>\n  <p>车企正试图通过自有电池品牌，将电池的每个技术点攥在手中，并抢占用户心智。</p>\n  <p>这些汽车品牌的统一做法，就是“穿透式管理”，从电芯到电池包的技术和性能标准，车企全部主导定义，甚至部分参与电芯材料开发，并对核心供应链和生产制造环节全流程介入和监管。换句话说，“车企牌”电池是车企技术和标准的全面贯彻。</p>\n  <p>“甚至电池厂的核心岗位招聘，车企都要参与面试把关。”有行业人士透露。</p>\n  <p>这与过往的动力电池合作有着明显区别。据36氪了解，长期以来，头部动力电池公司如宁德时代等凭借技术实力，常常为车企供应相对成熟的系统级方案，尤其是旗舰类产品，如麒麟电池、神行电池等，车企能做的往往是提出需求，而定制开发的空间则相对有限。</p>\n  <p>但从“车企牌”电池的核心指标来看，车企往往有着更多的开发需要。比如巨鲸电池主打全温度周期的热防护标准，小米龙甲电池强调2000次循环和500J底部撞击标准等，理想汽车牌电池也追求“8年16万公里电池健康度不低于75%”，蔚来也提出过15年循环寿命的电池研发计划。</p>\n  <p>此外，动力电池做为电动汽车的心脏级零部件，常年占据30%成本结构，车企来把控电池开发和生产的全流程，从长期来看，也能确保供应链的稳定性和成本掌控力。</p>\n  <p>综合来看，车企对动力电池的全流程掌控需要，注定了“车企牌”电池今天开枝散叶的局面。</p>\n  <p>但与此同时，动力电池头部供应商宁德时代，也在竭力塑造消费者对宁德时代电池性能、安全性的认知。在机场、高铁站、商超等人群密集的地方，经常能看到“选电车看电池，认准宁德时代”的广告语。</p>\n  <p>据36氪了解，即便理想i6为欣旺达电池多给了两年延保，但售出的车型中，仍有超过一半的消费者选择了宁德时代电池。</p>\n  <p>因此，当车企试图将自有电池品牌推向台前时，经受过宁德时代“Intel Inside”战略洗礼的消费者，往往会提出这样的质疑——车企自研的电池包能否比得上宁德时代。</p>\n  <p>某种程度上，这似乎是个目前难有定论的问题。</p>\n  <p>不少电池行业人士对36氪表示，宁德时代的壁垒在于工艺管控能力、生产一致性。而且无论车企的自建产线，还是二三线电池厂商都很难在短时间内，追平宁德时代的这一优势，因为“一定要有足够大的生产体量，才能做有效的筛选和试错”。</p>\n  <p>通常情况下，更高的一致性，意味着更低的续航跳水、补能异常，甚至安全事故的概率。但车企自建的产线，和二三线电池厂的生产一致性水平，也可以通过增加测试工序等手段进行一定弥补。</p>\n  <p>而且，尽管在产品一致性上不及宁德时代，但“车企牌”电池亦有其优势。</p>\n  <p>36氪从一些行业人士处了解到，“车企牌”电池的产品定义、设计、生产通常由车企进行全方位管控，部分自研电池的车企，还会监督到电池的二三级子零件供应商，以确保最终的产品性能符合自己的高标准。</p>\n  <p>除此之外，车企对整车更为熟悉，因此“车企牌”电池的BMS算法，“在应用端可能比电池厂更好”。或许未来相当一段时间内，“车企牌”电池都会保持与宁德时代相持而行。</p>\n  <h3><strong>生产一致性，宁德时代的竞争壁垒</strong></h3>\n  <p>动力电池行业历经多年发展，动力电池技术、设备的成熟与普及，令各电池厂商间的技术代差逐渐拉齐。</p>\n  <p>电池产品间的竞争，越来越聚焦于生产的一致性。</p>\n  <p>许多行业人士都承认，宁德时代的电芯一致性，领先一众二三线电池厂。一个相对直观的体现是——“国内电芯，唯一不分档次的厂家就是宁德时代，因为都是一样的”。</p>\n  <p>“一致性不是那么好做的”。有行业人士告诉36氪，几乎所有的生产要素都会到动力电池的工艺控制，包括现场的湿度、温度、杂质、原材料选用等。</p>\n  <p>而电池厂商“一定要有足够大的生产体量，才能做有效的筛选和试错”。因而短期内，二三线电池厂商的生产一致性，很难赶上宁德时代。</p>\n  <p>而一致性之所以重要，是因为它能够直接影响到电池包的容量，甚至有可能引发安全事故。有电池行业人士表示，即便是行业公认更具本征安全的磷酸铁锂电池包，同样强调生产的一致性。</p>\n  <p>评估生产一致性的直接指标，是压差、内阻差异、尺寸差异等。</p>\n  <p>有行业人士举了个例子解释压差对电池包容量的影响：“原本电池包按100度电的容量去设计，但如果其中有颗电芯的电压只能达到98度，那BMS的均衡策略，会在充电时，把其余100度电芯的那两度电，变成热能消耗掉，从而将所有电芯控制在98度的电压范围之内。这就会造成，电池包的实际容量达不到100度的设计目标。”</p>\n  <p>36氪了解到，目前行业内动力电池的BMS策略，多为被动均衡，它能起到上述的“削峰”的作用，却难以“填谷”，——将100度电芯的电量，输送给98度的电芯。</p>\n  <p>“填谷”需要主动均衡的BMS策略，但这项技术的成本远超被动均衡的BMS策略，因此行业里少有企业采用。</p>\n  <p>一位行业人士举了商用车行业的例子：“一套商用车的主动均衡，报价约2万元，而且有价无市。主动均衡的BMS主要用在钛酸锂电池上，因为超大倍率放电，压差太大，加上钛酸锂能量密度本就低。”</p>\n  <p>这也就意味着，由于电芯一致性导致的电池包容量衰减，很难通过Pack层级的BMS策略去平抑。</p>\n  <p>电池包容量衰减，体现在整车上就是续航跳水、补能异常。但电芯一致性给电池包带来的影响还不止于此，有行业人士表示，它还会造成安全隐患。</p>\n  <p>“假如电池包容量跳水30%还在服役，那就很容易过充过放，过充过放的下一步就是起火。”有电池人士对36氪强调，即使是材料体系更为安全的磷酸铁锂，也遵循这一理论。</p>\n  <p>也有电池行业人士指出，生产一致性对电池包性能和寿命的影响，具体会达到什么程度，“这是一个概率问题”。</p>\n  <p>“这涉及到企业评估电池包可靠性的能力。”一位电池工程师表示，“压差到多少程度是可接受的，这需要通过大量统计数据计算。不过部分车企没有那么多数据样本，只能通过模型推理，而模型的精度又考验着企业员工的水平。”</p>\n  <p>他举例说：“假如A车企认为，压差在100毫伏的失效概率是10%，B车企认为100毫伏压差的失效概率是1%，那么基于这个判断，B车企会让电池包继续服役、企业继续监控，A车企则可能更换电池包，更换后的电池包压差只有10毫伏，电池包寿命自然也会延长。也有些车企会通过远程OTA，限制电池包的使用区间，也能够降低电池包失效风险。”</p>\n  <h3><strong>“车企牌”电池如何缩小差距</strong></h3>\n  <p>尽管宁德时代在生产一致性上，保持领先身位，但“车企牌”电池对一致性的重点盯防，希望努力缩小它们与宁德时代产品之间的差距。</p>\n  <p>一家参与自研电池项目的人士告诉36氪，他所在的车企用了很多强筛查手段，去追赶提升电芯品质。</p>\n  <p>他为36氪举了很多例子：“比如用来去除原材料中金属异物的除瓷工艺，行业里通常做两道，我们做四道。”</p>\n  <p>“用来筛查电芯一致性的降压测试，行业通常只做两三次，我们也做四次。”</p>\n  <p>36氪还从一些电池行业人士处了解到，X-ray（X光）检测也是电池厂提升品质的手段之一。</p>\n  <p>一些电池行业人士告诉36氪，X-ray的作用，就是穿透钢壳、铝壳，以及外层的极片，观察是否有极片、隔膜弯折，也能够检测出电池包内叠片或卷绕的结构性缺陷。“比如卷绕出的电芯，不是一个正常圆柱体，X-ray都可以看出来。”</p>\n  <p>据36氪了解，目前宁德时代、远景动力、欣旺达等厂商，都已采用X-ray检测工序来提升制造管控能力。</p>\n  <p>有欣旺达人士对36氪表示：“欣旺达试产线上的电芯，每颗都会经历X-ray检测，每条量产产线上也都会大量使用X ray，可能是每多少颗电芯测一颗，也可能是所有电芯都测。”</p>\n  <p>不过，需要注意的是，一些电池行业人士认为，X-ray究竟能在多大程度上弥补电芯的一致性，仍取决于电池厂商的能力。</p>\n  <p>X-ray能够呈现显性的表征，但如何通过这些判断一致性的风险概率，这也会因电池厂的能力而异。</p>\n  <p>或许，二三线电池厂的电芯级能力，还需要相当一段时间追赶到头部水平，但这并不能简单等同于，“车企牌”电池一定不如宁德时代。</p>\n  <h3><strong>全流程管控，“车企牌”电池的优势</strong></h3>\n  <p>36氪了解到，车企从宁德时代采购整包电池，宁德时代给的是个类似“灰盒”的方案。</p>\n  <p>部分行业人士表示，电芯工艺、材料配方，宁德时代通常是保密的，生产现场的管控车企也难以过多参与。</p>\n  <p>有蔚来工程师对36氪称：“宁德时代几乎什么都不给。”这在一定程度上，印证了宁德时代开放程度较低。有电池行业人士表示，宁德时代会开放给车企的，“主要是一些基本电芯下线测试数据，比如容量、电压、内阻等”。也有电池工程师表示，数模释放、冷板流道等，车企也能看到。</p>\n  <p>这意味着，车企很难深度参与电池包的全流程管理，电池的质量、性能几乎只能依赖宁德时代的管理。</p>\n  <p>但宁德时代的管理，未必总是优于车企。一家头部车企的电池人士告诉36氪，就他们内部测试的结果而言，宁德时代的一些长期性能指标参数，有时可能并非行业最优。</p>\n  <p>他解释：“宁德时代更早摸清了材料的安全边界，所以敢于把边界压得比较极限。”由此引发了这家车企内部的博弈——品牌端希望搭载宁德时代产品，研发端则持反对意见。</p>\n  <p>反之，“车企牌”电池，车企则能够对电池包的设计、开发、生产进行全方位、无死角的管控。理想牌电池正是一个鲜明的案例。</p>\n  <p>有接近理想的行业人士告诉36氪，理想和欣旺达的合作中，“基本上全是理想在操刀，欣旺达是配合。理想电芯开发、材料的人都有，理想牌电池几乎就是理想设计的，欣旺达更多的是扮演代工方的角色”。</p>\n  <p>理想还曾为这个项目，专门招了十来个电芯开发的人员。36氪从部分行业人士处了解到，直到去年，理想在电池上投入的总人员规模，约为300多人。</p>\n  <p>或许也正得益于，理想对理想牌电池的全方位管控，部分理想人士对36氪表示，从售后数据来看，理想牌电池的失效率和宁德时代差不多，个别月份，理想牌电池的失效率甚至低于宁德时代。</p>\n  <p>鸿蒙智行的巨鲸电池也采用全方位管控的思路，以控制产品质量。</p>\n  <p>36氪曾报道过，巨鲸电池是华为的电池开发标准，对外是华为电池品牌。巨鲸电池的开发标准比行业普遍标准都高，“比如高温热失控实验，华为的要求是，在电池包、整车、周边环境都很热，电量又约为100%的情况下，电池包热失控后不会爆炸。很少有比这更严苛的了”。</p>\n  <p>部分接近鸿蒙智行的行业人士表示：“华为从化学体系到原材、工艺、下线检测都会参与。但他们人手相对有限，所以更多的是监督和验证可靠性，有时候可能不会特别深入地参与电芯研发。”但华为这套严格的准入标准，仍能为巨鲸电池的安全性带来一定保障。</p>\n  <p>7月30日晚，小米汽车技术发布会上，小米集团董事长雷军发布龙甲电池时介绍，这是一套由小米主导的动力电池系统化解决方案，由小米负责产品定义、主导电池包设计开发、参与电芯设计开发、进行全流程质量管控。</p>\n  <p>36氪从部分接近小米的行业人士处了解到，小米为了保证自研电池的性能，“找了很多好的SQE一把手来教自己的员工”，去年小米在电池上投入的人力约为100多人，“其中大部分是BMS的人”，小米也在招聘系统设计相关的人，“因为他后面要做很多工业化的东西”，也在逐步补齐自己的电芯能力。</p>\n  <p>和巨鲸电池一样，龙甲电池的安全标准也相对苛刻。雷军在发布会表示：“龙甲电池安全标准超过国标。”比如其中，”500J底部撞击电池功能不失效”这项，许多行业人士认为“这是比较高的标准”，国标要求的是150J底部撞击后，不泄露、不起火、不爆炸。</p>\n  <p>还有行业人士透露，部分自研电池的车企，还会追溯到电池的二三级供应链，比如正负极材料上，制定筛选材料标准。同时车企也会对二三线电池厂的一致性，制定相当于宁德时代的要求。</p>\n  <p>“甚至包括箱体上的盖板等，有质量不达标的，车企的工程师会帮助这些供应商做人员培训、产线改造、质量提升，确保它们的材料能符合车企的标准，这是过去行业里很少有人做的”。</p>\n  <p>“车企牌”电池的另一个优势在于，主机厂的BMS团队，“在应用层做得可能更好，因为控制器之间是有交互的，而主机厂更懂车”。</p>\n  <p>短时间内，汽车行业的动力电池供应，或将分化为两种路线，一种是以宁德为主的高集成式供应，而更多的二三线电池厂商，则会成为“车企牌”电池模式下，被全流程管控的、类似ODM的角色。</p>\n  <p>但是当车企带领电池厂，将能力逐步提升，并且获得消费者认可，龙头公司能做的无疑是进一步开放，并且跟随和融入车企的标准和开发体系，这也正是“车企牌”电池推出的核心初衷：不是为了斗争，而是实现更高的技术和性能标准，推动行业进入更健康的发展轨道。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_05fe80f2256f47eb99556bf2af5ccebe@6215398_oswg24302oswg430oswg430_img_000?x-oss-process=image/format,jpg/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">作者微信：luckg17305264638</p>", "category": "tech", "published_at": "2026-08-04T15:46:22+00:00", "fetched_at": "2026-08-05T02:03:18.038289+00:00", "fingerprint": "46442eb35e03491e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨马斯克个人财富亏掉2个“黄仁勋”；上海雪花膏母公司破产；日本半导体或面临断供", "url": "https://36kr.com/p/3925868626360706?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>一架上海飞东京航班险撞机，两机垂直高度差仅约20米</p>\n  <p>阿里云容器服务Agent开启商业化收费</p>\n  <p>今年以来港股IPO数量同比增长132%，科技类公司占比过半</p>\n  <p>苹果新任CEO据悉邀请已退休的硬件部门负责人加入管理团队</p>\n  <p>SpaceX上市后首份财报前夕，“木头姐”持续加仓</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>马斯克个人财富缩水约合人民币2.45万亿元，相当于亏掉2个“黄仁勋”&nbsp;</strong></p>\n  <p>据微信公众号“福布斯”消息，6月12日SpaceX上市，马斯克成为全球首位万亿富豪。但他13位数字的身家并未维保持多久——SpaceX的股价此前一路飞升，如今却跌回地表，马斯克在7月单月财富缩水3630亿美元（约合人民币2.45万亿元），创下纪录。这一缩水幅度，甚至超过了全球第2至第10大富豪中任何一人的全部身家，是英伟达CEO黄仁勋身家（1740亿美元）的两倍多。截至美国东部时间8月1日零点，排名第2的拉里·佩奇身家微增10亿美元，约为2920亿美元；而马斯克的身家约为6900亿美元，降至去年12月以来的最低水平。（红星新闻）</p>\n  <p><strong>上海雪花膏母公司破产，财产不足以支付破产费</strong></p>\n  <p>近日，上海市浦东新区人民法院出具（2024）沪0115破151号民事裁定书，宣告上海美兰化妆品有限公司（以下简称“美兰”）破产并终结清算程序。裁定书援引《企业破产法》第四十三条认为，企业现有财产不足以支付破产费用，管理人提请法院直接终止清算，普通债权人无财产可分配。</p>\n  <p>据裁定书配套管理人清算数据，美兰可处置资产仅9.58万元，法院确认债权总额1941.67万元，账面资产连诉讼费、管理人报酬等基础办案成本都无法覆盖。这家诞生于1984年、依靠老上海雪花膏走红的本土老牌日化企业彻底退场。（红星新闻）</p>\n  <p><strong>受地震影响，日本半导体或面临断供</strong></p>\n  <p>7月28日，日本熊本县发生强震，多家半导体相关企业停产至今。九州地区因聚集大量半导体相关企业被称为“硅岛”，熊本县自1970年前后开始吸引半导体企业落户，逐步发展成为日本重要的半导体产业基地。</p>\n  <p>熊本县内聚集着大量半导体相关企业和汽车工厂，有专家表示强震将给相关产业带来严重冲击。不仅是半导体，受零部件供应延迟影响，日本部分汽车制造商的生产也已受到波及。丰田汽车已决定暂停福冈县3家工厂的生产至8月5日，位于爱知县的田原工厂也将于8月3日至7日停产。本田宣布，熊本县大津町的摩托车工厂将停产至8月7日。日产汽车则决定，将福冈县两家工厂的部分生产线停工至8月5日。（金融界、央视网）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>面壁智能开源全球首个Stencil优化AI系统</strong></p>\n  <p>36氪获悉，8月4日，面壁智能联合OpenBMB开源社区正式发布并开源全球首个Stencil（模板计算）优化“自动研究+自动部署”大闭环AI系统ForgeStencil。实测数据显示，ForgeStencil在同精度（fp32）下几何平均加速2.35倍，混合精度下额外提速1.95倍。在真实应用场景中，通用CAE求解器hypre加速3.86倍，电磁仿真FDTD加速2.47倍，核反应堆中子学计算minisweep加速最高达5.78倍。</p>\n  <p><strong>阿里云容器服务Agent开启商业化收费</strong></p>\n  <p>36氪获悉，阿里云宣布，容器服务Agent将于北京时间9月3日10时增加新的技能中心和IM频道等功能并开启商业化收费。本次调整后，相关对话、自主智能运维及定时任务等功能将开始收费。调整过程不会影响存量用户已有设置和历史任务记录。容器服务Agent以积分（Credit）作为计量单位，免费开通，支持按量付费及预付费资源包抵扣。使用容器服务Agent的对话、自主智能运维及定时任务等功能时产生的模型资源消耗会折算为积分进行计费。</p>\n  <p><strong>腾讯混元发布最新语音识别模型Hy ASR 3.0 preview</strong></p>\n  <p>36氪获悉，腾讯混元正式发布新一代语音识别模型Hy ASR 3.0 preview。在开源评测集中，Hy ASR 3.0 preview在多语种的WER（Word Error Rate,词错误率）上都控制在3%左右，其中中文普通话WER 3.34%、英语WER 2.62%、粤语WER 3.12%。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>一架上海飞东京航班险撞机，两机垂直高度差仅约20米</strong></p>\n  <p>8月4日清晨5时44分左右，一架全日空航班在东京羽田机场上空临近降落时，与一架名为“白博士”的日本政府飞行检查飞机险些相撞。“空中防撞系统（TCAS）”启动，避免了飞机碰撞。当时试图降落的飞机是由上海出发、飞往羽田机场的NH968航班，机上共有197名机组人员和乘客。根据飞行轨迹数据显示，当时两机垂直高度差仅约20米，存在极高碰撞风险。全日空航班机组收到TCAS防撞系统告警后立刻执行复飞操作进行避让，现场管制人员随即向日本检查机机组发出严厉问询：“没看到正在降落的航班吗？”全日空已将此事报告给日本国土交通省。（新民晚报）</p>\n  <p><strong>申通快递：终止发行可转债并撤回申请文件</strong></p>\n  <p>36氪获悉，申通快递公告，公司董事会审议通过《关于终止向不特定对象发行可转换公司债券事项并撤回申请文件的议案》。目前公司各项业务经营情况稳定，本次终止向不特定对象发行可转换公司债券事项不会对公司的经营活动及财务稳定性造成重大不利影响。敬请投资者理性投资，注意投资风险。</p>\n  <p><strong>美股三大指数集体收涨，光通信、存储板块集体上涨</strong></p>\n  <p>36氪获悉，8月4日收盘，美股三大指数集体上涨，纳指涨2.59%，标普500指数涨1.79%，道指涨1.71%。光通信、存储板块集体上涨，迈威尔科技涨超12%，英特尔、闪迪涨超10%，康宁涨超9%，Lumentum、SK海力士涨超8%，美光科技涨超7%。大型科技股多数上涨，英伟达涨超2%，谷歌、苹果、特斯拉、微软涨超1%；亚马逊跌超2%，Meta小幅下跌。热门中概股多数下跌，小鹏集团跌超2%，理想汽车、蔚来、哔哩哔哩跌超1%，京东、百度小幅下跌；阿里巴巴涨超1%，拼多多涨近1%。</p>\n  <p><strong>苹果：由于Telegram上内容违反了相关指南，曾短暂将其从App Store下架</strong></p>\n  <p>苹果表示，在审查发现Telegram即时通讯应用中存在违反其“禁止儿童性虐待内容”准则的内容后，曾短暂将其从App Store下架。该公司表示，在“开发者迅速删除了相关内容并封禁了发布该内容的用户”后，已恢复该应用的上架。（新浪财经）</p>\n  <p><strong>麦当劳宣布更换美国业务总裁</strong></p>\n  <p>麦当劳8月4日宣布，在公司拥有超26年工作经验的Skye Anderson出任麦当劳美国总裁，即日起生效，接替已掌管麦当劳美国业务近7年的Joe Erlinger。麦当劳当日公布财报显示，二季度美国市场同店销售额增长0.8%，为2025年年初以来最慢增速。（界面新闻）</p>\n  <p><strong>今年以来港股IPO数量同比增长132%，科技类公司占比过半</strong></p>\n  <p>据Wind数据统计，截至8月3日，今年以来，已经有102家公司成功登陆港股市场，同比增长132%；募资总额约3260亿港元，同比增幅超153%。在年内上市的港股公司中，科技类公司占比超过一半，且“A+H”公司达32家。（21世纪经济报道）</p>\n  <p><strong>7月韩国股市出现历史性暴跌，韩股崩盘后散户失去信心</strong></p>\n  <p>7月韩国股市出现历史性暴跌，KOSPI指数单月重挫22%，创下金融危机以来最大月度跌幅，月内四度触发熔断。尽管月末大盘迎来18%的强势反弹，但散户在反弹当日依旧创纪录净卖出股票，市场信心并未得到修复。</p>\n  <p>此前不少韩国散户受追涨情绪影响，借助政府推出的单股杠杆ETF加杠杆，大举买入三星、SK海力士等AI概念股，5‑6月累计买入规模折合542亿美元，在7月的剧烈震荡中损失惨重。不少投资者心态崩塌，甚至表态不再参与韩股。分析人士提醒，市场去杠杆化短期难以结束，科技与半导体板块的震荡行情或将持续数月，本次崩盘已经深刻改变韩国散户的投资心理。（新浪证券）</p>\n  <p><strong>《智能网联汽车 自动驾驶系统安全要求》强制性国家标准正式发布</strong></p>\n  <p>36氪获悉，据工信部网站，7月30日，工业和信息化部组织制定并归口的《智能网联汽车 自动驾驶系统安全要求》（GB 44721—2026）强制性国家标准由国家市场监督管理总局、国家标准化管理委员会批准发布，拟于2027年7月1日起正式实施。《智能网联汽车 自动驾驶系统安全要求》适用于搭载L3级、L4级（高度自动驾驶）系统的M类和N类车辆，不适用于自动泊车系统。该标准立足中国产业发展与行业监管实际需求，兼顾技术可行性、产业适配性与落地实操性，构建了维度完整、要求清晰、适配国情的安全要求体系。</p>\n  <p><strong>央行将开展5000亿元买断式逆回购操作</strong></p>\n  <p>36氪获悉，为保持银行体系流动性充裕，2026年8月5日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为3个月（92天），到期日为2026年11月5日（遇节假日顺延）。</p>\n  <p><strong>日本央行账户数据显示，无明确迹象表明周一大规模干预汇市</strong></p>\n  <p>据报道，根据对日本央行账户的分析，没有明确迹象显示8月3日进行大规模汇市干预。4日公布的日本央行账户与货币经纪商的预测相比存在约8800亿日元差异，这表明周一可能进行小规模干预，但未提供确凿证据。早前数据显示，日本上周四可能投入8.45万亿日元支撑汇市，上周五又投入5.33万亿日元，与美国联合行动干预汇市。（界面新闻）</p>\n  <p><strong>苹果新任CEO据悉邀请已退休的硬件部门负责人加入管理团队</strong></p>\n  <p>据报道，苹果公司即将上任的首席执行官约翰·特纳斯（John Ternus）正将一位曾在自己负责硬件工程期间共事过的得力助手重新招致麾下，加入其新的管理团队。报道称，特纳斯已聘请劳拉·莱格罗斯加入团队，莱格罗斯此前曾担任硬件工程副总裁，直至2022年退休。（财联社）</p>\n  <p><strong>IDC：2025年中国外骨骼机器人市场规模超16亿元，出货量约2.6万台</strong></p>\n  <p>36氪获悉，国际数据公司（IDC）发布《中国外骨骼机器人市场份额，2025》研究报告显示，2025年中国外骨骼机器人市场规模超过16亿元，出货量约2.6万台。其中，医疗康复市场仍占据主要市场价值，消费助力市场则贡献了七成以上出货量，行业应用持续拓展新的增长空间。</p>\n  <p><strong>印尼财长：印尼将出台刺激政策提振电动车销量</strong></p>\n  <p>印尼财政部长普尔巴亚・尤迪・萨德瓦周二在一场车展活动上表示，印尼政府将于未来数周推出相关举措，推动电动自行车等各类电动汽车消费。普尔巴亚称，这套刺激方案计划覆盖50万辆电动摩托车，将由印尼总统普拉博沃・苏比安托在两三周内正式公布。（新浪财经）</p>\n  <p><strong>韩国赴华游客数量持续增长</strong></p>\n  <p>韩国政府最新统计数据显示，今年1月至6月，韩国访华人数约171.4万人次，较去年同期增长16%。韩国业界普遍认为，中国是“距离近、体验好的海外旅游目的地”，预计2026年全年韩国赴华游客人数将继续保持增长。据韩国《东亚日报》报道，中国正作为“高性价比旅游目的地”受到韩国游客关注，赴华旅游产品持续扩容。特别是中国自2024年11月起对韩国公民实行最长30天免签入境政策，让韩国游客节省签证办理等相关费用，大幅降低出行成本。（财联社）</p>\n  <p><strong>SpaceX上市后首份财报前夕，“木头姐”持续加仓</strong></p>\n  <p>凯茜・伍德在7月最后一周加码布局其最为看好的投资赛道，将SpaceX列为头号买入标的，通过四只基金合计买入约2600万美元。除此之外，伍德在CoreWeave股价回调后，斥资1550万美元购入该股，同时增持价值1430万美元的特斯拉股票。（新浪财经）</p>\n  <p><strong>广告技术公司Teads在纽约法院起诉Google和Alphabet</strong></p>\n  <p>当地时间8月3日，广告技术公司Teads向美国纽约南区联邦地区法院对Google和Alphabet提起诉讼，寻求经济损失赔偿及其他救济措施。该诉��是在美国弗吉尼亚东区联邦地区法院裁定Google在特定广告技术市场存在“非法反竞争行为”之后提出的。（界面新闻）</p>\n  <p><strong>全美25州提起诉讼，反对美政府最新关税措施</strong></p>\n  <p>当地时间8月3日获悉，法庭文件显示，美国有25个州提起诉讼，反对美政府最新关税措施。美国纽约州总检察长宣布，由民主党人领导的25个美国州于当日提起诉讼，起诉美国政府。这些州主张，总统针对来自60个贸易伙伴的商品征收最新一轮关税的举措，超出了其对进口商品征税的法定权限。总检察长称，最新关税只是为了替代那些已被美国最高法院否决的关税措施。新关税范围宽泛得不合法，且绕过了法律规定的针对特定国家的调查程序。（央视新闻）</p>\n  <p><strong>蚂蚁阿福辟谣负责人调整：假消息</strong></p>\n  <p>36氪获悉，蚂蚁阿福官博发文辟谣称，网传“蚂蚁阿福1号位伟鹤调整”为假消息。</p>\n  <p><strong>追凉航线订单暴涨500%</strong></p>\n  <p>2026年民航暑运已过半程，今年暑运市场呈现“启动偏晚、后期旺盛”的特征。近期全国多地持续高温，不少旅客纷纷调整出行计划，将目光投向了自带天然“空调”属性的目的地。数据显示，七月以来“避暑纳凉”“夜游”相关关键词的搜索量环比增长238%。记者查询发现，截至目前，今年暑期机票预订量增幅最高的20条航线中，有近半数属于“追凉航线”。其中，芜湖至贵阳增长5倍。此外，郑州至芒市、广州至延吉的航线增幅均超3倍，惠州至太原航线机票预订量增长2.4倍。（央视财经）</p>\n  <p><strong>英伟达、思科、CrowdStrike等企业推动起草AI网络安全指南</strong></p>\n  <p>据英伟达8月4日声明，Linux基金会发布关于“共享AI发现交换”（SAFE）的征求意见稿。据介绍，SAFE是一套拟议指南，旨在将涉及AI智能体的网络安全事件转化为整个生态系统的共享防护能力。声明称，“开放安全AI联盟”的一个工作组正负责起草SAFE指南。英伟达、思科、CrowdStrike、Hugging Face和Red Hat等联盟成员正与Linux基金会合作，共同推进这一初步提案。（界面新闻）</p>\n  <h2>上市进行时</h2>\n  <p><strong>具身智能初创公司智平方据悉考虑明年在香港上市</strong></p>\n  <p>具身智能初创公司智平方据悉考虑明年在香港上市。（财联社）</p>\n  <p><strong>消息人士称Shein拟八月份在香港进行首次公开募股</strong></p>\n  <p>消息人士称，Shein拟八月份在香港进行首次公开募股，目标估值为300亿至400亿美元。（新浪财经）</p>\n  <p><strong>嘉立创上市</strong></p>\n  <p>8月4日，嘉立创登陆A股。早盘集合竞价嘉立创上涨177.47%，最新市值为1302亿元，报234.35元/股，与发行价84.46元/股相比，中一签开盘即可赚74945元，当日收盘价为208.01元/股。值得一提的是，嘉立创是A股今年以来发行价第二高的新股，仅次于科创板新股恒运昌（发行价为92.18元/股）。(中国证券报)</p>\n  <h2>大公司财报</h2>\n  <p><strong>软银公司第一财季净利润1500.7亿日元，低于市场预期</strong></p>\n  <p>8月4日，软银公司公布2027财年第一季度业绩报告。公司第一财季净销售额为1.81万亿日元，预估为1.76万亿日元；营业利润为3023.0亿日元，预估为2755.4亿日元；净利润为1500.7亿日元，预估为1525.2亿日元。软银仍预计2027财年全年净销售额为7.50万亿日元，营业利润为1.10万亿日元，净利润为5600.0亿日元，股息为8.80日元。（界面新闻）</p>\n  <p><strong>AMD二季度营收115.36亿美元，同比增长50%</strong></p>\n  <p>当地时间8月4日，AMD公布了截至2026年第二季度的财务业绩。公司当季实现总营收115.36亿美元，同比增长50%，刷新单季度营收历史纪录。在GAAP准则下，净利润达22.97亿美元，同比增长163%；稀释后每股收益（EPS）为1.38美元。在Non-GAAP准则下，净利润为27.60亿美元，同比增长253%；每股收益为1.66美元，高于市场分析师预期。数据中心业务成为绝对的核心增长引擎，二季度营收达67.2亿美元，同比暴增107%，占公司总营收的58%。（界面新闻）</p>\n  <p><strong>SpaceX发布上市后首份财报：营收78.14亿美元，同比增长92%</strong></p>\n  <p>36氪获悉，SpaceX发布2026年第二季度财报，这是该公司上市后发布的首份财报。财报显示，SpaceX第二季度营收78.14亿美元，较上年同期的40.71亿美元增长92%；净亏损5.41亿美元，较上年同期的净亏损10.08亿美元收窄46%。</p>\n  <p><strong>汇丰控股：上半年收入377.42亿美元，同比增11%</strong></p>\n  <p>36氪获悉，汇丰控股公告，2026年上半年列账基准除税前利润195.22亿美元，较2025年上半年的158.1亿美元增加37亿美元，增幅为23%。除税后利润153.21亿美元，同比增23%。收入377.42亿美元，同比增11%。净利息收益率为1.61%，较2025年上半年上升4个基点。董事会已通过派发第二次股息每股0.1美元，并有意启动最多10亿美元的股份回购。</p>\n  <p><strong>英国石油公司第二季度调整后净利润57.3亿美元，高于市场预期</strong></p>\n  <p>8月4日，英国石油公司公布第二季度业绩报告。公司第二季度调整后息税前利润为103.1亿美元，预估为92.5亿美元；调整后净利润为57.3亿美元，预估为50.1亿美元；调整后每股收益为0.3692美元，预估为0.33美元。（界面新闻）</p>\n  <p><strong>Grab二季度净利大增620%，上调全年盈利预期</strong></p>\n  <p>Grab公布二季度净利同比大增620%至2.52亿美元；二季度营收从去年同期的8.19亿美元增至9.97亿美元，高于分析师预期的9.91亿美元，增长主要得益于配送、出行和金融服务业务营收增长。Grab预计2026年全年营收将介于41亿美元至41.5亿美元，高于此前预测的40.4亿美元至41亿美元。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“木木西里”完成数千万元B轮融资</strong></p>\n  <p>36氪获悉，近日，南京木木西里科技有限公司宣布完成数千万元B轮融资。本次融资由华瑞集团领投，中盛汇普、巨石资本、江宁经开资本共同跟投。本次募集资金将重点用于核心技术持续研发、生产产线扩建，进一步提升国产高端光学检测仪器研发与规模化交付能力。</p>\n  <p><strong>网络安全初创公司Horizon3.ai融资2.5亿美元</strong></p>\n  <p>总部位于旧金山的提供道德黑客雇佣服务的Horizon3.ai在后期融资中筹集了2.5亿美元。本轮融资由NightDragon和NEA共同领投，这两家机构均曾参与早期融资，此外还有十多家新老投资者参投。Anthropic的Mythos和其他前沿人工智能（AI）模型让网络攻击威力大增，引发了企业界的担忧浪潮，该公司希望借此势头实现发展。（新浪财经）</p>\n  <h2>酷产品</h2>\n  <p><strong>三星探索内存新技术：垂直堆叠于AI加速器之上，密度超传统HBM5十倍</strong></p>\n  <p>金十数据8月5日讯，美东时间8月4日，三星电子在美国加州圣克拉拉举行的未来存储与内存大会(FMS)上推出其V10Bonding V-NAND，即BV-NAND原型产品。该芯片拥有超过400层结构，并采用全新的晶圆键合架构，以提高存储密度并增强性能。三星表示，其BV-NAND技术较上一代V9 NAND将存储密度提高约58%，同时提升读取、写入以及输入/输出性能，以满足人工智能系统对更高容量、更高能效存储解决方案日益增长的需求。三星还展示了其称业界首款zHBM和ZNAND-O架构概念模型。该技术通过垂直堆叠存储单元，在更小空间内存储更多数据。不同于传统HBM与AI处理器并列封装的方式，三星的zHBM会将存储垂直堆叠于AI加速器之上，以缩短数据传输距离，提高带宽,同时提升能源效率。三星表示，其晶圆键合技术有望实现超过传统HBM5内存10倍的存储密度，同时将能源效率提高3倍，并将热阻降低一半以上。（金十数据）</p>\n  <h2>AI图谱</h2>\n  <p><strong>AI图谱，带你解读最新最快的AI资讯。</strong>机器人复刻人类触觉手感难度颇高，相关技术仍存不少难关。</p>\n  <p><strong>恋爱“越界行为”小调查</strong></p>\n  <p>在一段亲密关系中，人能完整地做自己吗？是否应该划清一条明确的“边界”？</p>\n  <p>很多伴侣间矛盾的根源，都是没对齐彼此的边界底线：对象的手机能不能看；想要独处空间有没有错；和异性朋友单独见面该不该报备；面对性行为时出现犹豫，是否该及时叫停……欢迎扫描下方二维码，告诉我们：你在亲密关系中保留自我的“边界感”在哪里？又会在哪一刻意识到，对方越界了？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260805/v2_8585f418b5cc4308a8ae0c970a1450f4@5667365_oswg11960oswg195oswg183_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫描二维码参与小调查</p>\n  <p>扫描下方二维码<strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-08-05T00:02:59+00:00", "fetched_at": "2026-08-05T02:03:18.038275+00:00", "fingerprint": "88584bfd7a23d6f5"}, {"source": "少数派", "title": "角落新声｜成年的快乐，是可以将角落铺满全家", "url": "https://sspai.com/post/112738", "summary": "我理解中的角落，不是电影里那种阴暗逼仄、藏着邪恶与不堪的地方，而是生活中时间与现实的锚点。<a href=\"https://sspai.com/post/112738\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-04T02:59:26+00:00", "fetched_at": "2026-08-05T02:03:16.377550+00:00", "fingerprint": "c7de0fdeca01eb7e"}, {"source": "少数派", "title": "社区速递 152 | 派友的固定回购清单、治愈系果壳风铃与超轻薄迷你风扇", "url": "https://sspai.com/post/113060", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/113060\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-04T09:00:00+00:00", "fetched_at": "2026-08-05T02:03:16.377544+00:00", "fingerprint": "eda4ea94e90d3595"}, {"source": "少数派", "title": "家庭饮品 DIY 指南（三）：常用固体物料推荐", "url": "ht 技术负责人，拥有多年AI GPU/NPU/Switch/硅光芯片的架构设计经验。首席科学家Craig Peterson是英特尔微电子中心总经理，在英特尔拥有多年的工作经历，参与设计了三款处理器、八代芯片组。</p>\n  <p>随着生成式AI与大模型训练需求的爆发，算力集群的规模正在经历前所未有的指数级增长，传输速率迈向1.6T乃至3.2T。这意味着，传统的信号调制方式面临着高功耗、热流密度集中以及较高的物理链路闪断风险，传统基于可插拔光模块的电传输网络正在触及物理天花板。为了打破其中的供需差，将光引擎与计算芯片或交换芯片进行深度集成，即从可插拔模式走向CPO乃至OIO已成为业界公认的通往超高速率光互连的唯一路径。</p>\n  <p>据LightCounting/Yole预测，CPO将率先在未来几年迎来爆发，而最终渗透进每一颗高端GPU/CPU的OIO更是蕴含着千亿美元级别的潜在市场。量引科技则从作为CPO与OIO的核心器件微环调制器（也称“MRM”）为切口进入这一高门槛赛道。</p>\n  <p>相较于传统的EML或MZM调制方案，MRM具有微米级的极小物理尺寸与低至1V的驱动电压，能够天生适配高密度的先进封装并显著降低系统能耗。在此基础上，量引科技构建了基于自研单通道200G MRM的1.6T及更高速率的硅基光芯片。</p>\n  <p>同时，公司正着手布局匹配下一代互连架构的CPO方案以及面向芯片级互连的Optical I/O Chiplets产品。其方案旨在大幅缩短电传输距离、去除高功耗的DSP芯片，将系统光互连能耗降至极低水平，为超大规模数据中心打造高速且低能耗的光传输“公路”。</p>\n  <p>针对MRM技术普遍存在的温度敏感这一产业化难题，量引自研了实时温控反馈及电均衡算法IP，确保了微环调制器在严苛数据中心环境下的稳定工作。更关键的是，公司掌握了底层的硅光PDK（工艺设计包）自研能力，并采用成熟且国内自主可控的CMOS工艺节点进行生产，从源头上规避了高端制程的供应链风险。</p>\n  <p><strong>以下是对量引科技CTO赵京雄的访谈节选：</strong></p>\n  <p><strong>硬氪：现在OIO赛道非常火热，量引相比同行核心优势在哪里？</strong></p>\n  <p><strong>赵京雄：</strong>首先我们拥有实质的流片与测试经验，而非仅停留在仿真阶段。OIO的核心是紧密的光电交换，英伟达、AMD以及Ayar Labs等海外大厂在计算和高带宽密度应用上都走MRM（微环调制器）路线。我们过去有多次设计迭代的经验，公司今年最新一轮1.6T MRM光芯片流片已完成，目前正在测试中，在国内具有先发优势。</p>\n  <p>其次，我们的微环FSR（自由光谱范围）设计得比较宽。OIO应用需要极多的通道数量，一般采用DWDM（密波分复用），即在单一波导下放多个波长。如果微环的FSR不够宽，调制第一个波长时就会产生串扰，影响相邻通道，导致无法放下太多微环同时调制。</p>\n  <p>最后也是最重要的一点，我们具备底层的自研关键器件能力，而非依赖代工厂的PDK，事实上目前也没有几个工厂能提供微环PDK。如果后续针对某些特定应用需要调整器件性能，我们不会像依赖标准PDK的团队那样难以调整。</p>\n  <p><strong>硬氪：自研内部设计库，在跟代工厂交涉时良率能保证吗？</strong></p>\n  <p><strong>赵京雄：</strong>这确实点到了核心问题。代工厂提供的标准PDK，设计通常会优先考虑良率，因此给出的性能参数相对稳妥和保守，难以满足定制化需求。而我们面向特定应用场景和差异化客户需求时，会更看重性能是否匹配，并针对性地做一些设计上的调整。</p>\n  <p>当然，针对良率这块，我们会通过多次迭代流片来进行数据收集，并以此逐步对设计进行调整和优化，这是从工程验证走向规模量产必然要经历的磨合过程。</p>\n  <p><strong>硬氪：接下来的芯片流片有什么样的计划？</strong></p>\n  <p><strong>赵京雄：</strong>过去我们的开发主要集中在单通道200G MRM器件本身，而这次出来的光电集成芯片是整片芯片，我们成功把合路器、波导、分光器、PD等所有功能器件都集成在一起，让我们对整个芯片的设计流程和功能器件组合有了系统性的掌握。接下来，我们会继续进行多轮流片，确保最终量产的高良率与可靠性。</p>\n  <p><strong>硬氪：建立国产光互联生态，目前面临的最大问题是什么？量引打算怎么做？</strong></p>\n  <p><strong>赵京雄：</strong>在国外，有英伟达这样的计算与交换巨头推动的封闭生态。但国内，目前产业链还没有完全就位，光互联主要涉及的计算芯片、光芯片和先进封装这三大板块形成有效协同还需要时间。</p>\n  <p>面对这些现状，我们首先会立足本业，把光芯片做好，并协同上下游保障Driver IC、TIA和激光器等关键器件供应链稳定。在CPO/OIO方向上, 我们已经跟国内头部GPU厂商达成合作并进入PoC阶段，重点攻克接口、GPU和光引擎之间的光电信号转换及协议层适配。同时，我们正同步配合封装厂推进TSV等3D堆叠先进封装的联合研发。</p>\n  <p>我们在生态圈里的定位是核心光互联赋能者，率先让国产光芯片在新一代算力系统里跑通，为产业链上下游打开协作与发展的想象空间。</p>", "category": "tech", "published_at": "2026-08-03T05:43:36+00:00", "fetched_at": "2026-08-04T02:04:28.865509+00:00", "fingerprint": "63a8d2922d3da539"}, {"source": "36氪 - 最新文章", "title": "可灵观察②｜用可灵重现《霸王别姬》：电影感足了，复杂叙事如何更稳？", "url": "https://36kr.com/p/3923465542364545?f=rss", "summary": "<p>其中高质量画面、电影感镜头、广告和商业短片是用户提及率最高的应用场景。</p>\n  <p>这次，我们进一步展开测试：如果可灵最被期待的是电影感，它能否支撑包含人物、动作和情绪的完整短片创作？</p>\n  <p>围绕“霸王别姬”主题，我们原创了测试脚本《霸王别姬·前世今生》，使用可灵3.0的首尾帧图生视频与主体绑定功能，完成了一轮压力测试。本次测试围绕人物一致性、构图与空间层次、光影与氛围塑造、动作与运镜设计四大维度展开，既保留了完成度较高的镜头，也完整记录了复杂任务中的试错过程。</p>\n  <p><strong>先说核心结论：可灵3.0更适合关键镜头的创作。</strong></p>\n  <p>模型在构图、光影、情绪氛围和人物主体一致性上表现突出，针对目标明确的短动作镜头，可以稳定产出高质量画面。若需用可灵处理复杂叙事影片，更稳妥的思路是把长动作拆成单目标的短镜头，再通过分镜设计与后期剪辑串联为完整段落。</p>\n  <p>当任务同时涉及跨空间移动、多道具与多人物打斗场景时，最终画面效果高度依赖提示词、参考图、镜头时长和拆分方法。</p>\n  <p>这次压力测试，目的是找到更稳定的创作方法，而非对模型能力下定论。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_b8a25b6679284399912faee0a8687d02@5284654_oswg431142oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">【图1｜本次测试使用的参考图】</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_a0aae574e0294d86b6deeec22bd17220@5284654_oswg5705oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>电影感，率先在关键镜头中落地</strong></p>\n  <p>从测试结果来看，可灵3.0的核心优势集中在关键镜头的画面完整度。</p>\n  <p>当镜头目标明确、人物关系简洁、动作时长较短时，模型能生成高质量画面。光影、构图、人物和情绪氛围均表现亮眼。</p>\n  <p>例如戏子镜前准备的画面，最能直观体现可灵的画面表现力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_7769bcecb42d4efabd13f866d3f2cac9@5284654_oswg720064oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">【图2｜戏子镜前准备】</p>\n  <p>这个画面可灵并非只进行了简单的动态化处理，镜框把人物限定在视觉中心，左侧珠串和戏服形成前景，人物与铜镜置于中景，后台走廊与暖光充当远景，形成标准的前中后三层纵深结构。</p>\n  <p>画面摆脱了平面感，呈现出鲜明的电影空间质感。</p>\n  <p><strong>可灵在这类镜头里的核心价值，在于一次性生成构图、光线和人物状态完整的视觉画面。</strong></p>\n  <p>这也侧面印证了第一篇测评中，用户普遍将可灵与“电影感”“高质感镜头”绑定的核心原因。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_2e3e63d0aa574fa2bd2548a9681636b8@5284654_oswg7930oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>短动作镜头，可稳定输出高质量动态效果</strong></p>\n  <p>电影感并非仅来源于静态构图。可灵同样能完成具备冲击力的电影感动态镜头。</p>\n  <p>项羽在战场打斗的场景，我们经多轮测试，得到了一版完成度较高的短镜头。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>【视频1｜项羽突围画面】</strong></p>\n  <p>画面重点：短时间内人物气势、战场压迫感和动作方向的合理性。</p>\n  <p>该片段中，项羽的突围路线清晰，人物动态传递出杀伐张力。黄沙战地、兵器交锋、人体倒地和尘土弥漫的效果，共同构建出混战中的压迫感。</p>\n  <p>让可灵在生成长镜头动作画面时，核心前提在于有明确的目标镜头，只承载一个主要的动作，目标越清晰，输出的结果稳定性越高。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_f3d257cf255e4f178187eb64769ed4d9@5284654_oswg7843oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>氛围塑造和人物一致性：为叙事提供锚点</strong></p>\n  <h2><strong>&nbsp; 1. 氛围塑造方面</strong></h2>\n  <p>项羽乌江自刎前后的情绪镜头，是本轮测试中另一组完成度较高的素材。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>【视频2｜项羽乌江自刎】</strong></p>\n  <p>画面重点：光影和暗部细节。</p>\n  <p>这段画面的整体亮度偏低，项羽近景镜头里，剑身呈现微弱反光，冷灰天光搭配脸上的泥土、血污和泪痕，共同烘托出英雄末路的悲壮情绪。</p>\n  <h2><strong>&nbsp; 2. 人物一致性方面</strong></h2>\n  <p>主体绑定主体的能力也为成片提供了支撑。项羽、虞姬和戏子在不同镜头中，保持人脸、服饰与人物身份的一致，未出现偏差。</p>\n  <p><strong>主体绑定解决了叙事的基本问题：保障角色的可识别性，让观众能够持续识别同一角色。</strong></p>\n  <p>人物稳定以后，不同地点、景别和情绪的镜头才具备剪辑进同一段叙事的基础。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_4c2cda65b2214168b4905050218e808f@5284654_oswg6731oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>复杂叙事：需要先拆成一套标准镜头工作流</strong></p>\n  <p>经过本轮测试，我们进一步明确了可灵 3.0的合理创作方式。完整叙事并非无法实现，但不能将所有创作任务集中于单个长镜头。</p>\n  <h2><strong>&nbsp;&nbsp;1.&nbsp;单镜头承载单一任务</strong></h2>\n  <p>如果一个镜头同时包含走位、转身、舞剑、追兵、马匹和镜头环绕等元素，模型需要同时处理的信息过多。更稳妥的方式是，需缩短镜头时长，使其仅完成一次清晰动作，避免长时间运动中出现形态偏差。</p>\n  <h2><strong>&nbsp; 2.&nbsp;战斗场景通过分镜与剪辑实现</strong></h2>\n  <p>“冲锋、挥剑、击中、敌人受力、倒地、追兵包围”的完整动作链，无需由单个镜头全部呈现。可拆解为冲锋、挥剑、敌军后退与战场反应等独立镜头，再通过音效与剪辑，让观众感知完整的战斗过程。</p>\n  <p><strong>3.&nbsp;空间路径提前拆分为节点</strong></p>\n  <p>人物从后台走向侧台、再进入舞台的动线，本身包含多个空间节点。将每个节点设为独立镜头，或为关键转折分别设置首尾帧，比仅在提示词中强调“从侧方上台”更易控制效果。</p>\n  <p>这套创作方法并非绕开模型能力，而是将模型擅长的关键镜头，有机组织为完整叙事。<strong>AI负责镜头生成，创作者负责任务拆解、连续性构建与最终效果判定。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_a09e05ead9844c4a8cfc611dffa46ab7@5284654_oswg7422oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>压力测试验证：复杂空间和物理交互仍需加强控制</strong></p>\n  <p>明确优势与创作工作流后，再来看本轮压力测试中难度最高的场景。</p>\n  <p>测试结果受提示词、首尾帧设计、主体参考图、镜头时长和生成随机性等多重因素影响，结论仅适用于本轮测试参数，不代表所有场景效果。</p>\n  <p><strong>1.&nbsp;精确空间路线需更精细化的镜头约束</strong></p>\n  <p>我们测试了戏子从后台准备走向舞台的连续场面调度。该任务要求模型理解后台、���台与舞台的空间关系，而非仅完成“人物登台”的动作。</p>\n  <p>5轮测试结果显示，人物可稳定完成“走上舞台”的语义结果，但很难持续遵循“从侧方上台”的具体动线。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>【视频3｜戏子从后台到舞台空间衔接】</strong></p>\n  <p>画面重点：人物是否从侧方进入舞台，以及后台与舞台之间的空间连接逻辑。</p>\n  <p>该画面的色调、人物状态与舞台氛围均符合预期，偏差主要出现在第7秒前后的路径衔接处。可灵生成了视觉顺滑的移动效果，但无法稳定复现真实剧场的登台动线。</p>\n  <p>在实际创作中，更合理的处理方式是将后台、侧台与舞台拆分为两个镜头，通过人物朝向、视线引导与剪辑手法，构建空间连续性。</p>\n  <h2><strong>&nbsp; 2.&nbsp;多道具和多人战斗，对生成条件更敏感</strong></h2>\n  <p>戏曲与战场镜头同时包含双剑、水袖、盔甲、长矛、手部动作、身体重心与摄影机运动，是本轮信息密度最高的测试任务。</p>\n  <p>部分测试版本中，出现了双剑的数量变化、水袖的形变、击杀人物反馈不匹配等问题。提示词可提供方向约束，但在较长的连续动作中，无法完全消除此类偏差。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>【视频4-6｜舞剑镜头中的道具变化】</strong></p>\n  <p>画面重点：剑、水袖与手部动作在连续运动中的一致性。</p>\n  <p>战斗镜头经数十轮测试，不同版本的输出效果差异较大。部分版本出现粉末化击打效果，被击中后的身体反馈逻辑不正确。</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p class=\"loading-entity\">&amp;amp;nbsp;</p>\n  <p><strong>【视频7-8｜战斗镜头中的击打反馈差异】</strong></p>\n  <p>画面重点：兵器接触与敌军反应能否形成连贯的逻辑关系。</p>\n  <p>这组结果可总结为：<strong>在本轮测试方法下，复杂交互场景的产出确定性远低于单目标短镜头。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_f4af8483965746d1ad4b7194c84aa310@5284654_oswg8485oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">标题</p>\n  <p><strong>结论：可灵更适合关键镜头生产，复杂叙事需要拆解工作流</strong></p>\n  <p>回到开篇的核心问题：可灵能否支撑具备电影感的短片创作？</p>\n  <p><strong>答案是肯定的，但创作方式的选择至关重要。</strong></p>\n  <p>可灵3.0可实现优质构图、氛围感光影与相对稳定的人物主体，也能在短镜头中生成兼具压迫感和情绪张力的动态画面。这些能力已足以支撑其参与高质量内容的关键镜头生产环节。</p>\n  <p>当任务涉及跨空间调度、多道具连续动作与多人战斗场景时，创作者需将叙事拆解为更明确的单镜头任务，复杂交互逻辑通过后期剪辑完成。</p>\n  <p><strong>现阶段可得出明确判断：可灵适合生产高质量短镜头和电影感氛围影片；在进行复杂叙事时，通过拆解式工作流可获得更稳定的输出效果。</strong></p>\n  <p>其价值不仅在于画面生成的能力上限，也在于融入创作者的镜头生产流程。创作者主导叙事设计、分镜规划与内容取舍，可灵负责高质量完成部分镜头的生成工作。这也呼应了第一篇测评中用户的真实诉求：专业创作者既需要画面能力的上限，也需要项目落地的确定性。</p>\n  <p>将可灵应用在适配的镜头创作场景中，它将成为专业创作者的高价值AI生产工具。</p>\n  <p>下一篇，我们将测试场景延伸至商业领域：可灵能够产出电影感画面，它能否进一步支撑品牌广告与商业性创作？生成内容距离可直接落地的商业成品，还有多大差距？</p>\n  <p>资料说明：本文为36氪 AI测评基于自制《霸王别姬·前世今生》测试脚本展开的可灵3.0图生视频实测。本次结论仅反映本轮提示词、参考图、生成参数、剪辑逻辑下的模型表现，不代表模型所有场景的通用能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_6d429e912f3f431e9379383a007a5735@5284654_oswg5018oswg1080oswg122_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">THE END</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_33e0f32a5c03430cac3a857266f5ca3f@5284654_oswg47466oswg1080oswg300_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫码添加</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_83a1120473ec443994fabf3e0f703614@5284654_oswg273593oswg1080oswg448_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图例</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/EcptiWr9NcWk6OH06i8l7w\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪AI测评”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-03T08:12:09+00:00", "fetched_at": "2026-08-04T02:04:28.865502+00:00", "fingerprint": "42e4a0247362d00e"}, {"source": "36氪 - 最新文章", "title": "德明利今日跌超9%，36氪企业全情报提前捕捉到这一市场信号", "url": "https://36kr.com/p/3923603053686151?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_d4d3e685b30f4f4c904ddc0fe3c2f434@5284654_oswg693586oswg1080oswg458_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片1</p>\n  <p>&nbsp;</p>\n  <h3><strong>今日A股收盘数据</strong></h3>\n  <p>上证指数：3809.66&nbsp;点，-0.59%</p>\n  <p>深证成指：13448.29&nbsp;点，-0.96%</p>\n  <p>创业板指：3302.55&nbsp;点，-1.24%</p>\n  <p>&nbsp;</p>\n  <h3><strong>德明利8月3日下跌9.56%</strong></h3>\n  <p><strong>349.00 &nbsp;-36.90 &nbsp;-9.56%</strong></p>\n  <p>当日开盘价373.94；交易量27.21万手；</p>\n  <p>换手率16.49%；缩量幅度0.36%</p>\n  <p>3日涨幅-1.57%；5日涨幅-13.10%</p>\n  <p>成交额：97.75亿；总市值：791.69亿</p>\n  <p>对于投资者来说，真正有价值的并不是股价下跌之后再去复盘，而是在市场情绪变化时，第一时间发现值得关注的信号。</p>\n  <p>这正是36氪企业全情报持续监测企业动态和舆情变化的价值所在。</p>\n  <p><a href=\"https://channel.36kr.com/api/x/wechat/urlLink?channelId=1&amp;path=/pages/home/index&amp;\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>更多德明利相关股价信息点击进入小程序查看</strong></a></p>\n  <p>&nbsp;</p>\n  <h3><strong>股价异动前，企业全情报已捕捉到市场关注事件</strong></h3>\n  <p>财联社7月31日消息，有投资者询问，网传德明利第五大股东李东璘近期爆仓致股价大跌是否属实，还问及公司高管是否履职尽责保护投资者，以及公司有无回购计划。德明利在互动平台回应，前十大股东信息会按规则在定期报告披露，5%以下股东个人股份处:置及融资事宜属股东自身事务，非公司法定披露范畴。公司保持与投资者沟通畅通，将结合自身情况审慎评估举措，后续若涉及相关事项，会按规定及时披露信息。</p>\n  <p><strong>｜事件正负面性质分析</strong></p>\n  <p>截止8月3日，此事件匹配的到全网舆情信息总量为7条，正面信息1条，占比14.3%，负面信息1条，占比14.3%，中性信息5条，占比71.4%，事件舆论呈现出中性偏负的倾向。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_da3d212b7aa34acf8fa4a40b5597fc8e@5284654_oswg39293oswg498oswg240_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图示</p>\n  <p><strong>｜渠道传播分析</strong></p>\n  <p>该事件全网监测到传播篇次7条。重点监测平台中，今日头条是事件的主要传播渠道。</p>\n  <p><strong>｜事件影响分析</strong></p>\n  <p><strong>投资者关系维护（利好）：</strong>德明利针对投资者的多项问询及时在互动平台进行回应，保持与投资者的沟通渠道畅通，展现了对投资者关切的重视，有助于缓解投资者的信息不对称问题，增强市场对公司的信任，对股价形成利好支撑。</p>\n  <p><strong>传闻应对效果（利空）：</strong>德明利未直接针对投资者提及的网传第五大股东爆仓致股价大跌的传闻进行明确澄清，仅表示该事项属于5%以下股东自身事务，未能有效打消市场对该传闻的疑虑，可能引发投。资者继续担忧相关风险，属于利空影响。</p>\n  <p><strong>股东信息披露合规性（中性）：</strong>德明利明确表示将按照监管规则在定期报告中披露前十大股东信息，后续涉及相关事项将按规定及时披露，其信息披露行为符合法定要求，未对公司基本面产生额外影响，属于中性范畴。</p>\n  <p><strong>回购计划预期（中性）：</strong>德明利表示将结合自身情况审慎评估回购计划，未明确披露具体的回购方案或实施时间表，未释放明确的利好或利空信号，对股价无直接显著影响，属于中性范畴。</p>\n  <p><strong>高管履职认知（中性）：</strong>德明利未针对投资者提及的高管履职尽责问题进行正面或负面回应，未对市场关于高管履职的认知产生明显正向或负向影响，属于中性范畴。</p>\n  <p><strong>短期来看，</strong>投资者对网传的第五大股东爆仓传闻存在疑虑，公司未直接澄清该事项，可能引发部分投资者的观望情绪，但公司及时回应投资者问询也一定程度上缓解了信息不对称问题，整体短期股价或呈现震荡整理态势。</p>\n  <p><strong>长期来看，</strong>本次事件未涉及德明利自身经营、核心业务等基本面内容，公司仅需按照监管要求履行信息披露义务，未对公司长期内在价值造成负面影响，股价后续将回归由公司自身经营业绩驱动的正常走势。</p>\n  <p><strong>｜股价影响趋势分析</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_1ef2be0461f3451184ccb62edb4fc8f7@5284654_oswg29830oswg492oswg279_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图示</p>\n  <p><a href=\"https://channel.36kr.com/api/x/wechat/urlLink?channelId=1&amp;path=/pages/home/index&amp;\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>更多德明利相关舆情信息点击进入小程序查看</strong></a></p>\n  <p>&nbsp;</p>\n  <h3><strong>专业观点：市场关注焦点仍集中在风险释放</strong></h3>\n  <p><strong>·&nbsp;爱炒股的侠客（看空）：</strong></p>\n  <p>当下市场对德明利的看好情绪较为浓厚，不少市场参与者对该企业的后续表现给出积极判断，但有观点认为德明利即将面临监管层面的临时管控，建议暂缓决策、先观望后续动向，相关潜在风险需要投资者加以留意，以规避可能出现的短期波动影响。</p>\n  <p><strong>·&nbsp;护航灯68&nbsp;（看空）：</strong></p>\n  <p>近期芯片、存储、光模块板块出现回调，德明利当:日股价下跌。资金从该类高位硬科技板块撤离，外围相关板块的波动传导至A股市场，对德明利的股。价表现形成负面影响。该板块短期热度有所下降，德明利股价短期承压，后续需持续关注板块轮动节奏、外围市场变化以及整体市场流动性环境对其股价的进一步影响。</p>\n  <p><a href=\"https://channel.36kr.com/api/x/wechat/urlLink?channelId=1&amp;path=/pages/home/index&amp;\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>更多德明利专业观点点击进入小程序查看</strong></a></p>\n  <p>&nbsp;</p>\n  <h3><strong>企业全情报的价值：帮助投资者更早发现市场信号</strong></h3>\n  <p>很多投资者是在股价出现大涨、大跌之后才开始寻找原因。</p>\n  <p>而36氪企业全情报通过7×24小时全网监测企业动态、媒体报道、互动平台、专业观点及市场舆情，在企业事件发生后的第一时间完成信号捕捉、舆情分析和影响评估。</p>\n  <p>投资不是等股价异动后再寻找原因，而是在市场信号出现时，就提前做好关注与判断。</p>\n  <p><strong>👉 打开36氪企业全情报小程序，查看更多德明利实时舆情、专业观点、股价异动及企业动态。</strong></p>\n  <p class=\"wx-app-wrapper\">\n   \n    &nbsp;\n   </p>\n  <p>*数据来源：红麦聚信(北京)软件技术有限公司&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_99ecd27860f9475ca04e150e676497db@5284654_oswg2504oswg900oswg74_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">END</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/a_nNsW6P10EngIaqVMFl1A\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪企业舆情报告”</a>，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-08-03T09:44:31+00:00", "fetched_at": "2026-08-04T02:04:28.865495+00:00", "fingerprint": "24deb68bb9c2c44f"}, {"source": "36氪 - 最新文章", "title": "从实验到产线——AI 工作流的规模化挑战与协作生态 | 2026 ChinaJoy AI未来生态大会", "url": "https://36kr.com/p/3923717502072969?f=rss", "summary": "<p>AI工作流如何从实验室的“惊艳一刻”走向产线的“日常运转”？当生成能力不再是门槛，规模化落地的瓶颈在哪里，人又该扮演什么角色？</p>\n  <p>内容生产正在经历从“技术验证”到“产业落地”的关键跨越。单点突破易，系统协同难，真正的挑战不在于模型能否生成，而在于工作流能否稳定运转、协作生态能否有效构建。技术红利终会趋平，越过规模化这道坎之后，行业最后比拼的是对场景的理解深度与工程化的落地能力。2026 ChinaJoy AI未来生态大会上，36氪游戏与Funloom AI、阿里云、VAST、珀乐互动等行业先行者，共同带来圆桌探讨。</p>\n  <p><strong>圆桌嘉宾：</strong></p>\n  <p><strong>刘士武丨36氪游戏主编（主持）</strong></p>\n  <p><strong>吴同丨Funloom&nbsp;AI&nbsp;CEO&nbsp;</strong></p>\n  <p><strong>艾文丨阿里云智能集团公共云AI原生事业部副总经理</strong></p>\n  <p><strong>罗小我丨VAST战略负责人</strong></p>\n  <p><strong>杨晟丨珀乐互动科技创始人</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_bd6853577f0346cd9136839e0a4f3e21@16519798_oswg759632oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">从实验到产线——AI 工作流的规模化挑战与协作生态</p>\n  <p><strong>以下为圆桌对话内容，经36氪整理编辑：</strong></p>\n  <p><strong>刘士武：</strong>大家好！我是本场圆桌的主持人，36氪游戏主编刘士武，我们今天的圆桌主题是从实验到产线，AI工作流的规模化挑战与协作生态。我们今天圆桌四位嘉宾，Funloom AI的吴同老师、阿里云的艾文老师、VAST罗小我老师以及珀乐互动的杨晟老师，其实四位分别代表AI产线上不同的角色以及在发力不同方向。</p>\n  <p>今天我们将会聊聊大的话题下一些小细节，聊聊AI在游戏行业工作流里面应用过程中遇到的一些坑，以及大家是如何解决这些问题的，首先我们先请各位嘉宾做个自我介绍。</p>\n  <p><strong>吴同：</strong>大家好，我是Funloom CEO吴同，我们做的产品是Funloom AI，它是一个UGC的AI互动内容共创平台，我们致力于帮助UGC用户把自己的一个简单想法能够落地成高质量的、可商业化的内容作品，当然这个内容作品形态它包含游戏、影视以及文学等诸多领域。</p>\n  <p><strong>艾文：</strong>大家好，我是阿里云AI原生事业部的艾文，阿里云AI原生事业部主要服务对象主要是是以AI为核心生成力的AI原生客户。我们的客户是依靠AI能力、依靠MaaS能力，依靠Tokens，从以前一个云服务商向MaaS、向Tokens， Agent工具服务商转型，支持这些专门我们认为“会插上AI的翅膀飞得更高”的客户们。&nbsp;</p>\n  <p><strong>罗小我：</strong>大家好，我是VAST罗小我，VAST是一家做AI 3D和世界模型的科技公司，公司从成立以来一直跟游戏行业联结比较深，也非常高兴来到这里。</p>\n  <p><strong>杨晟：</strong>大家好，我是珀乐互动的杨晟，我们专注于科技在泛娱乐领域的应用，业务涵盖游戏、内容及其他泛娱乐产品。</p>\n  <p><strong>刘士武：</strong>今天希望大家能够在圆桌上聊一些可能大家平时听不到的、我们可以私底下在聊的有意思的事情。</p>\n  <p>首先想问吴同老师，因为吴同老师是非常年轻的一位创业者，前不久Funloom 刚刚完成pre-A轮融资，我们也观察到Funloom 已经把最早的AI文游逐渐升级成了AI、文字RPG和互动游戏三位一体架构，从工具到AI原生游戏，这样产品形态发生了哪些变化呢？您和您的团队是如何理解当下AI原生游戏的呢？</p>\n  <p><strong>吴同：</strong>Funloom在这次ChinaJoy展出的RPG模式与互动影游模式，本身就在我们产品线规划里，Funloom作为一个UGC内容共创平台，希望在降低用户游戏创作门槛的同时，又能保证产出的游戏质量相当可控，希望兼顾两者。为此我们已经研究了两年时间，期间也尝试通过Vibe Coding路线实现这个目标，中间我们做了大量实验，也遇到过很多挫折。</p>\n  <p>关于AI原生游戏，最早我们接触到的是AI文字游戏，我觉得这个模式它已经在最小程度上实现了AI原生了，它最让人着迷的点在于它允许创作者和消费者一起构建文化作品的心流。我认为一个内容作品最重要的其实就是心流，作者想要把自己表达的创作、创意、想法各种东西以作品形式承载下来，通过可能各种模态再传递给消费者，其实本质上是人与人之间的共鸣，AI文游相当于你可以只做游戏设定，但是你这个游戏内容体验不是完全由创作者决定的，它也让消费者也参与到这一环，这其实让我当时看到了也许存在一种真的低门槛，同时又能确保这个游戏可玩性的一种模态。</p>\n  <p>我曾经在小红书上和海外平台上看到很多人在玩AI的原生文字游戏，当时觉得这是一个已经被大家认可的模式，所以最早把我们技术路径切换到了做AI原生文字游戏。但是我们不是止步于做一个文字游戏，我依然希望它最后能够以丰富多彩模态形式呈现给更多大众化用户，现在我们的状态更像是以AI文游作为一个全新人机交互模式，让创作者能够把自己的想法输出出来。因为在Vibe Coding的时候，会发现很多人不懂业务逻辑，做出来有很多Bug，甚至难以顺畅地迭代自己的创意构想，而AI文游这一模式，能让创作者能够更专注于内容本身。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_eeb636c610d94593bfd0adb40350f6e2@16519798_oswg461011oswg1080oswg718_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">吴同丨Funloom&nbsp;AI&nbsp;CEO&nbsp;</p>\n  <p>在AI文游的创作模式下，创作者可以先将自己的心流体验打磨完善，这个过程其实已经给你的游戏输出了一个非常完整的想法，它有点像为你的游戏构建了一个专属的大模型微调层。在获取充足信息之后，我们一方面可以据此训练专门的游戏设计、游戏策划方面的模型；另一方面，这些信息可以让我们有能力去介入，做后面落地开发过程，这其实也支撑了我们的核心能力——可以以AI文游做的文游作为样本，直接一键转化成RPG游戏和互动影游。我们已经在今年CJ的C馆N2已经展示出了Demo，我也做了一个示范案例，如果大家感兴趣也欢迎直接去线下体验试玩，可以支持全部完全自动化的生成。</p>\n  <p><strong>刘士武：很多创作者包括我可能都有同感，我们的表达有时候也需要打磨，现在Funloom的第一步就是帮助我们用户做好表达，后续我们再去做其他的延展。</strong></p>\n  <p>接下来想问艾文老师，我们知道阿里云在游戏行业已经深耕很多年，从云服务到AI的全链路平台优势已经逐渐显现。如今有越来越多的游戏厂商开始用AIGC，阿里云作为云厂商，在这样的趋势下是否会改变咱们阿里云和内容厂商之间的合作关系以及商业模式呢？</p>\n  <p><strong>艾文：</strong>AI将我们和游戏客户的合作维度加宽和加深了。首先形成了云基础设施之外的一块全新的合作领域，其次依托云天然的超大规模基础资源弹性，能够更好的承载游戏天然的潮汐和毛刺型流量，云+AI成为了全新的游戏行业底座，这加速了游戏行业在AI领域的探索与实践。</p>\n  <p>在AI时代，阿里云千问大模型也直接作用到了游戏的链路中。我们观察到了几种场景：</p>\n  <ul>\n   <li>闲聊陪伴/知识问答/游戏助手：闲聊陪伴NPC：最简单的落地场景，无需外挂知识库</li>\n   <li>知识问答NPC：通常需要外挂知识库，叠加意图识别、做商品检索等，</li>\n   <li>参与游戏互动的AI NPC：对战AI：将a的bot升级为AI NPC，通过自然语言理解+游戏Agent能够更好的给玩家带来游戏体验。</li>\n   <li>指令操纵自主运行NPC：玩家通过语音、文字等手段，直接向NPC下达指令，NPC根据自身所处环境，自行规划动作，应答指令，核心是能够理解虚拟世界。</li>\n  </ul>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_c5b80a46906b4d8b8a76a70162927613@16519798_oswg698567oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">艾文丨阿里云智能集团公共云AI原生事业部副总经理</p>\n  <p><strong>刘士武：</strong>游戏行业离不开基础算力和基础服务的提供商。接下来问到罗老师，我们知道VAST这两年发展很快，从AI 3D技术，到今天看到的世界模型。现在游戏行业在用3D大模型的人越来越多了，很多游戏开发者都在跟我提Tripo模型，从您的视角来看，从一开始我们做Tripo到现在能够把大模型放在管线里面，再进一步推出了世界模型，中间跨度到底有多大？对于这些游戏厂商或者内容的开发者来讲，他们应该如何去适应这类型的产品呢？</p>\n  <p><strong>罗小我：</strong>从VAST的发展经历来看，大致经历了三个比较重要的门槛，最开始我们叫能生成；第二叫能生产、第三叫能运行。</p>\n  <ul>\n   <li>首先是能生成，这个概念怎么理解？在AI 3D技术没有普及的时候，我们意识到，传统3D建模是一个又耗人力又耗时间的事情。因此，我们最初与Stability AI合作，一起做了Tripo S2开源模型。这个开源模型能在0.5秒，内将单张图片快速生成为3D内容，具备实时生成能力。后面我们又做了比较高清的模型——H3.1模型，现在也是非常受各个游戏公司和工作室的欢迎，大家在高强度地使用，它能够比较大地提高几何质量，在输入对齐和泛化能力上也有提升，这是我认为最早解决的生成问题。</li>\n   <li>其次，能生产，这是这几年我们积累的KnowHow，最早说这个东西很酷、很漂亮，像一个Demo一样，这可能和其他AI模态也比较类似，大家做出了很多很漂亮的Demo，很吸引人，大家都可以去用。但在游戏行业里，游戏团队它有自己的一些工作流，它可能并不需要一些好看的截图或者一个很酷的Demo，更需要一个能修改、能够验收的资产，能进入它自己的管线里，所以我们也从模型和产品侧做了很多迭代。举个例子，我们今年上半年做的Tripo P1.0模型，其实是为了满足大家是为了满足行业对拓扑结构、面数控制和UV合理性等方面的专业需求，在面数可控情况下也生成一个效果比较好的模型，这是真的能够解决大家很多生产侧需求的，后来我们也衍生做了绑骨、解决复杂结构、动画模型等一些探索。</li>\n   <li>第三，能运行，这也算是一个这几年积累的KnowHow，最开始我们做模型，很多人可以去调用我们的API，但是其实拓展到更大范围的创作者或游戏工作室，他们更需要一个全链条产品，因此我们做了自己的Studio的SaaS产品，跟DCC软件、Blender、Unity、unreal的这些DCC Breech把生成、编辑、导入都串成一个工作流。</li>\n  </ul>\n  <p>总结来说，从最早的技术上的探索到真正与行业、产业走到一起，与创作者走到一起，真正让大家把这些工具用起来，我觉得经历了上述的一个过程。</p>\n  <p><strong>刘士武：</strong>这是一个非常不易的过程，就像吴同老师、艾文老师刚讲到的，大家迭代过程中遇到都会遇到困难。</p>\n  <p>我之前和一位引擎大厂的朋友讨论，他认为未来挑战自己的并不一定是引擎公司，因为工作流一直在变。可能过去我们去开发一个产品的时候流程是相对固定的，而今天流程在变，大家未来需要扮演的角色都不相同，但也可能都不冲突。</p>\n  <p>接下来想问杨晟老师，我们已经连续几年和珀乐在ChinaJoy上相见了，去年珀乐推出一部很火的AI漫剧《明日周一》，50集、45天、几个人的团队就做出了爆款漫剧，成为了现象级的作品。不过之后的一段时间，大家又开始考虑，如果AI只是把制作周期进行压缩，那会不会最后陷入一种比拼谁更便宜的低价内卷的怪圈里。作为最先跑通这套生产管线的团队，珀乐觉得这个问题的解法应该是什么？AI在我们的生产管线中还引发了哪些更深层次的变化呢？</p>\n  <p><strong>杨晟：</strong>去年这个时候，大家还不太相信有AI漫剧这个概念，过去一年，我们明显感受到，泛娱乐已经形成了一条新的赛道，所以云厂商也开始进入，Token也开始爆卖起来。但是我们认为Token价格本质还是电价，怎么能够把电价卖得贵起来，这才是根本。一件玩具放在那里，按PVC的价格卖，可能只有六七毛；但如果加入某个知名IP，附加价值上来了，一个盲盒就可以卖到39.9元。同理，如何让基建、如何让算力在更高的附加价值之下卖出更高的价格，这件事情就是我们做完前面的验证完之后，接下去想的下一步。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_d5e553679294471799f96792ddfdf5da@16519798_oswg546828oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">杨晟丨珀乐互动科技创始人</p>\n  <p>前段时间，我们官宣了与阿里云、开心麻花一起合作的《羞羞的铁拳》的新项目。Token原来是这么一个价格，但是如果我们一起在阿里云的平台上面为happy horse, happy&nbsp;Oyster引入《羞羞的铁拳》这些形象，让创作者们和OPC们可以使用这些形象，并建立相应的分成机制，整个生态是不是会变得更加广阔？对于IP方、云厂商、底模来说，大家都把手伸进了算力、深入了电力以外的附加价值，我们认为这样才能把行业做得更大。</p>\n  <p>我想Funloom也是一样的，互动游戏全部使用原创IP，和其中有一两个超级IP或知名数字资产介入，在可玩性和对受众的吸引力上，完全不可同日而语。所以珀乐现在专注做的是如何让数字资产在不同底模、不同云厂商之间去流转，并且加以定价，我们认为这是每年都会见面聊的一个趋势，也是从今年开始一直到明年主要的战场。如何让数字资产流转、如何让数字资产在不同底模之间和不同应用厂商之间发挥价值，就是让这个东西不再是只卖算力钱或者卖电费了。</p>\n  <p>我相信云厂商、Tripo等公司都不会满足于只卖七折、八折、九折的产品，真正有价值的是，产品加入独家IP后，价格甚至能够在原有基础上提升200%。这些资产包里面包含了某一两个你们在外面得不到的特殊形象，只能在这个限定期间通过采购流转获得，我们认为这才是一个健康市场应有的状态。我们去年把内容的入口打开了，这一年时间也看到有大量漫剧公司、应用公司都陆续入场，大家也在多模态能力、互动影游、文游等方向持续探索。下个阶段，这些产品如何创造更多收入，如何让更多参与者从中受益，是把整个市场进一步做大的前提。</p>\n  <p><strong>刘士武：</strong>确实，去年大家还不太相信，但短短一年时间过去，如今AI漫剧的第一波风头甚至已经过了，我觉得这也是AI发展趋势中的特别有意思一点。刚才我跟几位老师还在聊，VAST创业大概有两三年时间，Funloom才不到一年，但是现在大家的产品迭代都是以月为单位变化的，这恰恰是AI的魅力。</p>\n  <p>四位嘉宾过去肯定在做AI工作流的规模化过程中都会遇到各种各样的挑战，可以分享一下大家在发展过程中踩过最大的坑吗？团队又是如何去克服的？</p>\n  <p><strong>吴同：</strong>这个问题和我们现在做的赛道比较强关联，就是做AI互动内容共创平台，我觉得今年上半年，差不多五六月的时候它已经形成一个赛道了，它有一个最大痛点，就是生产的内容质量不可控、用户付费率低，这其实也是我们没有在Vibe Coding路线上一直做下去的原因。</p>\n  <p>回到内容作品最重要的心流体验，它的关键节点集中于创作前期的设计侧，而不是后期的执行侧。大部分的UGC用户其实都有非常不错的创意想法，就像我小学的时候也喜欢做很多的设计，喜欢涂涂画画，但问题在于想法和内容产品之间的Gap非常大，如果不是一个专业的游戏策划、专业的编剧，就没有办法去创作出一个可以拿来销售的文化商品。</p>\n  <p>这其实也解释了为什么Funloom 一定要坚持寻找一种新的人机交互模式，我们希望让UGC用户去做他们最擅长的事，去天马行空想象，去找他们觉得最有意思的部分，而那些专业的、涉及到行业领域的垂类知识的部分，应该是我们做产品的人要去解决的问题。</p>\n  <p>其实Funloom一直以来做的，就是如何兼顾用户低门槛创作，同时还要为产出质量做兜底保障。商业化的本质来看，需要保证交付产品的鲁棒性，关键不在于产品上限有多高，在于下限有多稳。我们需要确保的是，创作者使用我们的工具所产出的产品，在交付给终端消费者时，能够稳定达到一个基本的品质基准线。这其实是我们花了很长时间去想的问题，通俗来讲就是你在做AIGC生成的时候，这个提示词写不明白的话，就不要继续写，能写到什么程度就到什么程度。这其实也是后来我们引入AI文游的核心原因，我们发现用户在玩AI文游的时候，无论怎么下指令，它都能把游戏模拟出来，这一点是真的很迷人。</p>\n  <p>AI文游实际上具备模拟多种游戏类型的能力，无论是RPG、SLG还是其他，都能模拟出来。不知道大家有没有这种体验：AI文游其实是在做游戏预览，这个预览恰恰解决了刚才提到的问题——先让用户把自己的想法落地，当信息给的足够多了，我们就与办法去做出一个“翻译层”，将用户的想法翻译成专业的游戏设计方案。但凡一个行业里能够通过培训班传授的知识体系，它的规律都是可归纳、可复制的，既然可以指导人去学习掌握，那么同样也能够指导AI去学习掌握，关键是我们要回到源头。我坚信AI行业无论发展成什么样，在文化领域它都不可能代替人，人永远是那个灵魂，AI不可能直接为我们生成文化作品，所以我们只能把一些算是经验知识的东西固化下来，把它落地成一个商品。</p>\n  <p>我们的解决方案，也是我们目前正在做的事情，包括后续向RPG品类的演进升级，核心目的都是进一步提升产品的附加值。因为文字游戏并不是所有人都能接受的，很多人其实是不愿意看字的，但一旦我们能够为它加入画面表现、加入更多的交互形式，让它更接近真实游戏的体验，这个游戏就会大众化普及，它的商业化问题也能够解决，我们整个内容飞轮才能运转起来。</p>\n  <p><strong>刘士武：</strong>我觉得文字其实是Funloom在一开始去提升心流体验，以及让用户感受表达心流过程的一个辅助。刚才吴同老师让我想到一个段子，有人说他以前两个月能手搓一款游戏，但是他怎么做最后产品都不好玩，也没有人愿意买单；有AI以后，他每两个月烧了很多Token，然后能做出十几个产品，但是这十几个也都没人玩——我觉得这个可能就是刚才吴同老师说的，首先我们要把心流训练好，能够把我们的心流更好传达给我们的用户，这个时候产品可能才可能获得别人的认可。那接下来我们有请艾文老师，聊聊遇到过的最大困难。</p>\n  <p><strong>艾文：</strong>当前游戏行业在探索AI应用时，遇到的最大困难在于游戏内AI玩法的ROI（投入产出比）难以回正。</p>\n  <p>与传统游戏“研发一次、分发边际成本趋近于零”的规模效应不同，AI游戏的核心交互需要持续调用大模型，这意味着每增加一个活跃用户，厂商就要承担实时的推理费用。在玩家高频互动或大并发访问的情况下，Token账单会呈指数级飙升。有行业测算指出，纯调用第三方API的应用可变成本占比较高，导致毛利普遍低于三成。这种“用户越多、成本越高”的规模不经济现象，使得厂商很难仅靠传统的皮肤或抽卡收入来覆盖高昂的算力开销。</p>\n  <p>当然今天我们看到游戏厂商正在积极拥抱AI大模型，这是一个不可挡的趋势。但如何真正用好AI，不论是在用户体验升级、还是产品提效、营销获客提效等方面，仍是全行业需要好好探讨、并在实践中不断沉淀“经验值”的问题。</p>\n  <p>目前阿里云通过不同形态的推理服务，适配不同场景，已经有不少客户场景已经做到ROI打正。随之后续阿里硬件，软件能力的提升，叠加领域模型的升级，相信会有越来越大的场景在商业化上取得效益，引来量变到质变的积累。</p>\n  <p><strong>刘士武：听下来感到非常不容易，我们都知道未来是好的，但是现在需要我们这样的云厂商巨头前期投入很多东西，虽然现在无法计算未来的回报，但实打实是在帮助行业健康成长。接下来有请罗老师。</strong></p>\n  <p><strong>罗小我：</strong>刚才艾总分享非常有意思，我也非常同意里面的一些观点。从我们做模型、给大家做工具的角度，包括刚才提到踩过的坑，我一直在思考：怎么把所谓的技术落地。如果我们觉得游戏是一种艺术的话，技术和艺术的一些结合是非常有意思的。举个例子：最开始我们希望把3D生成能力做好，我们生成很快，我们模型生成的看上去也很好，后来发现，真正在游戏公司包括大家在管线里面用的时候，生成环节可能快了10倍，但后面的审核、返工和导入其实可能都没有改变，整体效率往往只提升一点。当时给我们的一个感受是：我们做出来一个很厉害的模型、很厉害的技术后，怎么为大家所用，真正从工作流层面改变，才是很大的takeaway。这个事会给我们更深层次的思考：玩游戏的这群玩家怎么思考，制作游戏的厂商、工作室又怎么想，再到我们该给他们提供怎样的工具。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_4b439709439646868576bec7fd2f28e5@16519798_oswg460080oswg1080oswg718_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">罗小我丨VAST战略负责人</p>\n  <p>最近我们内部还谈论一个很有意思的话题，皮克斯有一个很有意思的文化，大意是艺术和技术相辅相成，技术会赋能艺术。他们内部的文化不是纯粹说写剧本的、做美术的人给我们技术团队提需，而是会在更深层次互相连接。在我们这里逻辑一样，包括我们做世界模型的逻辑——生成一个很惊艳的视频，并不代表真正理解了世界。真正的世界模型，可能是让物体、让玩家对环境的改变能够被记录下来，让流畅性和consistency真正赋能到行业，而不是一开始只想把Demo做出来、让大家觉得很酷。所以，我们一直带着这样的思考，真正把技术和艺术融合在一起，把大家真正喜欢的内容做出来，回到公司的vision上，就是让每个人都可以做很有意思、很不错的3D内容。</p>\n  <p><strong>刘士武：</strong>这个过程其实是在帮用户踩坑。用户可能有些想法，但技术实现路径和艺术表达逻辑并不一样，VAST作为技术厂商，既要理解大家对艺术的追求，又要根据这种追求去看技术该如何优化。最后有请杨晟老师。</p>\n  <p><strong>杨晟：</strong>创业这一年以来，我们经常会被问到一个问题：如果某个大厂、某个头部厂他们也在做跟你们一模一样的事情，你们该怎么办？这个问题在创业前三四个月非常困扰我们，如果头部厂商也做这件事，生态会不会只围绕一家转？但到今年年初，这个问题慢慢解开了。我们看到，某些模型能力一旦达到SOTA，行业路径往往会分流：模型侧可以更专注把模型做好、把Token规模化服务做好，应用侧的商业化空间随之打开。这段时间很多应用公司，包括AI游戏公司，其实是在垂类场景里继续打磨，因为通用能力再强，也不等于把每一个垂类都做到极致。</p>\n  <p>这段时间，我们跟Oyster也有一些合作，我们感觉到，模型厂商现在自我迭代速度非常快，也在快速学习。之前困扰我们的最主要问题，是应用层公司、底模公司和云厂商之间的关系，现在分工逐渐清晰起来。底模公司也好，包括云厂商也好，与其亲自探索所有应用方向，并证明每一个方向都能赚钱，不如卷工程算法，卷出一个好模型，只要让别人靠这个模型挣到钱就算大功告成。这个分工关系，在今年算是越来越明显、越来越清晰了。</p>\n  <p>我们现在的处理方法，是持续推出一系列工具。在这一年时间里，我们推出了将近四款工具，通过这些工具获得更多用户数据的feedback。我们知道什么是好的，包括用户在用编剧工具时更喜欢选择什么方向，在调用视频工具时高频使用哪些分镜/模板。通过这些用户数据feedback，我们获得了类似于具身智能公司才有的体感：什么是好的、什么是美的，美学来自何方，以及什么样的调用是准确的。我们也会把这一年收集到的数据和经验与底模公司分享，探讨这些数据如何反哺云层面和模型底层，进而做出更好、更能长期发展的商业化产品。</p>\n  <p>这是今年我们的感受，终于和底模、云之间建立了相对友好的关系。就像鳄鱼有鳄鱼的战场，牙签鸟有牙签鸟的战场，我们作为“牙签鸟”，慢慢和“鳄鱼”处成了相对好的朋友。这一点太不容易了，整个过程也非常煎熬。</p>\n  <p><strong>刘士武：</strong>在看似非常宏大的目标和场景之下，其实有很多小的问题需要我们不断地去打磨、不断地去适应。刚才四位都分享了我们过去遇到的一些困难，而今天我们站在ChinaJoy现场，看到了很多最前沿的产品和技术，我想情各位从各自的视角展望一下：接下来12到18个月里，AI重构游戏或者重构各种内容的研发，大家觉得最关键的变量会是什么？</p>\n  <p><strong>吴同：</strong>我的观点可能是生产关系。我发现AI时代和互联网时代对游戏行业来说，最大的区别在于内容生产的组织模式和生产关系发生了改变。当时我做这个方向的时候，有一个非常大的感触：我之前自己做过游戏方向创业，在互联网时代立项时，选题其实有很多局限性。为了成本和回报能够打正，很多人往往被迫做很多妥协。比如说，如果我现在想做一款��史游戏，那么题材大概率得选三国，因为选其他的很多人不认这个IP，也许做了挣不回来钱，这对文化创作来说是一个很大制约。</p>\n  <p>但AI时代到来之后，成本下降，各种工具也把专家知识的门槛敲掉了。虽然现在质量还没有强到跟PGC能抗衡的阶段，但我观察到很多火出圈的AI游戏，关键往往在于题材吸引力非常突出。这种感觉有点像网络文学平台出现后对传统纸媒的冲击，因为大众能够把自己想表达的内容表达出来，并发布给整个社会看，整个生态里内容多样性会瞬间爆炸起来。同时，有很多消费者不在乎内容是谁做的，只要确实做了自己想要的内容，对东西感兴趣就会买单。</p>\n  <p>因此，我觉得AI时代最大的变化，是把生产关系从公司这种组织模式更多下放到个人身上。这一关系改变能够直接带来内容的极大繁荣，并填补互联网时代因为成本原因留下的一大块空白市场。这种迹象在很多自媒体平台已经能观察到，比如今年2026年第一款爆款游戏《青教模拟器》，就是Vibe Coding做的、讲青年教师的H5小游戏。</p>\n  <p><strong>刘士武：</strong>生产关系的变化，我觉得可能也是现在除内容行业外、AI正在颠覆的事情。有请艾文老师。</p>\n  <p><strong>艾文：</strong>我觉得有两点。1：AI native game的诞生，会出现更加符合AI能力的优秀玩法或游戏，能够让玩家真正为此付费。2：推理架构和算法的不断迭代，不断降低模型的推理成本。</p>\n  <p>一是商业验证：AI Native Game（AI原生游戏）的诞生与玩法重构</p>\n  <p>未来一年多，行业将迎来从“AI辅助开发”向“AI原生玩法”的实质性跨越。AI将不再仅仅是降本增效的幕后工具，而是真正进入游戏Runtime（运行态），成为核心博弈结构与互动方式的基石。</p>\n  <ul>\n   <li>玩法范式的跃迁：AI原生游戏将打破传统静态预设的框架，实现从“代码驱动”向“意图驱动”的进化。AI将作为“智慧主持人”深度参与，实现动态叙事、自适应难度以及玩家“言出法随”的规则改写。这种千人千面的实时交互体验，是传统游戏无法企及的。</li>\n   <li>重塑付费逻辑：当AI能够持续产出高质量的增量内容时，游戏的商业模式将从传统的“一次性买断”或“固定道具付费”，向“为动态体验时长付费”的持续性按需消费转型。例如，玩家可能为AI生成的专属剧情、定制角色或专属智能交互按Token积分付费，或采用AI内容会员订阅制。只有当AI原生玩法真正创造出难以复制的沉浸体验，并成功跑通上述新计费逻辑时，玩家才会心甘情愿地为AI带来的增量价值买单。</li>\n  </ul>\n  <p>二是底层支撑：推理架构与算法迭代驱动的成本拐点</p>\n  <p>AI原生玩法的大规模落地，高度依赖于底层算力成本的实质性下降。推理架构和算法的不断迭代，将是决定AI游戏能否从“概念”走向“规模化商业”的最关键物理变量。</p>\n  <ul>\n   <li>跨越算力成本鸿沟：当前，高质量AI生成与实时交互面临着高昂的算力开销，部分中小团队甚至面临“AI算力成本超过传统人工制作成本”的痛点。未来12-18个月，随着模型量化、蒸馏技术的成熟，以及边缘计算与云端弹性调度的优化，大模型推理延迟与成本将迎来显著下降。</li>\n   <li>商业模式闭环的催化剂：推理成本的降低将直接催生新的商业增量。只有当算力成本降至合理区间，诸如“云游戏AI算力租赁”、“游戏内原生AI增值付费”等三重收益结构才能真正实现盈利闭环。算法的迭代不仅是在优化技术指标，更是在为整个AI游戏产业打通从“成本中心”向“利润中心”过渡的最后一公里。</li>\n  </ul>\n  <p><strong>罗小我：</strong>我也非常同意艾文老师说的模型能力。从我们自己做模型、做工具的体感来看，有三点：</p>\n  <ul>\n   <li>模型能力的提升。比如我们自己3D模型、世界模型的能力提升，让大家能够很快速、很可用地去做这些资产，这里面也包括刚才提到的游戏开发Coding能力提升，我觉得帮助都很大。</li>\n   <li>产品形态上，我有一个推测：很多的流程可能会从一个Copilot形式变成一个更Agent的形式，包括我们自己内部也在做这样的一些探索。在游戏开发过程中，不论新工具还是老工具，很多仍是偏GUI、需要较强专业能力去操控的界面。���后随着大语言模型和多模态能力提升，大家可以用Agent方式更好地完成这些任务。</li>\n   <li>我们非常期待看到的，也是其他几位嘉宾和我们自己正在探索的事情：AI可以逐渐从生产工具阶段，走到运行阶段。在游戏运行中，大家能用AI生成文字、图片、视频，或生成3D内容、生成一个世界。这对之后的UGC发展、内容生态供给会有很大提升，也是我们非常期待看到的。</li>\n  </ul>\n  <p><strong>杨晟：</strong>我也同意罗老师的观点，模型能力到了SOTA，很多问题会迎刃而解，这确实是关键。我们跟AI的对抗、或者说AI游戏，其实从小时候玩《帝国时代》《红色警戒》就开始了——那时对手都是AI，只不过现在AI游戏的特点在于素材也可以由AI生成。对手的智商和策略，从当年到现在已经有指数级变化，但为什么市场上一直没有特别显著的变化？我认为本质上还是模型能力SOTA到了什么层级。因为就剧集、内容、影像来说，可以说已经到了某种SOTA阶段，这个行业在这一年时间里迅速爆发成长。我们认为在游戏、甚至在更复杂的3D世界里，也许只需要一两个月、两三个月，随着一次模型能力的大迭代，就可能一下子进入创作井喷，这个可能性特别大。</p>\n  <p>如果以一年为周期，对明年做一个预判，我认为这一年会迅速进入版权与IP合作的深水区。好莱坞用一百多年证明了一件事：发展到一定阶段后，头部机构会分别持有高价值版权，并形成相对独立的生态。模型厂商和基建方也会围绕不同的版权与IP建立各自的生态。像现在看到的北美微软生态、甲骨文生态，他们各自持有的IP完全不同，这些生态差异会导致游戏内容的呈现形式发生很大变化。因此在未来一年里，可能会有大量底模厂商、云厂商和应用厂商展开深度结合，跑出一批与大IP深度绑定的超级产品。像今年我们看到的007相关游戏表现很强，包括乐高蝙蝠侠等作品，都体现了这种趋势。到明年这个时候，我们会看到超级IP和超级模型的结合，这是必然。</p>\n  <p>所以，如果明年我们有机会再坐在这里聊，很可能会回顾两个问题：数字资产是如何流转的，以及怎样把Token从传统的“几十万Token几块钱”，提升到“几十万Token几百块钱”，这两种状态之间，可能就是一个巨大的产业差别。</p>\n  <p><strong>刘士武：</strong>从去年到今年，我们见证了AI漫剧、AI短剧以及AI游戏的崛起，今年到明年，可能会出现一个见证超级头部产品出现的时刻。期待，明年我还会再问杨晟老师。</p>\n  <p>本场圆桌的最后，给每位嘉宾两分钟聊一聊：如果今天这场圆桌，让在座观众以及后续看到这场分享的人，记住一个或几个观点，大家希望是什么？</p>\n  <p><strong>吴同：</strong>我认为，在AI内容创作行业，心流的构建是唯一值得我们努力的一件事情。当然有前提条件，我是一家初创公司，我也不在大厂任职，可能这是个有限制条件的观点。</p>\n  <p><strong>艾文：</strong>本次变革的驱动还是来自与模型本身的进步，很多场景需要在模型进步以后，才能浮现出来。我坚信AI颠覆游戏核心体验的时间很快就会到来，而且形式是出乎我们意料的。</p>\n  <p><strong>罗小我：</strong>我觉得有两点：</p>\n  <ol>\n   <li>AI 3D已经从一个Demo状态走到真实生产，很希望大家能够跟我们一起共建，一起参与到迭代里面。其实包括我们最早也跟晟哥有很多交流，帮助我们达到目前的状态。</li>\n   <li>想讲一个可能甚至在国外更有争议性的话题，AI重构游戏开发，并不是替代创作者，更多是重新分配创作者的时间，把非常繁琐、重复的工作替代掉，让大家把更多时间花到创意、艺术和创作上，去做更多内容、让生态更丰富。</li>\n  </ol>\n  <p><strong>杨晟：</strong>我们认为，这一年里，内容与游戏的边界、体验与产品的边界会越来越模糊，慢慢融合成一个整体。用户本身也会享受创作过程，我甚至是你们Tripo的会员，我真的会潜水看，大家在捏一个东西的过程中，本身已经参与互动，像我们小时候做纸面游戏设计一样。</p>\n  <p>未来，创作、制作、体验和消费产品之间的边界都会继续模糊。如何获得用户时间，并在用户投入时间的过程中形成收益，这个事情可能会成为未来商业化的重点。从时间当中去获得大的利益，以及通过我们线上一系列Token消耗和产品使用，怎样进一步转化为线下的商业认知和消费场景，包括后链路、智能硬件、机器人、具身智能，都会变得更加关键。就像刚才有嘉宾在台上提到的，我们现在做的这些线上算力与基建，如何在线下的智能硬件、音箱、玩具、机器人里创造更大价值，会成为接下来的主战场。而这个战场也会进一步模糊传统游戏与内容的界限——当一个机器人在你跟前、你跟它一起玩某个游戏时，很难说这到底是一段人生体验、一项家务，还是一段泛娱乐进程。</p>\n  <p>所以，从科技端在泛娱乐领域的表现来看，当这些界限越来越模糊时，未来的生活会是什么样？人的寿命越来越长，工作时间可能越来越短，PPT都不用做了，那么，人每天剩下的时间里，是什么在占据思考？是什么在消耗注意力？而占据这些时间与注意力的人，又依靠什么创造价值？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260803/v2_ddfbe8c5cc8a418683cb58e2454ed517@16519798_oswg417068oswg1080oswg718_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">刘士武丨36氪游戏 主编</p>\n  <p><strong>刘士武：</strong>感觉任何产品迭代、内容制作的过程，本身就是一种“创作体验”。也许有一天，我会用Funloom的产品做一款属于我的游戏，再把用VAST生成的3D模型注入进来，获得全新的视觉体验感，这样一整个过程对我来说可能也是一种很棒的体验。谢谢大家！</p>", "category": "tech", "published_at": "2026-08-03T11:39:13+00:00", "fetched_at": "2026-08-04T02:04:28.865486+00:00", "fingerprint": "d1ec3916591e97f9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宗馥莉同父异母兄弟出任新公司董事长；DeepSeek升至全球调用量第一；iPhone被曝最高或涨价超千元", "url": "https://36kr.com/p/3924467692927369?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>OpenAI下一代模型Astra曝光，以2000美元算力成本破解十项数学难题</p>\n  <p>江小白起诉东方甄选结果公布：东方甄选构成商业诋毁判赔30万</p>\n  <p>iPhone被曝最高或涨价超千元，折叠屏iPhone至少2000美元起售</p>\n  <p>多平台牛蛙抽检抗生素超标，有样本检测出禁用兽药</p>\n  <p>王思聪卸任万达产业投资公司董事</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>宗馥莉同父异母兄弟出任新公司董事长，实际控制人为杜建英</strong></p>\n  <p>据天眼查显示，7月31日，杭州天杞优品食品有限公司成立，注册资本为300万元，经营范围包含互联网销售、食品进出口、食品销售等。该公司由浙江三捷投资管理有限公司、百瑞源枸杞股份有限公司共同持股。股权穿透显示，杜建英为该公司实际控制人，宗继昌任公司董事长、经理、法定代表人。</p>\n  <p>2025年7月，宗继昌与宗婕莉、宗继盛三人起诉宗馥莉，三位原告被律师确认为宗馥莉的“同父异母兄弟姐妹”，寻求阻止宗馥莉处置汇丰银行账户资产，并追讨其父宗庆后生前承诺的21亿美元信托权益。（每日经济新闻、金融界）</p>\n  <p><strong>美国制裁洽洽瓜子、思念水饺等中国企业</strong></p>\n  <p>美国国土安全部牵头的相关工作组更新了对中国企业的进口限制清单，将在美国当地时间8月3日生效。包括洽洽食品、思念食品、七匹狼等在内的多家中国企业纳入限制范围，对其生产的相关产品进入美国市场实施进口限制。这意味着，曾经摆上美国消费者餐桌的瓜子、饺子、汤圆等中国食品，以及进入全球市场多年的中国服装品牌，都面临更高的贸易准入门槛。（新华社）</p>\n  <p><strong>DeepSeek-V4-Flash登顶全球调用量榜单第一</strong></p>\n  <p>《每日经济新闻》根据OpenRouter最新数据测算，上周（7月27日至8月2日）全球AI大模型总调用量为56.8万亿Token，环比下滑2.07%。其中，上榜的AI大模型中，中国AI大模型周调用量达28.13万亿Token，环比下滑14.76%；同期美国AI大模型周调用量为4.38万亿Token，环比增长87.18%。中国大模型周调用量连续十四周超过美国，稳居全球首位。</p>\n  <p>上周，全球调用量排名前五均为中国AI大模型。其中，DeepSeek-V4-Flash升至第一，周调用量达7.22万亿Token，环比增长13%；小米MiMo-V2.5位居第二，周调用量达6.3万亿Token，环比下滑40%；腾讯Hy3位居第三，周调用量达4.82万亿Token，环比增长22%；DeepSeek-V4-Pro升至第四，周调用量达3.28万亿Token，环比增长3%；智谱GLM-5.2位居第五，周调用量达2.89万亿Token，环比下滑12%。（每日经济新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>OpenAI下一代模型Astra曝光，以2000美元算力成本破解十项数学难题</strong></p>\n  <p>OpenAI当地时间8月1日发布有关数学和理论计算机科学的十项突破，这些成果由其下一代主要模型Astra的内部版本实现。按照Sol API的费率计算，找到这些问题的解决方案所需总词元（tokens）成本约为2000美元。十项突破涵盖高维球体堆积密度上限、二进制与球面码界限提升、非纯索菲群存在性证明、康涅斯刚性猜想的推翻、算术电路复杂性新下界、量子平行重复定理、最近向量问题的多项式因子近似难度证明、埃尔哈特体积猜想、多色拉姆齐数的超指数下界，以及极值数猜想等。（界面新闻）</p>\n  <p><strong>MiniMax H3正式开源</strong></p>\n  <p>36氪获悉，MiniMax正式开源新一代通用视频模型MiniMax H3。MiniMax H3是一个通用型全模态生成系统。它能够统一理解由文本、图像、视频和音频构成的多模态上下文，并可生成最高2K分辨率、最长15秒、带有原生立体声音频的视频。</p>\n  <p><strong>DeepSeek-V4-Flash正式版API登陆国家超算互联网</strong></p>\n  <p>36氪获悉，近日，DeepSeek-V4-Flash正式版API面向公众开启公测，国家超算互联网第一时间同步上线DeepSeek-V4-Flash模型API调用与下载服务。</p>\n  <p><strong>阿里巴巴正式发布新一代基座大模型Qwen3.8，总参数量2.4万亿</strong></p>\n  <p>36氪获悉，8月3日，阿里巴巴正式发布新一代基座大模型Qwen3.8，总参数量2.4万亿，在编程（Coding）和专业办公（Cowork）方面能力大幅提升。8月3日放榜的三方榜单Arena中，阿里Qwen模型仅次于Anthropic的Claude系列。目前，Qwen3.8的API已上线千问AI平台，并接入阿里当日同步推出的Agent产品“千问办公”。Qwen3.8-Max预计下周开源，同时还将开源Qwen3.8-27B。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>OpenAI官方商城开卖ChatGPT篮球，目前已缺货</strong></p>\n  <p>此前，OpenAI宣布推出首款联名硬件CodexMicro键盘。除了硬件周边以外，OpenAI官方商城还上架了一系列纪念品周边，含ChatGPT篮球、CodexT恤等。</p>\n  <p>值得注意的是，这批商品全部属于“SupplyCo.”分类。据官方所述，SupplyCo.最初只是为员工打造的一小批周边产品，结果几乎一推出就迅速火起来。不知从什么时候开始，这些物品已经不再是简单的周边，而是逐渐成为公司文化的实体象征。记者搜索发现，OpenAI官方商城内的ChatGPT篮球、CodexT恤等多款商品显示为缺货状态。（东方财经）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260804/v2_317ce0858ece4e6fbfc86e6269c99ab2@5667365_oswg351515oswg1006oswg1008_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">ChatGPT篮球</p>\n  <p><strong>江小白起诉东方甄选结果公布：东方甄选构成商业诋毁判赔30万</strong></p>\n  <p>2026年8月3日，最高人民法院发布依法规范平台经营、保护消费者合法权益典型案例，其中首次披露了2年前江小白起诉东方甄选案的判决结果。</p>\n  <p>2024年7月，东方甄选主播“天权”直播时因一段涉及白酒的言论引发广泛关注，相关表述包括“你现在去看江小白的包装，上面是没有‘白酒’这两个字，因为不允许”“买江津小曲就没有这个标（小金标），因为它不是固态蒸馏的，所以不能算固态（发酵）酒”等等。对此，江小白发布声明，指其误导消费者和拉踩江小白品牌，并向相关主管部门进行投诉之后提起诉讼。</p>\n  <p>最终法院认定某优选（北京）公司构成商业诋毁，并判令其赔偿重庆某酒业公司经济损失及合理开支共计30万元。一审宣判后，双方当事人均未上诉。（界面新闻）</p>\n  <p><strong>iPhone被曝最高或涨价超千元，折叠屏iPhone至少2000美元起售</strong></p>\n  <p>彭博社知名苹果记者马克·古尔曼8月2日发文称，iPhone预计会涨价100美元至200美元（约合675元至1350元人民币）。</p>\n  <p>古尔曼在回答网友提问时称，苹果肯定会在今年涨价，原因有很多。首先，它正面临内存芯片和主设备处理器的短缺问题。此外，iPhone 18 Pro和Pro Max采用的全新相机系统的成本也更高，更不用说首款可折叠iPhone更为昂贵的设计了。至于折叠屏iPhone，古尔曼让用户做好心理准备，它的起售价至少会达到2000美元，甚至更高。（每日经济新闻）</p>\n  <p><strong>杠杆ETF引发市场波动争议，韩国总统府高官面临刑事指控</strong></p>\n  <p>据报道，韩国总统办公室政策室长金容范（Kim Yong-beom）因涉嫌推动与单只半导体股票挂钩的杠杆ETF上市，被指控涉嫌滥用职权、强迫以及妨碍业务，相关刑事举报已正式提交。这些单股杠杆ETF被认为加剧了市场波动，并导致投资者遭受数十亿美元损失。（新浪财经）</p>\n  <p><strong>多平台牛蛙抽检抗生素超标，有样本检测出禁用兽药</strong></p>\n  <p>近期，澎湃新闻影子调查队联合公益机构上海紫藤社区环保服务中心（自然田）对多个电商平台牛蛙产品进行检测，发现多个批次样品抗生素超标，最高的超标逾5倍，有样本甚至检出禁用兽药呋喃唑酮。调查发现，生产工厂根据销售商要求，大批量收购、制作“常规”牛蛙（编注：即未检测或含抗生素的牛蛙），同时为销售方提供“无抗”牛蛙样品供检查；销售商则将这类所谓“常规”牛蛙出售到各地市场、饭店等。（澎湃新闻）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股普涨</strong></p>\n  <p>36氪获悉，8月3日收盘，美股三大指数集体收涨，纳指涨2.13%，标普500指数涨1.48%，道指涨1.32%。大型科技股普涨，Meta涨超6%，微软、亚马逊、谷歌涨超4%，特斯拉涨超3%，英伟达涨超2%。热门中概股涨跌不一，小鹏集团跌超4%，理想汽车跌超3%，蔚来、网易跌超1%，阿里巴巴涨超4%，爱奇艺涨超3%，拼多多、百度涨超1%，京东、哔哩哔哩小幅上涨。</p>\n  <p><strong>车龄3年电动车集中现电池故障投诉，车主投诉5万旧车换电池需9万</strong></p>\n  <p>近日，记者梳理车质网投诉情况发现，目前与动力电池相关的投诉已达到4.59万条。截至今年7月末，部分电车电池故障的投诉仍持续增加。其中不少车辆购于2022年至2023年，使用约3年后开始出现续航明显缩水、电池鼓包及漏液甚至车辆突然趴窝等问题。更令车主困扰的是，在前往4S店检测车辆后，却被告知电池健康度正常，无法达到免费维修或更换标准。还有车主反映，更换的电池并非沟通时承诺的全新电池，而这也引发了新的售后争议。</p>\n  <p>从近期公开投诉来看，出现动力电池故障的车辆大多购于2022年至2023年。如今车龄约三年，累计行驶里程可达到15万公里至25万公里，部分运营车辆甚至超过20万公里。某车主在车质网投诉称，车辆购买不到3年，电池包出现问题，车辆无法启动，4S店以车辆超过质保期限为由要求自费更换电池包，维修费用高达7万元至9万元，而车辆残值仅4至5万元，（华夏时报）</p>\n  <p><strong>PCB大牛股业绩暴涨1562%，两年股价累计涨幅超400%</strong></p>\n  <p>一博科技8月2日晚发布2026年半年度报告，公司实现营业收入7.09亿元，同比增长41.63%；归属于上市公司股东的净利润6382.93万元，同比增长1561.55%。</p>\n  <p>利润指标的大幅增长主因系公司近年投入运营的珠海一博电子PCB板厂、珠海一博科技IPO募投项目、天津一博电子PCBA工厂经历了前期的爬坡过坎后，发展进入新阶段，订单增长势头良好，三家厂已基本度过月度盈亏平衡点，逐步开始贡献利润，并呈逐月向好趋势发展。</p>\n  <p>一博科技曾是大牛股，Wind数据显示，2024年2月8日至2026年7月1日，该股股价累计涨幅超400%。7月2日以来，该股股价持续回调，Wind数据显示，7月2日—7月31日，该股股价累计下跌超35%。（中国证券报）</p>\n  <p><strong>王思聪卸任万达产业投资公司董事</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，万达产业投资有限公司发生高管变更，王思聪卸任该公司董事。该公司成立于2021年1月，法定代表人为王健林，注册资本1亿人民币，经营范围包含以自有资金从事投资活动、创业投资等。</p>\n  <p><strong>欧盟《人工智能法案》透明度规则正式生效</strong></p>\n  <p>欧盟《人工智能法案》的核心透明度条款正式生效，标志着全球首部全面监管人工智能的法律进入实质执行阶段。根据新规，聊天机器人等交互式系统必须明确告知用户其正在与人工智能而非人类互动；利用AI生成或修改的图像、视频、音频及文本内容，须进行清晰标识并附带机器可读的数字标记。（新浪财经）</p>\n  <p><strong>澳大利亚提高对未能与当地媒体达成新闻合作协议的科技巨头的征税比例</strong></p>\n  <p>澳大利亚政府上调了一项拟议中的征费，该征费将迫使科技巨头若未能与当地媒体就其平台上的新闻内容达成商业协议，则需支付数百万美元的费用。政府周一表示，已将其计划中的“新闻谈判激励计划”的征税比例从2.25%上调至2.5%。政府表示，与先前的提案相比，该税费将仅根据科技公司的广告收入计算，而非其全部业务收入。该税项适用于在澳大利亚拥有“重要”社交媒体或搜索服务，且当地收入超过2.5亿澳元（1.757亿美元）的公司，涵盖Meta、Google等。此外，针对专业社交网站的豁免条款已被取消，LinkedIn因此也被纳入监管范围。政府表示，所筹集的所有资金都将用于新闻媒体行业，以支持本地新闻业。（新浪财经）</p>\n  <p><strong>游戏业重磅收购���入倒计时：电游开发巨头EA将正式易主沙特财团</strong></p>\n  <p>据欧盟委员会上周五发布的一份文件，沙特阿拉伯主权财富基金——公共投资基金（PIF）与一个投资者财团已根据欧盟的外国补贴法规，获得欧盟批准以550亿美元收购全球电子游戏开发巨头艺电（EA）。在上周四提交的另一份监管文件中，EA确认截至7月30日已获得所有必要的监管批准，并预计该交易将于8月4日完成。（新浪财经）</p>\n  <p><strong>知情人士回应香港IPO传闻：消息不实</strong></p>\n  <p>36氪获悉，8月3日，有报道称，月之暗面计划最早于本月内提交香港IPO申请，或募资约30亿美元。对此，有知情人士表示，此消息不实。（每日经济新闻）</p>\n  <p><strong>中国牵头的区块链国际标准在国际标准化组织（ISO）立项</strong></p>\n  <p>记者在8月3日了解到，由中国牵头的国际标准《区块链和分布式记账技术区块链即服务的技术框架和功能要求》近日在国际标准化组织成功立项。德国、英国、爱尔兰、日本、葡萄牙、乌干达等国将派员参与制定。区块链即服务是应用最广泛的区块链商业化服务模式之一，具有门槛低、成本可控、灵活可扩展等优势，成为全球企业探索区块链技术应用的主流选择。据行业研究机构统计，基于区块链即服务搭建的区块链应用项目超过10万项，覆盖供应链金融、产品溯源、数字存证等领域。（央视新闻）</p>\n  <p><strong>股票私募平均仓位创逾4年新高</strong></p>\n  <p>记者8月3日从第三方机构私募排排网独家获悉，自6月26日以来，国内股票私募已连续4周保持加仓态势，平均仓位累计上升2.12个百分点。截至7月24日，股票私募平均仓位已攀升至84.12%，较前一周微涨0.02个百分点。这一数据不仅延续了稳步上行的趋势，更意味着7月24日的平均仓位已创下4年多以来的新高。回溯历史，上一次股票私募平均仓位高于84.12%，还要追溯到2022年4月1日，当时股票私募平均仓位为84.30%，略高于目前水平。（中证报）</p>\n  <p><strong>北京发放2000万元观影补贴</strong></p>\n  <p>第38届大众电影百花奖将于近日开幕。作为百花奖配套活动的“2026北京仲夏电影嘉年华”昨晚在北京启动，以此为契机，北京将推出2000万元的观影补贴。“2026北京仲夏电影嘉年华”拉开帷幕，多项亮点措施现场发布。北京将在蓝色港湾、首钢园、通州运河西岸等12个核心场地开展53场露天放映，增设深夜延时放映场次，并设置全市3000余个公益放映点。此外，北京将进一步深化跟着电影游北京、品美食、逛市集、看展览等“电影+”主题系列品牌，联动全市40余个商圈、1100余家商户升级票根经济，充分激活夏日消费动能。（央视财经）</p>\n  <p><strong>全球“最火”存储ETF纳入长鑫科技，为该ETF的第8大重仓股</strong></p>\n  <p>7月底，全球“最火”内存ETF——Roundhill Memory ETF（DRAM）进行了调仓，再度纳入A股公司长鑫科技（688825），权重为2.52%，为该ETF的第8大重仓股。兆易创新降为该ETF的第10大重仓股，权重为1.51%。兆易创新6月首次被纳入，当时权重为2.91%。</p>\n  <p>Roundhill Memory ETF专注于内存芯片企业，截至8月2日，该ETF前三大持仓分别为三星电子、美光科技和SK海力士，权重分别为26.39%、24.54%和22.77%。其他主要持仓包括希捷科技、西部数据、闪迪、铠侠、南亚科技。（财联社）</p>\n  <p><strong>加拿大第二大航司西捷航空罢工，25万名旅客行程被迫取消</strong></p>\n  <p>加拿大第二大航空公司西捷航空的空乘人员于当地时间周日开启罢工行动，导火索为薪酬劳资纠纷。代表该航司4400名客舱乘务员的加拿大公共雇员工会在脸书官方页面宣布罢工。西捷航空方面确认罢工已发生，航班追踪平台FlightAware数据显示，航司当地时间周日直接取消495个航班。正值加拿大三日小长假出行高峰，本次罢工严重扰乱全国出行秩序。西捷航空表示，此次罢工导致25万名旅客行程被迫取消。（新浪财经）</p>\n  <p><strong>特朗普媒体集团推出高价付费数据服务，引发市场质疑与合规争议</strong></p>\n  <p>特朗普媒体科技集团近日正式推出名为“Truth API”的企业级数据接口服务，向金融机构及专业投资者出售社交平台“真实社交”（Truth Social）特定账号的实时数据订阅权限。由于该服务允许付费用户提前获取包含美国总统特朗普在内的关键账号言论，且预估月订阅费高达数万美元，随即在华尔街、学术界及法律界引发关于内幕交易、市场不公及政商利益冲突的强烈质疑。据了解，该数据接口服务于当地时间8月1日面向机构客户开放。（新浪财经）</p>\n  <p><strong>李强签署国务院令，公布修订后的《集成电路布图设计保护条例》</strong></p>\n  <p>国务院总理李强日前签署国务院令，公布修订后的《集成电路布图设计保护条例》，自2026年10月15日起施行。（新华社）</p>\n  <p><strong>行云科技：在手算力、存储类3-5年期长期框架订单规模超154亿元</strong></p>\n  <p>36氪获悉，行云科技在机构调研中表示，截至2026年7月末，公司在手算力、存储类3-5年期长期框架订单规模超154.04亿元，合作客户涵盖头部央企上市公司及头部大模型研发机构等。资金层面，公司累计获批综合授信180.24亿元，已批复授信102.64亿元，充沛的资金储备可全面覆盖百亿订单履约及算力产能持续扩张需求。</p>\n  <p><strong>抖音生活服务增长超预期，年中上调全年交易额目标</strong></p>\n  <p>36氪独家获悉，得益于与主端UGC内容的协同效应，本地生活短视频和搜索流量增长超预期，带动抖音生活服务2026年上半年交易额同比增长超50%，超额完成既定目标。平台已于年中上调全年交易额目标。独立App“抖省省”成为另一关键增量来源。今日，抖省省上线“找店”入口，进一步强化用户粘性与找店心智，通过“找品+找店”双轮驱动，与抖音主端形成更多协同。目前抖省省日活跃用户数已突破1500万，本地生活入口心智持续增强。</p>\n  <p><strong>蚂蚁灵波确认融资传闻：将持续聚焦通用机器人大脑，加速产业落地</strong></p>\n  <p>36氪获悉，蚂蚁灵波已启动首轮融资，拟募资15亿元，目标在今年年底完成二轮融资。对此，蚂蚁灵波回应称：确实在跟投资人接触，蚂蚁灵波作为蚂蚁在具身领域的核心布局，将持续聚焦通用机器人大脑，加大对具身原生技术路线的投入，加速产业落地。</p>\n  <p><strong>韩国央行时隔13年增持黄金</strong></p>\n  <p>韩国央行借助上市交易基金（ETF）重启黄金投资，这是时隔13年再度购金。央行还计划拓宽国产黄金收购渠道，中长期持续增持实物黄金。据韩国央行数据，截至今年6月末，韩国外汇储备规模为4273.6亿美元，其中黄金储备价值47.9亿美元，占比1.1%。韩央行持有的104.4吨黄金全部存放于英格兰银行。韩国央行曾在2011—2013年购入90吨黄金，此后长达13年没有新增黄金持仓。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>药明康德：上半年净利润为110.8亿元，同比增长33.7%</strong></p>\n  <p>36氪获悉，药明康德公告，上半年公司实现营业收入人民币289亿元，同比增长38.9%。上半年净利润为110.8亿元，同比增长33.7%。截至2026年6月末，公司持续经营业务在手订单人民币664.3亿元，同比增长25.2%。</p>\n  <p><strong>瑞幸咖啡：二季度总收入158.86亿元，同比增长28.5%</strong></p>\n  <p>36氪获悉，瑞幸咖啡发布2026年第二季度财报。财报显示，瑞幸咖啡二季度总净收入158.86亿元，同比增长28.5%；净利润14.86亿元，同比增长16.1%。</p>\n  <h2>投融资</h2>\n  <p><strong>“破壳机器人”完成亿美元级Pre-A轮融资</strong></p>\n  <p>36氪获悉，近日，通用具身智能公司“破壳机器人”完成亿美元级Pre-A轮融资。本轮融资由顺为资本与经纬创投共同领投，九坤创投、钧山资本、SEE Fund、猎聘投资、元诺资本、钟鼎资本等多家财务及产业投资机构参与，云启资本、小米战投、弘晖基金、英诺天使基金、东方嘉富等老股东持续加注。</p>\n  <p><strong>“昉擎科技”完成A1轮融资，估值突破百亿</strong></p>\n  <p>36氪获悉，近日，“昉擎科技”完成A1轮融资，估值突破百亿元人民币。本轮融资由徐汇资本、珠海科技产业集团领投，中金资本、国泰海通创意投资、九安医疗旗下尚势资本、水木创投、明嘉资本等参与投资。老股东钧山资本大额加注，多维资本、华业天成、临港科创投、建发新兴、三七互娱等同步超额追投。公司本轮融资资金将主要用于自研芯片与系统的研发、规模化量产、软件生态建设及高端人才引进。</p>\n  <p><strong>“主动科技”完成3.3亿元人民币天使轮融资</strong></p>\n  <p>36氪获悉，8月3日，“主动科技”宣布完成3.3亿元人民币天使轮融资，创下中国脑机接口领域天使轮融资纪录。本轮融资由中科创星领投，联想之星、九合创投、道彤投资、英诺天使基金、华大松禾生科基金、济峰资本、嘉道资本共同投资。所募资金将主要用于场地扩展、设备完善、临床试验推进与团队扩充等方面，全面加速侵入式脑机接口产品的临床转化与产业化落地。</p>\n  <p><strong>“幺正量子”完成数亿元A轮融资</strong></p>\n  <p>36氪获悉，近日，“幺正量子”完成数亿元A轮融资。本轮融资由深创投领投，社保基金湾区科技创新股权投资基金（深圳）合伙企业（有限合伙）与深圳市创新资本投资有限公司联合出资，广发信德、京铭资本、普华资本、启赋资本、兴泰资本、达晨财智、华控基金、首程控股、协鑫能科、灏浚投资、凯联资本、芯能创投、众为中国等多家机构跟投。资金将主要用于加速研发攻关，瞄准量子优越性与量子纠错目标，持续强化公司QCCD技术路线的全栈能力。</p>\n  <p><strong>“亿维特航空”完成数亿元A+轮融资</strong></p>\n  <p>36氪获悉，电动垂直起降飞行器（eVTOL）研发制造商“亿维特航空”近日完成数亿元A+轮融资。本轮融资由上城资本、普华资本等投资，深蓝资本担任独家财务顾问。截至目前，亿维特航空已获得国家级基金、上市公司及地方国资等多方资本支持。</p>\n  <p><strong>整理</strong>｜王浩阳&nbsp;</p>", "category": "tech", "published_at": "2026-08-04T00:18:04+00:00", "fetched_at": "2026-08-04T02:04:28.865470+00:00", "fingerprint": "0465be53f0111aff"}, {"source": "少数派", "title": "角落新声｜两平米、两个角落，安放两个自己", "url": "https://sspai.com/post/112551", "summary": "编者按：本文是「角落新声」征文活动的入围文章。本次主题征文由声擎冠名，邀你前来分享那个让你放松娱乐、拥抱汩汩心流、逃离尘世纷扰、找回本真自我的理想一隅。8月7日前投稿参与，即有机会获得声擎Cyber5 ...<a href=\"https://sspai.com/post/112551\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-03T02:52:56+00:00", "fetched_at": "2026-08-04T02:04:27.330944+00:00", "fingerprint": "a14697c11f85063a"}, {"source": "少数派", "title": "职人专访 #001：少数派背后的理想主义", "url": "https://sspai.com/post/112966", "summary": "因为这款手机壳，我跟老麦聊了一下午。<a href=\"https://sspai.com/post/112966\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-03T06:03:08+00:00", "fetched_at": "2026-08-04T02:04:27.330938+00:00", "fingerprint": "834bd3c4b071e7a0"}, {"source": "少数派", "title": "把折叠屏外屏做成手机后：iKKO MindOne Pro 体验", "url": "https://sspai.com/post/112685", "summary": "在如今智能手机市场高度同质化、各家都在公模和微创新里打转的时代，一台形态奇特的设备总是能轻易抓住数码爱好者的眼球。前段时间，我在浏览iKKO官网时，被一台名为MindOnePro的手机吸引了。它接近正 ...<a href=\"https://sspai.com/post/112685\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-03T07:35:11+00:00", "fetched_at": "2026-08-04T02:04:27.330931+00:00", "fingerprint": "7a11e90fa63ee471"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/113040", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/113040\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-08-03T10:09:00+00:00", "fetched_at": "20
