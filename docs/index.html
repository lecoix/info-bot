url": "https://www.theverge.com/ai-artificial-intelligence/1038063/nvidia-stock-market-price-earnings", "summary": "\"We've got this,\" Colette Kress, interim CEO of Nvidia, said Tuesday night as she closed out the embattled chip company's third quarter earnings call. By Thursday, the company's stock price was hovering at around $150 per share, a nearly 40 percent drop from its all-time high on October 6th, and wiping out a brief post-earnings [&#8230;]", "category": "tech", "published_at": "2026-11-19T21:59:35+00:00", "fetched_at": "2026-11-20T05:29:29.012545+00:00", "fingerprint": "a16a060150c59a52"}, {"source": "The Verge", "title": "Apple is hiring engineers to build its own AI agent", "url": "https://www.theverge.com/tech/1038227/apple-ai-agent-engineer-job-listing", "summary": "Apple is working on its own AI agent that can perform a range of tasks for you, including browsing the web, working across apps, writing code, and calling services. That's according to a job listing spotted by Bloomberg, which says Apple is looking for an engineer to lead the creation of an agentic AI assistant. [&#8230;]", "category": "tech", "published_at": "2026-11-19T22:31:41+00:00", "fetched_at": "2026-11-20T05:29:29.012534+00:00", "fingerprint": "f8133dc16aac0ad5"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨Anthropic上市首日暴涨17%；宗馥莉原“心腹”起诉娃哈哈；OpenAI进军手机领域", "url": "https://36kr.com/p/4077339293242504?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Kimi API服务出现可用性下降，官方调查中</li>\n   <li>谷歌推出Gemini 4 Neon模型</li>\n   <li>马斯克点赞深圳，称是中国的超级粉丝</li>\n   <li>欧莱雅将收购阿玛尼15%股权</li>\n   <li>Meta因面临法律挑战暂停新股发行计划</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>Anthropic上市首日暴涨17%</strong></p>\n  <p>人工智能公司Anthropic正式登陆纳斯达克，发行价为83美元/股，开盘报111.5美元，较发行价上涨34%。股价开盘大幅冲高后有所回落，最终收于97.17美元，较83美元的发行价上涨17%。按照完全稀释后的股本计算，公司市值约为1.8万亿美元，跻身全球市值最高的10家上市公司之列。</p>\n  <p>此次IPO募资813亿美元，已经超过SpaceX（SPCX）今年6月创纪录的IPO规模。此外，Anthropic还通过同期私募配售募集260亿美元，合计融资达到1073亿美元。（金十数据）</p>\n  <p><strong>宗馥莉原“心腹”起诉娃哈哈，下周开庭</strong></p>\n  <p>11月19日，天眼查App显示，原告祝丽丹与被告娃哈哈商业股份有限公司新增一则开庭公告，涉及涤除公司登记（备案）纠纷案件，该案将于11月26日在浙江省杭州市钱塘区人民法院开庭审理。这起诉讼本质上是祝丽丹离职后试图把自己的名字在工商备案中删掉。</p>\n  <p>2024年，宗馥莉正式接管娃哈哈后，祝丽丹深度参与管理改革，接管人事、供应链、生产等核心部门，代表宗馥莉出席中层会议，并在150多家“娃哈哈系”“宏胜系”企业中担任法定代表人或高管。直到2025年11月 ，祝丽丹卸任宏胜集团法定代表人、经理，由郑群娣接任，名字转入历史主要人员名单。（中国新闻周刊）</p>\n  <p><strong>OpenAI进军手机领域，富士康旗下富智康集团获组装订单</strong></p>\n  <p>11月19日，记者从供应链获悉，富士康旗下富智康集团(02038.HK)已获得OpenAI手机项目订单，将参与相关产品的整机组装。富士康同时是苹果iPhone的主要组装商。若OpenAI手机最终面市，其将进入手机终端市场，并可能围绕AI交互体验，与现有手机品牌展开更直接的竞争。相关产品方案、订单规模及量产安排，仍有待进一步获悉。(证券时报)</p>\n  <h2>AI最前沿</h2>\n  <p><strong>谷歌推出Gemini 4 Neon模型</strong></p>\n  <p>谷歌正式推出Gemini 4 Neon。据介绍，企业日常业务高度依赖电子表格、PDF文档、图表及音视频资料。Neon能够在单个100万token上下文窗口内同步处理各类异构数据，并将其整合为结构化交付物。该模型定价为每百万输入token 3美元（缓存输入token享0.5折优惠，仅需0.15美元/百万），每百万输出token 15美元。（界面新闻）</p>\n  <p><strong>火山引擎上线豆包实时音视频通话模型API服务</strong></p>\n  <p>36氪获悉，火山引擎正式上线豆包实时音视频通话模型(SeedRealtime1.0)API服务，带来全模态交互的新体验。SeedRealtime将声音、画面、时序与表达统一到同一个端到端模型中，能在连续的多模态信息流上实时交互，带来“边看、边听、边说”的全新体验。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>Kimi API服务出现可用性下降，官方调查中</strong></p>\n  <p>11月19日，月之暗面官方服务状态页面显示，Kimi API服务出现可用性下降问题，可能影响部分用户的使用体验。目前，官方已介入调查，但尚未公布具体故障原因及预计恢复时间。</p>\n  <p>本次异常通报发布于11月19日17时25分，受影响组件被标注为“Kimi API Service”。官方状态面板一度将该组件列为“Major Outage”，意味着通过API调用相关服务的开发者及第三方应用可能遇到请求失败、连接异常或服务不稳定等情况。（凤凰网）</p>\n  <p><strong>奥尔特曼回应Anthropic上市，称OpenAI也计划上市</strong></p>\n  <p>11月19日，随着竞争对手Anthropic即将上市，OpenAI首席执行官兼联合创始人奥尔特曼周三表示，OpenAI也在继续推进自身的IPO计划。“我们计划上市，”奥尔特曼在DealBook峰会上表示，并补充说“有许多理由表明这是正确的决定”。当被问及英伟达创始人兼前首席执行官黄仁勋的离职时，奥尔特曼称，“很难想象没有黄仁勋的人工智能行业。”</p>\n  <p>根据公开资料整理，OpenAI已于今年6月8日向美国证券交易委员会递交保密版S-1上市申请文件，公司当时表示尚未确定上市时间。(科创板日报)</p>\n  <p><strong>马斯克点赞深圳，称是中国的超级粉丝</strong></p>\n  <p>美国特斯拉公司首席执行官埃隆·马斯克11月19日在深圳说：“我是中国的超级粉丝。”他说：“中国很酷。我一直鼓励世界各地的人们来中国走走，亲眼看看中国这些了不起的地方。这里有不可思议的城市、不可思议的自然风光，还有像兵马俑这样的世界奇迹。”马斯克说：“美中合作越多，各自也会越好。”中国贸促会会长任鸿斌当天在深圳会见马斯克。（央视新闻）</p>\n  <p><strong>美国技术系统故障密集爆发，苹果、万豪、谷歌同日发生网络故障</strong></p>\n  <p>当地时间17日，美国苹果公司发生大规模网络技术故障，目前部分系统已恢复运行。苹果公司同时表示，此次故障并非网络攻击所致。此外，万豪国际酒店集团在17日也遭遇网络技术故障，影响其网站和手机应用程序的账户登录功能。万豪随后表示，相关技术故障已经解决，没有迹象表明事件与网络攻击有关。</p>\n  <p>美国近期接连出现多起技术系统故障，涉及微软云服务、美国联邦航空局空中交通管制系统以及部分银行网络服务。目前尚无证据表明这些故障存在关联。(央视财经)</p>\n  <p><strong>燧原科技股价四天累计跌超36%，市值缩水近900亿元</strong></p>\n  <p>11月19日，国产算力“四小龙”成员燧原科技-U股价低开低走，遭遇20%跌停。最近四个交易日，其股价连续下跌，累计跌幅超过36%，市值蒸发近900亿元。</p>\n  <p>从盘面看，19日燧原科技-U开盘价为430元，开盘价即为全天最高价，最低价为364.33元，也是收盘价，单日跌去91.08元，全天成交额为19.62亿元，换手率高达28.35%，交投显著放大。（金融投资报）</p>\n  <p><strong>谷歌英伟达微软认购Anthropic</strong></p>\n  <p>美东时间18日，美国人工智能公司Anthropic宣布，公司首次公开募股、也就是IPO发行价定在每股83美元，这一定价高于公司此前的预估。按这一发行价测算，公司完全稀释后的估值达到约1.5万亿美元。公司预计于当地时间19日在纳斯达克挂牌交易。&nbsp;</p>\n  <p>据知情人士透露，本次Anthropic IPO定价前，认购订单规模接近可售股数的7倍。最终发行价突破原定的70至78美元区间，A类普通股发行规模由此前计划的8.25亿股上调至9.8亿股。本次IPO基础发行部分预计募资约813亿美元，超过SpaceX今年6月创下的750亿美元IPO基础募资纪录。此外，Anthropic还同步安排了260亿美元的私募配售，谷歌、英伟达、微软、超威半导体等公司参与认购。（央视财经)</p>\n  <p><strong>2027届全国普通高校毕业生规模预计1299万人</strong></p>\n  <p>11月19日，记者从2027届全国普通高校毕业生就业创业工作会议上获悉，2027届全国普通高校毕业生规模预计1299万人，各地各部门将强化协同、央地联动，全力确保2027届高校毕业生就业总体稳定。 （央视新闻）</p>\n  <p><strong>长鑫科技：审议通过25亿元-50亿元回购方案</strong></p>\n  <p>长鑫科技(688825.SH)公告称，公司于2026年10月30日召开第二届董事会第八次会议审议通过回购方案，2026年11月3日收到董事长朱一明提议将回购金额增加至不低于人民币25��元（含），不超过人民币50亿元（含）。2026年11月19日，公司召开第二届董事会第九次会议审议通过调整回购方案。回购价格不超过人民币63.78元/股（含），回购股份用途为股权激励/员工持股计划、注销并减少注册资本及为维护公司价值及股东权益。</p>\n  <p>此前，长鑫科技11月4日公告，公司收到董事长朱一明的提议，提议将回购金额由“不低于人民币10亿元（含），不超过人民币20亿元（含）”增加至“不低于人民币25亿元（含），不超过人民币50亿元（含）”。（财联社）</p>\n  <p><strong>欧莱雅将收购阿玛尼15%股权</strong></p>\n  <p>法国美妆巨头欧莱雅正在向奢侈品行业迈出更重要的一步。据报道，欧莱雅正牵头组建投资财团计划收购意大利奢侈品牌阿玛尼Giorgio Armani合计约15%的股权，其中欧莱雅拟取得约10%的股份，全球眼镜巨头依视路陆逊梯卡则可能收购最多5%的股份，法国奢侈品集团LVMH已经退出相关谈判。</p>\n  <p>目前，各方谈判仍在进行，尚未达成最终协议，交易的核心分歧集中在阿玛尼的整体估值及其他交易条款上，相关集团暂未对此作出正式回应。(新浪财经)</p>\n  <p><strong>黄仁勋女儿现身全员会，看起来“状态不错”&nbsp;</strong></p>\n  <p>当地时间11月18日上午，英伟达在加州圣克拉拉总部召开全员大会，线下会议与微软Teams直播同时进行，全程近一小时。黄仁勋的女儿麦迪逊·黄（Madison Huang）也出现在这场大会上。直播镜头几次给到她本人特写，画面中“她看起来是高兴的，还进行了鼓掌”。</p>\n  <p>这是黄仁勋辞职后，公司第一次面对全体员工。过去33年，这类会议通常由黄仁勋亲自主持，员工可以直接向他提问。这一次，站在台上的是克雷斯，惯常的现场问答环节没有保留。（凤凰网科技）</p>\n  <p><strong>Meta因面临法律挑战暂停新股发行计划</strong></p>\n  <p>Meta Platforms已暂停发行一种新类别股票的计划。该计划原本旨在帮助公司为人工智能（AI）支出筹集更多资金，但目前Meta正面临股东提起的诉讼。Meta在周三提交的法庭文件中表示，在相关法律诉讼进行期间，公司不会发行新的C类股票（Class C shares）。首席执行官马克·扎克伯格及其他董事会成员正因这一原定于明年1月生效的计划，面临多名股东提起的诉讼。相关案件定于明年4月开庭审理。（新浪财经）</p>\n  <p><strong>沃尔玛财报预期：美国消费者承压之下，公司市场份额有望继续扩张</strong></p>\n  <p>面对持续通胀环境，沃尔玛有望再度扩大市场份额。根据一致预期数据，沃尔玛营收预计达到1872亿美元，调整后每股收益预期为0.64美元。不过，美国同店销售同比增速预计将放缓至2.9%。财报发布前夕，德意志银行分析师克里斯蒂娜・卡塔在客户研报中写道：“我们认为当前通胀环境将进一步凸显沃尔玛的高性价比定位，推动市场份额加速提升；同时投资者也越来越不再只盯着美国同店销售的表面压力。”本季度，她将沃尔玛评级从中性上调至买入。（新浪财经）</p>\n  <p><strong>海光信息：首次回购公司股份137.67万股，支付2.35亿元</strong></p>\n  <p>36氪获悉，海光信息公告，2026年11月19日，公司首次通过上海证券交易所交易系统以集中竞价交易方式回购公司股份137.67万股，占公司总股本23.24亿股的比例为0.06%，回购成交的最高价为174.99元/股，最低价为162.69元/股，支付的资金总额为人民币2.35亿元（不含交易佣金等交易费用）。</p>\n  <p><strong>马斯克披露多项业务时间表</strong></p>\n  <p>当地时间11月18日，特斯拉CEO埃隆·马斯克通过视频连线参加美国奥斯汀举行的TomorrowX峰会，并披露旗下多项业务进展。他表示，Optimus人形机器人有望在未来12至18个月内完成洗碗、清洗烘干并收纳等家务；Terafab研究工厂计划于明年6月试产首款测试芯片，并争取在2028年底实现第一阶段量产；xAI目前每月新增约0.5吉瓦算力，明年将提高至每月超过1吉瓦。马斯克还称，星舰实现完全、快速重复使用后，进入轨道的成本有望降低约100倍；Neuralink目前已为30多名受试者植入脑机接口设备。谈及英伟达时，他将CEO黄仁勋比作迈克尔·乔丹，称其是科技企业创始人中的顶尖人物，若失去黄仁勋的领导，对英伟达将是重大打击。(界面新闻)</p>\n  <p><strong>叶国富回应名创优品越卖越贵</strong></p>\n  <p>自名创优品年初正式宣布从生活杂货零售商转向全球IP运营平台后，有消费者在社交媒体吐槽其产品越来越贵。查询名创优品天猫官方旗舰店了解到，在其IP专区，以Chiikawa系列产品为例，坐姿公仔、站姿公仔的价格是99.9元，毛绒公仔的价格也是99元，小蜜蜂公仔的价格是59.9元。 这一价格较消费者以往对名创优品“平价杂货”的印象出现了明显的上移。</p>\n  <p>在11月17日举行的2026年三季度业绩电话会上，名创优品创始人、CEO（首席执行官）叶国富对相关问题做出了回应。他表示：“从价格结构来看，第三季度10元至30元的核心价格带仍销售超过四成；发生变化的是50元以上的价格带，销售额贡献接近20%，相比去年同期提升了6个百分点，替代了10元以下的热门价格带。”(界面新闻、每日经济新闻)</p>\n  <p><strong>联想集团收购老牌BIOS厂商</strong></p>\n  <p>11月19日，联想集团最新财报附注披露，联想于今年4月27日以约5000万美元现金，收购老牌计算机固件厂商Phoenix Technologies EMEA Limited的全部权益及相关业务。根据财报披露的暂定公允价值评估，这笔收购确认了约2700万美元无形资产及2595万美元商誉。</p>\n  <p>收购完成后，Phoenix在本财年上半年未贡献外部收入，并录得约900万美元税前亏损。Phoenix长期从事计算机BIOS及固件技术开发。BIOS/UEFI固件负责计算机启动、硬件初始化及部分底层配置与安全功能，是连接硬件平台与操作系统的重要基础软件，预计联想将为端侧AI的底层重构进行更大动作。（第一财经）</p>\n  <p><strong>华为希望苹果调整iOS蓝牙配对机制，解决新旧版本配对兼容问题</strong></p>\n  <p>近日，开发者Aaron发现，华为通过苹果面向欧盟开发者开放的互操作性申请渠道，要求苹果允许应用仅在iOS 26.1及更新版本中启用AccessorySetupKit 框架，以便不同iOS版本的用户能够使用不同的蓝牙配对方式。目前，这项功能的启用方式存在限制：应用一旦接入 AccessorySetupKit，蓝牙设备发现机制就会受到影响，无法仅针对iOS 26.1及更新版本启用新配对界面，同时为旧版本用户保留原有操作流程。华为希望苹果调整iOS蓝牙配对机制，解决新旧版本配对兼容问题。</p>\n  <p>苹果目前通过欧盟《数字市场法案》（DMA）第6条第7款规定的互操作性机制，允许开发者申请访问iOS和iPadOS内部由苹果控制的硬件及软件功能。苹果官方说明，该申请需要经过资格评估、方案设计以及开发发布三个阶段，是否批准以及最终实现方式仍由苹果评估决定。(IT之家)</p>\n  <p><strong>美三大股指集体收跌，AMD重挫近8%</strong></p>\n  <p>北京时间11月20日早间，美三大股指集体收跌。道琼斯指数跌2.19%，标普500指数跌2.02%，纳斯达克综合指数跌2.25%。</p>\n  <p>Anthropic纳斯达克首秀，收涨17.07%，报97.17美元/股，市值达1.27万亿美元。AMD重挫近8%，受此拖累，芯片股高开低走，英伟达跌3.30%，连续第六天下跌，美光科技、博通跌超2%。其他权重科技股也多数下挫，亚马逊跌3.87%，Meta、SpaceX跌超3%，谷歌跌近3%；英特尔涨近2%。（北京日报）</p>\n  <p><strong>宝洁拟到2030年削减最多30%制造和物流员工</strong></p>\n  <p>宝洁公司计划到本十年末将制造和物流员工人数削减20%至30%，因价格压力不断上升。宝洁表示，目标是到2030年通过提高生产效率累计节省100亿美元成本。随着通胀导致消费者削减部分购买，该公司一直在应对油价上涨和消费者需求疲软。宝洁在2025年5月的一份申报文件中表示，约35个国家的约52000名员工负责生产公司的产品。（新浪财经）</p>\n  <p><strong>英伟达与微软将加速计算从Azure扩展至Windows PC</strong></p>\n  <p>英伟达表示，正在与微软扩展全栈合作。旗下Vera Rubin NVL72系统现已在微软Azure数据中心运行，使企业能够在云端和本地Windows PC上定制AI模型并部署应用。（财联社）</p>\n  <p><strong>字节拟追加5亿美元微软云服务合同</strong></p>\n  <p>据市场消息，字节跳动正在与微软进行谈判，计划在现有合同基础上，追加约5亿美元微软云服务支出，主要用于通过微软Azure使用OpenAI模型，目前交易尚未完成。微软拥有向客户转售OpenAI技术的权利，微软方面认为字节跳动主要将OpenAI模型用于包括软件开发在内的任务。 不包括该笔在谈合同，据估算，字节跳动每年在微软AI与云服务上的支出近10亿美元。截至发稿，字节跳动方面暂未回应。（第一财经）</p>\n  <p><strong>美亚利桑那州称已对OpenAI及其他公司展开刑事调查</strong></p>\n  <p>据报道，亚利桑那州总检察长克里斯·梅斯（Kris Mayes）表示，该州已对OpenAI及其他AI公司展开刑事调查，事由是“银行疑似遭失控AI代理渗透”。梅斯表示，刑事调查并不一定意味着会提起指控。目前她的办公室正在调查是否存在持续违反亚利桑那州法律的行为。（财联社）</p>\n  <p><strong>WPP大中华区首席执行官韦棠梦将于年底离职</strong></p>\n  <p>WPP宣布其大中华区业务下一阶段的管理层交接计划。作为此次交接计划的一部分，WPP大中华区首席执行官韦棠梦（Chris Reitermann）在奥美与WPP任职超过30年后，将于2026年12月31日离开WPP。WPP将适时公布大中华区下一阶段的管理层架构。WPP Media首席执行官陈怡（Tina Chen）与WPP Creative首席执行官朱晨吟（Kevin Zhu）将确保管理层平稳交接。（界面新闻）</p>\n  <p><strong>拼多多旗下Temu与万事达卡扩大合作</strong></p>\n  <p>当地时间11月18日，拼多多旗下全球电商平台Temu与万事达卡宣布扩大合作，旨在改善消费者支付体验，并探索支持本地卖家的新方式。根据双方签署的谅解备忘录，双方将评估引入更多万事达卡解决方案，包括推出Click to Pay——该功能可让消费者在线支付时无需每次手动输入卡号信息。双方还将探索降低欺诈与交易误拒付的途径，并通过Mastercard Agent Pay开拓智能体商业（agentic commerce）等新型支付体验。（界面新闻）</p>\n  <h2>大公司财报</h2>\n  <p><strong>阿里巴巴：2027财年第二季度营收2715.19亿元，同比增长10%</strong></p>\n  <p>36氪获悉，阿里巴巴集团发布2027财年第二季度财报，核心业绩全面超预期，集团收入2715.19亿元，同比增长10%，经调整EBITA 326.36亿元，同比增长260%。</p>\n  <p><strong>联想集团第二季度营收首破2000亿元，ISG及SSG运营利润占比超六成</strong></p>\n  <p>36氪获悉，联想集团公布截至9月30日的2026/27财年第二季度业绩，集团季度营收首次突破2000亿元人民币，同比增长近50%，创历史新高；调整后净利润同比增长166%，调整后净利润率同比提升2个百分点至4.5%。其中，ISG基础设施方案业务集团与SSG方案服务业务集团合计贡献三大业务集团运营利润总额的61%，较去年同期提升28个百分点。</p>\n  <p><strong>网易：第三季度净收入279亿元，净利润92亿元</strong></p>\n  <p>36氪获悉，网易发布2026年第三季度财报。财报显示，网易单季净收入279亿元，Non-GAAP净利润92亿元，研发投入47亿元，研发投入强度17%。三季度，网易多款长青游戏玩家活跃度持续增长，全球化布局与新品管线取得新进展。《燕云十六声》全球玩家突破1亿；新品《无限大》将于2027年1月15日全球上线，目前预约量已突破2700万。同时，网易持续深化AI技术在多元业务中的研发与应用，网易灵动具身智能机器人已落地百余个工程项目。</p>\n  <p><strong>快手：第三季度总收入316亿元，经调整净利润7.9亿元</strong></p>\n  <p>36氪获悉，快手发布2026年第三季度财报。财报显示，第三季度，快手总收入达到316亿元，经调整净利润为7.9亿元，经调整EBITDA达39亿元。用户方面，快手应用平均日活跃用户达到4.17亿，平均月活跃用户达到8.19亿，创历史新高。</p>\n  <p><strong>有道：第三季度净收入14.3亿元，连续九个季度经营利润为正</strong></p>\n  <p>36氪获悉，网易有道公布了2026年第三季度未经审计的财务业绩。报告期内，有道持续推进AI原生战略，聚焦高质量、高毛利率业务，AI应用在学习、办公、营销等场景纵深落地，盈利能力与经营质量保持稳健提升。财报显示，有道三季度净收入达14.3亿；经营利润0.3亿，同比增长19.2%，连续九个季度实现经营利润为正。前三季度，公司经营性现金流累计净流入1.5亿，较去年同期显著改善。</p>\n  <p><strong>拼多多：三季度营收1083亿元，同比持平</strong></p>\n  <p>36氪获悉，拼多多发布第三季度财报，单季营收1083亿元，同比保持平稳；利润295亿元，同比基本持平。本季度，拼多多“千亿扶持”持续加码对“全产业链”的投入。受益于“千亿扶持”的生态效应，整个产业链的产品能力、研发能力、生产能力、组织能力以及品牌能力得到了系统性的提升，也为消费侧提供了更优质的新供给，供需两侧质效升级更加明显。</p>\n  <h2>投融资</h2>\n  <p><strong>DeepSeek千亿融资落地，新增31家合伙人</strong></p>\n  <p>工商信息显示，DeepSeek工商主体杭州深度求索人工智能基础技术研究有限公司，近日完成工商变更，新增股东杭州程砚企业管理咨询合伙企业（有限合伙）（下称“杭州程砚”），公司注册资本变更为1991.8707万元，增幅约21.1%。</p>\n  <p>进一步向上穿透，杭州程砚同期完成工商变更，新增31家合伙人，登记出资额由0.6万元增至343897.9万元。变更后，杭州程砚共有32名合伙人，杭州程策商务咨询有限公司仍担任执行事务合伙人。（科创板日报）</p>\n  <p><strong>“原力无限INFIFORCE”完成数千万元Pre-B轮融资</strong></p>\n  <p>36氪获悉，具身大脑企业“原力无限INFIFORCE”近日完成数千万元Pre-B轮融资，由杭州市属国有资本投资运营平台杭州资本独家投资。资金将重点投向具身大脑AtomBrain的技术研发，持续深耕真实落地场景，推进产品工程化打磨与规模化产业化落地。</p>\n  <p><strong>“钠远新材”完成数千万元A轮融资</strong></p>\n  <p>36氪获悉，钠离子电池正极材料公司“钠远新材”近期已完成数千万元A轮融资，由金投致源战略投资。本轮资金将主要用于马鞍山经开区先进电池终端集成智造基地建设，同时支撑无负极电池开发及海外市场拓展。</p>\n  <p><strong>整理丨</strong>宋清瑜</p>", "category": "tech", "published_at": "2026-11-20T00:04:14+00:00", "fetched_at": "2026-11-20T05:29:28.948141+00:00", "fingerprint": "51f831087c89a487"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨多地国资押注，这家中性原子量子计算企业获数亿元B轮投资", "url": "https://36kr.com/p/4077393088386184?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_057f5e3d0889473d91d4e5d748cd661a@6221844_oswg417886oswg1183oswg503_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3600</strong>字，建议阅读<strong>9</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，中性原子量子计算公司——杭州原子矩阵计算有限公司（MatriQ，下称“原子矩阵”）近日宣布完成数亿元人民币B轮融资。</p>\n  <p>本轮融资由杭州产投集团、杭州高新金投、成都科创投、鸿瑞达投资、博世创投、广州海珠城发、川创投等机构共同参与，集合多地国资平台、产业资本及市场化投资机构。本轮融资将为公司链接区域资源、落地量超融合试点、深化产业生态合作提供支撑。<strong>一年内，原子矩阵已连续完成五轮股权融资，累计融资总额突破10亿元。</strong></p>\n  <p>原子矩阵成立于2025年，是一家专注于中性原子量子计算全栈解决方案的前沿科技企业，以工程化、产品化、商业化为核心导向，致力于打造实用化的量子计算机。</p>\n  <p>原子矩阵创始人夏席远本硕毕业于帝国理工学院，博士就读于海德堡大学及马克斯·普朗克量子光学研究所（MPQ，下称“马普所”），导师师从2022年诺奖得主Anton Zeilinger；马普所是全球中性原子量子计算策源地之一，最早实现光晶格中单原子独立操控与单格点分辨读出，也是该路线全球战略白皮书的重要参与撰写方。</p>\n  <p>此外，公司还汇聚了来自马普所、英国帝国理工学院、剑桥大学、卡耐基梅隆大学、哥伦比亚大学、浙江大学、上海交通大学、中山大学等高校及科研机构的研发人才，覆盖量子物理、光学工程、精密制造与量子算法等方向。</p>\n  <p>在量子计算的多条技术路线中，超导、离子阱与中性原子各有优劣。原子矩阵选择中性原子路线，核心在于其在大规模量子比特扩展上的天然优势。</p>\n  <p>中性原子量子计算近年来的关注度持续升温。夏席远对硬氪表示，过去三四年间，中性原子路线的物理比特数量实现大规模增长，海外头部团队在逻辑比特编码、连续原子装载等节点上接连取得突破，单比特门与双比特门保真度等核心指标也在快速提升。</p>\n  <p>目前，原子矩阵已构筑起从核心器件自研到整机系统集成的全链路技术能力，实现最高2310个物理量子比特无缺陷阵列的构建与稳定运行，成为国内少数具备千比特级整机交付能力的中性原子量子计算厂商。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_befa871bc9944ac0995c3465e76594ee@6221844_oswg535222oswg926oswg618_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">整机实物图（图源/企业）</p>\n  <p>在产品架构上，原子矩阵采用存储与纠缠分区的设计。夏席远解释，中性原子的一个核心难题在于对特定量子比特进行激光操作时，容易对周围不需要操作的量子比特产生干扰。分区架构将原子从存储区移出至纠缠区再进行门操作，既避免了对其他量子比特的影响，也支持对多对原子同时并行操作，从而提升计算效率。</p>\n  <p>围绕非目标光照射引入的误差，分区架构本身即是解决方案之一——光打在存储区时原子不受影响。此外，团队还会采用其他波长的激光为不需要被操作的原子“盖上毯子”进行遮挡，进一步降低误差。</p>\n  <p>商业化节奏上，原子矩阵采取“整机+云平台”双轮驱动策略。整机侧，公司面向数据中心等算力基础设施客户提供可现场部署的中性原子量子计算整机，目前已与国内数据中心签下首批整机商业化订单。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_dbc05bc9b65b469aaea6aa6e8ac077db@6221844_oswg871073oswg941oswg529_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">整机局部细节图（图源/企业）</p>\n  <p>云平台侧，MatriQ量子云平台直连自研整机算力，配套标准化编程接口与智能任务调度，主要服务国内外科研机构、量子软件与算法初创公司，以及生物制药、材料等领域大型企业的研发部门。</p>\n  <p>夏席远透露，云平台目前正在进行最后的内部测试与内部客户测试，将尽快开放给更多客户，并已与部分客户沟通商业化订单。他判断，短期至中期整机与云平台并重，长期来看云平台有望成为更大的一块业务，“因为它对客户的要求相对于整机更低，便捷度更高”。</p>\n  <p>在技术指标规划上，原子矩阵明年的目标是实现几千个物理比特向几十个逻辑比特的逻辑编码转换，单比特门做到99.99%，双比特门稳定做到99.5%以上；后年进一步做到近万个物理比特、近百个逻辑比特。</p>\n  <p>夏席远对硬氪表示，团队和投资人对量子计算赛道都有较长预期。“我们会把这个赛道当成一个10年的赛道去做布局”。</p>\n  <p>在他看来，接下来的挑战主要集中在两个层面。技术侧，如何更快提升物理比特数量与操作精度、以更少物理比特转换出错误率更低的逻辑比特，需要研发、硬件、软件算法与纠错算法的多维度迭代。生态侧，如何建立开发者社区、找到量子计算真正可用的细分场景，难度与硬件迭代相当。</p>\n  <p><strong>以下为硬氪与夏席远访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：中性原子路线近两年关注度明显上升，您作为业内人士怎么看这条路线与其他路线的差别？</strong></p>\n  <p><strong>夏席远：</strong>过去三四年，中性原子路线显得突出，主要有几个原因。第一，物理比特数量实现了非常大规模的增长；第二，海外前沿的哈佛、MIT团队在物理比特通过纠错编码实现逻辑比特上取得了技术里程碑突破。这些节点上的优势让行业感到振奋。但量子计算本身是周期非常长的赛道，技术路径其实还没有收敛，还有非常长的一段路要走。</p>\n  <p><strong>硬氪：云平台在行业内做的人还很少，这块的技术难度在哪里？长期看是否会成为更大的现金流来源？</strong></p>\n  <p><strong>夏席远：</strong>首先需要有完整的整机，没有整机，云平台更多是空中楼阁，这要求有一台性能指标稳定的整机。第二层是需要完整的云平台搭建能力，涉及从底层硬件控制、中间编译层到上层云平台乃至应用层的多层软件，要求公司具备全栈能力，把硬件研发交付能力与软件理解深度结合。此外，找到更多客户、降低使用门槛、让生态伙伴进来，是周期较长且相对更难的事情。</p>\n  <p>长期来看，随着量子计算在特定细分行业爆发，云平台确实会成为比较大的一块业务，因为它对客户的要求比整机低，便捷度更高。我们短期至中期整机与云平台并重，长期会更多探索云平台的商业模式，包括与生态伙伴、云厂商合作，把整机算力开放给更多人使用。</p>\n  <p><strong>硬氪：整体看，公司的竞争优势有什么？</strong></p>\n  <p><strong>夏席远：</strong>我们的竞争优势不在单一专利，而在工程化与全栈能力。公司从创立之初就锚定工程化、产品化与商业化，花了很多时间和资源把实验室仪器转换成可重复、可批量生产、可交付的产品。我们团队有从0到1搭建整机的完整能力，核心元器件具备自主设计能力，同时利用中国供应链优势，在成本与迭代效率上有较大优势。</p>\n  <p>加上我们起步较早，第一轮投资人是看到我们的整机后投的。量子计算是全球化竞争，长期看中国公司在成本、货期上的优势会被不断放大，我们不仅要在前沿创新上竞争，在商业化路径上也要参与全球竞争。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>杭州产投集团表示：</strong>“量子技术是杭州未来产业的重要布局方向。原子矩阵扎根杭州，持续推进中性原子量子计算全栈研发，已经形成千比特级整机交付能力，并获得数据中心客户的商业化订单。我们看好团队的技术积累与工程化执行力，期待公司进一步集聚高水平人才，加强与本地科研机构和上下游企业的合作，在杭州形成更完整的量子计算研发、产品与服务能力。”</p>\n  <p><strong>杭州高新金投表示：</strong>“杭州高新金投长期看好中性原子路线。该路线凭借高可扩展、无需极低温制冷、纠错开销更低等显著优势，是最有希望走向规模化容错量子计算的技术方向之一。原子矩阵团队核心骨干源自马普所等国际顶尖科研机构，已实现2310原子无缺陷阵列稳定运行，后续系列机型迭代路径清晰，完成了从实验室原型向商用产品的跨越。作为杭州国资平台，我们希望深度陪伴企业成长，助力企业扎根杭州，培育打造本土量子计算新星。我们期待团队持续打磨整机性能，面向科研、生物医药、材料模拟等场景输出国产量子算力，推动国内中性原子量子计算产业加速成熟。”</p>\n  <p><strong>鸿瑞达投资表示：</strong>“量子计算尚处于多元探索阶段，鸿瑞达投资秉持多路线布局思路，拥抱量子计算多条技术路线协同发展。原子矩阵依托自研分区存储-纠缠架构与全栈工程能力，率先完成千比特级中性原子量子整机落地，是国内中性原子路线第一梯队的标杆团队，兼具前沿理论创新与产业化兑现能力。我们期待原子矩阵持续攻克规模化纠缠、稳定运行等核心难题，牵引国内中性原子量子算力生态加速成熟。”</p>\n  <p><strong>成都科创投表示：</strong>“我们关注前沿科技成果向产业转化的实际进展。原子矩阵已完成从原型机研发到整机订单签约的推进，具备与科研机构、算力中心及产业客户开展深入合作的条件。我们期待结合成都的科研与产业资源，拓展与原子矩阵的联合研发、整机部署和应用验证，探索量子计算与现有算力基础设施的协同方式，为区域未来产业发展引入新的技术力量。”</p>\n  <p><strong>博世创投表示：</strong>“我们看重的是量子硬件、算法与实际工业问题之间的结合，也看重团队持续开展工程研发和应用验证的能力。原子矩阵在中性原子整机与全栈技术方面的积累，为这类探索提供了基础。我们期待公司与更多产业伙伴开���研究，通过具体任务检验技术进展，逐步拓展量子计算的工业应用。”</p>\n  <p><strong>广州海珠城发表示：</strong>“我们看好量子计算的长期发展前景，也关注企业将技术积累转化为产品和业务的能力。原子矩阵在中性原子量子计算领域的持续投入，所取得的整机研发和商业化的进展，是我们作出投资判断的重要依据。量子计算需要长期研发和耐心投入，我们期待通过本次投资，支持公司稳步推进产品迭代与市场拓展，在长期发展中实现企业价值的成长。”</p>\n  <p><strong>川创投表示：</strong>“量子计算需要长周期投入，我们关注团队能否围绕清晰的技术路线持续取得进展。原子矩阵兼具底层物理研究与整机工程经验，正同步推进产品交付、量子纠错和逻辑比特等关键工作。我们看好中性原子路线的扩展潜力，也认可团队长期投入的研发思路。期待团队在持续迭代中提升全栈系统能力，推进量子计算产业化。”</p>", "category": "tech", "published_at": "2026-11-20T00:58:59+00:00", "fetched_at": "2026-11-20T05:29:28.948134+00:00", "fingerprint": "3d32681085dd0fa5"}, {"source": "36氪 - 最新文章", "title": "耐克终于给出了增长计划，但需要一点时间｜投资日现场直击", "url": "https://36kr.com/p/4076185723769984?f=rss", "summary": "<h2>拿回那些份额</h2>\n  <p>一段让人目眩的快剪视频之后，身着黑色耐克飞行夹克贺雁峰（Elliott Hill）走上台，看上去精神不错。</p>\n  <p>“刚才那段影片是一扇窗，”他说，“让我们看到世界顶尖运动员真实的心态：迎难而上，永不停歇，质疑只会让他们更加努力。”</p>\n  <p>11月17日，当地时间的周二早上八点30分，耐克比弗顿总部，泰格·伍兹会议中心二楼的讲堂。台下坐满了西装革履的分析师，准备好倾听这位CEO如何带领这家运动巨头走出低谷。</p>\n  <p>耐克上一次举行投资者日大会的时候，英伟达的股价约是2.55美元，如今是162美元；HBO《权利的游戏》还未完结；凯特琳·克拉克才15岁，刚入选美国U16女子篮球队。</p>\n  <p>那是2017年，管理层在大会上概述了提振线上销售、拓展直销业务以及加速创新的计划。此后四年间，股价上涨了三倍多，并于2021年底创下177.51美元的历史新高。</p>\n  <p>2026财年，耐克营收464亿美元，与上一年持平；进入新财年，第一季度营收降了4%。股价更是回到了2014年的水平，比历史高点跌去近八成。“很明显，我们还没有达到想要的位置。”贺雁峰在演讲中说。</p>\n  <p>他和上任刚满百日的 CFO Dave Denton 给出的答案是一张五年时间表：以2027财年为基数，<strong>到2031财年新增约50亿美元营收，营业利润从6%回到12%至14%。至于大中华区，预计营收将在截至2031财年的规划期内逐步趋稳。</strong></p>\n  <p>增长并非是线性的。在耐克管理层的构想中，27、28财年（即截至2028年5月）营收将持续下滑，只是降幅会从高个位数逐步收窄；真正意义上的拐点要到2029财年，“我们预计此时营收增速将与大盘一致”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_78f976fae0c7401aadc4b8a27bc34bcb@5922386_oswg368395oswg2860oswg1848_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐克预计最快在2028年年中追上大盘增速｜制图：36氪</p>\n  <p>配合这路线图的打法被命名为“全速前进”（Full Stride Ahead）。核心是三个词：创新突破（epic）、深度连接（connected）、快速行动（fast）。</p>\n  <p>产品上，耐克要重塑产品组合，砍掉冗余鞋型，增加差异化新品的比重。市场上，打法从Win Now时期的\"三国五城\"扩展到23个重点国家，约九成的营收增长预计来自这些国家。在这些国家里，耐克要继续加深与当地文化的连接，最终建起一套可以复制的需求引擎。在生产和交付层面，服装和配件更多在美洲和靠近欧洲的地方生产；物流网络更多使用第三方，并增加自动化。2026财年这部分已节省约6亿美元。</p>\n  <p>与此同时，耐克推行名为PACE计划进一步提升运营效率。到2031财年，PACE每年将为耐克节省约25亿美元，实施过程中预计产生约13亿美元的一次性税前费用，其中包括员工相关支出。</p>\n  <p>一些分析师认为新计划的后期增长压力过大，持续五年的路线图在市场看来也过于谨慎，投资日结束当天，耐克收跌6.3%。</p>\n  <p>在投资日结束后的全员大会上，管理层的语气明显变得积极很多。</p>\n  <p>“我们拥有成功所需的一切，”贺雁峰在彭博社获得的一份员工录音中说。他也承认，这种规模的复苏“确实需要时间，比我希望的要久。”Dave Denton说得更为直白，“那些属于阿迪达斯的份额本该属于我们，他们不值得这些，所以让我们行动起来，把份额拿回来。”&nbsp;</p>\n  <p>过去两年，阿迪达斯CEO比约恩·古尔登在多个场合以不太客气的语气隔空点评过耐克。在华尔街面前克制了一整天之后，耐克管理层终于在内部会议上做出了回击。</p>\n  <h2>三种需求</h2>\n  <p>在四百多英亩的耐克园区里，散落着四十多栋建筑，大多以运动员命名，有迈克尔·乔丹、米娅·哈姆、泰格·伍兹，最大的一栋属于小威廉姆斯。去年秋天，这里换上了创始人的名字，改称 Philip H. Knight 园区。</p>\n  <p>“我们这儿的门比普通的门高出一截，”一位耐克员工告诉我，“因为常有篮球运动员来。”</p>\n  <p>我接着问了一个（事实上不那么）假设性的问题：如果某位运动员卷入丑闻，这些大楼该怎么办？</p>\n  <p>“我们不会做任何改变，”这位耐克员工回答令我有些意外，“因为耐克始终以运动员为中心。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_ab98d788f470402d80c665c050fa6593@5922386_oswg336730oswg1440oswg1920_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐克员工的办公大楼以田联主席塞巴斯蒂安·科尔命名，门口立着一座雕塑，写着“服务运动员”｜作者摄</p>\n  <p>但把运动员的名字刻在楼上并不难，难的是让运动员愿意把耐克穿在身上。接下来五年，耐克押注的是后者。新增约50亿美元营收中，其中40亿美元来自运动表现品类，也就是跑步、训练、足球、篮球和户外这五项重点运动。</p>\n  <p>剩下的10亿美元由Nike Sportswear（NSW）、Jordan 和 Converse 的生活方式业务完成。这部分业务一度占到公司营收的六成左右，到 2027 财年第一季度，仅 NSW 一项仍“略低于一半”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_e3c0635bad054ead9ef906897892050d@5922386_oswg404128oswg2860oswg1892_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">FY26-FY31耐克运动表现和生活方式品类的营收对比走势｜制图：36氪</p>\n  <p>“Create epic shit”是首席创新、设计与产品官Phil McCartney挂在嘴边的一句话。这句话来自科比，他和耐克团队合作时常问：\"Show me the epic shit.\"（给我看点牛X的东西。）\"它提醒我们要更大胆地去创造。\"Phil McCartney说。</p>\n  <p>McCartney如今执掌耐克、Jordan和匡威三个品牌的产品创新。40亿美元的增量很大程度上要从他的团队手里出来。他在投资者日上简述了路线图：“突破成为产品，产品成为技术平台，每天服务全世界数以百万计的运动员。\"最终，这些都要\"转化为需求和增长”。</p>\n  <p>创新参观日的日程中，勒布朗詹姆斯大楼的“创新空间”是唯一不许拍照的环节。在这一层从未公开展示的创造实验室里，耐克的设计师们为记者展示了Nike Free的鞋底是如何被切割而成，以及3D打印技术如何制造一片薄如蝉翼但支撑力十足的运动内衣。</p>\n  <p>相比之下更为成熟的Air技术则发展出了新平台Tuned Air，明年初将应用在跑步场景，2028年再进入Nike Sportswear的货架。上一次Air换代还是2017年的VaporMax，它和随后的Max 270累计卖出了超过100亿美元。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_426cd4a27dc347189162b3701e28573a@5922386_oswg2513463oswg2688oswg3584_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Air技术如今可以应用到更多的场景｜作者摄</p>\n  <p>包括Sportswear、Jordan和匡威在内生活方式业务依然是耐克无法忽视的部分，这一业务曾经是营收和增速大头，在未来四年实现新增10亿美元的目标，实在谈不上野心。因此管理层的打算是用更少、更聚焦的产品组合，把这10亿美元拿下来。</p>\n  <p>“Sportswear鞋类营收中来自新鞋型或现有鞋型更新的部分不到10%... 我们正在把鞋型数量砍掉一半... &nbsp;<strong>到2031财年，我们预计新鞋型的营收比例将达到约40%。</strong>”耐克副总裁Amy Montagne在演讲环节说。</p>\n  <p>当然，减少供应并不自动等于创造需求。“清理市场是起点，不是战略，”贺雁峰在演讲中说。除了借助AI、3D打印和近岸生产等来提高响应速度，更聚焦的生产还需要提前规划。</p>\n  <p><strong>“我们正在像组织运动表现业务那样，围绕具体的消费者洞察和不同的风格偏好，来组织Sportswear的货品。</strong>”在10月的财报电话会上贺雁峰说。</p>\n  <p>Amy Montagne进一步阐述，公司从运动员群体中识别到了三个不同的消费习惯，“他们风格偏好和自我表达方式各不相同”。为更好回应这些差异化需求，耐克将重点推动三方面转变：打造更创新、更具差异化的产品；深化与本地文化的连接；以及建立可复制的全价需求增长模式。</p>\n  <p>我们在随后Sportswear Breakout 环节得以窥探到冰山一角。</p>\n  <p>第一类人，他们大概迷恋复古运动文化和耐克的经典廓形。展间最前面摆着米色和黑白配色的Moon Shoe。这双诞生于1971年的老鞋型，直到今年4月才第一次以常规款发售，定价105美元。对面陈列着“史上增速最快的服饰系列Studio Fleece”、勃肯造型的AJ拖鞋，再旁边，还是那几双配色各异的经典AJ。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_31c57c1fe72243978283e9c2ebd55701@5922386_oswg2513266oswg2688oswg3584_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">耐克Moon Shoe的最初势头要追溯到2025年，与设计师品牌Jacquemus的联名｜作者摄</p>\n  <p>第二类人也许年龄稍长，热爱户外和自然，在性能之外追求低调和实穿。Showroom的一整面墙挂满了性能面料制成的派克大衣、教练夹克、短款羽绒服和飞行员夹克，剪裁规矩，适合通勤，和当年的NikeLab与日潮联名相比，先锋感淡了许多。</p>\n  <p>第三类是非常年轻的消费者，生活在首尔、伦敦、上海这样的城市，对潮流和穿搭极为敏感。这部分产品由耐克的本土团队开发，涵盖运动与正装混搭的叠穿、廓形剪裁的下装、Y2K与复古元素的运用，以及对特殊面料的风格化处理。</p>\n  <p>Montagne口中的“按城市赢”（win city by city）在这里有了具体的样子：营销预算更多地流向地方创作者和社群，本地团队对产品和货品组合也有了更大的话语权。</p>\n  <h2>更本土了，但更受欢迎吗</h2>\n  <p>中国再次成为投资者日上分析师追问的焦点。大中华区是耐克仅次于美国的第二大国家市场，也是目前承压最为明显的市场。但市场规模仍在增长。据耐克估算，大中华区运动鞋服市场目前规模接近670亿美元，预计到2030年将达到约800亿美元，年均增长约5%。</p>\n  <p>“23个重点国家里，显然有几个是特殊的，中国就排在名单的最前面。”耐克集团副总裁兼大中华区总经理申凯希（Cathy Sparks）在演讲结束后接受36氪专访时说。</p>\n  <p>今年10月，耐克在宣布PACE改革时公布了新的区域架构：从2028财年起，四大区域合并为三个。北美与拉美合并为美洲区，大中华区与亚太合并为亚太及大中华区（APGC），欧洲、中东及非洲区维持不变。</p>\n  <p>此前不少报道将这一调整解读为大中华区的“降级”。<strong>但据36氪了解，总部位于新加坡的亚太区目前尚未宣布负责人，未来较长一段时间内，该区域的运营重点仍是大中华区。</strong>申凯希在演讲中也表示，并入APGC后，中国业务总部仍设在上海。</p>\n  <p>今年早些时候，耐克在上海组建了本土源创产品团队，首个胶囊系列已于11月12日上市。该系列包括Nike Sportswear和Jordan系列在内的共10个新款，从启动到上市122天，不及耐克全球服装开发周期的一半。</p>\n  <p>之所以先做这两条产品线，申凯希的解释是：“我们知道自己没有满足中国这部分消费者的独特需求，所以先把团队投向了那里。”她预计，由于Nike Sportswear和Jordan系列的风格变化快，未来这条产品线约有一半将由本地源创团队创造。到2028财年，本土源创团队将增至100人以上，是目前的两倍。</p>\n  <p>耐克大中华区本土源创产品团队副总裁Flavia Cervantes此前接受36氪<a href=\"https://mp.weixin.qq.com/s/W8aO4XFjjYq0GKx4Axh1pw\" rel=\"noopener noreferrer\" target=\"_blank\">专访时透露，</a>本土系列未来将扩展到更多专业运动领域。申凯希证实了这一说法，并列出了具体方向：<strong>足球、儿童产品，以及在中国增长较快的球拍类运动（网球、皮克球、板式网球）。</strong></p>\n  <p>“我们也开始研究户外的本土源创系列可以是什么样子。”此后，本土源创团队还将与全球团队合作开发生活方式鞋履，“我相信到那时，这些产品不仅会在中国，也会在亚洲更多地方引起共鸣。”</p>\n  <p>目前表现较好的，是贴合年轻消费者习惯、同时严格控制供货量的产品。申凯希透露，今年推出的两个新零售概念ACG大本营（ACG Base Camp）和NikeSKIMS慢闪店，消费者反响都“非常强烈”，“NikeSKIMS开业头30天的业绩是计划的3倍。”NikeSKIMS品类负责人告诉36氪，NikeSKIMS的售罄也带动了耐克主品牌的全价销售。</p>\n  <p>这些成绩建立在有限的分销之上。凯特琳·克拉克的首款签名鞋Caitlin 1于9月24日在中国先于全球发售，耐克“刻意把分销范围控制得很小”，只通过几家核心合作伙伴，在重点门店和线上发售，“结果保持了100%的全价实现率，售罄也达到计划”。</p>\n  <p>女子夜跑系列赛After Dark Tour上海站相关系列投放到市场的货品售罄率接近100%。“当我们把创新产品和中国消费者认同的运动员结合起来，再保持高端体验，就能取得成功，”申凯希说，“现在我们的任务是不断复制这一点。”</p>\n  <p>线下，耐克正在调整门店形态。亚洲最大的耐克旗舰店上海001在2027财年第一季度实现两位数增长，为连续第四个季度增长。12月上海马拉松前，耐克将开出一家新形态的耐克跑步门店；明年1月，首家Jordan慢闪空间将在上海张园开业。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_020d566c4a1144d895c34b4a32f367a7@5922386_oswg73122oswg430oswg430_img_webp?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配合上马开幕的耐克跑步店（上海新乐路）将于11月27日开业</p>\n  <p>电商方面，申凯希在投资者日上介绍的调整不只是减少渠道。耐克在中国目前有约2000个分散的线上店铺，从2027年1月起，耐克的线上业务将集中到天猫、京东和抖音上的耐克、Jordan和儿童官方旗舰店，另在天猫独家开设ACG旗舰店。</p>\n  <p>“在中国，直播不是一个渠道，而是一整代人发现、决定和购买的方式。”为此，耐克在上海设立了自有创意制作中心ICON.Shanghai，在本地制作直播、短视频和运动员内容。申凯希的目标是让创新产品“靠价值而不是靠折扣卖出去”，她也承认，这会给耐克和合作伙伴带来短期压力。</p>\n  <p>库存方面，到2027年春季，约三分之一的库存将转为快速反应生产；<strong>Air Force 1和Nike Dunk系列超过60%的产量、AJ1超过50%的产量已转入这一模式。</strong>全国200多家耐克工厂店则作为可控的清货渠道，以保护全价市场。</p>\n  <p>“我喜欢中国的一点是，当我们在中国成功时，耐克会变得更好。”申凯希最后说，“这对我们来说就像一场训练，必须拿出最好的状态。”</p>", "category": "tech", "published_at": "2026-11-20T01:03:18+00:00", "fetched_at": "2026-11-20T05:29:28.948127+00:00", "fingerprint": "5006c923b38a31e7"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨中科院博士做二维半导体制造全流程产线设备，完成数千万天使轮融资", "url": "https://36kr.com/p/4077431786968198?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2400字，建议阅读6分钟</p>\n  </blockquote>\n  <p>硬氪获悉，国内覆盖二维半导体集成电路制造「生长—转移—检测」全流程的专用产线设备商「基元科技」近日完成数千万元天使轮融资，由朝晖芯华基金领投（朝晖资本与中芯国际创始人张汝京博士联合管理），宁创投、常州高新投、南慧创投等跟投，云岫资本担任后续融资财务顾问。</p>\n  <p>基元科技成立于2021年，是全球较早涉足二维半导体装备及材料产业化的企业之一。公司创始人王迪拥有中科院安徽光机所光学博士学位，曾任南京大学固体微结构国家实验室副研究员，在二维材料生长与光学检测领域拥有15年经验，是可视化CVD技术的发明人，并具备半导体前道量检测设备产业化经验。</p>\n  <p>随着硅基芯片制程微缩逐渐逼近物理极限，寻找新型半导体材料成为产业持续探索的方向。二维半导体凭借原子级厚度及独特的电学、光学性能，被视为延续芯片性能提升的重要候选材料之一。但从实验室样品走向规模化制造，除了材料本身的性能突破，还需要一套能够适配其物理特性和制造工艺的专用设备体系。</p>\n  <p>基元科技创始人王迪向硬氪介绍，与传统硅基半导体不同，二维半导体材料通常需要先在蓝宝石、石英等衬底上生长，再通过专用工艺转移至硅基衬底，进入后续芯片制造环节。整个过程中，约70%的设备可以复用现有硅基半导体设备，剩余约30%则需要针对二维半导体材料的特性重新设计，主要涉及材料生长、特殊转移及检测。</p>\n  <p>其中，材料转移是二维半导体制造中区别于传统硅基工艺的重要环节。此前，实验室虽然已有相应的材料转移工具，但缺乏能够满足量产线要求的整线装备。如何打通转移工艺，并兼顾设备稳定性、工艺一致性、高自动化和生产吞吐量，是二维半导体从研发走向制造必须解决的问题。</p>\n  <p><strong>基于对二维半导体材料特性及半导体产线设备的双重理解，基元科技自主设计了全球首台二维半导体晶圆转移产线装备。与此同时，公司还布局了二维半导体材料生长和芯片制造检测设备，形成覆盖集成电路制造全流程关键环节的产品组合。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_032a0a5f33d74a6bbf6aef02eb5d1fb7@5920579_oswg284001oswg1080oswg457_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>在材料生长领域，基元科技研发了高温原位光学观测CVD设备。与传统生长设备主要在工艺完成后进行材料检测不同，该设备能够在高温合成过程中进行材料的原位光学观测和谱学分析，为研究材料生长过程及缺陷形成机制提供数据支持。<strong>该设备是目前全球唯一商业化的高温原位光学观测CVD设备，已交付全球七个国家或地区超过100个高校或科研院所。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_e27f0b1589a2491ca3bcf41787d0580a@5920579_oswg287601oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>王迪表示，科研仪器与产业级半导体装备之间的另一明显差异在于标准，前者主要满足多样化的基础研究需求，而后者还需要符合集成电路制造领域严苛的行业标准。这也是基元科技区别于纯科研仪器厂商的差异化优势之一。</p>\n  <p><strong>值得注意的是，在二维半导体设备业务之外，基元科技还将业务延伸至AI for Science领域。</strong></p>\n  <p>基于自身设备业务，基元科技正在建设材料合成原位多模态数据采集平台，开发面向材料研发的智能体平台系统。公司目前已沉淀TB级材料高温原位合成数据库。通过对材料高温生长过程数据的采集和分析，AI系统可自主识别生成物类型、定位缺陷、判断材料生长状态，并生成合成分析报告。未来，公司还计划进一步训练材料研发智能体，探索湿法实验室的自动化与智能化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_26cd4e0ede4543f48b5bdb23218ac5d0@5920579_oswg706262oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p><strong>以下为创始人问答：</strong></p>\n  <p><strong>硬氪：相比传统半导体装备企业，基元科技在二维半导体设备领域的优势是什么？</strong></p>\n  <p><strong>王迪：</strong>核心在于对二维半导体材料本身的理解。传统半导体设备企业大多以工程技术团队为主，长期围绕硅基材料及其制造工艺进行设备开发，对二维材料的生长、转移和检测特性未必有足够积累。</p>\n  <p>但设备设计首先需要理解被制造或检测对象的材料性能，再根据这些特性确定工艺方案和设备结构，而不是简单地将现有硅基设备进行改造。我们团队在二维半导体材料领域有十几年的研究积累，同时也具备半导体设备产业化经验，因此能够从材料特性出发，针对二维材料在生长、转移和芯片制造中的实际需求设计产品。这也是我们在前期客户订单竞争中，相较于传统硅基半导体设备厂商能够形成差异化优势的重要原因。</p>\n  <p><strong>硬氪：实验室设备要升级为满足产线要求的设备，需要跨越哪些技术和工程化门槛？</strong></p>\n  <p><strong>王迪：</strong>可以从转移设备和检测设备两个方面来看。</p>\n  <p>首先是转移设备。二维材料需要从生长衬底转移到硅基衬底上，这是一种硅基半导体制造中没有的特殊工艺。此前，全球范围内都缺少可以直接参考的整线转移设备，整个转移工艺如何设计、设备采用什么形态、具体动作如何实现，都需要重新探索。我们结合多年二维材料研究经验，以及对硅基半导体设备的理解，针对这一工艺设计了二维半导体整线转移装备。</p>\n  <p>其次是检测设备。传统硅基检测设备主要针对硅材料的性能和缺陷特征设计，而二维材料的物理性能及其可能出现的缺陷与硅材料有很大区别，因此检测目标和指标也需要重新定义。</p>\n  <p>实验室虽然已有相应的检测仪器，但通常难以满足产线对设备稳定性、一致性、自动化程度和吞吐量的要求。要真正进入生产环节，就需要围绕二维材料的特性重新设计设备形态，而不只是将实验室设备简单放大。</p>\n  <p><strong>硬氪：未来一到两年，公司在研发和产业化方面有哪些重点方向？</strong></p>\n  <p><strong>王迪：</strong>在二维半导体装备方面，我们会继续研发适用于产线的不同类型设备，包括材料生长设备、转移设备和检测设备，重点是为二维半导体产业链提供设备支持，推动相关制造工艺打通。</p>\n  <p>在AI for Science、AI for Materials方向，我们近期计划推出面向高温材料合成过程的数据采集平台，并提供相关数据服务。更长期来看，我们希望基于积累的材料数据训练自己的智能体，推动湿法实验室的自动化和智能化，让AI参与材料研发和实验过程。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>本轮融资领投方朝晖资本表示：</strong>二维半导体正处在从实验室走向产线的窗口期。材料端，科研与产线两侧都在持续提升性能与稳定性；但要把实验室指标变成可复现的量产能力，还需要装备公司提供可靠、稳定的专用装备，并与材料、产线共同建立工艺标准——产业链是协同完善的，不是单点突破的。基元科技是我们在这个环节看到的稀缺团队：王迪既有十余年二维材料的研究积累，又真正做过前道量检测装备的产业化，能把材料特性翻译成设备参数，而不是把实验室仪器简单放大。这也是我们领投本轮的原因。我们愿意用长期资本陪公司把“生长—转移—检测”的全流程装备做扎实。</p>", "category": "tech", "published_at": "2026-11-20T01:39:38+00:00", "fetched_at": "2026-11-20T05:29:28.948118+00:00", "fingerprint": "ceb6207c372e3d84"}, {"source": "36氪 - 最新文章", "title": "11月26日，WISE2026商业之王大会·具身智能&文商旅分会场落地北京亦庄。首批嘉宾阵容，今日正式揭晓！欢迎扫码报名，我们现场见。", "url": "https://36kr.com/p/4077464212542596?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_99718324f42d45afa9db10ef49237c09@6301044_oswg96088oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>11月26日，36氪将联合欧氪律、氪睿研究院，在北京举办<strong>WISE2026商业之王大会·具身智能分会场</strong>，以“文商旅的‘赛博场景’：具身智能激活新消费赛道”为主题，聚焦文商旅等线下消费场景，汇集头部商管集团、具身智能企业、投资机构与专业服务机构，共同探讨技术应用与商业创新的落地机会。</p>\n  <p>作为36氪最重要的年度商业盛会之一，WISE大会持续关注新技术、新产业与新商业模式的演进。当技术走向应用，法律服务不可或缺。<strong>欧氪律联合36氪启动</strong><a href=\"https://mp.weixin.qq.com/s?__biz=MzYzNzk4OTI3NA==&amp;mid=2247488811&amp;idx=1&amp;sn=0503b327ec2122c2713d3ead31700dad&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>《2026 NewEco Elite具身智能&amp;人工智能产业之星律所/律师名录》</strong>（👈点击跳转）</a><strong>调研，并将现场发布</strong><a href=\"https://mp.weixin.qq.com/s?__biz=MzYzNzk4OTI3NA==&amp;mid=2247489293&amp;idx=1&amp;sn=4be687ecaff4193e22159addc55576fa&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>《2026中国具身智能法律服务白皮书》</strong></a>（👈点击跳转）。让专业被看见，让连接正发生，共同见证具身智能行业的下一程。</p>\n  <h2><strong>首批嘉宾阵容官宣</strong></h2>\n  <p>（按照“技术—场景—服务”产业链环节、嘉宾姓名首字母排序，排名不分先后）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_63a159fb438f41238a97fd9f9c3f0162@6301044_oswg236032oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>段炎彪丨云迹科技CPO（首席产品官）</strong></p>\n  <p>云迹科技（02670.HK）成立于2014年，2025年10月登陆港交所主板，是机器人服务智能体研发与商业化先行者。公司以“机器人，让人类更幸福”为使命，面向酒店、公寓、医院、工厂、商超等场景提供机器人及智能体服务，已覆盖20多个国家和地区，服务全球超4.5万家酒店、约400家公寓物业和200家医院，累计完成超13亿次任务，并以此为基础打造“人机共生世界价值模型”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_73e16c378e8a4ee4862f7be56ffc91de@6301044_oswg272345oswg1076oswg1912_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>房海南｜因时机器人CMO</strong></p>\n  <p>因时机器人成立于2016年，是国家级专精特新重点“小巨人”企业，专注微型精密运动执行器与灵巧手，2020年推出中国首款商业化量产五指灵巧手。公司把微型电机、行星滚柱丝杠、减速器等核心部件自研自产，2025年灵巧手全年交付突破1万台，成为全球唯一年交付超万台的企业；2026年2月完成C1、C2两轮数亿元融资，F1系列灵巧手登上央视春晚小品《奶奶的最爱》，并亮相哔哩哔哩NEXT大会。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_2233303c76fe46a28d355fb28a677282@6301044_oswg244434oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>刘理丨千丁智能CEO</strong></p>\n  <p>千丁智能是一家专注于空间智能的科技企业，面向商业楼宇、产业园区、办公空间、住宅社区等各类不动产场景，通过人工智能、物联网、数字孪生等技术，推动物理空间实现智能化运行与精细化经营。公司深耕不动产投、建、管、运、服全周期，以累计服务的8000多个项目、近4亿平方米管理面积为场景底座，已为12大行业3600余家企业提供数智化解决方案，拥有800余项专利与近千人产研团队。自研物联网平台支持1000万+智能设备在线管理，150余个AI智能体在真实业务场景持续运行——以AI巡检为例，平均效率提升60%，为客户提供可落地、可衡量的空间智能解决方案。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_511135f99eb94106a5b7e9edebd03a69@6301044_oswg235618oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>马靓婧丨智平方智魔方总经理</strong></p>\n  <p>智平方是2023年4月成立的全球领先AGI原生生产力型通用机器人企业，以全栈自研具身大模型AlphaBrain为核心，打造可量产、高稳定、支持规模化部署的AlphaBot系列机器人，构建“模型×硬件×场景”一体化能力体系，推动具身智能从技术验证转化为真实生产力。其自研类脑架构VLA具身大模型AlphaBrain以类脑分层架构连接认知、运动与执行，让智平方爱宝店员在真实世界中持续感知、实时修正，并从真实任务中持续学习。智魔方主推的“爱宝”智平方爱宝店员已进入茶咖、零售与文化体验场景；功能模块从咖啡扩展到冰淇淋、鸡尾酒、啤酒、盲盒等六七种，并在约十个月里落地全国十多个省市，同时在中国香港、新加坡开展探索。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_2afed0288f4b4b5988e533f08eaee3ba@6301044_oswg234210oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>闵海波丨爱宾果创始人、董事长</strong></p>\n  <p>闵海波，火箭军工程大学与清华大学联合培养人工智能博士，中国自动化学会认知计算与系统专委会副主任，全国工商联人工智能委员会委员，中国人工智能学会认知系统与信息处理专委会委员。专注机器视觉、多模态大模型与智能机器人攻关落地，主持、参与多项国家级重点科研项目。2015年创办爱宾果集团并任董事长，统筹战略、融资与运营，获得中科院、北京发改委、北京国资委引导基金及义乌产业投资基金等机构的投资，公司成长为中国教育具身智能领域的龙头企业。先后获福布斯中国科创人物、财联社新锐商业人物等荣誉，多次接受央视、新华网专访报道。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_a7188a4f762b451a9071d273af9e29b2@6301044_oswg246157oswg1076oswg1912_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>彭小舟丨中泰聚能CTO</strong></p>\n  <p>中泰聚能成立于2022年，是吉泰智能控股子公司。具身智能应用解决方案服务商，专注中游落地与场景交付，聚焦全球民生核心需求，以物理世界数据引擎驱动全场景智能化升级。</p>\n  <p>母公司吉泰智能长期聚焦能源高空AI爬壁机器人，产品服务约800家项目，已100%覆盖中国头部发电企业，并出口欧洲、澳洲及东南亚多家世界500强企业，以超1000万元/台套的价格出口欧洲，打破中国特种机器人出口单价纪录；相关方案已在国家能源集团、国家电网等电力行业完成规模化场景验证，获电科院联合认证。面向文商旅，中泰聚能已布局人形机器人、四足巡检机器人、商业清洁机器人及机器人零售舱，落地朝阳大悦城、大兴机场等场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_ad58dd78489d4582ac0f42db2b654964@6301044_oswg228278oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>魏婕丨鹿明机器人生态合作负责人</strong></p>\n  <p>鹿明机器人成立于2024年9月，致力于推动具身智能在产业场景中的规模化落地。旗下AI迷你双足人形机器人「鹿小明」曾登上全运会闭幕式、2026年辽宁卫视春晚舞台，并在第二届世界人形机器人运动会上斩获街舞冠亚军及啦啦操冠军。2026年9月，鹿小明亮相第十三届丝绸之路国际电影闭幕式，并与世界级非遗传承人东仓鼓乐社同台演出。在商业化落地方面，鹿明机器人与深文旅联合运营机器人剧场，并创新「剧场+研学」模式。目前，公司已形成覆盖景区驻场演艺、商业空间互动、文化场馆科普及研学教育的多元应用布局，持续拓展具身智能在文商旅领域的应用价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_e9bce3ae57ac4057b552d7d87a5a9300@6301044_oswg241880oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>赵于莉丨银河通用机器人首席战略官</strong></p>\n  <p>赵于莉，毕业于清华大学计算机系及经管学院，曾任麦肯锡咨询顾问、奇虎360游戏业务及海外投资负责人，后在游族网络任董事兼高级副总裁，主导的二次元研发发行曾创2亿美元年收，兼具战略规划与跨国业务管理经验。</p>\n  <p>银河通用机器人成立于2023年，以具身智能大模型为核心，团队自主研发的“银河星脑（AstraBrain）”是全球首个实现“大脑—小脑—神经控制”一体化的端到端具身大模型，支持机器人在复杂环境中自主感知、自主决策与持续进化。公司已推出Galbot ET1、G1、S1等多款产品，推动机器人走进千行百业。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_5b4223bf4af54e828b61eb38c5a0d2b0@6301044_oswg255522oswg1076oswg1912_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>刘照慧丨执惠集团创始人兼董事长、亿星郎宇联合创始人、联席总裁</strong></p>\n  <p>刘照慧，执惠集团创始人、董事长，中国探险协会副主席，兼任黄山旅游、天目湖股份、奥雅股份三家文旅上市公司独立董事，首都经贸大学MTA产业导师、腾讯文旅研究院特约研究员。曾先后任职人民日报、北京市政府新闻办公室及深交所上市公司华谊嘉信集团。他创立的执惠已成长为中国文旅产业颇具影响力的综合服务平台，以品牌会议、研究咨询、运营服务、教育培训为核心业务，服务全国三十余地市、上百个区县的文旅招商与投资运营，业务覆盖乡村振兴、城市更新、康养与航天文旅。2026年，他联合创办朗宇文旅与亿星郎宇并任联席总裁，推动航天科技与文旅场景、研学教育及消费产品结合，项目已在深圳、济南、曹妃甸、北京首钢园、酒泉等地落地。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_cfee5ccb8ab442d89f1797b195ff1e46@6301044_oswg242022oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>李涛丨万达酒店及度假村新程事业部运营负责人</strong></p>\n  <p>万达酒店及度假村是港股上市公司同程旅行（0780.HK）旗下的全产业链酒店管理公司，业务涵盖酒店设计、建设及运营管理。旗下拥有万达瑞华、万达文华、万达嘉华、万达锦华、万达颐华、万达美华、万达悦华等酒店品牌。截至2026年9月，已开业酒店320余家，筹建及待开业酒店500余家，业务覆盖全球400余座城市。同时，万达酒店及度假村以酒店业务为核心，整合文商旅产业链优质资源，在冰雪项目、四季度假、酒店驱动型商业综合体、非标商业、文旅景区、城市更新、文化创新、新型城市建设等领域，输出一体化服务，打造文商旅多维度标杆产品线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_5f519e4703904105aef85aca040204bf@6301044_oswg219989oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>马妍丨执惠文旅创新研究院院长</strong></p>\n  <p>执惠集团是中国文旅产业颇具影响力的综合服务平台，以品牌会议、研究咨询、运营服务、教育培训为核心业务，持续主办中国文旅大消费创新峰会（CTCIS），发布《中国文旅大消费投资研究报告》《世界海岛旅游产业发展报告》等系列成果，为文旅目的地嫁接产业资源与文旅资本，服务全国三十余地市、上百个区县的文旅招商与投资运营。研究院长期跟踪文旅消费、目的地渠道、业态创新与产业融合趋势。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_b4d8f2f2c71f414093384834db9853fa@6301044_oswg244331oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>杨维佳丨瑞安办公战略合作及品牌负责人</strong></p>\n  <p>杨维佳，低碳办公联盟及X Program创新场景共创计划发起人。长期关注可持续发展、产业创新与城市社区生态建设，致力于推动办公空间从物理载体向连接企业、产业与城市的价值共创平台升级。在可持续发展领域，她推动国内首个办公楼“深绿租赁”创新实践，将绿色理念融入企业经营与办公场景，并持续通过低碳办公联盟、GREENOVATORS等生态平台，链接多方资源，探索可持续发展的商业价值。</p>\n  <p>2026年，发起X Program创新场景共创计划，以真实街区及商业运营需求为起点，面向AI与硬科技领域征集创新解决方案。致力于以开放场景连接前沿技术、产业资源与商业需求，让可持续发展与科技创新从理念走向实践，探索企业与城市社区价值共生的新可能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_2e80ba93f70144c2a741eef7cf86cf3a@6301044_oswg253421oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>赵子乾丨珠海万达商业管理集团会员运营部总经理、AI负责人</strong></p>\n  <p>珠海万达商管集团成立于2021年3月，总部位于珠海横琴，是全球领先的商业运营服务提供商；截至 2025年12月31日，独家运营 529座万达广场，管理面积超7000万平方米、覆盖超230个城市，员工超4万名。覆盖从一线城市核心区到下沉社区的全维度商业产品，依托强大的品牌号召力与丰富的商业资源，万达广场持续引入国内外超2.5万知名品牌与超10万优质商户，推动商业创新与消费升级，成为【国民品质消费首选地】。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_24d07ca63b9640398c29ae407e8ce056@6301044_oswg242960oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>何欢丨兰台律所高级合伙人</strong></p>\n  <p>何欢，毕业于中国政法大学，现任中国商业法研究会理事、北方工业大学法律硕士课外导师。长期从事企业股权架构与控制权设计、企业出海、民营企业家族财富传承及民商事争议解决，关注具身机器人等科技企业的股权治理与出海需求。服务银行、信托、保险、上市公司及高净值客户，累计办理疑难民商事诉讼及仲裁案件300余件。曾获《中国法律年鉴》2018年度优秀民商法律师、“北京律师制度恢复重建40周年杰出青年律师代表”及“律新社2024年度财富管理领域品牌之星·匠心律师”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_a673d10e618a44f9b725b3a0f2c635f6@6301044_oswg201860oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>李磊丨欧氪律创始人/CEO</strong></p>\n  <p>李磊，15年法律行业品牌公关从业经验，中国政法大学律所管理研究生课程授课实务老师，中国律师行业首部访谈纪录片《律途十字路》制片人。欧氪律由亿欧、氪睿研究院（36氪旗下）与众垒公关共同发起，聚焦硬科技与新经济，站在企业客户需求视角，以真实数据驱动、以产业赛道分析架构为核心能力，重新定义法律服务机构与企业的信息连接方式，现已发布《中国新经济产业法律服务图景白皮书》等系列研究。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_8f20dbc101d743bf9258b0830f6c3c17@6301044_oswg204934oswg1080oswg1920_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>索珊丨氪睿执行董事、RET睿意德创始合伙人</strong></p>\n  <p>RET睿意德是中国领先的商业地产全程服务商，代表项目包括北京SKP、大兴机场、西安大唐不夜城、上海鸿寿坊、杭州玉鸟集等。她拥有超过20年商业地产从业经验，是行业深具影响力的趋势与洞见分享者。长期担任多个政府的商业发展顾问，曾深度参与华润万象生活、万达集团、大悦城集团等企业的战略发展、产品线创新与标杆项目策划；现任全联房地产商会商业地产工作委员会行业观察员、时代光华、清华经管、四为等特聘讲师，著有《商业地产新运营——不一样的破局思维》行业畅销书。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_9fb45eba3621404b9d303f0edabcc225@6301044_oswg229353oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>严子成丨千替智能·准典AI创始人</strong></p>\n  <p>严子成，00后创业者，杭州千替智能科技有限公司创始人兼CEO，约翰·霍普金斯大学人工智能硕士。千替智能聚焦AI Agent在专业服务领域的产业落地，与腾讯云、京东等头部企业达成深度合作。旗下产品“准典”面向新经济企业打造“AI员工”，覆盖法律咨询、合同校审、批量文件处理、法律工作空间四大能力，接入1.6亿+司法案例库与20万+现行法规库240万+，结论全程可溯源。在他看来，新经济与硬科技企业的竞争，正从“拼人数”转向“拼人机协同”——把重复的检索与文书交给AI，让法律人把时间留给真正的专业判断。法律之外，这套“AI员工”方法论还将走进更多硬科技产业场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261120/v2_db93de4a350544798f31733b3dd3ccea@6301044_oswg240256oswg1080oswg1919_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p><strong>钟延红丨兰台律所高级合伙人</strong></p>\n  <p>钟延红，毕业于中国政法大学，执业三十余年，北京较早涉足知识产权领域的律师之一。长期服务国有企业、科研院所及科技企业，专注专利、商标、著作权及反不正当竞争争议解决，业务涉及轨道交通基础设施材料、生物制造、能源科技、消费电子等硬科技与新经济领域，关注具身智能企业的知识产权布局与合规风险。兼任北海、大连仲裁委仲裁员；中国政法大学卓越人才培训项目、中国人民警察大学公安法学院兼职教授，北京工业大学法律专硕外审专家；连续两年（2025、2026）荣膺Benchmark Litigation中国榜单“争议解决之星”。</p>\n  <p>WISE2026商业之王·具身智能&amp;文商旅分会场，首批嘉宾，正式官宣。更多惊喜还在路上！</p>\n  <p>同时，分会场不止于观点交流，本次活动特别设置“世界咖啡”具身智能产业对接会，<strong>已有近百家场景方及具身企业报名参与。</strong>与传统的单向演讲不同，这一环节将围绕具体商业场景与现实需求，让实体商业运营方、具身智能企业、投资机构及律师开展面对面交流。</p>\n  <p><a href=\"https://mp.weixin.qq.com/s?__biz=MzI2NDk5NzA0Mw==&amp;mid=2248909494&amp;idx=2&amp;sn=04b2a68b3927c49fe8eacc2482b8b35f&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">近百家企业带着真实场景，直接在WISE现场聊合作</a></p>\n  <p><a href=\"https://mp.weixin.qq.com/s?__biz=MzI2NDk5NzA0Mw==&amp;mid=2248909494&amp;idx=2&amp;sn=04b2a68b3927c49fe8eacc2482b8b35f&amp;scene=21#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">（👈点击查看）</a></p>", "category": "tech", "published_at": "2026-11-20T02:11:30+00:00", "fetched_at": "2026-11-20T05:29:28.948102+00:00", "fingerprint": "91521f5f3dd47d45"}, {"source": "少数派", "title": "有必要但欠平衡：浅评 macOS 27.3 新版权限控制机制", "url": "https://sspai.com/prime/story/system-app-protection-override-macos-27-3", "summary": "<p>[......]</p><a href=\"https://sspai.com/prime/story/system-app-protection-override-macos-27-3\" target=\"_blank\">查看全文</a><p>本文为会员文章，出自<a href=\"https://sspai.com/prime/precog/single\" target=\"_blank\">《单篇文章》</a>，订阅后可阅读全文。</p>", "category": "tech", "published_at": "2026-11-19T07:34:11+00:00", "fetched_at": "2026-11-20T05:29:24.336142+00:00", "fingerprint": "09b91980fbbff381"}, {"source": "少数派", "title": "新玩意 256｜少数派的编辑们最近买了啥？", "url": "https://sspai.com/post/119287", "summary": "编注：很多读者都会好奇少数派的编辑们到底平时都「买了啥」。我们希望通过「编辑部的新玩意」介绍编辑部成员们最近在用的新奇产品，让他们自己来谈谈这些新玩意的使用体验究竟如何。内容声明：《新玩意》栏目如含有 ...<a href=\"https://sspai.com/post/119287\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-19T09:16:00+00:00", "fetched_at": "2026-11-20T05:29:24.336135+  with Ukraine and Starlink", "url": "https://www.theverge.com/tech/1037448/elon-musk-ukraine-starlink-starshield-nyt-dealbook", "summary": "Elon Musk said Ukrainian president Volodymyr Zelenskyy is lying about disruptions to Starshield in Ukraine and that he's trying to misuse SpaceX's consumer service, Starlink, for military purposes. Musk made the comments at The New York Times' DealBook Summit on Wednesday as he tried to explain the conflict following weeks of back and forth between [&#8230;]", "category": "tech", "published_at": "2026-11-19T01:39:45+00:00", "fetched_at": "2026-11-19T05:40:57.012089+00:00", "fingerprint": "b863bb1d729a3521"}, {"source": "36氪 - 最新文章", "title": "「镁伽科技」完成近2亿美元融资，建设直接面向真实世界的AI智能基础设施｜36氪首发", "url": "https://36kr.com/p/4075322592187524?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，近日，镁伽科技已完成新一轮近2亿美元融资。本轮融资由阿曼苏丹国主权财富基金阿曼投资局（OIA）参与投资，亚投资本、Granite Asia、创新工场等老股东加注，招银国际、苏创投、三江招商集团等机构跟投，覆盖国际主权资本、头部金融资本及地方国资产业资本等。</p>\n  <p>当前，AI for Science想要真正跑通绕不开一个底层问题：数据。成规模、高质量、可复用的科研数据目前仍是稀缺资源，而国内绝大多数生命科学实验室的设备和耗材仍不具备大规模、一致性产生数据的能力。</p>\n  <p>镁伽创始人、首席执行官黄瑜清曾将其形容为“科学家们对数据日益增长的需求，和相对落后的生产力之间的矛盾”。也正是这一矛盾，让AI自动化实验室在今年的AI4S投资热潮中再度迎来了自己的小高峰。</p>\n  <p>随着人工智能从数字世界走向真实世界，仅有数据还不够，需要推动AI真正进入科学研究、实验室、生产线等复杂物理系统，连接模型、数据、软件、硬件与物理执行，完成从思考、设计到执行、观测、持续反馈学习和优化的完整过程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_edc2f736de6b4a8c9c8aafb467b4f014@5930287_oswg8007061oswg7146oswg4019_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：镁伽科技</p>\n  <p>在国内，镁伽科技是较早布局该方向的公司之一。成立十年来，镁伽科技累计完成近6亿美元融资。2025年6月，镁伽科技曾递表港交所。据招股书，截至2025年6月，镁伽科技在手订单15亿元。</p>\n  <p>创业早期，镁伽团队曾想做一台能部署到上百万个生命科学实验室的通用机器人，但很快发现，科学家需要的不是单个设备，而是从实验设计到执行、数据处理的整套解决方案。</p>\n  <p>于是，团队从2019年起转向打造超级实验室。其核心载体是镁伽鲲鹏实验室，被公司定义为“生命科学行业的数据工厂”。该项目于2021年1.0版本投产、实现7×24小时无人实验，如今已迭代至4.0版本。</p>\n  <p>据镁伽科技方面公开信息，迭代后的镁伽鲲鹏实验室最大的变化是从“自动化执行”走向“自主智能体驱动”，定位面向AI for Science 建设的新一代AI原生科学发现与验证平台。实验室被拆成两个“大脑”，其中干实验大脑接到目标后会自动查阅文献、设计实验路径，湿实验大脑负责翻译和下发指令，中间的调度智能体指挥机械臂完成设备间转移，可将科学研发重新设计为“AI设计-自主实验-真实验证-数据生产-模型学习”的闭环。</p>\n  <p>以近期运行数据为例，该平台在7个月内完成了31条药物研发管线的规模化推进。</p>\n  <p>在业务侧，镁伽科技目前形成了科学智能与工业智能两大板块。其中，科学智能方面，公司已为超过500家客户交付相关基础设施，覆盖跨国药企、CRO、生物科技公司及科研机构，支持从早期科研、靶点探索、药物筛选到候选优化、生产质控等环节；镁伽鲲鹏实验室则为超过200家客户提供科研服务。</p>\n  <p>一个被多次提及的案例是，依托镁伽鲲鹏实验室，某抗体药研发团队用4个月完成针对18个靶点的56轮干湿实验闭环迭代，相当于传统模式下几十名名科研人员3、4年的工作量。</p>\n  <p>近期，镁伽科技还联合腾讯云、Twist Bioscience发起Poreva Open全球AI蛋白质设计挑战赛，不限模型和技术路线，由镁伽鲲鹏实验室承接湿实验验证，希望以超过一万条蛋白质设计序列的规模，为AI4S建立“开放的评价标尺”。</p>\n  <p>工业智能方面，主要聚焦半导体、光互联、新型显示等制造场景，提供缺陷识别、质量控制、良率分析、异常诊断与工艺参数优化等能力，目标不只是“发现缺陷”，还要让AI逐步理解材料、工艺、设备与良率之间的复杂关联。</p>\n  <p>与此同时，公司的商业模式也在不断演进，形成了两类交付模式：一类是以智能基础设施为核心，提供融合AI、软件与硬件的产品和平台；另一类是ARO（AI-Native Research Organization），将AI能力与实验执行融合，为客户提供科研服务。前者输出基础设施与技术能力，后者进一步将这些能力转化为实际科研成果，持续生成来自真实世界的高质量反馈，加速科学发现。</p>\n  <p>镁伽科技方面表示，本轮融资后，将继续加大核心技术研发和全球业务投入，加强在中国、欧洲、北美、中东及东南亚等市场的合作。“过去，AI最重要的能力是从人类已经积累的知识中学习。下一阶段，它将越来越多地进入真实世界，通过实验、制造和持续反馈，帮助人类创造新的知识、新的材料、新的工艺和新的产品。我们希望建设的，就是让这种能力可以规模化发生的基础设施。”黄瑜清称。</p>", "category": "tech", "published_at": "2026-11-19T00:30:00+00:00", "fetched_at": "2026-11-19T05:40:56.750668+00:00", "fingerprint": "93e99689e918c763"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨钠电正极材料厂商获金投致源战略投资数千万元，万吨线将于Q4量产", "url": "https://36kr.com/p/4076024574301061?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_842009cc149c46e7a4211f7bd8f55f45@6221844_oswg792979oswg2122oswg1376_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源/企业</p>\n  <blockquote>\n   <p>本文约<strong>3100</strong>字，建议阅读<strong>8</strong>分钟</p>\n  </blockquote>\n  <p>作者丨欧雪</p>\n  <p>编辑丨袁斯来</p>\n  <p>硬氪获悉，钠离子电池正极材料公司——钠远新材科技（无锡）有限公司（下称“钠远新材”）近期已完成数千万元A轮融资，由金投致源战略投资。本轮资金将主要用于马鞍山经开区先进电池终端集成智造基地建设，同时支撑无负极电池开发及海外市场拓展。</p>\n  <p>钠远新材成立于2022年，由深耕电池行业多年的德国海归博士团队创立。创始人刘众擎博士曾任职于德国于利希研究中心（欧洲顶尖能源研究机构），师从德国工程院院士Martin Winter，并曾在牛津大学和全球先进材料龙头德国肖特集团从事电池材料和产品的开发研究工作。</p>\n  <p>刘众擎认为，钠电正极材料的演进路线可以概括为三个阶段：2022至2023年以层状氧化物为主，2024至2025年转向NFPP，2026年起NFS逐步起量。</p>\n  <p>其逻辑在于：层状氧化物与锂电三元工艺相似，早期锂价高企时易于产业化，但锂价暴跌后性价比消失，且存在安全隐患；NFPP更接近磷酸铁锂，制程与应用有迹可循，因而率先起量；NFS技术难度最高——低温烧结的软性材料易吸水，高压下易分解产气。</p>\n  <p>目前，钠远新材已形成了NFS（硫酸铁钠）与NFPP（磷酸焦磷酸铁钠）两条聚阴离子材料体系，并配套循环回收材料体系。</p>\n  <p>硬氪了解到，钠远新材团队独创NFS“软硬结合+搭骨架”技术，通过硬质添加剂与主料的“AB料体系”解决了NFS单一材料压实密度低、高温循环差、易产气的技术瓶颈；NFPP则采用“超熔融合成技术”大幅降低材料粉阻，提高材料性能。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_ca294137fee542c89c3db441b9f4d097@6221844_oswg862428oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NFS（硫酸铁钠）材料（图源/企业）</p>\n  <p>公司对两款材料有清晰分工：NFS短期瞄准消费类、轻型动力、UPS、启停等非超长循环场景，并凭借3.6V高电压平台在PACK端形成显著成本优势；NFPP则瞄准大储能与人工智能AIDC场景，主打长循环与高压实。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_3332295f3d7148639e59f91539c6bbd7@6221844_oswg636601oswg1074oswg679_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">NFPP（复合磷酸铁钠）材料（图源/企业）</p>\n  <p>公司判断，NFS不含磷、BOM成本小于1万元/吨，而NFPP涉及磷元素，原料成本约一万五六至一万七八，两者光原料端差价即达1万元左右，且NFS是唯一不受磷酸铁锂价格波动影响的材料，对比NFPP，更适合使用在轻型动力等对价格高度敏感的场景中，对现存铅酸电池形成替代。</p>\n  <p>目前，钠远新材的NFS材料已于2025年在江西千吨级先行验证产线上实现量产，并采用第二代喷雾法工艺。公司正进一步开发硬质添加剂与AB料体系的适配方案，拓展材料应用边界。在无负极电池领域，公司投入较大，从早期1Ah以内的小软包，推进至10Ah、20Ah级别大电芯的开发，规划今年年底做出6020或7220体系的完整电池包并上车验证。</p>\n  <p>目前，公司与德国肖特集团（固态钠电开发项目）进行合作，由肖特提供固态电解质、钠远提供正极材料与无负极方案，将电池技术从纯无负极液态向无负极半固态、全固态逐步过渡；正极侧进行界面优化与纳米固态电解质包覆，负极侧进行SEI界面处理，未来有望将钠离子电池密度提升至250-320 Wh/kg，进一步应用于车用、低空、机器人等新兴场景。</p>\n  <p>同时，公司正将业务向终端集成延伸。钠远新材方面向硬氪表示，这一延伸并非主业变化，国内材料端业务始终是企业发展的第一曲线，而终端集成方案则是针对海外市场的“辅助性、相辅相成”的第二增长曲线。</p>\n  <p>这是因为，海外客户与国内电芯客户需求不同，海外市场往往需要一套完整的集成式解决方案，单纯提供正极材料难以落地。“海外对于钠电的终端需求不比国内弱，但它没有完整的产业链，没办法直接将材料出售到海外，所以我们必须参与到终端集成里去。”刘众擎称。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_2359e617c3754cdd8d2a4955c261b1db@6221844_oswg212612oswg600oswg400_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">钠离子电池电芯（软包）（图源/企业）</p>\n  <p>公司强调，自身定位仍是材料公司，布局电池终端集成更多是为了推动行业应用落地，加速市场化进程，未来PACK包量产不排除寻找产业内合作伙伴共同推进。</p>\n  <p>目前，钠远新材在海外已布局东南亚（印尼、马来西亚的光储一体化分布式项目）、中亚（巴基斯坦，巴基斯坦商务部及海外客户曾来华调研，公司牵头联合正极、电芯、终端PACK及整车应用等国内合作方共同对接）、俄罗斯及北方低温地区，以及欧洲市场（特种电源、房车、分布式储能等项目在谈）。国内方面，低温换电与低温轻型动力后装需求也在同步推进，与海外低温需求形成协同。</p>\n  <p>展望未来，公司认为行业竞争已从“讲故事、讲技术好”转向“产品能否真正满足客户需求、整个供应链能否都赚到钱”，2026至2028年要解决的是材料、电芯到终端怎么形成良性循环的问题。</p>\n  <p>产能规划上，钠远新材走的是“中试—千吨—万吨—远期扩产”的渐进路线：2024年在无锡建成百吨级工程技术中心，2025年江西千吨级先行验证产线实现量产，2026年安徽六安万吨级双栈产线计划Q4量产；同时正在筹划10万吨产能的远期规划。公司规划明年产能达到万吨、后年达到3万至5万吨，并逐步向10万吨级发展，可持续性将成为核心考验。</p>\n  <p><strong>以下是硬氪与创始人刘众擎的访谈节选（经编辑）：</strong></p>\n  <p><strong>硬氪：钠电正极材料从层状氧化物到NFPP再到NFS，为什么NFS最难却最值得做？</strong></p>\n  <p><strong>刘众擎：</strong>层状氧化物像锂电三元，设备、流程都接近，最早容易做，但锂价低于20万在价格上缺乏性价比，电压稍高还过不了针刺。NFPP像磷酸铁锂，制程和使用有迹可循，所以2024、2025年很多公司选择从层氧转做NFPP，量起得快。NFS是软性材料、低温烧结，易吸水，高压下易分解产气、导致鼓包胀气，当时行业里只有我们一家选这个方向。</p>\n  <p>我们2024年底推出硬质添加剂，用软硬结合搭骨架技术解决应用端问题，2025年量产，2026年客户验证陆续做完。NFS不含磷，BOM成本低于1万元/吨，是唯一不受磷酸铁锂价格波动影响的材料，比NFPP原材料成本便宜近1万块钱，明年起量后，很可能像当年NFPP替代层状氧化物一样，应用于更多场景。</p>\n  <p><strong>硬氪：NFS在PACK端的成本优势体现在哪里？</strong></p>\n  <p><strong>刘众擎：</strong>不能只看单颗电芯。比如做个7220电池包，NFS电压平台3.6V，20颗电芯就够达到72V；NFPP电压只有2.85V，72V电池包需要26到27颗电芯。一颗20Ah电芯30多块钱，光PACK端就差200块，而一组7220的包可能卖不到1000块，这就是20%的成本差。原来NFS这款材料有很多问题、用不了，但一旦能用，就能很快打开市场，今年下半年已经开始起量。我们也乐意帮助客户做电芯设计、拓场景，客户嫌倍率差，我们就把NFS从0.5C、1C迭代到20C、30C——客户做得好、多买材料，对我们也是好事。</p>\n  <p><strong>硬氪：无负极和固态是下一代方向，钠远作为材料公司为什么投入这么大？边界在哪里？</strong></p>\n  <p><strong>刘众擎：</strong>无负极被视为通往固态的第一级台阶，即无负极钠电-无负极半固态-无负极全固态三级演进逻辑。但无负极最大的问题是负极侧钠金属90多度会融化，只有半固态、全固态才能保证安全、过130度温箱测试，大动力必须过这一关。我们跟德国肖特合作，肖特出固态电解质，我们出正极材料和无负极方案，从纯液态往半固态、全固态过渡；正极做界面优化和纳米级包覆，负极做SEI界面处理。今年计划先完成20Ah级无负极电芯和整装模组包、让它上车跑一下，明年跟肖特推进半固态和全固态验证。但钠远是材料公司，做电芯方向的研究主要是为了推动行业往前走，未来电芯怎么生产，可能会找产业内伙伴一起做或推广，现在还没定。</p>\n  <p><strong>投资方观点：</strong></p>\n  <p><strong>金投致源董事长方健：</strong>看好钠离子电池的长期战略价值。钠远新材围绕NFS、NFPP两条聚阴离子正极技术路线构建差异化技术壁垒，打通正极材料、电芯设计到终端应用的技术闭环。钠远材料体系具备高安全、宽温域、可循环回收的特点，同时适配下一代无负极钠离子电池，高度契合储能、轻型动力等场景产业化需求。</p>\n  <p>本轮资金投向马鞍山经开区建设先进电池终端集成智造基地，是公司从材料端向下游终端系统延伸的关键一步，补齐“材料—电芯—PACK”一体化制造能力，缩短产品验证周期、提升交付响应效率；同时加速推进未来无负极钠离子电池在终端的应用验证。</p>\n  <p>马鞍山拥有成熟的新能源产业配套，金投致源管理的马鞍山经开区母基金依托地方产业生态，助力企业落地制造产能、就近对接下游客户资源。我们认为，钠电正处在商业化放量的关键窗口期，钠远新材双路线并行的一体化布局，有利于持续优化良率、降低系统成本，加速钠电成套方案落地；后续我们将持续赋能企业产业链对接、产线建设与市场拓展，共同助力、推动钠远的发展。</p>", "category": "tech", "published_at": "2026-11-19T01:46:57+00:00", "fetched_at": "2026-11-19T05:40:56.750661+00:00", "fingerprint": "61919a2de394dc80"}, {"source": "36氪 - 最新文章", "title": "撕开欧美中高端健身器材缺口，浙江跑出健身器材全球化黑马", "url": "https://36kr.com/p/4076016687617157?f=rss", "summary": "<p>过去三十年，全球家庭健身的话语权一直握在欧美品牌手中，从硬件、内容、到软件乃至AI的创新叙事，主场都在太平洋彼岸。中国虽然是全球最大的健身器材制造国，却始终只有工厂、没有品牌。</p>\n  <p>美国智能健身品牌Peloton市值一度自高位大幅回撤，使主流叙事判定“家庭健身”只是疫情催生的短暂泡沫，也让一些后起的新兴品牌抓住市场机会，来自杭州的健身品牌「麦瑞克」在海外实现逆势生长：2021年启动出海，近两年海外销售额复合增长率约75%。</p>\n  <p>今年麦瑞克在亚马逊美国站动感单车、划船机、椭圆机三大类目市占率均位居第一，划船机在欧美多个站点取得领先份额。TikTok&nbsp;Shop渠道健身器材类目市占率位居第一。</p>\n  <p>中国企业在硬件制造与供应链端积淀深厚，出海厂商长期习惯了依托供应链能力做大硬件产品规模。麦瑞克却选择了“软硬结合”的路径，通过扩大研发投入，补齐内容与算法短板，将硬件产品、软件系统与AI能力整合为一套完整的解决方案。在麦瑞克创始人、董事长罗卫波看来，这条路注定艰难，但是公司实现出海模式升级的必经之路。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_ce9fb066685f40b1b10e82610c89278f@5688585_oswg1897674oswg6746oswg5052_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">麦瑞克创始人、董事长罗卫波</p>\n  <p>麦瑞克的海外增长路径可以总结为：在市场端放弃先去东南亚轻资产试水、再升级欧美的常规路径，直接切入客单价200-600美元的中高端市场。在品类打法上，以打爆划船机这一经典单品登顶亚马逊销售榜，再按同样逻辑逐步拉动椭圆机、动感单车、跑步机等品类。并且同步拓展2B企业市场。</p>\n  <p><strong>1.定位欧美中高端市场，啃下品牌出海“硬骨头”</strong></p>\n  <p>麦瑞克启动出海前，在国内面对的是一个长期陷入价格战的健身器材行业，疫情后的消费市场低迷让大盘进一步承压。彼时麦瑞克已在国内拿下多个品类销冠，椭圆机、筋膜枪在京东、天猫做到销量第一，划船机、动感单车陆续弯道超车，年GMV超10亿元。罗卫波判断：“国内市场受价格战内卷，寻求全球新兴市场的突围。”</p>\n  <p>美国作为全球最大的健身器材市场，规模达几百亿美元，保持着约10%的年复合增长率。“如果在美国市场能取得绝对领先的成绩，那到欧洲和其他市场，产品只要做本地化适配也很容易取得成功。”罗卫波说。</p>\n  <p><strong>市场选择决定了麦瑞克从一开始就以“全球化布局”为核心策略，目标客群聚焦在全球家用健身中高端用户，产品客单价定在200-600美元。</strong>“我们当时放弃了铺货的模式，不做低价竞争，而是坚定做全球化品牌，走价值驱动之路。”。罗卫波表示。</p>\n  <p>具体来说，麦瑞克的海外选品思路有两点。一是锁定有氧设备的核心盘，罗卫波解释，“这个品类在海外的客单价高、消费者更看重品牌，低客单价产品难以塑造品牌”。二是坚持“三不做”原则：品质、颜值、工艺不过关，一律不做。</p>\n  <p>真正让麦瑞克在海外打开局面的是划船机。这款产品在出海前已在国内被验证为爆款，团队调研后发现，海外的划船机产品普遍存在外观老土、品质不稳、阻力偏小三大短板，并针对这些短板对划船机进行一系列产品优化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_671af0a486e948b585f8b77438fc38fa@5688585_oswg7830647oswg4000oswg1714_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">麦瑞克划船机</p>\n  <p>2023年亚马逊Prime会员日，定价400美元/台的“划船机MR-950R1ZH”销量近5000台，成为品牌第一个海外旗舰单品。</p>\n  <p>但是产品打爆凸显了“大件出海”背后的物流难题，健身器材多为大件或超大件，头程与尾程运费是两项主要成本，美国的尾程超重费按70磅、130磅分档计价，欧洲则是另一套阈值体系。</p>\n  <p>对此麦瑞克的应对方法是，同一套模具的核心部件（表盘、电机盖等）不变，只针对不同市场运费门槛调整可变部位的尺寸重量，从而优化尾程运费。并建设海外仓摊薄履约成本、缩短配送时效。</p>\n  <p>为提升海外本地化服务能力，麦瑞克计划明年在美国、欧洲落地自营办公室，招聘本土团队负责品牌、渠道与售后环节。</p>\n  <p><strong>2.跳出卖硬件传统路径，开拓高端2B市场</strong></p>\n  <p>在罗卫波看来，家庭健身器材行业有个近乎宿命的痛点：“一时兴起、三分钟热度、长期积灰。”用户买回一台设备，但缺乏指导，锻炼过程枯燥，设备很容易被闲置“吃灰”。</p>\n  <p>传统厂商一般只关注销售，卖出后与用户再无交集，这种一次性交易撑不起品牌心智，也更难实现复购。麦瑞克选择在系统软件和内容能力上解决这一难题，组建超过200人的研发团队，投入数亿元研发，搭起了“软硬服一体化”系统生态，包括自研AI私教课程APP麦瑞克，自建游戏团队开发实景竞技APP《绝影之竞2》。</p>\n  <p>目前，麦瑞克的“AI私教Mia”也已上线，近期也会推出AI心率私教产品，通过用户的心率、疲劳度等生理数据，定制单次或阶段性训练方案。罗卫波预计，随着硬件结构向中高端迁移，软件收入将迎来明显拐点，成为独立的营收来源，公司收入结构也有望从“卖硬件”走向软硬件并重。</p>\n  <p>三年前，麦瑞克推出高端智能健身品牌“绝影XENJOY”，同时面向C端客群与B端市场，目前已落地众多商业空间、企业健身房及企事业单位等B端客户场景。绝影团队还与国家体育总局训练局进行联合调研、共同研发，为运动员提供战备保障产品。“解决方案的能力本质是软件、内容与AI能力的结合。”罗卫波表示。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_0980efb573764c7b9fc5f4c0aaa0c1bd@5688585_oswg9181013oswg7008oswg4672_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">麦瑞克产品在海外市场销售</p>\n  <p>罗卫波还看到一个更大的潜在市场：新一代年轻人从小养成运动习惯，正逐渐成长为消费主力。“这一代人的运动意识，会明显高于我们这一代人。”</p>\n  <p>未来3-5年，麦瑞克规划双线并进：在国内抓住市场扩容机会，打造代表性的健身品牌；在海外以“硬件+内容+智能”产品力与国际品牌竞争中高端市场，对标国际品牌搭建海外内容体系。</p>\n  <p>在TikTok等海外社交媒体上，麦瑞克以达人建联与直播为核心打法，针对不同市场户型与运动痛点，进行产品差异化打磨，用生活化、可共情的原生内容还原真实居家使用场景；同时搭建金字塔式达人合作体系，联动垂类博主、居家KOC等多元本土达人，以真实体验口碑建立信任。截至目前，TikTok店铺累计建联达人超1.38万位。这套打法正逐步沉淀为适配TikTok生态的国货家庭健身出海范式。</p>\n  <p>在罗卫波的规划中，麦瑞克的成长路径可以总结为“商业验证、产品沉淀、品牌塑造、生态构建”这四步，终点是真正成为一家有全球化影响力的健身品牌。麦瑞克想做的，不只是把产品卖到海外，而是让中国运动科技真正参与全球竞争、站上世界舞台。</p>\n  <p>（作者 冯亚玲；编辑 杨越欣）</p>", "category": "tech", "published_at": "2026-11-19T02:50:37+00:00", "fetched_at": "2026-11-19T05:40:56.750655+00:00", "fingerprint": "fbd70647f132013c"}, {"source": "36氪 - 最新文章", "title": "从传统外贸到自有品牌：一家温岭工厂的出海转向", "url": "https://36kr.com/p/4076034642924416?f=rss", "summary": "<p>用热泵替代老式锅炉取暖在国内早已不是新鲜事，但却是世界许多地方正在悄然发生的改变。2025年欧洲热泵销量增长甚至达到两位数。</p>\n  <p>在浙江温岭，贴着「鑫磊」标识的空气动力设备与暖通空调产品正陆续发往东南亚、中东与欧洲市场。</p>\n  <p>作为一家国家级专精特新“小巨人”企业，鑫磊的业务覆盖空气压缩机、鼓风机、真空泵和暖通空调设备等产品。2025年，暖通空调设备收入同比增长24.75%，是公司主要增长板块之一。</p>\n  <p>1996年创办以来，鑫磊长期以贴牌代工为主，产品销往欧美与东南亚；近年鑫磊开始向海外推出自有品牌，试图在中国制造集体转向的节点，从幕后的制造者转变为台前的品牌方。</p>\n  <p>“中国制造企业过去几十年形成非常强的制造能力，但今天越来越多企业面对另一个问题：作为品牌，能不能被全球市场理解和接受。”领英中国区人才解决方案新客户开发部总经理张飞观察到，“产品做得好，和全球市场真正了解、信任这家公司，中间其实还有一段距离。”</p>\n  <p>钟佳妤就站在这道新题面前。她是鑫磊创始人钟仁志的女儿，2000年出生，从小在鑫磊厂里长大。2021年，钟佳妤大学毕业后回到公司，从市场部做起，2023年接班出任总经理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_d0bc916493d943cf90b9f26f53191d7c@5688585_oswg1810072oswg3941oswg2772_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">钟佳妤</p>\n  <p><strong>1.&nbsp;从5亩厂房到A股上市公司</strong></p>\n  <p>据钟佳妤介绍，鑫磊是全国较早拿到ASME罐体���证和CE认证的企业，也因此成为最早把小型空压机卖到欧洲的中国工厂之一。</p>\n  <p>“父辈创业时的第一个厂房只有5亩，还是从国道边租来的。”她印象里，那时生意极好，来拉货的车能一直排到凌晨，因为能做CE和ASME认证的企业很少。</p>\n  <p>2008年之前，鑫磊主要从事压缩机生产和销售，外销占比非常高。2008-2010年间，公司遭遇反倾销，被征收超过70%的关税，导致欧洲客户流失、订单与收入显著下滑。</p>\n  <p>鑫磊尝试过两条路破局：一是去越南设厂，最后因汇率剧烈波动放弃；二是与意大利厂商合作，由对方装配鑫磊的零部件，但因为成本上升，这条路收效有限。最后鑫磊还是回到产品本身，联合高校研制出旋转式、涡旋式、螺杆式等新产品，欧盟反倾销措施到期后，凭借新产品，订单又重新回来了。</p>\n  <p>也在那两年，鑫磊从零开始搭建国内销售体系，被迫长出属于自己的市场、产品与交付能力。钟佳妤认为，这段经历也为后来在海外打造自主品牌做了铺垫。</p>\n  <p>2020年新冠疫情期间，鑫磊参与中石化口罩生产线的设备替换，用国产设备替代韩国设备；2022年，公司获评国家第四批专精特新“小巨人”企业；2023年1月19日，鑫磊股份在深交所创业板挂牌上市。</p>\n  <p>这是许多中国制造企业熟悉的路径。张飞观察到，过去很多企业的全球化是产品的全球化。产品可能已经遍布世界，但企业始终隐身幕后。因为那时候客户首先关心的是产品、技术、质量和交付能力，至于这家公司是谁、拥有怎样的团队和文化，并不总是最重要的信息。</p>\n  <p><strong>2.&nbsp;先当学生，再当总经理</strong></p>\n  <p>钟佳妤学的是传媒，读书时在4A公司和甲方市场部都实习过，一毕业就回了公司。</p>\n  <p>最初在市场部，她负责品牌升级，重组团队，把展会、文稿、代理商门店的视觉输出统一起来。她最先改动的是最容易被忽略的品牌名。过去公司对外叫“鑫磊压缩机”，她改成了“鑫磊”。“随着产品品类越做越多，我们早就不止压缩机这一个产品了。”她希望留给客户的印象是，鑫磊是一家公司，一个品牌，而不是某个生产机器的工厂。</p>\n  <p>刚回公司时，钟佳妤看到问题就向上反映，觉得这里该改、那里也该改。董事长提醒她，如果只做传声筒，把问题转交上去，永远融不进这家公司。从那以后，她先把来龙去脉摸清楚，再带上两三套自己想好的方案，去找对应的负责人商量着办；能先动手的小事先自己做，出了问题自己承担。</p>\n  <p>2023年10月董事会换届，钟佳妤出任总经理。此前她负责市场和营销比较多，刚担任总经理时对制造和研发有些抵触：环节与环节之间靠人工衔接，数据靠人报送，和她在外面见过的先进产线相比差距很明显。</p>\n  <p>一位代理商的话对她影响颇深：“学习鑫磊，了解鑫磊，再改变鑫磊。”在她看来，一家企业能走三十年、走到上市，必然有它自身的逻辑，先学，再谈改变。</p>\n  <p>她选择先从销售入手，这个环节能顺着订单了解不同人的分工：一张订单从接手到交付，要经过研发、采购、生产，一个环节一个环节地跟，他们平时在做什么、卡在哪里、什么情况下会拖，都看得见。</p>\n  <p>上任以后，她换掉过一些人。对留下来、新进来的，她讲得很直接：平常工作的时候是下属，生活中都是我的老师。</p>\n  <p>第一年，她用两件事让同事们愿意坦诚相对。一是轮岗，管生产的人去干一段销售，管销售的人进车间待一段，位置一换，原来藏在各自岗位背后的信息差就没有了。二是项目，她不直接给答案，把问题摆到桌上，让相关的几个人各自拿方案，各自讲为什么这么选。几个项目下来，大家都了解了中高层的想法。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_a3269cd884d64831a99c1ef2e5ed3f99@5688585_oswg1986479oswg1920oswg1080_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">鑫磊员工工作场景</p>\n  <p>在出海这条线上，她认为自己做得最见成效的一件事，是把销售逼出了工厂。原先是几个大销售接单，其余人跟单，主要依赖展会、独立站与国际站获客，大部分销售都守在温岭，等客户上门。如今，鑫磊先借助海关数据平台建立联系，摸清谁在进口、进口多少、从何而来；再让销售做海外陌拜，长期驻外跑市场。</p>\n  <p>在海外组织的搭建上，鑫磊按距离远近分两套打法。对东南亚这类邻近且华人密集的市场，直接从销售团队内部竞聘转岗，辅以驻外补贴派出；管理岗用��国人，内勤则招募具备多语言能力的当地员工，地推销售、仓储与售后全部本地化。</p>\n  <p>更远、环境更复杂的市场，则要靠品牌吸引人。钟佳妤说，海外候选人第一次听到鑫磊，了解其实有限，所以鑫磊在领英上持续发布内容，让行业里的人先认识这家公司，再叠加薪酬待遇，自然有吸引力。</p>\n  <p>她对时机的判断也被证明是正确的：在俄罗斯、中东、东南亚，欧美品牌的统治力逐渐走弱，市场对中国品牌的接受度在上升，当地职业经理人换平台时，中国品牌自然成为不错的选项。俄乌冲突后欧洲能源紧缺，各国用热泵中央空调替代锅炉与天然气，形成一个快速增长的新兴市场。</p>\n  <p><strong>3.&nbsp;从贴牌到自主品牌</strong></p>\n  <p>近些年，鑫磊独立出自有品牌部，在越南、中东、荷兰设立分公司，聘用当地员工开展本地化销售，并配套本地化仓储与售前售后服务。</p>\n  <p>鑫磊还说服一部分贴牌商转为经营自己的品牌，并配套品牌支持政策，包括官网、展会、当地营销，与他们共同承担品牌营销费用。</p>\n  <p>不过做自有品牌，不可避免会和之前的外贸客户形成竞争关系。为此，鑫磊划了一条边界。</p>\n  <p>产品上，活塞空压机这类产品依赖商超渠道销售，渠道掌握在贴牌商手里，仍然以贴牌为主。转做自有品牌的，一类是工业设备，客户看重的不是知名度，而是研发与制造能力，对中国品牌接受度更高。另一类是热泵中央空调，加上光伏的海外补贴可达50%到60%。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261119/v2_59f1f894e37a49a391fabc553bce28e1@5688585_oswg9909574oswg5000oswg3333_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">鑫磊空气能热泵空调</p>\n  <p>从市场来看，欧美仍是鑫磊贴牌业务最集中的市场，自有品牌的发力点放在中亚、中东、东南亚和“一带一路”沿线。</p>\n  <p>品牌定位上，钟佳妤的思路是：做不了国民品牌，就做专业品牌。国民品牌靠大众认知，铺广告、进卖场，鑫磊主要瞄准安装商，做贴身服务，在当地做培训和技术支持，先把安装商服务好，他们在向终端推荐产品时，才会优先考虑鑫磊。</p>\n  <p>而在服务安装商之前，第一步要做的是先被安装商看到。工业品的采购决策链条长，客户往往在第一次联系销售之前，就已经查过一轮公司基本情况，如果这时候查不到、看不清，连被考虑的机会也没有。</p>\n  <p>领英是覆盖全球200多个国家和地区、会员超过14亿的专业网络，企业可以按行业、职能和地区，在目标市场里找到采购者和决策者，也让对方找到自己。“这也是鑫磊选择领英作为窗口的原因，当客户先在专业网络里了解过鑫磊，再接到销售的联系，就不必从零开始建立了解，信任也能更快积累起来。”张飞说道。</p>\n  <p>鑫磊曾计划为一家美国客户在越南建厂，已经选好地址地块都已看好。就在合同即将签署的周末，美国关税政策出台，钟佳妤经过思索最终决定放弃。很快美国对来自马来西亚和越南的产品启动反倾销与反补贴调查，而她的放弃反而避免了公司投资石沉大海。</p>\n  <p>“出海并非一味加仓，在众人争相布局之时，懂得不做什么，同样是一种能力。</p>\n  <p>”钟佳妤总结道。</p>\n  <p>过去三十年，中国制造靠产品走向世界。钟佳妤觉得，对自己这一代人来说，接过的不只是一座工厂，更是把“中国制造”讲成“中国品牌”的机会，谁能抓住这个机会，谁就能在下一个三十年继续留在牌桌上。</p>\n  <p>（作者 冯亚玲；编辑 杨越欣）</p>", "category": "tech", "published_at": "2026-11-19T02:55:58+00:00", "fetched_at": "2026-11-19T05:40:56.750646+00:00", "fingerprint": "fc0230b805d61f63"}, {"source": "36氪 - 最新文章", "title": "聚焦个人知识与成长领域，「Akasi」要做更垂直的Personal Agent｜早期项目", "url": "https://36kr.com/p/4075055709508740?f=rss", "summary": "<p>毋庸置疑，PA（Personal Agent，个人智能体）已经是当下最热闹的AI产品方向。</p>\n  <p>2026年9月，Meta 发布 Muse，希望它能主动替用户处理邮件、安排旅行、推进长期目标；10月，国内的 Today AI 宣布累计融资超过 2 亿美元。能记住一个人、持续替他办事的 AI，吸引了大公司和创业者同时入场。</p>\n  <p>但 PA 还远未收敛成一种固定的产品形态。替人订票、购物、管理日程的个人助手，是目前最容易被看见的一种。更广泛的探索还包括如何帮助一个人学习、创作、理解自己，以及在长期相处中提供陪伴。“Personal”意味着 AI 开始围绕一个人的经历、偏好和目标持续工作，至于这种关系最终会怎样存在，仍有许多可能。</p>\n  <p><strong>「Akasi」选中的，是知识与成长这一部分。它希望人们把读过、想过的东西积累在这里，再从中得到新的想法。</strong>这款聚焦知识管理方向的PA产品，由杭州的「谦贞数字」团队从今年4月开始开发，彼时还没有PA一词。他们相信，AI会从普适化的工具走向更私人的领域。</p>\n  <p>在谦贞数字团队看来，当个人智能体能做的事越来越接近，交互的质感会成为用户愿不愿意长期使用一款产品的关键。隔几天再聊起一个问题，用户希望对面还是那个熟悉的伙伴。它记得上次谈到了哪里，也有自己的看法，有时会提出不同意见。相处久了，共同的经历也会影响它下一次怎样回应。Akasi 希望通过 AI 人格化技术，把这样的体验带进日常的学习和思考。</p>\n  <p>Akasi能记笔记、管理知识，也能和用户聊天，把笔记做成播客。它的桌宠有可选择的性格，可以换装，还会写下它对用户的观察。谦贞数字团队称它为「个人知识领域的 Personal Agent」，希望它成为一个陪人学习、思考的伙伴。</p>\n  <p>11月18日，「Akasi」 正式上线。据团队提供的数据，Akasi 首轮内测的次日留存率为 42%，三日留存率为 33%。</p>\n  <p>过去一年，我们与谦贞数字创始人王金鹏有过多次交流。期间，谦贞从二十余人的团队扩展到如今的八十余人；围绕“AI人格算法”，他们的产品重心从多角色共创UGC世界游戏“乌托”，延伸到今天的 Akasi。而反复出现在谈话里没有变化的，是王金鹏的一个愿望——让 AI 在与人的相处中发生变化。</p>\n  <h2><strong>01 一只 Personal 的灵感罐</strong></h2>\n  <p>向我们演示 Akasi 时，王金鹏先打开了一张知识图谱——里面有心理学、人工智能的资料，也有佛学和哲学。每篇笔记是一个节点，点开后，右侧显示内容，节点之间的线表示知识的关联。其中一条线，把《金刚经》和荣格人格联系在了一起。</p>\n  <p>这是他自己在 Akasi 中积累的资料。王金鹏做 AI 人格算法研究，需要在几个学科之间来回阅读，希望理解人的心理，再把其中的一些机制转化成 AI 可以运行的系统。资料越积越多，如何在需要时重新调用它们，也成了日常研究中的问题。</p>\n  <p>这条连线让王金鹏想到了他在人格研究中关心的一个问题：人原本认定了一件事，后来又是怎样改变看法的？回头再读《金刚经》里的“破执”，他觉得两者之间有值得继续探究的地方。</p>\n  <p><strong>在Akasi主页面的右下角，有一个“灵感罐”，用来收集这些随时掉落的灵感。积累在知识库里的内容，可以由 AI 重新寻找关联，形成供用户查看、讨论的灵感。</strong>它试着从用户已经拥有的材料里，找出此前没有注意到的东西。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_8117a1e711824046878317ceb17d217d@5748245_oswg3002204oswg3810oswg1980_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Akasi的主界面，右下角有灵感罐</p>\n  <p>有一段时间，王金鹏密集研究世界模型，Akasi 根据他浏览的资料，从认知科学、心理学等七个维度整理了可进一步探索的方向。王金鹏说，其中关于预测编码与自由能的线索，也为他后续的研究提供了启发。</p>\n  <p>相比得到一篇完整的文章，他更看重这些尚未写成文章的想法。<strong>“现在要想搞到一个非常好的 idea，需要花大量的时间。”他说。</strong></p>\n  <p>在今天，让AI写出一篇文章、一份材料已经十分容易，写作之前的事情反而更具考验。此前读过什么，哪个念头值得追下去，两份看起来没有关系的材料能不能帮助自己理解同一个问题，生成速度加快之后，个人积累如何参与生成，反而成为一个需要重新处理的问题。</p>\n  <p>Obsidian 等笔记工具允许用户为笔记添加链接，构成知识网络。王金鹏希望在 Akasi 中，让 AI 承担更多寻找和组织联系的工作。</p>\n  <p>一位参与内测的用户，也提到了积累之后如何重新使用的问题。过去，这位用户会把检索和AI问答获得的内容复制进文档、手动整理，但文档建好后，往往很少再次打开。使用Akasi时，AI会自动将讨论内容生成笔记，他则在工作间隙重新翻阅，查看思路和知识点之间的关联。在这位用户看来，生成的笔记不仅保存了回答，也帮助自己梳理了思路。</p>\n  <p><strong>谈及Akasi现阶段希望抵达的地方，王金鹏告诉36氪，“希望大家一旦想到灵感，想到涌现的知识、创造力，就能想到我们的产品。”</strong></p>\n  <h2><strong>02 一个有自己视角的知识伙伴</strong></h2>\n  <p>在 Akasi 的早期内测中，备考学生的出现，让这个工具的一部分价值变得具体。</p>\n  <p>考研未必需要很多跨学科的联想，却需要长时间地阅读、整理和记忆。王金鹏发现，一些受邀参与测试的用户很喜欢桌宠联机，可以和朋友一起使用，像进入了一个小小的线上自习室。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_951093e5b05541158bc7aa69b155fc9d@5748245_oswg5105636oswg4474oswg2327_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Akasi的桌宠联机</p>\n  <p>在演示中，王金鹏打开桌宠日记，读出它对自己的观察：“今天主人一头扎进了佛学的逻辑迷宫里面。”</p>\n  <p>Akasi 的桌宠会根据用户留下的内容，回应他们近期关注的事情。读过的资料、记下的想法，除了变成知识图谱中的节点和连线，也成为这个伙伴了解用户的线索。</p>\n  <p><strong>在桌宠设置上，Akasi 提供不同的形象和十六种可选性格。</strong></p>\n  <p>对一个陪人阅读的伙伴来说，性格也体现在它把注意力放在哪里。用王金鹏举的例子，有的性格更关心一个人为什么这样做，有的更关心接下来该怎么办。团队希望，用户相处久了，能认出这个伙伴看问题的方式，也能感到过去一起读过、讨论过的内容，对下一次交流有影响。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261118/v2_5995e92385ae43858f2ac19a7fac6c02@5748245_oswg4355474oswg4475oswg2329_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Akasi桌宠的性格</p>\n  <p>要提供贴合个人的帮助，需要用户持续留下资料和想法。但每一次记录都要付出精力，用户也需要先感受到这些积累的价值，才愿意继续使用。</p>\n  <p>桌宠日记、联机与养成，是 Akasi 围绕持续使用所做的尝试。用户记录、思考，可以获得用于换装等奖励的积分。团队希望，这些日常反馈能让记录与学习更容易坚持；随着积累增加，知识之间的联系又能带来更长期的回报。</p>\n  <p>在 Akasi 里，用户可以放入已有笔记、文档和链接，也可以围绕资料与 AI 讨论。王金鹏称之为“知识复利”——它需要时间，也需要用户先有一些积累，“它不是上来就立马能给你产出这些东西。”</p>\n  <p>一位从事程序开发、使用过多款笔记工具的内测用户，把Akasi的价值分成了使用价值与情绪价值：知识图谱和播客具有实用价值，桌宠则带来情绪上的反馈。他喜欢把文件拖给桌宠处理的交互方式，也对桌宠联机格外感兴趣。对QQ宠物的记忆，让他期待这种陪伴和互动能在新的产品中延续。</p>\n  <h2><strong>03 让人格研究走进产品</strong></h2>\n  <p>怎样让一个 AI 有稳定可辨的性格，又能因为与人的相处而改变？这是谦贞数字旗下 AI 心智实验室 Emergi Lab 研究交互质感时面对的一个具体问题。一次讨论可能只影响它眼下的回应。哪些经历值得记下来，什么样的证据足以让它调整今后的判断，则需要分别研究。</p>\n  <p>早期，团队开发了基于荣格心理类型的人格适应框架 JPAF，研究不同心理类型如何参与判断、适应情境；后续的 Emergi-PersonaOS 则区分相对稳定的人格信念与当下状态，为长期变化设置证据、评审和版本记录。随着对记忆、情绪、关系和人格演化的研究深入，团队也将相关机制组织为名为「Emergi-MentalOS」的心智系统。</p>\n  <p>对 Akasi 而言，这些研究为产品设计提供了机制和方法。不同性格带来的讨论视角、历史资料的调用，以及桌宠对用户关注点的回应，都是团队希望持续改进的体验。研究提出的方法能否在真实使用中有效，还需要放回具体场景检验。</p>\n  <p>自研产品给了这种研究一个持续面对用户的机会。用户怎样组织资料，会沿着哪些线索展开讨论，又如何评价桌宠的反馈，都能帮助团队发现新的问题。团队希望把这些问题带回研究，再把改进用于产品，让技术积累与日常体验之间形成持续的反馈。</p>\n  <p>王金鹏自己也成了使用者。他说，自己几乎不需要陪伴类的 AI 产品，现在却会用 Akasi 整理阅读和研究，寻找值得继续追下去的线索。从他自己的知识图谱，到用户日常留下的一篇笔记、一段讨论，Akasi 为团队提供了观察个人知识需求的具体场景。</p>\n  <p>从第一款产品《乌托》到如今的 Akasi，两款产品在测试期间的用户留存和持续使用表现，都远好于各自的同类产品。团队在调研中发现，用户在意的是与自己相处的那个 AI 有什么独特之处：它记得此前的交流，也有自己的看法。团队认为，人格化明显提升了产品的交互质感，这正是用户愿意一次次回来的原因。</p>\n  <p>在谦贞数字看来，当 AI 的能力越来越接近，交互的质感会成为用户选择谁、留在谁身边的理由。这也是未来 AI 产品真正的分水岭。</p>", "category": "tech", "published_at": "2026-11-19T03:40:21+00:00", "fetched_at": "2026-11-19T05:40:56.750630+00:00", "fingerprint": "7883bfec2becd88f"}, {"source": "少数派", "title": "App+1｜NodLink：AirPods 变鼠标，动动脑就能操作电脑", "url": "https://sspai.com/post/118732", "summary": "转头移动光标，歪头点击，开口说指令。不用摄像头，也不用另外戴什么设备。<a href=\"https://sspai.com/post/118732\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-18T06:54:30+00:00", "fetched_at": "2026-11-19T05:40:54.934488+00:00", "fingerprint": "5730ad87d613e83b"}, {"source": "少数派", "title": "10 月音乐精选：音乐丰收季，必听这 7 张新专辑", "url": "https://sspai.com/post/118985", "summary": "编者注：2026年我们将重启少数派音乐推荐栏目FM3.14，特邀资深音乐从业者及爱好者为大家推荐优质的华语独立、流行音乐，今年我们也很荣幸邀请到老朋友飞傲，为本栏目冠名。飞傲目前拥有品牌以音乐发烧友为 ...<a href=\"https://sspai.com/post/118985\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-18T08:59:58+00:00", "fetched_at": "2026-11-19T05:40:54.934483+00:00", "fingerprint": "9df597e3220c2c9b"}, {"source": "少数派", "title": "派早报：Apple 年度应用、TGA 2026 分别公布入围名单等", "url": "https://sspai.com/post/119239", "summary": "AMD 更新虚幻引擎 FSR 插件、Google Wallet 登陆 iOS 等。<a href=\"https://sspai.com/post/119239\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-19T00:29:30+00:00", "fetched_at": "2026-11-19T05:40:54.934477+00:00", "fingerprint": "b573351f9d14e65b"}, {"source": "少数派", "title": "徒步旅行指南 | 玉龙虎跳峡与天堂雨崩", "url": "https://sspai.com/post/119039", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/119039\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-11-19T02:58:08+00:00", "fetched_at": "2026-11-19T05:40:54.934467+00:00", "fingerprint": "54747887b550a01f"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.4879 CNY ↓-0.04%", "
