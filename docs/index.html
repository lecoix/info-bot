rite about the dangers of AI?", "url": "https://www.theverge.com/ai-artificial-intelligence/937801/pope-leo-xiv-magnifica-humanitas-ai-pangram", "summary": "It's possible that AI was used to write parts of Pope Leo XIV's latest encyclical about AI's impact on humanity. An analysis by Linch Zhang posted on the forum LessWrong found certain paragraphs of Magnifica Humanitas to be between 40 percent and 100 percent written by AI, according to the popular AI detector Pangram. The [&#8230;]", "category": "tech", "published_at": "2026-05-27T00:38:11+00:00", "fetched_at": "2026-05-27T02:58:18.183279+00:00", "fingerprint": "36305a8d8ebe182b"}, {"source": "36氪 - 最新文章", "title": "硅谷AI一线观察：一人花掉50万美金Token背后的大厂焦虑", "url": "https://36kr.com/p/3826390617870984?f=rss", "summary": "<p><strong>文｜周鑫雨 邓咏仪</strong></p>\n  <p><strong>编辑｜张雨忻</strong></p>\n  <p>硅谷持续了两个多月的Token-Maxxing（Token军备竞赛）焦虑，在Meta以一种戏谑的方式按下了休止符。</p>\n  <p>前情大家都知道了：2026年3月，为了鼓吹自己是一家“AI-Native”公司，Meta曾在内部上线了一个“Claudeonomics（Claude经济学）”榜单：员工消耗的Token越多，排名就越高；垫底的员工，有被裁的风险。</p>\n  <p>不过，当我们在4月末来到硅谷，Meta的朋友带来了故事的后续：榜单上线一个月后，第一名的员工将Token消耗刷到了<strong>近50万美金/月，折合近3000亿个Token。</strong></p>\n  <p><strong>不久后，Meta下架了这个榜单。</strong>至于下架原因，公司内没有明确说法，但员工猜测是因为“畸形竞争下消耗的token成本已远超Meta预期”。</p>\n  <p>2026年硅谷的开局，很焦虑，很魔幻。</p>\n  <p>“你要是半年前来湾区，大家心态还挺不错。”在圣何塞的一家韩国汤饭店，我见到了华人Agent创业者Ryan。</p>\n  <p>四周的普通话此起彼伏——随处可见的华人，或是全球Top10大厂的员工，或是跨洋寻机的创业者，他们构成了硅谷AI大军的绝对主力。</p>\n  <p>如今，调动湾区华人情绪的，大约是两件事：</p>\n  <p><strong>第一件事，是Token-Maxxing焦虑和大幅裁员。</strong></p>\n  <p>Token，“AI处理信息的最小单位”，正在代替DAU、GMV等指标，成为硅谷公司的新型攀比维度。</p>\n  <p>无论是设置员工Token消耗排行榜，还是慷慨地给予员工“不设限”的Token额度，硅谷厂商都透露出深深的焦虑：没有人想在AI转型中掉队。</p>\n  <p>但AI革命的另一面，是让裁员有了冠冕堂皇的理由。继Salesforce年初减员1000人、Amazon宣布今年裁减1.6万个职位后，Meta又对员工“打了个响指”：5月20日开启裁员，比例达10%，波及约8000人。</p>\n  <p><strong>第二件事，则是Manus收购案的反转。</strong></p>\n  <p>2025年12月30日，数十亿美金的一纸Meta收购文书，曾将Manus捧上“华人创业之光”的神坛。然而，仅仅过去4个月，这场收购就因合规问题，被强制叫停。</p>\n  <p>这是局势裂隙下，华人创业者合规焦虑、身份焦虑、生存焦虑的一个缩影。“中国团队-新加坡套壳-美国找钱、找买家”，这一全球套利的经典方法论开始失效。</p>\n  <p>Ryan直言：To be Chinese or not to be，是创业公司成立Day1就要做出的选择。</p>\n  <p>不过，即便光景不复从前，最先进的模型、背靠的全球市场和资源，以及一级市场更多元的钱，让硅谷依然是AI创业的耶路撒冷。</p>\n  <p>5月2日，旧金山一家小会场，挤满了近200名华人。这场主题为“Build&nbsp;For&nbsp;the&nbsp;NEXT&nbsp;Wave”的AI创业者沙龙，发布不到3天，门票就显示售罄。</p>\n  <p>作为主办方之一，Global&nbsp;AI社区Linkloud的联合创始人钱觐开告诉《智能涌现》，硅谷的华人创业者，普遍比在国内要松弛很多。他记得，不少在国内焦虑的创业者来到硅谷后，都感叹：硅谷的创业环境实在太好！</p>\n  <p>“<strong>在硅谷，创业的容错率很高，一个方向做不出来就迅速pivot（指调整方向），这在硅谷很正常</strong>，毕竟现在行业变化节奏太快了。”他总结。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_08a848f8bf3941a384559b20886c27a0@5783683_oswg171158oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">△Palo Alto的Blue Bottle，聚集了不少聊项目的创业者和投资人</p>\n  <p>以下，是我们在硅谷看到的有关Token焦虑、裁员阴云、出海创业的图景。Enjoy！</p>\n  <h2><strong>硅谷大厂的焦虑是什么形状的</strong></h2>\n  <h3><strong>在Meta，我已经不敢写文档了</strong></h3>\n  <p>在硅谷一众大厂中，Meta常被认为是在AI赛道上还没有找到自己的位置的那一个。而卷Token使用和激进的裁员也让焦虑也在员工中蔓延开来。</p>\n  <p>“同事前几天还在和我说，以后都不敢写文档了。”一位Meta员工对《智能涌现》表示。</p>\n  <p>硅谷的开放文化正在遭受AI的剧烈冲击。像Meta、Google这样的硅谷巨头，多年以来都实行高度开放的代码共享机制，不同产品线（如WhatsApp、Messenger）间，员工们都可互相查看和复用代码变更，这是为了能够共享好想法，推动业务迅速贴袋。</p>\n  <p>但Vibe Coding改写了这一切。</p>\n  <p><strong>“如果你把想法写成了共享文档，被其他员工看到，很可能就被别人拿去让Agent进行Coding。”</strong>上述员工说，一旦做出好产品，提供想法的人就只能获得design credit，而落地的功劳（execution credit）则属于做出产品的员工，后者是晋升的更核心依据。</p>\n  <h3><strong>组织调整更加激进</strong></h3>\n  <p>近期，Meta从各个部门强制抽调了超过千名员工，成立新部门——应用人工智能工程部（Applied AI Engineering），主要为如今Meta最炙手可热的MSL实验室（Super Intelligence Lab）提供支持，包括开发AI工具、标注数据、建立评测集等。</p>\n  <p>被抽调的员工基本没有活水或者更多选择，这在硅谷的大厂调整中很少见。“在加入这个部门后，很多人就被安排做Label（数据标注）。”上述Meta员工说。</p>\n  <p>这是因为，高质量数据依然是目前模型训练的瓶颈，Meta相信，让内部员工做数据，能够更好地反哺模型训练。</p>\n  <p>与此同时，Meta还发起了模型能力倡议（Model Capability Initiative），强制在美国员工电脑上安装一款新软件，收集员工们日常操作电脑的所有操作，作为提升模型能力的数据来源之一。为此，Meta的员工发起了激烈的抗议。</p>\n  <p>愤怒与焦虑的复杂情绪裹挟着这里的员工：<strong>“不知道什么时候自己就被替代了，不如回家先学学修水管吧。”</strong>另一位Meta员工对《智能涌现》说。</p>\n  <h3><strong>面向扎克伯格创业</strong></h3>\n  <p>虽然Manus被收购的梦碎了，但在硅谷的华人创业者依然有不小的机会把自己卖给硅谷大厂。</p>\n  <p>根据Crunchbase的统计，仅Salesforce、OpenAI和Snowflake三家公司，在过去三年中就完成了35起公开收购交易。</p>\n  <p>其中，Meta是鲜少乐于收购华人AI公司的企业，比如由汪滔（Alexandr Wang）成立的Scale AI，以及由英伟达华人研究员王晓龙成立的具身大脑公司Assured Robot Intelligence，均被Meta收入囊中。</p>\n  <p>相对的，一名Meta研究员直言对我们表示，Meta“宽松”的收购策略在硅谷一度为人诟病，“近几年收购的公司，很多成立不到一年，没有经历过市场的验证。”</p>\n  <p>一名硅谷华人创业者直言：<strong>“现在硅谷流行面向扎克伯格创业，因为他买公司不那么挑。”</strong></p>\n  <h3><strong>硅谷式“赛马”</strong></h3>\n  <p>当我们很自然地想把大厂的焦虑具象化到内部赛马时，却意外发现，在2023年前后入职硅谷大厂的员工，大多对“赛马”这个词感到陌生和不理解。</p>\n  <p>在硅谷有一个共识：“赛马本身造成的资源、人才浪费，可能比失败带来的更高。”在圣何塞的一场展会上，Google DeepMind的一名研究员告诉《智能涌现》。</p>\n  <p>所以，硅谷大厂的惯常做法是，让<strong>最聪明的“大脑”相对自由地探索，再给予最大权限的算力支持</strong>——Claude Code、Nano Banana等项目最初都不在公司的战略规划内，而是来自某位研究员的突发奇想，但在确定为重要方向后，则给予足够支持。</p>\n  <p>不搞内部赛马，硅谷大厂的竞赛机制通常是：<strong>与全球SOTA“赛马”。</strong></p>\n  <p>长期以来，英伟达都是Meta的主要芯片供应商。但通过自主研发芯片，摆脱对外部算力供应商的依赖，掌握模型训练和推理的核心环节，一直是Meta的野望。所以，Meta的芯片业务MTIA的目标则定为了“打平英伟达的性能和生态”。</p>\n  <p>这场外部竞赛的最终结果，将交给Meta代号为“Avocado”的模型业务评判，胜者将被采购。“被Avocado采购，是MTIA今年的终极目标。”这名创业者总结。</p>\n  <p>再比如，在Google内部，DeepMind是唯一被允许可以不限额使用Claude Code、CodeX等竞品模型（为保证数据安全，Google采用了本地化部署）的部门——使用顶尖Coding模型提效的同时，一名Google员工告诉我们，DeepMind意在时刻洞悉对手的变化。</p>\n  <h3><strong>一把手工程</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_a98744c55edb42979560eb64e31216a3@5783683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">DeepMind大楼。</p>\n  <p>在Mountain View，你很难不被一幢连绵覆盖液压太阳能屋顶的巨大玻璃建筑吸引。</p>\n  <p>一名Google的朋友告诉我们，能在里面办公的，是两种人：一是Google董事级别的高层，二是DeepMind的研究员。放在国内，这种办公模式大概等同于张一鸣常驻Seed办公。</p>\n  <p>这种在空间上极度扁平的组织形式意味着：<strong>AI，已经成为Google的一把手工程。</strong></p>\n  <p>在极度开放的Google园区中，这幢楼却几近与世隔绝。朋友提到，Google其他业务的办公楼之间，权限是相通的，员工可以拿工牌刷开任意写字楼的大门。唯独DeepMind Office是个例外。</p>\n  <p><strong>“极致专注，极致Bottom-up”</strong>，一名DeepMind研究员如此概括DeepMind的文化。</p>\n  <h2><strong>Token-Maxxing进行到哪一步了</strong></h2>\n  <h3><strong>越Token-Maxxing，公司就越先进吗？</strong></h3>\n  <p>在硅谷，大家对Token-Maxxing已经开始祛魅。</p>\n  <p>Google一名朋友告诉《智能涌现》，自从公司鼓励非开发者用Antigravity（Google的Coding Agent）做Vibe Coding，部门的代码量膨胀了3-4倍，但验收率也下降了30%。</p>\n  <p>2026年Q1，工程管理软件公司Jellyfish收集了7548名工程师的数据。他们也发现，Token消耗量最高的工程师，以10倍的Token成本，仅实现了2倍的产能增长。</p>\n  <p>这意味着，<strong>Token-Maxxing提升的仅仅是代码数量，而不是价值。</strong></p>\n  <p><strong>AI增加的隐形管理成本，也往往为人忽略。</strong>“养了好几只小龙虾，小龙虾之间会打架，谁来管？”一位创业者Sharon已经在不少公司观察到人和Agent间的冲突：一个Agent改了代码，另一个Agent不知道，继续在旧版本上跑；两个Agent同时优化同一段逻辑，还会输出互相矛盾。</p>\n  <p>这种情况下，AI提效的价值还没看到，却先变成了一种新的管理负担。</p>\n  <h3><strong>比起用Token来卷员工，“商人”马斯克更想把Token卖出真金白银</strong></h3>\n  <p>而在一众Token-Maxxing的硅谷头部大厂中，稍显特殊的是特斯拉。</p>\n  <p>几名硅谷大厂朋友告诉我们，<strong>特斯拉和SpaceX内部，对员工的Token用量有严格的限制。</strong></p>\n  <p>至于原因，一位朋友猜测：比起用Token来卷员工，“商人”马斯克更想把Token卖出真金白银。</p>\n  <h3><strong>“Stop Hiring Humans”</strong></h3>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_3790bc5726224c94b7c59c8d9226c982@5783683_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Artisan AI的广告牌</p>\n  <p>一家名为Artisan AI的AI市场营销公司，自2024年起在湾区投放了大量写有“Stop Hiring Humans”的广告牌。</p>\n  <p>这句略带警示和挑衅意味的话，在天空中的热气球、拉横幅的直升机、路边大广告牌上随处可见。</p>\n  <p>但Artisan AI大举投放的动作很大程度是为了博眼球。Artisan AI CEO Jaspar Carmichael-Jack后续也在博客上承认，这句标语，就是为了引发争议和讨论。</p>\n  <p><strong>“湾区是一个表演性质很强的地方。”</strong>硅谷创业者Ryan评价，“Token-Maxxing、裁员，归根结底都是大厂们展示先进性的表演。”</p>\n  <p>同样在天空飘过的标语，还有：SaaS is Dead（SaaS已死）。</p>\n  <h2><strong>创业者的商机在哪里</strong></h2>\n  <h3><strong>“我快把签证办理干上市了”</strong></h3>\n  <p>什么是硅谷来钱最快的业务？答案之一，一定有H1-B工作签证办理。</p>\n  <p>Base在湾区多年的Neil告诉我，自己面向中国创业者的H1-B工作签代办业务，已经排到了2026年底，“还有人加钱，问我能不能插队加急”。当我问他办签证两年以来，到底赚了多少钱，他故作神秘地告诉我：“我快干上市了。”</p>\n  <p>在头部美元基金云集、坐拥斯坦福校园的Palo Alto，年收入达几百万美金的Visa Agency比比皆是。当你在Palo Alto最火的拉面店Nagi排队，转眼就能看到隔壁Visa Agency的硬广：Waiting for ramen？What about your visa？</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_0023ae37378e48829398cf0279134539@5783683_oswg170039oswg1080oswg1439_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Palo Alto的Visa Agency广告</p>\n  <p>蓬勃发展的签证业务，微妙指向的是局势的变化：想要来硅谷创业，必须先解决身份问题。</p>\n  <h3><strong>华人面貌的翻转</strong></h3>\n  <p>数年前，华人在硅谷创业，会面临一些不宣于口的顾虑——TikTok的前车之鉴下，想要拿到硅谷主流VC的投资，华人身份可能会成为一道坎。</p>\n  <p>但在大模型竞争已经常态化的当下，无论在OpenAI、Anthropic这样的明星初创还是巨头，华人都已经是核心AI团队中的重要力量——Meta的Super Intelligence Lab的初始11人团队中，有7位都是华人。</p>\n  <p>如今在硅谷创业，理想的团队配置是：华人做技术，美国当地人做销售。“如果AI公司里没有华人创业者，硅谷VC很可能会觉得你不行。”一位创业者笑言。</p>\n  <h3><strong>硅谷有自己的增长Vibe</strong></h3>\n  <p>近三个月来，Base在旧金山的海外增长顾问Ying，收到了近10个国内AI应用的Offer，其中不乏估值过5亿美金的明星产品。</p>\n  <p>但她最后都拒绝了，理由是：和创始团队聊了之后，发现团队根本不懂硅谷的增长Vibe。</p>\n  <p>所谓的硅谷增长Vibe，Ying告诉《智能涌现》，是一种很暧昧、很抽象的气氛，<strong>“简单来讲，是让目标用户，在Chill的、没有倾略性的氛围中，自然而然成为你的用户”。</strong></p>\n  <p>她心目中的增长模范生，是伯克利华人辍学生Allen Wang和Eric Liu创立的AI约会软件Ditto AI。</p>\n  <p>如果走在斯坦福校园中，你能在树干、宣传橱窗上看到Ditto AI的传单上醒目地写着：Get a Date Every Wednesday！这一类似“疯狂星期四”的标语，很快在学生群体间病毒式传播。</p>\n  <p>去年，Ditto AI还在湾区包了一艘游艇，供用户们约会社交。“包游艇在美国受很欢迎。”Ying提到，“但这是超出很多中国Founder认知的方式，大家也不愿意给预算。”</p>\n  <h3><strong>Turning Token into Dollars</strong></h3>\n  <p>4月末，在一场著名的创业者社区活动中，GenSpark在演讲最后大方地给出了Token优惠券：只要扫码，每个人可以领1000 credit。这已经是如今AI创业公司的常见营销动作。</p>\n  <p>但2026年，Token的价格与从前不再同日而语。</p>\n  <p>一位在Genspark演讲现场的参会者向《智能涌现》回忆他当时的第一反应是：“这到底得撒多少钱啊？”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_15907cce80b44877a6d7102fca84b0e5@5783683_oswg64322oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">GenSpark的Token券</p>\n  <p>“都在讲Token，无一例外。”Linkloud CEO钱觐开表示。4月末，他们在旧金山办的一场活动，就以“Turning Token into Dollars”命名。</p>\n  <p>热切讨论商业化，同样是因为Token的价格已经涨到令人吃惊的高位——引领这波Agent浪潮的Anthropic，ARR已飞涨至300亿美金，反超了OpenAI。</p>\n  <h3><strong>AI的商业模式创新存在吗？短期内可能只是旧商业逻辑的回归</strong></h3>\n  <p>在硅谷，大家今天仍在卷Token，卷谁更AI native，卷谁的组织改造更彻底。但Token烧到这个程度，一个老生常谈的问题被摆在桌子上：这些成本最后要怎么变成钱？</p>\n  <p>一位在硅谷从事多年线上广告的华人创业者Sharon告诉《智能涌现》，AI产品的商业化未必会先长出什么新物种，反而很可能先回到广告这条老路上。</p>\n  <p>在他看来，无论是ChatGPT还是豆包，这类产品最终都很难绕开广告，只是眼下还处于克制测试阶段，远没有全面放量。</p>\n  <p>“ChatGPT的广告没有任何创新。”Sharon说，OpenAI的广告经过了多种形式的探索，比如用户聊游戏就推游戏广告，最后发现根本做不到精准匹配，还是回到了最传统的竞价逻辑：谁出价高，谁上，在答案下方直接增加一个付费广告位。</p>\n  <p>但在他看来，所谓AI时代的新商业模式，至少在广告这件事上，目前只是旧生意换了个新入口。</p>\n  <h3><strong>来自中国的Token，正在湾区百花齐放</strong></h3>\n  <p>把国内模型厂商的Token，以更低价格转卖给海外客户，连孙宇晨都在5月推出了中转站新业务B.AI。</p>\n  <p>国内Token价格是海外的十分之一到十五分之一，而性能差距不到一半。Sharon说，他的公司每月消耗的云和Token并不多，是连年框都没签的小客户，但已经有国内销售主动来卖国内的Token。</p>\n  <p>不过，大家如今都对模型的商业化毫无安全感。模型迭代几乎按月更新，代理商也不敢把钱砸给某一家做核心代理——上个月押注的模型，这个月可能就被新玩家碾过去了。</p>\n  <p>此前在全球爆火的Seedance2.0，若要获得企业使用权要与火山引擎签1000万元的年框，只有头部影视公司愿意交这笔费用，但更多人正在观望。</p>\n  <p><strong>——</strong></p>\n  <p>Ryan告诉我，湾区有一种特有的“<strong>阳光抑郁症</strong>”：</p>\n  <p>每天都是一样的好天气，没有分明的四季，周围的景色几乎一成不变，“一旦生活不改变，人就会陷入循环停滞的空虚和恐慌”。</p>\n  <p>所以，“在湾区，人不能停下来，要主动改变”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_d86453a9e75348329486f0434a8c7e34@5783683_oswg478457oswg1080oswg402_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_403a3d454e914d54a0f209e24198f1f3@5783683_oswg53997oswg900oswg335_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流！</p>", "category": "tech", "published_at": "2026-05-27T00:25:50+00:00", "fetched_at": "2026-05-27T02:58:18.035962+00:00", "fingerprint": "9388fdc950e26e6d"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜男士美妆品牌「GREENLAB绿所」获宝顶创投战略投资，张耀东出任公司董事", "url": "https://36kr.com/p/3825817310368385?f=rss", "summary": "<p>36氪获悉，无感化面部理容品牌「GREENLAB绿所」（以下简称“绿所”）近日宣布完成千万级新一轮融资，本轮由宝顶创投战略投资。融资完成后，宝顶创投创始合伙人张耀东将出任绿所公司董事，参与品牌战略、产品矩阵、渠道经营等方面的长期建设。</p>\n  <p>这也是继2025年完成Pre-A轮融资后，绿所在半年左右时间内再次获得外部资本加注。据了解，本轮资金将主要用于新品研发量产、品牌建设、渠道经营及组织能力提升等方面。</p>\n  <p><strong>绿所是36氪持续关注的品牌，定位“无感化面部理容”，重点面向“精致懒”的年轻男性用户。所谓“无感化”，指的是用户在购买、使用和呈现效果上都尽量没有心理负担：产品要自然、方便、高效，不需要复杂技巧，也不希望被明显看出“化妆感”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_dd3e7e557fb84685a2881f2d617788bd@5748245_oswg5748203oswg4801oswg3001_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">绿所的“轻雾修颜乳”产品</p>\n  <p>对绿所来说，本轮融资的意义不止于资金本身。张耀东是中国美妆行业的资深操盘手之一，曾任欧莱雅中国副总裁。公开报道中，张耀东曾多次提到，消费品牌不能只依赖流量和资本催熟，更重要的是持续创新、精细化运营和系统性品牌能力。</p>\n  <p>这也与绿所现阶段的需求契合。品牌成立早期，新消费品牌常常先验证单品、渠道与人群，而当单品跑通后，如何从“爆品”走向“品类”，再从“品类”走向“品牌”，才是更长期的问题。</p>\n  <p>在此前接受36氪采访时，绿所创始人William曾提到，男士美妆需求长期存在，但市场供给常常停留在刻板印象里：包装偏“硬汉”、卖点集中在控油补水，或者直接套用女性彩妆逻辑。绿所切入的是一个更具体的场景——当年轻男生希望改善黑眼圈、痘印、肤色暗沉等面部状态时，是否有一种比粉底更轻、更自然，又比素颜霜更有修饰力的产品？</p>\n  <p>由此，绿所推出了主力单品「原初修颜乳」。这款产品介于传统粉底液与素颜霜之间，主打徒手上妆、自然不厚重、洗面奶可洗净，试图降低男性用户进入美妆消费的门槛。据《青眼》，绿所曾凭借该产品在2025年上半年位列男士彩妆品牌线上市占第一；另外，2025年全年，原初修颜乳累计销量超过80万支。</p>\n  <p>今年1月，绿所上线新一代产品「轻雾修颜乳」。相比早期产品，这款新品在品质和价格上均做了全面升级，但用户购买热情并未下降，老客买单之外，新客也愿意做优先尝试。据William透露，2026年1月绿所的单月GMV已突破千万元，目前为止，2026年的月度GMV持续保持同比三位数增幅。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_814858912953431baf55a622869194b0@5748245_oswg3518380oswg4801oswg3001_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">绿所的“轻雾修颜乳”产品</p>\n  <p>人群层面，绿所重点瞄准18-30岁的“精致懒”人群，且在实际销售中，其进一步发现18-22岁的大学生用户占比接近50%，这意味着用户要的不只是“男士美妆”，而是更具体和细化的“场景与情绪解决方案”——年轻男生“怎么让我一下子变得好看，变得精神”，这一需求集中分布在四大场景中：约会、面试、拍照、上大课。这些轻量但高频的生活节点，构成了绿所重点经营的用户阵地。</p>\n  <p><strong>产品上，绿所在未来两到三年仍将围绕“修颜”展开。除已有的修颜乳之外，其计划推出针对黑眼圈、深色痘印的局部遮瑕产品，以及更方便随身携带的修颜气垫。</strong>今年9月，绿所还计划对原初修颜乳进行2.0迭代，通过新的包材设计强化日常通勤、随身携带等场景。</p>\n  <p><strong>更进一步，绿所希望把“修颜乳”从一个单品，推向一个更清晰的品类。</strong>William告诉36氪，绿所正在开展团体标准的研究，计划围绕修颜乳的配方逻辑、原料筛选、延展性、光泽度、易洗卸程度等维度建立标准，并在年底形成团体标准。对一个新品牌而言，这一动作的意义在于，将前端的用户洞察转化为更可被行业识别的品类语言。</p>\n  <p>渠道方面，绿所正在从单一兴趣电商驱动，向更均衡的线上渠道结构调整。去年，绿所销售中约八成来自抖音，其中达人直播占比较高；今年，抖音占比降至约55%，天猫占比提升至约30%。对消费品牌而言，抖音通常更偏兴趣电商和冲动购买，天猫则更接近搜索型、货架型场域，天猫占比提升，意味着用户在内容平台被种草后，开始主动搜索并购买品牌产品。</p>\n  <p>放到行业里看，男士美妆仍是一个“看起来热、做起来难”的赛道。一方面，女性美妆市场竞争高度饱和，男士护理、男士理容被视为新增量方向。艾媒咨询数据显示，2025年男性护肤市场规模约250亿元，复合增长率达18%。新华网援引电商平台数据称，2025年“双十一”期间，男性美妆相关品类出现爆发式增长，其中男士面部精华商品交易总额同比提升7064%。</p>\n  <p>另一方面，男性美妆消费的渗透率、使用频次和社会接受度仍处在早期阶段，消费者心理门槛比女性市场更高。</p>\n  <p>过去几年，理然、亲爱男友、蓝系等品牌曾从男士护肤、个护、彩妆切入市场；国际集团旗下的欧莱雅男士、碧欧泉男士等品牌也长期占据货架。但男士美妆市场始终没有出现真正意义上的心智型品牌。原因在于，很多品牌解决的是“男性也可以买护肤品”的问题，却没有真正回答“男性为什么需要一套不同于女性市场的美妆解法”。</p>\n  <p>绿所的切口是把“化妆”翻译成“理容”，把复杂步骤压缩成更轻的产品体验。它希望做的，并不是把女性彩妆复刻给男性，而是在年轻男性“想变好看但怕麻烦、怕被看出来”的心理夹缝中，找到新的产品形态和表达方式。</p>\n  <p>在William的判断里，未来两到三年，品牌的核心目标是成为新一代年轻男生变好看的第一款理容产品。换句话说，当18至22岁的年轻男性第一次想改善面部状态、第一次意识到“好看”可以更简单时，绿所希望成为他们最先想到的那个品牌。</p>\n  <h2>投资人观点</h2>\n  <blockquote>\n   <p>宝顶创投创始合伙人张耀东：绿所是宝顶创投近两年投资的唯一一个美妆项目，我们认为绿所是新一代美妆品牌的优秀选手。主要有三个方面：首先，品牌洞察到了新一代消费者生活方式的迭代。00后为代表的年轻人，对自身的形象有了精致得多的要求，男生的变化尤为明显。对消费的体验也在发生质的变化，既要好用也要好看，还要趣味相投；第二，品牌精准地为这一代消费者提供了优质的offer，从产品的功效，到包装设计，到品牌内容，给到用户全方位的不可多得的消费体验；第三，创始团队是难得的高素质团队，立体的工作经验和实干能力，良好的教育背景和成长眼界，以及整体的审美素养，给到品牌发展更好的想象空间。我们相信品牌很有机会从男士底妆开始，发展成多品类，男生爱用，女生也喜欢的新一代的、全球性的美妆品牌。</p>\n  </blockquote>", "category": "tech", "published_at": "2026-05-27T01:00:06+00:00", "fetched_at": "2026-05-27T02:58:18.035954+00:00", "fingerprint": "4eb683a028f006a1"}, {"source": "36氪 - 最新文章", "title": "化险为夷的洛克王国，给所有长青游戏上了一课", "url": "https://36kr.com/p/3826354349412992?f=rss", "summary": "<p>文丨果脯</p>\n  <p><span style=\"letter-spacing: 0px;\">2026年5月21日，腾讯魔方工作室群开发的《洛克王国：世界》上线了S2赛季更新。这款基于13年经典IP、以精灵收集养成为核心的大世界游戏，在2026年3月底正式上线后迅速成为年度爆款。据官方数据，游戏上线9天用户量便突破3000万，全平台预约人数达6000万，DAU达到1300万。&nbsp;</span><br /></p>\n  <p>S2赛季上线前，这款产品更是被寄予厚望，<strong>腾讯方面称其“有望成为下一款长青产品”。</strong>此时，距离《三角洲行动》正式官宣跻身“长青游戏”，也才过去一个季度。&nbsp;</p>\n  <p>出乎所有人意料的是，5月21日S2赛季更新后，事情迅速脱离了轨道。&nbsp;</p>\n  <p>几天之内，玩家社区出现大量争议，游戏B站官方动态评论数一度突破百万。彼时，玩家发现游戏出现了大量未在版本公告中提及的修改内容，并且多个已于S1赛季修复的Bug重新出现。这套前所未有的重大运营失误，一度让玩家揣测《洛克王国：世界》的成功，令团队被内部人士“摘了桃子”，最终导致游戏于S1赛季的积累全部白费。&nbsp;</p>\n  <p>甚至有人因此夸张地总结：<strong>《洛克王国：世界》“自刎归天”了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_5e6a156ad5e44cd7ad970edc15d7d203@6202862_oswg193268oswg1080oswg567_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">玩家评论</p>\n  <p>争议一直持续到5月24日。当晚，游戏主策划“开水”发布了一封数千字的公开信，向玩家道歉并澄清了“团队换血”“空降管理层”等一系列传言。随后，官方也发放了一系列游戏珍稀道具作为补偿。&nbsp;</p>\n  <p>从公司公关层面看，这无疑是一次完成度较高的危机应对。但如果大家仅仅把这事当作一场“公关危机处理”来讨论，往往又会错过一个更要命的趋势：长线运营游戏作为文娱产品，与玩家间的信任关系已经是一个不可忽视的核心要素。&nbsp;</p>\n  <p><strong>这种信任关系，对公司来说是口碑也是品牌，对玩家来说，则是一份“不能被背叛”的热爱成本。</strong></p>\n  <p>口碑的重要性自不言而喻，好的品牌更是天然能为商品带来溢价。但很多时候，这种商家与用户建立起的信任关系，往往也是最容易崩坏的东西。而在游戏行业，这种信任关系可谓更加脆弱。&nbsp;</p>\n  <p>回过头看，S2的争议之所以会迅速发酵，核心原因反而是《洛克王国：世界》过去在S1赛季中的表现实在太完美，游戏在精灵生态方面铺设了大量细节，多数玩家能够感受到制作团队在这个虚拟世界中的投入与热爱。&nbsp;</p>\n  <p>后续每一次应对游戏出现的各类问题，他们更是都拿出了堪称完美的答复。彼时，玩家对《洛克王国：世界》多年的期待、担忧、恐惧与等待都落到了实处，对团队自然也是空前信任。而信任又让玩家愿意投入时间、情感和金钱，理解游戏必然存在的不完美设计，同时也对后续版本抱有期待。&nbsp;</p>\n  <p><strong>但当观众开始仰视演员，往往就会忘记台上的也是凡人。</strong></p>\n  <p>S2的巨大滑坡，迅速触动了玩家群体长久以来最敏感的神经：自己似乎又被游戏官方给骗了。之前有多信任，“背叛”带来的愤怒就有多强烈。&nbsp;</p>\n  <p>S2赛季的更新直接冲击了这层信任。</p>\n  <p>游戏最初的导火索，出现在男女角色战败动作的调整上。游戏中，女号战斗失败会“鸭子坐”在原地哭泣，男号则是站立叉腰。此次调整将女号“鸭子坐”改为站姿叉腰。修改前，曾有玩家表示男女号的战败动作应该统一，认为“鸭子坐”不雅。&nbsp;</p>\n  <p>针对这一问题，游戏于S2调整了动作，但这份调整并没有提前写进公告或尝试与玩家达成一致意见。于是，当事情实际发生后，各执一词的两方玩家开始激烈辩驳。&nbsp;</p>\n  <p>而更严重的问题还在后头——玩家在游戏中陆续发现了更多未在更新日志中公示的“暗改”内容。其中包括十多只主力精灵的数值被调整、精灵生态被删减、部分精灵骑乘姿态变化、精灵表情变化等等。甚至一些已经在S1赛季已被修复的Bug，都在S2中再度出现。&nbsp;</p>\n  <p>随着争议蔓延，社区中出现了各种猜测。&nbsp;</p>\n  <p><strong>有玩家推测，制作团队已经被替换，新团队空降接管了项目，这才导致版本质量严重下滑。</strong>甚至有人认为，版本中保留了一些原有团队留下的“不甘心的文案”。这些猜测被大量转发和讨论，进一步放大了玩家的不信任情绪。&nbsp;</p>\n  <p>5月24日，主策划“开水”在公开信中直接回应了上述猜测。&nbsp;</p>\n  <p>“现实比故��无聊很多：<strong>没有换血，没有空降，没有另一个幕后团队。</strong>搞出这些问题的人，就是我们自己。就是那个曾经给大家带来过快乐、感动和期待的原团队。这件事其实比‘阴谋论’更让人难受，非常抱歉辜负了大家的期待。”&nbsp;</p>\n  <p>在解释问题的技术原因时，开水也给出了团队内部针对此次问题的复盘：公测时团队未能来得及完成的调整与资源被遗留在S2版本中；一些在S1紧急修复的问题与数据没能合并回S2的开发分支；一些长期存在的底层问题在修复时引发了意料之外的连锁反应。简而言之，是版本分支管理出了问题。&nbsp;</p>\n  <p>此外，他还回顾了团队心态层面的变化。S1赛季的成功让团队产生了一种错觉，即“什么问题都可以靠热爱与努力解决”，这种心态导致S2的开发节奏变得激进和忙乱。&nbsp;</p>\n  <p>这种程度的自我批评超出了多数玩家的预期。和常见的运营公关策略不同，它没有试图将责任推给外部因素，也没有用模糊的措辞搪塞过去，而是承认了团队自身在流程和心态上的失误。社区评论区的高赞回复出现了明显转向，“暂时相信你，看后续表现”“再相信你一次”“希望洛克越来越好”成为主流。&nbsp;</p>\n  <p>官方实际给出的补偿也相当实在。5月22日凌晨首次紧急推送，发放了两颗棱镜球；此后又追加了包括织梦棱镜球、棱镜球、金镜子在内的多批道具。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_9c9e51270f0847f3a9bbde6aabfec1b5@6202862_oswg811696oswg1079oswg1687_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">官方动态</p>\n  <p>当然，真正推动信任修复的，不是补偿道具的总价，而是那封信所释放出的态度。&nbsp;</p>\n  <p>信中没有使用危机公关中常见的模板化语言，没有“深表歉意”“后续改进”这类空话。制作者在信中袒露了个人的低谷期感受，承认了团队在顺境中犯下的错误。这种诚实放在商业语境里或许显得冒险，但对于一款以“童年情怀”和“IP情感连接”为核心的产品来说，这是唯一有效的沟通方式。&nbsp;</p>\n  <p><strong>于游戏公司而言，信任是品牌溢价，也是DAU和流水的基本盘。</strong>而于玩家而言，信任是时间投入、情感投射和消费决策的安全感来源。&nbsp;</p>\n  <p>这两者之间的平衡点极其脆弱，甚至很多时候双方关系更像是对立博弈而非合作共赢。一次版本的版本管理失误、一次未经充分验证的快速响应、一个没有说清楚的改动，都可能将长期积累的信任毁于一旦。&nbsp;</p>\n  <p>在TapTap拍摄的纪录片《存档点》里，《苏丹的游戏》主创钻咖崩提到，<strong>“商业游戏想做到的事情，跟玩家希望看到的事情，利益是相悖的。”</strong>很多人可能会单纯将其归因为商业化模式问题，但实际上这句话牵扯到的东西还有更多，比如团队的KPI、产能、成本等等。&nbsp;</p>\n  <p>当玩家的利益诉求实际落在这些问题上面，开发团队与玩家间的矛盾几乎不可避免。这也导致过去多年，长线游戏最朴实无华、最常见的公关策略就是“沉默”——没办法，说多错多，不如直接挨打立正。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_b3692524628e4c0bbc4998013fd61e38@6202862_oswg50631oswg1080oswg497_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">纪录片《存档点》</p>\n  <p>然而在过去的几年里，这份关系正在发生一些悄然转变。&nbsp;</p>\n  <p>从明面上看，玩家越发适应甚至依赖当今GaaS型游戏机制，同时也能在多个维度去理解开发团队，知道互相都只是“打工人”。&nbsp;</p>\n  <p>而另一个显著的变化，是<strong>GaaS型游戏的消费分级变得越来越透明</strong>，商业目标早在不知不觉间已然发生了转变。&nbsp;</p>\n  <p>在早期的手游时代，付费设计主要围绕“二八原则”展开，即少数高消费用户贡献大部分收入。但随着产品体量的扩大和DAU的增长，不同消费层次的体验差异问题越来越难以回避。当玩家意识到游戏的实际体验完全来源于付费，自然也就认为产商“骗肝骗氪”，要求维护普通玩家的游戏体验。&nbsp;</p>\n  <p>现如今，行业内的开发团队已经逐渐形成了一种共识：<strong>可持续的商业模式应该以服务多数人为基础，让每位玩家都能找到自己的位置，即零氪、微氪、中氪、重氪这四个用户层都能在游戏中有对应的体验。</strong></p>\n  <p>具体到不同厂商，网易倾向于做“三段式”分层（0至200元、200元至几万、5万至10万元以上），在同段位内体验相对接近，月卡和轻氪玩家的体验较为完整。腾讯的特点是分层更为精细，在大DAU项目中强调横向付费（皮肤、个性化道具等），尽量不明显伤害竞技公平；在MMO和长线项目中则通过VIP和成长线来承接不同层级的消费需求，同时控制付费天花板以避免劝退大盘。&nbsp;</p>\n  <p>同期，二次元品类的崛起，社区的成熟，也让这一切真正变得“透明”。&nbsp;</p>\n  <p>在二游里，一个玩家有没有满命座角色、有没有专属武器，都直观地反映在他的账号实力和游戏体验上。玩家开始明确地意识到，“有钱人是这么玩游戏的”。这种透明化一方面加剧了玩家之间的比较焦虑，另一方面也让消费行为的“分层”属性变得更加赤裸。&nbsp;</p>\n  <p>这自然也就提出了新的问题：<strong>消费分层的边界到底该如何设计？如何把普通消费、中高端体验、奢侈品这些界定明确具象在游戏当中？</strong></p>\n  <p>在这个视角下，腾讯游戏愿意且也有足够资本去给予普通玩家相对完整的游戏体验。《洛克王国：世界》的核心玩法是捉宠和探索，付费点集中在精灵外观、炫彩道具等横向消费上，并不影响核心的游戏循环完成度。这种设计思路与《三角洲行动》一致，也延续了腾讯在大DAU产品上的长期策略。&nbsp;</p>\n  <p>回溯更早期的腾讯游戏，《穿越火线》《地下城与勇士》《QQ飞车》等产品之所以能覆盖数亿用户，一个关键原因在于，它们为没有付费能力的玩家保留了基本的参与体验。&nbsp;</p>\n  <p>这些游戏的早期玩家中，有大量是通过免费渠道进入的。他们未必能拿到最好的装备或皮肤，但可以完整地体验到核心玩法。在最没钱的时候，多数人最先接触到的是腾讯游戏。可能有人说腾讯的游戏没有审美，但腾讯提供的不是审美，而是思考审美的条件：一个让用户先走进来、先玩起来、先体验到游戏乐趣的入口。&nbsp;</p>\n  <p><strong>每个人的游戏需求不同。</strong>有人希望在游戏中获得社交连接，有人追求竞技胜负，有人想在虚拟世界中收集和养成，有人只是想打发通勤的二十分钟。腾讯的产品策略没有试图为所有人提供同一种体验，而是为不同需求的人提供各自能够接受的版本。让更多人有了体验游戏的选择，这本身构成了腾讯游戏商业逻辑中最稳固的一环。&nbsp;</p>\n  <p>因此，哪怕过去腾讯游戏的口碑并不算好，外部评价其“没有创新”“缺乏审美”“靠社交导量”等批评声音长期存在。但一个无法回避的事实是，随着时代发展，腾讯始终能握住国内市场热度最高的游戏产品。从当年的《穿越火线》《地下城与勇士》《英雄联盟》，到如今的《王者荣耀》《和平精英》《三角洲行动》，未来还可能是《洛克王国：世界》。&nbsp;</p>\n  <p>也正是基于“让更多人体验游戏”这一理念，腾讯游戏最终在近几年明确提出了长青游戏战略。&nbsp;</p>\n  <p>而要理解长青游戏，首先需要理解这个时代对游戏产品提出的新要求。&nbsp;</p>\n  <p>毋庸置疑，中国游戏市场正在从上半场进入下半场。<strong>腾讯集团高级副总裁马晓轶曾解释，之所以提出长青游戏概念，核心背景是中国游戏市场已经逐渐变为一个成熟市场，出爆款越来越难。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_c419148c17284ce885b91bac75ed6586@6202862_oswg44389oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">腾讯集团高级副总裁 马晓轶&nbsp;</p>\n  <p>没办法，在时间精力有限的情况下，市场产品越多，内容越细化，玩家就越能针对性选择那些完全符合自己需求的游戏。这几天导致，产品获取一个新用户的成本持续上升，而失去一个老用户的代价也变得更大。&nbsp;</p>\n  <p>在这种市场环境下，信任不再是抽象的价值观，而是一套可被验证的产品方法论。<strong>回看腾讯游戏近年的“新贵”们，《三角洲行动》起步来源于FPS玩家对J3工作室的认可，《洛克王国：世界》的顺利也离不开玩家对IP的热爱。</strong></p>\n  <p>毕竟一款游戏如果无法让玩家持续信任它，玩家会很快流失到下一个选择。过去一款端游或手游可能依靠上线期的买量投放和渠道推广快速冲高流水，然后在用户流失前回收成本。但在一个成熟市场中，这种路径的回报率正在持续下降。当用户获取成本上升到一定临界点之后，只有那些能够把用户留下来、让用户持续消费的产品，才具备商业上的可持续性。&nbsp;</p>\n  <p>这正是长青游戏概念成立的底层逻辑。&nbsp;</p>\n  <p>在腾讯的定义中，长青游戏有一套明确的量化标准：本土及国际市场，季度平均日活跃账户数超过500万的手游或超过200万的端游，且年流水超过40亿元。马晓轶在2025年时曾统计过，全球符合这一标准的产品大约有70款，其中14款来自腾讯，腾讯投资的公司还有8款。在2025年一年内，跨过长青游戏收入线的新游戏只有约6款。&nbsp;</p>\n  <p>说白了，<strong>长青游戏的稀缺性不在技术或资金层面，而是在信任层面。</strong></p>\n  <p>季度DAU超过500万且年流水超过40亿元，意味着产品不仅要吸引大量用户进入，更要让他们持续留下。玩家不会因为一款游戏来自大厂就持续登录，他们持续登录的唯一原因是他们相信在这款游戏里投入时间能得到回报。&nbsp;</p>\n  <p>马晓轶也反复强调过一个概念：<strong>游戏是一个成功率非常低的行业。</strong>他给出的数据是，过去一年Steam上约有1.9万款PC游戏，手机上超过6万款移动游戏，但成功的数量极低。就算叠加各种资源、能力和IP，新游戏的中奖率最高也只有30%。&nbsp;</p>\n  <p>这意味着腾讯游戏策略的核心逻辑不是押注某一个爆款，而是系统性地提升成功的概率。&nbsp;</p>\n  <p>落实到具体做法上，该策略就是帮助更多团队活得足够久、迭代足够多次，让每个团队有不止一次冲击长青的机会。马晓轶的表述是：如果每次中奖率只有30%，你可能得抽4次才能中1次。所以他会跟很多团队说，不是不愿意花钱，而是如果活得足够久，能迭代很多次的话，成功的概率会更大。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_9505f3910f0b424fb9758ad44dc0f5b7@6202862_oswg80517oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">洛克王国：世界</p>\n  <p>这里有一个经常被忽视的关键点：<strong>团队能够活得足够久、迭代足够多次的前提，恰恰是玩家愿意给团队这个机会。如果一次版本失误就导致玩家大规模流失，那就不存在反复迭代的可能性。</strong></p>\n  <p>所以，腾讯长青游戏战略的底层逻辑，并不是单纯的研发投入和技术积累，而是一套围绕“获取信任、维护信任、修复信任”构建的产品方法论。&nbsp;</p>\n  <p>信任是长青游戏战略得以运转的前提条件，而不是它的副产品，玩家哪怕不认“腾讯游戏”，旗下工作室也至少会有一家得获得他们的认可。这也是为什么腾讯的产品线中能持续出现大DAU产品。&nbsp;</p>\n  <p>从《王者荣耀》到《和平精英》到《三角洲行动》，再到今天的《洛克王国：世界》，这些产品并非出自同一个团队或同一个品类，但它们共享同一套底层机制：在被验证过的大品类赛道中，投入充足的研发资源和时间，允许团队迭代试错。&nbsp;</p>\n  <p>这套机制能够成立，建立在玩家愿意留下来等待产品变好的基础上。《三角洲行动》最初上线时社区充满质疑，经过半年迭代后双端DAU突破1200万并最终突破3000万。《金铲铲之战》最初上线成绩并不算好，随着持续迭代突破千万DAU并稳定在畅销榜前十。这些案例说明的是一件事：玩家给了产品迭代的机会，产品用迭代回应了玩家的信任。开发者和玩家，不应该是你死我活的对抗关系。&nbsp;</p>\n  <p>在过去的两年里，腾讯产出有潜力新品的频率正在明显加快。从2025年的《三角洲行动》到2026年的《洛克王国：世界》，这个所谓看起来很“难”的事情，于腾讯而言已经显露出一种可持续的生产路径。&nbsp;</p>\n  <p>除去2026年上半年已上线的《王者荣耀世界》《逆战未来》《洛克王国：世界》等产品，目前腾讯手中仍有不少于68款储备游戏，其中至少23款预计在2026年内有重要动态。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_956b7aedda9d4c9ab3f72168dc05fe17@6202862_oswg800087oswg1080oswg526_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王者荣耀世界</p>\n  <p>从具体的产品表现来看，《三角洲行动》自2024年9月上线后，经过半年长线运营，DAU于2025年4月突破1200万，三个月后攀升至2000万，同年9月周年庆时达到3000万。进入2026年第一季度，该产品已开始为腾讯持续贡献创纪录的流水。&nbsp;</p>\n  <p>紧随其后的《洛克王国：世界》，2026年3月底全平台上线，开服13小时新增用户超1500万，首月平均DAU达到1300万。再加之同期上线的《王者荣耀世界》，几款重磅产品在半年之内梯次爆发，这种节奏在过去任何一家游戏大厂的单一年度中都极为罕见。&nbsp;</p>\n  <p><strong>这种产出频率的加快并非偶然。</strong></p>\n  <p>回头去看，腾讯给出第一个支柱是<strong>战略聚焦</strong>。2024年下半年，腾讯内部明确提出了“保持聚焦和减少内耗”的目标，驱动团队重心从过去多点开花的“赛马机制”转移到核心赛道的长线运营上。后续，天美工作室群将原本分散的13个工作室合并为4个专注于核心产品的研发子工作室，资源集中投入使团队能够在同一个项目上进行多次迭代。&nbsp;</p>\n  <p>第二个支柱是<strong>AI驱动的工业化管线</strong>。据腾讯方面披露，AI已全面渗透进游戏研发侧的美术、程序、测试、运营等环节。以混元大模型为基础的视觉生成平台，能直接将游戏美术从概念设计推进至三维建模交付，极大压缩了传统研发中的高耗时环节。财报明确指出，《洛克王国：世界》得益于这类工业管线，能够维持每年新增超过200只精灵的产能。&nbsp;</p>\n  <p>如果马晓轶将游戏成功比作“抽奖”，那么腾讯当下的运转机制，已经让这种“抽奖”变成了一种高度工业化的常规生产。毕竟哪有小孩天天哭，哪有赌狗一直输——更何况腾讯这都算不上“赌”。&nbsp;</p>\n  <p>从《三角洲行动》到《洛克王国：世界》的接连引爆，不是简单的运气叠加，而是战略聚焦与工业化基建共同作用下，将原本充满不确定性的爆款突破转化为高概率、可持续生产路径的阶段性结果。&nbsp;</p>\n  <p>但工业化只能解决产出频率的问题，不能解决用户留存的问题。这也是为什么信任这一维度在长青游戏战略中占有不可替代的位置。&nbsp;</p>\n  <p>工业化管线可以让腾讯更快地做出更多高质量产品，但如果这些产品无法获得玩家的信任，它们就无法跨过季度DAU 500万和年流水40亿元的门槛，无法成为真正的长青游戏。换句话说，腾讯的长青游戏生产路径由两层机制构成：底层是工业化管线带来的产能保障，上层是信任维护带来的用户留存。缺了任何一层，这条路径都无法持续运转。&nbsp;</p>\n  <p>这种策略需要耐心，也需要资金和组织的支撑。不是所有公司都有条件支撑一个团队反复“抽奖”。&nbsp;</p>\n  <p>腾讯的体量和现金流提供了这个基础。2026年一季度，腾讯本土市场游戏收入达到454亿元，同比增长6%；国际市场游戏收入同比增长13%，达到188亿元。这样一个收入底盘，意味着腾讯有足够的资源让多个团队并行试错、长周期投入。&nbsp;</p>\n  <p>要知道，游戏行业的周期远比外界想象的要长。这个行业的一个周期可能是4到5年。<strong>2021年前后立项或投资的产品（如《三角洲行动》《黑神话：悟空》），直到2024年才开始集中释放成果。</strong></p>\n  <p><strong>而今天所做的决策，可能要到2030年左右才能看到结果。</strong></p>\n  <p>这种长周期思维也体现在腾讯对GaaS和买断制单机的看法变化上。马晓轶曾提到，做一款长青的GaaS产品可能需要“一章一章打过去”。如果把目光放长远，把一款买断单机当做验证美术、玩法、故事的垂直切片，那完全可以支持团队去做单机。这种认知的更新说明，腾讯的长青游戏策略并非固守某一种模式，而是在不断根据市场反馈调整方法论。&nbsp;</p>\n  <p>回到《洛克王国：世界》这个案例。S2赛季的事故是一次典型的“活得更久、迭代更多次”过程中不可避免的代价。在版本管理层面，团队犯了错误。但这些错误之所以能被看见、被讨论、被修复，前提是这款产品有足够大的玩家基数，有足够多的玩家在乎它变成什么样。真正不被在乎的错误，反而才是最为可怕的东西。&nbsp;</p>\n  <p><strong>结语</strong></p>\n  <p>2026年5月24日晚，主策划开水在公开信中写下了一段话，后来被不少玩家反复引用：<strong>“在很长一段时间内，我不喜欢玩自己做的游戏，玩家也不喜欢我做的东西。后来我也只能尽可能将游戏、甚至自己都视作一段数据，因为如果不这样我会很痛苦。”</strong></p>\n  <p>他接着说，《洛克王国：世界》的成功让他和团队格外珍惜这份被玩家需要的感觉。而这种珍惜，恰恰是他们在S1的顺境中产生了侥幸心理、在S2犯下错误的根源。&nbsp;</p>\n  <p>这是一个制作人对自己的诚实审视。他把游戏的商业成功和团队在流程上的漏洞放在同一封信里交代，没有试图美化任何一方。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_a7131f0548e74cc2b02cbc65b1943012@6202862_oswg130746oswg1080oswg1074_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">开水的一封信 节选</p>\n  <p>于《洛克王国：世界》而言，S2赛季的事故已成为过去。它在财务上不会对这款产品造成致命影响。2026年一季度的财报中，这款产品已被列为“新品接力”的一员，每年超过200个精灵的工业化产能也在持续运转中。这件事留下的真正印记不在财报上，而在一百万条评论、一封数千字的信、以及那看不见摸不着的信任之中。&nbsp;</p>\n  <p>信任是一种极其脆弱、又极其持久的资产。&nbsp;</p>\n  <p>它可以被一次版本管理失误瞬间动摇，也可以在坦诚的沟通中被重新扶正。每一次产品事故都是一次对信任的压力测试。一家公司能否走得更远，不取决于它能否避免所有错误，而取决于它如何面对错误、是否敢于承认错误、以及能否在承认之后拿出值得信任的行动。&nbsp;</p>\n  <p>于腾讯而言，《洛克王国》IP从页游走到手游走过了15年，S2赛季只是这条漫长路径中的一个节点。&nbsp;</p>\n  <p>长青游戏的“长青”本身，不是成功的结果，而是在不断面对和修复问题的过程中，持续被验证的信任。&nbsp;</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s/PIrlyyl44JbQebRPOtBI1g\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-05-27T02:05:05+00:00", "fetched_at": "2026-05-27T02:58:18.035948+00:00", "fingerprint": "e22c6a38e03cbb54"}, {"source": "36氪 - 最新文章", "title": "经过华为、传音、拓竹历练，95后打造AI母婴界特斯拉｜36氪首发", "url": "https://36kr.com/p/3826922264286083?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，AI母婴智能硬件品牌珂迪Coddie（以下简称“Coddie”）完成天使轮融资，融资金额数千万元，由钟鼎资本投资，向阳资本担任独家财务顾问。</p>\n  <p>Coddie团队于2026年初组建，由95后连续创业者何鋡威创立。何鋡威毕业于德国慕尼黑工业大学，先后任职华为、传音控股、拓竹科技等全球化科技企业。技术负责人毕业于国内顶级高校计算机专业，曾就职半导体龙头上市公司，负责大疆与Insta360影像IC方案落地；后加入国家“小巨人”第三代半导体企业担任产品负责人，具备复杂产品研发的深厚技术背景，以及前沿方案的系统整合能力。</p>\n  <p>当前全球母婴家庭面临养育压力大、成本高、信息繁杂等核心痛点，而传统母婴产品仍停留在基础功能阶段，智能化程度不足、生态割裂，无法满足新一代家庭需求。事实上，母婴智能设备在全球已发展多年，智能喂养、发育监测和孕产科技也成为全球增速较快的核心品类。</p>\n  <p>“我们觉得AI来了，很多行业都要重做。育儿赛道过去拼营销、拼渠道，未来一定拼产品、拼智能。在具身智能不够成熟进入家庭照顾孩子之前，更务实的做法是将机器人“打散”，变成基于AI驱动一个个解决具体场景问题的智能硬件。”何鋡威告诉硬氪。</p>\n  <p>相关数据显示，北美（尤其是美国）占据了全球约41.7%的市场份额。这主要得益于高人均可支配收入、对新兴科技的高接受度，以及发达国家普遍缺乏保姆/育儿嫂、双职工家庭高度依赖科技育儿的现状。</p>\n  <p>市场布局上，Coddie前期优先深耕欧美市场。是看到两大机会：一是欧美高端育儿产品的付费心智成熟；二是人力成本极高且专业育儿资源稀缺——美国专业育儿保姆月薪高达1–2万美金，这为智能硬件的“机器代人”提供了天然的替代刚需。</p>\n  <p>在产品规划上，Coddie短期会聚焦在用户核心痛点场景下的产品研发，通过传感器采集数据，AI模型进一步分析和决策，到驱动硬件执行，实现用户痛点场景下的任务自动执行，最终达到解放父母、轻松育儿的目的。长期来看，Coddie希望用母婴AI模型+硬件产品，实现“有人帮你看、有人帮你哄、有人帮你教”的托管。</p>\n  <p>在AI技术方案上，Coddie采用大小模型联动+本地算力中心的技术路线。端侧小模型负责育儿场景实时决策，数据全部本地存储，同时针对每个孩子做个性化深度学习；遇到复杂问题再调用云端大模型，兼顾智能体验与隐私安全。</p>\n  <p>“只要我们的智能化终端能真正在这些高频场景中帮用户把养育负担降下来，这就是不可替代的“刚需工具。”何鋡威表示。</p>\n  <p><strong>创始人对谈</strong></p>\n  <p><strong>硬氪：为什么选择现在这个时间点切入AI硬件与母婴赛道？</strong></p>\n  <p><strong>何鋡威：</strong>核心是看到了行业的“贝塔”。母婴是一个极其刚需且长期有需求的赛道，不管科技怎么发达，人类对生命延续的投入永远是最高优先级。但整体来看产品不够极致，用户并没有被很好的服务到。随着AI技术、电机、传感器成本的下降，AI决策反馈与硬件精准执行的闭环已经可以打通。</p>\n  <p><strong>硬氪：面对消费品大厂或极致硬件极客团队的竞争，团队的核心壁垒在哪里？</strong></p>\n  <p><strong>何鋡威：</strong>传统消费品企业缺乏硬科技基因和重构组织的动力；而极致硬件公司的极客工程师，往往不了解育儿赛道，也难以理解女性和妈妈人群对于材质、外观和情感的细腻软性需求。而大厂则有其品牌高端商务形象的包袱。</p>\n  <p>我们的优势在于“软硬结合”：在“硬”方面我们有极致技术驱动的工程师和供应体系，在“软”的方面团队由行业资深的女性产品经理组成，更能表达细腻情感，希望做出能够共情父母的好产品。</p>\n  <p><strong>硬氪：AI硬件在过去两年一直热度难继，很多产品被指为“玩具”，你们如何避开这个问题？</strong></p>\n  <p><strong>何鋡威：</strong>过去很多AI硬件没做起来，是因为它们停留在提供“陪伴”“新奇”等情绪价值的层面，支撑不起新技术的大爆发。AI必须回归实用属性，解决具体痛点的硬核价值。在欧美中产家庭，深夜哄睡、凌晨冲奶等场景是极其折磨人的痛点。只要我们的智能化终端能真正在这些高频场景中帮用户把养育负担降下来，这就是不可替代的“刚需工具”。</p>", "category": "tech", "published_at": "2026-05-27T02:27:05+00:00", "fetched_at": "2026-05-27T02:58:18.035940+00:00", "fingerprint": "e35399e375e8c8ec"}, {"source": "36氪 - 最新文章", "title": "前两天，我们在亦庄听到了AI最真实的声音｜2026 AI Partner大会金句实录", "url": "https://36kr.com/p/3826932509364869?f=rss", "summary": "<p>当大模型API调用成本一年内骤降超过80%，百万Token仅需几分钱时，产业竞争便不再纠结于技术指标的高低，而是回归到最朴素的价值衡量——能否在实际场景中降本增效。行业的聚光灯，从实验室的榜单，转向了真实的生产线、医院诊室、物流仓库和城市管理后台。</p>\n  <p>2026年，谁能在复杂场景中解决真问题，谁才是这场变革的主角。</p>\n  <p>5月19日至20日，以“带着AI去前线”为主题的2026 AI Partner·北京亦庄AI+产业大会在北京经开区通明湖会展中心举办。大会由北京经开区管委会指导、36氪主办、国家信创园承办，设置9场圆桌对话、22场主题演讲以及一场别开生面的“世界咖啡”AI+产业对接会。60位国内领军企业代表齐聚一堂，13家带着真场景、真预算、真痛点的需求方与36家技术方面对面碰撞。</p>\n  <p>正如36氪CEO冯大刚在开场中所说：“大多数人走进通明湖会展中心，心里想的是同一件事——不是来听AI有多厉害，是来看看AI到底能不能用、怎么用、花多少钱用，能创造多大价值。”</p>\n  <p>一位参会企业代表感慨：“以前参加AI会议，大家还在讨论‘未来能做什么’，今天在亦庄，大家直接问‘你的方案在我这条产线上能不能降本10%’。”</p>\n  <p>这种“去泡沫、验成色”的氛围，贯穿了大会的所有环节。我们从不缺谈概念的人，缺的是踩过坑、调过流程、把事做成的人。以下是本次大会嘉宾的超级金句，每一句背后，都站着一位真正带AI去过前线的人。</p>\n  <p>以下为嘉宾金句摘录：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260527/v2_a979997346244a98a523cfbb03485bae@6381723_oswg4066290osw
