a14"}, {"source": "The Verge", "title": "Sennheiser’s new Momentum 5 headphones have upgraded ANC and a replaceable battery", "url": "https://www.theverge.com/tech/936127/sennheiser-momentum-5-wireless-headphones-anc-lossless-bluetooth", "summary": "Nearly four years after the last version of Sennheiser's Momentum headphones debuted with a redesign that traded a retro aesthetic for a more contemporary and comfortable design, the company has announced its Momentum 5 Wireless headphones. They look very similar to their predecessors, the Momentum 4, with large ear cups and a design that doesn't [&#8230;]", "category": "tech", "published_at": "2026-05-25T22:00:00+00:00", "fetched_at": "2026-05-26T02:46:54.124335+00:00", "fingerprint": "78ee7306d808d211"}, {"source": "36氪 - 最新文章", "title": "消除“罪证”：给写作去除“AI味”的不完全手册（2026版）", "url": "https://36kr.com/p/3824601267196037?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_7e9d1114399e47c4b2142b6de84e04ba@5509299_oswg1010944oswg1080oswg1068_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：公众号「有三思 &nbsp;U &nbsp;Sense」</p>\n  <p>做个测试。读一下这段话：</p>\n  <p>“熊猫是最可爱的动物，它最爱吃竹子，样子最憨态可掬，是世界上最珍贵的宝藏。”</p>\n  <p>如果你笑了，或者皱了眉，很明显，你的<strong>“鉴AI雷达”</strong>已经觉醒。&nbsp;</p>\n  <p>近期把网友笑到打鸣的“豆包体”里，“最”是高频词汇。大家纷纷晒出自己使用、调教AI，结果内容啼笑皆非的截图。这场围绕AI味写作的调侃就此出圈。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_3e6af2e8761b4a48b3c23f7089eeb457@5509299_oswg233291oswg1080oswg806_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;网友@也许像星星发布的AI味吐槽突破&nbsp;</p>\n  <p>微博AI味相关话题浏览阅读量不小，小红书相关笔记动辄近万点赞。豆瓣、抖音、微信公众号，都能搜到不少相关内容。能引发社交媒体的集体吐槽，说明“AI味”已经人人皆可感知，大家都不傻。<strong>同时这也意味着，在工作中需要写文章的你，暂时不用担心AI会把你完全替代掉了。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_6f8844cca6b94f1aa692f6b2e150be75@5509299_oswg117207oswg1080oswg344_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;微博超话AI味相关的讨论&nbsp;</p>\n  <p>与AI味相对的是“人味”。如果说AI的造词遣句，是在语料投喂和人工交互反馈下生成的，那人味给人一种随机波动的感觉。比如，使人动容或会心一笑的句子、意料之外的妥帖比喻、未曾熟识的新奇词组搭配、诙谐讽刺的暗喻留白，甚至不合语法或有失偏颇的表达。&nbsp;</p>\n  <p><strong>这种对AI味和人味的敏锐捕捉，直接催生了社交媒体上的一场“李逵捉鬼”运动。</strong></p>\n  <p>&nbsp;</p>\n  <h2><strong>「鉴AI」，网友比检测软件更认真</strong></h2>\n  <p>2026年，打工人和学生面临着这样的窘境：人类急着证明自己不是机器，而机器正在拼命模仿人类的话语习惯。略显荒诞的是，“AI检测工具”作为裁判，本身也是个半盲。</p>\n  <p>误伤正每天发生。&nbsp;</p>\n  <p>现在的情况是：只要过于结构严谨化的写作，都会让人怀疑有AI参与了写作。这种无妄之灾、相互怀疑、甚至需要“自证没有吃凉粉”的场景增添了写作的成本。一些人莫&nbsp;名陷入了自证的困境。比如自己手敲了一下午的文案，仅仅因为用了两个破折号，就被评论区追着问 ： “这是AI写的吧？”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_04ad6bb96da543ea8e87dd37e24818f9@5509299_oswg174384oswg1080oswg554_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;@levelsio发布的“拉黑”破折号的推文&nbsp;</p>\n  <p>社交平台的机器误判案例随处可见。网民唐某某发布了一条关于打工与学车的感悟，结果被平台算法误判为未标注的AI生成内容，遭禁言一天的处罚。</p>\n  <p>文科生的职场里也展开着相同闹剧。有从事编剧行业的网友说：手敲了一下午的剧本 被以为是AI 。亦有学者谈到： 引用的作者原话竟然被判定为AI。&nbsp;</p>\n  <p>到底什么是真，什么是假？为了不过多地食用“AI泔水”，不被判定为AI创作，在小红书等社交平台上，网友们已经自发分享“鉴AI”攻略。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_6bfaaf7a26c84c32a429d8a8fe0737c7@5509299_oswg51168oswg826oswg852_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;网友发布的“野生”鉴定攻略&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_d5f862cd578a4d1bbec129b3b7d3787c@5509299_oswg161667oswg1080oswg591_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;网友发布的“野生”鉴定攻略&nbsp;</p>\n  <p><strong>不过，即使是AI味，也散发着不同的气质风格。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_eb40241ad41d45a88930fb2611baa787@5509299_oswg191080oswg1080oswg1589_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">● &nbsp;目前市场上最具代表性的主流模型“文风”一览</p>\n  <p>&nbsp;</p>\n  <h2><strong>是什么让你的文章有AI味？</strong></h2>\n  <p>AI味可能是一种感觉，当然也可以是一组可以<strong>被辨识和描述的语言指纹（linguistic fingerprinting）。</strong></p>\n  <p>维基百科的编辑团队为了过滤AI生成内容，专门整理了一份<strong>AI写作迹象清单</strong>，涵盖语气、结构、格式和引用等多个维度。</p>\n  <p>原文较长，我们简单说一些 <strong>常见场景</strong> ：&nbsp;</p>\n  <p><strong>过度拔高。</strong> 习惯性使用“历史性/关键时刻”、“高光/决定性”等通用表述，夸大平凡事物。案例就是将普通小镇描述为韧性的象征，将次要事件拔高为分水岭时刻。&nbsp;</p>\n  <p><strong>否定式煽情句式。</strong> AI写作是这样的：这不仅仅是一双跑鞋，而是对自律生活方式的承诺。但其实原义是：这双跑鞋重210克，鞋底有缓震胶，后跟带反光条。&nbsp;</p>\n  <p><strong>虚假范围 (False Ranges)。</strong> 惯常句型是“从X到Y”。 <strong>而实际上X和Y没有太大关联，或者直接是硬凑合。</strong> 比如：从解决问题的工具，到科学发现的艺术表达。&nbsp;</p>\n  <p><strong>RLHF是导致AI味浓烈的“元凶”。</strong> 这个技术用词指基于人类反馈的强化学习。你可以认为它是一种让AI通过人类打分，来学习正确答案的训练方法。&nbsp;</p>\n  <p>大致流程是让人工标注员对AI的不同回答进行打分，AI会学习向高分回答的风格靠拢。那些充满人味的“犹豫、矛盾、没有节奏“的内容，会因风险高、不标准被淘汰。主模型为通过奖励模型，就会一直优化学习，更新自己的回答策略。 <strong>如此一来，被认可过的词汇、写作结构会扩散到整个语言模型的运行中。</strong></p>\n  <p>高频词多，AI味越浓，就更容易被人抓包了。&nbsp;</p>\n  <p>&nbsp;</p>\n  <h2><strong>《去“AI味”不完全手册》</strong></h2>\n  <p><strong>——本攻略涵盖整个生成流程，根据实际自身需求选择步骤即可。</strong></p>\n  <h3><strong>[动作一：注入肉身]</strong></h3>\n  <p>第一步，是给AI投喂偏好或本人的写作文本，让它拆解总结出写作特色，从而生成相似的文风。</p>\n  <h4><strong>提供多样化参考标准</strong></h4>\n  <p>收集至少3-5篇能代表你风格的原创文本（总计超过1500字效果更佳），内容覆盖多个场景，含说明性段落、议论性句子、口语化短句及带修辞的长句。</p>\n  <p>收集完后，整合成一份文档投喂给AI，让AI学习你的用词习惯、句式节奏、 书面语气、修辞风格、行文逻辑，之后AI就能复刻你的写作风格。</p>\n  <p>（一般使用，到这里就够了，如果有更高标准需求的，可以继续往下看。）</p>\n  <h4><strong>标注关键风格锚点</strong></h4>\n  <p>人工标记能显著提升模型对隐性风格要素的识别精度，尤其针对易被忽略的微观特征。</p>\n  <p>在文本中用【】标出你偏爱的3类表达：【高频过渡词】、【标志性句式】、【惯用比喻结构】；</p>\n  <p>另起一行列出3个绝对避免项：比如你不希望出现的，可以写为【禁用被动语态】、【不用“不是..……而是……”句式】、【不出现超过两个连续顿号】；</p>\n  <p>对每处标注附加简短说明。用【】书写，给文本里你认为有特点的用词、句式、习惯表达做标注。可以在每条标注后面，都加一句简短解释，说明这个表达代表了什么说话习惯、语气偏好、行文风格。</p>\n  <h4><strong>分阶段提示词引导训练</strong></h4>\n  <p>通过结构化提示词序列，逐步强化模型对风格维度的响应权重，避免一次性输入导致特征稀释。</p>\n  <p>以下提示词次可直接复制改写。</p>\n  <p><strong>① 首轮输入：</strong></p>\n  <blockquote>\n   <p>请严格模仿以下文本的节奏与词汇密度，复述下段内容：[粘贴第一篇样本]</p>\n  </blockquote>\n  <p><strong>② 次轮输入：</strong></p>\n  <blockquote>\n   <p>保持上一轮输出的句长分布与连接词频率，重写新主题：[你的新主题描述]；</p>\n  </blockquote>\n  <p><strong>③ 第三轮输入：</strong></p>\n  <blockquote>\n   <p>检查当前输出是否含【禁用被动语态】，若存在，请替换为对应主动结构并保持原意。</p>\n  </blockquote>\n  <h4><strong>分对比反馈微调法</strong></h4>\n  <p>对比反馈，主要指的是利用人类的直觉去判断差异点，将主观感受转化为可操作修正指令，形成闭环优化。</p>\n  <p>具体操作是要求AI对同一主题生成三版不同风格倾向的初稿（A/B/C），不指定方向；</p>\n  <p>比对各版与你样本的匹配度，比如可以用颜色标记：绿色=高度一致，黄色=局部偏离，红色=风格冲突；</p>\n  <p>针对所有红色标记句，向模型发送指令（你自己设定的写作风格）。例：将此句按【标志性句式】重构，主语前置，动词紧随，结尾不加修饰副词。</p>\n  <h3><strong>[动作二：活用提示词]</strong></h3>\n  <p>你可以通过提示词的书写将要求、主题角色和场景设置细节化。绝大多数人写的提示词都是简单的命令式指令。这种指令下，AI会调取它数据库中最常见的模板语言来回应， 所以AI味是超标的。我们可以通过控制否定式禁词、调整长短句节奏、口语化模拟等多种方法来进行调整。&nbsp;</p>\n  <h4><strong>C.R.E.A.T.E框架</strong></h4>\n  <p>CREATE框架主要是通过清晰的角色场景设定，来进行内容风格的调适和确立。&nbsp;</p>\n  <ul>\n   <li><strong>&nbsp;角色设定（Character） &nbsp;</strong></li>\n  </ul>\n  <p>角色设定是提示词设计的基础，直接影响模型输出的专业性和针对性。你可以通过以下三要素定义角色边界。&nbsp;</p>\n  <p><strong>① 专业领域</strong>： 明确模型扮演的行业角色，如“资深金融分析师”；&nbsp;</p>\n  <p><strong>② 经验年限</strong>： 量化专业能力积累，如“10年医疗数据建模经验”；&nbsp;</p>\n  <p><strong>③ 核心能力</strong> ： 限定输出风格，如“擅长撰写具有转化率的营销文案”。&nbsp;</p>\n  <p>示例：&nbsp;</p>\n  <blockquote>\n   <p>低效提示词：帮我写产品介绍。</p>\n   <p>高效提示词：作为拥有8年经验的消费电子评测专家，请用专业术语撰写iPhone 15 Pro的深度评测，需包含芯片性能、影像系统、散热设计等模块。</p>\n  </blockquote>\n  <ul>\n   <li><strong>&nbsp;明确需求（Request） &nbsp;</strong></li>\n  </ul>\n  <p>需求描述需遵循SMART原则，通过结构化表达确保模型准确理解任务边界：&nbsp;</p>\n  <p><strong>① 目标对象：</strong> 明确输出受众，如“面向35-45岁中产家庭用户”；&nbsp;</p>\n  <p><strong>② 核心指标：</strong> 量化输出要求，如“点击率提升20%的广告标题”；&nbsp;</p>\n  <p><strong>③ 风格约束：</strong> 限定表达方式，如“采用知乎体专业科普风格”。&nbsp;</p>\n  <p>也可以使用JSON格式定义复杂需求：&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_dcaff434487247f5b4b58c15f7e2390f@5509299_oswg52279oswg1044oswg300_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;JSON格式示例&nbsp;</p>\n  <ul>\n   <li><strong>&nbsp;示例引导（Examples）&nbsp;</strong></li>\n  </ul>\n  <p>当需求涉及特定风格或格式时，提供2-3个优质示例可显著提升输出质量。示例选择可参考：&nbsp;</p>\n  <p><strong>① 领域匹配</strong>： 示例与目标任务属于相同垂直领域；&nbsp;</p>\n  <p><strong>② 风格一致</strong>： 保持句式结构、修辞手法等特征统一；&nbsp;</p>\n  <p><strong>③ 质量分级</strong>： 包含基础示例和进阶示例展示能力边界。&nbsp;</p>\n  <p>示例应用 场景：&nbsp;</p>\n  <blockquote>\n   <p>生成特定风格的诗歌时，可提供不同韵脚的古诗范例；</p>\n   <p>编写技术文档时，附上符合企业规范的Markdown格式示例；</p>\n   <p>设计对话系统时，展示多轮对话的上下文衔接示例。</p>\n  </blockquote>\n  <ul>\n   <li><strong>&nbsp;动态修正（Adjustments） &nbsp;</strong></li>\n  </ul>\n  <p>模型内容输出存在偏差的问题，是常见现象。这个时候需要你建立实时修正机制。推荐采用「三明治修正法」。&nbsp;</p>\n  <p><strong>① 肯定部分： </strong>明确认可有效输出。如“第三段的市场分析很专业”；&nbsp;</p>\n  <p><strong>② 修正指令：</strong> 具体指出改进方向，如“请将用户痛点部分增加数据支撑”；<strong>&nbsp;</strong></p>\n  <p><strong>③ 格式约束： </strong>限定修改范围，如“仅调整第二段的语言风格”。&nbsp;</p>\n  <p>修正prompt设计技巧：&nbsp;</p>\n  <blockquote>\n   <p>使用「否定+肯定」结构减少歧义：不要使用专业术语，改用通俗易懂的表达；</p>\n   <p>引入优先级标记：重点优化产品优势部分，其他部分保持现状；</p>\n   <p>量化修正标准：将文案长度压缩至原版本的60%。</p>\n  </blockquote>\n  <ul>\n   <li><strong>&nbsp;格式规范（Type of Output） &nbsp;</strong></li>\n  </ul>\n  <p>明确输出格式可提升后续处理效率，常见格式参考如下：&nbsp;</p>\n  <p><strong>① 文档结构 ：</strong> 标题层级、段落分隔、列表格式等；&nbsp;</p>\n  <p><strong>② 数据格式： </strong>CSV、JSON、XML等结构化数据；&nbsp;</p>\n  <p><strong>③ 多媒体要求：</strong> 是否需要生成配套图表、代码块等。&nbsp;</p>\n  <p>格式控制示例：&nbsp;</p>\n  <blockquote>\n   <p>请生成Markdown格式的技术白皮书，要求：包含# 标题、## 二级标题、### 三级标题，代码块使用```python语法高亮，每个技术点后附参考文献链接，最终输出字数控制在1500-2000字。</p>\n  </blockquote>\n  <ul>\n   <li><strong>&nbsp;附加指令（Extras）&nbsp;</strong></li>\n  </ul>\n  <p>在原Prompt的基础上，用附加指令来精细化操作，可实现输出过程的深度控制。常用指令参考如下：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_c5298362fab94c4d979ed75ef32e870a@5509299_oswg83903oswg1080oswg732_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">●&nbsp;细化Prompt的附加指令一览表</p>\n  <p>高级指令组合示例：</p>\n  <blockquote>\n   <p>在生成医疗建议时，请严格遵循WHO最新诊疗指南，对每条建议标注证据等级，使用通俗语言解释专业术语，最终输出需经医学专家审核确认。</p>\n  </blockquote>\n  <h4><strong>Prompt弹药库</strong></h4>\n  <p>以下是部分通用类的Prompt，可以直接复制，也可以成为你训练AI的参考文本。&nbsp;</p>\n  <p>场景1：通用 · 口语化重写</p>\n  <blockquote>\n   <p>提示词Prompt（可直接复制）：</p>\n   <p>帮我审核这段内容，用对话感强、友好又不随意的真人语气重写</p>\n   <p>全程用短句、简单词汇，删掉学术化表达、生硬过渡短语和企业官话</p>\n   <p>让内容读起来就像一个人在用自己的大白话和朋友聊天</p>\n   <p>保留核心观点，删掉所有多余的修饰。内容如下：[粘贴文本]</p>\n  </blockquote>\n  <p>场景2：通用 · 人类痕迹（万能公式）</p>\n  <blockquote>\n   <p>提示词Prompt（可直接复制）：</p>\n   <p>请按以下步骤重写文本：</p>\n   <p>①保留原文要点约60%</p>\n   <p>②加入至少1个口语化连接词</p>\n   <p>③加入至少1个个人视角限定语</p>\n   <p>④适当加入轻微冗余或倒装</p>\n  </blockquote>\n  <p>场景3：通用 · 长句拆分+三明治结构</p>\n  <blockquote>\n   <p>第一步：将以下文本中的长难句拆分为3-5个短句</p>\n   <p>第二步：用“三明治结构法”重组：</p>\n   <p>第一层大白话抛出观点</p>\n   <p>第二层硬核专业知识或数据，第三层个人视角批判分析。</p>\n   <p>原文：[粘贴原文]</p>\n  </blockquote>\n  <p>场景4：学术论文 · 去套话+第一人称</p>\n  <blockquote>\n   <p>重写以下论文段落，要求：</p>\n   <p>删除「随着…的发展」「近年来…」等套话开头，直接切入问题</p>\n   <p>用「本研究」「笔者发现」等第一人称限定语替代第三人称</p>\n   <p>在引用后加入个人分析短句（如“这一点在笔者实验中得到印证”）</p>\n   <p>原文：[粘贴原文]</p>\n  </blockquote>\n  <p>场景5：学术论文 · 去除模糊表示</p>\n  <blockquote>\n   <p>识别以下段落中的「相关研究表明」「有学者指出」「该技术能提高效率」等模糊表述</p>\n   <p>替换为具体的实验数据、年份、样本量、真实案例</p>\n   <p>无数据时标注「[需补充真实数据]」，不要编造</p>\n   <p>原文：[粘贴原文]</p>\n  </blockquote>\n  <h3><strong>[动作三：巧妙利用Skill]</strong></h3>\n  <p>Skill可以理解为一个为AI准备的标准化作业程序。里面指令、脚本、资源、检查清单和异常处理机制都有。通常它是一个包含 skill.md等文件的文件夹。</p>\n  <p>可能你觉得反复调试、写作提示词很累，又或许你已经不满足于Prompt的书写，想要更精准或更强大的调整方式，那么你可以 调用起他人的智慧。毕竟众人拾柴火焰高。&nbsp;</p>\n  <p>这里存在一定的操作门槛，比较适合一些有更高要求的朋友，社交媒体很容易能找到部署安装方式。你可以去各大开源分享网站来获取Skill来强化AI。我们非常鼓励没有接触过的朋友们也尝试一下。</p>\n  <h4><strong>Skill挑选来源</strong></h4>\n  <p>官方Skill市场&nbsp;(Directory)：在Claude网页版的Customize-skills页面，可以浏览和安装官方及社区精选的Skill。</p>\n  <p>社区工具网站：skills.sh网站是配合vercel-labs/skills工具使用的一个技能目录，你可以在这里按流行度、趋势来搜索和筛选。</p>\n  <p>GitHub 代码仓库：这是最主要的Skill来源。比如，Anthropic官方就开源了包含16个实用工具的Skills 库（如PDF处理、Skill创建器等）；</p>\n  <p>微软官方也提供了playwright-cli（极低token消耗的命令行工具）这样的专业Skill。很多个人开发者也会在GitHub上分享自己的作品。</p>\n  <h4><strong>Skill弹药库</strong></h4>\n  <ul>\n   <li><strong>&nbsp;Claude Code Skill&nbsp;</strong></li>\n  </ul>\n  <p>GitHub用户blader把维基百科的24条规律做成了一个skill，装上之后，你只要说一句“humanize这段文字”，它就会自动扫描所有24种模式，然后帮你重写。</p>\n  <p>项目地址：https://github.com/blader/humanizer</p>\n  <ul>\n   <li><strong>&nbsp;Humanize AI text&nbsp;</strong></li>\n  </ul>\n  <p>功能包括AI文本检测和文本人性化改写，通过识别并修正 AI 写作的典型特征（如机械话术、格式痕迹、引用漏洞等），让生成式AI文本具备人类写作的自然性，从而规避各类 AI 检测器的识别。</p>\n  <p>项目地址：https://pan.quark.cn/s/8f5ad062b58e#/list/share</p>\n  <h3><strong>[动作四：人工检验]</strong></h3>\n  <p>为了掩盖机械感，AI会大量堆砌形容词和副词，导致文字看起来用力过猛。所以当看到过度华丽、对仗的段落文字时，就要注意，这些是否属于AI的手笔。此外，要警惕AI的推理论证。因为即使没有证据链，它也会杜撰。所以需要考虑，它给的论证思辨是正确的吗？具体事实案例符合规律吗？能否溯源查证？</p>\n  <h4><strong>人工验证须知</strong></h4>\n  <p>以下三类内容无论看起来多么可信，在涉及到内容真实的时候，都必须逐条人工查证。</p>\n  <p><strong>具体数据与统计</strong>：AI 极擅长编造看似合理的数字。如果没有在搜索结果中找到权威来源的原文佐证，应视为可疑。</p>\n  <p><strong>引语与人物</strong>：模型可能让某人在从未发生过的场合说出从未说过的话。如2025年11月“治安违法记录封存争议”事件中，AI甚至显示一名人大代表之子有吸毒经历，经核实完全为虚构。</p>\n  <p><strong>文献与引用</strong>：AI辅助科研中，参考文献出现错误的情况相当普遍，AI检索工具往往会“找出”与研究主题并无关系的论文</p>\n  <h4><strong>借用多种核实溯源手段</strong></h4>\n  <p>任何关键事实断言，都应在至少两个独立、可信的来源中得到佐证。这是新闻行业事实核查的铁律，同样适用于AI内容检验。</p>\n  <p>如果觉得太费心力，可以直接让AI进行二次查证。</p>\n  <p>这里要注意的是，AI可能生成虚假网站来“自证清白”。所以需要你谨慎地思考和求证。你可以使用多个AI来交叉验证，也可以使用很“old school”的方法，将AI生成的整个段落，特别是其中的核心数据或非常独特的描述，放进Google、百度等自然搜索，核对是否有相同的原文。</p>\n  <ul>\n   <li><strong>要求AI提供URL</strong></li>\n  </ul>\n  <p>在处理关键信息时，可以在初次提问时要求AI在引用处附上可直接访问的URL。输出后逐个点开链接验证内容是否与正在引用的部分一致。</p>\n  <p>对于有学术严谨性要求的朋友，面对一个看起来无可挑剔的高质量引用，尤其带DOI的文章时，可以先复制它的DOI码在doi.org上验证。</p>\n  <ul>\n   <li><strong>通过对话多轮追问AI</strong></li>\n  </ul>\n  <p>在你与它的对话中直接操作。</p>\n  <p>你可以反向提问寻求佐证，比如直接要求它提供三个反对理由，来检验论点。或者要求它为结论寻找更多来源支持，看看不同来源的说法是否一致。你也可以直接问它，针对[某条信息]，你的依据是来自训练数据还是实时联网检索？</p>\n  <h4><strong>二次验证工具弹药库</strong></h4>\n  <p>以下提供工具网站来帮助你进行二次验证核查。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_5edc22c73bfd4662a144a9f41e756181@5509299_oswg91030oswg1080oswg726_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：公众号「有三思 &nbsp;U &nbsp;Sense」</p>\n  <p>最后，我们还是想多说一句：AI的定位是人类的工具，它对个人的最大意义，就是能够在检索和处理信息上提供高效能和高便利性，让你的注意力资源能集中在更有创造力的事情上。</p>\n  <p>驱使它，释放想法，不被AI生成内容淹没表达的自由和创意……在这场有关AI味的“无间道”识别战中，这才是最重要的行事原则。</p>\n  <p>&nbsp;</p>\n  <p><strong>参考文章：</strong></p>\n  <p>1. Hamsa Bastani (University of Pennsylvania): “Unpacking the Unintended Consequences of AI in Education”&nbsp;</p>\n  <p>2. Your Brain on ChatGPT： Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task&nbsp;</p>\n  <p>3. Perspective Chapter: Toward a Quantitative Framework for Evaluating AI-Generated Creativity – A Linguistic and Computational Analysis of Language Model Outputs&nbsp;</p>\n  <p>4. Mediahuis suspends former Irish boss Peter Vandermeersch over use of AI&nbsp;</p>\n  <p>5. Baringa study explores shifting US consumer preferences around the consumption of AI-generated content&nbsp;</p>\n  <p>6. Common AI writing footprints that trigger detectors — and how to remove them&nbsp;</p>\n  <p>7. 融社区管理：去除AI痕迹，只需要这6步&nbsp;</p>\n  <p>8. Diverse and high-quality text generation assisted by large language models&nbsp;</p>\n  <p>9. CSDN：大模型效率提升指南：Prompt工程全攻略与15+框架应用&nbsp;</p>\n  <p class=\"editor-note\">本文来自微信公众号<a href=\"https://mp.weixin.qq.com/s/hqLQrCPwX5Yh4cpIsnH5kg\" rel=\"noopener noreferrer\" target=\"_blank\">“有三思 U Sense”</a>，作者：蒋雨恬，36氪经授权发布。</p>", "category": "tech", "published_at": "2026-05-25T11:32:24+00:00", "fetched_at": "2026-05-26T02:46:53.955410+00:00", "fingerprint": "e96c9689fcd547cb"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨胖东来投资65亿的“梦之城”开工；“稚晖君”彭志辉正式出任上纬新材董事长；“死了么”App改名“在么在么”", "url": "https://36kr.com/p/3825357879497346?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>美媒：美伊已就全面开放霍尔木兹海峡达成一致</p>\n  <p>拉勾网及创始人被限消</p>\n  <p>宇树科技6月1日科创板IPO上会，一季度扣非净利润同比下降52.55%</p>\n  <p>1瓶水蜜桃只有0.01克水蜜桃汁，康师傅被指蹭奉化水蜜桃玩文字游戏</p>\n  <p>寒武纪盘中涨超11%，总市值超9000亿创历史新高</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>胖东来进军房地产？投资65亿元的“梦之城”开工</strong></p>\n  <p>胖东来或将进军地产市场。近日，于东来在直播中称，梦之城建好后，如果还有空间的情况下，会建几个小区，“一个是安置胖来员工，一个是面向社会。”他表示，会全部公开建筑设计用材、建筑质量水平、建筑具体费用等，取一个合理的利润来售卖，在不破坏市场的情况下，争取健康发展，让每一个住户的权益都能得到保障。5月20日，记者在于东来个人社交账号看到，其贴出了一张工地的合影照，在条幅上明确写到：“梦之城项目开工”，同时，其为该照片配文称，“梦开始的时间、梦开始的地方……”</p>\n  <p>根据此前公示的规划信息显示，胖东来“梦之城”项目一期建筑面积46.7万平方米，3327个停车位。同时，项目一期主要建设商业综合体，建筑主体长299米，宽216米，高度50米，8层。一期之外，未来还将建设幸福讲堂、文化中心、酒店等主要部分。于东来也曾在社交账号发布信息称，梦之城是胖东来品牌成立以来投资规模最大的单体项目，项目建设和装修投资约65亿元，是一个超大型综合体，将涵盖百货、超市、电器、珠宝、电影、餐饮、茶叶、电玩以及酒店等业态。其还表示，相信该项目将成为未来中国商业的典范之一。（第一财经）</p>\n  <p><strong>“稚晖君”彭志辉正式出任上纬新材董事长</strong></p>\n  <p>5月25日，科创板上市企业上纬新材料科技股份有限公司（股票代码：688585.SH）完成了一系列关键的工商变更登记。天眼查显示，公司法定代表人由蔡朝阳变更为田华，曾是华为“天才少年”、在B站拥有数百万粉丝的“稚晖君”彭志辉则正式接任公司董事长一职。这一系列变更，标志着自2025年下半年以来，由明星机器人创业公司智元机器人主导的对上纬新材的控制权收购与整合，在人事安排上最终落定。（界面新闻）</p>\n  <p><strong>“死了么”App改名“在么在么”</strong></p>\n  <p>5月24日，据上城发布，“死了么”APP升级为“在么在么”安心守护平台，并率先在浙江省杭州市上城区南星街道投入应用。据悉，“在么在么”坚持大字体、简界面、少操作、高容错的适老化设计。老人每天使用智能手机即可完成无感签到，连续两天未签到，系统会自动提醒子女或紧急联系人。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美媒：美伊已就全面开放霍尔木兹海峡达成一致</strong></p>\n  <p>美国《华盛顿邮报》5月24日报道称，美国和伊朗已就一份谅解备忘录框架达成一致，一旦签署，将在30天内全面恢复霍尔木兹海峡的航运。报道援引美政府一匿名高级官员的话称，美国和伊朗已制定一份谅解备忘录“框架”，包括延长停火60天，以便双方就永久结束伊朗战事达成“最终协议”，其间霍尔木兹海峡将进行排雷并重新开放。（新华社）</p>\n  <p><strong>拉勾网及创始人被限消</strong></p>\n  <p>天眼查法律诉讼信息显示，近日，拉勾网关联公司北京拉勾网络技术有限公司及创始人许单单新增一则限制消费令，执行法院为北京市海淀区人民法院，案件流程信息显示，此前，该公司已因此案被执行24万余元。该公司成立于2013年3月，法定代表人为许单单，注册资本约556万人民币，经营范围包括软件开发、计算机系统服务、计算机技术培训等，由北京润安信息顾问有限公司、马德龙、许单单等共同持股。（界面新闻）</p>\n  <p><strong>宇树科技6月1日科创板IPO上会，一季度扣非净利润同比下降52.55%</strong></p>\n  <p>36氪获悉，上交所上市审核委员会将于2026年6月1日召开审议会议，审核宇树科技股份有限公司首次公开发行股票申请。该企业科创板IPO申请已于今年3月正式获上交所受理，此次上市拟募集资金42.02亿元。</p>\n  <p>从公司披露的一季度经营数据来看，2026 年1至3月宇树科技实现营业收入4.23亿元，营收同比增速较往年大幅回落，从上年同期332.64%降至68.49%。受研发费用、销售费用等期间费用大幅增长拖累，公司当期扣非净利润仅4025.36万元，相较于上年同期8483.65万元下滑明显，同比降幅达到52.55%。</p>\n  <p><strong>华为正式发表半导体领域新定律</strong></p>\n  <p>2026国际电路与系统研讨会25日在上海举行，华为公司董事、半导体业务部总裁何庭波在题为《半导体新路径探索与实践》的主旨演讲中，正式发表“韬（τ）定律”。这是中国在全球半导体领域首次提出指导产业发展的新原则。基于该定律，华为过去六年已成功设计并量产了381款芯片。今年秋季，华为将发布新的麒麟手机芯片，完整采用逻辑折叠技术，大幅提升相关性能。（人民日报）</p>\n  <p><strong>现代汽车集团设立专门部门负责软件定义工厂战略和机器人零部件采购</strong></p>\n  <p>据报道，现代汽车集团已成立专门部门，致力于推进其软件定义工厂（SDF）战略，并采购机器人组件，这是其在汽车制造工厂部署Atlas人形机器人的更广泛计划的一部分。据透露，该集团近期设立了一个职位，负责监管其软件定义工厂（SDF）项目，并任命现代汽车集团新加坡创新中心首席创新官阿尔佩什·帕特尔（Alpesh Patel）担任此职。（新浪财经）</p>\n  <p><strong>前阿里P10研究员倪生华出任店小秘集团CTO</strong></p>\n  <p>36氪获悉，近日，店小秘正式宣布，任命前阿里巴巴P10研究员倪生华担任集团首席技术官（CTO），全面统筹集团技术体系的战略规划、架构升级及前沿AI技术的攻坚与落地。</p>\n  <p><strong>国际油价显著下跌</strong></p>\n  <p>由于有报道称，美国与伊朗谈判取得进展，接近达成协议，市场担忧情况缓解。25日亚洲交易时段，国际油价显著下跌，跌幅一度超5%。截至北京时间25日上午8点30分，纽约商品交易所7月交货的轻质原油期货价格报每桶92.05美元，跌幅为4.71%，7月交货的伦敦布伦特原油期货价格报每桶98.74美元，跌幅为4.64%。（央视财经）</p>\n  <p><strong>1瓶水蜜桃只有0.01克水蜜桃汁，康师傅被指蹭奉化水蜜桃玩文字游戏</strong></p>\n  <p>近日，康师傅“每日C水蜜桃水果饮品”因其宣传与实际含量之间的悬殊差距引发广泛质疑。记者发现，在杭州线上线下，这款饮品均有售卖，包装醒目标注“特选奉化水蜜桃”。但500毫升装饮品中，添加仅0.01克。要想吃到一个奉化水蜜桃的桃汁量，你可能需要喝掉几千瓶康师傅才行。</p>\n  <p>康师傅回应，产品标识合规，已如实标注配料信息。但法律人士认为，奉化水蜜桃是价值超15亿元的国家地理标志产品，企业刻意渲染该卖点，却极少添加对应原料，涉嫌误导消费者、违反相关法规。近年康师傅业绩承压，此类重宣传、轻实际的营销方式，透支了消费者信任。消费者选购饮料时，应重点查看配料表，不要轻信外包装的广告语。（都市快报）</p>\n  <p><strong>寒武纪盘中涨超11%，总市值超9000亿创历史新高</strong></p>\n  <p>5月25日早盘，寒武纪股价在资金推动下强势拉升，盘中涨幅一度超过11%，最高触及1435元附近，总市值逼近9000亿元，续创历史新高。寒武纪的强势表现起到了市场“风向标”的作用，带动整个科创芯片板块火力全开。科创50指数当日涨幅扩大至3%以上，盘中甚至大涨近6%，华虹公司、中芯国际、盛美上海、思瑞浦等半导体核心标的纷纷跟涨并创下近期新高 。全市场成交额显著放量，沪深两市合计成交约3.21万亿元，资金交投活跃，焦点清晰指向硬科技赛道。（财联社）</p>\n  <p><strong>立讯精密：光铜并进路线与头部客户布局光芯片、光纤厂商并不矛盾</strong></p>\n  <p>立讯精密近日召开年度股东会，交流环节中有投资者提问：立讯主张光铜并进，但头部客户英伟达大量布局光芯片、光纤厂商，是否存在矛盾，如何看待光铜路线的发展？立讯精密表示，在公司当前服务的产品中，我们看到未来光连接的需求规模会远大于铜连接，但铜连接的技术门槛同样很高。两者并非简单替代关系，而是会长期共存：短距离场景适用铜连接，长距离及更高速率场景对光连接的需求更大；当铜连接接近信号传输极限时，需要通过光连接解决问题。因此，光铜并进与头部客户布局光芯片、光纤厂商并不矛盾。（证券时报）</p>\n  <p><strong>库克将迎CEO告别演讲，此后转任执行董事长</strong></p>\n  <p>5月25日，知名科技记者马克·古尔曼发文称，今年苹果全球开发者大会（WWDC）将是库克作为苹果CEO最后一次发表主题演讲。当地时间6月8日，WWDC 2026将在美国加州库比蒂诺 Apple Park举办，现任CEO库克，将发表其任内最后一次CEO主题演讲，9月1日正式卸任CEO，转任董事会执行董事长，未来作为执行董事长将不会再做主题演讲。硬件工程高级副总裁约翰・特努斯将同步接任CEO并进入董事会，计划在9月秋季iPhone发布会上，以折叠屏 iPhone作为上任后首款重磅硬件首秀，开启苹果AI与硬件融合新阶段。（界面新闻）</p>\n  <p><strong>马斯克称未来星链将承载大部分网络流量，星链就是互联网</strong></p>\n  <p>马斯克5月24日表示，如果SpaceX的星链卫星网络继续发展，最终可能会承载大部分互联网流量，并描绘了该系统成为在线连接主要骨干网的未来图景。马斯克在X上回应了一篇引用SpaceX文件细节的帖子，该文件显示星链V3卫星的下行链路容量将大幅提升，从V2的每颗卫星96Gbps提升至1024Gbps。（新浪财经）</p>\n  <p><strong>SpaceX IPO在即，太空ETF迎“井喷式”爆发</strong></p>\n  <p>随着SpaceX备受期待的IPO即将落地，太空ETF正迎来“井喷式”爆发。晨星Direct数据显示，仅过去一个月，太空相关ETF就吸引了13亿美元的新资金流入，将这个新兴赛道板块总资产管理规模推高至33亿美元。不过，Strategas的ETF策略师提醒称，“太空经济”在广阔的科技版图中仍属小众细分赛道。他警告称，“盲目追逐SpaceX、太空概念和下一个风口”可能会带来问题。（财联社）</p>\n  <p><strong>711创始人铃木敏文因心力衰竭去世</strong></p>\n  <p>5月25日，柒和伊控股官网5月25日发布正式讣告，前董事长兼CEO铃木敏文因心力衰竭于5月18日逝世，终年93岁。作为日本“零售之神”，他于上个世纪70年代将7-Eleven引入日本并实现反向收购，成功缔造了庞大的全球零售帝国。柒和伊控股表示，遵照家属意愿，葬礼已由近亲低调举行。据九派新闻，20世纪70年代，铃木敏文将7-Eleven便利店从美国带到日本，并一手将其打造成全球最成功的便利店品牌。2010年，出版书籍《想法1：突破成长的烦恼》。2014年，出版书籍《零售的哲学》。2015年，出版书籍《零售心理战》。（中新经纬）</p>\n  <p><strong>欧盟计划对谷歌处以数亿欧元罚款</strong></p>\n  <p>德国《商报》援引欧盟委员会消息人士称，欧盟计划对Alphabet旗下谷歌处以高达数亿欧元的罚款，作为一项反垄断调查的一部分。该报称，相关裁决已接近完成，预计将在夏季休会前正式公布，并补充说，这将是欧盟因违反新《数字市场法案》(DMA)而开出的最高金额罚单。（新浪财经）</p>\n  <p><strong>Delivery Hero确认收到优步每股33欧元收购要约</strong></p>\n  <p>当地时间5月23日，德国外卖巨头Delivery Hero（外卖超人）发布公告证实，优步（Uber）已向其发出初步意向提案，拟以每股33欧元的价码对该公司全体股东发起潜在的收购要约。（界面新闻）</p>\n  <p><strong>外资上周净抛售逾10万亿韩元三星和SK海力士股票</strong></p>\n  <p>韩国交易所5月25日公布的数据显示，上周外国投资者抛售了价值超过10万亿韩元（约合66亿美元）的三星电子和SK海力士股票，连续12个交易日净卖出韩国股票。据显示，在5月18日开始的当周，外国投资者净卖出SK海力士股票5.33万亿韩元，净卖出三星电子股票5.26万亿韩元。（新浪财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>全球AI大模型周调用量五连涨，DeepSeek-V4-Flash登顶</strong></p>\n  <p>根据OpenRouter最新数据测算，5月18日至5月24日，全球AI大模型总调用量为28.9万亿Token，较此前一周增长7.4%，连续五周上涨，大模型调用需求仍在持续释放。其中，上榜的AI大模型中，中国AI大模型周调用量达9.223万亿Token，环比增长19.89%；同期美国AI大模型周调用量为4.93万亿Token，环比增长16.27%。中国大模型周调用量连续四周超过美国并稳居全球首位，中国模型正在更深地进入全球开发者调用体系。（每日经济新闻）</p>\n  <p><strong>马斯克：Grok基础模型V9-Medium（1.5T）已完成训练</strong></p>\n  <p>马斯克表示，Grok基础模型V9-Medium（1.5T）已完成训练。评估结果良好。在补充训练中加入了大量Cursor数据，后续还将继续添加。微调工作正在进行中，强化学习将于数日后启动。预计2至3周后正式发布。（财联社）</p>\n  <p><strong>ima Copilot25日全面开放，并发布新能力知识号支持发布Skill</strong></p>\n  <p>36氪获悉，ima5月25日开放两项重要能力：Copilot功能全面开放，此前该功能需申请排队，排队人数已超过10万；Copilot的全面开放，意味着更多用户可以在ima自身产品内直接使用知识Agent。用户沉淀在ima中的资料和知识，也可以在Copilot的任务执行过程中被调用和使用。同时，知识广场支持通过知识号发布和发现Skill，首批上线微信读书、腾讯招聘等Skill，用户也可以发布自己的Skill。</p>\n  <p><strong>五一视界具身智能数据平台Aperdata.ai正式上线</strong></p>\n  <p>36氪获悉，五一视界具身智能数据平台Aperdata.ai正式上线。据介绍，该平台主要面向具身智能训练与验证数据缺失的痛点，构建高保真、受物理法则严格约束的仿真训练环境与合成数据，加速AI从数字世界迈向物理世界。</p>\n  <p><strong>高德问店选址Skill接入钉钉悟空</strong></p>\n  <p>36氪获悉，近日，钉钉企业级AI原生工作平台“悟空”技能广场正式上线了一款名为“高德问店选址智能助手”的Skill。该技能面向连锁品牌加盟商及中小商家，可通过自然语言对话方式，提供开店需要的位置推荐、点位评估、点位对比、立项报告等全流程选址服务。</p>\n  <h2>上市进行时</h2>\n  <p><strong>智能戒指厂商Oura在美秘密提交上市申请</strong></p>\n  <p>智能可穿戴设备Oura Ring的制造厂商Oura已在美国秘密提交首次公开募股的申请。在过去两个财政年度中，Oura的总营收实现了四倍增长，并且公司一直将毛利润持续重新投入到业务拓展中。这家十多年前成立于芬兰的公司目前已在全球售出超过550万枚智能戒指，产品覆盖全球4600多个零售网点。Oura Ring主要用于监测睡眠、日常活动和其他健康指标，提供个性化的健康洞察与指导。（新浪财经）</p>\n  <p><strong>国联绿色科技（无锡）股份有限公司向港交所提交上市申请</strong></p>\n  <p>36氪获悉，据港交所文件，国联绿色科技（无锡）股份有限公司向港交所提交上市申请书。</p>\n  <p><strong>思必驰科技股份有限公司科创板IPO已获上交所受理</strong></p>\n  <p>36氪获悉，思必驰科技股份有限公司科创板IPO已获上交所受理。</p>\n  <h2>投融资</h2>\n  <p><strong>“天机智能”完成10亿元融资</strong></p>\n  <p>36氪获悉，据天机机器人官微，近日，广东天机智能系统有限公司正式完成10亿元B轮及B+轮融资，投后估值近百亿，跻身独角兽行列。本轮融资由高瓴创投、美团战投联合领投，腾讯、高榕创投、光合创投、纪源资本等联合跟投，高鹄资本担任独家财务顾问。本轮融资将主要用于技术研发、大规模量产，及全球销售网络建设。</p>\n  <p><strong>“具脑磐石”完成新一轮亿元级融资</strong></p>\n  <p>36氪获悉，具身智能大脑公司“具脑磐石”完成新一轮亿元级融资，本轮融资由产业资本领投，老股东及多家基金复投和跟投，多维资本担任独家财务顾问。同时，更新一轮融资也在同步交割中。资金将重点投入核心技术研发、人才团队扩容及全球化市场拓展，以加速认知世界模型（Cognitive World Model）的研发、工程化落地与真实场景验证。</p>\n  <p><strong>“黑格科技”完成超3亿元人民币C轮融资</strong></p>\n  <p>36氪获悉，“黑格科技”于近期完成超3亿元人民币C轮融资。本轮融资由君联资本、达晨联合领投，歌斐资产、国科投资跟投。本轮资金用途将用于光固化技术研发迭代、全球产业链深化、顶尖人才引进及新一代数字化齿科解决方案、桌面级光固化全彩造物产品的发布。</p>\n  <p><strong>“蓝点触控”完成C++轮数亿元人民币融资</strong></p>\n  <p>36氪获悉，近日，六维力传感器企业“蓝点触控”宣布完成C++轮数亿元人民币融资，本轮由上汽金控、尚颀资本领投，由中芯聚源、正大机器人以及厚为资本跟投。本轮融资将主要用于新产品研发、生产数智化建设以及全球市场拓展。</p>\n  <h2>酷产品</h2>\n  <p><strong>法拉利发布首款纯电动汽车Luce</strong></p>\n  <p>法拉利25日发布了其首款纯电动汽车。这款名为“Luce”（意大利语意为“光”）的四门轿车，是在前苹果设计总监乔尼·艾维及其团队LoveFrom的协助下研发的，也是法拉利首款五座车型。法拉利旨在吸引财力雄厚的家庭客户，为他们提供舒适的座椅、高端科技配置以及600升的后备箱空间。这款备受期待的Luce定价为55万欧元(64万美元)，预计将于2026年第四季度开始交付。（新浪财经）</p>\n  <p><strong>新型3D打印技术问世，机构高频调研3只概念股</strong></p>\n  <p>2026年以来，3D打印行业内好消息持续涌现���据科技日报消息，瑞士洛桑联邦理工学院（EPFL）研究团队开发出一种新型全息体积3D打印技术，使打印效率较此前技术提升70倍，能在数秒内完成毫米级结构打印，打印人体器官模型仅需几分钟。相关论文发表于最新一期《光：科学与应用》杂志。机构调研是了解上市公司最新产业布局的重要途径，据证券时报·数据宝统计，截至目前，今年以来获得3次及以上机构调研的3D打印概念股有18只。其中3只股票获机构调研10次以上，分别是大族激光、爱迪特、奥比中光-W。（证券时报）</p>\n  <p><strong>帝尔激光：面板级玻璃基板通孔设备已出货</strong></p>\n  <p>36氪获悉，帝尔激光在互动平台表示，公司TGV激光微孔设备可应用于半导体芯片封装、显示芯片封装等相关领域，目前已实现晶圆级和面板级封装激光技术的全面覆盖，并完成面板级玻璃基板通孔设备的出货。</p>\n  <p><strong>整理</strong>｜Kris&nbsp;</p>", "category": "tech", "published_at": "2026-05-25T23:58:09+00:00", "fetched_at": "2026-05-26T02:46:53.955404+00:00", "fingerprint": "ce965b229e36ab4f"}, {"source": "36氪 - 最新文章", "title": "两部 AI 剧集闯入戛纳，水母智能要做 AI 内容工业化的破局者｜项目报道", "url": "https://36kr.com/p/3823033729061253?f=rss", "summary": "<p>5月8日，第79届戛纳国际电影节內 Fantastic Pavilion 单元公布竖屏剧展演名单。</p>\n  <p>由水母智能旗下中国AI影视公司水母映画出品的竖屏剧集《摸金之天机入梦》（英文名：The Golden Tomb Seeker）以及水母星际出品的《饿塔》（英文名：Series Tower）从全球120个国家、超过1000件竖屏作品中脱颖而出，成为正式展映的21部作品之一。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_c93578737bdf46e38961e5d0b41d9525@5654145_oswg3452305oswg1792oswg2400_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">竖屏剧集《摸金之天机入梦》</p>\n  <p>当两部纯 AI 制作的竖屏短剧，出现在戛纳电影节的展映厅里，大概很多人都没想到：曾经被视作电子榨菜 的 AI 漫剧，居然能站上全球电影工业的殿堂。</p>\n  <p>这不是流量短剧的镀金游戏，而是一个行业的成人礼。</p>\n  <p>2025 年还在靠低成本爽文野蛮生长的 AI 漫剧，只用一年时间，走完了传统短剧五年的进化路 —— 从粗制滥造、擦边流量，转向精品化、工业化、IP 化，甚至开始讲严肃故事、走向全球。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260524/v2_1faefbe6d0844e1ba803538ff8a7000c@5654145_oswg7063313oswg1552oswg1942_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《饿塔》</p>\n  <p>“大家对 AI 漫剧的印象还停留在爽文、快消、土味。” 水母智能联合创始人周志鹏说，“但我们想证明，AI 可以拍有内核、有审美、有国际语言的内容。”</p>\n  <p>过去，AI 内容被调侃 “只会制造爽点”；如今，它开始承载科幻、悬疑、东方宇宙等更重的题材。这一步，是行业从 “流量供给” 到 “内容创作” 的关键跨越。</p>\n  <p>AI 漫剧的疯狂，来得猝不及防。</p>\n  <p>2025 年，行业一年跑出超 5 万部作品，却只有一两百部真正赚钱。大部分公司靠接订单、堆产量、蹭热度，画面崩坏、剧情狗血、人物畸形，最后被平台批量下架。</p>\n  <p>到 2026 年，风向彻底变了。</p>\n  <p>抖音、红果整合后，平台政策直接 “押注精品”：仿真人 AI 漫剧分账系数拉高到 60 倍，远超真人剧；低质内容不给流量，擦边内容直接清退。曾经靠 “堆量” 生存的公司，一夜之间失去生存空间。</p>\n  <p>技术更是一把剪刀。Seedance 2.0 的出现，把 AI 视频从 “单镜头拼接” 推到 “多镜头连续叙事”，画质冲上 1080P，人物表情、运镜节奏、场景精度全面升级。头部内容公司签下千万年级年框，锁定算力、并发、肖像白名单，行业正式进入 “技术军备竞赛” 时代。</p>\n  <p>“以前是个人都能做 AI 短剧，现在只有懂内容、懂技术、懂工业化的团队能活。” 周志鹏直言。</p>\n  <p>和市面上大多数 “接单制作” 公司不同，水母智能从一开始就走了一条更重、也更稳的路：工具 + 出品 + 人才培养三位一体。</p>\n  <p>他们不只是做内容，还造工具。国内触手 AI、海外 Animeshorts.ai 双平台，从选题、IP 筛选、剧本生成，到分镜、画面、视频、后期，全流程 AI 化。海外上线即拿下 Product Hunt 当日之星，仅日本就积累近 10 万付费创作者。</p>\n  <p>他们不只是做代工，还控 IP。牵手天下霸唱、高阳、潘海天等顶级作家，并签约各头部小说、影视剧等IP平台手握 350 部 IP 授权。</p>\n  <p>他们不只做产能，还建人才体系。深度参与工信部 AIGC 岗位标准，牵头成立全国首个 AI 设计产教融合共同体，把课程开进百所院校。别人缺人、缺产能、缺标准，水母智能从源头把供给侧稳住。</p>\n  <p>这种模式，让它在行业洗牌里反而越跑越快。</p>\n  <p>AI 漫剧的终局，早已不是 “短平快赚快钱”。水母智能把下一步押在三件事上：IP 宇宙化、精品全球化、内容严肃化。</p>\n  <p>他们正在搭建以天下霸唱、高阳为核心的 “东方大江湖宇宙世界观，并陆续开发一系列30 部作品，内容联动，人物跨剧互动，类似中国版漫威一个庞大故事世界；同时签约潘海天、吴霜、韩松等科幻顶流 IP，把过去 “烧钱拍不出” 的科幻故事，用 AI 落地。</p>\n  <p>AI精品化，比所有人预想中来得更快。而最小颗粒度的内容数据和观众反馈数据，以及强大知识库所驱动的agent自我进化，可以帮助出品方、编剧方、制作方、投资方拿到更好的商业化结果。</p>\n  <p>海海外更是其长期重视的市场。作为最早进入日本市场、数据最好的中国 AI 漫画/漫剧团队，水母智能通过 Animeshorts.ai，把 AI 创作工具与内容同步输出日韩、欧美，让中国 AI 能力与中国故事一起出海。</p>\n  <p>“AI 降低的是生产门槛，不降低创作门槛。” 周志鹏说，“真正决定胜负的，还是故事、审美、价值观。”</p>\n  <p>从洛可可的设计基因，到 AI 内容工业化；从国内爆款，到戛纳展映；从土味爽剧，到东方宇宙与硬核科幻 ， 水母智能踩中了时代最确定的趋势：AI 不是内容的替代品，而是内容的新基建。</p>\n  <p>当 AI 开始认真讲故事，短剧不再只是打发时间的快餐。而那个最先把快餐做成宴席的玩家，已经站在了下一轮增长的门口。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-05-26T01:00:00+00:00", "fetched_at": "2026-05-26T02:46:53.955398+00:00", "fingerprint": "7e196218b7395e94"}, {"source": "36氪 - 最新文章", "title": "对话云鲸CEO张峻彬：理解人性，告别天真", "url": "https://36kr.com/p/3824244844859525?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄楠</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>36岁时，云鲸CEO张峻彬意识到，自己不能再只做一个温和的人。</p>\n  <p>他做过一些得罪人的决定，但更多时候，张峻彬不善于说重话，以至于有人私下说他有些优柔寡断。“公司内部都说，要是彬哥对你的评价是‘还行’，说明你这东西已经很烂了。”他自己开玩笑。</p>\n  <p>过去几年，这种性格底色没有暴露太大短板。因为张峻彬更多泡在产品里，离琐碎而复杂的事务保持着一定距离。他喜欢自己做的事，也的确得以找到一角纯粹之地沉浸其中。</p>\n  <p>但一个产品经理终究不是CEO。成功的一把手可以放权、但不能让公司离手，并会在关键时刻手起刀落。“我以前太喜欢做产品了，也太温和，只做自己喜欢的事，不是一个合格的CEO。”张峻彬说。</p>\n  <p>也是在他埋头做产品的几年，云鲸内部的问题开始累积。你如果身处云鲸内部，会看到部门内耗，对接人不断更换，老员工相继流失。这些事看似分散，却最终指向同一个原因：没有一个人能将公司从上到下拧成一根绳。</p>\n  <p>最终，病灶还是摆到张峻彬面前，他震惊、愤怒之余，也清楚意识到人心并不总循着善意运行。他开始反思自己的缺位，“你什么都说好，这就是害了大家，也害了公司。”</p>\n  <p>从今年开始，他走出舒适区，躬身一线，开始以CEO的手，重新梳理营销、研发各个部门。某种意义上，这是他创业十年来最不熟悉、也最难绕开的一课：理解人，判断人，并在必要时对人做决定。</p>\n  <p>现在，张峻彬已经少了些焦虑，因为业务已经看到明显起色。比如海外市场，2026年前4个月营收同比增长近50%。</p>\n  <p>对张峻彬最大的冲击并非业务本身。创业十年，他第一次真正凝望人性的深渊。比如，一些初衷并不坏的人因为各种正当的原因，做了糟糕的事，你如何抉择？又如何面对他们？</p>\n  <p>现实生活中，不存在绝对的厌恨和绝对的理解，人会在灰色地带不断徘徊。当我们问：你现在对人性是否有其他认知？他沉默了很久。“我现在理解了一句话，<strong>百善孝为先，论心不论迹；万恶淫为首，论迹不论心。</strong>”他最终回答。</p>\n  <p>张峻彬的底色从来不是冷酷的——很多人对他的评价是：体面。然而，残酷商业竞争中，CEO就算不变成一个“混蛋”，但必得是个“狠人”。“慈不掌兵”对张峻彬而言，是需要适应和学习的一课。</p>\n  <p>我们和张峻彬对话了3小时，交流他如何从产品创始人成长为成熟企业家。他正独自趟过这条暗河，并在认清生活真相后，依然热爱生活。</p>\n  <p><strong>以下是硬氪同张峻彬的对谈实录，内容经编辑：</strong></p>\n  <h2><strong>恐惧来源：最怕的不是低分，而是无路可走</strong></h2>\n  <p><strong>硬氪：过去一段时间你很少出现在公众视野，今年AWE云鲸也没有参加，内部具体在做什么？</strong></p>\n  <p><strong>张峻彬：</strong>忙着营销改革。之所以没去AWE，也是我们内部复盘的结果。</p>\n  <p>去任何展会，要想清楚目的是什么，否则就是白花钱，展会也非常耗团队精力，几十号人为了装修、选址忙活几个月，价值不高。</p>\n  <p>我认为参加展会有两个目的：一是品牌进入一个全新的市场，需要集中接触媒体和渠道资源；二是发布了划时代的产品或技术，需要更高效率地集中流量来放大声量。</p>\n  <p>对云鲸现阶段来说，我们希望把资源和精力放在深度本地化运营上。这是价值选择的问题。</p>\n  <p><strong>硬氪：开始管营销部门后，你的工作发生了哪些变化？</strong></p>\n  <p><strong>张峻彬：</strong>以前我把产品看得很重，绝大部分精力在做产品和研发。去年9月份刚开始接的时候，我几乎所有时间都放在营销上。</p>\n  <p>最近又有所调整，大致是30%的精力在营销，30%在集团整体运营，30%在产品。原因是营销进入一个新的组织面貌后，前后端拉齐需要一个集团运营抓手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_ffd8ff4dd42d4e0791c86bf993204f16@6022551_oswg114266oswg1080oswg722_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸2025年发布会路演，法国普罗旺斯站（图源/企业）</p>\n  <p><strong>硬氪：是哪个时刻让你觉得营销很重要？因为之前的转化结果没达到预期？</strong></p>\n  <p><strong>张峻彬：</strong>我以前是真不懂营销，脑子里营销就那三板斧：要么价格便宜点，要么多砸点钱投广告，要么就是产品不行。我也认真反思过，是不是产品真有问题？后来才慢慢反应过来——问题出在营销上。虽然现在也说不上多懂，但起码知道，不能再用那三板斧去套了。</p>\n  <p>从几件小事就能明显感觉到不对劲。比如算一笔营销动作是否盈利，团队内部口径都不统一，这本身就是问题。一种叫“销运口径”：只要把货压给代理商就算卖出去了，就算完成销售，账面利润自然好看；另一种叫“销口径”：只有用户实际付款收货，才能算真实成交。按销运口径，数字光鲜，但货可能依然��留在渠道，周转效率很低。所以从真实的经营效率出发，不能用销运口径来衡量当月利润。</p>\n  <p>再说费用摊销规则。比如单次大额营销费用，是按当月全额计入、按季度分摊，还是按全年分摊？如果口径不统一，后果就是某个月份突然承担了之前多个月的费用，当月利润一下就不行了，可这笔钱对应的营销活动并不在该月。</p>\n  <p>以前我没管过营销，直到从第一性原理出发去看这些事，很多问题并不难发现。</p>\n  <p>我以前认为产品和营销是加法逻辑“产品+营销”，只要把产品做的足够好，成绩也不会太差。</p>\n  <p>现在才明白，它们的关系其实是乘法逻辑“产品×营销”，产品做得再好，营销这块短板不补上，就会让好产品错过好时机。</p>\n  <p><strong>硬氪：那为什么以前发现不了、没有解决？</strong></p>\n  <p><strong>张峻彬：</strong>以前太沉迷于做产品了。这本质上源于我这个人还不够成熟，不是一个合格的CEO，只做自己擅长的事情。直到太多不对劲的地方出现，才不得不花更多精力去学习和改变。</p>\n  <p>前两年国补带来了增量和利润，发展能掩盖很多问题。国补退潮后，组织内部的问题更激烈地摆在面前，这触发了我们改革的决心。</p>\n  <p><strong>硬氪：除了亲自管没有别的解法么？每个环节都自己抓不是长久之计，一位CEO成熟的状态应该是用制度让公司跑起来，自己做顶层把控。</strong></p>\n  <p><strong>张峻彬：</strong>取决于想要让改革速度多快。Founder Mode（创始人模式）的速度最快。而且一些核心人员变动后，如果创始人不站到台前来，团队会军心不稳。这不只是业务改革，更是组织改革，需要你在一线传递正向信号，让大家继续往前走。</p>\n  <p><strong>硬氪：你希望多快？</strong></p>\n  <p><strong>张峻彬：</strong>国内改革花了大半年基本恢复同比增长。以前我不理解，线下相对于线上退货率会低很多，为什么还会不挣钱？接手后，现在已经实现扭亏为盈。今年前四个月，相比2025年国补同期，公司在营销费用减少的情况下，营收和毛利率都实现了增长。这是改革调整后的结果。</p>\n  <p><strong>硬氪：恐惧驱动和热爱驱动区别挺大的。刚接手营销时，你的恐惧主要源于什么？</strong></p>\n  <p><strong>张峻彬：这个恐惧的来源于未知吧，来源于不懂营销。</strong></p>\n  <p><strong>但公司把你推到那个位置，就必须走出舒适区，用最快的速度改革。</strong></p>\n  <p>那时候不知道能不能扭转过来。我担心的不是业务只有40、50分的水平，而是进去后发现所有工作已经做到85分、效率达到极致，但仍然没有起色，那就无路可走了。</p>\n  <p>结果实际情况是，空间很大，恐惧感也就小了很多。40、50分的水平要提升到60分其实相对容易。事实也证明如此，今年三四月份，云鲸前端利润提升了，我也就没那么焦虑了。</p>\n  <h2><strong>做CEO，切忌想让所有人开心</strong></h2>\n  <p><strong>硬氪：你觉得个人认知成长最快是在什么时候？</strong></p>\n  <p><strong>张峻彬：</strong>2024年，云鲸启动了事业部改革、降本提效等一系列动作，内部阻力不小。这时候需要有技巧地推动事情平稳运行，同时引导大家不带情绪地跟随战略方向。</p>\n  <p>很多决策直接讲出来，团队未必能理解或共情。当时我最大的成长是意识到，硬推是行不通的。如果无法让所有人同心协力，要么有人应付了事，要么更糟，会试图证明你是错的。</p>\n  <p><strong>公司组织改革一旦上下不同欲，结果往往惨烈。执行层面偏了，最后效果差，决策层还会误以为是改革方向错了。其实不是。</strong></p>\n  <p>解决“同欲”是关键。所有关键人物必须共识和赞同，否则大概率做不成。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_d4a47bf79c4b4d8f8f7b883b2c767351@6022551_oswg63293oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸张峻彬（图源/企业）&nbsp;</p>\n  <p><strong>硬氪：怎么让关键人物同意，是靠强力压、惩罚，还是激励？</strong></p>\n  <p><strong>张峻彬：</strong>方法很多，但核心是要把这件事对集团底层的收益讲得非常清晰。不能笼统地说“对云鲸好”，要具体，而且让大家看到实实在在的好处。</p>\n  <p>比如退货率下降一个点，净利润就能多0.5个点，数据摆出来就会有说服力。如果只说“退货率太高了得砍”，对方可能会反驳：“我们好评率已经是全国第一了，还要降？”这时候你就很难推进下去。</p>\n  <p><strong>硬氪：所以还是需要有信任的人在关键岗位，作为CEO才能轻松一点。什么样的人值得信任？</strong></p>\n  <p><strong>张峻彬：</strong>我思考过，也跟国内好几个顶级操盘手交流过，最近这一段是看营销的人才，我觉得优秀营销操盘手需要具备五个能力。</p>\n  <p>第一，懂财务、会看账，对数据口径敏感，知道什么数据能反映真实情况。第二，特别懂自己的产品，会主动去用、去研究、去吃透。第三，能花小钱办大事，不是纯砸预算，而是有巧劲、有自己独特的打法。第四，手里有渠道资源和人脉，能真正把市场打开。第五，会带队伍、管团队，能把人组织起来一起干。</p>\n  <p><strong>硬氪：怎么找到这样的人并建立信任关系？</strong></p>\n  <p><strong>张峻彬：</strong>这五大能力之上，最重要的叫动机，即这个人加入公司的目的是什么？</p>\n  <p><strong>营销人的动机通常分三种：第一种是刷履历，不惜成本做大项目，功劳归自己，风险归公司；第二种是攒资源，把平台当跳板；第三种是做事业，真正与公司一起成长，把效率和成本当作自己的事来死磕。</strong></p>\n  <p>要学会识别。动机不对，能力再强也是隐患。跟他们交流时，如果一个人开口闭口就是自己过去花了上亿元、做了多大规模的Campaign，却讲不清为什么花、带来了什么真实转化和用户价值，我会非常谨慎。</p>\n  <p><strong>硬氪：但人是会变的。有没有制度层面的办法？</strong></p>\n  <p><strong>张峻彬：</strong>我现在基本每周都参加前端营销的经营会。以前一两个月看一次，现在每周都看，无论国内海外，重点盯四件事：投放效率、规模、收入、利润。这本质上是一个制度控制，不是简单看两眼就完了，而是通过高频的经营复盘形成制度化的监控节奏。</p>\n  <p>但制度是治标不治本。如果一个人动机变了，通过制度监控发现异常后，该换就得换。这已经不是能力问题了，而是底色问题。</p>\n  <p>我见过一些绝对头部的公司，流程制度非常成熟，照样翻车。制度能过滤掉一部分机会主义者，但制度是有盲区的，尤其是在核心岗位上。</p>\n  <p>制度是底线，对人的判断才是天花板。这些东西，KPI看不出来，系统也跑不出来。</p>\n  <p><strong>硬氪：你能接纳错误发生吗？</strong></p>\n  <p><strong>张峻彬：</strong>能。原因是我清楚地知道，一个创始人的成长、特别是端到端知识体系的全面性，是需要时间从内到外成长并走出来的。从研发、产品、项目、供应链甚至物流服务，再到营销，对所有业务底层逻辑的理解需要成长时间。</p>\n  <p><strong>硬氪：最终一系列改革都回到价值观这件事上。你现在怎么理解价值观？和十年前相比，你的理解有什么变化么？</strong></p>\n  <p><strong>张峻彬：</strong>我大概经历了几个阶段。第一阶段是跟大企业学习、复制，结果收效很小。第二阶段，开始理解内心，知道自己想要什么，但还无法精准提炼。第三阶段慢慢从模糊到清晰，意识到有些价值观是必须具备的，并且能真正推动公司成功。</p>\n  <p>落到具体管理工作中，比如人才选拔，过去我会把个人能力看得很重，关注技能、经验，现在觉得价值观比能力更重要。</p>\n  <p>自驱力、愿力大于能力，创新大于经验。一个人想不想把事情做好、自驱力是否足够强，某种意义上比能力本身更关键。一个全力投入的人，哪怕能力只有80分，结果可能比能力90分、不AII in的人更好。</p>\n  <p>其次是成长的迭代速度大于经验。核心表现是，这是不是一个向内求解的人，遇到问题时会先反思“我哪里没做好”，而不是一味指责外界。只有向内看的人才有可能高速迭代。缺乏这种特质的人容易成为团队内耗的源头，动辄甩锅。</p>\n  <p><strong>你可以理解为Ego大和Ego小。我现在更偏向招后者，能力可以成长，但愿意全情投入，有自驱力和愿力把事做成。这是我现在最看重的。</strong></p>\n  <p><strong>硬氪：一个很现实的问题，公司走到第十年，期间必然涉及到人才激励和退出。</strong></p>\n  <p><strong>张峻彬：</strong>首先，云鲸的IPO进程会持续推进。只是去年公司在市场营销端遇到一些问题需要改革，这不代表我们放弃上市。这个过程中确实有人离开，这也是难以避免的。</p>\n  <p><strong>之前我跟国内某知名汽车公司创始人聊，我问他：“你的公司走了好多人，最艰难的时候外面都传你要破产，你怎么留人？”他说留不住，是后面新加入的人一起把事做下去的。</strong></p>\n  <p><strong>很多时候，企业要做的是坚持做正确的事，持续为留下来的人负责，同时让新加入的人快速发挥价值。我们不会主动让人离开，但有些人干得时间长，“血条”没了，确实很难留。</strong></p>\n  <p>因此对我来说，精力不应消耗在因人员离开而产生的伤心、流泪和抱怨的情绪上，而是要思考如何快速把云鲸推向一个新的高度。</p>\n  <p>云鲸在逐渐形成自己独有的文化。组织改革这件事，让我感到踏实的是，新加入的人才能力和状态都很好。如何让新团队有好的土壤去全力以赴，把以前没做好的事情真正做好，这是我需要调整心态去做的事。</p>\n  <p><strong>硬氪：期间有没有过心态特别糟糕的时候？大概多久调整过来的？</strong></p>\n  <p><strong>张峻彬：</strong>太多了。最近半年就是。</p>\n  <p>今年在开“盲盒”、做了几个关键决策。对我来说，组织变动、降本增效、所有这些动作——做完之后结果是什么，一开始都是不确定的。在结果还没有完全显现之前，难免会焦虑。但随着这些调整逐步落地，效果慢慢出来，焦虑就缓解了。</p>\n  <p>对我心态影响最大的是，当做了这么多重大决策后，企业是不是变好了？如果做了这么多事情，结果比以前更差，那我肯定焦虑。但从结果来看，目前做得还不错。</p>\n  <p><strong>硬氪：新人进入组织需要时间适应，不同打法容易造成内部理解上的偏差。这种认知错位要怎么对齐，才能让大家往一个方向使劲？</strong></p>\n  <p><strong>张峻彬：</strong>本质是从战略到执行颗粒度拆解，而且还要克服一些组织惯性。</p>\n  <p>执行层会觉得，本来要投200万，现在只给投100万，还要达到150万的效果？这个过程肯定会有不理解。</p>\n  <p>我的体感是，认知错位不能指望一次性对齐，它本质是信息层级和考核压力不同造成的。</p>\n  <p>对齐的方式前面提到了几个方面，一是目标拉齐，把为什么“从200万降到100万”背后的经营逻辑和可实现路径讲透。</p>\n  <p>二是机制验证，用阶段性结果说话，跑一两个月数据出来，比任何辩论都有说服力。</p>\n  <p>最后就回归价值观本身，如果你把逻辑讲透了，数据也验证了，对方依旧不认为这是对的，没办法坐下来理性讨论一件事，对用户、对云鲸品牌的价值，还停留在“我就要花大钱”的状态，这就不是认知错位，而是立场问题，在我眼里可能就不是同路人。</p>\n  <p>你没办法让所有人开心。做创始人、做CEO，切忌想让所有人开心，最后不开心的只有你自己和这家公司。很多时候，对齐不是求同，而是选择同路人。</p>\n  <p><strong>硬氪：那你对人性的认识会发生变化吗？</strong></p>\n  <p><strong>张峻彬：</strong>（沉默）我觉得两句话，<strong>百善孝为先，论心不论迹，万恶淫为首，论迹不论心。&nbsp;</strong></p>\n  <p>我以前对一些动作的容忍度太高了。现在我的判断逻辑是：一旦出现突破红线的错误行为，就一定要有大动作。因为按照“论迹不论心”的原则——动作本身就是答案，不需要再去追问发心。这类动作一旦发生，就意味着这个人已经不适合继续留在这个岗位上。但以前，我可能会对这些动作的容忍度偏高，就那么过去了。</p>\n  <p><strong>我现在对人的敏感度，或者说对负面信号的感知力会很高。原因在于，这些东西对组织和业务的杀伤力太大了。</strong></p>\n  <p>但回到对优秀伙伴的态度上，我对人性中好的一面的体察依然在，并不会因为这些事就把善的一面完全否定。只是说，对于恶的那一面，处理的手段和认知，跟以前不太一样了。</p>\n  <p><strong>硬氪：有没有办法，通过一个成熟的组织结构把所有的木板相对拉齐，但在这个过程中能保留人性中nice的部分？</strong></p>\n  <p><strong>张峻彬：</strong>我肯定有nice的部分，不是说现在就是恶魔嘛（笑）。只是说你以前可能看到一个东西确实做得比较差，言语上可能就说“OK吧？”甚至以前内部流传过一句话，“当彬哥说‘还行’的时候”，往往你的事情都做得很糟糕了。”这本质是一种无原则的宽容。但现在我发现，就算严格一点，大家也不会觉得有什么问题。当然也不是随便就要发火，严格不等于情绪化。</p>\n  <h2><strong>「寻找硬币」</strong></h2>\n  <p><strong>硬氪：你希望用户怎么理解，“云鲸是一家什么样的公司”？</strong></p>\n  <p><strong>张峻彬：</strong>云鲸等于好产品。我们的定位是全球AI智能清洁专家，以家庭为单位做产品创新。在海外的打法与节奏上，我们和其他家不太一样。</p>\n  <p>去年年底，团队内部对齐了品牌的几个关键战略价值：注重产品创新，注重机器与人、与空间之间的人文交互，通过智能产品真正帮助用户解放双手，探索更有价值的事。当定位清晰后，对外的步调也就一致了。</p>\n  <p>最近，我们新发布的海外高端线产品，在北美区首发当日即登顶区域市场新品榜第一。这个成绩，反过来佐证了我们终于把“云鲸是谁”的定位梳理清楚了，也懂得如何通过用户听得懂的方式，把这件事讲明白——而不是花了大价钱，用户却始终搞不懂云鲸是谁、为什么要买。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_c66f0f06a80e480db1526ae70181a7c5@6022551_oswg72172oswg1080oswg802_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸逍遥003（图源/企业）</p>\n  <p><strong>硬氪：怎么理解用户？</strong></p>\n  <p><strong>张峻彬：</strong>我们花了很多时间在用户调研上。</p>\n  <p>2025年底，团队在国内做了5000多份用户深度调研，其中600多个用户是打电话沟通，每个用户聊了三四十分钟。我们很惊喜地发现，这么多年过去了，用户仍然认为云鲸是一个创新的品牌，拖地技术最好、死磕设计和美学、产品发布的节奏和命名上最有规矩。</p>\n  <p>用户真正需要的东西其实并不多，而且很朴素。有时候一直宣传“用户至上”，但跟用户都不对话，怎么用户至上？这也是我们现在内部所传达的：想不清楚的问题，就直接去跟用户交流，少一些内部臆断。</p>\n  <p><strong>硬氪：云鲸现在的产品策略有调整么？低端市场你们打算怎么做？</strong></p>\n  <p><strong>张峻彬：我们内部统计过，在产品结构中，云鲸中高端机型的销量占比达到90%，其他几家友商的中高端占比大概是60%～70%。</strong></p>\n  <p><strong>我们希望在中高端市场深耕产品力，把用户体验做到极致。但这不代表我们只做中高端产品，云鲸在高中低都有布局。</strong>超低端不在我们的选择范围内，但入门级低端市场肯定要做，从全球视角来看，这块市场至今还没被真正有效地覆盖。</p>\n  <p>做低端产品的关键不在于把产品做便宜，而在于做减法——砍掉什么、保留什么，是价值取舍中最难的一环。</p>\n  <p>入门级产品的用户，同样理应享受到基础的核心功能。这个价格带的市场空间非常大，在行业中占据40%～50%的出货量份额，却长期缺乏真正有诚意的产品供给。这也是云鲸下半年重点发力的方向，会发布一款新品。虽然不会作为主力产品来推广，但要让这个价格带的用户，在同价位里获得最好的体验。</p>\n  <p><strong>硬氪：怎么判断海外市场的基本盘？</strong></p>\n  <p><strong>张峻彬：</strong>海外市场空间巨大。云鲸最近新加入一位资深的DTC负责人。我问他：“空间大吗？”他说：“太大了，很多东西都还没做。”我们一个团队已经做了一年的结果，在专业人士看来还处在起步阶段。</p>\n  <p>有两组数据可以说明问题。第一，海外存在大量iRobot留下的单集尘扫地机存量市场。今年3月我们内部做的欧洲用户调研显示，32%的用户是从老机型升级到云鲸的，原因是老款在拖地、扫地和避障方面表现不足。第二，欧美市场线上成交的扫地机，五到六成的价格都在500美元以内，云鲸几乎还未涉足。</p>\n  <p>去年我们完成了全球8座城市深度沟通后也发现，渠道和用户普遍更欣赏一个品牌聚焦于单一品类、把产品做深做细，而不是盲目追求规模。</p>\n  <p>云鲸现阶段的重心仍然是做好产品。每次发布会或渠道交流都有人问，其他家都做了庭院、割草、泳池，你们什么时候做？我们不排除未来进入这些领域的可能性，但现在8厘米的地面还有很多东西没解决。</p>\n  <p>今天谁把极致边角清洁解决了？谁把桌子腿绕明白了？都没有。中间还有太多体验问题。</p>\n  <p><strong>硬氪：你在招人的时候会筛选价值观一致的候选人，面向市场时，是不是也属于一个筛选用户的过程？</strong></p>\n  <p><strong>张峻彬：</strong>会，但绝大多数用户没想象的那么复杂。</p>\n  <p>我上次跟一家知名高端家电品牌的创始人聊了很久，他说，“峻彬，你这营销能力有点弱。”（笑）他给我分享了个故事。早年他们推出了洗衣机直驱技术，成本还上升100块钱，产品怎么都卖不好。后来他想了一个方案，把一枚硬币立在运行的洗衣机上。</p>\n  <p>皮带传动的洗衣机震动大，硬币立不住；但他们的直驱洗衣机震动极小，硬币稳稳立在上面。就是这枚硬币，让他们洗衣机的销量暴增。<strong>他问我：“你的硬币，找到了吗？”</strong></p>\n  <p><strong>硬氪：你觉得找到了吗？</strong></p>\n  <p><strong>张峻彬：</strong>接近了。至少我们在尝试，而且已经看到一些比较可验证的效果。</p>\n  <p>很多人可能没有真正用心去找这枚“硬币”。找不到的核心原因，还是对用户的理解不够深。功能做了那么多，哪些才是用户真正在意的痛点？另外表达方式也很关键。如果讲得不够直接，再好的技术也传不出去。比如你跟用户说“拆开机器看，我们的技术更好”，他根本听不懂。</p>\n  <p>你会发现，有些公司技术看着很强，宣传声势也大，最后却卖得一塌糊涂。问题往往不在产品体验本身，而在于传播链路失效了。</p>\n  <p>所以关键是要找到那枚硬币，每个SKU、每个品类都需要自己的那枚硬币。我们跟用户交流后发现，全球用户心智里，大家提到云鲸，第一反应就是“拖地特别好”。那就应该把这个认知锚点放大——怎么证明你拖得更好？这正是需要努力去构建的，那枚硬币，就是让用户相信你拖地更好的那一下。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_f503a9ada2a545668a5a1bb61a6ee2b1@6022551_oswg94987oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸多SKU矩阵（图源/企业）</p>\n  <h2><strong>把“AI智能清洁”心智打透</strong></h2>\n  <p><strong>硬氪：有一种观点认为，真正值得敬畏的企业不是看规模收入，而是看它有没有在做有“复利”的事。很多公司品类切换太快，根本没有复利——做一个品四年、第五年又从头再来。十年里，云鲸做的哪些事是有复利的？</strong></p>\n  <p><strong>张峻彬：</strong>我理解的复利，就像持续给小树苗浇水，它会不断生长，而不是每次等花开尽了、凋谢了，再一切从头再来。</p>\n  <p>品牌是百分之百有复利的。云鲸真正进入市场销售已经六年。我们北美高端新品拿第一，保持榜首一个多月，就是品牌复利的兑现。</p>\n  <p>其次是渠道有复利。当渠道全球化做得足够深、广，新产品进入新渠道、新市场，你不仅拥有谈判话语权，更能以更快的节奏进退。</p>\n  <p>第三是技术复利。扫地机这个品类，传统家电巨头很难轻易进入，因为技术还在复利期，持续投入会形成正向积累。有的公司投了一两年见不到成效，就开了团队，又招新团队从头再来。云鲸不会这样，我们持续的研发投入是长期且持续的。</p>\n  <p><strong>硬氪：怎么判断云鲸在北美销售利好是品牌驱动而不是品类驱动？如何让用户从品类决策变成品牌决策？</strong></p>\n  <p><strong>张峻彬：</strong>一个品牌是在不断成长的，成长过程中能容纳更多品类心智。最开始，云鲸代表的就是扫拖一体机器人；第二阶段是家庭智能清洁公司；第三阶段可能达到新的高度，比如具身智能。</p>\n  <p>用户本质上遵循品类决策逻辑，买空调先想到格力、美的。但如果品牌足够强，比如苹果出了空调，用户一定会关注，不是因为觉得它功能性做得好，而是相信苹果总能推出跨时代的产品。</p>\n  <p>随着品牌成长，一定会经历从功能认同、到行业差异、再到情感忠诚的过程。云鲸目前处于构建行业差异化的阶段。我们希望把“AI智能清洁”的心智让用户记住。未来如果具身发展，云鲸真能把一个智能保姆机器人做出来，品牌心智又会实现一次突进。</p>\n  <p>但如果你急于求成，在品牌还不能容纳那么多品类的时候疯狂填品类，会遭到反噬。原有心智被稀释，新品类也立不住。</p>\n  <p><strong>硬氪：企业能不能走得越来越好，一定是在“做自己”这件事上非常坚定。有些公司会不得不“做别人”。</strong></p>\n  <p><strong>张峻彬：</strong>云鲸最难的地方，恰恰是因为我们在走自己的路。你让我们找一个对标、去复制，反而是容易的，但那样走不远。内部battle最多的也正是这个问题，人家参数达到几千帕了，你要不要跟？热水做到100°C了，你对不对齐？</p>\n  <p>你对自己东西越清晰，就越不容易被外界带偏。我觉得做事最终还是回归到自洽。</p>\n  <p><strong>硬氪：哪些你们绝对不会跟，哪些可能会跟？</strong></p>\n  <p><strong>张峻彬：</strong>对用户确实完全没有价值的东西不会跟。</p>\n  <p>我们画四个象限。纵坐标是用户价值，横坐标是显性卖点。</p>\n  <p><strong>既具备用户价值又具备显性卖点，我们一定会跟进；有用户价值但非显性卖点，我们也会做——这也是云鲸目前投入最多的；两者皆无的，我们自然不会做。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_eeed6e4e4c6d49d791de0a8b1d9980f1@6022551_oswg42153oswg1080oswg805_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">张峻彬对话中提及的四个象限（图源/硬氪拍摄）</p>\n  <p>过去我们投入最多的，其实是左上角（即用户价值高，显性卖点低）的那个。外界会觉得云鲸怎么没有跟进？但其实一、二我们都做得还可以。</p>\n  <p>当然，云鲸的研发和产品开发体系并不以显性或隐性来评判，我们更多还是以用户价值为指标。</p>\n  <p><strong>硬氪：有没有过回头觉得“当时做一做也可以”的功能？</strong></p>\n  <p><strong>张峻彬：</strong>基本不会。没做是当下觉得技术没完全ready。</p>\n  <p>具备用户价值又有显性卖点的功能云鲸都会做，可能会晚一点，但是因为内部要优化到最好状态再出。</p>\n  <p>比如抹布外扩，这是显性卖点，也有用户价值。我们的方案晚了半年上市，但效果比行业方案更好，所以当时上新期和大促期间销售表现很不错。很多外扩方案向下的地面压力不足，清洁力不够；而云鲸的方案外扩后，依然保持很强的清洁力。</p>\n  <p>再比如中滚刷毛发缠绕问题。早期友商多用剪刀手方案，我们后来推出了单旋臂方案，一上市就成了爆品。</p>\n  <p><strong>硬氪：云鲸之前提到过在具身智能方面有规划，目前项目什么状态？</strong></p>\n  <p><strong>张峻彬：</strong>具身智能的项目我们一直在探索，把它作为新产品形态来推进，目标是产品化，而不是为了估值。</p>\n  <p>具体来说，我们有一支专门的团队在做空间收纳和空间清洁。目前，像清洁马桶、立面瓷砖这类立体表面，我们已经做得还不错了。对于多种物体的抓取和收纳，也有了不错的进展。同时，我们也在自研核心零部件。</p>\n  <p>不过，说实在的，要真正商业化，还需要一些时间。也许两年后，会有一款带机械臂的产品，能够解决扫地机解决不了的事情，真正进入家庭。</p>\n  <p>当然，对云鲸来说，当前最重要的是聚焦“AI智能清洁专家”这一品牌心智，把产品布局做深、打透。具身智能是未来，但眼下的每一步都要走扎实。</p>\n  <p><strong>硬氪：打透的关键要素是什么？</strong></p>\n  <p><strong>张峻彬：</strong>产品。之前的吸尘器新品，几乎所有体验过的用户都给出了正向反馈。但我们也有短板，我们在“叙事”的穿透力上还没有集中炮火。</p>\n  <p>云鲸今年更改了Slogan，“畅享自由洁净的家”。这是我去年年底在日本时，每天跟团队远程沟通，微信上敲定的。以前我们叫“自由自在，有所热爱”，也是个很好的Slogan。</p>\n  <p><strong>硬氪：为什么换掉了？</strong></p>\n  <p><strong>张峻彬：</strong>因为在全球化过程中，我发现品牌需要极度聚焦，产品需要硬币，品牌传播也需要找到自己的那枚“硬币”。</p>\n  <p>“自由自在，有所热爱”无法让用户快速认知：云鲸到底是做什么的？耐克也可以用这个Slogan，所有品类都可以。</p>\n  <p>当公司规模还没到几百亿收入时，Slogan模糊化会带来认知成本过高的问题。它作为重要的媒介传递内容，几乎出现在所有地方：说明书、详情页、包装、甚至机器上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260526/v2_01304240688d4a67991cfa9557a9ab53@6022551_oswg78860oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云鲸企业发展历程品牌墙（图源/企业）</p>\n  <p>耐克最早的定位是“为专业跑者打造性能最优越的跑鞋”，非常直接，不是一开始就“Just Do It”。所有大型企业的Slogan都有其演进的路径，它的改变某种意义上体现了一个品牌的成长轨迹。</p>\n  <p>品牌到了成熟阶段，理性和感性是二元共生的，螺旋式交替上升。如果只有理性，产品就变成了冷冰冰的技术，用户缺乏情感连接；如果只有感性，品牌就变成了空洞的情怀，用户缺乏信任基础。</p>\n  <p>现阶段，我们把品牌定位最终收敛到“全球AI智能清洁专家”，让用户看到就知道云鲸是做清洁的专家，能提供更好的产品体验。但这不是终点。等品牌更成熟后，Slogan会逐步加入更多感性的元素，承载更广泛的心智，这是一步一步来的事。</p>\n  <h2><strong>讲好自己的故事</strong></h2>\n  <p><strong>硬氪：估值会是云鲸压力吗？之前公司确实拿了不少融资，你也提到会继续推进上市。市场上估值传闻从300多亿掉到100多亿，落差挺大的。</strong></p>\n  <p><strong>张峻彬：</strong>这方面还好。我们对估值并不纠结。现在估值本身也是动态的。当年300亿的估值确实偏高，那时候一级市场非常热，给了很多企业超出合理区间的估值。</p>\n  <p>资本寒冬一来，大部分公司回归到相对理性的估值水位，这不是云鲸一家的问题，而是全行业发生。很多公司连估值都降不下来，那才是真正的压力。</p>\n  <p>估值是浮动的，最终还是要看上市之后、以及未来一两年能交出什么样的成绩单。</p>\n  <p>云鲸现在的估值只是当下的一个截面，不代表未来。眼下更重要的是把经营做好、产品做好，把公司推向更好的规模和经营状态，而不是纠结估值本身。股东没有给我压力，反而让我能更专注地去关注那些长期、可持续的事情。</p>\n  <p>对我来说，IPO不是终点，是一个新的起点。我们在内部把它看作“二次创业”——希望到那一天，我们的组织、人才、业务，都已经准备好了。</p>\n  <p><strong>硬氪：云鲸最能体现你个人特点的方面有哪些？</strong></p>\n  <p><strong>张峻彬：</strong>大家对产品的执着。很多人来云鲸之后会说，你们对产品的要求太高了。因为我对产品要求高，所以整个团队对产品的要求也高。</p>\n  <p>我们认为，产品是所有事情中的那个“1”，后面所有的“0”都依附于此。这个认知从上到下是对齐的，也是云鲸这么多年来能够持续做出创新、并且这些创新功能被行业和用户接受的根本原因。</p>\n  <p>同时云鲸非常克制。有些公司会同时开几十条预研方向，但我们不会。认准一件事，就把它打磨到极致，这也是前面提到的复利表现，一次能把问题解决得更彻底。这是另一个特点。</p>\n  <p><strong>每个创始人的精神世界，很大程度上决定了这家企业的底层逻辑和选择边界。</strong></p>\n  <p><strong>硬氪：十年当中有没有某个时刻让你觉得，正是因为你的个人色彩反而桎梏了公司前进？</strong></p>\n  <p><strong>张峻彬：</strong>太多了……（停顿）。我是一个很nice的人，其实在商业决策中往往感性有余、理性不足，所以在用人、识人方面出现过问题。<strong>这个问题在2021年云鲸从200人扩张到1000人、搬到深圳的那一刻，就已经注定了，这个劫数必须自己去渡。</strong></p>\n  <p>快速扩张过程中，引入了一批不一定适合云鲸的高管。根源在于我当时对高管的选择缺乏成熟的判断力，同时在高管的管理上也暴露了很大问题。我这个人经常被说“不够狠”。</p>\n  <p>现在回过头看，正是这些交错的学费，让我开始真正审视自己的管理价值观。</p>\n  <p><strong>硬氪：“狠人”是什么样的？不那么狠的人又是什么样的？</strong></p>\n  <p><strong>张峻彬：</strong>“狠人”决策会更干脆、手起刀落。<strong>不那么狠的人会想，大家开不开心？会不会介意？有些事情明明知道是错的，但还是放任它发展。这是我性格中对我伤害最大的一个地方。</strong></p>\n  <p><strong>硬氪：“不够狠”的这部分是被隐藏起来，还是你已经剥离了？</strong></p>\n  <p><strong>张峻彬：隐藏和剥离是两码事。我觉得剥离了一大部分，剩下的一小部分隐藏起来。人格的底层剥离需要时间。 &nbsp;</strong></p>\n  <p><strong>硬氪：未剥离的小部分有可能在未来影响你的决策么？</strong></p>\n  <p><strong>张峻彬：</strong>不太会了。我现在的容忍窗口比以前窄了很多。或者说，我对结果呈现速度的耐心阈值比以前低了很多。</p>\n  <p>我需要快速看到结果，而且会深入到细节里去验证是否真的做到位了。如果细节做到位了、没结果，那我认，说明这件事本身难度超出了预期。但如果细节都没做好、也没结果，那就是执行出了问题。</p>\n  <p>以前我会更多考虑大家的感受。对结果的容忍度比较高。一个人也许不合适这个岗位，做到了六七十分，我就接受了。现在对不起，我接受不了。</p>\n  <p>举一个例子，我对汇报质量的要求比过去高出很多。因为汇报质量本身，就是一个人思考深度的外化。</p>\n  <p><strong>硬氪：那你更喜欢以前的自己，还是现在的自己？</strong></p>\n  <p><strong>张峻彬：</strong>我后来意识到一个问题，过于宽容的管理者，反而会让团队失去成长的空间。你什么都觉得好，大家就没办法对自己提高要求。</p>\n  <p>有些人做得特别好，有些人做得没那么好。做得特别好的人，本身自驱力就强，不需要你说也能做好；但当他们看到那些做得没那么好的人，从未被指出过问题，而你觉得无所谓，这对优秀的人本身是一种伤害。做得没那么好的人，自己没有要求，也得不到真实反馈，自然没法成长；他们不知道自己犯的是非常低级的错误，因为犯错之后发现你也能接受。<strong>这是害了大家，也害了公司。</strong></p>\n  <p>一家公司长板极长，短板极短，是有问题的。木桶效应就一定会漏水。</p>\n  <p><strong>硬氪：领导大概有几种类型，乔布斯、马斯克是一种，微软的纳德拉和库克又是另一种。你感觉你以前偏哪一种？现在是哪一种，或者说希望自己成为哪一种？</strong></p>\n  <p><strong>张峻彬：</strong>我以前可能更偏向于“老好人”式的管理者。太在意团队感受，不愿意直面冲突。本质上是一种被动的宽容。</p>\n  <p>未来，我希望能成为一个相对稳重、不那么急躁的人。<strong>理性、平和，但底线清晰，</strong>用这个状态去管理这家公司。那种非常激进、豪赌的性格，好像不太适合我。</p>\n  <p><strong>硬氪：我们之前也采访过一些企业，到了后期会引入职业经理人，给创始人一笔钱套现离场，你考虑过这个选项吗？</strong></p>\n  <p><strong>张峻彬：</strong>套现这件事，核心要回答一个问题：做了这个动作以后，你接下来要去做什么？</p>\n  <p>云鲸对我来说，就像是自己的孩子。套现其实就是把孩子卖了，对吧。如果你觉得这个孩子未来还有很大的成长空间，那继续陪伴他长大，本身就是很开心的事。</p>\n  <p>每个创始人都有自己的心理安全线，底线不同。当我已经跨过那条安全线之后，真正需要思考的是：我到底想用余生做什么？</p>\n  <p>如果能够把云鲸做成一个世界级的品牌，也是蛮有意思的事情。有些人欲望很大。可能需要卖掉公司，才能满足。有些人可能觉得做好这家企业更有成就感。</p>\n  <p>人活着，总归要做点事情。</p>\n  <p><strong>硬氪：今天的商业环境里，会不会有时候“激烈”一点反而更突出，能撬动更大的资源？</strong></p>\n  <p><strong>张峻彬：</strong>理性不是不赌，而是要赌得非常准。所有的豪赌都取决于你看到了绝对的商业机会。</p>\n  <p>我说的理性、平和，是能合理地评估风险，“不理性”是根本不评估风险就去做All in。这不代表我们不做All in，而是可能对风险的判断和预测会做得更充分、更理性，再选择All in。</p>\n  <p>时机很重要。</p>\n  <p><strong>硬氪：在清洁这件事上，未来5到10年，你有没有看到非常清晰的时机？</strong></p>\n  <p><strong>张峻彬：</strong>有。渗透率拐点来临的那一刻，就是你该豪赌的那一刻。</p>\n  <p><strong>硬氪：为什么这么多年过去后，它还没到来？</strong></p>\n  <p><strong>张峻彬：</strong>首先是产品体验确实还有差距。云鲸做到好评率全国第一，是从42万条评论中选出来的，但我还是经常会批评负责质量生产的员工。这恰恰折射出行业整体的成熟度还远未达标。扫地机非常复杂，相比较于普通家电，扫地机有几十个电机，一个坏了整机就出问题。这本质上是产品复杂度和可靠性之间的矛盾。</p>\n  <p>我相信总有一天扫地机能做到三四年不坏、持续工作，同时成本下降、智能化水平提升，这就是拐点到来的时刻。所有家电都会经历这个阶段；比如云鲸发明了上下水、自动洗抹布，当用户普遍接受这类功能的时候，渗透率就会陡升。</p>\n  <p>关键要回答一个根本问题，地面清洁未来是不是人该做的事情？如果不是，那拐点必然会来。</p>\n  <p>事实上，变化已经在发生。去年腾讯投我们时做了一万人的调研，五年前也做过同样的。数据显示，复购比例从五年前的六七成提升到了现在的近九成。随着产品体验的提升，很多人已经把扫地机当成了必需品。</p>\n  <p>但还有大量用户被早期劣质产品伤害过，他们天然认为这个品类就是玩具。那些产品不仅伤了自家品牌，也透支了整个行业的信任，这需要时间来修复。</p>\n  <p>目前真正满足用户需求的产品客单价还比较高，市场尚未真正打开。此外，激烈的市场竞争中，很多公司添加了大量对用户无价值的功能，反而增加了质量问题和复杂度。所以，接下来关键是如何让更多用户竖起大拇指，提升NPS、拉动口碑。</p>\n  <p>拐点总会来，但在那之前，云鲸要讲好自己的故事。</p>", "category": "tech", "published_at": "2026-05-26T01:30:13+00:00", "fetched_at": "2026-05-26T02:46:53.955391+00:00", "fingerprint": "99d115a10202e6ce"}, {"source": "36氪 - 最新文章", "title": "营销内容从“用AI”到“管AI”的10倍提效| 2026AI Partner·北京亦庄AI+产业大会", "url": "https://36kr.com/p/3824179485233541?f=rss", "summary": "<blockquote>\n   <p>从2022年首创数字人直播带货，到如今服务LVMH、欧莱雅、宝洁等全球集团，集思科技在三年间积累了超60亿GMV的实战成绩。</p>\n  </blockquote>\n  <p>2023年被称作Agent元年，但2026年才是营销内容Agent真正落地应用的节点，而品牌最核心的资产不是视觉，是上下文——把创始人对品牌的理解沉淀为AI可调用的智力资产。</p>\n  <p>以下为演讲内容，经36氪整理编辑：</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260525/v2_4e132bf1bc1f49d6b388fc9ecab07c69@6381723_oswg78593oswg1280oswg853_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">李世尊丨集思科技CEO</p>\n  <p>大家好，我是集思科技李世尊。简单介绍一下集思科技，以及我们在营销领域做的事——通过从用AI到管AI，实现十倍提效。</p>\n  <p>集思科技一直专注于AI销售，可以理解为做AI Sales，用Agent的方式帮助B端客户，尤其是品牌零售业的客户去面对他们的消费者。我们率先发明了数字人直播带货，2022年2月28日，三八女人节的第一天，在京东平台首发了38个美妆数字人直播间，当时叫“京小美空降美妆大牌直播间”。到现在，帮助客户累计实现了超过60亿的GMV，短短三年多时间内，服务C端消费者超过三千万次。我们在这个行业里发布了非常多先进的功能和能力，现在很多数字人已经不需要真人出镜，完全用AI捏出来，纯AI生成的数字IP。后面我会用大型品牌的实际案例来具体讲解。</p>\n  <p>我们是一家 to B to C 的公司，今天是产业大会，在座有很多零售行业潜在的合作伙伴。我们有能力帮助你们去面对你们的C端消费者，在官网、渠道都可以，全渠道帮助品牌做这件事。京东是第一家，我们是京卓越的合作伙伴；淘宝是淘拍档的合作伙伴；Shopee是首批，我们在2024年11月份和Shopee官方一起在台湾率先发布了第一个官方的数字人直播间，服务当时的欧莱雅。我们已经是很多全球领先零售型集团的生成式AI服务商，比如LVMH，我们很长时间是他们全球唯一的生成式AI服务商，目前仍然是唯二的两家。像雅诗兰黛、欧莱雅、宝洁，我们是他们北亚地区的服务商；雀巢、Diageo等，我们是他们全球生成式AI的服务商。我们把中国的技术和场景理解带到全球产业里，服务品类非常多，涉及美妆、服饰、奢品、母婴、个护、食品 、家电及数码。</p>\n  <p>媒体报道，去年年中开始出海，东南亚将近100个客户，花了不到半年时间，增速非常快。我们带给他们的不单是AI技术，而是通过AI把国内所有的know-how理解并AI化，变成AI化产品带到东南亚，让他们的直播带货水平或销售水平从原来真人只能做到五六十分，直接变成八十分的水平。</p>\n  <p>接下来是我们为品牌做的AIGC案例。</p>\n  <p>大家理解的AIGC，就是AI生成的内容，AIGC用在哪些地方？今天主要聚焦在营销内容，由数字员工主要产出这类内容。内容模态无非是文字、图片、视频、直播，直播还带着交互。大家关注的是产出这些东西时视觉IP的一致性怎么样，用途包括TVC、千川投放物料、品宣视频，大型品牌已经开始用AI做明星的广告代言了。</p>\n  <p>我们做的���外品牌demo。这是北美非常流行的巴拿马风，我们为它做了TVC。所有案例分享在右边的破折号后面都有模态、内容用途。视频TVC，现在已经签约了二三十条，未来三个月内就要服务他们在TK上的所有投放，包括线下屏幕，尤其在佛罗里达，有特别大的线下投放。这是商品主图视频，人物IP，这个女孩叫koko，获得了亦庄政府颁发的第二张数字人身份证，即将拿到中国第一个数字钱包，作为Agent拿到数字钱包。</p>\n  <p>koko拿到了亦庄颁发的身份证，也是工信部唯二认可的数字人。未来中国所有的数字人背后都会有一个ID，来管控你的内容，我们的koko是有身世的。</p>\n  <p>有些朋友关注到，五六年前Facebook改名Meta，也就是元宇宙。那时候造出了非常多基于计算机动画生成的IP，比如柳夜熙这样的，需要大量的故事线来扶持出一个IP。但在AIGC的支持下，这个短片里，如果我不告诉大家这是捏出来的人，大家会认为这是真人。现在技术的发展，造就了IP的无限可能性，不需要非常多的包装。本质上人类是非常高级的动物，可以对同种族一见钟情，但对米老鼠我得看30集才能喜欢上这个角色，那是故事线包装出的人格。现在技术造就了无限的IP可能。品牌端打造这些IP，可以作为KOC或者influencer。</p>\n  <p>koko在现场是不存在的，领导“吕局”是现实存在的，跟koko一起生成了虚实结合的短视频。koko也做了线下活动的展示，我们还成为经开区首位数字普法宣传员，前几天在区内进行普法宣传。</p>\n  <p>koko可以覆盖多种模态，可以做图，IP保持一致还可以做视频，还可以做直播。本质上，每一个品牌最好的销售、最好的宣传员就是创始人本人。创始人拥有企业的所有上下文，把上下文沉淀了，视觉也沉淀了，来打造一个立体的人物，还可以做所有实时交互。我们用koko这个AI IP，为我们的客户做了展示可能性的短片，这些短片可以实时直播，跟现在做的数字人是一样的。</p>\n  <p>这是给另一个国外品牌做的数字人IP，我很难看出是一个假人，这些衣服、鞋都是真实存在的。我们欧洲的客户很喜欢这样的概念，不单是概念，确实有营销流量。我觉得不需要有一个人飞到希腊去拍这个短片，同时也不需要浪费这双鞋，AIGC可以做到这个事情。</p>\n  <p>Castar是我们主做视频的产品。这是一个视频品宣明星IP，这个明星叫慈世平，跟中国的姚明是原来火箭队的队友，后来也是科比的队友。他的公司叫作37 Partners，我们集思科技也是股东之一，一起展开了非常多合作。</p>\n  <p>我们也帮助他用他的IP在菲律宾做了一场直播，可以说是AI明星的首秀。联合了安踏、李宁、361度、VIVO、三星，当天直播间冲到了全国榜的第二名。</p>\n  <p>AI直播是我们的第一条曲线。直播业务，刚开始做就选了一个最难的，要交互，要多模态，讲什么内容、什么时间讲什么。我们现在服务七百多家客户，一千多个直播间。这是我们跟Burberry在天猫、京东上做的。</p>\n  <p>各种语言，当地方言都完全没有问题，正式语言、大类语言也都没有问题。这是我们给欧莱雅集团做的行业落地典范，2022年4月份服务他第一个品牌，到现在他全网所有品牌都由集思科技全面提供AI直播服务，已经做了第四个年头。我们能做明星，也可以做签约投放。在座很多创始人都知道投放是非常大的预算，让自己投放数据的KOL去做符合心仪的内容，经常要调很多版。对KOL来说也是很大的负担，比如要求这个红人去冰岛拍片子，时间成本、经济成本都非常大。现在完全可以制作一个自己的分身，去任何想去的地方，穿各种想穿的衣服，一切皆有可能。</p>\n  <p>除了人，也可以做吉祥物，给亦庄的小亦也做了IP。很多品牌有自己的吉祥物，小狐狸，我们就做了她跟吉祥物的互动，包括波司登跟小熊，也是跟吉祥物的互动，虚实结合。</p>\n  <p>这些案例在过去的时间里，除了AI直播，很多视频都是用AI的方式去捏，人加工具，最后等于大家看到的结果。我们从今年年初开始到现在，尝试用管AI的方式，把它变成我给它输入一个命令，它就能把所有的环节走完，反复执行，达到满意的效果。2023年大家就提Agent元年，今年才是营销内容上Agent可以立马落地应用到每一个企业里。内部也喊了口号：用AI的人是不用AI的人的十倍，管AI的人是用AI的人的效率的十倍，本质上就是一百倍的区别，这是指数级增长。</p>\n  <p>创始人是一个企业里最能够卖东西的，并不是因为他非常努力、能熬夜、非常拼，屁股坐在那个位置，而是说他懂品牌里的上下文，我们认为这是最重要的。不单是视觉IP一致性，更是品牌IP一致性。这个IP是你的数字资产、智力资产，智力资产有没有沉淀到你的平台里，是沉淀在飞书上还是钉钉上，还是沉淀在本地管理里？我们希望帮助品牌、零售型企业做到沉淀上下文，尤其是面对C端消费者，持续累计相关信息，持续更新、持续维护。</p>\n  <p>大家可能都忽视了企业的上下文。来了一个新员工，如果不做培训，不做前一个月的讲解，他很难理解企业在做什么，很难快速上手。我们内部也把上下文这件事放到第一高的优先级，通过软件服务客户的时候，也帮他们把上下文整理得更加简洁、没有冲突。这是今年最大的任务。视觉任何一个团队都能做得相对不错了，上下文是非常核心的地方，我们认为AI等于结果最核心的问题就是上下文。</p>\n  <p>集思科技以用户为核心，持续为零售品牌交付结果。这是我的微信，大家也可以加微信，多多探讨。</p>\n  <p>谢谢大家！</p>", "category": "tech", "published_at": "2026-05-26T02:44:02+00:00", "fetched_at": "2026-05-26T02:46:53.955378+00:00", "fingerprint": "5cae5da5bbac0107"}, {"source": "少数派", "title": "五年陪伴依然不舍，DIY 换壳后让罗技 MX Master 3 继续服役", "url": "https://sspai.com/post/109450", "summary": "一晃近2000天，我手中的罗技MXMaster3，依旧是我办公时最顺手的伙伴。当初购入它，核心原因就是手大且需要一款适配办公的鼠标——此前我用过雷蛇、赛睿的多款鼠标，并非它们不好用，而是这些鼠标多偏向 ...<a href=\"https://sspai.com/post/109450\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-25T03:23:36+00:00", "fetched_at": "2026-05-26T02:46:51.402131+00:00", "fingerprint": "db7b98072dd0bdcb"}, {"source": "少数派", "title": "被忙碌与焦虑裹挟时，学会「停下」比「开始」更重要", "url": "https://sspai.com/post/81257", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/81257\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-05-25T06:37:56+00:00", "fetched_at": "2026-05-26T02:46:51.402126+00:
