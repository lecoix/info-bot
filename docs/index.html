g>保时捷中国回应取消多门店销售授权</strong></a></p>\n  <p>近日，有媒体报道称，安徽芜湖、山东济宁、江苏淮安及广西南宁部分保时捷中心，将于6月30日终止经销业务，这意味着上述门店将失去保时捷官方独立销售授权，此事引起广泛关注。6月30日，保时捷中国向记者表示，山东济宁、江苏淮安、广西南宁兴宁保时捷中心将于6月30日终止经销业务，安徽芜湖保时捷中心将于7月31日终止销售业务，但售后仍正常运营，为车主提供符合保时捷标准的售后服务。（中新网）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875420876812547\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三只松鼠：获得政府补助2140.36万元</strong></a></p>\n  <p>36氪获悉，三只松鼠公告，公司全资子公司三只松鼠（芜湖）坚果智造有限公司于2026年6月30日收到与收益相关的政府补助资金2140.36万元，占公司最近一个会计年度经审计的归属于上市公司股东的净利润绝对值的13.78%。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875339466436611\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英国竞争监管机构拟加强监管苹果、谷歌移动平台：放宽应用“引流”限制，并推进NFC开放</strong></a></p>\n  <p>英国竞争与市场管理局（CMA）6月30日宣布，就针对苹果和谷歌移动平台的新一轮监管措施展开公开咨询。根据拟议要求，两家公司将不得限制英国应用开发者将用户引导至应用商店外的网站或其他平台完成支付、订阅或交易，以增强市场竞争、降低开发者对官方应用商店的依赖。CMA还提出，引流相关收费应遵循“公平、合理”原则，并预期相关费用将低于现有应用商店佣金水平。与此同时，CMA正就苹果iOS近场通信（NFC）功能开放的技术实现方式及收费机制征求意见，以推动移动支付等服务的竞争与创新。（界面）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875260922966023\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星电机获美国��户价值4540亿韩元AI服务器电容器合同</strong></a></p>\n  <p>三星电机公司周二宣布，已与一家美国客户签署了一份价值4540亿韩元（约合2.93亿美元）的合同，为其人工智能（AI）服务器供应多层陶瓷电容器（MLCC）。三星电机表示，该合同有效期为2027年1月至2027年12月。该公司以保密协议为由，未透露客户身份。不过，业内人士认为，该客户是美国一家大型云服务提供商 （CSP）。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875227373318151\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>BROMPTON宣布与Decathlon PULSE及黑蚁资本成为战略合作伙伴</strong></a></p>\n  <p>36氪获悉，英国折叠自行车品牌BROMPTON今日宣布，与迪卡侬旗下投资与创新部门Decathlon PULSE及风险投资机构黑蚁资本达成战略合作伙伴关系。在近期完成的一轮股份转让中，Decathlon PULSE和黑蚁资本分别入股BROMPTON，获得少量股份。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875263672938756\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>爱芯元智开发者生态沙龙举办</strong></a></p>\n  <p>6月28日，爱芯元智开发者生态沙龙在深圳举办。爱芯元智开源社区解决方案负责人唐琦表示，截至2026年6月，爱芯元智平台模型库已突破200+，覆盖LLM、VLM、多模态与垂类检测，同步入驻Hugging Face、ModelScope双大模型社区。全新Pulsar2 6.0工具链完成迭代，适配全系列芯片并优化Qwen、MiniCPM等主流端侧大模型推理。公司下一代大模型专用NPU架构性能大幅跃升，原生兼容PyTorch、Sglang、vLLM等主流框架。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3875310913450249\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“耀速科技”完成近2亿元A+轮融资</strong></a></p>\n  <p>36氪获悉，近日，“耀速科技”宣布完成近2亿元人民币A+轮融资。本轮融资由国方创投、清松资本、广发信德、东方富海、沄柏资本共同参与，老股东雅亿资本持续加码支持。本轮融资将主要用于持续推动公司“3D Bio Intelligence（3D生物智能）”平台建设，包括垂类AI模型与生物机制解析能力的进一步提升、高通量自动化实验体系的落地、多模态生物数据的持续积累，并加速虚拟细胞（Virtual Cell）与生物世界模型（Biological World Model）的构建，全面推进新一代药物研发人源化数据基础设施的形成。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875210246418689\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Kimi估值升至315亿美元，ARR突破3亿美元</strong></a></p>\n  <p>月之暗面Kimi上一轮200亿美元估值融资于近日完成交割，新一轮融资已经启动，投前估值涨至315亿美元。据接近Kimi的机构人士介绍，Kimi在本轮融资沟通中披露了其最新收入数据：6月中旬，ARR（年度经常性收入）突破3亿美元。Kimi此轮收入增长主要来自模型迭代带动的开发者使用和API收入提升。目前，API收入已占Kimi整体收入7成以上并持续走高。Kimi的收入曲线初现Anthropic早期商业化阶段的特征：开发者调用放量、API占比提升、海外付费用户增长，并由模型能力迭代带动价格体系上移。（财联社）</p>\n  <h2>新产品：</h2>\n  <p><a href=\"https://36kr.com/newsflashes/3875368322380033\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>优艾智合具身智能系列新品全球首发，3年赋能10000个工业现场</strong></a></p>\n  <p>6月29日，优艾智合机器人发布具身智能系列新品，包括全球首发可规模化应用的工业具身智能大模型“智合”（FabriX），以及工业原生人形机器人“隙锋”。同时，优艾智合宣布启动FabriX生态伙伴计划，提出“3年内赋能10000个工业现场”的目标。优艾智合基于“一脑多态”架构，将机器人广泛应用于半导体、锂电、3C、能源等工业领域，累计落地超800个项目。根据弗若斯特沙利文报告，以2024年收入计，优艾智合工业移动操作机器人全球市占率第一。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875161599546377\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>HORWIN号外全球首款400V高压超级电摩SENMENTI ONE正式交付</strong></a></p>\n  <p>HORWIN号外宣布，全球首款400V高压超级电摩SENMENTI ONE正式交付，9.98万元起售。据了解，整车超200项核心专利，搭载品牌自研车规级400V高压平台，三电与底盘高度集成；搭载16.9kWh三元锂电池，城市综合续航300km，支持汽车直流快充，充电10分钟可行驶100公里，同时支持3kW外放电；配备博世ABS及机器人架构域控；零百加速3.3秒，最高车速达200km/h。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3875351858065413\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国家航天局：我国将建立近地小行星天地协同监测体系</strong></a></p>\n  <p>今天是国际小行星日。近地小行星撞击风险是全人类共同面临的潜在威胁，国家航天局今天发布消息，我国将建立近地小行星天地协同监测体系，为防御小行星撞击提供预警监测支撑。专家介绍，近地小行星撞击是全人类共同面对的挑战。中国作为负责任的航天大国，正在论证中国小行星防御系统。要防御，必须先预警，而天地一体化监测网络就是预警的核心，我国将通过地基布局多台望远镜、天基建设星座等方式，构成昼夜无盲的监测系统。（央视新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3875138899645448\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>特朗普政府进一步施压高校，拟将联邦贷款资格与毕业生收入挂钩</strong></a></p>\n  <p>美国教育部周一表示，正在敲定新的联邦学生贷款规定，该规定将把高校参与联邦贷款计划的资格与毕业生的收入水平挂钩。这是特朗普政府向高校施压的最新举措。“根据新的学生学费与透明度体系（STATS）和收入问责规则，本科项目必须证明其毕业生的收入高于普通高中毕业生；研究生项目则必须证明其毕业生的收入高于普通学士学位持有者，”美国教育部在一份声明中表示。（新浪财经）</p>", "category": "tech", "published_at": "2026-06-30T11:56:34+00:00", "fetched_at": "2026-07-01T03:24:03.967600+00:00", "fingerprint": "34dd0486a952b42e"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨“史上最严电池安全令”正式施行；苹果大量机密文件遭泄露；OpenAI首款硬件曝光", "url": "https://36kr.com/p/3876318522077442?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>客服回应蔚来APP发生大面积闪退</li>\n   <li>字节跳动：2026年一季度80名员工因触碰红线被辞退</li>\n   <li>兆易创新提示风险：未来可能存在股价快速回落风险</li>\n   <li>董明珠：出口没做好，接下来加快改进</li>\n   <li>现货黄金价格再度跌破4000美元，距1月高点已回落近30%</li>\n   <li>优必选全尺寸超仿生机器人售价公布</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>“史上最严电池安全令”正式施行</strong></p>\n  <p>7月1日起，两项强制性国家标准《电动汽车安全要求》（GB18384-2025）和《电动汽车用动力蓄电池安全要求》（GB38031-2025）将正式实施。明确实现“一键断电”的装置为物理断电装置：电动汽车安全新国标首次将“一键断电”装置定义为物理断电装置，彻底取代以往依赖软件控制的断电方式，提升了事故救援的可靠性和时效性。同时，要求车辆在静止非充放电工况下可通过驾驶员一个动作（点触、长按）响应此功能。同时，新增整车刮底要求，技术要求为车辆在刮底后无泄漏、外壳破裂、起火或爆炸现象，且满足绝缘电阻要求。另外在热扩散测试的技术要求方面，由“着火、爆炸前5分钟提供热事件报警信号”修订为“不起火、不爆炸，烟气不对乘员造成伤害”，进一步明确了待测电池温度要求、上下电状态、观察时间、整车测试条件。新增测试项目上，新增底部撞击测试，考查电池底部受到撞击后的防护能力；新增快充循环后安全测试，300次快充循环后进行外部短路测试，要求不起火、不爆炸等。（中国经营报）</p>\n  <p><strong>苹果大量机密文件遭泄露，iPhone 18 Pro实拍图流入暗网</strong></p>\n  <p>6月29日，一个勒索软件团伙从苹果印度代工厂塔塔电子（Tata Electronics）窃取大量数据，并将部分文件上传至暗网，其中包含苹果尚未发布的iPhone 18 Pro机型核心零部件、供应商保密清单以及真机实拍照片。据知情人士透露，绝大多数供应商合作协议均为苹果高度机密，本次泄密事件不仅会损害苹果与塔塔电子的合作关系，还会让竞争对手、仿造厂商以及苹果其他合作供应商摸清各零部件的代工归属信息。这些被泄露的信息显示，部分文档完整标注了iPhone 18 Pro各类零部件对应的专属供货厂商，内容涵盖主板芯片、电池组件、摄像模组等详细参数。知情人士表示，因涉及未上市新机，文件在暗网流传令苹果十分担忧，相关的零部件供应商对应清单从未对外公开，不在苹果公示的供应商名录之中。（央视财经）</p>\n  <p><strong>OpenAI首款硬件曝光</strong></p>\n  <p>6月30日消息，万众都在期待OpenAI联手Jony Ive打造的新一代AI终端，结果官方宣布的首款硬件却出乎所有人意料：一款与客制化外设品牌Work Louder联名打造的Macro Pad可编程宏键盘。在OpenAI官方发布的视频中，展示了一个方形设备，配有多个按钮，标题为：“您最喜欢的Codex快捷方式将得到升级。”OpenAI发言人Dominik Kundel表示，这款设备将明显提升用户使用Codex的效率。（快科技）</p>\n  <h2>AI图谱</h2>\n  <p><strong>消息称Anthropic模型Fable即将解禁</strong></p>\n  <p>一位白宫高级官员透露，美国商务部预计将于当地时间6月30日晚（北京时间7月1日上午）解除对Anthropic AI模型Fable的出口管制。（Politico）</p>\n  <p><strong>OpenAI成立专项小组调查Codex额度异常消耗问题</strong></p>\n  <p>OpenAI已成立专项调查小组，针对近期大量用户反馈的Codex额度消耗异常加速问题展开紧急调查。自上周以来，多名ChatGPT付费用户报告Codex周额度在几乎没有使用的情况下出现异常快速下降，部分用户的额度在一天内从96%骤降至0%。Codex产品负责人Tibo Sottiaux承认，团队已于上周日紧急开设作战室审查系统日志，并实施了第二次全网用户硬重置。此前，OpenAI在6月27日进行的首次重置未能解决该问题。（新浪财经）</p>\n  <p><strong>Anthropic推出Claude Science AI科研工作台</strong></p>\n  <p>Anthropic于6月30日正式发布Claude Science，这是一款面向科学家的AI工作台，旨在将分散的科研工具整合至统一环境，让AI代理端到端运行分析，并由专门的审核代理检查引文和计算结果。这一举措标志着Anthropic在科研领域最深度的布局，也是其冲刺IPO前争夺付费客户的重要商业动作。（新浪财经）</p>\n  <p><strong>Kimi估值升至315亿美元</strong></p>\n  <p>月之暗面Kimi上一轮200亿美元估值融资于近日完成交割，新一轮融资已经启动，投前估值涨至315亿美元。据接近Kimi的机构人士介绍，Kimi在本轮融资沟通中披露了其最新收入数据：6月中旬，ARR（年度经常性收入）突破3亿美元。Kimi此轮收入增长主要来自模型迭代带动的开发者使用和API收入提升。目前，API收入已占Kimi整体收入7成以上并持续走高。Kimi的收入曲线初现Anthropic早期商业化阶段的特征：开发者调用放量、API占比提升、海外付费用户增长，并由模型能力迭代带动价格体系上移。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>寒武纪成为科创板首个万亿市值公司</strong></p>\n  <p>6月30日盘中，算力芯片龙头寒武纪盘中涨幅扩大至7%，成为科创板首支总市值突破1万亿个股，位居A股总市值第9位，该股年初至今累计上涨超75%。（财联社）</p>\n  <p><strong>英伟达机器人团队在京沪深招人</strong></p>\n  <p>6月29日，美国英伟达公司发文称，英伟达机器人团队围绕具身智能、仿真、部署及解决方案架构四大核心方向开放招聘，北京、上海、深圳三地均设有岗位。据英伟达公司介绍，此次招聘的具身智能团队将重点研究灵巧操作、穿戴式传感器人体建模、全身移动操作与全身控制等关键技术与应用，旨在打造下一代通用机器人系统。仿真团队则负责构建面向下一代机器人的核心仿真与训练基础设施，使机器人能在虚拟环境中高效学习，并更快速、更可靠地迁移至真实场景。部署团队聚焦人形机器人与具身智能的算法优化与真机落地，而解决方案团队则将英伟达的前沿技术导入工业、服务等实际行业应用。（央视财经）</p>\n  <p><strong>字节跳动：2026年一季度80名员工因触碰红线被辞退</strong></p>\n  <p>6月30日，字节跳动公布一季度内部违规处置结果：该季度字节跳动共80名员工因触碰公司红线被辞退，其中45人涉信息安全违规。包括前员工A长期将飞书账号出借给已入职同行企业的前员工B，致使B持续获取、下载公司保密信息。因持续违规且拒不配合调查，两人被从重处罚。除实名通报、扣罚期权、纳入行业黑名单的处罚外，公司也已对两人提起民事诉讼追责。（第一财经）</p>\n  <p><strong>时隔四年，字节跳动CEO梁汝波再发全员信</strong></p>\n  <p>6月29日晚，字节跳动CEO梁汝波在时隔四年后，发出一封全员邮件，全面更新适配AI行业变革与组织发展需求的公司文化与领导力准则。在这封深夜全员信中，梁汝波讲述了三大问题：刷新使命底层逻辑、梳理管理理念体系、改版10条领导力原则。梁汝波在邮件中表示，“基于行业正在发生的变革和组织自身发展需求，我们最近重新梳理和更新了我们的文化内容，希望在面对新的机遇和挑战时，明确我们要以什么样的方式出发。”（证券时报）</p>\n  <p><strong>兆易创新提示风险：未来可能存在股价快速回落风险</strong></p>\n  <p>兆易创新发布股票交易风险提示的公告。公司股票价格自2026年6月15日至2026年6月29日连续10个交易日内日收盘价涨幅偏离值累计达到73.42%，自2026年5月18日至2026年6月29日连续30个交易日内日收盘价格涨幅偏离值累计达到125.60%，股票价格短期累计涨幅较大，未来可能存在股价快速回落风险。公告显示，公司所处存储芯片行业历史上呈现显著的周期性波动特征，目前产品价格已处于历史高位，继续大幅上涨的趋势不可持续，行业供给与需求终将走向再平衡。（每日经济新闻）</p>\n  <p><strong>报告显示去年全球碳排放增长三分之一来自美国</strong></p>\n  <p>英国能源学会（Energy Institute）的一份报告显示，2025年全球碳排放量增长中约有三分之一来自美国，原因是天然气价格上涨迫使电力生产商重新转向煤炭发电。该报告由英国能源学会与Ember、科尔尼研究所和毕马威会计师事务所合作完成，以下为该报告的要点:去年美国煤炭消费量增加10%，逆转了向清洁能源转型的趋势，并推高了整体排放量。全球能源行业的碳排放量增加1.1%，达到358.06亿吨二氧化碳。其中超过三分之一的增长来自美国。北美地区的增长:逆转了过去十年排放量下降0.7%的趋势。（新浪财经）</p>\n  <p><strong>客服回应蔚来APP发生大面积闪退</strong></p>\n  <p>6月29日，有大批蔚来车主在社交平台集中反馈遭遇系统大面积故障。据江西广播电视台都市现场栏目报道，此次闪退故障主要集中在苹果版本，打开即闪退，无法正常进入控制界面；安卓版本目前可以正常打开和使用。大量车主拨打400客服求助，得到的统一回复是“卸载重装”。部分车主在尝试多次重启手机无效后，通过卸载并重新安装蔚来App，恢复了车辆的解锁功能。在APP崩溃的同时，原本作为常用解锁方式的手机蓝牙钥匙也失去响应。车主靠近车辆后，车身不亮灯、无法感应解锁，导致众多车主在车旁束手无策。6月30日早间，记者致电蔚来400官方客服，接线工作人员表示：“目前已经找到原因进行修复，新版本APP也已经在分批推送中，请耐心等待，收到推送的升级更新提示后，请升级更新APP，就能解决闪退问题。”（界面新闻）</p>\n  <p><strong>同程旅行拟全面要约收购嘀嗒出行</strong></p>\n  <p>6月29日，同程旅行与嘀嗒出行发布联合公告。公告显示，同程旅行将通过旗下全资子公司eLong, Inc.向嘀嗒出行发起自愿有条件全面现金要约收购。此次要约收购范围包括嘀嗒出行全部已发行股份，并同步处理尚未行使购股权及受限制性股份单位（RSU）相关权益。本次交易已获得嘀嗒出行核心股东支持。公告内容显示，嘀嗒出行的五名主要股东已签署不可撤销承诺函，拟接纳要约的股份占嘀嗒出行已发行股本约53.70%。公告指出，本次收购不以嘀嗒出行私有化为目的。交易完成后，同程旅行拟维持嘀嗒出行在香港联交所的上市地位。（界面新闻）</p>\n  <p><strong>董明珠：出口没做好，接下来加快改进</strong></p>\n  <p>6月30日，格力电器董事长董明珠在公司2025年年度股东会上与投资者互动时表示，公司出口没做好，接下来加快改进。她还表示，格力电器海外销售渠道变革迫在眉睫，接下来模式要做重大改革。从市场看，格力电器在海外还有巨大空间，因为产品已经从空调拓展到多品类。（第一财经）</p>\n  <p><strong>王健林甩卖超80座万达广场</strong></p>\n  <p>近期，一家名为上海安垭企业管理合伙企业（有限合伙）的企业，股权发生变更。上海安垭旗下有两个项目，分别是上海松江万达广场、泉州浦西万达广场。此次股权变更也意味着，这两座万达广场正式易主。据21世纪经济报道记者不完全统计，2023年至今，万达集团累计转让的万达广场数量已超过80座。（21世纪经济报道）</p>\n  <p><strong>单次签证费用715元，中国赴日签证费暴涨</strong></p>\n  <p>从7月1日起，日本大幅上涨签证费，在中国办理单次签证的费用为715元，而很多人注意到在公告中对印度人格外“开恩”，无论单次和多次均只要40元。这一悬殊的差别立即引发了网友的热议，多数人理解这是日本希望开拓印度旅游市场的信号，还有人认为日本面临老龄化，这是希望加大步伐吸引印度劳动力赴日。实际上，日本唯独对印度“开恩”的原因在于日本和印度有双边协议，印度向日本公民提供优惠签证费，而作为对等，日本也降低对印度公民的签证费，由于有约在先，所以即便签证费普涨，也没有波及印度。（第一财经）</p>\n  <p><strong>保时捷中国回应取消多门店销售授权</strong></p>\n  <p>近日，有媒体报道称，部分保时捷中心将于6月30日终止经销业务，失去保时捷官方独立销售授权，此事引起广泛关注。6月30日，保时捷中国表示，山东济宁、江苏淮安、广西南宁兴宁保时捷中心将于6月30日终止经销业务，安徽芜湖保时捷中心将于7月31日终止销售业务，但售后仍正常运营，为车主提供符合保时捷标准的售后服务。</p>\n  <p>保时捷中国表示，面对市场环境与汽车产业转型带来的挑战，保时捷积极响应市场变化，持续深化“质大于量”的策略，进一步整合中国经销商网络。保时捷中国充分尊重合作伙伴基于自身发展所做出的决策，对于近期若干经销商的运营调整，将与合作伙伴合作，保证客户服务的连续性和高品质。（中国新闻网）</p>\n  <p><strong>特朗普要求美国汽油零售商立即降低油价</strong></p>\n  <p>美国总统唐纳德·特朗普当地时间6月29日表示，汽油零售商必须立即降低油价，并警告称，如果他们不这样做，未来将面临“大麻烦”。特朗普在TruthSocial上写道：“汽油零售商必须立即降低油价。严禁哄抬油价，这种行为是完全非法的。如果零售商不这样做，未来将面临大麻烦！目标价位应设定在每加仑2.50美元左右。”（新浪财经）</p>\n  <p><strong>现货黄金价格再度跌破4000美元，距1月高点已回落近30%</strong></p>\n  <p>6月30日，现货黄金价格跳水大跌，击穿4000美元关口后持续下挫至3960美元附近，日内跌超50美元，较年内高点已跌超1600美元。国内各大黄金品牌的金饰挂牌价持续下调。</p>\n  <p>同时，国内金饰价格同步大幅下调，老凤祥、周大福、周生生、老庙黄金等品牌足金饰品报价集体跌至1206—1213元/克区间，单日跌幅约25—30元/克。（第一财经、界面新闻）</p>\n  <p><strong>三星电机获美国客户价值4540亿韩元AI服务器电容器合同</strong></p>\n  <p>三星电机公司6月30日宣布，已与一家美国客户签署了一份价值4540亿韩元（约合2.93亿美元）的合同，为其人工智能（AI）服务器供应多层陶瓷电容器（MLCC）。三星电机表示，该合同有效期为2027年1月至2027年12月。该公司以保密协议为由，未透露客户身份。不过，业内人士认为，该客户是美国一家大型云服务提供商（CSP）。（新浪财经）</p>\n  <p><strong>海力士拟订购4000亿���元半导体检测设备</strong></p>\n  <p>据悉，SK海力士正在与半导体设备厂商讨清州P&amp;T7工厂所需的半导体检测设备供应事宜。各设备公司正在口头协调明年可交付的设备数量。设备行业预计，该工厂将订购约200台设备，其中包括HBM4测试仪。按每台15亿至20亿韩元的价格计算，总价最高可达4000亿韩元。（财联社）</p>\n  <p><strong>全球央行首次集体减持美元</strong></p>\n  <p>6月30日，据财闻海外资讯，官方货币与金融机构论坛（OMFIF）周二发布调查表明，未来十年计划削减美元储备的全球央行数量已首次超过计划增持者，标志美元配置出现结构性转变。该调查涵盖90家央行及公共基金，管理资产约10万亿美元。调查指出，受美国政策不确定性及地缘风险上升推动，79%的央行与60%的公共基金认为全球货币体系正向多极化演进。尽管美元今年上涨3%，但非前八大货币如挪威克朗、新西兰元及英镑配置需求上升，人民币被普遍视为重要多元化工具，虽受结构性限制。（财闻）</p>\n  <p><strong>腾讯云公布Cloud Mate产品退市安排</strong></p>\n  <p>36氪获悉，6月30日，腾讯云宣布，因产品业务调整，经慎重评估，Cloud Mate将于2027年08月31日23:59:59起停止服务。服务停止后，CloudMate控制台及相关功能将无法继续查看或使用，相关数据的保留、导出及恢复安排将按照本公告及腾讯云相关规则执行。</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，6月30日收盘，美股三大指数集体上涨，纳指涨1.52%，道指涨0.26%，标普500指数涨0.79%。大型科技股多数上涨，英特尔涨超6%，SpaceX涨超4%，苹果、英伟达、特斯拉涨超2%，微软、谷歌涨超1%，Meta小幅上涨;奈飞跌超3%，亚马逊小幅下跌。热门中概股涨跌不一，小鹏集团涨超3%，爱奇艺、蔚来涨超2%，百度、哔哩哔哩涨超1%;富途控股跌超3%，老虎证券跌超2%，理想汽车、腾讯音乐跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>SK海力士启动美国IPO</strong></p>\n  <p>6月30日，SK海力士向美国证券交易委员会（SEC）提交F-1招股说明书，正式启动美国首次公开发行（IPO）程序，拟发行美国存托股份（ADS），并申请在纳斯达克全球精选市场上市，股票代码为“SKHY”。根据招股书，每份ADS对应一定比例的SK海力士普通股，发行规模、发行价格及ADS对应股份比例等核心条款尚未披露，将根据韩国市场股价及市场情况确定。本次发行完成后，SK海力士将在维持韩国KOSPI上市的同时，实现赴美上市。（界面新闻）</p>\n  <p><strong>中导光电科创板IPO获受理</strong></p>\n  <p>近日，上交所官网显示，中导光电科创板IPO审核状态更新为已受理。本次IPO，中导光电拟募集资金18亿元。其中，10.8亿元投入武汉生产研发中心（一期）新建项目，3.5亿元用于肇庆生产研发中心扩建，剩余3.7亿元补充企业流动资金。项目落地后，该公司将扩充Micro-LED检测设备、3D封装量测设备、无图形晶圆缺陷检测设备产能，持续拓宽半导体检测产品品类。（科创板日报）</p>\n  <p><strong>比特币矿企lonic Digital递表纳斯达克申请直接上市</strong></p>\n  <p>由Celsius Mining资产重组而成的比特币矿企lonic Digital于周一提交申请，向美国证券交易委员会（SEC）登记其股票，以在纳斯达克完成直接上市。（财联社）</p>\n  <h2>投融资</h2>\n  <p><strong>“耀速科技”完成近2亿元A+轮融资</strong></p>\n  <p>36氪获悉，近日，“耀速科技”宣布完成近2亿元人民币A+轮融资。本轮融资由国方创投、清松资本、广发信德、东方富海、沄柏资本共同参与，老股东雅亿资本持续加码支持。本轮融资将主要用于持续推动公司“3DBioIntelligence（3D生物智能）”平台建设，包括垂类AI模型与生物机制解析能力的进一步提升、高通量自动化实验体系的落地、多模态生物数据的持续积累，并加速虚拟细胞（Virtual Cell）与生物世界模型（Biological World Model）的构建，全面推进新代药物研发人源化数据基础设施的形成。</p>\n  <p><strong>“量旋科技”完成D轮10亿元融资</strong></p>\n  <p>36氪获悉，国内量子计算企业“量旋科技”（SpinQ）宣布完成10亿元D轮融资，半年累计融资额达20亿元。本轮新增投资方包括中金资本、上海半导体产投、中航弘华、上海电科、国中资本等，投控东海、晶凯资本、青岛瀚瑞、海南风凯翔等老股东持续加码，资深产业投资人吕大龙、兰坤亦参与本轮出资。融资资金将用于可容错通用量子计算机全链条研发和核心工艺迭代与全球产业生态拓展。</p>\n  <h2>酷产品</h2>\n  <p><strong>优必选全尺寸超仿生机器人售价公布</strong></p>\n  <p>6月30日，优必选全尺寸超仿生人形机器人U1发布，全身有88个自由度，U1 Pro价格16.98万元，U1 Ultra男版和女版价格分别为99万元和88万元，轻量化半身的U1 Lite价格11.98万元。（第一财经）</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-30T23:55:18+00:00", "fetched_at": "2026-07-01T03:24:03.967594+00:00", "fingerprint": "50dc1b00731aee89"}, {"source": "36氪 - 最新文章", "title": "赤子城独家投资：4人创业团队「MobAI」，推出AI互动平台「Lunaverse Stories」 | 36氪首发", "url": "https://36kr.com/p/3875622047805447?f=rss", "summary": "<p>文丨刘士武</p>\n  <p>36氪获悉，<strong>AI 创业公司「MobAI」已完成数百万元天使轮融资，由港股上市公司赤子城科技独家投资。</strong>目前，由MobAI开发的AI互动叙事应用Lunaverse Stories 已进入邀请制测试阶段。&nbsp;</p>\n  <p>熟悉AI互动类产品的人应该对MobAI并不陌生。&nbsp;</p>\n  <p><strong>一年前，MobAI创始人钟文鼎（Vito）当时还在一家头部VC上班，工作之余和联创共同开发一款叫《修仙模拟器》的产品。</strong>这款产品是prompt驱动的互动游戏，玩家需要持续往里写很多提示词，对话和故事才走得下去。从产品形态上说，这种“长 context、用户主导生成”的模式对部分玩家并不友好，Vito自己玩过多次之后给出了判断：体验太累。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_7819571e16fe4c0db87a1f6af5e67446@242988687_oswg971277oswg1080oswg709_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">《修仙模拟器》</p>\n  <p><strong>2026 年 3 月，Vito 决定全职出来创业。</strong>和他一起出来的是 CPO王博（Kaito）曾是国内头部AI UGC平台早期核心成员，在3个月内推动产品日活突破百万；CTO张奥多（August）是中国科��技术大学AI方向博士，曾于国内某头部人工智能科技企业主导NLP模型在教育行业的应用。&nbsp;</p>\n  <p>在经过多轮讨论以及行业研究后，团队决定将修仙模拟器搁置，取而代之的是一个新的立项：<strong>做面向北美18至24岁年轻女性的AI互动叙事移动应用Lunaverse Stories。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_ffaca44813554ee4b62598177538b717@242988687_oswg1284084oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Lunaverse Stories</p>\n  <p>过去，这一用户群体活跃于Wattpad、Goodnovel等海外网文平台，对角色驱动的沉浸式叙事具备强付费意愿。与传统互动故事中只能体验预设剧情不同，在Lunaverse Stories里，玩家可以在扮演角色的过程中随时对剧情中角色的行为进行反应，从而得到为Ta生成的独一无二的内容与情绪价值，玩到自己“梦想中会出现的”的剧情。玩家的每一次决策、失败与重制，都会转化为新的故事线和推荐信号。&nbsp;</p>\n  <p><strong>在产品形态上，Lunaverse Stories以互动游戏Feed流为载体，玩法灵感则源自经典跑团机制。</strong>玩家在关键节点投掷骰子，由结果决定剧情走向，每一次选择都可能通向截然不同的故事线。&nbsp;</p>\n  <p>区别于传统互动游戏，<strong>Lunaverse Stories还融入了大量体感操作与场景小游戏</strong>，以更强的随机性和沉浸式养成体验，让玩家能够持续释放多巴胺。此外，平台还支持多人模式，同一段故事拆分为多个视角，各自持有不同信息和选项，在关键节点汇合后共同推进，兼具合作与博弈张力。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_a604b34dde7b48128b99c19a554189bf@242988687_oswg998234oswg1080oswg1169_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Lunaverse Stories</p>\n  <p>在此基础上，Lunaverse Stories构建了两套AI核心系统。“Remix Anywhere”让玩家在任意剧情节点插入自己的想法，AI 实时生成专属支线，同时积累对这位玩家的偏好理解。“Dream Universe”则在后台持续追踪玩家的选择、偏好与Remix记录，为每位玩家生成个性化专属支线，并进入推荐池分发给偏好相近的其他用户。&nbsp;</p>\n  <p>除了面向玩家的Lunaverse Stories APP，<strong>MobAI计划同步推出面向内容创作者的Lunaverse IDE，支持AI辅助编剧、资产一键生成及自动化发布。</strong>创作者无需技术背景，便能将文字内容转化为可交互的游戏。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_fb3d8c5dc911401c8c3494672553eb8b@242988687_oswg253855oswg1080oswg605_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Lunaverse IDE</p>\n  <p>提到这套机制时，Vito表示，传统推荐在已有内容库里排序，寻求最大公约数，他们做的是直接为单个用户生成最逼近其偏好的内容，再推荐回去。<strong>“我们不发明新品类，而是用 AI 把旧品类重做一遍，提升个性化体验。”</strong></p>\n  <p>把产品立意和打法理清之后，再回头看这一轮融资本身。&nbsp;</p>\n  <p>本轮出资方赤子城科技是港股社交娱乐出海龙头，在海外本地化运营与规模化增长方面有成熟的方法论积累，同时也在加速布局全球AI娱乐生态。赤子城方面表示，互动叙事内容游戏在欧美市场已有成熟的用户基础与商业化路径，也看好Lunaverse团队在AI互动叙事赛道展现出的潜力。&nbsp;</p>\n  <p>当然，即使有产业端的资源加持，4个人的团队仅用几个月的时间便完成了产品雏形，也表明了AI对于传统内容生产管线的积极作用。一个互动叙事的旧品类在 AI 介入之后，正在重新被定义。&nbsp;</p>\n  <p>Vito透露，<strong>Lunaverse Stories内测在7、8月进行，正式上线时间表在二季度中旬，Lunaverse Stories IDE已经向外部创作者试运营。</strong>此外，团队已经在与几家头部美元基金沟通下一轮。&nbsp;</p>\n  <p>本文首发自<a href=\"https://mp.weixin.qq.com/s?__biz=MzkzOTY5MTQyNQ==&amp;tempkey=MTM4MF85cnZKUlhZc1hnV3RDbm1tVXF6bEVHWEdndjhxbkJQRTNuZ2h4V1F5Vk9pSV85Z3dQVUg0X0tYazdrdVdJSDNjamx2XzFXUXdVeTVJYldOWGRfMjVqS0JjSlhBT0djV1lZaW9YS2FWaTRWV0ZIcVNVQUpLM0RlMDBZRFoyeExFX09yVmhLc3pLM0I1Q0RNZzZtLWxEU0NqTTRhbHR6V3NmRnpKTml3fn4%3D&amp;chksm=42ec45ed759bccfbab2301c6d707164bbdb02bf8c93b4d713c3d9a3ab517d95c31cc0a7e12a0&amp;scene=90&amp;xtrack=1&amp;subscene=236&amp;clicktime=1782821169&amp;enterid=1782821169&amp;sessionid=1782458695113#wechat_redirect\" rel=\"noopener noreferrer\" target=\"_blank\">“36氪游戏”</a>。</p>", "category": "tech", "published_at": "2026-07-01T01:00:32+00:00", "fetched_at": "2026-07-01T03:24:03.967587+00:00", "fingerprint": "780114d9ffc228dd"}, {"source": "36氪 - 最新文章", "title": "苏大教授创业做机器人触觉系统，获松禾资本千万级天使轮融资｜硬氪首发", "url": "https://36kr.com/p/3874358072710407?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，感知纪元科技有限公司（以下简称“感知纪元”）近日完成千万级天使轮融资，本轮由松禾资本领衔投资。融资资金将主要用于中试产线搭建、核心产品迭代升级及团队扩充，加速推进多模态智能触觉电子皮肤从研发走向量产。</p>\n  <p>感知纪元成立于2025年12月，感知纪元定位于机器人触觉基础设施提供商，通过自研多模态电子皮肤、触觉感知硬件及AI算法，为机器人提供完整的触觉系统。</p>\n  <p>创始人兼CTO刘瑞远为苏州大学特聘教授，师从纳米能源领域奠基人王中林院士及柔性电子先驱Takao&nbsp;Someya教授，长期从事柔性电子与智能传感研究，构建了从多模态材料到器件的完整研发体系。</p>\n  <p>具身智能赛道正走到落地转化的关键节点。各类实验室演示不断涌现，但想要机器人稳定落地工业、医疗等真实产业场景，适配复杂物理环境完成精细作业，触觉感知能力的短板，已经成为难以绕开的核心阻碍。</p>\n  <p>机器人拥有视觉之后，下一个决定智能上限的，将是触觉。目前，行业主流触觉方案仍停留在单点式传感器阶段，依靠压阻、电容或六维力器件完成基础的力与位置检测。这些器件仅能提供单一压力数值，无法实现多维力感知、动静态同步识别等关键能力，难以支撑拧瓶盖、捏鸡蛋等精细交互操作。同时，信号漂移、响应迟滞、通道串扰等硬件缺陷，也达不到实时闭环控制的可靠性要求。</p>\n  <p>“适配通用机器人的理想触觉方案，应当具备大面积柔性覆盖、多模态同步感知、环境自适应学习等接近人类皮肤的综合特性。”刘瑞远告诉硬氪。这也正是感知纪元所聚焦的研发方向。</p>\n  <p>感知纪元的核心产品是一款弹性多模态仿生电子皮肤，与传统刚性传感器不同，它采用高弹性仿生材料，可以贴合机器人手臂、手指乃至关节等复杂的曲面结构，单张电子皮肤可以覆盖机器人全身，其拉伸延展性可以达到400%以上，器件已完成超过百万次的可靠性测试。</p>\n  <p>其中，单张柔性电子皮肤可集成压力、滑动、温度、纹理、形变等多种信号的采集能力，在单个传感器上实现毫秒级综合触觉感知，甚至可模拟人类皮肤通过颜色变化对外界刺激做出响应。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_d5c3004d998f49cfb70491362bf984ea@6022551_oswg5429140oswg4032oswg3024_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">感知纪元弹性多模态仿生电子皮肤（图源/企业）</p>\n  <p>刘瑞远告诉硬氪，弹性多模态融合的核心难点之一，在于材料与工艺的一体化。“传统方案大多依赖单一功能的传感材料——测压力的做压力层，测温湿度的做温湿度层，但我们是从基材端入手，在器件制备过程中将导电油墨、压电材料、变色材料等功能物质直接按需复合进弹性基体中，实现不同功能的传感单元在同一张电子皮肤上的空间分区排布。”</p>\n  <p>相比之下，如果只是将多个独立传感器做物理堆叠，层与层之间会形成应力缓冲，力的传导路径被破坏，传感器最终读到的数据自然失真；不同传感单元之间还会发生信号串扰，彼此影响输出的准确性。</p>\n  <p>空间分区解决了“在哪里感知”的问题，而要让每个分区都能感知得准，材料本身还必须具备“弹性”这一关键特性。感知纪元的全弹性设计模仿了人类皮肤的力学响应机制，皮肤被轻轻触碰和受到针刺时，形变程度不同，反馈的信号强度也自然不同。弹性材料随外力大小产生对应程度的形变，为力的精准测量提供了基础。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_3ae9c377e8e04f31a652f5dd3cc7543e@6022551_oswg776283oswg1138oswg707_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">全弹性设计（图源/企业）</p>\n  <p>在AI能力层面，感知纪元还内置有迁移学习等算法，这些高质量的原始数据经由算法提炼出物体的基本物理特征参数。当机器人遇到从未接触过的新物体时，只要该物体与已学知识具有相近的物理特征，迁移学习算法即可基于已有知识进行识别和判断。由此形成的“硬件采集、数据提炼、模型迁移”闭环，让机器人的触觉系统不再停留于感知层面，而是真正具备了理解与决策能力。</p>\n  <p>商业化层面，感知纪元已同国内头部人形机器人公司签订战略合作协议，并获得多家新能源汽车、护理机器人企业千万级采购意向，建立中试线，产品在智能座舱触感交互、医疗康复机器人等场景进入验证阶段。</p>\n  <p><strong>以下为硬氪与感知纪元创始人兼CTO刘瑞远的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：行业主流触觉产品多为单一感知模态，感知纪元选择多模态一体化集成路线，落地过程中核心难点是什么？叠加多模态设计会抬升工艺与产品成本，客户能接受吗？</strong></p>\n  <p><strong>刘瑞远：</strong>这两个问题恰好是行业现阶段最核心的两大顾虑，我分开来讲。</p>\n  <p>首先是关于多模态融合为什么难。市面上大多数做柔性传感器的，用的是纺丝或者单层薄膜材料，它只能在单一维度上做功能，没办法把压力、温度、纹理这些不同的感知单元集成到同一块材料上。但感知纪元做的是复合材料体系，把各功能层全都复合到一块基底上，并在同一片皮肤上做空间分区，互不干扰，最后还是一整块完整的材料。这个路线的门槛在于，如果你的底层材料不具备这种可复合性，后面所有工艺都做不了。</p>\n  <p>其次，我们做的全弹性结构，跟人的皮肤一样。轻轻按一下和用力按下去，传感器的形变程度不同，反馈的信号强度也不同，这个梯度响应是很自然的。但如果只是将三个现成的传感器粘在一起，力的传导路径不连续，信号会失真，不同传感单元之间还会互相串扰，测压力的干扰到测温度的，数据根本没法用。因此，不是说把多个传感器拼在一起就叫多模态，那只是物理堆叠，真正的难点在于从材料层就开始做模量梯度的一体化设计。</p>\n  <p>对于成本和客户接受度的问题。坦白讲，如果客户只需要测一个点的压力，那单模态就够了，确实不需要多模态。但通用人形机器人不一样，它面对的场景是开放的、多样的——今天抓苹果，明天端水杯，后天可能要扶老人，单靠压力数据远远不够，滑移、温度、纹理这些信息都得有。这是刚需，不是锦上添花。客户也清楚这一点，所以对于真正需要多模态能力的场景，解决的需求价值是大于增加的成本的。</p>\n  <p>而且我们源材料端、器件制备端已经全部实现了国产化，整体方案的成本都控制在比较低的范围。</p>\n  <p><strong>硬氪：具体到不同场景来看，据你们观察，现阶段企业对柔性电子皮肤的需求和痛点分别是什么？</strong></p>\n  <p><strong>刘瑞远：</strong>从我们得到的反馈来看，不同场景提的要求可能完全不一样。</p>\n  <p>以智能汽车座舱场景为例。传感器嵌入座椅后，首要约束是不能影响座椅原有的通风、加热等基础功能。这意味着传感器必须具备透气性、耐高低温能力，同时在反复形变条件下保持信号稳定性，座椅每天都在承受乘员起坐带来的拉伸与恢复，如果传感器自身形变即产生信号漂移，反馈数据便会失真。因此我们需要在满足严苛的车规场景下开发拉伸不敏感的传感器，即对拉伸形变不产生响应，仅对真实压力输出信号。</p>\n  <p>护理机器人场景则是另一套要求体系。穿戴式护理设备需要同时感知压力和剪切力，控制气囊系统实时动态调节与皮肤的贴合度，气囊充气过紧会造成人体不适甚至压疮，过松则丧失护理功能。传感器在与人体皮肤接触的动态界面上，必须保持灵敏、稳定的探测值，支撑控制系统及时反馈调节。</p>\n  <p>具身智能领域的要求更为复杂。与头部机器人企业的沟通显示，其核心痛点在于，当前大多数产品仅解决“感知”层面的问题，知道接触发生、知道力的大小，但无法上升到“理解”层面。抓取一个物体时，机器人需要判断其硬度、表面粗糙度、是否存在滑移趋势，这些信息是单一压力传感器无法提供的。客户真正需要的是一套能够理解物理世界的触觉系统，而非单纯的信号采集器。</p>\n  <p>感知纪元的技术路线是构建基于“材料-器件-算法”的多模态基础能力，再根据不同场景的特殊需求进行针对性适配。比如汽车座椅需要耐高温、透气，就调整复合材料的组份、孔隙结构；护理场景要抗剪切力，就优化敏感层的排布方式。</p>\n  <p>这些定制化能力，建立在团队多年积累的复合材料研发经验与器件设计基础之上，都可以灵活调整。这恰恰也是我们的优势所在。</p>\n  <p>相比机器人视觉已经形成成熟产业链，机器人触觉仍处于早期阶段，硬件标准、数据体系和算法框架尚未建立。我认为，未来机器人触觉的发展路径，很可能会类似自动驾驶的发展：先建立高质量传感硬件，再形成标准化数据集，最终构建具备泛化能力的触觉基础模型。感知纪元希望成为这一产业链中的底层基础设施提供者。</p>", "category": "tech", "published_at": "2026-07-01T01:20:00+00:00", "fetched_at": "2026-07-01T03:24:03.967578+00:00", "fingerprint": "49c3fa134c49dc5f"}, {"source": "36氪 - 最新文章", "title": "告别硬件出海上一个十年，前安克CMO做了款AI时代的Memory产品｜硬氪专访", "url": "https://36kr.com/p/3867992509125636?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>2024年，当王时远从工作了9年的安克辞职时，他发现自己面对的是一个全新的世界。</p>\n  <p>王时远亲历了硬件出海的黄金十年，是国内最早搭建海外营销体系、建立规则的那批人。他2015年加入安克，先做海外，后做国内，从安克CMO到转任中国区总裁，最多的时候带了四五百人的团队。</p>\n  <p>2025年，从安克离开创业时，出海硬件创业已经有一套成熟的流程：打样、上众筹、以众筹成绩去融资，最后量产。可王时远看到，这条路的ROI越来越低。众筹项目越来越多，却大部分是赔本赚吆喝。海外的营销渠道，已经从过去Meta、Google大一统，到现在散落在播客、社媒KOL各处。“ <strong>十年前Meta能做到的事，今天做不到，Kickstarter也做不到。”王时远告诉硬氪。</strong></p>\n  <p>粗放式的产品思路，显然已经不适合这个时代。AI硬件正在成为一个明确的浪潮，但在王时远看来，什么是AI原生产品、AI原生硬件应该长什么样，尚没有人真正定义清楚。</p>\n  <p>这正是创业公司最珍贵的时间窗口，跑得够快的人就有机会写下答案。因此王时远选择进入了一个细分赛道，做AI Memory硬件。</p>\n  <p>近日，穗升科技首款产品Memoket在海外正式开启预售。这是一款AI Memory可穿戴硬件，仅11克，分表带款和手环款两种形态，待机超过30天，连续录音续航20小时。它可以将物理世界中所听到的信息结构化，需要时调给Agent，实现跨时间聚合和Context（上下文）串联。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_3cd8257ac8da4c6ebe702ec250e8635b@6022551_oswg530099oswg1080oswg568_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">穗升科技首款产品Memoket Gem（图源/企业）</p>\n  <p>可以看到，Memoket是典型的软硬一体产品。在此之前，市面上的AI录音产品并不少，但王时远认为，它们大多停留在会议纪要和语音转文字，本质上仍是“录音笔”的升级版。而穗升要做的是更底层的事——远不止于记录一段对话，而是管理一个人所有的线下信息流，让记忆可以借助AI Agent被检索、被串联、被调用。</p>\n  <p>这是硬件创业的新共识：硬件是数据入口，后续的AI能力才是护城河。“<strong>今天，物理世界有90%的信息没有被深度数字化和结构化，需要实践、场景以及大量的工程化努力，这个过程中要兼顾成本、效率、合规、安全隐私、下游Agent沟通等。”王时远说。</strong></p>\n  <p><strong>以下是硬氪同穗升科技创始人兼CEO王时远的对谈实录，内容经编辑：</strong></p>\n  <h2><strong>Meta过去能做的，Kickstarter做不到</strong></h2>\n  <p><strong>硬氪：你早年的经历都跟市场营销、销售有关，结果你说自己是个i人，我挺惊讶的。</strong></p>\n  <p><strong>王时远：</strong>我的工作经常会需要去表达，以前我用的词叫perform，要契合职业角色、展现状态，算是一种职场里的外在表现。但私底下我会比较安静。</p>\n  <p><strong>硬氪：怎么理解这个“表达”？</strong></p>\n  <p><strong>王时远：</strong>最近我同事说了一句话对我启发很大。他说“出来混，首先是要出来。”我以前从来没听过这个说法，过去大家常讲的是“出来混迟早要还的”，那是一种责任感。但“首先是要出来”，她把这句话说得轻描淡写，听起来心理觉得特别对。</p>\n  <p>如果创业是“出来混”，那首先“出来”，就是得把自己做的事情表达给目标用户听。</p>\n  <p>作为一家做产品的公司，我们做决策的关键在于：它能不能服务到目标用户？从商业角度看，是你的PMF找得准不准，这很重要。站在个人价值层面，如果我们每天做的事情到头来只是自嗨，没有真正帮用户解决需求，那也是在浪费自己的时间。“出来”的意义就在这里。</p>\n  <p><strong>硬氪：创业后你个人心态上有什么变化？</strong></p>\n  <p><strong>王时远：</strong>这大半年我有很多惊喜，<strong>其中一个是我发现自己睡眠特别好。</strong></p>\n  <p>睡眠这件事对我很重要。以前上班基本每个月会出现三四次焦虑失眠的情况，但创业这段时间我一般每天都能有七八个小时的睡眠，哪怕现在的工作强度跟宽度肯定比以前大，但心理状态很不一样，精神上还是很有能量的。</p>\n  <p><strong>硬氪：这跟我们遇到的大多数创业者都不一样。</strong></p>\n  <p><strong>王时远：</strong>我觉得是性格使然。我是一个篮球迷、科比迷，喜欢竞争，甚至不是说“不害怕竞争”、而是喜欢竞争，把它当做竞技运动。</p>\n  <p>虽然可能看起来个子不算高，但学生时代打篮球，我一直是校队主力，曾经2次在最后三秒投进了绝杀球。所以我是会渴望做那个投出制胜的关键一球的人，去反超、去赢得比赛。</p>\n  <p><strong>硬氪：聊聊你在安克的经历。</strong></p>\n  <p><strong>王时远：</strong>2015年我加入安克，在公司呆了九年，前五年主要负责美国、欧洲、日本等海外市场的品牌和营销工作。在那之前我没做过消费电子产品，对海外也很陌生，没试过从0到1做一个品牌是什么感觉。当时除了主品牌，基本上每个品类我都参与了0到1的过程，也做出了一定的结果。</p>\n  <p>后来我接手中国区业务，2020年，国内没多少用户认识安克这个品牌，公司在中国的产品基础也很薄弱。<strong>跟我搭档做中国市场的HR还问我，T哥你是不是想找个地方退休</strong>？因为安克90%以上的收入在海外，中国市场显得那么小，跟整个体系不搭。我很肯定地回答他不是，我没有打算退休，我要是想退休就直接退了、不用找个岗位退。</p>\n  <p>在3C消费电子行业，中国是公认的更难、更卷的市场，比美国都卷。但我就是喜欢这种挑战的人。选择回归中国市场，对安克有意义，对我也是件很有新鲜感的事。</p>\n  <p><strong>硬氪：巅峰时期你在安克带过多少人的团队？穗升目前的规模是多少？</strong></p>\n  <p><strong>王时远：</strong>最多的时候加起来四五百个人吧。穗升现在的团队是20来号人。</p>\n  <p>我觉得很幸运，我们现在一起创业的联创覆盖了研发、产品、供应链、营销，比较完备；其中3个人经历过安克从创业早期到上市的完整过程，担任过关键部门的1号位，这对我们当前的创业的0到1、1到100都是宝贵的经验。</p>\n  <p><strong>硬氪：两者间的人员倍数比超过十倍，管理上会更轻松吗？</strong></p>\n  <p><strong>王时远：</strong>分两个阶段来说。我刚进安克的时候团队30个人，后来扩大到200人、里面1/4是外国人，base在美国、英国、德国、中东各地。</p>\n  <p>我经历过觉得管40个人很难、管更多人简直无法想象的阶段。但阶段不同，学习的内容也不同。从几个人到一二十人，再到真正建立清晰的流程、规则和制度，这个过程不能只是跟着公司走，每个部门有自己的业务属性，需要做相应的调整适配。</p>\n  <p>回头看现在的团队，真实感受是，难度相对不大。但更有意思的挑战在于：如何不用更多人，而是靠更多的AI工具和流程来组织团队。</p>\n  <p>一个经典的AI硬件公司创业案例是，产品大货未发布前，人员管控大概在30人左右，正常一款特定难度的产品大概需要12到18个月。所以我当时就问自己，我们能不能做到？如果减少50%的人是不是也能？</p>\n  <p>既然AI是必须拥抱的事情，我们就尝试在组织层面也落地这件事。包括研发、软件、营销、设计、HR行政等组织架构方面，AI first原则。</p>\n  <p>举个例子，我觉得很开心的一件事是，我完全不会写代码，但借助AI，我已经能独立跑通一个产品的完整闭环：从概念到demo、从营销设计到上线，再到AB测试、数据回收、迭代优化，甚至连个人日常的to-do管理都交给了自己开发的Agent。这在AI浪潮到来之前几乎不可想象，而现在，它已经成了我们公司日常的状态。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_5c241b60a6db4f45ae44c67b5d847a9c@6022551_oswg1915804oswg1678oswg1048_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王时远和团队在海外与用户线下交流（图源/企业）</p>\n  <p><strong>硬氪：从十年前安克出海到现在，全球市场环境有哪些明显变化？除了供应链，今天中国硬件公司的核心竞争力还体现在哪里维度？</strong></p>\n  <p><strong>王时远：</strong>从两个维度上看，变与不变始终并存。</p>\n  <p>先说不变的。一方面，中国在硬件行业的供应链优势和工程师红利依然存在。美国在硬件人才上已经断代了二十年，除了苹果，本土几乎没有什么具备成熟硬件自研与落地能力的公司。即使是谷歌这样的巨头，在硬件尝试上也多次受挫，现在只能靠收购。这个优势我觉得至少五年内不会变，产业链和人才的迁移没那么快。其次是用户层面，消费者对硬件产品的需求没有变。</p>\n  <p>变化的部分也很明显。首先，华人面孔在美国的存在感变强了，受到的关注也更多。我觉得这是个好消息，今天一个华人面孔在美国比五年前、十年前更容易被接受。</p>\n  <p>第二是信息传播方式发生了很大变化。<strong>以播客、X（原Twitter）为代表的渠道内容碎片化、垂直化趋势越来越明显。我最近也在思考：过去十年广告是核心，但现在发生了很大的转变，广告可能会从主力变成辅助。</strong></p>\n  <p>营销的本质是把好产品传递给更多人。它很花钱，很多时候不亚于研发，甚至超过研发，因此，营销模型的效率非常重要。</p>\n  <p><strong>一个明显的信号是，Kickstarter平台的流量最近两三年没怎么涨，项目却越来越多。不少国内团队还在尝试TikTok，TikTok属于广告驱动——它有效、但低效，能完成冷启动、但没法走向大规模商业化。</strong></p>\n  <p><strong>十年前Meta能做到的事，今天做不到，Kickstarter也做不到。不少PR很成功的众筹项目实际是亏损的，我不否认它的可行性，但可能不是一件那么划算的事情。</strong>它有效，在于能融到资、能验证需求；不高效，在于商业化效率低。</p>\n  <p>硬件公司不能像软件或互联网那样谈三年五年亏损，彼此的生命周期不一样，因此，我们必须更注重效率，让用户、数据和收入形成一个能高效转动的飞轮。</p>\n  <p><strong>上一个时代过去了。我们正在努力适应变化中。</strong></p>\n  <h2><strong>无感化AI Memory硬件</strong></h2>\n  <p><strong>硬氪：从产品定义来看，你们是国内最早提出要做AI Memory硬件的团队之一。</strong></p>\n  <p><strong>王时远：</strong>去年5月，我们先想到了一个方向——<strong>通过一组硬件，将用户在物理世界里听到、看到、感受到的信息进行结构化处理，再交给AI Agent，以提供相应的服务体验。</strong></p>\n  <p>有不少声音把我们产品理解为“AI录音器”，但那只是一个切入点。最开始我们聊了一些机构，几乎没有人有共识。红杉是非常早期就对这个方向有明确判断的机构，它不仅下了注，而且下注了不止一家。直到今年春节过后，周围的声音就不一样了，共识来得很快。</p>\n  <p><strong>软件服务层面，硅谷从2024年下半年就陆续有团队在做，比中国早一点。到今年，越来越多的大厂、大模型公司和创业团队都在用不同方式讲这一趋势。</strong></p>\n  <p><strong>硬氪：这个方向目前还处于非共识状态吗？</strong></p>\n  <p><strong>王时远：</strong>我认为是的。非共识的原因之一在于，学术界尚未明确统一的技术路线。目前主流探索方向分为三类，一种是Token level（词元级）记忆，将记忆以文本形式纳入上下文窗口；第二种是Parameter level（参数级）记忆，把记忆嵌入模型权重实现原生留存；第三种是Latent level（隐空间级）记忆，将记忆压缩为高维向量存储。</p>\n  <p>这些维度跟我们产品也有差异。穗升科技做的是To C硬件，我们更像是一个以用户为中心的中间层，把物理世界的信息收集、整理、结构化地管理，当用户需要将信息给到Agent时，产品会通过MCP协议去调用对应的上下文。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_10840b9c1e4b49198279085fcbfd93b7@6022551_oswg345746oswg1080oswg540_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Memoket可对物理世界的信息进行收集、整理、结构化地管理（图源/企业）</p>\n  <p><strong>简单来说，我们不是给Agent做一个Feature（功能或者插件），不需要去证明哪家的个性化模型更好，而是要跟大模型、Agent做“朋友”，借助它的能力去服务用户、解决问题。</strong></p>\n  <p><strong>硬氪：产品定义过程中有没有调整？</strong></p>\n  <p><strong>王时远：</strong>大方向是从Day One就确定的，中间持续迭代。</p>\n  <p>去年下旬，我们尝试做过Agent Skill，但OpenCLaw出来后，这个方向迅速喊停了。最终产品功能聚焦到两件事，第一，用硬件方式做物理世界的第一层数据入口；第二，将结构化处理后的不同模态信息，在用户需要的时候，以无感的方式同步给到TA的Agent。</p>\n  <p><strong>硬氪：首款产品形态是什么样的？</strong></p>\n  <p><strong>王时远：</strong>第一款产品Memoket是一个无感化的可穿戴设备，它分为两种形态，一种带表带适配苹果手表、另一种是单独的手环。独立设备的重量仅11克，用户也可以购买我们设计的项链挂绳，戴在脖子上当项链。</p>\n  <p><strong>硬氪：为什么最后落点在可穿戴？</strong></p>\n  <p><strong>王时远：</strong>要稳定地帮用户记录，设备就得跟随用户。要实现长期佩戴，产品必须轻巧、无感，且符合用户本来的习惯。Memoket只有11克、很轻，在重量上尽可能趋近无感化。</p>\n  <p>但到底该戴在哪个位置？目前常见的有手腕、胸前和戒指，每个位置的使用体验都不一样。我认为，不存在一种形态能覆盖所有场景、同时适配所有佩戴位置，并把体验做到极致。给用户多种选择看似更自由，但一定会牺牲掉每个位置的极致体验。</p>\n  <p>比如项链，基本上将主要用户瞄准了女性市场，男性佩戴项链的比例客观上相对少。很多人认为眼镜是终极形态，但对于不近视人群来说，长时间佩戴眼镜很难有吸引力，使用门槛太高。</p>\n  <p>关键还是要“戴”，而且最好是用户本来就有的习惯，不要强行改变。很多人低估了改变习惯的难度，特别是让用户为一个新产品改变原有习惯。除非这个产品所提供的价值是原先品类价值的十倍，否则，用户凭什么要改？</p>\n  <p><strong>硬氪：产品做到这么小且轻量化，对续航有没有影响？</strong></p>\n  <p><strong>王时远：</strong>设备日常续航为20小时，按每天录音5小时计算，可以支撑4天不用充电。这个数字是过去大半年里持续找最优解的平衡结果。</p>\n  <p>如果要更长续航，比如一周做到100个小时，电池就会大，一重用户就不愿意戴；如果做更小，可能8小时就没电，每天都要充电，用户容易忘记带，数据入口就不稳定。</p>\n  <p>这个平衡我们磨了很久，经常纠结多1毫米少0.2毫米的，包括单独手环重量更轻、表带长度的影响等等，很多细节都要考虑。到今天为止，我们对现在这个版本是满意的。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_00d9ba0da5b14a8c9845fedaee2ae01f@6022551_oswg247388oswg1080oswg532_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">克重仅11克，日常续航为20小时、可支撑4天不充电（图源/企业）</p>\n  <p><strong>硬氪：它的AI Memory功能具体怎么应用？</strong></p>\n  <p><strong>王时远：</strong>&nbsp;我们做出了几个差异性功能，比如单个录音资料总结串联Context（上下文），能做到同一主题信息的跨时间聚合等。</p>\n  <p>MemoChat会对所记录的信息进行整理分析，以周、月、季度等实际时间为单位做分配汇总。这时，每次录音都不再只是单个数据库，而是像网状记忆一样，把相关内容链接起来，并根据用户所需要的进行抽取和汇总。比如业务讨论时，Agent既会基于当下的讨论进行记录分析，根据会议上提及的内容，它还能对过往存储在用户云端的海量素材进行搜索，将相关内容在文档尾部详细罗列出来。</p>\n  <p>用户的工作流在哪，我们就要融入哪。目前，MemoChat已经与Slack等办公协作类工具打通，可以直接把经Agent梳理后的结构化信息和Memory流程直接发送到这些办公平台。</p>\n  <h2><strong>物理世界「外挂」</strong></h2>\n  <p><strong>硬氪：有些投资人认为硬件价值不高。</strong></p>\n  <p><strong>王时远：</strong>我不认同。<strong>我认为做60分的硬件门槛低，但要做到90分，门槛很高。这么多年就一个苹果、一个华为，包括安克也是如此，在硬件行业拥有绝对竞争力。</strong></p>\n  <p>60分门槛的硬件（深圳）华强北很多，三四十万给到方案商就能做，但想达到90分则很不容易。仅不同品类的供应链厂商，彼此之间的差异都很大，不像业界想象中那么容易复制。</p>\n  <p>同时，单品类的硬件到90分不容易，多品类更难。穗升科技要做一组硬件产品，类比人的感官，耳朵和嘴巴对应麦克风、眼睛对应Camera、Sensor相当于皮肤等等。要做齐这一整套硬件，并把每个单品都做到90分以上，难度是成倍增加的。</p>\n  <p><strong>硬氪：软件的难度体现在哪里？</strong></p>\n  <p><strong>王时远：</strong>中间层软件构成了我们产品的核心能力。<strong>今天，物理世界有90%的信息没有被深度数字化和结构化，需要实践、场景以及大量的工程化努力，这个过程中要兼顾成本、效率、合规、安全隐私、下游Agent沟通等。</strong></p>\n  <p>穗升科技的品牌叫Memoket，“Memory in pocket”的含义是在你口袋里的记忆，随时可以调用。我们在市场调研中发现，一些美国用户会提出这类产品的精细化需求，比如备忘录功能，这类功能过去一直保存在手机的某个角落，但基本用不上。</p>\n  <p>Memoket可以一键导入用户在Mac、iPhone、Notes里的所有信息，并接入飞书、OnCall等工具，在用户的工作流和生活流，帮用户管理好信息、节省时间，不需要额外打开其他页面即可直接使用MemoChat、Memo Agent提供的功能。</p>\n  <p><strong>硬氪：目标用户画像是什么？</strong></p>\n  <p><strong>王时远：</strong>&nbsp;首批产品主要面向欧美市场，订阅在那边已经是比较成熟的消费习惯。我们的目标用户是中小企业主和创业者，他们对高密度信息的记录与梳理有强烈刚需。</p>\n  <p>这些人每天都要做多个中大型决策，他们很高比例的时间在线下，没有私人秘书，大量沟通发生在屏幕之外，信息根本记不住。咖啡厅里和客户谈合同条款，电话里跟供应商追交付和成本，走廊上跟员工沟通工作，甚至开车回家路上接家人的电话等等。</p>\n  <p>一旦遗忘关键细节，就意味着明确的决策风险，可能导致几千、几万甚至数十万美金的损失。所以他们不需要被说服“要不要用”，而是要比谁的产品更好、更能满足需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260626/v2_9b44798ac47448119b903cb46ce1f3ec@6022551_oswg2030840oswg4590oswg3202_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">种子用户使用反馈（图源/企业）</p>\n  <p><strong>硬氪：这些功能未来是否有可能被手机厂商或应用公司吞并？</strong></p>\n  <p><strong>王时远：不少投资人问过我们，跟飞书、钉钉相比，产品的竞争力在哪里？但穗升科技并不打算做另一个Slack或飞书。相反，我们是对物理世界的一种强烈补充，而不是试图替代现有的软件本身。</strong></p>\n  <p><strong>硬氪：怎么看待这个品类的市场空间？</strong></p>\n  <p><strong>王时远：</strong>当前全球约有8000万至1亿名中小企业主，群体基数足够大。早期我们会主要围绕工作场景来构建闭环，目前80%精力都集中于此。剩下20%的应用相对碎片化，但随着产品泛场景化能力的增强，我们相信未来同样能支撑起一个规模化市场。</p>\n  <p>举几个例子。用户想出租自家房子，跟几个中介交流过后，我们的Agent能基于上下文快速串联信息，决策放多少价格、选哪家中介；陪老人看病时，能全程记录下医生说的注意事项、用药方法等信息，由AI自动整理成清晰的医嘱摘要，一键同步给家人，不用再反复复述。</p>\n  <p>这些场景都有明确的附加价值，但并非每天发生。随着早期用户在产品使用过程中，自然地将其应用引入更多场景、并形成一定体量时，我们就会快速迭代，去适配对应的生活流和习惯流补齐更多功能。</p>\n  <p><strong>硬氪：用户数据储存在云端，意味着TA可以随时迁移到另一款产品。你们的用户壁垒怎么建立？</strong></p>\n  <p><strong>王时远：</strong>无论是纯软件还是软硬件一体，任何产品都很难靠单一功能或价值点绑住用户。</p>\n  <p>目前主要从几个维度入手。首先是功能层面持续迭代，把我们的洞察和用户反馈迅速产品化，不断推出新功能。比如印象笔记的用户，原先TA对Memoket的兴趣只有2个月，当我们将用户过去十年的备忘录都导入到产品内，设备变得更懂TA了，产品粘性就会大幅提升。</p>\n  <p>其次，AI硬件时代，信任变得越来越重要，地缘经济的影响也会强化这一点。用户对产品、品牌以及企业的判断和信任，直接影响TA是否愿意迁移。多年来，苹果一直很强调对用户隐私数据安全的重视，很多高消费力用户不愿离开苹果，核心就是信任。</p>\n  <h2><strong>「变与不变」</strong></h2>\n  <p><strong>硬氪：当前市场上做AI录音硬件的厂商很多，未来是否会在Agent端跟你们形成竞争？</strong></p>\n  <p><strong>王时远：</strong>这里的关键是：这到底是一个技术问题，还是产品定位问题？</p>\n  <p>一个品牌已经建立的定位资产是非常宝贵的，不会轻易改变，因为改变的成本很高。一方面是技术成本——企业从Day One开始的技术路径要改，不是一两个月能完成的；更重要的是品牌资产，虽然不那么显性，但在决策时非常关键。我没有意图去猜测其他公司会怎么选。</p>\n  <p>但回顾历史，扫地机器人最早是美国公司先跑出来的，后来被数家中国公司超越；GoPro也被影石后来居上。商业竞争的有趣之处在于，每个团队都会根据自己的策略去思考优势和差异化，给用户提供更多选择。</p>\n  <p>我觉得这是有趣的事，那么多品类里，后来者永远有自己的优势、策略和机会。我们不怕竞争。</p>\n  <p><strong>硬氪：AI Memory硬件切入市场的逻辑是什么？</strong></p>\n  <p><strong>王时远：</strong>目前市场对AI Memory硬件产品有不同的思路。</p>\n  <p>一种是从技术驱动出发，讲多模态Context（上下文），这条路线在理论上可能成立，但回到现实条件来看，多模态AI在端侧落地仍然面临一系列硬约束，比如隐私保护机制不成熟、功耗和续航难以兼顾、端侧推理能力受限等，导致当前应用更多停留在娱乐属性，离真正的生产力工具还有距离。所以在产品定义上，穗升选择先收敛到单模态，把这一代产品的体验做透。这不是一个终局判断，而是基于当下技术成熟度和用户真实需求的务实选择。</p>\n  <p>另一种是用户与场景驱动。凡是切用户和场景的，最终都会回归到科技硬件的历史规律，它不是一个“一家通吃”的逻辑，从手机到耳机，都是泛化需求。我们认为记忆也是一个泛化需求，多场景、多人群匹配后，不同方向都有自己的价值。</p>\n  <p>今天谁跑得出来？我对我们当然有信心。<strong>但如果我是投资人，各有道理，有钱就都投一点。</strong>如果是用户，谁满足我的需求、持续给我提供新鲜好用的功能，我就用他们的产品。</p>\n  <p>软件模型几个月就能迭代一版，但硬件公司的链条很长，周期在12到18个月，投入大、注定公司规模不会小。过去从30人团队打到几百人，我们踩过很多坑，这种经历过组织重构的经验，可能在后面反而能成为优势。</p>\n  <p><strong>硬氪：产品上线后目前的人力足以支撑么，大概什么节点会考虑招人？</strong></p>\n  <p><strong>王时远：</strong>随着产品陆续出货和用户反馈，我们要投入到体验迭代中，人员肯定会扩张。</p>\n  <p>后面主要会增加两部分人。一是商业化的销售渠道；我们对亚马逊很熟悉，可一旦进入线下或非英语国家市场，这部分AI目前还无法取代，需要增加人手。产品在北美PMF验证后，我们就会启动这部分人员的招聘。</p>\n  <p><strong>第二个是核心的软件团队；用户量增加后，模型的稳定性、成本都会面临挑战。目前软件部门的人员配置还远远达不到支撑百万、甚至千万量级的水平，接下来也会陆续招人，欢迎对AI硬件创业感兴趣的优秀伙伴关注和加入我们。</strong></p>", "category": "tech", "published_at": "2026-07-01T02:00:00+00:00", "fetched_at": "2026-07-01T03:24:03.967564+00:00", "fingerprint": "9d386dff323fee07"}, {"source": "少数派", "title": "100 天从创意到落地：我们做了一台可以随口问 AI 的对讲机", "url": "https://sspai.com/post/111706", "summary": "前言创业不易，硬件创业更难，尤其是AI硬件创业更是难上加难。难也意味着门槛。在滚滚而来的AI大势之下，门内的景色金光闪闪，首先要做的是迈过这个门槛。准确地说，我的硬件项目正式研发到投产经历了108天。 ...<a href=\"https://sspai.com/post/111706\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-30T03:00:00+00:00", "fetched_at": "2026-07-01T03:24:02.084797+00:00", "fingerprint": "892557745937d6c5"}, {"source": "少数派", "title": "「弯道超车」赛车入门指北：从周五到周日，F1 车队在忙什么？", "url": "https://sspai.com/post/111084", "summary": "理解了这条线，再打开下一场比赛，赛程表就不再只是一堆缩写。<a href=\"https://sspai.com/post/111084\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-30T06:56:46+00:00", "fetched_at": "2026-07-01T03:24:02.084791+00:00", "fingerprint": "96b3bf8741264641"}, {"source": "少数派", "title": "社区速递 147 | 派友的五月好物盘点、测评乱象热议和安伯尼克复古掌机", "url": "https://sspai.com/post/111744", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/111744\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-30T09:02:26+00:00", "fetched_at": "2026-07-01T03:24:02.084783+00:00", "fingerprint": "ed286bcc04df6d61"}, {"source": "少数派", "title": "派早报：Google 推出 Eclipsa Video 视频标准等", "url": "https://sspai.com/post/111773", "summary": "Anthropic 发布 Claude Sonnet 5 和 Claude Science，Google 发布 Nano Banana 2 Lite 和 Gemini Omn "}, {"source": "The Verge", "title": "T-Mobile is booting customers from its oldest plans", "url": "https://www.theverge.com/tech/959144/t-mobile-legacy-plan-retire-sprint", "summary": "Earlier today, T-Mobile started notifying customers that it will be retiring many legacy plans and moving subscribers onto one of its current rate plans. This move includes plans that date back to the 3G era, and it's going about as well as you'd expect. Affected customers began sharing screenshots of the text on reddit and [&#8230;]", "category": "tech", "published_at": "2026-06-29T21:06:14+00:00", "fetched_at": "2026-06-30T02:53:59.278470+00:00", "fingerprint": "e44d2a5282780858"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜百度OCR模型Unlimited OCR在HuggingFace、GitHub四榜登顶；国务院印发《教育发展“十五五”规划》；美国养老金即将被动调仓，300亿美元卖盘“已在路上”", "url": "https://36kr.com/p/3873626425332743?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3874065066366211\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>蜜雪冰城吉尔吉斯斯坦三店同开，已进入海外16个国家</strong></a></p>\n  <p>36氪获悉，近日，蜜雪冰城三家门店在吉尔吉斯斯坦首都比什凯克营业，正式进入吉尔吉斯斯坦市场。吉尔吉斯斯坦是蜜雪冰城在中亚的第二站。2025年4月，蜜雪冰城哈萨克斯坦首店落地阿拉木图。在这之后，又相继进入美国、巴西、墨西哥等新市场，持续推进全球化布局。截至目前，蜜雪冰城已进入海外16个国家。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3874086726096136\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中国移动确认设立Token办公室</strong></a></p>\n  <p>6月28日晚间，有消息称，中国移动继设立数智事业部、算力办之后，又设立了Token办公室，旨在打通“创造Token、输送Token、应用Token”的全流程，打破多个二级部门“各管一摊”的局面。6月29日下午，从中国移动方面获悉，中国移动确实成立了Token办公室，但其余网传内容，如“Token 办公室级别更高，由集团核心领导直接挂帅”等则未获确认。（每日经济新闻）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873834032239621\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>英伟达支持的Firmus与DayOne将在印尼建造AI数据中心园区</strong></a></p>\n  <p>由英伟达支持的数据中心运营商Firmus将在印尼建设一座AI数据中心园区。该公司表示，该项目将在前六年内带来价值高达300亿美元的协议。澳大利亚企业Firmus在一份声明中宣布，已与英伟达达成一项为期八年的合作协议，在印尼巴淡岛建设一座装机容量达360兆瓦的专属英伟达DSX AI工厂园区；该岛屿与新加坡隔海相望。Firmus表示，这一大型数据中心项目将与总部位于新加坡的DayOne联手开发。（新浪财经）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873858183255302\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>百度OCR模型Unlimited OCR在HuggingFace、GitHub四榜登顶</strong></a></p>\n  <p>36氪获悉，近日，百度正式发布并开源端到端OCR模型Unlimited OCR。模型发布次日即登顶GitHub Daily Trending榜、Python榜，在HuggingFace全球模型总趋势榜和多模态模型趋势榜也均排名第一。Unlimited OCR面向长文档解析场景打造，总参数规模3B、推理时激活参数仅约570M。公开评测结果显示，Unlimited OCR在OmniDocBench v1.6基准测试中取得 93.92% 综合成绩，刷新端到端OCR最新纪录。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873872147272963\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>马斯克：SpaceX计划今年每月发布一个全新的人工智能模型</strong></a></p>\n  <p>当地时间周日（28日），马斯克在其社交媒体平台X上发文称，旗下最新一代大语言模型Grok 4.5已正式在SpaceX和特斯拉内部开启Beta测试，之后才会进行更广泛的推广。马斯克还表示，SpaceX计划在今年剩余的时间里每月发布一个“完全从零开始训练”的全新人工智能模型。这番言论暗示，未来的版本可能并非对现有系统的简单改进，而是通过全新训练构建的全新基础模型。（财联社）</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3873761246434312\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“URTOPIA”完成B轮融资，融资总额超2亿元</strong></a></p>\n  <p>36氪获悉，全球智能电助力自行车品牌“URTOPIA”近日已完成B轮融资，融资总额超2亿元人民币。本轮融资由Brizan Ventures与桐乡市政府产业基金领投，高秉强、Kungho Fund、光远和声等机构持续加注。本轮融资完成后，URTOPIA将继续加大在核心技术研发、全球市场拓展、供应链建设和组织能力升级方面的投入，并推动公司从智能电助力自行车品牌，向以户外具身智能和人机耦合智能运动技术为核心的公司发展。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3873989084058889\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Kimi B端负责人黄震昕：行业肯定有泡沫，但基本面很扎实</strong></a></p>\n  <p>“今年以来所有模型厂商都在涨价，核心原因是算力成本在全球范围内上涨，不管海外还是国内的卡，都跟不上token需求的增长。”月之暗面Kimi B端负责人黄震昕在近期一场媒体沟通会上坦言。下游企业AI应用需求爆发式增长，上游算力供给却因芯片产能限制持续紧张。他认为，供需两端的双重挤压下，API价格水涨船高已是必然。他同时回应了外界对行业泡沫的担忧。“现在肯定有泡沫，”他承认，但随即补充道，“Anthropic已经实现了季度盈利，收益是实实在在的。”泡沫存在，但基本面并不空洞，当生产力真实发生质变时，算得过账的企业会持续投入，这正是行业健康度的信号。（21财经）</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3874031847527428\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>国务院印发《教育发展“十五五”规划》</strong></a></p>\n  <p>国务院日前印发《教育发展“十五五”规划》，明确了“十五五”时期加快建设教育强国的目标任务、政策举措和重大项目。规划围绕适应学龄人口变化、支撑国家重大战略、服务现代化产业体系建设，对完善教育资源前瞻布局、强化教育区域布局、优化人才培养布局进行系统部署。规划提出，到2030年，教育强国建设取得显著成效，高质量教育体系基本建成。党对教育事业全面领导的制度体系和工作机制更加完善，德智体美劳全面培养体系更加健全，立德树人成效更加显著，人民群众教育获得感显著增强，教育对科技和人才的支撑更加有力，学习型社会基本形成，我国教育的国际影响力、竞争力和话语权显著提升。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873998802720004\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>2026深圳食博会、渔博会、茶博会即将同日启幕</strong></a></p>\n  <p>2026深圳食博会、深圳渔博会、深圳春季茶博会将于7月2日联袂亮相深圳会展中心（福田）。据了解，三大展会由华巨臣主办，立足粤港澳大湾区世界级消费市场与产业枢纽优势，汇聚全球优质食材、尖端科技企业、地方特色产业集群，打造食品、渔业、茶业一体化商贸平台。三展集结1500+家参展商，覆盖30+国家及地区，配套20余场行业专题论坛，全力推动产业资源高效落地。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873878604502281\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>热浪侵袭欧洲多国，多地接连刷新6月高温历史纪录</strong></a></p>\n  <p>6月，刚刚熬过5月热浪的欧洲再次迎来闷热天气，多地出现破纪录高温。这并不是单独的天气事件，气候变化正让极端天气变得更常见，持续时间也更长。从联合国官员到气候领域科学家都发出警告，全球必须加快应对气候挑战的进程。世界天气归因联盟26日发布的一项最新研究显示，受气候变化影响，欧洲高温天气发生概率已是20年前的200倍。（新华社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873799962137860\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>李在明：韩国需要加快芯片生产基地建设以满足需求，西南地区将在新项目中投资5万亿至20万亿韩元</strong></a></p>\n  <p>韩国总统李在明称，芯片和人工智能领域竞争非常激烈，韩国需要加快芯片生产基地建设以满足需求；将通过投资西南地区扩大芯片供应能力，西南地区将在新项目中投资5万亿至20万亿韩元，光州、全罗可能在项目中投资520万亿韩元。（财联社）</p>\n  <p><a href=\"https://36kr.com/newsflashes/3873886149055495\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>美国养老金即将被动调仓，300亿美元卖盘“已在路上”</strong></a></p>\n  <p>随着2026年上半年临近收官，美国大型养老金计划即将启动半年度资产再平衡操作，市场测算预计将有总计300亿美元的美股资产集中在本周一和周二两日强制抛售。美国公共养老金、企业固定收益养老计划和目标日期基金普遍执行60%股票+40%固收资产的硬性配置框架，该比例写入机构投资政策文件。美国大型养老金的股票仓位已经显著超配，而债券明显仓位不足。因此，在这最后两天的半年度结算窗口中，华尔街分析师预计，一场300亿美元规模的大型抛售冲击将不可避免。（新浪财经）</p>", "category": "tech", "published_at": "2026-06-29T11:00:26+00:00", "fetched_at": "2026-06-30T02:53:59.000874+00:00", "fingerprint": "a059de67ad9a51f8"}, {"source": "36氪 - 最新文章", "title": "烧光5000亿后，京东方开始给股民赚钱", "url": "https://36kr.com/p/3874045136720899?f=rss", "summary": "<p>作者&nbsp;|&nbsp;范亮</p>\n  <p>编辑&nbsp;|&nbsp;张帆</p>\n  <p>很长一段时间里，京东方都是A股“散户大本营”的榜首。2026年一季度，这个位置被紫金矿业和东方财富取代，但京东方仍拥有超过100万名股东。</p>\n  <p>人气足够高，股价却长期止步不前。2001年京东方上市之初，开盘价为3.54元/股（前复权）；到2025年末，收盘价为4.17元/股。二十多年过去，股价累计涨幅只有18%。</p>\n  <p><strong>面板行业的重资产投入和强周期特征，是制约京东方股价表现的核心因素。上</strong>市以来，京东方累计资本开支超过5000亿元，增发募资超过900亿元；累计实现约700亿归母净利润、加回折旧摊销后超过4000亿元的经营净现金流，也大多被继续投入再生产，累计分红规模仅242亿元。因此，京东方长期只能被市场当作周期股来定价。</p>\n  <p><strong>但2026年，京东方让100万股民赚到了钱。</strong>自5月21日行情启动以来，京东方股价至今上涨约60%，创下2009年以来的新高。</p>\n  <p><strong>催化剂来自其与康宁的合作。</strong>5月20日晚，京东方公告称，公司与康宁签署合作备忘录，双方将在玻璃基封装载板、可折叠玻璃、钙钛矿玻璃基板、光互连相关应用等重点领域开展合作。</p>\n  <p>京东方的暴涨，也再一次带火了A股玻璃基板封装概念。那么，京东方这一次能否摆脱面板业务的旧估值体系，进入新的股价平台？</p>\n  <h3><strong>加入算力阵营</strong></h3>\n  <p>简单来说，芯片封装是将裸芯片固定在封装载板上，完成电气互连、散热和机械保护，使芯片能够进一步安装到PCB上，并在终端设备中稳定运行。</p>\n  <p><strong>目前，BT基板、ABF载板等有机封装载板仍是封装市场的主流。</strong>其中，BT载板主要用于存储、消费电子等领域；ABF载板则更多应用于CPU、GPU、AI加速器和网络芯片等高性能产品。</p>\n  <p><strong>对于需要集成HBM的AI芯片，通常还会在芯片与有机载板之间增加硅中介层，</strong>HBM内部依靠TSV实现垂直堆叠互连，而芯片与HBM之间则通过硅中介层实现高速互连。台积电CoWoS-S的典型结构，就是“硅中介层+有机载板”。</p>\n  <p>随着AI芯片集成规模不断扩大，封装尺寸、互连带宽和信号完整性要求持续提升，硅中介层也开始面临尺寸、成本和产能等约束。<strong>采用TGV技术的玻璃基封装载板</strong>，具备低介电损耗、高尺寸稳定性、高平整度，以及适合大尺寸面板级加工等特点，因此<strong>被视为下一代先进封装的重要候选方案。</strong></p>\n  <p>台积电正在开发面板级先进封装CoPoS，市场普遍预计，玻璃基封装载板可能会在相关工艺中发挥重要作用。</p>\n  <p><strong>从产业化进度看，玻璃基封装载板已开始在射频IPD、毫米波器件和CPO等细分领域验证或导入，但在AI芯片封装中的应用仍处于技术验证和产业化早期。</strong>例如，根据TrendForce，OFC 2026光纤通讯大会上，英特尔展示了搭载共封装光学（CPO）技术的玻璃核心基板原型；今年1月，英特尔还发布了全球首款采用玻璃芯载板的商用CPU。</p>\n  <p>根据Yole Group数据，<strong>全球先进IC载板市场规模预计将由2024年的约142亿美元增长至2030年的310亿美元</strong>，对应年均复合增速约14%。广发证券认为，凭借低介电损耗、高尺寸稳定性和高平整度等优势，玻璃基板有望率先在部分高端封装场景中渗透，并逐步替代部分传统有机载板或硅中介层方案。</p>\n  <p>因此，<strong>京东方本质上是借助玻璃基封装载板业务，切入了AI算力叙事，跟上了算力板块的热点。</strong></p>\n  <h3><strong>不是单纯炒概念，但短期没业绩</strong></h3>\n  <p><strong>在整个玻璃基板封装的上下游产业链中，上游为玻璃基板原材料提供商，中游为玻璃基封装载板制造商，下游则为半导体封装厂商。</strong>目前，康宁为上游的玻璃基板原材料提供商，京东方则是玻璃基封装载板制造商的角色。</p>\n  <p>由于LCD、OLED本身就是在玻璃基板上进行TFT电路刻蚀、封装、模组集成等一系列的加工工序，因此其也相应有可以迁移至TGV玻璃基板的技术和制造能力。对TGV玻璃基板业务进展，根据京东方在投资者交流平台的公开披露：</p>\n  <p>公司2020年启动玻璃基载板技术调研，2022年投资3.9亿元建设玻璃基/硅基兼容的晶圆级创新实验平台，<strong>2024年投资9.93亿元建设板级玻璃基封装载板试验线，并于2025年内完成主设备搬入调试，2026年上半年已实现全自动化设备通线。</strong>该试验线设计产能1,000片/月。</p>\n  <p>目前公司<strong>已实现TGV开孔、深孔填铜、增层、布线等玻璃基封装载板全流程工艺拉通</strong>，并于2025年完成大尺寸高层数（9-2-9，20层）玻璃基载板样品开发和送样。公司<strong>目标产品为大尺寸算力芯片先进封装所需的玻璃基载板</strong>，可匹配不同的先进封装方式，目前<strong>已给部分国内客户送样，部分客户已通过概念认证并进入技术测试阶段</strong>。</p>\n  <p>因此，京东方在玻璃基封装载板制造方面已经具备可落地的能力，拿到了玻璃基封装载板的“入场券”，未来则根据送样和认证情况扩建产能。</p>\n  <p>2026年以来算力链条，特别是“达链”相关企业的股价大幅上涨，一个最核心的支撑是，不管未来AI泡沫的叙事是否成立，但这些企业短期内都能交给资本市场一个亮眼的成绩单。</p>\n  <p>那么暴涨后的京东方，能否也在短期拿出超预期的业绩？</p>\n  <p><strong>答案是否定的。对于玻璃基封装载板大规模商业化节点，市场普遍认为在2-3年后才会进入大规模商业化阶段。</strong>例如，英特尔判断其有望在本十年（2020-2030）后半期向市场推出完整的玻璃基板解决方案。台积电目前预计将于今年6月完成其首条CoPoS中试生产线，大规模量产的合理预期时间推测应为2028年至2029年。</p>\n  <p>京东方自身也指出，根据业务发展情况，预计未来2-3年内，都无法对公司经营业绩产生重大影响。</p>\n  <h3><strong>面板要变成现金牛业务？</strong></h3>\n  <p>那么，京东方原有的面板业务，是否可能出现超预期表现？</p>\n  <p>2025年，京东方TFT-LCD销量为9003万平方米，AMOLED销量约226万平方米，二者同比增速均为8%。尽管手机AMOLED单价最高可达到电视LCD的10倍以上，但在京东方收入结构中，LCD营收仍占较大比例，粗略测算超过80%。</p>\n  <p>2026年，受存储价格上涨影响，市场普遍预计手机销量将明显下滑。根据CINNO数据，各类手机面板价格在2026年处于持续下行状态，这将明显冲击京东方AMOLED业务的收入增长。电视面板方面，尽管2026年有世界杯拉动，但Omdia、群智咨询等机构均预测，全年电视面板需求可能有所下滑。</p>\n  <p><strong>这意味着，京东方2026年的营业收入将面临较大增长压力。</strong></p>\n  <p>利润端方面，<strong>公司盈利一方面受面板价格波动影响，另一方面也受产线折旧进度影响</strong>。</p>\n  <p>根据京东方披露，显示行业已从大规模扩产的高速发展阶段，逐步进入成熟期，<strong>公司资本开支金额将逐渐降低。同时，随着存量产线折旧持续减少</strong>，在建产线项目也会综合考虑产能爬坡情况分阶段转固，<strong>公司总体折旧金额将在2025年的基础上开始下降。</strong></p>\n  <p>TCL科技也指出了类似趋势：未来公司资本开支将逐步下降；从折旧金额看，2025年是TCL华星折旧峰值，之后折旧会逐步下降。不过，2026年下降幅度不会特别明显，2027年及以后，折旧降幅会更大。</p>\n  <p>综合来看，京东方2026年的营收增速大概率承压，但净利润和自由现金流，<strong>分别受益于折旧下降和资本开支减少，仍有望保持稳定。</strong></p>\n  <p>对京东方而言，虽然营收会在行业下行阶段承压，但资本开支下降、折旧减少，可能被市场解读为一个拐点式利好：京东方将开始产生更稳定的正向自由现金流，未来也不再需要像过去那样依赖大规模融资。</p>\n  <h3><strong>还能不能涨？</strong></h3>\n  <p>京东方后面还能不能涨，关键不在于玻璃基封装载板短期能贡献多少业绩，而在于市场是否愿意重新定义京东方：<strong>到底还是一家周期面板公司，还是一家拥有稳定现金流、同时带有AI先进封装“期权”的平台型公司。</strong></p>\n  <p><strong>如果京东方面板业务转为现金牛的逻辑成立，那么在玻璃基封装载板AI叙事的加持下，行情可能还没有结束。</strong></p>\n  <p>2025年，京东方EBITDA为464亿元，资本开支为401亿元。过去市场不愿给它高估值，很重要的原因是公司赚到的钱很快又被新一轮产线投资消耗掉，股东很难真正分享到自由现金流。</p>\n  <p>但如果显示行业进入成熟期后，京东方资本开支持续下降，假设未来EBITDA保持稳定、资本开支逐步降至200亿元左右，公司就有望释放约200亿元级别的自由现金流。</p>\n  <p><strong>在此基础上，玻璃基封装载板业务提供的是估值弹性。</strong>其短期难以贡献业绩，但相当于给京东方增加了一个AI先进封装方向的远期期权。只要后续送样、认证、客户导入和产能扩建继续推进，市场就可能继续为这部分想象空间定价。</p>\n  <p><strong>反过来，如果面板业务转为现金牛的逻辑无法兑现，京东方股价大概率仍会跟随算力链情绪波动。</strong>尤其是玻璃基板短期无法释放业绩，一旦算力板块回调，京东方可能面临更剧烈的波动。</p>\n  <p>因此，后续关键观察窗口在中报和季度财报。如果资本开支和折旧确实持续下降，经营现金流保持稳定，那么“面板现金牛+玻璃基板AI期权”的逻辑就会更扎实，股价也更容易进入易涨难跌的阶段。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>", "category": "tech", "published_at": "2026-06-29T11:51:05+00:00", "fetched_at": "2026-06-30T02:53:59.000867+00:00", "fingerprint": "cf1c353e311f6241"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨涉嫌操纵内存价格，存储三巨头遭集体诉讼；韩国启动史上最大规模产业投资计划；哈啰出行回应骑79分钟需支付30元", "url": "https://36kr.com/p/3874911939482880?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>马斯克宣布Grok4.5开启SpaceX与特斯拉内部私测，性能或超越Claude Opus</li>\n   <li>美的回应空调产品在欧洲被疯抢</li>\n   <li>蔚来回应车漆洗车时被冲掉：高压水枪操作不规范</li>\n   <li>滚石唱片就屠颖去世追责万豪喜来登</li>\n   <li>百度昆仑芯拟赴港IPO</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>涉嫌操纵内存价格，三星、SK海力士、美光遭集体诉讼</strong></p>\n  <p>随着全球内存短缺危机加剧，美国当地消费者和小型企业已采取法律行动。据悉，全球最大的三家内存供应商——三星、SK海力士和美光已因涉嫌操纵内存价格并限制全球供应而遭到集体诉讼。诉讼于6月25日在在美国加利福尼亚州联邦法院提起。诉状指出，这三家公司几乎控制着全球DRAM(动态随机存取存储器)市场的全部供应，却在价格大幅上涨期间限制传统DRAM产品供应，进一步加剧了当前的内存短缺危机。值得注意的是，就在几天前，苹果成为最新一家因存储芯片成本上涨而提高部分产品售价的科技公司。此外，多家手机厂商也已纷纷提价。（财联社）</p>\n  <p><strong>韩国启动史上最大规模产业投资计划</strong></p>\n  <p>6月29日，韩国政府宣布迄今规模最大的半导体与人工智能产业投资计划，总投资规模超过5760亿美元，将半导体、物理AI与AI数据中心定位为韩国产业升级的“三角支柱”。三星电子和SK海力士的负责人与李在明一同出席了这场声明发布会。李在明表示，三星和SK海力士将与供应商共同投资800万亿韩元（约合5178.7亿美元），在韩国西南地区各新建两个芯片制造基地。这一计划的目标是五年内将DRAM生产能力翻倍。韩国西南地区城市也将向这些项目投资5至20万亿韩元，此外预计还将有81万亿韩元用于在首尔附近的忠清地区建设芯片封装集群。在“韩国三大超级项目报告会”中，李在明向三星电子会长和SK集团会长90度鞠躬，感谢他们的巨额投资计划。并称他们为“国民英雄”，表示他们做出了艰难抉择。（财经网、新京报）</p>\n  <p><strong>哈啰出行回应骑79分钟需支付30元</strong></p>\n  <p>近日，上海市民吴先生反映称，其在浦东前滩扫了一辆蓝色哈啰单车，骑了79分钟账单显示需支付30元。其儿子骑的“小黄车”同样时间只要6.5元。吴先生查询发现，所骑车辆为哈啰“追风者”共享变速车，前30分钟15元，超出后7.5元/30分钟。吴先生称，车身未悬挂价格提示标语，自己误以为收费标准相同。对此，哈啰客服人员回应称，由于追风者采用高端配置和智能技术，成本较高，所以骑行费用会比共享单车更贵。客服还提醒道：“不同车型的定价会提前在系统内展示，建议用户骑行前留意价格信息，避免误骑高价车辆。”（青年报）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>马斯克宣布Grok4.5开启SpaceX与特斯拉内部私测，性能或超越Claude&nbsp;Opus</strong></p>\n  <p>马斯克当地时间6月28日发文称，旗下最新一代大语言模型Grok4.5已正式在SpaceX和特斯拉内部开启私测。据马斯克透露，Grok4.5基于1.5万亿参数的V9基础模型打造，并在补充训练中特别加入了热门AI编程工具Cursor的数据。早期的评测结果显示，该模型的性能已经接近、甚至可能超越了Anthropic的旗舰模型Claude Opus。目前，强化学习（RL）仍在持续显著地优化该模型，其配套的“GrokBuild”测试基准也在日趋完善。此外，马斯克还表示，SpaceX在今年接下来的时间里，每月都将发布完全从头开始训练的新模型。（界面新闻）</p>\n  <p><strong>DeepSeek V4正式版官宣7月上线，引入峰谷定价机制</strong></p>\n  <p>36氪获悉，DeepSeek团队宣布，DeepSeek V4正式版计划于7月中旬正式上线，本次版本更新将带来更多功能优化和性能提升。同时，为了更合理地配置资源、提升服务稳定性，正式版发布后将同步调整API定价策略，引入峰谷定价机制。API高峰时段价格将是平时价格的2倍，高峰时间段为每天的上午9点到12点、下午2点到6点。</p>\n  <p><strong>百度OCR模型Unlimited OCR在HuggingFace、GitHub四榜登顶</strong></p>\n  <p>36氪获悉，近日，百度正式发布并开源端到端OCR模型Unlimited OCR。模型发布次日即登顶GitHub Daily Trending榜、Python榜，在HuggingFace全球模型总趋势榜和多模态模型趋势榜也均排名第一。Unlimited OCR面向长文档解析场景打造，总参数规模3B、推理时激活参数仅约570M。公开评测结果显示，Unlimited OCR在OmniDocBench v1.6基准测试中取得93.92%综合成绩，刷新端到端OCR最新纪录。</p>\n  <p><strong>谷歌算力告急，限制Meta对其人工智能大模型Gemini的使用</strong></p>\n  <p>谷歌已开始限制脸书母公司Meta对其人工智能大模型Gemini的使用，因为Meta的算力需求超出了谷歌现有的承载能力。供给受限直接打乱了Meta内部多个人工智能项目的推进节奏，相关研发工作被迫推迟。报道称，谷歌这一举措直观暴露出算力供给仍是人工智能产业发展的核心瓶颈。即便谷歌持续加码AI基础设施投入，但依旧无法确保有足够的算力应对市场激增的需求。（财联社）</p>\n  <p><strong>豆包回应“内测社交功能”传闻</strong></p>\n  <p>近期，有传言称，字节跳动旗下豆包大模型正在内测社交功能。6月29日，豆包相关负责人向记者回复，在企业办公场景，豆包是和飞书有一些协同的尝试，未来也会合作更紧密。但豆包没有传闻所说的社交功能计划。（澎湃新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>美的回应空调产品在欧洲被疯抢</strong></p>\n  <p>近日，随着欧洲大陆遭遇史无前例的极端热浪，当地空调迎来销售热潮。中国家电企业美的集团生产的PortaSplit便携式分体空调成为欧洲市场的“抢手货”。面对“一机难求”的火爆局面，美的集团今日对媒体回应称：“热浪显著带动了销售增长，尤其是PortaSplit空调，在部分销售渠道已经售罄。”</p>\n  <p>社交平台上大量欧洲用户分享抢购经历。有德国消费者反映，方圆百公里内的线下门店美的PortaSplit空调全部售罄，有技术爱好者专门搭建了实时库存查询网站，覆盖全德1100余家连锁门店，结果显示1171家门店中仅1家显示有货，该网站甚至顺势推出了每月2.49欧元的到货提醒付费订阅服务。还有欧洲网友为了买一款中国空调，花了两天在全欧盟范围内寻找，最后“跑了200公里才买到最后一台，价格还涨了100欧”。（界面新闻）</p>\n  <p><strong>将非鲜牛奶宣传为鲜牛奶，Costco被罚</strong></p>\n  <p>上海市市场监督管理局网站显示，近日，开市客（中国）投资有限公司因利用广告对商品或服务作虚假宣传，欺骗和误导消费者，被上海市市场监督管理局罚款2.55万元。行政处罚决定书显示，2026年3月13日，当事人为了推销科克兰牛奶，通过自行运营的微信公众号“Costco开市客”发布涉案广告。涉案广告使用了：“家族新成员科克兰鲜牛奶”“科克兰鲜牛奶的原奶，在生乳指标上做到了什么程度？可以这么说，那些反映牧场卫生状况、冷链运输质量奶牛健康、牛奶洁净度的指标，控制得比欧盟要求还严”等表述。根据《国家食品安全标准巴氏杀菌乳》（GB19645-2010）及科克兰牛奶标注的执行标准，科克兰牛奶并非使用巴氏杀菌工艺制得，不能标注为鲜牛奶。（中国新闻网）</p>\n  <p><strong>美国最高法院裁定美联储理事库克留任</strong></p>\n  <p>美国最高法院29日发布裁决，驳回联邦政府请求，美国联邦储备委员会理事库克得以留任。(新华社)</p>\n  <p><strong>近20家半导体企业，开启新一轮涨价潮</strong></p>\n  <p>全球近20家模拟及功率半导体企业即将于7月1日启动新一轮涨价，年内已呈现多批次阶梯式调价特征。不少厂商称当前在手订单饱满，产能能见度显著提升。</p>\n  <p>分析指出，本轮涨价的核心动力，源于晶圆代工和原材料涨价带来的成本压力，与AI数据中心建设带来的功率芯片需求激增形成共振。市场份额将向具备IDM全链条能力或与上游深度绑定、且涉足高景气赛道的头部芯片企业集中。（21世纪财经）</p>\n  <p><strong>蔚来回应车漆洗车时被冲掉：高压水枪操作不规范</strong></p>\n  <p>6月29日，针对近期有车主反馈的蔚来ES9被高压水枪近距离清洗造成的车辆漆面问题，蔚来汽车官方辟谣微博号“蔚来小喇叭”发布“关于高压水枪洗车的小提醒”称：“我们高度重视，已与该车主取得联系并进行了充分沟通，对相关情况进行了全面、专业的现场答疑与解释说明。”</p>\n  <p>蔚来方面指出，高压清洗设备在超出原厂限定工况时，其喷射威力足以对车漆造成不可逆损伤。蔚来方面还表示，蔚来ES9的《用户手册》中已明确载明高压清洗的安全操作规范：建议喷射距离保持在500mm以上，压强控制在100bar以下，最高温度60°C，冲洗时尽量与车表面垂直。（每日经济新闻报道）</p>\n  <p><strong>万达集团，被判向苏宁易购支付17.47亿元</strong></p>\n  <p>6月29日，ST易购(002024.SZ)公告称，公司与子公司苏宁国际诉大连万达集团股份有限公司合同纠纷案获南京市中级人民法院一审判决。法院判令万达集团支付剩余资金及延期付款损失。判决结果显示，万达集团应于判决生效之日起十日内向苏宁易购支付剩余资金17.47亿元，并支付自2024年2月26日起至2026年2月13日止的延期付款损失（按一年期LPR的1.5倍计算）。（财联社）</p>\n  <p><strong>月之暗面声明：未授权任何第三方处理融资交易</strong></p>\n  <p>36氪获悉，月之暗面今日发布严正声明称，近期市场上出现多起假借公司名义传播的不实融资及股权交易:信息，部分机构和个人已涉嫌欺诈。月之暗面表示，所有融资活动由公司直接负责，未聘任或授权任何第三方机构作为财务顾问、融资顾问处理任何融资交易，包括新股交易和老股转让交易。公司老股(含普通股、激励股权等)转让必须经内部批准方可进行，未经批准的老股交易一律无效，将拒绝予以任何形式的确权登记，并保留采取一切法律手段追究转让方违约责任的权利。</p>\n  <p><strong>消息称快手社科线两位技术高管转岗可灵事业部，或为上市做准备</strong></p>\n  <p>有市场消息称，快手社区科学线人事调整，两位核心技术高管李晗、洪立印已完成岗位划转，正式加入可灵AI事业部，该事业部负责人为快手高级副总裁盖坤。两位技术负责人同步转岗，直接增强可灵在底层大模型、视频生成、商业算法等板块的技术实力。业内分析认为，两位推荐与电商算法领域的核心大将同:时调入，是为可灵冲刺资本市场进行的关键技术底盘补强。对此消息，快手官方暂无回应。（新浪科技）</p>\n  <p><strong>滚石唱片就屠颖去世追责万豪喜来登</strong></p>\n  <p>6月29日，滚石唱片发布关于屠颖不幸事件联合声明，就去年11月发生的著名音乐人屠颖去世事件喊话万豪集团公开道歉。该份声明的声明人还包括屠颖的家属冯苓仪和屠衡、星统寰宇文化发展（北京）有限公司。联合声明称，对万豪集团旗下越秀福朋喜来登酒店在本次事故发生与急救过程中的错误与缺陷以及事故发生后的不负责任态度表示失望。声明指出了酒店方存在健身房地板并无良好缓冲、没有配备AED设备、第一位到达事发现场的酒店工作人员竟是实习生等七失职大问题。6月29日，记者致电涉事酒店，工作人员回复界面新闻称，关于此事不便透露，“很多信息我们也不太清楚”，建议记者发邮件跟酒店管理团队沟通。（界面新闻）</p>\n  <p><strong>大疆辟谣“上调全系产品价格”</strong></p>\n  <p>近日，有传闻称，大疆全系产品将于2026年7月15日起调价，涨幅为3%-8%。针对该说法，大疆方面6月28日对蓝鲸科技记者回应表示，消息不实，纯属谣言；目前大疆官方指导价保持稳定，没有网传的全系调价计划。同日稍早之前，社交平台上出现了一张“关于大疆全系产品价格调整的通知”的截图。该截图显示，由于全球供应链成本、核心元器件及物流费用的上升，大疆计划上调价格。其中，Osmo Pocket 3标准套餐的价格将从2299元涨至2399元；Osmo Pocket 4标准套餐的价格将从2999元涨至3299元；Osmo Pocket 4P的标准套餐价格将从3799元涨至3999元。（蓝鲸新闻）</p>\n  <p><strong>欧盟委员会总部“分楼层开空调”引发争议</strong></p>\n  <p>近日，在热浪席卷欧洲之际，位于比利时布鲁塞尔的欧盟委员会总部却因“只为欧盟委员会主席冯德莱恩等高层提供凉爽的办公环境”引发争议。欧盟委员会总部贝雷蒙大楼共13层，冯德莱恩的办公室在13层，多数欧盟委员及高级官员的办公室在8层及以上，而1层至7层为其他工作人员办公区。受极端高温天气影响，贝雷蒙大楼电力供应系统不堪重负，不得不关闭部分楼层空调。26日中午，楼内工作人员收到一条紧急短信通知，称当天余下时间将强制关闭1至7层空调，8层及以上则维持正常运行。此举随即引发低楼层工作人员的强烈不满，纷纷指责此举“封建”而“可耻”。（央视新闻）</p>\n  <p><strong>SpaceX推动美股发行规模创下2510亿美元的半年最高纪录</strong></p>\n  <p>在SpaceX和谷歌母公司Alphabet创纪录的发行活动后，华尔街银行家们情绪高涨，这些交易提振了人们对2026年下半年交易活动的预期。汇编的数据显示，不包括特殊目的收购公司和其他投资工具，截至6月26日，今年美国IPO和股票发行总额达到创纪录的2510亿美元。这一数字超过了2021年发行热潮期间创下的半年最高纪录。（新浪财经）</p>\n  <p><strong>科创板成交额创历史新高</strong></p>\n  <p>6月29日A股在科创板带领下继续上涨，科创50上涨超过4.61%，报收2126点，成交2300亿元。科创综指上升3.12%，报收2416.67点，成交6062.66亿元，突破了5月21日的5804亿元，创出历史新高。在第一财经记者采访的业内人士看来，科创板成交创新高之后，显示资金对行情依然乐观，预计结构性行情有望延续，接下来半年报逐步披露将会主导行情，而其他落后的板块也有补涨空间，投资者可以根据增持回购信息，买入相应蓝筹股进行组合上的“再平衡”。（第一财经）</p>\n  <p><strong>大众汽车计划终止与博世的自动驾驶合作</strong></p>\n  <p>近日，德国汽车制造商大众汽车计划终止与汽车供应商博世在自动驾驶领域的合作。据了解，此举是该公司为削减成本、提升竞争力而采取的更广泛举措的一部分。对此，博世和Cariad发表联合声明称，他们不就市场传闻置评。消息人士称，该项目在投入约15亿欧元(17.1亿美元)后，未能达到预期。该报补充称，大众目前正在物色替代合作伙伴，计划于9月前签订合同。（新浪财经）</p>\n  <p><strong>苹果正考虑最早于2028年在其旗舰智能手机SoC中采用1.4nm工艺技术</strong></p>\n  <p>苹果正考虑最早于2028年在其旗舰智能手机SoC中采用1.4nm工艺技术，这意味着采用2nm工艺制造的旗舰芯片的生命周期可能只有大约两年。（台湾电子时报）</p>\n  <p><strong>信用卡App退场，行业迎来经营模式重构</strong></p>\n  <p>6月30日，中国银行信用卡App“缤纷生活”将全面停止服务，相关功能迁移至“中国银行”App。过去几年间，在优化成本的考量下，中小银行纷纷放弃开发信用卡独立App，将其功能合并至手机银行App中，国有大行、股份行、中小银行亦陆续关停线下异地分中心。线上整合、线下关停，国内信用卡行业正告别粗放扩张周期，迎来经营模式重构。（证券时报）</p>\n  <p><strong>美股三大指数集体收涨，大型科技股多数上涨</strong></p>\n  <p>36氪获悉，6月29日收盘，美股三大指数集体上涨，纳指涨2.07%，道指涨0.59%，标普500指数涨1.17%。大型科技股多数上涨，特斯拉涨超8%，SpaceX涨超7%，谷歌涨超4%，亚马逊涨超3%，Meta涨超2%，英伟达涨超1%，微软跌超1%，苹果小幅下跌。热门中概股集体走强，百度涨超7%，小鹏汽车涨超5%，网易涨超4%，哔哩哔哩、爱奇艺涨超2%，蔚来涨超1%，阿里巴巴小幅上涨，理想汽车跌超1%，京东、拼多多小幅下跌。</p>\n  <h2>上市进行时</h2>\n  <p><strong>Momenta正式启动招股</strong></p>\n  <p>36氪获悉，6月29日，物理AI公司Momenta披露全球发售文件，正式启动招股，并计划以“6880”为股票代码在港交所挂牌上市，成为“物理AI第一股”。Momenta本次IPO计划全球发售19938300股，其中香港发售1993840股，国际发售17944460股，分别占全球发售股份总数的10%和90%;此次发行另配有15%的绿鞋(超额配股权)机制。最终上市定价为295.6港元，在不考虑绿鞋行使的情况下，预计总募资额约为58.9亿港元。</p>\n  <h2>投融资</h2>\n  <p><strong>“CAYE咖爷科技\"完成近4亿元B轮融资</strong></p>\n  <p>36氪获悉，商用全自动咖啡机品牌“CAYE咖爷科技\"已完成近4亿元B轮融资，本轮融资由老股东美团龙珠领投，柏睿资本、高瓴创投、苏创投等机构联合跟投。这也是目前商用全自动咖啡机赛道规模最大的单笔融资。</p>\n  <p><strong>智平方完成近50亿元新一轮融资，估值已超200亿元</strong></p>\n  <p>具身智能企业智平方近日完成了新一轮融资，融资总额近50亿元人民币(约7亿美金)，估值升至超200亿元人民币。智平方方面告诉记者，本轮融资后，公司将加速推进“机器人大脑”的迭代升级与规模化量产进程，进一步夯实“模型X硬件X场景”三位一体能力。（财联社）</p>\n  <p><strong>“URTOPIA”完成B轮融资，融资总额超2亿元</strong></p>\n  <p>36氪获悉，全球智能电助力自行车品牌“URTOPIA”近日已完成B轮融资，融资总额超2亿元人民币。本轮融资由Brizan Ventures与桐乡市政府产业基金领投，高秉强、KunghoFund、光远和声等机构持续加注。本轮融资完成后，URTOPIA将继续加大在核心技术研发、全球市场拓展、供应链建设和组织能力升级方面的投入，并推动公司从智能电助力自行车品牌，向以户外具身智能和人机耦合智能运动技术为核心的公司发展。</p>\n  <p><strong>“纬钛机器人”完成Pre-A轮融资</strong></p>\n  <p>36氪获悉，近日，“纬钛机器人”宣布完成新一轮Pre-A轮融资，由红鸟启航基金领投，领屹投资、永鑫方舟、韦豪创芯、宁波吉德等产业投资方联合参投，上海天使会联合投资，多家老股东继续加持，投中资本担任本轮融资独家财务顾问。本轮融资将用于视触觉感知技术的持续迭代、执行器的落地、视触觉的数采和模型的闭环以及研发团队的扩充，同时进一步拓展海外市场，构建全球竞争力。</p>\n  <p><strong>整理</strong>｜王倚轩</p>", "category": "tech", "published_at": "2026-06-30T00:05:46+00:00", "fetched_at": "2026-06-30T02:53:59.000860+00:00", "fingerprint": "ff2fee7b79f9cdf4"}, {"source": "36氪 - 最新文章", "title": "36氪官方福利来袭！15秒体验股市情报工具，免费抽取定制周边好礼~", "url": "https://36kr.com/p/3873992162382849?f=rss", "summary": "<h3><strong>官方免费抽奖来袭，15秒体验即可参与领周边</strong></h3>\n  <p>无门槛，所有微信用户都能参与，纯粹是36氪给各位投资者的专属福利。</p>\n  <p>只需打开微信，扫描下方识别小程序码进入36氪企业全情报，<strong>浏览15秒资讯后任意订阅一家企业</strong>，就能参与免费抽奖，多款36氪官方定制实用周边随机送出，中奖机会人人有。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260629/v2_fda515a56ebe4140ae7bd5eb0f14155d@5284654_oswg279049oswg600oswg1062_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">扫描二维码参与抽奖！</p>\n  <p><strong>本次活动丰厚奖品清单：</strong></p>\n  <p><strong>🏆一等奖：36氪专属跪地外星人摆件</strong>，精致金属质感造型，摆放在办公桌、书桌氛围感拉满，看盘间隙舒缓心情；&nbsp;</p>\n  <p><strong>📖二等奖：36氪专属读物《精英的傲慢》</strong>，深度剖析当下经济与社会分层逻辑，适合投资者闲暇阅读拓展认知；&nbsp;</p>\n  <p><strong>🥤三等奖：36氪专属竹节吸管杯</strong>，耐高温高颜值，日常看盘、办公、外出携带喝水都十分实用。</p>\n  <p><strong>不用花费一分钱，既能体验覆盖全市场的专业大数据舆情工具，补齐自身投资信息短板，还有机会把精美官方周边带回家。</strong></p>\n  <p>有炒股、复盘、研究赛道需求的各位投资者，千万别错过这次36氪官方专属福利，现在扫码进入小程序，简单体验就能参与抽奖！</p>\n  <p>&nbsp;</p>\n  <h3><strong>为什么同样一条消息，有人赚钱，有人却总是慢一步？</strong></h3>\n  <p>在A股，很多时候拼的不是技术，而是<strong>信息获取的速度</strong>。</p>\n  <p>不少投资者都有过这样的经历：股价涨了才看到利好，收盘后才发现公告，复盘时翻遍各个平台，还是理不清一家公司到底发生了什么。</p>\n  <p>问题不是没有信息，而是<strong>信息太分散、更新太快，找起来太费时间。</strong></p>\n  <p>为了帮助投资者更高效地获取市场信息，36氪联合红麦数据推出了<strong>36氪企业全情报</strong>微信小程序。</p>\n  <p>平台聚合上市公司公告、财经快讯、行业政策、机构研报、产业链动态、投资者互动及全网舆情等信息，让分散在多个平台的内容一站式呈现。搜索一家公司，即可快速查看企业最新动态和市场关注热点。</p>\n  <p>面对海量资讯，平台还结合AI能力，对事件进行智能梳理，帮助用户更快理解消息背后的影响，减少搜集和整理信息的时间，让盘中看热点、盘后做复盘更加高效。</p>\n  <p>无需下载App，<strong>打开微信搜索「36氪企业全情报」即可使用。</strong></p>\n  <p><strong>或手机直接点击：</strong></p>\n  <p><a href=\"https://link.wtturl.cn/?target=https%3A%2F%2Fchannel.36kr.com%2Fapi%2Fx%2Fwechat%2FurlLink%3FchannelId%3D1%26path%3D%2Fpages%2Fhome%2Findex&amp;scene=im&amp;aid=497858&amp;lang=zh\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>https://link.wtturl.cn/?target=https%3A%2F%2Fchannel.36kr.com%2Fapi%2Fx%2Fwechat%2FurlLink%3FchannelId%3D1%26path%3D%2Fpages%2Fhome%2Findex&amp;scene=im&amp;aid=497858&amp;lang=zh</strong></a></p>\n  <p>市场变化越来越快，信息获取效率，也正在成为投资决策的重要一环。早点看到，早点理解，也许就能多一分主动。</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-06-30T02:12:59+00:00", "fetched_at": "2026-06-30T02:53:59.000851+00:00", "fingerprint": "c295fbb0818dc787"}, {"source": "36氪 - 最新文章", "title": "36氪首发｜前百度自动驾驶与机器人实验室主任创业，天使轮融资数千万，做机器人“世界通行模型”", "url": "https://36kr.com/p/3875059110221064?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，具身智能公司纽娲机器人近日完成5000万元天使轮融资，由蓝湖资本领投，不同资本、共青城朴一投资跟投。两个月前，纽娲机器人曾完成由Plug and Play中国基金领投的种子轮融资。</p>\n  <p>纽娲机器人（下称“纽娲”）成立于2026年2月，半年不到的时间已先后获得多家财务、产业基金投资。创始人杨睿刚博士，长期从事3D视觉、仿真技术和自动驾驶/机器人研究，曾任百度自动驾驶与机器人实验室主任，并曾任自动驾驶卡车企业嬴彻科技CTO，推动L3级自动驾驶重卡量产落地，具有丰富的产业与创业经验，目前为上海交通大学特聘教授。</p>\n  <p>随着具身智能赛道持续升温，“具身不存在大一统模型”正逐渐成为行业共识。</p>\n  <p>当前，头部玩家普遍认同“分层解耦”是必由之路，但解耦的维度不同。海外玩家多按推理时间尺度解耦：Figure 的 Helix（System 1 / System 2，后扩展至 System 0）与 NVIDIA 的 GR00T N1，都是分离“慢思考”的规划层与“快反应”的控制层。国内玩家多按能力类型拆分：智元“一体三智”拆分 Locomotion、Manipulation、Interactive；腾讯 Robotics X 的 SLAP 架构解耦感知、学习、规划、执行四层；千诀科技走“类脑分区”路径。</p>\n  <p>基于此，<strong>纽娲选择从机器人最基础的“通行能力”切入，提出“具行智能”（Embodied Mobility Intelligence）的概念，并自研“世界通行模型（WTM）”</strong>，帮助机器人像人类一样，在复杂的人类社会环境中自主移动、导航、交互并完成任务。</p>\n  <p>这一能力不只服务于人形机器人，可以同时兼容四足机器人、AGV、无人配送车等各类移动机器人平台。创始人杨睿刚表示，无论是社区配送、园区物流、还是文旅度假服务，其底层都指向同一个问题——机器人如何在人类环境中安全、高效且优雅完成任务，这也是纽娲“世界通行模型（WTM）”的必要性。</p>\n  <p>与当前行业大量围绕视觉生成和内容生成构建世界模型不同，纽娲认为机器人真正缺少的是能够理解物理规律并指导行动的能力。<strong>公司定位“具行智能”大脑公司，构建了一套从仿真到数据再到模型训练的技术体系。</strong></p>\n  <p>在渲染层，通过三维重建与AIGC技术保证空间一致性；在仿真层，通过显式三维结构与自研物理引擎保证物理规律的准确表达；在数据层，则利用前两层能力持续生成可交互、物理正确、三维一致的高质量合成数据，最终形成训练世界通行模型所需的数据飞轮。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260630/v2_22e79eea43ba4420bb3641158edc528f@5920579_oswg128079oswg656oswg593_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/火树资本）</p>\n  <p>此前，<strong>纽娲自研的高保真物理仿真引擎SimWeaver，相较英伟达ISAAC Sim，生成速度提升3倍，仿真到真实迁移的误差大幅降低20%, 在多个柔性体操作的任务上实现了91%的零样本（Zero-shot）成功率。</strong></p>\n  <p>据介绍，在世界通行模型训练方面，纽娲也已经取得多项阶段性进展。</p>\n  <p>其中，在运动控制（Locomotion）能力上，公司自研模型已经能够稳定通过55度空心楼梯等复杂场景。杨睿刚表示，这一能力来自视觉感知与本体感知的深度融合。相比部分现有方案主要依赖运动控制策略进行“盲爬”，纽娲的系统能够理解哪些区域可踩、哪些区域不可踩，从而显著提升复杂环境下的运动稳定性。</p>\n  <p>导航能力（Navigation）方面，相比当前大量物流机器人依赖高精地图完成路径规划，纽娲正在推进无图或轻地图导航方案，仅通过小区平面图或高德、百度等通用导航地图，即可实现室内外、平地与楼梯之间的三维自主导航。</p>\n  <p>此外，纽娲还将“社会行为合规性”（Social Ethic）视为世界通行模型的重要组成部分。与自动驾驶主要运行于道路环境不同，机器人未来将直接进入人类生活空间。如何在电梯、商场、园区等公共场景中遵守人类默认行为规则，是机器人规模化落地绕不开的问题。目前，纽娲正在重点攻关电梯场景中的社会行为学习，通过大量数据训练机器人理解“先下后上”“排队等待”“主动礼让”等社会规则。</p>\n  <p><strong>以下是硬氪与创始人杨睿刚交流节选：</strong></p>\n  <p><strong>硬氪：您在自动驾驶领域有丰富的经验，做机器人的世界通行模型时，自动驾驶的哪些经验能够迁移到机器人，哪些需要重新建设？</strong></p>\n  <p><strong>杨睿刚：</strong>数据闭环这件事，机器人和自动驾驶其实是一回事。从数据采集、标注、到模型迭代，整个逻辑是完全一样的。工程化那套体系也可以直接用。自动驾驶在CI/CD、仿真测试、灰度发布这些环节上已经做得非常成熟、非常严格——我们在嬴彻做量产L3重卡，这套东西是真正跑通过的，不是纸上谈兵。这部分经验直接带过来就行。</p>\n  <p>往大了说，自动驾驶解决的是结构化道路上的自主通行，WTM其实就是把这个能力往前推一步——从结构化的高速公路，延伸到楼道、电梯、门禁这些更复杂、更“人”的环境。框架是继承的，但难度确实上了一个台阶。</p>\n  <p><strong>真正需要重新建的，是“具身操作”这块——就是机器人怎么去开门、按电梯、搬东西，跟物理世界产生真实的交互。</strong>这个在自动驾驶里完全没有对应的东西，得从零做。我们现在的打法是把团队在三维重建和物理仿真上的积累用起来，用合成数据来加速这部分的训练，这是我们能比别人快的地方。</p>\n  <p><strong>硬氪：相比其他做VLA和世界模型的公司，纽娲提出的“世界通行模型”最大的技术差异化是什么？</strong></p>\n  <p><strong>杨睿刚：</strong>李飞飞教授将世界模型分为三层：渲染器（Renderer）、仿真器（Simulator） 和 预测器/规划器。其中，渲染器处理观测数据（observation in → observation out），如VLA模型直接从图像做规划；仿真器则在隐空间中进行未来状态的预测；而真正的生成式世界模型，试图将渲染与仿真融合，通过三维对齐和视频动力学习来驱动规划。</p>\n  <p>但当前行业的核心瓶颈在于：数据质量决定了策略性能，而具身智能最缺的就是高质量、可交互、物理正确的训练数据。</p>\n  <p>纽娲的路径是，我们先把世界模型当作一个数据生成器来构建。在渲染器层面，我们通过三维重建 + AIGC 保证空间一致性；在仿真器层面，我们在显式三维结构上叠加自研的SimWeaver仿真器，确保物理规律（如牛顿力学）的正确性。由此，我们能够生成大量、可交互、物理正确、空间一致的数据，用来训练我们的世界通行模型（World Travelers Model / WTM）。</p>\n  <p>我们不是在做一个大一统的端到端世界模型，而是用可工程化的方式，将渲染器与仿真器解耦再协同，先把数据生成的飞轮跑通，再让大脑（WTM）在海量高质量数据中学会真正的“世界通行能力”。这也是我们一直在推进的核心技术路线。</p>\n  <p><strong>硬氪：未来一到两年公司有什么具体的落地规划吗？</strong></p>\n  <p><strong>杨睿刚：</strong>&nbsp;2026年，我们计划将世界通行模型率先部署到1至2个真实应用场景，包括物流客户、产业园区以及文旅度假区等，并重点验证两项核心能力：无图导航和环境零改造部署，也就是无需额外安装传感器或改造门禁系统即可完成落地。</p>\n  <p>第二阶段，我们将进一步扩大运营规模，在更多场景验证模型的泛化能力和商业可行性。</p>\n  <p>第三阶段，我们计划实现自研机器人本体量产，通过软硬件协同降低整体系统成本。同时向更多系统集成商开放世界通行能力，兼容AGV底盘、双足机器人等不同平台，逐步形成通用化的机器人通行解决方案。</p>\n  <p><strong>投资方观点</strong></p>\n  <p><strong>蓝湖资本合伙人魏海涛表示：</strong>作为专注投资新质生产力的基金，我们投资纽娲并坚定看好杨睿刚教授团队，是因为其“具行智能”精准击中了具身领域的一个核心痛点——机器人不仅要“会操作”，更要“能抵达”。团队以自研的显式3D几何与物理规律为基础的世界模型底座，聚焦构建机器人开放世界通行的通用能力模型（World Traversal Model），实现自主、安全、优雅的智能导航，打通行业规模化的关键瓶颈。蓝湖资本非常荣幸能领投本轮融资，并长期陪伴纽娲，共同开启“具行智能”的新纪元。</p>\n  <p><strong>不同资本投资人表示：</strong>杨教授团队兼具世界模型研发与产业真实落地双重背景，通过其过往在 3D 视觉、物理仿真、自动驾驶与机器人等领域积累的丰富经验，开创性提出了“具行智能”的技术概念，聚焦机器人在开放人类环境中的通行、导航与社会行为理解，并以高质量合成数据、自研物理仿真引擎和世界通行模型为核心构建技术闭环，有望率先实现“一脑多型”机器人在真实生活场景中的规模化落地。</p>", "category": "tech", "published_at": "2026-06-30T02:35:33+00:00", "fetched_at": "2026-06-30T02:53:59.000816+00:00", "fingerprint": "c084b3931e52636d"}, {"source": "少数派", "title": "让音乐「更好听」的代价：可视化谈频响、动态与不可逆损失", "url": "https://sspai.com/post/111462", "summary": "越是优化的声音系统，越容易在某些类型的音乐上暴露疲劳感；而越是追求响度，也越容易在归一化之后原形毕露。<a href=\"https://sspai.com/post/111462\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-29T03:14:58+00:00", "fetched_at": "2026-06-30T02:53:57.313960+00:00", "fingerprint": "178656487f979958"}, {"source": "少数派", "title": "在格鲁吉亚的大地上：徒步篇", "url": "https://sspai.com/post/111369", "summary": "Matrix首页推荐Matrix是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选Matrix最优质的文章，展示来自用户的最真实的体验和观点。文章代表作者个人观点 ...<a href=\"https://sspai.com/post/111369\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-29T07:00:10+00:00", "fetched_at": "2026-06-30T02:53:57.313954+00:00", "fingerprint": "e0d5f09d85e7fd63"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/111697", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/111697\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-29T09:52:35+00:00", "fetched_at": "2026-06-30T02:53:57.313946+00:00", "fingerprint": "6b0c59e6dd40d726"}, {"source": "少数派", "title": "派早报：DeepSeek V4 正式版 7 月中旬上线等", "url": "https://sspai.com/post/111707", "summary": "少数派的近期动态少数派×AKKO联合共创带屏键盘计划于7月9日开启。预约直播WWDC26专题页已全部更新完成。点击回顾尝鲜27系列新系统的朋友，你的满意度如何？来一派投票你可能错过的文章让音乐「更好听 ...<a href=\"https://sspai.com/post/111707\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-30T00:24:31+00:00", "fetched_at": "2026-06-30T02:53:57.313934+00:00", "fingerprint": "348ad7b7ded3daad"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.6877 CNY ↓-0.10%", "url": "https://www.frankfurter.app/2026-06-29?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-0
