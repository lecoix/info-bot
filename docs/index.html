大新闻</h2>\n  <p><strong>八家上市公司集中公告“补税”&nbsp;</strong></p>\n  <p>6月1日至6日，不到一周内，八家A股上市公司先后披露补缴税款公告。这八家公司合计补缴税款及滞纳金约4亿元。其中，苹果中国最大授权经销商爱施德（002416.SZ）一家补缴3.08亿元，占八家总额的近八成，该公司披露，仅滞纳金就达1.23亿元。对部分公司而言，这笔补缴金额已接近甚至超过去年一整年的利润。如电子材料企业宏昌电子（603002.SH）需补缴4041.91万元，而公司2025年全年归母净利润为3537.17万元。</p>\n  <p>八家公司公告的核心表述一致——均已全部缴纳完毕，均不涉及行政处罚，均引用《企业会计准则第28号》认定不属于前期会计差错、不追溯调整前期财务数据，补缴金额均计入2026年度当期损益。但逐份比对可以发现，八家公司的补缴金额差距悬殊，启动自查的原因也不尽相同。（财经社）</p>\n  <p><strong>OpenAI正准备对ChatGPT进行上线以来最大幅度升级</strong></p>\n  <p>OpenAI正准备对ChatGPT进行上线以来最大幅度升级，此次升级也引爆了人工智能热潮。这家估值8500亿美元的集团计划在今年上市前寻找新的增长引擎。该公司打算将这款聊天机器人转型为“超级应用”，整合编程工具与人工智能智能体，新增多款高管认为能带来更高收入的产品。据十多位现任及前任员工透露，这些调整是OpenAI整体重组计划的一部分。这家总部位于旧金山的公司正调配资源，全力争取高利润企业客户，并与竞争对手Anthropic展开更激烈的竞争。此次调整将提升OpenAI编程产品Codex的地位并增加资源投入，反映出公司内部日益坚定的共识：人工智能的未来并非回答问题的聊天机器人，而是能为用户执行任务的智能体。（新浪财经）</p>\n  <p><strong>高考新增AI监考员：考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认&nbsp;</strong></p>\n  <p>6月7日，2026高考第1天。高考期间，各地运用智能巡查系统和智能安检门等科技手段，严防作弊。在北京市第二中学考点，考场贴出纪律提示，明确禁止携带智能眼镜进入考点；在广东广州，各考点重点增强了安检门对智能眼镜等隐蔽式穿戴设备的识别能力。AI智能巡查系统也在多地考场投入使用。考试过程中，一旦AI识别出考生或监考员有异常行为，监控系统会自动截取异常行为前后的录像片段，供审核员进一步确认。（央视新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>京东与腾讯就AI Agent将达成重要合作</strong></p>\n  <p>6月7日晚间消息，京东与腾讯将围绕AI Agent展开深度合作。依托京东的商品供应链、履约服务能力及腾讯的生态入口优势，双方将共同打造跨场景的智能化服务新范式，推动AI Agent从单点应用走向生态协同。（新浪科技）</p>\n  <p><strong>多家供给方下调算力价格，算力普惠再提速</strong></p>\n  <p>随着全国算力基建规模化、标准化不断提速，多家算力价格也迎来持续普惠。让曾经昂贵的“高端稀缺资源”变身为各行各业可普惠使用的“数字水电”。前不久，多家模型厂商宣布永久下调算力价格，其中DeepSeek与小米MiMo降价尤为显著，最高降幅接近99%。极大降低了用户日常高频问答、网页设计、代码编程等多场景AI使用成本，让各类轻量化、常态化AI应用告别高门槛、高成本的制约。（央视新闻）</p>\n  <p><strong>OpenAI芯片元老“002号员工”转投Anthropic</strong></p>\n  <p>OpenAI自研芯片项目的“002号员工”Clive Chan在X平台发文宣布，自己已离开OpenAI，并于本周正式加入Anthropic。这一消息迅速引发业界广泛关注，被视为AI领域大模型竞争从模型、产品层面向芯片和算力基础设施层延伸的又一信号。Chan的履历令人瞩目，曾在OpenAI、特斯拉、谷歌、SpaceX等多家明星公司工作或实习，长期深耕AI基础设施。他于2021年毕业于加拿大滑铁卢大学，毕业后加入特斯拉Autopilot深度学习基础设施团队，在近三年时间里负责GPU优化、集群调度、数据中心软件及训练基础设施等工作。2024年1月，Chan正式加入OpenAI，担任技术团队成员，参与自研AI芯片项目建设。（新浪财经）</p>\n  <p><strong>AI等机器网络请求量首超人类</strong></p>\n  <p>全球最大的互联网托管服务商之一——云网络安全服务公司发布的最新数据显示，在其托管网站收到的网络访问请求中，约57.4%来自人工智能和自动化程序，42.6%来自人类用户。该公司称，这是互联网历史上来自人类的网络访问请求数量首次被机器超越。(央视新闻)</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>小米机器人或将亮相小米17T发布会</strong></p>\n  <p>卢伟冰发布视频，探班小米17T发布会主讲人TJ的彩排，还送上保温杯和润喉糖。视频中出现了小米机器人的手臂，他们还一起碰拳加油，疑似小米机器人也将在发布会中亮相。（新浪财经）</p>\n  <p><strong>国际金价跌破4400美元/盎司关口，金饰克价一夜大降近40元</strong></p>\n  <p>当地时间6月5日，国际金价明显回调，跌破4400美元/盎司关口。受国际金价下行影响，国内品牌金饰价格同步回落。6月6日，周大福足金饰品价格报1323元/克，相较于5日1360元/克下跌37元；周生生报1315元/克，相较于5日1354元/克下跌39元；老凤祥报1316元/克，相较于5日1352元/克下跌36元，整体回落至2025年底水平附近。（央视财经）</p>\n  <p><strong>SpaceX IPO已获得2倍认购资金</strong></p>\n  <p>据两名知情人士6月5日透露，SpaceX本次IPO获约1500亿美元投资者认购资金，认购额度达募资计划的两倍。作为史上规模最大IPO，该认购热度已十分亮眼。知情人士提示，项目目前仍处于前期推介阶段，大型机构资金往往在IPO申购末期才递交订单，当前统计数据仅为意向申购，并非最终配售额度，实际获配数量将在定价环节敲定。（第一财经）</p>\n  <p><strong>年内32款燃油车降价</strong></p>\n  <p>乘联分会秘书长崔东树提供的最新数据显示，2026年1~5月，共有32款常规燃油车出现降价，较去年同期增加13款。纵观整个市场，今年1~5月降价规模为77款，较同期少4款。这意味着，常规燃油车降价车型数量整体占比超过40%且增速加快，带动大盘整体向下。从月度走势看，燃油车的降价节奏也有所加快。2026年5月全市场共有20款车型降价，较去年同期增加7款。其中纯燃油车型7款，较同期多5款；插混车型7款，较同期多4款。从降价力度看，常规燃油车的价格下调幅度同样处于高位。今年5月，常规燃油车新车降价车型均价为16.6万元，平均降价金额为2.5万元，降价幅度达到14.9%。今年前5月，总体乘用车市场新车降价车型均价24.1万元，降价力度算术平均达到3.2万元，降价力度13.1%。（第一财经）</p>\n  <p><strong>瑞幸咖啡回应拿铁去冰仅半杯</strong></p>\n  <p>6月6日，“瑞幸去冰不补液”一事引发消费者热议。有消费者反映，在瑞幸咖啡下单超大杯拿铁并选择“去冰”后，到手饮品仅勉强过半杯，店员解释称“公司标准配方固定，去冰不补液”。针对这一情况瑞幸咖啡方面回应称，已关注到近期关于产品“去冰”的相关讨论，公司对此高度重视。（新京报）</p>\n  <p><strong>宗馥莉自有品牌KELLYONE回归</strong></p>\n  <p>宗馥莉自有品牌KELLYONE悄然回归。KELLYONE近日推出新品果汁汽水—果然啵啵，售价每瓶为3元起，分为柠檬味、西柚味两种口味，销售区域暂限定于江浙沪。目前该产品已经上架叮咚买菜等平台，不过娃哈哈相关旗舰店并未上线该产品。KELLYONE是宗馥莉主导下宏胜饮料集团的自有品牌，“Kelly”为宗馥莉英文名，该品牌于2025年“娃哈哈风波”前后已停摆。近日，KELLYONE推出新品“果然啵啵”果汁汽水，也宣告着品牌重启。（财联社）</p>\n  <p><strong>多家低成本航空公司对登机箱登机收费</strong></p>\n  <p>近期，不少民航旅客反映自己携带20英寸“登机箱”乘坐飞机，却在登机口被拦，航空公司要求支付相应的行李费用才能把行李箱带上飞机，而且不同的航空公司执行的标准还不一样。记者搜索发现，旅客反映的情况主要集中在春秋、祥鹏、首都航空等低成本航空公司。业内人士介绍，目前中国航空公司大致分为全服务航空公司和低成本航空公司。所谓全服务航空公司，就是在票价里含有很多的服务项目。比如比较大的免费行李额、飞机上的免费餐食，以及航班延误后安排免费住宿等。而低成本航空公司则票价相对更低，但是行李、餐食等服务需要单独付费。行李差异化服务并非国内首创，在欧美市场不少航司也在推行，为不需要这些服务的旅客提供更加低廉的票价。同时专家也提醒，航空公司方面有义务做好相关的信息告知，而旅客在购票时也应该多注意航空公司的相关提示。此外，记者还尝试在多家主流在线旅游预订平台上搜索机票信息，搜索到的信息基本都有显示该价格所对应舱位的行李标准。部分平台显示有超限行李的收费标准，为旅客提供行李额的购买链接。（央视财经）</p>\n  <p><strong>富途老虎长桥之后，未被“点名”的华盛证券也将清理内地业务</strong></p>\n  <p>继富途、老虎、长桥之后，又一家跨境券商宣布清理内地存量业务。华盛证券于6月6日上午向客户发布的通知称，自北京时间6月15日起，华盛证券将对存量投资者账户在中国内地的服务进行相应调整：一是在中国内地交易服务：暂停股票等所有品种的新开仓、加仓交易，仅支持卖出、平仓操作；二是在中国内地资金划转服务：暂停资金及证券转入，转出功能保持正常。通知显示，此次调整是为落实2年集中整治期的行业监管要求，推动跨境证券业务规范发展，并强调本次调整不影响为存量投资者在境外提供服务，也不影响全体客户现有资产安全，客户可正常查询账户、持有及卖出已有持仓。这也意味着，除5月22日被中国证监会直接“点名”的3家券商外，部分中小券商也将开启存量非法业务整治。6月2日以来，老虎、长桥、富途已陆续发出相关通知，宣布自6月12日起对存量投资者在中国内地的服务进行调整。（第一财经）</p>\n  <p><strong>字节跳动：没有造车或推出汽车品牌的计划</strong></p>\n  <p>6月6日，字节跳动官微发布声明，我们注意到，近期有部分报道将“赛豆”解读为“豆包汽车品牌”或“字节跳动造车”：1.相关说法不准确，字节跳动没有造车或推出汽车品牌的计划。2.赛豆不是字节跳动或豆包推出的汽车品牌，字节和赛豆没有股权合作。3.豆包、火山引擎与汽车行业伙伴的合作，主要是给行业伙伴提供豆包大模型、智能座舱等技术服务，帮助合作伙伴提升车载智能交互体验。（每日经济新闻）</p>\n  <p><strong>网传比亚迪自研人形机器人代号“尧舜禹”、年内自用2万台，比亚迪否认</strong></p>\n  <p>日前，比亚迪自研人形机器人的消息引发广泛关注。网传其自研人形机器人代号“尧舜禹”，计划于2026年在内部部署2万台。对此，记者向比亚迪方面求证，对方表示：“‘比亚迪人形机器人代号尧舜禹’‘第七代原型机在深圳和长沙工厂实地测试’‘约150台上岗，目标年内自用2万台’等消息均不属实。”(每日经济新闻)</p>\n  <p><strong>百度成立数字人创新业务部</strong></p>\n  <p>36氪获悉，日前，百度MEG进行了新的一轮组织调整：合并商业部与电商事业部，成立大商业事业部，数字人创新业务部也升级为独立部门。此前5月13日Create 2026百度AI开发者大会上，百度正式宣布旗下数字人品牌慧播星升级为百度一镜，推出全球首个全场景多智能体数字人平台——集数字人直播、数字人视频、实时互动数字人于一体，并发布百度一镜海外版。截至2025年底，百度一镜数字人主播数已突破10万，服务30+行业。</p>\n  <p><strong>2026年度电影总票房已突破160亿元</strong></p>\n  <p>据网络平台数据，截至目前，2026年度电影总票房已突破160亿元。《飞驰人生3》《给阿嬷的情书》《镖人》暂列前三位。其中，影片《给阿嬷的情书》票房已超15.87亿元（含预售），并将于6月18日在中国香港、中国澳门、新加坡、马来西亚、文莱上映。同时，2026年暑期档已全面开启，目前已有超60部影片锁定暑期档，涵盖历史、科幻、青春、动画等多元类型，共同点燃夏日的光影热情。(央视财经)</p>\n  <p><strong>派瑞股份：公司股票被实施其他风险警示，6月9日起简称变更为“ST派瑞”</strong></p>\n  <p>派瑞股份公告称，公司收到证监会陕西监管局下发的《行政处罚事先告知书》，因公司2024年年度报告和2025年半年度报告存在虚假记载，根据相关规定，公司股票交易将被实施其他风险警示。公司股票自2026年6月8日开市起停牌一天，将于6月9日开市起复牌，股票简称由“派瑞股份”变更为“ST派瑞”，日涨跌幅限制仍为20%。公司已对相关财务报表进行会计差错更正，并启动财务内控专项提升行动。（财联社）</p>\n  <p><strong>优必选：优世界超仿生人形机器人首发预订单量累计超2110台</strong></p>\n  <p>6月7日，优必选科技宣布，旗下消费级人形机器人品牌优世界超仿生人形机器人首发预订单量6天累计达2110+台。（界面新闻）</p>\n  <p><strong>英伟达与SK海力士宣布多年期技术合作，共同开发下一代AI内存</strong></p>\n  <p>英伟达与SK海力士6月8日宣布建立多年期技术合作伙伴关系，围绕全球AI工厂建设所需的下一代内存展开联合研发，并将AI技术应用于半导体芯片设计与制造。根据协议，SK海力士将为英伟达Vera Rubin AI超级计算机、Vera CPU、RTX Spark PC及Jetson Thor机器人计算平台协同开发专用内存，由此进入英伟达正在开拓的AI基础设施、个人AI及物理AI等新市场。在半导体制造领域，SK海力士将采用英伟达CUDA-X库及PhysicsNeMo框架加速芯片仿真和光刻计算工作流；同时借助英伟达Omniverse和cuOpt构建晶圆厂数字孪生，推动工厂自主化运营。（界面新闻）</p>\n  <p><strong>科技“老登”重上AI牌桌，AI产业演进趋势重新定价</strong></p>\n  <p>近期，以戴尔、联想集团为代表的公司“老树发新芽”，不少传统公司正重回行情与投资的“C位”，并频频现身权益类基金的核心重仓名单。有分析指出，科技“老登”重上AI牌桌，这绝非一次简单的高低切炒作，而是机构投资者在深思熟虑后，对AI产业演进趋势的重新定价。多位公募基金人士表示，随着AI建设需求向更多细分领域深度转移，科技投资正逐步从主题驱动转向业绩驱动。在这个去伪存真的过程中，拥有坚实基本面兑现能力、能切实受益于产业生态重塑的“老面孔”，正迎来中长期估值体系的系统性抬升。（证券时报）</p>\n  <p><strong>京东方A回应存储涨价对显示行业的影响</strong></p>\n  <p>关于“存储涨价对显示行业的影响”的问题，京东方A在机构调研时表示，受存储涨价对消费电子冲击的影响，根据咨询机构预计，终端厂商与面板厂商在部分产品类别将承受一定压力。分产品类别来看，对笔记本电脑和智能手机终端需求有可能产生一定程度的影响；综合考虑TV面积需求增长等因素，对电视终端需求影响有限。（华尔街见闻）</p>\n  <p><strong>韩国投资者持续买入中国硬科技</strong></p>\n  <p>近期，韩国投资者正持续加码布局中国硬科技资产。数据显示，过去1个月，寒武纪、麦格米特、机器人ETF华夏、宁德时代等成为最受韩国投资者青睐的A股投资标的，AI芯片龙头寒武纪更是获得近2000万美元净买入。此外，多只在美上市的海外中国科技ETF也迎来资金显著净流入。多家外资机构认为，中国科技领域兼具高增长空间与估值优势，在全球资产配置中具备稀缺投资价值，海外资金正加速捕捉中国科技产业发展红利。 (上海证券报)</p>\n  <p><strong>黄仁勋会见韩国两大游戏商代表共商游戏AI合作方案</strong></p>\n  <p>据报道，英伟达首席执行官（CEO）黄仁勋7日在首尔江南区的网吧先后会见韩国游戏公司KRAFTON创始人兼董事长蔣柄圭和游戏开发商NCSOFT代表金泽辰。据悉，当天黄仁勋和蔣柄圭可能就物理AI等人形机器人，以及基于英伟达近期发布的首款AI笔记本电脑系列“RTX Spark”的游戏领域合作等进行讨论。KRAFTON长期与英伟达合作研发AI功能，并将其融入游戏之中。通过游戏结成的合作关系还推动了双方有关物理AI合作的讨论。KRAFTON主要高管去年4月访问英伟达位于美国加州的总部，同黄仁勋就包括机器人在内的新一代技术合作方向进行了探讨。在结束与KRAFTON高管的会面后，黄仁勋移步附近的另一家网吧，同金泽辰以及NCSOFT高层会面。黄仁勋还同金泽辰“闪现”网络直播，就游戏产业和AI技术的发展方向等交换意见。（财联社）</p>\n  <h2>上市进行时</h2>\n  <p><strong>华恒生物：香港联交所审议公司发行H股并在主板挂牌上市申请</strong></p>\n  <p>6月7日，华恒生物发布公告，公司正在进行申请发行境外上市股份（H股）并在香港联合交易所有限公司主板挂牌上市的相关工作。香港联交所上市委员会于2026年6月4日举行上市聆讯，审议公司本次发行上市的申请。公司本次发行上市的保荐人已于2026年6月5日收到香港联交所向其发出的信函，其中指出香港联交所上市委员会已审阅公司的上市申请，但该信函不构成正式的上市批准，香港联交所仍有对公司的上市申请提出进一步意见的权力。（界面新闻）</p>\n  <p><strong>沪士电子、曦华科技递表港交所</strong></p>\n  <p>据港交所文件，6月5日，沪士电子股份有限公司向港交所提交上市申请书，联席保荐人为中金公司、汇丰；深圳曦华科技股份有限公司向港交所提交上市申请书，独家保荐人为农银国际。（界面新闻）</p>\n  <p><strong>AI时代年轻人生存小调查</strong></p>\n  <p>过去两年，AI真正进入我们的工作体系，有人因此效率提升，有人重学技能，也有人第一次感受到个人能力可能随时被重新定价。越来越多人开始认真学习AI、订阅会员、囤大量Prompt……但这些投入真的让人更有安全感吗？扫码参与我们的“AI时代年轻人生存小调查”，分享你在AI浪潮下的真实处境与选择。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260608/v2_907f94c79e2447fbb6b0a0cdce1aeb9d@5667365_oswg20685oswg421oswg389_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">AI时代年轻人生存小调查</p>\n  <p><strong>整理</strong>｜娃娃菜&nbsp;</p>", "category": "tech", "published_at": "2026-06-08T00:01:39+00:00", "fetched_at": "2026-06-08T03:34:07.059844+00:00", "fingerprint": "c3e0fc63840344eb"}, {"source": "36氪 - 最新文章", "title": "「华超神控」获亿元天使系列融资，加速打造新一代AI超声脑机接口平台 | 36氪首发", "url": "https://36kr.com/p/3841459663030532?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，近日，新一代AI超声脑机公司华超神控（BCI-Sonics）已完成亿元人民币级天使轮系列融资。天使轮融资由经纬创投领投，天使+轮由德联资本、道远资本联合领投，循光资本持续担任独家财务顾问。募集资金将用于推动公司的技术验证与产业化落地。</p>\n  <p>华超神控于2025年创立，创始人李昕是中国科学院与德国弗劳恩霍夫IGD研究所联合培养生物医学工程博士，曾任GE医疗全球科研中心中国区负责人，并连续创立创新科技及医疗公司，在医疗影像、AI、脑机接口与产业转化方面拥有深厚积累。</p>\n  <p>公司核心团队汇聚了来自清华大学、上海交通大学、帝国理工等海内外高校的人才，覆盖神经科学、声学、医学影像、人工智能等多个方向，兼具研发与产业经验，熟悉医疗器械从原理样机、工程样机、临床验证到注册转化的完整路径。</p>\n  <p>据了解，<strong>华超神控团队在创业前已就超声脑机接口技术方向的产业确定性达成共识</strong>，属于“先有团队、目标、技术积累和临床判断，再走向创业和融资”。</p>\n  <p>被这批资深“老炮儿”集体看好的超声脑机接口技术，是当前脑机接口赛道中的热门细分方向，已经吸引了OpenAI创始人Sam Altman、Coinbase联合创始人Fred Ehrsam等硅谷科技派亲自下场创业；在国内，相关企业和科研团队也在密集布局，有说法认为，国内超声脑机几乎与海外站在同一起跑线，技术差距“不到1.5年”。</p>\n  <p>超声脑机接口之所以“火爆”，要回到脑机接口技术本身：大脑被称为人类认知的\"最后疆域\",也是未来科技领域最难攻克的堡垒之一。传统脑机接口解决方案以侵入式/半侵入式或非侵入式为主，前者要开颅，后者使用的经颅磁电刺激等方法虽更安全，但空间分辨率有限，难以作用于深脑区。</p>\n  <p><strong>那么，人类能否在不打开颅骨的前提下，无创而精准地修复大脑?</strong></p>\n  <p>这正是华超神控想要达成的目标：将原本“只能依靠外科手术才能触及的深部脑区,变成一次无创、可逆、可在门诊完成的精准调控”。</p>\n  <p>因此，与传统方案不同，华超神控选择了低强度聚焦超声（tFUS/LIFU）这一技术路径，因为超声是目前少数兼具“无创、深部可达和高时空分辨率潜力的物理通路”。经颅磁刺激仅能作用于约2cm的浅层皮层，而低强度聚焦超声可以无创穿透颅骨，深入脑内数厘米，精准触及那些决定运动、情绪、疼痛与成瘾的关键深部核团。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260606/v2_461d2f7a83764e1490959fe24e2a75f8@5930287_oswg256291oswg1344oswg768_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图源：华超神控</p>\n  <p>这个过程中，最重要的是精度。人的颅骨厚度、密度、曲率存在显著个体差异，超声穿过颅骨时会发生相位畸变、能量衰减与焦点偏移。因此，如果缺乏有效的相位校正，理论靶点与实际声场焦点就可能出现偏差，影响刺激有效率与临床可重复性。</p>\n  <p>华超神控通过自研的经颅相位校正算法，对颅骨造成的声场畸变进行快速补偿，将经颅聚焦精度收敛至最低1.5mm，这相当于在数厘米深处实现毫米级精准调控。</p>\n  <p>“这种经颅相位校正能力，是tFUS技术从实验室研究走向可验证疗效、可复制操作和准商业化设备的核心门槛之一。”李昕认为。据介绍，目前，华超神控这套自研经颅相位校正算法可在极短时间内完成个体化校准，也是国内少数具备该能力、且即将迈向商业化的超声脑机设备。</p>\n  <p>此外，华超神控的另一大技术壁垒，在于其AI闭环神经调控平台。公司并非要做一台单一的刺激设备，而是打造“读取—理解—调控—反馈—再优化”的闭环系统。一方面，通过多模态神经信号采集，并配合高精度声学反馈AI算法进行实时剂量反馈；另一方面，以AI算法识别脑状态、生成个体化刺激方案，动态调整调控策略。这相当于打通了“解码”与“调控”能力：用AI实时读取、解析神经活动，以低强度聚焦超声精准干预，再依托双模态监测构成完整闭环，在毫秒级尺度上动态校准靶点与剂量。</p>\n  <p>对于患者来说，这种看起来精深、复杂的技术带给自己的直接获益是什么？打个比方，以往，一位帕金森PD患者如果想缓解症状，特定情况的患者往往需要接受有创植入式的脑深部电刺激(DBS)；现在，依托无创的超声脑机接口调控技术刺激特定的核团区域，或许也能达到相近的效果，重获体面的生活。</p>\n  <p>现阶段，华超神控已与多所高校、三甲医院及临床专家团队建立深度合作，推进底层声学技术、神经调控机制、多模态数据采集、临床方案设计与真实世界验证等方面的实践，<strong>围绕疼痛、成瘾、神经重塑等方向共同设计研究路径、验证临床价值，推动超声脑机接口技术从科研样机开发走向准临床应用</strong>。</p>\n  <p>李昕相信：\"脑机接口真正实现产业化，需同时满足三个条件，即底层技术具备可验证的物理与生理机制；设备具备工程化，标准化和可复制能力，以及足够清晰的产品路径，使其能在真实应用场景中持续得到验证。\"</p>\n  <p><strong>投资人观点：</strong></p>\n  <p>经纬创投表示，相较于传统植入式方案，低强度聚焦超声（LIFU）技术在刺激深度及空间分辨率上兼具优势，并实现了无创刺激，极大地拓宽了从临床治疗到消费健康的边界。公司核心团队在底层算法与换能器工艺上具备极强的技术壁垒，其产品不仅在学术端具备先发优势，更在泛医疗AI及神经康复领域展现出极强的工程化落地能力。我们期待与公司并肩，共同定义脑科学领域的“下一个十年”。</p>\n  <p>德联资本表示，经颅聚焦超声作为近年来新兴的无创神经调控手段，具备深度大、精度高、靶点可靠等特点，最大程度弥补现有传统经颅电、经颅磁的不足，可扩展性强，应用潜力巨大。华超神控是国内罕有的可实现全产业链自研的平台型企业，具备声学相关硬件、算法研发，高集成度医疗器械开发、注册等多种核心能力，以及全周期实战经验。我们看好并相信公司，未来凭借AI+超声一体化解决方案，实现从科研到临床、从院内到消费的全流程产品落地，推动行业发展的同时，造福患者及广大人群。</p>\n  <p>道远资本表示，大脑是人体最重要的器官，人类对于大脑的探索尚处于早期，脑科学是道远资本看好并持续布局的核心领域之一。超声脑机接口和神经调控是国际国内研究热点，拥有深部可及、安全精准等优势，已经从实验室开始走进临床并持续探索不同适应症和应用场景，华超神控团队在超声脑机接口和神经调控方向深耕多年，积累深厚，执行力强，我们对公司未来的发展充满信心，期待能为更多患者和广大人群带来更好的超声解决方案。</p>\n  <p>循光资本表示，超声脑机接口是当前非侵入式神经调控领域最具临床可及性与平台化潜力的技术路径之一，而真正能将这条路走通的团队，在全球范围内屈指可数。华超神控的核心优势，不仅在于这支团队对\"超声+闭环+AI\"这一神经科学前景方向的准确判断和技术积累，更在于其极为罕见的产业化凝聚力——先有共识，再有创业。循光资本将持续与华超神控并肩前行，期待公司在神经科学这片广袤蓝海中迸发出真正的爆发力。</p>", "category": "tech", "published_at": "2026-06-08T00:30:00+00:00", "fetched_at": "2026-06-08T03:34:07.059829+00:00", "fingerprint": "31122b0a2693e03f"}, {"source": "少数派", "title": "接住来自空间站的信号：如何用手台接收 SSTV？", "url": "https://sspai.com/post/110108", "summary": "它不是玄学，也不是单纯的浪漫。它是频率、传播、天线、轨道、多普勒效应，以及我们手中那一点点设备共同完成的一次小小实验。<a href=\"https://sspai.com/post/110108\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T08:34:12+00:00", "fetched_at": "2026-06-08T03:34:05.337486+00:00", "fingerprint": "70de63b8130138f0"}, {"source": "少数派", "title": "派早报：乘用车越造越重，12 年增重近 400 公斤", "url": "https://sspai.com/post/110847", "summary": "<p>乘用车越造越重，12 年增重近 400 公斤</p><p>iFixit 拆解华强北山寨苹果产品</p><p>Cloudflare 收购 Vite 背后公司</p><p>rsync 疑因 AI 参与维护出现 bug，引发争议</p><p>OpenAI 与美国政府商讨捐赠股权</p><p>美国平均上路车龄达到 13 年</p><p>看看就行的简讯</p><p>少数派的近期动态</p><p>你可能错过的好文章</p><a href=\"https://sspai.com/post/110847\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-06-07T22:52:23+00:00", "fetched_at": "2026-06-08T03:34:05.337475+00:00", "fingerprint": "c59cd404bf4a0b91"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];

  const CATEGORIES = [
    { id: "all", label: "全部" },

  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {

    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {

    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
