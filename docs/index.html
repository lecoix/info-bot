lay is even cheaper than usual at Amazon, where it costs $69 in every color (the price fluctuates between $79 and $99). Some notable [&#8230;]", "category": "tech", "published_at": "2026-07-14T22:24:26+00:00", "fetched_at": "2026-07-15T01:59:55.944926+00:00", "fingerprint": "ea2daf8aa7f20f3d"}, {"source": "36氪 - 最新文章", "title": "36氪首发 | 浙大系桌面CNC团队获商汤国香、首形科技等近亿元天使轮，要用AI技术降低制造门槛", "url": "https://36kr.com/p/3894935854677249?f=rss", "summary": "<p>作者&nbsp;|&nbsp;张子怡</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，桌面级CNC（数控机床）企业「奇塑科技」于近期完成近亿元人民币天使轮融资。本轮融资由商汤国香、首形科技、全新世、奇绩创坛共同投资。本轮资金将主要用于桌面级CNC软硬件产品的研发、量产以及后续的市场营销。</p>\n  <p>在消费级3D打印机和激光雕刻机已完成大众市场教育，并诞生了诸如拓竹、xTool等多个头部企业后，能够实现“从软材到硬材强三维加工”的CNC产品，被视为消费级制造领域的下一片万亿蓝海。</p>\n  <p>早在2018年行业普遍聚焦3D打印赛道时，奇塑科技团队就已将目光投向CNC领域。在创始人夏楠看来，CNC是制造业最基础、通用性最强的加工方式，覆盖的场景比3D打印更广，拥有万亿级的产业底盘；如果能用AI重构CNC的制造范式、降低门槛，将进一步拓宽CNC的使用场景，甚至下沉到普通用户的桌面端。这会改变全社会的生产模式，释放极大的增量价值。</p>\n  <p>当前，市面上已涌现出数家消费级CNC初创公司，资本也争相涌入。企业共同面临的问题是：如何降低CNC使用门槛。这是工业界花费几十年也未解决的难题。</p>\n  <p>具体来看，第一个难题，使用CAM软件极其复杂。CAM即计算机辅助制造（Computer Aided Manufacturing），是将三维模型转化为数控机床可识别加工指令的核心环节，直接决定加工的精度、效率与可行性，是CNC操作链路中技术门槛最高的部分。用户完成一个零件的工艺设计需要配置几十甚至几百个工艺参数。</p>\n  <p>第二个难题，CNC工艺考验经验。师傅需要在大脑中排布众多复杂的变量：如何装夹、用什么刀具、加工参数如何配置等等，这高度依赖个人实操经验。</p>\n  <p>夏楠告诉硬氪：“工厂里培养一个能熟练使用CNC的师傅需要3到5年。即使是985毕业的工程师，想要精通CNC也得全身心投入至少半年时间。”</p>\n  <p>在夏楠看来，解决CNC门槛的最佳方案就是AI CAM——把复杂的工艺知识内化到系统中去，给每一台机床配一个AI老师傅。</p>\n  <p>自2018年起，奇塑科技开始AI CAM的研发工作。起初他们遇到最大的问题就是缺少数据。在传统CNC行业，加工工艺知识多以口传心授的方式传承，未能形成可沉淀的数字资产，也难以快速迁移。此外，真实加工场景的复杂度远超预期，即便拥有多年经验的师傅，也会时常遇到未曾接触过的全新案例。这也就构成了AI CAM软件的核心研发难点——如何将分散、依赖个人经验的工艺知识数字化，并转化为可沉淀、可复用的推理决策模型。即使是海外头部工业软件厂商，至今也未形成完全成熟的全自动化方案。</p>\n  <p>为了掌握工艺知识，奇塑团队深入一线积累了数千小时实操经验。为了积累工艺数据、并在真实场景中验证，奇塑科技自建基于AI CAM的柔性工厂，通过真实接单生产的方式构建数据闭环，持续迭代算法模型。</p>\n  <p>硬氪了解到，奇塑科技的AI CAM系统，核心能力主要体现在两方面：</p>\n  <p>第一，简化了操作流程，消除专业学习门槛。传统的CAM是“人去适应软件”，需要用户具备系统的加工工艺知识，手动配置上百项参数。奇塑科技将交互逻辑反转为“软件适配人”——用户只需导入模型，软件会将复杂的数控编程收敛为极简的三步：工艺生成、预览、加工，无需使用者掌握专业加工知识与编程能力，软件会告诉用户需要做什么。</p>\n  <p>第二，高场景覆盖率，配套完整数据支撑。依托团队积累的数十万份真实加工模型数据，该系统算法持续学习升级。借助底层创新的AI CAM架构和决策模型，整个生成过程无需人工干预。系统数据覆盖大量“Corner Case（边缘案例）”可支撑工艺方案的快速生成，提升用户使用体验。</p>\n  <p>奇塑科技基于多年自研的AI CAM系统，计划在今年Q4正式上线其首款桌面级五轴CNC。产品会有标配的自动换刀（刀库）、自动对刀、全封闭防尘静音舱体以及1500w大功率主轴，并在AI CAM系统的支持下，实现“端到端”的易用性。</p>\n  <p>团队背景方面，奇塑科技核心团队来自浙大计算机和机械系。成员均为十年以上硬核Maker，涉猎过外骨骼、3D打印机等多个硬件领域，且拥有数十万台量产经验。</p>\n  <p>随着个性化制造与快速迭代需求的增长，桌面级制造设备的应用边界正在持续拓展，桌面级CNC赛道也将迎来更多市场参与者与技术迭代</p>\n  <p><strong>CEO对谈：</strong></p>\n  <p><strong>硬氪：2018的时候，为什么会选择进入CNC这个赛道？</strong></p>\n  <p><strong>夏楠：</strong>我们当时的判断是，制造业的数智化、普惠化是长期确定的方向。而CNC是制造业最基础、通用性最强的加工方式，对应着万亿级的产业底盘。几乎所有产品的制造过程都直接或间接涉及数控加工。如果能重构CNC的制造范式，把工业级的加工能力下沉到更广泛的场景甚至桌面端，能释放巨大的增量价值。</p>\n  <p><strong>硬氪：团队一直在从事AI+CNC相关工作，在自研AI CAM相关技术上，最大的难点在哪里？</strong></p>\n  <p><strong>夏楠：</strong>核心难点在真实制造场景的复杂性。传统制造业里，加工工艺知识多以口传心授的方式传承，未能形成可沉淀的数字资产，也难以快速迁移。再加上真实加工的变量太多了，哪怕是老师傅，也会碰到从没见过的全新案例。想要把这些分散的、依赖个人经验的工艺知识，转化成可沉淀、可复用的决策模型，难度极高。海外头部工业软件厂商深耕该领域数十年，也仍未形成完全成熟的全自动化方案。</p>\n  <p>这个领域需要真正的长期主义。AICAM要在真实场景中大量验证迭代才能成熟，这个过程是急不来的。比如，我们有一个算法是在2021年写的，直至2024年底，其稳定性才满足规模化落地的要求。整个研发过程依赖长期的技术沉淀与场景验证。</p>", "category": "tech", "published_at": "2026-07-14T03:34:12+00:00", "fetched_at": "2026-07-15T01:59:55.830821+00:00", "fingerprint": "e0eaf1979cc59427"}, {"source": "36氪 - 最新文章", "title": "🎁36氪放福利啦！体验10秒，即可免费抽AirPods 4、Redmi手环、超人帆布包！", "url": "https://36kr.com/p/3894914381970438?f=rss", "summary": "<h3><strong>无门槛参与，所有微信用户都可以免费抽奖！</strong></h3>\n  <p>只需打开微信，扫描下方二维码进入抽奖链接，浏览10秒<strong>36氪企业全情报</strong>，<strong>任意订阅一家企业</strong>，即可获得抽奖资格。</p>\n  <p>无需付费，无需任何额外操作，简单体验即可参与，<strong>AirPods 4、Redmi手环3、36氪限定超人帆布包</strong>等好礼随机送出，人人都有机会中奖！</p>\n  <p>&nbsp;</p>\n  <p><strong>直接扫描下方二维码即可参与，或直接点击参与：</strong><a href=\"https://wxmpurl.cn/KEeJSzRvNFr\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>https://wxmpurl.cn/KEeJSzRvNFr</strong></a></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_cc3973b601e94a1c8e1564385ed086f5@5284654_oswg2268767oswg1254oswg1254_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p> p>\n  <p>&nbsp;</p>\n  <p><strong>早点看到，早点理解，早点布局。</strong></p>\n  <p>现在就来体验<strong>36氪企业全情报</strong>，不仅能提升投资信息获取效率，还有机会把大奖带回家！🎁</p>", "category": "tech", "published_at": "2026-07-14T04:21:11+00:00", "fetched_at": "2026-07-15T01:59:55.830815+00:00", "fingerprint": "1b60e42cf317a1ef"}, {"source": "36氪 - 最新文章", "title": "估值110亿美元，这家超级独角兽要帮初创公司从Day0走向全球", "url": "https://36kr.com/p/3895355856403456?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260714/v2_e96c813c6e344327be8c7f02ba97a9ee@5722974_oswg297210oswg2378oswg1010_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>凌晨三点，一家刚成立不久的AI创业公司，可能已经在同时服务旧金山的客户、采购首尔的技术服务，并与拉各斯的合作伙伴签下合同。这家公司甚至还没有招到第一名全职财务人员，业务却已经跨越多个市场、币种和监管辖区。&nbsp;</p>\n  <p>AI正在让这样的创业路径成为可能。过去需要市场、运营、客服等一整套全球化团队才能完成的工作，现在借助智能体就能承担相当一部分。新一代初创企业不必再按照“先站稳本土、再逐步出海”的传统顺序扩张，而可能从成立第一天起，就直接面对全球客户和供应商。</p>\n  <p>但当AI以足够快的速度跑在前面时，大多数企业的金融管道仍未为此做好准备。这也是为什么，全球顶级资本开始押注金融基础设施的AI化重构。</p>\n  <p>2025年6月，全球金融基础设施平台Airwallex空中云汇宣布完成3.2亿美元H轮融资，估值达110亿美元，较半年前的80亿美元大幅跃升，本轮融资由老股东Addition领投，Baillie Gifford、T. Rowe Price、Amex Ventures等现有及新晋投资者跟投。</p>\n  <p>这笔融资也传递出一个明确的信号：AI经济需要一套与之匹配的金融操作系统，而空中云汇正是少数既有全球合规底座、又在主动重构这套系统的玩家之一。</p>\n  <h2><strong>聪明的大脑，瘫痪的钱包</strong></h2>\n  <p>AI能力的爆发与金融基础设施的滞后之间，正在形成一道肉眼可见的鸿沟。</p>\n  <p>过去，AI的角色更像是一名建议者。它告诉人类该买什么、该付给谁、该走哪条汇路；而现在，AI智能体正在成为执行者，无论是采购算力、订阅SaaS服务，还是向海外供应商完成付款，越来越多的商业动作都开始由AI自主发起。</p>\n  <p>全球市场研究机构Forrester发布的报告指出，2024年至2025年间，AI智能体辅助支付已从概念验证阶段快速走向实际部署。OpenAI于2025年9月正式在ChatGPT中支持AI智能体辅助支付，Stripe也推出了专为AI智能体设计的Agentic Commerce&nbsp;Protocol。但问题在于，AI的决策速度是毫秒级的，但它所依赖的金融系统，仍然运行在人工审批和T+2结算的节奏里。</p>\n  <p>对有海外采购需求的B端AI企业而言，这种矛盾更加突出。设想一家正在快速扩张的中国AI公司：它需要同时向美国、欧洲、东南亚的多家云服务商和数据供应商付款，涉及美元、欧元、新加坡元等多种货币；每一笔跨境转账都可能触碰不同国家的合规要求；汇率波动、中间行手续费、结算周期的不确定性，往往让财务团队疲于应付。</p>\n  <p>更棘手的是，当企业规模扩大，簿记、报销、税务、银行系统各自为政的局面会以指数级的方式放大管理成本。一位服务过多家出海AI企业的CFO就曾描述过这样的场景：公司在十几个国家有供应商，每个月光是对账就要耗费财务团队将近一周的时间，还要随时应对各地监管机构对资金流向的核查要求。</p>\n  <p>这意味着，财务团队最宝贵的时间和精力，正在被消耗在本可自动化的重复劳动上。更危险的是，滞后的对账周期会让管理层长期处于财务盲区。决策依赖的数据往往已经过时数天，一旦遭遇汇率剧烈波动或监管突击核查，企业几乎没有足够的反应窗口。</p>\n  <p>当然，仅凭一个聪明的AI模型，或许它可以读懂发票、发现异常并给出支付建议，但却无法凭空获得金融牌照，也无法代替银行合作关系和遍布全球的本地支付网络。只有当这些金融能力被统一打通整合，并以AI能够调用的方式开放，AI的分析和判断才有可能真正转化为财务运营效率。</p>\n  <p>这也让金融基础设施在AI时代被重新审视。过去，跨境金融平台主要解决的是企业如何更高效地收付款。如今，随着AI逐渐进入财务工作流，企业不仅需要支付通道，还需要让AI在明确的授权范围内调用金融工具，同时保证整个过程符合内部制度和监管要求，并留下可以追溯的记录。</p>\n  <p>对新一代AI公司而言，这套能力尤其重要。AI让企业可以用更小的团队服务全球客户，却没有消除跨境金融本身的复杂性。如果账户、支付和财务管理仍散落在不同系统里，所谓从Day 0走向全球，就很容易卡在最基础的资金运营环节。</p>\n  <p>Gartner预测，到2026年，33%的企业软件将集成Agentic AI能力，财务职能将是渗透极深的领域之一。更关键的是，当AI智能体经济真正成熟，谁的金融底座能支撑“代理自主交易”，谁就掌握了下一阶段的入场券。</p>\n  <p>这正是空中云汇此次融资所瞄准的方向。</p>\n  <h2><strong>空中云汇的两张牌</strong></h2>\n  <p>成立于2015年的空中云汇，用十年时间在全球铺设了85个以上的监管牌照、整合160个本地支付网络。据其披露，目前空中云汇年化交易量达到2870亿美元，93%的交易都可实现当日结算，业务覆盖全球200多个国家和地区。</p>\n  <p>而这套基础设施的价值，在AI时代正在被重新定价：十年铺设的合规网络与本地通道，恰好成为智能体经济所需要的底层管道。此次H轮融资，则是空中云汇在这套管道之上加盖“智能层”的战略动作，核心载体是两款新产品：T:0与Airi。</p>\n  <p>T:0瞄准的是企业财务运营的重构。</p>\n  <p>当前大多数企业的财务系统，是一个由分散工具拼凑而成的混合体：簿记、报销、税务、银行系统各自为政，数据在它们之间流转时不断产生摩擦，财务团队的大量精力消耗在重复性的核查与录入工作上。</p>\n  <p>T:0相当于一个自主运营的金融部门，思路是从第一性原理重新设计系统：将簿记、预测、税务、合规、报告与对账整合进一个持续运行的统一平台，让财务职能像一台永不停机的引擎持续运转，让财务团队从管理繁琐工作中解放出来，专注于战略决策。</p>\n  <p>对于从零起步的创始人而言，T:0意味着从第一天起就拥有内置合规逻辑的CFO级账簿，无需经历系统迁移的阵痛。这是因为，T:0可直接调用空中云汇已有的全球支付通道、多币种账户和合规框架，财务数据与资金流动在同一套基础设施内完成闭环。目前T:0处于私测阶段，预计数周内更广泛推出。</p>\n  <p>Airi应对的则是一个更现实的命题：当AI智能体开始代替人类完成购买行为，商业世界需要的远不止更聪明的结账页面。空中云汇将其定义为“智能体商业”。</p>\n  <p>行业早有智能体布局的先例。OpenAI与Stripe在2025年联合推出了Agentic Commerce Protocol（ACP），为AI智能体执行购买行为提供了标准化协议框架；Mastercard也在同年发布了面向智能体商业的支付解决方案。但这些方案存在一些共同局限，本质上是在传统卡支付通道上加了一层AI界面，并未解决AI智能体在全球范围内安全调用和转移资金的底层问题。</p>\n  <p>Airi正是为填补这一空白而生。它从底层重新构建了一套完整的代理钱包能力：AI智能体可以持有专属的代理卡，在设定的支出限额内自主发起交易，并按照权限层级调用不同币种的余额，整个过程在受监管的框架内运行，让AI智能体真正具备代表人类完成跨境交易的能力。</p>\n  <p>目前，Airi已实现“���键结账”功能。消费者在完成身份绑定后，AI智能体可以在授权范围内直接发起支付，无需每次手动填写信息，早期测试数据显示商家转化率因此提升了14%。接下来，它将进化为完整的智能体钱包基础设施，配合空中云汇更广泛的智能体商业套件，打通从发现到结算的完整资金链路。</p>\n  <p>如果说T:0解决的是“钱怎么管”，Airi解决的就是“钱怎么花”——前者面向企业财务团队，后者则面向商家与AI开发者，两者共同依托空中云汇已有的全球合规网络，构成一套协议无关、天然全球化的金融操作系统。</p>\n  <p>在一个AI智能体可能同时运行在OpenAI、Anthropic、Google等不同生态之上的世界里，不被任何单一协议绑定，本身就是一种战略优势。</p>\n  <h2><strong>为什么是空中云汇，为什么是现在</strong></h2>\n  <p>空中云汇此次融资，可以视为行业窗口期正在开启的信号。金融基础设施的AI化重构，正在成为下一个真正的竞争主战场。它比拼的已经不是模型能力，而是谁的管道能让AI真正动起来。</p>\n  <p>这个赛道有一道特殊的护城河：监管资质和本地支付网络。一张支付牌照的申请周期往往以年计，本地清算网络的接入需要逐一谈判，合规体系的建立更是需要在每个市场长期投入，而这几乎无法靠短时间内用钱堆积。</p>\n  <p>空中云汇用十年时间积累的85+全球牌照和160+本地网络，在AI时代成为了一种稀缺资产，时间壁垒成为了它的核心价值之一。这也是为什么本轮融资能够吸引Amex Ventures入局：作为传统金融巨头的战略投资部门，美国运通的押注也是对这套合规基础设施价值的背书。</p>\n  <p>更值得注意的是，这笔融资发生在空中云汇已经实现盈利的背景下。根据空中云汇官方公布的数据，其年化收入已达13亿美元，ARR于2025年第四季度转正，全球超过67.5万家企业直接或通过平台使用其服务管理跨境金融运营。这些数字证明，其商业模式已经成功跑通。此次H轮融资是在财务健康的前提下，主动加速进入一个新的战略阶段。</p>\n  <p>在Agentic AI重塑财务职能的过程中，真正能够胜出的，将是那些同时具备全球合规能力与AI原生架构的平台。巧的是，空中云同时拥有了这两种条件：一边是用十年时间沉淀下来的合规基础设施，另一边是从第一性原理出发、为智能体经济重新设计的产品架构。两者叠加，构成了它在这个窗口期中的独特优势。</p>\n  <p>AI时代已无本土市场。当AI智能体开始跨越国境自主交易，企业所需要的金融底座，必须在第一天就是全球化的。那些现在还在用传统银行账户、手动审批流程支撑海外业务的公司，正在用昨天的基础设施跑明天的速度。而当智能体经济的浪潮真正到来，留给迁移和重建的时间窗口，可能比大多数人预期的要短得多。</p>", "category": "tech", "published_at": "2026-07-14T10:48:32+00:00", "fetched_at": "2026-07-15T01:59:55.830808+00:00", "fingerprint": "0df1507f89b3768d"}, {"source": "36氪 - 最新文章", "title": "氪星晚报 ｜智谱：完成配售新H股募资约314亿港元；荣耀与阿里将开展AI智能体终端合作；小米机器人首次实现汽车工厂柔性工件的长时作业", "url": "https://36kr.com/p/3895322613185543?f=rss", "summary": "<h2>大公司：</h2>\n  <p><strong>中国神华：预计上半年净利润同比增长6.9%-21.1%</strong></p>\n  <p>36氪获悉，中国神华公告，预计2026年上半年归属于上市公司股东的净利润为263亿元至298亿元，同比增长6.9%-21.1%。业绩变动主要系煤化工业务量及自有铁路、港口、航运业务量增加，带动相关业务利润同比增长。</p>\n  <p><strong>中国人寿：预计上半年净利润同比增长约215%-235%</strong></p>\n  <p>36氪获悉，中国人寿公告，预计2026年半年度归属于母公司股东的净利润约1289.33亿元到1371.19亿元，同比增长约215%到235%。业绩变动主要系公司持续深化资产负债联动，优化资产配置，提升投资专业能力，取得良好投资业绩。</p>\n  <p><strong>光迅科技：预计上半年净利润同比增长50%-65.15%</strong></p>\n  <p>36氪获悉，光迅科技公告，预计2026年半年度归属于上市公司股东的净利润为5.59亿元-6.15亿元，同比增长50%-65.15%。报告期内，得益于全球AI算力投资浪潮驱动数通光模块需求快速增长，叠加国内云服务商加大数据中心建设投入，公司凭借完备的产品体系覆盖数据中心及通信网络全场景，有效支撑了经营业绩的持续提升。预计净利润较上年同期大幅增长。</p>\n  <p><strong>脸书母公司计划在美建500亿美元超大型数据中心</strong></p>\n  <p>Meta于13日宣布，将大幅扩大其在美国路易斯安那州里奇兰县的“许珀里翁”（Hyperion）数据中心超级集群项目规模。该项目规划容量将提升至5吉瓦（GW），预计总投资额将超过500亿美元。分析人士指出，在人工智能（AI）投资热潮推动下，Meta及微软、谷歌、亚马逊等科技巨头正加速在全球范围内布局算力基础设施。（新浪财经）</p>\n  <p><strong>赣锋锂业：预计上半年净利润为36.5亿元–46亿元，同比扭亏为盈</strong></p>\n  <p>36氪获悉，赣锋锂业公告，预计2026年上半年净利润为36.5亿元–46亿元，上年同期亏损5.31亿元。报告期内，受益于全球新能源产业快速发展，下游客户对锂盐的需求增长，公司锂盐产品的销售价格较上年同期显著上涨；同时，随着锂资源项目的产能逐步释放，公司成本结构有效优化。叠加储能市场需求持续增长，锂电池板块产销量明显提升，共同推动公司经营业绩同比增长。</p>\n  <p><strong>腾讯云：数据万象MetaInsight智能检索产品计费项大幅降价</strong></p>\n  <p>36氪获悉，腾讯云公告，将于2026年7月27日对数据万象MetaInsight智能检索相关计费项进行命名规范调整与价格优化，标量检索由2元/千次降价至0.04元/千次，混合检索由5元/千次降价至0.08元/千次，标量存储由0.06元/千个/月降价至0.04元/千个/月等。</p>\n  <p><strong>戴比尔斯将暂停南非最大钻石矿生产</strong></p>\n  <p>国际钻石巨头戴比尔斯集团13日宣布，计划将位于南非林波波省的维尼蒂娅钻石矿暂停生产两年，以降低成本。戴比尔斯当天发表声明说，公司其他矿区将维持现有产量，总体产量指引不变。戴比尔斯集团首席执行官阿尔·库克在声明中表示，相关调整旨在增强公司经营韧性。此次停产是戴比尔斯削减成本、调整全球业务计划的一部分。自2024年以来，戴比尔斯已将年度管理费用削减逾1亿美元，并出售或关闭部分非核心资产。维尼蒂娅钻石矿是南非最大产值钻石矿，约占南非钻石年产量的40%。该矿靠近博茨瓦纳和津巴布韦边境，已运营30多年。（新华社）</p>\n  <p><strong>荣耀与阿里将开展AI智能体终端合作</strong></p>\n  <p>荣耀将于7月18日在2026世界人工智能大会举办“从数字屏幕到具身智能——物理世界新范式”分论坛。除之前已官宣的世界著名科技未来学家凯文·凯利外，阿里巴巴集团副总裁、ATH事业群Token Foundry多模态交互负责人许主洪的加入，也引发了业界对后续各方合作的猜想。记者从荣耀和阿里内部渠道获悉，双方将官宣重磅合作，联手方向极有可能是下一代终端操作系统 Agentic OS 的落地实践。据此前公开消息，本次论坛将聚焦AI的智能度和生命感，探讨从“工具”到“伙伴”的 Agentic OS 趋势演进。（财联社）</p>\n  <p><strong>智谱：完成配售新H股募资约314亿港元</strong></p>\n  <p>36氪获悉，智谱在港交所公告，公司此前披露拟配售最多1978万股新H股，现已于2026年7月13日完成配售。按配售价每股1588港元向不少于6名承配人配发及发行合共1978万股新H股，约占扩大后已发行H股总数的4.25%。配售事项所得款项总额约314.11亿港元，所得款项净额约313.75亿港元。</p>\n  <h2>投融资：</h2>\n  <p><strong>“奇塑科技”完成近亿元人民币天使轮融资</strong></p>\n  <p>36氪获悉，桌面级CNC（数控机床）企业“奇塑科技”于近期完成近亿元人民币天使轮融资。本轮融资由商汤国香、首形科技、全新世、奇绩创坛共同投资。本轮资金将主要用于桌面级CNC软硬件产品的研发、量产以及后续的市场营销。</p>\n  <p><strong>“新奇机器人”完成A+轮融资</strong></p>\n  <p>36氪获悉，近日，“新奇机器人”宣布完成A+轮融资。这是新奇机器人自2025年底启动首轮市场化融资以来，半年内完成的第三轮融资。本轮融资完成后，新奇机器人的投资人阵容涵盖经纬创投、沃赋创投、云晖资本、厚雪资本、Synstellation Capital等市场化投资机构，智元机器人、福然德等产业投资方，以及建发新兴投资、吴中金控、雉荟投资、宁波天使等国有背景资本。</p>\n  <p><strong>“大衍科技”完成数千万元天使轮融资</strong></p>\n  <p>36氪获悉，空间智能公司“大衍科技”近期完成数千万元天使轮融资，由松禾资本领投，浙江省省金控与广州番禺创新基金等国资背景机构参与。资金将主要用于触觉大模型研发、机器人数据产线建设及团队扩张。</p>\n  <h2>新产品：</h2>\n  <p><strong>小米机器人首次实现汽车工厂柔性工件的长时作业</strong></p>\n  <p>36氪获悉，7月14日，小米披露旗下人形机器人在汽车工厂“实习”的最新进展。经过4个月的不断迭代，小米机器人在自攻螺母上件工站的双侧作业成功率从90.2%提升至98%，距离人工作业合格率仅差1个百分点。与此同时，还解锁了两项全新岗位——中控台侧盖板排序和料箱折叠回收，两项任务成功率均已达到90%。其中，小米此次展示的中控台侧盖板排序工站场景，首次在汽车工厂实现柔性工件的长时连续作业。</p>\n  <p><strong>B站AI创造公开赛投币榜上线</strong></p>\n  <p>36氪获悉，7月14日，哔哩哔哩（简称“B站”）正式上线“build in bilibili · AI创造公开赛”作品投币入围榜。数据显示，启动仅一个月，大赛投稿创作者已接近5000人，站内“vibe&nbsp;coding”相关关键词的日均搜索量飙升6倍。尤为值得关注的是，目前投币榜前十名中，约半数为粉丝量不过万、且无专业开发经验的UP主，另有两到三个席位由创业团队占据。</p>\n  <p><strong>微型脑部植入物利用温度双向调控神经活动</strong></p>\n  <p>韩国高丽大学医学院团队研制出一款新型脑部植入物，能利用温度双向调节神经活动，为下一代脑机接口和神经疾病治疗带来了全新可能。相关论文发表于新一期《科学进展》杂志。（科技日报）</p>\n  <h2>今日观点：</h2>\n  <p><strong>多家头部量化机构回应“韩国因子”传言：行业极少使用韩国数据</strong></p>\n  <p>13日盘后，一则关于“A股的量化策略早已将韩国科技股走势纳入因子模型，并在A股市场内部引发不同科技板块连锁反应”的市场传闻，在业内广泛传播。对此，某规模超200亿元的量化私募创始人表示：“从行业层面看，国内头部量化机构极少会使用韩国数据来挖掘因子，这种所谓传闻纯属外行‘小作文’。今天量化行业也是普遍大亏，我盘后了解到，大部分同行今天的超额收益都是负数。”对于今天市场的下跌原因，上述私募人士认为：“市场涨多了就会跌，跌多了就会涨，不应当有‘阴谋论’”。另一家百亿级量化私募总经理则回应称，上述传闻并不公允，“假如量化机构完全依据海外科技股的涨跌来进行交易，长期必然会是负超额，大部分量化机构不会这么做。量化行业总体还是通过寻找并持有优质公司来获取超额。”此外，一家以量化中性为特色的知名量化私募创始人也表示，“这种说法完全没道理”。近几天A股的调整更多是全球市场的相关性体现，以及前期科技资产拥挤度偏高所导致。该私募人士进一步强调，目前A股主要权重指数估值合理，后续市场进一步调整空间有限。（中证报）</p>\n  <h2>其他值得关注的新闻：</h2>\n  <p><strong>美联邦取消新能源车税收优惠，加州出台地方补贴政策针锋相对</strong></p>\n  <p>美国加利福尼亚州州长加文·纽森（Gavin Newsom）13日签署了SB 168号法案，正式启动加州新一轮零排放汽车（ZEV）即时补贴计划。根据SB 168号法案，加州政府将拨付1.355亿美元的财政资金，并强制要求参与该计划的汽车制造商进行等额配资，共同构建总额约2.7亿美元的“首次购买电动汽车”补贴基金。该法案规定，首次购买电动汽车的加州家庭可在购车时直接享受“即时返现”优惠，无需等待后续退税。（新浪财经）</p>", "category": "tech", "published_at": "2026-07-14T11:21:42+00:00", "fetched_at": "2026-07-15T01:59:55.830800+00:00", "fingerprint": "62cdef1a1cf705b5"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨LV起诉国家知识产权局；DeepSeek梁文锋成全球AI公司领域新首富；戴比尔斯将暂停南非最大钻石矿生产", "url": "https://36kr.com/p/3896138695706497?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>小米机器人首次实现汽车工厂柔性工件的长时作业</li>\n   <li>SK海力士加速Y1工厂建设，现已开始订购DRAM制造设备</li>\n   <li>国际金价持续回调，后市关注美联储政策路径</li>\n   <li>海关总署：中国出口连续11季度保持增长，贸易增量集中于AI领域</li>\n   <li>韩国政府四部门将于周四召开会议，就单股杠杆ETF对股市冲击研究应对方案</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>LV起诉国家知识产权局，案件定于16日开庭审理</strong></p>\n  <p>人民法院公告网显示，北京知识产权法院将于2026年7月16日公开审理一起涉及路易威登的商标行政纠纷案。该案案号为（2026）京73行初4727号，原告为路易威登马利蒂，被告为国家知识产权局，黄民耀作为第三人参加诉讼。路易威登马利蒂也是此前起诉茉莉奶白商标侵权案的原告。公告暂未披露涉案商标及具体争议内容。案件定于16日9时30分在北京知识产权法院第15法庭开庭审理。（界面新闻）</p>\n  <p><strong>DeepSeek梁文锋身价飙升至360亿美元，成为AI公司新首富</strong></p>\n  <p>根据最新的彭博亿万富豪指数（截至2026年7月14日），DeepSeek创始人梁文锋的身价飙升193亿美元，达到360亿美元（注：现汇率约合2443.78亿元人民币），成为全球AI公司领域的新首富（不涉及包含AI业务的大型集团）。</p>\n  <p>梁文锋的总财富达360亿美元，比去年同期增长了199亿美元，全球富豪榜排名第63，超越Anthropic联合创始人达里奥·阿莫代伊和OpenAI联合创始人格雷格·布罗克曼。（IT之家）</p>\n  <p><strong>戴比尔斯将暂停南非最大钻石矿生产</strong></p>\n  <p>国际钻石巨头戴比尔斯集团13日宣布，计划将位于南非林波波省的维尼蒂娅钻石矿暂停生产两年，以降低成本。戴比尔斯当天发表声明说，公司其他矿区将维持现有产量，总体产量指引不变。戴比尔斯集团首席执行官阿尔·库克在声明中表示，相关调整旨在增强公司经营韧性。此次停产是戴比尔斯削减成本、调整全球业务计划的一部分。</p>\n  <p>自2024年以来，戴比尔斯已将年度管理费用削减逾1亿美元，并出售或关闭部分非核心资产。维尼蒂娅钻石矿是南非最大产值钻石矿，约占南非钻石年产量的40%。该矿靠近博茨瓦纳和津巴布韦边境，已运营30多年。（新华社）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>SK海力士加速Y1工厂建设，现已开始订购DRAM制造设备</strong></p>\n  <p>据报道，SK海力士已开始向主要合作伙伴订购Y1工厂所需的先进DRAM制造设备，初期投资规模对应月产2万片晶圆的生产能力。Y1是SK海力士在京畿道龙仁市处仁区远三面一带建设的大规模半导体集群中的第一座工厂。一期工厂由2个厂房骨架和6个洁净室组成。首座洁净室（ph1）的投产时间已从原计划的2026年5月提前至2026年2月。（财联社）</p>\n  <p><strong>英特尔斥资50亿欧元扩建爱尔兰工厂，押注AI驱动芯片需求</strong></p>\n  <p>英特尔周一宣布，已启动一项规模达50亿欧元（约合57亿美元）的资本投资计划，用以扩建其位于爱尔兰都柏林郊外莱克斯利普园区的制造基地。这笔资金将用于升级Fab 34工厂的现有设施、安装尖端生产设备，并扩建自动化晶圆传送系统，以扩大采用Intel 3制程工艺的至强6及下一代至强服务器处理器的产能，满足全球对AI和高性能计算日益增长的需求。（新浪财经）</p>\n  <p><strong>软银公司推出采用OpenAI技术的网络安全服务</strong></p>\n  <p>7月14日，软银公司与SB OAI Japan宣布全面推出采用OpenAI技术的网络安全服务“补丁即服务”，将推广范围扩大到3000家符合条件的日本公司。（界面新闻）</p>\n  <p><strong>脸书母公司计划在美建500亿美元超大型数据中心</strong></p>\n  <p>Meta于13日宣布，将大幅扩大其在美国路易斯安那州里奇兰县的“许珀里翁”（Hyperion）数据中心超级集群项目规模。该项目规划容量将提升至5吉瓦（GW），预计总投资额将超过500亿美元。分析人士指出，在人工智能（AI）投资热潮推动下，Meta及微软、谷歌、亚马逊等科技巨头正加速在全球范围内布局算力基础设施。（新浪财经）</p>\n  <p><strong>谷歌DeepMind负责人呼吁美国牵头成立人工智能标准监管机构</strong></p>\n  <p>谷歌人工智能业务负责人德米斯・哈萨比斯于周二提议，由美国牵头设立标准机构，针对各类新型前沿 AI 模型开展国家安全风险检测。哈萨比斯与其他科技巨头高管曾在七国集团（G7）领导人峰会期间，向包括美国总统特朗普在内的各国首脑提议组建美国主导的人工智能联盟。（新浪财经）</p>\n  <p><strong>软银孙正义：AI热潮将需要每年5万亿美元的投资</strong></p>\n  <p>软银集团创始人孙正义表示，到2040年，全球人工智能基础设施将需要每年5万亿美元的投资，以支持数据中心、电力供应和人形机器人的扩张，从而推动“以人类为中心”的工作模式向新模式的转变。他指出，随着人工智能发展为“人工超级智能”（ASI），由此产生的收入将证明这些巨额支出的合理性。“人工智能将彻底改变我们的生活——而且这种改变将带来利润，”孙正义说道。（新浪财经）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>长鑫科技：发行价格为8.66元/股</strong></p>\n  <p>36氪获悉，长鑫科技公告，公司首次公开发行股票并在科创板上市，发行价格为8.66元/股。投资者请按此价格在2026年7月16日（T日）进行网上和网下申购，申购时无需缴付申购资金。其中，网下申购时间为9:30-15:00，网上申购时间为9:30-11:30，13:00-15:00。本次初始发行股份数量为668,808.8608万股，占发行后总股本约10.00%，并授予中金公司不超过初始发行股份15.00%的超额配售选择权。</p>\n  <p><strong>头部公募掀起南下“举牌潮”，港股创新药开启估值修复行情</strong></p>\n  <p>近日，港股创新药板块掀起一轮公募基金“举牌潮”。易方达、富国、汇添富等头部公募基金在一个月内增持多只港股创新药标的，并触及举牌线。与此同时，南向资金对迈威生物、科济药业等个股的持股数6月以来也出现大幅提升。机构认为，在AI主线进入休整、资金寻求高低切换的背景下，估值处于历史低位、BD出海持续放量且政策红利加速释放的创新药板块，正迎来多重逻辑共振的估值修复窗口。 （上证报）</p>\n  <p><strong>美股三大指数集体收涨，SK海力士涨超27%</strong></p>\n  <p>36氪获悉，7月14日收盘，美股三大指数集体上涨，道指涨0.02%，纳指涨0.9%，标普500指数涨0.38%。存储概念大涨，SK海力士涨超27%，闪迪涨超5%，美光科技、英伟达、英特尔涨超4%。IBM跌超25%，市值蒸发近700亿美元。热门中概股多数下跌，百度跌超3%，网易跌超2%，阿里巴巴、京东、拼多多、哔哩哔哩小幅下跌，小鹏集团涨超3%，理想���车涨超2%，蔚来涨超1%。</p>\n  <p><strong>特朗普：将用与海湾各国贸易投资协议取代霍尔木兹海峡货运费</strong></p>\n  <p>美国总统特朗普14日在社交媒体发文说，基于与中东领导人富有成效的对话，他决定用海湾各国将与美国达成的贸易和投资协议来取代美国提出的对通过霍尔木兹海峡运输货物收取20%的费用。（央视新闻）</p>\n  <p><strong>乐事回应薯片中被曝出现蓝色异物：希望取回产品作内部核查</strong></p>\n  <p>7月12日，有网友在社交平台上发帖称，在乐事薯片中发现了一块疑似“蓝色薯片”的异物。此事引发关注。7月13日晚，乐事相关负责人回应记者采访称，乐事品牌已关注到此事，其对此高度重视。客服已与消费者取得联系，希望可以取回产品作内部核查。</p>\n  <p>而根据当事消费者7月13日晚8点在社交平台更新的信息，乐事官方客服已经与她取得联系，客服就此次情况表达了歉意。同时，经过双方协商，消费者将在保留一半正常的薯片和一半“蓝色薯片”的基础上，将疑似出现问题的薯片寄回给乐事。目前，因尚未收到涉事薯片，乐事方面尚未确认异物性质和来源。（中国新闻周刊）</p>\n  <p><strong>*ST高科：部分实际控制人暨董事因涉嫌挪用资金被刑事立案</strong></p>\n  <p>36氪获悉，*ST高科公告，公司于近日收到公安局签发的关于公司实际控制人之一暨董事长曹龙先生及实际控制人之一暨董事贺怡帆女士个人的《立案告知书》，因涉嫌挪用资金，根据相关法律法规，公安局认为符合刑事立案标准，现已对该案立案侦查。</p>\n  <p><strong>韩国政府四部门将于周四召开会议，就单股杠杆ETF对股市冲击研究应对方案</strong></p>\n  <p>追踪韩国核心芯片股的杠杆产品近期暴跌，对韩国股市及金融市场带来了巨大的影响。业内汇编的数据显示，5月下旬上市的十几只追踪三星电子和SK海力士的杠杆交易型开放式指数基金（ETF），目前的价格已近乎腰斩。据报道，韩国政府四大经济部门高层协调机制将于周四召开会议，就单股杠杆ETF对股市的冲击研究应对方案，这是该议题首次正式进入该机制进行讨论。该机制是由韩国财政经济部、金融委员会、韩国银行及金融监督院四方共同参与的最高级别经济协调平台。（财联社）</p>\n  <p><strong>“世界茉莉花都”广西横州遭遇严重洪涝，茉莉花价格翻倍</strong></p>\n  <p>受台风“美莎克”带来的持续强降雨影响，“世界茉莉花都”广西横州遭遇严重洪涝，大片正值采收的茉莉花田浸泡在水中，产地鲜花收购价应声跳涨。当前，原料端的涨价暂未影响到原料库存充足的头部品牌，但对库存规模较小的中小茶饮商家而言，茉莉茶饮的利润空间已被急速压缩。（蓝鲸新闻）</p>\n  <p><strong>海关总署：中国出口连续11季度保持增长，贸易增量集中于AI领域</strong></p>\n  <p>7月14日，海关总署副署长王军在国新办新闻发布会上表示，截至目前，中国出口已经连续11个季度保持增长，出口增长根本原因在于中国制造与全球各类需求的精准适配。联合国报告显示，今年以来，全球货物贸易增长主要集中于人工智能相关领域。王军指出，全球算力数据中心及终端设备需求持续扩张，促进了中国相关产品出口；上半年中国电子元件、电脑零部件等产品出口均呈两位数增长，合计拉动出口增长6.9个百分点。（证券时报）</p>\n  <p><strong>AI服务器概念大跌，中国长城封跌停</strong></p>\n  <p>7月14日，AI服务器概念震荡下挫，中国长城封跌停，华丰科技、卓易信息跌超14%，华勤技术逼近跌停，紫光股份、神州数码、中科曙光、共进股份等跌幅靠前。（财联社）</p>\n  <p><strong>四大行辟谣并发布风险提示，“存100万享5.25%利息”为虚假广告</strong></p>\n  <p>近期不法分子冒用国有大行名义，在第三方平台及社交渠道发布“存100万享5.25%利息”等虚假高息广告，诱导消费者添加微信后推介境外保险、投资项目，牟取佣金甚至实施诈骗。对此，工、农、中、建四大行近日均已正式辟谣：无此类存款产品。</p>\n  <p>四家银行还提示，消费者应警惕远高于市场水平的收益承诺；认准银行网点、官网、官方APP等正规渠道，勿点不明链接、泄露身份证号、验证码等信息。（21世纪经济报道、金融时报）</p>\n  <p><strong>国际油价创6年来最大单日涨幅</strong></p>\n  <p>由于美伊冲突升级及美国宣布将恢复对伊朗的海上封锁，国际原油期货价格13日早盘显著上涨，收盘时涨幅超9%，创下2020年5月以来最大单日涨幅。在13日晚开始的新一个交易日开盘后，国际油价继续上涨超1%。13日收盘时，纽约商品交易所8月交货的轻质原油期货价格上涨6.73美元，收于每桶78.14美元，涨幅为9.42%；9月交货的伦敦布伦特原油期货价格上涨7.29美元，收于每桶83.30美元，涨幅为9.59%。（央视新闻）</p>\n  <p><strong>名创优品回应推广视频含偷窥剧情：向消费者诚恳道歉</strong></p>\n  <p>近日，短视频博主“阿磊日记”发布了一条为名创优品家纺记忆棉薄垫拍摄的带货短视频，该视频为突出产品质地轻薄的特点，刻意设计极具争议的猎奇剧情，视频中出现掀开地板缝隙便能窥视楼下女性卧室的情节，视频上线后大量网友表示观看后产生不适。</p>\n  <p>7月13日，名创优选科技（广州）有限公司发布��方致歉信。信中简短致歉，承认因品牌审核疏漏产出不良推广内容，向消费者诚恳道歉。同时公布四项处置办法：终止涉事博主全部合作、全网下架相关视频；升级内容审核标准；完善达人合作监管机制；对内部涉事岗位追责整顿。品牌表示将严格把控宣传内容，杜绝同类问题重演，再次向公众致歉。（扬子晚报）</p>\n  <p><strong>美国数据中心开发商加速抛售巨额股权资产</strong></p>\n  <p>美国数据中心开发商正借着人工智能行业热潮变现离场。多位知情人士透露，今年夏季，全美多家数据中心建设及运营企业正联合投行，计划出售公司价值数百亿美元的多数股权。投行正在接洽多家企业的股权转让事宜，包括Netrality数据中心、DataBank、Edged、EdgeCore数字基础设施等企业，其产业布局覆盖凤凰城至亚特兰大多地。当前算力需求持续旺盛，数据中心成为热门资产，投行正向私募股权机构大力推介这类标的。（新浪财经）</p>\n  <p><strong>已有基金公司递交主动ETF发行申请材料</strong></p>\n  <p>近期已有基金公司递交主动ETF发行申请材料。据了解，主动ETF，即主动管理交易型开放式基金，是指基金管理人自主选择投资策略、不以跟踪特定指数为投资目标，并在交易所上市交易的ETF。此前，证监会主席吴清在2026陆家嘴论坛上宣布，支持在沪深交易所推出主动ETF。同日，上交所发布《上海证券交易所主动管理交易型开放式证券投资基金业务指引》，深交所发布《深圳证券交易所证券投资基金业务指引第5号——主动管理交易型开放式基金》，均自发布之日起施行。（中证报）</p>\n  <p><strong>美联邦航空局结束“星舰”事故调查，准许13次试飞</strong></p>\n  <p>美国联邦航空局13日宣布，已结束对美国太空探索技术公司重型运载火箭“星舰”第12次试飞异常事故的调查，接受该公司提出的整改措施，准许其开展第13次试飞。太空探索技术公司当天宣布，计划最早于16日实施“星舰”第13次试飞。（新华社）</p>\n  <p><strong>多家车企上半年大幅预亏</strong></p>\n  <p>2026年上半年，汽车行业呈现显著分化、整体承压态势。赛力斯、广汽集团及江淮汽车等上市公司相继发布的上半年业绩预告表明，三家车企均出现亏损情况。从行业整体来看，乘联分会披露的数据显示，今年1-5月，汽车行业利润1440亿元，同比下降20%。同时，行业利润率降至3.4%，为五年来同期最低。乘联分会预计，7月后的市场将逐步改善，随着安全新规和税改预期逐步消化，叠加芯片供应紧张边际缓解、PPI大降、消费信心缓慢修复，零售端降幅有望在三、四季度逐步收窄。（财联社）</p>\n  <p><strong>美国会众议院通过永久实行夏令时法案</strong></p>\n  <p>当地时间7月14日，美国国会众议院投票通过永久实行夏令时的法案，并将法案提交参议院审议。今年5月，美国国会众议院能源和商业委员会以48比1的结果通过了《阳光保护法案》，该法案旨在永久取消美国每年两次调整时间的做法，让夏令时全年永久化。（央视新闻）</p>\n  <p><strong>美国光伏巨头Sunrun进军“卖算力”赛道，CEO声称用户每月能挣数百美元</strong></p>\n  <p>美国最大住宅光伏和储能设备供应商Sunrun正在推进所谓的“分布式AI数据中心”试点，公司首席执行官玛丽·鲍威尔周一表示，对于参加这项计划的用户而言，每个月有可能靠卖算力获得数百美元。据悉，Sunrun在美国有超过100万名已经部署屋顶光伏系统的用户。面对AI产业挥舞支票疯狂追求算力，光伏公司看到了“卖铲子”的机会。（财联社）</p>\n  <p><strong>从“低估”到“重估”，创新药迎投资布局窗口</strong></p>\n  <p>7月13日，在大盘整体承压下行的背景下，创新药板块逆势走强。万邦医药、陇神戎发双双录得20%涨停，上海凯宝上涨15.81%，亚虹医药上涨14.77%，新天地上涨10.84%；此外，哈药股份、九芝堂、立方制药等8家药企相继封板，市场做多情绪持续升温。上半年，创新药板块经历了一场从“被低估”到“被抢筹”的戏剧性反转。业内人士认为，这轮行情的底层逻辑远不止是资金从科技股高切低的短期博弈。政策红利的持续释放与产业基本面的深度质变，正共同构筑起创新药板块中长期向好的基石。（经济参考报）</p>\n  <p><strong>“木头姐”斥资逾2100万美元加仓SpaceX</strong></p>\n  <p>凯茜·伍德旗下的Ark Invest周一进行了多笔交易，其中最受市场关注的操作是加仓SpaceX。这家航天企业近期完成上市，市场对其估值的争议再起，持续受到资本关注。与此同时，Ark投资持续减持AMD，并调整旗下多只重仓创新赛道基金的持仓结构。（新浪财经）</p>\n  <p><strong>国际金价持续回调，后市关注美联储政策路径</strong></p>\n  <p>7月13日，国际金价持续下挫。截至13日18时30分，纽约黄金期货报4075.3美元/盎司，较上一交易日下跌1.35%；伦敦现货黄金报4064.8美元/盎司，盘中跌幅一度达1.87%。针对本轮金价调整，东方金诚研究发展部高级副总监瞿瑞表示，国际金价盘中跌破4100美元/盎司整数关口，主要受到地缘局势升级推升通胀预期、美国重要经济数据公布前市场避险情绪降温等因素影响。</p>\n  <p>展望后市，业内普遍认为，短期国际金价走势仍将围绕美国6月CPI数据及美联储货币政策预期展开，通胀数据表现将成为影响黄金价格运行方向的关键变量。与此同时，中东局势等地缘因素仍将扰动市场情绪，但其对黄金价格的影响正在减弱，市场关注重心正逐步回归美国经济基本面。（经济参考报）</p>\n  <p><strong>全球AI龙头股共振下跌，机构称后续关注三个信号</strong></p>\n  <p>近期，全球AI链股票共振下跌。海外市场中，日经225指数、韩国综合指数等均有明显回调，韩美半导体、三星电机、三井金属、SK海力士、三星电子、康宁、ARM等均有明显回撤。</p>\n  <p>7月13日，A股市场在AI链的带动下也出现调整，深证成指、创业板指均跌逾3%。银行、煤炭等板块逆势上涨，多数科技股下跌，整个A股市场超4600只股票下跌。市场成交额为2.83万亿元，较前一交易日缩量。</p>\n  <p>分析人士认为，近期，全球AI板块共振调整是由于高拥挤度下产业叙事扰动。短期科技股超跌后或有修复，但在拥挤度压力充分消化前，板块可能仍处于高波动状态，中报业绩将逐步成为市场关注的投资主线。后续重点看三个信号：韩股和美股半导体板块能否企稳，A股科技龙头能否有效承接以及成交额能否维持当前水平。（中证报）</p>\n  <p><strong>荣耀与阿里将开展AI智能体终端合作</strong></p>\n  <p>荣耀将于7月18日在2026世界人工智能大会举办“从数字屏幕到具身智能——物理世界新范式”分论坛。除之前已官宣的世界著名科技未来学家凯文·凯利外，阿里巴巴集团副总裁、ATH事业群Token Foundry多模态交互负责人许主洪的加入，也引发了业界对后续各方合作的猜想。记者从荣耀和阿里内部渠道获悉，双方将官宣重磅合作，联手方向极有可能是下一代终端操作系统&nbsp;Agentic OS&nbsp;的落地实践。据此前公开消息，本次论坛将聚焦AI的智能度和生命感，探讨从“工具”到“伙伴”的&nbsp;Agentic OS&nbsp;趋势演进。（财联社）</p>\n  <p><strong>印度要求国有银行增加外币存款</strong></p>\n  <p>印度政府要求国有银行加大力度，从3500万海外印裔群体中吸纳外币存款，以此扩充国家对外储备、提振持续走弱的卢比。一份声明显示，印度财政部长尼尔玛拉・西塔拉曼于周一召开会议，督促国有银行通过线下推广活动、线上数字渠道，同时推出创新存款产品，进一步加强与海外印度侨民的对接。知情人士透露，印度央行行长桑杰・马尔霍特拉定于周二会见私营银行与国有银行首席执行官，制定方案吸引海外存款流入，并解决阻碍资金吸纳的各类运营难题。（新浪财经）</p>\n  <h2>大公司财报</h2>\n  <p><strong>五粮液：预计2026年半年度净利润同比增长88.80%-98.97%</strong></p>\n  <p>36氪获悉，五粮液公告，预计2026年半年度归属于上市公司股东的净利润为87.30亿元-92.00亿元，同比增长88.80%-98.97%。业绩变动主要系上年同期基数较低及销售旺季核心产品动销回暖所致。</p>\n  <p><strong>天原股份：上半年净利润同比预增981.39%—1282.34%</strong></p>\n  <p>36氪获悉，天原股份披露业绩预告，预计2026年半年度归属于上市公司股东的净利润1.8亿元—2.3亿元，同比增长981.39%—1282.34%。</p>\n  <p><strong>电投水电：上半年净利同比预增7673%左右</strong></p>\n  <p>36氪获悉，电投水电披露业绩预告，预计2026年半年度归属于母公司所有者的净利润11.9亿元左右，与上年同期（追溯调整前）相比，增加11.75亿元左右，同比增长7673%左右。</p>\n  <p><strong>北斗星通：上半年净利润同比预增2368.27%—3426.09%</strong></p>\n  <p>36氪获悉，北斗星通披露业绩预告，预计2026年半年度归属于上市公司股东的净利润3500万元—5000万元，同比增长2368.27%—3426.09%。</p>\n  <h2>投融资</h2>\n  <p><strong>“爱诗科技”完成29.8亿元C轮融资</strong></p>\n  <p>36氪获悉，“爱诗科技”14日宣布完成整体C轮融资，本轮累计融资29.8亿元人民币。其中，C+轮由阿里巴巴领投，Lollapalooza Capital（王慧文家办）、常春藤资本、惠远资本、钟鼎资本、韩国未来资产、OCBC生态下Lion X基金、蓝色光标、CloudAlpha、iGlobe Partners等十余家国内外机构参与投资。本轮融资将主要用于视频生成基础模型、实时世界模型、全球化产品增长和产业场景落地。</p>\n  <p><strong>逐际动力完成Pre-IPO轮融资</strong></p>\n  <p>36氪获悉，近日，通用人形机器人公司逐际动力LimX Dynamics宣布完成Pre-IPO轮融资，融资金额近2亿美元。公司过去半年累计完成融资4亿美元。逐际动力在本轮Pre-IPO轮融资汇集了来自全球的投资机构，包括IDG资本、蓝思科技、GGG Group与Redstone VC、华山资本、合肥滨湖产发集团等战略投资。此外，阿联酋磊石资本（Stone Venture）连续多轮追投；绿洲资本、基石资本、南山战新投、尚颀资本、蔚来资本等多家老股东超额加注。</p>\n  <p><strong>“新奇机器人”完成A+轮融资</strong></p>\n  <p>36氪获悉，近日，“新奇机器人”宣布完成A+轮融资。这是新奇机器人自2025年底启动首轮市场化融资以来，半年内完成的第三轮融资。本轮融资完成后，新奇机器人的投资人阵容涵盖经纬创投、沃赋创投、云晖资本、厚雪资本、Synstellation Capital等市场化投资机构，智元机器人、福然德等产业投资方，以及建发新兴投资、吴中金控、雉荟投资、宁波天使等国有背景资本。</p>\n  <h2>酷产品</h2>\n  <p><strong>高德发布通用世界模型工坊ABot-World Studio</strong></p>\n  <p>36氪获悉，近日，阿里巴巴集团旗下高德正式发布通用世界模型工坊ABot-World Studio，并同步开放测试。该工坊将交互式视频生成与3DGS场景生成统一在同一产品中——用户只需输入一段文字或一张图片，即可生成一个可实时交互、任意分享的AI世界，输出结果可保存为视频与3DGS文件。</p>\n  <p><strong>小米机器人首次实现汽车工厂柔性工件的长时作业</strong></p>\n  <p>36氪获悉，7月14日，小米披露旗下人形机器人在汽车工厂“实习”的最新进展。经过4个月的不断迭代，小米机器人在自攻螺母上件工站的双侧作业成功率从90.2%提升至98%，距离人工作业合格率仅差1个百分点。与此同时，还解锁了两项全新岗位——中控台侧盖板排序和料箱折叠回收，两项任务成功率均已达到90%。其中，小米此次展示的中控台侧盖板排序工站场景，首次在汽车工厂实现柔性工件的长时连续作业。</p>\n  <p><strong>整理</strong>｜王浩阳</p>", "category": "tech", "published_at": "2026-07-14T23:57:20+00:00", "fetched_at": "2026-07-15T01:59:55.830785+00:00", "fingerprint": "7b57dea270a4d9bf"}, {"source": "少数派", "title": "iOS / iPadOS 27 Public Beta 公测版来了：升降级指南 & 注意事项", "url": "https://sspai.com/post/112288", "summary": "7月14日凌晨，Apple终于推送了今年iOS27、iPadOS27、watchOS27、macOSGoldenGate、HomePod软件27以及AirPods固件新版的首个PublicBeta公开 ...<a href=\"https://sspai.com/post/112288\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-14T04:07:18+00:00", "fetched_at": "2026-07-15T01:59:54.553521+00:00", "fingerprint": "a33c6645388ae6a9"}, {"source": "少数派", "title": "具透 | iOS 27 首个公开测试版来了，这些是值得你关注的新功能", "url": "https://sspai.com/post/112287", "summary": "少数派在体验了新版系统之后，帮你整理了 iOS 27 中值得关注的新功能和新特性，希望帮你能了解新版系统的方方面面。<a href=\"https://sspai.com/post/112287\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-14T07:00:00+00:00", "fetched_at": "2026-07-15T01:59:54.553514+00:00", "fingerprint": "498a8f0e53611a6d"}, {"source": "少数派", "title": "社区速递 149｜派友热议睡眠数据化、观穹 6×24 望远镜与 RG Rotate 旋转屏掌机", "url": "https://sspai.com/post/112320", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/112320\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-14T09:27:39+00:00", "fetched_at": "2026-07-15T01:59:54.553507+00:00", "fingerprint": "900a68098845f997"}, {"source": "少数派", "title": "派早报：Meta 被诉借助 AI 违规裁员、Google 被诉使用版权内容训练 Gemini 模型等", "url": "https://sspai.com/post/112334", "summary": "Google 推出新版图片搜索功能，Spotify 开启语音交互功能内测等。<a href=\"https://sspai.com/post/112334\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-15T00:19:12+00:00", "fetched_at": "2026-07-15T01:59:54.553496+00:00", "fingerprint": "3545e2a422026689"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7070 CNY ↑+0.03%", "url": "https://www.frankfurter.app/2026-07-14?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-07-14</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.7070 CNY</b> <span style=\"color:#d9534f;font-size:14px;\">↑ +0.0013 (+0.03%) 升值</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-07-15T01:59:53.409858+00:00", "fingerprint": "9aeba4e122a5bdfd"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
