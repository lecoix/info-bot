//www.theverge.com/ai-artificial-intelligence/1019921/openai-breakthrough-math-computer-science-physics", "summary": "On Monday, OpenAI announced impressive breakthroughs in mathematics, computer science, and physics, along with what the company says is an evolving approach to communicating its findings. But despite its apparent course correction, researchers who spoke to The Verge are growing increasingly tired of the company's antics. It has been a turbulent few months between OpenAI [&#8230;]", "category": "tech", "published_at": "2026-10-27T20:48:58+00:00", "fetched_at": "2026-10-28T03:43:55.350376+00:00", "fingerprint": "578f4a1cc2a6a4ec"}, {"source": "The Verge", "title": "Here’s why the iPhone Duo’s hinge could be cracking the screen", "url": "https://www.theverge.com/tech/1020145/iphone-duo-crackgate-broken-screen-hinge", "summary": "Within hours of the iPhone Duo launch last Friday, people reported that the inner screen on some brand new foldable phones was already broken. The issue was similar across many photos shared on social media: some kind of issue or crack would appear in the middle of the screen above the hinge, with lines appearing [&#8230;]", "category": "tech", "published_at": "2026-10-27T22:55:05+00:00", "fetched_at": "2026-10-28T03:43:55.350366+00:00", "fingerprint": "0986b691bd7840fc"}, {"source": "36氪 - 最新文章", "title": "「脑虎科技」B轮融资7亿，“三全”脑机接口系统进入注册临床｜36氪首发", "url": "https://36kr.com/p/4043628160685189?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪获悉，脑虎科技已完成7亿人民币B轮融。本轮融资由国投聚力、深创投、勤智资本联合领投，中芯聚源、黄浦投资、基石资本、IDG 资本、曦晨资本、钧犀资本、华福证券、众为资本、江西金控等机构跟投，盛大、中平资本等老股东加码。募集资金将用于“全植入、全无线、全功能”（“三全”）脑机接口系统的多中心临床试验及注册审批、超级工厂量产建设，以及下一代产品研发与BCI+AI融合探索。</p>\n  <p>从机构属性来看，本轮融资整体以国资为主导，产业资本方面则“跨界”集结了来自半导体、医疗器械、材料等赛道的头部机构。</p>\n  <p>脑虎科技创始人、首席科学家陶虎对36氪介绍称，这样做，一是因为脑机接口已上升到国家战略层面，国资领投能带来更强的政策支持力度；二是考虑到后续产业协同问题。在他看来，当前，市场上仍没有专为脑机接口而生的电极公司、芯片公司或算法公司，因此，只有和上下游合作方携手，先“把脑机接口整个产业做起来”，行业天花板才能抬更高。</p>\n  <p>2026年，头部脑机接口公司被“抢额度”的情况已非个例。在陶虎的体感中，3、4年前，投资人眼中的脑机接口还是“相对稚嫩的科幻概念”，大家喜欢听“国内首个”“最高通道”或“中国版Neuralink”的故事；但如今，脑机接口已经是被认真正视的产业，市场更关心临床效果、患者获益、供应链自主可控，以及最终交付的产品。</p>\n  <p>技术和产品方面，脑虎科技自研了全植入、全无线、全功能“三全”脑机接口系统。顾名思义，全植入，就是将包括电池在内的所有核心器件都植入体内，体表没有外露部件；全无线，是指供电和数据传输都通过无线完成，哪怕是患者洗澡、睡觉、社交也不受影响；全功能，则是让同一套系统既能做运动解码，也能做语言解码和环境控制。</p>\n  <p>陶虎认为，“三全”方案能更好规避传统植入手术的感染风险问题，且有望持续、稳定地采集真实数据。在传统方案中，导线会穿过皮肤连接体外设备，是细菌进入颅内的通道，感染风险较高。而有线供电时患者又处于紧张状态，采集到的未必正常生活下的脑电。全植入加全无线，相当于堵住了这两个入口。</p>\n  <p>在这个意义上，脑机接口也不再是一个需要外部设备维持的实验系统，而是成为一个“能够独立工作的植入式系统”。</p>\n  <p>为了实现这一点，脑虎科技在设计植入方案时，选择将柔性电极贴在硬膜下的大脑皮层表面，电池、处理器、天线等高发热单元放在胸部皮下。陶虎解释，插入大脑皮层看似更“精细”，但随着脑组织晃动、颅内压变化，很容易造成电极移位或脱落。此外，一旦引发免疫反应，神经被炎症包裹，信号就会衰减，严重时还要二次开颅。贴在皮层表面，信号质量和深插基本一致，长期可靠性反而更好。未来如果要提升通道数，只需提高电极密度。</p>\n  <p>反映在患者身上，是脑虎一直追求的“不伤脑、不烧脑、可复制”，即电极不穿刺脑实质、热源远离大脑，手术借用成熟的DBS范式，神经外科医生经培训后便可独立操作。“我们希望，这套方案能带来患者尊严的回归。”</p>\n  <p>据脑虎科技提供数据，截止目前，该方案已完成65例临床试验；今年7月，“三全”脑机接口系统已正式进入三类医疗器械注册临床阶段，由复旦大学附属华山医院牵头开展GCP注册临床试验，毛颖教授团队担任主要研究者，并联合全国近20家三甲医院共同开展。</p>\n  <p>9月底，脑虎科技曾披露最新一例探索，将这套脑机接口产品的能力展示得更具体。例如，在真实生活场景中，一名受试者借助AI智能眼镜的同步定位和建图（SLAM）能力，完成视觉感知和动态建模，识别他关注的区域，并列出可控设备。然后，他用脑机接口确认意图，能自主调节病床、开关灯光和其他家用设备。</p>\n  <p>整条链路中，脑机接口是底层连接，XessOS（脑虎科技自研的脑机操作系统）负责把意图翻译成设备指令。</p>\n  <p>陶虎把这套方向称为“BCI+AI”。在他看来，脑机接口“不只是医疗器械，更是人类智能与人工智能融合的接口”，应由人负责提出目标和判断，AI和机器承接执行。一方面，脑机接口的高质量神经数据需要AI大模型做精准解码；另一方面，具身智能和大模型缺的正是“意图”的入口。</p>\n  <p>但陶虎很清楚，当前的数据量还远远不够。“几十例临床数据储备，还做不到让算法在不同患者之间无缝迁移，有可能我在这个病人身上调的模型，换到下一个人身上就不管用了。”他的判断是，至少要几百例甚至几千例，才能形成可归纳、可复现、可移植的算法。</p>\n  <p>在陶虎的设想中，脑机接口的发展会经历两个阶段。第一阶段便是现在，用有创的“三全”系统服务高位截瘫、失语、失明等重症患者，让他们“从病人回到正常人”，能独立交流、控制设备、自己生活。</p>\n  <p>第二阶段在未来3-5年后，通过有创脑机接口作为金标准，去校准信号弱、不稳定的无创方案，让脑机接口从病床走向普通人的日常，让“正常人成为超人”。“无创是行业的未来，但无创信号太差，必须用有创的高质量数据去校准。”陶虎认为。</p>", "category": "tech", "published_at": "2026-10-28T00:30:00+00:00", "fetched_at": "2026-10-28T03:43:55.048362+00:00", "fingerprint": "148242e18f573e7c"}, {"source": "36氪 - 最新文章", "title": "对话星连资本张鸣晨：在清华挖宝，看教授的虎气、猴气与熊气", "url": "https://36kr.com/p/3997098817310595?f=rss", "summary": "<p>文 | 海若镜</p>\n  <p>&nbsp;</p>\n  <p>又一支清华系基金募到了新钱，这一次是张鸣晨和他创立的星连资本。</p>\n  <p>年轻的星连资本，2021年出道时投了智谱天使＋轮，此后一路加仓，一期基金40%的钱押在智谱。勇猛加仓的故事，还发生在基流、生数科技、面壁智能身上。</p>\n  <p>对基流，他们连投了五六轮，投成了外部第一大股东。基流以15亿估值融资的关口，原本谈好的投资人临时爽约，张鸣晨说，“没关系，我们领”。不到一年，基流估值翻了10倍。</p>\n  <p>见到张鸣晨前，我理解他可能是很敢bet的激进型投资人，但他自评“还挺保守”，打牌也很少梭哈。重仓有机会homerun的公司，以高风险搏高收益，在他看来是美元基金的常规打法，他称星连资本是<strong>“披着人民币外衣的美元基金”</strong>。而今，他们募到了美元。</p>\n  <p>暗涌Waves获悉，10月星连资本一期美元基金完成首关；8月人民币成长基金首关；4月投早期的人民币三期基金完成首关。成立至今，“一期基金投出的AI项目，有三分之一在IPO轨道上。”</p>\n  <p>张鸣晨理解的保守，第一层意思是不赌假说。如果把一个复杂任务拆成8步，他不会在只解决了2步时下场；而是等学术界啃下6个，只剩2个最难的问题时，才投钱入局。</p>\n  <p>聊AI技术时，他直言“哲学没用，直接定量”。海外一款新芯片被市场热议，他不参与定性讨论，直接找几家模厂问，用完效果如何——听到事实，结束讨论。</p>\n  <p>典型的理工科思维。</p>\n  <p>在张鸣晨看来，星连重仓的胆量，<strong>源于“离得足够近”。</strong></p>\n  <p>张鸣晨本科、硕士都在清华大学自动化系，可以自然融入清华技术创业者的圈子。基��科技创业之初，没有客户，张鸣晨通过朋友帮他们协调了一批GPU，完成技术验证。投资只是一个开始。AI公司变化快，跟创始团队处得像同事，作为”一个战壕里的兄弟“，他了解重点被投的订单、管线、潜在需求，这些“明牌”让他敢于追投。</p>\n  <p>对于“投教授”，投资圈里常有摇摆，投与不投都有100个理由。<strong>张鸣晨是坚定的投资派，他定义星连资本是一家Researcher Fund，自2021年起坚定地“不投大厂，投大学”，因此，星连70%的项目出自清华。</strong></p>\n  <p>如今，市场逐步有了共识：AI正在像数学，最顶尖的1000人做了全行业95%的贡献。早于市场两年半的转向，让张鸣晨捕捉到了国内顶级研究员的机会，也更深地融入了清华创业生态，能采集到在小圈子里流通的那些信息。星连与清华大学九个研究AI的院系合作，“有的研究员刚入组，创业项目就已推了过来”。</p>\n  <p>如何判断教授的商业化潜力？他说要看“三气”：虎气、猴气、熊气。如何形成能支撑VC变现的顶级认知？<strong>“七分技术，三分直觉”</strong>。在张鸣晨看来，看的项目足够多，做的决策足够多，获得的反馈足够多，就能形成“投资手感”，像训练AI一样。</p>\n  <p>在移动互联网时代，张鸣晨作为谷歌中国第一批员工、而后加入红点中国成为合伙人，曾投资过小马智行、Opay、趣头条等。张鸣晨如何通过楼天城认识了唐杰？清华圈为什么创业成功率高？只投教育系统筛选出的“第一名”，会不会错过outlier？新的美元LP看了中国模厂后体感如何？</p>\n  <p>就诸多问题，我们与张鸣晨聊了聊，以下是「暗涌Waves」与张鸣晨的对话（经编辑）：</p>\n  <p>&nbsp;</p>\n  <h2><strong>保守入局，激进加仓</strong></h2>\n  <p><strong>「暗涌」：智谱，是星连资本一期基金投的第一个项目？</strong></p>\n  <p><strong>张鸣晨：</strong>对，2021年那轮我们是领投，之后连着投了四轮。一期基金里，有40%的钱投到了智谱。其他还投了无问芯穹、辉羲智能，后面也都在加仓。</p>\n  <p><strong>「暗涌」：最初怎么接触到智谱，又是怎么下决定投的？</strong></p>\n  <p><strong>张鸣晨：</strong>在红点中国时，我投资了小马智行。小马智行CTO楼天城，曾经被称为是“中国编程第一人”，清华计算机04级、姚班开山大弟子，清华很多人都叫他“楼教主”。有天他就说，你们一定得认识一下唐杰，计算机系vision最好的老师之一，非常厉害。唐杰老师拿了系里历史上第一篇ACM best paper。现在大家发得比较多了，但在2020年之前，那真的是凤毛麟角。</p>\n  <p><strong>「暗涌」：那时候智谱已经在创业了么？</strong></p>\n  <p><strong>张鸣晨：</strong>还没有。但他已经带着一批人在做项目，杨植麟、刘知远等都是他们一个组。当时他们在智源研究院，做出了中国全行业第一个大模型，叫“悟道”。<strong>为什么叫“悟道”呢？因为模型是在五道口训的。</strong></p>\n  <p>这个团队，其实就是中国大模型的黄埔军校，国内模厂的很多技术主力，都是这里走出去的。大家掌握了炼丹的技巧，开枝散叶，形成了中国大模型的整体格局。</p>\n  <p>智谱起家的业务是知识图谱，所以他叫智谱。干大模型这件事，一定程度上是我跟唐老师一起讨论出来的。当然最后拍板还是智谱自己的团队，但我们起到了重要作用。智谱体系内训的第一个模型，花的就是星连那笔钱。</p>\n  <p><strong>「暗涌」：那考虑过投Kimi么？</strong></p>\n  <p><strong>张鸣晨：</strong>当然。但三四年前，愿意在早期bet大模型的钱就那么一些，资本供给侧是零和游戏，所以比较紧张，我们就重点押在智谱上。现在大家都看明白了，这些都成了“国宝级项目”，一堆钱追着投。</p>\n  <p><strong>「暗涌」：智谱上市后股价大涨大跌，LP会追着问吗？</strong></p>\n  <p><strong>张鸣晨：</strong>也会。上市后都是公开信息，高点时市值超万亿，自然受关注。但二级市场波动很正常，它不光是基本面决定的，还跟宏观货币供应、板块轮动等很多因素有关，像弹簧，围绕fundamental上下波动。</p>\n  <p>我们更关注智谱的商业基本面。中期业绩会上，他们披露了新数据，计算下来8月单月收入相当于前6个月总和，增速非常快。</p>\n  <p><strong>「暗涌」：投中一个明星项目不算罕见。但持续加仓，挺考验魄力。基流，你们投了几轮，把自己投成第一大外部股东？</strong></p>\n  <p><strong>张鸣晨：</strong>大概五、六轮吧。基流一开始找到我时，只有非常强的技术，没有客户。聊完以后，我不光给了投资，还帮着联系了智谱，协调出一批GPU，支持他们做技术验证。所以，我不光给第一张term sheet（投资意向书），还给第一张商业合同。</p>\n  <p>为什么清华创业成功率高？首先肯定技术过硬，其次清华人真抱团，遇到事情真帮忙。</p>\n  <p><strong>「暗涌」：投基流的几轮里，哪些是雪中送炭，哪些轮得抢份额？</strong></p>\n  <p><strong>张鸣晨：</strong>我记得非常清楚，15亿估值时，原本谈好的一个投资人掉了，公司给我打电话，我说没关系，我们来领投。那是去年的事，不到一年，基流现在估值已经150亿了。</p>\n  <p><strong>「暗涌」：敢连续加仓，底气来自哪里？</strong></p>\n  <p><strong>张鸣晨：</strong>我们跟企业走得很近，与创始团队相处就像同事，有事随时打电话。所以对公司既有订单、未来管线、潜在订单需求等，都非常清楚。外部投资人对业务未必能了解这么全面，特别AI企业，三个月可能完全变样。</p>\n  <p>大家是一个战壕里的兄弟，一起把生意做大。那他遇到困难会找我，有好事也会想到我。比如，基流有卡可以出租了，我们投的哪些企业需要算力，也能最早知道。</p>\n  <p><strong>「暗涌」：估值翻了几倍后，再追投会犹豫么?</strong></p>\n  <p><strong>张鸣晨：</strong>投资要往后看。今天这个价格投下去，后面还能不能有10倍的投资回报？如果有，今天就是好价。单看估值是100亿、1000亿，判断不了贵不贵。我们对基流的业务足够了解，所以没有犹豫。</p>\n  <p><strong>「暗涌」：所以重仓加注，在星连比较普遍？</strong></p>\n  <p><strong>张鸣晨：</strong>智谱、生数、面壁、基流等，这些项目我们都多轮加仓。</p>\n  <p><strong>「暗涌」：很多项目都需要重度陪伴，管得过来吗？</strong></p>\n  <p><strong>张鸣晨：</strong>投的企业多了，有的也长大了。有点像家里孩子多，老大带老二、老二带老三，互相之间就转起来了。</p>\n  <p><strong>「暗涌」：你会用“激进”去形容自己的投资风格吗？</strong></p>\n  <p><strong>张鸣晨：还挺保守。我们不赌hypothesis，不会为假说买单。</strong>一个复杂任务，如果有8个问题需要解决，我不会在解决了2个、还剩6个的时间点进去；而是在学术界已经解决了6个、还剩下2个最难的timing进去，给钱，让他把最难啃的骨头解决掉。</p>\n  <p><strong>「暗涌」：你们会讨论科技哲学吗？比如AI将怎样改变组织和社会吗？</strong></p>\n  <p><strong>张鸣晨：</strong>不用哲学，我们就做定量讨论，哲学没用。</p>\n  <p>直接问研究员：这事已经跑了多少步，有没有收益，能不能跑通。之前大家疯狂讨论一种新型芯片，很多人做定性讨论：它能不能用来跑模型。我直接问几家模型公司：你们用完怎么样？他们说掉点很严重。OK，这事就结束了。</p>\n  <p>真正开会的时候，我们都很严谨，聊技术、聊实际问题。哲学是课余愿意聊就聊。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>在清华挖宝</strong></h2>\n  <p><strong>「暗涌」：在外界看来，星连资本有一些标签，比如智谱CVC、清华系、AI native，你自己怎么定义这支基金？</strong></p>\n  <p><strong>张鸣晨： </strong>我们自己定义是Researcher Fund。美国AI产业里，最好的研究者都在大公司，投AI的基金围着几家大公司找人；中国顶级研究人员在几所顶尖大学里，逻辑不一样。</p>\n  <p><strong>「暗涌」：所以你们投的项目70%来自清华。“智谱CVC”是当下你最想澄清的一个标签？</strong></p>\n  <p><strong>张鸣晨：</strong>也还好。智谱确实是我们最重要的合作伙伴之一。但市场上有种误读，觉得我们是智谱下面的投资部门，这不对。有些项目会觉得中间有冲突，不愿意聊。我们会解释：星连是market-based的基金，大部分钱是市场化渠道募集而来，智谱不是我们的大LP。</p>\n  <p><strong>「暗涌」：之前投智谱、面壁、基流等都是清华系创业者。密集投清华的项目，你有什么体感？</strong></p>\n  <p><strong>张鸣晨：</strong>投清华的项目比较简单。</p>\n  <p>清华教授做的项目，在技术上不需要做特别的判断。能考到清华读书本就经过了严格筛选；清华计算机系一个年级150个人，能留校的只有一两个人。留校后，还有非升即走考核。在清华里能当tenure，都是各自领域里的“世界级人才”。所以主要判断，在商业上，他是不是一个足够有潜力的人。</p>\n  <p><strong>「暗涌」：商业潜力的判断有什么方法论么？比如怎么判断一个年轻PI融资，是为了成就一家商业公司，还是想买卡做科研？</strong></p>\n  <p><strong>张鸣晨：</strong>我们说要“看三气”，<strong>虎气、猴气、熊气。</strong></p>\n  <p>虎气，是说你要有领导力，不光自己学术做得好，还能把更厉害的研究员团结起来创业。猴气是足够聪明，有很强的vision、insight、taste。熊气，要有执行力、落地能力。我们也看到过行业里很多人光说不练，偏参谋型，这种就不适合做1号位。</p>\n  <p>最理想的肯定是三种气质都有。看得多了，会形成一种肌肉记忆。几次接触下来，我们就能感知到创始人哪方面气质格外突出，长板在哪里。</p>\n  <p><strong>「暗涌」：现在是技术投资的时代，如果全世界同行都评议筛选过了，为什么许多投资机构在早期没投中清华系模厂？</strong></p>\n  <p><strong>张鸣晨：</strong>第一，AI技术确实新。很多老牌TMT投资机构的技术栈储备不够用了。第二，机构认知是否足够深。历史上有投了多个清华项目的投资人，错过了清华几个模型、重要Infra公司，还是因为没有看明白“模型”。早期非常恐惧，担心做大模型有诸多风险、没有商业模式。</p>\n  <p>聊早期项目先问\"商业模式是什么\"，这是典型的人民币基金风格；但模型和infra早期其实很难谈出来，所以就没投。</p>\n  <p><strong>「暗涌」：从TMT到AI，投资逻辑发生了哪些变化？</strong></p>\n  <p><strong>张鸣晨：</strong>对于投不投教授，TMT投资人会有惯性、有摇摆。因为互联网公司需要强运营，要求创始人必须接地气、能打仗，把经济账算到极致。这些确实教授不擅长。</p>\n  <p>但AI更加技术驱动，它第一性原理是最高水平的研发，技术是决定性要素。有点像数学界——最顶尖的1000个人，干了全行业95%的事。</p>\n  <p>而且现在从技术到商业的转化非常直接，不经过销售和运营，只要做出一个好模型、好产品，通过GitHub、Twitter可以迅速传播，用户可以马上接API，公司就能产生收入。所以这个时代，顶级researcher大放异彩。</p>\n  <p><strong>「暗涌」：清华系师生准备创业了，你们通常怎样第一个知道？那个“雷达”长什么样？</strong></p>\n  <p><strong>张鸣晨：</strong>我们有很多官方渠道，通过孵化器，我们跟清华技术转化部门等建立了合作框架，对口单位和院系都会给我们推项目。清华研究AI的有9个院系，我们都有合作。</p>\n  <p>因为之前投资过很多清华教授，老师们有时也会主动推荐项目。包括清华姚班也很鼓励创业，有的研究员刚入组成为PI，大家就把他的创业项目推荐过来了。深入合作，关键是意愿、能力、信任，这三点我们都具备。</p>\n  <p><strong>「暗涌」：作为智谱、基流的天使投资人，在清华创业生态里，你认为自己属于什么角色？</strong></p>\n  <p><strong>张鸣晨：</strong>我们自己定义是，做被投公司的副驾驶。</p>\n  <p>创业三个要素：人、钱、事。除了给钱，人和事我们也一块来帮公司规划。清华老师介绍项目过来，也会说我们“是清华圈最知道怎么做AI项目、配置资源的，你们一定要过来聊聊。”</p>\n  <p>我们相当于建了一个<strong>“AI投资Infra”，一个AI创业供应链。</strong>把高校和产业、资源打通，批量产生高质量的AI创业项目。清华的人才其实是全国的人才，让全国受过最好教育的人，把最好的能力转化成AI生产力，最后释放到全社会。</p>\n  <p><strong>「暗涌」：只在圈子内流动的信息多吗？</strong></p>\n  <p><strong>张鸣晨：</strong>很多。researcher 是个小圈子，靠不靠谱，吃个饭、喝个酒，一聊就聊出来了。</p>\n  <p><strong>「暗涌」：有些熟人推荐来的项目，会碍于人情投一点钱吗？</strong></p>\n  <p><strong>张鸣晨：</strong>我们投资决策是市场化的，大家标准统一：首先，只投全市场最好的1%项目。第二，这个项目后边能有10倍投资回报。</p>\n  <p>用这两个标准筛选，明显的资源类项目，我会拒绝掉，不是清华项目照单全收。因为正是严格筛选，好项目才愿意拿我的钱，创始人看重的是“我跟谁是Peer”。</p>\n  <p><strong>「暗涌」：看好这类项目，你们会是领投、给出最高价格的那一家吗？</strong></p>\n  <p><strong>张鸣晨：</strong>基本都是领投，但不见得出价最高。最近我们孵化了清华一位教授的项目，市场上追的人很多。最后我们给的价格并不最高，他还是选了我们。因为两年前，我们就开始帮他探索这个生意，一起设计商业模式、补团队。他觉得和我们一起做靠谱，估值比别人低一些，也可以接受。</p>\n  <p><strong>「暗涌」：只投体系筛选出来的第一名，会错过王兴兴那样的outlier吗？</strong></p>\n  <p><strong>张鸣晨：</strong>我们也愿意投outlier，比如我们在深圳投的Zettlab，是大疆和云鲸出来的人，做个人龙虾机（agent computer），做得非常好。不管哪个大学毕业，本质上还是挖掘“人”。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>募到双币，去出海</strong></h2>\n  <p><strong>「暗涌」：为什么在今年决定募美元基金？</strong></p>\n  <p><strong>张鸣晨：</strong>今年市场上越来越多项目倾向于拿美元：原来10个项目只有一两个，今年增加到四五个。特别是一些从美国回来的华人创业者，公司注册在香港、新加坡，没有美金不好投进去。</p>\n  <p><strong>「暗涌」：星连资本成为一家双币基金，对你个人来说有什么意味么？</strong></p>\n  <p><strong>张鸣晨：</strong>比较顺理成章，我老说星连是<strong>“披着人民币外衣的美元基金”。</strong></p>\n  <p>我们核心投资人基本都是美元基金背景，看人、看事、公司管理更偏美元风格，现在只不过真的手里有了美金。币种其实无所谓，我们一直关注的是怎么投资到伟大公司。</p>\n  <p><strong>「暗涌」：感兴趣投资中国AI的美元LP，有哪些新特点？</strong></p>\n  <p><strong>张鸣晨：</strong>有一点挺重要，最近聊的美元LP很多都有产业属性，愿意跟中国AI技术公司做战略合作、出海。</p>\n  <p><strong>「暗涌」：是传统的产业集团么，具体怎么合作？</strong></p>\n  <p><strong>张鸣晨：</strong>一些海外产业集团，主业是运营商、大连锁、头部金融公司等等，他们非常愿意搭着AI技术公司一起去做商业拓展。</p>\n  <p>就在前些天，欧洲一家管理约2000亿美元资产的机构，CEO特意跑到我们办公室。他发现他们每月花大量的钱买token去做行业研究、build内部系统。之前，多一半预算是花给美国模型做复杂任务规划，少一半花给中国模型做执行，中国模型性价比最高。</p>\n  <p>之后他觉得可能会反过来。他就想来看看，中国到底是一帮怎样的人在做模型，后面会怎么发展？既然中国模型这么强，那我们能不能战略合作，我帮你去打开欧洲客户的市场。</p>\n  <p><strong>「暗涌」：看了五道口这边的模厂、Infra公司之后，有什么他预期之外的东西吗？</strong></p>\n  <p><strong>张鸣晨：</strong>看完就觉得欧洲人自己别做了，投资中国AI公司，建合资公司、一起做生意就行。他们有市场，我们有技术。</p>\n  <p><strong>「暗涌」：技术上，这些潜在美元LP会问得特别细？</strong></p>\n  <p><strong>张鸣晨：</strong>他们看得非常深。有些美元LP跟VC一样，投资人每天看行业，看项目，一起交流前沿问题。比如最近recursive（递归式自进化）很热，OpenAI、Anthropic、国内几个大模型公司都在做，新成立的startup空间在哪？再比如World Model哪条路线能收敛？中国的算力怎么能追上？都是行业一线问题。</p>\n  <p><strong>美元募资对我们来说，反而简单一些，他们就看业绩、看行业认知。</strong>要体系化地讲清楚：昨天在哪，今天在哪，明天在哪。</p>\n  <p><strong>「暗涌」：业绩如何？</strong></p>\n  <p><strong>张鸣晨：</strong>星连一期基金有几十个项目，接近三分之一都在IPO轨道上。TMT时代，一期基金的常规IPO Rate 2% - 5%，我们现在是30%。</p>\n  <h2>&nbsp;</h2>\n  <h2><strong>AI投资：七分技术，三分直觉</strong></h2>\n  <p><strong>「暗涌」：你多次提到AI时代投资要懂技术、要有顶级认知。你是一个绝对理性的人么？你所说的“顶级认知”从哪里获得？</strong></p>\n  <p><strong>张鸣晨：</strong>AI时代投资更强调理性，但也不能100%是机器人式逻辑思维，也有感性的东西。很多事情有不确定性，等完全想明白再投，也晚了。</p>\n  <p>非要划分的话，可能三七开。70%靠技术，是对行业、对企业的认知；30%靠直觉。好多时候直觉没有依据，但确实也很重要。</p>\n  <p>我跟同事讲，投资无非“两个多”：看的项目多不多，投的项目多不多？多了，自然产生手感。人也像一个神经网络，有很多说不清道不明的东西，但喂的数据足够多，就很容易形成机制。投资，是在不确定性里追求确定。靠运气可能找到一两个好项目，但不可能保障整个基金实现系统性的高收益。</p>\n  <p><strong>「暗涌」：听起来跟训AI模型一样。早年你在聊趣头条的投资判断时说过，投资人获得一手信息是晚于市场信号的。现在投AI呢？</strong></p>\n  <p><strong>张鸣晨：</strong>好的GP必须提高信息收集频率，加快认知迭代。传统TMT投资，一个月更新一次信息可能够了，但AI每周、每天都有新东西，必须每天都接触最前沿的信息。</p>\n  <p>我们孵化器一年有100多场活动，顶级学者、工程师每天在想什么，技术推进到哪，市场需求在哪，都要跟他们一起交流。光触达信息还不够，你得“学而思”。拿到信息之后，不断理解、思考，把它变成自己的东西。</p>\n  <p><strong>「暗涌」：把这些认知落到投资上，下一步你会把钱投向哪里？星连投在芯、算、模、用的比例如何？</strong></p>\n  <p><strong>张鸣晨：</strong>多一半在模和算，这是最基础、价值最大的，少一半在芯片和应用。但接下来，好应用会越来越多，有了好的模型和算力，拿它“炒菜”，就能炒出好菜。</p>\n  <p>今年vibe coding起来后，模型已经足够聪明。金融资产管理、医疗（诊疗、制药）、教育等都在出AI新应用，他们利用大模型的底层能力，显著提高了产品体验，正在给用户带来效率价值。</p>\n  <p>这有点像移动互联网的2011、2012年，移动网络铺好了，字节、快手、小红书就该出来了。</p>\n  <p><strong>「暗涌」：去年投应用特别热，今年上半年很多人说不投应用。下半年风向又变了？</strong></p>\n  <p><strong>张鸣晨：</strong>跟着模型能力走。模型变强了，大家就担心“应用”会被整个吃掉。但其实不是的，很多场景能产生独立的应用层，有自己的价值。所以哪个市场大，就先做哪个，里面可能会出现一个或几个超级应用。</p>\n  <p>我们跟模型公司离得很近，认知可能比市场领先半年到一年，所以看起来我们老跟市场反着来。</p>\n  <p><strong>「暗涌」：你怎么判断，哪类应用不会被通用模型吞掉？</strong></p>\n  <p><strong>张鸣晨：</strong>看整个工作流里，有没有human in the loop。只要最后需要人来决策，或者必须有人提供反馈，这类场景就有独立存在的空间。像吃药、开刀，最后还得由医生拍板；而且没办法给出非常清晰的奖励函数。</p>\n  <p>如果全过程AI都可以主动运行，结果又能明确判断0或1（对与错），比如coding、数学，通用模型就可以不断获得反馈、自主迭代进化，做得非常好。这些场景很可能被模型吃掉。</p>\n  <p><strong>「暗涌」：模型能力仍在往上走。现在这些创业团队想解决什么问题、大机会在哪里？</strong></p>\n  <p><strong>张鸣晨：</strong>现在有一波Neo labs，想用新架构，把Transformer的效率提升很多倍，让模型更聪明，同时更省算力。</p>\n  <p>比如人脑是分区的，做不同任务会调动不同区域。神经网络里的参数，作用也不均匀。有一派研究员就在研究，哪些节点在什么任务里起作用，能不能把它识别出来，只激活1%的参数，就把任务解决了？还有一种思路，找到网络里的几个“超级节点”，通过改善这些节点，迅速提升整个网络的表现。</p>\n  <p>这些都很有价值。假如现在ChatGPT是120分，换一种架构，有没有可能迅速提高到150分。</p>\n  <p><strong>「暗涌」：回看移动互联网时代，你会反思那些错过吗？比如投了趣头条，没投今日头条；投了秒拍，没投快手。</strong></p>\n  <p><strong>张鸣晨：</strong>肯定会。既要选对赛道，也要选对赛手，核心还是把握产业的底层逻辑和规则。AI这一波，我们还是吃到了很大的红利。</p>\n  <p><strong>「暗涌」：你说终极目标是投到伟大的公司，对你自己而言，更底层的驱动力是什么？</strong></p>\n  <p><strong>张鸣晨：</strong>挣钱有很多条路。VC特别幸福的地方，是你可以通过好奇心获得顶级认知，用认知去做未来的事，去改变世界。这是一级市场最有意思的地方。</p>\n  <p><strong>「暗涌」：最有成就感的时刻，是自己的判断一步步得到验证？</strong></p>\n  <p><strong>张鸣晨：</strong>对。真的从零开始，像养孩子一样，一点点帮他长大。看到他做得很好，考上清华、北大，真正成才了，是这种感觉。我们真正创造了价值。</p>", "category": "tech", "published_at": "2026-10-28T02:25:15+00:00", "fetched_at": "2026-10-28T03:43:55.048356+00:00", "fingerprint": "6361e0773efe5d0d"}, {"source": "36氪 - 最新文章", "title": "接入AI半年后，一家自闭症康复机构辞了兼职督导", "url": "https://36kr.com/p/4044028040844417?f=rss", "summary": "<p>文 | 刘凌果</p>\n  <p>编辑 | 海若镜</p>\n  <p>教一个四岁半的孩子认识什么是苹果，要花多长时间？对自闭症儿童而言，这是个未知数。</p>\n  <p>欢欢坐在小板凳上，康复师将印有苹果图样的小卡，一张一张举到她的眼前：红苹果、蛇果、切开的苹果、咬了一口的苹果、苹果简笔画，她要辨认并回答，以上都是苹果吗？答对了会被康复师记作“+（加）”，反之记为“-（减）”。对普通孩子而言，这种相对简单的认知泛化能力可自然习得，但一些自闭症儿童可能需要上百次练习。</p>\n  <p>一堂30分钟的课程下来，康复师至少会进行30个问答回合，每回合可以视作一条行为数据。欢欢母亲告诉36氪，孩子一天需要上七节课，一周五天，全年基本无长间断。这意味着，大量带有明确“教学-行为-反馈”对应关系的数据，在这个过程中形成。</p>\n  <p>过去，这些数据主要用于让老师判断一堂课的完成情况。当前，它们被用于训练AI，成为一门新生意。</p>\n  <p>“把稀缺的督导经验，产品化、规模化输出。”特需儿童康复企业大米和小米研发副总裁王占伟表示，2023年下半年，随着各家基座模型陆续推出，利用公司积累的儿童康复过程数据训练模型，并将其嵌入机构中评估、排课、教案生成等工作，开始具备可行性。随后，大米和小米联合亚马逊云科技，定制了AI系统。目前，该系统已在近100家直营门店及300余家合作机构中使用。</p>\n  <p>在河南平顶山，一家特需儿童康复机构于今年1月接入AI，半年后，负责人宋文涛表示，已辞退此前外聘的兼职督导，因为AI已可以承担督导的部分工作，成本也更低。</p>\n  <p>在自闭症康复机构中，康复师更多是督导方案的执行者，负责直接给孩子上课；督导则需有多年一线康复师工作经验，具备评估孩子情况，确定干预课程等“高阶”能力。</p>\n  <p>一名康复师成长为合格督导，需要至少三到五年的时间。但缺少专业支持的康复机构却难等很久。当前，AI正以“督导”的角色，进入长期缺人的特殊康复赛道。</p>\n  <h2><strong>三四线城市开始买单</strong></h2>\n  <p>家住河南平顶山的欢欢，三岁时经医院确诊自闭症后，家人也曾考虑送她去省会郑州接受康复训练，但“一个月（医保报销完后），得花一万多。”欢欢母亲提到，除却课时费，加之租房、交通、全职陪护等成本，家里难以负担。</p>\n  <p>同时，她表示，郑州头部自闭症康复机构康复师和督导人手紧张，孩子一天只能排上三到四堂课，“还得额外找小机构加课，一节课都三四百。我琢磨着，一个月没3万下不来。”权衡之下，欢欢最终留在平顶山接受康复训练。</p>\n  <p>留下来是迫于现实，但家庭对专业康复训练的需求仍旧强烈。事实上，这种需求近年来还在持续上升。随着筛查评估的覆盖面拓宽，过去未被识别的自闭症儿童，正更多地走进康复体系。</p>\n  <p>“从2019年开诊至今（2025年），我们的孤独症专病门诊的门诊量逐年增加，现在年门诊量已经从300人次左右增至约3000余人次。”北京安定医院儿童精神科副主任医师戚艳杰在接受媒体采访时曾提到。</p>\n  <p>中国疾控中心2026年4月援引国家卫生健康委筛查数据称，我国儿童自闭症患病率约为7‰，自闭症总患病人群超过1400万。</p>\n  <p>这种需求传导至供给端，促使康复机构迫切希望填补人力空缺、提升服务质量。但专业能力建立在经验之上，而经验“急不来”，行业的人才缺口也因此长期难以填平。“1个康复师平均每天给4到6个孩子上课，1个督导可能要督五六十个个案。”大米和小米资深督导郑恬提到。</p>\n  <p>引入AI前，宋文涛曾外聘持有BCBA（国际认证行为分析师）证书的兼职督导。据他回忆，外聘督导每月提供1-2次线上教学，年聘用费用达十几万元。但由于其授课时间有限，覆盖个案量不足，更无法持续跟踪单个孩子的变化，效果不尽人意。</p>\n  <p>AI的“补位”恰逢其时。</p>\n  <p>填缺口是一方面，另一重意义，是让机构的服务更具差异化。宋文涛介绍，在平顶山等三四线城市，受限于专业人才供给，各家儿童康复机构服务质量相近，过去主要依靠降价竞争。引入AI后，宋文涛在原有每节40元、60元的课程之外，增加每节80元的AI课程，目前约有30%的家长报名。</p>\n  <p>近两年，宋文涛旗下的机构扩展至十家。他表示，后续会让所有机构用上“AI督导”，帮助新人康复师快速上手、标准化教学，让各店服务质量更一致和稳定。</p>\n  <p>降成本、提客单价、拉开服务差距、有利于标准化扩张，共同构成AI进入康复机构的入场券。</p>\n  <p>沿着付费链条继续向下，家长是最终的买单方。而家长的付费意愿主要取决于AI能否给孩子带来实质性康复进展。当前，据大米和小米提供的一项对照研究，三家第三方机构的65名儿童接受三个月干预后，AI介入组儿童在社交互动、语言沟通、认知和模仿等五个领域的进步均优于普通干预组。</p>\n  <p>这些变化是如何发生的？</p>\n  <h2><strong>AI更早“懂”孩子</strong></h2>\n  <p>AI与孩子的第一次见面，是在评估中。</p>\n  <p>评估类似于针对儿童能力发育的“体检”，与医院诊断的区别在于，不是下诊断结论即可，而是摸清楚孩子具体会什么、不会什么、为什么不会？目的是指导下一步干预。</p>\n  <p>郑恬解释，一个孩子“不会说话”，可能出于沟通意愿不足、无法模仿口部动作、听不懂指令，也可能是能听懂却不知如何表达，只有进行细致评估后，才能“对症下药”。</p>\n  <p>此前，康复师通常要耗费数周时间，对孩子的各项能力逐一测试。再由督导分析行为数据，手动“敲”完长达十来页的报告。当下，在AI的参与下，单论报告撰写时间，由至少三个小时缩短至数秒：康复师在测评过程中，同步将孩子的反馈录入平板，测评结束时报告随之出炉，督导只需在此基础上审核、完善。</p>\n  <p>欢欢母亲提到，通过AI评估发现，实际年龄四岁半的欢欢，发育水平只达到三岁半的标准。这“一年”的差值，就是欢欢需要通过康复训练赶上的。</p>\n  <p>王占伟解释，AI会先从孩子的实际年龄出发，测试其能否完成对应阶段的项目；如果无法完成，便逐级向下寻找，直至确定能力基线，再据此确定孩子的IEP（特殊儿童个别化教育计划）。</p>\n  <p>海外也有类似探索。2024年，美国康复技术公司TheraDriver团队利用617名2—14岁自闭症儿童的评估表、诊断报告、家长访谈等资料，训练AI识别需干预的行为和待学习的技能，并生成个性化治疗方案。随后，经随机抽取6名儿童案例进行检验，发现AI生成的方案与督导的高度接近。</p>\n  <p>但IEP更接近一份待完成的“技能点”清单，具体先学什么、后学什么，同样关键。一份“完美”的课表，得在遵循儿童发展规律的基础上，兼顾孩子的长短期目标、短板、优势等多重要素，难度不言而喻。“即便孩子每天来三个小时，一周来5天，不可能要求孩子IEP中要掌握的数十甚至百来项技能一下子同时推进。AI则可以告诉你，这些技能中，哪些应该先教，每天建议练习多少回合才能让孩子尽快掌握。”</p>\n  <p>操作中，康复师可直接在对话框中输入孩子的上课频率、训练时长等基础信息，以及喜欢小车、吹泡泡、挠痒痒、举高高等个性偏好，甚至包括家长重点关注的特质等“场外因素”，由AI综合分析后，出具康复方案。</p>\n  <p>正式开始训练课程后，个性化的教案和教具生成，更是AI的“绝对领域”。仍以“认识苹果”为例，自闭症儿童可能刚学会认识树上的苹果，转头就认不出被摘下的苹果。为了确认孩子真正掌握一个概念，从前老师需要用搜索引擎获取各异图片后，打印、裁剪、塑封、整理。现在，AI让范例的获取变得极其便捷，各式各样的苹果“一键获取”。</p>\n  <p>不过，这也是通用大模型完全可以实现的功能。对此，王占伟解释区别在于：通用大模型给出的是一般性通用范例，而大米和小米AI始终基于这个孩子过去所有的干预情况以及专业数据库信息，给出独属于这个孩子的“定制范例”。例如AI会判断，到底是哪种变化，让这个孩子突然又无法认识苹果了，并针对性训练。</p>\n  <p>类似的，AI还可以根据孩子的照片和康复目标定制绘本；对于害怕陌生环境的孩子，老师可以将机构大门、教室和厕所融入故事，帮助其提前熟悉环境；在集体课上，AI能根据人数、能力基础和训练目标层出不穷地设计新游戏。</p>\n  <p>自闭症儿童的康复周期往往以年为单位，每上完一堂课，孩子可能都会有细微的变化。这些不易被察觉的微小改变，被AI捕捉后，会不断强化其对孩子的“理解”；再类似“实时定位”的导航，告诉康复师下一步该做什么。此外，就算康复师离职，对孩子的跟踪记录也已被AI完整留存。</p>\n  <p>另一个很需要“导航”的是家长。由于接受干预的自闭症儿童年龄普遍较小，且不善交流，家长对孩子的具体情况过去往往了解不足。去年底，在给欢欢报了AI介入的课程后，欢欢母亲提到，最直观的感受就是“目标更清晰了”。例如，家长能在平板上看到，孩子在声母“k”的发音上掌握度达80%等信息。</p>\n  <h2><strong>回到人的世界</strong></h2>\n  <p>对这个长期依赖人力和经验的行业而言，AI已证明自己能辅助承担多项任务。但这是在专业人才供给不足的前提下，从无到有的填补，并不意味着其必然全方位优于与孩子有丰富接触、相处经验的专业督导。</p>\n  <p>“AI可以提供丰富的互动游戏、活动思路，让老师在此基础上进一步优化上课方式。”郑恬提到，但一套由督导精心打磨的课程，在创新性、临场适配上，不一定输给AI。毕竟，AI与孩子总有“时差”，康复师是与孩子真实互动、建立情感联结的那个人。这与康复的目标本身也契合：让孩子能更自在、舒适地回到“人的世界”。</p>\n  <p>当前，AI更直接的价值，仍是提升康复师、督导的工作效率，充当“超级辅助”的角色。更少的案头工作，“身兼数孩”的督导就能挤出更多时间陪伴难以适应课堂的孩子、当面指导康复师的教学方式、安抚因孩子近日未有明显进步而焦虑的家长，让人的专业能力回到最不可被替代的环节。</p>\n  <p>这个“超级辅助”的能力上限，依赖于康复师持续的“新数据投喂”。郑恬在给中小机构培训时发现，由于许多康复师此前没有逐回合记录的习惯，即使机构引入AI，也难以做到完整数据的录入。长此以往，AI可能“跟丢”目标。</p>\n  <p>那么，在数据充足的情况下，AI能否真正代替康复师下判断呢？</p>\n  <p>目前答案也仍是不能。王占伟表示，AI生成的内容都会由人工进行审核把关，才会进入实际流程。一次，AI判断欢欢已掌握某个训练项目，可以进入下一目标，康复师却认为她还需要继续巩固。</p>\n  <p>欢欢母亲表示，她觉得AI并没有真正坐在孩子对面，与孩子有眼神、语言、情感交流，所以自己更信任老师的判断，“AI给一点，督导老师再给一点，我感觉那就更好了。”</p>\n  <p>吃饭、睡觉、做游戏、出行等日常生活同样是孩子天然的“训练场”。当前许多公司都在针对性开发居家干预类产品。例如让孩子通过平板，与AI一问一答，反复练习看图识物，在打招呼、借东西、轮流游戏等模拟场景中学习社交技能；将AI装进毛绒萌物具身智能机器人，当孩子哭闹、烦躁、低落时，机器人主动发起交流，给予及时的情感支持；让家长通过APP，直接就棘手问题线上求教AI，并根据指导自行开展家庭训练。</p>\n  <p>欢欢母亲表示，自己很乐意尝试此类产品，但主要顾虑在于，自己在家给欢欢上课时，“她根本都不理我，都不觉得我是老师，就觉得我还是妈妈。”AI进入自闭症康复，可以当“老师的老师”、“家长的老师”，却仍难以代替人，与孩子建立真实的关系。</p>\n  <p>未来，机器人或许也能坐在孩子面前，举起一张小卡，问一句“这是苹果吗？”但孩子会愿意抬起头、面对注视，并给出回答吗？这仍未可知。</p>\n  <p>（应受访者要求，文中欢欢为化名）</p>", "category": "tech", "published_at": "2026-10-28T02:33:44+00:00", "fetched_at": "2026-10-28T03:43:55.048349+00:00", "fingerprint": "926e1a35380cb2c6"}, {"source": "36氪 - 最新文章", "title": "从濒临破产到成为独角兽，xTool还在等待「大结果」", "url": "https://36kr.com/p/4044945806726023?f=rss", "summary": "<p><strong>文丨</strong>张子怡</p>\n  <p><strong>编辑丨</strong>袁斯来</p>\n  <p>作为一家在硬件圈名声仅次于拓竹的公司，xTool有些过于低调。</p>\n  <p>普通人或许并不熟悉它的产品，也很难想象，它靠激光雕刻机这类细分产品，一年做到20亿营收。</p>\n  <p>今年年初或许是xTool最辉煌的时刻。它在港交所递表，成为少数走到上市阶段的硬件创业公司。当拓竹暂时没有上市进展时，投资人期待着xTool成为“下一个Insta360”。</p>\n  <p>故事接下来的转折让人意外。硬氪多方验证了解到，由于架构的原因，xTool赴港上市进度受到过一定影响，但已再次秘密递表。</p>\n  <p>xTool创始人王建军对这种起落并不陌生。</p>\n  <p>xTool的前身Makeblock曾是steam教育类公司中的明星企业，2021年却濒临破产，账面不过千万元。最困难时，王建军带着团队到处路演，还想竞标一家投影公司的海外电商代理。</p>\n  <p>王建军顶着内部从上到下的压力，推出桌面级激光雕刻切割一体机D1，该款机器让公司营收跨越至数亿元，又用不到四年时间，靠着几款细分赛道的产品，长成营收20亿的独角兽。</p>\n  <p>但对中国硬件创业公司而言，蓝海只会存在很短暂的时间。xTool也无法逃开凶狠的围猎。</p>\n  <p><strong>根据xTool招股书，其2025年前三季度的同比增速出现明显下滑。不过硬氪了解到，xTool营收第四季度有所回升，2025年全年收入同比增长超过30%。今年上半年，xTool收入增幅约80%-90%。</strong></p>\n  <p>这并不意味着xTool可以安枕。</p>\n  <p>“赛道涌现出相当多竞争对手，一下绷紧了神经。”一位投资人告诉硬氪。</p>\n  <p>反常识的是，xTool的竞争对手根本不是同类友商。在数位投资人看来，3D打印、CNC都有部分替代甚至取代激光雕刻产品的可能。2025年初，拓竹就发布了一款集3D打印、激光雕刻切割、数控刀切和绘图于一体的设备。</p>\n  <p>拓竹显然尝到了甜头。其于今年9月正式发布消费级CO₂激光切割机R1，最低价格为2499美元，xTool类似产品价格为3000美元左右。显然，拓竹将直接狙击xTool，成为它最强大的竞争对手。</p>\n  <p>xTool的崛起和当下遭遇的围攻，如同硬件行业一个寓言。它代表一个优秀创始人带领公司在小众赛道能做到的极致。残酷之处也在于此：在全球硬件制造中心，爆款只是个开始，接下来是一场永无止境的逆水行舟。</p>\n  <h3><strong>01 绝境的背水一战</strong></h3>\n  <p>灵感不一定是成功的源起，但绝望常常是。xTool成功其实是一场险胜，而王建军展示出出色的判断力。</p>\n  <p>他是一个头脑很灵活的人。硕士毕业，王建军到深圳上班，不到一年就辞职，“带着个背包就钻到硬件孵化器里去了。”一位行业人士回忆。</p>\n  <p>王建军出于兴趣创立了一家硬件公司Makeblock。那是2012年，离“万众创业”还有三年，王建军已经跟着孵化器去硅谷参加demo day。他上过Fast Company杂志，拿过红杉、TMC的投资，2020年时公司估值已经到了30亿。</p>\n  <p>没人想到，一年后，Makeblock会因为疫情叠加双减濒临破产。</p>\n  <p><strong>“账上真的只有几千万，公司基本上没有正向收入，一直在烧以前投资人的存款，真的是背水一战。”一位前员工回忆。</strong></p>\n  <p>员工很难体会王建军承受多大的压力。“因为在他身上很难看到真正的疲惫或情绪不稳定。”他们只是发现，老板变了，“他说他再也不从他自己的梦想里去想出路了，得从商业机会里去找。”</p>\n  <p>王建军做了各种尝试。至今你都能在xTool的Kickstarter上看到低谷期做过的产品，包括儿童机器人、无人机配件。这些产品的表现并不尽如人意。</p>\n  <p>更多时候，王建军在花时间研究海外的数据营销工具。他用插件在亚马逊站内找不同品类的搜索量，最后发现激光产品销量不错，而且基本都是质量不高的白牌。这意味着，整个激光赛道还没有出现品牌卖家。</p>\n  <p>然而，当王建军提出要做激光产品时，所有人都反对。因为创客工场在2019年推出过激光盒子（Laser box），“一个月卖不了几台，还会经常坏。”上述前员工回忆到。</p>\n  <p>王建军眼中看到的是和员工不一样的图景。</p>\n  <p>相比Laser Box的时代，激光器那些年提升最大的是功率。类似计算机行业的摩尔定律，激光器每隔一两年功率会翻两倍，到2021年时，已经达到5瓦——这意味着激光器可以切割更硬的材料。</p>\n  <p>“xTool抓住了供应链（激光器合光技术发展）升级的机会，而且他们不是临时起意，而是有激光产品的研发基础。”Maker赛道的一位创始人告诉硬氪。</p>\n  <p>还有一点是对用户群体的把握。</p>\n  <p>王建军发现，消费级激光雕刻机的用户在当年是极客、创客，他们渴望动手的��趣。Laser Box失败，是因为它是个封闭盒子，看不到创作过程，但开放式的激光级雕刻机会有不同结果。</p>\n  <p>没人理解王建军的一意孤行，但因为他在公司的绝对话语权，产品还是以很快的速度推进。</p>\n  <p>2021年，xTool第一代产品D1上市。这是一款开放式、主打5w和10w的蓝光激光雕刻切割一体机，虽然从现在的标准看功率不大，但当时的D1凭借坚固的铝合金结构和高精度的钢轮导轨，在海外DIY圈子里积攒了极高的口碑。直到去年年初D1停产，还有Youtube博主感慨，他21年购买的D1，五年中都没有出现过致命硬件故障。</p>\n  <p>靠着这一款产品，Makeblock账上多了3个亿。而王建军对团队要求很简单：要快，更快。</p>\n  <p>2022年，xTool发布三款产品，包括D1升级版，还有盒子式的激光刀切一体机M1和采用双光源技术的F1，整个公司营收以600%的速度增长。“感觉就是小小的几千万，忽然就变成了几个亿。”一位xTool前员工回忆。到2023年，xTool推了四条产品线，销售额跨过10亿。</p>\n  <p>xTool在当年不是没有对手，昂图、原子制造、嗨兴科技做消费级激光工具的时间比它早，却都没有xTool增长迅速。</p>\n  <p>xTool的早期员工、Maker赛道的创业者Tommy认为，让xTool远超同时期其他消费级激光雕刻公司的是王建军的“品味”。“他懂什么是好产品。”</p>\n  <p>大洋彼岸，美国顶级创业孵化器Y Combinator联合创始人保罗·格雷厄姆将品味视为一种务实的金融资产——一种不可复制的人类能力，即弄清楚什么能赚钱或吸引公众的注意。</p>\n  <p>行业里早期销量靠前的企业中，贸易出身的老板商业嗅觉很敏锐，很会卖货；工厂出身的老板，供应链整合能力很强，产品性价比很高，但这两者对产品的把控力都相对较弱。而当时很多用户是小B端用户，他们用激光雕刻机做商品售卖，对价格不一定敏感，但要求可靠性。</p>\n  <p>“可靠性不是能具体量化的概念，但它会体现在产品质量、产品体验和服务等因素里，它构成了用户对品牌的信任度，产品背景出身的公司强在这一点，它知道要花时间、花资源做好品牌，获得更高的溢价，再通过溢价继续巩固品牌的能力。”Tommy告诉硬氪。</p>\n  <p>显然，除了不去挣卖货的快钱，王建军还知道怎么去建立品牌。比如他以极快的速度搭建出xTool产品矩阵，形成M、P、S、F四条产品线，分别覆盖多功能入门、高功率加工、桌面通用和便携精雕等场景，产品形态也由开放式逐步走向全封闭、家电化和多光源融合。</p>\n  <p>这种打法极其聪明，“他们不用完全从零开始搞研发，而是建立在相对���整的技术和产品平台上，通过重新组合已有功能，快速推出面向不同细分人群的产品。”一家消费级激光雕刻公司的员工告诉硬氪。</p>\n  <p>有可靠的产品，又有完整的矩阵，这两者叠加，让xTool几乎重新定义了消费级激光雕刻机这个品类。</p>\n  <p>“如果你去Google上搜3D打印，3D打印本身是数据最高的，其次是拓竹，但你搜激光雕刻，xTool的热度甚至超过品类热度了。用户心智到这种水平的品牌，我觉得还是没有其他家的。”一位投资人分析。</p>\n  <h3><strong>02 失去的一年</strong></h3>\n  <p>王建军以革命者的姿态，彻底改造了消费级激光雕刻赛道。</p>\n  <p>但很快，xTool陷入经典的创新者窘境中。</p>\n  <p>扶持xTool的崛起的主要功臣，是大量小B用户。在没有阿里巴巴和中国工厂的海外，个人手工工作室、Esty卖家生产产品，主要在自家车库。3D打印机和激光雕刻机是这群人必要的生产工具，这帮核心用户是xTool营收从数亿涨至数十亿元的关键。</p>\n  <p>而硬件公司要从独角兽长成巨无霸，必须从B端破圈到C端。最典型的是拓竹，它的客户早已不局限于打印农场和工作室，无论是一级市场还是拓竹自身，对未来的描摹，都是成为家庭创意娱乐设备。</p>\n  <p>“就和小霸王游戏机一样。以前每家有一个游戏机，未来可能家长会说别玩游戏了，来用3D打印机打打东西。”一位投资人分析。拓竹百亿美金估值，正是建立在如此广阔的想象之上。</p>\n  <p>然而，xTool尚未能找到破局点。</p>\n  <p>“2024年我们已经得到了一个结论——激光工具的增长开始乏力，市场已经在饱和。除非能带来像3D打印行业基点式技术突破和爆发。”xTool的前员工回忆称。</p>\n  <p>很难说xTool没有做过尝试。整个2025年，xTool推出了六款产品，横跨三个品类，产品包括激光雕刻切割机、DTF服装打印机，还有激光焊接机，售价从2000美元跨到1万美元，</p>\n  <p>那段时间，xTool有些乱了阵脚，在摸索着激光雕刻以外的产品线。</p>\n  <p>“市场教育有些做不过来，价格又太高。”上述前员工回忆。</p>\n  <p>与此同时，2025年也是xTool尝试加速资本化进程的一年。</p>\n  <p>xTool的投资人已经等它等了太久，转型成功是意外之喜，IPO摘果势在必得。更何况，那段时间，资本追捧的对象变成硬件。Maker赛道被热捧，竞争更激烈。</p>\n  <p>去年上半年，涂鸦智能前CFO刘尧加入xTool，负责财务等相关工作。其内部彼时也经历着业务组织调整。王建军在当时开始闭关、集中全部精力搞新品。</p>\n  <p>回过头看，2025年王建军也有过决策失误，比如放过了UV Printer——这是一种利用UV光固化特殊油墨，在物品上印刷图案的机器。很多海外用户喜欢用它来做文化衫。</p>\n  <p>2024年，xTool内部曾经讨论过UV Printer，王建军并不重视。他没有解释太多原因，整件事不了了之。</p>\n  <p>直到2025年盛夏，安克eufymake的UV Printer在Kickstarter上拿下了4676万美元众筹，创下历史记录。</p>\n  <p>外界难以知晓，面对eufymake的成功，王建军是否有过后悔，他也没有对旁人表露过太多心绪。</p>\n  <p>唯一能够看到的是，xTool成为了追随者，在2026年也推出了一款UV打印机。而且在xTool的招股书里，打印线成为了公司的第二业务增长曲线。</p>\n  <p>在2025年一次采访中，王建军曾说：“我们清楚意识到，众多竞争者正在涌入这个领域。要保持领先地位，首要策略是速度制胜......其次就是创新，这需要巨大的资源投入和风险承受能力。某些尝试可能会失败，但只要引领趋势的突破能成功就够了。”</p>\n  <p>只是，xTool似乎没能找到第二个足以“引领趋势的突破”。</p>\n  <h3><strong>03 另一种解法</strong></h3>\n  <p>当C端迟迟看不到爆发，xTool将部分力量转移到了大B端市场。</p>\n  <p>KA用户是xTool过去一直想拓展的用户群体，但零售商对设备的易用性，稳定性有很高的要求，xTool此前没有找到合适的切入口。</p>\n  <p>直到今年xTool推出紫外激光雕刻机F2 Ultra，才算真正刺入该市场。</p>\n  <p>相比传统蓝光激光，355nm紫外激光的波长更短、热影响更小，可以精细加工塑料、玻璃等过去较难处理的材料。过去，因为这种机器的激光器和光学系统成本更高，整机稳定性和材料工艺调校难度大，以至于少有企业能做消费级紫外激光雕刻机。</p>\n  <p>以冷加工为主的F2 Ultra很适合消费电子、零售定制等对材料种类和加工精度要求更高的商业场景。</p>\n  <p>硬氪了解到，F2 Ultra让xTool打开了国内的大客户渠道，合作的客户包括华为、史丹利、星巴克等</p>\n  <p>xTool一家友商的员工告诉硬氪，在KA渠道拓展上，xTool卖的不只是设备，而是一整套适配客户场景的解决方案。“比如进入华为门店后，xTool会针对华为在售产品提前测试雕刻参数，并把相应方案预置到软件中，门店用户可以直接选择对应产品完成雕刻。”<strong>据他了解，这套紫外激光雕刻解决方案的整体售价约为3.7万元。</strong></p>\n  <p>这降低了门店员工使用设备的门槛，也让激光雕刻从一台需要专业调参的机器，变成可以直接嵌入零售场景的标准化服务。</p>\n  <p>硬氪了解到，在拓展KA客户的方式上，xTool常采取先试点、再复制的方式：先在少数直营门店验证设备和方案，再借助品牌方的渠道体系向加盟店推广，由后者自行采购。</p>\n  <p>KA客户的拓展也会形成示范效应。<strong>上述友商的员工测算认为，KA渠道拓展在今年至少为xTool贡献了4亿元营收。</strong></p>\n  <p>但xTool还没有摆脱增长的困扰。对消费硬件公司而言，它们必须出击主流市场。而这也是很多公司最难跨越的生死鸿沟。</p>\n  <p>过去，xTool的消费级激光雕刻机普遍定价在7000元+，比同类产品普遍要高出10%-30%。中高端是xTool一直以来的产品定位。但今年，xTool推出了3000元起的激光雕刻机M2。</p>\n  <p>其实，根据硬氪了解，中低端产品已经在xTool内部酝酿数年，只是此前受限于供应链成本和内部对产品的硬件要求，无法把价格做更低。</p>\n  <p>xTool M2的产品经理则表示，M2所瞄准的DIY用户群体，是公司始终想拓展的用户群，只是此前能力不具备。“这类用户基数很大，他能给我们品牌带来更多的影响力，你不可能对这么广泛的用户群体熟视无睹，这是很大的傲慢。”</p>\n  <p>xTool的一位投资人也认为，价格是关键。激光雕刻机通往普及的路上，单品必须做到500美金以下，做不到这个价格没法推广。</p>\n  <p>xTool显然下了决心。过去，xTool没有太刻意控制成本，而M2是第一款先定价格底线，再倒推设计的产品。</p>\n  <p>对供应链成本的了解也是xTool能顺利研发出平价产品的基础。“我们比过去更清楚自己自己设计出来的一颗零件到底多少钱。”M2产品经理告诉硬氪。</p>\n  <p>例如，为了压低价格，xTool用模块化架构的设计，3000元的起步价下，用户自由选择彩印、加工的功能模组。为了让用户拆装模组方便，xTool将螺丝改为磁吸固定，同传统的螺丝拆装相比，磁吸的方式更便于拆卸。</p>\n  <p>当然，xTool能实现平价产品的研发，不只是系统地运用过去做中高端产品的技术，也提升了内部组织管理。</p>\n  <p>硬氪了解到，过去两年，xTool内部专门做过一轮成本管理培训。消费硬件公司里，研发和采购价格往往存在信息隔离。在那轮成本管理中，xTool曾短暂向研发开放物料成本信息，再将成本意识落实到各个职能部门。</p>\n  <p>降价作为最简单有效的手段，很快拿到了好结果。目前，xTool M2已是天猫店铺雕刻机交易榜中的Top1。</p>\n  <p>故事走到这里，仿佛迎来圆满结局。</p>\n  <p>然而，xTool未能回答的问题是：为什么消费级激光雕刻机市场中，头部的只有它一家？为什么投资人都不再看这个赛道。这究竟是投资的偏见，还是激光雕刻行业不良信号的号角。</p>\n  <p>XTool当然是细分赛道的绝对头部，有品牌、有品味，现阶段无论是xTool还是虎视眈眈的对手，都无法突破技术本身的瓶颈。</p>\n  <p>激光工具与3D打印机不同——雕刻和切割过程中必然产生烟尘与异味，用户必须额外配置排烟净化设备，这不仅推高入门成本（一套合规的排烟系统往往占整机价格的20%-40%），也限制了使用场景（无法在无通风条件的公寓、办公室或家庭卧室使用）。</p>\n  <p>xTool显然意识到，现有激光工具类产品卡在激光雕刻行业走向大众化的拐点上。</p>\n  <p><strong>“你以为王建军不在意吗？但是这个大题解不出来。”上述前员工表示。</strong></p>\n  <p>CNC和3D打印都有可能渗透激光雕刻的市场。不少投资人都认为，前两者的市场空间比激光雕刻更大。</p>\n  <p>某种程度上而言，xTool已经在现有能力范围内，做了所有能够持续增长的事。</p>\n  <p>毫无疑问，xTool是一家优秀的公司，在硬件赛道是无可争议的成功范例。但它不能止步于此，它需要更破圈、需要更多爆品，让自己不会被拓竹这样的对手跨维攻击。</p>\n  <p>xTool过往成功，有创始人的决断、也有时代的红利。</p>\n  <p>王建军是典型的80后创业者，在最有激情的大学期间被乔布斯、马斯克的故事吸引，只身南下，又刚好赶上中国产业链产能溢出的开端。</p>\n  <p>他热爱和相信自己在做的事业，“我觉得王建军把创业当作游乐场在玩，他很享受做事。创业对他来说跟创造一样，是如此纯粹。”xTool的前员工告诉硬氪。</p>\n  <p>这种热爱伴随王建军14年的创业历程，让他在企业濒临破产之际仍不放弃，孤注一掷，最终起死回生。</p>\n  <p>而现在，在冲刺上市之时，王建军要尽快找到新的爆款市场，更广阔，更有想象力。这将是更艰难的破局。</p>", "category": "tech", "published_at": "2026-10-28T02:52:07+00:00", "fetched_at": "2026-10-28T03:43:55.048341+00:00", "fingerprint": "79d6e332fdda99d0"}, {"source": "36氪 - 最新文章", "title": "「微至航空」完成近亿元A轮融资，“云熊”累计飞行超12000公里，已获特许飞行证｜36氪首发", "url": "https://36kr.com/p/4044989810692999?f=rss", "summary": "<p>文&nbsp;|&nbsp;阿至</p>\n  <p>“ 空中五菱 ” 正加速其在低空经济场景的落地。</p>\n  <p><strong>36氪获悉，经济型通用无人运输机研发制造商「微至航空」已完成近亿元A轮融资，由自贡市通航产业发展股权投资基金领投，航发基金持续跟投。</strong>本轮资金将主要用于新技术、新机型的研发试制，以及加速成熟机型适航取证进程和场景落地相关的市场拓展。</p>\n  <p>微至航空成立于2020年10月，专注研发和制造兼具“可靠性、实用性和经济性”的大型通用无人运输机，是36氪长期关注的企业。创始人兼总经理徐淳曾在独角兽企业担任运营副总，拥有10余年上市公司运管经验，也曾经历过两段不太成功的科技创业，是一位连续创业者。</p>\n  <p>其拳头产品云熊系列WZ500定位为“低空领域的五菱宏光”，简单来说就是要“皮实、耐用，还不贵”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261028/v2_0a299e64b5984cb197ade648300f3d20@577536001_oswg833384oswg1080oswg603_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">云熊WZ500</p>\n  <p>第一代云熊系列WZ500由微至航空全自主正向设计与研制，<strong>在标准载重500公斤的情况下，满载航程超500公里，机舱容积超5m³，可容纳至少两个GJB1918A-2015标准货盘。</strong>这个“双500”的量级选择，是理解微至航空产品定义和“特立独行”路线判断的一个切入点。</p>\n  <p>在全球航空货运市场分层中，大于1000公里的干线主要由波音、空客、商飞的全货机、客改货以及客机腹舱解决；小于300公里的末端市场，更多、更有效的解决方案还是公路运输；而位于这两个区间段内的县域到枢纽，或县域、地级市之间的支线时效性运力，长期缺乏合适的生产工具，导致高端时效性快递解决方案空白，很多场景应用尚未开发。</p>\n  <p>这一被长期忽视的支线区间，并非没有需求支撑。</p>\n  <p>国家邮政局数据显示，全国快递业务量已从2021年的1083亿件增至2025年的1989.5亿件，五年间年均增长约15.4%。这其中，县域是核心增长引擎。</p>\n  <p>城乡对比上，2021年上半年农村快递业务量增速比城市高出10个百分点以上。国家邮政局发展研究中心战略规划研究部主任刘江2023年亦指出，“快递进村”成效显现、农特产品加快上行，农村业务量增速明显高于城市。区域结构上，2024年前三季度中西部快递业务量377亿件、同比增长34%，内蒙古、陕西、甘肃增速均超40%，远高于东部地区的14.9%。</p>\n  <p>县域业务量逐年上升，但供给端的产品和服务能力尚未跟上。</p>\n  <p>在徐淳看来，过往通用航空的成本结构并不适配物流企业：有人机改造的技术受限且空间利用率极低，大吨位无人货机极易陷入“大而重”的误区，导致适航难度大、安全可靠性验证周期长，单机经济性脱离实际。真实的商业运营落地遥遥无期，反而把近年来快递增速最快的县域支线需求留在了原地。</p>\n  <p>微至航空瞄准的就是这一仍处于探索阶段的低空支线时效件货运市场。</p>\n  <p>落到产品层面，<strong>云熊系列WZ500的思路不是争单项的参数第一，而是用产品定义、工程化能力尽量压低综合持有与使用成本，从而加速落地。</strong></p>\n  <p>一是在产品定义端不做“无用功”。徐淳提到，“我们不盲目追求纸上谈兵的‘单项指标主义’，而是反向兼顾客户需求、承受能力和产业链成熟度，先从运力痛点集中的‘双500’档位切入，一代产品验证成熟后再伴随市场发展逐步迭代。”</p>\n  <p>二是坚持100%正向研制与飞控等核心自主可控。“微至坚持独立思考、实事求是，拒绝抄袭与逆向仿制，从源头降低安全漏洞和知识产权风险，并大幅压缩中长期迭代成本。”</p>\n  <p>三是跨界打通产业链，整合无人机、通用航空与汽车工业三条供应链。这一模式不仅能够削减冗余零部件，共享设备、空间与人才，获取产能协同，还可进一步降低BOM成本。</p>\n  <p>换言之，云熊系列WZ500更像是用“汽车工业”的成本逻辑和供应链重新做了一遍，目标是把大型通用无人运输机做成客户“买得起、飞得起、养得起”的产品。“要做到行业性价比的最上限，成本的合理下限。”微至航空创始人徐淳此前提到。</p>\n  <p>反映到成本和定价层面，<strong>云熊系列WZ500整机成本可以做到同类竞品的1/5，单套飞行平台（基础版）控制在500万元以内，综合费效比控制在2.5-4.5元/吨公里区间。</strong></p>\n  <p>运营侧设计同样降低服务门槛，特殊情况下400米滑跑距离即可起降，极端条件下支持二级公路、草地等简易条件，全系统能在3小时内完成标准集装箱式收纳与展开撤收，方便偏远、有季节性需求或基础设施较差的地区实现“调机快运、拆装即走、展开即飞”的灵活部署需求。</p>\n  <p>据团队介绍，云熊系列WZ500今年已陆续完成高原零下30摄氏度、海上湿度95%、戈壁沙漠、战备公路起降，民航运输机场隔离飞行等风险科目测试。</p>\n  <p>截至今年5月，<strong>云熊系列WZ500累计飞行里程已突破12000公里。</strong></p>\n  <p>一个最新进展是，近期民航主管部门已正式向云熊系列WZ500颁发民用无人驾驶航空器特许飞行证，批准其在4个机场开展演示及试验飞行。这意味着该款机型在设计、制造、系统可靠性与运行安全性得到了阶段性认可，能够进一步加速产品验证及适航取证进程。</p>\n  <p>商业化层面，据悉微至航空目前已签署的采购意向升至158架，公司正与头部央企在海南自贸区开展大型无人运输机跨海运输试点筹备，另有三条试点航线也已获批。</p>\n  <p>低空经济已明确“先载货、后载人”的发展节奏，行业竞逐的路径愈发清晰。但从行业整体发展阶段来看，当下低空三段式物流的末端已经进入成本与盈利模式的验证期；支线端正处于技术成熟与产品验证加速、适航取证冲刺的投入期，而非规模化交付的产出期；干线端更是仍处在无人化的合理性与技术安全性、综合成本可行性的理论期。</p>\n  <p>微至航空如今身处的是一条正在加速、同时也变得拥挤的赛道，新一轮融资入账，对应的是加速迭代和取证的时间窗口。接下来，谁先把单机采购成本和日常运营成本尽可能压低，让服务价格既能落到最终消费者愿意为跨城时效件付费的水平，又能给快递公司留出利润，谁就更可能拿到真实的订单和复购。</p>\n  <p>据悉，随着第一代云熊系列WZ500的成熟，微至航空也将持续推进更大载重、更长航程产品的研发，以满足未来多元场景的应用需求。</p>\n  <h3><strong>投资人评价</strong></h3>\n  <p>自贡市通航产业发展股权投资基金：自贡市通航产业发展股权投资基金是四川省首支由市级设立的通航产业股权投资基金，总规模10.1亿元。本轮领投微至航空，是基金布局支线无人货运赛道的重要举措。自贡作为全省低空经济产业链主要承载地，将依托优越的空域资源与完备的产业链配套，助力微至航空在适航取证、商业航线拓展等领域协同攻坚，助推企业加快成长为国内无人货运行业头部企业。</p>", "category": "tech", "published_at": "2026-10-28T03:39:55+00:00", "fetched_at": "2026-10-28T03:43:55.048325+00:00", "fingerprint": "3b826479006adb6c"}, {"source": "少数派", "title": "一日一技｜NAS 作为 UPS 总控，实现局域网多设备断电自动关机", "url": "https://sspai.com/post/115855", "summary": "借助 NUT 网络 UPS 协议，我们只需要一台 UPS，就可以驱动局域网中多台设备协同断电保护。<a href=\"https://sspai.com/post/115855\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T03:02:18+00:00", "fetched_at": "2026-10-28T03:43:53.267401+00:00", "fingerprint": "322297666db89b9c"}, {"source": "少数派", "title": "Apple Sports：不看新闻、不聊球，只看我关心的比赛", "url": "https://sspai.com/post/117557", "summary": "作为一个从小看CCTV-5体育频道下饭的「体育迷」，在互联网时代我一般都看新浪门户网站的体育板块来获取最新的体育资讯，在智能手机逐渐普及后，百度贴吧、虎扑、懂球帝等平台又是我获取体育资讯以及和网友们吹 ...<a href=\"https://sspai.com/post/117557\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T07:27:57+00:00", "fetched_at": "2026-10-28T03:43:53.267394+00:00", "fingerprint": "dbfba1a7997a894d"}, {"source": "少数派", "title": "社区速递 163 | 金豪 59 调整版钢笔与九月派友剁手清单", "url": "https://sspai.com/post/117633", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/117633\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T09:02:00+00:00", "fetched_at": "2026-10-28T03:43:53.267388+00:00", "fingerprint": "5640c7f2d0283e44"}, {"source": "少数派", "title": "派早报：Apple 发布 M6 版 iMac 和 MacBook Pro 等", "url": "https://sspai.com/post/117684", "summary": "小米发布 REDMI K100 等新品，广电总局发布有线电视与 IPTV 运营服务新规等。<a href=\"https://sspai.com/post/117684\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-28T00:37:25+00:00", "fetched_at": "2026-10-28T03:43:53.267381+0 "title": "Sudan paramilitary drone strikes cause mass power cuts in eastern states", "url": "https://www.theguardian.com/world/2026/oct/26/sudan-paramilitary-drone-strikes-rapid-support-forces-power-cuts-eastern-states", "summary": "<p>Rapid Support Forces strike five power stations in three states controlled by Sudanese army</p><p>Sudan’s paramilitary Rapid Support Forces have launched a coordinated drone attack against five power stations, causing mass power outages across the country’s east, a government official said.</p><p>The drones hit two power stations each in the states of Al-Jazira and Gedaref and one in White Nile state, “resulting in power outages across large parts of these three states”, the official said on condition of anonymity.</p> <a href=\"https://www.theguardian.com/world/2026/oct/26/sudan-paramilitary-drone-strikes-rapid-support-forces-power-cuts-eastern-states\">Continue reading...</a>", "category": "politics", "published_at": "2026-10-26T09:59:27+00:00", "fetched_at": "2026-10-27T03:27:59.410718+00:00", "fingerprint": "2f3de9f7785b0deb"}, {"source": "The Guardian - World", "title": "US forces accused of ‘weaponising’ Somalia’s floods by trapping women and children in the path of El Niño", "url": "https://www.theguardian.com/global-development/2026/oct/26/us-forces-accused-of-weaponising-somalia-flood-el-nino", "summary": "<p><strong>Exclusive:</strong> Coordinated airstrikes on territory held by al-Shabaab are driving the civilian population to find refuge alongside a river where rising water levels are a threat to safety. Is it a deliberate military strategy?</p><p>The water was rising rapidly. It had already reached Cayni Ali’s waist. Her home, five metres from the flooded River Juba in southern Somalia, never stood a chance. There was nowhere to go. Ali’s city of Jilib was under attack. Repeated airstrikes, said the mother of six, were pinning its population beside the rising river.</p><p>“The drones come all the time,” said the 27-year-old. “We hear them constantly. They kill animals, civilians. The town is big but destruction is everywhere.”</p> <a href=\"https://www.theguardian.com/global-development/2026/oct/26/us-forces-accused-of-weaponising-somalia-flood-el-nino\">Continue reading...</a>", "category": "politics", "published_at": "2026-10-26T11:00:40+00:00", "fetched_at": "2026-10-27T03:27:59.410710+00:00", "fingerprint": "eb7f0340af3d096c"}, {"source": "The Guardian - World", "title": "UK sanctions Sudanese military leaders implicated in El Fasher ‘campaign of rape’", "url": "https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of", "summary": "<p>Commanders suspected of sexual violence during the largest and fastest slaughter of civilians in more than 30 years have been subjected to travel ban and asset freeze</p><p>Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a <a href=\"https://www.theguardian.com/global-development/2026/mar/25/heroism-horror-and-the-pits-of-hell-inside-the-last-days-of-el-fasher\">mass atrocity</a> that saw tens of thousands of civilians killed over several days.</p><p>A year after the <a href=\"https://www.theguardian.com/global-development/2025/nov/02/he-told-the-world-what-was-happening-in-el-fasher-then-they-sought-him-out-how-sudan-lost-a-true-hero-of-the-war\">fall of El Fasher</a>, the British government said it had sanctioned military leaders from both sides in the country’s ongoing conflict whom it suspected of sexual violence during the siege of the city.</p> <a href=\"https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of\">Continue reading...</a>", "category": "politics", "published_at": "2026-10-26T15:07:23+00:00", "fetched_at": "2026-10-27T03:27:59.410698+00:00", "fingerprint": "c889760de5d37b05"}, {"source": "BBC World News", "tit t": "2026-10-26T18:51:06+00:00", "fetched_at": "2026-10-27T03:27:58.207954+00:00", "fingerprint": "09c34956440a061d"}, {"source": "The Verge", "title": "Anthropic is burning gas to feed the AI boom", "url": "https://www.theverge.com/ai-artificial-intelligence/1018994/anthropic-ipo-ai-data-center-energy-climate-risk", "summary": "As it prepares to go public, Anthropic's S-1 filing makes generative AI's methane dependency glaringly obvious. \"Competition for access to electrical supply and data center locations with adequate power availability is intense.\" In documents filed with the US Securities and Exchange Commission Monday, Anthropic acknowledges that data centers are becoming increasingly reliant on \"natural gas\" [&#8230;]", "category": "tech", "published_at": "2026-10-26T21:45:31+00:00", "fetched_at": "2026-10-27T03:27:58.207948+00:00", "fingerprint": "092e8ceea2bd79fc"}, {"source": "The Verge", "title": "Samsung’s Switch 2-ready MicroSD Express card is on sale for less than $50", "url": "https://www.theverge.com/gadgets/1018962/samsung-p9-256gb-microsd-express-card-switch-2-deal-sale", "summary": "Running out of space on your Nintendo Switch 2? Thankfully, Samsung’s P9 MicroSD Express card is discounted at multiple retailers, with the 256GB version going for $47.99 (Amazon, B&#38;H Photo) and the 512GB version $99 (Amazon, B&#38;H Photo). The smaller card typically sells for around $80, and the larger option usually sells between $150 and [&#8230;]", "category": "tech", "published_at": "2026-10-26T21:56:36+00:00", "fetched_at": "2026-10-27T03:27:58.207941+00:00", "fingerprint": "39130e60f0587b76"}, {"source": "The Verge", "title": "OpenAI announces three big science discoveries and a new way to work with academics", "url": "https://www.theverge.com/ai-artificial-intelligence/1019143/openai-eth-kaseya-science-math-physics", "summary": "Less than a month after its mass release of hundreds of manuscripts that it said contained solutions to long-standing mathematics questions, OpenAI is back with three more \"major\" discoveries in math, computer science, and physics. What's different this time is the choice to have external experts that OpenAI describes as \"shepherds\" guiding the results in [&#8230;]", "category": "tech", "published_at": "2026-10-26T23:34:58+00:00", "fetched_at": "2026-10-27T03:27:58.207929+00:00", "fingerprint": "b555ce2afa55383d"}, {"source": "36氪 - 最新文章", "title": "有个业务问题，想找技术伙伴聊聊？WISE2026「世界咖啡·产业对接」征集需求中", "url": "https://36kr.com/p/4042414899270790?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_7c715ff2e68a492cbca3864a8a74be81@6301044_oswg207875oswg900oswg480_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>如果你有一个具体业务问题，想看看AI或具身智能能不能帮上忙，可以把问题带来，和技术团队坐下来聊聊。</p>\n  <h2><strong>有些技术问题，找懂行的人一起拆开看看</strong></h2>\n  <p>你大概有过这种时候。</p>\n  <p>公司里总有那么一个环节，明显不顺。可能是客服，工单越堆越多，人手排不开；可能是质检，常年靠人眼盯着，慢，还容易漏；可能是仓库，搬运全靠排班，旺季一忙就打架；也可能是门店，导览、服务这类活儿，人手总是紧巴巴的。</p>\n  <p>你清楚哪里有问题。你也刷到过不少AI和机器人的消息，看过不少大佬的直播，收藏夹里是盘包浆的“某某行业落地案例”。但真到要往前走一步的时候，心头卡着的其实一直是三个很基础的问题：</p>\n  <p>我这情况，到底适不适合用这类技术？得先准备什么？靠谱的人，上哪儿找去？</p>\n  <p>你可能看过不少方案，但最想确认的还是：它能不能用在我们这个具体环节？</p>\n  <p>所以今年，我们在WISE里开了家“咖啡厅”，专门用来聊这个。</p>\n  <h2><strong>我们在WISE2026，留了几张桌子</strong></h2>\n  <p>正式官宣一下这件事。</p>\n  <p>11月26–28日，WISE2026商业之王大会主议程之外，我们再次把“世界咖啡·产业对接”搭了起来——围绕具体业务需求，安排和技术方的定向交流——同时，它与大会同期成立的具身智能产业联盟相衔接，重点方向聚焦AI应用和具身智能。（联盟成员详见文章结尾）</p>\n  <p>在这里，我们只做一件事：把带着问题的企业，和可能解决这个问题的企业，安排在同一张桌子上，聊一个具体的问题。</p>\n  <p>逻辑也很简单：场景需求方当“桌长”，固定坐在一张桌子前，把真实痛点摆上桌；技术方带着方案上门，按排好的日程挨桌轮转，一轮一轮聊。</p>\n  <p>这套形式也不是36氪第一次跑。今年的北京亦庄AI+产业对接会、上海出海大会产业对接会，都是从“收集真问题”开始的。今年两轮世界咖啡产业对接会，<strong>收获高意向企业190余家，正式申报企业153家，累计超过100轮对接</strong>，每一次都提前两个月开始筹备，我们<strong>不做随机匹配</strong>，每一轮都提前交叉验证。（下图是36氪制作的需求匹配意向图）</p>\n  <p><strong>这一次规模更大、覆盖更广，但起点没变：从你手上的问题开始。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_ae65a7f8f6534b5081bc7a76d6f9c5b3@6301044_oswg67614oswg496oswg494_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪制作的需求匹配意向图</p>\n  <h2><strong>一杯咖啡的时间，讲究的是先对好眼神再上桌</strong></h2>\n  <p>你可能会问：这跟我去展会逛一圈，有什么不一样？</p>\n  <p>逛展会多半是这样的：你自己找人、自己判断、自己琢磨对方的东西跟你的业务对不对得上。</p>\n  <p>一场展会里，大概要把七成的力气花在“找到谁”上，剩下三成才是“聊事儿”。而真正难的是后者。</p>\n  <p>所以，WISE2026世界咖啡不是想找个时间，在线下交换名片，而是<strong>根据你的需求匹配相应的技术解决方</strong>，在现场直接高效沟通下一步应该怎么走！</p>\n  <p>没错，现场20分钟的对接，我们从现在就开始准备。</p>\n  <p><strong>会前就有准备。</strong>你先把业务问题提交上来——现在怎么做的、卡在哪儿、希望变成什么样。我们做审核和必要的核实，整理成一份说得清楚的摘要。坐到你对面的人，来之前已经看过你的情况，也想过自己能不能接。这样你们见面那二十几分钟，不用花在自我介绍上，可以直接进入“你这个条件下行不行”。</p>\n  <p><strong>对象是约好的，不是开盲盒。</strong>双向确认意愿之后，才会排进日程：你看对方的资料，觉得“愿意聊”；对方看你的问题，觉得“能接”。两头都点头，这场才算排上。到了现场就是预约制、一对一、按桌按点坐下。</p>\n  <p><strong>聊完，不代表结束。</strong>现场我们搭了一面“需求墙”，你的需求、你想解决的问题都会展示在上面，更多带着解决方案的技术方也看得见。当时没轮上聊的、没聊透的，也不急——会后我们回收反馈、接着跟进，把没接上的头给你续上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_578f9c1a271c421b9c4f41aced7a43c9@6301044_oswg93774oswg1080oswg630_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>简单说，我们把“找人”这段路提前走完了，好让现场那点时间，都用来聊事儿。</p>\n  <h2><strong>在这儿能聊什么？举个例子</strong></h2>\n  <p>今年的重点方向聚焦两个——<strong>AI应用和具身智能。</strong></p>\n  <p>之所以是这两个方向，跟眼下的时间点有关。今年这两件事都在从演示走向产线：机器人不再只在展台上做动作，而是在工厂里真的开始干活了。这个阶段的经验是最值钱的，因为第一批跑通的和第一批踩坑的，几乎同时在出现——谁在哪些环节上栽过、哪些条件看着不起眼其实很麻烦，这些话在通稿里读不到，只在一对一的桌上讲得出来。</p>\n  <p>简单举一些场景。</p>\n  <p>偏AI应用的，比如客服和工单的响应、内部知识和文档的检索、质量数据的分析和异常判断，还有流程里那些反复出现的人工环节。</p>\n  <p>偏具身智能的，比如工厂和仓库里的搬运、作业辅助，商业空间里的导览、配送、巡检。等等。</p>\n  <p>这些只是冰山一角。只要你手上有个问题，环境说得清、任务说得清、限制条件也说得出，就可以提交报名，来现场找到机会。</p>\n  <h2><strong>没想清楚用什么技术？那我们更呼唤你</strong></h2>\n  <p>之前我们对接场景方时，被问到最多的顾虑是这个：“我这问题还没想清楚能不能用AI，交上去会不会太外行？”</p>\n  <p>答案是，完全不会。</p>\n  <p>在这里，你只需要负责把业务问题讲清楚——这个环节现在是怎么运转的，卡在哪一步，你们想达到的效果是什么？而关于技术那部分，可以在交流中和技术方一起探讨，现成的方案是否适配、还需要哪些条件……</p>\n  <p>当然了，为了交流更高效，我们建议由熟悉这块业务、能讲清具体情况，并能参与后续讨论或协调的同事，来到我们现场。这样聊出来的结论，才更容易带回团队继续推进。</p>\n  <h2><strong>喝完咖啡能带走什么，我们把话说在前面</strong></h2>\n  <p>如果现场聊得顺，你能带走的东西有希望很具体：</p>\n  <p>1、一个更清楚的判断，知道这个问题到底要朝什么方向解决；</p>\n  <p>2、一份落地要具备的条件清单，数据、环境、流程、人员、预算大概要准备什么；</p>\n  <p>3、一两个可能适配的技术伙伴，以及后续沟通的基础；</p>\n  <p>4、还有一个明确的下一步，是继续验证、去做考察，还是先放一放。</p>\n  <p>当然，活动提供的是交流与连接的机会，不保证采购、试点或成交结果。具体的技术可行性、产品效果、合作条件，由参与企业自己沟通判断。</p>\n  <p>36氪负责<strong>组织、审核、匹配和协调</strong>。案例如用于公开传播，需事先经企业确认，不保证每家企业获得报道或曝光。<strong>双方免费报名</strong>，但报名或审核通过不等于获得预约席位。</p>\n  <p>还有一种情况是现场没聊透。放心！这趟也不会白来——双方留下联系方式，继续约时间。一杯咖啡的时间，能把边界聊清楚，这件事和当场聊出合作意向一样有价值。</p>\n  <h2><strong>都说到这儿了，先报名吧！</strong></h2>\n  <p>如果你读到这里，脑子里已经浮现出某一个具体的环节、某一类反复出现的事，那就是可以写下来的东西。不用包装，不用拔高。就用你们组里平时说话的口气写：现在是怎么干的，毛病出在哪儿，你想让它变成什么样。</p>\n  <p>写下来的那一刻，这件事就已经往前走了半步。剩下的半步，交给我们，也交给那张桌子对面的伙伴。</p>\n  <p>现在来报名吧，识别文末的二维码就行，接下来你只需要：</p>\n  <p><strong>提交信息。</strong>写下你的业务问题——现状、困难、希望改善的结果，顺便说一下哪些时间确定来不了。</p>\n  <p>接下来的工作我们来做：</p>\n  <p><strong>36氪审核。</strong>报名截止后集中审核，场景方看业务需求是不是具体、真实，技术方看方案成熟度和可落地的案例，同时兼顾整体的数量平衡。</p>\n  <p><strong>36氪进行双向匹配。</strong>通过审核的场景方进入需求清单，技术方进入匹配资源池，双方可以互相查看信息、标记意向对接对象。</p>\n  <p><strong>36氪与你一起确认日程。</strong>我们结合两边的意向，排出一张现场对接的时间表，同步参会指南。两个环节都确认了，这场参与安排才算落实。</p>\n  <p><strong>最后，现场交流加会后跟进。</strong>按预约签到、到桌交流、归纳下一步，会后回收反馈，继续跟进。</p>\n  <p>桌子正在摆了，咖啡也在萃取。你的问题，值得在这里被正经聊一次。</p>\n  <p>WISE2026商业大会·世界咖啡，等你的问题，也等你的名字。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_72c3e04f459240bf81cff89667bba80a@6301044_oswg109045oswg1080oswg540_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p>（本次招募设置两条独立报名通道，请选择对应的二维码报名，错误通道提交的报名信息可能会影响后续审核）</p>\n  <p>特别说明：报名或审核通过不等于获得预约席位；活动提供交流与连接机会，不保证采购、试点或成交结果。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_071d9d1d50ee4c3e94a81c01d20af8fd@6301044_oswg378079oswg1080oswg2830_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">本次对接会与同期成立的“具身智能产业联盟”相衔接���图中为首批加入联盟的企业</p>", "category": "tech", "published_at": "2026-10-26T07:59:36+00:00", "fetched_at": "2026-10-27T03:27:58.133405+00:00", "fingerprint": "4eaaab144cbb99a8"}, {"source": "36氪 - 最新文章", "title": "这场年轻人的咖啡局，聊聊「咖啡+AI」可以长出什么？", "url": "https://36kr.com/p/4042455475475586?f=rss", "summary": "<p>城市节奏越快，咖啡越像年轻人的“日常开关”。白天靠咖啡续命，周末咖啡店是见面、拍照、遛猫、带娃、逛市集的空间。</p>\n  <p>“日咖夜酒”“奶茶咖啡化”之外，咖啡消费还在长出更多新组合：咖啡+烘焙、咖啡+宠物、咖啡+博物馆、咖啡+市集、咖啡+文创。有人用9.9元完成日常摄入，也有人愿意为一杯手冲排半小时队。</p>\n  <p>咖啡越来越日常，但年轻人对咖啡的期待并不日常。精致的线上内容决定他们走进哪家店，线下场景的消费体验决定他们愿意待多久、下次还来不来。</p>\n  <p>不同的咖啡线下场景也在寻找自己的生存方式：社区咖啡嵌入生活半径，靠熟客和日常习惯形成复访；主题猫咖把宠物社交和情绪价值装进空间；博物馆、科技馆里的“科普咖啡厅”，成为科普体验和博物馆IP文创的载体；咖啡节则把咖啡、艺术、市集和青年文化聚在一起，短时间内制造城市话题和目的性到访。</p>\n  <p>以一杯咖啡为起点，走过六年时光，<strong>由浙江云创蔚来集团主办的宁波咖啡生活周IP精彩延续，上半年的活动已落地集盒广场，下半年的特别加场——“风从西南来”系列活动将于10月30日-11月1日在云创浙理青年国度举办。</strong>活动集合市集、青年共创与非遗体验，把咖啡、美食、艺术揉进城市日常。无数主理人与品牌在此相逢，把咖啡的烟火播种在甬城街巷，从本土出发向外生长，成为长三角土地上独一份的咖啡文旅印记。</p>\n  <p>从咖啡豆到一杯咖啡，从一次线上分享到线下打卡，一杯咖啡的消费行为背后，是一整条产业链的迭代进化，也是线下实体场景与线上数字营销的互动创新。</p>\n  <p>咖啡消费正在呈现两条并行的趋势：一边是平价化、日常化，咖啡成为高频刚需；一边是体验化、内容化，主理人店、社区店、宠物友好店、博物馆咖啡、咖啡节市集不断制造“非喝不可”的理由。对街区来说，真正需要的也不只是多一家咖啡店，而是能带来新体验、新客流、可传播、可复访的消费新业态。</p>\n  <p>与此同时，AI正在进入咖啡产业链。智能点单、无人咖啡零售、AI咖啡师、咖啡机器人运维、AI烘焙……被重构的不只是出品效率，还有岗位能力、培训体系和青年就业方向。AI不是只来抢咖啡师的拉花缸，它催生新工种：谁来运维咖啡机器人？谁来设计AI烘焙曲线？谁来培训既懂咖啡又懂设备的新人？这些问题，已经从概念走进门店和课堂。</p>\n  <p>10月31日（周六）下午，宁波首南街道云创浙理青年国度将举办“AiPartner带着Ai上前线——宁波咖啡生活周场景创新交流会”。</p>\n  <p>活动由鄞州区发展和改革局指导，首南街道办事处、36氪、云创蔚来集团联合主办，宁波诺丁汉大学李达三孵化园协办。活动定位为咖啡节中的场景创新产业交流环节，<strong>围绕消费和人才培训两大方向，挖掘场景创新机会，推动新技术、新产品在云创浙理青年国度及首南街道落地</strong>。</p>\n  <p>消费升级与青年就业，是这场场景挖掘的两个出发点。现场采用“双圆桌”形式，两场圆桌，一场聊“人”，一场聊“场”：</p>\n  <p>圆桌一聚焦<strong>「AI+咖啡全产业链新职业人才培养」——</strong></p>\n  <ul>\n   <li>AI进入咖啡产业链后，整条链上哪些环节被重构、哪些能力出现缺口？</li>\n   <li>AI与咖啡结合后，传统咖啡师的角色会怎么变？</li>\n   <li>AI咖啡师、咖啡机器人运维、AI烘焙等新工种如何定义能力模型？</li>\n  </ul>\n  <p>从课堂到咖啡机器人实训，我们邀请到美刻AI项目发起人姚锦程、宁波勇诚资产管理有限公司投资总监梁相炳、陆汇集团CIO常潞，希望把“AI+咖啡”的人才培养从概念推到可操作的课程和岗位。</p>\n  <p>云创4万方商业街、青年夜市和创业集市正在寻找智能咖啡零售、博物馆IP联名、人宠友��等数字消费新业态，以“AI咖啡师”体验专区为切口，形成“AI体验—消费转化—商户引流”的链路，让本地主理人与技术方现场对接。</p>\n  <p>圆桌二聚焦<strong>「青年数字消费场景与街区活力提升」，</strong>我们将与亦瀚文化合伙人吕佳凯、众乐乐咖啡艺术节创始人陈智、Daily Coffee主理人许家木、LeBRESSO主理人袁剑峰一同探讨——</p>\n  <ul>\n   <li>AI咖啡和咖啡新业态在哪些真实场景里落地？</li>\n   <li>在咖啡之外，数字平台的内容对咖啡店客流有什么影响？</li>\n   <li>从“打卡”到“常客”，主理人靠什么形成品牌持续消费人气？</li>\n   <li>一个街区场景里，不同的“内容物种”如何共同打造有生命力的青年消费生态？</li>\n  </ul>\n  <p>我们希望这场交流活动更像一个“场景实验室”，这个秋天的周末午后，不谈宏大叙事，放下FOMO情绪，一边喝咖啡、听主理人聊街区，一边看机器人做咖啡，让设备方、培训方、街区运营方碰一碰，看看哪些新业态能真正落下来。</p>\n  <p>让一杯咖啡，成为连接青年、产业与街区的“轻切口”，就够了。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261026/v2_88d48ac079f648129e63cd98c5dad16b@6340959_oswg4304375oswg4500oswg7200_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-10-26T09:43:46+00:00", "fetched_at": "2026-10-27T03:27:58.133399+00:00", "fingerprint": "b5f7c429deddf7e9"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨Anthropic正式提交IPO申请；寿司郎传送带被曝窜出活老鼠；苹果客服称很多客户取消iPhone Duo订单", "url": "https://36kr.com/p/4043364384707456?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>Kimi致歉：将为会员提供重置机会</li>\n   <li>马斯克宣布X长按点赞可向对方转账1美元</li>\n   <li>微软向约6万名员工开放自愿离职方案，AI巨额投入挤压人力预算</li>\n   <li>中国石油午后涨近4%，创2008年5月以来新高</li>\n   <li>科学家展示全球首款织进衣服的触摸屏</li>\n  </ul>\n  <h2>TOP 3大新闻</h2>\n  <p><strong>Anthropic正式提交IPO申请</strong></p>\n  <p>10月26日，Anthropic正式提交纳斯达克IPO申请，股票代码定为“ANT”。Anthropic上半年营收163亿美元，去年同期为12亿美元；上半年净亏损807亿美元。</p>\n  <p>Anthropic在招股书中披露，公司与多家科技企业签订大额算力及基础设施协议，相关支出承诺延伸至2036年。其中，公司承诺2026年4月至2033年7月向谷歌至少支出约1145亿美元；2026年5月至2036年4月向亚马逊至少支出1100亿美元；2026年11月至2033年5月向微软至少支出449亿美元，相关承诺原则上不因实际使用量减少而取消，特定违约等情形除外。（界面新闻）</p>\n  <p><strong>寿司郎传送带被曝窜出活老鼠</strong></p>\n  <p>10月25日，有网友爆料称，其10月24日在寿司郎一门店就餐时，发现传送带上出现一只老鼠，但因老鼠移动速度较快，未能拍摄到画面。该帖子爆料人称，发现老鼠后，其与经理进行了沟通，经理仅协商免单，并未提出其他赔偿方案；其索要消费凭据及就餐监控的请求遭经理拒绝。经理称，乘客日后若发现身体不适，可前往医院检查，并通过第三方机构鉴定后处理。</p>\n  <p>10月25日，记者拨打涉事门店电话，工作人员表示，消杀公司已于10月24日对门店进行全面核查，未发现老鼠踪迹。目前已对全门店进行了消杀，并对当天全部食材进行处理。至于老鼠的来源，工作人员称尚不清楚。关于赔偿问题，工作人员表示，可添加该店微信，提供当日就餐小票后予以协商。记者查询美团、大众点评，该门店已显示暂停营业，但记者10月25日从该涉事门店工作人员处获悉，其24日闭店，现已正常营业。（海报新闻）</p>\n  <p><strong>苹果客服称很多客户取消iPhone Duo订单</strong></p>\n  <p>10月25日，苹果首款折叠屏手机iPhone Duo正式发售仅两天，部分渠道的价格已经跌破官方定价。虽然苹果官网部分订单的预计交付时间仍排到2027年1月，但线下经销商已出现低于原价的现货报价。还有消费者通过地方补贴，以15499元买到了原价15999元的256GB版本。</p>\n  <p>针对“部分渠道iPhoneDuo破发”的情况，26日，苹果官方客服人员回应称：“第三方经销商退换货政策不一定和苹果官网一致，苹果官方渠道是支持14天无理由退换货。第三方渠道可能有平台补贴或者店铺优惠，苹果官网价格更稳定。”“有的第三方货源足但是买的人少也可能导致降价。”客服称。</p>\n  <p>上述客服还补充道，“有的客户订单显示等待时间比较长，但后续收货时间可能会提前，比如增加产能或者前面排队的客户取消订单，目前很多客户取消了订单。”（中新经纬）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>Kimi致歉：将为会员提供重置机会</strong></p>\n  <p>10月26日凌晨，Kimi智能助手发文：对于近期Kimi会员使用K3.1 Pro时出现的限流及不必要的额度消耗，向大家致歉。今天，公司会为所有档位的订阅会员进行一次重置：所有有效期内的会员都将获得月度总额的25%作为补偿，相当于一周的用量。如果当前用量不足月度总额的25%，将重置为0。用量进度条会在今天结束前显示调整结果。同时，已调整配置，并正在减少不必要的子Agent调用和输出长度，让同样的额度完成更多实际任务。(上海证券报)&nbsp;</p>\n  <p><strong>灵快科技发布Botnow 3.0</strong></p>\n  <p>36氪获悉，灵快科技发布智能体平台Botnow 3.0。核心能力包括：Agent可自主拆解步骤并执行任务，支持人工在关键节点介入审批，并通过Skill技能包、MCP连接器接入企业原有系统与流程等。</p>\n  <p><strong>Acrab与端脑科技达成战略合作</strong></p>\n  <p>36氪获悉，端脑科技与Acrab近日达成战略合作。端脑科技输出AI NPC一体机、智能体软件与终端落地经验，Acrab提供AI芯片、操作系统、工具链等端侧计算底座，共同推进AI NPC在个人终端场景落地。本次合作将聚焦平台适配、硬件集成、多模态模型与Agent运行优化，打通从底层芯片、模型智能体到终端应用的完整链路，构建端侧AI能力闭环。</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>马斯克宣布X长按点赞可向对方转账1美元</strong></p>\n  <p>25日，马斯克在X平台发文宣布：将为“长按点赞”操作加入转账1美元（约合 6.7 元人民币）功能，有关交易将会经由X Money完成。不过，马斯克暂未透露这一功能的上线日期。</p>\n  <p>据悉，X Money于7月下旬正式在美国上线，面向 Premium 和 Premium+ 订阅用户全量开放。X Money将账户存款、点对点转账以及Visa借记卡功能整合在X应用内。用户可在X内即时向他人汇款、收款或请求收款，无手续费和限额。随后在今年9月，X平台宣布，美国地区创作者从“原创内容奖励计划”和创作者订阅获得的收益，今后统一通过其支付服务X Money发放。（IT之家）</p>\n  <p><strong>宇树科技7天大涨超60%</strong></p>\n  <p>26日，A股人形机器人龙头宇树科技开盘后快速拉升，盘中涨幅一度突破8%；截至收盘，该股涨7.69%，报672元/股，总市值重回2700亿元以上。值得一提的是，自10月16日起的7个交易日，该股累计涨幅已超60%。（财联社）&nbsp;</p>\n  <p><strong>微软向约6万名员工开放自愿离职方案，AI巨额投入挤压人力预算</strong></p>\n  <p>全球最大软件公司微软当地时间10月26日表示，将向约6万名员工提供自愿离职补偿方案，以削减成本，并为迎接AI时代调整人员结构。符合条件的员工超过其员工总数的四分之一。微软发言人称，美国、加拿大、印度和英国的部分副总裁及以下级别员工具备申请资格，接受方案者将获得与标准遣散方案相近的待遇。不过，并非所有业务线都在适用之列。据知情人士透露，Xbox、Windows、Copilot及财务等部门将全面参与此次计划，而从事数据中心、销售、市场营销、网络安全和量子计算等工作的部分员工则不具备资格。(财联社)</p>\n  <p><strong>多所高校将通过数字人民币发工资</strong></p>\n  <p>近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。扬州大学、南通大学和江苏师范大学均发布了相关通知，通知教职工完成数币钱包的开立与升级。（南方日报）</p>\n  <p><strong>中国石油午后涨近4%，创2008年5月以来新高</strong></p>\n  <p>油气板块日内震荡回升，中国石油涨近4%，创2008年5月以来新高，A+H股总市值站上2.3万亿，中海油服、海油工程、海油发展、中国海油均涨超3%。消息面上，欧洲天然气价格升至2022年以来的最高水平。此前挪威天然气运输系统运营商Gassco宣布，Troll气田在10月25日至26日期间发生非计划停运，影响规模为610万立方米/日。（财联社）</p>\n  <p><strong>国内首部AI电影4天票房仅119万元，平均1场仅两个人看</strong></p>\n  <p>10月23日，《三星堆：未来往事》正式登陆全国院线。猫眼专业版显示，截至10月26日午间，这部100分钟的电影累计综合票房119.2万元，26日排片8469场，上座率0.1%，场均人次0.1人。而根据猫眼专业版，《三星堆：未来往事》24日、25日场均日次均为2人。而其制作方博纳影业（SZ001330）此前曾在9月28日、10月9日、10月12日三个交易日涨停，不过，10月26日博纳影业盘中跌停，截至当日收盘，跌幅为10.06%，每股报5.54元，总市值76.14亿元。（每日经济新闻）</p>\n  <p><strong>SpaceX拟与阿波罗全球管理公司达成约400亿美元GPU设备融资租赁协议</strong></p>\n  <p>SpaceX披露，公司于当地时间10月24日与阿波罗全球管理公司旗下实体签署具有约束力的承诺函，计划通过主融资租赁协议租赁GPU计算设备及相关设施，用于公司选定的数据中心。相关协议预计于2026年底前完成签署，设备预计自2027年上半年起分批交付。根据披露，各批次租赁期限约为5年至5.25年，租金按季度预付。SpaceX预计，各租赁安排期限内的本金支付总额约为400亿美元。(界面新闻)</p>\n  <p><strong>快手旗下可灵AI增资至约8744.7万</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，可灵AI关联公司北京可灵智能科技有限公司发生工商变更，新增腾讯旗下上海启善投资有限公司、杭州阿里云飞天信息技术有限公司、北京百度网讯科技有限公司、国家人工智能产业投资基金合伙企业（有限合伙）等为股东，同时，注册资本由约7192.4万元人民币增至约8744.7万元人民币，增幅约22%。北京可灵智能科技有限公司成立于2020年8月，法定代表人为盖坤，经营范围包括计算机系统服务、软件开发、货物进出口等，现由福创科技有限公司、盖坤及上述新增股东等共同持股。</p>\n  <p><strong>AI行情降温，海力士相关杠杆基金将在美国退市</strong></p>\n  <p>两只挂钩SK海力士的杠杆交易所交易基金，在美上市仅数月后就将进行清算退市，当前市场对AI交易的投资热情正逐步降温。这两只由Tradr ETFs发行的多空产品，分别为交易者提供该韩国芯片制造商美国存托凭证（ADR）两倍的日涨跌幅杠杆、以及两倍的反向日收益。该ETF发行商在声明中表示，两只基金都将于11月12日前后完成清算。（财联社）</p>\n  <p><strong>三星计划借助AI缩短芯片材料研发周期</strong></p>\n  <p>三星电子表示，计划利用人工智能技术，将新型半导体材料的研发耗时缩短3年。该公司在韩国产业协会论坛举办的一场研讨会上公布了这一目标，会议围绕人工智能在工业研发（R&amp;D）中的应用展开讨论。三星高级技术研究院负责人Choi Young-sang在论坛上称：“我们计划依托AI，把新型半导体材料的研发周期从5年压缩至2年，同时把筛选出的有潜力候选材料数量提升5倍以上。”（新浪财经）</p>\n  <p><strong>三星和SK海力士将于明年Q2量产并交付HBM4供应给英伟达</strong></p>\n  <p>据媒体报道，三星电子和SK海力士已将供应英伟达的8层HBM4的量产和出货时间定在明年第二季度左右。一位知情人士表示：“据我了解，英伟达将根据基于Rubin Ultra的NVL机架规模，同时配备8层HBM4。虽然12层HBM4仍将是今年的主要重点，但从明年年中开始，8层HBM4的比例将显著增加。”（财联社）</p>\n  <p><strong>Meta公司将通过普通股和优先股发行筹集约350亿美元资金</strong></p>\n  <p>META将同时通过远期销售协议发行约225亿美元的A类普通股并发行约125亿美元的存托股份。META将发行最多2.5亿份A系列存托股份，英伟达、AMD、博通将购买最多50亿美元的A类股票。（财联社）</p>\n  <p><strong>未来车辆将被强制安装C-V2X？知情人士称“相关部门已启动强标制定工作”</strong></p>\n  <p>“相关部门已经在推动车辆安装C-V2X（蜂窝车联网）的强标制定工作。相关工作组已经成立，有几十家单位已经参与进来了。”日前，一位不愿透露姓名的C-V2X领域从业者透露。据了解，营运车辆已被率先要求安装C-V2X。中信科智联科技有限公司副总经理范炬认为，在相关政策法规的进一步推动下，中国C-V2X产业将跨越“试点示范”的鸿沟，进入爆发式增长的新阶段。（每日经济新闻）</p>\n  <p><strong>马斯克：SpaceX为GPU采购敲定400亿美元债务融资</strong></p>\n  <p>北京时间10月26日凌晨，埃隆·马斯克在社交平台发文表示：过去这几周，债市几乎彻底关上了大门——任何公司，只要没有独立于AI数据中心的大规模收入，基本都拿不到钱了。SpaceX刚为GPU敲定了400亿美元的债务融资，但我们是投资级信用评级，而且有Starlink和发射业务带来的收入。这意味着，那200多家“新型云厂商”要迎来孔雀鱼级别的批量死亡和整合了。会有一些撑过去，但不会多。这笔资金主要是可赎回债务，用于采购将在明年第一季度和第二季度到货的GPU。（界面新闻）</p>\n  <p><strong>新易盛：三季度产量环比增长，高速率产品放量提速</strong></p>\n  <p>从新易盛方面获悉，公司第三季度产品产量较第二季度保持增长，业务交付规模进一步提升。新易盛此前在投资者交流中表示，800G光模块出货量持续提升，已成为今年交付主力；1.6T产品也已进入持续放量阶段，预计下半年放量节奏将进一步加快。随着高速率产品需求持续释放，公司产品交付规模有望稳步提升。（证券时报）</p>\n  <p><strong>长鑫科技旗下芯聚股权投资公司增资至约63.8亿</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，长鑫芯聚股权投资（安徽）有限公司发生工商变更，注册资本由约61.8亿元人民币增至约63.8亿元人民币。值得一提的是，今年7月和9月，该公司均发生增资。该公司成立于2022年3月，法定代表人为赵纶，经营范围为以自有资金从事投资活动、创业投资，由长鑫科技集团股份有限公司全资持股。</p>\n  <p><strong>字节跳动TikTok电商欧洲负责人陈熙即将离职</strong></p>\n  <p>字节跳动TikTok电商负责人陈熙（Kevin）即将离职，TikTok欧洲、英国区域整体业务后续由宋琪负责。据悉，陈熙此前曾担任滴滴网约车业务执行总裁，2020年末加入字节跳动。（新浪财经）</p>\n  <p><strong>苹果发布新款iPad mini</strong></p>\n  <p>苹果公司发布新款iPad mini，配备8.5英寸OLED显示屏和A20 Pro芯片，机身厚度仅5.4毫米，并支持IP67级抗水防尘。苹果称，新款设备的AI性能最高提升至前代的4.5倍，图形性能最高提升至2.7倍，蜂窝网络数据传输速度最高提升50%。（财联社）</p>\n  <p><strong>小鹏Robotaxi获批L4级示范运营资质</strong></p>\n  <p>36氪获悉，近日，小鹏集团获批广州市智能网联汽车应用示范运营资格，可在广州全域开展L4级Robotaxi示范运营。</p>\n  <p><strong>寒武纪获资金净流入13.02亿元</strong></p>\n  <p>Choice数据显示，10月26日，资金净流入额排名前十的个股依次是寒武纪、胜宏科技、长鑫科技、万向钱潮、百亚股份、沐曦股份-U、中国石油、模塑科技、瑞芯微、亿纬锂能。其中，寒武纪获净流入13.02亿元。(上海证券报)</p>\n  <p><strong>恒指收盘涨0.51%，半导体板块领跌</strong></p>\n  <p>36氪获悉，恒指收盘涨0.51%，恒生科技跌0.36%；半导体、有色金属、硬件设备板块领跌，长飞光纤光缆跌超8%，兆易创新、紫金矿业跌超5%；石油石化、煤炭、房地产板块涨幅居前，恒大物业涨超12%，中国石油股份涨超5%，中国神华涨超2%；南向资金净卖出20.75亿港元。</p>\n  <p><strong>日本前首相福田康夫去世</strong></p>\n  <p>日本前首相福田康夫于10月22日在东京的医院去世。福田康夫于2007年就任日本首相，任期约一年。在任期间，他致力于维护和稳定日中关系。（央视新闻）</p>\n  <p><strong>国家能源局：截至9月底，全国累计发电装机容量41.3亿千瓦，同比增长11.2%</strong></p>\n  <p>36氪获悉，国家能源局发布1-9月份全国电力统计数据。截至9月底，全国累计发电装机容量41.3亿千瓦，同比增长11.2%。其中，太阳能发电装机容量13.1亿千瓦，同比增长16.5%；风电装机容量7.0亿千瓦，同比增长20.4%。1-9月份，全国发电设备累计平均利用2174小时，比上年同期降低194小时。</p>\n  <p><strong>康师傅重庆公司新增发电业务等</strong></p>\n  <p>36氪获悉，天眼查App显示，近日，康师傅（重庆）方便食品有限公司发生工商变更，经营范围新增发电业务、输电业务、供（配）电业务，以及光伏发电设备租赁、粮食加工食品生产、食品添加剂销售等。该公司成立于2006年5月，法定代表人为谭莉，注册资本500万美元，由康师傅方便面投资（中国）有限公司全资持股。</p>\n  <p><strong>ETF收盘：地产ETF华宝涨3.85% 巴西ETF易方达跌10.02%</strong></p>\n  <p>ETF收盘涨跌不一，地产ETF华宝(159707)领涨3.85%，石油ETF广发(159018)涨3.79%，石油ETF鹏华(159697)涨3.54%，巴西ETF易方达(520870)领跌10.02%，巴西ETF华夏(159100)��10.01%，半导体设备ETF国泰(159516)跌5.74%。(上海证券报)</p>\n  <h2>大公司财报</h2>\n  <p><strong>药明康德:第三季度归母净利润为83.18亿元，同比增长136.67%</strong></p>\n  <p>36氪获悉，药明康德公告，第三季度实现营收166.40亿元，同比增长38.01%;归母净利润为83.18亿元，同比增长136.67%。前三季度实现营收455.37亿元，同比增长38.59%;归母净利润193.98亿元，同比增长60.64%。</p>\n  <p><strong>蓝色光标：第三季度归母净利润9545.37万元，同比下降3.81%</strong></p>\n  <p>36氪获悉，蓝色光标公告，第三季度实现营收185.39亿元，同比下降1.06%；归母净利润9545.37万元，同比下降3.81%。前三季度实现营收531.00亿元，同比增长3.92%；归母净利润为3.07亿元，同比增长56.86%。</p>\n  <p><strong>万华化学：第三季度归母净利润为55.95亿元，同比增长84.38%</strong></p>\n  <p>36氪获悉，万华化学公告，第三季度实现营收665.51亿元，同比增长24.80%；归母净利润为55.95亿元，同比增长84.38%。前三季度实现营收1858.67亿元，同比增长28.87%；归母净利润156.58亿元，同比增长70.99%。</p>\n  <p><strong>中兴通讯：第三季度归母净利润13.07亿元，同比增长394.46%</strong></p>\n  <p>36氪获悉，中兴通讯公告，前三季度实现营收1168.38亿元，同比增长16.23%；归母净利润40.60亿元，同比下降23.71%。第三季度实现营收388.13亿元，同比增长33.99%；归母净利润13.07亿元，同比增长394.46%。</p>\n  <p><strong>海大集团：第三季度归母净利润12.96亿元，同比下降13.81%</strong></p>\n  <p>36氪获悉，海大集团公告，第三季度实现营收为91.09亿元，同比增长4.95%；归母净利润12.96亿元，同比下降13.81%。前三季度实现营收1033.49亿元，同比增长7.55%；归母净利润29.07亿元，同比下降29.83%。</p>\n  <p><strong>恩捷股份：第三季度归母净利润9.74亿元，同比增长14245.28%</strong></p>\n  <p>36氪获悉，恩捷股份公告，第三季度实现营收55.55亿元，同比增长46.95%；归母净利润9.74亿元，同比增长14245.28%；前三季度实现营收142.26亿元，同比增长49.07%；归母净利润17.94亿元，上年同期亏损8632.3万元，同比扭亏为盈。</p>\n  <h2>酷产品</h2>\n  <p><strong>科学家展示全球首款织进衣服的触摸屏</strong></p>\n  <p>近日，新加坡国立大学科学家展示了全球首款“织进衣服”的触摸屏。它集成在袖筒中，96×54像素，尺寸168毫米×105毫米，由一种既能显像又能感知触觉的纤维制成，手指按压有响应，可无线连接设备，还像普通衣物一样透气、柔韧，且可反复清洗。透气程度与棉布、牛仔布相当，机洗50次、弯折1000次后性能几乎不变。除了显示屏，麦克风、扬声器和传感器也以同样方式织入，可追踪运动、测量温度、探测环境。原型已能运行计算器、播放视频、充当指南针，把温度传感纤维放在腋下还能读出体温。(智慧科技迷)</p>\n  <h2>投融资</h2>\n  <p><strong>“K2Lab”完成千万元天使+轮融资</strong></p>\n  <p>36氪获悉，近日，“K2Lab”宣布完成由凯泰资本投资的数千万元天使+轮融资。半年内，“K2Lab”已连续完成由云时资本、华控基金、凯泰资本分别领投的三轮融资。本轮资金将主要用于海外业务拓展、模型算法与工程能力升级、商家Agent与商家联盟生态建设，以及 AI Native 组织建设。</p>\n  <p><strong>“诺亦腾机器人”完成Pre-A+++轮融资</strong></p>\n  <p>36氪获悉，近日，“诺亦腾机器人”（Noitom Robotics）完成Pre-A+++轮融资，本轮由汇融基金独家投资。</p>\n  <p><strong>“模感科技”完成亿元级天使+轮融资</strong></p>\n  <p>36氪获悉，全身多模态融合触觉解决方案公司“模感科技”（MoSense）近日完成亿元级天使+轮融资，由鼎晖投资、绿洲资本领投，逐际动力、龙芯创投、中科创星、华山资本、浦东创投以及某国内具身厂商跟投。后浪资本担任长期独家财务顾问。此前公司曾获得红杉中国、高瓴创投及智元机器人等参与的天使轮融资。</p>\n  <p><strong>“中科慧灵”完成数亿元A++轮融资</strong></p>\n  <p>36氪获悉，近日，聚焦人形机器人与具身智能核心技术研发及产业化应用的“中科慧灵”完成数亿元人民币A++轮融资。本轮融资由知来投资、涌铧投资、茂天投资、元禾辰坤、国科科智、鲁宁投资等机构联合投资。投资方涵盖市场化股权投资机构、专业母基金及产业投资平台，投资布局涉及人工智能、硬科技、先进制造等领域。</p>\n  <p><strong>整理丨宋清瑜</strong></p>", "category": "tech", "published_at": "2026-10-27T00:08:10+00:00", "fetched_at": "2026-10-27T03:27:58.133393+00:00", "fingerprint": "b2dd1662bbfc5809"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨红杉、高瓴、智元投过的全身触觉解决方案公司再获亿元级融资，团队来自港科大", "url": "https://36kr.com/p/4043477378880388?f=rss", "summary": "<p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <blockquote>\n   <p>本文约2500字，建议阅读5分钟</p>\n  </blockquote>\n  <p>硬氪获悉，全身多模态融合触觉解决方案公司模感科技（MoSense）近日完成亿元级天使+轮融资，由鼎晖投资、绿洲资本领投，逐际动力、龙芯创投、中科创星、华山资本、浦东创投以及某国内头部具身厂商跟投。后浪资本担任长期独家财务顾问。此前公司曾获得红杉中国、高瓴创投及智元机器人等参与的天使轮融资。</p>\n  <p>模感科技成立于2026年5月，由港科大机器人比赛冠军团队孵化而成。联合创始人兼CEO严朝旭博士毕业于香港科技大学微电子系，长期从事高频系统、电磁算法及具身多模态传感研究。联合创始人兼CTO周航博士毕业于香港科技大学机器人专业，曾任车规级自动驾驶企业资深算法研究员，长期从事端到端自动驾驶模型、世界模型及具身智能算法研究。</p>\n  <p><strong>模感科技专注于人形机器人的全身多模态触觉解决方案。与主要提供电子皮肤硬件的厂商不同，模感科技的差异化优势在于能够提供从触觉硬件、感知算法到触觉世界动作模型的完整技术链条，形成覆盖硬件、算法与模型的全栈方案。</strong></p>\n  <p>具体而言，公司目前围绕三大核心产品展开布局：全身电子皮肤硬件MoSkin、多模态融合触觉算法MoTact，以及多模态融合触觉世界动作模型MoWorld。</p>\n  <p>硬件层面，模感科技从底层力学结构入手，采用具有负泊松比特性的可调控人工晶格结构。借助这一结构，结构在受力时可以通过晶格定向旋转与形变、分散外部载荷，在承受较大冲击时保护内部传感单元，同时在微小力作用下保持极高的感知灵敏度，解决了传统触觉传感器难以兼顾高灵敏度与宽量程的问题，并提升了系统的抗磁干扰和抗过载疲劳能力。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_222a136f4d3241f2b86f4614529e5a33@5920579_oswg334900oswg744oswg752_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">MoSkin多模态触觉集成外壳</p>\n  <p>制造工艺方面，传统触觉传感器通常需要将传感薄膜贴附在机器人表面，再通过布线等方式完成集成。这种方式不仅工序较多、制造成本较高，也对复杂曲面的贴合能力提出了挑战，限制了触觉传感器向机器人全身大面积部署。</p>\n  <p>模感科技采用的磁光固化3D打印成型工艺，可将具有特定晶格结构的材料直接加工成一体化触觉结构件，并通过在材料中引入磁性单元形成电磁晶格，算法端采用超分辨率方案使其具备强大的多模态感知能力，同时兼顾低量产成本。该技术可适配硅胶、发泡材料、TPU等不同材质，有助于实现复杂曲面的成型。公司同时拥有全自动曲面大面积多模态标定算法，帮助下游客户实现即插即用。</p>\n  <p>同时，严朝旭向硬氪介绍，基于独创的“力学性能可编程”技术，同一套底层技术可以根据机器人不同部位的需求，调整材料与微观晶格结构的力学特性。例如，指尖需要更高的灵敏度，可以设计得更柔软；脚底需要承受较大冲击，可以强化其结构支撑能力；躯干则可以在大面积感知与结构强度之间取得平衡，所有的复杂方案都可以高效自动生成合理的拓扑结构。</p>\n  <p>算法层面，MoTact相当于“触觉小脑”，主要负责将硬件采集的多轴磁场信号解算为力、位移、滑移、材质等感知信息，并针对不同部位的应用需求进行算法优化。公司提出的技术能力包括稀疏超分辨率、复杂拓扑集成、抗漂移与抗磁干扰，以及KHz级高速阵列采样等，目标是让机器人能够更及时地识别接触状态和外部作用力，为抓取、操作及接触控制等高频动作提供反馈。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_186c0d968b95453da08856250bde3f08@5920579_oswg834965oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">模感科技MoTact与MoWorld模型算法</p>\n  <p>模型层面，模感科技正同步推进基于触觉的多模态融合触觉世界动作模型MoWorld。相较于仅依赖视觉等信息进行环境判断，触觉能够提供接触力、物体形变及局部交互状态等信息。公司希望利用高频、多维的触觉反馈，持续修正机器人动作执行过程中的判断与控制，并将触觉信息作为物理先验补充到模型中，提升机器人在真实环境中的交互能力，缩小仿真训练与真实执行之间的差距。</p>\n  <p>据介绍，目前，模感科技的全身触觉系统已在推进与多家头部机器人本体厂商的合作，并拓展应用落地。在模型侧，公司已经与头部机器人ODM/OEM公司展开合作，推动整体触觉系统及模型的一体化部署，为机器人提供完整触觉-大小脑解决方案。除人形机器人相关业务外，多行业智能整体方案也在加速商业化落地。</p>\n  <p><strong>以下为创始人问答：</strong></p>\n  <p><strong>硬氪：磁光固化3D打印具体解决了触觉传感器领域的哪些痛点？</strong></p>\n  <p><strong>严朝旭：</strong>传统电子皮肤大多采用薄膜或织物形态，需要贴附在机器人结构件表面。但人形机器人的肩膀、腰部等位置往往具有复杂曲面，传统方案在贴合和集成上存在一定难度，容易受到结构设计和装配工艺的限制。</p>\n  <p>我们现在的思路，是直接把触觉感知能力集成到结构件中。过去可能需要机器人壳体供应商和电子皮肤供应商共同完成这件事，现在我们希望直接提供兼具结构与感知能力的触觉结构件。这种方式的优势在于，结构件在成型阶段就可以适配机器人的曲面形态，减少后续贴合带来的问题。目前，硅胶、橡胶、发泡材料等不同材质，以及一些复杂曲面结构，我们都在进行适配。</p>\n  <p>所以，我们的定位不只是电子皮肤，而是触觉结构件。通过将结构设计和传感能力结合起来，我们希望让触觉系统更容易集成到机器人的不同部位，也为后续规模化生产创造条件。</p>\n  <p><strong>硬氪：“力学性能可编程”具体解决了触觉领域的什么问题？</strong></p>\n  <p><strong>严朝旭：</strong>其实这是我们快速工程化能力的一个体现。不同机器人厂商对外壳材料、结构硬度和触觉灵敏度的要求并不一样。如果每接到一个客户的需求，都要重新设计结构、重新进行仿真，开发周期就会比较长。</p>\n  <p>因此，我们在前期设计和仿真环节，就把结构参数做成了可调控的。客户如果需要更强的抗冲击能力，我们就可以调整结构，让它更坚固；如果需要机器人手臂在轻微接触时就能感知，我们就可以将相应区域设计得更柔软、更灵敏。</p>\n  <p>我们也在通过仿真模型，分析结构形变与分布式复杂磁场信号之间的关系，从而更快地完成设计和参数调整。这样面对不同客户、不同机器人结构时，我们就不必每次都从头开发，可以在已有技术体系上快速适配。</p>\n  <p><strong>硬氪：在算法层面，公司如何针对机器人不同部位的触觉需求进行优化？</strong></p>\n  <p><strong>严朝旭：</strong>机器人不同部位的感知需求差异很大，因此算法也需要进行针对性设计。</p>\n  <p>例如，手指和手掌涉及抓取、精细操作等任务，对灵敏度、采样率和分辨率的要求比较高，我们就会提高这些区域的传感器布置密度，并针对高频接触动作优化算法。手和脚还涉及相对复杂的受力情况，因此需要进一步强化多轴力感知能力。</p>\n  <p>但对于躯干等大面积区域，需求可能有所不同。这些位置更关注低功耗和大范围覆盖，不一定需要持续进行高频采样。针对这类场景，我们可以设计相应的低功耗算法，例如在常态下采用低功耗监测模式，在检测到碰撞等事件后再提高采样频率。</p>\n  <p>因此，我们不是用同一套参数覆盖机器人全身，而是根据不同部位的接触特点、受力情况和任务需求，对传感器布局、采样率、分辨率及算法进行差异化配置。这样既能满足关键部位的精细感知需求，也有助于控制整套系统的功耗和成本。</p>", "category": "tech", "published_at": "2026-10-27T01:59:55+00:00", "fetched_at": "2026-10-27T03:27:58.133384+00:00", "fingerprint": "50780280044f674f"}, {"source": "36氪 - 最新文章", "title": "这家全球汽零巨头，为何跨界做机器人？", "url": "https://36kr.com/p/4043530020115590?f=rss", "summary": "<p>汽车产业链企业进入机器人领域正在成为行业新趋势。</p>\n  <p>一方面，整车和零部件价格战持续，企业利润承压，需要寻找新的业务方向。另一方面，以人形机器人为代表的机器人行业，被不少从业者和机构视为下一个阶段的增长主线。行业里广为流传的说法是，具身智能的上半场是自动驾驶，下半场是人形机器人。</p>\n  <p>在这样的判断下，包括小鹏、奇瑞、北汽、蔚来、比亚迪等在内的数十家车企，纷纷在机器人领域落子。</p>\n  <p>宁波的汽车零部件巨头企业「均胜电子」也加入战局。均胜电子早期靠汽车功能件起家，后来通过整合德国普瑞、群英、TechniSat，美国KSS、日本高田等优质资产，切入汽车电子与汽车安全领域，并结合中国市场进行二次创新，成为全球汽车零部件前三十强企业。目前，公司在全球20多个国家设有工厂，2025年营收超过600亿元，其中七成以上来自海外。</p>\n  <p>2025年，均胜电子将业务方向调整为“汽车+机器人”双轮驱动，开始布局人形机器人，定位为机器人领域的Tier1供应商，产品规划聚焦“大小脑+肢体+能源”三大领域，包括AI头部总成、能源管理系统、大小脑域控制器、电子皮肤与灵巧手、机甲等关键部件。其中的电子皮肤，即柔性触觉传感器，主要依托均胜电子与香山股份联营的均胜群英研发与制造。</p>\n  <p>均胜群英电子皮肤业务负责人亢宇冉博士对36氪表示，机器人业务在集团目前战略规划中排在第一位，是明确的第二增长曲线。</p>\n  <p>透过均胜，既能看到车企的积累与沉淀如何在人形机器人上复用，也能看到从汽车到机器人之间，那些无法直接平移到位的落差。</p>\n  <p><strong>1.&nbsp;押注具身智能下半场</strong></p>\n  <p>均胜电子成立于2004年，创立之初专注于汽车功能件。2011年，公司收购德国老牌汽车电子公司普瑞，营收规模突破百亿元，并由此开启了此后十余年的国际化并购。</p>\n  <p>2014年12月，均胜电子以超过9000万欧元收购德国高端内饰件公司群英，其后与原均胜功能件业务整合成全新的均胜群英。均胜群英擅长座舱空气管理系统、智能表面技术，而且在真木、真铝、碳纤维和新材料及工艺上有一定积累，长期服务奔驰、宝马、奥迪、大众、通用和兰博基尼等国际车企。</p>\n  <p>2016年至2018年，均胜又先后收购德国TechniSat汽车业务、美国汽车安全供应商KSS以及日本高田优质资产。公司一跃成为全球第二大汽车安全供应商、第四大智能座舱域控系统供应商，产品自此覆盖全球几乎所有主流车企。</p>\n  <p>2025年，均胜在全球超过20个国家拥有超过4万名员工，产品服务全球超过100个汽车品牌。当年实现营收约612亿元，其中海外收入444.46亿元，占比72.64%。</p>\n  <p>过去几年，汽车价格竞争从大众市场向中高端市场蔓延，整车及零部件企业普遍陷入“增收不增利”的困境，寻找第二增长曲线成为行业的共同课题。正如理想汽车创始人李想在今年5月所说，“具身智能的上半场是自动驾驶，下半场是人形机器人。”</p>\n  <p>据机器人商业评论统计，截至2026年8月，已有超过15家整车厂进军人形机器人赛道。除了整车厂密集入局，上游的零部件供应商也在顺势转向机器人。均胜体系也是这批跟进的零部件企业之一。</p>\n  <p>目前均胜已经与国内头部机器人厂商展开合作，一方面，均胜为智元的一款轮式底盘双臂带机器人提供整机代工业务，从头部、双臂到底盘均由均胜完成制造、装配和测试。另一方面是具身数据采集业务。整机出厂后，将在均胜内部搭建的多个真实场景部署，开展实景实训，采集机器人作业数据，并用于物理AI模型的训练。</p>\n  <p><strong>2.&nbsp;做机器人领域的Tier 1</strong></p>\n  <p>据亢宇冉介绍，均胜在机器人业务上延续的是其在汽车产业里的Tier 1供应商定位。换句话说，均胜不造机器人的本体，也不做单一产品，而是覆盖机器人从头到脚，包括AI头部总成、能源管理系统、大小脑控制器、灵巧手与电子皮肤这些关键部件。</p>\n  <p>以均胜群英的电子皮肤为例。电子皮肤是机器人的“触觉器官”，是一层像人造皮肤一样的柔性电子薄膜，贴在机器人表面，能感知压力、滑动、振动、温度等触觉信号。</p>\n  <p>在电子皮肤的技术路线上，均胜群英采取多线并行，以压阻为基础、以多模态为特色。据亢宇冉介绍，以压阻路线为基础，是因为它成熟度最高，适合高密度集成和规模化量产，也有成本优势，而且靠受压后的电阻变化来感知，不受强磁环境干扰。</p>\n  <p>目前，第一代电子皮肤基于压阻式，已研发并推出机器人指尖触觉传感器、夹爪触觉传感器与灵巧手全手触觉感知方案。第二代将研发电容式大面积电子皮肤，据亢宇冉介绍，电容路线靠受压后的电容变化来感知，灵敏度更高，也能实现接近觉感知，适合铺在更大面积的机身表面。</p>\n  <p>此外，均胜群英联合中科院宁波材料所、宁波东方理工研究院、北京航空航天大学等机构，依托浙江省重点研发技术尖兵项目，同步推进新型柔性电磁式电子皮肤的研发，这类方案靠磁场变化感知，适用于对磁场不敏感的场景。</p>\n  <p>目前，电子皮肤产品已适配均胜自研的灵巧手和工业夹爪。均胜群英的理念是先在自有产线上把技术环节打通、把验证做完，再对外供货，替客户提前发现问题，后期再推广到汽车主机厂等客户的产线。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261027/v2_0a2f27c5598942d5865cff68997c4b39@6244039_oswg116271oswg1436oswg761_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">均胜群英的电子皮肤搭载在机器人夹爪指尖</p>\n  <p>“这也是均胜群英做机器人关键部件的一大优势。”亢宇冉介绍，某个场景需要哪几个模块、压力精度要做到什么程度，都要靠产线中的真实需求得到反馈。部署应用越多，采集的数据越多，产品才能基于真实场景不断迭代，提供可靠性并降低成本，成本越低进而带来更多订单，形成正向循环。</p>\n  <p>亢宇冉表示，均胜群英做机器人优势在于工程化能力、场景数据与客户资源。在工程化上，均胜群英有数十年的产线建设经验，能把样机变成稳定批量交付的产品。在场景数据上，作为制造企业，均胜群英自有产线提供了大量典型工况，可直接把机器人和电子皮肤搬上去，在真实环境里验证并迭代&nbsp;</p>\n  <p>客户资源上，均胜群英有很多工厂和产线，正是机器人未来的买方。同时，均胜也向机器人公司供应关键部件。一边代工生产并部署使用机器人、一边研发生产和销售机器人关键部件，形成双向循环，这种互为客户的关系十分紧密。</p>\n  <p>但他也坦承，现阶段商业化是整个人形机器人行业共同的难题，即使是对于有丰富制造经验的车企也不例外。</p>\n  <p>亢宇冉将均胜群英机器人业务当前面临的挑战归纳为两个层面：一是客户需求与研发成本的平衡；二是规模化客户的获取。“具有真实需求的规模化客户还在形成过程中，愿意买单的客户要的是能直接落地、长期稳定运行的整体解决方案，而不是样品。这要求软硬件系统在免维护条件下连续运行一至两年，整体成本控制在企业和产线可接受的范围内。”</p>\n  <p>机器人业务的出海，均胜群英规划先从均胜自有海外工厂起步在自有产线完成机器人部署与验证之后，逐步向海外制造业客户推广。海外有大量的存量市场，在国际政策允许的前提下，将是机器人业务的蓝海。未来，均胜的目标客户仍以汽车客户为主，公司现有汽车客户也是潜在的机器人客户。</p>", "category": "tech", "published_at": "2026-10-27T02:56:53+00:00", "fetched_at": "2026-10-27T03:27:58.133368+00:00", "fingerprint": "92d030aee440df52"}, {"source": "少数派", "title": "少数派×红树林基金会｜候鸟季公益直播，邀你共护湿地", "url": "https://sspai.com/post/117180", "summary": "每年秋冬，深圳湾都会迎来一批特殊的「旅客」。它们从北方出发，沿着迁徙路线飞越山海，有的在这里短暂停歇，有的则留下越冬。随着潮水涨落，水鸟在滩涂上低头觅食，鸟群掠过海面，也让我们熟悉的海湾多了几分热闹。 ...<a href=\"https://sspai.com/post/117180\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T03:00:13+00:00", "fetched_at": "2026-10-27T03:27:56.598212+00:00", "fingerprint": "1fd80b63b6a92b11"}, {"source": "少数派", "title": "曲高和寡、终成绝唱：傲腾 P5800X 测试报告", "url": "https://sspai.com/post/115074", "summary": "一起来看看 3D XPoint 这夸张的性能表现吧。<a href=\"https://sspai.com/post/115074\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T03:26:35+00:00", "fetched_at": "2026-10-27T03:27:56.598206+00:00", "fingerprint": "46e5cbfac61dc172"}, {"source": "少数派", "title": "秋冬换季护肤买什么，双 11 选购推荐", "url": "https://sspai.com/post/117414", "summary": "双 11 到来之际的秋冬护肤选购与搭配建议。<a href=\"https://sspai.com/post/117414\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T07:00:00+00:00", "fetched_at": "2026-10-27T03:27:56.598199+00:00", "fingerprint": "b6555366cc841c28"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/117529", "summary": ">下载少数派客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/117529\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-26T10:17:46+00:00", "fetched_at": "2026-10-27T03:27:56.598191+00:00", "fingerprint": "de37cbe39a3c9b32"}, {"source": "少数派", "title": "派早报：Apple 发布 iPad mini (A20 Pro) 等", "url": "https://sspai.com/post/117600", "summary": "少数派的近期动态全新设计复古设备鼠标垫上架，会员可使用点数兑换。前往选购iPhone少数派共创配件上新，自由选择保护、充电、线缆和支架组合。欢迎选购你可能错过的文章少数派×红树林基金会｜候鸟季公益直播 ...<a href=\"https://sspai.com/post/117600\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-27T00:27:58+00:00", "fetched_at": "2026-10-27T03:27:56.598178+00:00", "fingerprint": "60a173c7d456cbee"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.6841 CNY →+0.00%", "url": "https://www.frankfurter.app/2026-10-26?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-10-26</b></div><div style=\"font-size:24px;margin:6px 0;\"><b>1 AUD = 4.6841 CNY</b> <span style=\"color:#888;font-size:14px;\">→ +0.0000 (+0.00%) 持平</span></div><div style=\"color:#888;font-size:12px;\">数据源: 欧洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-10-27T03:27:55.293662+00:00", "fingerprint": "89e20da05e1f3d36"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById("data-blob").textContent || "{}");
  const items = DATA.items || [];
  const updatedAt = DATA.updated_at || "";

  const CATEGORIES = [
    { id: "all", label: "全部" },
    { id: "rate", label: "💱 汇率" },
    { id: "tech", label: "💻 科技" },
    { id: "politics", label: "🌐 政治" },
    { id: "other", label: "📰 其他" }
  ];
  const ACCENT = {
    rate: "var(--accent-rate)", tech: "var(--accent-tech)",
    politics: "var(--accent-politics)", other: "var(--accent-other)"
  };

  const updatedEl = document.getElementById("updated-at");
  if (updatedAt) {
    const d = new Date(updatedAt);
    updatedEl.textContent = d.toLocaleString("zh-CN", { hour12: false });
  }

  function countByCat(cat) {
    return cat === "all" ? items.length : items.filter(i => (i.category || "other") === cat).length;
  }

  const tabsEl = document.getElementById("tabs");
  let activeTab = "all";

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const n = countByCat(c.id);
      if (c.id !== "all" && n === 0) return;
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === activeTab ? " active" : "");
      btn.innerHTML = `${c.label}<span class="count">${n}</span>`;
      btn.onclick = () => { activeTab = c.id; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }
  function stripHtml(s) { return (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
      return d.toLocaleDateString("zh-CN");
    } catch (e) { return ""; }
  }

  function renderItem(it) {
    const cat = it.category || "other";
    const summary = stripHtml(it.summary || "").slice(0, 240);
    return `<div class="item" data-cat="${escapeHtml(cat)}">
      <div class="item-source">
        <span>${escapeHtml(it.source || "")}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(formatDate(it.fetched_at))}</span>
      </div>
      <div class="item-title">
        <a href="${escapeHtml(it.url || "#")}" target="_blank" rel="noopener">${escapeHtml(it.title || "")}</a>
      </div>
      ${summary ? `<div class="item-summary">${escapeHtml(summary)}</div>` : ""}
    </div>`;
  }

  function renderContent() {
    const contentEl = document.getElementById("content");
    const emptyEl = document.getElementById("empty");
    const shown = activeTab === "all"
      ? items
      : items.filter(i => (i.category || "other") === activeTab);
    if (shown.length === 0) {
      contentEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if (activeTab !== "all") {
      contentEl.innerHTML = shown.map(renderItem).join("");
      return;
    }
    const groups = {};
    shown.forEach(it => {
      const c = it.category || "other";
      (groups[c] ||= []).push(it);
    });
    const order = ["rate", "tech", "politics", "other"];
    contentEl.innerHTML = order
      .filter(c => groups[c])
      .map(c => {
        const meta = CATEGORIES.find(x => x.id === c) || { label: c };
        return `<section class="category-section">
          <div class="category-header">
            <span class="accent-bar" style="background:${ACCENT[c]}"></span>
            <span>${meta.label}</span>
            <span style="color:var(--fg-subtle);font-weight:400;">(${groups[c].length})</span>
          </div>
          ${groups[c].map(renderItem).join("")}
        </section>`;
      }).join("");
  }

  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "" : "dark");
    if (next) {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("infobot-theme", next);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("infobot-theme");
    }
  };
  const saved = localStorage.getItem("infobot-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  renderTabs();
  renderContent();
})();
</script>
</body>
</html>
