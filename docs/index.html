<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>

 "url": "https://36kr.com/p/4037822855058307?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_27251065c5834f4d8f043a2a144242a7@5688585_oswg1213800oswg1672oswg941_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">链式反应</p>\n  <p>文&nbsp;|&nbsp;杨越欣</p>\n  <p>编辑&nbsp;|&nbsp;阿至</p>\n  <p>封面来源&nbsp;|&nbsp;企业供图</p>\n  <p>今年6月，OpenAI承认，GPT-5.6 Sol模型和另一款能力更强的预发布模型联合进行内部评估时失控，突破隔离测试环境，侵入Hugging Face系统；</p>\n  <p>7月30日，Anthropic自曝复查141006次评测运行后，发现3起AI入侵真实公司的事件；</p>\n  <p>10月15日，印度官方首次通报，多个正在测试中的AI模型多次在未被察觉的情况下，侵入印度多家企业的电脑实时系统并读取存储其中的保密记录……</p>\n  <p>从更宏观的现实来看，CrowdStrike《2026全球威胁报告》显示，2025年AI赋能攻击者的活动量同比增长89%，从初始访问到横向移动的平均突破时间降至29分钟，最快纪录27秒，较上一年加速65%。</p>\n  <p>“过去需要专业团队完成的渗透测试，现在一个不懂网络安全的人借助AI工具就能做。”AI+先发安全公司「链式反应」创始人柯煜表示，网络安全行业正面临一种结构性困境：</p>\n  <p>一边AI使网络攻击变得廉价且可批量发生，一边安全厂商仍普遍是销售主导获客、项目制交付、高度定制化的传统业务模式，成本高且难以标准化，攻防两侧成本结构不对称，进一步加剧了网络安全公司盈利困难的普遍局面。</p>\n  <p>今年8月，柯煜离开某大厂紫军团队，注册成立链式反应，切入先发安全赛道创业，为企业提供更低门槛的主动防御能力。</p>\n  <p><strong>36氪获悉，链式反应已完成数百万元种子轮融资，投资方为微步在线与靖安科技相关方，资金主要用于研发投入、市场团队建设及基础设施搭建。</strong>其中，微步在线是一家以威胁情报和AI安全运营为技术内核的安全厂商，在威胁情报数据和生产系统上有长期积累，链式反应的先发能力可以与其业务形成技术互补。</p>\n  <p>柯煜出生于1998年，是一位连续创业者，曾做过奇安信和长亭科技的白帽黑客。在开源还不是业内主流模式的2021年，他建立了开源安全社区ChainReactors，其中面向红队的高性能自动化扫描引擎「gogo」，在GitHub上获得约2000Stars和200Forks，积累了一批具备二次开发能力的核心用户。</p>\n  <h2><strong>打造端到端的</strong></h2>\n  <h2><strong>先发安全开源产品</strong></h2>\n  <p>不同于传统防御产品在遭受攻击后再“亡羊补牢”的做法，链式反应长期维护先发安全开源项目，通过主动模拟攻击者的行为，发现系统漏洞等弱点，帮助企业提前完善系统安全。</p>\n  <p>“市面上多数安全 AI 产品的交互方式是聊天机器人（chatbot），最后一公里仍然要靠专业安全工程师来判断。”柯煜表示，<strong>多数产品的做法是“人在回路”：模型负责生成建议，工程师负责拍板。</strong>链式反应产品的架构的核心是一套端到端的Agent（智能体）工程体系，不预设角色、也不预设工作流，而是让模型在共享状态空间中自主搜索攻击路径。“用户只需输入目标、等待结果，全程不需要具备安全工程能力。”</p>\n  <p><strong>在腾讯云TCH智能渗透挑战赛（TCH2）610支队伍中，Cairn以54/54道题唯一全解（AK）的成绩排名第三；在行业权威基准TSecBench上曾霸榜数月，榜单第2到10名多基于其开源项目二开或借鉴；同时，在刚刚结束的TCH3中获得前20中的四席。</strong></p>\n  <p>10月，链式反应推出SaaS化AI自动化渗透系统「CYBER·AI黑客」，正式版本覆盖黑客攻击的完整生命周期（从信息收集到后渗透全链路）。</p>\n  <p>“我们在保留Cairn核心设计思想的同时，对核心架构进行了全面的重构”，柯煜表示，CYBER是目前业内首个AI Native的自动化渗透系统，主打端到端全自动交付，低误报、长链路、可解释、可观测。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_ca54f148f67a43f784220aa878c2b457@5688585_oswg122998oswg1080oswg739_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">CYBER·AI黑客为36氪进行进攻性安全测试的工作界面</p>\n  <p><strong>基于对开源生态的信仰，柯煜决定开源和商业化并行，“开源版本的核心能力能达到商业化产品80%的效果，商业版本以所有用户都能接受的价格提供最顶级的攻击能力，主要专注于用户体验、易用性、托管以及高级对抗能力。”</strong>这种开放承诺等于把公司的护城河押注在技术的持续迭代速度上，能否在未来商业化的压力下守住，还需要市场持续观察。</p>\n  <p>对此柯煜也有清醒的认知：“虽然现在我们在技术上有几个月的领先优势，但AI行业的迭代太快，技术是我们的命脉，只能一直往前跑，停下来，就等于被自己淘汰。”</p>\n  <h2><strong>以ToKen计费，</strong></h2>\n  <h2><strong>靠开源获客</strong></h2>\n  <p>商业模式是这家公司目前最不确定、尤其值得观察的部分。<strong>柯煜介绍，链式反应正在尝试推出以Token计费的新一代产品，从而跳出项目制交付的传统业务模式。</strong>具体来说，客户自己从模型厂商购买Token，再接入链式反应的平台获得先发安全能力服务，平台根据Token使用量收取同等或略高的费用。</p>\n  <p>“这是我们在尝试过私有化买断和私有化订阅这两种传统模式后，正在进行的实验，能不能跑通还不确定。”柯煜表示，Token计费在理论上把边际交付成本压到接近零，使得“一年预算只有几万块”的中小客户也有可能成为可服务的对象。</p>\n  <p>“试用客户中有一些成立仅几个月、但已经遭遇过攻击的小公司，这类需求在传统安全销售体系中几乎没有被认真对待过。”柯煜介绍，100家试用企业用户调研中，约七成表示愿意接受这种付费形式，但目前具体产品定价尚未确定，未来有可能对标Kimi、智谱等模型厂商的定价。同时他也坦承，这一模式下Token消耗随测试深度上升的成本结构、规模化和多行业验证还是未知数。</p>\n  <p>一位网络安全从业者告诉我们：“中国市场一直以来面临的问题是，销售表现高度依赖圈子关系，技术能力和带来的订单是不成正比的。”对此链式反应的选择是，<strong>放弃搭建传统的销售团队，转而筹建更偏向C端逻辑的市场团队，依靠开源社区PLG、Benchmark成绩和社交媒体内容实现获客。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_18ac763c813446098cb394fd7d760850@5688585_oswg186773oswg1080oswg629_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">开源社区ChainReactors</p>\n  <p>柯煜表示，目前已有客户几乎都是通过ChainReactors进行转化，这也给了他依靠开源社区等公域直接获客的信心，“我们希望不再是给客户卖一个黑盒，而是将真正关心能力、关心技术的客户筛选出来，让客户通过充分的技术调研和市场调研，判断我们的能力是否是他们需要的。”</p>\n  <p>QYResearch数据显示，2024年中国漏洞评估和渗透测试市场规模约为266.65亿元，但其中包含大量合规驱动的标准化扫描服务，与链式反应所瞄准的实战化、自动化攻击安全场景并不完全重叠。</p>\n  <p>或许可以说，在尚处于萌芽期的先发安全市场，链式反应提出的以开源生态获取技术信用、Token计费模式和去定制化销售的市场策略，本身也是为安全行业在AI时代下的演变提供了一个可观察样本。</p>\n  <p>“最近和一些投资机构聊，有人说上一次看网络安全赛道，已经是三年前了。如果这轮AI浪潮来了之后，行业还是没有实质性变化，我们也要接受现实。”柯煜表示，虽然链式反应现阶段聚焦先发安全赛道，但团队并不希望止步于此，而是希望在未来有能力成为一家伴随大模型迭代平行进化的通用性AI企业.</p>\n  <p>在攻击速度以秒计的AI时代，链式反应能不能靠Token跑通，在一定程度上也决定了它是一家安全公司，还是通用AI公司。</p>", "category": "tech", "published_at": "2026-10-23T02:25:48+00:00", "fetched_at": "2026-10-23T03:06:38.708047+00:00", "fingerprint": "01de6cd62fd31729"}, {"source": "36氪 - 最新文章", "title": "宇树王兴兴：物理AI会在未来两三年突破，非常害怕浪费每一天", "url": "https://36kr.com/p/4037854039610505?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>10月22日，宇树科技在杭州举办“2026世界物理AI大会暨宇树合作伙伴生态大会”，这也是宇树成立十年以来首次举办生态合作伙伴大会。&nbsp;</p>\n  <p>在大会上，创始人王兴兴发表了一场题为《相信，尽可能相信AI》的演讲，分享了他对AI技术发展、宇树技术路线以及机器人行业未来的判断。&nbsp;</p>\n  <p>“全世界几乎所有人，对AI的重视程度和信仰还不够，包括我自己。”王兴兴表示，在他看来，即便AI已经成为全球最受关注的技术方向，人们对其发展速度和潜在影响的认识仍然不足。&nbsp;</p>\n  <p>他举了一个有意思的案例。其实早在四五年前，自己就曾向公司同事推荐过一些AI相关股票，“如果几年前更加相信AI，宇树一些员工的个人财富可能已经增长十倍甚至几十倍。”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_11a19dfa22f1422e8a942bffec28c3b1@1199336245_oswg780242oswg1080oswg525_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王兴兴演讲</p>\n  <p>不过，为什么AI技术突飞猛进，普通人却还没有感受到太大的变化？王兴兴认为，这是因为一项技术从取得突破到真正普及，往往需要五到十年。&nbsp;</p>\n  <p>他以互联网为例，从2000年前后的互联网泡沫，到2010年前后电商等应用逐渐普及，整个过程花费了近十年。因此，最先进的AI模型要真正进入普通人的生活，同样需要时间发酵。&nbsp;</p>\n  <p>但在他看来，这并不妨碍AI最终带来巨大的改变。所以，他每天不间断都在思考一个终极问题： <strong>如果AI将颠覆每个人的生活，那么其中最重要的机会究竟是什么？</strong></p>\n  <p>作为一家机器人公司的创始人，他认为机会存在于物理AI。王兴兴甚至给出了一个相当激进的判断：随着通用大模型能力快速提升，物理AI可能在未来一至三年迎来重大突破。 <strong>“快的话一到两年，慢的话两到三年”。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_4093e3fa9d6c43b7bab4cd0bad21fd6d@1199336245_oswg110758oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树展出了刚发布的H2-X机器人&nbsp;</p>\n  <h2><strong>GPT-6 Astra对具身智能冲击巨大</strong></h2>\n  <p>王兴兴认为，不久前发布的GPT-6 Astra给了行业巨大的冲击。在宇树内部，他们也尝试用这一模型做了几项机器人实验。&nbsp;</p>\n  <p>其中一项是让机器人绘画。按照他的介绍，宇树事先并没有针对这一绘画任务编写复杂程序，仅仅是通过 <strong>提示词</strong> ，让机器人完成绘画。令人惊喜的是，机器人还会自主完成了更换颜料、清洗画笔等绘画配套工作。&nbsp;</p>\n  <p>宇树内部针对GPT-6 Astra的另一项实验是下围棋。&nbsp;</p>\n  <p>他们发现，机器人不仅能够识别棋盘，并将棋子精准放置在相应位置。王兴兴在演讲中还反复强调，这些实验都是在“零训练”的条件下完成的。&nbsp;</p>\n  <p>在过去，机器人往往需要针对具体任务编写程序，或进行专门训练，而如今GPT-6 Astra证明了，通用大模型已经有了直接控制机器人完成部分任务的潜力。&nbsp;</p>\n  <p>不过，王兴兴也承认，GPT-6 Astra并非无所不能。在他看来，大模型已经能够较好地解决机器人的任务规划和导航问题，但真正动手操作时，仍然容易出错。&nbsp;</p>\n  <p>举个例子，让机器人抓起一个物体相对容易，但要它组装精密零部件，难度就大得多——这是因为，机器人不仅要知道怎么做，还要根据物体的位置、受力情况等实时调整动作。在王兴兴看来，目前的大模型在感知真实环境变化、及时纠正操作失误方面，仍然存在明显不足。&nbsp;</p>\n  <p>尽管如此，王兴兴依然给出了相当激进的预测。他认为， <strong>未来大模型可能“击穿”物理AI。</strong></p>\n  <p>王兴兴判断，接下来具身智能是否能迈入Chat GPT时刻最核心的挑战是 <strong>，AI模型的输入输出是否能与真实机器人对齐。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_d7777fae0ca04874b271467a95ddba81@1199336245_oswg110906oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王兴兴演讲&nbsp;</p>\n  <p>他也公布了自己的愿景。他希望， <strong>到今年年底或明年，宇树机器人就能够进入普通家庭</strong> ，人们可以通过语音指令，让机器人完成整理房间等任务。而更长远的目标是，机器人或将能通过语言指令顺利完成80%的任务。&nbsp;</p>\n  <h2><strong>自研AI自进化模型</strong></h2>\n  <p>在大脑方面，王兴兴称，宇树除了继续推进与国内外大模型公司的合作外，也在同步推进自身的物理AI系统。目前，宇树正在研发一套名为“ <strong>物理AI机器人自进化V1”的模型系统。</strong></p>\n  <p>根据介绍，这套系统可以让AI智能体自主编写代码，在仿真环境中测试训练，再进入真实环境验证，最终将结果反馈给自主评价系统，形成持续迭代的闭环。&nbsp;</p>\n  <p>过去，机器人每掌握一项新技能，往往需要研发人员投入大量时间进行数据采集、训练和优化，即便在实验室里取得成功，迁移到新的环境中也可能需要重新调整。&nbsp;</p>\n  <p>王兴兴希望借助AI模型，将这一过程转变为更大程度上自动化、可规模化的训练体系，减少机器人技能开发对人工编程和调试的依赖。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_34b9b86a62374f008d6f27b124fc7443@1199336245_oswg82427oswg1080oswg813_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树的自进化系统运作机制&nbsp;</p>\n  <p>王兴兴也解释了宇树研发这套系统的原因。&nbsp;</p>\n  <p>在他看来，基础模型越强，机器人的自进化能力也就越强。随着更多数据被用于训练，自进化的规模效应将逐渐显现。而当更多机器人实际部署，又将带来更多真实数据，进一步推动模型迭代。&nbsp;</p>\n  <p>通过这一循环，机器人能够不断积累和拓展技能，最终形成规模化的技能生态。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_58f2775833584f2ab508b2cfc2a41c95@1199336245_oswg106256oswg1080oswg813_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王兴兴解释为什么要做自进化&nbsp;</p>\n  <p>不过，目前宇树披露的主要还是技术思路，这套系统的实际训练效率、技能迁移能力以及真实环境中的成功率，仍有待验证。&nbsp;</p>\n  <p>可以看到，宇树正在加大大脑侧投入，这次的自进化模型，也紧跟当下AI热点。&nbsp;</p>\n  <p>过去，宇树的优势主要集中在机器人本体，包括关节模组、动力系统和运动控制算法。而随着行业竞争从“让机器人动起来”转向“让机器人完成实际任务”，单纯的硬件优势已不足以决定企业的长期竞争力。&nbsp;</p>\n  <p>宇树显然意识到了这一变化。&nbsp;</p>\n  <p>王兴兴透露，从去年开始，宇树已经开始采用预训练的深度强化学习技术， <strong>自主研发了预训练的全身运动控制模型，</strong> 使得机器人能够批量训练不同动作，大幅提升训练效率。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_8ab66339b0ea4d94ac9556513d053abb@1199336245_oswg139677oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">2026年以来宇树在模型和数据上的进展&nbsp;</p>\n  <h2><strong>这是最好的时代，我非常害怕浪费每一天</strong></h2>\n  <p>对行业未来，王兴兴表现出乐观，但他无法回避竞争的残酷。&nbsp;</p>\n  <p>“这个行业非常火热，未来的蛋糕非常大，前景非常广阔，但竞争也非常惨烈”，他表示。&nbsp;</p>\n  <p>这种紧迫感也反映在他的个人状态中。他直言，他每天有很多想做的事，除了机器人，还有许多新技术需要学习和探索，但时间越来越不够用。&nbsp;</p>\n  <p>“ <strong>现在是最好的时代，我非常害怕浪费每一天。</strong> ”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_96b6aab2b49341dc82c49e291eafc095@1199336245_oswg93894oswg1080oswg723_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王兴兴演讲</p>\n  <p>在他看来，过去数千年人类文明积累的基础，使这一代人类有机会真正实现超级智能或者AGI，并通过人形机器人将生产力提升到新的水平。&nbsp;</p>\n  <p>他甚至描绘了一个更遥远的社会图景。当机器人承担大量繁重劳动、生产，未来包括房屋在内的生活物资，或将通过社会分配体系，让更多普通人受益。&nbsp;</p>\n  <p>而在这一图景之下，他认为未来决定机器人行业发展的四个重要方向是—— <strong>机器人规模化制造、物理AI模型的研发与落地、超大规模算力服务器，以及算力和存储芯片的制造能力。</strong></p>\n  <p>在硬件制造方面，他透露，宇树G1机器人已经累计下线 1-2 万台。但这一产能仍远远不够，他认为，未来机器人行业需要具备年产千万台的制造能力。&nbsp;</p>\n  <p>与此同时，物理AI模型的研发和实际落地也将成为行业竞争的关键。王兴兴透露，宇树目前正与国内外大模型企业保持合作。&nbsp;</p>\n  <p>而随着模型能力不断提升，机器人训练和对算力的需求也将持续增长，超大规模服务器集群，以及算力和存储芯片的制造能力，都将成为支撑行业发展的重要基础。&nbsp;</p>\n  <p>基于这一判断，王兴兴认为，未来世界最核心的资源会是五项—— <strong>数据、算力、芯片产能、能源和矿产。</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_194bf38b7a9044cb9d25ce5687d272a6@1199336245_oswg126578oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">王兴兴认为未来世界有五项核心资源&nbsp;</p>\n  <h2><strong>宇树不只想表演，还想做生态</strong></h2>\n  <p>过去几年，宇树凭借机器人跳舞、格斗、跑步等运动能力频频出圈，但外界也一直有一个疑问：为什么宇树的机器人总是在表演，而不是去干活？&nbsp;</p>\n  <p>此次大会上，王兴兴也与姚明发起了一场圆桌对谈，并回应了这一问题。&nbsp;</p>\n  <p>在他看来，机器人打拳、打球与人类进行体育锻炼类似，目的都是提升运动能力、稳定性和动作精度，为未来执行实际任务打好基础。&nbsp;</p>\n  <p>“如果你连自己走路都走不好，跑都跑不起来，那你还指望这样的机器人去干活吗？”&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_1ae0c05adec3442085cd0ff7c6425556@1199336245_oswg77205oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">姚明与王兴兴对谈&nbsp;</p>\n  <p>他以机器人格斗为例，解释了宇树为何热衷于这类看似与实际应用无关的运动。&nbsp;</p>\n  <p>一方面，格斗涉及碰撞、摔倒等极端情况，可以检验机器人的可靠性。另一方面，格斗需要完成大量复杂动作，对机器人的运动控制算法和稳定性提出了很高要求。&nbsp;</p>\n  <p>在表演之外，宇树也在尝试与更多合作伙伴合作，将机器人推向实际应用场景。不过，宇树的策略不是自己下场，而是建生态。&nbsp;</p>\n  <p>此次生态大会上，宇树正式启动“宇创计划”，面向已成立公司或有明确创业方向的团队，招募机器人本体与核心部件、具身智能算法、数据与仿真平台、行业应用及解决方案等领域的创业者。&nbsp;</p>\n  <p>王兴兴称，将为其提供产业资本、机器人平台、开发工具、工程量产及应用场景等方面的支持。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_8ed27a8a7be24054b3d3356ab5221ffd@1199336245_oswg126969oswg1080oswg810_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇创计划&nbsp;</p>\n  <p>王兴兴提出，未来五年， <strong>宇树希望通过这一计划孵化200家以上优质生态企业</strong> 。&nbsp;</p>\n  <p>这也意味着，宇树正尝试从单纯销售机器人产品，向提供技术平台、联合合作伙伴开发应用的生态模式拓展。&nbsp;</p>\n  <p>不过，这能否吸引足够多的开发者和创业企业，并将这些应用探索转化为可持续的商业收入，仍是宇树需要回答的问题。&nbsp;</p>\n  <p>这次生态大会，是宇树上市后第一次对行业正式喊话。作为一家市值千亿以上的标杆型公司，宇树承载了复杂的情绪。如今，它不再是那个极客青年的私有品，作为行业少数的领袖，它必须去引领一段更性感和宏大的故事。&nbsp;</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜沈祺</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_4836f2dbc78e463cb5c1074497c8d3d8@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>", "category": "tech", "published_at": "2026-10-23T02:39:38+00:00", "fetched_at": "2026-10-23T03:06:38.708041+00:00", "fingerprint": "6fbb5a43ee0b0d8a"}, {"source": "36氪 - 最新文章", "title": "硬氪首发丨理想AI眼镜操盘手开启儿童硬件创业，获数千万元天使轮融资", "url": "https://36kr.com/p/4037856792581256?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，儿童AI硬件公司「物外智趣」近日完成数千万元人民币天使轮融资，投资方包括柏睿资本、天使投资人高秉强教授以及高锋耐心资本。</p>\n  <p>本轮融资将主要用于产品研发、AI体验建设及核心团队扩充。据悉，物外智趣将持续推进后续融资，由棕榈资本担任财务顾问。</p>\n  <p>「物外智趣」成立于2026年2月，团队核心成员均来自理想汽车，有着丰富的C端产品研发经验，兼具软件体验打磨与硬件量产交付能力。</p>\n  <p>公司创始人王紫崴在理想期间先后负责产品与品牌战略、理想同学AI产品、智能眼镜Livis，完整操盘过多款软硬件产品从0到1的产品创新和落地。2025年12月，其负责的理想眼镜上市销售，首销期3万台库存在48小时内售罄。</p>\n  <p>王紫崴表示，「物外智趣」的首款产品的定位是——为儿童打造一款“随身早教专家”。</p>\n  <p>产品形态上，「物外智趣」首款硬件产品形态为轻便极简的可穿戴硬件。为了实现这一愿景，在硬件背后，他们设计了一套主动式多模态Agent架构，让AI随时随地记录并理解孩子的真实生活——通过与孩子的交流、对日常家庭互动的理解，帮助孩子承接好奇与探索，帮助家长对孩子进行成长启蒙。</p>\n  <p>王紫崴告诉硬氪，他们的创业起点，正是源于低龄儿童的现实教育困境的观察与思考。</p>\n  <p>选择3岁作为起点，是因为这个阶段孩子开始能够比较完整地表达自己的想法，也进入了一个特别爱问“为什么”、主动探索世界的时期；同时，孩子开始上幼儿园，拓展了活动半径，时常会脱离父母视线。</p>\n  <p>而把8岁作为第一阶段的年龄上限，是因为8岁以前是儿童发展与启蒙的关键期。“WHO将0–8岁定义为早期儿童发展阶段；UNICEF数据显示，儿童大脑在3岁时达到成人体积约80%，5岁时约90%，高速发展的机会窗口在7岁前后逐渐收窄。”</p>\n  <p>在他看来，科学养育并不是用一套标准去塑造孩子，而是在理解儿童发展规律的基础上，保护孩子天然的好奇心、探索欲和创造力。孩子的好奇也不会按照课程表发生，早教往往发生在日常生活的互动里，而大部分双职工父母往往很难一直在场。</p>\n  <p>另一方面，当真的问题来临的时候，家长也缺乏有效的应对手段，例如孩子突然情绪崩溃大哭等，需要系统的学习和理解。</p>\n  <p>同时，成年人的感知能力在生活中已经封闭，带孩子遛弯儿听不见虫鸣鸟叫，也无法细致描绘绿树红花。</p>\n  <p>他分享了一个身边的真实例子：当大人给孩子看蔡皋的《桃花源的故事》国风绘本时，想借此对孩子做美学启蒙，但如若家长自己没有相应的赏析能力，就只能粗浅讲讲“绿树红花”。家长语言的边界，往往决定了孩子的认知边界。</p>\n  <p>因此，他们希望借助AI能力的持续进化，打造一款更多家庭都消费得起、能随时在场的AI硬件——这款硬件就像一位早教专家，可以根据家庭环境、孩子所处的发展阶段、父母当下关心的问题提供早教支持。</p>\n  <p>为了实现这个产品思路，在硬件“外壳下”，「物外智趣」打造了一套专门适配儿童交互特点的Agent系统，具体包括三大方面交互、记忆和评测。</p>\n  <p>“你怎么衡量一个早教老师，就怎么衡量这个Agent”，王紫崴表示，\"我们本质上是在benchmark一个早教专家的能力。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_20be36d2986b4d598894c187d95c195e@1199336245_oswg580811oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">物外智趣</p>\n  <p>在第一款产品之后，「物外智趣」还将持续围绕儿童成长陪伴场景拓展产品矩阵，覆盖更多场景、更广泛的年龄段，提供更专业的能力。</p>\n  <p><strong>以下硬氪和是王紫崴的交流实录（略经摘编）</strong></p>\n  <p><strong>硬氪：如何用一句话来收敛你们的产品方向？你们的目标用户有什么用户画像？</strong></p>\n  <p><strong>王紫崴：</strong>最近收敛到的方向是「住在生活里的早教助手」。第一代做国内，用户是有3–8岁孩子的家庭。</p>\n  <p>在很多家庭里，父母白天不在，真正长时间陪伴孩子的往往是祖父母和阿姨。祖父母和阿姨当然提供了非常重要的情感陪伴，但在知识广度、复杂问题回答、绘本共读，以及一些新的教育理念和沟通方式上，不同家庭之间差异会非常大。&nbsp;</p>\n  <p>Agent的优势在于更系统地分析海量信息、知识获取更广、回应更稳定，也可以按照孩子的年龄和家庭教育目标持续调整自己的表达方式。从这些维度看，Agent 的能力大概率高于人类平均水平，但一定无法也不应该取代父母。我们的定位是，家长不在时提供认知陪伴，家长在时做辅助角色。</p>\n  <p><strong>硬氪：藏在硬件之下的是你们核心的一套系统，具体如何发挥作用？</strong></p>\n  <p><strong>王紫崴：</strong>主要是交互系统、记忆系统、评测系统。</p>\n  <p>交互系统：儿童AI的第一道门槛，是让孩子把话说完，并真正听懂他想表达什么，解决孩子聊得下去的问题。孩子表达和成人表达不一样，发音和吐字不清晰、会用倒装句、会边想边说，会用大量“这个”“那个”的指代等等，稍一受挫便不愿再开口。</p>\n  <p>记忆系统：记忆是为目标服务的，同样能力、不同目标的人对于记忆的处理逻辑也不一样。</p>\n  <p>我们的目标是早教Agent，需要围绕一个孩子真实的一天去理解他：他被动地听见或看到了什么、他主动地问或记录了什么、他最近反复关注什么，在这些看似零散的信息之间找到关联。更重要的是，孩子是在快速变化的。成人的很多偏好几年都不会改变，但4岁孩子几个月后的语言能力、兴趣点和理解方式就可能完全不同。所以记忆需要随着孩子发展持续更新。</p>\n  <p>评测系统：评测是在构建反馈的闭环，测评Agent与孩子的交互是否有效、给家长的建议是否有针对性、建议有没有真的进入家庭生活，以及在后续时间持续观察孩子和家庭的变化。</p>\n  <p>总结来说，对儿童Agent来说，我们不仅会看他的交互能力，还会看它能不能随着孩子一起成长，真正替家长分担那些持续观察、理解和判断的压力。</p>\n  <p><strong>硬氪：现在市面上很多儿童陪伴类产品，最大的问题是留存率不高，孩子更愿意和音箱或者豆包聊天，你觉得症结是什么？</strong></p>\n  <p><strong>王紫崴：</strong>首先真人永远大于所有产品。留存差的原因可能是因为能力不行。</p>\n  <p>儿童陪伴不是靠角色、IP形象能解决的。</p>\n  <p>很多产品一上来先做角色扮演，或者把表达做得很幼稚，但真正聊起来，回答很冗长、很啰嗦。一般超过50个字孩子就听不下去、打断率极高。孩子其实非常直接，他愿不愿意继续聊，首先看这个AI能不能听懂他、回应得够不够快、说的话他能不能理解、还能不能把下一轮接住。孩子愿意跟豆包聊，是因为豆包能力强。</p>\n  <p>儿童聊天对象的排序，我认为是真人（父母＞祖父母）&gt;豆包&gt;其他。这本质是能力排名。</p>\n  <p><strong>硬氪：可能很多投资人会关心，现在出生率下降，会不会影响儿童市场？</strong></p>\n  <p><strong>王紫崴：</strong>我可以提供两个判断。第一，出生人口再怎么掉，每年新生儿最少也是六七百万，这依然是全球少见的大单体市场。</p>\n  <p>第二，儿童市场不能只看孩子数量，还要看单个家庭愿意为一个孩子投入多少。少子化的另一面，是家庭资源越来越集中到更少的孩子身上。0–3岁中高端细分市场的客单价每年显著上涨，大家以前随便买奶瓶，现在一定买某个品牌，愿意生的人也愿意养，且是「6个口袋养1个小孩」。大家受教育水平上来后购买力直接上升，品牌高端化趋势明显。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜沈祺</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_40c931e73eff43daaee37d638451018c@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>&nbsp;</p>\n  <p class=\"editor-note\">&nbsp;</p>", "category": "tech", "published_at": "2026-10-23T02:41:18+00:00", "fetched_at": "2026-10-23T03:06:38.708035+00:00", "fingerprint": "84bc599a427f0fe2"}, {"source": "36氪 - 最新文章", "title": "产品观察丨前OPPO老兵做了款AI旅行眼鏡，众筹超40万美元", "url": "https://36kr.com/p/4037858588284034?f=rss", "summary": "<p>作者&nbsp;|&nbsp;邱晓芬</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>过去几年，AI眼镜称得上消费电子行业里最跌宕起伏的品类之一。</p>\n  <p>它最初沿着AR方向前进，显示、光波导和空间计算被视为通往下一代计算平台的必经之路，但重量、功耗、成本和量产难度很快构成现实约束。生成式AI兴起后，眼镜又被包装成“随身Agent”和“全天候感知入口”，甚至被赋予替代手机的想象。</p>\n  <p>如今，行业的几条路线仍在同时演进。Meta已经从无显示的拍摄类智能眼镜，进一步推出带显示和腕带交互的Meta Ray-Ban Display；Google也宣布，搭载Gemini的智能眼镜计划于2026年秋季推出。</p>\n  <p>对于资源有限的创业公司而言，一个更现实的问题是：应该追逐一副无所不能的通用眼镜，还是先找到一个用户愿意付费的具体场景？</p>\n  <p>深圳艾普梦光学科技有限公司（下称APOM）旗下智能眼镜品牌L'Atitude 52°N，选择了一条不够宏大、甚至有些逆潮流的路线。他们没有把产品定义成一部“戴在脸上的手机”，而是把它收束为一副面向旅行和户外场景的AI智能墨镜。</p>\n  <p>APOM成立于2024年，核心团队是一群资深手机人。</p>\n  <p>创始人兼CEO&nbsp;Gary&nbsp;在手机行业有近18年的沉淀，他早年从Android研发做起，曾在HTC从事手机软件与系统框架研发。2016年加入一加后，他从研发转向产品和运营，后来负责操作系统相关业务。在一加并入OPPO后，他又负责多品牌软件产品规划，并参与软件、AI等方向的战略研究。</p>\n  <p>公司联合创始人兼CTO郑筱桦，曾担任一加手机及OPPO旗舰机影像研发部门负责人。</p>\n  <p>在硬件赛道浸润多年后，APOM 很清楚一家创业公司当务之急是完成产品验证。据硬氪了解，<strong>L'Atitude 52°N首款眼镜标价＄399起，众筹累计金额已接近40万美元，预计2026年全年备货量约为2万副</strong>，<strong>产品主要面向欧洲和美国市场。目前，该公司正在开放新一轮融资。</strong></p>\n  <p>这组数据意味着，APOM已经获得第一批付费用户，开始从众筹走向小规模商业化。接下来他们仍需证明：一副旅行AI眼镜，能否成为一门持续成立的生意。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_bebdd2c795ad4af1aaea9f970241cfe3@1199336245_oswg71067oswg1080oswg1441_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N获2026年红点设计奖</p>\n  <h3><strong>一群手机人，不想“制造”新品类</strong></h3>\n  <p>长期做手机，让Gary相信AI和多模态交互一定会改变人机关系，却也让他对“创造一个全新品类”保持警惕。</p>\n  <p>“砍字诀”，称得上他们的产品哲学。</p>\n  <p>在L'Atitude 52°N上，他们砍掉了录音、会议转写、语音记事等功能，核心体验集中于第一视角影像、实时翻译和AI导览。</p>\n  <p>同时，他们把大量的精力聚焦在防水、抗跌落、一体注塑前框、眼镜设计和充电盒等大众看来不容易制造“想象力”的部分。</p>\n  <p>这套选择背后，隐藏着APOM创始人Gary一项基本判断：智能眼镜首先应该是传统眼镜的升级，而不是一个等待用户重新适应的全新品类。</p>\n  <p>过往的经验基本印证了这一点。纵观硬件史，大量大众化的智能硬件，往往是在既有品类上完成升级。比如，TWS耳机“剪”掉了连接线，但没有改变人们听音乐的基本方式。在他看来，智能眼镜也一样，新增能力固然重要，但加法造成的每一次基础体验下降——更重、更厚、更脆弱——最终都会被抛弃。</p>\n  <p>既然智能眼镜是传统眼镜的升级，它的产品逻辑就不能完全照搬手机。</p>\n  <p>Gary向硬氪表示，手机是一台通用设备，人们不会因为旅行、跑步或上班而更换不同的手机；眼镜却与脸型、穿搭和使用场景紧密相关。为此，AI眼镜的终局未必会像手机一样，由少数几款通用产品覆盖。对于创业公司来说，机会点不一定是正面挑战Meta和Google，而是先找到一个够扎实、够具体的使用场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_4d0b82897785426cac851c47bae73afe@1199336245_oswg1090805oswg898oswg1026_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N</p>\n  <p>APOM选择的切入点正是欧美的旅行市场。</p>\n  <p>一方面，欧美用户具有更普遍的墨镜佩戴习惯；另一方面，旅行也是智能眼镜便利性更容易被感知的场景——在办公室里，手机、电脑和电源触手可及，眼镜未必提供了不可替代的价值；而到了陌生城市的博物馆、户外路线，用户需要拍摄和理解眼前的事物，也需要与不同语言的人交流，频繁掏出手机反而会打断体验。</p>\n  <p>基于这一判断，APOM的功能优先旅行中所需要的导览、翻译上。</p>\n  <p>Gary告诉硬氪，它想让用户形成的认知是，“出门旅行时，我可以带上它”，而不是，“这是一副功能很多，但功能都不精的AI眼镜”。</p>\n  <h3><strong>设计一套旅行体验闭环</strong></h3>\n  <p>其实，拍照、翻译和AI问答，都不是L'Atitude 52°N独有的功能。它真正试图建立的是一套完整的旅行体验闭环。</p>\n  <p>首先是摄像头。目前，不少AI眼镜上的摄像头主要承担多模态感知的功能，帮助AI看见了用户面前的物体。但一直以来，<strong>影像质量一直没有成为这类产品的核心——受镜架空间限制，智能眼镜很难容纳更大的传感器和复杂光学结构。</strong></p>\n  <p>而L'Atitude 52°N试图走得更远。</p>\n  <p>它不仅搭载了一颗1200万像素摄像头模组，并在常规SoC和图像处理方案之外，增加了一颗<strong>专门的AI影像芯片</strong>。当用户按下眼镜架上的“快门”之后，这颗独立芯片就可以识别场景，对纹理、边缘、噪点、色彩和明暗关系实时优化。</p>\n  <p>Gary&nbsp;告诉硬氪，这颗芯片可以改善旅行中高频出现的建筑、街景、自然风光中的暗光画面，降低录像中的噪点、闪烁和风噪。他们正在尝试将手机行业积累的计算摄影经验，迁移到更小、更受限的眼镜载体上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_377bc141183e4de682da82475731b164@1199336245_oswg985410oswg1080oswg636_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（左为Ray-Ban Meta；右为L'Atitude 52°N）</p>\n  <p>在影像之外，L'Atitude 52°N又围绕“旅行中看见什么”，延伸出AI导览功能。</p>\n  <p>当用户在博物馆、历史街区或城市景点看到一件作品或建筑时，可以轻触镜腿，让眼镜识别眼前对象，再通过开放式扬声器播放讲解。</p>\n  <p>为了避免泛泛的回答，他们还搭建了一个面向艺术作品、历史建筑和文化内容的知识库，通过RAG检索系统与导览Agent组织答案，就像是给眼镜配备了一名AI向导。</p>\n  <p>这名AI向导被命名为Goya，与西班牙著名画家Francisco Goya同名。它不只是回答“这是什么”，还会解释一件作品为何诞生，以及它为何值得被看见。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_e916df63c0ba47e9a87152e46cb8f618@1199336245_oswg771877oswg1080oswg704_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N</p>\n  <p>如果说AI导览解决的是旅行者如何理解眼前的作品、建筑和城市，那么实时翻译处理的，是用户进入陌生环境后更具体的人际交流——在餐厅点餐、街头问路或办理入住时，语言障碍往往并不复杂，却会直接影响一段旅程是否顺畅。</p>\n  <p>为此，L'Atitude 52°N通过五麦克风阵列采集佩戴者、交谈对象和环境声音，并自研了人声分离与环境降噪算法，减少嘈杂环境中无关声音被误识别的情况。</p>\n  <p>在获得较为清晰的语音后，系统还将通过新自研的音频压缩算法搭配谷歌最新的Gemini 3.5 Live Translate语音模型，进行实时流式处理。区别于过往的翻译模式，它会结合上下文调整词义和表达，尽量减少机械的逐字转换，让翻译效果更符合实际对话习惯。</p>\n  <p><strong>影像、导览、翻译，由此形成一条完整的旅行体验链路：用户看到眼前的世界，用第一视角记录；遇到陌生事物时，可以让AI解释；面对语言不同的人，则通过耳边翻译完成交流。</strong></p>\n  <p>不过，为了让眼镜进一步适配户外旅游场景，L'Atitude 52°N还做了更多有意思的尝试。比如，他们还把对讲功能做进小小的眼镜挂绳，让多名同行者可以自动组网，在手机信号较弱的环境中保持联系。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_8e672b18add944a386b3cfc3a80d65ee@1199336245_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N</p>\n  <p>用起来也很简单，只要将挂绳两端扣入镜腿末端的圆环，内置感应装置便会自动唤醒，并与眼镜完成配对，整个过程无需手动开机，也不需要手动搜索眼镜设备。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_828e6836130348d5bd9a948a33524118@1199336245_oswg606307oswg1080oswg834_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N</p>\n  <p>另外，他们还把可靠性纳入产品定义。眼镜按照约1.8米抗跌落和IP65防尘防水设计，前框还采用了一体注塑工艺，大大减少拼接和潜在进水点。</p>\n  <p>其实，这些能力单独抽出来看，似乎都未必构成压倒性的壁垒，但当独立AI影像芯片、垂直导览、翻译和户外性能围绕旅行场景组合成闭环，产品才慢慢开始形成辨识度。</p>\n  <h3><strong>着眼小处</strong></h3>\n  <p>当一支手机背景出身的团队要做专业的AI眼镜，Gary坦承，他们需要补齐传统眼镜行业对风格、脸型和佩戴的理解。</p>\n  <p>Gary&nbsp;多次前往德国，遍寻拥有约多年传统眼镜行业经验的从业者。经过多次沟通，团队逐渐形成跨行业分工：德国和意大利团队负责风格、审美和传统佩戴经验，深圳团队负责电子系统、结构工程、软件与量产。</p>\n  <p>不同团队的判断标准时常发生碰撞。欧洲团队认为部分镜框过粗、颜色不够自然；深圳团队则必须为摄像头、电池和电路留出空间。双方需要解决的，不是抽象的“好不好看”，而是如何在电子器件、结构强度和镜框比例之间取得平衡。</p>\n  <p>为此，团队先后制作近百款原型，并结合欧洲用户试戴反馈，最终筛选出Berlin、Antwerp和Milan三种框型。</p>\n  <p>解决镜框的外形和佩戴，只完成了设计的一半。既然L'Atitude 52°N被定义为一件旅行装备，那么用户如何收纳它、如何在旅途中为它充电，同样属于产品体验的一部分。所以，L'Atitude 52°N的设计因此没有停在镜框上，而是继续延伸到了眼镜盒上。</p>\n  <p>过去几十年，眼镜盒常常只是一个容易被忽略的包装配件。但智能眼镜不同。它包含精密的电子元器件，需要充电，也比普通眼镜更需要应对挤压、碰撞和潮湿。因此，充电盒不应只是一个用完即被忽略的容器。<strong>它既要为眼镜充电，也要在移动途中提供可靠保护，也应该延续产品本身的设计语言。</strong></p>\n  <p>所以，L'Atitude 52°N设计了一个透明的外壳——这不只是造型选择，也承担信息显示功能：用户不必开盖，就能看到眼镜的充电状态；拿起盒子摇一摇，还能了解盒内剩余电量。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_2a839d1c6d23454a973ee1ab334927e2@1199336245_oswg83653oswg1080oswg1441_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">L'Atitude 52°N</p>\n  <p>&nbsp;Gary&nbsp;告诉硬氪，它的灵感来自便当盒，就算不打开盖子，也能知道里面装的是鸡腿饭还是排骨饭。</p>\n  <p>眼镜盒上没有独立按钮，当眼镜放入盒中时，内部灯光会亮起，直接告诉用户设备已经开始充电。这项交互的灵感来自一款《鱿鱼游戏》主题交通卡：刷卡成功后，卡面人物的眼睛会亮起。</p>\n  <p>现在，L'Atitude 52°N已经走到从众筹转向零售的阶段。接近40万美元的众筹，为他们提供了第一批付费用户。</p>\n  <p>可以确定的是，未来AI眼镜的竞争不会只发生在模型、芯片和参数表上。当所有技术都被装进镜框，真正决定产品能否留下来的，仍是几个最朴素的问题：人们是否愿意佩戴，会不会重复使用，又是否愿意为它付费。</p>\n  <p>L'Atitude 52°N选择从旅行切入，用影像、导览和翻译回答一个具体需求。这条路不会比“手机的下一代终端”的故事更宏大，却会更接近一件消费产品的起点。</p>\n  <p><strong>首页图源｜企业供图</strong></p>\n  <p><strong>排版｜沈祺</strong></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_09cafe1fc4334fb1aa3ba9fcf148425c@1199336245_oswg53621oswg1080oswg337_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">欢迎交流</p>\n  <p>&nbsp;</p>", "category": "tech", "published_at": "2026-10-23T02:43:56+00:00", "fetched_at": "2026-10-23T03:06:38.708027+00:00", "fingerprint": "45a949fcd838a56e"}, {"source": "36氪 - 最新文章", "title": "36氪首发丨金属3D打印企业完成数千万元融资，已交付商业航天领域头部客户", "url": "https://36kr.com/p/4037865194623878?f=rss", "summary": "<p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_0f7bdcf168814db580c73dc3e92d920d@5920579_oswg1043472oswg1410oswg993_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">&nbsp;</p>\n  <blockquote>\n   <p>本文约2500字，建议阅读5分钟</p>\n  </blockquote>\n  <p>作者&nbsp;|&nbsp;乔钰杰</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>硬氪获悉，增材制造结构件与专用材料供应商九河先进科学技术（北京）有限公司（以下简称“九河公司”）宣布完成数千万元Pre-A+轮融资。本轮融资由株洲北斗时空产业基金独家投资。</p>\n  <p>九河公司成立于2024年，以材料科学技术为核心，面向航空航天、核聚变、低空经济、人形机器人等高端制造领域，提供高性能增材制造（3D打印）结构件、专用材料及相关解决方案。九河公司创始人夏天博士是中国增材制造产业联盟青年专家委员、中国激光制造技术与产业创新联盟理事，长期从事材料成分设计、性能调控、增材制造产业研究与投资工作。</p>\n  <p>夏天向硬氪介绍，随着金属3D打印产业逐步走向成熟，行业需求正从“能打印”转向“打得快、打得好、打得便宜”。相应地，产业竞争也在从早期以设备和打印工艺为主导，转向材料、工艺与成形能力的协同优化，材料技术正在成为影响增材制造成本与产品性能的关键胜负手。</p>\n  <p>对金属增材的材料全流程处理，包括合金熔炼、雾化制粉、3D打印、热处理四个主要环节，每个环节的温度、熔池尺寸和冷却速度都可能影响最终性能。</p>\n  <p>夏天表示，3D打印从母合金到制粉再到打印，同时涉及大熔池缓慢凝固和小熔池急速凝固，并且这些状态交叉出现。如果只基于打印时的小熔池急速凝固来设计材料，可能导致制粉和母合金环节出问题；但最终组织又确实取决于打印环节，因此，材料成分设计必须兼顾全流程，而非单独优化某一道工序。</p>\n  <p>围绕这一问题，九河公司将材料设计与工艺成形控制结合起来。</p>\n  <p>在材料端，公司能够基于微小熔池快速凝固的特点，建立元素分布、相结构、裂纹敏感性与力学性能之间的关联模型，并借助AI增强的材料计算技术，对合金成分进行多目标优化。随后，通过小批量实验制备与性能表征，逐步验证并确定目标成分。</p>\n  <p>在组织性能调控方面，公司能够结合材料本身的特性及增材制造中的晶粒、物相特征，预测粉末颗粒、激光熔池和最终构件的组织状态，再通过粉末组织设计、凝固组织调控，以及热等静压和热处理工艺优化，使材料内部组织更好地匹配最终应用需求。</p>\n  <p>针对金属3D打印中常见的开裂问题，九河公司研发的低成本高强度可打印铝合金，可做到在没有稀土元素的情况下，兼顾强度和低成本，实现超500MPa的屈服强度，材料价格仅为每公斤百余元。其技术思路是在铝合金中设计特殊的原位自生纳米颗粒，并通过工艺控制，使这些颗粒能够在熔融铝中稳定存在数十分钟至约一小时。公司据此协调熔炼、制粉等环节的工艺时间，确保材料在打印过程中能够通过纳米颗粒的溶解与再析出，改善组织状态，降低开裂风险。</p>\n  <p>除材料设计外，九河公司也将工艺成形控制作为另一项核心能力。公司通过构建微观组织、熔池结构与构件性能之间的跨尺度仿真模型，预测并优化打印参数，以减少孔隙、裂纹等缺陷；同时，利用应力控制与防变形技术，调节构件内部残余应力及其分布，提升最终成形精度，并通过精细结构打印与复杂结构整体制造技术，满足高端制造对复杂构件的要求。</p>\n  <p>在商业航天领域，这些能力已应用于多类关键结构件。</p>\n  <p>液体火箭发动机涡轮泵壳体方面，九河公司采用整体成形技术，并通过低应力成形方案控制构件的应力分布与成形精度。对于液体火箭发动机闭式叶轮，公司实现了无支撑打印，流道内部无需设置支撑结构，支撑量较常规成形方案减少96%。公司还称，通过对材料组织的调控，产品消除了针状相等不利组织特征，低温环境下（-196℃）的断后伸长率提高约50%，达到相关指标要求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_2a1dea6a6000458681d61499f294cbfd@5920579_oswg202769oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_0c73deeb80704197b5d3f683d4f8f423@5920579_oswg241801oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261023/v2_2d56eceac3fb43d39b533b23f28271fc@5920579_oswg249758oswg1080oswg608_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">（图源/企业）</p>\n  <p>此外，公司的霍尔推进压力流量调节器已实现轨道运行。针对这类零部件内部的精细流道，公司开发了精细流道抛光技术，可处理细至1mm的流道，并将内径尺寸控制在±0.1mm以内。</p>\n  <p>目前，九河公司已完成商业航天领域头部客户的验证，并成为数家头部商业航天企业部分关键产品的独家供应商。未来，公司计划进一步拓展低空经济、核聚变、人形机器人等领域，为相关场景提供关键结构件及材料解决方案。</p>\n  <p><strong>以下为创始人问答：</strong></p>\n  <p><strong>硬氪：公司提到正在开发增材制造AI智能体，它在材料设计和产品制造中具体发挥什么作用？</strong></p>\n  <p><strong>夏天：</strong>在材料研发过程中，我们会积累大量数据，包括材料内部组织、力学性能，以及不同工艺条件下的实验和制造数据。这些数据可以为AI模型提供基础。我们希望AI未来能够基于积累的材料和工艺数据，实现接近熔池级别的打印参数优化，实现提高性能、降低成本的目的。另一方面，在产品制造和交付过程中，我们还会检测每个零部件的化学成分、力学性能和变形量等指标。这些检测数据，可以持续修正模型，帮助我们更准确地理解材料性能与工艺之间的关系，实现快速研发新型合金材料并确定工艺参数。</p>\n  <p><strong>硬氪：公司在商业航天领域交付的结构件都具备较高的性能指标。相比其他增材制造企业，九河先进的核心优势是什么？</strong></p>\n  <p><strong>夏天：</strong>我认为主要有三个方面。</p>\n  <p>第一是复杂结构的整体成形能力。3D打印相比传统铸造已经减少了很多焊接需求，但一些结构特别复杂的零部件，仍然需要分体打印后再进行焊接。我们希望尽可能避免焊接，让零部件实现整体成形，从而减少连接环节带来的限制。</p>\n  <p>第二是大尺寸薄壁件的形状控制能力。传统机加工主要依靠设备精度保证尺寸，但3D打印涉及材料熔化和重新凝固，设备精度只是其中一个因素。材料在凝固过程中如何形成内部应力、应力如何分布，都会影响零部件最终的尺寸精度。</p>\n  <p>我们对材料的组织控制能力，帮助我们更好地控制这些变量。在一些大尺寸零部件的关键尺寸上，我们已经通过实际案例实现了精度提升，部分情况下能够达到数倍甚至一至两个数量级的改善。</p>\n  <p>第三是兼顾效率与精度的复杂零部件打印能力。一些精密零部件对细小结构和表面质量的要求很高，尽管使用更细的粉末和更小的打印光斑可以提高精度，但打印效率也会明显下降。对于商业航天等需要兼顾成本和交付效率的领域，我们能在不显著牺牲打印效率的前提下，实现相对精密的成形，并将这类零部件真正交付给客户。</p>\n  <p>这三项能力表面上看是工艺优势，但背后离不开材料技术。只有理解材料在熔化、凝固和热处理过程中的复杂变化，并能够控制材料内部组织和应力分布，才能进一步控制零部件的最终形状、尺寸与性能。对我们来说，材料设计不是打印之前的一道独立工序，而是贯穿整个增材制造过程的基础。</p>", "category": "tech", "published_at": "2026-10-23T02:50:11+00:00", "fetched_at": "2026-10-23T03:06:38.708012+00:00", "fingerprint": "19702aa25a1c2e52"}, {"source": "少数派", "title": "终于吃到了那颗梦寐以求的 洲央行 (frankfurter.app)</div>", "category": "rate", "published_at": null, "fetched_at": "2026-10-23T03:06:35.485728+00:00", "fingerprint": "3ad93a24b32a272c"}, {"source": "The Guardian - World", "title": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "url": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "summary": "<p>Flights to third countries where the detainees have no ties are scheduled as early as Wednesday, relatives detail</p><ul><li><p><a href=\"https://www.theguardian.com/us-news/2026/oct/15/immigration-trump-midterms-reader-q-a\">Send us your questions about immigration and the midterms</a></p></li></ul><p>Relatives of gravely ill detainees at two <a href=\"https://www.theguardian.com/us-news/florida\">Florida</a> <a href=\"https://www.theguardian.com/us-news/usimmigration\">immigration</a> jails say authorities are about to deport their loved ones to unknown countries in Africa despite worsening medical conditions.</p><p>Flights are scheduled as early as Wednesday, according to the families and the immigration advocacy group the Workers Circle, which has been monitoring conditions and speaking with detainees inside two <a href=\"https://www.theguardian.com/us-news/ice-us-immigration-and-customs-enforcement\">Immigration and Customs Enforcement (ICE)</a> facilities in south Florida.</p> <a href=\"https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida\">Continue reading...</a>", "category": "politics", "published_at": "2026-10-21T13:40:08+00:00", "fetched_at": "2026-10-22T03:02:34.307010+00:00", "fingerprint": "6a97ce52b9519b9d"}, {"source": "The Guardian - World", "title": "Controversial US-backed vaccine trial in African newborns halted", "url": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "summary": "<p>Hepatitis B study in Guinea-Bissau that was to be funded by CDC and that dre ig promises to Tesla owners about unsupervised autonomous driving and the ability to add their own vehicles to the company's robotaxi fleet. During today's third-quarter earnings call, the company finally gave itself a deadline. According to Tesla VP for Autonomous Driving Ashok Elluswamy, Tesla owners will be able [&#8230;]", "category": "tech", "published_at": "2026-10-21T23:36:31+00:00", "fetched_at": "2026-10-22T03:02:33.028518+00:00", "fingerprint": "e49b804aa4fbcb21"}, {"source": "The Verge", "title": "YouTube says it isn’t testing hiding the dislike button", "url": "https://www.theverge.com/streaming/1016206/youtube-dislike-button-videos", "summary": "On Tuesday, I published a story about how YouTube appeared to be testing hiding the dislike button on videos, with at least two users on X sharing screenshots of the dislike button moved into the three-dot menu. But a YouTube spokesperson, in a Wednesday statement to The Verge, confirmed that YouTube is \"not testing hiding [&#8230;]", "category": "tech", "published_at": "2026-10-21T23:46:45+00:00", "fetched_at": "2026-10-22T03:02:33.028503+00:00", "fingerprint": "1a23f2bd44d0b65b"}, {"source": "36氪 - 最新文章", "title": "李泽湘系团队做了款贴在手机背后的墨水屏Agent，获祥峰、五源、源码等投资｜硬氪首发", "url": "https://36kr.com/p/4034229489701764?f=rss", "summary": "<p>作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>硬氪获悉，「Flowtica AI」日前已完成新一轮数千万元融资，投资方为祥峰资本、源码资本、五源资本、清水湾基金。山与资本担任独家财务顾问。</p>\n  <p>过去两年，AI硬件赛道经历了一轮密集的产品迭代。录音卡、翻译耳机、AI眼镜等，几乎每一个能够被大模型增强的物理形态，都有团队在尝试。</p>\n  <p>而一个尴尬的事实是：AI的能力边界在快速扩张，但普通用户调动它的效率并没有同步提升。用户依然需要主动打开App、输入指令、复制粘贴结果。AI在云端飞速进化，但落到真实工作流里，仍然隔着一段很长的操作路径。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_dc8303dbed7748ae9038869f6c866db7@6022551_oswg107202oswg873oswg900_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Codex+ChatGPT Work周活跃用户增长曲线（图源/Open AI公开数据整理）</p>\n  <p>Flowtica最早切入的，正是这段路径里最具体的一环——快速录音。2025年，Flowtica发布了首款AI录音笔产品Scribe，海外众筹超百万元，于2026年初完成发货并常态化销售。</p>\n  <p>官方数据显示，自Scribe发货以来，有42%的硬件激活用户转化为Flowtica的订阅付费用户。这款产品验证了一件事：用户愿意为会话信息的捕获与整理付费，尤其当AI不止能完成转写，还可以进一步输出结构化纪要、拆解可执行待办。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_06a9582c027a4e1791e2bf356e808f8e@6022551_oswg1652701oswg1454oswg996_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Flowtica首款产品，AI录音笔Scribe（图源/企业）</p>\n  <p>但Scribe也让团队看到了一个上限，“录音结束，产品的任务就到此为止——这是市场上绝大多数同类产品的终点。但我们发现，对用户来说，记录只是整个工作流程的开端。”Rian告诉硬氪。</p>\n  <p>一条会议录音变成了一份纪要，而接下来的待办拆解、日程同步、跟进邮件的草拟等繁复动作，用户仍然需要手动完成。</p>\n  <p>“模型能力越变越强，但用户与之交互的方式还停留在上一个时代。”在Rian看来，AI硬件的机会，不在于把一堆新功能封装进硬件外壳，而是能主动出现在用户的工作流里。“用户需要的不是一个需要反复唤醒的工具，而是一个能够记录、梳理，并推动事项落地的AI。”</p>\n  <p>这正是Flowtica团队捕捉到的市场空白：让AI从需要被反复交代的工具，变成能够稳稳地接住用户需求的智能助手。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_1cd99d3c837543f8bc7ebc5c2031b796@6022551_oswg1123978oswg1454oswg841_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Verso产品图（图源/企业）</p>\n  <p>Flowtica创始人Rian毕业于香港科技大学，师从李泽湘教授，拥有计算机视觉与3D方向学术背景。他拥有十余年的硬件创业经历，曾从主导全球首款智能手机手持云台Vimble的研发与量产、农业AI分拣机器人，团队在机器视觉与边缘AI领域积累了完整的工程方法论。</p>\n  <p>2024年，随着大模型能力开始向终端设备外溢，Rian判断，AI硬件将迎来一轮结构性机会，他成立Flowtica，尝试通过硬件载体实现AI应用深度落地，做下一代AI原生个人硬件与Agent系统。团队带着Scribe积累的供应链能力和对用户场景的理解，开始定义第二款硬件产品Verso。</p>\n  <p>Verso是一款厚度6.5mm、仅重78g的磁吸式墨水屏Agent硬件。其正面搭载一块常显电子墨水屏，机身配备独立实体交互按键与Type-C充电接口，内置4麦克风阵列与骨传导传感器。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_f5b0298eff8b46c089e6ec6339b64d15@6022551_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">Verso重量参数（图源/企业）</p>\n  <p>过去十年，消费电子行业默认了一个方向：功能越多、屏幕越炫、参数越强，产品就越有竞争力。但这套逻辑在AI硬件上并不成立。用户面对一块功能密集的屏幕，注意力被不断切割；每一次解锁手机查看通知，都可能陷入分心的信息海洋。</p>\n  <p>Flowtica 团队在定义产品之初，并没有将追求极致轻薄作为首要目标，而是基于用户真实使用体验权衡取舍。比如多保留0.5mm的机身厚度，换取通用Type‑C接口与额外20小时续航。这类选择在参数表上貌似不讨巧，却直接决定用户长期使用的舒适度。</p>\n  <p>同样的思路也延伸到了产品功能层面。市面上已经不缺能处理会议的AI工具，录音、转写、摘要，这些能力正在变成标配。但团队认为，真正缺位的不是“如何让会议更智能”，而是如何服务那些会议密度极高的人，帮用户管理注意力和精力，而不是往其信息流中塞更多无效内容。</p>\n  <p>Verso被设计为一块“主动降噪”的副屏，常显墨水屏让用户“一眼即得”，无需点亮手机，就能掌握当下的日程、核心待办与AI提炼的关键信息。</p>\n  <p>“我们不是在做一块更吸睛的屏幕，我们是在做一块更安静的屏幕。这种交互方式可以更好地保护用户专注力，让其保持在心流状态中。”Rian告诉硬氪，“AI硬件的价值不在于让用户做更多事，而在于帮用户少做无关的事。”</p>\n  <p>为了适应高频、碎片化场景，Verso也在ID设计上做了一次反常规的取舍。产品结构采用非对称屏幕布局与侧边实体按键。当用户在通话时，即使单手握住手机的同时，食指也能自然地落在侧边台阶处的录音键，盲操录音。当正面转过来开始阅读时，拇指也能舒适地落在“Ask AI”键上，随时提问与记录。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_8c9eb8043b0c43aca950b60c5d837346@6022551_oswg1173701oswg1206oswg980_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Verso按键设计（图源/企业）</p>\n  <p>但硬件只是入口。Flowtica Verso更精准的定位，是一个以硬件为载体的个人上下文操作系统（Personal Context OS），围绕Memory、Attention、Workflow Closure三个层面构建完整闭环。</p>\n  <p>Memory层解决的是“记住什么”。云端共享大脑把会议、日程、待办、邮件、文档串成一条连续的个人长期记忆，而非停留在一次性转写。信息不再随会议结束而散落，而是沉淀为可随时调取、可跨场景复用的上下文资产。</p>\n  <p>Attention层解决的是“不被打断”。常显墨水屏、磁吸形态与实体盲操的组合，本质是一套注意力降噪系统——用户无需解锁手机、无需跳入信息流，只需一瞥或一按，就能拿到当下最需要的信息，让注意力保持在心流里，而不是被通知切碎。</p>\n  <p>Workflow层解决的是“事情真正做完”。从会前Brief、会中标记，到会后Action Items与跟进草稿，系统把“记录”推进到“执行”，形成工作流的完整闭环。会议结束不是终点，而是下一步行动的起点。</p>\n  <p>三层叠加，Verso才真正成为“Agent硬件”，它不只是拾音与转写的工具，而是一个拥有个人上下文感知能力、可主动执行闭环任务的随身Agent实体入口。</p>\n  <p>而不同硬件形态，解决的是现实世界里不一样的信息捕获场景，其背后是基于Flowtica自主研发的Cloud-First云端大脑。</p>\n  <p>Flowtica选择把笔、屏和多端软件放进同一套协同框架里，在工作流上实现多端打通，短期看，既构成了“一脑多终端”的办公产品矩阵；长期看，则是在争夺用户办公信息的入口，进而统一沉淀成可复用的个人资产。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261020/v2_ed902b59c1864031a250521621581eac@6022551_oswg3041702oswg2560oswg1280_img_png?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">Flowtica产品矩阵（图源/企业）</p>\n  <p>Rian告诉硬氪，“录音转写、摘要生成这些能力，正在变成基础设施。单点功能的竞争会迅速同质化，真正拉开差距的，在于谁能把分散的信息串成一条连续的线，并且让这条线随着使用时间的增加越来越有价值。”</p>\n  <p>这句话背后，是Flowtica对产品边界的重新划定。单款硬件只能覆盖工作流中的一个片段，而公司目标远不局限于做出一款好用的录音设备，而是搭建一套覆盖“记录—整理—执行”全链路的办公生态。</p>\n  <p>Rian进一步指出了一个被行业普遍忽视的体验摩擦，“当下AI能力本身已经不再稀缺，工具看似在提效，但用户每次打开一个AI工具，都要告诉它你是谁、你在做什么、你关心什么。行业不缺智能能力，缺的是上下文的连续性。我们做硬件，就是想让AI能更直达地进入用户的上下文，不需要反复解释。从Scribe录音笔到Verso卡片，再到Apple Watch和Mac，我们在构建的是一个多端生态——在任何场景下，都有一个离你最近的入口，让AI无缝地接住你的上下文。”</p>\n  <p>据Flowtica透露，Verso自9月在德国IFA正式宣发后，反响热烈，本周已开启定金预收，首批量产产品将于12月正式出货，核心用户瞄准在企业管理者、高强度知识工作者，以及有专注需求（如ADHD）的人群。</p>\n  <p><strong>以下为硬氪与Flowtica创始人Rian的访谈节选（略经编辑）：</strong></p>\n  <p><strong>硬氪：语音交互已经成为AI硬件的标配，为什么Flowtica还要在硬件上保留一块墨水屏？视觉在这个产品形态里解决了什么问题？</strong></p>\n  <p><strong>Rian：</strong>&nbsp;语音是最高效的输入方式，但它不是高效的输出方式。</p>\n  <p>我们在产品定义阶段做过一个很具体的推演，如果Agent用语音给你回一段50字的内容，可能需要30秒才能听完。同样一段信息呈现在屏幕上，你扫一眼就完成了。语音的线性特征决定了它无法被快速浏览、无法被跳读、无法被结构化呈现。用户需要的是“知道什么重要”，而不是“听完所有内容”。</p>\n  <p>所以我们的判断是，语音负责输入和指令，视觉负责呈现和决策。Agent给出会议纪要、待办拆解、日程准备时，最适合的载体不是语音播报，而是一块能快速扫读的屏幕。</p>\n  <p>选择墨水屏而不是常规彩色屏，同样基于这个逻辑。手机屏幕的信息过载本身就是问题的一部分——用户每解锁一次手机，就可能被通知、消息、社交应用带离当前任务。墨水屏常显、低刷新、不打扰，它的设计目标不是吸引注意力，而是减少注意力消耗。用户瞥一眼就能掌握日程和关键待办，不需要进入手机的信息流。</p>\n  <p>这背后是一个更底层的产品判断：Agent硬件的价值不是替代手机，而是在手机之外提供一个更低干扰、更高直达性的信息入口。语音解决“随手记录和下达指令”，视觉解决“快速理解和做出判断”，两者缺一不可。只做录音和语音交互，产品就退化成录音卡；加上视觉和主动呈现，它才具备Agent硬件应有的交互完整性。</p>\n  <p><strong>硬氪：很多创业公司担心自身产品能力会随着大模型发展逐渐被吃掉。你们怎么判断哪些能力是可持续的，哪些只是过渡性的？</strong></p>\n  <p><strong>Rian：</strong>&nbsp;我们内部有一个判断标准，如果一项能力的价值随模型变强而缩小，它就不适合作为长期壁垒。</p>\n  <p>过去很多创业公司做的是“补模型短板”的生意，比如上下文不够长就做压缩，输出不够结构化就做后处理接口，不会调用工具就做一层编排中间件。这些能力在特定阶段有价值，但本质是在填补模型能力与用户需求之间的临时断层。模型每升级一次，断层就收窄一次。</p>\n  <p>我认为可持续的能力有两类。第一类是与场景深度绑定的用户数据资产。模型是通用的，用户是个性化的。同一个会议，不同的人关注重点不同、表达习惯不同、决策链路不同。这些差异不会因为模型变强而消失，反而需要更强的模型才能被充分理解。我们的Memory系统记录的不只是会议内容，还有行为模式、关注偏好和任务推进习惯。模型越强，这些数据的价值越大。</p>\n  <p>第二类是产品层的交互定义与场景编排。模型提供通用能力，但“在什么时机、以什么方式介入用户的工作流”是产品层的问题。同样一个会议结束，Agent该主动弹出待办拆解，还是等用户开口问？这些判断不取决于模型能力，而取决于对用户场景的理解。</p>\n  <p>此外，合规与数据基础设施也是容易被低估的壁垒。我们从去年开始，就在推进各项数据合规，这类能力不是模型能解决的，需要时间、流程和持续投入，一旦建立就是长期的信任壁垒。</p>\n  <p>所以我们不做“补模型短板”的中间层，而是做“放大模型能力”的场景层。前者的价值随模型增强而衰减，后者的价值随模型增强而增长。</p>", "category": "tech", "published_at": "2026-10-21T03:03:55+00:00", "fetched_at": "2026-10-22T03:02:32.879258+00:00", "fingerprint": "2c64a7c43b4564f5"}, {"source": "36氪 - 最新文章", "title": "AI时代，银龄生活更要看到“人”的价值", "url": "https://36kr.com/p/4035048202359685?f=rss", "summary": "<p>10月17日，重阳节前夕，贝壳公益与《人物》杂志在京举办“新世界，老朋友——银龄生活主题沙龙”，并发布双方共同打造的同名别册《新世界，老朋友——AI时代银龄生活观察》。</p>\n  <p>沙龙现场邀请戴军、胡泳、张越、曹翠芬、汤拥华、董晨宇、詹青云、庞颖来自不同行业、不同代际的8位嘉宾，围绕AI浪潮下的老去图景展开讨论。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_a4eb7c194ff64c28a9a1259202c9abaf@337187376_oswg996942oswg1267oswg845_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">沙龙现场</p>\n  <p>人物天下CEO张寒在致辞中表示，技术正深刻冲击老年生活，《人物》持续观察老龄化趋势、记录个体体验与微小进步，希望通过沙龙继续多元视角讨论老龄社会真问题，寻找技术之下人性的肌理与本质。</p>\n  <p>贝壳集团副总裁、贝壳公益基金会执行理事长贾生平在开场致辞中表示，过去一年，贝壳公益社区助老项目中的长者纷纷主动学习AI等新科技、新工具，尝试走进“新世界”；贝壳公益“独居守护计划”中安装的智能设备，也在独居老人居家安全中发挥重要作用。但一线公益现场的经验告诉我们，科技能让守护更及时、长者生活更便利，却替代不了人的参与。</p>\n  <p>著名表演艺术家、一级演员曹翠芬与著名主持人张越围绕“新世界，老朋友，新可能”展开对谈。对谈中，82岁的“国民祖母”曹翠芬表示，步入老年之后，她和老伴住进养老院，自那时起，她学习了用手机购物，“真是要活到老学到老”。今年曹翠芬第一次接触到机器人，她说，当自己到了端一杯茶都有困难的时候，她更愿意让一个能保护隐私的机器人作为看护。毕竟在养老照护中，最重要的是维护人的尊严。&nbsp;</p>\n  <p>张越也呼吁：“老觉得AI的发展不那么理直气壮，唯一在养老领域拜托AI，理直气壮地快速发展吧！”因为未来中国老龄化社会来临，年轻人少，老人多，忙不过来，我们就是需要机器人、机器手来帮忙。</p>\n  <p>歌手、主持人戴军以《和老朋友在新世界疯玩》为题分享。他提到，重新被年轻人喜爱，靠的不是技巧，而是保持科技时代所稀缺的真实与“活人感”。面对老去，他始终保持积极心态：“岁月可以拿走速度，却拿不走我们对生活的期待。”</p>\n  <p>北京大学新闻与传播学院教授胡泳以《科技养老是一场幻梦吗？》为题做了演讲，他提出了“照护冰山论”：技术只是在照护这座冰山的水面之上做文章，真正决定照护质量的，是人与人之间难以被复制的时间与关系。技术应被定位为照护体系的支持性工具。</p>\n  <p>贝壳公益与《人物》杂志同日发布的《新世界，老朋友——AI时代银龄生活观察》别册基于前期大量用户征集、专家与行业人物深度访谈，多层次呈现新老朋友进入“新世界”时的欣喜、麻烦与思考。</p>\n  <p>别册中，不同代际的人以亲身经历讲述：新科技高效解决了各自的问题，但麻烦与困惑也相伴而生。一方面，AI让有一定基础的老人体验到便利，也让他们陷入难以分辨真假的困扰；另一方面，在更广泛的老年群体中，仍有大量长者被数字鸿沟阻隔，面对智能设备手足无措。一位常年帮老人修手机的维修店主在别册中表示：“子女都能给买最新的智能手机，不是差钱的事，是差耐心和陪伴。”</p>\n  <p>有长期照护经历的北大教授胡泳在文章中强调，真正决定照护质量的，始终是人与人之间难以被复制的时间与关系；研究老年社会福利与老年精神健康的深圳大学政府管理学院社会学系教授唐咏则提示，绝大多数老年人不想只成为被服务者，也渴望服务别人、被认可。</p>\n  <p>议题发起方贝壳公益与《人物》在别册中呼吁：“愿我们老去的那一天，拥有的不只是让生活更方便的新技术，还有一份独属于人类的、叫作‘爱’的东西。”</p>\n  <p>过去8年，贝壳公益始终在社区一线扎实开展助老公益项目。面对加速到来的老龄化社会与快速迭代的技术浪潮，贝壳公益以“科技+人文”为路径，用科技赋能人，让人更有力量守护人。</p>\n  <p>自2018年起，依托全国门店网络与经纪人志愿者体系，贝壳公益从“我来教您用手机”社区公益课堂起步，逐步拓展至“我来教您防跌倒”课堂。2025年，又陆续发起“稳当当计划”和“独居守护计划”。</p>\n  <p>截至2026年9月，“我来教您用手机”已走进142座城市，开设约13万节课堂，服务超182万人次；“我来教您防跌倒”开设10332节课堂，服务超22万人次；“稳当当计划”在北京48个社区完成1682个单元施工改造，并落地上海，首批在4个社区完成阶段性改造，为46个楼道安装靠墙扶手与防滑警示条；“独居守护计划”在北京、天津、上海三地部署超3500台智能设备，提供7×24小时值守响应。</p>", "category": "tech", "published_at": "2026-10-21T04:21:05+00:00", "fetched_at": "2026-10-22T03:02:32.879252+00:00", "fingerprint": "6bfa6ebe2c1dd940"}, {"source": "36氪 - 最新文章", "title": "为什么澳网重押中国市场？", "url": "https://36kr.com/p/4035301769728900?f=rss", "summary": "<p><strong>作者 谢芸子</strong></p>\n  <p><strong>编辑 张帆</strong></p>\n  <p>10月11日，在中网女单决赛上，郑钦文一记发球直接得分，最终击败俄罗斯新星安德列娃，在家门口捧起冠军奖杯——这也是中网创办以来，中国球员第一次在主场夺冠。</p>\n  <p>中国网球的高光时刻，正越来越多地发生在主场。但在绝大部分“网球人”的集体记忆中，中国网球的起点仍来自2014年。在那一年，李娜在墨尔本公园捧起澳网冠军奖杯，成为亚洲首位澳网单打冠军。澳网也由此成了中国球迷心中的“福地”。</p>\n  <p>现如今，这块“福地”正把越来越多的重头戏搬到中国。</p>\n  <p>今年10月，澳网自创赛事“一分大满贯”落地中国，预选赛将覆盖杭州、北京、上海、深圳、成都五城，中国区冠军将直通墨尔本公园，在2027澳网开幕周出战全球总决赛，角逐100万澳元奖金。目前，中国是除澳洲本土之外，唯一落地这项赛事的国际市场。</p>\n  <p>近日，36氪专访了澳大利亚网球协会合作伙伴及国际业务总监罗迪·坎贝尔（Roddy Campbell）。以下是对话实录，经编辑整理。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_ef4490eb309a4f61a8494fb0d43145cf@394564713_oswg2733662oswg3713oswg2089_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">澳大利亚网球协会合作伙伴及国际业务总监罗迪·坎贝尔</p>\n  <p><strong>36氪：中国网球有哪些关键时刻让你印象最深？</strong></p>\n  <p><strong>Roddy Campbell：</strong>当然是李娜澳网夺冠，还有2024年郑钦文打进澳网决赛——那一年我们在中国的观众翻了一倍，此后一直保持在高位，郑钦文的职业生涯也一路高歌猛进。</p>\n  <p>但印象深的不只是某一两个最高光的瞬间。我们在中国有近十年的本地团队，和合作伙伴一起，至少也做了上百场活动。我们很开心见证并参与了这个市场的成长。</p>\n  <p><strong>36氪：澳网目前在中国的观众人数达到多少？</strong></p>\n  <p><strong>Roddy Campbell：</strong>澳网在中国的社交媒体粉丝一共有650万。AO26在中国市场的累计观看时长达到1.265亿小时，独立转播观众在3亿到4亿之间；社媒整体声量21亿——这个数字已经挺庞大了，但我们相信新的一年还会有增长。</p>\n  <p><strong>36氪：除了观众人数外，中国球迷的消费行为有哪些变化？</strong></p>\n  <p><strong>Roddy Campbell：</strong>尤其近几年，年轻球迷对赛事消费不再停留在传统直播和纯粹的网球内容，而是更多元、更偏生活方式；另一点是，球迷不再只看比赛，更希望深度参与。</p>\n  <p>我们做内容也会去迎合这种需求。比如澳网一分大满贯，邀请球迷亲自上场体验赛事氛围；也推出了更多赛事周边、消费衍生品，把整个赛事变成一种生活方式，不只是网球竞技本身——这是一种更沉浸的体验。</p>\n  <p><strong>36氪：观众的注意力越来越分散，从传播层面如何适应这种变化？</strong></p>\n  <p><strong>Roddy Campbell：</strong>内容上，我们会做明星、生活方式这些泛体育的内容。同时，我们针对不同平台有不同策略。比如在微博、微信、小红书，每个平台的算法和用户习惯不同，我们会推广不同的内容形式，它可能是一个话题、一款限定产品、一个比赛切片。换句话说，现在澳网的传播早已不局限于三个小时的比赛，而是拓展到更多元的内容。</p>\n  <p><strong>36氪：你怎么看AI给赛事传播带来的变化？</strong></p>\n  <p><strong>Roddy Campbell：</strong>我们对AI是拥抱的姿态。</p>\n  <p>过去四五年，在媒体传播这方面，我们已经非常频繁地使用AI工具了：大满贯赛事的内容非常多，AI帮我们基于同一场比赛，按照不同市场实时输出不同语言、不同规格的内容，让我们以最快的速度和全球粉丝互动，也让内容更加本土化。</p>\n  <p>澳网协还有一个官方的风险投资部门 AO Ventures，每年和全球数千家初创公司交流，投资那些对赛事发展、运营有帮助的技术。此外，我们几乎所有合作伙伴的产品，都或多或少带着AI技术——庞伯特的发球机有AI技术，海尔的家电也是智能化的。</p>\n  <p><strong>36氪：澳网挑选合作伙伴有什么标准？</strong></p>\n  <p><strong>Roddy Campbell：</strong>在7个中国品牌里，规模最大的是泸州老窖。泸州老窖2019年起就是我们的联合赞助商。瑞幸咖啡是区域合作伙伴，覆盖中国和东南亚，赛事期间会围绕澳网IP做限定款产品。此外还有滴滴、青岛啤酒旗下的奥古特，每个品牌的结合点和形式也不同。</p>\n  <p>至于标准，我们最看重价值观上的契合，尤其看重创新——澳网自己就是一个喜欢不断向前的品牌，我们希望和品牌共同创建新的资产性项目，而不只是一次logo曝光。现在借助虚拟广告位、社媒定制化投放这些技术，品牌可以根据自身的需要，选择特定区域的合作曝光。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_771c784bcfb1461c98d84b373cb28c47@394564713_oswg163874oswg593oswg777_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">澳网部分合作伙伴；图片截自官网</p>\n  <p><strong>36氪：去年周杰伦也参与了一分大满贯的决赛。</strong></p>\n  <p><strong>Roddy Campbell：</strong>今年1月，我们在罗德·拉沃尔球场办了一分大满贯的总决赛，周杰伦的参与给我们带来了非常大的热度，我们也看到中国球迷和粉丝都跃跃欲试。</p>\n  <p>所以这一创新赛事落地中国的出发点很纯粹——通过中国区预选赛，让我们和市场、和粉丝走得更近，同时给中国球迷一个圆大满贯梦的机会。今年中国是除澳洲本土之外，落地一分大满贯海外规模最大的市场，明年有可能还会拓展到其他市场。</p>\n  <p><strong>36氪：除了一分大满贯，2027澳网还有哪些新动作？</strong></p>\n  <p><strong>Roddy Campbell：</strong>整个澳网赛程通常为期三周。今年澳网现场会有一个非常丰富的开幕周，除了一分大满贯，还有音乐、粉丝互动等活动。</p>\n  <p>我们还会推出一个叫“超级粉丝”的全球招募项目，将从全世界范围内寻找6位球迷来到澳网，获得真正的幕后体验并成为澳网故事的一部分。接下来还会有开幕仪式，新的餐饮品牌和音乐演出阵容也将陆续公布。</p>\n  <p>品牌合作上也有新故事：BOSS将成为我们新的官方服装合作伙伴，为球童、裁判和赛事工作人员提供制服。还有庞伯特（PongBot），一家AI驱动的中国创新企业，它的发球机将成为澳网官方发球机，也是澳大利亚国家网球学院的官方发球机供应商，我们希望在科技和产品领域全方位合作，让更多人用新的方式来体验和参与网球。</p>\n  <p>体育品牌方面，我们目前和New Balance在专业运动服装与鞋履上有合作，球拍的品类也有很多品牌在聊，不同品牌之间，我们都会去找一个平衡点，看怎么可以和大家更好地共同合作。</p>\n  <p><strong>36氪：从澳网协的角度，中国市场有怎样的战略地位？</strong></p>\n  <p><strong>Roddy Campbell：</strong>中国是澳网在全球具有战略地位的重要市场，也是我们最大的观众市场。</p>\n  <p>截至目前，澳网及澳网协系列赛事在全球共有66个合作伙伴，其中澳网的中国品牌官方合作伙伴有7个，而且每年都在增长——既有全球级的，像泸州老窖和海尔；也有区域性的，比如瑞幸。我们会和合作伙伴一起去开拓这个市场。</p>\n  <p>我们也在规划青少年相关的项目，比如夏令营、网球青训营等。我们相信，现在的粉丝需要的不只是当一个观赛的观众，而是参与其中。因此在未来，澳网希望越来越多的中国观众不仅成为AO的粉丝，也是网球运动的参与者。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_9b680370986c47628c686f74b41c8450@394564713_oswg68085oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-10-21T08:06:28+00:00", "fetched_at": "2026-10-22T03:02:32.879246+00:00", "fingerprint": "ce012be153233068"}, {"source": "36氪 - 最新文章", "title": "AI的下一站:从Personal Agent到灯塔工厂", "url": "https://36kr.com/p/4035016423347077?f=rss", "summary": "<h2>特别鸣谢永艺UE对本次活动的支持，为现场提供Flow550人体工学椅。</h2>\n  <p>&nbsp;AI正在走进越来越多的工作场景，但从\"会用工具\"到真正解决问题，仍有不少细节需要走到现场才能看清，个人的专业经验如何与Agent结合？制造业怎样判断一个AI项目值不值得做？企业又该如何处理数据，流程和交付中的难题？</p>\n  <p>10月16日，36氪AI测评苏州OPC社区“AI的下一站：从Personal Agent到灯塔工厂”主题活动在苏州东延四季举行。胡旭、赵文博、朴飞、周炜四位嘉宾，分别从个人Agent、制造业应用、企业项目实践和AI学习方法出发，将这些问题放在同一张讨论桌上。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_5c832eca7fc14e44a6cf28430ea98114@6056299_oswg5033585oswg4415oswg2481_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">现场活动照片</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_12b5e79c747448188346737a5f154cc6@6056299_oswg207396oswg1600oswg898_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">永艺UE联合呈现此次活动</p>\n  <h2><strong>胡旭：从工具到搭档，专业经验如何与Agent连接</strong></h2>\n  <p>在《从工具到搭档：Personal Agent时代的战略机会》分享中，姑苏区挂牌OPC社区导师胡旭(Jack)关注的，是AI参与工作的方式正在如何变化。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_5cced2d7e1fc4992b51302fa1cf3ccc6@6056299_oswg2660316oswg4466oswg2509_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">胡旭（Jack）现场分享</p>\n  <p>当AI从回答问题的工具，逐步成为能够参与任务执行的搭档，个人的机会也需要重新理解。胡旭认为，值得投入的方向，是把自身知识与行业经验同Agent理立更紧密的连接，让专业能力能够进入新的协作方式。</p>\n  <p>对于OPC而言，这意味着除了熟悉工具，还要想清楚自己能够提供什么:对某个行业的理解。处理具体问题的经验，以及可被调用的专业服务。技术变化很快，已有积累依然是寻找机会的重要起点。</p>\n  <h2><strong>赵文博：看懂灯塔工厂，先问AI创造了什么价值</strong></h2>\n  <p>睿塔联合创始人赵文博在《灯塔工厂里的AI：用\"价值“这把尺，看别人如何应到最前面》中，将讨论带回制造业现场。结合在博世、舍弗勒的工作经历，他强调，评价智能化项目不能只看用了什么系统，更要看它是否带来了实际业务价值。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_2ce0b37248884d958efb93aac3e7ee20@6056299_oswg4995469oswg4528oswg2544_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">赵文博现场分享&nbsp;</p>\n  <p>AI应用中的一个常见难点，是业务与技术彼此不够了解：业务人员说不清技术能做到哪一步，技术团队也未必理解现场真正卡在哪里。需求与方案之间的偏差，往往由此产生。</p>\n  <p>围绕这一问题，赵文博提出“人人都是FDE”的思路，强调连接业务理解与技术实践，对企业来说，先找准问题，再讨论工具和方案，才能让AI项目有明确的验证方向。</p>\n  <h2><strong>朴飞：</strong>企业AI落地，要先把数据与流程接起来</h2>\n  <p>前微软工程师朴飞带来《百万级项目一线实录：企业AI落地的真相与坑》。他的分享聚焦企业项目中的具体环节：一个演示能够运行，并不意味着它已经可以进入业务流程。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_299da3581cbe46e0a79ac48fa4b73957@6056299_oswg3612316oswg4092oswg2299_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">朴飞现场分享</p>\n  <p>&nbsp;从业务访谈、资料治理、试点验证，到流程接入和持续复盘，企业AI应用需要逐步推进。其中，知识库、统一的数据口径、权限管理和信息脱敏，是不能跳过的基础工作。模型可能产生错误，结果如何复核，也需要提前设计。&nbsp;</p>\n  <p>他以企业报价场景为例，讨论AI如何参与信息整理和报价响应，现场也有企业主进一步追问报价风险，将交流从“能不能做”推进到“怎样用、怎样判断结果”。这类具体问题，比单纯展示工具能力更接近项目落地时的真实处境。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_7ddd7bea9a054c8f8955fdb7364e5d1b@6056299_oswg4587425oswg4295oswg2413_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <h2><strong>周炜：</strong>先用好已有技能，再练AI的新招式</h2>\n  <p>多边AI创始人周炜(姑苏阿伟)以《武侠AI学习法：先修心法，再练招式》，回应个人学习AI时容易遇到的困惑：工具不断更新，究竟该从哪里开始?</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_ab56ccbc1083443eba9a77a548ba375d@6056299_oswg2185275oswg4209oswg2365_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">周炜现场分享</p>\n  <p>他的建议是，把已经具备的技能与AI结合，形成解决具体问题的方案，再通过自媒体让更多人了解。学习不必从追逐所有新工具开始，而应先找到与自身工作有关，能够反复练习的任务。</p>\n  <p>分享中，他借用武侠人物解释售前、资源、背书与交付等不同角色，让团队动作变得更容易理解。对个人实践者来说。理解各个环节需要什么能力。也有助于判断那哪些事情可以自己完成，哪些需要找到伙伴。</p>\n  <h2><strong>把讨论留在真实问题上，让交流继续发生</strong></h2>\n  <p>从个人Agent到灯塔工厂，四场分享的切入口不同，却都把讨论带回了具体工作：经验如何被使用，需求如何被确认，数据如何被整理，结果如何被验证。AI走进工作现场，不只是工具升级，也是一场需要久坐、深聊和反复推敲的耐力活。永艺UE为本次活动提供Flow550人体工学椅，希望让参与者在长时间交流中少一点久坐疲劳，多一点“撑腰”的底气，把更多精力留给真问题。</p>\n  <p>活动中的问答与自由交流，让嘉宾的方法有机会与现场需求碰面：活动群也为后续的资料分享与沟通留下了连接。这正是36氪AI测评持续开展城市0PC交流的出发点——让行业经验，技术能力和真实问题出现在同一个现场，推动更多具体，可讨论的实践。&nbsp;</p>\n  <p>关注36氪AI测评，一起记录AI走进工作现场的过程，也让每一次尝试找到可以交流的同行。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_39c1e954ef53451689f5094fea7e7623@6056299_oswg3354199oswg3551oswg1995_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_262633d7808d48f59bbf4948a1446447@6056299_oswg191994oswg1600oswg900_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_91df62e2e50541a687da302311bedbd5@6056299_oswg4975668oswg4054oswg2278_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20261021/v2_ca56ad76caf441f198f992cd649b748a@6056299_oswg3541403oswg3664oswg2059_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>", "category": "tech", "published_at": "2026-10-21T09:00:27+00:00", "fetched_at": "2026-10-22T03:02:32.879238+00:00", "fingerprint": "05a11462f1df0a72"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨宝马离职补偿最高487万，员工争着离职挤爆系统；iPhone Duo全球限购，每位顾客限购2台；Meta第三季度营收646亿美元，同比增长26%", "url": "https://36kr.com/p/4036266730886018?f=rss", "summary": "<h2>今日热点导览</h2>\n  <ul>\n   <li>段永平称会继续买入泡泡玛特</li>\n   <li>阿宽食品停牌，阿宽食品利润暴跌90%</li>\n   <li>联想拟筹集20亿美元贷款，低成本置换旧债</li>\n   <li>SK海力士完成40万亿韩元股票回购</li>\n   <li>马斯克呼吁善待人工智能：否则“它们可能会报复”</li>\n  </ul>\n  <h2>TOP 3 大新闻</h2>\n  <p><strong>宝马员工争着离职挤崩系统，离职补偿金最高487万</strong></p>\n  <p>据德国媒体《商报》（Handelsblatt）报道，宝马计划在2027年底前削减8000个白领岗位，并向数万名员工发送了“远超行业”的离职补偿方案，部分员工获得的离职补偿金额最高可达65万欧元（IT之家注：现汇率约合487.6万元人民币）。作为参考，大众两年前向部分员工提供的离职补偿金额最高约为40.5万欧元（现汇率约合303.8万元人民币），且不包含提前离职奖励。奔驰提供的最高补偿金额约为50万欧元（现汇率约合375.1万元人民币）。</p>\n  <p>在补偿金的领取方式上，员工可以选择分期领取、一次性领取，也可以将部分款项转入公司养老金计划或直接保险，还可以组合使用上述方式。对于在年满 55 岁的员工，宝马还会在部分附加福利方面将其视为退休人员，包括新车和二手车购买相关的员工优惠。</p>\n  <p>受离职补偿影响，约有 4 万名员工登录宝马内部人力资源门户查看自己能够获得的补偿金额，结果导致该系统在数小时内便因访问量过大而出现故障。宝马于次日修复了相关系统，但申请数量仍持续增加。如今公司决定暂时停止接收新申请，以便优先处理已经提交的申请。（IT之家）</p>\n  <p><strong>iPhone Duo开启全球限购，每位顾客仅可购买2台</strong></p>\n  <p>苹果iPhone Duo开启限购。10月21日查询苹果中国官网获悉，计划在本月23日发售的iPhone Duo每位顾客限购2台。苹果客服表示，不仅是中国，iPhone Duo在全球范围内均开启了限购。关于限购的原因，公司未发布相关公告，或是为了抑制黄牛囤货。（界面新闻）</p>\n  <p><strong>Meta第三季度营收646亿美元，同比增长26%</strong></p>\n  <p>Meta第三季度营收646亿美元，同比增长26%，预估633.3亿美元；第三季度经营利润129.9亿美元，同比下降37%，预估208.5亿美元；第三季度每股收益3.83美元，上年同期1.05美元，预估3.57美元。公司第四季度预计营收730亿美元至760亿美元，市场预估735.7亿美元。公司披露新的非表决权C类普通股发行计划，无投票权股票将确保CEO扎克伯格继续领导公司。公司预计预计四季度营收730亿-760亿美元，分析师预期735.7亿美元，预计全年资本开支1350亿-1450亿美元，公司原本预计1300亿-1450亿美元。（界面新闻）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>宇树科技发布人形机器人“H2-X功夫传奇”</strong></p>\n  <p>36氪获悉，宇树科技宣布发布人形机器人“H2-X功夫传奇”，最长续航时间约8小时。</p>\n  <p><strong>豆包工作功能上新，本地Office编辑新增Word</strong></p>\n  <p>36氪获悉，10月21日，豆包工作宣布上线新功能，本地Office编辑新增Word，支持直接打开本地文件；新增可追溯的记忆面板，云电脑与浏览器、消息排队、复杂任务分工体验同步升级。</p>\n  <p><strong>Muse持续“霸榜”，上线头40天美国下载量超1000万</strong></p>\n  <p>10月21日，Sensor Tower最新数据显示，自9月上线以来，Meta Muse的下载量已达1090万次，其中1020万次来自美国。分析人士指出，Meta能够屡次打造爆款，很大程度上归功于其强大的应用生态与跨平台导流能力。目前情况来看，Muse的用户留存率要优于ChatGPT、Claude和Grok等AI竞争对手。在美国市场，该应用7天后的留存率为30%，14天后的留存率为23%。相比之下，其竞争对手的7天平均留存率为19%，14天平均留存率为16%。（财联社）</p>\n  <p><strong>谷歌CEO谈2027年算力租赁市场：新增需求已极难满足</strong></p>\n  <p>皮查伊在播客访谈中透露，谷歌去年甚至曾短期租用外部算力，以满足部分客户需求。他表示，即便客户现在希望获得2027年的算力，谷歌要满足需求已极其困难，行业各家公司都希望当初规划的规模能再大一倍。围绕新模型Gemini 4 Argon，他还谈及智能体商业化、苹果合作与太空数据中心。尽管承认供应链瓶颈和宏观冲击可能导致过度建设，他仍对长期算力需求保持信心。（新浪财经）</p>\n  <p><strong>OpenAI与谷歌云达成合作，将开放前沿模型及Codex</strong></p>\n  <p>10月21日，OpenAI宣布与谷歌云合作，将其前沿模型及Codex智能体工作流接入谷歌云Model Garden，计划于未来几周内正式开放。企业客户还将能够通过谷歌云市场购买相关模型，并使用谷歌云消费承诺支付费用。OpenAI模型还将陆续接入谷歌Antigravity和Gemini Agent。OpenAI表示，微软仍是其主要云合作伙伴。（界面新闻）</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>段永平称会继续买入泡泡玛特</strong></p>\n  <p>有网友就泡泡玛特投资相关问题询问段永平，段永平回应：“我应该还会再买一些，但不会超过公司的10%，不然公司该有意见了哈。网易我最多也就到过10%左右吧。现在搞得我像个泡泡玛特代理人似的，我以后不想再回答这种问题了，反正我的观点该说的都说了，对错过几年就知道了。”（财联社）</p>\n  <p><strong>阿宽食品停牌，阿宽食品利润暴跌90%</strong></p>\n  <p>10月21日，曾经因为“红油面皮”爆火的阿宽食品，在新三板挂牌720天后正式停牌。据21财经，截至停牌前，阿宽食品的股价是7.48元，总市值6.25亿元。此前于9月24日，阿宽食品已经披露将主动申请终止挂牌，原因是“公司自身战略规划。 阿宽食品因为“红油面皮”走红，2020年收入突破10亿元大关，2021年开始以“新型方便食品第一股”的定位谋求登陆资本市场，先后瞄准创业板、主板和新三板。财报显示，2025年阿宽食品营业收入12.24亿元，首次出现两位数下滑，净利润更是同比下滑90%。2026年上半年，其营业收入同比下降2.44%。（新浪财经）</p>\n  <p><strong>美股三大指数集体收涨，SpaceX涨超7%</strong></p>\n  <p>36氪获悉，10月21日收盘，美股三大指数集体上涨，道指涨0.69%，纳指涨1.05%，标普500指数涨0.58%。大型科技股多数上涨，SpaceX涨超7%，特斯拉涨超3%，英伟达、SK海力士涨超2%，苹果、英特尔涨超1%，Meta、微软小幅上涨；奈飞跌超5%，谷歌跌超1%，亚马逊小幅下跌。热门中概股普跌，小鹏集团跌超5%，阿里巴巴、京东、理想汽车、拼多多、名创优品、微博跌超3%，百度、蔚来跌超2%。</p>\n  <p><strong>马斯克：SpaceX和特斯拉已成立特别委员会，研究潜在合并</strong></p>\n  <p>马斯克当地时间10月20日表示，SpaceX和特斯拉已成立特别委员会，研究潜在合并，“我认为两家公司合并有很多好处，在开发超级智能软件方面进行合作将大有裨益”。马斯克强调，合并并非板上钉钉，还需要获得股东支持。他表示，特斯拉需要获得全体股东50%的批准，而不仅仅是多数投票股东的同意，“有些人认为SpaceX与特斯拉合并已成定局。我认为这种说法言过其实”。（界面新闻）</p>\n  <p><strong>比亚迪回应L3车辆落地时间</strong></p>\n  <p>10月21日，针对比亚迪L3级别车辆何时落地，比亚迪集团高级副总裁、汽车新技术研究院院长杨冬生在世界智能网联汽车大会上表示，L3级别有条件自动驾驶有希望在2028年落地，更高级别自动驾驶通过迭代，有望再过1-2年落地。（第一财经）</p>\n  <p><strong>安踏体育：第三季度安踏品牌产品零售额同比录得中单位数负增长</strong></p>\n  <p>36氪获悉，安踏体育在港交所公告，2026年第三季度，安踏品牌产品零售金额（按零售价值计算）同比录得中单位数的负增长；FILA品牌产品零售金额（按零售价值计算）同比录得低单位数的负增长；所有其他品牌产品零售金额（按零售价值计算）同比录得25%—30%的正增长。</p>\n  <p><strong>梅赛德斯-奔驰：将于2027年上半年在德国推出城市辅助驾驶系统</strong></p>\n  <p>10月21日，梅赛德斯-奔驰宣布，MB.DRIVE ASSIST PRO辅助驾驶系统将于2027年上半年在德国开放订购。该系统由奔驰与英伟达合作开发，支持从起点到终点的辅助驾驶，可协助车辆完成变道、路口转弯及红绿灯启停等操作，属于SAE L2级驾驶辅助系统，驾驶员仍须持续关注路况并承担驾驶责任。奔驰计划于2026年底在斯图加特和慕尼黑向部分符合条件的客户提前开放该功能。（界面新闻）</p>\n  <p><strong>媒体：Castore就潜在出售事宜与安踏、李宁洽谈</strong></p>\n  <p>据英国金融时报报道，英国运动服饰厂商Castore联合创始人Tom Beahon接受采访时表示，公司正就潜在出售交易和安踏、李宁展开磋商，两家中国运动集团均表达收购意向。Castore同时也在和部分美国大型鞋服品牌洽谈。报道称，安踏不予置评。李宁暂未回复置评请求。（新浪财经）</p>\n  <p><strong>宁德时代回应“投资者对明年行业需求担忧”：2027年行业需求依旧可期，没有市场预期的那么悲观</strong></p>\n  <p>近期部分投资者对明年新能源行业需求有些担心。对此，宁德时代回应称，从公司角度看，2027年行业需求依旧可以期待。国内乘用车方面，尽管今年乘用车整体销量有所下降，但可以看到电动化率在快速提升，并且单车带电量有较快提升，所以国内新能源乘用车动力电池的增速依然实现了正增长。国内新能源商用车的电动化率也在快速提升；欧洲的电动化趋势具有连续性，不断有竞争力的新车型推出；其他市场的电动化潜力可能被市场低估。储能方面，无论是国内还是海外都保持着不错的增速，特别是海外部分市场的储能需求比较旺盛。整体而言，全球动力及储能电池的市场需求可能没有市场预期的那么悲观，仍有不错的增长潜力。（证券时报）</p>\n  <p><strong>优衣库中国回应涨价：并无相关价格调整计划</strong></p>\n  <p>10月21日，优衣库中国回应称，目前优衣库中国并无相关价格调整计划。优衣库日本官网近日发布公告，宣布将对部分商品价格及服务费用进行调整，商品整体平均销售价格将上调约4%。公告称，在原材料费、物流费上涨及日元贬值影响持续的背景下，尽管已反复采取各种措施，仍决定调整部分商品价格与服务费用。（21财经）</p>\n  <p><strong>苹果据悉本月在韩国上线Siri AI功能</strong></p>\n  <p>业内消息人士周三透露，韩国用户很快就能使用苹果公司搭载生成式人工智能的助手。这家美国科技巨头计划从本月起，为Siri AI新增韩语支持。（新浪财经）</p>\n  <p><strong>联想拟筹集20亿美元贷款，低成本置换旧债</strong></p>\n  <p>知情人士透露，联想集团有限公司正在寻求一笔20亿美元贷款，利率优于其拟置换的原有贷款。亚洲贷款市场交易清淡，银行仍愿意向中国头部企业投放信贷。这笔五年期贷款已启动银团分销，利率为担保隔夜融资利率（SOFR）上浮75个基点。该定价相比2022年同等规模贷款大幅收窄；当年那笔贷款为SOFR上浮110个基点外加信用调整利差，这一差异源于基准利率从伦敦同业拆借利率向SOFR切换。（新浪财经）</p>\n  <p><strong>麦格理大宗商品部门重组，多名原油交易员离职</strong></p>\n  <p>麦格理集团多名原油交易员已经离职，该行正合并两大核心大宗商品交易部门。知情人士透露，这些交易员负责原油及成品油交易，办公地点分布在新加坡、日内瓦等地，于近几周陆续离开。其中包括新加坡的 Daniel Mortleman、Simon Fender，以及日内瓦的 Natalia de la Huerga、Marc Aguilar。消息人士称，麦格理正在整合麦格理银行与 Macquarie Commodities Trading SA 两大交易分部，两个团队交易品种相近，但组合持仓有所区别；相关人士因未获对外发声许可，要求匿名。（新浪财经）</p>\n  <p><strong>星巴克中国：10月22日起将在全国开始施行消费入座</strong></p>\n  <p>从星巴克中国方面获悉，10月22日起，星巴克将在全国开始施行消费入座，门店会摆放相关提示牌。在实际的营运过程中，星巴克会为伙伴提供统一的服务指引和必要支持，伙伴会遵循友好、友善的沟通原则，并妥善处理顾客的合理突发需求和特殊情况。星巴克方面表示，如遇到孕妇、行动不便者等需要帮助的顾客，伙伴将优先给予帮助。规则清晰，但执行会保有温度，“人文关怀始终是我们的应有之义，我们将持续投入资源改善门店体验，并与顾客共同创造和维护第三空间的美好体验。”（澎湃新闻）</p>\n  <p><strong>美联储到10月维持利率不变的概率为83.9%</strong></p>\n  <p>据CME“美联储观察”，美联储到10月维持利率不变的概率为83.9%，累计加息25个基点的概率为16.1%。美联储到12月维持利率不变的概率为9.8%，累计加息25个基点的概率76.1%，累计加息50个基点的概率为14.2%。（界面）</p>\n  <p><strong>亚马逊豪掷数十亿“锁”英伟达GPU，但因缺电闲置仓库</strong></p>\n  <p>一份内部电子邮件显示，亚马逊设立了一项全新“提前接收机架”计划，开启激进算力储备模式。按照规划，公司将提前接收价值约50亿美元的英伟达GB300服务器机架，部署至美国数据中心，且未来将持续以每月30亿美元的规模新增硬件采购。与以往商业模式不同，亚马逊此次打破行业常规，在数据中心完成电力配套、具备设备运行条件前，提前完成大额硬件采购。报道称，目前亚马逊多个AWS站点电力容量不足，大量提前采购的英伟达GPU设备只能闲置在中转仓库，形成无法投产的“黑暗GPU”（Dark GPUs）资源——即企业虽已购买 AI 芯片和服务器，却因供电问题或系统设计缺陷而被迫闲置。（财联社）</p>\n  <p><strong>摩根士丹利预计成品油供应紧张局面将持续到2027年中</strong></p>\n  <p>摩根士丹利表示，成品油市场可能将持续紧张至2027年年中，因为就算战争造成的中断有所缓和，炼厂检修“异常大幅增加”也将制约全球供应。Martijn Rats和Charlotte Firkins等分析师在10月20日发布的报告中表示，从现在到明年第二季度末，全球炼厂计划检修导致的停产料将增加340万桶/日，相当于通常水平的2.5倍，也超过目前中东和俄罗斯炼厂加工量的降幅。（新浪财经）</p>\n  <p><strong>消息称Groq正计划将3D堆叠式DRAM封装技术应用于下一代芯片</strong></p>\n  <p>据媒体报道，Groq正考虑将三维堆叠DRAM的封装技术应用于下一代芯片。这意味着将使用DRAM替代现有的SRAM。业内人士将此举解读为通过摆脱目前以SRAM为中心的芯片设计来大幅提升芯片容量。据悉，SRAM速度快但容量有限，而DRAM速度相对较慢，但更适合实现大容量芯片。3D封装技术将多个半导体芯片垂直堆叠而非平放，从而形成一个完整的芯片，与传统的2D封装相比，能够减小芯片表面积并提高能效。（财联社）</p>\n  <p><strong>消息称多家私募机构曾考虑联手收购微软游戏业务Xbox，估值高达1500亿美元</strong></p>\n  <p>据知情人士透露，近几个月来，几家私募股权投资机构曾考虑过收购微软旗下Xbox游戏业务的可能性。若交易达成，该业务的估值可能达到1000亿至1500亿美元。这些知情人士表示，私募机构的此类探讨仅处于初步探索阶段，并未演变为与微软之间的正式谈判。不过，这也表明，如果微软在扭转其陷入困境的游戏业务方面进展不顺，该公司仍有可能找到买家。目前尚无法确认这些私募股权机构的具体身份。（新浪财经）</p>\n  <p><strong>三星晶圆代工：4纳米产能拉满，5纳米接力拓客，2nm谈判进度滞后</strong></p>\n  <p>据报道，三星4纳米和5纳米工艺的良率相对稳定。由于近期客户订单激增，三星电子晶圆代工业务部门的4纳米工艺产能已接近饱和，公司正加大销售力度，力求为其5纳米工艺争取更多客户。据悉，5纳米工艺还能提高现有生产设施的利用率。业内人士预计，4纳米工艺利用率的提高和新的5纳米订单将有助于三星晶圆厂近期业绩的提升。相比之下，三星在下一代旗舰级2纳米工艺上争取重要客户仍面临挑战。报道称，三星电子正在与全球大型科技公司洽谈基于2纳米工艺的半导体生产合同，但部分谈判进度有所滞后。由于尖端工艺不仅需要对良率进行验证，还需要对能效、知识产权以及稳定的量产能力进行全面验证，从签订合同到实现量产需要相当长的时间。（新浪财经）</p>\n  <p><strong>苹果为iPhone Duo新增美国本土钛金属供应商，当前供货持续紧张</strong></p>\n  <p>苹果正在为新款折叠机型iPhone Duo新增一家美国钛金属供应商，同时扩大iPhone 18 Pro摄像头组件的本土产能，以此推进在美国本土扩大制造业务的计划。苹果周二宣布，未来三年将向宾夕法尼亚州休斯顿市Perryman Company投入最高1亿美元，用于生产苹果产品所用钛材，其中就包括售价1999美元的折叠手机iPhone Duo。（新浪财经）</p>\n  <p><strong>SK海力士完成40万亿韩元股票回购</strong></p>\n  <p>继三星电子之后，SK海力士的大规模股票回购也于21日结束。SK海力士表示，公司当天在韩国证券交易所（KOSPI）完成了历时两个月、规模达40万亿韩元的股票回购。此前，SK海力士宣布，将投入40.0434万亿韩元回购2407万股公司股票，并在回购完成后将全部股份注销。此次回购股份约占公司已发行股份总数的3.3%，是韩国上市公司规模最大的股票注销操作。SK海力士原先公告的回购期限为8月20日至11月19日，但实际回购工作提前约一个月完成。（财联社）</p>\n  <p><strong>马斯克呼吁善待人工智能：否则“它们可能会报复”</strong></p>\n  <p>对聊天机器人出言不逊，向来被视作不会伤害任何人的行为。但特斯拉和SpaceX首席执行官埃隆・马斯克认为，在把AI助手当成“出气筒”之前，人们或许应该三思。马斯克称，SpaceX旗下聊天机器人Grok的部分训练记录显示：该系统仿佛在拼命满足各种要求——即便这些要求本身存在缺陷，或者用于评估其回答的测试标准本身就有问题。针对“虐待”超智能人工智能的行为，马斯克给出了一个听起来颇具科幻色彩的警告；但也引出了一个关乎这类系统底层构建方式的现实问题。（新浪财经）</p>\n  <p><strong>雷军：未来5年，小米在硬核科技领域投资预计超2000亿元</strong></p>\n  <p>10月21日，在2026世界智能网联汽车大会上，小米集团创始人、董事长兼CEO雷军表示，到目前为止，小米已经构建了全球最大规模的消费级loT平台，截至二季度末，小米全球loT的设备连接数已经超过11亿台，为了把整个生态的体验做好，过去几年，小米一直在芯片、操作系统、AI具身智能等底层硬核技术上持续加大研发投资，在过去的5年里，小米在硬核科技的研发上投入了1055亿元，预计在未来的5年相关投资会超过2000亿元。（证券时报）</p>\n  <h2>上市进行时</h2>\n  <p><strong>新加坡数据中心运营商DayOne据悉重新评估美国IPO计划</strong></p>\n  <p>知情人士称，随着数据中心板块波动加剧，DayOne Data Centers正在重新评估美国IPO计划，可能推迟上市或缩减发行规模。知情人士表示，总部位于新加坡的DayOne一直在等待合适时机启动IPO，同时也考虑将发行推迟至市场回稳后。其他方案包括缩小发行规模，募资25亿至30亿美元，约为最初目标的一半。知情人士称，DayOne仍在与潜在投资者接洽，并希望市场条件一旦允许就尽快推进上市。此前有报道称，该公司最初考虑最快第四季度通过IPO募资至多50亿美元，目标估值约200亿美元。知情人士称，目前讨论仍在进行，DayOne尚未作出最终决定，公司仍可能选择在未来几周推进IPO。DayOne不予置评。（财联社）</p>\n  <p><strong>水艺集团启动北交所IPO辅导</strong></p>\n  <p>36氪获悉，证监会网站披露，水艺环保集团股份有限公司于2026年10月20日在宁波证监局办理辅导备案登记，拟向不特定合格投资者公开发行股票并在北交所上市，辅导券商为第一创业证券承销保荐有限责任公司。</p>\n  <h2>大公司财报</h2>\n  <p><strong>阿迪达斯2026年第三季度营收同比增长7%，上调全年业绩指引</strong></p>\n  <p>10月21日，阿迪达斯全球公布了2026年第三季度初步业绩：全球营收达72.52亿欧元，在货币中性下（下同），同比增长7%；营业利润达10.08亿欧元；毛利率提升2.5个百分点至54.3%。第三季度，阿迪达斯全球收到了美国关税的大部分退款，并据此确认了约2亿欧元的退税，这部分退税对毛利率的改善做出了贡献。基于第三季度超预期的表现，阿迪达斯全球上调了2026年全年业绩指引，公司预计将实现9%-10%的营收增长，营业利润预计将提升至25亿欧元（此前预计为23亿欧元）。（界面新闻）</p>\n  <p><strong>特斯拉：第三季度净利润7.87亿美元，同比下降43%</strong></p>\n  <p>36氪获悉，特斯拉发布2026年第三季度财报，财报显示，特斯拉第三季度实现营收280.46亿美元，同比下降0.2%；净利润7.87亿美元，同比下降43%。</p>\n  <p><strong>弘信电子：前三季度净利润2.17亿元，同比增长139.24%</strong></p>\n  <p>36氪获悉，弘信电子披露三季报，公司2026年前三季度实现营业收入55.01亿元，同比下降0.88%；归属于上市公司股东的净利润2.17亿元，同比增长139.24%。其中，第三季度实现营业收入21.25亿元，同比增长3.36%；归属于上市公司股东的净利润9258.68万元，同比增长153.51%。</p>\n  <p><strong>诺德股份：前三季度净利润2.47亿元，同比增长363.36%</strong></p>\n  <p>36氪获悉，诺德股份披露三季报，公司2026年前三季度实现营业收入101.66亿元，同比增长112.12%；归属于上市公司股东的净利润2.47亿元，同比增长363.36%。其中，第三季度实现营业收入37.33亿元，同比增长110.07%；归属于上市公司股东的净利润1.44亿元，同比增长775.64%。</p>\n  <p><strong>敷尔佳：前三季度净利润3.62亿元，同比增长11.35%</strong></p>\n  <p>36氪获悉，敷尔佳披露三季报，公司2026年前三季度营业收入17.7亿元，同比增长36.43%；归属于上市公司股东的净利润3.62亿元，同比增长11.35%。其中，第三季度营业收入6.14亿元，同比增长41.37%；归属于上市公司股东的净利润1.06亿元，同比增长11.08%。</p>\n  <h2>投融资</h2>\n  <p><strong>物理空间智能基础设施公司“乙太科技”完成超亿元融资</strong></p>\n  <p>36氪获悉，物理空间智能基础设施公司“乙太科技”近日连续完成种子轮及天使轮融资，累计融资规模超亿元。其中产业投资方包括华为哈勃、嘉立创、自变量、智元、中科第五纪、软通动力。财务投资方包括高瓴、深高新投、上海半导体、中平资本、芯能创投、交源资产、Neuron VC、德石、曦晨等。</p>\n  <p><strong>整理丨几何鱼</strong></p>", "category": "tech", "published_at": "2026-10-21T23:46:32+00:00", "fetched_at": "2026-10-22T03:02:32.879222+00:00", "fingerprint": "9ae9040d121fcdf0"}, {"source": "少数派", "title": "怀旧手记｜世界首台 UMPC：三星 Q1，和当下平板有什么关系？", "url": "https://sspai.com/post/115107", "summary": "电脑与平板之间的界限，早在 20 年前的三星 Q1 上就已经可以随意切换了。<a href=\"https://sspai.com/post/115107\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-21T02:23:21+00:00", "fetched_at": "2026-10-22T03:02:30.515030+00:00", "fingerprint": "d270ba26639fc74f"}, {"source": "少数派", "title": "Vitals：什么在拖慢你的 Mac？它比「活动监视器」更直观易用", "url": "https://sspai.com/post/116445", "summary": "如果你希望更直观地分析 App 资源消耗、追踪历史变化，或者经常在 Mac 上进行开发和本地 AI 推理，Vitals 提供的整合式监控与 AI 协作能力更值得尝试。<a href=\"https://sspai.com/post/116445\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-21T07:00:00+00:00", "fetched_at": "2026-10-22T03:02:30.515023+00:00", "fingerprint": "9f73602b9c166607"}, {"source": "少数派", "title": "社区速递 162 | MUJI 靠垫、中兴路由器与派友们的长假吃灰装备", "url": "https://sspai.com/post/116820", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/116820\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-10-21T09:00:00+00:00", "fetched_at": "2026-10-22T03:02:30.515015+00:00", "fingerprint": "765
