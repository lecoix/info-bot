<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f9fc;
    --bg-hover: #eef2f7;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-subtle: #8b949e;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-rate: #f0ad4e;
    --accent-tech: #4a90e2;
    --accent-politics: #9b59b6;
    --accent-other: #888;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1f242c;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --fg-subtle: #6e7681;
      --border: #30363d;
      --accent: #4493f8;
    }
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1f242c;
    --fg: #e6edf3; --fg-muted: #9198a1; --fg-subtle: #6e7681;
    --border: #30363d; --accent: #4493f8;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg-card: #f7f9fc; --bg-hover: #eef2f7;
    --fg: #1f2328; --fg-muted: #656d76; --fg-subtle: #8b949e;
    --border: #d0d7de; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; flex: 1; }
  header button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--fg); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--bg-hover); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    background: none; border: none; color: var(--fg-muted);
    padding: 10px 14px; cursor: pointer; font-size: 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
  .tab .count {
    display: inline-block; margin-left: 4px;
    background: var(--bg-card); color: var(--fg-subtle);
    font-size: 11px; padding: 1px 6px; border-radius: 10px;
  }

  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
  }
  .category-header .accent-bar {
    width: 4px; height: 18px; border-radius: 2px;
  }

  .item {
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 8px;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .item:hover { background: var(--bg-hover); }
  .item[data-cat="rate"] { border-left-color: var(--accent-rate); }
  .item[data-cat="tech"] { border-left-color: var(--accent-tech); }
  .item[data-cat="politics"] { border-left-color: var(--accent-politics); }
  .item[data-cat="other"] { border-left-color: var(--accent-other); }
  .item-source {
    font-size: 12px; color: var(--fg-subtle);
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 4px;
  }
  .item-source .dot { color: var(--fg-subtle); }
  .item-title { font-size: 15px; font-weight: 500; margin: 4px 0; }
  .item-title a { color: var(--fg); text-decoration: none; }
  .item-title a:hover { color: var(--accent); text-decoration: underline; }
  .item-summary {
    color: var(--fg-muted); font-size: 13px;
    margin-top: 6px; line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .item-summary img { display: none; }

  .empty { text-align: center; color: var(--fg-subtle); padding: 60px 0; }

  footer {
    text-align: center; padding: 24px; color: var(--fg-subtle);
    font-size: 12px; border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer a { color: var(--fg-muted); }

  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 12px; }
    main { padding: 12px; }
    .item { padding: 10px; }
  }
</style>
</head>

leaks we've seen so far, Samsung's next generation of foldables will likely be the stars of the show. Samsung is expected to show off a [&#8230;]", "category": "tech", "published_at": "2026-07-22T01:00:00+00:00", "fetched_at": "2026-07-22T02:10:26.461536+00:00", "fingerprint": "dd138b63ed24c743"}, {"source": "36氪 - 最新文章", "title": "圆桌论坛：夏天周而复始·VC3.0| 36氪WAVES2026新浪潮", "url": "https://36kr.com/p/3905169127114368?f=rss", "summary": "<p>“2026年，创投圈的浪潮再次翻涌：AI从技术概念走进产业深水区，硬科技创业从“小众赛道” 变成“主流共识”，年轻的创业者们正在用代码和双手，重新定义中国创新的未来坐标。</p>\n  <p>每一年，由36氪<strong> · 暗涌主办的WAVES大会，都是中国创投圈的年度风向标。</strong>今年的 WAVES 2026以“今年盛夏”为主题，落地广州番禺良仓新造创意园，在两天的时间里，我们汇聚了顶级投资人、产业领袖、新锐创业者，用14场深度圆桌、数十场独立演讲，拆解 AI、硬科技、出海、医疗等核心赛道的底层逻辑，见证那些“少数人” 的坚持，如何汇聚成改变行业的浪潮。”</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_d181e8f224df478b80d168141474dc5f@6381723_oswg138856oswg1280oswg853_img_jpeg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p>冯大刚｜36氪CEO（圆桌主持人）</p>\n  <p>王啸｜九合创投 创始人</p>\n  <p>刘缨｜软银中国资本 合伙人</p>\n  <p>高宇辉｜创东方投资 管理合伙人</p>\n  <p><strong>冯大刚：</strong>台上三位嘉宾，我想先讲一个小故事：AI这个词是哪一年提出来的？是1956年。到今天，AI这个词已经70岁了，相比AI来说，我们都还是年轻人，都是比AI小20岁的人。作为年轻人，我们今天来讨论这个行业正在发生的变化。这个行业现在处在一个夏天。夏天意味着一切已经发生了，但不知道会有什么结果。在这个过程中，我感觉到这个行业正随之发生了很多变化。今天主要有几个问题，第一个，周期是不是跟以前一样？第二，创业是不是跟以前一样？投资是不是跟以前一样？以及最后，我们的一些判断和选择。</p>\n  <p>第一个问题先讨论周期。今天叫做VC 3.0，在座每一位都是久经考验的老兵，我们都经历了好多周期，这次的周期是不是跟以前不一样？</p>\n  <p>有人说，这次AI浪潮来得特别大，所以这次的周期可能跟过去不同。我们跳出了某个周期，进入一个新的循环。也有人说，自己见过很多循环，其实跟过去差不多。每一次都会兴起、蓬勃、繁荣，也都会走向衰落，那么这次，是不是一样的？</p>\n  <p>我们按顺序来，先请王啸。王啸是36氪最早的天使投资人，应该是2011年，也就是十五年前，最早投资36氪的人之一。今天我们也特别感谢他，因为他是我们最早的天使投资人。</p>\n  <p><strong>王啸：</strong>对，36氪今年16岁，我们做投资也基本有15年了，所以算是跟36氪一起从零开始起步的。</p>\n  <p><strong>冯大刚：</strong>那你先开始说吧。</p>\n  <p><strong>王啸：</strong>我经历的第一波周期是互联网，第二波是移动互联网。现在，进入了科技大航海时代。我觉得人工智能是其中一部分，也可以说是第三波周期。</p>\n  <p>我认为，周期的本质是一样的，都是科技和社会发展变化带来的结构性大机会，最后可能会出现一些新的大公司，这一波也是。当然也有不同，驱动力不同，它的驱动力是来自于GPU计算能力不断提升之后，AI能力的显著跃迁。我们可以看到它的智能有一定的涌现，并由此带来面向各行各业的结构性变化，包括机器人、日常办公以及各种应用场景。以前的本质是把人和信息连起来，现在是直接用人工智能产生了很多的信息内容和服务能力。所以我觉得，这一波浪潮有可能比以前更猛烈。</p>\n  <p>这次还有一点不同，本质上，这一轮周期是在中美博弈大环境下出现的结构性大机会。所以我们不只是看技术，还要看政策，看中美，看各种各样封锁带来的机会。所以，我觉得这轮周期维度高了很多，这也是大家认为它和过去周期不同的原因。但我仍认为，本质都是一样的，最终还是要满足人的需求，抓住技术结构变化带来的大机会。</p>\n  <p><strong>冯大刚：</strong>我补充两个问题，过去我们看到的周期，往往看起来是计算机的周期，看起来是互联网的周期，但最后都变成了千行百业的机会。但这一波有一种声音认为，有可能这波只��AI的机会，未来或许没有千行百业，只有AI行业了。这是我补充的第一个问题：这一轮到底是不是千行百业的机会？第二，你刚刚提到“替代”，是不是这波机会跟“人”关系不大，因为我们都已经被替代了。这两个问题也想问问后面两位嘉宾。</p>\n  <p><strong>王啸：</strong>我觉得人肯定能找到自己的生存方式，过去每一波工业革命都会对工人产生替代 ，但是经过时代的发展，我们依然能找到自己存在的方式。即使硅基生命越来越智能，人也能找到自己的价值，仍可以感受到世界的美好。</p>\n  <p>所以我觉得人工智能并不会真正替代人类，但可能对某些工种，某些工作有产生冲击，这是必然发生的，目前来看，这一波受到冲击最大的是程序员。因为机器人的能力会显著提升，但不变的是人能够适应。人的学习能力，对社会的适应能力依然存在。所以再过很多年，你会发现，它依然是在创造一个更美好的世界。就像工业革命带来极大的生产力跃迁之后，人的生活品质也得到了提升。</p>\n  <p>我觉得人工智能很有可能能够再进一步提升。它其实是继工业革命、信息革命之后走向智能社会的一个重要节点。未来整个社会的生产力有可能极大丰富：工厂都是无人工厂，东西成本都极其低，因为这些工厂不需要人力投入了，没有人力投入，全部都依靠电力，而核聚变会带来便宜的电能，生物技术也会提高我们的生活质量。所以再过十年、二十年，我觉得整个社会将有一次质的飞跃，而这个飞跃会给我们带来巨大的幸福感的提升。</p>\n  <p><strong>冯大刚：</strong>有请刘总。</p>\n  <p><strong>刘缨：</strong>软银中国是2000年进入中国的，做了二十多年投资，我本人也是2009年进入软银中国开始做投资的。因为软银中国基本上做的都是硬科技的投资，所以说在整个科技进展的浪潮当中经历了起起伏伏很多，但我也非常同意王总的观点：这个周期再怎么变化，本质上是不会变成的，本质上都是一样的，因为所有的科技进步都是为了让人生活得更好，让人生活的成本更低，提高社会效率。</p>\n  <p>但是你说这一波周期有什么不一样呢？从互联网到移动互联网，软银投了无数项目，包括淘宝等。关于这一波AI周期，我更加确定它就是一个技术的改造，对传统行业的技术改造，所以，替代人这件事其实早就在发生，并不是AI出现之后才开始的。我们当年投的酷哇，做的是自动驾驶、扫地机器人这些方向，也很早就进入了黑灯工厂。</p>\n  <p>所以我同意王总的说法：人的适应力是很强的。无论再怎么变化，新的产业出现，并不会让人活不下去。随着社会效率的提高，人的生活成本降低，我觉得“人活不活得下去”不是一个问题，大量的人员可能从自己不愿意做的工作当中解放出来，去做愿意做的工作。所以先不用谈技术的进步，这其实也是一种社会结构和劳动力结构的转变。我觉得这一点其实对人类幸福的生存更有利。</p>\n  <p>这一波它可能出现对行业的一些调整，更大的是提高传统行业的效率，这一点是非常重要的。所以我们看待一个项目是不是值得去看，还是去看它对人类的衣食住行有没有效率的提升、有没有本质的改变，我觉得这一点是不会变的。</p>\n  <p><strong>冯大刚：</strong>你说的话让我想起有一个历史学家写过一本书，叫《历史的终结》，所以我想两位的观点其实是一致的，任何时候你们都不会同意写一本书写科技的终结，历史的终结，历史没有终结，历史会一次一次重复。</p>\n  <p>高总，你觉得这次有什么一样，有什么不一样的地方？</p>\n  <p><strong>高宇辉：</strong>先简单介绍一下，创东方是一家老牌创投机构，到今天已经有19年历史。我们原来主要是投早、投小、投硬科技，以投制造业为主，到目前为止投出了40多家上市公司。</p>\n  <p>从我们企业的特点谈谈我对周期和人工智能替代的感受。我非常赞同前面王总和刘总说的，周期的本质是不会变的，都是有发动、高涨、过热、泡沫，然后泡沫破灭，再到第二轮开始，大的过程是不变的。但是可能会变的是什么呢？这次AI浪潮下，周期的拐点比原来更难判断了。原来是线性的，通过各方面因素大致能判断出拐点在哪儿。但是除了AI，这次“十五五”规划中的“9+6”产业政策的推行都在影响整个周期的走向。AI真的在渗透到千行百业，改变了很多原有的发展轨迹，比如AI应用在研究蛋白质折叠的问题上，过去投入很长时间，花费很大精力，AI大大加速了这一进程。再如AI在新材料开发领域，2024年有一篇报道，研究如何利用火星土壤样本制备氧气，解决马斯克提出的火星移民的氧气缺乏问题。过去没有AI时，这个研发可能需要1200年。但AI的帮助把时间缩短到只需要一个月，实际的情况是 AI For Science 两周左右就做出初步成果来了。总之，AI对每个行业的冲击都非常大。我们做投资的时候是把整个投资的项目内嵌到宏观形势、产业形势和细分行业的曲线里面，这个曲线的划法是一样的。所以既有变化，也有不变。</p>\n  <p>说到对人才的冲击，这种冲击是非常大的。以印度举例，原来的毕业生最喜欢去几大软件公司，进入几大软件公司就等于阶层的跃迁。每年这几大软件公司至少招几万甚至十几万的软件开发人员，但是今年这个数字非常，上半年这几大公司只招非常少的人，而且据说目标是今年裁员30%，为什么呢？因为欧美国家不再需要这些基础码农了。比如澳洲所有金融行业已经开始把印度外包逐步剔除。过去要几百人开发的工作现在几个工作小组加上AI就替代了，这种影响是极其深远的。</p>\n  <p>AI还带来一个对中国来讲非常大的机遇，就是“AI+机器人”。“AI+机器人”完全可以抵消人口红利，它有可能把东南亚国家，包括印度在内的工业化国家跃迁的路封死，它们不但过去十几年错过了工业化，未来的几十年恐怕也要错过。但对中国而言，“AI+机器人”恰恰是解决老龄化社会的重要方法。AI带来很多的变化可能会超过我们的想象，而且总体来讲这波浪潮我认为对中国是非常有利的。</p>\n  <p><strong>冯大刚：</strong>我们反过来问，这次从高总开始。刚刚我们讲了周期，三位都认为周期本质上是一个循环，没有被打破。下一个问题，VC是不是不一样了？我自己也是做投资出身，我能明显感觉到好像是不太一样了，比如过去只要找到合适的人，找到合适的团队，把钱投给他，剩下就等着IPO了。但是今天不一样，今天我们自己还要学习AI，自己要搭建各种各样的能力，要帮客户跑订单，他问你，你能不能帮我一年拿一个亿，他说的一个亿不是融资，而是能不能帮我产品落地，还要面临各种各样国际、国内的监管，这些东西都是跟过去不一样的，所以关于VC有什么不同，你怎么看？</p>\n  <p><strong>高宇辉：</strong>整个时代不一样了，VC肯定是要进化的。最不一样的点，我们说募、投、管、退。首先募资端有巨大的变化，十几年前，也是创东方刚开始的时候，基本上没有国资的，资金结构中全部是社会化资金，但是最新数字，当然有几个口径，去年全社会募资总额中国资资本占比都没有低过80%-90%。国资和社会化募资最大的区别是什么？它带着当地政府的诉求，比如反投、招商，这些是一个巨大的变化。它要求GP得适应这种变化，适应这种变化得有招商能力，得有反投能力，换句话说你得要深度介入产业，并不是说你看这个项目好，单维度就可以投出去，而是“既要也要”，可能“还要”兼顾各方诉求，这是从募资方面来说。</p>\n  <p>投资端的变化也是这样，越来越向专业化、细分化的方向发展。这就要求所有的VC机构的研究能力、超前的判断能力要比过去更高，越是现在热点纷呈的时候，对研究能力、超前的判断能力要求就更高。</p>\n  <p>第三，组织结构会发生变化。现在是一个合伙人带着几个手下干活，可能三五年之后是一个合伙人带着几个Agent（智能体）干活。简单的分析交给AI，那行业会不会出现高度的同质化？大家都用同一个模型，那么我们这些创投机构能做什么？我们存在的价值是什么？存在的价值在于，超越AI的判断力、独特的一套创投打法和分析模型的构建能力现实地摆在面前了，能不能跟上这一波浪潮作出新的改变和革新，就决定创投机构未来在市场的身位，和能否从过去的成功走向新的辉煌。</p>\n  <p><strong>冯大刚：</strong>所以说AI给了一个标准答案，而我们要做好的话是要超越标准答案。</p>\n  <p><strong>高宇辉：AI</strong>不是给标准答案，AI目前最大的问题是一项工作只能做到七八十分，如果你想要90分，必须人工干预，这将导致未来市场会出现高度分化。个人有几个观点，AI绝对不是来平权的，AI也不是打破信息知识壁垒的，AI会制造更大的茧房，会使得二八法则变成一九法则，这意味着在AI工作的基础上，能够把70-80分变成90分-100分的这些人的价值会更加凸显。但反过来，如果一个人的工作能力只能达到50-60分，这些人会被残酷淘汰掉，因为用AI Agent替代就行了。如前所说，现阶段的工作是状态是几个领头的带着中间层、甚至一些辅助层来完成，而中间层、辅助层，例如从程序员到最终底层辅助者的简单的劳动力，很可能会被机器人和AI逐步替代掉。但是反过来最顶层的人会有新的更大的机会，这是一个很残酷的分层，甚至一九法则里“一”也会分层，制造“铲子”的和只会“使用铲子”的人，也会出现巨大的分层，未来这个趋势是很难改变的。</p>\n  <p><strong>冯大刚：</strong>有请刘总。</p>\n  <p><strong>刘缨：</strong>我非常同意高总说的，不光是形势变化了，是LP变化了，LP变化了对GP的要求就高了。我们以前擅长同类型的赛道，我要去找哪个赛道，在这个赛道我要找哪些企业，基本上我们能找到前三名的，拼命投一把，剩下就投后了，但现在不是这样的。我们有很多很多的条件，我相反觉得现在的创业者比我们以前去找的创业要成熟多了，以前他受的教育或者训练可能不是全面型的，但现在很多出来创业的年轻人非常专业，综合性发展非常好。其实我们不需要管太多，我们需要协调的是在LP跟合适企业之间的勾兑，我觉得这一点还是很重要，如果我们做不到这一点，我们既没有办法投好企业，也没有办法完成LP的要求，这是对GP更高的要求。</p>\n  <p>对于创业者来说，我现在投的这些项目相反管得更少，并没有说像以前季报每个都看，都去研究，我会管得少很多，因为他们自己做得很好。但是像您刚才说的，我需不需要帮他打开某个市场，这一点量力而行。比如我投的医院有一个新药，这个新药非常适合这个医院，我会把他们捏在一起，但还是要看他们自己的合作能力。</p>\n  <p>我记得去年投的一个做卫星的企业，我买几颗卫星，几百万的事，搞了有什么用呢，难道卫星放在我们家吗？所以我们做GP是量力而行，也不要去干扰人家的企业。你要投一个企业，它如果连自己的市场都搞不好，为什么还要投它呢？这是我们这一类投资人的心态。</p>\n  <p><strong>冯大刚：</strong>所以确实比过去更难了，要求更高了。</p>\n  <p><strong>王啸：</strong>现在我觉得整个投资行业有几个特点，过去美元基金是在中国寻找一些和美国模式类似的公司过去中国移动互联网基本上都是这样的大逻辑。过去人民币基金核心逻辑是投资未来符合上市条件的公司，因为我们的人民币基金基本都是从PE阶段往VC阶段延伸的。</p>\n  <p>目前新的环境是什么呢？新的环境是美元相对来说不如以前活跃了，中国现在的要求是什么呢？我们要在科技竞争当中跟美国掰手腕，人民币的国资和地方引导基金成为重要的出资人，以政策为导向，，这个新的形态本质上来讲是让中国的创业者站在了科技的前沿和中美竞争的前沿，包括硬件出海，模型能力，应用等等，本质上来讲让我们整个创业跟美国基本上站在了同一领域进行竞争，这其实是一个非常不同的路径，也就是说现在想抄美国的模式已经有点难了，因为美国还没做出来呢，我们要先做出来。</p>\n  <p>对VC的要求是什么？第一个要在中国语境下能够适应各种环境募到钱，并且能平衡到各方LP的诉求。第二在没有作业可以抄的情况下，如何提前判断抢先入局，在共识容易迅速形成的阶段，能够提前一步或者半步布局。因为共识形成太快了，像脑机接口、核聚变等等，一旦形成了共识，每月融一轮，每月估值翻一倍，只要差一个月就差一倍，如果两个月就是四倍，这种情况下如何入局，对VC提出了更高的要求。第三个在AI加持情况下给VC的组织形态、人员组成，内部信息的流转，和研究机制，提供了一个更好的基础。比如我把我的方法论、过去的判断都喂给龙虾，它的判断能力是相当不错的，它能够找到BP以及跟创始人会谈中的逻辑漏洞，问题在哪儿，它会提醒你。它的判断力经过不断培养，已经达到了相当好的程度，甚至可以补充盲点。但你也不能依赖它做决策，但它能对你进行提醒，帮助，汇总，和项目的梳理。</p>\n  <p>所以我觉得AI对整个VC的组织形态有一个非常大的提升，也是一个非常好的工具和方法。VC行业变化确实非常大，所以你会觉得现在整个中国VC行业跟几年前好像完全不一样了，活跃的人不一样了，这就是因为环境巨变之后有些人敢赌上来了，有些人消沉了。行业巨变后，70%—80%在这个行业里面变得不活跃了，只有少数人可以穿越周期。VC行业周期性也非常强，能够穿越周期的人本身并不多，而且每一波变化最后的底层和本质都不一样。如何抓住最底层的东西，适应它，对VC来讲也是非常大的挑战。</p>\n  <p><strong>冯大刚：</strong>非常好！三位从三个不一样的角度，为什么行业变了？因为我们上游的变了，我们下游变了，路线图、参照系都表了。刚才大家提到是不是创业也变了？因为我自己也做投资出身，创业跟今天是很不一样的，过去怎么能想象一个项目还没出来，还没有造出任何产品，一亿美元，两亿美元，一堆人，一两百个机构去上，这些事全部都是过去不能想象的。我们也想象不到一家公司成立一年收入好几亿，这些事情都是跟过去不一样的，所以我们又转过来，啸哥开始，怎么看创业的变化？</p>\n  <p><strong>王啸：</strong>第一个，现在整个国家的核心驱动本质上来自于科技和股权的驱动，所以对科技的投入多了。</p>\n  <p>第二个，把整个社会的积极性调动起来了，因为几年就有市值几千亿的公司，所以整个社会的积极性，包括地方政府、科研院所的教授、各种各样的人都调动起来了。以前创业是在一个非常小的圈子里，互联网、IT、工程师，那个圈子非常小。但现在整个创业的圈子从南到北，很多人都想着怎么创业，整个社会的积极性完全被调动起来了，所以热潮非常大。但泡沫过去之后总会有一些好的公司沉淀下来，所以有泡沫不完全是坏事，可能在这个过程当中消耗了一些社会的资本，但是从长期来看它依然会产生很多优秀的科技公司，这就是我们国家现在需要的。我觉得现在泡沫并不小，但是实话实说VC投的事情本质都是在买梦想。但确实要有逻辑和积累。一旦LP在里面挣不到钱了，整个体系迅速趋冷，我觉得这大概率会在未来发生，因为现在太热了，但是它会有个周期慢慢回去。</p>\n  <p><strong>冯大刚：</strong>刘总怎么看这个滚烫的时代？</p>\n  <p><strong>刘缨：</strong>是有点浮躁。其实我们软银二十几年投资的历史，以前刚进中国的时候经常遇到一个IDEA，拿一个BP过来就拿一大笔钱走，这个是很正常，我并不觉得多么吃惊。但是我还是讲一点，因为我们美元也有，人民币也有，美元是一个长线资本，美元来到一个热点领域就是以亏钱为主，所以一个起来整个基金就起来了，整个基金成本都弥补掉了，所以美元和人民币是不一样的，LP不一样的话投资的方向和投资承压能力是不同的。</p>\n  <p>二十多年后回过头去看，现在的环境虽然很类似于以前百花齐放的环境，但以我们现在的经验来讲就不会跟着那么多风口去抓泡沫了，我们还是会仔细分析项目的市场团队，本质的东西。我觉得可能会有所起伏，但是大量的钱烘托一个行业是这个行业起来的根本，如果没有钱去烘托人工智能、AI、具身机器人以及具身机器人的系统，没有大量钱去烘托的话这个行业起不来，现在这种现象都很正常。不同的基金有不同的嗜好，有不同的策略，我觉得都是正常的，但是很明显现在是过热了。</p>\n  <p><strong>高宇辉：</strong>海水和火焰并存的一个阶段，对创业者，我认为是一个千载难逢特别好的机会，尤其是十五五规划的“9+6”，9个战略性新兴产业加6个未来产业，为什么这么说呢？还是回到今天强调的AI。</p>\n  <p>AI、大模型已经把全部人类的知识“吃了一遍”，这就意味着“一人公司”原来是不可想象的，现在出现了。就是一个人已经可以调动全部人类的知识去干你想干的事情，大家想想这里面有多少创业机会。有个跟过去不一样的用人的观，过去说某个人“眼高手低”，特别能想象，净出一些离经叛道的点子，在过去这是一个贬义词，也许将来这是一个褒义词。因为眼高以后在AI的加持下未必手会低，所以这是非常值得欣喜的。你看中国人多聪明，像最近横空出世的张雪，这类人如果在AI的加持之下想象空间是巨大的，我们甚至可以把所有原来的行业再改造一遍，这对我们投资人非常有吸引力。</p>\n  <p>但是另外一边我们也确实有些担忧，刚才说的LP结构变了。大家可以统计一下做投资的国有资本累计加总有多大金额了。这样情况下会产生“垒大户”。不乏一个月一轮融资的。为什么会这样呢？国有资本都攥着大把资金，但是这些大把资金有一个硬约束，就是不能亏，不能亏导致都去投明星项目，投明星项目就会出现你也看好这个，我也看好这个的相互背书现象，最终变成大家一起追逐少数一些热点，导致项目估值泡沫。</p>\n  <p><strong>冯大刚：</strong>这个叫抱团取暖或者互相免责。</p>\n  <p><strong>高宇辉：</strong>资金集中使得这些热点项目发展一日千里，但它真正的工程化、产业化落地的进度能否按期到达，其实是打个问号的。</p>\n  <p>越是这样的情况，真正长期主义者，传统的创投机构越要稳住，在这个过程当中不要盲目“垒大户”、追热点，而是真正看底层逻辑，是不是这个发展方向，未来成功的概率到底有多少。特别是现在很多热点领域，技术路线根本没有收敛，假设你有巨大资本的情况下可以多追一些热点、分散布局，但是作为我们以市场化资金为主的投资机构，我们还是需要冷静地分析最可靠、最稳妥的一些方式，挑选成功概率最高的来投。</p>\n  <p><strong>冯大刚</strong>：我们进入到第四个问题，这个问题需要大家简单回答的一个问题，各位在今天的浪潮里面，有没有一个判断是：我绝对不能错过的一个投资机会。我的意思是，虽然大家都说我们在投AI，但是有的人在投软件，有的人投硬件，有的人投模型、有的人投应用，有的人投产业深处，有的人在投海外增量，大家心中甚至都不想跟别人分享看好的东西，别人都没有看出来，但我知道那是什么，那个东西太重要了，那个判断是什么？我们还是从高总开始。</p>\n  <p><strong>高宇辉：</strong></p>\n  <p>低空经济。仔细分析了后，我们会把很多时间精力和投向放在低空经济，因为“9+6”里面低空经济至少能覆盖6-7个产业，而且这是一个长坡厚雪，未来是十万亿的赛道。例如低空经济可以延伸到新能源、AI、新材料等等。比如说延伸到AI，无论是驾驶舱自动驾驶，还是空域管理，空域线路规划未来全部都要用到AI。低空经济是我们不愿意错过，而且会重点布局的领域。我们在深圳组建了低空经济产业基金，所以我们会在这个产业赛道里面深耕下去，做深做透做好。</p>\n  <p><strong>冯大刚：</strong>做低空经济的可以找高总。</p>\n  <p><strong>刘缨：</strong>我们可能会更聚焦于AI，我们有一个专门的AI聚焦，专门投AI基金对传统产业的改造，这一块是我们关注的重点，比如对医疗，对仓库系统，无人驾驶技术的更迭，还有具身机器人的软件，这是我们比较关注的一点。</p>\n  <p><strong>冯大刚</strong>：很务实的方法，千行百业的改造。</p>\n  <p><strong>刘缨：</strong>对。</p>\n  <p><strong>王啸：</strong>AI作为新的生产力或者巨大的能力需要终端，如果跟人交互的话，需要除了手机以外更大的一个终端，如果跟生产力结合就是机器人。AI需要一个落地的，能够走入现实世界当中的“端”，To C很有可能是眼镜或者是智能硬件，To B很有可能是各种各样的机器人，所以我觉得这些都是我们在关注的。</p>\n  <p><strong>冯大刚：</strong>今天有一位嘉宾没有来现场，他嘱咐我这个问题的答案，他的答案是AI For Science，他说一般的AI公司，比如苹果公司可以到1万亿美元，AI公司可能到5到10万亿美元，但是AI For Science可以到20万亿美元，这是每个人的判断。</p>\n  <p>我们进入最后一个问题，五年以后你们还在做投资吗？我经常跟各种各样的投资人聊天，最近出现了很多分化，有的投资人特别兴奋，觉得机会来了，刚才说的20万亿，他觉得过去没有机会做20万亿的公司。还有的人觉得说LP结构变了，我也不愿意侍候，我们做一些分基金，把品牌授权给他们，自己退出一线，享受红利就好了。各位怎么看这个问题？</p>\n  <p><strong>王啸：</strong>五年后肯定还是会做的，十年以后也许还在做。投资就是看你对它的理解，和你到底想要得到什么。LP本身结构变了，需要投入一些精力，但并不代表投资不能做了。社会的大潮发展滚滚向前，永远有新的东西，永远可以每天跟创业者聊新的项目和新的想法，而且跟最聪明、最有梦想的那一批聊天，这个过程本身是愉悦的，结果我觉得也会是好的。因为正好在科技大航海时代，肯定有机会能投到好项目。以前都是万亿美金的美国公司，现在我认为中国绝对存在从 0 起步，发展成万亿美金公司的机会，这就是大势所在。</p>\n  <p><strong>刘缨：</strong>只要基金在，你就得做。我们现在募的基金基本上都是12年的，这么长期的基金既然自己SET的基金那跪着也要做完。我觉得做还是会做，但是我个人的方向，我团队当然还有年轻人，我个人的方向肯定会去偏重一些产业方向。因为做久了有很多上市公司是自己投出来的，可以跟他们合作，去在这个产业方向上做，会更聚焦一点，会把精力跟资源更聚焦在一条线上，这是我个人的一些爱好。可能一些年轻的Founder，会有一些年轻的伙伴沟通、去投资、去研究，去看，去帮助，我们做得时间久的人会在产业资源上给他们一些帮助。所以在我们公司内部也会有基金的一些分类，做还是会做的。</p>\n  <p><strong>高宇辉：</strong>我进入到这个行业，就是看到这个行业没有退休的限制，只要你想干，八九十岁照样干，这是多有趣的一个行业。每天接触最聪明的头脑、最有趣的灵魂、最新颖的点子，最后看着一个小火苗变成熊熊大火，甚至带着燎原之势，而且在人类整个发展过程当中做出了重大贡献，你在这个过程中能助力它一把是非常开心的。总之只要能干得动就会干。</p>\n  <p>现在小小的波折真的不算什么，放在整个历史大的背景和周期大的背景，你会发现这是一个小小的调整，而且这种调整假如剥开中美对抗的外壳之外，会涌现多少机会啊！萝卜青菜各有所爱，只要你热爱这个行业，我认为并不是一个时间限制的问题。</p>\n  <p><strong>冯大刚：</strong>非常好的契合了我们的主题，熊熊大火，今年盛夏！</p>\n  <p>今天整个大会的第一个论坛就结束了，我们希望从相对宏观的角度让大家理解周期、投资、创业到底发生了哪些变化，今天非常感谢三位嘉宾帮我们非常好的解答了这个问题，谢谢三位，我们明年再见！</p>", "category": "tech", "published_at": "2026-07-21T09:05:17+00:00", "fetched_at": "2026-07-22T02:10:26.304120+00:00", "fingerprint": "fd70e9f092fc5877"}, {"source": "36氪 - 最新文章", "title": "独家 | PICO创始人周宏伟将卸任，李晓凯成为新任业务负责人", "url": "https://36kr.com/p/3905176863721349?f=rss", "summary": "<p>&nbsp;</p>\n  <p>文 | 李炤锋</p>\n  <p>编辑 | 张雨忻</p>\n  <p>智能涌现独家获悉，字节旗下XR（扩展现实）业务PICO近日完成业务负责人调整：由于个人规划原因，创始人周宏伟不再担任 PICO 负责人，李晓凯接任负责人，全面负责PICO业务。</p>\n  <p><strong>据了解，此次管理交接不会影响PICO既定的战略方向、研发工作和产品计划。今年，PICO将按计划带来全新的混合现实（MR）产品。</strong></p>\n  <p>作为 PICO 创始人，周宏伟在过去11年间为PICO的成长作出了重要贡献。PICO 内部已发布通知，确认周宏伟将离开公司，对周宏伟的长期投入与付出表示感谢。</p>\n  <p>李晓凯拥有多年消费电子及硬件产品研发与管理经验。自2021年加入PICO以来，他负责PICO核心产品与技术建设，带领团队推进MR产品及前沿产品方向的研发与探索，并持续提升PICO在光学显示、芯片、感知和系统架构等领域的技术能力。</p>\n  <p>字节内部人士也表示，公司对XR长期价值的判断没有变化，将继续支持PICO推进核心技术探索和产品创新。</p>\n  <h3><strong>从周宏伟到李晓凯</strong></h3>\n  <p>公开资料显示，李晓凯本科毕业于浙江大学，随后在耶鲁大学取得博士学位，在博士阶段主要研究光电材料与器件。</p>\n  <p><strong>李晓凯加入字节时，正值字节推进收购PICO的关键节点。</strong></p>\n  <p>彼时，他负责字节与PICO团队的收购对接，并在北京、上海和深圳招募显示光学、传感器、人类视觉系统、色彩及图像技术等方向的人才。</p>\n  <p>2021年8月，字节正式完成对PICO的收购。此后，李晓凯进入PICO体系，工作范围扩展至核心产品和底层技术建设。</p>\n  <p>周宏伟曾在歌尔股份工作近十年，并担任过歌尔股份副总裁。2015年，他带领原歌尔硬件团队创立PICO，主要研发VR一体机。</p>\n  <p>事实上，PICO创立后，歌尔一直长期担任PICO的供应链合作方。而在被字节收购前，PICO已先后推出PICO Neo等产品，并成为国内VR一体机市场的主要厂商。</p>\n  <p>被字节收购后，周宏伟继续担任PICO业务负责人，并先后推进PICO Neo 3、PICO 4和PICO 4 Ultra等产品。</p>\n  <p>2024年8月，周宏伟以PICO总裁身份出席PICO 4 Ultra新品沟通会。会上他曾披露，PICO应用商店已有超过900款应用，合作开发者超过500家，业务覆盖60多个国家和地区。</p>\n  <p><strong>PICO 4 Ultra也成为了周宏伟任内推出的一代主要硬件产品。如今，新一代MR产品进入发布周期，PICO产品迭代的接力棒，正式交到了李晓凯手上。</strong></p>\n  <h3><strong>PICO转向新一代MR产品</strong></h3>\n  <p>今年3月，PICO正式公布新一代操作系统PICO OS 6，并首次预告代号为“Project Swan”的新一代旗舰MR设备。PICO方面此前确认，该产品将在今年内发布。</p>\n  <p>公开信息显示，Project Swan将采用MicroOLED显示方案，并配备PICO自研的MR芯片。</p>\n  <p>该产品的平均角分辨率约为40 PPD，中心区域超过45 PPD。角分辨率主要衡量用户在一定视野角度内实际看到的像素数量，数值越高，文字和图像显示越清晰。</p>\n  <p>PICO方面称，其自研芯片主要处理实时感知、空间计算和成像任务，系统感知延迟可以降低至12毫秒。Project Swan还将采用双芯片设计，由另一颗主芯片负责通用计算和图形渲染。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_f9d91e9be42c4f2fa6784307d7dc49d2@6252890_oswg1163074oswg1600oswg900_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">PICO正转向新一代MR产品</p>\n  <p><strong>PICO OS 6将产品定位从单一VR应用进一步扩展至空间计算。</strong></p>\n  <p>新系统支持在空间环境中同时运行安卓应用、浏览器和3D内容，并兼容OpenXR、WebXR、PC VR串流等开发及应用体系。PICO还为开发者提供桌面模拟器，使部分空间应用可以在没有头显设备的情况下完成调试。</p>\n  <p>有分析指出，Project Swan的产品形态更接近苹果Vision Pro及三星Galaxy XR等高端MR设备，PICO也在将使用场景从VR游戏扩展至多任务办公、空间应用和内容消费。</p>\n  <p><strong>这一产品方向与字节近三年对PICO的内部定位一致。</strong></p>\n  <p>去年11月，在第五届字节跳动奖学金颁奖典礼上，字节跳动技术副总裁杨震原首次系统披露了字节收购PICO后的两条产品路线。</p>\n  <p>杨震原表示，字节跳动的发展与硬件革新密切相关，大屏手机和高清摄像头构成了抖音、TikTok等产品发展的基础，XR则可能带来新一代交互体验。</p>\n  <p>据杨震原介绍，字节收购PICO后，曾同时推进两条路线：一条围绕当时的产品形态投入视频、直播和营销资源；另一条投资基础技术，推动核心体验升级。</p>\n  <p>“2023年，我们决定削减营销预算，专心打磨产品，把资源更多投入到技术和体验创新上。”杨震原在活动中提及了PICO的业务路线变化，“这个调整还带来了一些误解，不少人说字节不做这个方向了。其实恰恰相反，2023年开始，字节在XR上的技术投入比以前更多。”</p>\n  <p>他表示，PICO在2022年决定启动自研XR芯片，该芯片在2024年回片，并已经进入量产阶段；团队同期推进MicroOLED显示、微透镜、手势识别及空间感知等技术。</p>\n  <p><strong>从市场格局来看，PICO目前仍是国内消费级VR市场份额最高的厂商。</strong></p>\n  <p>CINNO Research数据显示，2024年中国消费级XR设备销量约为56.7万台，其中PICO占国内消费级VR市场约54%，位列第一。PICO 4 Ultra是当年国内VR市场的主要新品之一。</p>\n  <p>在全球市场，Counterpoint数据显示，PICO在2024年多个季度的XR头显出货份额约为5%至10%。Meta仍占据全球VR市场主要份额，PICO则是Meta之外少数持续推出消费级一体机的厂商之一。</p>\n  <p>目前，全球XR产品形态正在分化。传统VR头显仍以游戏和娱乐为主，MR设备开始向空间计算、办公和企业场景延伸，AI眼镜则成为另一条增长路线。在这一市场变化中，Project Swan承接了PICO从现有VR一体机向新一代MR产品延伸的任务。</p>\n  <p>李晓凯接任后，新一代MR产品的发布，以及PICO OS 6从开发者早期体验走向正式应用，将成为其首先需要推进的产品工作。</p>", "category": "tech", "published_at": "2026-07-21T09:34:21+00:00", "fetched_at": "2026-07-22T02:10:26.304116+00:00", "fingerprint": "f40f639fce50cbde"}, {"source": "36氪 - 最新文章", "title": "茅台涨了100元，白酒还欠3000亿", "url": "https://36kr.com/p/3905234473158279?f=rss", "summary": "<p><strong>作者&nbsp;|&nbsp;</strong>谢芸子</p>\n  <p><strong>编辑&nbsp;|&nbsp;</strong>张帆</p>\n  <p>茅台涨价也没能“扶起”白酒的颓势。</p>\n  <p>7月21日发稿前，贵州茅台股价回落1.47%至每股1308元；万得白酒指数也同步下跌1.47%至2926.9。</p>\n  <p>就在一个交易日前，受飞天茅台提价影响，整个白酒板块“高开高走”。古井贡酒涨停，包括贵州茅台、泸州老窖在内的诸多酒企皆涨超5%。</p>\n  <p>短短一天之内，市场情绪迅速降温，在消化提价利好后，投资者又开始重新审视白酒行业的结构性困境。</p>\n  <p>此次提价发生在7月18日。</p>\n  <p>当日起，2026年飞天53度500ml贵州茅台酒的官方零售价，由每瓶1539元调整为1639元，销售合同价由每瓶1269元上调至1369元。</p>\n  <p>今年3月末，飞天茅台才刚刚告别“1499时代”，零售价上调40元至1539元/瓶；出厂价由1169元上调至1269元。彼时公司称，涨价是为了“稳住核心价格基本盘，修复渠道利润空间”。</p>\n  <p><strong>而本次提价，茅台给出的理由是本着供需适配、量价平衡的原则，“随行就市”。翻译成人话——茅台希望其官方售价能越来越接近市场流通的真实价格。</strong></p>\n  <p>36氪查询“今日酒价”，本轮提价公告发布的7月17日，飞天茅台的市场价格接近1650元；尽管每次提价，市场批发价几乎都会上涨，倒手就能赚钱的“炒货”空间却在消失。这恰恰是茅台最想要的结果。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_77d7efcaaa5445259ef243748cd53a90@394564713_oswg1083223oswg858oswg315_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">图片截自“今日酒价”</p>\n  <p>过去三十余年，白酒行业的增长逻辑简单粗暴，酒厂只需搞定经销商、完成压货即可兑现营收。但在供需错位、动销停滞的情况下，传统的B端分销模式已走到尽头。</p>\n  <p><strong>2026年一季度，中国酒业协会统计，白酒行业的社会库存总价值突破3000亿元，白酒上市公司的存货总额超过1700亿元，行业平均周转天数900天。</strong></p>\n  <p>酒业分析师肖竹青告诉36氪，除飞天茅台等极少数头部品牌，次高端、区域酒企的渠道库存普遍积压半年至数年。“经销商卖一瓶亏一瓶，价格倒挂是常态。”</p>\n  <p>这些都导致，酒企们不得不进行市场化的C端转型，直面消费者。<strong>区别在于，茅台有自救的底气。</strong></p>\n  <p>2022年，“i茅台”正式上线，产品定价权逐渐从经销商手中回归集团。财报数据能更直观体现这种“此消彼长”的态势。‌</p>\n  <p>2025年财年，‌包括“i茅台”在内的直销渠道，营收占比突破‌50%‌，达到‌845.4亿元‌，首次超过批发代理渠道。</p>\n  <p>这标志着，贵州茅台的销售结构已发生重大转变。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_cedae6b3c7a14739a0c042b1758c8c5e@394564713_oswg114147oswg1387oswg787_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">36氪根据Wind数据制图</p>\n  <p>董事长陈华曾定调，茅台正通过营销体系从“渠道推动”转向“消费者拉动”。</p>\n  <p>“我们会动态监测市场供需变化、消费趋势、渠道库存及终端动销情况，结合不同产品、不同区域的差异进行科学分析研判（产品价格）”“不能大起大落”。</p>\n  <p>需要注意的是，“随行就市”意味着随时调价。肖竹青也强调，未来的茅台价格不会只涨不跌。</p>\n  <p>据“i茅台”消息，茅台1935酒系列产品即将上线促销活动。</p>\n  <p>今年1月，部分产品已经历了一次主动降价。精品茅台酒从每瓶2969元直降至1859元，陈年贵州茅台酒（15年）更是从5399元降至3409元。<strong>茅台涨跌互现的定价模式已然确立。</strong></p>\n  <p>与此同时，从财务的角度而言，大单品的提价会直接增厚营收。</p>\n  <p>申银万国研报预测，茅台的第一次提价对2026年净利润增厚在2.5%-3%；第二次提价增厚约0.5%。预计公司2026-2028年的归母净利润同比增长4%、10%及11%。</p>\n  <p><strong>但整个行业的基本面远没有那么乐观。</strong></p>\n  <p>2026年上半年，在已披露业绩预告的8家白酒上市公司中，仅五粮液业绩预增——还是因为大幅调低去年同期基数所致的“数字游戏”。</p>\n  <p>此外，顺鑫农业预计净利润同比下降69%至79%；皇台酒业、水井坊皆为亏损。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_64b78139128c4f05b4acd68c76d32c04@394564713_oswg25585oswg771oswg476_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">白酒行业上半年财报预测；36氪根据公开资料制表</p>\n  <p>有分析人士认为，当前白酒的业绩下滑是“消费端、场景端、渠道端”长期的结构性矛盾。</p>\n  <p>“白酒的消费人群老龄化，年轻人没有喝白酒的习惯；过去以宴请、送礼为主的消费场景在坍塌；固有的经销商模式逐渐失效。”</p>\n  <p>在上述人士看来，白酒行业难以在短期内恢复规模性增长。肖竹青补充道，“整个行业积压的渠道库存至少要一到两年才能出清。未来决定企业价值的，不再是经销商的打款规模，而是货真价实的开瓶数和复购率。”</p>\n  <p>值得关注的是，在今年6月的股东会上，茅台管理层直接表示，此前与瑞幸合作的“酱香拿铁”、茅台冰淇淋等跨界项目，‌不符合长期的品牌战略‌。<strong>“不要网红要长红”“未来将谨慎推进此类合作”。</strong></p>\n  <p>这一选择的逻辑显而易见。</p>\n  <p>短期内，酱香拿铁吸引来的年轻人大概率不会为飞天茅台买单，与其用品牌稀释换取无效流量，不如把精力放在更有转化力的高净值人群上。<strong>问题在于，当整个白酒品类都被年轻一代抹去，“头等舱”的舱位会不会越来越小？</strong></p>\n  <p>清理库存、市场化调整只是第一步。活下来之后，包括茅台在内的所有白酒企业，都需要不断去思考，如何通过有效的产品创新适配下一代际客群的真实需求。这也是整个行业得以为继的关键。</p>\n  <p>*免责声明：</p>\n  <p>本文内容仅代表作者看法。</p>\n  <p>市场有风险，投资需谨慎。在任何情况下，本文中的信息或所表述的意见均不构成对任何人的投资建议。在决定投资前，如有需要，投资者务必向专业人士咨询并谨慎决策。我们无意为交易各方提供承销服务或任何需持有特定资质或牌照方可从事的服务。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_8e89367e4d504f9289eda105cfe821fc@394564713_oswg68085oswg901oswg518_img_png?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">关注获取更多资讯</p>", "category": "tech", "published_at": "2026-07-21T10:50:01+00:00", "fetched_at": "2026-07-22T02:10:26.304112+00:00", "fingerprint": "6c1db167cae91ea5"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨怡颗莓回应“检出致癌物”；美团否认上线“本科专送”“硕士优送”等配送服务；美方喊话三星电子、SK海力士分享超额利润", "url": "https://36kr.com/p/3906043683296648?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>字节XR业务PICO创始人周宏伟将卸任，李晓凯成为新任业务负责人</p>\n  <p>ZARA客服回应“阔腿裤存安全隐患”：专员正在核实处理</p>\n  <p>SpaceX将于8月4日发布上市后首份财报</p>\n  <p>恋与深空多平台账号停更</p>\n  <p>美国发布全球安全警示</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>怡颗莓回应“检出致癌物”：国内销售草莓来自云南</strong></p>\n  <p>近日，全球最大浆果品牌“怡颗莓”（Driscoll's）陷入食品安全争议。美国消费者对其提起集体诉讼，指控其草莓检出包括1类致癌物全氟辛酸（PFOA）在内的8种“永久性化学物”（PFAS）。</p>\n  <p>中国市场受此影响，山姆会员店、Ole'精品超市等线下渠道已全面下架怡颗莓产品，盒马、永辉、开市客等平台暂停销售。7月21日，怡颗莓客服对媒体回应称，国内渠道与美国涉事批次完全独立。云南是其在中国市场销售的主要产区，产品均符合相关标准及要求。客服还出示一份2026年6月15日的检测报告，报告显示，其出示的报告显示，送检样本361项农残检测均合格。（界面新闻）</p>\n  <p><strong>美团否认上线“本科专送”“硕士优送”“博士尊享”送外卖服务</strong></p>\n  <p>近日，“本科专送、硕士优送、博士尊享”外卖配送截图引发关注。截图显示，某火锅店配送选项按骑手学历分为4档，最高88元“博士尊享”，标注需导师批准。对此，美团客服回应称，平台从未上线按骑手学历划分收费的配送服务。当前配送价格仅与距离、天气、时段、运力等因素相关，不存在学历加价规则。（第一财经）</p>\n  <p><strong>美方喊话三星电子、SK海力士分享超额利润</strong></p>\n  <p>近日，美国助理贸易代表（USTR）里克·斯威策（Rick Switzer）向韩国贸易部长表达了一个想法：美国企业大量采购了韩国的半导体产品，尤其是内存、HBM、AI芯片等，对三星及SK海力士的惊人业绩作出了巨大贡献。因此，美国认为他们也有权分享三星、SK海力士的超额利润。</p>\n  <p>公开数据显示，三星电子2026年第二季度营业利润预估约89.4万亿韩元，第一季度实际营业利润达57.2万亿韩元，同比暴增756%；SK海力士一季度营业利润37.61万亿韩元，营业利润率高达72%，连续四个季度创新高。（第一财经）</p>\n  <h2>AI最前沿</h2>\n  <p><strong>月之暗面黄震昕：B端收入中AP调用占比达70%，已形成可持续的正向循环</strong></p>\n  <p>7月21日，月之暗面（Moonshot AI）B端企业业务负责人黄震昕透露，公司即将上线Kimi Hosted Agent平台，面向ToB客户开放沙箱与Harness能力，打造标准。化的企业级能力输出接口。据介绍，该平台提供PPT生成、投研系统搭建等标准化API，支持客户自定义输出风格，可直接嵌入企业内部办公系统使用。他还表示，当前B端收入中，AP调用业务占比达到70%，整体商业化路径清晰，已形成可持续的正向循环。（财联社）&nbsp;</p>\n  <p><strong>谷歌研发新型AI服务器芯片“Frozen v2”</strong></p>\n  <p>最新消息显示，谷歌正在研发一款内部代号为“Frozen v2”的新型服务器芯片，旨在更高效地运行Gemini模型。据报道，这款芯片将把Gemini模型部分架构永久嵌入到芯片之中，从而减少回答用户问题所需的计算量和数据传输量。谷歌工程师预计，与公司最新一代AI芯片——TPU（张量处理器）相比，Frozen芯片单位功耗可提供6至10倍的Token处理能力。受该消息影响，谷歌A（股票代码：GOOGL）美股早盘一度涨近3.7%，谷歌C（GOOG）最高时涨约3.9%。（科创板日报）&nbsp;</p>\n  <p><strong>北京：将布局建设Token工厂，力争下半年新增智能算力5万P</strong></p>\n  <p>从北京市经信局获悉，上半年，全市数字经济增加值增速7.8%，其中数字经济核心产业增加值增速9.8%，对全市GDP增长的带动作用显著。下半年，北京将推进人工智能全域赋能，推动智能翻译、智能同传等在文旅消费领域的应用。制定Token经济发展政策，围绕Token生产、分发和应用等关键环节，布局建设Token工厂、Token分发平台，推动在工业、教育、文旅等重点领域创新应用。举办“创赢未来”OPC专场路演活动，激发超级个体的人工智能应用与创作活力。开发面向OPC的AIGC培训精品课程，释放AIGC技术价值。依托开源芯片研究院、北京通明湖信息技术应用创新中心，打造“RISC-V+AIOS”开源开放生态，构建从芯片指令集到操作系统到智能体应用的全栈自主技术体系。进一步提升智能算力供给能力。打造“超级节点+行业节点”支撑体系，力争下半年新增智能算力5万P，年内算力总规模突破13万P。（财联社）&nbsp;</p>\n  <p><strong>阿里千问发布新模型</strong></p>\n  <p>7月21日，阿里发布最新图像生成基础模型Qwen-Image-3.0，这也是千问图像生成和编辑模型系列的第三代基础模型。新模型支持最大4.5k token超长输入，可一次生成涵盖公式符号、几何图形、逻辑推导步骤等多元素融合的知识图解、复杂UI界面，同时支持12国语言和20多款字体原生渲染。（第一财经）&nbsp;</p>\n  <p><strong>Meta与英伟达联手布局AI材料供应链</strong></p>\n  <p>社交媒体巨头Meta与芯片制造商英伟达周一宣布，共同参与一家英国AI初创公司的材料发现项目，旨在为半导体行业寻找新型制造材料。该初创公司此前已获得亚马逊创始人杰夫·贝佐斯和英国政府的投资支持。这家名为CuspAI的初创公司于本月早些时候完成4.5亿美元融资，估值达26亿美元。（新浪财经）&nbsp;</p>\n  <p><strong>腾讯混元推出智能体Hyra-1.0</strong></p>\n  <p>36氪获悉，7月21日，腾讯混元宣布推出Hyra（Hunyuan Research Agent)）首个版本Hyra-1.0。据腾讯混元介绍，这是一个能够递归自我改进、面向性能导向的研究与工程任务的智能体。除了模型研发与科学发现，Hyra还可以进入游戏、设计和内容创作等开放场景，根据自博弈、自评价和用户反馈持续迭代策略产物。&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>字节XR业务PICO创始人周宏伟将卸任，李晓凯成为新任业务负责人</strong></p>\n  <p>36氪独家获悉，字节旗下XR（扩展现实）业务PICO近日完成业务负责人调整：由于个人规划原因，创始人周宏伟不再担任PICO负责人，李晓凯接任负责人，全面负责PICO业务。据了解，此次管理交接不会影响PICO既定的战略方向、研发工作和产品计划。字节确认了这一变动：作为PICO创始人，周宏伟在过去11年间为PICO的成长作出了重要贡献。PICO内部已发布通知，确认周宏伟将离开公司，对周宏伟的长期投入与付出表示感谢。据了解，新业务负责人李晓凯拥有多年消费电子及硬件产品研发与管理经验，2021年加入PICO，负责PICO核心产品与技术建设。</p>\n  <p><strong>ZARA客服回应“阔腿裤存安全隐患”：专员正在核实处理</strong></p>\n  <p>7月21日，针对“阔腿裤存安全隐患”一事，ZARA官方旗舰店客服回应新京报贝壳财经记者称，相关问题已经反馈，目前正由专员核实处理，待有反馈结果将第一时间告知。据报道，ZARA一款阔腿裤因裤脚处设计宽松，在走路时面料容易包裹住脚导致摔倒，在海外市场遭到消费者“吐槽”。在社交平台，也有消费者称“ZARA的裤子一直都要裁一截”“它家裤子小个子根本没法穿”“现在很多阔腿裤都做得太长了”。（贝壳财经）</p>\n  <p><strong>长鑫科技：网上投资者弃购6586227股</strong></p>\n  <p>长鑫科技（688825.SH）7月21日公告称，公司首次公开发行股票并在科创板上市发行结果已公布。本次发行价格为8.66元/股，初始发行股份数量为668,808.8608万股，占发行后总股本约10%。最终战略配售数量为166,706.4720万股，网上发行最终中签率约为0.47141739%。</p>\n  <p>公告指出，网上投资者缴款认购3,844,517,273股，放弃认购6,586,227股；网下投资者缴款认购2,173,101,821股，放弃认购31,567股。联席主承销商包销股份6,617,794股，包销金额5731.01万元。超额配售选择权行使前，发行费用为2.81亿元。（财联社）</p>\n  <p><strong>特朗普宣布两年后对仿制药征收100%关税</strong></p>\n  <p>当地时间7月21日，美国总统特朗普在社交媒体发文表示，自2026年8月1日起，所有进口到美国的仿制药将在未来两年内继续适用零关税。两年期满后，相关产品将被征收100%的关税，期限为一年;此后，关税将进一步提高至200%。特朗普表示，实施这一政策的目的是推动仿制药生产回流美国。对于未能在规定期限内于美国建设生产工厂和相关设备的企业，将面临关税惩罚。针对专利药、品牌药和创新药的现行政策，由于实施效果良好，将继续维持不变。（央视新闻）</p>\n  <p><strong>加拿大总理回应美加征关税：单边贸易行动的最新举措</strong></p>\n  <p>7月21日电，加拿大总理马克·卡尼当地时间7月20日就美政府宣布对多种加拿大商品加征50%关税一事发表声明。卡尼表示，这是美国一系列单边贸易行动中的最新举措，违反了“美国一墨西哥一加拿大协定”（美墨加协定）。加拿大团结一致应对这些“对加拿大主权的威胁”，并正在采取行动保护其经济和公民。卡尼说，过去18个月来，美国一直在改变其各类贸易关系，包括美墨加协定涵盖的贸易关系，因此，加拿大提出了一系列详细而全面的建议，以解决当前争端并使美墨加协定现代化。他表示，“我们随时准备在未来几周内加强相关磋商。”（财联社）</p>\n  <p><strong>SpaceX将于8月4日发布上市后首份财报</strong></p>\n  <p>当地时间7月20日，太空探索技术公司（SpaceX）宣布，将于8月4日美股收盘后公布2026年第二季度财务及运营数据，这将是公司上市后的首份季度财报。市场关注此次财报不仅因为其将首次披露SpaceX上市后的财务表现，还因其触发公司历史上规模最大的内部人士限售股解禁。根据分阶段限售协议，SpaceX发布首份财报后的第二个交易日，最多约9.115亿股符合条件的内部人士及员工股票将解禁，占可解禁股份的20%。按最新股价计算，潜在流通股票价值约1090亿美元，规模超过公司IPO融资额。（界面新闻）</p>\n  <p><strong>被指员工陪老板演松弛感，影视飓风：太恶毒</strong></p>\n  <p>7月20日，有网友评论称，“影视飓风就是公司一群员工陪老板演松弛感白人”，暗示其轻松的工作氛围是刻意模仿西方人的表演。随后大量营销号放大该言论，指责该公司“假装松弛”。对此，影视飓风最新回应称，“最近看到很多营销号发这种解读，这也太恶毒了”。“原来合法合规纳税+全额社保六险一金+工作时间拍节目（不占用休息日，有独立奖金）+不断提升的公司待遇+众多宣传非遗和中国的节目=你是白人，虐待员工，逼人陪你演戏。骂别的可以，这个实在没法忍。”影视飓风方面表示。（界面新闻）</p>\n  <p><strong>恋与深空多平台账号停更</strong></p>\n  <p>7月21日，央视曝光乙女游戏“恋与深空”年龄门槛形同虚设。据报道，吴女士13岁的女儿偷��家长身份证注册仅限18岁以上用户的乙女游戏，数月累计充值近3万元。最让吴女士难以接受的是，该游戏一些场景中，存在虚拟角色“半裸”、举止暧昧甚至带有性暗示的擦边内容，严重影响未成年人身心健康。此前，该游戏因新男主宣发争议引发舆论热议，制作组曾三度发文致歉，宣布取消新男主“敖尹”的上线与开发安排，并承诺未来不再推出新男主。7月21日，查询发现，自7月8日起《恋与深空》多平台账号就未再更新，截至目前已经停更13天（海报新闻）</p>\n  <p><strong>小米上调手机出货目标，增量多为低端机型</strong></p>\n  <p>7月21日，界面新闻从供应链获悉，小米已将2026年全年智能手机出货目标从约9000万部上调至1.1亿部，增幅约16%，上调的增量部分主要来自低端机型。一位接近小米的人士告诉界面新闻，此次上调出货目标是小米内部认为当前的存储行情有望迎来反转。受上游存储芯片的短期与成本持续上涨，小米在今年曾两次下调其出货目标。上述人士还表示，此次小米上调出货目标带来的信号是，存储下游的厂商已经不愿意再为持续攀升的存储成本买单了，当需求端的容忍度触及天花板，价格上涨的动能便可能出现拐点。（界面新闻）</p>\n  <p><strong>美国发布全球安全警示</strong></p>\n  <p>当地时间7月20日，美国国务院发布“全球安全警示”，建议世界各地的美国公民提高警惕。美国国务院称，中东紧张局势加剧，安全环境复杂，存在局势意外升级的风险。</p>\n  <p>美国国务院表示，目前身处中东的美国公民应保持高度警觉，并为航班取消、空域阶段性关闭及其他旅行中断做好准备；中东地区以外的美国公民则应重新考虑前往或经由该地区旅行。美国国务院还表示，包括中东以外地区在内的美国外交设施已成为袭击目标。伊朗及其支持者可能针对美国在海外的利益、全球范围内美国相关场所或美国公民发动袭击。（第一财经）</p>\n  <p><strong>美国法官批准涉Anthropic的15亿美元版权诉讼和解协议</strong></p>\n  <p>据报道，当地时间7月20日，美国加州北区联邦法官Araceli Martinez-Olguin批准涉及人工智能公司Anthropic的一项15亿美元和解协议，驳回关于赔偿金额过低的异议。该协议旨在解决由作家团体提起的集体诉讼，这些作家于2024年指控Anthropic未经许可使用其著作训练旗下AI聊天机器人Claude。（界面新闻）</p>\n  <p><strong>全球同步研发创新药在中国首报首发</strong></p>\n  <p>据国家药监局，一款在全球同步研发、同步申报的新靶点创新药今天在中国率先获批上市，实现全球多中心研发的原创靶点创新药，在中国首报首发的历史性突破。</p>\n  <p>据了解，该创新药名为“选择性食欲素2型受体激动剂”，用于治疗16岁及以上青少年和成人的1型发作性睡病。国家药监局药品注册司化学药品处处长徐晓强表示，这款创新药向中国、美国、日本等国家同步提交了药品上市注册申请。中国在全球范围内第一个批准它上市，标志着中国在“全球新”药物研发领域，从靶点原创到同步推进国际多中心临床，再到注册上市，实现了全球范围内首报首发的历史性突破。（界面新闻）</p>\n  <p><strong>消息称三星电子规划未来5年在韩国建成4座晶圆厂</strong></p>\n  <p>据ZDNETKorea，三星电子近期就中长期半导体产能投资战略的可行性向主要合作伙伴征求意见，其中提到了未来5年在韩国建成4座晶圆厂的规划。三星半导体在韩新晶圆厂规划包括平泽P5和P6、龙仁首座晶圆厂、光州首座晶圆厂。三星电子此前宣布计划在光州投资约400万亿韩元，建设两座新的半导体晶圆厂；同时龙仁晶圆厂集群的进度也将加速。（财联社）</p>\n  <p><strong>英特尔将在数据中心部门裁员</strong></p>\n  <p>据报道，英特尔告知其数据中心部门员工，公司计划启动新一轮裁员。英特尔发言人在一份声明中表示：“为落实整体战略，打造业务更聚焦、运营更高效的企业，公司数据中心事业部正调整组织架构，匹配适配长期业务发展的岗位与人才，夯实长期发展根基。我们将尊重所有受影响员工，并配套相关帮扶资源，平稳过渡本次人员调整。”（界面新闻）</p>\n  <p><strong>台积电回应中央硝子被曝停产高纯度六氟化钨：供应多元，不受影响</strong></p>\n  <p>据报道，市场近期传出，供应台积电等半导体大厂气体的特种气体供应商中央硝子（Central Glass）将停产高纯度六氟化钨。对此，台积电表示，目前不预期对公司营运产生影响。台积电公关处于7月20日完整回应提到，“公司全球采购布局策略，是持续开发多源供应方案、建立多元的全球供应商。我们目前不预期对公司营运产生影响。”台积电供应链与供应商皆提到，目前看气体钨粉原料无断供，仍有多项替代方案，预期对产业影响有限。（界面新闻）</p>\n  <p><strong>特朗普政府宣布：到美国建厂铝关税打对折</strong></p>\n  <p>特朗普政府宣布激励措施，在美国新建、扩建或翻新铝厂的企业从国外进口该金属可享受关税折扣。根据这项周一公布的方案，对于符合新要求并获得美国批准的公司，铝的进口关税将从50%降至约25%。特朗普为提升国内铝产能下令征收50%的关税。但迄今为止他的努力收效甚微，且许多国家都游说美国政府降低关税。（新浪财经）</p>\n  <p><strong>高盛称对冲基金以创纪录速度抛售美国科技股</strong></p>\n  <p>据报道，高盛集团的主经纪商业务部门指出，过去两个月对冲基金撤出美国科技股的速度达到创纪录水平。以Vincent Lin为首的该团队分析称，这类基金过去八周的六个星期都是该板块的净卖方。市值累计遭减持的幅度约达10%，创出十多年前开始统计该数据以来之最。该部门表示：“在半导体/存储/人工智能基础设施板块持续震荡和被大幅抛售的情况下，6月初以来卖盘的持续性和规模表明科技投资者大幅减少了仓位，而且一些投降迹象也开始出现。”（界面新闻）</p>\n  <p><strong>3567亿股票ETF，逆市抄底创纪录</strong></p>\n  <p>Wind数据显示，截至7月20日，全市场股票ETF已连续11个交易日获资金流入，区间累计净流入达3567亿元。其中7月17日单日净流入758.67亿元，为历史单日净流入规模第三高。仅上周，股票型ETF合计净流入就突破2036亿元，刷新历史单周最高纪录。（财联社）</p>\n  <p><strong>瑞银：继续看好科技和AI主线</strong></p>\n  <p>在7月21日最新发表的中国股票策略观点中，瑞银证券中国股票策略分析师孟磊表示，市场短期震荡后，继续看好科技板块和AI为下半年市场主线。</p>\n  <p>他给出三大理由：一是，受益于全球人工智能的快速发展以及国内政策的大力支持，科技板块有望维持强劲的盈利增长；二是，行业和主题ETF、科技赛道型主动公募、融资、私募等各类资金，有望持续边际净流入科技板块；三是，对科技板块的“抱团”在时间和空间上仍有进一步提升的潜力。（第一财经）</p>\n  <p><strong>智己汽车回应个别经销商车辆交付异常</strong></p>\n  <p>7月21日，智己汽车发布关于近期网络不实传言的声明：2026年7月7日，云南昆明智合悦行汽车销售服务有限公司（智己昆明两家经销商之一），因民间借贷导致资金链断裂，造成部分用户无法从金融机构取得车辆合格证上牌、车辆无法正常交付。同时，也影响到了该经销商的关联主体——珠海智��悦行汽车销售服务有限公司在珠海地区的车辆交付。事件发生当日，智己汽车第一时间成立专项工作组，并于第二天进驻现场，积极配合政府并协调相关方为用户提供后续服务。截至7月17日，智己汽车已基本完成用户的对接与情况梳理，并已于7月18日起陆续恢复合格证发放与车辆交付。预计到本周末，可完成所有正常购车用户的订单及车辆交付。（界面新闻）</p>\n  <p><strong>Netflix时隔两年重返债券市场融资</strong></p>\n  <p>流媒体巨头Netflix周一宣布重返美国投资级债券市场，计划发行2036年到期的公司债券。这是该公司自2024年首次发行投资级债券以来，时隔两年再次进入债券市场融资。据知情人士透露，该批债券的初始价格指引为较同期美国国债收益率高出约95个基点。根据Netflix提交给监管机构的文件，本次发行所得资金将主要用于偿还今年晚些时候到期的约10亿美元债务，剩余部分将用于一般企业用途。(新浪财经)</p>\n  <p><strong>美股三大指数集体收涨，大型科技股涨跌不一</strong></p>\n  <p>36氪获悉，7月21日收盘，美股三大指数集体上涨，纳指涨1.29%，标普500指数涨0.89%，道指涨0.74%。大型科技股涨跌不一，英特尔涨超8%，特斯拉涨超2%，英伟达、奈飞涨超1%，苹果涨0.35%；谷歌、微软跌超1%，亚马逊跌0.98%，Meta跌0.32%。热门中概股跌多涨少，网易跌超3%，名创优品、腾讯音乐跌超2%，阿里巴巴、百度、拼多多跌超1%；富途控股涨超5%，爱奇艺涨超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>中际旭创：在港上市最高发行价不超1010港元/股</strong></p>\n  <p>36氪获悉，中际旭创在港交所公告，将在香港发行5450万股，最高发行价每股1010港元。预期股份将于7月30日在香港联交所开始买卖。</p>\n  <h2>投融资</h2>\n  <p><strong>月之暗面Kimi将以投前500亿美元估值洽谈IPO前最后一轮融资</strong></p>\n  <p>国内大模型独角兽月之暗面计划于8月启动上市前最后一轮融资谈判，目标估值为投前500亿美元。据知情人士透露，公司预计将在未来几天完成KimiK3发布前启动的一轮融资，该轮融资估值约投前315亿美元。融资完成后，月之暗面将立即启动新一轮融资洽谈，这将成为公司赴港上市前的最后一次私募股权融资。公司最快可能于6个月内登陆香港资本市场。（财联社）&nbsp;</p>\n  <p><strong>蚂蚁国际完成约12亿美元A轮融资</strong></p>\n  <p>7月21日，蚂蚁国际宣布已完成A轮融资。蚂蚁集团、以及包括阿里巴巴在内的一些现有股东和多家国际知名投资机构参与了本轮融资。本轮融资金额约12亿美元，将用于扩展全球业务，加速AI等前沿技术投入，拓宽跨境支付、全球账户等普惠金融科技服务，助力全球商家实现增长。（第一财经）&nbsp;</p>\n  <p><strong>“瑞莱智慧”完成数亿元B轮融资</strong></p>\n  <p>36氪获悉，日前，AI安全技术公司“瑞莱智慧”（RealAI）连续完成合计数亿元规模的B1轮和B2轮融资，投资方包括星连资本、招商局集团旗下数字贸易基金、卓源亚洲、卓源资本、福迪创投、水木清华校友种子基金等。本轮融资将重点用于安全可信大模型系统的持续研发与产业落地。&nbsp;</p>\n  <h2>酷产品</h2>\n  <p><strong>日本推出可移动人体冰箱售价6.3万：10分钟“速冷”</strong></p>\n  <p>近日，日本一款新奇发明引发关注，该设备外形酷似巨型冰箱，被称为“人体冰箱”，能给人体降温。这款冰箱设计灵感源自日本街头常见的冷藏自动售货机，设备内部恒温15°C，坐下后约5°C的冷风会吹向头颈、肩、背，迅速为全身降温。目前该设备售价150万日元(折合人民币约6.3万元)，主要面向企业等。（观察者网）&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260722/v2_334da9797a1c400b80ce53a94c4675f5@5667365_oswg294312oswg534oswg733_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">配图</p>\n  <p class=\"editor-note\"><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-21T23:55:35+00:00", "fetched_at": "2026-07-22T02:10:26.304106+00:00", "fingerprint": "5471a276c4393734"}, {"source": "36氪 - 最新文章", "title": "最前线|新奥聚变主办第四届氢硼聚变研讨会，企业估值已超百亿", "url": "https://36kr.com/p/3905241313527687?f=rss", "summary": "<p>7月21日至24日，由北京新奥聚变能源科技有限公司（简称新奥聚变）主办的第四届氢硼聚变研讨会在河北廊坊召开。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_22aff7296b4c4edebad292f111fe4902@6310669_oswg313853oswg1920oswg1280_img_jpg?x-oss-process=image/quality,q_100/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">第四届氢硼聚变研讨会现场</p>\n  <p>作为中国最早开展商用聚变能源开发的民营企业，新奥集团于2017年基于从低碳技术向无碳技术的研发升级，开启“无中子、低成本、商用化”的紧凑型聚变研发，重点布局球形环氢硼聚变技术路线。该技术路线具有清洁安全、燃料易得、成本低廉等优势，具有较大的商业化潜力。</p>\n  <p>2023年，新奥集团成为国家可控核聚变创新联合体成员，2026年开始参与国际托卡马克物理与工程活动（ITPEA），成为中国首家、全球第二家加入ITPEA的民营企业。同时，它也是国内投入最大、技术参数最领先的民营企业，目前累计投入超40亿元，建成两代球形环装置“玄龙-50”和“玄龙-50U”。</p>\n  <p>“玄龙-50U”是全球聚变唯一实现装置工程设计指标全面达标的装置，2025年以来接连取得了兆安级氢硼等离子体放电、秒量级1.2特斯拉强磁场、氢硼等离子体高约束模放电、电子温度破亿度等多项重大突破，综合参数达到全球最高水平，填补国内该技术路线空白。</p>\n  <p>7月初，新奥聚变刚完成首轮（Pre-A）融资，投后估值106亿元，是国内聚变领域目前估值最高的民营企业。融资资金将用于“和龙-2”的建设与调试、迭代核心技术以及扩充高端人才团队。</p>\n  <p>“和龙-2”装置作为氢硼聚变商业化路径中最核心的装置，旨在攻克氢硼聚变能量增益及系统性技术工程关键难题，夯实氢硼聚变商业化的技术根基与工程基础。该装置已进入工程建设阶段，计划于2027年年底建成投运。</p>\n  <p>按照规划，新奥氢硼聚变的商业化采取“三步走”策略：第一步，2026年实现氢硼聚变反应；第二步，2030年实现氢硼热核反应验证；第三步，2035年进入商业化示范阶段，实现低成本发电。</p>\n  <p>全球能源变革浪潮下，可控核聚变已成为各国战略必争赛道。全球近40个国家出台聚变专项研发战略，全球聚变产业呈现出竞合发展格局。氢硼聚变技术路线则是其中重要路径之一，由新奥主办的氢硼聚变研讨会从2023年开始，到今年已经是第四届。</p>\n  <p>据悉，此次研讨会的主题为“聚智氢硼、生态共赢”，涵盖内容包括氢硼核反应物理、氢硼等离子体物理、氢硼等离子体诊断、氢硼聚变技术与材料、创新与应用等研究方向，共有11个国家50余家科研机构的上百位专家学者参会。</p>\n  <p>本届研讨会上，新奥聚变团队代表彭元凯博士、石跃江博士、刘兵博士、郭栋博士，分别分享了新奥球形环氢硼聚变技术创新、“玄龙-50U”实验进展、氢硼理论与实验探索、“玄龙-50U”诊断技术发展等最新成果。</p>", "category": "tech", "published_at": "2026-07-22T01:30:00+00:00", "fetched_at": "2026-07-22T02:10:26.304093+00:00", "fingerprint": "e1fee3c496e12986"}, {"source": "少数派", "title": "App+1 | 把「从长视频截取片段」做到极致：Trimly", "url": "https://sspai.com/post/111569", "summary": "作为有多年专业音视频开发经验的技术工作者，我给自己，以及可能也有类似需求的你，做了一个把「从长视频里截取片段」这件事做到极致的产品。<a href=\"https://sspai.com/post/111569\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-21T03:00:02+00:00", "fetched_at": "2026-07-22T02:10:24.617511+00:00", "fingerprint": "da827af6ecf03c8d"}, {"source": "少数派", "title": "装上 Fedora 的 Surface Pro：一台老设备的新可能", "url": "https://sspai.com/post/112200", "summary": "给 Surface Pro 5 安装上仍在积极更新的 Linux 发行版，它会成为一台更可用的设备吗？<a href=\"https://sspai.com/post/112200\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-21T07:00:00+00:00", "fetched_at": "2026-07-22T02:10:24.617506+00:00", "fingerprint": "4474c4e020746029"}, {"source": "少数派", "title": "社区速递 150｜派友热议磁吸配件、拯救呼吸通气鼻贴与国产三折叠自行车", "url": "https://sspai.com/post/112582", "summary": "除了首页时间流和侧栏的精选展位，少数派Matrix社区还有很多优秀内容因条件所限无法得到有效曝光，因此我们决定重启Matrix周报，并在此基础上添加更多社区内容、作者投稿新玩意呈现给大家。上周社区速递 ...<a href=\"https://sspai.com/post/112582\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-21T09:00:00+00:00", "fetched_at": "2026-07-22T02:10:24.617502+00:00", "fingerprint": "ebdd0c35034d59af"}, {"source": "少数派", "title": "派早报：Google 推出 Gemini 3.6 Flash、Unity 7 引擎发布等", "url": "https://sspai.com/post/112597", "summary": "英伟达推出合成视频检测器 NIM、WordPress 曝出高危漏洞等。<a href=\"https://sspai.com/post/112597\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-22T00:30:00+00:00", "fetched_at": "2026-07-22T02:10:24.617494+00:00", "fingerprint": "8812714b666e17ab"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7466 CNY ↑+0.11%", "url": "https://www.frankfurter.app/2026-07-21?from=AUD&to=CNY", "summary": "<div>参考日期: <b>2026-07- uit against Udio, accusing the AI music generator of infringing the copyright of more than 30,000 of its songs, ranging from Elvis Presley's Hound Dog to Beyonc&#233;'s Say My Name, and Harry Styles' As It Was. The lawsuit, filed in a New York court on Monday, claims that this [&#8230;]", "category": "tech", "published_at": "2026-07-20T22:19:12+00:00", "fetched_at": "2026-07-21T02:12:24.025764+00:00", "fingerprint": "522573c781ea60fe"}, {"source": "36氪 - 最新文章", "title": "氪星晚报｜SpaceX将“星舰”第13次试飞推迟至7月23日；马斯克称特斯拉FSD会模仿驾驶风格；我国人形机器人整机产品超全球半数", "url": "https://36kr.com/p/3903710346790535?f=rss", "summary": "<h2><strong>大公司：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3903632074770050\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>摩根士丹利成为华尔街AI债务交易头号银行</strong></a></p>\n  <p>摩根士丹利已崛起为华尔街构建人工智能（AI）繁荣背后融资架构的主导力量，设计了新的债务和股权融资模式，为数据中心的大规模建设输送数百亿美元资金。据业内高管称，自去年以来，该行已成为主导顾问，牵头了规模最大、最具创新性的AI基础设施融资交易。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3903568287434630\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>三星电子晶圆代工正评估将美国泰勒厂的初期生产规模扩大至原计划的2倍</strong></a></p>\n  <p>据报道，三星电子晶圆代工正评估将美国泰勒厂的初期生产规模扩大至原计划的2倍。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3903538833704834\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>马斯克称特斯拉FSD会模仿驾驶风格</strong></a></p>\n  <p>7月20日，埃隆·马斯克已确认特斯拉FSD（Full Self-Driving）软件正在从过去的“通用型、一套方案适用于所有用户”的驾驶系统，转变为真正的个性化驾驶系统。 近日，一名特斯拉FSD用户在X平台上抱怨，车辆经常会在不该离开的位置驶出高载客车道或快速车道，主动退出左侧高效车道后进入拥堵车流，而旁边最左侧车道上的车辆仍然畅通无阻，非常令人烦恼。 对此，马斯克回应称：“车辆将开始记住你具体的人工干预行为，并根据每个人的个人偏好进行调整。”</p>\n  <p><a href=\"https://36kr.com/newsflashes/3903168228706180\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>月之暗面Kimi团队：算力紧缺，会员暂停开放</strong></a></p>\n  <p>36氪获悉，7月19日，月之暗面Kimi发布关于算力紧缺与会员暂停开放的说明，过去48小时，用户请求量已大幅超出预估，并且逼近现有集群的承载极限。为了保障已有订阅用户的体验，Kimi团队决定即日起，暂停C端新用户订阅，将已有算力全部投入于服务已订阅用户，保障已订阅用户的全部权益不受影响。同时已在全速推进算力扩容。随着新算力陆续到位，将逐步开放更多订阅名额直至全面恢复正常订阅。对于后续新订阅用户，Kimi团队将拆分Kimi主权益（包含Kimi Web，Kimi APP，Kimi Work）和Kimi Code权益，以方便更精准匹配算力，保障用户体验。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3903160957978496\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>SpaceX将“星舰”第13次试飞推迟至7月23日</strong></a></p>\n  <p>当地时间7月19日获悉，美国太空探索技术公司（SpaceX）表示，计划于7月23日再次尝试发射“星舰”火箭。16日，太空探索技术公司原定当天进行的“星舰”第13次试飞在点火阶段因部分发动机未能启动而自动中止。这原本将是太空探索技术公司今年6月上市后的首次发射任务。太空探索技术公司在该试飞取消后市值一度蒸发约1000亿美元。</p>\n  <h2><strong>新产品：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3903651458516869\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>奕境X9首台量产车成都下线</strong></a></p>\n  <p>36氪获悉，7月20日，奕境X9首台量产车在成都下线，即将进入上市交付阶段。作为奕境汽车首款战略车型，奕境X9定位“新一代家庭旗舰”。据介绍，奕境X9将会首批搭载鸿蒙座舱HarmonySpace 6，首发华为双17.2英寸蝶羽双联屏，配备HUAWEI XSCENE车载激光投影，搭配小艺智能体、舱内AI多模态感知系统AMS等新一代技术。</p>\n  <h2><strong>投融资：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3903639587489665\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>“Soloco”完成千万元级人民币种子轮融资</strong></a></p>\n  <p>近日，AI原生组织的操作系统“Soloco”近日完成千万元级人民币种子轮融资，本轮融资由原子创投领投，融资资金将主要用于人才引进与核心产品研发。据了解，公司核心团队来自 NASA、华为、字节跳动等机构和企业，以及哥伦比亚、港大、牛津、清华等高校，覆盖图论、多 Agent 编排、AI 基础设施等方向。产品将率先切入本地化0人公司运行场景。</p>\n  <h2><strong>今日观点：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3903585520371588\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>中信建投：Kimi K3模型达全球Tier1，国产模型再现DeepSeek时刻</strong></a></p>\n  <p>36氪获悉，中信建投研报指出，坚定看好AI产业趋势。我们认为，K3是本周全球大模型行业的分水岭事件，也是另一个DeepSeek时刻：K3的发布意味着中国大模型第一次以“竞争威胁”身份进入全球大模型叙事——2.8万亿参数 + 100万上下文+Code Arena登顶，证明国产模型已在Agentic Coding主战场与美国前沿模型正面交锋。其他建议重点关注应用层机会：1）K3提升了开源模型智能水平，应用层使用tier1模型的门槛、成本预计均将降低，利好后续应用场景进一步打开；2）头部和第二梯队模型厂商的竞争均较为激烈，竞争维度已经从模型能力延伸至价格、产品力、场景拓展、成本优化等，我们认为利好应用层。</p>\n  <h2><strong>其他值得关注的新闻：</strong></h2>\n  <p><a href=\"https://36kr.com/newsflashes/3903399623542657\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>工信部：将加快出台人工智能+软件行动方案</strong></a></p>\n  <p>7月20日，国务院新闻办公室举行新闻发布会，介绍2026年上半年工业和信息化发展情况。工业和信息化部新闻发言人、运行监测协调局局长陶青表示，软件是新一代信息技术的灵魂，是数字经济发展的重要基础，是制造强国、网络强国、数字中国建设的关键支撑。下一步我们将按照国家软件发展战略部署，持续增强关键软件产品和服务供给能力，加快出台人工智能+软件行动方案，推动软件开发智能化转型，软件产品及服务智能化升级和智能体软件新业态的培育，持续提升开源基础设施在项目孵化、供应链安全治理、新兴场景探索、海外市场落地等方面的能力，加快推动国家级人工智能开源社区成长为新兴技术的创新策源地和软硬件产品落地的重要场景。</p>\n  <p><a href=\"https://36kr.com/newsflashes/3903383107110785\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>我国人形机器人整机产品超全球半数</strong></a></p>\n  <p>工业和信息化部7月20日发布数据显示，上半年，我国一批具有国际竞争优势的产业加快壮大。智能机器人领域，我国研发的四足机器人占全球销量份额接近70%，人形机器人整机产品达400余款、超全球半数。人工智能、半导体、新能源、生物医药等领域，涌现一批全球独角兽企业，在国际标准研制、产业治理等方面积极贡献中国方案。</p>", "category": "tech", "published_at": "2026-07-20T10:22:28+00:00", "fetched_at": "2026-07-21T02:12:23.846761+00:00", "fingerprint": "e34cb401c7e817cf"}, {"source": "36氪 - 最新文章", "title": "8点1氪丨美国将对加拿大部分产品加征50%关税；任泽平回应会员炒股亏损千万；韩国今年人均GDP有望达3.9万美元", "url": "https://36kr.com/p/3904632333862535?f=rss", "summary": "<h2>今日热点导览</h2>\n  <p>光电融合芯片有望让Token成本降50%</p>\n  <p>泡泡玛特创始人王宁与投资人段永平纽约会面</p>\n  <p>阿根廷队背对领奖台无视对手领奖，拒绝接受采访，恐遭处罚</p>\n  <p>京沪高铁、京沪铁路可提前60天预约购票</p>\n  <p>强一股份大跌：分手费近60亿</p>\n  <h2>TOP3大新闻</h2>\n  <p><strong>美国宣布对加拿大部分产品加征50%关税</strong></p>\n  <p>当地时间7月20日，白宫发布公告称，美国将对加拿大部分产品额外加征50%的从价关税，以应对“加拿大在汽车及汽车零部件贸易方面对美国采取的歧视性措施”。据称，新关税将自美东时间8月19日凌晨00时01分起生效，并将在现有相关关税、税费及其他收费基础上叠加征收。（央视新闻）</p>\n  <p><strong>任泽平回应会员炒股亏损千万：没荐过股</strong></p>\n  <p>针对学员爆仓亏损1000多万引发的争议，“网红经济学家”任泽平再次做出回应。</p>\n  <p>7月20日，“泽平宏观”微信公众号发布《声明更新：实际情况、杠杆警示和几句心里话》一文称，对于一张关于个别加杠杆投资亏损的截图，进行了认真详细的核实，“该学员于2026年7月1日加入会员，7月8日首次参加课程学习，加入会员时间只有短短一两周。”声明中，表达了对该学员遭遇的惋惜和痛心。“但也必须实事求是地说：我们从不推荐个股，课程长期做的是宏观经济科普、产业趋势分析和投资方法论分享，强调长期主义。”（界面新闻）</p>\n  <p><strong>韩国今年人均GDP有望达3.9万美元，增幅7.6%</strong></p>\n  <p>得益于半导体旺季推动出口增加，韩国今年人均GDP有望大幅提升。综合韩国财政经济部、韩国银行和国家数据处19日的数据，今年韩国人均GDP有望达到3.9164万美元，同比增加2750美元，增幅为7.6%，增幅为2021年（11.5%）以来近5年之最。若韩元对美元年平均汇率低于1456.1韩元，届时韩国人均GDP有望迈入“4万美元时代”。（财联社）</p>\n  <h2>追踪WAIC</h2>\n  <p><strong>2026世界人工智能大会闭幕，预计达成超200亿元意向采购金额</strong></p>\n  <p>7月20日，2026世界人工智能大会暨人工智能全球治理高级别会议在上海闭幕。本届大会展览面积10万平方米，展品总数4486项，351款产品全球首发。接待全球重要采购团组177个，预计达成意向采购金额约203.6亿元，同比增长约25%。</p>\n  <p><strong>量坤科技携三大核心产品亮相WAIC 2026</strong></p>\n  <p>36氪获悉，日前，2026世界人工智能大会(WAIC2026)于上海正式开幕。量坤科技携旗下最新“量子xAlxHPC”异构智能计算平台登陆本届大会并主办“量超智融合论坛”。量坤科技创始人吕定顺博士于论坛期间发表“当量子计算遇见AI与HPC”主题演讲，并正式发布三款最新核心产品:国内首个量子智能体平台“量启AIAgent”，量子软硬件统一控制套件“fieldgkit”，以及材料科学数据智能预测平台“元材智库”。&nbsp;</p>\n  <p><strong>光电融合芯片有望让Token成本降50%</strong></p>\n  <p>当前，随着AI智能体在各行业的应用深入，Token的调用量一直保持着高速增长态势。记者在2026世界人工智能大会现场注意到，未来如何能让算力成本进一步下降，成为各方发力的重点。 业内人士介绍，他们正通过算力平台来协调多个主流大模型的使用，综合降低词元成本。同时，还在全国范围加快大规模算力集群的建设。而国产算力芯片支撑的超大规模算力集群，被业内视作是下一步降本的关键。&nbsp;</p>\n  <p>此外，未来三五年内，光芯片等更前沿的新技术落地，也有望成为降低算力成本的另一探索方向。“光电融合的芯片相比电芯片的话，核心在于它的计算延迟更低、功耗也会更低。每单位Token成本会相应下降50%，甚至更多。”（界面新闻）&nbsp;</p>\n  <p><strong>每刻深思携空间光计算方案亮相WAIC，并与科华数据达成战略合作</strong></p>\n  <p>36氪获悉，2026世界人工智能大会 （WAIC2026）期间，每刻深思创始人、董事长邹天琦携核心团队参会，并与阶跃联合参展并展出空间光计算核心技术成果。现场亮相的空间光计算芯片+大模型全栈融合方案，依托阶跃STEP3.7大模型完成实景推理加速演示，可有效降本提效、优化算力运行表现。展会期间，每刻深思与科华数据达成“算电冷协同”战略合作，聚焦UPS、液冷、异构算力协同等领域深化合作，推进绿色算力方案规模化落地。&nbsp;</p>\n  <h2>AI最前沿</h2>\n  <p><strong>腾讯WorkBuddy在国内PC端AI原生办公智能体市场6月单月访问量破2000万</strong></p>\n  <p>7月20日，最新发布的《2026年Q2中国办公智能体平台市场洞察报告》显示：腾讯WorkBuddy在国内PC端AI原生办公智能体市场6月单月访问量破2000万，保持市场第一领先优势。&nbsp;</p>\n  <p><strong>Kimi K3模型达全球Tier1，国产模型再现DeepSeek时刻</strong></p>\n  <p>36氪获悉，中信建投研报指出，坚定看好AI产业趋势。我们认为，K3是本周全球大模型行业的分水岭事件，也是另一个DeepSeek时刻：K3的发布意味着中国大模型第一次以“竞争威胁”身份进入全球大模型叙事——2.8万亿参数+100万上下文+Code Arena登顶，证明国产模型已在Agentic Coding主战场与美国前沿模型正面交锋。其他建议重点关注应用层机会：1）K3提升了开源模型智能水平，应用层使用tier1模型的门槛、成本预计均将降低，利好后续应用场景进一步打开；2）头部和第二梯队模型厂商的竞争均较为激烈，竞争维度已经从模型能力延伸至价格、产品力、场景拓展、成本优化等，我们认为利好应用层。&nbsp;</p>\n  <p><strong>鸿海首度夺下SpaceX AI服务器代工订单</strong></p>\n  <p>7月20日，据报道，鸿海精密首度夺下SpaceX AI服务器代工订单，下一步双方将瞄准太空AI资料中心。SpaceX计划向鸿海订购约1.3万个英伟达GB300人工智能服务器的机架，每个机架的成本预计为400万美元。鸿海预计将于今年第四季度开始发货，并持续到明年第一季度。（界面新闻、财联社）&nbsp;</p>\n  <p><strong>中国智能算力规模达2185EFLOPS</strong></p>\n  <p>7月20日，工业和信息化部信息通信管理局局长谢存在国新办新闻发布会上说，截至今年6月底，中国智能算力规模达2185EFLOPS，全国算力设施整体上架率达71.4%。近两年围绕国家算力枢纽节点建设超70条算力大通道，相关算力枢纽节点间网络性能提升10%。（第一财经）&nbsp;</p>\n  <h2>大公司/大事件</h2>\n  <p><strong>Kimi回应马斯克隔空宣战</strong></p>\n  <p>近日，中国AI公司月之暗面正式发布新一代开源大模型Kimi K3。发布后不久，特斯拉CEO马斯克便在一则相关评测报道下留言“令人印象深刻（Impressive）”，这是他继今年3月点赞Kimi底层架构技术报告后，第二次公开认可该团队。但赞赏余温未散，7月18日，马斯克便在社交平台宣布，旗下AI公司正在训练的2万亿参数新模型，将于下周完成初步训练，并称其全面优于1.5万亿版本，且“可能超越Kimi”。面对马斯克的隔空“宣战”， Kimi官方对记者道：欢迎马斯克加入“2万亿+俱乐部”。（北京日报）</p>\n  <p><strong>世界杯奖金出炉，冠军西班牙获5000万美元</strong></p>\n  <p>北京时间7月20日，2026美加墨世界杯决赛落幕，西班牙加时赛1：0战胜阿根廷，时隔16年第二次夺得世界杯冠军。国际足联（FIFA）公布的参赛球队将获得的奖金数额显示：冠军西班牙队可获5000万美元奖金；亚军阿根廷队可获3300万美元赛事奖金；第三名英格兰队可获2900万美元奖金；第四名法国队可获2700万美元奖金。排名第5至第8位的挪威队、瑞士队、摩洛哥队和比利时队可获1900万美元奖金；第9至16名球队奖金1500万美元；第17至32名球队奖金1100万美元；第33至48名奖金900万美元。据悉，本届世界杯共发放6.55亿美元的奖金，比2022年卡塔尔世界杯的奖金总额增长了50%。（界面新闻）</p>\n  <p><strong>泡泡玛特创始人王宁与投资人段永平纽约会面</strong></p>\n  <p>近日，知名投资人段永平在社交平台发布动态，于纽约与泡泡玛特(09992.HK)创始人王宁线下相聚。二人一同参观Labubu十周年全球巡展纽约站，在IP展品前参观合影；后续共同到场观看世界杯决赛，分别身着西班牙、阿根廷国家队球衣，佩戴Labubu足球主题挂件合照留念。段永平自今年起建仓泡泡玛特，目前为泡泡玛特第二大股东。（澎湃新闻）</p>\n  <p><strong>阿根廷队背对领奖台无视对手领奖，拒绝接受采访，恐遭处罚</strong></p>\n  <p>当地时间7月19日，2026美加墨世界杯随着决赛西班牙队1-0战胜阿根廷队而落下帷幕。然而，阿根廷队赛后多种表现引起广泛争议。比如，终场哨响，球场爆发混乱冲突，阿根廷球员帕雷德斯锁喉加西亚、抱摔加维，赛后被直接红牌罚下。在颁奖环节，西班牙队捧杯、西班牙队球员罗德里领取赛事金球奖时，阿根廷全队背过身去。也有球迷称，背对颁奖台是因为阿根廷全队当时正面向看台的球迷粉丝，以示安慰。据新华社报道，颁奖典礼后，阿根廷队全队没有接受任何混合采访区的采访，直接离开球场。面对上百名等待了数小时的记者，多名球员直接走向大巴车，一度引发骚乱。（中国新闻周刊）</p>\n  <p><strong>英国国王任命伯纳姆为新一任首相</strong></p>\n  <p>当地时间7月20日，英国执政党工党新任党首安迪·伯纳姆在白金汉宫与英国国王查尔斯三世会面，获国王任命成为新一任首相，并被授权组建新一届内阁。随后，伯纳姆将在首相府以英国首相身份发表首次讲话。（央视新闻）</p>\n  <p><strong>SpaceX将“星舰”第13次试飞推迟至7月23日</strong></p>\n  <p>当地时间7月19日获悉，美国太空探索技术公司（SpaceX）表示，计划于7月23日再次尝试发射“星舰”火箭。16日，太空探索技术公司原定当天进行的“星舰”第13次试飞在点火阶段因部分发动机未能启动而自动中止。这原本将是太空探索技术公司今年6月上市后的首次发射任务。太空探索技术公司在该试飞取消后市值一度蒸发约1000亿美元。（央视新闻）</p>\n  <p><strong>京沪高铁、京沪铁路可提前60天预约购票</strong></p>\n  <p>7月20日，京沪高铁、京沪铁路试点新增火车票预约购票服务，旅客可预约开车前第60天至第17天的车票。旅客可通过铁路12306手机客户端“预约购票”专区，预约开车前第60天至第17天的车票。铁路12306系统将于开车前第20天至第16天兑现预约订单。7月20日至8月29日为过渡期，可依次预约9月15日及以后的车票；8月30日起，可常态化预约开车���第60天至第17天车票。（界面新闻）</p>\n  <p><strong>强一股份大跌：分手费近60亿</strong></p>\n  <p>7月20日，受实控人离婚影响，科创板半导体公司强一股份股价大跌，截至发稿，公司股价跌超16%，报355.01元/股，总市值约458亿元。消息面上，7月17日晚间，强一股份（688809.SH）发布权益变动公告，披露公司控股股东、实际控制人、董事长周明与蒋春兰已正式办理解除婚姻关系手续，并按照离婚协议进行股权分割，这距离公司上市仅200天。按照公告前一交易日收盘价测算，本次分割的股权对应市值约59.5亿元，接近60亿元，成为2026年以来A股市场金额最高的实控人离婚案例。（界面新闻）</p>\n  <p><strong>港交所回应考虑延长股票交易时间</strong></p>\n  <p>市场传闻称“香港交易所考虑延长股票交易时间，取消午休时段”，对此，港交所回应称，香港交易所一直致力于提升香港作为国际金融中心的竞争力，目前正在研究包括延长交易时段在内的多项提升市场便利性的措施，但当前首要工作是研究延长衍生产品市场交易时段的建议，而不是股票交易时间。（中新经纬）</p>\n  <p><strong>波音预计未来20年全球民航服务市场规模达4.9万亿美元</strong></p>\n  <p>波音公司7月18日发布报告称，未来20年全球民航服务市场规模预计将达到4.9万亿美元，同时行业将需要新增超过240万名民航专业人员，以支持机队扩张和航空业发展。报告预计，到2045年前，全球民航业将需要新增约67.4万名飞行员、72.8万名维修技术人员和102.3万名客舱乘务人员。其中，约三分之二的人才需求用于替代退休人员，另外三分之一用于支持全球机队增长。（界面新闻）</p>\n  <p><strong>马斯克称特斯拉FSD会模仿驾驶风格</strong></p>\n  <p>7月20日，埃隆·马斯克已确认特斯拉FSD（Full Self-Driving）软件正在从过去的“通用型、一套方案适用于所有用户”的驾驶系统，转变为真正的个性化驾驶系统。近日，一名特斯拉FSD用户在X平台上抱怨，车辆经常会在不该离开的位置驶出高载客车道或快速车道，主动退出左侧高效车道后进入拥堵车流，而旁边最左侧车道上的车辆仍然畅通无阻，非常令人烦恼。对此，马斯克回应称:“车辆将开始记住你具体的人工干预行为，并根据每个人的个人偏好进行调整。”（新浪财经）</p>\n  <p><strong>小龙坎火锅被罚</strong></p>\n  <p>近日，山东省市场监管局发布食品安全典型案例，枣庄薛城区一家小龙坎火锅店因多道菜品存在虚假、引人误解的商业宣传，违反了《中华人民共和国反不正当竞争法》第九条的规定，因此对当事人作出行政处罚。另据国家企业信用信息公示系统，该门店被罚款3000元整。官方通报显示，今年4月，枣庄市薛城区市场监管局对薛城区小龙坎火锅店进行执法检查，发现店内宣传牌、点餐页面宣称“鲜切牛嫩肉”“鲜切牛肥拼”“鲜切牛板腱”的菜品，所用食材均为速冻调理肉制品而非鲜牛肉；当事人宣称 “草原肥牛” 的菜品，所用食材的产地为山东省滨州市；当事人宣称 “养生乌鸡卷” 的菜品，所用食材为鸡肉乌鸡的混合肉卷（食品标签配料表首位为“鸡肉”）。（界面新闻）</p>\n  <p><strong>欧洲柴油告急，裂解价差飙至历史新高</strong></p>\n  <p>摩根士丹利指出，受多重重大供应挑战同时叠加影响，欧洲正深陷柴油供应紧张局势，地区炼油利润率刷新历史纪录，库存水平则持续下滑。据其观察，西北欧地区的柴油炼油利润——即裂解价差——已飙升至创纪录水平。当地库存预计将从8月起持续减少，到11月将降至约2.99亿桶的低点，这将是自2015年以来同期最低水平。（财联社）</p>\n  <p><strong>胜宏科技：拟155.94元/股价格授予不超486.24万股限制性股票</strong></p>\n  <p>36氪获悉，胜宏科技发布2026年A股限制性股票激励计划草案，拟向激励对象授予不超过486.24万股限制性股票，约占公司股本总额的0.49%。其中首次授予466.24万股，授予价格为155.94元/股，激励对象总人数为1545人，包括中层管理人员及核心技术（业务）骨干。业绩考核目标为：以2025年为基数，2026年净利润或营收增长率不低于40%（基准）或50%（目标），2027年不低于96%或125%，2028年不低于174.40%或237.50%。</p>\n  <p><strong>花旗：下调韩国股票评级，上调中国股票评级</strong></p>\n  <p>7月20日消息，花旗在新兴市场资产配置中将韩国股票评级从“高配”下调至“战术性中性”，同时将中国股票评级上调至“高配”，理由是韩国市场交易动荡，而随着今年由少数人工智能赢家主导的涨势有望向更广泛板块扩散，中国市场可能从中受益。花旗策略师在报告中写道，“如果宏观环境继续保持有利，包括地缘政治风险缓和，则存在范围扩大的空间”。（第一财经）</p>\n  <p><strong>摩根士丹利成为华尔街AI债务交易头号银行</strong></p>\n  <p>摩根士丹利已崛起为华尔街构建人工智能（AI）繁荣背后融资架构的主导力量，设计了新的债务和股权融资模式，为数据中心的大规模建设输送数百亿美元资金。据业内高管称，自去年以来，该行已成为主导顾问，牵头了规模最大、最具创新性的AI基础设施融资交易。（新浪财经）</p>\n  <p><strong>本田与广汽签署合资续约协议</strong></p>\n  <p>36氪获悉，本田中国宣布，7月，本田与广汽就双方旗下广汽本田汽车有限公司合资合作项目正式签署战略：续约协议，在股比保持不变的同时将合作期限延长至2038年。</p>\n  <p><strong>美股三大指数集体收跌，热门中概股集体走强</strong></p>\n  <p>36氪获悉，7月20日收盘，美股三大指数集体下跌，纳指跌0.05%，标普500指数跌0.19%，道指跌0.59%。大型科技股涨跌不一，特斯拉、苹果跌超2%，Meta小幅下跌；英特尔、微软涨超2%，谷歌、亚马逊涨超1%，英伟达小幅上涨。热门中概股集体走强，阿里巴巴涨超4%，京东、爱奇艺涨超3%，拼多多、网易、哔哩哔哩涨超2%，小鹏集团跌超2%，蔚来跌超1%。</p>\n  <h2>上市进行时</h2>\n  <p><strong>长江存储IPO提速，31人超配团队完成首期辅导</strong></p>\n  <p>继长鑫科技（688825.SH）7月中旬启动新股申购后，国产存储另一龙头长江存储的IPO进程也驶入加速通道。近日，证监会官网最新披露的辅导进展显示，中信证券（600030.SH）与中信建投（601066.SH）联合担任辅导机构的长江存储已完成首期辅导工作，两家券商合计派出31人的超规格团队进场，规模与长鑫科技IPO时的34人辅导阵容基本持平，侧面印证了项目的复杂度与战略级重要性。国产存储“双子星”先后冲刺资本市场，标志着国内半导体核心资产的证券化进程正在全面提速。&nbsp;</p>\n  <h2>投融资</h2>\n  <p><strong>AI软件开发平台Emergent以15亿美元估值完成C轮融资</strong></p>\n  <p>7月20日，AI软件开发平台Emergent宣布完成1.3亿美元C轮融资。本轮融资由Creaegis领投，MNIVentures-Claypond Capital和Sentinel Global联合领投, Khosla Ventures、SoftBank Vision Fund 2、Lightspeed和YCombinator参与投资。经过最新一轮融资，Emergent估值达到15亿美元，在公开发布后一年内跻身独角兽行列。（新浪财经）</p>\n  <p><strong>Meshy完成近4亿美元B轮融资</strong></p>\n  <p>36氪获悉，Meshy今日宣布完成近4亿美元B轮融资，投后估值超过100亿元人民币。本轮由IDG资本、经纬中国、Monolith砺思资本等投资机构和战略投资方共同投资，GraniteAsia、红杉中国、BAI资本、源码资本等现有股东超额跟投，持续加注。这是AI3D领域迄今规模最大的单轮融资，刷新单轮规模与估值两项纪录。本轮融资将主要用于AI多模态模型研发与全球市场拓展。</p>\n  <p><strong>“博顿光电”完成超亿元人民币B+轮融资</strong></p>\n  <p>36氪获悉，“博顿光电”完成超亿元人民币B+轮融资，本轮投资方为毅达资本、中信建投资本、达武创投、友谊时光、南控基金，IO资本担任独家财务顾问。该轮资金将用来引进高端人才、研发新产品，以及针对已经出现爆发趋势的重点行业领域，加快在综合解决方案、市场推广以及产能建设方面的投入速度。</p>\n  <p><strong>“Soloco\"完成千万元级人民币种子轮融资</strong></p>\n  <p>AI原生组织的操作系统“Soloco”近日完成千万元级人民币种子轮融资，本轮融资由原子创投领投，融资资金将主要用于人才引进与核心产品研发。据了解，公司核心团队来自NASA、华为、字节跳动等机构和企业，以及哥伦比亚、港大、牛津、清华等高校，覆盖图论、多Agent编排、AI基础设施等方向。产品将率先切入本地化0人公司运行场景。</p>\n  <h2>酷产品</h2>\n  <p><strong>宇树UnifoLM-OminiA-0.3发布，支持全模态交互理解</strong></p>\n  <p>36氪获悉，7月20日，宇树科技发布宇树UnifoLM-OminiA-0.3，单模型统筹家居康养多任务，支持全模态交互理解，全程自主，稳定执行抗干扰。&nbsp;</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260721/v2_3b818d78d19c474c8d371a2785b9d601@5667365_oswg265729oswg630oswg478_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">宇树科技发布宇树UnifoLM-OminiA-0.3</p>\n  <p><strong>整理</strong>｜王倚轩&nbsp;</p>", "category": "tech", "published_at": "2026-07-20T23:59:54+00:00", "fetched_at": "2026-07-21T02:12:23.846755+00:00", "fingerprint": "2b1eb42419f7f98d"}, {"source": "36氪 - 最新文章", "title": "「月泉仿生」获数亿元融资，仿生拉压体灵巧手万台量产、订单过亿｜36氪首发", "url": "https://36kr.com/p/3899174356387718?f=rss", "summary": "<p>文｜胡香赟</p>\n  <p>编辑｜海若镜</p>\n  <p>36氪独家获悉，近日，月泉仿生已完成数亿元Pre-A+轮融资。本轮融资由长发基金、华控基金、华夏基金、国力民生、星科创投基金等联合投资，老股东中关村启航投资跟投。</p>\n  <p>据介绍，本轮募集资金将用于月泉仿生团队建设、核心产品技术研发及产能提升，以及强化全栈自研能力、打造完整技术体系，推动超仿生神经骨骼肌肉机器人研发, &nbsp;打造“大脑-身体-环境”一体化的仿生具身智能体系。</p>\n  <p>当前，人形机器人赛道已走过最初的样机展示阶段，逐渐迈入商业化落地的关键拐点。而灵巧手作为机器人和现实世界交互的核心部件，更是成为资本重点押注的核心方向。仅今年一季度，国内灵巧手类企业融资总额就接近50亿元。</p>\n  <p>喧哗背后，某种程度上，灵巧手产品也在陷入比拼自由度、扭矩等硬件参数的“内卷”状态。传统刚性结构很难同时兼顾轻量化、抓取力量和操作精度，面对柔软、易损的物体时，天生就显得“笨拙”。但通常，想做到精细操作就要牺牲负载能力，提升耐用性又会大幅抬高成本，因此始终困在性能、成本、可靠性难以兼顾的矛盾中。</p>\n  <p>想要真正打破现有瓶颈，就需要在底层机械结构上重新进行设计。因此，拥有原创仿生底层技术、实现软硬件全链条自研的企业，或将成为下一阶段产业发展的核心力量。</p>\n  <p>月泉仿生正是其中的代表性企业之一。月泉仿生依托教育部长江学者、英国曼彻斯特大学终身教授任雷教授提出的“<a href=\"https://36kr.com/p/2410406638134274\" rel=\"noopener noreferrer\" target=\"_blank\">仿生拉压体机器人理论与技术</a>”完成科研成果转化。通俗来讲，这套仿生拉压体技术完全模仿人体骨骼、肌肉、韧带协同工作的逻辑，硬质构件主要承担压力、柔性构件主要承担拉力，借此基础理论级创新从根源上改变传统机器人的运动逻辑。</p>\n  <p>依托这套原创底层技术，月泉仿生已搭建起覆盖自研空心杯电机、人工肌肉模组、仿生灵巧手、人形机器人整机和世界-行为大模型的全栈自研产品矩阵。现阶段，公司已推出四大核心产品线，并于近日的2026世界人工智能大会暨人工智能全球治理高级别会议（WAIC）上亮相：</p>\n  <p>首先是主打轻量化仿生操作的“应手Y-Hand”系列仿生拉压体灵巧手。这是月泉仿生的旗舰仿生灵巧手产品线，主打贴近真人手部的柔顺仿生灵巧操作，有助于缓解传统机器人手“有力就僵硬、轻巧就无力”的问题。</p>\n  <p>该系列分M1轻量化款和M2超高自由度旗舰款两款。其中，Y-Hand M1在今年7月初刚刚发布。这款产品掌部重仅299.7g，重量还不及一罐可乐，但整手集成26个自由度、五指抓握力可达到200N。在WAIC展台互动区，Y-Hand M1展示了拿起和放下矿泉水瓶、扳手等物品的功能；对于玩具布偶类柔软物品，Y-Hand M1也能通过指尖轻触、柔性抓取、无损夹持来完成操作，未将物品捏变形。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_27510b874601408eb59e84826cef0a0f@5930287_oswg643969oswg907oswg721_img_jpg?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">月泉仿生在WAIC上展出Y-Hand M1</p>\n  <p>当前，行业内部分灵巧手产品虽在不断堆砌总自由度，却往往只给拇指分配3-4个关节，导致精细操作能力受限。相较之下，Y-Hand M1选择为拇指配置8个自由度，匹配人体生理特性，浮现人手一根拇指就能“支撑起手部近一半的操作能力”，可完成对心捏、对掌、包络抓取等绝大部分类人灵巧操控。</p>\n  <p>另一款应手Y-Hand M2则具备38个自由度。月泉仿生方面提供的数据称，目前，Y-Hand M2是“全球自由度最高的仿生灵巧手”，在速度、力量、灵活、柔顺等维度上的表现“趋近人手水平”。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_bf22f15b1c034f00af9c5cca9bdaac22@5930287_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">Y-Hand M2</p>\n  <p>与走高度仿生路线的“应手Y-Hand”系列形成差异化定位，“信手X-Hand M1”则是一款面向标准化工业场景的刚性灵巧手，主打工厂高强度流水线作业，最大可实现50kg负重、循环使用寿命可达百万次。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_dd714ca0a03540849d4fa1bb9b8f2965@5930287_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">信手X-Hand M1</p>\n  <p>第三类产品线“YQ Motors系列电机”是公司旗下所有灵巧手的“专属动力心脏”，覆盖4–22mm全尺寸7个系列，且全部核心驱动部件实现国产自研。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260717/v2_687b7ad1e71d4dfb9cf9936eeee33df4@5930287_oswg1451725oswg2933oswg1345_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">YQ Motors系列电机</p>\n  <p>最后则是轮式人形整机代表“博文W-Bot 2.0”，它搭载0.238㎡的小底盘，这种设计使其能进驻传统大型机器人无法进入的工位。仿人髋-膝-踝三折叠结构赋予“博文W-Bot 2.0”蹲下站起的能力，使其工作空间覆盖距离地面0-2.2m。搭配自研仿生手与电机整套方案，可实现从移动、抓取到作业的一体化无人解决方案，适用于工厂自动化装配、仓储物流分拣、机房设备巡检、展厅智能接待等场景。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_d361115411d6432bbc50b5cadb7c644c@5930287_img_gif?x-oss-process=image/quality,q_80\" /></p>\n  <p class=\"img-desc\">博文W-Bot 2.0</p>\n  <p>从应用角度，当前，灵巧手行业已逐步从实验室走向规模化量产的阶段。从出货量维度，高工产业研究院（GGII）预计，2026年，中国灵巧手产品全年销量有望突破7万只。</p>\n  <p>在这方面，月泉仿生也已提前进行了产线布局。月泉仿生CTO赵迪曾对外介绍称，公司在设计之初就已经在同步规划量产路径，“核心零部件具备直接切换量产的能力”。目前，公司位于北京昌平的生产基地已在建设中。</p>\n  <p>商业化层面，月泉仿生已面向智能制造、仓储物流、巡检运维、医疗健康、家政服务等多个场景输出全栈解决方案，累计取得过亿元订单。</p>", "category": "tech", "published_at": "2026-07-21T00:00:00+00:00", "fetched_at": "2026-07-21T02:12:23.846748+00:00", "fingerprint": "f2b6e90c7b681e45"}, {"source": "36氪 - 最新文章", "title": "速腾聚创第二代全固态感知平台发布，要做物理AI数据入口｜最前线", "url": "https://36kr.com/p/3903885834028931?f=rss", "summary": "<p>&nbsp;作者｜黄楠</p>\n  <p>编辑｜袁斯来</p>\n  <p>当下具身智能赛道正完成一轮关键转型。此前行业大量研发、展示集中在人形、四足机器人舞台演示，如今产业评判标准落地到工厂、园区、家庭等真实场景的长期稳定作业能力。</p>\n  <p>但一个现实的问题是：多数基础模型仅依托二维图像、仿真虚拟数据训练，缺少真实三维空间里物体距离、材质、受力、动态交互的原生高精度信息，以至于机器人只能看懂画面，却难以真正理解物理世界的运行规律。</p>\n  <p>单纯视觉传感器易受强光、遮挡、雨雪干扰，测距与空间结构测算存在天然误差；仿真环境构建的物理规则和现实工况差距巨大，直接导致机器人走出展厅后，复杂抓取、长时序巡检等任务成功率走低，始终难以规模化落地。这当中，激光雷达仅被视作机器人配套导航配件，承担单一避障功能。</p>\n  <p>直到业界开始意识到，高精度三维感知才是物理AI持续迭代的核心数据来源。</p>\n  <p>速腾聚创试图提出了不同的判断。速腾聚创团队指出，高精度三维感知硬件不只是让机器人“看见”世界的眼睛，更是物理AI运作不可或缺的数据源头；想要打通“感知-理解-决策-迭代”完整闭环，必须从底层芯片重构空间数据的生成逻辑，源源不断输出可用于模型持续进化的真实物理信息。</p>\n  <p>7月17日至20日，2026世界人工智能大会（WAIC 2026）在上海举办。RoboSense速腾聚创正式发布��于自研“孔雀”SPAD-SoC芯片的第二代全固态感知平台E2，系统展示从底层芯片到空间感知产品的技术布局。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_aabfeab3c9974285ab171f9ac1f1db98@6022551_oswg4419829oswg4064oswg2712_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">第二代全固态感知平台E2（图源/企业）</p>\n  <p>E2平台基于自研超大面阵SPAD-SoC“孔雀”芯片与2D VCSEL芯片，采用全固态架构，从信号收发到数据处理均在芯片层面完成。相比上一代产品，E2系列具备更广的视场角，最高精度是前代的3倍，由此产生的高精度空间感知数据来支撑机器人在复杂环境中的精准操作。</p>\n  <p>瞄准家庭、工业、巡检等复杂场景，E2已在割草机器人、人形机器人、四足机器人、无人机等产品在落地，并拿下庭院机器人、智能硬件及消费电子等企业的合作订单。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_f4f0ff2465d3405fa53cb35fa1b4c67b@6022551_oswg600458oswg828oswg466_img_png?x-oss-process=image/quality,q_90/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">E2已进入规模化应用阶段（图源/企业）</p>\n  <p>物理AI所需的数据与互联网时代的文本、图像数据有着本质差异。速腾聚创市场总监谢阗地在公开采访中指出：“传统的视频数据对于具身大模型来说，其实是相对粗糙的。它需要更完整的空间数据结构，需要更精确的深度信息，这对传感器提出了极高的要求。传统的单摄像头或者普通视频素材可能就不够用了。”</p>\n  <p>具身智能走向实际应用的过程中，机器人的生产力不仅依赖智能模型和本体，更依赖于真实世界中持续产生的高质量空间数据，并将其转化成机器人能够学习和复用的训练材料。</p>\n  <p>“所有公司在做物理AI时，最终都意识到需要准确的深度信息，才能让机器人理解现实世界，理解前后左右的结构关系。”谢阗地表示。高质量空间数据，也因此成为物理AI时代的关键生产要素。</p>\n  <p>基于自研三维空间探测芯片和数字化感知产品矩阵，速腾聚创要做的不仅是“机器人之眼”，更是一套连接真实世界与智能模型的数据入口。</p>\n  <p>WAIC 2026期间，速腾聚创宣布将与智在无界、简智机器人、Origen、光轮智能等企业合作，聚焦机器人空间感知、真实世界数据采集、数据处理、模型训练及应用验证等环节，构建物理AI感知基础设施。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_7f1f198c1f524cf6b2e5d3f0f05a9265@6022551_oswg4623521oswg3532oswg2344_img_jpg?x-oss-process=image/quality,q_80/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">速腾聚创WAIC 2026展台（图源/企业）</p>\n  <p>面向具身智能迈向规模化应用的关键阶段，速腾聚创正围绕自研芯片、AI数据闭环与车规级量产三大核心能力，搭建面向物理AI时代的机器人技术平台。</p>\n  <p>芯片是感知技术持续迭代的基础。不同于行业普遍外购分立元器件拼凑传感器的模式，速腾聚创选择 SPAD-SoC 全栈自研路线。自研“孔雀”芯片作为标准化数字化感知底座，能够在芯片设计源头就统一定义探测精度、点云输出规格，从底层规避分立器件组合带来的性能损耗。</p>\n  <p>AI融合层面，在产品和芯片设计初期，速腾聚创就瞄准了物理大模型对高精度空间数据的采集需求。各类机器人在搭载其感知设备后，移动、抓取作业等过程都会同步生成数据资产并用于模型迭代，为物理AI能力迭代提供高质量训练素材。</p>\n  <p>从提供机器人的“眼睛”，到成为物理AI的数据入口，速腾聚创正在从硬件供应商向基础设施服务商迁移。在物理AI走向规模化的进程中，谁能率先解决高质量空间数据的供给问题，谁就可能占据产业链上一个更基础的位置。</p>", "category": "tech", "published_at": "2026-07-21T01:05:00+00:00", "fetched_at": "2026-07-21T02:12:23.846740+00:00", "fingerprint": "8fc46b087ef2d80d"}, {"source": "36氪 - 最新文章", "title": "6000万用户的情感陪伴APP，营收数亿后做了款家庭机器人｜产品观察", "url": "https://36kr.com/p/3904049563731849?f=rss", "summary": "<p>作者&nbsp;|&nbsp;黄楠</p>\n  <p>编辑&nbsp;|&nbsp;袁斯来</p>\n  <p>在旗下App每年创造数亿元营收、日均百万用户打开量的时候，心言集团创始人兼CEO任永亮做了一个令所有人都觉得“不理性”的决定：把AI情感陪伴能力塞进一个硬件的模具里——造机器人。</p>\n  <p>心言集团最有名的产品叫测测，来自上一个互联网时代，2013年上线，主要为用户提供泛心理科普及测评、在线情感陪伴，拿过腾讯的B轮融资。到2025年，测测已经有6000多万用户。</p>\n  <p>但仅仅靠一款12年的线上情感陪伴产品，显然无法在这个AI时代更进一步。任永亮察觉到线上交互模式存在不可弥补的能力边界。</p>\n  <p>屏幕对话是单向、割裂的沟通形式，难以捕捉物理三维信息，无法满足亲子陪伴、老人情绪安抚、居家日常互动等复合需求。而纵观市面上主流的智能终端，或交互门槛过高、或仅具备简单卖萌功能，始终缺少能自主读懂家庭氛围的具身载体。</p>\n  <p>这种缺位，让任永亮看到了情绪交互硬件的窗口期。当行业还在比拼仿生关节与表演动作时，他认为家庭场景真正需要的是一个能读懂氛围、知进退的具身载体提供情感“在场”。</p>\n  <p>近日，心言集团家庭主动智能陪伴机器人巴布（Buboo 1）在WAIC 2026上首次开启线下互动体验。</p>\n  <p>展台现场，没有嘈杂的语音触发演示，参展用户只是驻足旁观，巴布便会主动缓步靠近，轻声搭话；待对方抬手示意结束互动，它又安静退回角落，回归待机状态。全程无需唤醒词，便可完成了数轮察言观色式的自然交流。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_ec97ea3c5afd460b825d2cb77d0be2e4@6022551_oswg58089oswg1080oswg719_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">家庭主动智能陪伴机器人巴布Buboo 1（图源/企业）</p>\n  <p>任永亮判断，行业正处于从“演示型电子玩具”向“具备在场感的家庭智能体”跨越。下一阶段竞争，将是多模态主动感知能力、垂直居家场景的原生数据积累，以及长期情感记忆模型的搭建。</p>\n  <p>目前，市场上未曾真正跑通一款成功的家庭机器人。在这个还没有标准答案的赛道上，巴布正试图回答，当AI终于有了身体，它该如何回应人类的情感需求？</p>\n  <h2><strong>主动式交互机器人</strong></h2>\n  <p>要读懂巴布，首先要厘清它和大部分消费级机器人的属性分野。</p>\n  <p>智能音箱、桌面级AI宠物、各类毛绒陪伴玩具等等，多数产品遵循同一套交互逻辑：依靠用户的唤醒词触发，机器听到对应指令应答。这套模式适配于智能手机、车载等碎片化使用场景，而一旦落地需要全天候驻守的家庭空间后，问题便迅速暴露，若是用户忘记充电、懒得出声或希望独处时，设备就会被长期搁置，最后沦为积灰的摆件。</p>\n  <p>巴布试图跳出这套触发框架。</p>\n  <p>“我们第一个目标就是先把唤醒词去掉，让机器人能主动发起交互。”心言集团创始人兼CEO任永亮告诉硬氪，“当它觉察到用户的面部神态、肢体动作，乃至空间距离的变化等等，都是巴布可读取的有效输入信号，系统会自主判断当下情境并给出反馈。”</p>\n  <p>但这个“主动式交互”存在一个关键限定，它不是无差别频繁搭话，而是会匹配不同用户的相处偏好，依托端侧记忆模型动态调整交互频率。</p>\n  <p>当如果用户跟巴布说“想要休息”时，其交互场景会被系统记录下来，在后续识别到相似状态时，巴布会主动降低搭话的概率。在任永亮和团队看来，这种分寸感是家用机器人的必备能力：全天候居家设备如果不分场景频繁发声、灯光弹窗，只会给用户持续制造心理负担，“它必须懂得适时静默，才能更好地掌握好互动边界。”任永亮说。</p>\n  <p>这种对交互边界的精细化设计，也确定了巴布的角色定位，成为一个能读懂情绪、懂得适时在场与退场的家庭新伙伴。</p>\n  <p>反映在产品外观层面，巴布整机为全圆角无尖锐棱角设计，外层覆盖亲肤毛绒面料，搭配大尺寸拟人眼部造型。它的高度为65厘米，这并非随意设定的参数，而是团队测算出认为最优的居家机身尺寸。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_87f0975a47fb4f7b8b06c99216375852@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">主动式交互（图源/企业）</p>\n  <p>任永亮解释称，65厘米的高度刚好匹配3岁孩童的平视视野，若机身过低，地面杂物、低矮家具会持续遮挡视觉画面，机器人采集到的环境信息完整性将大打折扣；而随着直立机身带来全域观测视野，机器人对环境、人物的空间判断力也能得到有效提升。</p>\n  <p>与此同时，任永亮认为，让机器人“看见”物理世界还远远不够，它还需要一个足够聪明的“大脑”来理解眼前正在发生什么——家里谁是主人、什么时候来了客人，孩子的笑是因为开心还是调皮，老人沉默是因为疲惫还是情绪低落。而这些问题的复杂度，远非一个通用大模型外加一套语音接口就能解决。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_b139dc51bbb54526a588e13ca8115118@6022551_oswg83359oswg1080oswg583_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">高65厘米，可匹配3岁孩童的平视视野（图源/企业）</p>\n  <p>基于测测十余年积累的万亿级情感语料，心言集团自研的心元大模型为巴布构建了一套三层递进的技术底座。</p>\n  <p>最底层是心元大语言模型，集成了Multi-Agents、RAG检索与长周期记忆模块。它的核心任务不是知识问答，而是理解语境，比如用户语气急促与否、反复提到同一个词的原因等等，而这些素材是传统无法从公开语料里学到的场景Context（上下文）。</p>\n  <p>中间层是心元多模态大模型，覆盖视觉推理、远近场语音识别与拟人语音合成，负责将机器人捕捉到的画面、声音、距离信息翻译成模型能理解的语义信号。</p>\n  <p>最上层是心元xyVLA具身模型，打通从“看到—理解—行动”的完整链路。一个代表性的场景是，当孩子拿着画冲到巴布面前一言不发，xyVLA层先调动视觉模块识别画作内容，再调用语言模型生成鼓励类对话，最后通过运动控制模块让巴布歪头、靠近、用拟人语音输出反馈，整套动作在几秒内连贯完成。</p>\n  <p>“很多人以为让机器人开口说话很容易，”任永亮说，“但什么时候开口、对谁开口、输出内容是否贴合当下场景，才是行业普遍难以攻克的技术难点。”</p>\n  <p>而心元模型体系与主流通用大模型的本质区别在于：通用模型仅依托线上文字语料训练，缺少居家实景、面部微表情、肢体动作等三维上下文；而巴布模型原生适配家庭真实环境，能同步读取画面、情绪、空间信息再完成对话输出，补齐了LLM落地居家场景的短板。</p>\n  <h2><strong>家庭物理AI终端</strong></h2>\n  <p>心言集团官方数据显示，测测App有6000多万注册用户，其中八成是女性，每天超百万人打开查看情绪状态。这款产品已为母公司带来每年数亿元营收和持续盈利。</p>\n  <p>自心言机器人业务立项以来，不少声音疑惑，一家专注线上情感服务并实现稳健营收的互联网企业，为什么会选择跨界投入高成本自研硬件。</p>\n  <p>但任永亮观察到，一条清晰的用户生命周期曲线是，用户一旦步入婚姻、组建家庭，其App的打开使用频次和在线时长就会明显下滑。</p>\n  <p>然而，恋爱阶段的情绪倾诉需求被线上满足了，但用户婚后的陪伴缺口、育儿焦虑、代际沟通障碍、独居老人等线下场景存在的情感痛点，是手机端的文字交互模式完全无法覆盖的。</p>\n  <p>“线上智能体解决的是一对一的倾诉需求，但家庭场景需要的不是倾诉对象，而是能够参与日常、感知情绪、承接细腻情感需求的具身载体。”任永亮说，“这也是我们研发巴布的核心原因——它是对测测产品的用户生命周期的一次自然物理延伸。”</p>\n  <p>心言将多年积累的情绪感知、心理疏导、关系洞察等情感理解能力，从虚拟空间迁移至一个可全天候驻守家庭的物理AI终端，让其真正进入到用户的线下生活空间；搭配测测App产品，覆盖用户从恋爱到成家的全阶段情感需求。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_5abdf9a60ef945f2876274c38169f824@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">深度情感理解能力（图源/企业）</p>\n  <p>基于家庭物理AI终端的定位，当前巴布主要围绕三类真实居家场景搭建功能。其一是松弛化语言陪伴，区别强任务导向的K12教育硬件，为低龄儿童语言启蒙、常态化亲子对话提供无压力家庭外语交流环境。</p>\n  <p>第二个功能是长效情绪慰藉，它搭载了测测所积累的情感陪伴能力、情绪识别技术，主要面向职场父母和独居老人，缓解职场人士在育儿陪伴缺失方面造成的亲子关系疏离、老年用户的认知退化和社交孤立等痛点。</p>\n  <p>第三是提供轻量化AI影像记录功能。用户只需要挥手就能触发拍摄，照片会自动转为漫画风格同步推送至相应App；所有图像数据均在本地完成处理，充分保护家人肖像隐私。</p>\n  <p>此外，在用户外出期间，机器人还会自主捕捉居家场景中老人、孩童、宠物的趣味画面同步推送，缓解用户离家后的焦虑情绪。</p>\n  <p class=\"image-wrapper\"><img src=\"https://img.36krcdn.com/hsossms/20260720/v2_adb9bb4059fe4d2dbba134e24e441423@6022551_img_000?x-oss-process=image/format,jpg/interlace,1\" /></p>\n  <p class=\"img-desc\">远程画面同步推送（图源/企业）</p>\n  <p>2026年被业内视为具身智能的“分化之年”。WAIC 2026展台上，行业清晰地分化出两大路径，一条面向工厂产线、物流仓储等生产力场景；另一条聚焦家庭场景，强调情感陪伴与多代际沟通。后者正处于从玩具到富有“生命感”具身终端跨越的拐点。</p>\n  <p>如果说测测App解决的是“被理解”的需求，巴布试图回应的，则是用户“被陪伴”的渴望。这条路线看似跳脱，实则在面向一个更本质的问题：在原子化社会日益加深的今天，在家庭的情感缝隙中，用物理形态实现可触碰、高质量、可持续的在场。</p>", "category": "tech", "published_at": "2026-07-21T01:30:00+00:00", "fetched_at": "2026-07-21T02:12:23.846725+00:00", "fingerprint": "f305cea5b8fd4de2"}, {"source": "少数派", "title": "2026 年再看 iPhone 8 Plus，它还够用吗？", "url": "https://sspai.com/post/112425", "summary": "高考结束后，又有一大批同学开始考虑换新手机啦。在预算差不多的情况下，很多人会纠结是买一台较新的中端机，还是买一台年份更老、但曾经是旗舰级的机型。于是我把 2020 年购入的 iPhone 8 Plus 拿出来当了一星期主力机，看看这台 2017 年发布的手机，放到今天还能不能胜任日常使用。<a href=\"https://sspai.com/post/112425\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-20T03:00:00+00:00", "fetched_at": "2026-07-21T02:12:20.500068+00:00", "fingerprint": "7b1c60f5b67e505d"}, {"source": "少数派", "title": "角落新声 | 把杂乱桌面收拾得像样，只需要一张桌垫", "url": "https://sspai.com/post/112453", "summary": "在拥有你我理想的超大自主空间之前，不如用一张桌垫改善一下自己的工作生活环境，过得多舒心一点点吧。<a href=\"https://sspai.com/post/112453\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-20T07:05:31+00:00", "fetched_at": "2026-07-21T02:12:20.500061+00:00", "fingerprint": "a60574bedcc9b341"}, {"source": "少数派", "title": "派评 | 近期值得关注的 App", "url": "https://sspai.com/post/112543", "summary": ">下载少数派2.0客户端、关注少数派公众号，解锁全新阅读体验📰>实用、好用的正版软件，少数派为你呈现🚀<a href=\"https://sspai.com/post/112543\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-20T10:00:02+00:00", "fetched_at": "2026-07-21T02:12:20.500054+00:00", "fingerprint": "642d44477cde3dc1"}, {"source": "少数派", "title": "派早报：京沪高铁与京沪铁路试点提前 60 天预约购票等", "url": "https://sspai.com/post/112565", "summary": "少数派的近期动态那个让你放松娱乐、拥抱心流、逃离纷扰或找回真我的角落，是如何构建起来的？「角落新声」征文活动火热征稿中少数派×AKKO灵犀Linx68键盘预售开启。看看新键盘你可能错过的文章2026年 ...<a href=\"https://sspai.com/post/112565\" target=\"_blank\">查看全文</a>", "category": "tech", "published_at": "2026-07-21T00:02:09+00:00", "fetched_at": "2026-07-21T02:12:20.500043+00:00", "fingerprint": "4267cb1040f6fcd1"}, {"source": "澳元兑人民币 (AUD/CNY)", "title": "1 AUD = 4.7415 CNY ↑+0.30%", "url": "https://www.frankfurter.app/2026-07-20?f
